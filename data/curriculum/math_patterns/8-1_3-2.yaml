unit:
  grade: 8
  semester: 1
  code: 3-2
  title: 利用十字交乘法因式分解
  other_titles:
  - 利用十字交乘法做因式分解
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 318
types:
- code: T01
  name: 二次項係數為1的十字交乘法
  desc: 題幹為二次項係數為 1 的二次三項式，直接運用十字交乘法進行因式分解或求分解後的對應係數。
- code: T02
  name: 二次項係數不為1的十字交乘法
  desc: 題幹為二次項係數不為 1 或為負數的二次式，需先提公因數/負號或直接拆解首尾項係數進行因式分解。
- code: T03
  name: 變數代換與需整理的十字交乘法
  desc: 題幹包含相同多項式結構需用換元法（變數代換），或需先展開、分組整理後再以十字交乘法分解。
- code: T04
  name: 利用十字交乘法求公因式
  desc: 題幹給出兩個或多個二次多項式，需分別利用十字交乘法分解後找出它們的共同因式。
- code: T05
  name: 已知因式或倍式反求未知係數
  desc: 題幹已知某一次式為二次多項式的因式（或公因式、倍式關係），藉此反求多項式中的未知數或待定係數。
- code: T06
  name: 可因式分解的係數條件與可能值討論
  desc: 題幹給定二次式可被整係數因式分解的條件，探討一次項係數或常數項的所有可能值、個數、最大與最小值。
- code: T07
  name: 十字交乘過程辨析與看錯係數問題
  desc: 題幹涉及十字交乘法的直式填空、步驟除錯，或題目中看錯一次項/常數項正負號的反推訂正問題。
- code: T08
  name: 十字交乘法的幾何圖形與拼圖應用
  desc: 題幹以正方形、長方形紙板或磁磚拼成大長方形/正方形為情境，藉由面積總和因式分解求邊長、周長或增減圖形數量。
- code: T09
  name: 利用因式分解求質數與數值計算
  desc: 題幹透過因式分解將二次式化為兩數乘積，用以判定質數並求未知數，或進行特定大數的代數速算。
