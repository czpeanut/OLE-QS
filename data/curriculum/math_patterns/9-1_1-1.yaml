unit:
  grade: 9
  semester: 1
  code: 1-1
  title: 連比
  other_titles:
  - 連比例
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 398
types:
- code: T01
  name: 連比的化簡與基本性質
  desc: 將連比化為最簡整數比，或判斷連比例基本性質與運算觀念的真偽。
- code: T02
  name: 由兩兩關係或等式求連比
  desc: 由兩個二元比、連等式（如 ax=by=cz）、或含比例的方程式求出三數的連比。
- code: T03
  name: 連比例式之代數式求值
  desc: 已知三數連比，求其代數式之連比、比值或齊次多項式之值。
- code: T04
  name: 連比例式的方程式與求值
  desc: 已知連比及三數的線性組合或和差條件，設參數 r 解出各未知數的值。
- code: T05
  name: 三角形內角與高的連比
  desc: 利用三角形內角和 180 度求內角度數或判斷形狀，或利用面積固定求邊長與對應高的反比。
- code: T06
  name: 連比例的分配與數量應用
  desc: 將總量按連比分配，或利用連比計算硬幣、門票、配方成分、投資分紅等生活情境數量。
- code: T07
  name: 數量轉移與比例變化問題
  desc: 涉及物體互相給予、成員調動或前後期總量不變，計算轉移前後的比例或原有數量。
- code: T08
  name: 速率、時間與工作量問題
  desc: 利用路程、工作量固定時，速率與時間、工作效率與天數成反比的連比情境問題。
- code: T09
  name: 長度重疊與深度比例問題
  desc: 竹竿垂直插土入水露出比例、或物體重疊相接求全長與分段長度的圖形情境題。
