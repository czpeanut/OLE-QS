unit:
  grade: 9
  semester: 1
  code: 1-1
  title: 連比
  other_titles:
  - 連比例
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 398
types:
- code: T01
  name: 連比的化簡與基本性質
  desc: 將連比化為最簡整數比，或判斷連比例基本性質與運算觀念的真偽。
- code: T02
  name: 由兩組二元比或關係式求連比
  desc: 已知兩個二元比（如 x:y 與 y:z）或兩個獨立的二元一次關係式（如 ax=by 與 cy=dz），透過找出共同項（中間橋樑）的最小公倍數以求得三數連比 x:y:z；亦包含天平平衡、分組比例等由情境導出兩兩關係後求連比的題目。
- code: T10
  name: 由三項連等式求連比
  desc: 已知 ax=by=cz、axy=byz=czx 或分式形式 (x-a)/x=(y-b)/y=(z+c)/z 等三項連等關係，利用設比例常數 k 或同除以公倍數（取係數倒數比）求出 x:y:z；亦包含「相同熱量」、「剩餘金額相同」等可列出三項相等的文字應用題。
- code: T11
  name: 由兩兩之和的連比或方程式求連比
  desc: 題目給定兩兩之和的連比例式 (x+y):(y+z):(x+z)=p:q:r、兩兩之和的連等式 a(x+y)=b(y+z)=c(z+x)，或給定兩個三元一次齊次方程式，需透過對稱相加求 (x+y+z) 或消元法求出 x:y:z。
- code: T03
  name: 連比例式之代數式求值
  desc: 已知三數連比，求其代數式之連比、比值或齊次多項式之值。
- code: T04
  name: 連比例式的方程式與求值
  desc: 已知連比及三數的線性組合或和差條件，設參數 r 解出各未知數的值。
- code: T05
  name: 三角形內角與高的連比
  desc: 利用三角形內角和 180 度求內角度數或判斷形狀，或利用面積固定求邊長與對應高的反比。
- code: T06
  name: 連比例的分配與數量應用
  desc: 將總量按連比分配，或利用連比計算硬幣、門票、配方成分、投資分紅等生活情境數量。
- code: T07
  name: 數量轉移與比例變化問題
  desc: 涉及物體互相給予、成員調動或前後期總量不變，計算轉移前後的比例或原有數量。
- code: T08
  name: 速率、時間與工作量問題
  desc: 利用路程、工作量固定時，速率與時間、工作效率與天數成反比的連比情境問題。
- code: T09
  name: 長度重疊與深度比例問題
  desc: 竹竿垂直插土入水露出比例、或物體重疊相接求全長與分段長度的圖形情境題。
refined:
- 拆分 T02 由兩兩關係或等式求連比（100 題）→ T02 由兩組二元比或關係式求連比、T10 由三項連等式求連比、T11 由兩兩之和的連比或方程式求連比
