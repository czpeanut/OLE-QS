unit:
  grade: 8
  semester: 2
  code: 1-1
  title: 認識數列與等差數列
  other_titles:
  - 等差數列
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 414
types:
- code: T01
  name: 數列規律與一般項
  desc: 觀察數列的排列規律（如費氏數列、平方數、循環小數等）填入未知項，或利用已知一般項公式代入求值與推算。
- code: T02
  name: 等差數列判定與公差性質
  desc: 判斷數列是否為等差數列、求公差，或探討各項平移、縮放後新數列公差與項次差（$a_m - a_n$）之關係。
- code: T03
  name: 等差數列指定項與首項公差
  desc: 利用等差數列第 $n$ 項公式 $a_n = a_1 + (n-1)d$，已知首項、公差或任兩項求特定項、首項或公差。
- code: T04
  name: 等差數列求項數與正負項判斷
  desc: 已知首項、末項與公差求總項數，或利用不等式求數列自第幾項開始為正數、負數或大於／小於某指定值。
- code: T05
  name: 區間倍數與餘數問題
  desc: 求在某整數範圍內，特定數的倍數個數，或除以某數具有特定餘數的項數與指定項。
- code: T06
  name: 等差中項與三數成等差
  desc: 利用等差中項公式（$2b = a + c$）求兩數的等差中項，或依三數（含代數式）成等差的條件解未知數。
- code: T07
  name: 兩數間插入項成等差
  desc: 在已知兩數之間插入 $k$ 個數使其構成新的等差數列，求新數列的項數、公差或其中插入的特定項。
- code: T08
  name: 方格與十字矩陣填數
  desc: 在九宮格、十字交叉或矩陣方格中填入數值，使橫列與直行分別成等差數列並求解未知格數值。
- code: T09
  name: 圖形拼排與點線規律
  desc: 利用火柴棒、牙籤排幾何圖形（三角形、正方形、多邊形）或方塊累積堆疊，尋找圖形數量與層數的等差規律。
- code: T10
  name: 等差數列生活與幾何應用
  desc: 將等差數列應用於生活情境（如計程車跳錶、儲蓄、運動訓練、相遇問題）或幾何圖形（如直角三角形三邊長成等差、多邊形內角成等差）。
