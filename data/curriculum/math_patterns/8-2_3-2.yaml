unit_questions: 216
types:
- code: T01
  name: 尺規作圖基本概念與性質
  desc: 題目的核心為尺規作圖的定義、工具使用限制（無刻度直尺與圓規），或以圓規畫弧時半徑大小與交點個數等基礎觀念判斷。
- code: T02
  name: 等線段作圖與線段和差
  desc: 題目的核心為利用尺規複製線段，或進行線段的加法、減法作圖與長度運算。
- code: T03
  name: 等角作圖與角的和差
  desc: 題目的核心為利用尺規複製已知角（等角作圖），或進行兩角相加、相減之作圖步驟與角度關係判斷。
- code: T04
  name: 垂直平分線作圖與等分比例
  desc: 題目的核心為中垂線（垂直平分線）的作圖步驟、畫弧半徑限制，以及將線段分割成特定等分數或線段比時所需的作圖次數與長度計算。
- code: T05
  name: 垂線作圖與三角形的高
  desc: 題目的核心為過線上一點或過線外一點作垂線的尺規作圖步驟，以及在三角形中求作指定邊上的高。
- code: T06
  name: 角平分線作圖與等分比例
  desc: 題目的核心為角平分線的作圖步驟、畫弧半徑條件，以及將已知角分割為特定等分數或度數比時所需的作圖次數與角度計算。
- code: T07
  name: 特殊角作圖與角度可作性
  desc: 題目的核心為利用尺規做出特定度數之角（如 30°、45°、60°、105°、135° 等），或判斷特定角度能否利用尺規作圖完成。
- code: T08
  name: 作圖痕跡判讀與幾何計算
  desc: 題目的核心為觀察題目所給的尺規作圖痕跡以辨識作圖種類，或利用作圖產生的等長、垂直、平分等幾何性質進一步計算角度、邊長與面積。
- code: T09
  name: 幾何圖形與根號長度作圖
  desc: 題目的核心為綜合基本作圖以構作三角形、四邊形、平行線，或利用直角三角形幾何關係在數線上求作無理數（根號）長度。
