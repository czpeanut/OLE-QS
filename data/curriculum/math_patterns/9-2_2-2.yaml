unit:
  grade: 9
  semester: 2
  code: 2-2
  title: 機率
  other_titles: []
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 316
types:
- code: T01
  name: 機率概念與性質判斷
  desc: 判斷機率定義、範圍介於0到1之間、必然與不可能事件，或重複試驗中各次獨立性之觀念敘述題。
- code: T02
  name: 單一試驗的基本機率
  desc: 進行單次抽籤、抽球、抽撲克牌、轉盤或擲單顆骰子，計算特定單一事件發生的機率。
- code: T03
  name: 投擲硬幣與猜拳問題
  desc: 投擲多枚或連續多次硬幣，或兩人至多人進行猜拳遊戲計算勝負、平手的機率。
- code: T04
  name: 兩顆骰子的點數運算
  desc: 同時投擲兩顆骰子或連續投擲兩次，計算點數和、差、積、大小比較或倍數/質數等算術條件之機率。
- code: T05
  name: 骰子與代數幾何整合
  desc: 將擲骰點數代入一元二次方程式（判別式有解無解）、直線方程式或三角形邊長不等式判斷之機率問題。
- code: T06
  name: 抽球與取牌問題
  desc: 自單箱或多箱中進行取球/抽牌（含放回與不放回），計算顏色相同/相異或指定數字條件之機率。
- code: T07
  name: 數字卡排列與位數問題
  desc: 從數張數字卡中抽取並排成二位數或三位數，計算該數為質數、特定倍數或奇偶數之機率。
- code: T08
  name: 生活配對與分組問題
  desc: 日常生活情境如分房睡床位、搭乘同車廂、衣物穿搭、同星座或同組別等配對組合機率。
- code: T09
  name: 路徑走法與分岔流向
  desc: 利用樹狀圖或分岔圖分析地圖路線選擇、水管出口機率或正多邊形頂點跳步問題。
- code: T10
  name: 結合統計量與進階情境
  desc: 題目涉及中位數、四分位數等統計量判定，或多箱混合、期望值計算等進階機率應用。
