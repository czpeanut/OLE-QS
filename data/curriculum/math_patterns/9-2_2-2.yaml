unit:
  grade: 9
  semester: 2
  code: 2-2
  title: 機率
  other_titles: []
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 316
types:
- code: T01
  name: 機率概念與性質判斷
  desc: 判斷機率定義、範圍介於0到1之間、必然與不可能事件，或重複試驗中各次獨立性之觀念敘述題。
- code: T02
  name: 抽球、摸彩與轉盤機率
  desc: 包含單次抽取箱中各色彩球或物品（如撈湯圓、積木）、摸彩刮刮樂兌獎、轉動幾何轉盤、班級抽籤選人或學生及格人數等生活與遊戲情境，利用各類別數量占總數的比例或轉盤面積比計算機率。
- code: T11
  name: 撲克牌單張抽取機率
  desc: 從一副標準 52 張撲克牌（不含鬼牌）中隨機抽取一張牌，依題目所要求的花色（黑桃、紅心、方塊、梅花）、點數大小、英文字母牌（A、J、Q、K）或複合條件計算發生的機率。
- code: T12
  name: 整數選數與數論條件機率
  desc: 從連續正整數（如 1～n 號碼籤）、單顆骰子點數或給定數字集合中隨機選取一數，結合質數、因數、倍數、位數特徵，或滿足代數條件（如代入方程式為解、根號運算為整數）來計算機率。
- code: T03
  name: 投擲硬幣與猜拳問題
  desc: 投擲多枚或連續多次硬幣，或兩人至多人進行猜拳遊戲計算勝負、平手的機率。
- code: T04
  name: 兩顆骰子的點數運算
  desc: 同時投擲兩顆骰子或連續投擲兩次，計算點數和、差、積、大小比較或倍數/質數等算術條件之機率。
- code: T05
  name: 骰子與代數幾何整合
  desc: 將擲骰點數代入一元二次方程式（判別式有解無解）、直線方程式或三角形邊長不等式判斷之機率問題。
- code: T06
  name: 抽球與取牌問題
  desc: 自單箱或多箱中進行取球/抽牌（含放回與不放回），計算顏色相同/相異或指定數字條件之機率。
- code: T07
  name: 數字卡排列與位數問題
  desc: 從數張數字卡中抽取並排成二位數或三位數，計算該數為質數、特定倍數或奇偶數之機率。
- code: T08
  name: 生活配對與分組問題
  desc: 日常生活情境如分房睡床位、搭乘同車廂、衣物穿搭、同星座或同組別等配對組合機率。
- code: T09
  name: 路徑走法與分岔流向
  desc: 利用樹狀圖或分岔圖分析地圖路線選擇、水管出口機率或正多邊形頂點跳步問題。
- code: T10
  name: 結合統計量與進階情境
  desc: 題目涉及中位數、四分位數等統計量判定，或多箱混合、期望值計算等進階機率應用。
refined:
- 拆分 T02 單一試驗的基本機率（76 題）→ T02 抽球、摸彩與轉盤機率、T11 撲克牌單張抽取機率、T12 整數選數與數論條件機率
