unit:
  grade: 8
  semester: 1
  code: 5-1
  title: 統計資料處理
  other_titles:
  - 相對與累積次數分配圖表
  - 資料整理與統計圖表
status: draft
model: gemini-3.7-flash(batch)
sampled: 291
unit_questions: 292
types:
- code: T01
  name: 次數與相對次數分配表
  desc: 給定次數分配表或相對次數表，進行次數與相對次數百分比的互相換算、求總人數或特定組別數值
- code: T02
  name: 累積次數分配表
  desc: 利用累積次數分配表逐組累加的特性，計算各組累積次數、反求特定區間次數或判定數據範圍
- code: T03
  name: 累積相對次數分配表
  desc: 結合累積次數與相對次數表格，進行各組百分比累加、填補表格缺漏值與求特定百分比之計算
- code: T04
  name: 次數與相對次數圖形判讀
  desc: 由次數或相對次數折線圖、直方圖、長條圖（如投籃命中率），判讀各組人數、所占百分比或總人數
- code: T05
  name: 累積次數分配折線圖判讀
  desc: 由累積次數折線圖判讀各分組端點的累積人數、計算某區間人數或找出增加人數最多（斜率最陡）之組別
- code: T06
  name: 累積相對次數折線圖判讀
  desc: 由累積相對次數折線圖判讀累積百分比、計算指定區間比例與人數，或已知特定區間人數反求全體總人數
- code: T07
  name: 統計圖表缺漏與逆推問題
  desc: 圖表部分被汙損、漏畫或隱含未知數，需利用組別比例關係、總和為100%或給定條件列方程式求解
- code: T08
  name: 多組資料比較與素養應用
  desc: 在同一圖表中比較兩班（或兩月份、兩校）的分佈曲線，或結合手搖飲糖分、悠遊卡回饋等生活情境進行分析與決策
- code: T09
  name: 統計圖表繪製與圖形轉換
  desc: 根據原始數據或分配表，繪製累積次數／相對次數折線圖，或將次數圖轉換為累積圖與圓形圖
