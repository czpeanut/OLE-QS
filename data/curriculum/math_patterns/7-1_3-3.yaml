unit:
  grade: 7
  semester: 1
  code: 3-3
  title: 應用問題
  other_titles:
  - 一元一次方程式的應用
status: draft
model: gemini-3.7-flash
sampled: 300
unit_questions: 522
types:
- code: T01
  name: 純數運算與代數關係
  desc: 題目無具體實物情境，主要針對抽象數字進行四則運算逆推、大/小兩數的和差倍數關係、相反數的設定，或特定公式（如攝氏與華氏溫度換算）的代數列式與求解。
- code: T11
  name: 生活情境之數量與和差倍
  desc: 題目以日常生活為背景，依據物品單價與購買數量的總金額（含找零）、多人物品或金錢的數量倍數與和差關係、人際間物品互相給予或轉移，以及等量替換節省量等情境設立未知數求解。
- code: T12
  name: 平均數與成績問題
  desc: 以考試成績、段考各科分數、全班與組別（如及格與不及格）的平均分數或加權計分為情境，利用「總分＝平均數×次數（或人數）」之核心關係列式求解。
- code: T13
  name: 魔術方陣與天平圖形推理
  desc: 包含九宮格或特定圖形填數使各行各列和相等（魔術方陣/幻方）、等臂天平平衡之等量代換推理，以及撲克牌或棋子分堆的交叉計數與數量推導等富含圖形或結構推理的題目。
- code: T02
  name: 年齡問題
  desc: 涉及不同時間點（過去、現在、未來）人物年齡間的倍數關係或對話推算。
- code: T03
  name: 買賣與折扣利潤
  desc: 涉及成本、定價、售價、打折促銷及賺賠金額之計算。
- code: T04
  name: 盈不足與分配問題
  desc: 將物品或人數分配至固定單位中，由「剩餘」與「不足」數量列式求解總數或單位數。
- code: T05
  name: 速率與行程問題
  desc: 利用距離、速率與時間之關係，處理往返、追趕、相遇或中途變更速率之情境。
- code: T06
  name: 雞兔同籠與面額組合
  desc: 已知兩種不同單價、面額、得分或票種的總數量與總和，求解各自的數量。
- code: T07
  name: 連續數與位值問題
  desc: 涉及連續整數（奇數/偶數）、月曆規律，或二位數以上之數字對調與位值結構運算。
- code: T08
  name: 幾何圖形周長與面積
  desc: 利用長方形、梯形等平面圖形的邊長、周長、面積或摺疊、分割關係建立方程式。
- code: T09
  name: 分段計費與方案選擇
  desc: 涉及停車場、電信費、水電費等累進分段收費，或不同促銷方案的費用比較。
- code: T10
  name: 分數與剩餘量問題
  desc: 涉及占全體的分數/百分比、竹竿入水、容量消耗或多次取用後之剩餘量計算。
refined:
- 拆分 T01 數量關係與代數列式（93 題）→ T01 純數運算與代數關係、T11 生活情境之數量與和差倍、T12 平均數與成績問題、T13 魔術方陣與天平圖形推理
