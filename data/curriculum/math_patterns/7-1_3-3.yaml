unit:
  grade: 7
  semester: 1
  code: 3-3
  title: 應用問題
status: draft
model: gemini-3.7-flash
sampled: 200
unit_questions: 522
types:
- code: T01
  name: 連續數與數量關係問題
  desc: 利用未知數表示多個數或連續整數、奇數、偶數之間的加減倍數關係並解題
- code: T02
  name: 二位數與數字問題
  desc: 題型涉及二位數之個位與十位數字的數值表示、數字和及對調後的大小關係
- code: T03
  name: 年齡問題
  desc: 根據不同年份（過去、現在、未來）的年齡倍數關係或年齡差列式求解
- code: T04
  name: 買賣與利潤折扣問題
  desc: 圍繞成本、定價、打折加成與獲利或虧損金額之間的關係列式計算
- code: T05
  name: 分配與盈不足問題
  desc: 物品分給若干人或分組分配時，根據不同分法所產生的剩餘或不足列出等式
- code: T06
  name: 速率、時間與行程問題
  desc: 利用距離、速率與時間公式，處理上下山、追趕、相遇或途中變速延誤等情境
- code: T07
  name: 幾何圖形周長與面積
  desc: 透過幾何圖形（長方形、梯形、組合圖形）的邊長、周長或面積公式列出一元一次方程式
- code: T08
  name: 雞兔同籠與數量合計
  desc: 已知兩種物品（如硬幣面額、題型、票券）的總數量與總價值，設單一未知數求解數量
- code: T09
  name: 分段計費與方案促銷
  desc: 處理停車場分段收費、門票雙向組合購票或不同促銷方案（A/B方案、買多打折）之比較與總額計算
- code: T10
  name: 平均數與總分計算問題
  desc: 利用多項成績或數據的總和除以次數等於平均值，或平均變化的條件來列式求解
- code: T11
  name: 月曆與九宮格數陣規律
  desc: 利用月曆日期排布規律（同列差1、同行差7）或九宮格幻方行列和相等之特性解題
