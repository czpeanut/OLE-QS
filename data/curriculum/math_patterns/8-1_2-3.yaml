unit:
  grade: 8
  semester: 1
  code: 2-3
  title: 畢氏定理
status: draft
model: gemini-3.7-flash
sampled: 200
unit_questions: 494
types:
- code: T01
  name: 直角三角形判別與邊長可能值
  desc: 利用兩股平方和等於斜邊平方的逆定理判別直角三角形，或在未指定斜邊時求第三邊的所有可能長度。
- code: T02
  name: 畢氏定理基本邊長計算
  desc: 在已知兩邊長或基本圖形中，直接利用畢氏定理求直角三角形未知的斜邊或一股長。
- code: T03
  name: 直角三角形斜邊上的高
  desc: 利用「兩股乘積＝斜邊×斜邊上的高」之面積關係求斜邊上的高或相關線段長度。
- code: T04
  name: 特殊三角形高與面積計算
  desc: 利用畢氏定理計算正三角形、等腰三角形或等腰直角三角形的高與面積。
- code: T05
  name: 三邊向外作圖的面積關係
  desc: 探討以直角三角形三邊向外作正方形、半圓或正三角形之面積和關係（含畢氏樹問題）。
- code: T06
  name: 複合幾何圖形與作高求值
  desc: 在梯形、四邊形或多個相連直角三角形中，透過作輔助高或共用邊多次使用畢氏定理計算未知量。
- code: T07
  name: 平面幾何圖形之摺疊問題
  desc: 將長方形、正方形或三角形摺疊，利用對稱性設未知數並在直角三角形中列畢氏定理方程式求解。
- code: T08
  name: 坐標平面上的兩點距離
  desc: 利用坐標平面上的兩點距離公式求線段長度、點到原點距離或坐標中的未知數。
- code: T09
  name: 方位移動與直線距離
  desc: 題目給定在平面上依東西南北方位或直角轉彎的多段路徑，求起點與終點間的最短直線距離。
- code: T10
  name: 畢氏定理生活情境應用
  desc: 解決梯子靠牆滑動、鞦韆擺盪高度、水草蓮花擺動碰岸及電視螢幕尺寸等生活實境應用題。
