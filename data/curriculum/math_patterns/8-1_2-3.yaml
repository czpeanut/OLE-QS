unit:
  grade: 8
  semester: 1
  code: 2-3
  title: 畢氏定理
  other_titles: []
status: draft
model: gemini-3.7-flash
sampled: 300
unit_questions: 494
types:
- code: T01
  name: 直角三角形三邊長與逆定理判別
  desc: 題目要求利用畢氏定理判別三邊長是否為直角三角形，或已知其中兩邊長求第三邊的所有可能值。
- code: T02
  name: 直角三角形邊長與連鎖直角計算
  desc: 題目給定單一或多個相連的直角三角形邊長條件，直接利用畢氏定理求未知線段長度。
- code: T03
  name: 畢氏定理的幾何圖形面積關係
  desc: 題目探討直角三角形三邊向外繪製正方形、正三角形、半圓的面積和關係，或趙爽弦圖等拼圖面積問題。
- code: T04
  name: 直角三角形斜邊上的高
  desc: 題目要求利用直角三角形面積（兩股相乘等於斜邊乘斜邊上的高）計算斜邊上的高或相關垂足分段長。
- code: T05
  name: 正三角形、等腰三角形與多邊形計算
  desc: 題目要求在正三角形、等腰三角形、梯形或一般多邊形中作高線分割出直角三角形，計算高、邊長或面積。
- code: T06
  name: 平面圖形摺紙與對摺問題
  desc: 題目給定長方形、正方形或三角形的摺疊情境，需設定未知數並於摺疊產生的直角三角形中利用畢氏定理列式求解。
- code: T07
  name: 直角坐標平面上的距離公式
  desc: 題目給定平面直角坐標系上的點坐標或直線方程式，要求利用距離公式求線段長、判斷三角形形狀或求點坐標。
- code: T08
  name: 方位行走與平面路徑直線距離
  desc: 題目描述向東、西、南、北等方位移動或沿棋盤方格行走的情境，要求計算起點與終點之間的直線距離。
- code: T09
  name: 梯子下滑、鞦韆與生活應用問題
  desc: 題目以梯子/竹竿靠牆滑動、鞦韆擺動高低差、水池蓮花折斷或電視螢幕尺寸等生活實例，建立直角三角形列式求解。
- code: T10
  name: 空間立體幾何與表面最短路徑
  desc: 題目探討長方體等立體圖形的空間對角線長度，或在立體表面展開求兩點間的最短爬行路徑長度。
