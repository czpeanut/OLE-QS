unit:
  grade: 7
  semester: 2
  code: 1-3
  title: 應用問題
  other_titles:
  - 二元一次聯立方程式的應用
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 378
types:
- code: T01
  name: 買賣與總價問題
  desc: 以商品單價、購買數量、折扣優惠、找零或買錯品項等花費關係列式求解。
- code: T02
  name: 雞兔同籠與分組計分問題
  desc: 兩類對象具不同數值或容量（如協力車人數、投籃得分、比賽勝負、分組分食）的總量配搭問題。
- code: T03
  name: 年齡問題
  desc: 涉及過去、現在、未來不同時間點或「我在你這年紀時…」等相對年齡對話的關係求解。
- code: T04
  name: 數字與位數問題
  desc: 涉及二位數或多位數的各個數位大小、數字顛倒對調或看錯位數的數值關係問題。
- code: T05
  name: 盈不足與分配問題
  desc: 將物品分給特定人數或分裝於容器時，出現剩下（盈）、不夠（不足）或調整分配的數量問題。
- code: T06
  name: 幾何圖形與長度重疊問題
  desc: 利用幾何圖形（長方形、正多邊形）的周長與面積，或多段線段、紙張重疊拼接的長度關係列式。
- code: T07
  name: 數量互給與增減問題
  desc: 兩人之間互相給予金錢、卡片或糖果後，各自擁有的數量與倍數產生變化的情境問題。
- code: T08
  name: 速率、追趕與濃度工程問題
  desc: 涉及追趕或相遇的行程速率、溶液濃度混合調配，或多人合作工程天數等應用問題。
- code: T09
  name: 整數限制與方案搭配問題
  desc: 題目未知數受正整數或非負整數限制，要求找出符合條件的可能買法、方案數或最值。
