unit:
  grade: 7
  semester: 1
  code: 2-3
  title: 分數的四則運算
  other_titles: []
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 386
types:
- code: T01
  name: 等值分數與最簡分數
  desc: 利用擴分、約分求未知數，或判斷分數是否為最簡分數及分子分母同加減的定值問題
- code: T02
  name: 分數的大小比較
  desc: 利用通分、化為同分子或基準量比較正負分數的大小，或尋找介於兩數間之特定最簡分數
- code: T03
  name: 倒數與相反數的意義
  desc: 求整數、分數、帶分數的倒數與相反數，或利用兩數互為倒數乘積為1的性質化簡代數式
- code: T04
  name: 分數的加減運算與去括號
  desc: 正負分數與帶分數的加減計算，或利用去括號法則與交換律、結合律進行同分母合併
- code: T05
  name: 分數的乘除運算
  desc: 正負分數與帶分數的連乘、連除與乘除混合計算，包含將除法轉為乘以倒數並約分化簡
- code: T06
  name: 分數乘法分配律與巧算
  desc: 利用提出公因數、拆解帶分數展開等分配律技巧進行分數的簡捷計算或數值估算
- code: T07
  name: 分數四則混合運算
  desc: 結合加減乘除、多重括號、次方乘方、絕對值及小數分數混合的綜合運算
- code: T08
  name: 分數數列規律與拆項對消
  desc: 利用乘積約分抵消、連乘因式化簡或裂項相消法求連續分數運算式的總和或積
- code: T09
  name: 基準量與分數連鎖分配問題
  desc: 涉及已知總量或部分量求全部，以及求剩餘量或「剩餘的幾分之幾」之連續份額情境題
- code: T10
  name: 分數的分裝與餘數問題
  desc: 將總量依單位分數分裝，求可裝滿的整數份數及換算回實際單位的剩餘量
- code: T11
  name: 分數的生活情境應用
  desc: 包含打折促銷方案比價、工程合作完成天數、集合重疊重合比例及容器連瓶重等生活題
