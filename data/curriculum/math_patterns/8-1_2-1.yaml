unit:
  grade: 8
  semester: 1
  code: 2-1
  title: 平方根的意義
  other_titles:
  - 平方根與近似值
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 403
types:
- code: T01
  name: 平方根的概念與性質判斷
  desc: 判斷關於平方根定義、根號符號意涵、正負平方根個數等概念敘述的正誤。
- code: T02
  name: 求指定數值的平方根
  desc: 給定具體數值（整數、分數、小數或標準分解式/乘方），依平方根定義求其平方根、正平方根或負平方根（結果通常為正負兩數 $\pm \sqrt{a}$ 或有理數）。題目直接針對一般數值求平方根，不包含底數為未化簡根式的雙重開方問題。
- code: T11
  name: 根式的化簡求值與四則運算
  desc: 計算根號數 $\sqrt{a}$ 或 $-\sqrt{a}$ 的數值（利用質因數分解、分數化假分數開方），或運用 $\sqrt{a^2}=|a|$ 與 $(\sqrt{a})^2=a$（$a \ge 0$）等性質，進行多個根式的加減四則混合運算與化簡求值。
- code: T12
  name: 根號數的平方根與雙重開方
  desc: 針對「求 $\sqrt{A}$ 的平方根/正負平方根」或「已知 $\sqrt{x}$ 的平方根求 $x$」等經典雙重開方與陷阱問題。解題核心為兩步驟思考：必須先將根號算式 $\sqrt{A}$ 化簡為單一正數，再求該正數的平方根。
- code: T03
  name: 利用平方根定義求未知數
  desc: 依據某數為代數式的平方根，列出一元或二元一次方程式求解未知數與相關式子之值。
- code: T04
  name: 根式的大小比較與數線定位
  desc: 比較根式與整數、分數、小數的大小關係，或判斷根式在數線上的落點與對應區間。
- code: T05
  name: 根式的整數範圍與小數部分
  desc: 求根式介於哪兩個連續整數之間，或求根式的整數部分與小數部分並進行代數式求值。
- code: T06
  name: 根式不等式與整數個數
  desc: 求解含有根式的不等式範圍，並計算滿足條件的正整數或整數未知數之個數。
- code: T07
  name: 使根式為整數的條件探討
  desc: 探討使根號內加減或乘除某數後開方結果為整數（或完全平方數）的正整數解。
- code: T08
  name: 十分逼近法與近似值計算
  desc: 利用給定的連續小數平方數據或依步驟操作十分逼近法，求出根式四捨五入後的近似值。
- code: T09
  name: 查表法與近似值倍數推算
  desc: 利用乘方開方表或已知根式近似值，透過小數點移動與平方倍數推算較大或較小根式的近似值。
- code: T10
  name: 平方根的幾何與生活應用
  desc: 利用正方形面積與邊長為平方根的關係，解決磁磚鋪設、面積拼貼或實際生活測量情境題。
refined:
- 拆分 T02 數值平方根與根式化簡求值（100 題）→ T02 求指定數值的平方根、T11 根式的化簡求值與四則運算、T12 根號數的平方根與雙重開方
