unit:
  grade: 7
  semester: 2
  code: 6-1
  title: 線對稱與三視圖
  other_titles:
  - 垂直、線對稱與三視圖
  - 幾何圖形、線對稱與三視圖
status: draft
model: gemini-3.7-flash(batch)
sampled: 219
unit_questions: 227
types:
- code: T01
  name: 基本幾何符號與線段計算
  desc: 涉及點、線、射線、角的符號表示法、多邊形對角線數，或利用中點關係進行線段長度計算。
- code: T02
  name: 垂直與垂直平分線性質
  desc: 探討垂直、垂足、點到直線距離的定義，或利用垂直平分線（中垂線）性質計算線段長度。
- code: T03
  name: 線對稱圖形的判別
  desc: 判斷給定的幾何圖形、英文字母、國字、國旗或標誌是否為線對稱圖形。
- code: T04
  name: 對稱軸條數的判斷與計算
  desc: 求正多邊形、特殊四邊形、圓形或平面組合圖形的對稱軸數量或總和。
- code: T05
  name: 線對稱圖形的性質與計算
  desc: 利用對稱點、對稱邊、對稱角與對稱軸垂直平分對稱點連線的性質，求角度、長度或面積。
- code: T06
  name: 完成線對稱圖形與方格塗色
  desc: 在方格紙上補全以特定直線為對稱軸的圖形，或找出需著色/擦去的方格以構成線對稱圖形。
- code: T07
  name: 坐標平面上的對稱點
  desc: 在直角坐標平面上，求某點以坐標軸、鉛直線或水平線為對稱軸的對稱點坐標。
- code: T08
  name: 摺紙與剪紙展開圖形
  desc: 分析紙張經過對摺、剪角、剪切或打洞後，展開所呈現的圖案、對稱性或剪下圖形面積。
- code: T09
  name: 立體圖形之三視圖判別與繪製
  desc: 依據立體積木模型，繪製或選出對應的前視圖、上視圖、右視圖，或判斷觀察者視角方向。
- code: T10
  name: 三視圖反推立體模型與計數
  desc: 由給定的三視圖或標示高度的上視圖，反推立體模型的形狀或計算堆疊所需的正方體積木數量。
- code: T11
  name: 增減積木對視圖的影響
  desc: 判斷自立體積木模型中拿走或加入指定積木後，前視圖、右視圖或上視圖是否改變。
