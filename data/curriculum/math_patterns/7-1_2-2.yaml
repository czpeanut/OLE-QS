unit:
  grade: 7
  semester: 1
  code: 2-2
  title: 最大公因數與最小公倍數
  other_titles:
  - 公因數與公倍數
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 450
types:
- code: T01
  name: 倍數判別法與缺位求值
  desc: 判斷整數是否為特定數（如2、3、4、5、9、11等）的倍數，或利用倍數規則反求缺漏位數。
- code: T02
  name: 互質的判斷與性質
  desc: 利用兩數最大公因數為1的定義，判斷兩數或數組是否互質及相關概念是非題。
- code: T03
  name: 最大公因數與最小公倍數的計算
  desc: 給定兩數或多數的整數或標準分解式，利用質因數分解或短除法求其最大公因數或最小公倍數（含短除法填空還原）。
- code: T04
  name: 兩數乘積與公因公倍數關係
  desc: 利用兩正整數乘積等於其最大公因數與最小公倍數之乘積，或由已知公因數與公倍數反求未知數或其組合。
- code: T05
  name: 公因數應用：物品平分與分組
  desc: 將多種數量的物品平分或將不同群體人數分組，包含剛好分完、分裝有剩餘或不足求人數與份數的情境。
- code: T06
  name: 公因數應用：圖形裁切與等距植樹
  desc: 將長方形/長方體分割或鋪設成最大相同正方形/正方體，或在多邊形/道路周圍等距離植樹與設路燈。
- code: T07
  name: 公倍數應用：週期循環與同時相遇
  desc: 求公車班次發車、燈號閃爍、排班輪休、環形跑道繞行等不同週期事件再次同時發生的時間或次數。
- code: T08
  name: 公倍數應用：圖形拼接
  desc: 利用多個相同規格的小長方形紙片或長方體積木，緊密拼排成正方形或正方體的情境問題。
- code: T09
  name: 公倍數應用：同餘與不足問題
  desc: 求被多個不同整數除後，餘數相同、不足數相同或可化為同餘的未知整數或範圍人數（韓信點兵問題）。
- code: T10
  name: 公倍數應用：分數化整數
  desc: 求乘以一個正整數後可使多個分數同時化為正整數的最小正整數或特定倍數。
