unit:
  grade: 7
  semester: 2
  code: 2-2
  title: 二元一次方程式的圖形
  other_titles: []
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 453
types:
- code: T01
  name: 點與直線方程式的關係
  desc: 判斷點是否在直線上、將線上點坐標代入求未知數或代數式之值，以及滿足到兩軸等距等條件求點坐標。
- code: T02
  name: 水平線與鉛垂線
  desc: 探討方程式為 x＝k 或 y＝k 的圖形特性、兩軸方程式，或求過已知點且平行/垂直坐標軸的直線方程式。
- code: T03
  name: 直線與坐標軸的交點與作圖
  desc: 求二元一次方程式與 x 軸、y 軸的交點坐標，或在坐標平面上描繪其直線圖形。
- code: T04
  name: 直線通過的象限與圖形判斷
  desc: 由方程式、係數的正負關係或圖形走勢，判斷直線所通過（或不通過）的象限與對應圖形。
- code: T05
  name: 求二元一次方程式
  desc: 利用已知的兩點坐標、三點共線或圖形平移條件，求出直線方程式 y＝ax＋b。
- code: T06
  name: 兩直線交點與幾何意義
  desc: 求兩直線圖形的交點坐標，或利用交點在坐標軸、特定象限或三線共點反求方程式中的未知數。
- code: T07
  name: 直線與兩軸圍成的三角形面積
  desc: 計算單一直線與兩坐標軸所圍成的直角三角形面積，或已知面積反求方程式的未知係數。
- code: T08
  name: 多直線圍成的圖形面積
  desc: 計算兩條相交直線與坐標軸圍成的三角形面積，或多條直線（如水平線、鉛垂線）圍成的矩形/多邊形面積。
- code: T09
  name: 直線方程式的幾何與生活應用
  desc: 結合平面幾何圖形（如正方形、矩形、線段比例分割）或生活情境（如颱風路徑、航行坐標）的直線問題。
