unit:
  grade: 7
  semester: 2
  code: 4-2
  title: 解一元一次不等式及其應用
  other_titles:
  - 解一元一次不等式
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 565
types:
- code: T01
  name: 不等式的性質與判斷
  desc: 利用不等式的加減乘除性質判斷式子正誤，或利用天平、數線比較未知數大小關係。
- code: T02
  name: 解一元一次不等式與圖示
  desc: 題目皆為純數值係數的一元一次不等式（包含整數、分數、小數型）。核心為透過去括號、去分母、移項與化簡求出不等式的解，或是檢驗某數是否為其解、在數線上選出或畫出解的圖示。
- code: T12
  name: 不等式解題步驟除錯
  desc: 題目給出解一元一次不等式的完整演算過程（通常標註步驟一至步驟四），要求學生檢視並判斷是從哪一個步驟開始發生錯誤（常見錯誤如：去分母時常數項漏乘、同乘除負數時不等號未轉向、去括號負號未分配等）。
- code: T13
  name: 含未知係數（參數）的一元一次不等式
  desc: 不等式中含有未知常數/參數（如 a、b、m），題目給定參數的大小關係、正負符號或點 (a, b) 所在象限，要求解出 x 的範圍或判斷其數線圖示，核心考驗除以負數時不等號轉向的判斷。
- code: T14
  name: 雙重不等式求解與範圍
  desc: 求解形如 a ≤ f(x) < b、A < B ≤ C 的雙重（連立）不等式，或由點 P(f(x), g(x)) 落在特定象限求 x 的重疊範圍，需同時滿足兩側條件求交集。
- code: T03
  name: 不等式的整數解與代數式估值
  desc: 求不等式的最大整數解、最小整數解、正整數解個數，或進一步求另一代數式的值與範圍。
- code: T04
  name: 依不等式的解反求未知係數
  desc: 已知不等式的解、解在數線上的圖示或兩不等式解相同，反求不等式中的待定係數。
- code: T05
  name: 購物消費、折扣與預算限制問題
  desc: 以生活購物與消費情境為核心，包含購買文具、餐點或生活用品的費用計算，以及打折促銷、三人同行一人免費、買甲送乙、滿額折扣等優惠方案；依據預算上限（不超過某金額、有找錢）、消費門檻（摸彩券張數、外送條件）列出一元一次不等式，求解最大購買數量、最多商品種類選擇或單價範圍。
- code: T15
  name: 商品成本、損耗與利潤問題
  desc: 以商業買賣、批發進貨與經營成本為核心，包含進貨成本、固定成本（如設計費、開模費）與變動成本，常結合運送損耗率（部分瑕疵毀損無法售出）或定價打折促銷；依據「利潤＝收入－成本」需達到指定獲利金額或利潤率門檻（獲利超過成本的特定比例）列出一元一次不等式求解最少進貨數量或定價。
- code: T16
  name: 儲蓄存錢與定期累積達標問題
  desc: 以定期累積與門檻達成情境為核心，包含原有存款定期存入定額、每日背誦進度、打工按日/時累積薪資、減重運動距離累積或集點達標等；依據「起始量＋單位增加量×次數（或時間）$\,\ge\,$ 目標量」的線性關係列出一元一次不等式，求解達到目標所需的最少天數、週數、次數或速率。
- code: T06
  name: 門票優惠與收費方案比較
  desc: 情境包含湊足人數買團體票反而划算，或比較兩種不同計費標準（如歡唱方案、遊樂園護照與計次）的划算人數/次數。
- code: T07
  name: 速率、時間與距離問題
  desc: 情境包含通過隧道時間、上山下山或往返兩地的平均時速、分段時速與距離的不等式應用。
- code: T08
  name: 分配與盈不足問題
  desc: 情境包含物品分給若干人（如分糖果）或人員安排到空間（如住帳篷、房間、搭車）產生不夠、剩下或未住滿的不等式。
- code: T09
  name: 幾何圖形周長與面積問題
  desc: 利用三角形、矩形或梯形等幾何圖形的邊長、周長與面積關係列出不等式並求解。
- code: T10
  name: 選舉當選與公投門檻問題
  desc: 情境包含計算單一或複數選區的最低安全當選票數，或公民投票案的通過門檻。
- code: T11
  name: 電梯載重與容量測量問題
  desc: 情境包含進出電梯超重警示前後的重量範圍判斷，或利用容器放物排水估測物體體積範圍。
refined:
- 拆分 T02 解一元一次不等式與圖示（140 題）→ T02 解一元一次不等式與圖示、T12 不等式解題步驟除錯、T13 含未知係數（參數）的一元一次不等式、T14 雙重不等式求解與範圍
- 拆分 T05 購物折扣、存錢與利潤問題（110 題）→ T05 購物消費、折扣與預算限制問題、T15 商品成本、損耗與利潤問題、T16 儲蓄存錢與定期累積達標問題
