unit:
  grade: 7
  semester: 2
  code: 4-2
  title: 解一元一次不等式及其應用
  other_titles:
  - 解一元一次不等式
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 565
types:
- code: T01
  name: 不等式的性質與判斷
  desc: 利用不等式的加減乘除性質判斷式子正誤，或利用天平、數線比較未知數大小關係。
- code: T02
  name: 解一元一次不等式與圖示
  desc: 透過去括號、移項、去分母求解一元一次不等式（包含雙重不等式）、除錯步驟或在數線上圖示其解。
- code: T03
  name: 不等式的整數解與代數式估值
  desc: 求不等式的最大整數解、最小整數解、正整數解個數，或進一步求另一代數式的值與範圍。
- code: T04
  name: 依不等式的解反求未知係數
  desc: 已知不等式的解、解在數線上的圖示或兩不等式解相同，反求不等式中的待定係數。
- code: T05
  name: 購物折扣、存錢與利潤問題
  desc: 情境包含商品買賣、打折促銷、定期存錢、成本利潤或預算上限等生活花費不等式應用。
- code: T06
  name: 門票優惠與收費方案比較
  desc: 情境包含湊足人數買團體票反而划算，或比較兩種不同計費標準（如歡唱方案、遊樂園護照與計次）的划算人數/次數。
- code: T07
  name: 速率、時間與距離問題
  desc: 情境包含通過隧道時間、上山下山或往返兩地的平均時速、分段時速與距離的不等式應用。
- code: T08
  name: 分配與盈不足問題
  desc: 情境包含物品分給若干人（如分糖果）或人員安排到空間（如住帳篷、房間、搭車）產生不夠、剩下或未住滿的不等式。
- code: T09
  name: 幾何圖形周長與面積問題
  desc: 利用三角形、矩形或梯形等幾何圖形的邊長、周長與面積關係列出不等式並求解。
- code: T10
  name: 選舉當選與公投門檻問題
  desc: 情境包含計算單一或複數選區的最低安全當選票數，或公民投票案的通過門檻。
- code: T11
  name: 電梯載重與容量測量問題
  desc: 情境包含進出電梯超重警示前後的重量範圍判斷，或利用容器放物排水估測物體體積範圍。
