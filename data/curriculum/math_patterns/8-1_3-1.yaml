unit:
  grade: 8
  semester: 1
  code: 3-1
  title: 提公因式與乘法公式作因式分解
  other_titles:
  - 利用提公因式與乘法公式做因式分解
  - 提公因式法與乘法公式因式分解
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 315
types:
- code: T01
  name: 因式分解的意義與概念判別
  desc: 判斷數學敘述或運算式是否符合因式分解的定義（將多項式化為兩個或多個一次以上多項式或單項式的乘積），或辨析因式分解過程中的步驟錯誤與整除定義概念。
- code: T10
  name: 多項式因式與倍式的判別
  desc: 給定多項式的乘積展開式或已知多項式，判斷特定式子（含常數倍、變號、組合式等）是否為該多項式的因式或倍式，不含求多項式中未知係數的題目。
- code: T11
  name: 利用因式或倍式關係求待定係數
  desc: 已知某式為多項式的因式或該多項式為某式的倍式（餘式為 0），透過多項式除法整除或代入求出多項式中的未知係數（如 k、m、n），或進一步求其餘因式。
- code: T02
  name: 多項式的公因式判別
  desc: 給予兩個或多個已分解或未分解的多項式，找出或判斷其共同的公因式。
- code: T03
  name: 提單項式公因式
  desc: 從各項中提出係數的最大公因數或共同的單項式文字變數進行因式分解。
- code: T04
  name: 提多項式公因式
  desc: 各項含有共同的多項式因式，直接提出或經由變號、分組整理後提出公因式進行因式分解。
- code: T05
  name: 利用平方差公式因式分解
  desc: 將多項式化為兩項平方相減的形式，利用 a²－b²＝(a＋b)(a－b) 進行因式分解。
- code: T06
  name: 利用完全平方公式因式分解
  desc: 將多項式化為三項式形式，利用 a²±2ab＋b²＝(a±b)² 進行因式分解。
- code: T07
  name: 完全平方式與待定係數
  desc: 已知多項式為完全平方式或給定分解形式，逆推求解其中的未知常數或各項係數。
- code: T08
  name: 因式分解的幾何與面積應用
  desc: 利用正方形與長方形紙板拼貼、挖除剪裁等面積情境，列出多項式並因式分解求邊長或周長。
- code: T09
  name: 因式分解的數值與質數應用
  desc: 將大數運算或數論問題化為代數結構，利用提公因式或乘法公式因式分解進行簡捷計算或判斷質因數。
refined:
- 拆分 T01 因式與倍式的意義判別（53 題）→ T01 因式分解的意義與概念判別、T10 多項式因式與倍式的判別、T11 利用因式或倍式關係求待定係數
