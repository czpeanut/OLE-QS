  title: 一元一次不等式的解及圖示
  other_titles:
  - 認識一元一次不等式
  - 一元一次不等式及其解
status: draft
model: gemini-3.7-flash(batch)
sampled: 118
unit_questions: 130
types:
- code: T01
  name: 一元一次不等式的辨識
  desc: 判斷給定式子是否為一元一次不等式。
- code: T02
  name: 文字關鍵詞與不等號改寫
  desc: 根據「不大於、至少、超過、未滿、不逾」等關鍵詞，將純文字敘述改寫為不等式或判斷對應正誤。
- code: T03
  name: 生活情境列不等式
  desc: 依據購物花費、年齡、分數或數量等日常情境列出一元一次不等式。
- code: T04
  name: 分級與費率標準判讀列式
  desc: 依據郵資、票價身高、成績等第或空氣品質等表格分級標準，列出範圍或判斷符合條件的數值。
- code: T05
  name: 不等式解的代入檢驗
  desc: 將特定數值代入不等式，檢驗並判斷該數是否為該不等式的解。
- code: T06
  name: 不等式的運算性質
  desc: 利用不等式兩邊同加、同減、同乘或同除（特別是負數變號）的公理性質判斷式子正誤。
- code: T07
  name: 天平圖形的大小關係推理
  desc: 透過天平的傾斜與平衡圖形，列出不等式並比較多個未知量的大小關係。
- code: T08
  name: 不等式的數線圖示
  desc: 給定不等式（單邊或雙邊範圍），在數線上畫出圖解或選擇正確的數線圖示。
- code: T09
  name: 由數線圖示判讀不等式
  desc: 根據數線圖上的方向與實心/空心端點，反推並寫出對應的不等式。
- code: T10
  name: 不等式範圍內的特定整數解
  desc: 根據給定不等式或數線圖示範圍，求出滿足條件的整數解、正整數解或其個數。
