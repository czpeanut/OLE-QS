unit_questions: 410
types:
- code: T01
  name: 四邊形性質判別與關係
  desc: 判斷各類四邊形之對角線垂直、平分、等長等性質，或判定四邊形所屬種類與包含關係。
- code: T02
  name: 矩形的邊角與對角線性質
  desc: 利用長方形四個直角、對角線等長且互相平分，或結合摺疊、內角平分線求長度與角度。
- code: T03
  name: 菱形的性質與面積計算
  desc: 利用菱形四邊等長、對角線互相垂直平分求菱形邊長、周長、對角線長、高或面積。
- code: T04
  name: 箏形的性質與幾何計算
  desc: 利用箏形兩組鄰邊等長、對稱軸、對角線互相垂直且一條被平分等性質求線段長與面積。
- code: T05
  name: 正方形的性質與複合圖形
  desc: 利用正方形邊角及對角線性質，或探討正方形與菱形、多邊形重疊與拼接之邊長與面積。
- code: T06
  name: 梯形兩腰中點連線段
  desc: 利用梯形中線長為兩底和之一半，或腰上多等分平行線段與高求線段長、周長或面積比。
- code: T07
  name: 等腰梯形的性質與計算
  desc: 利用等腰梯形底角相等、對角線等長、作雙高或對角線垂直條件求梯形邊長、對角線與面積。
- code: T08
  name: 一般梯形的平移與面積
  desc: 透過平移一腰作平行四邊形、作高、面積分割或摺疊方式，求一般梯形的邊長、高、角度與面積。
