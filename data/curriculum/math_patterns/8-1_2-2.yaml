unit:
  grade: 8
  semester: 1
  code: 2-2
  title: 根式的運算
  other_titles: []
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 425
types:
- code: T01
  name: 最簡根式與同類方根判別
  desc: 判斷根式是否為最簡根式，或判別化簡後是否為同類方根。
- code: T02
  name: 根式的乘除運算
  desc: 進行單項方根或分數方根的乘法、除法與連乘除化簡運算。
- code: T03
  name: 根式的加減運算
  desc: 先將各項根式化為最簡根式後，再進行同類方根的合併與加減計算。
- code: T04
  name: 乘法公式與分配律運算
  desc: 利用多項式乘法分配律、平方差公式或完全平方公式展開並化簡根式。
- code: T05
  name: 分母有理化與分式運算
  desc: 利用乘上共軛根式進行雙項分母有理化，或進行含根號分式的通分與化簡。
- code: T06
  name: 分母有理化的連鎖相消
  desc: 將連續多個根式分式分別進行分母有理化後，正負項前後抵消求其總和。
- code: T07
  name: 根式的四則混合運算
  desc: 包含括號、乘除、加減與分母有理化的綜合性混合四則運算。
- code: T08
  name: 根式方程式與代數式求值
  desc: 求解含根號的一元一次方程式，或利用根式條件式、整數與小數部分求代數式的值。
- code: T09
  name: 方根運算與近似值
  desc: 利用方根的倍數變換與運算規則，由已知根式近似值推算其他根式的近似值。
- code: T10
  name: 根式的大小比較
  desc: 利用平方比較法、倒數有理化或差值分析等方式比較含方根式子的大小關係。
- code: T11
  name: 根式的幾何與情境應用
  desc: 運用根式的四則運算求解平面圖形的邊長、周長、面積或日常生活情境問題。
