  title: 指數律
  other_titles: []
status: draft
model: gemini-3.7-flash(batch)
sampled: 233
unit_questions: 243
types:
- code: T01
  name: 指數意義與正負符號判定
  desc: 判斷零次方、底數含負號與括號的運算結果或符號正負性質。
- code: T02
  name: 同底數乘除運算與倍數
  desc: 運用同底數相乘指數相加、同底數相除指數相減化簡算式或求倍數關係。
- code: T03
  name: 乘方的乘方與底數變換
  desc: 運用次方的次方相乘法則 $(a^m)^n = a^{mn}$ 進行化簡，或將合數底數轉換為質數的次方（如 $4^3 = (2^2)^3 = 2^6$、$9^5 = 3^{10}$）以進行同底數運算或求指數未知數。
- code: T11
  name: 積與商的乘方展開
  desc: 運用積或商的乘方分配法則 $(ab)^n = a^n b^n$ 與 $(\frac{a}{b})^n = \frac{a^n}{b^n}$ 將括號乘方展開，或將合數底數質因數分解後展開（如 $24^5 = (2^3 \times 3)^5 = 2^{15} \times 3^5$），進而化簡多項質因數乘積的式子。
- code: T12
  name: 同指數的乘除合併與化簡
  desc: 逆向運用積與商的指數律 $a^n \times b^n = (ab)^n$ 或 $a^n \div b^n = (a \div b)^n$，將具有相同指數（或藉由拆項湊出同指數）的各項底數先行相乘、相除或分數約分，以大幅簡化大次方運算並求值。
- code: T04
  name: 指數與四則混合運算
  desc: 結合指數律與整數或分數之加減乘除混合運算求出具體數值。
- code: T05
  name: 乘方相加減與提出公因式
  desc: 將相同或相近的乘方連加、連減，透過合併同類項或提出公因式進行化簡。
- code: T06
  name: 大數與同底同指數比較大小
  desc: 透過將數值化為相同底數或相同指數，比較多個龐大乘方數值的大小。
- code: T07
  name: 分數與負數乘方大小比較
  desc: 依據底數正負、絕對值大小及次方之奇偶性，比較分數乘方的大小順序。
- code: T08
  name: 指數方程式與求未知數
  desc: 將等式兩邊底數化為相同後，藉由比對指數列出一元一次方程式求未知數。
- code: T09
  name: 位數與末位數字規律問題
  desc: 利用因數2與5配對成10計算展開後的位數、末尾零的個數或末位數循環規律。
- code: T10
  name: 指數律的日常生活應用
  desc: 結合細胞分裂、電腦容量換算或週期倍增等生活情境建立乘方模型求解。
refined:
- 拆分 T03 乘方的乘方與積商乘方（63 題）→ T03 乘方的乘方與底數變換、T11 積與商的乘方展開、T12 同指數的乘除合併與化簡
