unit:
  grade: 7
  semester: 1
  code: 2-4
  title: 指數律
  other_titles: []
status: draft
model: gemini-3.7-flash(batch)
sampled: 233
unit_questions: 243
types:
- code: T01
  name: 指數意義與正負符號判定
  desc: 判斷零次方、底數含負號與括號的運算結果或符號正負性質。
- code: T02
  name: 同底數乘除運算與倍數
  desc: 運用同底數相乘指數相加、同底數相除指數相減化簡算式或求倍數關係。
- code: T03
  name: 乘方的乘方與積商乘方
  desc: 運用指數律之次方的次方相乘，或積與商的次方分配進行化簡與計算。
- code: T04
  name: 指數與四則混合運算
  desc: 結合指數律與整數或分數之加減乘除混合運算求出具體數值。
- code: T05
  name: 乘方相加減與提出公因式
  desc: 將相同或相近的乘方連加、連減，透過合併同類項或提出公因式進行化簡。
- code: T06
  name: 大數與同底同指數比較大小
  desc: 透過將數值化為相同底數或相同指數，比較多個龐大乘方數值的大小。
- code: T07
  name: 分數與負數乘方大小比較
  desc: 依據底數正負、絕對值大小及次方之奇偶性，比較分數乘方的大小順序。
- code: T08
  name: 指數方程式與求未知數
  desc: 將等式兩邊底數化為相同後，藉由比對指數列出一元一次方程式求未知數。
- code: T09
  name: 位數與末位數字規律問題
  desc: 利用因數2與5配對成10計算展開後的位數、末尾零的個數或末位數循環規律。
- code: T10
  name: 指數律的日常生活應用
  desc: 結合細胞分裂、電腦容量換算或週期倍增等生活情境建立乘方模型求解。
