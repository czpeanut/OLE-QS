unit:
  grade: 8
  semester: 2
  code: 1-2
  title: 等差級數
  other_titles: []
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 314
types:
- code: T01
  name: 等差級數求和基本運算
  desc: 依題目給定的首項、公差、末項或項數，直接代入公式計算等差級數的總和。
- code: T02
  name: 知級數和反求基本條件
  desc: 已知等差級數的總和及部分條件，反求數列的首項、公差、末項或項數。
- code: T03
  name: 利用等差中項與對稱性求和
  desc: 利用等差中項或首尾對稱項和相等的性質，快速求出等差級數和或特定項。
- code: T04
  name: 兩數間插入數的級數問題
  desc: 在兩已知數之間插入若干數使其成等差數列，求插入數的和、項數或公差。
- code: T05
  name: 級數和與第n項之關係轉換
  desc: 利用前n項和關係式Sn求第n項an、兩級數和的比值與項之比轉換等關係解題。
- code: T06
  name: 奇偶項與分段級數和問題
  desc: 題目涉及奇數項和與偶數項和的差與關係，或前段、後段等區段和的運算。
- code: T07
  name: 等差級數和的最大與最小值
  desc: 透過數列各項的正負轉折點，求等差級數前n項和的最大值、最小值或正負變化。
- code: T08
  name: 範圍內倍數與餘數的級數和
  desc: 計算指定數值區間內滿足特定倍數或同餘條件之所有整數等差級數總和。
- code: T09
  name: 生活情境應用問題
  desc: 應用於座位排列、儲蓄計畫、分期付款、運動訓練里程等生活情境的等差級數問題。
- code: T10
  name: 圖形堆疊與規律計數應用
  desc: 涉及積木與杯子堆疊、撲克牌塔、磁磚鋪設或同心多邊形圍圈等幾何圖形規律總數。
- code: T11
  name: 各項線性變換與級數概念
  desc: 涉及等差級數定義辨析，或各項同時加減常數、乘上倍數後新級數和的變化。
