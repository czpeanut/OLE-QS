unit:
  grade: 8
  semester: 1
  code: 4-3
  title: 應用問題
  other_titles:
  - 一元二次方程式的應用
status: draft
model: gemini-3.7-flash(batch)
sampled: 258
unit_questions: 260
types:
- code: T01
  name: 數的運算與連續數問題
  desc: 涉及連續整數、奇偶數的平方和或乘積，以及年齡運算、看錯運算等純數字關係的應用題。
- code: T02
  name: 單價數量與分裝問題
  desc: 涉及購買商品（單價與數量之關係及找零）或將物品、人數進行分盒、分組的應用題。
- code: T03
  name: 調價促銷與產銷增減問題
  desc: 涉及單價每調漲/調降一定金額則銷售量增減，或果樹增植導致單株產量遞減以求總營收或利潤的題型。
- code: T04
  name: 團體集資與費用分攤問題
  desc: 涉及聚餐、旅遊或合購禮物時，因參加人數增加或減少導致每人平均分攤金額變動的題型。
- code: T05
  name: 單循環賽與互贈配對問題
  desc: 涉及單循環賽制比賽總場數計算，或每人相互贈送禮物、評審與選手試吃配對等組合乘積題型。
- code: T06
  name: 幾何圖形面積與邊長變化
  desc: 涉及長方形、正方形的長寬增減、面積總和與剪角摺盒容積等幾何圖形邊長與面積關係題型。
- code: T07
  name: 道路與花圃步道問題
  desc: 涉及在長方形或正方形土地內部開闢等寬的十字形、外圍或周圍道路以計算路寬或剩餘面積的題型。
- code: T08
  name: 圍籬與靠牆面積問題
  desc: 涉及利用固定長度鐵絲或竹籬（包含靠牆不需圍籬或中間加隔道）圍出長方形區域以求邊長或面積的題型。
- code: T09
  name: 直角三角形與畢氏定理
  desc: 涉及直角三角形三邊長關係、邊長增減後形成直角三角形（利用畢氏定理列式）或坐標平面直角三角形的題型。
- code: T10
  name: 黃金比例與黃金矩形
  desc: 涉及黃金矩形（剪去正方形後長寬比不變）以及黃金比例身材（肚臍上下比例穿高跟鞋）的題型。
- code: T11
  name: 速率、距離與物理應用
  desc: 涉及相向或同向運動、速率改變影響抵達時間，或是自由落體公式計算等物理與行程應用題。
- code: T12
  name: 方程式整數解與質數解探討
  desc: 涉及一元二次方程式的兩根為質數、整數或相反數等條件，反求未知係數的代數應用題型。
