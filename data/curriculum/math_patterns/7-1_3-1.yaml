unit:
  grade: 7
  semester: 1
  code: 3-1
  title: 式子的運算
  other_titles:
  - 以符號列式與運算
  - 代數式的化簡
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 369
types:
- code: T01
  name: 代數式的簡記與基本概念
  desc: 判斷乘除符號的簡記規則、一元一次式的定義或辨識式子中的項與係數。
- code: T02
  name: 代數式求值
  desc: 將給定的數值代入代數式中計算其值、完成求值表格或比較求值後的大小。
- code: T03
  name: 同類項合併與單層去括號
  desc: 進行無括號或單層乘法分配律展開後的一元一次式同類項加減合併化簡。
- code: T04
  name: 含多重括號的代數式化簡
  desc: 含有小括號、中括號（或多重括號）的一元一次式去括號與化簡運算。
- code: T05
  name: 分數型代數式的化簡與除錯
  desc: 進行分數型一元一次式的通分加減化簡，或診斷化簡過程中的去分母迷思。
- code: T06
  name: 連續數與位值問題列式
  desc: 將連續整數、連續奇偶數，或二位數、三位數的位值及數字對調關係以代數式表示並化簡。
- code: T07
  name: 買賣折扣與促銷利潤列式
  desc: 以商品買賣為情境，處理成本、定價、售價、折扣（打折、減價、滿額折抵、多件優惠）、價格調漲前後差價、促銷標語與代數式的互推，以及利潤賺賠（盈虧）計算之列式。
- code: T09
  name: 年齡與數量倍數關係列式
  desc: 包含年齡在過去、現在、未來等時間推移下的關係列式，以及兩量或多量之間「A 是 B 的幾倍多/少幾」的正推與逆推表示式（如已知父求子、身高/體重倍數關係、男女生比例關係、文字代數敘述判讀等）。
- code: T10
  name: 日常計量、平均與分配列式
  desc: 包含不同面額硬幣與鈔票的總金額計算、多人分攤花費或成績總分與平均計算、物品平分給若干人且有剩餘或不足之列式，以及繩子摺段量深、竹竿入水、每天進度剩餘量與行程等生活情境的數量關係列式。
- code: T08
  name: 幾何圖形的周長與面積列式
  desc: 根據長方形、三角形或直角多邊形等幾何圖形條件，以代數式表示周長或面積並化簡。
refined:
- 拆分 T07 生活情境與數量關係列式（139 題）→ T07 買賣折扣與促銷利潤列式、T09 年齡與數量倍數關係列式、T10 日常計量、平均與分配列式
