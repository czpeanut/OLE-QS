unit:
  grade: 8
  semester: 2
  code: 3-1
  title: 內角與外角
  other_titles:
  - 三角形與多邊形的內角與外角
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 399
types:
- code: T01
  name: 餘角、補角與對頂角
  desc: 利用餘角相加為90度、補角相加為180度或對頂角相等的定義進行角度計算與代數求解。
- code: T02
  name: 三角形內角和與外角定理
  desc: 利用三角形內角和等於180度、外角等於兩內對角和或外角和為360度計算單一三角形的角度與比例。
- code: T03
  name: 外角定理之幾何圖形應用
  desc: 利用外角定理處理飛鏢形（凹四邊形）、蝴蝶形（X字交叉）或三角形摺疊後角平分與角度變化問題。
- code: T04
  name: 三角形角平分線夾角
  desc: 利用三角形內角平分線或外角平分線相交所形成夾角與原頂角的幾何關係求角度。
- code: T05
  name: 等腰三角形相連求角
  desc: 利用圖形中多個等腰三角形相鄰排列或折線段等長，依序由外角定理推導未知角度。
- code: T06
  name: 多邊形路徑轉彎問題
  desc: 計算人、車或物體沿著折線或多邊形步道行進時，每次轉折的外角與旋轉總角度。
- code: T07
  name: 多邊形內角和與外角和
  desc: 由頂點連對角線分割三角形推導公式，利用內角和 (n-2)×180度 與外角和為360度求邊數或角度。
- code: T08
  name: 正多邊形內外角與平面鑲嵌
  desc: 計算正n邊形的一個內角或外角大小、內外角比值，以及利用內角和為360度的倍數判斷平面密鋪。
- code: T09
  name: 正多邊形拼接組合求角
  desc: 計算多個正多邊形共用一邊、共頂點相交或正多邊形內部連線所構成的幾何夾角。
- code: T10
  name: 星形與多芒角角度和
  desc: 利用三角形外角將五角星、七角星或多邊形突出的多個尖角轉移並求出角度總和。
