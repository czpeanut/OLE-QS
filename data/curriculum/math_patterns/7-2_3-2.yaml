unit_questions: 308
types:
- code: T01
  name: 正反比的代數關係式與概念判別
  desc: 給定代數方程式（如 $ax+by=0$、$xy=k$）、比例式（如 $x:a=y:b$、$x:a=b:y$）或概念敘述（如「$x$ 增加 $y$ 亦增加是否為正比」），判斷兩變數是否為正比、反比或非正反比關係。
- code: T11
  name: 日常生活與幾何情境的正反比判別
  desc: 以文字情境描述生活情境（如單價與總價、年齡、晝夜長短、打折）或幾何圖形關係（如圓半徑與面積、長方形周長/面積與長寬、三角形底與高），判斷兩變數為正比、反比或不成正反比。
- code: T12
  name: 數據表格的正反比判別
  desc: 給定 $x$ 與 $y$ 的數組對應表格，透過計算並檢驗其比值（$\frac{y}{x}$）是否為定值或乘積（$x \cdot y$）是否為定值，藉此判斷表格中兩變數成正比、反比或無正反比關係。
- code: T02
  name: 正比基本關係式與求值
  desc: 已知 y 與 x 成正比及一組對應值，求正比關係式 y=kx、特定數值或坐標圖形問題。
- code: T03
  name: 反比基本關係式與求值
  desc: 已知 y 與 x 成反比及一組對應值，求反比關係式 xy=k 或特定數值。
- code: T04
  name: 一次式與變形正反比
  desc: 已知兩一次式或多項式（如 ax+b 與 cy+d）成正比或反比，求關係式或代入求值。
- code: T05
  name: 多變數連鎖正反比
  desc: 題幹給出三個以上變數間的正反比連鎖關係（如 x 與 y、y 與 z），求跨變數關係或求值。
- code: T06
  name: 正反比的增減倍數變化
  desc: 已知兩數成正比或反比，求某一變數增加或減少特定百分比時，另一變數的倍數變化。
- code: T07
  name: 彈簧伸長量問題
  desc: 利用彈性限度內彈簧伸長量與所掛物重成正比，由原長與不同載重求未知長度或重量。
- code: T08
  name: 工程與工作量問題
  desc: 工作總量固定下，利用工作人數與完工日數（或時數）成反比，求提前完工需增減的人數或天數。
- code: T09
  name: 速率、時間與齒輪問題
  desc: 距離固定下速率與時間成反比，或相接齒輪之齒數與轉數成反比的情境應用與比值計算。
- code: T10
  name: 正反比生活與幾何應用
  desc: 包含面積、體積、重量單價、利息、平方正反比（如落體或披薩面積）等各類生活情境應用題。
