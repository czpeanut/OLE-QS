unit:
  grade: 8
  semester: 2
  code: 3-3
  title: 三角形的全等性質
  other_titles:
  - 三角形全等
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 429
types:
- code: T01
  name: 全等對應關係與數值計算
  desc: 已知三角形或多邊形全等，利用對應頂點、對應邊相等或對應角相等列式求邊長、角度或周長。
- code: T02
  name: 全等性質的判別與條件判斷
  desc: 判斷給定條件符合哪種全等性質（SSS、SAS、ASA、AAS、RHS）、判斷需補足何條件才能全等或辨識碎片還原圖形。
- code: T03
  name: SSA不全等與多解討論
  desc: 探討兩邊及一對應非夾角（SSA）不一定全等的反例，或由此求出該角可能為銳角與鈍角之度數雙解問題。
- code: T04
  name: 等腰三角形與全等性質應用
  desc: 利用全等性質推導或應用等腰三角形三線合一（頂角平分線、底邊高、中線）及多個等腰連鎖邊角計算。
- code: T05
  name: 直角三角形全等與RHS性質
  desc: 利用斜邊與一股對應相等（RHS）或其他直角三角形專用條件判定全等並進行幾何邊長或面積計算。
- code: T06
  name: 共頂點旋轉全等模型
  desc: 兩正三角形、正方形或等腰三角形共一頂點旋轉形成之手拉手全等三角形判定與邊角計算。
- code: T07
  name: 一線三垂直與坐標系全等
  desc: 正方形或等腰直角三角形頂點在一線上作垂線（K字型/一線三垂直）或於坐標平面求頂點坐標與距離。
- code: T08
  name: 正多邊形截線與內接全等
  desc: 正三角形或正方形內部內接另一正多邊形，或在各邊截取等長線段所形成的對稱全等三角形周長與面積問題。
- code: T09
  name: 角平分線性質與全等面積
  desc: 利用角平分線上的點到兩邊等距離或構造垂直全等三角形，求線段長度、三角形面積或面積比。
- code: T10
  name: 幾何圖形摺疊與對稱全等
  desc: 長方形、三角形或多邊形沿線段對摺，利用摺疊前後圖形全等求重疊線段長、角度或三角形周長。
