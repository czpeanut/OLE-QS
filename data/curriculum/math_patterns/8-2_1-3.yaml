unit:
  grade: 8
  semester: 2
  code: 1-3
  title: 等比數列
  other_titles: []
status: draft
model: gemini-3.7-flash(batch)
sampled: 273
unit_questions: 278
types:
- code: T01
  name: 等比數列的定義與性質判斷
  desc: 判斷給定數列是否為等比數列、求基本公比，或探討數列各項變換（乘常數、倒數、項次跳躍）後的新公比與性質
- code: T02
  name: 等比數列的規律填空與相鄰項求解
  desc: 給出包含空格或未知數的等比數列片段，利用相鄰兩項的比求出公比，進而由前後項乘除公比填入空格中的數值，或解出數列中相鄰連續項（如 a、b、c）之值與其運算。
- code: T09
  name: 求等比數列的指定項與首項
  desc: 已知等比數列的首項與公比（或給出前幾項），利用一般項公式 a_n = a_1 * r^(n-1) 計算指定第 n 項之值、特定兩項的差或和，或已知第 n 項與公比反求首項 a_1。
- code: T10
  name: 求等比數列的項數與項值範圍
  desc: 已知等比數列的首項與公比，給定數值求其為此數列的第幾項、判斷某數是否屬於該數列，或利用乘冪大小比較求數列從第幾項開始大於或小於某一特定數值。
- code: T03
  name: 利用等比數列任意兩項解題
  desc: 已知等比數列中任意兩非相鄰項（如已知第 3 項與第 7 項），透過項次差求公比、首項或其他指定項
- code: T04
  name: 等比中項與未知數求解
  desc: 已知兩數求其等比中項，或連續三項（含一元代數式）成等比數列，利用等比中項關係式列式求未知數
- code: T05
  name: 等比數列的乘積性質
  desc: 利用等比數列對稱項乘積相等（如 a₁×a₅＝a₂×a₄＝a₃²）的性質，求各項連乘積或項與項之間的乘積關係
- code: T06
  name: 等差與等比數列的混合問題
  desc: 題目同時包含等差與等比條件，或將數列各項增減某數後在等差與等比數列之間轉換的聯立求解題
- code: T07
  name: 等比數列的生活情境應用
  desc: 涉及細菌分裂、病毒傳播（R0值）、球的反彈高度、紙張厚度／折疊、繩子連續剪裁、半衰期或複利等生活情境問題
- code: T08
  name: 等比幾何圖形與碎形規律
  desc: 涉及正方形中點連線、謝爾賓斯基三角形、科赫曲線或階梯方格填數等幾何圖形的長度、面積或數量變化的規律題
refined:
- 拆分 T02 求等比數列的指定項與項數（67 題）→ T02 等比數列的規律填空與相鄰項求解、T09 求等比數列的指定項與首項、T10 求等比數列的項數與項值範圍
