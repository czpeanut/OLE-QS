unit:
  grade: 9
  semester: 1
  code: 1-2
  title: 比例線段
  other_titles: []
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 415
types:
- code: T01
  name: 三角形平行截線求線段長
  desc: 在三角形中給定一邊的平行線，利用平行線截線段成比例（如上比全、上比下）計算邊長或未知數。
- code: T02
  name: 平行線截比例線段的判別
  desc: 給定三角形邊上的比例關係或長度，判斷兩線段是否平行或何者無法確定平行（逆定理判別）。
- code: T03
  name: 多條平行線截比例線段
  desc: 三條或三條以上平行線被兩條截線所截，利用對應線段成比例求線段長、比例或代數式。
- code: T04
  name: 梯形內的平行截線
  desc: 梯形中平行於兩底的內部線段，利用平行線截比例、作平行四邊形或連對角線求中間線段長或腰長比例。
- code: T05
  name: 複合平行線截比例線段
  desc: 圖形中包含兩組或兩組以上的平行線，需透過兩次比例線段傳遞推導邊長關係或求未知線段。
- code: T06
  name: 中點連線性質與應用
  desc: 利用三角形兩邊中點連線長度等於第三邊的一半且平行，或梯形兩腰／對角線中點連線性質求解。
- code: T07
  name: 同高三角形面積與線段比
  desc: 利用同高三角形面積比等於底邊長度比的性質，求三角形或多邊形的面積、面積比或分割比例。
- code: T08
  name: 比例線段尺規作圖
  desc: 利用平行線截比例線段性質在線段上作出指定比例分點，或判讀尺規作圖步驟與所求比例。
- code: T09
  name: 比例線段的坐標與生活應用
  desc: 結合直角坐標系（求分點坐標、直線截線）或生活情境（如水桶水面寬、蹺蹺板高度、交叉支架等）應用求解。
