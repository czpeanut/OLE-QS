unit:
  grade: 7
  semester: 1
  code: 1-1
  title: 正數與負數
  other_titles:
  - 負數與數線
  - 數與數線
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 487
types:
- code: T01
  name: 正負數與基準量應用
  desc: 以特定數值為基準（如海平面、平均分數、時間等），判斷或計算相對應的正負數表示法。
- code: T02
  name: 數線的繪製與坐標判讀
  desc: 在數線上標出指定點、判讀數線上點的坐標，或判斷分數與小數在數線上所需的等分數。
- code: T03
  name: 相反數的意義與化簡
  desc: 求某數的相反數、進行多重性質符號的化簡，或判斷相反數的基本觀念與性質。
- code: T04
  name: 絕對值的意義與數值計算
  desc: 依據絕對值的定義求值、進行含絕對值的基礎四則計算，或判斷絕對值觀念的正誤。
- code: T05
  name: 正負數與絕對值的大小比較
  desc: 比較正數、負數、零或帶有絕對值的數的大小關係與排列順序。
- code: T06
  name: 絕對值不等式與整數計數
  desc: 求滿足絕對值在某個範圍內（如 |x| < k 或 a < |x| < b）的所有整數或整數個數。
- code: T07
  name: 數線上兩點距離與坐標求解
  desc: 利用兩點坐標差的絕對值求線段長度，或已知距離與一點坐標反求另一點坐標。
- code: T08
  name: 數線上的中點與等分點
  desc: 求數線上兩點的中點坐標、對折重合的折點坐標，或線段的等分點坐標。
- code: T09
  name: 數線上點的移動與數線變換
  desc: 處理點在數線上的左右平移、相遇問題，或重新設定原點與單位長後求新坐標。
- code: T10
  name: 絕對值的非負性與條件求值
  desc: 利用絕對值必大於或等於 0 的性質（如 |A| + |B| = 0）或距離條件，求解未知數或推導點的相對位置。
