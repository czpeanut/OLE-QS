unit:
  grade: 7
  semester: 1
  code: 3-2
  title: 解一元一次方程式
  other_titles:
  - 一元一次方程式的列式與求解
  - 一元一次方程式
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 403
types:
- code: T01
  name: 一元一次方程式的判別
  desc: 判斷給定式子是否為一元一次方程式，或辨識未知數次方與等號成立條件。
- code: T02
  name: 方程式解的檢驗與判斷
  desc: 給定數值或未知數，檢驗代入後是否為該一元一次方程式的解。
- code: T03
  name: 等量公理與移項法則運算
  desc: 考查等量公理的四則運算規則、移項變號原理或由逆運算列出解的算式。
- code: T04
  name: 解基礎一元一次方程式
  desc: 求解形如 ax+b=cx+d 等不含括號與分數小數的整數係數一元一次方程式。
- code: T05
  name: 解含括號的一元一次方程式
  desc: 利用去括號與分配律展開化簡後，求解含單重或多重括號的一元一次方程式。
- code: T06
  name: 解含分數或小數的方程式
  desc: 方程式含分數或小數係數，需同乘公倍數去分母或擴大倍數化為整數求解。
- code: T07
  name: 解題步驟除錯與歷程辨析
  desc: 分析解方程式或化簡過程的各步驟，找出何處開始出錯或比較運算合理性。
- code: T08
  name: 已知方程式的解求未知係數
  desc: 已知方程式的解（x 的數值），反代回方程式以求出係數或常數的值。
- code: T09
  name: 同解或特殊解求未知係數
  desc: 已知兩方程式有相同解、解互為相反數等關係，求方程式中的待定係數。
- code: T10
  name: 特殊條件關係列式與求值
  desc: 依題目給定的相反數、倒數、代數式相等或新定義運算符號列出方程式並求解或求代數式的值。
