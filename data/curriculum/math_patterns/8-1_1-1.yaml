unit:
  grade: 8
  semester: 1
  code: 1-1
  title: 乘法公式
  other_titles: []
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 395
types:
- code: T01
  name: 乘法公式的觀念辨析與正誤判斷
  desc: 判斷乘法公式展開式的正確性、辨識解題所適用的公式或找出計算過程中的錯誤步驟
- code: T02
  name: 多項式乘法分配律的數值計算
  desc: 利用多項式分配律 (a+b)(c+d)=ac+ad+bc+bd 及其逆運算進行數值簡化計算
- code: T03
  name: 完全平方公式的數值計算與求值
  desc: 利用和的平方或差的平方公式正向或逆向計算數值、小數與分數平方，或比較展開後的等式缺項
- code: T04
  name: 平方差公式的數值計算與求值
  desc: 利用平方差公式 (a+b)(a-b)=a^2-b^2 正向相乘或逆向求兩數平方差之數值
- code: T05
  name: 乘法公式的代數式展開與化簡
  desc: 含有未知數的多項式利用完全平方、平方差公式進行展開、合併同類項與化簡
- code: T06
  name: 乘法公式變形與對稱式求值
  desc: 已知兩數的和或差與乘積（或倒數關係），利用乘法公式變形求平方和、差的平方或相關代數式之值
- code: T07
  name: 乘法公式的幾何圖形與面積應用
  desc: 利用正方形與長方形的邊長增減、重疊、剪裁拼貼或陰影鋪色區域，結合乘法公式計算面積或列式
- code: T08
  name: 乘法公式的分式化簡與連續消去
  desc: 利用乘法公式對繁複分式進行因式約分，或計算連續平方差相乘的規律消去型題目
- code: T09
  name: 利用乘法公式比較大小與數論應用
  desc: 利用乘法公式比較多組算式數值的大小，或結合質數、因數與倍數等數論性質進行推理求解
