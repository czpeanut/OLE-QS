unit:
  grade: 7
  semester: 1
  code: 1-3
  title: 正負數的乘除
  other_titles:
  - 整數的乘除與四則運算
  - 整數的乘除運算
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 399
types:
- code: T01
  name: 正負數乘除運算與符號判斷
  desc: 題幹為多個正負數的連乘、連除或判斷乘除結果的正負性質符號
- code: T02
  name: 乘除運算性質與算律辨析
  desc: 判斷乘除法的交換律、結合律、分配律等運算規則與等式是否成立
- code: T03
  name: 乘法分配律的簡捷運算
  desc: 利用提出公因數或將數字拆成整百整千，以分配律進行簡化計算
- code: T04
  name: 由已知乘積等式推求式子值
  desc: 題幹給定一組已知連乘或乘法等式，透過變換正負號或倍數求出相關算式的值
- code: T05
  name: 整數四則混合運算
  desc: 包含加減乘除、括號或絕對值的整數多步驟綜合計算
- code: T06
  name: 自訂運算符號求值
  desc: 題目給定非標準的自定義運算符號規則，要求代入整數求出結果
- code: T07
  name: 選數求乘積極值
  desc: 從給定的一組正負整數中任選指定個數相乘，要求最大或最小乘積
- code: T08
  name: 正負符號與大小推理
  desc: 已知多個未知數的乘除乘積正負或大小關係，推理各數的正負符號或大小順序
- code: T09
  name: 測驗計分與倒扣應用題
  desc: 以測驗或競賽為情境，涉及答對得分、答錯倒扣或未答扣分的整數四則應用
- code: T10
  name: 買賣盈虧與生活情境應用
  desc: 涉及商品買賣、成本利潤、促銷折扣或日常生活收支的整數四則運算應用題
