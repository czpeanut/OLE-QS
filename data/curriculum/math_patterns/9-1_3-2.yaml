  code: 3-2
  title: 三角形的外心、內心與重心
  other_titles: []
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 818
types:
- code: T01
  name: 外心性質與位置判斷
  desc: 利用外心為中垂線交點、到三頂點等距之定義，或依銳角、直角、鈍角三角形判斷外心位置。
- code: T02
  name: 外心的角度與半徑計算
  desc: 利用外心角與對角角度關係（2A 或 360°－2A），或求直角、等腰與一般三角形的外接圓半徑。
- code: T03
  name: 內心性質與角度計算
  desc: 利用內心為角平分線交點及角度公式（∠BIC＝90°＋1/2∠A）進行角度推導與計算。
- code: T04
  name: 內切圓半徑與面積計算
  desc: 利用面積公式（Δ＝1/2·r·s）、直角三角形半徑公式（r＝(a＋b－c)/2）或切線長性質求內切圓半徑與面積。
- code: T05
  name: 內心與平行線問題
  desc: 過內心作底邊平行線，結合角平分線形成等腰三角形來求線段長度或周長。
- code: T06
  name: 重心線段長度與比例
  desc: 利用重心將中線分成 2：1 的比例、直角三角形斜邊中線長或中線垂直條件求線段長度。
- code: T07
  name: 重心面積等分與比例
  desc: 利用重心將三角形面積六等分、三等分或結合分點比例求各區域的面積。
- code: T08
  name: 平行四邊形與多邊形重心
  desc: 在平行四邊形或菱形中找出對角線與邊中線交點構成的重心，求線段比例或多邊形面積。
- code: T09
  name: 特殊三角形的三心性質
  desc: 針對正三角形（三心合一且 R：r＝2：1）或等腰三角形（三心共線）進行半徑、高或面積的計算。
- code: T10
  name: 坐標平面與三心綜合
  desc: 在直角坐標系中求外心、內心、重心的坐標，或綜合比較與計算多心之間的距離與面積。
