unit:
  grade: 7
  semester: 1
  code: 1-4
  title: 指數記法與科學記號
  other_titles: []
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 404
types:
- code: T01
  name: 乘方的意義與正負判別
  desc: 題幹要求辨析乘方的記法（底數與指數含義）、計算單一乘方的值，或判斷含負號及括號之乘方（如 $-a^n$ 與 $(-a)^n$）的正負符號。
- code: T02
  name: 含乘方的四則混合運算
  desc: 題幹給出含有乘方、正負號、括號或絕對值的數式，要求依先乘方後乘除、最後加減的運算順序求出算式之值。
- code: T03
  name: 指數律運算與位數求值
  desc: 題幹涉及同底數乘除、乘方的乘方、同指數合併拆解等指數性質運算，或利用 $2^m \times 5^n$ 配對轉化為 $10$ 的次方來求數的位數與未知指數。
- code: T04
  name: 乘方的大小比較
  desc: 題幹給出多個同底不同指、不同底同指、負數乘方或底數介於 $0$ 到 $1$ 之間的乘方算式，要求比較其數值之大小關係。
- code: T05
  name: 乘方的倍數增長與生活應用
  desc: 題幹以細胞分裂、摺紙厚度、多層箱子計數或連乘倍數等生活情境為背景，要求依題意列出乘方算式並求解。
- code: T06
  name: 科學記號的判別與轉換
  desc: 題幹要求判斷算式是否符合科學記號標準形式 $a \times 10^n$（$1 \le |a| < 10$），或將大數、小數、分數、中文字詞（如幾億、百萬分之一）轉化為科學記號。
- code: T07
  name: 科學記號的位數與小數點分析
  desc: 題幹給出科學記號 $a \times 10^n$，要求判斷其乘開展開後是幾位數、末尾有幾個零，或小數點後第幾位開始不為零、指定數字出現在小數點後第幾位。
- code: T08
  name: 科學記號的大小比較與數線
  desc: 題幹給出多個科學記號表示的數（或結合數線圖形標示），要求比較其數值大小、排序或估計數線上對應點的位置。
- code: T09
  name: 科學記號的情境運算與單位換算
  desc: 題幹以奈米微米、發電功率（瓩/瓦）、人口天數、容量體積或機率等生活科技情境為題，要求進行科學記號的乘除加減運算或單位換算。
