unit:
  grade: 7
  semester: 1
  code: 1-2
  title: 正負數的加減
  other_titles:
  - 整數的加減
  - 整數的加減運算
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 323
types:
- code: T01
  name: 整數加減基本運算
  desc: 以純數的同號數加減、異號數加減、去括號法則或簡捷運算為主的計算題。
- code: T02
  name: 含絕對值的數值計算
  desc: 算式中含有絕對值符號，需先化簡絕對值再進行整數加減之題目。
- code: T03
  name: 負帶分數的拆解與加減
  desc: 考查負帶分數轉化為負整數與負真分數之加減運算或等式判斷。
- code: T04
  name: 相反數與絕對值條件求值
  desc: 給定兩數之絕對值大小或互為相反數的條件，求式子之值、可能值或極值。
- code: T05
  name: 正負數加減性質判斷
  desc: 判斷正負數加減後的大小關係、結果正負符號或運算律是否成立的觀念題。
- code: T06
  name: 數線上點的移動
  desc: 描述點在數線上依正負向（左或右）、猜拳或擲骰等規則移動求最後坐標或距離。
- code: T07
  name: 數線上的距離與求點坐標
  desc: 利用兩點差的絕對值求距離，或已知某點坐標與距離反求另一點坐標。
- code: T08
  name: 中點坐標與等分分點問題
  desc: 求數線上兩點的中點坐標、等分點或依速率相向移動相遇點之位置。
- code: T09
  name: 基準量與正負數統計應用
  desc: 以某數值為基準記錄成績、產量、盈虧等增減差值，並求實際值或平均值。
- code: T10
  name: 時區時差與溫差計算
  desc: 涉及國際時區轉換、飛機飛行時間或最高最低氣溫溫差的生活應用題。
- code: T11
  name: 魔方陣與方格填數
  desc: 在九宮格或特定圖形中填數，使其橫列、直行、對角線總和相等以求解未知數。
- code: T12
  name: 整數加減的生活情境應用
  desc: 包含收支賺賠、電梯升降、水位起伏、購票計費等一般生活加減應用題。
