unit:
  grade: 7
  semester: 2
  code: 5-2
  title: 平均數、中位數與眾數
  other_titles: []
status: draft
model: gemini-3.7-flash(batch)
sampled: 230
unit_questions: 240
types:
- code: T01
  name: 原始資料的三大統計量計算
  desc: 由未整理或已排序的原始數值資料，直接求出算術平均數、中位數或眾數。
- code: T02
  name: 基準量法求平均數
  desc: 題目給定各項數據與特定目標值（基準量）的正負差值，利用差值總和求出整體平均數。
- code: T03
  name: 子群合併與加權平均數
  desc: 已知各子群體（如男女生、各年級）的人數與平均數，計算全體合併後的加權平均數或反求某一子群的平均數。
- code: T04
  name: 分組資料與統計圖表的平均數
  desc: 從分組次數分配表、直方圖或折線圖中，以各組組中點乘以次數來計算算術平均數。
- code: T05
  name: 次數分配表與圖表的中位數及眾數
  desc: 從次數分配表、長條圖或圓形圖中，透過累積次數或百分比找出中位數所在的數值、組別，或判讀眾數。
- code: T06
  name: 資料增刪與修改對統計量的影響
  desc: 探討原始數據中有數值抄錯更正、加入新數值或刪除數值後，對平均數、中位數與眾數造成的變化與重新計算。
- code: T07
  name: 依統計量逆求未知數或缺漏次數
  desc: 已知一組資料的平均數、中位數或眾數，列方程式反求資料中的未知數或統計表中被污損、遺漏的次數。
- code: T08
  name: 前後子群平均求中位數
  desc: 給定由小到大排列之數列的全體平均，以及前若干數與後若干數的局部平均，利用重疊或總和差求出中位數。
- code: T09
  name: 抽球分組與連續數列統計推論
  desc: 涉及將連續編號球抽放分箱求箱內號碼中位數/球數，或連續整數刪去一數求原數等結合排序邏輯的推論題。
- code: T10
  name: 統計量概念理解與性質判斷
  desc: 考查平均數、中位數與眾數的定義特性、極端值影響、平移加分效應及統計圖表判讀敘述的正誤。
