unit:
  grade: 8
  semester: 1
  code: 4-1
  title: 因式分解法解一元二次方程式
  other_titles:
  - 因式分解解一元二次方程式
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 388
types:
- code: T01
  name: 一元二次方程式的定義與辨識
  desc: 判斷式子是否為一元二次方程式，或依二次項係數不為零求未知數條件。
- code: T02
  name: 解的意義與檢驗
  desc: 利用 AB=0 性質判斷解的觀念，或檢驗特定數值是否為該方程式的解。
- code: T03
  name: 已知方程式的解求係數或代數式值
  desc: 已知方程式的一根，將其代入求未知係數、求另一根或求代數式降次後的值。
- code: T04
  name: 解方程式的迷思與步驟除錯
  desc: 判斷解題過程中除以含未知數的式子導致漏解、開根號漏正負號等步驟錯誤。
- code: T05
  name: 提公因式法解方程式
  desc: 利用提出單項式公因數或多項式公因式，將方程式化為 A·B=0 求解。
- code: T06
  name: 乘法公式法解方程式
  desc: 利用平方差公式或完全平方式將方程式化為乘積型或平方型求解。
- code: T07
  name: 十字交乘法解方程式
  desc: 方程式已為一般式 ax²+bx+c=0，直接利用十字交乘法分解求解。
- code: T08
  name: 展開整理後再因式分解
  desc: 方程式等號右邊不為 0（如 (x-a)(x-b)=k），須先去括號展開並移項整理後再分解求解。
- code: T09
  name: 換元法解一元二次方程式
  desc: 方程式含有重複出現的多項式結構，透過變數代換（換元）簡化後求解。
- code: T10
  name: 由兩根反求方程式或係數
  desc: 已知方程式的兩根，逆推原方程式、求未知係數或修正看錯係數的問題。
- code: T11
  name: 兩方程式的共同解問題
  desc: 題目給定兩個一元二次方程式且已知它們有共同根，求該共同解或相關未知係數。
- code: T12
  name: 解為整數或質數的條件探討
  desc: 已知方程式的根具有整數、質數或合數等條件，探討未知參數的可能值或個數。
