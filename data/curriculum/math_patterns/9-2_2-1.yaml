unit:
  grade: 9
  semester: 2
  code: 2-1
  title: 四分位數與盒狀圖
  other_titles:
  - 資料的分析
  - 統計數據的分布
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 481
types:
- code: T01
  name: 未分組資料的四分位數與全距計算
  desc: 給予一組未分組的離散數值資料，透過排序與位置公式計算其全距、第一/二/三四分位數及四分位距。
- code: T02
  name: 統計圖表求四分位數所在組別
  desc: 由次數分配表、長條圖、直方圖或累積次數折線圖中累積人數，判斷或求出四分位數與四分位距。
- code: T03
  name: 四分位數未知數與等差數列應用
  desc: 資料含有未知數或數列呈現等差規律，配合平均數、眾數、四分位數或四分位距等條件列式求解。
- code: T04
  name: 數據平移伸縮對統計量的影響
  desc: 將整組資料進行加減常數或放大縮小等線性變換，判斷平均數、四分位數、全距與四分位距的變化情形。
- code: T05
  name: 盒狀圖的繪製與圖表對應轉換
  desc: 根據原始數據、次數分配表或長條圖等繪製盒狀圖，或從選項中辨識對應正確的盒狀圖。
- code: T06
  name: 單一盒狀圖判讀與統計量求值
  desc: 由單一盒狀圖讀取五數綜合指標（最小值、Q1、Q2、Q3、最大值），計算全距與四分位距，或判斷可否由圖確認特定統計量。
- code: T07
  name: 盒狀圖之人數比例與排名推估
  desc: 利用單一盒狀圖的四分位距分區概念，推算特定數值在該群體中的排名範圍、人數比例或至少人數。
- code: T08
  name: 多組盒狀圖之比較與跨組分析
  desc: 比較兩組或多組盒狀圖的中位數、全距、四分位距或分散程度，或分析相同分數在不同群體中的表現與名次高低。
- code: T09
  name: 母體與子群體盒狀圖關聯推算
  desc: 同時給出全校（母體）與個別班級（子群體）的盒狀圖，由班級四分位數推算全校排名，或由全校四分位數推算班級排名。
- code: T10
  name: 統計量定義與數據增刪的推理判斷
  desc: 判斷四分位數相關觀念敘述的正確性，或分析新增、刪除、更正部分數據後對各統計量產生的影響與機率問題。
