unit:
  grade: 8
  semester: 2
  code: 3-5
  title: 三角形的邊角關係
  other_titles: []
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 324
types:
- code: T01
  name: 三角形形成條件的判斷
  desc: 判斷給定的三數或線段長度組合是否能圍成三角形或直角三角形。
- code: T02
  name: 求邊長或未知數的範圍
  desc: 利用兩邊之和大於第三邊、兩邊之差小於第三邊，求第三邊長或代數未知數的取值範圍。
- code: T03
  name: 整數邊長與周長問題
  desc: 已知邊長為整數或周長固定，求滿足條件的三角形（或等腰三角形）個數與邊長組合。
- code: T04
  name: 三角形邊長絕對值化簡
  desc: 利用三角形三邊長的不等關係，判斷正負號以化簡含絕對值或根號平方的代數式。
- code: T05
  name: 三角形大邊對大角與大角對大邊
  desc: 在單一三角形中，已知三邊長（或長度比例）比較內角大小，或已知內角、外角度數比較邊長大小的基礎性質判斷與大小排序。
- code: T10
  name: 利用邊角關係求角度或未知數範圍
  desc: 在單一三角形中，已知邊長大小順序與部分內角度數（或含未知數的代數式），結合「大邊對大角」與「內角和為 180°」列不等式求解特定內角度數或未知數的取值範圍，或判斷角的銳鈍性質。
- code: T11
  name: 邊角關係的情境與幾何應用
  desc: 包含利用三角形面積求「大邊對小高」與重疊圖形的高之大小比較，以及生活情境題（如由方位角轉化為三角形內角比較滑行距離、等速繞行三角形之相遇點位置判斷等）。
- code: T06
  name: 複合圖形中的邊角比較
  desc: 在四邊形或多個相連三角形中，透過共用邊與多步驟傳遞比較多條線段或多個角的大小順序。
- code: T07
  name: 三角形中線與邊長範圍
  desc: 涉及三角形中線長度，利用倍長中線構造三角形以求中線長或相關邊長的範圍。
- code: T08
  name: 頂點畫弧截線的邊角比較
  desc: 以三角形頂點為圓心、邊長為半徑畫弧交於底邊，利用邊角關係比較所截線段或內部連線長短。
- code: T09
  name: 樞紐定理與逆樞紐定理
  desc: 兩三角形有兩組邊對應相等時，利用夾角大小判斷第三邊大小，或由第三邊大小判斷夾角大小。
refined:
- 拆分 T05 單一三角形的邊角關係（92 題）→ T05 三角形大邊對大角與大角對大邊、T10 利用邊角關係求角度或未知數範圍、T11 邊角關係的情境與幾何應用
