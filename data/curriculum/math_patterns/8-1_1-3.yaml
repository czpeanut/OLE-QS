unit:
  grade: 8
  semester: 1
  code: 1-3
  title: 多項式的乘除
  other_titles:
  - 多項式的乘法與除法
  - 多項式的乘除運算
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 370
types:
- code: T01
  name: 多項式乘除的次數與餘式性質
  desc: 判斷兩多項式相乘或相除後，其乘積、商式與餘式的次數關係，或判斷餘式的可能形式與性質。
- code: T02
  name: 多項式乘法展開與特定項係數
  desc: 利用分配律將多項式相乘展開，或由展開式求解特定次數項係數、常數項及所有項係數總和。
- code: T03
  name: 多項式乘法公式與混合運算
  desc: 結合乘法公式進行多項式的加減乘混合運算，或利用給定條件代入進行化簡與求值。
- code: T04
  name: 多項式除法運算求商式與餘式
  desc: 進行多項式除以單項式或多項式長除法運算，包含缺項補零與升降冪排列，直接求出商式與餘式。
- code: T05
  name: 利用除法原理求未知多項式
  desc: 已知被除式、除式、商式與餘式中的部分條件，利用「被除式＝除式×商式＋餘式」逆推求解未知的多項式。
- code: T06
  name: 多項式整除與求未知係數
  desc: 多項式能被某式整除或除以某式已知餘式，藉由除法運算或餘式條件列式求解多項式中的未知係數。
- code: T07
  name: 多項式直式除法係數還原
  desc: 題目給出殘缺、挖空或以符號代換係數的直式除法運算過程，逆推還原各步驟中的未知數值。
- code: T08
  name: 除法關係式的倍數變換
  desc: 已知多項式除法的商式與餘式，探討被除式或除式擴大、縮小倍數或線性變換後，新商式與新餘式的變化。
- code: T09
  name: 多項式乘除的幾何圖形應用
  desc: 利用多項式乘除運算表示或求解幾何圖形（如長方形、三角形、梯形）的邊長、高、周長或重疊與拼貼面積。
