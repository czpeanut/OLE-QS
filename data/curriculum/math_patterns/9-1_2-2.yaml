  semester: 1
  code: 2-2
  title: 圓心角與圓周角
  other_titles:
  - 圓心角、圓周角與弧的關係
  - 弧與圓周角
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 547
types:
- code: T01
  name: 圓心角、弧度數與弦之關係
  desc: 題目的解題核心為圓心角度數等於所對弧的度數、優劣弧度數關係（如大弧加小弧為 360°）、同一圓或同心圓中圓心角與弧度數/弦長之性質判斷與度數計算（例如弦長等於半徑時圓心角為 60°、多邊形頂點等分圓周之圓心角、不等圓中弧度數相等但長度不等之觀念題），不涉及具體弧長長度（如包含 π 的長度）或扇形面積的代數運算。
- code: T10
  name: 扇形弧長、周長與面積計算
  desc: 題目的解題核心為利用扇形弧長公式 L=2πr(θ/360°)、面積公式 A=πr²(θ/360°)=(1/2)rL 及周長公式，在給定半徑、圓心角、弧長、面積或周長等條件下互相求值，或計算同心圓中同圓心角所對的弧長與環狀扇形面積，圖形為靜態的幾何扇形或同心圓弧。
- code: T11
  name: 旋轉動態與圓弧生活情境應用
  desc: 題目以生活情境或動態幾何為背景，解題核心為物體運動所掃過的圓弧軌跡與圓心角關係。包含多邊形繞固定頂點旋轉時頂點移動的路徑長、時鐘時針與分針夾角/旋轉量、單擺與節拍器擺動、圓形或扇形在地面無滑動滾動（移動距離等於接觸弧長）、齒輪鏈條傳動及操場跑道差等應用問題。
- code: T02
  name: 弓形與組合圖形面積
  desc: 以扇形、三角形相加減求弓形面積，或計算重疊、摺疊、磁磚花紋等鋪色區域之周長與面積。
- code: T03
  name: 圓周角與圓心角度數求值
  desc: 利用「圓周角度數為所對弧度數的一半」及同弧所對圓周角相等，計算圓周角或圓心角度數。
- code: T04
  name: 直徑所對圓周角與弦長計算
  desc: 利用「半圓或直徑所對的圓周角為直角（90°）」，結合畢氏定理、三角比或相似形求角度與弦長。
- code: T05
  name: 圓內接四邊形與多邊形性質
  desc: 利用圓內接四邊形對角互補、外角等於內對角，或圓內接正多邊形之對稱性求角度。
- code: T06
  name: 平行弦截等弧之應用
  desc: 利用圓中兩平行弦所夾的弧度數相等（平行弦截等弧）求解相關弧度或角度。
- code: T07
  name: 圓內角與圓外角運算
  desc: 利用兩弦相交於圓內（圓內角）或兩割線延長交於圓外（圓外角）與所截弧度數之關係求角或弧。
- code: T08
  name: 圓外切線夾角與切線性質
  desc: 利用圓外一點向圓作兩切線之夾角（圓外切線角）與所夾弧度、圓心角互補等切線性質解題。
- code: T09
  name: 圓中特殊幾何模型與綜合題
  desc: 包含半圓內 AD//OC 經典模型、兩相交圓共線截角模型、弦垂直平分線截弧等綜合幾何題型。
refined:
