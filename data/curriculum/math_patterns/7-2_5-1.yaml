unit:
  grade: 7
  semester: 2
  code: 5-1
  title: 統計圖表
  other_titles:
  - 統計圖表與資料分析
  - 統計圖表與平均數、中位數、眾數
status: draft
model: gemini-3.7-flash(batch)
sampled: 241
unit_questions: 247
types:
- code: T01
  name: 統計名詞與圖表特徵
  desc: 判斷統計分組原則（組距、組上限與下限定義）或選擇適合呈現資料特性的統計圖表。
- code: T02
  name: 次數分配表與直方圖
  desc: 由次數分配表、長條圖或直方圖中讀取次數、計算總人數、特定範圍人數或所占百分比。
- code: T03
  name: 折線圖判讀與比較
  desc: 由單一或多組折線圖中讀取數據變化趨勢、比較不同組別數據差異或計算指定區間次數。
- code: T04
  name: 圓形圖與圓心角度數
  desc: 進行圓形圖（或圓形百分圖）中各項目所占比例、圓心角度數與實際數量之間的相互換算。
- code: T05
  name: 污損圖表的還原與計算
  desc: 統計圖表（直方圖、折線圖或表格）因污損或缺漏，需利用總數、比例或差倍條件列式求出未知數。
- code: T06
  name: 二維列聯表的判讀與應用
  desc: 判讀雙向交叉分類的列聯表，進行表格空格填補、求總計或計算特定條件下的比例。
- code: T07
  name: 進出場直方圖與複合圖表
  desc: 結合多張圖表（如民眾進入與離開時間直方圖、長條與圓形複合圖）進行滯留人數或跨圖綜合運算。
- code: T08
  name: 算術平均數與加權計算
  desc: 計算一般資料、加權權重、分組資料（以組中點計算）的平均數，或進行數據登錄錯誤後的平均修正。
- code: T09
  name: 中位數與眾數的求值
  desc: 由離散原始資料或次數分配表中找出中位數與眾數，或依中位數已知條件推求未知數據。
- code: T10
  name: 統計量的性質與組別判斷
  desc: 判斷平均數、中位數、眾數的概念與極端值影響，或由分組統計圖表中判斷中位數/眾數所在的組別。
