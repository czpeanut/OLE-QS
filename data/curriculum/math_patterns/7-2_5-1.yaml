unit:
  grade: 7
  semester: 2
  code: 5-1
  title: 統計圖表
  other_titles:
  - 統計圖表與資料分析
  - 統計圖表與平均數、中位數、眾數
status: draft
model: gemini-3.7-flash(batch)
sampled: 241
unit_questions: 247
types:
- code: T01
  name: 統計名詞與圖表特徵
  desc: 判斷統計分組原則（組距、組上限與下限定義）或選擇適合呈現資料特性的統計圖表。
- code: T02
  name: 原始資料整理與次數分配表
  desc: 由原始抽樣或全班數據一覽表進行分組劃記並完成次數分配表，或由已給定的次數分配表中讀取組別、組距、求未知次數、計算指定範圍人數及依名次/條件反推其所在區間。
- code: T11
  name: 直方圖的判讀與次數、百分比計算
  desc: 針對成績、身高、體重、通勤時間等連續分組資料的次數分配直方圖，讀取各組次數、計算總人數、指定範圍（如某分數以上、未滿某數值）的人數或所占百分比，以及依特定名次判斷所屬組別。
- code: T12
  name: 長條圖判讀與情境比較應用
  desc: 針對離散數值（如投籃進球數）或類別項目（如職業、年份、項目比較、複式長條圖）的長條圖進行判讀，計算數量總和、比例、增加/減少幅度，或結合生活情境公式（如投資報酬率、耗水量倍數等）進行比較與運算。
- code: T03
  name: 次數分配折線圖的判讀與計算
  desc: 由單一組資料的分組次數分配折線圖中，判讀組中點坐標與組距、讀取各組次數，或計算總人數、指定區間人數與百分比，以及推算中位數或特定名次落在何組。
- code: T13
  name: 複式折線圖與多組資料比較
  desc: 在同一坐標平面繪製兩組或兩組以上的折線圖（如甲乙兩班、男女生、兩國數據），進行不同組別在各區間次數的比較、差距計算或分佈特徵判斷。
- code: T14
  name: 時間趨勢折線圖與情境數據判讀
  desc: 橫軸為時間（月份、年份、時刻等連續時間點）的折線圖，判讀數據隨時間變化的增減趨勢、極值（最高/最低）、變化倍數或不同對象隨時間變化的比較。
- code: T04
  name: 圓形圖與圓心角度數
  desc: 進行圓形圖（或圓形百分圖）中各項目所占比例、圓心角度數與實際數量之間的相互換算。
- code: T05
  name: 污損圖表的還原與計算
  desc: 統計圖表（直方圖、折線圖或表格）因污損或缺漏，需利用總數、比例或差倍條件列式求出未知數。
- code: T06
  name: 二維列聯表的判讀與應用
  desc: 判讀雙向交叉分類的列聯表，進行表格空格填補、求總計或計算特定條件下的比例。
- code: T07
  name: 進出場直方圖與複合圖表
  desc: 結合多張圖表（如民眾進入與離開時間直方圖、長條與圓形複合圖）進行滯留人數或跨圖綜合運算。
- code: T08
  name: 算術平均數與加權計算
  desc: 計算一般資料、加權權重、分組資料（以組中點計算）的平均數，或進行數據登錄錯誤後的平均修正。
- code: T09
  name: 中位數與眾數的求值
  desc: 由離散原始資料或次數分配表中找出中位數與眾數，或依中位數已知條件推求未知數據。
- code: T10
  name: 統計量的性質與組別判斷
  desc: 判斷平均數、中位數、眾數的概念與極端值影響，或由分組統計圖表中判斷中位數/眾數所在的組別。
refined:
- 拆分 T02 次數分配表與直方圖（45 題）→ T02 原始資料整理與次數分配表、T11 直方圖的判讀與次數、百分比計算、T12 長條圖判讀與情境比較應用
- 拆分 T03 折線圖判讀與比較（49 題）→ T03 次數分配折線圖的判讀與計算、T13 複式折線圖與多組資料比較、T14 時間趨勢折線圖與情境數據判讀
