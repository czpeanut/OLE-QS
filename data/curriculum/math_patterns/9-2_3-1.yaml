unit:
  grade: 9
  semester: 2
  code: 3-1
  title: 角柱與圓柱
  other_titles:
  - 空間中的線、平面與形體
  - 柱體、錐體、空間中的線與平面
status: draft
model: gemini-3.7-flash(batch)
sampled: 260
unit_questions: 262
types:
- code: T01
  name: 空間中直線與平面的位置關係
  desc: 判斷空間中兩直線（平行、相交、歪斜）、直線與平面（垂直、平行）、平面與平面的平行與垂直關係
- code: T02
  name: 柱體與錐體的構成要素與計數
  desc: 根據角柱、角錐或圓柱的定義，計算或判斷其頂點數、邊數、面數之間的數量關係與幾何特性
- code: T03
  name: 立體圖形的展開圖與空間摺疊
  desc: 辨識正方體、長方體、角柱、圓柱或圓錐的展開圖，或推求展開圖與摺疊後各面、頂點的相對位置
- code: T04
  name: 角柱的體積計算
  desc: 以單一角柱（包含長方體、正方體、三角柱、梯形柱或正多角柱）為對象，利用「底面積×柱高」計算體積，或由給定的體積、展開圖尺寸逆求邊長與柱高。
- code: T11
  name: 角柱的表面積計算
  desc: 以單一角柱為對象，計算其側面矩形與上下兩底面的面積總和（表面積＝側面積＋2×底面積），或由表面積與展開圖數據逆求未知邊長。
- code: T12
  name: 複合柱體、挖空與分割拼疊問題
  desc: 題型包含多個柱體拼合而成的組合圖形、中間挖空（如長方體穿孔）或有厚度的柱體水槽之體積與表面積計算，以及將角柱切割、分割或多個相同角柱堆疊拼組後的體積比與表面積變化分析。
- code: T05
  name: 圓柱的表面積與體積
  desc: 計算圓柱、中空圓柱、組合圓柱或由平面圖形旋轉所得圓柱的表面積與體積
- code: T06
  name: 錐體的展開與表面積
  desc: 利用圓錐或角錐的展開圖，計算側面積、底面積、表面積或側面扇形的圓心角與半徑
- code: T07
  name: 立體圖形內部的空間距離
  desc: 利用三維空間的畢氏定理，求長方體、正方體內部對角線或空間兩點間的直線飛行距離
- code: T08
  name: 柱體表面的最短路徑
  desc: 將柱體側面展開成平面，利用畢氏定理求沿柱體外表面爬行的最短距離或路徑長度
- code: T09
  name: 柱體容器水位與容積變化
  desc: 計算柱體容器在注水、倒水、放入或取出沉浸物（如鐵柱）、或改變放置方向後的水位高度與容積
- code: T10
  name: 柱體尺寸縮放與比例問題
  desc: 探討柱體的底面邊長、半徑或柱高按比例縮放時，其表面積與體積的倍數變化或比值計算
refined:
- 拆分 T04 角柱的表面積與體積（40 題）→ T04 角柱的體積計算、T11 角柱的表面積計算、T12 複合柱體、挖空與分割拼疊問題
