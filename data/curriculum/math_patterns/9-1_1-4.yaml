unit:
  grade: 9
  semester: 1
  code: 1-4
  title: 相似三角形的應用與三角比
  other_titles:
  - 相似三角形的應用
status: draft
model: gemini-3.7-flash
sampled: 300
unit_questions: 604
types:
- code: T01
  name: 影長測高問題
  desc: 利用太陽平行光照射下「物高：影長」成固定比例（含影長落在牆面）求高度或距離。
- code: T02
  name: 視線與標竿測高
  desc: 利用視線共線、立標竿或手臂手持直尺等視角相似關係測量物體高度。
- code: T03
  name: 河寬與不可測距離
  desc: 在平地上構造相似三角形或直角三角形以測量河寬、湖寬等無法直接測量之距離。
- code: T04
  name: 鏡面反射與點光源
  desc: 利用光線反射角相等（鏡子相視）或點光源照射產生的相似三角形求距離或陰影。
- code: T05
  name: 幾何圖形折疊應用
  desc: 將三角形、矩形或正方形紙片折疊後，利用折痕與鄰角互餘產生之相似形求解。
- code: T06
  name: 多邊形內接與分割相似
  desc: 在正方形、矩形、梯形、內接圖形或坐標平面中，利用幾何連線所構成的相似三角形求線段或面積比。
- code: T07
  name: 坡度與坡度百分比
  desc: 利用鉛直上升高度與水平移動距離的比值（坡度百分比或無障礙坡道規定）計算高度或距離。
- code: T08
  name: 銳角三角比定義與求值
  desc: 在直角三角形中依定義求正弦(sin)、餘弦(cos)、正切(tan)之比值或進行同角三角比互換。
- code: T09
  name: 特殊角直角三角形與三角比計算
  desc: 在單一 30°-60°-90° 或 45°-45°-90° 的直角三角形中，利用邊長比（1:√3:2 或 1:1:√2）或特殊角三角比數值求邊長、周長、面積，以及特殊角三角函數值的代數化簡與計算。
- code: T11
  name: 特殊角斜三角形作高求值
  desc: 題目為含特殊角（如 30°、45°、60° 或鈍角 120°、135°、150°）的非直角三角形，解題核心為自頂點作高至底邊（或底邊延長線），將三角形分割為兩個特殊直角三角形以計算邊長、周長或面積。
- code: T12
  name: 特殊角複合圖形與多邊形計算
  desc: 包含多個特殊角直角三角形相鄰拼接、連鎖旋轉，或是梯形、菱形、長方形、正多邊形重疊等複合幾何圖形，需利用特殊角邊長比例或三角比性質進行幾何長度、面積或距離的推導計算。
- code: T10
  name: 仰角俯角與三角比應用
  desc: 利用仰角、俯角及給定之三角比近似值（查表值），解決測量山高、樹高或斜邊之生活情境問題。
refined:
- 拆分 T09 特殊角三角比幾何計算（75 題）→ T09 特殊角直角三角形與三角比計算、T11 特殊角斜三角形作高求值、T12 特殊角複合圖形與多邊形計算
