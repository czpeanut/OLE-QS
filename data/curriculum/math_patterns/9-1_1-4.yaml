unit:
  grade: 9
  semester: 1
  code: 1-4
  title: 相似三角形的應用與三角比
status: draft
model: gemini-3.7-flash
sampled: 200
unit_questions: 604
types:
- code: T01
  name: 相似三角形的判別與邊長計算
  desc: 利用AA、SAS或SSS相似性質判別兩三角形相似，並由對應邊成比例計算線段長度
- code: T02
  name: 相似三角形與幾何面積比
  desc: 利用相似形面積比等於對應邊長平方比或同高三角形面積比求各區域面積或比例
- code: T03
  name: 相似測量：影長與直立標竿測高
  desc: 利用物高與影長成正比，或利用直立標竿、手臂持尺測量樹高或大樓高度
- code: T04
  name: 相似測量：鏡面反射與河寬測量
  desc: 利用平面鏡反射角相等或於岸邊設計直角三角形/相似三角形測量河寬與距離
- code: T05
  name: 幾何圖形摺疊與內接圖形應用
  desc: 利用矩形/三角形摺疊後產生的相似形，或三角形內接正方形/梯形截線求邊長
- code: T06
  name: 銳角三角比的定義與求值
  desc: 在直角三角形中依對邊、鄰邊與斜邊定義計算正弦、餘弦與正切比值或相互轉換
- code: T07
  name: 特殊角三角比與三角形計算
  desc: 利用30°-60°-90°與45°-45°-90°特殊邊長比，或作高分割非直角三角形求邊長與面積
- code: T08
  name: 坡度與坡度百分比的計算應用
  desc: 利用鉛直上升高度與水平移動距離的比值計算坡度百分比或無障礙坡道規範
- code: T09
  name: 銳角三角比的測量與生活應用
  desc: 利用仰角、俯角與給定的三角函數近似值，計算實際建築高度、距離或斜坡長度
