unit:
  grade: 9
  semester: 1
  code: 1-4
  title: 相似三角形的應用與三角比
  other_titles:
  - 相似三角形的應用
status: draft
model: gemini-3.7-flash
sampled: 300
unit_questions: 604
types:
- code: T01
  name: 影長測高問題
  desc: 利用太陽平行光照射下「物高：影長」成固定比例（含影長落在牆面）求高度或距離。
- code: T02
  name: 視線與標竿測高
  desc: 利用視線共線、立標竿或手臂手持直尺等視角相似關係測量物體高度。
- code: T03
  name: 河寬與不可測距離
  desc: 在平地上構造相似三角形或直角三角形以測量河寬、湖寬等無法直接測量之距離。
- code: T04
  name: 鏡面反射與點光源
  desc: 利用光線反射角相等（鏡子相視）或點光源照射產生的相似三角形求距離或陰影。
- code: T05
  name: 幾何圖形折疊應用
  desc: 將三角形、矩形或正方形紙片折疊後，利用折痕與鄰角互餘產生之相似形求解。
- code: T06
  name: 多邊形內接與分割相似
  desc: 在正方形、矩形、梯形、內接圖形或坐標平面中，利用幾何連線所構成的相似三角形求線段或面積比。
- code: T07
  name: 坡度與坡度百分比
  desc: 利用鉛直上升高度與水平移動距離的比值（坡度百分比或無障礙坡道規定）計算高度或距離。
- code: T08
  name: 銳角三角比定義與求值
  desc: 在直角三角形中依定義求正弦(sin)、餘弦(cos)、正切(tan)之比值或進行同角三角比互換。
- code: T09
  name: 特殊角三角比幾何計算
  desc: 利用 30°、45°、60° 等特殊角的邊長比或三角比計算三角形邊長、周長與面積。
- code: T10
  name: 仰角俯角與三角比應用
  desc: 利用仰角、俯角及給定之三角比近似值（查表值），解決測量山高、樹高或斜邊之生活情境問題。
