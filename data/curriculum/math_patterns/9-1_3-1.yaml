unit:
  grade: 9
  semester: 1
  code: 3-1
  title: 推理證明
  other_titles:
  - 證明與推理
  - 推理與證明
status: draft
model: gemini-3.7-flash(batch)
sampled: 290
unit_questions: 305
types:
- code: T01
  name: 奇偶數的運算與代數證明
  desc: 判斷或利用代數假設（如 $2k$、$2k+1$）證明整數奇偶性之運算與平方性質
- code: T02
  name: 因倍數與整除性的代數推理
  desc: 利用代數式展開、乘法公式或因式分解證明數式的整除性與倍數關係
- code: T03
  name: 不等關係與根式的代數推理
  desc: 利用作差法、平方法或不等式運算性質證明實數大小關係與根式不等式
- code: T04
  name: 畢氏定理與直角三角形邊長推理
  desc: 利用畢氏定理及整數條件推導直角三角形三邊的整除性、倍數或比例關係
- code: T05
  name: 邏輯推理與日常情境問題
  desc: 根據給定條件進行真假話分析、生活編碼驗證或邏輯推理得出結論
- code: T06
  name: 幾何全等條件與作圖合理性判斷
  desc: 辨識三角形全等判別性質是否成立，或判斷尺規作圖步驟與輔助線證明的合理性
- code: T07
  name: 三角形全等之基本幾何證明
  desc: 利用三角形全等性質證明一般三角形或等腰三角形中的對應邊、對應角或垂直關係
- code: T08
  name: 正多邊形旋轉與疊合的全等證明
  desc: 利用共頂點的正三角形或正方形旋轉結構，證明旋轉型三角形全等及相關線段角度
- code: T09
  name: 四邊形性質與判定的幾何證明
  desc: 利用平行線與對稱性質證明平行四邊形、菱形、矩形或梯形的幾何性質與判定
- code: T10
  name: 相似形與圓性質的幾何推理
  desc: 利用相似三角形判定性質或圓的弦切角、割線性質進行幾何推理證明與線段計算
