unit:
  grade: 7
  semester: 2
  code: 3-1
  title: 比例式
  other_titles: []
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 504
types:
- code: T01
  name: 比、比值與最簡整數比
  desc: 求兩數的比值、將比化為最簡整數比，或判斷何者為相等的比。
- code: T02
  name: 比例式的性質與概念判斷
  desc: 利用外項乘積等於內項乘積（ad＝bc）判斷比例式性質、概念或變形何者正確。
- code: T03
  name: 解比例式中的未知數
  desc: 利用比例式的內外項相乘性質，解出一元一次比例式中的未知數 x。
- code: T04
  name: 代數式的比例與求值
  desc: 已知二元一次等式或 x：y，求代數式的比值，或搭配二元一次方程式求特定式子的值。
- code: T05
  name: 比例尺與幾何圖形比例
  desc: 利用地圖比例尺計算實際距離或圖上長度，以及求幾何圖形的周長、面積或體積比。
- code: T06
  name: 配方、濃度與比例分配
  desc: 依固定比例調配食譜原料、溶液濃度計算與稀釋，或按特定比例分配總量、紅利與獎金。
- code: T07
  name: 數量增減與人數年齡變化
  desc: 題目涉及人數轉入轉出、金錢花費增加或年齡在不同年份前後比例變化的應用題。
- code: T08
  name: 等量代換與分裝倒水問題
  desc: 題目涉及總價等量購買不同物品代換、不同容器分裝飲料容量，或容器間互相倒水的水位問題。
- code: T09
  name: 速率、步數與行程問題
  desc: 利用距離、時間求速率比，或利用步長與步數比計算相遇、折返等行程應用題。
- code: T10
  name: 多群體合併與加權比例
  desc: 已知各分組（如各年級、南北半球、男女生）的人數比及各自比例，求合併後的總比例。
