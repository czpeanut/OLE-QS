unit:
  grade: 8
  semester: 1
  code: 1-2
  title: 多項式的加減
  other_titles:
  - 多項式的加法與減法
  - 多項式與其加減運算
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 347
types:
- code: T01
  name: 多項式的定義與辨識
  desc: 判斷給定式子是否為 x 的多項式、單項式、常數多項式或零多項式
- code: T02
  name: 多項式的項、次數與升降冪
  desc: 判讀給定多項式的次數、各項係數、項數或將多項式按升冪、降冪排列
- code: T03
  name: 指定次數求待定係數
  desc: 已知多項式為特定次數（如一次、二次、常數或零次多項式），求各項係數中的未知數
- code: T04
  name: 多項式相等與係數比較
  desc: 已知兩多項式相等或相減為零多項式，由對應項係數相等求未知數之值
- code: T05
  name: 多項式的橫式加減運算
  desc: 進行兩個或多個多項式的橫式加減、去括號化簡與同類項合併
- code: T06
  name: 多項式直式加減與空格填空
  desc: 給出多項式直式加減計算過程，要求推算直式中的空格、缺漏項或未知係數
- code: T07
  name: 多項式加減的次數判斷
  desc: 已知兩多項式各自的次數，判斷兩多項式相加、相減後結果的次數範圍或可能性
- code: T08
  name: 多項式加減逆運算與代數求值
  desc: 已知多項式與其和、差關係，反求未知多項式，或給定 A、B 多項式求其線性組合
- code: T09
  name: 多項式加減的看錯問題
  desc: 解題時誤將加法看成減法或看錯運算倍數，透過錯誤結果反求原式並求出正解
- code: T10
  name: 各項正誤推求原係數
  desc: 多人計算多項式加減，已知每人分別只做對特定項（二次項、一次項或常數項），據此反推原係數
- code: T11
  name: 幾何圖形周長與面積多項式
  desc: 以多項式表示平面圖形的邊長、周長、重疊或挖空面積，並進行多項式加減化簡
- code: T12
  name: 多項式加減的情境與數線應用
  desc: 將年齡、數線點坐標距離、線段長度等生活或數線情境轉換為多項式加減運算
