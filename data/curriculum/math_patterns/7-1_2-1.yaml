unit:
  grade: 7
  semester: 1
  code: 2-1
  title: 質因數分解
  other_titles:
  - 因數與倍數
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 326
types:
- code: T01
  name: 因數與倍數的基本意義
  desc: 判斷整除觀念、因數與倍數敘述正誤，或求使分式 $\frac{k}{n}$（或類似式子）為整數的未知數值。
- code: T02
  name: 質數、合數與互質
  desc: 判斷給定整數是否為質數、合數或兩數是否互質，以及相關定義與性質的觀念題。
- code: T03
  name: 倍數判別法與缺位求值
  desc: 利用 2、3、4、5、9、11 等倍數判別法，判別整數倍數或推求多位數中缺位數字 $\square$。
- code: T04
  name: 質因數分解與短除法還原
  desc: 將整數分解並寫成標準分解式，或由短除法、樹狀圖的計算過程逆推還原未知數。
- code: T05
  name: 正因數排列與原數推求
  desc: 根據整數的所有正因數由小到大排列的順序與對稱關係，推求原數或數列中的未知因數。
- code: T06
  name: 標準分解式求因倍數與指數
  desc: 由已知標準分解式判別因數與倍數，或根據因倍數條件求標準分解式中的質因數與次方指數。
- code: T07
  name: 連乘積質因數與末尾連續零
  desc: 求多個整數連乘積（或連續整數相乘）的相異質因數個數、質因數和，或乘開後末尾連續 0 的個數。
- code: T08
  name: 因數與質因數的生活情境應用
  desc: 將情境中的物品分堆、拼長方形面積、連續整數乘積或標準分解式密碼等問題轉化為因數與質因數求解。
