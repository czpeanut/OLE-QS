unit:
  grade: 8
  semester: 2
  code: 3-4
  title: 中垂線與角平分線性質
  other_titles:
  - 全等三角形的應用
  - 中垂線與角平分線的性質
status: draft
model: gemini-3.7-flash(batch)
sampled: 292
unit_questions: 301
types:
- code: T01
  name: 中垂線與角平分線作圖判斷
  desc: 探討尺規作圖之畫弧半徑條件、步驟正誤判斷，或計算連續作圖次數與線段/角度比例分割
- code: T02
  name: 中垂線性質與線段周長計算
  desc: 利用中垂線上任一點到線段兩端點等距的性質，進行線段長求解或三角形周長的代換計算
- code: T03
  name: 中垂線與畢氏定理應用
  desc: 在直角三角形或多邊形中，結合中垂線性質與畢氏定理列方程式求解線段長度
- code: T04
  name: 角平分線性質與面積計算
  desc: 利用角平分線上任一點到角兩邊垂直距離相等的性質，求點到邊的距離、高或三角形面積
- code: T05
  name: 中垂線與角平分線的角度計算
  desc: 結合中垂線產生的等腰三角形底角相等與角平分線平分角之性質，計算圖形中的角度
- code: T06
  name: 多重角平分線與交角問題
  desc: 利用兩內角平分線、內外角平分線相交，或相鄰補角之角平分線計算所夾角度
- code: T07
  name: 角平分線與平行線的性質
  desc: 利用角平分線交點搭配平行線產生等腰三角形之性質，計算線段長度或三角形周長
- code: T08
  name: 等距點的作圖與條件判斷
  desc: 根據「到兩端點等距作中垂線」與「到兩邊等距作角平分線」的原則，尋找特定交點或生活應用位置
- code: T09
  name: 摺紙問題與中垂線角平分線
  desc: 涉及將點與點重合（中垂線）或邊與邊重合（角平分線）的摺疊情境，計算摺痕長度或摺疊後面積
- code: T10
  name: 線對稱與兩點距離和最短問題
  desc: 利用線對稱點性質求直線或坐標軸上一點到兩定點距離和（PA＋PB）的最小值問題
