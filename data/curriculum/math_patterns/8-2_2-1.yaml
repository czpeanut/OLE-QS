unit:
  grade: 8
  semester: 2
  code: 2-1
  title: 線型函數與其圖形
  other_titles:
  - 函數與函數圖形
  - 一次函數及函數圖形與應用
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 391
types:
- code: T01
  name: 函數關係的判別
  desc: 判斷生活情境、表格、對應關係或代數式中 y 是否為 x 的函數（一對一、多對一為函數，一對多、一對無非函數）。
- code: T02
  name: 代入求函數值與流程計算
  desc: 給定特定自變數 x 求對應的函數值 y、反求 x，或依計算流程機器（輸入與輸出）求值。
- code: T03
  name: 兩函數值相等或互為相反數
  desc: 已知兩個一次函數在特定 x 值時的函數值相等、成倍數或互為相反數，解一元一次方程式求未知數。
- code: T04
  name: 常數函數的性質與求值
  desc: 常數函數 y=c（圖形為水平線、平行 x 軸）的辨識、求任意 x 之函數值或函數值之和。
- code: T05
  name: 待定係數法求一次函數式
  desc: 已知一次函數圖形通過兩點坐標，或給定兩組對應的 (x, y) 函數值，列聯立方程式求 y=ax+b。
- code: T06
  name: 一次函數圖形的特徵與判斷
  desc: 依一次函數 y=ax+b 係數 a、b 的正負或兩軸截距，判斷圖形通過的象限、增減性、是否過原點或比對圖形形狀。
- code: T07
  name: 一次函數圖形與坐標軸圍成面積
  desc: 求一次函數圖形與 x 軸、y 軸之交點坐標，並計算直線與坐標軸所圍成的三角形面積。
- code: T08
  name: 兩函數圖形的交點與大小比較
  desc: 利用兩函數圖形的交點坐標判斷兩函數值的大小關係，或結合幾何圖形動點求函數關係。
- code: T09
  name: 線型函數的生活文字應用題
  desc: 將成績線性調整、溫度換算（攝氏與華氏）、商品促銷與收支平衡等生活文字情境化為線型函數列式求解。
- code: T10
  name: 線型函數圖表的判讀與應用
  desc: 從給定的折線圖、坐標圖中讀取點坐標，求出分段或線型函數關係式，並進行多方案比較（如電信費、外送費、路程時間圖）。
