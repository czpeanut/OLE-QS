  title: 直角坐標平面
  other_titles: []
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 354
types:
- code: T01
  name: 坐標讀取與描點
  desc: 在直角坐標平面上讀取點的坐標，或依給定坐標在平面上描點標示。
- code: T02
  name: 象限與坐標軸判別
  desc: 給定具體數值的坐標，判斷該點落在第幾象限或哪一條坐標軸上。
- code: T03
  name: 點到坐標軸的距離
  desc: 利用點坐標求到 x 軸或 y 軸的距離，或由距離與象限條件反求點的坐標。
- code: T04
  name: 坐標軸上的點與求值
  desc: 利用點在 x 軸（縱坐標為 0）或 y 軸（橫坐標為 0）的性質列式求解未知數或坐標。
- code: T05
  name: 點的平移與坐標計算
  desc: 依上下左右方向與單位長進行點的平移求新坐標，或由平移重合關係求未知數。
- code: T06
  name: 代數符號與象限判別
  desc: 已知未知數的正負、大小或所在象限，判斷代數式組合構成的新點所在象限。
- code: T07
  name: 生活情境與相對坐標
  desc: 在方位路徑、地圖標示或棋盤格等生活情境中建立坐標並求解位置。
- code: T08
  name: 坐標平面幾何與面積
  desc: 利用平面上的點坐標求三角形或多邊形面積，或由圖形頂點與幾何變換求坐標。
