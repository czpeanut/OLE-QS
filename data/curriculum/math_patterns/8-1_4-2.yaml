unit:
  grade: 8
  semester: 1
  code: 4-2
  title: 配方法與公式解
  other_titles:
  - 配方法與一元二次方程式的公式解
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 336
types:
- code: T01
  name: 直接開平方法求解
  desc: 利用平方根概念直接求解形如 (ax+b)²=c 或類似形式之一元二次方程式及根的關係。
- code: T02
  name: 配成完全平方式
  desc: 求二次多項式配成完全平方式所須填入或加上之常數項與未知係數。
- code: T03
  name: 配方化為標準型式
  desc: 將一元二次方程式透過配方法整理化簡為 (x-p)²=q 之型式並求相關係數值。
- code: T04
  name: 配方法步驟與偵錯
  desc: 檢視或排序利用配方法求解一元二次方程式的運算步驟並找出錯誤所在。
- code: T05
  name: 利用公式解求方程式的解
  desc: 直接代入一元二次方程式公式解求方程式的根（包含含根號解或特殊符號係數方程式）。
- code: T06
  name: 判別式與解的性質判斷
  desc: 由一元二次方程式之判別式 b²-4ac 的正負判斷其解為兩相異根、重根或無解。
- code: T07
  name: 由解的性質反求未知數或範圍
  desc: 已知方程式有兩相異根、重根或無解之條件，利用判別式反求係數未知數之值或範圍。
- code: T08
  name: 已知根逆推方程式係數
  desc: 已知方程式的解（或配方結果）反推原方程式中的未知係數。
- code: T09
  name: 根的代入求值與兩根運算
  desc: 將方程式之根代入代數式求值，或利用兩根差、兩根為整數質數等特殊條件進行探討與計算。
