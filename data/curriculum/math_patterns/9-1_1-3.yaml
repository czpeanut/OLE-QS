unit:
  grade: 9
  semester: 1
  code: 1-3
  title: 相似多邊形
  other_titles:
  - 相似形
  - 縮放與相似
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 567
types:
- code: T01
  name: 圖形的縮放與坐標
  desc: 涉及以某點為縮放中心進行圖形縮放、計算縮放倍率、邊長與角度變化或坐標變換。
- code: T02
  name: 相似多邊形的判定與性質
  desc: 涉及判斷幾何圖形是否必相似，或利用相似多邊形對應角相等、對應邊成比例求角與邊長。
- code: T03
  name: 矩形縮放與相似增減問題
  desc: 涉及矩形透過長寬等比例增減、裁切、拼貼或內外縮放以維持相似的計算。
- code: T04
  name: 相似三角形判別性質與相似圖形判定
  desc: 辨識 AA、SAS、SSS 等相似判別條件的正確性，或給定三角形的邊長與角度，由選項中判斷兩獨立三角形是否相似，以及已知兩三角形相似時利用對應角相等、對應邊成比例求解邊角或代數未知數。
- code: T10
  name: 共角與母子相似圖形
  desc: 處理非平行截線的三角形內嵌幾何圖形，包含共用一角且另一組對應角相等的反向共角相似（如 △ADE～△ACB）、母子相似（如 ∠ACD＝∠B 的共邊共角型態）、等腰三角形底角分割相似，利用 AA 或 SAS 相似求解邊長與比例。
- code: T11
  name: 垂直互餘與直角多邊形內相似
  desc: 處理含有直角、垂線段或中垂線的幾何圖形，利用直角三角形共角、同角的餘角相等（一線三直角／K字型）或在正方形、長方形、摺疊幾何內作垂直線推導 AA 相似，進而求解線段長、圖形面積或點坐標。
- code: T05
  name: 三角形兩邊中點連線性質
  desc: 涉及三角形兩邊中點連線平行底邊且為其一半的性質，或多重中點圖形的周長與面積計算。
- code: T06
  name: A字型相似與平行截線
  desc: 涉及三角形內平行底邊的截線所構成的 A 字型相似三角形邊長比例與面積計算。
- code: T07
  name: X字型相似與四邊形截線
  desc: 涉及平行線間對角線相交形成之 X 字型相似，或平行四邊形、梯形延伸線相交之相似計算。
- code: T08
  name: 雙正多邊形與旋轉相似
  desc: 涉及共頂點的兩個正方形或正三角形經旋轉所形成的相似三角形與邊角推導。
- code: T09
  name: 相似形周長與面積比性質
  desc: 涉及利用相似圖形對應邊長比等於周長與對應高比、面積比等於邊長平方比進行的計算。
refined:
- 拆分 T04 相似三角形的判別性質（225 題）→ T04 相似三角形判別性質與相似圖形判定、T10 共角與母子相似圖形、T11 垂直互餘與直角多邊形內相似
