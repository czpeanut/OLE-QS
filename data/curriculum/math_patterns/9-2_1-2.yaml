unit:
  grade: 9
  semester: 2
  code: 1-2
  title: 二次函數圖形與最大值、 最小值
  other_titles:
  - 二次函數的最大值或最小值
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 427
types:
- code: T01
  name: 由標準式求二次函數圖形的基本幾何特徵
  desc: 給定二次函數的標準式 y＝a(x－h)^2＋k 或經配方後的式子，直接求或判斷其圖形的開口方向、開口大小、對稱軸方程式、頂點坐標、頂點與特定點（如原點）的距離，以及描點作圖或判斷圖形不通過的象限。
- code: T09
  name: 二次函數的最大值與最小值判斷與求值
  desc: 以二次函數的「極值」為解題核心。包含由標準式求函數的最大值或最小值與發生極值時的 x 值、由已知極值條件（如在 x＝h 時有最大/最小值 k）反求係數或比較係數大小，以及求解簡單代數式的極值。
- code: T10
  name: 由係數符號或函數值正負推判圖形與頂點位置
  desc: 題目未給定完整數值方程式，而是給定參數符號（如 a＜0, h＜0, k＞0）、對稱/非對稱點的函數值正負（如 f(－101)＝0 且 f(101)＞0），或兩交點與開口方向，要求定性推判拋物線草圖、頂點所在象限或最高/最低點的可能位置。
- code: T02
  name: 二次函數圖形的平移與對稱變換
  desc: 探討二次函數圖形在坐標平面上進行上下左右平移，或沿水平線、鉛直線對稱翻折後的函數式與頂點變化。
- code: T03
  name: 待定係數求二次函數解析式
  desc: 已知頂點、對稱軸、極值或圖形通過的點坐標等條件，列式求出二次函數的方程式或各項係數。
- code: T04
  name: 圖形與坐標軸及水平線的交點
  desc: 探討二次函數圖形與 x 軸、y 軸或水平直線 y=k 的交點坐標、交點個數及判別條件。
- code: T05
  name: 利用對稱性比較函數值大小
  desc: 利用二次函數圖形的對稱軸與開口方向，比較圖形上不同點之自變數與函數值（y 值）的大小關係。
- code: T06
  name: 二次函數的水平截線與線段長
  desc: 給定水平線截拋物線所形成的交點線段長、線段比或雙拋物線頂點距離，進行幾何長度與坐標的計算。
- code: T07
  name: 二次函數圖形與幾何圖形綜合
  desc: 將二次函數圖形上的交點與頂點連結成三角形、四邊形或正三角形，求解圖形面積或幾何性質。
- code: T08
  name: 拋物線在生活情境中的應用問題
  desc: 建立坐標系解決球類飛行軌跡、水火箭、噴泉水柱、拱橋吊橋或杯子截面等生活拋物線應用題。
refined:
- 拆分 T01 二次函數圖形特徵與極值判斷（103 題）→ T01 由標準式求二次函數圖形的基本幾何特徵、T09 二次函數的最大值與最小值判斷與求值、T10 由係數符號或函數值正負推判圖形與頂點位置
