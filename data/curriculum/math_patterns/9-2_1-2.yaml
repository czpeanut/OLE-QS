unit:
  grade: 9
  semester: 2
  code: 1-2
  title: 二次函數圖形與最大值、 最小值
  other_titles:
  - 二次函數的最大值或最小值
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 427
types:
- code: T01
  name: 二次函數圖形特徵與極值判斷
  desc: 由標準式 y=a(x-h)^2+k 判斷拋物線的開口方向、頂點坐標、對稱軸、最大值或最小值等基本幾何與代數特徵。
- code: T02
  name: 二次函數圖形的平移與對稱變換
  desc: 探討二次函數圖形在坐標平面上進行上下左右平移，或沿水平線、鉛直線對稱翻折後的函數式與頂點變化。
- code: T03
  name: 待定係數求二次函數解析式
  desc: 已知頂點、對稱軸、極值或圖形通過的點坐標等條件，列式求出二次函數的方程式或各項係數。
- code: T04
  name: 圖形與坐標軸及水平線的交點
  desc: 探討二次函數圖形與 x 軸、y 軸或水平直線 y=k 的交點坐標、交點個數及判別條件。
- code: T05
  name: 利用對稱性比較函數值大小
  desc: 利用二次函數圖形的對稱軸與開口方向，比較圖形上不同點之自變數與函數值（y 值）的大小關係。
- code: T06
  name: 二次函數的水平截線與線段長
  desc: 給定水平線截拋物線所形成的交點線段長、線段比或雙拋物線頂點距離，進行幾何長度與坐標的計算。
- code: T07
  name: 二次函數圖形與幾何圖形綜合
  desc: 將二次函數圖形上的交點與頂點連結成三角形、四邊形或正三角形，求解圖形面積或幾何性質。
- code: T08
  name: 拋物線在生活情境中的應用問題
  desc: 建立坐標系解決球類飛行軌跡、水火箭、噴泉水柱、拱橋吊橋或杯子截面等生活拋物線應用題。
