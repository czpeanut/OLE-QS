unit:
  grade: 9
  semester: 1
  code: 2-1
  title: 點、線、圓
  other_titles:
  - 點、直線與圓之間的位置關係
  - 圓形及點、直線與圓之間的關係
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 508
types:
- code: T01
  name: 點與圓的位置關係
  desc: 以點到圓心的距離與半徑大小比較，判斷點在圓內、圓上或圓外，或求點到圓的最長與最短距離。
- code: T02
  name: 直線與圓的位置關係
  desc: 以圓心到直線的距離與半徑大小比較，判斷割線、切線或不相交，及交點個數的判定。
- code: T03
  name: 弦心距與垂徑定理計算
  desc: 利用弦心距垂直平分弦所構成的直角三角形，求弦長、弦心距、半徑，或同心圓與平行雙弦的幾何計算。
- code: T04
  name: 圓弧與截面生活應用
  desc: 在拱橋、下水道/涵管水深與水面寬度、水管屋等生活截面情境中，應用垂徑定理進行計算。
- code: T05
  name: 單一切線與畢氏定理
  desc: 利用切線垂直於切點半徑的性質，在直角三角形中求切線段長、圓半徑或圓心到直線的距離。
- code: T06
  name: 圓外一點的兩切線性質
  desc: 由圓外一點向圓引兩條切線，利用切線長相等、箏形與垂直平分性質求切線長、兩切點弦長或相關角度。
- code: T07
  name: 多邊形外切與切線長定理
  desc: 應用切線長定理處理三角形內切圓邊長分割、圓外切四邊形對邊和相等，或矩形/正方形與圓相切問題。
- code: T08
  name: 坐標平面上的圓幾何
  desc: 在直角坐標系中，利用弦的中垂線過圓心或切線垂直性質，求解圓心坐標、半徑或交點坐標。
- code: T09
  name: 圓的尺規作圖與觀念辨析
  desc: 找出圓心或過圓外一點作圓切線的尺規作圖，以及點線圓各項幾何性質與定義的真偽辨析。
- code: T10
  name: 弓形與切線鋪色面積
  desc: 結合弦心距、切線長、圓心角及扇形公式，計算弓形、環形或切線圍成之鋪色區域面積與周長。
