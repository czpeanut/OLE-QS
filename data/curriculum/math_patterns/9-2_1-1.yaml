unit:
  grade: 9
  semester: 2
  code: 1-1
  title: 基本二次函數圖形
  other_titles:
  - 二次函數的圖形與最大值、最小值
  - 二次函數及其圖形
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 543
types:
- code: T01
  name: 二次函數的意義與函數值
  desc: 判斷關係式是否為二次函數，或將給定自變數與點坐標代入函數求值
- code: T02
  name: 圖形的開口方向與大小
  desc: 利用二次項係數正負判斷開口方向，或比較係數絕對值大小判斷開口寬窄
- code: T03
  name: 頂點、對稱軸與極值
  desc: 由標準式判斷二次函數的頂點坐標、對稱軸方程式或最大值與最小值
- code: T04
  name: 二次函數圖形的平移
  desc: 求拋物線經過水平或鉛直方向平移後的新函數、新頂點或對應點坐標
- code: T05
  name: 圖形的線對稱與翻轉疊合
  desc: 探討二次函數圖形以坐標軸或水平線、鉛直線為對稱軸翻轉後的函數關係
- code: T06
  name: 求二次函數關係式
  desc: 依題目給定的頂點、對稱軸或圖形通過的點坐標，列式求出二次函數
- code: T07
  name: 圖形特徵與象限判別
  desc: 根據係數的正負判斷圖形通過的象限與走勢，或由給定圖形辨識函數係數特徵
- code: T08
  name: 圖形對稱性與函數值比較
  desc: 利用拋物線的線對稱性求對稱點坐標，或依離對稱軸遠近比較各點函數值大小
- code: T09
  name: 拋物線與直線交點及幾何計算
  desc: 求二次函數與坐標軸或直線的交點個數、交點坐標、截線段長或幾何圖形面積
- code: T10
  name: 二次函數的生活情境應用
  desc: 利用二次函數建立投籃軌跡、拱橋隧道、杯身容器等生活拋物線情境數學模型
