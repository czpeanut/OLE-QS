unit:
  grade: 9
  semester: 2
  code: 3-2
  title: 角錐與圓錐
  other_titles: []
status: draft
model: gemini-3.7-flash(batch)
sampled: 86
unit_questions: 87
types:
- code: T01
  name: 角錐的頂點、邊與面數性質
  desc: 利用 n 角錐的頂點數 (n+1)、邊數 (2n)、面數 (n+1) 之關係求解或進行幾何性質判斷
- code: T02
  name: 錐體展開圖的辨識與摺疊
  desc: 判斷展開圖能否組裝成角錐或圓錐，以及摺疊後頂點、邊與面的對應重合關係
- code: T03
  name: 正四面體的邊長與表面積
  desc: 四個面皆為全等正三角形的正四面體，或在正方體中截出正四面體的邊長與表面積計算
- code: T04
  name: 正角錐的表面積計算
  desc: 給定底面多邊形與側面等腰三角形的邊長或斜高，計算正角錐的側面積與總表面積
- code: T05
  name: 角錐的錐高與空間長度計算
  desc: 利用畢氏定理求角錐的頂點到底面垂直距離（錐高）、斜高或空間線段長度
- code: T06
  name: 圓錐母線、底半徑與圓心角關係
  desc: 利用圓錐母線長、底圓半徑與展開後側面扇形圓心角度數的比值關係進行計算
- code: T07
  name: 圓錐的表面積與側面積計算
  desc: 已知圓錐底半徑、母線長或錐高，計算底面積、側面扇形面積或圓錐總表面積
- code: T08
  name: 錐體表面上的最短路徑問題
  desc: 求螞蟻或質點在角錐或圓錐側面繞行、移動的最短距離，需透過展開圖直線段求解
- code: T09
  name: 錐體的旋轉體、截台與滾動應用
  desc: 平面圖形旋轉產生之錐體表面積、圓錐/角錐截台面積，或圓錐在平面滾動圈數問題
