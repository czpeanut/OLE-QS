unit:
  grade: 7
  semester: 2
  code: 1-2
  title: 解二元一次聯立方程式
  other_titles: []
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 324
types:
- code: T01
  name: 聯立方程式解的意義與檢驗
  desc: 判斷給定的數對是否為二元一次聯立方程式的解，或利用解的定義進行概念判別。
- code: T02
  name: 消去法的運算步驟與除錯
  desc: 評量代入消去法或加減消去法的操作步驟（如如何消去某未知數、式子變形）或找出解題過程中的錯誤步驟。
- code: T03
  name: 代入消去法求解聯立方程式
  desc: 聯立方程式中至少有一式已呈現單一未知數表示的形式（如 x＝ay＋b、y＝ax 或 x＝k），或題目指定使用代入消去法求解整數係數二元一次聯立方程式。
- code: T12
  name: 加減消去法求解聯立方程式
  desc: 聯立方程式兩式皆已為標準式 ax＋by＝c 與 dx＋ey＝f（整數係數、未知數在左側、常數在右側），主要透過同乘倍數後兩式相加或相減消去一個未知數求解。
- code: T13
  name: 需先移項整理的聯立方程式
  desc: 聯立方程式的等號兩側皆含有未知數項或常數項（如 ax＋by＋c＝dx＋ey＋f），需先進行移項與同類項合併整理為標準式後再求解。
- code: T04
  name: 解含分數、小數或括號的聯立方程式
  desc: 聯立方程式中包含分數、小數或括號，需先去分母、擴分或去括號整理後再求解。
- code: T05
  name: 連等式與圖形等長型聯立方程式
  desc: 題目為 A＝B＝C 的連等式、比例式，或透過正三角形等幾何邊長相等關係轉化為聯立方程式求解。
- code: T06
  name: 絕對值與平方和為零的聯立問題
  desc: 利用絕對值或平方的非負性質（如 |A|＋|B|＝0 或 |A|＋B²＝0）列出二元一次聯立方程式並求解。
- code: T07
  name: 已知方程式的解反求未知係數
  desc: 題目已給定聯立方程式的解（或解的條件），代入方程式以求出未知係數 a、b 之值。
- code: T08
  name: 兩組聯立方程式有相同解
  desc: 給定兩組含未知係數的聯立方程式且解相同，需先由已知方程式解出共同解，再代入求出未知數。
- code: T09
  name: 看錯係數與污損題目的還原問題
  desc: 解題過程中看錯某方程式的係數或題目部分被弄髒遮蔽，利用部分正確條件反推原方程式或正確解。
- code: T10
  name: 對稱與特殊指數型聯立方程式
  desc: 涉及係數對稱（如 ax＋by 與 bx＋ay 相加減）、大係數運算或同底數指數律轉化而成的特殊聯立方程式。
- code: T11
  name: 二元一次聯立方程式與直線交點
  desc: 在直角坐標平面上透過解聯立方程式求兩直線的交點坐標，或由交點坐標反求直線方程式的係數。
refined:
- 拆分 T03 解基本二元一次聯立方程式（78 題）→ T03 代入消去法求解聯立方程式、T12 加減消去法求解聯立方程式、T13 需先移項整理的聯立方程式
