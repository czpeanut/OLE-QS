types:
- code: T01
  name: 平行四邊形的性質判斷
  desc: 判斷或選出平行四邊形對邊、對角、鄰角及對角線等幾何性質的敘述真偽，包含定義與性質的觀念是非選擇題。
- code: T10
  name: 平行四邊形的角度計算
  desc: 利用平行四邊形對角相等、鄰角互補的性質，結合代數列式或平行線截角、多邊形幾何圖形求解各內角與相關角度。
- code: T11
  name: 平行四邊形的邊長與周長
  desc: 利用平行四邊形對邊等長的性質，結合周長或邊長倍數關係列出一元或二元一次方程式，求解邊長、周長或邊上的線段長。
- code: T02
  name: 平行四邊形與角平分線
  desc: 利用內錯角相等結合內角平分線導出等腰三角形，進而計算線段長度、周長或角度。
- code: T03
  name: 複合平行四邊形的邊角關係
  desc: 處理兩個或多個共邊、共頂點或相鄰的平行四邊形組合圖形之角度與邊長推算。
- code: T04
  name: 平行四邊形的對角線性質
  desc: 利用平行四邊形對角線互相平分的性質求線段長、對角線交點所成三角形周長或範圍。
- code: T05
  name: 平行四邊形內部一點的面積
  desc: 利用平行四邊形內部任一點與四頂點連線形成「上下兩三角形面積和等於左右兩三角形面積和」進行求值。
- code: T06
  name: 平行四邊形的面積分割
  desc: 利用對角線四等分面積、邊上一點連線占面積一半或同底等高性質計算分割區塊面積。
- code: T07
  name: 平行四邊形的判別與作圖
  desc: 根據五大判別條件判定四邊形是否為平行四邊形，或辨識平行四邊形尺規作圖的幾何原理。
- code: T08
  name: 平行四邊形的坐標問題
  desc: 在直角坐標平面上，利用對角線中點相同、平移向量求頂點坐標或計算坐標圖形面積。
- code: T09
  name: 平行四邊形摺疊與綜合計算
  desc: 結合圖形摺疊對稱性、垂直高與勾股定理進行線段長度或圖形面積的幾何綜合計算。
refined:
- 拆分 T01 平行四邊形的邊角性質（88 題）→ T01 平行四邊形的性質判斷、T10 平行四邊形的角度計算、T11 平行四邊形的邊長與周長
