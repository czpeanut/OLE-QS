unit:
  grade: 7
  semester: 2
  code: 1-1
  title: 二元一次方程式
  other_titles: []
status: draft
model: gemini-3.7-flash(batch)
sampled: 286
unit_questions: 295
types:
- code: T01
  name: 二元一次式的概念與辨識
  desc: 判斷給定式子是否為二元一次式，或判別式子中各項的係數、常數項與次數。
- code: T02
  name: 以二元一次式表示情境
  desc: 根據文字敘述、生活情境（如買賣、年齡、位值、幾何圖形周長面積等）列出二元一次式。
- code: T03
  name: 二元一次式的化簡
  desc: 進行整數係數二元一次式的去括號、分配律展開與同類項合併運算（含直式運算）。
- code: T04
  name: 分數型二元一次式的化簡
  desc: 進行含分數或分式型態二元一次式的通分與化簡運算。
- code: T05
  name: 二元一次式的代入求值
  desc: 給定未知數 x、y 的具體數值，代入二元一次式計算其所代表的值（含表格填值）。
- code: T06
  name: 依題意列二元一次方程式
  desc: 判斷是否為二元一次方程式，或依題目給定情境與數量關係列出二元一次方程式。
- code: T07
  name: 二元一次方程式的解與檢驗
  desc: 檢驗給定數對 (x, y) 是否為二元一次方程式的解，或探討方程式解的個數（無限多組解）。
- code: T08
  name: 已知方程式的解求未知係數
  desc: 已知一組 (x, y) 為二元一次方程式的解，將其代入以求出方程式中的未知常數或係數。
- code: T09
  name: 二元一次方程式的限制條件解
  desc: 在正整數、非負整數或生活情境合理限制下，求二元一次方程式的解、組數或購買組合方式。
- code: T10
  name: 整體代換與代數式求值
  desc: 已知某二元一次等式或關係式，透過倍數變換或整體代換求另一個二元一次式的值。
