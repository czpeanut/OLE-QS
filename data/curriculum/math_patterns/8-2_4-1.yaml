unit:
  grade: 8
  semester: 2
  code: 4-1
  title: 平行線與截角性質
  other_titles:
  - 平行
  - 平行線
status: draft
model: gemini-3.7-flash(batch)
sampled: 300
unit_questions: 322
types:
- code: T01
  name: 截角名詞與直線關係判斷
  desc: 題目要求辨識同位角、內錯角、同側內角的位置，或利用平面上直線互相垂直、平行的遞移性質進行觀念判斷。
- code: T02
  name: 平行線的判別條件
  desc: 題目給定各角角度或關係，要求判別直線是否互相平行，或找出滿足平行條件之選項。
- code: T03
  name: 平行線基本截角性質求角
  desc: 已知兩直線平行，利用單一截線所產生的同位角相等、內錯角相等或同側內角互補進行角度計算或列式求解。
- code: T04
  name: 兩角之邊互相平行或垂直
  desc: 題目給定兩角的兩邊分別互相平行，或一邊平行另一邊垂直，要求計算角度度數。
- code: T05
  name: 平行線間折線轉折求角
  desc: 題目包含兩平行線間的一道或多道折線（如 M 形、鋸齒形），需過折點作平行輔助線或利用凹凸角關係求解。
- code: T06
  name: 平行線結合角平分線求角
  desc: 題目在平行線結構中引入一條或多條角平分線，結合內錯角與等分角性質計算特定角度。
- code: T07
  name: 正多邊形置於平行線求角
  desc: 題目將正三角形、正方形、正五邊形等幾何圖形置於兩條或多條平行線之間求解相關夾角。
- code: T08
  name: 矩形紙帶摺疊與平行線
  desc: 題目涉及將矩形紙張或平行紙帶沿直線摺疊，利用摺疊前後角度守恆與平行線截角性質求解角度。
- code: T09
  name: 平行線間的圖形面積關係
  desc: 題目利用平行線間距離相等（同底等高）之性質，進行三角形、梯形或四邊形的面積計算與比例推理。
- code: T10
  name: 平行線生活應用與轉角問題
  desc: 題目以人物行走轉向、光線反射、撞球路徑等實際情境呈現，結合平行截角與外角和性質進行解題。
