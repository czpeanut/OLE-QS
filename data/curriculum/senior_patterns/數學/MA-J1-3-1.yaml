unit:
  subject: 數學
  code: MA-J1-3-1
  title: 積分
status: draft
types:
- code: T01
  name: 黎曼和與上下和極限計算
  desc: 等分區間計算有限項上和或下和，或將黎曼和極限轉化為定積分。
- code: T02
  name: 多項式定積分與待定係數
  desc: 套用反導函數與牛頓萊布尼茨公式計算定積分或反推未知係數。
- code: T03
  name: 分段與絕對值函數定積分
  desc: 依絕對值內正負變號點拆解積分區間並分別積分求值或反推參數。
- code: T04
  name: 微積分基本定理微分應用
  desc: 結合變上限積分求導與初始值條件求解高階導數或函數值。
- code: T05
  name: 定積分求曲線圍成面積
  desc: 列式計算函數圖形與坐標軸或兩曲線所圍成封閉區域面積。
- code: T06
  name: 定積分求旋轉體體積
  desc: 運用圓盤法或截面法將平面區域繞坐標軸旋轉一圈的立體體積表為定積分並計算。
- code: T07
  name: 旋轉體與截面立體體積積分
  desc: 利用圓盤法或截面積對高度積分計算旋轉體與四角錐等立體體積。
- code: T08
  name: 定積分求位移與運動學應用
  desc: 對速度函數進行定積分計算行駛距離、位置變化與折返時間。
- code: T09
  name: 反導函數與不定積分計算
  desc: 依據冪次反微分法則求多項式的反導函數與不定積分。
- code: T10
  name: 定積分幾何意義與基本性質判別
  desc: 依據函數圖形與 x 軸上下區域面積判別定積分正負與數值，或檢驗定積分區間可加性等基本性質。
