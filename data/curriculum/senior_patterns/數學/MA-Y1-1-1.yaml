unit:
  subject: 數學
  code: MA-Y1-1-1
  title: 數列的極限與無窮等比級數
status: draft
types:
- code: T01
  name: 無窮數列收斂發散判別
  desc: 依據公比範圍或通項趨近行為判斷無窮數列與級數是否收斂。
- code: T02
  name: 分式與指數數列極限計算
  desc: 利用同除最高次方或最大底數化簡並求無窮數列極限。
- code: T03
  name: 無窮等比級數求和與反推
  desc: 套用無窮等比級數求和公式計算總和，或聯立條件反推首項與公比。
- code: T04
  name: 拆項與循環小數級數求和
  desc: 將一般項拆解為數個等比級數或化循環小數為分數後求無窮和。
- code: T05
  name: 二項式與數列極限綜合
  desc: 結合二項式展開係數和與極限運算性質求極限值。
- code: T06
  name: 夾擠定理與極限性質推論
  desc: 運用夾擠定理求夾逼數列極限或判別極限運算前提與反例。
