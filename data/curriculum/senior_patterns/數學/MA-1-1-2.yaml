unit:
  subject: 數學
  code: MA-1-1-2
  title: 式的運算
status: draft
types:
- code: T01
  name: 乘法公式與高次因式分解
  desc: 運用和差立方、配方法或對稱式乘法公式進行因式分解與求值。
- code: T02
  name: 算幾不等式求幾何極值
  desc: 將周長與面積關係列式後套用算幾不等式求最大面積。
- code: T03
  name: 雙重根號化簡與有理化
  desc: 利用配方法化簡雙重根號或分母有理化。
- code: T04
  name: 根式條件代數求值
  desc: 由已知根式條件搭配乘法公式求解目標代數式。
- code: T05
  name: 分式對稱式降次求值
  desc: 利用 x+1/x 關係遞推求出高次對稱式數值。
- code: T06
  name: 算幾不等式求代數極值
  desc: 將正數代數式配對套用算幾不等式，求乘積或倒數和的極值。
