unit:
  subject: 數學
  code: MA-Y1-2-1
  title: 微分
status: draft
types:
- code: T01
  name: 導數極限定義與可微性判別
  desc: 運用導數極限定義化簡求值，或依左右導數相等判別函數在該點的可微性。
- code: T02
  name: 多項式函數微分公式計算
  desc: 套用冪次法則、加減常數倍及乘積與連鎖律求多項式函數的一階與二階導數。
- code: T03
  name: 曲線上一點的切線方程式
  desc: 利用一階導數求函數圖形在指定切點處的切線斜率與切線方程式。
- code: T04
  name: 過曲線外一點的切線與切點
  desc: 假設切點坐標並利用切線斜率等於兩點連線斜率，聯立求解切點或切線方程式。
- code: T05
  name: 由切線條件反推函數係數
  desc: 結合切點函數值與切線斜率等於導數值的條件，建立聯立方程組反推未知係數。
- code: T06
  name: 多項式與有理函數微分運算
  desc: 運用冪次法則、乘積律與商律計算多項式或有理函數的導函數。
- code: T07
  name: 切線斜率與切線方程式求法
  desc: 利用一階導數求曲線在特定點或給定斜率條件下的切線方程式。
- code: T08
  name: 導數在瞬時變化率之應用
  desc: 求位移函數導數以計算瞬時速度，或估算邊際成本與邊際收入。
- code: T09
  name: 導數條件反推函數與切線
  desc: 由已知切線斜率、切點或極限導數條件聯立反推多項式係數。
- code: T10
  name: 分段函數與連續可微性判別
  desc: 檢驗函數在轉折點或分段點的連續性與左右導數是否相等，判別可微性並反推分段係數。
