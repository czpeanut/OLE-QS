unit:
  subject: 數學
  code: MA-A4-1-3
  title: 空間向量的運算
status: draft
types:
- code: T01
  name: 空間向量性質與內積觀念判別
  desc: 判別空間向量的內積、線性組合與三角不等式觀念正誤。
- code: T02
  name: 空間正射影與參數極值計算
  desc: 求空間向量正射影與垂直分量，或利用參數式求內積最小值。
- code: T03
  name: 空間柯西不等式求極值
  desc: 套用三維空間柯西不等式求解線性式的最大值與最小值。
- code: T04
  name: 外積計算、性質與面積求解
  desc: 計算兩空間向量外積、三角形面積並判別外積基本性質。
- code: T05
  name: 空間向量內積與正射影計算
  desc: 利用空間向量內積求夾角或點在直線上的正射影點。
- code: T06
  name: 空間向量外積與公垂向量
  desc: 運用外積求同時垂直兩向量的法向量與相關性質判別。
- code: T07
  name: 空間柯西不等式與極值求解
  desc: 套用三維柯西不等式或配方求條件下的最大值與最小值。
- code: T08
  name: 平行六面體體積與混合積
  desc: 利用三階行列式絕對值或混合積求平行六面體體積與未知參數。
- code: T09
  name: 空間向量綜合性質與運算
  desc: 整合空間向量長度、內積、面積與體積進行多選項判別或計算。
