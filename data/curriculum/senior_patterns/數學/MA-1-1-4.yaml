unit:
  subject: 數學
  code: MA-1-1-4
  title: 指數
status: draft
types:
- code: T01
  name: 根式與分數指數律化簡
  desc: 將多重根號轉為分數指數並運用指數律化簡為同底冪次。
- code: T02
  name: 科學記號有效數字運算
  desc: 依有效數字位數規範進行科學記號加減乘除運算。
- code: T03
  name: 指數倍數成長與數量級估算
  desc: 建立 2^n 倍數成長模型並結合參考冪次估算所需步數。
- code: T04
  name: 負指數與對稱指數求值
  desc: 利用 a^x 與 a^{-x} 關係求高次指數式的值。
- code: T05
  name: 同底數指數大小比較
  desc: 將不同冪次化為同底或同指數比較大小。
- code: T06
  name: 指數等式換底與指數倒數求值
  desc: 將指數等式轉為同次冪並利用底數乘除關係求指數倒數線性組合。
- code: T07
  name: 指數定義域與運算性質判別
  desc: 檢驗有理與實數指數的底數限制條件並判別指數運算律等式真偽。
- code: T08
  name: 指數代數代換與換底求值
  desc: 將目標冪次拆解為已知指數式的乘冪組合或轉換為指數倒數線性組合求值。
- code: T09
  name: 科學模型與指數律應用求解
  desc: 將實際物理、生物或資訊容量數據代入冪次關係式並以指數律求解倍數或未知數。
