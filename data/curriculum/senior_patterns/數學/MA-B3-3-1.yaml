unit:
  subject: 數學
  code: MA-B3-3-1
  title: 平面向量
status: draft
types:
- code: T01
  name: 向量長度方向與平行伸縮
  desc: 求已知向量的模長、反方向定長向量及兩向量平行的參數值。
- code: T02
  name: 分點公式與三點共線求解
  desc: 利用線段內外分點公式或共線比例關係反推未知點坐標。
- code: T03
  name: 平面幾何向量線性分解
  desc: 在梯形或三角形中以基底向量表示交點向量，利用相似比求係數。
- code: T04
  name: 單位向量、長度與坐標運算
  desc: 進行向量加減、係數積與方向反向之指定長度向量計算。
- code: T05
  name: 向量平移與直線交點求解
  desc: 利用向量平移關係將點坐標代入直線方程式聯立求解。
- code: T06
  name: 向量線性組合與平面基底
  desc: 判別兩非平行向量是否可線性組合出平面上任意向量。
- code: T07
  name: 幾何圖形向量線性分解
  desc: 在正多邊形中以基底向量表示目標向量並求線性組合係數。
- code: T08
  name: 三點共線定理與比例計算
  desc: 運用共線定理或線段比例分解向量求解未知比例參數。
- code: T09
  name: 向量幾何表示與不同向量計數
  desc: 由多邊形頂點決定不同非零向量或進行向量加減幾何表示。
- code: T10
  name: 平面向量線性組合與基底分解
  desc: 利用正六邊形或幾何圖形將目標向量表為兩基底線性組合。
- code: T11
  name: 向量分點公式與共線條件
  desc: 運用分點公式與係數和為 1 判別點在線段上或求交點比例。
- code: T12
  name: 向量線性組合區域與面積比
  desc: 由係數範圍判斷終點區域位置或三角形面積比值。
- code: T13
  name: 向量定義與基本性質闡述
  desc: 說明向量的大小與方向定義、幾何表示法及基本運算性質。
