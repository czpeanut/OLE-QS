unit:
  subject: 數學
  code: MA-2-2-3
  title: 組合
status: draft
types:
- code: T01
  name: 組合選取與分組分堆分配
  desc: 區分是否計序計算組合選取、同人數分堆與分給特定對象方法數。
- code: T02
  name: 重複組合與非負整數解計數
  desc: 利用 H 公式或隔板法求分配問題、非負整數解及不相鄰選取數。
- code: T03
  name: 二項式定理係數與近似估算
  desc: 運用二項式展開通項公式求特定項係數、組合級數和與高次近似值。
- code: T04
  name: 巴斯卡定理與組合數等價轉換
  desc: 利用組合意義與巴斯卡公式轉換與比較組合數大小。
- code: T05
  name: 幾何圖形交點與三角形計數
  desc: 利用組合計算點線構成幾何圖形或斜率分類個數。
- code: T06
  name: 至少一人限制與排容原理
  desc: 針對每組至少或至多若干件的相異物分配，運用全體扣掉違規的排容原理求解。
- code: T07
  name: 條件限制分類選取計數
  desc: 針對男女比例、互斥或指定必選人員，依限制人數分類並以組合相乘加總計算。
- code: T08
  name: 選取即定序與遞增減數列計數
  desc: 利用大小順序唯一對應性質，將遞增遞減數列或得分比較轉化為單純組合選取。
- code: T09
  name: 撲克牌型與成雙襪鞋配對計數
  desc: 先挑選成雙配對的點數或顏色組數，再從剩餘不同類中選取並乘以花色或左右腳。
- code: T10
  name: 限載搭車與分堆分組綜合分配
  desc: 依人數上限或特定人員同組不同組限制，先列舉合法分配型態再分堆給指定對象。
