unit:
  subject: 數學
  code: MA-2-4-1
  title: 直角三角形的三角比
status: draft
types:
- code: T01
  name: 銳角三角比定義與數值計算
  desc: 在直角三角形中依邊長比求正弦、餘弦、正切值或計算特殊角三角比。
- code: T02
  name: 銳角三角比恆等式與對稱求值
  desc: 利用平方關係、商數關係與乘法公式進行化簡求值或解三角方程式。
- code: T03
  name: 直角三角形邊角關係與幾何
  desc: 運用直角三角形內的比例、內接正方形或輔助線搭配三角比求線段長度。
- code: T04
  name: 基礎仰角俯角直角測量應用
  desc: 將單一直角三角形的觀測仰角、俯角或坡度問題轉化為三角比求解。
- code: T05
  name: 銳角三角比定義與圖形求值
  desc: 在直角三角形或梯形等幾何圖形中作輔助高線，依邊長比例求三角比值。
- code: T06
  name: 餘角關係與基本恆等式求值
  desc: 利用餘角互換與平方、商數關係，由單一三角比條件推求其他三角比。
- code: T07
  name: 銳角三角比單調性與大小比較
  desc: 利用銳角正餘弦的遞增減性、範圍界限與非線性性質判別大小或等式真偽。
