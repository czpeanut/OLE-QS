unit:
  subject: 數學
  code: MA-Y1-3-1
  title: 積分
status: draft
types:
- code: T01
  name: 反導函數與不定積分求原函數
  desc: 運用冪次積分公式求多項式反導函數，並結合初始函數值條件決定積分常數。
- code: T02
  name: 多項式定積分計算與待定係數
  desc: 套用微積分基本定理計算多項式定積分，或由已知積分值聯立求解未知係數。
- code: T03
  name: 定積分幾何意義與區域正負號
  desc: 依據函數圖形在 x 軸上下方區域的面積與正負號，計算定積分或絕對值積分。
- code: T04
  name: 絕對值與分段函數的定積分
  desc: 找出絕對值內代數式的變號點拆解積分區間，分別去絕對值後分段積分求值。
- code: T05
  name: 黎曼和與定積分的極限概念
  desc: 透過等分區間的上和、下和或黎曼和極限逼近曲線下面積並轉化為定積分。
- code: T06
  name: 反導函數與不定積分計算
  desc: 依據冪次反微分法則求多項式的反導函數與不定積分。
- code: T07
  name: 定積分基本性質與真偽判別
  desc: 檢驗定積分區間可加性、上下限對調、線性性質與不等式真偽。
- code: T08
  name: 微積分基本定理求定積分
  desc: 套用反導函數與上下限代入計算多項式定積分或反推未知係數。
- code: T09
  name: 幾何面積與絕對值分段積分
  desc: 利用圓面積等幾何意義或依絕對值變號點分段計算定積分。
- code: T10
  name: 黎曼和概念與積分極限轉換
  desc: 運用分割區間上和下和概念或將級數極限轉化為定積分求值。
- code: T11
  name: 積分函數配方或微分求極值
  desc: 將含參數的定積分轉為二次或三次函數後配方或微分求極值。
