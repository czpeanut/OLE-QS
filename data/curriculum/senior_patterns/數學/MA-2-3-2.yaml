unit:
  subject: 數學
  code: MA-2-3-2
  title: 二維數據分析
status: draft
types:
- code: T01
  name: 散布圖判讀與相關係數估計
  desc: 由散布圖點群分布趨勢與斜率、標準差估計或比較相關係數。
- code: T02
  name: 相關係數與迴歸直線直接計算
  desc: 套用離均差乘積和公式計算相關係數 r 與最適直線並預測。
- code: T03
  name: 線性變換對相關與迴歸影響
  desc: 分析兩變數經平移伸縮（含負係數）後對相關係數與迴歸斜率的影響。
- code: T04
  name: 迴歸直線過平均點與殘差性質
  desc: 利用必過樣本平均點、殘差和為零或錯植公式反推正確迴歸直線。
- code: T05
  name: 標準化二維數據分析
  desc: 將二維數據標準化後判讀其散布圖特徵與迴歸關係。
- code: T06
  name: 統計量與平方和求相關迴歸
  desc: 由已知平均數、標準差或平方和與乘積和，運用變異數恆等式與斜率公式求相關係數與迴歸預測。
- code: T07
  name: 相關係數與迴歸反推未知數據
  desc: 已知平均數、相關係數或迴歸直線方程式，聯立離均差公式反推二維數據中的未知項。
