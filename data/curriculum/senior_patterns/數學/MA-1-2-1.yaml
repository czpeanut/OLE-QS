unit:
  subject: 數學
  code: MA-1-2-1
  title: 直線方程式
status: draft
types:
- code: T01
  name: 直線斜率與方程式求法
  desc: 已知兩點、點斜或截距求直線方程式，或判別直線斜率正負與大小。
- code: T02
  name: 三點共線與直線平行垂直
  desc: 利用斜率相等判別三點共線，或處理兩直線平行、垂直及圍成三角形條件。
- code: T03
  name: 直線平移與對稱直線變換
  desc: 將直線沿坐標軸平移或對坐標軸對稱後求新直線方程式與截距。
- code: T04
  name: 點線距離與平行線距離
  desc: 套用點到直線距離公式或兩平行線距離公式計算最短距離與未知參數。
- code: T05
  name: 投影點、對稱點與折線極值
  desc: 求點對直線的投影點與對稱點坐標，或利用對稱法求折線距離和最小值。
- code: T06
  name: 二元一次不等式與半平面
  desc: 判別點在直線的同異側、半平面區域或利用兩點同異側求解參數範圍。
- code: T07
  name: 直線截距與面積極值應用
  desc: 結合直線截距式、點在線上條件與算幾不等式求三角形面積或極值。
- code: T08
  name: 斜率定義與三點共線求解
  desc: 計算兩點斜率、應用坡度限制，或利用斜率相等判定三點共線。
- code: T09
  name: 直線方程式與截距面積
  desc: 依點斜、兩點或截距條件求直線方程式，或求與兩軸圍成三角形面積。
- code: T10
  name: 兩直線平行垂直與中垂線
  desc: 判別兩直線平行、重合、垂直關係，或求線段的中垂線與對稱點。
- code: T11
  name: 平面分點公式與線段交點
  desc: 運用平面內外分點公式求坐標，或求線段與直線交點之比例。
- code: T12
  name: 坐標軸反射求折線最短距離
  desc: 利用點對坐標軸或直線對稱轉換，求解折線路徑長度的最小值。
- code: T14
  name: 直線係數與截距圖形判讀
  desc: 由直線在坐標平面的位置、象限或斜率截距正負反推係數關係。
- code: T15
  name: 兩直線交點與聯立方程組
  desc: 透過係數比或消去法判斷兩直線相交、平行、重合及方程組解的個數。
- code: T19
  name: 平行垂直與幾何中心應用
  desc: 利用平行垂直斜率關係求高、中垂線或三角形幾何頂點坐標。
- code: T20
  name: 直線對稱點與最短路徑
  desc: 求點對直線的對稱點，並應用於光線反射或折線最短距離問題。
- code: T21
  name: 二元一次聯立不等式區域
  desc: 由直線方程式與不等號判別半平面或凸多邊形可行解區域範圍。
