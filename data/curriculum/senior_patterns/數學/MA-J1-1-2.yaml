unit:
  subject: 數學
  code: MA-J1-1-2
  title: 函數與函數的極限
status: draft
types:
- code: T01
  name: 合成函數、奇偶與反函數
  desc: 計算合成函數值，或依對稱性判別奇偶函數與反函數關係。
- code: T02
  name: 函數極限與自然常數定義
  desc: 計算分式、高斯函數左右極限或運用自然常數極限定義求解。
- code: T03
  name: 函數連續性檢驗與求參
  desc: 依據左右極限等於函數值判別連續性，或由連續條件反推參數。
- code: T04
  name: 介值定理與勘根應用
  desc: 檢驗閉區間連續前提並利用端點函數值異號判斷實根存在性。
- code: T05
  name: 函數定義域與配方法極值
  desc: 先求根式或分式函數定義域，再搭配配方法或單調性求極值。
- code: T06
  name: 函數極限有理化與運算性質
  desc: 運用根式有理化、極限四則運算性質或消去零因子反推未知係數並求極限。
- code: T07
  name: 函數圖形判讀極限與連續性
  desc: 由函數圖形判讀單側極限、極限存在性、函數值與連續性。
- code: T08
  name: 高斯函數化簡與分段計數求值
  desc: 依據高斯符號定義將數列或函數分段化簡，並計算區間個數與總和。
- code: T09
  name: 雙重極限反推多項式係數
  desc: 結合趨近無窮大定領導項與趨近定點消去零因子定根，聯立反推未知多項式。
- code: T10
  name: 無理式極限有理化計算
  desc: 針對含根號的零分之零或無窮大減無窮大型極限，乘以共軛根式有理化後消去零因子。
- code: T11
  name: 絕對值與分段去符號求極限
  desc: 依趨近點鄰近區間判別絕對值內正負號，去掉絕對值符號後約分或分左右極限計算。
