unit:
  subject: 數學
  code: MA-A4-2-2
  title: 空間中的直線
status: draft
types:
- code: T01
  name: 空間直線表示法互換與交點
  desc: 進行直線參數式、比例式與兩面式互換，並求與平面或他線交點。
- code: T02
  name: 空間兩直線位置關係與共面
  desc: 判別空間兩直線平行、相交或歪斜及三線是否共面。
- code: T03
  name: 點到空間直線距離與投影點
  desc: 利用參數式與方向向量垂直內積為零求點到直線垂足與距離。
- code: T04
  name: 兩歪斜線公垂線段長計算
  desc: 利用公垂向量投影或距離極值求兩歪斜線的最短距離。
- code: T05
  name: 直線在立體圖形中的幾何應用
  desc: 結合正立方體等立體圖形與空間直線距離公式求邊長或交點。
- code: T06
  name: 直線與平面交點及投影求解
  desc: 將空間直線寫為參數式代入平面方程式，求解交點坐標、時間或正射影直線。
- code: T07
  name: 兩直線參數聯立求交點與角平分線
  desc: 將兩直線表為參數式聯立求解交點坐標，或搭配方向向量求包含平面與角平分線。
- code: T08
  name: 直線與平面平行重合及垂直判別
  desc: 利用直線方向向量與平面法向量的內積及定點檢驗，判別線面平行、重合或垂直。
