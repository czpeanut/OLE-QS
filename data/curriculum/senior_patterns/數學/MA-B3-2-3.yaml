unit:
  subject: 數學
  code: MA-B3-2-3
  title: 對數函數
status: draft
types:
- code: T01
  name: 對數函數圖形單調性凹向
  desc: 分析對數函數在不同參數下的遞增減、凹向與函數值比較。
- code: T02
  name: 對數方程式求解與驗根
  desc: 運用換底公式或指數化將對數方程式轉為二次式求解並檢驗真數正值條件。
- code: T03
  name: 指對數不等式求解定義域
  desc: 透過換元或同底轉換解指對數不等式，並注意真數大於零的定義域限制。
- code: T04
  name: 對數函數圖形與銷售預測
  desc: 由對數函數圖形過點待定平移與底數參數，進而推估未來成長或銷售目標。
- code: T05
  name: 對數函數圖形與凹凸性判別
  desc: 依據中點函數值不等式判別指對數函數的凹凸性與單調性。
- code: T06
  name: 對數不等式與真數定義域
  desc: 運用對數單調性合併真數解不等式並檢驗真數大於零條件。
- code: T07
  name: 對數函數圖形平移與實根個數
  desc: 利用對數函數圖形的平移伸縮變換，並藉由繪圖交點數判斷方程式實根個數。
- code: T08
  name: 指對數圖形交點與大小比較
  desc: 繪製指數與對數函數圖形，比較曲線交點坐標的大小關係。
- code: T09
  name: 對數函數圖形對稱與反函數
  desc: 判斷指數與對數函數圖形對稱於 x 軸、y 軸或直線 y=x 的對稱關係。
- code: T10
  name: 對數函數坐標與幾何計算
  desc: 求對數函數圖形上點坐標，結合斜率、距離或三角形面積等幾何關係求解。
- code: T11
  name: 同底轉換與區間夾擠比大小
  desc: 運用對數律化為同底或以整數區間分界，比較對數值大小與複合函數極值。
- code: T12
  name: 對數運算律驗點與圖形比較
  desc: 運用對數律檢驗圖形上的變換點、比較多條對數曲線係數大小，及求交點斜率與中點坐標。
