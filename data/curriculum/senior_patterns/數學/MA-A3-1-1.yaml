unit:
  subject: 數學
  code: MA-A3-1-1
  title: 弧度量
status: draft
types:
- code: T01
  name: 角度弧度換算與同界角
  desc: 進行度與弳的單位轉換，並求給定實數弧度角的最小正同界角。
- code: T02
  name: 弧度角象限與三角比大小
  desc: 估計實數弧度角所在象限，判斷三角函數值正負或比較大小。
- code: T03
  name: 弧度與角度換算及大小比較
  desc: 將角度與弧度互化並判斷同界角象限與三角比大小。
- code: T04
  name: 弧度特殊角三角比求值
  desc: 利用弧度特殊角與誘導公式計算三角函數值。
- code: T05
  name: 扇形弧長面積與比例應用
  desc: 套用弧度制扇形弧長與面積公式求解幾何比例問題。
- code: T06
  name: 誘導公式化簡與弧度三角比排序
  desc: 將度與弳或不同三角比透過誘導公式化為同函數銳角，比較大小或求極值。
- code: T07
  name: 圓滾動皮帶公切線與圓周角弧長
  desc: 結合公切線段、圓周角與圓輪滾動位移關係，求解弧長、繩長或離地高度。
- code: T08
  name: 弓形與多圓交集複合面積
  desc: 利用扇形面積加減三角形或排容分解，計算弓形、兩圓交集與複合陰影面積。
