unit:
  subject: 數學
  code: MA-1-3-2
  title: 一次與二次函數
status: draft
types:
- code: T01
  name: 二次函數配方與頂點性質
  desc: 將二次函數配方為頂點式，求頂點坐標、對稱軸與函數極值。
- code: T02
  name: 拋物線係數與開口判別
  desc: 由拋物線開口方向、寬窄與平移條件判斷二次項及一次項係數關係。
- code: T03
  name: 閉區間上的二次函數極值
  desc: 比較對稱軸與給定閉區間的相對位置，求解區間內的最大值或最小值。
- code: T04
  name: 二次函數與直線交點極值
  desc: 聯立拋物線與直線求交點，並以鉛直或水平線段差求幾何最值。
- code: T05
  name: 二次函數建模與應用極值
  desc: 將幾何面積、利潤或拋射問題列為二次函數並配方求極值。
- code: T06
  name: 一次與常數函數圖形及斜率
  desc: 辨識常數函數與一次函數圖形、斜率變化率及圖形上下平移關係。
- code: T07
  name: 拋物線平移與係數比較
  desc: 比較兩拋物線頂點或展開係數，反推水平與鉛直平移量及未知係數。
- code: T08
  name: 對稱軸與兩根式待定二次函數
  desc: 利用等高對稱軸或兩根式假設二次函數，代入條件求解係數與頂點極值。
- code: T09
  name: 二次函數圖形象限與正負判別
  desc: 結合因式分解、判別式或對稱距離判斷拋物線通過象限、函數值正負與幾何夾角。
- code: T10
  name: 一次函數斜率與內插求值
  desc: 由一次函數兩點變化率求斜率，並以線性內插或代入計算函數值。
