unit:
  subject: 數學
  code: MA-1-2-3
  title: 圓與直線
status: draft
types:
- code: T01
  name: 圓與直線關係判定及弦長計算
  desc: 比較圓心到直線距離與半徑判定相交、相切、相離，並利用畢氏定理求弦長。
- code: T02
  name: 過圓上一點或已知斜率求切線
  desc: 利用切線垂直半徑性質或圓心距等於半徑求圓上切點或指定斜率切線。
- code: T03
  name: 過圓外一點求切線與切點弦
  desc: 設點斜式搭配圓心距等於半徑求兩條切線，或求切點弦與點光源影長問題。
- code: T04
  name: 圓與直線切線交點軌跡與綜合
  desc: 求解兩互相垂直切線交點軌跡圓或圓面積二等分直線等綜合幾何問題。
- code: T05
  name: 圓與直線不等式區域面積
  desc: 解高次或乘積型圓與直線不等式，繪製可行區域並計算所圍圖形面積。
- code: T06
  name: 圓與直線相交關係判別
  desc: 比較圓心到直線距離與半徑大小，判定相交兩點、相切或相離並求參數範圍。
- code: T07
  name: 已知斜率或切點求圓切線
  desc: 利用圓心到切線距離等於半徑，或過圓上切點垂直半徑求切線方程式。
- code: T08
  name: 過圓外一點求圓的切線
  desc: 設點斜式並配合點線距等於半徑（含鉛直線檢驗），求過圓外一點的兩條切線。
- code: T09
  name: 二元一次聯立不等式區域
  desc: 繪製半平面交集決定可行解區域，計算多邊形面積或線性目標函數極值。
- code: T10
  name: 點到圓的最短與最長距離
  desc: 計算點到圓心距離並加減半徑，求點到圓上動點的極值距離。
- code: T11
  name: 圓與直線相交弦長與位置
  desc: 比較圓心到直線距離與半徑大小，判斷交點個數、弦長或參數範圍。
- code: T12
  name: 圓的切線與切點性質求解
  desc: 利用過切點半徑垂直切線或點線距等於半徑，求切線方程式與未知係數。
- code: T13
  name: 圓上動點與幾何面積極值
  desc: 結合圓心到直線距離與垂直平行關係，求圓上動點構成三角形面積或距離極值。
- code: T14
  name: 二元一次不等式與區域面積
  desc: 繪製二元一次聯立不等式區域並判讀係數正負、計算面積或目標函數極值。
- code: T15
  name: 圓的切線方程式與對稱
  desc: 由過圓上點或圓外點求切線方程式，或利用切線與對稱性質求切點。
- code: T16
  name: 圓的弦長與弦心距計算
  desc: 結合畢氏定理與點到直線距離公式求圓被直線所截的弦長或圓個數。
- code: T17
  name: 圓上點到直線的最值問題
  desc: 利用圓心到直線距離加減半徑求圓上點到直線的最值或面積極值。
