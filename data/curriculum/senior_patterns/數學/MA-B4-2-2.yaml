unit:
  subject: 數學
  code: MA-B4-2-2
  title: 貝氏定理
status: draft
types:
- code: T01
  name: 貝氏定理與條件事後機率反推
  desc: 已知結果發生，套用貝氏定理與樹狀圖反推源自特定前提條件的機率。
- code: T02
  name: 檢驗誤判率與篩檢準確率分析
  desc: 由偽陽性、偽陰性或列聯表數據計算檢測誤判率與陽性預測值。
- code: T03
  name: 貝氏定理與袋球抽樣事後機率
  desc: 依隨機規則選取箱袋或硬幣並抽樣，已知觀測結果反推來自特定來源的事後機率。
- code: T04
  name: 貝氏定理與醫學篩檢誤判反推
  desc: 結合偽陰率、偽陽率與盛行率，由單次或多次檢驗陽性結果反推實際罹病機率。
- code: T05
  name: 貝氏定理與人員分類及誠實推論
  desc: 結合分群比例、達成率或說實話機率，已知結果反推人員類別或陳述真實性的機率。
- code: T06
  name: 單次試驗的貝氏定理後驗機率
  desc: 已知各來源的先驗機率與條件機率，利用貝氏定理反推結果來自特定來源的機率。
- code: T07
  name: 抽袋取球與兩階段貝氏機率
  desc: 先隨機選取容器再抽樣，結合組合計數與貝氏定理求樣本來自特定容器的機率。
- code: T08
  name: 多重檢驗與重複觀測貝氏更新
  desc: 針對同一對象進行多次獨立檢測後，依各次結果聯立更新目標事件的後驗機率。
