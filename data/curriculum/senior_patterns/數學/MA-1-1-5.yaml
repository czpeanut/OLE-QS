unit:
  subject: 數學
  code: MA-1-1-5
  title: 常用對數
status: draft
types:
- code: T01
  name: 常用對數定義與指數互化
  desc: 運用 10^{\log x}=x 恆等式將對數指數式化簡為級數求值。
- code: T02
  name: 常用對數求高次冪位數
  desc: 利用對數近似值計算首數以判斷大數的整數位數。
- code: T03
  name: 首數與尾數求最高位數字
  desc: 由對數尾數夾逼大數的最高位有效數字。
- code: T04
  name: 對數分貝地震與pH應用
  desc: 將聲強、地震能量或酸鹼度公式代入常用對數換算。
- code: T05
  name: 常用對數複利期數估算
  desc: 利用常用對數求解複利翻倍所需年數。
- code: T06
  name: 常用對數律化簡與求值
  desc: 運用對數加減乘除與次方對數律化簡並計算對數式數值。
- code: T07
  name: 指數近似值與對數估算
  desc: 利用已知 10^a 近似值或計算機逼近，搭配指數律拆解估算實數次方數值。
- code: T08
  name: 指對數聯立與倍數換算
  desc: 將對數條件化為指數式代入聯立方程式，或換算倍數關係之常用對數值。
- code: T09
  name: 對數不等式與範圍夾逼
  desc: 將對數不等式轉為 10 的次方夾逼範圍，求解未知數區間或整數解個數。
