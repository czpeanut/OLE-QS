unit:
  subject: 數學
  code: MA-A4-2-1
  title: 空間中的平面
status: draft
types:
- code: T01
  name: 平面方程式與法向量求法
  desc: 由已知點與垂直平面條件、外積或垂直平分面求平面方程式。
- code: T02
  name: 兩平面夾角與位置關係
  desc: 利用兩平面法向量內積求夾角或判別平面平行垂直關係。
- code: T03
  name: 點到平面距離與對稱極值
  desc: 套用點面距離公式求最短距離、對稱點或距離平方和極值。
- code: T04
  name: 線段在平面上的正射影長
  desc: 利用線段向量在平面法向量上的投影扣除法求平面正射影長。
- code: T05
  name: 空間平面反射與光線法向量
  desc: 利用入射與反射向量角平分線求鏡面平面的法向量與方程式。
- code: T06
  name: 兩平面的角平分面方程式
  desc: 依點到兩平面等距離列式，並由法向量夾角判別銳角或鈍角平分面。
- code: T07
  name: 垂直平分面與最近點法向量
  desc: 直接取兩點連線向量或垂足連線向量作為平面法向量並寫出平面方程式。
- code: T08
  name: 點面距離、對稱反射與最值
  desc: 套用點到平面距離公式、對稱點反射法或柯西不等式求投影點與折線距離極值。
- code: T09
  name: 截距式平面與軸截距極值
  desc: 假設平面截距式並結合面積條件或柯西不等式求坐標軸截距線性組合極值。
- code: T10
  name: 立體幾何坐標化與截面距離
  desc: 將正立方體、長方體或四面體置於空間坐標系以求解截面面積、高與線段比值。
