unit:
  subject: 數學
  code: MA-1-3-4
  title: 多項式不等式
status: draft
types:
- code: T01
  name: 一元二次不等式基本求解
  desc: 透過因式分解與拋物線開口判別大於或小於零的實數解區間。
- code: T02
  name: 恆正恆負與判別式範圍
  desc: 利用二次項係數與判別式條件求解二次不等式無解或恆成立的參數範圍。
- code: T03
  name: 根與解區間反推係數
  desc: 由不等式解集端點或函數零點關係反推未知參數與函數值符號。
- code: T04
  name: 高次多項式不等式求解
  desc: 處理含恆正二次因式、奇偶次重根因式的高次不等式求解與整數計數。
- code: T05
  name: 高次不等式解集反推函數
  desc: 依據高次不等式解區間判斷重根結構，建立多項式並代入求值。
- code: T06
  name: 函數圖形判讀高次不等式解
  desc: 依據題附多項式函數與直線或坐標軸交點圖形，直接判讀不等式解區間。
- code: T07
  name: 多項式平移與同解不等式判別
  desc: 透過變數平移變換推算不等式解集，或比對偶次重根端點判別等價不等式。
- code: T08
  name: 含參數高次不等式整數解反推
  desc: 針對含未知參數的高次不等式，依指定整數解個數或包含區間分類討論參數範圍。
