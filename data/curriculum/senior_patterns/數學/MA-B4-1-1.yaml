unit:
  subject: 數學
  code: MA-B4-1-1
  title: 空間概念
status: draft
types:
- code: T01
  name: 立體垂直與空間軌跡判別
  desc: 依等距垂足判別底面外心，或判斷空間中滿足幾何條件的軌跡圖形。
- code: T02
  name: 正四面體高與兩面角計算
  desc: 計算正四面體頂點到底面垂足高度及兩側面夾角餘弦值。
- code: T03
  name: 地球經緯線半徑與弧長計算
  desc: 利用緯度餘弦關係計算緯線半徑、圓周長與同緯度兩地弧長。
- code: T04
  name: 經度時區換算與航程時間
  desc: 依每十五度劃分時區規則計算兩地時差及跨時區飛行當地時間。
- code: T05
  name: 三垂線定理與立體展開距離
  desc: 運用三垂線定理或立體展開求空間線段與最短路徑長。
- code: T06
  name: 球面截面圓與大圓弧長計算
  desc: 利用球心到截面距與畢氏定理求球面半徑，或以球心角弧度計算大圓球面距離。
- code: T07
  name: 空間點線面關係與歪斜判別
  desc: 判別空間中直線與平面的平行、垂直、相交與歪斜關係。
- code: T08
  name: 立體圖形三視圖判讀與面積
  desc: 判讀積木堆疊立體圖形的前視圖、右視圖與上視圖，並計算投影面積。
- code: T09
  name: 立體圖形截面形狀判別
  desc: 判斷平面截正立方體或多面體所得截面多邊形的邊數與形狀。
- code: T10
  name: 立體圖形邊長與表面積計算
  desc: 運用畢氏定理與立體幾何性質計算角錐、錐台等立體圖形的斜高與總表面積。
- code: T11
  name: 多面體圖形稜線共面與歪斜判別
  desc: 在長方體、正立方體、角錐、正八面體或展開圖中，依頂點共面性判別歪斜或垂直。
- code: T12
  name: 空間決定唯一點線面公設判別
  desc: 依據不共線三點、一線與線外一點或平行相交兩線公設，判別決定唯一線面條件。
- code: T13
  name: 空間歪斜線正射影型態判別
  desc: 分析空間中兩歪斜線在不同投影方向下，在平面上形成相交、平行或點線的投影型態。
