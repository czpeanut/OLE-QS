unit:
  subject: 數學
  code: MA-2-2-2
  title: 排列
status: draft
types:
- code: T01
  name: 直線排列與相鄰不相鄰插空
  desc: 運用捆綁法處理相鄰限制與插空法處理不相鄰人員排列。
- code: T02
  name: 同物排列與重複數字字典序
  desc: 計算含重複元素排列數、相同物不相鄰及可重複數字大小排序。
- code: T03
  name: 棋盤捷徑與步數遞迴排列
  desc: 利用棋盤累加或同物排列計算避開障礙捷徑與爬梯步數。
- code: T04
  name: 定序與條件排班特殊排列
  desc: 處理部分元素定序、交錯排列、考程排班與名次限制問題。
- code: T05
  name: 數列與圖形路線分步排列
  desc: 結合對稱或方向限制計算多步驟排列方法數。
- code: T06
  name: 階乘定義與數值大小比較
  desc: 運用階乘展開與乘積估算比較階乘分式與指數次方的大小關係。
