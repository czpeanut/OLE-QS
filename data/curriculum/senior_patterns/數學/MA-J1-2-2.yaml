unit:
  subject: 數學
  code: MA-J1-2-2
  title: 函數性質的判定
status: draft
types:
- code: T01
  name: 導數判別遞增減與極值
  desc: 利用一階導數正負判別函數單調性、水平切線與極大極小值。
- code: T02
  name: 反曲點與圖形對稱中心
  desc: 運用二階導數變號或三次函數配方法求反曲點、對稱中心與一次近似。
- code: T03
  name: 極值判別三次方程式實根
  desc: 結合極大極小值乘積異號與端點正負反推三次方程式參數範圍。
- code: T04
  name: 泰勒展開與函數綜合性質
  desc: 利用綜合除法將多項式表為泰勒形式並判別切線斜率與極值。
- code: T05
  name: 幾何圖形與函數極值應用
  desc: 建立面積或幾何量為變數的函數並以微分求最大值或最小值。
- code: T06
  name: 閉區間臨界點與端點極值比較
  desc: 求出閉區間內一階導數為零的臨界點，並與端點函數值比較大小以定極值。
- code: T07
  name: 二次導函數判別式定單調與極值
  desc: 利用三次函數導函數的領導係數與判別式符號，反推恆單調或有極值之參數範圍。
- code: T08
  name: 由極值條件反推多項式係數
  desc: 依據單調區間端點為導函數之根，或極值點與極限條件聯立反推原多項式係數。
- code: T09
  name: 導函數圖形與係數正負幾何判別
  desc: 由導函數或原函數圖形的零點與凹凸位置，雙向判別極值、反曲點與係數正負。
