unit:
  subject: 數學
  code: MA-A4-1-1
  title: 空間概念
status: draft
types:
- code: T01
  name: 空間線面平行垂直與歪斜判別
  desc: 判斷空間中直線與平面的平行、垂直、相交與歪斜關係。
- code: T02
  name: 三垂線定理計算空間線段長
  desc: 運用三垂線定理找出直角三角形並計算空間線段長度。
- code: T03
  name: 正四面體兩面角與高計算
  desc: 計算正四面體的高、體積與側面底面兩面角餘弦值。
- code: T04
  name: 一般四面體距離與兩面角
  desc: 結合餘弦定理與垂線投影計算四面體頂點到底面的距離。
- code: T05
  name: 空間點線面關係與歪斜判別
  desc: 判別空間中直線與平面的平行、垂直、歪斜與正射影性質。
- code: T06
  name: 三垂線定理與空間線段長
  desc: 運用三垂線定理或空間向量展開求垂直關係與線段長度。
- code: T07
  name: 兩面角與空間投影計算
  desc: 利用兩面角定義與三角比計算點在另一平面上的投影距離。
- code: T08
  name: 正四面體與多面體幾何性質
  desc: 計算正四面體的高、對稜距離、投影點連線或兩面角。
