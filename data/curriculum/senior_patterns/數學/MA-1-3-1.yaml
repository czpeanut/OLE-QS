unit:
  subject: 數學
  code: MA-1-3-1
  title: 多項式的除法原理
status: draft
types:
- code: T01
  name: 多項式定義與係數次數判別
  desc: 依據多項式定義排除分式、絕對值與指數式，或比較多項式係數求解未知數。
- code: T02
  name: 多項式除法原理與商餘換算
  desc: 運用除法原理求解被除式、商式、餘式，或進行除式倍數縮放後的商餘換算。
- code: T03
  name: 餘式定理與高次餘式線性組合
  desc: 代入除式根求一次除式餘式，或利用線性組合求多項式加減乘除後的餘式。
- code: T04
  name: 聯立除式與中國剩餘定理型餘式
  desc: 已知除以兩個一次或二次式的餘式，假設餘式形式聯立求解除以乘積式的餘式。
- code: T05
  name: 因式定理與整係數一次因式
  desc: 運用因式定理、整係數一次因式檢驗法或餘數性質求解未知參數或整數根。
- code: T06
  name: 綜合除法連續展開與泰勒近似
  desc: 利用綜合除法將多項式表為一次式冪次展開，並應用於小數近似或根式求值。
- code: T07
  name: 多項式四則運算與係數和
  desc: 進行多項式加減乘法運算，並代值求常數項、各項係數和或奇偶次項係數和。
- code: T08
  name: 除法原理求商式餘式與整除
  desc: 運用長除法、綜合除法或除法原理恆等式求解未知係數或反推除式。
- code: T09
  name: 泰勒展開式與近似值估算
  desc: 利用連續綜合除法將多項式改寫為一次式的冪次和，並估算小數近似值。
- code: T10
  name: 餘式定理與高次餘式推論
  desc: 運用餘式定理與除式分解技巧，由低次餘式條件組合求解高次除式餘式。
- code: T11
  name: 因式定理與多項式整除反推
  desc: 結合整係數一次因式檢驗法、因式定理或兩式相減消參，推導公因式與係數。
- code: T12
  name: 多項式相等與次數判別
  desc: 依多項式次數定義與恆等係數比較，求解未知係數或常數項。
- code: T13
  name: 餘式定理與綜合除法求值
  desc: 運用餘式定理或綜合除法化簡，求高次多項式除以一次式的餘式。
- code: T14
  name: 因式定理與多項式假設
  desc: 由函數值為零或餘式條件假設因式分解形式，代入條件反推多項式。
- code: T15
  name: 二次以上除式的餘式問題
  desc: 利用除法原理搭配降次或二次式因式分解求餘式。
