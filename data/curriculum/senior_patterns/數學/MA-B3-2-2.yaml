unit:
  subject: 數學
  code: MA-B3-2-2
  title: 對數
status: draft
types:
- code: T01
  name: 對數定義與對數律運算
  desc: 檢驗對數真數大於零條件，運用對數加減與換底公式化簡求值。
- code: T02
  name: 指數與對數互化求代數值
  desc: 利用指數與對數等價定義進行互換並代入代數式求值。
- code: T03
  name: 常用對數近似與數量級
  desc: 運用常用對數近似值估算含根號與冪次之和的對數值或整數位數。
- code: T04
  name: 對數律與換底化簡求值
  desc: 運用對數四則運算、換底公式與自然對數律化簡求值。
- code: T05
  name: 對數性質與定義域判別
  desc: 檢驗對數底數與真數大於零條件判別對數運算式正誤。
- code: T06
  name: 常用對數與級數估算應用
  desc: 將等比級數不等式兩側取常用對數估算最小項數。
- code: T07
  name: 常用對數於科學尺度應用
  desc: 代入酸鹼度、分貝或照度對數公式計算濃度或倍數比例。
