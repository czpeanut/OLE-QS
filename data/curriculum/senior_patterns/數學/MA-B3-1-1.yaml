unit:
  subject: 數學
  code: MA-B3-1-1
  title: 弧度量
status: draft
types:
- code: T01
  name: 角度弧度換算與同界角
  desc: 進行度與弳的單位轉換，並求給定弧度角的最小正同界角。
- code: T02
  name: 扇形弧長與面積公式求解
  desc: 運用弧長與扇形面積公式聯立求半徑、圓心角或周長面積。
- code: T03
  name: 扇形與圓複合陰影面積
  desc: 結合扇形面積、直角三角形與內切圓半徑關係計算複合陰影面積。
- code: T04
  name: 時鐘指針夾角弧度計算
  desc: 計算特定時刻時針與分針的轉動速率差與較小夾角弧度。
- code: T05
  name: 圓內接正多邊形與圓周率
  desc: 利用圓心角弧度與三角比計算圓內接正多邊形周長或面積。
- code: T06
  name: 圓弧與多邊形複合面積
  desc: 將圓角多邊形拆解為扇形、矩形與三角形計算總面積。
- code: T07
  name: 角度與弧度換算及象限判斷
  desc: 進行角度與弳度換算，並由實數弧度估計最小正同界角與象限。
- code: T08
  name: 扇形弧長面積與比例應用
  desc: 套用弧長與扇形面積公式計算圓心角、弧長、面積或黃金比例扇形。
- code: T09
  name: 時鐘指針夾角與重合問題
  desc: 以弧度計算時針與分針的轉動角、夾角及重疊時刻。
- code: T10
  name: 廣義角三角比與誘導公式求值
  desc: 利用弧度形式誘導公式化簡三角比、比較大小或代數表示。
- code: T11
  name: 弧度制三角測量與計算機應用
  desc: 利用弧度角與直角三角形三角比搭配計算機求解仰角或水平距離問題。
- code: T12
  name: 圓錐展開扇形與最短路徑
  desc: 將直圓錐側面展開為扇形，求圓心角及錐面上兩點間的最短路徑長。
