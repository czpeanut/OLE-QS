unit:
  subject: 數學
  code: MA-J1-1-1
  title: 數列的極限與無窮等比級數
status: draft
types:
- code: T01
  name: 數列極限運算與收斂判別
  desc: 檢驗極限存在前提與無窮等比數列收斂條件，判別運算性質真偽。
- code: T02
  name: 多項式與指數型數列極限
  desc: 同除最高次冪或最大底數化簡分式通項並計算極限值。
- code: T03
  name: 根式有理化與極限反推
  desc: 透過分子或分母有理化消除不定型，計算極限或反推未知參數。
- code: T04
  name: 夾擠定理求數列和極限
  desc: 建構上下界不等式夾逼數列和，兩端取極限求收斂值。
- code: T05
  name: 無窮等比級數求和與應用
  desc: 化簡循環小數或幾何級數為無窮等比級數並套用求和公式。
- code: T06
  name: 分項對消與無窮級數極限
  desc: 將無窮級數通項分項對消後對部分和取極限求收斂值。
