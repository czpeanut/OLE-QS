unit:
  subject: 數學
  code: MA-1-1-3
  title: 絕對值
status: draft
types:
- code: T01
  name: 絕對值方程式與不等式求解
  desc: 透過分段討論或幾何距離意義求解含絕對值方程式與聯立不等式。
- code: T02
  name: 含參絕對值不等式反推
  desc: 由絕對值不等式的解區間反推未知係數。
- code: T03
  name: 絕對值距離和差極值
  desc: 利用數線上距離和差的幾何意義求極值。
- code: T04
  name: 雙絕對值分段討論
  desc: 以零點分段去掉多個絕對值符號求解。
- code: T05
  name: 絕對值誤差應用題
  desc: 將實務誤差範圍列為絕對值不等式求解。
- code: T06
  name: 絕對值三角不等式與性質
  desc: 證明或運用三角不等式 |a|+|b|≥|a+b| 及其等號成立條件判別大小關係。
- code: T07
  name: 雙側絕對值比例與平方求解
  desc: 針對兩側均含絕對值的等式，利用兩邊平方或數線分點比例關係求解。
- code: T08
  name: 絕對值區間與乘積範圍推算
  desc: 先解出各變數的絕對值不等式區間，再依端點組合推算乘積或代數式極值。
- code: T09
  name: 雙重絕對值不等式區間求解
  desc: 將雙邊絕對值不等式拆解為聯集區間，求實數解範圍、區間總長或整數解個數。
- code: T10
  name: 絕對值含一次式分段求解
  desc: 針對絕對值外含未知數一次式的方程式或不等式，以零點分段並檢驗增根。
- code: T11
  name: 絕對值非負和整數窮舉求解
  desc: 利用絕對值大於等於零的整數離散性質，限定各項係數範圍並窮舉求整數解。
