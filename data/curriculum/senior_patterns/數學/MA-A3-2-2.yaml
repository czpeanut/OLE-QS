unit:
  subject: 數學
  code: MA-A3-2-2
  title: 對數與對數律
status: draft
types:
- code: T01
  name: 對數定義與換底公式化簡
  desc: 運用對數定義、換底公式與對數律進行乘除加減運算化簡。
- code: T02
  name: 對數比較大小與估計
  desc: 結合換底公式、常用對數近似值與倒數關係比較多個對數數值大小。
- code: T03
  name: 首數與尾數的意義及應用
  desc: 利用科學記號與首尾數性質判斷大數的位數、純小數非零首數位與最高位數字。
- code: T04
  name: 複利儲蓄與對數近似計算
  desc: 建立等比級數複利模型並搭配對數近似值估算高次冪本利和或期數。
- code: T05
  name: 對數定義與換底化簡求值
  desc: 運用對數加減乘除、換底公式與指數對數互化進行化簡求值。
- code: T06
  name: 常用對數首尾數與位數估算
  desc: 運用對數近似值求高次冪或倍數的位數、首位數字及個位數字。
- code: T07
  name: 對數值估計與代數條件求值
  desc: 估計對數所在整數區間或搭配降次多項式計算對數值。
- code: T08
  name: 換底與算幾不等式求極值
  desc: 將不同底數對數轉換為互為倒數形式後套用算幾不等式求極值。
- code: T09
  name: 對數表與複利計算應用
  desc: 利用對數律與已知對數表數值計算複利本利和或期數。
- code: T10
  name: 對數在科學與生活尺度之應用
  desc: 將分貝、地震規模或酸鹼度等對數公式代入數據，計算倍數變化或等級數值。
- code: T11
  name: 對數定義域與運算律正誤判別
  desc: 檢驗對數底數與真數大於零的限制條件並判別對數運算性質等式的真偽。
- code: T12
  name: 指對數互化與對數恆等式求值
  desc: 運用指數與對數互化及換底恆等式化簡指數含對數的運算式或求解對數方程式。
- code: T13
  name: 對數變數代換與倒數關係求值
  desc: 利用換底公式與對數倒數性質將目標對數改寫為已知對數變數的有理組合。
- code: T14
  name: 對數函數關係式與共線求值
  desc: 結合對數線性化、坐標共線斜率或分段遞迴關係式求解未知對數值或函數值。
