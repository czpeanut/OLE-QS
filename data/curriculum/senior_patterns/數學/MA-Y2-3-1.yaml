unit:
  subject: 數學
  code: MA-Y2-3-1
  title: 線性規劃
status: draft
types:
- code: T01
  name: 圖形判別二元一次聯立不等式
  desc: 依據邊界直線方程式與測試點符號寫出圖形對應的聯立不等式組。
- code: T02
  name: 可行解區域頂點與面積計算
  desc: 繪製聯立不等式可行解多邊形區域，求交點坐標並計算區域面積。
- code: T03
  name: 目標函數頂點法求極值
  desc: 將可行解區域頂點代入線性目標函數比較最大值與最小值。
- code: T04
  name: 資源配比與成本最佳化建模
  desc: 依據原料限制或營養需求列出線性規劃不等式並求最低成本或最大利潤。
- code: T05
  name: 運輸問題線性規劃建模求解
  desc: 依倉庫存量與市場需求以雙變數表示各路線運量並求最低運費。
- code: T06
  name: 二元一次聯立不等式圖解
  desc: 繪製聯立不等式所圍成的凸多邊形可行解區域並求其面積或頂點坐標。
- code: T07
  name: 頂點法求線性目標函數極值
  desc: 求出可行解區域各頂點坐標並代入目標函數，比較得出最大值或最小值。
- code: T08
  name: 平行線平移與整數格點求解
  desc: 觀察目標函數直線斜率平移方向，在限制條件內尋找最適整數格點解。
- code: T09
  name: 資源配置與最佳化應用建模
  desc: 將成本、時間或熱量等實際限制列為聯立不等式，建立線性規劃模型求最優解。
- code: T10
  name: 由極值發生頂點反推目標係數
  desc: 已知線性規劃在特定頂點或邊界取得極值，利用斜率比較反推目標函數參數範圍。
- code: T11
  name: 點代入聯立不等式求參數
  desc: 將已知點坐標代入二元一次聯立不等式，聯立求解未知參數的範圍。
