unit:
  subject: 數學
  code: MA-2-2-5
  title: 數學期望值
status: draft
types:
- code: T01
  name: 離散結果金額與點數期望值
  desc: 列出各結果機率與報酬加權求和計算期望值並反推參數。
- code: T02
  name: 期望值線性性質變換
  desc: 運用 E(aX+b)=aE(X)+b 由已知期望值推算新方案期望值。
- code: T03
  name: 對稱配對與期望值加法性質
  desc: 利用餘角配對或期望值可加性計算複合試驗期望值。
- code: T04
  name: 保險定價與公平遊戲決策
  desc: 比較期望獲利與成本保費判斷公平性與預期淨利。
- code: T05
  name: 多輪隨機試驗期望值
  desc: 結合幾何或等比分布概念計算期望得分或獎金。
- code: T06
  name: 組合抽樣與計數期望值計算
  desc: 利用組合數計算不放回抽樣、配對或停止位置等離散個數分布並求期望值。
- code: T07
  name: 極值差值與異色屬性期望值
  desc: 依序統計量極值、兩數差值或異色種類數分類計算組合機率與期望報酬。
- code: T08
  name: 扣本淨利與條件分枝期望值
  desc: 計算扣除成本的淨利期望值、多條件排容分枝獎金，或由期望值反推參數。
