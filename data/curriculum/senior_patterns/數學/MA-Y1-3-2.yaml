unit:
  subject: 數學
  code: MA-Y1-3-2
  title: 積分的應用
status: draft
types:
- code: T01
  name: 曲線與坐標軸所圍成區域面積
  desc: 找出曲線與 x 軸交點及上下方正負區間，利用定積分求封閉區域面積。
- code: T02
  name: 兩曲線所圍成封閉區域的面積
  desc: 聯立兩曲線方程式求交點區間，以「上函數減下函數」的定積分計算面積。
- code: T03
  name: 已知面積比例或等分條件反推
  desc: 根據直線將區域面積等分或兩側面積相等的條件，列式求解未知參數。
- code: T04
  name: 經濟與自然現象的定積分建模
  desc: 結合吉尼係數、羅倫茲曲線或速率位移等情境，建立定積分模型求解總量或平均值。
- code: T05
  name: 定積分求旋轉體體積與截面法
  desc: 運用圓盤法將平面區域繞坐標軸旋轉一圈的立體體積表為定積分並計算。
- code: T06
  name: 曲線與坐標軸所圍面積計算
  desc: 找出函數與 x 軸交點並依正負分段進行定積分求封閉區域面積。
- code: T07
  name: 兩曲線間所圍區域面積計算
  desc: 聯立兩函數求交點並對上下函數差值進行定積分求面積。
- code: T08
  name: 函數的平均值與圖形積分
  desc: 利用定積分除以區間長度計算函數平均值或由幾何面積判讀積分值。
- code: T09
  name: 邊際函數積分求總成本收益
  desc: 對邊際成本或邊際收入積分並結合固定成本條件求總量與變動量。
- code: T10
  name: 消費者剩餘與生產者剩餘
  desc: 聯立供需函數求均衡價量，再以定積分計算消費者與生產者剩餘。
