unit:
  subject: 數學
  code: MA-A3-3-2
  title: 平面向量的運算
status: draft
types:
- code: T01
  name: 平面向量內積與垂直夾角
  desc: 利用內積定義與垂直內積為零求未知參數、兩向量夾角或兩直線夾角。
- code: T02
  name: 向量長度平方與代數展開
  desc: 透過向量和差長度平方展開與已知長度內積關係求向量模長或二次式最小值。
- code: T03
  name: 柯西不等式與內積極值
  desc: 運用內積不等式或柯西不等式求解極值與等號成立條件。
- code: T04
  name: 正射影公式與幾何計算
  desc: 計算向量在另一向量方向上的正射影向量與正射影長。
- code: T05
  name: 二階行列式與平行四邊形
  desc: 運用行列式列運算性質化簡求值，或計算兩向量張成的平行四邊形與三角形面積。
- code: T06
  name: 內積定義、夾角與垂直條件
  desc: 運用內積公式計算向量內積、垂直條件與長度平方展開求夾角。
- code: T07
  name: 正射影計算與投影條件極值
  desc: 求向量正射影、投影長度，或利用投影相同條件求極值。
- code: T08
  name: 幾何向量內積與重心性質
  desc: 結合三角形重心性質與向量和為零展開求解內積與面積。
- code: T09
  name: 直線法向量與角平分線
  desc: 利用單位法向量相加減求兩直線角平分線的法向量。
- code: T10
  name: 柯西不等式求條件極值
  desc: 套用平面向量柯西不等式求解線性目標式的最大值與最小值。
- code: T11
  name: 二階行列式與向量區域面積
  desc: 運用二階行列式性質求值、計算三角形面積或線性組合區域面積。
- code: T12
  name: 向量內積定義與夾角計算
  desc: 利用內積定義、平方展開或餘弦定理求向量內積、長度與夾角。
- code: T13
  name: 直線法向量方向向量與夾角
  desc: 由直線一般式判別法向量、方向向量及兩直線夾角餘弦值。
- code: T14
  name: 向量正射影與垂足計算
  desc: 套用正射影公式求投影向量、投影長或點在直線上的投影點。
- code: T15
  name: 柯西不等式與向量長度極值
  desc: 運用柯西不等式或二次函數配方求線性組合與向量和長度的極值。
- code: T16
  name: 二階行列式與平行四邊形面積
  desc: 利用二階行列式性質或向量線性變換求平行四邊形與三角形面積。
