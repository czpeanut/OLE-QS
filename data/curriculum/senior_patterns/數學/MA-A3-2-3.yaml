unit:
  subject: 數學
  code: MA-A3-2-3
  title: 對數函數
status: draft
types:
- code: T01
  name: 對數函數圖形與對稱性
  desc: 判斷對數函數過定點、遞增減性、凹向性及與指數函數對稱性質。
- code: T02
  name: 對數方程式求解與驗根
  desc: 運用換底公式或指數化將對數方程式轉為二次式求解並檢驗真數正值條件。
- code: T03
  name: 對數不等式求解與定義域
  desc: 依底數大小保持或反轉不等號，並聯立真數大於零條件求實數解範圍。
- code: T04
  name: 對數函數圖形、漸近線與對稱
  desc: 由對數函數圖形判別底數與平移參數，或利用與指數函數對稱性解題。
- code: T05
  name: 圖形交點判斷實根與大小
  desc: 藉由描繪指對數與三角、多項式圖形比較交點坐標或判斷實根數。
- code: T06
  name: 對數不等式與真數定義域
  desc: 結合底數單調性與真數大於零條件求解對數不等式。
- code: T07
  name: 換元化為二次式求極值與解
  desc: 令對數項為新變數轉化為二次函數求極值，或兩側取對數解方程式。
- code: T08
  name: 對數函數坐標與幾何計算
  desc: 求對數函數與直線交點坐標進而計算斜率或幾何量。
- code: T09
  name: 複合對數函數求極值與估值
  desc: 對真數或底數為多項式的對數函數求極值，並估計其所屬整數區間。
