unit:
  subject: 數學
  code: MA-A4-4-3
  title: 矩陣的應用
status: draft
types:
- code: T01
  name: 轉移矩陣定義與性質判別
  desc: 依據行和為 1 且元素非負判別轉移矩陣，並結合行列式或特徵關係求參數。
- code: T02
  name: 馬可夫鏈多步轉移與穩定態
  desc: 建立轉移矩陣模型計算 n 步後狀態分布，或求解長期穩定狀態比例。
- code: T03
  name: 平面旋轉變換矩陣與應用
  desc: 運用旋轉矩陣計算點或圖形旋轉後的新坐標，或反推旋轉角度。
- code: T04
  name: 平面鏡射變換矩陣與對稱
  desc: 寫出對過原點直線的鏡射矩陣，求解對稱點坐標或對稱軸斜角。
- code: T05
  name: 線性變換複合與伸縮推移
  desc: 結合旋轉、鏡射、伸縮與推移矩陣的乘法複合性質，判斷變換類型與面積倍率。
- code: T06
  name: 線性變換面積縮放與行列式
  desc: 利用線性變換後面積等於原面積乘以行列式絕對值，求新面積或反推矩陣參數。
- code: T07
  name: 直線經線性變換與逆矩陣反推
  desc: 以參數代入或逆矩陣反推直線或坐標軸經二階方陣線性變換後的新方程式。
- code: T08
  name: 由對應點反求變換矩陣與幾何性質
  desc: 利用兩組對應點座標列式反求線性變換方陣，或判別變換對向量與周長之影響。
