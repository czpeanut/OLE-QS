unit:
  subject: 數學
  code: MA-1-1-1
  title: 實數
status: draft
types:
- code: T01
  name: 有理數與無理數性質判別
  desc: 利用有理數封閉性或無理數獨立性判別實數運算與相等問題。
- code: T02
  name: 根式的整數與小數部分
  desc: 估計無理數範圍拆解整數部分與純小數部分後代入代數式求值。
- code: T03
  name: 數線距離與等速相遇問題
  desc: 利用數線上兩點位置與比例關係求解坐標或相遇位置。
- code: T04
  name: 分點公式與數線區間
  desc: 運用數線上內外分點公式求坐標或判斷點所在區間。
- code: T05
  name: 循環小數化分數與比較
  desc: 將循環小數化為最簡分數或比較實數大小。
- code: T06
  name: 實數區間的四則運算範圍
  desc: 根據已知實數的範圍，利用不等式性質與因式分解求四則或乘積式的範圍。
- code: T07
  name: 無理數獨立性解聯立方程
  desc: 利用有理係數下無理數的線性獨立性，拆解有理部與無理部聯立求解未知數。
- code: T08
  name: 實數分類化簡與有限小數判別
  desc: 化簡根式與對數後判別有理數與無理數，或分解最簡分數分母質因數判別有限小數。
- code: T09
  name: 實數不等式與根式比大小
  desc: 運用平方展開、分點性質、算幾不等式與反例檢驗比較實數大小及不等式恆成立條件。
