unit:
  subject: 數學
  code: MA-Y2-2-2
  title: 多項式方程式的根
status: draft
types:
- code: T01
  name: 複數域一元二次方程式求解
  desc: 運用公式解求判別式小於零的一元二次方程式共軛虛根。
- code: T02
  name: 根與係數關係及負數開方
  desc: 結合韋達定理判別兩根正負號，小心處理負實數平方根乘積變號並求對稱式。
- code: T03
  name: 勘根定理與實根區間判別
  desc: 計算連續整數點的函數值乘積正負號，利用勘根定理判斷實根所在區間。
- code: T04
  name: 實係數方程式虛根成對定理
  desc: 利用共軛虛根成對性質與奇次實係數方程式必有實根，判別根的個數與存在性。
- code: T05
  name: 已知複數根反推多項式係數
  desc: 由已知虛根構造二次實係數因式，利用長除法或係數比較反推未知係數。
- code: T06
  name: 高次多項式方程式因式分解求解
  desc: 利用分組提公因式或一次因式檢驗法因式分解高次多項式方程式並求解實根與虛根。
- code: T07
  name: 已知共軛虛根反求三次方程式實根
  desc: 由共軛虛根配對或構造二次因式，搭配長除法或韋達定理求三次方程式之實根。
- code: T08
  name: 極值同號與判別式判別虛根範圍
  desc: 利用三次函數極值乘積同號或二次方程式判別式小於零，求解有虛根之參數範圍。
- code: T09
  name: 設共軛虛根與韋達定理反求係數
  desc: 設共軛虛根 a±bi 代入根與係數關係及模長距離條件，反推未知多項式係數。
