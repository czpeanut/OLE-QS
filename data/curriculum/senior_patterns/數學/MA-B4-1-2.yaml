unit:
  subject: 數學
  code: MA-B4-1-2
  title: 空間坐標系
status: draft
types:
- code: T01
  name: 點到軸面距離與投影坐標
  desc: 求空間點到坐標軸、坐標平面距離、投影點及由距離反推坐標。
- code: T02
  name: 空間兩點距離與動點求解
  desc: 利用空間兩點距離公式列式求解坐標軸上滿足比例條件的動點。
- code: T03
  name: 對稱點求空間最短路徑
  desc: 利用點對坐標平面對稱後兩點距離公式求折線最短路徑。
- code: T04
  name: 空間坐標與經緯度互換
  desc: 將地球儀球面點坐標與東經北緯度數進行三角函數換算。
- code: T05
  name: 空間距離與立體圖形體積
  desc: 結合空間兩點距離與畢氏定理計算圓柱體等立體圖形體積。
- code: T06
  name: 空間中點公式與平行四邊形頂點
  desc: 利用對角線中點重合性質求解空間中平行四邊形第四頂點的所有可能坐標。
- code: T07
  name: 立體圖形空間坐標化求解
  desc: 將正方體或角錐置於空間坐標系中，依邊長與對稱性求頂點坐標。
- code: T08
  name: 三軸距或平面投影反推坐標
  desc: 由點到三坐標軸距離或線段在三坐標平面投影長列聯立方程反推點坐標與線段長。
