unit:
  subject: 數學
  code: MA-1-2-2
  title: 圓方程式
status: draft
types:
- code: T01
  name: 圓的標準式與一般式判別
  desc: 由圓心半徑寫出圓方程式，或配方一般式求圓心、半徑及判別圓存在條件。
- code: T02
  name: 過不共線三點求圓與外心
  desc: 代入圓一般式解聯立或利用中垂線交點求過三點的圓方程式與三角形外心。
- code: T03
  name: 點與圓位置及最遠最近距離
  desc: 判別點在圓內外，或利用圓心距加減半徑求圓上點到定點的最遠、最近距離。
- code: T04
  name: 相切條件與截弦求圓方程式
  desc: 結合圓與坐標軸相切、圓心在直線上或截弦長條件反推圓方程式。
- code: T05
  name: 動點距離比與圓的軌跡方程
  desc: 依據動點到兩定點距離比或幾何條件列式化簡求圓的軌跡方程式。
- code: T06
  name: 圓心半徑與標準式列式
  desc: 由同心圓、直徑端點或圓心在特定直線上等條件，求圓的標準方程式。
- code: T07
  name: 圓的一般式判別與極值
  desc: 配方法化簡含參數的二次方程式，判別成圓條件並求面積或半徑極值。
- code: T08
  name: 由幾何條件求圓方程式
  desc: 運用圓心所在直線、過已知點、直徑端點或外接圓條件列式求圓。
- code: T09
  name: 點與圓的位置關係判別
  desc: 將點坐標代入圓方程式比較半徑大小，判斷點在圓內、圓上或圓外。
- code: T10
  name: 圓的幾何性質與實際應用
  desc: 將圓弧拱橋或幾何條件坐標化，代入圓方程式求解未知長度。
- code: T11
  name: 兩圓位置關係與連心線長
  desc: 由兩圓半徑與連心線長判別兩圓相交、相切或相離關係。
