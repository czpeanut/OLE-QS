unit:
  subject: 數學
  code: MA-2-4-2
  title: 廣義角三角比與極坐標
status: draft
types:
- code: T01
  name: 廣義角誘導公式化簡與比大小
  desc: 利用同界角與 180°/90° 誘導公式化簡三角比並比較大小或代數表示。
- code: T02
  name: 象限角與對稱標準位置角求值
  desc: 由三角方程式求廣義角或利用對稱角度正切和消去求級數。
- code: T03
  name: 極坐標與直角坐標互換及面積
  desc: 進行極坐標與直角坐標轉換，並以極徑與夾角求兩點距離與面積。
- code: T04
  name: 單位圓有向角線段幾何表示
  desc: 在單位圓上以有向線段長度對應 sin、cos、tan 正負號。
- code: T05
  name: 三角比平方和差知一求多
  desc: 結合象限正負與平方關係求三角比值。
- code: T06
  name: 斜率與直線傾斜角夾角
  desc: 利用直線斜率等於傾斜角的正切值求解直線傾斜角或兩直線夾角。
- code: T07
  name: 同界角、象限判別與單位圓定義
  desc: 求解廣義角的最小正同界角、半角或倍角所在象限及單位圓終邊坐標表示。
