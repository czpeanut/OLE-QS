unit:
  subject: 數學
  code: MA-A3-2-1
  title: 指數函數
status: draft
types:
- code: T01
  name: 指數函數圖形與單調性
  desc: 依底數大於一或介於零與一之間判斷指數函數的遞增減性、凹向性與過定點性質。
- code: T02
  name: 指數律化簡與對稱求值
  desc: 運用負指數與平方差公式化簡對稱指數代數式。
- code: T03
  name: 同底數指數方程式不等式
  desc: 將兩側化為同底冪次或換元為二次式求解指數方程式與不等式。
- code: T04
  name: 指數複合函數的極值問題
  desc: 結合指數函數單調性與指數部分二次函數配方法求最大值或最小值。
- code: T05
  name: 指數成長衰減與生活建模
  desc: 由實驗數據或圖形點位待定指數模型參數並進行預測。
- code: T06
  name: 指數函數圖形與係數判別
  desc: 由指數函數遞增減、漸近線或與其他函數圖形比較判別係數。
- code: T07
  name: 指數方程式因式分解求解
  desc: 將指數方程式進行因式分解或對稱換元化為二次式求解。
- code: T08
  name: 指數不等式化簡與區間
  desc: 利用底數單調性或正定因式化簡指數不等式並求交集範圍。
- code: T09
  name: 指數運算與數值大小估計
  desc: 運用指數律與常見無理數或對數近似值比較冪次大小。
- code: T10
  name: 指數成長、半衰與冷卻應用
  desc: 建立倍增、半衰期或牛頓冷卻模型並求解時間或參數。
- code: T11
  name: 指數函數圖形交點與幾何量
  desc: 求直線與指數函數圖形交點坐標，進而計算線段長度、斜率或面積。
