unit:
  subject: 數學
  code: MA-Y1-2-2
  title: 函數性質的判定
status: draft
types:
- code: T01
  name: 函數遞增減區間與恆單調條件
  desc: 利用一階導數正負判別遞增減區間，或由恆遞增減搭配二次判別式求參數範圍。
- code: T02
  name: 多項式函數極值與閉區間最值
  desc: 求一階導數為零的臨界點判別極大極小值，並比較端點求出閉區間最大最小值。
- code: T03
  name: 凹向性、反曲點與係數判別
  desc: 運用二階導數變號判別凹向性與反曲點，或由三次函數圖形特徵判別係數正負。
- code: T04
  name: 由極值或反曲點條件反推函數
  desc: 根據已知極值點、單調區間或反曲點切線條件，聯立求解多項式函數未知係數。
- code: T05
  name: 函數圖形與 x 軸交點個數判別
  desc: 先求多項式函數的極值，再依極大與極小值正負號判別圖形與 x 軸交點數。
- code: T06
  name: 幾何與生活中的微分極值應用
  desc: 將體積、面積或距離等應用問題建立為單變數多項式函數，再以導數求最值。
- code: T07
  name: 一階導數判別單調與極值
  desc: 利用導函數正負判別遞增減區間、臨界點及極大極小值。
- code: T08
  name: 二階導數與反曲點凹向性
  desc: 運用二階導數變號判斷圖形凹向性、反曲點坐標與對稱中心。
- code: T09
  name: 導數圖形與多項式係數判別
  desc: 由函數圖形特徵、極值位置與反曲點反推三次多項式係數正負與實根數。
- code: T10
  name: 閉區間極值與實根個數判定
  desc: 比較端點與極值點函數值求閉區間最值，或利用極值正負判別實根數。
- code: T11
  name: 商管經濟與最佳化極值應用
  desc: 建立成本、利潤或總收入函數並利用微分求解邊際變化與極值。
