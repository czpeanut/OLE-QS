unit:
  subject: 數學
  code: MA-J2-1-1
  title: 離散型隨機變數
status: draft
types:
- code: T01
  name: 離散隨機變數機率分布表
  desc: 依試驗條件列出隨機變數的所有可能取值與對應機率，並利用機率總和為一求參數。
- code: T02
  name: 離散隨機變數期望值計算
  desc: 結合排列組合或抽樣情境求離散型隨機變數的機率分布與數學期望值。
- code: T03
  name: 期望值的線性與可加性質
  desc: 運用 E(aX+b)=aE(X)+b 或抽取多件之期望值可加性推算期望值。
- code: T04
  name: 隨機變數變異數與標準差
  desc: 套用定義或平方期望值減期望值平方公式計算變異數、標準差與檢驗不等式關係。
- code: T05
  name: 隨機變數線性變換統計量
  desc: 利用 E(aX+b) 與 Var(aX+b)=a^2 Var(X) 性質推算線性變換後之統計量。
- code: T06
  name: 期望值反推未知數量或獎金
  desc: 已知期望值或公平遊戲條件，反推袋中未知物品數量或合理賠付金額。
- code: T07
  name: 多輪或中止試驗期望值
  desc: 計算含停止條件之重複試驗或賽局中止時依勝率分配獎金的期望值。
- code: T08
  name: 離散隨機變數變異數與標準差
  desc: 套用定義或二階矩減期望值平方公式計算隨機變數的變異數與標準差。
- code: T09
  name: 期望值與變異數反推未知參數
  desc: 已知期望值或變異數數值，聯立機率總和條件求解未知機率或數值。
