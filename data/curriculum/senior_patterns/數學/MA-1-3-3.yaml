unit:
  subject: 數學
  code: MA-1-3-3
  title: 三次函數的圖形特徵
status: draft
types:
- code: T01
  name: 三次函數標準式圖形特徵
  desc: 依標準式係數正負判斷三次函數圖形走勢、對稱中心附近斜率與極值有無。
- code: T02
  name: 三次函數配方與圖形平移
  desc: 透過消去二次項配方找出對稱中心，判斷兩三次函數圖形是否平移重合。
- code: T03
  name: 三次函數對稱中心性質
  desc: 運用對稱中心與直線交點成對對稱的特性，反推函數係數與函數值。
- code: T04
  name: 三次函數某點的一次近似
  desc: 將三次函數表為以指定點為中心的多項式並擷取一次式作為局部線性近似。
- code: T05
  name: 廣域與局部特徵綜合判別
  desc: 結合領導係數廣域走勢與對稱中心局部斜率分析三次函數圖形。
