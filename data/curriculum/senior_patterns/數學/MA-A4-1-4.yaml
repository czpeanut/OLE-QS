unit:
  subject: 數學
  code: MA-A4-1-4
  title: 三階行列式
status: draft
types:
- code: T01
  name: 三階行列式性質與列運算
  desc: 利用行列互換、某列倍數加減他列等性質判別或計算行列式值。
- code: T02
  name: 三階行列式展開與參數求解
  desc: 直接展開三階行列式或結合幾何意義求解未知參數。
- code: T03
  name: 克拉瑪公式與三元聯立方程
  desc: 運用三階行列式判別三元一次方程組解的類型。
- code: T04
  name: 特殊結構三階行列式化簡
  desc: 利用因式分解或列運算化簡范德蒙或對稱型三階行列式。
- code: T05
  name: 三階行列式與向量共面判別
  desc: 由三向量構成的行列式為零判別共面或線性相依。
- code: T06
  name: 平行六面體有向體積與線性組合
  desc: 利用三階行列式表示空間三向量有向體積，並依列運算性質求線性組合後的體積。
- code: T07
  name: 范德蒙型三階行列式因式分解
  desc: 辨識各行或各列呈一次與平方次或三次方的范德蒙結構，直接套用差積公式因式分解求解。
