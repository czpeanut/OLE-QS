unit:
  subject: 數學
  code: MA-A3-1-3
  title: 三角的和差角公式
status: draft
types:
- code: T01
  name: 正切和差角公式與兩線夾角
  desc: 運用正切和差角公式求兩直線夾角正切值，或由幾何圖形推導正切關係。
- code: T02
  name: 和差角公式化簡與求值
  desc: 運用正餘弦與正切和差角公式展開或逆用公式化簡求三角函數值。
- code: T03
  name: 二倍角與三倍角公式計算
  desc: 利用倍角與降次公式進行三角式化簡、求值或轉化為二次函數求極值。
- code: T04
  name: 半角公式與象限正負判別
  desc: 依據半角所在象限決定正負號，套用半角公式求三角函數值。
- code: T05
  name: 幾何圖形和差角與倍角
  desc: 在三角形或正方形中將夾角表為兩角和差，搭配正弦或正切公式求解。
- code: T06
  name: 兩直線夾角與斜率公式
  desc: 利用斜率與正切和差角公式求兩直線交角或特定夾角直線方程式。
- code: T07
  name: 正餘弦和差角公式求值
  desc: 依象限條件求出各角三角比後代入正餘弦和差角公式。
- code: T08
  name: 正切和差角與方程式綜合
  desc: 運用正切和差角公式搭配韋達定理求解角度或三角比。
- code: T09
  name: 倍角與半角公式降次求值
  desc: 運用二倍角或半角公式轉換角度並依象限決定正負號。
- code: T10
  name: 幾何圖形與和差角公式
  desc: 從直角三角形或圓幾何關係建立正切值並以和差角求解。
