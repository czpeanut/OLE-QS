unit:
  subject: 數學
  code: MA-B4-4-1
  title: 圓錐曲線
status: draft
types:
- code: T01
  name: 平面截直圓錐面截痕判別
  desc: 比較截面與圓錐軸線及母線夾角，判別圓、橢圓、拋物線、雙曲線或退化圖形。
- code: T02
  name: 平面截直圓柱面截痕判別
  desc: 依截面與圓柱軸線垂直、斜交或平行關係，判別圓、橢圓或平行兩直線等截痕。
- code: T03
  name: 圓錐截痕丹德林雙球幾何證明
  desc: 利用丹德林雙球切線段等長性質推導截痕焦點與定義距離關係。
- code: T04
  name: 生活中圓錐曲線光影與軌跡
  desc: 判別手電筒光束、圓錐燈罩或日晷投影在平面上的圓錐曲線類型。
- code: T05
  name: 圓錐曲線焦點性質與光學反射
  desc: 運用拋物線、橢圓或雙曲線的光學反射與焦點距離定義求解應用問題。
- code: T06
  name: 截面與旋轉角度範圍計算
  desc: 利用圓錐高與底圓半徑或平面法向量夾角關係，計算產生特定截痕的截面角度或範圍。
- code: T07
  name: 垂直雙平面光影截痕連動
  desc: 分析直圓錐光束同時投射於互相垂直兩平面（如牆壁與地板）的截痕連動關係。
