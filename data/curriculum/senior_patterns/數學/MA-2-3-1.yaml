unit:
  subject: 數學
  code: MA-2-3-1
  title: 一維數據分析
status: draft
types:
- code: T01
  name: 集中趨勢與百分位數累計計算
  desc: 由累計人數表或原始數列計算平均數、中位數、眾數與第 k 百分位數。
- code: T02
  name: 變異數標準差計算與增減變動
  desc: 計算離均差平方平均，或判斷資料增減更正後對統計量與二階矩的影響。
- code: T03
  name: 線性平移伸縮與z分數標準化
  desc: 利用 y=ax+b 對平均數、標準差的影響及 z 分數進行跨科比較。
- code: T04
  name: 分組資料合併與缺漏數據反推
  desc: 由分組平均與標準差求合併全體標準差，或反推污損缺漏的原始數據。
- code: T05
  name: 幾何平均數與平均成長率
  desc: 將連續多期成長率化為連乘開方計算年或日平均成長率。
- code: T06
  name: 統計圖表判讀與比率比較
  desc: 從多維統計表格中讀取數據並比較趨勢、差額與佔比。
