unit:
  subject: 數學
  code: MA-A4-1-2
  title: 空間向量的坐標表示法
status: draft
types:
- code: T01
  name: 空間坐標投影與距離計算
  desc: 求空間點或線段在坐標軸與坐標平面上的投影及投影長。
- code: T02
  name: 空間向量坐標與平行四邊形
  desc: 利用空間向量相等求解平行四邊形頂點坐標。
- code: T03
  name: 空間分點公式與等速運動
  desc: 運用空間分點公式或內角平分線比例求解動點與交點坐標。
- code: T04
  name: 空間向量線性組合區域軌跡
  desc: 依參數範圍判斷空間向量線性組合終點軌跡與面積比例。
- code: T05
  name: 空間點坐標與對稱投影點
  desc: 求空間點對坐標軸或坐標平面的投影點、對稱點與距離關係。
- code: T06
  name: 空間長方體坐標化與向量運算
  desc: 建立空間直角坐標系求多面體頂點、中點坐標與向量運算。
- code: T07
  name: 空間對稱反射與鏡面光線路徑
  desc: 結合空間坐標比例與平面鏡反射性質求反射點或光線通過點。
- code: T08
  name: 空間向量的線性組合分解
  desc: 在平行六面體或四面體中，將目標向量表示為三個不共面基底向量的線性組合並求解係數。
- code: T09
  name: 空間多面體頂點坐標反推
  desc: 由已知空間頂點距離、對角線與對稱性質，反推正立方體、長方體或正四面體的其餘頂點與體積。
