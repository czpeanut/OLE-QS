unit:
  subject: 數學
  code: MA-A4-4-1
  title: 三元一次聯立方程式
status: draft
types:
- code: T01
  name: 高斯消去法與增廣矩陣列運算
  desc: 對增廣矩陣進行列運算化簡為階梯形矩陣，求解聯立方程組或反推未知係數。
- code: T02
  name: 含參三元聯立方程組解的討論
  desc: 利用高斯消去法或三階行列式判別方程組恰有一解、無解與無限多解的參數條件。
- code: T03
  name: 三元一次聯立方程組應用與極值
  desc: 依題意列出三元一次聯立方程式求解未知數，或以參數式搭配配方求代數極值。
- code: T04
  name: 三平面幾何位置關係與交線
  desc: 結合三元一次方程組解的結構判別空間中三個平面的相交一點、交於一線或平行關係。
- code: T05
  name: 齊次方程組與比例非零解求解
  desc: 利用常數項為零的齊次聯立方程組求變數比例關係，並代入目標分式求值。
- code: T06
  name: 階梯形矩陣解的結構判別
  desc: 由階梯形增廣矩陣的零列與主元數目，直接判別方程組恰有一解、無解或無限多解。
- code: T07
  name: 化簡矩陣回代解反推係數
  desc: 先由列運算後的階梯形矩陣解出方程組的解，再代回原方程組反推未知係數。
- code: T08
  name: 列等價矩陣行向量線性關係
  desc: 利用列運算不改變行向量線性組合關係的性質，由已知行向量組合反推未知元素。
- code: T09
  name: 對稱型含參方程組消元討論
  desc: 針對係數具循環對稱結構的含參方程組，先將各列相加提出公因式後再分類討論。
- code: T10
  name: 行列式與克拉瑪判別方程組解
  desc: 計算係數行列式與各分行列式，依行列式為零條件判別方程組無解或無限多解。
