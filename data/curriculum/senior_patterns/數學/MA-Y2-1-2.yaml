unit:
  subject: 數學
  code: MA-Y2-1-2
  title: 二項分布
status: draft
types:
- code: T01
  name: 二項分布機率質量計算
  desc: 辨識固定次數獨立重複試驗，套用 C(n,k)p^k(1-p)^(n-k) 計算恰成功 k 次的機率。
- code: T02
  name: 二項分布期望值與標準差
  desc: 運用 E(X)=np 與 Var(X)=np(1-p) 公式計算重複試驗成功次數的期望值與標準差。
- code: T03
  name: 二項分布最大機率項判別
  desc: 比較相鄰兩項機率比值，求二項分布中出現機率最大的成功次數。
- code: T04
  name: 幾何分布與累積成功機率
  desc: 計算重複獨立試驗直到首次成功所需次數的機率分布與期望次數。
- code: T05
  name: 二項檢定與拒絕域判別
  desc: 依據虛無假設的二項分布機率與顯著水準，計算雙尾或單尾檢定的拒絕域。
- code: T06
  name: 二項分布圖形與參數判別
  desc: 依據機率質量函數圖的峰值位置或偏態，比較或反推成功機率與參數大小。
- code: T07
  name: 二項分布試驗判別與單項機率
  desc: 檢驗隨機變數是否符合獨立重複二項分布並套用公式計算單項或累積成功機率。
- code: T08
  name: 二項分布眾數比較與停止機率
  desc: 比較相鄰項機率大小判別眾數，或計算第 k 次成功恰發生於末次試驗的機率。
- code: T09
  name: 由期望值與變異數反推參數
  desc: 依據二項分布的期望值與變異數公式列聯立方程式反推試驗次數與成功機率。
