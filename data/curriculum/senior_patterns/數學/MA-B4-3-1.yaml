unit:
  subject: 數學
  code: MA-B4-3-1
  title: 矩陣的運算
status: draft
types:
- code: T01
  name: 矩陣列式與基本加減純量積
  desc: 依元素通式構建矩陣或進行矩陣加減法、純量積與相等係數比較。
- code: T02
  name: 矩陣乘法與交換律條件求解
  desc: 利用矩陣乘法運算規則或 AB＝BA 交換條件求解未知參數。
- code: T03
  name: 矩陣高次方規律與週期推算
  desc: 計算矩陣低次冪尋找週期性或等比規律，進而推求高次方矩陣。
- code: T04
  name: 二階反方陣存在判別與求法
  desc: 計算二階方陣行列式值判別可逆性，或套用公式求反方陣與未知參數。
- code: T05
  name: 矩陣代數恆等式與反方陣化簡
  desc: 運用分配律與反方陣消去律化簡矩陣多項式或反推未知矩陣。
- code: T06
  name: 線性方程組的矩陣表示與求解
  desc: 將二元或三元一次聯立方程組改寫為矩陣乘積並利用反方陣求解。
- code: T07
  name: 矩陣乘法列式與加權應用
  desc: 將表格數據轉為矩陣並利用矩陣乘法計算加權總分或反推未知項目。
- code: T08
  name: 矩陣密碼編譯與反矩陣解密
  desc: 將文字編碼化為矩陣乘積進行加密，並利用反矩陣運算還原原始訊息。
