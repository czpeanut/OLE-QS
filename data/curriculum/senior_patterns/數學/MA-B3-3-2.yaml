unit:
  subject: 數學
  code: MA-B3-3-2
  title: 平面向量的運算
status: draft
types:
- code: T01
  name: 向量內積性質與真偽判別
  desc: 檢驗向量垂直、內積分配律與長度平方恆等式的概念正確性。
- code: T02
  name: 坐標內積夾角與兩線交角
  desc: 計算兩向量的內積與夾角餘弦值，或利用法向量內積求兩直線夾角。
- code: T03
  name: 向量垂直與模長平方計算
  desc: 運用垂直內積為零搭配和差長度平方展開求未知向量長度。
- code: T04
  name: 正射影與三角形重心綜合
  desc: 計算向量在另一向量上的正射影，並結合面積相等求三角形重心坐標。
- code: T05
  name: 多邊形邊角與分點內積
  desc: 在正六邊形或凸五邊形中將邊向量分解或坐標化，計算內積與線段長。
- code: T06
  name: 內積定義、分配律與垂直條件
  desc: 運用內積分配律展開求值或利用內積為零求解垂直參數。
- code: T07
  name: 幾何坐標化與分點長度計算
  desc: 將幾何圖形坐標化求內積，或利用分點公式平方求線段長。
- code: T08
  name: 直線法向量與夾角計算
  desc: 辨識直線法向量與方向向量並以內積求兩直線夾角餘弦值。
- code: T09
  name: 正射影與向量夾角平分
  desc: 求向量正射影與垂直分量，或利用等長向量和條件平分夾角。
- code: T10
  name: 向量線性組合區域面積
  desc: 計算兩向量線性組合所張成平行四邊形區域的面積。
- code: T11
  name: 向量內積定義與夾角計算
  desc: 運用內積定義、幾何投影或平方展開求內積、長度與夾角。
- code: T12
  name: 直線法向量方向向量與夾角
  desc: 由直線一般式判別法向量、方向向量及兩直線夾角餘弦值。
- code: T13
  name: 向量正射影與參數反推
  desc: 套用正射影公式求投影向量或由已知正射影反推未知分量。
- code: T14
  name: 向量線性組合長度極值
  desc: 利用配方或幾何垂直投影求向量線性組合長度的最小值。
- code: T15
  name: 幾何圖形中向量內積與長度
  desc: 結合三角形三邊長、餘弦定理或分點公式計算圖形中向量內積與長度。
- code: T16
  name: 柯西不等式與條件極值
  desc: 套用平面向量柯西不等式求解二次曲線或線性限制下的極值與等號成立點。
