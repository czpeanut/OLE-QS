unit:
  subject: 數學
  code: MA-Y1-1-2
  title: 函數與函數的極限
status: draft
types:
- code: T01
  name: 函數極限與連續性觀念判別
  desc: 判別左右極限存在與相等關係、函數極限存在條件，及極限與連續性的等價或反例。
- code: T02
  name: 多項式與分式直接代入求極限
  desc: 直接代入極限點計算多項式或分母非零分式極限，或判別分母為零且分子非零時極限不存在。
- code: T03
  name: 分段、絕對值與高斯函數左右極限
  desc: 針對分段定義、含絕對值或高斯符號函數，分別求左右極限並判斷雙側極限是否存在。
- code: T04
  name: 不定型約分化簡求極限
  desc: 透過通分、乘法公式展開或因式分解消去零因子後，代入極限點求不定型分式極限。
- code: T05
  name: 由函數極限存在反推參數
  desc: 利用分母趨近零時分子必趨近零及約分後極限值條件，反推函數式中的未知係數。
- code: T06
  name: 夾擠定理求函數極限
  desc: 計算上下界函數在極限點的相同極限值，依夾擠定理推求夾逼函數的極限。
- code: T07
  name: 函數連續性檢驗與求參
  desc: 依據左右極限等於該點函數值的連續定義，檢驗函數連續性或反推分段函數未知參數。
- code: T08
  name: 介值定理與勘根應用
  desc: 檢驗閉區間連續前提並利用端點函數值關係，判斷函數值存在性或實根所在整數區間。
- code: T09
  name: 函數圖形判讀極限與連續性
  desc: 由函數圖形判讀單側極限、極限存在性、函數值與連續或可微性。
- code: T10
  name: 函數極限性質與連續性概念
  desc: 判別左右極限、連續定義及合成函數連續性等敘述的真偽。
- code: T11
  name: 分式不定型消因式求極限
  desc: 透過因式分解或通分約去零因式，計算多項式與有理函數的極限值。
- code: T12
  name: 介值定理與連續函數勘根
  desc: 檢驗連續前提並利用端點函數值比較，判斷方程式實根或特定值區間。
- code: T13
  name: 函數定義域值域與分段求值
  desc: 求根式或分式函數的定義域與值域，或依條件代入分段與合成函數求值。
- code: T14
  name: 函數定義域、奇偶性與合成
  desc: 判別函數的定義域範圍、奇偶對稱性，或計算合成函數之對應關係式。
