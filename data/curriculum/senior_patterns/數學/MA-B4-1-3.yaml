unit:
  subject: 數學
  code: MA-B4-1-3
  title: 平面上的比例
status: draft
types:
- code: T01
  name: 單點透視圖與線段比例判讀
  desc: 依據單點透視消失點連線與平行縮放關係判讀物體實際長度。
- code: T02
  name: 黃金比例定義與比值計算
  desc: 列出一元二次比例式求解黃金分割比值與近似分數。
- code: T03
  name: 黃金矩形與螺線幾何性質
  desc: 運用黃金矩形分割不變性求解邊長與面積問題。
- code: T04
  name: 紙張規格與長寬比應用
  desc: 分析常用紙張對摺相似比與無理數長寬比例關係。
- code: T05
  name: 比例尺與相似形生活應用
  desc: 結合相似三角形與比例概念求解實際測繪長度。
- code: T06
  name: 透視消失點定位與坐標投影
  desc: 延伸平行線交點定位單點透視消失點，或建立坐標系與對角線交點求投影坐標。
- code: T07
  name: 黃金比例身材修正與矩形比近似
  desc: 列出含未知數的高跟鞋修正比例方程式求解，或比較物件長寬比與黃金比例之逼近。
