unit:
  subject: 數學
  code: MA-A4-4-2
  title: 矩陣的運算
status: draft
types:
- code: T01
  name: 矩陣加法係數積與計數
  desc: 進行矩陣相等比較、加減法與純量積運算，或計數滿足特定條件的矩陣個數。
- code: T02
  name: 矩陣乘法與方陣冪次規律
  desc: 執行矩陣相乘求解未知元，或推算高次方陣冪次的週期與歸納規律。
- code: T03
  name: 反矩陣存在條件與求解
  desc: 判斷二階方陣可逆條件並求反矩陣，或利用矩陣乘法反推未知矩陣。
- code: T04
  name: 矩陣方程與聯立矩陣求解
  desc: 透過矩陣加減消去或左乘右乘反矩陣，解出未知矩陣或乘積式。
- code: T05
  name: 矩陣密碼編譯與線性建模
  desc: 將實際資料或加密編碼問題化為矩陣乘法，並以反矩陣還原解密。
- code: T06
  name: 矩陣乘法代數性質與交換律判別
  desc: 檢驗矩陣乘法不具交換律與消去律的反例，並展開二項矩陣乘法式求解。
