unit:
  subject: 數學
  code: MA-A3-1-2
  title: 三角函數的圖形
status: draft
types:
- code: T01
  name: 三角函數週期振幅與值域
  desc: 判別正餘弦、正切及含絕對值三角函數的週期、振幅與值域。
- code: T02
  name: 三角函數圖形平移與伸縮
  desc: 由圖形平移伸縮變換推求新函數式，或由函數圖形特徵反推參數。
- code: T03
  name: 三角方程式實根與交點數
  desc: 繪製三角函數與直線或另一三角函數圖形，數算區間內交點個數。
- code: T04
  name: 週期性生活現象三角建模
  desc: 將摩天輪、潮汐或風力發電等週期運動轉化為三角函數模型求解。
- code: T05
  name: 三角函數週期判別與計算
  desc: 利用係數或絕對值圖形特徵判斷三角函數的最小正週期。
- code: T06
  name: 圖形平移伸縮與對稱性質
  desc: 分析三角函數圖形經平移、伸縮或絕對值變換後的特徵。
- code: T07
  name: 週期性資料擬合函數參數
  desc: 由最高最低點或觀測數據反推正弦模型的振幅、週期與平移。
- code: T08
  name: 三角二次函數換元求極值
  desc: 結合平方關係與範圍限制將三角式化為二次函數求極值。
- code: T09
  name: 三角不等式圖形交點求解
  desc: 繪製三角函數圖形並找出交點臨界角，求解給定區間內的三角不等式範圍。
- code: T10
  name: 由圖形特徵反推三角函數參數
  desc: 由圖形波峰、波谷、零點與週期計算振幅與頻率係數，並代入圖形點反推相位角或辨識函數。
- code: T11
  name: 誘導公式與週期平移重合求解
  desc: 運用正餘弦誘導公式與週期同界角條件，判斷兩三角函數是否可透過平移重合並求解平移量。
