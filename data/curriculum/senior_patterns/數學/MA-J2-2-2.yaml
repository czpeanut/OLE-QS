unit:
  subject: 數學
  code: MA-J2-2-2
  title: 複數的幾何意涵
status: draft
types:
- code: T01
  name: 複數極式旋轉伸縮與面積
  desc: 利用複數商或積的模長與輻角求幾何三角形邊長夾角與面積。
- code: T02
  name: 隸美弗定理與高次方計算
  desc: 將複數化為極式並套用隸美弗定理進行冪次化簡與運算。
- code: T03
  name: 單位根性質與因式分解
  desc: 運用 n 次單位根對稱性與分圓多項式因式分解求乘積或級數和。
- code: T04
  name: 單位根幾何位置與週期求值
  desc: 結合單位圓上點與平移複數的幾何距離條件反推最小次數 n。
- code: T05
  name: 複數平面距離與軌跡極值
  desc: 將複數絕對值轉化為圓或中垂線軌跡並求解距離最大最小值。
- code: T06
  name: 複數標準式與極式互換
  desc: 計算複數向徑長與主輻角，將 a+bi 轉換為 r(cosθ+i sinθ) 極式表示。
- code: T07
  name: 複數極式乘除與幾何旋轉伸縮
  desc: 調整負號與餘角將複數化為標準極式，利用向徑相乘與輻角相加減求解。
- code: T08
  name: 隸美弗定理求複數高次冪
  desc: 將複數化為極式後套用隸美弗定理 (r cis θ)^n = r^n cis(nθ) 計算高次方。
- code: T09
  name: 複數 n 次方根求解與幾何分布
  desc: 運用極式與同界角求複數的所有 n 次方根，或計算正 n 邊形頂點幾何量。
- code: T10
  name: 1 的 n 次方根性質與因式求
  desc: 利用 ω^n=1 與 1+ω+…+ω^(n-1)=0 性質化簡高次複數多項式或連乘積。
