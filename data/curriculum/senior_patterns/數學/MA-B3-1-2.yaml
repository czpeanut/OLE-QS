unit:
  subject: 數學
  code: MA-B3-1-2
  title: 週期性數學模型
status: draft
types:
- code: T01
  name: 弧度角三角函數值與象限
  desc: 估計弧度角所在象限與誘導公式，判斷三角函數值大小與正負。
- code: T02
  name: 正弦函數振幅週期與平移
  desc: 判別正弦函數的振幅、週期、最值與左右平移量。
- code: T03
  name: 由三角圖形反推函數參數
  desc: 觀察波峰波谷與過點坐標，反推正弦函數中的待定係數。
- code: T04
  name: 三角函數繪圖與交點計數
  desc: 在指定區間內繪製三角函數與直線或另一三角函數圖形，數算交點與實根個數。
- code: T05
  name: 週期性生理與自然現象
  desc: 將血壓跳動、摩天輪或潮汐等週期規律對應至正弦函數週期與頻率求解。
- code: T06
  name: 三角函數圖形與週期振幅平移
  desc: 判別正弦餘弦函數的週期、振幅、頻率、值域與平移伸縮變換。
- code: T07
  name: 三角函數交點與實根個數
  desc: 繪製三角函數與直線圖形並計算區間內交點或實根個數。
- code: T08
  name: 三角方程式不等式與區間極值
  desc: 利用單位圓或函數圖形解三角不等式及求限定區間最值。
- code: T09
  name: 三角函數換元二次極值
  desc: 利用平方關係將三角函數化為二次函數並依範圍求最大值或最小值。
- code: T10
  name: 潮汐與天文週期函數建模
  desc: 由週期性觀測數據最高低點反推正弦函數參數與週期。
- code: T11
  name: 離散週期規律與餘數推算
  desc: 利用不同週期長度的最小公倍數與餘數關係，推算週期性組合再次重合的天數或項次。
