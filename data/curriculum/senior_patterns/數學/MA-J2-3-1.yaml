unit:
  subject: 數學
  code: MA-J2-3-1
  title: 拋物線
status: draft
types:
- code: T01
  name: 拋物線標準式與幾何要素
  desc: 由頂點、焦點或準線求拋物線標準式，或反推焦距與正焦弦長。
- code: T02
  name: 拋物線一般式配方與平移
  desc: 將拋物線一般式配方為標準式，求頂點、焦點、準線或對稱軸。
- code: T03
  name: 拋物線定義與距離極值
  desc: 利用拋物線上點到焦點與到準線等距的定義求解線段和極值。
- code: T04
  name: 拋物線實際應用與坐標建模
  desc: 將拋物面天線、拱橋或拋射水柱坐標化，代入拋物線標準式求解高度或跨距。
- code: T05
  name: 拋物線與直線交點及弦長
  desc: 聯立拋物線與直線方程式，求交點、過焦點弦長或切線條件。
- code: T06
  name: 由焦點準線頂點求拋物線式
  desc: 依據焦點、準線或頂點位置判斷開口方向與焦距 c，寫出拋物線標準式。
- code: T07
  name: 過已知點待定係數求拋物線
  desc: 依對稱軸方向設拋物線一般式，代入已知三點坐標聯立求解係數。
- code: T08
  name: 拋物線一般式配方求幾何要素
  desc: 將二次方程配方化為標準式，判別開口方向並求出頂點、焦點、準線與正焦弦長。
- code: T09
  name: 拋物線光學性質與焦弦長計算
  desc: 運用拋物線定義（點到焦點等於點到準線距）求焦半徑或過焦點弦長。
- code: T10
  name: 拋物線與直線交點及切線求解
  desc: 聯立拋物線與直線方程式，利用判別式或斜率公式求弦長與切線方程式。
