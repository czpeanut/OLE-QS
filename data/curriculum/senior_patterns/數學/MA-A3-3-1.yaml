unit:
  subject: 數學
  code: MA-A3-3-1
  title: 平面向量
status: draft
types:
- code: T01
  name: 向量坐標表示與平行伸縮
  desc: 計算向量的長度、單位向量、方向相反伸縮及兩向量平行的係數條件。
- code: T02
  name: 分點公式與三點共線應用
  desc: 運用線段內外分點公式或共線係數和為一求解未知坐標與比例。
- code: T03
  name: 平面向量的線性組合分解
  desc: 將向量表為兩個不平行向量的線性組合，利用獨立性解聯立方程式。
- code: T04
  name: 線性組合終點區域與面積
  desc: 依據線性組合係數區間計算動點所形成平行四邊形或三角形面積。
- code: T05
  name: 向量坐標表示與線性運算
  desc: 進行平面向量加減、係數積及極式分量與坐標互換。
- code: T06
  name: 幾何圖形向量與三角不等式
  desc: 判別正多邊形相等向量個數或向量長度三角不等式成立條件。
- code: T07
  name: 分點公式與三點共線定理
  desc: 運用線段分點公式或三點共線係數和為一求線性組合係數。
- code: T08
  name: 向量線性組合係數與面積比
  desc: 由三角形內點向量線性組合係數直接對應面積比例。
- code: T09
  name: 向量分點公式與共線定理
  desc: 運用分點公式與係數和為 1 判別點在線段上或求線段交點比例。
- code: T10
  name: 向量線性組合的區域與面積
  desc: 由線性組合係數範圍判斷終點所在平面區域或所圍面積大小。
- code: T11
  name: 直線參數式與圖形軌跡判別
  desc: 消去參數並檢驗參數值域範圍，判斷平面參數方程式所代表的直線、射線或線段。
