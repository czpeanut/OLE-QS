unit:
  subject: 數學
  code: MA-J2-1-2
  title: 二項分布與幾何分布
status: draft
types:
- code: T01
  name: 二項分布期望值與標準差
  desc: 由重複試驗次數與成功機率關係式聯立反推試驗參數。
- code: T02
  name: 二項分布假設檢定拒絕域
  desc: 依據顯著水準與雙尾對稱機率累計計算二項檢定的拒絕域。
- code: T03
  name: 幾何分布期望值與標準差
  desc: 辨識首次成功停止模型並套用幾何分布期望值與標準差公式。
- code: T04
  name: 二項分布與幾何分布機率
  desc: 計算重複獨立試驗累積成功次數或第 k 次才成功的事件機率。
- code: T05
  name: 不確定性與抽樣檢定應用
  desc: 結合二項分布機率表進行品管抽驗或決策門檻推論。
- code: T06
  name: 二項分布期望值與標準差計算
  desc: 先求單次試驗成功機率或直接套用期望值與標準差公式，計算二項分布統計量與性質推導。
- code: T07
  name: 二項分布最大機率與分布圖形
  desc: 利用期望值附近機率最大的性質比較機率大小、求眾數項及判讀二項分布長條圖。
