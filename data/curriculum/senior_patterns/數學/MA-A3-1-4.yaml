unit:
  subject: 數學
  code: MA-A3-1-4
  title: 正餘弦的疊合
status: draft
types:
- code: T01
  name: 正餘弦基本疊合與極值
  desc: 提取係數平方和開根號將線性組合化為單一正弦函數，求振幅與極值。
- code: T02
  name: 對稱換元法求三角極值
  desc: 令 t 為正餘弦之和或差，搭配疊合範圍與平方關係化為二次函數求極值。
- code: T03
  name: 正餘弦疊合求極值與解判別
  desc: 將正餘弦線性組合疊合為單一正弦函數求值域或判別有解。
- code: T04
  name: 疊合後圖形對稱與單調性
  desc: 經正餘弦疊合後判斷函數的對稱軸、極值點與遞增減區間。
- code: T05
  name: 限域正餘弦疊合求極值
  desc: 先以和差角展開再疊合，並依給定角度區間求最大最小值。
- code: T06
  name: 倍角降次後疊合反推參數
  desc: 先以倍角公式將二次三角式降為一次後疊合，並由極值反推係數。
- code: T07
  name: 幾何圖形列式與三角疊合極值
  desc: 依幾何圖形長度或面積關係列出正餘弦線性組合，再疊合求極值與對應角度。
- code: T08
  name: 疊合求解三角方程式與實根和
  desc: 將正餘弦線性組合疊合為單一正弦方程式，依角度範圍求解或以對稱性求實根和。
- code: T09
  name: 疊合後三角函數圖形與週期平移
  desc: 將函數疊合為標準正弦形式後，判別振幅、週期、值域、圖形平移與函數配對。
