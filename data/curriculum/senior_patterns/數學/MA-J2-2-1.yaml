unit:
  subject: 數學
  code: MA-J2-2-1
  title: 複數與多項式方程式
status: draft
types:
- code: T01
  name: 複數代入與複係數方程式
  desc: 將已知複數根代入多項式利用實虛部相等反推未知係數。
- code: T02
  name: 實係數方程式與勘根定理
  desc: 運用複數根共軛成對與勘根定理判別多項式正負實根個數。
- code: T03
  name: 牛頓法求多項式近似根
  desc: 套用切線牛頓疊代公式由初始值逐步逼近多項式實根。
- code: T04
  name: 高次多項式複數求值化簡
  desc: 透過降次除法或共軛根二次式化簡高次多項式在複數處的值。
- code: T05
  name: 綜合除法與有理根檢驗
  desc: 運用有理根檢驗法與綜合除法分解高次實係數多項式方程式。
- code: T06
  name: 虛數單位冪次週期與等比級數
  desc: 結合 i^4=1 週期性與等比級數求和公式計算高次虛數冪及級數和。
- code: T07
  name: 二次方程式根與係數對稱求值
  desc: 運用韋達定理求兩根和與積，將分式或高次對稱式化為基本對稱式計算。
- code: T08
  name: 虛根成對定理與因式分解反推
  desc: 利用實係數方程式共軛虛根成對性質建立二次因式，比較係數求解未知數。
- code: T09
  name: 勘根定理與牛頓一次因式檢驗
  desc: 結合一次因式檢驗法與勘根定理求解高次多項式方程式的有理根與無理根。
- code: T10
  name: 複數四則運算與模長絕對值
  desc: 進行複數標準式加減乘除化簡，並運用模長乘除性質求複合複數絕對值。
- code: T11
  name: 負數平方根運算與性質判別
  desc: 將負數平方根化為標準虛數形式後進行乘除運算，避免誤用實數根號乘法性質。
- code: T12
  name: 複數相等與共軛實虛部反推
  desc: 設複數為標準式，利用複數相等實虛部分別相等或與共軛複數聯立求解未知數。
- code: T13
  name: 複數模長乘除性質求絕對值
  desc: 利用乘積與商的模長等於模長的乘除性質，不展開直接計算高次複合複數的模長。
