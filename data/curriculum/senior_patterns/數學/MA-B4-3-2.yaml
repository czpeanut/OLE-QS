unit:
  subject: 數學
  code: MA-B4-3-2
  title: 矩陣的應用
status: draft
types:
- code: T01
  name: 狀態遞迴列式與轉移矩陣建構
  desc: 依動態變化或比例移動條件建立相鄰兩期線性遞迴式與轉移矩陣。
- code: T02
  name: 轉移矩陣運算與多期狀態預測
  desc: 利用轉移矩陣乘以初始狀態向量計算經過數期後的各類比例或數量。
- code: T03
  name: 馬可夫鏈穩定狀態向量求解
  desc: 令 AX＝X 且分量和為一，解聯立方程式求長期穩定狀態分佈。
- code: T04
  name: 平面線性變換與旋轉伸縮矩陣
  desc: 套用旋轉、鏡射或伸縮矩陣計算點或圖形經線性變換後的新坐標。
- code: T05
  name: 複合線性變換與面積伸縮比
  desc: 依序相乘多個變換矩陣求合成變換，或利用行列式絕對值求面積比。
