unit:
  subject: 數學
  code: MA-A4-3-1
  title: 條件機率與貝氏定理
status: draft
types:
- code: T01
  name: 條件機率定義與樣本篩選
  desc: 由樣本空間縮小、交集機率或有限計數計算條件機率。
- code: T02
  name: 獨立事件判別與乘積機率
  desc: 運用獨立事件定義計算複合機率或反推至少成功門檻的試驗次數。
- code: T03
  name: 貝氏定理與檢測準確率反推
  desc: 結合全機率公式與樹狀圖計算事後機率與多次檢測條件機率。
- code: T04
  name: 多輪賽局與獲勝機率分配
  desc: 列舉剩餘局數樹狀圖計算系列賽奪冠機率與獎金期望分配。
- code: T05
  name: 條件機率與對立事件綜合
  desc: 結合條件機率與對立事件公式簡化至少型機率計算。
- code: T06
  name: 古典主觀與客觀機率判別
  desc: 依據試驗的對稱性、統計頻率或個人信念，判別題幹所使用的機率類型。
- code: T07
  name: 集合機率公式與列聯表條件機率
  desc: 運用文氏圖、笛摩根定律或列聯表整理交集與補集機率，套用條件機率定義求解。
- code: T08
  name: 依序抽籤不放回與對稱性機率
  desc: 利用取後不放回的順序對稱性、排列計數或獎品抽完即停條件，計算各順位中獎與條件機率。
