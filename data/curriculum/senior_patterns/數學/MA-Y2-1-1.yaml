unit:
  subject: 數學
  code: MA-Y2-1-1
  title: 離散型隨機變數
status: draft
types:
- code: T01
  name: 離散隨機變數機率分布表
  desc: 依試驗條件列出隨機變數的所有可能取值與對應機率，並利用機率總和為一求參數。
- code: T02
  name: 離散型隨機變數期望值計算
  desc: 結合排列組合求取球、抽獎等離散隨機變數的機率分布與數學期望值。
- code: T03
  name: 離散隨機變數變異數與標準差
  desc: 套用定義或平方期望值減期望值平方公式計算隨機變數的變異數與標準差。
- code: T04
  name: 隨機變數線性變換性質
  desc: 利用 E(aX+b) 與 Var(aX+b)=a^2 Var(X) 性質由已知統計量推算新變數統計量。
- code: T05
  name: 期望值與變異數反推未知參數
  desc: 已知期望值或變異數數值，聯立機率總和條件求解機率分布表中的未知機率。
- code: T06
  name: 條件分支與多階段抽獎期望值
  desc: 依首次試驗結果決定是否進入第二階段或折半規則，以樹狀圖或條件機率計算期望值。
- code: T07
  name: 公平賭局與賽局中止獎金分配
  desc: 利用期望值為零列式反推未知金額或保費，或依剩餘賽局勝率公平分配總獎金。
- code: T08
  name: 期望值線性性質與總和計算
  desc: 利用多項試驗期望值的線性可加性，不需展開聯合機率分布即可直接加總期望值。
