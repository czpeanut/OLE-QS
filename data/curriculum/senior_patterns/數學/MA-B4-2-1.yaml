unit:
  subject: 數學
  code: MA-B4-2-1
  title: 條件機率
status: draft
types:
- code: T01
  name: 條件機率定義與樣本空間縮減
  desc: 由條件機率公式 P(B|A)=P(A∩B)/P(A) 或縮小樣本空間計算條件機率。
- code: T02
  name: 獨立事件判別與乘積機率計算
  desc: 利用 P(A∩B)=P(A)P(B) 判別事件獨立性，並計算獨立事件交集、聯集或條件機率。
- code: T03
  name: 機率性質與排容不等式推論
  desc: 運用互斥事件、對立事件與排容原理計算交集機率範圍或聯集機率。
- code: T04
  name: 列聯表分析與獨立性檢驗
  desc: 由雙向列聯表計算條件機率，或依獨立事件定義反推未知次數。
- code: T05
  name: 條件機率乘法公式與多階段試驗
  desc: 運用機率乘法公式或樹狀圖計算不放回抽樣、重複試驗等複合事件機率。
- code: T06
  name: 條件機率性質與集合運算判別
  desc: 運用集合包含關係、餘事件與條件機率恆等式判別多選敘述的正確性。
- code: T07
  name: 多階段試驗樹狀圖與機率分配
  desc: 繪製樹狀圖或狀態轉移列舉多輪試驗、取後不放回抽樣或賽局獎金分配機率。
- code: T08
  name: 獨立事件與列聯表或不等式綜合
  desc: 結合獨立事件定義反推列聯表未知人數，或搭配算幾不等式求聯集機率極值。
- code: T09
  name: 條件機率定義與集合運算
  desc: 運用條件機率公式、排容原理與文氏圖計算事件交集或補集的條件機率。
- code: T10
  name: 列聯表數據判讀與條件機率
  desc: 由雙向列聯表統計資料計算邊際機率、條件機率並檢驗兩事件是否獨立。
- code: T11
  name: 獨立事件性質與乘法公式
  desc: 利用獨立事件交集機率等於乘積的性質，求解聯集、補集或至少發生一次的機率。
- code: T12
  name: 獨立重複試驗與比賽勝率
  desc: 計算多局勝敗或重複投籃等獨立試驗中達到特定勝場數或門檻機率的次數。
- code: T13
  name: 不放回抽樣與抽籤順序機率
  desc: 分析不放回抽籤或受限條件下的樣本空間，計算特定順序抽中的條件機率。
- code: T14
  name: 樹狀圖與條件機率逆向推算
  desc: 繪製多階段試驗樹狀圖，在已知結果條件下求特定路徑發生的機率。
- code: T15
  name: 主觀機率與客觀機率判別
  desc: 依據是否有客觀數據或科學計算佐證，判別敘述屬於主觀機率或客觀機率。
