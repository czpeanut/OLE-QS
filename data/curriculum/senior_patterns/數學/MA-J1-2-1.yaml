unit:
  subject: 數學
  code: MA-J1-2-1
  title: 微分
status: draft
types:
- code: T01
  name: 連續與可微關係及極限定義
  desc: 依左右導數相等判別可微性，或轉換導數極限定義式求導數值。
- code: T02
  name: 微分四則與連鎖律計算
  desc: 運用乘積律、商律與連鎖律求有理式或複合多項式函數導數。
- code: T03
  name: 導函數積分反推原函數
  desc: 由已知導函數與切點或切線條件反推原多項式函數係數。
- code: T04
  name: 導數無窮級數綜合求值
  desc: 先求多項式函數導函數再代入數值並以無窮級數求極限。
- code: T05
  name: 切線斜率與切線方程式
  desc: 利用導數求曲線在特定點或給定斜率的切線方程式及平行線距。
- code: T06
  name: 切線線性近似與牛頓求根法
  desc: 利用切線方程式建立一次線性近似，或套用牛頓法反覆疊代求方程式近似根。
- code: T07
  name: 導數在瞬時變化率之應用
  desc: 求位置或數量函數的一階導數，以計算特定時刻的瞬時速度或變化率。
- code: T08
  name: 導數與瞬時變化率應用
  desc: 求位移或物理量函數的導函數，計算特定時刻的瞬時速度或變化率。
- code: T09
  name: 導數極限定義式轉換求值
  desc: 將差商極限式透過變數代換與加減項配湊轉換為已知導數的線性倍數求值。
- code: T10
  name: 根點因式約分極限求導數
  desc: 在多項式或有理函數的零點處直接代入導數極限定義並約去公因式求導數值。
