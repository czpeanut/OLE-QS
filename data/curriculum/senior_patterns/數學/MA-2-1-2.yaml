unit:
  subject: 數學
  code: MA-2-1-2
  title: 級數
status: draft
types:
- code: T01
  name: 等比分段和與等差奇偶和
  desc: 利用等比級數分段和成等比或等差奇偶項和比例求公比與首項比。
- code: T02
  name: Sigma高次方與分項對消
  desc: 化簡通項為 k^2、k^3 公式或裂項相消計算級數總和。
- code: T03
  name: 複利儲蓄與等比費率求和
  desc: 建立定期定額複利本利和或倍數費率累加的等比級數模型。
- code: T04
  name: 級數和S_n反求一般項
  desc: 利用 a_n=S_n-S_{n-1} 判別首項條件與數列性質。
- code: T05
  name: 分期付款與貸款攤還
  desc: 利用等比級數貼現與本利和平衡計算每期攤還金額。
- code: T06
  name: 等差級數和與中項比例
  desc: 利用等差中項與前 n 項和公式，由兩等差級數和的比反求特定項比值。
- code: T07
  name: 等比級數求和與不等式
  desc: 套用等比級數求和公式並結合指數不等式，求解項數極值或位數。
- code: T08
  name: 等差數列性質與前n項求和
  desc: 運用等差數列首末項對稱性質或求和公式計算總和。
- code: T09
  name: Sigma運算性質真偽判別
  desc: 檢驗級數求和符號線性性質與乘積展開等代數關係的正確性。
- code: T10
  name: 差比級數錯位相減求和
  desc: 先由遞迴式求等差與等比通項，再以錯位相減法計算差比數列前 n 項和。
- code: T11
  name: 分段與高斯函數級數求和
  desc: 依高斯符號或取整條件將級數分段計數，再合併計算有限項總和。
- code: T12
  name: 裂項相消與有理化對消求和
  desc: 將分式或根式通項拆成前後項差，逐項對消計算級數總和或反推項數。
- code: T13
  name: 雙層等比與差比混合拆解求和
  desc: 將混合級數拆為等差與等比部分，或先化簡內層等比和再對外層逐項求和。
- code: T14
  name: 通項多項式展開與線性求和
  desc: 先寫出第 k 項的多項式通項並展開，再拆為 k、k^2、k^3 公式線性組合求和。
