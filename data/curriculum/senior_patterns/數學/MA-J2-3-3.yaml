unit:
  subject: 數學
  code: MA-J2-3-3
  title: 雙曲線
status: draft
types:
- code: T01
  name: 由幾何條件求雙曲線標準式
  desc: 由焦點、頂點、貫軸或共軛軸長條件，判斷中心與開口方向並寫出標準式。
- code: T02
  name: 由漸近線與過點求雙曲線
  desc: 利用漸近線乘積型態設雙曲線族方程式，代入已知點求雙曲線。
- code: T03
  name: 雙曲線一般式與漸近線求解
  desc: 將雙曲線一般式配方為標準式，求中心、焦點或兩條漸近線方程式。
- code: T04
  name: 雙曲線定義與焦點距離差
  desc: 運用雙曲線上點到兩焦點距離差的絕對值為 2a 求解線段長或軌跡。
- code: T05
  name: 等軸雙曲線與共軛雙曲線
  desc: 處理漸近線互相垂直的等軸雙曲線或共軛雙曲線之幾何性質與聯立求值。
- code: T06
  name: 雙曲線與其他曲線交點判別
  desc: 比較頂點與漸近線斜率關係，判別雙曲線與橢圓或直線的交點個數。
- code: T07
  name: 雙曲線的伸縮與坐標變換
  desc: 將雙曲線沿坐標軸進行伸縮或平移旋轉變換，求變換後的新方程式。
- code: T08
  name: 同心圓與波前時間差定位
  desc: 計算兩組同心圓半徑差或地震波到達時間差是否為定值，以定位雙曲線上之點。
- code: T09
  name: 焦點三角形面積與等腰討論
  desc: 結合雙曲線定義與畢氏定理或等腰條件，求解焦點三角形面積或滿足條件的點數。
- code: T10
  name: 共焦點橢圓雙曲線交點聯立
  desc: 利用共焦點橢圓距離和與雙曲線距離差聯立，求解交點焦半徑乘積或曲線參數。
- code: T11
  name: 距離差方程式圖形存在性判別
  desc: 比較距離差常數與兩焦點距離大小，判別雙曲線、單支、兩射線或無圖形。
