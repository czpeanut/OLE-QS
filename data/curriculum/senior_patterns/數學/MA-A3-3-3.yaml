unit:
  subject: 數學
  code: MA-A3-3-3
  title: 二元一次聯立方程式
status: draft
types:
- code: T01
  name: 含參聯立方程組解的討論
  desc: 分析主行列式為零時各分量行列式是否為零，區分無解與無限多組解。
- code: T02
  name: 兩直線平行重合與解的判別
  desc: 利用係數比或行列式判別二元一次聯立方程組解的個數與直線關係。
- code: T03
  name: 二元一次聯立方程組求解
  desc: 將平方和非負條件轉為聯立方程式並以克拉瑪公式或消去法求解。
- code: T04
  name: 聯立方程組解的結構與參數
  desc: 利用兩直線平行重合相交條件，由無解或無限多解反推未知參數。
- code: T05
  name: 克拉瑪公式與線性代換求解
  desc: 運用克拉瑪公式或係數比例變換由已知方程組的解推求新方程組的解。
- code: T06
  name: 齊次方程組非零解與正負條件
  desc: 令齊次聯立方程組主行列式為零求非平凡解，並檢驗變數正負符號限制。
- code: T07
  name: 三線無解與幾何共線參數討論
  desc: 透過直線平行、重合或三條直線無共同交點的幾何關係反推未知參數。
- code: T08
  name: 已知原解線性代換與面積比例
  desc: 將已知方程組的解代入係數變換後的新方程組，或結合行列式面積比求解。
