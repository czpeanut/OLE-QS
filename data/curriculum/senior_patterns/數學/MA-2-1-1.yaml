unit:
  subject: 數學
  code: MA-2-1-1
  title: 數列與遞迴關係
status: draft
types:
- code: T01
  name: 等差等比一般項與中項性質
  desc: 運用等差公差、等比公比及中項公式列聯立方程或判斷數列類型。
- code: T02
  name: 遞迴關係推算與累加求通項
  desc: 由遞迴式逐項推算找週期規律，或用累加法求第 n 項。
- code: T03
  name: 數學歸納法猜測與倍數證明
  desc: 從前幾項推測一般項公式，並以數學歸納法完成通項或整除證明。
- code: T04
  name: 圖形與數字陣列規律計數
  desc: 觀察幾何圖形邊數、分形面積或數字陣列規律推算第 n 步數量。
- code: T05
  name: 數列與幾何計數綜合
  desc: 結合三角形邊長條件或線性變換分析數列項數與平均值。
- code: T06
  name: 數列定義判別與單調正負分析
  desc: 檢驗數列是否符合等差或等比定義，並由首項與公差公比判別各項正負與單調性。
- code: T07
  name: 數列整數條件、共同項與枚舉
  desc: 結合整除性、公差最小公倍數或等比平方關係枚舉滿足整數與範圍條件的數列項。
