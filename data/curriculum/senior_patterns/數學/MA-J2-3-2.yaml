unit:
  subject: 數學
  code: MA-J2-3-2
  title: 橢圓
status: draft
types:
- code: T01
  name: 由幾何條件求橢圓標準式
  desc: 由頂點、焦點、長短軸長或離心率條件，判斷中心與軸向並寫出橢圓標準式。
- code: T02
  name: 橢圓一般式配方與焦點頂點
  desc: 將二次式配方為橢圓標準式，求中心、兩焦點、長短軸長與正焦弦長。
- code: T03
  name: 橢圓定義與焦點三角形
  desc: 運用橢圓上點到兩焦點距離和為定值 2a，結合餘弦定理求面積或周長。
- code: T04
  name: 橢圓的伸縮變換與參數式
  desc: 將圓或橢圓沿坐標軸伸縮變換求新方程式，或以橢圓參數式求極值。
- code: T05
  name: 橢圓的旋轉與坐標變換
  desc: 利用旋轉矩陣或坐標軸旋轉公式，求斜橢圓旋轉後的新方程式。
- code: T06
  name: 橢圓與直線位置關係及弦長
  desc: 聯立橢圓與直線判別相交、相切條件，或求弦長與切線方程式。
- code: T07
  name: 橢圓實際應用與坐標建模
  desc: 將半橢圓拱橋或光學反射結構坐標化，代入橢圓標準式求解長度或焦距。
- code: T08
  name: 橢圓標準式判別焦點與基本量
  desc: 由給定橢圓方程式或兩焦點距離和形式辨識中心、焦點坐標與長短軸及正焦弦長。
