unit:
  subject: 數學
  code: MA-Y2-2-1
  title: 複數與複數平面
status: draft
types:
- code: T01
  name: 複數四則運算與實虛部相等
  desc: 進行複數加減乘除有理化，或比較實虛部相等求解未知數。
- code: T02
  name: 共軛複數性質與分式化簡
  desc: 運用共軛複數加減乘除分配律簡化複合複數分式。
- code: T03
  name: 複數模長與共軛乘積求參
  desc: 利用複數與共軛乘積等於模長平方求解未知虛部或模長。
- code: T04
  name: 複數平面幾何與平行四邊形
  desc: 將複數對應為平面向量或頂點，求平行四邊形第四頂點複數。
- code: T05
  name: 複數圓軌跡與距離極值
  desc: 將複數模長等式轉化為圓心與半徑，計算到定點的最大或最小距離。
- code: T06
  name: 虛數單位冪次週期化簡
  desc: 利用 i^4=1 的四次方週期性化簡高次冪或連續項級數和。
- code: T07
  name: 複數相等條件與實虛部求解
  desc: 將複數整理為 a+bi 形式後，依實部與虛部分別相等聯立求解實數參數。
- code: T08
  name: 複數四則運算與共軛化簡
  desc: 運用共軛複數有理化分母進行複數加減乘除運算並化為標準式。
- code: T09
  name: 複數絕對值性質與模長計算
  desc: 利用 |z1*z2|=|z1||z2| 與 |z^n|=|z|^n 性質快速計算複合分式的複數模長。
- code: T10
  name: 複數平面幾何意義與距離
  desc: 將複數對應至複數平面上的點，求兩點距離、線段軌跡或角度關係。
