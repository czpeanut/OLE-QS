unit:
  subject: 數學
  code: MA-2-2-4
  title: 古典機率
status: draft
types:
- code: T01
  name: 排列組合搭配古典機率計算
  desc: 先以排列組合計算事件與樣本空間數，再求抽球、撲克或幾何機率。
- code: T02
  name: 擲骰與猜密碼多階段機率
  desc: 分析多次擲骰極值、抽樣不放回猜密碼或單淘汰對決機率。
- code: T03
  name: 對立事件與互斥機率恆等式
  desc: 利用 1 減對立事件或互斥事件加法公式簡化至少型機率計算。
- code: T04
  name: 機率與代數方程式綜合
  desc: 將隨機樣本點代入二次方程式判別式檢驗有理根條件。
- code: T05
  name: 條件與對稱性簡化機率
  desc: 利用對稱性（如白球先取完機率）快速求解抽樣機率。
- code: T06
  name: 分組分房與排列棋盤占位機率
  desc: 以均分分組、相鄰不相鄰直線排列或棋盤不同行不同列選格計數求解古典機率。
- code: T07
  name: 獨立重複試驗與點數條件枚舉
  desc: 以重複取樣或多次擲骰建立總樣本空間，並枚舉滿足點數和差與勝負規則的事件數。
