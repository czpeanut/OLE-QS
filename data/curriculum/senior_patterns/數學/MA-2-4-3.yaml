unit:
  subject: 數學
  code: MA-2-4-3
  title: 三角比的性質
status: draft
types:
- code: T01
  name: 正弦定理與圓內接四邊形求解
  desc: 利用正弦定理或圓內接對角互補性質搭配餘弦定理求弦長與圓面積。
- code: T02
  name: 餘弦定理求邊長角度與摺痕
  desc: 已知兩邊夾角或三邊長，利用餘弦定理求邊長、角度、三等分夾角或摺痕。
- code: T03
  name: 海龍公式面積與角平分線長
  desc: 由三邊長套用海龍公式求面積，或以面積分割求角平分線長。
- code: T04
  name: 平面與立體三角測量應用
  desc: 將建築物仰角、方位角或立體高臺外心轉化為三角形並以三角比求解。
- code: T05
  name: 內切圓半徑與中線定理
  desc: 結合三角形面積與周長求內切圓半徑或中線長。
- code: T06
  name: SSA三角形解個數判別
  desc: 已知兩邊與一鄰角（SSA），依正弦定理或高線比較判別三角形解的個數與性質。
