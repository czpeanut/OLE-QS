unit:
  subject: 數學
  code: MA-B3-2-1
  title: 指數函數
status: draft
types:
- code: T01
  name: 指數函數圖形與對稱性
  desc: 判斷底數大小對指數函數遞增減、凹向性及對稱於 y 軸的影響。
- code: T02
  name: 指數函數圖形交點與斜率
  desc: 求水平線與指數函數圖形的交點坐標並計算斜率或距離。
- code: T03
  name: 指數成長倍數比較與估算
  desc: 建立不同倍增週期的指數模型並搭配常用對數近似值求解門檻時間。
- code: T04
  name: 複利計息方案比較本利和
  desc: 比較年複利與半年複利等不同計息週期的最終本利和差異。
- code: T05
  name: 指數函數圖形平移與係數
  desc: 由指數函數圖形遞增減、漸近線與截距判別底數及平移參數。
- code: T06
  name: 指數圖形平移與交點求解
  desc: 寫出平移後的指數函數並聯立換元求解兩圖形交點坐標。
- code: T07
  name: 指數函數圖形特徵與平移
  desc: 由指數函數圖形凹向、單調性、過定點與平移反推參數或象限。
- code: T08
  name: 指數律化簡與大小比較
  desc: 利用底數大於 1 或介於 0 與 1 的單調性比較指數冪次大小。
- code: T09
  name: 指數方程式求解與換元法
  desc: 透過換元將指數方程式化為一元二次方程式求解。
- code: T10
  name: 指數函數限定區間極值
  desc: 將指數函數配方法化為二次函數並依定義域求最值。
- code: T11
  name: 指數成長與半衰期衰減建模
  desc: 建立細菌繁殖、溫度冷卻或放射性半衰期指數模型求解。
- code: T12
  name: 指數函數圖形交點與實根數
  desc: 繪製指數函數與多項式或絕對值函數圖形，由交點個數判斷方程式實根數。
