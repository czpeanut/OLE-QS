unit:
  subject: 數學
  code: MA-2-2-1
  title: 計數原理
status: draft
types:
- code: T01
  name: 集合運算與二次不等式交聯集
  desc: 解不等式決定整數或實數集合並求交集、聯集、差集與未知係數。
- code: T02
  name: 排容原理與正因數倍數計數
  desc: 利用兩集合排容原理或質因數分解計數倍數、正因數與整除數對。
- code: T03
  name: 乘法加法原理分類窮舉計數
  desc: 依限制條件分類討論並運用樹狀圖或乘法原理計算方法數。
- code: T04
  name: 邏輯命題真假值與條件推論
  desc: 判斷若p則q命題的違規反例與複合條件邏輯推論。
- code: T05
  name: 區域塗色與圖形相鄰計數
  desc: 依相鄰不同色限制分區討論塗色方法數。
- code: T06
  name: 重複選取與乘方計數模型
  desc: 運用各步驟獨立選擇的乘法原理與扣除違規項方法，計算可重複選取的方法數。
- code: T07
  name: 數字組數與倍數限制計數
  desc: 處理首位不為零、數字不重複及偶數、三或四倍數等位數限制的分類計數問題。
- code: T08
  name: 整數分拆與不定方程解計數
  desc: 列舉或利用不等式邊界求解不定方程整數解、自然數分拆、因數分解組數與分數去重。
- code: T09
  name: 狀態轉移與賽局路徑樹狀圖
  desc: 繪製樹狀圖或依步數狀態轉移，計算傳球、跳躍、賽局勝負及往返路線方法數。
