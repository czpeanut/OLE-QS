unit:
  subject: 地科
  code: ES-1-4-2
  title: 海水的運動
status: draft
types:
- code: T01
  name: 全球表面洋流與東西邊界流
  desc: 追蹤北太平洋等大洋表層環流路徑，比較東西邊界流（如黑潮與涼流）的流速、成因與氣候效應。
- code: T02
  name: 臺灣周圍洋流與季節變化
  desc: 辨識黑潮、中國沿岸冷流與南海海流在臺灣四周海域的冬夏流向、流速特徵及對等溫線的影響。
- code: T03
  name: 海面等溫線判讀季節與洋流
  desc: 依據海域表層海水等溫線的彎曲方向與數值高低，推論季節、洋流流向、寒暖流性質或地理位置。
- code: T04
  name: 湧升流成因與沿岸風向判別
  desc: 結合行星風系、科氏力與艾克曼傳輸偏轉方向，判別造成沿岸或赤道湧升流的風向、海溫與營養鹽變化。
- code: T05
  name: 波浪成因與近岸淺化碎浪
  desc: 區分風浪、湧浪（瘋狗浪）與海嘯的成因與特性，並分析波浪進入淺水區時波速、波長與波高的變化。
- code: T06
  name: 沿岸流與海岸漂沙淤積判讀
  desc: 依據盛行風向與波浪斜向拍岸產生的沿岸流方向，判斷海岸漂沙移動、堤防兩側淤沙與侵蝕位置。
- code: T07
  name: 潮汐成因與日月地大小潮
  desc: 說明月球引力差造成潮汐的原理，並依據日地月相對位置、農曆日期或朔望弦月判別大潮與小潮時機。
- code: T08
  name: 潮位圖判讀與潮間帶寬度
  desc: 從潮位預報圖或紀錄圖判讀滿潮、乾潮、日潮不等與潮差大小，並比較不同海岸坡度的潮間帶寬度。
- code: T09
  name: 潮汐延遲原理與週期計算
  desc: 說明月球公轉導致每日漲潮延遲約50分鐘的原理，並由潮汐表或紀錄計算潮汐週期與每日延遲時間。
- code: T10
  name: 乾滿潮時刻與觀察時段推算
  desc: 依據半日潮平均週期約12小時25分或每日延遲時間，推算當日或數日後滿乾潮時刻及觀察潮間帶時機。
- code: T11
  name: 月球運動假設與潮汐變化
  desc: 在月球公轉方向或週期改變的假設情境下，推論每日滿潮提前或延遲及每月大潮次數的變化。
- code: T12
  name: 潮汐表與河口鹽度推算潮流
  desc: 依據海岸各地滿潮時刻順序、河口鹽度變化紀錄或臺灣海峽潮流規律，判斷漲退潮時刻與潮流流向。
