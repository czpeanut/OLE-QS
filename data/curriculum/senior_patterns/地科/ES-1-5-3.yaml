unit:
  subject: 地科
  code: ES-1-5-3
  title: 宇宙
status: draft
types:
- code: T01
  name: 天文距離單位與光行時間
  desc: 比較天文單位、光年與秒差距的尺度大小，並推論光行時間延遲對觀測遙遠星系誕生與演化的意義。
- code: T02
  name: 宇宙天體結構與尺度排序
  desc: 依體積或空間範圍大小，排列衛星、行星、太陽系、星團、星雲、星系、星系群、星系團與超星系團。
- code: T03
  name: 太陽活動與太陽系天體比較
  desc: 判別太陽分層與核融合、八大行星與矮行星分類、小行星帶與柯伊伯帶差異，以及彗星尾與流星雨成因。
- code: T04
  name: 視星等、絕對星等與距離推算
  desc: 依據星等與亮度比對數關係、距離平方反比律及10秒差距定義，換算恆星亮度比、光度倍數與距離遠近。
- code: T05
  name: 黑體輻射與恆星溫度半徑
  desc: 判讀黑體輻射曲線與恆星顏色比較表面溫度高低，並結合光度與溫度四次方關係計算恆星半徑比例。
- code: T06
  name: 大氣窗口與太空望遠鏡波段
  desc: 依大氣透明度圖辨識可穿透大氣的電磁波窗口，並根據觀測目標溫度選擇適合的太空望遠鏡觀測波段。
- code: T07
  name: 銀河系結構與內外天體歸屬
  desc: 辨識銀河系棒旋外觀與銀核、銀盤、銀暈構造，區分銀河系內星雲星團與銀河系外星系及盤面遮蔽盲區。
- code: T08
  name: 光譜紅藍移與都卜勒效應
  desc: 依據星系光譜譜線向紅端或藍端偏移判斷天體遠離或接近，並區分都卜勒效應在天文與氣象上的應用。
- code: T09
  name: 哈伯定律概念與宇宙膨脹
  desc: 闡明哈伯定律 V＝H₀D 的線性正比關係與宇宙無中心概念，推論星系紅移作為宇宙膨脹的關鍵證據。
- code: T10
  name: 哈伯圖判讀與常數速度計算
  desc: 從星系退行速度與距離關係圖計算哈伯常數 H₀，並換算指定距離或百萬秒差距處的星系遠離速度。
- code: T11
  name: 宇宙論演變與大霹靂學說
  desc: 排序地心說、日心說至大霹靂學說的宇宙觀演變，並說明大霹靂後宇宙膨脹降溫與早期原子核形成過程。
- code: T12
  name: 宇宙微波背景輻射特徵判讀
  desc: 判讀 3K 宇宙微波背景輻射的黑體輻射曲線、均勻度與存在時間，比較其與恆星星光的差異及證據意義。
- code: T13
  name: 恆星世代演化與現代天文物理
  desc: 比較第一代與第二代恆星的元素組成與演化差異，並判讀黑洞合併重力波與暗物質等現代天文文本。
