unit:
  subject: 地科
  code: ES-1-4-3
  title: 大氣與海洋的交互作用
status: draft
types:
- code: T01
  name: 海氣交互作用現象與範疇判別
  desc: 區分大氣與海洋能量動量交換所驅動的現象，排除如潮汐等主要由天體引力引起的海水運動。
- code: T02
  name: 正常年赤道太平洋沃克環流結構
  desc: 判讀正常年赤道太平洋東西兩側的氣壓高低、信風風向、海平面高度斜坡與大氣垂直環流方向。
- code: T03
  name: 聖嬰年氣壓異常值數據判讀
  desc: 依據赤道東太平洋與西太平洋海平面氣壓異常值表格，判斷發生聖嬰現象或反聖嬰現象的年份。
- code: T04
  name: 聖嬰與反聖嬰海溫降雨異常影響
  desc: 根據赤道太平洋海氣異常示意圖，推論暖海水東移、湧升流減弱與太平洋東西岸旱澇災情的變化。
- code: T05
  name: 聖嬰現象對湧升流與海面影響
  desc: 分析聖嬰年信風減弱對南美洲西岸湧升流強弱、斜溫層深度及東西太平洋海平面高度的影響。
- code: T06
  name: 高低緯度能量平衡與海氣交互機制
  desc: 說明海流與水循環如何傳輸熱能以平衡全球各緯度間的太陽輻射能量差異。
- code: T07
  name: 正常年太平洋沃克環流與海氣特徵
  desc: 比較正常年赤道東、西太平洋的海溫、海面高度、斜溫層深度、湧升流、氣壓與降雨差異。
- code: T08
  name: 聖嬰現象海氣變化與圖表判讀
  desc: 分析聖嬰年東風減弱後赤道太平洋海溫、氣壓、湧升流、海流與降雨的異常變化及海溫距平圖。
- code: T09
  name: 反聖嬰現象海氣變化與南方震盪
  desc: 分析反聖嬰年信風增強對東西太平洋水溫差、海面高度、混合層厚度、大氣對流與氣壓的影響。
- code: T10
  name: 聖嬰／反聖嬰週期與全球氣候影響
  desc: 辨識聖嬰現象發生週期無固定規律、對全球氣候的遙相關影響及與反聖嬰的關聯。
- code: T11
  name: 聖嬰與反聖嬰氣壓異常表判讀
  desc: 依據赤道東西太平洋海平面氣壓異常值或氣壓變化趨勢，判別聖嬰或反聖嬰現象發生時機。
- code: T12
  name: 太平洋大氣環流與斜溫層圖
  desc: 由赤道太平洋沃克環流、海面坡度與斜溫層傾斜示意圖，辨識正常年、聖嬰年或反聖嬰年狀態。
- code: T13
  name: 聖嬰與反聖嬰海洋生態變化
  desc: 比較聖嬰與反聖嬰期間赤道東風強弱、秘魯湧升流、表層海溫、混合層厚度與漁獲量增減。
- code: T14
  name: 海溫距平圖判讀ENSO影響
  desc: 依據長期赤道太平洋海溫距平時序圖判斷特定年份的 ENSO 狀態，並區分 ENSO 與全球暖化影響。
- code: T15
  name: 南方震盪指數與氣候異常關聯
  desc: 連結達爾文港與大溪地氣壓差變化，推論東南亞、澳洲與南美西岸的異常降雨或乾旱。
