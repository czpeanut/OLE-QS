unit:
  subject: 地科
  code: ES-1-7-1
  title: 永續發展
status: draft
types:
- code: T01
  name: 人口成長曲線與未來趨勢判讀
  desc: 依據歷史與預測人口變化曲線圖，分析人口成長速率變遷與未來人口預測情境假設。
- code: T02
  name: 全球糧食生產與供需影響因子
  desc: 分析土地開墾、耕作技術、氣候變遷及生質能作物面積變化對未來世界糧食產量的影響。
- code: T03
  name: 永續發展核心概念與面向判別
  desc: 闡明永續發展兼顧世代需求、環境、經濟與社會文化均衡的核心原則與目標。
- code: T04
  name: 環境承載力與水資源永續管理
  desc: 依據環境承載力概念評估水庫興建、節水、雨水回收、海水淡化與抽取地下水等措施的永續性。
- code: T05
  name: 海洋汙染與塑膠微粒生態衝擊
  desc: 分析海洋塑膠微粒、海洋垃圾聚集與過度營養鹽對海洋水體及生態系統的危害。
- code: T06
  name: 循環經濟定義與商業模式判別
  desc: 區分線性經濟與循環經濟，並依據案例辨識循環供應、資源回收、生命延續、共享與產品即服務。
- code: T07
  name: 資源環境問題跨議題綜合判讀
  desc: 綜合辨別文本中關於非再生資源、溫室效應、臭氧層、海洋酸化與塑膠汙染的科學敘述正誤。
