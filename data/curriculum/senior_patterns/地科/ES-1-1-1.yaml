unit:
  subject: 地科
  code: ES-1-1-1
  title: 地球的起源
status: draft
types:
- code: T01
  name: 太陽系形成階段排序
  desc: 依據星雲重力塌縮、吸積盤形成、微行星聚合與原始大氣釋出等過程，排列太陽系演化先後順序。
- code: T02
  name: 星雲學說與行星形成機制
  desc: 依據星雲說與角動量守恆，判別太陽星雲收縮、扁平圓盤吸積與行星系統形成之物理機制。
- code: T03
  name: 太陽核心核融合與能量
  desc: 判別太陽核心進行氫核融合成氦的反應機制與光熱能量來源。
- code: T04
  name: 類地與類木行星性質比較
  desc: 依距日遠近與形成環境差異，比較類地與類木行星在密度、體積、質量及組成物質上的特徵。
- code: T05
  name: 矮行星定義與軌道特徵
  desc: 依據國際天文聯合會天體分類定義，判別矮行星的軌道清理與物理特徵。
- code: T06
  name: 彗星結構與太陽風方向
  desc: 依據彗星組成成分與太陽風、輻射壓作用，判別彗核結構及彗尾背向太陽的方向關係。
- code: T07
  name: 彗星與小天體起源區判別
  desc: 依據彗星軌道週期與分布位置，區分小行星帶、古柏帶與歐特雲等太陽系構造區。
- code: T08
  name: 早期太陽系小天體研究價值
  desc: 由小行星、彗星與隕石保留原始物質的特性，推論研究太陽系早期演化的適宜對象與定年依據。
- code: T09
  name: 早期地球熔融熱源判別
  desc: 區分微行星撞擊、重力收縮位能釋放與放射性元素衰變等造成早期地球高溫熔融的熱源。
- code: T10
  name: 早期地球熔融分層機制
  desc: 分析原始地球熔融狀態下，依物質密度差異使鐵鎳下沉、矽酸鹽上浮分化為核函殼的過程。
- code: T11
  name: 地球內部分層與物質組成
  desc: 判別地球分化後地殼、地函與地核的密度差異及主要組成元素與礦物成分。
- code: T12
  name: 地球適居條件與圈層演化
  desc: 從日地距離、質量、大氣與水圈演化關聯，分析地球維持液態水與孕育生命的適居條件。
