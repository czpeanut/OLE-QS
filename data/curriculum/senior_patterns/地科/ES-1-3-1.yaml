unit:
  subject: 地科
  code: ES-1-3-1
  title: 大氣的溫壓垂直結構
status: draft
types:
- code: T01
  name: 大氣固定與變動氣體組成判別
  desc: 區分低層大氣中的固定氣體與變動氣體比例，並判斷水氣、二氧化碳等變動成分與天氣的關聯。
- code: T02
  name: 大氣垂直分層依據與溫度剖面
  desc: 依據氣溫隨高度變化的分層標準，判讀溫度垂直剖面圖中的對流層、平流層、中氣層與增溫層界線。
- code: T03
  name: 對流層特徵與熱源及遞減率
  desc: 說明對流層受地表長波輻射加熱與水氣對流集中特性，並利用氣溫遞減率計算指定高度氣溫。
- code: T04
  name: 對流層頂高度隨緯度季節變化
  desc: 比較不同緯度與冬夏季對流強度差異對對流層頂高度與對流層厚度的影響。
- code: T05
  name: 平流層特徵與臭氧吸熱機制
  desc: 判別平流層氣流穩定水平運動的特徵，以及臭氧層集中位置與吸收太陽紫外線增溫的機制。
- code: T06
  name: 中氣層與增溫層物理性質比較
  desc: 區分增溫層空氣稀薄高溫但體感與衛星不燒毀之因，以及中氣層層頂出現大氣最低溫的特性。
- code: T07
  name: 大氣各層綜合特徵比較判別
  desc: 綜合比較對流層、平流層、中氣層與增溫層的溫壓變化趨勢、水氣分布與主要大氣現象。
- code: T08
  name: 氣壓隨高度變化曲線與單位換算
  desc: 判讀氣壓隨高度遞減曲線與空氣密度關係、比較氣壓單位大小，或由數據推算高度與氣壓值。
- code: T09
  name: 氣壓與空氣柱質量比例計算
  desc: 利用氣壓代表上方空氣柱重量的原理，由高度氣壓值推算大氣質量百分比或反推海拔高度。
- code: T10
  name: 高海拔低壓缺氧與艙壓調控
  desc: 運用氣壓遞減與氧氣分壓原理，分析高山症成因、高海拔沸點變化與飛機機艙氣壓調控機制。
- code: T11
  name: 溫室效應與大氣輻射能量收支
  desc: 說明二氧化碳等溫室氣體選擇性吸收地表紅外線長波輻射並產生逆輻射的地球能量平衡機制。
- code: T12
  name: 地表反照率與懸浮微粒影響
  desc: 分析冰雪、森林與雲量改變對太陽短波輻射反照率的影響，以及火山灰懸浮微粒對能見度的效應。
- code: T13
  name: 大氣現象時空尺度與探空觀測
  desc: 依據時空尺度象限與觀測解析度判別大氣系統尺度，或區分探空氣球可觀測的垂直氣象要素。
