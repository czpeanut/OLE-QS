unit:
  subject: 地科
  code: ES-1-5-1
  title: 從太空看地球
status: draft
types:
- code: T01
  name: 行星物理數據表比對與分類
  desc: 依據自轉週期、公轉週期、密度、衛星數與溫差等數據表，比對辨識類地與類木行星及其環境特徵。
- code: T02
  name: 類地行星大氣與表面環境
  desc: 比較水星、金星、地球與火星的大氣成分、氣壓、溫室效應、隕石坑分布與液態水的存在狀態。
- code: T03
  name: 月球無大氣與地球環境比較
  desc: 比較月球與地球有無大氣及磁場的差異，推論日夜溫差、隕石坑密度、極光與流星等觀測現象。
- code: T04
  name: 地球適居帶與液態水條件
  desc: 分析行星位於適居區、適當質量留住大氣、溫室效應與液態水存在等地球孕育生命的必要條件。
- code: T05
  name: 矮行星與小行星彗星比較
  desc: 說明冥王星降格為矮行星的理由，並比較小行星帶、柯伊伯帶與彗星的組成、來源與雙彗尾方向。
- code: T06
  name: 流星、隕石與流星雨成因
  desc: 區分流星體落入大氣與隕石的差異，並解釋流星雨的微塵來源及以星座命名輻射點的透視原理。
- code: T07
  name: 太陽活動週期與太陽風比較
  desc: 判讀太陽黑子約11年的極大期週期，並比較太陽風帶電粒子與閃焰電磁波抵達地球的速度與時間。
- code: T08
  name: 地球磁層結構與防禦屏障
  desc: 依據地球磁層迎風面壓縮與背風面拉長示意圖判別太陽方位，並辨識磁層、范艾倫帶與大氣層的防護順序。
- code: T09
  name: 太陽風、磁暴與極光成因
  desc: 分析太陽風粒子進入地球高緯大氣產生極光與磁暴的物理機制，並利用日地距離與延遲時間估算太陽風速。
- code: T10
  name: 地磁擾動指數與圖表判讀
  desc: 依據磁暴環電流與磁極分布特性，解釋 Kp 指數測站設於高緯度原因並判讀 Dst 指數時間序列圖。
- code: T11
  name: 大氣吸收與地面太空望遠鏡
  desc: 判別各波段電磁波穿透地球大氣層的能力，決定適合設於地面或必須置於太空的天文望遠鏡類型。
- code: T12
  name: 行星相對位置與合衝凌日
  desc: 判別內外行星的上合、下合、衝、火星大接近與凌日相對位置，以及行星自轉公轉反向下的視運動現象。
- code: T13
  name: 地軸傾斜與四季日照仰角
  desc: 分析地軸傾斜對四季、極區永晝永夜與太陽日照仰角的影響，並計算正午仰角、天頂角與單位面積輻射量。
- code: T14
  name: 日月地位置與月相日月食
  desc: 依據日地月相對位置圖或農曆日期，判別月相盈虧、地球亮暗面比例、日月食條件及月亮升落中天時刻。
- code: T15
  name: 天文單位與光行時間計算
  desc: 利用天文單位（AU）與光速計算太陽光行至地球的時間，或結合磁暴延遲時間推算太陽風速度量級。
