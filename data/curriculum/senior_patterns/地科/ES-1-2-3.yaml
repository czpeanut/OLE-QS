unit:
  subject: 地科
  code: ES-1-2-3
  title: 地震災害
status: draft
types:
- code: T01
  name: 地震成因與地震波紀錄判讀
  desc: 判別斷層活動為地震主因，或在地震波紀錄圖中辨識P波、S波與表面波的到達順序與振幅特徵。
- code: T02
  name: 走時差與震央距及發震時間
  desc: 利用P波與S波速差、走時曲線圖或到達時間差，計算測站震央距、發震時間或地震波抵達時刻。
- code: T03
  name: 地震預警原理與盲區測站判讀
  desc: 依據電波快於震波與P波觸發原理，分析預警盲區成因、評估測站配置或計算避難反應時間。
- code: T04
  name: 地震規模與震度定義及比較
  desc: 區分地震規模（能量釋放）與地震震度（地表搖晃程度及地動加速度分級）的定義與空間變化差異。
- code: T05
  name: 地震規模能量倍率與圖表判讀
  desc: 依規模差值計算地震釋放能量倍數，或比較芮氏規模與震矩規模的高規模飽和限制與數據圖表。
- code: T06
  name: 震波振幅、震度與報告圖判讀
  desc: 依據多測站地震波振幅或等震度分布報告圖，比較各地震度大小、場址效應與震央位置關係。
- code: T07
  name: 全球地震帶分布與震源深度
  desc: 辨識環太平洋、歐亞與中洋脊三大地震帶分布，並結合板塊邊界類型比較淺、中、深源地震特性。
- code: T08
  name: 火山帶與地震帶重疊成因分析
  desc: 闡明全球主要地震帶與火山帶高度重疊分布及其與板塊邊界活動的關聯性。
- code: T09
  name: 土壤液化機制與高風險區判別
  desc: 分析飽和疏鬆砂土、孔隙水壓升高與地質分區條件，判別土壤液化的成因機制與高風險區域。
- code: T10
  name: 海嘯成因與波速預警時間計算
  desc: 判斷海底地震引發海嘯的條件與大洋近岸波速變化，並計算海嘯抵達沿海城市的預警時間。
- code: T11
  name: 斷層錯動與地表地貌災害判別
  desc: 結合臺灣地震斷層實例與斷層型態，判別地表隆起錯動、淹水及地下斷層面傾角等災害特徵。
- code: T12
  name: 地震直接與間接災害類型辨析
  desc: 區分斷層錯動、山崩、海嘯與火災等地震直接或間接災害，並排除與地震無關的現象。
- code: T13
  name: 區域地質與地震致災差異分析
  desc: 比較相同地震規模下不同地區受災程度的差異，分析盆地場址效應、震源深度與人口密度的影響。
- code: T14
  name: 地震防災避難與耐震減災實務
  desc: 判別地震發生時的正確避難原則、建築物耐震設計概念與日常減災應變措施。
