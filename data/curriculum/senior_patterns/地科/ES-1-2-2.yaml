unit:
  subject: 地科
  code: ES-1-2-2
  title: 地表與地殼的變動
status: draft
types:
- code: T01
  name: 大陸漂移與板塊學說演進
  desc: 區辨韋格納大陸漂移說、海底擴張說與板塊構造學說的支持證據、理論差異及提出先後順序。
- code: T02
  name: 地磁條帶判讀與擴張速率
  desc: 依據中洋脊兩側古地磁正反轉條帶對稱性、岩石年齡與距離資料，判讀中洋脊位置並計算擴張速率。
- code: T03
  name: 張裂性板塊邊界地質特徵
  desc: 判別張裂性板塊邊界的熱對流上升、玄武岩質岩漿噴發、淺源地震與中洋脊、裂谷等地貌特徵。
- code: T04
  name: 聚合性邊界與隱沒帶剖面
  desc: 依據海溝、島弧相對位置及班尼奧夫帶震源深度分布，判讀板塊隱沒與碰撞方向、岩漿性質及地形構造。
- code: T05
  name: 轉形斷層與錯動邊界判圖
  desc: 從中洋脊與轉形斷層俯視圖或速度箭頭圖，辨識錯動性邊界區段、板塊歸屬、點距變化與地震特徵。
- code: T06
  name: 熱點火山鏈與板塊移動推論
  desc: 依據夏威夷等熱點火山島鏈的噴發年代與排列方位變化，反推板塊移動方向、歷史轉折與岩漿特性。
- code: T07
  name: 斷層類型與上下盤錯動判別
  desc: 依據岩層錯動剖面、實景照片或受力型態，判別上下盤相對移動並區分正斷層、逆斷層與平移斷層。
- code: T08
  name: 應力類型與節理斷層判讀
  desc: 從岩層受張力、壓力或剪力示意圖與裂隙錯動有無，辨識節理構造與各類斷層。
- code: T09
  name: 臺灣板塊碰撞與造山運動
  desc: 分析歐亞板塊與菲律賓海板塊在臺灣周邊的隱沒、碰撞造山過程及海溝、島弧與山脈演化。
- code: T10
  name: 臺灣震源分布與構造線走向
  desc: 依據臺灣周邊震源深度分布與受力方向，判讀板塊立體隱沒幾何構造與斷層、山脈構造線走向。
- code: T11
  name: 臺灣GPS觀測與地殼變形
  desc: 判讀臺灣GPS測站移動速度向量圖，推算各測站間的相對位移、壓縮或伸張變形及應變率差異。
- code: T12
  name: 臺灣地質分區與火山岩比較
  desc: 比較臺灣本島各地質分區、大屯火山群、海岸山脈與離島的岩性差異、所屬板塊及形成先後。
- code: T13
  name: 三大岩類、包溫序列與搬運
  desc: 依據岩石成因、包溫反應序列礦物熔點順序與礫石圓度，判別三大岩類、火成岩結晶與搬運距離。
