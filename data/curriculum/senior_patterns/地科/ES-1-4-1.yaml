unit:
  subject: 地科
  code: ES-1-4-1
  title: 海洋的結構
status: draft
types:
- code: T01
  name: 海水鹽度定義與離子組成
  desc: 依據鹽度千分比定義、定比定律與岩石風化來源，判別海水中主要鹽類與離子的相對比例及化學性質。
- code: T02
  name: 海水鹽度測量與定比原理
  desc: 說明滴定法與導電度法測量海水鹽度的演進及定比定律應用原理。
- code: T03
  name: 海水鹽度比例與重量計算
  desc: 依據標準海水鹽度（‰）與各溶解鹽類質量百分比，計算特定質量海水中氯化鈉等鹽類的重量。
- code: T04
  name: 影響鹽度因子與緯度分布
  desc: 分析蒸發量、降水量、河川注入與結冰融冰對鹽度的影響，判讀不同緯度海域與河口的表層鹽度分布。
- code: T05
  name: 表層海溫分布與季節差異
  desc: 判讀全球或臺灣周圍海域冬夏季表層水溫圖，分析緯度、洋流與湧升流對海面溫度分布的影響。
- code: T06
  name: 海水溫度垂直分層與成因
  desc: 從海水溫度隨深度變化剖面中辨識混合層、斜溫層與深水層的深度範圍、成因與垂直溫度變化特徵。
- code: T07
  name: 不同緯度與季節水溫剖面
  desc: 比較低中高緯度及冬夏兩季海域在混合層厚度與斜溫層溫度變化幅度上的垂直結構差異。
- code: T08
  name: 溫鹽圖判讀與水團特性
  desc: 依據溫鹽圖中的等密度線與深度標記，判讀不同水團的水溫、鹽度與密度大小關係。
- code: T09
  name: 海水密度分層與垂直穩定度
  desc: 依據溫鹽垂直剖面與等密度線分布，比較海水的密度變化與水體垂直穩定度高低。
- code: T10
  name: 海水溶氧量垂直分布與成因
  desc: 比較透光層、斜溫層與深層海水的溶氧量變化，並連結光合作用、有機物分解耗氧與氣候變遷的影響。
- code: T11
  name: 海水營養鹽深度分布與成因
  desc: 依據磷酸鹽等營養鹽隨深度變化曲線，分析表層浮游植物消耗與深層有機物分解對濃度的影響。
- code: T12
  name: 海洋聲納測深與聲道傳播
  desc: 利用聲波在海水中的傳遞速率與往返時間計算水深，並由溫度壓力變化推論海洋聲道傳播特性。
