unit:
  subject: 地科
  code: ES-1-3-5
  title: 氣象災害－颱風
status: draft
types:
- code: T01
  name: 颱風形成條件與結構氣壓剖面
  desc: 判別颱風形成所需的海溫、水氣、緯度與垂直風切條件，並讀懂颱風垂直剖面的氣壓與風雨分布。
- code: T02
  name: 颱風分級標準與強度指標判別
  desc: 依據中央氣象局對颱風中心附近最大平均風速的分類標準，區分輕度、中度與強烈颱風。
- code: T03
  name: 颱風移動路徑、風向與雨量時序
  desc: 結合北半球颱風逆時鐘環流與移動路徑，判斷測站風向隨時間的轉變或對應的降雨分布時序。
- code: T04
  name: 西北颱與秋颱共伴效應災情
  desc: 辨識西北颱路徑對北臺灣造成的嚴重災情，以及秋冬颱風與東北季風輻合產生共伴效應的豪雨成因。
- code: T05
  name: 雙颱藤原效應與大氣環流交互
  desc: 判別兩個距離相近的颱風產生逆時針互繞的藤原效應，及其對颱風移動路徑的影響。
- code: T06
  name: 熱帶氣旋生成條件與命名分區
  desc: 判別熱帶氣旋形成所需的海溫與科氏力條件，及颱風、颶風在不同海域的命名與涼流限制。
- code: T07
  name: 颱風天氣圖與風速氣壓分布
  desc: 依據颱風地面天氣圖的等壓線間距與中心颱風眼位置，比較各地風速大小與氣壓分布。
- code: T08
  name: 颱風路徑圖推算移動速率
  desc: 依據定時記錄的颱風中心路徑圖中各點間距變化，判別颱風移動平均速率的趨勢曲線。
- code: T09
  name: 颱風過境風向與氣壓變化
  desc: 依據颱風路徑與測站相對位置，判斷測站接近地面風向及過境前後的氣壓變化曲線。
- code: T10
  name: 颱風衛星雲圖與雨量分布
  desc: 依據衛星雲圖或累積雨量分布圖及地形迎風面效應，推測颱風中心相對於臺灣的位置。
- code: T11
  name: 颱風形成條件與強度分級依據
  desc: 判別颱風生成所需的海溫、緯度科氏力、低壓擾動與垂直風切條件，及強度分級標準。
- code: T12
  name: 颱風暴風圈環流與各地風向判讀
  desc: 依颱風中心相對位置與逆時針環流特性，推斷臺灣各地在颱風不同象限所吹的風向與強風區。
- code: T13
  name: 颱風路徑判讀與導引氣流分析
  desc: 由颱風路徑與潛勢預測圖計算移動速率，並分析太平洋高壓導引、潛勢誤差擴大及藤原效應。
- code: T14
  name: 颱風過境氣壓變化與地形共伴效應
  desc: 分析颱風通過時測站氣壓變化曲線、地形引發焚風紀錄，以及與東北季風共伴造成豪雨。
- code: T15
  name: 颱風伴隨災害與防範機制辨析
  desc: 區分颱風引發的豪雨、暴潮海水倒灌、巨浪與鹽風等災害與非颱風直接造成的地質災害。
- code: T16
  name: 颱風生成條件與基本結構特徵
  desc: 辨識颱風形成所需的海溫、緯度與擾動條件，以及氣旋性質與生成海域。
- code: T17
  name: 颱風垂直剖面氣壓風雨比較
  desc: 比較颱風眼、眼牆與外圍環流的氣壓高低、風速大小、垂直氣流方向與降雨強度。
- code: T18
  name: 南北半球颱風地面氣流判別
  desc: 依據氣壓梯度力與科氏力偏轉，判別南、北半球颱風近地面的順逆時針旋入氣流方向。
- code: T19
  name: 颱風路徑上各地風向與氣壓變化
  desc: 由颱風行進路徑圖推斷各地在不同時刻的風向轉變，或判讀測站氣壓隨時間的變化曲線。
- code: T20
  name: 西北颱與共伴效應防災成因
  desc: 分析西北颱定義、地形迎風坡豪雨、河口海水倒灌或大潮疊加造成的淹水致災機制。
