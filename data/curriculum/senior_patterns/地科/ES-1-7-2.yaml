unit:
  subject: 地科
  code: ES-1-7-2
  title: 節用資源與合理開發
status: draft
types:
- code: T01
  name: 能源蘊藏量與可開採年限分析
  desc: 判讀煤、石油、天然氣等化石燃料的蘊藏量與可開採年限數據表，評估非再生能源枯竭風險。
- code: T02
  name: 全球與臺灣能源消耗趨勢圖表
  desc: 依據各類能源消耗量隨時間變化圖或電力裝置容量配比表，比較不同能源的消長趨勢與占比變化。
- code: T03
  name: 化石燃料燃燒與環境汙染問題
  desc: 判別燃燒化石燃料排放二氧化硫與二氧化碳導致的酸雨、全球暖化及海洋汙染等環境衝擊。
- code: T04
  name: 可再生與非再生能源分類判別
  desc: 區分太陽能、海洋能、地熱、水力等可再生綠色能源與煤、石油、天然氣等化石燃料。
- code: T05
  name: 再生能源開發與低碳轉型比較
  desc: 比較太陽能、風力、水力、地熱與生質能等再生能源的發電原理、優缺點與開發限制。
- code: T06
  name: 天然氣水合物生成溫壓圖判讀
  desc: 結合甲烷冰生成溫壓相圖與海域水深、地溫曲線，判斷可形成天然氣水合物礦床的海底深度。
- code: T07
  name: 再生能源發電變因實驗數據分析
  desc: 從風力發電扇葉長度與發電電壓等實驗數據表，歸納並判別合理的科學實驗假設。
- code: T08
  name: 臺灣離岸風力發電選址環境評估
  desc: 結合臺灣西部沿海季風風場與海床條件，推論離岸風電場址選定的自然環境優勢。
- code: T09
  name: 再生與非再生能源優缺點比較
  desc: 比較太陽能、風力、地熱、水力與化石燃料在環境衝擊與供應穩定性上的差異。
- code: T10
  name: 水資源開發與礦產合理利用
  desc: 評估地下水超抽地層下陷防治、水庫永續利用與海洋礦產資源開發的環境代價。
