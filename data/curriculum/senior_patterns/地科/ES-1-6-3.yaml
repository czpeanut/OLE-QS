unit:
  subject: 地科
  code: ES-1-6-3
  title: 人類活動與近期氣候變化
status: draft
types:
- code: T01
  name: 基林曲線與碳氧濃度趨勢分析
  desc: 判讀基林曲線二氧化碳濃度上升與大氣氧氣逐年減少的關聯，並分析化石燃料燃燒的機制。
- code: T02
  name: 人為溫室氣體種類與增溫效應
  desc: 辨識二氧化碳、甲烷與氧化亞氮等人為活動增加的溫室氣體，並區分其與水氣、氮氣的差異。
- code: T03
  name: 工業革命以來全球暖化趨勢
  desc: 依據近百年全球均溫與海平面觀測紀錄，分析人類活動對近期氣候快速暖化的貢獻。
- code: T04
  name: 人類土地利用與氣膠氣候效應
  desc: 分析森林砍伐、都市熱島效應與人為懸浮微粒對區域或全球能量平衡的影響。
- code: T05
  name: 近期極端氣候與暖化關聯判別
  desc: 推論全球暖化對熱浪、強降雨與乾旱等近期極端天氣事件發生頻率與強度的影響。
- code: T06
  name: 近期氣候變遷多因子歸因圖表
  desc: 比較太陽黑子週期、二氧化碳濃度與全球氣溫異常曲線，歸納氣候變化受多重因子影響。
- code: T07
  name: 氣膠微粒與黑碳實驗數據判讀
  desc: 由油母質與木炭等含碳物質分離實驗曲線，分析實驗結果推論與反應試劑濃度大小。
- code: T08
  name: 懸浮微粒與冰雪反照率效應
  desc: 評估大氣黑碳吸收太陽輻射的參數需求，並推論黑碳沉降冰川降低反照率加速消融的影響。
- code: T09
  name: 溫室氣體排放來源與暖化趨勢
  desc: 辨識化石燃料燃燒、土地利用等人類活動對近百年二氧化碳與甲烷濃度上升的貢獻。
- code: T10
  name: 都市熱島效應與局地氣候變化
  desc: 分析城市地表鋪面、人為廢熱與綠地減少對局地氣溫升高的影響。
