unit:
  subject: 地科
  code: ES-1-3-2
  title: 大氣中的水氣變化
status: draft
types:
- code: T01
  name: 水的三態變化與水循環過程
  desc: 判別蒸發、凝結、昇華與凝華的吸放熱性質，並區分自然界水氣相變現象與水循環過程。
- code: T02
  name: 飽和水氣壓與溫度關係判別
  desc: 依據氣溫決定最大水氣容納量的關係，在固定水氣壓下比較溫度高低並判別空氣達飽和的途徑。
- code: T03
  name: 露點溫度與實際水氣含量判讀
  desc: 依據露點溫度定義與飽和水氣對照圖表，直接比較不同空氣塊的露點高低與實際水氣含量多寡。
- code: T04
  name: 相對溼度定義計算與調控比較
  desc: 利用實際水氣壓與飽和水氣壓比值計算相對溼度，或推論升溫降溫與增減水氣對溼度的影響。
- code: T05
  name: 飽和水氣曲線圖判讀露點與溼度
  desc: 從飽和水氣壓與溫度關係曲線圖中，讀取各空氣塊的露點溫度、相對溼度大小與飽和狀態。
- code: T06
  name: 多地溫濕資料與水氣量比較
  desc: 依據多城市氣溫、露點與水氣壓統計表，判別各處實際水氣含量、相對溼度高低與資料合理性。
- code: T07
  name: 乾溼球溫度計讀數與查表判讀
  desc: 判讀乾球與溼球溫度計數值，結合相對溼度表與露點表查出乾燥程度、相對溼度與實際水氣量。
- code: T08
  name: 氣溫露點日變化與飽和途徑圖
  desc: 分析一天中氣溫、露點與相對溼度的日變化時機，或在飽和曲線圖上判別降溫與增濕達飽和路徑。
- code: T09
  name: 空氣抬升機制與成雲致雨判別
  desc: 比較地形抬升、對流、鋒面與輻合等上升冷卻機制對成雲致雨的影響，並區分高壓下沉無雲現象。
- code: T10
  name: 絕熱升降溫與過山焚風計算
  desc: 運用乾絕熱與溼絕熱溫度直減率，分段計算空氣塊迎風爬升、雲底高度與背風沉降焚風溫度。
- code: T11
  name: 氣流過山溫濕曲線與性質比較
  desc: 追蹤氣流翻越山脈迎風坡與背風坡的溫度、相對溼度變化曲線，並比較過山前後溫壓溼度差異。
- code: T12
  name: 反潮現象成因與凝結核防治
  desc: 依據暖溼空氣遇冷表面凝結或缺乏凝結核的機制，解釋臺灣春季反潮現象與人造雨、除溼對策。
- code: T13
  name: 輻射冷卻與霜害成因及防範
  desc: 分析晴朗無風夜裡地表輻射冷卻與地形對霜害的影響，並判別攪動空氣或加溫等防霜措施。
