unit:
  subject: 地科
  code: ES-1-5-2
  title: 從地球看星空
status: draft
types:
- code: T01
  name: 星座劃分、行星與日心說
  desc: 辨識國際天文聯合會星座劃分與恆星自行，區分恆星與行星觀測差異及地心說與日心說的演變。
- code: T02
  name: 天球結構與黃道節氣位置
  desc: 判讀天球赤道、黃道、天極與二分二至點結構圖，辨識太陽在天球上的移動方向與特定日期的太陽位置。
- code: T03
  name: 黃道十二宮與中天升落星座
  desc: 結合出生日期或節氣與觀測時刻，推算黃道十二宮中位於子夜中天、天頂或東西方地平線的星座。
- code: T04
  name: 北極星仰角與可見赤緯範圍
  desc: 利用北極星仰角等於觀測地緯度的性質，推算星軌與地平線夾角、拱極星條件及各地可見的天球赤緯範圍。
- code: T05
  name: 星跡照片方向與曝光時間
  desc: 由長時間曝光星軌照片的弧線方向、旋轉順逆與圓心角弧度，判別拍攝方位、南北半球、緯度與曝光時間。
- code: T06
  name: 恆星周日周年視運動推算
  desc: 運用每小時15度、每日提早4分鐘與每月提早2小時的視運動規律，推算不同時刻或日期的星座方位。
- code: T07
  name: 太陽日與恆星日時間推算
  desc: 依據地球自轉與公轉示意圖計算太陽日與恆星日的角度與時間差，並推論自轉公轉反向假設下的天象變化。
- code: T08
  name: 四季太陽視軌跡與緯度推算
  desc: 判讀不同季節與緯度的太陽升落視運動軌跡圖，推論日出日落方位、觀測地緯度、正午仰角與永晝日期。
- code: T09
  name: 地球晝夜圖與太陽輻射能
  desc: 由地球晝夜分布俯視或側視圖，判別節氣日期、各地地方時、晝夜長短及地表單位面積太陽輻射量。
- code: T10
  name: 四季代表星座與大三角辨識
  desc: 由星座連線圖與亮星赤經赤緯資料，辨識夏季與冬季大三角的組成恆星及不同季節夜空的代表星座。
- code: T11
  name: 視星等與亮度倍數對數換算
  desc: 依據星等差5等亮度差100倍（每差1等差2.512倍）的定義，計算恆星亮度比、肉眼可見極限與星等差值。
- code: T12
  name: 絕對星等、光度與距離推算
  desc: 依據絕對星等10秒差距（32.6光年）的定義與視星等差值，比較恆星發光能力（光度）與距離地球的遠近。
- code: T13
  name: 黑體輻射曲線與星色溫度
  desc: 判讀黑體輻射能量波長分布曲線或吸收光譜與星色，比較恆星表面溫度高低，並區分恆星自發光與行星反光。
- code: T14
  name: 光度、溫度與恆星半徑計算
  desc: 結合恆星光度與表面積及表面溫度四次方成正比的關係，計算並比較不同恆星的半徑比例或絕對星等。
- code: T15
  name: 望遠鏡倍率與聚光極限星等
  desc: 依物鏡與目鏡焦距計算望遠鏡放大倍率，並依口徑平方比計算聚光力倍數及可觀測的最暗極限星等。
- code: T16
  name: 電磁波段、大氣窗口與選址
  desc: 排列電磁波波長順序並判別大氣吸收窗口，依天體溫度與觀測波段決定地面高山或太空望遠鏡及台址條件。
