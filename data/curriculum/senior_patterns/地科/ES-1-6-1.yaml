unit:
  subject: 地科
  code: ES-1-6-1
  title: 多重時間尺度的氣候變遷
status: draft
types:
- code: T01
  name: 火山噴發對短期氣候距平影響
  desc: 判讀大規模火山噴發後氣溶膠對大氣陽光穿透率與全球平均氣溫距平值的短期降溫影響。
- code: T02
  name: 地球能量收支平衡與均溫變化
  desc: 分析地表吸收太陽短波輻射與放出紅外線長波輻射的能量收支平衡對全球平均溫度的影響。
- code: T03
  name: 地球軌道參數與冰期旋迴
  desc: 分析米蘭科維奇旋迴（地軸傾角、進動、軌道偏心率）造成冰期與間冰期交替的機制。
- code: T04
  name: 古氣候代用指標與氣候重建
  desc: 判別冰芯氣泡、樹輪、深海沉積物與珊瑚等古氣候代用指標所記錄的歷史氣溫與大氣成分。
- code: T05
  name: 多重時間尺度氣候變遷比較
  desc: 區分地質年代、歷史時期與近代不同時間尺度的氣候變遷驅動因子與變化幅度。
- code: T06
  name: 天氣與氣候時間尺度特徵區辨
  desc: 區分短時間天氣事件與長期週期平均氣候特徵的敘述差異。
- code: T07
  name: 古氣候代用指標與冰期旋迴
  desc: 利用氧同位素、冰芯或花粉等紀錄推論地質歷史中的冰期與間冰期變化。
- code: T08
  name: 米蘭科維奇循環與軌道週期
  desc: 分析地球自轉軸傾角、進動與軌道離心率變化對長期氣候冷暖週期的影響。
- code: T09
  name: 過去與現今氣候變遷速率比較
  desc: 比較地質時期自然氣候變遷與工業革命後暖化速率的差異。
- code: T10
  name: 自然因素對氣候變遷的影響
  desc: 判斷太陽黑子活動、火山爆發氣膠或板塊位置變動對全球氣候的作用。
- code: T11
  name: 短期天氣事件與長期氣候指標判讀
  desc: 區分單日極端氣溫等天氣系統影響與長期氣候平均指標的統計意義。
- code: T12
  name: 沉積物花粉孢子與古氣候推論
  desc: 說明利用湖泊沉積物中不同植物孢粉對溫溼度的要求來重建古代氣候環境的原理。
- code: T13
  name: 冰芯氣體紀錄與溫度變化趨勢分析
  desc: 判讀南極或格陵蘭冰芯紀錄圖，分析過去數十萬年冰期與間冰期氣溫與溫室氣體濃度的相關性。
- code: T14
  name: 地球軌道參數與歲差進動效應
  desc: 分析地球自轉軸進動週期、方向及對未來數萬年季節與近遠日點位置的影響。
- code: T15
  name: 火山爆發對短期與長期氣候影響
  desc: 比較火山噴發釋放的火山灰遮蔽陽光與二氧化碳對氣候造成的降溫與增溫雙重作用。
- code: T16
  name: 冰室、溫室氣候與冰期判別
  desc: 依據極區冰河存在與否及冰川消長狀態，判別地球目前的氣候狀態屬於冰室氣候的間冰期。
- code: T17
  name: 古氣候重建方法與時間尺度
  desc: 由重建古氣候方法適用時間範圍圖，比較氣象儀器、年輪、冰芯與海洋沉積的適用年代尺度。
- code: T18
  name: 氧同位素比值與冰期氣候判讀
  desc: 依據海水蒸發與陸冰累積的同位素分餾原理，由冰芯或海洋沉積物 δ18O 曲線判讀冰期與間冰期。
- code: T19
  name: 冰芯氣泡分析與古大氣重建
  desc: 說明利用南極冰芯包裹的氣泡氣體組成重建古代大氣二氧化碳濃度的原理。
- code: T20
  name: 米蘭科維奇理論與突變氣候事件
  desc: 分析地球軌道離心率、地軸傾角與歲差對冰期循環的影響，或判讀新仙女木等溫鹽環流突冷事件。
