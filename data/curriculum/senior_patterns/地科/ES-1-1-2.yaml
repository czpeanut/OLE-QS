unit:
  subject: 地科
  code: ES-1-1-2
  title: 大氣與海洋的演化
status: draft
types:
- code: T01
  name: 早期大氣組成與推測依據
  desc: 依據均變說、現今火山噴發氣體與類地行星大氣比較，判別地球早期大氣成分與來源。
- code: T02
  name: 輕氣體逃逸與重力溫度關聯
  desc: 分析地球重力大小、地表高溫與氣體分子量對早期氫、氦等輕氣體逸散的影響。
- code: T03
  name: 原始海洋形成與冷卻凝結
  desc: 分析地球表面降溫後水氣凝結降雨形成原始海洋，以及初期岩石圈冷卻的演化機制。
- code: T04
  name: 大氣二氧化碳移除機制
  desc: 判別早期大氣二氧化碳透過溶入海水、形成碳酸鈣沉澱與光合作用消耗而減少的途徑。
- code: T05
  name: 光合產氧與大氣氧氣累積
  desc: 分析藍綠菌行光合作用釋氧後，先消耗於海洋氧化反應再逐步累積至大氣的歷程。
- code: T06
  name: 帶狀鐵礦成因與年代推論
  desc: 依據帶狀鐵礦的沉積年代與亞鐵離子氧化沉澱機制，推論早期海洋與大氣氧氣演化。
- code: T07
  name: 臭氧層形成與生物登陸關聯
  desc: 分析大氣氧氣累積生成臭氧層阻擋紫外線後，對生物由海洋向陸地演化的保護機制。
- code: T08
  name: 大氣演變曲線氣體辨識
  desc: 依據大氣各氣體含量或比例隨地質時間變化的曲線圖，辨識各曲線對應的氣體種類。
- code: T09
  name: 大氣演變曲線成因與氣壓推論
  desc: 依據大氣成分演化曲線圖，推論氣體消長原因、早期大氣壓力與對應演化事件。
- code: T10
  name: 大氣組成演變階段排序
  desc: 依地球演化時期排列氫氦甲烷氨、水氣二氧化碳、氮氧與臭氧大氣的出現先後順序。
- code: T11
  name: 大氣海洋與生命演化排序
  desc: 將火山釋氣、海洋形成、光合產氧、臭氧層生成與生物登陸等重大演化事件依序排列。
- code: T12
  name: 地球各層圈出現順序判別
  desc: 依據地球冷卻與生命演化歷程，判斷岩石圈、大氣圈、水圈與生物圈出現的先後順序。
