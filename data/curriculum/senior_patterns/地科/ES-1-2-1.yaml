unit:
  subject: 地科
  code: ES-1-2-1
  title: 地震波與地球內部分層
status: draft
types:
- code: T01
  name: 地震波類型與傳播特性
  desc: 區分P波、S波與表面波的質點振動方向、波速大小、傳播介質及對地表的破壞特性。
- code: T02
  name: 測站地震波紀錄圖判讀
  desc: 從測站地震波紀錄圖中，識別P波、S波與表面波的到達順序、波形與振幅差異。
- code: T03
  name: P與S波時距差及震央計算
  desc: 利用P波與S波波速及到達測站的時間差或走時曲線，計算震源距離、發震時刻與單站可測參數。
- code: T04
  name: 震波探測原理與間接證據
  desc: 比較地震波分析、深海鑽探、隕石與地函包裹體等間接探測方法在推論地球內部構造的應用。
- code: T05
  name: 波速深度圖與分層判讀
  desc: 依據P波或S波波速隨深度變化曲線圖，判讀莫氏不連續面深度、岩石圈、軟流圈及外內核位置與物態。
- code: T06
  name: 震波折射路徑與陰影區判讀
  desc: 依據地震波在地球內部的折射彎曲路徑、低速帶分布與P波、S波陰影區，推論地球內部圈層與物態。
- code: T07
  name: 地球內部不連續面深度成因
  desc: 比較莫氏、古氏與雷嫚不連續面的深度順序，並分析造成震波波速突變的材質與物態原因。
- code: T08
  name: 大陸與海洋地殼性質比較
  desc: 比較大陸地殼與海洋地殼的厚度、密度與主要構成岩石（花岡岩與玄武岩）差異。
- code: T09
  name: 岩石圈與軟流圈特徵判別
  desc: 區分岩石圈與軟流圈的力學性質、部分熔融低速帶特徵及地殼與上部地函的界線差異。
- code: T10
  name: 地核磁場與內部分層組成
  desc: 比較地殼、地函、外核與內核的深度、物態、岩石與隕石密度順序，並說明外核對流與地磁起源。
- code: T11
  name: 地殼均衡與地函熱對流
  desc: 運用地殼均衡原理解釋山根深度與地殼升降，或由低速帶與氦同位素推論地函熱對流非均勻性。
- code: T12
  name: 三大岩類特徵與分類判別
  desc: 依據礦物結晶大小、化學成分、沉積顆粒粗細或葉理構造，辨識火成岩、沉積岩與變質岩。
- code: T13
  name: 臺灣地質分區與岩石分布
  desc: 依據臺灣地質分區圖，判別變質岩、火成岩、沉積岩及煤與石油等礦產的主要分布區域。
