unit:
  subject: 地科
  code: ES-1-6-2
  title: 氣候變遷造成的環境影響
status: draft
types:
- code: T01
  name: 海平面高度變化趨勢與速率估算
  desc: 由海平面高度變化趨勢圖，計算海平面平均每年上升的速率。
- code: T02
  name: 近數十年全球氣溫與環境指標關聯
  desc: 比較近五十年全球平均氣溫趨勢與大氣二氧化碳濃度、海平面高度及海洋pH值等指標的變化方向。
- code: T03
  name: 冰期海平面升降與陸橋遷徙
  desc: 連結極區冰層擴張與海平面下降機制，推論末次冰盛期臺灣海峽陸橋出現與生物遷徙現象。
- code: T04
  name: 極地冰原融化與反照率正回饋效應
  desc: 分析全球暖化導致冰雪覆蓋減少、地表反照率下降進而加劇吸熱升溫的交互影響。
- code: T05
  name: 海洋酸化與海洋生態系統衝擊
  desc: 說明大氣二氧化碳溶入海水造成海水pH值下降，對珊瑚礁等碳酸鈣骨骼生物的影響。
