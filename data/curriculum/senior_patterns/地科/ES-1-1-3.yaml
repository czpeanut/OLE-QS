unit:
  subject: 地科
  code: ES-1-1-3
  title: 探索地球的歷史
status: draft
types:
- code: T01
  name: 均變說與相對定年原則
  desc: 應用均變說以今推古之邏輯與相對定年基本原則，區分相對與絕對定年概念。
- code: T02
  name: 地質剖面圖事件先後排序
  desc: 運用疊置定律、截切定律、包含原則與侵蝕面關係，判讀地質剖面中岩層、岩脈與斷層之先後順序。
- code: T03
  name: 剖面絕對定年與化石推論
  desc: 結合地質剖面圖中的火成岩脈絕對定年數據與標準化石年代，推論沉積岩層或斷層的形成年代區間。
- code: T04
  name: 沉積構造與地層倒轉判讀
  desc: 利用交錯層、波痕與粒級層等沉積構造，判斷地層是否發生倒轉或古水流方向。
- code: T05
  name: 探索地球歷史與定年限制
  desc: 分析侵蝕、變質、缺乏可定年礦物或半衰期上限對重建地球歷史與放射性定年的限制。
- code: T06
  name: 放射性半衰期定量計算
  desc: 依據母子元素質量或原子數比例及半衰期公式，計算岩石、火成岩脈或生物樣本的絕對年代。
- code: T07
  name: 放射性衰變曲線圖表判讀
  desc: 由母子元素含量隨時間變化的衰變曲線圖，判別母子元素曲線、讀取半衰期或推算岩層年齡。
- code: T08
  name: 同位素定年法適用性選擇
  desc: 依據待測樣本的材質與預估年代尺度，選擇半衰期合適的放射性同位素定年法。
- code: T09
  name: 標準與指相化石條件判別
  desc: 依據物種生存期限長短、分布範圍廣狹與化石保存型態，區分標準化石、指相化石與生痕化石之條件。
- code: T10
  name: 跨區地層柱與化石對比
  desc: 比對不同地區地層剖面中的岩性與標準化石群，判斷同時期地層層序與關鍵對比化石。
- code: T11
  name: 化石年代交集與環境推論
  desc: 利用地層中標準化石共存年代交集推論地層所屬時代，或由化石與岩性組合推估海陸沉積環境變遷。
- code: T12
  name: 地質年代表階層與排序
  desc: 判別宙、元、代、紀等時間尺度階層、劃分依據、地質時代先後順序與地球時鐘尺度換算。
- code: T13
  name: 各時代生物與古氣候特徵
  desc: 辨識古生代、中生代與新生代各時期代表性生物演替、盤古大陸分合與石炭紀等古氣候環境特徵。
- code: T14
  name: 寒武紀大爆發與生物大滅絕
  desc: 分析寒武紀大爆發與化石保存條件，並判讀生物科數目變化圖中的五大生物大滅絕事件與演化意義。
