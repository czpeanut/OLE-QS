unit:
  subject: 地科
  code: ES-1-3-4
  title: 天氣圖判讀
status: draft
types:
- code: T01
  name: 地面天氣圖物理量與填圖判讀
  desc: 識別地面天氣圖繪製的主要物理量，並從測站填圖符號讀取氣溫、露點、氣壓、風向與風速。
- code: T02
  name: 鋒面符號辨識與臺灣常見鋒面
  desc: 辨識冷鋒、暖鋒、滯留鋒與囚錮鋒的符號與氣團結構，並判別影響臺灣天氣的主要鋒面類型。
- code: T03
  name: 鋒面垂直剖面與冷暖氣團結構
  desc: 將地面天氣圖鋒面符號與垂直剖面圖對照，判別冷暖氣團位置、鋒面坡度與各區降水氣壓特徵。
- code: T04
  name: 鋒面過境前後天氣與數據變化
  desc: 追蹤連續天氣圖或測站逐日氣溫、氣壓、風向與雨量數據變化，推斷鋒面過境時間與天氣轉變。
- code: T05
  name: 地面天氣圖氣壓中心與環流風向
  desc: 在地面天氣圖上依據高低氣壓中心相對位置與等壓線分布，判別臺灣或特定地區的盛行風向。
- code: T06
  name: 高低氣壓中心氣流與天氣判讀
  desc: 由地面天氣圖等壓線與風向符號判斷南北半球及高低氣壓中心的水平輻合輻散、垂直升降與晴雨。
- code: T07
  name: 東亞天氣系統辨識與未來預報
  desc: 判讀東亞地面天氣圖上的高低壓、鋒面與溫帶氣旋或颱風位置，推論系統移動方向與未來天氣。
- code: T08
  name: 臺灣四季地面天氣圖與季節配對
  desc: 依據大陸冷高壓、太平洋高壓與滯留鋒等配置，辨識臺灣冬季、夏季或梅雨季的典型地面天氣圖。
- code: T09
  name: 梅雨與寒流等臺灣典型天氣型態
  desc: 依據指定日期與氣壓鋒面配置，判讀臺灣冬季寒流、東北季風或春季梅雨造成的天氣型態。
- code: T10
  name: 天氣系統與臺灣地形迎風面降雨
  desc: 結合地面天氣圖判讀的風向與臺灣山脈地形分布，推論迎風面陰雨或豪雨發生的區域與成因。
- code: T11
  name: 臺灣各地月平均降水量曲線判讀
  desc: 依據臺灣北中南東測站長期月平均降水量分布圖，比對季風、梅雨與颱風造成的區域降雨差異。
- code: T12
  name: 大氣模式解析度與空汙氣象條件
  desc: 判斷數值模式網格解析度適用的天氣系統尺度，並分析高壓籠罩下大氣穩定與PM2.5空汙的關聯。
