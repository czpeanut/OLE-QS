unit:
  subject: 地科
  code: ES-1-3-3
  title: 大氣的運動
status: draft
types:
- code: T01
  name: 大氣垂直靜力平衡與運動動力
  desc: 說明重力與垂直氣壓梯度力平衡使垂直運動微弱之因，並辨識推動大氣水平運動的根本動力。
- code: T02
  name: 氣流輻合輻散與垂直升降降水
  desc: 判別地面輻合上升冷卻降水、高空輻散以及下沉輻散晴朗等垂直氣流運動與天氣成因。
- code: T03
  name: 等壓線疏密與氣壓梯度力風速
  desc: 依據地面天氣圖等壓線間距疏密程度，比較各地水平氣壓梯度力大小與風速強弱。
- code: T04
  name: 科氏力影響因子與尺度比較
  desc: 分析地球自轉、緯度與運動速度對科氏力大小及南北半球偏向的影響，並比較不同尺度運動的顯著性。
- code: T05
  name: 風向受力平衡與向量箭頭判讀
  desc: 由氣壓梯度力、科氏力與摩擦力向量圖或作圖題，辨識各作用力名稱、風向及所在南北半球。
- code: T06
  name: 等壓線迷宮與多區風向比較
  desc: 在等壓線分布圖上綜合判斷高空與地面各區域風向差異，並完成風向判讀與迷宮追蹤。
- code: T07
  name: 高空地轉風推論近地面風向
  desc: 已知高空地轉風向與等壓線分布不變的條件下，考慮地面摩擦力影響以推論近地面實際風向。
- code: T08
  name: 海陸摩擦力與白貝羅定律應用
  desc: 比較海面與陸地摩擦力差異對風速及等壓線夾角的影響，並說明白貝羅定律的適用限制。
- code: T09
  name: 南北半球高低氣壓環流與天氣
  desc: 結合科氏力偏轉與輻合輻散，判斷南北半球高壓與低壓中心的水平旋轉方向、垂直氣流與天氣。
- code: T10
  name: 空氣密度差異與高空等壓線推論
  desc: 比較冷暖空氣柱密度與氣壓隨高度遞減快慢，由地面氣壓與溫度分布推論高空等壓線型態。
- code: T11
  name: 全球行星風帶與盛行風向判讀
  desc: 依據緯度與科氏力偏轉規律，判讀信風、盛行西風與極地東風等全球行星風帶的風向。
- code: T12
  name: 季風環流與臺灣區域降水分布
  desc: 結合東北季風、西南季風與山脈地形效應，判讀臺灣北、中、南、東部測站的月均降水量變化。
