unit:
  subject: 物理
  code: PH-S1-5-1
  title: 等速圓周運動
status: draft
types:
- code: T01
  name: 圓周運動基本物理量比值計算
  desc: 運用 v=ωr=2πr/T 與 a_c=v^2/r=ω^2r 計算兩圓周運動物體的速率、角速度與向心加速度比。
- code: T02
  name: 切線加速度與法線加速度觀念
  desc: 區分曲線運動中切線加速度（改變速率）與法線加速度（改變方向）的物理意義。
- code: T03
  name: 水平彎道與傾斜彎道轉彎分析
  desc: 分析汽車過水平彎道或傾斜路面彎道時，靜摩擦力與正向力水平分量提供的向心力。
- code: T04
  name: 錐動擺與旋轉容器圓周運動
  desc: 對懸線錐動擺或旋轉斜面/圓錐面上的質點進行受力分析，求解角速度、週期或張力。
- code: T05
  name: 串聯多球圓周運動張力分析
  desc: 由外向內依序隔離各繞同圓心等角速度轉動的小球，求解各段繩張力與向心力比。
- code: T06
  name: 曲線軌跡曲率半徑與法線加速度
  desc: 利用曲率半徑定義式 R=v^2/a_N，計算拋物線或其他曲線軌跡特定位置的曲率半徑。
- code: T07
  name: 錐動擺受力分析求張力半徑與週期
  desc: 分解擺線張力為鉛直平衡重力與水平提供向心力，求解擺角、張力、切向速率與旋轉週期。
- code: T08
  name: 雙錐動擺物理量比例比較
  desc: 比較不同擺長或同擺角之兩錐動擺，列出半徑、繩張力、向心力與週期的比例關係。
- code: T09
  name: 彈簧連接物體作水平等速圓周運動
  desc: 結合虎克定律（彈力隨伸長量變化）與向心力公式，求解彈簧轉動時的伸長量、長度或週期。
- code: T10
  name: 同軸多球串聯圓周運動求各段張力
  desc: 對同角速度繞圓心旋轉的多段細繩與質點系統，由最外側向內側逐一列向心力方程式求張力。
- code: T11
  name: 圓弧軌道運動之合力與摩擦力分析
  desc: 分析物體沿鉛直圓弧軌道等速率或變速率滑動時，法線向心力與切線合力、摩擦力的方向與大小變化。
- code: T12
  name: 圓周運動基本量換算與平均加速度
  desc: 換算週期、頻率、角速度、切線速率與向心加速度，或利用速度向量差求一段圓弧的平均加速度。
- code: T13
  name: 地球自轉在不同緯度的向心加速度
  desc: 依緯度 θ 求圓周半徑 Rcosθ，計算地表物體隨地球自轉所需的向心加速度。
- code: T14
  name: 水平面連繩與旋轉盤摩擦力向心力
  desc: 由繩張力或最大靜摩擦力提供向心力，求解多球連繩張力比或轉盤不滑動最大轉速。
- code: T15
  name: 錐動擺半球碗與雙繩系統
  desc: 將繩張力或正向力正交分解，列鉛直力平衡與水平向心力方程求速率、角速度或張力。
- code: T16
  name: 單車轉彎傾角與防撞最小轉彎半徑
  desc: 利用力矩平衡或向心力公式求轉彎傾斜角 tanθ，或由巷寬限制求不撞牆最大車速。
- code: T17
  name: 向心力實驗圖形與變數分析
  desc: 依據 F=mv^2/r 分析向心力實驗中砝碼質量與繞轉速率平方的函數圖形斜率與線性關係。
- code: T18
  name: 懸吊滑輪系統與圓周運動動態結合
  desc: 利用圓周運動向心力改變繩張力，進而判斷跨過定滑輪另一端重物的升降加速度狀態。
