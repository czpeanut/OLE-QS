unit:
  subject: 物理
  code: PH-1-6-2
  title: 光的粒子性
status: draft
types:
- code: T01
  name: 光子能量與頻率波長比值計算
  desc: 運用 E=hf=hc/λ 計算不同波長或頻率光子的能量大小與比例關係。
- code: T02
  name: 光電子最大動能影響因素
  desc: 依據愛因斯坦光電方程式 K_max=hf-W，判斷影響光電子最大動能與光電流的因素。
- code: T03
  name: 光電效應實驗現象與靜電整合
  desc: 結合光電效應金屬球失電子帶正電的現象，推斷金屬球間的靜電吸引或排斥行為。
- code: T04
  name: 光量子能量與波長頻率比例計算
  desc: 運用光子能量與頻率成正比、與波長成反比的關係，計算不同色光的光子能量比值。
- code: T05
  name: 光電效應最大動能影響因素判別
  desc: 依據愛因斯坦光電方程式，區分入射光頻率（決定最大動能）與強度（決定光電流）的角色。
- code: T06
  name: 光電效應實驗現象與靜電結合
  desc: 判斷金屬球受不同頻率光照射發生光電效應後的帶電性質，並推論兩球間靜電力方向。
- code: T07
  name: 光子能量與頻率波長的比例計算
  desc: 利用 E=hf=hc/λ 計算單一光子能量或比較不同色光的能量比例。
- code: T08
  name: 光電效應現象定性判別與因果分析
  desc: 依愛因斯坦光子說解釋底限頻率、光電子最大動能與光強、金屬種類的關係。
- code: T09
  name: 光電方程式與功函數比較
  desc: 運用 hv > W 判別不同頻率單色光照射不同金屬板時能否產生光電流及動能大小。
- code: T10
  name: 光源功率與每秒光子數定量計算
  desc: 由光源總功率除以單一光子能量，計算每秒鐘發出的光子數或最大光電子數。
- code: T11
  name: 光子能量計算與光脈衝光子數求解
  desc: 利用單光子能量公式結合發射功率與脈衝時間計算單一光脈衝所含光子數。
- code: T12
  name: 光電效應實驗現象與底限頻率判別
  desc: 依據驗電器金屬箔片張開與否，比較入射光頻率、金屬功函數與電子移動方向。
- code: T13
  name: 光電方程式與光電子最大動能分析
  desc: 判斷入射光頻率、光強度與金屬種類對光電子最大動能及光電流的影響。
- code: T14
  name: 光子能量公式與光強光子數關係
  desc: 運用光子能量由頻率決定且同頻率光強對應光子數目的概念，判別光子速率與能量性質。
- code: T15
  name: 底限頻率門檻與光電子產生條件
  desc: 判斷入射光頻率須高於底限頻率或波長須短於底限波長才能產生光電子，與光強或照光時間無關。
- code: T16
  name: 光電效應科學史與元件應用
  desc: 辨識赫茲、雷納與愛因斯坦對光電效應的實驗與理論貢獻，以及太陽能電池與感光元件等應用。
