unit:
  subject: 物理
  code: PH-S4-3-1
  title: 法拉第定律
status: draft
types:
- code: T01
  name: 冷次定律判別應電流方向與阻力
  desc: 根據磁通量增減趨勢應用冷次定律判斷線圈應電流方向或磁鐵通過線圈的加速度變化。
- code: T02
  name: 磁通量微分求瞬時與平均電動勢
  desc: 對已知磁通量隨時間變化的函數或圖形取微分斜率與差值求瞬時及平均應電動勢。
- code: T03
  name: 直導線切割磁力線動生電動勢
  desc: 利用動生電動勢公式與磁力平衡判斷導線兩端電位高低、感應電場與迴路應電流。
- code: T04
  name: 矩形線圈進出有界磁場作圖與能量
  desc: 追蹤線圈進出均勻磁場各階段的磁通量、電動勢、外力關係圖及消耗熱能計算。
- code: T05
  name: 多種導線迴路變動磁通應電流判別
  desc: 針對長直導線或鄰近線圈電流變化及迴路平移逐一判斷是否產生感應電流與方向。
- code: T06
  name: 交流線圈正弦磁通圖形分析與轉換
  desc: 由正弦磁通量對時間關係圖讀取轉動頻率、最大切線斜率時刻及應電動勢極值。
- code: T07
  name: 磁通圖形平均電動勢與關係圖轉換
  desc: 由磁通量時間關係圖計算指定時距內的平均電動勢，或依負斜率轉換為電動勢關係圖。
- code: T08
  name: 時變磁場感應電流與多匝線圈
  desc: 已知磁場隨時間的變化率與線圈有效面積、匝數，求解多匝線圈應電動勢或感應電流。
- code: T09
  name: 同心圓迴路電阻與磁通電流比
  desc: 結合導線電阻與半徑正比關係及全區或局部磁場分布，求兩同心圓導線的感應電流比。
- code: T10
  name: 磁場反向磁通變化與迴路電位差
  desc: 計算磁場方向反轉時的總磁通變化量，或判別封閉感應迴路中兩段電阻的伏特計讀數和。
