unit:
  subject: 物理
  code: PH-S3-4-3
  title: 光的繞射
status: draft
types:
- code: T01
  name: 單狹縫繞射寬度與亮度分布特性
  desc: 辨識單狹縫繞射中央亮帶寬度為兩側亮紋兩倍且亮度向外迅速遞減的特性。
- code: T02
  name: 單狹縫繞射公式與亮暗紋位置判別
  desc: 運用單狹縫暗紋波程差或中央亮帶寬度公式，由屏距與亮帶寬度反推狹縫寬度或位置。
- code: T03
  name: 雙色光單狹縫繞射重合波長比
  desc: 依據兩單色光在單狹縫繞射中指定亮紋與暗紋位置重合的關係求兩光波長比。
- code: T04
  name: 單狹縫與單雙組合實驗測波長間距
  desc: 列出單狹縫測波長所需測量的物理量，或先由單狹縫測出未知波長再推算雙狹縫間距。
- code: T05
  name: 單狹縫旋轉傾斜後繞射圖樣變化
  desc: 計算單狹縫繞中垂線旋轉一定角度後有效狹縫寬度減小，導致中央亮紋寬度放大的倍數。
- code: T06
  name: 單狹縫半波帶法與光程差判別
  desc: 利用狹縫邊緣或中點至屏幕的光程差條件與繞射角正弦公式，判別亮暗紋階數或計算狹縫寬度。
- code: T07
  name: 移屏變距法單狹縫測縫寬
  desc: 在未知初始屏距下，利用前後移動屏幕所得中央亮帶寬度比例聯立消去屏距，求解單狹縫寬度。
- code: T08
  name: 介質折射率與變因對繞射影響
  desc: 分析將單狹縫裝置浸入液體或改變縫寬、波長、屏距、傾角時，暗紋階數與條紋寬度的縮放變化。
- code: T09
  name: 多狹縫平行光繞射最大亮度
  desc: 依據多狹縫平行繞射光束相鄰波程差為波長整數倍的建設性干涉條件，判別產生最大亮度的方向。
