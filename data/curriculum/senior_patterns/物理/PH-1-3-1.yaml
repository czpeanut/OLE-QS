unit:
  subject: 物理
  code: PH-1-3-1
  title: 物質的組成
status: draft
types:
- code: T01
  name: 物質三態微觀排列與運動
  desc: 依據分子間距、排列緊密程度與振動移動特性，判別固態、液態與氣態。
- code: T02
  name: 三態變化與溫度壓力條件
  desc: 判別物質發生熔化、汽化等相變時微觀分子間距、動能變化及調控變因。
- code: T03
  name: 原子分子尺度與奈米換算
  desc: 辨識原子、分子與次原子粒子的尺度級別，並比較微觀與生物結構尺寸。
- code: T04
  name: 晶體結構與平均原子數計算
  desc: 利用晶格幾何對稱性與頂點共用比例，計算單位晶胞或六邊形內的平均原子數。
- code: T05
  name: 宇宙物質組成與前沿粒子
  desc: 判讀科普文本中關於可見物質、暗物質與暗能量的比例及宇宙粒子總數概念。
- code: T06
  name: 物質三態的微觀結構特徵
  desc: 依據分子間排列緊密度、運動方式與作用力大小，區分固態、液態與氣態。
- code: T07
  name: 原子序質量數與次原子粒子計數
  desc: 由核種符號的原子序與質量數計算質子數、中子數與電子數，並判別同位素。
- code: T08
  name: 夸克組成模型與夸克數計算
  desc: 依據質子（uud）與中子（udd）的夸克組成及帶電量，計算原子核內的總夸克數與分布。
- code: T09
  name: 物質三態與微觀分子運動關聯
  desc: 依據溫度與分子間距、動能及束縛力關係判讀固液氣三態與相變加熱曲線。
- code: T10
  name: 夸克組成與核子電荷數推算
  desc: 利用上下夸克電量組合計算質子、中子或特定原子核與同位素所含的夸克數目。
- code: T11
  name: 物質可分性與基本粒子層次判別
  desc: 辨識原子、原子核、核子與電子、夸克等基本粒子的組成層級與不可分性。
- code: T12
  name: 奈米尺度與原子儲存科技應用
  desc: 結合原子操控與掃描探針顯微技術，判讀單原子尺度下的物理性質與應用。
- code: T13
  name: 同素異形體與微觀排列物性
  desc: 依據碳或原子間的微觀鍵結結構與排列方式，推論巨觀硬度、導電與力學性質差異。
- code: T14
  name: 布朗運動原理與分子熱運動證據
  desc: 解釋懸浮微粒受水分子不均勻撞擊產生的布朗運動，以及愛因斯坦證明原子分子存在的意義。
