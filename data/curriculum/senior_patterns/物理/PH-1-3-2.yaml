unit:
  subject: 物理
  code: PH-1-3-2
  title: 原子的結構
status: draft
types:
- code: T01
  name: 原子結構發現史與科學家
  desc: 判別電子、原子核、中子與夸克的發現先後順序及對應科學家的實驗方法。
- code: T02
  name: 拉塞福散射實驗與原子模型
  desc: 解釋α粒子大角度散射的成因，並判別拉塞福行星原子模型的特徵與限制。
- code: T03
  name: 原子序質量數與粒子數計算
  desc: 由元素符號或數據表計算質子數、中子數、電子數，並判別離子電量與奇偶性。
- code: T04
  name: 同位素定義與性質判別
  desc: 依據質子數相同、中子數不同的定義辨識同位素，並比較其化學與物理性質。
- code: T05
  name: 次原子粒子電荷質量與夸克
  desc: 比較電子、質子、中子的質量與電荷大小，並計算強子內上、下夸克的組成數。
- code: T06
  name: 核反應前後守恆物理量
  desc: 判別核反應（如α、β衰變）前後電荷總和與質量數總和必守恆的規律。
- code: T07
  name: 電子發現與陰極射線實驗
  desc: 判別陰極射線的本質為高速電子束，以及湯姆森測量電子荷質比的實驗意義。
- code: T08
  name: 拉塞福散射實驗與核模型
  desc: 分析α粒子撞擊金箔散射結果，推論原子核體積極小、帶正電且集中質量的特性。
- code: T09
  name: 核子數質子數與中子數計算
  desc: 由原子序與質量數計算原子或離子的質子數、中子數、核子數與電子數。
- code: T10
  name: 夸克模型與基本粒子組成
  desc: 依據標準模型區分基本粒子，並利用上下夸克電量推算質子與中子的夸克組成。
- code: T11
  name: 原子核穩定性與核力概念
  desc: 判別原子核內部結構特徵、同位素化學性質及核力（湯川秀樹）的作用概念。
- code: T12
  name: 原子模型演進史與科學家對應
  desc: 依湯姆森、拉塞福、查兌克等實驗發現的時間序與論點，配對各階段原子模型特徵。
- code: T13
  name: α粒子散射實驗現象與推論
  desc: 由極少數α粒子大角度反彈與多數直線穿過的實驗結果，推論原子核體積小、質量集中且帶正電。
- code: T14
  name: α粒子散射實驗的推論邊界判別
  desc: 區分α粒子散射實驗能證實的結構（核式模型、庫侖斥力）與無法證實的項目（如中子存在）。
- code: T15
  name: 拉塞福α粒子散射實驗判讀
  desc: 依據多數穿透與少數大角度偏折結果推論原子核體積微小且帶正電的特性。
- code: T16
  name: 次原子粒子發現順序與實驗配對
  desc: 排列電子、原子核、質子、中子與夸克的發現先後次序及對應實驗方法。
- code: T17
  name: 原子與原子核尺度比例估算
  desc: 利用原子直徑與原子核直徑約十萬倍的關係進行等比例放大後的尺度類比。
- code: T18
  name: 原子序、質量數與同位素組成判別
  desc: 依據原子序與質量數推算原子內質子、中子與電子數並辨識同位素。
