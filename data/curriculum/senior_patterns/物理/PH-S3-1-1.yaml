unit:
  subject: 物理
  code: PH-S3-1-1
  title: 波動的性質
status: draft
types:
- code: T01
  name: 波動傳遞能量且介質不隨波前進
  desc: 辨識波動傳遞擾動與能量時，介質僅在平衡位置附近振動而不隨波遷移的特性。
- code: T02
  name: 橫波與縱波振動方向及介質判別
  desc: 依據介質振動方向與波前進方向的垂直或平行關係區分橫波與縱波。
- code: T03
  name: 單一脈波介質質點振動方向判斷
  desc: 由脈波前進方向繪製下一瞬間波形，判斷繩上各質點的瞬時振動速度方向。
- code: T04
  name: 繩波波速公式與張力線密度關係
  desc: 運用繩波波速與張力平方根成正比、線密度平方根成反比進行波速計算。
- code: T05
  name: 機械波與非機械波特性比較
  desc: 比較需依賴介質傳播的機械波與可在真空中傳播的電磁波差異。
- code: T06
  name: 波速距離與多波到達時間差計算
  desc: 利用地震P波與S波等不同波速的傳播時間差或測站圖表，計算震央距離與預警應變時間。
- code: T07
  name: 由質點振動反推波向與後續位置
  desc: 由已知單一質點振動方向反推橫波傳播方向，並預測其他質點後續的位移與速度。
- code: T08
  name: 正弦波振動方向與簡諧極值判別
  desc: 同時判別向左或向右行進正弦波各點振動方向，及簡諧運動瞬時速率與加速度極值點。
- code: T09
  name: 脈衝波質點速度時間關係圖轉換
  desc: 依據脈衝波各段波形斜率與傳播方向，轉換繪製定點質點的振動速度對時間關係圖。
