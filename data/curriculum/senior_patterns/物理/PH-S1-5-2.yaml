unit:
  subject: 物理
  code: PH-S1-5-2
  title: 簡諧運動
status: draft
types:
- code: T01
  name: 簡諧運動回復力條件與平衡點求解
  desc: 將多力合成化簡為F=-k(x-x0)形式，找出合力為零的平衡點位置與系統未知物理量關係。
- code: T02
  name: 位置函數讀振幅角頻率與極值
  desc: 由簡諧運動位置函數x=Rcos(ωt)或x=Rsin(ωt)，讀取振幅與角頻率以求最大速率與最大加速度。
- code: T03
  name: SHM速率位移公式反推特徵量
  desc: 運用v=ω√(R^2-x^2)與a=-ω^2 x公式，由特定位移處的速率反推最大速率、最大加速度與週期。
- code: T04
  name: 參考圓投影法計算簡諧運動時距
  desc: 將簡諧運動兩端位移位置投影至等速圓周運動參考圓，利用圓心角比例計算最短或指定路徑時距。
- code: T05
  name: 彈簧簡諧振盪週期與頻率比例計算
  desc: 運用彈簧振盪週期公式T=2π√(m/k)（與振幅、重力無關），比較不同質量、振幅或重力場下之週期與頻率。
- code: T06
  name: 簡諧運動位置、速度與加速度關係
  desc: 運用參考圓投影或運動關係判別平衡點與端點的速度、加速度極值及位置速率關係。
- code: T07
  name: 簡諧三角函數式與時間求解
  desc: 從 x(t)=Rcos(ωt+φ) 讀取振幅、角頻率與初相，計算特定時刻速度或到達某位置最短時間。
- code: T08
  name: 簡諧x-t圖週期與極值時刻
  desc: 由 x-t 波浪圖形讀出振幅與週期，並反推通過平衡點或速度達極大值的通式時刻。
- code: T09
  name: 彈簧振子疊放不滑動條件
  desc: 計算彈簧系統週期，並利用端點最大加速度與靜摩擦力極限求系統不滑動的最大振幅或速率。
- code: T10
  name: 單擺週期公式與實驗圖形
  desc: 應用單擺週期公式結合 x-t 圖求擺長，或分析改變擺長與加速電梯對實驗誤差與T^2-L圖的影響。
