unit:
  subject: 物理
  code: PH-S2-4-1
  title: 理想氣體狀態方程式
status: draft
types:
- code: T01
  name: 封閉玻璃管水銀柱氣柱平衡
  desc: 結合水銀柱靜力平衡壓力關係與理想氣體方程式，判斷升溫或倒置後的氣柱長度變化。
- code: T02
  name: 熱氣球浮力與氣體密度溫度關係
  desc: 利用熱氣球內外氣壓相同時密度與絕對溫度成反比，求解升空所需加熱溫度與載重。
- code: T03
  name: 單一氣室狀態變化與波以耳查理定
  desc: 利用PV/T=nR計算固定莫耳數理想氣體在壓力、體積、溫度改變後的未知狀態量。
- code: T04
  name: 氣體洩漏或充氣之莫耳數變化計算
  desc: 結合PV=nRT計算容器洩氣、充氣或氣泡膨脹前後的氣體莫耳數或質量變化。
- code: T05
  name: 雙室連通與活動隔板平衡計算
  desc: 聯立總莫耳數守恆、力平衡（壓強相等）與熱平衡，求解隔板移動後的體積、壓力或溫度。
- code: T06
  name: P-V與V-T狀態函數圖形判讀
  desc: 依據理想氣體狀態方程式斜率或雙曲線特性，判別圖形上的等溫線、等壓線及氣體狀態比較。
- code: T07
  name: 熱氣球浮力與氣體密度溫度換算
  desc: 結合阿基米德空氣浮力平衡與理想氣體密度公式，求解氣球升空所需內部溫度。
- code: T08
  name: 理想氣體基本性質與微觀模型
  desc: 判別理想氣體的微觀假設（無分子間作用力、分子體積可忽略等）及真實氣體接近理想氣體的條件。
- code: T09
  name: 波以耳與查理定律等溫等壓計算
  desc: 應用PV=定值或V/T=定值求解水銀柱、U型管或氣泡在定溫定壓下的體積與壓力變化。
- code: T10
  name: 氣體狀態圖形判讀與轉換
  desc: 由理想氣體P-V、P-T或V-T圖形的斜率或曲線位置比較溫度、體積、莫耳數或分子平均動能大小。
- code: T11
  name: 可移動隔板與連通容器平衡
  desc: 聯立力平衡（壓力相等）與理想氣體方程式，求解隔板移動後的體積、壓力或莫耳數比。
- code: T12
  name: 理想氣體狀態方程式單室變化
  desc: 利用壓力、體積與絕對溫度乘積比值守恆求解密閉容器狀態變化後的物理量。
- code: T13
  name: 雙室連通與熱平衡氣體混合
  desc: 計算導熱隔板兩室或細管連通氣室達成熱平衡後的壓力、體積或莫耳數比。
- code: T14
  name: 理想氣體分子數與莫耳數計算
  desc: 應用理想氣體狀態方程式與波茲曼常數，由壓力、體積及溫度推算氣體分子數。
- code: T15
  name: 自由滑動活塞兩室力平衡問題
  desc: 聯立可滑動活塞兩室壓力相等與總體積不變條件，求解升溫後的體積變化量。
