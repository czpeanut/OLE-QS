unit:
  subject: 物理
  code: PH-S2-1-1
  title: 動量與衝量
status: draft
types:
- code: T01
  name: 動量定義與動量變化量計算
  desc: 依 p=mv 計算物體動量，並考慮方向正負或向量夾角計算反彈前後的動量變化量。
- code: T02
  name: 衝量定理與平均作用力計算
  desc: 運用 J=F_avg·Δt=Δp 由質量、初末速度與作用時間計算碰撞或滑行過程的平均作用力。
- code: T03
  name: 衝量與動量圖形判讀計算
  desc: 利用 F-t 圖面積求衝量、p-t 圖斜率求受力，或由 v-t 圖計算動量變化與平均力。
- code: T04
  name: 變力作用積分求衝量與末速
  desc: 對隨時間變化的函數力 F(t) 進行積分（或幾何求面積），計算總衝量與物體末速度。
- code: T05
  name: 連續質點流撞擊衝力計算
  desc: 計算機槍子彈、水流或氣流等連續質點撞擊平面時的單位時間動量變化率（平均衝力）。
- code: T06
  name: 衝量定值與緩衝時間生活應用
  desc: 應用動量變化固定時延長接觸時間可減小衝擊力的原理，解釋安全氣囊或曲膝緩衝。
- code: T07
  name: 衝量與平均衝擊力的生活緩衝應用
  desc: 運用J=F_avg·Δt=Δp原理，解釋安全氣囊、安全帶、屈膝落地等延長作用時間以減小衝擊力的現象。
- code: T08
  name: 衝量動量定理求平均力與時間
  desc: 已知物體質量、碰撞前後向量速度與接觸時間（或均勻變力平均力），求平均作用力或作用時間。
- code: T09
  name: F-t與a-t圖面積求衝量末速
  desc: 計算F-t圖面積求總衝量（或a-t圖面積乘質量），再結合初速求末速度、速度比或末動能。
- code: T10
  name: 變力F(t)求指定時距內衝量
  desc: 針對隨時間線性或函數變化的外力F(t)，利用圖形面積或積分計算t秒內物體所受總衝量。
- code: T11
  name: 落體反跳衝量與地面平均力
  desc: 先由自由落體與反跳高度求撞擊前後速率，再由動量變化與接觸時間計算合力或地面正向力。
- code: T12
  name: 動量與定力衝量的向量計算
  desc: 依據定義 p=mv 與 J=FΔt 計算物體的動量、衝量及作用後的末速度方向。
- code: T13
  name: F-t圖面積求衝量與末速
  desc: 利用 F-t 圖線下面積求出總衝量，再由動量變化 Δp=mv-mv0 計算物體的末速度。
- code: T14
  name: 時變力與簡諧運動衝量計算
  desc: 對 F(t) 函數作圖求面積或積分求衝量，或由簡諧運動位置與速度變化反求所受衝量。
- code: T15
  name: 連續微粒撞擊平面產生的平均衝力
  desc: 計算單顆粒子正向動量變化量乘以單位時間撞擊次數，求平面所受平均作用力。
- code: T16
  name: 落體著地平均衝力與緩衝
  desc: 結合動量變化與重力衝量，計算落地過程的平均正向力或比較不同接觸面緩衝時間的影響。
- code: T17
  name: 動量與衝量定義及方向性判別
  desc: 辨識動量變化方向與外力合力、加速度及速度變化方向的一致性。
- code: T18
  name: 衝量與緩衝延長接觸時間應用
  desc: 在固定動量變化下，說明延長接觸時間如何減小平均衝力以保護物體。
- code: T19
  name: 自由落體反彈與碰撞平均受力計算
  desc: 計算物體落地反彈前後的速度與動量變化，並由接觸時間求所受平均合力。
- code: T20
  name: F-t圖下面積求衝量與動量變化
  desc: 判讀作用力對時間關係圖的曲線下面積，對應物體在碰撞期間的動量變化量。
