unit:
  subject: 物理
  code: PH-S4-2-1
  title: 電流與磁場
status: draft
types:
- code: T01
  name: 電流定義與帶電粒子旋轉等效電流
  desc: 運用 I=ΔQ/Δt 計算導體截面通過電量，或求點電荷與帶電圓環繞軸旋轉形成的等效電流。
- code: T02
  name: 載流導線電位高低與電荷流動方向
  desc: 區分傳統電流（高電位流向低電位）與自由電子流向，並判別金屬導線內部電場方向。
- code: T03
  name: 磁場單位與基本性質判別
  desc: 辨識磁場的SI單位換算、物理定義及磁場作為向量場的基本特性。
- code: T04
  name: 磁力線分布與方向疏密判讀
  desc: 依據磁力線的封閉性、不相交性、切線方向及疏密程度判斷磁場強弱與方向。
- code: T05
  name: 長直載流導線磁針偏轉方向
  desc: 應用安培右手定則判斷通電長直導線周圍磁場方向及磁針偏轉方位或電流流向。
- code: T06
  name: 載流導線磁場與地磁向量疊加
  desc: 利用磁針偏轉角正切值與地磁水平分量比值關係求解導線電流或移動距離。
