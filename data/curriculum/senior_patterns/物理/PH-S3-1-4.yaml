unit:
  subject: 物理
  code: PH-S3-1-4
  title: 波的疊加原理與駐波
status: draft
types:
- code: T01
  name: 兩脈動交會疊加與不動點判別
  desc: 應用波的疊加原理判斷兩相向行進脈衝交會時始終保持位移為零的點。
- code: T02
  name: 雙向行進波合成駐波波形演變
  desc: 追蹤兩反向行進週期波在不同時刻的疊加結果以判斷特定時刻的駐波波形。
- code: T03
  name: 駐波性質與波腹波節特徵判別
  desc: 辨析駐波上相鄰節點與腹點的振幅、振動頻率、相位及能量傳遞特性。
- code: T04
  name: 兩端固定或一固定一自由駐波
  desc: 依邊界條件列舉駐波允許波長或計算改變節點數時頻率的倍數變化。
- code: T05
  name: 弦線張力線密度與泛音頻率計算
  desc: 結合繩波波速公式與邊界駐波條件求解弦振動的基音或各階泛音頻率與線密度比。
- code: T06
  name: 反相波破壞性干涉與主動降噪
  desc: 應用建設性與破壞性干涉原理說明抗噪耳機產生反相音波抵銷噪音的機制。
- code: T07
  name: 兩反向脈波重疊合成波形與速度
  desc: 運用波的疊加原理求兩反向行進波在指定時刻的重疊位移或時段內平均振動速度。
- code: T08
  name: 兩端固定弦駐波節腹點數與波長
  desc: 依據兩端固定弦的長度與駐波腹點或節點數計算駐波波長。
- code: T09
  name: 駐波各時刻波形與相鄰波節性質
  desc: 追蹤兩反向行進波經過特定週期倍數後的疊加結果並繪製或選出瞬間駐波波形。
- code: T10
  name: 弦線張力線密度與基音諧音頻率
  desc: 結合繩波波速公式與兩端固定駐波諧音條件計算振動頻率、張力或弦長比。
- code: T11
  name: 多段不同線密度串接繩索駐波分析
  desc: 在張力與頻率相同的多段串接繩索中，由各段腹點數與長度比推算波速與線密度比。
