unit:
  subject: 物理
  code: PH-1-6-1
  title: 量子論的誕生
status: draft
types:
- code: T01
  name: 普朗克能量量子化條件判別
  desc: 依據普朗克量子論 E=nhf，判別振盪系統吸收或釋放能量的可能量子化數值。
- code: T02
  name: 普朗克常數單位與數值意義
  desc: 推導或辨識普朗克常數 h 的物理單位（J·s）及其在量子物理中的基本意義。
- code: T03
  name: 普朗克能量量子化整數倍判別
  desc: 依據黑體輻射量子論中振盪子能量為hf的整數倍，判別可能或不可能吸收釋放的能量值。
- code: T04
  name: 普朗克常數物理意義與單位推導
  desc: 由光子能量公式E=hf推導普朗克常數h的因次與單位（J·s），並理解其量子尺度意義。
- code: T05
  name: 普朗克能量量子化與能階不連續性
  desc: 依據普朗克能量量子化假設，判斷系統能階固定且能量交換為不連續的意義。
- code: T06
  name: 黑體輻射現象與強度波長圖判讀
  desc: 依據黑體輻射光譜分布曲線判讀溫度對峰值波長與輻射強度的影響，及量子論提出背景。
- code: T07
  name: 黑體輻射定義與紫外災變判別
  desc: 辨析理想黑體完全吸收特性、光譜與材料無關性，以及古典理論在短波長發散的紫外災變意義。
- code: T08
  name: 能量量子化不連續與尺度比較
  desc: 比較普朗克能量不連續假設與古典連續能量觀點，並判別微觀量子效應與巨觀尺度的差異。
