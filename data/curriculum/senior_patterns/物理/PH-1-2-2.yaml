unit:
  subject: 物理
  code: PH-1-2-2
  title: 牛頓三大運動定律
status: draft
types:
- code: T01
  name: 慣性概念與第一運動定律
  desc: 利用慣性解釋物體維持靜止或等速直線運動的現象，並判別伽利略運動觀。
- code: T02
  name: 雙斜面實驗與理想運動推論
  desc: 運用伽利略光滑雙斜面思想實驗分析高度、長度與慣性運動的關係。
- code: T03
  name: 合力與加速度方向關係判別
  desc: 依據牛頓第二定律判斷受力方向與加速度方向一致，及變力下速度增減趨勢。
- code: T04
  name: 牛頓第二定律與平均施力
  desc: 由質量、速度變化量與作用時間計算平均加速度與平均作用力或折返時間。
- code: T05
  name: 系統互推與連接體比例求解
  desc: 利用兩物體受相同作用力或彈簧推開時的加速度與質量反比關係求解質量。
- code: T06
  name: 牛頓實驗圖形與質量比較
  desc: 由F-a或a-F實驗關係圖的斜率判斷物體質量或慣性大小關係。
- code: T07
  name: 作用力與反作用力性質判別
  desc: 辨識作用力與反作用力大小相等、方向相反、作用於不同物體的同時性。
- code: T08
  name: 慣性現象與第一運動定律
  desc: 利用慣性概念解釋物體維持靜止或等速直線運動的現象與假想力效應。
- code: T09
  name: 牛頓第二定律受力與加速度
  desc: 繪製受力圖計算淨力，並應用 F=ma 求解單一物體的加速度或未知外力。
- code: T10
  name: 作用力與反作用力配對
  desc: 依據牛頓第三定律，辨識施力體與受力體互換的作用力與反作用力配對。
- code: T11
  name: 碰撞過程受力與加速度比較
  desc: 結合牛頓第三與第二定律，比較質量不同兩物體相撞時的受力與加速度量值。
- code: T12
  name: 向量速度變化與牛頓第二定律
  desc: 考慮運動方向的正負號求向量速度變化，再結合作用時間與質量計算平均加速度與平均受力。
- code: T13
  name: 連結體受力分析與加速度比較
  desc: 比較直接施力與懸掛重物拉動木塊的系統總質量差異，運用牛頓第二定律比較加速度大小。
- code: T14
  name: 阻力隨速率變化與終端速度圖
  desc: 分析落體受空氣阻力隨速率增大的合力變化，判別加速度遞減趨近終端速度的v-t圖形。
- code: T15
  name: 作用力與反作用力配對辨識
  desc: 區分平衡力與作用力、反作用力，判別受力體與施力體的對應關係。
- code: T16
  name: 質量與重量的概念區分與換算
  desc: 區分物體固有質量與受重力場影響的重量，換算不同星球上的重量與質量。
- code: T17
  name: 作用力與反作用力及平衡力區辨
  desc: 區分同一物體上的平衡力與兩物體間同時產生、量值相等的反作用力。
