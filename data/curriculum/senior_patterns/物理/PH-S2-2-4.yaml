unit:
  subject: 物理
  code: PH-S2-2-4
  title: 力學能守恆：彈力位能
status: draft
types:
- code: T01
  name: 彈力位能公式與比例計算
  desc: 利用彈力位能與形變量平方成正比的性質進行形變改變後的位能計算。
- code: T02
  name: 簡諧運動能量轉換與圖形判讀
  desc: 分析彈簧簡諧運動中動能與彈力位能隨位置或時間變化的函數圖形與數值。
- code: T03
  name: 鉛直彈簧與自由落體能量守恆
  desc: 結合重力位能與彈力位能守恆求解物體落至彈簧的最大壓縮量及特定位置速率。
- code: T04
  name: 彈射裝置能量轉換定性與定量
  desc: 分析彈力位能、動能與重力位能間的依序轉換並結合拋體運動反推彈力常數。
- code: T05
  name: 彈性係數調整與實驗設計應用
  desc: 依據虎克定律與彈力位能關係判斷改變彈簧串並聯或形變量對彈射效果的影響。
- code: T06
  name: 含摩擦力彈簧壓縮與力學能損耗
  desc: 分析木塊在粗糙平面撞擊彈簧再彈回過程中，摩擦力作功對最大壓縮量與系統總力學能的影響。
- code: T07
  name: 簡諧運動特定位置能量比例
  desc: 利用彈力位能與位移平方成正比及總力學能守恆，計算特定位移處動能與彈力位能占總能比例。
- code: T08
  name: 簡諧運動能量守恆求速率比
  desc: 聯立動能與彈力位能總和為定值，由特定位移或能量倍數關係推算瞬時速率與最大速率的比值。
- code: T09
  name: 非平衡外力作功與撞擊壓縮
  desc: 計算水平外力對彈簧系統作功造成的力學能變化，或木塊單次撞擊彈簧的動能與壓縮量換算。
