unit:
  subject: 物理
  code: PH-S3-1-2
  title: 週期波
status: draft
types:
- code: T01
  name: 波形圖判讀波長振幅與波速
  desc: 由週期波空間波形圖讀出波長與振幅並結合振動頻率計算波速與傳播時間。
- code: T02
  name: 介質張力變化對繩波速影響
  desc: 利用繩波波速與張力平方根成正比分析鉛直懸繩不同高度處的波速與波長變化。
- code: T03
  name: 週期波波長、振幅、頻率與波速
  desc: 由波形圖與質點振盪次數讀取振幅與波長，並運用波速等於波長乘頻率求解。
- code: T04
  name: 由y-x波形圖推導質點y-t圖
  desc: 根據週期波傳播方向與某時刻波形圖，判斷指定位置質點的位移隨時間變化圖形。
- code: T05
  name: 兩時刻波形圖求波速與週期多解
  desc: 由實線與虛線波形移動距離加上週期範圍限制，推算唯一可能的週期與波速。
