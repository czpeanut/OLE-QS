unit:
  subject: 物理
  code: PH-S4-3-3
  title: 電磁波
status: draft
types:
- code: T01
  name: 電磁波傳播與電磁場方向右手定則
  desc: 利用電場、磁場與波速兩兩垂直的右手定則由兩者方向推求第三者方向。
- code: T02
  name: 環形接收天線與電磁波最佳擺放
  desc: 依據電場驅動電子運動或磁通量變化最大化原則判斷接收天線軸線的最佳方位。
- code: T03
  name: 電磁波譜頻率波長與應用區分
  desc: 比較無線電波、微波、可見光、X射線與伽馬射線的波長頻率範圍及生活應用。
- code: T04
  name: 電磁波強度振幅關係與能量傳遞
  desc: 計算真空中電磁波電場與磁場振幅比例關係及輻射強度與距離關係。
- code: T05
  name: 麥克斯韋電磁理論概念判別
  desc: 辨析變化電場產生磁場與變化磁場產生電場並以光速傳播的核心物理概念。
- code: T06
  name: 加速電荷與電磁波輻射條件
  desc: 判別振盪、減速或圓周運動等加速電荷與交流電可輻射電磁波，等速電荷與穩定直流電則無法產生。
- code: T07
  name: 電磁波發展科學史貢獻辨析
  desc: 區分馬克士威預測光是電磁波、赫茲實驗證實電磁波存在，以及法拉第等電磁學先驅的歷史貢獻。
