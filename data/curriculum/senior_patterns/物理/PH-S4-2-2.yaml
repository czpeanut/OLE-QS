unit:
  subject: 物理
  code: PH-S4-2-2
  title: 載流導線產生的磁場
status: draft
types:
- code: T01
  name: 長直載流導線磁場與帶電粒子偏折
  desc: 結合安培右手定則與勞侖茲力開掌定則由粒子偏折軌跡反推導線電流方向或電性。
- code: T02
  name: 多根長直導線合磁場方向與量值
  desc: 利用必歐－沙伐定律與向量合成計算多根平行或垂直長直導線在空間某點的合磁場。
- code: T03
  name: 圓形線圈與圓弧電流中心磁場
  desc: 計算載流圓弧與直線段組合導線在圓心處產生的合磁場大小與方向。
- code: T04
  name: 理想長直螺線管內部磁場計算
  desc: 應用螺線管內部均勻磁場公式計算單位長度匝數或電流變化後的磁場強度。
- code: T05
  name: 平行載流導線間磁力與零磁場點
  desc: 分析兩平行載流導線電流方向與間距求解空間磁場為零處及單位長度受力。
- code: T06
  name: 單一長直載流導線磁場計算
  desc: 應用安培定律或長直導線磁場公式計算距離導線特定垂直距離處的磁場量值與倍數比較。
- code: T07
  name: 必歐－沙伐定律電流元磁場比較
  desc: 依據必歐－沙伐定律與距離平方及夾角正弦關係，比較微小電流元在空間各點產生的磁場大小。
- code: T08
  name: 必歐沙伐定律電流元磁場計算
  desc: 運用必歐沙伐定律與距離平方反比及正弦角度關係比較微電流元在各點產生的磁場。
