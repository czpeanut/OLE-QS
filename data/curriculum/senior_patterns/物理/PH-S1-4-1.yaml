unit:
  subject: 物理
  code: PH-S1-4-1
  title: 力的合成與分解
status: draft
types:
- code: T01
  name: 兩共點力的平行四邊形與餘弦合成
  desc: 利用兩力夾角與餘弦定理或正交分量法計算兩共點力的合力大小與方向。
- code: T02
  name: 多個共點力的正交分解合成法
  desc: 建立直角坐標系將各力分解為水平與鉛直分量後代數相加求總合力。
- code: T03
  name: 斜面與特定方向的力的分解計算
  desc: 將重力或外力沿平行斜面與垂直斜面等指定方向分解求分力大小。
- code: T04
  name: 兩力合力的最大與最小值範圍判別
  desc: 依據兩分力夾角變化在零度至一百八十度間求合力可能的最大值與最小值範圍。
- code: T05
  name: 幾何圖示法與力多邊形閉合求解
  desc: 利用力的向量頭尾相接幾何性質或特殊三角形比例求未知分力或合力。
