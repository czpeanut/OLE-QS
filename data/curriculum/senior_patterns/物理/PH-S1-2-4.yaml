unit:
  subject: 物理
  code: PH-S1-2-4
  title: 相對運動
status: draft
types:
- code: T01
  name: 同一直線兩落體或拋體相對運動
  desc: 利用兩物體受相同重力加速度時相對加速度為零的特性，判斷相對等速運動或位移。
- code: T02
  name: 加速參考系等效重力加速度
  desc: 在加速升降梯等非慣性系中計算物體相對於系統的相對加速度與落地時間。
- code: T03
  name: 等速車廂內拋體運動的參考系轉換
  desc: 結合車速與相對初速進行向量合成，比較車內外觀察者所見拋體位移與仰角。
- code: T04
  name: 兩車追及與防撞最小減速度
  desc: 以相對速度與相對加速度分析兩車不相撞的臨界條件或追及時間。
- code: T05
  name: 等加速車廂或電梯內落體
  desc: 以非慣性參考系或相對加速度分析加速升降機內物體掉落所需的時間。
- code: T06
  name: 運動載具拋出物體的相對運動
  desc: 分析從等速或加速上升載具釋放的物體相對於載具之速度、距離與落地時間。
- code: T07
  name: 同地異向拋體相對運動分析
  desc: 利用兩拋體加速度相同導致相對加速度為零的特性求相對位移與速度。
- code: T08
  name: 相對運動函數圖形判讀
  desc: 由兩物體的v-t或x-t圖形相減轉換為相對速度對時間關係圖，判斷相對位置與追及趨勢。
