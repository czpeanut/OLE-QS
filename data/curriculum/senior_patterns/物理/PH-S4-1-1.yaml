unit:
  subject: 物理
  code: PH-S4-1-1
  title: 電荷與庫侖定律
status: draft
types:
- code: T01
  name: 三點電荷共線靜電力平衡位置
  desc: 利用庫侖定律列式求解第三個點電荷在兩已知電荷連線上所受淨力為零的位置。
- code: T02
  name: 相同導體球接觸後電荷重分配
  desc: 根據相同半徑導體球接觸後電荷均分原則計算放回原處後的靜電力比例變化。
- code: T03
  name: 共線多點電荷靜電力合力計算比較
  desc: 運用庫侖定律逐一計算共線點電荷間的吸引或排斥力並進行向量疊加比較合力大小。
- code: T04
  name: 二維幾何點電荷靜電力向量合成
  desc: 在正三角形等平面幾何頂點上，計算兩靜電力的向量夾角並合成總靜電力量值。
- code: T05
  name: 平面多點電荷庫侖力向量合成
  desc: 運用向量合成與對稱性計算三角形或正方形頂點電荷所受之靜電合力。
- code: T06
  name: 雙帶電小球懸吊靜力平衡求電量
  desc: 利用三力平衡三角幾何關係計算兩帶電懸吊小球間的靜電力，進而求解小球所帶電量。
- code: T07
  name: 庫侖力提供向心力圓周運動
  desc: 令靜電力等於向心力求解電子繞原子核或雙帶電粒子作等速圓周運動的週期與速率。
- code: T08
  name: 電荷基本性質、量子化與起電方式
  desc: 辨識電荷單位、基本電荷量子化整數倍判別，以及摩擦起電與導體絕緣體的帶電特性。
- code: T09
  name: 庫侖定律距離與電量比例計算
  desc: 應用庫侖定律 F=kq1q2/r^2 計算兩點電荷電量或距離改變後的靜電力比例變化。
