unit:
  subject: 物理
  code: PH-S3-4-1
  title: 光的波動說
status: draft
types:
- code: T01
  name: 微粒說與波動說解釋光學現象比較
  desc: 區分直進、反射、折射等兩種學說皆可解釋的現象與僅波動說能解釋的干涉現象。
- code: T02
  name: 惠更斯原理與折射定律波動說推導
  desc: 運用惠更斯子波波前作圖說明波的傳播與光在不同介質中因波速改變造成的折射。
- code: T03
  name: 佛科水中測光速與微粒波動說判決
  desc: 說明光在水中速率小於空氣中的實驗結果如何推翻牛頓微粒說並支持波動說。
- code: T04
  name: 光速測定歷史實驗與方法
  desc: 認識伽利略、羅默木星衛星蝕及斐索旋轉齒輪法測定光速的原理與演進。
- code: T05
  name: 同調光與非同調光波前特性
  desc: 說明產生穩定光學干涉條紋所需具備的單頻與固定相位差同調光源條件。
- code: T06
  name: 微粒與波動說介質光速預測比較
  desc: 比較微粒說與波動說對司乃耳折射定律的解釋，以及兩學說對光在真空與介質中速率大小的相反預測。
- code: T07
  name: 光與電磁波理論科學史演進
  desc: 辨析牛頓、惠更斯、馬克士威、赫茲與愛因斯坦在光微粒說、波動說、電磁波理論與光子論的貢獻。
