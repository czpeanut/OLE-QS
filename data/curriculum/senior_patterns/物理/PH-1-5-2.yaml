unit:
  subject: 物理
  code: PH-1-5-2
  title: 微觀尺度下的能量
status: draft
types:
- code: T01
  name: 理想氣體分子平均動能與絕對溫度
  desc: 判別理想氣體分子平均動能與絕對溫度成正比，而與氣體種類無關的特性。
- code: T02
  name: 溫標換算與絕對零度物理意義
  desc: 進行攝氏與克氏絕對溫標換算，並判斷物質吸收熱能與溫度變化的關係。
- code: T03
  name: 理想氣體分子平均動能與溫度關係
  desc: 依據溫度決定理想氣體分子平均動能與分子運動特性，判斷壓力與總動能變化。
- code: T04
  name: 氣體內能與溫度、分子數的關係
  desc: 比較不同溫度、莫耳數或體積下單原子理想氣體總內能的大小變化。
- code: T05
  name: 熱平衡與微觀粒子能量傳遞機制
  desc: 從微觀分子碰撞角度解釋兩物體接觸後達到相同溫度的熱平衡過程。
