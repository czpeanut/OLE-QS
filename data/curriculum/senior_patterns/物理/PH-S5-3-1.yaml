unit:
  subject: 物理
  code: PH-S5-3-1
  title: 拉塞福原子模型
status: draft
types:
- code: T01
  name: 原子模型演進史與科學家對應
  desc: 依歷史演進配對布朗、湯姆森、拉塞福、波耳與量子力學時期科學家的原子模型與實驗貢獻。
- code: T02
  name: 正向碰撞最近距離與能量守恆
  desc: 利用入射粒子動能完全轉化為庫侖靜電位能的條件，計算α粒子或氘核與靶核的最近距離比。
- code: T03
  name: 拉塞福模型與古典電磁學矛盾
  desc: 辨識行星軌道模型中加速電子輻射電磁波導致原子崩潰及無法解釋明線光譜的理論困難。
- code: T04
  name: α粒子散射軌跡與受力判讀
  desc: 依據庫侖排斥力方向與力學性質判斷α粒子經過原子核附近的合理散射軌跡。
- code: T05
  name: α粒子散射實驗結果與核模型
  desc: 依據金箔散射實驗大多穿透與少數大角度反彈現象，推論原子核體積極小、帶正電且質量集中。
