unit:
  subject: 物理
  code: PH-1-1-2
  title: 科學方法
status: draft
types:
- code: T01
  name: 科學方法步驟判別
  desc: 依據觀察、提問、假設、實驗與結論的定義，判斷情境所屬的科學方法階段。
- code: T02
  name: 實驗變因與對照組設計
  desc: 區分操縱變因、控制變因與應變變因，並檢驗實驗設計是否符合單一變因原則。
- code: T03
  name: 科學假說與定律理論區分
  desc: 判別假說、經驗定律與科學理論的意涵、可否證性及適用範圍。
- code: T04
  name: 實驗數據圖表判讀與推論
  desc: 由實驗數據表或關係圖分析物理量變化趨勢，並歸納合理的科學推論。
- code: T05
  name: 模型建構與理想化簡化
  desc: 判別物理研究中使用理想模型（如質點、無摩擦）的目的與限制條件。
- code: T06
  name: 歸納法與演繹法科學推理判別
  desc: 區分從實驗觀測資料歸納規律的歸納法，與由基本定律推導預測結果的演繹法。
