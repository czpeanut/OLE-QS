unit:
  subject: 物理
  code: PH-S1-2-3
  title: 等加速運動
status: draft
types:
- code: T01
  name: 等加速公式計算與平均速率
  desc: 靈活運用三大運動學公式與平均速度性質求解時間、位移、加速度與折返平均速率。
- code: T02
  name: 分段等加速運動與平均速度比例
  desc: 處理靜止加速、等速再減速至停的多段直線運動，求最大速度與平均速度比或最低時間。
- code: T03
  name: 自由落體與鉛直上拋對稱性應用
  desc: 利用上拋運動的時間對稱性與速度對稱性求解經過同一高度的時間與初速。
- code: T04
  name: 觸地反彈期間的平均加速度計算
  desc: 先由自由落下與反彈高度求接觸前後瞬時速度，再依向量變化求觸地平均加速度。
- code: T05
  name: 雙車追趕與不相撞臨界條件求解
  desc: 建立兩車位移差或相對運動方程，利用速度相等時距離不小於零求最小加速度。
- code: T06
  name: 雙質點斜面或鉛直相遇條件
  desc: 列出沿斜面或鉛直方向兩物體的位置時間方程式，求解相遇臨界初速或時間。
- code: T07
  name: 光滑斜面下滑最速降線極值問題
  desc: 寫出固定底邊或高度的斜面下滑時間對斜角函數，求下滑時間最短的斜角。
- code: T08
  name: 打點計時器紙帶求加速度
  desc: 利用相鄰等時距點距差 Δx=aT^2 或間隔推算法計算實驗加速度值。
- code: T09
  name: 等加速運動基本概念判別
  desc: 辨析等加速運動中速度、加速度、位移與路徑長的方向與定義關係。
- code: T10
  name: 等加速運動公式聯立求解
  desc: 運用等加速運動三大公式與平均速度公式求解位移、時間、速度或加速度。
- code: T11
  name: 連續等時距或等距離比例律
  desc: 利用初速為零之等加速比例性質求解通過連續等距離的時間差或速度比。
- code: T12
  name: 自由落體與分段距離計算
  desc: 分析靜止釋放物體在重力場中通過特定區間的時間與高度關係。
- code: T13
  name: 鉛直上拋對稱性與兩次通過
  desc: 利用鉛直上拋上升與下降的時間與速率對稱性求解最大高度或通過某高處時刻。
- code: T14
  name: 打點計時器紙帶數據分析
  desc: 由打點紙帶相鄰點距差求等加速度及某點瞬時速率或未知點距。
- code: T15
  name: 反應距離與煞車距離估算
  desc: 結合反應時間內等速位移與煞車階段等減速位移計算安全煞停距離。
