unit:
  subject: 物理
  code: PH-1-5-3
  title: 能量守恆
status: draft
types:
- code: T01
  name: 熱能與機械能跨形式換算
  desc: 將消耗的熱量（大卡/焦耳）換算為重力位能或機械功，求解高度、層數或速度。
- code: T02
  name: 熱功當量與比熱升溫計算
  desc: 利用能量轉換關係將機械功或核能換算為熱能，再配合比熱公式計算水的溫度變化。
- code: T03
  name: 位能增加與生物熱量消耗換算
  desc: 將爬樓梯等重力位能的增加量與人體消耗的生物熱量（大卡）進行單位換算與次數估計。
- code: T04
  name: 無阻力下的力學能守恆計算與判讀
  desc: 在僅受重力或彈力作用下，利用動能與位能總和定值求高度、速率或變化趨勢。
- code: T05
  name: 非保守力作功與力學能不守恆判別
  desc: 判別摩擦力或空氣阻力作負功時動能、位能的增減及總力學能的損失量。
- code: T06
  name: 熱功當量與太陽輻射能量轉換計算
  desc: 結合焦耳熱功當量與卡路里計算熱能與機械能或太陽輻射功率的轉換關係。
- code: T07
  name: 含摩擦力或非保守力之總能量守恆
  desc: 分析碰撞或摩擦過程中動能轉化為重力位能與熱能的總能量守恆關係。
- code: T08
  name: 熱力學第二定律與能源危機本質
  desc: 說明總能量雖守恆但轉換過程會產生不可回收廢熱，導致可用能源減少。
