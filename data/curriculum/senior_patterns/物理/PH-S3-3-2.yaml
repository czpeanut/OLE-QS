unit:
  subject: 物理
  code: PH-S3-3-2
  title: 全反射
status: draft
types:
- code: T01
  name: 平行多層介質折射與全反射條件
  desc: 比較多層平行介質中光線偏折角度大小並判斷改變入射角時哪個介面可能全反射。
- code: T02
  name: 直角稜鏡內部全反射與出射角
  desc: 追蹤光線垂直射入直角三稜鏡後的臨界角檢驗與最終折射出射角計算。
- code: T03
  name: 透明半球體平行光入射全反射
  desc: 根據幾何位置求出各平行入射光線在半球面處的入射角並與臨界角比較。
- code: T04
  name: 全反射條件與臨界角基本計算
  desc: 利用光由高折射率進入低折射率介質且入射角大於臨界角的條件計算幾何極限距離。
- code: T05
  name: 光纖結構與全反射訊號傳輸原理
  desc: 說明光纖內部纖芯折射率必須大於包層以達成連續全反射傳輸光訊號的原理。
- code: T06
  name: 直角三稜鏡全反射與鍍銀面光路
  desc: 追蹤光線垂直射入直角三稜鏡後在介面發生全反射與鍍銀面反射的幾何路徑與出射角。
- code: T07
  name: 介質內空洞圓界全反射極限
  desc: 利用圓半徑與偏心距構成的入射角正弦值，求解光束不射入介質內部氣泡圓洞的臨界距離或折射率。
- code: T08
  name: 液下點光源透光圓半徑與面積
  desc: 由臨界角公式推導液面圓形亮圈半徑，並計算改變液體折射率時水面透光面積的變化比例。
- code: T09
  name: 方形透明磚雙面折射與全反射
  desc: 聯立入射面斯乃爾折射定律與垂直側面全反射條件，推導光線在透明磚側面全反射的最小折射率。
