unit:
  subject: 物理
  code: PH-S1-3-1
  title: 平面向量
status: draft
types:
- code: T01
  name: 向量加減與分量坐標運算
  desc: 利用單位向量或坐標分量進行向量的加法、減法與量值及方位角計算。
- code: T02
  name: 向量的正交分解與合成
  desc: 將平面向量沿指定軸分解為分量或依幾何三角形法則合成向量。
- code: T03
  name: 向量基本性質與概念判別
  desc: 判別向量平移不變性、共面性、交換律及分量與原向量大小關係。
- code: T04
  name: 向量夾角與三角幾何求解
  desc: 結合餘弦定理或三角比求兩向量合成後的量值與夾角。
- code: T05
  name: 相對位移或速度的向量合成
  desc: 應用平面向量加減解決二維平面中的位移或速度合成問題。
