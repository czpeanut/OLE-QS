unit:
  subject: 物理
  code: PH-S3-1-5
  title: 惠更斯原理
status: draft
types:
- code: T01
  name: 惠更斯原理基本概念與子波作圖
  desc: 依據波前上每一點皆可視為新子波源的惠更斯原理，判斷波前傳播與包絡面形成方式。
- code: T02
  name: 惠更斯原理解釋波的反射與折射
  desc: 利用子波在不同介質中的波速差異與波前作圖，解釋波的反射角相等與折射偏折現象。
- code: T03
  name: 波的繞射條件與波長缺口比較
  desc: 比較波長與障礙物或狹縫寬度的相對大小，判斷繞射現象明顯與否及調整頻率或尺寸的影響。
- code: T04
  name: 繞射波前彎曲與孔隙圖樣判讀
  desc: 依據惠更斯子波疊加觀點，判讀波通過單孔隙或障礙物後的波前彎曲與繞射圖樣特徵。
- code: T05
  name: 惠更斯原理適用波種與波動說史實
  desc: 辨識惠更斯原理同時適用於力學波與光波等電磁波，以及其在歷史上支持光波動說的意義。
