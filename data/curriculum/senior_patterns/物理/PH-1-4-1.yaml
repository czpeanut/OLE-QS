unit:
  subject: 物理
  code: PH-1-4-1
  title: 電流磁效應
status: draft
types:
- code: T01
  name: 電流磁效應發現與電磁鐵
  desc: 辨識厄斯特發現電流磁效應的意義，並判斷影響電磁鐵磁性強弱與極性的因素。
- code: T02
  name: 長直導線磁場方向右手定則
  desc: 運用安培右手定則由電流方向判斷周圍磁針偏轉方向，或由磁針反推電流方向。
- code: T03
  name: 螺線管磁場性質與分布判別
  desc: 判斷載流螺線管內外的磁力線分布特徵，以及管內磁場與電流、匝數的關係。
- code: T04
  name: 載流線圈在磁場中轉動方向
  desc: 結合電流方向與磁場方向判斷線圈兩側受力矩方向，進而確定線圈順逆時鐘轉動。
- code: T05
  name: 磁力線與電流磁場綜合判讀
  desc: 綜合電流方向、導線相對磁針位置（上方或下方）及地磁影響，判別磁針偏轉。
- code: T06
  name: 螺線管磁場與安培右手定則應用
  desc: 判斷螺線管通電後的磁極方向，並結合外電路電流變化分析磁力大小。
- code: T07
  name: 平行載流導線或線圈間磁力作用
  desc: 依據兩載流導線或線圈的電流同向或反向，判斷彼此間為相吸或相斥磁力。
- code: T08
  name: 帶電粒子在磁場中的偏轉方向
  desc: 依據右手開掌定則判斷帶電粒子進入磁場後所受磁力與偏轉方向。
