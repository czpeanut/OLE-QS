unit:
  subject: 物理
  code: PH-S1-6-3
  title: 行星與人造衛星
status: draft
types:
- code: T01
  name: 圓軌道衛星物理量與半徑標度
  desc: 由萬有引力提供向心力推導圓軌道速率、向心加速度、角速率與週期對半徑r的冪次關係並進行多衛星比較。
- code: T02
  name: 圓軌道衛星面積速率計算
  desc: 將圓軌道衛星速率公式代入單位時間掃過面積dA/dt=(1/2)rv，求以G、M、r表示的面積速率。
- code: T03
  name: 克卜勒行星三大定律應用
  desc: 判別橢圓軌道近遠日點速率、平均軌道半徑定義及面積速率與克卜勒常數比較。
- code: T04
  name: 地表附近衛星週期與行星密度關係
  desc: 將星球質量改寫為體積乘以平均密度，推導近地衛星週期平方與星球密度的反比定值。
- code: T05
  name: 雙衛星會合週期與軌道半徑反推
  desc: 利用同向或反向運行的兩衛星角速度差求會合時間，進而由週期比與克卜勒第三定律求半徑比。
- code: T06
  name: 地球同步衛星與極地衛星特性判別
  desc: 判別同步衛星週期24小時、赤道正上方軌道及與其他低軌衛星的力學量比較。
- code: T07
  name: 雙星或多衛星週期與速率比例比較
  desc: 比較不同軌道半徑與質量的多顆衛星之軌道速率比及繞行週期長短排序。
- code: T08
  name: 衛星失重成因與低軌阻力衰減
  desc: 解釋軌道失重源自重力完全提供向心力，及低軌衛星受空氣阻力使軌道降低的現象。
- code: T09
  name: 指定軌道衛星速率與質量無關性
  desc: 直接推求特定地心距離的衛星繞行速率表達式，並判別速率與週期和衛星質量無關。
