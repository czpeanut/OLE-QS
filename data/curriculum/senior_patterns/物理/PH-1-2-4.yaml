unit:
  subject: 物理
  code: PH-1-2-4
  title: 天體運動
status: draft
types:
- code: T01
  name: 克卜勒第一與第二定律判讀
  desc: 判別橢圓軌道焦點位置與近日點、遠日點的速度、引力、動能及面積速率比較。
- code: T02
  name: 克卜勒第三定律週期半徑比
  desc: 利用週期平方與半長軸三次方成正比，計算行星或衛星的軌道半徑與公轉週期。
- code: T03
  name: 萬有引力定律與交互作用
  desc: 判別萬有引力與質量乘積成正比、距離平方成反比及雙星互為反作用力性質。
- code: T04
  name: 天體表面重力加速度比例
  desc: 利用星球質量、半徑或密度比，推算表面重力加速度比與太空人重量變化。
- code: T05
  name: 高空重力加速度與距離反比
  desc: 依距地心距離平方反比計算高空處重力加速度或重量變為地表特定倍數的高度。
- code: T06
  name: 雙星連線上引力為零位置
  desc: 根據兩天體質量比與球心距，求解連心線上萬有引力合力為零的平衡點位置。
- code: T07
  name: 克卜勒第三定律週期與半徑
  desc: 利用行星公轉週期平方與平均軌道半徑立方成正比，計算未知週期或距離倍數。
- code: T08
  name: 萬有引力與天體軌道攝動科學史
  desc: 結合天王星攝動與海王星發現等天文史實，判別理論預測與觀測驗證的關係。
- code: T09
  name: 萬有引力與行星表面重力比較
  desc: 運用萬有引力定律推算行星表面重力加速度、質量與密度比值。
- code: T10
  name: 克卜勒第一與第二定律面積速率
  desc: 判別橢圓軌道焦點位置與行星在近日點、遠日點的速度及面積速率守恆。
- code: T11
  name: 克卜勒第三定律週期與軌道半徑
  desc: 利用軌道半徑三次方與公轉週期平方比值為定值求行星公轉週期或半徑。
- code: T12
  name: 人造衛星軌道週期與同步衛星特性
  desc: 判斷人造衛星繞地球運轉的向心力來源，並辨識地球同步衛星的週期、軌道位置與通訊應用。
- code: T13
  name: 人造衛星與同步衛星軌道特性
  desc: 判別地球同步衛星的軌道平面、公轉週期與低軌衛星的運動物理量比較。
- code: T14
  name: 橢圓軌道對稱性與面積時間比
  desc: 利用行星與太陽連線掃過面積與經過時間成正比，計算橢圓長短軸分段或扇形區間的運行時間比。
- code: T15
  name: 近日遠日點面積速率與軌道幾何
  desc: 運用近日與遠日點切線速率乘積相等求端點速率，或結合半長軸與週期定律反推遠日點距離。
- code: T16
  name: 橢圓軌道引力作功與能量轉換
  desc: 判別行星在橢圓軌道上靠近或遠離太陽時，萬有引力作功正負及動能與引力位能的消長關係。
- code: T17
  name: 行星軌道幾何錯誤與科學史判讀
  desc: 依克卜勒第一定律檢驗軌道中心與焦點位置合理性，並辨識第谷觀測與克卜勒歸納的科學史實。
