unit:
  subject: 物理
  code: PH-S3-2-2
  title: 基音與泛音
status: draft
types:
- code: T01
  name: 開管與閉管諧音泛音頻率比較
  desc: 應用開管與閉管的駐波頻率通式比較不同管長或不同階泛音的頻率高低。
- code: T02
  name: 已知泛音頻率反推空氣柱長度
  desc: 由樂器閉管或開管的基音或特定泛音頻率及聲速反求空氣柱有效長度。
- code: T03
  name: 開管或閉管可能波長判別
  desc: 根據管長與邊界條件判別哪些波長無法在開管或閉管中形成穩定駐波。
- code: T04
  name: 開管基音與泛音列基本計算
  desc: 利用兩端開口風琴管基音波長等於兩倍管長的關係計算基音與各次諧音頻率。
- code: T05
  name: 開管與閉管空氣柱基音及泛音頻率
  desc: 依據開管含所有整數倍諧音、閉管僅含奇數倍諧音的規律換算基音與泛音頻率。
- code: T06
  name: 由連續共鳴頻率反推管型與管長
  desc: 由已知多組共鳴頻率的比例與最大公因數判斷管柱屬開管或閉管，並求基頻與最小管長。
- code: T07
  name: 聲音頻譜圖判別樂器管型與基頻
  desc: 讀取頻譜圖中各諧音峰值頻率比例，判別單簧管(閉管)或長笛(開管)及空氣柱長度。
