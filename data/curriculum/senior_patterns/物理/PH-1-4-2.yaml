unit:
  subject: 物理
  code: PH-1-4-2
  title: 電磁感應
status: draft
types:
- code: T01
  name: 電磁感應原理與應用裝置
  desc: 辨識法拉第電磁感應現象，並區分發電機、變壓器與電磁爐的工作原理與限制。
- code: T02
  name: 電磁感應產生條件與影響因素
  desc: 判斷改變電流大小、線圈匝數、電源種類或磁通量變化率對感應電流強度的影響。
- code: T03
  name: 冷次定律與感應電流方向
  desc: 依據磁通量增減與冷次定律，判斷線圈或導體中感應電流的流動方向。
- code: T04
  name: 變壓器升降壓與電磁感應
  desc: 運用電磁感應與線圈匝數比說明變壓器改變交流電壓的原理與電力輸送應用。
- code: T05
  name: 渦電流與電磁爐加熱原理
  desc: 分析交變磁場在金屬鍋底產生感應電流並透過電流熱效應加熱的條件與材料限制。
- code: T06
  name: 磁阻尼效應與來拒去留力學
  desc: 結合冷次定律來拒去留與力學能轉換，分析磁鐵在金屬管或線圈中運動的受力與減速現象。
- code: T07
  name: 電流變化引起兩線圈互感方向
  desc: 由主動導線或線圈的電流增減與相對移動判斷磁通量變化，進而求被動線圈的應電流方向。
- code: T08
  name: 感應電流隨時間函數圖形判讀
  desc: 依據磁棒等速穿越線圈或主線圈電流時變圖形，推導並判別感應電流對時間的函數曲線。
