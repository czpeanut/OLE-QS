unit:
  subject: 物理
  code: PH-S2-3-2
  title: 靜力平衡與應用
status: draft
types:
- code: T01
  name: 共點力平衡與三角拉密定律
  desc: 對懸吊球體、斜面擋板或三力共點平衡系統繪製力圖，運用分量平衡或拉密定律求解張力與正向力。
- code: T02
  name: 槓桿力矩平衡與雙支點正向力
  desc: 運用合力為零與合力矩為零，求解非均勻桿、懸吊平台或雙輪載具（堆高機）兩支點的支撐力。
- code: T03
  name: 靠牆梯子與棒架靜力平衡分析
  desc: 分析斜靠牆面梯子或斜置木棒的受力圖，求解牆面與地面正向力、摩擦力及臨界不滑條件。
- code: T04
  name: 輪子滾上階梯與樞紐輕棒力矩
  desc: 以階梯轉角或樞紐為支點列力矩平衡式，求解滾上階梯所需最小推力或樞紐作用力。
- code: T05
  name: 物體傾倒與滑動臨界條件比較
  desc: 比較重心投影超出底面積（傾倒臨界）與最大靜摩擦力（滑動臨界）條件，判斷先傾倒或先滑動。
- code: T06
  name: 摩擦平衡與疊放多物體極值
  desc: 結合靜摩擦力不等式 f_s≤μ_s N 分析牆面壓物、斜面雙物或疊放木塊不滑動的摩擦係數與重量極值。
- code: T07
  name: 滑輪組與省力機械力學分析
  desc: 利用理想滑輪組繩張力處處相等與張力合成原理，計算省力倍率及懸吊重物平衡條件。
- code: T08
  name: 靜力平衡綜合判斷與力圖繪製
  desc: 依據剛體不平移不轉動條件，判別施力方式、力圖正確性或重心位置與平衡穩定性關係。
- code: T09
  name: 共點三力平衡求張力大小與比較
  desc: 運用正交分解、拉密定理或力的三角形幾何，求解三繩懸掛、斜面擋板或平行牆雙繩的張力與正向力。
- code: T10
  name: 共點力夾角與合力圖反推分力
  desc: 根據合力隨夾角變化圖形的極大值（F1+F2）與極小值（|F1-F2|）或特殊角讀數，聯立反推兩分力量值。
- code: T11
  name: 移動與轉動平衡判別及力偶分析
  desc: 檢核合力為零與合力矩為零兩條件，判別水分子力偶運動、煞車鎖死輪胎平衡或牆壓木塊正向力偏移。
- code: T12
  name: 槓桿支點與懸掛細桿力矩平衡
  desc: 選定適當轉軸列寫Στ=0與ΣF=0方程式，求解跳水板支點力、旋鈕固定細桿或斜靠細桿的張力與正向力。
- code: T13
  name: 輪球滾上階梯最小施力與臨界力矩
  desc: 以輪球與階梯頂角接觸點為轉軸，利用重力力矩與施力力矩平衡求解使輪球恰離地的最小水平力或最小力矩。
- code: T14
  name: 梯子靠牆與堆疊木塊臨界平衡求解
  desc: 列寫梯子靠光滑牆的力與力矩平衡（或四力共點）求靜摩擦係數，或利用質心不超出支撐面求堆疊木塊極限。
- code: T15
  name: 共點三力平衡與拉密定理
  desc: 針對懸球、雙斜面支撐球等三力共點平衡系統，利用正交分解或力三角形比例求張力與正向力。
- code: T16
  name: 槓桿力矩平衡與翹翹板距離求解
  desc: 取適當支點列順時針力矩等於逆時針力矩，求解平衡所需的施力或力臂距離。
- code: T17
  name: 剛體平衡施最小力推球上台階計算
  desc: 以接觸點為轉軸令施力力臂最大且垂直於轉軸連線，計算使球滾上台階的最小推力。
- code: T18
  name: 多物體堆疊與圓筒雙球平衡
  desc: 交替使用整體法與隔離法分析堆疊木塊或雙球在圓筒內的接觸正向力與地面摩擦力。
- code: T19
  name: 梯子工作車力矩平衡極值
  desc: 同時列水平、鉛直力平衡與力矩平衡方程，求地面靜摩擦力、正向力極限或人可爬升最大高度。
- code: T20
  name: 挖洞幾何體與彎折鐵絲重心
  desc: 利用負質量法或分段質心座標公式求挖洞球體或L型鐵絲的重心位置與懸吊平衡傾角。
