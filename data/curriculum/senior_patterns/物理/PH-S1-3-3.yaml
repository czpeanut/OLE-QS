unit:
  subject: 物理
  code: PH-S1-3-3
  title: 水平拋射
status: draft
types:
- code: T01
  name: 平拋落地後彈性反彈接續斜拋
  desc: 計算平拋落地瞬間的水平與鉛直分速度，並以反射後的仰角與速率接續分析斜向拋射運動。
- code: T02
  name: 平拋落地時間、射程與末速
  desc: 將運動分解為水平等速與鉛直自由落體，計算飛行時間、水平射程與著地速度夾角。
- code: T03
  name: 平拋落於斜面的時間與距離計算
  desc: 利用斜角正切等於鉛直位移與水平位移比值的幾何條件求解平拋落於斜面的時間。
- code: T04
  name: 平拋撞擊階梯幾何階數判定
  desc: 比較第 n 階邊緣與拋物線軌跡的鉛直落差，判定球體首次擊中的階梯編號。
- code: T05
  name: 平拋運動切線與法線加速度
  desc: 先求該時刻速度方向與水平夾角，再將重力加速度沿切線與法線方向進行投影分解。
- code: T06
  name: 水平拋射概念與運動特性
  desc: 判別平拋運動的水平等速、鉛直自由落體獨立性與等加速本質。
- code: T07
  name: 平拋射程與落地速率求解
  desc: 由拋出高度與水平射程聯立求飛行時間、初速與落地瞬間合速率。
- code: T08
  name: 平拋落至階梯或斜面條件
  desc: 利用平拋位移比或軌跡方程式判斷物體落於第幾階階梯或斜面上落點。
- code: T09
  name: 平拋軌跡方程式反推初速
  desc: 由給定的二次函數軌跡方程式係數比對求出平拋初速度與落地速率。
- code: T10
  name: 平拋特定時刻位置與速度分析
  desc: 計算平拋過程中任一時刻的水平位置、鉛直高度及速度大小與方向。
