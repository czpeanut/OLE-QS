unit:
  subject: 物理
  code: PH-S2-3-1
  title: 生活中常見的力
status: draft
types:
- code: T01
  name: 斜面等速下滑與上滑減速運動分析
  desc: 由斜面等速下滑條件求動摩擦係數μ_k=tanθ，進而求解物體以初速沿斜面上滑的加速度與最大位移。
- code: T02
  name: 斜面靜止與靜摩擦係數判別
  desc: 分析斜面上靜止木塊（含細繩剪斷後或直角雙斜面比較）的受力平衡，判別正向力、靜摩擦力與μ_s≥tanθ條件。
- code: T03
  name: 斜面動摩擦加速下滑位移求解
  desc: 分解重力沿斜面與垂直斜面分力求動摩擦力與加速度，再結合運動學公式計算斜面下滑時間或長度。
- code: T04
  name: 斜面下滑接水平面減速至靜止分析
  desc: 聯繫斜面等速下滑與水平面受動摩擦力減速停止兩階段，比較兩階段摩擦力與動摩擦係數關係。
- code: T05
  name: 斜向推拉正向力與摩擦比較
  desc: 正交分解斜上拉或斜下推外力求正向力大小，並比較最大靜摩擦力與實際靜、動摩擦力。
- code: T06
  name: 摩擦力分段判別與外力加速計算
  desc: 先比較水平推力與最大靜摩擦力決定是否移動，再代入靜摩擦或動摩擦力求物體加速度。
- code: T07
  name: 輸送帶與鉛直牆面壓緊摩擦力分析
  desc: 分析物體與移動輸送帶或鉛直牆面間的靜摩擦、動摩擦方向及維持靜止所需的最小正向力。
- code: T08
  name: 斜面滑動與傾角測試求摩擦係數
  desc: 依據物體開始滑動的臨界傾角或等速下滑傾角與斜率關係，求解靜摩擦與動摩擦係數或加速度。
- code: T09
  name: 彈簧串並聯與多段受力平衡
  desc: 利用虎克定律 F=kx 與幾何總長限制條件，計算串並聯彈簧的形變量與接觸面正向力。
- code: T10
  name: 虎克定律與彈簧伸長量比較
  desc: 依據彈力與形變量成正比判斷彈簧在不同位置所受彈力的大小關係。
- code: T11
  name: 彈簧切割與串並聯等效常數
  desc: 計算彈簧等分切割後的力常數變化並求解串並聯組合後的總伸長量。
- code: T12
  name: 靜摩擦與動摩擦力特性及方向判別
  desc: 判斷物體相對運動或欲運動趨勢下的摩擦力方向，並比較最大靜摩擦與動摩擦力。
- code: T13
  name: 斜面上物體受力分解與摩擦力判斷
  desc: 將重力沿斜面與垂直斜面分解，比較下滑力與最大靜摩擦力以求實際靜摩擦力。
- code: T14
  name: 垂直牆面水平推力摩擦平衡
  desc: 分析水平推力產生的正向力與鉛直向上的靜摩擦力如何共同維持物體靜止不下滑。
- code: T15
  name: 動摩擦力減速運動與煞車距離計算
  desc: 結合動摩擦力造成的負加速度與運動學公式計算水平面上物體停止的最短距離。
