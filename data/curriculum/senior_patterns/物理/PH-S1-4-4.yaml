unit:
  subject: 物理
  code: PH-S1-4-4
  title: 牛頓第三運動定律
status: draft
types:
- code: T01
  name: 施力與反作用力系統辨析
  desc: 在馬拉車或物體接觸系統中，區分系統內力、外力、驅動力與阻力的對應關係。
- code: T02
  name: 互推或互拉系統受力與磅秤
  desc: 結合牛頓第三定律與力平衡，計算兩人互拉或互推時磅秤讀數及各自受力。
- code: T03
  name: 光滑面互推加速度與速率計算
  desc: 利用互推過程兩物體所受反作用力大小相等、作用時間相同，求分離後加速度與速率。
- code: T04
  name: 作用力與反作用力配對判別
  desc: 依據施力者與受力者互換及同性質原則辨識平衡力與作用力反作用力對。
- code: T05
  name: 接觸推力內力與第三定律應用
  desc: 結合牛頓第二與第三定律分析多物體接觸推擠時相互間的作用力大小。
- code: T06
  name: 繩索拉動多體平衡與反作用力
  desc: 分析手、繩索與木塊或圓環串聯系統在靜止、等速或加速時，繩兩端張力平衡與反作用力對差異。
