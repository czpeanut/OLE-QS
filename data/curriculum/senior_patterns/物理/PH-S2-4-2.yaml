unit:
  subject: 物理
  code: PH-S2-4-2
  title: 氣體動力論
status: draft
types:
- code: T01
  name: 氣體分子碰撞器壁與微觀壓力推導
  desc: 從單個分子撞擊器壁的動量變化與單位時間碰撞次數，計算容器壁所受平均壓力。
- code: T02
  name: 理想氣體分子平均動能與總內能
  desc: 依據單原子氣體平均動能與絕對溫度成正比，計算混合氣體的分子平均動能與總動能。
- code: T03
  name: 氣體動力論圖形與狀態轉換分析
  desc: 結合理想氣體狀態圖與微觀動能公式，判斷各狀態過程中的分子平均動能與總動能變化。
- code: T04
  name: 氣體動力論基本假設與壓力推導
  desc: 判別理想氣體分子碰撞、平均動能與絕對溫度關係，並計算分子黏附或反跳對器壁壓力的影響。
- code: T05
  name: 分子方均根速率與平均動能比例
  desc: 運用方均根速率與平均動能公式比較不同種類或不同溫度氣體的速率與動能比。
- code: T06
  name: 單位時間撞擊器壁分子數比較
  desc: 利用分子數密度與方均根速率乘積正比關係，比較狀態改變後單位時間撞擊單位面積器壁的分子數。
- code: T07
  name: 絕熱容器氣體混合與內能守恆
  desc: 依據單原子理想氣體總內能守恆，求解絕熱混合或導熱平衡後的末溫與壓力。
- code: T08
  name: 分子速率分布曲線與活化能判讀
  desc: 判讀馬克士威－波茲曼速率分布隨溫度變化的曲線特徵，及超過活化能的分子比例趨勢。
- code: T09
  name: 氣體分子撞擊器壁平均衝力與壓力
  desc: 運用動量變化與往返週期推導單一或大量分子（含彈性與非彈性碰撞）對器壁產生的壓力。
- code: T10
  name: 方均根速率與氣體混合求解
  desc: 應用方均根速率與絕對溫度、莫耳質量關係，或由總動能守恆計算不同溫度氣體混合後的方均根速率。
- code: T11
  name: 分子動能與溫度及熱傳遞概念
  desc: 依據單原子理想氣體平均動能正比於絕對溫度，判別熱平衡、熱量傳遞方向與溫度高低。
- code: T12
  name: 馬克士威分子速率分布圖判讀
  desc: 由不同溫度或氣體的分子速率分布曲線峰值與寬度，比較溫度、方均根速率與分子數比例。
- code: T13
  name: 絕熱容器混合與氣體內能守恆
  desc: 利用絕熱條件下總內能守恆（E=(3/2)PV），求解不同初溫與初壓氣體混合後的平衡溫度。
