unit:
  subject: 物理
  code: PH-S1-1-1
  title: 簡介不確定度
status: draft
types:
- code: T01
  name: 不確定度基本定義與A類B類區分
  desc: 判別隨機變異的A類與儀器規格書等B類不確定度來源及降低方法。
- code: T02
  name: 最佳估計值與有效位數修整
  desc: 依規範將不確定度取兩位有效數字，並將最佳估計值對齊不確定度末位。
- code: T03
  name: A類與B類不確定度判別
  desc: 區分重複測量統計誤差（A類）與儀器規格解析度誤差（B類）的來源與性質。
- code: T04
  name: A類不確定度計算
  desc: 由多次測量數據的標準差除以樣本數平方根計算A類標準不確定度。
- code: T05
  name: 測量結果有效位數表示
  desc: 將不確定度取適當有效位數並對齊最佳估計值的小數位數進行表示。
