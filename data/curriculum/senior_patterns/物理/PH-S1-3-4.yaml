unit:
  subject: 物理
  code: PH-S1-3-4
  title: 斜向拋射
status: draft
types:
- code: T01
  name: 斜向拋射軌跡圖比較時間與初速
  desc: 比較多條斜拋軌跡的最大高度（決定鉛直分速與時間）及水平射程，排列初速與分速大小。
- code: T02
  name: 斜拋瞄準自由落體靶（猴子落樹）
  desc: 分析對準目標拋出且目標同時自由落下的運動，利用相對運動或共同重力加速度求解擊中條件。
- code: T03
  name: 斜拋對稱高度兩點間的時距求解
  desc: 結合最大射程條件（45°）與鉛直方向上拋運動對稱性，求解砲彈連續通過同高度兩點的時距。
- code: T04
  name: 同初速互補仰角與射程、高度比較
  desc: 利用兩仰角之和為90度時水平射程相等的對稱性質，比較飛行時間與最大高度比。
- code: T05
  name: 斜拋時間與最大高度射程求解
  desc: 分解初速為水平與鉛直分量計算上升時間、最大高度及水平射程。
- code: T06
  name: 不同高低處斜拋與目標命中
  desc: 結合水平等速與鉛直上拋位移公式求解高低差斜拋的初速或抵達目標時間。
- code: T07
  name: 斜拋速度夾角與位置推算
  desc: 利用水平速度不變與鉛直速度關係求速度達特定夾角時的高度或時刻。
- code: T08
  name: 多重拋體軌跡比較問題
  desc: 根據最高點等高或同落點等幾何條件比較不同拋體的時間、初速與落地速率。
- code: T09
  name: 斜拋運動函數圖形判讀
  desc: 推導並判別斜拋過程中速度分量、位置坐標或動能間的函數關係圖形。
- code: T10
  name: 斜拋軌跡方程式反推初速與特徵
  desc: 由給定的二次函數軌跡方程式比對係數，求解斜拋的初速度、仰角、最大高度與射程。
- code: T11
  name: 軌跡方程式係數比對求初速特徵
  desc: 將給定的斜拋二次函數軌跡方程式與標準式比對係數，反推初速、最高點速率、高度與射程。
- code: T12
  name: 最高點最小速率與最大射程反推
  desc: 利用最高點最小速率即水平分速或45度最大射程條件，反推斜拋初速度並計算飛行時間或上拋高度。
- code: T13
  name: 斜拋水平等速運動與投影分析
  desc: 掌握斜拋過程水平方向不受外力維持等速的本質，判讀地面投影運動或過特定點水平速度。
- code: T14
  name: 逆向平拋對稱性與分段時間
  desc: 利用最高點逆向視為平拋運動或自由落體對稱性，求解上升末段高度、擊中牆面初速與過窗時間。
