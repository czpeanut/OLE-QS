unit:
  subject: 物理
  code: PH-S1-4-3
  title: 牛頓第二運動定律
status: draft
types:
- code: T01
  name: 斜向力分解與水平加速度計算
  desc: 將斜向施力分解為水平與鉛直分量，求解接觸面正向力、摩擦力與水平加速度。
- code: T02
  name: 連接體系統（定滑輪與斜面）
  desc: 對繩索或接觸連接的多物體系統列式聯立，求解系統加速度與繩張力。
- code: T03
  name: 動滑輪組合系統加速度與張力
  desc: 結合動滑輪位移與加速度幾何約束關係，列牛頓第二定律求解各物體加速度與張力。
- code: T04
  name: 水平串聯多物體與斷繩條件
  desc: 由整體法求系統加速度再以隔離法求內力張力，判斷各段繩索達承受極限的條件。
- code: T05
  name: 電梯視重與加速座標系受力
  desc: 分析電梯或加速車廂內物體的視重讀數、單擺偏角或斜面相對靜止所需的加速度條件。
- code: T06
  name: 系統質點內力與攀爬問題
  desc: 運用系統牛頓第二定律分析猴子爬竿或氣球浮力等問題中各物體的加速度與未知量。
- code: T07
  name: 單體受力與F=ma基本計算
  desc: 根據已知質量、受力與運動時間或速度變化求解合力、阻力或加速度。
- code: T08
  name: F-a或F-m實驗圖形判讀
  desc: 由外力與加速度關係圖的斜率判斷質量大小並轉換為其他物理量關係圖。
- code: T09
  name: 光滑桌面或斜面連結體內力
  desc: 以整體法求系統加速度，再以隔離法求解接觸面正向力或輕繩張力。
- code: T10
  name: 滑輪系統與斜面連結運動
  desc: 分析跨過定滑輪的兩物體受力並聯立牛頓第二定律求解加速度與繩張力。
- code: T11
  name: 電梯視重與鉛直加速問題
  desc: 利用正向力或張力等於視重計算升降機加減速過程中的視重與運動學量。
- code: T12
  name: 變質量或浮力系統加速度分析
  desc: 列出載重改變前後的鉛直牛頓第二定律聯立方程式求解未知質量或浮力。
- code: T13
  name: 含摩擦力二維受力與垂降分析
  desc: 分解繩張力並結合正向力與動摩擦力列式求解鉛直或斜面加速度與張力。
- code: T14
  name: 空氣阻力與終端速度v-t圖分析
  desc: 分析落體受空氣阻力隨速率增加的合力變化，由v-t圖讀取終端速度並計算阻力大小。
- code: T15
  name: 空氣阻力與終端速度圖形分析
  desc: 分析物體受重力與隨速率增大之阻力時的合力、加速度變化及終端速度v-t圖形。
