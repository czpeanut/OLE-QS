unit:
  subject: 物理
  code: PH-S2-3-3
  title: 碰撞
status: draft
types:
- code: T01
  name: 碰撞受力與動量速度變化比較
  desc: 依據牛頓第三定律與系統動量守恆，比較不同質量兩球碰撞時的撞擊力、動量變化量與速度變化量比例。
- code: T02
  name: 一維彈性碰撞公式求解撞後速度
  desc: 聯立動量守恆與動能守恆（或接近速度等於分離速度），求解不同質量兩球正向彈性碰撞後的末速度。
- code: T03
  name: 質量相等或懸殊一維彈性碰撞特例
  desc: 運用等質量速度交換、輕撞重反彈、重撞輕兩倍速等彈性碰撞極限特例快速求解。
- code: T04
  name: 完全非彈性碰撞與力學能損失計算
  desc: 計算兩物體碰撞後合體的共同速度，並求解碰撞過程中損失的總動能或轉化為彈力位能的比例。
- code: T05
  name: 二維彈性與非彈性碰撞分量求解
  desc: 將碰撞前後速度沿水平與鉛直方向正交分解，分別列動量守恆求解合體或分離後的速度方向與大小。
- code: T06
  name: 擺球碰撞與衝擊擺力學能聯立
  desc: 分段聯立擺球下擺或上擺的力學能守恆與最低點碰撞動量守恆，求解擺高、初速或擺線張力。
- code: T07
  name: 子彈木塊嵌入與內力摩擦作功
  desc: 分析子彈射入木塊的完全非彈性碰撞，計算系統動能損失、內力對木塊作功與相對嵌入深度。
- code: T08
  name: 碰撞與彈簧耦合及簡諧變化
  desc: 利用系統質心速度與能量守恆求彈簧最大壓縮量，或分析簡諧振子黏合前後週期與振幅變化。
- code: T09
  name: 多體連續一維彈性碰撞求解
  desc: 依序追蹤雙球疊落反彈或三物體連續發生一維彈性碰撞的過程，求解最終反彈高度或末速度。
- code: T10
  name: 質心動能損失極值與碰撞合理性
  desc: 運用動量守恆、總動能不增及不穿越條件檢驗碰撞末速合理性，並判別完全非彈性碰撞能量損失極值。
