unit:
  subject: 物理
  code: PH-1-3-3
  title: 基本交互作用
status: draft
types:
- code: T01
  name: 四種基本交互作用性質比較
  desc: 比較重力、電磁力、強核力、弱核力的強度、作用範圍及在核反應中的角色。
- code: T02
  name: 日常接觸力與微觀電磁本質
  desc: 辨識摩擦力、正向力、凡德瓦力或α粒子與原子核斥力所屬的基本交互作用。
- code: T03
  name: 靜電感應起電與電性推論
  desc: 根據帶電體相吸與相斥的實驗現象，推論物體帶電與否及電荷正負電性。
- code: T04
  name: 庫侖定律比例與極值計算
  desc: 運用靜電力與電量乘積成正比、距離平方成反比，求解接觸均分後的作用力或極值。
- code: T05
  name: 多點電荷連線上靜電力平衡
  desc: 根據兩固定點電荷的電量與距離，求解第三電荷所受靜電力合力為零的位置。
- code: T06
  name: 電力線與磁力線性質判讀
  desc: 依據電力線與磁力線的起訖、封閉性、切線方向及疏密程度，判斷場強與受力方向。
- code: T07
  name: 四種基本交互作用比較判別
  desc: 比較重力、電磁力、強力與弱力的相對強度、作用範圍與微觀媒介或本質。
- code: T08
  name: 萬有引力定律比例與計算
  desc: 應用 F=GMm/r^2 計算質量或距離改變後的重力變化，或推導地表重力加速度關係。
- code: T09
  name: 庫侖定律靜電力比例與計算
  desc: 應用 F=kq1q2/r^2 計算點電荷電量或距離改變後的靜電力大小與方向。
- code: T10
  name: 靜電力向量合成與平衡
  desc: 對平面上多個點電荷施於目標電荷的庫侖靜電力進行向量分解與合成。
- code: T11
  name: 靜電現象與電荷基本性質
  desc: 判別摩擦起電、感應起電、接觸起電原理及電荷守恆與基本電荷量子化。
- code: T12
  name: 磁場與磁力線分布判讀
  desc: 由磁棒或磁鐵周圍的磁力線切線方向與疏密程度，判讀空間某點的磁場方向與強弱。
- code: T13
  name: 弱力衰變與核反應判別
  desc: 辨識自由中子β衰變或太陽核融合中由弱作用力主導粒子本質轉變的過程。
- code: T14
  name: 巨觀力歸納為基本交互作用
  desc: 將生活中的接觸力（如推力、摩擦力、正向力）與分子力歸因於微觀電磁力。
- code: T15
  name: 四大基本交互作用強度與尺度比較
  desc: 比較重力、電磁力、強力與弱力的相對強度、作用範圍與傳遞性質。
- code: T16
  name: 日常作用力的基本交互作用歸類
  desc: 將摩擦力、彈力、正向力、浮力與核衰變等現象對應至四大基本交互作用。
- code: T17
  name: 萬有引力疊加與平衡點位置計算
  desc: 利用萬有引力公式與距離平方反比關係計算雙星球連線上的重力零點或星球表面重力。
- code: T18
  name: 庫侖靜電力疊加與平衡位置計算
  desc: 運用庫侖定律與向量疊加比較多點電荷受力大小，或求解靜電力為零的位置。
- code: T19
  name: 帶電狀態與靜電吸引排斥推理
  desc: 根據物體間相吸或相斥現象反推各物體帶同性電、異性電或不帶電的邏輯可能。
- code: T20
  name: 強作用力與弱作用力微觀特性判別
  desc: 判別強力束縛核子的距離特徵與弱力在β衰變、核融合中的作用與守恆律。
