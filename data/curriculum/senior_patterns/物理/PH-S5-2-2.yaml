unit:
  subject: 物理
  code: PH-S5-2-2
  title: X射線
status: draft
types:
- code: T01
  name: 布拉格繞射與晶格距波長計算
  desc: 應用布拉格繞射公式由X射線掠射角與繞射級數求解晶格間距或X射線波長。
- code: T02
  name: X射線管加速電壓與最短波長
  desc: 利用電子動能完全轉換為單一光子能量的極限求連續X射線光譜的最短波長。
- code: T03
  name: 連續X射線與特性X射線圖譜判別
  desc: 區分制動輻射連續譜與原子內層電子躍遷產生的特性峰值隨管電壓和靶材變化。
- code: T04
  name: 康普頓散射與光子動量守恆
  desc: 應用電子碰撞光子前後的能量與動量守恆解釋X射線散射後波長變長的現象。
- code: T05
  name: X射線性質與發現歷史實驗
  desc: 辨析X射線穿透力、不被電磁場偏折等電磁波性質及倫琴發現過程。
- code: T06
  name: 布拉格繞射級數反推晶體晶格間距
  desc: 已知X射線波長與高階建設性繞射掠射角，代入布拉格公式反推晶體晶格間距。
- code: T07
  name: 雙波長布拉格繞射聯立求解
  desc: 利用同一晶體對兩束不同波長X射線的繞射級數與掠射角，聯立求解未知波長與晶格距。
- code: T08
  name: 晶體排列與X射線波長尺度匹配
  desc: 說明必須以晶體觀察X射線繞射的原因為晶格間距與波長相近且原子規則排列如光柵。
- code: T09
  name: X射線繞射干涉波動性質判別
  desc: 辨識X射線能測定晶體晶格距離的根本物理依據為其具備波動繞射與干涉性質。
