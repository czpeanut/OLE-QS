unit:
  subject: 物理
  code: PH-S3-3-1
  title: 光的反射與折射
status: draft
types:
- code: T01
  name: 平面鏡反射視場與多鏡成像
  desc: 利用平面鏡像對稱性作圖判斷視野範圍或兩平面鏡反射後影像的正倒立性質。
- code: T02
  name: 球面鏡成像性質與物距區間判別
  desc: 根據凹面鏡與凸面鏡的特殊光線作圖法則判斷各物距區間的成像大小與虛實。
- code: T03
  name: 球面鏡成像公式與像高比例計算
  desc: 應用面鏡高斯公式與放大率公式求解像距、像高比或雙面鏡曲率半徑。
- code: T04
  name: 球面鏡移動物體對應像的移動
  desc: 分析物體沿主軸移動時凸面鏡或凹面鏡所成像的位置與移動方向變化。
- code: T05
  name: 司乃耳定律與稜鏡光程時間計算
  desc: 運用折射定律與介質光速公式追蹤光線通過稜鏡或平板的路徑與所需時間。
- code: T06
  name: 視深與實深跨介質雙向觀察比較
  desc: 應用近軸近似視深公式計算水下與空中觀察者彼此感受到的距離差異。
- code: T07
  name: 司乃耳折射定律與介質波長頻率
  desc: 運用折射定律比較不同介質的折射率、相對折射率與光進入介質後的頻率波長變化。
- code: T08
  name: 平行玻璃板光線側位移與色光比較
  desc: 分析紅光與紫光等不同色光通過平行玻璃板後的折射率大小與出射平行間距變化。
- code: T09
  name: 光線斜射入水池之水底影長計算
  desc: 結合太陽光照射水面發生折射的角度關係與幾何三角函數計算竿在水底的影子長度。
- code: T10
  name: 視深與實深換算及視速率問題
  desc: 運用正上方觀察的視深與實深比值關係，計算液體視深或光源下沉的實際與視速率。
- code: T11
  name: 插針法與半圓盒測折射率實驗
  desc: 分析長方體壓克力磚插針法或半圓形液體盒實驗的坐標數據以計算材料折射率。
- code: T12
  name: 虹與霓的折射反射與色散仰角
  desc: 比較日光在水珠內經不同反射與折射次數形成虹與霓的亮度差異及紅紫光仰角分布。
- code: T13
  name: 三稜鏡折射與色散偏向角比較
  desc: 依據不同色光在稜鏡中的折射率與波速差異，比較通過稜鏡後的偏向角大小。
- code: T14
  name: 鏡面反射與漫反射現象判別
  desc: 依據反射面平整與否區分鏡面反射與漫反射，解釋水面倒影或凹凸表面反光現象。
- code: T15
  name: 日常與自然光學現象成因判別
  desc: 依據光線的直進、反射、折射或色散原理，判別生活情境或文學描述對應的光學成因。
