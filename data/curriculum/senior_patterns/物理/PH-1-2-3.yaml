unit:
  subject: 物理
  code: PH-1-2-3
  title: 生活中常見的力
status: draft
types:
- code: T01
  name: 靜摩擦與動摩擦力性質判別
  desc: 區分靜摩擦力、最大靜摩擦力與動摩擦力的產生條件、方向及大小變化。
- code: T02
  name: 摩擦係數與加速度滑行計算
  desc: 結合正向力與摩擦係數求摩擦力，並搭配牛頓第二定律求加速度或滑行距離。
- code: T03
  name: 摩擦力方向與推動運動應用
  desc: 判斷人行走、車輪加速或木箱受力時摩擦力的方向與是否作為推動動力。
- code: T04
  name: 斜向施力與最大靜摩擦比較
  desc: 分解斜向推拉力對正向力與水平分力的影響，比較恰拉動物體的施力大小。
- code: T05
  name: 虎克定律與彈簧串並聯伸長
  desc: 利用彈簧伸長量與外力成正比計算單一或串聯懸掛系統的彈簧伸長量。
- code: T06
  name: 空氣阻力與終端速度受力
  desc: 分析物體在空氣中落下或等速下降時，重力與空氣阻力的平衡關係。
- code: T07
  name: 靜摩擦力與動摩擦力判別
  desc: 依據物體是否相對滑動，判斷靜摩擦力、最大靜摩擦力與動摩擦力的方向及量值。
- code: T08
  name: 虎克定律與彈簧伸長量
  desc: 應用 F=kx 計算單一彈簧受力時的伸長量、壓縮量或彈性常數。
- code: T09
  name: 靜摩擦力與正向力關係判別
  desc: 分析水平或鉛直牆面受壓物體的靜摩擦力與最大靜摩擦力，判別物體靜止或滑動的臨界條件。
- code: T10
  name: f-F圖判讀最大靜摩擦與動摩擦
  desc: 由摩擦力隨外力變化的關係圖讀出最大靜摩擦力與動摩擦力，並計算滑動後的加速度。
- code: T11
  name: 斜向推力與拉力之摩擦力比較
  desc: 分解斜向施力的鉛直分力對正向力的增減影響，比較推、拉兩種方式啟動重物所需最小施力。
- code: T12
  name: 彈簧串並聯與虎克定律求外力
  desc: 判斷多條彈簧的串聯或並聯等效彈性常數，依形變量與虎克定律計算所需施力。
- code: T13
  name: 生活中的向心力來源辨識
  desc: 分析圓盤轉動或車輛轉彎等圓周運動情境，辨識提供向心力的真實物理作用力（如靜摩擦力）。
- code: T14
  name: 靜摩擦力與動摩擦力判別計算
  desc: 依據外力是否超過最大靜摩擦力判別靜止或滑動，並由F-f圖或係數求摩擦力與加速度。
- code: T15
  name: 虎克定律與彈簧伸長量實驗分析
  desc: 利用彈力與形變量成正比關係，由實驗數據表或圖形反求彈簧原長與未知外力。
- code: T16
  name: 流體阻力與終端速度v-t圖分析
  desc: 結合重力與隨速率增加的阻力，判讀物體由加速趨於終端速度的運動變化。
