unit:
  subject: 物理
  code: PH-S1-4-2
  title: 慣性與牛頓第一運動定律
status: draft
types:
- code: T01
  name: 等速與加減速手扶梯受力分析
  desc: 區分等速運動合力為零與加減速運動需淨力，判別電梯或手扶梯上人員所受正向力與摩擦力。
- code: T02
  name: 慣性參考系與假想力生活判別
  desc: 依據牛頓第一定律解釋煞車前傾、轉彎側傾等慣性現象，判別物體在非慣性系中的表現。
- code: T03
  name: 多力平衡下物體保持等速或靜止
  desc: 已知物體維持靜止或等速直線運動時，直接推論其所受外力向量總和為零。
- code: T04
  name: 撤去外力後的理想無摩擦運動預測
  desc: 依伽利略斜面思想實驗與慣性定律，推論不受淨外力作用物體的後續運動軌跡與速率。
- code: T05
  name: 靜態擺錘或氣球在加速車廂內偏轉
  desc: 分析車廂加速或等速時懸掛擺錘或氦氣球偏轉方向，判別慣性與合外力方向。
- code: T06
  name: 靜止與等速彈簧秤讀數與正向力
  desc: 計算靜止或等速運動系統中彈簧秤的張力讀數及物體對接觸面的正向力大小。
- code: T07
  name: 質量作為慣性量度與性質判別
  desc: 辨識質量是物體慣性大小的唯一量度，且慣性不因靜止、不受力或地點而消失。
- code: T08
  name: 牛頓第一定律與二三定律綜合辨析
  desc: 區分合力為零的慣性運動與向心力改變方向、作用力與反作用力等定律的適用情境。
