unit:
  subject: 物理
  code: PH-1-4-3
  title: 電與磁的統整
status: draft
types:
- code: T01
  name: 馬克士威電磁波理論與光速
  desc: 辨識馬克士威整合電磁學方程組並預言電磁波波速等於光速的物理史貢獻。
- code: T02
  name: 電磁波產生機制與傳播特性
  desc: 判斷電磁波由加速電荷或振盪電磁場產生，且在真空中屬於橫波不需介質傳播。
- code: T03
  name: 電磁波譜波長與頻率排序
  desc: 依波長或頻率大小順序排列無線電波、微波、紅外線、可見光、紫外線與X/γ射線。
- code: T04
  name: 電磁波能量與日常科技應用
  desc: 依據電磁波與水分子共振或穿透特性，判斷微波爐加熱機制與適用容器材質。
- code: T05
  name: 馬克士威方程式與電磁波理論
  desc: 判別馬克士威統整電與磁的貢獻，及預言電磁波在真空中以光速傳播的推論。
- code: T06
  name: 電磁波波速頻率與波長換算
  desc: 運用 c=fλ 計算不同頻段電磁波在真空中的波長或頻率。
- code: T07
  name: 電磁波譜排序與特性應用
  desc: 依據波長或頻率大小排列各波段電磁波，並辨識其物理特性與生活應用。
- code: T08
  name: 常見電器與電磁原理配對
  desc: 區分日常電器（如變壓器、電動機、電磁爐、麥克風）所運用的電磁核心原理。
- code: T09
  name: 馬克士威電磁學統整與光速推論
  desc: 認識馬克士威整合電磁方程式並首度推論電磁波傳播速度等於光速的貢獻。
- code: T10
  name: 電磁波譜分類與不同波段應用判別
  desc: 區分電磁波與聲波或物質波，並辨識熱輻射與各波段電磁波的特性。
