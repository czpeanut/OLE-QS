unit:
  subject: 物理
  code: PH-1-1-3
  title: 國際單位制
status: draft
types:
- code: T01
  name: SI基本量與導出量判別
  desc: 辨識七個國際單位制基本量與基本單位，或區分基本單位與導出單位。
- code: T02
  name: 物理常數與公式因次分析
  desc: 利用已知物理關係式推導常數的SI單位，或由因次一致性檢驗公式正確性。
- code: T03
  name: 單位前綴與大小比較換算
  desc: 進行奈米、微米、毫米、兆、吉等詞頭換算，並比較不同單位物理量的大小。
- code: T04
  name: 跨單位制物理量換算計算
  desc: 依據自訂單位或非SI單位與公制單位的換算關係，求解密度或速率等物理量。
- code: T05
  name: 數量級與原子尺度估算
  desc: 利用體積、質量或幾何關係進行數量級估計，求取粒子數目或儲存容量。
- code: T06
  name: 基本量與基本單位辨識
  desc: 依據國際單位制定義，判別七個基本物理量、基本單位名稱及符號。
- code: T07
  name: 數量級詞頭與單位換算
  desc: 運用十進位詞頭（如奈米、微米、吉赫）與埃等常用微觀單位進行換算比較。
- code: T08
  name: SI基本單位與定義辨識
  desc: 辨識國際單位制七大基本物理量與基本單位，或判斷物理量定義與大K原器等基準的關聯。
- code: T09
  name: 導出單位因次展開與檢核
  desc: 將力、功、功率、壓力等導出單位拆解為SI基本單位組合，檢驗單位換算或方程式正確性。
- code: T10
  name: 因次分析推導物理關係式
  desc: 利用等號兩側物理量的質量、長度、時間因次相等，推導未知公式或辨識物理量意義。
- code: T11
  name: 物理尺度數量級與倍數估算
  desc: 運用長度或時間的十進位數量級（如奈米與原子直徑），進行微觀與巨觀尺度的倍數估算。
- code: T12
  name: 基本物理量與SI基本單位判別
  desc: 辨識七大基本物理量及其對應的國際標準基本單位。
- code: T13
  name: 導出單位與基本單位換算
  desc: 依據物理定義或公式將焦耳、牛頓等導出單位拆解為基本單位組合。
- code: T14
  name: 詞頭倍率換算與單位轉換
  desc: 利用奈米、微米、兆等SI詞頭進行不同尺度單位間的數值倍率換算。
- code: T15
  name: 面積或體積的幾何填滿估算
  desc: 假設粒子或元件規則排列，利用總面積或體積除以單個截面積估算總數或邊長。
- code: T16
  name: SI基本單位與導出單位判別
  desc: 辨識國際單位制七大基本單位與由基本單位組合而成的導出單位。
