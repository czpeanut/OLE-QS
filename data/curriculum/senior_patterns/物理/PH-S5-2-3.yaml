unit:
  subject: 物理
  code: PH-S5-2-3
  title: 黑體輻射
status: draft
types:
- code: T01
  name: 黑體輻射光譜分布與維恩位移定律
  desc: 判讀不同溫度下黑體輻射強度對波長分布圖，比較溫度高低、峰值波長與總輻射能量。
- code: T02
  name: 普朗克能量量子化假設與能量判別
  desc: 依據簡諧振子能量交換為 hf 整數倍的量子化條件，判別系統可能吸收或放出的能量值。
- code: T03
  name: 普朗克常數物理意義與因次單位
  desc: 由能量公式 E=hf 推導普朗克常數 h 的 SI 基本單位或 J·s 單位，並比較其量子尺度。
- code: T04
  name: 黑體輻射光譜與古典矛盾判別
  desc: 判讀黑體輻射能量強度對波長分布曲線隨溫度的變化，並說明古典理論無法解釋紫外線災變。
- code: T05
  name: 維因位移定律與溫度波長換算
  desc: 利用黑體輻射尖峰波長與絕對溫度成反比的關係，由已知溫度與波長推算未知表面溫度。
- code: T06
  name: 普朗克能量量子化與量子數計算
  desc: 依據振子能量為普朗克常數乘頻率的整數倍假設，計算輻射過程中釋放的能量量子數目。
- code: T07
  name: 普朗克常數因次與單位檢核
  desc: 將普朗克常數的單位展開並與角動量、動量或力矩乘時間等物理量的因次進行比對。
- code: T08
  name: 維恩位移定律波長與溫度換算
  desc: 應用λ_max·T=定值，由已知恆星或物體溫度與對應峰值波長推算另一溫度的輻射波長。
- code: T09
  name: 黑體輻射能量強度分布圖判讀
  desc: 由能量強度對波長分布曲線隨溫度的變化（峰值移動與曲線下面積變化），比較不同溫度高低。
- code: T10
  name: 普朗克能量量子化與振子能階
  desc: 依據E=nhf判斷簡諧振子能量不連續性，辨識符合或違反普朗克量子假設的能量組合。
