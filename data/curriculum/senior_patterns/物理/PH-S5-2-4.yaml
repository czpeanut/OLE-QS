unit:
  subject: 物理
  code: PH-S5-2-4
  title: 光電效應
status: draft
types:
- code: T01
  name: 愛因斯坦光電方程式與截止電壓
  desc: 聯立入射光子能量、功函數與截止電壓計算金屬的底限頻率或不同金屬底限頻率比。
- code: T02
  name: 截止電壓與光頻率關係圖斜率截距
  desc: 由截止電壓對入射光頻率直線圖的斜率求普朗克常數、橫截距求底限頻率。
- code: T03
  name: 光電流與入射光強度頻率影響
  desc: 判別改變入射光強度或頻率對飽和光電流大小及光電子最大動能的影響。
- code: T04
  name: 光電效應實驗現象與波動說矛盾
  desc: 說明極短延遲時間、底限頻率存在及最大動能與光強無關等支持光子論的關鍵證據。
- code: T05
  name: 光電流與外加電壓關係圖判讀
  desc: 從光電流－電壓曲線判讀飽和光電流、截止電壓以及兩組實驗光強與頻率的相對大小。
- code: T06
  name: 單光子能量與光源每秒光子數計算
  desc: 運用 E=hf=hc/λ 計算單一光子能量，並結合光源總功率求單位時間發出的光子數目。
- code: T07
  name: 光子能量計算與光源光子數
  desc: 應用E=hc/λ計算單一光子能量，並結合光源發射功率計算單位時間放射的光子數目。
- code: T08
  name: 光子動量與光壓加速度計算
  desc: 運用光子能量與動量關係E=pc及完全吸收或反射的動量變化，計算光壓或太陽帆加速度。
- code: T09
  name: 功函數與光電子最大動能計算
  desc: 利用功函數與底限波長換算及愛因斯坦光電方程式，計算單次照射下的最大波長或光電子最大動能。
- code: T10
  name: 雙波長照射聯立消元求功函數
  desc: 利用兩組不同波長入射光對應的最大動能比例關係，聯立方程式消去功函數並求解動能或底限波長。
- code: T11
  name: 光電子最大速率與頻率函數圖
  desc: 依據最大動能與入射光頻率線性關係，判讀光電子最大速率隨頻率變化的非線性曲線與截距意義。
- code: T12
  name: 光電效應結合磁場或帶電球電位
  desc: 將光電子最大動能結合均勻磁場圓周運動半徑，或計算孤立金屬球達截止電位時逸散的最大電子數比。
