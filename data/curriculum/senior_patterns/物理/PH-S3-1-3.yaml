unit:
  subject: 物理
  code: PH-S3-1-3
  title: 波的反射與透射
status: draft
types:
- code: T01
  name: 異質繩波反射透射波形與線密度
  desc: 依據反射波是否倒相與波速大小判斷兩段或多段相接彈性繩的線密度關係。
- code: T02
  name: 固定端與自由端反射時間位移圖
  desc: 追蹤脈衝經固定端或自由端反射後經過特定質點，繪製或判讀質點S-t關係圖。
- code: T03
  name: 多重介面連續反射與透射追蹤
  desc: 分析脈衝在繩結點與牆面之間經多次反射與透射後的振動方向、振幅與波速。
- code: T04
  name: 固定端與自由端反射波形倒正判別
  desc: 依據脈波返回原處時波形是否上下顛倒，判斷另一端點為固定端或自由端。
- code: T05
  name: 雙端點連續反射波形先後順序判斷
  desc: 追蹤脈波在左固定端與右自由端間往返反射的倒正變化與出現時間先後順序。
- code: T06
  name: 輕重繩交界反射與透射波性質比較
  desc: 比較波由輕繩進入重繩或重繩進入輕繩時，反射波與透射波的頻率、波速與倒正。
- code: T07
  name: 固定端反射波與合成波作圖繪製
  desc: 依指定時間後的波傳播距離在方格紙上畫出入射波、固定端反射波與疊加合成波。
- code: T08
  name: 異質繩波速與線密度波長計算
  desc: 結合波速與線密度平方根反比關係、波速公式及傳播時間，定量計算兩段繩的波速、波長或線密度比。
- code: T09
  name: 交界處反射透射脈波圖形辨識
  desc: 依據輕重繩交界處的相位倒轉與左右反轉原則，辨識反射波與透射波的脈衝波形示意圖。
