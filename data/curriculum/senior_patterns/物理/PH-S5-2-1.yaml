unit:
  subject: 物理
  code: PH-S5-2-1
  title: 電子的發現
status: draft
types:
- code: T01
  name: 陰極射線實驗性質與電場磁場偏折
  desc: 判別陰極射線為帶負電的電子束且性質與陰極材料無關，並由偏轉方向推論電性。
- code: T02
  name: 陰極射線性質與發現史判別
  desc: 辨識陰極射線為帶負電粒子流、電偏轉性質及湯姆森與密立坎實驗對測定電子質量的貢獻。
- code: T03
  name: 湯姆森實驗正交場求荷質比
  desc: 結合靜電加速與正交電磁場直線篩選及純磁場圓周偏轉，推導帶電粒子的荷質比公式。
- code: T04
  name: 陰極射線電場偏轉與幾何位移
  desc: 計算電子射入平行板均勻電場後的類平拋偏轉速度、偏轉位移與離開後打到屏幕的幾何比例。
- code: T05
  name: 密立坎油滴實驗電量公因數
  desc: 從多組油滴測得電量數據求取最大公因數，推算基本電荷的可能量值。
- code: T06
  name: 油滴靜力平衡與終端速度求電量
  desc: 聯立重力、靜電力與空氣阻力，求解靜止懸浮或等速升降油滴所帶的淨電量。
- code: T07
  name: 湯姆森實驗與電子荷質比測定
  desc: 結合靜電場加速與磁場圓周運動（qvB=mv^2/r）或正交電磁場偏折，求解電子荷質比e/m。
- code: T08
  name: 密立坎油滴實驗受力與電量
  desc: 分析油滴在重力、靜電力與空氣阻力下的平衡或等速運動，聯立方程式求解油滴帶電量或基本電荷。
