unit:
  subject: 物理
  code: PH-S5-1-2
  title: 電路分析
status: draft
types:
- code: T01
  name: 燈泡短路現象與電流變化
  desc: 分析電路發生短路時電流繞過負載導致總電阻驟降、電源線電流過大的現象。
- code: T02
  name: 串並聯電路等效電阻與電流
  desc: 計算電阻串聯與並聯後的總電阻，並求解各支路電流與端電壓分配。
- code: T03
  name: 惠斯頓電橋平衡條件判斷
  desc: 依據對角電阻乘積相等判斷電橋是否平衡，並計算電流計電流或待測電阻。
- code: T04
  name: 克希荷夫定律多迴路分析
  desc: 運用節點電流守恆與迴路電壓守恆列聯立方程式，求解複雜電路的電流與電位差。
- code: T05
  name: 開關啟閉對電路亮度影響
  desc: 判斷電路開關切換前後各燈泡兩端電壓與電流變化，進而比較燈泡亮度增減。
- code: T06
  name: 無窮與對稱電阻網路化簡
  desc: 利用自相似性建立二次方程式求解無窮階梯電阻，或利用節點對稱性簡化複雜電阻網路。
- code: T07
  name: 電阻變動引起分壓與電流消長
  desc: 分析電路中特定電阻器阻值減小或短路歸零時，總電阻變化對總電流、各支路電流與端電壓的影響。
- code: T08
  name: 非線性元件曲線圖讀值與功率
  desc: 讀取非歐姆燈泡的電流電壓特性曲線圖，求取串並聯燈泡的電流、等效電阻與電源供電功率。
