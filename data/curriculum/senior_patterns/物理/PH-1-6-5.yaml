unit:
  subject: 物理
  code: PH-1-6-5
  title: 原子光譜
status: draft
types:
- code: T01
  name: 原子能階躍遷與光譜成因觀念
  desc: 說明電子在定態軌道與高低能階間躍遷吸收或輻射特定光子，形成不連續光譜。
- code: T02
  name: 氫原子能階躍遷頻率波長比較
  desc: 依據 ΔE=hf=hc/λ 比較不同能階躍遷所放出光子的能量、頻率與波長大小。
- code: T03
  name: 氫原子躍遷能量頻率波長計算
  desc: 利用氫原子能階值（或 E_n=-13.6/n^2 eV）定量計算躍遷釋放光子的能量、頻率與波長。
- code: T04
  name: 氫原子各光譜系列極值比值
  desc: 計算來曼、巴耳末等不同光譜系列的最大或最小頻率、波長及能量比值。
- code: T05
  name: 高能階降回釋放光子種類計數
  desc: 計算單一或一群處於激發態的原子降回低能階過程中最多可放出的不同光子種類數。
- code: T06
  name: 原子光譜與光學色散綜合應用
  desc: 結合能階躍遷釋放的光子頻率差異與三稜鏡色散偏向角或光電效應進行綜合判斷。
- code: T07
  name: 波耳氫原子模型與發射光譜觀念
  desc: 判別原子光譜的不連續性、定態軌道不輻射電磁波，以及高能階躍遷至低能階放光子的條件。
- code: T08
  name: 氫原子能階躍遷光譜種類與排序
  desc: 計算電子由高能階降回低能階最多放出的光子種類數（組合數），或比較各躍遷頻率大小。
- code: T09
  name: 氫原子光譜系列極限頻率比計算
  desc: 運用氫原子能階公式計算來曼、巴耳末等光譜系列的最高頻率或最短波長比例。
- code: T10
  name: 能階差計算光子能量頻率與波長
  desc: 由n階能量公式算出躍遷能量差（eV），再換算為焦耳並求放出的電磁波頻率與波長。
- code: T11
  name: 原子光譜結合色散或光電效應
  desc: 由躍遷能階差比較兩光子的頻率高低，進而判斷三稜鏡色散偏折角度或能否引發光電效應。
- code: T12
  name: 波耳原子模型與穩定態能階假設
  desc: 辨識電子在特定穩定軌道繞核運動不輻射電磁波，打破古典電磁學預測。
- code: T13
  name: 電子能階躍遷與光譜連續性判別
  desc: 判別電子由高能階躍遷至低能階放出不連續明線光譜，且能量對應能階差。
- code: T14
  name: 氫原子能階高低與軌道半徑關係
  desc: 判斷電子距離原子核愈遠時其能階愈高、總能量愈大的分布特徵。
- code: T15
  name: 光譜譜線排列波長與光子能量比較
  desc: 依可見光譜線位置判別紅光到紫光的波長、頻率、光子能量及誘發光電效應能力。
- code: T16
  name: 元素特徵光譜與發光機制應用辨識
  desc: 辨識霓虹燈發光、星體元素鑑定與雷射單一波長源自原子內電子能階躍遷的特性。
- code: T17
  name: 連續、發射與吸收光譜判別
  desc: 區分白熾燈泡連續光譜、高溫氣體明線發射光譜與低溫氣體暗線吸收光譜成因。
- code: T18
  name: 波耳氫原子穩定態能階與不輻射
  desc: 依據波耳原子模型判別電子在特定穩定能階運動時不輻射電磁波的特性。
