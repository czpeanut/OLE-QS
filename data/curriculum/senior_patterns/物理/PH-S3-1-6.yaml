unit:
  subject: 物理
  code: PH-S3-1-6
  title: 水波
status: draft
types:
- code: T01
  name: 水波深淺區折射與波前方向
  desc: 利用深水區波速與波長較大的性質由折射波前或波線判斷水波行進方向。
- code: T02
  name: 兩同相點波源節線腹線總數計算
  desc: 依據波源間距與波長比值計算空間中或水波槽上穩定的節線與腹線總條數。
- code: T03
  name: 干涉條紋位置與波程差判讀
  desc: 由兩波源干涉圖樣中點所在節線或腹線序數推算兩波源到該點的波程差。
- code: T04
  name: 無節線條件與波源間距限制
  desc: 利用不產生任何節線的臨界間距條件求解兩天線或兩波源的最大允許距離。
- code: T05
  name: 波前概念、直線波反射與繞射條件
  desc: 判別同波前質點位移性質、由波前與反射面夾角求反射角及波長與缺口比對繞射影響。
- code: T06
  name: 水波深淺水區折射定律與波速比較
  desc: 運用波前圖與水波折射定律比較深淺水區的波速、波長、頻率與入射折射角。
- code: T07
  name: 兩點波源干涉求節腹線總數與波長
  desc: 利用波程差極值不超過兩波源距離的條件，計算水波槽中的節線或腹線總條數與波長範圍。
- code: T08
  name: 兩點波源干涉特定點波程差判別
  desc: 計算空間指定點到兩同相點波源的波程差，判斷所在節腹線序號或連線上的節點數。
