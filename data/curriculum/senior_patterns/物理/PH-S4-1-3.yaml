unit:
  subject: 物理
  code: PH-S4-1-3
  title: 電位能與電位
status: draft
types:
- code: T01
  name: 多點電荷空間電位疊加與比較
  desc: 利用電位純量疊加公式計算並比較空間各點電位高低與等位面位置。
- code: T02
  name: 均勻電場電位差與電位能變化
  desc: 結合平行板電位差關係式與電力作功計算帶電質點移動過程的電位能變化量。
- code: T03
  name: 帶電球殼接觸等電位與電荷分配
  desc: 聯立球殼電位公式與總電荷守恆求解不同半徑帶電金屬球導線相接後的平衡電位。
- code: T04
  name: 帶電圓環軸線電位能與能量守恆
  desc: 計算均勻帶電圓環對軸上點電荷的電位能並以力學能守恆求解點電荷通過環心速率。
- code: T05
  name: 尖端放電與氣體游離擊穿電場
  desc: 依據均勻電場與電壓間距關係分析高壓電極與蚊蟲介入引起空氣游離放電的條件。
- code: T06
  name: 電位與電位能定義及靜電力作功
  desc: 運用兩點電位差與電量乘積計算電位能變化，及靜電力或外力緩慢移動電荷所作的功。
- code: T07
  name: 多點電荷電位疊加與拆散系統作功
  desc: 運用純量疊加法計算多點電荷在特定點的電位、零電位處電場及拆散系統所需外力作功。
- code: T08
  name: 均勻電場等位面判讀與電位差計算
  desc: 利用等位面垂直於電力線與電位差等於電場乘沿電場方向距離，求平行板間電場或點電位。
- code: T09
  name: 帶電粒子電場運動功能定理應用
  desc: 依據電位能與動能轉換或靜電力作功推算粒子由靜止釋放的運動方向與板間電位差。
- code: T10
  name: 靜電感應與導線連導體球等電位
  desc: 分析靜電感應造成導體電位變化，及多導體球合併或導線連接達等電位後的電量與電位。
- code: T11
  name: 同心帶電球與球殼區間電場與電位
  desc: 分區計算帶電實心金屬球與同心帶電球殼在球內、兩球間、球殼內與球外各處的電場電位。
- code: T12
  name: 等位線與電場實驗操作與圖形
  desc: 判別碳板等位線實驗的探針與檢流計操作要點，及不同電極形狀的等位線圖樣。
