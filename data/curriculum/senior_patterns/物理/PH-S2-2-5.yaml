unit:
  subject: 物理
  code: PH-S2-2-5
  title: 力學能守恆：重力位能的一般形式
status: draft
types:
- code: T01
  name: 衛星變軌所需補充能量計算
  desc: 比較高低不同半徑圓軌道的總力學能差，計算人造衛星升高軌道至少需補充的能量。
- code: T02
  name: 圓軌道與橢圓轉移軌道綜合分析
  desc: 結合克卜勒第二定律（角動量守恆）與力學能守恆，分析衛星在切點變軌的速度與動能比。
- code: T03
  name: 零位面選定與重力位能計算
  desc: 依據指定零位面（無窮遠或地表）計算衛星或物體在重力場中的重力位能。
- code: T04
  name: 衛星圓軌道力學能與變軌能量
  desc: 利用圓軌道總力學能公式計算衛星由一軌道半徑變換至另一軌道所需提供能量。
- code: T05
  name: 地面發射衛星與脫離速度計算
  desc: 對地面發射至指定圓軌道或無窮遠的過程應用力學能守恆求解最小發射初速。
- code: T06
  name: 橢圓軌道角動量與能量守恆聯立
  desc: 聯立近日點與遠日點的角動量守恆及總力學能守恆推導橢圓軌道能量與動能。
