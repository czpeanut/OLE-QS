unit:
  subject: 物理
  code: PH-1-2-1
  title: 物體的運動
status: draft
types:
- code: T01
  name: 位移與路徑長及平均速率
  desc: 區分向量位移與純量路徑長，並計算平均速度量值與平均速率。
- code: T02
  name: 速度與加速度方向及關係
  desc: 判別速度、速度變化量與加速度方向，釐清瞬時速度為零時加速度未必為零。
- code: T03
  name: 運動函數圖形斜率與面積
  desc: 由x-t、v-t、a-t圖的斜率或面積求速度、加速度、位移或判斷運動型態。
- code: T04
  name: 等加速度直線運動公式求解
  desc: 套用等加速度運動學公式求解末速、煞車距離、時間或平均加速度。
- code: T05
  name: 自由落體與鉛直上拋對稱
  desc: 分析重力加速度下自由落體或上拋運動的最高點性質、時間與速度變化。
- code: T06
  name: 分段等速與相對運動分析
  desc: 處理多段運動平均速率、往返相遇總路徑長或二維獨立分運動時間問題。
- code: T07
  name: 圓周運動平均加速度計算
  desc: 依據路徑與時間求平均速率，並利用向量差除以時間計算平均加速度量值。
- code: T08
  name: 位移路徑長與平均速度
  desc: 區分位移與路徑長、平均速度與平均速率，並由起終點及總時間計算。
- code: T09
  name: 運動圖形斜率與面積判讀
  desc: 利用 x-t、v-t、a-t 圖的斜率或曲線下面積，判讀或計算速度、加速度與位移。
- code: T10
  name: 自由落體與鉛直上拋
  desc: 將重力加速度視為定值，計算物體自由下落或鉛直拋射的高度、速度與時間。
- code: T11
  name: 運動學基本物理量定義辨析
  desc: 辨別位移與路徑長、平均速率與平均速度、瞬時速率與加速度方向對快慢及軌跡的影響。
- code: T12
  name: 單位換算與等加速公式求解
  desc: 將時速換算為公尺/秒後，套用等加速度運動公式求解時間、加速度或位移。
- code: T13
  name: v-t圖斜率面積與圖形轉換
  desc: 由v-t圖的斜率求加速度、面積求位移，並將分段運動轉換為對應的x-t或a-t圖形。
- code: T14
  name: a-x圖判讀與面積求速度變化
  desc: 判讀a-x圖中的等速與加減速區段，並利用a-x圖面積計算速度平方變化量。
- code: T15
  name: 分段等加速與平均速率限制
  desc: 繪製或列式處理區間測速等分段加減速過程，依總距離與總時間限制反推末速率上限。
- code: T16
  name: 運動函數圖形斜率與面積判讀
  desc: 利用 x-t 圖斜率求速度、v-t 圖斜率求加速度及面積求位移，比較多物運動。
- code: T17
  name: 自由落體與等加速公式計算
  desc: 應用等加速度運動公式計算落體高度、時間、反應時間或末速度。
- code: T18
  name: x-t與v-t運動圖形判讀
  desc: 由位置或速度對時間關係圖判讀物體的加速度、位移與阻力變化趨勢。
- code: T19
  name: 自由落體與鉛直拋射運動求解
  desc: 分析重力場中自由落體或鉛直上拋物體的高度、時間與初速比值。
