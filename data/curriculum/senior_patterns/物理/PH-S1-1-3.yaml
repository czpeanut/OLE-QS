unit:
  subject: 物理
  code: PH-S1-1-3
  title: 物理量的因次
status: draft
types:
- code: T01
  name: 運用因次分析反推未知公式形式
  desc: 已知物理量間的相依變數與各量因次，利用兩側因次相等反求目標物理量的指數組合。
- code: T02
  name: 基本量與導出量因次換算
  desc: 將常見力學或電磁學物理量轉換為質量、長度、時間等基本因次冪次組合。
- code: T03
  name: 未知係數或常數因次推求
  desc: 依據經驗公式兩側因次相等的原則反推未知物理量或常數的因次與單位。
- code: T04
  name: 因次與物理量異同判別
  desc: 辨識相同物理量與不同物理量是否可能具有相同因次的概念判別。
- code: T05
  name: 基本因次式推導與表示法
  desc: 將速率、力、能量或電磁學物理量以質量M、長度L、時間T、電流A表示。
