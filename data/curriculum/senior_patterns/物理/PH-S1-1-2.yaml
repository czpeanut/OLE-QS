unit:
  subject: 物理
  code: PH-S1-1-2
  title: 不確定度的組合
status: draft
types:
- code: T01
  name: 單一與分段測量精確度比較
  desc: 比較直接測量總長與分別測量後組合不確定度的誤差大小並說明原因。
- code: T02
  name: 密度與面積間接測量誤差
  desc: 結合質量、長度或體積測量不確定度推求間接物理量之表示法。
- code: T03
  name: 物理量加減運算的組合不確定度
  desc: 利用各獨立測量值標準不確定度的平方和開根號計算和或差的組合不確定度。
- code: T04
  name: 物理量乘除運算的相對不確定度
  desc: 利用各測量值相對不確定度的平方和開根號計算乘積或商的組合不確定度。
- code: T05
  name: 冪次與多變數函數的不確定度傳遞
  desc: 計算含有平方或高次方物理量的組合不確定度與最佳估計值修整。
