unit:
  subject: 物理
  code: PH-1-4-5
  title: 都卜勒效應
status: draft
types:
- code: T01
  name: 都卜勒效應適用波種與成因
  desc: 辨識都卜勒效應同時適用於力學波（聲波）與電磁波（光波），源自波源與觀察者相對運動。
- code: T02
  name: 光波紅移藍移與天體運動
  desc: 依據遠方星光光譜的紅移或藍移現象，推斷天體相對於地球遠離或接近。
- code: T03
  name: 光的紅移與藍移天文觀測判讀
  desc: 比對遠方星系與地球元素光譜的譜線偏移方向，推論星系遠離或接近。
- code: T04
  name: 聲波都卜勒效應頻率變化
  desc: 判斷聲源接近或遠離觀察者時，接收到的聲音頻率升高或降低的定性關係。
- code: T05
  name: 光波紅移與藍移天文應用
  desc: 依據星系遠離或接近地球時光譜波長變長（紅移）或變短（藍移），推論天體運動方向。
- code: T06
  name: 雙向觀測反推光源原波長
  desc: 由左右兩側觀察者測得的色光紅移與藍移結果，反推靜止光源原本發出的光色。
- code: T07
  name: 電磁波譜頻率排序與都卜勒偏移
  desc: 結合各波段電磁波頻率高低順序，判別高速運動波源所測得的頻率偏移方向。
- code: T08
  name: 多觀察者聲源相對速度頻率比較
  desc: 同時比較多個靜止或迎面運動觀察者與不同波源速度組合下聽到的聲音頻率。
