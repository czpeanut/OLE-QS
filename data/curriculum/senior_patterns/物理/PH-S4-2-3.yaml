unit:
  subject: 物理
  code: PH-S4-2-3
  title: 載流導線所受的磁力
status: draft
types:
- code: T01
  name: 封閉或彎曲載流導線有效長度磁力
  desc: 利用均勻磁場中彎曲載流導線受力等效於頭尾連線的性質求解封閉迴路所受淨磁力。
- code: T02
  name: 非均勻磁場中垂直導線受力與力矩
  desc: 結合安培右手定則與開掌定則分析垂直異面兩載流導線間產生之磁力與旋轉力矩。
- code: T03
  name: 載流導線在磁場中力平衡與傾斜
  desc: 聯立重力、張力或摩擦力與安培磁力求解載流直導線保持平衡所需電流或磁場。
- code: T04
  name: 載流線圈在均勻磁場中磁力矩計算
  desc: 計算通電線圈面與磁場夾特定角度時所受磁力矩大小與轉動方向。
- code: T05
  name: 電流天平實驗原理與待測磁場
  desc: 利用電流天平槓桿力矩平衡反推螺線管內部待測磁場量值。
- code: T06
  name: 安培磁力方向與量值基本計算
  desc: 運用右手開掌定則判斷載流直導線在磁場中所受安培磁力方向，並以電流、長度與磁場夾角計算受力大小。
- code: T07
  name: 封閉迴路淨磁力與磁力矩分析
  desc: 分析封閉載流線圈置於垂直或平行均勻磁場時，有效長度為零使總磁力為零但可能存在磁力矩。
- code: T08
  name: 多段折線與斜向直導線磁力合成
  desc: 逐段運用右手開掌定則與電流磁場夾角計算各段直導線受力大小與方向，再進行向量合成。
