unit:
  subject: 物理
  code: PH-S1-6-2
  title: 地球表面的重力
status: draft
types:
- code: T01
  name: 星球表面g值與密度半徑比例
  desc: 將球體質量表示為M=ρ(4/3)πR^3代入地表g=GM/R^2，推導g與密度、半徑及單擺、彈簧週期的變化倍數。
- code: T02
  name: 彈簧秤異星測量反推物體質量
  desc: 先於地表測出彈簧原長與彈性常數，再將同一彈簧秤移至已知g值的外星表面依伸長量反推物體質量。
- code: T03
  name: 高度與深度對重力加速度的影響
  desc: 計算離地高h處g值衰減比例，或利用均勻球殼內部無重力推論深入地底r處的g值比例。
- code: T04
  name: 地球自轉對視重力加速度的修正
  desc: 考慮不同緯度向心加速度分量對地面正向力的影響，比較赤道與兩極處的視重量差異。
- code: T05
  name: 鉛直上拋或單擺測量星球表面重力
  desc: 依據異星表面的拋體最大高度或小角度單擺週期，反推該星球的表面重力加速度。
