unit:
  subject: 物理
  code: PH-S2-1-4
  title: 角動量與力矩
status: draft
types:
- code: T01
  name: 單力與多力對指定轉軸之力矩
  desc: 運用 τ=rFsinθ 計算單力或平面多力對特定轉軸產生的順逆時針合力矩。
- code: T02
  name: 轉動過程力臂與力矩變化分析
  desc: 分析施力方向或物體夾角連續改變時，作用力對轉軸的垂直力臂與力矩增減趨勢。
- code: T03
  name: 質點相對於定點的角動量計算
  desc: 運用 L=r×p（r_⊥·mv）計算直線或曲線運動質點相對於觀察者的角動量量值與方向。
- code: T04
  name: 角動量守恆與轉速變化計算
  desc: 依據系統合力矩為零時角動量守恆（mr^2ω=定值），求解半徑改變後的新角速度。
- code: T05
  name: 力矩定義、力臂計算與多力合力矩
  desc: 依據τ=rFsinθ計算單一力（如扭矩扳手、細桿轉動）或平面多力對指定轉軸產生的合力矩與大小比較。
- code: T06
  name: 質點角動量計算與參考點幾何比較
  desc: 運用L=r×p計算質點或雙球系統對特定點的角動量，或比較圓周運動質點對圓周上定點的角動量與變化率。
- code: T07
  name: 錐動擺對圓心與懸點角動量比
  desc: 分別計算錐動擺擺錘對圓心O與對懸點A的角動量量值，並求出兩者的幾何三角函數比值。
- code: T08
  name: 剛體與生活情境之角動量守恆應用
  desc: 判別系統外力矩為零時角動量守恆（如跳水選手縮身加快轉速），並區分動量守恆與角動量守恆條件。
- code: T09
  name: 行星近日遠日點角動量守恆
  desc: 依據萬有引力指向太陽故力矩為零，判別行星在近日點與遠日點角動量相等及速率與距離反比關係。
- code: T10
  name: 力矩計算與合力矩正負方向合成
  desc: 利用 τ=rFsinθ 計算多力對指定轉軸的力矩大小，依順逆時針方向代數相加求合力矩。
- code: T11
  name: 質點角動量定義與守恆條件判別
  desc: 辨識角動量向量定義 L=r×p、量值公式及外力矩為零時角動量守恆的成立條件。
- code: T12
  name: 錐動擺與有心力角動量判別
  desc: 判斷單擺、錐動擺或有心力運動中對特定參考點的合外力矩是否為零與角動量守恆性。
- code: T13
  name: 力矩定義、單位、方向性與支軸
  desc: 辨識力矩為向量、須指定支軸並理解其單位與功在物理意義上的差異。
- code: T14
  name: 力臂判讀與不同施力方向力矩比較
  desc: 依據作用力向量與參考支軸的垂直距離計算並比較不同施力的力矩大小。
