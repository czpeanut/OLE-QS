unit:
  subject: 物理
  code: PH-S5-3-4
  title: 無所不在的守恆律
status: draft
types:
- code: T01
  name: 系統守恆律綜合判別
  desc: 依據系統所受外力、外力矩與非保守力作功條件，判別動量、角動量與力學能是否守恆。
- code: T02
  name: 質量能量守恆與核反應計算
  desc: 結合愛因斯坦質能互換與能量守恆定律，分析微觀粒子衰變或反應前後的總能守恆。
- code: T03
  name: 電荷守恆與粒子交互作用判別
  desc: 運用反應前後總電荷數與重子數守恆，檢驗基本粒子反應或衰變方程式的合理性。
- code: T04
  name: 微中子假說與衰變守恆驗證
  desc: 依據β衰變過程中能量、動量與角動量守恆的實驗矛盾，說明微中子存在的推論依據。
- code: T05
  name: 對稱性與守恆律對應概念
  desc: 辨識空間平移、旋轉與時間平移對稱性分別對應動量、角動量與能量守恆的物理意義。
