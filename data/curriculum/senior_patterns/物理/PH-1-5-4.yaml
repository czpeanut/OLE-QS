unit:
  subject: 物理
  code: PH-1-5-4
  title: 質能守恆
status: draft
types:
- code: T01
  name: 核反應質量虧損與質能互換
  desc: 計算核反應前後的總質量虧損 Δm，並運用 ΔE=Δmc^2 求解釋放能量。
- code: T02
  name: 核能轉電能或熱能跨單元計算
  desc: 將核反應釋放的能量進一步換算為電能度數或計算水體吸收後的升溫幅度。
- code: T03
  name: α衰變與β衰變次數計算
  desc: 依據質量數與原子序守恆，計算放射性原子核衰變鏈中經歷的α與β衰變次數。
- code: T04
  name: 核能發電原理與核分裂比較
  desc: 區分核電廠反應爐（控制棒、低濃縮鈾）與原子彈、核熔合的機制與特性差異。
- code: T05
  name: 核廢料與核融合優缺點判別
  desc: 判別核分裂發電產生放射性核廢料的問題及核融合反應的潛在優勢與條件。
- code: T06
  name: 質能互換公式計算核反應能量
  desc: 計算核反應前後反應物與生成物的質量虧損，並代入E=mc^2求釋放的總能量與電能度數。
- code: T07
  name: α與β衰變次數與核種守恆計算
  desc: 利用衰變前後質量數與原子序（電荷）守恆聯立求解，求取經歷的α衰變與β衰變次數。
- code: T08
  name: 核分裂與核融合發電原理辨析
  desc: 比較核分裂與核融合的燃料種類、反應條件、控制棒作用及放射性廢料特性。
- code: T09
  name: 質能互換公式與能量質量換算
  desc: 應用 E=mc^2 計算核反應前後質量虧損所釋放的巨大能量。
- code: T10
  name: 核反應質量數與電荷數守恆
  desc: 依據α、β或γ衰變前後質量數與原子序總和不變推算產物或粒子數目變化。
- code: T11
  name: 核分裂與核融合反應機制與比較
  desc: 區分核電廠重核分裂與太陽內部輕核融合的反應條件、產物與優缺點。
- code: T12
  name: 核輻射αβγ射線性質與偏轉
  desc: 比較三種核輻射的帶電性、穿透力及在電場或磁場中的偏轉方向。
- code: T13
  name: 核反應與化學反應的本質差異辨識
  desc: 判別化學反應僅涉及電子重排而核反應會改變原子核種類與原子序的差異。
