unit:
  subject: 物理
  code: PH-S2-1-2
  title: 動量守恆定律
status: draft
types:
- code: T01
  name: 一維互推彈開與反衝問題
  desc: 利用系統水平合外力為零，由一維動量守恆求解兩人互推或彈簧彈開後的速度與質量比。
- code: T02
  name: 相對速度與人車拋物問題
  desc: 在移動台車或船上拋出物體時，轉換相對速度為對地速度並由動量守恆求車船末速。
- code: T03
  name: 雙質點總動量與二維爆炸守恆
  desc: 對二維平面內的爆炸分裂或雙質點系統進行動量向量合成與分解，求解未知碎片速率。
- code: T04
  name: 動量守恆成立條件與內外力判別
  desc: 判斷系統在特定方向是否滿足合外力為零，以確認動量守恆與受力反作用力關係。
- code: T05
  name: 動量守恆定性判別與分方向條件
  desc: 判斷系統在特定方向是否受外力為零，決定該方向總動量是否守恆並辨別內力與外力作用。
- code: T06
  name: 一維黏合爆炸與跳車動量守恆
  desc: 對丟背包、砲車後座、黏土落下黏合或人跳上移動台車等過程，列寫一維動量守恆方程式求解末速。
- code: T07
  name: 相對速度轉換結合系統動量守恆
  desc: 將人相對於車或砲彈相對於砲車的相對速度轉換為對地速度後，再列總動量守恆方程式求解。
- code: T08
  name: 拋體最高點爆裂與二維動量守恆
  desc: 在斜拋最高點或水平運動中發生爆裂，利用爆炸瞬間內力極大使總動量守恆求解各碎片初速與比值。
- code: T09
  name: 彈簧壓縮釋放雙球之動量與速度比
  desc: 分析光滑面上彈簧推開兩球過程，判斷兩球受力、動量變化大小相等與速率和質量成反比關係。
- code: T10
  name: 動量守恆條件與內外力判別
  desc: 判斷系統所受合外力為零或特定方向外力為零時該方向的動量守恆性質。
- code: T11
  name: 拋體空中爆炸與質心運動結合分析
  desc: 分析拋體爆炸瞬間動量守恆與爆炸後各碎片在重力下仍做相同加速度的拋體運動特性。
