unit:
  subject: 物理
  code: PH-1-1-4
  title: 物理學簡介
status: draft
types:
- code: T01
  name: 重要物理學家貢獻配對
  desc: 對應伽利略、牛頓、法拉第、愛因斯坦等科學家的核心發現或理論提出者。
- code: T02
  name: 科學史經典論述與實驗意義
  desc: 判讀物理史上具轉折意義的名言或關鍵實驗所揭示的自然規律。
- code: T03
  name: 科學家與物理學史配對
  desc: 依據物理發展史，辨識經典與近代重要科學家的代表性定律或實驗貢獻。
- code: T04
  name: 物理學史與科學家貢獻配對
  desc: 依力學、熱學、電磁學、光學與近代物理的關鍵發現，配對科學家與其核心理論或實驗。
- code: T05
  name: 巨觀現象與微觀機制對應
  desc: 區分巨觀與微觀尺度定義，並從微觀原子、分子運動或能階躍遷解釋巨觀物態與發光現象。
- code: T06
  name: 伽利略科學方法論與實驗檢驗
  desc: 辨識伽利略以數學論證、提出假設與實驗檢驗真理開創實驗物理學的貢獻。
- code: T07
  name: 近代物理與愛因斯坦奇蹟年貢獻
  desc: 對應愛因斯坦質能互換、光電效應、布朗運動與狹義相對論等近代物理突破。
- code: T08
  name: 古典力學奠基與數學物理詮釋
  desc: 判別伽利略對自由落體與運動學的數學詮釋及為牛頓力學奠基的歷史定位。
- code: T09
  name: 電磁效應發現與實驗現象判別
  desc: 辨識厄斯特發現電流產生磁場使磁針偏轉的電磁學史關鍵實驗。
