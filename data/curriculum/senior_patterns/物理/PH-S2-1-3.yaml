unit:
  subject: 物理
  code: PH-S2-1-3
  title: 質心運動與系統總動量
status: draft
types:
- code: T01
  name: 質心定義與質心重力心區辨
  desc: 運用質心坐標公式計算位置，並區分質心與重心在均勻或無重力場中的差異。
- code: T02
  name: 質心速度與系統總動量計算
  desc: 利用系統總動量等於總質量乘以質心速度，求解二維或多質點系統的質心速度量值。
- code: T03
  name: 系統內力作用質心位置不變
  desc: 在靜止船隻或光滑面上人員互換位置時，利用系統水平質心不動求解船體位移或未知質量。
- code: T04
  name: 空中爆炸碎片之質心軌跡分析
  desc: 依據外力（重力）決定質心加速度的原理，分析砲彈或飛機空中爆炸後的質心軌跡與落點。
- code: T05
  name: 離散質點與挖空幾何質心坐標
  desc: 運用加權平均公式求多質點重心坐標，或使用負質量挖空法求解缺角幾何板片的質心偏移量。
- code: T06
  name: 質心速度加速度與阿特午機
  desc: 由各質點質量、速度與加速度計算系統質心速度與質心加速度，或先求外力和與阿特午機張力加速度。
- code: T07
  name: 系統質心不動求各體人船位移
  desc: 系統初靜止且水平不受外力時質心位置不變，利用m1Δx1+m2Δx2=0求解人互換位置或磁鐵相吸之位移。
- code: T08
  name: 爆裂後質心軌跡反推碎片位置
  desc: 利用爆裂前後外力（重力）不變故質心維持原拋物線或自由落體運動，由一碎片位置反推另一碎片質量或高度。
- code: T09
  name: 質心運動定理計算系統所受外力和
  desc: 運用系統外力合力等於總質量乘以質心加速度（或各質點ma向量和），求解系統外力和。
- code: T10
  name: 離散質點或連續體質心坐標計算
  desc: 依據各質點質量與坐標位置加權平均計算系統質心的位置坐標。
- code: T11
  name: 系統總動量與質心速度加速度關係
  desc: 驗證系統總動量等於總質量乘以質心速度，及外力合力等於總質量乘以質心加速度。
- code: T12
  name: 拋體或落體爆炸分裂之質心軌跡
  desc: 判斷僅受重力作用的飛行物體在空中爆炸分裂後，所有碎片質心的運動軌跡。
- code: T13
  name: 爆炸分裂由質心位置反求碎片高度
  desc: 運用爆炸前後系統質心運動軌跡不變的特性，由已知碎片位置反求另一碎片高度。
