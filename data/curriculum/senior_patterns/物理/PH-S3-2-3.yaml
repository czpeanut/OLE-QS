unit:
  subject: 物理
  code: PH-S3-2-3
  title: 聲音的共振
status: draft
types:
- code: T01
  name: 氣柱共鳴水面位置與波長推算
  desc: 利用相鄰兩次共鳴水面的距離等於半波長推算下一個共鳴點位置。
- code: T02
  name: 氣柱共鳴管口修正量與音叉頻率
  desc: 不計管口末端效應誤差直接以相鄰共鳴點距離差求波長並計算音叉頻率。
- code: T03
  name: 兩端開口伸縮管共鳴頻率求解
  desc: 依據伸縮管拉長距離對應半波長整數倍的共鳴條件推求固定音源的頻率。
- code: T04
  name: 單擺與物體自然頻率共振判別
  desc: 根據單擺週期僅與擺長有關的性質判斷哪個單擺能與驅動擺產生共振。
- code: T05
  name: 自然頻率與共振條件及現象判別
  desc: 說明系統以自然頻率週期性受驅動時振幅劇增的共振條件與音叉共鳴現象。
- code: T06
  name: 閉管空氣柱駐波節腹點與共鳴條件
  desc: 判別閉管開口端為位移腹點、閉口端為位移節點，及滿足四分之一波長奇數倍的頻率。
- code: T07
  name: 氣柱共鳴調水面測聲速或音叉頻率
  desc: 利用氣柱共鳴實驗相鄰兩共鳴水面高度差等於半波長的關係計算聲速或未知頻率。
- code: T08
  name: 固定管長連續變頻測得共鳴次數
  desc: 在固定管長與指定頻率區間內，計算閉管或開管空氣柱所能產生的所有共鳴次數。
- code: T09
  name: 弦線與空氣柱跨系統共振頻率匹配
  desc: 令兩端固定弦線某諧音頻率等於閉管或開管空氣柱某諧音頻率以求解波速比。
- code: T10
  name: 雙共鳴點間距反推未知音叉頻率
  desc: 已知空氣中聲速與第一、二次共鳴水面高度差，計算波長並反推未知音叉頻率。
- code: T11
  name: 多組共鳴刻度數據平均求音叉頻率
  desc: 由多次共鳴水面刻度表計算相鄰間距平均值求波長，進而求得音叉振動頻率。
- code: T12
  name: 氣柱共鳴非整數數據近似頻率估算
  desc: 處理具實驗誤差的非整數共鳴空氣柱長度差，計算聲波波長並估算音叉近似頻率。
- code: T13
  name: 氣柱共鳴延伸共鳴位置與變頻預測
  desc: 由多組共鳴位置推算聲速並判斷管長內是否能找到下一共鳴點及改變頻率的效應。
- code: T14
  name: 氣柱共鳴實驗操作規範與溫度影響
  desc: 判別蓄水器注水操作、音叉不可觸碰管口、音量判讀及室溫對第一共鳴點位置的影響。
