unit:
  subject: 物理
  code: PH-1-5-1
  title: 能量的形式
status: draft
types:
- code: T01
  name: 能量單位辨識與換算
  desc: 辨識焦耳、卡、大卡、電子伏特與電度等能量單位，並區別功率單位（瓦特）。
- code: T02
  name: 食物熱量與運動消耗計算
  desc: 利用營養素熱量係數與運動消耗表進行熱量攝取、代謝與減脂目標計算。
- code: T03
  name: 能量與功率單位的辨識與區分
  desc: 辨識焦耳、電子伏特、度（kW·h）、大卡等能量單位，並與瓦特等功率單位區分。
- code: T04
  name: 熱量單位與食物熱量換算應用
  desc: 依據三大營養素熱量與運動消耗數據，計算減重或日常活動的能量收支平衡。
- code: T05
  name: 功的定義與各方向施力作功計算
  desc: 依據施力與位移夾角判別正功、負功或零功，並計算等速或曲線運動中的作功大小。
- code: T06
  name: 各種能量形式與轉換過程辨識
  desc: 識別光能、化學能、熱能、電能與核能等能量形式在自然或科技過程中的轉換。
- code: T07
  name: 功的定義與各力作功正負判別
  desc: 依據施力與位移夾角判斷重力、正向力或推力對物體作正功、負功或零功。
- code: T08
  name: 熱功當量與力學能轉換熱能計算
  desc: 運用熱功當量與能量守恆換算重力位能或運動消耗熱量與水溫變化或樓層數。
- code: T09
  name: 功率與時間圖求總功與平均功率
  desc: 利用P-t圖曲線下面積計算總消耗能量或作功，並除以總時間求平均功率。
- code: T10
  name: 動能與重力位能公式比例計算
  desc: 運用動能與重力位能定義式，比較兩物體質量、速率或高度改變後的能量比例。
