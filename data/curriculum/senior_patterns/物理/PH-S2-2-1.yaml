unit:
  subject: 物理
  code: PH-S2-2-1
  title: 功與動能
status: draft
types:
- code: T01
  name: 恆力作功與動能公式比例計算
  desc: 運用 W=F·dcosθ 與 K=(1/2)mv^2=p^2/(2m) 計算作功大小或動量動能倍率關係。
- code: T02
  name: F-x 圖面積求作功與動能
  desc: 利用 F-x 圖曲線下面積代表外力作功，判斷質點在各位置的動能大小與極值。
- code: T03
  name: 雙物體相對滑行摩擦作功分析
  desc: 結合動量守恆與摩擦力對系統作功（熱能損耗），求解疊放物體間的相對滑行距離。
- code: T04
  name: 定力作功計算與各力作功正負判別
  desc: 依據W=Fdcosθ計算定力作功，或根據施力與位移夾角判別重力、張力、正向力與摩擦力作功正負及是否為零。
- code: T05
  name: 功能定理求末速率與滑行距離
  desc: 運用合力作功等於物體動能變化量（W_net=ΔK），直接求解加速度距離、分段定力作功或撤去外力之最小施力。
- code: T06
  name: 推力與拉力作功及摩擦力作功比較
  desc: 比較斜向推力與拉力在不同正向力與摩擦力條件下，移動相同距離時各力作功與加速度之異同。
- code: T07
  name: 變力F-x圖作功與最大速率
  desc: 繪製或判讀F-x圖形面積計算變力作功（如拉回懸崖人體），或由F-x圖正負面積累積判斷質點最大速率位置。
- code: T08
  name: 角動量守恆結合功能定理求功
  desc: 先由行星近遠日點角動量守恆求速率與動能比，再利用功能定理求萬有引力對行星所作之功。
- code: T09
  name: 各力作功正負判別與零功條件分析
  desc: 依據施力與位移夾角或軌跡閉合性判斷重力、拉力、正向力在特定過程的作功是否為零。
- code: T10
  name: 等速或變力過程多力作功
  desc: 運用功能定理 W合=ΔK 與保守力作功 Wg=-ΔU，分析等速或加速過程各力作功的代數關係。
- code: T11
  name: 定力與摩擦力作功計算
  desc: 計算正向力、重力或動摩擦力在給定位移下所作的正功或負功。
- code: T12
  name: F-x圖形面積求變力作功
  desc: 利用外力與位移關係圖曲線下面積計算變力作功並結合動能變化求末速。
- code: T13
  name: 功能定理與斜拋重力作功
  desc: 應用合力作功等於動能變化量求解拋體或直線運動中單一力作功。
- code: T14
  name: 含摩擦力斜面往返功能定理
  desc: 利用往返過程重力作功為零或全程功能定理求解動摩擦力或所需最小外力。
