unit:
  subject: 物理
  code: PH-S2-2-3
  title: 力學能守恆：地表附近的重力位能
status: draft
types:
- code: T01
  name: 光滑斜面與拋射力學能守恆
  desc: 在僅有重力作功的斜面或拋射運動中，利用 K+U_g=定值 求解特定高度的速率或方向角。
- code: T02
  name: 鉛直面圓周運動與力學能守恆
  desc: 結合力學能守恆與向心力公式（F_c=mv^2/R），求解單擺或軌道在最高低點的張力或最小初速。
- code: T03
  name: 反彈高度與力學能損耗比例
  desc: 由反彈前後的最大高度比，推算系統最大重力位能差、最大動能及速度量值的比例關係。
- code: T04
  name: 保守力辨識與力學能守恆條件判別
  desc: 區分重力、彈力、電磁力等保守力與摩擦力等非保守力，並判斷力學能守恆成立條件。
- code: T05
  name: 非保守力損耗與多次反彈
  desc: 結合力學能守恆與反彈高度比計算各次著地前最大動能、速率比或損失的能量百分比。
- code: T06
  name: 保守力與非保守力判別
  desc: 根據作功是否與路徑無關判別重力、彈力與摩擦力等保守力性質。
- code: T07
  name: 鉛直圓軌道最高點臨界與能量守恆
  desc: 結合最高點法向力為零的圓周條件與力學能守恆求解最小初速或高度。
- code: T08
  name: 滑輪連結體力學能守恆求解
  desc: 以多物體系統總力學能守恆計算特定位移時單一物體的動能或速率。
- code: T09
  name: 動量與力學能雙守恆滑動軌道
  desc: 對光滑可自由滑動曲面與小球系統聯立水平動量守恆與力學能守恆求末速。
- code: T10
  name: 空氣阻力下力學能損耗計算
  desc: 比較初態與末態的總力學能差值計算非保守力造成的力學能損耗。
