unit:
  subject: 物理
  code: PH-1-4-4
  title: 光波的特性
status: draft
types:
- code: T01
  name: 波動基本性質與橫縱波區分
  desc: 區分力學波與非力學波、橫波與縱波，並判讀振動頻率與人類聽覺範圍。
- code: T02
  name: 週期波波速波長頻率計算
  desc: 由質點振動次數、時間與波峰波谷距離求頻率、週期、波長及波速。
- code: T03
  name: 光與聲波的反射現象及應用
  desc: 區分鏡面反射與漫反射，並辨識平面鏡與凹面鏡（如額鏡）聚焦反射的成像應用。
- code: T04
  name: 光的折射現象與視深影長
  desc: 利用光在不同介質中折射偏折原理，解釋池水變淺、海市蜃樓與裝水池桿影較短。
- code: T05
  name: 波的繞射條件與生活現象
  desc: 比較波長與障礙物或狹縫寬度的相對大小，判斷繞射明顯程度與隔牆聞聲原理。
- code: T06
  name: 雙波源水波槽干涉條紋判讀
  desc: 依據兩點波源波峰與波谷重疊圖形，判斷空間各點屬於建設性或破壞性干涉。
- code: T07
  name: 光的微粒說與波動說爭論
  desc: 比較牛頓微粒說與惠更斯波動說對反射、折射、水空氣中光速及繞射的預測差異。
- code: T08
  name: 惠更斯原理與波前傳播
  desc: 利用波前上各點可視為新子波源的惠更斯原理，解釋波的傳播、折射與繞射。
- code: T09
  name: 光與水波折射及介質波速
  desc: 判別波在不同介質中折射的主因為波速改變，而頻率維持不變。
- code: T10
  name: 光的干涉繞射與薄膜色散
  desc: 辨識雙狹縫干涉、單狹縫繞射、光碟或肥皂泡薄膜干涉等證明光波動性的現象。
- code: T11
  name: 光的直進反射與視覺對比
  desc: 運用光的直進、反射、漫射或透光率與環境光強度對比解釋日常光學現象。
- code: T12
  name: 光在真空與不同介質中之波速比較
  desc: 比較不同色光在真空中速率相同，以及進入不同折射率介質後的速率變化。
- code: T13
  name: 波形圖判讀質點振動方向
  desc: 依據波的前進方向與瞬間波形圖，判斷繩上或介質中特定質點的瞬時振動方向。
