unit:
  subject: 物理
  code: PH-S4-3-2
  title: 電磁感應的應用
status: draft
types:
- code: T01
  name: 交流發電機磁通量與電動勢函數
  desc: 根據線圈在均勻磁場中轉動的角度推導磁通量與瞬時應電動勢的正餘弦時間函數。
- code: T02
  name: 發電機線圈磁力矩與換向時機
  desc: 判別交流發電機線圈轉動過程中磁力矩最大位置與感應電流方向反轉的臨界位置。
- code: T03
  name: 理想變壓器電壓電流與匝數比
  desc: 應用理想變壓器線圈匝數比與輸入輸出功率守恆求解副線圈電壓電流與電阻等效。
- code: T04
  name: 渦電流磁煞車與電磁阻尼應用
  desc: 解釋金屬板或導電管通過磁場時因渦電流產生磁阻力達成減速煞車的原理。
- code: T05
  name: 遠距離高壓輸電與線路功率損耗
  desc: 結合升壓變壓器與輸電線電阻計算提高輸送電壓對減少焦耳熱損耗的比例關係。
