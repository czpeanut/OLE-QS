unit:
  subject: 物理
  code: PH-S2-2-2
  title: 功率
status: draft
types:
- code: T01
  name: 瞬時功率定義與點積計算
  desc: 運用 P=F·v=Fvcosθ 計算物體在特定瞬間（如拋射或斜面著地）受力的瞬時功率。
- code: T02
  name: 平均功率定義計算（P=W/t）
  desc: 計算克服重力或外力作功後除以總時間，求攀登樓梯或搬運貨物的平均功率。
- code: T03
  name: 含休息時間或路徑之功率比較
  desc: 比較經斜面與鉛直上拉貨物所需施力與作功，並計入休息間隔時間比較兩者的長期平均功率。
- code: T04
  name: 瞬時功率P=Fvcosθ計算
  desc: 根據某瞬間物體速度與外力夾角計算重力或牽引力的瞬時功率。
- code: T05
  name: 平均功率P=W/t計算
  desc: 計算特定時距內外力或重力所作總功除以時間求平均功率。
- code: T06
  name: 功率與運動學結合推算
  desc: 先以等加速運動求末速或位移再計算各階段的瞬時與平均功率。
