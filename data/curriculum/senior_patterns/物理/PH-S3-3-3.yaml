unit:
  subject: 物理
  code: PH-S3-3-3
  title: 透鏡的原理及應用
status: draft
types:
- code: T01
  name: 透鏡浸入不同折射率液體會聚發散
  desc: 依據透鏡與周圍介質折射率相對大小判斷平行光經凸凹透鏡後的偏折趨勢。
- code: T02
  name: 薄透鏡成像公式與放大率求解
  desc: 聯立物像距離關係、放大率與薄透鏡公式求解凸透鏡或凹透鏡的焦距與位置。
- code: T03
  name: 視力矯正近遠視眼鏡度數與光路
  desc: 根據明視距離或遠點計算眼鏡焦距與度數並繪製矯正鏡片成像於視網膜光路。
- code: T04
  name: 薄透鏡種類、成像性質與光學儀器
  desc: 辨識凹凸透鏡形狀、水中焦距變化與色差，及照相機、近視遠視眼鏡等儀器成像。
- code: T05
  name: 透鏡成像公式與物像大小移動方向
  desc: 運用高斯透鏡公式與放大率判斷實虛像位置、線性或縱向物體成像長度及移動方向。
- code: T06
  name: 固定物屏距移動透鏡兩次成像法
  desc: 利用物屏固定時兩次成清晰實像的物像距對稱性，求透鏡焦距、移動距離與像高。
- code: T07
  name: 特殊光線作圖與幾何光圓法求焦距
  desc: 繪製平行主軸與過鏡心特殊光線決定透鏡種類與焦點，或由屏幕光圓相似三角形求焦距。
- code: T08
  name: 視差法與插針法測定透鏡焦距實驗
  desc: 依據視差法觀察虛像與參考物偏移方向判斷調整方向，或由插針數據計算透鏡焦距。
- code: T09
  name: 薄透鏡成像實驗數據與作圖分析
  desc: 利用測得的物距與像距實驗數據，透過倒數作圖法驗證薄透鏡公式並求焦距。
