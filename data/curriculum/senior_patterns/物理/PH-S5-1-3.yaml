unit:
  subject: 物理
  code: PH-S5-1-3
  title: 電功率
status: draft
types:
- code: T01
  name: 電功率公式選用與輸電線損耗計算
  desc: 區分 P=IV、P=I^2 R 與 P=V^2/R 的適用時機，計算負載功率或高壓輸電的線路熱損耗。
- code: T02
  name: 串並聯燈泡電功率與明亮度比較
  desc: 依據各燈泡分配到的電流或端電壓計算消耗電功率，排列複雜電路中多個相同燈泡的明亮度。
- code: T03
  name: 非理想電池內電阻與輸出功率分析
  desc: 計入電池內電阻消耗的焦耳熱，由總化學能、端電壓與電流求解電池內電阻與輸出效率。
- code: T04
  name: 電器額定規格與電阻功率計算
  desc: 依據電器標示的額定電壓與功率反求等效電阻，或計算非額定電壓下的實際消耗功率。
- code: T05
  name: 用電度數與電費累積計算
  desc: 將電器功率換算為千瓦並乘以使用時數，計算總消耗電能度數與應繳電費。
- code: T06
  name: 電功率公式計算與串並聯比例
  desc: 運用P=IV=I^2R=V^2/R計算負載電功率，或由串並聯燈泡功率比反推電阻與電流比。
- code: T07
  name: 焦耳定律電熱轉換與比熱升溫
  desc: 結合電熱能Q=I^2Rt與熱量公式計算密閉氣體、液體或電熱器的溫度變化與莫耳數。
- code: T08
  name: 電池電動勢端電壓與充放電分析
  desc: 區分放電電池（V=ε-Ir）與充電電池（V=ε+Ir），計算迴路電流、端電壓與輸出功率。
- code: T09
  name: 電能與力學能轉換功率計算
  desc: 利用電動機或電動車的輸入電功率等於克服重力作功功率（IV=mgvsinθ），求解電流或速率。
- code: T10
  name: 含馬達非純電阻電路電壓分析
  desc: 在含電池、電阻與馬達的直流迴路中，利用能量守恆或迴路電壓降求解迴路電流與端電壓。
