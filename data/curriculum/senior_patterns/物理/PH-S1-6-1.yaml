unit:
  subject: 物理
  code: PH-S1-6-1
  title: 萬有引力定律
status: draft
types:
- code: T01
  name: 萬有引力比較不同質量半徑力
  desc: 運用萬有引力與兩質點質量乘積成正比、距離平方成反比，比較多顆衛星或星球所受重力大小。
- code: T02
  name: 均勻球殼與實心球外部重力比
  desc: 將均勻球殼或實心球對外部質點的萬有引力等效為質量集中於球心，依球心距比較重力大小。
- code: T03
  name: 圓弧質量分布圓心重力場疊加
  desc: 利用對稱性與向量合成法，計算四分之一圓周或半圓周均勻分布質量在圓心處產生的重力加速度。
- code: T04
  name: 多質點萬有引力疊加與平衡
  desc: 利用對稱性與向量合成求正三角形等幾何配置中心或頂點質點所受總重力及質量比。
- code: T05
  name: 雙星系統繞共同質心圓周運動計算
  desc: 以兩星間萬有引力為向心力，聯立質心位置關係求解雙星各自軌道半徑、速率、週期與動能。
- code: T06
  name: 萬有引力基本概念與扭秤實驗
  desc: 辨析萬有引力定律的平方反比與連心線方向特性，以及卡文迪西扭秤實驗測量G值的原理。
- code: T07
  name: 多邊形中心質點萬有引力疊加
  desc: 利用幾何對稱性與向量合成法，計算正三角形或正六邊形頂點質點對中心質點的總萬有引力。
- code: T08
  name: 共線天體幾何距離換算求引力
  desc: 先由天體與太空船的共線相對位置求得真實球心距，再代入萬有引力公式計算所受引力。
- code: T09
  name: 等邊三星頂點引力合成與繞行
  desc: 將等邊三角形頂點另兩顆質點的萬有引力進行向量合成，求三星系統各質點所受向心合力。
