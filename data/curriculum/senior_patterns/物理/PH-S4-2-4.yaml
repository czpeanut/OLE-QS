unit:
  subject: 物理
  code: PH-S4-2-4
  title: 帶電質點在磁場中的運動
status: draft
types:
- code: T01
  name: 均勻磁場圓周運動週期與角速率
  desc: 利用向心力等於磁力推導帶電粒子做圓周運動的半徑、週期、角速率與速率無關性。
- code: T02
  name: 有界磁場偏折角度與逗留時間
  desc: 根據粒子入射有界磁場的幾何對稱性求圓心角進而計算在磁場內的偏折時間。
- code: T03
  name: 斜向入射均勻磁場的螺旋線螺距
  desc: 分解速度為平行與垂直磁場分量並結合迴旋週期比較不同粒子的螺旋運動螺距。
- code: T04
  name: 速度選擇器與質譜儀質量推求
  desc: 利用正交電磁場直線篩選速率後進入純磁場偏轉，由落點距離反推粒子質量或荷質比。
- code: T05
  name: 勞侖茲力不作功與磁場擺動分析
  desc: 依據磁力恆與速度垂直的特性判別磁力不作功對速率、軌跡與繩張力的影響。
- code: T06
  name: 帶電粒子入均勻磁場軌跡總結
  desc: 依入射速度與磁場夾角分類討論直線、圓周與螺旋線三種可能運動軌跡。
- code: T07
  name: 勞侖茲磁力方向判別與地磁偏轉
  desc: 運用右手開掌定則判斷運動正負電荷在地磁場或外加磁場中所受勞侖茲力的偏轉方向。
