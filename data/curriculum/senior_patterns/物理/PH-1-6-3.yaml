unit:
  subject: 物理
  code: PH-1-6-3
  title: 物質的波動性
status: draft
types:
- code: T01
  name: 物質波機率波物理意義判讀
  desc: 理解德布羅意物質波代表微觀粒子在空間出現的機率分布，且不需介質傳播。
- code: T02
  name: 物質波實驗驗證（電子繞射干涉）
  desc: 辨識戴維森-革末電子繞射與湯姆森電子干涉實驗如何證實實物粒子具波動性。
- code: T03
  name: 電子雙狹縫干涉條紋成因分析
  desc: 解釋單一電子通過雙狹縫後在屏幕上累積形成亮暗干涉條紋的機率分布機制。
- code: T04
  name: 物質波機率詮釋與存在意義判別
  desc: 理解德布羅意物質波並非電磁波或機械波，而是代表微觀粒子在空間出現的機率分布。
- code: T05
  name: 電子繞射與雙狹縫干涉實驗判別
  desc: 辨識電子束干涉、戴維森-革末實驗與電子雙狹縫亮暗紋，作為驗證物質波動性的依據。
- code: T06
  name: 物質波概念與電子雙狹縫干涉判別
  desc: 辨識電子或微觀粒子通過雙狹縫產生干涉條紋需以物質波動性解釋。
- code: T07
  name: 物質波與力學電磁波本質區分
  desc: 區分德布羅意物質波與聲波等力學波、光波等電磁波的物理意義與介質需求。
- code: T08
  name: 電子雙狹縫干涉實驗與物質波證據
  desc: 解釋電子束通過雙狹縫產生干涉條紋的實驗結果，判斷速率對條紋的影響。
- code: T09
  name: 物質波機率分布與量子力學詮釋
  desc: 說明微觀粒子出現位置遵守波函數的機率分布而非古典力學的確定軌跡。
