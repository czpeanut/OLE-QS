unit:
  subject: 物理
  code: PH-S3-2-1
  title: 聲波的傳播
status: draft
types:
- code: T01
  name: 縱波位移圖與空氣壓力圖轉換
  desc: 依據縱波質點位移對位置圖的疏密分布判斷對應的空氣壓力－位置關係圖。
- code: T02
  name: 不同介質聲速差異與時間差求距
  desc: 利用聲波在固體與空氣中傳播速率不同造成的時間差反推聲源距離。
- code: T03
  name: 聲波性質、聽覺範圍與溫度波速
  desc: 判斷聲速與音調音量的獨立性，並依室溫聲速計算人耳可聽頻率對應的波長範圍。
- code: T04
  name: 閃光與聲音時間差及回聲測距計算
  desc: 利用不同溫度聲速與光速差距及時間差計算距離高度，或分析空間反射回聲效應。
- code: T05
  name: 聲波與電磁波介質、波形與速率
  desc: 比較聲納超聲波與雷達電磁波的縱橫波本質、真空傳播能力與介質中波速差異。
- code: T06
  name: 縱波位移或壓力圖判讀疏密與速度
  desc: 由空氣分子位移或壓力對位置關係圖判斷密部、疏部位置、壓力大小與質點振動速度。
- code: T07
  name: 兩聲源連線上干涉強度分布求波長
  desc: 判讀兩相向喇叭連線上的聲音強度極大極小分布位置以推算聲波波長。
- code: T08
  name: 聲波跨介質波速與波長頻率變化
  desc: 判斷聲波由一介質傳入另一介質時，波速、波長與頻率的變化關係。
- code: T09
  name: 聲波隨溫度分布折射與傳播距離
  desc: 利用聲速隨空氣溫度變化的特性，解釋夜間或不同高度溫層中聲波折射與傳播遠近現象。
- code: T10
  name: 縱波疏密性質與質點振動特徵
  desc: 依據活塞簡諧運動形成縱波的物理圖像，判斷疏密部傳播速率、質點振動與波動公式波速。
- code: T11
  name: 溫度聲速波長與可聞聲範圍
  desc: 利用氣溫聲速公式與波速波長關係，計算特定頻率聲波波長並判別是否屬於人耳可聽見或超音波範圍。
- code: T12
  name: 聲音三要素波速獨立與吸音
  desc: 判讀波形圖比較響度、音調與音色，理解聲速與音調音量無關以及多孔介質對聲波的吸收作用。
- code: T13
  name: 深海聲波道折射與聲速深度圖
  desc: 判讀海中聲速隨深度變化圖形，並依據波往波速較慢處偏折的波導原理分析深海聲波道中心軸。
