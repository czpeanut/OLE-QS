unit:
  subject: 物理
  code: PH-1-6-4
  title: 波粒二象性
status: draft
types:
- code: T01
  name: 光的波粒二象性與互補原理
  desc: 判別光在干涉繞射中顯現波動性、在光電效應顯現粒子性，且無法同時觀測兩者。
- code: T02
  name: 光與物質二象性實驗證據綜合
  desc: 綜合辨識雙狹縫干涉、光電效應、電子繞射等實驗各自驗證的波動或粒子性質。
- code: T03
  name: 光與物質波粒二象性綜合判別
  desc: 綜合干涉繞射（波動性）與光電效應（粒子性）實驗證據，判別波粒二象性與互補原理正誤。
- code: T04
  name: 光與物質皆具波粒二象性概念判別
  desc: 辨識光子與電子等微觀粒子在不同實驗條件下同時展現波動性與粒子性。
- code: T05
  name: 光與物質波粒二象性實驗證據判別
  desc: 結合光電效應與粒子繞射干涉實驗，辨識該實驗現象所需用到的光與粒子二象性。
