unit:
  subject: 物理
  code: PH-S1-3-2
  title: 平面運動的描述
status: draft
types:
- code: T01
  name: 曲線運動平均速度與速率
  desc: 依據平面軌跡上的直線位移與實際弧長除以經過時間計算平均速度與平均速率。
- code: T02
  name: 平面碰撞轉彎平均加速度
  desc: 將二維平面初末速度以正交分量或向量作圖相減，求解平均加速度量值與方向。
- code: T03
  name: 曲線切線與法線加速度分解
  desc: 將已知加速度向量沿速度方向與垂直速度方向正交分解，求切線加速度與法線加速度。
- code: T04
  name: 平面參數式求速度與加速度
  desc: 給定 x(t) 與 y(t) 參數方程，分別計算各分量導數並合成瞬時速率與加速度。
- code: T05
  name: 曲率半徑與法線加速度關係計算
  desc: 利用法線加速度等於速率平方除以曲率半徑求解曲線特定點的曲率半徑。
- code: T06
  name: 平面運動向量與曲率性質判別
  desc: 辨析平面運動中瞬時與平均速率、速度量值差異，以及曲線運動必具備法線加速度之運動性質。
- code: T07
  name: 圓周或轉向運動平均加速度
  desc: 利用等速圓周切線速度夾角或正交轉向的幾何向量差，計算指定時間區間內的平均加速度。
