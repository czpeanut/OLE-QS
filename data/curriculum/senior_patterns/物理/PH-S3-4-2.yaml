unit:
  subject: 物理
  code: PH-S3-4-2
  title: 光的干涉
status: draft
types:
- code: T01
  name: 雙狹縫干涉強度分布與現象辨識
  desc: 辨識理想雙狹縫干涉的等寬等強條紋強度分布圖，及油膜、肥皂泡與光碟干涉現象。
- code: T02
  name: 楊氏雙狹縫干涉公式與條紋間距
  desc: 運用雙狹縫光程差與條紋間距公式計算亮暗紋位置、角度及參數變動對間距的影響。
- code: T03
  name: 雙波長雙狹縫干涉條紋重疊求解
  desc: 利用兩種波長的亮暗紋距離相等條件，求特定位置條紋重疊時的未知光波長。
- code: T04
  name: 雙狹縫干涉浸入不同折射率介質
  desc: 依據光進入折射率為n的液體後波長縮短為1/n倍，計算干涉條紋級數或間距的變化。
- code: T05
  name: 薄膜干涉與光碟凹洞破壞性干涉
  desc: 考慮光在薄膜或保護層內的波長縮短與往返波程差，計算破壞性干涉所需的最小深度。
- code: T06
  name: 非小角近似與旋轉狹縫光程差計算
  desc: 應用精確光程差公式求大角度暗紋夾角，或計算狹縫平面旋轉後的有效縫距與條紋倍數。
- code: T07
  name: 特定級數亮暗紋光程差直接求解
  desc: 由屏幕上亮暗紋級數與單色光波長，直接計算該點至兩狹縫的光程差量值。
- code: T08
  name: 多色光干涉條紋寬度與物理量排序
  desc: 比較紅、綠、藍等單色光干涉條紋間距，並連結波長、頻率、介質波速與光子能量。
- code: T09
  name: 雙狹縫參數變動與條紋間距比例
  desc: 分析改變波長、狹縫間距或光屏距離時，相鄰亮暗紋間距的變化趨勢與比例倍數。
- code: T10
  name: 基準紋距推算暗紋位置與條紋比對
  desc: 由中央亮帶寬度或第一暗紋位置推算指定暗紋距離，或比對條紋數目反推未知波長。
- code: T11
  name: 雙狹縫干涉與單狹縫繞射實驗聯立
  desc: 於同一光學裝置交替使用雙狹縫與單狹縫，聯立暗紋位置條件求解雷射波長與縫寬。
- code: T12
  name: 雙狹縫裝置條件與白光色彩判別
  desc: 辨析單孔準直大小、狹縫寬度與狹縫間距的差異，及白光干涉條紋彩色分布順序。
