unit:
  subject: 物理
  code: PH-S5-3-3
  title: 原子核
status: draft
types:
- code: T01
  name: 核反應質量數與原子序守恆平衡
  desc: 依據反應前後總質量數與總電荷數守恆推求未知轟擊粒子或生成核種。
- code: T02
  name: 半衰期與放射性衰變個數估算
  desc: 利用指數衰變律或相鄰時間間隔衰變比例估算後續時間內衰變的原子核數目。
- code: T03
  name: 質量虧損與核反應釋放能量計算
  desc: 應用愛因斯坦質能互換公式計算核分裂或核融合反應所釋放的結合能或能量。
- code: T04
  name: 三種放射線性質與磁場偏折判別
  desc: 比較α、β、γ三種射線的組成粒子、穿透力、游離能力及電磁場中的偏折差異。
- code: T05
  name: 核分裂與核融合反應條件與應用
  desc: 辨析重核分裂與輕核融合的反應機制、鏈式反應控制及核能發電原理。
- code: T06
  name: 連續α與β衰變鏈次數聯立求解
  desc: 列立原子核連續經歷多次α與β衰變的質量數與電荷數聯立方程式，求解各衰變次數。
- code: T07
  name: 半衰期倍數與剩餘質量時間換算
  desc: 依據指數衰變半衰期或固定分率衰變週期，推算經多個週期後的剩餘質量或總耗時。
- code: T08
  name: 放射性衰變曲線圖判讀半衰期
  desc: 從放射性元素原子存量對時間的衰變曲線圖中，直接讀取質量減半所需的半衰期時間。
