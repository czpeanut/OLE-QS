unit:
  subject: 物理
  code: PH-S4-1-2
  title: 電場與電力線
status: draft
types:
- code: T01
  name: 多點電荷空間合電場大小比較
  desc: 利用點電荷電場公式與向量疊加原理比較空間中不同位置處的合電場量值。
- code: T02
  name: 連續圓弧電荷分布電場對稱合成
  desc: 運用對稱抵銷原則比較不同圓心角均勻帶電圓弧在圓心處產生的電場大小。
- code: T03
  name: 電力線分布判讀電場電位與電性
  desc: 依據電力線疏密、方向與不相交特性判斷電荷電性、電量大小、電場與電位高低。
- code: T04
  name: 靜電平衡導體殼內部感應電場
  desc: 應用導體達靜電平衡時內部合電場為零的性質反推感應電荷在球心處的電場。
- code: T05
  name: 帶電質點在均勻電場中運動軌跡
  desc: 分析帶電粒子射入平行金屬板均勻電場後的類平拋偏折軌跡與不撞板臨界初速。
- code: T06
  name: 電場定義與多點電荷電場向量合成
  desc: 依據電場定義與單位計算或合成三角形、正方形等對稱位置多點電荷在特定點的電場。
- code: T07
  name: 電力線分布圖判讀電場與電荷電量
  desc: 依據電力線由正電荷出發終止於負電荷、數目正比於電量且不相交的特性判別電場。
- code: T08
  name: 帶電粒子於均勻電場平衡或單擺
  desc: 分析帶電質點在水平或鉛直均勻電場與重力場共同作用下的靜力平衡偏角或單擺等效週期。
- code: T09
  name: 帶電粒子射入平行板電場偏轉軌跡
  desc: 結合平行板均勻電場受力與類斜拋運動學求解粒子偏轉位移、動能變化及比荷關係。
- code: T10
  name: 靜電平衡導體與同心球殼感應電荷
  desc: 依據靜電平衡導體內部電場為零與表面電力線垂直性質，推算同心球殼感應電荷與電場。
- code: T11
  name: 帶電圓環軸線電場與微擾簡諧運動
  desc: 推導均勻帶電圓環軸線電場分布，並計算異性點電荷在軸心附近微擾簡諧運動週期與速率。
- code: T12
  name: 實驗測繪等位線與電力線分布
  desc: 辨識等位線與電場測繪實驗的儀器接線、探針操作步驟及不同形狀電極間的電力線圖形。
