unit:
  subject: 物理
  code: PH-S5-2-5
  title: 物質波
status: draft
types:
- code: T01
  name: 加速電壓與物質波波長比例關係
  desc: 結合動能與動量關係推導帶電粒子物質波波長與加速電壓平方根成反比的計算。
- code: T02
  name: 物質波雙狹縫干涉條紋間距變化
  desc: 聯立雙狹縫干涉條紋間距公式與物質波波長公式求解動能改變後的條紋間距倍數。
- code: T03
  name: 電子繞射實驗與晶體散射驗證
  desc: 說明戴維森－革末實驗或湯姆森電子繞射驗證實物粒子具有波動性的證據。
- code: T04
  name: 光子與實物粒子動量波長比較
  desc: 比較相同動能或相同波長下光子、電子與質子的德布羅意波長或動量大小。
- code: T05
  name: 巨觀物體與微觀粒子物質波估算
  desc: 計算日常巨觀物體或微觀粒子的德布羅意波長並解釋為何巨觀物體難以觀察繞射。
- code: T06
  name: 物質波機率波與波粒二象性概念
  desc: 辨識物質波作為機率波函數的物理意涵，及實物粒子與光子在波粒二象性上的異同。
- code: T07
  name: 侷限空間物質波駐波波長與動能
  desc: 利用電子被侷限於一維區間形成兩端為節點的物質波駐波條件，推導允許的波長與動能公式。
