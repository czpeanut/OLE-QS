unit:
  subject: 物理
  code: PH-S5-3-2
  title: 波耳氫原子模型
status: draft
types:
- code: T01
  name: 能階躍遷差值與發射光子能量
  desc: 利用里茨組合原則由兩個已知躍遷發射電磁波能量差計算第三組躍遷的光子能量。
- code: T02
  name: 氫原子能階能量與光譜波長計算
  desc: 應用氫原子能階公式計算電子在不同主量子數間躍遷所吸收或放出的光子頻率與波長。
- code: T03
  name: 氫原子角動量量子化與軌道半徑
  desc: 結合波耳角動量量子化條件與物質波駐波概念推導軌道半徑與速率量子化關係。
- code: T04
  name: 原子激發與電子碰撞能量轉移
  desc: 判斷特定動能電子或特定能量光子撞擊基態氫原子能否被吸收並躍遷至高能階。
- code: T05
  name: 氫原子光譜譜系判別與譜線條數
  desc: 計算一群處於第n能階的氫原子躍遷回基態最多可發出的光譜線總數與所屬譜系。
- code: T06
  name: 類氫離子能階躍遷與游離能比
  desc: 利用類氫離子能階與原子序平方成正比關係比較不同離子的躍遷光子能量與游離能。
- code: T07
  name: 物質波駐波條件與軌道波長計算
  desc: 結合圓周長為物質波整數倍駐波條件與軌道半徑量子化關係，計算不同能階電子物質波波長。
- code: T08
  name: 氫原子物理量與量子數標度關係
  desc: 比較波耳氫原子模型中軌道半徑、速率、週期、能量、角動量與相鄰能階差隨量子數n的變化比例。
- code: T09
  name: 均勻磁場電子圓周軌道量子化
  desc: 聯立均勻磁場中的羅倫茲力向心力與角動量量子化條件，推導電子軌道半徑與量子數開根號正比。
