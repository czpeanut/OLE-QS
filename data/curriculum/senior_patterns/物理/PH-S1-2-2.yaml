unit:
  subject: 物理
  code: PH-S1-2-2
  title: 物體運動圖
status: draft
types:
- code: T01
  name: 紙帶打點求瞬時速度與加速度
  desc: 利用打點計時器頻率決定時間間隔，由相鄰點距求平均速度（中間時刻瞬時速度）與等加速度。
- code: T02
  name: x-t圖斜率與曲率判讀運動狀態
  desc: 利用 x-t 圖切線斜率求瞬時速度，並由凹向判別加速度方向與大小比較。
- code: T03
  name: a-t圖積分求極值與最遠距
  desc: 由 a-t 圖面積計算速度變化量，進而找出速度極值時刻並計算累積總位移。
- code: T04
  name: 分段運動v-t圖與平均速度
  desc: 將加速、等速、減速過程繪製成 v-t 圖，利用梯形或三角形面積求全程平均速度。
- code: T05
  name: x-t圖斜率與運動狀態判讀
  desc: 由位置－時間圖的切線斜率與交點判斷瞬時速度、折返點及回到原點次數。
- code: T06
  name: v-t圖斜率面積與位移計算
  desc: 利用速度－時間圖的斜率求加速度，並以曲線下面積計算位移與路徑長。
- code: T07
  name: v-t圖追及與多次相遇問題
  desc: 比較兩物體v-t圖的面積差與交點時刻以判斷追及條件與再次相遇時間。
- code: T08
  name: a-t圖面積求速度變化與位移
  desc: 計算加速度－時間圖曲線下面積求速度變化量，再結合初速推算各時刻速度與位移。
