unit:
  subject: 物理
  code: PH-S5-1-1
  title: 電阻與歐姆定律
status: draft
types:
- code: T01
  name: 電阻定律與導線幾何形變電阻計算
  desc: 應用 R=ρL/A 計算導線電阻，或求解導線均勻拉長、對摺後的新電阻倍數。
- code: T02
  name: 電阻率與溫度關係及導電材料比較
  desc: 判讀金屬或半導體電阻率隨溫度變化的曲線圖，比較不同導電材料的電阻率與導電性。
- code: T03
  name: 電阻定律與幾何形變比例計算
  desc: 應用電阻與長度成正比、截面積成反比的關係，計算導線拉伸或規格改變後的電阻比。
- code: T04
  name: 電阻率特性與溫度影響判別
  desc: 辨識電阻率僅與材料及溫度有關而與幾何形狀無關，並判別金屬與半導體溫度係數差異。
- code: T05
  name: 非歐姆元件I-V曲線電阻判讀
  desc: 從電流對電壓曲線讀取特定電壓下的電阻值，並區分定值比與切線斜率的差異。
- code: T06
  name: 伏安法高低電阻接法與誤差分析
  desc: 繪製安培計內接與外接電路圖，並依電表內電阻計算待測電阻的系統測量誤差。
- code: T07
  name: 電阻定律與導體幾何形變換算
  desc: 運用R=ρL/A計算導線拉長、壓縮或不同半徑與長度比時的電阻、電阻率與電場大小比。
- code: T08
  name: 微觀電流載子數與漂移速率
  desc: 應用I=neAv_d與Q=It求解導線或離子流中的自由電子數密度、粒子數目或漂移速率。
- code: T09
  name: 非歐姆元件I-V圖判讀與求值
  desc: 由非線性元件或導線的電流－電壓關係圖讀取特定電壓下的電流並計算等效電阻。
- code: T10
  name: 歐姆定律電表內接與外接誤差
  desc: 考慮安培計與伏特計內電阻的影響，聯立串並聯分壓分流求電表讀數或待測電阻真實值。
- code: T11
  name: 分段導體串並聯電場與電位差
  desc: 結合歐姆定律與均勻電場E=V/d，計算串聯或並聯導體各段內的電流、電位差與電場強度。
