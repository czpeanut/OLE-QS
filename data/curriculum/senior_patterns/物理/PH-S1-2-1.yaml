unit:
  subject: 物理
  code: PH-S1-2-1
  title: 運動學簡介
status: draft
types:
- code: T01
  name: 位移路徑長與平均速度速率計算
  desc: 依起終點位置與實際路徑計算多段直線運動的平均速度與平均速率。
- code: T02
  name: 位置時間函數微分求速度與折返
  desc: 對位置函數 x(t) 求一階導數得瞬時速度，並判別速度變號的折返次數。
- code: T03
  name: 瞬時速度與瞬時加速度函數推導
  desc: 由速度函數或加速度函數求特定時刻的瞬時運動物理量。
- code: T04
  name: 同向加速與減速運動的方向判別
  desc: 依據速度與加速度同號或異號判斷質點做加速運動或減速運動。
- code: T05
  name: 平均加速度與瞬時加速度概念區分
  desc: 比較某時距內的平均加速度與極短時距趨近於零的瞬時加速度定義。
- code: T06
  name: 位移與路徑長向量定義及折返計算
  desc: 區分位移為具方向性的向量與路徑長為純量，並計算一維折返運動的位移與路徑長。
- code: T07
  name: 位移與速率不等式下界判別
  desc: 應用路徑長恆大於等於位移量值及平均速率不小於平均速度量值的關係排錯。
- code: T08
  name: 瞬時與平均速度方向及速率關係
  desc: 辨析瞬時速度大小必等於瞬時速率，及位置、位移與速度方向間的獨立性。
- code: T09
  name: 車流安全間距與最大流量速限估算
  desc: 利用雙向車道數、安全車距與每小時車流量估算合理的道路行車速率限制。
