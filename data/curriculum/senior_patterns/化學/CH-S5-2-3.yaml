unit:
  subject: 化學
  code: CH-S5-2-3
  title: 醛和酮
status: draft
types:
- code: T01
  name: 醛與酮的命名、構造與物理性質
  desc: 依據IUPAC規則命名醛類與酮類，並比較羰基極性、沸點、水溶性及甲醛等常見成員性質。
- code: T02
  name: 多侖試劑與斐林試液鑑別醛酮
  desc: 利用銀鏡反應與斐林試液氧化醛基（含甲酸與甲酸酯）的特性，區分醛類與酮類或檢驗氧化產物。
- code: T03
  name: 含羰基化合物異構物計數與推算
  desc: 依據分子式與不飽和度計算含醛基或酮基的異構物總數，或由燃燒分析結合銀鏡反應反推醇類結構。
- code: T04
  name: 醛酮與其他含氧化合物綜合鑑別
  desc: 結合石蕊試紙、金屬鈉、多侖試劑、溴水與氣味特徵，系統性區分並鑑定多種未知有機液體。
- code: T05
  name: 醛與酮結構命名與異構物
  desc: 辨識醛基與酮基結構、進行中文系統命名，或由特定分子式推寫醛酮同分異構物。
- code: T06
  name: 醛與酮的氧化及銀鏡斐林檢驗
  desc: 利用多侖試劑（銀鏡反應）與斐林／本氏試液（紅色沉澱）區分醛類、甲酸、還原醣與酮類。
- code: T07
  name: 未知有機物鑑別流程與推論
  desc: 結合金屬鈉、溴水、斐林試劑與碳酸鈉等系列檢驗現象，反推未知醛酮醇酸等有機物種類。
- code: T08
  name: 醛與酮的製備（醇氧化與炔加水）
  desc: 由一級與二級醇控制氧化、臭氧分解或炔烴水合重排反應，預測生成的醛類或酮類產物。
- code: T09
  name: 多侖試劑與斐林試劑鑑別還原性
  desc: 利用多侖試劑銀鏡反應與斐林試劑磚紅色沉澱，區分醛類、甲酸、還原糖與酮類化合物。
- code: T10
  name: 含氧有機物氧化與鑑別矩陣推論
  desc: 結合過錳酸鉀褪色、二氧化碳逸出與斐林試劑實驗結果表，逐一鑑定未知醇醛酮試劑。
- code: T11
  name: 醛酮的氧化還原與炔類水合製備
  desc: 判斷醛氧化成羧酸、酮不易氧化的性質，以及乙炔或端炔在硫酸汞與稀硫酸催化下水合生成醛或酮。
- code: T12
  name: 醛酮與醇類氧化還原轉換
  desc: 判斷一級醇、二級醇、醛、酮與羧酸間的氧化或催化加氫還原反應條件與預期產物。
- code: T13
  name: 醛酮物理性質與沸點比較
  desc: 依據分子極性與無法形成分子間氫鍵之特性，比較醛、酮與同碳數醇、羧酸或醚的沸點。
- code: T14
  name: 醛與酮的系統命名與同分異構物
  desc: 依羰基位置進行醛酮IUPAC命名，並判別特定分子式所含醛類與酮類結構異構物。
- code: T15
  name: 醛酮還原與親核加成反應產物推斷
  desc: 預測醛與酮經氫氣催化還原成醇、碘仿反應或與氫氰酸加成後的主要產物結構。
