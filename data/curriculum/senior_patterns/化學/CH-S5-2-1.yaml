unit:
  subject: 化學
  code: CH-S5-2-1
  title: 有機鹵化物
status: draft
types:
- code: T01
  name: 鹵烷命名與物理性質比較
  desc: 依據IUPAC規則命名有機鹵化物，並比較其沸點、密度、溶解度及常見應用（如氯仿、特夫綸、DDT）。
- code: T02
  name: 鹵烷的水解取代與脫去反應
  desc: 區分鹵烷與強鹼水溶液（取代生成醇）及醇溶液（脫去生成烯）的反應條件與產物。
- code: T03
  name: 鹵烷製備與元素分析推分子式
  desc: 結合烷類鹵化取代、烯炔加成及一鹵取代物重量百分率計算，推求未知有機鹵化物或母體烷類。
- code: T04
  name: 鹵烷製備途徑與加成反應推斷
  desc: 由烷類鹵化取代或烯炔類與鹵素、鹵化氫加成反應，預測有機鹵化物主產物。
- code: T05
  name: 有機鹵化物物理性質與環境應用
  desc: 判別常見鹵烷溶劑毒性、殺蟲劑DDT與BHC特性，以及氟氯碳化物對臭氧層的影響。
- code: T06
  name: 鹵烷異構物計數與反應性比較
  desc: 計算特定分子式有機鹵化物的結構或順反異構物數目，並比較不同鹵烷的反應性。
- code: T07
  name: 氟氯碳化物與環境影響判別
  desc: 辨識氟氯碳化物及含鹵素農藥的化學性質、用途與對臭氧層或環境的危害。
- code: T08
  name: 有機鹵化物分類與IUPAC命名
  desc: 依鹵素取代位置與碳骨架結構，判別一至三級鹵烷並完成系統命名。
- code: T09
  name: 鹵烷與氫氧化鈉取代及消去反應
  desc: 區分鹵烷在氫氧化鈉水溶液進行水解取代成醇，與在醇溶液進行脫鹵化氫成烯的反應條件。
- code: T10
  name: 鹵烷與醇類鑑別及反應流程推論
  desc: 利用硝酸銀醇溶液沉澱速率或與水醇反應產物差異，鑑別不同級數鹵烷並串聯合成流程。
