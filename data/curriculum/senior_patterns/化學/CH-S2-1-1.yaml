unit:
  subject: 化學
  code: CH-S2-1-1
  title: 氫原子光譜
status: draft
types:
- code: T01
  name: 氫原子光譜譜系波段判別
  desc: 辨識來曼系、巴耳末系與帕申系所屬的電磁波區域與終點能階。
- code: T02
  name: 光譜譜線對應能階躍遷
  desc: 由氫原子光譜圖中譜線位置與波長或頻率關係，辨識對應的電子躍遷能階。
- code: T03
  name: 電磁波性質與光譜排序
  desc: 比較各波段電磁波的波長、頻率與能量大小，並區分電磁波與粒子射線。
- code: T04
  name: 光子能量與莫耳能量計算
  desc: 利用普朗克公式計算單一光子能量或每莫耳光子能量，並應用於分子光解離鍵能換算。
- code: T05
  name: 芮得柏公式與譜線位置
  desc: 利用芮得柏方程式判斷氫原子光譜各系列譜線的波長大小、頻率合理性與能量比例。
- code: T06
  name: 氫原子光譜系列與極限
  desc: 判別來曼、巴耳末與帕申系列的光區歸屬、譜線間距趨勢，並計算各系列最長與最短波長比。
- code: T07
  name: 譜線圖判讀與頻率加減
  desc: 結合光譜線示意圖與里茲組合原則，分析不同譜線之間的頻率差或能量和關係。
- code: T08
  name: 光子能量波長與頻率基本換算
  desc: 利用E=hc/λ及E=hν進行波長與能量比例換算，或由莫耳解離能計算所需光子的最大波長。
- code: T09
  name: 躍遷光譜系列與波長大小比較
  desc: 依據電子躍遷的起始與終止主量子數（來曼、巴耳末、帕申系），比較譜線能量、頻率與波長。
- code: T10
  name: 芮得柏公式求譜線頻率與能階
  desc: 利用ν=R(1/n1^2 - 1/n2^2)判斷可能出現的氫原子光譜頻率，或由波長比反推電子所在殼層。
- code: T11
  name: 譜線波長極值與光譜圖對應
  desc: 計算各光譜系列中最長與最短波長的比值，或將光譜線圖與對應的電子能階躍遷配對。
- code: T12
  name: 能量守恆與多光子躍遷波長
  desc: 當原子吸收一光子後分兩步放出兩個光子返回基態，利用1/λ=1/λ1+1/λ2求未知光波長。
- code: T13
  name: 電磁波波長頻率與光子能量換算
  desc: 利用c=λν與E=hν進行電磁波波長、頻率、單一光子能量與每莫耳光子能量之間的單位換算。
- code: T14
  name: 電磁波譜區域與能量大小比較
  desc: 比較無線電波、微波、紅外光、可見光、紫外光與X射線的波長、頻率及光子能量大小順序。
- code: T15
  name: 氫原子光譜譜線波長頻率比例
  desc: 利用能階差與頻率成正比、與波長成反比的關係，推導或計算不同躍遷譜線間的能量和差與波長比例。
- code: T16
  name: 芮得柏公式與譜線系列極限波長
  desc: 應用芮得柏公式計算來曼、巴耳末等各系列譜線的最長波長與最短（極限）波長及彼此比值。
- code: T17
  name: 氫原子光譜圖光區與躍遷判讀
  desc: 判讀氫原子光譜紫外光區與可見光區示意圖，辨識各光譜線對應的躍遷能階並計算能量比值或波長。
- code: T18
  name: 原子光譜不連續性與能階意義
  desc: 理解明線光譜不連續性揭示原子內部電子能階量子化的實驗證據，並區分氫原子與多電子原子光譜差異。
- code: T19
  name: 電磁波波長頻率與能量換算
  desc: 利用光速與普朗克常數關係式，進行電磁波波長、頻率、光區順序與單光子或莫耳光子能量換算。
- code: T22
  name: 光譜躍遷譜線條數與能量加減
  desc: 計算電子由高能階躍遷至低能階最多可產生的譜線數，或利用能量守恆推算連續躍遷的光子波長。
