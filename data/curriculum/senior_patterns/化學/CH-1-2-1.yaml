unit:
  subject: 化學
  code: CH-1-2-1
  title: 化學鍵
status: draft
types:
- code: T01
  name: 化學鍵形成與類型判別
  desc: 依據元素金屬性與非金屬性或原子序，判斷離子鍵、共價鍵與金屬鍵的形成機制與能量變化。
- code: T02
  name: 路易斯電子點式與八隅體
  desc: 繪製或判讀分子與離子的路易斯結構，計算鍵結與孤對電子數，並檢驗是否符合八隅體與含多鍵。
- code: T03
  name: 離子晶體結構與性質比較
  desc: 依據離子電荷與半徑比較離子晶體熔點，或判別其配位結構、溶解度與導電延展性。
- code: T04
  name: 網狀共價與分子固體比較
  desc: 比較金剛石、石墨、碳六十、石英與乾冰的鍵結結構、硬度、導電度與熔沸點差異。
- code: T05
  name: 金屬晶體電子海與性質
  desc: 依據金屬陽離子與自由電子的電子海模型，解釋金屬光澤、延展性及導電導熱性質。
- code: T06
  name: 物質熔化斷鍵與導電判別
  desc: 依據晶體類型判斷熔化時是否需破壞化學鍵，以及固態、熔融態與水溶液的導電性。
- code: T07
  name: 物質化學鍵型與晶體分類
  desc: 依據物質組成元素或熔點、導電性、延展性等物理性質表，區分離子鍵、共價鍵、金屬鍵及網狀固體。
- code: T08
  name: 離子與共價複合鍵判別
  desc: 判斷同時含有離子鍵與共價鍵的化合物（如含銨根、氫氧根或含氧酸根之鹽類）。
- code: T09
  name: 電子點式繪製與判讀
  desc: 檢驗離子化合物與共價分子的路易斯電子點式是否正確表示價電子與電荷分布。
- code: T10
  name: 孤對電子與八隅體規則
  desc: 繪製分子或離子的路易斯結構，計算孤對電子對數並判斷各原子是否符合八隅體規則。
- code: T11
  name: 碳的同素異形體結構
  desc: 比較鑽石、石墨與巴克球（$C_{60}$）的鍵結原子數、晶體類型及導電、導熱與熔化斷鍵性質。
- code: T12
  name: 路易斯結構與孤對電子計數
  desc: 繪製分子或離子的路易斯電子點式，並計算孤對電子與鍵結電子對數。
- code: T13
  name: 物質類型與晶體性質判別
  desc: 由熔沸點、導電性等物理性質對照表判別離子、金屬、分子與網狀固體。
- code: T14
  name: 原子序推斷鍵結與物質性質
  desc: 由元素原子序判斷電子組態與鍵結類型，推論化合物的延展性與導電性。
- code: T15
  name: 化學鍵模型與物理性質解釋
  desc: 比較離子鍵、共價鍵與金屬鍵的形成機制，解釋物質導電與延展性差異。
- code: T16
  name: 化學鍵種類與成鍵原則判別
  desc: 依據元素金屬與非金屬屬性或原子序，判斷化合物含離子鍵、共價鍵或金屬鍵。
- code: T17
  name: 路易斯電子點式與孤對電子
  desc: 繪製原子、離子或分子的路易斯結構，並計算滿足八隅體後的未鍵結電子對數。
- code: T18
  name: 離子晶體、金屬與網狀固體特性
  desc: 比較離子晶體、金屬與共價網狀固體的延展性、熔點高低與結構微觀模型。
- code: T19
  name: 物質導電性與鍵結類型判斷
  desc: 根據固態、熔融態與水溶液的導電性及熔點實驗數據，反推物質所屬晶體與鍵結類型。
- code: T20
  name: 八隅體規則與成鍵能量概念
  desc: 判斷化學鍵形成過程的吸放熱與八隅體穩定原則，釐清化學鍵與分子間作用力的區別。
