unit:
  subject: 化學
  code: CH-1-1-2
  title: 道耳頓的原子說
status: draft
types:
- code: T01
  name: 質量守恆與反應質量比
  desc: 利用反應前後總質量不變或已知反應消耗與剩餘量，求算物質質量或反應質量比。
- code: T02
  name: 定比定律組成與化學式
  desc: 依據化合物組成元素質量比恆定的性質，推算未知質量、元素百分率或化合物化學式。
- code: T03
  name: 倍比定律判別與推算
  desc: 判斷兩元素組成的化合物組合是否符合倍比定律，或由質量百分比數據反推未知化學式。
- code: T04
  name: 道耳頓原子說與反應微觀
  desc: 依據原子說解釋化學反應前後原子種類、數目不滅及分子與原子排列重組的變化。
- code: T05
  name: 氣體反應體積與亞佛加厥
  desc: 運用定溫定壓下氣體體積比與莫耳數、分子數的關係，判別化學基本定律的適用範圍。
- code: T06
  name: 質量守恆定律應用
  desc: 利用反應前後總質量不變的原則，由已知反應物與剩餘物質量推算生成物質量或消耗量。
- code: T07
  name: 定比定律與重量組成
  desc: 依據特定化合物中各元素質量比固定的性質，推算已知質量樣品中各元素的含量。
- code: T08
  name: 倍比定律的判別與檢驗
  desc: 判斷多組物質是否由相同兩元素組成且符合質量成簡單整數比的倍比定律。
- code: T09
  name: 倍比定律推求化學式
  desc: 固定其中一種元素的質量，比較另一元素的質量整數比以推求未知化合物的化學式。
- code: T10
  name: 元素質量關係圖表判讀
  desc: 由化合物總質量與含某元素質量的關係圖或組成表，換算並求出未知數據或化學式。
- code: T11
  name: 道耳頓原子說核心內涵判別
  desc: 檢視原子說基本假設並對照現代原子理論，辨識敘述是否符合道耳頓原子說。
- code: T12
  name: 質量守恆與定比定律計算
  desc: 利用反應前後總質量守恆與化合物元素固定質量比，推算反應物或生成物質量。
- code: T13
  name: 倍比定律的物質組合判斷
  desc: 檢驗兩元素形成多種化合物時，固定一元素質量後另一元素質量是否呈簡單整數比。
- code: T14
  name: 倍比定律推求未知化學式
  desc: 由同組元素形成兩化合物的質量比數據與已知化學式，推算另一化合物的化學式。
- code: T15
  name: 氣體反應體積與亞佛加厥定律
  desc: 在同溫同壓下由氣體反應體積比等於分子數比，推求生成物分子式或反應物分子式。
