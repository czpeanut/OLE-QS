unit:
  subject: 化學
  code: CH-S3-3-6
  title: 緩衝溶液
status: draft
types:
- code: T01
  name: 緩衝溶液組成條件與配對選擇
  desc: 判斷可構成緩衝溶液的弱酸與共軛鹼組合，並依緩衝目標 pH 值選取 pKa 最接近的酸鹼對。
- code: T02
  name: 緩衝溶液特性與同離子效應判別
  desc: 釐清緩衝溶液具有同離子效應、抗酸鹼衝擊及加水適度稀釋時 pH 值不變的核心性質。
- code: T03
  name: 緩衝溶液pH值與酸鹼比例計算
  desc: 運用亨德森-哈塞爾巴赫方程式，由目標 pH 值與 Ka 求算維持緩衝所需弱酸與共軛鹼濃度比。
- code: T04
  name: 酸鹼混合跨區之緩衝與pH計算
  desc: 計算弱酸與強鹼、弱鹼或緩衝鹽不同體積混合後，依據剩餘物種判斷屬強酸、緩衝或強鹼並求 pH。
- code: T05
  name: 緩衝溶液加減酸鹼後pH變化
  desc: 先以化學計量計算外加強酸或強鹼與緩衝對反應後的剩餘莫耳數比，再代入平衡式求新 pH 值。
- code: T06
  name: 酸鹼混合後緩衝組成判別
  desc: 計算弱酸鹼與強酸鹼混合中和後的剩餘莫耳數，判別是否仍有共軛酸鹼對共存形成緩衝。
- code: T07
  name: 多質子酸緩衝配對與比例
  desc: 依目標 pH 值從多質子酸各級解離常數選出對應共軛酸鹼對，並求算物種濃度比或優勢離子。
- code: T08
  name: 酸鹼比例與pH關係圖判讀
  desc: 從溶液 pH 值對共軛鹼酸比例的變化曲線讀取座標點，反推弱酸的解離常數 Ka。
