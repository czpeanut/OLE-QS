unit:
  subject: 化學
  code: CH-S3-1-3
  title: 勒沙特列原理
status: draft
types:
- code: T01
  name: 濃度與體積改變對平衡之影響
  desc: 依據勒沙特列原理，判斷增減反應物濃度、定溫壓縮或定容加入惰性氣體後的平衡移動方向。
- code: T02
  name: 溫度改變與反應熱方向判斷
  desc: 依據升降溫度時平衡向吸熱或放熱方向移動的規律，由產率變化推斷反應熱正負與平衡常數增減。
- code: T03
  name: 濃度時間與速率時間關係圖判讀
  desc: 由濃度或正逆反應速率隨時間突變的曲線特徵，判斷系統在該時刻受到的外界擾動類型。
- code: T04
  name: 工業製程與哈柏法產率曲線分析
  desc: 結合溫度與壓力對氨氣平衡產率曲線圖的判讀，解釋哈柏法工業條件選擇與進行產率計算。
- code: T05
  name: 平衡移動後顏色或物理量變化
  desc: 追蹤外界條件改變導致平衡移動後，氣體顏色深淺、平均分子量或溶液顏色的最終變化趨勢。
