unit:
  subject: 化學
  code: CH-S5-1-2
  title: 飽和烴－烷
status: draft
types:
- code: T01
  name: 烷類與環烷通式及同系物分子量
  desc: 依據鏈狀烷與環烷的分子通式及相鄰同系物相差14的分子量規律，推求未知分子式或合理數列。
- code: T02
  name: 烷類的中文IUPAC系統命名法
  desc: 找出結構式中最長碳鏈作為主鏈並依最低取代基編號原則，完成支鏈烷烴的系統命名或由名稱寫結構。
- code: T03
  name: 烷類的物理性質與沸點比較
  desc: 判別烷類不溶於水、可保存鹼金屬的性質，以及沸點隨碳數增加而升高、隨支鏈增多而降低的趨勢。
- code: T04
  name: 烷類鹵化取代與高溫裂解反應
  desc: 掌握烷類與鹵素需照光或加熱發生取代反應的條件與產物，以及高溫裂解生成烯類與氫氣的反應。
- code: T05
  name: 環烷的張力與同分異構物推寫
  desc: 分析不同碳數環烷的分子式與結構異構物數目，並區分環烷與鏈狀烯烴的化學性質差異。
- code: T06
  name: 甲烷多步氯化取代反應計量
  desc: 依據一氯至四氯甲烷各產物莫耳數與取代反應係數，計算消耗氯氣的總莫耳數或質量。
- code: T07
  name: 結構式等效性與烷基名稱
  desc: 判別不同畫法之烷類結構是否為相同物質，並辨識異丙基、二級丁基與三級丁基等烷基。
