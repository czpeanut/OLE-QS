unit:
  subject: 化學
  code: CH-S1-1-2
  title: 反應式的平衡與化學計量
status: draft
types:
- code: T01
  name: 混合氣體燃燒與碳氫組成求解
  desc: 由混合烷烴燃燒總質量與CO2產量列聯立方程式，求解混合物中各成分質量。
- code: T02
  name: 單一烴類燃燒體積推分子式
  desc: 利用燃燒前後氣體體積變化及KOH吸收CO2後的體積差，推算未知烴類化學式。
- code: T03
  name: 連續分批反應與限量試劑推算
  desc: 分析分次加入反應物的質量變化與剩餘物資訊，推求反應物消耗比例與產物總量。
- code: T04
  name: 未知碳酸鹽與氣體反推原子量
  desc: 由產生的標準狀態乾燥氣體體積換算莫耳數，反推未知金屬式量與元素種類。
- code: T05
  name: 實務化學計量與反應產率計算
  desc: 將反應物質量換算為莫耳數，依平衡反應式計算理論產量與實際產率的百分比。
- code: T06
  name: 限量試劑與反應產率計算
  desc: 先比較反應物莫耳數與係數比決定限量試劑，再由實際產量除以理論產量求產率。
- code: T07
  name: 質量守恆與反應熱分解百分率
  desc: 利用固體加熱分解前後的質量減少量換算逸出氣體莫耳數，反推原反應物的分解百分率。
- code: T08
  name: 氣體反應體積變化與轉化量
  desc: 依反應前後氣體係數差與實際總體積變化量，計算已反應氣體體積或產物體積比值。
- code: T09
  name: 混合物加熱分解比例推算
  desc: 針對兩化合物混合物共同反應或熱分解，利用質量差與莫耳數聯立方程式求各成分比例。
- code: T10
  name: 未知係數化學計量與體積換算
  desc: 運用一般化反應式係數與分子量關係推導反應物質量表達式，或結合氣體莫耳體積計算排放量。
- code: T11
  name: 限量試劑判斷與產物計算
  desc: 比較各反應物莫耳數與係數比找出限量試劑，進而計算理論產物莫耳數、質量或氣體體積。
- code: T12
  name: 反應產率與實際用量換算
  desc: 結合反應式的化學計量關係與產率百分比，由實際產量反推反應物用量或求算反應產率。
- code: T13
  name: 連續反應與混合成分燃燒計量
  desc: 針對混合物燃燒吸收水與二氧化碳之實驗數據，聯立原子守恆方程式求解各成分比例。
- code: T14
  name: 反應前後質量變化推求係數比
  desc: 依據反應前後各物質的質量消長或兩次加料實驗數據，推導反應式質量比與各物種剩餘量。
- code: T15
  name: 化學反應基本類型分類判別
  desc: 依據反應物與生成物的組成及種類變化，將化學反應區分為化合、分解、置換、複分解或沉澱反應。
- code: T16
  name: 化學反應式係數平衡
  desc: 利用原子不滅與電荷守恆原則平衡反應式係數，或由已知係數反推未知產物化學式。
