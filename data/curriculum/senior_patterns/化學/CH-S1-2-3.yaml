unit:
  subject: 化學
  code: CH-S1-2-3
  title: 理想氣體方程式
status: draft
types:
- code: T01
  name: 氣體聯合方程式PV/T計算
  desc: 在氣體莫耳數固定時，利用P1V1/T1=P2V2/T2求解高空、水下或連通前後的壓力體積。
- code: T02
  name: 開口容器加熱逸出氣體比例
  desc: 在定壓定容條件下，由n與絕對溫度T成反比，計算加熱後逸出氣體占原氣體的比例。
- code: T03
  name: 自由滑動活塞雙室熱平衡計算
  desc: 利用雙室總體積不變及平衡時兩室壓力相等（nT比等於V比），求解加熱後活塞移動量。
- code: T04
  name: 理想氣體方程式求分子量
  desc: 將氣體壓力、體積、溫度與質量代入PM=dRT或PV=(w/M)RT，求解未知氣體分子量或密度。
- code: T05
  name: 反應前後莫耳數與溫壓倍率
  desc: 結合化學反應方程式的氣體莫耳數變化與反應前後溫度變化，計算容器總壓改變倍率。
- code: T06
  name: 抽氣充氣前後壓力差求容積
  desc: 利用PV=nRT計算密閉容器抽出或充入特定STP體積氣體前後的壓力差，反推容器體積。
- code: T07
  name: 氣體密度動能與速率綜合比較
  desc: 在特定溫壓體積條件下，綜合比較多種氣體的莫耳數、密度、壓力、平均動能與運動速率。
- code: T08
  name: 氣體密度與分子量推算
  desc: 利用理想氣體方程式推導式PM=dRT，由壓力、溫度與密度或同質量壓力比求算氣體分子量。
- code: T09
  name: 連通容器跨溫度莫耳數守恆
  desc: 處理兩連通容器處於不同溫度時，利用總莫耳數守恆（P1V1/T1+P2V2/T2不變）求平衡壓力或膨脹體積。
- code: T10
  name: 氣體部分解離之壓力與計量
  desc: 結合化學計量與解離度計算密閉容器內氣體部分解離後的總莫耳數與平衡壓力。
- code: T11
  name: 理想與真實氣體性質偏差比較
  desc: 比較理想氣體模型假設與真實氣體因分子體積及分子間作用力造成的PV/RT偏差與液化條件。
- code: T12
  name: 相對溼度與水氣質量換算
  desc: 由飽和蒸氣壓與相對溼度求算水蒸氣分壓，並代入理想氣體方程式計算空間內水氣質量變化。
- code: T13
  name: 理想氣體與真實氣體性質比較
  desc: 釐清理想氣體假設、壓縮因數與真實氣體偏差條件，並判斷 PV=K 常數的影響變因。
- code: T14
  name: 理想氣體求分子量與氣體消耗
  desc: 結合氣體質量、壓力、體積與溫度計算分子量，或由鋼瓶前後 P、T 變化求氣體消耗比例。
- code: T15
  name: 開口加熱逸出與雙室活塞移動
  desc: 處理開口容器升溫氣體逸出比率計算，或以滑動活塞兩室等壓平衡求加熱後體積變化。
- code: T16
  name: 理想氣體狀態函數圖形斜率分析
  desc: 判讀 P-V、P-T、V-T 等高線或狀態循環圖，比較不同曲線代表的溫度、莫耳數或密度大小。
- code: T17
  name: 多種氣體壓力溫度體積比值計算
  desc: 在給定體積、壓力與溫度比例下，綜合比較不同氣體之莫耳數、質量、原子數、密度與總動能比。
- code: T18
  name: 理想氣體假設與真實氣體條件
  desc: 判別理想氣體分子間無作用力與無體積的假設，以及真實氣體趨近理想氣體的高溫低壓條件。
- code: T21
  name: 同溫同壓或同重氣體性質比較
  desc: 比較不同氣體在等重、等體積或同溫同壓條件下的分子數、密度、體積與莫耳分率大小。
- code: T22
  name: 氣體動力論與速率分布曲線
  desc: 依據溫度決定分子平均動能與分子量決定平均速率的原則，判讀馬克士威速率分布曲線。
