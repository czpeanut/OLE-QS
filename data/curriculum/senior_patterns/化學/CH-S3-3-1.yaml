unit:
  subject: 化學
  code: CH-S3-3-1
  title: 酸鹼的定義
status: draft
types:
- code: T01
  name: 布－洛酸鹼定義與兩性物質判別
  desc: 依據質子給予與接受的定義，判斷反應中扮演布洛酸、布洛鹼的物種及同時具備雙重身分的兩性物質。
- code: T02
  name: 共軛酸鹼對的辨識與推寫
  desc: 根據分子或離子間相差一個質子的關係，辨識共軛酸鹼對或寫出指定物種的共軛酸與共軛鹼。
- code: T03
  name: 由質子轉移方向比較酸鹼相對強度
  desc: 依據酸鹼反應趨向生成較弱酸與較弱鹼的原則，由多個可進行反應推論各酸與共軛鹼的強弱順序。
- code: T04
  name: 酸鹼強弱實驗設計與現象推論
  desc: 根據弱酸與碳酸鹽或弱酸鹽置換反應的實驗現象，比較不同酸的酸性強弱順序。
- code: T05
  name: 氧化物溶於水之酸鹼性判別
  desc: 區分金屬氧化物與非金屬氧化物在水中的溶解性與反應產物，判斷所得水溶液呈酸性、鹼性或中性。
- code: T06
  name: 兩性物質可逆得失質子判別
  desc: 檢驗物種是否同時具備可解離質子與接受質子的孤電子對，並排除次磷酸根與亞磷酸根等不可解離氫。
- code: T07
  name: 阿瑞尼斯與布洛學說異同比較
  desc: 比較阿瑞尼斯水溶液解離定義與布洛質子轉移理論的適用溶劑範圍、中和產物及強弱酸鹼解離度。
- code: T08
  name: 兩性氫氧化物與強酸共軛平衡
  desc: 透過兩性氫氧化物隨pH變化的溶解度曲線，或強酸解離度與共軛鹼鹼性強弱推論反應趨勢。
