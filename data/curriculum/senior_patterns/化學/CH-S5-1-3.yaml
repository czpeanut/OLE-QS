unit:
  subject: 化學
  code: CH-S5-1-3
  title: 不飽和烴－烯與炔
status: draft
types:
- code: T01
  name: 烯類與炔類IUPAC命名法
  desc: 選擇含雙鍵或參鍵的最長碳鏈為主鏈並給予不飽和鍵最小編號，正確進行烯類與炔類的系統命名。
- code: T02
  name: 幾何（順反）異構物判別
  desc: 檢視碳－碳雙鍵兩端碳原子所接的兩個基團是否皆不同，判斷有機分子是否具有順反異構物。
- code: T03
  name: 烷烯炔鍵結與鍵長鍵角比較
  desc: 比較乙烷、乙烯與乙炔的碳原子混成軌域、碳－碳鍵長與共用電子對數、鍵角及平面立體幾何形狀。
- code: T04
  name: 烯與炔加成及馬可尼可夫法則
  desc: 預測烯與炔和氫氣、鹵素、鹵化氫及水進行加成反應的主產物，並應用馬可尼可夫法則判斷取代位置。
- code: T05
  name: 烯與炔的氧化反應及端炔鑑別
  desc: 判別烯與炔和過錳酸鉀反應產物、電石製備乙炔反應，以及利用氯化亞銅氨溶液鑑別端炔的沉澱現象。
- code: T06
  name: 環烯類加成與氧化多路徑產物
  desc: 針對含取代基的環烯類，分別預測與氫氣、鹵素、鹵化氫、水及過錳酸鉀反應之區域選擇性產物結構與命名。
- code: T07
  name: 溴加成莫耳數反推烴分子式與異構
  desc: 利用不飽和烴與溴進行加成反應的化學計量比，反推雙參鍵數、碳數與可能結構異構物種數。
- code: T08
  name: 馬可尼可夫法則適用判別與主產物
  desc: 檢視不飽和鍵兩端碳原子的取代基對稱性，判斷是否適用馬可尼可夫法則並預測不對稱烯炔與鹵化氫加成之主產物結構。
