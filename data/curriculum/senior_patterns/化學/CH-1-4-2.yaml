unit:
  subject: 化學
  code: CH-1-4-2
  title: 藥物與界面活性劑
status: draft
types:
- code: T01
  name: 常見藥物分類、成分與用途
  desc: 辨識抗生素、消炎解熱止痛劑與制酸劑的代表藥物成分、藥理作用與使用安全限制。
- code: T02
  name: 界面活性劑結構與去污原理
  desc: 利用界面活性劑兼含親水端與親油端之特性，解釋乳化油污、降低表面張力與去污機制。
- code: T03
  name: 清潔劑對水質與生物的影響
  desc: 推論清潔劑溶解防水油膜或降低水表面張力後，對昆蟲呼吸或水生環境造成的影響。
- code: T04
  name: 肥皂與合成清潔劑性質比較
  desc: 比較肥皂與合成清潔劑在硬水中的去污表現、酸鹼性差異及製備皂化反應原理。
- code: T05
  name: 胃藥制酸劑反應與適用成分
  desc: 判斷碳酸氫鈉、氫氧化鋁等制酸劑與胃酸的中和反應，並排除強鹼氫氧化鈉等不適用物。
- code: T06
  name: 解熱鎮痛劑藥理與性質比較
  desc: 區分阿司匹靈（乙醯柳酸）與普拿疼（乙醯胺酚）的酸鹼性、消炎與抗凝血藥理作用及腸胃肝臟副作用差異。
- code: T07
  name: 清潔劑來源製備與環境分解性
  desc: 判別肥皂皂化與石油合成清潔劑的製備原料差異，及長鏈烷基支鏈結構對微生物分解（軟硬性清潔劑）的影響。
