unit:
  subject: 化學
  code: CH-1-3-5
  title: 氧化還原反應
status: draft
types:
- code: T01
  name: 氧化還原反應的辨識與判定
  desc: 檢視反應前後各元素氧化數是否發生升降變化，判別是否屬於氧化還原反應。
- code: T02
  name: 氧化劑還原劑與反應角色
  desc: 分析反應物氧化數升降方向，判斷何者發生氧化或還原及扮演的氧化劑/還原劑角色。
- code: T03
  name: 金屬活性與氧化還原強度比較
  desc: 由數個金屬與離子的置換反應結果，排列各金屬還原劑與陽離子氧化劑的強度順序。
- code: T04
  name: 氧化還原產物與溶液濃度計量
  desc: 依氧化還原反應式係數與限量試劑求算產物莫耳數，並結合溶液體積計算濃度。
- code: T05
  name: 氧化還原反應類型辨識
  desc: 檢查反應前後各元素氧化數是否發生變化，從核反應、沉澱、中和與電化學中辨識氧化還原。
- code: T06
  name: 金属置換反應與溶液質量變化
  desc: 分析金屬與金屬離子溶液的置換反應，比較析出與溶解金屬原子量差異以判斷液體質量增減。
- code: T07
  name: 自然界碳循環與生活氧化還原
  desc: 判別光合作用、呼吸作用、燃燒與碳酸鈣沉積等自然或生活過程是否涉及氧化還原。
- code: T08
  name: 電子轉移定義與得失電子平衡
  desc: 依據電子得失判斷氧化與還原反應本質，檢驗氧化還原同時發生及得失電子總數相等原則。
- code: T09
  name: 得失氧氫模型與反應物角色
  desc: 從物質在反應中得到或失去氧、氫原子的變化，判定氧化還原方向與還原劑身分。
- code: T10
  name: 常見工業與生理氧化還原劑
  desc: 辨識冶鐵焦炭、氯系與硫系漂白劑、亞硝酸鹽及維生素等常見物質的氧化還原劑角色。
