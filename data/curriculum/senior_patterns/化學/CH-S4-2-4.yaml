unit:
  subject: 化學
  code: CH-S4-2-4
  title: 電解與電鍍
status: draft
types:
- code: T01
  name: 惰性與活性電極電解產物預測
  desc: 比較水溶液離子與水分子的氧化還原電位順序，判斷以惰性或活性電極電解不同溶液時兩極的產物。
- code: T02
  name: 法拉第電解定律與氣體體積計算
  desc: 利用電流強度與通電時間計算通過的法拉第數，進而求算陰極析出金屬質量或陽極產出氣體體積。
- code: T03
  name: 電鍍裝置極性連接與電鍍液選擇
  desc: 判斷待鍍物與鍍層金屬應連接的電源正負極、電鍍液成分選擇，以及電鍍過程中離子濃度的變化。
- code: T04
  name: 氯鹼工業與離子交換膜法電解
  desc: 判讀離子交換膜法電解食鹽水的裝置示意圖，辨識進出料口、隔膜透過離子與兩極產出的氫氧化鈉及氣體。
- code: T05
  name: 串聯電解槽各極產物計量比例
  desc: 依據串聯電路各處通過相同電量的原則，計算多個電解槽在不同電極所析出物質的莫耳數比或質量比。
- code: T06
  name: 電解液pH變化與指示劑呈色
  desc: 依據陰陽兩極水分子放電產生的氫離子或氫氧根，判別電解液 pH 值變化與指示劑顏色。
- code: T07
  name: 標準還原電位求最小電解電壓
  desc: 比較標準還原電位表選出兩極優先反應物種，計算驅動非自發電解反應所需的最小電壓。
- code: T08
  name: 電解法精煉銅與陽極泥分離
  desc: 分析粗銅電解精煉的電極配置與電解液成分，區分溶解的活潑雜質與沉積的貴金屬陽極泥。
- code: T09
  name: 光催化水分解與電荷轉移
  desc: 分析半導體光催化水分解裝置中的電子流動方向、氧化還原產物與影響催化效率的因素。
