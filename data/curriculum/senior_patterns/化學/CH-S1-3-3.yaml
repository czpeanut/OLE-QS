unit:
  subject: 化學
  code: CH-S1-3-3
  title: 溶液的性質
status: draft
types:
- code: T01
  name: 依數性質概念與生活現象配對
  desc: 將煮糖水、水箱加抗凍劑、快鍋烹煮與潛水減壓病等生活現象配對至沸點、凝固點或亨利定律。
- code: T02
  name: 亨利定律與混合氣體溶解度
  desc: 利用氣體溶解度與分壓成正比，計算不同氣壓或混合空氣條件下溶於水中各氣體的量。
- code: T03
  name: 重量莫耳濃度m與綜合換算
  desc: 將重量百分率、體積莫耳濃度、莫耳分率與重量莫耳濃度m依定義列式並進行相互換算。
- code: T04
  name: 非電解質沸點上升凝固點下降
  desc: 利用ΔTb=Kb·m與ΔTf=Kf·m計算溶質分子量、溶液沸點、凝固點或比較抗凍劑效率。
- code: T05
  name: 冷卻析出冰晶與溶液濃度計算
  desc: 由溶液凝固點下降值反推剩餘液態水的質量，進而計算冷卻過程中析出純冰的質量。
- code: T06
  name: 電解質凡特荷夫因子與解離度
  desc: 考慮電解質解離度與離子反應（如沉澱消去離子），計算總粒子莫耳濃度與真實依數性質。
- code: T07
  name: 沸點凝固點加熱曲線圖形判讀
  desc: 由溫度－時間加熱曲線或凝固點－濃度線性關係圖，讀取沸點上升度數並反推溶質質量或解離度。
- code: T08
  name: 亨利定律氣體溶解度與分壓計算
  desc: 應用亨利定律計算不同氣體分壓與溶劑體積下溶入水中的氣體質量、莫耳數或定溫定壓體積。
- code: T09
  name: 亨利定律適用條件與溫度效應
  desc: 判斷容易與溶劑發生反應而不適用亨利定律的氣體，並理解溫度與壓力對亨利常數及氣體溶解度的影響。
- code: T10
  name: 沸點上升與凝固點下降求分子量
  desc: 利用沸點上升或凝固點下降公式由溶質質量、溶劑質量與溫度變化反推非電解質分子量。
- code: T11
  name: 依數性質大小與加熱冷卻曲線
  desc: 比較不同溶質或不同濃度溶液的蒸氣壓、沸點與凝固點高低，並判讀加熱或冷卻曲線的轉折點。
- code: T12
  name: 蒸氣壓下降與沸點凝固點換算
  desc: 結合拉午耳定律與依數性質公式，由已知蒸氣壓下降量換算重量莫耳濃度進而求正常沸點或凝固點。
- code: T13
  name: 凡特荷夫因子與解離度偶合率
  desc: 考慮電解質解離度或非電解質偶合率計算凡特荷夫因子i值，並比較不同濃度或電荷數溶液的i實驗值。
- code: T14
  name: 依數性質對濃度關係圖斜率判讀
  desc: 判讀凝固點下降或沸點上升對不同濃度表示法作圖的斜率意義，並比較不同溶劑或溶質的落點區間。
- code: T15
  name: 依數性質生活與工業應用原理
  desc: 解釋日常生活中加鹽除雪、真空低溫濃縮、高壓鍋烹煮或防凍劑等操作背後的溶液依數性質原理。
- code: T16
  name: 依數性質定義與生活現象配對
  desc: 辨識蒸氣壓下降、沸點上升、凝固點下降與滲透壓等依數性質，並配對生活中常見實例。
- code: T17
  name: 亨利定律與氣體溶解度計算及圖形
  desc: 運用亨利定律計算定溫下氣體分壓與水中溶解莫耳數或質量，並判讀溶解度隨壓力溫度曲線。
- code: T18
  name: 沸點上升與凝固點下降定量計算
  desc: 代入 ΔT=i K C_m 公式計算溶液凝固點或沸點，並可結合凡特荷夫因數 i 反推電解質解離度。
- code: T19
  name: 凝固點測定實驗與冷卻曲線分析
  desc: 判讀溶液冷卻曲線求凝固點、實驗誤差百分率，及計算持續降溫後純溶劑冰晶析出質量。
- code: T20
  name: 依數性質與濃度關係圖表判讀
  desc: 由凝固點對重量莫耳濃度或質量濃度關係圖斜率計算 Kf 與溶質分子量，或配對不同溶質曲線。
