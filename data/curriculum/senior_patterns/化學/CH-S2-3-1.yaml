unit:
  subject: 化學
  code: CH-S2-3-1
  title: 反應速率定律
status: draft
types:
- code: T01
  name: 速率關係式與係數換算
  desc: 依據反應式係數推導各反應物、生成物濃度或分壓變化速率及總壓變化速率的比例關係。
- code: T02
  name: 反應速率實驗測量方法
  desc: 根據反應前後氣體莫耳數、顏色深淺、沉澱、導電度或pH值等變化，判斷適用的速率測量物理量。
- code: T03
  name: 瞬時與平均速率圖表計算
  desc: 由濃度對時間關係圖的割線斜率或切線斜率，求算指定時間區間的平均速率或特定點的瞬時速率。
- code: T04
  name: 速率定律與級數基本觀念
  desc: 釐清反應級數需由實驗求得、可為分數或負數，並由速率常數k的單位反推反應總級數。
- code: T05
  name: 實驗數據求速率定律式
  desc: 利用控制變因的初速率實驗數據表或濃度關係圖，求解各反應物級數、速率常數k及預測速率。
- code: T06
  name: 半衰期與零一二級圖形
  desc: 判別零級、一級與二級反應的濃度－時間或速率－濃度圖形，並計算放射性衰變或一級反應半衰期。
- code: T07
  name: 氣相體積壓力變動對速率
  desc: 計算定溫定容或定溫定壓下加入惰性氣體或反應物後，各氣體分壓改變對反應速率的影響倍數。
- code: T08
  name: 反應機構與秒錶反應實驗
  desc: 由快慢步驟推導總反應速率定律，或解析秒錶反應（如碘酸根與亞硫酸氫根）的原理、操作與速率計算。
- code: T09
  name: 瞬時平均速率與係數比換算
  desc: 由反應物濃度隨時間變化圖求切線斜率或總壓變化量，依係數比換算他物速率。
- code: T10
  name: 初速率實驗表推求速率定律式
  desc: 利用控制變因法比較不同實驗組別的初始濃度與初速率倍數，求出各反應級數與速率常數k。
- code: T11
  name: 反應級數與濃度時間關係判別
  desc: 由濃度與時間數據表或r-[A]、[A]-t圖形特徵，判定零級或一級反應並計算半生期與k值。
- code: T12
  name: 秒錶反應實驗與消耗速率計算
  desc: 分析秒錶反應中碘酸根與亞硫酸氫根的反應機制、變色條件與時間倒數計算消耗速率。
- code: T13
  name: 適宜反應速率測定物理量選用
  desc: 依據反應物與產物的狀態、顏色、氣體莫耳數變化或離子導電度，選擇適當的反應速率追蹤測定法。
- code: T14
  name: 由初速率實驗數據表求級數與k
  desc: 分析不同起始濃度下的反應初速率實驗數據表，求算各反應物級數、速率常數k並預測未知條件下的初速率。
- code: T15
  name: 反應級數意義與濃度體積變化
  desc: 理解反應級數的實驗意義（與係數無必然關係），並計算改變濃度或壓縮容器體積後的反應速率倍率。
- code: T16
  name: 零級一級二級反應特徵與半衰期
  desc: 由濃度隨時間變化數據判斷零級、一級或二級反應，並利用半衰期與濃度衰減關係推算時間或初始質量。
- code: T17
  name: 密閉容器反應壓力變化速率計算
  desc: 結合定溫定容氣體反應的莫耳數變化與分壓速率，計算密閉容器內系統總壓的改變速率。
- code: T18
  name: 速率常數k之影響因素與單位
  desc: 判別速率常數 k 僅受反應物本性、溫度與催化劑影響，並由 k 值單位反推總反應級數與速率式。
