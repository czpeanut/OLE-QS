unit:
  subject: 化學
  code: CH-S4-3-2
  title: 鈉、鎂及鋁元素和化合物的性質與製備
status: draft
types:
- code: T01
  name: 鹼金屬鈉化合物製備流程圖判讀
  desc: 解析由食鹽出發製備金屬鈉、氫氧化鈉、碳酸鈉與碳酸氫鈉的工業製程與索耳未法反應條件。
- code: T02
  name: 碳酸鈉與碳酸氫鈉性質及熱穩定性
  desc: 比較碳酸鈉與碳酸氫鈉的俗名、水溶液鹼性強弱、與鹽酸反應產物及受熱分解穩定性的差異。
- code: T03
  name: 鹼土金屬鎂及其化合物的性質應用
  desc: 判別鎂與二氧化碳燃燒反應、電解法製備金屬鎂、瀉鹽成分與氫氧化鎂作為制酸劑的特性。
- code: T04
  name: 鋁及相關化合物兩性反應
  desc: 掌握鋁、氧化鋁與氫氧化鋁分別與強酸及強鹼反應生成鋁離子與四羥基鋁酸根離子的共同產物與應用。
- code: T05
  name: 鋁的冶煉、合金特性與明礬性質
  desc: 區分電解熔融氧化鋁製鋁、鋁鎂輕合金的性質與應用，以及明礬作為複鹽的淨水凝聚原理。
- code: T06
  name: 鈉鎂鋁性質、游離能與製備比較
  desc: 比較鈉、鎂、鋁同週期元素之原子半徑、第一游離能、金屬性與電解熔融鹽製備方式。
- code: T07
  name: 金屬鈉電解冶煉與燒鹼性質應用
  desc: 區分電解熔融氯化鈉製取金屬鈉與電解濃食鹽水製取氫氧化鈉的產物差異，並掌握燒鹼溶水放熱、潮解與吸收二氧化碳之性質。
