unit:
  subject: 化學
  code: CH-S2-3-2
  title: 碰撞學說
status: draft
types:
- code: T01
  name: 碰撞學說與有效碰撞條件
  desc: 判別有效碰撞須具備足夠動能（超過低限能）與正確碰撞位向，及雙分子碰撞可能的位向圖示。
- code: T02
  name: 活化能與反應熱能量圖
  desc: 判讀反應能量圖中的正反應活化能、逆反應活化能、反應熱ΔH與吸放熱關係及換算。
- code: T03
  name: 活化複合體與穩定性判別
  desc: 辨識反應位能最高點的活化複合體結構、不穩定性，及其可能變回反應物或生成物的性質。
- code: T04
  name: 活化能高低與反應速率
  desc: 比較不同反應（如自燃、燃燒、酸鹼中和、沉澱）的活化能大小與常溫下反應進行的難易程度。
- code: T05
  name: 有效碰撞條件與活化能概念
  desc: 依據分子具足夠動能（低限能）且碰撞位向正確兩條件，解釋常溫下可燃物不自發反應的原因。
- code: T06
  name: 反應位能圖與反應機構分析
  desc: 由多步驟反應位能圖辨識速率決定步驟（瓶頸反應）、中間產物、正逆反應活化能與速率定律式。
- code: T07
  name: 粒子動能分布曲線與低限能判讀
  desc: 判讀馬克士威-波茲曼粒子動能分布曲線，分析改變反應物量、溫度或催化劑對曲線與低限能位置的影響。
- code: T08
  name: 氣體速率分布曲線與溫度高低
  desc: 判讀氣體分子在不同溫度下的速率分布曲線峰值與寬度變化，比較各曲線對應的溫度高低。
- code: T09
  name: 有效碰撞理論基本條件判別
  desc: 依據碰撞學說，闡明反應發生須具備足夠碰撞頻率、適當碰撞方位與高於活化能之動能。
- code: T10
  name: 反應位能圖判讀與活化能計算
  desc: 由反應位能圖辨識反應物、活化錯合物、產物位置，並利用正逆反應活化能求反應熱 ΔH。
- code: T11
  name: 生成熱結合活化能求逆反應活化能
  desc: 先以莫耳生成熱計算反應熱 ΔH，再運用 ΔH = Ea(正) - Ea(逆) 求解逆反應活化能。
