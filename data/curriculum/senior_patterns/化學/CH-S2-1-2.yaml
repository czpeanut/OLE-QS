unit:
  subject: 化學
  code: CH-S2-1-2
  title: 波耳氫原子模型
status: draft
types:
- code: T01
  name: 能階能量計算與躍遷波長
  desc: 利用氫原子能階能量公式與能階差，比較或計算電子躍遷吸收或放出光子的能量與波長。
- code: T02
  name: 波耳模型假設與觀念
  desc: 判別波耳氫原子模型的穩定態、角動量量子化、躍遷輻射與能階公式等核心假設與限制。
- code: T03
  name: 氫原子能階與游離能計算
  desc: 利用能階公式計算特定躍遷能量與游離能之比值，或反推能階變化。
- code: T04
  name: 單一原子級聯躍遷光子
  desc: 分析電子受激後分兩階段或多階段躍遷回基態時，各光子能量與波長的關係及範圍。
- code: T05
  name: 群體原子躍遷最大譜線數
  desc: 計算大量氫原子從特定高能階躍遷至低能階時，於各光區最多可產生的譜線條數。
- code: T06
  name: 雙條件激發推求未知能階
  desc: 依據題目給予的激發條件或譜線數量反推氫原子電子所躍遷到達的主量子數。
- code: T07
  name: 波耳模型基本假設與穩定態概念
  desc: 判別波耳氫原子模型關於電子穩定軌道不輻射能量及吸收特定光子能量躍遷的核心假設。
- code: T08
  name: 氫原子能階能量計算與游離能
  desc: 利用En=-1312/n^2 kJ/mol公式計算各主能階能量、基態或激發態游離能及躍遷放出吸收的莫耳光子能量。
- code: T09
  name: 能階躍遷放射吸收光子能量比較
  desc: 比較電子在不同主量子數之間躍遷時所吸收或放射光波的能量、頻率或波長大小順序。
- code: T10
  name: 單一與多電子躍遷最多譜線數
  desc: 計算一群原子或單一原子電子從高能階躍遷至低能階過程中，最多可產生的不同頻率光譜線總數與各光區條數。
- code: T11
  name: 波耳軌道半徑與能階間距示意圖
  desc: 判讀波耳模型中能階能量差隨n增大而減小、軌道半徑隨n^2增大的示意圖。
- code: T12
  name: 波耳氫原子模型基本假設判別
  desc: 判別電子穩定軌道、量子化角動量、庫倫靜電力提供向心力，以及模型對單電子離子的適用性。
- code: T13
  name: 波耳軌道能量與游離能比值計算
  desc: 利用氫原子各能階能量公式，計算基態或激發態的游離能及不同躍遷過程的能量比值。
