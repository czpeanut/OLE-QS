unit:
  subject: 化學
  code: CH-S5-1-4
  title: 芳香烴
status: draft
types:
- code: T01
  name: 苯的共振結構、鍵長與物理性質
  desc: 判別苯分子的平面六角形共振結構、碳－碳1.5鍵鍵長特徵、毒性及與芳香烴的命名歸屬。
- code: T02
  name: 苯的親電取代與紫外線加成反應
  desc: 區分苯在鐵催化下與氯氣或混酸進行取代反應，以及在紫外線照射下與氯氣進行加成反應的條件與產物。
- code: T03
  name: 芳香烴與環己烯等不飽和烴的鑑別
  desc: 利用溴的四氯化碳溶液或過錳酸鉀溶液不會與苯反應而會與烯烴反應褪色的性質，鑑別苯與環己烯。
- code: T04
  name: 苯環二取代與多取代異構物計數
  desc: 依據鄰、間、對位排列或取代基組合，計算特定分子式芳香烴的所有同分異構物種類數。
- code: T05
  name: 芳香烴側鏈氧化與燃燒推求分子式
  desc: 結合燃燒分析與芳香烴側鏈氧化生成苯甲酸等性質，推斷未知芳香烴的分子式與結構。
- code: T06
  name: 苯環取代基定位效應與合成
  desc: 依據第一類鄰對位與第二類間位導向取代基規則，推斷苯環多步驟取代反應產物結構。
