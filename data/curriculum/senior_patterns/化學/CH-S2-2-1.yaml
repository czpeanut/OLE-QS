unit:
  subject: 化學
  code: CH-S2-2-1
  title: 化學鍵的種類
status: draft
types:
- code: T01
  name: 化學鍵分類與複合鍵型判別
  desc: 區分離子鍵、共價鍵與金屬鍵的形成機制，並判斷同時含多種鍵型的化合物或偶極矩觀念。
- code: T02
  name: 雙原子位能曲線鍵長與鍵能
  desc: 判讀雙原子形成分子的位能-核間距曲線，辨識鍵長、鍵能與引力斥力平衡點。
- code: T03
  name: 離子晶體晶格能與熔點比較
  desc: 依據庫侖定律比較離子晶體的晶格能與熔點高低。
- code: T04
  name: 金屬鍵電子海與熔點導電性
  desc: 依據金屬陽離子價數、半徑與電子海模型，比較金屬熔點趨勢並解釋溫度對導電度的影響。
- code: T05
  name: 四大晶體性質表綜合辨識
  desc: 依據熔沸點、導電性、硬度與溶解度數據表，辨識離子、金屬、分子與網狀共價晶體。
- code: T06
  name: 化學鍵定義與晶體分類
  desc: 區分金屬鍵、離子鍵與共價鍵的形成機制，並對應金屬、離子、分子與共價網狀四類晶體。
- code: T07
  name: 物質導電性與狀態判斷
  desc: 依據固態、液態（熔融態）與水溶液態的自由電子或自由離子存在與否，判斷導電性。
- code: T08
  name: 離子化合物晶格能與熔點
  desc: 利用離子電荷乘積與離子半徑和比較晶格能大小，進而判斷離子晶體的熔點高低。
- code: T09
  name: 共價分子位能與鍵長鍵能
  desc: 判讀雙原子分子形成時的位能對核間距關係圖，找出平衡鍵長、鍵能及引力斥力大小區域。
- code: T10
  name: 熔化斷鍵類型與八隅體
  desc: 判斷物質熔化時破壞的作用力是否為共價鍵，或檢驗分子路易斯結構的鍵級與八隅體遵循度。
- code: T11
  name: 離子鍵共價鍵金屬鍵類型判別
  desc: 依據組成元素的金屬與非金屬性質，判斷物質所含化學鍵種類並區分離子化合物與分子化合物。
- code: T12
  name: 雙原子分子鍵結位能曲線判讀
  desc: 判讀雙原子分子形成時的位能-核間距曲線圖上的鍵能與鍵長，並比較不同鹵素分子曲線的相對位置。
- code: T13
  name: 離子晶體晶格能與熔點大小比較
  desc: 利用離子電荷乘積與離子間距關係比較不同離子晶體的晶格能（離子鍵鍵能）與熔點高低。
- code: T14
  name: 離子晶體堆積配位與性質判斷
  desc: 了解氯化鈉等離子晶體的陰陽離子配位數、晶體不具延展性及固態不導電而熔融或溶於水導電的性質。
- code: T15
  name: 金屬鍵電子海模型與導電延展性
  desc: 運用金屬鍵自由電子海模型解釋金屬的導電性、導熱性、溫度對導電度影響、延展性與合金硬度。
- code: T16
  name: 共價網狀固體結構與導電硬度
  desc: 判別鑽石、石墨、石墨烯、矽與石英的共價網狀或層狀結構特徵、碳原子混成軌域與導電硬度差異。
- code: T17
  name: 化學鍵鍵能與物質能量高低比較
  desc: 比較不同雙原子分子斷鍵吸收的鍵能大小，或比較氣態原子、氣態離子與離子晶體間的位能高低。
- code: T19
  name: 離子鍵、共價鍵與配位鍵判別
  desc: 依據物質組成元素與路易斯結構，判斷化合物內部是否同時含有離子鍵、共價鍵或配位共價鍵。
- code: T20
  name: 晶體類型與物質導電熔點性質
  desc: 區分金屬、離子、分子與共價網狀固體的微觀結構，比較不同狀態下的導電度與化學式表示法。
- code: T22
  name: 週期表元素組合推斷鍵結與物性
  desc: 由週期表相對位置辨識金屬與非金屬元素，推斷兩者結合形成的化學式與晶體種類。
