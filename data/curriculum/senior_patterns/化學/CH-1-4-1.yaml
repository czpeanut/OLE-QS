unit:
  subject: 化學
  code: CH-1-4-1
  title: 生物體分子
status: draft
types:
- code: T01
  name: 醣類構造、水解與呈色
  desc: 區分單醣、雙醣與多醣的結構與通式，並判別酸水解產物與碘液檢驗反應。
- code: T02
  name: 油脂組成與皂化反應
  desc: 判別脂肪酸與甘油酯化結構、飽和與不飽和脂肪酸狀態差異，以及油脂在強鹼下的皂化水解。
- code: T03
  name: 醣類分類與水解計量計算
  desc: 區分單醣、雙醣與多醣結構，並利用蔗糖與澱粉水解反應計算生成葡萄糖與果糖的質量。
- code: T04
  name: 蛋白質與油脂之組成結構比較
  desc: 比較蛋白質的胺基酸聚合物特性與油脂的脂肪酸甘油酯結構，及所含原子種類差異。
- code: T05
  name: 核酸結構與元素組成判別
  desc: 區分 DNA 雙股與 RNA 單股結構差異，並辨識核酸所含碳、氫、氧、氮、磷元素組成。
- code: T06
  name: 生物大分子與單體配對辨識
  desc: 對應澱粉、纖維素、蛋白質、DNA 與 RNA 等生物高分子與其基本組成單體的關係。
- code: T07
  name: 有機與無機含碳化合物區分
  desc: 依據有機化合物定義，區分碳氫化合物及其衍生物與碳酸鹽、碳化物、氰化物等無機物。
- code: T08
  name: 生物體分子代謝熱量與計量
  desc: 依據醣類或營養素的莫耳代謝熱量與溶液濃度，計算維持身體能量所需攝取或注射的質量。
- code: T09
  name: 單醣脫水縮合與通式推算
  desc: 依據碳水化合物通式及單醣脫水縮合規則，推算寡醣與雙醣分子式及原子數比。
- code: T10
  name: 醣類異構物與聚合物辨識
  desc: 比較單醣、雙醣與多醣分子式與聚合度差異，判別同分異構物及物理性質。
- code: T11
  name: 食品成分與營養標示分析
  desc: 依據食品成分表與營養標示，判別其中含有的醣類、飽和與不飽和脂肪及蛋白質。
