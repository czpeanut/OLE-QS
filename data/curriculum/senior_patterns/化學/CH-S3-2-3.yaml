unit:
  subject: 化學
  code: CH-S3-2-3
  title: 溶解平衡
status: draft
types:
- code: T01
  name: 混合陽離子分步沉澱與分離流程
  desc: 依據陽離子分離實驗流程圖與加入試劑後的沉澱濾液結果，判斷溶液中含有的金屬離子組合或加入試劑順序。
- code: T02
  name: 由Ksp計算難溶鹽溶解度與比較
  desc: 依難溶鹽解離陰陽離子係數比列出 Ksp 與溶解度 s 之關係式，計算並比較不同鹽類溶解度大小。
- code: T03
  name: 離子積Q與Ksp比較判斷沉澱
  desc: 先計算溶液混合稀釋後的各離子濃度與離子積 Q，再與 Ksp 比較求產生沉澱所需最低濃度。
- code: T04
  name: 同離子效應與Ksp反推計算
  desc: 利用飽和溶液加入共同離子後溶解度大幅下降之特性，搭配 Ksp 關係式求解或反推 Ksp 值。
- code: T05
  name: 選擇性分步沉澱與離子分離流程
  desc: 依流程圖依序加入沉澱劑，利用各難溶鹽溶解度差異判斷可被逐一分離的金屬離子組合。
- code: T06
  name: 同離子效應對溶解度的影響
  desc: 比較難溶鹽在純水與含相同陰或陽離子的電解質溶液中的溶解度大小，或計算同離子存在下的溶解度。
- code: T07
  name: 共存雙難溶鹽的飽和溶解平衡
  desc: 針對兩種含共同離子的難溶鹽同時溶於水達飽和的系統，聯立Ksp與電荷守恆推導各離子濃度關係。
- code: T08
  name: 陽離子分組分離與未知溶液鑑別
  desc: 利用特定試劑或流程圖進行陽離子與陰離子的沉澱分離、錯合溶解或顏色確認，鑑別未知溶液成分。
- code: T09
  name: 酸鹼度對難溶鹽溶解度的影響
  desc: 依據陰離子是否為弱酸根或氫氧根，判斷溶液 pH 值改變時難溶鹽溶解度的增減方向。
