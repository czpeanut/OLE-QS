unit:
  subject: 化學
  code: CH-S5-3-2
  title: 塑膠與橡膠
status: draft
types:
- code: T01
  name: 天然與合成橡膠單體及硫化反應
  desc: 辨識天然橡膠（異戊二烯）與合成橡膠的單體與雙鍵保留特徵，並解釋硫化反應對彈性與硬度的影響。
- code: T02
  name: 常見加成塑膠單體與性質應用
  desc: 對應PE、PVC、PS、PP、PTFE與壓克力等常見合成塑膠的單體結構、溶解性與生活用途。
- code: T03
  name: 縮合塑膠與合成纖維結構性質
  desc: 辨識耐綸、達克綸（PET）與酚醛樹脂（電木）的單體來源、鍵結類型、性質與回收分類。
- code: T04
  name: 天然與合成橡膠單體與硫化交聯
  desc: 判別天然橡膠（聚異戊二烯）與合成橡膠的單體結構，以及加硫交聯增強彈性的機制。
- code: T05
  name: 常見合成塑膠單體、分類與用途
  desc: 辨識聚乙烯、聚氯乙烯、聚四氟乙烯（特夫綸）、保麗龍與寶特瓶等塑膠的單體及熱塑／熱固性。
- code: T06
  name: 合成纖維與耐綸、達克綸結構判別
  desc: 區分聚醯胺（耐綸）與聚酯（達克綸）的單體組成、鍵結官能基及縮合聚合特徵。
- code: T07
  name: 塑膠回收標誌與環境降解處理
  desc: 辨識常見塑膠材質的回收代碼與特性，並評估燃燒或分解處理對環境的影響。
- code: T08
  name: 熱塑性與熱固性聚合物結構比較
  desc: 從線性、支鏈與網狀交聯分子結構差異，比較熱塑性塑膠與熱固性樹脂的受熱行為與機械強度。
- code: T09
  name: 塑膠廢棄物處理與環保回收判別
  desc: 區分熱塑性與熱固性塑膠的回收再製性，並判別含氯塑膠燃燒產生戴奧辛等環境問題。
- code: T10
  name: 纖維種類區分與燃燒鑑定比較
  desc: 比較天然植物纖維、動物蛋白質纖維與合成纖維的組成成分、吸水性與燃燒氣味特徵。
