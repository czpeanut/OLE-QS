unit:
  subject: 化學
  code: CH-1-4-4
  title: 化學的現代應用
status: draft
types:
- code: T01
  name: 綠色化學原子使用效率計算
  desc: 依據化學反應式計算目標產物總質量占所有生成物總質量的百分率（原子經濟）。
- code: T02
  name: 綠色化學原則與原子經濟
  desc: 依據原子經濟、無毒溶劑與減少廢棄物等綠色化學指標，評估最適合成途徑。
- code: T03
  name: 奈米材料與光觸媒作用機制
  desc: 由題幹描述的奈米尺寸效應、半導體電子電洞對與抗菌機制，判別材料性質與應用。
- code: T04
  name: 綠色化學十二原則與實例判別
  desc: 判斷清潔劑直鏈結構、環保可分解材料與替代冷媒等做法是否符合綠色化學減害原則。
- code: T05
  name: 原子經濟度與使用效率計算
  desc: 依據綠色化學原子經濟度公式，由目標產物分子量除以所有反應物總分子量計算使用效率。
- code: T06
  name: 奈米材料尺度與表面積效應
  desc: 判別奈米長度尺度定義、奈米粒子比表面積劇增造成的活性與顏色變化及蓮花效應原理。
- code: T07
  name: 光觸媒二氧化鈦之催化機制
  desc: 說明奈米級二氧化鈦吸收紫外線產生電子電洞，進而將有機汙染物分解為二氧化碳與水。
- code: T08
  name: 生質柴油與永續能源開發
  desc: 辨識廢食用油經轉酯化製備生質柴油的化學成分、再生能源屬性與降低排碳毒物優勢。
