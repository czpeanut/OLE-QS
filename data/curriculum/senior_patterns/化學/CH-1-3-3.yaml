unit:
  subject: 化學
  code: CH-1-3-3
  title: 溶解度
status: draft
types:
- code: T01
  name: 溶解度實驗操作與讀值
  desc: 判讀加熱溶解與冷卻析出結晶的實驗步驟注意事項，並由實驗質量數據換算指定溫度的溶解度。
- code: T02
  name: 影響溶解度因素與飽和判定
  desc: 區分溫度、壓力、攪拌及吸放熱對固體或氣體在水中溶解度的影響。
- code: T03
  name: 溶解度曲線判讀與飽和調整
  desc: 由溶解度對溫度曲線圖判讀溶液狀態，計算達飽和所需增減的溶質或溶劑量。
- code: T04
  name: 再結晶法分離與純度計算
  desc: 根據混合物兩成分的溶解度曲線差異，計算高溫溶解冷卻結晶後的析出量與純度。
- code: T05
  name: 亨利定律與氣體溶解度計算
  desc: 利用定溫下難溶氣體在液體中的溶解質量與分壓成正比、溶解體積為定值的關係求解。
- code: T06
  name: 混合氣體溶解平衡與莫耳數比
  desc: 結合空氣組成百分率與各氣體的亨利常數或標準溶解度，求算達溶解平衡時水中各氣體莫耳數比。
- code: T07
  name: 飽和溶液降溫析出與結晶順序
  desc: 依據高低溫溶解度差值與溶劑質量比例，計算飽和溶液降溫析出晶體克數或判斷多溶質冷卻結晶先後順序。
- code: T08
  name: 溶解度與重量百分率濃度換算
  desc: 利用溶解度定義將各點或表列溶解度換算為重量百分率濃度，或由已知重量百分率反推溶質溶劑量以調整飽和。
