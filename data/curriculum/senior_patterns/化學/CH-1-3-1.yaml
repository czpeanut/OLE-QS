unit:
  subject: 化學
  code: CH-1-3-1
  title: 溶液的種類與特性
status: draft
types:
- code: T01
  name: 溶液相態與種類判別
  desc: 依據溶質與溶劑的聚集狀態，辨識氣態、液態與固態溶液（如合金）的實例。
- code: T02
  name: 真溶液與膠體溶液區分
  desc: 依據溶質粒子粒徑大小與過濾、透光性質差異，區分真溶液、膠體溶液與懸浮液。
- code: T03
  name: 膠體粒子特性與凝聚機制
  desc: 判別布朗運動、廷得耳效應、膠體粒子吸附電荷及通電或加電解質促使凝聚的原理。
- code: T04
  name: 真溶液膠體與懸浮液區分
  desc: 依據粒子直徑大小、透光性與是否均一穩定，辨識生活實例所屬的混合物類型。
- code: T05
  name: 溶質與溶劑界定及組成判別
  desc: 根據混合物狀態與各成分比例（如合金或濃硫酸），正確界定溶質與溶劑。
- code: T06
  name: 膠體溶液性質與廷得耳效應
  desc: 判別膠體的散射光線、布朗運動、表面帶電及加入電解質凝聚等特性。
