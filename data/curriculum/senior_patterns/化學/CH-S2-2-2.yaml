unit:
  subject: 化學
  code: CH-S2-2-2
  title: 分子的鍵結與形狀
status: draft
types:
- code: T01
  name: 路易斯結構、八隅體與共振
  desc: 繪製分子與離子的路易斯結構，計算鍵結與孤電子對數，並判斷八隅體例外與共振現象。
- code: T02
  name: 混成軌域判別與計數
  desc: 依據中心原子鍵結區域數判斷混成軌域類型，或計算複雜分子各混成碳數。
- code: T03
  name: σ鍵與π鍵重疊與性質
  desc: 辨識單鍵與多重鍵中σ鍵與π鍵的組成軌域、重疊方式、電子雲分布與旋轉自由度。
- code: T04
  name: VSEPR分子形狀與鍵角比較
  desc: 運用價層電子對互斥理論及孤電子對斥力差異，判斷分子或離子幾何形狀並比較鍵角大小。
- code: T05
  name: 鍵級、鍵長與鍵能大小比較
  desc: 依據鍵級與原子半徑，比較分子或離子間的鍵長與鍵能大小。
- code: T06
  name: 路易斯結構與價電子計數
  desc: 繪製分子或離子的路易斯結構，計算共用電子對（bp）與未鍵結電子對（lp）數目。
- code: T07
  name: σ鍵與π鍵計數及軌域重疊
  desc: 區分頭對頭重疊的σ鍵與側對側重疊的π鍵特性，計算結構式中σ與π鍵總數並判斷重疊軌域。
- code: T08
  name: 中心原子混成軌域判別
  desc: 依據立體數（鍵結原子數加孤對電子數）判斷中心原子的sp、sp2、sp3等混成軌域類型。
- code: T09
  name: VSEPR分子形狀與鍵角
  desc: 依據混成軌域與孤對電子對數預測分子幾何形狀，並比較不同分子或離子的鍵角大小。
- code: T10
  name: 鍵級與鍵長鍵能大小比較
  desc: 透過路易斯結構或共振結構求算鍵級，進而比較分子或離子間共價鍵的鍵長與鍵能大小。
- code: T11
  name: 鍵偶極與分子極性判別
  desc: 結合化學鍵電負度差異與分子幾何對稱性，判斷分子整體是否具有偶極矩（極性或非極性分子）。
- code: T12
  name: 鍵極性與對稱性判別分子極性
  desc: 結合共價鍵的電負度差與分子立體幾何對稱性，判斷具有極性共價鍵的非極性分子。
- code: T13
  name: 八隅體法則與孤對電子數目判別
  desc: 繪製路易斯結構判斷分子或離子是否符合八隅體法則（含缺電子、奇數電子與擴張八隅體）及中心原子孤對電子數。
- code: T14
  name: 混成軌域種類與軌域重疊判讀
  desc: 依據中心原子鍵結數與孤對電子數決定sp、sp2、sp3混成軌域種類，並判讀鍵結軌域重疊示意圖。
- code: T15
  name: VSEPR理論預測分子幾何形狀
  desc: 運用價殼層電子對互斥模型預測分子或離子的空間幾何形狀，並判斷哪些分子屬於平面結構。
- code: T16
  name: 中心原子孤對電子對鍵角影響
  desc: 比較相同電子對排列下因中心原子孤對電子數不同、電負度差異或共振造成的鍵角大小順序。
- code: T17
  name: σ鍵與π鍵數目及鍵結特性判斷
  desc: 計算有機或無機分子中單雙參鍵所含的σ鍵與π鍵總數，並區分兩者的軌域重疊方式與可旋轉性。
- code: T18
  name: 共振結構判別與鍵長鍵級比較
  desc: 判斷具有共振現象的分子或離子，並利用鍵級與原子半徑比較不同分子或離子的共價鍵長與鍵能。
- code: T19
  name: 鍵極性與分子偶極矩極性大小
  desc: 區分極性共價鍵與極性分子，結合鍵偶極向量和分子對稱性判斷分子是否具極性及極性大小比較。
- code: T20
  name: 複雜分子結構式綜合解析
  desc: 根據題目提供的複雜分子結構式（如三聚氰胺），綜合求算分子式、元素重量百分率、混成軌域、孤對電子與σ/π鍵數。
