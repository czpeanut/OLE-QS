unit:
  subject: 化學
  code: CH-S4-1-2
  title: 平衡氧化還原反應式
status: draft
types:
- code: T01
  name: 氧化數增減與半反應法平衡
  desc: 利用得失電子總數相等原則與電荷、原子守恆，平衡酸鹼環境下的離子氧化還原反應式。
- code: T02
  name: 反應物兼作氧化劑與介質比例
  desc: 平衡反應式後，區分同一反應物（如硝酸）中實際發生氧化數改變者與僅提供酸根者所占比例。
- code: T03
  name: 氧化數法平衡一般氧化還原式
  desc: 先標定氧化數升降總數使其相等，再依電荷守恆與原子守恆補足氫離子、氫氧根與水完成平衡。
- code: T04
  name: 半反應法平衡酸鹼環境反應式
  desc: 將總反應拆分為氧化與還原兩個半反應式，分別於酸性或鹼性介質中平衡原子與電荷後合併。
- code: T05
  name: 自身氧化還原反應式平衡與比例
  desc: 平衡同一反應物同時進行氧化與還原的方程式，並計算氧化劑與還原劑所占比例或產物比。
- code: T06
  name: 兼作酸與氧化劑之反應物比例
  desc: 分析如硝酸或濃硫酸等同時提供酸根離子與進行氧化反應的試劑，計算作為氧化劑所占百分比。
- code: T07
  name: 平衡反應式之電子轉移與產物比
  desc: 結合平衡後的氧化還原反應式係數，計算定莫耳數反應物轉移的電子總數或各產物莫耳數比。
- code: T08
  name: 氧化數法平衡氧化還原反應式
  desc: 計算氧化劑與還原劑的氧化數升降總和，利用最小公倍數與原子不滅平衡反應式係數並求總和。
- code: T09
  name: 自身氧化還原反應半反應平衡
  desc: 針對同一物種同時發生氧化與還原的反應，分別寫出兩半反應並計算該物種作為還原劑所占的比例。
- code: T10
  name: 未知係數氧化還原式推求與檢驗
  desc: 由已知物種與部分生成物平衡氧化還原反應式後，檢驗各係數之間的數學關係與電子轉移數。
