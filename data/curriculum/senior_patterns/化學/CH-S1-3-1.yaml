unit:
  subject: 化學
  code: CH-S1-3-1
  title: 水的性質
status: draft
types:
- code: T01
  name: 液晶分子的構造特性與應用
  desc: 判別液晶分子的棒狀結構、流動性、光學異向性及受電場或溫度調控排列的性質。
- code: T02
  name: 飽和蒸氣壓與體積水量關係
  desc: 判斷定溫下密閉容器中純液體或飽和溶液達平衡時，蒸氣壓與容器大小或液量無關。
- code: T03
  name: 可變體積密閉容器氣液相平衡
  desc: 分析活塞拉動改變體積時，純液體蒸氣壓與蒸氣量隨氣液共存區與全氣化區的變化圖形。
- code: T04
  name: 密閉系統溶劑蒸氣轉移平衡
  desc: 將純水與不同濃度溶液置於同一密閉空間，依蒸氣壓高低判斷水蒸氣轉移方向與最終水量。
- code: T05
  name: 沸點外壓與分子間引力比較
  desc: 根據不同液體的正常沸點與飽和蒸氣壓，比較分子間引力大小及改變外壓對沸點的影響。
- code: T06
  name: 三相圖區域線段與特殊點判讀
  desc: 判讀純物質三相圖中的固液氣區域、三相點、臨界點及各相界線所代表的物理意義。
- code: T07
  name: 外壓對熔點沸點與體積影響
  desc: 依據三相圖熔化曲線斜率與水反常膨脹性質，判斷外壓改變對熔點、沸點與等溫壓縮體積的影響。
- code: T08
  name: 飽和蒸氣壓曲線與分子間引力
  desc: 由不同純物質的蒸氣壓-溫度曲線比較正常沸點高低、分子間作用力強弱與相變趨勢。
- code: T09
  name: 氣液共存P-V等溫線臨界判讀
  desc: 判讀定量揮發性液體在定溫下壓力隨容器體積變化的曲線，求算飽和蒸氣壓與完全汽化體積。
- code: T10
  name: 物質加熱冷卻曲線與比熱計算
  desc: 由物質定壓加熱或冷卻的溫度-時間曲線判讀熔點、沸點、相變過程並計算固液氣態比熱。
- code: T11
  name: 純水與溶液蒸氣壓大小比較
  desc: 比較不同水量、溫度或是否加入溶質達飽和時，密閉瓶內水蒸氣壓與蒸氣分子數的大小關係。
- code: T12
  name: 飽和蒸氣壓動態平衡與影響因素
  desc: 判斷密閉容器中液氣平衡特徵，釐清飽和蒸氣壓僅隨溫度與液體種類改變而與體積存量無關。
- code: T13
  name: 蒸氣壓曲線圖判讀沸點與引力
  desc: 由不同液體的飽和蒸氣壓對溫度曲線圖，比較正常沸點、莫耳汽化熱與分子間作用力大小。
- code: T14
  name: 相對溼度、露點溫度與凝結判斷
  desc: 結合相對溼度與飽和水蒸氣壓曲線，判斷降溫後的露點溫度或水蒸氣是否達飽和凝結。
- code: T15
  name: 真空容器定溫壓縮液化與氣化
  desc: 判讀液體於定溫容器內的 P-V 關係圖，區分飽和蒸氣壓水平段與完全氣化後波以耳定律段。
- code: T16
  name: 定容升溫液氣共存質量推算
  desc: 讀取 P-T 圖中飽和蒸氣壓與完全氣化轉折點，計算特定溫度下仍以液態存在的物質質量。
- code: T17
  name: 液氣共存與完全汽化之壓力變化
  desc: 在定溫下改變含液體密閉容器體積或水量，比較飽和蒸氣壓與理想氣體估算壓以判斷是否液氣共存。
- code: T18
  name: 托里切利氣壓計測定飽和蒸氣壓
  desc: 由水銀柱下降高度判斷純溶劑或溶液的飽和蒸氣壓大小，並分析溫度改變對汞柱高度的影響。
- code: T19
  name: 相對濕度與空氣壓縮蒸氣壓計算
  desc: 依據相對濕度定義計算水蒸氣分壓，並判斷氣體壓縮後水蒸氣是否達飽和而凝結以求總壓。
- code: T21
  name: 物質三態性質與相變熱觀念
  desc: 辨識固、液、氣三態的體積與形狀特徵，以及蒸發、昇華、熔化與凝固等相變熱性質。
