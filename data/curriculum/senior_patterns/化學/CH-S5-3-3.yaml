unit:
  subject: 化學
  code: CH-S5-3-3
  title: 生物體中的大分子
status: draft
types:
- code: T01
  name: 醣類組成、分類與還原性檢驗
  desc: 區分單醣、雙醣（蔗糖、麥芽糖）與多醣（澱粉、纖維素）的分子式、水解產物與斐林試劑反應性。
- code: T02
  name: 胺基酸結構與胜肽縮合水解計數
  desc: 辨識α-胺基酸的兩性官能基，並計算多肽結構中所含醯胺鍵（肽鍵）數目與組成的胺基酸種類數。
- code: T03
  name: 核酸DNA與RNA的構造及鹼基
  desc: 辨識去氧核糖核酸的五碳醣、磷酸二酯鍵、四種含氮鹼基及雙股螺旋結構特徵。
- code: T04
  name: 生物大分子與天然物官能基綜合比
  desc: 綜合比較醣類、蛋白質、核酸與油脂的單體單元、鍵結方式與分子內官能基異同。
- code: T05
  name: 油脂結構組成氫化與皂化
  desc: 判別三酸甘油酯的飽和與不飽和脂肪酸組成，以及植物油氫化硬化與反式脂肪生成機制。
- code: T06
  name: 單醣雙醣多醣結構與檢驗區分
  desc: 區分葡萄糖、果糖、蔗糖、澱粉與纖維素的組成與還原性，並以多侖試劑與碘液鑑別。
- code: T07
  name: 胺基酸結構與多肽鍵結數量計算
  desc: 判別α-胺基酸結構特徵，並由多肽結構式計算勝肽鍵數、水解所需水量與單體種類數。
- code: T08
  name: 蛋白質一至四級結構與氫鍵維持
  desc: 區分蛋白質一級胺基酸序列、二級α-螺旋與β-褶板氫鍵結構及三四級立體構形。
- code: T09
  name: 蛋白質結構、氫鍵與檢驗反應
  desc: 判別蛋白質的分子內氫鍵、變性條件及常見天然纖維（蠶絲與棉花）的化學組成與官能基差異。
- code: T10
  name: 醣類分類結構與還原性檢驗
  desc: 區分單醣、雙醣與多醣的組成與異構物關係，並判別與多侖或斐林試劑的還原性反應。
- code: T11
  name: 胺基酸兩性與蛋白質變性
  desc: 判斷胺基酸的結構、等電點與兩性行為，以及蛋白質由肽鍵聚合與加熱加酸變性機制。
- code: T12
  name: 核酸組成單元與雙股結構
  desc: 辨識DNA與RNA的五碳醣、含氮鹼基配對差異與核苷酸聚合方式。
- code: T13
  name: 天然高分子水解計量與應用
  desc: 計算雙醣、多醣或油脂水解反應的莫耳數與質量關係，並連結營養標示與生物體功能。
- code: T14
  name: 蛋白質變性因素與呈色檢驗反應
  desc: 判別加熱、酸鹼、酒精與重金屬對蛋白質二三四級結構變性的影響，及濃硝酸呈色反應。
- code: T15
  name: 核酸組成單元與鹼基配對判別
  desc: 區分DNA與RNA的五碳醣與含氮鹼基差異，並應用鹼基互補配對原則進行比例計算。
