unit:
  subject: 化學
  code: CH-S3-1-1
  title: 化學平衡
status: draft
types:
- code: T01
  name: 動態平衡特徵與速率濃度關係
  desc: 判斷可逆反應達平衡時正逆反應速率相等、各物種濃度維持定值但未必等於係數比。
- code: T02
  name: 反應商Q與平衡進行方向判斷
  desc: 比較即時反應商 Q 與平衡常數 K 大小關係，預測反應將向右進行、向左進行或已達平衡。
- code: T03
  name: 平衡達標條件與濃度時間圖判讀
  desc: 由濃度對時間變化曲線辨識反應起始點、達成平衡時間及各物質消耗生成量比例。
- code: T04
  name: 可逆反應與不可逆反應實例區分
  desc: 根據反應系統是否密閉及是否有沉澱或氣體逸出，區分可達平衡之可逆反應與完全反應。
- code: T05
  name: 化學平衡與相平衡之共通性辨識
  desc: 類比蒸發凝結相平衡與化學反應動態平衡，檢驗平衡狀態下微觀速率與巨觀性質不變性。
- code: T06
  name: 巨觀物理量判別平衡達成
  desc: 檢驗反應前後氣體係數總和變化、顏色與分壓等巨觀性質，區分何者可作為達平衡之指標。
- code: T07
  name: 平衡建立必要條件與移動機制
  desc: 辨識定溫、密閉與可逆等平衡前提條件，並分析速率變化與催化劑對平衡移動及K值的影響。
- code: T08
  name: 同位素示蹤與溶解結晶平衡
  desc: 運用同位素標記追蹤或結晶溶解微觀交換過程，驗證動態平衡下正逆反應持續進行且外觀或結晶水可變。
