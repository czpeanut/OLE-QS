unit:
  subject: 化學
  code: CH-S3-2-1
  title: 電解質與阿瑞尼斯的解離說
status: draft
types:
- code: T01
  name: 電解質與非電解質分類判別
  desc: 依據水溶液或熔融態是否藉陰陽離子移動導電判斷電解質，並釐清分子化合物亦可能為電解質。
- code: T02
  name: 電解質定義與不同狀態導電度
  desc: 區分金屬導體、離子化合物與分子化合物在固態、熔融態及水溶液下的導電性與電解質歸屬。
- code: T03
  name: 阿瑞尼斯解離說與電中性原則
  desc: 判別電解質水溶液中陰陽離子總電荷相等但離子個數未必相等，以及阿瑞尼斯酸鹼的基本定義。
- code: T04
  name: 強電解質與弱電解質導電度比較
  desc: 依溶質在水中解離程度大小區分強酸、強鹼、鹽類與弱酸弱鹼，比較同濃度溶液導電性。
- code: T05
  name: 多元電解質解離之離子濃度計算
  desc: 依據強電解質完全解離的化學計量，計算混合不同電解質溶液後各離子的最終莫耳濃度。
- code: T06
  name: 自由電子與離子遷移導電機制
  desc: 區分金屬與石墨藉自由電子導電，與離子及分子化合物在固態、液態、熔融態及水溶液中是否產生可移動離子導電之差異。
- code: T07
  name: 電解質溶液鑑別與電極遷移方向
  desc: 利用導電度、焰色反應與沉澱試劑分辨電解質與非電解質溶液，並判別通電時陰陽離子向正負極移動的方向。
