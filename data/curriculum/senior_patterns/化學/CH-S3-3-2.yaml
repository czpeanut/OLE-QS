unit:
  subject: 化學
  code: CH-S3-3-2
  title: 酸與鹼的分類和命名
status: draft
types:
- code: T01
  name: 無氧酸與含氧酸的中文命名規則
  desc: 區分氣態分子與水溶液酸的命名差異，並依據中心原子氧化數高低正確命名高、正、亞、次含氧酸。
- code: T02
  name: 多質子酸的質子數與結構判別
  desc: 依據分子結構中可解離氫原子的數目，正確判斷磷酸、亞磷酸、次磷酸及有機酸的質子數。
- code: T03
  name: 正鹽、酸式鹽與鹼式鹽的分類
  desc: 依據鹽類組成中是否仍含可解離氫原子或氫氧根離子，區分正鹽、酸式鹽、鹼式鹽與複鹽錯鹽。
- code: T04
  name: 鹽類化學式與中文命名對應
  desc: 依據酸根名稱與金屬陽離子組成，判斷正鹽、酸式鹽與鹼式鹽的中文系統命名是否正確。
- code: T05
  name: 有機酸與無機酸的性質與強度分類
  desc: 區分常見強酸、強鹼與弱酸、弱鹼的組成類別，並判別不同狀態下的命名與酸鹼表現。
- code: T06
  name: 鹽類分類與水解酸鹼性判別
  desc: 綜合判斷鹽類屬正鹽或酸式鹽，並依離子水解與解離能力判別其水溶液的酸鹼性。
- code: T07
  name: 變價金屬鹼與多類酸鹼命名
  desc: 區分亞鐵、亞錫等變價金屬氫氧化物與高、正、亞、次含氧酸的中文系統命名規則。
