unit:
  subject: 化學
  code: CH-S5-3-1
  title: 聚合物
status: draft
types:
- code: T01
  name: 由聚合物結構反推單體與聚合方式
  desc: 觀察高分子重複單元結構式，逆推其原始單體分子結構並判斷屬於同元聚合物或共聚物。
- code: T02
  name: 聚合物分子性質與滲透壓測聚合度
  desc: 依據聚合物官能基判斷吸水性與氫鍵，或利用滲透壓數據計算澱粉等大分子的平均分子量與聚合度。
- code: T03
  name: 機能性與吸水性高分子應用分析
  desc: 依據單體官能基（如丙烯醯胺、丙烯酸）解釋吸水性樹脂的吸水機制與交聯結構對性質的影響。
- code: T04
  name: 聚合物基本概念、分子量與分類
  desc: 判別單體單元、聚合度、均聚物與共聚物定義，以及利用滲透壓法測定平均分子量。
- code: T05
  name: 加成聚合與縮合聚合反應判別
  desc: 依據單體是否含雙鍵或雙官能基及反應是否脫去小分子，區分加成聚合與縮合聚合反應。
- code: T06
  name: 由聚合物重複單元反推單體結構
  desc: 觀察加成或縮合聚合物的結構重複單元，切斷鍵結並還原推寫出原本的單體化學式。
- code: T07
  name: 聚合物結構對熱塑性與強度影響
  desc: 分析線狀、支鏈、網狀交聯結構及添加塑化劑對聚合物硬度、彈性、熱塑性與熱固性影響。
- code: T08
  name: 聚合物與小分子化合物分類區分
  desc: 依據分子量大小與重複單元特徵，區分天然或合成高分子聚合物與油脂等一般分子化合物。
- code: T09
  name: 聚合物化學特性與環保可分解應用
  desc: 判斷聚合物主鏈或側鏈官能基保留的化學反應性，以及生物可分解外科縫線聚酯的特性。
