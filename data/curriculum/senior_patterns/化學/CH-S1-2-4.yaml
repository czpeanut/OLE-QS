unit:
  subject: 化學
  code: CH-S1-2-4
  title: 氣體分壓
status: draft
types:
- code: T01
  name: 道耳頓分壓定律與連通管混合
  desc: 將不同容器氣體打開活栓混合或壓縮至同一容器，利用各氣體PiVi總和守恆求分壓與總壓。
- code: T02
  name: 氣體反應耗盡後總壓與分壓
  desc: 考慮氣體間發生化學反應（含產生固體或反應係數變化）後，計算剩餘氣體的分壓與總壓。
- code: T03
  name: 排水集氣法校正水蒸氣壓計算
  desc: 讀取集氣瓶內外水面高度差折算水銀柱高，扣除該溫度水飽和蒸氣壓後求乾燥氣體分壓與分子量。
- code: T04
  name: 含水蒸氣容器壓縮液化總壓
  desc: 當容器含少量液態水時，體積壓縮後水蒸氣壓維持飽和蒸氣壓不變，僅非凝結氣體壓力倍增。
- code: T05
  name: 燃燒後冷卻與水蒸氣壓處理
  desc: 結合氣態烴完全燃燒產物分壓與冷卻後水蒸氣凝結飽和蒸氣壓，計算各溫度下的容器總壓。
- code: T06
  name: 微觀粒子圖與氣體分壓分析
  desc: 由微觀粒子數量示意圖與容器體積比，計算各氣體分壓、總壓、密度與平均運動速率。
- code: T07
  name: 連通瓶混合分壓與平均分子量
  desc: 計算多個不同壓力與體積容器連通混合達平衡後的氣體總壓、各瓶分壓、莫耳數比與平均分子量。
- code: T08
  name: 氣體反應後總壓與分壓變化
  desc: 處理混合氣體發生完全反應（生成氣體、液體或固體）後，計算剩餘與生成氣體的分壓及系統總壓。
- code: T09
  name: 排水集氣法與液面差校正
  desc: 在排水集氣裝置中扣除水的飽和蒸氣壓並換算內外液面水柱高度差，求算收集氣體的真實分壓。
- code: T10
  name: 氣液共存壓縮或膨脹飽和蒸氣壓
  desc: 判斷密閉容器內共存不凝結氣體與揮發性液體在體積或溫度改變時，飽和蒸氣壓不變或全部汽化的臨界狀態。
- code: T11
  name: 蒸氣壓平衡與活塞移動計算
  desc: 分析含飽和蒸氣之兩室活塞系統或溫度變化時，蒸氣凝結與活塞移動達平衡後的體積比與壓力。
- code: T12
  name: 氣體混合反應性與定律適用判斷
  desc: 判斷常溫下兩氣體混合後是否發生化學反應，進而判別該氣體組合是否適用道耳頓分壓定律。
- code: T13
  name: 道耳頓分壓定律適用條件與關係
  desc: 辨識混合氣體不反應才適用分壓定律的條件，並驗證莫耳分率與分壓、總壓之比例關係。
- code: T14
  name: 雙容器連通混合之總壓與分壓
  desc: 利用連通閥門打開前後各氣體莫耳數不變（PV守恆），計算混合後系統總壓與莫耳數比。
- code: T15
  name: 化學反應或氣化後之氣體分壓
  desc: 先以限量試劑與化學計量求反應後或液體氣化後各氣體莫耳數，再計算個別分壓與總壓。
- code: T16
  name: 含水蒸氣體積壓縮之總壓計算
  desc: 壓縮含水蒸氣的混合氣體時，檢核水蒸氣分壓是否達飽和蒸氣壓上限，再加總乾氣體分壓。
- code: T17
  name: 燃燒後分壓變化推算混合氣組成
  desc: 依據混合氣體反應或燃燒前後於定溫定容下的總壓與二氧化碳分壓，列式求解原莫耳分率。
- code: T18
  name: 道耳頓分壓定律適用條件
  desc: 判斷混合氣體在指定溫度下是否會發生化學反應，以決定是否適用道耳頓分壓定律。
- code: T19
  name: 連通管氣體混合與反應後總壓
  desc: 利用混合前後各氣體的莫耳數守恆或化學反應計量，計算活栓打開連通達平衡後的系統總壓與分壓。
- code: T20
  name: 氣體反應前後壓力與分壓計算
  desc: 在定溫定容容器中進行氣體燃燒或爆炸反應，利用氣體壓力變化推算反應前與反應後各氣體分壓。
