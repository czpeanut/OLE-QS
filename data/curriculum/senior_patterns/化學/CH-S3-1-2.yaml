unit:
  subject: 化學
  code: CH-S3-1-2
  title: 平衡常數
status: draft
types:
- code: T01
  name: 平衡常數表示法與數學運算
  desc: 寫出勻相或異相平衡的Kc與Kp表示式，並計算反應式係數倍增、反轉或相加後的平衡常數。
- code: T02
  name: 平衡常數的影響因素判別
  desc: 判別平衡常數僅受溫度、反應本性與溶劑影響，而不隨濃度、壓力、體積或催化劑改變。
- code: T03
  name: 平衡濃度與平衡常數定量計算
  desc: 運用起始、變化、平衡三段式推算各物種平衡濃度或分壓，進而求出平衡常數或轉化率。
- code: T04
  name: 反應商Q與平衡移動方向判斷
  desc: 計算特定時刻的反應商並與平衡常數比較，預測可逆反應將向正反應或逆反應方向進行。
- code: T05
  name: 異相平衡與氣體分壓計算
  desc: 忽略純固體與純液體濃度項，僅以氣相分壓計算異相可逆反應的平衡分壓與分解百分率。
- code: T06
  name: 平衡常數大小與平衡位置趨勢
  desc: 依據平衡常數 K 值大小，判斷反應達平衡時趨向生成物或反應物的程度，並釐清與速率無關。
- code: T07
  name: 比色法測FeSCN2+平衡常數
  desc: 利用比爾定律液柱高度比與序列稀釋濃度，計算鐵離子與硫氰酸根錯合反應的平衡常數。
- code: T08
  name: 相同平衡狀態與等效平衡
  desc: 將起始反應物與生成物依計量係數換算至同側，判別不同初始條件是否達相同平衡狀態。
- code: T09
  name: 極大K值之反向近似計算
  desc: 針對平衡常數極大的反應先假設完全反應，再以逆向微量解離近似求算限量物種平衡濃度。
- code: T10
  name: 氣相分壓與總壓推算Kp
  desc: 利用密閉容器內氣體起始與平衡總壓變化及分解百分率，推算各氣體分壓與平衡常數 Kp。
- code: T11
  name: 濃度圖與擾動後新平衡計算
  desc: 由濃度對時間變化圖讀取平衡數據求 Kc，或計算加入物種與改變體積後的新平衡狀態。
