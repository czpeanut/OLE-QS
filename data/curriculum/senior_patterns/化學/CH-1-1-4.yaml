unit:
  subject: 化學
  code: CH-1-1-4
  title: 原子結構與元素週期表
status: draft
types:
- code: T01
  name: 原子結構發現史與實驗
  desc: 辨識陰極射線、α粒子散射及質子與中子發現實驗的設計目的、現象與科學結論。
- code: T02
  name: 次原子粒子數與荷質比
  desc: 依據原子序、質量數與離子電荷計算質子、中子與電子數，或比較不同粒子的荷質比大小。
- code: T03
  name: 核反應與放射性衰變平衡
  desc: 依據質量數守恆與電荷(原子序)守恆，推求核反應或α、β衰變後的新原子核與粒子數。
- code: T04
  name: 電子層排列與元素推斷
  desc: 依據殼層電子排列、價電子數或等電子離子條件，判別原子序、族別與化學性質相似度。
- code: T05
  name: 週期表編排與性質趨勢
  desc: 依質子數排列與同週期、同族位置比較原子與離子半徑、金屬與非金屬性及氧化物酸鹼性。
- code: T06
  name: 基本粒子發現與實驗
  desc: 判別陰極射線、油滴實驗、α粒子散射等科學史實驗結論及電子、質子、中子的發現順序。
- code: T07
  name: 核符號與次原子粒子數
  desc: 由原子序、質量數或電荷數計算原子與離子的質子數、中子數與核外電子數。
- code: T08
  name: 殼層電子排列與價電子
  desc: 依據K、L、M、N電子殼層填充規則推算原子序、價電子數，或由價電子與總電子數反推化學式。
- code: T09
  name: 同位素與同素異形體
  desc: 區分質子數相同但中子數不同的同位素，與同種元素構成不同結構單質的同素異形體。
- code: T10
  name: 週期表分區與族數判別
  desc: 依據電子排列或IUPAC 1～18族編號規則，判斷元素所屬週期、族別與金屬／類金屬／非金屬分類。
- code: T11
  name: 週期表局部位置推論
  desc: 根據週期表局部方格的原子序總和或內外層電子數比例，推斷未知元素及其化合物性質。
- code: T12
  name: 必修階段元素週期性
  desc: 比較同週期或同族元素的原子半徑、金屬性、導電性及氧化物酸鹼性等遞變趨勢。
- code: T13
  name: 質子、中子與電子數計數
  desc: 由原子序、質量數與離子電荷，計算原子或離子的質子數、中子數與核外電子數。
- code: T14
  name: 原子結構發現史與荷質比比較
  desc: 利用密立坎油滴電量最大公因數求電子數，或比較質子、電子與離子的荷質比大小。
- code: T15
  name: 原子與原子核尺度及密度推算
  desc: 比較原子與原子核半徑尺度差異，並由體積立方關係推算原子核的密度數量級。
- code: T16
  name: 殼層電子排列與能階躍遷
  desc: 依 K、L、M、N 殼層填電子規則判斷各層電子數，並辨識電子躍遷與不連續線光譜特性。
- code: T17
  name: 週期表發展、分類與週期性
  desc: 依門得列夫與現行週期表規則，從原子結構表或週期表位置比較族別、金屬性與半徑。
