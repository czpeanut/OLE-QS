unit:
  subject: 化學
  code: CH-S4-2-3
  title: 常見的電池
status: draft
types:
- code: T01
  name: 乾電池與鹼性電池構造及反應
  desc: 辨識碳鋅乾電池或鹼性電池的陰陽極材料、氧化劑、還原劑與電解質，並寫出各極半反應式。
- code: T02
  name: 鉛蓄電池充放電反應與重量變化
  desc: 分析鉛蓄電池放電時的陰陽極反應、兩極重量增減趨勢，以及硫酸電解液濃度、密度與電壓變化。
- code: T03
  name: 氫氧燃料電池構造、流向與效率
  desc: 判別酸性或鹼性氫氧燃料電池的兩極反應物、電子流方向、全反應式及能量轉換效率特點。
- code: T04
  name: 鋰離子電池與二次電池充放電原理
  desc: 比較一次電池與二次電池的差異，並判斷鋰離子電池充電與放電時的電極極性與離子遷移方向。
- code: T05
  name: 商業電池電量與反應物消耗計算
  desc: 結合電池放電反應的電子轉移數與法拉第定律，計算電池放電前後電極質量改變與產出電量。
- code: T06
  name: 燃料電池催化電極與電量計算
  desc: 計算甲醇等燃料電池的電子轉移法拉第電量，並判別質子交換膜與鉑鈀催化電極之特性。
- code: T07
  name: 各類電池放電電極質量變化比較
  desc: 寫出乾電池、鉛蓄電池、鋰電池與燃料電池的半反應產物，比較放電前後陰陽極固體質量的增減。
