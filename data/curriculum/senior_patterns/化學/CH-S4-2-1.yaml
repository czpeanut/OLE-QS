unit:
  subject: 化學
  code: CH-S4-2-1
  title: 電池反應
status: draft
types:
- code: T01
  name: 電池放電電極總質量變化計算
  desc: 由放電通過的電子莫耳數與陰陽極半反應係數，計算兩電極各自增減質量及總重量變化。
- code: T02
  name: 燃料電池電極反應與產物計量
  desc: 分析甲醇或氫氧燃料電池的陽極氧化與陰極還原半反應，並依限量試劑計算釋放電子與產物量。
- code: T03
  name: 電池裝置構造、極性與電子流向
  desc: 判別電化電池的陰極陽極與正負極定義、外電路電子流向、鹽橋離子移動方向及電池簡式寫法。
- code: T04
  name: 濃度改變與沉澱對電池電壓影響
  desc: 運用勒沙特列原理分析半電池中加入純水或沉澱劑改變離子濃度後，平衡移動對電池電壓的影響。
- code: T05
  name: 電池陰陽極電子與離子流向
  desc: 判斷電池正負極與陰陽極反應，並追蹤外電路電子／電流方向及鹽橋內陰陽離子的游動方向。
- code: T06
  name: 電極增減反推活性與電解液
  desc: 依據電池放電時兩極板變粗或變細的質量變化，反推金屬還原力順序與對應電解液組合。
- code: T07
  name: 新型電池與無鹽橋反應比較
  desc: 分析檸檬電池或染料敏化太陽能電池的電極反應，並比較單杯與雙杯裝置的能量轉換。
- code: T08
  name: 還原電位差與電極替換電壓
  desc: 利用標準還原電位計算電池電動勢，並判斷更換惰性或不同金屬電極對電池電壓的影響。
