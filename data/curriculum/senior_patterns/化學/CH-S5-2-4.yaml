unit:
  subject: 化學
  code: CH-S5-2-4
  title: 羧酸和酯
status: draft
types:
- code: T01
  name: 羧酸酸性、碳酸鹽反應與萃取分離
  desc: 利用羧酸能與碳酸鈉或碳酸氫鈉反應產生二氧化碳及溶於鹼性水溶液的性質，進行物質鑑別與酸鹼萃取分離。
- code: T02
  name: 酯化反應機制、同位素追蹤與條件
  desc: 掌握羧酸與醇在酸催化下脫水生成酯的原理，並利用氧-18同位素追蹤判斷酯鍵中氧原子的來源。
- code: T03
  name: 酯類酸鹼水解、皂化與油脂性質
  desc: 判斷酯類在酸性或鹼性條件下的水解產物，並區分油脂組成、皂化反應與順反脂肪酸的氫化及熔點差異。
- code: T04
  name: 阿司匹靈製備實驗操作與產率計算
  desc: 分析柳酸與乙酐製備阿司匹靈的無水條件、碳酸氫鈉純化步驟、氯化鐵檢驗與限量試劑產率計算。
- code: T05
  name: 羧酸與酯命名及異構物計數
  desc: 依據IUPAC規則命名羧酸與酯類，或依分子式與水解產物性質推求酯類同分異構物數目。
- code: T06
  name: 酯化反應與阿司匹靈製備
  desc: 掌握羧酸或酸酐與醇或酚進行酯化反應的催化劑、溫度控制、純化結晶與雜質檢驗。
- code: T07
  name: 酯類水解與酸鹼滴定計算
  desc: 利用酯類在強鹼中水解並中和羧酸的計量關係，反推酯類莫耳數、分子量或羧酸分子式。
- code: T08
  name: 羧酸酸性比較與含羧基計量
  desc: 比較羧酸、酚、碳酸與醇的酸性及pKa大小，並計算羧基與活潑金屬反應之氣體莫耳數。
- code: T09
  name: 含官能基有機物萃取分離
  desc: 利用羧酸、酚、酯與胺在酸鹼水溶液中的溶解度差異，設計或判讀分液漏斗萃取分離步驟。
- code: T10
  name: 羧酸製備與甲酸特殊氧化反應
  desc: 由一級醇、醛或芳香烴側鏈氧化及酸酐醯氯水解製備羧酸，並判別甲酸的還原性反應。
- code: T11
  name: 酯化反應、油脂組成與皂化反應
  desc: 判別羧酸與醇的酯化脫水機制、油脂的飽和度與結構，以及油脂在鹼性下皂化水解產物。
- code: T12
  name: 酯類水解產物反推原酸與醇結構
  desc: 依據酯類酸鹼水解後的酸與醇分子式及後續氧化產物線索，反推原酯類與單體結構。
- code: T13
  name: 阿司匹靈製備實驗與多步合成流程
  desc: 判別柳酸與乙酐製備阿司匹靈的操作條件與檢驗，或串聯醇、酸、酯的多步驟有機合成。
- code: T14
  name: 羧酸與酯的命名、構造及物理性質
  desc: 進行羧酸與酯類的系統命名，並比較羧酸雙聚體氫鍵與酯類的沸點、水溶性及香氣特徵。
- code: T15
  name: 羧酸與酯類系統命名及酸性比較
  desc: 完成羧酸與酯類的IUPAC命名，並比較甲酸、乙酸、取代羧酸與酚類的酸性強弱順序。
