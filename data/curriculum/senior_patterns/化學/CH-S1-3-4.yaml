unit:
  subject: 化學
  code: CH-S1-3-4
  title: 溶液的滲透壓
status: draft
types:
- code: T01
  name: 滲透壓公式計算溶質質量
  desc: 利用π=iMRT（或CMRT）在給定滲透壓與體積、溫度下，計算配製等張溶液所需溶質質量。
- code: T02
  name: 紅血球等張高張低張溶液判別
  desc: 根據紅血球在不同濃度溶液中呈現膨脹破裂或萎縮皺摺的外形，判斷外界溶液濃度高低。
- code: T03
  name: 滲透壓公式求算大分子分子量
  desc: 應用滲透壓公式π=CMRT由溶液濃度、溫度與滲透壓值計算蛋白質或高分子化合物的分子量。
- code: T04
  name: 半透膜U形管平衡液面高低比較
  desc: 比較半透膜兩側或連通多室不同電解質溶液的總粒子莫耳濃度，判斷滲透達平衡後的液面高低順序。
- code: T05
  name: 等張溶液配製與體積混合計算
  desc: 計算使半透膜兩側達到等滲透壓或等液面高度所需的溶液體積、濃度或注射用生理食鹽水濃度。
- code: T06
  name: 滲透與逆滲透裝置原理與流向
  desc: 判讀滲透與外加壓力進行逆滲透的裝置示意圖，分析水分子通過半透膜的淨移動方向與兩側濃度變化。
- code: T07
  name: 細胞張力與滲透壓生活應用
  desc: 判斷高張、等張與低張溶液對紅血球或生物細胞形態的影響，並理解滲透壓的定義與量測優勢。
- code: T08
  name: 生理等張溶液配製與紅血球滲透
  desc: 根據血液滲透壓判斷靜脈注射點滴所需葡萄糖或食鹽濃度，及紅血球在不同張力溶液中變化。
- code: T09
  name: U形管半透膜滲透與液柱高度差
  desc: 將滲透壓轉換為水柱或溶液柱高度差，計算半透膜兩側液面維持平衡所需加入的溶液體積。
- code: T10
  name: 多室半透膜滲透平衡與液面比較
  desc: 分析多個含不同有效粒子數溶液之容器經半透膜相通後，水分子移動方向及平衡液面高低順序。
- code: T11
  name: 滲透壓原理與生活生物現象應用
  desc: 依據水分子由低滲透壓往高滲透壓淨移動的原理，解釋生物細胞膨脹皺縮及食品加工等現象。
- code: T12
  name: 半透膜兩側溶液濃度與液面升降
  desc: 計算半透膜兩側電解質與非電解質的有效體積莫耳濃度，判斷達滲透平衡時兩側液面的升降方向。
- code: T13
  name: 等張溶液配製與混合濃度計算
  desc: 依據血液或細胞的正常滲透壓與凡特荷夫因子，計算等張點滴注射液中單一或混合溶質的適當濃度。
- code: T14
  name: 滲透壓法測定高分子聚合物分子量
  desc: 由U形管兩側液面高度差換算滲透壓，並套用滲透壓公式求算高分子聚合物的巨大分子量。
