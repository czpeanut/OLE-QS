unit:
  subject: 化學
  code: CH-S2-3-3
  title: 影響反應速率的因素
status: draft
types:
- code: T01
  name: 物質本性對反應速率影響
  desc: 比較不同元素（如鹼金屬與水）或化合物因化學本性差異所導致的反應速率快慢與曲線圖。
- code: T02
  name: 催化劑作用與能量曲線
  desc: 判別催化劑藉由改變反應途徑以降低正逆反應活化能、加快速率，但不改變反應熱與平衡。
- code: T03
  name: 溫度與速率分布曲線判讀
  desc: 由不同溫度下氣體分子的速率或動能分布曲線，比較溫度高低與高於低限能之分子數比例。
- code: T04
  name: 反應物本質與反應類型快慢
  desc: 比較室溫下離子沉澱、酸鹼中和、氧化還原及有機分子共價鍵重排反應的相對速率快慢。
- code: T05
  name: 速率常數k的決定因素判別
  desc: 區分影響反應速率常數k的因素（溫度、反應物本質、催化劑）與僅影響r的濃度/分壓因素。
- code: T06
  name: 溫度影響動能分布與速率機制
  desc: 分析溫度升高改變分子動能分布曲線（提高高於低限能粒子比例）為速率增加主因的原理。
- code: T07
  name: 催化劑作用機制與途徑改變
  desc: 判別催化劑參與反應、改變活化複合體、降低活化能及不改變平衡常數但可能改變產物的特性。
- code: T08
  name: 反應物本質對反應速率快慢比較
  desc: 比較水溶液離子沉澱中和反應、氣體分子反應與固體燃燒反應因反應物本質與鍵結差異造成的速率快慢。
- code: T09
  name: 濃度與接觸面積對反應速率影響
  desc: 解釋改變反應物濃度、壓力或將固體研磨成粉末、分散放入以增加接觸面積對反應速率的影響。
- code: T10
  name: 溫度變化與反應速率倍增計算
  desc: 依據溫度每升高固定度數反應速率倍增的經驗關係，計算改變溫度後的反應速率或完成反應所需時間。
- code: T11
  name: 勻相催化與異相催化實例判別
  desc: 依據催化劑與反應物是否處於相同相態，區分勻相催化反應（如酵素、水溶液離子）與異相催化反應。
- code: T12
  name: 濃度、表面積與溫度對速率影響
  desc: 判斷研磨固體增加接觸面積、提高反應物濃度、加壓氣體或升高溫度對反應速率的增減效應。
- code: T13
  name: 反應機構中催化劑與中間產物辨識
  desc: 檢視多步驟反應途徑中「先消耗後生成」的物種為催化劑，「先生成後消耗」者為中間產物。
- code: T14
  name: 酵素催化特性與生活應用
  desc: 根據酵素作為生物催化劑受溫度與酸鹼度影響之特性，解釋高溫殺菁或低溫保存食材的原理。
