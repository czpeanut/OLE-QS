unit:
  subject: 化學
  code: CH-S1-2-2
  title: 氣體的定律
status: draft
types:
- code: T01
  name: 波以耳定律與等溫壓縮膨脹
  desc: 在定溫定量條件下，利用P1V1=P2V2求解氣體壓力與體積變化或氣球充氣數量。
- code: T02
  name: 玻璃管與J形管水銀柱移動
  desc: 結合水銀柱高度差與截面積，列波以耳定律方程式求解傾倒、水平或加減水銀後的氣柱長。
- code: T03
  name: 查理定律與絕對零度外推
  desc: 利用定壓下氣體體積與攝氏溫度的線性關係，推算體積變化量、膨脹百分率或絕對零度。
- code: T04
  name: 亞佛加厥定律與原子分子比
  desc: 在同溫同壓下，利用氣體體積比等於莫耳數比，推算不同分子的原子數或分子數比例。
- code: T05
  name: 理想氣體圖形與定律配對
  desc: 辨識P-V、V-T、P-1/V、PV-P等理想氣體關係圖，或將生活現象配對至適用氣體定律。
- code: T06
  name: 隔膜破裂前後水銀液面升降
  desc: 根據隔膜破裂前後兩室壓力改變趨勢，判斷連接U形管各端水銀液面的升降方向。
- code: T07
  name: 波以耳定律PV定值計算
  desc: 在定溫定量條件下，利用壓力與體積成反比關係（PV定值）計算氣體膨脹或壓縮後的狀態。
- code: T08
  name: 查理定律與絕對零度推算
  desc: 在定壓定量條件下，利用體積與絕對溫度成正比關係求算氣體體積變化，或由V-t數據外插推算絕對零度。
- code: T09
  name: 氣體狀態圖形與定律判別
  desc: 判讀P-V、V-T或P-T圖形上各狀態點的溫度、壓力與體積變化，並對應適用的氣體定律。
- code: T10
  name: 液柱高度差與氣體壓力換算
  desc: 結合大氣壓力與U形管、J形管水銀柱高度差，計算密閉端氣體壓力與體積變化或所需加減汞量。
- code: T11
  name: 活塞或氣柱受熱膨脹平衡
  desc: 分析可移動活塞分隔的兩室氣體或水銀封閉空氣柱在溫度改變後的壓力平衡與體積移動量。
- code: T12
  name: 氣體定律概念與生活現象配對
  desc: 將生活中的氣體體積、壓力、溫度或莫耳數變化現象，對應至波以耳、查理或亞佛加厥定律。
- code: T13
  name: 波以耳定律數據與函數圖判讀
  desc: 利用 P1V1=P2V2 關係推算未知大氣壓力，並判別 P-V 或 h 與 1/V 之直線斜率與截距意義。
- code: T14
  name: 封閉細管與U型管汞柱平衡計算
  desc: 分析玻璃管水平、倒置或U型管添加水銀前後的氣體壓力變化，以波以耳定律求氣柱長或水銀量。
- code: T15
  name: 亞佛加厥定律與原子數換算
  desc: 在同溫同壓下由氣體體積比等於分子莫耳數比，進一步乘上分子內原子數進行體積換算。
- code: T16
  name: 氣體定律圖形與變因判讀
  desc: 解析壓力、體積與溫度關係曲線中的等溫線、等壓線與等容線，比較不同狀態下的物理量大小。
- code: T17
  name: 氣體反應體積定律與分子式推求
  desc: 利用同溫同壓下氣體體積比等於分子數比及反應係數比的關係，推求氣態反應物或生成物化學式。
