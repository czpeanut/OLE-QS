unit:
  subject: 化學
  code: CH-S2-1-3
  title: 原子軌域
status: draft
types:
- code: T01
  name: 軌域形狀對稱與空間方位
  desc: 辨識 s 球形、p 啞鈴形與 d 軌域的空間分布、節面數與正交軸向。
- code: T02
  name: 量子數物理意義與合法性
  desc: 依據n、l、ml、ms的取值規則判別量子數組合是否合法，並對應軌域形狀、方向與大小。
- code: T03
  name: 殼層、副殼層與軌域計數
  desc: 計算指定主殼層或副殼層所包含的軌域總數、副殼層種類與最大容納電子數。
- code: T04
  name: 軌域形狀與節面空間分布
  desc: 判別s、p、d軌域的幾何形狀、對稱性與電子出現機率為零的節面位置。
- code: T05
  name: 單電子與多電子能階比較
  desc: 比較氫原子（僅依n）與多電子原子（依n+l規則）中各軌域能階的高低關係。
- code: T06
  name: 多電子原子能階躍遷譜線
  desc: 依據多電子原子能階高低順序與降階可能性，判斷躍遷能否發生及產生譜線數。
- code: T07
  name: 四個量子數合法組合判別
  desc: 檢驗(n, l, ml, ms)是否滿足主、角動量、磁與自旋量子數的數學限制條件，找出不存在的組合。
- code: T08
  name: 主殼層軌域種類與數目計算
  desc: 依據主量子數n推算該殼層所含的s、p、d、f副殼層數目、總軌域數與最大容納電子數。
- code: T09
  name: 軌域形狀節面與出現機率
  desc: 判別s軌域的球形對稱與p軌域的啞鈴形方向性，判斷節面（如px軌域在yz平面）電子機率。
- code: T10
  name: 四個量子數物理意義與容許組合
  desc: 依據n、l、ml、ms的取值限制條件，判斷給定四個量子數組合是否合理存在及其代表的意義。
- code: T11
  name: 軌域符號意義與最大電子容量
  desc: 判別如3p、4f等軌域符號所代表的主殼層與副殼層意義，並判斷軌域是否存在與各副殼層最大電子數。
- code: T12
  name: 軌域形狀方向性與電子出現機率
  desc: 判別s、p、d軌域的幾何形狀、空間方向性、節面概念及電子雲在坐標軸或特定距離出現機率的意義。
- code: T13
  name: 氫與多電子原子軌域能階高低
  desc: 區分單電子系統（僅決定於n）與多電子系統（依n+l規則）的軌域能量高低順序，並判斷躍遷吸放熱。
- code: T14
  name: 主殼層副殼層軌域數目關係
  desc: 計算主量子數n所含的副殼層種類、總軌域數（n^2）與最大電子容納數（2n^2）。
- code: T15
  name: 由最後填入電子量子數推論元素
  desc: 根據某元素原子最後填入電子的四個量子數，配合填入順序規則反推該元素的電子組態、符號與原子序。
- code: T16
  name: 四個量子數合理組合判別
  desc: 依據主量子數、角量子數、磁量子數與自旋量子數的整數範圍限制，判別電子量子數組合是否合理。
- code: T17
  name: 原子軌域形狀方向性與電子容量
  desc: 判別s、p、d等軌域的幾何形狀、方向性有無、各主殼層存在的軌域種類及最大容納電子數。
- code: T18
  name: 單電子與多電子原子能階比較
  desc: 區分氫原子能階僅決定於主量子數，與多電子原子依n+l規則決定軌域能階高低的差異。
- code: T19
  name: 異世界量子數新規則週期推導
  desc: 依據題目自訂的四個量子數限制條件，逐層推導該殼層存在的軌域數目與對應元素總數。
