unit:
  subject: 化學
  code: CH-S2-2-3
  title: 分子間的作用力
status: draft
types:
- code: T01
  name: 分子間作用力種類判別
  desc: 依據分子極性與是否含H-F、H-O、H-N鍵結，判斷物質主要分子間作用力（氫鍵、偶極力或分散力）。
- code: T02
  name: 物質沸點與熔點高低比較
  desc: 綜合比較分子量、分子極性、接觸面積（支鏈多寡）與分子間氫鍵數目，判斷沸點與熔點順序。
- code: T03
  name: 分子結構與對水溶解度
  desc: 依據相似相溶原則及分子與水形成氫鍵的能力，判斷有機或無機分子對水的溶解度。
- code: T04
  name: 順反異構物與分子內氫鍵
  desc: 比較幾何異構物（如順反丁烯二酸）的偶極矩、分子內或分子間氫鍵，進而解釋熔點與溶解度差異。
- code: T05
  name: 氫鍵形成條件與結構判別
  desc: 檢驗分子是否具有F、O、N接H的氫鍵予體與具孤對電子的受體，辨識圖示中的氫鍵。
- code: T06
  name: 分子內氫鍵與分子間氫鍵區分
  desc: 由有機分子或官能基空間結構判斷是否形成分子內氫鍵，以及比較鄰對位異構物沸點差異。
- code: T07
  name: 綜合晶體與分子間力比較沸點
  desc: 依網狀固體>離子晶體>金屬>分子晶體（氫鍵>偶極力>分散力、支鏈影響）排列物質熔沸點。
- code: T08
  name: 鹵化氫與氫化物沸點異常比較
  desc: 解釋HF、H2O、NH3因分子間氫鍵導致沸點遠高於同族其他氫化物的沸點高低排序規律。
- code: T09
  name: 分子間作用力種類辨識
  desc: 依分子極性與是否含 H-F、H-O、H-N 鍵結，判斷兩分子間存在分散力、偶極力或氫鍵。
- code: T10
  name: 氫鍵與凡得瓦力對沸點影響比較
  desc: 綜合比較分子間氫鍵數目、分子量、極性及異構物接觸面積（正異新戊烷）對沸點高低之影響。
