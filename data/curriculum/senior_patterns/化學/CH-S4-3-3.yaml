unit:
  subject: 化學
  code: CH-S4-3-3
  title: 過渡金屬及其化合物
status: draft
types:
- code: T01
  name: 第一列過渡元素通性與化合物顏色
  desc: 判別第一列過渡元素的電子組態特徵、金屬導體性質、與非氧化性酸反應及大多具顏色的通性。
- code: T02
  name: 鐵的冶煉反應與生鐵熟鐵鋼鐵比較
  desc: 解析鼓風爐煉鐵中煤焦的還原劑角色、灰石除雜質熔渣反應，以及生鐵與不鏽鋼的組成差異。
- code: T03
  name: 鐵與亞鐵離子的檢驗與顏色變化
  desc: 追蹤亞鐵與鐵離子遇氫氧化鈉、雙氧水、硫氰化鉀及黃血鹽等試劑產生的沉澱與溶液顏色反應。
- code: T04
  name: 鐵的鏽蝕機制與陰陽極防鏽保護法
  desc: 判別鐵鏽成分、不同金屬接觸對鐵生鏽速率的影響，以及利用活性較大金屬保護鐵的陰極保護法。
- code: T05
  name: 錯合物組成、配位數與生物應用
  desc: 計算錯合物中心金屬氧化數、判斷雙牙與多牙配位基及配位數，並辨識血紅素與葉綠素的中心金屬。
- code: T06
  name: 配位基形成條件與除鏽錯合
  desc: 檢驗配位基是否具備孤電子對以形成配位共價鍵，並解析草酸與鐵鏽形成可溶性雙牙螯合物的機制。
- code: T07
  name: 生物錯合物與王水溶金反應
  desc: 辨識血紅素與葉綠素的中心金屬及氧合前後配位數變化，並分析王水氧化金形成錯離子的反應機制。
- code: T08
  name: 錯鹽內外界解離與依數性質
  desc: 區分錯合物配位界內外離子，計算水溶液凡特荷夫因子i值、沸點上升及與硝酸銀生成的沉澱莫耳數。
