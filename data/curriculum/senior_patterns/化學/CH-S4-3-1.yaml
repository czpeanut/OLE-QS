unit:
  subject: 化學
  code: CH-S4-3-1
  title: 非金屬元素的性質與製備
status: draft
types:
- code: T01
  name: 氫的製備反應與氧化還原性質
  desc: 判斷各種金屬或氫化物加水、水煤氣反應及電解等能否產生氫氣，並區分氫的氧化數與還原力。
- code: T02
  name: 氧、臭氧及鹵素製備與特性比較
  desc: 比較液態空氣分餾順序、臭氧與氧氣的氧化力與毒性，以及鹵素單質與氫鹵酸的製備及檢驗反應。
- code: T03
  name: 氮及其化合物的製備與酸鹼氧化性
  desc: 判別實驗室製氮反應、氮化物水解產物、硝酸與銅的反應產物，以及濃硝酸見光分解的保存方式。
- code: T04
  name: 碳的同素異形體結構與鍵結比較
  desc: 比較金剛石、石墨與石墨烯的碳原子混成軌域、鍵角鍵長、網狀結構、導電性與透光性差異。
- code: T05
  name: 矽、二氧化矽與玻璃腐蝕反應計量
  desc: 比較矽與碳化物的晶體結構、半導體導電性，並利用二氧化矽與氫氟酸反應計算石英礦純度百分比。
