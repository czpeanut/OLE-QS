unit:
  subject: 化學
  code: CH-S3-3-4
  title: 弱酸與弱鹼的解離
status: draft
types:
- code: T01
  name: 稀釋或添加物對弱酸α與pH影響
  desc: 判斷弱酸溶液經加水稀釋、加熱或加入同離子後，其解離百分率 α 與溶液 pH 值的增減方向。
- code: T02
  name: 強酸與弱酸同pH時之性質比較
  desc: 比較 pH 相同的強酸與弱酸溶液之初濃度大小、解離後陰離子濃度及中和所需強鹼體積比例。
- code: T03
  name: 弱酸弱鹼Ka、Kb與pH計算
  desc: 利用弱酸弱鹼平衡式與近似公式，由初始濃度與解離常數計算氫離子濃度、pH、pOH與質量守恆關係。
- code: T04
  name: 弱電解質解離度與稀釋效應
  desc: 結合奧斯特瓦爾德稀釋定律與近似關係，計算弱酸或弱鹼加水稀釋後的解離百分率變化。
- code: T05
  name: 解離度與濃度關係曲線判讀
  desc: 依據不同酸的Ka大小與濃度對解離度的反比平方根關係，判讀雙曲線圖形中各酸的對應位置。
- code: T06
  name: 共軛酸鹼對的Ka與Kb換算比較
  desc: 利用共軛酸鹼對Ka與Kb乘積等於水的離子積之關係，由酸的Ka比較各共軛鹼的鹼性強度。
- code: T07
  name: 同濃度不同酸鹼溶液的pH值比較
  desc: 比較單質子與多質子弱酸的第一解離常數大小，或結合濃度條件排序各溶液的pH值高低。
- code: T08
  name: 多質子酸分步解離與電荷質量守恆
  desc: 處理二元或三元弱酸（及硫酸）的多段解離平衡，判斷各酸根離子濃度大小、二級陰離子濃度及質量與電荷守恆關係。
- code: T09
  name: 由解離百分率α反推pH與Ka
  desc: 依據已知弱酸或弱鹼的初始濃度與解離百分率，直接求算平衡氫離子或氫氧根離子濃度、pH值與解離常數。
- code: T10
  name: 混合弱酸平衡與外加酸調控比例
  desc: 聯立兩種弱酸共存於溶液中的解離平衡求算總氫離子濃度，或於固定pH下比較不同弱酸與共軛鹼的濃度比值。
