unit:
  subject: 化學
  code: CH-S3-3-5
  title: 鹽類
status: draft
types:
- code: T01
  name: 鹽類水解反應與酸鹼性定性判別
  desc: 依據鹽類陰陽離子的共軛強弱判斷是否發生水解，定性判別鹽類水溶液呈酸性、鹼性或中性。
- code: T02
  name: 弱酸強鹼鹽與弱鹼強酸鹽pH計算
  desc: 由共軛酸鹼對的Ka或Kb求算鹽類的水解常數Kh，進而計算鹽類水溶液的氫離子濃度、pH值與水解率。
- code: T03
  name: 由鹽類pH值反推共軛酸鹼強度
  desc: 根據等濃度不同鈉鹽或銨鹽的實測pH值，反推各離子的水解百分率、水解常數與共軛酸的Ka大小。
- code: T04
  name: 弱酸弱鹼鹽的水解與酸鹼比較
  desc: 比較弱酸弱鹼鹽中陽離子Ka與陰離子Kb的相對大小，判斷溶液酸鹼性及水溶液中各物種濃度排序。
- code: T05
  name: 酸、鹼與鹽類混合溶液pH值排序
  desc: 綜合比較同濃度下的弱酸、弱鹼、強酸鹼鹽與中性鹽水溶液，依解離與水解程度排序pH值。
- code: T06
  name: 酸式鹽的解離與水解酸鹼判別
  desc: 比較多元酸酸式鹽的Ka2與水解常數Kh大小，判別酸式鹽水溶液呈酸性或鹼性。
- code: T07
  name: 鹽類水解液各物種濃度排序
  desc: 分析弱酸陰離子或弱鹼陽離子少量水解後的離子濃度消長，結合電荷守恆排列各粒子濃度大小。
- code: T08
  name: 酸式鹽分類與解離水解量化比較
  desc: 區分正鹽、複鹽與含磷氧酸鹽結構，並比較酸式鹽的Ka1Ka2乘積與Kw大小以判定溶液酸鹼性。
- code: T09
  name: 不水解離子辨識與水解平衡移動
  desc: 辨別不發生水解的強酸陰離子與強鹼陽離子，並運用勒沙特列原理選擇抑制鹽類水解的試劑。
