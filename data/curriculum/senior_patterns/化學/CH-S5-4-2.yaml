unit:
  subject: 化學
  code: CH-S5-4-2
  title: 環境檢測
status: draft
types:
- code: T01
  name: 空氣品質指標AQI與懸浮微粒粒
  desc: 判別空氣品質指標的標準與PM2.5、PM10懸浮微粒的粒徑定義、來源及健康影響。
- code: T02
  name: 水質檢測指標BOD、COD與重
  desc: 區分生化需氧量、化學需氧量與溶氧量的意義，並判斷工業廢水與重金屬污染的檢測方法。
- code: T03
  name: 消毒劑性質比較與殺菌率數據判讀
  desc: 比較二氧化氯與傳統氯系消毒劑的氧化殺菌機制、副產物差異，並解讀濃度與時間對殺菌率的統計表。
- code: T04
  name: 綠色化學十二項原則與製程評估
  desc: 依據原子經濟、減廢、低毒性溶劑與節能等綠色化學核心原則，判別環保友善製程的正確做法。
- code: T05
  name: 環境荷爾蒙特性與極性萃取溶劑選
  desc: 依據環境荷爾蒙（如雙酚A）的高脂溶性與低極性特徵，選擇適當的萃取溶劑進行環境樣品檢測。
