unit:
  subject: 化學
  code: CH-1-1-3
  title: 原子量與莫耳數
status: draft
types:
- code: T01
  name: 原子量與莫耳質量定義
  desc: 依據碳-12標準與阿佛加厥數定義，判別原子量、分子量、amu與莫耳質量的意義。
- code: T02
  name: 同位素平均原子量計算
  desc: 由各同位素原子質量與自然界存量百分率計算平均原子量，或由平均原子量反推存量比。
- code: T03
  name: 多單位粒子質量大小比較
  desc: 將個數、莫耳數、克數及amu換算為統一質量單位後，比較不同物質的質量大小。
- code: T04
  name: 分子數與原子數計數換算
  desc: 結合莫耳數、STP氣體體積、質量與化學式原子數，比較或求算物質所含的分子數與原子數。
- code: T05
  name: 理想氣體密度與分子量
  desc: 利用同溫同壓下氣體體積比或標準狀況(STP)氣體密度，換算氣體分子量或質量與莫耳數比。
- code: T06
  name: 同位素與平均原子量
  desc: 依據元素平均原子量與各同位素質量數，求解同位素的自然界原子個數比或莫耳分率。
- code: T07
  name: 莫耳質量與粒子數換算
  desc: 利用亞佛加厥數與質量、莫耳數、分子數的關係，求取未知物質的分子量或粒子總數。
- code: T08
  name: amu與克之質量換算
  desc: 進行單一原子或分子的原子質量單位（amu）與克（g）之間的換算及觀念判別。
- code: T09
  name: 原子量基準與相對質量換算
  desc: 由碳-12基準或同數量原子質量比求未知元素原子量。
- code: T10
  name: 同位素組成與平均原子量
  desc: 依據同位素質量數、中子數與自然界含量計算平均原子量或存在機率。
- code: T11
  name: 莫耳數質量與粒子數換算
  desc: 將質量、體積莫耳濃度或分子個數換算為莫耳數與特定原子總數。
- code: T12
  name: 混合氣體原子分子數比求解
  desc: 利用混合氣體的原子總數與分子總數倍數關係求解各成分莫耳數比。
- code: T13
  name: 平均原子量與同位素比例計算
  desc: 依據元素各同位素的質量數與平均原子量，以加權平均法反推同位素自然界含量比例。
- code: T14
  name: 等原子數之氣體體積比推算
  desc: 先將氣體分子依原子數換算為分子數比，再於同溫同壓下轉換為氣體體積比。
- code: T15
  name: 混合氣體平均分子量計算
  desc: 依據各氣體成分的莫耳分率或體積百分率，以加權平均法求算混合氣體的平均分子量。
