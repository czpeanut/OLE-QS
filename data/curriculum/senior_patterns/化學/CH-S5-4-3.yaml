unit:
  subject: 化學
  code: CH-S5-4-3
  title: 能源與化學永續發展
status: draft
types:
- code: T01
  name: 再生能源種類與發電特性比較
  desc: 比較太陽能、風力、地熱、海洋能與生質能的發電原理、供電穩定性及目前應用限制。
- code: T02
  name: 氫能製備、燃料電池與儲能安全
  desc: 評估氫氣作為潔淨能源的能量轉換效率、太空應用、燃燒爆炸風險與相關化學電池特性。
- code: T03
  name: 化石燃料與生質能源轉化及碳排放
  desc: 區分煤、石油、天然氣與生質酒精、生質柴油的來源、熱值與對溫室效應的影響。
- code: T04
  name: 核能發電原理與核廢料永續議題
  desc: 判別核分裂與核融合的能量來源、反應式特徵及核能發電的安全與廢料處理考量。
- code: T05
  name: 節約能源與化學永續發展策略
  desc: 評估工業製程減碳、碳捕捉技術與再生能源整合對環境永續發展的綜合效益。
