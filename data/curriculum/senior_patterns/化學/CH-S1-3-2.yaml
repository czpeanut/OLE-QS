unit:
  subject: 化學
  code: CH-S1-3-2
  title: 溶液的蒸氣壓與拉午耳定律
status: draft
types:
- code: T01
  name: 非揮發性溶質蒸氣壓下降計算
  desc: 利用拉午耳定律P=X溶劑·P0或ΔP=X溶質·P0，由溶液蒸氣壓反推溶質莫耳數與分子量。
- code: T02
  name: 雙揮發性溶液總壓與氣相組成
  desc: 計算兩種揮發性液體混合後的總蒸氣壓，並利用分壓比求平衡蒸氣中各成分的莫耳分率。
- code: T03
  name: 多次凝結與再揮發分餾蒸氣壓
  desc: 將混合溶液的平衡蒸氣凝結為新液體後再達氣液平衡，遞推計算二次平衡後的蒸氣壓。
- code: T04
  name: 理想溶液與正負偏差判別
  desc: 依據混合前後體積加成性、ΔH吸放熱及蒸氣壓對拉午耳定律的正負偏差，判斷分子間引力變化。
- code: T05
  name: 蒸氣壓與莫耳分率關係圖判讀
  desc: 由兩液體混合的蒸氣壓曲線圖判斷純物質飽和蒸氣壓、沸點高低及正負偏差的混合熱效應。
- code: T06
  name: 蒸氣相莫耳分率與分餾組成
  desc: 由拉午耳定律求算理想溶液上方蒸氣相各成分的莫耳分率，並判斷多次蒸餾後氣相組成的富集趨勢。
- code: T07
  name: 非理想溶液正負偏差與混合熱
  desc: 判讀實際溶液蒸氣壓曲線對拉午耳定律的正偏差或負偏差，推論混合熱效應、體積變化與分子間引力。
- code: T08
  name: 密閉多燒杯等蒸氣壓溶劑轉移
  desc: 分析密閉容器中多杯不同濃度溶液經溶劑蒸發凝結達蒸氣壓相等平衡後的含水量、濃度或凝固點。
- code: T09
  name: 非揮發性溶質溶液蒸氣壓計算
  desc: 運用拉午耳定律 P=X_溶劑 P° 計算溶液蒸氣壓，注意含水結晶溶質須將結晶水計入溶劑莫耳數。
- code: T10
  name: 理想溶液蒸氣壓圖形與氣相組成
  desc: 由雙揮發性溶質的蒸氣壓對莫耳分率關係圖，求兩液體蒸氣壓相等點及氣相中莫耳分率。
- code: T11
  name: 非理想溶液之正負偏差判別
  desc: 根據溶液總蒸氣壓曲線偏離拉午耳定律直線的程度，推斷混合時分子間引力及吸放熱與體積變化。
- code: T12
  name: 密閉空間多杯溶液蒸氣壓平衡
  desc: 當多杯不同電解質或非電解質溶液置於同一密閉空間，依達平衡時蒸氣壓相等推算水轉移後水量。
- code: T13
  name: 理想溶液性質與偏差行為判別
  desc: 判別理想溶液的熱效應、體積加成性與拉午耳定律，並分析真實溶液呈現正負偏差的原因。
- code: T14
  name: 雙揮發性液體蒸氣壓與組成圖
  desc: 由兩揮發性液體的莫耳分率對蒸氣壓關係圖，計算特定組成下的溶液總蒸氣壓與氣相莫耳分率。
- code: T15
  name: 密閉容器多杯溶液等溫蒸氣平衡
  desc: 利用同溫密閉空間中各溶液最終蒸氣壓相等的原理，計算達平衡後各杯溶液的水分轉移與重量。
