unit:
  subject: 化學
  code: CH-S1-2-1
  title: 氣體的性質
status: draft
types:
- code: T01
  name: 氣體基本性質與分子運動特徵
  desc: 判別氣體無固定形狀、具擴散性、可任意比例均勻混合及撞擊器壁產生壓力等性質。
- code: T02
  name: 理想氣體與真實氣體偏離判別
  desc: 檢驗理想氣體假設條件（體積與分子間作用力），並判斷真實氣體接近理想氣體的溫壓。
- code: T03
  name: 馬克士威速率分布曲線判讀
  desc: 比較不同溫度或不同分子量氣體的分子速率分布曲線峰值位置與寬度，判斷溫度或分子量。
- code: T04
  name: 開口與閉口壓力計氣壓換算
  desc: 依據壓力計兩端水銀柱或水柱高度差及大氣壓力，透過水銀與水密度比換算氣體壓力。
- code: T05
  name: PV乘積因次與壓力單位轉換
  desc: 將atm、mmHg、torr與能量單位（焦耳、卡、牛頓·米）進行因次分析與單位互換。
- code: T06
  name: 密閉容器內物質狀態與壓力
  desc: 判斷常溫常壓下液態或氣態物質置入密閉容器後是否汽化，比較產生的壓力大小。
- code: T07
  name: 氣壓單位換算與大小比較
  desc: 熟練 atm、cmHg、mmHg、torr 與 hPa 等壓力單位間的換算，比較不同氣壓數值大小。
- code: T08
  name: 開口式壓力計水銀柱讀數計算
  desc: 根據開口端與氣體端水銀面高度差及外界大氣壓力，計算封閉容器內氣體壓力。
- code: T09
  name: 閉口式壓力計與壓力計轉換
  desc: 利用閉口真空端水銀柱高度差求氣壓，或將定壓氣體移入開口式壓力計判斷水銀柱變化。
- code: T10
  name: 氣體分子速率分布與溫度關係
  desc: 判讀馬克士威-波茲曼分子速率分布曲線，比較不同溫度下平均動能與曲線下面積特徵。
- code: T11
  name: 氣體壓力量測數據圖表應用
  desc: 從實測氣壓數據表提取數值進行單位換算，並分析氣壓與氣象或環境變因的關聯性。
- code: T12
  name: 氣體壓力的微觀成因與性質
  desc: 區分大氣重力與容器內氣體分子撞擊器壁形成壓力的成因差異及氣體基本物理性質。
- code: T13
  name: 氣壓單位換算與定義判別
  desc: 進行大氣壓、毫米汞柱、托爾、帕斯卡與水柱高等不同氣壓單位之間的換算與正誤判別。
- code: T14
  name: 托里切利氣壓計與高度變化
  desc: 依據水銀柱垂直高度與大氣壓力的平衡關係，判斷海拔改變或管徑傾斜對水銀柱高度的影響。
- code: T15
  name: 開口與閉口式水銀壓力計讀值
  desc: 利用連通管同水平面壓力相等的原理，由左右汞柱高度差換算密閉容器內的氣體壓力。
