unit:
  subject: 化學
  code: CH-S5-4-1
  title: 先進材料
status: draft
types:
- code: T01
  name: 半導體摻雜與導電特性
  desc: 區分導體、半導體與絕緣體隨溫度變化的導電度趨勢，以及摻雜3A/5A族形成p型或n型半導體。
- code: T02
  name: 液晶結構特性與LCD成像原理
  desc: 判別液晶分子長條極性結構與受電場改變排列的光學特性，並區分液晶與發光元件差異。
- code: T03
  name: 奈米材料尺度與表面積效應
  desc: 判別奈米材料的尺寸定義、比表面積劇增引起的物化性質變化與蓮花效應等實例。
- code: T04
  name: 光觸媒機制與先進功能材料
  desc: 解析奈米二氧化鈦光觸媒的照光催化除汙機制，以及液晶、導電高分子等先進材料特性。
- code: T05
  name: 奈米碳材結構與導電比較
  desc: 比較碳六十、奈米碳管與石墨烯的碳原子混成軌域、維度結構、機械強度與導電性質。
- code: T06
  name: 先進材料檢測與生活應用
  desc: 區分觀察奈米尺度材料所需顯微技術（電子顯微鏡）與各類先進材料在電子、生醫與環保上的應用。
- code: T07
  name: OLED與導電高分子發光機制
  desc: 掌握有機發光二極體（OLED）自發光不需背光模組的原理，以及共軛雙鍵導電高分子特性。
- code: T08
  name: 奈米材料尺度效應與光觸媒機制
  desc: 判別奈米尺度表面積效應、蓮花效應與二氧化鈦光觸媒產生電子電洞分解汙染物的機制。
- code: T09
  name: 半導體摻雜與超導體抗磁特性
  desc: 區分純矽半導體、N型與P型摻雜元素及電洞電子載子，以及超導體零電阻與麥斯納效應。
- code: T10
  name: 生醫與複合先進材料結構與應用
  desc: 辨識碳纖維、生醫高分子、形狀記憶合金或氣凝膠等先進材料的結構特徵與現代科技應用。
