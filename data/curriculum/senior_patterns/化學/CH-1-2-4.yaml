unit:
  subject: 化學
  code: CH-1-2-4
  title: 化學反應熱
status: draft
types:
- code: T01
  name: 反應熱基本性質與能量圖
  desc: 依據反應物與產物熱含量高低判讀吸熱與放熱能量圖，並判別反應熱與狀態、途徑的關係。
- code: T02
  name: 熱化學式比較物質熱含量
  desc: 由多條熱化學反應式的吸放熱數值推導各物質的相對熱含量(H)大小順序。
- code: T03
  name: 相態對反應熱大小的影響
  desc: 比較同一反應在不同反應物或產物相態下的放熱量差異，並連結物質汽化熱關係。
- code: T04
  name: 莫耳生成熱與燃燒熱判別
  desc: 依據標準莫耳生成熱與莫耳燃燒熱的定義，判別元素穩定態或已完全氧化物質的熱值是否為零。
- code: T05
  name: 反應熱量與莫耳數計量換算
  desc: 結合平衡熱化學反應式與反應物莫耳數或質量，計算實際吸收或放出的總熱量。
- code: T06
  name: 反應類型與能量規模
  desc: 比較相變化、化學反應與核反應三者所釋放或吸收的能量數量級大小。
- code: T07
  name: 焓與熱化學反應式性質
  desc: 判別焓的絕對值不可測、標準狀態定義，以及反應物與生成物聚集狀態對反應熱大小的影響。
- code: T08
  name: 反應熱與莫耳數換算
  desc: 依據熱化學反應式的係數與ΔH，計算特定質量或莫耳數物質反應所吸收或放出的熱量。
- code: T09
  name: 赫斯定律與熱含量比較
  desc: 利用兩條以上已知熱化學反應式加減合併，推求目標反應的ΔH與吸放熱性質。
- code: T10
  name: 莫耳溶解熱與應用計算
  desc: 依據化合物莫耳溶解熱與式量，計算單位質量溶質溶解時的吸放熱量與降溫效果。
- code: T11
  name: 熱化學方程式寫法與換算
  desc: 依據反應物用量與吸放熱狀態，寫出含物質狀態與熱量項的熱化學方程式。
- code: T12
  name: 狀態與係數改變對ΔH影響
  desc: 判斷反應物或產物相態改變、係數倍增或反應逆向進行時ΔH的正負與大小變化。
- code: T13
  name: 酸鹼中和熱與限量試劑放熱
  desc: 先由酸鹼莫耳數判斷中和生成水的莫耳數，再乘以莫耳中和熱求總放熱量。
- code: T14
  name: 多步驟能量關係與熱含量
  desc: 由一系列熱化學方程式推算各物質相對熱含量高低，並以赫斯定律求總反應熱。
