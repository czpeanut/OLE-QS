unit:
  subject: 化學
  code: CH-S3-2-2
  title: 物質的沉澱反應
status: draft
types:
- code: T01
  name: 水溶液離子共存而不沉澱判斷
  desc: 檢驗多組水溶液中的陰陽離子是否會互相結合生成難溶鹽、氣體或弱電解質，判斷能否大量共存。
- code: T02
  name: 沉澱顏色與氣體生成推論成分
  desc: 依據未知溶液兩兩混合後產生的特定沉澱顏色（如白色、黃色）或氣體現象，反推各溶液的化學成分。
- code: T03
  name: 多溶液交叉反應連線圖譜推論
  desc: 判讀多瓶未知溶液間發生沉澱或氣體反應的連線關係圖，配合已知顏色或氣體線索逐一鑑定各編號溶質。
- code: T04
  name: 混合離子溶液反應與顏色判別
  desc: 分析依序加入多種離子或試劑的水溶液，判斷是否發生沉澱、酸鹼反應或氧化還原變色。
- code: T05
  name: 酸類或試劑溶解混合氫氧化物沉澱
  desc: 根據酸根陰離子與金屬陽離子是否產生二次難溶鹽沉澱，選擇可完全溶解混合沉澱物的酸液。
- code: T06
  name: 離子共存與反應發生條件判斷
  desc: 檢查多組化合物或離子在水溶液中共存時，是否會發生沉澱、酸鹼或氣體逸出等反應。
- code: T07
  name: 沉澱顏色特徵與未知離子鑑定
  desc: 結合沉澱生成與否及特定沉澱的顏色特徵，推斷未知廢水或試液中所含有的金屬陽離子或陰離子。
