unit:
  subject: 化學
  code: CH-S1-1-1
  title: 物質的特性與鑑定
status: draft
types:
- code: T01
  name: 未知混鹽的水溶與沉澱檢驗
  desc: 根據固體加水溶解性、酸溶性質及濾液加試劑沉澱結果，反推未知粉末成分。
- code: T02
  name: 常見離子混合共存與反應判定
  desc: 檢驗各組溶液與氣體混合後是否發生沉澱、酸鹼或氧化還原反應，判斷能否共存。
- code: T03
  name: 單一試劑鑑別多瓶未知溶液
  desc: 利用一種試劑與多杯待測液產生不同顏色沉澱、氣體或無現象，達到一次鑑別目的。
- code: T04
  name: 陽離子逐步分離流程設計
  desc: 依照陰離子沉澱選擇性與酸鹼兩性特徵，規劃試劑加入順序以逐一分離混合離子。
- code: T05
  name: 離子分離流程圖表判讀與推論
  desc: 根據定性分析實驗流程圖中各步驟的沉澱物與濾液，鑑定對應的離子與化學式。
- code: T06
  name: 沉澱實驗操作與重金屬回收
  desc: 判斷沉澱實驗中的限量試劑現象，以及含重金屬離子廢液的正確分類回收規範。
- code: T07
  name: 物理與化學性質鑑別物質
  desc: 依據溶解度、沸點、導電性或可燃性等物理與化學性質差異，判斷區別兩組物質的適當鑑別方法。
- code: T08
  name: 常見鹽類水溶性規則判別
  desc: 依據常見陰陽離子的水溶性規則，比較不同鹽類對水的溶解度大小。
- code: T09
  name: 層析實驗與Rf值計算判讀
  desc: 依據待測物與固定相、展開液的吸附力差異，計算 Rf 值並判讀層析分離結果。
