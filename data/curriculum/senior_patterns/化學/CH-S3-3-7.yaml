unit:
  subject: 化學
  code: CH-S3-3-7
  title: 酸鹼滴定
status: draft
types:
- code: T01
  name: 滴定當量點體積與初濃度計算
  desc: 依據酸鹼當量數相等（n_H+ = n_OH-），比較不同價數酸達當量點所需鹼液體積或求待測液濃度。
- code: T02
  name: 滴定實驗玻璃儀器與操作誤差
  desc: 辨識滴定管、容量瓶與吸量管用途、KHP 標定、終點顏色，並分析潤洗、氣泡或放置對結果誤差。
- code: T03
  name: 滴定曲線判讀求弱酸鹼Ka或Kb
  desc: 從酸鹼滴定曲線讀取半當量點（pH=pKa）或初起點座標，推算弱酸或弱鹼的解離常數。
- code: T04
  name: 依滴定曲線與變色範圍選指示劑
  desc: 根據當量點附近 pH 突躍區間，對照指示劑變色範圍表選出最適合判定滴定終點的指示劑。
- code: T05
  name: 雙指示劑滴定與混合鹼含量分析
  desc: 運用酚酞與甲基橙兩階段變色點消耗的酸液體積關係，分析碳酸鈉與碳酸氫鈉混合鹼組成。
- code: T06
  name: 返滴定過量酸鹼求濃度或含量
  desc: 針對滴定過量或難溶碳酸鹽樣品，利用酸總當量數等於鹼總當量數之返滴定守恆式求算待測濃度、分子量或成分質量。
- code: T07
  name: 直接滴定未知酸鹼求分子量
  desc: 由稱重配製的未知酸鹼樣品或分取部分體積，結合滴定當量數關係反推該物質的分子量或推測可能酸鹼種類。
- code: T08
  name: 滴定過程各階段溶液pH計算
  desc: 根據酸鹼滴定進行至當量點前、當量點及過當量點時剩餘的氫離子或氫氧根離子莫耳數與總體積，計算各點溶液濃度與pH值。
