unit:
  subject: 化學
  code: CH-S5-2-2
  title: 醇、酚、醚
status: draft
types:
- code: T01
  name: 醇類級數分類、命名與物理性質
  desc: 區分一級、二級、三級醇並進行IUPAC命名，比較醇與醚的水溶性、沸點與氫鍵影響。
- code: T02
  name: 醇類與鈉反應、酯化與氧化反應
  desc: 判斷醇類與金屬鈉產生氫氣、與羧酸酯化，以及各級醇被過錳酸鉀或二鉻酸鉀氧化的產物。
- code: T03
  name: 酚的酸性、氯化鐵檢驗與取代反應
  desc: 掌握苯酚的弱酸性（溶於強鹼不溶於碳酸氫鈉）、遇氯化鐵呈紫色及與溴水或甲醇的反應。
- code: T04
  name: 醚類構造、異構物與萃取溶劑應用
  desc: 判別醚類的極性、難溶於水且密度小於水的性質，以及與醇類互為官能基異構物的計數與分離萃取應用。
- code: T05
  name: 醇類氧化反應與產物計量
  desc: 判斷一、二、三級醇經二鉻酸鉀或過錳酸鉀氧化之產物與實驗操作，並計算氧化劑莫耳數。
- code: T06
  name: 酚類酸性與氯化鐵顯色檢驗
  desc: 利用氯化鐵溶液呈紫色檢驗酚羥基，並比較酚與醇、羧酸的酸性強弱及中和反應。
- code: T07
  name: 多官能基結構與性質判讀
  desc: 判讀含羥基、酚基等複雜有機分子的分子式、混成軌域平面性、加成性與官能基鑑別。
- code: T08
  name: 醇酚醚分類、命名與異構物計數
  desc: 判別一二三級醇、酚與醚的結構分類與系統命名，並計算指定分子式的醇醚異構物數。
- code: T09
  name: 醇類製備與脫水、氧化及酯化反應
  desc: 預測不同級數醇與強氧化劑反應產物、濃硫酸不同溫度脫水產物及與金屬鈉反應特性。
- code: T10
  name: 苯酚酸性比較、製備與溴水檢驗
  desc: 比較酚與羧酸、碳酸的酸性強弱及溶解度，並判別氯苯製酚、氯化鐵顯色與溴水沉澱。
- code: T11
  name: 醚類製備（威廉森合成）與性質
  desc: 應用醇鈉與鹵烷反應或醇分子間脫水製備醚類，並比較醚與同分異構醇的沸點及反應性。
- code: T12
  name: 醇酚醚實驗鑑別與反應流程推論
  desc: 綜合運用金屬鈉、過錳酸鉀、二鉻酸鉀與氯化鐵等試劑現象，反推未知醇酚醚的分子結構。
- code: T13
  name: 醇類脫水製備烯類與醚類反應
  desc: 依據反應溫度與濃硫酸催化條件，區分醇類分子內脫水生成烯與分子間脫水生成醚的條件。
- code: T14
  name: 醇酚醚結構分類與系統命名
  desc: 辨識一、二、三級醇、酚類與醚類結構，進行系統命名或依分子式列舉異構物。
- code: T15
  name: 醇與醚的性質及與鈉反應
  desc: 比較醇、酚、醚的沸點與水溶性，並利用與金屬鈉反應生成氫氣區分醇類與醚類。
- code: T16
  name: 醇類脫水與氫鍵物性比較
  desc: 判斷醇類在不同溫度下脫水生成烯或醚的產物，及比較醇酚醚因氫鍵造成的物性差異。
