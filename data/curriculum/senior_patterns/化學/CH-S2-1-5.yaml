unit:
  subject: 化學
  code: CH-S2-1-5
  title: 元素性質的週期性
status: draft
types:
- code: T01
  name: 原子與離子半徑大小比較
  desc: 依據電子層數與有效核電荷，比較同週期、同族原子、等電子離子半徑及共價分子鍵長順序。
- code: T02
  name: 游離能趨勢與例外比較
  desc: 比較同週期、同族元素及等電子離子的第一或第n游離能大小。
- code: T03
  name: 連續游離能突躍推斷元素
  desc: 依據連續游離能數值或圖表的劇烈突躍位置，推斷元素的價電子數、族別、氧化物化學式與性質。
- code: T04
  name: 電負度、電子親和力與金屬性
  desc: 比較元素電負度與電子親和力大小趨勢，並連結非金屬性、氧化物酸鹼性及反應釋放能量。
- code: T05
  name: 週期表相對位置綜合推論
  desc: 結合週期表相對位置或原子序和，綜合比較多元素的半徑、游離能與電負度等週期性質。
- code: T06
  name: 等電子粒子半徑與游離能
  desc: 比較具有相同電子數之陰陽離子與惰性氣體的離子半徑與游離能大小。
- code: T07
  name: 週期表位置推斷綜合性質
  desc: 由週期表局部簡圖或原子序推知元素種類，並比較其原子半徑、電負度與游離能。
- code: T08
  name: 同週期或同族性質趨勢
  desc: 比較同族或同週期元素的原子半徑、電負度、金屬性及第一游離能的規則與例外趨勢。
- code: T09
  name: 連續游離能推求價電子數
  desc: 由元素的連續游離能數值突增位置，判斷價電子數、族別與氧化物化學式。
- code: T10
  name: 高階游離能與極值比較
  desc: 比較同週期或不同元素與離子的第二、第三游離能大小，或判斷離子移去電子的能量順序。
- code: T11
  name: 週期性趨勢折線圖判讀
  desc: 判讀原子序1～20元素的游離能、原子半徑或電負度隨原子序變化的趨勢圖表。
- code: T12
  name: 原子序與同族化學性質相似性
  desc: 將原子序換算為週期表族別與週期，判斷哪組元素屬於同族且具有相似的化學性質。
- code: T13
  name: 游離能鋸齒狀趨勢與微粒比較
  desc: 利用同週期IIA>IIIA、VA>VIA的半滿全滿特例，比較第一、第二游離能及等電子微粒游離能。
- code: T14
  name: 連續游離能數據突增判斷族別
  desc: 觀察元素第一至第四游離能數據的顯著躍升點，推斷價電子數與所屬族別。
- code: T15
  name: 電負度與週期性質趨勢圖判讀
  desc: 綜合比較同週期或不同族元素的電負度、電子親和力與游離能變化曲線關係圖。
- code: T16
  name: 由電子組態推論週期族別與性質
  desc: 根據元素的電子組態判斷其所在的週期、族別、價電子數、質子數、金屬性分類與化學反應性。
- code: T17
  name: 原子與等電子離子半徑大小比較
  desc: 比較同族、同週期原子或同元素不同價態離子，以及等電子數離子與原子間的半徑大小順序。
- code: T18
  name: 第一游離能週期趨勢與例外比較
  desc: 比較同族由上而下及同週期由左而右第一游離能變化趨勢，包含2A大於3A及5A大於6A的例外情形。
- code: T20
  name: 電負度定義趨勢與密立坎公式
  desc: 判斷電負度定義、週期表趨勢與鍵結極性關係，或利用密立坎電負度公式計算比較非金屬性大小。
- code: T23
  name: 高階連續游離能與高價態比較
  desc: 將比較第二或第三游離能轉化為比較已失電子的陽離子組態，判斷跨殼層失電子造成的能量躍升。
