unit:
  subject: 化學
  code: CH-1-3-2
  title: 水溶液的濃度
status: draft
types:
- code: T01
  name: 重量百分率與體積莫耳換算
  desc: 利用溶液密度（比重）與溶質莫耳質量，將重量百分率濃度換算為體積莫耳濃度。
- code: T02
  name: 百萬分點濃度ppm與M換算
  desc: 將ppm濃度（mg/L或mg/kg）依溶質分子量與溶液比重換算為重量百分率或M。
- code: T03
  name: 溶液配製步驟與定量瓶操作
  desc: 判別使用固體溶質或濃溶液稀釋配製標準體積莫耳濃度溶液的正確儀器與步驟。
- code: T04
  name: 濃溶液稀釋與混合濃度計算
  desc: 利用稀釋前後溶質莫耳數守恆，計算所需原濃溶液體積或混合後的最終濃度。
- code: T05
  name: 多種濃度表示法大小比較
  desc: 將莫耳分率、體積莫耳濃度與重量百分率統一換算為同一基準後比較大小。
- code: T06
  name: 重量莫耳與莫耳分率換算
  desc: 在體積莫耳濃度、重量莫耳濃度（m）、重量百分率與溶質莫耳分率之間進行換算與大小比較。
