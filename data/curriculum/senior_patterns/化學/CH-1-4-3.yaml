unit:
  subject: 化學
  code: CH-1-4-3
  title: 環境與化學
status: draft
types:
- code: T01
  name: 空氣汙染物來源與環境效應
  desc: 判別溫室效應、酸雨、臭氧層破洞及PM2.5等空氣汙染成因與指標定義。
- code: T02
  name: 硬水成因與軟化方法判別
  desc: 區分暫時硬水與永久硬水的離子成分，並判斷煮沸、加碳酸鈉或離子交換軟化效果。
- code: T03
  name: 自來水淨化流程與各步驟原理
  desc: 辨識沉降、明礬凝聚、活性碳吸附及加氯消毒等淨水步驟的作用與化學原理。
- code: T04
  name: 空氣汙染物來源與危害配對
  desc: 對應氮氧化物、硫氧化物、一氧化碳與氟氯碳化物造成的酸雨、光化學煙霧與臭氧層破洞。
- code: T05
  name: 水質淨化步驟與處理原理
  desc: 區分自來水處理中凝聚法、活性碳吸附、曝氣增氧、臭氧或加氯消毒與離子交換軟水原理。
- code: T06
  name: 水汙染、優養化與重金屬毒害
  desc: 辨識水質優養化、熱汙染珊瑚白化以及汞與鎘重金屬排放所引發公害疾病的對應關係。
- code: T07
  name: 能源發電方式與PM2.5評估
  desc: 比較火力、核能、水力、太陽能與風力發電產生細懸浮微粒及空氣汙染物的差異。
