unit:
  subject: 化學
  code: CH-1-2-2
  title: 化學式
status: draft
types:
- code: T01
  name: 化學式種類辨識與意義
  desc: 區分實驗式、分子式、示性式與結構式的定義、適用對象及官能基表示方式。
- code: T02
  name: 元素百分組成與未知原子量
  desc: 由化學式計算各元素質量百分率，或已知元素質量百分比與分子量反推未知元素原子量。
- code: T03
  name: 同實驗式物質性質比較
  desc: 比較具有相同實驗式的不同化合物，其元素百分組成、等重原子數與燃燒耗氧量。
- code: T04
  name: 結晶水合物加熱失水計算
  desc: 依據水合晶體加熱前後質量差求算結晶水莫耳數比，確定水合物化學式。
- code: T05
  name: 燃燒分析裝置與實驗式求解
  desc: 判別燃燒分析各試藥順序與功能，並由增重數據求實驗式與分子式。
- code: T06
  name: 化合物命名與化學式
  desc: 依據陰陽離子電價平衡與命名規則，寫出或檢驗常見無機化合物的正確化學式。
- code: T07
  name: 化學式種類與意義區分
  desc: 區分實驗式、分子式、示性式與結構式的定義、適用對象（如網狀固體與分子）及資訊差異。
- code: T08
  name: 質量百分組成與原子量
  desc: 由化學式計算各元素的質量百分組成，或由反應前後質量關係列式推導元素原子量。
- code: T09
  name: 燃燒分析實驗與操作
  desc: 判別燃燒分析裝置中氧化銅、乾燥劑與二氧化碳吸收劑的順序及功能，並釐清氧重求算原則。
- code: T10
  name: 由分析數據求實驗與分子
  desc: 利用燃燒分析產物質量或各元素百分組成計算實驗式，並結合分子量求得分子式。
- code: T11
  name: 化學式種類與模型判讀
  desc: 區分實驗式、分子式、結構式、示性式及球棍模型所能表達的資訊。
- code: T12
  name: 同分異構物與實驗式比較
  desc: 比較多種有機或無機化合物的分子式與結構，判斷同分異構物與實驗式異同。
- code: T13
  name: 實驗式與等重原子數比例
  desc: 由化合物實驗式或相同實驗式的兩物質，比較等重或等莫耳時的原子數比例。
- code: T14
  name: 燃燒分析求實驗式與分子式
  desc: 由有機物燃燒產生的水與二氧化碳質量，推算各元素莫耳數比與分子式。
- code: T15
  name: 常見離子與無機化合物命名書寫
  desc: 依據陽離子、陰離子與多原子根價數組合，正確寫出無機與常見有機化合物化學式。
- code: T16
  name: 依元素價數與週期表推求簡式
  desc: 由元素在週期表中的族別與價電子數，推斷兩元素形成化合物時的實驗式比例。
- code: T17
  name: 化學式正誤辨識與類型區分
  desc: 檢視化合物化學式的書寫與價數平衡是否正確，並區分實驗式與分子式的適用對象。
- code: T18
  name: 重量百分組成與化學式推導
  desc: 利用元素重量百分組成或不同氧化物的氧含量比例，建立未知元素兩化合物間的代數關係。
