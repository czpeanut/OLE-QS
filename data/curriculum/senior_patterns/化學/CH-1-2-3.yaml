unit:
  subject: 化學
  code: CH-1-2-3
  title: 反應式的平衡與化學計量
status: draft
types:
- code: T01
  name: 反應式係數意義與平衡
  desc: 依據原子不滅與電荷守恆平衡化學或離子反應式，並判別係數的莫耳數比意義與書寫規範。
- code: T02
  name: 單一反應物產物計量計算
  desc: 由平衡反應式與已知反應物莫耳數、質量、純度或轉化率，求算生成物質量或氣體體積。
- code: T03
  name: 限量試劑判斷與產率計算
  desc: 比較多反應物莫耳數與係數比找出限量試劑，求算理論產量、剩餘量或實驗產率。
- code: T04
  name: 反應前後質量與體積差計算
  desc: 利用固體加熱失重或定溫定壓氣體反應總體積變化量，反推反應物組成、莫耳比或反應式。
- code: T05
  name: 混合氣體燃燒與聯立求解
  desc: 針對兩種以上氣體混合物進行燃燒或吸收實驗，依碳氫守恆與體積關係聯立求解各成分比例。
- code: T06
  name: 多步驟連續反應計量串聯
  desc: 透過共同中間產物串聯兩階段以上反應式的係數比，由終端產物量反推起始反應物用量。
- code: T07
  name: 反應式係數意義判別
  desc: 釐清化學反應式係數代表莫耳數變化比而非質量比或平衡後莫耳數比，及催化劑標示方式。
- code: T08
  name: 反應式係數觀察法平衡
  desc: 利用原子不滅與電荷守恆平衡一般反應式或離子反應式，並求算最簡單整數係數與總和。
- code: T09
  name: 單一反應物計量與產率
  desc: 由已知反應物質量或減重計算理論產量、分解百分率或實際產率。
- code: T10
  name: 限量試劑與過量分析
  desc: 比較多種反應物的莫耳數與係數比，找出限量試劑並計算產物生成量與剩餘物莫耳數。
- code: T11
  name: 混合樣品與聯立計量
  desc: 針對兩種以上化合物的混合物反應（如烷類混合燃燒），設未知數聯立求解各成分莫耳數比。
- code: T12
  name: 氣體體積變化與原子經濟
  desc: 利用亞佛加厥定律處理同溫同壓氣體反應的體積變化，或依反應式計算原子使用效率。
- code: T13
  name: 反應式平衡與係數總和計算
  desc: 利用原子不滅原則以觀察法平衡反應式，並求最簡單整數係數總和。
- code: T14
  name: 多步驟反應串聯與原子守恆
  desc: 將連續多步反應式串聯或以原子守恆直接由產物質量反推反應物用量。
- code: T15
  name: 限量試劑判定與產率計算
  desc: 由各反應物初始質量換算莫耳數，判定限量試劑並計算理論產量與產率。
- code: T16
  name: 微觀粒子圖轉換化學反應式
  desc: 觀察反應前後微觀分子或原子示意圖的數量消長，寫出最簡整數係數平衡方程式。
- code: T17
  name: 化學反應式平衡與係數比較
  desc: 依原子種類與個數守恆平衡反應式，並由氣體反應前後係數和比較體積膨脹或收縮。
- code: T18
  name: 濃度變化曲線推求反應式係數
  desc: 由反應物與生成物濃度隨時間變化的圖表，讀取消耗與生成量比例以寫出反應方程式。
