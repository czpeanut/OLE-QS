unit:
  subject: 化學
  code: CH-S3-3-3
  title: 水的解離
status: draft
types:
- code: T01
  name: 水的離子積Kw與溫度關係
  desc: 利用水自身解離為吸熱反應及離子積僅受溫度影響的性質，比較不同溫度下純水的pH值與酸鹼性。
- code: T02
  name: pH、pOH與酸度AG換算
  desc: 利用氫離子與氫氧根離子濃度的對數定義及Kw關係，計算溶液的pH、pOH、酸度AG與離子濃度比。
- code: T03
  name: 強酸與強鹼溶液的pH值計算
  desc: 由強酸強鹼的體積莫耳濃度與解離質子數直接計算氫離子或氫氧根離子濃度，進而求得溶液pH值。
- code: T04
  name: 極稀強酸或強鹼溶液的pH計算
  desc: 考慮極稀溶液中水自身解離貢獻的氫離子與氫氧根離子，計算無限稀釋或極低濃度酸鹼的真實pH值。
- code: T05
  name: 強酸與強鹼混合後之pH值計算
  desc: 先進行強酸與強鹼的中和反應並找出過量一方，再依據混合後總體積計算剩餘離子濃度與pH值。
