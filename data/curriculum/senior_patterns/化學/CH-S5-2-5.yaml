unit:
  subject: 化學
  code: CH-S5-2-5
  title: 胺和醯胺
status: draft
types:
- code: T01
  name: 胺與醯胺的分類、命名與基本性質
  desc: 區分一級、二級、三級胺與醯胺的結構與命名，並比較分子間氫鍵、沸點與常見成員（如尿素）性質。
- code: T02
  name: 胺的鹼性強度比較與萃取分離
  desc: 依據氮上烷基推電子效應與苯環共振效應比較胺的鹼性強弱，並利用酸鹼萃取分離含胺基的有機混合物。
- code: T03
  name: 醯胺的製備反應與多步驟有機合成
  desc: 判斷一、二級胺與羧酸衍生物（如醯氯、酯類）反應生成醯胺，並規劃由苯出發合成乙醯胺苯的多步驟路徑。
- code: T04
  name: 胺基與醯胺基的水解反應及斷鍵判
  desc: 辨識勝肽、甜味劑（如阿司巴丹）等複雜分子中的胺基與醯胺基，並判斷酸性或鹼性水解時的共價鍵斷裂位置。
- code: T05
  name: 含氮有機物異構物計數與官能基辨
  desc: 列舉特定分子式（如C3H9N）的各級胺異構物數目，並判斷能否進一步反應生成醯胺。
- code: T06
  name: 胺的鹼性強度比較與反應
  desc: 比較脂肪胺、氨與芳香胺（苯胺）因烷基推電子或苯環共振造成的鹼性強弱及與酸成鹽反應。
- code: T07
  name: 各類官能基沸點與溶解度
  desc: 綜合比較醯胺、羧酸、醇、胺、醛酮酯、醚與烴的分子間氫鍵強弱及沸點、水溶性高低順序。
- code: T08
  name: 醯胺的製備與酸鹼水解反應
  desc: 判斷羧酸、酯或酸酐與氨／胺反應生成醯胺的條件，以及醯胺在酸鹼中水解的產物。
- code: T09
  name: 含氮有機物同分異構物判讀
  desc: 比較含氮原子之胺、醯胺與胺基酮等分子的分子式、官能基異構物及同系物關係。
- code: T10
  name: 醯胺合成反應與酸鹼水解產物
  desc: 預測胺與羧酸、醯氯、酸酐或酯類縮合生成醯胺，以及醯胺在酸或鹼中加熱水解的產物。
- code: T11
  name: 含氮藥物結構官能基與性質判別
  desc: 分析對乙醯胺酚等藥物結構中的酚羥基與醯胺鍵，判斷其酸鹼性、顯色、水解與反應性。
- code: T12
  name: 胺與醯胺多步驟有機合成推論
  desc: 追蹤由芳香烴硝化、還原至醯化反應的合成路徑圖，逐一推斷各步驟的中間體結構。
- code: T13
  name: 胺與醯胺分類結構與命名
  desc: 區分一、二、三級胺與醯胺的結構特徵，辨識醯胺鍵（肽鍵）並進行基本命名。
- code: T14
  name: 胺與醯胺分類、命名與鹼性比較
  desc: 區分一二三級胺及醯胺結構並進行命名，比較脂肪胺、芳香胺、氨與醯胺的鹼性強弱。
- code: T15
  name: 胺類製備反應與重氮鹽偶合反應
  desc: 判別鹵烷氨解或硝基苯還原製胺的方法，以及芳香一級胺與亞硝酸反應特性。
