unit:
  subject: 化學
  code: CH-S4-1-3
  title: 氧化還原滴定
status: draft
types:
- code: T01
  name: 當量數法比較氧化劑消耗體積
  desc: 利用氧化劑得電子莫耳數等於還原劑失電子莫耳數的關係，比較等濃度不同氧化劑所需的最少體積。
- code: T02
  name: 高錳酸鉀法標定與定量分析
  desc: 掌握草酸鈉標定過錳酸鉀與測定亞鐵離子含量的實驗步驟、酸化試劑選擇、器材名稱與終點顏色變化。
- code: T03
  name: 酸鹼滴定與氧化還原滴定聯用計算
  desc: 先由酸鹼滴定求得還原性酸的濃度，再進一步與氧化還原滴定數據聯立求算氧化劑溶液濃度。
- code: T04
  name: 碘量法與硫代硫酸鈉滴定計算
  desc: 依據過氧化氫氧化碘離子生成碘分子再以硫代硫酸鈉滴定的過程，判斷澱粉指示劑變色與純度計算。
- code: T05
  name: 氧化還原滴定實驗誤差分析
  desc: 分析滴定過程中加熱溫度過高、使用錯誤酸化試劑或讀數誤差對最終測定濃度的影響。
- code: T06
  name: 氧化還原返滴定與價態推求
  desc: 利用氧化劑與還原劑得失電子總莫耳數相等進行多步驟返滴定計算，或反推未知元素的氧化數與價態。
- code: T07
  name: 酸化試劑選用與反應加熱條件
  desc: 辨析氧化還原滴定中選用稀硫酸酸化、加熱加速草酸根反應及過錳酸鉀自指示劑免加指示劑之原理。
- code: T08
  name: 滴定器材配置與終點顏色判別
  desc: 選用精準量測與盛裝氧化還原試劑的滴定管、錐形瓶與吸量管，並判別過錳酸鉀滴定終點顏色變化。
- code: T09
  name: 直接滴定電子守恆定量計算
  desc: 運用氧化劑得電子莫耳數等於還原劑失電子莫耳數，進行單步直接滴定的濃度、原子量與重量百分率計算。
- code: T10
  name: 過量過錳酸鉀返滴定計量
  desc: 針對加入過量過錳酸鉀並以亞鐵離子標準液返滴定的多步驟實驗，利用總得失電子數守恆反推待測物含量。
