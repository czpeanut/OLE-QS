unit:
  subject: 化學
  code: CH-S2-1-4
  title: 電子組態
status: draft
types:
- code: T01
  name: 基態電子組態原則與判讀
  desc: 依據遞建原理、包立不相容原理與洪德定則，判別電子組態是否為基態、激發態或違反原理。
- code: T02
  name: 主族與過渡元素組態書寫
  desc: 寫出或辨識中性原子與過渡金屬的基態電子組態及各主層電子數。
- code: T03
  name: 離子電子組態與等電子體
  desc: 寫出主族與過渡金屬陽離子或陰離子的電子組態，並比較是否為等電子體。
- code: T04
  name: 未成對電子數與磁性判斷
  desc: 依據洪德定則計算原子或離子的未成對電子數，並判斷順磁性或逆磁性。
- code: T05
  name: 由組態推斷週期表位置性質
  desc: 由電子組態或離子電子分布反推元素的週期、族別、分區及價電子數，或比較躍遷能量。
- code: T06
  name: 基態組態寫法與主殼層
  desc: 依遞建原理寫出元素與過渡金屬（含鉻、銅例外）的基態電子組態，或換算各主殼層電子數。
- code: T07
  name: 三大定則與組態狀態判別
  desc: 依據遞建原理、包立不相容原理與洪德定則，區分基態、激發態與不存在的電子組態及能量高低。
- code: T08
  name: 最後填入電子之量子數
  desc: 依指定量子數填入順序（如ml、ms由正到負），求出原子最後填入電子的四個量子數。
- code: T09
  name: 未成對電子數與半填滿
  desc: 寫出原子或離子的軌域電子排列圖，計算未成對電子數或半填滿軌域數。
- code: T10
  name: 離子組態與等電子體比較
  desc: 依據先失去最外層ns電子的規則寫出陽離子組態，並判斷不同原子或離子是否具有相同電子組態。
- code: T11
  name: 組態轉變之吸放熱判斷
  desc: 比較轉變前後電子組態的能階高低與洪德定則穩定度，判斷該過程屬於吸熱或放熱。
- code: T12
  name: 由組態反推原子與週期表
  desc: 根據價電子組態、離子組態或3d電子特徵，反推原子序、中子數、族週期與化合物化學式。
- code: T13
  name: 由離子價電子組態反推原子序
  desc: 先依離子電荷數還原中性原子的總電子數（注意過渡金屬先失s軌域電子），再求原子序與軌域電子數。
- code: T14
  name: 遞建洪德包立三大原理判別
  desc: 檢視軌域圖或電子組態寫法，判斷是否符合或違反遞建原理、洪德定則與包立不相容原理。
- code: T15
  name: 基態激發態與錯誤電子組態區分
  desc: 判別多組電子組態或軌域箱圖屬於基態、激發態或違反包立不相容原理與不存在軌域的錯誤寫法。
- code: T16
  name: 過渡金屬與離子基態電子組態
  desc: 寫出或檢驗Cr、Cu等半填滿全填滿例外元素及過渡金屬陽離子先失去最外層s電子的基態電子組態。
- code: T17
  name: 未成對與半填滿電子數目計算
  desc: 寫出原子或離子的基態電子組態並計算其未成對電子個數、成對電子對數或半填滿d軌域數目。
- code: T18
  name: 等電子組態原子與離子群組判別
  desc: 比較不同中性原子與陰陽離子的基態電子組態是否完全相同，注意過渡金屬離子與中性原子的差異。
- code: T19
  name: 電子組態轉變吸熱與放熱判斷
  desc: 判斷原子或離子在不同電子組態（基態與激發態）之間轉變時屬於吸收能量（吸熱）或放出能量（放熱）。
- code: T23
  name: 特定量子數或軌域電子數統計
  desc: 由原子或離子的基態電子組態出發，統計填入特定軌域類型或具備特定磁量子數、自旋量子數的電子數。
