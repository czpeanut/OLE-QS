unit:
  subject: 化學
  code: CH-1-1-1
  title: 物質的分類與分離
status: draft
types:
- code: T01
  name: 純物質與混合物判別
  desc: 依據組成固定與否、微觀粒子示意圖或加熱溫度曲線，區分純物質與混合物或元素與化合物。
- code: T02
  name: 蒸餾與分餾原理及操作
  desc: 依據沸點差異判別適用蒸餾分離的混合物，或檢驗溫度計位置、冷凝水流向與沸石等操作。
- code: T03
  name: 萃取與結晶分離應用
  desc: 依據溶解度差異選擇萃取溶劑與分液漏斗，或判斷蒸發結晶與再結晶的操作原理。
- code: T04
  name: 濾紙層析與昇華過濾
  desc: 依據對固定相與展開液的作用力差異判讀層析結果，或選擇過濾與昇華分離特定混合物。
- code: T05
  name: 三相圖判讀與相變化
  desc: 依據溫度與壓力對照物質三相圖區域與界線，判斷狀態轉變方向及對應生活現象。
- code: T06
  name: 物理與化學分離技術
  desc: 依據混合物成分的沸點、溶解度、顆粒大小或極性差異，選用過濾、蒸餾、萃取、結晶或層析等分離方法。
- code: T07
  name: 層析與蒸餾裝置判讀
  desc: 解析濾紙層析的成分移動與作用力關係，或判斷蒸餾裝置的操作細節與收集順序。
- code: T08
  name: 加熱曲線與相變計算
  desc: 由定壓加熱曲線判斷熔點、沸點與相共存區間，並計算比熱大小或莫耳相變熱。
- code: T09
  name: 相圖區域與三相點判讀
  desc: 由壓力對溫度的相圖判斷固、液、氣三相區域、臨界點、三相點與定壓下的狀態變化。
- code: T10
  name: 純物質與混合物分類辨識
  desc: 依物質組成性質、熔沸點是否固定或微觀粒子圖示，區分元素、化合物與混合物。
- code: T11
  name: 物質三態性質與加熱曲線
  desc: 判別固液氣三態粒子排列與物理性質，或由定壓加熱曲線判斷純物質與狀態變化。
- code: T12
  name: 三相圖判讀與狀態轉換
  desc: 讀取三相圖中之三相點、正常熔沸點與各溫壓區間，判斷物質狀態與相變方向。
- code: T13
  name: 蒸餾與混合物分離操作
  desc: 判斷蒸餾、過濾、結晶或層析等物理分離方法的裝置構造、操作細節與適用對象。
- code: T14
  name: 實驗室安全規範與意外處理
  desc: 判別化學實驗操作安全規則，以及燙傷或藥品濺入眼睛時的正確緊急處理方式。
