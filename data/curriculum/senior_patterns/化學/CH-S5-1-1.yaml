unit:
  subject: 化學
  code: CH-S5-1-1
  title: 有機化合物的組成
status: draft
types:
- code: T01
  name: 有機化合物定義與排除特例判別
  desc: 區分有機化合物與碳氧化物、碳酸鹽、氰化物、元素態碳同素異形體等無機含碳物質。
- code: T02
  name: 燃燒分析法推求實驗式與分子式
  desc: 由燃燒產物水與二氧化碳的吸收增重計算碳氫含量比求出實驗式，再結合分子量求得分子式。
- code: T03
  name: 由結構式計算不飽和度與氫原子數
  desc: 依據有機分子中碳原子數與雙鍵、參鍵及環的數量，利用不飽和度公式快速計算氫原子數與分子式。
- code: T04
  name: 烴類分類與各類有機物最小碳數
  desc: 區分飽和烴、脂肪烴與芳香烴的結構分類，並判斷各類官能基有機化合物最簡單成員的碳原子數。
- code: T05
  name: 異構物計數與官能基辨識
  desc: 判斷兩結構是否為結構異構物、列舉特定分子式的異構物總數，或辨識複雜生醫分子中所含官能基。
- code: T06
  name: 同系物與同分異構物判別
  desc: 依據官能基是否相同且分子式相差整數個CH2，區分同系物與同分異構物。
