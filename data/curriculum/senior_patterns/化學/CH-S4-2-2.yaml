unit:
  subject: 化學
  code: CH-S4-2-2
  title: 電池電壓
status: draft
types:
- code: T01
  name: 標準還原電位定義與電池電壓計算
  desc: 依據電化學標準狀態與標準氫電極定義，將半電池標準還原電位反轉或相減求算電池標準電壓。
- code: T02
  name: 更換參考電極基準換算標準電位
  desc: 當重新指定某半反應的標準還原電位為零時，利用兩半電池間電位差不變的原則換算其他半反應電位。
- code: T03
  name: 標準電位比較氧化還原力
  desc: 根據已知電池電壓或反應自發與否，排列金屬的還原力順序與金屬陽離子的氧化力強弱順序。
- code: T04
  name: 反應自發性與容器儲存判斷
  desc: 計算目標反應的標準電位正負值判斷反應能否自發進行，並應用於評估特定金屬容器能否盛裝某離子溶液。
- code: T05
  name: 標準電位與平衡常數、速率關係
  desc: 判別標準電位大小與平衡常數呈正相關，但無法直接用來推斷化學反應速率的快慢。
- code: T06
  name: 電化電池陰陽極、符號與質量變化
  desc: 依據半電池標準還原電位或電極重量增減，判斷電化電池的陰陽極、電子與鹽橋離子流向及正確電池表示符號。
- code: T07
  name: 由電池正負極與電動勢推算活性
  desc: 未直接給定各半電池電位時，利用電池正負極、已知電池電動勢差值或反應自發正負號推算氧化還原力順序與未知電壓。
