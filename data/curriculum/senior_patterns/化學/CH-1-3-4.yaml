unit:
  subject: 化學
  code: CH-1-3-4
  title: 水溶液中的酸鹼反應
status: draft
types:
- code: T01
  name: 酸鹼化學式與中文系統命名
  desc: 辨識常見無機酸與氫氧化物的化學式及中文系統命名規則。
- code: T02
  name: 水的離子積Kw與溫度效應
  desc: 利用水的解離為吸熱反應及Kw隨溫度變化特性，判斷不同溫度下pH與酸鹼性。
- code: T03
  name: 溶液pH值計算與氫離子排序
  desc: 將已知濃度的強酸、強鹼或不同pH值與[OH-]數據統一換算為[H+]或pH比較。
- code: T04
  name: 酸鹼指示劑變色範圍判別
  desc: 根據指示劑變色pH範圍表與試驗顯色結果，縮小並鎖定待測溶液的pH區間。
- code: T05
  name: 酸鹼中和劑量與pH變化計算
  desc: 利用中和反應前後氫離子莫耳數差與總體積，計算調控pH值所需酸或鹼的質量。
- code: T06
  name: 酸鹼通性、指示劑與離子檢驗
  desc: 判斷酸鹼水溶液通性、廣用或酚酞指示劑呈色，及通入二氧化碳沉澱溶解等鑑別反應。
- code: T07
  name: pH值、pOH與水離子積換算
  desc: 運用水的離子積常數與氫離子、氫氧根離子濃度比值關係，計算溶液的 pH 值。
- code: T08
  name: 強酸與強鹼稀釋之pH變化
  desc: 判斷強酸、強鹼配製與倍數稀釋後的離子濃度與 pH 值變化，並辨識定溫下 Kw 不變。
- code: T09
  name: 強酸強鹼混合中和之濃度計算
  desc: 計算酸與鹼混合後的過量氫離子或氫氧根離子莫耳數，求算中和後溶液的濃度與 pH 值。
- code: T10
  name: 酸鹼中和計量與生活制酸劑
  desc: 利用胃藥成分碳酸鈣與胃酸中和前後的 pH 值變化，反推制酸劑的純度或重量百分率。
- code: T11
  name: 電解質分類、導電性與離子濃度
  desc: 依據物質在水溶液中解離程度區分強弱電解質與非電解質，並比較導電性或計算離子莫耳數。
