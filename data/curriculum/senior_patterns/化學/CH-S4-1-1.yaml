unit:
  subject: 化學
  code: CH-S4-1-1
  title: 電子轉移與氧化還原反應
status: draft
types:
- code: T01
  name: 有機與無機分子氧化數計算
  desc: 由分子結構式或電負度規則拆解化學鍵，計算特定原子或各原子的個別與平均氧化數。
- code: T02
  name: 氧化數規則與氧化還原劑性質
  desc: 依據元素最高與最低氧化數限制，判斷物質僅能當氧化劑、還原劑或兩者皆可（如硫代硫酸根）。
- code: T03
  name: 自身氧化還原反應判別
  desc: 檢驗反應中同一種元素是否同時升高與降低氧化數，判別是否為自身氧化還原或逆反應。
- code: T04
  name: 氧化還原機制與生活安全規範
  desc: 在消毒水、漂白劑或冶煉等情境中，依據氧化數變化分析反應機制與安全規範。
- code: T05
  name: 物質與有機物原子氧化數計算
  desc: 依據電負度與常見元素氧化數規則，計算無機化合物、過氧化物、有機分子或非整數氧化物氧化數。
- code: T06
  name: 氧化還原與自身氧化還原判別
  desc: 檢視反應前後元素氧化數變化，判斷是否為氧化還原反應，或同一物質同時升降的自身氧化還原。
- code: T07
  name: 氧化劑、還原劑與產物預測
  desc: 辨識反應中的氧化劑與還原劑及其生成物，並掌握高錳酸鉀在不同酸鹼環境下的還原產物。
- code: T08
  name: 氧化力與還原力強弱比較及推論
  desc: 由自發氧化還原反應方向排列氧化力與還原力順序，或依 pH 變化與褪色實驗推論物種價態。
- code: T09
  name: 氧化數變化量與電子轉移數比較
  desc: 比較不同反應中單一原子氧化數改變的差距，或由多價態金屬反應推斷電子轉移莫耳數。
- code: T10
  name: 氧化數規則與原子氧化數計算
  desc: 運用元素、離子與化合物的氧化數基本規則，計算無機物或有機物中特定原子的氧化數並判別存在性。
- code: T11
  name: 氧化還原反應判別與反應類型
  desc: 檢視反應前後元素氧化數是否改變，區分氧化還原反應、沉澱酸鹼反應與自身氧化還原反應。
- code: T12
  name: 氧化劑與還原劑的辨識與角色
  desc: 依據反應前後氧化數的升降方向，判斷反應物中何種原子或物質被氧化、被還原及擔任氧化或還原劑。
- code: T13
  name: 雙氧水等兩性試劑的氧化還原行為
  desc: 判斷過氧化氫等同時具氧化力與還原力的試劑，在不同反應條件與酸鹼度下的反應產物與性質變化。
