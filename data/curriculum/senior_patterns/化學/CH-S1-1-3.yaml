unit:
  subject: 化學
  code: CH-S1-1-3
  title: 反應熱的種類與性質
status: draft
types:
- code: T01
  name: 莫耳生成熱與燃燒熱定義判別
  desc: 依據標準狀態、穩定元素及1莫耳物質生成或完全燃燒的定義，判別反應熱種類。
- code: T02
  name: 零值標準莫耳生成熱物質判定
  desc: 辨識25℃、1 atm下最穩定元素單質的標準莫耳生成熱為零。
- code: T03
  name: 赫斯定律線性組合求反應熱
  desc: 將數個已知熱化學方程式進行倍數乘除或逆轉加減，組合出目標反應式並求ΔH。
- code: T04
  name: 生成熱與燃燒熱公式反推ΔH
  desc: 利用ΔH等於產物生成熱總和減反應物生成熱總和（或燃燒熱差），求解未知反應熱。
- code: T05
  name: 反應熱大小比較與能量階梯圖
  desc: 利用熱化學方程式代數關係或反應位能變化圖，比較各階段反應熱大小與正負。
- code: T06
  name: 卡計量測溶解熱與中和熱計算
  desc: 結合卡計水溶液質量、比熱與溫度差求總熱量，再換算莫耳溶解熱或中和熱。
- code: T07
  name: 弱酸鹼解離與沉澱熱效應比較
  desc: 比較不同強弱酸鹼混合或伴隨沉澱生成時，額外解離吸熱或水合放熱對中和熱的影響。
- code: T08
  name: 標準生成熱與燃燒熱定義判別
  desc: 檢視最穩定元素狀態、完全燃燒產物與1莫耳基準，判斷標準生成熱為零及熱化學式正誤。
- code: T09
  name: 物質狀態對反應熱大小影響
  desc: 比較反應物或產物處於固、液、氣或原子態時的焓值差異，判斷熱量變化大小順序。
- code: T10
  name: 赫斯定律與熱化學方程式疊加
  desc: 透過反轉與倍乘已知熱化學方程式並相加消去中間項，求算目標反應的反應熱。
- code: T11
  name: 由莫耳生成熱或燃燒熱求反應熱
  desc: 利用產物總生成熱減反應物總生成熱，或由莫耳燃燒熱推算未知反應熱與生成熱。
- code: T12
  name: 反應位能圖判讀與溶解熱溫變
  desc: 由多步驟反應位能圖比較各階段焓變大小，或由溶解熱結合比熱計算溶液溫度變化。
- code: T13
  name: 反應熱定義與熱含量圖判讀
  desc: 區分吸熱與放熱反應的熱含量高低、常見放熱反應類型，以及標準狀態的定義條件。
- code: T14
  name: 熱化學反應式與生成熱定義
  desc: 依據元素態物質在標準狀態下生成一莫耳化合物的定義，判別正確的莫耳生成熱與燃燒熱方程式。
- code: T15
  name: 赫斯定律加成推算反應熱
  desc: 將已知熱化學反應式進行乘除與倒轉加減組合，推算目標反應的反應熱或熱含量順序。
- code: T16
  name: 利用莫耳生成熱計算反應熱
  desc: 套用生成物總生成熱減去反應物總生成熱的關係式，計算化學反應的標準反應熱。
- code: T17
  name: 卡計熱容量測定與中和熱實驗
  desc: 利用冷熱水混合或酸鹼中和實驗的溫度變化與熱平衡列式，求算卡計熱容量與莫耳中和熱。
- code: T18
  name: 燃料莫耳燃燒熱與碳排放比較
  desc: 依據各燃料莫耳燃燒熱與碳原子數，比較產生等量熱能時的二氧化碳排放量或質量效益。
