unit:
  subject: 生物
  code: BI-S3-2-1
  title: 循環系統
status: draft
types:
- code: T01
  name: 心臟腔室瓣膜與動靜脈血管含氧量
  desc: 辨識心臟四腔室、房室瓣與半月瓣的結構流向，並比較體循環與肺循環各血管的血液含氧量。
- code: T02
  name: 心搏週期房室收縮與心音產生
  desc: 追蹤心房心室收縮舒張順序、瓣膜開閉時機與第一、第二心音產生的對應關係。
- code: T03
  name: 血管總橫截面積、血流速與血壓圖
  desc: 依據物理管徑流體原理，比較主動脈、微血管與靜脈的總橫截面積、血流速度及血壓變化曲線。
- code: T04
  name: 微血管物質交換與小動脈括約肌
  desc: 闡述小動脈括約肌調節微血管血流量，及靜脈瓣膜、骨骼肌擠壓與呼吸運動協助靜脈回流的動力。
- code: T05
  name: 血液組成血漿與三種血球功能比較
  desc: 比較紅血球、白血球與血小板的形態、細胞核有無、體積大小、數量比例與生理功能。
- code: T06
  name: 淋巴循環路徑與組織液形成回收
  desc: 追蹤血漿滲出成為組織液、進入微淋巴管並最終匯入靜脈回流心臟的淋巴循環構造與功能。
- code: T07
  name: 動物循環系統類型比較
  desc: 比較無循環系統、開放式與封閉式循環系統的代表動物、血淋巴與微血管交換方式。
- code: T08
  name: 血液組成、離心分層與血球
  desc: 分析抗凝血劑與凝血後離心分層的血漿、血清與血球差異，及各類血漿蛋白與血球功能。
- code: T09
  name: 血管構造與血流物理量曲線
  desc: 比較動靜脈與微血管的管壁彈性、內徑、瓣膜、血壓、血流速及總截面積關係圖。
- code: T10
  name: 心臟腔室瓣膜與冠狀循環
  desc: 辨識心臟四腔室、房室瓣與半月瓣位置及開閉異常影響，與冠狀動脈靜脈的血流路徑。
- code: T11
  name: 心搏週期、心音與傳導系統
  desc: 判讀心搏週期各階段房室收舒與瓣膜開閉狀態，推論心音產生時機與節律點傳導路徑。
- code: T12
  name: 血壓、心輸出量與微循環調節
  desc: 分析心搏出量、心跳率、血管管徑、微血管前括約肌與自律神經對血壓及血流的調控。
- code: T13
  name: 淋巴系統組成、器官與回流
  desc: 辨識微淋管盲端構造、淋巴成分、淋巴結與回流路徑，及協助靜脈與淋巴回流的動力。
- code: T14
  name: 養分吸收後循環路徑追蹤
  desc: 追蹤水溶性養分經肝門靜脈或脂溶性養分經乳糜管、胸管首次回到心臟的血管順序。
- code: T15
  name: 心臟腔室、瓣膜、血流與心搏週期
  desc: 依心臟構造或心搏週期時間軸圖，判讀充氧／缺氧血路徑、瓣膜開閉時機、第一／第二心音及心率計算。
- code: T16
  name: 冠狀循環路徑與血流時機判別
  desc: 追蹤冠狀動脈開口位置與心肌微血管交換路徑，並比較心室收縮期與舒張期冠狀動脈血流量的差異。
- code: T17
  name: 血管構造橫切面與血壓流速比較
  desc: 依管壁厚度與口徑比例圖辨識動脈、靜脈與微血管，並比較三者的血壓、血流速度、瓣膜有無與平滑肌分布。
- code: T18
  name: 血壓與腎臟過濾等跨系統連動
  desc: 分析心跳速率、心輸出量、動脈阻力、血管彈性與失血等因素對血壓高低及腎絲球過濾率的連鎖影響。
- code: T19
  name: 血液抹片細胞顯微辨識與功能
  desc: 依據血液抹片比例尺與細胞核形態，區分紅血球（含碳酸酐酶、雙凹圓盤）與各類白血球的尺度及功能。
- code: T20
  name: 淋巴系統動力來源與回收路徑
  desc: 判別淋巴管瓣膜、骨骼肌與呼吸運動對淋巴流動的作用，以及胸管與右淋巴總管對脂溶性養分與組織液的回收區分。
