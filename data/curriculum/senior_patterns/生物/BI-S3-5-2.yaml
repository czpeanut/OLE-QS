unit:
  subject: 生物
  code: BI-S3-5-2
  title: 胚胎發育
status: draft
types:
- code: T01
  name: 卵裂特徵與早期胚胎發育階段
  desc: 比較卵裂期細胞數目、體積與分裂方式，並排列桑葚胚、囊胚與原腸胚的發育順序。
- code: T02
  name: 三胚層分化與器官形成對應
  desc: 區分外胚層、中胚層與內胚層各自發育形成的動物體組織與器官系統。
- code: T03
  name: 胚外膜構造與羊膜動物演化
  desc: 辨識絨毛膜、羊膜、卵黃囊與尿囊在胚胎保護、氣體交換與養分供應上的功能。
- code: T04
  name: 胎盤與臍帶物質交換機制
  desc: 區分臍動脈與臍靜脈的含氧量與血流方向，並判別母體與胎兒間經胎盤擴散的物質。
- code: T05
  name: 懷孕激素維持、分娩與產後泌乳
  desc: 闡明hCG、黃體與胎盤激素對妊娠的維持，以及催產素引發子宮收縮分娩與泌乳的正回饋調控。
