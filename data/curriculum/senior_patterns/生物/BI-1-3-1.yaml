unit:
  subject: 生物
  code: BI-1-3-1
  title: 生物的演化
status: draft
types:
- code: T01
  name: 天擇說與用進廢退說辨析
  desc: 區分拉馬克用進廢退說與達爾文天擇說對性狀改變、遺傳變異與環境篩選的核心差異。
- code: T02
  name: 遺傳變異與環境天擇因果推論
  desc: 依據「先有個體遺傳變異，再經環境天擇篩選」的邏輯，解釋抗藥性或體色適應現象。
- code: T03
  name: 基因多樣性來源與生殖方式
  desc: 比較突變、有性生殖基因重組與無性生殖對族群基因多樣性及環境適應力的影響。
- code: T04
  name: 天擇與人擇的篩選機制比較
  desc: 比較人工選育與自然天擇在篩選標準、演化方向及個體返回自然環境後存活率的差異。
- code: T05
  name: 現代演化觀念與族群遺傳變動
  desc: 結合族群基因頻率改變與動態天擇觀點，判別達爾文天擇說與現代綜合理論的異同。
- code: T06
  name: 天擇說與用進廢退說機制辨析
  desc: 比較達爾文天擇說與拉馬克用進廢退說對性狀變異來源、環境角色與遺傳機制的解釋。
- code: T07
  name: 族群抗藥性與保護色天擇實例
  desc: 運用天擇篩選既有遺傳變異的原理，解釋細菌/昆蟲抗藥性與胡椒蛾体色比例消長。
- code: T08
  name: 實驗數據圖表推論天擇與共演化
  desc: 判讀族群性狀分布或相關性圖表，推論環境改變或食性壓力對物種性狀演化的影響。
- code: T09
  name: 生殖隔離與新種形成條件判別
  desc: 區分地理隔離、突變與生殖隔離在種化過程中的角色，判斷新種形成的關鍵標準。
- code: T10
  name: 適應輻射、大滅絕與多樣性危機
  desc: 判別適應輻射發生的生態契機、地質史上大滅絕成因及人類活動造成的生物多樣性流失。
- code: T11
  name: 演化思想史與拉馬克學說比較
  desc: 辨識布豐、拉馬克用進廢退說與達爾文天擇說的歷史脈絡及核心觀點差異。
- code: T12
  name: 達爾文天擇說理論基礎與啟發
  desc: 說明馬爾薩斯人口論、萊爾地質學與人工育種如何啟發達爾文提出過度繁殖與天擇概念。
- code: T13
  name: 適應輻射與加拉巴哥雀鳥演化
  desc: 分析地理隔離與不同棲位食性如何促使共同祖先演化出不同嘴喙形態的物種。
- code: T14
  name: 拉馬克用進廢退與達爾文天擇比較
  desc: 區分拉馬克用進廢退說與達爾文天擇說對性狀改變、突變與適應演化的核心觀點差異。
- code: T15
  name: 天擇機制與族群性狀頻率變遷
  desc: 依據族群內遺傳變異、過度繁殖與生存競爭，推論天擇如何篩選有利性狀並淘汰弱勢族群。
- code: T16
  name: 保護色與環境變遷天擇實例分析
  desc: 藉由胡椒蛾工業黑化或蝸牛殼色分布圖表，分析掠食者視覺捕食與環境改變對性狀比例的影響。
- code: T17
  name: 演化論發展史與科學家觀點辨析
  desc: 辨識亞里斯多德、林奈、拉馬克、達爾文與華萊士對物種是否隨時間演變的歷史觀點。
