unit:
  subject: 生物
  code: BI-S2-2-1
  title: 植物體的組成層次
status: draft
types:
- code: T01
  name: 動植物組織分類與細胞特性比較
  desc: 綜合比較動物上皮、結締等組織與植物表皮、分生、輸導組織的細胞排列與功能特徵。
- code: T02
  name: 植物三大組織系統構造與功能
  desc: 區分表皮組織（如保衛細胞、毛茸）、基本組織與維管束組織的細胞組成與生理功能。
- code: T03
  name: 薄壁厚角厚壁細胞形態比較
  desc: 依據初生／次生細胞壁增厚型態、木質素有無與細胞核存留，辨別薄壁、厚角與厚壁細胞。
- code: T04
  name: 分生組織細胞特徵與分類
  desc: 判別初生與次生分生組織的核質比大小、液胞體積、分裂能力及所在部位（生長點、形成層、周鞘）。
- code: T05
  name: 維管束木質部與韌皮部細胞比較
  desc: 比較導管、假導管、篩管與伴細胞的死活狀態、穿孔板或篩板構造及原生質絲運輸通道。
- code: T06
  name: 表皮特化構造與功能判別
  desc: 判別植物表皮特化構造（如毛茸、氣孔、根毛）在保護、氣體交換與吸收上的適應功能。
- code: T07
  name: 初生與次生分生組織比較
  desc: 區分頂端分生組織（初生生長）與維管束形成層、木栓形成層（次生生長）的位置與分裂功能。
- code: T08
  name: 薄壁、厚角與厚壁細胞比較
  desc: 依據細胞壁成分（纖維素、木質素）、壁厚均勻度與細胞死活，區分三種植物基本組織細胞。
- code: T09
  name: 植物細胞壁與胞間連絲結構
  desc: 判別初生細胞壁、次生細胞壁、中膠層及篩孔、壁孔的構造差異與細胞間溝通功能。
- code: T10
  name: 輸導細胞構造與運輸特性比較
  desc: 依據細胞核有無、細胞死活、壁孔或篩板構造，比較導管、管胞、篩管與伴細胞的輸導機能。
- code: T11
  name: 植物四大組織系統與演替特徵
  desc: 判別表皮、基本、維管束與分生組織的功能分工，並辨識單雙子葉或被子植物化石的演化特徵。
- code: T12
  name: 薄壁、厚角與厚壁組織比較
  desc: 比較薄壁、厚角與厚壁細胞在細胞壁厚度、成分、活死細胞狀態與支持功能的差異。
- code: T13
  name: 表皮組織系統與特化細胞功能
  desc: 辨識表皮細胞、角質層、保衛細胞與根毛的構造特徵，及其在氣體交換與吸收的生理角色。
- code: T14
  name: 植物組織系統分類與定義
  desc: 依據組織在不同器官間的連續性，區分表皮、維管束與基本三大組織系統。
- code: T15
  name: 初生與次生分生組織判別
  desc: 區分頂端分生組織與維管束形成層、木栓形成層及周鞘的分布位置與分裂特性。
