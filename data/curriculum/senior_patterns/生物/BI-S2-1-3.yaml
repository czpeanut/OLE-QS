unit:
  subject: 生物
  code: BI-S2-1-3
  title: 生命型式的演化過程
status: draft
types:
- code: T01
  name: 內共生學說證據與胞器起源
  desc: 依據粒線體與葉綠體的雙層膜、環狀DNA、核糖體與獨立分裂週期，驗證內共生假說。
- code: T02
  name: 生命演化先後次序排列
  desc: 依據核酸、異營厭氧生物、光合自營生物、大氣游離氧累積與多細胞生物出現的時序進行排列。
- code: T03
  name: 內共生假說證據與胞器特性
  desc: 依據雙層膜構造差異、環狀DNA、原核型核糖體與二分裂複製，驗證粒線體與葉綠體的內共生起源。
- code: T04
  name: 早期生物營養與代謝方式推論
  desc: 依據早期地球環境有機物豐富與無氧條件，推論最早期生物採取無氧異營代謝的演化順序。
- code: T05
  name: 原核真核與多細胞分化演進
  desc: 比較大團藻群體性單細胞與真核多細胞生物在細胞分化程度及分工上的演化差異。
- code: T06
  name: 古細菌極端環境適應與演化意義
  desc: 分析古細菌與真細菌的親緣及棲地多樣性，並推論甲烷菌代謝變化對地質大滅絕事件的影響。
- code: T07
  name: 原始生物營養與代謝演化順序
  desc: 依序判別異營厭氧、光合自營產氧、大氣氧累積與有氧呼吸生物出現的演化先後關係。
- code: T08
  name: 內共生學說與真核胞器演化順序
  desc: 依據雙層膜、環狀DNA與核糖體特徵，推論真核祖先先吞噬好氧菌成粒線體再獲得葉綠體的順序。
- code: T09
  name: RNA世界假說與核酶特性
  desc: 依據RNA具遺傳訊息儲存、自我複製與酵素催化能力，推論其為最早遺傳物質。
- code: T10
  name: 原始異營與自營代謝演替
  desc: 比較厭氧異營、光合自營與好氧異營生物的出現順序及對大氣氧氣濃度的影響。
- code: T11
  name: 內共生學說與胞器演化
  desc: 依據雙層膜、環狀DNA與分裂方式推論粒線體與葉綠體的內共生起源及先後順序。
- code: T12
  name: 半自主胞器構造與功能
  desc: 判別粒線體與葉綠體的雙層膜構造、自行合成部分蛋白質及二分裂增殖等特徵。
