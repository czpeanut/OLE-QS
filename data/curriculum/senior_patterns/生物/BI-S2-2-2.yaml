unit:
  subject: 生物
  code: BI-S2-2-2
  title: 營養器官的形態、構造與功能
status: draft
types:
- code: T01
  name: 根部縱橫切面、卡氏帶與支根
  desc: 辨識根尖分區、內皮卡氏帶與周鞘等構造，並推論支根起源與破壞外層組織的順序。
- code: T02
  name: 單雙子葉根莖橫切比較與配對
  desc: 依據維管束排列、髓與形成層有無及木質部形狀，區分單雙子葉根莖橫切面並配對植物。
- code: T03
  name: 莖橫切維管束內外方位判讀
  desc: 依據莖橫切面中木質部與韌皮部的相對位置及形成層構造，判別組織內外方位與功能。
- code: T04
  name: 木本莖次生生長、樹皮與年輪
  desc: 判別維管束形成層與木栓形成層分裂方向，區分樹皮周皮、心邊材與早晚材年輪特徵。
- code: T05
  name: 初生生長與樹幹標記高度推論
  desc: 運用頂端分生組織向上延長與形成層加粗的原理，推算樹幹標記高度與周長隨年份變化。
- code: T06
  name: 葉片橫切構造、葉序與環境適應
  desc: 辨識上下表皮、柵狀與海綿組織、葉脈方位及葉序形態，並推論旱生或水生葉片適應。
- code: T07
  name: 斑葉呈色機制與葉片構造
  desc: 分析斑葉植物因組織氣室折射或色素分布差異造成的呈色機制與葉片內部構造特徵。
- code: T08
  name: 變態營養器官與日常食用部位
  desc: 依據節、芽與維管束排列特徵，辨識塊根、塊莖、根莖或鱗葉等變態器官與食用部位。
- code: T09
  name: 特化根形態功能與植物配對
  desc: 依據支持根、儲藏根、寄生根、板根與水生根的形態特徵，配對代表植物與生態功能。
- code: T10
  name: 基本組織儲藏與防禦功能
  desc: 判別皮層、髓等基本組織的養分儲存功能，以及植物在營養器官中的生物性防禦機制。
- code: T11
  name: 水生植物構造與生態適應
  desc: 分析水生植物通氣組織、角質層與氣孔缺失等構造特徵，推論其對水域環境的適應。
- code: T12
  name: 氣孔與皮孔構造功能比較
  desc: 比較氣孔與皮孔的分布器官、細胞死活狀態、開閉調節機制與氣體進出植物體的差異。
