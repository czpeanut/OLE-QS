unit:
  subject: 生物
  code: BI-S2-1-2
  title: 生物起源的過程
status: draft
types:
- code: T01
  name: 異營生物先於自營生物的演化
  desc: 推論最早期的原始生命以環境有機物為食的異營厭氧生活型式，而後才演化出自營生物。
- code: T02
  name: 化學演化階段與科學家貢獻
  desc: 區分歐帕林原生湯假說、米勒與尤里、卡爾文及福克斯在有機分子合成階段的實驗成果。
- code: T03
  name: 米勒與尤里實驗裝置與產物分析
  desc: 判別模擬原始大氣成分、電極能量來源、冷凝管水流方向與收集到的小分子有機物種類。
- code: T04
  name: 原始地球環境與有機物累積條件
  desc: 依據無游離氧、無腐生細菌與強輻射閃電等條件，解釋早期海洋高濃度有機物形成與現今差異。
- code: T05
  name: RNA世界假說與核酶特性推論
  desc: 依據RNA兼具遺傳複製與核酶催化雙重功能，及鹼基抗紫外光穩定性推論原始遺傳物質演化。
- code: T06
  name: 原始細胞（脂質體）形成與特性
  desc: 判別早期原始細胞具有脂雙層膜包裹、進行無氧異營代謝及缺乏精細胞器分化的特徵。
- code: T07
  name: 原始地球大氣與化學演化條件
  desc: 依據原始地球無游離氧、還原性大氣及高能量環境（閃電、紫外線），解釋有機物得以累積的條件。
- code: T08
  name: 有機演化論四階段順序推演
  desc: 依序排列無機物合成小分子有機物、聚合成大分子、自我複製分子出現及膜狀構造包圍遺傳物質的過程。
- code: T09
  name: 尤里與米勒模擬實驗判讀
  desc: 分析尤里—米勒實驗裝置中的原始氣體成分、電擊能量與產物，判別實驗證實的化學演化步驟。
- code: T10
  name: 熱聚合與微球體前細胞模型
  desc: 依據歐帕林團聚體與福克斯類蛋白微球體實驗，辨識小分子聚合成大分子及原始膜狀界線的形成機制。
- code: T11
  name: RNA世界假說與核酶催化
  desc: 依據RNA具有儲存遺傳訊息、自我複製及如核酶般的催化能力，推論RNA為地球最早遺傳物質的證據。
- code: T12
  name: 原始大氣組成與化學演化環境條件
  desc: 判別原始地球還原性大氣成分（缺氧）與閃電、紫外線等能量來源對無機物合成有機物的影響。
- code: T13
  name: 米勒模擬原始大氣實驗裝置判讀
  desc: 辨識米勒實驗裝置中的氣體組成、電極模擬閃電、冷凝管與產生的胺基酸等有機小分子。
- code: T14
  name: 原生體、微脂體與凝聚體特性比較
  desc: 比較微脂體的脂雙層半透性與分裂現象，以及凝聚體包覆酵素進行代謝反應的前生命特徵。
- code: T15
  name: RNA世界假說與核酶催化機制
  desc: 說明RNA同時具備儲存遺傳訊息與催化（核酶）雙重功能，支持其作為最早遺傳物質的推論。
- code: T16
  name: 原始湯與化學演化假說
  desc: 辨識歐帕林與霍爾丹等學者提出的原始湯理論，與早期有機物合成的環境條件。
- code: T17
  name: 米勒與卡爾文模擬實驗
  desc: 判別原始大氣氣體組成（缺氧還原態）與能量來源，推論合成小分子有機物的種類。
- code: T18
  name: 有機演化分子出現順序
  desc: 排列無機物、小分子有機物、核酸、原始細胞與各類營養生物演化的先後順序。
- code: T19
  name: 化學演化階段條件限制
  desc: 分析早期地球缺乏氧氣與臭氧層時，紫外線與閃電如何促成有機物累積。
