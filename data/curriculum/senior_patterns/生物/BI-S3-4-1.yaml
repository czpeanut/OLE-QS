unit:
  subject: 生物
  code: BI-S3-4-1
  title: 神經系統
status: draft
types:
- code: T01
  name: 電生理史與人工神經類比
  desc: 辨識電生理研究史關鍵科學家（如賈法尼），或將神經元樹突、突觸、細胞本體與軸突結構類比至人工神經網路元件。
- code: T02
  name: 膜電位與離子通道機制
  desc: 依據膜電位變化圖與鈉鉀離子通道閘門狀態，判讀去極化、再極化、過極化與離子通道阻斷劑的作用位置。
- code: T03
  name: 全有全無律、髓鞘與跳躍傳導判別
  desc: 判斷不同刺激強度曲線是否達閾值與動作電位高度不變性，並分析髓鞘絕緣、郎氏結跳躍傳導與不反應期單向傳遞。
- code: T04
  name: 突觸傳遞與神經傳遞物質效應分析
  desc: 追蹤突觸前鈣離子流入與神經傳遞物（如GABA、ACh、NE）釋放，判別其對突觸後膜電位（興奮／過極化抑制）的影響。
- code: T05
  name: 感覺受器傳導與特徵比較
  desc: 比較味覺、嗅覺（不經視丘）、視覺（視桿／視錐）、觸覺與骨骼肌肌梭受器的感受機制及大腦皮質解讀差異。
- code: T06
  name: 中樞神經分區與反射弧
  desc: 辨識大腦左右半球、小腦、中腦與延腦功能及脊髓灰白質／背腹根構造，並區分有無聯絡神經元參與的反射弧。
- code: T07
  name: 周圍神經系統與自律神經比較
  desc: 區分腦神經與脊神經對數與混合神經性質，並依節前／節後神經元長度圖與動器神經傳遞物分辨交感、副交感與體神經。
- code: T08
  name: 神經與內分泌系統調控特性比較
  desc: 從訊號傳遞速度、作用持續時間、作用範圍與運輸途徑比較神經系統與內分泌系統的調控差異。
