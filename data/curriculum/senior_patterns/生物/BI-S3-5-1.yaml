unit:
  subject: 生物
  code: BI-S3-5-1
  title: 生殖系統
status: draft
types:
- code: T01
  name: 男性生殖構造與精子輸送路徑
  desc: 辨識睪丸、副睪、輸精管、儲精囊、攝護腺等構造位置、功能及精子排出體外的路徑順序。
- code: T02
  name: 細精管切片與男性激素調控
  desc: 依細精管顯微切片辨識精原細胞、支持細胞與間質細胞，並判別睪固酮與第二性徵的調控關係。
- code: T03
  name: 配子形成過程與染色體套數比較
  desc: 比較精原與卵原細胞減數分裂產物數量、極體形成、分裂停滯時期及染色體套數變化。
- code: T04
  name: 女性生殖週期與激素回饋調控
  desc: 依卵巢濾泡、黃體與子宮內膜變化圖，判讀FSH、LH、動情素與助孕酮的濃度消長與回饋機制。
- code: T05
  name: 月經週期推算與受孕避孕機制
  desc: 依據月經週期天數推算排卵日與易受孕期，或分析安胎針、墮胎藥RU486等激素受體作用機制。
- code: T06
  name: 受精作用與透明帶防多精機制
  desc: 闡明體外受精卵細胞時期、精子穿透濾泡與透明帶的反應，及防止多精子或跨物種受精的機制。
- code: T07
  name: 男女生殖器官構造與功能配對
  desc: 辨識睪丸、細精管、儲精囊、前列腺、卵巢、輸卵管與子宮等生殖構造及其生理功能。
- code: T08
  name: 配子形成與減數分裂歷程比較
  desc: 追蹤精子生成與卵子發育（初級／次級卵母細胞、極體與排卵／受精分裂階段）的差異與染色體變化。
- code: T09
  name: 月經週期卵巢子宮與激素曲線
  desc: 對應月經週期中濾泡期、排卵、黃體期與行經期、增生期、分泌期的變化及動情素、黃體素與LH/FSH消長。
- code: T10
  name: 排卵日推算與避孕受孕激素調控
  desc: 依據黃體期約14天恆定推算不同月經週期排卵日，或分析HCG維持黃體及避孕藥抑制排卵的作用機制。
