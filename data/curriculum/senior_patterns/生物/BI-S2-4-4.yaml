unit:
  subject: 生物
  code: BI-S2-4-4
  title: 植物體對環境刺激的反應
status: draft
types:
- code: T01
  name: 植物對低溫與缺氧逆境的適應
  desc: 闡明耐低溫植物增加膜上不飽和脂肪酸比例與缺氧時合成乙烯形成通氣組織的逆境生理機制。
- code: T02
  name: 開花實驗遮光與色光處理結果推論
  desc: 依據植株葉片遮光與光週期處理實驗圖表，推論光週期類型、感光部位與開花反應結果。
- code: T03
  name: 向性與傾性運動機制比較
  desc: 區分向地性（根帽感受）等生長差異引起的向性運動，與膨壓或離子進出運動細胞引發的傾性／睡眠運動。
- code: T04
  name: 光週期臨界夜長與開花條件判斷
  desc: 依據短日照（長夜）與長日照（短夜）植物的臨界夜長及連續黑暗中斷效應，判斷開花結果。
- code: T05
  name: 光敏素紅光與遠紅光可逆轉換實驗
  desc: 依據最後一次照射紅光（Pfr）或遠紅光（Pr）的狀態，推論光週期開花或萵苣種子萌發率。
- code: T06
  name: 春化作用與非生物逆境適應機制
  desc: 判別低溫春化感受部位（胚、分生組織）、耐低溫細胞膜不飽和脂肪酸比例及乾旱形態與生理反應。
- code: T07
  name: 植物物理性與化學性防禦策略區分
  desc: 區分表皮蠟質、刺、毛茸等物理防禦與植保素、生物鹼、局部細胞壞死等化學及誘發性防禦。
- code: T08
  name: 向性反應（向地、向觸、向光）
  desc: 依據刺激方向性與生長素在根、莖兩側不均勻分布及鈣離子參與，解釋根正向地性與莖負向地性機制。
- code: T09
  name: 傾性與快速運動（膨壓變化）
  desc: 區分與刺激方向無關的傾性（睡眠運動、捕蟲運動），並分析動作電位與茉莉酸等訊息分子的調控。
- code: T10
  name: 光敏素型態轉換與光週期開花
  desc: 依據Pr與Pfr對紅光（660 nm）與遠紅光（730 nm）的可逆轉換，判讀夜長中斷、嫁接與不同緯度植物的開花反應。
- code: T11
  name: 非生物逆境與植物適應機制
  desc: 分析植物面對乾旱（ABA、氣孔關閉）、低溫（不飽和脂肪酸增加）、高溫（熱休克蛋白）與淹水（乙烯、通氣組織）的適應機制。
- code: T12
  name: 植物動作電位與茉莉酸訊息傳遞
  desc: 依據捕蠅草等植物受機械刺激產生的動作電位次數，推論葉片閉合、茉莉酸與基因表現反應。
- code: T13
  name: 長夜與短夜植物臨界夜長判別
  desc: 依據臨界夜長定義與開花率曲線圖，區分短日照植物與長日照植物及開花條件。
- code: T14
  name: 光敏素吸收光譜與中斷黑暗實驗
  desc: 追蹤紅光與遠紅光交替照射中斷連續黑暗期對Pr與Pfr型光敏素轉換及開花結果的影響。
- code: T15
  name: 感應部位葉片與開花素運輸實驗
  desc: 分析葉片遮光或摘除實驗，推論感受光週期刺激的器官為葉片及開花調節物質的運輸機制。
- code: T16
  name: 光週期與春化作用園藝產期調節
  desc: 運用夜間電照、遮黑或低溫春化處理等方法，調節菊花或冬小麥等植物的開花時間。
- code: T17
  name: 光敏素在種子萌發與向性中的角色
  desc: 辨識光敏素的化學本質、極微量特性及其參與種子萌發與避蔭等光形態發生的調控作用。
