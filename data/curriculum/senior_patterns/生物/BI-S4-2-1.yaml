unit:
  subject: 生物
  code: BI-S4-2-1
  title: 生態學的研究內容
status: draft
types:
- code: T01
  name: 生態學研究層次與尺度比較
  desc: 區分個體、族群、群集、生態系、地景與生物圈的包含關係與尺度大小排列。
- code: T02
  name: 生物與非生物環境因子判別
  desc: 判別溫度、光照、水分、土壤等非生物因子與生物因子對生物分布及適應的影響。
- code: T03
  name: 生態學取樣與調查方法選擇
  desc: 依據研究對象的移動能力與棲地特徵，選擇樣區法、捉放法或樣線法進行生態調查。
- code: T04
  name: 環境耐受度與限制因子分析
  desc: 依據耐受範圍曲線圖與最小因子定律，推論限制生物分布與族群數量的關鍵環境因子。
- code: T05
  name: 生態學實驗變因與數據判讀
  desc: 分析野外觀察或控制實驗中的操縱變因、對照組設計與生態數據趨勢。
