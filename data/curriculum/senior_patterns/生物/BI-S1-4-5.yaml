unit:
  subject: 生物
  code: BI-S1-4-5
  title: 生物科技
status: draft
types:
- code: T01
  name: 限制酶切位與電泳圖譜分析
  desc: 判讀雙股DNA反向互補的回文序列特徵，並由限制酶切割後的電泳片段長度反推切位。
- code: T02
  name: 重組DNA載體與篩選基因
  desc: 辨識質體與農桿菌載體上的複製起點、限制酶切位與抗藥性篩選基因在轉殖中的功能。
- code: T03
  name: PCR與電泳臨床檢測應用
  desc: 說明羊膜穿刺基因診斷及新冠病毒Real-Time RT-PCR中Ct值與螢光探針偵測原理。
- code: T04
  name: mRNA與腺病毒載體疫苗
  desc: 比較核酸疫苗將棘突蛋白基因送入宿主細胞表現抗原以誘發免疫反應的運作流程。
- code: T05
  name: 傳統生物技術與現代基因工程區辨
  desc: 區分發酵食品與多倍體育種等傳統生物技術，與重組DNA等現代分子生物技術的差異。
- code: T06
  name: 基因體學與定序分析研究應用
  desc: 判別全基因體關聯性分析（GWAS）、基因體定序或基因轉殖等生物科技研究工具的適用情境。
- code: T07
  name: 基因剔除與基因編輯技術應用
  desc: 解析胚胎幹細胞基因剔除嵌合體或CRISPR-Cas9基因編輯的作用原理、優缺點與生醫應用。
