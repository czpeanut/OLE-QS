unit:
  subject: 生物
  code: BI-1-2-3
  title: 遺傳工程及其應用
status: draft
types:
- code: T01
  name: 重組DNA與基因轉殖原理
  desc: 判別重組DNA技術將外源基因植入宿主細胞並表現跨物種性狀的基本原理與應用範圍。
- code: T02
  name: 基因轉殖操作步驟排序
  desc: 依據分離質體、限制酶切割、DNA連接酶接合與轉殖入宿主細胞的順序排列實驗流程。
- code: T03
  name: 重組DNA工具酵素與步驟判別
  desc: 區分限制酶切割與DNA連接酶接合在重組質體建構中的功能與操作順序。
- code: T04
  name: 細菌作為基因轉殖宿主優勢
  desc: 依據繁殖速率、培養成本與遺傳操作便利性，評估大腸桿菌用於生產重組蛋白的優點。
- code: T05
  name: 基因轉殖生物表現與遺傳特性
  desc: 判斷轉殖基因在生物體內的蛋白質表現能力，及其是否能穩定遺傳或構成新物種。
- code: T06
  name: 基因改造食品標示與安全評估
  desc: 釐清基因改造食品的製備原理、法規標示義務與常見安全疑慮迷思。
- code: T07
  name: 遺傳訊息通用性與基因轉殖原理
  desc: 說明不同物種間遺傳密碼通用性如何使外源基因在宿主細胞內表現特定蛋白質。
- code: T08
  name: 重組DNA工具酵素與載體選擇
  desc: 判別限制酶切割、DNA連接酶接合以及細菌質體或病毒作為基因載體的選用原則。
- code: T09
  name: 農桿菌Ti質體與植物基因轉殖
  desc: 分析農桿菌利用Ti質體與T-DNA將外源基因送入植物細胞核並避免腫瘤化的轉殖設計。
- code: T10
  name: mRNA疫苗與核酸療法製備應用
  desc: 判讀mRNA或自我擴增RNA疫苗的載體包覆、細胞轉譯機制及相較於DNA療法的優缺點。
- code: T11
  name: 基因轉殖生物應用與生態安全評估
  desc: 判別基因轉殖動植物的實務應用案例，並評估基改生物對原生物種與自然生態的潛在影響。
