unit:
  subject: 生物
  code: BI-S1-4-1
  title: DNA的複製
status: draft
types:
- code: T01
  name: 半保留複製離心分層與比例推算
  desc: 判讀15N/14N轉換培養後的離心條帶位置，計算第n代中重股與雜合DNA分子的比例。
- code: T02
  name: DNA複製方向與岡崎片段
  desc: 說明DNA聚合酶5'→3'聚合限制如何導致延遲股產生岡崎片段，並需DNA連接酶接合。
- code: T03
  name: DNA複製與修復酵素功能配對
  desc: 區分解旋酶、引子酶、DNA聚合酶、核酸分解酶與連接酶在複製及修復中的角色。
- code: T04
  name: PCR與細胞內DNA複製比較
  desc: 比較高溫變性與解旋酶解旋、耐熱聚合酶與延遲股岡崎片段有無等體內外複製差異。
- code: T05
  name: 端粒縮短、端粒酶與細胞衰老實驗
  desc: 判讀RNA引子移除造成的末端複製問題，及端粒酶抑癌藥物活性隨天數變化的實驗圖表。
