unit:
  subject: 生物
  code: BI-S4-3-1
  title: 生物多樣性
status: draft
types:
- code: T01
  name: 群集豐富度、均勻度與多樣性比較
  desc: 依據不同群集的物種數與個體分布圖表，比較物種豐富度、均勻度與物種多樣性高低。
- code: T02
  name: 遺傳多樣性流失與天擇漂變影響
  desc: 分析盜獵壓力、瓶頸效應、基因重組或近親繁殖如何改變族群基因池與遺傳多樣性。
- code: T03
  name: 生物多樣性三層次定義與實例
  desc: 區分遺傳、物種與生態系多樣性的定義，並從自然或人類育種實例中辨識對應層次。
- code: T04
  name: 多樣性價值與生態穩定度分析
  desc: 分析生物多樣性在醫藥資源、農作防蟲及功能群互補上對生態系抵抗力與恢復力的影響。
- code: T05
  name: 隨機取樣同種機率與多樣性推論
  desc: 依據島嶼族群數與總數量圖表，比較物種多樣性高低及隨機取樣取得同種個體的機率。
