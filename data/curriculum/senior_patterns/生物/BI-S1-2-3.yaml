unit:
  subject: 生物
  code: BI-S1-2-3
  title: 能量的來源、流轉與使用
status: draft
types:
- code: T01
  name: 生態系能量單向流轉與階層計算
  desc: 依據同化量與呼吸散失計算營養階層間的能量傳遞比例，說明能量單向流動不循環的特性。
- code: T02
  name: 自營與化學自營菌培養基實驗判讀
  desc: 依據無光有氧及不含碳源培養基的生長結果，區分化學自營菌、光合自營菌與異營菌。
- code: T03
  name: ATP水解、磷酸化與能量變化圖
  desc: 判讀ATP水解為ADP+Pi的自由能變化曲線，及ATP磷酸化運動蛋白改變構形的耦聯機制。
- code: T04
  name: ATP/ADP循環與代謝調控
  desc: 依據細胞內ATP/ADP比值高低，推論同化合成與異化分解代謝路徑的促進或抑制方向。
- code: T05
  name: 細胞內高能物質與電子載體比較
  desc: 比較葡萄糖、丙酮酸、NADH與FADH2等代謝中間產物的相對化學能高低。
- code: T06
  name: ATP構造、耦合反應與能量通貨
  desc: 依據ATP高能磷酸鍵的水解與合成，判別細胞內吸能反應與放能反應的能量耦合關係。
- code: T07
  name: 膜上磷酸化與跨膜質子梯度
  desc: 比較光合作用類囊體膜與呼吸作用粒線體內膜上ATP合成機制，區分發生於膜上或基質的產能過程。
- code: T08
  name: 光合與呼吸代謝路徑整合圖
  desc: 判讀整合光合作用、呼吸作用與發酵作用的代謝路徑簡圖，辨識各步驟酵素場所、輔酶與生物類群。
- code: T09
  name: 生物能量轉換率與能階計算
  desc: 依據葡萄糖鍵能、ATP能量當量與有氧／無氧ATP產量，計算細胞能量轉換效率或推論對生態能階的限制。
- code: T10
  name: 自營與異營生物能源擷取方式
  desc: 區分光合自營、化學自營與異營生物擷取外界能源並轉化為化學能的代謝策略。
- code: T11
  name: 自營生物類型與化學合成作用
  desc: 區分光合自營與化學自營生物的能量來源與碳固定方式，並辨識非自營植物的例外。
- code: T12
  name: ATP能量流轉與細胞耗能活動
  desc: 追蹤ATP與ADP在異化放能與同化耗能反應間的循環偶聯，判斷囊泡運輸等直接耗能活動。
- code: T13
  name: 化學滲透假說與質子梯度實驗驗證
  desc: 依據類囊體照光pH值變化與暗中酸鹼梯度實驗，推論跨膜質子濃度差驅動ATP合成的原理。
- code: T14
  name: ATP與ADP比值及代謝調控
  desc: 依據細胞內ATP與ADP比例變化，推論細胞進行同化合成或異化呼吸作用的調節趨勢。
- code: T15
  name: 非典型產能與生熱散熱能量流轉
  desc: 分析如棕色脂肪生熱素將質子梯度轉化為熱能而非ATP等特殊能量轉換生理機制。
- code: T16
  name: 光合作用光反應與碳反應圖解
  desc: 依光合作用流程圖判讀水光解產物、ATP與NADPH合成場所（類囊體／基質）及二氧化碳固定反應。
- code: T17
  name: ATP分子結構與高能磷酸鍵特性
  desc: 辨識ATP的核苷酸本質、高能磷酸鍵數目、合成反應（ADP+Pi→ATP）及跨物種結構共通性。
