unit:
  subject: 生物
  code: BI-S4-1-3
  title: 現代演化理論的發展
status: draft
types:
- code: T01
  name: 現代綜合論核心主張與演化單位
  desc: 辨識演化單位為族群（非個體）、突變提供變異原料而天擇篩選方向等現代綜合論核心主張。
- code: T02
  name: 族群基因頻率變動與非天擇演化
  desc: 連結哈溫定律判定族群是否正在演化，並辨識沒有天擇參與時族群仍可透過漂變等機制演化。
- code: T03
  name: 遺傳學理論對演化論的補足判別
  desc: 對應孟德爾法則、染色體學說、摩根果蠅實驗與DNA雙股模型等發現如何補足天擇說的遺傳機制。
- code: T04
  name: 中性突變定義與天擇壓力判別
  desc: 判斷基因變異是否影響生物存活與生殖適應力，並依飲食或生態環境有無天擇壓力辨識中性突變。
- code: T05
  name: 中性突變的遺傳漂變篩選機制
  desc: 辨識木村資生中性理論中由隨機遺傳漂變、瓶頸效應與創始者效應篩選中性突變的演化動力。
- code: T06
  name: 中性演化分子層次與速率特徵
  desc: 判別中性演化著重分子層次、中性突變佔多數且具恆定速率累積並推動新種演化的理論特徵。
