unit:
  subject: 生物
  code: BI-S2-1-1
  title: 現今生物起源的主要假說
status: draft
types:
- code: T01
  name: 生源說與無生源說觀點辨析
  desc: 區分亞里斯多德、尼丹自然發生說與生源說對微生物或生命來源的核心主張與實驗立場。
- code: T02
  name: 巴斯德鵝頸瓶實驗設計與推論
  desc: 分析鵝頸瓶彎曲阻隔塵埃而允許空氣流通的設計原理，以及斷頸後出現微生物的實驗推論。
- code: T03
  name: 雷迪與斯巴蘭贊尼實驗變因分析
  desc: 判別紗布覆蓋、蠟封瓶口與煮沸時間長短實驗中的操縱變因、應變變因及對生命力假說的反駁。
- code: T04
  name: 生命起源科學史實驗分類
  desc: 歸納雷迪、雷文霍克、約伯勒、尼丹、斯巴蘭贊尼與巴斯德等學者對生源說的支持或反對立場。
- code: T05
  name: 開放空氣條件下優勢微生物推論
  desc: 推論無菌培養液暴露於空氣後，最先大量繁衍的微生物營養類型（異營微生物）與原因。
- code: T06
  name: 自然發生說與生源說論點辨析
  desc: 區分自然發生說與生源說的核心主張，並判別兩者能否解釋地球第一個生命的起源。
- code: T07
  name: 雷迪腐肉與早期微生物實驗
  desc: 依據雷迪、尼達姆與斯巴蘭贊尼的實驗對照設計與加熱密封變因，判斷實驗結果支持的學說。
- code: T08
  name: 生命起源學說綜合比較
  desc: 綜合比較各時期科學家對生命起源的實驗證據與假說限制，辨識支持或反駁特定論點的現象。
- code: T09
  name: 生源說與無生源說的論點比較
  desc: 區分生源說與無生源說對生命起源的解釋，並辨識不同歷史時期科學家的核心立場。
- code: T10
  name: 巴斯德鵝頸瓶實驗原理與變因延伸
  desc: 判讀鵝頸瓶滅菌與空氣接觸條件的操縱變因，或依耐熱菌株數據推論瓶內微生物來源。
- code: T11
  name: 生物起源學家與關鍵實驗成就配對
  desc: 綜合配對雷迪、巴斯德、米勒、謝克與瑪格麗斯在生命起源與演化研究上的代表性貢獻。
- code: T12
  name: 生源說與無生源說演進
  desc: 比較不同時期科學家對生命起源的觀點，判別生源說與非生源說的理論差異。
- code: T13
  name: 巴斯德鵝頸瓶實驗推論
  desc: 分析鵝頸瓶彎曲設計與切斷瓶口後的結果，推論空氣中微生物的來源與生長先後。
- code: T14
  name: 尼丹與斯巴蘭贊尼實驗對比
  desc: 比較肉汁加熱時間與封口方式的實驗變因，判別加熱消毒與實驗推論的正誤。
