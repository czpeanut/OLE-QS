unit:
  subject: 生物
  code: BI-S1-2-1
  title: 細胞的代謝作用
status: draft
types:
- code: T01
  name: 同化與異化代謝及能量判別
  desc: 依據分子合成或分解及吸放能特徵，區分生理過程屬於同化或異化代謝。
- code: T02
  name: 活化能與反應能量圖譜判讀
  desc: 依據有無酵素參與的反應能量曲線，判讀正逆反應活化能、反應熱及吸放能性質。
- code: T03
  name: 酵素化學本質與催化特性
  desc: 判別酵素的蛋白質本質、降低活化能而不改變反應平衡的特性及重複催化功能。
- code: T04
  name: 酵素專一性與受質結合機制
  desc: 運用鎖鑰或誘導契合模型及鍵結構造差異，辨識酵素—受質複合體與專一性機制。
- code: T05
  name: 基因剔除推論酵素功能區
  desc: 依據酵素各功能區段剔除後的活性實驗數據，推論關鍵催化部位或調控區域。
- code: T06
  name: 輔因子與輔酶成分及功能
  desc: 區分無機金屬離子輔因子與有機小分子輔酶（如維生素B群）的成分及輔助催化機制。
- code: T07
  name: 競爭與非競爭性抑制劑分析
  desc: 區分競爭性與非競爭性抑制劑的結合位置與機制，並判斷提高受質濃度能否克服抑制。
- code: T08
  name: 重金屬不可逆抑制酵素機制
  desc: 說明重金屬離子與酵素結合並破壞立體構形，導致酵素活性不可逆喪失的作用機制。
- code: T09
  name: 溫度與pH對酵素活性曲線
  desc: 從反應速率或產物累積曲線判讀酵素最適溫度與pH值，並區分高溫酸鹼變性機制。
- code: T10
  name: 酵素動力學與受質飽和曲線
  desc: 分析受質、產物濃度隨時間變化及反應速率飽和曲線，推論限制因子與添加物影響。
- code: T11
  name: 酵素多試管對照實驗設計
  desc: 判讀多組試管在不同處理條件與時間後的呈色結果，推論實驗組與對照組設計目的。
- code: T12
  name: 過氧化氫酶與生活酵素實驗
  desc: 分析溫度、酸鹼度與重金屬對過氧化氫酶氣泡產量及生活酵素應用的實驗結果。
