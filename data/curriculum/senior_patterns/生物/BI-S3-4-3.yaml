unit:
  subject: 生物
  code: BI-S3-4-3
  title: 免疫系統
status: draft
types:
- code: T01
  name: 初次與再次免疫反應及免疫記憶
  desc: 比較記憶細胞在第二次接觸相同病原體時，引發免疫反應的潛伏期長短與抗體產生強度。
- code: T02
  name: 淋巴器官分級與免疫細胞起源
  desc: 區分初級與次級淋巴器官的功能，及骨髓幹細胞分化為各類白血球與淋巴球的來源與成熟處。
- code: T03
  name: 先天性防禦屏障與發炎反應
  desc: 辨識皮膜屏障、溶菌酶、補體、干擾素、發炎反應組織胺及各類白血球吞噬作用的機制。
- code: T04
  name: 抗原呈現與體液細胞免疫比較
  desc: 比較抗原呈現細胞活化輔助性T細胞、B細胞抗體免疫與胞毒T細胞免疫的作用對象與機制。
- code: T05
  name: 抗體結構功能與次級免疫曲線
  desc: 辨識抗體蛋白構造與中和調理功能，判讀初次與次級免疫反應抗體濃度曲線及疫苗原理。
- code: T06
  name: 主動與被動免疫及疫苗類型
  desc: 區分主動免疫與被動免疫的獲得方式與時效，及減毒、次單元、mRNA與腺病毒疫苗類型。
- code: T07
  name: 過敏反應與免疫系統失調疾病
  desc: 解析過敏原引發肥大細胞釋放組織胺的過程，並區分自體免疫疾病與先天後天免疫缺失。
- code: T08
  name: 初次與再次免疫反應及疫苗原理
  desc: 比較疫苗（如mRNA疫苗）誘導的免疫記憶、施打方式與再次接觸抗原時的抗體濃度變化曲線。
- code: T09
  name: ABO血型抗原抗體與凝集判別
  desc: 依據紅血球表面抗原與血清抗體的凝集反應結果，判斷個體ABO血型並推論親子血型遺傳關係。
