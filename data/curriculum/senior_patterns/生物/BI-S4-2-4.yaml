unit:
  subject: 生物
  code: BI-S4-2-4
  title: 生態系
status: draft
types:
- code: T01
  name: 生態系營養階層與生產者辨識
  desc: 在複雜共生或特殊食性關係中辨識自營生產者、消費者與分解者角色，及腐生植物屬性。
- code: T02
  name: 食物鏈能量流轉與生態塔圖表判讀
  desc: 依據物種數量與生物量數據繪製或判讀生物量塔，並說明能量單向流動與逐級遞減原則。
- code: T03
  name: 氮循環步驟與微生物角色配對
  desc: 依氨化、亞硝化、硝化、固氮與脫氮反應流程圖或水族箱實例，配對含氮化合物與細菌角色。
- code: T04
  name: 生態系角色與食物網穩定
  desc: 辨識生產者、各級消費者與分解者，並依食物網複雜度比較不同生態系抵抗環境變動的穩定性。
- code: T05
  name: 生態金字塔與能量單向流轉計算
  desc: 依能量塔或數量塔圖示判斷營養階層、消費者級數（如樹木—毛蟲倒金字塔），並分析能量單向流轉與熱散失原則。
- code: T06
  name: 碳氧循環與封閉生態球平衡分析
  desc: 依碳氫氧循環圖或密閉生態球組成（陽光、微藻、消費者、分解者），判別光合作用與呼吸作用的物質及能量平衡條件。
- code: T07
  name: 氮循環微生物作用與植物吸收形式
  desc: 依氮循環模式圖辨識固氮、硝化與脫氮細菌的需氧條件及角色，並判斷植物可直接吸收的無機氮形式（NH4+、NO3-）。
