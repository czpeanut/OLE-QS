unit:
  subject: 生物
  code: BI-S2-4-1
  title: 植物的生殖
status: draft
types:
- code: T01
  name: 裸子植物與被子植物生殖比較
  desc: 比較松樹與蘭花等裸子與被子植物在花粉管、雙重受精、胚乳來源與受精耗時上的差異。
- code: T02
  name: 植物生活史世代交替圖示判讀
  desc: 依據植物世代交替簡圖中的代號，判別減數分裂、遺傳重組時期與配子體構造名稱。
- code: T03
  name: 植物生活史世代交替與分類特徵
  desc: 配對孢子體、孢子、配子體與配子的染色體倍數與分裂方式，並區分蘚苔、蕨類、裸子與被子植物。
- code: T04
  name: 雌雄配子體發育與減數分裂計數
  desc: 依據大／小孢子母細胞減數分裂與有絲分裂次數，推算花粉粒、胚囊細胞數與種子所需母細胞數。
- code: T05
  name: 雙重受精與種子果實倍數推算
  desc: 依據精核與卵、極核結合及母體珠被、子房壁來源，推算胚、胚乳、種皮與果皮的基因型與倍數。
- code: T06
  name: 花果種子構造辨識與傳播適應
  desc: 由花、胚珠或果實切面圖辨識構造名稱，並依據花朵或果實形態推斷授粉媒介與傳播方式。
- code: T07
  name: 植物無性生殖與組織培養應用
  desc: 比較營養繁殖、無融合生殖與組織培養的細胞選擇、染色體倍數維持及操作流程。
- code: T08
  name: 植物世代交替與有性／無性世代
  desc: 依據植物生活史模式圖判別孢子體（2n）與配子體（1n）世代交替、減數分裂與受精作用的發生位置。
- code: T09
  name: 花器構造與傳粉媒介適應特徵
  desc: 辨識完全花、單性花與胚珠花藥構造，並依據花瓣、花絲、花粉與柱頭特徵判別風媒花與蟲媒花。
- code: T10
  name: 大小孢子與雌雄配子體發育
  desc: 追蹤大、小孢子母細胞經減數分裂與有絲分裂形成八核七細胞胚囊與成熟花粉粒的核數與次數。
- code: T11
  name: 雙重受精與各構造染色體套數
  desc: 依據精細胞與卵細胞、極核結合的雙重受精機制，推算胚、胚乳（3n）、種皮與果皮的染色體數與基因型。
- code: T12
  name: 果實分類與演化特徵比較
  desc: 區分真果、假果、聚合果與多花果的發育來源，並比較被子植物、裸子植物與蕨類生殖器官演化差異。
- code: T13
  name: 雙重受精與各構造基因型推算
  desc: 依親代雌雄花基因型，推算花粉營養核、精細胞、卵、胚、胚乳及果皮種皮的基因型與套數。
- code: T14
  name: 被子植物生活史與世代交替時期
  desc: 辨識開花植物生活史中的孢子體、配子體、減數分裂與受精時期，並判斷遺傳變異發生點。
- code: T15
  name: 花朵構造辨識與授粉媒介特徵
  desc: 依據花萼、花瓣、雄蕊、雌蕊與胚珠構造判斷植物分類，或區分風媒花與蟲媒花的特徵。
- code: T16
  name: 大小孢子形成與配子體發育過程
  desc: 追蹤花粉粒與胚囊的形成過程，區分何時進行減數分裂與有絲分裂及各細胞核的來源。
- code: T17
  name: 雙重受精與多倍體構造套數推算
  desc: 依據雙重受精原理，推算不同染色體套數親本雜交後的胚、胚乳、種皮與果皮染色體套數。
- code: T18
  name: 胚珠發育與果實種子類型分類
  desc: 對應子房、子房壁、胚珠與珠被發育後的果實構造，並分類單果、聚合果、多花果與乾肉果。
