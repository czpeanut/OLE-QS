unit:
  subject: 生物
  code: BI-S4-1-2
  title: 族群遺傳
status: draft
types:
- code: T01
  name: 哈溫平衡理想族群條件判別
  desc: 判斷維持族群基因頻率不變所需的五大理想條件（無限大、隨機交配、無突變、無遷徙、無天擇）。
- code: T02
  name: 哈溫平衡狀態檢驗與平衡判定
  desc: 檢驗族群各基因型實測比例是否符合p²:2pq:q²或複等位、性聯遺傳的哈溫平衡預期。
- code: T03
  name: 隱性表型反推等位與帶因頻率
  desc: 由隱性同型合子或顯性表型比例開根號求q與p，進而計算帶因者人數或子代基因型頻率。
- code: T04
  name: 基因型計數推算基因池頻率
  desc: 直接加總族群各基因型個體所含的顯隱性等位基因數，計算基因池中的等位基因頻率與子代期望值。
- code: T05
  name: 複等位基因ABO血型頻率推算
  desc: 運用(p+q+r)²=1展開式，由血型表現型或等位基因頻率推算特定血型比例或等位基因頻率。
- code: T06
  name: 家族譜系與天擇篩選頻率推算
  desc: 由譜系圖計數顯隱性等位基因數目，並結合天擇存活率或選擇率計算世代篩選後的基因頻率。
- code: T07
  name: 創始者效應與瓶頸效應區分
  desc: 依據族群數量驟減或少數個體遷徙隔離的情境圖示，判別創始者效應、瓶頸效應及對遺傳多樣性的影響。
- code: T08
  name: 遺傳漂變特性與小族群效應分析
  desc: 判斷族群大小對隨機遺傳漂變發生機率的影響，以及其造成特定等位基因固定或消失的結果。
