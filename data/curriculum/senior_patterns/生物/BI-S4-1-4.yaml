unit:
  subject: 生物
  code: BI-S4-1-4
  title: 物種的形成
status: draft
types:
- code: T01
  name: 異域種化與地理隔離機制分析
  desc: 依據地理屏障（如峽谷、山脈）阻斷基因交流與物種移動能力差異，推論異域種化的發生與否。
- code: T02
  name: 同域種化與多倍體／生殖隔離成因
  desc: 辨識同一棲地內因多倍體生成、棲位分化或行為差異導致生殖隔離進而形成新種的過程。
- code: T03
  name: 生殖隔離類型與前後合子屏障
  desc: 區分棲地、時間、行為、機械與配子隔離等合子前屏障，及雜種不活或不孕等合子後屏障。
- code: T04
  name: 生物物種概念與分類界定難題
  desc: 評估自然交配產生可育後代標準在無性生殖生物、化石或親緣分類上的適用性。
- code: T05
  name: 種化必要條件與基因交流效應
  desc: 判別生殖隔離為種化必要條件，並推論基因交流增減或地理阻隔消失對新種形成的影響。
