unit:
  subject: 生物
  code: BI-S1-4-4
  title: 遺傳變異
status: draft
types:
- code: T01
  name: 誘變劑對DNA損傷與修補機制
  desc: 辨識紫外線形成T-T二聚體、亞硝酸鹽、病毒鑲嵌與DNA修補酵素異常等突變誘因。
- code: T02
  name: 染色體結構變異與連鎖性狀推論
  desc: 判斷染色體缺失、重複、倒位與易位對基因劑量、性狀表現或重組互補測試的影響。
- code: T03
  name: 染色體數目變異與無分離分析
  desc: 判斷多倍體耐受性、秋水仙素作用與核型分析，並由配子或子代基因型反推減數分裂無分離時期。
- code: T04
  name: 基因突變與抑癌基因致癌關聯
  desc: 說明原致癌基因與抑癌基因多重突變累積導致細胞週期失控而癌化的過程。
- code: T05
  name: 點突變類型與密碼子序列推演
  desc: 依據DNA模板股鹼基取代、插入或缺失及密碼子表，推演mRNA序列並分類同義、錯義、無義或框移突變。
- code: T06
  name: DNA鹼基衰變與複製序列推演
  desc: 追蹤胞嘧啶去胺基衰變成尿嘧啶後的DNA序列變化，並依鹼基互補原則推算複製後的新DNA股序列。
- code: T07
  name: 點突變遺傳疾病與分子病理分析
  desc: 結合鐮形血球貧血症或賀勒氏症等單基因疾病，推論點突變對胺基酸、mRNA、tRNA與隱性遺傳表型的影響。
- code: T08
  name: 基因突變基本特性與層次判別
  desc: 判別基因突變的隨機性、方向性、隱性居多與演化意義，並區分分子層次與染色體層次變異。
- code: T09
  name: 遺傳疾病成因與遺傳諮詢判別
  desc: 區分單基因突變或染色體異常所致先天性遺傳疾病與自體免疫或傳染性疾病，並判斷適用遺傳諮詢的疾病。
