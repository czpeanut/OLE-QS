unit:
  subject: 生物
  code: BI-S4-2-5
  title: 多樣的生態系
status: draft
types:
- code: T01
  name: 溫度與雨量分布圖判讀陸域生態系
  desc: 依據年均溫與年雨量分布圖區分凍原、針葉林、草原、沙漠與熱帶雨林的氣候與植物特徵。
- code: T02
  name: 臺灣海拔分帶與代表性生物
  desc: 依臺灣低海拔至高山的溫度與地形梯度，對應紅檜、臺灣山椒魚、玉山箭竹或酒紅朱雀等生物。
- code: T03
  name: 海洋潮間帶環境特徵與生物適應
  desc: 依每日漲退潮週期特徵辨識潮間帶生物種類，以及抵抗海浪衝擊與乾燥的構造適應。
- code: T04
  name: 深海熱泉化學自營生態系與限制
  desc: 分析無光高溫深海熱泉中硫化菌的化學自營角色、管蟲共生、外來氧氣來源與熱泉壽命限制。
- code: T05
  name: 河口沼澤與紅樹林生態系特徵
  desc: 辨識河口、紅樹林與沼澤的鹽度耐受、呼吸根、碎屑食物鏈及物種少而數量大的特徵。
- code: T06
  name: 海洋生態系分區與基礎生產力
  desc: 比較潮間帶、珊瑚礁、大洋透光區與深海無光區的環境特徵及基礎生產量高低。
- code: T07
  name: 生物群系與微生物群系閱讀分析
  desc: 依據生物群系與人體微生物群系科學閱讀文本，判讀棲地特徵、取樣部位與生理關聯。
- code: T08
  name: 溪流與湖泊分層及生物適應分析
  desc: 比較溪流上中下游溶氧與急流附著適應，及湖泊分層、營養鹽與季節性藻類消長。
