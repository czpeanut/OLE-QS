unit:
  subject: 生物
  code: BI-S1-3-2
  title: 攜帶遺傳訊息的分子
status: draft
types:
- code: T01
  name: 格里夫茲肺炎鏈球菌轉形實驗
  desc: 判讀S型與R型肺炎鏈球菌混合注射小鼠的存活結果，推論死菌遺傳物質使活菌轉形。
- code: T02
  name: 艾佛瑞去活化酵素確認轉形物質
  desc: 分析蛋白酶、RNA酶與DNA酶處理S型菌萃取液後對R型菌轉形的影響，證明DNA為遺傳物質。
- code: T03
  name: 赫希與蔡斯噬菌體同位素實驗
  desc: 追蹤35S與32P標記噬菌體感染大腸桿菌後的上清液與沉澱物放射性分布，確立DNA為遺傳物質。
- code: T04
  name: 重組病毒感染實驗與後代組成推論
  desc: 依據蛋白外殼與核酸來自不同噬菌體或病毒株的組裝體，推論子代病毒的性狀由核酸決定。
- code: T05
  name: 遺傳物質發現科學史貢獻配對
  desc: 統整弗萊明、格里夫茲、艾佛瑞、摩根與赫希蔡斯在染色體與DNA研究上的里程碑。
- code: T06
  name: 格里夫茲與艾佛瑞肺炎雙球菌轉形
  desc: 闡明R型與S型菌株轉形實驗的現象、艾佛瑞對轉形物質為DNA的驗證與歷史時序。
- code: T07
  name: 赫希與蔡斯噬菌體同位素標記實驗
  desc: 追蹤32P標記DNA與35S標記蛋白質在攪拌離心後的上清液、沉澱物與子代分布。
- code: T08
  name: 核外遺傳與粒線體DNA母系鑑定
  desc: 運用粒線體環狀DNA僅經卵細胞傳遞的特性，追蹤親緣關係與個體細胞間的DNA一致性。
