unit:
  subject: 生物
  code: BI-1-2-2
  title: 遺傳物質
status: draft
types:
- code: T01
  name: DNA雙股構造與鹼基配對
  desc: 依據華生與克里克模型判別DNA的五碳糖、磷酸骨架與反向平行雙股互補構造。
- code: T02
  name: DNA與RNA成分結構比較
  desc: 依據五碳醣、含氮鹼基種類、單雙股構造與存在位置，比較DNA與RNA的分子差異。
- code: T03
  name: 鹼基比例與氫鍵數目計算
  desc: 運用查加夫法則與互補配對原則，由單股或雙股已知鹼基比例推算互補股比例與氫鍵數。
- code: T04
  name: 基因、DNA與染色體層級
  desc: 釐清核苷酸、基因、DNA分子與染色體在尺度大小與數量上的包含關係。
- code: T05
  name: 半保留複製與同位素追蹤
  desc: 運用半保留複製原則與氮同位素標記離心實驗，推算經過多代分裂後各型態DNA比例。
- code: T06
  name: 轉錄作用機制與序列推導
  desc: 闡明DNA轉錄為RNA的模板股方向、酵素與核糖核苷酸原料，並由模板股推導mRNA序列。
- code: T07
  name: 轉譯密碼子表與數量換算
  desc: 運用遺傳密碼表將mRNA序列翻譯為胺基酸序列，並換算核苷酸、密碼子與胺基酸數量。
- code: T08
  name: 中心法則複製轉錄轉譯比較
  desc: 比較DNA複製、轉錄與轉譯的模板、原料、場所、方向與酵素差異。
- code: T09
  name: 基因表現分化與一基因一酶
  desc: 闡明基因與多肽的對應、細胞分化時基因選擇性表現，以及酵素突變對代謝途徑的影響。
- code: T10
  name: DNA粗萃取原理與親緣鑑定
  desc: 辨識細胞溶解、去蛋白與冰酒精析出等DNA粗萃取試劑原理，或運用DNA進行親緣鑑定。
- code: T11
  name: 端粒老化與癌化機制分析
  desc: 依據短文或實驗數據分析端粒序列複製縮短、端粒酶活性與細胞老化或癌化的關係。
- code: T12
  name: 遺傳物質驗證與非典型病原
  desc: 依據噬菌體重組感染、反轉錄病毒複製或普恩蛋白機制，判斷遺傳訊息載體與增殖差異。
