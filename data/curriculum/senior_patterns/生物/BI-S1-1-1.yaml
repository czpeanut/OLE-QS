unit:
  subject: 生物
  code: BI-S1-1-1
  title: 細胞的分子組成
status: draft
types:
- code: T01
  name: 水分子特性與生物調節功能
  desc: 依據水分子的極性、氫鍵、高比熱與內聚力，解釋水在細胞代謝、恆溫與運輸的功能。
- code: T02
  name: 無機鹽與礦物質生理功能
  desc: 對應鐵、鈣、鉀、鈉、鎂等礦物質離子在血紅素、葉綠素、神經傳導與凝血中的角色。
- code: T03
  name: 維生素種類與調節缺乏症
  desc: 區分脂溶性與水溶性維生素的體內累積特性，及對應的輔酶或凝血、視覺調節功能。
- code: T04
  name: 脫水合成與水解計量換算
  desc: 依據單體聚合形成雙醣、多肽、脂質或核酸的鍵結數目，計算脫去的水分子數。
- code: T05
  name: 生物大分子組成元素辨識
  desc: 依據分子式元素組成（C、H、O、N、P、S）與結構圖，辨識細胞內四大類有機分子。
- code: T06
  name: 生物大分子單體與聚合物
  desc: 配對醣類、蛋白質、脂質與核酸的單體結構、聚合性質及在細胞內的功能歸類。
- code: T07
  name: 四大生物分子組成綜合比較
  desc: 綜合比較單醣種類、脂肪酸飽和度、胺基酸序列差異及DNA與RNA核苷酸組成。
- code: T08
  name: 醣類分類與構造功能判別
  desc: 區分單醣、雙醣與多醣（澱粉、肝糖、纖維素、幾丁質）的組成單元、鍵結與運輸儲存角色。
- code: T09
  name: 脂質結構、飽和度與計量
  desc: 依據飽和與不飽和脂肪酸、三酸甘油酯、磷脂質與固醇結構，推算分子式或膜流體性。
- code: T10
  name: 胺基酸與蛋白質結構層次
  desc: 依據胺基酸官能基、肽鍵與一至四級結構摺疊，判別蛋白質跨膜特性與多樣性成因。
- code: T11
  name: 核酸、核苷酸與ATP構造
  desc: 比較核糖與去氧核糖碳號差異、含氮鹼基與磷酸基構造，區分DNA、RNA與ATP組成。
- code: T12
  name: 還原醣與生物分子顯色檢測
  desc: 運用碘液、本氏液與雙縮脲試劑的顯色反應與變因設計，鑑定澱粉、還原糖與蛋白質。
