unit:
  subject: 生物
  code: BI-S1-4-3
  title: 基因表現的調控
status: draft
types:
- code: T01
  name: 操縱組圖譜與構造功能對應
  desc: 依據原核操縱組模式圖，辨識啟動子、操作子、結構基因與抑制蛋白的空間位置與化學本質。
- code: T02
  name: 乳糖操縱組誘導與開關機制
  desc: 判斷環境中有無乳糖時抑制蛋白的構型與活性變化，推論操縱組開啟或關閉的轉錄狀態。
- code: T03
  name: 操縱組調控層次與分子組成
  desc: 區分原核操縱組所屬的轉錄調控層次，並辨識操作子、啟動子與調節蛋白的DNA或蛋白質組成。
- code: T04
  name: 操縱組調節基因突變效應推論
  desc: 分析調節蛋白喪失與乳糖或DNA結合能力後，對結構基因持續表現或無法代謝的生理影響。
- code: T05
  name: 乳糖操縱組正向調控實驗
  desc: 綜合環境中有無葡萄糖與乳糖的培養基條件，推論cAMP濃度與CAP蛋白對乳糖酶表現量的影響。
- code: T06
  name: 真核染色質與轉錄因子調控
  desc: 判斷DNA甲基化、組蛋白乙醯化及轉錄因子結合增強子對真核基因轉錄活性的調控機制。
- code: T07
  name: 轉錄後RNAi作用位置與靜默
  desc: 判讀小分子RNA在細胞質形成雙股RNA並降解mRNA的機制，區分其對DNA與轉譯的影響及應用。
