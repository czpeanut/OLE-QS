unit:
  subject: 生物
  code: BI-S1-1-2
  title: 細胞的構造與功能
status: draft
types:
- code: T01
  name: 細胞學說與顯微觀察測微
  desc: 判別細胞學說建立證據、各類顯微鏡適用情境，以及切換倍率後的測微器刻度換算。
- code: T02
  name: 原核真核與動植物細胞比較
  desc: 根據細胞壁、細胞核與胞器有無，比較原核細胞、動物、植物與真菌細胞的構造異同。
- code: T03
  name: 細胞膜模型演進與流體鑲嵌
  desc: 追溯膜模型演變與實驗證據，並辨識磷脂質雙層、膽固醇、醣蛋白與膜蛋白的機能。
- code: T04
  name: 跨膜運輸模式與動力判別
  desc: 依據分子極性、濃度梯度、膜蛋白參與及ATP消耗，區分簡單擴散、促進性擴散與主動運輸。
- code: T05
  name: 運輸速率曲線與抑制劑分析
  desc: 由濃度對運輸速率的線性或飽和曲線及ATP抑制劑效應，推論跨膜物質運輸機制。
- code: T06
  name: 滲透壓、質離與伸縮泡實驗
  desc: 依據環境張力與半透膜兩側滲透壓，判斷紅血球脹縮、植物質壁分離、U形管液面與伸縮泡調節。
- code: T07
  name: 胞吞胞吐與囊泡運輸調控
  desc: 依據受體媒介胞吞、吞噬、胞飲與鈣離子調控的分泌性胞吐，判斷大分子進出細胞方式。
- code: T08
  name: 內膜系統與分泌蛋白路徑
  desc: 追蹤核糖體、內質網、高基氏體與溶體間的膜轉換路徑，判別分泌蛋白合成修飾與去向。
- code: T09
  name: 胞器膜層構造與功能配對
  desc: 比較雙層膜、單層膜與非膜狀胞器的構造特徵、分布位置及對應的細胞生理機能。
- code: T10
  name: 溶體自噬與各類液泡比較
  desc: 分析溶體參與胞內消化與自噬清除受損胞器的機制，並比較中央液泡、食泡與伸縮泡功能。
- code: T11
  name: 細胞核、過氧化體與細胞壁
  desc: 闡明核膜核孔、核仁、過氧化體與初生次生細胞壁的微細構造與特定生理機能。
- code: T12
  name: 半自主胞器與內共生假說
  desc: 依據雙層膜、環狀DNA與原核型核糖體特徵，比較粒線體與葉綠體並驗證內共生假說。
- code: T13
  name: 細胞骨架構造與胞內運動
  desc: 區分微管、微絲與中間絲的組成蛋白與直徑，及其在胞器位移、原生質流與鞭毛運動的角色。
