unit:
  subject: 生物
  code: BI-S1-3-1
  title: 遺傳的染色體學說之驗證
status: draft
types:
- code: T01
  name: 染色體遺傳學說與摩根果蠅實驗
  desc: 說明薩登、包法利學說與摩根白眼果蠅雜交結果如何證實基因位於性染色體上。
- code: T02
  name: 性聯遺傳與致死基因後代比例推算
  desc: 處理XY或ZW型性染色體遺傳及胚胎致死基因，推算子代性別比與表現型比例。
- code: T03
  name: 基因連鎖與減數分裂互換率計算
  desc: 依據試交子代表現型比例或發生互換的生殖母細胞比例，計算配子基因型比例與互換率。
- code: T04
  name: 三點試交與染色體連鎖圖譜繪製
  desc: 利用親代型與雙互換型數目判別三基因排列順序，並以分摩根（cM）計算基因間相對距離。
- code: T05
  name: 試交結果反推基因染色體連鎖位置
  desc: 依據雙雜合子試交子代為1:1或1:1:1:1的結果，判斷基因位於同一或不同對染色體。
- code: T06
  name: 遺傳學史、模式生物與染色體學說
  desc: 辨識薩登、摩根與孟德爾的實驗貢獻，以及果蠅、阿拉伯芥等模式生物的選用優勢與套數。
- code: T07
  name: 基因連鎖群與性狀互換率計算
  desc: 依相距互換單位計算連鎖基因試交或異型合子交配的子代各表現型比例與基因位置。
- code: T08
  name: 多點互換率與基因排列順序
  desc: 運用多個基因兩兩間的互換率數值，推導基因在染色體上的線性排列順序與相對距離。
- code: T09
  name: 性聯連鎖遺傳與譜系圖基因型推論
  desc: 綜合分析X染色體上多基因連鎖或家族譜系圖，判斷體染色體/性染色體遺傳模式與子代機率。
- code: T10
  name: 突變性狀與環境變因實驗分析
  desc: 依果蠅互交、半顯性數據與溫度處理實驗，判斷遺傳模式、應變變因與酵素活性推論合理性。
