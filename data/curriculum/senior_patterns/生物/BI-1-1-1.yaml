unit:
  subject: 生物
  code: BI-1-1-1
  title: 細胞的構造
status: draft
types:
- code: T01
  name: 細胞分子組成與聚合物計算
  desc: 判別水、醣類、脂質、蛋白質與核酸的組成元素、單體聚合脫水計算或生物大分子功能。
- code: T02
  name: 細胞膜構造與物質運輸機制
  desc: 依據流體鑲嵌模型辨識磷脂雙層、膜蛋白與醣類分布及功能，或推算物質跨膜層數與運輸方式。
- code: T03
  name: 胞器構造、膜層數與功能配對
  desc: 比較雙層膜、單層膜與非膜狀胞器的構造特徵，或依據生理機能配對對應的胞器。
- code: T04
  name: 分泌蛋白與脂質胞內運輸路徑
  desc: 追蹤蛋白質或膜脂質由合成、修飾到囊泡分泌至細胞外的胞器先後順序，或判斷分泌細胞發達的胞器。
- code: T05
  name: 原核與真核細胞比較判別
  desc: 依據核膜、膜狀胞器、核糖體與細胞壁成分等特徵，區分原核生物與真核生物。
- code: T06
  name: 動植物細胞構造比較與特化
  desc: 比較動植物細胞壁、中央液泡、葉綠體與中心體的有無，或判別特化細胞的構造與功能。
- code: T07
  name: 胞器起源內共生與自噬更新
  desc: 依據粒線體與葉綠體的雙層膜及DNA特徵推論內共生學說，或分析溶體自噬作用與胞器汰換機制。
- code: T08
  name: 胞器構造與功能對應判別
  desc: 依據各胞器的形態特徵或生理功能，判別核糖體、內質網、高基氏體、粒線體等胞器名稱與作用。
- code: T09
  name: 胞器膜層數與化學成分分析
  desc: 依據雙層膜、單層膜與無膜胞器的分類，或磷脂、蛋白質、核酸與細胞壁成分推論對應構造。
- code: T10
  name: 細胞類型與構造有無比較
  desc: 比較原核細胞、植物細胞、動物細胞與真菌在細胞壁、膜狀胞器或特定構造上的有無差異。
- code: T11
  name: 胞器圖示辨識與跨界判讀
  desc: 由細胞或胞器示意圖辨識次微構造（如類囊體、核孔），並推論其所屬生物類群或動植物歸屬。
- code: T12
  name: 細胞訊息與胞器協同機制推論
  desc: 結合核孔運輸或內質網與粒線體的離子調控等生理機制，推論細胞代謝與應變結果。
- code: T13
  name: 原核與真核細胞構造比較
  desc: 依據有無核膜、膜狀胞器與細胞壁成分，判斷原核與真核細胞的構造差異。
- code: T14
  name: 動植物細胞形態與染色觀察
  desc: 比較動物與植物細胞的形狀、排列與細胞壁有無，並選擇適當的等張液與染劑觀察細胞核。
- code: T15
  name: 細胞分子組成與單體聚合物判別
  desc: 依元素組成、單體與聚合物關係或生物大分子功能，判別醣類、脂質、蛋白質與核酸的特性。
- code: T16
  name: 細胞膜流體鑲嵌模型與通透性
  desc: 辨識磷脂雙層、膜蛋白與醣蛋白分布，或推論物質進出細胞的滲透壓與通透機制。
- code: T17
  name: 內膜系統與分泌蛋白運輸路徑
  desc: 追蹤核糖體、內質網與高基氏體在蛋白質或脂質合成、修飾與分泌過程中的先後順序。
- code: T18
  name: 原核與真核細胞及特化構造比較
  desc: 依核膜、膜狀胞器、細胞壁與特化形態比較原核與真核或動植物細胞的構造差異。
- code: T19
  name: 胞器演化起源與水平基因轉移推論
  desc: 運用內共生學說或跨物種基因轉移案例，推論半自主胞器的增殖限制與演化機制。
