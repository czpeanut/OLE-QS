unit:
  subject: 生物
  code: BI-S3-2-2
  title: 消化系統
status: draft
types:
- code: T01
  name: 動物消化構造與食性適應
  desc: 比較胞內與胞外消化、囊狀與管狀消化道，及草食與肉食動物消化道長度與盲腸差異。
- code: T02
  name: 消化道分區、括約肌與蠕動
  desc: 辨識消化管各部位名稱、酸鹼環境、括約肌開閉狀態，以及蠕動與分節運動的功能。
- code: T03
  name: 消化腺分布與酵素受質配對
  desc: 區分唾液、胃液、胰液、膽汁與腸液的分泌部位、酸鹼中和成分與各類消化酶受質。
- code: T04
  name: 消化液分泌的神經內分泌調節
  desc: 分析自律神經與胃泌素、胰泌素、膽囊收縮素對胃液、胰液與膽汁分泌及排出的調控。
- code: T05
  name: 小腸絨毛吸收與跨膜運輸
  desc: 判別葡萄糖、胺基酸與脂肪酸等養分進出小腸絨毛上皮細胞的運輸方式與耗能情形。
- code: T06
  name: 消化模式與物理化學消化
  desc: 區分胞內與胞外消化、囊狀消化腔與管狀消化道，並辨識膽汁乳化及腸道蠕動等物理與化學消化方式。
- code: T07
  name: 消化道構造與酸鹼環境
  desc: 判別口腔、食道、胃、小腸與大腸間的括約肌位置、各段消化液分泌特性、酸鹼度及微生物棲息條件。
- code: T08
  name: 營養素消化進程圖表判讀
  desc: 根據醣類、蛋白質與脂質在消化道各段的消化曲線圖，辨識營養素種類、對應消化酵素及主要化學消化部位。
- code: T09
  name: 小腸絨毛吸收機制與運輸路徑
  desc: 依絨毛結構圖區分微血管與乳糜管運輸的水溶性／脂溶性養分，並判斷維生素等物質跨越絨毛上皮的方式。
- code: T10
  name: 消化作用的神經與內分泌調控
  desc: 區分副交感神經刺激與胃泌素、胰泌素、膽囊收縮素等胃腸激素的分泌部位及對消化腺體的促進／抑制作用。
