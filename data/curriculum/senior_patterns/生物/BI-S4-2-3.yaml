unit:
  subject: 生物
  code: BI-S4-2-3
  title: 群集
status: draft
types:
- code: T01
  name: 物種間交互作用類型辨識與舉例
  desc: 依互利共生、片利共生、寄生、捕食與競爭的定義，配對自然界生物間的互動組合。
- code: T02
  name: 群集擾動頻率與中度干擾假說圖表
  desc: 依據不同干擾頻率與物種豐富度關係圖，判讀維持最大物種多樣性或演替早期的擾動程度。
- code: T03
  name: 初級演替與次級演替過程比較
  desc: 依據演替起點土壤與生物殘留有無，區分初級演替與火災砍伐後的次級演替及巔峰群集特徵。
- code: T04
  name: 族群與群集層次特徵比較
  desc: 從物種組成數目、自給自足能力、動態平衡與食性關係等面向比較族群與群集的階層差異。
- code: T05
  name: 初級與次級演替曲線判讀
  desc: 依據棲地初始條件（裸岩或森林大火後）、演替方向性與優勢種數量／豐富度曲線圖判別演替類型與階段。
- code: T06
  name: 先驅群集與巔峰群集特徵比較
  desc: 比較演替各階段生物在適應惡劣環境能力、生物量、生活史長短、繁殖速度與抵抗干擾穩定度上的差異。
- code: T07
  name: 群集生物間交互作用與共生分析
  desc: 依據閱讀文本或案例分析多物種間的互利共生、寄生、片利共生、競爭或抗生素抑制等互動關係。
- code: T08
  name: 群集物種結構與優勢種判別
  desc: 依據族群數量、生物量或生態影響力，區分群集中的優勢種、關鍵種與外來入侵種。
- code: T09
  name: 群集空間結構與優勢種特徵
  desc: 辨識優勢種的生物量與生態影響力特徵，並分析森林垂直結構與水域水平結構的空間分層成因。
- code: T10
  name: 掠食與獵物波動圖及避難所
  desc: 依據避難所與遷入遷出條件判讀掠食者與獵物族群波動曲線或相圖，並評估不同棲地的庇護策略。
- code: T11
  name: 群集物種組成與優勢種判別
  desc: 區分群集中的優勢種、關鍵種、伴生種與特有種定義及生態角色。
