unit:
  subject: 生物
  code: BI-S3-4-2
  title: 內分泌系統
status: draft
types:
- code: T01
  name: 內分泌與外分泌腺判別及激素配對
  desc: 區分內分泌腺與兼營外分泌的器官（如肝臟、胰臟），並配對腺體、分泌激素與主要生理功能。
- code: T02
  name: 激素化學性質與細胞內作用機制
  desc: 依據水溶性肽類激素與脂溶性固醇類激素的受體位置（膜上／核內）差異，判讀轉錄轉譯機制或口服分解特性。
- code: T03
  name: 下視丘腦垂腺軸線調控
  desc: 依內分泌階層示意圖判讀釋素（GnRH等）、腦垂腺前後葉激素（FSH/LH/催產素等）與目標腺體的負回饋路徑。
- code: T04
  name: 授乳與生理正回饋內分泌機制
  desc: 結合母親授乳神經內分泌路徑圖，辨識吸吮刺激引發催產素／催乳素分泌與排乳的正回饋調控模式。
- code: T05
  name: 血糖恆定與壓力反應雙重調控分析
  desc: 依血糖調控模式圖或壓力反應路徑圖，區分胰島素／升糖素作用及腎上腺髓質（短期）與皮質（長期）的生理反應。
- code: T06
  name: 生理機制與激素間拮抗作用判別
  desc: 判斷不同激素或自律神經對同一生理指標（如血糖、唾液、心搏）是否具有作用方向相反的拮抗關係。
