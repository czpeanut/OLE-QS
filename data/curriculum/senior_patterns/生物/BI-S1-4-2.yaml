unit:
  subject: 生物
  code: BI-S1-4-2
  title: 基因的表現
status: draft
types:
- code: T01
  name: 核酸合成過程與位置綜合比較
  desc: 綜合比較DNA複製、轉錄與轉譯在真核細胞內的進行位置、模板、酵素與產物差異。
- code: T02
  name: 原核與真核細胞轉錄機制比較
  desc: 比較轉錄場所、啟動子識別、模板股選擇與mRNA是否需經修飾再送出核外。
- code: T03
  name: 真核mRNA修飾與差異剪輯
  desc: 追蹤5'端帽、poly-A尾添加與不同細胞剪除內含子/保留外顯子（alternative splicing）的結果。
- code: T04
  name: 核糖體位點與tRNA方向判讀
  desc: 判讀mRNA與tRNA反密碼子反向配對方向、核糖體A/P/E位點移動及密碼子數學組合數。
- code: T05
  name: DNA序列轉錄轉譯與點突變推論
  desc: 將DNA模板股轉錄為mRNA並對照密碼子表譯出胺基酸序列，判斷點突變對多肽鏈的影響。
- code: T06
  name: 轉譯後蛋白質修飾與內膜系統場所
  desc: 辨識內質網與高基氏體中進行的雙硫鍵形成、醣基化與金屬離子添加等轉譯後修飾。
- code: T07
  name: 一基因一多肽與代謝路徑推論
  desc: 依據營養缺陷型突變株在不同培養基的生長實驗結果，推論生化代謝路徑的酵素作用順序。
