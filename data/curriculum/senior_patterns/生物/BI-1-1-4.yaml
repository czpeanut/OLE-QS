unit:
  subject: 生物
  code: BI-1-1-4
  title: 細胞學說的發展歷程（他版獨立成節 1-1；對應雙版本第1章第4節補齊）
status: draft
types:
- code: T01
  name: 生命現象與生物組成層次
  desc: 依據代謝、生長、感應與生殖等特徵判別生命現象，或比較單細胞與多細胞生物的組成層次。
- code: T02
  name: 病毒屬性與生命現象判別
  desc: 分析病毒在宿主體內外的生命表現與檢測方式，並判別其是否符合生命現象定義。
- code: T03
  name: 科學探究步驟與邏輯排序
  desc: 依據觀察、提出問題、形成假說、設計實驗與歸納結論的科學方法流程進行排列與判別。
- code: T04
  name: 細胞學說發展與核心論點
  desc: 辨識虎克、雷文霍克、許萊登、許旺與魏修等科學家的貢獻，以及現今細胞學說的核心論點與例外。
- code: T05
  name: 細胞尺度單位換算比較
  desc: 使用微米與奈米等國際單位比較病毒、細菌、胞器與動植物細胞的相對尺度大小。
- code: T06
  name: 生物與分子尺度排序比較
  desc: 比較生物個體、細胞、胞器與生物大分子的相對尺度大小並進行順序排列。
- code: T07
  name: 顯微鏡構造與操作步驟
  desc: 判別複式顯微鏡各部位功能、玻片移動方向與高低倍物鏡切換的操作步驟。
- code: T08
  name: 顯微鏡成像方向與倍率換算
  desc: 判別複式與解剖顯微鏡的成像方向，並計算總放大倍率與視野細胞數目變化。
- code: T09
  name: 細胞染色與顯微觀察判讀
  desc: 判別口腔皮膜細胞、洋蔥表皮、保衛細胞或澱粉粒等觀察活動的染色劑選擇與鏡下特徵。
- code: T10
  name: 測微器構造與操作原理
  desc: 區分目鏡測微器與載物臺測微器的角色與刻度意義，判斷實際量測標本的工具。
- code: T11
  name: 測微器校正與細胞大小換算
  desc: 利用載物臺測微器與目鏡測微器的刻度重疊關係，校正每格長度並換算細胞實際大小。
- code: T12
  name: 切換倍率測微器刻度變化
  desc: 推算物鏡倍率改變後，目鏡測微器每小格代表長度與載物臺測微器成像格數的變化。
