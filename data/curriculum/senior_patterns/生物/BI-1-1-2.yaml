unit:
  subject: 生物
  code: BI-1-1-2
  title: 細胞及能量
status: draft
types:
- code: T01
  name: 同化與異化代謝判別及比較
  desc: 依據物質合成或分解及能量變化特徵，區分同化代謝與異化代謝或判別相關生理反應。
- code: T02
  name: ATP分子結構與能量貨幣轉換
  desc: 辨識ATP的腺苷與高能磷酸鍵構造，或依據ATP與ADP比值變化推論細胞合成與分解代謝趨勢。
- code: T03
  name: 光合作用光反應場所與產物
  desc: 判別類囊體膜上光合色素吸光、水分解產氧及ATP與NADPH生成的過程與實驗阻斷效應。
- code: T04
  name: 光合作用固碳反應與同位素追蹤
  desc: 分析葉綠體基質中二氧化碳固定生成醣類的機制，或運用同位素標記法追蹤氧與碳元素的去向。
- code: T05
  name: 環境因子與光合作用速率圖表
  desc: 依據光照強度、溫度、二氧化碳濃度或日夜變化曲線圖，判讀影響光合作用效率的限制因子。
- code: T06
  name: 光合作用發現史與經典實驗推論
  desc: 依據普利斯特里與希爾等科學家的實驗設計與現象，推論光合作用的反應物、產物或階段結論。
- code: T07
  name: 有氧呼吸與發酵作用路徑比較
  desc: 比較糖解作用、粒線體有氧呼吸與酒精或乳酸發酵的進行場所、氧氣需求、產物與產能差異。
- code: T08
  name: 細胞呼吸速率與呼吸商數分析
  desc: 依據耗氧量、二氧化碳釋放量實驗數據或呼吸商數，比較不同溫度或萌發狀態下的細胞呼吸速率。
- code: T09
  name: ATP結構與能量流轉判別
  desc: 依據ATP的分子組成與水解／合成方向，判別同化或異化代謝過程中能量的儲存與消耗。
- code: T10
  name: 光合作用兩階段反應比較
  desc: 區分光反應與固碳反應的發生位置、所需原料、產物及兩者間ATP與NADPH的耦合關係。
- code: T11
  name: 有氧呼吸與發酵作用比較
  desc: 比較有氧呼吸、乳酸發酵與酒精發酵的進行場所、產物與ATP產量差異。
- code: T12
  name: 環境因子與光合速率圖表判讀
  desc: 依據溫度或二氧化碳濃度對光合作用速率的影響曲線，推論酵素活性變化或植物適應環境。
- code: T13
  name: 運動代謝途徑比例曲線判讀
  desc: 由人體運動時間或距離與有氧／無氧呼吸比例關係圖，判讀不同運動階段的能量供給特徵。
- code: T14
  name: 同化與異化代謝及ATP轉換
  desc: 區分物質合成與分解的能量變化，或依ATP與ADP比值變化推論細胞代謝趨向。
- code: T15
  name: 光合作用光反應與固碳反應比較
  desc: 判別類囊體膜光反應與葉綠體基質固碳反應的場所、反應物、產物與檢驗指標。
- code: T16
  name: 環境因子對光合速率影響推論
  desc: 分析光照、溫度與二氧化碳濃度等環境因子變動對植物光合作用速率的限制效應。
- code: T17
  name: 細胞代謝圖表與實驗數據判讀
  desc: 依呼吸或光合作用路徑示意圖、時間變化曲線或毒物抑制數據，推論代謝步驟與作用胞器。
- code: T18
  name: 酵素特性與化學反應活化能
  desc: 辨識酵素的蛋白質本質、專一性與溫度酸鹼度對酵素活性的影響，及反應碰撞活化能條件。
