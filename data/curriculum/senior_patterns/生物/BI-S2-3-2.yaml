unit:
  subject: 生物
  code: BI-S2-3-2
  title: 光合作用
status: draft
types:
- code: T01
  name: 光合色素萃取層析與吸收光譜
  desc: 說明丙酮萃取與濾紙層析Rf值計算原理，並判讀葉綠素與類胡蘿蔔素的吸收及作用光譜。
- code: T02
  name: 葉綠體構造與色素光譜判讀
  desc: 對應類囊體與基質在光合作用中的分工，並判讀不同光合色素對各波長光線的吸收圖。
- code: T03
  name: 光反應場所、流程圖與電子流
  desc: 依據光反應模式圖辨識水光解產氧、電子傳遞方向及NADPH與ATP合成的關鍵位置。
- code: T04
  name: 光系統比較與電子傳遞阻斷
  desc: 比較PSI與PSII反應中心與電子來源，並分析強光或除草劑阻斷電子傳遞的連鎖影響。
- code: T05
  name: 光反應化學滲透與ATP合成
  desc: 判讀類囊體膜內外氫離子濃度梯度建立方向與ATP合酶位置，分析化學滲透合成機制。
- code: T06
  name: 希爾反應與DCPIP光反應實驗
  desc: 分析等張蔗糖懸浮液、遮光對照、DCPIP變色及pH梯度實驗，推論光反應必要條件。
- code: T07
  name: 卡爾文循環階段與酵素調控
  desc: 追蹤葉綠體基質中碳固定、還原與受體再生步驟，及光照、pH與鎂離子對Rubisco的調控。
- code: T08
  name: 光合作用同位素追蹤與物質流
  desc: 運用18O與14C同位素標記追蹤水分解與固碳產物來源，並分析光暗反應間的物質能量偶聯。
- code: T09
  name: C3、C4與CAM植物固碳比較
  desc: 比較C3、C4與CAM植物固碳時間、場所、酵素差異，並由日夜氣體交換曲線推論植物類型。
- code: T10
  name: 光補償點與光合速率曲線判讀
  desc: 分析光照強度、溫度與CO2濃度下的淨光合速率曲線，判讀光補償點與光飽和點意義。
- code: T11
  name: 環境因子與自營生物代謝調節
  desc: 分析日夜溫差、水分等環境因子對光合與生長量的影響，並比較光合與化學自營生物差異。
- code: T12
  name: 光傷害防護與斑葉光合效率
  desc: 分析植物合成抗UV色素抵抗強光自由基的機制，以及斑葉植物光合效率的實驗推論。
