unit:
  subject: 生物
  code: BI-S2-3-1
  title: 水和礦物質的吸收與運輸
status: draft
types:
- code: T01
  name: 質外體與共質體運輸路徑
  desc: 追蹤水分與礦物質經質外體、共質體及卡氏帶主動運輸進入木質部的路徑與流速差異。
- code: T02
  name: 根部滲透壓梯度與吸水方向
  desc: 比較根毛、皮層與中柱細胞的滲透壓大小，推論水分由土壤向木質部移動的動力方向。
- code: T03
  name: 無機鹽主動運輸與高鹽逆境
  desc: 判別根細胞主動運輸吸收礦物質的耗能需求，及高鹽滲透壓過高導致植物萎凋的機制。
- code: T04
  name: 菌根與根瘤共生固氮機制
  desc: 比較菌根真菌輔助吸收養分與根瘤菌共生固氮的生物類型、反應耗能與田間施肥數據。
- code: T05
  name: 內聚力－張力假說與導管運輸
  desc: 依據蒸散拉力、水分子氫鍵內聚力及導管壁附著力，解釋高大植物水分向上運輸機制。
- code: T06
  name: 導管與管胞輸水構造比較
  desc: 辨識導管穿孔板縱向運輸與壁孔橫向運輸的構造差異，並比較兩類輸水細胞的效率。
- code: T07
  name: 日夜水分運輸動力與流速曲線
  desc: 區分白天蒸散拉力與夜間根壓在木質部水分上升的角色，並判讀樹幹流速日變化曲線。
- code: T08
  name: 根壓、泌液現象與淹水凋萎
  desc: 判別高濕清晨根壓引發泌液的生理條件，並分析土壤淹水缺氧或過肥導致凋萎的成因。
- code: T09
  name: 植物水分運輸經典實驗判讀
  desc: 依據切斷莖部連接玻璃管液面上升等實驗現象，推論根壓與蒸散作用對水分移動的影響。
- code: T10
  name: 土壤離子濃度與根壓曲線分析
  desc: 判讀土壤離子濃度與根壓關係曲線，推論高滲透壓導致根壓先升後降的生理原因。
- code: T11
  name: 氣孔開閉調控與蒸散計實驗
  desc: 依據藍光、K+主動運輸、保衛細胞膨壓與ABA調控判別氣孔開閉，並分析蒸散計數據。
- code: T12
  name: 環境因子與蒸散作用速率
  desc: 比較溫度、溼度、風速、光照與土壤含水量對植物蒸散作用速率及耗能需求的影響。
