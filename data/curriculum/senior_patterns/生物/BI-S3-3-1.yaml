unit:
  subject: 生物
  code: BI-S3-3-1
  title: 呼吸系統
status: draft
types:
- code: T01
  name: 動物呼吸構造與人體呼吸道
  desc: 比較不同動物的氣體交換構造，與人體鼻腔、咽、喉、氣管纖毛及肺泡的構造特徵。
- code: T02
  name: 呼吸運動肌肉收縮與壓力變化
  desc: 分析橫膈肌與肋間肌收舒對胸腔體積、肺內壓力及氣體進出的因果關係。
- code: T03
  name: 氣體交換與二氧化碳運輸形式
  desc: 依據分壓梯度判斷肺泡與組織氣體擴散方向，及氧氣與二氧化碳在血液中的主要運輸形式。
- code: T04
  name: 氧合血紅素結合率與代謝推論
  desc: 依據血紅素氧結合率數據、氧分壓、二氧化碳濃度、溫度與pH值，推論組織代謝旺盛度。
- code: T05
  name: 呼吸中樞與化學受器調節
  desc: 辨識延腦呼吸中樞、大腦意識、肺泡伸張受器及中樞與周邊化學受器的偵測對象與調控。
- code: T06
  name: 人體呼吸道構造順序與解剖功能
  desc: 排列氣體進出肺部的呼吸道順序，並判別會厭軟骨、軟硬顎、氣管軟骨環與肺泡彈性纖維的構造特徵。
- code: T07
  name: 動物呼吸構造與氣體交換方式比較
  desc: 比較昆蟲氣管系統、蚯蚓皮膚呼吸、魚鰓與人類肺泡在氣體交換媒介、微血管參與及正／負壓呼吸上的差異。
- code: T08
  name: 呼吸力學與肺壓圖判讀
  desc: 追蹤吸氣與呼氣時橫膈肌、肋間肌與胸腔體積變化，並依肺容量或肺內壓變化曲線判讀呼吸階段。
- code: T09
  name: 氣體交換化學反應與血液氣體運輸
  desc: 依外呼吸與內呼吸示意圖，判別肺泡與組織微血管中CO2/HCO3-轉換、O2結合／解離及氣體分壓梯度。
- code: T10
  name: 血紅素含氧飽和度與高山適應分析
  desc: 解讀不同氧分壓下組織與肺部血紅素含氧飽和度數據或圖表，並推論低氣壓環境對血紅素親和力與生理適應的影響。
- code: T11
  name: 呼吸運動的神經與化學受器調節
  desc: 辨識延腦、主動脈與頸動脈化學受器對CO2/pH變化的偵測機制，以及大腦意識與肺泡牽張受器對呼吸的調控。
- code: T12
  name: 呼吸生理實驗設計與變因判讀
  desc: 根據密閉減壓實驗箱等動物生理實驗設計，區分操作變因、應變變因與控制變因，並推論長期低壓下的代償反應。
