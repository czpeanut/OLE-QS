unit:
  subject: 生物
  code: BI-S4-3-2
  title: 人類與生態系
status: draft
types:
- code: T01
  name: 環境賀爾蒙作用機制與生理危害
  desc: 辨識戴奧辛等環境賀爾蒙模擬或拮抗正常激素的作用機制，以及對動物性別比例與生殖的影響。
- code: T02
  name: 生物放大作用與環境汙染物累積
  desc: 追蹤脂溶性毒物與重金屬沿食物鏈營養階層向上累積放大對高階消費者的危害。
- code: T03
  name: 最小存活族群與瀕危分級
  desc: 闡明最小存活族群概念在保育評估的意義，並比較MVP與IUCN物種瀕危分級標準的異同。
- code: T04
  name: 野生動物保育成效與威脅因子評估
  desc: 依長期族群數量監測圖表（如灰面鵟鷹）評估保育成效，並辨識過度利用與棲地流失等威脅。
- code: T05
  name: 外來入侵種衝擊與防治評估
  desc: 分析紅火蟻等外來入侵種對本地生態的排擠危害，並評估物理、化學與生物防治的利弊。
- code: T06
  name: 棲地破碎化與邊緣效應分析
  desc: 比較保護區設計與道路開發後的棲地零碎化程度，並推論邊緣效應對核心物種的影響。
- code: T07
  name: 生物修復與棲地復育策略
  desc: 運用微生物分解或植物吸收進行生物修復，並評估國土復育、次級消長與流浪動物管理策略。
- code: T08
  name: 生態廊道設計與路殺減緩
  desc: 分析生態廊道維持棲地連續性與基因交流的功能，及減緩陸蟹或紫斑蝶路殺的保育措施。
