unit:
  subject: 生物
  code: BI-1-1-3
  title: 細胞週期與細胞分裂
status: draft
types:
- code: T01
  name: 細胞週期階段與染色體構造辨識
  desc: 區分間期物質複製與分裂期活動，或辨識同源染色體、姐妹染色分體與二分體的形態與基因組成。
- code: T02
  name: 有絲分裂過程與動植物差異
  desc: 依序排列或判別有絲分裂各時期特徵，並比較動植物細胞在中心體、紡錘絲與細胞質分裂的差異。
- code: T03
  name: 減數分裂階段與精卵形成比較
  desc: 辨識減數分裂聯會與同源染色體分離時期，或比較精子形成與卵原細胞產生卵及極體的數量與過程。
- code: T04
  name: 染色體套數與DNA含量推算
  desc: 追蹤有絲分裂、減數分裂與受精過程中染色體數目、套數及DNA含量的倍數變化與多倍體現象。
- code: T05
  name: 分裂圖像時期與部位判讀
  desc: 依據細胞分裂示意圖中的染色體排列與分離狀態，判斷分裂方式、時期及最可能觀察到的生物部位。
- code: T06
  name: 細胞分化調控與幹細胞應用
  desc: 闡明多細胞生物體細胞分化的基因表現機制，或分析胚胎幹細胞與誘導性多能幹細胞的特性與應用。
- code: T07
  name: 細胞週期各階段特徵判別
  desc: 區分細胞週期中染色質複製、核膜核仁消長與紡錘絲形成等間期與分裂期事件。
- code: T08
  name: 有絲分裂染色體與胞質分裂
  desc: 追蹤紡錘絲牽引染色體分離的過程，並比較動植物細胞分裂溝與細胞板的形成。
- code: T09
  name: 減數分裂I與II關鍵事件區分
  desc: 判別四分體形成、同源染色體分離與姊妹染色體分離各自發生的減數分裂階段。
- code: T10
  name: 配子形成與染色體套數推算
  desc: 追蹤精卵母細胞減數分裂過程中染色體套數、極體數量與配子數目的變化。
- code: T11
  name: 細胞分裂實驗觀察與操作判讀
  desc: 選擇合適的植物分生組織材料與顯微鏡倍率切換步驟，觀察分裂中的染色體。
- code: T12
  name: 細胞週期階段與檢查點調控
  desc: 判別G1、S、G2與M期的核心活動、DNA複製時機以及各檢查點的品管機制。
- code: T13
  name: 有絲分裂過程與時期排序判讀
  desc: 依染色體凝聚、排列與分離特徵排序有絲分裂過程，或判別顯微觀察的分裂時期。
- code: T14
  name: 減數分裂過程與染色體行為排序
  desc: 追蹤聯會、四分體形成、同源染色體分離與姐妹染色分體分離的先後順序與子細胞型式。
- code: T15
  name: 染色體、染色分體與基因位置辨識
  desc: 依據細胞染色體示意圖辨識同源染色體、姐妹染色分體與對偶基因在分裂後的分配情形。
- code: T16
  name: 動植物細胞分裂觀察與構造比較
  desc: 依細胞壁、中心粒或紡錘絲等特徵區分動植物細胞分裂差異，並判讀顯微觀察實驗結果。
- code: T17
  name: 分裂染色體組合與配子類型判讀
  desc: 依據同源染色體與非同源染色體的分離與組合規則，推算分裂後子細胞的染色體組合。
