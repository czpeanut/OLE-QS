unit:
  subject: 生物
  code: BI-S1-1-3
  title: 細胞的生命歷程
status: draft
types:
- code: T01
  name: 細胞週期分期與增殖調控判別
  desc: 區分細胞週期間期與分裂期的核心工作，及多細胞生物增殖替代衰老細胞的意義。
- code: T02
  name: 細胞分化機制與基因表現差異
  desc: 說明同一個體不同體細胞具有相同DNA序列，但因轉錄與轉譯調控差異而表現不同功能。
- code: T03
  name: 幹細胞潛能性分級與醫療應用
  desc: 比較受精卵、早期胚胎幹細胞與成體造血/臍帶血幹細胞的分化潛能高低與適用疾病。
- code: T04
  name: 細胞衰老成因與端粒縮短機制
  desc: 判別染色體端粒縮短、自由基與粒線體DNA突變等內外在因子對細胞衰老的影響。
- code: T05
  name: 細胞凋亡生理實例與癌細胞特徵
  desc: 辨識蝌蚪斷尾或指蹼消失等細胞凋亡過程，並比較癌細胞失去接觸抑制與無限增殖的特性。
- code: T06
  name: 細胞計畫性死亡路徑與意義
  desc: 區分細胞凋亡的內生路徑（粒線體）與外生路徑（死亡受體）機制，並判別其在發育與抗病毒防禦的角色。
- code: T07
  name: 細胞壞死與細胞凋亡比較
  desc: 依據細胞膜完整性、發炎反應與酵素分解受質特徵，區分病理性壞死與程式化凋亡。
- code: T08
  name: 幹細胞分化潛能與發育時期比較
  desc: 比較胚胎幹細胞與成體幹細胞在DNA序列、分化程度、發育時期與分化潛能的差異。
- code: T09
  name: 細胞凋亡外始與內始調控途徑
  desc: 區分胞毒T細胞外始途徑與DNA或蛋白質異常引發的內始途徑，並排序細胞凋亡步驟。
- code: T10
  name: 癌細胞抗凋亡與端粒酶無限分裂
  desc: 闡明p53蛋白異常、生長因子非依賴性、端粒酶高活性與紫外線致癌突變序列的機制。
- code: T11
  name: 細胞自噬作用途徑與抑制劑實驗
  desc: 依據細胞自噬文獻與藥物實驗圖表，判讀自噬體膜來源、LC3蛋白變化與抑制劑效能。
- code: T12
  name: 細胞週期階段調控與癌變機制
  desc: 辨識間期G1/S/G2與分裂期活動，或分析細胞週期檢查點基因突變與病毒蛋白干擾導致的癌化。
- code: T13
  name: 細胞分化原理與基因表現差異
  desc: 闡明同一個體不同組織細胞具相同DNA序列但呈現不同形態與功能的基因選擇性表現機制。
- code: T14
  name: 幹細胞潛能分級與應用比較
  desc: 區分全潛能、富潛能與多潛能幹細胞的分化能力與來源，並判別胚胎與成體幹細胞的特性。
- code: T15
  name: 細胞衰老與端粒縮短機制分析
  desc: 分析細胞分裂次數極限、端粒長度變化與端粒酶活性在不同種類細胞中的差異。
- code: T16
  name: 細胞凋亡與細胞壞死機制判別
  desc: 區分胚胎發育或免疫誘導的程式性細胞凋亡，與外力壓迫或損傷造成的細胞壞死。
- code: T17
  name: 特定細胞發育成熟歷程追蹤
  desc: 依據題幹資訊追蹤如紅血球排出細胞核與胞器等特化成熟過程中的功能與生理反應變化。
