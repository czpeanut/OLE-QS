unit:
  subject: 生物
  code: BI-S3-3-2
  title: 排泄作用
status: draft
types:
- code: T01
  name: 含氮廢物類型與動物棲地配對
  desc: 比較氨、尿素與尿酸的毒性、耗水量、溶解度與形成部位，並配對不同動物類群。
- code: T02
  name: 腎臟構造與腎元組成排序
  desc: 辨識腎皮質、腎髓質、腎盂與腎元各構造位置，並排列尿液形成流經的構造順序。
- code: T03
  name: 尿液形成三步驟與濃度曲線
  desc: 比較過濾、再吸收與分泌作用的機制與耗能，並判讀血漿、鮑氏囊濾液與尿液成分濃度變化。
- code: T04
  name: 抗利尿素ADH與滲透壓調節
  desc: 分析血液滲透壓、飲水、酒精與受體缺失對下視丘偵測、腦垂腺釋放ADH及集尿管的調控。
- code: T05
  name: RAAS系統與血壓鹽類恆定
  desc: 分析血壓或滲透壓變化時，腎素、血管收縮素、醛固酮與心房排鈉肽對鈉水再吸收的調節。
- code: T06
  name: 體液酸鹼緩衝系統與排泄器官
  desc: 辨識血液中碳酸氫根、磷酸根與血漿蛋白的酸鹼緩衝對，以及參與排泄的多個器官。
- code: T07
  name: 含氮廢物性質比較與代謝來源
  desc: 比較氨、尿素與尿酸的毒性、排泄需水量、合成耗能量與分子量大小，並辨識其來自胺基酸或核酸代謝。
- code: T08
  name: 不同動物排泄構造與滲透壓調節
  desc: 區分單細胞擴散、草履蟲伸縮泡（耗能）、蚯蚓腎管、昆蟲馬氏管與脊椎動物腎臟的排泄方式與含氮廢物類型。
- code: T09
  name: 腎臟縱切面與皮質／髓質環境適應
  desc: 辨識腎臟縱切面的皮質、髓質、腎盂與血管分布，並依不同棲地動物的皮質／髓質比例推論其保水適應能力。
- code: T10
  name: 腎元構造辨識與尿液形成機制
  desc: 依腎元示意圖判別入球／出球小動脈口徑差異、過濾壓動力（不耗能）、再吸收主要部位及集尿管對ADH的反應。
- code: T11
  name: 血液、濾液與尿液成分濃度表判讀
  desc: 依據血液、鮑氏囊濾液與尿液的成分濃度比較表，反推血漿蛋白、葡萄糖、胺基酸與尿素的過濾、再吸收與濃縮機制。
