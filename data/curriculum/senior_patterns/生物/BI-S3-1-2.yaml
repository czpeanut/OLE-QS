unit:
  subject: 生物
  code: BI-S3-1-2
  title: 恆定
status: draft
types:
- code: T01
  name: 血糖恆定激素與糖尿病成因分析
  desc: 分析胰島素、升糖素與腎上腺素對血糖濃度的調節，及糖尿病患者注射激素後低血糖症狀的成因。
- code: T02
  name: 內環境與外環境概念辨析
  desc: 區分動物體內細胞外液（內環境）與體外環境的定義，與動態穩定的恆定觀念。
- code: T03
  name: 負回饋與正回饋機制判別
  desc: 依據生理指標偏離與調節後變化趨勢，區分負回饋恆定調控與正回饋加劇反應。
- code: T04
  name: 血糖恆定與器官系統協作
  desc: 整合消化、循環、呼吸系統與肝臟胰島激素對血糖濃度的升降調控機制。
- code: T05
  name: 體內恆定生理指標判別
  desc: 辨識體溫、血壓、滲透壓與血漿酸鹼值等需維持動態恆定的生理指標。
- code: T06
  name: 正負回饋調控機制概念判別
  desc: 依據生理變量偏離後的調節方向，區分維持恆定的負回饋控制與放大效應的正回饋機制。
- code: T07
  name: 血液酸鹼緩衝系統與肺腎調節
  desc: 運用碳酸氫根、磷酸鹽與血漿蛋白緩衝反應式及腎小管HCO3-/H+調控，分析血液pH值異常與代償機制。
- code: T08
  name: 滲透壓與ADH分泌回饋調控
  desc: 追蹤下視丘滲透壓受器、腦垂腺後葉ADH分泌與集尿管水分再吸收在流汗、飲水或泡水時的變化。
- code: T09
  name: RAAS系統與血壓升高機制
  desc: 排列並分析腎素、血管收縮素與腎上腺皮質醛固酮（RAAS）在低血壓時促進鈉水再吸收與血管收縮的順序。
- code: T10
  name: ANP降血壓與排尿調節
  desc: 判斷右心房牽張刺激後ANP抑制腎素、醛固酮與鈉再吸收，進而增加排尿量與降低血壓的機制。
- code: T11
  name: 降血壓藥物與生理恆定實驗分析
  desc: 結合對照實驗數據圖表與ACEi/RAAS機制，判別操作變因並推論藥物或萃取物調控血壓的作用環節。
