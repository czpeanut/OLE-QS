unit:
  subject: 生物
  code: BI-S3-1-1
  title: 動物體的組成
status: draft
types:
- code: T01
  name: 上皮組織形態特徵與分布功能
  desc: 依據細胞排列緊密及極少胞外基質特徵，判別口腔、小腸、氣管與汗腺等上皮組織形態與機能。
- code: T02
  name: 結締組織分類與細胞間質比較
  desc: 比較疏鬆、緻密、脂肪、軟骨、硬骨與血液的細胞間質多寡與成分特徵。
- code: T03
  name: 三種肌肉組織構造與控制特性
  desc: 比較骨骼肌、心肌與平滑肌的細胞形態、細胞核數量、橫紋有無、收縮力道與是否受意志控制。
- code: T04
  name: 神經元與神經膠細胞組成及功能
  desc: 區分神經組織中神經元與神經膠細胞的數量比例及訊息傳遞支持功能。
- code: T05
  name: 四大動物組織綜合特徵與圖表判別
  desc: 依據顯微構造模式圖或生理機能描述，綜合區分動物體的上皮、結締、肌肉與神經組織。
- code: T06
  name: 皮膜組織形態與器官配對
  desc: 依據扁平、立方、柱狀或纖毛上皮的形態與功能，配對肺泡、小腸、氣管與腎小管等構造。
- code: T07
  name: 結締組織類型與胞外基質
  desc: 比較疏鬆、緻密、軟骨、硬骨、脂肪與血液的胞外基質成分、質地與生理功能。
- code: T08
  name: 肌肉組織橫紋與核數比較
  desc: 比較骨骼肌、心肌與平滑肌的細胞核數目、橫紋有無、隨意控制及玻片縱橫切特徵。
- code: T09
  name: 肌絲滑動與肌肉收縮機制
  desc: 分析粗肌絲與細肌絲的排列與滑動現象，解釋橫紋形成與肌纖維收縮時的長度變化。
- code: T10
  name: 神經組織構造與訊息傳導
  desc: 辨識神經元與神經膠細胞（如許旺細胞）的構造特徵，以及神經衝動的傳遞方向。
- code: T11
  name: 動物組織切片與血球辨識
  desc: 判讀組織切片示意圖或血液抹片中各類細胞的細胞核有無、大小比例與染色特徵。
- code: T12
  name: 上皮組織形態與分布位置配對
  desc: 依顯微構造圖判別扁平、立方、柱狀或纖毛上皮細胞，並配對其在肺泡、腎小管或氣管等器官的分布。
- code: T13
  name: 結締組織顯微構造與功能辨識
  desc: 根據細胞外基質與纖維排列特徵（如硬骨骨單位、軟骨或肌腱），判別結締組織類型與力學功能。
- code: T14
  name: 肌肉組織形態、核數與調控比較
  desc: 依細胞橫紋、細胞核數量與位置圖示，區分骨骼肌、平滑肌與心肌及其隨意／不隨意調控特性。
- code: T15
  name: 神經組織細胞組成與構造功能
  desc: 區分神經元（細胞本體、樹突、軸突）與各類神經膠細胞（星狀、微膠、許旺細胞）的起源與支援功能。
- code: T16
  name: 動物器官體腔分布與運動系統協作
  desc: 判斷器官所在的胸腔或腹腔位置，並分析肌腱、韌帶與骨骼肌收縮舒張在肢體動作中的協作方式。
