unit:
  subject: 生物
  code: BI-S4-1-1
  title: 遺傳變異與演化
status: draft
types:
- code: T01
  name: 達爾文天擇說與拉馬克學說比較
  desc: 辨識達爾文天擇說的核心機制（變異、過度繁殖、生存競爭、適者生存）並與用進廢退說區分。
- code: T02
  name: 天擇模式圖與性狀分布變化判讀
  desc: 依據天擇前後族群表現型頻率分布曲線，判別方向性、穩定性或分裂性天擇及物種分化潛力。
- code: T03
  name: 有性生殖與減數分裂變異來源
  desc: 區分減數分裂互換、自由配合、受精與有性生殖產生後代遺傳差異的機制及適應優勢。
- code: T04
  name: 隱性突變基因保留與雜合子分析
  desc: 說明不利生存的突變基因如何以隱性等位基因形式隱藏於異型合子中，並得以在族群中保留。
- code: T05
  name: 突變隨機性與天擇演化方向判別
  desc: 區分突變產生新等位基因的隨機無方向性與天擇篩選性狀的方向性，並判別單代與多代演化尺度。
- code: T06
  name: 人工選擇與自然選擇情境分析
  desc: 根據人類育種、工業黑化或瘧疾篩選等案例，辨識選擇壓力來源、對照組設計與族群性狀改變機制。
- code: T07
  name: 適應性特徵與演化證據推論
  desc: 由擬態、求偶特徵或形態與分子證據推論生物的起源與對環境的適應演化歷程。
