unit:
  subject: 生物
  code: BI-S2-4-3
  title: 植物激素
status: draft
types:
- code: T01
  name: 離層酸誘導氣孔關閉與種子休眠
  desc: 判別離層酸在乾旱逆境下促使氣孔關閉與抑制種子萌發以維持休眠的作用，並與其他激素配對。
- code: T02
  name: 五大類植物激素生理功能對應
  desc: 依據細胞延長、頂芽優勢、逆境閉氣孔或促進側芽等功能，配對生長素、吉貝素、細胞分裂素與離層酸。
- code: T03
  name: 激素間協同與拮抗作用判別
  desc: 判別生長素與細胞分裂素（頂芽優勢、組培分化根芽比例）或吉貝素與離層酸之間的拮抗關係。
- code: T04
  name: 生長素濃度對根莖芽生長曲線判讀
  desc: 依據不同器官對IAA濃度的敏感度曲線，判別最適促進濃度與高濃度抑制生長或芽鞘彎曲方向。
- code: T05
  name: 生長素極性運輸與吉貝素萌芽機制
  desc: 解析IAA酸鹼解離與PIN蛋白極性運輸機制（需質子幫浦ATP），或吉貝素誘導糊粉層水解酶步驟。
- code: T06
  name: 植物激素特性與農業應用判別
  desc: 判別植物激素微量作用與受體結合特性，以及促進發根、單性結果與除草劑等農業應用。
- code: T07
  name: 生長素發現史與向光性實驗
  desc: 分析達爾文、Boysen-Jensen與Went的燕麥芽鞘切除、雲母片隔絕與洋菜膠轉移實驗推論。
- code: T08
  name: 生長素極性運輸與酸生長機制
  desc: 追蹤生長素引發H+主動運出細胞壁造成酸化鬆解的過程，並判別不同濃度對根、芽、莖生長的影響曲線。
- code: T09
  name: 植物激素生理功能與拮抗協同
  desc: 比較生長素、吉貝素、細胞分裂素、乙烯與離層酸在頂芽優勢、果實成熟、老化、抗老與休眠上的作用。
- code: T10
  name: 激素實驗數據繪圖與突變株分析
  desc: 依據不同濃度激素處理下的器官伸長數據或激素合成突變株（如gal-3/DELLA蛋白）表現型推論調控機制。
- code: T11
  name: 激素季節動態與逆境反應圖判讀
  desc: 判讀溫帶植物一年內各種激素含量變化曲線與芽休眠、開花、落葉及氣孔開閉的時間對應關係。
- code: T12
  name: 生長素與細胞分裂素分化調控
  desc: 依據組織培養基中生長素與細胞分裂素的相對濃度比例，判讀癒傷組織分化為根或芽的趨勢。
- code: T13
  name: 乙烯與果實成熟老化調控
  desc: 判讀果實成熟過程中乙烯釋放量、細胞壁鬆弛酶活性與色素累積變化的實驗圖表。
- code: T14
  name: 五大植物激素主要生理功能配對
  desc: 配對生長素、吉貝素、細胞分裂素、離層酸與乙烯在促進或抑制植物生長發育上的獨特功能。
- code: T15
  name: 生長素濃度效應與器官敏感度圖
  desc: 判讀生長素濃度對根、芽、莖生長促進與抑制的雙相曲線圖，並應用於扦插生根或除草劑。
- code: T16
  name: 芽鞘向光性經典實驗與雲母洋菜
  desc: 分析達爾文與Boysen-Jensen等人的芽鞘切除、遮光、插雲母片或洋菜膠實驗結果與生長彎曲方向。
- code: T17
  name: 植物組織單側激素處理彎曲判斷
  desc: 依據不同濃度激素對組織相對生長速率的影響數據，推論切段組織兩側生長差異造成的彎曲方向。
- code: T18
  name: 果實發育與種子激素調控關聯
  desc: 分析未受精或移除種子的花托因缺乏生長素或吉貝素而無法正常發育成果實的生理機制。
