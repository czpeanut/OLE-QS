unit:
  subject: 生物
  code: BI-1-3-2
  title: 演化證據與生物分類
status: draft
types:
- code: T01
  name: 生物種概念與隔離機制判別
  desc: 依據自然界能否交配產生具生殖能力後代，判別物種歸屬及生物種概念的適用限制。
- code: T02
  name: 親緣關係樹與共祖特徵判讀
  desc: 由親緣關係樹的分枝節點與衍徵位置，判別物種親緣遠近與共有祖先特徵。
- code: T03
  name: 分子生物學與生物地理學證據
  desc: 依據胺基酸或DNA序列差異數推測親緣遠近，或利用大陸漂移與隔離解釋生物地理分布。
- code: T04
  name: 三域與五界生物分類特徵判別
  desc: 依據細胞核、葉綠體、細胞壁與病毒寄生等特徵，鑑別三域系統生命樹與各類群歸屬。
- code: T05
  name: 生命演化次序與植物化石鑑定
  desc: 依據海洋至陸地、原核至真核及組織分化順序，或植物關鍵生殖構造化石判別演化階段。
- code: T06
  name: 化石、地層年代與過渡物種證據
  desc: 依據化石所在的地層年代順序或始祖鳥等過渡特徵，推論生物演化先後與親緣關係。
- code: T07
  name: 比較解剖與分子演化證據判讀
  desc: 區分同源構造與同功構造，或依據胺基酸/DNA序列相似度表格判斷物種親緣遠近。
- code: T08
  name: 親緣關係樹狀圖節點與分支判讀
  desc: 讀取演化樹的最近共同祖先節點位置，比較兩兩類群的親緣關係親疏。
- code: T09
  name: 生物分類系統演進與類群特徵
  desc: 比較兩界、三界、五界至三域系統的分類依據，或依細胞壁幾丁質等特徵判定生物界別。
- code: T10
  name: 病毒構造、增殖與分類地位判別
  desc: 依據病毒缺乏細胞構造與酵素、僅含單一核酸且絕對寄生的特性，判斷其非細胞地位。
- code: T11
  name: 同源器官與同功器官的比較判別
  desc: 依據器官的胚胎發育來源與功能異同，區分同源器官、痕跡器官與同功器官。
- code: T12
  name: 分子生物學與胚胎化石演化證據
  desc: 利用DNA、RNA、蛋白質胺基酸序列相似度、胚胎發育或化石岩層分布判斷物種親緣遠近。
- code: T13
  name: 親緣關係樹與支序圖判讀
  desc: 依據演化樹分枝節點與共同祖先位置，比較不同物種間的親緣關係遠近與共有衍徵。
- code: T14
  name: 三域六界分類系統與生物歸屬
  desc: 依據細胞核有無、細胞壁與代謝特徵，將生物歸入細菌域、古細菌域與真核生物域各界。
- code: T15
  name: 病毒構造特性與非生物界歸屬
  desc: 判別病毒的核酸與蛋白質外鞘構造、絕對胞內寄生特性、尺度單位及無法歸入分類系統的原因。
- code: T16
  name: 生物多樣性三層次判別
  desc: 區分基因（遺傳）多樣性、物種多樣性與生態系多樣性的定義與實例。
