unit:
  subject: 生物
  code: BI-1-2-1
  title: 性狀的遺傳
status: draft
types:
- code: T01
  name: 孟德爾實驗設計與基本定律
  desc: 分析豌豆實驗選材優勢與授粉操作步驟，並闡明分離律與獨立分配律的意義與條件。
- code: T02
  name: 單性狀雜交與試交推論
  desc: 運用分離律、純品系自交與隱性試交設計，推論單一性狀的基因型與子代比例。
- code: T03
  name: 雙性狀與多對獨立遺傳計算
  desc: 運用棋盤方格法或分枝法計算兩對以上獨立基因雜交與試交的子代基因型及表現型機率。
- code: T04
  name: 子代表型反推親代基因型
  desc: 將子代表現型比例拆解為單性狀比例乘積，反推親代基因型組合與遺傳模式。
- code: T05
  name: 中間型與等顯性遺傳計算
  desc: 分析不完全顯性與等顯性遺傳的異型合子表徵，計算相關雜交組合的子代性狀比例。
- code: T06
  name: 複等位基因與血型遺傳鑑定
  desc: 依據ABO血型或兔毛色等複等位基因規則與抗原抗體凝集反應，推算子代血型與親子配對。
- code: T07
  name: 多基因數量遺傳機率與極值
  desc: 依據顯性等位基因的累加效應與常態分布特性，計算多基因性狀的表現型種類、極值與機率。
- code: T08
  name: 性別決定機制比較與判別
  desc: 區分XY、X0、ZW及環境溫度等性別決定系統，並推論雌雄配子對子代性別的影響。
- code: T09
  name: 性聯遺傳機率與果蠅分析
  desc: 追蹤位於X或Y染色體上的性聯遺傳基因，計算紅綠色盲、血友病或果蠅眼色的子代機率。
- code: T10
  name: 家族譜系圖模式與帶因推斷
  desc: 依據家族譜系圖的患病分布特徵，判斷體染色體或性聯顯隱性遺傳並推算成員基因型。
- code: T11
  name: 染色體學說與減數分裂對應
  desc: 將孟德爾分離律與獨立分配律對應至減數分裂同源染色體分離與非同源染色體自由組合。
- code: T12
  name: 遺傳染色體學說與基因連鎖
  desc: 闡述薩登與包法利提出的遺傳染色體學說，或判斷基因位於同條染色體時的連鎖分離行為。
