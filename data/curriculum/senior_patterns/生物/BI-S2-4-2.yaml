unit:
  subject: 生物
  code: BI-S2-4-2
  title: 種子的萌發與幼苗的生長
status: draft
types:
- code: T01
  name: 雙子葉與單子葉種子構造比較
  desc: 比較綠豆與玉米種子的胚（胚芽、胚軸、胚根、子葉）、胚乳與種皮位置及萌發時的養分來源。
- code: T02
  name: 種子萌發順序與幼苗出土型態
  desc: 排列種子吸水膨脹、種皮破裂、胚根突破與胚芽伸長順序，並比較子葉出土與不出土型機制。
- code: T03
  name: 種子休眠原因與環境條件影響
  desc: 判別種皮過硬、胚未成熟、溫度與水分不當對種子休眠的影響及種子抵抗逆境能力。
- code: T04
  name: 光照與溫度對萌發及幼苗生長圖表
  desc: 由不同波長光照或溫度對種子萌發率、幼苗高度與生長速率的數據圖表，歸納生理影響規律。
- code: T05
  name: 幼苗去白化與葉綠體發育調控
  desc: 判別光照對幼苗節間伸長抑制、子葉展開及葉綠體發育（避免白化現象）的調控作用。
- code: T06
  name: 單雙子葉種子構造與養分儲存
  desc: 辨識玉米、大麥（有胚乳）與綠豆（無胚乳）種子的胚芽、胚軸、胚根、子葉與糊粉層構造。
- code: T07
  name: 種子萌發條件與休眠打破機制
  desc: 分析水分、氧氣、溫度、光線及去除萌發抑制物質（如洗去果實膠狀物）對打破種子休眠的影響。
- code: T08
  name: 種子發育與萌發激素調控
  desc: 追蹤種子成熟時ABA累積與澱粉儲存，及吸水萌發時胚分泌吉貝素誘導糊粉層合成澱粉酶的過程。
- code: T09
  name: 幼苗出土型態與器官重量變化
  desc: 比較單雙子葉幼苗（如綠豆弓狀下胚軸 vs 玉米胚芽鞘）出土方式，及萌發期子葉、胚軸乾重變化曲線。
- code: T10
  name: 光敏素與幼苗白化（去黃化）反應
  desc: 比較黑暗中白化幼苗（徒長、子葉閉合）與照光後正常幼苗（葉綠素合成、胚軸粗短）的形態差異。
- code: T11
  name: 單雙子葉種子構造與養分儲存部位
  desc: 比較雙子葉無胚乳種子與單子葉有胚乳種子的構造異同及養分儲存位置。
- code: T12
  name: 種子萌發的生理步驟與先後順序
  desc: 排列種子吸水膨脹、酵素活化分解養分、胚根突破種皮與胚芽向上生長的正確先後順序。
- code: T13
  name: 大麥種子萌發激素與糊粉層調控
  desc: 追蹤胚產生吉貝素刺激糊粉層合成水解酶分解胚乳養分的訊息傳遞路徑。
- code: T14
  name: 種子發育與萌發期物質轉換曲線
  desc: 判讀種子成熟與萌發過程中脂肪、可溶性糖類與總乾重消長曲線，推論酵素活性變化。
