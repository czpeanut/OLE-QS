unit:
  subject: 生物
  code: BI-S1-3-3
  title: DNA的結構
status: draft
types:
- code: T01
  name: DNA分子平面結構與股向辨識
  desc: 辨識核苷酸上磷酸基連接五碳醣第5碳的位置，及雙股DNA反向平行（5'→3'與3'→5'）方向。
- code: T02
  name: 雙股DNA互補鹼基比例換算
  desc: 運用互補股鹼基配對關係，由單股的(A+G)/(T+C)或(A+T)/(C+G)比值推算互補股比值。
- code: T03
  name: DNA鹼基、氫鍵與長度計算
  desc: 依據磷酸分子數、鹼基數量與0.34 nm鹼基對間距，計算總氫鍵數、螺旋圈數與分子長度。
- code: T04
  name: 核苷酸五碳醣碳位與磷酸鹼基連接
  desc: 辨識去氧核糖第1、3、5號碳所連接的含氮鹼基、磷酸基與相鄰核苷酸磷酸二酯鍵位置。
- code: T05
  name: DNA雙螺旋立體參數與結構模型
  desc: 判別華生與克里克模型的螺距(3.4 nm)、每圈鹼基對數、反向平行雙股與氫鍵連結。
- code: T06
  name: DNA與RNA鑑定及人工鹼基
  desc: 依五碳醣種類、尿嘧啶有無及查加夫法則判斷核酸類型，並延伸判讀人工合成鹼基DNA特性。
- code: T07
  name: DNA熔點曲線與雙股穩定度
  desc: 依據紫外光吸光度隨溫度變化的熔點曲線，比較不同DNA或藥物鍵結後的氫鍵穩定強度。
