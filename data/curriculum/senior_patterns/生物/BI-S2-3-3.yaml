unit:
  subject: 生物
  code: BI-S2-3-3
  title: 有機養分的運輸
status: draft
types:
- code: T01
  name: 韌皮部運輸實驗與模式圖判讀
  desc: 依據壓力流模式圖或環狀剝皮、蚜蟲口針實驗，辨識主要有機養分成分與驅動原動力名稱。
- code: T02
  name: 木質部與韌皮部運輸機制綜合比較
  desc: 比較植物水分運輸與有機養分運輸在細胞死活、運輸方向、耗能與原動力上的異同。
- code: T03
  name: 壓力流假說與膨壓滲透壓比較
  desc: 比較供應端（葉端）與需求端（根端）篩管細胞的蔗糖濃度、滲透壓與膨壓大小及液體流向。
- code: T04
  name: 篩管與伴細胞構造及耗能步驟
  desc: 辨識韌皮部篩管、伴細胞與鄰近木質部細胞的形態差異，並判別蔗糖主動裝載與卸載的耗能步驟。
- code: T05
  name: 韌皮部運輸物質與雙向流動特性
  desc: 判別韌皮部主要運輸的有機養分（蔗糖）與水分跨膜移動方向及養分由供源向需庫運輸規則。
- code: T06
  name: 環狀剝皮實驗結果與機制推論
  desc: 依據韌皮部受阻與木質部仍暢通的條件，推論環狀剝皮上方累積養分膨大及根部衰亡現象。
- code: T07
  name: 供源器官與積儲器官判別
  desc: 依據植物生長時期與器官代謝狀態，區分合成或釋放蔗糖的供源器官與消耗或儲存的積儲器官。
- code: T08
  name: 有機養分運輸形式與環狀剝皮
  desc: 判別植物體內醣類運輸主要形式（蔗糖）與儲存形式，並分析環狀剝皮或蚜蟲口針取樣實驗結果。
- code: T09
  name: 韌皮部構造與物質運輸綜合
  desc: 結合篩管、伴細胞構造與木質部水分供應，解釋逆境（如缺水）對韌皮部壓力流運輸的影響。
- code: T10
  name: 壓力流學說與滲透壓驅動模擬實驗
  desc: 依據滲透壓差與膨壓變化解釋有機養分由供應部位流向需求部位的機制，並對應模擬實驗裝置。
- code: T11
  name: 植物季節性養分供需部位判別
  desc: 依據落葉、開花或種子發育等不同生長季節，判斷植物體內有機養分的供應源與需求庫流向。
- code: T12
  name: 壓力流與蒸散流機制比較
  desc: 比較韌皮部壓力流與木質部蒸散流的運輸方向、動力來源、細胞死活與耗能差異。
