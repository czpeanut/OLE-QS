unit:
  subject: 生物
  code: BI-S1-2-2
  title: 細胞的能量來源－呼吸作用
status: draft
types:
- code: T01
  name: 呼吸代謝路徑圖與代號判讀
  desc: 依據細胞呼吸完整代謝路徑示意圖，辨識各階段反應場所、中間產物與代號名稱。
- code: T02
  name: 有氧呼吸階段順序場所與產物
  desc: 排列糖解作用、乙醯輔酶A形成、檸檬酸循環與電子傳遞鏈順序，並清點場所與產物。
- code: T03
  name: 糖解作用場所與物質能量變化
  desc: 判別糖解作用發生於細胞質液的反應條件，及葡萄糖轉為丙酮酸的ATP與NADH淨產量。
- code: T04
  name: 丙酮酸氧化與檸檬酸循環
  desc: 追蹤丙酮酸進入粒線體形成乙醯輔酶A與檸檬酸循環的場所、CO2釋放及輔酶還原。
- code: T05
  name: 電子傳遞鏈與化學滲透磷酸化
  desc: 追蹤電子載體位能流動、粒線體內膜質子梯度建立及ATP合酶驅動氧化磷酸化的機制。
- code: T06
  name: 粒線體構造與呼吸場所配對
  desc: 辨識粒線體外膜、內膜、膜間腔與基質構造，並對應有氧呼吸各階段的發生位置。
- code: T07
  name: 原核與真核呼吸場所演化差異
  desc: 區分真核細胞粒線體內膜與原核細胞細胞膜在進行電子傳遞鏈及合成ATP的位置差異。
- code: T08
  name: 受質階層與氧化磷酸化比較
  desc: 區分糖解作用及檸檬酸循環的受質階層磷酸化與電子傳遞鏈氧化磷酸化的合成機制。
- code: T09
  name: 葡萄糖能量轉換效率與熱散失
  desc: 計算1莫耳葡萄糖產生ATP的能量保留百分比，並說明其餘化學能轉為熱能散失。
- code: T10
  name: 非醣類受質進入呼吸路徑
  desc: 判別脂肪酸與胺基酸分解後轉化為乙醯輔酶A或中間產物進入有氧呼吸產能的途徑。
- code: T11
  name: 有氧無氧呼吸與發酵作用比較
  desc: 依據最終電子接受者、氧氣需求、CO2有無、NAD+再生與ATP產量區分三類呼吸作用。
- code: T12
  name: 酒精與乳酸發酵路徑比較
  desc: 比較糖解作用後丙酮酸還原為酒精或乳酸的反應場所、氣體產物及NAD+再生功能。
- code: T13
  name: 運動生理供能與發酵轉換
  desc: 比較骨骼肌在短跑缺氧與長跑有氧狀態下的呼吸路徑轉換、乳酸堆積與ATP供能。
- code: T14
  name: 同位素示蹤、分餾與呼吸阻斷
  desc: 依據同位素標記、細胞離心分餾及缺氧或抑制劑處理，推論各階段反應場所與連鎖影響。
- code: T15
  name: 酵母菌發酵實驗設計與變因
  desc: 判讀發酵管氣體產量、溫度與醣類濃度曲線，辨識實驗操縱變因、對照與誤差來源。
- code: T16
  name: 呼吸毒理數據繪圖與相關分析
  desc: 依據毒物濃度、ATP含量與細胞死亡率實驗數據繪製關係圖，並推論相關性與致死劑量。
- code: T17
  name: 組織生理狀態與呼吸速率比較
  desc: 依據細胞代謝需求、生長時期或氧氣供給狀況，比較不同組織或生物的呼吸作用速率。
