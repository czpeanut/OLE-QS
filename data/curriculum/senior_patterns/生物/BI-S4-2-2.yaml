unit:
  subject: 生物
  code: BI-S4-2-2
  title: 族群
status: draft
types:
- code: T01
  name: 族群增長模型與環境負荷量應用
  desc: 運用J型與S型增長曲線及環境負荷量(K)概念，分析族群密度動態與流浪動物管理策略。
- code: T02
  name: 島嶼或孤立棲地族群動態比較
  desc: 依據島嶼族群數與總數量變化圖表，比較不同棲地族群的種內競爭強度與穩定度。
- code: T03
  name: 族群定義與空間分布特徵判別
  desc: 依據「同種、同時、同地」標準判斷生物組合是否為單一族群，並區分均勻、隨機與群聚分布。
- code: T04
  name: 族群密度公式與成長變動因子分析
  desc: 運用D=N/S定義、捉放法及年齡結構，判斷族群密度的計算與未來成長趨勢。
- code: T05
  name: 族群成長曲線與環境負荷量判讀
  desc: 依J型或S型族群數量波動曲線圖，判斷環境負荷量（K）的位置區間及動態平衡特徵。
- code: T06
  name: 存活曲線圖表判讀與座標轉換
  desc: 判讀I、II、III型存活曲線座標意義、致死年齡階段及累積死亡曲線轉換，並對應代表物種。
- code: T07
  name: 生殖策略、育幼與保育管理推論
  desc: 依據存活曲線推論物種產卵數與育幼投入，並研擬瀕危物種保育或資源管理策略。
