  type: single
  page: 6
  stem: 據文章中所述，請問:黎元洪拉攏地方軍人是因為與下列哪位發生政爭？
  options:
  - label: A
    content: 宋教仁
  - label: B
    content: 袁世凱
  - label: C
    content: 段祺瑞
  - label: D
    content: 張作霖。
  group_stem: '《京劇名角-梅蘭芳傳奇》

    民國6 年，大總統黎元洪為拉攏地方軍人，邀請當時的京劇名角譚鑫培演出，年邁而生病的他因過勞，不久後過世。他的離世象徵前朝大牌藝人時代結束，梅蘭芳則走向戲曲神壇，他男扮女裝的技巧出神入化，並提升京劇這種原本通俗的戲劇，呈現審美的抒情境界。梅腔悠然而有餘韻，令觀眾感受到女子優美的情致，創造了具有獨特風格的表演藝術流派──梅派。

    過去的京劇觀眾多為男性，他們長期接觸戲曲，較重視演員的演技。但到了民國，大量女性觀眾才剛接觸京劇，剛獲得更多閱讀能力和娛樂餘暇的女性，更欣賞具陰柔之美的旦角，因此像梅蘭芳這種俊俏的演員更能獲得觀眾的喜愛。

    梅蘭芳是中國京劇承上啟下最具有代表性的人物。他在五十餘年的舞台生涯中，塑造了眾多的婦女藝術形象，發展了京劇旦角的表演藝術。'
