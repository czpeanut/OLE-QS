- id: doc_113_高雄_五福_社會_g8s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 東南亞許多國家的第一大城，皆於歐 美殖民期間，因大量出口農礦原料的產業模式而崛起，為「港埠型都市」，如圖(4)。請問：關於這些都市的敘述，下列何者正確？
  options:
  - label: A
    content: 甲：馬尼拉，是菲律賓的首都，受西班牙殖民影響，居民多信仰天主教。
  - label: B
    content: 乙：河內，位於湄公河出海口，附近廣大三角洲是世界重要的小麥產地。
  - label: C
    content: 丙：蒲甘，緬甸的古都，有「萬塔之城」的美譽，為亞洲佛教遺址所在。
  - label: D
    content: 丁：雅加達，是印尼的舊都，受印度文化影響，當地主要信仰為印度教。
