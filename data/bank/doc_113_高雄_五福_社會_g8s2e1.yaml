  group_stem: '( 中央社記者郭00 台北25 日電）立法院會今天三讀通過18 歲公民權修憲案，明定年滿18 歲中華民國國民，依法有選舉、罷免、創制、複決、參加公投及被選舉權，全案公告半年後將交由公民複決，這也是中華民國歷史首次交付公民複決的修憲案。

    過去7 次修憲都交由國民大會或任務型國代，但2005 年修憲時增訂憲法增修條文第12 條，明定憲法修正案公告半年後需交由公民複決，且有效同意票超過選舉人總額半數；以2020
    年總統大選的選舉人數換算，要超過965 萬票才算通過，外界視為超高門檻。

