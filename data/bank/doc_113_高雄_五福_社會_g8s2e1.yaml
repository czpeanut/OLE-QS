- id: doc_113_高雄_五福_社會_g8s2e1_s1_48
  section: 1
  number: 48
  type: single
  page: 6
  stem: 請問：上述《告北大學生暨全國學生書》聲明最可能是由誰發表？
  options:
  - label: A
    content: 蔡元培
  - label: B
    content: 陳獨秀
  - label: C
    content: 胡適
  - label: D
    content: 魯迅。
  group_stem: '《告北大學生暨全國學生書》

    以下是北京大學校長給當時全國學生的一段聲明：

    從去年五四運動開始，大家為了喚醒全國人民的愛國心，連自己的學業都暫時放下，投入救國運動。你們的熱情感動了全國人民，大家也都跟著行動起來，盡自己的一份責任。連政府也終於了解，人民的愛國心才是救國的關鍵，所以開始願意聽大家的聲音。可以說，大家喚醒國民的責任，已經完成了，做得非常好。

    但是，整個中國有四億人，現在這個時代，教育和科學非常重要，但真正讀過書的人只有很少一部分，能學到真正科學知識的人更少。而你們剛好是最幸運的，能有這麼好的學習機會，甚至還能研究科學知識。將來中國的新文化、甚至讓中國的學問走向世界，都要靠你們來完成。這麼重要的責任，怎麼能因為參加政治運動，就完全放棄呢？

    短時間的喚醒，做到這裡已經很足夠了。但是，如果要讓大家一直保持這種覺醒，讓國家真正變好，光靠熱情還不夠，還要讓自己知識更豐富、志向更遠大、品格更純潔。這些，都是必須做到的。

    所以說，讀書做學問，才是你們最重要的責任啊！從現在開始，希望我們一起努力，把學問學好，把大學變成全國文化的中心，為中國未來的發展打下穩固的基礎。'
  tags:
