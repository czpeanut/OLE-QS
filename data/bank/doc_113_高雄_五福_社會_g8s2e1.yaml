    但是，整個中國有四億人，現在這個時代，教育和科學非常重要，但真正讀過書的人只有很少一部分，能學到真正科學知識的人更少。而你們剛好是最幸運的，能有這麼好的學習機會，甚至還能研究科學知識。將來中國的新文化、甚至讓中國的學問走向世界，都要靠你們來完成。這麼重要的責任，怎麼能因為參加政治運動，就完全放棄呢？

