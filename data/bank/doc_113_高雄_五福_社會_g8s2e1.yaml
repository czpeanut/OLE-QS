- id: doc_113_高雄_五福_社會_g8s2e1_s1_18
  section: 1
  number: 18
  type: single
  page: 3
  stem: 根據下圖文中敘述，立法委員提案修正的《憲法訴訟法》與下列何者的法律位階相同？
  options:
  - label: A
    content: 《中華民國憲法增修條文》
  - label: B
    content: 《大法官審理案件法》
  - label: C
    content: 《憲法法庭審理規則》
  - label: D
    content: 《憲法訴訟案件書狀及卷內文書公開辦法》。
  group_stem: "立法院修正通過憲法訴訟法之新聞稿\n\n立法院今（20）日三讀通過立法委員提案修正之憲法訴訟法(下稱憲訴法)，除另有規定外，憲法法庭作成判決及暫時處分裁定，應經大法官現有總額10人以上參與評議，且違憲宣告人數不得低於9人。\n\
    本院大法官基於憲法賦權，掌理解釋憲法、統一解釋法律及命令之權，並依法組成憲法法庭審理各類憲法訴訟案件，承負保障人民基本權利及維護國家憲政秩序的重要功能。若憲法法庭無從行使審判權，勢將減損人民尋求救濟之憲法訴訟權利，各機關亦無法透過憲法訴訟解決憲政爭議，斷傷違憲審查制度功能。\n\
    本次修正條文將參與評議的大法官人數改為至少10人，遇有大法官因卸任、辭職、免職或死亡，而未及補足缺額時，恐將因大法官不足10人，而無法進行評議並作成裁判。況且同意違憲宣告之大法官人數必須有9人以上，在大法官人數未補齊之前，將造成極少數即得制約多數的情形；縱大法官缺額全數補足，高門檻之評決人數要求仍易導致審案效率降低，不利於人民基本權利之保障。\n\
    本院認為維持憲訴法原規定於憲法訴訟實務運作並無箝礙，對於今日立法院三讀通過憲訴法修正案，將造成憲政機關運作上的困難，深表遺憾。\n\n發布日期：113-12-20\t\
    發布單位：憲法法庭書記廳"
