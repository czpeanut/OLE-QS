  stem: 附圖為根據本文所做的一趨勢預估分析圖。根據圖中數量變化的趨勢，此圖表的Y軸最可能表示下列何者？
  options:
  - label: A
    content: 俄國境內的歐美跨國企業總數
  - label: B
    content: 俄國智慧財產權侵害案件數量
  - label: C
    content: 與俄國建立邦交的國家數
  - label: D
    content: 俄國跨國企業的境外展店數量。
  group_stem: 俄國侵略烏克蘭的軍事衝突持續至今，以美國、英國為首的西方國家持續支援烏克蘭多項援助，並對俄國實施經濟制裁。此外，許多跨國企業陸續聲明退出俄國市場，包含麥當勞、肯德基、星巴克、服飾品牌H&M等。俄國對此也祭出反制策略。根據俄國於2022年3月6日所發布的法令內容：俄國企業沒有義務向「不友好」國家的專利、實用新型和工業設計的所有者提供損害賠償。而根據法令，這些「不友好」國家，正是對俄國實施制裁的國家。這意味著俄國企業可以任意使用這些「不友好」國家的專利、商標及工業設計等，也無須負擔侵權責任。法令公告後，俄國一份3月12日提出的商標申請引起注意，一家名為「凡尼亞舅舅」的商標和麥當勞金色拱門商標太過雷同，此外，也有人註冊了「Makdonalds」、「Makdak」等和麥當勞相似度極高的名稱。此外，還有模仿肯德基的「克里米亞炸雞」（Crimean
    Fried Chicken，CFC）、模仿星巴克的「Starducks」等。俄國政府藉由批准與跨國企業雷同的商標，未來也可能縱容販售沒有經過授權的品牌商品和盜版貨，來報復西方國家的經濟制裁。
