- id: doc_113_新北_丹鳳_英語_g7s1e3_s6_41
  section: 6
  number: 41
  type: single
  page: 3
  stem: What is the reading mainly about?
  options:
  - label: A
    content: School lives around the world.
  - label: B
    content: School types around the world.
  - label: C
    content: School hours around the world.
  - label: D
    content: School lunch time around the world.
  group_stem: '(一)

    It is 8 o’clock in the morning. The students in Taiwan are sitting in the classroom
    and get ready for classes. They eat lunch and rest from 12 p.m. to 1 p.m. About
    4 p.m., they go home. However, school hours around the world are very different
    from those at Taiwan. In Finland, classes start at 9 a.m. and students are in
    school for five hours. In Brazil, school starts at 7 a.m. and students can go
    home for lunch. In France, students go to school at 8:30 a.m. and go home at 4:30
    p.m. But they can eat lunch for two hours. In Italy, school hours run from around
    8 a.m. to 1:30 p.m. Students can eat lunch for 0.5 hour.


     ready 準備好的 hour 小時 start 開始'
