  stem: 阿正依據上文內容，列表呈現山風和谷風的特點，何者完全正確？
  options:
  - label: A
    content: '| | 山風 | 谷風 |

      |---|---|---|

      | 形成時間 | 白晝 | 夜晚 |'
  - label: B
    content: '| | 山風 | 谷風 |

      |---|---|---|

      | 形成原因 | 空氣膨脹，氣壓降低，空氣由山谷沿山坡爬昇。 | 氣溫迅速降低，冷空氣自山頂沿山坡下降。 |'
  - label: C
    content: '| | 山風 | 谷風 |

      |---|---|---|

      | 風力強弱 | 較強 | 較弱 |'
  - label: D
    content: '| | 山風 | 谷風 |

      |---|---|---|

      | 凝結型態 | 山頂雲 | 旗雲 |'
  group_stem: '（五）

    山風和谷風是山嶺地區因為山頂和山谷一日當中熱效應不同所引起。白晝時，在山坡地區由於受太陽照射，溫度較高，空氣膨脹，氣壓降低，因此空氣由山谷沿山坡爬昇，而產生谷風。午前十時左右，風由谷內沿山坡而上，溫度愈高，風勢愈強，到午後二時左右，風力最大，可達
    3 級，以後逐漸減弱，日落前後完全停止；到晚上，山坡地帶因地勢較高，散熱較快，於是氣溫迅速降低，冷空氣自山頂沿山坡下降，流入谷內，形成山風。

    谷風的風力在2～3 級左右。白天谷風輸送水氣上昇到山頂，往往可凝結成雲，就是常見的山頂雲或旗雲。山風的風速可達5 級，當其沿山坡下降積聚山谷內，使谷內水氣凝結，因此山谷內或盆地內，在日出前常生雲霧。

    春末或秋初，山谷和盆地因夜間有冷空氣積聚，結霜機會較多，故懼寒的作物如柑橘、咖啡，常種植在山坡地帶，此乃因山坡地帶在夜間冷空氣不易聚集，結霜機會較少。

    資料來源：中央氣象局網站＿氣象百科'
