  section: 2
  number: 35
  type: single
  page: 5
  stem: '甲、死亡總是來得如此倉促，令人來不及收拾行李，從容啟程前往下一個目的地

    乙、是與疾病伴行的日子裡，不離身的隨身行李

    丙、像病歷紙一樣愈來愈殘破，死亡是唯一的終點

    丁、空蕩的機場大廳，安靜等待著下一批旅客

    依據文章內容，四段結尾處挖空的文句（一）～（四）依序應填入何者？'
  options:
  - label: A
    content: 丙乙甲丁
  - label: B
    content: 丁乙甲丙
  - label: C
    content: 甲丁丙乙
  - label: D
    content: 乙甲丙丁。
  group_stem: '（三）

    與台灣不同，史瓦濟蘭每次看門診的病歷紙都會釘在一起，由病人負責保管，隨著他們在不同門診之間流浪。而那疊紙張的厚度也能粗略判斷病人的身體狀況：有些人清清白白，只有一張寫了幾個字的紙，但也有人已被厚厚的病史壓得喘不過氣，似乎每一個釘書針孔都是疾病叮咬的痕跡。那疊紙張是在醫院間出入境的旅行文件，醫生在病歷紙上寫下病情，蓋上戳印……。許多人就這樣，因為不同的併發症終年在不同病房之間流浪著，（一）。

    我所見到的病人，大多數都是愛滋病或肺結核患者，更常見的是兩者皆有。……按時吃藥與否，與何種藥物配方皆是臨床診斷的考量之一；因此我有許多機會要去從病人的病歷中找出這些用藥的蛛絲馬跡。那些每天必需的藥物與病歷放在塑膠袋中，（二）。

    一床病人過世了，我急忙跑到時，他已停止了呼吸，……護士將遺體用白布蓋好，頭臉纏上紗布，在頸子前方打一個結。……（三）。

    這裡的病人啊醫生啊，都是醫院的過境旅客，甚至連死亡也是——那些轉盤上的行李最終都會被提走，只留下冷冽的風吹過，（四）。

    節錄自《來自天堂的微光——我在史瓦濟蘭行醫˙行李》／阿布

