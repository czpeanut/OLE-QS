  options:
  - label: A
    content: 此稱號產生的原因為邢福晝伏夜出，行蹤神秘
  - label: B
    content: 為人慷慨，常將長年行乞所得捐出，救濟貧困
  - label: C
    content: 出身貧農，為了改善生計，被迫加入廣幫惡丐
  - label: D
    content: 曾患奇疾，被一老年化子所救，且被傳授本領。
  group_stem: '（四）

    邢飛鼠本名邢福，原是嘉興富農，因自幼愛武，生性好施，最喜周濟乞丐。到了十四歲上忽得奇疾，骨瘦如柴，不食不飲。邢家兩房只此獨子，自是愁急。百計求醫，全查不出病源來，眼看快死。正在舉室號哭，呼天求神之際，忽一老年化子登門自薦，說：「小孩前生孽重，不合投到你們這等富家。幸他還有善根，才得遇我。命雖可以救活，但須隨我雲遊，當上十年乞丐才可減消前孽。」……那化子先給小孩前心後背撫按了一陣，又取了些草藥煎湯灌服下去，不到一個時辰便自救轉，吐了些許濃痰，索要飲食。……由此邢福隨師隱跡風塵，學了一身驚人本領，與父母家人也常時相見。因他輕功特好，都稱他為邢飛鼠。……自己仍去隱身乞丐當中，也不常向人乞討，專在暗中濟困扶危，用的多是家財，俠丐之名遍於江南。這次和廣幫惡丐結仇，因平日交游眾多，風聲傳出，紛紛前來相助。

    節錄自《雲海爭奇記》第 18 回／還珠樓主'
