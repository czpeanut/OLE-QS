  page: 1
  stem: '某文章有下段的論述：「宋朝統一了中國，卻無法創造一個內政外交強大的盛世。一般認為宋朝國勢不強的原因，除了重文輕武的國策導致武力不盛外，也與地理因素有關。宋朝的北方邊防空虛無險可守，而外族騎兵機動迅速，可長驅直入華北，威脅宋都汴京。」

    請問：上文中提到宋朝「北方邊防空虛無險可守」與下列何者最為相關？'
