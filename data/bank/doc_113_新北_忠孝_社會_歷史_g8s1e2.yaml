- id: doc_113_新北_忠孝_社會_歷史_g8s1e2_s1_39
  section: 1
  number: 39
  type: single
  page: 2
  stem: 這篇短文中提到「我們的到來…….」與下列何者最為相關？
  options:
  - label: A
    content: 新航路開通
  - label: B
    content: 蒙古族擴張
  - label: C
    content: 印刷術西傳
  - label: D
    content: 鄭和下西洋
  group_stem: 利瑪竇中國札記以外國人的眼光記錄了明朝 萬曆(西元1563～1620年)年間在中國京城的所見所聞：「我們的到來和歐洲遠來異物的出現，消息一經傳開就把很多人吸引到教堂來，……歐洲的圖畫和塑像、數學計算法浮雕地圖，也吸引很大的注意。我們的書，儘管是用中國人所不懂的語言排印的，卻大受稱羨，因為書的裝訂不同尋常，而且鍍金美觀，在中國完全是新東西。你把附有描繪性地圖的書或者用圖表和草圖說明的建築模型拿給這些人看時，他們都感到高興和驚詫。……經驗告訴我們神父們應該像高度有教養的中國人那樣裝束打扮，他們都應該有一件在拜訪官員時穿的綢袍，在中國人看來，沒有它，一個人就不配和官員、甚至和一個有教養的階層的人平起平坐。」資料來源：利瑪竇著，何高濟、王遵仲、李申譯。利瑪竇中國札記。北京：中華書局。
  tags:
    chapter:
      publisher: 翰林
      book: 八上
