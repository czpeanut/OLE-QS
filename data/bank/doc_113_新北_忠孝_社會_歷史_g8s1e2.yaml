  section: 1
  number: 29
  type: single
  page: 1
  stem: 「此一朝代版圖遼闊，境內民族複雜，蒙古、女真、契丹、高麗、漢族等族雜居；加上先前的軍事行動，曾經遠達西亞、歐洲，帶回突厥、波斯、斡羅思（俄羅斯）及東歐各族人士。上述情況使得此朝代族群繁多，遠遠超過其他時期，在中國史上可謂獨一無二。」此一時代最可能是？
