  stem: 「蘇生是徽州人，參加科舉考試屢屢失利，但他沒有放棄金榜題名的希望。為了糊口謀生，在這個徽州商人活躍於全國，形成商幫組織的時代，他未從商而選擇行醫。有一年，蘇生遠赴省城參加鄉試，卻遇上了身體不適的老友上門求診，結果老友得以痊癒，自己卻又再度名落孫山。終其一生，他雖未能如願中舉，但卻成為一位良醫。」上文中的蘇生，最可能是下列何時的讀書人？
