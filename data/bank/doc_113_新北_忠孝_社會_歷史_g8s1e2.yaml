  type: single
  page: 2
  stem: '某文章對宋朝有以下的評析：「宋朝內部雖也有認為支付歲幣有損宋朝國威，例如：有大臣反對對遼國採取和議態度，因為歲幣形同長期協助遼國經濟，反會讓遼國看輕宋朝；但也有不少宋臣認為是成功的策略，算出歲幣的支出不及用兵的費用的百分之一、二總之，歲幣雖對宋朝造成沉重的財政負擔，卻能讓宋朝免於戰禍的財力與人命的損耗，歲幣不全然為下下之策。然而以金錢換取和平的多次經驗，不免造成宋朝的苟安心態。」

    請問：上文中討論的政策內容與下列何者最為相關？'
