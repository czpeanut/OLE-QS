  type: single
  page: 1
  stem: 「七次下西洋象徵著明代發展朝貢貿易的重要時期，鄭和的船隊雖配備強大的武裝，但並不用武力，而是利用瓷器、絲綢、金屬貨幣等，交換各國的珍珠寶石、香料及珍禽異獸….。許多國家在鄭和訪問後，派遣使團甚至是搭乘鄭和的船隻來中國「朝貢」。…在此後的一段頗長時間裡，明代聲威一度可與唐太宗的天可汗制度媲美。」請問：根據上述，明代在處理對外關係的態度是下列何者？
