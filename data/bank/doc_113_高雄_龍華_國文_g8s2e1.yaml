  section: 3
  number: 9
  type: single
  page: 2
  stem: 下列各詩句所描述的城鎮特色，主題包含：特殊地景、古蹟名勝、在地特產、宗教活動，何者主題是屬於「特殊地景」？
  options:
  - label: A
    content: 「長長的嗩吶吹亮農曆三月的夜空╱長長的隊伍堅定串聯月亮與太陽╱月光與陽光為繞境隊伍打光╱一路行來，都在安你的莊╱福你的圳，佑你的田╱如果微雨，也是媽祖的心意╱催促作物速速趕上信眾的步履╱鑼聲震震，敲醒三百公里」
  - label: B
    content: 「戍守的兵走了╱走了，不知魂歸何處╱留下此城╱空悲嘯，在風中初秋眼前更是一片蕭瑟╱草長及胸，滿城飛舞╱我想若是當年旌旗╱那軍容該是何等壯盛只一舉步，便跨入╱康熙年間，令人不解的╱偌大城郭竟不設防╱難道他們洞悉╱我非探子，乃一憑弔人」
  - label: C
    content: 「海拔愈來愈高╱地勢愈來愈險╱岩石愈益托大╱天空愈益縮小╱正是古代畫家夢寐以求的奇景絕勝╱有些隧道是傳統的首尾貫通╱有些在向溪流的外側僅以疏疏的水泥立柱支撐╱貫通的該是山的迴腸╱側空的就是山的肋骨了」
  - label: D
    content: 「雪白的在來米漿╱沿著滾熱的鼎邊╱緩緩滑行╱守候的目光與味蕾相遇╱山珍海味擠在這小小的圓╱相遇華燈初上的夜色╱看遍人來人往的晨昏四季╱數盡潮起潮落的颳風下雨╱在擁擠熱鬧的懷舊廟口╱一寸寸刻畫出歲月的鮮美記憶」
