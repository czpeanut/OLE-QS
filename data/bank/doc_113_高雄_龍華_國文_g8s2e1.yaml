  type: single
  page: 1
  stem: 有關〈控訴一支煙囪〉一詩的說明，下列敘述何者正確？
  options:
  - label: A
    content: 作者以「流氓、女童、大煙客」譬喻煙囪，斥責他蠻不講理，破壞善良的風氣
  - label: B
    content: 「隨意撣著煙屑」指工廠隨意排放的廢氣，「煙灰碟」則指出地形造成廢氣積累
  - label: C
    content: 「你破壞朝霞和晚雲的名譽」是因為太陽裝出戒煙的樣子，卻躲在夜裡吞吐廢氣
  - label: D
    content: 「被你薰成了黑懨懨的蝴蝶／在碟裡蠕蠕地爬動」指出市民的肺葉飽受空汙危害
