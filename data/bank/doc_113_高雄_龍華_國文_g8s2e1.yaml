- id: doc_113_高雄_龍華_國文_g8s2e1_s3_12
  section: 3
  number: 12
  type: single
  page: 2
  stem: '上完〈飲馬長城窟行〉後，老師讓小可愛們進行討論解析，題目如下，請問誰說對了？

    青青河畔草，綿綿思遠道。遠道不可思，宿昔夢見之。

    夢見在我傍，忽覺在他鄉。他鄉各異縣，輾轉不相見。

    枯桑知天風，海水知天寒。入門各自媚，誰肯相為言。

    客從遠方來，遺我雙鯉魚。呼兒烹鯉魚，中有尺素書。

    長跪讀素書，書中竟何如。上言加餐食，下言長相憶。'
  options:
  - label: A
    content: 吉伊卡哇說：這是一首閨怨詩，敘述妻子思念在黃泉之下的丈夫，悲痛哀傷
  - label: B
    content: 烏薩奇說：文句有頂真與類疊手法，營造回環反覆的美感，是樂府詩的特色
  - label: C
    content: 小八說：採用第三人稱的視角寫成，「雙鯉魚」與「尺素書」都是書信的意思
  - label: D
    content: 栗子饅頭說：「枯桑知天風，海水知天寒」使用擬物法，表現孤獨淒涼的感情
