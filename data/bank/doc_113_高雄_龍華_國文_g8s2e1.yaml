  group_stem: "我們的城不再飛花 在三月\n到處蹲踞著那龐然建築物的獸──\n沙漠中的司芬克斯① 以嘲諷的眼神窺你\n而市虎成群地呼嘯\n自晨迄暮\n\
    \n自晨迄暮\n煤煙的雨 市聲的雷\n齒輪與齒輪的齟齬\n機器與機器的傾軋\n時間片片裂碎 生命刻刻消褪……\n\n入夜，我們的城像一枚有毒的大蜘蛛\n \
    \   張開它閃漾的誘惑的網子\n    網行人的腳步\n    網心的寂寞\n    夜的空無\n\n我常在無夢的夜原上寂坐\n  看夜底的都市 像\n\
    \  一枚碩大無朋的水鑽扣花\n  正陳列在委託行的玻璃櫥窗裡\n  高價待沽\n                   ──蓉子 〈我們的城不再飛花〉\n\
    注\n① 司芬克斯：為埃及著名的人面獅身像，最初源於古埃及的神話，被描述為長有翅膀的怪獸，通常為雄性，是仁慈和高貴的象徵。到了希臘神話裡司芬克斯卻變成了一個雌性的邪惡之物，代表著神的懲罰。"
