  - label: B
    content: 「願為市鞍馬，從此替爺征」陳述從軍前的準備，木蘭用心整裝並且採買配備
  - label: C
    content: 「不聞爺孃喚女聲，但聞燕山胡騎聲啾啾」強調戰爭殘酷，造成木蘭近鄉情怯
  - label: D
    content: 「兩兔傍地走，安能辨我是雄雌」寫木蘭自豪語，表達「巾幗不讓鬚眉」之意
