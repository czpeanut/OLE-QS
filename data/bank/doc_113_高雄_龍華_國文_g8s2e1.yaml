  section: 3
  number: 23
  type: single
  page: 4
  stem: 根據這篇新聞報導，下列關於唐捐詩作的說明，何者正確？
  options:
  - label: A
    content: 是臺大教授為了投稿臺北文學獎而特別創作的作品
  - label: B
    content: 因為由網友選票最適合民眾欣賞的才刊載在捷運上
  - label: C
    content: 運用對比、雙關，及幽默的語言是造成討論的原因
  - label: D
    content: 作者模仿〈遠與近〉一詩，備受推崇進而投稿競賽
  group_stem: 臺北市 文化局每年都會舉辦臺北文學獎，得獎的作品都會刊載在公車和捷運上。第一季的詩文在日前上線，當中有一首新詩內容太有創意又有梗，讓網友直呼「真是廢到笑」。這首新詩標題為「難道這就是愛」，內容寫著：「你一會兒看山／一會兒看我／為什麼／你看山小／看我時卻很火大」作者唐捐是臺大教授，同時也是詩人、散文家和文學評論者。臺北市
    文化局表示現在前三季由3 位評委從坊間詩集挑選30 首詩作，每季刊出10 首，第四季才從臺北文學獎得獎作品中挑選，然後會把得獎而且適合民眾欣賞的作品節錄在公車及捷運上，唐捐指出，這首詩是「諧仿」中國詩人顧城的經典之作〈遠與近〉，這次只是算是入選，但它不是得獎作品。而這首詩最初是他在2014
    年1 月發表在臉書上的一則廢文，後來收入自己的詩集。
