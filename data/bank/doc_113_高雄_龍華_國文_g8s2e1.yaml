  type: single
  page: 2
  stem: 關於〈讓春天從高雄出發〉與〈控訴一支煙囪〉兩首詩的敘述，下列何者正確？
  options:
  - label: A
    content: 兩首詩主題與風格皆不同，前者節奏輕快，熱情期許；後者以批判口吻凸顯嚴肅議題
  - label: B
    content: 兩首詩都採用第一人稱寫成，對象都是高雄，展現作者對高雄的「愛之深，責之切」
  - label: C
    content: 前一首詩以「木棉花」花開花謝極快，像越野賽跑一般，展現了高雄急起直追的祈願
  - label: D
    content: 後一首詩以「煙囪」代表工業發展，批判環保單位躲避檢測責任，罔顧高雄市民健康
