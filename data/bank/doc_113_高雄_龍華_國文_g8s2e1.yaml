  stem: '根據本文，下列關於煮飯的四個訣竅，何者敘述正確？

    | 訣竅 | 做法 |

    |---|---|

    | （Ａ）米好 | 採收季節以夏季最好，黃梅天舂乾淨後攤開曝曬 |

    | （Ｂ）善淘 | 洗滌方式以籮筐盛裝，浸泡清水至澄淨沒有米色 |

    | （Ｃ）用火 | 火候先大後小，燜煮跟起鍋時間都要留意掌握好 |

    | （Ｄ）相米放水 | 水量多少要依照米種的不同及個人的喜好做調整 |'
  options:
  - label: A
    content: 米好：採收季節以夏季最好，黃梅天舂乾淨後攤開曝曬
  - label: B
    content: 善淘：洗滌方式以籮筐盛裝，浸泡清水至澄淨沒有米色
  - label: C
    content: 用火：火候先大後小，燜煮跟起鍋時間都要留意掌握好
  - label: D
    content: 相米放水：水量多少要依照米種的不同及個人的喜好做調整
  group_stem: '王莽云：「鹽者，百肴之將。」余則曰：「飯者百味之本。」《詩》稱「釋之溲溲① ，蒸之浮浮」。是古人亦吃蒸飯，然終嫌米汁不在蒸飯中。善煮飯者，雖煮如蒸，依舊顆粒分明，入口軟糯。其訣有四：一要米好，或香稻，或冬霜，或晚米，或觀音秈②
    ，或桃花秈，舂③ 之極熟，霉天風攤播之，不使惹霉發疹。一要善淘，淘不惜工夫，用手揉擦，使水從籮中淋出，竟成清水，無復米色。一要用火先武後文，悶起得宜。一要相米放水，不多不少，燥濕得宜。往往見富貴人家，講菜不講飯，逐末忘本，真為可笑。余不喜湯澆飯，惡失飯之本味故也。湯果佳，寧一口吃湯，一口吃飯，前後食之，方兩全其美。不得已則用茶、用開水淘之，猶不奪飯之正味。飯之味在百味之上，知味者遇好飯，不必用菜。                                              ──袁枚《隨園食單》

    注：① 溲：淘洗   ② 秈：一種米的類型   ③ 舂：把穀物以杵臼搗去皮殼'
