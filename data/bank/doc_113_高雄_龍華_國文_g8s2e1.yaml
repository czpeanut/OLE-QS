  stem: 下列文句「 」中的成語，何者運用最恰當？
  options:
  - label: A
    content: 他憑藉精湛操作與團隊配合，成功打破僵局，最後乘勝追擊，帶領隊伍「追亡逐北」奪下勝利
  - label: B
    content: 適逢「陽春白雪」的天候，今年武陵農場的櫻花花期稍晚，預計三月上旬進入最美的滿開時刻
  - label: C
    content: 穆桂英武藝超群、機智勇敢，與楊家將一起征戰衛國，屢建戰功，是「不櫛進士」的典型形象
  - label: D
    content: 這位世界冠軍的發球技巧高超，扣殺凌厲，對手面對他時雖然奮力抵抗，但仍難以「望塵莫及」
