  stem: "一.題目: 一份送不出去的禮物 \n二.說明: \n    「此物何足貴，但感別經時。」送禮是生活中的儀式感，可以聯繫感情、表達情感，不僅含有祝福、善意的傳遞以外，同時也能帶給雙方喜悅的滿足感。\
    \ \n    你是否曾經有過想送他人禮物，滿心期待包裝好，或者準備好後，因為某些原因而無法送出，以致心情惆悵的經驗。請以「一份送不出去的禮物」為題，說明事情的經過與當時的心情感受。\
    \ \n三.注意事項: \n1.依題意作答 \n2.請用本國文字書寫 \n3.不得在答案紙上註記任何符號及圖形 \n4.請用黑筆書寫  \n5.在文章內容中，不得洩漏基本資料"
