- id: doc_113_新北_江翠_國文_g8s1e1_s4_6
  section: 4
  number: 6
  type: single
  page: 4
  stem: 根據本文，下列說明何者正確?
  options:
  - label: A
    content: 彩色輪胎因混合了碳酸鈉與碳黑，所以形成七彩色澤
  - label: B
    content: 彩色輪胎加入碳酸鈉之後，耐磨成程度不亞於碳黑輪胎
  - label: C
    content: 為了量產，製造商將輪胎加入些許碳黑
  - label: D
    content: 輪胎中加入碳黑後，使汽車成為更普遍使用的交通工具
  group_stem: "(丙)自從充氣輪胎成為汽車必需品之後，為了改良與強化耐磨耗性等輪胎必備的物理性質，各輪胎製造商紛紛摩拳擦掌，競相投入研究與開發。一九ΟΟ年，英國橡膠公司銀鎮的馬達技師在不同種類的輪胎上使用不同顏色，讓人一眼就能分辨出輪胎種類，並在製造輪胎時加入一種名為「碳黑」的黑色物質，製作出黑色的輪胎來。碳黑是一種分子很細的碳素粒子，簡單來說就是「碳粉」。\n\
    \    黑色輪胎誕生之前，以天然橡膠製作的輪胎，通常都是乳膠的顏色，亦即奶油色。在馬達技師發揮創意，發明出黑色輪胎後，的確如他所料，一眼就能認出輪胎種類，但染成黑色的效果並非如此而已。除了方便辨識以外，還出現另外一個重要功用，那就是加入碳黑製成的黑色輪胎，可以瞬間提升耐磨耗性十倍以上。\n\
    直接使用在生橡膠中混入硫磺的加硫橡膠製成的輪胎，最大的缺點就是耐磨耗性很差。在加硫橡膠輪胎為主流的時代，由於輪胎磨耗相當嚴重，行走幾千公里，就必須更換汽車輪胎。混入碳黑之後，顯著提升輪胎耐磨耗性的技術逐漸成熟，於是出現了可行走數萬公里的輪胎，這是過去輪胎的十倍距離。若當年黑色輪胎沒有問世，汽車就不可能像現在這樣普及，也不可能發展出如此蓬勃的汽車社會。\n\
    \    為了強化耐磨耗性，在製造汽車輪胎時，製造商都會加入與生橡膠相同分量的碳黑，像這樣用來提升橡膠強度的工序稱為「補強」。而碳黑就是最適合的補強材料，截至目前為止，製造商還沒找到比碳黑更好的補強材料。雖然現在偶爾還是看得到白色或其他顏色的輪胎，但這些輪胎都會以碳酸鈣取代碳黑補強，不過，包括碳酸鈣在內的其他補強材料，效果明顯劣於碳黑。由於彩色輪胎的耐磨耗性較差，因此除非是特殊場合，否則一般人是不會使用的。(酒井伸雄\
    \ 扭轉近代文明的六種植物)"
