  stem: 有人勸說周處殺虎斬蛟，原因最不可能是下列哪一項？
  options:
  - label: A
    content: 說服周處出面代為鄉人除害
  - label: B
    content: 利用三橫互相殘殺，只餘一橫
  - label: C
    content: 希望周處能成為真正的俠士
  - label: D
    content: 趁機除掉周處這最大的禍害
  group_stem: '(甲)周處年少時，凶彊①俠氣，為鄉里所患。又義興水中有蛟，山中有邅跡虎，並皆暴犯百姓，義興人謂為「三橫」，而處尤劇。或說②處殺虎斬蛟，實冀「三橫」唯餘其一。處即刺殺虎，又入水擊蛟，蛟或浮或沒，行數十里，處與之俱，經三日三夜，鄉里皆謂已死，更相慶。竟殺蛟而出。聞里人相慶，始知為人情所患。有自改意，即自吳尋二陸③，平原不在，正見清河，具以情告，並云：「欲自修改而年已蹉跎，終無所成。」清河曰：「古人貴朝聞夕死，況君前途尚可。且人患志之不立，亦何憂令名不彰邪？」處遂改勵，終為忠臣孝子。（《世說新語．自新》）

    ※注：①凶彊：兇惡而頑強 ②說：音ㄕㄨㄟˋ，勸說、遊說③二陸：陸機、陸雲兄弟齊名，稱為二陸，吳人。陸機後來在晉朝曾任平原郡內史，陸雲曾任清河郡內史，所以下文直呼為平原、清河。'
