- id: doc_113_新北_江翠_國文_g8s1e1_s3_19
  section: 3
  number: 19
  type: single
  page: 3
  stem: "若到市場購買珍珠芭樂或泰國芭樂，再如何啃咬，就是少了土芭樂的土香。但一顆顆都比土芭樂肥大三、四倍，果肉飽滿，清脆均勻，口感扎實許多。晚近也有改良的土芭樂，果肉增厚許多，種子亦少了，只是仍不及這些外來種。\n\
    其實，小時摘食土芭樂，幽微地隱含著種種無奈。一來樹身滑溜不好攀爬，果實各自散在枝椏末梢，常得冒著摔落的危險。再則整棵樹的果實，往往不同時間成熟，每回只能摘到四、五顆好吃的。多數果肉熟度亦不平均，常常只咬二、三口，就得丟棄。此外，籽特別多，常要提醒自己不能亂吃，以免便祕。\n\
    但年紀老大了，再吃到這種童年貧窮時充飢的小水果，竟然有了「牛頓在蘋果樹下，被掉落的蘋果打到頭」後的那種頓悟。突然間，幼年對它的偏見，這時都了然了。原來，這都是它的生長策略。為了繁衍後代它必須讓自己香氣四溢，吸引覓食者到來。但為了保護自己，結出的果實，又刻意在不同的時間成熟，以免被我們這些惡童或鳥群吃光。果肉更常半硬半熟，讓你咬一、二口即想棄食，丟到遠方。你若這麼動作，它也有了在他地發育小苗的機會。（節錄自劉克襄〈土芭樂的生存之道〉）\n\
    \    根據上文，下列敘述何者正確？"
  options:
  - label: A
    content: 珍珠芭樂的果肉熟度不均，而土芭樂的果肉脆實飽滿
  - label: B
    content: 泰國芭樂具有獨特土香，加上果肉種子少，受到市場歡迎
  - label: C
    content: 土芭樂產量少，整棵樹僅有四、五顆，加上籽多，只能拿來充飢
  - label: D
    content: 香氣濃郁，讓覓食者前來吃果實，其實就是土芭樂生存的方法之一
  tags:
