  stem: What is the reading about?
  options:
  - label: A
    content: What a designer mother does in a day.
  - label: B
    content: A cool glass that can be bought in stores.
  - label: C
    content: A new future technology that might happen.
  - label: D
    content: Things doctors can do when they are at work.
  group_stem: "題組B(34-36)\n    In a world where technology advances quickly, it is\
    \ possible that our world would be filled with “glass” in the future.\n  In 2011,\
    \ a company made two videos about how our future life would be like if it is made\
    \ of glass. The first video was about the life of a mother, who is a designer,\
    \ and the father, who is a doctor. When the mother woke up, the glass walls inside\
    \ the bathroom can work as her cellphone. The glass told her what she is going\
    \ to do today. For example, she has a meeting today, and needs to wear nice clothes.\
    \ The glass walls can even help her with choosing clothes! As for the father,\
    \ he could use the glass wall to project the body of the sick people and could\
    \ see the parts that went wrong.\n  Although it sounds very cool and interesting,\
    \ a world full of glass could have lots of problems as well. Some people are worried\
    \ about the privacy because your fingerprints can stay on the glass for a long\
    \ time; some people worry that the glass would be dirty, and people might get\
    \ sick using it; and others worry that it would cost a lot of money.\n      advance發展\
    \  project投射  privacy隱私  fingerprints指紋"
  tags:
    textbook: 九上 英語 閱讀理解（短文、書信、圖表、廣告）
    labeled_by: ai
    chapter:
