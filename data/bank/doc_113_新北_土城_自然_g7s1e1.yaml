- id: doc_113_新北_土城_自然_g7s1e1_s3_31
  section: 3
  number: 31
  type: single
  page: 4
  stem: 文中提到，精子在衝向卵子前，會靠著粒線體全力衝刺，粒線體的功能是什麼？
  options:
  - label: A
    content: 儲存養分
  - label: B
    content: 產生養分
  - label: C
    content: 提供能量
  - label: D
    content: 生命中樞。
  group_stem: '請閱讀這篇文章後回答第31-32 題：

    一直以來，我們從課本上學到：人類的粒線體只會來自母親，為什麼粒線體DNA 在多數的情況下都來自母親呢？每個細胞擁有數個粒線體，不同於細胞核，粒線體擁有獨立的
    DNA （mitochondrial DNA, mtDNA），這要回溯到生命的起源：粒線體其實是被其他細胞吞下去的細菌，但它順利的和原始細胞共生，保留了自己的
    DNA，而最後演化成粒線體。我們的基因經過重組，一半來自父親、一半來自母親，但為什麼唯獨粒線體 DNA 一定來自母親呢？在受精的過程當中，精子的粒線體基本上是不會進入卵子，那些不小心進入卵子的精子粒線體
    （paternal leakage），會被標記，這些被標記的粒線體最終只會走向死亡，被分解，身體會有如此的保護機制可能的原因是：

    （1） 精子的DNA 突變機率比較高，因為精子在衝向卵子前，靠著粒線體全力衝刺，衝刺過程中粒線體已經被使用過度，難免會有些受損，如果這些突變的 mtDNA
    被保留，對細胞造成危害的風險也會提高。

    （2） 細胞內的粒線體 DNA 必須保持均一性，細胞就是個小工廠，細胞核和粒線體需要完美的配合，如果一個細胞中含有不一樣的粒線體，使細胞核和粒線體無法有效的合作，可能會造成粒線體失去功能，甚至造成糖尿病或癌症等疾病。

    －摘錄修改自《粒線體一定是母系遺傳？爸爸偶爾也是有戲份的！》。'
