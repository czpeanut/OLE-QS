- id: doc_113_高雄_五福_數學_g7s1e1_s3_2
  section: 3
  number: 2
  type: calc
  page: 3
  stem: '全世界劃分為 $24$ 個時區，以英國 格林威治的子午線作為全球的計時基準，經度每 $15$ 度會產生 $1$ 小時的時差。

    下表為各城市與格林威治的時差，格林威治以東的地區，時間為增加，以「$+$」標記；格林威治以西的地區，時間為減少，以「$-$」標記。整理如下：

    | | 臺北 | 紐約 | 雪梨 | 東京 |

    | :---: | :---: | :---: | :---: | :---: |

    | 時差(時) | +8 | -4 | +11 | +9 |

    從上述內容可以得知，格林威治中午 $12$ 時，紐約當地的時間是上午 $8$ 時，而雪梨當地的時間是晚上 $11$ 時。

    請問從臺北直飛到紐約的航班，共需 $15$ 小時。如果小伶 $10$ 月 $7$ 日晚上 $10$ 時從臺北出發，那麼抵達紐約時，紐約當地的時間為幾月幾日幾時？'
  assets:
