  group_stem: 'Little Johnny worked in a shoe factory, but he did not work hard. At
    last, he lost his job. He looked in the newspaper and found one bookstore needed
    a clerk.

    “I’m going to the bookstore to ask for the job tomorrow. It’s an easy one.”

    The next day, Johnny went to the bookstore. The shopkeeper gave him a piece of
    paper and asked him to answer the questions on the paper. One of the questions
    was, “Were you in prison before?” Johnny smiled and wrote, “No.” on it. And the
    next question was, “Why?” He thought for a while and wrote, “Because the police
    didn’t catch me.”

