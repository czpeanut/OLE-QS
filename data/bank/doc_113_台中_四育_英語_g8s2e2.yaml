  - label: B
    content: To find lost backpack
  - label: C
    content: To smell out illegal food items
  - label: D
    content: To play a toy
  group_stem: '🐶 A Special Dog at the Airport

    Lucky is a beagle. It works at the airport in Taiwan. He is a special dog. Every
    day, Lucky walks with his handler and smells travelers’ bags. He looks for food
    like meat, fruit, or plants. These things can bring bad insects or diseases to
    Taiwan. One day, Lucky smelled something strange in a man’s backpack. He sat down
    to tell his handler. The handler opened the bag and found meat from another country.
    It was not allowed. “Good job, Lucky!” the handler said and gave him a toy. Lucky
    wagged his tail and looked happy.


    Quarantine dogs like Lucky are very important. They help keep Taiwan safe from
    harmful pests and sicknesses. Many of them are beagles or Labradors because they
    have a good sense of smell and are friendly. They train for many months before
    working at the airport.

    Next time you go to the airport, you might see a dog like Lucky. Just remember
    — they are working, so don’t touch them without asking!

    ★beagle 米格魯 handler 訓獸師 disease 疾病 allow 允許 wag 搖 quarantine 防疫 harmful pest 害蟲'
