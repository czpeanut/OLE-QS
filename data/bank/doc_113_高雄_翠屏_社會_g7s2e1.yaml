  section: 3
  number: 59
  type: single
  page: 10
  stem: 以往，我國社會的結婚流程是非常複雜的，從迎親、拜別、喜宴到歸寧都很講究。絕大多數的人們也都會一一遵循，照章行事。這是受到下列何種社會規範的約束與影響？
  options:
  - label: A
    content: 風俗習慣
  - label: B
    content: 倫理道德
  - label: C
    content: 宗教信仰
  - label: D
    content: 法律。
  group_stem: 5. 每個社會都從自身文化發展出各種規範，對其成員提供日常生活的行為準則，使人與人之間的互動行為有所依循，藉以維持社會的秩序與和諧。以「結婚」為例，從籌辦婚禮的過程、結婚典禮的儀式，以及結婚後雙方應承擔的責任與義務等，在在都受到社會規範的約束與影響。請回答下列問題：
