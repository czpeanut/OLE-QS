  section: 2
  number: 34
  type: single
  page: 6
  stem: 總督府在臺灣實施「國語家庭」的認證，主要目的為何？
  options:
  - label: A
    content: 將臺灣視為無異於日本內地的領土而推廣
  - label: B
    content: 希望藉以落實臺語成為臺灣人的生活用語
  - label: C
    content: 考量臺灣治安不佳為加強穩定秩序而實施
  - label: D
    content: 因應戰爭爆發需強化臺人對日本的愛國心。
  group_stem: '3. 請閱讀短文，並回答下列問題。

    西元1937 年，總督府在臺灣實施推廣「國語家庭」，凡符合下列條件者，即可向地方州廳的「常用國語家庭審查委員會」申請，通過審核後即獲頒為「國語家庭」。得到「國語家庭」的認證，除了被視為家庭的榮耀外，更享有一些實質上的優惠，例如：准予國語家庭的子女進入程度較高的小學校或進入中等學校就讀、被任用為官公署職員、較易申請各種營業許可等。以上優惠條件刺激了當時臺人申請國語家庭的意願。直至西元1942
    年，全臺灣已有近一萬戶的「國語家庭」，總人數占當時人口的1.3%。'
  tags:
