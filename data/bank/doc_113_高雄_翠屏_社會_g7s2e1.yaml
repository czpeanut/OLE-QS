  group_stem: 2. 當歐洲人來到美洲新大陸，白人與印地安原住民間的衝突從未停止。白人為奪取土地，奴役或殺害許多印地安原住民。原住民們被迫逃離家園，就連原本的生活方式、宗教信仰等也受到歐洲人很大的影響。後來，美國設置印地安保留區，除了讓原住民族有一塊棲息地外，也期望保留區的自治能讓其文化得以保留與傳承。以目前的情況來看，保留區的族人大多仍過著貧窮的生活，年輕人則被迫離開保留區出外謀生。請回答下列問題：
