  stem: 臺灣常見各類東南亞料理，如越南菜、泰國菜等，但其實常在泰國餐廳吃到的料理，不是來自泰國，還能紅回泰國。像正宗的打拋豬，不是使用九層塔而是打拋葉，也沒有像臺灣一樣加入番茄；泰國人原本吃的是用蝦泥包裹麵包粉油炸的金錢蝦餅，月亮蝦餅則是泰國留學生來臺灣發明的料理，之後卻成為臺灣泰式餐廳的經典菜色。像這樣異國傳入，再轉化成帶有臺灣色彩的全新料理，顯示出臺灣的何種文化特色？
  options:
  - label: A
    content: 侵略性
  - label: B
    content: 普及性
