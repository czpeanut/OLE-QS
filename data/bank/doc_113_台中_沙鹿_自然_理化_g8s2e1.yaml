- id: doc_113_台中_沙鹿_自然_理化_g8s2e1_s3_39
  section: 3
  number: 39
  type: single
  page: 3
  stem: 氮氧化合物($\mathrm{NOx}$)經過觸媒轉換器轉變為氮氣($\mathrm{N_{2}}$)的過程發生了什麼反應？
  options:
  - label: A
    content: 失去了氧原子，故發生還原反應
  - label: B
    content: 得到了氧原子，故發生還原反應
  - label: C
    content: 失去了氧原子，故發生氧化反應
  - label: D
    content: 得到了氧原子，故發生氧化反應。
  group_stem: '臺灣平均每個家庭幾乎都有一輛汽車，臺灣汽車總數將近五百萬輛，這麼多車輛排放的廢氣若未經處理，會造成嚴重的空氣污染。我國汽車排氣法規管制的排放污染物有一氧化碳（$\mathrm{CO}$）、氮氧化合物（$\mathrm{NOx}$）及碳氫化合物（$\mathrm{HC}$），其中以管制氮氧化合物與碳氫化合物排放量最重要，因為它們經由陽光照射後很容易生成光化學霧，而造成嚴重的空氣污染並危害居民的呼吸道系統。為了有效控制污染物的排放，汽車都裝置觸媒轉化器。這些污染物在觸媒活性物質表面上發生一連串氧化及還原化學反應。

    而機車同樣有排氣污染的問題，基本上，汽車與機車觸媒轉化器的功能與製備方式相似，但因為機車避震效果不佳，蜂巢狀陶瓷基材長期使用容易碎裂，所以機車觸媒轉化器採用蜂巢狀金屬基材為載體，並附有鉑、鈀及銠等貴重金屬，利用金屬鉑、鈀或銠為材料，將廢氣中的
    $\mathrm{CO}$、$\mathrm{HC}$、$\mathrm{NOx}$ 等氣體轉化為 $\mathrm{N_{2}}$、$\mathrm{CO_{2}}$、$\mathrm{H_{2}O}$，其化學反應式如下：

    $\mathrm{NOx} + \mathrm{CO} + \mathrm{HC} \xrightarrow{鉑、鈀、銠} \mathrm{N_{2}} +
    \mathrm{CO_{2}} + \mathrm{H_{2}O}$'
