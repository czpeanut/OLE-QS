- id: doc_113_台中_沙鹿_自然_理化_g8s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 同學們觀察到日常生活中有許多的金屬製品表面都會鍍上一層薄薄的鋅來防鏽，於是乎開始討論為何鋁可以用於防鏽，以下是同學們發表的觀點，請問下列哪位同學提出來的觀點正確？
  options:
  - label: A
    content: 鉑維：鋁的活性很小，因此不容易氧化，故能達到防鏽的效果
  - label: B
    content: 思近：鍍鋁可以使鋁和鐵形成合金，降低鐵的活性，達到防鏽的效果
  - label: C
    content: 泓毅：鋁的活性很大，很容易氧化，但氧化鋁質地細密，可以保護內層的金屬避免內部金屬生鏽
  - label: D
    content: 詠晴：由於鋁的活性很大，因此鍍的鋁越厚，反而會降低其防鏽效果。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
