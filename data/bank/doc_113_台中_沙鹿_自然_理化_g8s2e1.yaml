  group_stem: '在演唱會或是營火晚會時，時常會使用螢光棒來營造氣氛，將螢光棒折到發出「喀喀」聲時，原本黯淡無光的它，就轉變成自帶光芒的螢光棒了！這其中到底有什麼機關可以讓它發光呢？

    那個聲響就是其中的關鍵所在！螢光棒的內外層分別裝有不同成分的液體，中間有一根薄透的玻璃管，管中填裝著過氧化氫水溶液，外層塑膠管與玻璃管之間的夾層裝有酯類化合物及螢光染料。當玻璃管折斷後，過氧化氫水溶液與酯類化合物反應時，酯類被氧化後會產生能量，能使螢光染料發光，但這個反應的過程中僅有亮光而不會產生熱。

    螢光棒有許多不同的顏色，造成的差異便是因為螢光染料改變而產生不同的變化，只要在夾層中加入不同螢光劑就能達到如此效果，像是藍色光、綠色光、紅色光等顏色。除了這些顏色外，如要調製出其他顏色則可以參考光的三原色混合調配而成。近年來螢光棒被廣泛利用，其安全問題也引起關注，因螢光棒內的成分含有微量毒性而引起安全疑慮，但其實只要不過度彎折或是切割就不易使液體滲出，使用得當就相當安全。'
