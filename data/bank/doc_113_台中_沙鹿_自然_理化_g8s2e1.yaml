  group_stem: '鋁合金輪轂在拋光時產生的大量鋁粉、粉塵遇到明火容易發生鋁粉爆炸、粉塵爆炸事故。某間摩托車配件工廠於下午發生火警，當時有熱心民眾立即取水撲救，然而場內存放的廢棄鋁粉屬於「禁水性物質」，一遇到水容易產生可燃性氣體，反而使火勢更加猛烈，並不停起火冒煙爆炸造成更多傷亡，場面驚險。上述事件中，鋁粉遇水的反應式如下：

