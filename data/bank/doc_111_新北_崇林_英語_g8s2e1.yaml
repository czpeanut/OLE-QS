  stem: What can we know from the reading?
  options:
  - label: A
    content: The total death number in the earthquakes in the world is 45,968.
  - label: B
    content: The tickets for flights and trains are expensive, so people can’t leave
      their home.
  - label: C
    content: It is important to find a safe place to stay for people in the earthquake
      zone.
  - label: D
    content: Everyone in Turkey wants to leave their hometown as soon as possible.
  group_stem: 'C.

    It is over a month since the big earthquakes in Turkey - with officials putting
    the number of deaths in Turkey alone at 45,968. Those who survived face an uncertain
    future. One of their most serious problems is finding somewhere safe to live.
    At least 1.5 million people are now homeless, and no one knows how long it will
    take to find them proper shelter.

    The officials say almost two million people have now left the earthquake zone.
    Some are living with friends or loved ones elsewhere in the country. Flights and
    trains out of the place are free to those who want to leave. But in the town of
    Samandag, Songul is clear that she and her family aren''t going anywhere. "This
    is very important for us. We will stay here. This is our home, our nest. Everything
    we have is here. We are not going to leave."

    Right now, the whole family is living in three tents just a few steps away from
    their damaged home. They sleep and eat there, sharing food cooked on a small camping
    stove. There''s no proper toilet, although they''ve fixed one from the bathroom.
    They''ve even created a small shower area. But it''s all very basic, and the lack
    of space and privacy makes them uncomfortable. It''s been an agonizing month for
    Songul. Seventeen of their relatives were killed in the earthquake. She said,
    "There''s always the fear. What will happen next? We just don''t know."


