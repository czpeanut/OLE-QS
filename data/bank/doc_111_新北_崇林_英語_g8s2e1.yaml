  group_stem: 'D.

    Dear Mom and Dad,

    I know I am the oldest kid in the family. I struggled for a long time, and I decided
    to tell you the truth. It’s OK that you want me to finish my homework by myself.
    It’s OK that you ask me to go to school by myself. It’s even OK that you ask me
    to make dinner by myself. However, I really hate it when you ask me to take Debby
    and Mina to the park. They never listen to me. They climb up rocks in the park
    and make loud noises. They play with water in the park and make themselves wet.
    It’s really annoying to be with them. I give you my words that I will take good
    care of them at home, but could you please don’t make me go out with them next
    time?

    Fiona'
