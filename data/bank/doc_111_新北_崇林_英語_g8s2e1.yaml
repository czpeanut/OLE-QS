- id: doc_111_新北_崇林_英語_g8s2e1_s4_4
  section: 4
  number: 4
  type: single
  page: 3
  stem: Which is true about mosquitoes?
  options:
  - label: A
    content: Mosquitoes can bite people and suck people’s blood, but they can’t spread
      diseases.
  - label: B
    content: Using repellents is the most effective way to kill mosquitoes.
  - label: C
    content: Adding some tea tree oil in the water helps to get rid of the mosquitoes
      forever.
  - label: D
    content: The only place on earth without mosquitoes is Iceland.
  group_stem: 'B.

    Mosquitoes bite, suck your blood, make you feel itchy, and even spread a lot of
    diseases. While you might think about living in a mosquito-free world, killing
    them all would be terrible for the environment. The best we can hope for is to
    repel them and kill them only within our backyards and homes.

    If you''re serious about killing mosquitoes, you''ll need to use different kinds
    of ways. First, you need to understand the difference between repelling mosquitoes
    and killing them. Repellents make a place (like your home or your skin) less attractive
    to mosquitoes, but don''t kill them. So, smoke or tea tree oil may keep the insects
    away, but won''t get rid of them in the long run. Some mosquitoes need water to
    breed, so one of the most effective ways of kill them is to take away open containers
    with water inside. It kills the larvae living in them before they get a chance
    to grow. Another solution is to bring in animals that eat larvae and adult mosquitoes.
    Some fish eat mosquito larvae. Dragonflies, frogs and spiders all eat mosquitoes.

    In fact, some mosquitoes are important food for other animals. Killing them all
    could do harm to the environment. If you really want to live in a world without
    mosquitoes, your best choice is Iceland


