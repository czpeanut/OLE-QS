  group_stem: "有一次在森林旅行時，我遇見一對騎摩托車的賞鳥年輕朋友，正巧也來到這個區域，尋找要拍攝的鳥類。他們問我是否看到了特殊的鳥種。我跟他們提及一隻臺灣藍鵲，他們便急著追問發現的時地。然後，迫不及待的匆匆道別，向臺灣藍鵲出現的地點奔馳而去。\n\
    \  這時，另有一個中年陌生的賞鳥朋友走來，也向我打招呼。我還以點頭微笑，正要擦身離開時，只聽他喃喃的說，現在的年輕人只急著想拍攝鳥類，根本喪失賞鳥的樂趣了。\n\
    \  我在旁怵然一驚，一邊走著，一邊思考這一句切中時弊的話。我實在無法判斷，到底哪一方麵的行為才是正確。\n  近幾年來，臺灣的賞鳥人口日增，質量與數量都有顯著的改進。而且賞鳥的目的也趨向多元，不像早年有些人賞鳥，只視為休閒活動。如今，有的人只拍攝鳥類，有的只蒐集鳥蛋，也有的人只從事繪鳥的工作。（劉克襄\
    \ 賞鳥哲學家）"
