- id: doc_113_高雄_翠屏_國文_g8s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 「陽光晒在棉被上，溼冷的霉味很快被蒸發掉，棉花一旦晒透，略加搓揉就能夠恢復鬆軟，於一絲絲纖維之間騰挪出空隙，儲存許多溫暖和新鮮的氣味，讓人在睡夢裡都能呼吸到陽光的味道。」這段文字主要在表達下列何者？
  options:
  - label: A
    content: 陽光的功效
  - label: B
    content: 棉被的變化
  - label: C
    content: 睡眠的重要
  - label: D
    content: 氣味的轉移。
  lesson_raw:
    title: 冬陽
    basis: 引用簡媜〈冬陽〉課文原句
- id: doc_113_高雄_翠屏_國文_g8s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 下列選項「 」中的字，何者讀音前後相同？
  options:
  - label: A
    content: 「纖」維／抽「籤」
  - label: B
    content: 「熾」烈／旗「幟」
  - label: C
    content: 油「垢」／邂「逅」
  - label: D
    content: 徜「徉」／「佯」裝
- id: doc_113_高雄_翠屏_國文_g8s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 「一看見洋老頭的車開進開出，耳邊就響起飯勺叮叮咣咣的聲音。」句中的「叮叮咣咣」為狀聲詞，形容金屬器物互相碰擊的聲音。下列選項，何者也可用來表示「金屬相互撞擊聲」？
  options:
  - label: A
    content: 丁丁
  - label: B
    content: 蕭蕭
  - label: C
    content: 颯颯
  - label: D
    content: 錚錚。
  lesson_raw:
    title: 拆牆
    basis: 引用李黎〈拆牆〉課文原句
- id: doc_113_高雄_翠屏_國文_g8s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 拆牆一文中，蓋茲因為郵差送錯生日賀卡而到含月家。作者在此時描寫含月的狀況是「正對著自己孤獨的生日晚餐流淚」。下列選項，何者較可能是含月流淚的原因？
  options:
  - label: A
    content: 想起過世的啟華，因而傷感
  - label: B
    content: 飯前忘記禱告，正對著上帝懺悔
  - label: C
    content: 喜極而泣，開心蓋茲的到來
  - label: D
    content: 為自己沒人祝福而傷心難過
  lesson_raw:
    title: 拆牆
    basis: 題目指明出自課文拆牆
- id: doc_113_高雄_翠屏_國文_g8s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 〈愛蓮說〉：「予獨愛蓮之出淤泥而不染，濯清漣而不妖。」由這句話可知，作者喜愛蓮的哪些特質？
  options:
  - label: A
    content: 出塵脫俗，俏麗多姿
  - label: B
    content: 平易近人，和藹親切
  - label: C
    content: 氣宇不凡，威風凜凜
  - label: D
    content: 潔身自愛，端莊高雅
  lesson_raw:
    title: 愛蓮說
    basis: 引用周敦頤〈愛蓮說〉課文原句
- id: doc_113_高雄_翠屏_國文_g8s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 〈愛蓮說〉：「中通外直，不蔓不枝；香遠益清，亭亭淨植，可遠觀而不可褻玩焉。」根據這段文字，關於蓮所象徵的君子特質，下列分析何者正確？
  options:
  - label: A
    content: 「中通外直」代表君子坦率直爽
  - label: B
    content: 「不蔓不枝」指君子不攀附權貴
  - label: C
    content: 「香遠益清」代表君子恬淡寡欲
  - label: D
    content: 「亭亭淨植」指君子清靜無為
  lesson_raw:
    title: 愛蓮說
    basis: 引用周敦頤〈愛蓮說〉課文原句
- id: doc_113_高雄_翠屏_國文_g8s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 下列文句，何者用字完全正確？
  options:
  - label: A
    content: 九二一大地震後，許多人對地震餘痵猶存，六月接連著兩天的六級地震，讓大家心驚膽戰，再度煥起九二一的可怕記憶
  - label: B
    content: 大甲 媽祖八天七夜的繞境進香活動，所到之處，萬人空巷，當媽祖起駕回鑾返抵鎮瀾宮，許多善男信女仍絡譯不絕前去朝拜，讓鎮瀾宮香火頂盛
  - label: C
    content: 澄清湖的蓮與白河的蓮有同樣的美，在湖河之中的朵朵嬌顏，不受遊客的喧擾，兀自盛開
  - label: D
    content: 為健全國內交通法規，交通部開會研商「道路交通管理處罰條例」修正草案，以後民眾据繳罰鍰，即強制送交通法庭裁處，不再逕行吊扣或吊消駕照。
- id: doc_113_高雄_翠屏_國文_g8s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 〈愛蓮說〉一文中，作者將蓮花比喻為君子，下列「 」中由植物構成的詞語，何者亦可指稱「君子」？
  options:
  - label: A
    content: 「椿萱」並茂
  - label: B
    content: 「桑榆」晚景
  - label: C
    content: 「桃李」滿天下
  - label: D
    content: 「松柏」後凋於歲寒
  lesson_raw:
    title: 愛蓮說
    basis: 題目指明出自課文愛蓮說
- id: doc_113_高雄_翠屏_國文_g8s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 「俗話說：『一枝草，一點露』，陶淵明□□□□、離群索居，過著躬耕的生活；周敦頤□□□□、鄙棄世俗的爭名逐利，他們都堅持理想而找到自己的發展空間。」以上缺空處，依序應填入何者最恰當？
  options:
  - label: A
    content: 任真自得、潔身自愛
  - label: B
    content: 悲天憫人、仁民愛物
  - label: C
    content: 久病厭世、好大喜功
  - label: D
    content: 自力更生、處事圓融。
- id: doc_113_高雄_翠屏_國文_g8s1e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 阿寶老師要同學練習成語造句，下列文句「 」中的成語運用，何者最恰當？
  options:
  - label: A
    content: 星宇：他平日「瞵視昂藏」，所以至今一點積蓄都沒有
  - label: B
    content: 居澤：「萍水相逢」的人不容易成為長久交往的朋友
  - label: C
    content: 宜安：夸父竟想追逐太陽，可見他有「臨風顧盼」的毅力
  - label: D
    content: 姝涵：班上的合唱團正在苦練，高亢的樂音可說是「市聲鼎沸」
- id: doc_113_高雄_翠屏_國文_g8s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 「冬天還有遮風的棉罩，十分地『優待』。」這句話使用了倒反修辭技巧，與下列何者相同？
  options:
  - label: A
    content: 我那時真是聰明過分，總覺他說話不大漂亮，非自己插嘴不可
  - label: B
    content: 有時是獨奏，有時是合唱，簡直是一派和諧的交響樂
  - label: C
    content: 由遠叫到近，由近叫到遠
  - label: D
    content: 喜鵲不知逃到哪裡去了。
  lesson_raw:
    title: 鳥
    basis: 引用梁實秋〈鳥〉課文原句
- id: doc_113_高雄_翠屏_國文_g8s1e3_s1_18
  section: 1
  number: 18
  type: single
  page: 3
  stem: （甲）肆無忌「憚」 （乙）「簞」食瓢飲 （丙）「殫」精竭慮 （丁）噤若寒「蟬」 （戊）邯「鄲」學步。以上「 」中的字，哪幾項讀音相同？
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲丙戊
  - label: C
    content: 乙丙丁
  - label: D
    content: 乙丙戊。
- id: doc_113_高雄_翠屏_國文_g8s1e3_s1_19
  section: 1
  number: 19
  type: single
  page: 3
  stem: 下列文句「 」中的詞語，何者可用以表示「一會兒」？
  options:
  - label: A
    content: 棉花「一旦」晒透，略加搓揉就能夠恢復鬆軟
  - label: B
    content: 偷閒到燦亮冬陽下坐臥「片刻」
  - label: C
    content: 火候到了，腥臊味「即刻」被驅除
  - label: D
    content: 用蔗渣熏烤的板鴨以及垂掛在竹竿上的香腸和臘肉，「不時」地衝擊人們的嗅覺
- id: doc_113_高雄_翠屏_國文_g8s1e3_s1_20
  section: 1
  number: 20
  type: single
  page: 3
  stem: 下列文句，何者具有「被動」的語態？
  options:
  - label: A
    content: 火候到了，腥臊味即刻被驅除，剩下的盡是佐料肉汁滲入湯頭的濃郁香味
  - label: B
    content: 雞隻和小狗各自找個角落刨出窟窿，把身子窩在裡頭晒太陽
  - label: C
    content: 家家戶戶睡覺蓋的，通常是祖傳的老棉被，又硬又重
  - label: D
    content: 找棉被店師傅拆散被胎，添些新棉花重新彈製
- id: doc_113_高雄_翠屏_國文_g8s1e3_s1_21
  section: 1
  number: 21
  type: single
  page: 3
  stem: 下列選項「 」中的詞語，何者意思前後相同？
  options:
  - label: A
    content: 每到月底，會計小姐總是忙著加班「算帳」／你的態度惡劣，當心被人秋後「算帳」
  - label: B
    content: 在破除迷信時，有許多「偶像」被隨意棄置在路旁／他的「偶像」一個月變一次，真是花心
  - label: C
    content: 「饕餮」過後，大家從飯廳移到客廳聊天／古人會在青銅器上裝飾「饕餮」面紋
  - label: D
    content: 交疊的山峰「參差」不齊，倒映在湖面上／庭院中花草「參差」，是時候修剪一番了
- id: doc_113_高雄_翠屏_國文_g8s1e3_s1_22
  section: 1
  number: 22
  type: single
  page: 3
  stem: 在國際化的時代，各文化密切的交流已成為一種常態。因此，在我們的日常生活中常常不自覺的使用到許多外來語。下列文句，何者沒有使用到外來語？
  options:
  - label: A
    content: 放學回家後，常常看到下班後筋疲力竭的爸爸癱軟在沙發上
  - label: B
    content: 每當媽媽從廚房出來，看到爸爸這副模樣，總會大發雷霆，罵爸爸是會呼吸的肉
  - label: C
    content: 面對媽媽的斥責，爸爸總是嘻皮笑臉的，一點也不動怒，就像尊菩薩一樣
  - label: D
    content: 而面對笑臉以對的爸爸，媽媽也只能無奈的回到廚房繼續幫我們準備明天的便當
- id: doc_113_高雄_翠屏_國文_g8s1e3_s1_23
  section: 1
  number: 23
  type: single
  page: 3
  stem: 現代人在說話時經常會不自覺的加入許多不必要的詞語，雖不影響語意的表達，卻也無形中增添聽者的理解困難與障礙。下列文句，何者用語最為通順？
  options:
  - label: A
    content: 珍珠奶茶的潮流瞬間席捲囊括日本年輕一代，街上人手一杯杯，蔚為風潮
  - label: B
    content: 昨天晚上由於因為打電動的關係太晚睡了，害我早上遲到，被老師臭罵一頓
  - label: C
    content: 現在幫你做一個上菜的動作，請小心，盤子很燙
  - label: D
    content: 對我來說，每天的能量來源是早晨的一杯奶茶，除此之外別無他物
- id: doc_113_高雄_翠屏_國文_g8s1e3_s1_24
  section: 1
  number: 24
  type: single
  page: 3
  stem: 下列節選自〈拆牆〉一文的文句，何者最能代表「文化隔閡」？
  options:
  - label: A
    content: 老藤緊貼著牆扭來扭去，扭著扭著就張開了一片片心形的綠葉
  - label: B
    content: 你知道她叫他什麼——「挨千刀的」。聽說，那意思就是要割她丈夫一千刀
  - label: C
    content: 蓋茲從來沒有想過一牆之外會是這麼一個讓他好奇的世界
  - label: D
    content: 星空月下，風鈴晃出的曲子和鋼琴奏出的音樂一樣動聽。
  lesson_raw:
