  stem: 根據本文，關於阿美族與卑南族的母系社會文化敘述，下列何者錯誤？
  options:
  - label: A
    content: 入贅婚制，男性婚後居住在女方家中，負責改善妻家生活
  - label: B
    content: 由女性擔任家長，子女以母親的姓氏作為命名原則
  - label: C
    content: 男性負責處理部落中政治、軍事、司法、宗教等事務
  - label: D
    content: 女性可以參與公眾事務，並擔任部落中的首長與祭司。
  group_stem: "在臺灣原住民中，分布於臺灣東部的阿美族與卑南族，是最為特殊的民族，因為這兩個民族都是典型的母系社會。\n  母系社會，是指女性在家族中具有絕對優勢的地位，男性則處從屬地位，因此採取贅婚制度，婚後共同居住在女方家中。阿美族的男性認為，入贅是一種光榮，因為丈夫可以藉此機會改善妻子家中的生活情況。除此之外，在家族中，家長是由女性擔任，財產的繼承也是由母親傳給女兒；年幼的子女與母親居住，並以母親的姓氏作為命名的原則。\n\
    \  由上述的情況，可以推測，阿美族與卑南族似乎是一個女尊男卑的社會。但事實不然，除了母系社會的傳統外，另一項特色便是男性年齡階級制度。藉由不同年齡而將男性加以編組，負責處理部落中政治、軍事、司法、宗教等公共事務。女性雖然是家中的主宰；然而，家族對外的代表卻是由男性負責，女性無法參與部落中的公共事務，也不能進入部落中的男性會所，部落中的首長與祭司多半也是由男性繼承。\n\
    \  換言之，母系社會並非是女性權力至上的社會制度，而是透過男主外女主內的分工合作，來達成男女平等的一種社會模式。所以，女性負責操持家務、財產管理、農牧生產與孩童照顧；男性則肩負著狩獵、作戰等公共事務。\n\
    \  隨著日本在臺殖民與國民政府來臺，入贅婚的習俗，也隨著時代而改為父系社會的嫁娶婚，子女的姓氏也多跟隨父親。部落中的男性由於外出工作，也逐漸掌握家中經濟權力，傳統的母系社會色彩逐漸淡去，象徵著傳統原住民文化，在現代社會中受到的衝擊與變化。\n\
    （母親當家—阿美族、卑南族的母系社會）"
