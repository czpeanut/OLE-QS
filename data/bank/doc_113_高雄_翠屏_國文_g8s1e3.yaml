  type: single
  page: 1
  stem: 「鳥到了這種地步，我想牠的苦悶，大概是僅次於黏在膠紙上的蒼蠅；牠的快樂，大概是僅優於在標本室裡住著罷？」這段文字的主旨為何？
  options:
  - label: A
    content: 指出籠中鳥徒有生命，卻失去自由的苦悶
  - label: B
    content: 說明物競天擇的道理
  - label: C
    content: 強調弱肉強食的概念
  - label: D
    content: 譴責將蒼蠅黏在膠紙上的行為
  lesson_raw:
    title: 鳥
    basis: 引用梁實秋〈鳥〉課文原句
