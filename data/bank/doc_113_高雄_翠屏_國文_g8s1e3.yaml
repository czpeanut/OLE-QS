  group_stem: "冬天，一個冰寒的晚上。在寂寞的馬路旁邊候著最後一輛搭客汽車的，只我一人。雖然不遠的牆邊，也蹲有一團黑影，但他卻是伸手討錢的。馬路兩旁，遠遠近近都立著燈窗明燦的別墅，向暗藍的天空靜靜地微笑著。在馬路上是冷冰冰的，還刮著一陣陣猛厲的風。\n\
    \  那蹲著的黑影，接了我的一枚銅板，就高興地向我搭話：「真冷呀，再沒有比這裡更冷了……」\n  看見他並不是個討厭的老頭子，我便也高興地說道：「鄉下怕更要冷些吧？」\n\
    \  「不，不。」他接著咳嗽起來，要吐出的話，塞在喉管裡了。\n  我說：「為什麼？你看見一下霜，鄉下的房屋和田野，便在早上白了起來，街上卻一點也看不見。」\n\
    \  他捶了幾下胸口之後，興奮地接著說道：「是的，是的……鄉下冷，你往人家門前的稻草堆上一鑽就暖了哪……這街上，哼，鬼地方！……還有那些山裡呵，比鄉下更冷哩……」\n\
    \  接著他便說到壯年之日，在南方那些山中冬夜走路的事情。\n  他說晚上在那些山裡，只要你是一個正派的人，就可以朝燈火人家一直走去，迎著犬聲，敲開樹蔭下的柴門，大膽地闖進。對著火堆周圍的人們，不管他男的女的，用兩手向他們兩肩頭一分，就把你帶著風寒露溼的身子，輕輕地放了進去。燒山芋和熱茶的香味，便一下子撲入你的鼻子。抬頭看，四周閃著微笑的眼睛，歡迎著，毫沒有怪你唐突的神情。你剛開口說由哪來的時候，一杯很熱的濃茶，就遞在你的下巴邊上。老太婆吩咐她的孫女，快把火撥大些，多添點子柴，說是客人要烘暖他的身子。你暖和了，還不覺得疲倦的話，你可以摸摸小孩子的下巴，擰擰他們的臉蛋。年輕的媽媽，一高興了，便會慫恿她的孩子把拿著要吃的燒山芋，分開一半，放在你這位客人的手上。如果你要在他們家過夜，他們的招待，就更來得殷勤些。倘若歇一會，暖暖身子，還要朝前趕路，一出柴門，還可聽見一片歡送的聲音。老頭子講著講著，突然忘形地拉著我問道：\n\
    \  「先生，這到底是什麼原因哪？……這裡的人家，火堆一定燒得多的，看窗子多麼亮哪……他們為什麼不准一個異鄉人進去烤烤手哩？」\n  搭客汽車從遠處轟轟地馳來了，我趕忙擺脫他的手，高聲說道：「因為他們是文明的人，不像那些山裡的……」\n\
    \  跳進通明的汽車裡，驀地離開他了。但遠的南國山中，小小的燈火人家裡面，那些豐美的醉人的溫暖，卻留在我的冬夜的胸中了。（節選自艾蕪 冬夜）"
