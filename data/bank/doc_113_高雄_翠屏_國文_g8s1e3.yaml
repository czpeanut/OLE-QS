- id: doc_113_高雄_翠屏_國文_g8s1e3_s2_47
  section: 2
  number: 47
  type: single
  page: 8
  stem: 「我失去了視力，也失去了偏見，多麼幸福的事！」關於這句話的分析，下列何者正確？
  options:
  - label: A
    content: 老先生故意說反話，表達失明後心中深沉的哀痛
  - label: B
    content: 老先生反諷視力良好的人其實都充滿偏見，不懂得知福惜福
  - label: C
    content: 老先生直到失去視力，才不再感受到眾人對自己的歧視
  - label: D
    content: 老先生終於明白人的好壞與膚色無關，帶有「塞翁失馬，焉知非福」的感慨
  group_stem: "在從紐約到波士頓的火車上，我發現我隔壁座的老先生是位盲人。\n  我的博士論文指導教授是位盲人，因此我和盲人談起話來，一點困難也沒有，我還弄了一杯熱騰騰的咖啡給他喝。\n\
    \  當時正值洛杉磯種族暴動的時期，我們的談話因此就談到了種族偏見的問題。\n  老先生告訴我，他是美國南方人，從小就認為黑人低人一等。他家的佣人是黑人，他在南方時從未和黑人一起吃過飯，也從未和黑人上過學。到了北方念書，他有次被班上同學指定辦一次野餐會，他居然在請帖上註明「我們保留拒絕任何人的權利」。在南方這句話就是「我們不歡迎黑人」的意思，當時舉班譁然（１），他還被系主任抓去罵了一頓。\n\
    \  他說有時碰到黑人店員，付錢的時候，總將錢放在櫃臺上，讓黑人拿去，而不肯和他的手有任何接觸。\n  我笑著問他：「那你當然不會和黑人結婚了！」\n  他大笑起來：「我不和他們來往，如何會和黑人結婚？說實話，我當時認為任何白人和黑人結婚都會使父母蒙辱。」\n\
    \  可是，他在波士頓念研究所的時候，發生了車禍。雖然大難不死，可是眼睛完全失明，什麼也看不見了。他進入一家盲人重建院，在那裡學習如何用點字技巧，如何靠手杖走路等等。慢慢地也終於能夠獨立生活了。\n\
    \  他說：「可是我最苦惱的是，我弄不清楚對方是不是黑人。我向我的心理輔導員談我的問題，他也盡量開導我，我非常信賴他，什麼都告訴他，將他看成自己的良師益友。」\n\
    \  「有一天，那位輔導員告訴我，他本人就是位黑人。從此以後，我的偏見就慢慢完全消失了。我看不出人是白人，還是黑人。對我來講，我只知道他是好人，還是壞人，至於膚色，對我已絕對地無意義了。」\n\
    \  車子快到波士頓，老先生說：「我失去了視力，也失去了偏見，多麼幸福的事！」\n  在月臺上，老先生的太太已在等他，兩人親切地擁抱。我赫然發現他太太是一位滿頭銀髮的黑人，當時吃了一驚。\n\
    \  我這才發現，我視力良好，因此我偏見猶在，多麼不幸的事！（李家同〈視力與偏見〉）\n【注釋】（１）譁然：人多聲音嘈雜的樣子。此指眾人議論紛紛。"
