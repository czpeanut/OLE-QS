- id: doc_113_高雄_五福_國文_g8s2e1_s4_7
  section: 4
  number: 7
  type: single
  page: 6
  stem: 文章中的「我」認為右邊那扇門代表了什麼意義？
  options:
  - label: A
    content: 夢裡飄緲的回音
  - label: B
    content: 提供伙食的處所
  - label: C
    content: 通往自由的方向
  - label: D
    content: 終結生命的地獄。
  group_stem: "（四）\n    門輕輕地開啟，又輕輕地關上。撐開沉重的眼皮，有些吃力地將眼前的影像對焦。\n    狹窄、昏暗(的)空間教我分不清究竟是白晝或黑夜，於是我只能靜靜等待還在睡夢的聽覺甦醒。微弱的聲音漸漸傳來，喑啞的哭音、憤怒的嘶吼、絕望的哀號在在刺痛著我那對不堪的耳膜，提醒我已和這個世界搭上線。\n\
    \    好冷，我想。又是冰冷的一天。伸展了下折疊一夜的筋骨，關節錯動的聲響同時牽動早已不太靈敏的神經。真是老邁不中用的身軀呀。我悶哼了聲，有些挫敗地想。\n\
    \    起身走向房間的一隅，望著盤裡勉強還能從蒼蠅堆的縫隙中瞧見的、稱得上不太新鮮的伙食，我思考著該虐待自己的胃，還是凌遲自己的嘴巴？記不清楚了，距離上次更換糧食似乎是三天前的事了吧？現在連我這老朽的乾癟鼻子，都能嗅到溢滿空氣中腐敗、發酸的噁心臭味。算了吧，胃適時抽了兩下提醒著，吃了那樣的東西才真正是折騰自己。\n\
    \    於是我決定忍耐些，離開陰暗又令人作噁的角落，踱往與外界唯一的連結，將臉卡進兩支冰冷的鐵干之間想一探究竟。只見瘦子一人坐在結構鬆散、好似隨時會解體的木椅上打著盹兒，和吵鬧的環境形成強大對比。此時，門輕輕地開了。\n\
    \    一個癡肥的胖子拎著又一個可憐的倒楣蟲自左邊的門進來，嘴裡邊叫囂邊打開我隔壁房的鐵門，絲毫不留情地把年輕小伙子甩進牢房，還順勢吐了口痰在他臉上。「欸，我說你也輕點，那傢伙跛了條腿呢，怪可憐的。」被胖子吵醒的瘦子望望倒楣蟲憐憫地說著。「可憐？這種東西死了還嫌礙事，沒什麼好同情的！」不知受了什麼怨氣似的，胖子把一肚子惱火都出在小伙子身上，說到激動處更不忘在鐵門補上一腳。\n\
    \    這個含括了我們深處所有小房間的大房間裡，有兩扇不同的門。在此處的每一個人(所有我的同類)，包含我自己，都是經由左邊那扇門被送進來；而每經過一段時間，就會有一位幸運兒雀屏中選，走向右邊的那扇門，然後就再也不曾看到他。那一定是通往自由的門。大家異口同聲地認為。\n\
    \    而我也沒有想過我竟會有成為幸運兒的一天。\n    「喲！伙計！別睡啦！今兒個可是你的好日子呢！」睡夢中依稀聽見瘦子明亮、高亢又帶些沙啞的嗓音，抬起還有些昏沉的頭，看見瘦子和煦的笑容，證明了金屬鎖鏈碰撞的清脆聲響是千真萬確震動著我的耳膜，而不是方才夢中飄渺的回音。\n\
    \    「伊——呀——」生鏽的鐵門被緩緩打開，我不太敢置信地探了探頭，生怕下一秒又是棍棒的一頓伺候。「哎呀，別害羞了，老傢伙！」瘦子笑著彎腰拍拍我的頭，眼中盡是同情。「今天你就要解脫了吶！」雖然我聽不懂他的話，不過應該是在祝賀我吧？於是我搖了搖尾巴表達謝意，開心地跟著他走向右邊的門，老朽的鼻子因喜悅而忽略了門後飄來的一絲血腥味。\n\
    \    門輕輕地開啟，又輕輕地關上。\n                                                        \
    \               -------改寫自吳宜涓〈門〉"
  answer:
  - C
