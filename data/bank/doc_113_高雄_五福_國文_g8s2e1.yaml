- id: doc_113_高雄_五福_國文_g8s2e1_s4_9
  section: 4
  number: 9
  type: single
  page: 7
  stem: 當初張玲和姊姊原本想成立兒童收容所，為何後來改變策略？
  options:
  - label: A
    content: 當地家長心有疑慮，不願接受外來的幫助
  - label: B
    content: 經費來源缺乏，不足以成立理想中的協會
  - label: C
    content: 孩子們只在意食物和物資的補給，並不想就學
  - label: D
    content: 這些孤兒們被接往其他親戚家，沒有無家可歸的現象。
  group_stem: "（五）\n    因緣際會下，排灣族女孩張玲 Yoshi 前往非洲烏干達擔任國際志工，負責教小朋友英文、寫作業。她深深記得曾經上課到一半有個小孩哭了起來，原因是從昨天到上課當下都還沒吃過東西，Yoshi\
    \ 非常驚訝，心裡想：「這裡是兒童收容所啊！怎麼會最基本的飲食都沒有照料好？」一問之下才發現是當地協會的經費一直沒有收到，但匪夷所思的是，同一時間，主管的辦公室卻換了新電視。\n\
    \    看見不公不義的Yoshi 決定和姊姊Vaillys 與朋友們一起創立自己的協會，原本打算成立兒童收容所的他們，發現這裡雖然有很多孤兒，但都沒有無家可歸的小孩。原來烏干達的傳統習俗中，如果有小孩的父母離開人世，親戚會負責任地把小孩接到自己家，而當地大部分的家庭組成，是由一位單親媽媽或奶奶照顧好幾位小孩。不禁令人困惑：「男生們都跑去哪裡了？」Yoshi\
    \ 聽到這個問題後笑了出來，似乎不是第一次聽到別人有這個困惑，並回答：「烏干達的男女比例本身屬於女生比男生多一些的，另外，在烏干達結婚證書的費用對一般人而言是蠻大的負擔，因此很多人會跳過這個程序，雙方自己確認好關係就好，然而畢竟沒有保障，有著不同原因的男生們離開了家裡，留下的是無助的單親媽媽和孩子們。」\n\
    \    不能我們有什麼就直接給什麼，要先知道當地真正的需求是什麼\n    他們發現原先的目標並不符合當地的需求，於是向村長、教會領袖、校長等等了解當地的人士請教並整理出了一份名單，循著名單挨家挨戶地做了家庭訪視，發現所有家庭需求的共同點：第一，希望小孩可以重回學校就學，第二，希望有好的醫療或緊急處理，降低小孩因為延誤就醫造成終生傷害的機率，第三，則是單親媽媽們想工作卻沒有技能。因此，他們確定了三個主要服務：孩童助學計畫、社區緊急醫療，以及婦女培力課程，同時，天愛花布婦女裁縫培力計畫也就此展開。\n\
    \    一開始其實沒想過天愛花布會變成一個品牌，如果身分是國際志工，大可以任期結束就離開，也不需要感到負擔。但殘酷的卻是媽媽們依舊繼續無力面對著一切，孩子們繼續無法就學、被迫提早就業。隨著時間推移，我們看到愁眉苦臉的媽媽們臉上多了笑容，孩子們不再是小服務生、小搬運工，而是一般人眼裡再正常不過、對他們而言卻得來不易的一名小學生。\n\
    \    成功令人欣喜，失敗也難以避免。如同在沙漠澆花，一直澆水花卻不吸收，對雙方而言都是損耗。不少案例其實在計畫中途因為不同原因選擇放棄，在篩選援助方案時增加了面試的流程，增加雙方成就感，也把資源準確集中使用。\n\
    \    資源有限，我們能做的只能把有限發揮到最大\n    烏干達媽媽們的裁縫培訓穩定發展，不少美麗的作品、茁壯的自信因此而生，但要改變生活、翻轉社區還需要靠媽媽們本身的努力，與更多人的關心。\n\
    \    談到過去參與天愛花布計畫而轉變的烏干達媽媽們，Vaillys 和Yoshi 這麼說：「我們只能陪伴她們成長，但看見生命被翻轉，是很大的感動！」\n\
    \n                               改寫自------陳月雲〈來自天上的愛，藉有愛之人發揚光大――天愛花布〉"
  answer:
  - D
  answer_source: answer_key_vlm
