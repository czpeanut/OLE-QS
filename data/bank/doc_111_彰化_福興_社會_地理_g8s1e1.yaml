  stem: 根據以上兩份資料，下列何者最有可能是在中國性別比的現況？
  options:
  - label: A
    content: 性別比小於 100
  - label: B
    content: 性別比大於 100
  - label: C
    content: 女性人數較多
  - label: D
    content: 男女比例均衡
  group_stem: '(一)小南與 Andy 很好奇為什麼中國年輕的單身男女將 11 月 11 日這天稱為「光棍節」，於是查了以下兩份資料：


    ☆資料一：

    中國人稱單身男女為「光棍」，而「光棍節」（11 月 11 日）的起源，源於網路文化和校園文化，而這一天也是眾多單身男女舉辦聯誼的日子，因此又同時是「脫光節」（「脫離光棍單身的節日」之意）。與此同時，各大商家（特別是線上購物）以藉著「脫光」為由，進行限時的打折促銷，刺激買氣。從
    2009 年開始，中國知名購物網站將該日宣傳為「雙 11 狂歡購物節」，光棍節逐漸演變成全民網路購物節日，交易額甚至可高達人民幣千餘億元。


    ☆資料二：

    中國國家人口發展戰略研究課題組根據出生人口性別比推算，到 2020 年，20 到 45 歲人口中的男性會比女性多出約 3000 萬，此規模幾乎接近澳洲總人口。因此在中國也形成一種特殊的現象，每逢雙
    11（11 月 11 日）前夕，許多大城市的公園擺滿婚姻仲介攤位，布置著滿滿「徵婚廣告」的長廊，甚至還有許多父母親自帶著兒子的擇偶資料來說媒。'
