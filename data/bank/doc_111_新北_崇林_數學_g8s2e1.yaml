  stem: 生活中，一次函數常應用在商業上的收支平衡分析。以超商的咖啡為例，販賣咖啡會有成本與收入的問題，當總成本與總收入相等時，即為收支平衡。已知超商一臺咖啡機為
    12 萬元，且每杯咖啡的製造成本為 20 元，售價是 45 元，則當咖啡銷售超過幾杯時，即可回本？（5 分）
