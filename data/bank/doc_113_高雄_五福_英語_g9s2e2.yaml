- id: doc_113_高雄_五福_英語_g9s2e2_s3_49
  section: 3
  number: 49
  type: single
  page: 8
  stem: 49. Why is Harry Beck’s map popular with people today?
  options:
  - label: A
    content: It is printed in black and white color and has timetable on it.
  - label: B
    content: It has all the information of London above and under the ground.
  - label: C
    content: It keeps only the information which people need and is easy to read.
  - label: D
    content: It is geographically correct and shows all the information around the
      city center.
  group_stem: "題組六：根據文章內容，回答第49~50 題 \n\nWhen visiting London, a lot of people will\
    \ use the Underground map as a guide（指南）for where to go and how to get there.\
    \ However, in the past, not everyone used the same underground map. Back in 1908,\
    \ the map wasn’t that easy to read. There were rivers, roads, and other information\
    \ on it. Most of the stations were crammed（被填塞的）together at the center, and there\
    \ where a few that didn’t even fit on the map. What’s worse, station names were\
    \ very small and also often written at strange angles. The map was geographically（地理上地）correct,\
    \ but not very useful. \n\nA man called Harry Beck presented（展示）the plan for the\
    \ Underground map as we know it today. He took away everything above ground, used\
    \ straight lines and circles in different colors, and also spaced the stations\
    \ evenly（平均地）. Therefore, people would know how to get from one station to another\
    \ and where to change lines easily. At first, Harry Beck’s map was not used because\
    \ it wasn’t geographically correct. At last, in 1933, the Underground decided\
    \ to give it a try. The new map was very successful, and thousands of copies were\
    \ gone in a short time. Harry Beck’s map was just what the public wanted. Since\
    \ then, his idea has been used not only in London but also around the world."
