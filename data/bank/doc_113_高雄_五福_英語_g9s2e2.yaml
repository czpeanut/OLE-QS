  group_stem: "題組五：根據文章內容，回答第47~48 題 \n\nMr. Smith loved food. He always felt happy\
    \ when he was eating. Mrs. Smith, however, was not happy because her husband ate\
    \ too much and became really fat. She was worried about his health, so she asked\
    \ him to see a doctor to help him lose weight. \n\nMr. Smith did what his wife\
    \ wanted and came home with a note from the doctor. It said, “Please read this\
    \ carefully. The food in this diet may not taste great to you, but it’s good for\
    \ your health. You have to make yourself follow it every day. Come back and see\
    \ me in two weeks.” \n\nTwo weeks later, the doctor was surprised when she saw\
    \ Mr. Smith walked into the clinic（診所）. Mr. Smith looked even fatter. “Didn’t\
    \ you follow the diet?” the doctor asked. And Mr. Smith answered, “Sure, I did.\
    \ My wife watched me eat my meal every morning. To be honest, it tasted like garbage.”\
    \ The doctor then asked, “Every morning? What about lunch and dinner?” He smiled\
    \ and said, “Well, those were when I could enjoy food like pizza, hamburgers,\
    \ and fries again.”"
