  group_stem: "題組三：根據文章內容，回答第42~43 題 \n\nTwo young travelers were walking together\
    \ in the woods. Suddenly, they heard a loud noise in the trees behind them. They\
    \ saw a large, brown animal coming toward them. \n\n“It’s a bear! Run!” shouted\
    \ the first traveler. He ran away from his friend and quickly climbed up a tree.\
    \ The second traveler had no time to get away. The bear was too close. He thought\
    \ quickly and lay down on the ground. “I will pretend that I am dead,” he thought.\
    \ He lay still and did not move. The bear went over to the man. It sniffed（嗅聞）\
    \ his head and his neck. The man did not move. The man in the tree did not make\
    \ a sound. He kept himself hidden and waited. \n    After a while, the bear walked\
    \ back into the woods. The traveler who was lying on the ground sat up. He was\
