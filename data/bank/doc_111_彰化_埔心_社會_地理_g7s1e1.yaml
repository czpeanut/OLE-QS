- id: doc_111_彰化_埔心_社會_地理_g7s1e1_s1_30
  section: 1
  number: 30
  type: single
  page: 2
  stem: 「攤開臺灣經濟史，可知從十七世紀初，荷蘭看中臺灣的位置，將其作為對中國、日本、韓國與東南亞貿易據點的轉運休息站。大航海時代，英國與日本更將臺灣視為一個獨立國家，並與之貿易。清帝國時期，對外貿易的盛行，造就了『一府二鹿三艋舺』的三個城市。十九世界中期，安平、打狗、基隆與淡水成為通商口岸。自此，臺灣貿易範圍擴及全世界。西元1966
    年於高雄成立加工出口區，臺灣的工業產品行銷至世界，至今國際貿易仍是臺灣經濟上最重要的一環。」請問：由上文可知下列哪一個關於臺灣的地理訊息？
  options:
  - label: A
    content: 臺灣位置優越，國際貿易發達
  - label: B
    content: 貿易造成臺灣特有生物眾多
  - label: C
    content: 臺灣天然資源十分豐富
  - label: D
    content: 西元1966 年後，臺灣貿易僅限於中國、日本與韓國。
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 地理
      code: 2-2
      title: 臺灣的位置及其影響
