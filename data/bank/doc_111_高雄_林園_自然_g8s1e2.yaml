- id: doc_111_高雄_林園_自然_g8s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: '皮影戲是結合皮雕藝術與光影的一種戲劇，透過影窗來表演。影窗為白布所構成的屏幕，後方有燈光，皮偶就在燈光的照射下，使影窗另一面的觀眾可以看見表演。

    演師所操縱的皮偶常使用牛皮、羊皮等獸皮來製作，製作前需先將獸皮刮淨，使其能透光後，再泡水洗淨、晾乾，才可作為皮偶的材料。皮偶師傅將處理過後的獸皮依照故事內容，仔細刻畫出皮偶的細節，並以染料著上顏色，最後在皮偶的關節裝上木棍，完成皮偶的製作。演師拿著木棍操縱戲偶，同時搭配著哼唱的曲調，演出各種故事情節。

    沛沛想要自製皮影戲用的皮偶，但牛皮、羊皮等材料不易取得，製作方式也較為繁複，請問沛沛可改用何種材料及製作方式代替？請選出最適合的選項。'
  options:
  - label: A
    content: 以各色半透明塑膠片剪裁拼貼
  - label: B
    content: 以各色厚紙板剪裁拼貼
  - label: C
    content: 捏製黏土模型
  - label: D
    content: 以白色厚紙板剪裁並上色。
  answer:
  - A
  answer_source: answer_key_vlm
