  options:
  - label: A
    content: 日新公學校
  - label: B
    content: 南門尋常小學校
  - label: C
    content: 角板山蕃童教育所
  - label: D
    content: 東京大學。
  group_stem: 丙、龍潭名人「鄧雨賢」因創作《望春風》、《雨夜花》、《月夜愁》等名曲，而被譽為「臺灣歌謠之父」。1906 年，鄧雨賢出生於龍潭的書香世家；15
    歲時，進入臺灣總督府臺北師範學校，就學期間接觸西式樂器；畢業後，進入臺灣人就讀的國小服務。26 歲時，創作臺語歌曲《桃花泣血記》，之後陸續創作多首世人熟稔歌曲等，曲曲動人心弦。後來日本為鼓勵臺灣民眾擔任軍伕，將鄧雨賢的歌曲重填日文歌詞。可惜英年早逝，1944
    年因病逝於竹東時，年僅39 歲。
