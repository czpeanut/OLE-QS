  group_stem: 乙、陳澄波是日治時期的西洋畫家，曾以油畫作品「嘉義街外」入選日本帝國美術展覽會。他的畫作除了以故鄉嘉義街景外，還有很多本土風景，如八卦山、阿里山、淡水和龍山寺等。日本投降後，各地為熱烈歡迎中華民國，紛紛成立籌備會，陳澄波因為個性熱心，且會說漢語，被推舉為嘉義地區籌備會的副主任委員。二二八事件爆發時，陳澄波和嘉義地方士紳成立組織，並與成員出面調停，嘗試和軍隊溝通，不料卻被拘押，在嘉義火車站前被公開槍決。
