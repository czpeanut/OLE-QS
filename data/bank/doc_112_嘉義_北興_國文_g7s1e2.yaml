  stem: "請閱讀下文後，無法得知什麼訊息？\n   失眠是許多人都可能遇過的問題，失眠症狀可概分為「入睡困難（躺床超過30 分鐘仍然無法入睡者）」、「續睡困難（睡眠斷斷續續，且入睡後清醒時間超過30\
    \ 分鐘）」，以及「過早清醒且無法再入睡」三大類。每周有三天（含）以上的失眠症狀，且白天有嗜睡、疲憊、難以專注等情形，進而影響工作或學習者，就可稱為失眠症。一般在診間遇到失眠症個案，並不會立即著手進行藥物治療，會著重於教育個案培養「睡眠衛生」。"
