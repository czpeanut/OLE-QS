- id: doc_112_嘉義_北興_國文_g7s1e2_s4_25
  section: 4
  number: 25
  type: single
  page: 4
  stem: 從<夸父逐日>的篇章中，我們無法得知什麼？
  options:
  - label: A
    content: 人類挑戰自然所展現的堅強意志
  - label: B
    content: 遠古人類對於自然資源的想像與渴求
  - label: C
    content: 強大的力量縱使衰亡仍能回饋大地
  - label: D
    content: 神話的結局皆是彰顯人定勝天的精神
  group_stem: "(三)節錄自選<古代神話與寓言> \n    「神話」是遠古人民的口頭創作。當時的人們看到天\n地萬物的變化無常，對於無法理解的現象，有時會按照自\n\
    己的想像、理解或期望，創造出神話故事。可參閱以下這\n則<夸父逐日>： \n    傳說遠古時有個人叫夸父，\n他追著太陽奔跑，靠近太陽時，\n口渴難耐，想找水喝，於是他取\n\
    黃河、渭河的水狂飲，喝不夠，\n又奔向北方大湖，想喝湖裡的\n水，還沒跑到就渴死在途中，而\n他留下的手杖化成了一大片樹\n林。 \n   而談到「寓言」則是「寄託之言」。作者把抽象的道理\n\
    寄託在生動的故事中，讓讀者更容易領悟，以達到勸諭的\n作用。最耳熟能詳，莫過於<濫竽充數>： \n    齊宣王愛聽竽樂合\n奏，每次演出都要三百位\n樂工。\
    \ \n    南郭先生請求為宣王\n吹竽，宣王高興地答應\n了，俸祿比照其他數百位\n樂工，於是他混在樂隊中裝模作樣地吹奏。宣王死\n後，湣王繼位，有別於宣王，湣王喜歡聽樂工一個個\n\
    地演奏，南郭先生得知後就立刻逃走了。 \n    神話與寓言雖然不是小說，但這些故事饒富興味，其\n中某些重要的題材與藝術手法，為後來小說的創作提供了\n\
    養分與借鏡，因此有學者認為二者可視為小說的先河。"
