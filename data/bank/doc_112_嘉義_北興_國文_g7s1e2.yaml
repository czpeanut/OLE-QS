  stem: 根據本文對臺灣民眾喜愛影劇類型的分析，下列敘述何者正確？
  options:
  - label: A
    content: 仍有超過半數的臺灣人喜歡觀賞浪漫愛情劇
  - label: B
    content: 臺灣民眾對於各類型影劇的喜愛程度分布平均
  - label: C
    content: 這個統計結果反應臺灣人的日常熱愛冒險活動
  - label: D
    content: 深受喜愛的前三大類型偏向超脫現實的題材
  group_stem: "(二)新聞：112 年會考作文題解析(節錄)           林忠民 \n \n根據＜臺灣民眾喜愛影劇類型統計＞，近年來動作冒\n\
    險，奇幻想像，恐怖驚悚三大類型就佔近百分之九十。 \n    我和鬼變成家人一起搭上屍速列車，而蜘蛛人跟蝙蝠\n俠總在玩命關頭，超級瑪莉也會跟無臉男一樣，在廣袤天\n\
    地裡找尋自我。我更相信遙遠的納美人星球，會有山椒魚\n好朋友……。 \n    看電影紓壓是眾所周知的好方法。只是為何大家偏愛\n感官刺激和超脫現實的類型呢？我認為那與「生活太無\n\
    感」，以及「現實太骨感」兩個因素有關。前者是一成不\n變的上班上課，考試工作；後者則是挫折感與無力感的聯\n名創作。 \n    所以，在一個超脫現實世界的情境裡，我們感受到緊\n\
    張而因此「放鬆」，我們驚艷那奇幻繽紛的畫面，心裡反\n而「踏實」。因為，我們感覺到在現實生活的背後，還有\n我們自己的心靈在支撐，在包容，這世界還有更多的可能\n\
    性值得去理解，去追尋。"
