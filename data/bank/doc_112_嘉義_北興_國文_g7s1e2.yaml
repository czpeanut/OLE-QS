  stem: '請比較下列三則，選出最適合的解讀：

    (一)孟武伯向孔子請教什麼是孝。孔子說：「讓父母只需要擔心子女的疾病就好。」

    (二)子游向孔子請教什麼是孝。孔子說：「現在所謂的孝，只是在衣食方面奉養父母。對於狗和馬也都能供給食物。如果對待父母沒有誠敬，又和養狗馬有什麼差別？」

    (三)子夏向孔子請教什麼是孝。孔子說：「子女保持和悅的臉色是最難的。有事要做時，年輕人代勞，有酒菜食物時，年長的人先吃，難道這樣就可以算是孝了嗎？」'
  options:
  - label: A
    content: 第一則說明孔子希望父母別插手太多子女的生活
  - label: B
