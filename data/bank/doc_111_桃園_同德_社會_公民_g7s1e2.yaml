  group_stem: "星期天，(甲)小瓔的阿姨在醫院生下一名男孩，小瓔和外婆、媽媽去醫院探望阿姨。阿姨在生產過程中很辛苦，會在醫院休息三天。未來(乙)阿姨會回娘家坐月子。坐月子是傳統的華人習俗，其目的為了讓產婦在產後可以得到妥善照顧。當年小瓔的媽媽生產，也是回娘家坐月子。\n\
    \  (丙)媽媽告訴外婆，從前的產婦坐月子期間不能洗頭，是怕產婦因頭髮溼而著涼，但是現在時代進步，可以馬上將頭髮吹乾，因此建議阿姨還是要定期洗頭，保持衛生，阿姨聽了媽媽的意見，點頭稱是。"
