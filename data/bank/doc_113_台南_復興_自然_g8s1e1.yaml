- id: doc_113_台南_復興_自然_g8s1e1_s4_3
  section: 4
  number: 3
  type: single
  page: 5
  stem: 下列關於文章中寶特瓶的敘述，何者錯誤？
  options:
  - label: A
    content: 寶特瓶的材質為聚對苯二甲酸乙二酯（PET）
  - label: B
    content: 將未開封的瓶裝水，直接放入冰箱冷凍，將水凝固為冰，會因熱脹冷縮體積變小
  - label: C
    content: 寶特瓶因高溫產生的有毒物質會影響人體的內分泌與生殖系統，並可能造成頭痛、噁心等症狀
  - label: D
    content: 在生活中，盡量減少使用寶特瓶能確保你我的健康安全，還能友善環境。
  group_stem: '◎閱讀下列文章後，回答 3~4 題。

    在炎熱的夏天，路邊有時會看到有些店家販賣「結冰水」，也就是將未開封的瓶裝水，直接放入冰箱冷凍，將水凝固為冰。為了能更快喝到水，有時會直接將寶特瓶放在太陽下曝晒，讓冰塊可以更快熔化成水。這樣飲用結冰水是很常見的消暑方式，但你知道嗎？飲用結冰水的背後隱藏著看不見的健康危害。
    一般寶特瓶的材質為聚對苯二甲酸乙二酯（PET），在未開瓶的情況下，若直接連瓶帶水放入冰箱冷凍，當液態水凝固成冰時，體積會增加，使得瓶身會因此膨脹，有可能讓瓶子出現極細微龜裂，並剝落一些看不見的塑膠微粒。當喝下解凍的冰水時，就如同喝下含有塑膠微粒的水。塑膠微粒對人體健康是否會造成危害，還需要更多的研究，但醫生普遍建議應避免攝取以減少危害風險。另外，若將寶特瓶放在太陽光下曝晒，由於材質不耐高溫，當瓶子過熱時，會釋放出有毒物質，若再飲用便會吸收到這些有毒物質。經研究顯示，寶特瓶溶出的有毒物質會影響人體的內分泌與生殖系統，並可能造成頭痛、噁心等症狀，因此不可不慎。在生活中，盡量減少使用寶特瓶及其他塑膠製品，不僅能確保你我的健康安全，還能友善環境，讓地球永續發展。

    文章取自-2017 聯合報'
