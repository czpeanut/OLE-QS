  stem: 琳琳不確定要配戴哪種大小的口罩，經媽媽幫忙測量，琳琳臉寬約為 14.53cm，下列敘述何者錯誤？
  options:
  - label: A
    content: 琳琳應配戴成人用的口罩較適合
  - label: B
    content: 媽媽測量尺的最小刻度單位為毫米(mm)
  - label: C
    content: 此測量結果的估計值為 0.03
  - label: D
    content: 此測量結果的準確值為 14.53
  group_stem: '◎閱讀下列文章後，回答 1~2 題

    口罩過濾層的孔徑只要小於飛沫的尺寸，應能有效降低感染風險，但沾至口罩表面的飛沫會隨時間逐漸乾燥，粒徑會變小，病毒便可能藉此穿透過濾層，因此需配戴過濾孔徑小的口罩，且口罩應密合、完整包覆臉部並確實罩住口
    鼻，較能達到防疫效果。依口罩大小，可分為兒童用口罩與成人用口罩，常見尺寸依序為 12.9cm $\times$ 9.3cm 與 17.5cm $\times$
    9.0cm；依口罩過濾孔徑大小與用途，常可分為以下幾種： (文章取自-翰林出版閱讀素養全集中)

    | 種類 | 功能 |

    | :--- | :--- |

    | N95口罩 | 孔徑 $30\sim 75\text{nm}$，可阻擋 95%以上 0.3 微米顆粒。呼吸阻抗較高，不適合一般人長期配戴。 |

    | 外科口罩 | 孔徑為數百 nm 不等，可阻擋 90%以上的 5 微米顆粒，有髒汙、潮溼即應更換。 |

    | 活性碳口罩 | 孔徑 $260\sim 1000\text{nm}$，可吸附有機氣體與異味，較不易吸附細菌與病毒。無法吸附異味時就要更換。 |

    | 棉布口罩 | 孔徑 $260\sim 1000\text{nm}$，只過濾較大顆粒。清洗後可重複使用。 |

    配戴口罩並沒有所謂的 100%零風險，但是正確選用與配戴口罩、配合相關防疫措施，將可有效降低病毒感染風險。'
