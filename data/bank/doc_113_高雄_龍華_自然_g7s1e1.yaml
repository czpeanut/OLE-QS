  group_stem: '素養閱讀題:

    電影《不可能的任務4》中有一段場景是阿湯哥載著神奇壁虎手套攀爬杜拜的摩天大樓—哈利法塔，現實中，這樣的壁虎手套真的存在嗎？壁虎並不是什麼稀奇的動物，但壁虎能在家裡藐視重力而飛簷走壁，也是令人類自嘆不如，無論牆面或天花板是濕滑或乾燥，壁虎都能順利垂直上下，這是怎麼辦到的呢?由於光學顯微鏡的解析度最多只能達到200
    奈米左右，所以直到解析度約0.2 奈米的電子顯微鏡出現，才給人們研究壁虎神奇攀爬術的工具。1965 年，來自美國加州大學河濱分校的生物學家Rodolfo Ruibal
    把壁虎的腳放在電子顯微鏡下，他發現壁虎的足下有許多微小剛毛，一隻足約有50 萬根，那些看似小鉤子的剛毛末端，實際上是開叉的，每根剛毛都分成了100-1000
    根更細的匙突，這些匙突大量的增加了壁虎腳掌的面積，當壁虎攀在粗糙的物體表面時，這些匙突便與物體表面有著很大的接觸面積，分子和分子之間存在著相互作用的吸引力，這種吸引力叫做凡得瓦力(van
    der Waals force)，雖然單對分子所產生的凡得瓦力很小，但眾多微小的力量相加起來就很可觀，假如每根匙突都接觸到牆面，壁虎約能承受120 公斤重而不會掉下來，科學家便「以大自然為師」，發明了模仿壁虎足底構造的壁虎膠帶。               〜參考翰林版跨科主題'
