  group_stem: '二、

    有人問揚雄：「先生少年時代喜歡寫賦？」揚子回答說：「是。就像兒童學習雕琢蟲書和篆寫刻符一樣。」過了一會兒又說：「成年人是不做這種事的。」那人問：「賦可以用來進行諷諫嗎？」揚子回答說：「諷諫嗎？賦應該能起到諷諫的作用就結束；如果大肆形容鋪張，我看恐怕不可避免地要變成鼓勵了。」那人說：「輕細的縠紗就要華麗。」揚子回答：「所以織縠成了侵蝕婦女勞動的蛀蟲。」……。有人問：「景差、唐勒、宋玉、枚乘的賦寫得如何?有助益嗎?」揚雄回答:「過多富麗言辭。」那又如何？揚雄回覆:「詩人創作的辭賦詞采富麗，但符合儒家的標準；辭賦家創作的辭賦詞采富麗，但流於過多的藻繪。「詩人之賦」就是指詩經三百篇。「麗以則」是美麗而有規則法度，恰到好處；「麗以淫」則是漂亮而超越了規矩，太過分了。
    （譯自揚雄法言．吾子卷二節選）'
