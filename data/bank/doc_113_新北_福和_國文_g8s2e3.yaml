    content: 巴黎奧運台灣拳擊好手林郁婷，在57 公斤拳擊金牌戰，擊敗波蘭選手塞琳梅塔奪得金牌。塞林梅塔在賽前、或是敗戰後，也利用社群媒體、或是比出「X」手勢來質疑林郁婷的性別
