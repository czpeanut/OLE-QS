- id: doc_113_新北_福和_國文_g8s2e3_s2_46
  section: 2
  number: 46
  type: single
  page: 6
  stem: 關於本文，下列敘述何者正確？ 【白話詩文閱讀】
  options:
  - label: A
    content: 作者的父親有煮菜功夫，自詡大廚
  - label: B
    content: 作者的母親廚藝常受丈夫稱讚
  - label: C
    content: 作者擅長做菜，懷有高超的廚藝
  - label: D
    content: 曾先生廚藝大受作者父親的認可。
  group_stem: "五、\n 我從小命好，有得喫。\n 母親的手藝絕佳，比如包粽子吧！不過就是醬油糯米加豬肉，我小學莊老師的婆婆就是一口氣多喫了兩個送去醫院的，老師打電話來問秘訣，母親想了半天，說：竹葉兩張要一青一黃，醬油須拌勻，豬肉不可太肥太瘦，蒸完要瀝乾……如果這也算「秘訣」。\n\
    \ 但父親對母親的廚藝是鄙薄的，母親是浙江人，我們家有道經常上桌的家常菜，名曰：「冬瓜蒸火腿」，作法極簡，將火腿（台灣多以家鄉肉替代）切成薄片，冬瓜取中段一截，削皮後切成梯形塊，一塊冬瓜一片火腿放好，蒸熟即可食。需知此菜的奧妙在於蒸熟的過程冬瓜會吸乾火腿之蜜汁，所以上桌後火腿已淡乎寡味，而冬瓜則具有瓜蔬的清苦之風與火腿的華貴之氣，心軟邊硬，汁甜而不膩，令人傾倒。但父親總嫌母親切菜時肉片厚薄不一，瓜塊大小不勻，因此味道上有些太濃而有些太淡，只能「湊合湊合」。父親在買菜切菜炒菜調味上頗有功夫，一片冬瓜切得硬是像量角器般精準，這刀工自是大有來頭，因與本文無關暫且按下不表，話說父親雖有一手絕藝，但每每感嘆他只是個「二廚」的料，真正的大廚，只有曾先生。\n\
    \ 要知道在廚房經年累月的師傅，大多熟能生巧，經歪斜斜地寫著「九味牛肉麵」，我心中一動，進到店中，簡單的陳設與極少的幾種選擇，不禁使我有些失望，一個肥胖的女人幫我點單下麵後，自顧自的忙了起來，我這才發現暗暝的店中還有一桌有人，一個禿頭的老人沉浸在電視新聞的巨大聲量中，好熟悉的背影，尤其桌上一份中央日報，與那早已滿漬油水的唐魯孫的天下味，曾先生，我大聲喚了幾次，他都沒有回頭，「我們老闆姓吳」，胖女人端麵來的時候說。\n\
    \ 「不！我姓曾。」曾先生在我面前坐下。我們聊起了許多往事，曾先生依然精神，但眼角已有一些落寞與滄桑之感，滿身廚房的氣味，磨破的袖口油漬斑斑，想來常常抹桌下麵之類。我們談到了喫，曾先生說：「一般人好喫，但大多食之無味，要能粗辨味者，始可言喫，但真正能入味之人，又不在乎喫了，像那些大和尚，一杯水也能喝出許多道理來。」我指著招牌問他「九味」的意思，曾先生說：「辣甜鹹苦是四主味，屬正；酸澀腥沖是四賓味，屬偏。偏不能勝正而賓不能奪主，主菜必以正味出之，而小菜則多偏味，是以好的筵席應以正奇相生而始，正奇相剋而終……」突然我覺得彷彿又回到了「健樂園」的廚房，滿鼻子菜香酒香，爆肉的嗶啵聲，剁碎的篤篤聲，趙胖子在一旁暗笑，而父親正勤作筆記……\
    \ （摘錄自徐國能第九味）"
