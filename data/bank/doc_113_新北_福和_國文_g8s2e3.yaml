    content: 里約奧運女子5000 公尺徑賽預賽中，紐西蘭選手漢布林不慎摔跤，緊跟在後方的美國選手迪阿寇斯蒂諾也連帶被絆倒。迪阿寇斯蒂諾立即起身，扶起絆倒她的漢布林，最後彼此攙扶完成賽事。
