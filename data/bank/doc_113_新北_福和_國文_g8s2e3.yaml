  - label: C
    content: 薪資失衡
  - label: D
    content: 勞務繁多。
  group_stem: "一、\n九月一日，愈再拜：受牒1 之明日，在使院中，有小吏持院中故事節目2 十餘事來示愈。其中不可者，有自九月至明年二月之終，皆晨入夜歸，非有疾病事故，輒不許出。當時以初受命，不敢言，古人有言曰：人各有能有不能。若此者，非愈之所能也。抑而行之，必發狂疾，上無以承事3\
    \ 於公，忘其將所以報德者；下無以自立，喪失其所以為心。夫如是，則安得而不言？\n愈蒙幸於執事，其所從舊矣。若寬假之，使不失其性，加待之，使足以為名，寅而入，盡辰而退；申而入，終酉而退，率以爲常，亦不廢事。天下之人聞執事之於愈如是也，必皆曰：執事之好士也如此，執事之待士以禮如此，執事之使人不枉其性而能有容如此，執事之欲成人之名如此，執事之厚4\
    \ 於故舊5 如此。又將曰：韓愈之識其所依歸也如此，韓愈之不諂屈於富貴之人如此，韓愈之賢能使其主待之以禮如此，則死於執事之門無悔也。 （摘自韓愈上張僕射書）\n\
    【注釋】1.受牒：接受任命。 2.故事節目：原有的規章制度。\n 3.承事：接受所所委辦的事。 4.厚：厚待。\n5.故舊：老朋友。"
