  stem: 依據上文中，「強凌弱，眾暴寡，不是比賽，應該叫做欺負」，可用哪一句形容「贏」的人的行為較為貼切？ 【白話詩文閱讀】
  options:
  - label: A
    content: 勝之不武
  - label: B
    content: 弱肉強食
  - label: C
    content: 出奇不意
  - label: D
    content: 成人之美。
  group_stem: "四、\n人的一生有許多比賽，比賽總有輸贏勝負。……有意義的比賽，旁觀者不只在看輸贏，也在學習輸贏裡透露的生命質量吧!好看的比賽當然要棋逢對手。世界級的運動會，輸贏常常在分秒毫釐之間，比賽者都全力以赴。比賽結束，輸者服氣，並不喪志；贏者也謹慎謙遜，不敢有一點驕狂。好的比賽，輸贏雙方，都是風範，旁觀者有所學習，人性有所提升，比賽也才使人敬重。\n\
    強凌弱，眾暴寡，不是比賽，應該叫做「欺負」。欺負他人，以為是贏，只是人性墮落，遲早要遭報應。\n東方古代有重視輸贏教育的傳統，小時候拿著木劍玩具槍，亂砍亂射，地方武術師父就要喝斥：「打鬥也沒規矩！」就教導幾個孩站好，學習拱手揖讓，學習蹲馬步，學習推手，學習過招，使小小兒童在玩耍中，知道輸贏勝負都是品格。輸贏間有了規矩，輸贏被規範成崇高的儀式，輸贏勝負轉化提升成為美學。……所謂「道」，無非是在盡人事之外，還要領悟有天意，輸贏之外，天寬地闊，也就可以哈哈一笑。\n\
    青少年時喜愛看日本武士片，高手劍道，進退攻守，美如舞蹈。武士持劍而立，凝神肅穆，好像擊技到了高明處，並無敵人，只是端正自己，進退攻守，也就有了分寸規矩。民間流行的武俠小說，即使粗淺，寫到高手過招，也都像奕棋鼓琴，或像品茗書法，動靜進止，瀟灑雍容，氣定神閒，自有—種美的品格，絕不是血淋淋的廝殺。比賽到了今日，常常你吐我一口痰，我咬你一口，你偷襲我一腳，我抓你一把頭髮，一個呼天一個嗆地，這樣的比賽，無論輸贏勝負，雙方都已失了風範。輸的死纏濫打，贏的輕浮囂張，對人性的學習，一無好處。一旁的群眾，如果不能省悟，還跟著鼓掌聒噪叫好，人性沉淪，莫甚於此。競賽失去了規矩，無論結局如何，並沒有贏家，從生命質量而言，只是全盤皆輸。\n\
    這幾年喜歡起了易經，不是把易經當書來讀，而是喜歡在輸贏的現象裡對讀易經卦象。易經似乎總是在暗示：輸中有贏，贏中有輸。吉凶禍福消長，除了當下立即的輸贏，還有更長更久、此刻不可知的因果。因此無論輸贏，都應當心懷慎重敬意。\n\
    我懷念起小時候廟口武術師父的教導，知道再激烈的廝殺比賽，不能失了「人」的分寸，失了人的分寸，也就沒有比賽可言，只是野獸互咬，與文明無關。\n (摘自蔣勳輸贏)"
