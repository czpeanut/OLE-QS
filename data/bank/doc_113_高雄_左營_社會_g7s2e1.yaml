    據點「新港素園」，支持多元長者活動並提供共餐服務，成為新港地區長者的健康生活基地。在陳醫師的領導下，素園結合新港基金會經營的有機農場、讀書會、園藝活動、北管樂團、新港廚房等，創造豐富且多元的活動空間。這樣的「社會處方」不但提供個人健康問題解方，更是促進社區整體福祉的有效途徑，成為應對超高齡社會的永續解決方案。
