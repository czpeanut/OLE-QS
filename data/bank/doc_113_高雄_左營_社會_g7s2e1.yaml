    \    早在日治時期，設計嘉南大圳的日本工程師利用曾文溪支流上游興建烏山頭水庫，並於大埔溪設置水壩，透過隧道取水至烏山頭水庫供應嘉南地區農田灌溉之用，但是其取水率僅為全部流量的25%。若是直接在曾文溪主流築壩與烏山頭水庫串聯運轉，便可以增加灌溉量，因此日本工程師曾於1939\
