  group_stem: 'Have a Good Sleep

    More and more people have problems having a good night’s sleep. Some of them even
    ask for the doctors’ help. Here are some tips for you guys to have a good sleep.

    First, don’t have coffee and tea six hours before bedtime. The caffeine in them
    makes it hard for you to fall asleep. Maybe you can have some warm milk or wine
    for your drink at that time. Second, take a warm bath or shower. When your body
    is warm, you can have a good sleep, too. Third, don’t use your cellphone before
    you go to bed. Stop watching TV before you go to bed. The blue light from them
    makes your brain at work.

