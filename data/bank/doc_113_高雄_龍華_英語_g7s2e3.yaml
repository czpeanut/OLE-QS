    Do you know Timon? It is like a squirrel in Disney’s movie The Lion King. The
    animal’s real name is meerkat. They usually stand on their back legs and look
    like people. That’s so cute.


    How tall and heavy they are

    They are about 29 cm tall and 1 kg.


    Where they live

    They live in deserts and grasslands of Africa.


    What they eat

    Meerkats eat small animals, like bugs, small birds, or mice. Sometimes they also
    eat fruits and plants.


    How they hunt

    Meerkats usually work together to get food. There are different groups doing different
    work. Some watch the sky for birds above. Some look for food like bugs or plants.
    And some protect the group.


