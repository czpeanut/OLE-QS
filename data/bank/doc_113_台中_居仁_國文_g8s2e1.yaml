  group_stem: "二、\n    余昔少年讀書，竊嘗怪顔子以簞食瓢飲，居於陋巷，人不堪其憂，顔子不改其樂。私以爲雖不欲仕，然抱關擊柝，尙可自養，而不害於學，何至困辱貧窶➀自苦如此？及來筠州，勤勞鹽米之間，無一日之休，雖欲棄塵垢，解羈縶➁，自放於道德之場，而事每劫➂而留之。然後知顔子之所以甘心貧賤，不肯求斗升之祿以自給者，良以其害於學故也。\n\
