  stem: 根據上文，下列有關澎湖的介紹，何者正確？
  options:
  - label: A
    content: 澎湖的玄武岩除了黑色，也因風化的關係多出黃褐及赭紅等顏色
  - label: B
    content: 澎湖群島中的吉貝島，是由風與海浪吹捲細沙堆積而成的島嶼
  - label: C
    content: 澎湖的北岸受波浪、潮汐、洋流的侵蝕，使得沿岸均為海蝕地形
  - label: D
    content: 台南的安平古堡，是由葡萄牙人用澎湖的玄武岩建造而成的建築
  group_stem: "三、\n    澎湖海面上，是渾然天成的玄武岩和沙灘：海底下一，是繽紛多彩的珊瑚礁。夏天，燕鷗會到無人島上築巢；冬天，風大浪小的澎湖灣，是風浪板愛好者的聖地。澎湖不只是陽光和海浪，沙灘、岩石，珊瑚礁是更值得探索的天然秘境。不管是玄武岩或是沙灘，都和澎湖人的生活密不可分。玄武岩被拿來蓋廟、蓋房子、做石敢當、石磨、石臼。十七世紀時，荷蘭人還將澎湖的玄武岩運到台南蓋安平古堡。\n\
    \    如果要比年齡，澎湖足足比臺灣（六百萬年前浮出海面）早誕生一千一百萬年。一千七百萬年前，就在如今的臺灣海峽南方，發生火山爆發，火山噴出的熔岩流洩而出、冷卻，這樣的活動持續到八百萬年前，造就出澎湖各島嶼。而流出的岩漿就是現今澎湖島上隨處可見的玄武岩。\n\
    \    由玄武岩構成的海中島嶼，在海浪和風的搬運和侵蝕下，漸漸出現更豐富的面貌。風和海浪，有時像雕刻家，沿著海岸，刻出海蝕溝、海蝕洞、海崖；有時又像勤勞的搬運工，把珊瑚和貝殼碎屑，搬運到海岸有灣的地方堆積，形成沙灘。\n\
    \    由於東北季風吹襲，澎湖出現「北岸侵蝕、南岸堆積」的現象。北岸受波浪、潮汐、洋流的侵蝕，以海蝕地形居多，而風和海浪則將沙子搬到南岸堆積，所以，澎湖的沙灘大多在南岸。\n\
    \    不過，北岸有灣的地方，還是會堆積沙子而出現沙灘，另外，沙子在北岸被岩盤擋住，也會慢慢堆積成新的沙灘，有名的吉貝沙尾、活龍灘（澎澎灘）等，就是新生的沙灘。\n\
    \    澎湖的玄武岩姿態各異，或躺、或坐、或彎曲；而風化的結果，也讓玄武岩不只是原來的淡黑和黝黑，而多出黃褐、赭紅等顏色和新的形狀。\n    玄武岩受海浪衝擊變小變細，堆積在海灣處，也會變成奇特的黑沙灘。蛇頭山下遠觀是黑沙灘，近看，有珊瑚碎屑、玄武岩礫石，及黑白混合的細沙，和澎湖常見的金沙灘、白沙灘很不一樣。\n\
    \n                       改寫自李采洪〈海上翡翠〉"
