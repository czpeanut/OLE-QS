  group_stem: "【三】\n    援(馬援)在交阯，常餌薏苡實，用能輕身省慾，以勝瘴氣。南方薏苡實大，援欲以為種，軍還，載之一車。時人以為南土珍怪，權貴皆望之。援時方有寵，故莫以聞。及卒後，有上書譖之者，以為前所載還，皆明珠文犀。馬武與於陵侯侯昱等皆以章言其狀，帝益怒。援妻孥惶懼，不敢以喪還舊塋，裁買城西數畝地槁葬而已。\n\
    \n                      節錄自《後漢書‧馬援列傳》"
