  group_stem: '(5) What is red, made of paper, and full of money? If you guessed a
    Chinese red envelope, you’re right!


    But do you know why they are special? Red is a lucky color in Chinese culture(文化).
    During Chinese New Year, kids get red envelopes from their parents and grandparents.
    Workers might also get them from their bosses(老闆). People give red envelopes as
    wedding(結婚) gifts and sometimes for birthdays too.


    The money inside is important. It should be an even number(偶數). Never put a four
    in the amount(數額) because the word for “four” sounds like “death” (死) in Chinese.
    Always give and take red envelopes with both hands to show respect(尊敬).'
