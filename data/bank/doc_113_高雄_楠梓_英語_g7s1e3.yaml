  group_stem: '(1) Here are two readings about the Nature. Both of them are just like
    (40) of Nature.


    A

    Nature is full of wonders.

    Tall mountains, flowing rivers, and green forests are breathtaking.

    Flowers and animals bring joy and make us curious to explore more.

    Nature’s sounds, like birds singing and water flowing, are peaceful.

    It also teaches us to appreciate her beauty and do good to earth so that her magic
    can last for future generations.

    *nature 大自然 * breathtaking 令人屏息的

    * explore 探索 * peaceful 寧靜的

    *appreciate 欣賞；感恩 *last 持續

    * future 未來 *generation 世代 *smell 聞起來…


    B

    The sky is turning bright and clean.

    The earth is wearing red and green.

    Winter is gone; spring has come.


    The air smells fresh and sweet.

    The summr heat not yet here;

    A little fox comes out to play.

    A bird is busy in a tree

    Waking a daisy from her sleep.


    Little daisy, little daisy,

    People call the flower the “day’s eye.”

    When she opens her eye,

    The springtime brings us cheer.'
  shared_asset: g3_40_44
