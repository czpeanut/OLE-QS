- id: doc_113_高雄_五甲_國文_g8s2e1_s4_9
  section: 4
  number: 9
  type: single
  page: 5
  stem: 依據文中所述，關於「戰」、「逃」與「僵」的壓力因應機制採用的對象，下列選項何者正確？
  options:
  - label: A
    content: 只有不成熟的青少年才會有的
  - label: B
    content: 所有人類都具有的一套因應機制
  - label: C
    content: 兒童不會用這些複雜的因應機制
  - label: D
    content: 是現代人的文明病下才有的機制。
  group_stem: '【五】當我們面對到壓力情境時,往往會採用「戰」、「逃」與「僵」三種模式。而這三種模式不只是在兒童與青少年族群中可以見得,事實上對於成人而言也是常使用的模式。早從遠古時期人類在面對原始山林的種種危機時,就已經形成了這樣的壓力反應機制,例如:遭受到肉食性動物的攻擊時,可以選擇拿起手邊的石器與夥伴們一同正面迎戰,或是選擇逃之夭夭來躲避實力強大的敵人,更是會有人整個人驚呆了、嚇到待在原地不動的。這是一種人類生理上的求生反應機制,由腦部啟動,處理情緒和恐懼的杏仁核會傳送訊息到下視丘,接著啟動神經的一連串電訊號和化學訊號,讓身體準備好做出反應。

    對於血氣方剛的青少年而言,面對壓力情境採用「戰」的模式就更顯而易見了。例如:對於教師課堂上的指責與管教不服感到生氣,進而忍不住爆發言語與肢體衝突。這種以「戰」應急的因應模式也可以從不少家庭的互動中見得,例如:爸媽要小孩不再玩手機去讀書時,孩子不耐煩地回應「你真的很囉唆耶!可以不要再碎碎念嗎?」或是以「閉嘴!」等較激烈的言語頂嘴回去,甚至是甩門、摔物品等等更強烈的手段回應,都是常見的家庭衝突。除了上述的「戰」之外,「逃」與「僵」也是一種面對壓力情境的因應模式。有些人遇到困境後習慣躲在房間裡,沉迷於網路世界來逃避現實;或是下課後刻意和朋友們四處蹓躂避免太早回家得忍受家庭紛爭,兩者都是「逃」的壓力因應模式。而有些人則是被他人責備或欺負時會沒有想法也沒有作為的愣在那,則是屬於「僵」的壓力因應模式。

    而無論是「戰」、「逃」或是「僵」,選擇以這三者來因應壓力情境就如同人們在面對危險時會產生的反射動作,是一種自我防衛的機制,當下情緒一直疊加,沒有時間思考其他因應方法,也無從設想這麼做的後果,唯有以「戰」把情緒發洩出來、以「逃」來減少情緒、以「僵」來把自己與情緒隔絕起來,才能讓不舒適的情緒能來得快,去得也快。久而久之使用「戰」、「逃」或是「僵」的其中之一,就成為了一種面對壓力情境的習慣,而使得行動欠缺考慮,得承擔更嚴重或更難預期的後果。因此為了更有效解決當下的困境,應留意自己日常生活中習慣的壓力因應機制是哪一種,接著練習在行動前踩煞車,好好思考或是找人討論其他更好的解決方法。

    (青少年的壓力因應機制:「戰」、「逃」與「僵」)'
