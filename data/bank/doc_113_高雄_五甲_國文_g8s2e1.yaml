  group_stem: '【三】猜一猜,哪種假日休閒活動,會比歌神張學友或韓星演唱會的門票更快被「秒殺」?答案恐怕出人意料,那就是「運動賽事報名資格」,近年報名情況最熱烈的就是國內熱門馬拉松,比如台北馬、渣打馬、萬金石馬及田中馬等,更進階的就是國際品牌Ironman鐵人賽。搶報名時手腳不夠快,就只能【甲】,等待下一次機會。

    為什麼需要體力、耐力的運動比賽,會比可以舒舒服服坐著聽的演唱會還要搶手?擔任6年台大EMBA 助理執行長的陳彥豪表示:「因為國內運動風氣,不單純是為了健康,近年還慢慢摻雜了社交的色彩。」

    美國科技圈近年也「瘋運動」。根據《經濟學人》報導,檯面上的超級科技富豪如蘋果執行長庫克(Tim Cook)每天早上5點準時踏上跑步機,臉書CEO祖克柏(Mark
    Zuckerberg)最猛,不僅勤練跑步,甚至挑戰難度頗高的鐵人三項。

