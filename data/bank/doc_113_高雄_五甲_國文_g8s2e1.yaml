  stem: 下列年齡的代稱，何者正確？
  options:
  - label: A
    content: 「瓜字初分」碧玉年：女子十六歲
  - label: B
    content: 「花信年華」：女子十八歲
  - label: C
    content: 吾女「笄年」知書：女子二十歲
  - label: D
    content: 「荳蔻年華」：女子二十四歲。
  group_stem: '【四】博陵崔護,資質甚美,而孤潔寡合。舉進士下第。清明日,獨遊都城南,得居人莊,一畝之宮,而花木叢萃,寂若無人。扣門久之,有女子自門隙窺之,問曰:「誰耶?」護以姓字對,曰:「尋春獨行,酒渴求飲。」女入,以杯水至,開門設床①命坐,獨倚小桃斜柯佇立,而意屬殊厚②,妖姿媚態,綽有餘妍。崔以言挑之,不對,目注者久之。崔辭去,送至門,如不勝情而入。崔亦瞻③盼而歸,嗣後④絕不復至。

    及來歲清明日,忽思之,情不可抑,徑往尋之。門牆如故,而已鎖扃⑤之。因題詩於左扉曰:「去年今日此門中,人面桃花相映紅。人面不知何處去,桃花依舊笑春風。」

    後數日,偶至都城南,復往尋之,聞其中有哭聲,扣門問之,有老父出曰:「君非崔護耶?」曰:「是也。」又哭曰:「君殺吾女!」崔驚起,莫知所答。老父曰:「吾女笄年⑥知書,未適人⑦,自去年以來,常恍惚若有所失。比日與之出,及歸,見左扉有字,讀之,入門而病,遂絕食數日而死。吾老矣,此女所以不嫁者,將求君子以托吾身,今不幸而殞,得非君殺之耶?」又持崔大哭。崔亦感働,請入哭之。尚儼然在床。崔舉其首,枕其股,哭而祝曰:「某在斯,某在斯。」須臾開目,半日復活。老父大喜,遂以女歸⑧之。

    (孟棨本事詩·情感・崔護)


    註①床:坐榻。 ②意屬殊厚:有著極深的情意。 ③瞻:關心、顧念。 ④嗣後:從此以後。 ⑤扃:關閉、關上。 ⑥笄年:女子出嫁。 ⑦將求君子:打算找一個好女婿。
    ⑧歸:女子出嫁。'
