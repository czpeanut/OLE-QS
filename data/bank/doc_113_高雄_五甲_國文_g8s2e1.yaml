- id: doc_113_高雄_五甲_國文_g8s2e1_s4_5
  section: 4
  number: 5
  type: single
  page: 4
  stem: 依文意脈絡，文中【甲】處最不適合填入下列何者？
  options:
  - label: A
    content: 鬼哭神號
  - label: B
    content: 心痛扼腕
  - label: C
    content: 望洋興嘆
  - label: D
    content: 徒呼負負。
  group_stem: '【三】猜一猜,哪種假日休閒活動,會比歌神張學友或韓星演唱會的門票更快被「秒殺」?答案恐怕出人意料,那就是「運動賽事報名資格」,近年報名情況最熱烈的就是國內熱門馬拉松,比如台北馬、渣打馬、萬金石馬及田中馬等,更進階的就是國際品牌Ironman鐵人賽。搶報名時手腳不夠快,就只能【甲】,等待下一次機會。

    為什麼需要體力、耐力的運動比賽,會比可以舒舒服服坐著聽的演唱會還要搶手?擔任6年台大EMBA 助理執行長的陳彥豪表示:「因為國內運動風氣,不單純是為了健康,近年還慢慢摻雜了社交的色彩。」

    美國科技圈近年也「瘋運動」。根據《經濟學人》報導,檯面上的超級科技富豪如蘋果執行長庫克(Tim Cook)每天早上5點準時踏上跑步機,臉書CEO祖克柏(Mark
    Zuckerberg)最猛,不僅勤練跑步,甚至挑戰難度頗高的鐵人三項。

    《經濟學人》分析,科技宅男過去想突顯「腦袋才是一切」,隨著社群時代興起,新宅男想證明,自己不僅有金腦袋,還能練出魔鬼身材。

    不僅科技富豪瘋運動,顛覆宅男形象,國際企業老闆也看好運動產業商機,陸續投入資金、進行購併。比如全球第二大運動服飾品牌Under Armour,為搭建數位平台,前2年收購兩款追蹤App,一款可追蹤攝入熱量及營養,一款則是具有社交功能的運動App,希望利用大數據資訊結合運動服飾與健身追蹤服務,深入開拓相關商機。

    根據世界鐵人公司的統計,所有體育項目中,鐵人三項賽事的參與者經濟條件最好,是典型的「有錢有閒」金字塔頂端族群,平均每年花1,000小時進行訓練、花1萬美元買自行車,這塊領域的成長潛力相當明顯。

    據104人力銀行調查,87% 的企業認為,規律運動可以提升效率,9成企業認為,有運動習慣的工作者在遭遇逆境時,更能正面以對。這也是體育署近年積極推動「運動企業認證」的主因,因為運動對企業及員工來說是雙贏。

    全球著名投資公司世邦魏理仕(CBRE)針對英國2千名從事各行各業的成年人進行調查,結果顯示,從小就有規律運動習慣的人,投入職場後,比沒有任何運動習慣的人,年收入要高出1萬1,000英鎊(約台幣42萬元)。有運動習慣的人在職場上有成就,主要是因為參與運動,必須學習如何溝通、團體合作,而且對時間的控制、安排會比較精確。

    中國也曾做過一份「運動與財富」調查,結果顯示,每年在運動投入1,500元人民幣(約台幣6萬7,500元)的人,比投入1,500人民幣以下的人,年收入更高;每天走8,000~12,000步者,財務狀況相對良好。

    (節錄自劉育菁 Money錢雜誌 2017年3月號)'
