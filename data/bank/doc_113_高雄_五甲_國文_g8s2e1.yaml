  stem: 讓春天從高雄出發與控訴一枝煙囪是余光中的名詩。下列有關兩首詩的比較，何者正確？
  options:
  - label: A
    content: 文意主旨：讓春天從高雄出發：滿載作者的祝願與期許，祈願高雄的發展如春天般蓬勃；控訴一枝煙囪：後者以煙囪代表工業發達，聲討環境破壞者——海洋汙染
  - label: B
    content: 寫作特色：讓春天從高雄出發：筆調熱情輕快，展現作者的企圖與期望；控訴一枝煙囪：以批判斥責的語調，凸顯嚴肅的環保議題
  - label: C
    content: 表現手法：讓春天從高雄出發：以南北發展不同，對比出高雄工業的繁榮；控訴一枝煙囪：利用譬喻及轉化等手法控訴公害
  - label: D
    content: 作者情感：讓春天從高雄出發：對高雄責之切；控訴一枝煙囪：對高雄愛之深
