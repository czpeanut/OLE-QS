    打工度假確實也是一種探索自我的方式之一，趁著年輕時多探索自我興趣、體驗不同國家的文化，的確是好事，也有助於自身的成長。只是在做出決定之前，應該思考可能面臨的困難及解決方法，並且學習捍衛自己的權利。個人應學會衡量利弊之後再進行選擇，並為自己的選擇負責任，才是最重要的「人生成長」。'
