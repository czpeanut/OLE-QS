- id: doc_113_台中_居仁_社會_公民_g9s1e3_s3_41
  section: 3
  number: 41
  type: single
  page: 4
  stem: 文章中提到，澳洲的85 度C 違反《澳洲就業法》的最低時薪規範，而少付給實習生薪資。若該事件發生在臺灣，85 度C 可能涉嫌違反下列何種法規？
  options:
  - label: A
    content: 《民法》
  - label: B
    content: 《勞動基準法》
  - label: C
    content: 《就業保險法》
  - label: D
    content: 《性別平等工作法》
  group_stem: '【題組三】

    新冠疫情肆虐，導致過去各國進行了程度不一的邊境管制政策，使得民眾踏足國外備受限制。隨著疫情的趨緩，各國紛紛取消邊境管制、打開國門，因此到國外「打工度假1∼2
    年再回臺求職」又再度成為不少大學畢業生、年輕族群的熱門討論話題，其中到澳洲打工度假就是常見的選項之一

    以往大家常覺得打工度假，可以訓練自己獨立、精進語言能力，又可以趁機到外國旅遊、探索自我人生方向，且認為外國平均薪資水準較高，可以賺入大把鈔票、存下第一桶金。但事實真是如此嗎？

    以到澳洲打工度假為例，澳洲薪資高，而澳幣的匯率更是影響的主因之一。2012 年，1 元澳幣可以兌換約30 元新臺幣，而近年澳幣與新臺幣的匯率長期徘徊在1：20。儘管澳洲央行2022
    年下半年調漲利率試圖抑制通膨，但由於調漲幅度和其他國家相比未見突出，澳幣未有任何反彈跡象。因此，現在到澳洲打工度假，要是指望口袋裡的澳幣可以換回大把新臺幣，難度會比10
    年前高。另外，個人的生活習慣也是影響的主因之一，由於臺灣民眾平時習慣外食，但外國到餐廳吃飯花費較高，若能自己炊煮食物，就能省下大筆花費。除了薪資，不少人也認為前往澳洲打工度假可以有許多練習英文的機會，但這一點其實取決於個人的工作地點、工作性質，如果工作的地點位於當地的華人區，又或者是工作的性質並不需要大量使用英文會話交談的話，其實英文能力並不會因此進步。

    除了上述的迷思外，前往外國工作也有可能遭遇到權利的違法侵害。像是近期被澳洲公平工作調查專員署（Fair Work Ombudsman，FWO）調查後指出知名的飲料連鎖店85
    度C，涉嫌利用實習的名義，在2016 年7 月至2017 年6 月間，少付給8 名臺灣學生澳幣42 萬9393 元（約新臺幣906 萬元）薪水，而本案經過審理認定85
    度C 違反《澳洲就業法》的最低時薪規範，並對85 度C 開出47.5 萬澳幣的罰單。承審的法官布羅姆維奇表示：「實習生不但容易遭到剝削，也無實際能力抵抗過度工作與不足的報酬，導致生活條件更惡劣。」

    打工度假確實也是一種探索自我的方式之一，趁著年輕時多探索自我興趣、體驗不同國家的文化，的確是好事，也有助於自身的成長。只是在做出決定之前，應該思考可能面臨的困難及解決方法，並且學習捍衛自己的權利。個人應學會衡量利弊之後再進行選擇，並為自己的選擇負責任，才是最重要的「人生成長」。'
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 公民
