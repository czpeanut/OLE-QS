  - label: D
    content: Tips for Parents to Help Teenagers Safely Make Internet Friends
  group_stem: 'A. 31-32 題 (課本P45)


    According to a 2020 survey of Hillwood City, over 50% of teenagers have Internet
    friends. The report says 3% of them have shared intimate pictures or videos with
    their online friends because these "friends" asked them to. Sadly, sometimes these
    people spread the pictures or videos around without asking them first. This makes
    parents worried about their kids'' online activities.


    To keep their kids from getting hurt, parents can teach them some Internet safety
    tips. For example, they can tell their kids to never give out their personal information
    online, like their phone number. Also, it''s not wise to share any intimate pictures
    or videos with anyone. If the kids really want to meet their online friends, parents
    must ask them not to go alone.


    The Internet can be a dangerous place for kids. Parents should spend time teaching
    their kids about Internet safety.


     according to 根據  survey 調查  intimate 私密的  personal 個人的'
