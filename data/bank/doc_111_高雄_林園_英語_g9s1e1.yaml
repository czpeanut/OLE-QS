    Queen Elizabeth Dies

    September 16, 2022


    On September 8, Queen Elizabeth II died at her castle in Scotland. She was 96.
    She was the UK’s queen for 70 years. At Buckingham Palace (白金漢宮) in London, people
    began crying when they heard of her death.


    “You can’t think of her not being there,” said Sally Cherry, one of the people
    in front of the Palace.


    Elizabeth became queen in 1952. That was after her father, King George VI, died.
    She had lived through many interesting and important times: the end of the British
    Empire (大英帝國), the UK became a modern country and many things showed up such as
    televisions and the Internet. She often talked to common people nicely. What’s
    more, she was hard-working in her life. Traveling was an important part of her
    job; the Queen travelled to 117 countries in 70 years.


    France’s president (總統) said she was a “kind-hearted Queen” and a “friend of France.”


    Canada’s prime minister (總理) said she was one of his “favorite people in the world.”


    Many leaders from all over the world would go to her funeral on September 19.
    Her son, King Charles III, was very sad and said that her loss would be “deeply
    felt” around the world.


