  type: single
  page: 6
  stem: 'Here is a paragraph hamburger (文章段落漢堡圖).

    Please help to fill in the blanks (空格).


    a. In a word, LINE is more than just an app for sending messages and stickers.

    b. Besides, you can use LINE to raise money for those in need.

    c. LINE plays a useful part in people’s lives.

    d. When you get into serious trouble (麻煩), you can use LINE to save yourself.'
  options:
  - label: A
    content: 1. b → 2. c → 3. a → 4. d
  - label: B
    content: 1. c → 2. d → 3. b → 4. a
  - label: C
    content: 1. d → 2. c → 3. a → 4. b
  - label: D
    content: 1. c → 2. b → 3. d → 4. a
  group_stem: 'C. 36-37 題 (康軒版課文)


    Are you sending messages and stickers to your friends on LINE now? Do you know
    you can do more than that with the app? Here are several useful uses for LINE.


    To begin with, LINE can save your life when you are in serious danger. For example,
    in 2016, a Taiwanese man almost died after his boat turned over in the ocean.
    Luckily, he was saved because he sent a message to his friend on LINE before he
    fell into the water.


    LINE can also be used to raise money for those in need. Take the people in Kumamoto（熊本市）for
    example. Two earthquakes happened in their town in April 2016. So the town needed
    a lot of money to recover. Somebody created a set of cute LINE stickers. When
    anyone bought the stickers, the money went to those in need in Kumamoto.


    As you can see, LINE is more than just an app for sending messages and stickers.
    It can also save lives and raise money when we use it wisely.


     sticker 貼圖  danger 危險  raise 募（款）  recover 恢復'
