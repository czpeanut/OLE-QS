- id: doc_113_新北_福和_社會_歷史_g8s2e3_s1_27
  section: 1
  number: 27
  type: single
  page: 2
  stem: '小米閱讀「中美蘇關係」時，整理了幾個重要關鍵期，如下列資料所述。請問：下表哪一選項是小米整理「有誤」之處？

    | 選項 | 時間 | 關係 | 說明 |

    | --- | --- | --- | --- |

    | (A) | 1950 年代初期 | 中蘇友好 | (1)背景：中共採取親蘇政策。<br>(2)表現：蘇聯提供中共資金、技術及人才資源。 |

    | (B) | 1950 年代末期 | 中蘇交惡 | (1)原因：毛澤東認為蘇聯企圖控制中國內政與外交，雙方交惡。蘇聯停止援助中國。<br>(2)代表事件：1969
    年，中蘇爆發邊界衝突，雙方關係降至冰點。 |

    | (C) | 1970 年代 | 中國聯美制蘇 | (1)背景：中蘇分歧之際，鄧小平、美國總統尼克森希望改善中美關係，聯合對付蘇聯。<br>(2)中美關係正常化：1970
    年，尼克森訪問北京，兩國開始「關係正常化」。<br>1978 年中美建交。 |

    | (D) | 1980 年代 | 中蘇關係正常化 | (1)背景：鄧小平推行改革開放後，希望改善與蘇聯的緊張關係。<br>(2)契機：1989 年，蘇聯領導人戈巴契夫訪問中國，雙方恢復正常交往。L6
    |'
  options:
  - label: A
    content: 1950 年代初期 中蘇友好
  - label: B
    content: 1950 年代末期 中蘇交惡
  - label: C
    content: 1970 年代 中國聯美制蘇
  - label: D
    content: 1980 年代 中蘇關係正常化
