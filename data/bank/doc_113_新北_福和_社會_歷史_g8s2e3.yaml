- id: doc_113_新北_福和_社會_歷史_g8s2e3_s2_32
  section: 2
  number: 32
  type: single
  page: 2
  stem: 關於上文兩項資料所描述的事件背景，下列敘述何者正確？
  options:
  - label: A
    content: 「某地」曾經是英國的殖民地
  - label: B
    content: 此事件發生於韓戰期間
  - label: C
    content: 美國欲阻止共產勢力的擴張
  - label: D
    content: 「某地」人民為脫離殖民母國而開戰。L6
  group_stem: "※請依照下列資料，回答第32 ~ 34 題：\n資料一：\n    1972 年6 月8 日，當美軍的飛機載著化學武器往地面俯衝時，9\
    \ 歲的潘金福正和同伴在寺廟前玩耍。沒過多久，遭燒夷彈轟炸的潘金福尖叫的奔跑起來，她身上的衣服已完全燃燒殆盡，痛苦使她面孔猙獰。在她的身後，則是一群荷槍實彈的美軍與南方士兵。這一幕被當時21\
    \ 歲的美聯社攝影師烏特捕捉，成為二十世紀令人們最難忘的照片之一。\n資料二：\n    美軍向「某地」十分之一的土地上撒下了1,900 萬加侖的落葉劑。美軍還噴灑了其他除草劑，包括白劑、藍劑、粉劑、綠劑和紫劑(是以運送圓桶外部的顏色條紋來命名)，目的是除去敵人藏身的叢林。\n\
    \    飛機從空中噴灑除草劑，接觸到除草劑的植物會在兩天內死亡。1969 年發現橙劑和其他除草劑含有戴奧辛中毒性最強的TCDD。\n    到1975 年，戰爭結束之後，「某地」出生的許多畸形嬰兒以及出現的許多怪病就是與此有關，包括齶裂、智力不足、疝氣和多指症。"
