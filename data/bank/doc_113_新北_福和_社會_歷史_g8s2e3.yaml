  section: 1
  number: 21
  type: single
  page: 1
  stem: 「所謂『中國模式』主要是指自1978年改革開放後，中華人民共和國逐漸形成的一套政治和經濟的發展模式。指的是實行市場經濟的基礎上以計劃經濟、宏觀調控…等方式，運用勞動力充足、市場廣大的優勢，大規模引進外資、外商，鼓勵私營企業，而在政治領域保持與西方資本主義制度國家不同的一黨制，維持保守的威權統治。」然而此一模式在中國政治與經濟上，所實施的政體與政策實則相互矛盾。下列敘述中，何者較符合中國大陸的現況？
  options:
  - label: A
    content: 政治與經濟均實施高壓
  - label: B
    content: 政治與經濟都較為開放
  - label: C
    content: 政治較為開放，經濟方面實施壓制
  - label: D
    content: 政治方面實施壓制，經濟較為開放。L5
