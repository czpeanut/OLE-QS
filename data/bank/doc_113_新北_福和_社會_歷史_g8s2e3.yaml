  group_stem: "※請依照下列資料，回答第28 ~ 31 題：\n資料一：\n    中國在1980 年代末爆發一場民運，當時台灣曾聲援此事，一度流行《歷史的傷口》這首歌：「矇上眼睛，就以為看不見，摀上耳朵，就以為聽不到，而真理在心中，創痛在胸口，還要忍多久，還要沉默多久。如果熱淚，可以洗淨塵埃，如果熱血，可以換來自由。讓明天能記得，今天的怒吼，讓世界都看到，歷史的傷口。」\n\
    資料二：\n    1989 年5 月4 日，學生聯會發表意見：「新中國一方面一直在向現代化邁進，另一方面卻極大地忽略了民主建設。……目前國內存在的諸如政府機構臃腫、貪污嚴重、知識貶值、通貨膨脹等問題，都是我國政府繼續深化改革、堅持現代化建設的嚴重障礙。為此，發揚『五四精神』，加強政治經濟體制上的改革，保障人權、加強法制，已成了中國現代化建設的當務之急。」"
