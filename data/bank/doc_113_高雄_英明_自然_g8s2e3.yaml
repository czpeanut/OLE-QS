questions:
- id: doc_113_高雄_英明_自然_g8s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '兜兜取得四杯透明溶液甲、乙、丙、丁，但杯上標籤已脫落，僅知道這四杯溶液為醋酸、酒精、硫酸、氫氧化鈉，他進行了一些實驗，得到下列結果：

    (１)丁為有機化合物，但不是電解質。

    (２)將甲、丙混合或將乙、丙混合，蒸乾後皆會產生鹽類。

    (３)甲具有脫水性，滴在方糖上會使其從白色變為黑色。

    請問若要製作肥皂，需在椰子油中加入哪些溶液共煮？'
  options:
  - label: A
    content: 甲、乙
  - label: B
    content: 乙、丙
  - label: C
    content: 丙、丁
  - label: D
    content: 甲、丁。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 理化
      code: 5-4
      title: 食品與清潔劑
      chapter: 第5章 有機化合物
    textbook: 八下理化 5-4 食品與清潔劑
    labeled_by: ai
- id: doc_113_高雄_英明_自然_g8s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '取甲、乙兩種化合物，分別在足量的氧氣中燃燒，反應式分別為：

    甲＋$3O_{2}$ → $2CO_{2}$＋$3H_{2}O$

    乙＋$3O_{2}$ → $2CO_{2}$＋$2H_{2}O$

    關於甲、乙兩種化合物的比較與說明，下列何者正確？'
  options:
  - label: A
    content: 甲的分子量大於乙，且甲可能為醇類
  - label: B
    content: 甲的分子量大於乙，且甲可能為烴類
  - label: C
    content: 乙的分子量大於甲，且乙可能為醇類
  - label: D
    content: 乙的分子量大於甲，且乙可能為烴類。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 理化
      code: 5-2
      title: 常見的有機化合物
      chapter: 第5章 有機化合物
    textbook: 八下理化 5-2 常見的有機化合物
    labeled_by: ai
