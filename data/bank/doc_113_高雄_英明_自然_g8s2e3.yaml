    content: 分子式均相同
  - label: B
    content: 在氧氣中燃燒可以產生 $CO_{2}$
  - label: C
    content: 常溫常壓下，碳數少的烴（甲烷、乙烷）多是氣體
  - label: D
    content: 常溫常壓下，碳數多的烴多是液體或固體。
