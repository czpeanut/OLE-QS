  section: 1
  number: 3
  type: single
  page: 1
  stem: 甲、乙和丙三種物質的分子結構如圖所示。已知 H、C 和 O 的原子量分別為 1、12 和 16，則下列敘述何者正確？
  options:
  - label: A
    content: 甲分子量大於丙分子量
  - label: B
    content: 甲、乙和丙均為非電解質
  - label: C
    content: 甲、乙和丙均為有機化合物
  - label: D
    content: 甲和乙分子式相同，其化學性質相同。
