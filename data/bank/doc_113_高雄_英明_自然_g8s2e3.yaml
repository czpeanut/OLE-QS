  group_stem: '烷類是由碳和氫所組成的有機化合物，碳原子數目為一、二、三、四的烷類依次稱為甲烷、乙烷、丙烷和丁烷，它們完全燃燒時都產生二氧化碳和水。

    現代家庭中最常用的燃料是天然氣和液化石油氣。剛開採的天然氣不能直接利用，其中含有二氧化碳和硫化氫等雜質，須在－18℃、高壓下冷凝分離。除去雜質的天然氣主要成分為甲烷及乙烷，可用輸氣管輸送給用戶使用。天然氣也可在－162℃和更大的壓力下液化，運送到不產天然氣的地區。

    液化石油氣是從原油分餾而得，主要成分為丙烷和丁烷。丙烷和丁烷的沸點較低（分別為－42℃和－0.5℃），容易氣化。當原油分餾時可在分餾塔的上層分離出，經冷卻、壓縮變成液態，裝入鋼瓶可供一般家庭或汽車作為燃料。'
