  section: 1
  number: 4
  type: single
  page: 1
  stem: 有關聚合物的敘述，下列何者錯誤？
  options:
  - label: A
    content: 鏈狀聚合物遇熱熔化，具可塑性故可回收重複使用
  - label: B
    content: 寶特瓶遇熱會軟化變形，是一種熱塑性聚合物
  - label: C
    content: 合成聚合物的種類可分為鏈狀及網狀聚合物兩種
  - label: D
    content: 澱粉經過消化後，人體仍然無法吸收，因為澱粉是聚合物。
