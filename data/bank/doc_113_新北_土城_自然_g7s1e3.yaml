- id: doc_113_新北_土城_自然_g7s1e3_s2_39
  section: 2
  number: 39
  type: single
  page: 4
  stem: 文中提到，人類的左右大腦有功能側化現象，關於下列敘述何者正確？
  options:
  - label: A
    content: 左腦負責控制人類左腿
  - label: B
    content: 左腦應控制面部辨識技能
  - label: C
    content: 右腦負責說話、語言能力
  - label: D
    content: 右腦負責控制人類左手。
  group_stem: '請閱讀這篇文章後回答第39-40 題：

    你應該看過一些圖，例如「旋轉的舞者」或「前進的騎士」，聽說這些圖可判斷你是左腦人還是右腦人。然而這些傳聞可能純屬謠言，或說是偽科學。因為一來，僅要你判斷舞者或騎士方向，無法確認你擅長用左腦還是右腦；二來不管你進行的是理性思考，還是感性的創意，兩側的大腦都要同時使用。正常人左右腦之間，會透過胼胝體（corpus
    callosum）來溝通訊息。可是，在醫療倫理未像今天這樣良好建立的時代，神經外科醫師會為癲癇病患進行一種手術，把胼胝體咔嚓切掉，讓大腦不正常的同步放電侷限在一個腦半球，減輕癲癇發作時的症狀，稱為裂腦人。羅傑．斯佩里因裂腦人的研究榮獲
    1981 年諾貝爾生理醫學獎，當時他與一群科學家在加州理工設計一系列實驗，探討裂腦人在語言、視覺和運動上的變化，他們發現一些神經認知過程，有左右腦功能側化的現象，也就是主要會由一個腦半球掌管，如左腦主要負責說話和語言能力，右腦主要掌管空間和面部辨識。

    －摘錄修改自《咔嚓！切開左右腦》。'
