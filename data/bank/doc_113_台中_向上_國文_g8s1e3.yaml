  stem: 「竹性直，直以立身。君子 見其性，則思中立不倚者。」白居易由竹子的秉性正直，引發君子正直無私，不趨炎附勢的聯想，由此可知，竹子與蓮花的何種特質最為相近?
  options:
  - label: A
    content: 出淤泥而不染
  - label: B
    content: 中通外直，不蔓不枝
  - label: C
    content: 香遠益清，亭亭淨植
  - label: D
    content: 可遠觀而不可亵玩焉
  group_stem: '竹似賢，何哉?竹本固，固以樹德(1)，君子見其本，則思善建不拔者。竹性直，直以立身；君子見其性，則思中立不倚者。竹心空，空以體道；君子見其心，則思套用虛受者。竹節貞，貞以立志；君子見其節，則思砥礪名行，夷險(2)一致者。夫如是，故君子人多樹之，為庭實焉。—《白居易・養竹記》

    注釋:(1)樹德:建立品行 (2)夷險:平坦與險阻'
