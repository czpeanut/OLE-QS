  stem: 「要了解鳥類如何體驗世界，利用人類的感覺系統只能算是起點，只要能辨別牠們具備我們沒有的感覺，只要我們不自動假設牠們跟我們共有的感覺一模一樣，就可以略窺鳥類的感覺世界。」(博克海德〈鳥的感官.後記〉)根據這段文字，下列敘述何者正確?
