  stem: 依據上文，「那沉默的樹」主要遭受何種威脅？
  options:
  - label: A
    content: 居民缺乏公德心
  - label: B
    content: 綠建材不受重視
  - label: C
    content: 都市高密度開發
  - label: D
    content: 消費者意識高漲
  group_stem: "（甲）\n    那沉默的樹，暗中伸展它的根，加大它所能蔭庇的土地，一公分一公分的向外。但是，這世界上還有別的東西，別的東西延伸得更快，柏油一里一里鋪過來，高壓線一千碼一千碼架過來，公寓樓房一排一排挨過來。所有原來在地面上自然生長的東西都被剷除，被連根拔起。只有那樹被ㄧ重又ㄧ重死魚般的灰白色包圍，連根鬚都被壓路機輾進灰色之下，但樹頂仍在雨後滴翠，經過速成的建築物襯托，綠得很深沉。公共汽車在樹旁插下站牌，讓下車的人好在樹下從容撐傘。入夜，毛毛細雨比貓步還輕，跌進樹葉裡匯成敲響路面的點點滴滴，洩漏了秘密，很溼、也很詩。那樹被工頭和工務局裡的科員端詳過、計算過無數次，任他依然綠著。\n\
    \ (王鼎鈞〈那樹〉)"
