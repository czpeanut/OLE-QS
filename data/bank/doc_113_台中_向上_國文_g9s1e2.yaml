- id: doc_113_台中_向上_國文_g9s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 語言常隨時代遷異而改變字詞意義，或因前後文意而有不同的釋義。下列文句「  」內的詞語，前後詞義相同的是何者？
  options:
  - label: A
    content: 你待父母不孝，當心「出爾反爾」，日後兒女也如此待你／人生在世就講個信字，「出爾反爾」，難以立信
  - label: B
    content: 古時大官出巡時，出動大批人馬，「前後呼應」的，好不威風／寫作要點裡有一句話說「前後呼應」波瀾生，文章有了貫通，自然會有波瀾的氣勢
  - label: C
    content: 他從盛氣凌人一變而為諂媚溫馴，「前倨後恭」，態度差距之大／也許是人性的弱點吧！社會上像他那樣「前倨後恭」、趨炎附勢的人還真不少
  - label: D
    content: 這件無頭公案，經過一番調查，事情真相總算「水落石出」／冬日出遊，眼見山高月小，「水落石出」
  tags:
