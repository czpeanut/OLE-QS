  section: 1
  number: 6
  type: single
  page: 1
  stem: 關於課文的敘述，下列選項何者錯誤？
  options:
  - label: A
    content: 〈蘇東坡突圍〉中提到「蘇東坡經歷了一次整體意義上的脫胎換骨……成熟於一場災難之後，成熟於滅寂後的再生，成熟於窮鄉僻壤，成熟於幾乎沒有人在他身邊的時刻。」這段話，說明「龍游淺水遭蝦戲」的涵義
  - label: B
    content: 〈與宋元思書〉文中，以「疏條交映，有時見日」傳達吳均寄情山水、淡泊名利的人生態度
  - label: C
    content: 〈生於憂患死於安樂〉文中的「入則無法家拂士，出則無敵國外患者，國恆亡。」這段話，點出「無人輔弼與忠諫，易導致政治腐化」的道理
  - label: D
    content: 〈一家手語餐廳的誕生〉一文，以馬克‧吐溫的語錄：「仁慈是一種聾子能聽見、盲人能看見的語言。」希望大家能了解仁慈是超越限制的溝通方式
  tags:
    textbook: 九上 第四課 黃州突圍
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 九上
      subject: 國文
      code: 第四課
      title: 黃州突圍
      chapter: null
