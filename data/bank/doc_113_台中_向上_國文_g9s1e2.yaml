- id: doc_113_台中_向上_國文_g9s1e2_s2_37
  section: 2
  number: 37
  type: single
  page: 4
  stem: 文中敘述印傭看護父親時的小插曲，用意是在說明？
  options:
  - label: A
    content: 父親忘記子女早就長大，卻未曾忘記對子女付出關愛
  - label: B
    content: 一旦子女將照護責任委託給看護，就忘記晨昏定省
  - label: C
    content: 人們容易記得照護老人衣食，卻忘了關懷對方內心
  - label: D
    content: 作者希望遺忘自己已然成年的事實，回到童年時光
  group_stem: "（丙）\n   衰老，也許更類似於一種自我放逐，跌跌撞撞地，孤單走去一個不想被人找到的地方。\n   但是，我彷彿感覺得到，在他衰老的肉身之下，靈魂內裡的自我意識並未消失，只是他被困在一個機械有些故障，按鈕經常失靈的太空艙裡，無法接受到清楚的地球發訊，也因電力不足讓頭腦指令轉達變得吃力。\n\
    \   也許，他正漂浮在人類經驗中最神秘的時空，一個老化後的宇宙，我們每個人都終將前往的他方。\n   然而探險仍在繼續。每一位老人都正在這段漂浮中，體驗著只屬於他們的宇宙風景。雖無法將這段旅程的心得回傳分享，但不表示他沒有在感受著，感受著那個重力在逐漸改變中的時空。\n\
    \   每一個老人都像是一艘朝更遠的宇宙發射出去的太空梭，生命的探索都仍在進行中。在身邊負責照顧的我們，就是他們在外太空漂流時，唯一的地面塔台，他們的通訊領航員。\n\
    \   終會有那麼一日，科技最後幫我們解開這個神秘航程的意義。到了那天，一切都會有解釋，我們的父母在晚年，到底去了哪裡？……\n   有一天看護跟我說，爺爺昨天半夜突然起床，跑去廚房開冰箱。\n\
    \   「我問他，爺爺你要找什麼？他說，小弟要喝牛奶了。」印傭說到這裡咯咯樂不可支：「小弟？那是誰。他說，我小兒子。我就跟他說，爺爺，你兒子已經長大了，不要喝牛奶了！去睡覺了！講講以後好像他有想起來了。」\n\
    \   印傭覺得這個小插曲很有趣，但聽在我耳裡有一點心酸，一時無言，同時又像是有一股濕暖的風吹進了心口。\n   閉上眼，想像父親開冰箱的畫面。\n   我知道，在深層的精神面，父親知道自己在「家」。他也知道，我就在他身邊。\n\
    \   雖然那個我，整整小了五十歲。\n   我們都失智。\n   父親無法記得的是剛剛發生過，我則是忘記了很久很久以前的那個自己。忘記在我幼小的時候，年輕的父親肯定不止一次，曾在夜裡起來幫我泡過牛奶。\n\
    \ （改寫自郭強生〈我們都失智〉）"
