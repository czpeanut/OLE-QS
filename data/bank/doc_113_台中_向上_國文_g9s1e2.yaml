- id: doc_113_台中_向上_國文_g9s1e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: '「等他們說完了，我忽然覺得驚訝不可置信，他們中間照我來看分成兩類，有一類說『我從前愛玩，不太用功，從現在起，我想要好好讀點書』，另一類說『我從前就只知道讀書，從現在起我要好好參加些社團，或者去郊遊』。奇怪的是，兩者都有輕微的追悔和遺憾。」

    閱讀上文，可從本文獲得的體悟為下列何者？'
  options:
  - label: A
    content: 年輕人貪婪而不知足，妄想不勞而獲
  - label: B
    content: 人們總是嚮往未曾體驗過的生命經驗
  - label: C
