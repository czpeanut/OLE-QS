- id: doc_113_台中_向上_國文_g9s1e2_s1_30
  section: 1
  number: 30
  type: single
  page: 3
  stem: '「人生自古誰無死？」雖是問句，但其用意並不在徵詢答案，而在強調作者預設的觀點，屬於「無疑而問」。下列文句，哪些也使用相同的表意方式？

    （甲）不過這種看法是以偏概全的，客家人中「唯利是圖」的人何嘗少於福佬人？這是不分種族的人性普遍的一個層面罷了。（葉石濤〈苦悶的靈魂〉）

    （乙）我的家人在內心也一定討厭照相吧。既然如此，為何我們會照那麼多的相片呢？那是因為當時我有位名叫鈴木善兵衛的食客，他正好是個照相師。（呂赫若〈玉蘭花〉）

    （丙）危急存亡，不絕如縷，設非衛士抗亂，國將不國，何來大學？但那畢竟是 「非常」時期，有非常的理由。（金耀基〈大學之功能與大學生的責任觀〉）

    （丁）家裡的人剛循舊俗祭拜天地，為我行成年禮不久。然而男子成年後又將如何呢？我是不免在想起時總有困惑的。（陳列 〈老兵紀念〉）'
