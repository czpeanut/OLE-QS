- id: doc_113_台中_向上_國文_g9s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 關於駢文與散文的比較，哪位國學大師敘述的內容最為正確？
  options:
  - label: A
    content: 張大師：字句上，駢文多以四、六字句為多；散文則以五、七言為主
  - label: B
    content: 李博士：駢文別稱四六文；散文又名新體文
  - label: C
    content: 黃學者：駢文採平仄通押，一韻到底；散文注重音韻，聲調和諧
  - label: D
    content: 蘇學士：駢文常用對偶，格式整齊；散文形式自由，不要求對偶
