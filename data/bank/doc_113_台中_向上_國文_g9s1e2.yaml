- id: doc_113_台中_向上_國文_g9s1e2_s2_39
  section: 2
  number: 39
  type: single
  page: 4
  stem: 文中謠傳作者蘇軾得道，乘小舟入海不復返，可能是讀了他哪部作品所作的猜測？
  options:
  - label: A
    content: 算除非，痛把酒療花治。明日五湖佳興，扁舟去，一笑誰知
  - label: B
    content: 長恨此身非我有，何時忘卻營營。夜闌風靜縠紋平。小舟從此逝，江海寄餘生
  - label: C
    content: 欲去不得去，薄遊成久遊。何年是歸日，雨淚下孤舟
  - label: D
    content: 潮落江平未有風，扁舟共濟與君同。時時引領望天末，何處青山是越中
  group_stem: "（丁）\n    我之前被貶謫到黃州時，曾子固正滿懷憂愁的心情居住在臨川這個地方，後來去世了。竟有人隨意謠傳我和子固在同一天死去，還說：「這就跟李長吉那時的事情一樣，是上帝在召喚他啊。」當時就連先帝也聽到了這個謠言，還詢問起蒲宗孟這件事情。\n\
    \    今天我被貶謫到海南，又有謠傳說我已經領悟仙道，乘著小舟入海再也不會回來了。鬧得整個京城都在傳這個謠言，兒子還寫信來告訴我這件事。今天也有從黃州到這裡來的人，還到處問為什麼會傳這些話。\n\
    \    我想，那是因為我在儋縣的時候，有天忽然迷路，不知道自己在什麼地方，身上也只有一件道服而已，所以就有點像道家所謂的羽化成仙，可能是因為這樣而被傳吧。\n\
    \    我平生遭小人誹謗無數，這大概是因為我出生的時辰和韓愈太相近的關係吧。我命宮在斗宿，而韓愈則是身宮在斗宿，所以韓愈在詩裡面才說：「我出生的時辰剛好是月亮運行至北方玄武七宿的斗宿。」又說：「沒有良好的名聲可以為人民所知，反而人民只知道那些誹謗我的不好名聲。」\n\
    \    今天誹謗我的人，有的說我去世了，有的說我羽化成仙了，可見韓愈說出生時辰剛好遇到月亮運行至斗宿的人，容易遭受小人誹謗的話並不是沒有根據的。"
