  stem: '請判斷下列新詩所歌詠的物象，共有幾項正確？

    （甲）我不算博學／但我很多聞／從開始就聽／唇槍舌劍語／口沫橫飛／滔滔不絕：電話

    （乙）歲月，原本是一襲安靜的羽衣／我們心連心的／相偎依／恬睡在羽衣的包被／可別攪亂我們的安寧啊／尤其別惹我們／以火／千萬別讓我們／在一聲怒吼之後／奮不顧身的／跳起：飛蛾

    （丙）是的，我們很彆扭／不敢迎向／任何一種撫觸／一聽到誰的聲響迫近／便緊緊摺起自己／以密密的、小小的刺／衛護自己：鬼針草

    （丁）桃之夭夭盡逃之夭夭／凡迎風紅妝的都紅過了／唯壓你不倒，壓不倒／逆風赫赫你標舉的燦爛／列黃旗簇金劍耀眼的長瓣／昂向秋來肅殺的風霜／綻不盡重陽高貴的徽號：菊花

    （戊）美味是早夭的原罪／肉身卸甲之後／無防備地讓蒜泥調情調味／下酒／並且消化／在人體裡留下膽固醇的伏筆／以在對方無可抵禦的老年／溫柔地報復：螃蟹。'
