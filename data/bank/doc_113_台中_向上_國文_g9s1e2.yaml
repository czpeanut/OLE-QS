  type: single
  page: 1
  stem: 關於〈與宋元思書〉一文的說明，下列何者正確？
  options:
  - label: A
    content: 根據書信的寫作用語，信文起首須加上「元思吾友 膝下」，文末以「弟叔庠 敬啟」作結
  - label: B
    content: 「泉水激石，泠泠作響；好鳥相鳴，嚶嚶成韻。蟬則千轉不窮，猿則百叫無絕」這段文字，描寫富春江沿岸物種豐富多元與峰谷中的生態景觀
  - label: C
    content: 文中「鳶飛戾天者，望峰息心；經綸世務者，窺谷忘返」這句，描寫的心靈層次境界最高
  - label: D
    content: 「水皆縹碧，千丈見底，游魚細石，直視無礙。急湍甚箭，猛浪若奔」這段文字寫出富春江的水流湍急，面積廣大
