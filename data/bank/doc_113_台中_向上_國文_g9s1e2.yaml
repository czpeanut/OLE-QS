- id: doc_113_台中_向上_國文_g9s1e2_s1_27
  section: 1
  number: 27
  type: single
  page: 2
  stem: '「我捧著那本書，心頭洋溢著無限的歡樂，吃飯時，一手撥著飯，一手掀著書頁，睡在床上時也讀，書中的故事，在那個讀小學的孩子的腦中，展現出一片新鮮而綺麗的境界，故事中那些人物的名字……在我也似有無限的魅力，書中的那些美麗而又活潑的青春女兒們……是在我的生活中從不曾遇到過的，她們是仙子嗎？掩上書本，我開始幻想了，世界上真有這樣的一些女孩子們嗎？……由於讀了這本海濱故人，那狹小的生活圈子，在我竟成了一個枯燥的沙漠，我開始渴望著一片淡藍色的海洋。」（張秀亞〈我與文學〉）

    上文描寫「閱讀」對作者產生的影響，說明正確的選項為何者？'
  options:
  - label: A
    content: 作者因為書中所寫的虛構故事，進而對人世間的現實與虛幻有了深刻思索
  - label: B
