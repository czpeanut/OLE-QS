  stem: 小說《紅塵》以住在北京城的龍家一家為主軸，時間跨越清末一直到國民政府撤退來臺，雖然主軸環繞著龍家四代人，但也是生長在那個大時代的中國人會遭遇的故事。書中提到龍家在(甲)中日戰爭期間帶領家人遷居至重慶城區，卻不時遭遇(乙)美軍的空襲，不得已只好到重慶郊區躲避。在重慶期間，(丙)龍家的子弟們受到政府徵召，前往前線作戰。最後抗戰勝利沒多久，(丁)龍家選擇遷居至臺灣，以躲避中國內戰。請問：畫線部分何者錯誤？
