  group_stem: "※下文為民國 22 年 7 月 30 日，上海 申報的文章，閱讀後回答下列問題：\n  我國由農本主義，一轉而為工業之國；然我國之工業化，對於技術與資產，今日已不成問題，唯一障礙即缺乏原料。蓋我國產的重要工業原料，除生絲外，均感不足。今欲求原料供給於安全地帶，全賴亞洲大陸，就中滿蒙之於我國所以稱為生命線者；由國防方面言之，適當皇道宣揚之要衝；他如人口食糧問題、工業原料問題、物業市場問題等經濟問題，在在與我國存亡相關。換言之，平時為解決國內問題之地域，戰時為供給帝國資源不足的地域是也。\n\
