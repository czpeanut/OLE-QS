  stem: 下列是1930 年代前期，蔣中正對黨內將領的訓詞：「我國的敵人不是寇，而是赤匪。東三省、熱河失掉了·····不過我們站在革命的立場上，却沒有多大關係·····凡我剿匪將领，嗣後若再以北上抗日請命，而無決心剿匪者，當視為生怕死之輩，所無赦。無論外面怎樣的批評毀謗，我們總是以先清內匪為唯一要務，那就是本末倒，先後倒置。」
