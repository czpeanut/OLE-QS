  section: 1
  number: 26
  type: single
  page: 1
  stem: 這座城市鄰近長江出海口，清末開港通商以來，逐漸形成二大區域：中國政府管轄的老城區與外國人主導治理的租界區，租界區的外國人享有行政與經濟等獨立自主權，可自組行政機構，並在租界區徵稅。八年抗戰爆發後，因為西方國家保持中立，日軍原則上不能進入西方國家租界區內，所以該地區仍享有特權和保障。但後來某事爆發，不但造成美、英等國對日宣戰，日本也進兵西方國家租界區，侵占外國企業，進一步控制該城市。上文所提的某事，應為下列何者？
