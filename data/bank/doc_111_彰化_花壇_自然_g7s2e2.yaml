  stem: 根據上述文章，下列敘述何者正確？
  options:
  - label: A
    content: 淡水河內當初所放養的為麗文蛤
  - label: B
    content: 台灣文蛤與麗文蛤屬於同屬同種
  - label: C
    content: 分辨文蛤的主要方式是根據外殼形狀
  - label: D
    content: 文章中所提到的四種文蛤分別列在不同屬。
  group_stem: '⚫ 請閱讀以下敘述後完成第35~36題：

    農委會水試所透過DNA鑑定，發現台灣養殖的文蛤，非如過去認知是原產於日本的麗文蛤，而是台灣原生、未被描述的新種，3月正式在國際期刊發表並命名為「台灣文蛤」（學名Meretrix
    taiwanica）。

    水試所副所長葉信明表示，日治時代日本人曾在淡水河放流麗文蛤（學名Meretrix lusoria），待其長成再採收，開啟台灣文蛤養殖產業；後來台灣人自行研發出池養技術，去年產量更近5.3萬公噸，但也長期遭人誤以為，飼養文蛤是當初放流的麗文蛤的後代。

    水試所新聞資料指出，文蛤屬中的麗文蛤、中華文蛤（Meretrix petechialis）和普通文蛤（Meretrix meretrix），殼形等外部形態特徵相近，但個體間花紋變異大，種類鑑定容易發生混淆。

    水試所並針對其他相似種進行調查與研究，確認「台灣文蛤」主要分布於台灣與中國大陸南部沿海；中華文蛤分布於中國沿岸；麗文蛤分布於日本和韓國；普通文蛤則只分布於東南亞。

    改寫自中央社《水試所鑑定養殖文蛤DNA

    發現新原生種「台灣文蛤」》報導'
