  group_stem: '⚫ 請閱讀以下敘述後完成第39~40題：

    屏東科技大學收容中心有一隻獅虎「阿彪」，臉形像獅子但沒有獅鬃、有黑紋的圓耳與尾巴則是老虎的特徵。牠是13年前台南某農場將非洲公獅和孟加拉母虎交配所生下，是同腹3胎獅虎中唯一存活至今的雜交後代。

    但是異種交配造成兩個基因缺損的問題，其一為阿彪的脊椎變形造成左後肢僵直；其二為缺乏「控制體形」的基因，阿彪若不經由人為控制食量，體重恐怕會無限制飆升，形成龐大的身體負擔，再加上牠的左後肢缺陷將成致命隱憂。

    保育員指出，很多非自然的收容動物因為人類自私的娛樂、幻想而飼養或繁殖，但後續長期的醫療與照養問題卻是由國家資源來負擔。期盼阿彪的存在讓人類更關注生命教育及倫理、拒絕前往不當對待野生動物的場所與人工異種交配的非自然生物，不再讓悲劇重演。'
