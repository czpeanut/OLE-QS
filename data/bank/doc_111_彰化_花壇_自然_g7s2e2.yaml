- id: doc_111_彰化_花壇_自然_g7s2e2_s2_44
  section: 2
  number: 44
  type: single
  page: 4
  stem: 造成肺結核的結核桿菌有什麼特色？
  options:
  - label: A
    content: 沒有細胞膜
  - label: B
    content: 沒有細胞核
  - label: C
    content: 有葉綠體
  - label: D
    content: 和黴菌屬於同一界。
  group_stem: '⚫ 請閱讀以下敘述後完成第44~46題：

    在全力對抗新冠肺炎的同時，不要忘了防堵同樣是呼吸道傳染性疾病的肺結核，和新冠肺炎不同，肺結核是由結核桿菌侵襲肺臟所造成的慢性傳染病，若有長期咳嗽、一到下午就發燒、多痰、胸痛之症狀，應該要到醫院做詳細檢查。因結核桿菌抗藥性問題嚴重，一但確定染病，之後一定要遵照醫師指示，按時服藥與定時追蹤，才能控制病情。

    已感染肺結核的病人則會經由咳嗽、打噴嚏等方式的飛沫傳播給其他健康的人，且結核桿菌對環境抵抗力很強，可以長期潛伏在宿主體內，等患者抵抗力變弱才發病，目前做胸部
    X 光檢查與驗痰是診斷肺結核的主要辦法。

    20歲以下族群當中，以3歲以下嬰幼兒與14~19歲青少年特別容易感染，為了預防結核桿菌感染，一般嬰幼兒會接種「卡介苗」。而成年人則要增強身體免疫力，也要養成好的生活習慣，像是勤洗手、咳嗽或打噴嚏時以衛生紙掩住口鼻、居住環境保持通風良好，這些方式都能減少病菌的傳播。

    《本文節錄自少年牛頓 2022 年 2 月 209 期》'
