  type: single
  page: 3
  stem: 下列有關芒果鳳梨的敘述，何者錯誤？
  options:
  - label: A
    content: 芒果鳳梨屬於植物界中的被子植物
  - label: B
    content: 芒果鳳梨為俗名，台農23號才是學名
  - label: C
    content: 芒果鳳梨的名稱是因為其果肉香味而定
  - label: D
    content: 芒果鳳梨是由台農19號與台農21號雜交生成。
  group_stem: '⚫ 請閱讀以下敘述後完成第33~34題：

    近日傳出我國「芒果鳳梨」品種遭中國偷種，「芒果鳳梨」為農友替「台農23號」所取的暱稱，是我國農業試驗所費時超過20年所培育成功且申請品種權之新品種，其果實屬糖度及酸度均高品種，果肉帶有芒果香氣。

    鳳梨為鳳梨科（Bromeliaceae）、鳳梨屬（Ananas）多年生草本果樹，英文稱為 Pineapple。

    「台農23號」係於民國83年以「台農19號」為母本，「台農21號」為父本進行雜交組合所得知品系，由於品種植株矮小，管理方便，適合以機械化的方式省工作業。

    「台農23號」鳳梨具備果肉黃色、肉質柔軟、糖度高且耐儲藏等特性，春末至秋季收穫之果實品質亦佳，可取代「台農17號」金鑽鳳梨於夏、秋季之國內外市場需求。'
