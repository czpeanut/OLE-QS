  stem: 依據生物分類「種」的定義，獅虎「阿彪」是否屬於生物物種？
  options:
  - label: A
    content: 屬於，因為阿彪是個活生生的生物
  - label: B
    content: 屬於，因為阿彪是非洲獅與孟加拉虎生下的後代
  - label: C
    content: 不屬於，因為阿彪的身形並無法繁殖後代
  - label: D
