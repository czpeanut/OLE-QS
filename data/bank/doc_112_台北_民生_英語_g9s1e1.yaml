  group_stem: "Once upon a time, there was an old castle in the deep forest. People\
    \ called it The Castle of Horror because it was just like a scene in a horror\
    \ movie, and they were too scared to get near it. What is worse, there were many\
    \ bats flying around and someone claimed he saw ghosts in the castle.\n    To\
    \ nobody's surprise, some people went into the castle to look for an adventure.\
