    content: A Good Way to Solve a Big Problem.
  - label: C
    content: Buy One and Get One Free.
  - label: D
    content: Prices Are More Important than Anything.
  group_stem: "Mike has owned a hardware store in a busy town for many years. He was\
    \ quite happy with his business. However, he soon had some competition. A new\
    \ hardware store has opened up lately next door. The new store was not very big,\
    \ but it had a huge sign. It read BEST DEALS. The huge sign has drawn many customers\
    \ since it was put up.\n    Mike was worried. He couldn't sleep at night. He tossed\
    \ and turned in his bed since the new store opened. And then to his big surprise,\
