    \ eyes quickly, which means that they look straight into your eyes one moment,\
    \ but the next moment they look somewhere else. They open and close their eyes\
    \ more often, too. They may blink their eyes up to eight times in a minute. Besides,\
    \ they may have some unusual actions like turning their head, touching their face,\
    \ or biting their lips. They may even sound different. For example, ____(30)____.\n\
    \    The study also says that people are not very good at spotting lies. ____(31)____.\
