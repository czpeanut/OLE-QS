    \ bats ate them? Some people believed that those people died because they had\
    \ nothing to eat inside the castle. But most people thought it was just someone\
    \ trying to _bamboozle_ others; the stories of ghosts and missing people were\
    \ all fake.\n    Now, the owner of the castle plans to renovate it and turn it\
    \ into a hostel soon. The accommodation is cheap enough for most people to afford.\
