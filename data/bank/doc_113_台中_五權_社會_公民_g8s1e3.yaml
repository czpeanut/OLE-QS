  type: single
  page: 1
  stem: 下列對於選舉原則的敘述，何者是正確的?
  options:
  - label: A
    content: 被監護宣告者不能領「選人」選舉的票，這是屬於普通原則
  - label: B
    content: 「一人一票，票票等值」是屬於平等原則。不適合用在立委選舉的投票
  - label: C
    content: 由選民直接選出行政首長，可以由代理人行使投票權。這是屬於直接原則
  - label: D
    content: 祕密投票原則就是無記名原則。
