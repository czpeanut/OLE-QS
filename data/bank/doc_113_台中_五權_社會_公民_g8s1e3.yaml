  type: single
  page: 1
  stem: 下列對於「單一選區兩票制」的敘述何者為非?
  options:
  - label: A
    content: 政黨選舉票全國選票內容是一致的
  - label: B
    content: 「單一選區」是指區域立委每張選票上的候選人只有一人當選
  - label: C
    content: 政黨票得票比例超過5%的政黨，才能依得票比例分配全國分區立委席次
  - label: D
    content: 「兩票制」是指一票選人一票選黨。
