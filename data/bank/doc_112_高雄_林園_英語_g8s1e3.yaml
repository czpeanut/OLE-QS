  group_stem: "Convenient Taipei\n  How do visitors get around in Taipei when they\
    \ come to this city? Taxis（計程車）are convenient but maybe too \nexpensive. Taking\
    \ a bus is less（較少的）expensive but not as convenient because traffic（交通）can be\
    \ terrible \nsometimes. Can visitors travel around Taipei in a cheap and convenient\
    \ way? Yes, by taking the metro.\n \n  Taking the metro is very convenient for\
    \ visitors.  The stations are close to many famous places around the city. \n\
    For example, there are stations near Taipei 101, Shilin(士林) Night Market, and\
    \ Tamsui Old Street. It only takes a little \ntime and money to travel from one\
    \ place to another. Besides, it’s very clean and comfortable. Visitors can do\
    \ some \nreading or get some sleep on the metro between stations.\n  Taipei is\
    \ a wonderful city to spend time in. Visitors can enjoy their stay with its convenient\
    \ and safe metro ride."
