  group_stem: '“What time is it?” You are in Taiwan. It’s 4:00 in the afternoon. You
    call a friend in California, the USA. But she cannot answer the phone. In fact,
    it’s 0:00 a.m. in California. She’s sleeping. Taiwan and California are in different
    time zones. Every zone has its time. People in different time zones set their
    clocks to different times. Why? The Earth spins. When the sun is rising in one
    part of the world, it is setting in another. There are four time zones in the
    USA on this map. China is a big country, too. But there is only one time zone
    in China. Isn’t it fun?


