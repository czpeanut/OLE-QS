  group_stem: '(There are two hands on the clock. The short hand points to the hour.
    The long hand points to the minute.

    There are twelve numbers on the clock.)

    Sandy：Where is the short hand, Carol?

    Carol：It’s at 7.

    Sandy：Very good. Well, where is the long hand?

    Carol：The long hand is at 12.

    Sandy：It’s 7 o’clock.

    (Sandy is moving the two hands on the clock.)

    Sandy：Now, where is the short hand?

    Carol：It’s between 8 and 9.

    Sandy：Right. So it’s between 8 and 9 o’clock. What about the long hand?

    Carol：It’s at 6.

    Sandy：Yes, it’s half past eight. It’s 8:30.

    Carol：Oh, I got it. It’s fun.

    Mom：Carol, what time is your violin class today?

    Carol：It’s at ten thirty.

    (Carol is looking at the clock on the wall.)

    Carol：Oh, no! I have to go now. It’s 10:25.


    | hand（鐘錶的）指針 | hour 小時 | minute 分鐘 | point to 指向 | violin 小提琴 |'
