  - label: B
    content: 紀政即使腿傷，仍跑出黃色閃電的封號
  - label: C
    content: 貝多芬即便耳聾，依舊能創作出動人的交響樂
  - label: D
    content: 彌爾頓心盲目不盲，故能創作出不一樣的作品
  group_stem: "幾乎每一個偉人都是負載著一根刺的創痛，而把自己仍舊活的光燦美麗的。\n    太史公帶著他的殘缺，完成雄峙屹立的《史記》；貝多芬帶著他的耳聾，譜成移神動魄的音樂；潑墨大畫是張大千有了眼疾以後作的；「黃色閃電」的封號是紀政忍著腿傷贏來的；彌爾頓瞎了眼，我們仍然讀到了《失樂園》和《復樂園》；海明威在《老人與海》中，反覆提到球怪迪馬吉奧──他的腳上偏偏生了一個雞眼。\n\
    \  所有精神或肉體上的傷害，無非是或大或小的沙礫，一般人急著趕走它，但假以日積月累的包容和涵蘊，它也可以變成曖曖內含光的珍珠。             \
    \   取自〈當胸擁抱傷痕〉"
