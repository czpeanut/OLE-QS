- id: doc_113_新北_板橋_國文_g7s1e3_s2_22
  section: 2
  number: 22
  type: single
  page: 2
  stem: 「橫溢的天才一如沃土，如果不加耕耘，也可能產生一些莠草。」此句涵義與下列何者最接近？
  options:
  - label: A
    content: 天不生無用之人，地不長無根之草
  - label: B
    content: 成功是一分的天才，加上九十九分的努力
  - label: C
    content: 點燃蠟燭照亮他人者，也不會給自己帶來黑暗
  - label: D
    content: 若所有人都能一同向前邁進，成功便會水到渠成
