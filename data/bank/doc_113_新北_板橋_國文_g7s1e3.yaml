  section: 2
  number: 27
  type: single
  page: 3
  stem: 「要把東西刻好，一定要懂得畫草圖，不要只是照著別人的圖或樣式來雕刻，否則，雕刻師不會畫圖，就像建築師會造屋卻不會畫設計圖一樣。」請問此段涵義與下列何者最不相近？
  options:
