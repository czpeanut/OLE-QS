  stem: 「一位記者問高齡95 歲的大提琴家凱梭：『您已經九十五歲，且是有史以來最傑出的大提琴家，為何每天還要練習六小時？』凱梭回答：『因為我還想進步啊！』」此句所表達的意涵與下列何者最近似？
  options:
  - label: A
