- id: doc_113_新北_板橋_國文_g7s1e3_s2_25
  section: 2
  number: 25
  type: single
  page: 3
  stem: 「黃媽慶是藝文界譽為三冠王的藝術家，其作品題材多數來自於他生活周邊的事物，如蔬菜、瓜果、花卉、昆蟲等。創作風格寫實且具個人特色，其木雕特色在於保持事物樸實無華的本質。」根據以上文字，何者最能與黃媽慶的取材做法呼應？
  options:
  - label: A
    content: 黃沙百戰穿金甲，不破樓蘭終不還
  - label: B
    content: 好鳥枝頭亦朋友，落花水面皆文章
  - label: C
    content: 此曲只應天上有，人間能得幾回聞
  - label: D
    content: 此夜曲中聞折柳，何人不起故園情
- id: doc_113_新北_板橋_國文_g7s1e3_s2_26
  section: 2
  number: 26
  type: single
  page: 3
  stem: 「凡富貴功名，半由人事，半由天命；唯讀書做人，全憑自己做主。」請問此段話涵義為何？
  options:
  - label: A
    content: 伸頭一刀，縮頭一刀
  - label: B
    content: 敏而好學，不恥下問
  - label: C
    content: 讀書做人，操之在己
  - label: D
    content: 謀事在人，成事在天
