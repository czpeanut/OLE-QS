- id: doc_111_桃園_同德_國文_g7s1e1_s4_31
  section: 4
  number: 31
  type: single
  page: 5
  stem: 根據本文，是什麼緣故使得作者改變對母雞的看法？
  options:
  - label: A
    content: 母雞的叫聲，如怨如訴，讓人不忍細聽
  - label: B
    content: 母雞為雛雞溫飽而奉獻的身影，如英雄偉大
  - label: C
    content: 母雞夜裡放聲啼叫站哨，捍衛村莊安全
  - label: D
    content: 母雞戰鬥時的強悍姿態，連公雞都退讓三分
  group_stem: "老舍＜母雞＞\n一向討厭母雞。不知怎樣受了一點驚恐。聽吧，牠由前院嘎嘎到後院，由後院再嘎嘎到前院，沒結沒完，而並沒有什麽理由；討厭！有時候，牠不這樣亂叫，可是細聲細氣的，有什麽心事似的，顫顫巍巍的，順著牆根，或沿著田壩，那麽扯長了聲如怨如訴，使人心中立刻結起個小疙瘩來。\n\
    \    牠永遠不反抗公雞。可是，有時候卻欺侮那最忠厚的鴨子。更可惡的是牠遇到另一隻母雞的時候，牠會下毒手，乘其不備，狠狠的咬一口，咬下一撮兒毛來。\n到下蛋的時候，牠差不多是發了狂，恨不能使全世界都知道牠這點成績；就是聾子也會被牠吵得受不下去。\n\
    可是，現在我改變了心思，我看見一隻孵出一群小雞雛的母親。\n不論是在院裡，還是在院外，牠總是挺著脖兒，表示出世界上並沒有可怕的東西。一個鳥兒飛過，或是什麽東西響了一聲，牠立刻警戒起來，歪著頭兒聽，挺著身兒預備作戰；看看前，看看後，咕咕地警告雞雛要馬上集合到牠身邊來！\n\
    當牠發現了一點可吃的東西，牠咕咕的緊叫，啄一啄那個東西，馬上便放下，教牠的兒女吃。結果，每一隻雞雛的肚子都圓圓的下垂，像剛裝了一兩個湯圓兒似的，牠自己卻削瘦了許多。假如有別的大雞來搶食，牠一定出擊，把牠們趕出老遠，連大公雞也怕牠三分。\n\
    牠教給雞雛們啄食，掘地，用土洗澡；一天教多少多少次。牠還半蹲著——我想這是相當勞累的——教牠們擠在牠的翅下、胸下，得一點溫暖。牠若伏在地上，雞雛們有的便爬在牠的背上，啄牠的頭或別的地方，牠一聲也不哼。\n\
    在夜間若有什麽動靜，牠便放聲啼叫，頂尖銳、頂淒慘，使任何貪睡的人也得起來看看，是不是有了黃鼠狼。\n牠負責、慈愛、勇敢、辛苦，因為牠有了一群雞雛。牠偉大，因為它是雞母親。一個母親必定就是一位英雄。\n\
    我不敢再討厭母雞了。"
