  group_stem: "改編自網路小說\n    我掙扎了好幾天，寫了一封信，跟她解釋「我寫這封信不是為了要特權……只是……」，只是什麼呢？只是我想解釋一下，人有時候會暫時當機，而我現在當機了，不是故意的。我很仔細地說明了我的狀況，告訴她我很抱歉。信件最末，我問她可不可以再給我一次機會。\n\
    \    她很快地回信了，語氣不若她講課時的高冷：「我明白了，考量到你目前的狀況，原本要交的四篇報告，妳可以只交三篇。我會依照妳此時情形，再看妳交付的三篇報告，權衡之後給分數。」空一行，她又說：「心理健康很重要，我們都會有脆弱的時刻，妳要照顧好自己，不要緊張，慢慢完成一篇報告。我會在我可以決定的空間內協助妳，加油！」\n\
    \    我反覆看著那封信，恨不得這是一封實體的書信，如此一來我可以抱著那一頁頁紙張痛哭。我是從那位教授身上，第一次切實明白地學到，什麼是真正的公平。公平是____________，並且在自己有裁量的空間內，做出足供他人信服的決定。\n\
    \   很多人會問我，我是如何漸漸走出來的。我說，一路走來我得到許多旁人的扶助。這裡的扶助是，他們真正看見我，他們照顧我是因為他們看見我，而不是看見自己想照顧別人的心。\n\
    \   我最後只交了三篇報告，得到一個屬於我的分數。\n   我不會說這是一個完美的結局。我只是很感謝那位教授。傑夫 貝佐斯說過：「聰明是一種天賦，而善良是一種選擇;天賦得來很容易，而選擇往往很困難。」\n\
    \   攸關公平性的操作，既細緻且艱難，她願意為一個相處不過半年學生做到這些，這不應只歸因於我的幸運，而是阿位教授，她也在這件事上，做出了個人的選擇，並且深遠地影響到另一個人對於自我的認知與定位。"
