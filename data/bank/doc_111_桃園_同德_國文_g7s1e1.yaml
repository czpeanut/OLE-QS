  stem: '以下是同德國中圖書館的借閱規則。參閱其中說明，以下學生對於借閱規則的解讀，何者正確？


    1. 開放時間：週一至週五早上08:00～12:00，下午13:00～16:00，若還書時圖書館未開放，可放至還書箱，隔天記得利用網際網路查詢是否已成功歸還。

    2. 借用證件：含借書條碼之學生證，七年級新生因學生證尚未製發，請使用臨時借書條碼。

    3. 借用冊數：每次以二冊為限。

    4. 借閱時間：二週，期滿可續借一次，一週為限。

    5. 還書：不須學生證，借閱之圖書如逾期未還，則立即停止借閱權限，停權天數即為逾期未還之天數。若不慎將書弄丟了，則買一本相同的書來還。'
