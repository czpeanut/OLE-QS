- id: doc_111_嘉義_北興_社會_公民_g9s1e2_s2_35
  section: 2
  number: 35
  type: single
  page: 4
  stem: 若兩家公司真的合併，將會在大台北地區獨佔KTV 產業。請問：下列何者在競爭上屬獨占企業？
  options:
  - label: A
    content: 公路運輸
  - label: B
    content: 自來水公司
  - label: C
    content: 手搖飲店家
  - label: D
    content: 家用淨水設備公司
  group_stem: '題組（五）

    近年來，愈來愈多業者積極跨足KTV 產業，例如：部分餐廳增設KTV 伴唱設備、商場設置迷你單人KTV，就連旅館也推出附設KTV 的房間配備。

    因娛樂選項多元化與少子化等因素衝擊，使KTV 產業營業收入大不如前，臺灣KTV 兩大龍頭業者―錢櫃與好樂迪為提升經營成效，已數次向公平會提出合併提案，但皆已失敗告終。

    公平會指出，受阻關鍵在於，錢櫃與好樂迪為KTV 前二位市占鰲頭，兩方合併後全國市占約達45%，大臺北地區甚至可高達90%，力量足以主導市場，恐有排擠新進業者與提高價格的疑慮，考量整體經濟利益後，拒絕兩方的要求。眼看合併之路遙遙無期，新進業者的競爭挑戰也蜂擁而至，KTV
    產業轉型已刻不容緩，應重新擬定經營策略，以突破市場困境。'
