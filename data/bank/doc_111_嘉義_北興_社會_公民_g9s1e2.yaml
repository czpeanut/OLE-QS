- id: doc_111_嘉義_北興_社會_公民_g9s1e2_s2_20
  section: 2
  number: 20
  type: single
  page: 2
  stem: 文中提到若咖啡以打5 折的方式促銷，在什麼狀況下不利於業者？
  options:
  - label: A
    content: 每人一次喝超過一杯
  - label: B
    content: 顧客會願意主動推銷
  - label: C
    content: 來客數沒有超過一倍
  - label: D
    content: 民眾呼朋引伴來購買
  group_stem: '題組（一）

    以行銷理論來看「買一送一」和「降成半價」，假設一杯咖啡成本10 元售價120 元，降成半價的話利潤只剩50 元，換作買一送一利潤則有100 元，同樣是一組客人，買一送一的利潤是調降半價的2
    倍，對業者來說當然是買一送一才能提高營收。假如直接打5 折，以咖啡這種一般人一次不會喝超過一杯的產品特性，就算降價促銷也很難提高消費量，所以如果打5 折，來客數沒有超過一倍的話，反而會愈促銷愈糟糕。

    相反的，買一送一除了能夠讓人呼朋引伴一起購買，等於是讓顧客主動推銷，可以達到宣傳和廣告的效果。此外，若商品直接打5 折來賣，會讓消費者對於品牌價值認同大打折扣，讓平常用原價購買的民眾有一種「原來半價就可以買得到」的吃虧感，漸漸產生不願再消費的心理，買一送一則會讓消費者有「賺到」的感覺，這就是「顧客消費心理效果」的差異，因此兩者的含義與目的有很大的不同！'
