  group_stem: 2021年發生的長賜輪擱淺事件發生在2021年3月23日，400公尺長的是長榮海運貨櫃船長賜輪在從馬來西亞前往荷蘭鹿特丹港時，在埃及蘇伊士運河擱淺。這艘船在沙塵暴中受風速高達40節（每小時74公里）的強風吹襲而偏離航道，繼而與運河底部碰撞並擱淺，完全阻擋了運河。擱淺的河段恰屬未擴建區域，河道窄小，因此其他船隻無法繞行。造成超過300艘船隻排隊等候，其中至少有15艘船隻因此下錨。最終長賜輪於六天後成功脫困，蘇伊士運河不久後亦重新恢復雙向航運。請問25-27題：
