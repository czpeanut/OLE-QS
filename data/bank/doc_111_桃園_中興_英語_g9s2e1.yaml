  group_stem: 'Many people know Robert Schumann was an important musician, but they
    do not know that his wife, Clara Wieck Schumann, was in fact more famous than
    he in their time.

    Clara was born in 1819. In her time, most women did not appear before the public.
    Clara, however, started to play the piano in public at the age of nine and was
    very successful.

    In 1840, Clara got married. She became very busy with the housework and her children.
    It was hard for her to find time to practice the piano. But Clara could never
    forget her love for music; she felt she had to share it with other people. In
    1842, Clara began to play in public again.

    When Robert died in 1856, Clara had to make money for their seven children by
    herself. She taught music and played the piano around Europe. During this hard
    time, music always gave her comfort and joy. Clara died at 77. Now she is still
    thought to be one of the best musicians in history.'
