    Cecilia: Well, it looks like baking really brings joy to his life.

    Gloria: But it takes joy away from mine! Last time I was in bed for three days
    after his party.

    Cecilia: If you hate it so much, you can just tell him.

    Gloria: Why do I always have to be the bad person? Remember when I woke him up
    from his dream of making clothes? There was a lot of crying, and he wouldn’t talk
    to me for a month. You do it this time.

    Cecilia: I can’t. How am I going to face him in our dancing classes if I tell
    him?

    Gloria: So we still have to lie at his party again?

    Cecilia: I’m afraid so.

    *tasting 品嘗'
