- id: doc_113_新北_永和_自然_g8s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 打開相同音量的麥克風，試判斷分別在教室與在操場兩種空間中，哪一種空間會聽得比較清楚？並分析其主要原因為何。
  options:
  - label: A
    content: 在操場，因為教室空間小，聲波無法反射
  - label: B
    content: 在操場，因為操場空間大，回聲現象較明顯
  - label: C
    content: 在教室，因為教室空間會反射聲波，能量不易消散
  - label: D
    content: 在教室，因為操場空間大，聲波傳遞速率太快
- id: doc_113_新北_永和_自然_g8s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 蝙蝠發出的某些聲音我們的耳朵是聽不到的，試分析其最可能的原因為何？
  options:
  - label: A
    content: 蝙蝠的某些聲音傳遞速率太快，人類的聽神經來不及傳遞
  - label: B
    content: 蝙蝠的某些聲音頻率太高，人類的耳膜無法與其同步振動
  - label: C
    content: 蝙蝠的某些聲音振幅太大，人類中耳的小聽骨無法振動傳遞
  - label: D
    content: 蝙蝠的某些聲音屬超高頻電磁波，人類的耳朵無法接收
