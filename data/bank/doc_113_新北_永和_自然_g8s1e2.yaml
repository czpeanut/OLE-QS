- id: doc_113_新北_永和_自然_g8s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 淑娟分別敲擊甲、乙兩支音叉，其聲音在儀器上顯示之波形分別如下圖所示，橫軸(t)表示時間，緃軸(y)表示聲波振動的位移，且每一支音叉發出的聲音都是單一頻率。若以甲音叉每秒敲擊兩次，乙音叉每秒敲擊一次的節奏，同時敲擊兩音叉，則由收集到的聲音在儀器上所顯示出的波形來推論，下列何者正確？
  options:
  - label: A
    content: 兩聲波音量(大小聲)會相同
  - label: B
    content: 兩聲波音調會相同
  - label: C
    content: 兩聲波的音色會相同
  - label: D
    content: 甲音叉頻率為乙音叉的兩倍
