  group_stem: "從光學原理談交通安全\n過馬路是我們每天必經的日常，但若沒有留意到一些小細節，往往就會遇到事故的發生。以圖(一)為例，過馬路時，雖看到小客車已經停讓行人，但小客車右後方的機車因為視覺上的盲區，很難注意到前方路況，就可能造成交通事故。因此我們行人在過馬路時，仍應停、看、聽，以確保安全。\n\
    大貨車就有更多視覺上的死角了，如圖(二)所示，加上在轉彎時因內側前輪畫出的圓範圍較大，後輪畫出圓範圍較小，導致半徑不同，前、後兩輪的行駛軌跡差距稱為內輪差，如圖(三)所示。內輪差範圍內的人、車，常因大貨車駕駛看不見，而在轉彎時造成意外。由統計數字顯示，視野死角、內輪差通常為事故原因，造成交通事故比例偏高。雖然大貨車都會加裝很多個後視鏡，如圖(四)所示，但我們在行進間或暫停紅綠燈時，仍應儘量避免進入大貨車的視覺死角區。\n\
    \         圖(一)                        圖(二)               圖(三)                圖(四)"
  shared_asset: g1_37_39
