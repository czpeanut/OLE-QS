    氣象署指出，其中最亮、常見的一種日暈，就是太陽光通過「六角型」的冰柱時，分離的彩光以約22 度的角度折射兩次，在地面人們的眼裡，就會形成以太陽為圓心的大光圈。簡而言之，以太陽為中心，觀察者視線夾角22
