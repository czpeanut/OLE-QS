- id: doc_113_新北_永和_自然_g8s1e2_s1_45
  section: 1
  number: 45
  type: single
  page: 6
  stem: 依上文所述，在「日暈」的許多特點中，試判斷下列何者錯誤?
  options:
  - label: A
    content: 太陽光由一介質斜向進入另一介質時，前進方向發生偏折所形成
  - label: B
    content: 太陽光通過「六角型」的冰柱時，分離約22 度的角度反射兩次，就會產生日暈
  - label: C
    content: 因為不同色光偏折角度略為不同，光圈就會呈現內偏紅、外偏藍的顏色
  - label: D
    content: 由日暈的光圈會呈現不同的顏色，可得知太陽的白光並非單色光
  group_stem: '「報天氣 - 中央氣象署」說明，日暈的主要成因是當太陽光穿過高空中充滿冰晶的薄雲時，「白光」會被折射成紅橙黃綠藍靛紫等不同顏色與波長的光線，穿過不同型態的冰晶或冰柱時，會產生不一樣的「暈」。

    氣象署指出，其中最亮、常見的一種日暈，就是太陽光通過「六角型」的冰柱時，分離的彩光以約22 度的角度折射兩次，在地面人們的眼裡，就會形成以太陽為圓心的大光圈。簡而言之，以太陽為中心，觀察者視線夾角22
    度的方向可以看到的日暈，更精確一點可稱作「22°暈」，也因為不同色光折射角度略為不同，這個光圈就會呈現內偏紅、外偏藍的顏色。類似成因的天氣現象，另外也包含虹、霓、光柱、幻日等。同時要特別注意，不可以用肉眼直視太陽，觀測時要有保護措施，如透過墨鏡、減光窗戶，或以物體遮蔽太陽。（圖取自鄭明典Facebook）'
  shared_asset: g1_45_46
