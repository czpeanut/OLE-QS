  stem: '小智他們做聲波的實驗，透過麥克風收集音叉的聲音，再利用示波器將聲波的縱波波形轉換成橫波顯現出來，可發現剛敲擊音叉那一瞬間示波器收集到的聲波如圖(一)所示，0.5
