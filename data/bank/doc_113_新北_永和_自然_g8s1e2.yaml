- id: doc_113_新北_永和_自然_g8s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 老師在四張便條紙分別寫下某橫波的週期、波長、振幅與頻率，並隨機標上甲~丁。已知由乙、丁可計算出此波的波速，甲、丁呈倒數關係，且甲的單位為秒，則下列敘述何者正確？
  options:
  - label: A
    content: 甲為波長
  - label: B
    content: 乙為振幅
  - label: C
    content: 丙為週期
  - label: D
    content: 丁為頻率
- id: doc_113_新北_永和_自然_g8s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '以下為某篇關於無線電的報導：

    「無線電」（英語：radio waves）是無線電波的簡稱、又稱射頻電波，屬一種電磁波，是在自由空間（包括空氣和真空）傳播的電磁波。其傳播速率都以光速傳播……。

    根據上述資訊，下列有關無線電的敘述何者最合理？'
  options:
  - label: A
    content: 與水波一樣都屬於橫波
  - label: B
    content: 與聲波一樣都屬於縱波
  - label: C
    content: 與光波一樣都不屬於力學波
  - label: D
    content: 與超聲波一樣都不屬於力學波
