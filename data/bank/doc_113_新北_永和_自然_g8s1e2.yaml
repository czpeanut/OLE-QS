- id: doc_113_新北_永和_自然_g8s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: '表中甲、乙兩個音階的唱名同為Do，但中央C 與高音C 的頻率卻不相同。若兩者在相同條件空氣中的傳播速率相同，波長分別為$\lambda_{1}$、$\lambda_{2}$。響度的分貝數每增加
    10 分貝，聲音強度就增加 10 倍。分貝數值越大，表示聲音越大。則甲的波長$\lambda_{1}$為乙的波長$\lambda_{2}$的幾倍？甲的響度為乙的響度的幾倍？


    | | 唱名 | 頻率 | 波長 | 響度 |

    |---|---|---|---|---|

    | 甲 | 中央C-Do | 262 Hz | $\lambda_{1}$ | 40 dB |

    | 乙 | 高音C-Do | 524 Hz | $\lambda_{2}$ | 20 dB |'
  options:
  - label: A
    content: 2 倍，20 倍
  - label: B
    content: 2 倍，100 倍
  - label: C
    content: 0.5 倍，20 倍
  - label: D
    content: 0.5 倍，100 倍
- id: doc_113_新北_永和_自然_g8s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 倒車雷達（英語：Parking sensors），又稱停車輔助系統，或稱倒車電腦警示系統。通常使用超音波感測器，在倒車時當障礙物與車輛的距離低於警戒距離時，使用顯示器或蜂鳴器發出警訊通知，提醒駕駛人注意。根據以上敘述，試分析倒車雷達的感測原理為何？
