  - label: A
    content: 凹面鏡，光的折射，藉以增大視野
  - label: B
    content: 平面鏡，光的反射，藉以增大亮度
  - label: C
    content: 凸面鏡，光的折射，藉以增大亮度
  - label: D
    content: 凸面鏡，光的反射，藉以增大視野
