- id: doc_113_新北_永和_自然_g8s1e2_s1_19
  section: 1
  number: 19
  type: single
  page: 3
  stem: 甲、乙兩音叉在同一介質狀態下連續振動，使周圍的空氣形成疏密相間的連續波形，如圖所示。請依照敍述選出正確的選項?
  options:
  - label: A
    content: 甲、乙音叉的振動頻率甲＞乙
  - label: B
    content: 當音叉的聲波從空氣傳入水中，其頻率不變，但波速變慢
  - label: C
