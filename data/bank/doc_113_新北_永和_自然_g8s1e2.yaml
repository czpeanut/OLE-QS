- id: doc_113_新北_永和_自然_g8s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 下列有關聲音的敘述，何者正確？
  options:
  - label: A
    content: 人耳能聽到的頻率約200～2000 赫，隨著年齡增長聽到的頻率會愈來愈小
  - label: B
    content: 傾斜天花板、不對稱牆、加裝吸音板、掛上布幔是用來增加反射
  - label: C
    content: 判斷哪一種樂器所發出的聲音，是憑藉聲音的頻率不同來辨別
  - label: D
    content: 同一支音叉在相同條件的空氣中不管敲快、敲慢、用力敲、輕輕敲，其波速及頻率皆不變
- id: doc_113_新北_永和_自然_g8s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: '毓芯與侑臻對於生活中常見的現象對應光學原理的探討，試判斷誰說的較合理？

    毓芯：「游泳池的水深比實際看到的還要深」與「光線由空氣射入水中產生偏折」皆為折射原理

    侑臻：「太陽光透過樹葉縫隙所形成的圓形亮點是太陽的像」跟「針孔成像」原理均為光的直進性'
  options:
  - label: A
    content: 毓芯合理，侑臻不合理
  - label: B
    content: 侑臻合理，毓芯不合理
  - label: C
    content: 兩人皆合理
  - label: D
    content: 兩人皆不合理
