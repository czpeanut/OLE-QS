  section: 1
  number: 18
  type: single
  page: 2
  stem: 「2009 年侵襲臺灣的莫拉克颱風帶來驚人雨量，隨著豪雨沖刷下來的漂流木，布滿東海岸的海域，導致臺東許多漁港暫時關閉；部分漂流木更順著洋流流動到其他國家附近的海域，影響其海上作業船隻的安全。」根據臺灣附近洋流流向判斷，這些漂流木最可能會流動到哪個地區附近的海域？
  options:
