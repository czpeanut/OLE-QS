- id: doc_112_高雄_林園_自然_g7s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '2005 年6 月，臺灣 衛生署發現彰化縣某鄉鎮內養殖的鴨蛋含過量戴奧辛。戴奧辛是無色、無味而且毒性相當強的脂溶性化學物質，容易累積在生物體的脂肪組織中。周家三兄弟在不知情情況下，吃了這產區的毒鴨蛋：周老大不吃蛋黃，周老二只吃蛋黃，周老三吃整顆蛋。請參考附表的蛋成分比較，若每餐吃一顆蛋，一個月後體內戴奧辛含量誰最少？


    | 每100 g | 熱量（kcal） | 水分（g） | 蛋白質（g） | 脂肪（g） | 碳水化合物（g） |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 蛋 | 137 | 76 | 13 | 9 | 1.6 |

    | 蛋白 | 48 | 89 | 11 | 0 | 0 |

    | 蛋黃 | 330 | 52 | 16 | 29 | 1.6 |'
  options:
  - label: A
    content: 周老大
  - label: B
    content: 周老二
  - label: C
    content: 周老三
  - label: D
    content: 三人皆相同。
  answer:
  - A
  answer_source: answer_key_vlm
  tags:
