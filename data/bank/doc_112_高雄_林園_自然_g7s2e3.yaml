- id: doc_112_高雄_林園_自然_g7s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 小花蔓澤蘭原產於中南美洲，有人在1950 年代將它引入東南亞來綠化環境。但其繁殖力過於驚人，今日這種植物在臺灣中南部地區造成許多原生植物死亡，甚至危害農作物，且已往北部蔓延，因此也有「綠色癌症」之稱。關於前述現象，下列選項何者正確？
  options:
  - label: A
    content: 這是自然的結果，應讓其不受限制的生長、發育
  - label: B
    content: 不當引入外來生物，會破壞原本的生態平衡
  - label: C
    content: 應引入小花蔓澤蘭的天敵，以控制此植物的範圍
  - label: D
    content: 外來種植物可增加本地的生物種類，增加生物多樣性。
  answer:
  - B
  answer_source: answer_key_vlm
