  group_stem: 'Dear Ms. Lin,

    How are you? Today is Teacher’ s Day. I want to say “thank you” because you teach
    me so much. You tell me to be a good person and to be nice to my classmates. You
    are not just a teacher to me, you are like a mentor to me. It really helps me
    a lot in my junior high school.

