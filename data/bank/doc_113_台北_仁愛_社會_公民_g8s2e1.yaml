- id: doc_113_台北_仁愛_社會_公民_g8s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 正在學習《民法》的小禾對於〈木蘭辭〉中某段內容：「東市買駿馬、西市買鞍韉、南市買轡頭，北市買長鞭。」的行為效力感到疑惑。請依附圖所提供的資訊及我國《民法》規定來推論，花木蘭上市集購買軍備的行為，若發生在現今是否有效？
  options:
  - label: A
    content: 效力未定，限制行為能力人所訂契約，須經法定代理人承認始生效力
  - label: B
    content: 無效，她是無行為能力人，須由其法定代理人代為行使，行為才有效
  - label: C
    content: 有效，她是限制行為能力人，從事依其年齡及身分、生活所需的行為
  - label: D
    content: 有效，她是完全行為能力人，可不經法定代理人，獨立從事法律行為。
  assets:
  - key: s1_7_f1
    kind: figure
    file: doc_113_台北_仁愛_社會_公民_g8s2e1/s1_7_f1.png
- id: doc_113_台北_仁愛_社會_公民_g8s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 柏任努力工作數年後，終於存到購買房屋的頭期款，決定買一間新房子。關於房屋買賣契約的敘述，下列何者正確？
  options:
  - label: A
    content: 若賣家未依約交付房屋，柏任可要求賣家負起侵權行為責任
  - label: B
    content: 柏任付清房屋價款，不論是否過戶，立即取得房屋的所有權
  - label: C
    content: 柏任和賣方簽訂的買屋契約可作為他擁有房屋所有權的證明
  - label: D
    content: 柏任與賣方簽訂書面契約，可以避免日後口說無憑造成爭議。
- id: doc_113_台北_仁愛_社會_公民_g8s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 文中提及主管機關應提供視障者適合的職業訓練輔導，以維護其工作權。上述工作權是屬於憲法保障人民的何種基本權利？
  options:
  - label: A
    content: 平等權
  - label: B
    content: 受益權
  - label: C
    content: 自由權
  - label: D
    content: 參政權。
  group_stem: '請閱讀下列短文並回答問題。

    《身心障礙者權益保障法》原本規定，只有視障者才能進行按摩的工作，以保障社會處境不利團體。但依據西元2008 年大法官釋字第649 號解釋，按摩行業不是專屬於視障者的工作，原規定對於其他有意從事按摩業的國民造成太大的限制，而宣告身心障礙者權益保障法相關規定違憲。因此，只要受過相當訓練經檢定合格者，都可從事按摩業；不過，主管機關也應提供視障者適合的職業訓練輔導、保留適當就業機會等具體措施，才能兼顧視障者與非視障者的權利。'
- id: doc_113_台北_仁愛_社會_公民_g8s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 針對文中大法官釋字第649 號解釋宣告的內容，下列何者最可能是後來因應的方式？
  options:
  - label: A
    content: 由公民投票來修法
  - label: B
    content: 由行政院進行修法
  - label: C
    content: 由立法院進行修法
  - label: D
    content: 由大法官直接修法。
  group_stem: '請閱讀下列短文並回答問題。

    《身心障礙者權益保障法》原本規定，只有視障者才能進行按摩的工作，以保障社會處境不利團體。但依據西元2008 年大法官釋字第649 號解釋，按摩行業不是專屬於視障者的工作，原規定對於其他有意從事按摩業的國民造成太大的限制，而宣告身心障礙者權益保障法相關規定違憲。因此，只要受過相當訓練經檢定合格者，都可從事按摩業；不過，主管機關也應提供視障者適合的職業訓練輔導、保留適當就業機會等具體措施，才能兼顧視障者與非視障者的權利。'
- id: doc_113_台北_仁愛_社會_公民_g8s2e1_s2_11
  section: 2
  number: 11
  type: single
  page: 2
  stem: 在刑事案件中， 羈押是被告經檢察官或者法官合法傳喚、拘提到案、並且逮捕之後，法院會認為被告犯罪嫌疑重大，並且有事實足認有湮滅證據、串供(騷擾證人)、逃亡等之虞時，為保全證據、防止逃亡、確保刑事訴訟以及刑罰執行，法院得裁定將被告收容到特定處所，例如：看守所。請問上述顯示出羈押是對人民何種基本權利的限制？
  options:
  - label: A
    content: 集會自由權
  - label: B
    content: 人身自由權
  - label: C
    content: 居住自由權
  - label: D
    content: 遷徙自由權。
- id: doc_113_台北_仁愛_社會_公民_g8s2e1_s2_12
  section: 2
  number: 12
  type: single
  page: 2
  stem: '某學者引用節錄的法條做為課程的補充資料：

    《中華民國憲法增修條文》第10 條：……國家應重視社會救助、福利服務、國民就業、社會保險及醫療保健等社會福利工作，對於社會救助和國民就業等救濟性支出應優先編列。……從上述資料可推測，此堂課的授課重點應是下列哪一項？'
  options:
  - label: A
    content: 憲法規範政府行使職權，須依法行政勿侵害人民權利
  - label: B
    content: 憲法保障人民的權利，做為各項法律施行的依據來源
  - label: C
    content: 憲法內容上詳細陳列，能落實牴觸憲法無效時的精神
  - label: D
    content: 憲法所保障人民權益受損時，可依法尋求救濟的管道。
- id: doc_113_台北_仁愛_社會_公民_g8s2e1_s2_13
  section: 2
  number: 13
  type: single
  page: 2
  stem: 媒體曾報導，某藝人的創作疑遭印度電影抄襲。雖然當事人表示：「對創作人來講，被抄襲表示作品被認同，因為好的東西才會被抄襲。」但在《民法》上，抄襲是不合法的，因為這種行為侵犯創作者的何種權利？
  options:
  - label: A
    content: 平等權
  - label: B
    content: 自由權
  - label: C
    content: 受益權
  - label: D
    content: 參政權。
- id: doc_113_台北_仁愛_社會_公民_g8s2e1_s2_14
  section: 2
  number: 14
  type: single
  page: 2
  stem: '小璇在網路上查到下列《原住民族教育法》的相關條文。下列關於該法及其條文的救述，何者正確?

    《原住民族教育法》

    第 1 條

    根據憲法增修條文第十條之規定，政府應依原住民之民族意願，保障原住民族教育之權利，培育原住民族所需人才，以利原住民族發展，特制定本法。

    第 44 條

    本法施行細則，由中央教育主管機關會同中央原住民族主管機關定之。'
  options:
  - label: A
    content: 該法的制定可補足法律規範的不足
  - label: B
    content: 該法的施行細則由立法院負責制定
  - label: C
    content: 該法的制定具體化《憲法》的規範
  - label: D
    content: 該法的施行須經主管行政機關公布。
- id: doc_113_台北_仁愛_社會_公民_g8s2e1_s2_15
  section: 2
  number: 15
  type: single
  page: 2
  stem: '下列是某一則新聞報導：

    小斌將限量款高級自行車借給17 歲的阿德騎去環島，阿德卻不慎將車撞毀，所幸沒有波及他人，事發後雙方自行簽訂高額賠償契約。不過阿德的父母得知後反對這份契約，於是阿德事後反悔不願依約賠償，小斌因此告上法院要求阿德履行契約，但法官以該契約無效為由，判決小斌敗訴。

    關於上述報導內容，下列哪一項推論最合理？'
  options:
  - label: A
    content: 二人簽訂的契約因為違反公共秩序而無效
  - label: B
    content: 阿德應負的法律責任與遭警察開罰單相同
  - label: C
    content: 小斌敗訴的原因是阿德為限制行為能力人
  - label: D
    content: 小斌不服判決可以再向行政法院提出上訴。
- id: doc_113_台北_仁愛_社會_公民_g8s2e1_s2_16
  section: 2
  number: 16
  type: single
  page: 2
  stem: '附表是某法院累計去年度民事訴訟上已終結的案件數，記者欲引用此份資料，來對民眾提供相關的分析，下列何者內容正確？

    | 項目 | 類型 | 案件數 |

    | --- | --- | --- |

    | 甲 | 借貸 | 73,489 件 |

    | 乙 | 買賣 | 8,808 件 |

    | 丙 | 婚姻 | 5,263 件 |

    | 丁 | 租賃 | 3,046 件 |

    | 戊 | 遺產 | 1,696 件 |'
  options:
  - label: A
    content: 財產關係上的紛爭有四種類型，顯示人際之間金錢糾紛多
  - label: B
    content: 案件數最高的類型，顯示生活中誠實信用原則已消失殆盡
  - label: C
    content: 戊案件可能出現在遺產繼承人爭奪遺產，屬於民法上身分關係的糾紛
  - label: D
    content: 乙案件中的不動產買賣，簽訂書面契約買賣即完成有效。
- id: doc_113_台北_仁愛_社會_公民_g8s2e1_s2_17
  section: 2
  number: 17
  type: single
  page: 2
  stem: 國二生小偉和同學在教室丟球嬉鬧，不小心打破玻璃，向總務處登記報修後，學校要求小偉賠償修繕玻璃的費用，沮喪的小偉聽著班上法律小達人的分析，但覺得其中一個分析似乎有誤，請問應該是下列何者？
  options:
  - label: A
    content: 打破玻璃屬於侵權行為
  - label: B
    content: 損害賠償的方式是以金錢賠償為原則
  - label: C
    content: 小偉的法定代理人有連帶賠償的責任
  - label: D
    content: 因故意或過失不法侵害他人權利者，應負損害賠償責任。
- id: doc_113_台北_仁愛_社會_公民_g8s2e1_s2_18
  section: 2
  number: 18
  type: single
  page: 2
  stem: 劉先生長期受到他人跟蹤騷擾，感覺人身自由受到威脅，因此準備報警並希望使用《憲法》條文讓對方受到法律制裁，但友人告知在這種情形下，規範此類行為最適用的法規是《跟蹤騷擾防制法》，並非《憲法》，原因應為下列何者?
  options:
  - label: A
    content: 《憲法》具有固定性，對於個人權利較少涉及
  - label: B
    content: 《憲法》的法律效力不及《跟蹤騷擾防制法》
  - label: C
    content: 《憲法》尚待實質修法才能確保人民基本權利
  - label: D
    content: 《憲法》對違法行為的規範並無詳細規定。
- id: doc_113_台北_仁愛_社會_公民_g8s2e1_s2_19
  section: 2
  number: 19
  type: single
  page: 2
  stem: '以下為某報紙投書的部分內容：

    《民法》第195 條第1 項後段規定：「其名譽被侵害者，並得請求回復名譽之適當處分。」在司法實務上發展出「強制道歉」，可能是透過登報，或在自己臉書、IG 張貼法院要求的道歉啟事。對此，大法官於111
    年憲判字第2 號提出，強制道歉攸關干預人民內在精神活動及自主的決定權利，人民亦應享有不表意的選擇；另引用釋字第567 號解釋：縱使國家因非常時期要制定法律規定，仍不可把強制表態、改造列為手段，因為此仍是侵犯了最低限度的人權保障。因此，「適當處分」不應包括法院以判決來命加害人道歉。針對文中畫線部分所涉及的基本權利，與下列哪一項屬於同一類型？'
  options:
  - label: A
    content: 視障考生透過申請制度，延長考試的作答時間
  - label: B
