  stem: 若此修正案通過，畫線處與下列哪一個民法原則有關？
  options:
  - label: A
    content: 契約自由
  - label: B
    content: 誠實信用
  - label: C
    content: 禁止權利濫用
  - label: D
    content: 時效消滅。
  group_stem: '(二) 行政院今年初院會通過《民法親屬編部分條文修正草案》及《民法親屬編施行法第7 條之一修正草案》，針對現行離婚制度及相關財產規範進行修正。法務部表示，此次修法重點包括放寬裁判離婚條件，增訂「5
    年內累計分居3 年」即得請求離婚，並調整贍養費規範，規定再婚後不得再向前配偶請求贍養費。行政院長卓榮泰強調，這次修法是為回應憲法法庭判決，確保離婚後弱勢一方的權益，同時維護未成年子女的最佳利益，促進婚姻自主。此次修正草案亦明訂贍養費的請求方式及標準，法院將依當事人經濟狀況、婚姻期間對家庭貢獻等因素，決定贍養費的支付金額及期限。並增訂贍養費請求時效為2
    年，當事人須在離婚後2 年內提出請求，逾期將喪失請求權。請問:'
