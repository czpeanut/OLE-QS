- id: doc_113_台北_仁愛_社會_公民_g8s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 為確保契約雙方的權利義務能依公平正義的方法，實現其權利的內容，民法訂有下列何項最高指導原則？
  options:
  - label: A
    content: 契約自由原則
  - label: B
    content: 誠實信用原則
  - label: C
    content: 依照法律規定
  - label: D
    content: 不得違反公序良俗。
- id: doc_113_台北_仁愛_社會_公民_g8s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 附圖是對於我國憲法、法律與命令的介紹，下列敘述何者正確？
  options:
  - label: A
    content: 命令可用來補充和落實法律
  - label: B
    content: 三者皆須經立法院三讀通過
  - label: C
    content: 命令是由司法機關制定而成
  - label: D
    content: 該介紹呈現出憲法的穩定性。
  assets:
  - key: s1_3_f1
