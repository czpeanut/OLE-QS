    file: doc_113_台北_仁愛_社會_公民_g8s2e1/s1_3_f1.png
- id: doc_113_台北_仁愛_社會_公民_g8s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 根據《警察職權行使法》的規定，警察行使職權時，應著制服或出示證件表明身分，並應告知事由，警察未依此規定行使職權者，人民得拒絕之。上述內容最主要在強調下列何種法治觀念？
  options:
  - label: A
    content: 行政機關修改不合時宜的命令，以保障人民權利
  - label: B
    content: 法律制定生效後，對於違法者即產生約束的作用
  - label: C
    content: 法律規範政府的作為，而人民權利受到法律保障
  - label: D
    content: 法律是由民意代表所制定，也是人民意思的展現。
- id: doc_113_台北_仁愛_社會_公民_g8s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 阿銓在資料中看到附圖這段對安樂國政權的介紹，請根據其內容判斷安樂國社會可能具備何種特質？
  options:
  - label: A
    content: 法律的力量能凌駕於政府之上
  - label: B
    content: 重視司法獨立與依法而治精神
  - label: C
    content: 重視自由平等與公平正義精神
  - label: D
    content: 法律缺乏對統治者的約束作用。
  assets:
  - key: s1_5_f1
    kind: figure
    file: doc_113_台北_仁愛_社會_公民_g8s2e1/s1_5_f1.png
- id: doc_113_台北_仁愛_社會_公民_g8s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 附圖是筑玫今天的生活記錄，這天的各種行為中，哪些屬於契約行為？
  options:
  - label: A
    content: 刷牙洗臉、買早餐、幫同學盛飯
  - label: B
    content: 搭公車、買早餐、向同學借圓規
  - label: C
