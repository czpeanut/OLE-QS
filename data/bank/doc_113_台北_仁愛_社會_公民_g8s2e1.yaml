  group_stem: '(一)《憲法訴訟法》在民國 111 年 1 月 開始實施，在《憲法訴訟法》上路之前，如果人民或法院想要聲請憲法解釋或違憲審查，則大法官會以大法官會議的形式來審理這些釋憲案，並以大法官解釋——也就是我們熟悉的釋字第xxx
    號來作成最後的決議。而今《憲法訴訟法》以憲法法庭的形式取代了過去的大法官會議，顧名思義，就是以法院開庭的形式來審查釋憲聲請案，最後的決議也會以「裁判」的形式公告。且為了使程序更加公開透明，憲法法庭會主動公開提出釋憲之人的聲請書，也可以要求相對人提出並公開答辯書，讓一般大眾也能查閱。審理過程中，也可以進行言詞辯論、交互詢答等程序，並且比照一般法院的開庭程序，憲法訴訟中的當事人、訴訟代理人及辯護人均可以向法院聲請閱卷（憲法訴訟§23）。

    根據上述可知《憲法訴訟法》將大法官審理案件全面司法化，由大法官組成「憲法法庭」取代大法官會議釋憲，決議也由「大法官解釋」改為「判決」。民國 113 年 1
    2 月20 日甲機關通過《憲法訴訟法》修正案，未來大法官組成「憲法法庭」參與評議的人數不得低於十人，同時違憲宣告的大法官人數不得低於9 人。請問:'
