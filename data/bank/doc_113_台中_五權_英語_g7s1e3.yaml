  group_stem: 'Jordan: I am watching a TV show about La Tomatina. Do you know it?

    Marco: Yes. It''s a food fight festival in Spain, and it’s in August every year.

    Jordan: What do people do on that day?

    Marco: They get lots of overripe tomatoes and throw them at each other. Everything
    is in red, and it’s like a fun tomato fight.

    Jordan: Wow, that''s really special! How long is the fight?

    Marco: About an hour.

    Jordan: There are many tomatoes on the street, right?

    Marco: Yes. So, people clean up the streets with water.

    Jordan: You know so much about La Tomatina. You’re a smart cookie!


     festival 節慶 overripe 過熟的 tomato 番茄 throw 丟;擲

    fight 打仗 each other 彼此'
