  group_stem: 'The sun rises in the morning and sets at night every day. But the sun
    is not moving. Earth is moving. Earth rotates. To rotate means to go around. It
    takes 24 hours for Earth to rotate one time. One rotation is one day. Earth’s
    rotation, and we have day and night.

    Earth rotates, and it faces the sun. That part of Earth is daytime. Earth goes
    around and turns away from the sun. That part of Earth is nighttime. This pattern
    repeats every 24 hours.


     turn away 轉移 face 面對 pattern 模式 repeat 重複 set 落下

    part 部份 take 花費'
