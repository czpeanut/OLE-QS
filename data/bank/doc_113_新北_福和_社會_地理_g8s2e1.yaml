  group_stem: 二十世紀末開始，印尼積極推動經濟發展，熱帶雨林也在拼經濟趨勢下，面臨過度開墾而即將消失的危機。為了開墾土地，大量種植經濟作物，印尼過去幾年已每年約減少115
    萬公頃森林（相當於3.2 個台灣台北市面積），開發最快的方式就是焚燒森林，加上泥炭地分布廣，構成災難級的霾害，當地空氣品質的AQI 指數甚至衝破了2,000(「危險級」門檻為301)，並隨著季風的吹拂，衝擊馬來西亞、新加坡等鄰近國家，不僅污染鄰國空氣，還造成國際霾害與外交衝突。請問：
