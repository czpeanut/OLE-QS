- id: doc_113_新北_福和_社會_地理_g8s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: '20 世紀後期起，企業開始意識到若將部分非核心業務外包給第三方公司可節省成本並提升效率，故於1990年代開始大為興盛。右表(二)甲、乙為世界主要兩大委外客服承包國家的比較，請問分別為下列哪兩國？


    | 項目 | 甲國 | 乙國 |

    | :--- | :--- | :--- |

    | 主要業務 | 資訊科技整合低階語音客服到高階金融分析 | 低階語音客服、客戶關係管理 |

    | 英語優勢 | 英語流利，但口音較重 | 美式英語口音 |

    | 專業性 | 強，適合技術客服與分析服務 | 弱，多為基礎客服 |

    | 成本優勢 | 人力成本低，但逐漸上升 | 人力成本較高，漸上升，仍具競爭力 |

    | 客戶市場 | 歐洲、美國、澳洲 | 美國、加拿大 |'
  options:
  - label: A
    content: 印度、菲律賓
  - label: B
    content: 新加坡、菲律賓
  - label: C
    content: 印度、馬來西亞
  - label: D
    content: 新加坡、馬來西亞。
