  section: 1
  number: 2
  type: single
  page: 1
  stem: 印度半島位於亞洲，它有「亞洲次大陸」之稱。次大陸的封閉性主要來自其獨特的地理屏障。北方有山脈阻隔來自中國與中亞的影響；西方有山脈與沙漠，限制與西亞的往來；東側則被山地與濕熱叢林環繞，受東南亞影響較少。此外，南方三面環海，進一步強化了其相對獨立的發展環境，因而自行發展出獨特卻多元的印度文明。請問：下列何者不能說明印度環境與文化的獨特性？
    ：
  options:
  - label: A
    content: 印度自成體系的三季節與降雨分布
  - label: B
    content: 印度人民兩千多年來多信奉印度教
  - label: C
    content: 印度是全世界穆斯林第三多的國家
  - label: D
    content: 印度擁有多元民族以及語言多樣性。
