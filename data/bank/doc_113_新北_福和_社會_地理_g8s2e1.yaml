  group_stem: '琬平深愛印度這個歷史文明古國，他早早就把今年的年假排在印度最舒適晴朗的季節，並規劃好豐富的行程。

    首先，一定要造訪她最愛的歷史文化古蹟。「泰姬瑪哈陵」這座17 世紀蒙兀兒王朝的愛情陵墓，是世界七大奇蹟之一，白色大理石在陽光下閃閃發光，美得令人屏息。此外，齋浦爾的風之宮殿與德里的紅堡，展現了印度皇室過往的輝煌。而且必定得造訪聖城－瓦拉納西，這裡是印度教徒靈魂歸依之地，每晚的恆河燈祭更是震撼人心。

