  group_stem: '中國古書上時常描寫一些名人，說他們「交遊遍海內」，又是什麼「生不願封萬戶侯，但願一識韓荊州」等等。等到這些名人死了，又是什麼「國人道哭」；什麼「知與不知，皆咨嗟流涕」一類痛悼的話。以前我們讀古書，總以為那是「白髮三千丈」一類的文人誇大之辭。孰知民國時代出了一個胡適之，他竟然把歷史上這些不可信的故事，一個個都活生生地表現出來！

    胡氏生前可說是交遊遍及海內外。上至總統、主席，下至金檔、司廚、販夫、走卒、擔菜、賣漿……行列之中都有胡適之的「朋友」！

    筆者在紐約和胡先生一起去吃小館子——多半是他領我去的一常看到那滿手油膩的廚司匆匆地從廚房跑出，兩手在圍裙上大擦之後，來和「大使」握手的。他二人談笑風生，真像是學生時代一起打工的老朋友一般。

    （唐德剛 「我的朋友」的朋友）'
