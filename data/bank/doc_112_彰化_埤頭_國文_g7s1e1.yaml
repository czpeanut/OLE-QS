- id: doc_112_彰化_埤頭_國文_g7s1e1_s3_39
  section: 3
  number: 39
  type: single
  page: 2
  stem: 保羅平時常把「剛好」掛在嘴上，他說：「我剛好碰到貴人，創造了轉機！」但創造轉機的人，其實還是保羅自己。由此可知，保羅之所以成功，有很大因素來自於他擁有的何種特質？
  options:
  - label: A
    content: 善用巧合，把握機會
  - label: B
    content: 兢兢業業，全力以赴
  - label: C
    content: 鍥而不捨，堅持到底
  - label: D
    content: 放低姿態，尋求贊助。
  group_stem: "善用每一次「剛好」\t劉軒\n老友保羅在臉書上載我：「好幾年沒回臺灣了，我這次只待兩個禮拜，有空咱們聚聚吧！」\n「怎麼這麼不巧？」我想。最近剛接了幾個大案子，搞得焦頭爛額，沒時間也沒心情給保羅回電。雖然一開始答應得很爽快，但一個多禮拜過去了，因為很久無法赴約，心情也從期待轉為壓力。\n\
    某晚，我還在錄音室跟電腦和 MIDI 鍵盤抗戰時，手機響起嗶嗶聲，是保羅的簡訊：「吃飯沒？」\n看看手錶，七點多，這時才發覺肚子已經在咕咕叫。\n「剛好我就在你工作室附近，給我幾分鐘碰個面好嗎？我馬上就到！」他寫道。\n\
    想想，再不約，保羅就要回美國了。雖然還陷在工作狀態中，我還是勉強答應。\n走到路口，看到保羅剛下計程車，穿著潮T搭配休閒西裝外套，容光煥發。我呢，踩著拖鞋，鬍子沒刮，實在很狼狽至極。他給我一個大大的擁抱，說：「這不就是我們當年一起喝啤酒的老地方嗎？實在太巧了！」\n\
    「是啊！附近開了間不錯的小餐館，可以去坐坐。」我說。\n原本我只容許自己給保羅一個小時，但幾年不見，兩人一下子便聊開了。從我們認識到現在，保羅的事業有了神奇的發展，實在令人羡慕——十幾年前，身為\
    \ DJ 的保羅曾經想在臺灣開黑膠唱片專賣店，卻被長輩們勸退。沮喪的他去了美國西岸，某天在派對上認識了一家夜店的老闆，兩人一拍即合，成為合作夥伴。不巧，網路公司的泡沫化，造成美國經濟重創，老闆被迫爬產，保羅則把整店家頂了下來。當年美國政府全力支持環保運動，保羅把夜店變成「綠建築」，還裝了可以把客人的動力轉為能量的「發電舞池」，備受矚目。運用這項優勢，他接著開了一家「環保壽司餐廳」，專賣海洋保護協會認可的海產。看到不少「樂活」人士來光顧，保羅又把握時間開了瑜伽教室、靈修中心、現代畫廊……。\n\
    十年後，當年只是一名小 DJ 的保羅，竟然登上了美國企業家雜誌封面，接受紐約時報專訪，成了大老闆。最近，舊金山的新中央火車站即將在他的店面正後方動工。光是地產就讓保羅賺翻了！\n\
    「你好幸運！」我讚嘆。\n「我很有效氣！」保羅說：「也碰過不少倒霉事！不過我一直深信，一切的打擊背後都是機會。當年想開店，被大家潑了冷水，雖然是個打擊，但我剛好碰到貴人，創造了轉機！」\n\
    當我們離開餐廰時，已經是兩個多鐘頭後了。目送保羅上車，我突然想起最近正在看的一本書：幸運的配方。作者李查·韋斯曼是一個心理學者，他一直想知道，為何某些人似乎一帆風順，有些人卻跌跌撞撞？經過一番研究之後，他發現，幸運兒的生活並沒有特殊之處，但他們比一般人懂得善用巧合。\n\
    什麼是善用巧合？就是當你在路上碰到許久不見的老朋友時，會停下來請他喝杯咖啡。就是當你剛好看到有適合的案子時，會向老闆毛遂自薦。就是當你原本要買的東西賣完了，也願意試試別的牌子。\n\
    除了積極應變之外，幸運兒的另一個特質就是正面態度。迷路了，他們剛好乘機探險。犯錯了，他們剛好藉機學習。\n保羅就是這樣，他最常掛在嘴上的一字眼，就是「剛好」。他覺得人生充滿了機會，也從實際經驗得到驗證。事實上，那些「剛好」機會常常是他自己製造的，就像他當晚剛好在我公司附近，但重點是他拿起了電話。若他沒傳那則簡訊，誰知道我們會再隔幾年才會碰面？而當我埋頭工作時，把任何邀約都視為「不巧」，也實在需要檢討。工作當然需要專心，但過度執著不見得帶來最高的效率，反而因此讓我們錯過一些良機善緣。\n\
    因為我們當晚的聚會，過了幾天，保羅從美國打來，介紹了一個音樂人朋友，透過他的協助，讓我把手邊最困難的製作案順利完成了。要是我沒跟保羅吃飯，我可能現在還在錄音室裡鬼打牆呢！你看，多巧！\n\
    所以，從今天開始，我時常提醒自己：少說「不巧」，改說「剛好」。我決定要讓自己更像保羅，成為一個善用「剛好」的人！\n（選自學校沒教的 101 堂人生功課 國語日報）"
