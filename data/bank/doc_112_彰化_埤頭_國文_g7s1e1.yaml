  group_stem: '宋人有閔其苗之不長而揠之者，芒芒然歸，謂其人曰：「今日病矣！予助苗長矣。」其子趨而往視之，苗則槁矣。天下之不助苗長者寡矣。以為無益而舍之者，不耘苗者也；助之長者，揠苗者也。非徒無益，而又害之。

    （孟子 公孫丑上 揠苗助長）

