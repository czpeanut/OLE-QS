  - label: D
    content: 標新立異，沽名釣譽。
  group_stem: '每當我聽到別人批評中國官吏貪汙腐敗的時候，我想起了父親。我想起暮色蒼茫裡，清瘦異常，擠進公共汽車回復興關的父親，他穿著粗嗶嘰制服，深夜燈下，屏息研究公事。我自問對政治毫無興趣，但也從不覺得政府裡這樣的官吏而肅然！有一個傍晚，風勁樹老，父親似有所感，回顧我，說：「先天之憂而憂，後天下之樂而樂。」我猛抬頭，一直以為是線裝書上大家讀讀的罷了！想不到父親一生恪守的正是這兩句名言。

    我愛父親，愛他穿著舊衣客時的昂然氣度，愛他覺得不對時，千人之間能立起反對；覺得對時，千人之前毫無猶豫的精神。我愛他不是為了兒時吻我，而是因為他能在頹敗的社會裡能屹立著高亮的前節；因為他能在未上軌道的政治環境裡質樸的苦幹，他抱有一個崇高的理想從事政治，他常對我說：「永遠不要向惡勢力屈服，永遠奮鬥！」還記得我初涉做事時，父親送我到門邊。異鄉多雨，四季常綠。每當我漫步在臺北的石子路上，便想起在暮靄的家園裡，那白布短褂，把我送入社會的父親。

    （段永淵 我的父親）'
