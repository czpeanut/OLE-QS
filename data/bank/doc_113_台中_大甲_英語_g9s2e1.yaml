  type: single
  page: 2
  stem: 39. Which is NOT true about <u>an optimistic person</u>?
  options:
  - label: A
    content: He/She usually has hope for his/ her future.
  - label: B
    content: He/She always looks on the dark side of things.
  - label: C
    content: He/She tries hard to let go of his/her bad mood soon.
  - label: D
    content: He/She seldom gets angry about things in his/her life.
  group_stem: 'Are you an optimistic person, and do you always look on the bright
    side of things or have hope for your future? Most of us hear of the saying, "Smile
    and the world smiles with you; cry and cry by yourself." That''s because no one
    likes to get along with pessimistic people. But how can we feel happy about everything
    around all the time? Sometimes we may be sad or angry about something in our life.
    Then how do we let go of those bad feelings as soon as possible?


    When I''m sad, I like to listen to music in a quiet room. Sad slow song make me
    cry and think a lot. In this way, I''ll feel much better and get over my bad mood
    quickly. On the other hand, when I''m happy, I enjoy listening to music, too.
    Happy fast songs make me laugh and have fun dancing to them. In that way, I''ll
    stay in a good mood all day long. Music is the best medicine for me to cheer myself
    up. Now try to find yours, and you can live a happy life with big smiles more
    easily.

     pessimistic 悲觀的 feeling 感覺 mood 心情'
