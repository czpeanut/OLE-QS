  group_stem: 'Now I am going to show you how to work with eggs. First, prepare six
    eggs and two bowls. Take the egg whites from the eggs to one bowl and the yolks
    to the other. Before you start beating the egg whites, be sure that these eggs
    are out of the fridge for some time. Also, be sure that there are no yolks in
    your egg whites. This will help you make the most delicious snacks. Then start
    beating your whites with your whisking machine. After a few minutes, you can see
    the "soft peak stage." You can tell it by turning over your whisk. There should
    be a peak, like a small mountain, but the peak will get down after a few seconds.
    If you need "stiff peaks," you just keep beating the egg whites. When you hold
    the whisk upside down, you can get a nice peak and the whole part won''t change
    its shape.


    If you want to make a cake, put flour, oil, sugar and the yolk together. Then
    put the soft-peak-stage egg whites into the yolks. Put them together and bake
    your own cake.

    Are you ready to enjoy it?

