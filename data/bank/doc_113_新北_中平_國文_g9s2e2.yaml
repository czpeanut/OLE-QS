  group_stem: 'MBTI 又稱為「邁爾斯 - 布理格斯 性格分類指標」（Myers-Briggs Type Indicator），是一種性格分類模式。是美國作家Katharine
    Cook Briggs 與女兒Isabel Briggs Myers 因為對心理學的愛好，以心理學家榮格在1921 年的《心理類型》為基礎，深入研究後加以提出。

    　　MBTI 在當時以男性為主導的心理學界並未得到多數認可，甚至沒有得到榮格本人的支持。但在二十世紀六〇年代出版研究手冊後，逐漸被心理學界所認可，開始運用在職業適性、人員評估以及教育等領域。

    　　MBTI 的類型區分是以四個向度進行二分法，多個性格取向排列組合成16 種基本人格類型，每個人的性格都會落在四個角度中的不同邊，形成不同的性格傾向。

    ※節選自：邱意婷〈MBTI 真有那麼準嗎？心理師現身說法〉'
