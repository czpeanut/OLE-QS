  group_stem: '莊子行於山中，見大木，枝葉盛茂，伐木者止其旁而不取也。問其故。曰：「無所可用。」莊子曰：「此木以不材得終其天年。」夫子出於山，舍於故人之家。故人喜，命豎子殺雁而烹之。豎子請曰：「其一能鳴，其一不能鳴，請奚殺？」主人曰：「殺不能鳴者。」

