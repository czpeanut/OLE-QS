  group_stem: "緬甸中部在台灣時間三月二十八日下午2 點21 分發生規模7.7 強震，地震威力之大，整個東南亞地區幾乎都有感。緬甸位於印度板塊與歐亞板塊邊界，是世界上地震活動最活躍的國家之一。\n\
    　　這次發生地震的實皆斷層（Sagaing fault）貫穿整個緬甸。這次地震是「走滑斷層作用」引起，或稱「走滑型地震」——印度板塊持續向北推擠歐亞板塊，引發兩大板塊相互側向摩擦。此種地震不能只關注震央，因為地震波不是從震央輻射出去，而是從斷層整條線輻射擴散出去。相對之下，台灣東部是屬聚合性板塊，即是一個板塊隱沒到另一個板塊之下。\n\
    \  　緬甸的地震是「走滑型地震」，實際發生在長約164 公里、寬約19 公里的區域內，除了範圍大，淺層也會帶來會更加嚴重的破壞力。由於這次地震深度僅10\
    \ 公里，美國地質調查所指出：「因為發生在淺層深度，因此當地震波從震源到達地表時不會被消散，建築物承受了震動的全部力量。」倫敦大學麥奎爾教授表示：「該地區的建築結構普遍不足以承受這種程度的震動。」\
