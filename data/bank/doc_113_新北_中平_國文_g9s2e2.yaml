- id: doc_113_新北_中平_國文_g9s2e2_s1_42
  section: 1
  number: 42
  type: single
  page: 6
  stem: 根據本文，下列敘述何者正確？
  options:
  - label: A
    content: 本文以第三人稱，講述作者成為法官的生活
  - label: B
    content: 河濱公園的案子讓被告發生翻天覆地的改變
  - label: C
    content: 作者因被告在法庭上咆哮不雅文字而痛罵他
  - label: D
    content: 被告因為法官的一席話，最終與書記官道歉。
  group_stem: '成為法官以後，生活有了翻天覆地的改變。

    我收到了一個河濱公園籃球場打架的案子，一群男大生報隊打球，一言不合直接變成打人。這一聽就不是什麼大不了的案件，早早發了傳票、合法送達，書記官也如常地打電話提醒記得來調解和開庭。結果開庭當天早上，其中一個被告在電話裡對書記官又是問候爹娘、又是人身攻擊，最後嗆明了現在暑假人在機場、準備出國、行程早就安排好了，下午沒辦法來法院。

    我的書記官是個年紀比我大一些的姊姊，平日溫溫和和、工作可靠明快，她趕緊跑來告訴我這件事，問我決定怎麼辦，要請他提出請假證明嗎？她一進辦公室，就先翻開了剛製作的公務電話紀錄，什麼都還沒開口，我瞄了一眼紀錄內容，就知道她心裡有多委屈。做事俐落的她，第一次把公務電話紀錄打成像是逐字稿一樣，這是非常耗時耗力的；而看到被告發話的內容，我立刻登入系統查了出入境紀錄，已經出境了。我也是第一次感覺到敲著鍵盤的手因為生氣而發抖。

    長長吐了一口氣，我和書記官說，趁他還沒登機回撥給他，給他五天的時間想辦法提出書面證明，傳真或email 都可以，解釋不能來開庭卻沒提早講的原因，不然就是依法拘提。書記官語帶哽咽地說了好。

    結果被告當然也沒有把我的指示當一回事。拘票按照流程簽發，一個月後，暑假結束前，他被警察拘獲到案。坐在地下室的法庭裡，實在很難想像被法警解開手銬的那個人，和先前出言踐踏書記官自尊的是同一個。因為一眼看上去，他就是大學教室人群裡，安靜上課或滑手機、不會特別引人注意的那種樣子。

    但最後諭知交保限制住居前，我還是收起和緩的語氣，嚴正地問他：為什麼之前電話裡要對我的書記官講那些難以入耳的話？

    「不是不可以對書記官這樣講話，而是對任何人都不應該這樣。人家也是父母生、父母養的，心也是肉做的，和你一樣都會難受、會心痛。她安安分分地做自己的工作，只是想要安安穩穩過生活、有一口飯吃，你走出法庭那扇門後也會是這樣，那憑什麼對人家這種態度？不用和我說對不起，不是我被你人身攻擊，你要說的話，請你對書記官說。」

    男大生真的站起身來向書記官道了歉。是不是真心的我們沒有人會知道，但開完庭後，書記官轉頭過來慎重地對我說：法官，真的謝謝。坐在一旁的庭務員也說道：法官，您最後說的內容好感人。

    邊收著東西，我悠悠地回應道：沒有啦，那些都不是我說的。

    明明就是從我嘴巴脫口出來的，什麼叫作不是我說的？

    我的意思是，那些話都是別人為我說過的。

    幾年前我還是研究生時，同時擔任指導教授吳從周老師許多門課的助教，其中一堂是台大法律學分班的課程。某次上課直播訊號屢屢出現問題，有修課學生忍不住在對話區抱怨我，內容大概是連這種小事都弄不好，能力是不是有問題，學分班怎麼會請這種人當助教。

    我看到當然很受傷，而留言的人也馬上被其他同學指責不該這樣，她沒多久就和我道歉了。可是從周老師看到留言後，突然就收起了上課笑鬧輕鬆的態度，嚴肅地對著鏡頭講了好長一段話。那是我唯一一次見到他那麼嚴厲。

    從周老師講的，就是我在法庭上對男大學生所說的內容。我說的你不應該對「書記官」這樣，當時在老師口中，是你不應該對「禎翊」這樣。

    從周老師是當過法官的人，那是很久以前的事情了，我沒看過他做法官的樣子，但我看過他對待我的樣子。他是恆星一樣的大人，平時看他和學校的行政人員相處，所有人在他身邊都能笑得開懷、安心，而且自在，彷彿他就只是繁星如織之中的某一個光點，沒有特別的鋒芒或架子；可是真正需要他的能量的時候，靠近他，他會憑自己所能，帶給你一切溫暖和明亮。

    和他們年紀一樣大的時候，我是【　】一樣的少年，靠著反射別人帶給我的光芒，看似閃閃發亮。而此刻我已經不是那樣年紀，能夠再享有那種權利的人了。成為法官讓我看見了大人世界邪惡的一面、道貌岸然的一面，可是也因為真真實實遇見過一些由裡到外很棒的大人，光是想到他們，就少了很多害怕。           ※節選自：翁禎翊〈恆星一樣的大人〉'
  tags:
    textbook: 第六冊（九下）第2次段考範圍
    labeled_by: ai
