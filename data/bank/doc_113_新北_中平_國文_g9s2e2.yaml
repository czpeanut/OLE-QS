  group_stem: '在男性主導的法律世界求職屢屢碰壁，金斯伯格不得不轉任教職，於一九七二年成為哥倫比亞大學法學院首位終身職的女性教授，在此期間除開設性別課程外，並為美國公民自由聯盟擔任人權律師。金斯伯格曾向最高法院提出六宗性別平權案件，最後贏了五件，讓她聲名大噪。

    一九七三年，空軍女少尉佛朗提羅想比照男同事享有宿舍津貼，卻被拒絕。主辦人員說：「妳能當飛官已經很幸運了，怎能再奢求宿舍津貼呢？法令本來就是如此規定。」女少尉就延請金斯伯格控告政府職場性別歧視。金斯伯格在庭上引用性別平權先驅莎拉葛林克的名言：「我從未要求特殊禮遇，我只要求男性同胞把腳從我們的脖子上移開。」要求法官們重新檢視以性別為考量的不公平法規，最後女少尉獲得勝訴。此外，金斯伯格也為男性辯護，一九七五年她曾為一位喪妻的男子爭取育兒補助，因為當時單親補助僅限女性申請。她接下此案，正是想向法界表達遭受性別歧視的對象不分男女。金斯伯格就藉著這一件件案子，讓法界與大眾了解性別平權的重要性。

    由於金斯伯格擔任人權律師的貢獻卓越，一九九三年被柯林頓總統提名為最高法院大法官，成為美國史上第二位女性大法官。她擔任大法官時，常對自己無法認同的最高法院裁決案撰寫反對文，盼能藉此促使國會修改法律。例如在二○○六年，萊貝特女士控告固特異輪胎公司苛扣女性員工薪水，讓她較同職務的男性薪資短少四成（年薪少了五萬美元），一路上訴至最高法院仍敗訴。此時金斯伯格提出反對文，點出多數大法官漠視女性在職場上遭受同工不同酬的歧視，促成國會在兩年後通過「薪資平等修正案」，讓女性在職場上能受到更公平的對待，萊貝特也因此討回了公道。

    ※節選自：〈捍衛性別平權的鬥士─金斯伯格〉'
