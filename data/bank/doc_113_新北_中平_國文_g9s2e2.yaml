    \ |\n| 地震深度 | 通常較淺，集中在淺層 | 深度範圍廣，可從淺層延伸至600 公里深 |\n| 海嘯風險 | 較低 | 較高，特別是在俯衝帶發生的大規模地震\
    \ |\n| 伴隨地質現象 | 地表變形和破裂帶、階梯狀錯位結構 | 火山活動、造山運動、海溝形成等 |\n| 典型地區 | 聖安德烈斯斷層（加州斷層）、北安納托利亞斷層（土耳其）\
