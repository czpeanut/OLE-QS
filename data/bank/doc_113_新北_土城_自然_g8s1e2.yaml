  group_stem: '白色的太陽光其實是由多種顏色的光線組成的，主要可以分為紅、橙、黃、綠、藍、靛、紫七種顏色。平時，我們看到的太陽光是白色的，但當雨後放晴時，天空中的小水珠會對陽光進行折射和反射。由於不同顏色的光__甲__，這些光線會以略微不同的方向射出，形成彩虹。顏色。不過細心一點看，會發現明亮的彩虹旁邊還有一道淡淡的「七彩環」，我們可以稱為霓。他們的光線前進路徑如附圖，圓圈為小水珠，虛線為法線。當你下一次看到彩虹時，試著仔細觀察，或許能在彩虹之外發現一抹淡淡的霓虹光輝！


    圖一，彩虹的光線路徑圖。


    圖二，霓虹的光線路徑圖。'
