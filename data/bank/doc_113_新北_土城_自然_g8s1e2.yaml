- id: doc_113_新北_土城_自然_g8s1e2_s1_26
  section: 1
  number: 26
  type: single
  page: 3
  stem: 請問甲、乙分別是什麼?
  options:
  - label: A
    content: 甲：音量；乙：頻率
  - label: B
    content: 甲：波形；乙：頻率
  - label: C
    content: 甲：頻率；乙：振幅
  - label: D
    content: 甲：音量；乙：波形
  group_stem: '聲波振動有兩種性質：一個是__甲__，也就是一秒內振動的次數，以赫茲（Hz）作為單位；另一個是響度，與聲波的__乙__有關，通常會將此數值轉換為我們常見的「分貝」（dB）來表示。但是，上面說的只是「通常」的情況，在心理感知音量時，也會受到頻率的影響。

    在心理聲學領域，研究者會使用以「方（Phon）」作為心理感知音量的單位。方（Phon）就是一個聲音以 1,000 赫茲純音為參考音的心理感知音量大小。舉例來說，40
    方表示 1,000 赫茲的純音，以40 分貝播放時，所聽起來的心理感知音量大小。

    在等響曲線圖中，40 方的曲線從 1,000 赫茲往低頻區間延伸時，分貝數會逐漸上升。這就是說，如果兩個聲音要聽起來一樣大聲，100 赫茲聲音的分貝數需要比
    1,000 赫茲來得大才有辦法。

    換個角度解釋，同樣是 60 分貝的聲音，在 100 赫茲上，我們聽起來差不多僅是 40 方的聲音大小，但在 1,000 赫茲時，聽起來卻會更大聲。

    https://pansci.asia/archives/332206'
  shared_asset: g1_26_28
