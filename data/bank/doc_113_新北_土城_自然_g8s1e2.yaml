  section: 1
  number: 1
  type: single
  page: 1
  stem: 在真空的太空中，甲、乙兩艘太空船發生相撞並爆炸，產生劇烈聲響和亮光。此時，位於附近的丙太空船內的太空人觀察到爆炸現象。請問以下哪項敘述正確？
  options:
  - label: A
    content: 無法聽到爆炸聲，因聲音需經由介質才能傳播
  - label: B
    content: 無法聽到爆炸聲，因為太空中的聲音傳播速率極快
  - label: C
    content: 無法看到爆炸的光，因為光無法在真空中傳播
  - label: D
    content: 無法看到爆炸的光，因陽光無法照到爆炸位置
