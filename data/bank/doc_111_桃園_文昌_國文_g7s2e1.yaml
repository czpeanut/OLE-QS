- id: doc_111_桃園_文昌_國文_g7s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 關於〈紙船印象〉一文的資訊，下列何者完全正確？
  options:
  - label: A
    content: 「而有一些事情，卻像夏日的小河、冬天的落葉，像春花，也像秋草」意味著發生在生活中的事情，每一件事都極為特殊且別具意義，占有舉足輕重的地位
  - label: B
    content: 「只盼望自己能以母親的心情，為子女摺出一艘艘未必漂亮但卻堅強、禁得住風雨的船」，作者期望自己能做到薪火相傳，傳承母親對子女的愛，並盡力護衛自己的子女
  - label: C
    content: 作者以第一人稱立場著筆，以紙船為主軸，藉景抒懷，寫景中蘊涵動人的抒情韻味
  - label: D
    content: 全文脈絡由「人」而「物」而「情」，敘述時由「抽象」到「具體」，層次分明，主題明確
  lesson_raw:
