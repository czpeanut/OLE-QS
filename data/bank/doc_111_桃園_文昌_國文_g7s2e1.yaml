- id: doc_111_桃園_文昌_國文_g7s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 下列各選項中的文句敘述，何者錯字最多？
  options:
  - label: A
    content: 朗朗：格林夫婦的易舉震憾了義大利，他們仰制著最深沉的悲痛，不厭其繁地一遍又一遍陳述自己這椿行為的理念，無非是為了要把「尼可拉斯效應」無止境地推展下去。
  - label: B
    content: 天天：這簡直是人間天賴，臺語的瑰寶－－具體而微地把整個民族、整塊土地的生命農縮進一句乎喊。
  - label: C
    content: 秧秧：每個人的一生都會糟遇許多事，有些是倏忽既逝般的過眼雲煙，有些則是熱鐵洛膚般的記憶長存。
  - label: D
    content: 滿滿：我曾經有過許多紙船，在童年的無三尺浪的簷下水道杭行，使我幼年的雨天時光，特別顯得亮麗充實，讓人豢戀。
  tags:
    textbook: 七下 第三課 紙船印象
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 七下
      subject: 國文
      code: 第三課
      title: 紙船印象
      chapter: null
