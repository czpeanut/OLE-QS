    \    阿嬤的台南魯麵有一種特別的吃法，就是下好油麵(油麵一定要到有信用的老字號店去買不用硼砂的新鮮油麵)，放好魯湯後，才會加油蔥酥、烏醋和白胡椒粉，阿嬤的油蔥酥一定自己做，烏醋只買五印醋，白胡椒粉最考究：要用前一天才去迪化街買印尼進口的白胡椒粒，請中藥行磨粉(如用量大)，或自己研磨。\n\
    \    如今，阿嬤的流動宴席也成為我的宴席，也藉此表達了我對阿嬤和童年時光的懷念。\n——選自韓良露《良露家之味˙古早味的香腸熟肉和魯麵》"
