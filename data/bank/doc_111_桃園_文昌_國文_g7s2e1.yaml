- id: doc_111_桃園_文昌_國文_g7s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 在〈孩子的鐘塔〉一文中，敘述了格林夫婦捐贈兒子器官遺愛人間的始末及其後續效應，而此種後續效應所造成的現象，被稱之為「尼可拉斯效應」。請問下列選項中所描述的情境，何者符合「尼可拉斯效應」？
  options:
  - label: A
    content: 身為公司二十年資深員工的大寶，長久以來安逸度日，缺乏增進公司業績的鬥志。今年年初，公司錄取了一批新員工，新員工們工作認真、極有企圖心，但大寶仍不以為意，消極度日，導致半年後慘遭公司裁員
  - label: B
    content: 二寶在掃地時間時總是不打掃，但班上衛生股長卻未進行監督，放任二寶玩樂。班上同學看到二寶的情況，也一個個模仿，於是班上怠惰的掃地風氣漸起，導致班級環境髒亂不堪
  - label: C
    content: 亮亮老師常常告訴班上學生：「我對你們很有信心，你們一定可以在這次的足壘球比賽中得到冠軍！」在這番鼓勵與期待下，努力練習的學生們最後果真獲得了第一名
  - label: D
    content: 小寶每個月固定捐出100 元零用錢給慈善機構，並將捐款憑證發布在IG 限時動態裡。小寶的朋友們看到後，一一轉發他的限時動態。許多看到的人便跟進捐款，使得此慈善機構的捐款率在一年內提高了兩倍。
  lesson_raw:
    title: 孩子的鐘塔
    basis: 題幹提及〈孩子的鐘塔〉與格林夫婦
  tags:
    textbook: 七下 第二課 孩子的鐘塔
