  stem: 下列文句中「」的詞語，請問何者前後完全使用外來語？
  options:
  - label: A
    content: 花花騎著「摩托車」到公園野餐，吃著用心準備好的豬排「便當」與橘子「汽水」，瞬間倍感幸福
  - label: B
    content: 童年時在「日頭」下與同學玩「尪仔標」的回憶，「剎那」間浮上心頭，令人懷念萬分
  - label: C
    content: 開「巴士」的「運將」先生總是克盡職責地將學生送至目的地，工作態度可說是「一級棒」
  - label: D
    content: 救人一命，勝造七級「浮屠」，鼓勵人多行善、存好念，是這個「俱樂部」成立最重要的「宗旨」
