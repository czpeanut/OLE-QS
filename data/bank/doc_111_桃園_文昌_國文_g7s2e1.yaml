    content: 「如果你在心裡一遍遍學著，你一定可以聽到跟牛犁歌或丟丟銅仔一樣鮮活有趣的旋律」➔意謂叫賣聲具有琅琅上口的特色，更有易於學習模仿的樂趣
  - label: C
    content: 「昨天晚上你也許還吃著燒仙草，今天你忽然聽到他改叫『冷豆花哦』。」➔藉由食物種類的冷熱對比，點出小販販賣的商品種類眾多、應有盡有，可以任君挑選
  - label: D
