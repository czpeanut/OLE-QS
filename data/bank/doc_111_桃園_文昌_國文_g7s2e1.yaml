- id: doc_111_桃園_文昌_國文_g7s2e1_s2_28
  section: 2
  number: 28
  type: single
  page: 7
  stem: 下列關於本文的資訊，何者敘述完全正確？
  options:
  - label: A
    content: 作者阿嬤做的台南香腸熟肉和魯麵，是作者兒時經常能在家裡的餐桌上品嚐到的家常料理
  - label: B
    content: 食用香腸熟肉時，食材必須要食用前才川燙，且食材川燙程度須一致，避免生熟混雜，影響口味
  - label: C
    content: 香腸熟肉所用的沾料與魯麵所用的白胡椒粉，作者阿嬤皆自行購買材料製作，不假他人之手
  - label: D
    content: 香腸熟肉的準備工作可簡單，亦可繁雜；而魯麵的準備工作便極為費事
  group_stem: "就像海明威所說的，巴黎是美好的宴席，一生都跟隨著他四處流動。\n    我想我的阿嬤，也有這樣的美好的宴席，出生於台南的她，雖然年老後居住於台北近郊的舊北投，但在她家的餐桌上擺放的一直都是台南的宴席。\n\
    \    小時候曾住在阿嬤家的我，印象最深刻的就是阿嬤做的台南香腸熟肉和魯麵，這樣的宴席不是家常菜，只在特別的日子，像神明或阿公過生日時才會端上這兩道隆重的料理。\n\
    \    香腸熟肉，有點像北部人說的黑白切，但一定要有粉腸、糯米腸、香腸、生腸等等，熟肉中除了白切肉、粉肝外，還常會有平凡但卻充滿古早味的豬皮。\n   \
    \ 準備香腸熟肉，可以大費功夫，也可以簡單行事，不怕麻煩者，是連灌粉腸、香腸、糯米腸都自己來(阿嬤就有此等能耐)，現代人怕事，但也要有熟悉的灌腸店家，請他們代勞。\n\
    \    香腸熟肉大多是用川燙烹調，火候的拿捏很要緊，當天食用者一定當天才川燙，隔夜不好吃，有的東西要夾生(如粉肝)，有的要不生不老(如粉腸)，有的可以熟爛些(如糯米腸)，香腸熟肉雖然是以動物性蛋白質為主，但都會附一些蔬菜，常見的如白煮大蘿蔔、白煮韭菜，台南人還喜歡配上一碗鹹湯(如受荷蘭人影響的豌豆仁湯)。\n\
    \     吃香腸熟肉，沾料很要緊，阿嬤都是自己調製；煮肉骨蔬菜高湯混合北港的黑豆蔭油，沾起來入味卻不鹹口。\n     香腸熟肉攤，在台南人心目中，不只是食物，還代表悠閒的時光，老同學、老朋友許久未見，見面後相約一起吃香腸熟肉，透露出的訊息還有我們該坐下來聚聚聊聊，香腸熟肉也代表的是人們互相珍重的人情。\n\
    \     魯麵和香腸熟肉一樣是豐盛的食物，但香腸熟肉是分開的豐盛，魯麵則是聚合在一起的豐盛，魯麵本來是家庭團聚時的食物，並不在外面的餐館或小吃販賣，魯麵的作料很繁複，有肉片、蝦米、金針、菠菜、香菇、扁魚、白蘿蔔、胡蘿蔔、白菜等等。\n\
    \    我和阿嬤學的魯麵作法很費事，一定要用豬大骨、尾骨、小骨、胡蘿蔔、芹菜、薑片等等去熬肉湯，要一次加足夠的水熬成三分之一的湯(過程中不可再加水)，用這個湯底去爌白蘿蔔塊，當成是魯麵的湯底。\n\
    \    魯麵的材料要分別炒(因為不同食材需要的受熱溫度及時間不同)，要先用新油小火煸扁魚(不要買別人煸好的，容易有舊油味)，煸好的扁魚磨成碎粒待用，再分別炒泡好的蝦米(要買現流劍蝦乾來發泡)，炒香菇(買埔里的小香菇較香)，炒肉片(買外號叫老鼠肉的小腿肉最嫩)，炒金針(不可買染色的)，之後再炒白菜片、胡蘿蔔片，再和湯底混在一起就成了魯麵的魯湯。\n\
    \    阿嬤的台南魯麵有一種特別的吃法，就是下好油麵(油麵一定要到有信用的老字號店去買不用硼砂的新鮮油麵)，放好魯湯後，才會加油蔥酥、烏醋和白胡椒粉，阿嬤的油蔥酥一定自己做，烏醋只買五印醋，白胡椒粉最考究：要用前一天才去迪化街買印尼進口的白胡椒粒，請中藥行磨粉(如用量大)，或自己研磨。\n\
    \    如今，阿嬤的流動宴席也成為我的宴席，也藉此表達了我對阿嬤和童年時光的懷念。\n——選自韓良露《良露家之味˙古早味的香腸熟肉和魯麵》"
