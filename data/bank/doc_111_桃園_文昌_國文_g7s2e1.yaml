  options:
  - label: A
    content: 紅色的是遊子的心；黃色的是平凡的臉；藍色的是思念的河；綠色的是家鄉的水；白色的是母親的頭
  - label: B
    content: 如何讓你遇見我，在我最美麗的時刻？為這，我已在佛前求了五百年，求祂讓我們結一段塵緣
  - label: C
    content: 朵朵霜花，想到兒時窗上的剪紙；片片雪花，憶起父親忙碌的故事；點點梅花，就是母親教我的小詩
  - label: D
    content: 童年是風，吹來朵朵天雲;童年是雲，化作新春的雨;童年是雨，滋潤初生的花;童年是花，伴我暮看晚霞
  group_stem: "就像海明威所說的，巴黎是美好的宴席，一生都跟隨著他四處流動。\n    我想我的阿嬤，也有這樣的美好的宴席，出生於台南的她，雖然年老後居住於台北近郊的舊北投，但在她家的餐桌上擺放的一直都是台南的宴席。\n\
    \    小時候曾住在阿嬤家的我，印象最深刻的就是阿嬤做的台南香腸熟肉和魯麵，這樣的宴席不是家常菜，只在特別的日子，像神明或阿公過生日時才會端上這兩道隆重的料理。\n\
    \    香腸熟肉，有點像北部人說的黑白切，但一定要有粉腸、糯米腸、香腸、生腸等等，熟肉中除了白切肉、粉肝外，還常會有平凡但卻充滿古早味的豬皮。\n   \
    \ 準備香腸熟肉，可以大費功夫，也可以簡單行事，不怕麻煩者，是連灌粉腸、香腸、糯米腸都自己來(阿嬤就有此等能耐)，現代人怕事，但也要有熟悉的灌腸店家，請他們代勞。\n\
    \    香腸熟肉大多是用川燙烹調，火候的拿捏很要緊，當天食用者一定當天才川燙，隔夜不好吃，有的東西要夾生(如粉肝)，有的要不生不老(如粉腸)，有的可以熟爛些(如糯米腸)，香腸熟肉雖然是以動物性蛋白質為主，但都會附一些蔬菜，常見的如白煮大蘿蔔、白煮韭菜，台南人還喜歡配上一碗鹹湯(如受荷蘭人影響的豌豆仁湯)。\n\
    \     吃香腸熟肉，沾料很要緊，阿嬤都是自己調製；煮肉骨蔬菜高湯混合北港的黑豆蔭油，沾起來入味卻不鹹口。\n     香腸熟肉攤，在台南人心目中，不只是食物，還代表悠閒的時光，老同學、老朋友許久未見，見面後相約一起吃香腸熟肉，透露出的訊息還有我們該坐下來聚聚聊聊，香腸熟肉也代表的是人們互相珍重的人情。\n\
    \     魯麵和香腸熟肉一樣是豐盛的食物，但香腸熟肉是分開的豐盛，魯麵則是聚合在一起的豐盛，魯麵本來是家庭團聚時的食物，並不在外面的餐館或小吃販賣，魯麵的作料很繁複，有肉片、蝦米、金針、菠菜、香菇、扁魚、白蘿蔔、胡蘿蔔、白菜等等。\n\
