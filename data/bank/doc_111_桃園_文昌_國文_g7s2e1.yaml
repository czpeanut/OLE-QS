    (乙)這一段□□□□般的言語，使我糾結混亂的心靈，頓時豁然開朗，得到解答。

    (丙)那位歌手所演唱的歌曲，高亢處□□□□，低迴處如新鶯出谷，美妙嗓音令人沉醉。

    (丁)同學會上，久違的大家聊起□□□□的前塵往事，瞬間彷彿回到了同窗時期的青澀歲月。'
