  section: 2
  number: 29
  type: single
  page: 7
  stem: 阿雄看完文章後，在家依照文中步驟想烹調出阿嬤的魯麵，但由於準備及製作步驟的紀錄有誤，導致魯麵的美味欠佳。下列為阿雄所抄寫的製作紀錄，請問哪個選項的紀錄完全正確？
  options:
  - label: A
    content: 阿雄至市場購買魯麵食材，結帳時購物籃應有豬骨、蝦子、金針菇、胡蘿蔔、老鼠肉、小白菜……等食材
  - label: B
    content: 熬肉湯時，阿雄每次加入三分之一的水量，共加入三次，再以此湯底去煮白蘿蔔塊，以此完成魯麵湯底
  - label: C
    content: 炒魯麵材料時，阿雄細心地將各種食材分開拌炒，避免不同食材因受熱溫度及時間不同而影響味道或口感
  - label: D
    content: 阿雄先把扁魚磨成碎粒，再利用回鍋油以文火煸扁魚；也記得使用天然的金針菇入菜，確保食用的健康
