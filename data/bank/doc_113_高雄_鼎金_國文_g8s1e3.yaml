    \ 大棒球賽事懶人包一次看！\n1、世界12 強棒球賽（WBSC Premier 12）\n    世界12 強棒球賽為世界棒壘球總會（WBSC）舉辦的最高級別賽事，由世界排名前12\
    \ 國家參賽，未來將擴大至16 隊（前18 名＋2 外卡競爭）。自2015 年第一屆開辦，每四年舉行一次（受疫情影響有所調整），至今已三屆，12 強棒球賽作為WBSC\
    \ 旗艦級賽事，也同時身兼奧運棒球項目的資格賽，下一屆為2027 奧運資格賽，也是臺灣目前拿下第一座大賽冠軍。\n2、WBC 世界棒球經典賽（World Baseball\
    \ Classic, WBC）\n    WBC 世界棒球經典賽為美國職棒MLB 主導，與世界棒壘球總會WBSC 合作之賽事，目前賽制20 隊，並設有資格賽。自2006\
    \ 年第一屆開辦，每四年舉行一次（受疫情影響有所調整），至今已開辦五屆，下一屆為2026 年。最大的特色為開放美國職棒MLB 選手可參賽，被國際棒球公認實力為最頂級的比賽。WBC\
    \ 經典賽投手用球數限制、選手參賽身分認定條件較寬鬆。臺灣最佳成績為2013 年進入第二輪複賽，值得一提的地方是，2023 年張育成敲出滿貫砲，讓許多球迷印象深刻，因此有「國防部長」的頭銜。\n\
    3、奧運棒球賽（Olympic Games Baseball）\n    奧運棒球賽由世界棒壘總會（WBSC）的上級單位，國際奧會（IOC）主辦，自1992\
    \ 年巴塞隆納奧運首次成為正式項目，已開辦6 次。不過，由於棒球並非夏季奧運會永久常設項目，因此每屆奧運不一定會有這項賽事。2028 年洛杉磯奧運確定有棒球項目，目前仍未開放MLB\
    \ 40 人名單選手參賽，參賽資格將由WBSC 12 強賽決定，臺灣歷史最佳成績為1992 年巴塞隆納奧運獲得銀牌。     (網路文章：風傳媒)"
