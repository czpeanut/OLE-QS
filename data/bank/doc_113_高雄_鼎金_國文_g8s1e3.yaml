  group_stem: '鳥聲之最可愛者，不在人之坐時，而偏在睡時。鳥音宜曉聽，人皆知之；而其獨宜於曉之故，人則未之察也。鳥之防弋，無時不然。卯辰以後，是人皆起，人起而鳥不自安矣。慮患之念一生，雖欲鳴而不得，鳴亦必無好音，此其不宜於晝也。曉則是人未起，即有起者，數亦寥寥，鳥無防患之心，自能畢其能事。且捫舌一夜，技癢於心，至此皆思調弄，所謂「不鳴則已，一鳴驚人」者是也，此其獨宜於曉也。莊子非魚，能知魚之樂；笠翁非鳥，能識鳥之情。凡屬鳴禽，皆當呼予為知己。                        ─李漁《閒情偶記》

    註：防弋：防範被人獵捕。捫舌：閉嘴。笠翁：李漁的號。'
