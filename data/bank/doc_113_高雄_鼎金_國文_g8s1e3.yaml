  group_stem: "當我到非洲去旅行以前，很多人介紹我去一個小鎮。這個小鎮的原名是什麼？已經不重要了，大多數人就叫這個小鎮K.S.，也沒有人了解為何它有這個綽號。這個小鎮的確與眾不同，最大的特點是它的郊外有很好的灌溉系統，也有相當多的樹木，據說，這是非洲樹木最密的地方，而這些樹都是近年來種的。灌溉系統當然不是新的，但是維護得很好，所以當地的人可以不愁缺水，農作物因此也可以生長得不錯。\n\
    \    我到了這個小鎮以後，發現好多地方都以K.S.命名，很多飯店叫作K.S.，當然為了區別起見，也會加一些字在前面.，我在街上閒逛了一陣，看到了一家咖啡館，就叫作K.S.Cafe。老闆是個中年人，很和氣，會講英文，他問我從哪裡來的，我說我是從台灣來的。他一聽到台灣，神情立刻一變，一再地向我問台灣的情況，從他的談話中，他是完完全全的台灣迷。我在非洲旅行，過去從未碰到任何人對台灣如此有興趣，大多數人根本搞不清楚台灣在哪裡，他對台灣如此有興趣，當然也使我非常高興，頗有受寵若驚之感。乘機問他為什麼這個地方到處都有K.S.的字樣，他說：\n\
    \    很多年前，有一個來自台灣的年輕人到這個小鎮做義工，他在這裡有一年之久，一年之內，他教會了很多學生如何使用機械，這些機械都是他設法從台灣運來的，當地的高中接受了這些機械，也使他們的教育水準大為提高。雖然這位年輕人力求生活得和當地人一樣，大家仍然知道他是當地最富有的人，他有電腦，有手機、電子照相機，他也捐了好多視聽器材給學校，這些器材都是當地學校買不起的。可是，有一天，有歹徒進入了他住的地方，除了將他的那些相機等等洗劫一空以外，還殺害了他。\n\
    \    第二天早上，警察來了，也查不出所以然，可是，對這個小鎮的居民來說，可說是悲傷之至。因為他們沒有想到搶匪居然會殺害如此善良的人。小鎮居民以最快的速度告訴了年輕人在台灣的家屬，出乎意料之外的是他的家屬似乎早有預感。小鎮居民當然都參加了年輕人的安葬儀式。年輕人是天主教徒，但是，這次彌撒卻是中文的，連聖歌也是中文的。主禮的神父一開始就解釋天主教強調寬恕，年輕人是天主教徒，當然一定會原諒殺害他的人。彌撒結束後，年輕人的爸爸說他的兒子在一個多月以前有一點奇怪的感覺，他認為極有可能會有人要來搶他的財物，而且他也極有可能喪失生命，所以他寫了一封信給他的父母，要求他的父母心中不要有仇恨以外，還要求他的父母能夠出一筆錢來替這個小鎮建造一個灌溉系統，也希望他的父親替小鎮種植一片防風林，以防止小鎮的沙漠化。年輕人的爸爸在葬禮結束以後的致詞中，承諾一定會完成兒子的遺願。\n\
    \    而最令大家吃驚的是：這位父親展示了一幅中國的字畫，上面寫了兩個中國字，小鎮的居民完全看不懂。他解釋了這兩個字是「寬恕」，他要將這一幅字送給兒子服務的學校。但是大家不會念這兩個字，也知道念來念去總不對，後來，有一位老師說，我們就用K.S.來念這兩個字吧。從此，這所高中改名為K.S.高中，這所高中所在的街道也改名為K.S.街，小鎮唯一的診所改名為K.S.診所，可想而知的是，有些飯館和咖啡館也改名為K.S.飯店、K.S.咖啡館。\n\
    \    為什麼小鎮居民對K.S.這兩個字感覺如此之好？不僅是因為年輕人的父親沒有對他們口出任何怨言，還真的派人來探測地理環境，小鎮因此有一個又長又寬的樹林保護他們。灌溉系統完成以後，不停的有來自台灣的農業專家教他們種植適合的農作物。我找到了年輕人的墓。墓地是一片青草，只有一塊銅牌，上面刻著K.S.兩個字，沒有死者名字，也沒有死者的出生和去世的年月日，據說，這是年輕人父母的願望，他們希望大家永遠記得的是他們的兒子有寬恕的美德。\n\
    \    青草地旁種了一棵柳樹，我注意到柳樹下有一個盒子，盒子上有一個按鈕，按鈕旁的說明顯示我若按下按鈕，可以聽到好聽的音樂。我當然立刻按了一下，令我吃驚的是從四個揚聲器中，出來了我們中國的聖母頌，江文也的〈聖母經歌〉，「萬福瑪利亞，滿被聖寵者，主與爾偕焉……」，但是我現在聽到的歌，雖然是中文的，一聽卻就知道，這是外國小孩子努力地用中文唱出來的。他們不可能完全懂這些中文字的意義，他們知道來自台灣的年輕人喜歡聽這首歌，所以那所高中的學生就拚了命用拼音的方法唱了這首中文歌，他們一定想告訴年輕人，他將永遠活在他們的心中。而我呢？在我聽到中文的〈聖母經歌〉以後，我忽然有了濃厚的鄉愁，我想立刻回到我的家鄉，不僅因為我可以大聲地用中文唱我喜愛的聖歌，而且我現在更加感覺到自己國家的可愛，因為我們的社會是一個懂得寬恕的社會。\n\
    \    在飛機上，我睡著了，我夢到我坐的飛機是K.S.號，屬於K.S.航空公司的，而且是向K.S.城市飛去。\n                    \
    \                                   ──節錄自李家同 《K.S.感動》"
