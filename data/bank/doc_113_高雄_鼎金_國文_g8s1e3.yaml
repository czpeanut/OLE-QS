  group_stem: "今天早上，我起床，發現家裡一個人也沒有。只好打你媽媽的手機。 手機是你接的。\n    「你們到哪裡去了啊？」爸爸問。\n    「你難道不知道我今天要上中文嗎？」你在那頭說，「我們正在去徐老師家的路上。」\n\
    \    早上，因為你正要去上課，我不好多說，但是現在爸爸必須對你叮囑一番。孩子，你大了，應該知道說話的技巧了。會說話的人，絕不是總以責難語氣咄咄逼人的。想想，如果天氣冷，你穿少了，媽媽對你吼「你想凍死啊？」是不是在感覺上遠不如她對你溫柔地講「今天天冷，多穿一點」？想想，如果你在教室裡開窗子，有同學對你喊：「你不冷嗎？你不冷，我們冷。」是不是遠不如，她對你關心地說：「別開窗子吧，回頭著涼了。」不是很簡單、很明確，感覺上比你用責難的「問句」好多了嗎？沒禮貌，除了顯示自己沒教養，還常吃悶虧呀！\n\
    \                                                   ──節錄自劉墉給女兒的一封信"
