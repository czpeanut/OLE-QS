    \ 的佳績完封日本，奪下歷史性的冠軍，這是中華隊棒球史上首次在成棒世界級賽事（非分齡）奪下冠軍，日本國際賽27 連勝的史詩級紀錄也因此被中斷。不過，你知道世界國際3\
