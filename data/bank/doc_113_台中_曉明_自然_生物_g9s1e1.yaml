- id: doc_113_台中_曉明_自然_生物_g9s1e1_s1_47
  section: 1
  number: 47
  type: single
  page: 6
  stem: 若有因腹瀉而嚴重脫水的兒童，應給予飲用下列何種液體，對其身體水分的補充效果較佳？
  options:
  - label: A
    content: 蒸餾水
  - label: B
    content: 低濃度蔗糖水
  - label: C
    content: 同時含葡萄糖及食鹽的運動飲料
  - label: D
    content: 高濃度食鹽水
  group_stem: '題組二、

    胃幽門螺旋桿菌是目前已知唯一能在胃部強酸性環境生存的細菌。胃幽門螺旋桿菌會粘附在胃黏膜上皮細胞上，胃幽門螺旋桿菌大量分泌尿素酶、超氧化物歧化酶與過氧化氫酶，都有助於它在胃部生存。尿素酶分解尿素為氨及重碳酸鹽，可中和胃酸保護細菌。胃幽門螺旋桿菌黏附並擾亂上皮細胞，使細胞受損，並減少粘液製造，造成局部被腐蝕的潰瘍。胃幽門螺旋桿菌是胃潰瘍或十二指腸潰瘍的主因，90%的十二指腸潰瘍病患與
    70%之胃潰瘍病患體內有胃幽門螺旋桿菌存在。殺死胃幽門桿菌時發炎與潰瘍即得到解決。

    胃黏膜的胃腺可分泌強酸的胃液，主要成分為鹽酸和胃蛋白酶，分泌的機制如附圖。藉由壁細胞膜上的 $H^{+}-K^{+}$幫浦，將 $H^{+}$分泌至胃空腔內。附圖為腸道內葡萄糖進入小腸絨毛上皮細胞的示意圖，已知小腸以滲透方式吸收的水量和其所吸收的
    $Na^{+}$量呈正比。試回答 47-48 題：'
