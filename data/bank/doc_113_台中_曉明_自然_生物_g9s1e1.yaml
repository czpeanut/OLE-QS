  group_stem: '題組三、

    小麥粒成熟過程中累積的澱粉，主要是依靠穗下第一片葉子（旗葉）的光合作用供給。且植物光合作用效率受溫度、光照及 $CO_{2}$濃度影響。某人做了一個實驗，將旗葉包在一個透明袋中，袋中始終保持
    25℃及充足的 $CO_{2}$，在旗葉基部裝置一可調節溫度的套環（如附圖左）。實驗開始時，套環溫度調至 20℃，測定 30 分鐘內透明袋中 $CO_{2}$吸收量、葉片水分蒸散量。然後將基部套環溫度調降至
    5℃，繼續再測 30 分鐘內的變化結果（如附圖右），且發現從旗葉向麥穗運輸的醣類含量下降。依此回答 49-50 題：'
