    content: 蘇伊士運河連結紅海、地中海；巴拿馬運河連結太平洋、印度洋
  - label: B
    content: 蘇伊士運河主權屬於土耳其；巴拿馬運河主權屬於巴拿馬
  - label: C
    content: 蘇伊士運河位於歐洲、亞洲交界；巴拿馬運河位於中美洲、南美洲交界
