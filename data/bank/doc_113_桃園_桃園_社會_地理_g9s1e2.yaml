    | --- | --- | --- |

    | A | 連結紅海、地中海 | 連結太平洋、印度洋 |

    | B | 主權屬於土耳其 | 主權屬於巴拿馬 |

    | C | 位於歐洲、亞洲交界 | 位於中美洲、南美洲交界 |

