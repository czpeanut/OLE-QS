    文文：「對啊！因為他很懂我，我們又有共同興趣呀！不過，你跟中哥聊得來，我才覺得不可思議，他可是足足大了你十五歲。」

    昌仔：「年齡不是問題啦！你應該要放開胸懷去結交不同年齡層的人。」

    文文：「不行啦！我跟中哥沒話說，遇到時頂多點個頭。」

    昌仔：「好吧！交朋友還是看緣分，像我跟阿國也是話不投機半句多。」'
  options:
