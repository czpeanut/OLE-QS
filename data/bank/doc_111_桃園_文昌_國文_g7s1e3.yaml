  group_stem: "（二）〈發現另一個自我〉                                                      \
    \           王溢嘉 \n  「一介之士，必有密友。」在不斷地與各式人等接觸的過程中，我們終將找到我們的朋友。 \n  就像亞里斯多德所說：「朋友是另一個自我」，朋友不僅是「知己」ˇˇ知道自己的人，我們還能從朋友身上看到「自我」。\
    \ \n  兩個朋友的交會就是兩個「意識」的交會，這兩個「意識」有很多地方像平滑的鏡面般，能正確無誤地映照出對方的心靈樣貌，讓彼此產生「他瞭解我」、「我們是一樣的」的喜悅感覺。\
    \ \n  哲學家羅素說：「我在劍橋大學的第一學期，就認識了一大群人，他們後來都成為我終生的摯友，從此我再也沒有重溫童年時代那種難熬的孤寂。」朋友，是最能讓我們免於孤寂的人；而求學時代，正是我們與他人建立終生友誼的黃金時代。\
    \ \n  羅素在上大學前相當寂寞，不只因為他在五歲時，即因雙親相繼故世，而和年老的祖母相依為命；更因為來往的都是宗教氣氛濃厚的貴族家庭，使他必須壓抑自己的情感和思想。他早就懷疑上帝的存在，但卻不敢對人言；而他對數學和哲學的興趣，卻被周遭的人認為「荒謬可笑」。沒有人瞭解他。\
    \ \n  但在進入劍橋大學後，他發現原來有不少人「跟他一樣」，喜歡談哲學、談內心的想法、具有懷疑精神而又熱烈追求真理，他「欣喜若狂」，立刻如魚得水地加入他們，一個「意識孤島」終於找到了類似的意識體，而融入更大的「意識群島」中，不再感到寂寞。\
    \ \n  不管是「志趣相同」或「臭味相投」，學生時代所建立的友誼總是令人特別珍惜和懷念。羅素在大學時代曾參加一個名為「門徒」的社團，成員只有十二人（如耶穌的十二門徒），在星期六晚上輪流到每個人的住處聚會，由一人朗讀他的哲學論文，其他人參與討論。這種討論通常徹夜不停，直到星期日清晨，大家再迎著晨曦去散步，然後回家睡大覺。\
    \ \n  它的令人懷念與珍惜，不只是彼此興趣相同，還有屬於年輕人浪漫的理想，以及為興趣與理想而在身心方面的耽溺與放縱。等你年紀大一點，就再也難有這種機會、心情和體力。\
    \ \n  年輕時代所結識的朋友，正具有這種可愛的特性。他們像一面晶瑩剔透的明鏡，映照你年輕的思想、情感、興趣和理想。即使日後各分東西，但只要想起他們，就讓人心裡充滿溫馨。\
    \ \n  趁現在多去認識、結交一些志同道合的朋友，去發現更多的「另一個自我」，倘佯於更大的「意識群島」中吧！"
