  stem: '故事中，作者透過描寫人物情態及運用對話呈現角色的心理。下列對於彼得的分析何者正確？


    | 選項 | 文本內容 | 人物心理狀態 |

    | :--- | :--- | :--- |

    | （A） | 彼得面無表情地看了看她，然後開口問：「妳要買來送人？」 | 冷淡苛刻 |

    | （B） | 彼得若有所思地看著她，然後小心地收起項鍊，遮住標價，不讓小女孩看到。 | 猶豫不決 |

    | （C） | 「我不能說。」彼得說：「銷售員從不告訴別人顧客付了多少錢。」 | 故弄玄虛 |

    | （D） | 彼得把拆開的盒子重新包裝，非常仔細、漂亮，就像十天前他為琴‧格雷斯做的一樣。 | 充滿柔情 |'
  options:
