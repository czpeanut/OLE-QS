  group_stem: "（三）自學選文〈藍色串珠項鍊〉                                              歐斯勒 \n\
    \  她不知道自己為姐姐買的耶誕禮物竟然改變了一個男人的人生。 \n  在琴‧格雷斯走進彼得‧理查茲的店那天，彼得是鎮上最孤獨的人（甲）。當時你可能有在報紙上看過相關報導，但報導並未提及男女主角的姓名，來龍去脈也不如我現在要說的詳盡。\
    \ \n  彼得的店繼承自祖父。小小的櫥窗裡擺滿了各種漂亮的舊貨：一百多年前的手鐲、項鍊墜子、小盒子，還有黃金珠寶和銀製盒子，以及玉、象牙或瓷製的異國雕像。\
    \ \n  在一個冬日下午，有個小女孩站在店門口，小臉貼近櫥窗玻璃，眼睛睜得大大的，很認真地仔細觀察櫥窗裡展示的商品，好像在找非常特別的東西。終於，她臉上露出了笑意，走進店裡。\
    \ \n  店裡很陰暗（乙），但仍能看見架上擺滿了商品：珠寶盒、骨董槍、鐘錶、燈、曼陀鈴，還有許多她叫不出名字的東西。彼得一個人站在櫃臺後，他才三十歲，頭髮卻已開始灰白。他冷冷地看著這位小顧客，小女孩沒有戴手套的手撐在櫃臺桌面上（丙）。\
    \ \n  「先生，請讓我看看櫥窗裡的那條藍色串珠好嗎？」她開口。 \n  彼得拿出了項鍊，展示給小女孩看，藍綠色的寶石在他蒼白的手中閃著美麗的光芒。 \n\
    \  「太完美了。」小女孩對自己說。「請您幫我包裝得漂漂亮亮的好嗎？」 \n  彼得面無表情地看了看她，然後開口問：「妳要買來送人？」\n  「要買給我姐姐的。都是她在照顧我。這是媽媽死後的第一個耶誕節，我一直在找一樣最棒的耶誕禮物送給她。」\
    \ \n  「妳有多少錢？」彼得小心翼翼地問。 \n  小女孩忙著打開手帕的結，倒出一把硬幣，放在櫃臺上。「這是我全部的積蓄。」她簡單地解釋：「我一直在存錢要買禮物送給姐姐。」\
    \ \n  彼得若有所思地看著她，然後小心地收起項鍊，遮住標價，不讓小女孩看到。他能告訴她項鍊的價錢嗎？小女孩大大的藍眼睛裡流露出的信任，像舊傷發作一樣打動了他。\
    \ \n  「等一下。」他說完便走到店裡後方。「妳叫什麼名字？」他喊道，手上正忙著什麼事情。「琴‧格雷斯。」小女孩回答。彼得回到櫃臺時手裡拿了一個盒子，用紅色包裝紙包著，上面還用綠色緞帶綁了蝴蝶結。\
    \ \n  「給妳。」他說：「小心回家的路上別弄丟了。」 \n  她開心地笑著跑出了店門。他透過窗戶看著小女孩離開，心裡覺得比之前還要孤獨。琴‧格雷斯和那條項鍊使他再一次想起了往日的不幸。\
    \ \n  小女孩金黃的頭髮，像小麥一樣；藍藍的眼睛，像大海一樣。以前，彼得愛過一名女子，她也有金黃的頭髮和藍藍的眼睛。那條藍寶石項鍊本來是要送她的禮物。然而，在一個下雨的夜晚，一輛轎車打滑駛離馬路，撞死了他心愛的人。從此，彼得‧理查茲因為過度悲傷而一直活在孤獨中。店裡顧客上門時，他會禮貌地招呼他們，等到打烊後，他的世界就只剩下孤單的空洞了。他試著要擺脫日漸加劇的顧影自憐。\
    \ \n  琴‧格雷斯的碧眼使他從顧影自憐中驚醒，記起了自己所失去的一切。回憶帶來的痛苦是如此巨大，以至於在接下來生意興旺的十天裡，彼得甚至想從來採買耶誕禮物顧客身邊逃走。當耶誕夜到來，最後一個顧客也走了以後，彼得終於鬆了口氣。又一年要過去了。\
    \ \n  但是對彼得‧理查茲來說，那一夜還沒有結束。門開了，一位年輕的小姐匆匆進到店裡。彼得覺得她很面熟——金黃的頭髮，藍藍的眼睛——卻想不起來在何時何處見過她。她一句話也沒說，只是從皮包裡拿出一個盒子放到了櫃臺上，盒子用拆開過的紅色包裝紙包著，上面還有綠色緞帶綁的蝴蝶結。盒子裡面是那條藍寶石項鍊，再度在彼得面前閃耀著。\
    \ \n  「這條項鍊是從您店裡賣出的嗎？」她問。 \n  彼得看了看她，眼神不再冷漠。「是的，是從我這裡賣出的。」他溫柔地回答。 \n  「寶石是真的嗎？」\
    \ \n  「是的。儘管不是品質最好的，但確實是真的。」 \n  「您記得賣給誰嗎？」 \n  「賣給一個叫琴的小女孩。她想送給姐姐當耶誕禮物。」 \n \
    \ 「這項鍊多少錢？」 \n  「我不能說。」彼得說：「銷售員從不告訴別人顧客付了多少錢。」 \n  「但是琴沒有這麼多錢啊，她怎麼可能買得起項鍊呢？」 \n\
    \  彼得把拆開的盒子重新包裝，非常仔細、漂亮，就像十天前他為琴‧格雷斯做的一樣。 \n  「她付出了一個人所能給的最高價錢。」他說：「她傾囊而出。」（丁）\
    \ \n  小店裡寂靜無聲了好一會兒。忽然，遠方尖塔的鐘響起。午夜，耶誕節到了。 \n  「可是您為什麼要這麼做？」她問。 \n  彼得把包裝好的禮物交給她。\
    \ \n  「已經是耶誕節了。」他說：「而我很不幸的沒有別人能讓我送禮物。能讓我送您回家嗎？我衷心祝您耶誕快樂。」 \n  於是，在不停響著的鐘聲裡，彼得‧理查茲和一位他還不知道姓名的女性走向一個充滿希望和幸福的新開始。"
