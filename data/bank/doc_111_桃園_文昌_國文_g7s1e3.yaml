    content: 文文跟阿國是莫逆之交
  - label: B
    content: 文文跟昌仔是總角之交
  - label: C
    content: 昌仔跟阿國是患難之交
  - label: D
    content: 昌仔跟中哥是忘年之交。
  tags:
    textbook: 七上 第八課 朋友相交
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 七上
      subject: 國文
      code: 第八課
      title: 朋友相交
