    \ 「這項鍊多少錢？」 \n  「我不能說。」彼得說：「銷售員從不告訴別人顧客付了多少錢。」 \n  「但是琴沒有這麼多錢啊，她怎麼可能買得起項鍊呢？」 \n\
    \  彼得把拆開的盒子重新包裝，非常仔細、漂亮，就像十天前他為琴‧格雷斯做的一樣。 \n  「她付出了一個人所能給的最高價錢。」他說：「她傾囊而出。」（丁）\
    \ \n  小店裡寂靜無聲了好一會兒。忽然，遠方尖塔的鐘響起。午夜，耶誕節到了。 \n  「可是您為什麼要這麼做？」她問。 \n  彼得把包裝好的禮物交給她。\
    \ \n  「已經是耶誕節了。」他說：「而我很不幸的沒有別人能讓我送禮物。能讓我送您回家嗎？我衷心祝您耶誕快樂。」 \n  於是，在不停響著的鐘聲裡，彼得‧理查茲和一位他還不知道姓名的女性走向一個充滿希望和幸福的新開始。"
