- id: doc_113_台中_鹿寮_國文_g7s2e2_s2_33
  section: 2
  number: 33
  type: single
  page: 4
  stem: 根據上文，請判斷下列何者敘述正確？
  options:
  - label: A
    content: 我們可藉由研究古代文字，了解古代人們的生活樣貌
  - label: B
    content: 東海黃公「活到老搏到老」的精神有如愚公移山
  - label: C
    content: 上古的人們總活在與老虎拚鬥性命的威脅中
  - label: D
    content: 可推測「戲」、「虢」兩字屬於造字原則中的「象形」。
  group_stem: '如果有人想誇示其膽力與勇氣，在上古恐怕沒有比跟老虎搏鬥更具刺激性的場面了。所以扮演搏鬥老虎的故事，甚至是與真實老虎搏鬥，就成了古代一種很有號召力的娛樂節目。漢代就有「東海黃公」的記載，敘述一人年輕的時候以表演徒手搏鬥老虎為職業，到了年老的時候竟不知身體已衰弱，還帶了刀子上山要去捕捉老虎，結果反而被老虎掉了。金文的「戲」字，就是由老虎、戈、以及凳子組成，想是表達一人持戈表演刺殺高踞的老虎之意。

    甲骨文的「虢」字，則是更為驚險的雙手扭鬥老虎的樣子。這些都可以證明此種表演從很早之前就有了。

    （許進雄《戰國重金屬之歌——漢字與文物的故事》）'
