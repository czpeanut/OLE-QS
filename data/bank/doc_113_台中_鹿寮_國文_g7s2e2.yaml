- id: doc_113_台中_鹿寮_國文_g7s2e2_s2_29
  section: 2
  number: 29
  type: single
  page: 3
  stem: 根據「以五行相生相剋作為朝代更替的對應」的說法，周朝應該偏好什麼顏色？
  options:
  - label: A
    content: 白色
  - label: B
    content: 黃色
  - label: C
    content: 黑色
  - label: D
    content: 紅色。
  group_stem: '在古代，色號可不能隨便用。古人在「五行」的基礎上形成了「五色」觀。也就是金、木、水、火、土五德，分別對應著白、青、黑、赤、黃，而這五種顏色就被稱為「五正色」。

    古時陰陽家將五行看成五德，以五行相生或相剋作為朝代更替的對應。例如：商朝屬金德，流行白色。商之後的周則認為自己剋死商，所以屬於火德。滅了周的秦朝則秉持水剋火的想法，崇尚黑色。基本上，如果知道朝代屬於哪一德，就可以推斷這個朝代流行什麼顏色了。例如：宋朝為火德，皇帝就喜歡穿紅色。在某益智節目上，某男星所飾演的宋徽宗穿著黃龍袍引發爭議。其實，宋朝皇帝不是不可以穿黃色，只是相對於黃色，宋朝皇帝還是更常穿紅色。

    經過歷朝歷代的發展，以服飾的樣式、配件、紋色等來區分社會階層身分的貴賤高低，是常見的潛規則。自上而下大致是：紫、緋①、綠、青、黃。唐高宗時期，曾有官員夜裡穿著黃袍，被當作普通人毆打，唐高宗便下令「自此朝參②行列，一切不許著黃」—禁止官員上朝時穿黃色，使官員和庶民上下有別（黃色和白色是普通庶民用的低級色）。但值得注意的是，帝王常服的黃色，其實和庶民所穿的普通黃色系不同，也不是現在一般概念中的明黃色，而是色澤略深，黃中偏赤的赭黃和赤黃。後來作為皇帝常服的赭黃袍，用久了之後，漸漸成為了皇帝的專屬顏色，在元朝《元典章》中更直接記載「庶人不得服赭黃」。

    （改寫自黃蛋《古人比你更會玩：帽子，為什麼不能是綠色的？》）

    注：

    ①緋：音ㄈㄟ，紅色。

    ②朝參：指古代官員入宮覲見皇帝，奏事議政。'
