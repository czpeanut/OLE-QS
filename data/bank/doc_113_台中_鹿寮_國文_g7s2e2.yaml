- id: doc_113_台中_鹿寮_國文_g7s2e2_s2_35
  section: 2
  number: 35
  type: single
  page: 4
  stem: 根據本文，若魯夫想要成為一名斜槓青年，最好先經過哪些步驟？
  options:
  - label: A
    content: 培養專長 $\rightarrow$ 發揮潛能 $\rightarrow$ 檢核成果 $\rightarrow$ 找到工作
  - label: B
    content: 建立品牌 $\rightarrow$ 強化目標 $\rightarrow$ 自我行銷 $\rightarrow$ 選擇斜槓
  - label: C
    content: 尋找機會 $\rightarrow$ 嘗試錯誤 $\rightarrow$ 創造工作 $\rightarrow$ 人生規劃
  - label: D
    content: 認識自己 $\rightarrow$ 設計人生 $\rightarrow$ 刻意練習 $\rightarrow$ 知識變現。
  group_stem: '「斜槓」一詞源自紐約時報專欄作家麥瑞克·阿爾伯撰寫的書籍《雙重職業》。阿爾伯說：「愈來愈多年輕人不再滿足於單一職業的生活方式，轉而選擇多重職業和身分的多元生活。這些人用斜槓（Slash，/）來介紹其一連串的頭銜或身分。」

    現代社會年輕人年前低、升遷的管道愈來愈狹隘，在公司上班已經不是一輩子幸福安穩的保證。因此，現代工作者該想的問題已經不是「如何找到工作？」而是「我如何創造工作！」斜槓人的概念，恰巧為現今的職場變化找到一條出路。成為斜槓人，能夠為職涯找尋更多機會，發展自己的潛能。但是，成為斜槓人有那麼簡單嗎？該如何養成呢？

    首先，應該要徹底了解自己，以及自己對工作的期待。在選擇成為什麼斜槓前，應該先做好人生規劃。你可以用設計思維來規劃自己的人生，用好奇心探索機會，以行動打造原型，透過失敗、放手、再嘗試的過程，設計出屬於自己獨一無二的人生。找到自己的熱情，選擇自己想發展的第二專長後，就要靠刻意練習來幫助自己將專長培養起來。

    《刻意練習》的作者安德斯·艾瑞克森指出，每個人都有天賦，只要找到對的方法，就可以像在鍛鍊身體肌肉一樣，逐步強化它，讓它的功能發揮得更好。如果想要學習一項新的技能，可以找老師學習，每天挪出固定時間練習，並且設立明確的目標檢核點，檢視自己的學習效果。

    學會了一項新技能後，接下來就是將知識變成現金的步驟。把自己的專長丟到市場上，看有沒有人願意購買你的專長及服務。可以用寫文章或錄影片，在網路上分享自己的技能，藉此行銷自己的專長，建立個人品牌。舉例來說，Susan學習健身一年，她將自己的成果寫成文章發表在網路上，就吸引了一些想要學習健身的人，進一步向她諮詢問題。Susan一開始可以免費回答網友問題，等到累積品牌及信任，就可以考慮開始收費，當別人的健身顧問，或開設健身相關的課程，逐步將自己的知識、專長變為現金。

