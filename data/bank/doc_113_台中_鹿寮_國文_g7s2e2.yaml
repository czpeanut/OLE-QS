  section: 1
  number: 27
  type: single
  page: 3
  stem: 根據上文所述，下列哪一個公式最貼近「故事」的必備組成元素？
  options:
  - label: A
    content: 故事＝人＋衝突＋戲劇化轉折
  - label: B
    content: 故事＝主角＋困境＋渴望的目標
  - label: C
    content: 故事＝主角＋有趣的麻煩＋大團圓結局
  - label: D
    content: 故事＝男主角＋女主角＋愛情中的阻礙。
  group_stem: '布洛薇在《寫小說》提及：「衝突是小說的基本要素……衝突在生活中通常帶有負面的意義，但在小說中，不管是喜劇或悲劇，戲劇性的衝突都不可或缺，只有在文學中這些麻煩是令人感到有趣的，然而在生活中並非如此。」就像巴斯特說的：「地獄是故事的常客。」

    世界各地所有故事的內容幾乎都是人（或者擬人化的動物）和麻煩，這些人急於得到某些東西，想要生存、贏得佳人芳心或男孩的青睞、尋找失蹤的小孩。但在主角與所求事物之間總是存在著顯而易見的巨大阻礙。凡是故事，講的都是主角付出一些代價來取得他或她所渴望的一切。

    （改寫自哥德夏著，許雅淑、李宗義譯，《故事如何改變你的大腦？》）'
