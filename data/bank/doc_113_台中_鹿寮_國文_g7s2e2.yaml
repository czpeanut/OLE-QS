  - label: D
    content: 早作帶來計可也。
  group_stem: '有疾死還魂者，在冥司遇其故人，樞槤荷校①。相見悲喜，不覺握手太息②曰：「君一生富貴，竟不能帶至此耶？」其人潸然③曰：「富貴皆可帶至此，但人不肯帶耳。生前有功德者，至此何嘗不富貴耶？寄語世人，早作帶來計可也。」李南澗曰：「善哉斯言，勝於謂富貴皆空也。」

    （選自《閱微草堂筆記·陰陽富貴》）

    注：①校：古代刑具。②太息：大聲嘆氣。③潸然：愛愁貌。'
