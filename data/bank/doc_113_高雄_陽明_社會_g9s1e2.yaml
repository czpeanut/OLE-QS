  section: 1
  number: 12
  type: single
  page: 2
  stem: '郝任珍整理了紐西蘭與澳洲的重點筆記如下表，請問下列何者有誤?


    | 選項 | (A) | (B) | (C) | (D) |

    | :--- | :--- | :--- | :--- | :--- |

    | 國家 | 位置 | 地形主體 | 主要人口分布 | 曾經的殖民國 |

    | 紐西蘭 | 西半球、南半球 | 山地 | 北島 | 英國 |

    | 澳洲 | 東半球、南半球 | 高原 | 東南沿海平原 | 英國 |'
  options:
  - label: A
