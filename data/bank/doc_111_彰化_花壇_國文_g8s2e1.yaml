  stem: 讀完本詩後，請選出下列哪一個體悟最貼切？
  options:
  - label: A
    content: 木棉的葉子掉光，是一種不願同流合汙的姿態
  - label: B
    content: 形容木棉花是「燃燒成巨大火球」，充分展現生命力
  - label: C
    content: 木棉花血紅的顏彩，是為了保護樹木不受病蟲蛾殘害
  - label: D
    content: 花與葉子和蒴果不同時存在，象徵生命的無常與多變。
  group_stem: '春天，日夜騷擾著開花的夢

    為了開花

    竟連護持生命的葉子

    都割捨掉

    自殘葉片的樹枝

    掛滿花焰

    遠遠望去

    燃燒成一座巨大的火球

    裸身的季節

    慾情苞開血紅的顏彩

    誘喚授粉的蟲蛾

    當花的灰燼凋熄後蛻變成蒴果

    爆裂飛向新地

    絕食的木棉

    在城市與鄉村

    點燃著生存無盡的慾望

    （曾貴海 木棉花）'
  answer:
  - B
