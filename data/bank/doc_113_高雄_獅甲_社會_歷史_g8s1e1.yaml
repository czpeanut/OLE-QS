  section: 1
  number: 28
  type: single
  page: 1
  stem: 漢朝開通一條由長安出發，經西域、中亞直到歐洲的路線，聯結地中海附近國家的通道。此道路成為往後歐洲與中國在陸上往來的主要道路，後人稱為「絲路」。請問：有關「絲路」的敘述，下列選項何者正確？
  options:
  - label: A
    content: 西域指今日新疆省一帶
  - label: B
    content: 絲路開通最初與對付犬、戎有關
  - label: C
    content: 漢朝藉絲路與當時的波斯帝國聯繫
  - label: D
    content: 佛教透過絲路由中國傳到其他地方。
