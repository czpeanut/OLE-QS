- id: doc_113_高雄_獅甲_社會_歷史_g8s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 1
  stem: 中國政治制度主要有「封建」與「郡縣」兩種不同方式，統治者會因應國家的需要，選擇適合國家發展的制度，但往往在決定哪一種制度時會有優缺點的比較與爭議。請問：以下有關封建與郡縣的相關敘述何者正確？
  options:
  - label: A
    content: 封建本質為集權中央
  - label: B
    content: 郡縣官員是世襲產生
  - label: C
    content: 郡縣社會有嚴格階級差異
  - label: D
    content: 封建容易出現地方勢力失控。
