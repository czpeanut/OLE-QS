  section: 1
  number: 29
  type: single
  page: 2
  stem: 中國南方經濟發展過去不如北方，如右圖所示，開發程度在早期一直都相當落後，但隨著北方人口不斷移入南方，南方經濟逐漸有所發展。請問：有關南方經濟由落後期步入開發期，最有可能與下列哪一事件的發生有關？
  options:
  - label: A
    content: 犬戎之禍
  - label: B
    content: 戰國七雄混戰
