  section: 1
  number: 33
  type: single
  page: 2
  stem: 大食帝國曾於唐玄宗時擊敗中國，此戰爭在中國人眼中是重大的失敗，不過對未來西方世界卻有著極重要的影響。請問：有關此戰爭的敘述何者正確？
  options:
  - label: A
    content: 大食是指蒙古
  - label: B
    content: 此戰爭後唐朝被大食消滅
  - label: C
    content: 此戰爭被稱為蒙古西征
  - label: D
    content: 對西方世界影響是指造紙術西傳。
