  stem: 右圖描述某一社會階層在歷史發展中的興衰演變，從圖中可知此一社會階層在魏晉南北朝時的發展達於鼎盛，有關此一階層的相關敘述何者正確？
  options:
  - label: A
    content: 在九品官人法考試中成績優異者得以優先當官
  - label: B
    content: 魏晉時期精通五經得以優先當官
  - label: C
    content: 科舉打擊下逐漸退出政治舞台
  - label: D
    content: 魏晉時期封建分封的主要對象
