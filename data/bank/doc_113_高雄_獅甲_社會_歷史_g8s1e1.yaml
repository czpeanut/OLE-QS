- id: doc_113_高雄_獅甲_社會_歷史_g8s1e1_s1_23
  section: 1
  number: 23
  type: single
  page: 1
  stem: 商鞅變法改造了秦國，奠定秦國能從七雄脫穎而出的重要基礎，讓秦國最後一統天下。請問：下列何者是商鞅變法帶給秦國的重要貢獻？
  options:
  - label: A
    content: 有效掌握戶口，充實國家賦稅
  - label: B
    content: 鞏固貴族地位，換取貴族支持
  - label: C
    content: 推行儒家思想，君王愛民親民
  - label: D
    content: 層層分封諸侯，社會井然有序。
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 歷史
      code: 1-1
      title: 從封建到郡縣
      chapter: 第1章 商周至隋唐時期的國家與社會
