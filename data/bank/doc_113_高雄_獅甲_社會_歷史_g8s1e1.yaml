  section: 1
  number: 25
  type: single
  page: 1
  stem: 小瑋生活在春秋時期，父親為地方諸侯，小瑋被視為繼承父親諸侯身分的第一人選，自小被家人用心栽培。請問：有關小瑋的相關敘述何者正確？
  options:
  - label: A
    content: 小瑋在當時被視為血緣最接近父親的小孩
  - label: B
    content: 小瑋在家族中相對於其他平輩兄弟被視為小宗
  - label: C
    content: 小瑋媽媽應是父親結婚後再娶的女子
  - label: D
    content: 小瑋有機會見到周武王巡視天下。
