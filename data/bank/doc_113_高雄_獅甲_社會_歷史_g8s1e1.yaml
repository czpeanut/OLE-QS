- id: doc_113_高雄_獅甲_社會_歷史_g8s1e1_s1_22
  section: 1
  number: 22
  type: single
  page: 1
  stem: 春秋戰國是中國第一個長期分裂的時期，不僅政治上群雄爭霸，思想上亦呈現百家爭鳴的盛況，但秦漢時期之後，不論政治、學術思想都逐漸的確立了往後中國數千年發展的主要方向。請問：有關上述現象的相關敘述何者正確？
  options:
  - label: A
    content: 政治上趨向分權地方
  - label: B
    content: 學術上趨向儒家思想
  - label: C
    content: 秦始皇坑儒造就學術走向一統
  - label: D
    content: 漢武帝行封建造就政治走向擴張皇權。
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 歷史
      code: 1-1
      title: 從封建到郡縣
      chapter: 第1章 商周至隋唐時期的國家與社會
    textbook: 八上歷史 1-1 從封建到郡縣
