- id: doc_113_高雄_獅甲_社會_歷史_g8s1e1_s1_24
  section: 1
  number: 24
  type: single
  page: 1
  stem: 人才的挑選不論古今都是維繫一個國家能否正常運作的一大關鍵，也因此「選賢與能」的方法就經常被拿出來不斷檢視與修改，造就許多選才制度的出現。請問：有關選才制度的相關敘述何者正確？
  options:
  - label: A
    content: 封建社會以九品官人法挑選人才
  - label: B
    content: 魏晉南北朝選才首重家世背景
  - label: C
    content: 明清選才藉由地方官推選
  - label: D
    content: 唐朝選才方式使社會流動不易出現。
