  section: 1
  number: 20
  type: single
  page: 1
  stem: 獅甲國中近年積極推動品德教育，主張有好的品德才能有更好的處事能力，這樣的觀點正與中國漢朝的選才制度觀點相近。有關漢朝重視品德的取才制度，下列選項何者正確？
  options:
  - label: A
    content: 首重孝順與清廉兩種品德操守
  - label: B
    content: 藉由考試來了解品德的深淺
  - label: C
    content: 源於西漢皇帝推廣儒學
  - label: D
    content: 造就上品皆寒門的奇異現象。
