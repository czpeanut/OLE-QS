  section: 1
  number: 21
  type: single
  page: 1
  stem: 武王滅商建立周朝，定都鎬京，透過層層的分封建立一個龐大的統治網絡。請問：有關周朝的相關敘述何者正確？
  options:
  - label: A
    content: 是目前發現最早出現文字的朝代
  - label: B
    content: 被視為中國最早的統治帝國
  - label: C
    content: 因首都位置差異而有東、西周不同稱呼
  - label: D
    content: 周武王成為中國第一位皇帝
