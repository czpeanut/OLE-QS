  type: single
  page: 2
  stem: 大瑋在日劇或韓劇裡經常會見到兩國文字經常會有「漢字」的出現，讓不懂日文、韓文的大瑋能透過漢字了解大概意思。請問：哪一朝代的國力興盛成為東亞國家派人學習和漢化的主要對象？
