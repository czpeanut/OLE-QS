  group_stem: 'Make the World Better

    There’s a place in our heart,

    Which love stays inside

    Where love stays

    Just try to take a closer look,

    You will find it much brighter.


    There’s a place in our heart,

    Where there’s no more hurt or sorrow.

    Just try to take a careful look,

    You shall see it is even stronger.


    There are people struggling in life,

    Where there are louder cries.

    Let’s try to take more cares,

    And make a little space,

    For all the people in the world.


    There are people dying in the world,

    Full of tears.

    Let’s try to heal the wound,

    And make our world better,

    For you and for me.


    In my heart, you are all

    My brothers and sisters.

    Let’s create a world without fear.

    Let’s make the world better.

     sorrow 悲傷 struggling 掙扎 space 空間 wound 傷口'
