  group_stem: '民國6 年，孫中山以大元帥名義發布《段祺瑞偽政府亂國盜權罪之通令》，請閱讀以下資料，並根據史實回答問題：

    「大元帥令

    洪惟我中華民國之成立，實成立於南京臨時政府成立之日，而甲則為臨時政府成立之根據。循是以進，由臨時政府而成為正式政府，其重要關鍵則在由參議院而進於正式國會。……

    孰意往者袁世凱包藏禍心，既經本大元帥辭臨時大總統之職，而被選為繼任之人，乃敢蔑視立法機關，嗾使北京兵變，強參議院遷地以就之……雖號稱共和，而心實不承認人民為主權者無非自恃兵力，以為主權不難盜竊而得，卒敢叛國稱帝，而身竟不旋踵而滅。……

    自袁世凱死，黎大總統依法繼任後，甲、國會為段祺瑞所棄絕而不得恢復者。……段祺瑞自為國務總理以迄於免職之日，無往而非倒行逆施，終欲借外交問題以壓倒國民，而行其武力專制之計畫。

    我國民迫於救亡，因國會議員之被妨阻，不得已踵（跟隨）他國之成規，開國會非常會議於乙，組織軍政府。文不佞被舉為大元帥，自顧首建共和，忝從厥後，不忍視民國之夭亡，曾於就職之日宣布誓詞，此志諒已大白於全國，惟有以討滅姦兇自矢，無事多言。」

    （節錄自《宣布段祺瑞偽政府亂國盜權罪之通令》）'
