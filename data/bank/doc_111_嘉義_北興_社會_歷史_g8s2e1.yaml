  section: 1
  number: 8
  type: single
  page: 1
  stem: 民初軍閥割據局面的形成與下列何事最有關係？
  options:
  - label: A
    content: 辛亥革命爆發後，各地革命勢力因利益糾葛而分裂對立
  - label: B
    content: 清末君主立憲派與革命派政爭的延續擴大
  - label: C
    content: 袁世凱逝世後，其部屬與各地將領紛紛趁機擴張勢力
  - label: D
    content: 廣州軍政府成立與南京政府敵對，造成國內軍隊派系的對立。
  group_stem: '現代網路科技發達，不少人喜歡在網路上發表自己的看法，但因為對言論自由的過度解讀，以及忽略了真正的民主應該是要尊重與自己立場不同的觀點，因此網路上「論戰」的事時有所聞；這樣的情況並非現代獨有的現象，在民國初年，也曾有類似的事情發生過。

    民初軍閥割據時期，在每次戰爭開戰之前，各方軍人都要發動相當長一段時間的「電報戰」，以電報為戰場，以文字為砲彈，因此往往是先通電（發電報）罵對方是非，對方亦以牙還牙，通電駁斥。例如：民國11
    年第一次直奉戰爭於4 月底炮火相見之前，1 月起，雙方人馬就已發起電報戰，在言詞上互不相讓，長篇大論，刊登於當時報紙，一般人讀後，也難辨真偽，只能搖頭觀戰而已。請問：'
