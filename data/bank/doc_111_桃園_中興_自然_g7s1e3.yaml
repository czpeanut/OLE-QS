    合、影響成長。如果不希望孩子的青春期太早啟動，爸媽可注意 4 件事：\n1. 少吃精緻食物和速食：務必少碰油炸類、精緻甜食與速食，皆有可能會抑制生長激素的分泌，讓孩子長不高。\n\
    2. 預防孩子肥胖：體重過重的孩子容易有性早熟的表現，繼而影響發育。\n3. 別太早食用補品：像是雪蛤、鹿茸、蜂王漿（蜂王乳）這類含有女性荷爾蒙的食物，都可能干擾孩子的內分泌系統，\n\
    刺激生長板提早閉合。\n4. 避免接觸環境荷爾蒙：生活中如果太常接觸環境荷爾蒙，如塑化劑、介面活性劑、油漆或亮光漆等，也會導致孩子性\n早熟。而孩童容易接觸到的塑化劑多半來自飲食，像是以塑膠碗、塑膠袋盛裝熱食，或使用塑膠杯裝飲料等等，最好\n\
    可改用不鏽鋼或玻璃容器。\n長高 3 祕訣\n1. 運動：想要長高，不能不運動，但要做對運動才有幫助。一些彈跳性的運動如跳繩、打籃球、慢跑，能讓骨頭有\n\
    \     「垂直於地面」方向的衝擊力，有助於長高；而像是舉重、負重練習，反而會妨礙生長，在成長階段最好能避免。\n2. 睡眠：晚睡絕對是長高殺手，當孩子時常錯過晚上\
    \ 10 點到凌晨 2 點這段體內生長激素的高峰期，就會造成生長發育\n      的減慢。想要孩子長高，最好要求他們每天晚上 9 點前入睡，盡量不要熬夜。\n\
    3. 飲食：除了均衡飲食外，長高最重要的其實是蛋白質和鈣質，兩者都是骨骼與肌肉的重要原料，而富含蛋白質的食物\n像是牛奶、雞蛋、瘦肉、魚類、豆類等，都是不錯的選擇。\n\
    \                                                                            \
    \        - 節錄自Heho 健康網站"
