- id: doc_113_新北_江翠_國文_g8s1e2_s4_1
  section: 4
  number: 1
  type: single
  page: 4
  stem: 關於上文的敘述，下列何者正確？
  options:
  - label: A
    content: 作者認為圖書館的椅子有魔法，坐在不同的椅子上可以感受到不同的靈魂
  - label: B
    content: 作者看到一隻食字獸在圖書館四處遊逛啃書並樂此不疲
  - label: C
    content: 因為圖書館身處在自然環境中，所以，在館內要小心附近的誘蟲植物
  - label: D
    content: 作者認為「人和書很近也很遠」是因為身處圖書館中易受外在風景而分心忘書
  group_stem: '(一)

    一間會呼吸的圖書館，有著會讀書的椅子。隨著椅子的空間感，我感覺身體和書有了不同的距離，坐看立看臥看閒散看……，人和書很近也很遠。

    近的是，書隨意可得；遠的是，美麗的風景常讓我分心，因而忘書。

    臺北市圖北投分館，有著各種椅子，方形長形圓形、木椅皮椅石椅……，我總是在椅子與椅子間轉換我的靈魂，以攝取不同的知識。坐上不同的椅子，身體即有迥異的姿勢，而從姿態大約可嗅出我是在讀什麼樣的書了。

    我這隻食字獸，先是爬上二樓，扭開書架上的圓形小立燈，在語文類書籍上梭巡當代小說。站著翻翻，確定可帶走的書後，我走至長條木椅讀著，後方的整片挑高窗成了我的閱讀背景。

    讀累了小說，走至走廊，順勢就往木棧道座椅上一坐。書也不興著看，這走廊的綠樹參天，蝶影掠過眼皮下，溪流旁有蕨類、鐵樹、榕樹，再加上刻意植栽著許多誘鳥與誘蟲植物，我感覺這些誘鳥誘蟲植物是來引誘我的。四周如張綠網，網住了我心，身處此幽雅長廊，我常忘了我是來看書的。

    窗子都是推出去的，在層次前後的動線下，推開的窗戶有如波浪般延展而去。午後的陽光被裁切成幾何圖案，讀書人此時晒書也晒心。

    ……

    坐在矩形的木椅時，因木椅硬質關係，不自覺正襟危坐地看書，所以翻閱古文書籍時，我會坐到方形書桌區，兩兩相對的書桌，是圖書館典型的設計，扭開一盞燈，就可以安然啃書。我發現在這座圖書館，椅子的設計有其道理，也有其巧思，像是在矩形木椅上鏤刻著蝴蝶、獨角仙……，模樣很巧。

    看累了大部頭的書，這時嘗試「窩」在書架與書架中間的長條皮椅上，是此圖書館的一絕。

    窩著讀書，很慵懶，有如在自家般。首先當然還是要先挑好想讀的幾本書，然後呢，走到「窩書椅」區，整個身體拱靠座椅上，讀累了，閉上眼睛小憩也沒有人會趕你。

    至於坐到圓形的椅子，就是來到兒童區了。這區域用的全是白色的，和一、二樓的木質沉穩氣氛迥異，這間圖書館是樓層愈高顏色愈重，光線愈沉，和藏書分類約是有關，較難讀的大都擺在高樓層（我看見自己的長篇小說也擺在此區），期刊書和一些大眾書有的就擺在光線亮而木頭色輕的一樓。最討喜的兒童閱讀區在地下室，擺設的是圓環形皮椅，讓小小愛書人在翻書之餘，也可爬可玩。(鍾文音我在圖書館的一天)'
  tags:
