  stem: 請問以下選項中，何者與「來就生為夫婦」的「生」字同義？
  options:
  - label: A
    content: 為夫妻，「生」一兒，已二歲
  - label: B
    content: 盜照視之，其腰以上「生」肉
  - label: C
    content: 我垂「生」矣，何不能忍一歲而竟相照也
  - label: D
    content: 「生」辭謝，涕泣不可復止
  group_stem: '(二)

    談生者，年四十，無婦。夜半，有女子年可十五六，姿顏服飾，天下無雙，來就生為夫婦。曰：「我與人不同，勿以火照我也。三年之後，方可照。」為夫妻，生一兒，已二歲。不能忍，夜伺其寢後，盜①照視之，其腰以上生肉，如人，腰以下但有枯骨。婦覺，遂言曰：「君負我！我垂②生矣，何不能忍一歲而竟相照也？」生辭謝③，涕泣不可復止。云：「與君雖大義永離，然顧念我兒，若貧不能自偕活者，暫隨我去，方遺④君物。」生隨之去。入華堂，室宇器物不凡。以一珠袍與之，曰：「可以自給。」裂取生衣裾⑤，留之而去。

    (節錄自干寶搜神記•漢談生)

    【注釋】①盜：偷偷的。 ② 垂：將要。 ③辭謝：道歉。 ④遺：音ㄨㄟˋ，送。 ⑤裾：音ㄐㄩ，衣服後襟。'
