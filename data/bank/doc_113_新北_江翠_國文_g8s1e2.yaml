  stem: 根據上述圖文，下列說明何者正確？
  options:
  - label: A
    content: 運動後口乾舌燥下，應立即痛快暢飲1000cc 的冰水以緩解暑熱
  - label: B
    content: 當出現呼吸急促、意識不清的症狀時，可以按風池穴使人意識清醒
  - label: C
    content: 平時多按手腕橫紋中點上的大椎穴，在炎熱的夏日裡可預防中暑
  - label: D
    content: 在炎熱的夏季裡，頻繁進出冷氣房與室外的人可能會導致中暑情形發生
  group_stem: '(三)

    天氣進入典型夏季氣候，除了高溫外，午後更顯悶熱，這樣的天氣特別容易中暑要多加留意。在中醫觀點中，中暑分為「陰暑」和「陽暑」。

    一、陰暑

    (1)定義：因為長時間吹冷氣，或是吃太多冰品，造成皮膚表面毛細孔、微血管急速收縮。感覺體內有熱氣卻流不出汗，整個人就像在蒸籠內一樣持續悶燒。

    (2)症狀：身體微微地發熱但無汗、會有疲倦、頭痛、噁心等類似感冒症狀。常出現在頻繁進出冷氣房與室外的上班族，或是運動完直接喝下冰涼水的人身上。

    二、陽暑

    (1)定義：即是一般人熟知的中暑，通常發生在長期間照射太陽，暑熱內侵造成。

    (2)症狀：身體發熱、頭暈、頭痛、四肢倦怠、口渴等症狀，嚴重會出現呼吸急促、意識不清等「熱衰竭」狀況。(節選自艾蜜利Hero 健康網)'
