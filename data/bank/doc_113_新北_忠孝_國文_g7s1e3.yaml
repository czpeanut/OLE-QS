- id: doc_113_新北_忠孝_國文_g7s1e3_s2_35
  section: 2
  number: 35
  type: single
  page: 4
  stem: '新詩是用意象來演出的，藉某些外觀形式，營造意象所欲表達的情思或趣味的「氛圍」。關於瓊瑤〈當雪花飄落〉一詩的象徵手法，何者說明最不適切？


    當雪花開始紛紛飄落／我心裡輕輕的唱著歌／終於等到了這一天／生命裡的雪季沒錯過

    這趟旅程走來辛苦顛簸／且喜也有各種精彩唱和／經過了山路的崎嶇不平／挨過了水路的駭浪風波／留下了……留下了……／我那些字字句句的著作／是我今生為愛燃燒的熱火

    誰在雪地插了鮮花一朵／陽光映著玫瑰如此鮮活／正像我心中的雪與火／無論是好是壞是對是錯／那個我……那個我……／始終追尋著日出與日落／相信人間有愛 初心如昨

    這是我最後的選擇／時間已到 生命不會更好／不拖累所愛 也超越病魔／我心翩然自如奔放快樂／當此刻……當此刻……／有如雪花與火花同時綻放／我將飛向可以起舞的星河

    （瓊瑤〈當雪花飄落〉）'
  options:
  - label: A
    content: 「山路」、「水路」象徵人生的困頓，再困難也要克服
  - label: B
