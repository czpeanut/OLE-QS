  type: single
  page: 5
  stem: 關於甲、乙二文的敘述，何者說明正確？
  options:
  - label: A
    content: 甲文「夸父與日逐走，入日」此句話表現出夸父具有與自然抗爭的勇氣
  - label: B
    content: 甲文「棄其杖，化為鄧林」此句說明「慎終如始，則無敗事」
  - label: C
    content: 乙文「夸父誕宏志，乃與日競走」可見陶淵明認為其不自量力，荒謬至極之心態
  - label: D
    content: 乙文「俱至虞淵下，似若無勝負」此句說明夸父對抗自然，自取滅亡
  group_stem: '甲、

    夸父與日逐走，入日。渴，欲得飲，飲於河、渭，河、渭不足，北飲大澤。未至，道渴而死。棄其杖，化為鄧林。

    （《山海經》）


    乙、

    夸父誕宏志，乃與日競走。

    俱至虞淵下，似若無勝負。

    神力既殊妙，傾河焉足有？

    餘跡寄鄧林，功竟在身後。

    此詩為〈讀山海經〉第九首。陶淵明所看重的是夸父追日的志氣。這種志向不是常人所能擁有的，不論夸父是有所為而為之，還是明知不可為而為之，努力追求理想的他，終究是失敗了。詩人在此寓意夸父的志氣終將流傳千古，引導後代的有志之士，勇敢地朝他們的理想奔去。

    （陶淵明《讀山海經》）

    注：虞淵：即禹淵、禹谷，傳說中的日落之處。

    　　殊妙：特殊奇妙。'
