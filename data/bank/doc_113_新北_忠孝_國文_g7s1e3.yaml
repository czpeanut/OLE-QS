  stem: 根據本文，下列文句省略的主語，何者配對錯誤？
  options:
  - label: A
    content: 生而穎慧，學語時，授《琵琶行》：陳芸
  - label: B
    content: 於書簏中得《琵琶行》，挨字而認：陳芸
  - label: C
    content: 告母曰：「若為兒擇婦，非淑姊不娶。」：沈復
  - label: D
    content: 即脫金約指締姻焉：沈復
  group_stem: '余幼聘金沙于氏，八齡而夭。娶陳氏。陳名芸，字淑珍，舅氏心餘先生女也。生而穎慧，學語時，口授《琵琶行》，即能成誦。四齡失怙，母金氏，弟克昌，家徒壁立。芸既長，嫻女紅，三口仰其十指供給，克昌從師，修脯無缺。一日，於書簏中得《琵琶行》，挨字而認，始識字。刺繡之暇，漸通吟詠，有「秋侵人影瘦，霜染菊花肥」之句。餘年一十三，隨母歸甯，兩小無嫌，得見所作，雖嘆其才思雋秀，竊恐其福澤不深，然心注不能釋，告母曰：「若為兒擇婦，非淑姊不娶。」母亦愛其柔和，即脫金約指締姻焉。此乾隆乙未七月十六日也。

    （沈復《浮生六記．閨房記樂》）

    注：夭：夭折，短命、早死。

    　　失怙：喪父。

    　　嫻：嫻熟，技巧熟練。

    　　女紅：女子所做針線、紡織、刺繡、縫紉等工作。

    　　修脯：乾肉。用以代稱教師的薪金。

    　　書簏：書箱。

    　　歸甯：一般指女子出嫁後，回娘家向父母請安。'
