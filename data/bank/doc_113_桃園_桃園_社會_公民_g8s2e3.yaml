- id: doc_113_桃園_桃園_社會_公民_g8s2e3_s1_41
  section: 1
  number: 41
  type: single
  page: 2
  stem: '花蓮縣一名大學生，2019 年就讀高中時，因三度未參加朝會升旗或集會，被記了三次警告，向校方申訴遭駁回，教育部也不受理其「甲」，因而改提出「乙」。花蓮法院法官認為，學校的懲處恐影響德育成績，損及受教權，更有侵害人格權之虞，因此依大法官第784
    號的解釋，判決學生提出「甲」有理，教育部敗訴。而大法官第784 號解釋文提到「基於《憲法》第16 條：『人民有請願、訴願及訴訟之權』規定，各級學校學生認為權利因學校的教育或管理措施而受到侵害時，即使非屬退學或類此處分，也可依法提起行政爭訟程序以為救濟」。

    上文中的「甲」、「乙」依序應為下列何者？'
  options:
  - label: A
    content: 請願、訴願
  - label: B
    content: 行政訴訟、訴願
  - label: C
    content: 請願、行政訴訟
  - label: D
    content: 訴願、行政訴訟
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 公民
      code: 5-3
      title: 行政救濟的方法
