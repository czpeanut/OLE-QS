- id: doc_113_高雄_七賢_社會_g9s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 小新到西班牙遊玩時，聽到導遊介紹了西班牙南部有種很特別的建築風格稱作「摩爾式」建築，以不加裝飾的拱頂、簡單的圓拱馬蹄型或是蜂窩狀裝飾為其特色。導遊進一步說明，八世紀時北非的摩爾人，到達伊比利半島後擊敗了基督教信徒，展開了長達七、八百年的統治，所以摩爾式建築其實是融合了基督教和『某』宗教的建築風格。請問：根據上文，『某』宗教最可能是指？
  options:
  - label: A
    content: 猶太教
  - label: B
    content: 希臘正教
  - label: C
    content: 伊斯蘭教
  - label: D
    content: 佛教。
