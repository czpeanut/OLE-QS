  section: 2
  number: 36
  type: single
  page: 5
  stem: 根據文意，下列何者最符合「處順不狂，處逆不慌」的心境？
  options:
  - label: A
    content: 人生得意須盡歡
  - label: B
    content: 與爾同銷萬古愁
  - label: C
    content: 山頭斜照卻相迎
  - label: D
    content: 也無風雨也無晴
  group_stem: '(四)【甲】

    君不見黃河之水天上來，奔流到海不復回。

    君不見高堂明鏡悲白髮，朝如青絲暮成雪。

    人生得意須盡歡，莫使金樽空對月。

    天生我才必有用，千金散盡還復來。

    烹羊宰牛且為樂，會須一飲三百杯。

    岑夫子、丹丘生，將進酒，杯莫停。

    與君歌一曲，請君為我傾耳聽。

    鐘鼓饌玉不足貴，但願長醉不願醒。

    古來聖賢皆寂寞，唯有飲者留其名。

    陳王昔時宴平樂，斗酒十千恣歡謔。

    主人何為言少錢，徑須沽取對君酌。

    五花馬，千金裘，

    呼兒將出換美酒，與爾同銷萬古愁。

    ——李白〈將進酒〉


    【乙】

    莫聽穿林打葉聲，何妨吟嘯且徐行。竹杖芒鞋輕勝馬，誰怕？一簑煙雨任平生。 料峭春風吹酒醒，微冷，山頭斜照卻相迎。回首向來蕭瑟處，歸去，也無風雨也無晴。

    ——蘇軾〈定風波〉'
