    時至今日，乃有操觚之徒，假新聞雜誌為機關，不知其使命為何若，惟日以粉飾昇平、藻繪外觀為能事，甚有行為齟齬，舞文弄墨，藉新聞雜誌為護身符，以攻訐人身，招人物議，至今今日為御用新聞、爛糟雜誌者，噫！若是者，是不特隕墮新聞雜誌之權威，且以迷惑文明社會之視聽。(張達修〈新聞雜誌為文明利器社會木鐸說〉)

    注釋：操觚：執筆作文。觚，音ㄍㄨ，木簡，古人在木簡上寫字。


    【乙】

    「教宗方濟各支持川普選美國總統！」這則不是出自《紐約時報》或美國有線電視新聞網(CNN)的網路頭條新聞，可能來自一群青少年架設的網站，假新聞是點閱誘餌，藉此獲得廣告利益。在臉書，前
    20 名假新聞的點閱數比前 20 名真新聞還多。大量流竄的假新聞甚至成為政黨惡鬥工具。

    假新聞難道無法過濾？臉書表示:「要確認『真相』有難度。有些惡搞訊息很容易拆穿；但很多訊息是內容大致正確，卻在細節上出錯或省略；而更多訊息是個人基於事實的談論，卻遭意見相反的讀者檢舉為造假。」此外，有些專欄作家的文章意在諷刺，卻被缺乏幽默感的讀者當成事實社在網路瘋傳。

    Google 和臉書現在都已謝絕跟假新聞網站有關的廣告，臉書也考慮在被檢舉的文章加註標示。但有人又擔心，像 Google 新聞彙集成專屬網頁的做法，將使我們只會看到自己關心的新聞，而無法像翻報紙般接觸一些無意間獲得的消息。臉書的問題則糟糕一千倍。在社群媒體上，你可以決定想看誰的貼文，他們是你臉書的朋友，是你在推特上追蹤的人。換句話說，你不是選擇閱讀主題，而是選擇看新聞的角度——你正在建造自己的「同溫層」。這也正說明「讓社群決定」根本
    無法過濾假新聞，因為同溫層所檢舉的假新聞，可能是同溫層以外的人所認定的人認定事實。(改寫自 鍾樹人譯〈如何消滅網路假新聞〉)'
