  section: 2
  number: 33
  type: single
  page: 4
  stem: 本詩中所指稱的對象，下列何者配對錯誤？
  options:
  - label: A
    content: 亦翠亦白，「你」已不再:翠玉白菜
  - label: B
    content: 那巧匠接「你」出來:翠玉白菜
  - label: C
    content: 卻「自己」將精魂耿耿:玉匠
  - label: D
    content: 或許，「他」就是玉匠轉胎:翠玉白菜
  group_stem: '(三)

    前身是緬甸或雲南的頑石 / 被怎樣敏感的巧腕 /

    用怎樣深刻的雕刀 / 一刀刀，挑筋剔骨

    從輝石玉礦的牢裡 / 解救了出來，被瑾妃的纖指 /

    愛撫得更加細膩，被觀眾

    艷羨的眼神，燈下聚焦 / 一代又一代，愈寵愈亮 /

    通體流暢，含蓄著內斂的光

    亦翠亦白，你已不再 / 僅僅是一塊玉，一棵菜

    只為當日，那巧匠接你出來 / 卻自己將精魂耿耿 /

    投生在玉胚的深處 / 不讓時光緊迫的追捕

    凡藝術莫非是弄假成真 / 弄假成真，比真的更真

    否則那栩栩的螽斯，為何 / 至今還執迷不醒，還抱著 /

    猶翠的新鮮，不肯下來

    或許，他就是玉匠轉胎

    (余光中 翠玉白菜)'
