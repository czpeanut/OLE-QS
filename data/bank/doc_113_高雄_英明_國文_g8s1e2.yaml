  section: 5
  number: 1
  type: single
  page: 4
  stem: 首段作者所說的「卻別有所感」，指的是什麼？
  options:
  - label: A
    content: 群生荷抗風的能力，非單株所可比擬
  - label: B
    content: 群生荷壯觀的綠浪，令單株望塵莫及
  - label: C
    content: 荷雖予人正直形象，卻有搖擺的一面
  - label: D
    content: 荷之單株與群生皆有可觀，各擅勝場
  group_stem: '(一)

    蓮，中國古人已樹立了很好的風操，周敦頤賞荷悟出了通達的哲理；曹植愛蓮則為荷花立傳作賦，情切意真。農曆六月二十四日為荷花生日，余往紫竹院公園賞荷，卻別有所感。

    從東門進園，北行數百步，一橋相隔的荷地映入眼簾。「接天蓮葉無窮碧，映日荷花別樣紅」的壯麗景色，平展而出，一縷縷荷香隨之撲鼻而來，愈走近池岸，清香愈加沁人心脾。定睛看那密密層層的荷葉，恰似一個個碧綠的「承露盤」。每張荷葉上都承托著大大小小的、滾動著的晶瑩水珠。荷葉叢中，盛開著紅若塗朱、潔如素玉的荷花，楚楚動人，極富魅力。

    過蓮橋，行至荷花渡南岸，突然，一陣疾風大作，只見滿池荷葉，忽而由東向西搖擺，忽而又由西向東搖擺，一柄柄蓮莖上的碧葉被捲成滾滾綠浪。它們互不撞擊，互不擠軋，更不彼此躲藏，層次分明，順乎自然，疾風愈烈，也只是循聲而動，絕無亂擺亂間的。群生蓮之如是勁健，貴在於單株素質之勻稱，無高低參差之不齊故也。

    疾風一過，蓮池復歸平靜，滿池如珠如玉的荷花亭亭玉立，更美更清新。蓮池群生之荷，竟無一疏落，無一折莖，無一不顯得雄勁。視之，嘖嘖稱讚：群生荷其抗禦疾風之力，非單株所能有者，若離群而立，倖存者幾許呢？頤公未見及此，故伊「獨愛蓮之出淤泥而不染，濯清漣而不妖」之世俗高潔，而忽略群體賴以生存之潛力，故余以所見所感，特寫此文以抒胸臆。
    （周沙塵 愛蓮新說）'
