  section: 4
  number: 6
  type: single
  page: 2
  stem: 「每次聞到金銀花特殊的香味，或瞧到它悅目的小花，都會想起那苦中帶甘的童年，那花香總是引來我們這些村童對冰棒無限的遐思。」徐仁修在文章中特別提到童年回憶，他的寫作用意是什麼？
  options:
  - label: A
    content: 金銀花的香氣讓作者想起童年沒有錢買冰棒的苦澀回憶
  - label: B
    content: 金銀花的香氣讓作者想起童年時和朋友一同享用冰棒的愉悅
  - label: C
    content: 童年時摘金銀花換取零用錢買冰，花香讓作者聯想到童年的經驗
  - label: D
    content: 金銀花晶瑩剔透的美麗就像童年的冰棒一樣，總是令人喜愛
