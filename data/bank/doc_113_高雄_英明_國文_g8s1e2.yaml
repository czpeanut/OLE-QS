- id: doc_113_高雄_英明_國文_g8s1e2_s5_6
  section: 5
  number: 6
  type: single
  page: 5
  stem: 「修竹千竿」的「修」字意思為何？
  options:
  - label: A
    content: 整理
  - label: B
    content: 種植
  - label: C
    content: 茂美
  - label: D
    content: 長長的
  group_stem: '(三)

    筍長成之後便是竹，它是天生合群，修竹千竿，一樣的碧綠，一樣的粗細，一樣的筆直，表現了整體的美。

    人們對於筍和竹有特別的偏愛，這是有道理的。竹的外表修長，筍的外型俊俏。竹頂天立地，清風亮節；筍質清味美，不論葷食素食，無不佳妙。

    文人雅士一向以竹比君子，以今天的眼光看，它的合群性、整體美，更值得現代人讚賞。筍無菜不可用，而且有了它的配合更為出色，也是對人處世的最好啟示。 （鄭勝竹 筍與竹）'
