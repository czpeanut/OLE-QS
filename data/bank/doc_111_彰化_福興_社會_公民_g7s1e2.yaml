- id: doc_111_彰化_福興_社會_公民_g7s1e2_s1_24
  section: 1
  number: 24
  type: single
  page: 3
  stem: 文中提到的『流沙中年』跟以下何者的描述特徵最為相似？
  options:
  - label: A
    content: 出生於1970~1980前段的人們，指擁有美麗外表卻經不起碰撞，一撞就爛，抗壓性低的『草莓族世代』
  - label: B
    content: 對於既要照顧子女，又要照顧年老父母的中年世代，社會學家特別稱之為『三明治世代』
  - label: C
    content: 出生於1980後段~1990前段的人們，形容缺乏耐心、喜歡追求刺激與新鮮、一遇到不如意之事容易就此坍塌、放棄。像水蜜桃無法受重擊一樣的『水蜜桃族世代』
  - label: D
    content: 出生於1960年代的人們，指固執且不懂變通、容易先入為主的『芭樂族世代』
  group_stem: '※『……2015年日本社會學者藤田孝典曾在著作中提出「下流老人」一詞，指稱日本社會將出現大量過著中下階層生活的老年人，然而近年來人們也將注意力放到不同世代身上，「流沙中年」一詞便引起各界關注，流沙中年一詞，指的是40-59歲之間的中年人，為了照顧家中年老退化的老人而讓收入無法維持，卻又得照顧啾啾待哺的小孩，使得這群人們的生活不論在經濟上或心理上，都如同陷入流沙渦漩中載浮載沉，身陷其中卻無法掙脫，只能在貧窮線附近掙扎。這群人身為家中的支柱與主要照顧者，可能被迫離職，或是不斷透支健康與金錢，等到盡完照顧責任想重回職場，卻已難如登天。

    根據行政院衛生福利部公布數據，我國老人人口於82年9月達149萬人，占總人口比率超過7%，成為高齡化社會；再於107年3月有331萬2,024人，超過14%，成為高齡社會；到110年底成長為393萬9,033人。另外依據國家發展委員會推估，至114年老人人口將超過總人口20%，成為超高齡社會。因此老年照顧問題如果沒有獲得完善的解決，就會形成更多的流沙中年，「老老照顧」現象更可能是頻繁出現，下流老人的現象也將激增。因此立法院就在民國104年5月15日三讀通過《長期照顧服務法》，並在民國106年6月3日正式上路，避免「一人倒，全家倒」的狀況頻繁發生。而台灣長照協會也時常呼籲政府，除了各項年金與老年福利政策，面對老年照顧問題，也應借鏡歐美先進國家的經驗來積極地籌措各種方法，或者提出政策上的支持。』請問：'
