- id: doc_113_台中_居仁_社會_公民_g9s2e1_s2_27
  section: 2
  number: 27
  type: single
  page: 3
  stem: 由上文可知，目前各國政府對電動車補助的多寡，直接影響民眾對電動車的購買意願。請問這現象反映了經濟學的何種概念？
  options:
  - label: A
    content: 供給法則
  - label: B
    content: 需求法則
  - label: C
    content: 通貨膨脹
  - label: D
    content: 非金錢誘因。
  group_stem: "【四】\n    儘管電動車的市佔率在全球都有逐步提升的趨勢，但去年12 月歐洲以德國為首，取消電動車相關補助，該國的銷量急遽減少，畢竟相同定位的車款，電動車硬是比燃油車貴上一截，爾後歐洲其他國家也都開始跟進，而這政策明顯削弱電動車的市場表現。\n\
    \    不過根據歐盟的碳排放新規，從2025 年開始，新車的平均碳排放量不得超過93.6 克/公里，亦即車廠至少20%的銷量必須來自電動車，否則業者將面臨高額罰款。然而衡量目前歐洲在電動車市場的競爭力明顯落後，例如來自中國的強勁對手，憑藉中國政府大力的補貼國內電動車的車廠業者，以及直接在歐洲設立分工廠等手段，中國車廠如今能以更低的成本生產出價格實惠、續航力強的電動車，迅速搶進歐洲市場，讓歐爭當地的品牌壓力倍增；再加上美國近來可能對歐洲進口車加徵關稅，歐洲車廠的處境可說是內外交迫，因此歐盟決定將此政策延緩兩年，即2027\
    \ 年以前不會對不符合新規的車廠開罰。\n    然而歐盟此舉立即引發環保團體強烈反彈，批評這項政策等同於獎勵未積極投入減排的企業，將放慢歐洲汽車產業的綠能轉型與推進環保理念的速度。"
