  stem: 根據文中內容推斷，台中市中區自由路二段上的太陽餅店最有可能呈現下列何種現象？
  options:
  - label: A
    content: 店家更有能力控制糕餅的價格
  - label: B
    content: 各家糕餅的品質可能較差
  - label: C
    content: 糕餅業者進入市場的門檻較高
  - label: D
    content: 消費者有更多比較商品的機會。
  group_stem: "【一】\n    台中市中區自由路二段是知名的「太陽餅街」，7、8 家太陽餅店聚集，其中不少店家都以「太陽堂」的名稱來命名，例如新太陽堂餅店、太陽堂老舖、阿明師老店太陽堂等。新太陽堂餅店總經理指出，1954\
    \ 年位在自由路二段23 號的「太陽堂」生意相當好，不少糕餅業者跟進製作銷售，加上60、70 年代火車站附近是精華鬧區，太陽餅業者自然群聚在這裡，並多以此名稱來命名。\n\
    \     此外台灣大道上更有一間「太陽餅博物館」，建築本身是走過百年的珍貴歷史古蹟，店內不僅賣餅，也提供可讓民眾觀看的製餅窗口，增加消費者的信任感，以及擺設輕食咖啡區，讓參觀的民眾可以稍作片刻休憩，『同時提供太陽餅文物展示，紀錄太陽餅的發展歷史並延續製餅的文化習俗』。"
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 公民
      code: 2-1
      title: 全球化的影響
      chapter: 第2章 全球化的影響與挑戰
