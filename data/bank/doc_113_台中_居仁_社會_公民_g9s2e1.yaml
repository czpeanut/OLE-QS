    \     此外，數位憑證皮夾的優點是將賦予民眾對自身證件資料的控制權，可透過「選擇性揭露」機制強化對個人資料的保護。以超商取貨為例，民眾可以選擇揭露「姓名」資料即可，不用像出示實體身分證一樣，過度揭露證件上的資訊，也能完成取貨。\n\
    \    其實國際上加拿大、美國、歐盟等相繼發展數位身分(皮夾)服務。『以歐盟為例，今年已通過新法規，歐盟要求所有會員國在相同的規範標準下，需在2026 年提供免費的數位皮夾，無論是國家或廠商開發數位皮夾，目標為歐盟公民都可以獲得這項免費的公共服務。』"
