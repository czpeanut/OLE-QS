    content: 智慧財產權的保障
  - label: C
    content: 著作權的共享
  - label: D
    content: 科技倫理的挑戰。
  group_stem: "【三】\n    數位發展部於今年3 月宣布「數位憑證皮夾」雛形，力拼年底推出測試版App。數發部強調，數位憑證皮夾不是支付工具，也不是數位身分證，數發部不會發放任何新證件在數位皮夾裡，是讓民眾自主存放自己的數位證件，例如自然人憑證、健保卡、駕照等等，未來民眾只需要攜帶手機出門，就可透過手機快速查驗各類證件，簡化取票或辦理電信門號的程序。\n\
    \     此外，數位憑證皮夾的優點是將賦予民眾對自身證件資料的控制權，可透過「選擇性揭露」機制強化對個人資料的保護。以超商取貨為例，民眾可以選擇揭露「姓名」資料即可，不用像出示實體身分證一樣，過度揭露證件上的資訊，也能完成取貨。\n\
    \    其實國際上加拿大、美國、歐盟等相繼發展數位身分(皮夾)服務。『以歐盟為例，今年已通過新法規，歐盟要求所有會員國在相同的規範標準下，需在2026 年提供免費的數位皮夾，無論是國家或廠商開發數位皮夾，目標為歐盟公民都可以獲得這項免費的公共服務。』"
