- id: doc_113_台中_居仁_社會_公民_g9s2e1_s2_16
  section: 2
  number: 16
  type: single
  page: 2
  stem: 長期以來，多數店家都能以「太陽堂」的名號來經營，由此判斷下列敘述的原因何者最正確？
  options:
  - label: A
    content: 因為「太陽堂」已到著作權的期限
  - label: B
    content: 未有特定店家擁有「太陽堂」的商標權
  - label: C
    content: 未有特定店家向政府申請「太陽堂」的專利權
