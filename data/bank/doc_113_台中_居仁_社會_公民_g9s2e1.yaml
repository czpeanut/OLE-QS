  section: 2
  number: 32
  type: single
  page: 4
  stem: '美國國內對鋼鋁原料的供需關係，與生產鋼鋁的機會成本狀況如右表所示。根據文中美國在鋼鋁市場上的貿易現況來判斷，對應右表，美國的鋼鋁原料生產最有可能是在哪個位置？


    | 鋼鋁原料 | 國內需求量較大 | 國內供給量較大 |

    | :--- | :---: | :---: |

    | 機會成本較高 | 甲 | 丙 |

    | 機會成本較低 | 乙 | 丁 |'
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
  group_stem: "【五】\n    美國川普政府3 月對進口鋼鐵和鋁產品加徵高達25%的關稅後，引發貿易夥伴反彈，報復行動迅速展開。美國製造業所需的鋼鋁原料約有半數都依賴進口。加拿大是美國最大的鋼供應國，其次是巴西和歐盟。\n\
    \    因此歐盟與加拿大在同一天相繼宣布針對美國採取報復性關稅。歐盟委員會宣布，將對總額相當於260億歐元(約283.3 億美元)的美國進口商品徵收報復性關稅，有分析師表示，美國的加州杏仁、田納西威士忌將成為最大輸家，因為歐盟是這些產品的最大買家。此次歐盟報復性關稅的目標是「對美國很重要，但對歐盟來說成本不太高的領域」。\n\
    \    有關美國對加拿大部分鋼鋁產品徵收進口關稅一事，加拿大已要求與美國進行世貿組織(WTO)爭端協商。兩國正式於日內瓦的世貿組織展開爭端解決程序。希望藉此可令兩國找到皆滿意的解決方案，無須進訴訟。\n\
    \    其實川普此舉關稅政策，在於保護美國衰退中的鋼鐵業，不過後續引爆的貿易戰所增加的代價，最終很有可能轉嫁給業者與消費者，而加劇全球通貨膨脹的壓力，對美國企業乃至全球經濟都將帶來重大衝擊。"
