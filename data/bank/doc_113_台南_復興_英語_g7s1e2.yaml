  group_stem: 'Now don''t stand on the road and wave your hand. You can use our new
    taxi app, CarCarIn, on your smartphone. CarCarIn is really easy. You can get a
    taxi easily.

    Let me show you how. Step one, download CarCarIn on your phone and open it. Step
    two, type your destination. The app can find you with your phone''s GPS. You can
    choose taxi drivers near you and how many minutes you need to wait. You can also
    know how much money your ride is before you say "yes."

    You can watch your taxi on a map. You can see the driver''s name and photo. You
    can see the car type and color, too. CarCarIn is a safe way to get a taxi.

    Paying is easy, too. You can pay with your phone. After your ride, you can give
    your driver stars (like 1 to 5 stars) and write your thoughts. Don''t wait. Download
    our easy and safe CarCarIn now.


    📖 wave 揮舞 📖 destination 目的地 📖 minute 分鐘 📖 thought 想法'
