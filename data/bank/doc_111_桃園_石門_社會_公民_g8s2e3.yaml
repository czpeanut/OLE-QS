  stem: '許多民眾不解，為什麼搭捷運不能吃東西？難道真的只為了維持站內整潔嗎？沒想到正確解答竟然不是，而是為了安全問題，因為捷運使用大量的自動化設備，若食物碎屑引來蟑螂老鼠，恐干擾設備運作，不但破壞系統的高度穩定，還會造成安全問題，必須禁止飲食。因此根據大眾捷運法第50
