  group_stem: 'Amazon Rainforest on Fire

    Jack : What did you do after dinner?

    Meg: I watched the news on TV.

    Jack : Was there any special news?

    Meg: Yes. Unpleasant news. There are many big fires in the Amazon rainforest.
    It’s the third week. Animals there don’t have safe places to live in, and many
    died in those fires.

    Jack : So sad! Is it the first time?

    Meg: No. The rainforest has fires every year, from July to November. But it’s
    different this year. Some people burned the rainforest for crops and cows. They
    are building oil factories.

    Jack : How can we help the Amazon rainforest?

    Meg: We can tell our family and friends about the news. Some groups are saving
    the Amazon rainforest. We can join the groups and do something! We can also give
    money to them.

    Jack : That’s a good idea. Thank you for telling me.

    Meg: Let’s save the Amazon rainforest together!

    📖 news 新聞 crop 農作物 cow 母牛 mean 意指 tell 告訴 group 團體 idea 主意'
