  stem: What does the word “wobble” mean?
  options:
  - label: A
    content: Shake hands.
  - label: B
    content: Sign names.
  - label: C
    content: Shake heads.
  - label: D
    content: Visit sights.
  group_stem: 'Alice: Hello! Ben!

    Ben: Hello! Wow, long time no see!

    Alice: Yes, that is because I traveled to India and just came back last weekend.

    Ben: Wow, is India a good place to visit?

    Alice: Sure. I couldn’t wait to see many beautiful sights, and we did lots of
    great things. But I still had some trouble talking with them.

    Ben: Why?

    Alice: They wobbled all the time. When I talked to them, they shook their heads
    or nodded their heads in a special way. Sometimes I didn’t understand them.

    Ben: Wow! How unique!

    Alice: One of my Indian friends told me I had to check the angles and the directions.
    When they shake their heads from left to right slowly but certainly, they mean
    “No.” When they shake their heads up and down or from left to right at a small
    angle, they mean, “Yes.” or “I know.” When they move their heads diagonally, that
    is “I am not sure.”

    Ben: Wow, it is confusing!

    Alice: You can say that again. I can’t wrap my head around it. But India is a
    nice place to visit. I want to go there again next summer.


    📖 nod 點頭 all the time 一直 unique 獨特的 understand 理解 Indian 印度的 had to 必須(have to
    的過去式) angle 角度 direction 方向 left/right 左/右 slowly 慢地 certainly 肯定地 diagonally
    斜向地 confusing 令人困惑地'
