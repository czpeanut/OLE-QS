  stem: 'Which order of the story is correct?   📖 order 順序


    a. The old man and his wife took a room from a young clerk.

    b. The young clerk went to New York on a plane.

    c. The old man and his wife traveled in the mountains and needed a room.

    d. The young clerk work as a manager in a Hilton hotel later.

    e. The clerk slept at the front desk.'
  options:
  - label: A
    content: a→c→e→b→d.
  - label: B
    content: a→b→c→d→e.
  - label: C
    content: c→a→e→b→d.
  - label: D
    content: c→e→a→b→d.
  group_stem: 'An old man and his wife traveled to a nice place in the mountains one
    evening. They needed a room for the night, but almost all the hotels were full.
    They came to the last hotel, and a young clerk at the front desk helped them.
    He got a room for them. He said,” This room may not be big enough for you two,
    and it isn’t very nice. But you guys can rest for the night.” The old man and
    his wife took the room because it was the last one around. The next day, they
    went to thank the young clerk, “We had a good night’s sleep. Thank you so much.
    How much is the room?” The clerk said, “The room is free because it’s my room.”
    The clerk slept at the front desk all night that night.

    The man and his wife thanked the clerk again, and then they went on their trip.
    Two weeks later, the clerk got a plane ticket from the old man and his wife with
    a note, “Please come visit us in New York.” So the young clerk followed the note
    and came to a beautiful large hotel in New York City. The old man and his wife
    were Mr. and Mrs. Hilton; they waited for him at the front. “You’re a great young
    man. Please come work for us as a manager in our Hilton Hotel,” they said. There
    are over 3,600 Hilton Hotels around the world, and this is a story about a young
    manager in one Hilton Hotel.


    📖 ticket 票 note 紙條 as 做為 manager 經理'
