  group_stem: 'As the saying goes, “When in Rome, do as the Romans do.” We travel
    to other countries and then we try to do or eat something like people there. Here
    are some dos and don’ts about these countries.


    | Japan | China | India |

    | --- | --- | --- |

    | When you are eating ramen (Japanese noodles), you can make a loud noise. | Don’t
    put your chopsticks vertically in your bowl. That means food for dead people.
    | Use your clean right hand to eat and your left hand when going to the bathroom.
    |


    | Italy | Brazil |

    | --- | --- |

    | Italy is a country for pizza lovers. Don’t ask for more cheese on your pizza.
    Italian cooks need you to respect them and their food. | Never touch your food
    with your hands even with French fries. You have to eat pizzas and hamburgers
    with a fork and a knife. |


    📖 saying 諺語 Rome 羅馬 Romans 羅馬人 country 國家 noise 聲響 vertically 直立地 respect 尊重'
