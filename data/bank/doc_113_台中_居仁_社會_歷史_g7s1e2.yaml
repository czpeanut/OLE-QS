  stem: '沈葆楨與劉銘傳皆是推動臺灣現代化的重要官員，請問：關於兩位在臺灣的治理，正確的有幾項？

    ❶劉銘傳時期，臺灣在甲、乙、己、戊皆有架設電報線。

    ❷輪船航行於臺灣、中國與日本之間，是在劉銘傳時期。

    ❸沈葆楨時期，廢除開山撫番與渡台禁令。

    ❹劉銘傳加強對東部地區的管理，設置臺東直隸州。

    ❺購置輪船與設立郵局，是沈葆楨治理臺灣時的建設。'
