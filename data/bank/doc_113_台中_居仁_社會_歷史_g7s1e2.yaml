questions:
- id: doc_113_台中_居仁_社會_歷史_g7s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 圖(一)為清康熙年間臺灣行政區整理圖。請問：圖(一)空格應填入下列何者？
  options:
  - label: A
    content: 臺灣省
  - label: B
    content: 廣東省
  - label: C
    content: 福建省
  - label: D
    content: 臺東直隸省。
  assets:
  - key: s1_1_f1
    kind: figure
    file: doc_113_台中_居仁_社會_歷史_g7s1e2/s1_1_f1.png
- id: doc_113_台中_居仁_社會_歷史_g7s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 請閱讀下列史料：「1643 年，第七任臺灣長官路美爾上任，隔年3 月於赤崁舉行第一屆『甲』，會議形式如圖(二)。參加人數約300～400 人，其中有125
    位『乙』人，其他全是原住民。入席的『乙』人是依照官階高低就坐，接著長官致詞、推行政策宣布，再來用藤仗轉移象徵權力，從卸任頭目轉移到新任者，隨後則接受各方陳情，並進行仲裁、執行獎懲，壓軸好戲則是『乙』人和原住民吃喝玩樂到深夜。」關於上述史料內容，與下列哪一項敘述是不相關的？
  options:
  - label: A
    content: 與『乙』人吃喝玩樂的原住民可能是來自西拉雅族新港社
  - label: B
    content: 他們所參加的『甲』指的是地方會議
  - label: C
    content: 『乙』人利用『甲』對原住民進行間接統治，開墾土地，實施軍屯制度
  - label: D
    content: 文中的『乙』人和臺灣長官路美爾一樣是荷蘭人。
  assets:
  - key: s1_2_f1
    kind: figure
    file: doc_113_台中_居仁_社會_歷史_g7s1e2/s1_2_f1.png
- id: doc_113_台中_居仁_社會_歷史_g7s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 「騰雲號」是臺灣第一個火車頭，由清帝國向歐洲製造廠訂購，當初因為發動時會噴發大量的煤煙，讓民眾十分懼怕，甚至還稱其為「黑色妖馬」。該交通工具可以在臺灣行駛，主要與哪一事件相關？
  options:
  - label: A
    content: 英法聯軍
  - label: B
    content: 清法戰爭
  - label: C
    content: 牡丹社事件
  - label: D
    content: 甲午戰爭。
- id: doc_113_台中_居仁_社會_歷史_g7s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 原住民很早就懂得耕作，他們通常在離家不遠的地方找一塊地，先將樹林砍掉，然後以火焚燒，利用焚燒所留下來的灰燼作為肥料，等待來年土地肥沃，再以樹枝做的木棍在土地上挖洞播種。二、三年之後，土地利用得差不多，又換鄰近另一塊地砍林燒樹，周而復始。請問：這種耕種方式稱為什麼？
  options:
  - label: A
    content: 觀光農業
  - label: B
    content: 精耕細作
  - label: C
    content: 集約農業
  - label: D
    content: 游耕。
- id: doc_113_台中_居仁_社會_歷史_g7s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 《大清律例》中有一條規定：「凡漢人偷偷越界闖入番人地盤，杖打一百；偷偷到深山從事不法行為者，杖打一百外加有期徒刑三年。」有關這條法令及其實施後的敘述，何者正確？
  options:
  - label: A
    content: 坊間常以「土牛溝」、「土牛」來稱呼此界線
  - label: B
    content: 實施法令後完全隔絕了漢人和原住民之間的所有互動
  - label: C
    content: 這條「邊界」逐漸向平地進展，進而壓迫漢人的生活空間
  - label: D
    content: 頒布這條法令的目的應是要禁止原住民闖入漢人地盤。
- id: doc_113_台中_居仁_社會_歷史_g7s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '姜梨看到一篇漫畫如圖(三)，圖中的人物對於臺灣是否棄留問題爭論不已。請問：關於此爭論的敘述，下列何者錯誤？

    清朝皇帝：「鄭克塽投降我大清了。臺灣該如何處置才好？」

    甲官員：「把那個小島收為版圖，還要花錢管理，不如不要。」

    乙官員：「那個小島是海盜的巢穴，我們別理它。」

    丙官員：「正因為有海盜，我們才要納入版圖管理呀!」'
  options:
  - label: A
    content: 甲官員與乙官員的想法皆是要放棄臺灣
  - label: B
    content: 丙官員的意見闡述台灣的棄留影響中國東南沿海的安全
  - label: C
    content: 這場爭論發生在康熙皇帝在位時期
  - label: D
    content: 清朝皇帝最後接受丙官員的提議，並將丙官員拔擢為治理臺灣的巡撫。
  assets:
  - key: s1_6_f1
    kind: figure
    file: doc_113_台中_居仁_社會_歷史_g7s1e2/s1_6_f1.png
- id: doc_113_台中_居仁_社會_歷史_g7s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: '十九世紀後期，清帝國遭逢多次外來挑戰，開港通商之後，臺灣又在兩場清帝國的對外事件中受到衝擊，下列表格即是針對這兩場與臺灣相關的事件做一整理，請問表格內哪些選項需要修正？


    | 選項 | 牡丹社事件 | 清法戰爭 |

    | --- | --- | --- |

    | (甲)時間 | 光緒年間 | 同治年間 |

    | (乙)起因 | 琉球問題 | 越南問題 |

    | (丙)戰爭地點 | 基隆、澎湖 | 恆春半島 |

    | (丁)相關人物 | 劉銘傳 | 沈葆楨 |

    | (戊)結果 | 失去琉球 | 臺灣建省 |'
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲丙戊
  - label: C
    content: 甲丁戊
  - label: D
    content: 甲丙丁。
- id: doc_113_台中_居仁_社會_歷史_g7s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 芳菲想要製作以17 世紀的臺灣為背景的專題研究，研究主題為「17 世紀統治臺灣的歐洲勢力對原住民的治理模式」，請問：下列那項敘述不應該在他的研究中？
  options:
  - label: A
    content: 占領臺灣南部的歐洲人，在臺初期對於不願意歸順的原住民，多採取鎮壓的統治手段
  - label: B
    content: 占領臺灣北部的歐洲人，亦會定期召開地方會議，各部落長者需報告部落狀況
  - label: C
    content: 荷蘭人與原住民結盟壓制的對象包含原住民和漢人
  - label: D
    content: 基隆市和平島教堂遺址和西班牙人來臺傳播天主教有關聯。
- id: doc_113_台中_居仁_社會_歷史_g7s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 清帝國統治臺灣初期，為防止臺灣再度成為動亂之源，採取「為防臺而治臺」政策，政策之一包括「番界」的設立。請問：「番界」設立的目的主要為何？
  options:
  - label: A
    content: 避免漢人與原住民的衝突
  - label: B
    content: 保護原住民的傳統文化
  - label: C
    content: 加強漢人與原住民的合作
  - label: D
    content: 教導原住民拓墾的技能。
- id: doc_113_台中_居仁_社會_歷史_g7s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 「目加溜灣社」(Backloun)是位在今臺灣臺南市善化區溪美里一帶的原住民族部落，早期此處又稱「加溜灣」或「灣裡」。後某一政權入臺，為了解決軍糧缺乏的問題，即刻推行各項屯田開墾。見此地很早期便開化，因此以「善早開化」之名稱改為「善化」。請問：該政權應為下列何者？
  options:
  - label: A
    content: 日本
  - label: B
    content: 西班牙
  - label: C
    content: 鄭氏政權
  - label: D
    content: 荷蘭聯合東印度公司。
- id: doc_113_台中_居仁_社會_歷史_g7s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 圖(四)呈現「□□」發生前後，清帝國治理臺灣措施的差異。請問：「□□」指的是哪一件？這事件之後對於臺灣有哪些影響？
  options:
  - label: A
    content: 牡丹社事件；派遣劉銘傳來臺強化防務，並開展相關建設
  - label: B
    content: 牡丹社事件；戰後日軍在屏東縣車城鄉為罹難琉球人設立墓碑
  - label: C
    content: 英法聯軍；開放臺灣的港口，如雞籠、淡水、安平、打狗
  - label: D
    content: 英法戰爭；外國勢力再度進入臺灣。
  assets:
  - key: s1_11_f1
    kind: figure
    file: doc_113_台中_居仁_社會_歷史_g7s1e2/s1_11_f1.png
- id: doc_113_台中_居仁_社會_歷史_g7s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 荷蘭在臺到鄭氏在臺治理這段期間，原住民族與漢人、荷蘭人之間互動關係的發展與觀察，下列敘述何者正確？
  options:
  - label: A
    content: 荷蘭人在臺灣南部設立教堂與學校，部分原住民接受基督教信仰
  - label: B
    content: 原住民族受到鄭氏政權的保護，文化得到較好發展
  - label: C
    content: 鄭氏在臺時期，原住民族的生活空間比荷蘭在臺時期來得大
  - label: D
    content: 原漢衝突因為政府介入的關係，所以逐漸下降。
- id: doc_113_台中_居仁_社會_歷史_g7s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 「新港文字」為大航海時代來臺的傳教士，為向臺灣原住民傳教，發展而成的文字。請問：關於「新港文字」的敘述，下列何者需要修正？
  options:
  - label: A
    content: 「新港文字」是南部平埔族在使用
  - label: B
    content: 傳教士透過「新港文字」翻譯《聖經》，傳播教義
  - label: C
    content: 十九世紀初，仍有平埔族使用「新港文字」與漢人簽訂土地契約的紀錄
  - label: D
    content: 「新港文字」是以原住民文字拼寫荷蘭語言。
- id: doc_113_台中_居仁_社會_歷史_g7s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 19 世紀有三場與臺灣相關的戰爭，關於這些戰爭的敘述，下列何者正確？
  options:
  - label: A
    content: 清帝國在英法聯軍戰敗後，開放淡水、鹿港、安平、打狗
  - label: B
    content: 清法戰爭結束後，清帝國更加重視臺灣，任命沈葆楨為首任巡撫治理臺灣
  - label: C
    content: 牡丹社事件落幕之後，清帝國將琉球收歸版圖，保障臺灣與琉球海防安全
  - label: D
    content: 英法聯軍和清法戰爭結束後，臺灣行政區的數量皆有增加。
- id: doc_113_台中_居仁_社會_歷史_g7s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 有一則史料記載，17 世紀臺灣發生漢人反抗當時統治者的事件，史料內容如下：「漢人對荷蘭人的抽稅和勞力剝削怨聲載道，且比起原住民的待遇，漢人被視為廉價勞動力和稅收的主要來源……終於導致1652
    年的叛亂。」請根據史料內容，判斷此事件是由誰所領導的？
  options:
  - label: A
    content: 鄭成功
  - label: B
    content: 朱一貴
  - label: C
    content: 林爽文
  - label: D
    content: 郭懷一。
- id: doc_113_台中_居仁_社會_歷史_g7s1e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 光緒年間，臺灣開通了數條穿越中央山脈的越嶺道路，其中「三條崙古道」西起枋寮（今屏東縣枋寮鄉），東至巴塱衛（今臺東縣大武鄉），是清帝國時期使用時間最久的一條古道。上述越嶺道路的開通是為了配合當時政府哪項統治政策？
  options:
  - label: A
    content: 劃定「番界」，隔離漢人與原住民
  - label: B
    content: 開放港口通商，允許外商前往臺灣
  - label: C
    content: 積極治理臺灣，開山撫番鼓勵墾殖
  - label: D
    content: 實施渡臺禁令，限制移民渡海來臺。
- id: doc_113_台中_居仁_社會_歷史_g7s1e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 西班牙於1626 年抵達臺灣進行貿易與傳教，然而日本實施鎖國政策，導致西班牙人對日貿易受挫，逐漸降低對於臺灣的重視。「凡走過必留下『痕跡』」，請判斷下列何者不可能是西班牙人在臺灣經營遺留下的『痕跡』？
  options:
  - label: A
    content: 2019 年臺灣考古團隊在基隆和平島挖出17 世紀大型教堂遺跡
  - label: B
    content: 「三貂角」此地名原是西班牙語「Santiago」，後經臺灣人將西語名字轉譯成「三貂角」
  - label: C
    content: 17 世紀史料文獻中與北臺灣馬賽人進行貿易的歐洲人
  - label: D
    content: 教導當地原住民農耕技術，使得原住民生活型態變得更多樣化。
- id: doc_113_台中_居仁_社會_歷史_g7s1e2_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 18 世紀時，傳教士在康熙皇帝的委託下，以清帝國統治者的觀點，把「帝國統治的疆域」畫成一套《皇輿全覽圖》。下圖為《皇輿全覽圖》中描繪的臺灣(圖五)，圖中島嶼的輪廓明顯與今日不同，這應是政府實施哪項政策所導致的結果？
  options:
  - label: A
    content: 軍屯政策
  - label: B
    content: 渡臺禁令
  - label: C
    content: 開山撫番
  - label: D
    content: 劃界封山。
  assets:
  - key: s1_18_f1
    kind: figure
    file: doc_113_台中_居仁_社會_歷史_g7s1e2/s1_18_f1.png
- id: doc_113_台中_居仁_社會_歷史_g7s1e2_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 「讀萬卷書不如行萬里路」婉寧覺得吸取課本知識外，應該要身體力行、多到各地旅行，開拓視野、增廣見聞。她先搭乘普悠瑪欣賞壯麗的太平洋景觀，再從花蓮的八通關古道橫貫中央山脈；接著婉寧前往臺南參觀億載金城，並在漁光島沙灘欣賞黃昏與落日餘暉；最後一日，繼續往南，先到旗津碼頭享受美味海鮮大餐，遊覽旗後燈塔與旗後炮臺，並以恆春老街劃下此次旅程完美的句點。請問：關於婉寧安排的旅遊路線所經景點，與下列何人最為相關？
  options:
  - label: A
    content: 鄭成功
  - label: B
    content: 沈葆楨
  - label: C
    content: 劉銘傳
  - label: D
    content: 郭懷一。
- id: doc_113_台中_居仁_社會_歷史_g7s1e2_s1_20
  section: 1
  number: 20
