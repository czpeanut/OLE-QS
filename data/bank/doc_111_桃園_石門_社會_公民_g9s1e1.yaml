  section: 1
  number: 12
  type: single
  page: 1
  stem: '大學畢業的小美最近面試並錄取了幾份工作，以下是她對這些工作所做的筆記整理：


    | | A 公司 | B 公司 | C 公司 | D 公司 |

    | :--- | :--- | :--- | :--- | :--- |

    | 薪水 | 32000 元 | 29600 元 | 36000 元 | 38000 元 |

    | 優點 | 福利佳、升遷管道明確 | 離家近 | 不用加班 | 薪資佳、每年調薪 |

    | 缺點 | 休假少 | 薪資低、不太容易調薪 | 薪資固定，不太容易調薪 | 工作時數長、常加班 |


    小美與家人討論了之後，決定選擇到D 公司上班，請問：會讓小美做出這個決定的原因最有可能是什麼？'
  options:
  - label: A
    content: 從薪資來看，選擇D 公司的機會成本最高
  - label: B
    content: 在求職方面來看，小美最重視公司的福利制度
  - label: C
    content: 小美願意犧牲休息時間換取較多的薪資
  - label: D
    content: 小美是依據稀少性的概念作出選擇
