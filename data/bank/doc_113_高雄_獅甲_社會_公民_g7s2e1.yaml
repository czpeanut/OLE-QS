- id: doc_113_高雄_獅甲_社會_公民_g7s2e1_s1_47
  section: 1
  number: 47
  type: single
  page: 2
  stem: 根據上文，下列理解何者最合理？
  options:
  - label: A
    content: 刺青是臺灣社會裡主流文化的象徵之一
  - label: B
    content: 現今日本社會仍存在對刺青的文化位階
  - label: C
    content: 在玻里尼西亞社會裡，刺青屬於次文化
  - label: D
    content: 醫療人員若是有刺青會影響到工作表現
  group_stem: '「刺青」是一種歷史悠久的身體藝術，透過將墨水刺入皮膚來呈現圖案或詞彙。（甲）然而，不同社會對刺青的看法並不相同。例如在臺灣，過去常將刺青與幫派文化聯繫，使社會對有刺青者抱持警戒態度；（乙）日本至今也仍有許多公共場所禁止有刺青者進入，連外國人也不例外。即使個人選擇刺青的理由可能純粹是審美或文化認同，社會仍可能對此抱持偏見。

    （丙）不過隨著時代變遷，刺青的意義逐漸改變。現今許多年輕人視刺青為個人風格的展現，不再將其與過去的負面形象劃上等號。在時尚、藝術與音樂等領域，刺青已成為流行趨勢的一部分，甚至被視為一種獨特的身體敘事方式。與此同時，（丁）在部分國家，刺青的接受度較高，甚至大多數人都有刺青。例如在美國與歐洲許多地區，刺青不僅是一種個人風格的象徵，也廣泛出現在運動員、藝人與企業人士的身上；在紐西蘭與玻里尼西亞文化中，刺青具有深厚的歷史意義，代表家族傳承與社會地位，並沒有負面標籤的存在。

    儘管如此，刺青仍然在不同環境中面臨接受度的挑戰。醫療、金融與法律等行業對於員工的外在形象有較高的標準，這些職場目前多數仍不允許員工的刺青見人。而部分國家雖未明文限制特定職業不得刺青，但社會觀念仍可能影響刺青者的求職機會或待遇。'
