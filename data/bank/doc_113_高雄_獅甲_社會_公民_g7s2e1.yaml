- id: doc_113_高雄_獅甲_社會_公民_g7s2e1_s1_45
  section: 1
  number: 45
  type: single
  page: 2
  stem: 我國以儒家文化為主流，因此許多社會規範也與儒家的精神相同，例如崇尚孝道的倫理觀念，或是遵從禮儀法度的各種儀式；不過當國外的文化與我國文化接觸交流後，許多既有的傳統社會規範也開始改變，例如從男尊女卑轉變為性別平等，或者出現更多樣化、現代化的宗教祭儀。關於前述的轉變，下列哪一種觀點較為適切？
  options:
  - label: A
    content: 外來文化對本土文化的影響會導致傳統價值流失，我們應該設法防範這類變遷
  - label: B
    content: 我們應該盡量將異國文化及其規範直接在我國社會推行，以便與國際社會接軌
  - label: C
    content: 現代社會重視多元文化，這些改變是自然且可貴的，我們應理性接受這些發展
  - label: D
    content: 儒家文化已經過時落伍，我們應拋棄舊傳統，發展全新的當代文化與社會規範
  tags:
