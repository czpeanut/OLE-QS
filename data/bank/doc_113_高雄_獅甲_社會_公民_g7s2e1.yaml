  stem: 某義大利時尚品牌準備在上海舉辦時裝秀，但卻在其宣傳廣告短片當中，讓一名亞裔模特兒學習以筷子進食披薩與義大利麵，並以「小棍子」形容筷子，還出現「如何以這種小棍子形狀的餐具吃義大利偉大的傳統瑪格麗特披薩」等字眼，引發中國網友的強烈不滿。最後該時裝秀不但取消，該品牌也在中國遭到抵制。根據前述內容判斷，下列哪一個選項最有可能是該時尚品牌廣告引發衝突的原因？
