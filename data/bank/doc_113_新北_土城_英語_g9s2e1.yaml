    On New Year’s Eve, everywhere in City Center is filled with people, and many people
    are lining up in front of the restaurants. At this time, if you wait until you
    are angry and hungry, you can use this word to show your feeling in the line.


    spork

    Spork is called “fork spoon,” which is very common in fast food restaurant because
    it has the function of both a fork and a spoon. It is very convenient and can
    be used to eat thick soup and potato blocks as well.


    petextrian

    Today, people can’t live without smartphones. When pedestrians cross the street,
    some of them keep looking over their smartphones or typing messages on the road.
    It is dangerous for them? The answer is “Of course.” Safety first. While walking
    and texting on the road, these pedestrians are called petextrians.


    shopaholic

    The word “-holic” can be used to talk about the people who are crazy to do something,
    such as shopaholic means “someone who loves shopping and does it a lot.” The combination
    of such words also has workaholic and foodaholic. You can also build your own.

