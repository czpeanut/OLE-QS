  group_stem: 'In Sri Lanka, elephant poop is turned into special paper!

    Elephants eat a lot of grass, so their poop has enough plant fibers to make paper.

    First, the poop is collected and cleaned. Workers boil it to kill germs and make
    the fibers easy to use. Then, they put the fibers together with   50.   old paper
    to make a pulp. Then, this pulp is made into a piece of paper. After drying, the
    paper is ready to use.

    This process not only makes good use of the trash, but also saves trees. People
    can use paper made from elephant poop    51.     trees are not cut down for paper.  It
    also helps communities by giving people jobs.

    The finished papers used for birthday cards, notebooks, and even art. Many visitors
    to Sri Lanka like buying these special products.   52.  , people can help elephants
