    easy for us to grow many main crops, like rice or potatoes, to feed all the people.
    However, in some countries, people are worried that some crops like rice will
    no longer grow. That is, they may face the problem of having no food to eat!

    Luckily, the life-saving crop “false banana” can help. Enset, or “false banana,”
    is grown in many African countries. Enset is easily grown and can bring much food
    to feed people.

    You may want to know why it is called “false bananas.” In fact, this has something
    to do with its look. Though it looks like a banana, it is not a banana at all.
    When we eat bananas, we are eating their fruits. However, when we eat ensets,
    or false bananas, we are eating their stems or roots.

    Thanks to ensets, many African people can have enough food, so they will not be
    hungry. With ensets, they can make porridge or bread. It would be better for other
    countries to follow suit. In this way, when the weather is becoming worse and
    worse, people around the world can always have enough food to live on.

