     Iris Corner: Not just a department store, it makes people feel like home. Its
    nice clerks win many people''s hearts, and that makes it the only department store
    stay in second place for three years.

     Daisy Village: Though having a big parking lot, Daisy Village could climb higher
    in the rankings if it had more restrooms.

     Rose House: Giving its first place to Lily Garden, Rose House needs to think
    about the number of its restrooms. Also, whether they are clean or not is very
    important.

     Tulip Land: This small but fine department store enters the top five for the
    first time for its nice clerks and the yummy food at the food court.

     Orchid Store: Famous for its playground and food court, Orchid Store turns itself
    into one of the favorite places where many families spend their weekends.

