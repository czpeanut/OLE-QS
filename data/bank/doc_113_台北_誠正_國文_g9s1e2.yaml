- id: doc_113_台北_誠正_國文_g9s1e2_s2_33
  section: 2
  number: 33
  type: single
  page: 6
  stem: 下列哪個選項最適合當本文的標題?
  options:
  - label: A
    content: 渾象、渾儀、渾天儀，到底是不是一回事？
  - label: B
    content: 破除黑科技:沈括《夢溪筆談》完全解析
  - label: C
    content: 古人太有才!中國古代的天文科學家
  - label: D
    content: What!占星起源在中國。
  group_stem: "首先可以告訴大家，渾象渾儀渾天儀不是同一種東西，也不是三個不同的事物。簡單來說，渾象是一種表現天體運動的演示儀器，類似現代的天球儀；渾儀是中國古代用於測量天體球面座標的觀測儀器。從用途上劃分，渾象主要用於象徵天球的運動，表演天象的變化\
    \ (例如恆星升落、月亮盈虧)；渾儀則用於古代天文測量天體的角度位置和運動。而渾象和渾儀，統稱為渾天儀。\n    在說到渾天儀的時候，大多數人腦子裏第一個想到的人物可能都是張衡。張衡以發明地動儀而聞名於世，但是渾象和渾儀都不是由他所發明創造的，而是由他進行了改進。\n\
    \    渾象最初是由我國西漢天文學家耿壽昌發明於西元前 2 世紀中葉。在古代，農業生產不像現在都是機械化，在古代耕種需要人為，但收穫就需要看天了。因此，古代的農業生產和天象息息相關。這就要求農業方面的官員要精通天文學。耿壽昌把從渾天說認識到的天球形象化地表現出來，基本形狀是一個大圓球，象徵天球，圓球上布滿星辰等等，另有轉動軸以供旋轉，還有象徵地平的圈或框，象徵地體的塊，利用大圓球的旋轉來模擬天象變化，這就是最原始的渾象模型。只是非常可惜，耿壽昌製造的渾象和著作都未能保留下來，有關渾象的最早記載為東漢張衡的《渾天儀圖注》。\n\
    \   渾儀的發明和改進跟張衡關係不大，另有一批古代科學家對此作出了傑出的貢獻。渾儀在沈括的《夢溪筆談·極星測量》中同樣有記載：「天文家有渾儀，測天之器，設於崇台，以候垂象者，則古機衡是也。」在西元前\
    \ 4 世紀中葉，中國就已經使用渾儀觀測天象了，比古希臘早了差不多 60 年。\n(改寫自香港天文討論學會討論區文章2015 Sep.)"
