  group_stem: '司馬談死了三年，果然司馬遷接他父親做太史官了。司馬遷接著說：「先人有言曰：『周公卒五百歲而有孔子』，孔子卒後至於今五百歲，有能紹明世、正易傳、繼春秋、本詩書禮樂之際，意在斯乎？意在斯乎？」他說他父親講過，周公卒後五百歲而有孔子，孔子卒後至於今五百歲。這個作史責任，便在我的身上了。所以他來寫《史記》，是跟著周公、孔子而寫的。五百年前有周公，五百年後有孔子，再後五百年有他。諸位試把此一番話去讀《孟子》最後一章孟子也就是這麼講。堯舜後多少年有湯武，湯武後多少年有孔子，孔子後多少年該有人出來才是。可見司馬談、司馬遷父子都曾讀過《孟子》，都有他們的學術傳統。司馬遷又說：有人能紹續這明世，出來正《易傳》、繼《春秋》、本《詩》、《書》《禮》、《樂》之際，而此《易傳》、《春秋》、《詩》、《書》、《禮》、《樂》，在他那時都是經，還沒有史學。不過他是個歷史官，該要寫歷史，而所寫出來的則還是經學。我們也可說，這是太史公司馬遷理想中的新經學。

