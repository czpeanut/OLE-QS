  stem: 關於鄭燮〈寄弟墨書〉之文意，下列何者解讀正確?
  options:
  - label: A
    content: 「夫束修自好者，豈無其人?經濟自期，抗懷千古者，亦所在多有」:束修自好者寡，抗懷千古者多
