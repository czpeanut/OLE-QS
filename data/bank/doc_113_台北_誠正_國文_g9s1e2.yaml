- id: doc_113_台北_誠正_國文_g9s1e2_s2_36
  section: 2
  number: 36
  type: single
  page: 6
  stem: 鄭燮在全文所流露的情懷與下列哪個選項近似?
  options:
  - label: A
    content: 吾日三省吾身
  - label: B
    content: 施惠慎勿念
  - label: C
    content: 不義而富且貴，於我如浮雲
  - label: D
    content: 知其不可而為之。
  group_stem: '愚兄為秀才時，檢家中舊書簏①，得前代家奴契券，即於燈下焚去，並不返諸其人，恐明與之，反多一番形跡，增 一番愧恧②。自我用人，從不書券，合則留，不合則去。何苦留此一紙，使吾後世子孫借為口實，以便苛求抑勒③乎？
    如此存心是為人處，即是為己處。若事事預留把柄，使入其網羅，無能逃脫，其窮愈速，其禍即來，其子孫即有不可問之事，不可測之憂。

    鄭燮〈雍正十年杭州韜光庵中寄舍弟墨〉

    【注釋】：①簏：音ㄌㄨˋ，竹子編成的箱子。 ②愧恧：慚愧、羞愧。恧，音ㄋㄩˋ。 ③抑勒：壓迫、勒索。'
