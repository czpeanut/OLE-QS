  type: single
  page: 4
  stem: '世俗所患，患言事增其實，著文垂辭，辭出溢其真，稱美過其善，進惡沒其罪。何則？俗人好奇，不奇，言不用也。故譽人不增其美，則聞者不快其意；毀人不益其惡，則聽者不愜於心，聞一增以為十，見百益以為千，使夫純樸之事，十剖百判；審然之語，千反萬畔。

