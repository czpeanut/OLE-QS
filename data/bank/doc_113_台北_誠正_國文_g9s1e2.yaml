- id: doc_113_台北_誠正_國文_g9s1e2_s2_39
  section: 2
  number: 39
  type: single
  page: 7
  stem: 關於甲、乙兩文的敘述，何者正確?
  options:
  - label: A
    content: 兩文均採用對話，如實呈現事件
  - label: B
    content: 兩文均詳實記載租賦歲倍事件的始末
  - label: C
    content: 甲文以魏文侯之第一人稱展開敘述，並佐以客觀事件「東陽上計，錢布十倍」提高真實性
  - label: D
    content: 乙文採第三人稱角度敘述，側重記錄魏文侯的反應。
  group_stem: '【甲】魏文侯出遊，道見路人反裘而負芻①，文侯曰：「胡為反裘而負芻？」 對曰：「臣愛其毛。」文侯曰：「若不知其裡盡而毛無所恃耶？」明年，東陽上計②，錢布十倍，大夫畢賀。文侯曰：「此非所以賀我也。譬無異夫路人反裘而負芻也，將愛其毛，不知其裡盡，毛無所恃也。今吾田地不加廣，士民不加眾，而錢十倍，必取之士大夫也。吾聞之，下不安者，上不可居也，此非所以賀我也。」

    劉向《新序．雜事二》


    【乙】魏文侯時，租賦曾倍於常，或有賀者。文侯曰：「今戶口不加，而租賦歲倍，此由課多也。譬如彼治冶，令大則薄，令小則厚，治人亦如之。夫貪其賦稅不愛人，是虞人反裘而負薪也。徒惜其毛，而不知皮盡而毛無所附。」

    杜佑《通典．食貨四》

    【注釋】：①芻:餵養牲畜的草料。 ②上計: 年終將該縣戶口、墾田、錢穀、刑獄狀況等，編制爲計簿，經由郡國再上報朝廷。'
