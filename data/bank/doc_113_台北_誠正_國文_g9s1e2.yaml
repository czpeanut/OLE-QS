- id: doc_113_台北_誠正_國文_g9s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 3
  stem: '破壞真相有三種等級，分別是:謬誤、刻意忽略和說謊。每個人都會說錯話或做錯事，但不一定是刻意的，這是「謬誤」；不確定是否屬實，也不願意查證訊息的正確性，這是「刻意忽略」；而「說謊」則是懷有欺騙的意圖，明知不符事實卻故意捏造。若感受凌駕於事實之上，導致寧願相信自己的感受而忽視事實，這也是對真相的破壞。

    根據上文，下列哪個人的行為屬於「刻意忽略」?'
  options:
  - label: A
    content: 小樂看到同學錯過公車而來不及準時上學，卻告訴班導他在早餐店流連久待
  - label: B
    content: 阿海聽聞隔壁班的八卦消息，立刻轉發班群
  - label: C
    content: 彤彤記錯段考範圍，導致考試結果不理想
  - label: D
    content: 澎澎雖相信朋友的為人，但仍試圖釐清整起事件的始末。
  tags:
    textbook: 九上 自學課二 有關氣候變遷的難題
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 九上
      subject: 國文
      code: 自學課二
      title: 有關氣候變遷的難題
      chapter: null
