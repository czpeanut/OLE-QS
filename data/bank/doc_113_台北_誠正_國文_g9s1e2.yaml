  type: single
  page: 2
  stem: '一如所有表現傑出的組織機構一樣，我們的嗅覺和味覺必須「攜手合作」，才能夠達到共同的目標:辨識出我們口中的是什麼，並且做出決定。味覺的角色雖然攸關緊要，但讓我們享受到食物之樂的，其實是嗅覺；若沒有嗅覺，你的味道世界就只剩下五種事物。想想味覺和嗅覺密切合作:鼻後嗅覺正是經由你口中的嗅覺，兩者無法分離。其中哪一種感官挑大梁?功勞屬於哪一種?哪一種有力量?科學家估計我們嘗到的味道，75%到95%其實是嗅覺。

    議論文通常可分為論點、論證與論據，下列何者為作者欲表明的「主要論點」而非作為支撐論點理由的論據?'
  options:
