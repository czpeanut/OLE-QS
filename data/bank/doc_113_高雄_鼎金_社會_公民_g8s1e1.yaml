    | --- | --- | --- |

    | 第一任總統大選 | 46% | 54% |

    | 第二任總統大選 | 49% | 51% |

    | 第三任總統大選 | 53% | 47% |

    | 第四任總統大選 | 45% | 55% |

    | 第五任總統大選 | 52% | 48% |

    請問：根據此表內容，下列說明何者正確？'
  options:
  - label: A
    content: 在第二任總統大選時，經歷了第一次政黨輪替
  - label: B
    content: 在第三任總統大選時，經歷了第二次政黨輪替
  - label: C
    content: 在第四任總統大選時，經歷了第三次政黨輪替
  - label: D
    content: 在第五任總統大選時，經歷了第三次政黨輪替。
