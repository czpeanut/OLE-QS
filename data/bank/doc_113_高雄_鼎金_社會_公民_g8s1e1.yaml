- id: doc_113_高雄_鼎金_社會_公民_g8s1e1_s1_42
  section: 1
  number: 42
  type: single
  page: 1
  stem: '在民主國家，政府的權力來自於人民，但在獨裁國家卻非如此，健程聽到幾位外國網友在抱怨國內政治現狀如下，他們所討論的內容應屬於民主治理所具備的何種特色？

    伯安：我們國家官員帶頭違法，不遵守法律規定。

    伯羽：我覺得政府應依法行政。'
  options:
  - label: A
    content: 民意政治
  - label: B
    content: 政黨政治
  - label: C
    content: 法治政治
  - label: D
    content: 責任政治。
- id: doc_113_高雄_鼎金_社會_公民_g8s1e1_s1_43
  section: 1
  number: 43
  type: single
  page: 1
  stem: 為分析國家與政府的區別，同學們在課堂上進行討論，請問：下列何人的說明完全正確？
  options:
  - label: A
    content: 楷育：國家主權需要政府機關執行公權力加以貫徹
  - label: B
    content: 子項：國家只是構成政府部門成立的數個要素之一
  - label: C
    content: 淮甲：國家通常會因政權轉移或者制度變遷而改變
  - label: D
    content: 盈圻：國家應屬於負責制定政策與執行的行政單位。
- id: doc_113_高雄_鼎金_社會_公民_g8s1e1_s1_44
  section: 1
  number: 44
  type: single
  page: 1
  stem: '心然收到日本朋友傳來以下一則訊息，根據內容判斷，下列何者較符合該友人欲表達的想法？

    2024 年9 月的選舉，已執政51 年的政黨下臺。對許多民眾而言，這顯示了每個人都能用選票決定未來的執政者，得票數將代表他們的問政表現。雖然不知道下一次的當選者是誰，但是由人民當家的感覺真好。'
  options:
  - label: A
    content: 政黨利益的重要性大於人民福祉
  - label: B
    content: 民主選舉不利於政權和平轉移
  - label: C
    content: 違反民意的政府將得不到民心
  - label: D
    content: 民眾較難理解複雜的政治事務。
