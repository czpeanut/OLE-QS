  stem: 台中舊火車站於1905 年5 月15 日通車啟用，1908 年4 月1 日臺灣西部縱貫鐵路全線通車，同年10 月24 日並在臺中公園舉行全線通車大典。於1995
    年內政部將臺中站審定為國定古蹟，保存此一深具歷史及建築意義的火車站。請問：國家保存古蹟文物，是在發揮現代民主國家的哪一項功能？
