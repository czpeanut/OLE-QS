questions:
- id: doc_113_台中_居仁_社會_公民_g9s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 下列四位同學於課堂上發表關於「機會成本」的概念，何者的說明有錯誤？
  options:
  - label: A
    content: 阿漢：「只能擇一為之」
  - label: B
    content: 阿翔：「提供人們選擇的判斷指標」
  - label: C
    content: 阿涵：「犧牲代價越大機會成本就越大」
  - label: D
    content: 阿宏:「指所需犧牲其他好處的最低代價」。
- id: doc_113_台中_居仁_社會_公民_g9s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 新聞報導指出：「某路段有近30 間手搖飲料店，堪稱手搖飲料一級戰區。這些店家除了經常祭出「買一送一」優惠，也不時將飲品推陳出新，建立自己獨特的品牌形象。因為此路段附近有許多公司行號，也有多家大型百貨公司，經濟學者認為充足的消費力能帶來豐沛的商機。」老師在課堂引用此報導並請四位同學發表看法，依經濟學概念判斷，下列哪一位的解讀最適當？
  options:
  - label: A
    content: 小霈：店家採以提高商品價格的方式增加獲利
  - label: B
    content: 小寧：學者看法凸顯商品品質影響消費者選擇
  - label: C
    content: 小葳：不同消費者對於店家提出的誘因會有不同感受
  - label: D
    content: 小雨：店家採用的銷售策略皆為以正向金錢誘因的方式。
- id: doc_113_台中_居仁_社會_公民_g9s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 消費者掏錢購買廣告類商品與服務時，往往會考量各種因素，廠商也往往推出各式行銷策略，希望能吸引消費者上門。請問：下列哪項消費行為並非運用「需求法則」的策略？
  options:
  - label: A
    content: 百貨公司周年慶全面8 折
  - label: B
    content: 網路商城全館免運費
  - label: C
    content: 25 周年限量紀念商品
  - label: D
    content: 便利商店飲料全品項買一送一。
- id: doc_113_台中_居仁_社會_公民_g9s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 請利用所學的概念，判斷下列哪個情境屬於「消費者進行的消費行為」？
  options:
  - label: A
    content: 千漁開著自己買的遊覽車載客導覽
  - label: B
    content: 在銀行擔任襄理的阿寬幫客人開戶
  - label: C
    content: 國中生阿杜假日下午到補習班補數學
  - label: D
    content: 經營代購生意的小荷幫客人購買日本人氣伴手禮。
- id: doc_113_台中_居仁_社會_公民_g9s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 幸福國由於受到原物料成本增加，政府也同時宣告基本工資調漲5.1%。餐飲企業紛紛調漲餐點價格25 到100 元不等。店家表示，已經盡量壓低漲價幅度，漲價其實僅能維持原本的獲利。根據上文敘述，下列有關價格變動的原因，及對生產者與消費者影響的分析何者錯誤？
  options:
  - label: A
    content: 消費者購買商品的機會成本增加
  - label: B
    content: 生產者欲透過提升產品價格保持利潤
  - label: C
    content: 廠商在「薪資」方面的生產成本將提高
  - label: D
    content: 漲價目的來自於廠商希望維持原有銷貨收入。
- id: doc_113_台中_居仁_社會_公民_g9s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 環保意識提升，各國政府紛紛提出相關政策，下列國家的四種政策中，何者同時屬於「負向誘因」、「非金錢誘因」？
  options:
  - label: A
    content: 甲：回收餐盒，獎勵金1,000 元
  - label: B
    content: 乙：違反排放廢水工廠，勒令停業
  - label: C
    content: 丙：駕駛車輛排放廢氣，罰款1 萬元
  - label: D
    content: 丁：未架設太陽能電板，減少補助金。
- id: doc_113_台中_居仁_社會_公民_g9s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: '下列是某篇雜誌內容：

    全面非核、缺電、空汙、漲價各有利弊，政府或民眾必須先確定自己要什麼。非核家園的理想若要獲得實現，就必須面臨缺電、漲電價、火力發電增加空氣汙染以及漲電價可能帶動的物價齊漲，不可能想要非核家園，又要不缺電。

    根據內容判斷，文中的反思論點主要是基於下列哪項經濟學的概念？'
  options:
  - label: A
    content: 需求法則
  - label: B
    content: 機會成本
  - label: C
    content: 生產者的選擇
  - label: D
    content: 公平正義原則。
- id: doc_113_台中_居仁_社會_公民_g9s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 「資源有限，欲望無窮」，正因資源的稀少性，所以如何在有限的資源下做取捨，便是經濟問題。下列各地區的特色與所對應的資源，何者最具有文中所指的特性？
  options:
  - label: A
    content: 哈特爾地區：人口密度高／資源：土地
  - label: B
    content: 拉聶爾地區：降水量多／資源：水資源
  - label: C
    content: 格魯德地區：終年有陽光照射／資源：太陽能
  - label: D
    content: 海拉魯地區：森林多，環保意識高／資源：乾淨空氣。
- id: doc_113_台中_居仁_社會_公民_g9s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: '健宏打算與好朋友辰輝一起開店創業，他們討論的內容如下：

    健宏：「上班族的消費力比較強，所以我打算鎖定上班族客群。」

    辰輝：「這樣的話，在捷運站附近開餐酒館或運動餐廳或許是不錯的選擇！」

    關於上述兩人的對話，下列何者敘述正確？'
  options:
  - label: A
    content: 健宏是考量「為誰生產」的課題
  - label: B
    content: 辰輝是考量「生產成本」的課題
  - label: C
    content: 健宏是考量「生產什麼」的課題
  - label: D
    content: 辰輝是考量「如何生產」的課題。
- id: doc_113_台中_居仁_社會_公民_g9s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 小儒原本經營一間韓式炸雞專賣店，但隨著同質性的商店愈來愈多，各家商店降價競爭，每份炸雞價格已低到無法負擔成本，最終小儒在不堪虧損的情形之下，決定結束營業。上述小儒的行為與下列何者屬於相同經濟學概念？
  options:
  - label: A
    content: 丹麥政府對農民徵氣候稅，肉品市場價格隨即飆漲
  - label: B
    content: 百香果的價格居高不下，許多果農紛紛改種百香果
  - label: C
    content: 悠遊卡公司推出造型悠遊卡，開賣立刻被民眾秒殺
  - label: D
    content: 秋天到來天氣轉涼，電器行紛紛進行冷氣促銷活動。
- id: doc_113_台中_居仁_社會_公民_g9s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 臺灣的海運業近年出現不少傑出女性，任職於某海運公司的葉船長更是臺灣首位女船長，她主要負責長程航線，從三副、二副到大副，入行僅6 年就當上船長，月薪26
    萬元以上。這個新聞鼓舞了班上想當船長的同學，下列關於同學們的討論，何者敘述正確？
  options:
  - label: A
    content: 小居：船長可以決策船上的所有事情，所以葉船長是生產者
  - label: B
    content: 小仁：支付長程航線貨櫃輪這項生產成本的支出稱為「租金」
  - label: C
    content: 小國：海運公司將託運貨物運送到國外，因此其產品是有形的財貨
  - label: D
    content: 小中：葉船長是被公司聘用的勞工，她的薪資也是公司的生產成本。
- id: doc_113_台中_居仁_社會_公民_g9s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 阿辛有一間店面，原本租給服飾店一個月有6 萬元租金收入，後來因為想自行創業，收回店面開設扭蛋店，一個月有20 萬的收入，除店租外，其他的成本約為9
    萬，請問：在考量機會成本的情況下，阿辛開設扭蛋店一個月的利潤為何？
  options:
  - label: A
    content: 5 萬元
  - label: B
    content: 6 萬元
  - label: C
    content: 9 萬元
  - label: D
    content: 11 萬元。
- id: doc_113_台中_居仁_社會_公民_g9s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 下列是瓜瓜國的一則新聞報導：「為了防治河川地種植西瓜所造成的環境衝擊，政府針對在河川地種植西瓜的果農，課徵每顆西瓜500 元的租稅，瓜農的生產成本因而增加。」根據內容判斷，上述措施最有可能會使瓜瓜國的西瓜價格產生何種變化？
  options:
  - label: A
    content: 上漲
  - label: B
    content: 下跌
  - label: C
    content: 維持不變
  - label: D
    content: 無法判斷。
- id: doc_113_台中_居仁_社會_公民_g9s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 右圖為大華與小年住家附近的地圖，甲、乙二商店均販賣大華與小年想購買的某項商品，且該商品在甲商店的售價比乙商店低。若大華僅想就近買到商品，而小年卻只想以便宜的價格購買，則對此二人而言，到哪一間商店購物的機會成本較高？
  options:
  - label: A
    content: 皆為甲商店
  - label: B
    content: 皆為乙商店
  - label: C
    content: 大華：甲商店，小年：乙商店
  - label: D
    content: 大華：乙商店，小年：甲商店。
  assets:
  - key: s1_14_f1
    kind: figure
    file: doc_113_台中_居仁_社會_公民_g9s1e1/s1_14_f1.png
- id: doc_113_台中_居仁_社會_公民_g9s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 阿鈞跟母親回到臺東老家參加豐年祭，同時也享受了新鮮空氣，而住在臺中的小成卻需要花錢購買空氣清淨機。從經濟學的角度來看，下列敘述何者最正確？
  options:
  - label: A
    content: 阿鈞在臺東享受的新鮮空氣具備稀少性
  - label: B
    content: 臺東的空氣品質佳，清新的空氣屬於經濟財
  - label: C
    content: 臺中因為空氣汙染，清新的空氣不屬於經濟財
  - label: D
    content: 小成需要付出代價來取得新鮮空氣，因此具備稀少性。
- id: doc_113_台中_居仁_社會_公民_g9s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 人類的行為是一門非常複雜的行為科學，我們在進行選擇時往往背後隱含了各種動機。有關影響行為誘因的敘述，何者最正確？
  options:
  - label: A
    content: 誘因要以金錢為內容才會產生效果
  - label: B
    content: 運用正向誘因一定能有效驅動人們的行為
  - label: C
    content: 負向誘因除減少報酬也可能造成名譽損失
  - label: D
    content: 誘因可以強化人的某種行為，但無法抑制。
- id: doc_113_台中_居仁_社會_公民_g9s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 下列有關「機會成本」的敘述，何者最正確？
  options:
  - label: A
    content: 機會成本包含所有被放棄的機會
  - label: B
    content: 機會成本是無形的，無法被計算出來
  - label: C
    content: 機會成本是指放棄的所有機會的價值總和
  - label: D
    content: 機會成本是指放棄的所有機會中價值最高的。
- id: doc_113_台中_居仁_社會_公民_g9s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 除了商品本身的價格影響會消費者的選擇外，日常生活中消費者的消費行為也會受到其他因素影響。下列四家航空公司的宣傳內容，何者並不屬於「非價格因素」？
  options:
  - label: A
    content: 「本航空與米其林大廚聯名，讓你在高空中吃到星級料理！」
  - label: B
    content: 「本公司的飛機座位結合時下最新潮的漫畫作品做為機身彩繪！」
  - label: C
    content: 「搭乘本公司航班，可憑登機證免費使用貴賓室及專屬快速通道！」
  - label: D
    content: 「完成搭乘本公司任一航班累積滿十趟，即可獲贈一組免費來回機票！」
- id: doc_113_台中_居仁_社會_公民_g9s1e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: '影響消費者消費行為的因素包括：

    甲、商品價格 乙、預期心理 丙、收入多寡 丁、個人偏好。

    請問右列依序分別為何？

    ① 張惠妹大巨蛋開唱，演唱會門票被秒殺。

    ② 油價即將調漲，消費者到加油站排隊等加油。

    ③ 眼鏡店舉辦人氣職棒啦啦隊員見面會，吸引大量人潮。

    ④ 年前各大公司發放年終獎金，上班族到百貨公司消費犒賞自己。'
  options:
  - label: A
    content: 甲乙丁丙
  - label: B
    content: 乙甲丁乙
  - label: C
    content: 丁甲丁乙
  - label: D
    content: 丁乙丁丙。
- id: doc_113_台中_居仁_社會_公民_g9s1e1_s1_20
  section: 1
  number: 20
  type: single
  page: 3
  stem: 關於捷運車廂上設置的「博愛座」，以下何項作法能最能兼顧效率與公平？
  options:
  - label: A
    content: 有使用需求者需額外付費使用
  - label: B
    content: 先占博愛座位者即可乘坐到目的站
  - label: C
    content: 任何人都可使用，但需禮讓給老弱婦孺
  - label: D
    content: 所有人皆可輪流使用，每到一站便換人坐。
