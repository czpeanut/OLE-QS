  section: 1
  number: 21
  type: single
  page: 3
  stem: 生產者運用各種資源製造生產出來的成果稱為產品，依性質可分為財貨或勞務。下列哪一個選項的敘述皆屬於同種性質？
  options:
  - label: A
    content: 「電腦維修｣、「醫生治病｣、「早餐店火腿蛋三明治｣
  - label: B
    content: 「律師打官司」、「停車場停車」、「高級餐廳桌邊服務」
  - label: C
    content: 「公車司機載客」、「遊樂園紀念品」、「劉師傅腳底按摩」
  - label: D
    content: 「農夫種植的蔬果｣、「歌手開演唱會｣、「宅配公司替客人送貨｣。
- id: doc_113_台中_居仁_社會_公民_g9s1e1_s1_22
  section: 1
  number: 22
  type: single
  page: 3
  stem: 芳芳公司生產液晶電視，因產品價格下跌，導致利潤減少，於是公司提出四種不同的因應方案。在銷售數量維持不變的情況下，下列何者具有降低生產成本的效果？
  options:
  - label: A
    content: 方案一：調降產品價格
  - label: B
    content: 方案二：增聘業務人才
  - label: C
    content: 方案三：減少廣告經費
  - label: D
    content: 方案四：研發多功能電視。
- id: doc_113_台中_居仁_社會_公民_g9s1e1_s1_23
  section: 1
  number: 23
