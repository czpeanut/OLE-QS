    The people begged for rice, 44 the raja refused. He was worried that the famine
    might last a long time. 45 .

    One day, an elephant was carrying baskets of rice to the raja. A girl called Rani
    noticed some rice was falling from one of the baskets. She walked along and picked
    them up.

    Rani returned the rice to the raja. He wanted to reward her, but she only asked
    for one grain of rice the first day. Besides, she also asked the raja to double
    it every day for thirty days. The raja agreed quickly.

    Finally, Rani had all of the rice and shared them with all people and the raja.
    Everyone was happy. The raja promised to be a good one as well.'
