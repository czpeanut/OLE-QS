  stem: 55. What might be the best title of the report?
  options:
  - label: A
    content: Dos and Don’ts of Wearing Uniforms
  - label: B
    content: Pros and Cons of Wearing Uniforms
  - label: C
    content: Agreements of Wearing Uniforms
  - label: D
    content: Discussion of Wearing Uniforms
  group_stem: 'In today’s English class, our teacher asked us to present the topic
    “Should the students wear uniforms?” First, each group member had to search information
    online. Then, group members discussed what they found. After that, each group
    had to share their ideas with others on the stage. The following is the report
    from Group 1:


    Hello, everyone. We are Group 1. We agree that students should wear uniforms.
    However, some people have different opinions about the topic. Now, we want to
    show you the advantages and disadvantages of wearing uniforms.

    There are some advantages of wearing school uniforms. First, it’s equal for every
    student with uniforms. Students will not be labeled as the rich or the poor. Second,
    schools can easily tell students from outsiders. In this way, our campus will
    be safe. Also, people can tell the school or police station right away if the
    students are in danger. Third, students will not spend a lot of time choosing
    clothes or talking about fashion if they wear uniforms. Therefore, they can focus
    on their studies more.

    On the other hand, wearing uniforms also has disadvantages. Buying uniforms can
    be a burden for some families because of the price. Moreover, the students cannot
    express their ideas about fashion by wearing uniforms. Besides, sexism is another
    problem. Some girls do not like to wear skirts, but some uniforms for girls are
    skirts only.

    That’s our presentation. Thanks for listening.


