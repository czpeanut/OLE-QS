  group_stem: 'Learning English idioms and phrases can be very useful because they
    are often used in everyday conversation. Here are some common idioms that use
    the word “hand.”

    When something gets out of hand, it is out of control. For example, Amy called
    teachers when the fight among the classmates got out of hand. Moreover, when something
    changes hands, it is passed from one owner to another. For example, the iPhone
    13 has changed hands several times, and now Sean owns it. If you have your hands
    full, you are very busy with something. Lastly, if something or someone is in
    good hands, it means they are taken care of well. For example, Judy’s notebook
    computer is in good hands because she always takes good care of it.

    These idioms are often used in daily conversation. Using them will make your English
    sound more natural and easier to understand! Why not give it a try?'
