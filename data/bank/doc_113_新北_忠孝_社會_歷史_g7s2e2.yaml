  stem: 西元1931年7月，嘉義農林學校(簡稱嘉農)棒球隊代表臺灣，前往日本國內參加甲子園高中棒球錦標賽，獲得亞軍。嘉農棒球隊是以臺灣本地青年、原住民為主體，日本人為輔，一路從臺灣的資格賽打到日本高中棒球的最高殿堂，接連過關斬將，最終成功闖進總冠軍賽，樹立日治時期臺灣青少年棒球難能可貴的競賽紀錄。這批年輕人為自己贏得了「英雄戰場，天下嘉農」的美譽，揚名全臺。嘉義農林學校在日治時期，屬於哪一種類型的教育制度？
