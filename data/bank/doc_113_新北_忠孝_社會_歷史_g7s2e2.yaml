  section: 1
  number: 33
  type: single
  page: 1
  stem: '民國 35 年台灣的經濟現象如下敘述：

    生產力下降，失業人口激增，物價數倍高漲。

    雞蛋漲 8 倍，鹽漲 18 倍，糖漲 20 倍，茶葉漲 5 倍，

    米價漲了 50 倍。

    平日米糖之鄉的臺灣，卻反而米糖短缺，價格比上海、廈門等地貴出很多。

    上述物價暴漲，應導因於何者？'
  options:
