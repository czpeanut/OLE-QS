    content: 二戰期間美軍轟炸臺灣，戰後無力復甦。
  - label: B
    content: 政府發行新臺幣以取代舊臺幣的政策失效。
  - label: C
    content: 美國對臺提供援助，物價以美金計價，價格不斷上升
  - label: D
    content: 國共內戰，臺灣資源多用於支援戰爭，米糧嚴重短缺
