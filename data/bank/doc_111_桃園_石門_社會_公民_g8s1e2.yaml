  stem: 衛福部網站公布如下訊息：「負擔家庭主要生計者死亡、失蹤、罹患重傷病、失業或因其他原因無法工作，導致家庭生活陷於困境，可申請「速訪、速核、速發」急難紓困金，程序為通報後24小時內訪視小組即會進行實地訪視送核定，機關當日核定後24小時內發放關懷救助金一至三萬；若經過認定屬急迫個案，訪視時將立即先發給新台幣五千元救助金」，請問：上述主要保障人民何項基本權利？
