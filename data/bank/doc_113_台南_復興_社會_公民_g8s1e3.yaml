  group_stem: '2024年美國總統選舉11月5日登場，民主黨候選人賀錦麗與共和黨候選人川普在經濟政策、永續發展、移民問題及外交政策上皆有自己的主張，也各有強而有力的支持者相挺，選前民調也十分膠著，讓這場牽動全世界脈動的選舉備受關注。美國總統大選採二階段投票，情況簡述如下：


