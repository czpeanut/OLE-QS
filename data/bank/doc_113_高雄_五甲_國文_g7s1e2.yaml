  stem: 有關背影一文的敘述，下列選項何者正確？
  options:
  - label: A
    content: 文章中多次提及「愛」，圍繞著「愛」字描述，字裡行間充滿父親對他的愛與關懷，可說是「辭盡乎情」
  - label: B
    content: 透過「現在-過去-現在」的時間安排寫法，作者實寫四次父親的背影，表達自己在父喪中，感受到父親內斂拘謹的愛
  - label: C
    content: 文章用抽象的意念來說明具體的父愛，例如「背影」是全文焦點，可用來象徵父愛，也暗示許多事理往往在正面不易察覺，卻在背後發現體悟
  - label: D
    content: 運用細膩的特寫鏡頭刻畫父親不穩的步伐和上下月臺的艱辛，呈現父親對兒子的愛
