- id: doc_111_桃園_同德_國文_g9s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 「《孟子》，戰國時孟子的論著，係孟子的弟子公孫丑、萬章等人所記錄。孟子，名軻，鄒人，受業於孔子之孫子思的門人，是繼孔子之後儒家的大師，被稱為『亞聖』。孟子政治學說的核心是仁政，提出『民為貴，社稷次之，君為輕』」的民本思想，主張國君應保障人民的基本生活。此外，他哲學思想的基礎是『性善論』，認為人性中擁有善性，透過良好的教育能讓人民保有這種良善本性。」根據上文，下列敘述何者正確？
  options:
  - label: A
    content: 《孟子》係公孫丑、萬章等為老師所寫的傳記
  - label: B
    content: 孟子曾受到孔子教導，畢生提倡儒家學說
  - label: C
    content: 孟子強調施行仁政，可提升人民基本素養
  - label: D
    content: 孟子認為推行教化可讓人保有原本的善性。
  tags:
    textbook: 九上 第八課 孟子選：生於憂患死於安樂
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 九上
      subject: 國文
      code: 第八課
      title: 孟子選：生於憂患死於安樂
      chapter: null
