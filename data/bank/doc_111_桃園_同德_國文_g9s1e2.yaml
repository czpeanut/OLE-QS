  section: 2
  number: 33
  type: single
  page: 6
  stem: '本詩作者想要抒發的情緒包含以下哪些？

    甲、心心念念，輾轉反側

    乙、心心相印，兩情相悅

    丙、惶惶不安，惴惴終日

    丁、反反覆覆，忐忑矛盾

    戊、自責埋怨，悔不當初

    已、輕率隨意，閒適恬淡'
