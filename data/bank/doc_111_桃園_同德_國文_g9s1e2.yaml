  stem: 根據《維基百科》的定義，下列各迷因圖，何者採取「雙關」用法？
  options:
  - label: A
    content: ''
    asset:
      key: optA
      file: doc_111_桃園_同德_國文_g9s1e2/1_24_optA.png
  - label: B
    content: ''
    asset:
      key: optB
      file: doc_111_桃園_同德_國文_g9s1e2/1_24_optB.png
  - label: C
    content: ''
    asset:
      key: optC
      file: doc_111_桃園_同德_國文_g9s1e2/1_24_optC.png
  - label: D
    content: ''
    asset:
      key: optD
      file: doc_111_桃園_同德_國文_g9s1e2/1_24_optD.png
  group_stem: "以下為《維基百科》「雙關」的資訊頁面\n\n雙關\n雙關是一種修辭方法，利用諧音或借義，使一個句子可以理解成多種意思。^[1]^\n\n\
    ◆ 諧音雙關\n利用相近字詞的諧音構成多種含義。\n示例\n* 漢語：東邊日出西邊雨，道是無「晴」卻有「晴」？（劉禹錫《竹枝詞》末句），「晴」字和「情」字諧音，字面意思是天氣反覆無常，借指感情讓人無法捉摸。\n\
    * 英語：A bicycle can't stand on its own because it is 「two tired」. 這句話的表面意思是：自行車自己不能直立放置，因為它只有兩個輪胎(two-tired)。而這句話的另外一個意思是，這輛自行車用了很長時間，它現在太累了(too\
    \ tired)，兩者發音同音。\n\n◆ 諧義雙關\n利用同一個詞的多種意思造成一個歧義句。比如「本是同根生，相煎何太急？」（曹植《七步詩》）可以算是雙關語。有時這類雙關語被看做一種比喻。\n\
    * 古漢語：蠟燭有「心」還惜別，替人垂「淚」到天明。（杜牧《贈別》）\n  * 「心」原指「燭芯」，雙關「人心」。「淚」原指「燭淚」，雙關「人淚」。\n*\
    \ 英語：「That's the power of 10」既可以指「這就是10 的次方」也可以指「這就是10 個人的力量」（TED 的影片）\n\n◆ 句義雙關\n\
    屬於「諧義雙關」的一種，一句話或一段文字雙關到兩三種事物。\n* 例句：道士一見慘然，斂棋子曰：「此『局』全輸矣！於此失卻『局』，奇哉！」（杜光庭《虯髯客傳》）\n\
    \  * 「局」，表面上講「棋局」，事實上講「天下大局」。"
