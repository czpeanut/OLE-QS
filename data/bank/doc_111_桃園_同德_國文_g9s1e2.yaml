- id: doc_111_桃園_同德_國文_g9s1e2_s2_38
  section: 2
  number: 38
  type: single
  page: 8
  stem: 關於本文，下列敘述何者正確？
  options:
  - label: A
    content: 齊人在墳場間的行徑可看出他左右逢源，人脈極廣
  - label: B
    content: 齊人到城外東郊的墳場乞討酒食，是因為家境貧窮
  - label: C
    content: 齊人妻妾責罵丈夫是因為齊人巧言令色、攀附權貴
  - label: D
    content: 齊人之妻對丈夫產生懷疑的原因是「未嘗有顯者來」。
  group_stem: "(四) 齊人     孟子\n\n    齊人有一妻一妾而處室者，其良人出，則必饜酒肉而後返。其妻問所與飲食者，則盡富貴也。其妻告其妾曰：「良人出，則必饜酒肉而後返。問其與飲食者，盡富貴也，而未嘗有顯者來。吾將瞷良人之所之也。\n\
    \    蚤起，施從良人之所之。遍國中無與立談者。卒之東郭墦間之祭者，乞其餘，不足，又顧而之他——此其為饜足之道也。\n    其妻歸，告其妾曰：「良人者，所仰望而終身也。今若此！」與其妾訕其良人，而相泣於中庭。而良人未之知也，施施從外來，驕其妻妾。\n\
    \    由君子觀之，則人之所以求富貴利達者，其妻妾不羞也，而不相泣者，幾希矣！"
