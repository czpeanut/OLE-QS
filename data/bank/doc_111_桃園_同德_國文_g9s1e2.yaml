    低頭呢喃

    對你的偏愛太過於明目張膽

    在原地打轉的小丑傷心不斷

    空空留遺憾多難堪又為難


    燈火闌珊

    我的心借了你的光是明是暗

    笑自己情緒太氾濫形隻影單

