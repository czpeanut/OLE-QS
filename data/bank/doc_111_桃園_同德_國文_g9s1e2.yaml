    content: 第一節「不敢回看\左顧右盼⋯⋯試探說晚安多空泛又心酸」意思是說：明明身為男女朋友，卻無論如何也收不到那頭的回應，每次的道晚安都是如此慘澹收場
  - label: B
    content: 第二節「低頭呢喃⋯⋯空空留遺憾多難堪又為難」意思是說：當分手終於說出口，你留我獨自一人，就像自導自演一齣戲的可憐小丑，在原地暗自心傷
  - label: C
    content: 第五節「不應該\太心軟\不大膽\太死板\不果斷」意思是：你說你不應該對自己太過心軟。在不喜歡我的你眼裡，哪哪都是缺點：過度敏感、不夠大膽、太過死板、優柔寡斷
  - label: D
    content: 第五節「不應該\捨棄了\死心了\放手了\斷念了」意思是：苦戀一個人又未果的時候，總是要經過很多次自己對自己的反覆告誡：要放下、要忘記、要解脱。
