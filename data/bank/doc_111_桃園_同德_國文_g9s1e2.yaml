- id: doc_111_桃園_同德_國文_g9s1e2_s2_36
  section: 2
  number: 36
  type: single
  page: 7
  stem: 依據作者的看法，下列何者是手機帶給人類的益處？
  options:
  - label: A
    content: 保障弱勢族群的行車安全
  - label: B
    content: 提供土產加入全球貿易的窗口
  - label: C
    content: 監聽恐怖組織，瓦解犯罪行動
  - label: D
    content: 人人都是自媒體，每個人都能被看見。
  group_stem: "(三) 移動時代的暗夜幻影    楊渡\n\n    夜間偶而在河濱公園騎自行車。那一天不知道為什麼有些路燈不亮，夜色特別暗。我沿河濱的自行車道騎，卻越來越害怕。因為慢慢行去，只見一個一個慘白的臉，飄浮在夜色中。暗夜掩蓋了他們的身體，只剩下一個一個修白的面孔，被手機的LED\
    \ 光線照得白中帶青，簡直如同鬼魅。\n    拍過恐怖電影的人都知道，要製造恐怖效果，光線是一個重要元素。平日我們的光源是太陽光，由上而下，所以陰影在下方。一般屋子裡的照明也一樣，光線多從天花板來，上下分明。但恐怖片就是要反尋常、反慣性，最重要的是光源來源必須倒過來。所以光線必須是由下而上，或者用青藍光，以有別於尋常白光，於是人的臉孔，就因為光線的倒轉，變得扭曲異常，甚至猙獰。\n\
    \    你若不信，把家中電燈全關上，用手電筒從下往上，照自己的臉孔，去照鏡子看看它變成什麼模樣，就會知道恐怖效果。如果嫌手電筒麻煩，你也可以在浴室關上燈，用手機從下方照著自己的臉，如果嫌不夠，再開點綠光助興也行。\n\
    \    如果你會感到有一點恐怖，那你就可以知道自己在暗夜中行走滑著手機的面容，在別人眼中是什麼模樣了。\n    但如果是深夜，在基隆河濱公園，看著一路飄浮的蒼白面孔，會有什麼感覺呢？老實說，有一種走在「活死人」異世界的存在感。有一夜，我忽然想起一部電影，說有人利用手機控制人類行為而最終導致人類集體被某集團控制，有如活死人。看著午夜的滑手機者，不禁令人不寒而慄。\n\
    \    但有什麼辦法呢？現代的生活愈來愈依賴移動通訊。台灣的手機應用服務還不夠好，從購物到叫車，還未全面普及，許多細節還不方便；但大陸卻已經相當的發達。以前在北京打車，常常要站在路邊等候計程車半天，現在用手機叫車，迅速便捷。這對女性夜間行車的安全也是一種保障，因為行車動線，從上車到下車都在行動衛星掌握之中。最後再用手機刷一下，即付帳了事。\n\
    \    至於生活中的消費，包括線上買書購物，吃飯付帳等，都不必帶錢，手機一滑搞定。這確實是生活方式的一種革命。有人批判這樣的消費模式會導致尋常店家的消失，包括一般書店也會被打垮。而金流、物流、服務業，卻將變成最主要的行業。\n\
    \    然而，它也讓人看到一些新的希望。例如在北京，你可以在晚餐吃到山西老鄉古法製作的原生態蕎麥麵，細麵中空，有如義大利麵，口感奇佳。它來自一個鄉村，卻在網路上因行家推薦而大紅。這個小村因此有了擺脫貧困的機會。新的物流，把最偏遠鄉村都捲入到全世界的市場之中。\n\
    \    然而，它也帶來另一種危機。所有人的行動，都在GPS 的監控之下。老大哥如果存在，隨時可以控制社會的每一個角落。不僅是個人，連政府部門誰的車輛到什麼地方，都一清二楚。如果發生戰爭會如何呢？遠的不說，美國轟炸IS領導人的情報，有一部分即是自監聽而來，那麼兩岸之間，又會如何？\n\
    \    坦然而言，新時代的媒體最艱難的是如何把自己擠入每一個人的手機裡，在那小小的格子中，成為被下載使用的一個。這一場戰爭，其實就是爭取他人生命時光的戰爭。你得要擠入手機，才能取得被看見的機會，而被看見的時間，依照台灣滑手機的習慣，不會太長，就是幾秒到1\
    \ 分鐘之間。而每個人的生命時光，又有多少個幾分鐘可以和人分享？\n    移動時代，是一個艱難的課題。我們都必須適應而且運用它。但再適應，也不應該如河濱公園裡那些浮動的慘白面容吧。明明是在運動健走，卻沒有把心帶出來，只是如行尸走肉般低頭看手機。看不到人的面容的世界，還有真實嗎？\n\
    \    對那些不真實的臉，我存在一個頑皮小孩的想像。每一次看見有人低頭滑動手機，彷彿真實世界不存在，我就忍不住想騎到他們的旁邊，用惡作劇的心態，對著那些低頭失魂的耳朵，驚嚇地大喊一聲：「哇哈！醒來吧！」\n\
    \    可惜至今還不好意思這麼做。"
