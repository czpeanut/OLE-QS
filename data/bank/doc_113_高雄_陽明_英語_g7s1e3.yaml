  section: 2
  number: 45
  type: single
  page: 9
  stem: What are Jane and Lisa talking about?
  options:
  - label: A
    content: A cool device.
  - label: B
    content: A smart woman.
  - label: C
    content: A nice restaurant.
  - label: D
    content: Their favorite food for lunch.
  group_stem: 'Lisa: Amy, what time is it?

    Amy: Let me check.... It''s eleven fifteen.

    Jane: Lisa, who are you talking to? There is nobody else here－only you and me.

    Lisa: I''m talking to the white device over there. Do you see it?

    Jane: You are talking to a DEVICE? Are you kidding me?

    Lisa: No, I''m serious. That white device has a name. It''s Amy.

    Jane: Wait. Why does the device have a name? Isn''t it just a device?

    Lisa: Well, it''s not only a device. It''s like a secretary at home. You can ask
    her many things.

    Why not try it out yourself?

    Jane: Sure. Amy, can you recommend something for our lunch?

    Amy: Let me check the weather first. It''s a little cold, so you might want to
    have hot pot. Josh Restaurant on Forest Street is famous for its hot pot.

    Jane: Wow, she is cool! There''s a restaurant around here. How does she know that?

    Lisa: That''s because she has maps inside, and that makes her know everything
    about this place.

    Jane: That''s amazing. What else can she do?

    Lisa: You can ask her to order food for us at the restaurant. And someone will
    deliver the food to our place. Try it.

    Jane: Okay. Amy, please order beef hot pot for us at Josh Restaurant.

    Amy: Sure. (Ordering....) It will arrive here within 15 minutes.

    Jane: She really is a wonderful secretary.

    Lisa: You bet.


     kid 開玩笑 serious 認真的 why 為什麼 secretary 秘書 try out 試用

