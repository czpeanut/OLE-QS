  section: 2
  number: 42
  type: single
  page: 8
  stem: What is the dialogue about?
  options:
  - label: A
    content: Kei's cool life in Japan.
  - label: B
    content: Ann's radio program in Taiwan.
  - label: C
    content: Special breakfast stands in Taiwan.
  - label: D
    content: Life differences between Japan and Taiwan.
  group_stem: '(Ann is interviewing Kei on air.)

    Ann: Good evening. This is Ann Lin. Welcome to today''s radio program.

    Today, we have a special guest from Japan, Kei.

    Kei: Hello, I am Kei. It''s my pleasure to be here with you.

    Ann: Is your life in Taiwan different from that in Japan?

    Kei: Sure. There are so many differences. I was so surprised.

    Ann: Let''s start with breakfast.

    Kei: In Japan, moms usually prepare breakfast at home. For example, I often have
    rice, miso soup, and grilled fish. However, in Taiwan, there are so many breakfast
    stands or shops. My homestay mom buys breakfast all the time. I can order my favorite
    food.

    Ann: We do have many breakfast choices here. How about school?

    Kei: Both students in Japan and Taiwan have to wear uniforms. Besides , we wear
    white indoor slippers in the classroom, but I don''t have to change shoes in Taiwan.

