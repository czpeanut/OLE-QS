  stem: 關於吃筍的知識，哪一個選項正確？
  options:
  - label: A
    content: 含𥳔筍的產季在箭竹筍之後
  - label: B
    content: 棘竹筍具生髮的療效
  - label: C
    content: 南漢這地區全年皆產筍子
  - label: D
    content: 䝁竹筍滋味肥美。
  group_stem: '《永嘉記》曰：「含𥳔①竹筍，六月生，迄九月，味與箭竹筍相似。凡諸竹筍，十一月掘土取皆得，長八九寸。長澤民家，盡養黃苦竹。永寧南漢，更年上筍，大者一圍五六寸。明年應上今年十一月筍，土中已生，但未出，須掘土取；可至明年正月出土訖。五月方過，六月便有含𥳔筍。含𥳔筍迄七月、八月。九月已有箭竹筍，迄後年四月。竟年常有筍不絕也。」

    《竹譜》曰：「棘竹筍，味淡，落人鬢髮。䝁②、𥭕二筍，無味。雞頸竹筍，肥美。篃竹筍，冬生者也。」

    《食經》曰：「淡竹筍法：取筍肉五六寸者，按鹽中一宿，出，拭鹽令盡。煮糜一斗，分五升與一升鹽相和。糜熱，須令冷，內竹筍醎③糜中一日。拭之，內淡糜中，五日，可食也。」──《齊民要術卷五‧種竹第五十一》

    註：①ㄉㄨㄛˋ，竹名②䝁，ㄌㄠˊ，野豆。③鹹的異體字。'
