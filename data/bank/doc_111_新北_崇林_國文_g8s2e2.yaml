  section: 5
  number: 1
  type: single
  page: 3
  stem: 關於〈再鴻門〉一節的理解，哪一項錯誤？
  options:
  - label: A
    content: 歷史學家試著從史料記錄中還原曾發生的事件
  - label: B
    content: 歷史事件在被記錄的過程中，可能會有所增減
  - label: C
    content: 歷史都是後世學者所記錄的事件，所以真實性不足
  - label: D
    content: 在閱讀史料記錄時，要留意不被作者主觀立場影響。
  group_stem: '2．記史：再鴻門

    是一頭麒麟，被時間鏤空的歷史／是一頭封鎖在竹簡內部的麒麟／「沉睡，但未死去。」／司馬遷研磨著思維與洞悉／在盤算，如何喚醒並釋放牠的蹄。／／敘述的大軍朝著鴻門句句推進／「這是本紀的轉折必須處理……」／「但有關的細節和對話你不曾聆聽！」／「歷史也是一則手寫的故事、／一串舊文字，任我詮釋任我組織。」／／寫實一頭遙傳的麟獸／寫實百年前英雄的舉止與念頭／再鴻門──他撒豆成兵運筆如神／亮了燭，溫了酒，活了人／樊噲是樊噲，范增是范增／歷史的骷髏都還原了血肉──在鴻門！／／劍拔弩張的文言文，點睛的版本／麒麟在他嚴謹的虛構裡再生。

    3．構詩：不再鴻門

    本紀是強悍的胎教定型了大腦／情節已在你閱歷裡硬化／可能結石在膽，可能開始潰爛盲腸／八百行的敘事無非替蛇添足／不如從兩翼顛覆內外夾攻！／／但我只有六十行狹長的版圖／住不下大人物，演不出大衝突／我的鴻門是一匹受困的獸／在籠裡把龐大濃縮，往暗處點火：／／不必有霸王和漢王的夜宴／不去捏造對白，不去描繪舞劍／我要在你的預料之外書寫／寫你的閱讀，司馬遷的意圖／寫我對再鴻門的異議與策略／同時襯上一層薄薄的音樂……

    ﹝節選自陳大為〈再鴻門〉'
