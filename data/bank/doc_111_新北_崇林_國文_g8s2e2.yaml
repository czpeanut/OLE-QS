  section: 5
  number: 8
  type: single
  page: 5
  stem: 哪一個人應該不是文中所提到的「年輕照顧者」？
  options:
  - label: A
    content: 橘子：每天上學時帶妹妹來崇林附幼上課
  - label: B
    content: 佐助：雙親離婚後各自再婚，目前跟著80 歲奶奶同住，靠父親給的家用過日子
  - label: C
    content: 鳴人：跟著媽媽住在安寧病房，從醫院通勤到學校上課，週末時在7-11 打工
  - label: D
    content: 炭治郎：寫完功課後，幫患有腦性麻庳的哥哥做腿部按摩。
