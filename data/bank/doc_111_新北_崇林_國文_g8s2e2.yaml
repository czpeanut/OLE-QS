- id: doc_111_新北_崇林_國文_g8s2e2_s5_3
  section: 5
  number: 3
  type: single
  page: 4
  stem: 「文武不備，良民懼然身修者，官未曾亂也。」在法規不完備的狀況下，百姓依然能遵守法令，太史公覺得背後的原因是？
  options:
  - label: A
    content: 沒有官員叛國擾亂天下
  - label: B
    content: 官制安排沒有出亂子
  - label: C
    content: 老百姓活在恐懼高壓下
  - label: D
    content: 為官者立身端正不違反網紀。
  group_stem: '太史公曰：「法令所以導民也，刑罰所以禁姦①也。文武②不備，良民懼然身修者，官未曾亂也。奉職循理，亦可以為治，何必威嚴哉？」

    孫叔敖者，楚之處士③也。虞丘相進之於楚莊王，以自代也。三月為楚相，施教導民，上下和合，世俗盛美，政緩禁止，吏無姦邪，盜賊不起。秋冬則勸民山採，春夏以水④，各得其所便，民皆樂其生。

    莊王以為幣輕，更以小為大，百姓不便，皆去其業。市令言之相曰：「市亂，民莫安其處，次行不定。」相曰：「如此幾何頃乎？」市令曰：「三月頃。」相曰：「罷，吾今令之復矣。」後五日，朝，相言之王曰：「前日更幣，以為輕。今市令來言曰『市亂，民莫安其處，次行之不定』。臣請遂令復如故。」王許之，下令三日而市復如故。

    楚民俗好庳車⑤，王以為庳車不便馬，欲下令使高之。相曰：「令數下，民不知所從，不可。王必欲高車，臣請教閭里使高其梱⑥。乘車者皆君子，君子不能數下車。」王許之。居半歲，民悉自高其車。

    此不教而民從其化，近者視而效之，遠者四面望而法之。故三得相而不喜，知其材自得之也；三去相而不悔，知非己之罪也。 ──《史記‧循吏列傳》

    註：①邪惡詐偽之事②本義指文治（禮樂教化）和武功，這裡指行政法規和刑罰③隱居不仕的人④一本作「春夏以水下」，意為春夏時節借河水上漲使採伐的林木順流而下運出去⑤矮車，車的底座低⑥門限，即門檻'
