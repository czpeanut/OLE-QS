- id: doc_111_新北_崇林_國文_g8s2e2_s4_4
  section: 4
  number: 4
  type: single
  page: 1
  stem: 關於各課作者的介紹，哪一個選項正確？
  options:
  - label: A
    content: 徐志摩自海外歸國後，在大學教授西洋哲學，其作文充滿熱情和理想，辭采華麗，音律優美
  - label: B
    content: 司馬遷，字子長，繼承父職，擔任漢武帝時的太史令，其《史記》一書，首創以人物傳記為主的史書書寫模式
  - label: C
    content: 周惠民為知名歷史學者，除了研究中、德關係史及世界近代史之外，對於器物服飾史頗有興趣，不但在大學開設課程，也在雜誌上撰寫短文
  - label: D
    content: 阿布醫學系畢業後，曾服役於貝里斯醫療團，現為心理科醫師，兼擅詩及小說，從醫的經歷使其對人生的際遇順逆有著深刻透澈的領悟。
  tags:
