    | B | 約兒：玻璃罐頭製作時，採用沸水加熱與阻絕空氣二道工序，都是為了防止食物腐敗。 |

    | C | 弗朗基：「鐵皮罐頭問世後，因沒有適用的開罐工具，士兵用刺刀、斧頭開罐頭」，說明士兵訓練有素。 |

    | D | 尤利：鐵皮罐頭的製作工法，從沿用沸水加熱法，到後來採高溫蒸氣殺菌來防腐。 |'
