  section: 4
  number: 8
  type: single
  page: 1
  stem: '關於〈張釋之執法〉一文的筆記，誰的有錯誤？

    | A | 橘子：縣人回話的句子短，急促，暗示他心中氣憤難平 |

    | B | 小丸子：從漢文帝的話語中可以看出對張釋之的不滿，覺得縣人冒犯帝王車駕，應予重懲 |

    | C | 喬巴：張釋之提出「法者，天子所與天下公共也」，強調法律之前，人人平等 |

    | D | 小智：「廷尉，天下之平也，一傾而天下用法皆為輕重」，可用「上梁不正下梁歪」說明執法不公會引發的後患 |'
  options:
  - label: A
    content: 橘子
  - label: B
    content: 小丸子
  - label: C
    content: 喬巴
  - label: D
    content: 小智。
