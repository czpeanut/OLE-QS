  page: 2
  stem: '關於〈拍痰〉一文的理解，哪一項錯誤？

    | A | 赤木：「痰」在文中最明顯可見的是病人支氣管中的分泌物，對健康有所妨害 |

    | B | 流川：「痰」文中也是象徵，象徵外籍看護在心中負面的陰影，包括工作時的壓力、異地工作的不適應 |

    | C | 宮城：外籍看護對醫療知識也許不甚精通，但明白病人身體的痛苦，對他們無法返家的孤寂也能產生共鳴 |

    | D | 櫻木：病患住院時，從一開始滿是水果花籃到後來的冷清無人聞問，證明世人只想省錢的儉嗇性格 |'
  options:
