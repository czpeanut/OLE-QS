- id: doc_111_新北_崇林_國文_g8s2e2_s5_7
  section: 5
  number: 7
  type: single
  page: 5
  stem: 那一個選項不屬於年輕照顧者會面臨的困境？
  options:
  - label: A
    content: 必須接受各方援助
  - label: B
    content: 犠牲正常受教權
  - label: C
    content: 提早承擔成人的責任
  - label: D
    content: 找不到理想的工作。
  group_stem: '「來不及長大，就為長照交出人生」──年輕照顧者的日與夜 願景工程基金會／周妤靜

    在「願景工程」採訪的年輕照顧者中，有的孩子年僅五歲就開始分擔家務、替行動不便的父親擦背；也有孩子從七歲開始替癱瘓的母親更換尿布。「學業」和「照顧」輪替，構成年輕照顧者的日與夜；倘若年輕世代逐漸滑向「照顧」的角色，偏離了學校教育，他們的未來會有怎樣的衝擊與損失？

    「看長遠的，年輕照顧者犧牲的是未來的人生。」家庭照顧者關懷總會理事長郭慈安指出，學生為照顧中輟、延後就業，可能從此找不到理想的工作。

    「澳洲政府認為這是國安問題。」郭慈安說，年輕人就業困難，影響的是國家的生產力與競爭力，且當他們無法保障自己的生活，國家還是得負起責任。「年輕照顧者」議題已在各國浮現。有遠見的國家提出對策──澳洲教育部確立年輕照顧者的轉介流程：學校發現學生有照顧家人的事實，第一要為學生安排心理輔導、第二是為學生連結長照資源。郭慈安說，「澳洲政府發宏願，要讓年輕照顧者都能從高中畢業、不輟學。」

    英國做了全國性調查研究。英國諾丁漢大學推估，高達20％在學生正在承擔照顧責任。為了保障18 歲以下年輕照顧者的權利，英國政府派社工評估年輕照顧者的照顧能力及意願、了解他們的生涯規劃以連結資源，避免年輕照顧者為長照犧牲自己的未來。

    反觀台灣政府對於年輕照顧者的困境毫無危機感，不僅沒有基礎人數的調查與對策，還持續舉辦「全國孝行獎」，歌頌未成年兒少對親人的照顧，境遇愈是可憐愈容易得獎，以彰顯「孝行」。以媒體報導的孝行獎得主事蹟來看：七歲孫得獨力照料八旬全盲祖母；十三歲女孩一人照料病母、斷指弟、高齡祖母。有些得獎者為了照顧病倒親人，甚至要半工半讀，維持家庭收入。

    家庭照顧者關懷總會秘書長陳景寧強調，兒少是需要被大人、政府照顧的對象，政府應該檢討：為什麼孩子得犧牲受教權、遊戲權，各種「當小孩」的本分來照顧親人？國家該做的不是「頒獎鼓勵小孩受苦」，而是思考如何介入、讓他們好好成長。陳景寧指出，「孩子遇到磨難的當下，如果有人陪伴，也許後面的人生不會這麼辛苦。」'
