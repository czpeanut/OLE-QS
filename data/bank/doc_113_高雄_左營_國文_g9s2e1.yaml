  - label: D
    content: 貲至巨萬，而賑贍宗族。
  group_stem: "樊重，字君雲。世善農稼，好貨殖。重性溫厚，有法度，三世共財，子孫朝夕禮敬，常若公家。其營經產業，物無所棄；課役童隸，各得其宜。故能上下戮力，財利歲倍，乃至開廣田土三百餘頃。又池魚牧畜，有求必給。嘗欲作器物，先種梓漆，時人嗤之。然積以歲月，皆得其用。向之笑者，咸求假①焉。貲②至巨萬，而賑贍宗族，恩加鄉閭。外孫何氏，兄弟爭財，重恥之，以田二頃解其忿訟。縣中稱美，推為三老。年八十餘終，其素所假貸人間數百萬，遺令焚削文契。債家聞者皆慚，爭往償之。諸子從敕③，竟不肯受。\n\
    \                                                                            司馬光〈溫公家範〉\n\
