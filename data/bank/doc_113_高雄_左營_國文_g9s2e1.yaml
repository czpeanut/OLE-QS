  stem: 下列哪一句話最能表現瑪莎多情的性格？
  options:
  - label: A
    content: 瑪莎小姐今年四十歲了，有兩千元存款、兩枚假牙，還有一顆比剛出爐的麵包還柔軟的心
  - label: B
    content: 瑪莎將一幅廉價買來的威尼斯風景畫擺在櫃檯後
  - label: C
    content: 瑪莎靈機一動，迅速從櫃檯下拿出新鮮的黃油，塞進他買的快過期麵包裡
  - label: D
    content: 她默默地回到後房，她脫下藍點子的綢背心，換上那件褪色的舊衣服。。
  group_stem: "(二)\n    瑪莎是街角麵包店的老闆娘，四十歲，有兩千元存款、兩枚假牙，還有一顆比剛出爐的麵包還柔軟的心。店裡來了一位特別的顧客，他總是挑選快過期的麵包，那種五分錢可以買兩個的硬麵包。\n\
    \    這位中年男子戴著厚厚的鏡片，留著修剪整齊的棕色鬍子，說著一口濃重的德國口音。「早安，夫人，」他總是這樣有禮貌地問候，然後用帶著歉意的眼神說：「還是老樣子，兩個硬麵包，謝謝。」瑪莎注意到他手指上總有一塊淡淡的紅褐色污漬，心想，這一定是位窮困的藝術家，住在閣樓裡，靠著硬麵包果腹，卻堅持創作。\n\
    \    為了證實自己的猜測，瑪莎將一幅廉價買來的威尼斯風景畫擺在櫃檯後。畫裡有座雄偉的大理石宮殿、幾艘搖曳的平底船，和一片彷彿永遠不會放晴的陰鬱天空。幾天後，那位顧客來了，買麵包時，他推了推鼻梁上的眼鏡，仔細端詳著那幅畫。「夫人，這幅畫…」他欲言又止。\n\
    \    「您覺得怎麼樣？」瑪莎充滿期待地問。「宮殿畫得不太好，透視法，不太真實。」他略帶嚴肅地說，隨即又恢復了溫和的表情「再會，夫人。」說完，他拿起麵包，微微鞠躬後便離開了。瑪莎心想，果然是位眼光精準的藝術家！\n\
    \    他成了店裡的常客，偶爾會和瑪莎小姐閒聊幾句。瑪莎注意到他似乎瘦了一點，精神也有些萎靡。她很想在他的食物裡加些好料，卻又不敢冒犯藝術家敏感的心。瑪莎開始在店裡穿上她珍藏的藍點子綢背心，還偷偷用榅桲子和硼砂自製美容液。\n\
    \    一天，舊火車的尖銳鳴叫聲劃破了寧靜。顧客也像其他人一樣，好奇地跑到門口張望。瑪莎靈機一動，迅速從櫃檯下拿出新鮮的黃油，塞進他買的快過期麵包裡。她心跳加速，期待著他的反應。\n\
    \   沒想到，幾天後，有兩個男人到店裡。一個是叼著煙斗的年輕人——她以前從沒見過，另一個就是她的藝術家。他怒氣沖沖地，帽子歪了，頭髮也亂了，捏緊拳頭，狠狠地朝瑪莎小姐搖晃，漲紅著臉對著瑪莎大吼：「Dummkopf!\
    \ （笨蛋！）Tausendonfer! （千雷轟頂的！）」「你，妳把我給毀了！」他用顫抖的手指著瑪莎，藍眼睛裡充滿怒火，「妳是個惹人厭的老貓！」\n  \
    \  年輕人趕緊上前阻止他，並向瑪莎解釋：「夫人，布盧姆伯格先生是位建築圖樣設計師，他在繪製一份新市政廳的平面圖，辛辛苦苦地幹了三個月。準備參加有獎競賽。他昨天剛上完墨。你明白，製圖員總是先用鉛筆打底稿的。上好墨之後，就用快過期的麵包屑擦去鉛筆印。他用您店裡賣的快過期麵包屑擦拭墨線。」年輕人頓了頓，面露尷尬，「今天，您知道的，麵包裡有黃油，他的設計圖，全毀了，現在只能拿去包三明治了！」\n\
    \    瑪莎聽了，如遭雷擊。她默默地回到後房，脫下藍點子的綢背心，換上那件褪色的舊衣服。她將精心調製的美容液倒進垃圾桶，一切都像一場荒唐的夢。\n   \
    \                                                                       改寫自歐亨利〈女巫的麵包〉"
