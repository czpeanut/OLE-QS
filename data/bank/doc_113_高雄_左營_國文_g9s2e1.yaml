    \ 第二名：讓眼睛和大腦休息。所謂有效的休息，就是「讓大腦休息」，也就是把大腦關機。換言之，什麼事情都不做，意外地反而是件好事。有些人累了會趴在桌子上休息，這也是很好的一種休息方法。閉上眼睛休息幾分鐘，這種類似小睡的作法，可以讓大腦獲得恢復。閉上眼睛冥想或是做正念練習，也是不錯的方法。\n\
    \    第三名：交流、閒聊。使用跟工作無關的大腦，等於是讓跟工作有關的大腦休息。\n根據研究顯示，有多達41.4%的人不會利用工作的空檔休息。有休息的人當中，休息次數少於「每2\
    \ 小時休息1 次」的人，也多達83.5%。也就是說，只有大約10%不到的人，懂得「有效的休息方法」，其他九成的人都是用沒有效率的「錯誤方法」在休息。\n\
    \                                                                            \
    \   摘錄改寫自《天下雜誌》"
