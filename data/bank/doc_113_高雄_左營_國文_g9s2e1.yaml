  group_stem: "(四)\n    蕭山櫻桃鴛鳥蓴菜皆知名，而蓴尤美。蓴采自西湖，浸湘湖一宿，然後佳。若浸他湖，便無味。浸處亦無多地，方圓僅得數十丈許。其根如符，其葉微類初出水荷錢。其枝丫如珊瑚而細，又如鹿角菜。其凍如冰，如白膠附枝葉間，清液冷冷欲滴。其味香粹滑柔，略如魚髓蟹脂，而清輕遠勝。半日而味變，一日而味盡；比之荔枝，尤覺嬌脆矣。其口可以寵蓮嬖①藕，無得當者。唯花之中之蘭，果中之楊梅，可異類作配耳。惜乎此物東不逾紹，西不過錢塘江，不能遠去，以故世無知者。余往仕吳，問吳人張翰②蓴作何狀，吳人無以對。果若爾，季鷹棄官，不為折本③矣。然蓴以春暮生，入夏數日盡，秋風鱸魚，將無非是？抑千里湖中，別有一種蓴邪？湘湖在蕭山城外，四匝皆山。余游時，正值湖水為漁者所盜，湖面甚狹。行數裡即返舟，同行陶公望\
