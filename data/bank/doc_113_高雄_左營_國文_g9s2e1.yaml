  group_stem: "(三)\n   一家大小和左右鄰居的幾個大人，聚集在小廳堂一盞一百燭光的垂燈下，好奇地帶著幾分爭搶，傳著看一片用線條陰刻觀音佛像的雞血石。大家不平，紛紛議論。\n\
    \  在夜市地攤，殺了對折，花了身上僅有的六千塊錢，才偷買到這片雞血石的老阿媽，孤立在一旁，聽人責罵騙徒和講她老倒顛①的話，心裡十分自責難過。雞血石她愛，刻上觀音佛祖她更心愛，哪知道雞血石是假的？\n\
    \  「阿媽，我們去報警找他！」教書的孫子帶著老人和幾個大人往夜市走。老阿媽手拿著雞血石，心裡希望把錢要回來。她看看雞血石，看看觀音佛祖。\n  走到半路，老阿媽突然回頭往家裡走。任憑年輕人怎麼叫都不回頭。他們只聽到老阿媽說：「我是買觀音、我是買觀音……」\n\
    \                                                                            \
    \        黃春明〈買觀音〉\n【注釋】①老倒顛：老糊塗。罵人年老而言行反覆無常。"
