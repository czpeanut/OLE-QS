- id: doc_113_高雄_左營_國文_g9s2e1_s3_41
  section: 3
  number: 41
  type: single
  page: 5
  stem: 從本文可以推論出，若想提高工作效率和專注力，最有效的策略是：
  options:
  - label: A
    content: 每天休息時間越長越好，減少工作時間
  - label: B
    content: 每天安排固定的運動時間和多次短暫休息
  - label: C
    content: 減少休息時間，長時間集中工作
  - label: D
    content: 完全避免休息，將精力集中在工作上 ◦
  group_stem: "(一)\n    想要維持專注力、提高工作效率，一定要懂得如何聰明地休息。德國康士坦茲大學的研究發現，「下班時如果累到筋疲力盡，回到家後不管再怎麼休息，也無法恢復。」\
    \ 如果不想把疲勞帶到隔天，工作中也要懂得有效地休息。既然如此，「最有效的休息方法」到底是什麼呢？ 在這之前，我們先來看看「最糟糕的三種休息方法」。\n \
    \   第一名：滑手機。說到休息，大部分的人通常都是休息時間一到，馬上就從口袋拿出手機檢查LINE 和訊息，或是瀏覽新聞和報導，或是玩起手遊來。對大多數的人而言，「休息＝滑手機」，這種說法一點也不為過。可是，休息時間滑手機可以說是「最糟糕的休息方法」。這是因為大腦處理視覺情報必須花上80%的效能。換言之，「用眼」就等於「強迫大腦工作」。既然「工作＝用眼」，那麼至少休息的時候就應該要讓「眼睛」和「大腦」休息才對。\n\
    \    第二名：久坐不動。久坐不動對健康的危害非常大，還會使得大腦的工作效率變差，等於「連續久坐1 個小時，平均壽命就縮短22 分鐘」。 研究顯示，站起來就算不動，也有刺激前額葉的效果，還能提升專注力和工作記憶。因此，至少休息的時候應該「站起來」或「走一走」才對。\n\
    \    第三名：累了才休息。有些人幹勁一來，可以連續工作好幾個小時都不用休息。其實這樣對健康非常不好。 美國貝勒大學針對休息次數和休息結束後的心情做了研究調查，發現「就算休息時間短，不過只要次數頻繁，一樣有效」、「如果休息次數少，除非每次休息的時間長，否則疲勞無法獲得消除」。綜合以上內容，在感覺到疲勞之前，頻繁地進行「短時間的休息」，才是最有效的休息方法。\n\
    \    至於想要維持專注力，在感到疲勞之前就要 「一點一點地」多多休息。最有效的三種休息方法如下：\n    第一名：運動。如果要舉例一種最有效的休息方法，那就是「運動」了。例如\
    \ 「伸展運動」：雙手往上伸直、往前伸直、轉一轉肩膀等，簡單的伸展運動，也會發揮不錯的清醒效果；「爬樓梯」：上下樓梯也是短時間內就能達到極大運動量的一種運動。邊走邊告訴自己「爬樓梯能提升專注力」，做起事情來自然也會變得比較有幹勁；「\
    \ 走一走，動一動」：休息的時候不要再一直坐著不動。稍微站起來走一走，總之就是站起來離開座位，就算只是一小段距離也好，藉著「走動」轉換一下心情。\n   \
    \ 第二名：讓眼睛和大腦休息。所謂有效的休息，就是「讓大腦休息」，也就是把大腦關機。換言之，什麼事情都不做，意外地反而是件好事。有些人累了會趴在桌子上休息，這也是很好的一種休息方法。閉上眼睛休息幾分鐘，這種類似小睡的作法，可以讓大腦獲得恢復。閉上眼睛冥想或是做正念練習，也是不錯的方法。\n\
    \    第三名：交流、閒聊。使用跟工作無關的大腦，等於是讓跟工作有關的大腦休息。\n根據研究顯示，有多達41.4%的人不會利用工作的空檔休息。有休息的人當中，休息次數少於「每2\
    \ 小時休息1 次」的人，也多達83.5%。也就是說，只有大約10%不到的人，懂得「有效的休息方法」，其他九成的人都是用沒有效率的「錯誤方法」在休息。\n\
    \                                                                            \
    \   摘錄改寫自《天下雜誌》"
