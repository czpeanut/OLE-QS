- id: doc_113_屏東_明正_自然_g8s1e1_s3_17
  section: 3
  number: 17
  type: single
  page: 3
  stem: 細懸浮微粒 $\text{PM}_{2.5}$ 中的 2.5 是代表微粒的哪一個物理量？
  options:
  - label: A
    content: 質量
  - label: B
    content: 長度
  - label: C
    content: 體積
  - label: D
    content: 密度
  group_stem: '◎ 請在閱讀下列敘述後，回答第17~ 20 題：

    臺灣的空氣汙染主要來源為工廠、發電廠及汽機車排放的廢氣等，這些汙染源所產生的細懸浮微粒又以 $\text{PM}_{2.5}$ 最多，$\text{PM}_{2.5}$
    代表顆粒直徑在2.5 微米之粒子。世界衛生組織訂定若空氣 $\text{PM}_{2.5}$ 濃度超過10 微克／立方公尺，會危害民眾身體，美國、臺灣與歐盟將標準分別訂為12、15
    與20 微克／立方公尺。

    臺中火力發電廠是臺灣發電量最大的電廠，它的二氧化碳排放量亦為世界第一，是中部空氣主要的汙染源。臺灣的地形也是惡化臺灣空氣汙染的重要因素，高聳連綿的中央山脈，容易在冬天的時候阻擋東北季風吹散中南部空氣中的細懸浮微粒。據統計，南部地區冬天空氣品質達到不良以上的天數，80
    天中有76 天，另有4 天是普通，沒有任何一天是良好；中部地區有37 天、北部地區則有12 天為不良。'
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 理化
      code: 1-1
      title: 長度、質量與時間
      chapter: 第1章 基本測量
