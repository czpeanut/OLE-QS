  page: 1
  stem: 「有機農業是遵守自然資源循環永續利用原則，不允許使用化學合成物質，強調水土資源保育與生態平衡之管理系統，並達到生產自然安全農產品目標之農業。」根據此一定義，下列農業經營方式，何者較「不符合」有機農業的精神？
  options:
  - label: A
    content: 採用翻土，地面覆蓋可分解紙膜，防止雜草叢生
  - label: B
    content: 大規模施打生長激素於豬隻，加快生產流程
  - label: C
    content: 培育多樣化的土壤微生物，昆蟲和鳥類，使用捕蟲裝置，架設網室保護農作物，以減少病蟲害
  - label: D
    content: 施用以禽畜排泄物和廢棄的農作物做成的堆肥。
