  stem: 近年受到美中貿易戰以及新冠肺炎疫情的影響，許多國家出現國內車用晶片進口供應短缺的困境，從而深刻體認到半導體晶片的戰略重要性，於是紛紛以政策扶持本國半導體產業的發展。台積電身為全球晶圓代工龍頭，生產的晶片廣泛運用在智慧型機器、軍工製造、交通運輸、通訊、電腦等領域，因此成為美、德、日等國競相邀請設廠的對象。由此推判，半導體產業具有以下哪項特性？
