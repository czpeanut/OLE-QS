  stem: 近年來，無人機運用於預防病蟲害等植物的保護，又稱「植保機」，亞洲部分國家早已廣泛使用，目前全臺約有上百架植保機，集中於雲嘉南地區。透過植保機噴灑農藥可以讓1
    分地(約9699 平方公尺)的噴藥時間從1 小時縮短為2 分鐘，大幅節省時間和人力，尤其不必再近距離接觸農藥，更能保障農民健康。上述植保機的運用，可以因應目前臺灣何項農業發展的現況？
