  stem: 牡蠣 (蚵仔) 是臺灣養殖水產的一種，年產量破2萬公噸，最大的產區在嘉義，分布於外傘頂洲與沿岸之間，風平浪靜的淺水海域，為國內鮮蚵重要生產基地，盛產季節在端午節前夕至中秋，但這段期間常因為天候狀況影響產量，衝擊蚵農生計。請判別下列相關敘述何者正確？
