  section: 1
  number: 15
  type: single
  page: 2
  stem: 臺灣經濟發展高度依賴國際貿易，民國109 年貿易總額高達6,310 億美元，排名世界第17。附圖為統計近年臺灣主要貨品的進出口額概況 (正值為出超，負值為入超)，針對此圖資訊，以下說明何者最為正確？
  options:
  - label: A
    content: 臺灣缺乏礦產資源，仰賴國外進口
  - label: B
    content: 臺灣市場規模大，多數貨品供應内銷
  - label: C
