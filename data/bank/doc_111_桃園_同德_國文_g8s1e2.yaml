  stem: 依據下文，哪個選項最符合作者想法？
  options:
  - label: A
    content: 謠言因揭人隱私而被人憎恨，故無法如黃金般保值
  - label: B
    content: 即使被證實為虛構，謠言仍會如滾雪球般繼續傳播
  - label: C
    content: 謠言傳播者未必心懷惡意，卻能因此獲得更多注目
  - label: D
    content: 人們常透過謠言製造幻覺，藉以掩飾對真相的恐懼
  group_stem: '謠言揭露祕密，這一點不可多得，故而珍貴異常。然而這雖是謠言的價值來源之一，卻不能解釋謠言為什麼流傳。黃金也因為稀有而珍貴，但人們卻不是使之流通，而是將它儲存起來。黃金和謠言有一個根本的差異——謠言的可信度並非永遠不變，萬一某個謠言被公眾確認為「謊言」，它便會壽終正寢，因此，謠言必須儘快使用，趁它尚有價值之際，從中獲取利益。事實上，當傳播者推心置腹地吐露隱情，與人分享祕密，他的形象便如同一位掌握了珍貴知識的人，在謠言的接收者眼中，散發出美妙的光輝。

    儘管謠言總有其源頭，但推動謠言的力量還是在聽到謠言並且傳播謠言的人身上。謠言的說服力是隨著它接觸到的人越多而越加增強的。人們聽到謠言，常會從自己的角度來豐富謠言，甚至提供其他的論據來證實謠言。在這個「滾雪球」效應裡，人們把謠言變成自己的，在裡面投進自己的想像和幻覺。
    （謠言：世界最古老的傳媒）'
