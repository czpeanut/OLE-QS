  group_stem: '從未聽聞一樹枯葉埋得了一條奔跑的溪。所以，青春傾向張揚；愛攬鏡自照，愛攝影留戀，愛不擇手段使那輝煌的美更美。反之，當肉身這條浪蕩舟航過五湖四海，犁過悲歡歲月，所累積的脂肪與財力同等雄厚——年輕時的坐姿，像一把名師設計的雅致單人椅，中年後變成皮沙發，再幾年，沙發上多了抱枕，接著，一陣不必細述的肉體土石流之後，變成沙發床――因此也就自然而然傾向於閉鎖；看鏡子不順眼，認為應該賞給高畫素高解析攝影機一顆石頭（秦始皇若在世，焚書之後必然焚所有智慧型手機相機）。從未聽聞一樹新綠能讓一條枯溪回春，所以，過了這條邊界，獨木舟喜歡躲在黃昏之際，樹蔭之下。

