  stem: 這首怨歌行是漢成帝寵妃班婕妤之作，也是成語「秋扇見捐」的出處，班婕妤以秋扇自喻，書寫自己由受寵到被冷落的哀愁，請問下列選項中，何者與本詩的內容最相關？
