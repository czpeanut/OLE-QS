- id: doc_111_桃園_同德_國文_g8s1e2_s3_4
  section: 3
  number: 4
  type: single
  page: 1
  stem: 在鳥一文中，作者提到居住在四川期間，夜晚「聽到杜鵑叫，由遠叫到近，由近叫到遠，一聲急似一聲，竟是淒絕的哀樂。客夜聞此，說不出的酸楚」，如此的情感，和下列哪一選項的感受相同？
  options:
  - label: A
    content: 多情卻似總無情，唯覺樽前笑不成。蠟燭有心還惜別，替人垂淚到天明。(杜牧)
  - label: B
    content: 誰家玉笛暗飛聲，散入春風滿洛城。此夜曲中聞折柳，何人不起故園情？(李白)
  - label: C
    content: 故人西辭黃鶴樓，煙花三月下揚州，孤帆遠影碧山盡，唯見長江天際流。(杜甫)
  - label: D
    content: 滄海月明珠有淚，藍田日暖玉生煙。此情可待成追憶？只是當時已惘然。(李商隱)
  lesson_raw:
    title: 鳥
    basis: 題目提及「鳥一文中」並引用課文原句
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
      code: 第六課
      title: 鳥
      chapter: null
    textbook: 八上 第六課 鳥
    labeled_by: ai
- id: doc_111_桃園_同德_國文_g8s1e2_s3_5
  section: 3
  number: 5
  type: single
  page: 1
  stem: 「好銳利的喜悅刺上我的心頭」，轉化中的形象化可使意象更為生動。請問下列歌詞，何者使用了這種手法？
  options:
  - label: A
    content: 妳是珍珠 我是芋圓 咱是珍珠跟芋圓 妳若不愛我 我就噢咿噢咿噢咿 (旺福 珍珠和芋圓)
  - label: B
    content: 你是颱風天 冒煙的泡麵 你是我最愛的人 若是有你和我作伴 有錢貧窮我都沒差 (旺福 等待雨散 )
  - label: C
    content: 沒有一顆心能逃避 一箭穿心的三言兩語 受了傷卻還在呼吸 那就是夠勇敢的證明(旺福 勇敢一點)
  - label: D
    content: 如果一顆氣球想飛翔 就要吞一肚子的氣長大 如果想要征服一座山 就要習慣不習慣的缺氧 (旺福 勇敢一點)
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
      code: 第五課
      title: 生命中的碎珠
      chapter: null
    textbook: 八上 第五課 生命中的碎珠
    labeled_by: ai
- id: doc_111_桃園_同德_國文_g8s1e2_s3_6
  section: 3
  number: 6
  type: single
  page: 2
  stem: 梁實秋以「一行白鷺上青天」生動描繪鳥的動態美，請問下列何者並非描寫鳥的動態句子？
  options:
  - label: A
    content: 一隻猛禽平張著雙翅從天空直插下去，幾乎觸到地面，忽又撲動翅膀發出猛烈的聲響斜刺天空
  - label: B
    content: 鵝用粉紅色的腳掌滑著湖水向前游，湖面上蕩起一圈圈波紋，遠遠望去好像白色的帆船在水中晃來晃去
  - label: C
    content: 靈巧可愛的小燕子，一雙像剪刀的尾巴，在細雨中斜飛，在晨光中翻飄，在柳絮中昂首，在薄霧中迴旋
  - label: D
    content: 兩隻喜鵲站在樹枝上，黑白相間的羽毛在陽光的映照下油光發亮，間或閃耀出華麗的亮藍色，煞是好看
  lesson_raw:
    title: 鳥
    basis: 題目引用梁實秋《鳥》課文內容
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
      code: 第六課
      title: 鳥
      chapter: null
    textbook: 八上 第六課 鳥
    labeled_by: ai
- id: doc_111_桃園_同德_國文_g8s1e2_s3_7
  section: 3
  number: 7
  type: single
  page: 2
  stem: 下列各詩句藉禽鳥所傳達的意旨，何者解讀有誤？
  options:
  - label: A
    content: 兩個黃鸝鳴翠柳，一行白鷺上青天――色彩鮮明，生機活潑
  - label: B
    content: 是非袞袞書生老，歲月匆匆燕子回――韶光易逝，青春不再
  - label: C
    content: 得成比目何辭死，願作鴛鴦不羨仙――鶼鰈情深，悲傷離別
  - label: D
    content: 舊巢共是銜泥燕，飛上枝頭變鳳凰――今昔對比，地位躍升
  tags:
