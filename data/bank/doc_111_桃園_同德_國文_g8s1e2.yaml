  - label: C
    content: 銀、金、杵、錢
  - label: D
    content: 金、銀、杵、錢
  group_stem: '魏郡張奮者，家本巨富，忽衰老財散，遂賣宅與程應。應入居，舉家病疾，轉賣鄰人何文。文先獨持大刀，暮入北堂中梁上，至三更竟，忽有一人，長丈餘，高冠黃衣，升堂呼曰：「細腰。」細腰應諾。曰：「舍中何以有生人氣也？」答曰：「無之。」便去。

    須臾，有一高冠青衣者；次之，又有高冠白衣者。問答並如前。及將曙，文乃下堂中，如向法呼之，問曰：「黃衣者為誰？」曰：「金也。在堂西壁下。」「青衣者為誰？」曰：
    「錢也。在堂前井邊五步。」「白衣者為誰？」曰：「銀也。在牆東北角柱下。」「汝復為誰？」曰：「杵也。今在灶下。」及曉，文按次掘之，得金銀五百斤，錢千萬貫。仍取杵焚之。由此大富，宅遂清寧。
    (干寶 搜神記)'
