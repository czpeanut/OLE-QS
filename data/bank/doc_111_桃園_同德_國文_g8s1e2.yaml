- id: doc_111_桃園_同德_國文_g8s1e2_s3_1
  section: 3
  number: 1
  type: single
  page: 1
  stem: '展演中心辦理「文壇巨星」系列演講。皮卡丘想要多了解這次段考中愛蓮說、鳥兩篇文章的作者，應該參加哪兩場呢？


    | 場次 | 日期 | 時間 | 講題 |

    |---|---|---|---|

    | 第一場 | 11/2 | 13:00~15:00 | 理學之祖，二程拜師，功在孔孟間 |

    | 第二場 | 11/9 | 13:00~15:00 | 歸去來兮，採菊東籬，五柳懶折腰 |

    | 第三場 | 11/16 | 13:00~15:00 | 廣大教化主，老嫗能解，醉吟先生 |

    | 第四場 | 11/23 | 13:00~15:00 | 新文學瑰寶，莎士比亞，雅舍小品 |'
  options:
  - label: A
    content: 第一場、第二場
  - label: B
    content: 第二場、第三場
  - label: C
    content: 第三場、第四場
  - label: D
    content: 第一場、第四場
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
      code: 第四課
      title: 愛蓮說
      chapter: null
    textbook: 八上 第四課 愛蓮說
    labeled_by: ai
- id: doc_111_桃園_同德_國文_g8s1e2_s3_2
  section: 3
  number: 2
  type: single
  page: 1
  stem: 梁實秋對鳥的觀察入微，在鳥一文中從多角度描摹其動作及鳴聲，請問下列說明何者錯誤？
  options:
  - label: A
    content: 用「吱吱喳喳」、「呱呱噪啼」呈現「交響樂」般優美的鳥鳴聲
  - label: B
    content: 美好的鳴聲到了白晝卻沉默了，聽不到鳥鳴聲，是因為「市聲鼎沸」
  - label: C
    content: 鳥像虹似地一下就消逝了，寫鳥如同美好的事物般無聲無息地飛去，徒生惆悵
  - label: D
    content: 描寫四川的鳥兒豐富而美好，是因為在自然中優游自在，反襯令人觸目的籠中鳥
  lesson_raw:
    title: 鳥
    basis: 題目提及「梁實秋」、「鳥一文」
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
      code: 第六課
      title: 鳥
      chapter: null
    textbook: 八上 第六課 鳥
    labeled_by: ai
- id: doc_111_桃園_同德_國文_g8s1e2_s3_3
  section: 3
  number: 3
  type: single
  page: 1
  stem: 下列針對鳥一文的寫作手法分析，何者說明完全正確？
  options:
  - label: A
    content: 採第三人稱立場，以旁觀者角度對鳥進行充分描寫
  - label: B
    content: 文末用不忍看籠中的鳥作結，呼應文章的主旨「鳥的苦悶」
  - label: C
    content: 全文時間安排是依照「現在」→「過去」→「未來」的順序
  - label: D
    content: 作者運用聯想力，以有情的眼光看鳥，以仁民愛物的心靈寫愛鳥
  lesson_raw:
    title: 鳥
    basis: 題目提及「鳥一文」
