- id: doc_111_桃園_同德_國文_g8s1e2_s3_34
  section: 3
  number: 34
  type: single
  page: 5
  stem: 有關安藤忠雄：孤獨，也要讓夢想開花一文的說明，下列何者錯誤？
  options:
  - label: A
    content: 全文以第一人稱口述的方式，剖析自己
  - label: B
    content: 「孤獨，也要讓夢想開花」就是一種「擇善固執」的態度
  - label: C
    content: 安藤忠雄透過旅行，全世界的建築鉅作都化身教科書，成就了他
  - label: D
    content: 日本諺語「只要有一，就會有十」和「千里之行，始於足下」可互相印證
  group_stem: '夢想的代價(節錄) 侯文詠

    一八四四年，美國一位二十九歲的牙醫師威爾斯，從江湖郎中的笑氣表演發現：吸了笑氣的人，即使受傷，也不覺得痛，因此，他開始思考，笑氣是不是可以使用在拔牙上？為了進一步確認自己的突發奇想，威爾斯以自己來做實驗，經過了十幾次無痛拔牙的臨床經驗，他漸漸有了名氣。

    不久，哈佛大學的華倫教授安排了一次「特別演講」，邀請威爾斯示範笑氣在拔牙的運用。當時，接受拔牙的大學生在吸了笑氣之後，漸漸失去反應，威爾斯緊張地將拔牙鉗伸進病人嘴裡，突然間，「啊――」大學生發出的一聲慘叫使這次的表演失敗，使威爾斯成為大家的笑柄。

    但，他沒有放棄，他一再地以自己做實驗來印證最初的理念。但，過度的笑氣腐蝕了威爾斯的身心，三十三歲那年，他帶著崩潰的身心和遺憾而死。

    威爾斯的夢想並沒有因此停止。當年在哈佛講堂上一位叫莫登的學生，拾起威爾斯最初的構想，不斷地去開發氣體麻醉的可能性，終於有了今日麻醉與外科的新天地。

    威爾斯至死也許尚不知道，他所肩負的苦痛事實上是一個夢想，一個關於人類更美好未來的夢想。


    安藤忠雄：孤獨，也要讓夢想開花(節錄)

    一九四一年，安藤忠雄在大阪出生。鄰家的木匠開啟了他對建築的興趣，十三歲時，他與木匠合作增建家裡二樓。當他在幽暗的長屋開了一個天窗，小小心靈深受感動，於是他興起自己的夢想：建築。

    國中畢業後，他一邊就讀高工機械科，一邊自學建築。課餘，他到學校的設計教室，還四處參觀日本傳統建築。為了出國看建築，他甚至只用兩個多月就拿到拳擊賽資格，出國參賽。

    高工畢業後，因為經濟壓力，他放棄就讀大學建築系，用半工半讀的方式繼續自學建築。周遭的人都說：「你沒受過正規的教育，怎麼能成為一個建築家？」在日本菁英主義的環境下，他受到很多質疑，但是他的熱情與意志力卻更為深刻。他深信一句日本諺語：「只要有一，就會有十」。他慢慢存錢，存了足夠的金錢後，就從舊書攤買下了許多建築相關書籍，有一整年，他甚至從一早就讀書到凌晨三點，就是這樣的努力，他將建築系教科書研讀完畢。

    二十四歲那年，安藤忠雄踏上了建築之旅，莫斯科、北歐、中歐、南歐、印度都有他的足跡，透過旅行，全世界的建築鉅作都成為他未來設計的養分。

    回日本後，他開了自己的建築師事務所，一開始，只有親友介紹的案子，直到三十五歲那年，他在「住吉的長屋」作品中展現出天窗與庭院的創新設計，使他在日本建築業界嶄露頭角，之後也開始在海外成名，陸續在美國、法國擔任教授、舉行個展，五十四歲這一年，他獲得了建築界最高榮譽的肯定：「普立茲克獎」。

    記者問他：「如果不是做建築家，你會做什麼呢？」他說：「如果我不做建築家，我的人生就很失敗。」現在的安藤忠雄，儘管早已晉升國際大師，仍然秉持著熱情與意志力，追尋著他的建築夢。'
