    \ because she was very sick. Every morning,\nhe went into the forests to find\
    \ herbs to help her get healthy. However, this didn’t work at\nall.\n     “Son,\
    \ there is something you can do for me. I’m hungry and want to have gold ingots.”\n\
    said the mother.\n     “Gold ingots are not food. How can I feed my mother on\
    \ gold ingots? And where can I get\nthe money?” the young man thought.\n     The\
    \ young man was sad and didn’t know what to do. One night, on the Chinese New\n\
    Year’s Eve, when he was sleeping, God spoke to him in a dream.\n     “Young man,\
    \ use flour and water to make small bags and fill the bags with meat. Then,\n\
    make them look like gold ingots and feed them to your mother. These can help her.”\n\
    \     The man woke up and chose to give it a try.\n     “Mother, here are gold\
    \ ingots for you.”\n     “They are delicious, son. Thank you.”\n     After the\
    \ young man’s mother had the food, she got healthy.\n     This is the story of\
    \ dumplings. Now, people think dumplings can bring good things to\nthem, and that’s\
    \ why they enjoy dumplings during the Chinese New Year.\n   herb 草藥 feed 餵養 fill\
    \ 填滿 meat 肉 during 在…期間"
