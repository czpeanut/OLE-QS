  stem: 在1950年代，「這三年，中國慘絕人寰。雖然中共一直對這場災難遮遮掩掩，但根據中外學者研究，非正常死亡人數確實高達數千萬人。」請問：造成這三年慘狀的最主要原因是什麼？
