  stem: 1972年6月8日，當時9歲的潘金福在越南遭燒夷彈嚴重灼傷，赤裸著身體痛哭狂跑，逃離被襲擊的村莊，美國攝影記者拍下照片，名為《燒夷彈女孩》，後來獲得普立茲獎。2022年，她護送236名烏克蘭難民飛往加拿大，包機機身上印著當年這張照片，旁邊標語寫著「不要戰爭」（No
    War）。關於潘金福當年所遭遇的那場戰爭，下列敘述何者正確？
  options:
  - label: A
