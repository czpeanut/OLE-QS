  group_stem: '(32-34)

    People have eyes, ears, and noses. But people have different skin colors. Some
    people have black skin. Some people have white skin. And some people have yellow
    or red skin. Why do people have different skin colors? Melanin is in our skin.
    Black people have more melanin, but white people have less. People believe the
    first person is from Africa. It''s hot there. People need more melanin to protect
    their skin. Later, people go to different places. In those places, they have less
    sunlight. People have less melanin, and people''s skin colors change. That is
    why we have different colors today.

