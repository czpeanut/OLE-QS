- id: doc_113_桃園_桃園_英語_g9s2e1_s1_46
  section: 1
  number: 46
  type: single
  page: 5
  stem: '（ ）46. Where can readers buy "Shouwajidai: The Transformative Grace of a
    Butterfly"?'
  options:
  - label: A
    content: Only in real stores.
  - label: B
    content: Only online.
  - label: C
    content: Both in real stores and online.
  - label: D
    content: At the library.
  group_stem: 'Shouwajidai: The Transformative Grace of a Butterfly

    Preface— Words from the Publisher:

    The book soon becomes popular among history lovers right after it hits the market.
    Now it is available in real stores and online. I can’t tell you how much I love
    this page turner! Readers, especially those with great interests in Japanese culture,
    may think this book is a treasure.

    In Japanese, “Showa” means “bright peace” or "enlightened peace. The Shōwa era
    (1926-1989) brought cultural, political, and economic changes to Japan.

    A Table of Contents

    Chapter I— Western Influence: Japanese culture adopts western fashion, music,
    and lifestyle.

    Chapter II— Economic Miracle: Japan has fast economic growth, known as the "Japanese
    Economic Miracle.”

    Chapter III—Media and Entertainment: Japanese Manga, anime, and cinema has made
    the country stranger to none in the world.

    Chapter IV—Schools: Democratic values and critical thinking.

    Chapter V— Problems: Japan rebuilds infrastructure, economy, and society.

    Chapter VI—Political Changes: New constitution.

    Chapter VII—Economic Challenges: The early Shōwa era faced economic difficulties.

    Chapter VIII—Social Changes: Peace and democracy.


     preface 書序 available 可獲得的、可得到的 treasure 珍寶

    era 時代 political 政治的 economic 經濟的

    adopt 採納 growth 成長 democratic 民主的 values 價值

    critical 批判式的 infrastructure 基礎建設 constitution 憲法'
