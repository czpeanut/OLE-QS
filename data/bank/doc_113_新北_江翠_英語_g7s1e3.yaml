     title 標題'
  options:
  - label: A
    content: A Visit to the Zoo.
  - label: B
    content: A Family Dinner.
  - label: C
    content: A Holiday.
  - label: D
    content: An Animal Report.
  group_stem: '(42~45)

    There is a big zoo in our city. Many people visit the zoo every weekend. People
    can see many animals over there. There are many animals in the zoo, such as special
    birds, lions, tigers, elephants, and monkeys.

    In the bird area, there are colorful parrots and a large peacock. The parrots
    can talk, and they say “Hello” to people. There is also a large peacock. When
    its feathers open up, it look like a big beautiful fan. In the lion area, the
    lions rest under big trees. They look strong and powerful. People like to watch
    them roar. Near the lions, it is the elephant area. The elephants are very big
    and cute. They eat grass and use their trunks to drink water. Children love to
    watch them spray water on themselves with their trunks. There is a river around
    the big rock mountain in the monkey area. A group of monkeys are playing around
    the rocks. In the river, the ducks swim on the water, and the fish are small but
    colorful.

    The zoo is a great place to learn about animals. Tom and his family go to the
    zoo every month. They love to see the animals and enjoy the time there.

     visit 參觀 such as 例如 area 區域 feather 羽毛 roar 吼叫 spray 灑水'
