- id: doc_111_彰化_埤頭_國文_g8s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 前美國總統富蘭克林‧羅斯福說：「快樂並不等於金錢的擁有，而在於成就的喜悅和努力創造的熱誠之中。」這段話的意思，與下列何者最接近？
  options:
  - label: A
    content: 知足者貧賤也樂，不知足者富貴亦憂
  - label: B
    content: 快樂的微笑是保持生命健康的唯一藥石
  - label: C
    content: 快樂有如香水，向人撒得多，自己也必沾上幾滴
  - label: D
    content: 真正的快樂是面對工作時的愉快，面對事業時的興奮。
- id: doc_111_彰化_埤頭_國文_g8s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 「槁木有火，弗鑽不然；土中有水，弗掘無泉。」《淮南子》這句話旨在說明什麼道理？
  options:
  - label: A
    content: 懂得未雨綢繆，臨事時方能從容以對
  - label: B
    content: 凡事先設定明確目標，才有依循方向
  - label: C
    content: 知之要能夠行之，才能冀望成果降臨
  - label: D
    content: 做事只要用對方法，必然省時省力。
- id: doc_111_彰化_埤頭_國文_g8s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 「巫馬其為荊王使於巴，見擔鴆者，問之：「是何以？」曰：「所以鴆人也。」於是，請買之，金不足，又益之車馬。已得之，盡注之於江。」故事中巫馬其的行為可以用下列何者形容？
  options:
  - label: A
    content: 人無遠慮，必有近憂
  - label: B
    content: 己所不欲，勿施於人
  - label: C
    content: 人棄我取，人取我與
  - label: D
    content: 不入虎穴，焉得虎子。
- id: doc_111_彰化_埤頭_國文_g8s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 下列「 」中的詞語，何者使用最恰當？
  options:
  - label: A
