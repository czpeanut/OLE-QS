- id: doc_111_彰化_埤頭_國文_g8s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 「氣象專家吳德榮22 日指出，今晨中南部僅有一些非常少量的零星降雨，顯示低層水氣已減少。明天週五各地為多雲時晴，午後有局部短暫陣雨或雷雨的機率，主要偏在山區。明晚起受颱風外圍水氣影響，北部、東北部將轉為陣雨天氣。週六、週日颱風直撲而來，將帶來強風豪雨，但各地所受風雨強度視登陸地點有所不同。下週一至三颱風遠離，天氣好轉，各地大多晴朗，僅午後有局部短暫陣雨或雷雨的機率。」關於這段文字，下列解讀，何者正確？
  options:
  - label: A
    content: 可約略得知未來十日的天氣概況
  - label: B
    content: 22 日之前的中南部可能有較多的降雨
  - label: C
    content: 颱風可能正朝著台灣西半部迎面而來
  - label: D
    content: 颱風最接近台灣的時間應落在26、27 日。
