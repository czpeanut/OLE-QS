- id: doc_111_彰化_埤頭_國文_g8s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: 「小吃店常見的燙青菜『大陸妹』這道菜，清爽口感深受消費者喜歡，但多數民眾並不清楚『大陸妹』其實是萵苣的一種。有網友好奇提問為何會有『大陸妹』這個名字，引起大家廣泛討論，其中有人翻出作家曾銘宗.的蚵仔煎世家：（
    ？ ）一書，說明臺灣萵苣用臺語是念『萵紫菜（e–a–tshai）』，而e 和a 又諧音，所以常被念成a 阿菜，南部大多會念成『妹仔菜（me–a–tshai）』。後來市場引進中國品種的萵苣，就被稱作『大陸妹仔菜』，之後慢慢簡稱成為『大陸妹』」。若由上下文判斷，（
    ？ ）代表的書名應為下列何者？
  options:
  - label: A
    content: 台灣食物名小考
  - label: B
    content: 臺灣巷弄美食地圖
  - label: C
    content: 台灣巷弄美食地圖
  - label: D
    content: 兩岸特色小吃大比拚。
- id: doc_111_彰化_埤頭_國文_g8s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 1
  stem: 「北人生而不識菱者，仕於南方。席上食菱，並殼入口。或曰：「食菱須去殼。」其人自護其短，曰：『我非不知，並殼者，欲以清熱也。」問者曰：北土亦有此物否？』答曰：『前山後山，何地不有！』夫菱生於水而曰土產，此坐強不知以為知也。」依據內容，文中的「北人」可說是如何？
  options:
  - label: A
    content: 自負上知天文、下知地理，結果卻是學無專精，漏洞百出
  - label: B
    content: 自以為樣樣皆知，但在他人連番逼問下，終於露出馬腳
  - label: C
    content: 為了不自曝其短而強詞奪理，導致最後出乖露醜，貽笑大方
  - label: D
    content: 想以己之長攻他人之短，卻誤判形勢，反使對方佔上風。
- id: doc_111_彰化_埤頭_國文_g8s1e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 「終於雷聲愈來愈遠，電光只在遙遙的天邊橫掃。太陽又出來了，一片清新的空氣、鮮潔的色彩，彷彿聽見貝多芬《田園交響曲》第四樂章〈牧羊人之歌〉。」下列何者為作者提及貝多芬樂章的原因？
  options:
  - label: A
    content: 透過宏偉的交響曲，強調西北雨的戲劇化過程
  - label: B
    content: 用聽覺印象表達視覺效果，以悠揚樂聲刻劃雨過天青的平靜
  - label: C
    content: 藉由樂章的名稱，揭露自己牧羊人的身分
  - label: D
    content: 希望以動聽的音樂，來呈現鄉居生活中感受到的悠閒情致。
  lesson_raw:
    title: 田園之秋選
    basis: 引用田園之秋選課文原句
