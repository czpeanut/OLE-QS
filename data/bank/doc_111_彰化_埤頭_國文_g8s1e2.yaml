- id: doc_111_彰化_埤頭_國文_g8s1e2_s1_24
  section: 1
  number: 24
  type: single
  page: 2
  stem: 下列哪一個主題皆有出現在這兩篇短文內容中？
  options:
  - label: A
    content: 知足
  - label: B
    content: 謙虛
  - label: C
    content: 納諫
  - label: D
    content: 務本。
  group_stem: '【甲】今夫霤水足以溢壺榼，而江河不能實漏卮。故人心猶是也。自當以道術度量，食充虛，衣禦寒，則足以養七尺之形矣。若無道術度量而以自儉約，則萬乘之勢不足以為尊，天下之富不足以為樂矣。

    【乙】人生而有欲，欲而不得，則不能無求；求而無度量分界，則不能不爭。爭則亂，亂則窮。先王惡其亂也，故制禮義以分之，以養人之欲、給人之求，使欲必不窮乎物，物必不屈於欲，兩者相持而長，是禮之所起也。

    ○註〈1〉霤水：屋簷上流下的水。〈2〉榼：泛指盒類的容器。〈3〉卮：盛酒的器具。'
