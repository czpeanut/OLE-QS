  - label: B
    content: 若正取的學生沒來報到，就由候補的第一名「遞嬗」上來
  - label: C
    content: 在空曠的草地上欣賞明亮的月光，吹著微風，很是「恣意」
  - label: D
    content: 這位藝術家把人物雕塑得栩栩如生，令人「懾服」。
- id: doc_111_彰化_埤頭_國文_g8s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 「在日本京都吃過最清甜的豆腐，於是從此對豆腐製造特別留意，不幸的是知道日京都腐是用什麼水什麼豆什麼法門造出來，更覺平日吃到的都只是一磚石膏粉。如果當時在京都淺嘗過，嘆三聲好好好，不那麼好奇科學，那麼豆腐就是豆腐，吞下肚裡都一樣，也不用在香港的日本食店裡吃豆腐吃得不安於室，幻想騰空專程到京都吃個痛快。」關於本文，下列何者說明正確？
  options:
  - label: A
    content: 作者在行文間流露出「當家方知柴米貴」的感慨
  - label: B
    content: 作者運用「轉化修辭」凸顯京都豆腐的滋味美妙
  - label: C
    content: 作者認為香港日本食店裡的豆腐可媲美京都豆腐
  - label: D
    content: 作者在吃過京都豆腐之前認為所有豆腐都差不多
