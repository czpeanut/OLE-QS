- id: doc_111_彰化_埤頭_國文_g8s1e2_s1_27
  section: 1
  number: 27
  type: single
  page: 2
  stem: 依據內容，下列何者最符合作者對「寧靜」的看法？
  options:
  - label: A
    content: 寧靜也要適可而止，人不能一直處於寧靜的狀態
  - label: B
    content: 相對於外界的紛擾，寧靜來自於內心的頓悟自在
  - label: C
    content: 想要擁有寧靜的生活，只有歷盡滄桑的人才能獲得
  - label: D
    content: 寧靜與物質生活的好壞無關，物慾也無礙於追求寧靜。
  group_stem: '每天晚上，我都會走過一棵又一棵的街樹。這些樹，已被我走過千萬次。夏天的樹，一片茂盛，枝幹向上伸展。冬天的樹，繁華落盡，靜靜地看霧靄，領受無邊的寂寞，樹的滄桑比人要多很多，但心智比人要淡定，所以每一棵樹都是高僧。任周遭世事喧囂，內心卻淡定寧靜……。

    馬德說過，無欲的生命是安靜的：一匹馬、一頭牛都有這樣的時刻。曬太陽的老人，繡十字繡的女子，也是這樣。他們平和、恬淡、純真、潔淨，呈現了這個世界最美的姿態。

    去拜訪一位商界的朋友，看到他十分忙碌，電話一個接一個，進來的人絡繹不絕，忙得與我打招呼的功夫都沒有。約他改日相聚，二十多天之內，日程竟全部排滿。他給我回電話，苦笑著說，錢是掙不完的，自己像一隻陀螺被推著走，活得沒有一點自我，更別說自在；寧靜真好，寧靜是福啊！

    寧靜，果真是福嗎？在有的人眼裡，是這樣的。但在不能果腹的人眼裡，很多寧靜是一片無奈的空白。沒有熱情的行動，寧靜就成為一塘死水。但只會熱情的行動，就沒有屬於自己可做主的靈魂。寧靜應是簡單物質生活之後的一種境界，恬和、安寧，如一彎新月，照著秋水。'
