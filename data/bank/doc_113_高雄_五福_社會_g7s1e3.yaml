  section: 1
  number: 48
  type: single
  page: 6
  stem: 根據歷史知識，請問「資料一」中清代規模最大的平埔族叛亂為下列哪一事件？
  options:
  - label: A
    content: 麻豆社事件
  - label: B
    content: 大肚王事件
  - label: C
    content: 牡丹社事件
  - label: D
    content: 大甲西社事件。
  group_stem: '潘墩仔與岸裡社的故事

    資料一

    岸裡社是清代台灣平埔族巴宰族的重要部落，位於今天的台中神岡區。潘墩仔是岸裡社的第三代頭目，他原名「敦仔阿打歪」，後來被賜漢姓「潘」。雍正10 年（1732
    年），清代規模最大的平埔族叛亂爆發，潘墩仔和通事張達京率領族人協助清軍平亂，立下大功。清朝為了表彰他們，將部分土地劃給岸裡社，並免除了賦稅和勞役。

    資料二

    張達京是岸裡社的通事，負責與清廷及漢人溝通。他建議將部落的一部分土地分給漢人，以換取水利技術，解決農業用水不足的問題。這樣的合作讓平埔族獲得穩定的水源，提高了農業產量，但也讓他們逐漸失去大量土地，影響了傳統生活方式。

    -改寫自國家圖書館-臺灣記憶'
