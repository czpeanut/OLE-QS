  stem: '排灣族詩人莫那能寫於1983 年的詩句，陳訴著當時台灣、乃至於世界各國原住民的共同處境：


    我們的姓名，在身份證的表格裡沈沒了，無私的人生觀，在工地的鷹架上擺盪，

    在拆船廠、礦坑、漁船徘徊，莊嚴的神話，成了電視劇庸俗的情節，

    傳統的道德，也在煙花巷內被蹂躪……

    我們還剩下什麼？

    在平地顛沛流離的足跡嗎？

    我們還剩下什麼？

    在懸崖猶豫不定的壯志嗎？


    請問:原住民詩人想表達當時原住民族的處境為何?'
