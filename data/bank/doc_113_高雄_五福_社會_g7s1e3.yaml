  group_stem: '清代對於台灣原住民稱之為「番」，日治時期稱為「高砂族」，在民國初期則改稱為「山胞」，一直到1994 年修憲才正名為「原住民」。為了實踐《憲法增修條文》第十條的規定:「國家肯定多元文化，並積極維護發展原住民族語言及文化」，立法院陸續推動保障原住民權益的相關法案。以下是某法律節錄的條文內容：

    ▓本法所指原住民族：係指既存於臺灣而為國家管轄內之傳統民族，包括阿美族、泰雅族、排灣族、布農族、卑南族、魯凱族、鄒族、賽夏族、雅美族、邵族、噶瑪蘭族、太魯閣族及其他自認為原住民族並經中央原住民族主管機關報請行政院核定之民族。

    ▓部落：係指原住民於原住民族地區一定區域內，依其傳統規範共同生活結合而成之團體，經中央原住民族主管機關核定者。'
