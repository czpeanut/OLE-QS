  stem: 甲文中，「海洋教育從來不是紙上談兵」所指為何
  options:
  - label: A
    content: 育英國小扎扎實實在海洋教育上身體力行
  - label: B
    content: 育英國小從不對海洋教育進行空泛的評論
  - label: C
    content: 育英國小從來不曾投注心力在海洋教育上
  - label: D
    content: 育英國小開始計畫利用資源發展海洋教育
  group_stem: "【甲】SUP 體驗教學，宜蘭 育英國小加強海上自救\n位在蘇澳的育英國小，因為校園臨海，海洋教育從來不是紙上談兵。配合教育部海洋教育主軸，開發各種以海洋為主的校訂戶外教育課程。像是近兩年成為全球風潮的SUP（立槳衝浪）體驗式海洋課程，育英國小就在學校附近的南方澳豆腐岬海域開立戶外教育課程，讓學生們站在龍舟板上划乘、徜徉海中，深受學生熱愛。\n\
    \    「親自體驗、認識海洋，孩子們不但能親自體驗水上活動，還能增進對家鄉海域環境的認識，讓大自然成為他們最好的導師。」育英國小教導主任劉文正出生在南方澳，從小每天都到豆腐岬游泳，對海洋教育從小扎根特別有感。\n\
    \    育英國小的SUP 課程也特別加強學生海上自救的觀念。「學會在海中的求生技能，不正是108 課綱教孩子們，在面對生活挑戰時需要具備的生存能力嗎？」校長黃俊仁笑著說。\n\
    \n【乙】新北八里 米倉國小，從家鄉土地出發\n    秋高氣爽的早晨，座落在觀音山腳、淡水河畔的米倉國小學生們，已經準備出發到鄰近學校的觀音山進行戶外教學。\n\
    \    「閱讀觀音山」是米倉國小的戶外教學課程之一。學校105 年開始規畫「登硬漢嶺」挑戰課程，希望透過戶外教育課程，讓學生更親近山，親自踩在家鄉土地上，對土地有感情連結，進而以行動為自己生長的地方努力。\n\
    \    「我一直很贊成戶外教育，」帶隊的輔導主任蘇秋金從事戶外教育規畫多年，「只要有機會，我就想帶孩子走出教室。只有讓他們真的學以致用，孩子們才不會覺得課堂上的知識枯燥乏味、離自己非常遙遠。」\n\
    \    從課堂到戶外，米倉國小的學生們得自己觀察山林環境、進行記錄和討論。在山上，老師也會講解觀音山的生態環境，讓學生和山林有親密接觸，讓學習更「有感」，實踐戶外教學真正的目的。\n\
    （改寫自：未來Family 山海可為師、處處能學習：戶外教育扎根，108 課綱讓學習走出教室，親近山與海）"
