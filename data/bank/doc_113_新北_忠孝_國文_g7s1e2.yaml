- id: doc_113_新北_忠孝_國文_g7s1e2_s5_26
  section: 5
  number: 26
  type: single
  page: 3
  stem: 閱讀上方資料後，有關校園霸凌的認知，下列何者正確？
  options:
  - label: A
    content: 肢體、言語、關係霸凌皆可透過網路進行
  - label: B
    content: 聯合他人來排擠同學，是網路霸凌的前兆
  - label: C
    content: 旁觀同學被霸凌，也應該勇敢向師長反映
  - label: D
    content: 1953 是防制校園霸凌專線，專供教師使用
  group_stem: "教育部目前將霸凌分為五類：肢體霸凌、關係霸凌、言語霸凌、網路霸凌及反擊霸凌。但霸凌事件，通常不會只出現單一的型態，也有同時具多種類型者。網路霸凌很特別，由於網路的匿名性、不用直接面對被霸凌者、散播速度快而廣，且無法取消等因素，讓網路霸凌更容易達成，且造成的傷害更大。通常單次不當的網路行為就可以達成反覆、長期、聯繫被害的結果，而形成網路霸凌。\n\
    \    同學遭受校園霸凌，應鼓勵受凌者及旁觀者勇敢說出來，可以向導師、家長反映；向學校投訴信箱舉發；撥打縣市反霸凌投訴專線；向教育部防制校園霸凌專線（1953）投訴；於校園生活問卷中提出或是向其他管道（好同學、好朋友）述說。學生間的霸凌行為與一般偏差行為都是需要我們重視並解決的問題，尤其霸凌行為對於學生身心發展有極大影響，因此疑似霸凌個案均須積極處理，校園霸凌的預防及處理刻不容緩。\n\
    \n| 霸凌類型 | 說明 |\n| --- | --- |\n| 肢體霸凌 | 對他人身體打、推、踢、撞、掐等之行為、搶奪財物等。 |\n| 言語霸凌 |\
    \ 出言恐嚇、嘲笑汙辱、取綽號等。 |\n| 關係霸凌 | 1.排擠孤立、聯合他人來對付某人等。<br>2.這一類型的霸凌往往牽涉到言語霸凌。 |\n| 網路霸凌\
    \ | 1.散播謠言、刻意引戰、網路跟蹤、留言攻擊、假冒他人網路身分、發布攻擊或詆毀的圖片影片、散布他人個資等。<br>2.除了肢體霸凌外，言語、關係霸凌亦可透過網路來實施。\
    \ |\n| 反擊霸凌 | 受凌者不堪霸凌者的霸凌，而選擇反擊或去欺負比自己弱小的人，成為霸凌者。 |"
