      publisher: 翰林
      book: 七上
      subject: 國文
      code: 語文常識(二)
      title: 閱讀導航——策略運用與資訊檢索
      chapter: null
    textbook: 七上 語文常識(二) 閱讀導航——策略運用與資訊檢索
