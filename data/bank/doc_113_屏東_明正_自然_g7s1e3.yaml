  group_stem: (二) 糖尿病是現代人的文明病，雖是慢性病，但併發症也是可以要人命，如低血糖症、酮症酸中毒、非酮高滲性昏迷等。2011 年世界衛生組織報告指出全世界有3.46
    億人患有糖尿病，其造成原因是體內胰島素的缺乏與不足，和遺傳基因有絕對關係。臨床症狀有三多一少：吃多、喝多、尿多但體重下降的狀況出現。高血糖與尿中出現葡萄糖是主要病徵。
