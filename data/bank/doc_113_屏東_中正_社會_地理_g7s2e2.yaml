    年創造「捷安特」品牌，過去完全在臺灣生產，現在則以臺灣為全球營運中心，利用原先既有優秀的生產線，並不斷配合市場需求改良產品，於全球招攬人才及成立九座生產基地，目前全球有11,000
    個以上服務據點，已成功行銷到五十餘國，成為全世界知名的自行車公司。請依敘述回答39-40 題：
