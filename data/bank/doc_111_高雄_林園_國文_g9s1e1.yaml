- id: doc_111_高雄_林園_國文_g9s1e1_s5_4
  section: 5
  number: 4
  type: single
  page: 4
  stem: 在理解鯨類發出聲響的目的後，你可以從中得到什麼啟示？
  options:
  - label: A
    content: 我們感受得越多，我們就會生活得越長久
  - label: B
    content: 贈人玫瑰，手有餘香；分享，才能互利共好
  - label: C
    content: 透過幫助他人，找到自己生命的價值感
  - label: D
    content: 幫助別人之前，要衡量自己的能力是否足夠。
  group_stem: "（四）\n    藍鯨發出大而低頻率的聲響，可以越過很遠的距離。海洋以奇特和不尋常的方式傳遞聲音：有一層稱作深聲頻道的水域，因為聲波一再的折回頻道，不會喪失太多能源而使聲波可以散布到極遠的距離。在這樣的情況下，鯨的聲音可以橫越遠達五百英里，才和背景的雜音混在一起。這些日子以來，海洋被人聲汙染，但在船隻未出現的千百萬年中，鯨聲可能越過幾千英里的距離；兩隻鯨可能坐在大洋的兩端，互相溝通，內容不是複雜的會話，也未必是閒聊，只是簡單的交換可以在哪裡找到食物的訊息。鯨餓了，也許會保持沉默，吃飽了，卻可能發出聲音。飢餓的鯨，只要游向聲音最大之處，就能找到食物；如果鯨有太多可吃的東西，會跟親友分食，這對牠們也有好處，因為牠的親友可能來年就會回報牠這個人情。\n\
    節錄自〈鯨背月色〉"
  answer:
  - B
