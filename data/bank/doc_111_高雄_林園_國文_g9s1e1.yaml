    content: 甲、乙都以流水表達朝代更迭、時間的流逝
  - label: C
    content: 甲篇作者透過讚賞孫權，暗示自己也具有與他一般的氣魄
  - label: D
    content: 乙篇作者藉由歌頌周瑜，羨慕其江山美人兼得，春風得意。
  group_stem: '（七）

    甲

    何處望神州？滿眼風光北固樓。千古興亡多少事？悠悠，不盡長江滾滾流。

    年少萬兜鍪，坐斷東南戰未休。天下英雄誰敵手？曹劉。生子當如孫仲謀。（辛棄疾〈南鄉子 登京口北固亭有懷〉）


    乙

    大江東去，浪淘盡，千古風流人物。故壘西邊，人道是：三國 周郎①赤壁。亂石崩雲，驚濤裂岸，捲起千堆雪。江山如畫，一時多少豪傑。

    遙想公瑾當年，小喬初嫁了，雄姿英發。羽扇綸巾，談笑間，檣櫓②灰飛煙滅。故國③神遊，多情應笑我，早生華髮。人間如夢，一樽還酹江月④。（蘇軾〈念奴嬌 赤壁懷古〉）


    【註釋】

    ①周郎：指三國時吳國名將周瑜，字公瑾，掌管東吳重兵。

    ②檣櫓：這裡代指曹操的水軍戰船。檣，掛帆的桅杆。櫓，一種搖船的槳。

    ③故國：指舊地，當年的赤壁戰場。

    ④一樽還酹江月：古人祭奠以酒澆在地上祭奠。這裡指灑酒酬月，寄託自己的感情。'
  answer:
  - B
