- id: doc_111_高雄_林園_國文_g9s1e1_s5_3
  section: 5
  number: 3
  type: single
  page: 4
  stem: 作者舉了三個不同民族的例子，是想要傳達什麼理念？
  options:
  - label: A
    content: 愛惜自然，方能保有永續的環境
  - label: B
    content: 努力修行，學習不同的文化理念
  - label: C
    content: 追隨時序，生活自有意外的驚喜
  - label: D
    content: 順應自然，就能享受四季的情致。
  group_stem: "(三)\n    日本有段春天狐狸嫁女兒的傳說，警告人們春天不要進入森林裡打擾了狐狸的婚禮，否則會遭到厄運。導演黑澤明也曾將這段傳說應用在他綠色思想極為強烈的電影〈夢〉裡頭。細想，這段傳說背後的深層意義，不正是提醒人們：春天不要進入森林裡干擾各種生命旺盛的萌發與成長。\n\
    \    印度有支最古老的宗教在數千年前即體會出春天儘量不出門，若不得已也要打赤足外出的教義。印第安人則在春天時卸下馬的蹄鐵，也不駕馬車出門，以免影響大地的胎氣。印第安人相信，春天是大地懷孕的季節，要避免馬的堅硬蹄鐵劇烈踩踏大地。\n\
    \    我則慶幸內心開始了這樣謙虛的心境。要向大地表示謙敬是一段不容易體會的人生修行。當你聽得見春天幼嫩的生命發出的聲音而去在意它時，是比辛勤聆聽深奧的道理來得接近善念吧！\n\
    節錄自〈春天的聲音〉"
