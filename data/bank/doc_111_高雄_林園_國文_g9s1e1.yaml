- id: doc_111_高雄_林園_國文_g9s1e1_s5_2
  section: 5
  number: 2
  type: single
  page: 3
  stem: 禪坐大師阿姜查教弟子學習「靜止的流水」的心境，呼應了下列哪一句課文？
  options:
  - label: A
    content: 某些聲音可以在心中滋長，甚至變得很喧囂
  - label: B
    content: 走在春日迷濛的山林小徑上，耳朵裡很安靜
  - label: C
    content: 也許你得學習安靜而易於感受
  - label: D
    content: 既然是流動的水，便無法同時保持靜止呀。
  group_stem: "(二)\n    生命發生的聲音有些是聽不見，卻看得見的。某些聲音可以在心中滋長，甚至變得很喧囂，很龐巨，耳畔卻沒有任何聲響。\n \
    \   走在春日迷濛的山林小徑上，耳朵裡很安靜，鳥叫蟲鳴，風拂雨斜，這些，是不吵人的聲音。可是，你要靜下心來讓真正的聲音在心頭滋長、流動，仔細傾聽，沒有一種生命是可以暫時停止運轉的，停止在生命之河裡流動。\n\
    \    泰國的禪坐大師阿姜查，教導弟子要學習「靜止的流水」的心境。弟子們懷疑，世界上哪裡有靜止不動的流水呢？既然是流動的水，便無法同時保持靜止呀！是啊！既然是聲音，便不能有聽不見的聲音呀！聽不見的聲音又如何叫做「聲音」呢？\n\
    \    阿姜查說，那是一種心靈狀態。保持心靈的靜止、安詳，並不表示生命與外在的互動便暫時停止，思考仍然在心靈中流動著，智慧容易在其中受孕生成。\n   \
    \ 我想，世間的表態不能決定所有的狀態。在你心中響起的聲音，別人聽得見嗎？別人心中的聲音你又聽得見嗎？你心中是否有許多的聲音不是自耳畔響起，而是自心田深處某個被遺忘的角落，偶爾滿溢，或時時迴蕩於腦海中。某些時空觸動起回憶的聲音、未來的聲音、理想的聲音、思考流轉的聲音。你的心靈的土地上是繁雜吵鬧，亦是空蕩冷清，毫無聲響。也許你得學習安靜而易於感受，然後讓你的心田喧囂熱鬧，充滿意志的能量，而不是吵鬧得無法傾聽。\n\
    節錄自〈春天的聲音〉"
