- id: doc_111_高雄_林園_國文_g9s1e1_s5_5
  section: 5
  number: 5
  type: single
  page: 4
  stem: 琦君的作品中，常流露溫柔敦厚的善良，讀本文可推知琦君的性格主要得自何者？
  options:
  - label: A
    content: 與生俱來的良知
  - label: B
    content: 母親的諄諄告誡
  - label: C
    content: 外公與母親的身教
  - label: D
    content: 遺傳自父母的天性。
  group_stem: "(五)\n    記得我幼年時曾患過一種怪病，就是上嘴脣無緣無故腫起來，據說可以致命。母親聽外公的話，取牆角最髒之處的蜘蛛網，和了紅砂糖，敷在脣上，一夜之間，竟然就藥到病除。可能就是土法的黴素，以毒攻毒吧！外公說，原須以蜘蛛和砂糖和在一起的，但覺得太殘忍了，改用蜘蛛網代替，居然效果相同。這是我記憶中十二分深刻的一件事，也深深體會外公和母親不忍殺蜘蛛的一片慈悲心。\n\
    \    外公並教我，如果被蜈蚣咬了，除了可用雞的唾液塗抹消腫之外，急救之法，當先捉一隻蜘蛛放在創口上，蜘蛛會將蜈蚣毒液吸出。但吸了毒液的蜘蛛不久必會死亡，一定要用一個碟子盛一點清水，將蜘蛛放在水邊，牠會將毒液吐在水中，就可活命了。蜘蛛救了你，你必當救蜘蛛。我雖未曾被蜈蚣咬過，但外公那一份對小生命的愛護與感恩之心，卻深深使我感動，因而牢記不忘。\n\
    節錄自〈惜生隨感〉琦君"
  answer:
  - C
