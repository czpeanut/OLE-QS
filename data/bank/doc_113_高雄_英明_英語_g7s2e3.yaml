  group_stem: 'Visiting India

    There are about 1.4 billion people in India. And the country is very special for
    its customs. They are so different from other countries. When you visit India,
    you can be very surprised to see them.

    First, the Ganges is a holy river for Indians. They believe the water of the Ganges
    can clean people''s sins, so Indians do their everyday work in the river. They
    usually take a bath, wash clothes and even put the dead body into the river.

    Second, people in India like to eat with their hands. They always use their right
    hands to eat because they think the left hands are dirty. In fact, this is the
    way for them to show their respect for the food and god for Indians.

    Last, most Indians are vegetarians, they only eat vegetables and fruit. Besides,
    most people in India don’t eat beef because cows are holy and important animals
    to them. Indians get milk, cheese, and cream from them.

