  group_stem: "(三)\nWhat should you do when you get burned?\n  When you are burned\n\
    1. Cool it down : Run cool water over the burn for 10-15 minutes. This helps a\
    \ lot.\n2. Cover it with a clean cloth: After you cool it down, cover the burn\
    \ with a clean piece of cloth. Don’t use\ntape on the burn.\n3. Tell your parents\
    \ and teachers: They can help you take care of it and decide if you need to see\
    \ a doctor.\n  When you are burned\n4. Don’t use ice: Ice is too cold and can\
    \ make the burn worse.\n5. Don’t pop the blister: Blisters from a burn could protect\
    \ your skin underneath. Just keep them clean.\n6. Don’t put butter or toothpaste:\
    \ Some people say that you can put butter or toothpaste on burns, but that’s\n\
    not a good idea. These things can make the burn worse and may even cause infection.\n\
