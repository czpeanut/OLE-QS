  group_stem: "(二)\nHermit crabs have soft bodies and need the protection of the sea\
    \ shells. When they grow, they need\nbigger shells. However, a new study showed\
    \ many hermit crabs are now using plastic trash as their homes.\nScientists studied\
    \ this by looking at hundreds of pictures of hermit crabs. They saw examples of\
    \ hermit crabs\nliving inside plastic bottles caps, plastic boxes, and other plastic\
    \ trash.\nScientists are not sure why hermit crabs are using plastic “shells”,\
    \ but they have a few ideas. Some\nscientists think hermit crabs might be struggling\
    \ to find natural shells. Others think crabs use plastic “shells”\nbecause they\
    \ are lighter to carry. On the other hand, plastic may have bad chemicals, so\
    \ scientists need to\nwatch this change.\n     Hermit crab 寄居蟹   protection 保護\
    \   shell 殼   bigger 較大的   plastic 塑膠\ncap 蓋子 struggle 掙扎   find 找到   natural\
    \ 自然的   lighter 較輕的   carry 攜帶\nchemicals 化學物質"
