    \ what is \nnot.  Below are three of his famous paintings. \nThe Persistence of\
    \ Memory.  In this painting, there are melting clocks.  These clocks hang on trees\
    \ and \nsit on a table.  The sky is blue and there are mountains in the background.\
    \  The melting clocks make people \nthink about time in a different way.   \n\
    The Elephants.  In this painting, there are big elephants with long, thin legs.\
