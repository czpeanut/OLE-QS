  group_stem: '請問讀右方短文並回答問題：

    這個時期開始，政府不再堅持中華民國是唯一代表中國的合法政府，而是以經貿實力打破中國的外交封鎖，致力發展與無邦交國家的實質關係。主要措施包括：

    1. 鞏固並加強與友邦間的雙邊關係，加強政府重要首長互訪。

    2. 建立並提升無邦交國家的實質關係等。

    3. 積極參與國際組織。

