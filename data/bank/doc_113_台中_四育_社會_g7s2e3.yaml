- id: doc_113_台中_四育_社會_g7s2e3_s3_57
  section: 3
  number: 57
  type: single
  page: 6
  stem: 根據上文推論，請問政府須透過何項社會福利制度如何保障人民的社會安全？
  options:
  - label: A
    content: 居住正義
  - label: B
    content: 社會保險
  - label: C
    content: 社會津貼
  - label: D
    content: 健康照護。
  group_stem: '居住權是人權之一。依照聯合國人居委員會對於居住權的定義為：「適足的獨處居室、適足的空間、適足的安全、適足的照明和通風、基本廚衛浴設備、和達到就業及基本社會公共設施的合適地點，這一切均要在合理的費用之下。」

    在台灣，房子比人值錢。近7年，薪資成長率僅2成，很多年輕人每月還在苦哈哈領29K，2018年「房價負擔能力指標統計成果」又來到9.08，意思是一般上班族可能需要9年不吃不喝，才買得起一戶「中位數」住宅總價。

    房價高漲的年代，租屋已成為越來越多人的居住型態，尤以都市人口居多。內政部統計，2017年有租屋需求的人口數約300萬人，佔全台人口約八分之一。

    人生購屋大夢早就不敢想，但現在連租屋小確幸都成噩夢。不同年齡層的租屋困境正在發生。年輕小資族失去買房夢想與租屋市場搏鬥、買不起房的雙薪家庭面臨生活與租金夾殺的龐大居住焦慮、獨居老人尋屋嚐盡人情冷暖，被租屋歧視逼到城市的一隅……。

    租屋問題彷彿一個被囚禁的無解輪迴，困住不同世代。

    【報導者／囚租人生】'
