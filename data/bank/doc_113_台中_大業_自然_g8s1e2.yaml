  group_stem: '魚類的聽覺

    聲音在水中傳播時，經由魚類頭骨直接傳導，進而刺激內耳裡的聽覺感受細胞，啟動聽覺神經訊號，並傳遞到腦區進行聲音訊號的解讀。所以魚類雖然僅有內耳，沒有外耳和中耳等構造，但還是具有聽覺能力！

    科學家們發現魚類的聽覺能力，可以分成兩大類型。分別為「聽覺普通型」及「聽覺特化型」。

    「聽覺普通型」的魚類（如：吳郭魚、石斑魚），牠們所能聽到的聲音頻率範圍為200～1000赫茲，且聲音強度至少要90分貝以上。而大多數的魚類都是屬於這一型的。

    「聽覺特化型」的魚類（如：鯉魚及鯰魚），牠們所能聽到的聲音頻率範圍為200～8000 赫茲、最敏感的聲音強度只要60 分貝。因此「聽覺特化型」魚類的聽覺，頻率範圍較寬，所能感受的聲音強度也較普通型低。【資料來源：魚兒求生六技、魚兒的感官世界、嚴宏洋─中央研究院研究員】

