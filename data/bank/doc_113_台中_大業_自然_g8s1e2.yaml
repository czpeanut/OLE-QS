- id: doc_113_台中_大業_自然_g8s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 3
  stem: 針對波以耳實驗的敘述，何者正確？
  options:
  - label: A
    content: 玻璃罩設計成密閉，是避免實驗過程中能量外洩影響實驗結果。
  - label: B
    content: 聽見聲音的同時，亦能感受到玻璃罩的振動，可證明聲音是由物體振動所引起。
  - label: C
    content: 在具有空氣的密閉玻璃罩外，仍可聽見鈴聲，表示聲音的傳播是傳播介質。
  - label: D
    content: 比較步驟一及步驟三，可證明聲音的傳播是傳播能量。
  group_stem: '西元前三百多年，古希臘哲人亞里斯多德曾說：「聲音是靠空氣的振動才能傳播」。直至十七世紀，英國科學家波以耳，才利用實驗驗證。

    波以耳將鈴鐺放入充滿空氣、密閉的玻璃罩內，並接上抽氣機（如圖三），進行與聲音有關的真空實驗，實驗過程簡述如下：

    步驟一：抽氣前，除可清楚聽見鈴聲外。還可以感受到玻璃罩有振動現象。

    步驟二：逐漸抽出玻璃罩內空氣，聽見的鈴聲漸弱且玻璃罩振動變不明顯。

    步驟三：當玻璃罩內抽成真空，則無法聽見鈴聲，玻璃罩亦無振動情形。

    步驟四：當空氣慢慢注入玻璃罩，聽見的鈴聲漸強，玻璃罩振動變明顯。

    請根據內容，回答第15 題'
