  - label: B
    content: '300'
  - label: C
    content: '450'
  - label: D
    content: '600'
  group_stem: 因為北韓領導人頻頻試射飛彈，導致南、北韓關係十分的緊張。為降低敵對氣氛，南韓在南、北韓交界處，將一座心戰喇叭，架設於北韓所挖的深井前（如圖九）。心戰喊話撥放時（當時無風且井水水面平靜），聲音同步向北韓軍事大樓及深井傳播。2
    秒後，聲音傳播至北韓軍事大樓，且同時接收到從井底傳來的回聲。若當時聲音在空氣傳播的速率為300 $m/s$，在水中傳播速率是在空氣的5 倍；且井深是水深的2
    倍，試根據內容，回答第25~27題。
