  section: 1
  number: 31
  type: single
  page: 6
  stem: 依照文章內容敘述，甲～己六種光學儀器在使用時，何者生成的影像為「虛像」？
  options:
  - label: A
    content: 甲丙丁
  - label: B
    content: 丙丁戊
  - label: C
    content: 甲乙丙己
  - label: D
    content: 甲乙丙丁戊
  group_stem: '「2024 臺中市民野餐日」

    「2024 臺中市民野餐日」於11 月10 日（日）登場，此次以「野餐充電‧草地放電」為主題。活動當天，市長邀請民眾一同穿著「白色系衣服與牛仔褲」，增加參與感與營造清新氛圍。

    住在活動場地附近的小美，也想參與此次活動。出門前，她站在掛於牆面上的大型穿衣鏡前，端看身上印有多啦A 夢的綠色袖子白色棉T 與破洞牛仔褲，露出滿意的笑容。接著拿起化妝鏡，為自己畫上藍色的眼影與紅色的口紅。最後拿起近視眼鏡望遠檢查，確認眼鏡上是否乾淨，一切就緒後立馬出門。離家後，先至附近的便利商店買飲料。進入店裡，小美發現牆角頂端，除了裝設攝影機外，還掛有一個可讓店員掌握店內角落狀況轉角鏡。到了活動現場，小美看到樹幹上有隻獨角仙，於是拿起放大鏡觀察，同時利用以針孔成像原理製成的針孔相機，拍下當天的美景……。

    請根據內容回答31~33 題。'
