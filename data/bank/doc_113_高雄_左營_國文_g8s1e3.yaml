  group_stem: "徽州 休寧縣西十里外有小溪流，水甚淺，正鄱江發源之處。溪之北有寺，其南大山，林木蔚然。予嘗從其\n處登舟還鄉，因與僧語，僧云：「山間舊多猴，蓋以千數，每成群涉水，白晝相暴，炊飯纔熟，輒連臂入廚，\n\
    舁○1 甑○2 著地攫食之，且拋棄蹂踐，必盡乃止。寺眾不勝厭苦，至堅閉門，攜碗盛貯，藏諸袖中，歸房內，良\n久，然後敢食。後一遊僧來，見其害，謂眾曰：『吾有一計，當使永斷蹤跡，今夕試為之！』乃設罥○3\
    \ 網於\n廚，而置棗栗。俄頃，二猴墮罥中，不能出。別磨墨煙斗許，拌以水漿灌沃之，自頭至足，通身成黑獸，始縱\n之。猴自視毛色浸異，急奔窠○4 穴尋其類，其類望見，良以為他惡物也，悉力竄走，不敢回顧。黑者逐之愈\n\
    切，群猴去益遠，不三日，滿山皆空。」予記舊小說亦有一事，又讀《列子》，楊朱之弟布，素衣而出，天\n雨，解素衣，衣緇而返。其狗迎而吠之，布怒，將撲之，朱曰：「子無撲矣！使狗白而往，黑而歸，豈能無怪\n\
    哉！此理殊相似也。」                                                      ──宋．洪邁《夷堅志》 \n\
    註：○1 舁：ㄩˊ，抬舉；扛抬。○2 甑：ㄗㄥˋ，古代蒸煮食物的瓦器，有如現代的蒸籠。○3 罥：ㄐㄩㄢˋ，捕捉鳥獸的網 。  \n○4 窠：鳥獸蟲類棲息的巢穴。"
