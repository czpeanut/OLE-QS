  section: 3
  number: 18
  type: single
  page: 2
  stem: 司馬遷擅長利用事件及對話呈現人物的性格及特質，使得《史記》中的人物形象躍然紙上，試問在〈張釋之執法〉一文中，對於文句中呈現出來的人物對話與文意的配對，下列選項何者正確？
  options:
  - label: A
    content: 令他馬，固不敗傷我乎——責備語氣，描寫張釋之對縣人的魯莽行為感到憤怒不滿
  - label: B
    content: 且方其時，上使立誅之則已——質問語氣，刻畫張釋之義正詞嚴，理直氣壯的形象
  - label: C
    content: 民安所錯其手足？唯陛下察之——反詰期望語氣，寫張釋之態度不卑不亢，尊重君王
  - label: D
    content: 聞蹕，匿橋下。久之，以為行已過，即出——緊張語氣，寫縣人忿忿不平，氣急敗壞。
  lesson_raw:
