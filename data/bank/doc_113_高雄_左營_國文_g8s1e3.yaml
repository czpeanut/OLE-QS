  stem: Margaret Livingstone 教授在研究「蒙娜麗莎的微笑」時，發現了人類視覺的哪些特性，這些特性對於觀察畫作產生什麼影響？
  options:
  - label: A
    content: 專注於畫作眼睛區域時，周邊視覺落在嘴巴附近，使得微笑顯現，這是因為小窩視覺負責辨識影像與色彩，周邊視覺負責解析陰影。
  - label: B
    content: 因為陰影使然，在觀賞畫作時，無論視線集中在哪裡，微笑都會消失，此乃小窩視覺負責影像模糊，周邊視覺負責顏色辨識所導致。
  - label: C
    content: 小窩視覺適合解析陰影，周邊視覺適宜辨識細節。當欣賞該畫時，專注於畫作背景，周邊視覺便會模糊，影響微笑的辨識
  - label: D
    content: 小窩視覺與周邊視覺能自行調節影像色彩與陰影辨識。欣賞者注視任何區域都能均勻地解析陰影，使得微笑始終清晰可見。
  group_stem: "美國神經生物學家於「蒙娜麗莎的微笑」畫中，發現了達文西巨匠慧心的秘密。 \n笑，是世界共通的語言，楊貴妃的回眸一笑百媚生、妲己的開懷一笑，民不聊生、陳圓圓的會心一笑，傾國傾\n\
    城。而達文西的藝術傑作「蒙娜麗莎的微笑」，不但價值連城，更是法國 羅浮宮的鎮館之寶，百年來，不知多少\n藝術家為之傾倒、醉心。 \n美國 哈佛大學神經生物學家於這幅肖像畫中，發現了達文西巨匠慧心的秘密，這個理論已於2003\
    \ 年二月丹佛\n舉行的美國科學促進協會年會（annual meeting of the American Association for the Advancement\
    \ of \nScience）中提出。Margaret Livingstone 教授發現，如果欣賞該畫時，將視線完全集中在蒙娜麗莎的臉上，蒙娜\n麗莎的微笑會奇妙地消失。然而，若有把視線轉移到這肖像畫的其他區域時，反而可以感覺到蒙娜麗莎的微笑。\
    \ \nMargaret Livingstone 教授指出，人的視覺可分為小窩視覺（foveal vision）與周邊視覺兩類。小窩視覺又稱直\n接視覺，適宜辨識影像與色彩資訊的細節，卻不適合辨識陰影。但是，周邊視覺則負責陰影的辨識。如果專注地凝\n\
    視一件物體，隨著時間增長，周邊視覺的作用就漸漸減少。舉例子來說，當越來越專注地注視著印滿字的信上一個\n字時，相反地，其他的字就會顯得越來越模糊。 \n有趣的是，蒙娜麗莎的微笑幾乎都是利用陰影加以表現，因此，當觀眾欣賞畫作時，自然地會專注地看著肖像\n\
    畫人物的眼睛區域，此時的周邊視覺便落在蒙娜麗莎的嘴巴附近區域。由於周邊視覺不善於辨識細節，但善於解析\n陰影，觀眾便自然地意識到蒙娜麗莎微笑的存在。反之，若直接注視著蒙娜麗莎的嘴巴區域，因為直接視覺不善於\n\
    解析陰影，所以觀眾反而無法得到蒙娜麗莎微笑的青睞。 \n君子之交淡如水是一種完美的人際關係，距離增加了美感，彼此心神交會，就如同淡淡的清茶一般，雖無香氣\n\
    撲鼻、滿口生香，卻也神清氣爽，精神百倍。旁觀者清，當局者迷，看畫如此，待人接物又何嘗不是如此！ \n                           \
    \                          ──〈科學解析「蒙娜麗莎微笑」的祕密〉"
