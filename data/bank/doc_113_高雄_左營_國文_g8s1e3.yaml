  group_stem: "商鞅○1 少好刑名之學，事魏相公叔痤，為中庶子○2 。公叔痤知其賢，未及進。會痤病，魏惠王親往問病，曰：\n「公叔病，有如不可諱○3\
    \ ，將奈社稷何？」公叔曰：「痤之中庶子公孫鞅，年雖少，有奇才，願王舉國而聽之。」\n王嘿○4 然。王且去，痤屏○5 人言曰：「王即不聽用鞅，必殺之，無令出境。」王許諾而去。\
    \ \n公叔痤召鞅，謝○6 曰：「今者王問可以為相者，我言若，王色不許我。我方先君後臣，因謂王『即弗用鞅，當\n殺之』，王許我，汝可疾去矣，且見禽○7 。」鞅曰：「彼王不能用君之言任臣，又安能用君之言殺臣乎？」卒不去。\n\
    惠王既去，而謂左右曰：「公叔病甚，悲乎！欲令寡人以國聽公孫鞅也，豈不悖○8 哉！」 ──《史記‧商君列傳》 \n註：○1 商鞅：商君，名鞅，姓公孫。○2 中庶子：侍從官。○3\
