  stem: 根據上文，關於漢文帝時代的長者福利，其分發對象的分析，下列何者最恰當？
  options:
  - label: A
    content: 長者福利的管理方式，由都吏前往視察，督導不稱職者
  - label: B
    content: 九十歲以上長者取得物資方式，由嗇夫、令史親自送達
  - label: C
