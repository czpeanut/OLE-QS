- id: doc_113_高雄_左營_國文_g8s1e3_s3_19
  section: 3
  number: 19
  type: single
  page: 2
  stem: 關於〈張釋之執法〉一文的分析，下列敘述何者正確？
  options:
  - label: A
    content: 全文運用順敘法記敘歷史事件，以當事者的立場寫作
  - label: B
    content: 以文帝態度的「變」與張釋之的「不變」對比，顯示張釋之不知變通
  - label: C
    content: 文帝認為應該加重犯蹕之人的刑責，而張釋之認為乃是無心之過，應從輕發落
  - label: D
    content: 文帝最終能察納雅言，尊重司法獨立的精神，而張釋之能不畏威權，維護法律的尊嚴。
