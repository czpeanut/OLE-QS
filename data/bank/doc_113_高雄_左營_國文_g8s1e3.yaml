  stem: 根據本文敘述，下列何者最接近作者對「星空」的看法？
  options:
  - label: A
    content: 繁星皆有其存在的意義，和塵世並無干係
  - label: B
    content: 星空帶來的親近感受，讓人不由自主喜歡
  - label: C
    content: 天空愈是黑暗，愈能看到更多更遠的星星
  - label: D
    content: 星空隨處可見，不必捨近求遠至山野尋求。
  group_stem: "凝視夜空中的點點繁星，總是讓人興起讚嘆與敬畏之心，產生神秘而深邃的宗教情愫，覺得在那高高的天 \n際似乎存在著另一個國度，讓人心嚮往之。眾星默默，它們的閃爍、排列和運行，似乎也都各有其深奧的含\n\
    義，而且和塵世的我們有著某種神秘的關聯。 \n    在山夜的黑暗中，我靜靜看著滿天星斗，彷彿目睹這個神秘天國之乍現，心思漂浮在銀河與十二宮之間， \n忘了時間，忘了一切，感覺到一種難以言說的寧靜與喜悅。那是我「沐浴在陽光中」時所無法體驗的，我走進\n\
    黑暗，我擁抱黑暗，為的就是希望能有這種更深邃的感受。 \n    星空，是自然在黑暗中為人類所寫就的神秘詩篇，我每次抬頭仰視，彷彿都聽到它對我的教誨：「在黑暗\n\
    中，你將看得更多，而且更遠。」的確，只有在漆黑的夜裡，我們看到的星體才能多如恆河沙數，也才能看到\n那來自最遙遠星系、宇宙盡頭傳來的光。就是在對這巨大黑暗的張望中，我第一次認識到自己的渺小，學習到\n\
    活著要謙卑。 \n    這種黑暗中的光明，永恆而無言，是自然賜予我們的另一種光明。如今，我只能在遠離文明的鄉野，才能\n清晰地重睹這種深邃而神秘的光明。也唯有當我沉浸在這種光明中時，我才能醒悟：所謂「光明的城市」，其\n\
    實是被光明所汙染的城市。每隔一段時間，我渴望遠離城市，渴望的其實是逃離那被眾人歌頌的、過多的光明\n事物。 \n    自然不想讓我們永遠置身光明中，所以在白天之外還給我們黑夜，不想讓我們只感受一種光明，所以在陽\n\
    光之外還給我們星光和月光。我的靈魂不想讓我只過一種生活，所以每隔一段時間，就會將我從白天的城市帶\n到黑夜的山野。                    \
    \                                      ──王溢嘉〈星光的教誨〉"
