- id: doc_113_高雄_左營_國文_g8s1e3_s4_41
  section: 4
  number: 41
  type: single
  page: 6
  stem: 請問關於(甲)文中，臺灣青少年渴望贏得認可的原因為何？
  options:
  - label: A
    content: 在班上用炫耀物質消費來爭取社交地位
  - label: B
    content: 在學校無法專心，衝動易怒干擾大家上課
  - label: C
    content: 在團體中被邊緣化，消費購物就是愛自己
  - label: D
    content: 兒童時未能從其父母身上得到必要的情感關注。
  group_stem: "(甲)〈山道猴子的一生〉在臺灣迅速竄紅，故事主軸大致上描繪一名便利超商夜班男子購買超出能力所及的重機\n、遭第一任女友劈腿、不信任第二任女友，最終導致悲慘的結局。\
    \ \n    在臺灣，許多父母在外地大城市上班，將兒女交給祖父母照顧，以年節團聚買禮物給兒女，代替日常關愛。\n兒女學到購物就是愛自己，在班上用炫耀物質消費來爭取社交地位。許多孩子未能從身邊大人身上獲取必要的情\n\
    感關注，導致認知發展連帶受損。青少年因此在學校無法專心，衝動易怒干擾大家上課，功課不好、在團體中被\n邊緣化，渴望贏得別人關注認可。 \n    而一般人大致認為「衝動性消費」的揮霍導致貧窮，例如窮人竟敢花錢吃龍蝦。其實貧窮無所不在的身心壓\n\
    力，嚴重侵蝕了窮人正常應付工作生活所需的情緒資源。正是這種壓力，使龍蝦從窮人無關痛癢的想要，變成急\n迫需要，重機就是山道猴子飢渴的龍蝦。剝奪了不能沒有的自尊，導致只能從自毀的揮霍重金贖回。消費性債務\n\
    ，就是山道猴子自尊的贖金。              ──摘錄．改寫自盧郁佳《〈山道猴子的一生〉：獻給禿鷹的贖金》 \n(乙)〈山道猴子的一生〉背景設定雖是「騎機車跑山的車圈」，但不論是否為圈外人，都能輕易相信類似的事真實\n\
    在這個世界上發生，畢竟「重機」可以比喻成生活中追求的膚淺價值或商品，以為得到了一生就能真正滿足。 \n    而要讓一個角色生動就得提到「角色塑造」，讓觀眾能夠看見這個角色面對的「謊言」、「需要」與「想要」。\n\
    而〈山道猴子〉中的主角終究沒有勘破「謊言」的迷障，難以逃避人生中最後的悲劇。例如：《祕境冒險》中主角\n已擁有完美的家庭卻仍嚮往過往的冒險生涯，「缺乏刺激」就是他的謊言。而一個角色所「需要」與「想要」的事\n\
    物往往會產生衝突，甚至可能完全相反。〈山道猴子的一生〉主角想要的是受人吹捧的虛榮，因此即使無法負擔高\n額的利率、無法有效償還貸款也要買重機、交檔車女友，然而他真正需要的不過是有一群支持他的朋友與對重機\n\
    無可取代的熱情罷了。      ──摘錄．改寫自超粒方影片《一個悲劇的誕生 --〈山道猴子的一生〉深度解析》"
