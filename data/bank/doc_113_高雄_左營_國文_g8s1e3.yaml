- id: doc_113_高雄_左營_國文_g8s1e3_s3_28
  section: 3
  number: 28
  type: single
  page: 3
  stem: '臺灣是我們的家，過去唯利是圖的經濟開發，使國土遭到嚴重破壞。空中攝影大師齊柏林透過高空攝影鏡頭，帶領眾人飛越臺灣，共同領略福爾摩沙海岸之美，希望喚起所有人對環保意識的重視，共同拒絕廢水空污進駐，找回過往曾有的秀麗青山與潺湲綠水。

    有關這段文字中所使用的句型說明，下列何者正確？'
  options:
  - label: A
    content: 唯利是圖──此句乃賓語提前的「判斷句」，經還原後，原句應是「唯圖利」
  - label: B
    content: 齊柏林透過高空攝影鏡頭，帶領眾人飛越臺灣──敘事句，主語是「齊柏林」
  - label: C
    content: 共同領略福爾摩沙海岸之美──這句是「表態句」，用「美」來形容海岸狀態
  - label: D
    content: 找回過往曾有的秀麗青山與潺湲綠水──有無句，用「有」表明存在的事實。
  tags:
