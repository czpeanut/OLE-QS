  stem: 關於《史記》的簡介，下列說明何者正確？
  options:
  - label: A
    content: 為中國第一部紀傳體通史，記載從黃帝到漢文帝年間，大約三千年的歷史
  - label: B
    content: 全書內容分為「本紀」、「世家」、「列傳」三大類，後人增列「書」、「表」作為附錄
  - label: C
    content: 開傳記文學先河，由繼承父職的太史令司馬遷所著，完成此書後，因李陵事件入獄，受宮刑
  - label: D
    content: 表現人物性格，語言鮮明生動，為後代戲曲、小說提供豐富的題材，也是兩漢以後散文的典範。
  lesson_raw:
