  stem: 〈白頭吟〉與〈有所思〉中的女性角色比較，下列何者正確？
  options:
  - label: A
    content: 兩首詩中的女子都因家人阻撓而感情受挫。
  - label: B
    content: 〈白頭吟〉中的女子面對背叛表現較為平靜，而〈有所思〉中的女子用較激烈的摧燒手段表達自己的憤怒。
  - label: C
    content: 〈白頭吟〉的女子從未動情，〈有所思〉中的女子則對愛情充滿幻想。
  - label: D
    content: 兩首詩的女子都毫不猶豫地離開負心的男子。
  group_stem: <table><tr><td>〈白頭吟〉 佚名<br>皚如山上雪，皎若雲間月。聞君有兩意，故來相決絕。今日斗酒會，明旦溝水頭。躞蹀①御溝上，溝水東西流。淒淒復淒淒，嫁娶不須啼。願得一心人，白頭不相離。竹竿何嫋嫋②，魚尾何簁簁③。男兒重意氣，何用錢刀④為。<br>【註釋】①躞蹀：音ㄒㄧㄝˋ
    ㄉㄧㄝˊ，小步行走的樣子。②嫋嫋：音ㄋㄧㄠˇ ㄋㄧㄠˇ，形容搖曳不定。③簁簁：音ㄕㄞ，魚躍貌。④錢刀：古代一種刀型錢幣。</td><td>〈有所思〉 佚名<br>有所思，乃在大海南。何用問遺①君？雙珠玳瑁簪，用玉紹繚②之。<br>聞君有他心，拉雜摧燒之。摧燒之，當風揚其灰。從今以往，勿復相思！相思與君絕！<br>雞鳴狗吠，兄嫂當知之③。妃呼晞！④秋風肅肅晨風颸⑤，東方須臾高⑥知之。<br>【註釋】①遺：音ㄨㄟˋ，送。②紹繚：纏繞。③雞鳴狗吠，兄嫂當知之：指當年幽會的狀況。④妃呼晞：感嘆詞，同白話的「唉！」。⑤颸：音ㄙ，疾風。⑥高：同「皓」，天亮。</td></tr></table>
