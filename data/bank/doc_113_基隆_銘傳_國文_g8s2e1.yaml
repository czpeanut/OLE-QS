  options:
  - label: A
    content: 邯鄲驛里逢冬至，抱膝燈前影伴身。想得家中夜深坐，還應說著遠行人。
  - label: B
    content: 渭城朝雨浥輕塵，客舍青青柳色新。勸君更盡一杯酒，西出陽關無故人。
  - label: C
    content: 浮雲遊子意，落日故人情。揮手自茲去，蕭蕭班馬鳴。
  - label: D
    content: 故人西辭黃鶴樓，煙花三月下揚州。孤帆遠影碧山盡，惟見長江天際流。
