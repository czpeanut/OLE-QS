- id: doc_113_基隆_銘傳_國文_g8s2e1_s7_1
  section: 7
  number: 1
  type: essay
  page: 7
  stem: '題目：比競爭更重要的事


    請閱讀以下資訊，並按題意要求完成一篇文章


    <table><tr><td>我們平常雖然在考試成績上互相競爭，不過到學校求學，與同學的互動和班級向心力也是很重要的。</td><td>在家裡總是和哥哥爭吵誰比較優秀，希望表現良好，獲得爸媽較多的關愛，其實大家都是一家人，不會真的往心裡去。</td></tr><tr><td>在公司中為了升遷和資源分配，我與同事彼此競爭。但在職場上，大家有共同的努力目標公司才會發展得更好，增加自己專業實力，也才能問心無愧的升職。</td><td>球場上與對手競爭是必然的。但所有比賽中，擁有運動家風度，與隊友團隊合作，才能更有機會獲勝。</td></tr></table>


    　　競爭是進步的動力，在日常生活中，競爭無所不在，無論是學業、工作，甚至是娛樂活動，人們常常想努力超越他人，以獲得更好的成就。然而，除了競爭之外，人生中還有許多值得重視的價值請以「比競爭更重要的事」為題，寫出你認為比競爭更重要的事是什麼？可以親身經歷、觀察所得，從6w方向思考，加以舉例或說明，使文章更具說服力。


    測驗注意事項：

    1. 請用本國文字書寫，可不用抄題，請記得在作文卷上寫明班級、座號、姓名。

    2. 請於寫作測驗答案卷上作答，如需擬草稿，可以使用本卷空白的部分。

    3. 依據試場規則，寫作測驗答案卷中不得作任何標記。故意汙損答案卷、損壞試題本，或在作文內容中顯示自己身分者，該科不予計分。

    4. 依據試場規則，寫作測驗作答時，書寫內容不得超出答案卷格線外框，且務必使用黑色墨水的筆，不得使用鉛筆或其他顏色的筆，違者扣1級分。更正時，請使用修正帶（液）。如有超出格線外框、字跡太過潦草或汙損等情事，導致閱卷老師無法判讀寫作內容者，其責任由考生自負，不得提出異議。

    5. 不可使用詩歌體裁，否則不予計分，亦不得要求增加作答用紙。'
