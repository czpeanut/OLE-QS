  stem: 以下對於〈木蘭詩〉的說明，何者正確？
  options:
  - label: A
    content: 文中對於木蘭的軍旅生活僅以簡筆帶過，是為了凸顯她「孝順」的形象。
  - label: B
    content: 木蘭代父從軍的理由是因為期待「策勳十二轉，賞賜百千強」。
  - label: C
    content: 主旨是藉由木蘭代父從軍的故事，控訴府兵制度的不公平。
  - label: D
    content: 從木蘭返鄉，家人準備相迎的敘述，可以看出家人驚訝錯愕的情緒。
  lesson_raw:
    title: 木蘭詩
    basis: 題目考查〈木蘭詩〉
