- id: doc_113_基隆_銘傳_國文_g8s2e1_s2_21
  section: 2
  number: 21
  type: single
  page: 3
  stem: '敬愛的基隆市長足下(甲)：

    　　我是銘傳國中的學生演濱，謹以至誠向您反映貴校(乙)前方劉銘傳路於上學時段交通壅塞的問題。每當晨間上學之際，此路段車流擁擠，車輛與行人交錯而行，導致交通混亂。部分家長為確保孩子安全，選擇親自駕車接送，然車輛過多又進一步加劇壅塞，形成惡性循環。

    　　為改善此一狀況，謹提出以下灼見(丙)，尚祈市長斟酌參酌：1.增派交通導引人員。2.加強劉銘傳路上違停車輛取締。3.規劃上下學期間單行通道調撥。4.鼓勵學生步行上學。

    　　此建議純為一介學子關切校園周邊交通安全之淺見，或有未周之處，尚祈市長及市府團隊不吝指教。

    敬祝

    政躬康泰，市務昌隆！

    銘傳國中學生 演濱 敬啟(丁) 114年09月21日


    濱濱在市長信箱寄了一封信給基隆市長，請他改善劉銘傳路上、下學時塞車問題，但這封信有些錯誤，小君老師協助修改畫線處後，何者正確？'
