  section: 2
  number: 11
  type: single
  page: 1
  stem: 新詩創作很講究「象」(人事、景物)與「意」(情感、內涵)的搭配，請問以下關於〈讓春天從高雄出發〉與〈控訴一根煙囪〉中「象」與「意」的搭配，何者有誤？
  options:
  - label: A
    content: 象：麻雀被迫搬了家，風在哮喘，樹在咳嗽。意：工業汙染破壞了自然環境。
  - label: B
    content: 象：像一個流氓對著純潔的女童，噴吐你滿肚子不堪的髒話。意：煙囪排放的廢氣，對純潔小孩的影響最大。
  - label: C
    content: 象：讓木棉花的火把，用越野賽跑的速度，一路向北方傳達。意：讓春天的氣息與文藝氣息從高雄向北方擴散。
  - label: D
    content: 象：那許多矇矇的眼瞳，正絕望的仰向，連風箏都透不過氣來的灰空。意：市民飽受空汙之害，卻無能為力。
  lesson_raw:
