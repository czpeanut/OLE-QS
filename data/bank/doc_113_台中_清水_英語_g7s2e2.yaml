    Penny: Yes. I have English class on Saturday morning, and it''s near here. I often
    eat lunch here after my English class. How about you?

    Jack: I go to my cousin''s house every Saturday, and I always see Corner on my
    way. But this is my first time here!

    Penny: You can come here more often. Corner is excellent! Foods are delicious
