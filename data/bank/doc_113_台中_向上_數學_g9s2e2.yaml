  section: 1
  number: 24
  type: single
  page: 4
  stem: 24.假設某食品工廠2025 年的碳排放量為7.5 萬公噸，若該工廠可提出減碳計畫，卻忘記提出，導致工廠在2026 年費率的計算由優惠費率提升為一般費率，則繳交的碳費『額外』增加多少？(以科學記號表示)
  options:
  - label: A
    content: $1.5 \times 10^{7}$
  - label: B
    content: $1.5 \times 10^{6}$
  - label: C
    content: $1.25 \times 10^{7}$
  - label: D
    content: $1.25 \times 10^{6}$
  group_stem: '請閱讀下列敘述後，回答24~25 題

    淨零碳排（Net Zero Emissions）指的是在特定一段時間內，全球人為排放的溫室氣體量和人為移除的量相抵銷後，使其結果為零。而淨零碳排的核心目標，就是阻止地球持續升溫。

    因應全球「2050 淨零碳排」的目標，環境部於2024 年10 月召開碳費審議委員會，預計於2026 年開始，針對部分企業逐年徵收碳費。

    下圖為碳費的計算方式，其中「排放量」是根據該企業前一年的碳排放量計算(例如：2026 年繳交的碳費，是根據2025 年碳排放量計算)，費率則分為「一般費率」與「優惠費率」兩種，一般費率為每公噸300
    元；優惠費率為每公噸50 元，若企業想適用優惠費率，需提出減碳計畫經環境部核定，並達成「以2021 年的碳排放量為基準，2030年的碳排放量需減少42%」的目標，才能適用。'
