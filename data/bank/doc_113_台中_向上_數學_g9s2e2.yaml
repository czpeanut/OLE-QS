    總行程：10 公里

    EV 行駛比率：34%

    「EV 行駛比率」表示在這趟行程中，使用電池行駛的距離佔全部行駛距離的百分比。EV 行駛比率= $\frac{\text{使用電池行駛的距離}}{\text{全部行駛的距離}}
    \times 100\%$

    而油電混合行駛的路程中會有60%計算到電池行駛距離中。因此電腦會記錄使用電池行駛距離為：

    使用電池行駛的距離：1+4×0.6=3.4km

    EV 行駛比率：$\frac{3.4}{10} \times 100\% = 34\%$

    請根據上述資訊回答下列問題：

    (1) 若阿國老師今天的行程為純電模式行駛3 公里，油電混合模式行駛12 公里，純油模式行駛5 公里，則APP 上面記錄的EV 行駛比率為何？

    (2) 下圖是阿國老師上星期日出遊行程APP 所顯示的畫面，已知此趟行程中，純油模式行駛16 公里，則純電模式和油電混合模式各行駛多少公里？'
