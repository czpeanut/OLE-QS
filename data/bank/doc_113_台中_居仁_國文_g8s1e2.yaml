  stem: 本文末「吾又安得不喜之哉？」和下列哪一句相呼應？
  options:
  - label: A
    content: 古人植卉木而有取義焉者
  - label: B
    content: 於是乎有裨焉
  - label: C
    content: 予觀而喜之
  - label: D
    content: 復何以尚之哉
  group_stem: "古人植卉木而有取義焉者，豈徒為玩好而已。故蘭取其芳，諼草取其忘憂，蓮取其出淤泥而不染。不特卉木也，佩以玉，環以象，坐右之器以敧，或以之比德而自勵，或以之懲志而自警；進德修業，於是乎有裨焉。\n\
    \  會稽 黃中立，好植竹，取其節也；故為亭竹間，而名之曰「尚節之亭」，以為讀書游藝之所，澹乎無營乎外之心也。予觀而喜之。\n  夫竹之為物，柔體而虛中，婉婉焉而不為風雨摧折者，以其有節也。至於涉寒暑，蒙霜雪，而柯不改，葉不易，色蒼蒼而不變，有似乎臨大節而不可奪之君子。信乎！有諸中，形於外，為能踐其形也。然則以節言竹，復何以尚之哉？\n\
    \  世衰道微，能以節立身者鮮矣。中立抱材未用，而早以節立志，是誠有大過人者，吾又安得不喜之哉？\n（節錄自劉基 尚節亭記）\n注釋：\n①諼草：即萱草，古代一種相傳可忘憂的植物。\n\
    ②裨：益處。  ③「柯」不改：草木的枝莖。"
