- id: doc_113_台中_居仁_國文_g8s1e2_s6_8
  section: 6
  number: 8
  type: single
  page: 5
  stem: 下列哪一個選項不是人體對於「氧化壓力」的防禦機制？
  options:
  - label: A
    content: 抗氧化酵素
  - label: B
    content: 非酵素性分子
  - label: C
    content: 大分子的修復系統
  - label: D
    content: 多吃多喝補充養分
  group_stem: "生活中常常會聽到許多抗氧化的商品，但是，大多數的人實際上並不了解何謂氧化，這裡所指的氧化，是細胞所受到的氧化壓力。在生物體藉由呼吸作用產生能量的過程中，極少量的氧氣會變成有害的活性氧分子①，這也是生物體最主要的氧化壓力來源。\n\
    \  活性氧分子具攻擊性，會攻擊細胞中的大分子，造成氧化壓力。除了代謝作用，外在的環境如太陽輻射、空氣汙染、藥物、不正當的飲食、抽菸和暴露於化學物質等，也都會造成活性氧分子的產生。\n\
    \  既然人體每天都會產生活性氧分子，所以當然也具有一些防禦的機制，這些防禦機制包括非酵素性分子的防禦，如維生素C、維生素E；抗氧化酵素的防禦，如超氧歧化酶（Superoxide\
    \ Dismutase）、過氧化氫酶（Catalase）②等。同時，生物體也具有大分子的修復系統。\n  由於氧化壓力會造成生物體的老化，所以抗氧化的商品特別受到人們的青睞，但是，就算不使用這些商品，只要能夠避免暴露在上述如太陽輻射、抽菸、不當飲食等造成氧化壓力的環境之下，你也可以藉由預防的方式輕鬆抗老化。\n\
    注釋：\n①活性氧分子：容易與其他物質發生反應的含氧分子。\n②超氧歧化酶、過氧化氫酶：細胞中清除氧化壓力的酵素，能將呼吸作用產生的活性氧分子轉變成水和氧氣，使細胞免於氧化壓力的傷害。"
- id: doc_113_台中_居仁_國文_g8s1e2_s6_9
  section: 6
  number: 9
  type: single
  page: 5
  stem: 奈米是度量什麼的單位？
  options:
  - label: A
    content: 重量
  - label: B
    content: 長度
  - label: C
    content: 時間
  - label: D
    content: 體積
  group_stem: "近年來奈米科技經常在日常生活中出現，奈米到底是什麼？難道是生魚片「沙西米」？還是新品種的冠軍米？都不是，奈米是一種單位，一奈米（Nanometer）等於十億分之一公尺（$10^{-9}$公尺），約為頭髮直徑的十萬分之一。近年來奈米技術廣泛運用在醫學、藥學、美容保養，甚至日常生活用品當中，可說是21世紀最重要的產業之一。\n\
    \  實際上，自然界早就使用奈米技術了，例如爬牆不會掉下來的壁虎神功、蜜蜂體內有奈米磁石而可以自動導航、蓮花的出淤泥而不染等皆是。而奈米技術只是我們應用了自然界中原有的技術來改善或便利我們的生活。例如，我們利用了蓮花出淤泥而不染的「蓮花效應」（Lotus\
    \ Effect，由於荷葉表面的奈米結構而具有抗水防塵的功能），而製造了防水環保塗料、防水防塵布料、自潔玻璃以及奈米防汙馬桶等民生用品。\n（參考自佛布茲《學蜘蛛人趴趴走》，遠流出版社）"
