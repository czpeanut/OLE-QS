  group_stem: "古之學者必有師。師者，所以傳道、受業、解惑也。人非生而知之者，孰能無惑？惑而不從師，其為惑也終不解矣。\n  生乎吾前．其聞道也，固先乎吾，吾從而師之；生乎吾後，其聞道也，亦先乎吾，吾從而師之。吾師道也，夫庸知其年之先後生於吾乎？是故無貴、無賤、無長、無少，道之所存，師之所存也。\n\
    \  嗟乎！師道之不傳也久矣！欲人之無惑也難矣！古之聖人，其出人也遠矣，猶且從師而問焉；今之眾人，其下聖人也亦遠矣，而恥學於師；是故聖益聖，愚益愚，聖人之所以為聖，愚人之所以為愚，其皆出於此乎？\n\
    \  愛其子，擇師而教之，於其身也則恥師焉，惑矣！彼童子之師，授之書而習其句讀①者，非吾所謂傳其道、解其惑者也。句讀之不知，惑之不解，惑師焉，或不焉，小學而大遺，吾未見其明也。\n\
    \  巫、醫、樂師、百工之人，不恥相師；士大夫之族，曰師、曰弟子云者，則羣聚而笑之。問之，則曰︰「彼與彼年相若也，道相似也」。位卑則足羞，官盛則近諛。嗚呼！師道之不復，可知矣。巫、醫、樂師、百工之人，君子不齒，今其智乃反不能及，其可怪也歟！\n\
    \  聖人無常師，孔子師郯子、萇弘、師襄、老聃。郯子之徒，其賢不及孔子。孔子曰︰「三人行，則必有我師」。是故弟子不必不如師，師不必賢於弟子；聞道有先後，術業有專攻，如是而已。\n\
    \  李氏子蟠，年十七，好古文，六藝經傳，皆通習之；不拘於時，學於余。余嘉其能行古道，作「師說」以貽②之。\n                      \
    \               (韓愈 師說)\n注釋：\n①句讀：也叫句逗，古人指文辭休止和停頓處。文辭意盡處為句，語意未盡而須停頓處為讀（逗）。\n②貽：贈送"
- id: doc_113_台中_居仁_國文_g8s1e2_s6_6
  section: 6
