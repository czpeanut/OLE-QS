  stem: 56. Which is the best title for the news?
  options:
  - label: A
    content: A Terrible Old Woman
  - label: B
    content: Age Limit for Elderly Drivers
  - label: C
    content: An Important Medical Review
  - label: D
    content: A New License for Old People
  group_stem: "(A)\nNews>UK\n      56        \nBy Patrick Davis, news reporter\nMonday\
    \ 30 September 2024 14:18, UK\n\nJune Mills hit two women, killing Brenda Joyce,\
    \ 76, and injuring Jennifer Ensor, 80, when she accidentally drove her car on\
    \ the sidewalk on 2 August last year.\n\nMills is now a 96-year-old woman and\
    \ can only walk a few steps. She sat in a wheelchair and told the police it all\
    \ happened too fast.\n\nShe said: “There were people in front of me but I couldn’t\
    \ stop the car. It was going so fast.”\n\nIs there an age limit for elderly drivers?\
    \ For different countries, the answer may be different. Is it safe for old people\
    \ to drive? That is surely something everyone worries. These days, more and more\
    \ people ask for a rule to set the age limit for elderly drivers.\n\nIn the UK,\
    \ when a driver is 70 years old, they must finish their medical review to show\
    \ they are fit to drive and renew their license every three years.\n\nIn Europe,\
    \ the European Commission tried to push drivers over 70 to do their medical review\
    \ every five years. However, there were some backlashes from some countries, such\
    \ as Belgium, France and Germany. There are no renewal rules for elderly drivers\
    \ in these countries, and there will not be. In Finland, you need to get a medical\
    \ review every five years when you’re at the age of 45.\n\nIn the US, each state\
    \ has a different rule. Take Illinois for example. Drivers need to take a driving\
    \ test once they’re over 75. When it comes to 85, it has to be every year.\n\n\
    In Australia, drivers over 75 have to do a medical review every year to keep their\
    \ license. When they’re 85, a driving test is waiting for them and it will be\
    \ every two years. If they don’t want to take the on-road test, they can have\
    \ a “modified license.” This will limit how far they can drive and also stop them\
    \ driving at night.\n\nThere may be different rules, but one should always know\
    \ when to give out their car keys. That’s what really matters.\n\n injuring 使受傷\
    \ limit 限制medical review 醫學評估 license 駕照  should 應該  matter 重要"
