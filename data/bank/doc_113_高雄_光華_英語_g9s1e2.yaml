  group_stem: 'In Australia’s Northern Territory, a new course teaches students how
    to deal with encounters with snakes, including dangerous ones like king brown
    snakes and pythons.

    The key lesson is to stay calm because snakes usually don’t want to hurt people.
    Johnny McGannon, the leader of the course, says that students will learn to stay
    safe around snakes and no longer need to act recklessly around snakes, like pulling
    their tails. Since the beginning of the year, about thirty students from different
    jobs, like military workers and zoo staff, have taken the course and finished
    the training.

    However, not everyone agrees with this kind of course. Rex Narf, who runs a reptile
    center in Alice Springs, has caught snakes for years and feels that experience
    is more important than a formal course. But McGannon says all the course trainers
    share the same idea: teaching people to respect and act safely around snakes.
    This helps protect both people and these often misunderstood animals.


