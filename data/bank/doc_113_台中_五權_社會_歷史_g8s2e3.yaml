  section: 1
  number: 26
  type: single
  page: 1
  stem: '「歷史事實」與「歷史解釋」的區別，在於歷史事實是客觀呈現過去發生的事件；而歷史解釋則是後人運用歷史資料，對相關歷史事件進行的詮釋與評價。下列敘述中，何者最適合歸類為「歷史事實」？

    隨著中國加入世界經濟體系，(甲)製造業蓬勃發展，逐漸成為「世界工廠」，與改革開放前相比，(乙)國內生產總值上升，人民平均收入增加。(丙)大幅提升的經濟與政治實力，讓中國在第三世界有重要影響力。此局勢引起美國的疑慮，希望強化在東亞的勢力，(丁)中美兩國的競爭，使得東亞國際情勢趨於緊張。'
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
