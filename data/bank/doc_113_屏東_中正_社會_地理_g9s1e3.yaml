  section: 1
  number: 26
  type: single
  page: 3
  stem: 鐵礦石是某國最重要的出口商品之一，為國家創造了大量的外匯收入。根據某國政府數據，該國的出口礦物中，以鐵礦石為最大宗，其出口量更佔全球海運鐵礦石貿易的
    56%。然而，隨著全球鋼鐵產業轉向可再生能源供應，該國的傳統鐵礦石出口模式正面臨嚴重挑戰。請問文中某國應為下列哪一個國家？
  options:
  - label: A
    content: 澳洲
  - label: B
    content: 英國
  - label: C
    content: 德國
  - label: D
    content: 日本
  group_stem: ■隨著全球對減碳需求的重視，鋼鐵產業正加速向「綠色鋼鐵」生產模式轉型，傳統的高碳排放製造方式將逐步被取代。未來，鋼鐵產業的競爭力將不僅取決於產量與成本，更取決於其碳排放量。這場轉型不僅是技術的革新，更是產業結構的重塑。傳統鋼鐵生產主要依靠煤基焦炭作為還原劑，這種高碳方式每生產一噸鋼就排放約1.8
    噸二氧化碳，對環境造成極大負擔。而綠色鋼鐵則以氫氣取代焦炭，利用可再生能源生產氫氣，實現接近零排放的製造流程。這種低碳技術的應用，將是未來鋼鐵生產的核心。請回答26-28
    題。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
