  stem: 第53 屆太平洋島國論壇在2024 年8 月26 日在東加王國舉行。今年主題「轉型韌性太平洋：從現在開始建設更好的未來」。在眾多討論項目當中，氣候變遷導致海平面上升，依然是這些島嶼國家最大的擔憂，本屆論壇重頭戲還有與會領袖同意支持由澳洲出資主導的「太平洋警務倡議」，根據倡議，澳洲政府將斥資約2.7
    億美元，建立4 個區域警務訓練中心和一支多國危機因應部隊，強化太平洋島國的警力訓練和跨國支持。此舉也被外界視為是要削弱某國在太平洋地區日益擴張的影響力，因為近年來，某國不只是該地區主要的基礎設施貸款國，更與索羅門群島簽署一項秘密安全協議，企圖在政治戰略領域發揮更大作用。請問文中的某國指下列哪一個國家？
