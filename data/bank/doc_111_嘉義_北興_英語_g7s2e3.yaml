  group_stem: "●第三組\n The Olympics are a big event in the world of sports. They take\
    \ place every four years, and cities around the world want to host them. In fact,\
    \ they are proud to do so. They work hard to get everything ready for the big\
    \ event. Thousands of people and athletes come from around the world to be at\
    \ the games.\n The first Summer Olympics was in Athens, Greece, in 1896, and the\
    \ first Winter Olympics were in Chamonix, France, in 1924. London hosted the Summer\
    \ Olympics three times—in 1908, 1948, and 2012. Innsbruck, St. Moritz, and Lake\
    \ Placid each hosted the Winter Olympics twice.\n The athletes can’t wait to take\
    \ part in the Olympics. To get ready for the games, they train hard in their sport\
    \ for years. They don’t just train once or twice a week. They usually train for\
    \ many hours every day. They do that because they want to win medals and also\
    \ prize money from their countries.\n\n event 事件 host 主辦 be proud of 以……為榮 thousand\
    \ 千 athlete 運動員\ntrain 訓練 because 因為 medal 獎牌 prize money 獎金 country 國家"
