  group_stem: 'On September 21, the CPBL(中華職棒) held a game between the Dragons and
    the Elephants at the Taipei Dome, marking the retirement match for Brothers player
    Chou Szu-chi. “The Last Together “event attracted a full house of 40,000 people,
    who came to witness this historic moment. After the game, the popular Asian band
    Mayday performed as special guests, singing four of their well-known songs along
    with a tribute song for Chou, bringing a perfect night to the first day of the
    retirement event.

    The entire event was carefully planned and everyone expressed that they really
    liked it. Five people were interviewed after the event ended.

    Tony: I''m an Elephant fan, and I bought tickets immediately after seeing the
    news on TV.

    Cherry: The whole thing wasn''t easy at first. But Mayday helped a lot. They are
    really great at bringing joy to everyone.

