  group_stem: '題組：請依照下列資料，回答40~41 題：

    人手一機的時代，私密資訊和影像更容易取得和散布。

    網路性騷擾、散布性私密影像、性勒索，以及科技跟蹤騷擾等「數位性別暴力」日益嚴重。

    勵馨基金會日前展開「數位性別暴力被害人服務」，希望能協助更多受害人，並呼籲大眾一起響應數位防暴。

    因為目前針對數位性別暴力的法律規定仍有不足，並未明訂被害人保護措施，如受害人最需要的是遭散布的私密影像快速移除，不再有散布可能。所以勵馨基金會也呼籲立法院，希望儘速完成法律修正以落實防治，並進一步設立專門法律，以完全保障數位性別暴力受害者的權益。'
