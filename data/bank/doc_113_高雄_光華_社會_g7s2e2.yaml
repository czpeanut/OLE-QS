    因為目前針對數位性別暴力的法律規定仍有不足，並未明訂被害人保護措施，如受害人最需要的是遭散布的私密影像快速移除，不再有散布可能。所以勵馨基金會也呼籲立法院，希望儘速完成法律修正以落實防治，並進一步設立專門法律，以完全保障數位性別暴力受害者的權益。'
