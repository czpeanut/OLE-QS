  stem: '1925 年蔡元培在倫敦舉行追悼孫中山先生時說道：「我們信仰孫先生，敬愛孫先生，並不是因為孫先生的五官四肢有特別驚人的形式，無非因孫先生有卓越的識見、強毅的魄力、豁達的度量，可以使我們信仰與敬愛。」。

