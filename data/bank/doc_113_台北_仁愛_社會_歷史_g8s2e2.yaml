- id: doc_113_台北_仁愛_社會_歷史_g8s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '每一個重要城市，都有其獨特的特色和歷史意義。其中一個城市，是中國近代史上有一份重要宣言是在此簽訂，而此宣言的要點如下。請問有可能在介紹哪一個城市？

    (１)中、美、英三國盡一切力量對日作戰，以達到日本無條件投降為目的。

    (２)剝奪 1914 年後日本占得之太平洋島嶼，日本竊奪中國之滿洲、臺灣、澎湖，戰後均應歸還中華民國。

    (３)朝鮮應獲得自由與獨立。'
  options:
  - label: A
    content: 廣島
  - label: B
    content: 開羅
  - label: C
    content: 長崎
  - label: D
    content: 雅爾達 。
- id: doc_113_台北_仁愛_社會_歷史_g8s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 《花漾奶奶秀英文》（韓語：아이 캔 스피크)，英語：I Can Speak)，為一部韓國 2017 年電影，導演為金賢錫，並由演員羅文姬、李帝勳等領銜主演，改編自真實人物李詠書的故事。李詠書阿嬤是在
    15 歲時被日軍強徵成為「慰安婦」，並從韓國被送到臺灣新竹的慰安所，在慰安所裡，一名日本士兵教她唱了一首日本歌，歌詞裡的地名根據發音，聽起來像是「新宿」，其實是指臺灣的「新竹」。請問韓國婦女在戰爭期間，被逼做「慰安」，最有可能是在下列哪一場戰爭期間？
  options:
  - label: A
    content: 甲午戰爭
  - label: B
    content: 太平洋戰爭
  - label: C
    content: 韓戰
  - label: D
    content: 日俄戰爭 。
- id: doc_113_台北_仁愛_社會_歷史_g8s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '資料一：「1931 年日本帝國主義大規模武裝侵略中國東北的事件---日本駐中國東北境內的關東軍炸毀南滿鐵路柳條溝地區橋樑一段，並稱遭到中國軍隊有意破壞，當日夜間突然炮擊瀋陽，同時進攻吉林、黑龍江，至
    1932 年 2 月占領東北全境」。

    資料二：一位東北軍的士兵說道：「我已經好久沒有回到我的家鄉了，自從外敵入侵後，國民政府便下令要我們撤退，現在我們成為無根的浮萍，不知道何時才能回到那令人懷念的家鄉。」請問：當時國民政府抱持什麼樣的政策？'
  options:
  - label: A
    content: 外爭主權，內除國賊
  - label: B
    content: 以空間換取時間
  - label: C
    content: 停止剿共，一致抗日
  - label: D
    content: 先安內後攘外。
- id: doc_113_台北_仁愛_社會_歷史_g8s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '一九四〇年代，日本為掠奪南洋資源採取積極侵略，威脅美、英等國殖民地，美國為阻止日本的行動，對日本實施(甲) 手段，日本為突破資源不足的限制，於民國
    30 年 12 月發生(乙)事件。

    請問：文中的甲、乙分別為何？'
  options:
  - label: A
    content: 甲：農地轟炸、乙：珍珠港事變
  - label: B
    content: 甲：投擲原子彈、乙：無條件投降
  - label: C
    content: 甲：石油禁運、乙：珍珠港事變
  - label: D
    content: 甲：農地轟炸、乙：七七事變。
- id: doc_113_台北_仁愛_社會_歷史_g8s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '一位古董收藏家，收集各時期的舊硬幣和紙鈔，來保存欣賞。這天收藏家拿著一張舊紙幣說：「這是中國近代史上，財政金融改革的重要里程碑，在那個年代，市面上本來流通著各種貨幣，後來政府廢除銀兩，規定一律改用銀元；再過一陣子，政府規定只能用四家指定銀行，也就是中央、中國、交通、農民銀行所發行的紙幣，訂定為法幣，這終於解除了民國一直以來幣制混亂的局面。」

    請問上文收藏家所描述的應是下列哪一時期？'
  options:
  - label: A
    content: 十大建設時期
  - label: B
    content: 十年建設時期
  - label: C
    content: 國共內戰時期
  - label: D
    content: 中日戰爭時期。
- id: doc_113_台北_仁愛_社會_歷史_g8s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 孫中山於民國十三年（1924 年）4 月 12 日手書《建國大綱》，全文僅二十五條。這是中華民國成立後，孫中山針對國家建設所提出的規劃方案。《建國大綱》以選舉、罷免、創制、複決作為人民應有之「權」，以行政、立法、司法、考試、監察作為政府施政的「能」，權能區分，造成「萬能政府」，以實現三民主義。將國家建設設分為三個時期。請問以下關於各個時期的敘述，何者錯誤？
  options:
  - label: A
    content: 軍政時期是指民初至北伐成功前
  - label: B
    content: 按時間演進依序分為軍政、訓政、憲政三個時期
  - label: C
    content: 訓政時期的國家高法源依據為《中華民國訓政時期約法》
  - label: D
    content: 北伐完成後，進入憲政時期。
