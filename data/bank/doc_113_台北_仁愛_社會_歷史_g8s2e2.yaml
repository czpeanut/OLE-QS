  stem: 一本中國近代史的書籍中，有一段下列的敘述：「……此一事件發生於民國 26 年 12 月，侵略中國的日軍在城內及其郊區，犯下大規模屠殺、縱火以及搶掠等戰爭罪行。根據事後遠東國際軍事法庭的調查，當時日軍所殺害的中國平民和戰俘在
    30 萬人以上，第一個月約 2 萬中國婦女遭日軍姦殺，城內建築與設施高達三分之一被日軍縱火燒毀。這是人類史上，慘無人道的殺戮與傷害！」請問這段敘述是指哪一事件？
  options:
