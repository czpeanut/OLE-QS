  stem: 一部講述中國近代某位歷史人物的傳記影片，影片簡介寫著：「民初有位歷史人物，他曾說自己：『不怕死，不愛錢，大丈夫絕不受人憐，頂天立地男兒漢，光明磊落度餘年。』而他的一生，前期意氣風發，統率軍隊；後半生在被判
    10 年有期徒刑後，便被軟禁長達 55 年，其被幽禁的歲月中，更有部分是在臺灣度過的。這一切只因為他曾發動某件事情，改寫了中國近代歷史，可說是動搖了國民黨，卻拯救了共產黨。」請問這位歷史人物為何者？
