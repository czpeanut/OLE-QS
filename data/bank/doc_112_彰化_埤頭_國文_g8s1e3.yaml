  section: 3
  number: 34
  type: single
  page: 1
  stem: 在愛蓮說一文，作者用蓮花的特徵來象徵君子，就是「以物喻人」的寫作手法。下列的選項中，皆是運用此種「以物體的特質來表現人的特質。」請問何者的寫法是錯誤的？
  options:
  - label: A
    content: 小薏是班上的「火車頭」，帶領班上贏得運動會精神總錦標冠軍
  - label: B
    content: 善益常常被笑稱是「米蟲」，工作時常常渾渾噩噩
  - label: C
    content: 雙兒熱愛研究文物古籍，因此被稱作「老骨董」
  - label: D
    content: 這次月考，小瑤竟然考進前三名，是班上的大「黑馬」
