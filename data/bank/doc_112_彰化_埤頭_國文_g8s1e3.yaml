  stem: 「發明遠距離通訊的電報發明家摩斯與夥伴維爾協同研究，研發並改良了電磁技術，以及建立了編碼系統。他們創建摩斯密碼，利用點(•)與短線(一)的排列組合英文字母編碼。點的傳遞需要1個時間單位，而短線的傳遞則需要3個時間單位。字母間的空格需要3個時間單位，單字間的空格需要7個時間單位。舉例來說：s由三個點組成(•••)、o由三條短線組成(一一一)，因此sos就是三點、空格(以底線標示)、三短線、空格、三點(•••_一一一_•••)。傳輸一次需要花1x3+3+3x3+3+1x3=21個時間單位。」小可與同學討論摩斯密碼，下列誰的敘述正確？
  options:
  - label: A
    content: 小可：摩斯是發明遠距離通訊系統的電報發明家
