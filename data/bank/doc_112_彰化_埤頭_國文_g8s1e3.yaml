- id: doc_112_彰化_埤頭_國文_g8s1e3_s3_64
  section: 3
  number: 64
  type: single
  page: 3
  stem: 「跟著螃蟹先生劉烘昌來到海岸林，他在墾丁海岸林研究陸蟹生態，已經有十年的時間，他說以前幾個人偶爾會遇到一兩隻寄居蟹，現在幾乎不到刻意尋找，每次來都會遇到。在某一天下過雨後，他進行誘捕，沒想到有三分之一比例的寄居蟹都背著垃圾殼，另外三分之一則是背了大小不適合的貝殼，為什麼會誘捕到這麼高比例，奇奇怪怪的寄居蟹呢？主要是因為牠們住了一個不舒服的家，因此才會不斷在外面遊走，想要四處尋找一個舒服的殼。寄居蟹隨著體型的成長變化，從小到大必須不斷的尋找適合的貝殼來寄居，不同種類的寄居蟹，還會搭配不同的貝類。貝類與寄居蟹，原本是海洋生態系中相依相存的典範，在沒有貝殼可以回收之後，寄居蟹只好去回收垃圾。」根據本文，下列敘述何者正確？
  options:
  - label: A
    content: 現今已經很少見到背著塑膠垃圾的寄居蟹
  - label: B
    content: 寄居蟹的成長過程需要經歷不斷的更換貝殼
  - label: C
    content: 寄居蟹的殼和蝸牛的一樣，會隨著身形而變大
  - label: D
    content: 由於寄居蟹大量繁殖使得貝殼數量不足以供應
