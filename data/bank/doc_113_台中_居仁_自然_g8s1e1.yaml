    乙.測量氫氧化鈉晶體質量時，可將晶體直接置放於天平左盤；

    丙.習慣上，砝碼應先由大至小依序放置平衡。'
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲乙
  - label: C
    content: 乙丙
  - label: D
    content: 甲丙
