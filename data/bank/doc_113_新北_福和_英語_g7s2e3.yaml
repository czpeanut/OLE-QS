- id: doc_113_新北_福和_英語_g7s2e3_s2_55
  section: 2
  number: 55
  type: single
  page: 5
  stem: 55. What can we know about Edison?
  options:
  - label: A
    content: He was smart, but he still worked hard. That’s why he stood out.
  - label: B
    content: He said good words to tell people about his new inventions.
  - label: C
    content: He was a good boy at school. His teacher liked him very much.
  - label: D
    content: His inventions were all welcome; he was very rich.
  group_stem: 'D. (55~57)

    Thomas Alva Edison (1847-1931) was famous for his inventions. When he was a little
    child, he was very different from other children. He didn’t play toys like anybody
    else. He started his experiment at an early age. For example, he saw mother geese
    sit on eggs to keep them warm. He did it for many hours just like the geese, but
    he didn’t see the babies come out.

    At school, he always asked questions and made trouble again and again, so his
    teacher told his mom to take him home. His mom was furious because she was sure
    her son was not a fool. She turned into his teacher at home, and little by little,
    Edison learned lots of things by reading.

    Edison’s family was not rich. At the age of twelve, he worked on the train. He
    sold newspapers and snacks to train travelers at Grand Trunk Railway. He also
    had his lab on the train. There, he printed his own newspaper, The Weekly Herald.
    One day, his lab caught fire, and then his work stopped.

    Edison still read to know everything about science and technology. In 1868, he
    got his first patent because of his invention. Later, when he knew people didn’t
    want his invention, he changed. He would only make useful things of people. When
    he was about thirty, Edison had a lab in Menlo Park, a small town in New Jersey.
    Many of his inventions were well known.

    Edison made a sea of money from his inventions, and people called him “the Wizard
    of Menlo Park” at that time. In his life, he got over one thousand patents. Was
    Edison smart? Well, maybe, but he didn’t think so. He worked very hard, and his
    inventions were not magic. "Genius," he said, "is one percent inspiration and
    ninety-nine percent perspiration."

     invention 發明  experiment 實驗  geese 鵝  science and technology 科學與科技  patent 專利'
