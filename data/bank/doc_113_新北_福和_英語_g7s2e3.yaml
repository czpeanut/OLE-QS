  group_stem: "C. (51~54)\n      Long time ago, in a small village in Japan, lived\
    \ an old man and his wife. They didn’t have any children, but they had a dog.\
    \ They were kind to everyone, and people liked them. One day, their dog dug out\
    \ a box with many gold coins. The old man and his wife were happy, and their friends\
    \ were happy for them, too. Then, one of the friends borrowed the old man’s dog;\
    \ he also wanted the gold coins.\n      However, the dog dug out a lot of trash\
    \ in the friend’s house. The friend was angry. Twenty minutes later, he did something\
    \ bad to the dog. The dog lost its life. Then he told the old man, “Your dog fell\
    \ down, and it went to another world.” The old man and his wife were very sad.\
    \ They took their dog home, buried it, and planted a tree on it.\n      Little\
    \ by little, the tree was tall. One night, in the old man’s dream, the dog told\
    \ him to chop down the tree and make a mortar from it. The old man and his wife\
    \ did, and then put their rice into the mortar. How nice! The rice turned into\
    \ gold coins! Again, because the friend wanted the gold coins, he took it home.\
    \ But his rice turned into trash again. Then he burned the mortar to ashes.\n\
    \      The dog came to the old man’s dream for the second time. It said, “Please\
    \ sprinkle the ashes on the tree near your house.” When the old man did, the flowers\
    \ were blossoming around. An officer walked by and saw the beautiful flowers.\
    \ He liked the flowers very much, so he gave the old man many gifts. The old man’s\
    \ friend did the same thing as the old man did, but the ashes didn’t turn into\
    \ flowers. Some of them flew to the sky, and some flew to the officer’s head!\
    \ The officer was angry, so he let the friend get out of the village.\n dig out\
    \ 挖出  gold coin 金幣  chop down 砍下  ash 灰燼  blossom 開花"
