- id: doc_113_台中_向上_英語_g8s2e2_s4_3
  section: 4
  number: 3
  type: single
  page: 2
  stem: What makes summer a better time for cockroaches?
  options:
  - label: A
    content: There is more food during this season.
  - label: B
    content: People are nicer and invite them into the house.
  - label: C
    content: Warmer temperatures help them live and move around.
  - label: D
    content: The dark and wet places give them better living environments.
  group_stem: '(No. 3 ~ No. 5)

    Summer is coming! When you turn on the kitchen light at night, do you sometimes
    see a scary brown thing run away fast? And it becomes much scarier when it flies!
    That’s right—it’s a cockroach!

    When summer comes, the weather becomes hot and humid. This kind of environment
    is perfect for cockroaches. They are cold-blooded insects, which means they move
    faster and grow more quickly in warm temperatures. During this season, they come
    out more often to search for food and water. Cockroaches love dark and wet places
    like kitchens or bathrooms. Because people often leave windows and doors open
    during summer and leave food on the table, it becomes even easier for cockroaches
    to enter your house.

    There are several ways to prevent cockroaches from becoming part of your family.
    First, keep your home clean by washing dishes right away, wiping tables, and mopping
    the floor. Do not leave food out at night; always store it in the refrigerator
    or containers. Also, take out the trash every day and check the leaking pipes,
    as cockroaches love the “smell” from leftovers and enjoy places with some water.
    Cockroaches don’t have noses, but they still have another way to smell. What else
    can you do? Block small cracks or holes in walls and around doors and windows
    because these are all doors for cockroaches to get into your house. Finally, if
    you already see cockroaches, try not to use pesticide right away. It could be
    useful but bad for your health. Here are some better and more natural ways — spraying
    soap water on them and mint oil in your house.

    By following these simple steps, you can enjoy a cockroach-free summer!

     humid 潮濕的/ prevent 防止/ container 容器/ leaking pipe 漏水水管/crack 縫隙/ pesticide 殺蟲劑/
    spray 噴灑/mint 薄荷'
