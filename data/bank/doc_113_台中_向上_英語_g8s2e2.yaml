- id: doc_113_台中_向上_英語_g8s2e2_s4_9
  section: 4
  number: 9
  type: single
  page: 2
  stem: Where do most coffee drinkers get their coffee?
  options:
  - label: A
    content: home
  - label: B
    content: coffee shop
  - label: C
    content: restaurant
  - label: D
    content: convenience store
  group_stem: '(No. 9 ~ No. 11)

    Drinking coffee is not just a trend or something noble anymore; it is becoming
    a part of our lives. According to a study, coffee has become the most popular
    drink in workplaces. Around 65% of workers in the study chose coffee as their
    favorite drink, followed by green tea at 25%, and the rest 10% picked juice, water,
    or other drinks.

    During the workday, most coffee drinkers get their coffee from convenience stores,
    but more and more people now have their own coffee makers. What’s more, the study
    says that some people love coffee so much that they even become baristas — people
    who are excellent at making coffee. They study different coffee beans and learn
    how to make good coffee by using professional coffee machines.

    If coffee is too bitter for you, try adding some milk or chocolate to it. This
    will turn your coffee into other tasty flavors. It’s not hard to tell that many
    of us are now coffeeholics — no coffee, no life! Some people even drink two or
    more cups a day. At the end of the study, it reminds us that drinking one or two
    cups of coffee a day is good for our health — but remember, don''t drink too much!

    trend 流行/ noble 高貴的/ rest 剩下的/ coffee maker 咖啡機/ remind 提醒'
