  group_stem: "1. 愈早遇到愈好！這個挫折讓你成為更好的人（節錄）\n 走在探索夢想的道路上，你的夢想未必符合社會對於一個「成功的人」的定義。\n\
    \ 當你想要改變，有人會搖搖頭的笑你傻，勸你過安逸的生活就好了，你有點迷惘，同時也聽見心裡的聲音正在說：「但現在真的是我想做的事情。」\n 我們都曾經站在現實以及理想之間取捨的十字路口，不確定應該勇敢的做自己，還是做個別人家眼中的成功的人，中間拉扯的過程總是疼痛並且挫敗。最後我們才發現，終其一生，我們想要的不該是一個別人眼中「完美」的人生，而是過自己認為「值得」的日子。更何況，其實找到夢想已經是一件無比快樂的事情了。\n\
