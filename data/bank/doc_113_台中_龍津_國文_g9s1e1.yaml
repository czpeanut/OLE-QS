  group_stem: "3. 晉中朝時有王質者，常入山伐木，至石室，見童子四人彈琴而歌。質因留，趺（1）斧柯（2）聽之。童子以一物與質，狀如棗核，質取而含之，便不復饑，遂復稍留。\n\
