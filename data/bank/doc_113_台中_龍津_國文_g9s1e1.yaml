- id: doc_113_台中_龍津_國文_g9s1e1_s3_37
  section: 3
  number: 37
  type: single
  page: 4
  stem: 根據本文，關於作者童年生活的說明，下列敘述何者正確？
  options:
  - label: A
    content: 因母親工作忙碌，作者只能獨自在家看電視、打電動
  - label: B
    content: 母親在市場擺攤做生意的時候，作者便坐在一旁看書
  - label: C
    content: 作者喜歡大聲誦讀國語課本，神遊於文字世界之中
  - label: D
    content: 作者兄弟三人皆熱愛閱讀，經常互相分享書籍
  group_stem: "2. 自從識字以來，閱讀一再改變我的人生。我的家族成員學歷、社經地位都不高，用努力換取一家的溫飽。除了溫飽之外，他們期待下一代能夠謙卑地面對知識，努力讀書。\n\
    \ 我七歲那年，父親因工作意外過世。母親原來在包工廠當女工，為了增加收入，開始在市場裡擺攤做生意。有好長一段時間，她必須騎著機車跨越幾個鄉鎮去工作，夜色深濃以後才能回到家。那時沒有安親班、才藝班，小學低年級的我，午後總總是自動做完功課，想辦法打發漫長的午後時光。母親聽了圖書推銷員的建議，為我們三兄弟買了許多套書，訂了報刊雜誌。我也總是在校內書展買書，用盡所有零用錢。我深深著迷於文字世界，一頁又一頁地展開自己的知識探險。\n\
    \ 高雄老家的庭院裡，童年的我看過早知憑什麼是孤獨。因為孤獨，所以渴切地尋求意義的陪伴。文字符號構架了意義世界，然而在鄉間，圖書取得不易，所以每學期第一週，我就把國語課本全部翻讀完畢，甚至讀到爛熟，我還喜歡大聲地指認，每一個音節與另一個音節的組合，在天光雲影變換的南方天空下，放任自己神遊。\n\
    \ 小學三年級，我擁有一套經過改寫的兒童版古典小說：《西遊記》、《三國演義》、《水滸傳》、《紅樓夢》。這四本書，字體極小，附有注音。對當時的我來說，難度太高而無法完全理解。那些當時不懂的一切，讓我學習怎麼面對未知。我並沒有因為一時不懂而放棄閱讀，而是一再地告訴自己，有一天一定會懂得。\n\
    \ 小學畢業後，我與同村的許多小朋友一樣，展開跨越區就讀的國中生涯。那段日子，我彷彿進入一個更遼闊的世界。那時還沒近視，臉上長滿青春痘。身體與心靈急遽的變化，讓我總處於不知如何是好的孤獨狀態裡。唯一快樂的時候，便是潛入鳳山客運總站的地下樓—鳳山大書城，在文字世界裡獲得慰藉。《海水正藍》、《緣起不滅》就是從那個時期開始，改變我的人生。\n\
    \ 那個年代，文學鼎盛。兩大報文學獎的頒獎盛況，是會占據報紙大幅版面並且登上電視新聞的。我在書城裡恣意練功，翻遍了古典詩詞、金庸、琦君、司馬中原、三毛……，也接觸到了剛剛崛起的吳淡如、林黛嫚、郭強生……。\n\
    \ 閱讀確實是寫作最好的養分。「讀書破萬卷，下筆如有神。」讀多了、讀熟了，寫作時才能毫無畏懼，適切地抒發情感與思想。當時的導師規定我們寫日記，每天交給她批閱。日記的書寫，提醒了我怎麼關注生活，也讓我累積了寫作的材料。沒有新鮮事可寫的時候，我就寫下在書店裡遇見的書，書中的意義世界。\n\
    \ 國三升學壓力最大的時候，每天留校自習到晚上十點。我趁著念完書的空檔，閱讀我喜愛的書籍，背誦我喜愛的詩句，書寫我真正有感覺的事物。似乎只要能夠這樣，生活的煩憂再也不構成煩憂了。我寫，寫在信紙上，寫在筆記簿裡，寫在同學或我自己的課本中……。國文課堂上，張百蓮老師講究基本功底，從記憶理解出發，再進到詮釋與創造的領域。先識字、記誦，擴充詞彙、句型，才能有運用與創生。學習語文，靠的就是精熟。腦袋空空的，想要把文章寫好，那怎麼可能？\n\
    \ 細讀課文令我浮想聯翩，遂寫了一篇〈星空下的冥想〉，用這種方式理解他人，也充當自我寬慰。那篇文章，後來收錄在校刊《鳳西少年》裡，成為我第一篇自以為是的散文創作。（改寫自凌性傑\
    \ 迎向未知的時光）"
