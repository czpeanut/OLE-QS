  stem: 參考文章判斷圖十三哪一條線為梭莫基效應的血糖變化？理由是？
  options:
  - label: A
    content: 甲，因為5~7am 時血糖變化和緩上升
  - label: B
    content: 甲，因為11pm~1am 時血糖略降
  - label: C
