- id: doc_113_新北_福和_自然_g7s1e3_s2_41
  section: 2
  number: 41
  type: single
  page: 4
  stem: 根據本文，以下何者為錯誤敘述？
  options:
  - label: A
    content: 昆蟲的血液循環系統和呼吸系統是相互連結的構造
  - label: B
    content: 外界氣體進入順序：氣門→氣管→小氣管→微氣管→體細胞
  - label: C
    content: 氣體透過位於外骨骼上的氣門來進出昆蟲的身體
  - label: D
    content: 昆蟲的氣門透過肌肉收縮控制開關。
  group_stem: '（一）昆蟲是用什麼器官呼吸？等等，竟然是「全身」？

    到底昆蟲是用什麼器官在呼吸的？是肺嗎？還是鼻子？告訴你，昆蟲其實沒有肺以及鼻子喔！牠們是透過所謂的「氣管系統」來進行全身的呼吸及氣體交換。昆蟲的呼吸系統由氣管、小氣管、氣門還有氣囊所組成。所有的空氣都是透過位於外骨骼上的氣門來進出昆蟲的身體，通常都會出現在昆蟲的腹部或側面喔！空氣從氣門進去後，透過氣管不斷分支，最後傳到微氣管，其分支末梢就散佈在體細胞間，這些氣體進到微氣管的分支後，微氣管潮濕的表面就能讓氧氣更好的進行擴散作用。氧氣擴散進一旁的體細胞膜後，就能被細胞所使用，而二氧化碳也是如此從體細胞排出的。和人類不同的是，昆蟲的血液循環系統和呼吸系統是不互相影響的。人類透過心臟將經過肺的充氧血打到全身，來使全身細胞獲得氧氣；昆蟲則是全身的細胞都直接與小氣管相連，因此昆蟲沒有進行氣體交換的肺部。不過這種呼吸方式，其實對於長距離的氣體運輸效率較低，所以這也是大部分昆蟲體積不大的原因之一。

    不過你可能會想，所以昆蟲都一直是靠著被動的氣體運輸來維持呼吸的嗎？難道所有的昆蟲都只會呆呆的等空氣自己送進身體裡來嗎？其實也不是這麼回事喔。許多昆蟲的氣門都能透過收縮肌肉關閉，也能透過舒張肌肉使氣門放鬆打開。而氣門的開閉，通常透過中樞神經系統來控制，不過也能被氣門四周細胞中的化學成分所調控。同時，氣門的開關也能調節水分的散失。不過你可能沒想到，氣門還能拿來吹口哨呢！有些蛾類的幼蟲就能透過開關特定的氣門，再收縮排氣，讓自己的身體像笛子一樣吹出聲音來呢，被推測可能牠遭受獵食時威嚇天敵的手段。

    雖說是這樣，但氣門同時也成為了某些昆蟲的一大罩門！相信很多人都有聽過，肥皂水能夠將許多人恨得牙癢癢的蟑螂輕鬆消滅。這是因為肥皂或清潔劑都屬於界面活性劑，能溶解蟑螂身上的蠟質與油脂，溶解的蠟質和油脂會把氣門堵住，造成蟑螂因無法呼吸窒息而死囉！由此可見，氣門真的對昆蟲來說十分重要呢！（節錄自泛科學《昆蟲是用什麼器官呼吸？等等，竟然是「全身」？》）'
