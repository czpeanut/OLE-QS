  group_stem: '（二）青少年新興成癮風暴，依托咪酯，吸食者的喪屍之路

    電子菸作為一種替代傳統香菸的產品，已在全球範圍內流行。電子菸主要通過加熱液態尼古丁溶液產生蒸氣，供使用者吸入。目前在臺灣，電子菸並非合法產品。如果查獲電子菸內的菸油含有毒品成分，將涉嫌違反《毒品危害防制條例》。儘管如此，近年來仍出現了非法改造電子菸設備以吸入各種藥物的趨勢，其中包括依托咪酯。這些被稱為「麻醉菸彈」、「睡眠煙彈」的設備正在青少年圈氾濫，毒販利用電子菸技術加熱依托咪酯液體生成蒸氣，供使用者吸入，使其上癮並從中牟利。

    依托咪酯是一種超短效靜脈麻醉藥物，常用於手術麻醉，需要專業醫師控制劑量，達到鎮靜麻醉效果。依托咪酯原本是管制用藥，是一種作用於中樞神經的鎮定劑，根據醫師表示，臨床醫師為病人插管時，會以靜脈注射方式，使用該藥物讓病人短暫昏睡，以完成插管，依托咪酯藥效來得快，恢復時間也短，屬於短效麻醉劑；該藥物的效果是抑制中樞神經，不同於安非他命是中樞神經興奮劑，依托咪酯的效果是屬於麻醉、意識不清。依托咪酯濫用後會具有致幻、麻醉、肌肉痙攣、運動不協調、抽搐等副作用，使吸食者變成如同喪屍般，因此又稱「喪屍毒品」。依托咪酯濫用會導致嚴重的健康問題，包括：呼吸抑制：高劑量使用可能導致呼吸停止，危及生命。心血管問題：可能引起心律不整和血壓波動。神經系統損害：長期濫用可能導致記憶力減退和情緒不穩定。此外，依托咪酯具腎上腺毒性，會抑制腎上腺素合成。長期濫用可能對腦部及內分泌系統造成損害。

    臺灣禁用電子菸，但若被查獲，僅面臨行政裁罰，最高罰款1 萬元。然而，若電子菸中摻雜大麻，將涉及刑事毒品罪，最高可判3 年徒刑。臺灣在今年6 月13 日將其列為第三級毒品，8
    月5 日正式納入管制。然而，由於依托咪酯在毒品犯罪中的濫用程度日益上升，法務部於11 月14 日再度將其提升為第二級毒品，顯示政府對毒品問題的重視與管制強化。（節錄自戒毒中心《青少年新興成癮風暴，依托咪酯，吸食者的喪屍之路》）'
