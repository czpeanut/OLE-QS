- id: doc_113_新北_福和_自然_g7s1e3_s2_46
  section: 2
  number: 46
  type: single
  page: 5
  stem: 參考文章所述，下列何者正確？
  options:
  - label: A
    content: 文章中測得白條天蛾肌肉的溫度高過健康人類的體溫
  - label: B
    content: 白條天蛾活動肌肉所產生的熱正好完全符合牠的自身需求
  - label: C
    content: 白條天蛾不斷刻意收縮肌肉，以便讓肌肉發熱
  - label: D
    content: 所有昆蟲適應炎熱的方式就只是降低熱量產生的速率。
  group_stem: '（三）熱血的昆蟲！

    在1969 年中的一項研究發現，在寒冷的夜晚，一隻白條天蛾的肌肉測出44℃的高溫。由於肌肉收縮時會發熱，因此必需調節體溫以利肌肉運作。生物的體溫調節與體型有關，體型大的生物比體型小者散熱的速率慢。再者，生物本身的體溫和環境溫度的差異越大時，則散熱越快。白條天蛾的體型相對較大，且在熱帶氣候區的夏季最為活躍。因此，牠們需要排除多餘熱量的方法來穩定（調節）體溫，而非降低熱量產生（熱量輸出）。

    有些生活在沙漠裡的蟬會從身體上的腺體排出液體，讓牠們在進行鳴唱這種高度肌肉收縮活動時散熱。蜜蜂做法有些不同，牠們會反芻花蜜，像狗吐舌頭一樣，讓花蜜在舌頭上蒸發，或是用前足把花蜜塗在過熱的胸部。但白條天蛾採取不同的方法，牠們是將飛行肌工作時產生多餘的熱量轉移到類似汽車散熱器的腹部。

    大多數在「夜間飛行的夜蛾」，習慣在早冬及春天活動，牠們因為體型小得多，加上牠們飛行時，空氣的溫度有時會降至冰點，因此這些蛾類需要維持熱量在胸部的飛行肌，其方法包括牠們的胸部有多毛的隔熱層，還有兩個逆流熱交換器，一個降低了流失到頭部的熱量，另一個幾乎防止了熱量流失到腹部，因此熱量都保留在胸部，以維持飛行肌的運作。

    昆蟲屬於外溫動物且體溫隨環境溫度而變，是正常現象，對於大多數的熱血昆蟲也是如此，所以昆蟲讓人驚奇的地方，是在某些特殊時候能做的事。（節錄自《荒野之心》伯恩德˙海恩利許著）'
