  - label: D
    content: 乙，因為3~4am 時血糖驟降。
  group_stem: '（四）影響糖尿病患者用藥的兩項重要效應

    黎明效應

    糖尿病患者因為無法分泌足夠的胰島素，容易在接近黎明時間（約凌晨3-4

    點），因體內相關激素分泌不平衡，而有血糖逐漸升高的現象。

    造成黎明效應的原因：包括激素影響及飲食過量等。

    梭莫基效應 (Somogyi)

    糖尿病患者睡前胰島素劑量打過多、或長時間激烈運動，易在凌晨3-4 點間發生低血糖，當出現上述的情況時，身體有一種

    「反向調節激素」使生長激素等賀爾蒙分泌增加，引發葡萄糖新生，產生反彈性高血糖。'
