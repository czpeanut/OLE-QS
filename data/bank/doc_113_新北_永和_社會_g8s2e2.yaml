    | 西亞 | 瀕紅海、黑海等 | 大多為盆地 | 冬季降水較多 | 多數為伊斯蘭教 |

    | 北非 | 撒哈拉沙漠以北 | 高原為主體 | 全年乾燥少雨 | 多數為基督教 |'
