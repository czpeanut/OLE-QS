  type: single
  page: 1
  stem: 亞特拉斯山脈是北非最高的山，位於非洲西北部，由於山區地勢高聳當地冬天會降雪布滿整個山頭，該山脈橫跨摩洛哥、阿爾及利亞、突尼西亞三國，全長超過2000
