    無以意傲物，以遠辱於人；無以色求事，以自重其身。\n遊與邪分歧，居與正為鄰；於中有取捨，此外無疏親。\n修外以及內，靜養和與真；養內不遺外，動率義與仁。\n\
    千里始足下，高山起微塵；吾道亦如此，行之貴日新。\n不敢規他人，聊自書諸紳；終身且自勗，身沒貽後昆。\n後昆苟反是，非我之子孫。\n注：①動「率」：遵循。\n\
    \    ②「規」他人：勸勉。\n    ③自「勗」：音ㄒㄩˋ，勉勵。\n    ④「貽」後昆：音ㄧˊ，遺留。\n    ⑤後昆：後付子孫。"
