- id: doc_113_台中_居仁_國文_g8s2e2_s6_8
  section: 6
  number: 8
  type: single
  page: 4
  stem: 請問標題中( )處應填入什麼最為適宜？
  options:
  - label: A
    content: 臺灣學生科學、數學成績優良，興趣、自信卻低落
  - label: B
    content: 臺灣學生科學、數學成績優良，有興趣、缺乏自信
  - label: C
    content: 臺灣學生對科學有興趣、對數學卻自信心不足
  - label: D
    content: 臺灣學生科對數學心有餘力不足，科學則反之
  group_stem: "2023 TIMSS 調查出爐：(            )\n    教育部今天和全球同步公布2023年國際數學與科學教育成就趨勢調查（TIMSS），臺灣8年級學生的數學和科學都名列全球第二，4年級學生則分別排行第二和第三。但學生沒自信沒興趣的比例，卻仍高於國際平均。\n\
    \    TIMSS 2023 今天公布調查結果，臺灣四年級、八年級學生，在數學、科學成績表現名列全球前三，但不喜歡、沒自信學數學和科學的比例，卻明顯高於國際平均。八年級學生認為數學或科學沒價值的比例，也高於國際平均。而在這次評比，新加坡再次拿下四項冠軍，而且學生也表現高度學習興趣與自信心，與國際平均相仿。\n\
    \    臺灣學生的數理表現優異。教育部公佈 2023 年國際數學與科學教育成就趨勢調查（TIMSS），臺灣 8 年級學生的數學和科學都名列全球第二，4 年級的數學和科學，則分別排行第二和第三，其中八年級數學、科學排名持平，四年級的數學、科學排名雙雙進步。新加坡在四項的表現都名列第一，臺灣、韓國均分屬各項排行前五名。TIMSS\
    \ 是由 IEA（教育成就評鑑國際學會）、每 4 年施測一次。臺灣從 1999 年起參加，至今參與第 7 次。本次受測學生均為 108 課綱學生，且在受測期間曾經歷新冠肺炎疫情。\n\
    \    TIMSS 除了透過電腦施策成就測驗，也同時向學生、老師發放紙本問卷，深入了解學生的學習興趣和態度。根據問卷結果，臺灣學生持續在此次測試成績中創下歷屆最佳的成績，但卻普遍「不喜歡」學數學、科學，也「沒自信」學數學、科學，甚至認為學習「沒價值」，年齡愈大愈不喜歡，比例均遠高於國際平均。但從國際平均來看，各國學生對數學、科學「不喜歡」與「沒自信」的比例均較往年提升。\n\
    \n    臺灣學生擁有學習高成就，卻出現不喜歡與沒自信的學習態度。臺師大科教中心副研究員李哲迪分析，這與「文化」息息相關。他說，曾有研究指出，儒家文化強調學習是學生的責任，在責任心驅使之下，學生擁有高成就表現；但值得一提的是，新加坡不僅學習成就好，學生也喜歡學習，且對學習有自信，與國際平均相仿，這部分值得進一步了解。\n\
    \    而從數據來看，四年級學生普遍喜歡學習科學，但到了八年級，學習興趣與學習自信卻大幅陷落。李哲迪參考各國情形推測，主因可能是課程難度上升，也影響學習興趣、自信，出現「學習疏離」情形。另外，也與教師教學方法有關，尤其臺灣有國中教育會考，也許學生在小學接受了大量的探究課程，但到了國中，受限會考而影響老師的教學方式，從探究引導轉為知識運用，也會影響學生對學習的評價。\n\
    趕進度、拼熟練 教學現場有苦難言\n    「兩週能做一次實驗就不錯了！」臺北市古亭國中校長莊豐兆接受《親子天下》訪談時坦言，在有進度壓力的情況下，老師光課本、習作要上得仔細，就得花掉大半時間。以數學科為例，108\
    \ 課綱也將數學時數調降，教育部近年也嚴抓輔導課採正常教學，導致老師把該上的課完成後，幾乎沒有餘裕去思考「推陳出新」的事。\n    莊豐兆也說，目前最大的問題在於，不是教完課本、習作，學生就能把會考考好。主因是會考強調素養導向，但素養導向需要理解、閱讀能力，學生在有時間壓力的考試中，也不可能慢慢解題，導致老師必須要把學生訓練到「精熟」，讓學生看到題目就能馬上作答。"
