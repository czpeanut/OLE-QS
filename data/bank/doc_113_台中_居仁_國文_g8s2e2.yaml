  group_stem: "沿著縱谷繼續往前，接下來的路途不斷地往上攀升，累積幾日來的操勞，讓你的手肘膝蓋開始發麻酸疼。你剛順利通行過一處解放軍哨，一臺吉普車逆向迎來，你先側身讓路，再跨上車時，竟有人搖下車窗擺手攔你：「等等──，等等──。」你覺得（＿＿＿＿＿），但還是忍不住好奇停下來了。\n\
    \    一個陌生的面孔走向你，問：「還記得我嗎？」你並不真的認得這個人，卻接下他伸來的手掌。後來經他的提醒，你才憶起他原來是你在臺灣組裝自行車時，那家店老闆的朋友。初識他那天，他說他也正準備去西藏，自行車店的老闆就不斷鼓吹他與你同行，他卻以各種危險的理由善意回絕了。一個多月後，想不到你們會在這遙遠的異國峽谷裡再度相逢，他的出現多少襯托你現在的孤獨與落魄。你們不免俗地寒喧，拍照，留下彼此的聯絡方式，一旁的解放軍哨兵眼神卻詭譎眈眈，你便不敢再多作停留。臨走前，他送你一對保暖手套，爲你們短暫的相遇畫上句點。\n\
    \    晚間，發電機吃力地發出隆隆的悶氣聲響，吊掛在屋內的燈泡總是忽滅忽亮，山谷裡的落山大風又無情的呼呼吹吼，夾肆著驟起的大雨，襲擊在那甘蔗薄板所搭起的房間，屋頂始終不安地搖晃著，且門縫間還不斷滲進令人哆嗦的寒風。這個夜晚莫名的漫長，你躺在床上默默祈禱許久，才終於失去知覺睡去。\n\
    \                    節錄自謝旺霖 «轉山-邊境流浪者»"
