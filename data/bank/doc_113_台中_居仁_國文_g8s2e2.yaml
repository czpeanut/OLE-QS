  section: 5
  number: 3
  type: single
  page: 3
  stem: 關於甲文的解說，下列何者正確？
  options:
  - label: A
    content: 北冥之海的鯤魚，數量多達綿延千里
  - label: B
    content: 鯤魚變化成鵬鳥，翅膀如雲霞般華美
  - label: C
    content: 水夠深才能孕育鯤，風夠強才能協助鵬
  - label: D
    content: 大鵬鳥預計從南冥天池，飛返北冥之海
  group_stem: '【甲】《莊子‧逍遙遊》


    北冥有魚，其名為鯤。鯤之大，不知其幾千里也。化而為鳥，其名為鵬。鵬之背，不知其幾千里也；怒而飛，其翼若垂天之雲。是鳥也，海運則將徙於南冥。南冥者，天池也。……且夫水之積也不厚，則負大舟也無力。覆杯水於坳堂①之上，則芥為之舟；置杯焉則膠，水淺而舟大也。風之積也不厚，則其
    負大翼也無力。故九萬里，則風斯在下矣，而後乃今培風②；背負青天而莫之夭閼③者，而後乃今將圖南。

    ※注釋：①坳堂：堂上漥處。②培風：乘風。③夭閼(ㄜˋ)：遮攔、障礙之義。


    【乙】改寫自陳鼓應《莊子哲學》


    莊子託物寓意，以鯤、鵬暗示他心中的理想人物──「至人」，欲達到這樣的境界，首先要藏匿行跡、自我磨礪。鯤潛伏在海底，猶如讀書人沉伏桌案，埋頭探究以充實自己，俟內在條件充實完備後，出而應世，如鵬之高舉。這種理想人物一出現，其功便足以澤及百姓，如鵬之翼覆群生。


    「北冥」、「海運」、「積厚」，意指人才的培育是需要優越的環境與自我準備。所謂「鯤之大，不知幾千里也」，準此而推，則北海之大，必然是廣漠無涯、不可計量。大鯤非北海之廣不足以蓄養，比喻人才需優厚的環境培養，畢竟「      」，也正是「水之積也不厚，則負大舟也無力」，載負大舟，必須水積深厚，這說明了環境對人才的重要性。'
