  stem: 小華、小文、小薇、小宇四人討論啟蒙時代的思想，哪一個人的說法最接近盧梭的理論？
  options:
  - label: A
    content: 小華：「質疑教會的權威，抨擊教會的腐敗與迷信，主張信仰與言論自由。」
  - label: B
    content: 小文：「政府的行政權、立法權和司法權應該分立，發揮彼此制衡的功能，以避免專制獨裁的發生。」
  - label: C
    content: 小薇：「生命、自由、財產是人類不可被剝奪的權利，如果政府非法破壞人民權利，人民可以起而反抗。」
  - label: D
    content: 小宇：「政府的權力來自人民的委託，人民是國家的主體，政府必須替人民謀福利。」
