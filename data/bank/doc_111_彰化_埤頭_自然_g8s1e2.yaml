  section: 1
  number: 1
  type: single
  page: 1
  stem: 有關聲音與光的敘述，下列何者正確？
  options:
  - label: A
    content: 光與聲音在不同的介質中，傳播速率不變
  - label: B
    content: 光的傳播速率比聲音慢
  - label: C
    content: 光可以在真空傳播，聲音則不能在真空傳播
  - label: D
    content: 聲音遇到障礙物會發生反射，光遇到障礙物則不會發生反射。
