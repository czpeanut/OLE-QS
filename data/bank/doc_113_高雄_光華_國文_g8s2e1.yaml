- id: doc_113_高雄_光華_國文_g8s2e1_s2_7
  section: 2
  number: 7
  type: single
  page: 4
  stem: 文中提及只有少部分的人能實踐跨領域學習，其理由不包含何者？
  options:
  - label: A
    content: 一般人仍受限於「須有一技之長」的主流傳統觀念
  - label: B
    content: 一般人對自己的職涯發展容易感到滿足而欠缺野心
  - label: C
    content: 資訊雖趨於普及化，但一般人仍難以取得其他領域的知識
  - label: D
    content: 成為一名專才就足以維持生計，甚至可成為中產階級。
  group_stem: "（三）\n  這是最好的時代，也是最壞的時代\n  當資訊變得極其容易獲得時，所帶來的另一個變化，就是人們可以學習更多樣的知識，讓思想變得更多樣。我們可以透過大量的線上開放式課程、書籍和文章，去學習其他領域的知識，大幅度地開拓我們的知識邊疆，而且其成本是絕大多數人都能負擔的。\n\
    \  按理想的情況來說，應該會有許多人善用這些方便的資源去提升自己，學習專業與專業之外的領域，以拓展自己的知識面。但在現實中，只有很小的一部分人「足夠勤勞」，能實踐跨領域學習。\n\
    \  這是因為人們還停留在傳統的觀念—出來社會就必須培養一技之長，也只需要培養一技之長。要獲得美好的生活，就應該投身於一個領域，然後一輩子專注地做好這個領域的工作。\n\
    \  而事實也的確如此，你並不需要成為一個「通才」才能填飽肚子，你只需成為一個「專才」就已經足夠了。另外，專注於成為一個專才容易得多，而要成為通才不但困難，還給人一種學而不精的感覺。\n\
    \  目前來說，要能夠生存並過上中產階級的生活，成為專才足矣。但如果你有力爭上游的野心，也不是個只滿足於現狀的人，那麼你可能會考慮嘗試成為通才。\n  有研究發現，擁有多樣知識的通才，其平均薪資比專才更高；在某些需要複雜技能的領域，通才的收入甚至可以比專才高出44％。另外，通才式的CEO（公司的執行長），無論是受歡迎程度還是收入，都高於一般的CEO。\n\
    \  為什麼通才會比專才更值錢呢？答案就在於「知識的多樣性」。\n  通才往往更擅於解決問題，這不是因為通才的智商比較高，而是因為通才往往能夠用不同的角度和眼光來思考問題，為領域帶來新的見解。\n\
    \  換句話說，通才的「工具箱」裡總會有多種不同功能的工具，能搭配運用來解決各類問題；而專才的「工具箱」裡通常只有一個種類的工具，所以解決問題的能力自然有限。\n\
    \  創新工場董事長李開復曾對未來的職業發展評論道：「純技術，不如懂技術和用戶；懂用戶，不如懂技術、用戶和產品的人。這種綜合的能力是非常非常強大的，無論你是想去什麼地方，這是很重要的。」\n\
    \  而既然成為通才是有回報的，那麼我們可以預期會有愈來愈多的人願意跨領域學習，也會有愈來愈多人意識到跨領域學習的重要性，正如上一代的人意識到上大學的重要性。\n\
    \  再加上身處於資訊時代，科技會讓跨領域學習的成本再進一步下降，將會有更多的人得以實踐跨領域學習，也將會有更豐富的知識供你學習、提升知識的多樣性。\n \
    \ 慢慢地，職場上的升遷條件將會提高，以前和現在你都只需要有單一領域的文憑，展現出你在該領域的專業知識，就足以獲得升遷的資格。但你會慢慢發現：競爭的標準升級了。除了需要展現出專業知識之外，你還要跨領域學習，以提供一些你的同行、同事所無法提供的價值。這樣你才比較有望獲得升遷，以及獲得同行未能具備的競爭力。\n\
    \                                              （節錄自楊大輝深度學習的技術：２週掌握高效學習，立即應用）"
