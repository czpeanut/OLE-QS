  section: 1
  number: 15
  type: single
  page: 2
  stem: 木蘭詩中的「雄兔腳撲朔，雌免眼迷離」兩句，後來化為成語「撲朔迷離」。以下請根據選項中的句子，推測其轉化後的詞語，何者不恰當？
  options:
  - label: A
    content: 瓜田不納履，李下不整冠→瓜田李下
  - label: B
    content: 元方難為兄，季方難為弟→難兄難弟
  - label: C
    content: 春風得意馬蹄疾，一日看遍長安花→走馬看花
  - label: D
    content: 天上浮雲似白衣，斯須改變如蒼狗→浮雲蔽日。
