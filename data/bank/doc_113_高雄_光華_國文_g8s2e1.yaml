  type: single
  page: 1
  stem: 中文的同音、近音字非常多，所以有許多電視廣告會藉由諧音雙關的使用，來加深觀眾對品牌及產品的印象，像「紙有春風最溫柔」（衛生紙廣告）的標語即屬此類。下列選項「
    」中的字詞，何者也使用諧音雙關修辭？
