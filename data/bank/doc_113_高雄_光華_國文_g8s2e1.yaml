  number: 4
  type: single
  page: 1
  stem: (甲)四月清和雨乍晴，南山當戶轉分明。更無柳絮因風起，惟有葵花向日傾。 (乙)朔風剪塞草，寒露日夜結。行行到瀛壖，歸思生暮節。 (丙)千里鶯啼綠映紅，水村山郭酒旗風。南朝四百八十寺，多少樓台煙雨中。
    (丁)遠上寒山石徑斜，白雲深處有人家。停車坐愛楓林晚，霜葉紅於二月花。。上述詩詞所吟詠的季節景象，正確的順序是哪一選項？
