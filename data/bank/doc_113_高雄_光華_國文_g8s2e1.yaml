  stem: 以下對於木蘭詩之形式分析，何者是正確的?
  options:
  - label: A
    content: 本詩為典型的北朝民歌，由「駿馬」、「軍帖」、「鐵衣」、「花黃」等詞語可證明
  - label: B
    content: 本詩是一首經過文人潤色的民歌，故有許多對偶的句子，如:「朔氣傳金柝，寒光照鐵衣」及「歸來見天子，天子坐明堂」皆是
  - label: C
    content: 此詩敘事繁簡得宜，為凸顯木蘭奮勇殺敵、功勳卓著的事蹟，故在三、四段採用「繁筆」的手法。
  - label: D
    content: 此詩具有「反覆吟詠，不避雷同」的民歌情調，由「東市買駿馬，西市買鞍韉。南市買轡頭，北市買長鞭」可得印證。
