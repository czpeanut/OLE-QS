- id: doc_113_高雄_光華_國文_g8s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 南北朝因地域與風俗的差異，在情感表達上亦自有不同，大體而言，北朝民歌大多直率豪放，質樸自然；南朝民歌則多清麗纏綿，委婉含蓄。請依此特點判斷，下列民歌何者是北朝民歌？
  options:
  - label: A
    content: 遲日江山麗，春風花草香，泥融飛燕子，沙暖睡鴛鴦
  - label: B
    content: 男兒欲作健，結伴不須多。鷂子經天飛，群雀兩向波
  - label: C
    content: 儂作北辰星，千年無轉移。歡行白日心，朝東暮還西
  - label: D
    content: 宿昔不梳頭，絲發被兩肩。婉轉郎膝上，何處不可憐。
