- id: doc_113_高雄_光華_國文_g8s2e1_s2_10
  section: 2
  number: 10
  type: single
  page: 5
  stem: 達悟族人不食鰻魚的原因是什麼？
  options:
  - label: A
    content: 民族神話影響
  - label: B
    content: 鰻魚沒有鱗片
  - label: C
    content: 鰻魚普遍有毒
  - label: D
    content: 鰻魚外表太過醜陋。
  group_stem: "（四）\n  早年帶學生到蘭嶼上課時，即耳聞達悟族不吃鰻魚，感覺非常訝異，因為日本料理店的鰻魚料理可不便宜，鰻魚便當更是有名，而蘭嶼海域盛產鰻魚，偏偏達悟族人的傳統是不吃鰻魚的。若老人家看到有人吃海鰻或青蛙，會跟對方說：「是鬧飢荒了嗎？」這樣的話是在取笑數落那個人啊！問過當地友人，得到的答案是：「鰻魚那麼醜，幹嘛吃牠」。當然，這是開玩笑的回答，實際的答案是達悟族人不吃沒有魚鱗的生物，像是青蛙、鰻魚之類的。\n\
    \  達悟族人真的超討厭鰻魚，特別是到海邊射魚時常會遇到鰻魚，牠還會偷食獵人的漁獲，所以有的漁夫潛水射魚時看到鰻魚會射殺後丟棄，聽漁夫說有的鰻魚有手臂一樣粗，還是射死後丟棄，聽在我這漢人耳裡，直覺得好可惜。\n\
    \  在得知這訊息後心想，既然達悟族人不吃，那我們來吃。那是我帶學生到蘭嶼上課時的盤算，因為部落資源缺乏，我們一群師生十幾二十人到蘭嶼上課，一住就是半個月，甚至一個月，伙食是個問題。沒想到我的達悟族學生在一個月黑風高的夜晚，從東清騎機車到朗島找我，遞給我一個塑膠袋，裡頭有個用報紙包著的東西，我丈二金剛摸不著頭緒，不知道他葫蘆裡在賣什麼膏藥，要搞得神祕兮兮。\n\
    \  原來，他有次去釣魚時抓到一隻鰻魚，以前的經驗就直接丟棄，後來因為聽說我要吃，所以特別保留，而且用報紙層層包住，冰凍在家中的冷凍櫃，不敢讓家人發現，等我暑假帶學生到蘭嶼上課時，特別帶來送給我的。我難得收到這份厚禮，感動莫名。\n\
    \  為了這隻鰻魚，我折騰許久，雖然口中說達悟族人不吃，我來吃，等實際拿到鰻魚才知道，真正的麻煩才要開始。第二天，問了親朋好友，海鰻怎麼煮？眾人建議用中藥燉煮，其實我對廚藝是全然外行，但知道蘭嶼的農會超市可買到中藥包，沒有問題。接下來的問題是，等我開口說要煮鰻魚時，友人面有難色，我才警覺事有蹊蹺，因為他擺明不願意借我鍋子煮鰻魚。\n\
    \  此時，我才猛然發現，我住宿的朋友家，廚房鍋子的鍋蓋上用簽字筆寫著「男」「女」，我心想，這對恩愛夫妻怎麼會搞到連鍋子都要分，也太扯了。後來才發現，原來蘭嶼傳統文化對魚蟹分類非常嚴謹，我這漢人傻傻連魚有公母都分不清，沒想到達悟族的魚還分男人魚、女人魚、老人魚，也太神奇了，而且連煮魚的鍋子也有分，煮男人魚、煮女人魚的鍋子不同，原來鍋蓋上的男、女，指的是煮食哪種魚類使用，不是夫妻感情不好的財產區分，我真的是想太多了。\n\
    \  重點是，那我的鰻魚呢？要用哪種鍋子煮啊。問了半天，答案揭曉，沒有。沒想到達悟族人看不起鰻魚到這種程度，連煮鰻魚的鍋子都不願意借，我只好為了這條鰻魚，到農會超市買鍋子回來，才擺平煮鰻魚事件。還好，我的友人沒有計較到連瓦斯爐都不願意借，要我自己生火煮鰻魚，真的是感謝主。\n\
    \  後來那條鰻魚怎麼處理，我已經忘了，是真的買鍋子下中藥煮鰻魚湯或折騰半天後放棄了，已不可考。但這鰻魚事件著實讓我對蘭嶼的在地文化，上了寶貴的一課。\n\
    \  早期帶學生到蘭嶼上課，趣事橫生。有一次課餘之暇，友人相邀到尾端岩釣海鰻。那天傍晚，友人幫我準備了釣魚線，因為是要釣鰻魚，所以要做加強版的釣鉤。鰻魚的牙齒很利，一般釣魚線會被鰻魚咬斷，因此在綁魚鉤那端要用鋼絲纏繞，避免被輕易咬斷，功虧一簣。一切準備就緒，拿著釣魚線，走到海溝邊，展開正式的朗島盃釣鰻魚比賽，其實只有兩人。由於我是新手，友人還要一面教我怎麼尋找鰻魚的蹤跡，怎麼釣鰻魚。原來，海裡的鰻魚會利用漲潮時游到礁石區的海溝覓食，所以在有水的海溝漲潮時，常會發現鰻魚的身影。釣鰻魚的時候，用任何有魚腥味的生物當魚餌皆可，小魚的內臟、寄居蟹的屍體、魚肉，都可以，有腥味的鰻魚都吃。\n\
    \  由於鰻魚身長，會躲在海溝的洞穴藏身，只有頭會探出，釣的時候要把魚餌放到鰻魚的眼前，但不要靠洞穴太近，要設法引誘牠出洞，原來「引蛇出洞」對海鰻也適用。如果不這樣做，釣到鰻魚會拉不起來，因為鰻魚的身體會捲住岩石，讓你無法釣上來，最後會脫鉤，白忙一場。\n\
    \  接著，因為鰻魚很滑，牙齒很利，釣到以後不能像一般釣魚一樣直直拉起就好，而是要一面抖動，一面往礁石區移動，避免鰻魚捲成一團，不好處理。然後，鰻魚釣上來以後，還有一招很重要，就是要把鰻魚用力地甩在礁石上，讓牠昏迷，再用準備好的棍棒敲擊鰻魚頭部，將之擊昏，並用腳踩住牠的頭，然後把魚鉤取下，釣鰻魚的工作才算完成。\n\
    \  我雖是新手，但學習能力很強，很快就上手，開始在海溝中尋覓海鰻的身影，看到後來就依樣畫葫蘆地釣牠，一回生，二回熟，慢慢抓到訣竅，發現釣鰻魚很容易又很好玩。在釣鰻魚的過程中，意外發現，鰻魚真的很愛吃。由於我的經驗不足，有隻鰻魚在上鉤後被牠溜進洞穴，我拉不出來，最後脫鉤了，在牠的嘴上留下一道撕裂的傷口，本以為那隻鰻魚有此經驗，不會再來咬食了，沒想到，釣餌一放，牠又過來了。這隻鰻魚第二次上鉤時，我的經驗還是不夠，又讓牠跑了，有點氣餒。\n\
    \  很快地，我換好魚餌，發現牠還在，再試一次，牠的嘴上已經有兩道傷口了，心想應該不會再吃了吧！哪知牠又吃了，我既驚又喜，但操之過急又扯掉了，還是被牠溜走，真的好挫折，暗暗罵自己怎麼那麼笨手笨腳，連隻鰻魚都釣不到。沒想到，嘴上已經有三道撕裂傷的鰻魚還在，等我小心翼翼地把魚餌放入海中，牠又過來吃了。總算皇天不負苦心人，這次讓我釣到。驚喜之餘，一面抖動手中的釣線，說時遲，那時快，以最快的速度將鰻魚甩到礁石上，來回幾次，終於搞定，順利取下魚鉤，得到一分。\n\
    \  說實在，在釣鰻魚的過程中，雖然真的很好玩，但心中有股淡淡的哀傷。一來是於心不忍，看鰻魚嘴巴撕裂的模樣，還要有點殘忍地甩牠，直到昏死過去，感覺有點血腥。但真正讓我難過的是，鰻魚怎麼會這麼沒有反省能力，咬一次嘴巴已經有撕裂傷了，還會一而再、再而三地上鉤，一點反省能力都沒有。此時想到的是，教室上課時學生的反應，即是如此。老師一而再、再而三地叮嚀，上課不要玩手機、不要講話，學生總是依然故我，玩他們的、講他們的，臺上臺下兩樣情。\n\
    \  以前的我，總是會上課上到懷疑人生，直到那回釣了鰻魚，我才恍然大悟，原來，有些人的行為模式真的像鰻魚，想到這裡，心中才釋懷。之後，在校園上課，有時實在受不了，我會脫口而出，講某某學生像鰻魚一樣，學生完全狀況外，不知老師在說什麼，但是我卻能因此得到療癒。原來，釣鰻魚也是深具人生哲理，對生命的成長，是有助益的。\n\
    \  那次釣鰻魚比賽的結果，如果我沒記錯，最後的比數是四比一，我獲勝，那應該是我唯一一次釣魚比賽贏的紀錄，當然，我猜想，達悟族人應該連釣鰻魚也不屑，故意讓我的。\n\
    \  在蘭嶼的徒步行程，因為時間太趕，所以沒有辦法排其他的體驗行程，否則，安排釣海鰻的體驗也很有創意，順便推廣海鰻的特色餐飲，讓達悟族不吃的海中資源成為旅人的美食，說不定會大賣。\n\
    \  看到那兩條在芋頭田悠游的鰻魚，有感而發地跟旅人分享了這段鰻魚故事，提醒旅人，千萬不要變成鰻魚。萬一，下次有人說你是鰻魚時，要知道，那是在罵人。\n \
    \                                                           （節錄自簡鴻模 蘭嶼徒步環島不要載我\
    \ 玉山社）"
