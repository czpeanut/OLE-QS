  stem: 純就文意而言，「安能辨我是雄雌」，句中「雄雌」調整為「雌雄」，並未改變原意，下列詞語字序更動後，何者意義不變？
  options:
  - label: A
    content: 父母親在孩子們心目中的地位，是無人可「替代」的／杯子用完了，暫時拿碗「代替」吧
  - label: B
    content: 山海關地勢險要，「歷來」都是兵家必爭之地／國文老師把這句成語的「來歷」做一番詳述，使我們更明白它的涵義
  - label: C
    content: 他在那道數學題「計算」繁複，要有耐心完成／好朋友之間不該有太多「算計」，應該誠心以對
  - label: D
    content: 哥哥因為喜歡吃美食，從小都是「渾圓」的體型／這位歌手擁有「圓渾」高亢的好歌喉，備受人歡迎。
