  type: single
  page: 2
  stem: 關於一棵開花的樹的理解，下列說明何者正確？
  options:
  - label: A
    content: 本詩以第三人稱的觀點描寫，善用對話，塑造女子深情的形象
  - label: B
    content: 作者以輪迴觀塑造前世今生的故事，以前世「五百年」的漫長祈求，對比今生短暫的「遇見」與「走過」
  - label: C
    content: 由「朋友啊那不是花瓣／是我凋零的心」可知女子與對方當不成情人，將愛情昇華為友情
  - label: D
    content: 運用對比手法，表現女子的深情不渝與男子的負心絕情。
