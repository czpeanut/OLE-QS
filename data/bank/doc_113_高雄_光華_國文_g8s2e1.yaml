  group_stem: "（二）\n   青青河畔草，綿綿思遠道。遠道不可思，夙昔①夢見之。夢見在我旁，忽覺在他鄉。他鄉各異縣，展轉不相見。枯桑知天風，海水知天寒。入門各自媚，誰肯相為言！客從遠方來，遺我雙鯉魚。呼兒烹鯉魚，中有尺素②書。長跪讀素書，書中竟何如？\
