- id: doc_113_高雄_光華_國文_g8s2e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 關於木蘭詩中各句文意的說明，何者錯誤？
  options:
  - label: A
    content: 「朝辭爺娘去，暮宿黃河邊……旦辭黃河去，暮至黑山頭」——以時空的遞移轉換，寫出行軍迅捷與離鄉漸遠
  - label: B
    content: 「萬里赴戎機，關山度若飛」——透露部隊行軍快速及長期征戰的奔波辛勞
  - label: C
    content: 「當窗理雲鬢，對鏡貼花黃」以女子美麗的裝扮，凸顯阿姊盛裝迎接木蘭歸來的喜悅之情
  - label: D
