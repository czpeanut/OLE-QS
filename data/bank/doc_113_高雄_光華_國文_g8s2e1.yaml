- id: doc_113_高雄_光華_國文_g8s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 前幾年新冠肺炎疫情全球大爆發時，不少臺灣留學生因此滯留國外無法回國，心中油然出現「不聞爺娘喚女聲，但聞黃河流水鳴濺濺」之情。下列何者所寓含的情感與上述相同？
  options:
  - label: A
    content: 浮雲遊子意，落日故人情。揮手自茲去，蕭蕭班馬鳴
  - label: B
    content: 百川東到海，何時復西歸？少壯不努力，老大徒傷悲
  - label: C
    content: 晴川歷歷漢陽樹，芳草萋萋鸚鵡洲。日暮鄉關何處是？煙波江上使人愁
  - label: D
    content: 秦時明月漢時關，萬里長征人未還。但使龍城飛將在，不教胡馬度陰山。
