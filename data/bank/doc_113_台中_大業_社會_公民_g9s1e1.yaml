  type: single
  page: 2
  stem: 各國針對減塑目標提出不同措施，德國實施「退瓶保證金」機制，在消費者回收空瓶後，購物時支付的保證金就會退回作為鼓勵，成功讓德國成為塑膠包裝回收率最高的國家；反觀英國針對一次性咖啡杯徵收「拿鐵稅收」，在推行約兩個月後便退場；加拿大則宣布一次性塑膠禁令，而我國針對自備飲料杯的消費者會有至少5
    元折扣。有關各國減塑政策的分析，哪一項是正確的？
  options:
  - label: A
