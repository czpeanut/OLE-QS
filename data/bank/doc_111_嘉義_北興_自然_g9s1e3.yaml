  - label: A
    content: 玻璃棒得到質子，所以帶正電
  - label: B
    content: 絲絹得到電子，所以帶負電
  - label: C
    content: 玻璃棒摩擦前後，其中子數不同
  - label: D
    content: 絲絹和玻璃棒摩擦時，發生化學變化。
