- id: doc_113_高雄_鼎金_社會_地理_g9s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 美國與加拿大的農牧業相當發達，為世界主要的農產品輸出國，創造大量就業機會。請問：關於北美洲的農業經營，下列敘述何者正確？
  options:
  - label: A
    content: 為能達到自給自足，單一農地上種植多種經濟作物
  - label: B
    content: 由於農業人口比例較少，故很少採用機械協助耕作
  - label: C
    content: 投入成本在精進農業科技，產量提高但獲利卻減少
  - label: D
    content: 依市場需求，大量種單一作物，有生產過剩的風險。
- id: doc_113_高雄_鼎金_社會_地理_g9s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 中南美洲的人口高度集中在某些大都市，都市化程度甚至高於美國的83%及臺灣的80%，如：烏拉圭的都市化程度高達95.6%。龐大的人口湧入都市使許多都市外圍形成廣大的貧民窟，除了居住環境品質低落外，也引發治安問題等，請問：中南美洲的人口大量移入都市的原因可能為何？
  options:
  - label: A
    content: 政府鼓勵移居都市
  - label: B
    content: 都市大眾運輸便利
  - label: C
    content: 都市就業機會充足
  - label: D
    content: 鄉村經濟蕭條，推力太強。
- id: doc_113_高雄_鼎金_社會_地理_g9s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 2024.04.14台鏈電子代工廠為避免美中貿易戰引發地緣政治風險，積極啟動產能移轉，包括廣達、鴻海、和碩、緯創、英業達與仁寶等皆已在墨西哥完成設廠；投資規模最大的鴻海近日傳為滿足輝達及CSP業者對AI伺服器產品的需求，再砸1.2億美元(約新台幣38.7億元)擴大布局，將在墨西哥中部再新設生產基地，顯示出看好在地AI應用市場蘊含的潛力。請問：電子代工六強紛紛搶進墨西哥設廠的主要原因為何？
  options:
  - label: A
    content: 為ASEAN成員，對美出口享有關稅減免的利多
  - label: B
    content: 利用大量廉價勞力在美墨邊境廣設加工出口區
  - label: C
    content: 擁有大量高技術人才，吸引外國企業投資設廠
  - label: D
    content: 國土低平廣大，原物料豐富，具原料區位優勢。
