  stem: 哥倫布在皇室贊助下遠渡重洋登陸了拉丁美洲，其登陸地點的氣候溼熱、礦產豐富，因而引起後來歐洲國家陸續前往美洲殖民，往後幾百年間促成了歐洲大陸與美洲大陸之間物種的交換，稱為「哥倫布大交換」。請問：哥倫布若要為這項偉大的壯舉寫一份航海報告，則下列哪一個標題最為適合？
