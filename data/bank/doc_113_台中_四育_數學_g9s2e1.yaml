  stem: 關於二次函數的敘述，下列何者正確？
  options:
  - label: A
    content: 若二次函數 $y=ax^{2}+5$ 的圖形為開口向上的拋物線，則 $a<0$。
  - label: B
    content: 二次函數 $y=2x^{2}$ 與 $y=-3x^{2}$ 的圖形是以 $x$ 軸為對稱軸的對稱圖形。
  - label: C
    content: 若二次函數 $y=ax^{2}$ 的圖形為開口大於二次函數 $y=bx^{2}$ 的圖形，則 $|a|<|b|$。
  - label: D
    content: 二次函數 $y=-2x^{2}$ 圖形的頂點坐標為 $(-2, 0)$
