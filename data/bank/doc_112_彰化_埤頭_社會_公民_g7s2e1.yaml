  stem: 傳統五倫為父子有親，君臣有義，夫婦有別，長幼有序，朋友有信。其解釋：父親與兒子之間有親情、君王與臣子之間有節義、夫妻間有區別、年長與年幼者有主次、朋友之間有信任
  group_stem: 社會規範是由社會學家指出「人們共同認可及遵守的行為標準」的一個普遍現象。這些標準包含了某種道德意味，是被一般人認為是「對的」、是以「應當」並加以遵守的標準，不論它們是否有用或有效。打破社會規範的成員往往會受到不成文的懲罰。社會規範可以被基本的分為四種類型，分別是(A)風俗習慣(B)倫理道德(C)宗教信仰(D)法律。依題意判斷，下列各題在探討何種社會規範？
