  stem: 上文所提到之火星文，敘述何者不正確？
  options:
  - label: A
    content: 火星文是具有獨特性的文化
  - label: B
    content: 火星文是一種次文化
  - label: C
    content: 火星文因為是錯誤的文字，所以是低等的文化
  - label: D
    content: 火星文雖是將錯就錯的文字，也算是一種文化
  group_stem: 根據考證，火星文最初先起源於台灣，因倉頡、注音等繁體輸入法出現，網友在輸入時會出現一些錯字，久而久之，大家明白常見錯字的涵意，但實際上是一類網路語言。隨著網路的普及，年輕網友為求方便或彰顯個性，開始大量使用同音字、音近字、特殊符號來表音的文字。由於這種文字與日常生活中使用的文字相比有明顯的不同，文法也相當奇異，難以讀懂，故稱為火星文。取「地球人看不懂的文字」的諷刺效果。「火星文」這種用法最早出現於台灣社會，隨即流行於香港、中國大陸和海外華人社會，成為中文網際網路上的特色。
