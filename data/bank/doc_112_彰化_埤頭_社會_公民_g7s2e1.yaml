  stem: 面對社會上時有所聞的虐待動物事件，立法院修改《動物保護法》，加重虐待動物致肢體嚴重殘缺、重要器官功能喪失或死亡的處罰，甚至公布加害者的姓名或照片，以遏止這種不法的行為。立法院之修法，是希望透過哪一社會規範來處罰虐待動物的民眾？
  options:
  - label: A
    content: 風俗習慣
  - label: B
    content: 倫理道德
  - label: C
    content: 宗教信仰
  - label: D
    content: 法律
  group_stem: 近日虐待動物事件頻傳，除了台大僑生虐待流浪貓事件，軍人虐殺流浪狗小白也引發眾怒。立法院經濟委員會修正《動物保護法》，通過了俗稱的「小白條款」。中時報導，近來發生多起動物受虐致死事件，今年初一名大學生涉嫌虐死溫州街街貓「大橘子」、4月，因為嘉義縣家畜疾病防治所運送動物超載致70隻狗，導致44條狗被悶死。未來若宰殺、故意傷害或使動物遭受傷害，致動物肢體嚴重殘缺、重要器官功能喪失者，將處以二年以下有期徒刑或拘役，併科新台幣20萬元以上200萬元以下罰金。對使用藥物、槍械，致複數動物死亡等情節重大者，將處一年以上五年以下有期徒刑，併科50萬元以上500萬元以下罰金。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
