  stem: 甲骨文是中國已發現的古代文字中時代最早、體系較為完整的文字。其後分別為金文→小篆→隸書→楷書→行書→草書
  group_stem: 文化在漢語中實際是「人文教化」的簡稱。前提是有「人」才有文化，意即文化是探討人類社會的專屬語；「文」是基礎和工具，包括語言或文字；「教化」是這個詞的真正重心所在：作為名詞的「教化」是人類精神活動和物質活動的共同規範，作為動詞的「教化」是共同規範產生、傳播及得到認同的過程和手段。而文化具有四個特性，分別為(A)普遍性(B)差異性(C)累積性(D)制約性。請根據題意，判斷各題是描述文化的何種特性？
