    \ Drais made a two-wheeled running machine called the Draisine or Laufmaschine.\
    \ It had two wheels but no pedals, so when people rode it, they had to push it\
    \ along with their feet.\n      Later, in the 1860s, two French made a new bicycle\
    \ called the Velocipede. This time, the bicycle had pedals on the front wheel\
    \ so that it was easier for people to ride. However, the ride was not very comfortable\
    \ because the wheels were made of wood.\n      In the 1870s, another bicycle,\
    \ the Penny-Farthing, became popular. This kind of bicycle had a very large wheel\
    \ in front and a small wheel in back. The very large wheel helped the bicycle\
    \ go faster, but it was not safe because riders could fall easily.\n      In the\
    \ 1880s, John Starley made a safety bicycle. This bike looked like the bicycles\
    \ today. It had two wheels of the same size. A low seat between the wheels made\
    \ the safety bicycle less dangerous and much more comfortable than earlier bicycles.\
    \ Because of this, more and more people all over the world started using bicycles\
    \ for travel and fun. The design of bicycles has changed over time. However, one\
