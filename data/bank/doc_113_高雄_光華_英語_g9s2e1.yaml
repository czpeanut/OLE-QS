  group_stem: 'In nature, animals don’t just sit there waiting to be eaten. They have
    developed many different ways to protect themselves.


    ### Run!

    Some animals, such as rabbits and antelopes, protect themselves by being faster
    than other animals that hunt them. They use their strong legs to run away so that
    other animals won’t catch them. Small lizards and geckos even leave their body
    parts behind before running away. Don’t worry! They will grow their body parts
    back soon.


    ### Change Colors!

    Octopuses can change their skin color in the ocean to fool big fish that attack
    them. Some insects have the same color as the green leaves or the brown leaves;
    therefore, birds or other animals won’t easily find them. Zebras’ black and white
    colors can make lions have trouble seeing where one zebra begins and another one
    ends.


    ### Stay in Groups!

    Staying in groups help monkeys, elephants, and geese to protect themselves better.
    The group members can help hunt for food, raise their small and weak youngs, take
    good care of one another. It will become more difficult for other animals to attack
    such a large group.


    ### Play Dead!

    Some animals play dead to stop themselves from being eaten! One famous example
    is the opossum. When an opossum is in danger, it doesn’t run away. Actually, it
    falls over on the ground as soon as possible and plays dead for several hours.
    Animals that play dead sometimes not only look dead but also smell dead. How interesting!


    Birds have wings to fly onto the trees and get away from a cat. Hippos make use
    of their huge sizes to scare other animals away. These different types of protecting
    ways have given animals chances to stay safe.


    develop 發展 antelope 羚羊 lizard 蜥蜴 gecko 壁虎 opossum 負鼠

