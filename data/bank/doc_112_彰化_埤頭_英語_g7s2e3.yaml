  stem: What is Diwali also known as?
  options:
  - label: A
    content: Festival of Colors.
  - label: B
    content: Festival of Lights.
  - label: C
    content: Festival of Food.
  - label: D
    content: Festival of Music
  group_stem: '● "A Journey to India "

    Welcome to India, a land of vibrant cultures, traditions, and colors! India is
    a beautiful country in South Asia. It is known for its rich history, delicious
    food, and beautiful festivals.

    One of the most famous festivals in India is Diwali, also known as the Festival
    of Lights. During Diwali, people decorate their homes with colorful lights and
    candles. They also exchange gifts and sweets with their friends and family.

    Another important part of Indian culture is its delicious cuisine. Indian food
    is famous for its spicy tastes and special ingredients. Some popular Indian dishes
    include curry, biryani, and samosas.

    India is also known for many famous places and buildings, such as the Taj Mahal.
    The Taj Mahal is a beautiful white mausoleum in the city of Agra. King Shah Jahan
    built it for his favorite wife.

    In short, India is an interesting country with a rich cultural traditions. From
    its vibrant festivals to its delicious food, there is so much to explore in this
    amazing country!

    Word bank: vibrant:充滿活力的；traditions：傳統；festival:慶典；exchange：交換；ingredients :食材；mausoleum:陵寢'
