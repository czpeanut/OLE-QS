  stem: According to the reading, why are orangutans sad?
  options:
  - label: A
    content: Because they need to eat palm trees.
  - label: B
    content: Because they are leaving the rainforest.
  - label: C
    content: Because there are more and more animals living there.
  - label: D
    content: Because their homes are being destroyed.
  group_stem: '● Save the Rainforest Friends

    In the deep, green rainforest, live the orangutans. The trees touch the sky and
    colorful birds sing there. These gentle animals swing from tree to tree, eating
    yummy fruits. But danger gets in the rainforest. Some people cut down trees, destroying
    the orangutans'' homes. They want the land for farms and buildings. This makes
    the orangutans sad and scared. People plant rows and rows of palm trees in the
    rainforest. These palm trees are used to make oil. But this also takes away the
    homes of orangutans and other animals.

