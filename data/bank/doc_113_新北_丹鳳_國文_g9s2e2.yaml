  group_stem: "俗以喜面諛人者曰「戴高帽」。\n 有京朝官出仕於外者，往別其師。師曰：「外官不易為，宜慎之。」其人曰：「某備有高帽一百，逢人則送其一，當不至有所齟齬也。」師怒曰：「吾輩直道事人，何須如此！」其人曰：「天下不喜戴高帽如吾師者，能有幾人歟？」師頷其首曰：「汝言亦不為無見。」\n\
