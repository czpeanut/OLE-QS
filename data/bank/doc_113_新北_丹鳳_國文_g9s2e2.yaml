  stem: 「夫一女二夫，人之不幸，況於再三者哉！」的譬喻方式，說明馮道的何種人格特質？
  options:
  - label: A
    content: 生於亂世，苟且偷生
  - label: B
    content: 無廉無恥，巾幗不如
  - label: C
    content: 人之不幸，莫若無女
  - label: D
    content: 一夫二妻，享齊人之福。
  group_stem: '馮道（882 年—954 年），字可道，號長樂老，瀛州景城（今河北）人。生於唐僖宗中和二年（882年），卒於後周顯德元年（954 年）。五代時期政治家、大規模官刻儒家經籍的創始人。歷事五朝、八姓（八個家族）、十一帝，「累朝不離將相、三公、三師之位」，前後為官四十多年，堪稱中國官場史上的不倒翁。

    《舊五代史》說馮道：「事四朝，相六帝，可得為忠乎！夫一女二夫，人之不幸，況於再三者哉！所以飾終之典，不得諡為文貞、文忠者，蓋謂此也。」

    歐陽修在《新五代史》說：「予讀馮道《長樂老敘》，見其自述以為榮，其可謂無廉恥者矣，則天下國家可從而知也。」'
