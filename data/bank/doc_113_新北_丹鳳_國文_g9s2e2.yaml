  stem: 關於鄒忌諷齊王納諫一文的剖析 ，下列敘述何者錯誤？
  options:
  - label: A
    content: 「燕、趙、韓、魏聞之，皆朝於齊。此所謂戰勝於朝廷。」指齊王善於用兵，能在詭譎的世局中獲勝
  - label: B
    content: 「吾孰與徐公美」為倒裝句，即「吾與徐公孰美」
  - label: C
    content: 「王曰：『善』」與「乃下令……」，顯現齊王是明智果斷、從善如流的國君
  - label: D
    content: 「明日，徐公來。熟視之，自以為不如；窺鏡而自視，又弗如遠甚。」寫出鄒忌不盲目輕信，而且躬親考察的求實精神。
  lesson_raw:
    title: 鄒忌諷齊王納諫
    basis: 題目指明「鄒忌諷齊王納諫一文」
