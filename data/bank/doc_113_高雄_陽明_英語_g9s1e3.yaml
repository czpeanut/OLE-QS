  group_stem: "Wait, have I been here before? Haven’t I seen this person pass by this\
    \ street yet? Sometimes, when we face a new thing or place, we feel strange that\
    \ it’s not the first time. We call that “déjà vu.” It is from French and means\
    \ “already seen.”\n    The pictures below show what is and what is not a déjà\
    \ vu experience and how science explains it.\n\n| A | A girl watched a video of\
    \ a monkey riding a goat for the first time. |\n|---|---|\n| B | Before long,\
    \ she saw a man on a horse and it looked like the video.<br>→Sometimes we see\
    \ or experience things that look like other things we have already seen, and we\
    \ know where these experiences are from. When this happens, our memories are working\
    \ well. We know why it is familiar to us, and it is not déjà vu. |\n| C | Later\
    \ on, she saw some horses at a zoo. She felt like she saw that before, but in\
    \ fact, it was the first time she visited the zoo.<br>→You notice something, and\
    \ it is so familiar that you appear to remember seeing it before. Because the\
    \ feeling comes very fast and strongly and then goes away quickly too, you wonder\
    \ what just happened. The familiarity feels strange, so you are probably experiencing\
    \ déjà vu. |\n\n    Two lobes may play an important part in déjà vu. The order\
    \ of familiarity is sent from the temporal lobe, which is close to your ear. If\
    \ the order is noticed but not fully taken by the lobe above your eyes, déjà vu\
    \ happens.\n\nmemory 記憶  familiar 熟悉的  familiarity 熟悉感  lobe 腦葉  temporal 暫時的"
