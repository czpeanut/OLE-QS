  section: 5
  number: 9
  type: single
  page: 5
  stem: What are they talking about?
  options:
  - label: A
    content: The history of eastern weddings.
  - label: B
    content: Weddings in different places.
  - label: C
    content: Meanings of wedding dress colors.
  - label: D
    content: A wedding with more guests is better.
  group_stem: 'IV.

    **facebook** Search Home

    **Samantha**

    My cousin, Lily, and her husband had a formal and traditional Japanese wedding.
    Only their close family and friends joined the wedding. It was in a shrine or
    a temple. Lily was in white with a heavy and big headdress. Her husband was in
    black. Most people wore black suits or dresses. This wedding was very different
    from the ones that I joined before. Usually the weddings I joined were noisy.
    People talked and laughed, and there were always beautiful colors! It was so special!

    👍 156 Like 💬 10 Comment ↪️ Share


    **Mavis Lin**

    Wow! I’ve never joined a Japanese wedding. Share with us a picture! My cousin,
    Mario, had a Taiwanese wedding in ChiaYi. We all sat at the tables on the roads.
    There were more than fifty tables on the roads. I think most of their family and
    friends were there. Every woman from the bride’s family wore a small red flower
    in their hair. My cousin and his wife changed their clothes when they first, second,
    and third walked to the stage. My cousin wore suits of three different colors.
    His wife was in white, yellow and red. The second time they walked to the stage,
    they danced happily! There were a lot of food and music. Singers sang loudly and
    danced on the stage. Before we left, my cousin and his wife stood there with a
    basket of candy. They shared happiness with the guests by sharing the candy. Do
    you remember the popular singer and his wife had a fantastic wedding in a castle?
    She was like a princess! How beautiful! I don’t have that much money, but I wish
    to have a wedding in a small castle when it’s my turn.😊


