  stem: What does TOP mean by saying “show G-Drag the ropes”?
  options:
  - label: A
    content: To teach him how to do a job.
  - label: B
    content: To prepare some tools for him.
  - label: C
    content: To expect him to show up on time.
  - label: D
    content: To show him some products at the store.
  group_stem: 'III.

    TOP：Hi, you must be the new guy. I’m going to show you the ropes today.

    G-Drag：Thanks! This is my first week working at BIG Supermarket.

    TOP：First, let’s start from the back. We put important groceries like eggs and
    milk there so that people will have to go through the whole store to get them.
    Perhaps they will pick up something on the way that they don’t plan to buy.

    G-Drag：I never knew the trick!

    TOP：Another reason why the fridges are at the back of the store is it takes less
    time for the delivery trucks to stock them. We want to make sure they stay fresh
    the whole time.

    G-Drag：I see your point.

