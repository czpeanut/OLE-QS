- id: doc_113_台南_中正_英語_g9s1e3_s5_4
  section: 5
  number: 4
  type: single
  page: 3
  stem: What is the best title for the article?
  options:
  - label: A
    content: 11 Successful Kidpreneurs Who are Under 12
  - label: B
    content: Ryan’s Well – Amazing.  Clean.  Smiles.
  - label: C
    content: A Boy Who Brings Clean Water to the World
  - label: D
    content: Let’s Build a Well, Not a Wall
  group_stem: 'II.

    Ryan’s Well is the inspiring story of how one child’s kindness grew into a global
    movement of bringing clean water to people in need. It all started in 1998 when
    Ryan Hreljac, a six-year-old boy from Canada, learned in school that many people
    in the world didn’t have access to clean water. His teacher explained how children
    in some countries had to walk for hours to get water, and even then, it wasn’t
    always safe to drink. Ryan was deeply moved and wanted to help.


    At first, Ryan decided to save money by doing extra chores at home. He wanted
    to raise $70, which was the cost his teacher said could build a well. After weeks
    of hard work, he learned that building a well actually cost much more—around $2,000.
    Instead of giving up, Ryan asked his family, friends, and community for help.
    With their support, Ryan raised enough money to build his first well in a small
    village in Uganda.


    In 1999, Ryan traveled to Uganda to see the well he helped build. He met the people
    whose lives were changed because of his efforts, and he realized how big the need
    for clean water was. This experience inspired Ryan to continue helping. Over time,
    what started as one boy’s mission became the Ryan’s Well Foundation, a nonprofit
    organization dedicated to bringing clean water and sanitation to communities around
    the world.


    Since then, the foundation has built over 1,600 water projects in more than 37
    countries, helping millions of people gain access to clean water. These projects
    not only improve health by preventing waterborne diseases but also allow children
    to spend more time in school instead of walking long distances for water. Families
    can use their time and energy to grow food and build better lives.


    Ryan’s Well shows that even a small act of kindness can make a big difference.
    Ryan’s story inspires people of all ages to care about others and take action
    to solve problems in the world. It reminds us that no matter how young or small
    we are, we all have the power to create change.


     inspire 激勵 access 途徑 chore 雜務 effort 努力 mission 任務 nonprofit organization 非營利組織
    dedicate 致力 sanitation 衛生設備 waterborne 水生寄生蟲'
  tags:
    textbook: 第五冊（九上）第3次段考範圍
    labeled_by: ai
