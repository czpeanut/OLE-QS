  stem: 物體的熱量變化（H）和質量（m）、比熱（S）、溫度變化（△T）均有關係，現有甲、乙兩物體相互比較，當固定其中兩個變因時，另兩者大小關係下列何者正確？
  options:
  - label: A
    content: 當 H 與△T 相同時，若 $m_{甲} > m_{乙}$，則 $S_{甲} > S_{乙}$。
  - label: B
    content: 當 m 與△T 相同時，若 $S_{甲} > S_{乙}$，則 $H_{甲} < H_{乙}$。
  - label: C
    content: 當 H 與 S 相同時，若 $m_{甲} < m_{乙}$，則 $\triangle T_{甲} < \triangle T_{乙}$。
