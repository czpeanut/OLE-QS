  stem: 人體會維持體內的恆定，血液的 pH 值必須維持在 7.35 ～ 7.45，不管是過低還是過高，生命活動都無法正常進行。身體中的血液對外加的酸鹼性物質有一定「調節」能力，無論攝入酸性或鹼性物質，血液的
    pH 值都不會有太大改變。此外，肺部的氣體交換和腎臟的過濾功能，也可以協助血液 pH 值的恆定，所以通常食物不會使血液的酸鹼性有明顯變化，也沒有酸、鹼性體質之分了。根據上述內容，請判斷「酸性體質較容易被蚊子叮，可以多吃鹼性食物調理」的說法是否正確？
