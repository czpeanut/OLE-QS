  section: 2
  number: 41
  type: single
  page: 4
  stem: 在南太平洋群島的族群裡，也可以看見擁有臺灣基因的構樹所製造的衣服，推測臺灣可能是何族群的起源地？
  options:
  - label: A
    content: 南島語族
  - label: B
    content: 南亞語族
  - label: C
    content: 亞非語族
  - label: D
    content: 漢藏語族。
  group_stem: "(三) 2021.8.1 原住民族委員會於圓山飯店舉辦「81 原住民族日：正名27 週年回顧與前瞻」活動，除了現場各駐台大使出席外，總統蔡英文以及行政院長蘇貞昌也透過預錄致詞表示，原住民族在台灣民主轉型中扮演重要角色，也肯定在本次2020\
    \ 東京奧運上的傑出表現。例如:舉重奪金的郭婞純(阿美族)、柔道奪銀楊勇緯(排灣族)、100m 國手楊俊瀚(阿美族)、100m 國手謝喜恩(阿美族)、跆拳道國手蘇柏亞(阿美族)、400m\
    \ 跨欄國手陳傑(阿美族)、柔道國手林真豪(阿美族)、拳擊國手陳念琴(阿美族／布農族)、自由車國手馮俊凱(泰雅族)、射箭國手林佳恩(泰雅族)、舉重國手江念欣(布農族)、舉重國手高展宏(布農族)、舉重國手方莞靈(鄒族)等。\n\
    \    原住民族在現今的政治、經濟產業、國防事務，以及第一線的防疫崗位上的參與都有傑出的成就，應受到同等關注。呼籲國人為原住民選手喝采時，更要一起認識原住民族的歷史與文化，看見各領域原住民族的活躍。(2021.08.01\
    \ 中央廣播電台報導)"
