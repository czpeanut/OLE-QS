  group_stem: '※題組(37~38 題)

    請根據下列文章回答下列問題：

    墾丁發現新種螢光蕈！中興大學生命科學系碩士研究生調查研究墾丁國家公園區螢光蕈分類時，發現一種小型螢光蕈，經形態及 DNA 序列比對，確定為新種，命名為「墾丁小菇」，並在實驗室內人工培養成功。墾丁小菇是臺灣記錄到的第9
    種螢光蕈類，全世界第74 種被紀錄的螢光蕈。

    螢光蕈僅具觀賞價值，不能食用，生長後只能存活3 天，夏天高溫、潮溼的環境最有利生長。螢光蕈是環境指標的物種之一，代表該地區環境未受到汙染，目前台灣只有在嘉義阿里山一帶，和墾丁社頂地區可看見其蹤影。社頂最常見的螢光蕈是”螢光小菇”生長在枯竹上，菌傘直徑明顯比墾丁小菇大。這次新發現的「墾丁小菇」生長於枯樹枝上，菌絲和菌傘都會發出綠色螢光，成熟菌傘3
    到8 公厘，菌傘表面有細微突起。'
