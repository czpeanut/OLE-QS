- id: doc_113_台北_誠正_自然_g7s2e3_s1_15
  section: 1
  number: 15
  type: single
  page: 1
  stem: 凱凱想要研究紫斑蝶的度冬行為，他所研究的對象是屬於下列何種組成層次？
  options:
  - label: A
    content: 個體
  - label: B
    content: 族群
  - label: C
    content: 群集
  - label: D
    content: 生態系
  group_stem: '※題組(15~17 題)

    臺灣有四種紫斑蝶會遷徙度冬，凱凱想知道度冬時，臺灣各棲息地的紫斑蝶分布情形，採用捉放法估算，每地標記 4000 隻紫斑蝶，得到如附表的結果，請依據此表回答下列問題。

    | 地點 \ 次數 | 第1 次 | 第2 次 | 第3 次 |

    | --- | --- | --- | --- |

    | 臺東大武山 | 25 | 23 | 26 |

    | 高雄茂林 | 9 | 11 | 10 |

    | 屏東山地門 | 51 | 50 | 48 |

    | 臺南關子嶺 | 80 | 81 | 79 |

    （每1000 隻中被標記的蝴蝶數量）'
