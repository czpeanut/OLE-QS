- id: doc_113_台北_誠正_自然_g7s2e3_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 根據附表，請問八哥和金龜子的利害關係分別為何？
  options:
  - label: A
    content: ＋；＋
  - label: B
    content: ＋；－
  - label: C
    content: －；＋
  - label: D
    content: －；－
  group_stem: '※題組(20~21 題)

    榕果中的動物很多，就像一個小小世界。榕果小蜂就吃住在榕果裡頭，不過牠用幫忙榕果授粉來付租金，不像也住在裡頭的寄生蜂白吃白住。除此之外，鞘翅目的昆蟲、線蟲、表面介殼蟲等也會聚集過來，吃榕果飽餐一頓，可是得小心眼尖的八哥，一嘴逮到腹中。不過榕樹要完成傳宗接代的任務，還得靠也吃榕果的黑領椋鳥之類的饕客，協助傳播種子。試根據本文回答下列問題：（利害關係：＋表示此關係對生物有益處；－則是有害。）

    | 關係名稱 | 生物甲 | 利害關係 | 生物乙 | 利害關係 |

    | --- | --- | --- | --- | --- |

    | 掠食 | 八哥 | (1) | 金龜子 | (1) |

    | 寄生 | 寄生蜂 | ＋ | 榕果 | － |

    | (2) | 寄生蜂 | － | 榕果小蜂 | － |

    | (3) | 黑領椋鳥 | － | 寄生蜂 | － |'
  tags:
