- id: doc_113_台北_誠正_自然_g7s2e3_s1_47
  section: 1
  number: 47
  type: single
  page: 3
  stem: 入侵紅火蟻的身體型態與下列何種生物最相似？
  options:
  - label: A
    content: 鍬形蟲
  - label: B
    content: 台灣藍鵲
  - label: C
    content: 蠍子
  - label: D
    content: 北極熊
  group_stem: '※題組(47~48 題)

    根據下面文章回答下列問題：

    西元2004 年南美洲雜食性的入侵紅火蟻進入臺灣，除了對生態環境中土棲性動物造成傷害，紅火蟻也會取食農作物種子、果實、幼芽、嫩莖與根系，影響農業經濟。

    入侵紅火蟻會保護巢穴，一旦踏到蟻巢，會導致入侵紅火蟻傾巢而出攻擊，被叮咬後會立即引發劇烈灼熱與癢的感覺，四小時後被螫處會形成白色膿皰，膿皰會持續1～2 週，癒後常會留下疤痕，在野外發現蟻巢時，不要去干擾它。

    入侵紅火蟻生活史包含卵、幼蟲、蛹與成蟲四階段，為社會性昆蟲，分工嚴密，成蟲階級有蟻后、雄蟻及工蟻。

    入侵紅火蟻是完全地棲型蟻巢的種類，成熟蟻巢高約10～30 公分，直徑約30～50 公分蟻丘，蟻巢內部有蜂巢狀結構。明顯隆起的蟻丘是容易快速認定入侵紅火蟻的方法之一。'
  tags:
