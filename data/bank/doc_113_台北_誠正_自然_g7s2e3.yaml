- id: doc_113_台北_誠正_自然_g7s2e3_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 請依上述和所學推論，下列有關蝙蝠的敘述，何者正確？
  options:
  - label: A
    content: 蝙蝠的耳朵只能聽到人耳聽到的超音波
  - label: B
    content: 蝙蝠的眼睛能看到人眼看不到的光線
  - label: C
    content: 蝙蝠的體表沒有角質層
  - label: D
    content: 蝙蝠屬於鳥類
  group_stem: '※題組(13~14 題)

    蝙蝠在黑夜活動時，會藉由喉部快速振動，發出高頻率的聲音（人耳無法聽見），這些聲音稱為超音波。當超音波碰到障礙物或昆蟲後會反射回來，蝙蝠再利用牠們的大耳朵接收回聲，以偵測獵物的所在位置、移動方向、速度快慢和體型大小等。蝙蝠除了可以利用超音波感知周遭環境，牠們的眼睛對紫外光、紅光和紅外光都很敏感（人眼無法看到紫外光和紅外光）。在我們伸手不見五指的夜晚，蝙蝠卻能瞥見因體溫而散發紅外光的白鼻心，或停駐在樹梢上的貓頭鷹。人類眼中的黑暗世界，在蝙蝠眼中可是豐富得多呢！請根據以上敘述，回答下列問題：'
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 生物
      code: 3-5
      title: 動物界
      chapter: 第3章 生物的演化與分類
    textbook: 七下生物 3-5 動物界
    labeled_by: ai
