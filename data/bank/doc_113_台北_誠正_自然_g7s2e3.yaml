- id: doc_113_台北_誠正_自然_g7s2e3_s1_49
  section: 1
  number: 49
  type: single
  page: 3
  stem: 依上文所敘，達娜伊谷：
  options:
  - label: A
    content: 屬於溪流生態系
  - label: B
    content: 主要生產者為浮游藻類
  - label: C
    content: 主要消費者為鹿
  - label: D
    content: 為法定國家公園
  group_stem: "※題組(49~50 題)\n「達娜伊谷」為鄒族語，意思是指「忘記憂愁的地方」。它位於阿里山鄉曾文溪的上游，兩岸鳥蝶振翅飛舞，溪谷中魚類豐富，如馬口魚、石魚賓，尤其鯝魚（註）因深具經濟價值，頻遭毒、炸等方式捕獵，造成水源汙染。民國70\
    \ 年，當地鄒族人決心捍衛這條堪稱部落命脈的重要水資源，期間也曾遭逢賀伯颱風侵襲；當地鄒人動員全體村民，搬動溪石、整修達娜伊谷。歷經數十年的調養生息，今日我們才可看到清澈見底的溪流。\n\
    \  「達娜伊谷自然生態公園」是臺灣第一座由民間推動而成的生態公園，由當地社區發展協會管理，開放遊憩，收取酌量清潔維護費，在公園入口處還有傳統的歌舞表演。另一方面，每逢雨季和魚類繁殖期間，達娜伊谷也會開放曾文溪供釣客垂釣，並提供魚苗給養殖業者。\n\
    (註)鯝魚:包括臺灣鯝魚（臺灣鏟頜魚、俗稱苦花）和高身鯝魚（高身鏟頜魚，為臺灣特有種，列為保育類動物，俗稱鮸仔）。牠們多以石縫間的藻類和小昆蟲為食，流線的體形和有力的尾鰭讓牠們得以在湍急的溪谷裡活躍自如。其肉質也異常鮮美，是原住民傳統美食，經濟價值很高。高身鯝魚列為保育類後，依法不得捕獵、買賣。"
