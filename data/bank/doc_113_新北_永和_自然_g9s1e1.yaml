- id: doc_113_新北_永和_自然_g9s1e1_s2_47
  section: 2
  number: 47
  type: single
  page: 5
  stem: 下列何者是造成臺灣水資源不足的原因？
  options:
  - label: A
    content: 河川汙染嚴重，造成可利用的乾淨水質不足
  - label: B
    content: 降雨季節過度集中
  - label: C
    content: 台灣山坡陡峭，河川東西走向短促，使雨水無法停留在地表過長時間
  - label: D
    content: 以上皆是。
  group_stem: "(三)仔細閱讀文章，試回答第 47~48 題。\n臺灣年平均降雨量達 2500 毫米，年總降雨量近 900 億公噸，但每年所需用水量僅\
    \ 180 億公噸，水資源應該相當豐沛。但臺灣山高坡陡、河川短促，降雨集中於梅雨與颱風兩個雨季，難將雨水留置使用，使得臺灣偶有缺水危機。因此，人們需興建水庫或蓄水埤塘，以調節水資源；並積極尋求其他水源，如汙水再利用及海水淡化等；同時提倡節約用水，期能度過每年的枯水期。臺灣的地下水資源豐沛，若管理得當，地下水遠超過水庫可調節之總水量。\n\
    \    此外，人們常將未經處理的汙染物，例如：工業廢水、農牧業廢水、家庭廢水等，直接排入河川中，造成水汙染。汙染物藉由水循環和食物鏈的累積，最終將嚴重影響人們自身的健康安全。為了減少水汙染，建構完善的下水道和設置汙水處理廠，是必要的措施。"
  tags:
