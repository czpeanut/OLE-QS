- id: doc_113_高雄_五福_國文_g9s1e2_s5_1
  section: 5
  number: 1
  type: single
  page: 5
  stem: 請問：(甲)材料中，何者最切合作者的飲食哲學？
  options:
  - label: A
    content: 飲食之道重火候，兼及色香味境界
  - label: B
    content: 物各有其性，展現本味，乃為佳餚
  - label: C
    content: 哺糟啜醨，皆可以醉；果蔬草木，皆可以飽
  - label: D
    content: 飲食不宜苟且，鹹淡必適其中，不可絲毫加減
  group_stem: "（一）\n為政者興一利，不如除一弊，能除飲食之弊，則思過半矣。作《戒單》\n(甲)〈戒耳餐〉\n    何謂耳餐？耳餐者，務名之謂也。貪貴物之名，誇敬客之意，是以耳餐，非口餐也。不知豆腐得味，遠勝燕窩。海菜不佳，不如蔬筍。余嘗謂雞、豬、魚、鴨，豪傑之士也，各有本味，自成一家。海參、燕窩，庸陋之人也，全無性情，寄人籬下。嘗見某太守宴客，大碗如缸，白煮燕窩四兩，絲毫無味，人爭誇之。余笑曰：「我輩來吃燕窩，非來販燕窩也。」可販不可吃，雖多奚為？若徒誇體面，不如碗中竟放明珠百粒，則價值萬金矣。其如吃不得何？\n\
    (乙)〈戒火鍋〉\n    冬日宴客，慣用火鍋，對客喧騰，已屬可厭；且各菜之味，有一定火候，宜文宜武，宜撤宜添，瞬息難差。今一例以火逼之，其味尚可問哉？近人用燒酒代炭，以為得計，而不知物經多滾，總能變味。或問：「菜冷奈何？」曰：「以起鍋滾熱之菜，不使客登時食盡，而尚能留之以至于冷，則其味之惡劣可知矣。」\n\
    袁枚《隨緣食單‧戒單》"
