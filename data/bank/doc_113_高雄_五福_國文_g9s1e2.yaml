  stem: 蘇軾〈卜算子〉：「缺月挂疏桐，漏斷人初靜。誰見幽人獨往來，縹緲孤鴻影。  驚起卻回頭，有恨無人省。揀盡寒枝不肯棲，寂寞沙洲冷。」 下列選項的敘述，何者錯誤？
