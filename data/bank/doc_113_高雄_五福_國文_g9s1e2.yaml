    \    蔡答曰：「夜光之珠，不必出於孟津之河；盈握之璧，不必采於崑崙之山。大禹生於東夷，文王生於西羌。聖賢所出，何必常處？昔武王伐紂，遷頑民於洛邑；得無諸君是其苗裔乎？」\n\
    《世說新語˙言語》\n【注釋】①幕府：此泛指軍政大臣的府署。        ②辟命：徵召人才。"
