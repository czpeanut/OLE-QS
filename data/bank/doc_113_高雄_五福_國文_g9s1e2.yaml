- id: doc_113_高雄_五福_國文_g9s1e2_s5_4
  section: 5
  number: 4
  type: single
  page: 5
  stem: 柳宗元何以能在生命中塑造自己的文化人格，又能營築可人的小天地，而非朝廷棋盤的死棋？
  options:
  - label: A
    content: 懂得與王抗爭
  - label: B
    content: 忙於拉攏權貴
  - label: C
    content: 愛民且善疏理
  - label: D
    content: 勤讀又能上進
  group_stem: "（二）\n    在柳州的柳宗元，宛若一個魯濱遜。他是一個小小的貶謫官職利用者，挖了井，辦了學，種了樹，修了寺廟，放了奴婢。畢竟勞累，在四十七歲死去。\n\
    \    柳宗元晚年所幹的這些事，一般被稱為政績。當然也對，但他的政績有點特別，每件事，都按著一個正直文人的心意，依照所遇所見的實情作出，並不考據何種政治規範；作了，又花筆墨加以闡釋，疏浚理義，文采斐然，成了一種文化現象。在這裡，他已不是朝廷棋盤中一枚無生命的棋子，而是憑著自己的文化人格，營築著一個可人的小天地。在當時的中國，這種有著濃鬱文化氣息的小天地，如果多一些，該多好。\n\
    \    時間增益了柳宗元的魅力。他死後，一代又一代，許多文人帶著崇敬和疑問仰望著這位客死南荒的文豪。重蹈他的覆轍的貶官，在南下的路途中，一想到柳宗元，心情就會平適一點。柳州的歷代官吏，也會因他而重新檢點自己的行止，這些，都可以從柳侯祠碑廊中看到。柳宗元成了一個獨特的形象，使無數文官或多或少的強化了文人意識，詢問自己存在的意義。\n\
    （節錄自余秋雨 柳侯祠）"
