  stem: 「同樣地，簞食瓢飲不美，美的是居陋巷不改其樂的人；竹篁短籬不美，美的是採菊東籬下的人。在我們夜眠不過數尺、日食不過三頓的現實生活中，日漸繁複精緻的物質有時可以引起一聲驚呼，但總是瞬間即滅。對設計者而言，可能透過創造的過程掌握到美；對銷售者而言，可能經由販賣過程因擁有再運用的資金而油然心喜；可是，對擁有它的消費者而言，透過交易行為而得到的物品能在我們的生活中引發多長的驚呼、激出多重的美麗，就很值得玩味了。」（簡媜《微暈的樹林》）這段文字中，作者認為美的感受主要取決於下列何者？
