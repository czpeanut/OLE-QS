  stem: 下列何者與蘇洵將二子命名為「軾」和「轍」的涵義不符？
  options:
  - label: A
    content: 「軾」表面上沒有太大作用，但卻是供人憑靠、望遠的構造，蘇洵以此期許蘇軾要能高瞻遠矚
  - label: B
    content: 「轍」是車輪輾過之跡，車皆要依循車轍而行，因此功勞最大，蘇洵以此期許蘇轍要建功立業
  - label: C
    content: 蘇洵替長子取名「軾」，似已預見其明敏過人，可又恐其鋒芒外露，故盼其多加外飾而免於禍患
  - label: D
    content: 為小兒命名為「轍」，從「善處乎禍福之間」，可看出蘇洵是希望蘇轍日後能禍福同免，遠害保身
  group_stem: "（四）\n輪、輻、蓋、軫①，皆有職乎車，而軾②獨若無所為者。雖然，去軾則吾未見其為完車也。軾乎！吾懼汝之不外飾也。\n   天下之車，莫不由轍③，而言車之功者，轍不與焉。雖然，車仆馬斃，而患不及轍，是轍者，善處乎禍福之間。轍乎！吾知免矣。\
    \                                            蘇洵〈名二子說〉\n【注釋】①軫：ㄓㄣˇ，車廂底部後面的橫木  \
    \   ②軾：車廂前供人倚靠、扶手、瞭望的橫木\n        ③轍：車輪輾過所留下的痕跡"
