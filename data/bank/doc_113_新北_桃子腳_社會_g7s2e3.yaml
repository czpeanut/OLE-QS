  group_stem: "【題組三】參考下列資料回答33~34 題\n資料一\n    「在我國八年抗戰下，日本投降，臺灣光復，泰雅的族人們都覺得很感謝。脫離日本統治的牢籠，回歸自由平等之身，臺灣光復，被日本追趕至後山的我們，也應該讓我們回到祖墳之地，慰祭祖靈，實乃之當然。否則，光復於祖國之喜何在？」\n\
    林瑞昌(樂信瓦旦)，〈臺北縣海山區三峽鎮大豹社員社復歸陳情書〉日文手稿(翻譯節錄)，1947 年\n資料二\n    從1980 年代開始直到現在的原住民運動，逐漸得到社會的認同和政府的回應。以屏東縣為例，近來來致力於將原住民保留地歸還給族人，縣長潘孟安強調，臺灣原住民族「還我土地運動」與「正名運動」，逐漸落實土地的轉型正義，讓土地歸於臺灣最早的主人，這是原鄉弟兄姊妹們歷經漫長努力，換回的正義。\n\
    改寫自聯合新聞網，〈爭取原住民保留地，屏東縣高居全國之冠〉，2020 年"
  answer:
  - D
  answer_source: answer_key_vlm
