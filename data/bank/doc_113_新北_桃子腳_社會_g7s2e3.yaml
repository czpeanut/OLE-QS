- id: doc_113_新北_桃子腳_社會_g7s2e3_s2_49
  section: 2
  number: 49
  type: single
  page: 5
  stem: 根據上圖的資料判斷，造成全國數據與原住民數據有此差異的原因，下列解讀何者正確？
  options:
  - label: A
    content: 原住民有好發糖尿病的不良基因
  - label: B
    content: 醫療院所距離太遠，難以定期回診
  - label: C
    content: 原住民忽視醫生的叮囑，不愛吃蔬果
  - label: D
    content: 原住民推動現代化政策放棄傳統飲食文化
  group_stem: '【題組四】請閱讀下文，回答49-50 題

    惡化中的健康不平等

    「糖尿病的治療，藥物只佔了三分之一，另外三分之二得靠生活型態的改變。」對於偏鄉地區的糖尿病患者而言，莫過於得配合3 個月一次的各項生化指標檢查，礙於個人工作與生活時程上的安排不易，有時交通問題和經濟弱勢處境，也成為病患無法完全遵從醫囑、定期接受檢查的主因。

    生活型態的改變，這個佔了糖尿病治療成效三分之二的的因素，對原住民族來說，卻也相當不易。訪談中，多位部落族人表示，現行糖尿病飲食與營養建議等衛教規範，與部落既有的生活型態存有許多衝突。

    1970 年代起，國民政府的現代化政策與山林政策，導致原鄉人口被迫進入都市謀生，原鄉農業人口因而減少，部落族人漸漸不再食用自耕農產、轉而向商人購買食品。因此，以用金錢購買為主的商品經濟逐漸取代自給自足、互助為主的部落經濟。而商品經濟中昂貴的、健康的、有機食材的食材與食品，處於經濟弱勢的部落族人是難以負擔得起，他們僅能購買廉價、劣質的食品。

    ——朱原慶、吳岱陵、陳慈立、陳奕曄，《報導者》'
  shared_asset: g2_49_50
  answer:
  - B
  answer_source: answer_key_vlm
