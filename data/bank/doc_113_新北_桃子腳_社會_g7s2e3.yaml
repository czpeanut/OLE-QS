  options:
  - label: A
    content: 宣揚我國政府因加入WTO 帶來的經濟成就
  - label: B
    content: 關注一般農民、勞工等小人物生活的困頓
  - label: C
    content: 受美援影響，美國流行文化作為劇情主軸
  - label: D
    content: 重視原住民文化，發揚原住民音樂與傳說
  group_stem: '【題組二】參考下列資料回答31~32 題

    1950 年代，臺灣電影為配合政府「反共抗俄」政策，政府所屬片廠拍攝的電影，幾乎都是配合官方意識形態的政治宣傳工具。在1970 年代經濟成長之下，愛情、武俠、功夫、喜劇等電影類型，也進一步走入民眾的休閒娛樂之中。

    1980 年代前期，臺灣電影受到香港電影新浪潮的影響，進入「臺灣新電影」時期。「新電影」在劇本創作上融入鄉土文學的題材，也開始有意識的挑戰官方政治禁忌，因而受到相關單位的關切。例如「新電影」初期代表作《蘋果的滋味》，在正式上映前，因電影片段中呈現諷刺美國、臺北違建林立等有礙政府形象的畫面，遭官方施壓要求刪減，此事件後來被稱為「削蘋果事件」。

    改寫自113 年度會考考題'
  answer:
  - B
  answer_source: answer_key_vlm
