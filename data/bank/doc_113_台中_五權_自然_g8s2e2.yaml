  group_stem: 生活中常見的可燃性粉塵包括穀物、麵粉、糖、奶粉等，若懸浮在空氣中並接觸到高溫或火源，將會形成粉塵燃燒。發生粉塵燃燒的因素包含顆粒細、濃度高且環境乾燥、有火源。產生可燃粉塵的場所應列為禁火區和防止靜電，並採用良好的除塵設施，避免懸浮粉塵達到最低爆炸濃度，導致粉塵劇烈燃燒而引發爆炸。事故發生時，最有效的滅火劑是水，尤其以霧狀水較佳，既可以熄滅火勢，又可溼潤和驅散未燃燒的粉塵，降低空氣中懸浮粉塵的濃度。不宜用具衝擊力的乾粉、二氧化碳滅火劑，防止沉積的粉塵揚起，引起二次爆炸。然而，若是遇到金屬粉塵事故，如鋁、鎂粉等，遇水反應會使燃燒更劇烈，則禁止使用水滅火。根據上文，試回答下列問題：
