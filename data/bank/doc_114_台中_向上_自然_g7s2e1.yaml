  - label: B
    content: 若丙為蛋白質,甲可和丙纏繞 形成乙
  - label: C
    content: 甲稱為染色體,在細胞進行分裂時才出現
  - label: D
    content: 甲的構造兩側大小形狀相似,兩兩成對,稱為同源染色體。
