  group_stem: "The History of Graffiti \n     Modern graffiti seems to have appeared\
    \ in Philadelphia in the early 1960s, and by the late 60’s it appeared in New\
    \ \nYork. The new art really took off in the 1970s, when people began writing\
    \ their names on buildings all over the city. \nIn the mid-70’s, it was sometimes\
    \ hard to see out of a subway car window because the trains were fully covered\
    \ in \npaintings knows as “masterpieces.” \n     In the early days, the “painters”\
    \ were part of street gangs, and they showed their power by marking their “area.”\
    \ \nThey worked in groups, and called what they did “writing.” The word “graffiti”\
    \ was first used by The New York \nTimes. By the 1980s, it became much harder\
    \ to write on subway trains without being caught, and many graffiti artists \n\
    began using roofs of buildings. \n     The fight over whether graffiti is art\
    \ or vandalism is going on. Peter Vallone, a New York lawyer, thinks that \ngraffiti\
    \ can be art if someone allows it, but if you draw on someone else’s cars, homes\
    \ or belongings, you break the \nlaw. “I have some words for the graffiti artists\
    \ out there. Your freedom ends where my belongings begin.” On the \nother hand,\
    \ Felix, a member of the group Get Your City Back, says that artists are getting\
    \ cities back for the public, \nand that graffiti shows freedom and makes cities\
    \ full of energy. \n      For years, graffiti has been a chance for some artists\
    \ to become famous. Jean-Michel Basquiat began painting on \nthe street in the\
    \ 1970s before becoming a top artist in the 1980s.                           \
    \            \n＊gang 幫派    allow 允許     belongings 財產"
