  group_stem: "Robots: friends or not?\n\nWhat is the future of artificial intelligence\
    \ (AI)? Will it be possible for robots to be self-controlling? If so, when will\
    \ \nthat happen and will it be a good thing? We asked four people what they thought.\
    \ \n \nAmber: I would say that we are quite a long way off developing the computing\
    \ power or AI, though I do think it will  \nhappen within the next thirty or forty\
    \ years. We may stay in control of technology and it will help us solve  \nmany\
    \ of the world’s problems. But, no one really knows what will happen if machines\
    \ become smarter than \nhumans. They may help us or hurt us. I believe AI will\
    \ make our life better, but whether it is true will be up to \nus. \n \nBilly:\
    \ That something humans create can be better than us scares me a lot. Even now,\
    \ scientists are teaching    \n          computers how to learn on their own.\
    \ At some point in the future, they can develop faster. Humans    \n         \
    \ develop step by step slowly and would be replaced by them. Shortly, there is\
    \ the danger that robots will take  \n          over millions of human jobs and\
    \ make lots of people lose their jobs. This could mean many people are poor and\
    \  \n          the society is not safe. Besides, machines might decide the world\
    \ would be better without humans. \n \nCody: Soon, we can put a computer inside\
    \ our brain and raise our ability to move and to learn. This idea is going to\
    \  প্রাচ\nbecome more common in our real life. AI is also widely used in the world\
    \ around us. Although there have been a \nfew teething troubles: For example,\
    \ one woman was sleeping on the floor and her hair was eaten by her robot \ncleaner.\
    \ There have also been serious accidents with self-driving cars. However, as we\
    \ know, developing comes \nat a cost. \n \nDoris: I am a member of the group Stop\
    \ Killer Robots. Remember the movie where a robot stamps on human bodies \nand\
    \ that is what’s happening right now: No-man machines are already being used to\
    \ kill. The next step will be \n“murderbot,” following orders but deciding who\
    \ to kill by themselves. It is clear to me that this would be \ndangerous for\
    \ humans. We need to be very careful about what we ask machines to do. \n※control\
    \ 控制  develop 發展   solve 解決     replace 取代     society 社會"
