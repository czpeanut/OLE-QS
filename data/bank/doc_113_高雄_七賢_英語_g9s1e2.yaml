  section: 4
  number: 22
  type: single
  page: 3
  stem: Why are the seeds stored in the Svalbard Global Seed Vault?
  options:
  - label: A
    content: The island is close to the North Pole.
  - label: B
    content: The island is hard to for people to walk to.
  - label: C
    content: The island is big enough to store seeds.
  - label: D
    content: The mountain on the island is high enough.
  group_stem: "THE SEED VAULT \n1. Why are new seeds important? \nA lot of countries\
    \ need different types of seeds, so they can plant them because of environmental\
    \ changes. There is an \nimportant reason for this. Sometimes plants don’t grow\
    \ in a country because of bad weather or disease. That’s why \nfarmers need new\
    \ seeds. \n2. Where can countries store the seeds? \nYou can store seeds in a\
    \ “seed vault.” It’s a place at a special temperature. The seeds don’t grow, but\
    \ they can live for \na long time. Norway has the biggest seed vault in the world\
    \ – the Svalbard Global Seed Vault – and it has seeds from \na lot of different\
    \ countries. \n3. Where is the Svalbard Global Seed Vault? \nThe vault is on the\
    \ island of Spitsbergen. The island is only about one thousand kilometers from\
    \ the North Pole. It’s a \nvery cold place, so it’s good to keep seeds. Above\
    \ the ground, the doorway is small, but inside the building is huge. \nYou walk\
    \ down a long way and one hundred and thirty meters inside a mountain. At the\
    \ end, there are three large \nareas with seeds. \n4. How many varieties of seeds\
    \ are there? \nThere are about half a million varieties of seeds inside the vault.\
    \ For example, there are many varieties of seeds of rice \nfrom Asia and Africa,\
    \ 32 varieties of seeds of potatoes from Ireland, and seeds of different chiles\
    \ from the USA. \n         ※vault 保險庫        environmental 環境的     disease 疾病\
    \     temperature 溫度     variety 多樣化     chile 辣椒"
