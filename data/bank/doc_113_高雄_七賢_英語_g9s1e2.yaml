- id: doc_113_高雄_七賢_英語_g9s1e2_s3_17
  section: 3
  number: 17
  type: single
  page: 2
  stem: （篇章結構第17格）
  options:
  - label: A
    content: For many years, people such as parents have wanted the chance to work
      from home.
  - label: B
    content: However, other people’s jobs are more important than ever.
  - label: C
    content: Some have had problems with money and will never open again.
  - label: D
    content: It’s easier to find the thing you want to buy, and you don’t have to
      go out.
  - label: AB
    content: Maybe the bosses don’t trust their workers to work from home, or maybe
      the computer system cannot be used at home.
  group_stem: "At the moment, many countries around the world are in lockdown because\
    \ of Covid-19. Everyone hopes that the \nworld will go back soon. But, will things\
    \ be the same in the future? Let’s ask Alexa Tomlin, a reporter in Big News. \n\
    Q: Do you think Covid-19 will change the way of how people work? \nA: Of course!\
    \ Because of Covid-19, some people lost their jobs.      17.     At the moment,\
    \ we can’t live without \ndrivers, doctors, nurses and market workers and so on.\
    \ But actors, painters and workers in holiday hotels haven’t \nworked for a year!\
    \ Those jobs often seem interesting and exciting. But, Covid-19 has taught us\
    \ that those kinds of \njobs aren’t stable. In the future, I think more people\
    \ will prefer to work in a more stable place. \nAlso, in many fields, people are\
    \ working from home these days.        18.      But, not all the bosses like this\
    \ idea. \nThey preferred people to come to the office.       19.       Now, working\
    \ from home is the daily life. So I think that in \nthe future, more people will\
    \ choose to work from home either full time or part time. \nQ: What about shopping?\
    \ Will it change? \nA: Covid-19 has changed the way of shopping. People haven’t\
    \ been able to go to shopping centers and \ndepartment stores. Many stores have\
    \ closed.        20.      In fact, many town shops were having problems before\
    \ \nCovid-19. People enjoy buying things online.        21.       I don’t think\
    \ they will go to the shops after Covid-19. So \nwhat will happen to town centers?\
    \ Maybe town centers will become centers of art, music and business. I am not\
    \ sure.  \n※seem 似乎       stable 穩定       prefer 比較喜歡       field 領域        system\
    \ 系統 \n(A) \nFor many years, people such as parents have wanted the chance to\
    \ work from home. \n(B) \nHowever, other people’s jobs are more important than\
    \ ever. \n(C) \nSome have had problems with money and will never open again. \n\
    (D) \nIt’s easier to find the thing you want to buy, and you don’t have to go\
    \ out. \n(AB) Maybe the bosses don’t trust their workers to work from home, or\
    \ maybe the computer system cannot be used \nat home."
  shared_asset: g3_17_21
  tags:
    textbook: 第五冊（九上）第2次段考範圍
    labeled_by: ai
