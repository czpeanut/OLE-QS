  stem: 它的標題常被用來使你感到興趣，並且使你相信故事。
  group_stem: "Fake news is a serious problem. Because of the Internet, it is very\
    \ easy to make and share fake news. \n    Fake news is designed to fool people.\
    \ 1. 它的標題常被用來使你感到興趣，並且使你相信故事。 Then, they \nalso make you share them. So, first\
    \ take a moment to check the news before you share it with other people. The tips\
    \ \nbelow will help you fact-check news. \nIs the news from a trusted website?\
    \ \n   You can go to “About Us” to dig deeper about the website. \nDoes the piece\
    \ of news show the writer’s name? \n   If there is no writer’s name, do not believe\
    \ it. 2.它意味著我們無法找到任何跟作者有關的資訊。 \nCan the same news be found on other websites?\
    \ \n   Search engines are great tools. You can search for the news with keywords.\
    \ 3.如果你找不到任何其他關於這新聞\n的相關資訊，這新聞可能是假的。"
  tags:
    textbook: 第五冊（九上）第2次段考範圍
    labeled_by: ai
