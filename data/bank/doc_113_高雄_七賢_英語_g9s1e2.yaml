  stem: Why does the writer write the reading?
  options:
  - label: A
    content: Tell readers to eat at fast food restaurants.
  - label: B
    content: Explain how fast food companies make food look delicious.
  - label: C
    content: Teach readers how to make delicious-looking food at home.
  - label: D
    content: Point out how the fast food restaurants lie to the buyers about their
      food.
  group_stem: "It is easy to make a delicious-looking hamburger. But will this hamburger\
    \ still look delicious under very bright \nlights for six or seven hours? If someone\
    \ takes a picture or makes a video of this hamburger after the seventh hour, \n\
    will anyone want to eat it?  \n       These are the questions that fast food restaurants\
    \ worry about when they make commercials or print ads for their \nfood. Making\
    \ videos or taking photos often takes many hours. The lights are very hot when\
    \ the picture is taken. This \nmay cause the food to look not so good. Because\
    \ of this, the food on the menu you see in the fast food restaurant is \nnot edible.\
    \ \n       Let’s use the hamburger as an example. The first step to build a perfect\
    \ commercial hamburger is the bread. The \nfood designer – a person to make sure\
    \ the food looks perfect – searches through all kinds of bread until he or she\
    \ finds \nthe best one. Next, the designer carefully puts the sesame seeds on\
    \ the bread by using glue.  \n      Second, the food designer shapes a meat patty\
    \ into a perfect circle. Only the outside of the meat gets cooked. The \ndesigner\
    \ paints the outside of the meat patty with the brown food coloring.  \n     \
    \ Finally, the food designer finds the best-looking tomatoes and vegetables. One\
    \ leaf of the freshest vegetables and \none center slice of the reddest tomato\
    \ are chosen and then painted with glue to keep them look fresh. \n      So, the\
    \ next time when you see a pretty hamburger picture in a fast food restaurant,\
    \ remember that you are looking \nat glue, paint, and uncooked meat. Are you still\
    \ hungry? \n＊commercial 商業廣告    ad 廣告     sesame 芝麻   glue 膠水    patty 小肉餅   leaf\
    \ 葉"
