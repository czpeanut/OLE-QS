  group_stem: "After a lot of tests and interviews, you finally get into a good school\
    \ or get a good job. But, there is a problem: \nIt’s a long way from home. “Well,\
    \ I can take the bus or drive,” you might think. But before you decide whether\
    \ it’s \nOK to have such a long commute, it’s better to know       11.       .\
    \ \n         Having a long commute means you’ll get fewer hours of sleep, and\
    \ that’ll make you feel tired easily. You’ll also \nhave less time for friends\
    \ and family, for exercise or for a nice meal. \n         A long commute not only\
    \ eats up your time but also       12.       . Studies show that people who have\
    \ a long \ncommute get fat easily and often have neck or back problems. It’s easier\
    \ for them to have heart problems, too. \n        13     . Studies find that these\
    \ people get angry more often, feel less happy with their lives, and do worse\
    \ at work. \n         Now, does that good school or that good job still sound\
    \ good to you? \n                                                            \
    \                                                                            \
    \                  ※commute 通勤"
  tags:
    textbook: 第五冊（九上）第2次段考範圍
    labeled_by: ai
