  stem: 「納米比沙漠面積約50000平方公里，這地區被認為是世界上最古老的沙漠，乾燥和半乾燥的氣候已持續了最少8千萬年，從大西洋吹向該地區的空氣經過洋流後變得乾燥並冷卻下沉，形成乾燥氣候。從大西洋吹來的潮濕空氣經過寒冷的海面時，產生了濃霧，導致不少船隻在這個沙漠的海岸發生意外。沿骷髏海岸向北走，是惡名昭彰的多宗海難發生地點。由於沙漠慢慢填平西邊的海，一些遇事船隻現在已位於內陸50公尺處。」根據上述，納米比沙漠附近的洋流性質與下列何者相同？
