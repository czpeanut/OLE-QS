- id: doc_113_台中_大甲_自然_g8s1e2_s1_38
  section: 1
  number: 38
  type: single
  page: 4
  stem: 赫姆斯致力於以「放射性元素衰變熱」及「地球內部高溫的液態物質」所提供的熱能引起熱對流來解釋板塊移動的原因。請參考(圖二)，文中所謂的「地球內部高溫的液態物質」與「板塊」的範圍，選出最適合的配對。
  options:
  - label: A
    content: 矽與鎂；丁、戊
  - label: B
    content: 矽與鎂；丙、丁、戊
  - label: C
    content: 鐵與鎳；丁、戊
  - label: D
    content: 鐵與鎳；丙、丁、戊
  group_stem: '請參考下方(圖二)及(圖三)，閱讀下列敘述並回答 38.~40. 題：

    赫姆斯是地質科學家及放射性專家。他曾讀到一篇論文主張放射性元素衰變釋放的能量，為造山運動、岩漿生成和火山噴發等現象的能量來源。透過放射性元素衰變釋放的能量，能加熱地底深處的岩漿，岩漿上湧至(圖二)丁與戊交界帶間，經漸漸冷卻、密度變大後，再緩緩下沉回甲處，形成一個對流循環。但赫姆斯計算後發現(圖二)乙丙丁戊區產生的放射性元素衰變熱的能量，並不足以提供板塊移動和岩漿噴出地表等地質作用所需的能量。

    科學家古騰堡利用地震波資訊，推測出在地表下約 2900 公里處，存在一高溫高密度的甲區。赫姆斯依此推論此區域中應該存在高溫的液態物質。若將地球內部放射性元素衰變放出的熱能，再加上前述液態物質所提供的熱能，能使岩漿的熱對流推動板塊移動。他預測會在地球某處找到因岩漿對流上湧、分離而產生的板塊張裂和隆起處，也應該能夠找到因岩漿對流而使板塊擠壓及下沉的位置。'
