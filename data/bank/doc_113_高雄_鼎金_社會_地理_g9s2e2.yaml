  - label: C
    content: 南非-墨西哥-委內瑞拉-秘魯
  - label: D
    content: 巴西-阿根廷-南非-美國。
  group_stem: ◎依據農委會最新產銷資訊顯示，臺灣每日雞蛋需求量12萬箱(每箱200顆)，但目前每日產量僅有為11.1萬箱，受到雞蛋供應量吃緊，在2023年3月台北市蛋商公會宣布雞蛋價格調漲「產地價每台斤45.5元、批發價每台斤55元」，創下臺灣目前史上最高蛋價，接著農委會協商凍漲以穩定價格。再根據產銷分析，臺灣近期蛋價上漲甚至缺蛋情形之原因包含：(一)2022年受到全球性禽流感肆掠。(二)國際原物料上漲，連帶飼料價格上升。(三)天氣變化大，導致雞蛋產量減少。(四)蛋農做汰換老雞與換羽，導致雞蛋供應量減少。為改善蛋價調整及缺蛋情形，農委會積極祭出應對政策以調解供需失衡問題。請回答下列問題：
