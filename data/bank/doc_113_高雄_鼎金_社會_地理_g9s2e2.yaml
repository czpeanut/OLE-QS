  stem: 雞飼料主要成分以玉米為主，而臺灣長期高度依賴進口玉米製成飼料，因此容易受到國際市場價格波動而影響到蛋農的飼料成本。依據農糧署統計，臺灣2022年進口玉米總量約471公噸，而臺灣向【圖十一】中的四國進口玉米即占有98%以上總量，請你依照臺灣向這四國進口量做排列？
