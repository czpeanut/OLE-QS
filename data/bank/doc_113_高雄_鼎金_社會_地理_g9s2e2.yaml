  stem: 根據資料一判斷，請問：英國塑膠垃圾所在的海域及洋流配對，下列何者正確？
  options:
  - label: A
    content: 北海-阿拉斯加暖流
  - label: B
    content: 北海-北大西洋暖流
  - label: C
    content: 地中海-墨西哥灣流
  - label: D
    content: 地中海-拉不拉多寒流。
  group_stem: '◎請參考下列報導資料回答問題：

    資料一：英國《衛報》報導，海洋塑膠垃圾是個重大環境問題，現今海洋中，共有5兆件塑膠垃圾，常被魚類、鳥類誤食，傷害全球海洋生態。英國海域大部分的塑膠垃圾會透過如輸送帶般的洋流往北漂流到北極，汙染北極環境生態。

    資料二：夏威夷海灘首度發現「膠礫岩」(Plastiglomerate)，它是由人們燃燒塑膠廢棄物而無意間創造出來的，由海灘上融化的塑膠垃圾與沉積物、玄武岩火山石碎片、有機物碎屑融合，生成一種新的岩石，這種新物質會永久存在於地球岩層裡，將來有可能成為人類對於傷害地球所留下的地理記號。

    資料三：每年4 月22 日是世界地球日，2024 年的主題是地球VS.塑膠。塑膠危機已經成為全球公認的環境公害，2023年11 月，來自世界175 個國家，齊聚肯亞，推動《全球塑膠公約》的制定，各國多次展開協商，希望2024
    年年底能通過訂出一個具體改善的目標。'
