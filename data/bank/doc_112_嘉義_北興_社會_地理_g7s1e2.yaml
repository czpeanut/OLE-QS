  group_stem: "◎以下為某旅遊雜誌報導，請回答下列相關問題：\n\n台灣山水好風光\n    你知道太魯閣有世界上最大的大理岩峽谷嗎？從花蓮沿著中橫公路進入太魯閣國家公園，抬頭就可見到高聳壯麗的山壁，低頭可看到立霧溪蜿蜒的河谷。造就這山高谷深的天然景觀，是因為甲作用使得中央山脈越來越高，而乙作用讓立霧溪河谷越來越深。這兩股力量，如刀斧般刻鑿出深度超過1000\
    \ 公尺、長約20 公里，世界最大的大理岩峽谷！\n    你知道台灣也有海底溫泉嗎？能一邊泡溫泉，一邊享受海天一色的景致，是多麼愜意的一件事呀！這樣珍貴的海底溫泉，就位在台東外海綠島的朝日溫泉，每年吸引許多遊客前來享受泡湯之樂和日出美景。\n\
    \    自然美景何處有，不必訂機票千里迢迢飛奔國外，台灣山水好風光，等你尋幽探訪！"
