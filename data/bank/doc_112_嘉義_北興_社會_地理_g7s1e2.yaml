    至3 公分，特別設計成『會長高的橋』，採鋼箱型梁，每年可依據地形調整升高橋面，防洪又防震，預計4 年後完工，盼能使用百年。然而，鋼構材料必須從西部運到東部，運費比西部工程高1.7倍，加上東部缺工嚴重，工資也有調漲，光是材料、運費、工資就占了整體6
