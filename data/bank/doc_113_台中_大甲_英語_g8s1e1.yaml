- id: doc_113_台中_大甲_英語_g8s1e1_s3_30
  section: 3
  number: 30
  type: single
  page: 3
  stem: 30. What's the main idea of the reading?
  options:
  - label: A
    content: We should make food like a rainbow to catch everyone's eye.
  - label: B
    content: It's important to eat fruits and vegetables every day.
  - label: C
    content: We should know the roles of phytochemicals in fruits and vegetables.
  - label: D
    content: To keep healthy, people need to have fruits or vegetables with varying
      colors every day.
  group_stem: '(四)

    The Rainbow Diet: Nature''s Color Code for Good Health

    Do you eat lots of fruits and vegetables every day? If you do, you''re doing right
    thing for your health! However, it''s important to think about the kinds of fruits
    and vegetables. Based on science, “eating the rainbow” is a must-do to <u>keep
    us healthy</u>.

    So, why are the colors of the food important? That''s because of something called
    phytochemicals. They give fruits and vegetables the varying colors and health
    benefits. For example, the phytochemicals in strawberries give them a red color
    and help make them good for your skin. You can know more from the table below.

    Nutrition experts say people should eat some fruits or vegetables of each color
    every day. For example, we can have some cereal with milk, strawberries, banana,
    and blueberries for breakfast. Then, for lunch, eat some salad with lettuce, carrot,
    cabbage and corn. At dinnertime, we just need to have some mushroom with meat
    or fish.

    In a word, Mother Nature gives us a clear rule to follow to keep us healthy. So,
    make sure the colors of the food when you have meals.


    EATING THE RAINBOW

    | Phytochemical | Food |

    |---|---|

    | Red | tomato, strawberry |

    | Orange | carrot, orange |

    | Yellow | banana, corn |

    | Green | cabbage, guave, lettuce |

    | Blue or Purple | blueberry, eggplant |

    | White or Brown | cereal, mushroom |


     based on 根據 phytochemical 植化素 varying 不同的 skin 皮膚 nutrition expert 營養學專家 table
    表格 mushroom 菇類 eggplant 茄子 cereal 穀類 cabbage 高麗菜'
