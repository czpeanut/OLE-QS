  group_stem: '(二)

    Yang Gan-Ling, a tree doctor, started to treat plants after he graduated from
    college. When he was sixty-eight year old, he went to Japan to get a tree doctor''s
    license. The exam lasted for fourteen days. Mr. Yang was the only foreigner passing
    the exam.

