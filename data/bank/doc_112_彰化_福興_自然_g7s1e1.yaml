  section: 1
  number: 36
  type: single
  page: 4
  stem: '小梅看到一則網路新聞說「將銀幣放入牛奶中，可以抑制細菌生長！」她針對此新聞設計下列實驗。先將甲、乙和丙三個相同的燒杯和銀幣都消毒殺菌後，再將鮮奶開封立刻檢測細菌數，結果為「未檢測出」，接著在各燒杯中倒入鮮奶，並以保鮮膜密封，實驗條件與實驗結果如附表所示：

    |  | 甲 | 乙 | 丙 |

    | --- | --- | --- | --- |

    | 倒入牛奶量 | 300 mL | 300 mL | 300 mL |

    | 是否放入銀幣 | 否 | 是 | 否 |

    | 靜置溫度 | 室溫 | 室溫 | 冰箱冷藏 |

    | 靜置時間 | 3 小時 | 3 小時 | 3 小時 |

    | 檢測結果平均細菌數 (CFU/g) | $5.1 \times 10^{4}$ | 未檢測出 | 未檢測出 |


    1.「未檢測出」代表細菌數低於儀器能檢測出的最小值

    2. CFU 為計算細菌數的單位


    僅依據上述實驗內容與結果，下列說明何者合理？'
  options:
  - label: A
    content: 抑制細菌生長的效果，放冰箱冷藏比放銀幣好
  - label: B
    content: 室溫下放置 3 小時的牛奶，每杯牛奶細菌數達 $5.1 \times 10^{4}$ CFU
  - label: C
    content: 實驗結果支持銀幣能夠抑制細菌生長的說法
  - label: D
    content: 若將銀幣改成金幣進行相同的實驗，推測其檢測結果也是「未檢測出」
