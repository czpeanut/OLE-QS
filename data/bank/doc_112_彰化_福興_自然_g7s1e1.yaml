- id: doc_112_彰化_福興_自然_g7s1e1_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: '下列為小花依據科學方法所寫的實驗報告：

    初步觀察：放有數枚一元硬幣的水盆裡沒有孑孓生存，但沒有一元硬幣的水盆裡卻有孑孓生存。

    提出問題：為什麼放有一元硬幣的水盆中孑孓無法生存？

    提出假說：含有一元硬幣的水可能會促使孑孓死亡。

    設計實驗步驟：準備甲、乙兩組相同的水盆，皆倒入等量的純水。僅在甲組中放入 10 枚一元硬幣，乙組則無。甲、乙兩組皆放入 30 隻孑孓，每日皆提供充足的相同食物，待一週後觀察兩組孑孓的存活率。

    實驗結果如附表所示：

    | 組別 | 甲 | 乙 |

    | --- | --- | --- |

    | 實驗設計 | 純水+孑孓+一元硬幣 | 純水+孑孓 |

    | 孑孓的存活率 | 43.3% | 40.0% |

    根據上述，小花設計的實驗步驟中，下列何者為操作（變）變因？'
  options:
  - label: A
    content: 水盆
  - label: B
    content: 純水
  - label: C
    content: 孑孓
  - label: D
    content: 一元硬幣
