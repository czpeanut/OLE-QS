  group_stem: 'Mei, a reporter from CAN, is interviewing Rachel for her club activity.

    Mei: Hi Rachel! Thanks for joining us. Some people think cheerleading is just
    about waving pom-poms and smiling.

    Is that true?

    Rachel: Thanks for having me! Honestly, I hear that a lot, but it’s just not true.
    46. We do jumps, dances, and stunts, and we lift people high into the air. It
    really takes a lot of strength.

    Mei: That sounds really hard! 47.

    Rachel: It can be. If someone falls or a move goes wrong, someone can get very
    hurt. Over half of all the worst accidents in female athletes happen in cheerleading.

    Mei: What do you do to get ready for cheerleading?

    Rachel: Cheerleaders need strong arms and legs and must also have great balance
    and focus. That’s why we always practice a lot and work together to stay safe.
    At the same time, we teammates have to trust each other.

    Mei: 48.

    Rachel: For me, it is doing all the stunts while still smiling and making it look
    easy. Even when we’re nervous or tired, we have to keep going and cheer loudly
    for our team. You can’t lose focus—not for a second. That can be tough.

    Mei: If someone wants to become a cheerleader, what would you tell him or her?

    Rachel: 49. Cheerleading is fun, and it helps you stay positive and make great
    friends. But be ready to work hard and always remember—safety comes first!

     pom-pom 彩球   strength 力量   stretch 伸展'
