  stem: 58. Jason’s friend wanted to know what people thought about Jason’s look.
    He asked 100 people to guess Jason’s job by just looking at his photo. The pie
    chart shows the result. Which of the following is true?
  options:
  - label: A
    content: Most of the people think Jason is a sports player.
  - label: B
    content: Few of the people think Jason is a tattoo artist.
  - label: C
    content: Almost half of the people think Jason is a musician.
  - label: D
    content: More than half of the people think Jason is a musician.
  group_stem: 'D.

    Jason is a tall man with lots of tattoos, a nose ring, and a black leather jacket.
    He rides a loud motorcycle to work every day. Most people, when they first see
    him, think he is a rock musician, a biker, or maybe even a tattoo artist. But
    Jason is actually the head chef of a famous five-star restaurant in the city.

    When new customers visit the restaurant and see Jason in the kitchen, many are
    surprised. Some of them even ask to speak to the “real” chef, thinking there must
    be a mistake. Jason always smiles simply and continues working. “Let my food do
    the talking,” he says.

    Jason started cooking when he was ten years old. His grandmother was an excellent
    cook, and he learned by watching her in the kitchen. She taught him how to make
    traditional dishes with love and care. Later, Jason went to a cooking school and
    spent years traveling around the world. He cooked in Italy, Japan, and Mexico,
    learning different styles and flavors.

    Now, Jason creates his own recipes by mixing global tastes. Food critics love
    his creativity and often write great reviews about his dishes. Although he doesn’t
    look like the “typical chef” people imagine, people in the cooking world like
    Jason because he cooks well and always makes new and special dishes.

    Jason believes that people should be free to be themselves. “I dress the way I
    like because it makes me feel confident,” he says. “My job is to make amazing
    food. How I look has nothing to do with that.”

     tattoo 刺青  leather 皮革  traditional 傳統的 critics 評論家  typical 典型的  confident 自信'
