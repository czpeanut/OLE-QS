  group_stem: 'Are they fish?

    ● Jellyfish live in water. Some of jellyfish live in fresh water, and many of
    them live in the sea. All their bodies are nearly transparent.

    The word “fish” is in their name, but they are in fact not fish. They are animals
    without backbones.

    Most jellyfish don’t hurt people, but some are very dangerous. Stings from the
    box jellyfish, 41. , are very poisonous and can kill people in a few minutes.
    When you see jellyfish in the water, 42. away from them if you don’t know their
    species.

    ● Whales and fish share the same underwater home. They look similar, but they
    are in fact not fish, either.

    Whales give birth to live young. 43. , they take care of their babies for years.
    Fish lay hundreds of thousands of eggs, and then move on. When the eggs hatch,
    there is no one to protect the babies. Up to 99 percent of them 44. before they
    grow up.

    Whales also breathe air, unlike fish. They live underwater, but they still need
    to come to the surface to breathe. How long can a whale hold its breath? 45. Killer
    whales come to the surface every minute or so.

    But a sperm whale can hold its breath for 90 minutes.'
