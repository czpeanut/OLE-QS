- id: doc_113_新北_永和_英語_g8s2e3_s7_55
  section: 7
  number: 55
  type: single
  page: 5
  stem: 55. What is the article mainly about?
  options:
  - label: A
    content: How animals react before natural events.
  - label: B
    content: How pets and wild animals act in their daily lives.
  - label: C
    content: What people should do during a natural event.
  - label: D
    content: Why people study the weather and earthquakes.
  group_stem: 'C.

    People around the world often hear the stories about animals acting strangely
    before natural events. Some scientists believe that animals can sense changes
    earlier than humans can. For example, before an earthquake, dogs may bark a lot,
    run in circles, or try to leave the house. Cats might hide in quiet, dark places.
    In 2004, before the big tsunami in Asia, elephants in Thailand ran to higher ground
    hours before it happened. They looked scared, even though people didn’t feel anything
    unusual at that moment. On the other hand, birds and insects may also react to
    danger. Before earthquakes or storms, birds sometimes fly away suddenly. Some
    people said they saw frogs jump to the ground before the natural events. Others
    said they saw a lot of ants leaving the underground before big earthquakes.

    How do animals know? Some scientists think animals can hear low sounds or feel
    small shakes, but humans can’t. Others believe animals may react to changes in
    air pressure, temperature, or even the Earth''s magnetic field.

    Although not all animals react the same way, their actions can be a helpful warning
    sign. In some countries, researchers are now studying animal reactions to better
    predict natural events. So next time you see your pet acting very strange, don’t
    ignore it—you might be getting a message from nature.

     sense 感應  bark 吠叫  tsunami 海嘯  unusual 不正常的  react 反應   magnetic field 磁場   predict
    預測'
