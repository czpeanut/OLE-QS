  group_stem: '近城有虎暴，傷獵戶數人，不能捕。邑人請曰：「非聘徽州 唐打獵，不能除此患也。」乃遣吏持幣往。歸報唐氏選藝至精者二人，行且至。至則一老翁，鬚髮皓然，時咯咯作嗽；一童子十六七耳。大失望，姑命具食。老翁察其意不滿，啟曰：「聞此虎距城不五里，先往捕之，賜食未晚也。」遂命役導往。役至谷口，不敢行。老翁哂1曰：「我在，爾尚畏耶？」入谷將半，老翁顧童子曰：「此畜似尚睡，汝呼之醒。」童子作虎嘯聲，果自林中出，徑搏老翁。老翁手一短柄斧，虎撲至，側首讓之，虎自頂上躍過，已血流仆地。視之，自頷下至尾閭，皆觸斧裂矣。乃厚贈遣之。

