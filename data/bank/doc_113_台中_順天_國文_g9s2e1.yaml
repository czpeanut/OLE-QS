- id: doc_113_台中_順天_國文_g9s2e1_s2_37
  section: 2
  number: 37
  type: single
  page: 4
  stem: 要找一個成語來形容小說中的土匪特質，下列哪一個最適合？
  options:
  - label: A
    content: 劫富濟貧
  - label: B
    content: 濫殺無辜
  - label: C
    content: 冷酷無情
  - label: D
    content: 心狠手辣。
  group_stem: '二龍山出土匪。那天晚上，張武剛進村口，便被綁架，而且被押到了二龍山。

    進了一個山洞，張武被帶到一個微胖的大鬍子面前，綁他上來的小嘍囉王二說：「大哥，今晚沒有大的收穫，只弄到了一個。」

    大鬍子道：「老規矩，你們去給他弄點吃的。」

    張武就被帶到另一個地方，那兒有一個石頭壘砌的石桌。

    過了一會兒，王二端著一盤熱氣騰騰的魚，小六拎著一壺酒進來了。張武一看這架勢，眼淚就唰地出來了，王二說：「你這是幹什麼，這是我們大哥訂的規矩，凡是進洞的人，我們都要好好地好喝地款待。」張武看了看王二，又轉頭看了看小六一眼，才止住了淚水。

    張武顫抖著手拿起筷子，他看了看那條魚，咽了一口口水，他從沒吃過魚，不管三七二十一就從□□□上戳下一塊魚肉，放在嘴裡吃了起來，又端起酒杯咕嚕一口把酒都喝了下去，嗆得他眼淚又流了出來。

    吃過喝過，張武又被帶到大鬍子面前，王二把張武的吃喝過程詳細地向大鬍子做了彙報，大鬍子朝張武擺擺手說：「放他下山去。」

    張武就這樣被放了回去，像是做夢一般。世上哪有這樣的好事，綁他上去就是為了好吃好喝？張武想破腦袋也沒想出個所以然來。

    一年以後，張武正在茶館裡喝茶，突然發現王二和小六也在那兒。王二也看到了張武，連忙和小六走了過來，拍了拍他的肩膀：「兄弟，你也在這兒，今天你的單我們兄弟替你買了。」張武想起當年心中的疑惑，忍不住問：「你們當年把我抓進山洞難道就是為了給我一頓好吃好喝？」

    王二和小六一聽，就哈哈大笑起來，王二說：「算你小子命大，你知道魚有幾種吃法嗎？」張武搖頭。……

    原來，他們把吃魚歸納為三種吃法。第一種：吃魚眼睛的人，一定是財主家的人，吃魚吃膩了，他們就要狠狠地勒索一把；第二種：吃魚肚子上肉的人，一定是富家子弟，說明他們經常吃魚，知道那兒的肉好吃，所以就關上幾天，讓他們家人送點錢來就放了；第三種：吃魚背上肉的人，肯定是窮人家，沒吃過魚。喝酒也是這樣的，有錢人才有酒喝，才會慢慢品，沒有錢的人從沒喝過酒，才會一口把酒喝光了。所以，他們的大哥就是根據一頓飯判斷哪些是真正的窮人，哪些是真正的富人。

    （改寫自沈從文 土匪吃魚）'
