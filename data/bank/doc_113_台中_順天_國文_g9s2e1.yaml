- id: doc_113_台中_順天_國文_g9s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '好想成為一個說話幽默風趣的人！真羨慕那些不管在什麼場合都能談話自若的人！有過關於「想成為能跟任何人都聊得來」念頭的人，下一秒可能又會對自己說：「算了啦，我就不擅言詞啊」、「我就不是那種人，只能怪我天生內向、不懂炒熱氣氛」來否定自己。但健談並不是天生的，而是懂不懂得在與人相處時，讓話題延續下去。成為有趣的人的55條說話公式表示，要當一個「有趣」的人，得先從「關心對方」出發，書中舉出六條通則，讓你成為一個「好聊」的人。

    通則一：別說「我也是」。

    通則二：別只單純地回答別人的問題。

    通則三：將對方說的話延展成新話題。

    通則四：具體回答對方的問題。

    通則五：避免問出「是非題」。

    通則六：順著對方的問題，提出反問。

    （改寫自社交高手聊天術！6大通則，當一個「好聊」的人）

    根據上文，下列對話誰可能和星星最聊得來？'
