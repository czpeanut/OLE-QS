  stem: 「火耗」一詞為中國某個時期創造的名詞，因當時白銀為世界的主要貨幣，政府也改以銀兩納稅。但百姓稅額不一，且銀兩上繳中央時有種種規範，因此官府需將百姓繳納之碎銀塊，融為符合中央政府規範的大銀錠才能上繳中央。但銀在銷鎔之時會出現耗損，因此當時各州縣府收稅之際，往往會向每人多收些許銀兩以補耗損，而此多收之耗損費即為「火耗」。請問：「火耗」一詞的創造，最可能是在中國的哪個時代？
