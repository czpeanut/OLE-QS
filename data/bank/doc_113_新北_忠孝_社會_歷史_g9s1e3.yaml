  section: 1
  number: 34
  type: single
  page: 1
  stem: 巴拉爾某日午後，聽著祖父回憶以前國家輝煌的歷史。祖父說：「我們是出身於中亞的游牧民族，以成吉思汗的後裔自居，於此地創建帝國霸業，建立發達的貿易網絡，使城市蓬勃發展。歐洲早期對此帝國的香料、胡椒、靛藍和棉花有大量需求。偉大的君主阿克巴在位時，逐步擴張帝國疆域，經濟一度十分繁榮。雖然我們信奉伊斯蘭教，但阿克巴平等對待帝國內不同信仰。可惜之後帝國勢力漸衰，最後淪為歐洲國家的殖民地。」請問：巴拉爾最有可能是居住於右圖中的何處？
