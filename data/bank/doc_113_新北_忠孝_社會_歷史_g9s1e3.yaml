- id: doc_113_新北_忠孝_社會_歷史_g9s1e3_s1_40
  section: 1
  number: 40
  type: single
  page: 2
  stem: '西方的歷史上，對於上帝的觀點曾經歷過多次的轉變，以下是三個不同時期人們的看法：

    (甲)上帝以自然形式存在，讓世界按照祂所發明的律法運行，不干預或參與自然界秩序和歷史秩序。

    (乙)世界和人類都是上帝創造的，每個人的特性都是神賜，但每個人充分發揮自己特長才是對神的最高尊崇。

    (丙)上帝創造了世界和人類萬物，所有的歷史發展都在祂的計畫之中，就連時間也是由祂所主導的。

