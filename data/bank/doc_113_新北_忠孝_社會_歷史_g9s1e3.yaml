  stem: 16 世紀時有位名為瑪琳切 (La Malinche)的美洲原住民女性，擔任了科爾特斯的嚮導、顧問、翻譯，甚至於情人。在瑪琳切的幫助下，科爾特斯得以順利征服阿茲提克，瑪琳切亦被視為是叛徒、出賣者的代名詞，因此，由瑪琳切演變來的「malinchismo」便被墨西哥人拿來對「否定墨西哥本土文化，並讚揚外國文化者」的稱呼。請問：「malinchismo」應為以下何種語言？
