- id: doc_113_新北_忠孝_社會_歷史_g9s1e3_s1_30
  section: 1
  number: 30
  type: single
  page: 1
  stem: 小宇在查看歷史新聞時看到了一篇文章：「棉織工廠都是大型建築，工廠主人為了充分利用空間，各樓層都盡量壓低高度……工廠往往晝夜開工，夜間照明須燃燒大量的蠟燭，但幾乎沒有通風設備。因此，在新鮮空氣不足的情況下，工廠裡瀰漫著工人身上的汗臭味以及機油、棉絮、蠟燭等發出的惡濁氣味。這種惡劣的工作環境導致這個地區流行許多傳染病，並且造成許多人的死亡。」請問：小宇所看的歷史新聞最可能下列是何時何地的歷史新聞？
  options:
  - label: A
    content: 8 世紀的中國
  - label: B
    content: 13 世紀的義大利
  - label: C
    content: 17 世紀的墨西哥
