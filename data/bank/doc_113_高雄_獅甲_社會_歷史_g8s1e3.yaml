- id: doc_113_高雄_獅甲_社會_歷史_g8s1e3_s1_34
  section: 1
  number: 34
  type: single
  page: 2
  stem: '清末大臣李鴻章晚年曾感嘆說：「我辦了一輩子的事，練兵、海軍，都是紙糊的老虎，從未能大刀闊

    斧的辦理。」李鴻章將衰敗的清帝國形容是一間破屋，而他不過是一個用紙片裱糊破洞的工人。如果

    破洞是小風、小雨所造成的，他還可隨時修補，但是突如其來的強風豪雨，則讓他措手不及，既無法

    事先防範也無力修補。下列哪一措施與李鴻章的「紙糊工作」為同一時期的改革？'
  options:
  - label: A
    content: '成立內閣推動

      憲法'
  - label: B
    content: 成立同文館培養翻譯人才
  - label: C
    content: 廢除科舉改以學校教育培育人才
  - label: D
    content: '推翻清朝成功建立中華民

      國。'
  tags:
    chapter:
