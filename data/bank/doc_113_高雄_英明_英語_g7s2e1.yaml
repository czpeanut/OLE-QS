  section: 5
  number: 31
  type: single
  page: 3
  stem: Why can’t Wanda cook for her family picnic?
  options:
  - label: A
    content: She is too young.
  - label: B
    content: She does not like cooking.
  - label: C
    content: She is too tall.
  - label: D
    content: She is too old.
  group_stem: 'Wanda wants to take some food to the family picnic. But she is too
    young. She can’t cook.

    She cannot cook hot dogs. Dad says, “The grill is too hot.”

    She even cannot cook eggs for a hamburger. Mom says, “The stove is not for children.”

    Wanda is sad about that. But then she has a great idea!

    Wanda asks Grandma to walk with her down the road.

    They see blueberries in a bush.

    Wanda takes some beautiful berries home to wash.

    Wanda puts the berries in a beautiful box and takes it to the picnic.

    Everyone loves the berries. They say, “Wanda got a delicious treat!"


     picnic 野餐 grill 烤肉架 stove 瓦斯爐 road 路 bush 草叢 put 放置'
