    content: What to do when a typhoon comes.
  - label: B
    content: Where to buy cheap food and candles.
  - label: C
    content: Why we have enough water to use.
  - label: D
    content: How terrible the typhoon is.
  group_stem: '【題組B】

    Typhoons usually hit Taiwan during summer and fall. It often brings strong wind
    and heavy rain,

    so we don’t have to worry that we won''t have enough water to use for the coming
    months. However,

    it may also cause damage, so we have to do some things to protect ourselves.

     What to do when a typhoon comes：

    1. Store food and clean water.

    2. Move things to a safer or higher place.

    3. Prepare some candles or flashlights.

    4. Listen to the radio or watch TV to know the latest news.

    5. Don’t go out. It will be safer to stay inside.  damage 損害；store 儲存'
