  - label: C
    content: Clean the classroom.
  - label: D
    content: Be a lawyer.
  group_stem: '【題組F】

    Students in Taiwan have to go to school almost every day, but it is not easy for
    Roger to do so.

    He really doesn’t like to go to school every day. At school, his teachers make
    them do homework,

    clean the classroom, and listen to them carefully. It’s very boring to him. Besides,
    he has many tests

    every day. He hates taking tests. To help him, his teacher wants to share Simon’s
    story with him.

    Simon lives in India. He doesn’t have a chance to go to school. He has to pick
    up some things,

    like cans, bottles, or paper every day. And then he can get some money after he
    sells them. If he

    doesn’t do that, his family will not have money to buy food. In fact, Simon really
    wants to go to

