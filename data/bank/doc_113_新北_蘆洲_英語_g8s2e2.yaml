- id: doc_113_新北_蘆洲_英語_g8s2e2_s3_19
  section: 3
  number: 19
  type: single
  page: 4
  stem: A-mei is very popular with her classmates. Which may be true about her?
  options:
  - label: A
    content: She respects others and always tries to help them.
  - label: B
    content: She never talks to her teachers and classmates politely.
  - label: C
    content: She likes to say something bad about her classmates.
  - label: D
    content: She seldom treats her friends and classmates well.
  group_stem: '【題組D】

    Dear students, here are some important tips for you to learn to be a popular

    student at school. Try to keep them in mind.

    1. Treat your friends and classmates well.

    2. Talk to your teachers politely.

    3. Respect others, and don’t get mad easily.

    4. Always put yourself in others’ shoes.

    5. Never say something bad about others.

    6. Do your best to help others.

     politely 有禮貌地；respect 尊重'
