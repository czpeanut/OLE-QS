  type: single
  page: 1
  stem: "將碗置於臉盆內的水中，碗內有一顆彈珠，如圖所示。當碗及彈珠在水面上呈現靜止狀態時，\n  曉雯和洛洛分別提出自己的見解，其敘述如下：\n  曉雯：彈珠重量的反作用力，為彈珠吸引地球之力。\n\
