- id: doc_111_嘉義_北興_自然_g9s1e2_s2_41
  section: 2
  number: 41
  type: single
  page: 4
  stem: 根據文章中的活火山判斷依據，大屯火山的分類較接近何種火山？
  options:
  - label: A
    content: 休眠火山
  - label: B
    content: 死火山
  - label: C
    content: 活火山
  - label: D
    content: 以上皆非。
  group_stem: '【二】大屯火山是死還是活？以各方面的證據判斷，上一次大屯火山大規模噴發至少是在十萬年之前，但近年來的大屯火山研究結果表示，最近一次的噴發時間點可能在六千年前。科學上判斷一座火山是活火山有兩個依據，一個是一萬年前曾經噴發過，另一個則是有科學證據證明該火山有活躍岩漿庫的存在。然而岩漿庫在地底下約十幾至數十公里深，要確認其存在很不容易，所以對觀測火山研究員來說，「不知死活」的情況是很常發生的！

    近年來科學家在大屯火山上放置多種儀器來監測地殼變形、微震訊號及火山氣體成分變化等，觀測數據皆表明大屯火山有許多活火山的特徵，例如：火山地區特有的地震型態，或是大油坑、小油坑噴氣孔噴出的氣體成分，都是間接支持大屯火山是活火山的證據。

    科學家們為了要「證明」大屯火山是不是活火山，以及大屯火山有沒有即將要噴發的趨勢，近年來找到了一種可以持續監測火山岩漿庫的方式，其方式和醫療上照超音波的原理類似，利用地震波經過不同的介質跑的速度不一樣，來推測地下的岩漿庫位置。這項研究幫我們「找到了」岩漿庫大致的位置，這樣一來未來就有更好的目標和方向來持續監測大屯火山。'
