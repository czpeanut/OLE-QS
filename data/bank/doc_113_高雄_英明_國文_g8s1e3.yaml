- id: doc_113_高雄_英明_國文_g8s1e3_s2_48
  section: 2
  number: 48
  type: single
  page: 6
  stem: 偃師的作品讓周穆王大怒的原因是什麼？
  options:
  - label: A
    content: 機械人不夠像真人
  - label: B
    content: 偃師未經允許就展示作品
  - label: C
    content: 機械人對侍妾做出不禮貌的動作
  - label: D
    content: 機械人模仿人類，讓穆王感到不安。
  group_stem: "周穆王西巡狩，越崑崙，不至弇山①。反還，未及中國，道有獻工人名偃師，穆王薦之，問曰：「若有何能？」偃師曰：「臣唯命所試。然臣已有所造，願王先觀之。」穆王曰：「日以俱來，吾與若俱觀之。」越日，偃師謁見②王。王薦之曰：「若與偕來者何人邪③？」對曰：「臣之所造能倡者④。」穆王驚視之，趣步⑤俯仰，信人⑥也。巧夫，顉其頤⑦，則歌合律；捧其手，則舞應節。千變萬化，惟意所適。王以為實人也。與盛姬內御並觀之。技將終，倡者瞬其目而招王之左右侍妾。王大怒，立欲誅偃師。偃師大懾，立剖散倡者以示王，皆傅會革、木、膠、漆、白、黑、丹、青之所為。王諦料⑧之，內則肝、膽、心、肺、脾、腎、腸、胃，外則筋骨、支節、皮毛、齒髮，皆假物也，而無不畢具者。合會復如初見。王試廢其心，則口不能言；廢其肝，則目不能視；廢其腎，則足不能步。穆王始悅而歎曰：「人之巧乃可與造化者同功乎？」詔貳車載之以歸。\
    \ \n夫班輸之雲梯，墨翟之飛鳶，自謂能之極也。弟子東門賈、禽滑釐，聞偃師之巧，以告二子，二子終身不敢語藝，而時執規矩。                 \
    \                                 (《列子》〈湯問〉) \n【注釋】 \n①弇山：地名。弇，音一ㄢˇ     ②謁見：進見尊長。\
    \             ③邪：句末助詞，表疑問語氣。邪，音一ㄝˊ。 \n④倡者：表演的人。             ⑤趣步：疾走。趣，通「趨」。   ⑥信人：與真人無異。\
    \ \n⑦顉其頤：搖動他的下巴。顉，音ㄑ一ㄣ。                        ⑧諦料：仔細檢查。"
