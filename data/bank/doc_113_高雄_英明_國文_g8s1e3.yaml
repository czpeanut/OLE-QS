- id: doc_113_高雄_英明_國文_g8s1e3_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 墨子親士：「江河之水，非一源之水也；千鎰之裘，非一狐之白也。」請問這句話在強調什麼道理？
  options:
  - label: A
    content: 因地制宜，靈活應變的重要性
  - label: B
    content: 獨立自主，不依賴他人的傲骨
  - label: C
    content: 團結合作，群策群力的力量
  - label: D
