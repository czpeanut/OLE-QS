  stem: 陶淵明曾說：「盛年不重來，一日難再晨，及時當勉勵，歲月不待人。」阿良讀了之後大受激勵，決定積極奮發，不再混日子。他想抄寫其他相同意涵的句子來提醒自己，請問下列哪個句子不適合？
  options:
  - label: A
    content: 尺璧非寶，寸陰是競
  - label: B
    content: 逝者如斯夫，不舍晝夜
  - label: C
    content: 莫等閒，白了少年頭
  - label: D
    content: 浮生若夢，為歡幾何。
