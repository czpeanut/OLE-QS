- id: doc_113_高雄_英明_國文_g8s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 1
  stem: 胡適先生曾以「不做無益事，一日當三日，人活五十歲，我活百五十」的生活哲學來自勉。小傑很崇拜胡適，他把這句話當成座右銘，時時提醒自己。請問小傑應該奉行下列哪一種生活態度？
  options:
  - label: A
    content: 隨遇而安，享受當下
  - label: B
    content: 善用時間，追求高效
  - label: C
    content: 人生苦短，盡情揮霍
  - label: D
    content: 知足常樂，淡泊無求。
  tags:
