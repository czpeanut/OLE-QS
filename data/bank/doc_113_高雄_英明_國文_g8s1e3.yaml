  section: 1
  number: 14
  type: single
  page: 1
  stem: 下列關於說話者的語氣及所透露的態度或心境，何者正確？
  options:
  - label: A
    content: 「民安所錯其手足？唯陛下察之。」 ──以反詰、期望語氣作結，表現出張釋之對漢文帝的無奈情緒
  - label: B
    content: 「縣人來，聞蹕，匿橋下。久之，以為行已過，即出，見乘輿車騎即走耳。」──表現縣人從容不迫、抗顏直辯的態度
  - label: C
    content: 「且方其時，上使立誅之則已」──表現出張釋之對縣人輕視、不屑，視其命如草芥的態度
  - label: D
    content: 「今既下廷尉，廷尉，天下之平也，一傾而天下用法皆為輕重」──刻畫出張釋之據理力爭的態度及剛正不阿的性格。
  lesson_raw:
    title: 張釋之執法
