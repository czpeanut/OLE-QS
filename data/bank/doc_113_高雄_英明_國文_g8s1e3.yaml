- id: doc_113_高雄_英明_國文_g8s1e3_s2_46
  section: 2
  number: 46
  type: single
  page: 6
  stem: 下列說明何者正確？
  options:
  - label: A
    content: 智伯為報答豫讓，甘為刺客
  - label: B
    content: 豫讓因智伯的欣賞而打扮自己
  - label: C
    content: 豫讓為報智伯知遇之恩，死亦無悔
  - label: D
    content: 豫讓報仇不成，故隱居山林，不問世事。
  group_stem: "豫讓者，晉人也，故嘗事范氏及中行氏，而無所知名。去而事智伯，智伯甚尊寵之。及智伯伐趙襄子，趙襄子與韓、魏合謀滅智伯，滅智伯之後而三分其地。趙襄子最怨智伯，漆①其頭以為飲器。豫讓遁逃山中，曰：「嗟乎！士為知己者死，女為說②己者容。今智伯知我，我必為報讎③而死，以報智伯，則吾魂魄不愧矣。」乃變名姓為刑人④，入宮塗廁，中挾匕首，欲以刺襄子。襄子如廁，心動，執問塗廁之刑人，則豫讓，內持刀兵，曰：「欲為智伯報仇！」\
    \ \n    左右欲誅之。襄子曰：「彼義人也，吾謹避之耳。且智伯亡無後，而其臣欲為報仇，此天下之賢人也。」卒醳⑤去之。 \n(司馬遷《史記》〈刺客列傳〉)\
    \ \n【注釋】 \n①漆：指塗上顏料。    ②說：通「悅」。   ③讎：通「仇」。    ④刑人：指受了宮刑的人。   ⑤醳：通「釋」。"
