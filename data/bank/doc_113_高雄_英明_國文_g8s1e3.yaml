  section: 2
  number: 36
  type: single
  page: 3
  stem: 關於《世說新語》此則故事的說明，何者正確？
  options:
  - label: A
    content: 這是一場謝安與自己子女的聚會場合
  - label: B
    content: 以「柳絮」形容雪比用「鹽」形容更具美感
  - label: C
    content: 「公大笑」顯示謝安對兩者說法都嗤之以鼻
  - label: D
    content: 兄女(謝道韞)謙稱自己所說的不如兄子(謝朗)。
  group_stem: "謝太傅寒雪日內集，與兒女講論文義。俄而雪驟，公欣然曰：「白雪紛紛何所似？」兄子胡兒曰：「撒鹽空中差可擬。」兄女曰︰「未若柳絮因風起。」公大笑樂。即公大兄無奕女，左將軍王凝之妻也。\
    \ \n                                  (《世說新語‧言語》〈詠絮之才〉)"
