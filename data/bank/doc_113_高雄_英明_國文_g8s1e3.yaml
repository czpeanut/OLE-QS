- id: doc_113_高雄_英明_國文_g8s1e3_s2_40
  section: 2
  number: 40
  type: single
  page: 4
  stem: 文中「未來將出現『會寫作的人』和『不會寫作的人』的明顯分化」，這句話的意思，最可能是下列何者？
  options:
  - label: A
    content: 依賴 AI 寫作的人將逐漸失去寫作能力
  - label: B
    content: AI 將促進所有人的寫作能力，使社會更具平等性
  - label: C
    content: 只有少數專業人士需要寫作，大多數人不再需要此技能
  - label: D
    content: 社會將不再重視寫作技能，更多人專注於其他領域的創新。
  group_stem: "隨著科技的進步，我們正在目睹一項長久以來被視為基本的技能逐漸被淡化——寫作。根據美國技術作家 Paul Graham 的觀察，他預測：未來會形成「會寫作」和「不會寫作」的社會。\
    \ \n要掌握寫作的能力，並非只需學會字句的拼接，還需要具備清晰的邏輯思維。寫作之所以讓許多人望而卻步，正是因為「清晰思考」這件事本身就極為困難。寫作的難度在於：要求人們對自己的思考過程進行一層一層的剖析、提煉，直到形成邏輯通順的表達。\
    \ \nGraham 指出，即便在學術界，許多高階職位人員都面臨寫作的挑戰，並且常因無法面對這種壓力而選擇抄襲。這些壓力反映了即便是經過多年學習和訓練的專家，仍然對寫作心生畏懼，因為寫作的難度並未隨著知識的增加而降低。隨著社會進步，我們不僅沒有減少對寫作的需求，反而在許多領域中要求越來越高。\
    \ \n無論是在學術、職場或是社交媒體上，寫作都是一種溝通和表達的重要工具。然而，隨著 AI 生成技術的興起，越來越多人可以依賴人工智能完成本該親自撰寫的文本，這導致人們對寫作的壓力大大減少。這種壓力的釋放雖然帶來便利，卻也埋下了某種隱患。\
    \ \nGraham 認為，未來將出現「會寫作的人」和「不會寫作的人」的明顯分化，而兩者之間的中間地帶將逐漸消失。這意味著，從前還能勉強寫些「尚可」文本的那群人將逐漸依賴\
    \ AI，直到失去寫作能力。 \n美國電腦科學家 Leslie Lamport 曾說：「如果你沒有在寫作，那麼你只是以為自己在思考。」這句話點出了寫作和思考的內在關聯。寫作並非只是紀錄已經形成的思維，而是一個發現、探索、澄清思維的過程。\
    \ \n當寫作逐漸被取代，最終受影響的將不僅僅是寫作本身，而是我們的思考能力。Graham 擔心，在寫作被大部分人放棄的未來，社會將分化成「會思考的人」和「不會思考的人」。這樣的社會不僅在智力層面上變得兩極化，甚至可能會逐漸走向單一的思維模式。\
    \ \n技術取代人類技能並非新鮮事。黑鐵匠隨著工業革命的到來逐漸消失，體力勞動者的強壯身體也在現代辦公室生活中變得罕見。如今，許多人透過健身來維持身體健康和力量，而在寫作逐漸成為少數人專屬技能的未來，或許同樣會有一部分人選擇「練習思考」來保持自己的智力水準。然而，與體力不同的是，思考是一種更為細膩和深刻的技能。若僅依賴「選擇」來維持寫作和思考能力，整個社會的整體思維水平可能會出現倒退。這種倒退不僅會影響個人的知識成長，也會限制人們的溝通能力和理解力，最終影響到社會整體的創新和發展。\
    \ \nGraham 的觀點為我們敲響了警鐘。隨著 AI 的發展，許多曾被視為基本的技能逐漸被取代，這也促使我們重新審視自己在技術時代的價值所在。寫作能力的下降可能會帶來的社會風險，提醒我們有意識地保持、培養這項技能，以維持自我思考的獨立性和深度。\
    \ \n改寫自 (鋼哥〈ChatGPT 奪走的不是寫作的能力〉)"
