- id: doc_113_高雄_英明_國文_g8s1e3_s2_37
  section: 2
  number: 37
  type: single
  page: 3
  stem: 〈絕妙好辭〉一文中，以下列何句形象化曹操與楊脩二人才氣的差距？
  options:
  - label: A
    content: 魏武嘗過曹娥碑下，楊脩從
  - label: B
    content: 魏武謂脩曰：「解不？」答曰：「解。」
  - label: C
    content: 魏武曰：「卿未可言，待我思之。」
  - label: D
    content: 乃嘆曰：「我才不及卿，乃覺三十里！」
  group_stem: "魏武嘗過曹娥碑下，楊脩從。碑背上見題作「黃絹幼婦外孫齏臼①」八字。魏武謂脩曰：「解不？」答曰：「解。」魏武曰：「卿未可言，待我思之。」\
    \ \n行三十里，魏武乃曰：「吾已得。」令脩別記所知。脩曰：「黃絹，色絲也，於字為『絕』；幼婦，少女也，於字為『妙』；外孫，女子也，於字為『好』；齏臼，受辛也，於字為『辤』。所謂『絕妙好辤②』也。」\
    \ \n魏武亦記之，與脩同。乃嘆曰：「我才不及卿，乃覺三十里。」  \n(《世說新語．捷悟》〈絕妙好辭〉) \n【注釋】  ①齏臼：用來搗碎辛辣食物的石臼。\
    \    ②辤：「辭」的異體字。"
  lesson_raw:
    number: 自學一
    title: 絕妙好辭
    basis: 選自《世說新語》絕妙好辭
  tags:
