  section: 1
  number: 19
  type: single
  page: 2
  stem: 「在一個空無一物的箱子裡，我們最初可以放進一些大石頭，等到再也放不進大石頭時，餘下的空隙，我們可放進不少小石頭；當小石頭已放滿時，還可容納許多細沙；等到細沙也把箱子裡所有的空間都填實了，我們仍可再注入不少清水……。」這段話在說明什麼道理？
  options:
  - label: A
    content: 合理規畫並善用零碎時間
  - label: B
    content: 做事應講究先來後到，方能井然有序
  - label: C
    content: 不斷追求才能達到目標
  - label: D
    content: 事物總有其極限，不可強求。
