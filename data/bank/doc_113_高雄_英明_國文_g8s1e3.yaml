- id: doc_113_高雄_英明_國文_g8s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 文言文中，凡是句子可以譯為「被……」，稱作「被動句」。如張釋之執法：「今法如此而更重之，是法不信『於』民也」即是。下列何者不是被動句型？
