  section: 1
  number: 1
  type: single
  page: 1
  stem: 下列各選項中，哪一個敘述是錯誤的？
  options:
  - label: A
    content: 在$\triangle ABC$中，若$AB > BC$，則$\angle A > \angle C$。
  - label: B
    content: 在$\triangle ABC$中，若$\angle A > \angle B$，則$BC > AC$。
  - label: C
    content: 三角形中任意二邊長的和大於第三邊，任二邊長的差小於第三邊。
  - label: D
    content: 若三角形兩邊長的平方和等於第三邊長的平方，則這個三角形必為直角三角形。
