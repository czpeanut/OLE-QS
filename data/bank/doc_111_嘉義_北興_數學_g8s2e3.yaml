    content: 「兩組對角分別相等」的四邊形一定是平行四邊形。
  - label: B
    content: 「有一組對邊平行，另一組對邊相等」的四邊形一定是平行四邊形。
  - label: C
    content: 「兩組對邊分別相等」的四邊形一定是平行四邊形。
  - label: D
    content: 「兩條對角線互相平分」的四邊形一定是平行四邊形。
