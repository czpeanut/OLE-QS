  group_stem: '太史公曰：「《傳》曰：『其身正，不令而行；其身不正，雖令不從。』其李將軍之謂也？余睹李將軍悛悛➀如鄙人，口不能道辭。及死之日，天下知與不知，皆為盡哀。彼其忠實心誠信於士大夫也？諺曰：『桃李不言，下自成蹊』。此言雖小，可以諭大也。」

