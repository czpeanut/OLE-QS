  section: 4
  number: 1
  type: single
  page: 4
  stem: 文中畫雙線處，何者不是作者的主觀感受？
  options:
  - label: A
    content: ➀
  - label: B
    content: ➁
  - label: C
    content: ➂
  - label: D
    content: ➃
  group_stem: "➀在某些晴朗的黃昏，醫院外的湖邊常常聚集著還能坐輪椅出來的老人。在這治療都已結束，卻還不必急著回病房的時刻，常常可以看到湖畔輪椅排排坐晒太陽，上面癱著面無表情的病人，像是晴天時從櫥櫃深處拖出來晾的冬天厚棉被，散發著霉味與溼氣，他們身後母親般的外籍看護則把握一天中難得的悠閒時光，與同鄉用流暢的母語談笑，完全不似在病房時的那種緊張羞怯。\n\
    \    偶爾下班時經過湖邊，黃昏金黃色的靜謐時光，➁老人們吊著點滴，或插鼻胃管，或做氣切，在湖畔的微風裡彷彿一排陽臺上安靜晒太陽的盆栽。他們的外籍看護就站在身後聊天，陽光斜斜打在她們臉上，深邃五官映出堅毅的影子，而她們臉上線條和緩，這是一天之中，難得不用拍痰、灌食或更換尿布的悠閒時光。\n\
    \    ➂她們喉中也卡著痰。她們遠渡異國，含著那塊濃痰，口音混濁地學習陌生的語言，手忙腳亂做醫師與家屬之間的橋梁，每天在醫院裡替另一個痰聲隆隆的老人拍背，過著呼吸少少新鮮空氣的生活。\n\
    \    卻沒有人想要幫她們化痰。\n    在這間醫學知識建構出來無比繁複的醫院裡，病床旁邊的醫師與家屬來去匆匆，留下床上的病人與他們的外籍看護，默默地在剩餘的緩慢時光中拍痰。➃比起醫護人員，只會拍痰的她們懂得最少，卻也懂得最多。\n\
    \                                                             (節錄自劉峻豪〈拍痰〉)"
