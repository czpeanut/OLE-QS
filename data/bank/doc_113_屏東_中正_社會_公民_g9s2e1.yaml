  page: 1
  stem: '| 專家提醒手機用戶常用的Wi-Fi「自動加入」功能，成為駭客竊取個資的破口。連上駭客設置的假冒熱點，不僅帳號密碼、信用卡等敏感資料外洩，手機還有可能被植入惡意軟體，即使斷線後駭客仍能持續竊取用戶資料。
    | 國際組織呼籲停止使用「殺豬盤」一詞，建議改以「戀愛詐騙」這類藉由虛假戀愛關係，誘使受害者投資假加密貨幣計畫的網路詐欺。「殺豬盤」一詞不僅貶低受害者尊嚴，更使人因感到羞恥而不願尋求協助或報案。
    | 科技日新月異，網際網路發展方興未艾，現今無遠弗屆的社群媒體及通訊軟體已成為資訊傳播的重要載具。然而，各種資訊的消息來源未必正確，發布者往往未盡查證義務，就直接散播，必須負起法律責任。
    |


    以上是陳大中公民報告的內容，下列哪一個最可能是大中的報告主題？'
