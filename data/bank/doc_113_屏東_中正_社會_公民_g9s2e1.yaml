  group_stem: "全球化的經濟體系帶來許多便利，卻使我們為這些「遠道而來」的食物付出層層廣告費、行銷費及運費，然而實際投入生產的農民和勞工，並無法從中獲得合理的報酬。以咖啡為例，多數的咖啡小農，每磅咖啡只能以0.25\
