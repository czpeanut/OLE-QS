  group_stem: '(A)

    At 6:30 every morning, Megan Wu, an 18-year-old girl, is already at work when
    all of her classmates are still sleeping in bed. She helps her parents run their
    shop, Jia-Ba, in the small town of Tainan. Megan’s grandparents started the store
    in 1985, and then pass it down to her parents. Over the years, it is becoming
    a place for the neighbors to enjoy not only delicious breakfast but also a friendly
    space to kill time.


    Megan has many jobs to do in the shop. She helps not only prepare meals but also
    take orders. On weekends, she also needs to pack meals for take-out. Sometimes
    she sees someone smile after taking a bite, and that makes her feel proud. Although
    she is always busy working, she enjoys herself seeing customers eating and talking
    happily in the shop.


    Megan earns NT 150 dollars an hour. If she works through the summer to make about
    $30,000, she will use the money to buy a new laptop. Although she likes making
    money, she misses the time with friends “My friends go to movies or play online
    games on weekends, but I’m usually working,” she said. “Working with my family
    is special—not because it’s easy, but because it means a lot to me. I do, I learn,
    and I enjoy. Although the job bothers me sometimes, I truly enjoy being with my
    family.”'
