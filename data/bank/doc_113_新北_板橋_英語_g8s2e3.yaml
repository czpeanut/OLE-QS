  group_stem: '(B)

    This ancient city is one of the most famous places in the world. People there
    built it in the high mountains of South America around 600 years ago. Long ago,
    people lived there, but they later left. Nobody found it until an American, Hiram
    Bingham, revealed it in 1911.


    Why is the city so special? It is high in the mountains, so you can enjoy wonderful
    views all around. Although the large stone houses were built without cement, they
    still stand strong after hundreds of years. What’s more, there are special plants
    and animals, like llamas and orchids. Because of its beautiful views and special
    buildings, the city became one of the New Seven Wonders of the World in 2007.


    Today, this ancient city catches the eye of the people all over the world. However,
    the more people visit the city, the more damage it will get. They sometimes leave
    trash or walk in places they should not. Besides, Visitors may touch or sit on
    the ancient stones. The old city may be in danger. The city cannot keep itself
    safe, so people must teach themselves to be kind to the environment. If we treat
    it kindly, it can still last in the future.

