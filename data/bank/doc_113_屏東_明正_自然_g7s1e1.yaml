- id: doc_113_屏東_明正_自然_g7s1e1_s1_48
  section: 1
  number: 48
  type: single
  page: 4
  stem: 本實驗中「倒入牛奶量」為甚麼變因？
  options:
  - label: A
    content: 控制變因
  - label: B
    content: 操作變因
  - label: C
    content: 應變變因
  - label: D
    content: 隨機變因。
  group_stem: '題組五：籤彗看到一則網路新聞說「將銀幣放入牛奶中，可以抑制細菌生長！」她針對此新聞設計下列實驗。先將甲、乙和丙三個相同的燒杯和銀幣都消毒殺菌後，再將鮮奶開封立刻檢測細菌數，結果為「未檢測出」，接著在各燒杯中倒入鮮奶，並以保鮮膜密封，實驗條件與實驗結果如表所示：


    | | 甲 | 乙 | 丙 |

    | :--- | :--- | :--- | :--- |

    | 倒入牛奶量 | 300mL | 300mL | 300mL |

    | 是否放入銀幣 | 否 | 是 | 否 |

    | 靜置溫度 | 室溫 | 室溫 | 冰箱冷藏 |

    | 靜置時間 | 3 小時 | 3 小時 | 3 小時 |

    | 檢測結果<br>平均細菌數(CFU／g) | $5.1 \times 10^{4}$ | 未檢測出 | 未檢測出 |


    1.「未檢測出」，代表細菌數低於儀器能檢測出的最小值。

    2. CFU 為計算細菌數的單位'
