  type: single
  page: 1
  stem: '桌上有三種無色溶液甲、乙、丙，已知其中有酸性溶液、鹼性溶液及酚酞指示劑。小雯做了測試如下表，則可推測乙溶液應為下列何者？ (3-3 習)


