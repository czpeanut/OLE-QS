- id: doc_113_新北_江翠_自然_g8s2e2_s1_38
  section: 1
  number: 38
  type: single
  page: 6
  stem: '已知催化劑能夠加快化學反應速率，本身會參與反應，卻不是反應物，在反應最後會全身而退。

    小翠：「雙氧水加入二氧化錳後，生成物中有氧氣、水及二氧化錳，由於水及二氧化錳反應前後都存在，因此水及二氧化錳為催化劑。」

    小江：「有一兩步驟的化學反應式如下：① A + B → AB 及 ② AB + C → BC+ A ，總反應為B + C → BC，此時A 為催化劑。」

    小翠及小江兩人針對催化劑的討論，何者正確？'
  options:
  - label: A
    content: 兩人的說法皆正確
  - label: B
    content: 小翠的說法正確
  - label: C
    content: 小江的說法正確
  - label: D
    content: 兩人的說法皆不正確。
  group_stem: '【題組】反應粒子必須產生有效碰撞才能發生反應，也就是反應粒子的碰撞須符合正確方向，且碰撞需有足夠的能量。而在1889 年阿瑞尼士提出活化能的概念，用來表示產生化學反應時所需要的最小能量。在反應過程中，提高溫度可使分子能量提高，使得超越活化能的分子數量增加，進而使反應速率上升。而加入催化劑，則可使反應過程中所需活化能降低，使反應速率上升。

