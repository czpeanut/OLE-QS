  type: single
  page: 1
  stem: '室溫下，小綺分別配製甲、乙、丙、丁四杯濃度皆為0.2M 的水溶液，其溶質種類與說明，如下表所示。這四杯水溶液pH 值的大小關係，應為下列何者？ (3-3)


