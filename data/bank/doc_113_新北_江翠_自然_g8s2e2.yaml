- id: doc_113_新北_江翠_自然_g8s2e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 小傑發現靜置一段時間後，錐形瓶內不再產生氣泡。要解釋此現象，請問下列哪一說法最合理？
  options:
  - label: A
    content: 錐形瓶內反應均已達到平衡狀態
  - label: B
    content: 貝殼中$\mathrm{CaCO}_{3}$ 的成分已完全用盡
  - label: C
    content: 錐形瓶內的$\mathrm{CO}_{2}$全部溶解在溶液中
  - label: D
    content: 錐形瓶中化學反應已停止。
  group_stem: '【題組】小傑在課堂中進行實驗，將貝殼與稀鹽酸放入錐形瓶中，並在瓶口以橡皮塞密封，如右圖。

