  stem: 關於變色鏡片的原理，何者錯誤？
  options:
  - label: A
    content: 此反應需能量的參與
  - label: B
    content: 照光可以加速銀離子的形成
  - label: C
    content: 光線減弱可以加速氯化銀的形成
  - label: D
    content: 照光可以加速銀原子的形成。
  group_stem: '【題組】上戶外課的時候，班上突然出現幾位戴著墨鏡的同學。然而，等到下一堂課回到到教室內上課時，同學的眼鏡又從原本的墨鏡鏡片變回原本透明的樣子。原來，同學戴的是現在很流行的「變色眼鏡」，目的是抵擋部分光線，以達到保護眼睛的效果。變色眼鏡的反應是將氯化銀置於鏡片中。當鏡片受到陽光照射時，氯化銀會分解，變成許多銀灰色的銀元素微粒，這些可見的粒子均勻地分布在玻璃中，使得玻璃鏡片因此顯得顏色變深，進而阻擋了光線的通行，變成了看似墨鏡狀態的眼鏡；回到室內時，因為光線減弱，銀灰色的銀元素微粒開始轉變成氯化銀，因此變色鏡片由深色恢復成透明的顏色。而運用這種反應原理所產生的顏色改變，稱為「光致變色」。光致變色除了眼鏡以外，還可以應用在一些旅館、飯店和辦公大樓外，裝上變色玻璃，讓室內能維持舒服的光線。

    請根據上文回答下列問題39～40：(4-2)'
