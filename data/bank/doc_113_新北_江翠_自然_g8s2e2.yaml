    步驟四、搖一搖，使其混合均勻。

    步驟五、會有「爆」的聲音出來，且撐破夾鏈袋。

    檸檬酸和小蘇打的反應式如下：$\mathrm{C}_{6}\mathrm{H}_{8}\mathrm{O}_{7}＋3\mathrm{NaHCO}_{3}
    \rightarrow 3\mathrm{H}_{2}\mathrm{O}＋3\mathrm{CO}_{2}＋\mathrm{Na}_{3}\mathrm{C}_{6}\mathrm{H}_{5}\mathrm{O}_{7}$

    檸檬酸 ＋ 小蘇打 $\rightarrow$ 水＋二氧化碳＋檸檬酸鈉

