  stem: '小安對甲、乙、丙、丁四瓶標籤汙損的透明溶液進行測試，結果如下表，已知四瓶溶液為石灰水、氫氧化鈉水溶液、濃硫酸及純醋酸，請按甲、乙、丙、丁的順序，推測四瓶分別為何溶液？
