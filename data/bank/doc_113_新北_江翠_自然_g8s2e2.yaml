  section: 1
  number: 37
  type: single
  page: 6
  stem: '請從碰撞理論觀點出發，以下產生化學反應發生的條件哪些正確？

    甲：「粒子間碰撞角度正確。」

    乙：「超過最低化學反應時所需的適當能量大小。」

    丙：「提高溫度使活化能降低，使參與反應的物質提升。」'
  options:
  - label: A
    content: 甲、乙、丙
  - label: B
    content: 甲、乙
  - label: C
    content: 乙、丙
  - label: D
    content: 甲。
  group_stem: '【題組】反應粒子必須產生有效碰撞才能發生反應，也就是反應粒子的碰撞須符合正確方向，且碰撞需有足夠的能量。而在1889 年阿瑞尼士提出活化能的概念，用來表示產生化學反應時所需要的最小能量。在反應過程中，提高溫度可使分子能量提高，使得超越活化能的分子數量增加，進而使反應速率上升。而加入催化劑，則可使反應過程中所需活化能降低，使反應速率上升。

    請根據上文回答下列問題37～38：(4-1)'
