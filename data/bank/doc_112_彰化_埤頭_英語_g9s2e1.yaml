- id: doc_112_彰化_埤頭_英語_g9s2e1_s3_41
  section: 3
  number: 41
  type: single
  page: 2
  stem: What is the main concern expressed by Tyler Perry in the reading?
  options:
  - label: A
    content: His plans for a studio expansion.
  - label: B
    content: The influence of AI on jobs in the movie industry.
  - label: C
    content: The development of OpenAI's text-to-video tool, Sora.
  - label: D
    content: The need for rules in the film industry.
  group_stem: 'I.

    Hollywood producer and actor Tyler Perry expressed concern over the potential
    job losses in the film industry due to artificial intelligence (AI). He shared
    a personal experience illustrating this concern, explaining that he had postponed
    an $800 million studio expansion project to assess the impact of AI. Perry emphasized
    the need for regulations to safeguard against AI''s effects, stating, "There''s
    got to be some sort of regulations in order to protect us from AI. If not, I just
    don''t see how we survive."

    Perry mentioned OpenAI''s text-to-video tool, Sora, as a specific example that
    influenced his decision to delay his studio project. Sora, named after the Japanese
    word for sky, generates videos up to one minute in length based on user prompts
    or photos, showing its creative potential. While Perry admitted AI''s usefulness
    in filmmaking, he remained concerned about its potential to displace jobs across
    the industry, including actors and editors. He said, "It makes me worry so much
    about all of the people in the business... I''m thinking this will touch every
    corner of our industry."

    concern 憂慮 postpone 延遲 assess 評估 prompt 提示

    regulation 規章 displace 取代'
