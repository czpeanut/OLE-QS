  section: 3
  number: 46
  type: single
  page: 3
  stem: What is the main idea of the passage?
  options:
  - label: A
    content: Climbers must bring their own poo back to Base Camp.
  - label: B
    content: Pollution on Mt. Everest is hurting the environment.
  - label: C
    content: Climbers are getting sick from seeing human poo on rocks.
  - label: D
    content: Mt. Everest has become a popular place.
  group_stem: 'III.

    There is a new rule for climbers on Mount Everest. They must bring their poo back
    to Base Camp. More people are climbing Everest, so there is too much human waste.
    Mingma Sherpa, a local official, said, "Our mountains smell bad now." He said
    climbers are getting sick from seeing human poo on rocks. This is not good for
    the mountain''s reputation. The new rule says climbers must buy a special bag
    for their poo. They can throw the bag away at Base Camp. Workers will check the
    bags.

    There is a big problem with waste on Everest. Many climbers leave equipment and
    trash on the mountain. Thousands of oxygen cans are left there. An environmental
    group said there is about three tons of human poo on Everest. It does not disappear
    because it freezes. The India Today website said the poo bags will help. They
    said this, along with cleaning efforts, will make Everest clean again. The bags
    will also protect climbers and the environment.

    reputation 名聲'
