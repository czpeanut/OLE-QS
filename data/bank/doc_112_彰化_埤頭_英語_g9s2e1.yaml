- id: doc_112_彰化_埤頭_英語_g9s2e1_s3_44
  section: 3
  number: 44
  type: single
  page: 3
  stem: According to the reading, why are Indonesia's rainforests important?
  options:
  - label: A
    content: They are home to many animals.
  - label: B
    content: They are near the equator.
  - label: C
    content: They are used for building materials.
  - label: D
    content: They are disappearing fast.
  group_stem: 'II

    Indonesia is the world''s largest island country in Southeast Asia. Because it''s
    near the equator, Indonesia has many rainforests and different plants and animals.

    Indonesia''s rainforests are very important. They are home to many animals, like
    Sumatran tigers, orangutans, rhinos, and Pygmy elephants. The rainforests also
    help with water, prevent flooding, and stop soil erosion and landslides. They
    also take in carbon dioxide, which helps with climate change. People also use
    the rainforests for building materials and food.

    However, Indonesia''s rainforests are disappearing fast because of the increasing
    need for palm oil. Palm oil is a key part in many foods and cleaning products.
    It''s also a very popular vegetable oil, worth 800 billion US dollars per year.
    People are cutting down the rainforests to grow palm oil trees instead.

    Many animals can''t live in palm oil farm. There are now many endangered animals
    in Indonesia, like orangutans. Even though there was a two-year break from cutting
    down the rainforests, it didn''t help much.

    We can help protect Indonesia''s rainforests. We can tell our friends and family
    about them, recycle, use less energy, and buy "eco-friendly" products. Rainforests
    are like the earth''s air filters, so we need to take care of them together.

    soil erosion 土壤侵襲 carbon dioxide 二氧化碳

    endangered 瀕臨絕種的 filter 過濾器'
