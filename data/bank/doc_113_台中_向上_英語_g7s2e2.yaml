  group_stem: 'Sean makes sweet snacks at 3 every Saturday afternoon. This week, he
    wants to make butter cookies.


    Butter cookies

    What do you need?

    teaspoon  2 eggs

    big bowl  $2\frac{1}{2}$ cups of flour

    cookie cutters  1 teaspoon of baking powder

    cup  100 grams of butter

    roll  1 cup of sugar


    What do you do?

    1. In a bowl, mix the butter with the sugar.

    2. Add the eggs, the flour and the baking powder.

    3. Make a ball and put it in the fridge for 1 hour.

    4. Roll out the dough, and then use cookie cutters to make the shape.

    5. Bake them for 10-15 minutes.

    6. Let them cool down.


     teaspoon 茶匙 cookie cutter 餅乾切割模 roll 擀麵棍 baking powder 發粉 gram 公克 fridge 冰箱
    dough 麵團 shape 形狀 bake 烤 cool down 降溫'
