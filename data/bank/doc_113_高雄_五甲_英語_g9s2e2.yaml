  group_stem: '【題組四】 (203 words)


    # A Story about Leo


    Leo and his family had to leave their home,

    Because the war had destroyed their town,

    Turning everything into ashes,

    Nothing left.

    They walked for days to reach a safer place,

    Hoping to find shelter in another country.

    The trip was long and difficult,

    But they believed they could build a new life

    Far away from the war.

    Halfway to the border,

    Leo’s father went ahead to find a safe road.

    However,

    When Leo and his family arrived at the meeting place,

    His father was not there,

    Which filled their hearts with fear and sadness.

    Leo, the eldest son,

    Decided to find food and water for his mother and sister.

    One day, while searching in the streets,

    He met a man named Victor,

    Who agreed to give him a job in a market,

    So he followed him to the place.

    When he finally arrived,

    He saw no market.

    He was then locked in a dark house

    With other boys,

    Where they were made to carry heavy stones all day.

