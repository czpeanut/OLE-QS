  group_stem: '【題組二】 (188 words)


    # Self-driving Cars


    Mr. Garfield likes to drive, but he doesn’t like to sit in traffic. Self-driving
    cars interest him a lot. He is talking to everyone about them. Here are some opinions(觀點)
    from his family.


    Rob: When I’m tired, I avoid driving. When the weather is bad, I don’t like to
    drive, either. A self-driving car would be great. You can go to places at the
    push of a button.


    Taylor: Self-driving cars sound scary to me. Don’t trust a self-driving car to
    avoid an accident. I like to control my car myself.


    Mr. Garfield’s dad: I think they are a great idea. Now many seniors like me have
    to give up their cars because they’re no longer safe drivers. Blind people could
    use them, too.


    Alex: I hear they don’t have steering wheels. It would be strange. If I want someone
    to drive me, I’ll take a bus. I’m not ready to let a computer drive me around
    just yet!


    Linda: Buses stop many places. A self-driving car would just take you where you
    want to go. Besides, self-driving cars have driven over 1 million miles with only
    minor accidents.


    📖 steering wheels 方向盤 minor 輕微的'
