    # A HISTORY LESSON ON THE PANDEMIC


    2020.10.29


    Since the Covid-19 pandemic started, people have begun “social distancing”— keeping
    a safe space between you and anyone you don’t live with. Though it has been a
    very popular topic this year, social distancing __44.__. In fact, it was widely
    used in the U.S. in the flu pandemic in 1918. But how well did it work? The Americans’
    experience can tell us whether it really saved lives.


    From the picture, we can see that __45.__ started social distancing earlier than
    the other three cities. This helped the city keep the number of deaths down. Besides
    taking early action, keeping the action long enough was also important in fighting
    the pandemic. The picture shows that Portland and Denver did well in the first
    few weeks. However, both cities __46.__, and the numbers of deaths climbed again.
    But there was one thing Portland did right. The city used several ways of social
