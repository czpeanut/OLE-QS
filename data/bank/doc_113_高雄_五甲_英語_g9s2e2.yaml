  stem: What is the main idea of the passage?
  options:
  - label: A
    content: Cooking oil can be used for different types of dishes.
  - label: B
    content: The smoke point of oil is important for cooking.
  - label: C
    content: All oils should be used at high temperatures.
  - label: D
    content: Oils with low smoke points are the best for frying.
  group_stem: '【題組三】 (108 words)


    The smoke point is the temperature at which a cooking oil starts smoking. The
    more stable the oil, the higher its smoke point is. For health reasons, it''s
    a good idea to use oils with different smoke points for different ways of cooking.
    For high-heat cooking, including pan-frying, grilling, and pan-roasting, it’s
    best to choose an oil that has a smoke point of at least 190°C. For medium-heat
    cooking, such as sautéing and baking, an oil with a smoke point of at least 175°C
    is fine. Finally, for drizzling over dishes and making salad dressings, it’s OK
    to pick a type of oil with a low smoke point.


    📖 temperature 溫度 stable 穩定的 grill / roast 烤 sauté 煸炒 drizzle (灑落的) 少量液體'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
