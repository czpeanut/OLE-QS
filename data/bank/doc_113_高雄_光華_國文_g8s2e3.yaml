- id: doc_113_高雄_光華_國文_g8s2e3_s2_48
  section: 2
  number: 48
  type: single
  page: 10
  stem: 「荒謬的解藥有二：第一是坦白指謫，第二是□□□□，幽默屬於後者。」根據文意，填入下列空格處最恰當的詞語是：
  options:
  - label: A
    content: 旁敲側擊
  - label: B
    content: 苦口婆心
  - label: C
    content: 含沙射影
  - label: D
    content: 巧言令色。
  group_stem: "(八)\n    據說秦始皇曾想將他的皇家苑囿擴建，東至函谷關，西達今天的鳳翔與寶雞。消息傳出後，宮中的弄臣優旃妙語回應：「妙極了！記得多放些動物進去。要是敵軍從東邊打來，就讓麋鹿用角抵抗吧！」秦始皇聽了這話，竟將原本擴建的計畫擱置了。\n\
    \    從這個故事來看，幽默可以說是一帖化解荒謬的良藥。當面對不合理的情境時，委婉而機智的幽默，往往順著對方的荒謬邏輯推衍下去，讓人突然領悟其荒誕的本質。優旃是如此，古代的淳于髡與優孟也是如此，當代的包可華亦復如是。\n\
    \    西方有句諺語，大意是：「解釋是幽默的致命傷，正如幽默是浪漫的致命傷。」虛張聲勢、故作姿態的浪漫，其實也不脫荒謬的本質。凡事一旦過分不合情理，或嚴重違背自然，便構成荒謬。\n\
    \    荒謬的解藥有二：第一是坦白指謫，第二是□□□□，幽默屬於後者。什麼時候該用前者，什麼時候該用後者，要看說話者的心情與聽者的悟性。心情好，可以委婉暗示；心情不好，就直言了當。對聰明人，可以婉轉點；對不解風情的人，只好明刀明槍。\n\
    \    幽默感甚至可以用來評斷人的等級。依能力高低，大致分為三等：\n    ．第一等，天生具有幽默感，能在荒謬中一眼看出可笑之處；\n    ．第二等，雖不擅長創造幽默，但能領略他人的幽默；\n\
    \    ．第三等，連基本領略能力都欠缺。\n    這三等人就像磁鐵的對比：\n    ．第一等是吸鐵石；\n    ．第二等是鐵；\n    ．第三等，則只是一塊木頭。\n\
    \    從這個角度來看，秦始皇雖然自己無法創造幽默，至少還能聽懂優旃的話，也勉強可以歸入第二等。\n    至於那些第三等人，雖無幽默感，卻對幽默的誕生也有「貢獻」：他們雖不能創造幽默，卻能不斷創造荒謬。這世界若缺少妄人演出荒誕劇場，智者的幽默又從何而來？例如晉惠帝那句千古笑談：「何不食肉糜？」——這種無知與高高在上的荒謬語言，引來了中國人千年的訕笑。\n\
    \    從某種角度看，這些妄人是在不自知的情況下，犧牲了自己，成就了別人的幽默感。\n    荒謬常帶有「膨脹性」，好比螳臂當車，蛇欲吞象，是一種虛妄的自我放大。而幽默則像是「反膨脹作用」（deflationary）：一帖能洩氣的藥，把誇張的「胖子」洩成一個真實的「瘦子」。但幽默與尖刻不同，它針對的是「荒謬本身」，不是「犯下荒謬的人」。真正高明的幽默，是來自一種內在的嚴肅與慈悲，而不是殺氣與怨氣。\n\
    \    那些刀光劍影式的尖酸刻薄，只有攻擊與怨恨，不是幽默；真正的幽默，像是一位「心熱手冷」的開刀醫生，他動刀的對象是病，不是病人。\n    英文中的\
    \ 「humour」 被譯為「幽默」，可謂神來之筆。「幽」表示含蓄內斂，「默」表示不張揚、不喧嘩。真正高層次的幽默，是一種講究分寸與暗示的藝術，愈含蓄，愈耐人尋味。然而暗示性愈強，也對讀者或聽者的悟性提出更高的要求。\n\
    （改寫自余光中 幽默的境界）"
