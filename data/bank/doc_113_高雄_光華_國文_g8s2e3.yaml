  stem: 請選出最適合填入下列文章空格處的一句話，讓上下文意思連貫通順。
  options:
  - label: A
    content: 伊斯蘭與基督教的信仰差異，使得國內常爆發宗教衝突
  - label: B
    content: 黎巴嫩社會中的宗教派系相當多元，且缺乏單一主導勢力
  - label: C
    content: 宗教自由在黎巴嫩是憲法保障的重要原則之一
  - label: D
    content: 儘管宗教信仰多元，人民彼此間仍能和平共處。
  group_stem: "(四)\n    2020年8月4日，黎巴嫩首都貝魯特發生化學物質連環大爆炸，瞬間夷平周邊建築，造成至少兩百人死亡、六千人受傷，財產損失高達一百至一百五十億美元。然而，或許最令人遺憾的是：引爆事故的硝酸銨，其實早在港口邊堆放了六年，期間也多次有人提出警告，提醒存在安全風險，必須儘速處理，卻遭政府視若無睹，最終釀成悲劇。因此，黎巴嫩人民不僅震驚與悲傷，更對政府的怠惰與無能感到憤怒。\n\
    \    位於地中海東岸的黎巴嫩，宗教結構極為複雜。_____________________ ，如果將泛伊斯蘭與泛基督教的各派系加總來看，彼此比例幾乎各占一半。\n\
    \    黎巴嫩於1943年獨立建國時，各宗教派系同意未來政府中最關鍵的三個職位，必須平均分配給三大宗教團體。這項安排原意在於平衡利益、換取和平共處的空間，但也讓「派系制衡」演變為「派系內耗」，成為黎巴嫩政治無法擺脫的僵局。\n\
    \    1975年，黎巴嫩爆發內戰，持續長達15年，直到1990年才畫下句點。然而，內戰結束後並未真正解決派系鬥爭，反而衍生出兩大問題：一是各派形成獨立的利益體系，貪腐日益嚴重；二是政府施政深陷內耗，效率低落。結果導致基礎建設破敗不堪、大眾交通系統嚴重缺乏、水電供應不穩，嚴重拖累經濟與民生發展。\n\
    \    2019年，黎巴嫩再度爆發數十年來最嚴重的經濟危機，加上貨幣暴跌，引發通貨膨脹與物價飛漲，社會壓力不斷升高。\n    在人民怒火沸騰之下，總理迪亞布於爆炸事件後率領內閣總辭，以示負責。然而，不少民眾與專家認為，若政治制度本身不做結構性改革，換一批官員恐怕也無法真正帶來改變。\n\
    （改寫自關鍵評論網 大爆炸的背後：黎巴嫩民眾為何如此絕望？）"
