- id: doc_113_高雄_光華_國文_g8s2e3_s2_36
  section: 2
  number: 36
  type: single
  page: 5
  stem: 根據本文內容，關於「抱怨與快樂」的關係，下列哪一項說法最符合文意？
  options:
  - label: A
    content: 抱怨是一種釋放壓力的方式，有助於保持快樂
  - label: B
    content: 不快樂的人才會抱怨，快樂的人從不抱怨
  - label: C
    content: 抱怨可能是造成不快樂的原因，而非結果
  - label: D
    content: 快樂與否與情緒表達無關，抱怨沒有影響。
  group_stem: "(三)\n    我多年來研究快樂的道理，得出最重要的結論之一是：一個人一生的遭遇，與他是否快樂，其實關聯並不大。稍加思索，就能理解這看似矛盾的道理。我們都認識一些人，生活順遂卻從不真正快樂；也見過不少人，歷經波折卻依然樂天知命，從容面對。\n\
    \    第一道祕方，是「感激」。\n    真正快樂的人，心中總懷著感激；而缺乏感激之心的人，則難以感到快樂。我們常以為人是因為不快樂才會抱怨，其實更合理的說法應是：「抱怨本身，會讓人變得不快樂」。\n\
    \    第二道祕方，是「投入」。\n    快樂常是「另一件事的副產品」。最穩定的快樂來源，來自於那些讓我們感到有目標、有意義的活動，例如研究昆蟲、參與運動等。你投入越深，所獲得的快樂也越多。\n\
    \    第三道祕方，是「信念」。\n    我們應該相信：這個世界上存在一些超越自我、永恆不變的事物，而我們的生命也具有更深遠的意義。這樣的信念，能讓人更感踏實與滿足。這種信念可以來自宗教，也可以來自你自己所秉持的人生觀。\n\
    \    總而言之，感激的心、投入的行動，以及內在的信念，是快樂的三道祕方。\n（改寫自網路文章快樂的三道祕方）"
