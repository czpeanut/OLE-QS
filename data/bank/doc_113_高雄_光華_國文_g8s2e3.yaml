- id: doc_113_高雄_光華_國文_g8s2e3_s2_31
  section: 2
  number: 31
  type: single
  page: 4
  stem: 富士公司取得奧運會135 膠卷指定產品資格後，採取何種態度應對後續競爭？
  options:
  - label: A
    content: 積極展開全球宣傳
  - label: B
    content: 主動邀請柯達合作共享資源
  - label: C
    content: 認為已勝券在握，未做進一步行動
  - label: D
    content: 在洛杉磯加強場外推廣活動。
  group_stem: "(一)\n    富士與柯達，是世界兩大最具盛名的膠卷①品牌。多年來，兩家公司之間的競爭從未停歇。\n    1984年洛杉磯 奧運會前夕，富士公司為爭取更大的市場份額，砸下數百萬美元，成功取得該屆奧運會135膠卷的指定產品資格。富士原以為憑藉這一舉動，便能將柯達排除於當年度最重要的國際體育盛事之外。\n\
    \    令人意外的是，富士對此頗為自滿，完全未預料柯達會發起反擊，便高枕無憂地等待奧運會開幕。\n    然而，面對不利情勢，柯達並未退縮。他們迅速召集專家討論策略，發現富士所謂的「獨占性」其實僅限於比賽舉行的兩週、指定的場館；除此之外，富士在其他時間與地點並無特殊安排。\n\
    \    柯達決定避開鋒頭，將戰場拉長。他們把宣傳重點放在奧運會前那段為期六個月的熱身期，積極展開一連串行銷攻勢：贊助美國田徑隊、邀請數位奪冠熱門選手擔任品牌代言人，並投入資源贊助奧運田徑預選賽。同時，柯達的大量電視廣告與海報也佈滿整個洛杉磯。\n\
    \    當奧運會正式登場時，許多觀眾甚至未察覺富士的存在，反而誤以為真正的贊助商是柯達。\n（改寫自張健鵬、胡足青柯達的反擊）\n註：①膠卷：捲成一軸的帶狀軟質底片。塗有感光藥劑，可用來攝影。分為黑白和彩色兩種。"
