- id: doc_113_高雄_光華_國文_g8s2e3_s2_41
  section: 2
  number: 41
  type: single
  page: 7
  stem: 下列哪一項最適合歸類為「社福移工」的工作內容？
  options:
  - label: A
    content: 在工廠操作機械
  - label: B
    content: 協助家庭中的長者洗澡與用藥
  - label: C
    content: 在漁船上進行海上捕撈作業
  - label: D
    content: 在建築工地進行混凝土搬運。
  group_stem: "(五)\n    移工大致可分為兩類：產業移工與社福移工。前者主要從事營造、製造與漁業等工作；後者則投入家庭照顧、看護與幫傭等服務領域。若從產業類別進一步觀察，會發現不同產業的移工在性別比例與來源國上呈現顯著差異。\n\
    \    產業移工的工作內容非常多元，有些人在工廠裡操作生產線，有些在建築工地搬運建材，另一些則在漁船上進行捕撈。他們大多從事被視為「低薪、骯髒、危險」的工作（俗稱3D產業），不僅容易遭遇雇主拖欠薪資、生活環境惡劣，更可能面臨嚴重的職業災害。例如，過去曾多次發生工廠火災，造成移工死傷慘重。針對此現象，臺灣的勞工團體長期呼籲政府應立法強制「廠、住分離」，以保障移工的生命安全，但至今仍未獲得實質重視與制度回應。\n\
    \    在社福移工方面，印尼勞工人數明顯居多，約佔整體的四分之三，且以女性為主力勞動人口，儘管也有少數男性投入此領域。社福移工人數雖相對穩定，並長期肩負臺灣長照體系的重要角色，但其勞動條件卻長期處於制度保障的空白地帶。由於尚未被納入《勞動基準法》與正式長照制度，許多社福移工沒有勞保保障，工時超長、休假不明，甚至有些人還面臨暴力對待、性騷擾或性侵害等侵害。\n\
    \    整體而言，無論是產業或社福領域，臺灣對於移工的勞動條件保障仍有顯著缺口，特別是以女性為主的照護型勞力，更需正視其處境並推動實質改善。\n（改寫自彭政添\
    \ 淺談統計數字中的東南亞移工現況）"
