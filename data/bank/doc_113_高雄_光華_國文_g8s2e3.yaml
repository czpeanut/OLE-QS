  type: single
  page: 8
  stem: 根據本文內容，下列哪一項最能體現作者想傳達的生命態度？
  options:
  - label: A
    content: 生命的豐富來自堅持單一性格與方向
  - label: B
    content: 成功的人生應避免看似矛盾的興趣與選擇
  - label: C
    content: 真正有活力的生命，是能在不同特質之間自由流動
  - label: D
    content: 面對嚴肅的現實，應拋棄感性與柔軟。
  group_stem: "(六)\n    海明威曾寫過一篇短篇小說，名為〈蝴蝶與坦克〉，描寫一位歡樂的男子在戰爭肅殺氛圍中的酒館裡被射殺的故事。\n    在這個象徵鮮明的故事中，蝴蝶代表男子輕盈、愉悅的性格，坦克則象徵戰爭的沉重與殘酷。這兩種意象一柔一剛，看似衝突。海明威藉此拋出一個弦外之音的問題：歡樂與嚴肅、蝴蝶與坦克，難道就無法並存？這世上一定要「你存在、我就不能活」嗎？\n\
    \    其實，這不只是文學上的思辨，也是每個人在生命中都會面對的問題。我們是否只能在「歡樂與嚴肅」、「溫柔與剛猛」、「理性與感性」、「孤獨與合群」、「寧靜與喧囂」之間做出二選一？這些特質就真的不能兼容並蓄嗎？\n\
    \    海明威自己就提供了一種答案。在他生命如春花綻放的青春歲月裡，他同時熱愛拳擊與寫作。他將這兩種性質南轅北轍的活動結合起來，讓剛強與細膩、力與美，在他的生命與作品中交織共存。這種融合，正是他終生追求的理想。\n\
    \    另一位例子是英國前首相柴契爾夫人。她年輕時被稱為「鐵蝴蝶」，後來則被人稱作「鐵娘子」。在踏入政壇前，她曾是化學師與律師，也曾夢想成為電影明星，還擔任過花呢服裝的試穿模特兒。理性與感性、剛毅與柔美，在她身上同樣並存不悖。\n\
    \    海明威與柴契爾夫人最大的共通點，就是他們都擁有旺盛的生命活力。這種活力不是執著於單一面向，也不是停留在一種性格特質中不動，而是在看似矛盾的兩端之間自由流動，敢於接納、融合對立，讓生命展現出更多樣的樣貌。\n\
    \    要讓生命無悔，我們就要學習成為一個充滿生命活力的人。\n（改寫自王溢嘉 蝴蝶與坦克）"
