- id: doc_113_台中_衛道_自然_生物_g8s1e1_s2_48
  section: 2
  number: 48
  type: single
  page: 6
  stem: 關於植物的花朵與傳粉者之間的共同演化，以下哪項描述是正確的？
  options:
  - label: A
    content: 花朵的顏色和香味主要是為了吸引那些與其無關的動物
  - label: B
    content: 花瓣的形狀和結構是演化的結果，能夠適應特定傳粉者的需求
  - label: C
    content: 所有植物的花朵都適合所有類型的傳粉者
  - label: D
    content: 花朵的演化不會影響植物的授粉成功率。
  group_stem: '閱讀三、植物與動物的共同演化：花與果實的保護與傳播


    植物與動物之間的共同演化 (coevolution) 涉及彼此長時間、跨世代的相互適應，而產生構造或行為上的改變。花的結構與傳粉者之間的關係就是一個典型例子。在動物媒介授粉的植物中，植物的花朵結構和傳粉者的行為之間存在著密切的演化相關性。例如，蜜蜂、蝴蝶等昆蟲更喜歡具有花蜜和花香的花朵，因為花蜜本身對於動物而言是食物，花香則是訊號，而他們為植物授粉，同時間花瓣需要長得像「停機坪」般的平台供它們站立。而一些特定花朵，如具有長花筒的花朵，則專門與長形口器的蝴蝶和蛾類一同進化，互相適應彼此的需求，形成了具針對性的、專一性的授粉方式，使授粉成功率提升。這樣的共同演化可以確保植物以及動物皆能的繁殖成功，並使族群能持續繁衍下去。


    果實與動物之間也存在著類似的共同演化。植物不僅要吸引動物幫助傳播種子，還必須設計防護機制，確保種子不被完全損毀。例如，辣椒 (Capsicum spp.)
    中的辣椒素能夠刺激哺乳動物的痛覺受器，使牠們避開食用，但這對鳥類卻沒有影響，因為鳥類幾乎不會感受到辣味，且鳥類的喙因為構造的緣故，不會去咀嚼研磨食物。因此辣椒得以通過鳥類傳播種子，同時防止哺乳動物咀嚼破壞種子。類似地，鳳梨
    (Ananas comosus) 的果肉多汁甜美，吸引了許多動物的食用，但它堅固的纖維有效保護了裡面的種子，使其不容易被消化。除此之外，果肉所具有的蛋白酶會傷害到口腔的組織，使得動物擔心產生痛感而不敢長時間的咀嚼它。在囫圇吞棗後，種子更容易被完整地保留在糞便中，進而帶到遠方。


    那橡樹 (Quercus spp.) 呢?橡樹果似乎很常被松鼠作為食物，但是橡樹卻還因此得利了。這要歸功於松鼠的生活特性以及橡樹的橡實中含有高濃度的單寧，這使得許多其他動物因為苦味而不敢食用。然而，松鼠等齧齒類動物對單寧的抵抗力較強，經常以橡實為食。松鼠會將橡實儲藏作為未來的食物來源，但卻很常忘記埋在哪裡，因此果實得以發芽成為新橡樹，這無意中促進了橡樹的種子傳播。這樣的行為展示了植物與動物之間的共同演化。植物利用動物的儲藏行為來傳播種子，同時也發展出防護機制來保護種子。


    當我們仔細觀察植物與動物之間的互動時，會發現這些共同演化是一個相互適應與依賴的過程。植物為了繁衍後代，發展出各種防護機制來保護種子，並吸引適當的動物來幫助傳播，而動物也透過這些互動獲取食物或其他資源。無論是花朵與昆蟲的授粉關係，還是果實與動物的種子傳播，這些關係都展示了自然界中驚人的平衡與巧妙的設計，為生態系統的維持和物種的延續做出貢獻。'
