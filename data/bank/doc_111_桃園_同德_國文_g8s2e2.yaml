- id: doc_111_桃園_同德_國文_g8s2e2_s3_31
  section: 3
  number: 31
  type: single
  page: 5
  stem: 根據上文，下列何種行為最合理?
  options:
  - label: A
    content: 超市售價包含消費者未見的成本
  - label: B
    content: 消費者冬天買的費用低於夏天
  - label: C
    content: 香蕉收購者採購黃蕉以節省成本
  - label: D
    content: 蕉農開放青蕉園讓民眾現採現吃。
  group_stem: "每次香蕉價跌的新聞滿天飛，整個臺灣社會都充滿問號，因為消費者上市場買香蕉，價格始終不像新聞報的那樣跌至谷底。\n    香蕉分為青蕉與黃蕉。青蕉是農民採收八分熟的香蕉，黃蕉是經過催熟設備處理過的可食用香蕉。無論青蕉在產地的收購價多低，催熟青蕉、分級包裝與集散運輸，都是一定會發生的成本支出。青蕉不能吃，黃蕉才能吃，有本事把青蕉變成能吃、好吃的黃蕉，就是決定青蕉產地收購價的人。\n\
    \    不同季節採收的青蕉產量不一樣，也會使得生產成本略有差異。根據香蕉研究所提供的數字顯示，香蕉的耕種成本加上之後加工催熟、運輸集散與銷售的成本，夏蕉、冬蕉每台斤至少要超過13.8\
    \ 元和17.7 元，產地的農民和產業供應鏈上的每個角色，才能獲得基本的收入。\n    消費者買到的香蕉末端售價，除了生產成本之外，還包含加工成本、運輸成本以及盤商的利潤。\n\
    \    屏東蕉農兼產銷班班長余致榮以最近處理企業愛心認購的香蕉為例來進一步解釋，他說:「一箱香蕉 12 公斤，1 公斤香蕉要花紙箱2 元、催熟2 元、集運包含場地和人工要4\
    \ 元、宅配運費15 元，好啦，我們跟農民買1 公斤7元，整個算起來就是1 公斤30 元。可是想做愛心的企業卻以為，用1 公斤10 元來買就等於幫忙了。」在一箱認購120\
    \ 元與360 元的價格之間來回磋商，企業、農民和余致榮三方幾乎精疲力竭，想幫忙的人沒幫到忙，受幫忙的人哭笑不得。想幫忙的人如果對香蕉產業不了解，又抱著「花一點小錢又可以做愛心」的心態，反而會先傷了農民的心。\n\
    (改寫自李慧宜〈終結香蕉賭局——價格的秘密)"
