- id: doc_111_桃園_同德_國文_g8s2e2_s3_5
  section: 3
  number: 5
  type: single
  page: 1
  stem: 有關「我所知道的康橋」一文的寫作手法，下列何者正確？
  options:
  - label: A
    content: 「晚景的溫存卻這樣被我偷嘗了不少」以誇飾手法道出欣賞晚景的得意
  - label: B
    content: 文中六個「關心」句、四個「你如愛」，使用擬人修辭，表現對康橋豐沛情感
  - label: C
    content: 寫作人稱靈活地切換，文中使用了許多的「你」字，拉近與讀者間距離
  - label: D
    content: 以「一層輕紗似的金粉糝上了這草、這樹、這通道、這莊舍。」表現康橋夕陽變幻之美。
  lesson_raw:
    title: 我所知道的康橋
    basis: 題幹提及「我所知道的康橋」
