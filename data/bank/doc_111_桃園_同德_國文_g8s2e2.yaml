- id: doc_111_桃園_同德_國文_g8s2e2_s3_27
  section: 3
  number: 27
  type: single
  page: 4
  stem: "中國古典詩歌有一種「竹枝詞」，其格律寬鬆自由，用語淺近自然，內容多描寫民間風土或男女豔情，富於民歌情調；如劉禹錫〈竹枝詞〉：「楊柳青青江水平，聞郎江上踏歌聲。東邊日出西邊雨，道是無晴還有晴。」唐以後的竹枝詞且多以七言四句為定式。\n\
    \     依據以上敘述，試判讀下列選項何者並非竹枝詞："
  options:
  - label: A
    content: 山桃紅花滿上頭，蜀江春水拍山流。花紅易衰似郎意，水流無限似儂愁
  - label: B
    content: 滿天梅雨近端陽，竹葉隔宵裹粽忙。一朵榴花兩枝艾，大家兒女學新妝
  - label: C
