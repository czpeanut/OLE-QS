- id: doc_111_桃園_同德_國文_g8s2e2_s3_6
  section: 3
  number: 6
  type: single
  page: 1
  stem: "(甲)現在玫瑰花的種類多達一百多種，有白玫瑰花、紅玫瑰花、藍玫瑰花、粉紅玫瑰花、淡粉紅玫瑰花、黃玫瑰花、雙色玫瑰花等等，除了常見顏色，其實大部分的玫瑰花都是利用幾種常見的玫瑰花去改良、研發而成的新品種玫瑰花。\n\
    \   (乙)玫瑰的原生種類不多，但是經過雜交育種，光是正式登錄的起碼超過一萬五千種。 按玫瑰花的大小依序可分為輪種、中輪種、小輪種、蔓性種四大類。\n \
    \ 上述兩則有關玫瑰花的說明，下列何者正確?"
  options:
  - label: A
    content: 兩者對於玫瑰花的種類說明大相逕庭
  - label: B
    content: 兩者皆以玫瑰花的顏色及大小來分類
  - label: C
    content: 前者的雙色玫瑰花是後來發現的新品種
  - label: D
    content: 後者的蔓性種是玫瑰花中花朵最碩大的。
  tags:
    textbook: 第四冊（八下）第2次段考範圍
    labeled_by: ai
    chapter:
      publisher: null
      book: 八下
      subject: 國文
      code: null
      title: null
      chapter: null
