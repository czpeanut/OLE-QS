- id: doc_111_桃園_同德_國文_g8s2e2_s3_34
  section: 3
  number: 34
  type: single
  page: 6
  stem: 根據文章，關於作者身分、宗教與親子關係的敘述，依序為?
  options:
  - label: A
    content: 外籍新娘／信奉佛教／達瑪是作者的女兒
  - label: B
    content: 外籍移工／信奉伊斯蘭教／達瑪是作者的兒子
  - label: C
    content: 外籍新娘／信奉伊斯蘭教／ Ken 是作者的兒子
  - label: D
    content: 外籍移工／信奉佛教／ Ken 是作者的女兒。
  group_stem: "那 8 歲的小孩，他跌倒了，他時常讓我想到達瑪（Damar），從 2 歲就與我分離的兒子，現在已就讀小學二年級。 Ken 是奶奶第三個孩子的孫子。看到\
    \ Ken，好像看到達瑪的影像，因為他們的身影還有年齡都一樣，差異是 Ken 的膚色比較白、眼睛小小的、還有棕色的頭髮。但是達瑪的皮膚顏色就如熟成的人心果，有圓圓的眼睛與厚厚的頭髮。\n\
    離開孩子的母親\n    我的名字是 Larasati。2014 年抵達臺灣的那段時間最難熬，因為要適應新環境，最沉重的事情是壓抑對於達瑪的思念。6 年前，我在他\
    \ 2 歲生日前離開。如今我眼前仍然可以清晰浮現出他如何哭泣、而我母親將他抱到後面，不讓他看到我離家的身影。在去機場的途中，我一直流下眼淚，和他分離，是一件多麼困難的事。從那時起，我失去了與達瑪的美好時光。我不再能聞到每次幫他洗完澡會塗的痱子粉香氣，或是在他學習走路快跌倒時伸出手。我彷彿被思念淹沒。前三個月我快被搞瘋了，完全沒有感覺到自己已淚流成河，時時刻刻都在想像、在家裡正在做什麼，希望再一次聽到他叫我「媽媽」。\
    \ 離婚之後，我一人扶養達瑪。我選擇跟父母分開，在鄉下租了店鋪來隱藏我的身分。我不想要別人認為我們這種離婚的女人就是喜歡誘拐別人的丈夫。兩年來，我困難的過著生活，直到下定決心離開家鄉，臺灣是我選擇的國家。\n\
    在痛苦中你要不放棄認輸，就是繼續奮鬥\n    除了一張皮夾大小的照片，我還帶著一套 Upin & Ipin 的衣服，治癒我對兒子的思念。\n    每當達瑪洗完澡，我總會幫他穿上那件藍色上衣。睡前，我抱著那件衣服，撫摸並親吻它。我想像達瑪在這裡，然後我們睡在一起。我照顧他，確保他熟睡，不被蚊子干擾。每天，達瑪未曾從我記憶消失。他臉龐的影子，陪伴我在福爾摩莎奮鬥。每天都有一排工作等待我，每個小時都已經被規畫好，跟家人通話是我消除疲累最有效的緩解方式。「媽。嗯……達瑪有問過我嗎？」\
    \ 「當然有，女兒。有時候，他喝奶時會說媽媽……一邊在房間裡找妳，或是我在客廳抱著達瑪的時候，他會親妳的相片。」\n    咚！\n    那句話使我思念溢出。但奮鬥才剛開始。我不能因為現況而放棄。我正在尋找道路，掀開各種阻擋的草叢，穿越灌木林。我只有兩個選項：放棄認輸，或是繼續奮鬥，實現勝利。\n\
    因為愛孩子，我們才不得不離開他們\n    不知為何，他們都認為，為了出國工作而將小孩留給父母帶，是一件殘忍且自私的舉動。其實，如果那些孩子之後沒有未來，又要經歷與父母相同的經驗，反而更殘忍。那樣的孩子最後會因為家裡沒錢而輟學，長大後為了糊口只能打零工。不知不覺中假期結束了。如果是三年前，母親會將達瑪抱去後面，不讓他在我離去時哭泣。\n\
    \    這次，親密相處一個月的小孩卻抱著我的行李箱上車。他的臉上掛著哀傷，罪惡感又來臨，我才剛給他溫暖，現在卻不得不離開他。\n   「弟弟，在家裡要認真念書喔。媽媽為了付學費還有我們的未來要工作賺錢。弟弟要聽奶奶還有爺爺的話。」\n\
    \   「好的，媽媽，但是不要太久，媽媽開齋節回家好嗎？」 我緊緊抱著親吻達瑪，不想放開他。他所說的話擊中我的心。這三次的開齋節我從來不在家。對於小朋友來說，開齋節是收到紅包還有跟家人出門的特別時刻，達瑪從來沒有經歷過。身為母親，我願意為達瑪的快樂犧牲一切。\n\
    以希望支撐下去\n    離開一個月，家裡很髒亂。四樓的植物因為沒有人澆水而枯掉，落葉滿地都是。奶奶快樂的迎接我回來。奶奶是一個善良的人，儘管工作很累，但她讓我在這裡有歸屬感。她常常給我額外的錢來買儲值卡，還有每月的生活所需，如洗髮精、牙刷、牙膏，也在我每次買菜的時候塞藏泡麵給我。甚至，如果她跟爺爺出門散步並在外面吃早餐，奶奶會特地買沒有豬肉的食物給我。因為怕被家裡其他人發現引起「階級不滿」，奶奶叫我藏在房間裡或是偷偷的吃。\n\
    他們的團圓，我的寂寞\n   雖然距離遙遠，但是我對他的關心沒有減少。尤其有了智慧型手機，他時常用清晰的聲音背誦禱詞，當聽到他的禱告時，我的心融化了。這個兩歲時被我留下的小孩，現在已經可以為我禱告。\n\
    \   除夕前一天，大家都有忙碌的事情。到了除夕夜，所有家人都來吃飯。長輩發下紅包，紅色在中華文化象徵精神、快樂、善良還有福利。如同今晚，每個人快樂的說著新年快樂。所有來到家裡的人中，最影響我情緒的是\
    \ Ken。他一邊拿著阿祖給他的紅包一邊到處跑。有時他的小手會拿起桌上的糖果，這是專門在過年期間端出來的。聽說，糖果象徵每個人渴望的甜蜜生活。我仔細觀察 Ken\
    \ 的行動，我的心如刀割，努力抵抗搶著冒出眼中的霧氣，想像奔跑的是達瑪，而這是我們家族的開齋節慶祝，聚在一起，大家都快樂。\n   奶奶要我趁過年時好好休息。準備完爺爺奶奶的早餐後，我回到房間打電話詢問達瑪的消息，如我所料，他追問我今年\
    \ 5 月開齋節時。會不會回來…… （節選改編自 2020 移民工文學獎優選—Etik Nurhalimah〈疫情中的承諾〉）"
