  stem: "(甲)官員「ㄉㄨˊ」職(乙)窮兵「ㄉㄨˊ」武(丙)買「ㄉㄨˊ」還珠(丁)舐「ㄉㄨˊ」情深。\n 以上各項「 」內的讀音寫成國字後依序為何？"
