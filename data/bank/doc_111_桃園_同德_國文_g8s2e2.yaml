- id: doc_111_桃園_同德_國文_g8s2e2_s3_3
  section: 3
  number: 3
  type: single
  page: 1
  stem: 行文時，作者常將某一種感官的感受，透過聯想，以另一種感官印象來表達，藉此讓文章的意象更為鮮活而豐富，下列選項都運用了感官交錯的手法，請問下列何者正確？
  options:
  - label: A
    content: 我低下頭去喊自己的名字，井水也大聲應和，連那回聲都彷彿有淡淡的餘香─以聽覺印象來表現嗅覺感受
  - label: B
    content: 他把今年在對面山上，裝進錄音機的蟬聲，拿出來，讓孩子們烤火─以聽覺印象來表現味覺感受
  - label: C
    content: 三粒苦松子／沿著路標一直滾到我的腳前／伸手抓起／竟是一把鳥聲─以視覺印象來表現聽覺感受
  - label: D
    content: 塘中的月色並不均勻，但光與影有著和諧的旋律，如小提琴上奏著的名曲─以聽覺印象來表現視覺感受。
  tags:
    textbook: 八下 第四課 我所知道的康橋
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 八下
      subject: 國文
      code: 第四課
      title: 我所知道的康橋
      chapter: null
