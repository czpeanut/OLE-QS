- id: doc_111_桃園_同德_國文_g8s2e2_s3_28
  section: 3
  number: 28
  type: single
  page: 5
  stem: 班上同學閱讀上文，提出下列整理，請判斷何者是正確的？
  options:
  - label: A
    content: 作者認為性情急躁的人，適合管理基層
  - label: B
    content: 作者認為烹牛的鍋具，不適合用來煮雞
  - label: C
    content: 作者認為工作上能做大事的人不能做小事
  - label: D
    content: 作者先提出自身看法，再援引他人意見
  group_stem: '或曰:人材有能大而不能小，猶函牛之鼎不可以烹雞；愚以為此非名也。夫能之為言，已定之稱；豈有能大而不能小乎？凡所謂能大而不能小，其語出於性有寬急；性有寛急，故宜有大小。寬弘之人，宜為郡國，使下得施其功，而總成其事；急小之人，宜理百里，使事辦於己。然則郡之與縣，異體之大小者也；以實理寬急論辦之，則當言大小異宜，不當言能大不能小也。若夫雞之與牛，亦異體之小大也，故鼎亦宜有大小；若以烹犢，則豈不能烹雞乎？故能治大郡，則亦能治小郡矣。推此論之，人材各有所宜，非獨大小之謂也。

    (劉劭《人物誌．材能》)'
