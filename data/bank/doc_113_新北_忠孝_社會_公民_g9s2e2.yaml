- id: doc_113_新北_忠孝_社會_公民_g9s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 若你成為一位負責探求公共意見的政府官員，這份報告的內容提供了哪一項重要的資訊？
  options:
  - label: A
    content: 公共意見與民眾生活利益有關，政策制訂要以民意為基礎
  - label: B
    content: 政府制訂政策前認識民意，將確保政策符合多數民眾需求
  - label: C
    content: 社會大眾的立場容易影響意見領袖，使得民意產生影響性
  - label: D
    content: 政府藉由與意見領袖的互動，能更快掌握公共意見的傾向。
  group_stem: "題組：(請參考選文，回答第13-14題)\n網紅的「二級傳播」＝民意製造機？\n    網路紅人，簡稱網紅或KOL(關鍵意見領袖)，也就是在社群媒體上擁有大量粉絲和訂閱者的人。由於平臺上有許多追隨者，其轉發的訊息反而比起第一發布者能接觸更多更廣的人群，許多行銷和廣告商也因此認為，網紅比起傳統媒體可以更低廉的價格，精準且快速的接觸目標族群，使得業者紛紛轉邀請網紅在社群媒體上代言商品。\n\
    \    透過中介人來傳播媒體訊息，並非是社群媒體流行後才出現的現象。美國傳播學者拉扎斯菲爾德於1940年代提出「二級傳播理論」，發現生活中訊息的傳遞並非直接傳遞給大眾，通常會經由「意見領袖」的彙整和說明，接著影響大眾的看法與公共意見的方向。\n\
    \    拉扎斯菲爾德所指稱的「意見領袖」，並非指稱主導議題方向的領導者，而是訊息傳遞的重要中間人，藉由他們的人際影響力和意見的表達，影響或改變群眾對於公共意見的想法，形成或轉變公共意見的內涵，甚至可能造成政府政策的修正。隨著網路世代的出現，社群媒體上擁有大量讚和訂閱者的網紅，甚至被許多廣告公司認為比傳統媒體的影響力更大。\n\
    參考來源：藍曉嵐(2017.11.08)。【兩級傳播理論Two Step Flow】關於KOL，我想說的是⋯⋯。火星媒體。"
