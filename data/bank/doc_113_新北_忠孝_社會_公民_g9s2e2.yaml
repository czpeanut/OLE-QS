    content: 歐洲聯盟
  - label: B
    content: 世界展望會
  - label: C
    content: 世界貿易組織
  - label: D
    content: 國際綠色和平組織。【110】
  group_stem: "閱讀下列選文，回答第7題：\n    世界之大，卻不是人人都能夠吃飽喝足。因此，聯合國在1945年10月16日成立糧食與農業組織，希望能有效管理全球糧食系統，並藉此呼籲大眾關注糧食議題，讓更多人擺脫飢餓。\n\
    \    根據聯合國的報告顯示，目前全球約有8億人面臨飢餓，相當於世界上每9人中就有1人正遭受飢餓，但全球卻有約三分之一的糧食被浪費掉。因此，糧食並非不夠，而是分配不均，所以如何處理糧食分配不均和食物浪費的問題，是全球新的糧食議題。\n\
    \    在臺灣，食物浪費的情形很嚴重，根據環保署統計全國廚餘量推估，國內每人每年平均浪費約100公斤的食物；食藥署也調查指出，一年約有3萬6千公噸的食物商品被當作垃圾處理。雖然臺灣目前沒有缺糧的危機，但糧食自給率偏低，加上農地逐漸減少、食品安全及食物浪費的問題，仍可能影響臺灣的糧食安全。\n\
    \    有鑑於此，減少糧食浪費似乎比增加糧食生產更加迫切，因此，從食農教育開始培養國人愛惜食物的觀念極為重要。\n★糧食自給率：國內消費的糧食中，由國內生產供應的比率。"
  tags:
    chapter:
      publisher: 南一
      book: 九下
      subject: 公民
