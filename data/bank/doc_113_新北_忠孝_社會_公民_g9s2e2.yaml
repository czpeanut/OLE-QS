- id: doc_113_新北_忠孝_社會_公民_g9s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 根據上述文章畫線處判斷，作者認為以下何者的發展加速了全球化現象？
  options:
  - label: A
    content: 國際貿易
  - label: B
    content: 傳播科技
  - label: C
    content: 交通運輸
  - label: D
    content: 資訊科技。
  group_stem: "題組：(請參考選文，回答第11-12題)\n鐘擺向左 全球化的叛逆\n    過去二十多年，全球化是世界發展的主流，不僅運輸工具讓人與貨物快速抵達目的地，科技與網路的發展也讓文化、資金、知識等快速傳播到世界的各個角落。不同於早期的通訊需要花費大量的人力與物力鋪設電話線，現在只要有基地臺和手機即可完成通訊，通訊成本的降低讓非洲大陸也能與世界接軌。\n\
    \    在全球化的時代，全球各個面向都以空前的速度快速發展。《世界是平的》一書中，形容全球化潮流像是一部接著一部的推土機，推倒國家之間的隔閡，印度、中國、東南亞等勞動力便宜的地區，正在搶走歐美白種人的工作，而網路的普及更擴大了工作的種類。\n\
    \    最初的時候，絕大多數的民眾只能默默順從全球化潮流，努力求取生存空間，不過並不是所有的人都是順從的綿羊，少數個體開始覺醒於盲從之中，追求自身的獨特性，並且確切分析全球化帶來的利弊得失，因為全球化的利益分配並不平均，各國與個人的貧富差距亦不斷擴大，事實上在全球化中受益最大的，反而是資本家和社會的中高階層。\n\
    \    網路的普及與快速傳播，讓原本屬於少數個體的覺醒逐漸擴大範圍，有愈來愈多人質疑全球化是否弊大於利，於是世界各地開始點燃反全球化的火苗。到了今日，英國脫離了靠全球化成功的歐洲聯盟(EU)，雖然前途充滿不確定性，但是由此可見，世界各地對全球化的反抗正在逐漸發酵中。\
    \      參考來源：彭媁琳(2016.06.25）。鐘擺向左全球化的叛逆。今日新聞網/Yahoo!新聞。"
  tags:
    chapter:
      publisher: 南一
      book: 九下
      subject: 公民
      code: 1-1
      title: 生活中的全球化
      chapter: null
    textbook: 九下公民 1-1 生活中的全球化
    labeled_by: ai
