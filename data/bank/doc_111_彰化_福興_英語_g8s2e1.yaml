  page: 3
  stem: 5.What is the reading for?
  options:
  - label: A
    content: To show bees are very important to our environment and our life.
  - label: B
    content: To give readers tips for keeping bees.
  - label: C
    content: To point out what goes wrong with our environment.
  - label: D
    content: To show how to keep a good garden.
  group_stem: '(二) Bees are often seen moving from flower to flower in search of nectar,
    so they can make honey. In fact, bees are not only hard-working but also excellent
    pollinators. A bee visits a flower and collects nectar. At the same time, pollen
    gets on the bee''s body. The bee carries the pollen to another plant of the same
    type and it falls on another flower.

    However, bees do not work as pollinators only for flowers. They also help with
    the production of many seeds and fruit. Without the help of bees, we would not
    have apples, watermelons, strawberries or lettuce to eat. There would be no tea,
    coffee, or chocolate to drink, either.

    Sadly, the population of bees now are much less than that in 1990. It may be because
    of the use of pesticides and because mites feed on bees. If we don''t take action
    and help increase the population of bees, both our environment and we will be
    in trouble. In the long run, we will not have enough food. Let''s be kinder to
    bees.

    Nectar 花蜜 pollinator 傳粉者 pollen 花粉 population 人口'
