  group_stem: '(三)

    People eat more meat than before. Some even have meat for every meal. However,
    the number of people on earth is still growing, so there will be more mouths to
    feed. How do we get more meat then?

    Dr. Mark Post has an answer to this. We can grow meat in labs. He and his team
    take cells from animals and then grow them into meat. By doing so, no animals
    lose their lives. This kind of meat is also cleaner because it comes from the
    lab. What''s more, raising animals creates a lot of greenhouse gas, but growing
    lab meat doesn''t.

    How does the lab meat taste? Many people tried it and couldn''t tell it from real
    meat because it tastes just like the real thing. Now for the big question: Would
    you try it ?

    lab實驗室 cell細胞'
