  section: 6
  number: 1
  type: single
  page: 3
  stem: 1.What is the best title of the reading ?
  options:
  - label: A
    content: On the road to 100% slave-free chocolate.
  - label: B
    content: The number 1 chocolate brand in the world.
  - label: C
    content: The unevenly divided cocoa chain.
  - label: D
    content: Child labor in Ghana and the Ivory Coast.
  group_stem: '(一) Tony''s Chocolonely is a chocolate company in the Netherlands,
    and their goal is to make all chocolate 100% slave-free. In 2003, Teun van Keuken
    and two other reporters found that most chocolate companies used cocoa from farms
    with child labor in Ghana and the Ivory Coast. The owners made the child workers
    do heavy labor and they were not able to go to school. Farmers worked long hours
    for low pay. Teun van Keuken thought "Right now there is slavery on cocoa farms
    in west Africa. This is the result of the unevenly divided cocoa chain." So two
    years later he and the two reporters started their own chocolate brand-- Tony''s
    Chocolonely .

    Since then, they''ve worked hard to try to change the chocolate industry. But
    how? First,they create awareness. Tony''s chocolate bar is unevenly divided and
    different from others'' because their chocolate tells important stories. They
    want all choco fans to know the inequality in the chocolate industry and ask the
    other companies to do their part in taking responsibility to stop illegal child
    labor. Second, they set the example. They make tasty chocolate with traceable
    cocoa and without the use of modern slavery. Now they are the number 1 chocolate
    brand in the Netherlands. Third, they inspire to act. Tony''s Chocolonely inspire
    other chocolate companies to make 100% slave free chocolate.

    Last but not least, everyone needs to help. Tony''s Chocolonely says "We can''t
    do it alone. Alone we make slave-free chocolate, together we make all chocolate
    100% slave-free. The more people who choose slave-free and spread our message,
    the sooner 100% slave-free will be the norm in chocolate."

    labor 勞力 勞工、slavery 奴隸、unevenly 不平均（不規則）、divided 分配的、chain 鎖鏈(產業鏈)、result 結果、brand
    品牌、awareness 認知、inequality 不平、responsibility 責任、illegal 非法的、traceable 溯源的、inspire
    鼓舞、norm 基準'
