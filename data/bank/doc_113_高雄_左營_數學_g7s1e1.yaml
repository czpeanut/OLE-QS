- id: doc_113_高雄_左營_數學_g7s1e1_s2_17
  section: 2
  number: 17
  type: fill
  page: 3
  stem: '中興大學獸醫病理生物學研究所教授吳弘毅指出，新冠病毒的直徑大約是 120nm（奈米），「微米」是細胞、細菌的大小，這兩者差了 1000 倍（1 微米＝1000
    奈米）。不同病毒的大小雖然有差別，但都是「奈米」的等級，口罩都有防護病毒效果。只是口罩有很多種，防止病毒入侵的程度不一樣。

    （註：1 公尺=1 米=$10^{6}$ 微米=$10^{9}$ 奈米） (摘錄自台灣事實查核中心)

    上述短文中的 120 奈米=0.00000012 公尺，0.00000012 公尺可用科學記號表示為______________公尺。'
  tags:
    chapter:
