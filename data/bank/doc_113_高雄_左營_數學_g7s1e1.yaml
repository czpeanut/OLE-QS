- id: doc_113_高雄_左營_數學_g7s1e1_s2_16
  section: 2
  number: 16
  type: fill
  page: 3
  stem: '天文單位（英語：Astronomical unit，縮寫的標準符號為 AU）是天文學上的長度單位，曾以地球與太陽的平均距離定義。2012 年 8
    月，天文學家以無記名投票的方式，根據 NASA（美國太空總署）最新消息，把天文單位固定為 149,597,870,700 公尺。新的天文單位以公尺來定義，而公尺的定義來源於真空中的光速，也就是說，天文單位現在不再與地球與太陽的實際距離掛鉤，而且也不再受時間變化的影響。(摘錄自維基百科)

    上述短文中的天文單位約為 1495 億公尺，1495 億公尺可用科學記號表示為______________公尺。'
