  section: 1
  number: 34
  type: single
  page: 5
  stem: 34.圖（二）為東南亞國家分布圖，其中哪兩國為主要油棕生產國？
  options:
  - label: A
    content: D、F
  - label: B
    content: D、I
  - label: C
    content: F、H
  - label: D
    content: H、I。
  group_stem: "【地理】\n閱讀下列選文，回答第34 至37 題：\n  油棕是源自西非的熱帶作物，適合種植在高溫、多雨的氣候環境裡。全球有數十個國家的小型農場和大型企業種植園在種植油棕，其中印尼和馬來西亞兩國占了絕大部分。棕櫚果採收後會送到園區附近的榨油工廠，經過初步的壓榨和處理，製成毛棕櫚油和棕櫚仁油。毛油接著被運至精煉廠，精煉成各式副產品或衍生物。從加工食品到清潔用品、化妝品，甚至生質燃料，生活中隨處可見棕櫚油的蹤影，其用途相當廣泛，因此有「世界油王」之稱。\n\
    \  然而，全球對棕櫚油的需求不斷增加，為了滿足需求，企業不惜砍伐原始雨林或以火燒的方式清空土地種植油棕樹。這種作法嚴重破壞生態環境，損害生物多樣性，同時對社會和勞工產生負面影響，並增加溫室氣體排放。為了推動棕櫚油的永續發展，全球性的組織「棕櫚油永續發展圓桌組織（RSPO）」於2004\
    \ 年成立，其致力於促進可持續棕櫚油的生產和使用，且RSPO認證（如圖一）確保產品所使用的棕櫚油來源符合一系列的環境和社會標準。"
