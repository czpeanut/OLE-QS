  stem: '28.下列甲、乙、丙、丁為清末時對統治政權提出看法的主要代表人物。請問：

    甲：我認為人民普遍缺乏參與政治的能力，貿然推動總統制將會危害中國之獨立；應改革現行體制，並參考英、日兩國做為改革的借鏡。

    乙：不推翻現有體制，就無法創立真正的新中國。我們應該要推翻這個世襲的政府，建立共和新政權。

    丙：我不喜歡這些世界上的潮流，以不變應萬變。

    丁：推翻專制政權是我的責任。我希望建立一個五族共和的新國家。

