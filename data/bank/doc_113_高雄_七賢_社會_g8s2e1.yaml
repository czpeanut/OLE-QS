  group_stem: '***除了孫中山以外，新中國的創立還仰賴了許多人的努力。論才，當屬宋教仁、論功當屬黃興，倘若沒有他們的深謀遠慮、運籌帷幄，則中華民國不可能誕生，因此他們都可謂為《國父們》。在這群人拋頭顱灑熱血的貢獻下，我們才有機會看到一個有別於過往的國家出現。這群國父們最初在討論革命應該從中國何地開始，共提出三種方案：第一，直搗黃龍從北京開始；第二，從長江流域開始，拿下中國富庶的經濟命脈；第三從邊陲開始，先拿下兩廣，也方便革命志士運送軍火及人員物資。請問：'
