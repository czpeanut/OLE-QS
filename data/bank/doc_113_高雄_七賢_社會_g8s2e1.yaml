  group_stem: "閱讀下列選文，回答第38 至40 題：\n  由東協推動多年的「區域全面經濟夥伴協定(RCEP)」已於2022 年生效，成為全球涵蓋人口最多（占全球約30%）與經濟規模最大（占全球貿易比重約30%）的巨型貿易協定，15\
    \ 個成員國分布如圖（三）深灰色區域。該協定旨在深化以東協為核心之區域經濟整合，建立一個現代化、廣泛、高品質的區域自由貿易協定(FTA)，最終目標是取消成員國之間90％以上商品關稅。RCEP\
    \ 成員國是臺灣主要出口市場及投資地區，與此區的貿易占臺灣總貿易值約58%，未加入該協定將使臺灣企業面臨更多因關稅而增加的成本，連帶降低其在國際市場的競爭力，未來該如何因應是當今重要的課題。"
