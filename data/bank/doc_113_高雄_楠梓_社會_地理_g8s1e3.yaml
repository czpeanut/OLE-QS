  group_stem: 東日本大震災是2011 年3 月11 日發生太平洋近海地震、包括伴隨而來的巨大海嘯以及餘震所引發的大規模災害。受災地區主要集中在東北、關東、北海道等東部地區，離震央最近的岩手縣、宮城縣、福島縣的海岸線地區都遭到了巨大海嘯襲擊，其中有些距離海岸數公里的地區也被淹沒。許多沿海城市與設施都被摧毀，僅宮城縣的罹難以及失蹤人數就接近11,000
