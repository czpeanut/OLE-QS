  stem: 宋朝蘇軾曾評論當時讀書人：「老儒先輩，自稱他們年輕時，要想求取《史記》、《漢書》而不能得到；僥倖得到了，都親手抄寫，日夜誦讀，惟恐有所不足。近年書商輾轉互借翻刻，使諸子百的書，一天就能流通萬張以上，書對學習的人來說，數量多且容易獲取，他們的文章學術成就，理應超過前人好多倍，但年輕的學子們，都把書束之高閣，不去閱讀，後言談虛浮不實，毫無根據，這是什麼道理呢？」請問：這個時代的知識分子會與前人不同，和當時哪一項技術發展有關？〈習作P31，第12
