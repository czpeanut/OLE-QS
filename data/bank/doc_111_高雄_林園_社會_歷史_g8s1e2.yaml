- id: doc_111_高雄_林園_社會_歷史_g8s1e2_s1_21
  section: 1
  number: 21
  type: single
  page: 1
  stem: 利瑪竇來到中國宣教之際，透過什麼方式取得中國士人的信任，並結交了幾個重要的中國好友？
  options:
  - label: A
    content: 積極傳入西方科技思想
  - label: B
    content: 接受中國傳統多神信仰
  - label: C
    content: 禁止中國人民祭祖祭天
  - label: D
    content: 傳教過程吸收佛教教義
  group_stem: '西元1582 年，利瑪竇和同伴們到達澳門，開始他在中國漫長的傳教生涯。利瑪竇剛到中國時，稱呼自己是來自天竺的和尚，甚至穿起僧人的衣服，這一度讓還不了解天主教的中國人誤會以為他們是來宣揚佛教的。

    為了引起中國人的注意，利瑪竇不但學習漢語，還研讀儒家經典。他也不再穿著僧服，而把自己打扮得像一個中國的讀書人，並開始遊走中國各地，從澳門到廣東，到江西和南京，最後落腳北京。一路上，他與中國官員有很多交流機會，他將自己所知的西方科學，特別是數學、天文學和地圖學，透過書籍翻譯，教給這些中國的知識分子，同時也藉機傳教。後來與他來往最為密切的幾個中國朋友，如李之藻和徐光啟，都是被這些科學知識所吸引。利瑪竇還曾經描繪中國第一幅有經緯度的世界地圖，並呈給當時在位的明朝萬曆皇帝。

    但新來的天主教，並不能立刻融入中國文化之中。當時的佛教徒與儒生，就常常對天主教教義提出質疑。而且，中國人重視祭祖，天主教卻認為只有上帝是真神。為了順利推動傳教，利瑪竇只好説，祭天或祭祖與天主教教義沒有本質上的衝突，轉信天主教的中國信徒仍然可以繼續拜祖先。但不是所有人都能接受利瑪竇的看法。到了清朝康熙年間羅馬教廷下令禁止教徒祭祖，讓原本頗為支持傳教士的康熙皇帝很不高興。這個衝突愈演愈烈，到了雍正年間，天主教的傳教行為，在中國遭到全面查禁。'
  answer:
  - A
  answer_source: answer_key_vlm
  tags:
    chapter:
      publisher: 翰林
