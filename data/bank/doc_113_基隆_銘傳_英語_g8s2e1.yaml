  group_stem: 'Cheetahs have a short brown coat that has small black spots. This helps
    them to hide. There are no spots on their white stomachs. The female cheetah is
    usually smaller than the male. This animal is known for being the fastest of all
    the land animals on Earth. They can accelerate from 0 to 60 miles in around 3
    seconds. This is faster than most sports cars!

    Cheetahs are found in Africa. Male cheetahs often group together with brothers.
    As for female cheetahs, they only hunt with their kids. Baby cheetahs are called
    cubs. A mother cheetah usually takes care of 2 to 8 cubs. Cheetahs eat deer, impalas,
    and rabbits. They hunt usually in the early morning or late afternoon. Once they
    see prey, they will move quietly and get as close as they can and then use their
    terrible speed to catch the prey. When they get the prey, they will eat it as
    fast as possible before a lion takes it away.

    A healthy cheetah will live for 12 years. However, lions hunt cubs, and many don''t
    survive their first year. There are less than 7,500 cheetahs left, making them
    the most endangered big cat in Africa.


