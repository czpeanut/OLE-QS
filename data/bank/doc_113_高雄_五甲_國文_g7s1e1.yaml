- id: doc_113_高雄_五甲_國文_g7s1e1_s3_21
  section: 3
  number: 21
  type: single
  page: 2
  stem: 「今生今世／我最難忘的哭聲有兩次／一次，在我生命的開始／一次，在妳生命的告終／第一次，我不會記得，是聽妳說的／第二次，妳不會曉得，我說也沒用／但兩次哭聲的中間啊，有無窮無盡的笑聲／一遍一遍又一遍／迴盪了整整三十年／妳都曉得，我都記得」（余光中母親日）以上這首詩，與胡適母親的教誨一文相比，有何共同之處？
  options:
  - label: A
    content: 皆是感念母親的愛之深責之切
  - label: B
    content: 皆感恩母親給予作者在待人接物上的影響
  - label: C
    content: 皆表達深厚的孺慕之情
  - label: D
    content: 皆表達慈烏反哺的心意。
  lesson_raw:
    title: 母親的教誨
    basis: 題目提及胡適《母親的教誨》
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
