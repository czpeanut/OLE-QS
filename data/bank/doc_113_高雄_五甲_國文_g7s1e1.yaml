  stem: 「當街燈亮起來向村莊道過晚安。」此句話中利用「道」字讓街燈「人性化」，使物具有人的動作、行為、思想、感情等特性，讓文句變得更為活潑生動，這樣的修辭方式稱為「擬人法」。請問下列選項中的文句，何者使用了這種寫作手法？
  options:
  - label: A
    content: 臭老貓／快走開／別到我家窗口來／快走開呀快走開／好讓我把／鹹魚掛起來
  - label: B
    content: 一隻青蛙叫了一聲／所有的青蛙都跟著叫不停／整個夏天晚上／都是牠們的聲音
  - label: C
    content: 書是一扇神奇窗／打開書／就看見奇妙景象
  - label: D
    content: 月姑娘性溫柔／每天見面微微笑／害羞時候不見了。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
