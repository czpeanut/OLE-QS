- id: doc_113_高雄_五甲_國文_g7s1e1_s3_23
  section: 3
  number: 23
  type: single
  page: 3
  stem: 「有很多個人風格強烈的藝術家，創作很主觀，並不考慮大眾品味；流行藝術則以作出能讓大眾喜歡的作品為目標。五月天出道以來，歌詞主題不是愛情就是勵志，樂曲不是抒情就是輕快的搖滾，一直緊扣青少年的口味。像這樣市場走向的樂團，很容易陷進被市場左右的險境，但他們對創作有很高的自覺，一首歌寫出來，就能成功引領歌迷，所以可以在這條鋼索上維持平衡，往他們想去的地方前進。」（改寫自成英姝〈貼身聽看五月天〉）依據上文，作者認為五月天能在哪兩者之間維持平衡？
  options:
  - label: A
    content: 抒情曲風、搖滾曲風
  - label: B
    content: 回顧經典、超越前衛
  - label: C
    content: 保持自我、迎合市場
  - label: D
    content: 成年人品味、青少年品味。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
