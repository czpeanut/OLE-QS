  group_stem: "How the Christmas ‘candy cane’ came to be\n    The candy cane began\
    \ life in the 1670s in a part of what is now Germany. Similar candies were popular\
    \ across Europe at the time. They were just hard, straight sticks made of sugar.\
    \ Supposedly, a German choirmaster gave these candies to his choirboys during\
    \ services to stop them from misbehaving. However, the church protested that candy\
    \ wasn’t appropriate, given that church was meant to be a solemn place. Rather\
    \ than giving up, the choirmaster bent the candy sticks to make them resemble\
    \ shepherds’ crooks, as Jesus is often compared to a shepherd who cares for his\
    \ followers. This way, they’d take on a religious meaning to satisfy the church.\
    \ The hook also makes the candy convenient to hang on Christmas trees. This phenomenon\
    \ was first documented(被文件記載) in 1847, when a German-Swiss immigrant(瑞士籍的美國移民)to\
    \ the US decorated a tree with them.\n    According to some, the candy cane’s\
    \ appearance(外貌) has religious interpretations(宗教意義). In addition to its shape,\
    \ the red stripe(紅條紋) represents the blood of Christ, while the white stripe(白條紋)\
    \ is for his purity(純潔). The candy’s solid structure is the solid foundation(厚實的根基)\
    \ of the Church. Whether or not you follow Christianity, candy canes are a nice\
    \ treat at Christmas time.\n* Germany 德國 *supposedly avj. 據說 * choirmaster n.\
    \ 唱詩班指揮 * choirboy n. 唱詩班男童 * misbehaving(v)行為不端* protest v.抗議 * solemn adj.莊嚴的\
    \ * bent 彎曲 *shepherd 牧羊人 * hook 鉤子 * phenomenon 現象"
