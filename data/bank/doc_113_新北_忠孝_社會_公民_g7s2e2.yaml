questions:
- id: doc_113_新北_忠孝_社會_公民_g7s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 文化是人類為求生存，適應或改變環境所創造的一切生活方式的總稱。請問：下列關於文化的敘述何項正確？
  options:
  - label: A
    content: 亞馬遜雨林屬於文化
  - label: B
    content: 文化位階能促進文化的平等
  - label: C
    content: 所有的人類社會都有文化的存在
  - label: D
    content: 文化越單一越好，能減少文化衝突
- id: doc_113_新北_忠孝_社會_公民_g7s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 臺灣料理受到許多國家的喜愛，也能從其他國家的文化中汲取特色加以變化。例如：臺灣改良泰國菜的金錢蝦餅，發展出了月亮蝦餅；將臺式炒空心菜加入蝦醬，做成蝦醬空心菜等，形成臺灣多樣的飲食文化。請問：下列哪一個概念可以說明上述臺灣飲食的特色？
  options:
  - label: A
    content: 文化傳承
  - label: B
    content: 文化創新
  - label: C
    content: 文化位階
  - label: D
    content: 文化資產
- id: doc_113_新北_忠孝_社會_公民_g7s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 甲國的旅遊網站曾將臺灣的豬血糕評比為「世上十大噁心食物」的第一名。名單發布後，許多人認為這份名單是站在甲國的立場所訂定，對於上榜的國家與其食物並不公平，要求該網站下架並道歉。請問：根據多元文化的精神，下列何種做法較能防止上述現象再度發生？
  options:
  - label: A
    content: 理解自我文化並且加以肯定與認同
  - label: B
    content: 以自身文化作為基準提出改善策略
  - label: C
    content: 能設身處地以他人的文化進行思考
  - label: D
    content: 引進他國的文化有利於文化的傳承
- id: doc_113_新北_忠孝_社會_公民_g7s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 在臺灣，許多人在吃魚時，會在第一面吃完後直接用筷子將魚翻面，但是出海打魚的人有著吃魚不能翻面的忌諱，因為翻面就意味著翻船，有的人甚至把魚看成是船的化身，連魚都不吃。請問：上文所提到的忌諱屬於何種社會規範？
  options:
  - label: A
    content: 風俗習慣
  - label: B
    content: 倫理道德
  - label: C
    content: 宗教信仰
  - label: D
    content: 法律
- id: doc_113_新北_忠孝_社會_公民_g7s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 近年來，關於博愛座的讓座爭議層出不窮。多起因讓座而起的衝突事件，也掀起檢討博愛座是否有設置必要的聲浪。人們了解社會上有許多從外表看不出來不適的人，可能也有使用博愛座的需求，因此相關單位開始宣導，任何座位都可以禮讓給「有需要」的乘客，鼓勵乘客能夠關懷和同理有座位需要者，讓座給有需要者。請問：「讓座」屬於何項社會規範？
  options:
  - label: A
    content: 風俗習慣
  - label: B
    content: 倫理道德
  - label: C
    content: 宗教信仰
  - label: D
    content: 法律
- id: doc_113_新北_忠孝_社會_公民_g7s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 曾有語言學家估計，約每兩週就有一種語言死亡。還有學者悲觀的認為，五十年後，約有三千種語言或方言消失，他感嘆的說：當語言死亡以後，那個群體的特有知識就此喪失，也關上了一扇可以觀察世界的獨特窗戶。請問：上述顯示何項概念的重要性？
  options:
  - label: A
    content: 文化傳承
  - label: B
    content: 文化創新
  - label: C
    content: 文化位階
  - label: D
    content: 文化交流
- id: doc_113_新北_忠孝_社會_公民_g7s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 政府致力於發展多元文化，希望讓社會呈現多元文化的樣貌，有助於各種文化的傳承，也能維持社會文化的多樣性；例如，我國制定了《國家語言發展法》，將各族群語言列為國家語言，保障語言得以延續下去。請問：上述的做法屬於以何種方式保障多元文化？
  options:
  - label: A
    content: 肯定與認同自我文化
  - label: B
    content: 建立相互尊重的態度
  - label: C
    content: 以法律保障多元文化
  - label: D
    content: 能設身處地以他人的文化思考
- id: doc_113_新北_忠孝_社會_公民_g7s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 日治時期，日本政府推行「皇民化運動」，以及國民政府時期「國語運動」政策下，許多母語受到很大的限制，甚至被禁止在公共場合使用。請問：上述呈現何種現象？
  options:
  - label: A
    content: 文化傳承
  - label: B
    content: 文化創新
  - label: C
    content: 文化位階
  - label: D
    content: 文化交流
- id: doc_113_新北_忠孝_社會_公民_g7s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 社會規範能發揮指導與約束人們行為的作用，有助於穩定社會秩序與維持和諧的人際關係。請問：下列有關社會規範的敘述何項正確？
  options:
  - label: A
    content: 國家針對社會最高限度的行為準則制定法律
  - label: B
    content: 人們相信「舉頭三尺有神明」是一種風俗習慣
  - label: C
    content: 宗教信仰有特定的教義和戒律，屬於「正式規範」
  - label: D
    content: 第六倫著重個人與社會大眾的關係，又稱為群己倫理
- id: doc_113_新北_忠孝_社會_公民_g7s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 2019 年立法院通過了《司法院釋字第748 號解釋施行法》，臺灣成為亞洲第一個同性婚姻合法化的國家。請問：上文可以說明何種現象？
  options:
  - label: A
    content: 法律是經長久累積、約定俗成的生活經驗
  - label: B
    content: 社會規範會與時俱進、刪改或創造新的內容
  - label: C
    content: 非正式規範能啟迪個人內在良知與約束外在行為
  - label: D
    content: 國家會透過非正式規範來改變不合時宜的正式規範
- id: doc_113_新北_忠孝_社會_公民_g7s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 國立政治大學延長原住民族的歲時祭儀假為5 日，此做法有助於下列何項文化概念的形成？
  options:
  - label: A
    content: 文化傳承
  - label: B
    content: 文化位階
  - label: C
    content: 文化創新
  - label: D
    content: 文化衝突
  group_stem: 內政部自2010 年起將歲時祭儀假納入國定假日，擁有原住民身份的員工可享有一天的帶薪假期。另外教育部也表示，原住民學生每學年可請歲時祭儀假1
    日，學校應核予公假；若學生因宗教、種族、地域而參加節慶或文化活動，而有請假需求者，也請學校予以准假。另外，由於多數祭儀都在2 日以上，加上考量往返原鄉及祭儀準備等時間，原先主管機關僅給予1
    日顯然有所不足，因此國立政治大學決議將歲時祭儀假延長為5 日。
- id: doc_113_新北_忠孝_社會_公民_g7s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 由歲時祭儀假的實施，可以了解各民族都有感謝自然、傳承文化而舉行的儀式。請問：由此可見文化的何項特性？
  options:
  - label: A
    content: 普遍性
  - label: B
    content: 差異性
  - label: C
    content: 累積性
  - label: D
    content: 制約性
  group_stem: 內政部自2010 年起將歲時祭儀假納入國定假日，擁有原住民身份的員工可享有一天的帶薪假期。另外教育部也表示，原住民學生每學年可請歲時祭儀假1
    日，學校應核予公假；若學生因宗教、種族、地域而參加節慶或文化活動，而有請假需求者，也請學校予以准假。另外，由於多數祭儀都在2 日以上，加上考量往返原鄉及祭儀準備等時間，原先主管機關僅給予1
    日顯然有所不足，因此國立政治大學決議將歲時祭儀假延長為5 日。
- id: doc_113_新北_忠孝_社會_公民_g7s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 請問文中第三行畫線處是在表達文化具有何項特性？
  options:
  - label: A
    content: 普遍性
  - label: B
    content: 差異性
  - label: C
    content: 累積性
  - label: D
    content: 制約性
  group_stem: "家政課時同學們正在討論衣服的穿搭，有同學提出男生為什麼不可以買褲裙？有同學覺得可以，也有同學發出噗嗤一笑，甚至有同學說：在臺灣社會，沒有男生在穿裙子的啦！\n\
    \  這時有同學提出Cosplay(角色扮演)的文化，這些喜好動畫、漫畫、電玩、電影、戲劇或偶像團體的「迷」，刻意穿著角色的服飾，加上道具、化妝、肢體動作、語言等，來模仿自己心愛的偶像；其中也不乏有男性Cosplay\
    \ 女性的角色，因此也會出現穿裙裝的裝扮。"
- id: doc_113_新北_忠孝_社會_公民_g7s2e2_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: 根據上文，下列敘述何項正確？
  options:
  - label: A
    content: Cosplay 屬於臺灣社會的主流文化
  - label: B
    content: 世界各國都有Cosplay 的文化，可見文化的累積性
  - label: C
    content: Cosplay 屬於臺灣的強勢文化，支配漢民族的主流文化
  - label: D
    content: Cosplay 屬於次文化，意指某個群體發展出專屬自身的獨特文化
