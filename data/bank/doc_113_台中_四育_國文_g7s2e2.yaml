    content: 阿喬：「劍外忽傳收薊北」描寫杜甫跟隨軍隊征戰劍門關，最終收復了薊北。
  - label: B
    content: 大凱：此詩以「狂」字貫串全文，為杜甫「生平第一首快詩」。
  - label: C
    content: 安安：本詩後半段連用四個地名，表現出「輕捷快速」之感。
  - label: D
    content: 興仔：「初聞涕淚滿衣裳」描寫了作者思鄉心切之悲痛。
