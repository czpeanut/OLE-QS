  type: single
  page: 1
  stem: 下列同學對〈過華清宮〉一詩的解說，何者有誤？
  options:
  - label: A
    content: 宸宸：作者藉「宋太宗寵愛慈禧太后」的故事抒發感懷，直接諷刺了唐朝國勢衰頹之因。
  - label: B
    content: 晴晴：本詩虛實相間，除了首句「長安回望繡成堆」實際寫景外，其餘皆是作者想像。
  - label: C
    content: 軒軒：「山頂千門次第開」顯示出宮殿的盛壯及氣象磅礡。
  - label: D
    content: 甄甄：末句以「荔枝來」解答「次第開」、「一騎」、「妃子笑」等懸念，而「無人知」更凸顯了整件事的荒唐。
  lesson_raw:
    title: 過華清宮
    basis: 題目指明詩名〈過華清宮〉
