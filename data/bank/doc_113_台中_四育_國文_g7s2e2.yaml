  type: single
  page: 2
  stem: 以下是庭庭上課所做的筆記，一時大意寫錯一處。筆記中的錯處應是下列何者？
  options:
  - label: A
    content: 絕句與律詩的差別是在「句數」：絕句為四句，律詩為八句。
  - label: B
    content: 近體詩偶數句必須押韻，且必須一韻到底，不可轉韻。
  - label: C
    content: 五言律詩與七言絕句總共差了八個字。
  - label: D
    content: 「律詩」共有四聯，照順序由先而後是「首聯」、「頷聯」、「頸聯」、「尾聯」。
