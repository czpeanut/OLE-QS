- id: doc_113_台中_四育_國文_g7s2e2_s1_32
  section: 1
  number: 32
  type: single
  page: 3
  stem: 此詩表達了作者的兒子讀書時，最需要改進的是？
  options:
  - label: A
    content: 想法過於天馬行空，脫離現實。
  - label: B
    content: 不析字解義，錯字連篇，文意錯亂。
  - label: C
    content: 常分心神遊，需大人在一旁鞭策。
  - label: D
    content: 解釋時見招拆招，自以為是。
  group_stem: "兒子唸國小二年級時／曾到南國幾趟／紅豆生南國／春來發幾隻／每一趟都採了好幾隻／令家裡的王維無心相思 \n \n唸小四時／他去過陝西長安樂遊原／象晚意不適／驅車登古原／他媽媽好火／李義山的媽媽更火：「象也會開車！」／兒子趕快叫大象下車\
    \  \n \n後來，就讀中學／有一天緣溪行／忽逢東晉桃花源／見愚人…… ／媽媽手中的教鞭很生氣／兒子趕快塗改：見漁人，奶大驚／漁人也大驚／於是，不設酒殺雞了\
    \  \n渡也〈奶大驚〉"
