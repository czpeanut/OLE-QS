  stem: 下列同學對〈登鸛雀樓〉一詩的解說，何者完全正確？
  options:
  - label: A
    content: 小絜：「白日依山盡」可看出這首詩的時間是在黃昏日落。
  - label: B
    content: 婕婕：「黃河入海流」是倒裝句，正確還原為「海流入黃河」。
  - label: C
    content: 阿杰：「黃河入海流」是作者想像，他根本沒看到黃河。
  - label: D
    content: 桀仔：這首詩極力描寫景色壯麗，是難得一見的「山水田園派」佳作。
