- id: doc_113_台中_四育_國文_g7s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 珍古德博士曾說﹕「唯有了解，才會關心；唯有關心，才會行動；唯有行動，生命才有希望。」下列句子，何者最能與珍古德博士所認為的「動物保育根本」相呼應﹖
  options:
  - label: A
    content: 沒有石虎，山林彷彿被掏空心臟，靜寂地存在。
  - label: B
    content: 牠像現實世界裡的龍貓，幫我們為淺山鑲嵌了一顆璀璨寶石。
  - label: C
    content: 晚近石虎的數量銳減，可能繼雲豹後滅絕，大家開始更細膩的關切。
  - label: D
    content: 我們對這一環境的動植物生態欠缺完整的認識，很少以此做為生態保育題材。
