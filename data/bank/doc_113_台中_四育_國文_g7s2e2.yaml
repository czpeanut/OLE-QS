  page: 1
  stem: 關於〈風箏〉ㄧ詩的敘述，下列何者完全正確？
  options:
  - label: A
    content: 「長長一生莫非這樣一場遊戲吧」把人生比喻為遊戲，啟示讀者要輕鬆面對，遇事不應太過嚴肅。
  - label: B
    content: 「細細一線，卻想與整座天空拔河」象徵人類的渺小與自不量力。
  - label: C
    content: 「沿著河堤，我開始拉著天空奔跑」表現出「人定勝天」的雄壯豪情。
  - label: D
    content: 全詩「以小喻大」，勉人要趁年輕時及早立定目標。
