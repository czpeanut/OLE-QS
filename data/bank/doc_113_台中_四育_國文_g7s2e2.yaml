  type: single
  page: 1
  stem: 「假若三義車站能以石虎為地標，搭配鎮上的火焰山生態教育館，結合周遭淺山步道，這兒可以形成新的生態旅遊景點。一如琉球西表島的山貓，帶來觀光資源。」作者這段話主要想表達什麼？
  options:
  - label: A
    content: 西表島山貓觀光產業及保育已是成功案例，可供眾人參考。
  - label: B
    content: 因石虎棲地遭受破壞，提出移居外島發展保育計畫。
  - label: C
    content: 石虎與西表島山貓物種相近，可藉人工方式交配繁殖。
  - label: D
    content: 以西表島山貓的知名度，喚起同胞對生態保育的重視。
  lesson_raw:
