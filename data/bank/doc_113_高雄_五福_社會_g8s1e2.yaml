- id: doc_113_高雄_五福_社會_g8s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 巴黎奧運使用大量中國製的器材與商品，這個現象可反映中國社會的哪項特色？
  options:
  - label: A
    content: 大量向外移民，形成文化擴散的現象
  - label: B
    content: 國內市場萎縮，只能開發海外市場
  - label: C
    content: 生產規模大產量多，成為「世界工廠」
  - label: D
    content: 礦產不敷使用，重工業轉型為輕工業
  group_stem: '2024 年夏季奧林匹克運動會在法國 巴黎舉辦，大會所使用的各類運動器材和周邊商品有許多來自於中國 浙江省及江蘇省的城市。不僅各國的參賽選手，連全球觀眾都能透過賽事轉播，感受到這股來自中國的隱形力量。

    2023 年中國超越德國、日本，成為全球第一大汽車出口國，全球市佔率達52%，其中電動車是推動汽車業快速增長的關鍵，銷量佔全球汽車總銷售量18%；2024
    年銷量預計可達1700 萬輛，全球佔比升至20%，且中國品牌比亞迪已超過美國 特斯拉，成為全球最大電動車製造商。電動車主要市場從北歐轉變為中國國內。

    中國電動車製造商走出國門，在「一帶一路」沿線國家開設電池工廠，如：德國、匈牙利等，以求建立完備的汽車產業鏈，並研發電池、儲能等關鍵技術，強化性能。而印尼是世界最大鎳產量國家，恰是電池與不鏽鋼所需的金屬，因而獲得中國製造商青睞，將在當地投資100
    億美元，預計十五年內完成生產線。'
