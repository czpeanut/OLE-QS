  section: 1
  number: 14
  type: single
  page: 2
  stem: 從高鐵網路線的延伸及擴建計畫推斷，此交通建設的規劃最可能有下列何項影響？
  options:
  - label: A
    content: 促進工業升級與轉型
  - label: B
    content: 紓緩龐大的人口壓力
  - label: C
    content: 提高農業的生產效率
  - label: D
    content: 改善區域的發展落差
  group_stem: '中國自2008 年配合北京奧運，第一條京津高鐵(北京到天津)通車後，正式邁入時速300 公里以上的高速鐵路新時代，並陸續在各省興建，目前已開通範圍涵蓋31
    個省級行政區，超過4.4 萬公里，通車里程數全球第一；預計到2025 年將完建約6 萬公里的高速鐵路網，為「八縱八橫」的規劃，路線詳見圖(3)及圖(4)。其中「陸橋通道」為主要的橫向鐵路線，全長3422
    公里，由江蘇的連雲港，至新疆的烏魯木齊，連接中國西北、中原和華東地區。

    高鐵改變了人民移動的方式，高鐵沿線的城市及風景區，也因「高鐵旅遊」而受惠。高鐵已經成為中國人出行必不可少的選擇，旅客數年均增長在30%以上，每天開行的高速動車組達4200
    多列，日運量更有400 萬旅客人次。高鐵網路基本連接省會城市和50 萬人口以上的中大型城市，實現相鄰兩城市間形成1 至4 小時交通圈。而西藏自治區及澳門特別行政區暫無修建計劃。

    【資料來源：維基百科】'
