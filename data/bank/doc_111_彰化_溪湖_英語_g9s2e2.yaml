  stem: 64. What can you learn from Elizabeth’s culture notes?
  options:
  - label: A
    content: Speaking Chinese helps make Taiwanese friends.
  - label: B
    content: Doing well on tests isn’t important for Americans.
  - label: C
    content: People in the USA only take tests in schools.
  - label: D
    content: People in Taiwan like to live in busy but convenient places.
  group_stem: '【B】

    Elizabeth White is an exchange student from the USA. The following is her culture
    notes while she is staying in Taiwan.

    Age

    In my country, people count their age based on the years and months after they
    are born. However, many Taiwanese people say they are one year old when they are
    born. If I count my age this way, I will be one year older!

    Test

    People in Taiwan take tests not only when they are in school but after they leave
    school. A Taiwanese told me, if you want to work for the government here, you
    need to take a test. Only people who do very well on it get the jobs. In the USA,
    government jobs don’t pay that well, so not many people are interested in them.

    City vs. Country

    A lot of people in Taiwan enjoy living in the city because all the shops, restaurants,
    and public transportation are close to their houses. It’s so different in the
    USA, where many people like to work in the city but live in quieter suburbs. Therefore,
    convenience stores such as 7-11 and night markets are seldom seen next to where
    you live.

    📖 exchange 交換 based on 根據 government 政府 transportation 交通 suburb 郊區'
