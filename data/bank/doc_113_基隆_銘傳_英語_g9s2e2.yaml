- id: doc_113_基隆_銘傳_英語_g9s2e2_s6_54
  section: 6
  number: 54
  type: single
  page: 4
  stem: 54. (　) What is the main idea of the dialogue?
  options:
  - label: A
    content: Getting fit for a long race.
  - label: B
    content: Eating better to get in shape.
  - label: C
    content: Trying slow jogging to slim down.
  - label: D
    content: Getting stronger at the gym.
  group_stem: 'Sara: John, I really want to lose some weight, but I don''t feel comfortable
    going to the gym. It''s too expensive, and there are too many people. I just don''t
    like it.


    John: I totally understand, Sara. You don''t have to go to a gym to lose weight.
    How about trying slow jogging?


    Sara: Slow jogging? What''s that? I''ve never heard of it before.


    John: Slow jogging is a type of running, but at a very slow pace. It was invented
    by a Japanese professor named Dr. Hiroaki Tanaka. He wanted to create an exercise
    that was gentle on the body and could be done by anyone, even beginners.


    Sara: That sounds interesting. But if it''s so slow, will it really help me lose
    weight?


    John: Yes, it will! The good thing about slow jogging is that you can do it for
    a longer time without feeling tired. Because you''re going slowly, it''s easier
    on your body, and you can jog for 30 minutes or even longer. This helps you burn
    fat, and you don''t need to run fast.


    Sara: I like the idea of going at my own pace without feeling too busy. But do
    I need special equipment for slow jogging?


    John: No special equipment is needed! Just wear comfortable clothes and good running
    shoes. You can do it anywhere—at the park, around the neighborhood, or even in
    our backyard. It''s easy and you don''t need to go to a gym.


    Sara: That sounds perfect! What else is good about slow jogging?


    John: Slow jogging is good not only for losing weight but also for your heart.
    It can make you feel less worried and sleep better. It''s also easy on your joints,
    which is good if you have any joint pain or are just starting exercise.


    Sara: That sounds really good! I think I''ll give it a try. Thank you for your
    idea, John.


    John: I''m happy to help you, Sara! Let''s do slow jogging together and have fun.


     pace 步調 invent 發明 professor 教授 neighborhood 附近地區 joint 關節'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
