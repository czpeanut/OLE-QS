- id: doc_113_新北_永和_自然_g8s2e1_s1_35
  section: 1
  number: 35
  type: single
  page: 4
  stem: 將點燃的鎂帶放進二氧化碳的集氣瓶中，則下列敘述何者錯誤？ (活性:Mg>C)
  options:
  - label: A
    content: 反應完後瓶壁上有黑色斑點附著，此黑色物質為碳
  - label: B
    content: 鎂帶可以繼續燃燒
  - label: C
    content: 此反應中鎂被還原，二氧化碳被氧化
  - label: D
    content: 此反應的反應式為：2Mg＋$CO_{2}$ → 2MgO＋C
  group_stem: '【仙女棒】

    仙女棒是小孩和情侶最喜歡的煙火產品之一，在黑暗中看著綻放的火花，也是不少人心中熟悉的畫面。小小一根仙女棒，卻能有這樣的聲光效果，究竟是應用什麼化學反應的原理呢？
    仙女棒的組成可分為燃料組及氧化劑組，燃料組是指透過黏著劑固著在鐵棒上的鋁鎂合金粉、鐵粉和碳粉等物質。氧化劑組包括硝酸鉀與過氯酸鉀，當仙女棒燃燒時，硝酸鉀遇熱生成氧，幫助燃料組燃燒；過氯酸鉀則是使燃料組發生小爆炸，產生視覺上的火花。仙女棒燃燒時會發出不同顏色的色光與成分有關，例如：鋁鎂合金燃燒產生白光、鈣化合物是橙光、鈉化合
    物是黃光、鋇化合物是綠光、鉀化合物則是紫光。 燃燒是劇烈的氧化還原反應，常伴隨熱與光的產生，雖然仙女棒的燃燒伴隨著多種化學反應，使得能量大多以光的形式釋出
    ，讓人感受到的熱度不高，但燃燒後的仙女棒一樣要等冷卻後，再丟棄避免發生危險。並且需特別留意，鎂粉遇水會有劇烈反應，若不慎發生火災，需慎選滅火方式。試回答下列第35~36
    題'
