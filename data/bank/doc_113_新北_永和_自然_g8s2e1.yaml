  section: 1
  number: 31
  type: single
  page: 3
  stem: 抗氧化劑能夠減少食物被氧化的機會，其原因為何？
  options:
  - label: A
    content: 抗氧化劑比食物及茶葉容易發生氧化反應
  - label: B
