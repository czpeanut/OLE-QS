- id: doc_113_新北_永和_自然_g8s2e1_s1_26
  section: 1
  number: 26
  type: single
  page: 3
  stem: $SO_{2}$ ＋$2H_{2}O$＋$I_{2}$→$H_{2}SO_{4}$ ＋2HI，上述反應中何者發生氧化，何者發生還原？
  options:
  - label: A
    content: $H_{2}O$ 發生氧化，$SO_{2}$ 發生還原
  - label: B
    content: $I_{2}$ 發生氧化，$SO_{2}$ 發生還原
  - label: C
    content: $SO_{2}$ 發生氧化，$H_{2}O$ 發生還原
  - label: D
    content: $SO_{2}$ 發生氧化，$I_{2}$ 發生還原。
  group_stem: '【漂白劑】

    一般的漂白劑主要可分為兩種：氧化型漂白劑和還原型漂白劑。

    氧化型漂白劑：雙氧水（$H_{2}O_{2}$）或漂白水（次氯酸鈉，NaClO）均可與物體發生反應，使物體氧化，進而改變物體的顏色。

    還原型漂白劑：二氧化硫（$SO_{2}$）與碘液（$I_{2}$），反應式為 $SO_{2}$＋$2H_{2}O$＋$I_{2}$→$H_{2}SO_{4}$＋$2HI$，可使碘還原，故可改變碘液的顏色。或二氧化硫（$SO_{2}$）先與水反應變成亞硫酸（$H_{2}SO_{3}$）後再與物體結合變成無色的物質，但此無色物質見光遇熱易分解，從而使有色物質恢復顏色。例如以二氧化硫燻過的草帽或竹筷或紙張，用久後會回復原來的顏色。請回答下列第26~27
