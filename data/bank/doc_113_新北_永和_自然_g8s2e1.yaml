    兒茶素（Catechin），又稱茶單寧，兒茶酸，是茶葉中黃烷醇類(黃烷-3-醇)物質的總稱，兒茶素是茶多酚中最重要的一種，約占茶多酚含量的75%到80%，也是茶的苦澀味的來源之一。

    兒茶素是一種極佳的抗氧化劑，可以清除體內自由基，其抗氧效果甚至比維生素E 還要好， 以兒茶素氧化程度區分，可分為不發酵的綠茶、部分發酵的烏龍茶以及完全發酵的紅茶。請回答下列第31~32
    題:'
