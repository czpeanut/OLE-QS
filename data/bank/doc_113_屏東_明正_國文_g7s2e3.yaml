  stem: 「年輕的時候，蘇軾的生命像一朵燦爛、高傲、自負的花；現在，落難□□，覺得「花」被「泥」土弄髒了。「□□□□□□□，□□□□□」，此一時期，東坡的詩句好像在反覆問自己：你還要不要這麼潔癖，這麼堅持要不要像一朵花，固執自己的高貴潔淨，不肯隨汙濁世俗同流合汙？」蔣勳〈寒食帖〉。根據文意脈絡，上文缺空處填入下列何者最恰當？
