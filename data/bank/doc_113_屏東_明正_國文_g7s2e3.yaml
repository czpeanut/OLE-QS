  group_stem: 散文家思果說：「陳之藩的文字是雅潔上品，今天的學生可以捧了去熟讀學習的。我看得出他在遣詞造句上用了工夫，平仄的協調尤其注意。這種文章讀起來，像吃爽口的菜，喝有味的湯。他的句子，長短正好，用的字總很得當。這和他小時讀了舊詩文大有關係。」的確是如此的，陳之藩小時候，他的父親就要他背古文、唐詩，如果背不出來，就不讓他吃飯。他對中國傳統文學的認識可以說是父親逼出來的；他還記得〈討武曌檄〉、〈過秦論〉、〈哀江南賦〉……等等，背書雖苦，不過陳之藩卻認為：中國人的背書方法不能小看它，年紀愈小愈容易訓練，大了反而不容易了。他從小作文就流暢，也許與背書有很大的關係吧！
