  stem: 根據本文，下列敘述何者正確？
  options:
  - label: A
    content: 與犬類相比，人類表觀遺傳時鐘的運作較為緩慢
  - label: B
    content: 奥斯塔德以演化生物學為基礎，推導出新的公式
  - label: C
    content: 人們藉分析表觀遺傳資料，已找出狗早夭的原因
  - label: D
    content: 比起其他犬類，拉不拉多犬步入中年的時間較早
  group_stem: "請閱讀以下短文，並回答9~10 題：\n 過去坊間流傳的說法為「狗的一歲等於人類的七歲」，因此狗狗十歲時，代表牠的生理年齡已是人類的七十歲了。不過，現在科學家提出了另外一種更科學的換算方式。這種新的算式主要是參考了「表觀遺傳時鐘」的概念，可以用來判斷動物的生理年齡。\n\
    \ 無論是什麽品種的狗狗，基本上發展的軌跡都大同小異：在十個月左右進入青春期，在二十歲前過世。以拉不拉多犬為例，實驗團隊對比了人類的表觀遺傳時鐘，而後得出了一個比坊間流傳說法來得複雜一些的新公式：\n\
    \ 狗狗的人類年齡=16x+31\n 下表為狗狗的實際年齡所對應的x 值：\n| 狗狗的實際年齡 | 1 歲 | 2 歲 | 3 歲 | 4 歲 | 5 歲\
    \ | 6 歲 | 7 歲 |\n|---|---|---|---|---|---|---|---|\n| 對應的x 值 | 0 | 0.7 | 1.1 |\
    \ 1.4 | 1.6 | 1.8 | 1.9 |\n| 狗狗的實際年齡 | 8 歲 | 9 歲 | 10 歲 | 11 歲 | 12 歲 | 13 歲 |\
    \ 14 歲 |\n| 對應的x 值 | 2.1 | 2.2 | 2.3 | 2.4 | 2.5 | 2.6 | 2.6 |\n 用這個公式後，人類的生命階段和狗狗（拉不拉多犬）的年齡似乎就可以搭得上線了。舉例來說，一個七週大的幼犬跟九個月大的人類嬰兒差不多大，再換算一下拉不拉多犬的平均壽命（十二歲），對應到的x\
    \ 值為2.5，代入公式後為七十一歲，比對全球人類的平均壽命（七十二歲），有没有發現也很接近呢！\n 總體而言，犬類的表觀遺傳時鐘轉得比人類來得快多了，如果依照公式來看，一隻兩歲的拉不拉多犬雖然看上去還像隻小狗狗，但牠其實已經中年了，而後，時鐘的變化會逐漸趨緩。\n\
    \ 另一位演化生物學家和老化專家奥斯塔德則對於實驗的結果並不感到意外，他認為這種技術如果應用於不同品種的生命週期等相關研究的話，說不定會有更多更加有趣的發現。相關的新研究現在也正不斷進行。像是凱柏林教授所帶領的「犬類衰老計畫」，就準備為所有犬類的表觀遺傳資料建檔。他們希望透過這種方式，找出為什麼有些犬類會在年紀比較小的時候得病或較早死亡。而其他犬類卻能活得健康長久。\n\
    \ 改寫自Peggy Sha〈想知道狗狗的年紀嗎？現在有更科學的算法啦！〉\n\n1.表觀遺傳時鐘：能反映生物生理年齡，呈現生物老化速度，甚至預測生物壽命的指標。"
