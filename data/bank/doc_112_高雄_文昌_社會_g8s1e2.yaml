    content: 明。
  group_stem: '根據史料統計唐朝人口超過十萬的城市有 10 個，到了此時期增加到 40 個，其中最大的城市是汴京，人口應該超過百萬。人口的聚集改造了社會生活的樣貌。活絡的城市交易促進了普及的貨幣經濟，有方便人群聚攏的市場，又有方便的貨幣可以收費。音樂與歌唱、戲劇的演出也就能從宮廷中脫離出來，形成商業性的活動。此時期的城市生活中『瓦舍』與『勾欄』愈來愈重要，勾欄是舞台，瓦舍是表演廳。在《東京夢華錄》記載當時的首都最大的瓦舍可以容納十三個勾欄，而其中最大的勾欄，舞台邊可以容納一千多人，那個時代表演規模已經十分驚人！

    文章摘錄自：楊照，《不一樣的中國史9》'
