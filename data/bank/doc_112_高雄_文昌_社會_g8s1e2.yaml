- id: doc_112_高雄_文昌_社會_g8s1e2_s1_43
  section: 1
  number: 43
  type: single
  page: 5
  stem: 請問：文中扮演兩位君主交流的中間者，其身分應為下列何者？
  options:
  - label: A
    content: 海外探險家
  - label: B
    content: 穆斯林商人
  - label: C
    content: 官方外交人員
  - label: D
    content: 耶穌會傳教士。
  group_stem: '17 世紀後期至 18 世紀初期，歐亞大陸東端的中國與西端的法國，各自引領著東方與西方文化與藝術發展的風潮。

    當時中國的君主是清聖祖康熙皇帝，法國的君主是太陽王路易十四。路易十四曾向中國派遣了約 50 個人，這些人發現到兩君主間的驚人相似處，後來西方有句諺語說「康熙皇帝和路易十四國王受到同一個天使的保護」，就是從這裡來的。

    兩人都是年幼即登基，一由祖母、一由母后撫育、輔政，將兩位幼年君王培育成允文允武、仁民愛物、雅好藝術的全能君主。他們親政前都有權臣主政，親政後皆勤於政務，並且各自鞏固了愛新覺羅家族與波旁王室的帝王權力。當時分居兩地的君王經由這些中間者而有了間接的接觸。透過他們，路易十四對康熙皇帝有了比較清晰的認識，法國朝野人士也興起對中國文化與藝術的好奇與模仿。在他們的講授下，康熙皇帝認識並推廣了西方的科學、藝術與文化，使得當時清朝臣民中有不少潛心西學的人士。

    兩人的交流還留下一封未能送達的信，路易十四寫給康熙皇帝的信，雖然因故無法送達中國，但為雙方的交流留下見證。後來由於歷史的種種原因，東西方的文化交流發生中斷。隨著路易十四和康熙皇帝的時代過去，也標誌著東西文化交流進入了一個封閉時期，而東西方門戶再次打開，乃是一個多世紀以後的事情。那時，中西方社會都已經發生了天翻地覆的變化。

    改寫自網路文章《遙相輝映的東西文化：康熙與路易十四》https://www.epochtimes.com/b5/21/2/6/n12737276.htm'
