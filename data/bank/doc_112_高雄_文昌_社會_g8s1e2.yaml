- id: doc_112_高雄_文昌_社會_g8s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '中國作家莫言於《蛙》一書中，描寫到：「姑姑是當地專職接生員，整整五十年，接生了九千八百餘位嬰兒，是高密縣東北鄉公認的「活菩薩」、「送子娘娘」，數千名嬰兒都是在她的幫助下來到人間。當然，也有為數不少的嬰兒，在未見天日之前，夭折在她的手下…『你出生的那天下午，姑姑在河邊洗手，看到成群結隊的蝌蚪，在水中擁擠著。那年大旱，蝌蚪比水還多。這景象讓姑姑聯想到，這麼多蝌蚪，最終能成為青蛙的，不過萬分之一，大部分蝌蚪將成為淤泥。』」

