- id: doc_112_高雄_文昌_社會_g8s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 中國東部地區在中國國家政策的支持下，率先發展了起來，形成高度發達的城市群。之後，中國又提出「西部大開發」戰略，加速了西部諸多的基礎建設。這使得中國「某地區」因位於東部之後與西部之前，長期未能得到國家的關注，其經濟發展相對遲緩。下列哪一項具體作為，對上文中的「某地區」有所助益，藉此平衡區域發展？
  options:
  - label: A
