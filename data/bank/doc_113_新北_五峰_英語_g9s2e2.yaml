  group_stem: "Hey You! Turn Off That Light!\n    There are many kinds of pollution\
    \ killing our planet these days, all of which come from the humans living on it.\
    \ The Earth’s rivers and oceans are becoming __28__ dirty for fish __28__ live\
    \ in, and the air around us is becoming worse. Even the artificial lights we use\
    \ at night are a kind of pollution: “light pollution”.\n    ___29___ one little\
    \ light doesn’t affect people very much, those many lights we turn on at night\
    \ surely affect animals and insects very differently. Many animals and insects\
    \ use the sun to show them ___30___ way to go, how to find a mate, and even when\
    \ to wake up. To an animal or insect, an artificial light looks like a big, bright,\
    \ sun.\n    Every year, millions of migratory birds die after flying into buildings\
    \ at night. Moths, a kind of insecet, will fly to a source of artificial light\
    \ and keep flying around it until they die. ___31___ animals are woken up early\
    \ each night, fooled by the glow of the artificial lights into thinking it’s daytime\
    \ already. Artificial light can even make humans sick. So, the next time you see\
    \ a light on at night, ask yourself if you really need it. If you don’t, turn\
    \ off that light!\n✍pollution 汙染 artificial 人工的 affect 影響 mate 伴侶 migratory 遷徙的\
    \ glow 光輝"
