    \ Angkor Wat finally decided to end the elephant rides for good.\n    The working\
    \ elephants were moved to a safe location about 40 kilometers away from the park.\
    \ Their new home is filled with trees, rivers, and lots of food. Now, they can\
    \ finally live in peace—free from giving rides, and free to just be elephants.\n\
    ✍Angkor Wat 吳哥窟 Cambodia 柬埔寨 condition 情況 petition 請願書"
- id: doc_113_新北_五峰_英語_g9s2e2_s3_35
  section: 3
  number: 35
  type: single
  page: 3
  stem: What does it mean when a restaurant gets one Michelin star?
  options:
  - label: A
    content: The restaurant is very good.
  - label: B
    content: The restaurant is the most expensive in the city.
  - label: C
    content: The restaurant is new.
  - label: D
    content: The restaurant serves only French food.
  group_stem: "The Michelin Inspector\n    A Michelin star is a special award given\
    \ to some of the best restaurants in the world. It shows that the food, service,\
    \ and overall experience at the restaurant are excellent. Restaurants can get\
    \ one, two, or even three stars. One star means the restaurant is very good, two\
    \ stars show that it's excellent, and three stars mean the restaurant is truly\
    \ amazing and wonderful. These special restaurants are written in the Michelin\
    \ Guide, which many people around the world use to find great places to eat.\n\
    \    To get a Michelin star, a restaurant must be visited more than once by someone\
    \ called a Michelin inspector. These inspectors go to the restaurant secretly.\
    \ They carefully look at everything—from how the food tastes and looks, to how\
    \ clean and comfortable the place is. If the restaurant does a great job again\
    \ and again, it might get a Michelin star.\n    Who can be a Michelin inspector?\
    \ They are people who really understand food. Most of them have studied at hotel\
    \ or cooking schools and have worked in restaurants or hotels for many years.\
    \ Some of them even have experience working as chefs. They need to be very good\
    \ at noticing small things and changes, and they must love food. Inspectors must\
    \ have a sharp eye and a true love for great meals.\n    Even though being a Michelin\
    \ inspector might sound fun, it’s actually a lot of hard work. Inspectors travel\
    \ to many different places, sometimes even to other countries. They eat at many\
    \ restaurants and always keep their identity secret. After each visit, they write\
    \ a report about their experience. If a restaurant seems good enough to get a\
    \ star, another inspector will go again to double-check. This helps make sure\
    \ the restaurant really deserves the star.\n    Michelin stars are not easy to\
    \ get, which is why restaurants that have them are so special. If you hear about\
    \ a Michelin-starred restaurant, you’ll know the hard work behind that little\
    \ star!\n✍overall 整體 inspector 觀察員 chef 主廚 identity 身份 deserves 值得"
