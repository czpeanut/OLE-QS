- id: doc_113_新北_五峰_英語_g9s2e2_s3_38
  section: 3
  number: 38
  type: single
  page: 3
  stem: Jasmine keeps snacks for some time, takes a rest when feeling sick on the
    bus, goes to school by taxi when she oversleeps, and asks for a lower price when
    she doesn’t have enough money for something. What kind of pocket money user is
    she?
  options:
  - label: A
    content: she sometimes uses her pocket money well.
  - label: B
    content: she uses her pocket money poorly.
  - label: C
    content: she has no pocket money to use.
  - label: D
    content: she usually uses her pocket money well.
  group_stem: '(三)

    Here is a fun test about the way to spend our pocket money.

    Q1. Your mother gives you some snacks, What will you do?

    □A. Eat them all. □B. Share them. □C. Eat them some later.

    Q2. You oversleep and can’t catch the bus. What will you do?

    □A. Ask your parents to drive you. □B. Take a day off.

    □C. Take a taxi to school.

    Q3. You feel sick on the bus. What will you do?

    □A. Look outside the window. □B. Close your eyes and take a rest. □C. Ask the
    driver to let you get off.

    Q4.You go shopping with your friend and find something great. But you don’t have
    enough money for it. What will you do?

    □A. Give up the thing. □B. Ask for a big discount.

    □C. Ask your friend for money.

    POINTS： A→2  B→1  C→3


    4 to 6 points →You are not a smart pocket money user. It’s better to ask your
    parents to keep it for you.

    7 to 9 points →You are usually smart when you use your pocket money. But when
    you really love something, you’ll lose your mind.

    10 to 12 points →You are a smart pocket money user. You always spend it wisely.

    ✍ oversleep 睡過頭 discount 打折'
