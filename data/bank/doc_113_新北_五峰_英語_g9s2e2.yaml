- id: doc_113_新北_五峰_英語_g9s2e2_s3_32
  section: 3
  number: 32
  type: single
  page: 2
  stem: What happened in 2016 that made people around the world care about the elephants
    at Angkor Wat?
  options:
  - label: A
    content: An elephant named Sambo died from overwork and heat.
  - label: B
    content: The temple park closed to tourists.
  - label: C
    content: A baby elephant was born at Angkor Wat.
  - label: D
    content: A new elephant show was introduced.
  group_stem: "(一)\nNo Elephant Rides at Angkor Wat\n    Each year, millions of people\
    \ from around the world visit Cambodia to see the world-famous temples of Angkor\
    \ Wat. In the past, many of these visitors chose to experience elephant rides\
    \ while touring the temple park. However, that all changed in 2016.\n    That\
    \ year, an elephant named Sambo died by the roadside after carrying visitors around\
    \ the Angkor Wat temple park in terribly hot weather. Sambo's death and the poor\
    \ living conditions of the working elephants made headlines around the world.\
    \ These elephants had to work long hours without enough food, water, or care.\
    \ Some were also very old or sick.\n    After that, animal rights groups took\
    \ action. Many animal lovers were mad by what happened, and more than 185,000\
    \ people signed a petition to stop the elephant rides. After nearly four years,\
    \ Angkor Wat finally decided to end the elephant rides for good.\n    The working\
    \ elephants were moved to a safe location about 40 kilometers away from the park.\
    \ Their new home is filled with trees, rivers, and lots of food. Now, they can\
    \ finally live in peace—free from giving rides, and free to just be elephants.\n\
    ✍Angkor Wat 吳哥窟 Cambodia 柬埔寨 condition 情況 petition 請願書"
