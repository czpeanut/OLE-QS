  - label: D
    content: She thought skydiving was the best way to make friends.
  group_stem: 'UK Woman Celebrates 102nd Birthday by Jumping from Plane

    How would someone celebrate their 102nd birthday? With a cake? Some gifts? Maybe
    a nice time with friends? Well, a woman named Manette Baillie celebrated her birthday
    in a very exciting way! She jumped out of a plane and became the oldest skydiver
    in the UK!

    Manette got the idea when she heard about an 85-year-old man who went skydiving.
    She thought, “If he can do it, I can do it too!” But it wasn’t just for fun. Manette
    also wanted to help others. She used her skydive to raise money for three groups
    she cares about. One group helps soldiers. Another is a hospital that treats people
    with serious illnesses. The third group once saved her son’s life in 1969. Manette
    has been helping these groups for many years.

    On her 102nd birthday, Manette went up in a plane with a skydiving teacher. Together,
    they jumped out of the plane and flew through the sky. The teacher helped her
    land safely. After the jump, Manette said, “Oh, it was wonderful, but I didn’t
    open my eyes until I was on the ground.”

    This was not her first big adventure. For her 100th birthday, she rode in a car
    that went almost 210 kilometers an hour! Now, Manette says this might be her last
    adventure. She joked that she may try knitting next. But with her record, who
    knows what she will do next?

     skydiver 高空彈跳者 adventure 冒險 knit 編織'
  ai_answers:
    gemini: B
