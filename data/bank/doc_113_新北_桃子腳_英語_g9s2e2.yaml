- id: doc_113_新北_桃子腳_英語_g9s2e2_s6_41
  section: 6
  number: 41
  type: single
  page: 3
  stem: What might be the title of the news that Anna read?
  options:
  - label: A
    content: Teen Helps Firefighters Stop a Fire
  - label: B
    content: Teen Tells a Funny Joke to Friends
  - label: C
    content: Teen Calls for Help and Saves a Life
  - label: D
    content: Teen Makes a Fake Call and Gets in Trouble
  group_stem: 'Anna: Hey Bella, did you hear the news? A teenager made a fake emergency
    call and got into big trouble.

    Bella: Really? What happened?

    Anna: He called the fire department and said there was a fire, but it wasn’t true.
    The firefighters went there and found nothing.

    Bella: That’s so bad! What if someone else really needed help?

    Anna: That’s right! The firefighters were busy with the fake call, so they couldn’t
    help a person who really needed them.

    Bella: Did the teenager get in trouble?

    Anna: Yes. The police said making a false emergency call is against the law. He
    might have to pay a heavy fine.

    Bella: Wow. Some people think it’s funny, but it’s really dangerous.

    Anna: Yeah. It’s not a joke. It could stop doctors or police from saving a life.

    Bella: I agree. Emergency numbers are only for real help, not for fun.

    Anna: Right. If someone wants to be funny, they should tell jokes to friends,
    not call 911.

    Bella: I hope other people learn from this and don’t do the same thing.

    Anna: Me too. We all need to keep emergency lines open for people who really need
    help.

     emergency 緊急狀況 fine 罰款；罰金'
  ai_answers:
    gemini: D
    qwen: D
  answer:
  - D
  answer_status: ai_generated
  answer_source: ai:gemini+qwen
