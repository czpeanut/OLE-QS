- id: doc_113_台中_大業_社會_歷史_g8s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 由上文的內容來看，請問其主要在探討下列何主題？
  options:
  - label: A
    content: 封建階級身分差異
  - label: B
    content: 變法改革與秦國興衰
  - label: C
    content: 周代封建之衰亡
  - label: D
    content: 戶籍制度實施的影響。
  group_stem: "請根據閱讀資料，回答以下第1~4 題。\n    一本書中指出：「○○變法後，秦國可能已經全面實行戶籍制度，在《商君書》中提到：『全國境內，不論男女，都有名籍在官府。初生者登錄，死者消除。』從許多資料中看來，漢代無疑已經有相當嚴密的戶口制度。在傳統的封建制度中，人民只直接與其領主接觸，除非是天子、諸侯的領民，一般人和天子、諸侯等上層貴族並無聯繫。但是隨著封建瓦解，中間貴族階層逐漸消失，天子直接領有萬民。為有效掌握人民及相關資源，戶籍制度提供統治者所需要的基本資料，國家對人民的賦稅或徵兵才有所依據。」\n\
    資料來源：杜正勝，中國文化史，2003，臺北，三民書局。"
  tags:
    chapter:
      publisher: 翰林
      book: 八上
