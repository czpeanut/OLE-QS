- id: doc_113_台中_大業_社會_歷史_g8s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 請問，為何琅琊王司馬睿需要在南方建立新政權？
  options:
  - label: A
    content: 因為犬戎入侵
  - label: B
    content: 因為永嘉之禍
  - label: C
    content: 因為東突厥進攻
  - label: D
    content: 因為人民起兵叛亂。
  group_stem: "請根據閱讀資料，回答以下第5~7 題。\n    出身司馬家族的琅琊王司馬睿，後來在南方建立了東晉政權。為了使政權安定，他十分倚賴大臣王導為他謀畫策略。王導出身北方的世家大族琅琊王氏，除了他自己在中央任宰相之外，他的堂兄王敦也是手握兵權的重要大臣。當時流傳一句話說「王與馬，共天下。」表示司馬家族是要跟王家攜手，才能有效統治。\n\
    資料來源：梁庚堯，中國社會史，2014，台北，國立台灣大學出版中心。"
  tags:
    chapter:
      publisher: 翰林
      book: 八上
