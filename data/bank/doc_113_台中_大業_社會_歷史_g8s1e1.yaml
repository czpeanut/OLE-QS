  options:
  - label: A
    content: 這是胡漢長期交流的成果，使唐代文化兼容並蓄。
  - label: B
    content: 其實魏晉南北朝的胡族君主就已經對胡漢都能一視同仁。
  - label: C
    content: 東亞各國廣受中國儒家文化影響，使得唐太宗有此感嘆。
  - label: D
    content: 此為唐太宗自誇，實際上胡人很少擔任胡族官員。
