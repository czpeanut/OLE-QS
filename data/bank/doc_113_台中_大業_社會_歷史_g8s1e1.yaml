- id: doc_113_台中_大業_社會_歷史_g8s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 資料一、資料二為唐朝時期的文化資料，請問這可以說明唐朝哪種文化現象？
  options:
  - label: A
    content: 強迫西域各國接受唐代文化。
  - label: B
    content: 因征服周邊各國因而有此融合風氣。
  - label: C
    content: 融合胡漢文化而呈現多元色彩。
  - label: D
    content: 皇帝以君主之威推廣胡族文化。
  group_stem: '請根據閱讀資料，回答以下第8~10 題。

    資料一：唐代與域外的文化交流，可從當時的長安及洛陽城內人們的生活看出，他們崇尚西域的風氣，如服飾裝束方面以西域各國的裝飾為美，崇外成為當時的潮流。

    資料二：西域各國所特有的音樂、技藝源源不絕地傳入中國。甚至朝廷正式典禮所用的音樂也以胡樂為主。民間與宮廷流行的休閒娛樂有擊鞠、繩技、胡旋舞等。

    資料三：唐太宗曾說：「自古以來君主都重視漢人，歧視外來胡族，可是我能夠不分胡漢，一視同仁。」'
  tags:
