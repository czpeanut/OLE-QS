  - label: B
    content: 小年可以聯絡地方消費者服務中心，辦理消費爭議申訴
  - label: C
    content: 店家的行為可能違反了消費者保護法
  - label: D
    content: 小年可向公平交易委員會進行檢舉。
  group_stem: '崇林國中於11/6–11/8 進行3 天2 夜的畢業旅行。以下是對話或談話：

    (甲) 小群：鹿港老街的蚵仔煎很有名，我們來貨比三家，看哪一家便宜！ 小年：怎麼每一家都是70 元，是否統一漲價呢？

    (乙) 小蓁：蚵仔煎好香啊！咦，怎麼會有頭髮？

    (丙) 領隊：如果沒帶零食泡麵的同學，鹿港老街有很多店要趕快買，否則只能到劍湖山販賣部以高價買了！

    下車後，同學們紛紛跑到便利商店買宵夜！

    (丁) 小凱：劍湖山「世界世界奇幻之旅」的演員舞者不是台灣人吔！ 小泰：他們是透過什麼管道從國外到台灣工作的呢？

    小恩：你看，有一個小朋友在表演，看起來還是個小學生吔！

    (戊)小赫：今天晚上住麗寶飯店，晚上還可以去outlet 逛街、搭摩天輪，明天白天玩麗寶樂園！相較於劍湖山世界，麗寶樂園有更多的度假選擇與玩法！'
