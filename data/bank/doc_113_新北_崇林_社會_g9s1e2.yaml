  stem: 「公視新聞網 2024/08/23」報導：全球海運的重要樞紐巴拿馬運河2024 年8 月就是完工110 週年。隨著氣候變遷，巴拿馬運河也在110 歲生日前夕的7
    月間，面臨乾旱缺水的窘境，造成海運路線嚴重阻塞。儘管當地預計9 月間降雨正常之後，運河的船隻通過數量也可回升，但已有航運業寧願繞遠路，讓靠著運河賺錢的地主國巴拿馬意外面臨不少競爭壓力。請問：下列有關巴拿馬運河的敘述中，何者『正確』？
  options:
  - label: A
    content: 與蘇伊士運河同為世界僅有的兩大連結海洋的運河
  - label: B
    content: 建造完成後，成為紐約至倫敦的必經航線
  - label: C
    content: 溝通兩大洋，降低國際的交通運輸時間與成本
  - label: D
    content: 終年盛行西風，成為船隻航行的一大挑戰
