  stem: 「我不同意你的意見，但我以死捍衛你說話的權利。」這句話經常列於名人語錄中，並將其認定出自於他。然而，他的著作中，從來沒有出現這句話。這句話首次出現於伊夫林霍爾的著作，這句話其實是總結他的思想的評論。另外，這句話在《書信中的他》中再次出現。作者於
    1939 年 5 月 9 日的書信中提到：「您在《書信中的》中所看到『我不同意你的意見，但我以死捍衛你說話的權利。』一句是我自己的感想，也不該將其置於引號中。以致誤導他人認為這句是出於他所言。」由此可見，此語的確不是出於他。然而，這卻並不影響這句話所能代表的思想與捍衛言論自由的決心。請問：上述內容討論的人是？
