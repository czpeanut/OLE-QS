  section: 1
  number: 13
  type: single
  page: 2
  stem: 「在所有的政府中都有三個不同的權力，此即是立法權、行政權、與司法權。……所謂的政治自由其實是個人對其安全感到無虞的心靈平靜狀態，為了要達到這個自由境界，政府應當使人對它不覺害怕。當立法權與行政權為同一人或同一單位所控制時，人民便無法獲得自由。若司法權與立法權和行政權不分時，人民也得不到自由。」請問：上述內容出自何處？
  options:
  - label: A
    content: 《社會契約論》
  - label: B
    content: 《政府論》
  - label: C
    content: 《百科全書》
  - label: D
    content: 《法意》。
