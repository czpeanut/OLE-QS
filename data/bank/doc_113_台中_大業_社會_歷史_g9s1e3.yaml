  group_stem: '資料一：1623 年，在中國出版的《職方外紀》「亞墨利加」一條中，描述美洲原住民初次面對歐洲人的反應如下：「這個地方本來沒有馬，當地人不知道馬長成什麼樣子。後來有船隻載著一群外來者，這些人騎在馬上登陸。當地人看到時嚇一跳，以為是半人半馬的巨大怪物，趕緊跟他們的官員及國王報告。國王派人來看，也驚愕地無法分辨。為了分辨這群外來者是人還是神，國王派人拿了兩種東西來，一種是雞、豬等食物，一種是花、鳥的羽毛，並且私下說如果外來者吃了食物，就是人類；吃了花、鳥的羽毛，就是天神。結果，這群外來者吃了食物，證明他們是人類。」

    資料二：阿茲特克帝國是當時仍屬強盛的美洲文明，卻於五年內被歐洲人埃爾南‧科爾特斯（Hernán Cortés）滅亡。阿茲特克有一傳統神話，預言「羽蛇神」（傳說其為白皮膚的天神）有一天將從海上回來，重奪國家統治權，因此
    1519 年科爾特斯一行人登陸後，阿茲特克國王誤以他為傳說中的羽蛇神，以厚禮奉獻並加以服從。請回答第 26-28 題：'
