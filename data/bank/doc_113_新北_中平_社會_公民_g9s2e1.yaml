    年全球共增加204 名億萬富翁，平均約等於每個星期都有4 位新億萬富翁出現，總財富更在今年增加近2 兆美元，然而報告也批評，絕大多數億萬富翁的財富都是掠奪而來，而非透過創造產生。這些超級富豪多數都生活在北半球富裕國家，儘管這些國家人口僅占全球5
