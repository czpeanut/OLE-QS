- id: doc_113_新北_中平_社會_公民_g9s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 下列有關此新聞的相關說明，何者有誤？
  options:
  - label: A
    content: 若無國會多次延長版權，米奇的版權到期應在1984 年
  - label: B
    content: 目前美國對著作權的保護期限是95 年
  - label: C
    content: 米奇目前是全世界第一個版權到期的著作
  - label: D
    content: 並非所有的米奇都屬於公共財領域
  group_stem: '※ 請詳細閱讀並回答第03- 04 題

    迪士尼全球第1 齣的有聲動畫片《汽船威利號》，讓可愛的米老鼠米奇在1928 年初登場後就風靡全球。其實汽船威利號的版權原本應該在1984 年到期，但是迪士尼長期大力遊說，讓國會多次批准版權延長，使得初版米奇版權期限長達95
    年。直至（2024）年1 月1 日開始版權才屬於公共財領域，所有人都可以無償使用，但這僅限於第1 代出版的米奇，不同版本的彩色米奇仍有各自的版權保護。

    根據1988 年最新通過的《美國著作權法》，大多數作品會在發布95 年後成為公共財，近年也有許多經典文學成為公共財，掀起改編熱潮。而小熊維尼也早米奇一步成為公共財，去年甚至被改編成恐怖電影。    (源自：2024-01-02    公視新聞網))'
