  group_stem: '顧客：老闆，這條褲子多少錢？

    老闆：１８０元，正宗貨，要不要？

    顧客：我先看看……

    老闆：別看了，給你優惠點，１７０元。

    顧客：這也叫優惠啊？

    老闆：呵呵，好吧，１４０元，這回可以了吧？

    顧客：哈哈哈哈……

    老闆：你笑什麼，難道嫌貴？

    顧客：何止是貴，簡直就是用水泵抽我的血！

    老闆：有那麼誇張？看你是本地人，就１２０元吧。

    顧客：……

    老闆：你不會還嫌貴吧，我最多只賺你幾塊錢。

    顧客：不，我沒有說貴，這條褲子值這個價錢，只是我口袋裡的錢有限啊。

    老闆：那你口袋裡有多少錢？

    顧客：９０元。

    老闆：天啊，你開玩笑，賠死我了，再添１０元。

    顧客：沒得添，我很想給你１２０元，可無能為力。

    老闆：好吧，交個朋友，你給９０元拉倒。

    顧客：可我還要留１０元的車費。

    老闆：車費？

    顧客：當然，我來自很遠很遠的地方，我必須坐長途車回去。

    老闆：你騙人！

    顧客：相信我。你看我的臉，多麼的真誠啊。

    老闆：我認賠了，算你８０元好了。

    顧客：等等，我還沒有吃早飯，我很餓。

    老闆：你！天啊，你太過分了，你在耍花招。

    顧客：相信我，我很真誠。再不吃飯的話，我會昏倒。

    老闆：我真是倒楣，遇到你這樣的滑頭，不會你等等還想喝飲料吧？

    顧客：相信我，我沒有要求了。

    老闆：好吧，痛快些，７０元。

    顧客：我這就給你錢……等等，這裡的顏色好像有點不對勁啊。

    老闆：不，不是，這是磨砂顏色，故意弄成這樣子的，這叫流行。

    顧客：是嗎？怎麼看起來像舊褲子，怪怪的。

    老闆：好吧，我給你看我的進貨單……你瞧，進貨日期是上個禮拜，這怎麼會是舊褲子呢？

    顧客：哦。對不起我誤會了，不過……天啊，進貨價２０元每件。

    老闆：哦，不對不對。這是沒有上稅前的價錢，繳稅後每條成本價是４０元。

    顧客：你以為我是傻瓜嗎？這條褲子只值２０元，可你……

    老闆：呵呵……做生意嘛，不賺錢我吃什麼？

    顧客：光天化日、朗朗乾坤，你心太黑！

    老闆：呵呵，３０元行不？讓我賺點。

    顧客：錢是小意思。只是你的行為讓我氣憤，你深深傷害了一個消費者的心靈。

    老闆：有那麼嚴重？這樣，你消消火，我２５元賣給你，就賺５元。

    顧客：什麼？２５就是二百五的意思，你瞧不起我？

    老闆：沒有沒有，就２４吧。

    顧客：有一個４，就是「死」的意思，不吉利，我很迷信的。

    老闆：天！２３沒問題吧？

    顧客：好吧，成交！（改寫自網路文章一場慘烈的殺價）'
