- id: doc_113_台中_四育_國文_g9s1e3_s2_40
  section: 2
  number: 40
  type: single
  page: 5
  stem: 「山川、大海也可以成為充沛的『文化刺激』」，下列何者無法與這句話相呼應？
  options:
  - label: A
    content: 到了屏東市的百貨公司都像劉姥姥進大觀園
  - label: B
    content: 聽浪破的聲音，上「寧靜」的功課
  - label: C
    content: 用閉眼的心看見風徐徐吹
  - label: D
    content: 用呼吸測出花香的分寸。
  group_stem: "三個小時倏忽過去，我們沒有時間寫下一篇論說文了。結束後，一個老師過來，憂心的說，鄉下的孩子資源比城市裡的孩子差太多。「孩子家庭的經濟也不是太好，接觸到的文化刺激也少。您知道嗎，不要說去臺北、高雄，有些孩子到了屏東市的百貨公司都像劉姥姥進大觀園，很多吃的玩的都沒見過……」\n\
    \  我明白的，因為我自己是「偏鄉」的小孩。鄉村的孩子「文化刺激」少，也是真的。住在臺北 中正區的孩子往東西南北任何一個方向走去，都會碰到戲劇院、音樂廳、美術館、電影院；屏東、臺東的孩子往東西南北任何一個方向走去，都會碰到山川和大海。可是，在國家無法把戲劇院和音樂廳帶到他們面前來時，我們總不能讓孩子「呆」掉吧？能不能說，山川、大海也可以成為充沛的「文化刺激」？\n\
    \  我還想到鄉村教作文課。\n  教「說明文」，我會要孩子回家仔細觀察自己的祖母如何收成鳳梨，細看徒手摘取和鐮刀割取兩種方法的差別；他也可以觀察市場的魚販如何殺魚、農人怎麼種蔥、茶家怎麼焙茶、賣檳榔的怎麼挑選檳榔。\n\
    \  教「抒情文」，寫人物，我會讓他們出去採訪打鐵的伯伯、討海的叔叔、對街廟裡的乩童、小村唯一的醫生和村子裡大家都認識的「瘋子」……\n  寫風景，我會和孩子一起走到海邊，看海水的顏色變化，聽浪破的聲音，上「寧靜」的功課；我會和孩子一起進入山林，教他們用裸手觸摸樹皮的紋路，用眼睛記住葉子的厚薄，用呼吸測出花香的分寸，用閉眼的心看見風徐徐吹。\n\
    \  我自己在鄉村長大，我知道，對鄉村的孩子，你認為他能走多遠，他就能走多遠。（龍應台 山海皆是文化）"
