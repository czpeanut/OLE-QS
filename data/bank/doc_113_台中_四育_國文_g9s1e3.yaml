  stem: 根據文意，畫線處中應填入下列何者最恰當？
  options:
  - label: A
    content: 減少昆蟲過度繁殖
  - label: B
    content: 飼養昆蟲保護作物
  - label: C
    content: 避免昆蟲瀕臨絕種
  - label: D
    content: 將昆蟲轉化成食物。
  group_stem: "日本 無印良品二○二○年五月在網路商場正式推出蟋蟀仙貝，這項產品是在二○一九年與位於四國的德島大學共同研發的，單價一包一百九十日圓（約五十三元新臺幣），而且一開賣就被搶光。\n\
    \  早在數年前，聯合國糧農組織就提出警告，全球糧食危機會隨著氣候異常愈來愈嚴重。無印良品表示，二○五○年世界人口預計將達一百億，屆時蛋白質食物的來源將是大問題，能否\
    \ ________ ，成了不少研究單位的重要課題，例如荷蘭就是昆蟲食品的先驅國家之一。至於和無印良品合作的德島大學研究蟋蟀已超過三十年。\n  根據研究，一百公克蟋蟀含六十克蛋白質，比起雞的二十三克、豬二十二克，牛約二十一克等都來得高。而且飼養昆蟲所排放的溫室氣體及所需的水及食物，遠小於畜牧業，不僅成本低，也較不會破壞環境。根據二○一三年聯合國糧農組織報告，生產一公斤蛋白質時，蟋蟀僅排放零點一公斤的溫室氣體，牛則會排放將近三公斤。\n\
    \  無印良品也解釋，之所以會選擇蟋蟀，除了前述原因外，還有蟋蟀繁殖力強，成長快速，只需三十五日即可長成成蟲。雖然蟋蟀主要食物是穀類，但也可以雜食，所以可以吃廚餘，這也是對人類幫了大忙。\n\
    \  這項產品使用的是主要分布在沖繩的黃斑黑蟋蟀，這種蟋蟀在臺灣也常用作「鬥蟋蟀」。無印良品強調，他們所使用的蟋蟀，都是在安全且衛生的環境裡飼養，並非野生抓取。他們將蟋蟀研磨成粉，再將其製作成餅狀。過程簡單，也不添加多餘的香料，整體吃起來的風味接近蝦餅。\n\
    \  「蝦是海洋的昆蟲，那麼蟋蟀就是陸地的蝦子。」無印良品表示，這款仙貝味道吃起來就像蝦餅，也因為含有甲殼類成分，對蝦、蟹過敏的人不宜食用。\n  蟋蟀仙貝於５月底上市後，佳評如潮，有人表示仙貝十分酥脆，入口後有種玉米片的感覺；也有網友說，起初看到說明有點怕怕的，最後決定買一包試膽，結果還滿好吃的，味道確實就像蝦餅。也有網友指出，說不定以後大家漸漸習慣，最後研發出各種口味，甚至會被做成拉麵等等。（改寫自聯合報．蟋蟀仙貝救地球？高蛋白、排碳低、味似蝦餅\
    \ 推出就大賣）"
