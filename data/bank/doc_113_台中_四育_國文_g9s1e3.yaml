    老闆：好吧，交個朋友，你給９０元拉倒。

    顧客：可我還要留１０元的車費。

    老闆：車費？

    顧客：當然，我來自很遠很遠的地方，我必須坐長途車回去。

    老闆：你騙人！

    顧客：相信我。你看我的臉，多麼的真誠啊。

    老闆：我認賠了，算你８０元好了。

    顧客：等等，我還沒有吃早飯，我很餓。

    老闆：你！天啊，你太過分了，你在耍花招。

    顧客：相信我，我很真誠。再不吃飯的話，我會昏倒。

    老闆：我真是倒楣，遇到你這樣的滑頭，不會你等等還想喝飲料吧？

    顧客：相信我，我沒有要求了。

    老闆：好吧，痛快些，７０元。

