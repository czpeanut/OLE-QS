  group_stem: "近臘月下，景氣和暢，故山殊可過。足下方溫經，猥不敢相煩。輒便往山中，憩感配寺，與山僧飯訖而去。\n  當待春中，草木蔓發，春山可望，輕鯈（１）出水，白鷗矯翼，露溼青皋（２），麥隴朝雊（３）。斯之不遠，儻（４）能從我遊乎？非子天機清妙者，豈能以此不急之務相邀？然是中有深趣矣，無忽！\n\
    \  因馱黃蘗（５）人往，不一。山中人王維白。（王維 山中與裴秀才迪書）\n  【注釋】（１）鯈：音ㄔㄡˊ，動物名。亦稱為「鰷魚」。（２）皋：音ㄍㄠ，水邊的低地。（３）雊：音ㄍㄡˋ，雄雉鳴叫。（４）儻：如果、倘，通「倘」。（５）黃蘗：中藥名。蘗，音ㄅㄛˋ。"
