  group_stem: "鷗於海渚（１）遇巷燕。\n  燕謂鷗曰：「我至子（２）所，而子不至我所，何也？」曰：「吾性傲以野，不樂依人焉，故也。」\n  燕曰：「我以依人而處，故飆風（３）得所障，凍雨得所蔽，熾日得所護。以是觀之，子其病（４）矣。」鷗曰：「吾病而有不病者存，不若子之昧（５）於病而未見也。」\n\
    \  燕曰：「我之得以依人者，以人不之憎且愛之也。子之病我者，忮（６）其愛乎？」鷗曰：「子謂人之於我，愛乎，憎乎？」燕曰：「皆無之。」鷗曰：「吾以傲野自適，人之憎愛非所論也。即以人論，吾以不見（７）愛，故不見憎。然則，見愛者其危哉！」\n\
    \  燕不喻（８）而去。其後，巷人方食，燕泥污其羹。因怒而逐之，燕于是始思鷗言。（劉熙載 寤崖子）\n  【注釋】（１）渚：水中的小陸地。（２）子：你。（３）飆風：急風、暴風。（４）病：困苦。（５）昧：隱藏。（６）忮：嫉妒。（７）見：被。用在動詞前，表示被動。下同。（８）喻：知道、明白。"
