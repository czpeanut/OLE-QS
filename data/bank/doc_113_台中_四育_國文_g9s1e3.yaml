    \  「蝦是海洋的昆蟲，那麼蟋蟀就是陸地的蝦子。」無印良品表示，這款仙貝味道吃起來就像蝦餅，也因為含有甲殼類成分，對蝦、蟹過敏的人不宜食用。\n  蟋蟀仙貝於５月底上市後，佳評如潮，有人表示仙貝十分酥脆，入口後有種玉米片的感覺；也有網友說，起初看到說明有點怕怕的，最後決定買一包試膽，結果還滿好吃的，味道確實就像蝦餅。也有網友指出，說不定以後大家漸漸習慣，最後研發出各種口味，甚至會被做成拉麵等等。（改寫自聯合報．蟋蟀仙貝救地球？高蛋白、排碳低、味似蝦餅\
    \ 推出就大賣）"
