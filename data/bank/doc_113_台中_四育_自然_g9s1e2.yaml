- id: doc_113_台中_四育_自然_g9s1e2_s2_36
  section: 2
  number: 36
  type: single
  page: 4
  stem: 文中提及培地茅具有多種用途，請問下列何者不是培地茅的用途？
  options:
  - label: A
    content: 可供食用
  - label: B
    content: 建造房屋
  - label: C
    content: 做籬笆
  - label: D
    content: 提取芳香油。
  group_stem: '(三)閱讀文章，並根據本文回答問題：

    香根草（Chrysopogon zizanioides）又叫培地茅，是一種禾本科多年生的草本植物，其根部可以被提煉出「香根草油」，做為精油或香水的原料，在東南亞地區，人們會將它拿來當作房子的建材，或是種植成地界籬笆，除了這些應用之外，香根草有一項更廣為世人所知道的一項功能──「水土保持」，目前為聯合國在第三世界國家大力推行的水土保持植物，究竟，香根草有什麼特殊之處？

    原來，香根草有非常強大的生態適應性及抗逆境能力，能夠生長在－22～55℃的環境中，可以忍受乾旱長達15 個月，若種植在長期淹水的地區也可生存6 個月之久，可以稱它為植物界的超人也不為過。香根草的根系深且長，種植一年左右就可深入土層2～3
    公尺，龐大而深厚的根系能夠穩穩抓住土壤，形成根籬；香根草的植株莖桿堅硬挺立，葉片直立朝上，使得每片葉片都能受光，彼此能緊鄰生長，其光合作用的能力非常強，因此生長十分快速。最令科學家感到開心的是，香根草不易開花，如果有開花產生種子，種子也不易發芽，因此不會變成四處蔓延的雜草。'
