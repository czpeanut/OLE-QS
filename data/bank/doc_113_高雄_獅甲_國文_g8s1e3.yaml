  stem: 下列何者不是作者小時候對於太陽的疑惑？
  options:
  - label: A
    content: 是什麼繩兒繫住，能懸著不掉落
  - label: B
    content: 為什麼形狀圓滾滾，且紅通通的
  - label: C
    content: 為什麼日升就天亮，日落就天黑
  - label: D
    content: 想前往太陽可有路徑，該如何走。
  group_stem: "小的時候，我們最猜不透的是太陽。那麼一個圓盤，紅光光的，偏懸在空中，是什麼繩兒繫著的呢？它出來，天就亮了，它回去，天就黑了；莊稼不能離了它，樹木不能離了它，甚至花花草草的也離不得它。那是一個什麼樣的寶貝啊！我們便想有一天突然能到太陽上去，那裡一定什麼都是紅的，光亮的，那該多好，但是我們不能；想得痴了，就去纏著奶奶講太陽的故事。\n\
    \  「奶奶，太陽住在什麼地方呀？」\n  「是住在金山上的吧。」\n  「去太陽上有路嗎？」\n  「當然有的。」\n  「啊，那怎麼個走法呀？」\n \
    \ 奶奶笑著，想了想，拉我們走到門前的那塊園地上，說：\n  「咱們一塊來種園吧，你們每人種下你們喜愛的種子，以後什麼都會知道了。」\n  到了園地，我們鬆了鬆土，施了施肥，種下一些種子。從此，我們天天往園地裡跑，心急得像貪嘴的貓兒。１０天之後，果然就全發芽了，我們高興地大呼小叫。奶奶就讓我們５天測一次苗兒的高度，插根標記棍兒。那苗兒長得快，一個月後，插到６根，苗兒就相對生葉，長得老高了。\n\
    \  可是，太陽路的事，卻沒有一點跡象。我們又問起奶奶，她笑了：「苗兒不是正在路上走著嗎？」\n  這卻使我們莫名其妙了。\n  「傻孩子！」奶奶說，「苗兒５天一測，一測一個高度，這一個高度，就是一個臺階，順著這臺階上去，不是就可以走到太陽上去了嗎？」\n\
    \  我們大吃一驚，原來這每一棵草呀，樹呀，就是一條去太陽的路嗎？這通往太陽的路，滿世界看不見，卻到處都存在著啊！\n  奶奶問我們：「這路怎麼樣呢？」\n\
    \  妹妹說：「這路太陡了。」\n  弟弟說：「這路太長了。」\n  我說：「這路沒有誰能走到頭的。」\n  奶奶說：「是的，到太陽的路是陡峭的臺階，而且十分漫長，要走，就得用整個生命去攀登。世上凡是有生命的東西，都在這麼走著，有的走得高，有的走得低，或許就全要在半路上死去。但是，正是在這種攀登中，是莊稼的，才能結出果實；是花草的，才能開出花絮；是樹木的，才能長成材料。」\n\
    \  我們都靜靜地聽著，站在暖和的太陽下，發現著每一條路和在每一條路上攀登的生命。\n  「那我們呢？」我說，「我們怎麼走呢？」\n  奶奶說：「人的一輩子也是一條陡峭的臺階路，需要拚全部的力氣去走。你們現在還小，將來要做一個有用的人，就得多爬幾個這樣的臺階，雖然艱難，但畢竟是一條向太陽愈走愈近的光明的路。」（節選自賈平凹\
    \ 太陽路）"
