  section: 1
  number: 37
  type: single
  page: 3
  stem: "常常看見你\n  在鳥店徘徊留連\n  終日素描一隻籠中的畫眉\n  所以猜想你喜歡鳥\n\n  我也喜歡，不過\n  比你貪心一點\n  總共擁有幾萬幾千幾百零幾隻\n\
    \  統統養在天空裡\n  從來不必擔心\n  誰會遠走高飛（陳斐雯 養鳥須知）\n關於這段詩句的解說，下列敘述何者正確？"
  options:
  - label: A
    content: 本詩主旨在於藉由鳥類不同的生活型態，比喻人生窮通禍福的境遇
  - label: B
