- id: doc_113_高雄_獅甲_國文_g8s1e3_s2_44
  section: 2
  number: 44
  type: single
  page: 4
  stem: 「似乎想撬開他的嘴巴，聽一聽這位古希臘的哲人對如今這個混沌而荒謬的商品世界的醒世之言。」有關這句話的解說，下列何者正確？
  options:
  - label: A
    content: 文中的哲人指的是蘇格拉底
  - label: B
    content: 隱含作者對世界的頌揚之意
  - label: C
    content: 可見正午陽光給人的聯想力
  - label: D
    content: 連陽光都感到世界荒謬混沌。
  group_stem: "我常常在黃昏時分，坐在書房裡，享受夕照穿窗而入帶來的那一種異樣的神奇。\n  暮時的陽光，已經失去了白日裡的咄咄逼人；它變得很溫和，很紅，好像一種橘色的燈光，不管什麼東西給它一照，全都分外的美麗。首先是窗臺上那盆已經衰敗的藤草，此刻像鍍了金一樣，蓬勃發光；跟著是書桌上的玻璃燈罩，亮閃閃的，彷彿打開了燈；然後，這一大片橙色的夕照帶著窗櫺和外邊的樹影，斑斑駁駁投射在東牆那邊一排大書架上。陰影的地方，書皆晦暗，光照的地方連書脊上的文字也看得異常分明。\n\
    \  當夕陽移到我的桌面上，每件案頭物品都變得妙不可言。一尊蘇格拉底的小雕像隱在暗中，一束細細的光芒從一叢筆杆的縫隙中穿過，停在他的嘴脣之間，似乎想撬開他的嘴巴，聽一聽這位古希臘的哲人對如今這個混沌而荒謬的商品世界的醒世之言。但他口含夕陽，緊閉著嘴巴，一聲不吭。\n\
    \  陳放在桌上的一塊四方的鎮尺最是離奇。這個鎮尺是朋友贈送給我的。它是一塊純淨的無色玻璃，一條彎著尾巴的小銀魚被鑄在玻璃中央。當陽光徹入，玻璃非但沒有反光，反而由於純度過高而消失了，只有那銀光閃閃的小魚懸在空中，無所依傍。牠瞪圓眼睛，似乎也感到了一種匪夷所思。\n\
    \  在日落前的一瞬，夕陽殘照已經挪到我書架最上邊的一格。滿室皆暗，只有書架上邊無限明媚。那裡擺著一隻泥公雞。雪白的身子，彩色翅膀，特大的黑眼睛，威武又神氣。這個北區著名的泥玩具之鄉，至少有千年的歷史，但如今這裡已經變為日用小商品的集散地，昔日那些渾樸又迷人的泥狗泥雞泥人全都了無蹤影。可是此刻，這個倖存下來的泥公雞，不知何故，對著行將熄滅的夕陽張嘴大叫。我的心已經聽到它凄厲的哀鳴。這叫聲似乎也感動了夕陽。一瞬間，高高站在書架上端的泥公雞竟被這最後的陽光照耀得奪目和通紅，好似燃燒了起來。（節選自馮驥才\
    \ 夕照透入書房）"
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
      code: 第八課
      title: 找尋失落的水源
      chapter: null
    textbook: 八上 第八課 找尋失落的水源
    labeled_by: ai
