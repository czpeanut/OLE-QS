  stem: 下列文句缺空處，最適合使用的詞語依序為何？ 「木柵動物園裡的國王企鵝近來可謂集眾人目光焦點於一身，尤其在一對企鵝生蛋之後，對牠們孵蛋過程的關心與報導，更是達到舉國若狂的地步。這對企鵝夫妻原本□□□□，相處融洽，但自從母企鵝產下企鵝蛋後，□□□□的企鵝爸爸便搶著孵蛋，甚至為了爭蛋，不惜與企鵝媽媽大打出手。在孵蛋的六十五天裡，企鵝爸爸甚至創下連續三十四天未進食，六十二天未換班的驚人紀錄。如此超級新好爸爸，卻仍然不敵大自然的力量，嘗到小企鵝未出生便夭折的□□□□。」
  options:
  - label: A
    content: 宜室宜家／鳩占鵲巢／切膚之痛
