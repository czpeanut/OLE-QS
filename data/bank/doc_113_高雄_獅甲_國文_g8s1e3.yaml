  stem: 根據本文，下列何者是作者對駱駝的看法？
  options:
  - label: A
    content: 任重而道遠
  - label: B
    content: 其駝峰為人間美味
  - label: C
    content: 是獸類中最凶悍的
  - label: D
    content: 寧可豢養駱駝，也不要養哈巴狗。
  group_stem: 其實，駱駝不僅是在這炎蒸之地難以生存，就是在北方大陸其命運也是日趨於衰微。在運輸事業機械化的時代，誰還肯牽著一串串的駱駝招搖過市？沙漠地帶該是駱駝的用武之地了，但現在沙漠裡聽說也有了現代的交通工具。駱駝是馴獸，自己不復能在野外繁殖謀生。等到為人類服務的機會完全消滅的時候，我不知道牠將如何繁衍下去。最悲慘的是，大家都譏笑牠是獸類中最蠢的當中的一個，因為牠只會消極的忍耐。給牠背上馱五百磅的重載，牠會跪下來承受。牠肯食用大多數哺乳動物所拒絕食用的荊棘苦草，牠肯飲用帶鹽味的髒水。牠奔走三天三夜可以不喝水，並不是因為牠的肚子裡儲藏著水，是因為牠在體內由於脂肪氧化而製造出水。牠的駝峰據說是美味，我雖未嘗過，可是想想熊掌的味道，大概也不過爾爾。像這樣的動物若是從地面上消逝，可能不至於引起多少人的惋惜。尤其是在如今這個世界，大家所最歡喜豢養的乃是善伺人意的哈巴狗，像駱駝這樣的「任重而道遠」的傢伙，恐怕只好由牠一聲不響的從這世界舞臺上退下去罷！（梁實秋
    駱駝）
