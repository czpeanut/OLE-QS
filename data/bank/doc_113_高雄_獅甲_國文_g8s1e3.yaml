  options:
  - label: A
    content: 因盆子粗糙有裂痕，買了新的花盆，把菊花移植過去
  - label: B
    content: 怕菊花受不了風雨的摧殘，於是把花盆搬移到屋子裡
  - label: C
    content: 看見花旁雜草叢生，勤於除草，又撒以藥劑防止復生
  - label: D
    content: 花漸漸枯萎時，以為泥土不夠肥沃，又施給菊花肥料。
  group_stem: "「有客自武林來，貽（１）我菊數盆，曰：「此佳種也，幸（２）善養之。」\n  客去，余視其盆，粗而且裂，因另購新者而移植之。連宵天雨，寒甚。余視其花，含苞待放，瘦質娉婷（３），恐不堪風雨之摧殘，乃移盆室內。未數日，花漸萎矣；意（４）土壤之瘠也，復為施肥。然花竟枯槁而死。\n\
    \  不數日，客復來，見諸花無一存者，狀頗惋惜。余告以故。客曰：「菊戀故土，非時莫遷；無端移植，斲傷（５）之者一也。菊性耐寒，經霜愈傲；絕（６）其風露，斲傷之者二也。菊既萎矣，復施以肥，是猶予肺癆者以參苓（７），寧（８）非速其死乎？」\n\
    \  余聞其言，曰：「噫，余知過矣！夫菊之知戀故土者，義也；酣戰（９）風霜，勇也；不貪肥沃者，廉也。有此三德，余乃迫其抱屈以死，不亦過乎！」（朱惺公 瘞(一ˋ)菊記）\n\
    【注釋】（１）貽：贈送。（２）幸：希冀、盼望。（３）娉婷：輕巧美好。（４）意：猜測、推測。（５）斲傷：傷害。（６）絕：斷、隔開。（７）參苓：中藥名。人參與茯苓。有滋補健身的作用。（８）寧：豈、難道。（９）酣戰：持久激烈的爭戰。"
