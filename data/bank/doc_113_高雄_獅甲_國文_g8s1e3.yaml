  group_stem: "全世界的昆蟲，給人類讚美得最多的，大概要推螞蟻、蝴蝶、蠶、蜜蜂這幾樣東西了。\n  人們對於蜜蜂的讚美，尤其是充滿哲理的情趣。在思想史上、藝術史上，許許多多人都歌頌過蜜蜂。這不僅僅因為蜜蜂能夠釀蜜，而且也由於蜜蜂釀蜜的方法，給予人們重要的啟示。牠能夠博採，又能夠提煉，終於，黃澄澄、香噴噴的蜜糖給釀造出來了。牠的釀蜜可以說是一種卓越的創造。\n\
    \  十六世紀英國著名的哲學家培根，講了一個譬喻讚美過蜜蜂。他把盲目地堆集材料的求知識方式，稱做螞蟻的方式；把主觀地隨意創造體系的方式，叫做蜘蛛的方式；而「真正的哲學家，則是像蜜蜂一樣。牠們從花園和田野中的花朵採集材料，但是用牠自己的一種力量，來改變和消化這種材料」。幾百年的時間像流水一樣過去了，培根許許多多的話已經為人們所遺忘，但他那句「知識就是力量」的警語，和這個有趣的譬喻卻一直在各地廣泛流傳。\n\
    \  蜜蜂，這小小的昆蟲，人們獻給牠多少讚美之詞，牠那種釀蜜方式，使人想起了一切成功的學習、工作和經驗。\n  因此，我們盡可把蜜蜂人格化，為牠獻上一頂桂冠。（秦牧\
    \ 蜜蜂的讚美）"
