- id: doc_113_高雄_苓雅_國文_g9s2e1_s3_43
  section: 3
  number: 43
  type: single
  page: 5
  stem: 根據本文，「飼料雞」兒童的特徵不包括何者：
  options:
  - label: A
    content: 韌帶鬆弛
  - label: B
    content: 白胖可愛
  - label: C
    content: 脊椎側彎
  - label: D
    content: 體能不佳。
  group_stem: "（七）林啟禎〈O 型腿、扁平足？別讓孩子成為都市飼料雞！〉改寫\n\n  兒童是國家未來的主人翁，但諷刺的是，全世界都遭遇少子化的焦慮。臺灣不但未能倖免，甚至比世界其他地區更嚴重，因為臺灣出生率已接近全球最低點，出生人口從10\
    \ 年前的40 萬逐漸向下探底，去年只剩下不到17 萬，這是量方面的隱憂。\n  在質的方面，另有讓人煩惱的議題。臺灣兒童的體能表現如何？身高、體重、身體質量指數等固然有客觀的數據可資比較，但是骨科醫學研究者更在意的是，與身體骨骼關節肌肉系統有關的「飼料雞症候群」患者有逐年增加的趨勢。\n\
    以「飼料雞」來描述兒童骨骼關節肌肉系統的表現，可能很難想像，但若以「土雞」或「跑山雞」來做對比，意思就很清楚了。據觀察，「飼料雞」型的小朋友多是一出生便受到父母尊長的高度期待及寵愛，被養得白胖可愛，甚至被暱稱為「健康寶寶」。但有些孩子其實是超重了，脂肪多而肌肉少。\n\
    \  這些「健康寶寶」在錯誤的期待下很早便開始學走路，再因為社會型態與居家環境的關係，父母能夠陪伴兒童的時間太少，多是由祖父母隔代教養，所以多半小朋友只能待在家裡以冷氣取代新鮮的空氣，以日光燈取代日光浴，以地板取代芬芳的泥土及草地，於是形塑了肌肉不強、骨骼不硬、反應不快的現代寶寶。此外，臺灣的孩子在成長的過程中，每天有上不完的課、寫不完的作業，課後還有許多才藝或補習課程，剩下的時間所接觸的不外乎是電視或電腦。比之先進國家的小朋友兩、三點下課後通常須做運動數小時，有的更被要求每天練跑1\
    \ 英里、每周跑步5 公里，相較之下，臺灣的小朋友當然算是飼料雞了。因此，飼料雞型小朋友的特色就是韌帶鬆弛、肌肉無力、柔軟度不佳、平衡感不好、協調性不良、耐力不夠、站坐姿勢也不正確。\n\
    \  一般而言，兒童骨科的「飼料雞症候群」呈現的症狀有：站立時正面看起來整體下肢呈現「O 型腿」或「X 型腿」，站立及行走時會有「踮腳尖」、「內八字」或「外八字」等姿勢出現，站立時有內側足弓消失的「生理性扁平足」，經常在下午或晚上才發作的下肢「生長痛」，以及因姿勢不良與肌力不平衡的「酥腰」、「姿勢性脊柱不正」、「脊椎側彎」等。父母的反應也很令人玩味，有些即使證實兒童並沒有特殊疾病，父母仍憂心忡忡，盲目地求助於矯正鞋、矯正支架或矯正器；有些卻在證實確有特殊疾病時仍諱疾忌醫遲疑不決，不願面對現實，以至於拖過黃金治療期才回診。\n\
    \  飼料雞體質容易合併出現扁平足、體能不佳、姿勢不良等現象。因此，焦急的父母若寄望於矯正鞋以解決問題，將有如緣木求魚般不切實際，因為矯正鞋的功能並沒有實證醫學的療效證明與合理的理論基礎，反而是藉由運動與均衡營養以改善體質。總而言之，「飼料雞」型的兒童骨科問題在臺灣已經愈來愈嚴重，發生率也節節升高。把這些相關問題定義成症候群的用意，是提醒家長宜整體思考，明辨因果，尋求正確的諮商建議，並在骨骼體能上培養出更多的「跑山雞」，確保臺灣兒童都是頂天立地的國家主人翁。"
