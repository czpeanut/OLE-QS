    Sukune 陣亡，由 Maikui 接替繼續率領族人。後來我們在清帝國時期歸化，族人分散成幾個社，最後遇到漢人的侵占，族人各自退到偏僻的地方生活。」請問上文中提及的「臺南方面的平埔仔」應是指下列哪一族？
