  group_stem: "請閱讀以下文章，並回答問題：\n  孟子曰：「無或(1)乎王之不智也！雖有天下易生之物也，一日暴(2)之，十日寒之，未有能生者也。吾見亦罕矣，吾退而寒之者至矣。吾如有萌焉何哉？\n\
    \  今夫弈之為數(3)，小數也；不專心致志，則不得也。弈秋，通國(4)之善弈者也。使弈秋誨二人弈：其一人專心致志，惟弈秋之為聽。一人雖聽之，一心以為有鴻鵠將至，思援弓繳(5)而射之，雖與之俱學，弗若之矣。為是其智弗若與？曰：非然也。」\n\
