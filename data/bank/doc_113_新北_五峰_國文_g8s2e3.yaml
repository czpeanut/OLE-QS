- id: doc_113_新北_五峰_國文_g8s2e3_s2_38
  section: 2
  number: 38
  type: single
  page: 4
  stem: 根據本文，下列關於清明上河圖的敘述，何者錯誤？
  options:
  - label: A
    content: 以河流為主要的描繪對象，展現豐富的水族資源
  - label: B
    content: 畫作內容包含人物、動物，以及各種不同的場景
  - label: C
    content: 高官、平民及貧民等不同階層的人皆出現在畫中
  - label: D
    content: 畫中流露出動人的親情，並表達對弱勢者的關懷。
  group_stem: "這個城市有多少被你遺忘的角落？\n  大家都知道清明上河圖，一個畫家受命去畫他的城市，表現其中的繁華。畫家畫了一千六百多個人，各式各樣的場景。其中有一個場景是：官家的轎子出來，前面有人舉著上寫「肅靜迴避」的牌子，一個小孩在路中間玩，他媽媽怕他被馬踩到，驚惶的把他抱起。如果是你受命拍一個關於北京的紀錄片，你能不能拍出這個畫面？\n\
    \  還有一個畫面，出現在畫卷快結束的地方。一個做大官的人進城，前有開道車，後有隨護。城門口有一群叫花子，其中有一個沒有腿，做官的人回頭看了他一眼。看到這個地方，我覺得這個畫家真了不起。我的學生問我：你覺得那個做官的人後來給乞丐錢了嗎？我說我不知道，我覺得一個畫家能畫出大官跟乞丐的對視就很了不起了。\n\
    \  好幾年前，我路過天安門廣場，在長安街上看到一個畫面：那一定是一個鄉下來的婦人，因為只有下田勞動的人才會有那麼粗壯的骨骼。她餵孩子吃奶，毫不遮掩，孩子吃飽了，奶汁還很多，她就讓奶滴到長安街上。我覺得那個身體好動人：她跟那個土地是在一起的。我問自己：伸展臺上的美跟這個婦人的美，哪一個能讓我記憶更久？\n\
    \  美不僅僅是華服名模，甚至不僅僅是清風明月、巴哈、貝多芬，要看到美，我們首先要看到生命存活的艱難。\n  唐朝人喜歡畫牡丹。我曾在二月間到日本皇宮裡看過牡丹，全部用草圍著，上面還撐一把傘，因為牡丹有一點風吹雨打就會凋零。宋朝以後發現牡丹的美不能體現生命頑強的競爭力，就開始畫梅花。王冕的南枝春早成了傳世名作。如果說唐朝創造了牡丹的美，宋朝發現梅花的美，我們這個時代用花來象徵，可以找到什麼？\n\
    \  唐的文化、宋的文化為什麼有厚度？因為它看到大的，也關心小的。杜甫擠在難民裡面逃難，寫出「朱門酒肉臭，路有凍死骨」。如果這十個字變成千古絕唱，我覺得不是詩的技巧，而是詩人心靈上動人的東西：他看到了人。同樣那捧白骨，很多人走過去都沒看到。\
    \            （蔣勳 美的厚度在哪裡？）"
