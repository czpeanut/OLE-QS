  group_stem: "夫天地者，萬物之逆旅(1)；光陰者，百代之過客。而浮生若夢，為歡幾何？古人秉燭夜遊，良有以也。況陽春召我以煙景，大塊(2)假我以文章。會桃李之芳園，序天倫之樂事。群季俊秀，皆為惠連；吾人詠歌，獨慚康樂。幽賞未已，高談轉清。開瓊筵以坐花(3)，飛羽觴而醉月。不有佳作，何伸雅懷？如詩不成，罰依金谷酒數(4)。\n\
