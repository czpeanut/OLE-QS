  section: 2
  number: 34
  type: single
  page: 6
  stem: "渡渡鳥（Dodo，也比喻遲鈍的人）是英國作家路易斯·卡羅的兒童奇幻小說《愛麗絲夢遊仙境》裡的虛構人物，但在現實生活中渡渡鳥確實存在過。渡渡鳥是僅產於印度洋模里西斯島上的特有種，牠們不害怕人，但卻不會飛。所以當歐洲人在1507\
    \ 年在模里西斯島上發現了這種鳥，把牠們獵殺來吃，截至1681 年，島上再也沒有人見過活的渡渡鳥。\n  渡渡鳥的滅絕，是人類文明大規模滅絕地球物種的開始。人們當時的漫不經心，後來卻深深感覺到牠的疼痛。「逝者如渡渡」如今已成了西方流傳甚廣的諺語，用來比喻失去的一切，將不再回來。\n\
