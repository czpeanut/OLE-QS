  group_stem: "空氣汙染是當代世界嚴重的問題，過去英國也曾深受空汙的危害。日本明治時代文學家夏目漱石在旅英期間的日記中寫道：「在倫敦的街上散步時吐了口痰，當我看到自己吐出一團全黑的物體時真是吃驚。幾百萬市民每天都吸著煤煙和塵埃，汙染著他們的肺。」當時人們以煤作為驅動蒸汽機以及家中暖爐、廚具的燃料，加上西歐地區盛行風的吹拂，使空氣汙染物不斷飄向城市的下風處，形成如圖(七)煙霧瀰漫的景觀。\n\
    \  燃煤帶來的空氣汙染會影響健康，可能降低新生兒存活率，或是使得兒童發育遲緩。十九世紀時英國部分城市的居民居住區域分布也反映出貧富差距，資本家與中產階級為了尋求較好的生活品質，紛紛遷往城市中汙染較少的區域，而較為窮困的低技術勞動階級，因受工作地點和經濟考量所限，只能居住於汙染嚴重的區域。因此，思想家恩格斯在當時就發出「只有勞動階級才會呼吸受汙染的空氣」的不平之鳴。"
