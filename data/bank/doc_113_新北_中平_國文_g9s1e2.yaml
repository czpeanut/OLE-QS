    \ 提議說。「好」，別的朋友很高興地接口說，我也跟著贊同了。船在榕樹下泊了片刻，岸上很濕，我們沒有上去。朋友說這裡是「鳥的天堂」，有許多鳥在這樹上做巢，農民不許人去捉牠們。我彷彿聽見幾隻鳥撲翅的聲音，但等我的眼睛注意地去看那裡時，我卻看不見一隻鳥的影兒。只有無數的樹根立在地上，像許多根木樁。土地是濕的，大概潮漲時河水時常會沖上岸去，鳥的天堂裡沒有一隻鳥兒，我不禁這樣想。\n\
    \    第二天我們划著船到Y 的家鄉去。從N 的小學校出發，我們又經過那「鳥的天堂」。這一次是在早晨，陽光照耀在水面上，在樹梢，一切都顯得更加光明了。我們也把船在樹下泊了片刻。起初四周是靜寂的。後來忽然起了一聲鳥叫，朋友N把手一拍，我們便看見一隻大鳥飛了起來，接著又看見第二隻，第三隻。我們繼續在拍掌。很快地這樹林就變得熱鬧了。到處都是鳥聲，到處都是鳥影。大的、小的、花的、黑的，有的站在樹枝上叫，有的飛起來，有的在撲翅膀。\n\
    \    我注意地看著。我的眼睛真是應接不暇，看清楚了這隻，又看落了那隻，看見了那隻，第三隻又飛起了。一隻畫眉鳥飛了出來。給我們的拍掌聲驚嚇著，又飛進了樹林，站在一根小枝上興奮地叫著，那歌聲真好聽。\n\
