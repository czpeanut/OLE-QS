- id: doc_113_新北_中平_國文_g9s1e2_s3_36
  section: 3
  number: 36
  type: single
  page: 7
  stem: 根據上文，「田野調查」是一種什麼樣的研究方法？
  options:
  - label: A
    content: 與農民到田野間觀察、紀錄農作物的生長情形
  - label: B
    content: 先抽樣，再透過網路發送問卷蒐集大規模數據
  - label: C
    content: 到真實的生活場域中，參與、觀察研究的對象
  - label: D
    content: 操弄變項、控制環境，衡量變項間的因果關係。
  group_stem: '（四）請閱讀下文，並回答36-38 題。

    冰箱經濟學

    別人分析數據  他愛田野調查

    　　其他投資人通常仰賴市場數據和大型消費品公司財報來推測未來趨勢，身為倫敦一間投資公司的創辦人兼管理合夥人，史塔索普洛斯(Tassos Stasiopoulos)則會花好幾天進行「田野調查」，親自訪問市井小民。

    　　他發現這樣的「民族誌研究法」非常吸引人，於是投身其中，走訪非正式的聚落和工人階級社區，與人們閒聊數小時，不過光是這樣無法得到他想要的資訊。

    人們若變富有  飲食隨之改變

    　　「原因出在我的提問：假設加薪了。你會如何改變飲食？他們通常都回答什麼都不變。」史塔索解釋，「但我們知道，當人們愈來愈富有，飲食習慣往往隨之改變」。

    　　某天下午，他在印度的某內陸城市訪問一位婦女，又得到相同答覆。對方家境相當貨貧窮，家中僅有的食物也是當地很傳統的豆類、飯與醃菜。

    　　史塔索靈機一動，表示願意出錢請這位婦女帶他一起去採購，兩人來到街口一家商店，婦女買了吉百利巧克力、可口可樂和一些鹹味零食，這與她平常煮給家人吃的大相逕庭。史塔索想起，他在社會經濟階級比這位婦女高一階的家庭冰箱中，經常看見類似食物。

    　　「我發現答案就是冰箱」史塔索說，「冰箱能告訴我，人們一旦有了額外收入會有怎樣的行為──甚至在他們自己意識到之前。」於是他開始拜訪家家戶戶拍攝冰箱照片，按收入階級分門別類，以了解冰箱內容物如何演變。

    貧窮家庭冰箱 多半保存剩菜

    　　這趟旅程始於貧窮家庭購買的第一台冰箱。「對他們而言，冰箱是一種高效率設備，用來保存烹飪傳統料理的食材或剩菜。」史塔索說，「晉升中產階級，他們的冰箱內便開始有了點心和國際品牌的軟性飲料、啤酒與冰淇淋。」

    　　史塔索說，當生平第一次擁有可支配所得，人們就會想給家人這些從前無福享受的東西，同時自我炫耀一下。

    一旦所得增多  點心開始出現

    　　一旦家庭變得富有，冰箱內容物又會再度改變。原本單一品牌冰淇淋是全家共同的奢侈享受，現在擺滿各種品牌冰淇淋則顯示，冰品已變得稀鬆平常，以至於家人可以挑剔彼此的口味。

    　　「以前是『太好了，我們能買冰淇淋』，現在以自我為主：『我喜歡巧克力，不喜歡草莓』。」史塔索說。

    晉升中產階級  健康食品上場

    　　不同文化的食材、標榜零脂肪、減肥或益生菌等健康食品，也會出現在這個收入階級的冰箱架上。在史塔索的衡量中，這反映出人們對自我提升的渴望，並向個人主義與西方價值觀靠攏。

    集體福址階段  達金字塔頂端

    　　當冰箱內容物呈現出為集體福祉著想，這個家庭就達到史塔索所謂的金字塔頂端，這些包括公平貿易、有機、無殘害動物、包裝可重複使用的產品。他說，「北歐人正處於集體福祉階段，印度主要還停留在效率階段，而巴西已進入健康階段。」（下文略）　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　※本文改寫自好讀周報
