  group_stem: '（七）請閱讀下文，並回答44-45 題。

    　　宋牼將之楚，孟子遇於石丘。曰：「先生將何之？」

    　　曰：「吾聞秦 楚構兵，我將見楚王說而罷之。楚王不悅，我將見秦王說而罷之，二王我將有所遇焉。」

    　　曰：「軻也請無問其詳，願聞其指。說之將何如？」

    　　曰：「我將言其不利也。」

    　　曰：「先生之志則大矣，先生之號則不可。先生以利說秦 楚之王，秦 楚之王悅於利，以罷三軍之師，是三軍之士樂罷而悅於利也。為人臣者懷利以事其君，為人子者懷利以事其父，為人弟者懷利以事其兄。是君臣、父子、兄弟終去仁義，懷利以相接，然而不亡者，未之有也。先生以仁義說秦
    楚之王，秦 楚之王悅於仁義，而罷三軍之師，是三軍之士樂罷而悅於仁義也。為人臣者懷仁義以事其君，為人子者懷仁義以事其父，為人弟者懷仁義以事其兄，是君臣、父子、兄弟去利，懷仁義以相接也。然而不王者，未之有也。何必曰利？」　　　　　　　　　　　　　　　※本文選自孟子‧告子下'
