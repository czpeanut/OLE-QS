  group_stem: '（一）

    請閱讀下文，並回答27-28 題。

    　　駢文是古代中國一種特有的文言文文體，其句式多由四字或六字（四六句）及對仗構成，故又稱四六文、駢儷或駢體。具駢文特點而押韻者稱「駢賦」，然其因為文章受限於追求藝術技巧之故，適於寫景而不適於敘事。

    　　駢文興盛於南北朝，因當時儒學衰微，盛行追求藝術之風氣，文學作品傾向較重文辭修飾，然而漢字本來便有適合使用偶句的特點，在戰國、漢代的文人如李斯、賈誼，文章便已多用偶句，具後世駢文之雛形。士族提倡文學觀念，所發展的純文學觀念和聲律說，也促使駢文興盛。　　　　　　　　　　　　　　　　　　　　　　　　※本文節選自維基百科'
