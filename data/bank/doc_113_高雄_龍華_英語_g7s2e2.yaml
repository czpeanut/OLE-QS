  stem: Melania usually does some things before she brushes her dog. According to
    the dialogue, which is the right order ?  according to 根據 dialogue 對話 order 順序
  options:
  - label: A
    content: a→b→c→d
  - label: B
    content: b→d→a→c
  - label: C
    content: b→a→d→c
  - label: D
    content: a→d→b→c
  group_stem: 'Donald： Good afternoon, Melania! Is that your dog? What’s its name?

    Melania： Yes, it is my dog. His name is Jaguar.

    Donald： Jaguar? Does he run very fast?

    Melania： Yes, he runs very fast.

    Donald： Jaguar is really a handsome dog.

    Melania： Thanks. I brush him every day.

    Donald： How do you do that? My dog doesn’t like it.

    Melania： First, I take him for a walk in the park. He’s always happy after a walk.

    Donald： Really? That’s new to me.

    Melania： Second, I take him to his favorite tree in the park.

    Donald： What’s that for?

    Melania： He loves that tree, and he usually sits there for about fifteen minutes.

    Donald： And what’s next?

    Melania： I say his name many times and show him dog cookies, and he eats some.
    Then I take out the brush but not in front of him. Never show the brush to your
    dog.

    Donald： Wow, so much work!

    Melania： That’s right. It’s never easy.


     fast 快速地'
