  group_stem: "(三)閱讀測驗（39~42，每題3 分，共12 分）\nThe Truth of Microplastics\n  Microplastics(塑膠微粒)\
    \ are new pollution(汙染) in the world.  Microplastics are small pieces of plastic\
    \ waste.  From food to \nthe ocean, microplastics are everywhere.  The problem\
    \ is that the microplastic is too small to see(太～而無法～).  Most people \ndon’t give\
    \ enough care.  Besides, the new study shows that each one of us eats almost “a\
    \ credit card” every day.  We might eat \nthem while having seafood, breathing(呼吸入)\
    \ them in through the air, or eating food with plastic packaging.  For example,\
    \ when \nwe drink bottled water, we also drink a lot of microplastics at the same\
    \ time.  Microplastics become a terrible killer in our lives.\n  Scientists care\
    \ about this problem.  They try hard to find out the truth about microplastics.\
    \  They set a special machine outside to \nsee what happens.  They said, “You\
    \ will see all kinds of shining plastic pieces in the air.  The view is terrible.\
    \  We are sure that \nyou can also see lots of microplastics in the buildings.”\
    \  When people breathe in microplastics, they might have health problem.  \nWhat’s\
    \ more, scientists point out another problem.  If we recycle(回收利用) plastics, they\
    \ will become microplastics sooner or \nlater(早晚).  Recycling is not the answer\
    \ to our problem.  The better way is to use fewer plastic products(產品)."
