  group_stem: '(四)閱讀測驗(43~46，每題3 分，共12 分)

    Should or Shouldn’t?


    | 人物 | 內容 |

    | --- | --- |

    | Makayla Smith | Dad is too nervous(緊張的)!  All my friends are doing this; all
    my aunts and teachers are doing this, too! It’s nothing. I mean it’s not dangerous
    at all.  To me, it’s fun to put colors on my face, and it’s important to look
    good anytime. Staying up studying is killing me! |

    | Douglas Smith | Kids should be kids.  Besides, she is pretty enough.  I always
    tell her she doesn’t need make-up(化妝).  Why does she want to disguise her beauty?  I
    am also worried about this change.  Is she making wrong friends?  Is she going
    to play all day and stop learning?  What’s next? |

    | Daisy Smith | See my girl’s colorful face, I know she’s growing up.  I know
    I should let go.  I let her dress up and put up some make-up on weekends.  On
    school days, she can also wear make-up, but it has to be as natural as possible.  And
    she must not be late for school because of spending too much time putting it on.
    |

    | Robert Miller | Sometimes they want to do so because they want respect(尊重) from
    their parents.  They also want to make decisions about their own looks.  Besides,
    they usually start to wear make-up in their early teens.  It’s really important
    for teenagers to do the same things together.  This makes them feel they are not
    alone.  However, they may spend too much time on it or even look in the mirror
    too often in class.  They shouldn’t do this. |'
