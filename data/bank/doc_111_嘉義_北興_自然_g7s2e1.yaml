  group_stem: (二)胎兒在子宮內發育期，胎盤與臍帶是與母親之間物質交換的場所，養分、氧氣、廢物與二氧化碳皆透過胎盤由母親提供或處理。不幸的是，母親血液中的藥物、環境汙染或是化學藥物與病原體也有可能透過胎盤傳遞給胎兒。因此例如母親若是吸毒，胎兒一出生便患有毒癮，或是母親吸菸、喝酒，都可能對胎兒產生不好的影響。下圖為人類胎兒在母體子宮內發育的狀態，請根據圖示回答問題。
