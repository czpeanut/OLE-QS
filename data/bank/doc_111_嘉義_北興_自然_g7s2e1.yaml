- id: doc_111_嘉義_北興_自然_g7s2e1_s2_34
  section: 2
  number: 34
  type: single
  page: 3
  stem: 下列關於母系遺傳的敘述，何者正確？
  options:
  - label: A
    content: 遵守孟德爾遺傳定律
  - label: B
    content: 其遺傳方式類似血型遺傳
  - label: C
    content: 粒線體與葉綠體中的DNA 表現出的性狀，為母系遺傳
  - label: D
    content: 奶奶會將DNA 遺傳給姑姑，再遺傳給孫女。
  group_stem: '(一)在真核細胞中，除了細胞核作為細胞生命的主宰，其中含有大量的遺傳物質之外，有兩種胞器─粒線體與葉綠體，也同樣具有自己特殊的DNA
    和酵素系統，可以獨立進行複製，產生特定的蛋白質，因此被稱為半自主胞器。 更特別的是，在很多生物中，這兩種胞器是以母系遺傳的方式傳給下一代。

    母系遺傳是指帶有遺傳物質的胞器全由卵子提供，而來自父親的粒線體與葉綠體並不會傳給子代。正因為如此，母系遺傳代表這些基因不會在有性生殖時發生重組，遺傳學家可以更容易藉由DNA
    的相似性來追溯物種的祖先，而對生物的演化或是族群的分布歷程提供有利的證據。

    母系遺傳的特性─只有女性會遺傳該DNA 給下一代，而男性不會，因此可由此追溯母系的族譜，母系遺傳在科學上最著名的例子是「粒線體夏娃」，即科學家由現存人類的粒線體DNA
    回推比對，能追溯得到的最早女性。「粒線體夏娃」這位最早的母親，生存於十七萬年前的非洲，該女性的每一代後代皆有女性子孫的傳承，因此可以由女兒回推母親，母親再回推外祖母的方式，找到粒線體夏娃。'
