  stem: 根據上述資料，《木蘭辭》中出現的「胡風」，最可能來自下列何者？
  options:
  - label: A
    content: 作者錯誤將胡人文化放入該作品。
  - label: B
    content: 該朝代的統治者，大力鼓勵胡化。
  - label: C
    content: 這個朝代致力於胡漢文化的融合。
  - label: D
    content: 該朝代君主被外族尊為「天可汗」。
  group_stem: '【題組二】參考以下資料，回答23~24 題。

    西元1998年，迪士尼出品了一部長篇動畫《花木蘭》。內容敘述了某時期匈奴的領導人單于入侵中國，中國皇帝下令徵兵，要求家家戶戶需派一名男丁。女主角花木蘭有鑑於父親年事已高，於是化名花平，假扮男兒身代父從軍。該動畫改編的原始材料，是出自於北魏的民歌《木蘭辭》。在《木蘭辭》的內容中，中國統治者被稱為「天子」或「可汗」，並未被稱為漢人所習慣的「皇帝」。另外「木蘭」很有可能不是漢語，在游牧民族的文化中，指的是雄鹿、公牛或是麒麟，因此木蘭本是男性的名字，不需要另外取化名，軍中同伴也不會覺得有何奇怪的地方。

    改寫自陳三平，《木蘭與麒麟》，2019'
