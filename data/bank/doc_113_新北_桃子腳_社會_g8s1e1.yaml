  group_stem: '【題組三】請閱讀下文後，回答35 題至36 題：

    北京政府在維吾爾族居住的新疆，設立了官方所謂的「職業技能培訓中心」，聲稱是為穆斯林少數民族提供學習手藝的機會。而在這些被國際社會認為是拘留營的地方，他們實際上學習的是中文和中共意識形態。人權組織批評稱，這是試圖抹去宗教身分的舉措。據新疆地區政府2019
    年報導稱，所有「學員」現已「畢業」，並被獲准離開。

    在新疆，中國政府繼續致力於「對少數民族進行同化，並實施文化滅絕」。如今這種壓迫手段已不再明顯。「路障已被監視器取代。其目標仍是將少數民族同化，並在生活各個領域對其進行監控。」註：穆斯林─伊斯蘭教教徒

