  group_stem: '【題組五】請閱讀下文後，回答39 題至40 題：

    壯族是中華人民共和國以及越南兩國人口最多的少數民族，主要分佈在廣西壯族自治區、廣東、雲南、貴州以及越南北部地區。壯族人飲食種類豐富，喜歡清淡食物。壯族人主食以稻米、玉米為主，輔食有紅薯、木薯、麥子、黃粟等雜糧。壯族人稱粽子為
    「粽把」，其種類繁多，在廣西寧明縣，春節時壯族人會製作一種巨大的粽把，這個粽把是用來除夕祭祖用的，祭祀完後同族人便共同分食這隻大粽把，以示大家同心同德，和睦美滿。

    壯族生食的傳統十分悠久。生食中既有植物，也有動物，甚至活的動物，其中最有名的是生血和生魚片。他們也喜歡食用各種醃製食品，不僅醃製各種野生蔬菜，也醃製肉類魚蝦。壯族和西南地區的其他少數民族一樣，也非常愛吃酸辣的食物，這與他們的生活環境和特產有關。

    資料來源：維基百科網站：壯族'
