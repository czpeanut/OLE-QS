  group_stem: '【題組四】請閱讀下文後，回答37 題至38 題：

    中國國家統計局今天公布2023 全國人口14 億967 萬人，比2022 年末減少208 萬人，人口連續2 年負成長；不過由於2024 年生肖是龍年，有專家認為可能有助人口減緩。

    根據中國國家統計局數據，2023 年末全國人口（包括31 個省、自治區、直轄市和現役軍人的人口，不包括港澳台居民和外籍人員）14 億967 萬人，比2022
    年減少208 萬人。全年出生人口902 萬人，人口出生率為千分之6.39；死亡人口1110 萬人，人口死亡率為千分之7.87。從年齡構成看，16 至59 歲的勞動年齡人口8
    億6481 萬人、占全國人口61.3%，60 歲及以上人口2 億9697 萬人、占21.1%，65 歲及以上人口2 億1676 萬人、占15.4%。

    中國官方表示，2022 年末總人口年減85 萬人，是1961年以來首次負成長，因此2023 年減少208 萬人是連續第2年負成長。               資料來源：中央社新聞網20240117'
