  page: 4
  stem: 關於北韓的選舉制度，下列敘述何者正確？
  options:
  - label: A
    content: 北韓有定期選舉，是民主制度成熟的國家
  - label: B
    content: 修改選舉法後，所有候選人都能公平競爭
  - label: C
    content: 外媒不認為北韓人民享有參政權
  - label: D
    content: 北韓的選舉制度符合我國憲法保障的權利
  group_stem: '【題組七】請閱讀下文，回答47-48 題

    北韓於2023 年11 月舉行地方議會選舉，受到8 月修改的選舉法影響，部分選區罕見不再只有1 名候選人參選，而是有2 名候選人參選。然而選舉結果對國家認可的候選人絕對有利。根據北韓官媒朝中社報導，這次投票率達到99.63%，讓人民能自行選出人選實現民主、履行公民義務。但外媒分析，讓人民象徵式投票，實際是變相進行人口普查，可以監控每個選區的人口狀況，以及是否有新的脫北者出現。'
