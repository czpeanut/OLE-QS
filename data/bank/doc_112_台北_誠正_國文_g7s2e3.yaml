    content: 司馬光推薦劉世安是因彼此交誼深厚
  - label: D
    content: 劉世安以為司馬光是因好友之故而提拔他。
  group_stem: 司馬光曾推薦劉世安擔任館職。事後，他問劉世安：「知道我為什麼推薦你嗎？」劉回答說：「因為我們是好朋友。」司馬光說：「不是的。因為我罷職的時候，你逢年過節，問訊不斷；我在職的時候，你卻從不寫信。這就是我推薦你的原因。」
