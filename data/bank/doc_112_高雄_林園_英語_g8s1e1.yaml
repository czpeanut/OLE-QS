  options:
  - label: A
    content: The Taliban shot Malala’s family.
  - label: B
    content: She didn’t care about Women.
  - label: C
    content: She liked her school life very much.
  - label: D
    content: She joined the Taliban at school.
  group_stem: "There is a woman from Pakistan, and her name is Malala Yousafzai. When\
    \ she was a child, she always loved her \nschool and classes. At that same time,\
    \ there was a group of people, the Taliban. They didn’t care about women’s education.\
    \ \n“Woman should be cooking at home and having babies. They shouldn’t go to school.”\
    \ The Taliban said. They then stopped \nwomen from going to school ever again.\
    \ \n \nMalala didn’t like this, so she did something about it. She wrote her story\
    \ and spoke it out for the world. The Taliban \nwas very angry, so they shot her.\
    \ She was almost dead. Two years later, she won the Nobel Peace Prize. What an\
    \ amazing \nwoman!        Pakistan 巴基斯坦  Taliban 塔利班組織  childhood 童年時期  group\
    \ 團體  education 教育   \n                 shot 射擊  Nobel Peace Prize 諾貝爾和平獎"
