  group_stem: "Cinco de Mayo  \nCinco de Mayo means “May 5th” and is a celebration\
    \ of Mexican culture. People celebrate it every year in Mexico \nand some parts\
    \ of America. \nThe people of Mexico celebrate Cinco de Mayo with food, music,\
    \ and dancing. Girls wear beautiful and colorful \ndresses. They also put flowers\
    \ in their hair. Boys wear a sombrero, or Mexican hat. \nIn America, many schools\
    \ teach children about Mexican culture. Children decorate Mexican flags and learn\
    \ some \nMexican songs and dances. They dance together, have fun, and learn about\
    \ Mexico. Learning about other cultures is a \nfun experience for all. \n celebration\
    \ 慶祝 Mexico 墨西哥 Mexican 墨西哥人(的)/墨西哥的 culture 文化 flag 國旗"
