  section: 2
  number: 30
  type: single
  page: 4
  stem: 關於古典韻文的敘述，何者說明正確？
  options:
  - label: A
    content: 近體詩在格律上要求嚴謹，包含要注意字的平仄，押韻時平仄不可通押，且不可以轉韻
  - label: B
    content: 樂府詩、近體詩、宋詞、元曲皆是合樂可歌的，只有古詩是可吟不可唱
  - label: C
    content: 新詩是相對於「古詩」而言，所以古詩的偶數句一定要押韻，新詩的押韻限制較多
  - label: D
    content: 樂府詩多以寫景抒情為主，可分為邊塞詩派、山水田園詩派、浪漫詩派等。
