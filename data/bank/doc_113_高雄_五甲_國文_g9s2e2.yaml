  stem: 「鹿畏軀（ㄔㄨˊ，山貓），軀畏虎，虎畏羆（ㄆㄧˊ，棕熊）。羆之狀，被髮人立，絕有力而甚害人焉。楚之南有獵者，能吹竹為百獸之音。寂寂持弓矢罌火，而即之山，為鹿鳴以惑其類，伺其至，發火而射之。軀聞其鹿也，趨而至。其人恐，因為虎而駭之。軀走而虎至，愈恐，則又為羆，虎亦亡去。羆聞而求其類，至，則人也。捽搏挽裂而食之。今夫不善內而恃外者，未有不為羆之食也。」（〈柳宗元・羆說〉）閱讀完上文，請選出最能合乎本文主旨的選項：
