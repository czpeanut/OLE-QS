- id: doc_113_高雄_五甲_國文_g9s2e2_s3_9
  section: 3
  number: 9
  type: single
  page: 7
  stem: 請問文中的男主角，其死亡「原因」為何？
  options:
  - label: A
    content: 因鼻子吸入過多的胡粉而嗆死
  - label: B
    content: 女子表態不喜歡，故男子抑鬱而終
  - label: C
    content: 女子晚上如期赴約，男子過度興奮而猝死
  - label: D
    content: 買太多胡粉引起父母憤怒將其打死。
  group_stem: '有人家甚富，止有一男，寵恣過常。游市，見一女子美麗，賣胡粉①，愛之，無由自達，乃託買粉。日往市，得粉便去，初無所言。積漸久，女深疑之。明日復來，問曰：「君買此粉，將欲何施？」答曰：「意相愛樂，不敢自達，然恆欲相見，故假此以觀姿耳。」女悵然有感，遂相許以私，剋②以明夕。

    其夜，安寢常屋，以俟女來，薄暮果到。男不勝其悅，把臂曰：「宿願始伸於此！」歡踴遂死。女惶懼，不知所以，因遜去，明還粉店。至食時，父母怪男不起，往視，已死矣。

    當就殯殮，發篋笥③中，見百餘裹胡粉，大小一積。其母曰：「殺吾兒者，必此粉也。」入市遍買胡粉，次④此女，比之，手跡如先，遂執問女曰：「何殺吾兒？」女聞嗚咽，具以實陳。父母不信，遂以訴官。

    女曰：「妾豈復吝死，乞一臨屍盡哀。」縣令許焉。徑往，撫之慟哭，曰：「不幸致此，若死魂而靈，復何恨哉！」男豁然更生，具說情狀，遂為夫婦，子孫繁茂。（出自《幽明錄》）

    選自李昉《太平廣記・買粉兒》

    注釋：①胡粉：古人用來擦臉的鉛粉。②剋：約定。③篋笥：竹箱。④次：輪到。'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
