- id: doc_113_高雄_五甲_國文_g9s2e2_s3_5
  section: 3
  number: 5
  type: single
  page: 6
  stem: 下列文句所省略的主語，何者說明正確？
  options:
  - label: A
    content: 復步歸舍 —— 周壽誼
  - label: B
    content: 狀甚矍鑠 —— 太祖
  - label: C
    content: 聞崑山腔甚嘉 —— 周壽誼
  - label: D
    content: 命賞酒飲罷歸 —— 太祖。
  group_stem: '周壽誼，崑山人，年百歲。其子亦躋八十，同赴蘇庠鄉飲，徒步而往。既至，子坐於階石，氣喘，父笑曰：「少年何困倦乃爾！」飲畢，子欲附舟，父不可，復步歸舍。崑距蘇七十餘里，往返便捷，其精力強健如此。後太祖聞其高壽，特召至京。拜階下，狀甚矍鑠。問：「今歲年若干？」對云：「一百七歲。」又問：「平日有何修養而能致此？」對曰：「清心寡欲。」上善其對，笑曰：「聞崑山腔甚嘉，爾亦能謳否？」曰：「不能，但善吳歌。」命之歌。歌曰：「月子彎彎照幾州，幾人歡樂幾人愁。幾人夫婦同羅帳，幾人飄散在他州。」上撫掌，命賞酒飲罷歸。後至一百十七歲，端坐而逝。子亦年九十八，其孫多至八十外，蓋緣稟賦厚素也。

    ——改寫自周玄暐《涇林續記》'
