- id: doc_113_高雄_五甲_國文_g9s2e2_s2_1
  section: 2
  number: 1
  type: single
  page: 1
  stem: 「陸公嘗於市遇一佳硯，議價未定。既還邸，使門人往，以一金易歸。門人持硯歸，公訝其不類。門人堅證其是。公曰：『向觀硯有鴝鵒眼，今何無之？』答曰：『吾嫌其微凸，路遇石工，令磨而平之。』公大惋惜。」（馮夢龍《古今譚概・硯眼》）關於上文故事中人物的敘述，何者最恰當？
  options:
  - label: A
    content: 門人買錯硯臺卻不知道
  - label: B
    content: 陸公惋惜是因為石工技藝不佳
  - label: C
    content: 門人請人磨平硯眼是自作聰明
  - label: D
    content: 陸公對門人購硯的價格感到驚訝。(考古題)
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_高雄_五甲_國文_g9s2e2_s2_2
  section: 2
  number: 2
  type: single
  page: 1
  stem: 「學書之法，初學分布，但求平正；既知平正，務追險絕；既能險絕，復歸平正。初謂未及，中則過之，後乃通會。」（孫過庭《書譜》）這段話的寫作用意主要在表明何種觀念？
  options:
  - label: A
    content: 說明學習書法的不同階段與進境
  - label: B
    content: 強調練習書法時要有正確的心態
  - label: C
    content: 提醒常人不應追求艱難的書法技巧
  - label: D
    content: 指出書法的最高境界在於標新立異。(考古題)
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_高雄_五甲_國文_g9s2e2_s2_3
  section: 2
  number: 3
  type: single
  page: 1
  stem: 「蓋天下有反覆之小人，亦有反覆之君子。人但知不反覆不足以為小人，庸不知反覆亦不足以為君子。蓋小人之反覆也，因風氣勢利之所歸，以為變動；君子之反覆也，因學識之層累疊進，以為變動。其反覆同，其所以為反覆者不同。」（孫寶瑄《忘山廬日記》）根據這段文字，作者認為「不反覆亦不足以為君子」的原因，最可能是下列何者？
  options:
  - label: A
    content: 小人若洗心革面，一反前非即可成為君子
  - label: B
    content: 為應對小人反覆，不得不改變既有的策略
  - label: C
    content: 順應民心的向背，選擇最適合現況的做法
  - label: D
    content: 隨著所知的增長，會修正自己原本的觀點。(考古題)
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
