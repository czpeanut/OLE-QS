- id: doc_113_高雄_五甲_國文_g9s2e2_s3_1
  section: 3
  number: 1
  type: single
  page: 5
  stem: 關於上文的文意解讀，敘述最適當的是？
  options:
  - label: A
    content: 勞侖次在實驗計算的誤差，間接造成遠方龍捲風的發生
  - label: B
    content: 勞侖次的發現在論文發表後，因傳播不足而未受到重視
  - label: C
    content: 文中引述英文詩與蘇軾的詩作，說明「混沌理論」的人文應用
  - label: D
    content: 「混沌理論」在人文領域的廣泛傳播，導致新聞媒體的混亂。
  group_stem: '甲、在現代科學史中，真正數學和物理學意義下的「混沌理論」，公認是由麻省理工學院的氣象學家勞侖次（Lorenz）提出的。1961年冬的一天，當時還是副教授的勞侖次用一臺
    Royal McBee LPG-30 電腦，對一個包含 12 個微分方程的氣象動力學方程組進行數值模擬試驗。在其中的一次驗算裡，為貪圖方便，他把一個小數點後六位數的初始值做了四捨五入處理，僅輸入了小數點後前三位數。讓他大吃一驚的是，這個與精確數值不到千分之一的誤差，讓最後計算結果大相徑庭。

    這個偶然的取值過失，讓勞侖次發現了一個簡單具體並且有明確物理意義的、可以用來表現和驗證彭加萊「混沌理論」的數學模型。1963 年，勞侖次在美國《氣象學報》上發表了題為〈確定性的非周期流〉的論文。這篇文章和他隨後發表的另一篇相關論文，指出對於模型中關鍵參數的微小改變會導致完全不一樣的結果，使得有規律的周期性行為能夠進入雜亂無章的狀態，令精確的長期天氣預報變得不可能。

    像歷史上許多偉大成果的命運一樣，勞侖次的重要發現在論文發表後漫長的 10 年裡，一直沒有引起科學界的注意。1972 年，勞侖次在美國科學發展學會第 139
    次會議上做了一個題為「可預測性：巴西一隻蝴蝶扇動一下翅膀，能否在德克薩斯州掀起一場龍捲風」的演講。他指出，一個微小的初始條件變化有可能引起一連串逐漸被放大的改變，最終導致完全意外的不同結果。這個觀點澈底粉碎了歷史上人們對「現時的確定性因果關係決定了對將來行為的可預測性」深信不疑的傳統觀念。他的這個「蝴蝶效應」通俗比喻，開始讓人們認識到「混沌」這一自然現象的存在和重要性。自此之後，「混沌學」成了一個活躍的研究方向，並被認為是在
    20 世紀繼「相對論」和「量子力學」之後的第三個科學革命。接下來，學術論文和科普書籍接踵而至。

    乙、明白了「蝴蝶效應」的意思之後，你可能會聯想到許許多多歷史和現實生活中的例子和故事。你一定會想起「差之毫釐，繆以千里」這一成語。你也可能也知道一首英文詩：

    因為一根鐵釘丟了，使得一個馬蹄鐵壞了。

    因為一個馬蹄鐵壞了，使得一匹戰馬摔倒了。

    因為一匹戰馬摔倒了，使得一個騎兵陣亡了。

    因為一個騎兵陣亡了，使得一場戰役輸了。

    因為一場戰役輸了，使得一個國家滅亡了。

    你可能還會想起蘇軾的一首七言詩：（註）

    斫得龍光竹兩竿，持歸嶺北萬人看。

    竹中一滴曹溪水，漲起西江十八灘。

    所有這些詩歌、諺語和故事都表達了同一個意思：初始條件微小的差別或改變，可能引發出巨大無比的後期效應。這正是科學「混沌理論」最根本的特徵。自從勞侖次在氣象預報研究中發現了混沌現象以來，人們陸續發現在眾多自然和社會變化中，如股市的起伏、政治的波動、天體的運行、疾病的傳播、心率的節奏、大腦的思維等，都在一定程度上存在混沌現象。近年來有不少新聞報導說，科學意義下的「混沌理論」在生物醫學、信息隱藏、流體混合等方面都找到了一些成功的應用。

    （節錄自陳關榮〈混沌的故事：都是蝴蝶惹的禍？〉）

    註：〈東坡居士過龍光，求大竹作肩輿，得兩竿。南〉'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
