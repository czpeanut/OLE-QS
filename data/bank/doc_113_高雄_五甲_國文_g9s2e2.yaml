- id: doc_113_高雄_五甲_國文_g9s2e2_s3_3
  section: 3
  number: 3
  type: single
  page: 6
  stem: 第二段在上文整體脈絡中，主要用意在彰顯洗衣機：
  options:
  - label: A
    content: 是改變世界的重要發明
  - label: B
    content: 為不重要的製造業產品
  - label: C
    content: 占去女性太多家務時間
  - label: D
    content: 有效降低家庭生活開支。
  group_stem: '當我們說：網路帶來翻天覆地的改變，是否只因它發生在眼前？

    1870 年代的美國，家庭傭工占就業人口 8%，到 1990 年代只占 0.6%。家庭傭工減少，與家電問世關係密切。美國 1940 年代的一項調查顯示：洗
    38 磅衣服，人工需 4 小時，用洗衣機只花 41 分鐘。當家事不再占用大量時間，家庭成員的生活也跟著改變。美國 35～44 歲已婚白人婦女的外出工作比率，1890
    年代極低，2000 年代則將近 80%。女性在家庭和社會的角色轉變，使重男輕女的觀念逐漸消失，進而提高女性的地位。

    在 1866 年跨大西洋有線電報啟動之前，一份 300 字文件以輪船寄送約要兩星期，但改用電報傳輸，只需 7.5 分鐘，速度快了 2500 倍以上。而網路發明後，email
    發送 300 字訊息雖只要 2 秒，卻只比用傳真機花 10 秒快了 5 倍。

    洗衣機、電報和網路均對世界產生革命性的影響，但當前過度宣稱網路無遠弗屆的效益，往往造成一些國家誤以為製造業已經「過時」，應努力靠創意過活，導致產業發展失衡。當我們回顧過往至今的科技發展，不應「把望遠鏡拿反」，以免對國家政策、企業經營或個人職涯，做出失當的決定。'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
