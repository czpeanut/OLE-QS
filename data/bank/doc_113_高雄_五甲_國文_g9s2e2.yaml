  stem: 下列是一段被打散的古文：「昔周公之相也，甲、皆諸侯卿相之人也，況處三公之尊以養天下之士哉？乙、今以公卿之上位，爵祿之美，而不能致士丙、謙卑而不鄰，以勞天下之士丁、孔子無爵位，以布衣從才士七十有餘人戊、是以俊義滿朝，賢智充門，則未有進賢之道。」（節錄自桓寬《鹽鐵論・卷二・〈刺復〉》），請將甲、乙、丙、丁、戊依照文意重新排列成正確的順序？
