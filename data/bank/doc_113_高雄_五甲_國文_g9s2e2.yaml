- id: doc_113_高雄_五甲_國文_g9s2e2_s3_7
  section: 3
  number: 7
  type: single
  page: 7
  stem: 從甲文的內容中來判斷，下列何者說明是正確的？
  options:
  - label: A
    content: 優孟之所以「仰天大哭」，是因哀悼馬的死亡
  - label: B
    content: 從「使群臣喪之，欲以棺槨大夫禮葬之」可知楚莊王「賤人貴馬」的行為
  - label: C
    content: 由「衣以文繡，置之華屋之下，席以露床，啖以棗脯」表現楚王「民胞物與」的精神
  - label: D
    content: 「老弱負土，齊、趙陪位於前，韓、魏翼衛其後」展現全楚國人對馬之喪亡的哀慟。
  group_stem: '甲、優孟，故楚之樂人也。長八尺，多辯，常以談笑諷諫。楚莊王之時，有所愛馬，衣以文繡，置之華屋之下，席以露床，啖以棗脯。馬病肥死，使群臣喪之，欲以棺槨大夫禮葬之。左右爭之，以為不可。王下令曰：「有敢以馬諫者，罪至死。」優孟聞之，入殿門。仰天大哭。王驚而問其故。優孟曰：「馬者王之所愛也，以楚國堂堂之大，何求不得，而以大夫禮葬之，薄。請以人君禮葬之。」王曰：「何如？」對曰：「臣請以雕玉為棺，文梓為槨，梗、楓、豫、章①為題湊②，發甲卒為穿壙③，老弱負土，齊、趙陪位於前，韓、魏翼衛其後，廟食太牢，奉以萬戶之邑。諸侯聞之，皆知大王賤人而貴馬也。」王曰：「寡人之過一至此乎！為之奈何？」優孟曰：「請為大王六畜葬之。以壟灶④為槨，銅歷⑤為棺，齎以薑棗，薦以木蘭，祭以糧稻，衣以火光，葬之於人腹腸。」於是王乃使以馬屬太官，無令天下久聞也。

    乙、淳于髡者，齊之贅婿也。長不滿七尺，滑稽多辯，數使諸侯，未嘗屈辱。齊威王之時喜隱，好為淫樂長夜之飲，沉湎不治，委政卿大夫。百官荒亂，諸侯並侵，國且危亡，在於旦暮，左右莫敢諫。淳于髡說之以隱曰：「國中有大鳥，止王之庭，三年不蜚又不鳴，王知此鳥何也？」王曰：「此鳥不飛則已，一飛沖天；不鳴則已，一鳴驚人。」於是乃朝諸縣令長七十二人，賞一人，誅一人，奮兵而出。諸侯振驚，皆還齊侵地。威行三十六年。語在《田完世家》中。

    節錄自《史記・滑稽列傳》

    註：①梗、楓、豫、章：都是有名的貴重木材。②題湊：木頭都向內。③穿壙：挖掘墓穴。④壟灶：用土堆成的灶。⑤銅歷：大銅鍋。'
