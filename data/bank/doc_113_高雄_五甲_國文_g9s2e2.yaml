- id: doc_113_高雄_五甲_國文_g9s2e2_s2_31
  section: 2
  number: 31
  type: single
  page: 4
  stem: 「士君子立身事主，既名知己，則當竭盡知謀，忠告善道，銷患於未形，保治於未然，俾身全而主安；生為名臣，死為上鬼，垂光百世，照耀簡策，斯為美也。苟遇知己，不能扶危於未亂之先，而乃捐軀殞命於既敗之後，釣名沽譽，眩世駭俗。由君子觀之，皆所不取也。」（方孝孺〈豫讓論〉）本段文字旨在強調：「士君子立身事主」，應當有何作為？
  options:
  - label: A
    content: 竭盡智謀，忠告善道
  - label: B
    content: 防患未然，扶危持顛
  - label: C
    content: 捐軀殞命，眩世駭俗
  - label: D
