- id: doc_113_高雄_五甲_國文_g9s2e2_s2_29
  section: 2
  number: 29
  type: single
  page: 4
  stem: 《文心雕龍・神思》中說：「方其搦翰（執筆），氣倍辭前，暨乎篇成，半折心始。何則？意翻空而易奇，言徵實而難巧也。是以意授於思，言授於意，密則無際，疏則千里。」以下選項中對於「靈感」的看法，何者最接近劉勰的說法？
  options:
  - label: A
    content: 沒有靈感的時候，就停止寫作一段時間，可以從剪報、看書去尋找
  - label: B
    content: 靈感是可以控制的，若要使靈感源源不絕，唯有不停地創作
  - label: C
    content: 靈感確實存在，但把靈感誇飾成「創作最重要的泉源」，那是不折不扣的幻覺
  - label: D
    content: 當靈感以「思想火花」的形式一閃而現，想像力即將飛馳。這時要將思維轉化為文字，就需要具備足夠的語文知識和充沛的情感。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
