  stem: 某日電視機裡傳來一句廣告詞—「科技始終來自於人性」，而這也一語道破「需要是發明之母」這句話。如果不是因為對速度、產量的需求，人類不可能有生產上的突破，更不會有製造業的出現。請問：促成工業革命的出現，應該歸功於下列哪個產業的突破？
