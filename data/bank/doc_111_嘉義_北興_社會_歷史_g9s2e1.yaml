questions:
- id: doc_111_嘉義_北興_社會_歷史_g9s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 英國之所以是工業革命的發源地，是因為它擁有下列哪一條件？
  options:
  - label: A
    content: 最早向海外進行拓殖運動
  - label: B
    content: 棉紡織工業具有優良傳統
  - label: C
    content: 政治安定、煤礦蘊產豐富
  - label: D
    content: 人口眾多，勞力充足。
- id: doc_111_嘉義_北興_社會_歷史_g9s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 阿榮要利用暑假至美國旅遊，如果他想參訪美國獨立建國初期的歷史古蹟，應該參加下列哪一旅遊團？
  options:
  - label: A
    content: 《浪漫假期》夏威夷風情 6 日遊
  - label: B
    content: 《戀戀美東》首都博覽 10 日遊
  - label: C
    content: 《陽光美南》佛羅里達 9 日遊
  - label: D
    content: 《歡樂美西》大峽谷 8 日遊。
- id: doc_111_嘉義_北興_社會_歷史_g9s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 某位在法國大革命後期崛起的軍人，他曾說：「我曾主編並實施了一部以我的名字命名的法典……我曾經把歐洲踩在我的腳下……。」請問：此段話應該是何人所說？
  options:
  - label: A
    content: 路易十四
  - label: B
    content: 拿破崙
  - label: C
    content: 路易十六
  - label: D
    content: 華盛頓。
- id: doc_111_嘉義_北興_社會_歷史_g9s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 西元 1773 年，波士頓居民將英國東印度公司商船運來的茶葉倒入海中，是為了抗議英國政府何種作為？
  options:
  - label: A
    content: 禁止殖民地茶農買賣黑奴
  - label: B
    content: 拒絕採購殖民地的茶葉
  - label: C
    content: 開放外國茶葉進口，導致殖民地茶農生活困苦
  - label: D
    content: 堅持對殖民地人民徵稅。
- id: doc_111_嘉義_北興_社會_歷史_g9s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 英國小說家狄更斯的《孤雛淚》描述倫敦某一時期社會混亂不堪，童工受虐嚴重、救濟法案不足，貧民窟治安與環境糟糕，資本家與貴族獨占所有社會利益。《孤雛淚》的背景最有可能出現於下列何時？
  options:
  - label: A
    content: 文藝復興
  - label: B
    content: 科學革命
  - label: C
    content: 啟蒙運動
  - label: D
    content: 工業革命。
- id: doc_111_嘉義_北興_社會_歷史_g9s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 十九世紀開始，歐洲興起了帝國主義的行徑，即積極向亞洲進行侵略行動，以換得更多的原物料以及貿易市場，並派遣傳教士加以傳教。下列關於帝國主義興起的原因，何者敘述錯誤？
  options:
  - label: A
    content: 因為工業革命的影響之下，使得歐洲各國需要尋找海外市場及原料
  - label: B
    content: 歐洲諸國相信社會達爾文主義優勝劣敗的認知，認為自己有能力以及具合理性侵略他人
  - label: C
    content: 在經過十八、十九世紀的思潮與工業革命的影響之下，使得歐洲武力與交通運輸技術之發達
  - label: D
    content: 歐洲國家相信亞洲地區的經濟發展遠勝於歐洲，因此歐洲國家才會積極向亞洲加以侵略。
- id: doc_111_嘉義_北興_社會_歷史_g9s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 十九世紀的義大利透過許多能人志士不懈的努力，突破強國阻撓的困境，運用靈活的外交手段，完成國家統一的理想。下列有關義大利統一建國的敘述，何者錯誤？
  options:
  - label: A
    content: 薩丁尼亞王國是領導統一運動的主要勢力
  - label: B
    content: 西元1870 年從西班牙手中取回羅馬，完成統一
  - label: C
    content: 十九世紀時仍有許多地方受到奧、法等勢力的控制
  - label: D
    content: 馬志尼宣揚民族意識，鼓吹統一。
- id: doc_111_嘉義_北興_社會_歷史_g9s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 在歐洲列強控制下，亞、非許多地區遲至二十世紀中後期才脫離殖民統治，但是拉丁美洲國家卻能在十九世紀初期獲得獨立，主要原因為何？
  options:
  - label: A
    content: 受啟蒙思想與民族主義影響
  - label: B
    content: 美國總統華盛頓在1823 年發表宣言，強調歐洲國家不應該干預美洲事務
  - label: C
    content: 本身擁有軍事實力和文化基礎
  - label: D
    content: 本身產業發達且經濟富裕。
- id: doc_111_嘉義_北興_社會_歷史_g9s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 十九世紀帝國主義的擴張，其影響的層面不只是經濟，也對世界政局的發展有普遍性的影響，甚至持續影響到現代。下列關於帝國主義的敘述，何者正確？
  options:
  - label: A
    content: 非洲成為列強競逐占據的地區，非洲也因為殖民經濟的因素而逐漸富裕起來
  - label: B
    content: 英國占據了印度，成為其在亞洲的重要據點，並大量生產棉、茶等經濟作物，使英國從中獲取利潤
  - label: C
    content: 除了亞洲及非洲地區，拉丁美洲也是歐洲列強相繼前往侵略的地方，並將拉丁美洲四處瓜分
  - label: D
    content: 歐洲帝國主義只有影響亞洲及非洲地區的經濟發展，對於這些國家的政治發展並沒有實質的影響。
- id: doc_111_嘉義_北興_社會_歷史_g9s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 下列有關義大利統一三傑的敘述，何者正確？
  options:
  - label: A
    content: 伊曼紐二世曾經採取恐怖統治的方式，驅逐奧國
  - label: B
    content: 加富爾身為薩丁尼亞的首相，積極與奧國結盟，排除法國勢力
  - label: C
    content: 加里波底組織紅衫軍，迅速征服義大利半島北部
  - label: D
    content: 馬志尼以「恢復古羅馬光榮」為號召，鼓吹民族復興運動。
- id: doc_111_嘉義_北興_社會_歷史_g9s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 19 世紀中期以後，美國屢次發動對外戰爭，逐漸擴張領土，讓下列何者幾乎成為美國的內海？
  options:
  - label: A
    content: 地中海
  - label: B
    content: 亞得里亞海
  - label: C
    content: 波羅的海
  - label: D
    content: 加勒比海。
- id: doc_111_嘉義_北興_社會_歷史_g9s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 造成帝國主義興起的主要因素，下列何者為非？
  options:
  - label: A
    content: 新興工業國家為了爭奪原料、礦產和市場
  - label: B
    content: 列強認為負有「教化」落後地區的使命
  - label: C
    content: 列強在民族自尊與愛國榮耀驅使下，彼此競爭
  - label: D
    content: 受到法國大革命的影響。
- id: doc_111_嘉義_北興_社會_歷史_g9s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 拉丁美洲之所以成為西班牙、葡萄牙的殖民地，是受下列哪一歷史事件發展的影響？
  options:
  - label: A
    content: 第一次世界大戰
  - label: B
    content: 美國獨立
  - label: C
    content: 發現新航路
  - label: D
    content: 法國大革命。
- id: doc_111_嘉義_北興_社會_歷史_g9s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: 日本最近正在進行紙鈔改版，舊版一萬圓紙鈔上印刷的是福澤諭吉。對日本人來說，因為福澤諭吉提出脫亞論，再加上日本自身積極進行改革，最後才躋身列強行列。請問：日本改革後首要侵略對象為何？
  options:
  - label: A
    content: 緬甸
  - label: B
    content: 越南
  - label: C
    content: 美國
  - label: D
    content: 中國。
- id: doc_111_嘉義_北興_社會_歷史_g9s2e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 艾莉絲是一個在美洲新大陸長大的孩子，她回憶政府機關上方懸吊的國旗，有一天從甲圖變成乙圖。請問：國旗的變化所代表的意義為何？
  options:
  - label: A
    content: 爆發波士頓茶葉事件
  - label: B
    content: 北美 13 州發表《獨立宣言》
  - label: C
    content: 各國承認新國家的建立
  - label: D
    content: 憲法採取孟德斯鳩三權分立的概念。
  assets:
  - key: s1_15_f1
    kind: figure
    file: doc_111_嘉義_北興_社會_歷史_g9s2e1/s1_15_f1.png
- id: doc_111_嘉義_北興_社會_歷史_g9s2e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 拿破崙向外擴張的行動，最終雖然失敗，卻將何種精神，隨著他的征戰在歐洲四處散播？
  options:
  - label: A
    content: 君權神授的理論
  - label: B
    content: 恐怖統治的方式
  - label: C
    content: 啟蒙運動後的開明專制
  - label: D
    content: 自由、平等、博愛的革命精神。
- id: doc_111_嘉義_北興_社會_歷史_g9s2e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 小恩某日在書裡看到這段內容： 「1793 年，法國共和新政府瘋狂追捕異議分子並處死，革命家馬拉因而躲進下水道，但最後卻被他的政敵派出刺客在浴缸中刺殺。畫家為了悼念馬拉之死，將他描繪成了為革命而獻身的殉道者，留下『馬拉之死』的著名畫作。」請問：上述事件最有可能發生在下列何時的法國？
  options:
  - label: A
    content: 路易十四統治下
  - label: B
    content: 維也納會議之後
  - label: C
    content: 法國大革命期間
  - label: D
    content: 拿破崙稱帝時期。
- id: doc_111_嘉義_北興_社會_歷史_g9s2e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 有關法國大革命前夕召開「三級會議」的敘述，何者錯誤？
  options:
  - label: A
    content: 路易十四所召開
  - label: B
    content: 三級會議指貴族、教士、平民三個階級
  - label: C
    content: 目的是為解決財政困難
  - label: D
    content: 平民代表要求改革。
- id: doc_111_嘉義_北興_社會_歷史_g9s2e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 歷史課時，老師請同學討論德、義兩國在統一過程中有何相似之處？請問：下列何人說法錯誤 ？
  options:
  - label: A
    content: 汶新： 統一前皆有小邦林立的情況
  - label: B
    content: 怡蓁：統一的阻礙皆為奧國與俄國
  - label: C
    content: 皓元：兩國皆透過德法戰爭而統一
  - label: D
    content: 競翔：兩國的首相皆具有靈活巧妙的外交手腕。
- id: doc_111_嘉義_北興_社會_歷史_g9s2e1_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 下列有哪些是維也納會議的原則？(甲)恢復各國王室統治權(乙)謀求歐洲的安定與和平(丙)維持各國勢力均衡(丁)傳播自由、平等、民主的觀念
  options:
  - label: A
    content: 甲丙丁
  - label: B
    content: 甲乙丙
  - label: C
    content: 甲乙丁
  - label: D
    content: 乙丙丁。
- id: doc_111_嘉義_北興_社會_歷史_g9s2e1_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 俊豪是歷史系的學生，他對於工業革命這個主題非常有興趣，於是計畫在暑假前往工業革命發源地蒐集資料。請問：宇浩應前往附圖（一）中的哪個地區？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
  assets:
  - key: s1_21_f1
    kind: figure
    file: doc_111_嘉義_北興_社會_歷史_g9s2e1/s1_21_f1.png
- id: doc_111_嘉義_北興_社會_歷史_g9s2e1_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 附圖（二）中可見歐洲各國首領，圍坐在一塊名為非洲的蛋糕前，彼此爭論如何畫分非洲。請問：歐洲各國對非洲的瓜分，產生何種影響？
  options:
  - label: A
    content: 非洲全境皆淪為歐洲列強的殖民地
  - label: B
    content: 種下日後非洲境內戰爭頻仍的原因
  - label: C
    content: 在非洲被徹底瓜分前，美國提出《門羅宣言》
  - label: D
    content: 《門羅宣言》保障了非洲各國的獨立。
  assets:
  - key: s1_22_f1
    kind: figure
    file: doc_111_嘉義_北興_社會_歷史_g9s2e1/s1_22_f1.png
- id: doc_111_嘉義_北興_社會_歷史_g9s2e1_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: 維也納會議的召開，是為了重組當時歐洲混亂的政治秩序，此會議由奧國首相梅特涅主導，大多歐洲代表都派員共襄盛舉，為往後各國勢力的發展以及重整政治秩序加以努力。下列關於「維也納會議」的敘述，何者正確？
  options:
  - label: A
    content: 維也納會議主張「維持現狀」，維持歐洲各國現有的政治狀態，並不鼓勵改變現狀
  - label: B
    content: 維也納會議是在反法聯軍擊敗拿破崙後才召開
  - label: C
    content: 維也納會議對於法國大革命後的秩序影響甚深，尤其是法國，在此之後法國就遵照維也納會議的決議，逐步走向和平
  - label: D
    content: 維也納會議被視為是改革勢力的展現。
- id: doc_111_嘉義_北興_社會_歷史_g9s2e1_s1_24
  section: 1
  number: 24
  type: single
  page: 2
  stem: 西元1789 年公布的某項文件這樣寫著：「……組成國民會議的法國人民代表們已經決議在一個莊嚴的宣言裡陳述人類自然的、不可讓失的和神聖的權利……。使得此後奠基於簡單而無可爭議的原則上的公民，要求轉向符合於憲法與人的幸福的維持。」請問：關於此文件的敘述，下列何者錯誤？
  options:
  - label: A
    content: 「不可讓失的和神聖的權利」是指自由、平等
  - label: B
    content: 這份文件是由國民會議通過的
  - label: C
    content: 文件的內容受到啟蒙運動思想的影響
  - label: D
    content: 文件即為《獨立宣言》。
- id: doc_111_嘉義_北興_社會_歷史_g9s2e1_s1_25
  section: 1
  number: 25
  type: single
