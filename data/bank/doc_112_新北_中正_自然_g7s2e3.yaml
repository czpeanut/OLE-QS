  group_stem: "題組五：\n      巴氏銀鮈是台灣特有的鯉科魚類，分布在南投烏溪流域的中下游及埤塘，喜歡躲藏在水底的碎岩塊中，翻攪底層泥沙尋找食物。因巴氏銀鮈分布在單一水系中，容易受單一威脅事件影響，近年來烏溪水域的垃圾汙染及埤塘優養化現象，都使得巴氏銀鮈數量銳減，一度僅存200\
    \ 隻。\n      在台灣紅皮書名錄中，巴氏銀鮈被列為極危物種，後來經過政府積極介入搶救，數量回升到800 隻左右。不過因為巴氏銀鮈只分布在台灣烏溪，所以未被國際自然保護聯盟(IUCN)進行評估，也沒有引起國際的關注。"
