- id: doc_112_新北_中正_自然_g7s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 根據上述資料，可以推測小紅姬緣椿象和台灣欒樹之間存在何種關係？(4-3)
  options:
  - label: A
    content: 競爭
  - label: B
    content: 寄生
  - label: C
    content: 片利共生
  - label: D
    content: 互利共生。
  group_stem: '題組一：

    春天時，校園裡的台灣欒樹總會吸引來大量的小紅姬緣椿象群聚，這些椿象會吸食欒樹種子和其他無患子科植物的汁液。研究顯示，牠們的吸食並不會危害到欒樹的生存，反而會大大提升欒樹種子的發芽率，且牠們是校園白頭翁、紅嘴黑鵯等鳥類的食物來源，可以豐富校園的生態樣貌，因此不必急著除掉牠們喔！'
  tags:
    chapter:
      publisher: 康軒
      book: 七下
      subject: 生物
      code: 4-3
      title: 生物的交互關係
      chapter: 第4章 生態系
    textbook: 七下生物 4-3 生物的交互關係
    labeled_by: ai
  ai_answers:
    gemini: D
