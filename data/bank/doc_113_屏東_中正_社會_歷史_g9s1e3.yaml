- id: doc_113_屏東_中正_社會_歷史_g9s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 十六世紀正值宗教改革的年代，波蘭某位天文學家提出「太陽為宇宙中心」的觀點，衝擊傳統的宇宙觀，在學術與宗教上引發一連串的思想變革，他也因此受到波蘭當地主流宗教信仰的壓迫。請問天文學家與當地主流宗教信仰分別為何者?
