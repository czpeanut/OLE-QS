- id: doc_111_桃園_中興_自然_g7s1e2_s2_48
  section: 2
  number: 48
  type: single
  page: 4
  stem: 依據本文，下列何項描述較為適當？
  options:
  - label: A
    content: 動脈若出現瘢塊，會發生心臟缺氧
  - label: B
    content: 高血壓患者必然會發生冠狀動脈堵塞症狀
  - label: C
    content: 心臟本身需要的氧氣主要由本身代謝所產生
  - label: D
    content: 環繞心臟表面的血管可提供心臟所需的養分。
  group_stem: '一般身體健康的人每天心跳約十萬次，心臟會廿四小時的打出 8000 公升以上的血液流經全身各處，為了維持這樣不眠不休的劇烈運動，心臟自然也需要足夠的氧氣和養分，而供應心臟所需物質的重要血管，就是環繞在心臟表面的冠狀動脈。

    冠狀動脈是從主動脈分支出來的血管，以確保心臟能獲得充足的血液，但也因為僅靠冠狀動脈提供氧氣與養分，如果發生堵塞將會導致嚴重後果；動脈堵塞的原因，是由於血管內形成一種類似脂肪沉積的瘢塊，其破裂後造成血液凝集形成血塊開始阻塞血管，由於初期尚有足夠的血流通過所以不容易被察覺，但是隨著堵塞越來越嚴重，冠狀動脈血流量減少將使得心肌開始缺氧，並出現心肌梗塞症狀，此即為冠狀動脈心臟病，簡稱冠心病（如圖
    A 至圖 D）。

    A.正常狀態

    B.脂肪逐漸累積

    C.血管開始堵塞（但無明顯症狀）

    D.血管堵塞嚴重（明顯症狀出現）

    目前已確認造成冠心病的危險因子包括遺傳、高齡、高血壓、糖尿病、高脂血症、肥胖、抽菸等。依據世界衛生組織對心臟血管疾病危險性的評估分類，高血壓是心臟血管疾病發生的最危險因子，若還併有其他因素時，也都大大提高心臟血管疾病的發生率，千萬不可不慎！'
