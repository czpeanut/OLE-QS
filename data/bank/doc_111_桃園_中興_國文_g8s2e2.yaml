    \    我現在喜歡翻閱地圖告訴友人我的部落所在（通常臺灣地圖都將我的部落點錯了）。順著雪山山脈南下，大約在它裙角的地方，大安溪及其支流觀音溪交錯的平臺就是我的部落。現在假如從客家東勢小鎮一路蜿蜒挺進部落，我總是看到許多歷史的魂魄出現在眼前。譬如說，路過中嵙山，我聽到族人與客家墾戶的交易聲，那些聲音穿透已經消失的樟樹群來到我的耳膜之中，雖然它們終究瞬即隱沒，歷史的聲音總令人感動莫名。白色雪鐵龍經過漢人稱呼的牛欄坑時，我們已經看不到漢人所稱的「牛欄」了。牛欄其實不是攔住一群臺灣牛，牛欄其實是清末的「隘勇線①」，隘勇線內就是我的父祖輩。我後來才知道我的父祖輩在漢人眼裡不過是道道地地的臺灣牛，我卻明瞭我的族人更像是沉穩或者狂野不羈的山林之風，風吹野草自然就要掩下。這使得日人在此架設通電鐵絲網，我因此在此經常不期而遇族人倉皇緊張通過鐵絲網的形貌，族人稱此地為Siong，意思是快速通過。為了追索某些蹤影，我卻不忍快速通過。\n\
    \    慢慢來到脊嶺線上的「穿龍」，你可以看到我們的部落了。我們的部落沉靜如一，部落與山巒並轡，潺潺流動的是大安溪水，整個視野看過去充滿荒野的氣質，我經常沉浸在如此荒野已極的氛圍之中，感覺歷史的風雲吹過部落的髮梢。正如族人稱的Ginngahau（穿龍）這一座名為「敲擊的缺口」，那一棵族人用以通風報信的中空的巨樹，宛如浮現在迷濛的霧氣之中，宛如浮現在我的眼眉之間，宛如……宛如歷史的風吹過我的髮梢。\n\
    \    三十歲以後，我的靈魂逐漸有了具體的血肉，它也不再遊蕩在不知所以的角落。我總是看到我的魂魄熱情地哭著或者暢快地笑著，它們不加掩飾地表現在一具七尺之軀上，如此荒野而自然的氣質是以往所沒有的。忘了告訴你，我的部落果然只有五尺，因為七尺之軀只有俯身下垂才能感受到五尺的部落之愛；七尺之軀只有更謙卑地躺下，才能感受到土地的溫潤。那麼，你心中的部落有多大呢？\n\
    \                                                                            \
    \   ――瓦歷斯‧諾幹Mihu 部落\n〔注釋〕：①隘勇線：清代政府控制臺灣原住民（生番）的方式之一，以「屯制」與「隘制」的組織建立防範措施，並設立防線（即「隘勇線」），派駐軍隊（守軍稱為「隘勇」，多以平埔族充任，以番制番），以箝制所謂「生番」越界出草。日本據臺之後，沿襲清代的「隘制」，也保留部分的隘勇線，並架設通電鐵絲網。"
