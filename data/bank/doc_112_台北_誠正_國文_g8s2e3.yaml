- id: doc_112_台北_誠正_國文_g8s2e3_s2_38
  section: 2
  number: 38
  type: single
  page: 4
  stem: 從「流塵翳明鏡，歲久看如漆」中，可以推測出作者當時的遭遇如何？
  options:
  - label: A
    content: 明珠蒙塵，不受重用
  - label: B
    content: 懸車致仕，告老還鄉
  - label: C
    content: 扶搖直上，躊躇滿志
  - label: D
    content: 病入膏肓，時日無多
  group_stem: '流塵翳明鏡，歲久看如漆。門前負局生，為我一磨拂。

    萍開綠池滿，暈盡金波溢。白日照空心，圓光走幽室。

    山神祆氣沮，野魅真形出。卻思未磨時，瓦礫來唐突。

    【注釋】：1.翳：音ㄧˋ，遮蔽。2.負局生：傳說中背負磨鏡箱的磨鏡人。

    3.金波：月光。4.祆氣沮：收斂了妖氣。祆，音ㄒㄧㄢ， 意同「妖」。沮，音ㄐㄩˇ，阻止。

    5.卻：倒、反。6.唐突：冒犯 (劉禹錫 磨鏡篇)'
