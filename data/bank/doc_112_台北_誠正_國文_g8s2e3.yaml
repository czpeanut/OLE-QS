- id: doc_112_台北_誠正_國文_g8s2e3_s2_35
  section: 2
  number: 35
  type: single
  page: 4
  stem: 根據甲乙兩文，助產婦與先生媽的區別主要為何？
  options:
  - label: A
    content: 前者30 歲以下，後者30 歲以上
  - label: B
    content: 前者無誕子經驗，後者有
  - label: C
    content: 二者皆受過助產教育，但前者為日本籍，後者為臺籍
  - label: D
    content: 前者在學校受過助產教育，後者沒有
  group_stem: '【甲】 日本治臺初期，見識到臺灣衛生嚴重落後，決心改革臺灣人的衛生觀念，提高人口素質與數量，以供驅使。在配合國家政策趨勢下，新式產婆應運而生。1902
    年，總督府制訂「產婆養成規程」，培養新式產婆，可惜是以日籍護士為主，服務的對象也多半是日本人。直到1907 年4 月，總督府頒佈「助產婦講習生規程」，在臺大醫院附設講習所，開始專為臺人設置「速成科」，採取速成、免費的方式，訓練16
    至 40 歲、品行端正、身體強健的臺灣女性。1925 年後，南北各地紛紛出現私人講習所，加上殖民政府在各地積極開辦產婆講習會，1927 至 1936 年間，形成官、私互相輝映，造就新產婆的景象。
    (摘自台灣女人網站)

    【乙】 臺地亦有產婆，家有妊婦則聘之。婆隔日來而診之，及分娩，洗兒護母，懇篤盡仁術。其謝金大抵自一圓至五、六圓，雖富豪者，不過二十餘金。唯貧家不能聘婆者，近鄰老婦有經歷者往而舉之，曰先生媽，年齒大抵三十歲以上，妙齡者殆稀。今也泰西產婆術大開，立學校，養生徒，不得卒業證書者不許之，是以妙齡產婆續續輩出，「婆」之一字殆不相適合。
    （改寫自佐倉孫三臺風雜記）'
