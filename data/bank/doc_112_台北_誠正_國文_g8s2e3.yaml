- id: doc_112_台北_誠正_國文_g8s2e3_s2_32
  section: 2
  number: 32
  type: single
  page: 3
  stem: "習慣，就是重複足夠多的次數後，變得自動化的行為。每當生活出現了新的情況，大腦便需要作出嘗試，並從失敗中學習，做出不同的嘗試，一旦成功獲得獎勵之後，當反覆遇到同一個問題，大腦就會開始把解決它的過程自動化。所以我們可以說：習慣是從經驗中學習到的心理捷徑，是過去為解決問題所採取步驟的記憶。\n\
    \ 從心理學的研究，習慣可以分成四個步驟：提示、渴求、反應與獎勵。\n一、提示：能夠觸發你的大腦，啟動某種行為舉止。我們的大腦總是不斷在分析你的內外在環境，尋找獎勵所在的線索。\n\
    二、渴求：這也是每個習慣背後的動力。沒有某種程度的動機或是欲望，我們也就沒有採取行動的理由。我們渴求的不是習慣本身，而是它帶來的狀態變化。譬如渴求的不是吸菸，而是吸菸帶給我們的解脫感；渴求的不是刷牙，而是清新的口腔所帶來的愉悅感。每一種渴求都與改變我們內在狀態的強烈願望有關。\n\
    三、回應：是我們的實際習慣行為。\n四、獎勵：回應會帶來回報，而獲得獎勵是每個習慣 的最終目標。\n 提示的作用是讓你注意到獎勵的存在，渴求是想要得到獎勵，回應則是獲得獎勵，而這整套就形成了所謂的習慣反饋迴路，一個無止境的循環。\
    \ (改寫自原子習慣)\n以圖表呈現習慣的養成，哪個內容正確無誤？"
