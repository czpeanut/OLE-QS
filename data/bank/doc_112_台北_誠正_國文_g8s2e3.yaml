- id: doc_112_台北_誠正_國文_g8s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 荷花定律：「一個荷花池，第一天荷花開放得很少，第二天開放的數量是第一天的兩倍，之後的每一天，荷花都會以前一天兩倍的數量開放。如果到第30 天，荷花就開滿了整個池塘，那麼請問：在第幾天池塘中的荷花開了一半？答案是第29天。」這個定律告訴我們，儘管一開始很努力，但一段時間後便可能因為懈怠而放棄，此時距離成功有可能只是一步之遙，若不能堅持到最後，往往功虧一簣。請問〈為學一首示子姪〉一文中，哪個段落的內容與「荷花定律」較不相關？
  options:
  - label: A
    content: 人之為學有難易乎？學之，則難者亦易矣；不學，則易者亦難矣
  - label: B
    content: 旦旦而學之，久而不怠焉，迄乎成，而亦不知其昏與庸也
  - label: C
    content: 西蜀之去南海，不知幾千里也，僧之富者不能至，而貧者至焉
  - label: D
    content: 昏與庸，可限而不可限也，不自限其昏與庸而力學不倦，自立者也
  lesson_raw:
    title: 為學一首示子姪
