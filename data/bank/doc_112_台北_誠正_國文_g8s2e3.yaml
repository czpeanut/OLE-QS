- id: doc_112_台北_誠正_國文_g8s2e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 劉禹錫在被貶謫時寫下〈陋室銘〉以自我期勉：只要努力充實學問、修養品德，雖居陋室，依然能怡然自得，聲名遠播。這樣的想法與下列何者不同？
  options:
  - label: A
    content: 不為五斗米折腰，躬耕田園的陶淵明
  - label: B
    content: 飯疏食飲水，曲肱而枕之的孔子
  - label: C
    content: 一簞食，一瓢飲，在陋巷。人不堪其憂，回也不改其樂的顏淵
  - label: D
    content: 身處朝廷黨爭的夾縫之中，抑鬱以終的李商隱
