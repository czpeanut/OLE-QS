  options:
  - label: A
    content: 「銘」是文體的一種，其作用為自我惕勵或頌揚功德
  - label: B
    content: 陋室銘是屬於頌揚功德的銘文
  - label: C
    content: 銘文大多篇幅較長，且多以散文表達，便於誦讀
  - label: D
    content: 「銘」的本義為雕刻，古人常將銘文雕刻在龜甲獸骨等較堅硬的物質上
