  stem: 有關〈陋室銘〉一文的說明，下列何者正確？
  options:
  - label: A
    content: 全文完全採對偶的形式，句句押韻，一韻到底，相當整齊
  - label: B
    content: 全文雖篇幅短小，卻敘事、寫景、抒情兼具，極富哲理，情味雋永
  - label: C
    content: 劉禹錫在文中舉「南陽諸葛廬，西蜀子雲亭」為例是在暗示「隱居」是仕宦的便捷途徑
