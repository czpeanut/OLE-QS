- id: doc_111_彰化_福興_英語_g9s1e2_s6_1
  section: 6
  number: 1
  type: single
  page: 3
  stem: What will they write about ?
  options:
  - label: A
    content: Ang Lee.
  - label: B
    content: Life of Pi.
  - label: C
    content: Chi Po-lin.
  - label: D
    content: Golden Horse Award.
  group_stem: 'Question 1 ~ 4

    Sandy, Helen, and Tom are having a meeting about their group report.

    Sandy: We need to upload our report before next Friday. The topic is "A Famous
    Taiwanese Director." Any ideas?

    Helen: Well, I was wondering if we could write about Ang Lee. I really like his
    movie *Life of Pi*.

    Tom: I know who Ang Lee is, but I''ve never seen that movie. What''s so special
    about the life of a pie? Is it about apple pie?

    Helen: It''s P-i, not P-I-E. Pi is the main character in the movie.

    Sandy: Correct. Ang Lee is famous and parts of that movie were filmed in Taichung.
    Let''s put him on the list.

    Tom: What about you, Sandy? Do you have anyone in mind?

    Sandy: Yes. I don''t know whether you guys have heard of Chi Po-lin or not, but
    his movie won a Golden Horse Award. I like him a lot.

    Helen: I saw him in an interview on a TV program last week. Chi filmed his movie
    from a helicopter (直升機). He was amazing. I''ve changed my mind.

    Tom: Sounds great. Now I know who to write about.

    Sandy: I''m glad that we''re all on the same page. Now let''s get to work. I hope
    that we can finish the report early.

    (adopted from Nan-I textbook B5 L4)'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
