  - label: C
    content: How movies limit women's roles.
  - label: D
    content: How strong women are in movies.
  group_stem: "Question 5 ~ 7\n    A great number of people go to movie theaters for\
    \ fun. Movies are made to make people laugh and cry, aren't they? However, movies\
    \ may also raise questions about gender stereotypes.\n    In many movies, women\
    \ are weak and helpless. They often need to be saved by men. Also, they are usually\
    \ shown as wives, mothers, and girlfriends. Their value (價值) is often decided\
    \ by their husbands, children, and boyfriends. What's more, men are usually seen\
    \ at work. They usually work as engineers, lawyers, and businessmen. On the other\
    \ hand, women are often seen doing housework at home or chatting with friends\
    \ at restaurants.\n    You may ask, \"Haven't we had more and more powerful women\
    \ on screen?\" To be honest, modern movie roles for women are still limited (限制).\
    \ We should break the stereotypes about women and present different kinds of powerful\
    \ women on screen. That way, when young girls see them, they will know it is possible\
    \ to do something different. For example, they may study science, start a business,\
    \ or save the planet.\n    Movies aren't only about helping people dream but also\
    \ about changing things and making people think about their futures.\n(adopted\
    \ from Kang-suan textbook B5 L4)"
