  number: 1
  type: essay
  page: 2
  stem: 快樂國的哪些國家構成要素受到侵犯？（4分，請寫出兩項國家構成要素，每一項2分。）
  group_stem: '快樂國海洋水產部表示，以往曾有「海洋生物資源取之不盡，用之不竭」的觀念，但隨著科技發達及過度捕撈，已影響漁業資源的再生性，造成海洋捕撈漁業產量呈現停滯甚至下滑。因此，加強漁業資源之管理並落實執法，受到各界的高度重視。惟因近年來屢傳鄰國漁船侵入快樂國領海基線向外延伸10浬處，並在海上與快樂國漁民發生作業紛爭，造成快樂國漁民作業困擾。近日，鄰國伏季休漁期(註:伏季是海洋主要經濟魚類繁育和幼魚生長的重要時期。伏季休漁，是一種保護漁業資源制度，規定某些作業在每年的一定時間、一定水域不得從事捕撈作業。)於8月1日12時結束，其漁船陸續恢復出海作業，快樂國海洋警察廳宣布將執行定點定時巡邏勤務，只要發現鄰國的漁船闖入快樂國的專屬海域內捕魚，將立刻扣押越界捕魚漁船；快樂國漁民如果在快樂國海區作業發現鄰國漁船，請即透過船上通訊器材通報漁業通訊電台或海洋警察廳112專線，俾利海洋警察廳前往護漁。請問:'
