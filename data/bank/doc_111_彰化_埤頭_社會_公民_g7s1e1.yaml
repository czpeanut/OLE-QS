  group_stem: "◎ 英國童書《穿裙子的男孩》在台北的一所小學圖書館陳列，遭到部分家長質疑該書鼓勵兒童變裝，不適合兒童閱讀。圖書館因此決定將其從書架撤下，並召開圖書委員會議討論。支持者主張該書適合兒童閱讀，可透過課程導讀來培養學生自信；不認同者認為教育應該教導孩子獨一無二；自信自在，而非透過外在特殊穿著來證明。最後認定本書獲選為兒童閱讀量圖書，恢復開放借閱。\n\
    \    有趣的是，本書的原產地英國，當夏天熱浪席捲全國時，往往會在媒體看到真實版的「穿裙子的男孩」，因為英國中學制服一般是男生穿長褲，女生則可以選擇穿長褲或裙子，天氣熱時有些男孩就穿起了裙子上學，這些男孩表示，女生可以有兩種選擇，男生卻只有長褲不准穿短褲，這是歧視男生的不公平校規，因此為了在夏天也能夠舒服自在學習，並且維護校園性別平等，他們就穿裙子上學表達抗議。請問："
