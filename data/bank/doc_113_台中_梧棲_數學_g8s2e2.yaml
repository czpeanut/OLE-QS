  page: 1
  stem: '有一 $\triangle ABC$ 如右圖，小芹與阿甫兩人想在 $\triangle ABC$ 外部找到一點 D，使得 $\triangle ABC$
    與 $\triangle DBC$ 全等，其作法如下，則下列敘述何者正確？

    小芹：

    ①分別以 B、C 為頂點，$\overline{BC}$ 為一邊，在 $\overline{BC}$ 下方，作 $\angle 1 = \angle ABC$、$\angle
    2 = \angle ACB$。

    ②$\angle 1$ 和 $\angle 2$ 兩角的另一邊交於 D 點，則 D 點即為所求。

    阿甫：

    分別以 B、C 為圓心，$\overline{BC}$ 為半徑畫弧，兩弧交於 D 點，則 D 點即為所求。'
