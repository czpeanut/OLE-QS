  stem: 海中也有像森林一樣的生態系統，稱為「海藻森林」。這些海藻森林主要由大型褐藻組成，大型褐藻是可行光合作用、不具角質層的生物，由其形成茂密的水下世界，為許多海洋生物提供棲息地和食物來源。海藻的結構包括固著器（類似植物的根，將海藻固定在海床上），部分海藻還具有氣囊，幫助它們在水中直立，獲取更多陽光。但因人類污染、過度捕撈與氣候變遷，海藻森林正逐漸減少。保護它們不僅能維護海洋生態，也有助於維持漁業資源和地球健康。下列何者跟海藻森林的主要組成生物屬於同一界？
