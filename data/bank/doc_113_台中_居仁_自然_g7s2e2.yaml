  stem: 王老先生有兩塊地（甲和乙，空間位置分布如右圖所示），他在甲地種了抗蟲害的基因轉殖水稻，想要減少噴灑殺蟲劑的成本；另外他在乙地種未接受基因轉殖的水稻，因為有消費者偏好無基因轉殖的農產品。但在收成時，在乙地所生產的稻米中，研究人員驚訝地發現，許多稻米種子竟然帶有抗蟲害的基因。透過上述事件的分析，請問下列說明何者正確？
