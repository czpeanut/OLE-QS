  group_stem: '(二)

    在奧克拉荷馬市，一個陽光普照的週末午後，一個自豪的父親：巴巴·路易士，正帶著他的兩個兒子打迷你高爾夫球。他走向售票櫃臺問道：「進去要花多少錢？」

    年輕的售票先生回答：「大人三元，六歲以上的小孩也要三元，剛好六歲或小於六歲的小孩免費，他們兩個幾歲？」

    巴巴答道：「那個律師四歲，另一個醫師八歲，所以我想我得付六元。」

    那位售票先生笑道：「先生，你是剛中了彩券還是發了財？你只要告訴我較大的男孩六歲，就可以替自己省下三元，我又看不出來有什麼差別。」

    巴巴回答：「你說的沒錯，但是孩子知道那是不同的。」

    愛默生曾說：「任你喊得聲嘶力竭，我卻聽不到。」在這決定性的時刻，道德感更形重要，要確認你為每一個和你一起生活及工作的人樹立了良好的榜樣。

    （派翠西亞·芙利普 知行合一）'
