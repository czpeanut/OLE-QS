  group_stem: '(五)

    史米力是一個很愛賭的人，生活裡的大公事，都可以成為他跟別人打賭的事，而且更奇妙的是，他的賭運似乎很好，幾乎每賭必贏。

    除了賭生活裡的大公事外，史米力養了些可以跟別人賭的動物，一隻看起來病懨懨的老馬，一隻沒有後腿的狗，這些動物都幫他贏了不少賭金，後來他抓到一隻青蛙，並且訓練牠可以跳得又高又遠，就在他信心滿滿地去找人賭時，碰到了一個陌生男人，他趁著史米力去幫他找青蛙時，在青蛙的肚子裡，塞滿了射小鳥的子彈……所以不知情的史米力，就白白地失去了四十元的賭金。

    靠著運氣，成天打賭過日子，就算暫時的嚐到甜頭，還是會有碰到慘遭滑鐵盧的時候呢！「跳蛙」是馬克·吐溫的成名作，一個發生在美國西部拓荒時代流傳的故事，繪者蘿莎莉歐，讓一個個畫面洋溢著輕鬆幽默，又帶點滑稽，讓人讀起來忍不住想發笑呢。

