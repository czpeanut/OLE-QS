    【乙】幽齋但有隙地，即宜種蕉。蕉能韻人而免於俗，與竹同功。蕉之易栽，十倍於竹，一二月即可成蔭。坐其下者，男女皆入畫圖，且能使臺榭軒窗盡染碧色，「綠天」之號，洵不誣也。竹可鐫詩，蕉可作字，皆文士近身之簡牘。予有題蕉絕句云：「萬花題遍示無私，費盡春來筆墨資。獨喜芭蕉容我儉，自舒晴葉待題詩。」

