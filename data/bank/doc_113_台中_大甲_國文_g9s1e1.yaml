- id: doc_113_台中_大甲_國文_g9s1e1_s1_27
  section: 1
  number: 27
  type: single
  page: 2
  stem: '請問讀甲、乙二文，回答下列問題。

    甲

    昨夜雨疏風驟，濃睡不消殘酒。試問捲簾人，卻道海棠依舊。知否？知否？應是綠肥紅瘦①。

    （李清照 如夢令）

    注：①綠肥紅瘦：綠葉繁茂，紅花凋零。

    乙

    李清照的如夢令善於化用古人詩句，更技高一籌，成為千古絕唱。此詞情境取唐人孟浩然 春曉：「春眠不覺曉，處處聞啼鳥。夜來風雨聲，花落知多少。」夜來風雨後花落的意思。更直接的關聯，則取自唐末韓偓的懶起：「昨夜三更雨，今朝一陣寒。海棠花在否？側臥捲簾看。」詩中的夜雨、海棠、捲簾，皆被李清照襲用，脫胎成「昨夜雨疏風驟，濃睡不消殘酒。試問捲簾人，卻道海棠依舊」。綜觀如夢令一詞，語言婉轉含蓄，筆調跌宕有致，看似描寫海棠花的凋零，實為李清照對大自然變化的敏感，以及對春光一瞬和好花不常在的無限惋惜。其中「綠肥紅瘦」一句抒發傷春之情，尤為後人所稱道。

    根據甲、乙二文，下列敘述何者錯誤？'
  options:
  - label: A
    content: 甲文詞作較為隱微曲折，乙文中兩首詩作較為白描直述
  - label: B
    content: 甲文作者將乙文中二詩的詩意翻陳出新，而成千古佳作
  - label: C
    content: 乙文列舉並說明甲文詞作所擷取意象的來源
  - label: D
    content: 乙文說明春曉、懶起、如夢令各篇作品的優缺點。
