  group_stem: '（一）24～28

    模擬聯合國（Model United Nations，MUN）是一種學術性質活動，藉由精簡後的聯合國議規舉行模擬會議，使與會者瞭解多邊外交的過程，培養分析公民議題的能力，每位學生將在會議中擔任一個國家的代表，在會議過程中，增進演講和辯論能力，同時認識不同文化，拓展國際視野，瞭解各國在歷史上或現實中的立場與處境。

    謙杜即將作為俄羅斯代表參加四育國中第一屆的「模擬聯合國」活動，於是他找了一些關於俄羅斯的資料，請幫助他整理這些資料。

    下方（圖四）是沿著55°N 緯線畫出來的俄羅斯地形剖面圖。（圖五）俄羅斯國土範圍的簡圖。（圖六）是俄羅斯的年降水量分布圖。'
