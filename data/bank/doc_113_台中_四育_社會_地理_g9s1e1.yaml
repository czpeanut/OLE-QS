  stem: （  ）芬蘭代表和也：「一個地方的盛行風向會影響當地的降水量的分布，俄羅斯的降水分布卻呈現了東西部較多中部較少的特殊狀況，請問為什麼出現這個現象？」出現這樣的提問，請問謙杜如何回答最恰當？
  options:
  - label: A
    content: 謙杜：「因為俄羅斯中部地區緯度較低，水氣不易進入。」
  - label: B
    content: 謙杜：「因為俄羅斯東部與西部的雨季不同，東部地區主要是冬季降雨。」
  - label: C
    content: 謙杜：「因為俄羅斯東部是季風氣候區，夏季盛行風向不同於西部吹西風，而是東南風。」
  - label: D
    content: 謙杜：「因為俄羅斯全境盛行風皆為西風，當西風經過湖、海等水體，就會造成降水。」
