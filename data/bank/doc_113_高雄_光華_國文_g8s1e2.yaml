  group_stem: "（六）\n    漢世有人，年老無子。家富，性儉嗇，惡衣疏食，侵（1）晨而起，侵夜而息，營理產業，聚斂無厭，而不敢自用。或人從之求丐者，不得已而入內取錢十，自堂而出，隨步輒減。比（2）至於外，才餘半在，閉目以授乞者，尋復囑云：「我傾家贍（3）君，慎勿他說，復相效而來。」老人俄死，田宅沒官，貨財充於內帑（4）矣。\n\
