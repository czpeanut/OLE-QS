    content: 「終於雷聲愈來愈遠，電光只在遙遙的天邊橫掃。太陽又出來了，一片清新的空氣、鮮潔的色彩，彷彿聽見了貝多芬田園交響曲第四樂章牧羊人之歌」藉由貝多芬悠揚的樂曲，描寫雨過天青後田園呈現的明淨舒爽，是用視覺印象來表達聽覺效果
