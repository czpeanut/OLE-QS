- id: doc_113_高雄_光華_國文_g8s1e2_s2_5
  section: 2
  number: 5
  type: single
  page: 5
  stem: 根據上文內容，哪一個是正確的選項？
  options:
  - label: A
    content: 大部分的酸性食物對人體有害無益，最好完全不要食用
  - label: B
    content: 小成三餐常吃滷肉飯、爌肉飯，很少吃蔬菜水果，罹患骨質疏鬆症的機會較大
  - label: C
    content: 藍莓、柑橘、葡萄等水果味道偏酸，應該屬於酸性食物，而香蕉、甜桃、荔枝口感較甜，應該是鹼性食物
  - label: D
    content: 栗子經代謝分解後含有較多的鈉，屬於鹼性食物，所以我們可以盡量多吃糖炒栗子。
  group_stem: "（四）\n    許多人以口感來判定食物的酸鹼性，例如：檸檬吃起來酸溜溜的，自然屬酸性食物；米飯、麵類味道較清淡，大概是中性或鹼性食物。其實，真正影響酸鹼性的是食物中陽離子與陰離子的含量和比例：如果食物經消化後，產生的磷、硫、氯離子等陰離子較多，在體內形成酸，就是酸性食物；如果食物代謝後產生的鉀、鈉、鎂、鈣離子等陽離子較多，在體內產生較多的鹼，就是鹼性食物。酸鹼平衡的話，就是中性食物。\n\
    \    一般來說，鹼性食物包括蔬菜、水果及豆類等植物性食物，酸性食物則包括肉類等動物性食物及精製的穀麥；咖啡和茶則是中性食物。\n    攝入酸性食物過多，容易導致血液中酸鹼不平衡，使身體從骨骼中取出鈣質以調節血液的酸鹼值，造成骨本流失，因而較容易罹患骨質疏鬆症。\n\
    \    大部分鹼性食物是含高纖維、豐富維生素和礦物質的高營養植物性食物，酸性食物則含較高脂肪及低纖維，倘若養成以酸性食物為主的飲食習慣，長遠來說，罹患多種慢性病的危險就會增加，包括糖尿病、冠心病、癌症等。不過，這些疾病未必完全與食物的酸鹼性有關，兩者的關係尚待探討。當然，飲食與健康的關係並不止於食物的酸鹼性，卡路里、脂肪、維生素、礦物質等都有影響。所以，不要單憑酸鹼性來判斷食物健康與否，而應均衡地攝取各類食物。\n\
    （節錄自健康醫學專欄）"
  answer:
  - 氣脫委頓
