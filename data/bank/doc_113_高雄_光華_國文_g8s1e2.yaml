- id: doc_113_高雄_光華_國文_g8s1e2_s2_1
  section: 2
  number: 1
  type: single
  page: 4
  stem: 根據本文，下列敘述何者正確？
  options:
  - label: A
    content: 「宿雨」、「朝雨」是以時間的早晚來區分雨；而「杏花雨」、「梅雨」則是以雨勢大小來區分雨
  - label: B
    content: 古人描寫雨的千古佳句都是在失意惆悵時完成的，如：「雨中黃葉樹」、「草色新雨中」
  - label: C
    content: 古人形容雨的詞句多，是因雨水是古人耕種、飲用的主要來源，對人民來說很重要
  - label: D
    content: 雨色和陽光的差異之一，就在雨能發出聲音，如：「夜闌臥聽風吹雨」、「梧桐更兼細雨」，而陽光沒有聲音。
  group_stem: "（一）\n    雨有時誠然惱人，但也有它優美的地方，不論是春雨綿綿、秋雨涓涓，或是大雨滂沱，只要你靜靜地欣賞，都有它不同的況味。\n\
    \    雨有時像珠簾，有時似輕紗，點點滴滴，常能與我們的心境產生共鳴，所以古人形容雨的詞句也特別多，因時間的不同有所謂「寒食雨」、「杏花雨」、「梅雨」、「清明時節雨」；因地點的差異有「灞陵雨」、「楚江微雨」、「巴山夜雨」、「二陵風雨」、「仙人掌上雨」；因大小早晚的不同有「密雨」、「疏雨」、「宿雨」、「朝雨」；因心境的不同有「雨打歸舟淚萬行」、「天陰雨濕聲啾啾」；同時因為雨能挹輕塵，使景物變得愈明晰，所以更有「雨中黃葉樹」、「草色新雨中」、「門前風景雨來佳」、「紅樓隔雨相望冷」的詩句。\n\
    \    如果比較雨色與陽光顯然的差異當然還是在於陽光無言，雨卻能呢喃；陽光只能在白天得到，雨卻能日夜諦聽。那瀟瀟的雨聲，清脆的音響，彷彿織成一首交響詩，給予人無限的遐思。譬如李後主的「簾外雨潺潺」，陸游的「夜闌臥聽風吹雨」，都是形容雨的佳句。至於李清照的「梧桐更兼細雨，到黃昏、點點滴滴」和「傷心枕上三更雨」，因為不但形容了雨，也模擬了雨打梧桐、芭蕉的聲響，所以更成為千古的絕唱。\n\
    （劉墉 雨）"
  answer:
  - 氣勢萬鈞
