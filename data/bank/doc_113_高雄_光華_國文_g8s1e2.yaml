  group_stem: "（二）\n    時序進入七、八月，這近山一帶幾乎每日午後都有一場驟雨。閩南人驟雨叫西北雨，雨卻未必自西北來，這是很奇怪的名稱，一向困惑了不少方言專家。其實西北雨這一語詞是夕暴雨的訛音。西北雨，驟起驟歇。這種驟雨來得驟去得也瀟灑，從不藕斷絲連，拖泥帶水。\n\
