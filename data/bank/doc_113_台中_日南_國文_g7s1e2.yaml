  group_stem: '什麼是正向思考？1.正向思考是讓我們在面對挑戰或挫折時，不過分陷於焦慮、沮喪的情緒，繼而以「面對現實」的勇氣、「解決問題」的企圖心，找出方法，迎接挑戰。2.正向思考要避免不切實際、盲目樂觀的心態。3.哈佛商業評論曾在《如何激發復原力？》一文指出：正面思考能力強的人，有三項特質：

    (1)能坦然面對現實。(2)擁有深信生命有其意義的價值觀。(3)培養及時解決問題的驚人能力。(網路文章)'
