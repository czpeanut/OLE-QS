- id: doc_113_台中_日南_國文_g7s1e2_s2_34
  section: 2
  number: 34
  type: single
  page: 3
  stem: 為什麼詹媽媽會說：「網球是很個人的運動？」而覺得打網球是將女兒推向孤獨的心靈旅程？
  options:
  - label: A
    content: 因為 網球選手需要自己不斷的練習
  - label: B
    content: 因為打網球會脫離學校課程
  - label: C
    content: 因為網球比賽中成敗都要由一個人自己承擔
  - label: D
    content: 因為網球訓練過程需要很高的自制力和密集的訓練。
  group_stem: '詹詠然十四歲的天生好手 想像一個十四歲國中女生的世界。不和同學討論韓劇、沒有週末逛街看電影，國二起，詹詠然過起密集訓練的日子。「電影以後還可以看，打球只有在年輕的黃金時段。」怎麼想都是屬於二十歲以後的理性自制力，眼前的她卻只有國中三年級。二○○四年二月，與十七歲的大陸網球選手孫勝男搭檔，奪得澳洲網球公開賽青少年組雙打冠軍，詹詠然帶回台灣睽違十五年的大滿貫金杯，成為兩岸華人矚目的網壇新星。對詹媽媽而言，讓女兒打網球也正推她走向孤獨的心靈旅程：「網球是很個人的運動，成敗都一個人承擔，贏得愈多愈孤獨。」從國小三年級起，詹詠然每贏得一個冠軍，母親就送她一本勵志的書，鍛鍊她面對挫折的心性。是母親微妙安排，也是詹詠然天生悟性，造就她與以往球員最大的不同----以大量閱讀鍛鍊心性，同時持續追求知識。在馬尼拉青少年網球公開賽冠軍戰中，拖著已密集作戰三週微疼的腳和疲憊身體，詹詠然第一盤意外輸給公認實力較弱的對手。當時空白一片的腦中，忽然浮起曾讀過的一句話：「信念造就一生，堅毅成就美夢。」她告訴自己：「好不容易打了三個禮拜才到這裡，放棄實在太可惜。」接著讓所有球評一致肯定的專注、求勝意志，又回到她心上，以直落二氣勢勇奪金杯。「我不想像傳統運動員一樣，放棄繼續發揮智慧。」無法配合學校進度而暫時放棄學業的她，訓練之餘填滿閱讀計畫，她深信唯有體能與智慧相配合，才能不斷挑戰潛能，攀登更高的境界。

    (改寫自天下雜誌 300期 原作:陳慧婷)'
