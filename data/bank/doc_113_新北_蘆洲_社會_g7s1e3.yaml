  stem: 承上題，姓名權是影響自我身分認同中的因素之一，「以我的族名呼喚我行動小組」運用網路資源宣傳理念，也透過實際行動，如：在內政部前召開記者會，向社會大眾倡議對於族名議題的關注，爭取原住民族族名權。請問上述做法是用何種方式爭取權益？
  options:
  - label: A
    content: 部落營造
  - label: B
    content: 原住民族運動
  - label: C
    content: 原住民族部落活力計畫
  - label: D
    content: 召開部落會議。
  group_stem: '（第 43 題）泰雅族原住民寶杜巴燕（Bawtu Payen）赴戶政所申請以羅馬拼音（原住民族語）變更身分證姓名遭拒，戶政事務所認為，原住民的傳統名字登記形式，包括「以漢人姓名並列原住民傳統姓名的羅馬拼音」、「原住民傳統姓名並列原住民傳統姓名羅馬拼音」、或「單獨使用原住民傳統姓名」，但沒有單獨使用傳統姓名的羅馬拼音（原住民族語）登記為姓名的作法，寶杜認為此種作法，無助於促進身分認同，反而使原住民落入主流社會的諧音字文化，選擇具有正面意義的中文字來代表自己，例如選擇代表珍貴的「寶」字為名，但
    Bawtu 之意是「像先人一樣踏實勤勞」，中文字與族語原意毫無關連；他還質疑，為何民眾可以改名為鮭魚，卻不能改為原住民母語。

