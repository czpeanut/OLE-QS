  section: 1
  number: 43
  type: single
  page: 3
  stem: '泰雅族原住民寶杜巴燕（Bawtu Payen）赴戶政所申請以羅馬拼音（原住民族語）變更身分證姓名遭拒，戶政事務所認為，原住民的傳統名字登記形式，包括「以漢人姓名並列原住民傳統姓名的羅馬拼音」、「原住民傳統姓名並列原住民傳統姓名羅馬拼音」、或「單獨使用原住民傳統姓名」，但沒有單獨使用傳統姓名的羅馬拼音（原住民族語）登記為姓名的作法，寶杜認為此種作法，無助於促進身分認同，反而使原住民落入主流社會的諧音字文化，選擇具有正面意義的中文字來代表自己，例如選擇代表珍貴的「寶」字為名，但
    Bawtu 之意是「像先人一樣踏實勤勞」，中文字與族語原意毫無關連；他還質疑，為何民眾可以改名為鮭魚，卻不能改為原住民母語。

    資料來源：自由時報記者張文川112.11.07

    明超在網路看到以上報導，根據新聞內容判斷，以上內容較接近原住民在現代社會中遇到的什麼挑戰？'
  options:
  - label: A
    content: 傳統領域的保護
  - label: B
    content: 部落經濟的停滯
  - label: C
    content: 傳統文化的斷層
