  stem: 根據上文第一段內容，同學們熱烈的討論如下。阿凱說：台灣生產咖啡的機會成本較低；小芳說：咖啡開放進口，可以讓消費者喝到品質高價格便宜的咖啡；雯雯說：咖啡開放進口，不利於台灣咖啡農；小娟說：台灣咖啡應該要以降價方式和和外國進口咖啡競爭。請問4
    位同學的敘述，正確的有幾位？
  options:
  - label: A
    content: 4 位
  - label: B
    content: 3 位
  - label: C
    content: 2 位
  - label: D
    content: 1 位
  group_stem: '在全球風靡咖啡的同時，台灣人對於咖啡的飲用習慣也隨之改變，咖啡市場迅速發展。根據 2022 年問卷調查結果顯示台灣每人平均一年飲用咖啡杯數達到
    177 杯。台灣的咖啡主要依賴進口，中美洲咖啡品質高且價格低，相對於台灣，在地狹人稠的地理環境下，種植的人力成本較高，並且不容易擁有穩定的供應量以提供外銷出口。因此，走向高品質的精品咖啡，應是台灣咖啡未來發展的重要契機。

    龐大的咖啡利潤分配並不平均，也就是說如果一罐即溶咖啡利潤 100 元，跨國企業拿 55 元，超商拿 25 元，出口商拿 10 元，而最辛苦的咖啡農只拿 10
    元。因此，身為消費者，我們可以選購有公平貿易認證的咖啡，讓合理的利潤回饋給咖啡農們，協助他們擺脫貧窮，也促使農民們可以回饋購買者更多品質優良的咖啡，用消費改變世界，讓公平正義在生活中實現。'
