  group_stem: '好市多公司 1983 年成立於美國西雅圖市，商品販賣之形態以倉儲式的銷售為特色，營利方式都在於以低價格提供高品質的商品，與同業相比動輒數萬種品類。針對此類項目大量進貨來壓低成本，同時也都向會員收取小額的年費，這也是主要的利潤來源，高服務和價格上的回饋，創造成功的經營模式。

    好市多已逐漸擴展其產品種類和服務。過去只偏向販售盒裝或箱裝的產品，只需拆開包裝就能上架，而最近開始販賣其他多元化的產品，如蔬果、肉類、乳製品等，許多分店還設置輪胎維修服務、藥局、和加油站。自有品牌的產品更是以廉價取勝。'
