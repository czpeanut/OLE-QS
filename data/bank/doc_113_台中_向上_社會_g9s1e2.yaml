- id: doc_113_台中_向上_社會_g9s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '美國的農夫有一個特別的名字，稱為「手提箱農夫」。不同於台灣的小規模經營，經營者都住在都市裡，一到了播種或收割的時期，他們就拎著手提箱趕到農場，預估這一年的收穫量，然後和勞工訂契約。請問這樣的農業經營型態符合下列何項特徵？

    (甲)集約耕作

    (乙)商品化導向

    (丙)每人平均耕地大

    (丁)機械化的程度高

    (戊)單位面積產量大'
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲乙戊
  - label: C
    content: 乙丙丁
  - label: D
    content: 乙丙戊
  tags:
