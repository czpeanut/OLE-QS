- id: doc_113_台中_向上_社會_g9s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 文中提到的阿塔卡馬所形成的獨特氣候類型，其生成原因應是下列何者所造成？
  options:
  - label: A
    content: 位山脈背風
  - label: B
    content: 距海遙遠
  - label: C
    content: 盆地地形
  - label: D
    content: 副熱帶高壓
  group_stem: '樂樂旅行社推出拉丁美洲之旅，這片土地上古老的文明、白雪覆頂的山脈、令人醉心的鹽湖、和繁茂的雨林都是特有的大自然瑰寶，而殖民時期的歷史和原住民的特色文化，更是精彩萬分。

    位於智利北部的阿塔卡馬，此處平均每隔 5~20 年才下雨，乾枯的湖泊讓部分地形表面布滿一層白色的結晶鹽。接著登上南美洲最大的淡水湖－的的喀喀湖，最出名的就是漂浮在湖上，用蘆葦草鋪成的人工島嶼，到目前島上還有人居住，形成很特殊的景觀。

    行程最後一定要拜訪最大帝國「印加帝國」的核心地區－馬丘比丘，還要記得購買當地最出名的毛料製品。'
