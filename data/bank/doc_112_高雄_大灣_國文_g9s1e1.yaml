- id: doc_112_高雄_大灣_國文_g9s1e1_s2_39
  section: 2
  number: 39
  type: single
  page: 6
  stem: 少婦以「小舟從此逝，江海寄餘生。」向縣官表明何種心意？
  options:
  - label: A
    content: 出海捕魚，將功贖罪
  - label: B
    content: 流放海外，洗心革面
  - label: C
    content: 江海擺渡，另謀出路
  - label: D
    content: 投江自盡，與世長辭
  group_stem: '昔有某婦，丈夫死後，難以維生，鋌而走險行竊，因失風而被押送至衙門，於縣堂應訊時，以詩詞回答，故傳為一代奇供。

    縣官問：大膽刁婦，家居何處？

    少婦答：妾住在橫塘。(崔顥長干行)

    縣官問：汝丈夫何處？

    少婦答：可憐無定河邊骨，猶是春閨夢裡人。(陳陶隴西行)

    縣官問：可有子女？

    少婦答：綠樹成蔭子滿枝。(杜牧悵詩)

    縣官問：丈夫死後，汝家中光景如何？

    少婦答：冷冷清清，悽悽慘慘戚戚。(李清照聲聲慢)

    縣官問：然汝賴何維生？

    少婦答：鋤禾日當午，汗滴禾下土。(李紳憫農詩)

    縣官問：無人幫汝？

    少婦答：衷腸事，託何人？(晏殊山亭柳)各人自掃門前雪，不管他人瓦上霜。(事林廣記)

    縣官問：因何落魄失德？

    少婦答：八月秋高風怒號，卷我屋上三重茅。 (杜甫茅屋為秋風所破歌)

    縣官問：初次行竊犯案為何時、何處？

    少婦答：記得去年今日，(晏殊清平樂)風老鶯雛，雨肥梅子(周邦彥滿庭芳)，燈火闌珊處。(辛棄疾元夕)

    縣官問：失風被捕，有何感想？可心存悔意？

    少婦答：這次第，怎一個愁字了得。(李清照聲聲慢)

    一失足成千古恨，再回首已百年身。(唐寅廢棄詩)

    縣官問：希望本官如何發落？

    少婦答：小舟從此逝，江海寄餘生(蘇軾臨江仙)'
