- id: doc_112_高雄_大灣_國文_g9s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 「明月別枝驚鵲，清風半夜鳴蟬。稻花香裡說豐年，聽取蛙聲一片。 七八個星天外，兩三點雨山前。舊時茆店社林邊，路轉溪橋忽見。」(辛棄疾西江月˙夜行黃沙道中）關於本詞，下列敘述何者正確？
  options:
  - label: A
    content: 詞中的季節是秋季，作者在詞中流露了愛國的情操
  - label: B
    content: 此詞主要描寫農村的繁忙，及鄉村熱鬧的生活景象
  - label: C
    content: 詞中描寫「鵲噪」、「蟬鳴」、「蛙叫」的作用是強調夏夜的涼爽
  - label: D
    content: 「舊時茆店社林邊，路轉溪橋忽見」，此句表達出作者的驚喜之情
