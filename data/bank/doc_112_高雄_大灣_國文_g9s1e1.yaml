    content: 水皆縹碧，千丈見底。游魚細石，直視無礙。——狀寫水的清澈及水勢湍急
  - label: B
    content: 夾岸高山，皆生寒樹。負勢競上，互相軒邈。——以山之奇特烘托樹之奇特
  - label: C
    content: 蟬則千轉不窮，猿則百叫無絕。——以蟬、猿的生命力暗指自身雄心壯志
  - label: D
    content: 鳶飛戾天者，望峰息心。——抒發滌盡俗慮、淡泊名利的情懷
