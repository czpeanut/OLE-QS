  section: 1
  number: 34
  type: single
  page: 5
  stem: "崇禎五年十二月，余住西湖。大雪三日，湖中人鳥聲俱絕。\n    是日，更定矣，余拏一小舟，擁毳衣、爐火，獨往湖心亭看雪。霧凇沆碭，天與雲、與山、與水，上一白。湖上影子，惟長堤一痕，湖心亭一點，與余舟一芥、舟中人兩三粒而已。\n\
    \    到亭上，有兩人鋪氈對坐，一童子燒酒，爐正沸。見余大喜，曰：「湖中焉得更有此人！」拉余同飲，余強飲三大白而別。問其姓氏，是金陵人客此。及下船，舟子喃喃曰：「莫說相公痴，更有痴似相公者。」\n\
    \                                                                          (張岱湖心亭看雪）\n\
    \n下列關於本文寫作手法的敘述，何者有誤？"
  options:
  - label: A
    content: 作者藉由敘事、對話，烘托出在雪中與昔日好友金陵人他鄉遇故知的驚喜之情
  - label: B
    content: 首句點明遊賞時間、地點和情境，透過聽覺「俱絕」寫西湖在隆冬大雪時的寂寥
  - label: C
    content: 最後藉舟子之口道出從一般人難以理解體會，作者與金陵客寒冬賞寫的癡迷雅興
  - label: D
    content: 運用量詞「痕、點、芥、粒」呈現長堤、湖心亭、舟、人影，安排由大而小，由遠而近
