  stem: 王國維人間詞話：「客觀之詩人，不可不多閱世。閱世愈深，則材料愈豐富，愈變化，水滸傳、紅樓夢之作者是也。主觀之詩人，不必多閱世。閱世愈淺，則性情愈真，李後主是也。」下列敘述，何者最接近這段文字的意旨？
  options:
  - label: A
    content: 只從材料的多元及作家的真誠來評論作品，容易忽略作品價值
  - label: B
    content: 詩人有客觀與主觀之別，其中的差異在於取材時真實成分的多寡
  - label: C
    content: 豐富的人生經歷對不同類型的作家來說，可能是助益也可能是阻礙
  - label: D
    content: 詩人創作需考量本身的性格，不符合作者才性的著作難以成為名作
