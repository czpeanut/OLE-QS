- id: doc_112_高雄_大灣_國文_g9s1e1_s2_35
  section: 2
  number: 35
  type: single
  page: 5
  stem: 根據本文對「清歡」一詞的說明，下列何者不正確？
  options:
  - label: A
    content: 是體會生命後的真味
  - label: B
    content: 是及時行樂的生活態度
  - label: C
    content: 是超越物質享受的精神境界
  - label: D
    content: 是人世間最樸實、最平凡的滋味
  group_stem: "細雨斜風作小寒，淡煙疏柳媚晴灘。入淮清洛漸漫漫。\n               雪沫乳花浮午盞，蓼茸蒿筍試春盤。人間有味是清歡。 蘇軾\
    \ 浣溪沙\n「人間有味是清歡」，飽含著多麼耐人尋味的人生哲理，過於奢華濃烈的歡樂不長久，就像馥郁的花香易散，而清幽淡雅的香氣反而久久難以消散一樣，清淡的歡愉與平淡的樂趣更能讓人久久回味。蘇軾一生多次遭貶，甚至被捕入獄，但是他依然能從坎坷的生活中體會到明月美酒帶來的歡樂，體會到清茶野菜給人的清歡。\n\
    清歡是人類心靈的純淨一隅，是超越物質享受的精神境界，是在世俗喧囂中撣去塵世的污垢，體會生命的真味。清歡不是「身無彩鳳雙飛翼，心有靈犀一點通」（李商隱無題）的兩情暗許；不是「衣帶漸寬終不悔，為伊消得人憔悴」（柳永蝶戀花）的刻骨思念；不是「對花何吝醉顏酡」（歐陽修定風波）的及時行樂；也不是「羽扇綸巾，談笑間，強虜灰飛煙滅」（蘇軾念奴嬌‧赤壁懷古）的雄姿英慨，意氣風發。清歡是人世間最樸實、最平凡的滋味，是「春水碧於天，畫船聽雨眠」（韋莊菩薩蠻），從對故鄉的思念之痛中品嘗著人生的閒情逸致、悠閒恬淡；是「小樓一夜聽春雨，深巷明朝賣杏花」（陸游臨安春雨初霽），英雄困頓京華仍能品味到人生的美好，是「採菊東籬下，悠然見南山」（陶潛飲酒）。\n\
    \     清歡是在紛繁世事的困擾中，追求心靈、精神的自在飛翔。無論是順境、逆境都能「寵辱不驚，去留無意」，保持心境的平靜安詳；即使是在都市的最中心、人聲最嘈雜的地方，也能發現那份淡淡的歡樂。尋求清歡不用遁入桃花源，清歡是在忙碌的生活中偷得的，所謂「偷得浮生半日閒」，從主管、從公務、從瑣事、從應酬，最主要是從自己那裡去「偷」，把自己從對前程的追逐，對事業的追逐，對成功的追逐中「偷」出來，放鬆緊張的神經，品味久違的清歡，這便是人生的好時光。\n\
    \                                                                 (節錄自曲向紅宋詞的力量)"
  tags:
    textbook: 九上 第三課 人間好時節
    labeled_by: ai
    chapter:
      publisher: 康軒
      book: 九上
      subject: 國文
      code: 第三課
      title: 人間好時節
      chapter: null
