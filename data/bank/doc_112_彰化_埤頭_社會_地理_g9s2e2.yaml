  group_stem: '臺灣特有種蝴蝶—臺灣青斑蝶分布於全島平地到中海拔山地，六月份陽明山國家公園的大屯山、面天山、竹子山及七星山上，大量聚集的青斑蝶吸食盛開的島田氏澤蘭、濱當歸及南國薊等蜜源植物，蔚為世界級的生態景觀。

    日本專家利用標識再捕法（mark-release-recapture method）發現青斑蝶有南北移動現象，澎湖民眾曾發現住家附近有隻從日本富山縣標放的青斑蝶，身上被標示了日期和日本地名，富山縣自然博物館負責人說:「這隻青斑蝶創下了富山縣蝴蝶的最長距離飛行紀錄，飛到翅膀已破裂，令人感到心碎。」見右圖示意圖。'
