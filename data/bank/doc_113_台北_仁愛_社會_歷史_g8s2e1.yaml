  group_stem: 【題組三】以下為習近平於2016 年所舉辦的，紀念孫中山誕辰150 周年大會上所發表的談話：「孫中山先生是偉大的民族英雄、偉大的愛國主義者、中國民主革命的偉大先驅，一生以革命為己任，立志救國救民，為中華民族作出了彪炳史冊的貢獻。時代造就偉大人物，偉大人物又影響時代。150
