  stem: 20世紀初有一篇文章提到：「以前的人對於兒童有許多不當理解，不是將他當作縮小的成人，拿「聖經賢傳」盡量的灌下去，就是將他看作不完全的小人，說小孩懂得什麼，一筆抹殺，不去理他。近來才知道兒童在生理上，雖然和大人有點不同，但他仍是完全的個人，有他自己的內外兩面的生活。」有關於此文章的觀點，以下說法何者正確？
