- id: doc_113_台北_仁愛_社會_歷史_g8s2e1_s2_28
  section: 2
  number: 28
  type: single
  page: 3
  stem: 關於以上兩則資料，皆為當時的知識份子，針對文學的一些看法。根據以上內容，下列推論較為合適？
  options:
  - label: A
    content: 資料一認為文學若未具備文中所提的八個原則，則毫無文學價值
  - label: B
    content: 資料二強調透過創作文學的方式，來散播革命思想
  - label: C
    content: 兩則資料皆提倡改革文學形式，並指出具體方向
  - label: D
    content: 兩則資料所提及的理念並未獲得支持，傳統文學依然受到重視
  group_stem: "【題組一】以下為兩則資料：\n【資料一】 今之談文學改良者眾矣，記者末學不文，何足以言此。然年來頗於此事再四研思，輔以友朋辯論，其結果所得，頗不無討論之價值。因綜括所懷見解，列為八事，分別言之，以與當世之留意文學改良者一研究之。\n\
    \  吾以為今日而言文學改良，須從八事入手。八事者何？一曰，須言之有物。二曰，不摹倣古人。三曰，須講求文法。四曰，不作無病之呻吟。五曰，務去濫調套語。六曰，不用典。七曰，不講對仗。八曰，不避俗字俗語。\n\
    【資料二】 余甘冒全國學究之敵，高張「文學革命軍」大旗，以為吾友之聲援。旗上大書特書吾革命軍三大主義：曰「推倒雕琢的、阿諛的貴族文學，建設平易的、抒情的國民文學」﹔曰「推倒陳腐的、鋪張的古典文學，建設新鮮的、立誠的寫實文學」﹔曰「推倒迂晦的、艱澀的山林文學，建設明了的、通俗的社會文學」。"
