  section: 1
  number: 14
  type: single
  page: 2
  stem: 儒家提到的「三綱」指的是「君為臣綱、夫為妻綱、父為子綱」，其意思是君為臣的表率，而人民為君主的附屬品，故無獨立自主的人格；父親為兒子的表率，則兒子是父親的附屬品，故無獨立自主的人格；丈夫為妻子的表率，則妻子為丈夫的附屬品，故無獨立自主的人格。中國人之所以缺乏獨立的人格，都是導因於「三綱」的說法。傳統上提到的盡忠、盡孝、守節，皆非讓人擁有獨立人格的道德規範。由文章的內容來看，討論的議題為何？
  options:
  - label: A
    content: 鼓勵國人培養獨立自主人格，應遵從三綱之原則
  - label: B
    content: 維護儒家傳統文化，反駁「打倒孔家店」之口號
  - label: C
    content: 提倡女權的提升，凸顯男女之間身份地位的差異
  - label: D
    content: 批評國人受到傳統思想綑綁，無具備自主之能力
