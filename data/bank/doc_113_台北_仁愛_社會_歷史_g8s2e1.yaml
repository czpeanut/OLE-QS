  type: single
  page: 2
  stem: 民國14 年，孫中山臨終前，曾留下遺囑：「余致力國民革命，凡四十年，其目的在求中國之自由平等。積四十年之經驗，深知欲達到此目的，必須喚起民眾及聯合世界上以平等待我之民族，共同奮鬥。現在革命尚未成功，凡我同志，務須依照余所著《建國方略》、《建國大綱》、《三民主義》及《第一次全國代表大會宣言》，繼續努力，以求貫徹。最近主張開國民會議及廢除不平等條約，尤須於最短期間，促其實現。是所至囑！」請問，遺囑中提及的「革命尚未成功」，指出當前中國正面臨何種情況，勉勵大家仍需要繼續努力奮鬥，以期實現理想？
  options:
  - label: A
    content: 清帝仍未退位，君主專制仍存在於中國
  - label: B
    content: 共和國理想仍未實現，遭到洪憲帝制破壞
  - label: C
    content: 國民政府遭到共產勢力分裂，形成南北分裂
  - label: D
    content: 軍閥割據分裂國家，人民仍處水深火熱
- id: doc_113_台北_仁愛_社會_歷史_g8s2e1_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 新思潮的引入也衝擊到中國傳統社會的女性地位。請問：在新思潮的激盪下，新一代的中國女性地位發生何種改變？
  options:
  - label: A
    content: 傳統婚姻觀念依然存在，但自由戀愛已逐漸風行
  - label: B
    content: 梁啟超提倡女子教育，在當時只有女子有受教權
  - label: C
    content: 「三從四德」成為了當時女性的行為與道德標準
  - label: D
    content: 軍閥混戰導致社會混亂，女子地位依然沒有提升
