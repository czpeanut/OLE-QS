  - label: A
    content: 教育小孩時，應多利用聖經賢傳來啟發孩子
  - label: B
    content: 小孩如同縮小的成人，不需要特別研發新的教材
  - label: C
    content: 兒童若天資不足，不懂儒家經典，則毋須再教育
  - label: D
    content: 應重視兒童並改變看法，將其視為獨立的個體
- id: doc_113_台北_仁愛_社會_歷史_g8s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 以下為一位學者發表文章之節錄，請閱讀文章並回答下列問題：「⋯⋯中國數千年以來，習於君主專制體制，各地學校短缺，大多數之人民智識不甚高尚，人民更缺乏參與政治之能力，四年以前，由專制一變而為共和，此番變動太快，難望有良好結果⋯⋯中國將來必因總統繼承問題「釀成禍亂」⋯⋯如一時不立即撲滅禍亂，可能導致敗壞中國之獨立⋯⋯中國如用君主制，較共和制為宜，此殆無可疑者也」此篇文章評論當時中國的國家體制，最可能被何人認同，並援引此論述來強化其政治立場？
  options:
  - label: A
    content: 袁世凱
  - label: B
    content: 孫中山
  - label: C
    content: 段祺瑞
  - label: D
    content: 蔣中正
