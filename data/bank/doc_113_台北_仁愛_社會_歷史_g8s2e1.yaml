  stem: '寧寧在複習「中華民國建立的歷史」時，拿出上課時抄的筆記，發現只有抄到一些歷史重大事件，但卻沒有註記時間。請依時間先後順序，幫寧寧排列出以下歷史重大事件：

    （甲）袁世凱擔任正式大總統 （乙）簽訂《二十一條》

    （丙）二次革命（丁）張勳復辟 （戊）中國參加一戰'
