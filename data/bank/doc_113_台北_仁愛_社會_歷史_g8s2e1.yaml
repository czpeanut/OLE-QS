    | --- | --- | --- | --- | --- | --- |

    | 參議院 | 123 | 69 | 38 | 44 | 274 |

    | 眾議院 | 269 | 154 | 147 | 26 | 596 |

    | 合計 | 392 | 223 | 185 | 70 | 870 |'
