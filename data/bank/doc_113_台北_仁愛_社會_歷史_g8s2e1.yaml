  page: 1
  stem: 在中國近代史的發展中，中國國民黨與中國共產黨歷經多年的分分合合，兩黨的互動關係一直是歷史研究的重要議題。請問有關於中國共產黨的描述，以下何者有誤？
  options:
  - label: A
    content: 中共早期的發展，與國民黨的政策方向有關
  - label: B
    content: 於上海召開首次黨代表大會，中共正式成立
  - label: C
    content: 曾遭遇孫中山的清黨行動，發展受到打擊
  - label: D
    content: 北伐過程中與蔣中正率領的國民政府為敵
