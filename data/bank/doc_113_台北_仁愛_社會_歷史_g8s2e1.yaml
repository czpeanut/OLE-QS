  stem: 以下為某天發生於北京天安門廣場的情形：「以北京大學為首的十三所學校三千多名學生雲集天安門，高呼口號，要求維護山東權益及懲辦交通總長曹汝霖、幣制局總裁陸宗輿、駐日公使章宗祥這些對日交涉官員。學生遊行到趙家樓曹宅，痛打了章宗祥，並火燒趙家樓。隨後來自政府的軍警逮捕多名學生，引發全國各階層抗議，多處發生罷課、罷工、罷市。最後政府迫於眾怒，釋放學生，罷免相關官員。」關於上文所描述的內容，下列選項何者正確？
  options:
  - label: A
