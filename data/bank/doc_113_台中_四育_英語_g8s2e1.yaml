- id: doc_113_台中_四育_英語_g8s2e1_s5_33
  section: 5
  number: 33
  type: single
  page: 3
  stem: If something is transparent, what does it mean?
  options:
  - label: A
    content: It is good at climbing.
  - label: B
    content: It can jump far and fast.
  - label: C
    content: It is covered with white wax.
  - label: D
    content: People can see almost everything inside it.
  group_stem: 'Did you ever see a walking popcorn? In Andreas Kay''s video, you can
    see one walking popcorn on its fingers! In fact, it is a baby Flatid Planthopper
    Nymph insect. It looks like a small cloud or a piece of popcorn resting on little
    insect legs. There is a reason for this strange look - the insect is covered with
    white wax to keep itself safe. The insects live in Amazon rainforest, but it''s
    not easy to see them because they are very small (about 1 cm), and they can jump
    far and fast between plants. They feed on plant juice, but they don''t hurt plants.
    They are really interesting, aren''t they?


    There are many kinds of special animals in the Amazon rainforest, and the glass
    frog (Hyalinobatrachium fleischmanni) is one of them. Why does it get the name?
    Because its abdomen skin is transparent, just like glass! You can clearly see
    its body parts, like the stomach and the heart, through its skin. More than that,
    its eggs are transparent, too! Glass frogs are about 2-3 cm long, so it''s hard
    for us to notice them. Besides, they are really good at climbing. Come to the
    Happy Zoo, and you can see the cute little frog in person!


    be covered with 被..所覆蓋

    wax 蠟

    abdomen skin 腹部皮膚

