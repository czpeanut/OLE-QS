  stem: What does they mean?
  options:
  - label: A
    content: Rukai people.
  - label: B
    content: Paiwan people.
  - label: C
    content: Bunon people.
  - label: D
    content: Hundred Step Snakes.
  group_stem: 'Hundred Step Snake

    pointed head

    mainly brown or gray, with light brown or gray triangles

    91 cm to 121 cm


    ▶ Be careful! They are poisonous.

    ▶ They feed on small animals, like birds or frogs.

    ▶ Most of them are in the mountains in China or Taiwan.


    Hundred Step Snakes are important for Paiwan, Bunon, and Rukai, the indigenous
    tribes in Taiwan. Paiwan people believe they are from Hundred Step Snakes. We
    can see patterns of Hundred Step Snakes on many things in Paiwan tribes.


    A Story about Hundred Step Snakes

    One day, when an old man was picking up a flower, a Hundred Step Snake appeared.

    I want your daughter to be my wife. If not, you will die.

    Don''t be sad, Dad. I will get married to it.

    The snake took away the daughter, and to her surprise, it changed into a handsome
    man.


