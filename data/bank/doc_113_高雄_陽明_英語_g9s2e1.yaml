- id: doc_113_高雄_陽明_英語_g9s2e1_s2_45
  section: 2
  number: 45
  type: single
  page: 6
  stem: When David sees a headstone of a soldier in the US and wants to thank the
    soldier for his or her brave act, what coin can he place on the headstone?
  options:
  - label: A
    content: Nickle.
  - label: B
    content: Quarter.
  - label: C
    content: Penny.
  - label: D
    content: Dime.
  group_stem: 'Have you ever been in a cemetery in the US and saw coins left on a
    headstone? A coin left on a headstone is meant as a message to let the dead soldier’s
    family know that somebody stopped by to pay their respect or to take a moment
    to remember the old days.

    There are four main types of coins in the US, and there’s a deeper meaning behind
    each coin left on the headstone. Leaving a penny on the headstone simply means
    that one visited and wanted to thank the dead soldier for their service. A nickel
    is left by those who trained at boot camp with the dead soldier while a dime means
    the one who once stayed at the same camp with the dead soldier came to remember
    him or her. Of all the coins left, a quarter is the most special and touching
    symbol. By leaving a quarter on the headstone, the one who visited is telling
    the family that he or she was with the soldier when he or she passed away.

    What happens to the coins that are left on the headstones? They are collected
    by the workers of the cemetery monthly and the money is used for cemetery maintenance.


    More Knowledge about the US Coins

    1. A penny is the same as 1 cent, one hundredth of a US dollar. The symbol of
    it is 1¢ or 1c.

    2. A nickle is the same as 5 cents, a dime is the same as 10 cents, and a quarter
    is the same as 25 cents.

    📖 cemetery 墓園 coin 硬幣 headstone 墓碑 respect 尊敬 boot camp 新兵訓練營 maintenance 維護'
