  group_stem: 'One sunny day, a very hungry fox was looking for something to eat.
    As he walked, he spotted a little bird in a tall tree. To the fox’s surprise,
    the bird was holding a big piece of cheese in her mouth.

    The fox stopped and looked at the bird. “The cheese looks so yummy,” he thought.
    “I must have it. But how can I get it from the bird? I can’t climb trees, and
    the bird is too far for me to reach.” The fox sat down and began to think. Soon,
    he came up with an idea. The fox smiled and called out to the bird, “Hello, dear
    bird! You are the most beautiful bird I’ve ever seen. Your feathers are so soft
    and shiny, and your eyes are bright like stars in the dark night. I am sure you
    do have a lovely voice, too. Please let me hear but one song from you so that
    I can tell others you are the Queen of Birds.” When hearing the fox’s sweet words,
    the little bird felt surprised and excited. She thought, “This fox must fall in
    love with me at the first sight. I have to sing for him to show how wonderful
    I am.”

    “Tweet! Tweet!” As soon as the little bird started to sing, the piece of cheese
    fell from her mouth and dropped to the ground. The fox quickly picked up the cheese
    and ate it up. Then, he laughed out loud and said, “My queen, thank you for the
    cheese! It was very kind of you to share it with me.” The little bird felt so
    sad and said to herself, “I was so ridiculous. Actually, the fox didn’t like me
    at all. He just wanted my cheese. I should not have trusted him so easily.”

    The important lesson the story teaches us is that we shouldn’t believe all the
    words a stranger says to us. Be careful of those who use sweet words to trick
    others.

    📖 feather 羽毛 shiny 閃亮的'
