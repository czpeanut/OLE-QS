  group_stem: 'Nick is a junior high school student who’s been interested in insects
    these days. Here are some notes he took after reading a lot about dragonflies
    and damselflies.


    Dragonflies and damselflies are both insects that are commonly seen in Taiwan.
    They look so much like each other that it''s hard for people to tell one from
    the other sometimes. However, there are still a few tips that can help us distinguish
    between the two cousins.

    Dragonflies are usually larger than damselflies. Their abdomens are thicker and
    longer than those of damselflies. ❶ Dragonflies also have larger compound eyes,
    and their eyes are close to each other, almost right next to each other. ❷ Damselflies''
    eyes, on the other hands, are smaller and farther from each other. When the two
    insects are resting, dragonflies open their wings while damselflies fold their
    wings. Dragonflies'' front wings and hind wings are of different shapes and different
    sizes, yet damselflies'' front wings and hind wings are pretty much the same.
    Dragonflies can fly faster than damselflies. Sometimes they can fly as fast as
    40 km/hr. ❸ Dragonflies and damselflies are both predators. They feed on other
    insects.

    Interesting Facts about Dragonflies

    1. The way they fly made people come up with the idea to invent airplanes.

    2. ❹ When dragonflies are flying low, it usually means that it’s going to rain.

