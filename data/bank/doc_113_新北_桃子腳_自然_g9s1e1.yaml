  stem: '運動的圖示，結合理化課所學嘗試將下列故事(原文改編自維基百科)用摘要的內容製成 X-t 圖或 V-t 圖來表示。


    故事標題：環遊世界 80 天

    故事說明：《環遊世界八十天》（法語：Le tour du monde en quatre-vingts jours）是由法國作家儒勒·凡爾納所寫的古典冒險小說，於
    1873 年出版。


    故事內容：

    英國一位名叫菲利斯·福格（Phileas Fogg）的紳士，福格在俱樂部內以兩萬英鎊打賭 80 天能夠環遊世界，他與僕人萬事通（Passepartout）便踏上環遊世界之路。

    旅程開始於 1872 年 10 月 2 日的倫敦，他們首先花七天從倫敦到蘇伊士，後來他們又花十三天來到孟買額外花三天到加爾各達；在往加爾各達的路上花一整天的時間從當地人手中救下被強迫行陪葬儀式的貴族少婦奧妲。救人任務完成後又花了十三天到達香港，接下來福克請人送他們到上海才輾轉到橫濱，共花他們六天的時間。

    在日本福格重遇失蹤的萬事通便繼續上路，利用 22 天從日本到舊金山；他們在舊金山轉乘鐵路到紐約，共花七天到達紐約。到紐約後發現從紐約到英國的船已經開船，他們毅然搭上一艘開往法國波爾多的船橫渡大西洋回到英國本土，但因為與警方的誤會兩人鋃鐺入獄被扣押一晚才證實福克的無罪，福格出獄後連忙坐車回去倫敦。福格最終贏到俱樂部的兩萬英鎊並與奧妲結婚，而他的旅費共是一萬九千英鎊。


    故事摘要：

    (1)倫敦出發回到倫敦

    (2)總共經歷 80 天

    (3)主要交通工具包含較快的火車(第 1~22 天、第 46~52 天、第 80 天)及較慢的帆船(第 24~45 天、第 53~78 天)

    (4)第 23 天在加爾各答救人而停留、第 79 天在蘇格蘭(倫敦北邊)被捕入獄共兩次停留

    (5)第 40 天完成繞地球半圈(位置大約在紐西蘭)

