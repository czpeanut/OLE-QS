  type: single
  page: 2
  stem: 臺灣早在17 世紀時，就已經成為荷蘭人在亞州貿易的據點，今日也是亞洲大陸東南邊緣海、空航線的樞紐。臺灣之所以可以國際貿易為主要經濟基礎，是跟臺灣位在哪兩個區域之間優越的地理位置較有關連？
  options:
  - label: A
    content: 熱帶與溫帶
  - label: B
    content: 陸地與海洋
  - label: C
    content: 東北亞與東南亞
  - label: D
    content: 菲律賓板塊與歐亞板塊
