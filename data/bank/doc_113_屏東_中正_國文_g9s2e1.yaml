- id: doc_113_屏東_中正_國文_g9s2e1_s2_6
  section: 2
  number: 6
  type: single
  page: 4
  stem: 關於本文的敘述，下列何者正確？
  options:
  - label: A
    content: 臺灣戰略位置的重要性，早在十五世紀就廣為人知
  - label: B
    content: 雖然臺灣政府有設立中央海洋機構，但專業仍顯不足
  - label: C
    content: 相較於大陸型環境，海島具有更豐富的天然資源
  - label: D
    content: 作者認為精通科學理工者，應該為海洋作更多研究貢獻
  group_stem: "丙、\n轉過頭來\n廖鴻基\n  老天不一定公平，但除了缺點以外，老天總是慷慨的給每個人一些優點。有智慧的人，懂得善用他的優點並盡量迴避缺點。譬如說，具科學天分的人若往理工領域發展，往往得心應手、事半功倍。\n\
    \  天生宿命，老天把我們生在一座被海洋包圍的海島，我們生而為海島居民，相對於大陸型環境，海島注定先天有限：土地面積有限、天然資源亦有限。臺灣島的能源不足、礦產不豐、沒有一望無際的田園、沒有雄厚的經濟規模，特別是山林面積占了七成以上，讓兩千三百萬人密集擁擠的生活在窄狹的平原和城市裡，於是到處排隊、到處塞車、到處擁擠，生活競爭激烈……，這是海島宿命，也是在海島生活的缺點。\n\
    \  然而，若我們願意轉過頭來，不難發現，海島四周圍著的是綿長海岸線以及開闊的大海。若我們願意更進一步以海洋視野、海洋觀點，重新看待這座海島屬於海域的海洋價值。啊，終於發現，海洋是這座海島的最大資產，也是這座海島向外發展的最大優勢。\n\
    \  轉過頭來，海闊天空。\n  臺灣位居西太平洋 東亞海運樞紐，是老天給的海洋地理優勢，讓我們長期擁有國際格局的海運運能：臺灣位於西太平洋第一島鏈焦點位置，是東亞國際海洋戰略據點，十五至十七世紀人類大航海大發現時代，西方船舶早已往返於我們沿海，從那時候起，臺灣已聞名於國際。臺灣西邊海域為東亞陸棚，東部海域面對深邃浩瀚大洋，有深有淺，加上海流交互作用，我們海域蘊含的海洋生物資源或非生物資源都堪稱一流；我們的祖先，不管哪一族，都是渡海而來；我們的歷史往往建構於海島與海洋的穿梭間……\n\
    \  海島面對海洋，形勢自然開放，開放產生流動，流動自然多元，多元需要包容。開放、流動、多元和包容，是臺灣最大特色，也是臺灣最大優勢。\n  種種因素，我們一直背海發展，畏海、恐海。經年累月，這座島上處處看得到不合理的海島社會現象。譬如：沒有中央層級的海洋專責機構、海洋專業在臺灣一直嚴重不足。\n\
    \  海洋不受重視，海岸成為島國的邊陲角落，海岸、海域的汙染及破壞超出陸地許多。舉例來說，我們長期僅以滿足口腹的低層級消費態度，耗用老天給我們豐富的魚類資源，結果是吃到只剩海鮮文化沒有海洋文化，吃到沿海魚類資源快速枯竭。如此一流的魚類資源，照理說，我們應該有不少國際知名的魚類、漁業研究，我們應該有不少以海洋文化、海洋精神為創作題材的海洋藝文作品。\n\
    \  因為背對著，因為看不見，枉費了老天給我們一流的海洋資源。\n  轉過頭來面對海，當我們懂得善用海島的最大優勢，以寬廣海域彌補有限陸域，相信臺灣將會有所不同。"
