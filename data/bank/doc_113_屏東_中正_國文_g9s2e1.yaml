- id: doc_113_屏東_中正_國文_g9s2e1_s2_9
  section: 2
  number: 9
  type: single
  page: 5
  stem: 下列何者為本文的主旨？
  options:
  - label: A
    content: 強調「一日之計在於晨」的愉悅
  - label: B
    content: 介紹搭車沿途所見的桐花之美
  - label: C
    content: 感受鄉間人情的真誠可愛
  - label: D
    content: 讚許當地公車運輸的便捷。
  group_stem: "丁、\n內山來的阿婆公車\n劉克襄\n  清晨六點半，和作家王浩一相偕，從竹東車站搭乘新竹客運，準備到關西買菜。好幾位老人和國高中生已在等候。桐花盛開時節，選擇這班台3\
    \ 線客運，我研判，一路應該可以看到不少桐花。再者，若能一早搭乘公車去關西，說不定還會遇到賣菜的農民呢！\n  上車時，我和浩一選擇坐在前排，想跟司機聊天。但有位阿公一上去，便搶先坐在右邊的第一個位置。他持了一把包裹的長砍刀，另外還背了個茄芷袋，穿著打扮彷彿要去登山。我好奇的探問，結果他真要去採桂竹，砍刀是用來整理竹林的場地。我借來檢視，是把鋼製的，頗沉重。不常使用如我，揮砍沒幾下，想必就要手痠。我們熱絡的聊起桂竹的採收，以及食用方法。一位坐在後座的阿婆，看我們聊得開心，湊興的加了進來。她在九讚頭\
    \ 亞泥工廠福利部的理髮廳工作，歡迎我有空去那兒剪髮。\n  接近九讚頭，她要下車了，特別告知我理髮廳的位置，似乎很擔心我不會去。後來，阿公也在合興車站旁邊的十分寮告別。我以為客運暫時會安靜下來，可以安心觀看桐花了。不料，每一站都有三四位老嫗老漢引頸佇立，等候這班公車的到來。\n\
    \  上車的老人幾乎都是一身素樸打扮，黧黑的臉龐密布皺紋和暗斑。司機長年駕駛這路線，每位阿公阿婆都識得。哪位行動較遲緩，在哪兒上下車，大概也瞭如指掌。因而都會等候他們緩然起身、移動，甚至提醒他們慢點來。前陣子，新竹縣長還特別拜託新竹客運的司機，希望他們盡量開慢，讓乘客坐得安穩、舒適。畢竟，整個縣搭乘公車的乘客，除了年輕學生，主要以老人家為多。車子穩當的行駛，緩緩停靠，他們更安心，就會經常利用。\n\
    \  一路上，桐花真的盛開了。若從天空往下拍攝，我浪漫的想像著，這輛公車彎繞於山路，兩旁許多桐花盛開的綺麗畫面。\n  老人愈來愈多下，浩一讓出位置，退到後頭。我還想跟司機攀談，於是窩進前頭車輪突起，較不好坐的位置。十來分鐘內，旁邊的座位換了兩位阿婆，我建議綁安全帶，都不理我。最先一位，嘰哩呱啦全是客家話，大概是四縣的，我幾乎聽不懂。第二位抱了一大堆野菜，會講閩南語。我問她用紙包著什麼菜？她覺得男人不需要懂什麼菜，不願意回答。我問她要去哪裡？她說，還要到關西市場買菜。那一排，幾位阿婆和她在不同站上車，結果都是要去那兒買菜。我說真巧，自己也是。\n\
    \  她們不信，從我的年紀和穿著打量，不像是買菜的。浩一靠上來，站在走道，證實我所言不假，順便問旁邊的幾位阿婆歲數。耄耋之年了，往往就不那麼忌諱年紀。我旁邊的很爽朗，直接回答八十五歲。浩一大驚，再問隔壁，八十三。更旁邊，八十二。還有一位，八十一。這一整排搭公車去買菜的，只有我最年輕，還不及六十。他一統計，不禁大笑。此時，後面還有一位阿婆，用力拍我的肩膀。我回頭，只見她指著自己的臉，「我嘛，八十歲了！」\
    \   \n    我笑得合不攏嘴，浩一則差點摔倒在地。接下，一路上我已無心觀看什麼桐花了，阿婆們七嘴八舌，都在聊關西菜市的內容。整輛客運便在這等阿婆的喧譁中彎繞著。只可惜，時間過得太快，沒多久我們便抵達關西。幾乎所有阿婆都起身，她們排成一列，二三十人，魚貫的走下去。我們倆也排在裡面。\n\
    \  下了車，大家都往喧譁的市場走去。一路上，我們落後了，忙著探看新奇的蔬果，一邊尋找乾仙草。中途，有人過來跟我們打招呼，是那位八十歲的。她已買好菜，準備回家。她打開讓我見識，原來只買排骨和蒲瓜。為何這麼快，這樣就好嗎？她點點頭。只有一個人，一道菜就夠了。再者，滿七十五歲搭車不用錢，她樂於每天搭車，往返菜市場。\n\
    \  人生一瞬，旅次中，難得遇見這麼多可愛的阿婆們。桐花季結束後，我相信自己還會有多次清晨回到這裡，坐在這條山路的客運上。"
