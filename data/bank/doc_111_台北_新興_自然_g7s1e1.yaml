- id: doc_111_台北_新興_自然_g7s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '探討未知的生物現象時，可依序用：(1)觀察、(2)提出問題、(3)提出假設性的答案、(4)設計實驗四個步驟來得到結論。陳恭要研究螞蟻的行為，列出了甲、乙、丙、丁四個敘述，如附表所示，若依上述探討生物現象的步驟，則下列何者屬於步驟(3)提出假設性的答案？


    | 編號 | 敘 述 |

    | :--- | :--- |

    | 甲 | 利用果汁畫出彎曲的路線，觀看螞蟻的反應 |

    | 乙 | 可能是地面上有殘留果汁可以吸引螞蟻 |

    | 丙 | 為什麼螞蟻會沿著直線前進 |

    | 丁 | 螞蟻常常沿著直線前進 |'
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
  tags:
    chapter:
      publisher: 康軒
      book: 七上
      subject: 生物
      code: 1-1
      title: 生命現象
      chapter: 第1章 生命的特性
    textbook: 七上生物 1-1 生命現象
    labeled_by: ai
