- id: doc_113_高雄_光華_國文_g7s2e2_s2_1
  section: 2
  number: 1
  type: single
  page: 4
  stem: 太平枇杷節沒有下列何種活動？
  options:
  - label: A
    content: 健行
  - label: B
    content: 製作枇杷木存錢筒
  - label: C
    content: 枇杷展覽
  - label: D
    content: 製作植物染方巾。
  group_stem: '太平區位於台中市的西北角，這裡所種植的枇杷聞名全國，每年春天，當枇杷的果實成熟，太平區會舉辦盛大的「太平枇杷節」。枇杷節的活動除了有熱鬧的農產品展售，還有許多地方特色的民俗表演和文化活動，吸引了不少遊客前來參加。


    太平區的枇杷樹生長在這片豐饒的土地上，這裡的氣候和土壤特別適合枇杷樹生長，因此產出的枇杷品質優良，口感甘甜。每年春天，當地農民都會精心挑選最好的枇杷，參加枇杷節的展覽與競賽。除了展示新鮮的水果外，還有製作枇杷乾、枇杷蜜等地方特色產品，讓遊客可以一邊品嚐當地美味，一邊了解枇杷的生產過程。


    太平枇杷節不僅是當地農民的驕傲，也是台中市的文化名片之一。節慶中不僅能品嚐到當季的美食，還能體驗台灣傳統的民俗活動，如舞獅、陣頭表演等，這些活動讓當地居民和遊客能夠一起共享這個豐收的時刻。


    活動時間(國曆)與地點：


    3月5日（星期三）：枇杷記者會

    地點:大湖桶枇杷園區


    3月8日（星期六）：枇杷親子健行活動

    地點:聖和宮


    3月9日（星期日）：紙風車劇團表演「巫頂環遊世界」

    地點:龍奉宮


    3月15日（星期六）：農遊太平食農教育活動(包括枇杷果樹認養、枇杷採果趣、藍莓採果趣、植物染方巾製作)

    地點:太平區農會


    3月20日（星期四）：枇杷評鑑會

    地點:太平區農會


    3月22日（星期六）：枇杷產業文化活動(舞獅、陣頭表演)

    地點:太平區運動場


    （改寫自網路新聞）'
