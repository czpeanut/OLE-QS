  group_stem: '這山上的鐘聲是晝夜不間歇的，平均五分鐘時一次。打鐘的和尚獨自在鐘頭上住著，據說他已經不間歇的打了十一年鐘，他的心願是打到他不能動彈的那天。鐘樓上供著菩薩，打鐘人在大鐘的一邊安著他的「座」，他每晚是坐著安神的，一隻手挽著鐘棰的一頭，從長期的習慣，不叫睡眠耽誤他的職司。「這和尚。」我自忖：「一定是有道理的！和尚是沒道理的多：方才那知客僧想把七竅蒙充六根，怎麼算總多了一個鼻孔或是耳孔；那方丈師的談吐裡不少某督軍與某省長的點綴；那管半山亭的和尚更是貪嗔的化身，無端摔破了兩個無辜的茶碗。但這打鐘和尚，他一定不是庸流不能不去看看！」

    他的年歲在五十開外，出家有二十幾年，這鐘樓，不錯，是他管的，這鐘是他打的（說著 他就過去撞了一下），他每晚，也不錯，是坐著安神的，但此外，可憐，我的俗眼竟看不出什麼異樣。他拂拭著神龕，神座，拜墊，換上香燭，掇一盂水，洗一把青菜，捻一把米，擦乾了手接受香客的布施，又轉身去撞一聲鐘。他臉上看不出修行的清癯，卻沒有失眠的倦態，倒是滿滿的不時有笑容的展露；念什麼經，不，就念阿彌陀佛，他竟許是不認識字的。「那一帶是什麼山，叫什麼，和尚？」「這裡是天目山。」他說。「我知道，我說的是那一帶的。」我手點著問。「我不知道。」他回答。

    （徐志摩 天目山中筆記）'
