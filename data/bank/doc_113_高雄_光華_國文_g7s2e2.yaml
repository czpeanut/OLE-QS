  group_stem: '玉不琢，不成器；人不學，不知道。是故古之王者（１）建國君（２）民，教學為先。兌命（３） 曰：「念終始典於學。（４）」其此之謂乎！雖有嘉肴（５），弗食，不知其旨也；雖有至道，弗學，不知其善也。故學然後知不足，教然後知困。知不足，然後能自反（６）也；知困，然後能自強（７）也，故曰：教學相長也。

