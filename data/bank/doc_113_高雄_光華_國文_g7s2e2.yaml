- id: doc_113_高雄_光華_國文_g7s2e2_s2_6
  section: 2
  number: 6
  type: single
  page: 5
  stem: 本文中「只納不吐」的人，可用下列何者來形容？
  options:
  - label: A
    content: 文不加點
  - label: B
    content: 筆底生花
  - label: C
    content: 秉筆直書
  - label: D
    content: 惜墨如金。
  group_stem: 寫和讀的關係，是一種天然的吐納關係。只納不吐，不僅消化不良，而且必然會產生惡性的壅阻。我們也許都見過一些成天讀書卻從來不說什麼、不寫什麼、也不想什麼的讀書人，他們淡然的風度不無可喜，但畢竟並不是什麼隱士遺民，長久的無效難道就不會導致無聊？吸收了那麼多東西，總需要有所運動、有所傾吐。談話是一種傾吐，而寫作，則是一種更深入、更系統的傾吐。不要過於畏懼寫作和發表，身在現代，傳媒繁多，出版便捷，天天面對書頁的人為什麼不可以也寫一點書頁出來？當然也不必成為專職的寫作人，寫作人一專職就高明不到哪裡去了；各種行業中喜歡讀書的人都不妨試著寫點什麼，使自己的閱讀感受梳理得更加完整。如果有可能發表也當仁不讓，任自己的感受去叩動更多人的心，這樣就構成了一個健康的循環圈。自己的活力、文化的活力，社會的活力都會在循環過程中不斷遞增。（余秋雨
    臺灣演講）
