  section: 1
  number: 27
  type: single
  page: 3
  stem: 請判斷下列文句所描寫的對象，哪位同學說明正確？
  options:
  - label: A
    content: 據說是這樣種在那裡的：一隻沖天的鷹，飛去時折了雙翼，落地生根。終於化作眼前的兩簇防風林→彥寬:由「一隻沖天的鷹」可知描寫的對象為「鼻子」
  - label: B
    content: 如果說額是懸崖，仰望是天空，那無聲無濤從天而降的瀑布——黑色的，便是了→杰宏:由「額」和「黑色的瀑布」可知描寫的對象是「頭髮」
  - label: C
    content: 不是碑，也不是塔。一次地崩以後，陷下的兩谷便叫屹立不動的突出成孤峰→子豪:由「陷下的兩谷」可知描寫的對象為「眼睛」
  - label: D
    content: 欲射鳥的獵人向天空發了一槍。失手。受傷的地方從此留下黑黑圓圓的彈痕→坤宇:由「黑黑圓圓的彈痕」可知描寫的對象為「嘴」。
