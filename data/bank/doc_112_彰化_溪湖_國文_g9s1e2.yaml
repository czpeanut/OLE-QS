  stem: 「我想，如果我們改變心態，將當下的『禍』，視為帶來日後『福』的一種試煉和必經過程，便能更加積極的面對眼前的生活。就旁人的眼光來看，我的人生確實百轉千迴，繞了許多遠路。但從我本身的角度出發，我反而認為自己一路走來都是直行向前，因為我總在最好的時機點上，遇見最好的『機會』。」（宮本延春〈把握每一次的「機會」—從機會中，尋找正向能量〉）根據這段文字，下列何者最符合作者的想法？
