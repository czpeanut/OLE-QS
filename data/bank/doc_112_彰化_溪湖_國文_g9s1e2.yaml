    \  大家應該都有喝過蜂蜜吧？要知道，一隻蜜蜂釀出一公斤蜂蜜需飛行三十萬公里，在這萬里路程上，牠們不知道要經歷多少逆境，也許曾遇到正在捕捉昆蟲的小孩子，也許會不小心撞到一張大大的蜘蛛網上，可是牠們仍願意迎著逆境而上，取得代表牠們成功的蜂蜜。\n\
    \  舉世聞名的音樂家貝多芬十七歲時患了傷寒和天花病，二十六歲又失去了聽覺，這對於音樂家是致命的打擊！然而在這種情況下，貝多芬卻發誓「要扼住生命的咽喉，與命運進行頑強的搏鬥」，創作出如命運交響曲等傳世名作。厄運不但沒有嚇倒他，反而成就了他的音樂事業。\n\
    \  前蘇聯作家高爾基從小失學，當童工來維持生計，飽嘗人間的辛酸。但他即使累得腰痠背痛也不肯放棄看書，還在雇主的皮鞭下偷學寫作，終於成為著名的作家。\n \
    \ 美國的大發明家愛迪生，買不起書和做實驗用的器材就到處收集，有一次，他在火車上做實驗，不小心引起了爆炸，被車長一記耳光打聾了一隻耳朵。生活的困苦和身體的缺陷都沒有讓他灰心，他更加勤奮地學習，終於成了舉世聞名的科學家。\n\
    \  以上種種的名人事例告訴我們：逆境出人才！每個人的人生都有高潮和低谷，也就是我們說的順境和逆境。當你身處順境的時候會覺得一呼百應，到處都是陽光和笑臉。而相反的是，當你身處逆境的時候，不一定能得到朋友的幫助，甚至還會遇到落井下石的事情。所以，當我們面對逆境的時候，要學會自己去化解，而不是太過於去依賴他人，要用坦然的心去面對逆境。要明白逆境是成功的基石。"
