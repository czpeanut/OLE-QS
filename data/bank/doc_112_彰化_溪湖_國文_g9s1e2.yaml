- id: doc_112_彰化_溪湖_國文_g9s1e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 「臨時起意要去瑞芳老船長海鮮餐廳吃螃蟹，結果因為人多，要等一個小時，所以便信步在深澳漁港走走。不料，從防波堤走出去，竟別有洞天！象鼻岩海岸在秋陽照耀之下，浪濤澎湃、海水澄澈。蔚藍的天空下，海風吹拂髮梢，令人心神俱醉。海蝕洞與嶙峋的石蕈風貌特別，遊人如織。」（陳安儀〈半日偷閒遊深澳、觀星空〉）根據這段文字，下列敘述何者正確？
