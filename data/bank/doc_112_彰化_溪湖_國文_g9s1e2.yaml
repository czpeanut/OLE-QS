    \ |\n| (丙) | 梁惠王 | 孟子 | 如何避免危險 | 國家的危險來自求取利益 |\n| (丁) | 梁惠王 | 大夫 | 如何獲取利益 | 不該因利益遺棄親人國君\
    \ |"
