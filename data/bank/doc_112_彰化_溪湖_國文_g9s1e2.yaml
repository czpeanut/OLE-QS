  stem: "學者薩伊德曾說：「知識分子關切的事不只在於他的訴求對象，也代表合宜的價值觀點。」依此檢視圖文配對，何者正確？\n  孟子見梁惠王。王曰：「叟！不遠千里而來，亦將有以利吾國乎？」\n\
    \  孟子對曰：「王何必曰『利』？亦有『仁義』而已矣。王曰：『何以利吾國？』大夫曰：『何以利吾家？』士庶人曰：『何以利吾身？』上下交征利，而國危矣。……未有『仁』而遺其親者也；未有『義』而後其君者也。王亦曰『仁義』而已矣，何必曰『利』？」（《孟子．梁惠王》上）\n\
    \n| | 知識分子 | 訴求對象 | 關切的事 | 知識分子的觀點 |\n| :--- | :--- | :--- | :--- | :--- |\n|\
