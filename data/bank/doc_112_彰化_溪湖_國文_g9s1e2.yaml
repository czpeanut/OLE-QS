  type: single
  page: 2
  stem: "「版築」是中國上古流傳下來建造土牆的方法，用兩塊一定長度與厚度的木板，橫立在預定要築牆的兩側，兩木板間的距離就是牆的厚度；接著將木板的外側豎立木柱，也將潮溼的土壤填至其中，再用杵夯實；當所築之牆高度與木板平齊時，可依高度需求再將板上移，重複先前動作，築牆的長度也使用相似方法。如《孟子．告子》下：「舜發於畎畝之中，傅說舉於版築之間。」的「版築」即是如此。\n\
    \  「模板」則是近代建築的工法，混凝土被澆置其中，硬化後模板可能會被拆除。常見有三類：\n一、傳統木模：模板由木頭或膠合板製造，木模製程簡單，但對大型建物而言可能非常費時。傳統木模是最靈活的一種模板，所以即使使用了其他系統模板，複雜的工程部分仍會使用它，常用於勞力成本比模板成本低時。\n\
    二、系統模板：這種模板由預製的金屬骨架組成，在對應混凝土的那面安裝適合的表面材料。與傳統木模相比優點是建造速度，可重複使用降低成本，又因為骨架為金屬而非傳統木模，所以幾乎不會損耗。\n\
    三、塑膠模板：這些模板輕盈且強健，適合用來建造高度變化，卻相對簡單的混凝土結構。此模板特別適合使用在相似的建築結構計畫或低成本、大量住宅計畫。【注】夯：ㄏㄤ，用來敲打地基，使其結實的工具（黃學文〈版築與模板〉）\n\
    依據上文，下列敘述何者正確？"
  options:
  - label: A
    content: 「版築」與「系統模板」築牆的外殼材料一樣，只是牆體的塑造材料不同
  - label: B
    content: 「模板」是近代建築的工法，與古代「版築」這類型的建造技巧截然不同
  - label: C
    content: 「混凝土」的使用，使建築業的建造速度加快，工法多元且可因需求改變
  - label: D
    content: 「塑膠模板」輕盈且強健，建造成本不高，所以能完全取代「傳統木模」。
