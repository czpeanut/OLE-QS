  options:
  - label: A
    content: 「山川之美，古來共談」為本文總綱，與「奇山異水，天下獨絕」有異曲同工之妙
  - label: B
    content: 「兩岸石壁，五色交輝」與「天山共色」之意相近
  - label: C
    content: 「曉霧將歇，猿鳥亂鳴」與「猿則百叫無絕」皆暗指青春不再，內心惶恐不安
  - label: D
    content: 「夕日欲頹，沉鱗競躍」與「橫柯上蔽，在晝猶昏」皆在描寫黃昏時的景致。
  group_stem: '(二)讀完文章後，選出適當的答案

    山川之美，古來共談。高峰入雲，清流見底。兩岸石壁，五色交輝（１）；青林翠竹，四時俱備。曉霧將歇（２），猿鳥亂鳴；夕日欲頹（３），沉鱗（４）競躍。實是欲界（５）之仙都，自康樂（６）以來，未復有能與其奇者（７）。（陶弘景〈答謝中書（８）書〉）

    【注】（１）五色交輝：指山壁上各種光色交相輝映。（２）歇：止、消散。（３）頹：落、墜。（４）沉鱗：水中的游魚。鱗，指魚。（５）欲界：指人間。（６）康樂：謝靈運，襲封康樂公，故世稱謝康樂。（７）與其奇者：指欣賞這樣奇妙景色的人。與，音ㄩˋ，參加，此指欣賞。（８）謝中書：謝微，或作謝徵，字玄度，曾任中書鴻臚，故稱謝中書。'
