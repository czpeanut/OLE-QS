  number: 16
  type: single
  page: 1
  stem: 往歲士人多尚對偶為文，穆修、張景輩始為平文，當時謂之古文。穆、張嘗同造朝，適見有奔馬踐死一犬，二人各記其事，以較工拙。穆修曰：「馬逸，有黃犬遇蹄而斃。」張景曰：「有犬死奔馬之下。」時文體新變，二人之語皆拙澀，當時已謂之工，傳之至今。根據這段文字，關於穆脩、張景針對奔馬踐死一犬的記事，下列敘述何者最恰當？
