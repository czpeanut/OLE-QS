  type: single
  page: 2
  stem: "閱讀下文，依文意選出敘述正確的選項：\n  文化？它是隨便一個人迎面走來，他的舉手投足，他的一顰一笑，他的整體氣質。他走過一棵樹，樹枝低垂，他是隨手把枝折斷丟棄，還是彎身而過？一隻滿身是癬的流浪狗走近他，他是憐憫地避開，還是一腳踢過去？一個盲人和他並肩路口，綠燈亮了，他會攙那盲者一把嗎？他與別人如何擦身而過？他如何低頭繫上自己鬆了的鞋帶？\n\
    \  如果他在會議、教室、電視螢幕的公領域裡大談民主人權和勞工權益，在自己家的私領域裡，他尊重自己的妻子和孩子嗎？他對家裡的保姆和工人以禮相待嗎？\n  獨處時，他，如何與自己相處？所有的教養、原則、規範，在沒人看見的地方，他怎麼樣？\n\
    \  文化其實體現在一個人如何對待他人、對待自己、如何對待自己所處的自然環境。在一個文化厚實深沉的社會裡，人懂得尊重自己——他不苟且，因為不苟且所以有品味；人懂得尊重別人——他不霸道，因為不霸道所以有道德；人懂得尊重自然——他不掠奪，因為不掠奪所以有永續的智能。（摘寫自龍應台〈文化是什麼〉）"
  options:
  - label: A
    content: 文化是個人在面對突發狀況時，言行散發的獨特氣質
  - label: B
