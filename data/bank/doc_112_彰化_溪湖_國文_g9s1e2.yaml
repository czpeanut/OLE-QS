    content: 認為仰慕者鬼鬼祟祟，不符合數學的實事求是。
  group_stem: "(三) 閱讀下文，並回答下列問題：\n  鬱悶的青春期，人像活在沼澤裡。鏡子裡的自己渾身散發出一股帶著體制和規矩的呆板氣息，那樣聽話的髮長，那麼不逾矩的乖巧表情，正派善良的眼神，和絕對不敢過膝蓋的裙長。\n\
    \  就在這樣枯淡的日子裡，我發現了那封情書。\n  它的空降令我不知所措。受了驚嚇似地在尋找一個可靠的藏匿處時，我的心情充塞前所未有的慌亂和狂喜。我不知它如何潛入我的書包，事先沒有任何預兆。我的眼皮沒有跳，耳朵沒有癢，也無沒來由的打噴嚏，游泳時既沒抽筋，打羽球時也沒擊傷自己。週六整理書包時，啪！它就這樣掉出來了。我從來沒有想到，當自己的名字以「情書」收信人的姿態出現時，會讓自己如此飽受驚嚇。信未細讀，匆匆便把它塞入數學課本裡。至於要學松鼠儲藏糧食那樣日後再細嘗，或是如埋葬屍體之後再不出土，我尚來不及想。\n\
    \  閤上課本，又覺不妥，於是取出，置入書套和封面之間的夾縫。嗯！還是不對，遂又塞入華文課本裡，數學太不人性，還是華文比較溫暖。轉念一想，我又何必那麼善待它，說不定是個討人憎的傢伙。最後決定把它安置在馬來文課本，它是中性的，一科我既不討厭也不喜歡的科目。這樣即使是令人不悅的信，我也沒因待它太厚而吃虧。千迴百轉的折騰之後，我自認找到了一個讓自己較滿意的處理方式。但是，更重要的事情是，到底署名「仰慕者」的鬼祟傢伙是誰？整晚課本對著我傻笑，我對著課本發呆。（節錄自鍾怡雯〈驚情〉）"
