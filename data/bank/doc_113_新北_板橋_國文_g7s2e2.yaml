  type: single
  page: 1
  stem: "「初來乍到時，安妮曾因為不諳臺語鬧過不少笑話。……好在小小年紀就離鄉背井、獨自生活的安妮，早已練就一身面對陌生環境的適應能力，就算遇到挫折，活潑開朗的她，也能馬上收拾好情緒。\n\
    \    從未想過成為歌仔戲演員的安妮坦言，戲班生活並不輕鬆。有著淡旺季之分的野臺歌仔戲，忙碌起來常是一整個月不間斷地連續演出，……。若幸運的話，表演地點就在嘉義附近，大夥兒還能抽空回家睡覺，但多數時候是戲團連夜趕車，在不同縣市間奔波。等到搭好戲棚可以入睡時，往往已經是凌晨時分。這樣的生活，安妮卻不以為苦。『吃苦當作吃補。』她用臺語說。」下列格言，何者最不適合形容阮安妮「吃苦當作吃補」的理念﹖"
  options:
  - label: A
    content: 蘇格拉底：逆境是磨練人的最高學府
  - label: B
    content: 金格金克拉：把失敗當作你的老師，而非你的終結者
  - label: C
    content: 詹卡爾林：錯誤可以之後再改正，但不做決定所浪費的時間卻無法挽回
  - label: D
    content: 卡內基：人可以戰勝不幸，只要立志發揮潛力，就能渡過難關
