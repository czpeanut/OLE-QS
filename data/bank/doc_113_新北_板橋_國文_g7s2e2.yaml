    基本成分是果粒、果汁、椰奶和西米。把柚肉剝散，芒果肉切成細粒，一半打成芒果汁，一半和柚肉做果粒。煮開椰汁，以砂糖調味後放冷。然後煮西谷米，水沸後才下米，大火滾十分鐘，見米心白點如針頭，即收火加蓋，燜至透明，取出以冰水沖洗，使其剔透清，不易軟爛。\n\
    最後以等量比例，把各物摻混拌勻，調出澄黃酸香的羹漿，倒入水晶碗或高腳玻璃杯，放入冰箱冷藏一陣，即成芬馥沁人的美點。此物的製法配方並無定本，有人加楊桃粒，以符楊枝美名；有人加椰果，以增彈牙嚼勁；有人加淡奶、鮮奶油甚至米漿調拌，以使汁底棉柔豐潤。\n\
    \                                 （節錄自蔡珠兒楊枝甘露）"
- id: doc_113_新北_板橋_國文_g7s2e2_s2_37
  section: 2
  number: 37
  type: single
  page: 8
  stem: 「然後有一天，我們突然發現自己的臉額也滲出涔涔的汗水，才恍然大悟自己出汗的原因。」這句話的意旨為何？
  options:
  - label: A
    content: 當一個人成熟長大之後，才會變得細心，注意到別人流汗
  - label: B
    content: 當別人將汗水滴到我們臉上時，才會注意到他們正在流汗
  - label: C
    content: 當自己也熱得臉上出汗時，才會注意到別人同樣也流汗了
  - label: D
    content: 當自己也需要辛苦流汗工作時，才會體會別人付出的辛苦
  group_stem: "（四）\n我們在日常生活中，不免會看到別人流淌汗水的情狀，只可惜有時候我們的情感麻木，於是只有匆匆一瞥而過，或者根本視若無睹，因此無從留下深刻印象。然後有一天，我們突然發現自己的臉額也滲出涔涔的汗水，才恍然大悟自己出汗的原因。\n\
    童年時光，也許有人會記得：母親常拿著一把陽傘，在夏日的炎陽下，提一大籃沉重的菜，由菜市場趕回來，雖然還在喘息，卻迫不及待地從菜籃掏出一個新上市的芒果，塞到孩子的手中。剎那間，我們會感覺到母親手心中濕濕黏黏的汗水，由衷的關愛之情仍舊沒有被風吹乾。\n\
    但常出現眼簾中的，恐怕是母親在張羅一家人吃飯時的忙碌，不管廚房多麼狹窄、悶熱，只見母親守在裡面，先是忙洗忙切，接著又是忙炒忙裝盤，等到菜餚就緒端上桌的時候，不僅可見到母親臉面晶亮的汗珠，連髮絲上也串了滑溜溜的汗珠兒。當我們仔仔細細地凝視，一邊咬嚼菜餚，也一邊嚥下了愛。\n\
    同樣地，我們在孩提時一旦跌倒受傷，驚慌而倉皇的父親會抱著我們去醫院，那粒粒焦灼的汗水往下滴，與子女的淚水交融在一起，而父親卻渾然無所覺，只是安慰地說：「不要哭，不要哭，一會兒就不痛了。」\n\
    漸漸長大，說不定要去外地求學，那時父母親會把一束濕潤的鈔票給我們帶去註冊、作生活費，有時候仍不忘補上一句：「不夠用的時候，馬上寫信回來。」不知是否汗浸濡的關係，那一束鈔票顯得特別柔軟，我們拿在手中，也感覺分量特別的重。\n\
    「鋤禾日當午，汗滴禾下土。」生活在世上，大家實在需要多了解他人的辛勞和疾苦；工廠裡的作業員\n揮汗如雨的工作；交通警察的後背濕了又乾，乾了又濕；誰知道那些維護城市整潔的工作人員，又流了多少汗水呢？\n\
    世上有些汗水是隱而不顯的，這時候便需要我們有心地去發掘、體悟。尤其是成功者背後的汗漬更是斑著，細細地研究，實不難發現他們所經歷的艱辛。\n所以，我們要尊敬別人努力所流的汗水，倘若自己進一步能為別人流汗，境界更高了。\n\
    \                                      （邵僩汗水的啟示）"
