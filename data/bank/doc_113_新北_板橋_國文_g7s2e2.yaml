- id: doc_113_新北_板橋_國文_g7s2e2_s1_20
  section: 1
  number: 20
  type: single
  page: 3
  stem: 「蘇格拉底是個生活簡樸的哲學家，但卻喜歡到雅典市集閒逛，經常駐足在商店的櫥窗前，興味盎然地看著裡面琳瑯滿目的商品。有一個朋友忍不住問他：『你為什麼會受到市場商品的誘惑？』蘇格拉底回答說：『我喜歡逛市集，是想去發現有那麼多東西，我沒有它們也能過完全快樂的生活。』」有關這段文字的說明，下列敘述何者最恰當？
  options:
  - label: A
    content: 即使並未擁有優渥的物質生活，只要知道滿足，自然能快樂過日子
  - label: B
    content: 斷絕對於物質的慾望，便可以得到心靈的滿足，並探索真正的自我
  - label: C
    content: 就算是哲學家也難免被新潮的商品吸引，即使他們買的常常不是他們真正需要的
  - label: D
    content: 只要擁有琳瑯滿目的商品，便可以得到真正的滿足
