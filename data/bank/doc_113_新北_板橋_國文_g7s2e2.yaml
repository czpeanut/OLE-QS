- id: doc_113_新北_板橋_國文_g7s2e2_s2_33
  section: 2
  number: 33
  type: single
  page: 6
  stem: 下列何者不是郭橐駝對待樹的態度與方法？
  options:
  - label: A
    content: 反反復復地日夜關心它
  - label: B
    content: 用舊土覆蓋根部並壓實
  - label: C
    content: 要順著樹木的本性發展
  - label: D
    content: 要讓樹根能夠伸開舒展
  group_stem: "（二）\n  唐朝有個叫郭橐駝的人，大家不知道他原來的名字。因為他走起路來背部凸起，臉朝著地，像駱駝的樣子，所以鄉里的人叫他「橐駝」。\n\
    郭橐駝的家鄉在長安西邊的豐樂鄉，他以擅長種樹聞名。長安一帶富豪人家要種花木觀賞的，以及賣水果的，都爭相邀請他前去指導。他所種的樹或移植的樹都長得高大茂盛，而果樹的果實則結得又早又多。其他種樹的人偷偷觀察並加以仿效，卻沒人比得上他。\n\
    有人問郭橐駝為什麼能把樹種得這麼好，他回答說：「我並沒有什麼祕訣，只不過是順著樹的天性，讓它們盡量發展罷了。種樹時要像照顧孩子般地小心，樹根要讓它舒展，在根部四周均勻地覆蓋上泥土，而且要用舊土，並將泥土壓實。把樹種下後就不再動它，好像拋棄它一樣。我只是不妨害它們的生長罷了，並非有能力讓樹木長得高大茂盛，或讓果實結得又早又多。其他種樹的人卻不是這樣，他們沒有把彎曲的樹根舒展開來，還換上新的土壤，覆蓋的土不是太多，就是太少。此外，又愛護得太殷切，擔心過多。早上去看看，晚上去摸摸，離開後又回來望望，甚至抓破樹皮查驗它是否還活著，有時還搖動樹根查看泥土是否扎實。這樣一來，樹木的本性就受到損害了。看起來是愛護它、擔心它，其實是害它，所以他們種的樹比不上我。我哪有什麼特別的本領呢？」\n\
    有人問郭橐駝：「把您種樹的方法，應用到治理人民，可以嗎？」他說：「我只懂得種樹，當官治理人民不是我的專業。但在我住的鄉里，看到那些當官的總喜歡不斷地發號施令，好像很疼惜百姓，結果卻給百姓帶來災禍。差役常常到這裡，一來就呼喊著：『官府下令，要我來催促你們耕田，勉勵你們種植，督促你們收割，要你們勤快織布、飼養豬雞，好好地養育孩子。』又不時擊鼓召集百姓，再三宣導政令。百姓就算不吃飯來接待慰勞這些官差，都還忙不過來，又怎能增加生產，過自在安樂的生活呢？大家都被折騰得痛苦而疲憊。這樣看來，治理人民和種樹在方法上，是不是有相近之處呢？」\n\
    問的人開心地說：「真好！我問種樹的方法，卻了解到治理人民的要領。」於是柳宗元為郭橐駝立傳，用來作為官員治理人民的警戒。\n\n              \
    \             （改寫自柳宗元 種樹郭橐駝傳）"
