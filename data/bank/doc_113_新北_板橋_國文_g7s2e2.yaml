- id: doc_113_新北_板橋_國文_g7s2e2_s2_31
  section: 2
  number: 31
  type: single
  page: 5
  stem: 根據本文，佛印的為人最適合用下列何者來形容？
  options:
  - label: A
    content: 矯揉造作
  - label: B
    content: 謙虛好學
  - label: C
    content: 虔誠向佛
  - label: D
    content: 風趣機智
  group_stem: "（一）\n有一天，蘇軾料理一道美味的蒸魚，正想品嘗時，他的好友佛印和尚突然來訪，蘇軾想跟他開個玩笑，於是把魚藏在書架上。沒想到佛印一進門就發現，因而裝模作樣地問蘇軾：「我今天來這兒，是想向你請教一個字。那就是你的『蘇』姓，應該要怎麼寫？」蘇軾一本正經地說：「便是『草』下左邊加『魚』，右邊加個『禾』字。」佛印繼續裝蒜地問：「如果把『禾』和『魚』顛倒過來呢？」蘇軾說：「還是一樣。」佛印接著問：「那麼把『魚』拿到『草』字頭上呢？」蘇軾急忙說：「那可不行呀！」佛印說：「對呀，魚是不能放在上頭的，快拿下來吧！」語畢，兩人相視一笑，進到書房繼續聊天下棋去了。\n\
    \                                （改寫自網路文章）"
