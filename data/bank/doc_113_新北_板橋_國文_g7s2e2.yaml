- id: doc_113_新北_板橋_國文_g7s2e2_s2_35
  section: 2
  number: 35
  type: single
  page: 7
  stem: 關於上述描寫的楊枝甘露，下列何者正確？
  options:
  - label: A
    content: 楊枝甘露包括芒果、柚子和西米露，滋味上，甜味多過酸味
  - label: B
    content: 基本成分是果粒、果汁、椰奶和西米，少一項即非楊枝甘露
  - label: C
    content: 是蔡珠兒酷愛的港式甜點，但是每次做出來的成品參差甚大
  - label: D
    content: 作者認為上品可謂凝露瓊漿；下品稀疏空蕩，令人氣結神傷
  group_stem: "（三）\n楊枝甘露就是芒果柚子西米露，取名雅緻，形色黃艷，滋味酸甜相間，清馨柔美，是我酷愛的港式甜點，茶樓酒家和糖水店處處有之，但每家做出來都不一樣，高下參差甚大。上者香腴清甘，舒喉潤胃，有如凝露瓊漿；下者稀疏空蕩，果味瘠苦西米沉浮，最掃興的是柚肉削枯如柴枝，食之塞牙滯口，令人氣結神傷。\n\
    氣不過，乾脆自己動手做，楊枝甘露毋需攪打焗烤，原料和做法都不難，關鍵在於選果和調拌，前者要精，後者要勻。\n芒果要撿香甜厚肉的品種，如呂宋香芒、泰國水仙芒或臺灣的金煌，不宜用肉薄多渣的土檨和腰芒，柚子則非靚麗的西施柚不可，沙田柚嫌粗，葡萄柚嫌細碎。\n\
    基本成分是果粒、果汁、椰奶和西米。把柚肉剝散，芒果肉切成細粒，一半打成芒果汁，一半和柚肉做果粒。煮開椰汁，以砂糖調味後放冷。然後煮西谷米，水沸後才下米，大火滾十分鐘，見米心白點如針頭，即收火加蓋，燜至透明，取出以冰水沖洗，使其剔透清，不易軟爛。\n\
    最後以等量比例，把各物摻混拌勻，調出澄黃酸香的羹漿，倒入水晶碗或高腳玻璃杯，放入冰箱冷藏一陣，即成芬馥沁人的美點。此物的製法配方並無定本，有人加楊桃粒，以符楊枝美名；有人加椰果，以增彈牙嚼勁；有人加淡奶、鮮奶油甚至米漿調拌，以使汁底棉柔豐潤。\n\
    \                                 （節錄自蔡珠兒楊枝甘露）"
