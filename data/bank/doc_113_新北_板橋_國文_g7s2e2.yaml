  group_stem: "（三）\n楊枝甘露就是芒果柚子西米露，取名雅緻，形色黃艷，滋味酸甜相間，清馨柔美，是我酷愛的港式甜點，茶樓酒家和糖水店處處有之，但每家做出來都不一樣，高下參差甚大。上者香腴清甘，舒喉潤胃，有如凝露瓊漿；下者稀疏空蕩，果味瘠苦西米沉浮，最掃興的是柚肉削枯如柴枝，食之塞牙滯口，令人氣結神傷。\n\
