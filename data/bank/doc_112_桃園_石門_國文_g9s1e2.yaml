  group_stem: '(一)齊人有好詬食者，每食必詬其僕，至壞器投匕箸，無空日。館人厭之，忍弗言，將行，贈之以狗，曰：「是能逐禽，不腆以贈子。」行二十里而食，食而召狗與之食。狗嗥而後食，且食而且嗥。主人詬於上，而狗嗥於下，每食必如之。一日，其僕失笑，然後覺。郁離子曰：「夫人必自侮，而後人侮之。」又曰：「飲食之人，則人賤之。」斯人之謂矣。                        (劉基
