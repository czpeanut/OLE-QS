- id: doc_112_桃園_石門_國文_g9s1e2_s7_18
  section: 7
  number: 18
  type: single
  page: 2
  stem: 「有時十幾盞漁火赫然，浮現在闃黑的海面，排成一彎弧形，把漁網愈收愈小，圍成一叢燦燦的金蓮。」使用的修辭同於下列何句？
  options:
  - label: A
    content: 書齋外面是陽台，陽台外面是海，是山
  - label: B
    content: 海圍著山，山圍著我
  - label: C
    content: 山谷是一個愛音樂的村女，最喜歡學舌擬聲
  - label: D
    content: 到了夜深，所有的山影黑沉沉都睡去
  group_stem: "(二)書齋外面是陽台，陽台外面是海，是山，海是碧湛湛的一彎，山是青鬱郁的連環。山外有山，最遠的翠微淡成一裊青煙，忽焉似有，再顧若無，那便是，大陸的莽莽蒼蒼了。\n\
    海天相對，中間是山，即使是秋晴的日子，透明的藍光里，也還有一層輕輕的海氣，疑幻疑真，像開著一面玄奧的迷鏡，照鏡的不是人，是神。海與山綢繆在一起，分不出，是海侵入了山間，還是山誘俘了海水，只見海把山圍成了一角角的半島，山呢，把海圍成了一汪汪的海灣。\n\
    山色如環，困不住浩淼的南海，畢竟在東北方缺了一口，放檣桅出去，風帆進來。起風的日子，海吹成了千畝藍田，無數的百合此開彼落。到了夜深，所有的山影黑沉沉都睡去，遠遠近近，零零落落的燈全睡去，只留下一陣陣的潮聲起伏，永恆的鼾息，撼人的節奏撼我的心血來潮。有時十幾盞漁火赫然，浮現在闃黑的海面，排成一彎弧形，把漁網愈收愈小，圍成一叢燦燦的金蓮。\n\
    \ 海圍著山，山圍著我。沙田山居，峰迴路轉，我的朝朝暮暮，日起日落，月望月朔，全在此中度過，我成了山人。問余何事棲碧山，笑而不答，山已經代我答了。其實山並未回答，是鳥代山答了，是蟲，是松風代山答了。山是禪機深藏的高僧，輕易不開口的。人在樓上倚欄杆，山列坐在四面如十八尊羅漢疊羅漢，相看兩不厭。山谷是一個愛音樂的村女，最喜歡學舌擬聲，可惜太害羞，技巧不高明。無論是雞鳴犬吠，或是火車在谷口揚笛路過，她都要學叫一聲，落後半拍，應人的尾聲。\n\
    從我的樓上望出去，馬鞍山奇拔而峭峻，屏於東方，使朝暾姍姍其來遲。鹿山巍然而逼近，魁梧的肩膂遮去了半壁西天，催黃昏早半小時來臨，一個分神，夕陽便落進他的僧袖裡去了。白天還如佛如僧，藹然可親，這時竟收起法相，龐然而踞，黑毛茸蒙如一尊暗中伺人的怪獸，隱然，有一種潛伏的不安。\
    \ (余光中 <沙田山居>)"
