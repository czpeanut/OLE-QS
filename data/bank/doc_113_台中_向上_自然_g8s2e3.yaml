- id: doc_113_台中_向上_自然_g8s2e3_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: '外帶咖啡的塑膠杯蓋會釋出致癌物質嗎？下列為網路上大家關心的一則問與答，關於文中所提及的 PS 或 PP 的敘述，何者正確？


    問：外帶咖啡的塑膠杯蓋會釋出致癌物質，是真的嗎？

    答：過去咖啡杯蓋的材質多為聚苯乙烯（簡稱 PS），由苯乙烯（$C_{8}H_{8}$）聚合而成，相關單位已對此材質訂出使用規範，確保安全。為免疑慮，市面咖啡杯蓋材質已逐漸改成聚丙烯（簡稱
    PP），由丙烯（$C_{3}H_{6}$）聚合而成。PS 和 PP 都屬於熱塑性聚合物，只要符合規定，消費者正常使用，尚無安全疑慮。'
  options:
  - label: A
    content: 兩者都屬於耐高溫的網狀聚合物
  - label: B
    content: PP 是由碳水化合物聚合而成
  - label: C
    content: PS 是由數千個以上的原子所組成
  - label: D
    content: 兩者都無安全疑慮，毋須回收。
  uncertain_spans:
  - 內容與原卷文字層不符（吻合 83%）
