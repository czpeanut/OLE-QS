  page: 2
  stem: '如附圖所示，將兩個磁鐵置入玻璃管中，磁鐵甲與玻璃管底部接觸，磁鐵乙靜止漂浮在空中，但不與磁鐵甲接觸。以下是小明和小美對此情形可能原因的推論：

