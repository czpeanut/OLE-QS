  section: 1
  number: 1
  type: single
  page: 1
  stem: 關於糖粉和食鹽的乾餾情形，下列何者錯誤？
  options:
  - label: A
    content: 為了隔絕空氣加熱，必須將糖粉或食鹽完全包覆密閉
  - label: B
    content: 乾餾食鹽後，殘留的固體不可燃燒
  - label: C
    content: 乾餾糖粉所產生的氣體中，含有可以燃燒的物質
  - label: D
    content: 乾餾糖粉後，殘留的固體可以燃燒。
