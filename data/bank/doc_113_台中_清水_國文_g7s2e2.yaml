- id: doc_113_台中_清水_國文_g7s2e2_s2_29
  section: 2
  number: 29
  type: single
  page: 3
  stem: 此文節選自小說《長安的荔枝》，下列敘述哪一選項最符合小說想表達的意思？
  options:
  - label: A
    content: 杜甫認為聖人英明，政策失當皆是小人作祟
  - label: B
    content: 李善德透過羯鼓傳花，才博得聖人賞識任命
  - label: C
    content: 韓洄指出官員推諉，是因為無人敢違逆聖命
  - label: D
    content: 李善德為錯過買新宅桂花而深感遺憾落淚。
  group_stem: '三人舉起酒爵，一飲而盡。這桂酒是用桂花與米酒合釀而成的香酒，香氣濃郁，李善德一入口，想到自己活不到八月，連新宅中那棵桂樹開花也看不到，不由悲從中來，放下酒爵，淚水滾滾。


    韓洄與杜甫都嚇了一跳，忙問怎麼回事。李善德沒什麼顧忌，便把敕牒（古代君王任命官吏的文書。）取出來，如實講了。兩人聽完，楞在原地。半晌，杜甫忍不住道：「竟有此等荒唐事！嶺南路遠，荔枝易變，此皆人力所不能改，難道沒人說給聖人知嗎？」


    韓洄笑道：「聖人口含天憲，他定了什麼，誰敢勸個『不』字？你們可還記得安祿山？多少人說這胡人有叛心，聖人可好，直接把勸諫的人綁了送去河東。所以荔枝這事，那些衙署寧可往下推，也沒一個敢請聖人撤回成命。」


    「聖是不世出的英主，可惜……智足以拒諫，言足以飾非。」杜甫感慨。


    「皇帝詔令無可取消，那麼最好尋一隻代罪羔羊，把這樁差遣接了，做不成死了，才天下太平。良元兄可玩過羯鼓傳花？你就是鼓聲停止時手裡握花的那個人。」


    韓洄說得坦率而犀利。他和其他兩人不同，身為比部司的主事，日常工作是審查諸部的賬目，對官場看得最為透澈。

    馬伯庸《長安的荔枝》'
