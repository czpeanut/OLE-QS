- id: doc_113_台中_清水_國文_g7s2e2_s2_27
  section: 2
  number: 27
  type: single
  page: 3
  stem: 根據圖表與文章內容，下列敘述何者最正確？（原卷有誤，已修正）
  options:
  - label: A
    content: 洗面乳和牙膏是塑膠微粒主要來源之一，占比超過二成
  - label: B
    content: 合成衣物洗滌產生的微粒，高於輪胎磨損與塑膠包裝的合計
  - label: C
    content: 水中的塑膠微粒一旦被生物誤食，會馬上產生致命傷害
  - label: D
    content: 塑膠微粒會從水源和食物鏈中，影響生物的內分泌系統。
  group_stem: '塑膠微粒：看不見的海洋威脅


    你是否曾注意過，洗臉乳、牙膏或是衣服洗滌時產生的泡泡，竟可能成為海洋污染的元兇？這些我們日常使用的產品，釋放出肉眼難以察覺的「塑膠微粒」，正悄悄進入我們的水源與食物鏈中，對環境與人體健康造成潛在危害。


    這些微粒不僅在製造和使用階段釋出，最終也經由排水系統流入河川與海洋。由於體積極小，傳統污水處理設備難以完全過濾，使得塑膠微粒在水體中長期累積，進一步被魚類、貝類等水中生物誤食，再透過食物鏈傳遞回人類體內。一些研究更指出，塑膠微粒可能攜帶有害化學物質，對生物內分泌系統產生影響，甚至進一步引發慢性疾病。


    為了減緩這場「看不見的災難」，我們可以從個人生活與制度面同時著手。首先，選購標示「不含塑膠微粒」的清潔產品，並減少使用含有合成纖維的衣物，是每個人都能做到的選擇。此外，政府可加強立法，要求廠商標示成分、限制使用微粒原料，並投資開發能有效過濾微粒的污水處理技術。


    看似微小的選擇，其實正是環境改變的起點。當我們對日常用品背後的隱藏代價有更深認識，也就更有力量改變我們與自然的互動方式。'
