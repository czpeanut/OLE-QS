- id: doc_112_高雄_林園_自然_g9s2e1_s1_42
  section: 1
  number: 42
  type: single
  page: 5
  stem: 有關電價常識的敘述何者正確?
  options:
  - label: A
    content: 電力公司裝設電錶計算用戶用電量，電錶的單位為kW(千瓦)
  - label: B
    content: 電力公司每月都抄表一次
  - label: C
    content: 每度電的電費因夏月與非夏月而不同，夏月電費高於非夏月電費
  - label: D
    content: 一般住家5 月分的電價應以夏月電費計價。
  group_stem: '★電價小常識(根據下述文章，回答第42 題-第44 題)

    一、台灣夏月氣溫偏高，冷氣空調用電大幅增加，為了供應夏月期間大幅增加的用電需求，台電必頇啟動發電成本較高的機組，導致供電成本上升。為了公平合理反映夏月、非夏月期間供電成本的差異，促使民眾節約用電，自78
    年2 月起實施季節電價。住宅及小商店每年6 月～9 月為夏月電價實施期間，高壓用戶夏月電價期間則為5/16~10/15，夏月過後則恢復按照較低之非夏月電價計費。

    二、由於住宅及小商店用戶數量龐大，為了減少打擾用戶次數，配合政府推行節能減碳減少紙本帳單之郵寄作業，本台電自74 年7 月起，對一般住宅及小商店用戶實施隔月抄表收費制度，即每2
    個月抄表收費1 次。

    三、電價的計算是採用累進的方式，也就是每一階層有固定的用電收費，超過這個階層用電額度的部分則要用下一階層的用電收費來計算。

    例如:某家庭用戶夏月某期電費帳單中用電量為520 度，電費收費計算:1.63x240+2.38x(520-240)=1057.6(元)。

    四、下表(一)為2023.04 起住宅電價表，來源:台灣電力公司官網。

    | 度數(kWh) | 非夏月電價(元/度) | 夏月電價(元/度) |

    | --- | --- | --- |

    | 240 度以下的部分 | 1.63 | 1.63 |

    | 241-660 度的部分 | 2.1 | 2.38 |

    | 661-1000 度的部分 | 2.89 | 3.52 |

    | 1001-1400 度的部分 | 3.94 | 4.80 |

    | 1401-2000 度的部分 | 4.06 | 5.83 |

    表(一)'
  answer:
  - C
