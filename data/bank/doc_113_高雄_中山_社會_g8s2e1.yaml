  stem: 2019 年，中國國家領導人習近平在五四運動百周年的公開談話中稱其為「偉大愛國主義革命運動」，呼籲青年擁抱「五四精神」、熱愛偉大祖國，卻絕口不提「德先生」、「賽先生」。然而，民初新文化運動舵手之一的陳獨秀先生卻認為「唯有這兩位先生，才能拯救當時的中國於政治、道德、學術、和智識上的黑暗。」請問：上述的「德先生」、「賽先生」指的是下列何者？
