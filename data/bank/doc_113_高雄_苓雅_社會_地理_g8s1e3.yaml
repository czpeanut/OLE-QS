  stem: 雷達圖是一種統計圖表，用於呈現不同項目數值大小的資料。每種項目都擁有自己的數值坐標軸，圖表中心代表最小值，而邊緣代表最大值。北海道居民由於土地面積較大，房屋住宅租金的消費指數最低；另一方面，因冬季嚴寒供暖需求高，電費、瓦斯費的消費指數最高。請問下列四個地區的消費指數雷達圖，何者會是北海道?
