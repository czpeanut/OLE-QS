- id: doc_113_新北_福和_自然_g8s2e2_s1_32
  section: 1
  number: 32
  type: single
  page: 3
  stem: 在蘋果催熟香蕉的實驗中，請問有關乙烯扮演的角色，下列敘述何者正確？
  options:
  - label: A
    content: 在蘋果中扮演生成物，在香蕉中扮演催化劑
  - label: B
    content: 在蘋果中扮演反應物，在香蕉中扮演催化劑
  - label: C
    content: 在蘋果中扮演生成物，在香蕉中扮演生成物
  - label: D
    content: 在蘋果中扮演反應物，在香蕉中扮演生成物
  group_stem: "蘋果在成熟過程中會釋放一種名為乙烯（ethylene）的氣體。乙烯是一種植物天然產生的氣體賀爾蒙，能啟動水果成熟過程中的一連串變化，如澱粉轉糖、果皮變黃、果肉變軟等，這些變化主要透過酵素反應進行。\n\
    \    科學家發現，乙烯能參與並觸發水果中一連串的酵素反應，但乙烯本身在反應前後的總量與化學性質大致不變，因此可被視為具有「催化」水果成熟功能的氣體分子。\n\
    \    為了觀察乙烯對水果成熟的影響，小芸設計了用蘋果催熟香蕉的實驗。她將幾根未成熟的香蕉平均分成三組，分別放入紙袋中密封兩天，其中紙袋材質、置放位置、室內溫度皆相同，其實驗結果如右上表。\n\
    \n| 組別 | 紙袋內容 | 兩天後觀察結果 |\n| --- | --- | --- |\n| 甲 | 未成熟的香蕉 + 兩顆成熟的蘋果 | 香蕉明顯變黃，質地變軟\
    \ |\n| 乙 | 未成熟的香蕉 + 兩顆未成熟的蘋果 | 香蕉略黃、略軟 |\n| 丙 | 未成熟的香蕉 | 香蕉幾乎無變化 |"
