  - label: C
    content: 反應時間愈長，代表反應速率愈快，反應時間的倒數和反應速率的趨勢相同
  - label: D
    content: 反應時間愈長，代表反應速率愈慢，反應時間的倒數和反應速率的趨勢相同
  group_stem: '小蓉設計一個能觀察「化學反應快慢」的實驗。選擇 A 溶液（含定量的碘酸鉀）、B 溶液（含定量的亞硫酸氫鈉與少量的螢光劑），並設計實驗如下：

    (1)開啟光度計，偵測 B 溶液的螢光亮度。

    (2)將 A 溶液倒入 B 溶液時同時按下碼表。

    (3)當光度計顯示無螢光時，紀錄碼表時間。

    (4)以不同溫度重複步驟(1)至(3)。

    (5)將所有數據整理如右列表格中。

