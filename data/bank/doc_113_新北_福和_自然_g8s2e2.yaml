- id: doc_113_新北_福和_自然_g8s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '實驗桌上有五杯透明的水溶液，依序以甲、乙、丙、丁、戊標示之。各溶液的成分標示已模糊不清，只知這五杯溶液有食鹽水、鹽酸、硫酸、氨水和氫氧化鈣。小臻的觀察與實驗記錄如右表。請根據表中觀察紀錄的結果，判斷甲、乙、丙、丁、戊依序為何種水溶液？


    | 一、搧聞五杯水溶液，只有丙有刺激性臭味 |

    | 二、用紅色石蕊試紙檢驗，只有乙和丙變色 |

    | 三、將鎂帶放入水溶液中，只有甲和丁有氣泡產生 |

    | 四、將水溶液滴到紙上烘乾後，只有甲會使紙張變黑色 |'
  options:
  - label: A
    content: 硫酸、氫氧化鈣、氨水、鹽酸、食鹽水
  - label: B
    content: 硫酸、氨水、氫氧化鈣、食鹽水、鹽酸
  - label: C
    content: 鹽酸、氨水、氫氧化鈣、食鹽水、硫酸
  - label: D
    content: 鹽酸、硫酸、氫氧化鈣、食鹽水、氨水
