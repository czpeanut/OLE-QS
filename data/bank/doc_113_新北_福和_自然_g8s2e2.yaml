- id: doc_113_新北_福和_自然_g8s2e2_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 小婷因為牙痛去看牙醫，醫生診斷是蛀牙造成的牙痛，因此建議小婷三餐飯後要刷牙、漱口。因為進食後口腔呈酸性，酸性會破壞口腔健康，所以刷牙時可用牙膏來中和酸鹼性並達到清潔與消臭的目的，請問下列何種物質的酸鹼性質與牙膏相同？
  options:
  - label: A
    content: $CH_{3}COOH$
  - label: B
    content: $C_{2}H_{5}OH$
  - label: C
    content: $Na_{2}CO_{3}$
  - label: D
    content: NaCl
- id: doc_113_新北_福和_自然_g8s2e2_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 關於鹽類的敘述，何者錯誤？
  options:
  - label: A
    content: 硫酸鈣是白色固體，不易溶於水，為製作石膏像的原料之一
  - label: B
    content: 碳酸鈣是貝殼的主要成分，俗稱石灰
  - label: C
    content: 碳酸鈉是白色固體，可作為清潔劑，故稱為洗滌鹼
  - label: D
    content: 氯化鈉是透明晶體，俗稱食鹽，可從酸鹼中和反應產生
