  section: 1
  number: 21
  type: single
  page: 2
  stem: 使用質量與顆粒大小皆相同的大理石（$CaCO_{3}$）粉末及體積相同、濃度不同的鹽酸，記錄其混合後大理石完全反應的時間，其反應結果如右圖所示。根據以上敘述及實驗結果，下列推論何者正確？
