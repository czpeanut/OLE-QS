  stem: 根據本文內容，下列哪一項對「礦化」的理解最正確？
  options:
  - label: A
    content: 礦化是將無機物變成有機物，以便儲存能量
  - label: B
    content: 礦化是微生物把有機物質分解為可被植物吸收的無機營養鹽
  - label: C
    content: 礦化是將植物分解為水與氧氣的物理過程
  - label: D
    content: 礦化會消耗大量二氧化碳，因此可減緩地球暖化
  group_stem: "秋冬之際，滿地落葉鋪滿公園與林地表面。你是否想過，如果沒有人打掃，這些落葉最後都去哪了？這些落葉主要由植物的細胞壁構成，富含纖維素、半纖維素、木質素等高分子有機化合物，都是以碳為主的天然有機物質。當它們掉落地面，進入土壤後，並不是靜止不動，而是進入一個生物分解的階段。\n\
    \    土壤中充滿了微生物（如細菌、真菌）與小型生物（如線蟲、蚯蚓），這些生物在生態系中扮演「分解者」的角色。牠們利用自身分泌的酵素，將這些大型有機分子逐步分解為較小的有機分子，最終再轉化為無機物質，例如：二氧化碳、水、硝酸鹽、磷酸鹽與鉀離子等。這個過程稱為礦化（mineralization）。\n\
    \    礦化後所產生的無機營養鹽可由植物再次吸收，進一步參與光合作用與組織建構。這個有機物→無機物→再吸收→有機物的過程，是自然界中養分循環的重要一環，也是土壤維持肥力的關鍵。\n\
    \    換句話說，落葉的消失不是消滅，而是透過自然分解與再利用完成一次生命的轉化。"
