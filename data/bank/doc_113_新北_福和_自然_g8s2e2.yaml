- id: doc_113_新北_福和_自然_g8s2e2_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 阿政將相同濃度的鹽酸與等質量的大理石（顆粒大小相同）分別放入甲、乙兩容器中，甲容器為密閉容器，反應 5 分鐘後沒有氣泡冒出；乙容器為開放容器，10
    分鐘後沒有氣泡冒出，其反應式為：$CaCO_{3}$ + 2HCl ⇌ $CaCl_{2}$ + $CO_{2}$ + $H_{2}O$，請問下列敘述何者正確？
  options:
  - label: A
    content: 甲容器沒有氣泡冒出，是因其中有一項反應物用盡
  - label: B
    content: 若將甲容器打開時，則正反應速率大於逆反應速率
  - label: C
    content: 乙容器沒有氣泡冒出，是因正反應速率小於逆反應速率
  - label: D
    content: 此反應為可逆反應，無論是否開放或密閉容器，任何時間正逆反應速率皆相等
- id: doc_113_新北_福和_自然_g8s2e2_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: '小蓓想測試牛肉熟的快慢與牛肉切的大小是否stal有關。她準備了兩塊大小、厚度、質量皆相同的牛排，設計了以下實驗：

    甲組：將牛肉切成正方形丁狀（2cm×2cm）

    乙組：整塊牛肉（8cm×8cm）

    將兩組牛肉放在規格相同且火源大小相同的烤箱裡烘烤，數分鐘後，發現：甲組幾乎全熟，而乙組外層熟、內部仍生。小蓓想將這一發現與課堂學到的科學概念做連結，請問下列哪一項最能合理解釋這現象？'
  options:
  - label: A
    content: 切成正方形丁狀的牛肉總表面積較大，熱容易傳導至內部，使牛肉較快熟
  - label: B
    content: 切成正方形丁狀的牛肉總表面積較小，熱容易傳導至內部，使牛肉較快熟
  - label: C
