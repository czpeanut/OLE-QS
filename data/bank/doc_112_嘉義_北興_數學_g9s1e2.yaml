- id: doc_112_嘉義_北興_數學_g9s1e2_s2_2
  section: 2
  number: 2
  type: calc
  page: 3
  stem: '根據內政部營建署建築物無障礙設施設計規範，像是坡道、樓梯、廁所等常見的建築物設施，都有其設計規範，以提供更便利與友善的無障礙空間讓有需要的人使用。

    例如：當門檻的高低差超過3 公分，應需另外增設坡道，其規範坡道之坡度如下：


    坡度＝$\frac{\text{高度差}}{\text{水平長度}}


    | 高度差 (公分) | 坡度 |

    | --- | --- |

    | 0～3 | $\frac{1}{2}$ |

    | 3～5 | $\frac{1}{5}$ |

    | 5～20 | $\frac{1}{10}$ |

    | 20 公分以上 | $\frac{1}{12}$ |


