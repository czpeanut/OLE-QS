  group_stem: "（三）\n    瓶中信\n  我猜想，當妳的同學問妳：「妳爸爸在哪裡上班？」妳應該會猶豫而難以回答。\n  討海捕魚並不是見不得人的工作，但我了解，妳心裡並不情願妳的父親從事這樣的工作。\n\
    \  自從我放棄陸地工作，出海捕魚成為討海人以後，我們相處的時間越來越少。記得妳六歲生日前一天晚上，我在海上，整晚漁獲不好，破曉時分，我看了看魚箱子想：「可能還不夠買一個生日蛋糕。」\n\
    \  這時，忽然魚繩一揚，鞭甩著挺直了。\n  一陣拉扯忙碌，沒想到，拉上來的是一條和我身高幾近相等的白腹鰆。\n  那天上岸，我買了一個大蛋糕，也為妳買了幾件衣服。\n\
    \  妳母親長年吃素，非常反對我下海捕魚。漸漸的，妳也跟著吃素，而且，再也不願意陪我到魚市場看魚。甚至，連我的船是哪一艘，我想，妳也沒有興趣知道。\n  有一次，你用幾近責備的口吻對我說：「爸，別再捕魚了，好嗎？」\n\
    \  這句話時常在我心頭縈繞，同時也沉重的感到，我的出航不僅是和陸岸漸漸別離，也將與妳越走越遠。\n  總覺得很難對妳解釋清楚，好長一段日子來的摸索，當我得以沉浸在心底深沉的那一片海，終於能夠感到鬆綁和解脫。人世裡我適應得並不好，常有意無意的在探索另一個世界的存在，海上工作後，海的寬闊與船上單純的人事，讓我感到終於解脫的自在。\n\
    \  希望妳能明白。寫這封信給妳，並不為了向妳解釋為何離不開海洋，而是想與妳訴說，我的海洋世界不僅事實存在，而且豐美。\n  後來，妳和妳母親搬去臺北，從此再也沒機會聽到妳反對我出海捕魚的話。\n\
    \  那段時間，我們很久才能見一次面。每次見面，當陌生感漸漸消失，我都會試著與妳講一些這陣子經歷的海上故事。有時，也會試著念一篇我新寫成的海上文章給妳聽。\n\
    \  總是一點點解釋，更多是訴說，我想讓妳知道，海洋再怎麼被認為冷漠無情，但這些濤浪如何翻湧我心裡的溫情。\n  當我發現，對妳描述這些海上風景、海上故事時，妳臉上的表情有了好奇和歡喜，有次當我念到，因為甲板工作犯了錯而被船長責罵，妳憤憤不平的為我抱屈。當我描述船長如何禮遇另一位船員時，妳問我：「船長也這麼對你嗎？」當我念一段風平浪靜時，海洋如何溫柔的對待船隻，這時，妳的微笑就像水面溫柔的漣漪。\n\
    \  我心裡有著衝動，想開口邀妳到海上走一趟。但念頭一轉，明白這絕無可能，所以始終不曾對妳提出。\n  邀妳出海一趟這個念頭一直在我心裡好長一段日子。\n\
    \  後來我不再捕魚，轉而從事海上鯨豚觀察，直到這時，我才敢開口邀妳。\n  妳仍然拒絕。\n  我曉得，怕暈船或恐怕晒傷的顧慮只是藉口。當我進一步追問，妳難得悍然的語調回答我說：「爸，不要勉強我。」\n\
    \  我送給妳每一本我寫的書，妳的年紀，我想，應該還無法從字裡行間中理解我為何離開陸地、擁抱海洋的許多原因。妳應該還無法明白，如何我在海上尋獲生命恰當位置的意涵。但我相信，這些書終有一天會告訴妳這些，也許妳會在書裡的波濤間明白，這段時間我對妳的思念、對妳的愛。\n\
    \  當我知道，送給妳的每一本新書，妳都會裝在書包裡帶進帶出一段時間，也聽說，妳在下課時把我的書拿在桌上看。知道嗎，聽到這些，我是多麼的高興，妳已經用另一種形式，接受了我心底那一片海，妳應該已經能回應妳的同學──我爸爸的辦公室在太平洋。\n\
    \  然而，每次船隻回港，轉入港堤後，遙遠碼頭上總有些等待船隻回港的漁人家屬。看到漁人家屬翹首殷殷盼望的神情，心裡多麼期望，有一天，當我的船隻返航時，意外發現妳也在碼頭邊等我回來。\n\
    \  返航船隻逆著北風顛簸搖晃，寫給妳的信字跡潦草，妳應該難以看懂我寫了什麼，但願妳能理解，這封信不是想對妳解釋什麼，只是表達當下我在舷邊的一些心情。\n\
    \  船首撞浪，煙靄瀰漫，混沌裡遠山愈是朦朧。船上找不到信封來寫下妳的地址，只好，找來一只玻璃瓶，將這封信裝入瓶子裡，投到舷邊這世界上最大的郵筒裡。\n \
    \ 讓海浪當我們的信差，也許這封瓶中信，有一天能漂進妳的心裡。\n節選自廖鴻基《海天浮沉》"
