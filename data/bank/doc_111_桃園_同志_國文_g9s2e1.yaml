- id: doc_111_桃園_同志_國文_g9s2e1_s2_33
  section: 2
  number: 33
  type: single
  page: 4
  stem: 「司馬懿：三國時魏將，文武兼資，官拜大督都，因其深沉奸詐，復因事魏，遂成反面人物。」據上所述，若欲將司馬懿搬上京劇舞台，其臉譜應以什麼顏色為主？
  options:
  - label: A
    content: 白色
  - label: B
    content: 紅色
  - label: C
    content: 黑色
  - label: D
    content: 青色
  group_stem: "（二）\n（甲）    京劇中的生旦淨末丑\n京劇又稱平劇或國劇，是傳統的戲劇表演。京劇中的角色有生、旦、淨、末、丑等，表演的方式則有念(念白)做(身段)、唱(唱腔)、打(武打)等幾種。\n\
    \  「生」是戲中的男角，有鬚生、小生和武生等。鬚生扮演的是中年以上男子，要戴髯口(假鬍鬚)，重在唱功；小生是青年男子，唱腔以小嗓(假聲)為主；武生則以表演武打為主，不重唱功。\n\
    \  「旦」為戲中的女角，主要有老旦、正旦、花旦和刀馬旦等。老旦扮演的是年老的婦女；正旦是年輕端莊的女性，戲服多為青色或黑色，所以稱「青衣」；花旦是身分地位比較低下的年輕女性；刀馬旦則是武功高强的女性，又稱「武旦」。京劇的旦角常由男生來扮演，那是清代禁止女性從事歌舞演藝的缘故。這些由男性扮演的旦角，身段的細膩、唱腔的優美，比女人更像女人，許多戲迷都為之瘋狂傾倒，清末民初的梅蘭芳就是大家熟知的京劇名旦。但隨著時代的演變，越來越少男生扮演旦角，反而有些女生可以反串老生。\n\
    \  「淨」是勾臉譜的男角，因此又稱為「花臉」。京劇的臉譜代表人物的性格，使用的顏色各有用意：紅色代表勇敢耿直，黑色代表租獷但心地善良，白色代表有心機的人，不同的人物畫上不同的臉譜，讓觀眾能一目了然。\n\
    \  「末」在傳統戲劇上扮演的是男性的配角，大多和「生」合併，成為鬚生一類的角色。「丑」通常是插科打諢①的角色，其口語化的念白與滑稽的動作，使觀眾容易聽懂，以引發笑果。\n\
    \  「台上一分鐘，臺下十年功」，不管是生、旦、淨、末、丑哪一個角色，要扮演得成功，都要不斷地琢磨，下工夫苦練，才能得到觀眾的掌聲。\n＠注釋:\n① 插科打諢:戲劇表演時，以滑稽的動作或言語引人發笑\n\
    \n（乙）    刀馬旦\n\n作詞：方文山\n作曲：周杰倫\n\n明明早上人還在香港 還在九龍茶館喝褒湯\n怎麼場景一下跳西安 我在護城河的堤岸\n站在古老神秘的城牆\
    \ 月光搖又晃～\n我用英語跟小販交談 突然畫面一下就全暗\n\n我 還在想 到底身在何方\n我 變模樣 是個華裔姑娘\n我 開始想 認真細心裝扮\n我 回台上\
    \ 終於輪我上場\n\n耍花槍 一個後空翻 腰身跟著轉 馬步紮的穩當\n耍花槍 比誰都漂亮 接著唱一段 虞姬和霸王\n耍花槍 舞台的戲班 二胡拉的響 觀眾用力鼓掌\n\
    耍花槍 比誰都漂亮 刀馬旦身段 演出風靡全場"
