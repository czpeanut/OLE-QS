  group_stem: "（一）\n  先兄晴湖言，有王震升者，暮年喪愛子，痛不欲生。一夜，偶過其墓，徘徊悽戀不能去。忽見其子獨坐隴頭，急趨就之，鬼亦不避。然欲握其手，輒引退；與之語，神意索漠，似不欲聞。怪問其故，鬼哂曰：「父子宿緣也。緣盡則爾為爾，我為我矣，何必更相問訊哉？」掉頭竟去。震升自此痛念頓消。\n\
    \  客或曰：「使西河１能知此義，當不喪明。」先兄曰：「此孝子至情，作此變幻，以絕其父之悲思，如郗超２密札之意耳。非正理也。使人存此見，父子兄弟夫婦，均視如萍水之相逢，不日趨於薄哉！」\n\
    \       （紀昀《閱微草堂筆記》）\n註：１、西河：指子夏。子夏喪其子，哭而失明。\n  ２、郗超密札：郗超與桓溫結黨，因為父親忠於晉室，所以不敢讓父親知道。臨終前，將一箱密謀書信交給門生保管，囑咐道：「公年尊，我死以後，若以哀惋害寢食者，可呈此箱；不爾，即焚之。」後來郗愔果然悲痛欲絕，門生呈上書信，郗愔見兒子為桓溫出謀劃策，圖謀東晉江山，大怒道：「小子死已晚矣！」從此不再悲傷。"
