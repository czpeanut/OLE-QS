  group_stem: '謝公始有東山之志，後嚴命屢臻（1），勢不獲已（2），始就桓公司馬。 於時人有餉桓公藥草，中有遠志（3）。 公取以問謝：「此藥又名『小草』，何一物而有二稱？
    」謝未即答。 時郝隆在坐，應聲答曰：「此甚易解：處則為遠志，出則為小草。」謝甚有愧色。桓公目謝而笑曰：「郝參軍此過（4）乃不惡，亦極有會。」

    ----（《世說新語-排調第二十四》

    註釋

    （1）臻：到，至。

    （2）勢不獲已：迫不得已。

    （3）遠志：草名，根入藥可除邪氣，益神明。 其葉名小草。

    （4）此過：這個小過失。 一說當作“此通”，即這番議論。'
