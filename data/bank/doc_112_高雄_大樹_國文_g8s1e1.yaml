- id: doc_112_高雄_大樹_國文_g8s1e1_s3_1
  section: 3
  number: 1
  type: single
  page: 1
  stem: 關於〈風箏〉一詩的分析，下列敘述何者錯誤？
  options:
  - label: A
    content: 「扶搖直上」省略了主語「風箏」，而「風箏」則象徵人類的希望
  - label: B
    content: 「細細一線，卻想與整座天空拔河」表現出昂揚的志氣及積極的生命態度
  - label: C
    content: 「拉著天空奔跑」隱含有「人定勝天」的道理
  - label: D
    content: 詩中表現出與世無爭、隨遇而安的人生態度。
  lesson_raw:
    title: 風箏
    basis: 題目引述〈風箏〉詩句並指明課名
