- id: doc_112_高雄_大樹_國文_g8s1e1_s3_4
  section: 3
  number: 4
  type: single
  page: 1
  stem: 在現代詩中，我們常看到作者借助所描述的具體事物，來寄寓抽象的概念，此即「象徵」手法的呈現。根據商禽〈眉〉一詩:「只有翅翼/而無身軀的鳥/在哭和笑之間，不斷飛翔」，何者說明正確?
  options:
  - label: A
    content: 「哭和笑」」――象徵天氣的好壞
  - label: B
    content: 「只有翅翼/而無身軀的鳥」――象徵形體雖死，然精神永存信
  - label: C
    content: 「不斷飛翔」――象徵忙碌的生活
  - label: D
    content: 「在哭和笑之間/不斷飛翔」─―象徵人的一生是由喜、怒、哀、樂等情感連綴而成。
  tags:
    textbook: 八上 第一課 小詩選(一)跳水(二)風箏
    labeled_by: ai
    chapter:
      publisher: 康軒
      book: 八上
      subject: 國文
      code: 第一課
      title: 小詩選(一)跳水(二)風箏
      chapter: null
- id: doc_112_高雄_大樹_國文_g8s1e1_s3_5
  section: 3
  number: 5
  type: single
  page: 1
  stem: 關於〈跳水〉和〈風箏〉的比較，下列敘述何者正確？
  options:
  - label: A
    content: 前者藉由俯視的角度營造空間感，後者則以仰視的角度描繪場景
  - label: B
    content: 前者以積極、熱情的態度追求理想，後者以輕鬆、遊戲的心態面對人生
  - label: C
    content: 兩首詩皆以湛藍的天空象徵目標，並努力去追尋
  - label: D
    content: 兩首詩皆藉由觀眾的反應，傳達對於堅持理想的肯定。
  tags:
    textbook: 八上 第一課 小詩選(一)跳水(二)風箏
    labeled_by: ai
