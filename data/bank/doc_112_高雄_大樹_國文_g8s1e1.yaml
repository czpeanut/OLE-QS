  section: 3
  number: 3
  type: single
  page: 1
  stem: 〈跳水〉一詩中，作者寫作重點著墨於下列哪一個情景？
  options:
  - label: A
    content: 跳水者躍入水面的剎那
  - label: B
    content: 由湛藍到雪白的色彩美
  - label: C
    content: 觀眾對於跳水者的讚嘆
  - label: D
    content: 從容曲線展現的力與美。
