- id: doc_112_高雄_大樹_國文_g8s1e1_s5_1
  section: 5
  number: 1
  type: single
  page: 5
  stem: 「今世之談也，皆道辯說文辭之言，人主覽其文而忘有用。」這句話的含義為何？
  options:
  - label: A
    content: 世人主張坐而言不如起而行，言辭巧妙動聽並無益處
  - label: B
    content: 世人言辭說得巧妙動聽，卻忽略言辭的實際效用
  - label: C
    content: 人臣取悅君王，揣摩上意說出的言論使社會世風日下
  - label: D
    content: 寫作立論須文質兼備，言辭與內容一應俱全，不可偏廢。
  group_stem: "(甲)創意文學選文\n    楚王謂田鳩曰：「墨子者，顯學也。其身體則可，其言多而不辯，何也？」\n  曰：「昔秦伯嫁其女於晉公子，為之飾裝，從衣文之媵七十人。至晉，晉人愛其妾而賤公女。此可謂善嫁妾，而未可謂善嫁女也。楚人有賣其珠於鄭者，為木蘭之櫝，薰以桂椒，綴以珠玉，飾以玫瑰，輯以翡翠。鄭人買其櫝而還其珠。此可謂善賣櫝矣，未可謂善鬻珠也。\n\
    今世之談也，皆道辯說文辭之言，人主覽其文而忘有用。墨子之說，傳先王之道，論聖人之言，以宣告人。若辯其辭，則恐人懷其文，忘其直，以文害用也。此與楚人鬻珠，秦伯嫁女同類，故其言多而不辯。」"
  tags:
    textbook: 第三冊（八上）第1次段考範圍
    labeled_by: ai
