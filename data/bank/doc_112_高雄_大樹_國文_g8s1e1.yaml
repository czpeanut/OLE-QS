- id: doc_112_高雄_大樹_國文_g8s1e1_s3_2
  section: 3
  number: 2
  type: single
  page: 1
  stem: 下列何者與〈風箏〉中「細細一線，卻想與整座天空拔河」的精神態度最為相近？
  options:
  - label: A
    content: 無視師長告誡，偏要和他人作對的阿兩
  - label: B
    content: 無懼險阻，「雖千萬人，吾往矣」的艾連
  - label: C
    content: 不管旁人眼光，將目光聚焦前方的鳴人
  - label: D
    content: 不顧條件限制，按個人需求行事的魯夫。
  lesson_raw:
    title: 風箏
    basis: 題目引述〈風箏〉詩句並指明課名
