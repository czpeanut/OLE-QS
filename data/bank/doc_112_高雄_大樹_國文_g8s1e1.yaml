  group_stem: "(丁)\n    在外婆家，印象最深的是氣味。滿屋子的中藥材，有的是新新草葉，有些是乾草陳藥，有的熬成湯劑，氣味浸漬到我們的髮、肌膚、衣服及食物裡。家裡的飲品常是熱開水裡頭加顆紅棗、黃耆，再綴上十幾顆點狀浮游的枸杞，熱水將藥材泡發得浮胖軟爛。\n\
    \    剛到鄉下時，老人家講著我陌生的臺語，經營藥鋪及農忙的他們沒空陪伴，孤單的我只會哭，外婆只好带著我一起晒藥材。晴天，曬中藥的十幾只扁平圓竹簍在三合院後方空地上一宇排開，相當壯觀。幾次訓練後，晒乾的藥材，我也會幫忙放入店內櫃檯後方如棋盤羅列的木盒櫃。許多藥材我不太認得，外婆也沒有費神解釋，但有幾種藥材經常服用，如枸杞、紅棗、金不換、乾薑，光聞氣味，就能指認。\n\
    \    晒生薑的過程令人印象深刻，常看外公、外婆弓身清洗沾著沙泥的老薑，薑片經長時間曝晒，更加深外形的枯搞乾癟。外婆會讓我有事情做，淡化我想回父母家的心情，要求一起幫忙將木臼中切片的乾薑搗成粉，說薑可以補血驅寒、排除溼氣，但我一點兒都感受不到它的好，入口只覺得辣，難吃極了。\n\
    \    病患上門求診時，外公開好藥方，外婆拿出長年擺在木桌上的鐵鏽秆子謹慎秤藥，口中喃喃念著藥名屬性:「陳皮止嗽化痰……」，然後用大張正方形白紙包綑，最外層再繫以麻繩。若藥材已磨成粉，則用邊長約莫十公分的方形白紙包紮。\n\
    \    多年後我成家，採買坐月子補品，幾次和友人走訪大稻埕藥行，總被櫃檯後方裝藥材的一格格深棕色小木櫃盒吸引，老闆熟練的拖曳抽屜，勾起我對往昔的記憶。\n\
    \    大稻埕蔘藥行販售著相識的紅棗、杜仲、黃耆……我鼻中喚開著熟悉的藥材氣味。眼前店鋪櫃後方雖置有木盒櫃，但已有許多中藥收納在櫃檯左方的透明塑膠罐中，包藥方式也改用機器包製。小時外婆熟練包完藥材後，會拿著小楷毛筆專注在藥包外題上患者姓名，並細心叮囑如何強身健體，病患也會訴說生活瑣事。後來外公、外婆身形漸駝，常喊腰痠，沒法再蹲身清洗曝晒草藥，原本熱鬧的店鋪便日漸式微。外公、外婆往生後，藥鋪便改建成住宅。\n\
    \    眼前的藥行老開親切詢問需要什麼藥材，頓時我竞將眼前和藹的面客與外公、外婆重疊。我置了自家長年用來滋氣活血的紅棗、枸杞、當歸、黃者，唤起心中不曾走味的記憶。\n\
    \                                                                            \
    \                                                              ──林佳樺〈藥鋪之味〉"
