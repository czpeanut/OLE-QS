    content: 歸納全文文意，篇題可訂為「酒的功效」
  - label: B
    content: 杜康偶然間發現後，無師自通而學會製酒
  - label: C
    content: 「酒」字命名的依據：三人的血、酉時製成
  - label: D
    content: 「酒」字的念法，取「九種糧食製成」的九。
  group_stem: "2.請讀完下文後回答問題\n    杜康，夏朝第五位國君。相傳有一年下大雨，雨水流進了糧倉裡，過了幾天，倉底流出了液體。杜康聞著有一種醇香，便喝了一碗，覺得渾身很舒服。\n\
    \    有天晚上夢到天神教他製作這種液體：用水泡一桶糧食，九天後提著桶求三個人的血，每人滴一滴入桶，到酉時便能飲用。杜康照著做，任務完成時，醇香撲鼻。「這麼好的東西，起個什麼名好呢？」他想，滴了三人的血，又是酉時製成，就是「酒」這個字吧。那怎麼念呢？是第九天製成，就念「九」吧！自此，酒便流傳於世了。"
