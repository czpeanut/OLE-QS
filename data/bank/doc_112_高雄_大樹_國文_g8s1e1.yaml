      code: 第一課
      title: 小詩選(一)跳水(二)風箏
      chapter: null
- id: doc_112_高雄_大樹_國文_g8s1e1_s3_6
  section: 3
  number: 6
  type: single
  page: 1
  stem: 關於〈庭中有奇樹〉與〈慈烏夜啼〉二詩的比較，下列說明何者錯誤？
  options:
  - label: A
    content: 前者為漢代的古體詩，作者不詳；後者為唐代的古體詩，作者白居易
  - label: B
    content: 前者因物寄情，透過折花表達思念；後者以物喻人，藉由烏鴉提醒世人
  - label: C
    content: 前者由希望、失望、感傷，表達情感變化；後者融敘事、抒情、議論於一爐，呈現筆法層次
  - label: D
    content: 前者一韻到底；後者有換韻。二者呈現了古體詩的特點：押韻無嚴格的限制。
  tags:
    textbook: 八上 第二課 古體詩選(一)庭中有奇樹(二)慈烏夜啼
    labeled_by: ai
    chapter:
      publisher: 康軒
