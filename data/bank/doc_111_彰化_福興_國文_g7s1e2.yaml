- id: doc_111_彰化_福興_國文_g7s1e2_s4_4
  section: 4
  number: 4
  type: single
  page: 3
  stem: 「蝴蝶一定得在蛹中痛苦的掙扎，一直到牠的翅膀強壯之後，才會破蛹而出。」本句話的含意與下列何者相同？
  options:
  - label: A
    content: 鞠躬盡瘁死而後已
  - label: B
    content: 精誠所至金石為開
  - label: C
    content: 千里之行始於足下
  - label: D
    content: 不經一番寒徹骨，焉得梅花撲鼻香。
  group_stem: '蝴蝶是完全變態類昆蟲，牠們的生活週期必須經歷卵、幼蟲、蛹、成蟲等四個階段，絲毫馬虎不得。

    有個小孩撿到了一個蛹，他要看蛹如何羽化成蝴蝶。過了幾天，蛹上出現了一道裂痕，裡面的蝴蝶似乎被甚麼東西卡住了，掙扎了幾個小時仍出不來。

    小孩於心不忍，拿起剪刀把蛹剪開，幫助蝴蝶脫蛹而出，可是蝴蝶的身體臃腫，翅膀乾癟，根本飛不起來。過了幾個小時，蝴蝶的翅膀仍舊舒展不開，牠注定要拖著乾癟的翅膀爬行一生。

    每一個生命的成長都充滿了神奇與莊嚴，水到渠成；蝴蝶一定得在蛹中痛苦的掙扎，一直到牠的翅膀強壯之後，才會破蛹而出。小孩善意的一剪，反而害了牠的一生。

    (改寫自網路文章)'
