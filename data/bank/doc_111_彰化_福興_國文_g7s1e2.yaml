- id: doc_111_彰化_福興_國文_g7s1e2_s4_1
  section: 4
  number: 1
  type: single
  page: 3
  stem: 作者「心想都這麼努力了，這次分數應該會比較好看吧？」這樣的觀念可能來自於哪句話？
  options:
  - label: A
    content: 吃果子拜樹頭
  - label: B
    content: 舉頭三尺有神明
  - label: C
    content: 勿因惡小而為之
  - label: D
    content: 一分耕耘、一分收穫。
  group_stem: '數學不好其實有個「循序漸進」的歷程，一部曲：上課恍神，後面聽不懂；二部曲：考不好，開始放棄；三部曲：告訴自己「我沒有天分」；四部曲：同學及老師持續強化沒天分這個觀點；五部曲：相信自己永遠也學不好。

    國二開始，我用敷衍的態度對待數學整整三年，直到高二上學期才有了轉變。我開始認真面對，花了三個多小時複習，心想都這麼努力了，這次的分數應該會比較好看吧？結果依然不及格！當我在負面情緒漩渦中翻滾時，老師斥責我：「考不好就算了，態度還那麼差！」大概是我拿考卷時疏忽了禮貌，後來導師把我叫到教室外面，那一刻我竟然眼淚潰堤。也不知道是什麼樣的神奇力量，我竟然沒有放棄。當晚，我把寫錯的題目再算一遍，因為隔天還要考一次。沒想到，我竟然得了高分！老師稱讚我：「很好！從哪裡跌倒，就從哪裡爬起來。」

    有些人對於我從「數學很爛」到「變成數學老師」，感到難以理解。如今回想起來，那個從不及格到不放棄、拿高分的經驗，除了讓我重拾對數學的信心外，或許關鍵就在於開始認真面對數學學習。(曲智鑛
    親子天下)'
