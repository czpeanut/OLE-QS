    \ And he is the strongest and the largest member of the group. He protects the\
    \ females and acts like their “security\nguard”.  When the male dies, the group\
    \ needs a new “security guard”. This is when the largest female fish in the group\
    \ begins\nto change its appearance. She begins to grow larger in size. After a\
    \ week, she starts changing clolor, from yellow to blue.\nSlowly, she begins to\
