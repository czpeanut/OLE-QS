  number: 1
  type: single
  page: 3
  stem: Which is true?
  options:
  - label: A
    content: The writer didn’t believe in Santa Claus when he / she was a child.
  - label: B
    content: Christmas is just about buying the perfect gift.
  - label: C
    content: Most people help at banks during Christmas.
  - label: D
    content: The writer has never felt differently about Christmas.
  group_stem: '(一)

    I haven’t always been a fan of Christmas. When I was a kid, I saw my dad putting
    all the gifts under the tree. I was very

    surprised because I thought a happy old man in a red suit was watching over us.
    After that happened, I knew Santa Claus

    wasn’t real. Also, when I grew up, I found that everyone tried to find a perfect
    gift at stores. The holiday felt like a big excuse

    to go shopping.

    However, when a friend of mine invited me to celebrate Christmas with her last
    year, I started to see things differently. I

    thought we’d just have a meal together and give each other gifts, but I was wrong.
    When the day came, she took me to a food

    bank. We helped sort and deliver bags of food to the people in need. I was scared
    of getting close to them at first, but that

    changed quickly. When I handed them their Christmas dinners, they showed nothing
    but joy, love, and thanks. It was the first

    real meal in a long time for some of them. Because of that experience, I now know
    for sure that Santa Claus is real.

