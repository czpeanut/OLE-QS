  stem: 地形作用力可分為內營力與外營力，高雄田寮的月世界，山勢崎嶇且表土長期經雨水沖蝕而流失，導致寸草不生，有如月球表面般荒涼而得名。下列何者與造成高雄田寮月世界特殊地景的營力類型不同？
