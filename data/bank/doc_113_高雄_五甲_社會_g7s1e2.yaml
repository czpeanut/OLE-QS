- id: doc_113_高雄_五甲_社會_g7s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 臺灣獼猴為臺灣的特有生物，但因近年來族群數量穩定增加，目前已從保育類降級為一般類。即使如此，該物種仍受《野生動物保育法》保護，不得任意獵捕或飼養。請問：臺灣擁有像臺灣獼猴這類特有生物的原因，與下列何者最相關？
  options:
  - label: A
    content: 位於亞洲大陸邊緣
  - label: B
    content: 沿海有寒、暖流交會
  - label: C
    content: 臺灣所跨緯度較大
  - label: D
    content: 孤立的島嶼環境。
