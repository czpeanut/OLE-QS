- id: doc_113_高雄_五甲_社會_g7s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 等高線地形圖是一種最常用的地形表示方法，下列關於等高線地形圖的敘述，何者錯誤？
  options:
  - label: A
    content: 在地圖上將地表高度相同的各點，連成的閉合曲線，稱為等高線
  - label: B
    content: 同一張圖內相鄰兩條等高線的高度差相同
  - label: C
    content: 等高線分布越稀疏，代表坡度越陡峭
  - label: D
    content: 由等高線地形圖可繪製其他地形圖，如地形剖面圖、分層設色圖。
