    人生有幸含飴弄孫，照說是求之不得的福氣，惟隨著國內離婚率居高不下，又大環境不景氣，愈來愈多年輕父母自顧不暇，只得把孩子「賴」給老一輩照顧，甚至自己從家庭角色中完全消失。根據衛福部最新研究，分析顯示，國內此類家庭高達79.2％都「為嬤則強」，其中又以祖母占53.19％居多，其次則依序為外祖母28.96％、祖父13.30％。其中，子女無法照顧孫子女的原因，以子女因入獄、失業、重病等因素無力扶養子女占24.95％最多，其次則依序是子女離婚、喪偶、分居或再婚占22.79％，以及子女長期在外地工作占17.49％等。形成原因，都充滿了無奈，因此，其生活品質也多半堪憂，調查顯示，國內此類家庭逾半數近1年平均家庭月所得，僅有區區1到3萬元，其次32.57％月所得連1萬元都不到；影響所及，逾4成都必須申請政府的中低收入、身心障礙補助、遺屬年金、老農年金、老人津貼等，作為主要甚至唯一的家庭收入來源。'
