  group_stem: "(二)Christmas Fun Facts about Santa Claus \nSanta Claus’ red clothes\
    \ \n    In the 17th century, people believed green plants had the magic of resisting(抵抗)\
    \ the cold and wouldn’t die, so Christmas was mostly decorated(裝飾) green.  Even\
    \ Santa Claus’ clothes were green until 1930. When an advertisement(廣告) for Coca-Cola\
    \ used the red color into the Santa’s clothing, it was very successful. After\
    \ that, red became the color of Christmas. \n       Santa’s post office \nKids\
