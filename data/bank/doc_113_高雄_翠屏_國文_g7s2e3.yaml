  stem: 陳樹菊阿嬤的愛心，榮膺「富比士善心榜」。她表示：「這只是感念當年別人的幫助，沒有什麼了不起， 因為臺灣很多人都這樣做。」她的善心、善行最符合下列何種精神？
  options:
  - label: A
    content: 老驥伏櫪，壯志不已
  - label: B
