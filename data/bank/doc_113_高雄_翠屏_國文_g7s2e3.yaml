    content: 作者住在優質的社區大樓，故能充分了解保全人員的辛苦
  - label: B
    content: 保全人員為了爭取工作機會，只好應允社區主委索要回扣
  - label: C
    content: 保全人員工作項目，不是只有保護社區安全這麼簡單而已
  - label: D
    content: 作者擔任保全人員後，深知業者的生存之道，就是要送禮
  group_stem: '還沒有進：入保全業以前，我誤以為那是一份簡單的工作，專給退休人士打發時間及賺取零用錢，直到自己也身在其中。

    【甲】某些社區住戶則是異想天開，希望用低價顧到像連恩尼遜或傑森史塔森般身手矯健、動作迅猛如

    武打巨星之類的保全人員……人只要出來謀生賺錢，都有各自的辛酸。保全工作不如我當初想像的輕鬆容

    易，難怪報紙的徵才廣告有三分之一都在徵保全。


    【乙】某些社區主委非常惡劣，保全公司的利潤低已是事實，卻要求公司請吃飯送禮物，給他拿回扣。

    公司為了拿到標案不得不從，層層剝削下來，保全的低薪可想而知。


    【丙】保全不是只有收收掛號信、包裹，以及門禁管制而已，不同的案場有不同的處理，需要方方面面

    兼顧。有些社區的保全要澆花除草掃落葉，有些要打掃倒垃圾，有些要幫住戶開門開電梯，有些要處理

    貓屍、狗屍、蟑螂屍，有些要會電腦和財報，有些要會水電，有些要會外語……但這些都沒什麼，最可怕

    的是人的貪婪和自私。'
