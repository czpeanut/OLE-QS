- id: doc_113_高雄_翠屏_國文_g7s2e3_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 示愛一文透過對話、動作、獨白表達內在情感，令讀者如入其境，下列各對話的文意說明，何者錯誤？
  options:
  - label: A
    content: 「沒關係，第一次總是最難的，跨過了這一關，以後就簡單了。」此句話顯示出女兒安慰作者並鼓勵她勇敢示愛
  - label: B
    content: 「這件衣服真好看，以後你不穿了，不要送別人，就送給我好嗎？」可以感受女兒在言語與行為上都積極表現出對母親的支持
  - label: C
    content: 「妹，你真會諂媚欸！也不怕閃到舌頭！」可看出兒子有話直說，毫無隱瞞的個性
  - label: D
    content: 「你今天是安怎？為什麼奇奇怪怪？」表現出母親心思細膩，察覺作者有心事
  lesson_raw:
    title: 示愛
    basis: 題幹提及「示愛一文」
- id: doc_113_高雄_翠屏_國文_g7s2e3_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 示愛一文中，作者引用母親的問話：「母親奇怪地問我：『你今天是安怎？為什麼奇奇怪怪？』」其目的不包括下列何者？
  options:
  - label: A
    content: 以對話方式凸顯鮮明的人物形象
  - label: B
