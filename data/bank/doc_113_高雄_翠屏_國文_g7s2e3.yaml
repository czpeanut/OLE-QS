  stem: 「許多六、七年級生童年時因父母工作忙碌成為『鑰匙兒童』，是教育界曾批評的怪象。但這些人長大後成為家長，多以安全為由讓孩子進安親班或課輔班，『安親班兒童』成為普遍現象。教育界人士認為，『安親班』取代『家庭』，『補教老師』代替『父母』」角色，鑰匙兒童變少了，但親子疏離的問題依舊。以目前臺灣社會，許多縣市的國中小學生放學，祖父母就接送到補習班讓教師課後輔導。家長說，孩子在安親班有晚餐可吃，有教師幫忙指導寫作業，也有玩遊戲或下棋時間，安親班確實幫了他們這些家長很多忙。但也有多名學童表示，在安親班可以和不同班級學生一起玩及上課，很開心，但有時也希望父母早點來接自己回家。」根據上文，下列說明何者錯誤？
  options:
  - label: A
    content: 安親班老師不管在教導或是情感上，已經完全取代父母的功能
  - label: B
    content: 對小朋友來說，同儕的力量雖然重要，卻還是渴望父母的陪伴
  - label: C
    content: 安親班不僅提供孩子們學習的場所，也解決了放學後的安全問題
  - label: D
    content: 不管是都市或是鄉下，都存在有安親班兒童的問題，值得重視
