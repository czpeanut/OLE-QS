    content: 知恩圖報，兼善天下
  - label: D
    content: 受人點滴，獨善其身
- id: doc_113_高雄_翠屏_國文_g7s2e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 德蕾沙修女畢生奉獻心力於照顧貧苦的人，榮獲諾貝爾和平獎後，仍謙卑地為窮人彎下她的腰。下列何者可以說是她的寫照？
  options:
  - label: A
    content: 神聖的事業總是痛苦的，但是，也唯有這種痛苦能給予我們深度
  - label: B
    content: 越是真正作過一點事，越是感覺自己的貢獻之渺小
  - label: C
    content: 一個人最值得驕傲的，不見得是他的成功，而是他的努力
  - label: D
    content: 創業的人都會自然而然地想到上天，而敗家的人卻無時不想到自己
- id: doc_113_高雄_翠屏_國文_g7s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 「因為義正了，容易辭嚴；而辭嚴了，往往憤事。也因為理直了，容易氣壯；而氣壯了，每成僵局。」陳之藩這段話應是要表達什麼道理？
  options:
  - label: A
    content: 正義是人類最大的利益
  - label: B
    content: 溫和比強暴更有希望獲得成功
  - label: C
    content: 不要因為一時的情緒，就急著對生命下判斷
  - label: D
    content: 凡是合理的都是現實的，凡是現實的都是合理的
- id: doc_113_高雄_翠屏_國文_g7s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 愛因斯坦發表相對論至今恰好滿101 年，臺北一○一大樓舉辦紀念活動，只要參加者能舉出與其「謙讓」精神相同的歷史名人，就贈送精美禮物一份。請問下列何者舉例正確？
  options:
  - label: A
    content: 「願無伐善，無施勞」的顏回
  - label: B
    content: 「我亦無他，「惟」手熟爾」的賣油翁
  - label: C
    content: 「其於為文，不自雕飾」的張繼
  - label: D
    content: 「情真、義深、文精、格新」的琦君
- id: doc_113_高雄_翠屏_國文_g7s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 陳之藩：「能夠欣賞釣，而不計較魚，是會使一個人快樂，使一個團體健康，使一個社會成功的。」此段文字所表達的意旨，不包括下列何者？
  options:
  - label: A
    content: 一個有真正大才能的人，會在工作過程中感到最高度的快樂
  - label: B
    content: 工作、研究是為了興趣與真理，而非名利
  - label: C
    content: 世間任何事物，追求時的興致恆比享用時的興致濃烈
  - label: D
    content: 人生不是一種享樂，而是一樁十分沉重的工作
- id: doc_113_高雄_翠屏_國文_g7s2e3_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 「鋤禾日當午，汗滴禾下土。誰知盤中飧，粒粒皆辛苦。」這首詩要說明的道理，與下列何者最為接近？
  options:
  - label: A
    content: 春耕夏耘，秋收冬藏
  - label: B
    content: 種瓜得瓜，種豆得豆
  - label: C
    content: 百般武藝，不如鋤頭落地
  - label: D
    content: 一粥一飯，當思來處不易
- id: doc_113_高雄_翠屏_國文_g7s2e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 「她給孩子絕對的自由，從不強迫他們去做不喜歡的事，可是，她並沒有真正花時間，瞭解和引導大女兒夏綠蒂。夏綠蒂不是一般尋常的孩子，對現有教育體制充滿狐疑、對抗、以及不適應。她始終以『教育體系有問題，孩子將來自有出路』，合理化一路以來無暇關心的缺席。」下列的選項，何者最適合用來形容文中的母親？
  options:
  - label: A
    content: 視若無睹，大女兒對教育制度的不滿是個人的問題
  - label: B
    content: 自得意滿，認為自己的教育方式恰當合適
  - label: C
    content: 欲蓋彌彰，掩飾長久以來的錯誤，以致無法挽回
  - label: D
    content: 自欺欺人，以為一切終將得到解決而沒有積極關懷
- id: doc_113_高雄_翠屏_國文_g7s2e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 「母親是最傻不過了，常常使得對她表示好意的子媳不高興。譬如說，買了五六個大蘋果送給她老人家。她接過了手就說：『蘋果又不是沒吃過，一個要十幾塊錢。買它幹什麼？』我在市場看到那醃得紅紅的鹹鰱魚，就買了一塊試試，滋味美極了，再去買一塊送給母親吃。當母親聽到一兩八塊新臺幣時，就來責備我：『這樣貴的東西，下次不要再買了！』」（林鍾隆
    微笑）根據本文，作者認為母親「最傻」的原因應是下列何者？
  options:
  - label: A
    content: 管教子女過於嚴苛
  - label: B
    content: 錙銖必較，喜歡占人便宜
  - label: C
    content: 不懂得接受他人的盛情
  - label: D
    content: 不識貨，不懂得享受美味食物
- id: doc_113_高雄_翠屏_國文_g7s2e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 「我有四個第三代：孫女和孫子，外孫女和外孫，『品種齊全』，也都很可愛──這並不是作為祖父、外祖父的偏愛。孫子和我住在一起，所以接近的機會更多一些。陪著他一道玩耍，成為我的『日課』之一……我誠然在他身上花去了太多的時間，因為影響了工作而苦惱，而且抱他上樓下樓，陪他玩，也使我感到精力不濟。但是，他常使我開懷大笑，帶給我許多歡樂。我說我是『陪』他玩，那是表明，我也沉浸在一種情趣中，使我蒼老並刻有斑斑傷痕的心還能生發出──唔，就算是『老天真』吧。」（曾卓
    祖與孫）下列是「毛豆四兄弟」的對上文的解讀，請問誰說的最正確？
  options:
  - label: A
    content: 大毛：作者與四個第三代住在一起，孩子帶給他許多歡樂
  - label: B
    content: 二毛：「品種齊全」所指的是作者的孫輩中，包含不同人種
  - label: C
    content: 三毛：「日課」指作者每天的工作，常因陪孫子玩而受影響
  - label: D
    content: 小毛：「老天真」在此是指作者陪孫子玩耍所激發出的童心
- id: doc_113_高雄_翠屏_國文_g7s2e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 臺灣諺語：「時到時擔當，沒米煮蕃薯湯。」主要傳達的意思為何？
  options:
  - label: A
    content: 船到橋頭自然直
  - label: B
    content: 年少打拚事業不急於一時
  - label: C
    content: 告誡年輕人處事千萬別獨斷獨行
  - label: D
    content: 人的一生是否有成就，取決於責任感
- id: doc_113_高雄_翠屏_國文_g7s2e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 佛說：「在有智慧的人看來，並沒有所謂『不好』的事情。只要善加運用，人生的各種經歷都是成長的階梯。」這段話的意旨與下列何者最相近？
  options:
  - label: A
    content: 稻穗飽滿頭必低，人心充實性必謙
  - label: B
    content: 別人只能給你指路，而不能幫你走路，自己的人生路，還需要自己走
  - label: C
    content: 患難困苦是磨鍊人的最高學府
  - label: D
    content: 相信就是強大，懷疑只會抑制能力，而信仰就是力量
- id: doc_113_高雄_翠屏_國文_g7s2e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 「那個名叫『失敗』的媽媽，其實不一定生得出那個名叫『成功』的孩子—除非她能先找到那位名為『反省』的爸爸。」以上這段文字的寓意為何？
  options:
  - label: A
    content: 未經歷失敗與反省，就不能走上成功的階梯
  - label: B
    content: 許多賽跑的人失敗，都是失敗在最後幾步
  - label: C
    content: 能夠反省失敗之所在，方能成功
  - label: D
    content: 失敗為成功之母，是亙古不變的真理
- id: doc_113_高雄_翠屏_國文_g7s2e3_s1_19
  section: 1
  number: 19
  type: single
  page: 2
