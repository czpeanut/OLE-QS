  section: 1
  number: 8
  type: single
  page: 1
  stem: 立法院部分立法委員有鑑於身障人士於日常受到嘲諷，可能涉及歧視卻無法可罰的案例，因此邀請臺灣障礙者權益促進會、臺灣失能者家庭暨看護雇主國際協會等民間團體，參與有關「身心障礙者歧視事件之損害賠償請求權基礎」的公聽會，討論修訂《身心障礙者權益保障法》、《民法》或是另行制定反歧視專法，讓被歧視者可依法擁有請求賠償的權利。若從志願結社的概念來看文中的民間團體，下列何者最為正確？
  options:
  - label: A
    content: 可在公聽會時主動就其關心的公共議題，明確表達立場
  - label: B
    content: 立法委員透過加入民間團體擴大個人影響力，增進公益
  - label: C
    content: 被動受立委邀請而參加公聽會，顯示該團體缺乏自主性
  - label: D
    content: 因能代表全體人民反映公共意見，而被邀請參加公聽會。
