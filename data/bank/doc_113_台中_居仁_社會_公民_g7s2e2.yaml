  stem: 林媽媽非常關心孩童的教養方式，她發現有個親子共學團體，是(甲)由一群關心孩童的媽媽組成，(乙)主要關注政府對於兒童權益的相關政策，且常參與社會運動表達對相關法規的觀點。(丙)該團體在各區域設有分會，辦理親子共學的活動、兒童權益的討論會等，方便各地家長參加。林媽媽非常贊同團體的理念，不僅加入此團體，還積極地宣傳並邀請朋友加入，希望讓這個共學團體發揮更大的影響力。請問：文中畫線處依序為何種志願結社的特徵？
