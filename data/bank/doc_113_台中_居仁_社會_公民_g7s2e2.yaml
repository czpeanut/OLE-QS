  - label: B
    content: 差異性
  - label: C
    content: 變動性
  - label: D
    content: 影響性。
  group_stem: 為了彌補政府政策規畫的不足，(甲)國家發展委員會設置「公共政策網路參與平臺」供民眾有機會直接對社會議題提出意見，政府也可透過平臺採納人民的公共意見作為政策制定的依據。近來有民眾在該平臺提案：「交通部高速公路局須針對大型重型機車行駛高速公路提出規畫進程表，敘明開放或試辦的時程。」對此交通部表示，針對此一議案曾做過民意調查，有6
    成民眾持反對意見，3 成民眾認為可以採時段性、小路段開放，只有1 成民眾贊成完全開放重機上國道。之後也將持續進行電話民意調查了解民意動向，除了市話之外，也加入行動電話進行抽樣調查，(乙)未來若有7
    成至8 成民眾支持，(丙)政策面就可依民意制定進程表與規範，開放重機上國道。
