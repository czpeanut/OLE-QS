  group_stem: "While hiking in the Italian Alps on September 19, 1991, Erika and Helmut\
    \ Simon discovered the\nfrozen body of a man. At first they thought it was the\
    \ body of a modern hiker. When the body was\nremoved from the ice, scientists\
    \ were surprised to find out that the body was more than 5,000 years old.\nThe\
    \ mummy bacame known as Otzi the Iceman.\n    By studying Otzi, scientists have\
    \ learned valuable information about the way ancient people lived.\nOtzi was wearing\
    \ leather shoes lined with straw, clothing made of leather and plant fibers, and\
    \ a fur coat\nand hat. He was carrying a wooden backpack and several tools. The\
    \ tools included a copper ax, a stone\nknife, a bow and arrow, and an arrow repair\
    \ kit.\n    At the time of his death, Otzi was between 30 and 45 years old. He\
    \ was about 5’3” tall. Based on his\nclothes and tools, scientists believe he\
    \ was a hunter. The snow and ice and surrounding rocks in the place\nwhere he\
    \ died helped preserve his body.\n    Otzi is now kept at the South Tyrol Museum\
    \ of Archaeology in Bolzano, Italy. If you ever have the\nchance to visit, bring\
    \ your coat. Otzi’s body is kept at 21°F in order to preserve it. As scientists\
    \ develop\nmore tests and better technology, they hope to keep studying Otzi in\
    \ order to learn more about our early\nancestors.\n discover 發現 frozen 冰凍的 mummy\
    \ 不腐的屍體 leather 皮製的 fur 毛皮 ax 斧頭\n   preserve 保存\n                           \
    \                       Adapted from Reading for Comprehension"
