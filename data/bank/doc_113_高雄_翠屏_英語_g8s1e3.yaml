  group_stem: "Before any visitors reached the moon, astronomers described it as a\
    \ silent place. They said\nthat there could be no sounds at all there. Then astronauts\
    \ landed on the moon and talked to\none another as they explored its surface.\
    \ Their voices were heard on Earth. Were the\nastronomers wrong?\nTo find the\
    \ answer, we must know something about sound waves. Sound waves need\nsolids,\
    \ liquids, or gases to carry them along. On Earth, sounds travel through air to\
    \ reach our\nears. If there is no air, sound waves cannot travel. Imagine a television\
    \ sealed in a glass case\nwith all the air removed. You can see the power is turned\
    \ on and the volume is turned up. Yet\nyou will hear no sound because there is\
    \ nothing to carry the sound waves.\n    The surface of the moon has no air either.\
    \ So the astronomers were right. The moon is\nsilent. Then how could the astronauts\
    \ talk to each other while they were there? They went to\nthe moon prepared. The\
    \ astronauts carried equipment to send and receive radio waves. Radio\nwaves are\
    \ different from sound waves. They speed along at 186,000 miles per second. They\
    \ do\nnot need other material to carry them along. The astronauts could use radios\
    \ to talk to each\nother and to people on Earth. But the moon itself was just\
    \ as silent as ever.\n    astronomer 天文學家 astronaut 太空人 explore 探測 solid 固體 liquid\
    \ 液體\n      imagine 想像 sealed 密封的 equipment 設備 material 物質\n                 \
    \                                 Adapted from Reading for Comprehension"
