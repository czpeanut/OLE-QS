  section: 3
  number: 19
  type: single
  page: 2
  stem: 「在炎炎夏日裡突然吃冰的話，腦袋就會像是結凍了一般，引起10～30 秒不等的偏頭痛，這就是被稱為『冰淇淋頭痛』的冷刺激性頭痛。『冰淇淋頭痛』的成因其一是關於三叉神經核的錯覺，因為冰冷食物突然進入，造成喉嚨神經的刺激，除了造成神經的冰冷，更會引起痛覺。痛覺會被神經傳導至位於腦幹的三叉神經核，而三叉神經核是負責掌管喉嚨、牙齒等部位神經痛覺的地方。其二，腦部一時的發炎反應，因為身體想要調節突然吃冰所造成的口腔內部寒冷，導致身體血流量突然增加，腦中血管被過多的血流量瞬間撐大，造成短暫的發炎反應。雖然有兩種不同的主張，但我們可以知道吃冰淇淋導致頭痛是由『炎熱高溫裡』、『突然吃冰』這兩個條件作用所引起的，因此若在高溫的天氣裡突然想吃冰，在一開始時也應該要放慢速度的吃，如此一來就可以減少頭痛發生的可能性。此外，日本電視節目更對此提出了快速有用的解決方法，先將要吃的冰與容器一起按在額頭上10
    秒～1 分鐘左右，透過這種比較和緩的方式，事先讓腦部接受低溫的刺激，等到腦部熟悉低溫並開始運作的時候再開始吃冰，就可以擺脫因突然的低溫所引起的『冰淇淋頭痛』了。」可艾看完這篇文章後，想整理這篇文章的重點，但粗心的她只寫對一項，請問是下列何者？
