    content: 三叉神經核會因為受到刺激，將痛覺傳導至腦幹，進而導致冷刺激性的頭痛
  - label: B
    content: 「冰淇淋頭痛」的成因和天氣炎熱無關，只是因為吃冰吃太急出現的小毛病
  - label: C
