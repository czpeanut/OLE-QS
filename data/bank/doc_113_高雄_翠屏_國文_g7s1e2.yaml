  section: 5
  number: 28
  type: single
  page: 4
  stem: 文中圖德之所以會興起運冰到炎熱地區銷售的想法，靈感來自於下列何者？
  options:
  - label: A
    content: 憑空的想像與杜撰
  - label: B
    content: 小時候的環境與經驗
  - label: C
    content: 友人的靈感與玩笑
  - label: D
    content: 科學的知識與研究
  group_stem: '(一)熱，是冰的價值（改寫文章）   蔣登

    有兩個孩子從家中偷了一些水果和奶製品，跑到野外去玩。那時還沒有保存食物的方法，看著吃剩的食物在陽光下壞掉，他們沒有一點兒辦法。


    後來，上了中學，他們依然是好朋友。一次，沿著冰封的湖畔散步，那個叫圖德的孩子突然說：「還記得咱們從家裡偷東西出來吃的事嗎？」另一個孩子說：「當然記得，只可惜剩下的食物都壞掉了！」圖德指著湖面問：「看見那些冰了嗎？」「這裡的冬天到處都是冰，沒有什麼大驚小怪的。」圖德興奮地說：「為什麼不把這些冰收集起來，運到炎熱的加勒比海去銷售呢？」那個孩子嘲笑他說：「別傻了，冰到了那裡早化成水了！」可圖德的目光依然注視著湖面上的冰。幾年後，也就是西元1806年，二十一歲的圖德再次找到當年的朋友，想讓他和自己一起做賣冰的生意，可朋友再次拒絕了他，並勸他別異想天開。後來，在別人的資助下，圖德花了一萬美元將一百三十噸的冰用船運往酷熱的馬堤尼克島。此後，圖德在十五年的時間裡，把冰的生意做到了世界各地，在船所能到達的地方，滿足了人們對冰鎮飲料、冰藏水果和冷藏肉類的需求。

    到了1858年，圖德把十五萬噸冰先後裝上了三百八十條大船運往美國、中國和澳大利亞等五十多個國家和地區，而圖德也因此成為世界冰王和億萬富翁。而圖德更大的貢獻在於：若干年後，科學家們從他的做法中受到了啟發，發明了冰箱。

    當年嘲笑圖德的朋友，則一直過著普通的生活。因為他沒有想到，冰雖然遇熱就化，但冰的價值，卻唯有在炎熱的地方才能凸顯。'
