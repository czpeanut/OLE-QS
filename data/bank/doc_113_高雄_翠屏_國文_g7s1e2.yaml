  stem: 唐詩人崔顥遊黃鶴樓，寫下黃鶴樓一詩，傳為千古絕唱。後來，相傳詩仙李白也登上了黃鶴樓，正想題詩時，看到崔顥題的詩，不禁嘆道：『眼前有景道不得，崔顥題詩在上頭。』就擱筆不寫了。」下列文句的含義，何者最能與故事中李白的行為相呼應？
  options:
  - label: A
    content: 能欣賞別人的長處，也是一種人生的智慧
  - label: B
