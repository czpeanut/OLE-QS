- id: doc_113_高雄_翠屏_國文_g7s1e2_s5_30
  section: 5
  number: 30
  type: single
  page: 4
  stem: 文中作者的母親說「我們哪愛吃這些？反正你不回來，一樹的好櫻桃就全浪費了……」下列關於這句話的解讀，何者最恰當？
  options:
  - label: A
    content: 母親認為櫻桃是好水果，深怕糟蹋好東西
  - label: B
    content: 母親想念女兒，以不愛吃為由喚女兒回家
  - label: C
    content: 母親希望女兒能回家幫忙採，因此撒了小謊
  - label: D
    content: 母親生性節儉，好東西總捨不得自己享用
  group_stem: "(二)  長在樹上的「謊言」（改寫）   管洪芬\n  \n幾天前，母親給我打電話，說自家樹上的櫻桃全熟了，沒人吃，讓我有空就去摘了來。想著這幾天手頭正忙，便說，你們自己多吃點，別什麼都想著留給我們吃……顯然我的話讓母親很著急，連說話的音量也提高了不少：「我們哪愛吃這些？反正你不回來，一樹的好櫻桃就全浪費了……」\n\
    怎麼能讓一樹的好櫻桃浪費呢？於是找個空閒就去了母親家。母親見到我，很高興地把冰箱打開說：「今年的櫻桃長得特別大，怕在樹上待不住，我和你爸採了下來，擱冰箱裡給你保著鮮呢。」我扭身去水池邊清洗的時候，看到一隻簍子裡也裝著櫻桃，不過明顯小了些，這定是母親挑剩留給自己吃的。看著手上和簍裡的鮮明對比，我心裡不由一陣潮溼。\n\
    \    \n其實從來知道，母親嘴裡的「不愛吃」不過是她用來騙我的一種謊言，而且，這種謊言幾乎每年都要說上好幾遍。譬如現在櫻桃熟了，母親會說「我們不愛吃，你有空來摘了去」，再等個把月，油桃熟了，母親一定也會這麼說，然後是秋天的橘子、柿子……反正無一例外，只要我喜歡吃的，她通通不喜歡吃。\n\
    \    \n每次面對母親的「召喚」，我都毫無抵制力，馬不停蹄地往家趕。因為我知道，母親不止是讓我回去採果子，事實是，母親想我了。\n    是的，母親想我了。對於遠嫁在外的女兒，母親只會這樣委婉曲折地表達對我的思念。\n\
    \    \n驀然想起父親今年春天時開玩笑地說：「你母親今年又栽了梨樹和橘樹，看來以後啊你每年要多被騙回來幾次了。」一直記得我的回答：「騙就騙吧，誰讓我愛上了這被騙的幸福。」"
