  type: single
  page: 2
  stem: 「曾有『最幸福國度』之稱的南亞國家——不丹，近年傳出人口流失的新聞。不丹位於喜馬拉雅山，生活水準不高，因人們在精神層面的感覺富足，而被認為是最幸福的國家。但在近年失業率高漲、政府孤立政策（與外國往來少，減少被外國文化影響）、就業機會少、生活水準下降等因素之下，許多年輕人選擇移民到澳洲尋求更好的生活。」根據上文，下列哪一分析最為正確？
  options:
  - label: A
    content: 不丹國內的拉力促使人們移出
  - label: B
    content: 「最幸福國家」為不丹的推力
  - label: C
    content: 澳洲的拉力可能是就業機會多
  - label: D
    content: 人口流失會使自然增加率降低
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
