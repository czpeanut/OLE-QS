  group_stem: '1.

    Gender stereotypes are ideas about how boys and girls should act. These ideas
    say what toys kids should play with and what jobs men and women should have. For
    example, some people think only girls should play with dolls and only boys should
    play with trucks. But it''s important to let kids play with what makes them happy,
    no matter it''s dolls or trucks.

    Sometimes, people think girls are better at reading and boys are better at math,
    but boys and girls can be good at both. Gender stereotypes can hurt people''s
    feelings, like when someone says boys shouldn''t cry or girls should be quiet.

    We should stop gender stereotypes and let people be who they are, giving everyone
    the same chances to learn and grow. Being kind and fair to everyone is very important.


