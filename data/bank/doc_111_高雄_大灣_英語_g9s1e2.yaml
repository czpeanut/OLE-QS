  group_stem: 'Elizabeth was born in1926 in London. She was named Elizabeth after
    her mother. She was also called "Lilibet" ① her close family, based on what she
    called herself at first. Her father became the King George VI in 1936 when her
    uncle, King Edward VIII, gave up the throne. It made the ten-year-old Princess
    Elizabeth ② the heir presumptive. When her father ③ in February 1952, she became
    the Queen Elizabeth II. She was only 25 years old at that time. She wasn’t sure
    ④ a good queen. She also didn’t know ⑤ people in the UK loved her or not. She
    did her best for the royal duties. She led the country to go through many tough
    times. Therefore, She won respect and love of the people. When she passed away
    in September 2022, people were sad and sent lots of Paddington bears and flowers
    to Buckingham Palace in tribute to the late Queen Elizabeth II. Those bears ⑥
    a children’s home after the funeral and the Queen will be memorized by the people
    forever.

    📖 throne 王座 heir presumptive 推定法定繼承人 royal duty 皇室責任 tough 困難的 pass away 過世

    tribute 致敬 funeral 葬禮 memorize 記憶'
