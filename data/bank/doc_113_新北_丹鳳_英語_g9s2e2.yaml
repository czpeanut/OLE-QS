- id: doc_113_新北_丹鳳_英語_g9s2e2_s2_39
  section: 2
  number: 39
  type: single
  page: 4
  stem: 39. From the reading, which is not correct?
  options:
  - label: A
    content: Studies show the five-second rule is not true.
  - label: B
    content: The five-second rule is not a guarantee.
  - label: C
    content: Wet foods pick up less germs than dry foods
  - label: D
    content: Even a short time on the floor can lead to contamination.
  group_stem: "(II)\nFive-Second Rule\n     The “five-second rule” is a common idea\
    \ that food dropped on the floor is still safe to eat if picked up quickly.  People\
    \ think picking the food up in time helps keep it clean.   \nStudies show the\
    \ five-second rule is not true.  In fact, the time food stays on the floor is\
    \ actually less important than the kind of food and the type of floor.  For example,\
    \ wet foods, like fruit, pick up more germs than dry foods, like cookies, because\
    \ water spreads germs more easily.\n Even if you pick up food as soon as it falls,\
    \ it can still get germs.  Studies show that even a short time on the floor can\
    \ lead to contamination.  Picking food up quickly helps, but it does not make\
    \ the food safe.  The five-second rule is not a guarantee.\n\n★ germ 細菌  spread\
    \ 擴散  contamination 汙染  guarantee 保證"
- id: doc_113_新北_丹鳳_英語_g9s2e2_s2_40
  section: 2
  number: 40
  type: single
  page: 4
  stem: 40. What is the reading about?
  options:
  - label: A
    content: The reasons why theater seats are red.
  - label: B
    content: The history of movie theaters.
  - label: C
    content: Why people eat snacks in the theater.
  - label: D
    content: How to clean theater seats
  group_stem: "(III)\nWhy Are Movie Theater Seats Red?\nAsk anyone for the color of\
    \ a movie theater seat and you will probably hear red.  \nTheater seats are usually\
    \ red for a few reasons.  First, red is a bright color.  It makes people feel\
    \ happy and excited.  When you go to the theater, you want to enjoy the movie\
    \ and have a great time.  The red seats help people feel more comfortable and\
    \ relaxed in a colorful environment.\n  Second, red seats can hide stains very\
    \ well.  In a theater, many people eat snacks like popcorn and drink soda.  Sometimes,\
    \ drinks and popcorn can fall on the floor or seats.  If the seats were a light\
    \ color, it would be easy to see all the stains, and that would not be nice for\
    \ anyone.  Red helps to keep the theater looking clean. This way, the seats look\
    \ nice and do not seem dirty, even after many people sit in them.\n  Last but\
    \ not least, red has a special meaning in theaters and cinemas.  It is a traditional\
    \ color for many old theaters.  In the past, they used red curtains and other\
    \ items to bring exciting feelings.  The use of red makes the theater feel special\
    \ and wonderful.  It helps to create a nice atmosphere for watching movies.\n\n\
    ★ environment 環境  stain 污點  traditional 傳統的\ncurtain 窗簾  atmosphere 氣氛\n★ paragraph\
    \ 段落"
  shared_asset: g2_40_43
