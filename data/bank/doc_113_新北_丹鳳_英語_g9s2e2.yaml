    content: It’s best to buy and use fewer plastic bottles and plastic bags.
  - label: B
    content: The ratio of fish and plastic in the ocean in 2050 will be 5:1.
  - label: C
    content: We should join activities for cleaning up the environment.
  - label: D
    content: Giving old plastic toys away is a way to reuse them.
  group_stem: '(V)

    There is a lot of plastic in the world’s oceans. People at sea can see pieces
    of it floating in the water. Some try their best to take as much of it out as
    they can. However, it’s not enough because more and more plastic ends up in the
    ocean instead of in the recycle bin. According to a study, by 2050, the weight
    of plastic in the oceans will be the same as the weight of fish if we don’t make
    a change.

    The problem is serious, but we can do things to fix it. The best way is to reduce,
    reuse, and recycle. In other words, we need to cut buying things in plastic packaging.
    If we do buy those things, we can find ways to use the bags, cups, toys, and bottles
    again. Also, if we can’t reuse them ourselves, then we need to recycle them and
    turn them into new things. That’s not all. If we hear people talk about cleaning
    up a beach, we should find out more and also get the word out. In the end, we
    need to help the Earth so that we can help ourselves.


