  group_stem: '(IV)

    (From Jake’s notebook)

    Dec.1

    Today was special! We had a birthday party for the children. The kids were so
    happy. Some basketball players came to visit. They played games with the children
    and gave shoes to those in need. One boy said it was the best day of his life.

    Dec.5

    What a hard day. A car hit a group of students near a school. Many students got
    hurt, and a girl didn’t make it. I tried to save her, but I couldn’t. Her parents
    were very sad. I didn’t know what to say to them.

    Dec.20

    Today, I met a kind old lady. She brought snacks for everyone. She said we worked
    too hard and needed something sweet. It made my day!

    Dec.25

    Christmas Day! People still came for help. One boy got a toy in his ear and couldn’t
    get it out. I helped him get it out. The boy then told me he wanted to listen
    to the toy’s “secret.” Oh, come on!

    Dec.31

    Last day of the year. A boy walked in with his mom. He said, “Thank you for helping
    my mom.” What a perfect way to end the year!'
