- id: doc_113_新北_丹鳳_英語_g9s2e2_s2_36
  section: 2
  number: 36
  type: single
  page: 3
  stem: 36. How many temples do people that join the pilgrimage visit during the nine-
    day trip?
  options:
  - label: A
    content: About 300 temples.
  - label: B
    content: About 12 temples.
  - label: C
    content: Over 100 temples
  - label: D
    content: Over 2000 temples.
  group_stem: "(I)\nFamous Festival in Taiwan\n      Dajia Mazu pilgrimage is a famous\
    \ festival in the world.  The nine-day trip is about 300 km from Zhenlan Temple\
    \ in Dajia, a small town in Taichung.  During the nine-day trip, over five million\
    \ people join the pilgrimage and about 200,000 people walk up to 12 hours every\
    \ day.  They carry Mazu and visit over 100 temples in Changhua, Yulin and Chiayi.\
    \  People believe Mazu is going to bring good luck for these places.  During the\
    \ eight nights of the trip, Mazu stays in different temples and Mazu followers\
    \ stay at some places like train stations for a night.  People in Changhua, Yulin\
    \ or Chiayi are kind and have their gardens or living rooms ready for these Mazu\
    \ followers.  Also, they even get food and drinks ready for them.  This way, these\
    \ followers can have enough food to eat and a safe place to sleep.  With the Mazu\
    \ pilgrimage, people all over Taiwan are getting close to each other.  That’s\
    \ great, right?\n\n★pilgrimage 朝聖"
