  stem: 下列敘述何者正確？
  options:
  - label: A
    content: $6x-5x$ 化簡後的結果為 1。
  - label: B
    content: $-3(x+1)$可以化簡成$-3x+3$。
  - label: C
    content: $-x+5$、$6-5y=y$、$\frac{3}{2}x+4=0$ 都是一元一次方程式。
  - label: D
    content: 若 $a=b$，則 $1-a=1-b$。
