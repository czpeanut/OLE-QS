  section: 4
  number: 1
  type: single
  page: 3
  stem: 下列關於甲、乙二文文句的說明，何者敘述正確？
  options:
  - label: A
    content: 「少無適俗韻，性本愛丘山」是追憶早年隱居田園的寧靜生活
  - label: B
    content: 「羈鳥戀舊林，池魚思故淵」，詩人用「羈鳥」及「池魚」為喻，是暗示思鄉的愁緒
  - label: C
    content: 「問君何能爾？心遠地自偏」可知雖長年居於鬧市中，卻能透過冥想而不受其影響
  - label: D
    content: 「此中有真意，欲辯已忘言」指詩人雖已體會到人生的真諦，卻「只可意會，不可言傳」
  group_stem: "【甲】少無適俗韻，性本愛丘山。誤落塵網中，一去三十年。羈鳥戀舊林，池魚思故淵。開荒南野際，守拙歸園田。\n      方宅十餘畝，草屋八九間。榆柳蔭後園，桃李羅堂前。曖曖遠人村，依依墟里煙。狗吠深巷中，雞鳴桑樹巔。\n\
    \      戶庭無塵雜，虛室有餘閑。久在樊籠裏，復得返自然。                      —陶淵明<歸園田居·其一>\n【乙】結廬在人境，而無車馬喧。問君何能爾？心遠地自偏。\n\
    \      採菊東籬下，悠然見南山。山氣日夕佳，飛鳥相與還。\n      此中有真意，欲辯已忘言。                          \
    \                        —陶淵明<飲酒·其五>"
  tags:
    textbook: 八上 第四課 五柳先生傳
    labeled_by: ai
    chapter:
      publisher: 康軒
      book: 八上
      subject: 國文
      code: 第四課
      title: 五柳先生傳
      chapter: null
