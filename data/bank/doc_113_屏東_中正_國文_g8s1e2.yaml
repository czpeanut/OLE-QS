  group_stem: '「日本泡溫泉」有哪些規矩或禁忌？九大外國人常犯錯誤與規矩報你知

    規矩一：入池前記得先沖澡

    進入浴場第一件事是要用浴池周圍的蓮蓬頭清洗自己的臉和身體，完全洗乾淨後才能進入溫泉池。這一方面是為了保持公共衛生，另一方面也是保護自己。因為如果當天天氣寒冷，迅速進入熱湯池裡可能因為冷熱轉變太快，而引起血管或心臟的問題，所以入池前先沖澡，除了可以保持溫泉的乾淨外，同時也是讓身體逐步適應溫度、避免意外的重要步驟唷!

    規矩二：沖澡時不要讓水濺到他人

    通常洗澡處會備有小椅子讓人坐著洗澡，主要為了不讓自己身上的髒污濺到別人身上或溫泉池中。雖然可能會有點不太習慣，但請盡量坐著洗。使用後的小桶子和椅子也在使用後沖洗乾淨再歸位。

    規矩三：泡澡時不要佔在溫泉出水處

    進入溫泉池時要從離出口處最遠的地方入池，入池後再移動位子，雖然溫泉出水口的水是最乾淨但通常也是最熱的，但為了讓泉水能平均地散到四處，請不要佔住出水口位置。

    規矩四：不要披頭散髮進入浴池

    泡溫泉前雖然會先洗澡洗頭，但是若池中看到毛髮也不免給人不衛生的感覺。只要是能綁的長度就得用橡皮筋束起來，避免頭髮泡進池中。如果手邊真的沒有可以綁頭髮的東西，可用毛巾裹住頭髮。

    規矩五：切勿包著浴巾或穿泳衣泡湯

    可能外國人會很不習慣與別人裸裎相見，但是在日本進入溫泉池時必需要全裸。泡溫泉時的浴巾主要是拿來擦拭身體，不能包著身體下水，因為浴巾即使清洗過後裡面還是有許多雜菌，放到池裡就等於污染了溫泉水。既然說要全裸，那麼穿著泳衣當然是不能進入大眾池的。如果實在覺得害羞無法接受，那麼可以考慮「貸切風呂」，也就是給情侶或小家庭用的私人湯屋，但要記得事前與溫泉旅館預約喔!

    規矩六：不要用溫泉水洗臉、刷身體

    在溫泉池裡洗臉、刷身體都會把身上的髒污留到溫泉水中，所以在浴池裡是絕對禁止的。如果想洗臉、刷身體、去腳皮，請在洗澡時就先做完再入池。

    規矩七：不可帶手機進去浴場

    現在人片刻不離手機，但是在浴場絕對禁止攜入，因為裡面大家都是脫光了衣服，如果不小心拍到其他人，可說是相當嚴重的隱私冒犯。為免發生爭議，讓看到你帶手機進去浴場的使用者感到不愉快，即使不拍照不使用，也不要帶進去。

    規矩八：不要躺在溫泉旁邊

    在台灣有些人泡溫泉泡累了，會大剌剌的躺在溫泉邊休息，但這在日本可千萬不要。除了光溜溜在那邊不太雅觀之外，把腳伸直坐在溫泉邊或甚至躺下來，更會影響到他人的進出甚至造成危險。

    規矩九：身上有刺青禁止泡溫泉

    為什麼日本拒絕刺青者泡溫泉？

    自古以來日本人認為刺青和暴力團體、黑道掛上等號，相信你曾在日劇或電視裡，看到不少身上有刺青的黑社會成員，被警察逮捕的橋段！儘管現代的刺青文化，已成為不少人拿來做紀念、流行等用途，甚至視為是一種藝術，但當地仍沿襲傳統作風，因此，若身上有面積較小的紋身，不妨用膠布遮蓋。

    註:不過有部分溫泉旅館／大眾浴池已開放讓有紋身者進入，建議先向店家查詢。


    看完以上日本泡溫泉注意事項，也許你會覺得，日本人的規矩還真多真細、甚至有些已經跟不上時代，但畢竟入鄉要隨俗，而且這些禮儀也是為了彼此不造成困擾，能夠放鬆地享受泡湯的極樂時光，因此，快點學習起來，當個尊重當地文化的合格旅人吧!                              —節選自網路資料'
