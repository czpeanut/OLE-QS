- id: doc_112_彰化_福興_社會_地理_g7s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 依據釣魚臺列嶼與台灣島的相對位置判斷，下列何者較有可能為釣魚臺列嶼的經緯度位置？
  options:
  - label: A
    content: ($119^{\circ}\text{E}, 23^{\circ}\text{N}$)
  - label: B
    content: ($124^{\circ}\text{E}, 25^{\circ}\text{N}$)
  - label: C
    content: ($121^{\circ}\text{E}, 24^{\circ}\text{N}$)
  - label: D
    content: ($120^{\circ}\text{E}, 22^{\circ}\text{N}$)
  group_stem: '※『…原則上，中華民國所轄範圍內的每一吋土地，無論多偏遠、服務人數再怎麼稀少，皆設置有處理郵政業務的單位。在各地區郵遞區號的資訊中，可以發現除了台灣本島之外，離島如釣魚臺列嶼、南海諸島、澎湖群島、金門列嶼、馬祖列嶼也設有郵遞區號。

    釣魚臺列嶼設置郵遞區號，為保釣歷史脈絡下所衍生出的特殊文化。事實上，釣魚臺列嶼並無郵班，寄到釣魚臺列嶼的信件沒有一封投遞成功，最終都會送至蘇澳郵局存局候補。

