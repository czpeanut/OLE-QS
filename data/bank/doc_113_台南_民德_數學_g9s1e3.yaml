- id: doc_113_台南_民德_數學_g9s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '已知：如圖，四邊形 $ABCD$ 是正方形，$A$ 在 $L$ 上，$\overline{DE} \perp L$，$\overline{BF}
    \perp L$，垂足分別為 $E$、$F$ ( $\overline{AE} \neq \overline{AF}$ )。

    求證：$\triangle ADE \cong \triangle BAF$。

    證明：(1)∵四邊形 $ABCD$ 是正方形，∴$\overline{AB} = \overline{AD}$，$\angle 7 = 90^\circ$

    (2)∵$\overline{DE} \perp L$，$\overline{BF} \perp L$，∴$\angle 5 = \angle 6 = 90^\circ$

    (3)____(甲)____

    (4)∴$\triangle ADE \cong \triangle BAF$(AAS 全等性質)

    從下列選項中，選出可填入(甲)中的正確證明過程：'
  options:
  - label: A
    content: ∵$\overline{DE} \perp L$，$\overline{BF} \perp L$，$\angle 7 = 90^\circ$，∴$\overline{DE}
      = \overline{BF}$
  - label: B
    content: ∵$\overline{DE} \perp L$，$\overline{BF} \perp L$，$\angle 7 = 90^\circ$，∴$\angle
      1 = \angle 4$
  - label: C
    content: ∵$\angle 7 = 90^\circ$，$\angle 5 = \angle 6 = 90^\circ$，∴$\angle 2 =
      \angle 3$
  - label: D
    content: ∵$\angle 7 = \angle 5 = 90^\circ$，∴$\angle 1 + \angle 2 = \angle 2 +
      \angle 3 \Rightarrow \angle 1 = \angle 3$
