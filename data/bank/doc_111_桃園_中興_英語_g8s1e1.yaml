- id: doc_111_桃園_中興_英語_g8s1e1_s4_31
  section: 4
  number: 31
  type: single
  page: 3
  stem: 31. What do we know from the story?
  options:
  - label: A
    content: The old man died.
  - label: B
    content: Jasper’s car hit the old man.
  - label: C
    content: The weather that night was nice.
  - label: D
    content: The old man only has one arm and one leg now.
  group_stem: "Hi, everyone. Today’s English class is about homonyms. Before we talk\
    \ about homonyms, let’s read the story first. \n   It was a cold and rainy night.\
    \ Jasper was on his way home. There was an old man walking in front of him. “Watch\
    \ out!” said Jasper to the old man when he saw a car. But, it was too late. The\
    \ car hit the old man, and he lost his left arm and left leg. A few months later,\
    \ Jasper saw the old man on the street again. “Hey, are you O.K?” Jasper walked\
    \ to the old man. “Well, I am all right now,” said the old man. He showed Jasper\
    \ his right arm and right leg. \n   In the story, the “right” in “all right” and\
    \ the “right” in “his right arm and right leg” are homonyms. They have the same\
    \ spelling but different meanings. One is “fine” or “okay,” and the other is “on\
    \ the right hand side.” Now, can you think of another example of homonyms?"
  tags:
    textbook: 第三冊（八上）第1次段考範圍
    labeled_by: ai
- id: doc_111_桃園_中興_英語_g8s1e1_s4_32
