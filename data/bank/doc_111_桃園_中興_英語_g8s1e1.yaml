- id: doc_111_桃園_中興_英語_g8s1e1_s4_33
  section: 4
  number: 33
  type: single
  page: 3
  stem: 33. Which color is not the secondary color?
  options:
  - label: A
    content: green
  - label: B
    content: purple
  - label: C
    content: red
  - label: D
    content: orange
  group_stem: "Artists use colors to create their works. They can also show different\
    \ moods. For example, bright colors make us feel happy and excited; however, dark\
    \ colors make us feel sad and heavy. The primary colors are blue, yellow and red.\
    \ You can mix them to make secondary colors. The secondary colors are green, orange\
    \ and purple. Green is made by mixing yellow and red. Purple is made by mixing\
    \ red and blue. Orange is made by mixing yellow and red. Purple is made by mixing\
    \ red and blue. Then, when you mix a primary and a secondary color, you can get\
    \ intermediate colors, like red-orange or blue-green. There are also special colors\
    \ like black, white and gray. They are called neutral colors. Colors have been\
    \ put into a color wheel. It shows all the primary colors, the secondary colors\
    \ and the intermediate colors. Artists use the color wheel. It helps them to know\
    \ which colors they want to use together.   \n                               \
    \                primary 主要的 mix 混合 intermediate 中間的"
  tags:
    textbook: 第三冊（八上）第1次段考範圍
    labeled_by: ai
