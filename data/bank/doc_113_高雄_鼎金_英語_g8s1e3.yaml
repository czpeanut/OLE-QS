    know where the post office was. She asked Lucia for directions. Lucia knew the
    city very well. She was showing her the way to the post office.

    Maria: Excuse me. Can you tell me the way to the post office?

    Lucia: First, turn right at the corner of the street. Go straight for 2 blocks.
    Then you can see a bakery just before the lights. After passing the lights, turn
    right on the second street. You will pass a clinic on your right. The post office
    is across from the clinic.

    Maria: Thanks a lot.

    Lucia: You’re welcome.'
