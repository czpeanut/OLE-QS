  group_stem: 'A. What Did People Say About Ding-Jin Shopping Mall?


    Frank [★★★★★] a month ago

    It was fun to shop there. There are many things for children. I spent two thousand
    dollars on toys. I even saw and shook hands with my favorite pocket monster. What’s
    more, all the clerks were nice to me. I will ask my mom to take me there again.


    Cyndi [★★★★★] 3 weeks ago

    It’s so convenient! The shopping mall is only two blocks from the metro station.
    It’s easy to get there on foot.


