  stem: 社區大樓因電梯老舊須維修或更換電梯，因此管委會召開社區大會商討此事，討論的過程中有居民提出尋找廠商時，應公布電梯相關的驗證合格資料、施工的進度及經費資料，以避免弊端。請問：上述畫線的部分顯示民眾參與公共事務的何種重要性？
