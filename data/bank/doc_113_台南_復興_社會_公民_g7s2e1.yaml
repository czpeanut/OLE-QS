  stem: 警政署實施「全國同步掃黑、肅槍行動專案」，不問對象身分、地位或任何背景，全面掃蕩幫派犯罪，讓「兄弟」沒錢花，扣押、沒收、追徵不法利得近26億。下列關於上述內容說明，何者正確？
