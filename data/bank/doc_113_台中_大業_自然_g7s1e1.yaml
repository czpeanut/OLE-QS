- id: doc_113_台中_大業_自然_g7s1e1_s3_34
  section: 3
  number: 34
  type: single
  page: 4
  stem: 關於以上文章內容，下列何者正確？
  options:
  - label: A
    content: 如果患有腎臟疾病的患者，需注意脂質的食用
  - label: B
    content: 食用紅肉除了可以獲得動物性蛋白，得到的脂質量也比食用海鮮較低
  - label: C
    content: 如果需要補充蛋白質養分，「蛋」是最佳的來源
  - label: D
    content: 食用精緻澱粉，因含有較多的糖跟油，有助於營養均衡。
  group_stem: '飲食均衡是維持健康的重要原則，目前醫學建議每天的飲食熱量來源以碳水化合物為主，佔50%到60%；脂質佔20%到30%；蛋白質佔10%到20%。以下提供幾個重點：

    碳水化合物的部分，可以多選擇未精製的全榖雜糧。精緻的穀類或加工後的製品往往會添加過多的油和糖，比較不建議。未精製的全榖雜糧，像是糙米、麥片，不僅含有膳食纖維素可以幫助消化，還有含有豐富的維生素B
    群、維生素E 和礦物質，都是大家容易缺乏的營養素。

    脂質方面，我們可以盡量選擇屬於不飽和脂肪酸的植物油，像是橄欖油、花生油、芥花油、苦茶油等，也可從堅果種子等補充脂質。

    蛋白質品質最佳的來源是蛋，而且蛋裡面還有豐富的維生素A、維生素B1、和維生素B2，以及鐵與磷等礦物質，所以吃蛋的CP 值很高。海鮮等水產提供的是動物性蛋白質，脂質量平均來說比肉類來得低，比紅肉來的理想。至於吃素的人就得多靠黃豆和黃豆製品來提供植物性蛋白質了。需注意：如果有腎臟病要與醫師或營養師了解適當的蛋白質攝取量，避免造成腎臟的負擔。'
