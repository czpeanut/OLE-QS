  section: 1
  number: 29
  type: single
  page: 3
  stem: "下列是約兒在書上看到的一段內容，關於文中東、西方兩教會的敘述，何者正確？\n   1053 年，君士坦丁堡牧首馬格爾．賽魯拉留斯把君士坦丁堡的拉丁禮教堂全數關閉，因其拒絕使用希臘禮拜儀式。賽魯拉留斯致函羅馬，指責教宗篡改《聖經》內容以及教義，質問西方教會聖餐用無酵餅是源自猶太教異端、安息日守大齋、准許食未出血的肉、四旬大齋期不唱《阿肋路亞》等。隔年，教宗良九世指派亨拜樞機等人到君士坦丁堡與希臘教會協商，但使節團並未達成任務。最後，教宗和君士坦丁堡牧首互相將對方破門，象徵著東西方教會的決裂。\n\
    （註：牧首：相當於西方教會的主教。破門：將神職人員逐出教會。）"
