  stem: 小米想在今年7 月的第一個週日於龍潭運動公園辦理文創市集，以下是他對於上述辦法的解讀，何者有誤？
  options:
  - label: A
    content: 他必須在活動前五日繳納使用費及保證金
  - label: B
    content: 他必須在活動結束後的一日內回復場地原狀
  - label: C
    content: 他必須在事前申請時檢附「警察機關許可文件」影本
  - label: D
    content: 如果臨時取消場地使用，必須在活動預定日的三天前提出。
  group_stem: '（二）                            桃園市公園場地使用辦法

    一、使用前：

    （一）申請使用公園場地應於使用日前十日填具申請書、切結書及詳閱收費標準，並檢附下列資料：

    1.營利性活動應檢附營利行為展售活動資料表

    2.申請使用場地集會、演說者，經管理機關核准並向場地所在地警察機關申請許可後，應於使用前檢附警察機關許可文件影本，報管理機關備查。

    （二）申請人應於公園場地使用日五日前繳納使用費及保證金後始得使用。

    二、使用後：

    （一）於公園場地使用期滿六小時內清除場地內之器物及垃圾，並於一日內回復原狀。回復後，應填具申請書、檢附回復原狀照片及退款帳戶資訊，向管理機關申請退還保證金。

    （二）如欲取消使用公園場地時，應於使用日三日前，以書面通知管理機關，所繳納之使用費及保證金無息退還。'
