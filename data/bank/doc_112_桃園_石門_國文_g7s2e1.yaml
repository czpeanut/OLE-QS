- id: doc_112_桃園_石門_國文_g7s2e1_s5_25
  section: 5
  number: 25
  type: single
  page: 3
  stem: 本文第二段細膩描寫了曬穀的過程，依序運用了什麼類別的感官摹寫？
  options:
  - label: A
    content: 視覺→ 聽覺→ 觸覺
  - label: B
    content: 嗅覺→ 聽覺→ 視覺
  - label: C
    content: 味覺→ 視覺→ 聽覺
  - label: D
    content: 觸覺→ 視覺→ 聽覺。
  group_stem: '（一）

    老家是傳統農家ㄇ形三合院，三面厝身圍繞的一片寬闊的門口埕。緊鄰道路的埕尾，早年幾乎家家設有豬欄和牛稠，稻草垛旁也養著雞鴨，矗立著將要荒頹的菸樓。空地上停放牛車、堆放甘蔗葉或者其他乾柴堆，這些雜什並不構成障礙，在沒有故事書、沒有玩具，更沒有電視的年代，門口埕就是我們的兒童樂園，捉迷藏、跳繩、跳房子和踢毽子，各戶人家埕口總有一隊嚷叫玩樂的兒童。

    門口埕最要緊的是用來曬稻榖、綠豆、紅豆、黃豆和所有需要曝曬的作物，因此不植樹不種花，埕面扎扎實實鋪滿了灰泥，大片的空，全心全意接收陽光的意思。夏季曬榖，一行一行黃澄澄的稻榖一遍一遍翻曬，腳下翻動的榖粒響聲愈來愈輕脆，而揚起的稻芒使人全身發癢，那種苦，那種熱，曬稻人也只能拄著耙柫遙望天邊凝滯不動的雲團歎息。

    逢年過節全家人團聚，晚間拉上燈泡在門口埕的長桌吃飯，比擁擠在屋裡更有節日感。冬日，陪老母在埕上曬太陽、曬棉被，鳥雀喧鬧。多年之後回想起這些片刻，都像陽光下的金子般閃亮，竟是人生少有的至福時光了。

    回到童年的起點，日照西斜時，天光宜人，拉把籐椅在屋簷下乘涼、看書。煙囪飄來燒熱水的木柴清香，在昏黃的光影中，門口埕充滿舊事舊物的無聲騷動。燕子歸巢低飛而過，一團蚊子在我頭頂上盤旋，咦，曾經在這埕上打棒球、羽毛球和踢筒仔的幾個帶著微微汗味的孩童、曬太陽的老人，都在哪裡？

    節錄自2024.2.20 自由副刊 黃昏的門口埕／鄭麗卿'
