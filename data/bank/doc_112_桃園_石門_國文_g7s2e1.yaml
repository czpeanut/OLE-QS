- id: doc_112_桃園_石門_國文_g7s2e1_s5_28
  section: 5
  number: 28
  type: single
  page: 4
  stem: 依據文章內容，這篇報導的標題最有可能為下列何者？
  options:
  - label: A
    content: 管理夜市，經濟部：攤販應繳稅
  - label: B
    content: 電商衝擊，台灣攤販變少變老
  - label: C
    content: 全台攤販近50 萬人，學歷愈來愈高
  - label: D
    content: 自稱「全台最老攤販」的養生秘訣。
  group_stem: '（三）

    受數位化影響的不只是實體店面，攤販亦受影響，主計總處調查顯示，年輕人寧可在網路創業，不想拋頭露臉當攤販，台灣攤販平均年齡52.2 歲，較五年前又老了2 歲，目前攤販的主力是60
    歲以上的老年人。

    主計總處五年一度的攤販經營概況調查，全國有30.7萬攤，47.6 萬人從事攤販，雙雙創下1988 年有攤販調查以來的首次衰退。攤販去哪兒了？調查顯示，各年齡層攤販數均在下降，唯獨60
    歲以上的老攤販人數，仍在增加中，目前逾60 歲攤販人數約為99240 人，占全體攤販32.3％，為各年齡層攤販人數之冠。

    五年前攤販主力為50 至59 歲族群，五年後，當年的中高齡攤販邁入花甲之年，仍堅守這一攤；年輕攤販加入不踴躍，30 歲以下攤販人數為11444 人，僅占所有攤販的3.7%，比五年前少了約4500
    人。

    數位經濟發達，網路開店成為趨勢，相較之下網路創業成本低許多，更重要的是不需拋頭露臉、餐風宿雨。另一方面，攤販轉業困難，況且能經營超過十年以上，表示生意不差，更會讓老攤販繼續做下去。因此台灣的攤販愈來愈老。

    逾90%攤販表示，未來一年會繼續從事攤販，僅6%想改行，想改行的攤販中有43%表示，如果找到適當行業會立即改行；也有10%的攤販表示，家計負擔減輕時立即轉業；21%的攤販等到籌足開業資金後，會轉型自營商號。

    資料來源：人間福報2019.6.25'
