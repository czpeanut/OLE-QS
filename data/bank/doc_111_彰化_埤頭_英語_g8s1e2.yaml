- id: doc_111_彰化_埤頭_英語_g8s1e2_s4_43
  section: 4
  number: 43
  type: single
  page: 2
  stem: What does this reading tell us?
  options:
  - label: A
    content: When does sleepwalking happen?
  - label: B
    content: What do sleepwalkers do during sleep?
  - label: C
    content: How to wake up a sleepwalker?
  - label: D
    content: What is sleepwalking?
  group_stem: 'I.

    Sleepwalking (夢遊) happens during a person''s deep sleep. A sleepwalker (夢遊者) gets
    up from bed when he is still sleeping.

    When a sleepwalker is walking in sleep, he may talk or shout with his eyes open.
    A sleepwalker may do weird (怪異的) things during sleep. For example, he might climb
    out of a window, move a sofa desk around the house, go outside, or even pee (尿尿)
    in the trash can (垃圾桶).

    When you see someone sleepwalking, don''t wake him up (叫醒) because he might attack
    you. Just walk near him and make sure he is safe. Turn him in the way to bed.
    A sleepwalker may suddenly wake up at any other place, but usually, he goes back
    to bed before he wakes up. After he wakes up, he seldom remembers anything.'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
  tags:
    textbook: 第三冊（八上）第2次段考範圍
