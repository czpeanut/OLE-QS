  stem: 小倩最近在寫一篇科幻小說，其部分內容如下：「西元 2856 年，人類面臨史上最大的生存危機。(甲)由於全球暖化造成海平面上升，許多低漥地區被海水淹沒，人類可以生存的區域越來越少。而(乙)持續升高的溫度，造成農作物的種植變得更加困難，也開始有大量的動物死亡，(丙)而全球暖化造成的海水溫度上升，使得全球珊瑚白化，許多的海洋生物也因而滅絕，海中生態系瀕臨崩解，在食物來源缺乏的情況下，人類還要面對其他物種的攻擊，(丁)原本生存於高緯地區的北極熊及棕熊開始往低緯度遷徙，並攻擊人類。」但小明在上述畫底線的文句中有一處的描寫不符合科學事實，請問何處可能需要進行修改？
