- id: doc_112_高雄_林園_自然_g9s2e2_s1_49
  section: 1
  number: 49
  type: single
  page: 6
  stem: 聖嬰發生時候，請問哪一地方比較容易乾旱？哪一地方比較容易水災？
  options:
  - label: A
    content: 印尼是水災，祕魯是乾旱
  - label: B
    content: 印尼是乾旱，祕魯是水災
  - label: C
    content: 兩地都是乾旱
  - label: D
    content: 兩地都是水災
  group_stem: '素養題：請閱讀以下文章，回答第49.題到第50.題

    「聖嬰」起源於南美祕魯和厄瓜多爾緊鄰太平洋東岸的漁民，發現每年12 月左右，風變弱了，海水溫度變暖了，海洋中的生物變少，這種現象每年都在聖誕前後發生，所以當地取名為”El
    Nino”，西班牙原文有「小男孩」和「幼年基督」的雙重義，我們翻譯成「聖嬰」現象。

    聖嬰現象發生時，海面和海水溫度都升高，但斜溫層反而下降，湧升流不再使下層養料豐富的冷海水上升到上層，結果藻類和浮游生物減少了，大小魚蝦也因缺乏食物和海水溫度改變而死亡或他遷，造成漁獲量突然減少。

    聖嬰現象是因為西太平洋的高氣壓及東太平洋的低氣壓所造成。 當太平洋上空的沃克環流變弱時，東太平洋的東風減弱，無法把表層較暖的海水吹到西太平洋，造成東太平洋的東部與中部海水變暖，當熱帶海洋的海水溫度異常地持續變暖，將會使得全球氣候發生變化，其中會使得西太平洋地區乾旱而東太平洋地區又降雨量過多。'
  answer:
  - B
  answer_source: answer_key_vlm
  tags:
