  type: single
  page: 3
  stem: '（  ）地理課，老師在介紹一些世界重要城市，許多城市都有其獨特的特色和歷史意義。當講到其中一個城市時，老師說中國近代史上有一份重要宣言便是在此簽訂，而此宣言的要點如下。請問老師最有可能在介紹哪一個城市

    (１)中、美、英三國盡一切力量對日作戰，以達到日本無條件投降為目的。

