  stem: （  ）小平爺爺的興趣是收集各時期的舊硬幣和紙鈔，來保存欣賞。這天爺爺拿著一張舊紙幣，告訴小平：「這是中國近代史上，財政金融改革的重要里程碑，在那個年代，市面上本來流通著各種貨幣，後來政府廢除銀兩，規定一律改用銀元；再過一陣子，政府規定只能用四家指定銀行，也就是中央、中國、交通、農民銀行所發行的紙幣，訂定為法幣，這終於解除了民國一直以來幣制混亂的局面。」請問上文小平爺爺所描述的應是下列哪一時期？
  options:
  - label: A
    content: 十年建設時期
  - label: B
    content: 十大建設時期
  - label: C
    content: 國共內戰時期
  - label: D
    content: 中日戰爭時期。
  tags:
