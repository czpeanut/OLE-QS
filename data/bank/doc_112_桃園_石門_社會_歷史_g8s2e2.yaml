  stem: （  ）中華民國國民政府在北伐初期，陸續征服各地軍閥，可是後來國民政府內部逐漸被親共人士所控制，因此造成國民政府內部產生分歧，蔣中正先生遂以武力清除國民黨內的中共分子，並另立政府，而有所謂「寧漢分裂」的情形產生。根據上述試分析，整個北伐期間中華民國國民政府所在地的先後順序為何？
