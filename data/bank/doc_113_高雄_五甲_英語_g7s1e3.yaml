  group_stem: 'Jessie: What time do you wake up in the morning?

    Maggie: From Monday to Friday, I wake up at 5 o''clock.

    Jessie: Me, too. I wake up early to be ready for work. How about on the weekend?

    Maggie: On the weekend, I wake up in the afternoon.

    Jessie: Really? I can''t. My body can''t let me do that. I wake up early on the
    weekend, too.

    Maggie: Oh, so, what time do you go to sleep at night?

    Jessie: I am in my bed about 11 and I quickly fall asleep after that.

    Maggie: No wonder you wake up so early on the weekend.

    Jessie: By the way, can you go to Jenny''s welcome party with me this week?

    Maggie: What day is Jenny''s welcome party?

    Jessie: It''s on Sunday afternoon.

    Maggie: What time is the party?

    Jessie: It''s at 3 p.m.

    Maggie: What? I just wake up at that time. I can go but I get there around 5 p.m.

    Jessie: The party ends at 5 p.m.

