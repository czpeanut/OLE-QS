  group_stem: '(四)

    　　在亞洲，有一種捉猴子的陷阱，他們把椰子挖空，然後用繩子綁起來，接在樹上或固定在地上留了一個小洞，洞裡放了一些食物，洞口大小恰好只能讓猴子空著手伸進去，而無法握著拳伸出來，於是猴子聞香而來，將牠的手伸進去抓食物，理所當然地，手便伸不出來，緊握的拳頭伸不出洞口。人來時，猴子驚慌失控，但就是逃不掉，並沒有任何人捉著猴子不放，相反地牠是被自己的執著所俘虜，牠只需將手放開就能伸出來。不過，就是內心中貪的欲念所致，鮮有猴子能放下。

    (周斯夫·葛斯汀 執著)'
