  group_stem: '(二)

    　　晉侯①賞從②亡者，介之推③不言祿，祿亦弗及。

    　　推曰：「獻公④之子九人，唯君在矣。惠、懷無親，外內棄之。天未絕晉，必將有主。主晉祀者，非君而誰？天實置之，而二三子⑤以為己功，不亦誣乎？竊人之財，猶謂之盜，況貪天之功以為己力乎？下義其罪⑥，上賞其奸，上下相蒙，難與處矣。」

    　　其母曰：「盍亦求之？以死，誰懟⑦？」對曰：「尤而效之，罪又甚焉！且出怨言，不食其食。」其母曰：「亦使知之，若何？」對曰：「言，身之文⑧也。身將隱，焉用文之？是求顯也。」其母曰：「能如是乎？與女偕隱。」遂隱而死。

