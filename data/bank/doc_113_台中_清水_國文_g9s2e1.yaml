- id: doc_113_台中_清水_國文_g9s2e1_s2_37
  section: 2
  number: 37
  type: single
  page: 4
  stem: 作者提出莊子「有大物者，不可以物；物而不物，故能物物。」這一段話加以印證，其表達的觀點最接近下列何者？
  options:
  - label: A
    content: 捨棄物質欲望，才能淡泊超然，遊走於天地萬物之間
  - label: B
    content: 科技來自人性，創新科技之餘更須考量人性最終需求
  - label: C
    content: 人心容易受到科技的操控，故應敬而遠之，才是智者
  - label: D
    content: 應該善用科技產品之便利，保有心靈自由而不受役使。
  group_stem: '(三)

    　　蘋果電腦的賈伯斯如果在另一個世界遇到莊子，而向他推銷 iphone，莊子會買嗎？相信很多人會認為莊子若活在這個時代，不僅對電腦和手機沒興趣，可能還會厲聲斥責。這主要是來自《莊子·天地篇》中的一個故事：

    　　子貢在路邊看到一個抱著水甕，來回辛苦澆水灌地的灌園叟，於是向他介紹利用槓桿原理來汲水的省力機械——桔槔。老人說：「吾聞之吾師，有機械者必有機事，有機事者必有機心。機心存於胸中，則純白不備；純白不備，則神生不定；神生不定者，道之所不載也。吾非不知，羞而不為也。」

    　　電腦和手機，正是灌園叟眼中的「機械」。使用者在不知不覺間受到操控，整天盯著畫面，情緒隨之起伏，這確實讓人「神生不定」。所以，認為莊子會排斥 3C 產品，也是言之成理。

    　　然而，灌園叟所抱的甕、所鑿的井，何嘗不是人類為了省力、提高效率而創造出來的產品呢？顯然，莊子不是要我們摒棄所有的工藝產品。喜歡莊子的海森堡在《物理學家的自然觀》特別指出，灌園叟所說的「神生不定」是「人類今日危機處境中最逼過的描述之一」，問題不是出在科技本身，而是來自它們的飛速進展，使我們無法適當地去適應。

    　　對於這個問題，我們在《莊子·在宥篇》裡也找到了相對應的看法：「有大物者，不可以物；物而不物，故能物物。」這段話顯然表示：我們不必排斥各種科技產品，重點在於因應的態度，如何能蒙其利而不受其害。

    　　所以，從這個角度來看，如果莊子活在這個時代，他應該也會使用電腦和手機，但卻不會受到賈伯斯的蠱惑，每隔一段時間就去追逐推陳出新的 i系列新產品。

    改寫自王溢嘉〈賈伯斯向莊子推銷 iphone〉'
