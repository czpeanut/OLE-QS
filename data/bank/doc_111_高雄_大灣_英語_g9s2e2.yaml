- id: doc_111_高雄_大灣_英語_g9s2e2_s4_33
  section: 4
  number: 33
  type: single
  page: 3
  stem: Where did dengue cases drop by 77%?
  options:
  - label: A
    content: Indonesia.
  - label: B
    content: India.
  - label: C
    content: Vietnam.
  - label: D
    content: Melbourne.
  group_stem: 'Using Bacteria to Stop Dengue Fever

    Every year, millions of people around the world become sick because of dengue
    fever. This dangerous tropical disease can make people very sick or even die.
    The World Mosquito Program (WMP) thinks they can work out the problem, though.

    The program is a nonprofit organization that’s linked to a university in Melbourne,
    Australia. There, scientists have thought of a way to stop the dengue virus in
    its tracks. The virus can’t take over a mosquito that’s carrying Wolbachia bacteria.
    That means mosquitoes that are given the bacteria won’t spread dengue fever. This
    plan has already been successfully tested in Indonesia, Vietnam, and Australia.
    In the first example, dengue cases in the test areas dropped by 77%. Soon even
    more cities will join the program and introduce Wolbachia to their mosquitoes.

