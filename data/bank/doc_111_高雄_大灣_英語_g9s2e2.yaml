  - label: C
    content: that Tony and I stopped dating each other
  - label: D
    content: while I was getting coffee at the café I loved
  group_stem: '請將以下A、B、C、D 四個選項填入21~24 空格中(不可重複)

    A. that Tony had a little girl on his shoulders

    B. that I miss being Tony''s girlfriend and the time we had together

    C. that Tony and I stopped dating each other

    D. while I was getting coffee at the café I loved


    This morning, I heard someone laughing 21 . I followed the voice, and it was Tony
    with his family. I noticed 22 . I could see that she got her eyes from him—so
    big and blue. He looked great and happy. I''m glad to know he is living a good
    life.

    It''s true 23 . However, I don''t regret making the decision to live our life
    without each other because we both have met the right people for us. I guess saying
    goodbye made us strong.

    I wouldn''t go back and change a thing. I''m thankful 24 although it hurt so badly
    then. It''s not wise to hold on to someone who''s not right for you. You just
    have to let them go, and life will lead you down a different road. I didn''t understand
    that, but now I see. Sometimes, yes sometimes, there''s good in goodbye.

    (adapted from Carrie Underwood''s song, "Good in Goodbye")

