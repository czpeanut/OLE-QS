    content: Other people don’t understand all the information you have.
  group_stem: 'There is always something that we don''t want others to know about.
    Sometimes we hide it for ourselves, and sometimes we help others with that. A
    study shows that a person can keep at least 13 secrets on average. In fact, the
    study also looks at how keeping a secret can hurt people''s health. When we help
    someone who believes that we can keep a secret, we are afraid that we will give
    away the secret and lose a friend''s trust. Then the friendship might be broken
    up in the end. What''s more, with the information we have, we may become unsure
    about what is the right thing to do. All the fear can bring us great stress. For
    some people, the hardest part is that they can''t stop thinking about the secret
    they are keeping. They often end up telling at least one person the secret. Many
    of us may feel excited when being told a secret. However, keeping a secret is
    really not something interesting.

