- id: doc_111_高雄_大灣_英語_g9s2e2_s4_38
  section: 4
  number: 38
  type: single
  page: 4
  stem: According to the reading, which is true?
  options:
  - label: A
    content: When your hard work pays off, you get nothing in return.
  - label: B
    content: As soon as Chiang Hsiu-chen finished vocational school, she became a
      ranger.
  - label: C
    content: On the climbing trip of age 17, Chiang didn’t make her wish of seeing
      snow come true.
  - label: D
    content: The beautiful sight of the mountains made Chiang fall in love with them.
  group_stem: 'Climbing the Mountain of Life

    Choose a job you love, and you will never have to work a day in your life. Chiang
    Hsiu-chen, whose career is to promote mountain education in Taiwan, has proved
    it. She is one of the greatest mountaineers in Taiwan and has spent most of her
    life doing what she loves—climbing mountains.

    Chiang''s love of mountain climbing started from a wish to see snow. To make it
    happen, she went on a climbing trip at age 17. Although she didn''t climb to the
    top, she reached her goal. The beautiful sight had her fall in love with the mountains.
    Later, Chiang became a mountain guide after her graduation from vocational school.

    After working for a few years, Chiang Hsiu-chen decided to climb the highest mountain
    in the world. It wasn''t an easy goal to reach. Chiang trained for a year and
    a half. She had to carry a bag that weighed 20 kilograms and run for an hour three
    times a week. However, her hard work paid off in the end. After two months of
    climbing, Chiang became the first woman from Taiwan to make it to the top of Mount
    Everest in 1995.

    Although climbing mountains isn''t easy, Chiang never gives up. It started from
    an interest and then grew into her life''s work. Today, she goes to schools to
    promote mountain climbing. Chiang Hsiu-chen has shown us that it''s possible to
    turn what we love into a career.


    About Chiang Hsiu-chen

    | 年份 | 經歷 |

    | --- | --- |

    | 1995 | became the first woman from Taiwan to top Mount Everest |

    | 2005 | became the first female ranger at Yushan National Park |

    | 2009 | became the first female mountaineer to top the seven highest mountains
    in all continents |

    | 2009 | was added to the list of Ten Outstanding Young Persons |


    promote 推廣 education 教育 prove 證實 mountaineer 登山家 guide 嚮導

    Mount Everest 聖母峰 female 女性 ranger 巡山員 continent 洲 outstanding 傑出的'
