  group_stem: 'Computers are getting more and more important today. They are useful
    machines which can help people do things at higher speed. During the first few
    years 25 they were just made, many people couldn’t see the reason 26 they should
    buy such a heavy thing at such a high price. As time went by, people began to
    realize that computers were a good helper to those 27 needed to do things faster.
    With the advance of science and technology, computers now can be made as thin
    as a book. Many people carry computers to any places 28 . They can even get to
    know people whom they have never met before without leaving their places. For
    one who lives in modern times, computers have really become an essential and important
    part of everyday life.

