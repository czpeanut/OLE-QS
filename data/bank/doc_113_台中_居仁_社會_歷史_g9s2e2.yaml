  group_stem: '(三) 以下是關於巴黎奧運吉祥物-弗里吉亞帽的介紹:

    弗里吉亞帽（ bonnet phrygien ）是一種質地柔軟的毛氈帽子，其特色為尖頂並且頂部會向前傾倒。這種款式的帽子最初起源於小亞細亞中西部的弗里吉亞地區，其地理位置大概是現在的土耳其中西部。

    弗里吉亞帽在古希臘文化中代表來自東方國度的文化象徵，後來在羅馬時期成為解放奴隸的服飾，在地中海地區的水手和槳奴中流行。到了18 世紀末的法國大革命時期，被來自法國南部的革命者自豪地用作自由的象徵，戴上它即代表著從奴役狀態轉變為打破束縛的自由之身，也因此弗里吉亞帽成為革命者的標誌。革命時期中的許多畫作和雕塑都描繪了戴著弗里吉亞帽的自由女神和其他象徵自由與共和的人物。

    最著名的畫作代表即珍藏在羅浮宮裡的「自由領導人民」( La Liberté guidant le peuple )。而在拉丁美洲地區的許多國家，例如尼加拉瓜、薩爾瓦多、哥倫比亞、巴拉圭以及古巴等國的國徽也都有弗里吉亞帽的身影，說它是個穿越世紀的自由象徵也不為過。'
