  group_stem: "五、\n    秦、楚交惡，楚左尹郤惡奔秦，極言楚國之非，秦王喜，欲以為五大夫。陳軫曰：「臣之里有出妻而再嫁者，日與其後夫言前夫之非，意甚相得也。一日，又失愛于其後夫，而嫁于郭南之寓人，又言其後夫如昔者。其人為後夫言之，後夫笑曰：『是所以語子者，猶前日之語我也。』今左尹自楚來，而極言楚國之非，若他日又得罪于王而之他國，則將用其所以訾楚者訾王矣。」秦王由是不用郤惡。\n\
    （劉基 郁離子 郤惡奔秦）\n註： ①軫：音ㄓㄣˇ。\n   ②出妻：被遺棄或休掉的妻子。\n   ③郭南：城南。\n   ④為：與。\n   ⑤「之」他國：往。\n\
    \   ⑥訾：音ㄗˇ，毀謗。"
