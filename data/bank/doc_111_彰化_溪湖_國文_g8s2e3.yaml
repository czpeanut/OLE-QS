  group_stem: "三、\n    劉伶病酒，渴甚，從婦求酒。婦捐酒毀器，涕泣諫曰：「君飲太過，非攝生之道，必宜斷之！」伶曰：「甚善。我不能自禁，唯當祝鬼神自誓斷之耳！便可具酒肉。」婦曰：「敬聞命。」供酒肉於神前，請伶祝示。伶跪而祝曰﹕「天生劉伶，以酒為命，一飲一斛，五斗解酲。婦人之言，慎不可聽！」』便引酒進肉，隗然已醉矣。\n\
    （世說新語）\n註：①病酒：發酒癮。\n  ②捐：放棄。\n  ③攝生：養生。\n  ④祝：以言詞告神祈福。\n  ⑤具：準備。\n  ⑥斛：十斗。\n \
