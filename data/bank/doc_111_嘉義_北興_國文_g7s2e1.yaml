- id: doc_111_嘉義_北興_國文_g7s2e1_s4_2
  section: 4
  number: 2
  type: essay
  page: 1
  stem: "著名作家吳淡如首次發表自己學習電腦繪圖的心得，但被網友指出是誤以為使用AI 繪圖。對此，吳淡如先是不斷回擊、封鎖網友，甚至宣布提告，引起網友與繪師的討論。最後，吳淡如在她臉書上道歉。\
    \ \n請問：人孰無過，然而因承認犯錯會付出的代價，所以在認錯的態度上有所遲疑。面對犯錯，請你提出一個對認錯的正面思維？（15 到30 字以內，要加標點符號）"
