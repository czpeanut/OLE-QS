- id: doc_111_嘉義_北興_國文_g7s2e1_s4_1
  section: 4
  number: 1
  type: essay
  page: 1
  stem: "張育成因中華隊在經典賽輸給古巴隊而無緣晉級，他走回休息區時淚流不止。接受訪問時，他吐露旅外心聲：「在國外很孤單，沒有人站在我這邊，只能默默吃苦，但在打經典賽時則相反，感覺大家都站在我這邊。」\
    \ \n請問：活在世上，獨處比人際陪伴、肯定的時間更多，所以學習獨處，是我們終身都必須學習的人生課題。若是你，會用何種心態去面對獨處呢？（15 到30 字以內，要加標點符號）"
  tags:
    textbook: 第二冊（七下）第1次段考範圍
