- id: doc_111_嘉義_北興_國文_g7s2e1_s5_2
  section: 5
  number: 2
  type: single
  page: 1
  stem: 請問下列關於新詩〈傘〉中句子的說明，何者正確？
  options:
  - label: A
    content: 「單純兒歌的透明音符」指的是雨聲，且從此句可看出作者「童叟無欺」的生命態度
  - label: B
    content: 「幅幅相連 以蝙蝠弧形的雙翼」，意指傘半開時，傘骨連接成的同心圓像蝙蝠的翅膀
  - label: C
    content: 「各種顏色的傘是載花的樹／而且能夠行走……」，其中的「……」代表「意思未盡」，指的是這些傘除了行走外，還有其他諸多能力
  - label: D
    content: 「自在自適的小小世界」，在全詩中具有承上啟下的功能，上承「連成一個無懈可擊的圓」，下啟「亭中藏一個寧靜的我」。
  lesson_raw:
    title: 傘
    basis: 題幹提及新詩〈傘〉
  tags:
