    artists of all time. As a songwriter, she has received awards from the Nashville
    Songwriters Association and the Songwriters Hall of Fame, and was included in
    Rolling Stone’s 100 Greatest Songwriters of All Time in 2015. Her other accolades
    include 10 Grammy Awards, one Emmy, 23 Billboard Music Awards, six Guinness world
    records, and appearances in Time’s 100 most influential people in the world (2010,
    2015, 2019).


    2006

    Her eponymous debut album was the longest-charting album of the 2000s in the U.S.
    The album’s third single, “Our Song”, made her the youngest person to single-handedly
    write and perform a number-one song on the Hot Country Songs chart.

    2008

    Swift’s second album, Fearless, became the best-selling album of 2009 in the U.S.
    The album won four Grammy Awards, and Swift became the youngest winner of Album
    of the Year.

    2010

    Swift was the only writer of her album Speak Now. It debuted at number one in
    the U.S., and the single “Mean” won two Grammy Awards.

    2012

    Her fourth album, Red, yielded the successful singles “We Are Never Ever Getting
    Back Together” and “I Knew You Were Trouble”.

    2014

    For her fifth album, the pop-focused 1989, she received three Grammys and became
    the first woman and fifth one to win Album of the Year twice. Its singles “Shake
    It Off”, “Blank Space”, and “Bad Blood” reached number one in the U.S., Australia
    and Canada.

    2017

    Her sixth album, Reputation , and its leading single, “Look What You Made Me Do”,
    topped the UK and U.S. charts; with the release of Reputation, Swift became the
    first one to have four albums sell one million copies within one week in the U.S.

    2019

    Her seventh album, Lover, spawned two U.S. number-two singles, “Me!” and “You
    Need to Calm Down”.


