  group_stem: "A.\n    Last October, a team of 12 climbers and 3 bus drivers started\
    \ a challenge of climbing up to the three highest mountaintops in Britain. That\
    \ is, they have to finish climbing the highest mountains of Scotland (Ben Nevis),\
    \ England (Scafell Pike) and Wales (Snowdon), in 24 hours with about 10 hours\
    \ of driving between the mountains. (See the picture below.) (27) _________, they\
    \ trained very hard and made a careful plan before they set out. They would start\
    \ at the foot of Ben Nevis and finish at the top of Snowdon. They started at 6\
    \ on a beautiful fall morning. They (28) ________ the top in three hours. On their\
    \ way down, one member found he dropped his phone on the top. They spent another\
    \ 20 minutes (29) _________. They reached the foot of the second mountain, Scafell\
    \ Pike, early in the evening. After taking 6 hours of rest on the bus, they started\
    \ their second climb. As it got darker, they had to slow down for safety. It took\
    \ longer than expected, about 4.5 hours, to finish Scafell Pike. Because the traffic\
    \ was light, they were on time for their last climb. Soon after they started the\
    \ climb, they had to slow down again because of the heavy rain. Later, (30)________\
    \ Because it rained heavily, 5 climbers decided to go back to the foot of the\
    \ mountain. Others kept climbing up. The moment they reached the top, the sky\
    \ cleared. Although they were not successful with the time challenge, they were\
    \ with the climb challenge."
  shared_asset: g3_27_32
