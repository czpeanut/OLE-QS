  stem: 36. What does the sentence a study gives this idea a leg to stand on probably
    mean in the reading?
  options:
  - label: A
    content: This study puts this idea on the map.
  - label: B
    content: This study makes the doctors famous around the world.
  - label: C
    content: This study makes it possible for people to believe this idea.
  - label: D
    content: This study is successful in cheating people into believing this idea.
  group_stem: 'C.

    It is said that all of a person''s memories may show up like a movie or a TV show
    in their mind before they come to the end of their life. To our interest, a study
    gives this idea a leg to stand on. Some doctors at Vancouver General Hospital
    took a closer look at the brain waves of an 87-year-old man in the computer when
    he died of a heart attack. The team noticed a strongly working brain 30 seconds
    before and after his heart stopped. The brain waves moved in the same way as those
    when people are dreaming. The finding made the doctors guess that the man could
    have replayed his life memories. However, doctors in other hospitals don''t believe
    the finding and think it is hard to understand a dead person''s experience only
    with waves in the computer. In spite of this, the finding still gave a good start
    for more studies on people''s death experiences. Perhaps, it is sad to face the
    fact that our loved ones are away from us for good, but it warms our heart that
    their brains may be replaying some of the best moments in their past life.

