  stem: 40. What does fit in mean?
  options:
  - label: A
    content: Become popular with all their friends.
  - label: B
    content: Have better grades to be the leader.
  - label: C
    content: Show their pressures to get noticed.
  - label: D
    content: Be part of the group.
  group_stem: "E.\n  It is not easy to be a teenager. Teenagers are young people between\
    \ 13 and 19 years old, between children and adults. During those years, teenagers\
    \ are usually in high school. They worry about many things, such as their grades,\
    \ looks, and getting along with their classmates. For example, when students come\
    \ to a new class, they want to fit in the group. They want to make friends and\
    \ become popular. It is important for them to have good social skills. It is important\
    \ for parents and teachers to help them if they turn to parents and teachers for\
    \ help.\n\n  Students may have many pressures. Pressure will become anxiety if\
    \ they don't deal with the pressure well. In a survey in America, most of the\
    \ teenagers have anxiety problems. When they have anxiety, they feel nervous and\
    \ upset. Too much anxiety is bad for anyone. When they have too much anxiety,\
    \ they may hurt themselves and act irrationally. Most of students' anxiety comes\
    \ from schoolwork. About 50% of them say they feel pressure to get good grades.\
    \ 20% of the teenagers feel peer pressure. They are afraid of having no friends.\
    \ About 20% say they have bullying problems. Bullies will treat them badly, make\
    \ fun of them and even hurt them sometimes. Other teenagers feel pressure to look\
    \ good. They care about their body images. (Body image is about a person's look\
    \ and body.) Knowing their problems is the first step to help them. Parents and\
    \ teachers should listen to their worries and always be there if they need help.\n\
