- id: doc_113_高雄_楠梓_英語_g9s1e2_s3_38
  section: 3
  number: 38
  type: single
  page: 6
  stem: 38. According to the passage, which of the following sentences is TRUE?
  options:
  - label: A
    content: The Amish live a simple life and do not like modern technology at all.
  - label: B
    content: The number of people of the Amish is growing fast because of the help
      in modern medicine.
  - label: C
    content: Amish people have been used to living in America by keeping their own
      lifestyle.
  - label: D
    content: Not until Amish men get married can they grow either beards or mustaches.
  group_stem: "D.【配合「和世界作朋友」社區主題】\n  In the 18th century, a small Amish group arrived\
    \ from Europe and set to live in Pennsylvania, USA, to look for religious freedom.\
    \ Today, their unique way of life is almost the same with what it was then: a\
    \ simple way of life, colorless dress, love to God and rejectionof many kinds\
    \ of modern technology. The Amish economy is largely based on agriculture and\
    \ small businesses. They often use horse-drawn-carriages for transportation and\
    \ use oil lamps and wood stoves for lighting and heating. In recent years, however,\
    \ many Amish people have been used to using electric bicycles because they are\
    \ faster and don't produce pollution like cars do. The Amish are known for their\
    \ strong community bonds and often get together for church services, weddings,\
    \ and other important things.\n\n  The Amish wear very simple clothing. Amish\
    \ men dress in colorless shirts, big hats, and suits. They all grow beards to\
    \ show they are adults and married. Men cannot grow mustaches because mustaches\
    \ have something to do with the military and violence, and the Amish are not allowed\
    \ to do that. On the other hand, Amish women wear aprons and dresses that go down\
    \ to their calves, with boring colors, and cover their heads with bonnets, a hat\
    \ tied under the chin. Unmarried women wear black bonnets while married women\
    \ wear white ones. Although the Amish have a simple lifestyle, they are not opposed\
    \ to modern medicine and often look for medical care from outside their community.\
    \ However, for their religious belief, children are seen as the love of God and\
    \ they don’t do any form of birth control. Thus, they usually have large families,\
    \ with a number of seven to eight children per family. Overall, the Amish are\
    \ a unique and interesting group, deeply pay their love to their beliefs and way\
    \ of life, and live in a way that is often quite different from the main culture.\n\
    \n  If you are interested in knowing more about Amish culture and lifestyle, the\
    \ Amish Village in Lancaster County will give you the Amish Farmhouse & Village\
    \ Tour. Tickets are sold on website, and tours start every 15 minutes. The money\
    \ for the tour is $13 for adults, $7 for youth aged 5-17 and free for children\
    \ under 4. The tour has a 25-minute guided tour of the house, a guide ready to\
    \ answer visitor questions, and a self-guided tour of the village.\n小字典\nreligious(宗教的)\
    \ unique(獨特的) rejection(拒絕)\neconomy(經濟) agriculture(農業) carriages(馬車)\ntransportation(交通)\
    \ community bonds(社區連結) beards(鬍子)\nmustaches(絡腮鬍) military and violence(軍事與暴力)\
    \ calves(小腿)\nchin(下巴) opposed(反對)"
