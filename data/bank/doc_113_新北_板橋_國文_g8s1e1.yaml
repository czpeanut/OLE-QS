- id: doc_113_新北_板橋_國文_g8s1e1_s5_24
  section: 5
  number: 24
  type: single
  page: 6
  stem: 從上文的第一段中，可看出《憤怒鳥》對開發商洛菲歐公司產生何種影響？
  options:
  - label: A
    content: 公司的領導階層都成為愛鳥人士
  - label: B
    content: 公司的整體形象以鳥為設計主軸
  - label: C
    content: 公司的環境布置很適合鳥類居住
  - label: D
    content: 公司規定員工都要養鳥作為寵物
  group_stem: '坐在全球最成功遊戲《憤怒鳥》的開發商洛菲歐的「肥鳥」（Fat Bird）會議室裡。我看著手上拿到的名片，覺得十分特別。負責公關與對外特許商品合作的副總裁海傑瑞(Ville
    Heijari)，他的頭銜不是公關副總，而是「鳥語人」（Bird Whisperer），負責美國業務拓展，讓《憤怒鳥》進軍電影業的功臣──副總裁費斯特貝卡，叫作「威武的雄鷹」（Mighty
    Eagle）。

    《憤怒鳥》創造的傳奇太多。這個把鳥架在彈弓上，用觸控手機的感應拉彈射出，突破磚頭、木板、鋼鐵等障礙，擊垮所有的綠豬就算過關的簡單遊戲，卻有超過七千五百萬個玩家數風靡，比全球最夯線上遊戲《魔獸世界》還高出五倍。從英國首相卡梅隆、澳洲總理吉拉德到三歲小孩都是它的粉絲。

    2009 年一個下午，洛菲歐的設計師利薩羅(Jaakko Lisalo)在閒暇之餘，隨手畫出一隻沒有腳也沒有翅膀，只有一隻沒有腳也沒有翅膀，只有一對瞪眼粗眉毛的胖鳥。不久後，一個用鳥射擊磚塊消滅綠豬的遊戲成形，之後花了八個月的時間反覆修改上千次。

    《憤怒鳥》一夕成名。但，洛菲歐不斷琢磨細節，墊高《憤怒鳥》門檻。光是要設計出不同鳥的個性、能力，以及彈射的重量、速度、弧度，就需要非常精準的物理引擎和數值系統，才會讓每一次發射造成的滾動和破壞，產生合理的結果。

    擁有十年手機遊戲開發經驗、極致行動科技總經理連建欽說：「它背後有非常細繳的設計與規畫」，例如玩家心理的掌握。一般遊戲介面，為了怕玩家不耐煩，通常會加快進行速度，但這若放在手機介面上，則容易讓遊戲出現當機等狀況。

    《憤怒鳥》用很「休閒」的拋物線飛行方式，解決了這問題。而這個滅慢的反應時間，不只能讓手機上的執行效能更好，還可讓玩家放鬆思考下一步策略。

    鑽研人因工程長達三十年的工程師茂羅分析，「《憤怒鳥》創造一種讓人上瘾的心理模型」，這個模型叫作「差點擊中」，簡單說就是賭徒心理。就是當人在「差一點成功」時，會產生短暫挫折感，從而激發你「再來一次」的欲望，而形成反覆不停的迴圈。你會像賭博般「上癮」。迴圏進行時間越短，重複嘗試意願就越高，直到成功為止。

    ——節選自曠文琪、林俊劭獨家深入憤怒鳥基地'
  answer:
  - B
  answer_source: answer_key_vlm
