  group_stem: "俗話說：「瓜熟蒂落」，每當夏末秋初之際，走進果園，蘋果園、梨樹的枝條，沉甸甸的果子壓得彎彎的，到處都洋溢著豐收的喜悦。離開收果子只有半個月了，但是，就在這最後的時刻，幾乎有一半成熟了的果子，會從樹上掉下來，跌傷以至爛掉！\n\
    \    為什麼會「瓜熟蒂落」呢？原來，在平常，果實與樹枝之間是依靠一根根「繩子」——果柄上的一些纖維束連在一起的。當果實成熟時，果柄上的細胞開始衰老了，營養不足，而且在果柄的根上形成了一層所謂「離層」，它好像一把刀子似的，把果柄齊根切斷了。這樣，稍遇風吹草動，果實便紛紛墜地了。\n\
    ——陽明書局 十萬個為什麼"
  answer:
  - A
