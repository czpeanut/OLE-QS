  type: single
  page: 1
  stem: 小愛到印度旅遊，看到不少圍牆高築的私人別墅，但一牆之隔的路邊卻多是塑膠搭成的簡易住家。印度社會貧富差距之大，令生活在臺灣的小愛感到不可思議。下列有關印度階級劃分的敘述，何者正確？
  options:
  - label: A
    content: 向行人乞討者應是屬於古印度時期的平民階級
  - label: B
    content: 佛教的盛行擴大了階級間的差距
  - label: C
    content: 印度嚴明的階級劃分與種姓制度有關
  - label: D
    content: 現今印度不再受到階級制度的影響。
