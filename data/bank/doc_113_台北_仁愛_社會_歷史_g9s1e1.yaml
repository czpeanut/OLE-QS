  stem: 達利人(Dalits)是被排除在階層之外，比奴僕階級地位更低的族群。數千年來，他們都被排斥到社會的邊緣。拉維庫馬先生便屬於此一族群，他創辦了「救助自願者協會」，幫助安德拉邦省被邊緣化的達利人了解自己應該享有的基本人權，積極為達利人爭取平等的生存機會。請問上文中的安德拉邦省達利人應位於下列何處?
