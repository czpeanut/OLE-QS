  stem: 「腓尼基人」為古文化的一支重要的民族，其時常往返於歐、亞、非三洲，因此成為文化傳播的重要推手。下列關於「腓尼基人」的敘述當中，何者正確？
  options:
  - label: A
    content: 古埃及的文字透過腓尼基人的簡化後，傳到地中海一帶而逐漸成為西方拼音文字的基礎
