  group_stem: '※宗教是對神明的信仰與崇敬,也可以說是對宇宙存在的解釋,宗教本身內涵著一部道德準則,以調整人類自身行為,透過宗教的發展可以了解不同文化發展的各種的差異。請依據下文回答第31
    題~第35 題：

    甲宗教：「我們認為神只有一個，只有我們是上帝的選民，只要信仰上帝，就可以上天堂。」

    乙宗教：「對我們而言，不論神有多少個，只要人生在世完成屬於自己階級的責任，才能輪迴到較高階級。」

    丙宗教：「我們主張只要摒除貪念與慾望，潛心修行，眾生平等皆可超脫輪迴，免受生老病死之苦。」

    丁宗教：「我們的神有善、惡之分，我們當然要支持善神，把惡神趕走！世界末日來臨，才能上天堂。」

    戊宗教：「我們認為神有多種類型，也相信人死後靈魂依然存在，必須保留身體以保證與靈魂的結合。」

    己宗教：「我們的神祇,掌管自然和生活的各種現象與事物，神與神、神與人的愛恨情仇都記載在神話故事。」'
