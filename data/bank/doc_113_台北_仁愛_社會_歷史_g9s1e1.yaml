  section: 1
  number: 4
  type: single
  page: 1
  stem: 「虞弘墓」位於山西省太原市，是一座隋朝官員虞弘與其妻子的合葬墓，他生前常出使西域國家，之後擔任「薩保」這種官職， 專門來管理進入中國的外國人事務，其石棺上的浮雕，刻有聖火，表明他是一位某宗教信徒。根據虞弘的信仰判斷這個宗教最有可能是？
