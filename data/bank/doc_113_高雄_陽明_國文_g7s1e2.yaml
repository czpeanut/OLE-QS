  type: single
  page: 5
  stem: 根據內容判斷，此篇公告是由下列哪一機關發布？
  options:
  - label: A
    content: 中華民國農業部
  - label: B
    content: 農業部農糧署
  - label: C
    content: 高雄市政府農業局
  - label: D
    content: 高雄市當地農會。
  group_stem: '山陀兒颱風農損全品項現金救助 即日起受理申請

    高雄地區受山陀兒颱風影響，本市農產業累積損失金額已達1 億573.6 萬元，經市府積極爭取，農業部同意辦理公告本市農產業全品項納入農產業天然災害現金救助及低利貸款，自10
    月10 日至10 月24 日止受理農民申報。

    高雄地區受到山陀兒颱風強風大雨影響，暴風圈壟罩本市超過60 小時，多達21 區有10 級以上陣風，仁武、林園區更出現15 級強陣風，高雄港更測得破紀錄的17
    級強陣風，超過凱米颱風13 級，造成各區嚴重災情，至10 月9日農損累積已超過1 億，各公所仍持續查報中。本府積極爭取本市全品項救助獲農業部同意辦理現金救助及低利貸款外，也成功爭取大社區、大寮區、大樹區、仁武區、林園區、燕巢區、鳥松區、橋頭區、梓官區：番石榴、香蕉、棗類、紅豆、洋蔥苗圃、蔬菜類全品項，以及岡山區：苦瓜，仁武區、燕巢區、楠梓區、橋頭區：西瓜、香瓜等品項為免現勘區域，倘有客觀種植證明文件：產銷履歷、天然災害救助、農業保險、申辦綠色環境給付計畫等或使用農業部「農業天然災害現地照相APP」拍攝災損照片，區公所得免勘查，加速救助程序，盡早協助農民復耕。

    並鑒於本次強風導致農友溫網室設備損害嚴重，為減輕農民負擔，市府配合農糧署113 年風災災損溫網室設施重建輔導措施，加碼網布及披覆組件的補助，由農糧署補助1/3，本府加碼補助1/3。

    農業局局長張清榮提醒農友，請本市農作物受災損失達2 成以上之農友，可先利用「農產業天然災害現地照相APP」拍照，並務必於113 年10 月24 日前，持身分證、印章、農會存款簿及土地所有權狀或土地使用同意書等相關文件，儘速向土地所在區公所申辦現金救助，本府也會全力協助與加速勘災與現金救助發放，農友加速復耕若需低利貸款及申請每公頃2
    萬元有機質肥料的補助，可洽當地農會辦理。'
