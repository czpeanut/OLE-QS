  type: single
  page: 2
  stem: "根據下文，文中「駝背老人」和〈那默默的一群〉中的「清道婦」，他們同樣具備下列選項中哪一種做事態度？\n\n孔子到楚國，走進樹林，看到一位駝背老人，用頂端塗上樹脂的竹竿捉蟬，只見他一黏一隻，就像在地上拾取一樣容易。孔子問老人：「您捉蟬這般巧妙，其中可有什麼方法嗎？」老人回答：「當然有。經過五、六個月的練習，疊兩顆彈丸在竹竿頂端不會掉，失手的情況就很少了；疊三顆彈丸不會掉，捉十次才會失手一次；疊五顆彈丸不掉，捉蟬就像在地上拾取一樣。我站在樹下，就像臨近地面的斷木，我的手臂，就像枯木的樹枝。不管天地之大，萬物之多，我只看見蟬的翅膀。不管周圍發生什麼事，都不能分散我的注意力。能夠做到這一步，還怕捉不到蟬嗎？」孔子轉身對學生們說：「專心一致，高度凝聚精神，才能出神入化，這就是駝背老翁說的意思！」\
    \  \n                                      改寫自莊子〈痀僂丈人承蜩〉"
