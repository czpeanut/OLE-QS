- id: doc_113_高雄_陽明_國文_g7s1e2_s3_39
  section: 3
  number: 39
  type: single
  page: 5
  stem: 根據上文，拄拐杖的小男孩出場之前，作者為什麼先描述哭鬧的韓國小男孩？
  options:
  - label: A
    content: 暗示事件發生背景在韓國
  - label: B
    content: 襯托拄拐杖小男孩的獨立
  - label: C
    content: 烘托綠意夏天的生機盎然
  - label: D
    content: 展現一年級小朋友的興奮。
  group_stem: '那還是個檸檬綠的夏天，我們興奮地站在指定的那棵大樹下排隊等校車。這是第一天，小朋友臉上的表情透露其年級：一個鬈髮的韓國小男孩牽著媽媽的手一路哭過來，不用猜，一年級。

    接著，所有人的眼光被他吸引，一個拄枴杖的小男孩。

    他從最遠的那區宿舍村走來，銀色陽光照著瘦小身影，兩根枴杖之間是歪歪斜斜的步伐，臉上戴眼鏡，背著書包。他的媽媽推輪椅走在後面。

    距離一箭之遙，隊伍這裡有人喊他，他的小枴杖划得快起來，但腳的速度跟不上手的意志，改以聲音回應同伴的招呼。

    他未加入排隊，站在隊伍旁邊。我因此看到他有一張開朗的美國小男孩的臉，牙齒未長齊，左耳戴著助聽器。媽媽也是溫和強壯的樣子。他們各與朋友聊著。草地上，小朋友排隊，七八個媽媽話家常。

    校車來了。小男孩先上，媽媽收好輕便輪椅遞給女司機，彼此笑著招呼，很熟悉的模樣。其他小朋友一一上車之後，巴士開走。

    一個拄杖小男孩上學了。不知怎地，早晨的印象像鳥兒整日在腦海迴旋，令我莫名不解。我重新回想陽光下他與媽媽遠遠走來的情景，終於了解盤旋的原因在於，那印象如此明亮，自在，溫和。這些跟我所來自的那個社會同樣遭遇者的處境不同，天與地般不同。

    節錄自〈拄拐杖的小男孩〉'
