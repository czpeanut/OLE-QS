  stem: 根據〈甲文〉內容，孔子及弟子在陳絕糧的原因最不可能為下列何者？
  options:
  - label: A
    content: 陳、蔡兩國刻意阻撓
  - label: B
    content: 用心講學至廢寢忘食
  - label: C
    content: 接受邀請欲前往楚國
  - label: D
    content: 熟悉各國情勢及缺失。
  group_stem: '〈甲文〉

    孔子在周遊列國時，受到楚昭王邀請，便帶弟子前往楚國欲答拜楚昭王；途經陳國與蔡國之時，陳、蔡兩國的大夫互相謀劃著說：「孔子是當今世上少有的聖賢，深知諸侯各國的弊病。如果他為楚國所用，那麼陳國和蔡國就危險了。」於是派人將孔子截於途中。孔子和弟子沒有辦法往前行，導致絕糧七日，幾乎沒命。在那七天裡，孔子與弟子們無法與外界聯繫，就連粗劣的食物都不夠充飢。面對如此困境，旁人很是憂慮，但孔子卻愈加用心講學，心志更堅，與弟子一起歷練，還弦歌不斷。甚至藉此機會對弟子們因材施教，使他們深受啟發。


    〈乙文〉

    籤詩 啞人得夢口難言，瞎眼穿針更不然，九曲明珠穿不過，孔子在陳必絕糧。'
