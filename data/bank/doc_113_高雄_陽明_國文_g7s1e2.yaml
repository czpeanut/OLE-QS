  group_stem: "360 度探索是一種探索自己潛意識的方法。設定一個「自己珍視的事物」，從各種角度用文字寫出30 個那項事務的特徵。設下時間限制，盡可能多寫一些，可以發掘連自己都不曾意識到的事。相信你能從中發覺自己潛在的思維，獲得新的視角。\n\
    \    選定探索對象\n    設定一樣「自己珍視的事物」。比方說長久以來愛用之物、一直很重視的時間、總是隨身攜帶的物品等，請具體地想像並選定一樣。\n\n\
    【甲】用10 分鐘寫出對象的特徵\n用文字把「自己珍視的事物」的特徵寫在格子裡。設定時間限制，要在時間內寫出來，因此能強制性地想出種種特徵。\n\n【乙】畫線隔成30\
    \ 格\n畫線隔成30 格。格子有大有小，思考起來會比較有樂趣，因此不必用尺畫。\n\n【丙】拚命填滿所有格子\n細思慢想的話，會趕不及在10 分鐘內填滿所有格子。反正就拚命把想到的特徵都寫出來，可以轉換視角，從各種方向去思考並寫出特徵。\n\
    \n發掘不曾意識到的部分\n待全部格子都填滿，看著所寫的特徵，找出過去不曾意識到的部分。思索自己珍視那樣事物的理由，會發覺自己做選擇時的標準和價值觀。\n\
    節錄自《用圖像解決問題的視覺思考大全》"
