  stem: 'Below are the ideas that are talked about in the reading.

    a. The problems Darayya has.

    b. How Darayya’s library was started.

    c. What makes Darayya’s library special.

    d. How Darayya’s library helps people there.

    In what order does the writer put his ideas in the reading?'
  options:
  - label: A
    content: c → b → a → d
  - label: B
    content: b → a → d → c.
  - label: C
    content: a → c → b → d.
  - label: D
    content: c → a → b → d.
  group_stem: "Darayya’s Library\nJohn Edwards, July 21 2016\n  In Darayya, a city\
    \ in Syria, there’s a library, and it has 15,000 books on almost every subject.\
    \  However, it is different from any libraries you know. It is a secret underground\
    \ library, and only people in Darayya know where it is.\n  Over the years, war\
    \ has shaken Darayya badly.  Every day, houses are bombed and people are killed.\
    \  Stores are closed one after another, and schools are, too.  To help the kids\
    \ in Darayya with their learning, Anas Ahmad, a 19-year-old student, and his friends\
    \ decided to build a library.  They built the library under the ground to keep\
    \ it safe from bombing.  But it is dangerous to collect books for the library.\
    \  Often, Ahmad and his friends look for books in houses that were bombed.  They\
    \ need to be careful because they may be killed in another bombing.\n  You may\
    \ ask, “In a place like Darayya, would people be interested in books?”  “Just\
    \ like the body needs food, the mind needs books,” says one library user.  In\
    \ the library, people enjoy their time of reading and forget about the terrible\
    \ world above.  Through reading, they are able to dream of a better life after\
    \ war.\n  Syria 敘利亞  war 戰爭 bomb 轟炸"
  shared_asset: g2_19_21
  tags:
