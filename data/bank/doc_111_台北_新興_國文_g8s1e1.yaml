  section: 4
  number: 2
  type: single
  page: 1
  stem: 下列選項中的文句，何者用字完全正確？
  options:
  - label: A
    content: 一傘在握即可以做為扶持，保護的工具，也可以欣賞休契，一切全操之在我
  - label: B
    content: 以細細一線與整座天空拔河的景象，意味著憑藉勇氣與毅力，展現以小搏大的奮鬥精神
  - label: C
    content: 旦自從我把書桌從前面的房間移到後面之後，才幾天，我就發覺我的頭腦裡裝了許多新的時鍾
  - label: D
    content: 失意時瞧瞧百合水仙，它一點色彩都沒有，還不是挺起枝斡；抬起頭你該學那蓮花，它不只頂上開花，它也在水底成偶。
  tags:
    textbook: 八上 第五課 田園之秋選
