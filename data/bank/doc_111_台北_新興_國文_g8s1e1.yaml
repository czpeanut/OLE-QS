  stem: 楚人分辨「螳螂伺蟬自障葉」的方法，是下列哪一選項？
  options:
  - label: A
    content: 於樹下仰取葉
  - label: B
    content: 面見縣官，自說本末
  - label: C
    content: 一一以葉自障，問其妻
  - label: D
    content: 齎葉入市，對面取人物。
  group_stem: '楚人居貧，讀《淮南方》，得螳螂伺蟬自障葉，可以隱形。遂於樹下仰取葉。螳螂執葉伺蟬，以摘之。葉落樹下，樹下先有落葉，不能復分別，掃取數斗歸。一一以葉自障。問其妻曰：「汝見我否？」妻始時恆答言「見」。

