- id: doc_113_高雄_翠屏_國文_g8s2e1_s4_9
  section: 4
  number: 9
  type: single
  page: 6
  stem: 根據本文，作者為什麼喜歡「海洋」？
  options:
  - label: A
    content: 海象的瞬息萬變，令人感受到無窮盡的魅力
  - label: B
    content: 海浪的來回往復，如同天地萬物自有其秩序
  - label: C
    content: 海上的寬闊視野，讓人從瑣碎事物中掙脫
  - label: D
    content: 海洋的亙古不變，平衡了倦於應變的靈魂。
  group_stem: "曾經在俯視大海、建造在山坡上的一棟禪房中度過難忘的一晚。那次我是為著看海和重新回到澈底的平靜而來的。所以當暮色漸重，視力所及，已經看不到海面上的點點帆船和層層波紋之後，我熄掉房間內所有的燈光，讓自己慢慢的滑入無邊的黑暗裡，面對大海。\n\
    \  經過了這麼悠長的時間與海之間的相處，海對我來說，已經猶如熟悉的陌生人，因為時間而遙遠，同時也因為時間而如此親切，是那種你可以隔著很遠的距離向對方眨眼，而心裡篤定對方會解讀出你的心情的親切。\n\
    \  這就猶如琥珀形成的過程，你慢慢側身進入黑暗，天衣無縫的如同游進去一片溫潤的水域一樣，龐大的黑暗逐漸包裹住你的身體和身體外面的世界，一切都被巨大的籠罩感凝結起來，我們就這樣成為生命的樹幹上那一滴用水晶雕刻出來一般，似乎隨時都有可能滴落的琥珀露珠。\n\
    \  在這樣的黑暗中，我們能說什麼呢？我們只能沉默。這樣的沉默來自於一種與命運在久經考驗之後建立起來的默契。因為我彷彿看到，生命雖然可以像風中飄零的落葉，但是只要能跟夜色與海洋一起呼吸，飄零也可以是一種飛翔。即使是隨波逐流，我們還是可以選擇姿勢。\n\
    \  我一直覺得，黑暗是現實與想像的世界之間的一條界線，我們在黑暗中想起白天時這裡曾經的明亮喧譁，各種聲音，言語與煙塵的交雜，簡直就是漫長世紀以前的事情，完全的另外一個世界。而在現在的世界裡，我們睜大眼睛什麼都看不到，心才重新成為一切事物的核心，所有的畫面都不是從感官，而是從內心的想像生長出來，像百年老樹的枝枒，轉瞬間就填滿黑暗山谷。\n\
    \  這時，隱約的海浪拍打沙灘的聲音就成為黑暗的背景音樂。這種旋律單調，重複進行，一遍又一遍，但也因此而特別懾人心魄。還有什麼比千百遍的重複更能令人印象深刻，永遠難忘的呢？哪怕是謊言，只要這樣陳述都會深入人心。這就是海的魅力。她不獨特也不絢麗，她只是亙古不變。\n\
    \  說到這裡，你也許就明白我為什麼喜歡黑暗和海洋了吧？我們的生命中，太多太多變化了，我們忙於應付和面對這些變化而精神疲憊，我們被變化驅使也被變化傷害，我們因為變化而連自己都不再相信。這樣的世界，真的很需要永恆的東西，讓我們可以平衡自己。\n\
    \  而還有什麼，能像黑暗和海洋一樣永恆呢？（節選自王丹 黑暗與海洋）"
