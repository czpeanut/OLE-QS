  group_stem: "睡到半夜颳起呼號北風，天氣變了。我轉過身，讓背部頂風，沙粒受風在灘上奔跑，一陣陣打在我身上的塑膠雨布上，粒粒踢踏，彷彿放大了聲響，聲聲清晰。躺著聽了一陣風聲、沙聲後，彷彿聽出沙粒聲外的另一種不尋常聲響—啊，好像是腳步聲！\n\
    \  我心裡想：「誰會在颳風而且荒僻的暗夜沙灘上行走？」越聽越不對，越想越毛……我想到，立刻起身，往三、四公里外的燈火處逃命，或許還有機會……。但，念頭隨即一轉：「黑漆漆的，慌張奔逃，萬一踢到石頭，撞到石塊……」在漆黑灘上亡命當然不聰明，但當時的處境又能如何？「好吧，轉過身來，也許看清楚那暗夜腳步聲到底是什麼，再說。」於是，就勇敢的轉過身來，面對北風，面對心底的恐懼。瞇著縫的眼，不久後就看見了！隱約是黑色的，身形圓胖，約一米高度，飄飄搖搖的，一路向我飛飄前來……這黑影，啊，分明不是正常「人」。真後悔轉了身，這下不僅心底發毛，全身都起了滾滾雞皮疙瘩。再一次，我想要立即轉身逃跑。同樣的處境，偏僻海隅，漆黑夜半，即使扯破喉嚨呼喊，也不會有人聽見……幾乎退無可退。剩下的，就是面對，面對害怕，面對眼前的麻煩。只好，我瞪大了眼，假裝勇敢，看著「他」朝我奔來。靠近了……靠得更近了……終於看清楚，終於看得更清楚。\n\
    \  靠近後看明白了，原來，是個黑色的大垃圾袋。應該是上風處前晚天黑前經過的垃圾場飄來的。這只垃圾袋灌飽了北風，在空曠的暗夜沙灘上隨風奔跑。（廖鴻基 暗夜海邊）"
