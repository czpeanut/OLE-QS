- id: doc_111_桃園_平南_國文_g8s1e2_s5_3
  section: 5
  number: 3
  type: single
  page: 4
  stem: 下列敘述，何者正確？
  options:
  - label: A
    content: 「駢死於槽櫪之間」是指所有馬匹接連病死於馬槽旁
  - label: B
    content: 「才美不外見」指日行千里的美好才能無法展現
  - label: C
    content: 「安求其能千里」是指要求牠平安地跑完千里路程
  - label: D
    content: 感慨「天下無馬」是指駿馬未受保育，瀕臨絕種
  group_stem: '(二) 世有伯樂①，然後有千里馬。千里馬常有，而伯樂不常有。故雖有名馬，祇辱於奴隸人之手，駢死於槽櫪之間②，不以千里稱也。馬之千里者，一食或盡粟一石。食馬者，不知其能千里而食也。是馬也，雖有千里之能，食不飽，力不足，才美不外見③，且欲與常馬等不可得，安求其能千里也。策之不以其道，食之不能盡其材，鳴之而不能通其意，執策而臨④之曰：「天下無馬。」嗚呼！其真無馬邪？其真不知馬也！

    ◆注釋

    ① 伯樂：姓孫，名陽，字伯樂，春秋時擅長相馬的人。

    ② 駢死於槽櫪之間：與尋常的馬匹一同死在馬槽中。駢，音ㄆㄧˊㄢ，兩馬並行，此指成雙成對。

    ③ 才美不外見：見，同「現」，展現。

    ④ 臨：靠近、依傍。

    ( 韓愈 〈馬說〉)'
