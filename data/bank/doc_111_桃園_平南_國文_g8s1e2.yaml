- id: doc_111_桃園_平南_國文_g8s1e2_s5_1
  section: 5
  number: 1
  type: single
  page: 3
  stem: 根據本文，下列對於臺灣狐蝠的描述何者正確？
  options:
  - label: A
    content: 屬於淺色長毛系列的蝠類
  - label: B
    content: 四肢間都有發達的飛膜
  - label: C
    content: 展開飛膜時的寬度可達身長的五倍
  - label: D
    content: 主要棲息地在臺灣本島東海岸
  group_stem: '(一) 臺灣狐蝠又名飛蝠，是臺灣最大型的蝙蝠。牠的身長約二十公分，前臂長約十三公分；頭大、眼大、嘴巴突、耳殼呈橢圓形，沒有耳垂；身體呈黑褐色或紫褐色，頸部與肩側有一圈乳白或金黃色毛；前肢與掌骨、指骨之間的皮膚有飛膜，展開時可達一公尺；第一、二指都有爪子，只是第二指的爪子很小；沒有尾巴，雙腿間的股間膜不發達。

    臺灣狐蝠多半在冬末春初之際繁殖，每次產子數為一至二隻。白天倒掛在樹枝上休息，傍晚才開始活動，尋找植物的果實作為食物。臺灣狐蝠與小蝙蝠類不同，飛行時主要靠視覺與嗅覺探查周遭環境，並不具備發射超音波回聲定位的能力。

    臺灣狐蝠分布以綠島為主，棲息於原始闊葉林。據研究顯示，臺灣狐蝠於綠島上的族群應為臺灣唯一固有族群。而在花蓮、宜蘭、臺東、蘭嶼、高雄等地也曾有零星個體的發現紀錄。可能是過去受到獵人使用大面積鳥網大肆捕捉販售的影響，加上棲息地被破壞造成狐蝠的食物來源減少，導致綠島上的臺灣狐蝠數量銳減。雖然目前人為濫捕、破壞棲息地的情況並未持續，但島上的狐蝠族群可能已經消失，僅剩極少的個體。'
