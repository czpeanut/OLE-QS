    We all know about the benefits of a healthy diet. ''We are what we eat'', someone
    says. But sometimes our busy lives mean our health becomes bad, and we eat the
    wrong things. Maybe ''five-a-day'' is a good way to keep a balanced diet.

    World Health Organization says that we have to eat a minimum of 400g of fruit
    and vegetables a day. That will lower the serious health problems. Different fruits
    and vegetables have different combinations of fiber, vitamins, minerals and other
    nutrients. Eating five portions of fruit and vegetables is one of the most important
    things to do in a day.

    Many different studies found out that for every portion of fruit and vegetables,
    there was a lower risk of death. And in the UK, a study by the University of Oxford
    said that around 33,000 lives a year could be saved if everyone in the UK followed
    the tips.

    However, there are some doubts about the ''five-a-day'' message. Some fruits and
    vegetables are better than others. For example, if orange juice is one of the
    ''five-a-day'', it isn''t good. Because it has sugar. Also, eating more vegetables
    is better than eating fruit because they''re richer in nutrients.

    Whatever fruit and vegetables you eat, every piece can help reduce the risk of
    heart disease and cancer. As the old saying goes: "an apple a day keeps the doctor
    away", let''s keep healthy together!


