  stem: 牧牧和小歡兩人針對步驟4，各自提出檢測方法：牧牧：在集氣瓶中加入適量的澄清石灰水溶液，搖晃後，若變混濁，表示有二氧化碳，以推測收集氣體的過程，發酵還在進行。小歡：將有火焰的線香放入集氣瓶內，若線香持續燃燒，表示有助燃性氣體，以推測收集氣體的過程，發酵還在進行。依據實驗內容，判斷兩人的檢測說明是否合理？
  options:
  - label: A
    content: 兩人皆合理
  - label: B
    content: 兩人皆不合理
  - label: C
    content: 只有牧牧合理
  - label: D
    content: 只有小歡合理
