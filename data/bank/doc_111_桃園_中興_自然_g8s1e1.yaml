  group_stem: '請閱讀下列敘述後，回答下列(38)～(40)題：

    沼氣是指有機物經微生物厭氧（缺氧）發酵所產生的氣體，主成分為甲烷（可燃，不助燃、不易溶於水的氣體）、二氧化碳和微量的硫化氫（易燃、不助燃、略溶於水的氣體）等氣體。下列實驗探討不同發酵條件對於沼氣產量的影響。步驟如下：

    1、至生態池中挖取含有微生物的汙泥，並去除雜質。

    2、將適量的廚餘、水、汙泥混合後，均分成三等分，分別置於三瓶發酵瓶中，再將發酵瓶分別放入不同溫度的恆溫水浴中，並組成三組排水集氣裝置。

    3、次日開始，每隔24 小時，定時測量一次集氣瓶中的排開水量，並記錄之。

    4、檢測集氣瓶內的氣體，以確保收集氣體的過程，發酵還在進行。

    5、每日於檢測後，將集氣瓶重新裝滿水再放回水槽中，繼續收集氣體。

    實驗結果如右附表所示：

    | 水浴溫度(℃) | 排開水量(g) 第一天 | 排開水量(g) 第二天 | 排開水量(g) 第三天 | 排開水量(g) 第四天 | 排開水量(g) 第五天
    |

    |---|---|---|---|---|---|

    | 24 | 30 | 110 | 160 | 182 | 172 |

    | 28 | 55 | 175 | 278 | 212 | 181 |

    | 34 | 107 | 501 | 431 | 170 | 153 |'
