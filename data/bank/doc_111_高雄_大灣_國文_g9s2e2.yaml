  stem: "依據下文，最符合作者「自己一個人唱歌」的敘述是：\n    一個人唱歌，可真奇怪。有時是下意識，自己竟不知不覺地唱起歌來，當發現自己不停地哼唱著喜歡的那一支歌的時候，也不知已唱了多久，之後不但沒停，還把歌詞一個字、一個字咬得清清楚楚。這樣無我地唱歌，起先是旋律讓他飄飄然，意識清醒後就被歌詞感動。如此一合，好像一個人扮起雙重唱，又扮聽眾陶醉。這種情形往往發生在一個人心情愉快時，歌一上口，一次一次又一次地重複不停；特別是別無他人在旁，例如洗澡、上廁所、騎機車或一個人在家等等，有時閉著嘴用鼻子哼，有時張口用「啊」字啊到底，哼唱久了，下顎還會微感痠痠的。要不是遇到有人來、忙著談事情，或是吃飯等其他事情來打斷的話，這種愉快的心情，就好像中了邪一樣。\n\
    \                                                                         黃春明〈心裡的桃花源〉"
