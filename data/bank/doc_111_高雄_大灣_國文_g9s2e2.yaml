    \  後來那位父親指著死去兒子的腐爛痕跡，對我解釋著他是以什麼樣的姿勢死去。他一邊說著「他就是這樣死的喔」，一邊作勢要坐在腐爛痕跡上，示範給我看。「等、等、等一下，別這樣！」我驚訝地出聲試圖阻止他，並下意識地抓住他的手臂。而且，想到他那麼認真要讓別人知道兒子怎麼死的，心裡頓時一陣沉痛。其實他不用解釋，那腐爛液體的痕跡早已呈現出他兒子如何死去的樣子了。\n\
    \  在我說明了工作內容和費用後，他便將工作交給我處理，並說道：「那就麻煩你了。」考慮到蛆蟲、蒼蠅以及附近鄰居等問題，我決定先進行特殊清掃作業。往生者留下的家當或生活用品可以擇日再清除，當務之急是先處理被污染的地方。然而，正當我要動手時，他卻在此時走向全副武裝的我，說道：\n\
    \  「借我一副手套吧。」 「咦？」 「我跟你一起做。」 「蛤！？」 「我也要一起清掃。」\n  「不用啦，我自己來就可以了，請你在外面等。」「怎麼可以這樣！我好歹也是他的父親啊。」\n\
    \  「這工作我很習慣，一個人就行了。」「我已經無法為兒子做什麼了，就讓我做吧。」\n  「可是……你錢都付了，還要幫忙，這樣我會很不好意思啊。」\n  「不用在意啦，我喜歡做人家討厭的工作，你也是吧？」「是……。」\n\
    \  儘管很想拒絕他幫忙， 但是他堅不退讓，直嚷著：「 我要幫忙清掃！」我只好誠惶誠恐地把手套和口罩給他，兩個人一起進入被遺體污染的屋子裡。\n  「你幾歲了？」\
    \ 「三十八歲。」 「咦？那不是跟我兒子同年嗎！？」 「是嗎……。」\n  「做很久了嗎？這工作很辛苦吧？」 「我做十五年了。」 「什麼！真不簡單啊！」\n\
    \  「我沒那麼厲害啦。」\n  「我兒子卻在這個年紀死了……，唉！這也是他的命，我會變成現在這樣也是我的命啊。」\n  聽他說兒子從小個性溫和，也由於生性內斂，經常成為同學霸凌的對象。儘管試著把他教成堅強的男孩，但依然無法改變他柔弱的個性。兒子踏出社會後，在一家還過得去的公司任職，雖然承受著各種壓力，依然努力撐下去。\n\
    \  然而，爾虞我詐的社會競爭以及勾心鬥角的人際關係，讓他兒子感到身心俱疲，因此死前幾年幾乎把自己關在公寓裡，過著足不出戶的生活。最後弄垮了身體，孤獨死去而腐爛。\n\
    \  「有些人啊，當你好的時候，就會巧言令色巴著你，當你不好的時候，馬上就又會翻臉遠離你。可是家人不一樣，不論你是好是壞，都會跟你在一起。遇到撐不下去的事情時，只要有家人在，我們就能努力下去。所以，家人是最重要的。」我靜靜聽著這位父親高談闊論，\
    \ 一邊說他還不忘不停做著手上的工作。\n  我處理過無數遺體和遺體留下的腐爛污穢，但從來沒有遇到一個會為家人清理的家屬，我實在無從理解那位父親為兒子清理腐爛遺體、留下一屋髒亂的心境。事實上，沒有經驗的人是很難處理遺體的腐爛痕跡，這不是一件容易的事。但即便如此，他並沒有露出嫌惡的表情，反而略帶喜悅地忙碌著，我很佩服他，也很感謝他，因為我從他身上看到了一個為人父親的堅毅剛強。他雖然待人粗魯直率，但當知道他對家人的愛是如此深和濃，我的心也被他溫暖了。我們最後分工合作順利完成了所有清掃工作。\n\
    \  「這樣就大功告成了。」是啊，謝謝你。」「您客氣了。」「雖然有點少，不過拿去買一點涼的吧。」\n「不好意思，讓您破費了。」「你啊，將來可別像我兒子那樣死掉喔。」\n\
    \  「……好。」「幸與不幸只在一念之差，人生際遇有好也有壞……，加油喔！」他把一張千圓紙鈔塞進我的口袋。\n  我永遠忘不了，那曬得黝黑臉龐上堆滿了笑容，眼裡卻泛著淚水。外頭的天氣好得讓人發汗。剛做完工作渾身油膩汗水的我，不禁想起兒時的夏天，父親把一百日圓硬幣塞在我的手裡，說道：「去買冰吃吧。」\n\
    \                              改寫自（特掃隊長那些死亡教我如何活：一位清掃死亡現場者20 年的生死思索）"
- id: doc_111_高雄_大灣_國文_g9s2e2_s2_43
  section: 2
  number: 43
  type: single
  page: 6
  stem: 根據本文，下列何者不是文中所描寫的景象？
  options:
  - label: A
    content: 溪流水質清澈、水勢湍急
  - label: B
    content: 飛瀑直瀉，激起陣陣水花
  - label: C
    content: 溪水沿岸，怪石錯落堆疊
  - label: D
    content: 樹木、青竹叢生，餘蔭相疊
  group_stem: "(四)\n道州城西百餘步，有小溪。南流數十步，合營溪。水抵兩岸，悉皆怪石，欹嵌①盤屈，不可名狀。清流觸石，洄懸激注，佳木異竹，垂陰相蔭。\n\
    \  此溪若在山野，則宜逸民②退士之所遊處，在人間，則可為都邑③之勝境，靜者之林亭。而置州以來，無人賞愛，徘徊溪上，為之悵然。乃疏鑿蕪穢④，俾為亭宇，植松與桂，兼之香草，以裨⑤形勝。為溪在州右⑥，遂命之曰右溪。刻銘石上，彰示來者。\
    \                                                               （元結‧右溪記）\n\n【注釋】\n\
    ①欹嵌：不平貌。欹，傾斜不正。②逸民：節行超俗，遁世隱居的人。③都邑：都市。\n④蕪穢：叢生的雜草。          ⑤裨：增添。\n⑥溪在州右：古代以東為左，西為右，此溪在城西，故作者說「溪在州右」。"
