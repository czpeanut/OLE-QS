  stem: 關於印度藏茴香的敘述，下列何者正確？
  options:
  - label: A
    content: 別名香旱芹、衣索比亞孜然、獨活草及百里香等
  - label: B
    content: 食用時先研磨而非壓碎，會讓味道更加辛辣刺鼻
  - label: C
    content: 提煉的精油可來治腹瀉、脹氣，及其他胃部不適
  - label: D
    content: 雖然烹飪的用途有限，但是對特定料理是必需品
  group_stem: "(二)\n  印度藏茴香亦稱香旱芹、細葉糙果芹、衣索比亞孜然、阿育魏實、獨活草或阿印茴，繖形科，長了斑紋的紅棕色種子和大粒的芹菜種子很像，其種子是整粒販售，要食用時先壓碎而非研磨。它的氣味如百里香，但更辛辣刺鼻。其精油約含有50%的百里香酚，這是一種氣味極重的苯酚，用作殺菌清潔劑，常見於印度、巴基斯坦、伊朗和阿富汗，多半出口，提取後的百里香酚，可添加在牙膏和香水裡。\n\
    \  印度藏茴香也用在健胃整腸，尤其在印度，常用來治腹瀉、脹氣，及其他胃部不適。印度藏茴香烹飪的用途有限，但許多印度美食和零食都不能沒有它，比如印度麵餅和凡是要用鷹嘴豆粉的食譜，如排燈節的應節食品鷹嘴豆酥，這是略帶辛辣味的鷹嘴豆粉所製的酥條，教人吃了還想再吃。\n\
    （節選自約翰‧歐康奈 香料共和國）"
