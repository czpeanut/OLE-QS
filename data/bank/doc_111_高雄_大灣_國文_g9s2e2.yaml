- id: doc_111_高雄_大灣_國文_g9s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 「夫束修自好者，豈無其人？經濟自期，抗懷千古者，亦所在多有。」此意涵近似於下列何者？
  options:
  - label: A
    content: 只要潔身自好，一定有了解自己的伯樂
  - label: B
    content: 有志節的讀書人，往往出於亂世之中
  - label: C
    content: 世人都嚮往功名利祿，唯讀書人能堅定理想
  - label: D
    content: 雖然世風日下，但是仍有懷抱理想的讀書人
- id: doc_111_高雄_大灣_國文_g9s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 張岱 陶庵夢憶自序：「陶庵國破家亡，無所歸止。披髮入山，駴駴為野人。故舊見之，如毒藥猛獸，愕望不敢與接。作自輓詩，每欲引決，因石匱書未成，尚視息人世。然瓶粟屢罄，不能舉火，始知首陽二老，直頭餓死，不食周粟，還是後人妝點語也。雞鳴枕上，夜氣方回。因想余生平，繁華靡麗，過眼皆空，五十年來總成一夢。今當黍熟黃粱、車旋蟻穴，當作如何消受？遙思往事，憶及書之，持向佛前，一一懺悔。」關於這段文字的說明，何者正確？（註：駴：音ㄒㄧㄝˋ，驚異。通「駭」。）
  options:
  - label: A
    content: 「自作輓詩，每欲引決」句中「引決」意思是引導解決
  - label: B
    content: 「石匱書未成，尚視息人世」強調藏書豐富尚未閱畢，不願半途而廢，因此苟活
  - label: C
    content: 文中作者用了「黃粱一夢」的典故，說明過去一切聲色犬馬，恍如一夢
  - label: D
    content: 本文以記敘為線索，介紹了著述的起緣、宗旨以及全書的內容
- id: doc_111_高雄_大灣_國文_g9s2e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: '一人貧苦特甚，生平虔奉呂祖。祖感其誠，一日忽降至其家，見其家徒四壁，不勝憫之，因伸一指，指其庭中磐石。俄頃，粲然化為黃金，曰：「汝欲之乎？」其人再拜曰：「不欲也。」呂祖大喜，謂：「子誠能如此，無私心也，可授以大道。」其人曰：「不然，吾心欲汝此指頭也。」

    如從勸誡角度評論本文意旨，下列文句何者最適合？'
  options:
  - label: A
    content: 神仙難措手
  - label: B
    content: 人心不足蛇吞象
  - label: C
    content: 道高一尺，魔高一丈
  - label: D
    content: 補漏趁天晴，未渴先掘井
- id: doc_111_高雄_大灣_國文_g9s2e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 黃永武 瀟灑：「有人說瀟灑的培養，一方面仰賴知識的增廣，就好比在熟悉的環境條件下，才能有巧思妙解。俗話說『熟能生巧』、『人頭熟、吃得開』乃至『勝任者愉快』，都是比喻『知』在瀟灑中的重要性。假若一入陌生無知的境遇，必然『捉襟見肘』、『貽笑大方』，如何也揮灑不開了。」依據本文敘述，下列何者不正確？
  options:
  - label: A
    content: 瀟灑來自對環境能控制自如
  - label: B
    content: 瀟灑來自個人的自信
  - label: C
    content: 瀟灑源自知識的充實
  - label: D
    content: 瀟灑的人會貽笑大方
- id: doc_111_高雄_大灣_國文_g9s2e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 「南京大理少卿楊公復，很會作詩文，並在當時享有盛名，而他的家僮常常到當地玄武湖湖畔採萍藻給豬吃。當時的宰相吳思菴，因為辦公的地方距離玄武湖很近，因此拒絕楊公復的家僮來此採萍藻。於是楊公復就開玩笑寫了一首詩給吳思菴：『數點浮萍容不得，如何肚裡好撐船？』」根據這段文字，可以推知下列何者？
  options:
  - label: A
    content: 吳思菴心胸狹隘
  - label: B
    content: 楊公復勤儉持家
  - label: C
    content: 吳思菴鐵面無私
  - label: D
    content: 楊公復恃才傲物
- id: doc_111_高雄_大灣_國文_g9s2e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 「事親者，居上不驕，為下不亂，在醜不爭。居上而驕則亡，為下而亂則刑，在醜而爭則兵。三者不除，雖日用三牲之養，猶為不孝也。」關於這段文字的說明，下列何者錯誤？（註：醜：通「儔」，同輩。）
  options:
  - label: A
    content: 居上位而驕縱，就會招來禍患以致敗亡
  - label: B
    content: 居下位而違法亂紀，必定會觸法而受制裁
  - label: C
    content: 在同儕中若是爭強鬥狠，必定會引起對立衝突
  - label: D
    content: 「三者不除」句中「三者」指不驕、不亂、不爭
- id: doc_111_高雄_大灣_國文_g9s2e2_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 富者曰：「吾數年來欲買舟而下，猶未能也。子何恃而往」可以看出富僧是怎樣的人？
  options:
  - label: A
    content: 推諉塞責，沒有擔當
  - label: B
