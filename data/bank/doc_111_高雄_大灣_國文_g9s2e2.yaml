  section: 1
  number: 19
  type: single
  page: 2
  stem: 涵涵讀到〈為學一首示子姪〉，赫然發現自己專輯中的歌詞與文章意旨可相呼應，請問最有可能是下列何者？
  options:
  - label: A
    content: 人在哪裡跌倒，就在哪趴一下，面對挫折也都專業化〈人生有限公司〉
  - label: B
    content: 命運如果有門，名字就叫心門，並不是能不能，而是肯不肯〈第二人生〉
  - label: C
    content: 天空不斷黑了又亮、亮了又黑，那光陰滄海桑田遠走高飛，再沒力氣追〈乾杯〉
  - label: D
    content: 時光遺忘的背面，獨坐殘破的臺階，哪個亂世沒有離別〈步步〉
  lesson_raw:
    title: 為學一首示子姪
    basis: 題目寫了課名〈為學一首示子姪〉
- id: doc_111_高雄_大灣_國文_g9s2e2_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 下列有關〈為學一首示子姪〉的文句分析，何者錯誤 ？
  options:
  - label: A
    content: 「天下事有難易乎？為之，則難者亦易矣。」：顯示出「事非經過不知難」
  - label: B
    content: 「不自限其昏與庸而力學不倦者，自立者也」：近於「勤能補拙，有志竟成」
  - label: C
    content: 「旦旦而學之，久而不怠焉，迄乎成，而亦不知其昏與庸也」：勉勵子姪要「力學不倦」
  - label: D
    content: 「吾資之聰，倍人也；吾才之敏，倍人也。屏棄而不用，其與昏與庸無以異也」：可證明聰敏不可恃。
  lesson_raw:
    title: 為學一首示子姪
    basis: 題目寫了課名〈為學一首示子姪〉
- id: doc_111_高雄_大灣_國文_g9s2e2_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 「不是不愛，是找不到愛。」句中的「不是不愛」是「要」愛的意思，整句話是肯定的語氣，其意為「是要愛，只是找不到愛的對象」。下列 文句都有兩個否定的字，何者解釋錯誤？
  options:
  - label: A
    content: 你的生日，我「不」敢「不」來：你的生日我會來
  - label: B
    content: 若「無」三兩三，「不」敢上梁山：有三兩三本事，所以敢上梁山
  - label: C
    content: 世上「無」「不」愛其親人者：世上人人皆愛其親人
  - label: D
    content: 「不」離「不」棄：情深緣淺，不得已捨棄
- id: doc_111_高雄_大灣_國文_g9s2e2_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 「熠熠與娟娟，池塘竹樹邊。亂飛同曳火，成聚卻無煙。微雨灑不滅，輕風吹欲燃。舊曾書案上，頻把作囊懸。」請問這首唐詩所歌詠的對象與下列哪個選項相同？
  options:
  - label: A
    content: 蓋好了一座美麗的白宮／卻忘了裝窗子／開門戶
  - label: B
    content: 何其愁慘而微弱的閃爍／有火還似無火／儘依草遶籬而飛
  - label: C
    content: 對摺的情書／尋找花的住址
  - label: D
    content: 現在／你是夏日裡／最快樂的水聲了
- id: doc_111_高雄_大灣_國文_g9s2e2_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: 「把每一天都當做生命中的最後一天，你終會找到人生的方向。」這句話強調的重點是「時光易逝，要把握時間，珍惜當下」，與下列何者「相去最遠」？
  options:
  - label: A
    content: 及時當勉勵，歲月不待人
  - label: B
    content: 一個今天，抵得兩個明天
  - label: C
