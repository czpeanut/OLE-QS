  stem: What does “theirs” mean in the reading?
  options:
  - label: A
    content: Their salt.
  - label: B
    content: Their restaurants.
  - label: C
    content: Their noodle soup.
  - label: D
    content: Their health.
  group_stem: '(At a restaurant in Japan)

    Momo：Why don’t you enjoy your noodle soup?  It’s great.

    Billy：I don’t think so.  There is too much salt in it.  That’s bad for health.

    Momo：Come on.  The cooks here don’t use a lot of salt.  Can’t you see?  Many people
    are enjoying theirs.

    Billy：OK.  Let me try it.  Mmm, it’s delicious.

    Momo：The cooks here really care for our health, but their counterparts next door
    use too much salt in their dishes.

    Billy：They should not do that.  By the way, why are people around us slurping
    their noodles?

    Momo：Oh, it means yummy in Japan.

    Billy：In the USA, we can’t do that.  It means you have bad manners.  My parents
    will be very angry if I do that.

     restaurant 餐廳  why 為什麼  think 認為  try 嘗試  should 應該  slurp 出聲地吃或喝  will 將會  angry
    生氣的  if 假如'
