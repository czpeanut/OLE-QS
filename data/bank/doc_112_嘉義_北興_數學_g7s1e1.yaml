  stem: '建華假日跟爸爸去打高爾夫球，計分規則如下：每一洞有規定的標準桿數，低於標準桿的桿數用「－」表示，高於標準桿數用「＋」表示，與標準桿數一樣則計為 0。總桿數為統計全部超過或低於標準桿的桿數即可，總桿數低者可贏得勝利。爸爸與建華打完
    9 洞的計分表如下：

    | 洞 | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 | 9 | 總桿數 |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 爸爸 | －1 | 0 | ＋2 | 0 | －1 | －2 | －1 | 0 | －2 | －5 |

    | 建華 | ＋1 | ＋1 | －1 | ＋3 | 0 | －2 | －1 | －2 | | |


    (1) 如果建華要贏過爸爸，則他第 9 洞要打低於標準桿幾桿？

    (2) 若第 9 洞的標準桿為 6 桿，則建華要在第 9 洞打出幾桿才能贏過爸爸？'
