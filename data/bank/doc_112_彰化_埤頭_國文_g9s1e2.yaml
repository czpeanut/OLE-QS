- id: doc_112_彰化_埤頭_國文_g9s1e2_s2_40
  section: 2
  number: 40
  type: single
  page: 2
  stem: 根據本文，作者認為臺灣生態學者所強調的「荒野」有何特色？
  options:
  - label: A
    content: 人跡罕至
  - label: B
    content: 栽種小米
  - label: C
    content: 勞動婦女集體合作
  - label: D
    content: 有瀕危物種。
  group_stem: '在臺灣，我們生態學者總喜歡強調荒野（wilderness），特別是沒有人的地方。這一天，我站在田埔的小米田中，望向遠方，的確看到了想像中的荒野。這裡面可能有檜木、扁柏、雲豹、黑熊、藍腹鷴（ㄒㄧㄢˊ）、帝雉或是櫻花鉤吻鮭等瀕危物種，都是國家公園與保育單位關注的重點，但是在這種荒野意象中，我們看不到人。


    有趣的是，當我從荒野視角一回頭，在我身旁卻很輕易就看到部落的媽媽們，正在辛勤播種小米。這裡正是「里山」（Satoyama）。我跟著婦女人們流暢的勞動節奏，一階一階地從低處的田地一路往上播種。婦女人們並沒有分散在個別田中去耕作自己的責任區，而是一區一區集體合作，一路由下往上種。


    在勞動中，我的視野由遠而近、由下而上，跟著他們的節奏走進這個小米世界。我看到荒野中有人的腳蹤，他們跟周遭的森林、野獸、蟲魚不是截然二分的，這裡有自然的節奏與人的勞動交織在出的關係。我看他們或跪、或坐、或蹲，或是匍匐在土地上，雖然是辛苦，但是在過程中因為合作與集體所帶來的成就，解除了許多身體的勞累，反而在心靈上得到許多滿足。（林益仁
    山櫻花綻放時的小米田：從尖石後山到一○一）'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
