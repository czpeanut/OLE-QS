  group_stem: '當手裡拎著藏有飯盒的公事包，特別會感到一份沉重，邊提便邊挑起了二十幾年前年少的時候帶飯盒的許多回憶——


    記得考初中、六年級的時候，為了準備考初中，我們那個鄉下學校每天都在加緊的惡補功課。六年級時，甚至由早上六點鐘開始上課，一直到晚上七點多鐘，其中休息時間都極為短暫，同學們只有帶飯盒，不管天氣冷熱，大多數同學都要吃兩餐冷飯。我弟弟多，總會有一個中、低年級的弟弟讀下午課，午餐就由他帶給我。可是晚飯，便須由父親或母親送來，父親騎著他的舊腳踏車，母親則徒步。


    上了初中，學校離家四、五公里，母親總在每天大清早起來，為我調製飯盒。有幾年，家境非常清苦，母親天天為我們個弟弟兄的第二木飯盒菜發愁，父親還設法租了一小塊園子，在公餘種點菜蔬，養些雞鴨，於是醃蘿蔔絲炒蛋，韭菜豆豉，和從雜貨店買來的鹹魚乾，就成了我們最可口的菜餚。有時，是期六下午沒課，本可以回家吃午飯，但是為了飯盒總比家裡端上飯桌的好，我總要求帶飯盒上學，中午吃過飯盒再回家。現在想來，當時真是太不懂事了。


    我帶飯盒，一直帶到高中畢業。轉眼算來已經有十幾年沒吃過母親做的飯盒了，這些多年往事如今回想起來，恍如昨日。


    面對一份由妻準備的飯盒，又是炸排骨，又是青菜肉絲的精美餐點，一面咀嚼下嚥，一面想起當年母親在微亮的天光下，為我們兄弟做飯盒的情形，不禁有點浩然。（吳敏顯 金•飯盒）'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
