  stem: 根據上文內容，是在說明當時社會對女性哪些方面的不公平？
  options:
  - label: A
    content: 利益分配、需求滿足
  - label: B
    content: 利益分配、責任承擔
  - label: C
    content: 利益分配、貢獻程度
  - label: D
