  group_stem: '中華民國政府遷臺後，推行一系列經濟措施從而讓臺灣經濟逐漸成長，下列資料分別代表臺灣經濟發展不同階段，請依資料判讀，回答第23~25 題：

    甲：民國60 年代初期臺灣經濟受到□□事件影響而一度蕭條，政府推行基礎建設，發展重工業，創造大量就業機會，帶領臺灣走出□□事件的影響，帶動景氣的復甦。

    乙：全球最大獨立繪圖晶片供應商NVIDIA(輝達)執行長黃仁勳於5 月27 日台大畢業典禮演講時表示：「在過去的40 年裡，我們創造了個人電腦、互聯網、移動設備、雲端，現在是人工智能時代。你將創造什麼？無論是什麼，像我們一樣，創造之後奔跑，不要緩慢行走。請記住，奔跑吧！要嘛是為了覓食而奔跑，不然就是為了逃離被當作食物而奔跑。」資料來源：2023/5/29《今周刊》

    丙：傍晚時分，陳靜美跟著一群女性從業人員從廠區內騎著腳踏車回家，18 歲從學校畢業後進入工廠當女工的她，經過10 年歷練，後來成為擁有兩百餘名員工公司的董事長。作家林安妮將陳靜美的經歷寫成《一個女工的故事》，是當年女工們最喜愛的一本暢銷書。

    丁：政府藉由美援給予的物資進行道路、橋梁、堤壩、電廠及天然資源的開發等進行經濟發展，進口黃豆、棉花、肥料等物資以充裕國內需求並壓低市場價格，貧苦百姓還會將麵粉袋改作爲內衣內褲，因為麵粉袋上印製「中美合作」握手標識，還戲稱為「中美牌」內褲。'
