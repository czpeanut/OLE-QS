    疫後特別預算中有編列200 億元撥補全民健康保險基金，行政院長陳建仁指出，若有撥補200 億元到健保，到今（2023）年底結算時，就不必要去估算明年有調漲健保費的可能性，有網友對此怒批，政府只會撥補，勞保撥補、健保也撥補，預算補預算，越補越大洞。

    健保機制一直以來都備受批評，醫、病濫用健保資源問題氾濫，沒辦法確實根治濫用浮報，就算漲保費、調部分負擔也只是延後破產而已，更何況政府視「不調漲健保費」為德政，然看似為民眾省錢的背後是要自費花更多錢，影響的是醫療品質與用藥權益。【工商時報2023-03-08
    】'
