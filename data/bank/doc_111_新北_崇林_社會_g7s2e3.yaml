  stem: 從上文可知，在開放社會裡，出身平凡、學歷不高的人也可以創造出25 億王國。請問：這是在說明哪個概念？
  options:
  - label: A
    content: 文化位階
  - label: B
    content: 社會流動
  - label: C
    content: 社會互動
  - label: D
    content: 社會安全
  group_stem: 'ONE BOY 憑什麼紅？32 歲創辦人顏瑋廷親自解謎：17 歲創業、一件衝鋒衣做到25 億王國

    年僅32 歲的董事長顏瑋廷透露，公司年營收約新台幣25 億元。這個數字背後的意義是：ONE BOY 已經成為台灣原生服裝品牌第4 大，僅遜於實體服飾之王NET、電商服飾之王Lativ，以及近年靠著打造網紅生態系崛起。

    顏瑋廷的最高學歷是五專肄業、國中畢業，父親是裝潢木工師傅、母親是家庭主婦。他的哥哥（ONE BOY 總經理顏瑋志）透露，兄弟倆不太愛念書，都讀夜間部，16
    歲左右就開始半工半讀，且必須自行負擔學費。媽媽徐虹雲不給錢，因為要他們為自己的決定負責。

    他最佩服的企業家是中國萬達集團董事長王健林，他說過一句話：「北大、清大都不如你膽子大；哈佛、耶魯，還不如你敢賭。」顏瑋廷覺得這句話能悟出滿多東西的。

    公司取名ONE BOY 的那一年，隻身創業的顏瑋廷才17 歲；買下工廠時，也僅28 歲。顏瑋廷拿出自己一半以上的身家，先包下產能，再取得百分之百股份，形同買下該廠，成為自有供應鏈。2019
    年後，除了製造在大陸，從設計、打版、決定面料都是自己來。【商業週刊1840 期2023-02-16 】'
