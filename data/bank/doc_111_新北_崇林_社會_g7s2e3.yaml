  group_stem: '以下為3 月8 日國際婦女節的由來，以及相關資料：

    在20 世紀初西方國家工業化發展快速，許多工廠為了獲得更高的利潤，因而拉高工時與壓低薪資，在長期壓迫和種種不平等的待遇下，女性勞工們實在忍無可忍，於是就在1908
    年3 月8 日，當時美國紐約市的一群婦女工人發起抗議，要求改善工作條件、增加工資和實行投票權等權利。這場運動所提倡的口號「麵包加玫瑰」（Bread and
    Roses），象徵著婦女應該有權獲得經濟保障，並且同時能追求更高的生活品質，享受幸福的權利。

    1911 年3 月25 日，美國紐約市發生了歷史上最嚴重的工業災難—紐約三角內衣工廠火災。火災導致了146 名服裝工人的死亡，其中大多數為女性，他們或被燒死或因為被迫跳樓而喪生。這場災難也是911
    事件發生前，紐約市最致命的工作場所災難之一。該工廠管理人員為了防止工人在換班時逃離工廠休息或吸煙，將通往樓梯井和出口的門全部上鎖，導致大多數女工無法及時逃生。

    這場悲劇，引發了世界各地對女性工作環境權的關注和不滿。世界各地的女權運動也開枝散葉，像是1917 年3月8 日，俄羅斯的紡織女工集體罷工與遊行等等。'
