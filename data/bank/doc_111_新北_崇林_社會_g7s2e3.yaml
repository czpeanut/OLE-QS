  stem: '下列針對「社會福利政策」與「民間行善」的比較，何者正確？

    | 選項 | 社會福利政策 | 民間行善 |

    | --- | --- | --- |

    | （Ａ） | 指透過政府政策讓人民過著富裕的生活 | 指透過個人或團體的善行義舉，協助弱勢 |

    | （Ｂ） | 具有持續性 | 具有系統性 |

    | （Ｃ） | 是國家的責任 | 是個人或團體的選擇 |

    | （Ｄ） | 難以實現公平正義 | 較能實現公平正義 |'
