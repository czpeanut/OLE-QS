    content: 丁甲乙丙。
  group_stem: '台灣流行歌曲呼應時代的變化反應時代的潮流，下列歌曲分別為不同時代象徵，請回答第29~32 題：

    (甲)《Can''t help falling in Love》(情不自禁愛上你)：「Wise men say Only fools rush in But
    I can''t help falling in love with you.……」此曲為貓王Elvis 經典歌曲，此時台灣實施經濟開放政策，加上區域性戰爭使得駐臺美軍增加，因此西洋流行歌曲引領時代潮流。

    (乙)《龍的傳人》：「遙遠的東方有一條江，它的名字就叫長江，遙遠的東方有一條河，它的名字就叫黃河。雖不曾看見長江美，夢裡常神遊長江水，雖不曾聽見黃河壯，澎湃洶湧在夢裡……巨龍腳底下我成長，長成以後是龍的傳人，黑眼睛黑頭髮黃皮膚，永永遠遠是龍的傳人。」此曲創作於我國外交面臨挫敗時期，歌手高唱「黑眼睛黑頭髮黃皮膚，永永遠遠是龍的傳人」，激起民族的信心。

    (丙)《向前走》：「火車漸漸在起走，再會我的故鄉和親戚，親愛的父母再會吧，到陣的朋友告辭啦。阮欲來去台北打拼，聽人講啥物好空的攏在那，朋友笑我是愛作暝夢的憨子，不管如何路是自己走，OH！再會吧，OH！啥物攏不驚，OH！再會吧
    OH！向前行……」作者同時也是演唱者林強，在社會文化解放之際，開啟臺式搖滾樂風。

    (丁)《綠島小夜曲》：「這綠島像一隻船，在月夜裏搖啊搖。姑娘呀，妳也在我的心海裏飄啊飄。……這綠島的夜已經這樣沉靜，姑娘喲，妳為什麽還是默默無語。」此歌曲為民國四十年代周藍萍創作，創作初衷是描述在綠意盎然的台灣島上，情人傾訴愛戀及心情起伏的情歌。'
