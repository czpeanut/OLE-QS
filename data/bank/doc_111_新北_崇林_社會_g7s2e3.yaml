  section: 1
  number: 14
  type: single
  page: 3
  stem: 從上文導演拍攝的契機說明判斷，下列何者最適合用來說明導演奉俊昊的作為？
  options:
  - label: A
    content: 加入民間團體以監督政府的政策
  - label: B
    content: 以實際行動直接參與政策的制定
  - label: C
    content: 透過連署活動支持所關心的議題
  - label: D
    content: 以個人努力反映出弱勢群體的困境
  group_stem: '電影《寄生上流》與導演奉俊昊

    南韓導演奉俊昊憑藉電影《寄生上流》，2019 年在坎城影展拿下最高榮譽金棕櫚獎，並在隔年贏得四項奧斯卡獎，讓奉俊昊成為韓國最新的民族英雄，連總統文在寅也讚揚他「給了全國人民自豪感與勇氣」。

    導演對於該片曾表示，拍攝的契機主要是想呈現富人和貧困家庭間互相侵蝕、滲透的故事，將生活在資本主義世界裡，觀眾所遭受的痛苦放進電影中，更想要藉由此電影，逼迫韓國社會正視被長期忽略的陰暗角落，卻意外獲得全世界共鳴。奉俊昊在2019
    年底一次訪談裡透露，約莫在2015 年，接連看見首爾市中心無家可歸的遊民，以及五百位大學畢業生競爭一個警衛職缺的報導，腦中因此萌生《寄生上流》的故事藍本。

    該電影描述在南韓社會的角落，社會底層的人民求生存的真實樣貌，貧困主角一家四口沒有正職，必須靠著家庭代工維生再加上高房價，因此只能住在「半地下」房子。然而，另一端的上流社會，住在奢華裝潢的豪墅裡，還有一大片的私人草地。表面上，《寄生上流》是讓觀眾看見貧富之間那道隱形卻無法踰越的鴻溝，但導演奉俊昊想做的，是為不同階級的人搭起橋樑，以尊重取代仇恨與厭惡，進而讓包括他在內的所有人，都能在群居環境中感到自在舒適，他說：「這部電影呈現的情況，就是人們連對人最低程度的尊重都被破壞忽略了。這部電影訴諸人性普世價值，希望讓這部電影不僅是一部『韓國電影』，而是一部可被投射在全世界各角落的寓言故事。」。

    現今南韓社會有著高房價的問題，即便南韓政府不斷推出打房政策，但卻出現房價越來越貴的情況，因而民怨四起。不僅有民眾冒著觸法風險向南韓總統丟鞋，甚至聚集了近千位不滿政府執政的抗議民眾，一起向天空丟鞋的事件。改寫自【今周刊2020-02-12
    】

    【註】打房政策：即政府打壓房價，是政府的調控房價的手段，以直接或間接方式限制特定區域或全區的房價上漲。'
