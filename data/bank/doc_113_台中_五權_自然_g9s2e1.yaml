- id: doc_113_台中_五權_自然_g9s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 陳老師春節預計去攀登百岳西巒大山，於是他參考衛生福利部、疾病管制署刊登旅遊保健資訊的部分內容：高山症泛指人體處於高海拔地區，因其環境而導致的健康風險，正式名稱為「高海拔疾病」。當海拔高度上升，很多環境條件和平地不太相同，以海拔3
    千公尺的高山為例，山頂的氧氣含量僅有平地的7 成左右。旅客突然處於這樣的特殊環境，可能會出現一些健康問題。登山旅客應謹慎規劃爬升速度，並遵照醫師指示服用預防藥物，預防高海拔疾病。上述畫底線處說明高山上的環境與平地不同，氧氣含量較平地低，因此可能會引發高海拔疾病，這與下列何者最相關？
  options:
  - label: A
    content: 山上的大氣組成以水氣與二氧化碳為主
  - label: B
    content: 山上大氣壓力較平地大氣壓力低
  - label: C
    content: 山上距離平流層較近會形成臭氧層
  - label: D
    content: 山上距離太陽較近且氣溫比平地高
  tags:
    chapter:
      publisher: 翰林
