  group_stem: '※梅雨是東亞地區獨特的天氣現象，源於中國江南一帶在梅子成熟期，因受滯留鋒面徘徊影響，導致陰雨連綿而得名。臺灣地區的梅雨季節約為每年五月至六月間，因歐亞大陸中高緯度乾冷氣團和亞洲南方海域濕暖氣團，在華南及臺灣地區交會相互作用，形成滯留鋒面徘徊成雨。梅雨期連續的降雨使得土壤含水量大，若有較大雨勢或出現豪雨，在山區即可能導致落石、坍方、土石流、山洪爆發，低漥地區則易造成淹水等危害。另外，也常伴隨雷雨，所以必須防範雷擊及強風現象。臺灣各地區全年大約有19%至33%的雨量是集中在5、6
