- id: doc_113_台北_仁愛_英語_g8s2e2_s5_41
  section: 5
  number: 41
  type: single
  page: 4
  stem: What does Mary mean when she says, “I can’t believe they sell it in Taiwan!”
  options:
  - label: A
    content: She is excited because it is hard to find foreign chocolate in Taiwan.
  - label: B
    content: She loves to read the fun stories on the wrappers of Tony’s Chocolonely.
  - label: C
    content: She is mad because Tony’s Chocolonely is not friendly to its workers.
  - label: D
    content: She finally has a chance to buy chocolate from Tony’s Chocolonely now.
  group_stem: '(B)

    Mary: Hey, look! It’s Tony’s Chocolonely! I can’t believe they sell it in Taiwan!

    Tom: Why? What’s so special about the chocolate?

    Mary: Well, it’s not just chocolate. Tony, the owner of Tony’s Chocolonely, was
    a reporter before. During one of his news stories, he learned that cocoa farmers
    in Africa worked hard but got very little money. Some companies even made children
    work on cocoa farms. He thought it was wrong and wanted to bring that to a halt,
    so he started this chocolate company to help.

    Tom: That sounds great, but isn’t their chocolate more expensive? I’m not sure
    people will buy it.

    Mary: It actually sells really well! Even though it costs a little more, Tony’s
    Chocolonely pays farmers fairly and works to stop child labor. By buying their
    chocolate, we can help people produce chocolate in a better way.

    Tom: That’s good, but can one company really fix such a big problem? Most people
    just buy cheaper chocolate. They seldom think about the farmers…

    Mary: That’s true, and Tony’s Chocolonely knows it, too. They share their story
    on their chocolate wrappers. Tony believes if more people learn about it, they
    will buy it, and other companies might also change.

    Tom: He might be right, but change takes time. Many people still pick chocolate
    by price or taste, not because of the stories behind it.

    Mary: True, but every small move helps. Here — try it and see if paying a little
    more really helps others.

    Tom: Well, you go save the world, and I’ll go get my drink.


     fairly 公平地    wrapper 包裝紙'
