  stem: 請問根據此文的敘述，臺灣水韭與下列哪類植物親緣關係最近？
  options:
  - label: A
    content: 蘚苔植物
  - label: B
    content: 蕨類植物
  - label: C
    content: 裸子植物
  - label: D
    content: 被子植物
  group_stem: "臺灣水韭(Isoetes taiwanensis)為分布在陽明山的草本水生植物，其種小名來由為其發現地-台灣的拉丁化拼音。學界推測一開始可能是鳥類挟帶著水韭祖先的孢子到陽明山的夢幻湖，進而在當地建立族群，逐漸演化為現在的臺灣特有種水韭；另外，臺灣水韭的孢子囊位在葉子基部，跟其他近親植物的孢子囊位在葉背不同，被認為是比較原始的特徵構造。\n\
    \    研究發現，臺灣水韭雖然需要潮濕環境才能透過有性生殖繁衍，但在乾燥時最高紀錄可撐100 天仍保持存活。只分布在臺灣的特有種類，再加上特徵構造與生存能力的獨特性，臺灣水韭被視為珍貴稀有的植物，值得好好保育。\n\
    \n根據文章回答下列問題："
