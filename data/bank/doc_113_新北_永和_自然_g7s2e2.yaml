- id: doc_113_新北_永和_自然_g7s2e2_s3_49
  section: 3
  number: 49
  type: single
  page: 4
  stem: 請問對於恐龍的敘述何者正確？
  options:
  - label: A
    content: 現代的鱷魚、蜥蜴是恐龍演化後變小而來
  - label: B
    content: 所有的恐龍都有後代演化到現代
  - label: C
    content: 由恐龍演化而來的鳥類具有羽毛，於飛行有所幫助
  - label: D
    content: 恐龍可能有胎盤的構造
  group_stem: '恐龍是中生代地球上的主宰，出現在約2 億3 千萬年前，並且出現了鳥臀類、蜥腳類、獸腳類等不同類型的恐龍，最終於約6 千6 百萬年前大多數滅絕。然而，恐龍並未完全消失，其中一支獸腳類恐龍逐漸演化為現代鳥類，成為今日天空的居民。這段演化過程包含了許多重要變化，例如骨骼中空、前肢變為翅膀、出現羽毛與高代謝率，這些特徵使牠們能夠飛行並適應不同環境。

    與此同時，現代的爬蟲類（如蜥蜴、蛇與鱷魚）雖然也屬於爬行動物，但牠們與恐龍的演化路徑有所不同。大多數現代爬蟲是外溫動物，行動較為緩慢，體表覆蓋鱗片，並以貼地的姿勢爬行。相比之下，許多恐龍採直立行走，活動能力更強，近年來甚至有研究指出某些種類可能是內溫動物。

    透過化石與現代基因研究，科學家已證實鳥類是恐龍的直系後代。這一發現不僅改變了我們對恐龍的傳統印象，也顯示牠們與現代爬蟲類在生理與演化上的重大差異。如今，當我們仰望天空中飛翔的鳥類時，其實正是在見證恐龍故事的延續。


    根據文章回答下列問題：'
