  section: 1
  number: 43
  type: single
  page: 1
  stem: '小申與小勳相約到遊樂園遊玩，上網搜尋某間遊樂園在不同時段的收費標準，如右表所示，若小申想以最便宜的價格入園遊玩，而小勳卻想要在遊樂園中玩最久。根據右表及兩人的需求，下列何者敘述最正確？(L1)


    | 票種 | 時段 | 全票票價 |

    | :--- | :--- | :--- |

    | 午後票 | 13:30 後入場 | 650 元／張 |

    | 星光票 | 週六 16:30 後入場 | 299 元／張 |

    | 一般票 | 其他時段 | 899 元／張 |


    註：本園區營業時間：10:30~19:00'
