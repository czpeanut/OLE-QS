- id: doc_113_新北_福和_社會_公民_g9s1e1_s1_41
  section: 1
  number: 41
  type: single
  page: 1
  stem: 宜蘭縣外海的龜山島，外形神似大海浮龜而得名，是我國最年輕的火山島。曾經歷長達20 年的軍事管制，直到2000年解封後開放觀光，從一開始的每日 250
    人限制到現今的 1800 人，嚴格落實總量管制的旅客限制，20 年來的登島申請幾乎天天額滿，遊客的青睞永不停歇，在發展觀光與保護環境之間取得平衡。站在經濟學的角度，請問下列敘述何者正確？
    (L1)
  options:
  - label: A
    content: 因為遊客總量管制，登龜山島機會具稀少性
  - label: B
    content: 富翁因為有很多錢，申請登島不會面對稀少
  - label: C
    content: 自然美景永遠都會存在，所以不具有稀少性
  - label: D
    content: 規劃景點時，不需考量隱藏的環境維護成本。
