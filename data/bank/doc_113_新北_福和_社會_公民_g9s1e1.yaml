  stem: 許多商家與近期爆紅的「吉伊卡哇」開始聯名，像是與飲料店合作限定杯身等。而與壽司店的扭蛋聯名，甚至出現許多「代吃服務」，只要付錢就幫忙吃壽司、抽扭蛋，顯現「吉伊卡哇」的魅力無法擋。請問業者的作法，主要是運用下列何種因素，來影響消費者的消費行為？
