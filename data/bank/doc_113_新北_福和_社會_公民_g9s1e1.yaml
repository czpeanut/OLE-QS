  section: 1
  number: 45
  type: single
  page: 2
  stem: 南投縣清境農場有兩處停車場起先為免費停車，也引來「車露族」以車輛結合露營，直接在停車位上露營多日，導致停車亂象，許多民眾無法順利找到車位。之後兩處停車場皆開始新收費措施，並且24
    小時計費無上限。自從收費後，車露族已消失。針對上文內容，下列敘述何者正確？(L2)
