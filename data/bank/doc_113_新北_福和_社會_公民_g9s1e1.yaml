- id: doc_113_新北_福和_社會_公民_g9s1e1_s1_39
  section: 1
  number: 39
  type: single
  page: 1
  stem: 新北市政府於民國100 年時，實施「垃圾費隨袋徵收」政策，垃圾袋愈大，裝的垃圾量愈多，所繳的垃圾費愈多。右表為新北市每人每日平均垃圾量統計圖，請觀察本表，推測本政策所運用的誘因類型，與下列何者相同？
    (L1)
  options:
  - label: A
    content: 為倡導節能減碳，行政院推出家電汰舊換新節能補助
  - label: B
