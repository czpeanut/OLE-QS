- id: doc_113_新北_福和_社會_公民_g9s1e1_s2_47
  section: 2
  number: 47
  type: single
  page: 2
  stem: 根據題文，請問以資源分配的角度，關於各界對於掛號費的見解，下列何者敘述最為正確？(L2)
  options:
  - label: A
    content: 衛福部長認為掛號費應由政府管制，才能保障民眾就醫權利
  - label: B
    content: 立法委員質疑新政策的資源分配較無效率，才導致收費亂象
  - label: C
    content: 無論掛號費的收取採取何種方式，消費者都是最終的受益者
  - label: D
    content: 民間團體提出政府需制定掛號費標準，使醫療資源分配公平。
  group_stem: "❏ 請依照下列資料，回答 47 ~ 48 題：\n  前衛生署（現衛福部）為避免醫療機構收費標準差距過大，影響民眾就醫權益，在2010\
    \ 年公告醫療機構收取掛號費參考範圍，門診上限新台幣150 元，超過此範圍須向地方衛生局申請備查。不過自2024 年3 月起，衛福部取消醫院診所掛號費上限，讓收費價格回歸市場自由機制。部分醫院掛號費大幅提升，例如基層診所掛號費達2000\
    \ 元，而也有醫院只要支付6000 元掛號費可優先安排病床。\n  有立法委員批評衛福部未確實監督醫療院所收費，導致高額掛號費亂象，影響病人求診的權益及意願。民間團體也提出質疑，此舉將會導致經濟健康弱勢的民眾，因為沒有掛號費的減免優惠，而造成就醫經濟困難等情況，最終導致醫療階級化。衛福部長則回應「掛號費還是有彼此競爭，不可能說我們同一條街上，你如果收費較貴，就沒人要去了嘛。」掛號費屬於市場機制，除了讓醫療院所收費更彈性、合理，也能提升醫療服務品質，不會出現不合理價格。\n\
    2024/07/01 公視新聞網〈3 月起醫療掛號費取消上限 收費亂象引醫療階級化〉"
