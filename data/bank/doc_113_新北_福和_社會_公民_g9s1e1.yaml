  section: 1
  number: 44
  type: single
  page: 2
  stem: 今年四月的花蓮強震後，危險及老舊建築物的重建成為熱門話題，許多的老建物在補強後被標示紅、黃單危險建物。當地里長表示：「希望可以在附近興建社會住宅，讓居民不用被安置到原生活圈之外，店家也有空間可以繼續營業，提升居民的意願。」根據里長的發言，下列敘述何者正確？(L1)
  options:
  - label: A
    content: 里長希望藉由金錢誘因達到安置目標
  - label: B
