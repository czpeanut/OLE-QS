    | :--- | :--- | :--- |

    | (A)定義 | 赤道及與赤道平行的圓圈線 | 連結南、北極點的弧線 |

    | (B)方向 | 南北向 | 東西向 |

    | (C)長度 | 赤道最長，往兩極縮短 | 等長 |

