  section: 1
  number: 17
  type: single
  page: 2
  stem: '芸薇老師在歷史課上進行小組快答競賽，班上同學爭相上臺說明新石器時代的正確文化內容後可獲得積分。請問：下列哪些同學的發言正確並能夠得分？

    甲生：「拿著陶器盛水和食物。」

