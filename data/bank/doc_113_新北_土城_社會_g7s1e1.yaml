- id: doc_113_新北_土城_社會_g7s1e1_s2_46
  section: 2
  number: 46
  type: single
  page: 5
  stem: 根據此文章的訊息以及你所學的歷史知識，下列敘述何者正確?
  options:
  - label: A
    content: 阿美族和卑南族是同一個原住民族
  - label: B
    content: 在贅婚制度下，姓氏多會跟隨父姓
  - label: C
    content: 兩族或許有過相同的環境變動經歷
  - label: D
    content: 根據紀載，兩族祖先皆來自於大陸
  group_stem: '大約7000 年前，南島語族開始進行了橫跨大洋的大遷移，根據南島語言學者的研究，古南島語系民族是在亞洲大陸和侗傣語系民族分家之後，而遷移到臺灣、大約過了一千多年才開始分化，向東南亞、南太平洋逐漸擴散，臺灣地區很可能就是南島語族遷移的第一站，於距今4500
    年前後，在臺灣的族群隨著地域環境發展成許多不同系統的新石器時代文化，此外南島移民也發展出獨特的航海技術和船隻，能夠利用風和海流，裝載人員、動植物和其他生活器具，往返於原鄉和遠方的島嶼間，完成移民的壯舉。

    在臺灣原住民中，分佈於臺灣東部的阿美族與卑南族，是最為特殊的民族，這兩個民族除了皆有洪水傳說外，都是典型的母系社會。指女性在家族中具有絕對優勢的地位，男性則處於從屬地位，因此採取贅婚制度，婚後共同居住在女方家中。阿美族的男性認為，入贅是一種光榮，因為丈夫可以藉此機會改善妻子家中的生活情況。在家族中，家長是由女性擔任，財產的繼承也是由母親傳給女兒；年幼的子女與母親居住，並以母親的姓氏作為命名的原則。

    除了母系社會的傳統外，另一項特色便是男性年齡階級制度。藉由不同年齡而將男性加以編組，負責處理部落中政治、軍事、司法、宗教等公共事務。女性雖然是家中的主宰；然而，家族對外的代表卻是由男性負責，女性無法參與部落中的公共事務，也不能進入部落中的男性會所，部落中的首長與祭司多半也是由男性繼承。換言之，母系社會並非是女性權力至上的社會制度，而是透過男主外女主內的分工合作，來達成男女平等的一種社會模式。

    隨著日本在臺殖民與國民政府來臺，入贅婚的習俗，也隨著時代而改為父系社會的嫁娶婚，子女的姓氏也多跟隨父親。部落中的男性由於外出工作，也逐漸掌握家中經濟權力，傳統的母系社會色彩逐漸淡去，象徵著傳統原住民文化，在現代社會中的受到衝擊與變化。(46～50
    題)'
