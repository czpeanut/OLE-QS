- id: doc_111_高雄_大灣_國文_g8s1e3_s2_36
  section: 2
  number: 36
  type: single
  page: 5
  stem: 根據報任少卿書節錄文字，下列敘述何者為非？
  options:
  - label: A
    content: 富貴不足恃，唯有具特殊才能或成就者能在歷史上留其名
  - label: B
    content: 這些遭逢困厄之人，透過著書抒發憤懣之情，而創立不朽之名作
  - label: C
    content: 「欲以究天人之際，通古今之變，成一家之言」可知作者獨尊儒家言論
  - label: D
    content: 左丘、孫子雖身體有所殘缺，卻能化苦難為力量而有所作為。
  group_stem: "題組(一)\n   司馬遷在受了宮刑之後仍要寫他的史記；曹雪芹在黯淡空寂的晚年寫出了紅樓夢；傑克倫敦開始寫野性的呼喚時，所謂的書桌只是個小小的肥皂箱；而林布蘭到了最後，刻出那些精緻繁複的銅版畫時，工作室裡只點得起一支微弱的燭光。就算不提這些比較遙遠的例子，就在今天，就在我們眼前，歷經顛沛流離的王鼎鈞，正在一本又一本地面寫出近代中國的史詩；而被輕視與冷落了多少年的余承堯，終於靠著自己的堅持建立起獨特的繪畫風格；還有那個年輕的范康龍，原是滿懷憤恨在孤兒院裡長大的肢體殘障者，卻終於能夠把全部力量都放進他的雕刻刀裡，刻出了那樣深沉動人又無限光耀的作品來。\
    \ （節錄自席慕蓉  得失之間）\n---------------------------------------------------------------------------------------------------\n\
    \    古者富貴而名摩滅，不可勝記，唯倜儻非常之人稱焉。蓋文王拘而演周易；仲尼厄而作春秋；屈原放逐，乃賦離騷；左丘失明，厥有國語；孫子臏腳，兵法修列；不韋遷蜀，世傳呂覽；\
    \ 韓非囚秦，說難、孤憤。詩三百篇，大底賢聖發憤之所為作也。此人皆意有所鬱結，不得通其道，故述往事，思來者。乃如左丘無目，孫子斷足，終不可用，退而論書策以舒其憤，思垂空文以自見。\n\
    \    僕竊不遜，近自托於無能之辭，網羅天下放失舊聞，略考其行事，綜其終始，稽其成敗興壞之紀， 上計軒轅，下至於茲，為十表，本紀十二，書八章，世家三十，列傳七十，凡百三十篇。亦欲以究天人之際，通古今之變，成一家之言。草創未就，會遭此禍，惜其不成，是以就極刑而無慍色。僕誠以著此書，藏之名山，傳之其人，通邑大都，則僕償前辱之責，雖萬被戮，豈有悔哉﹖然此可為智者道，難為俗人言也！\
    \  （節錄自司馬遷  報任少卿書）"
