  group_stem: "題組﹙二﹚\n下午的陽光意外的和暖，在多煙多嶂的蜀地，這樣的冬日也算難得了。藥香微微，爐火上氤氳著朦朧的白霧。那男子午寐未醒，一隻小狗偎著白髮婦人的腳邊打盹。\n\
    \    婦人望著榻上的男子，這個被「消渴之疾①」所苦的老漢，他的手腳細瘦，膚色黯敗，她用目光愛撫那衰殘的軀體。\n   （甲）她選擇了那琴聲，冒險跟隨了那琴聲，從父親卓王孫的家中逃逸。從此她放棄了僕從如雲，揮金如土的生涯。她不覺乍貧，狂喜中反覺乍富，和司馬長卿相守，彷彿與一篇繁富典麗的漢賦相廝纏，每一句，每一逗，都華豔難蹤。\n\
    \   （乙）記憶裡不曾有這樣一副面孔，他的額髮已禿，頸項上疊著像駱駝一般的贅皮。他不像當年的才子司馬相如，倒像司馬相如的父親或祖父。年輕時候的司馬雖非美男子，但肌膚堅實，顧盼生姿，能將一把琴彈得曲折多情如一腔幽腸。他又善劍，琴聲中每有劍風的清揚裊健。又彷彿那琴不是什麼人製造的什麼樂器，每根琴絃，一一都如他指尖瀉下的寒泉翠瀑，琤琤琮琮，淌不完的高山流水、谷煙壑雲。\n\
    \   （丙）猶記得那個遙遠的長夜，她新寡，他的琴聲傳來，如荷花的花苞在中宵柔緩綻放，彈指間，一池香瓣已燦然如萬千火苗。\n    想著，她站起來，走到衣箱前，掀了蓋，掏摸出一枚銅錢，錢雖舊了，卻還晶亮。這是她當年開酒肆賣出第一杯酒的酒錢。對她而言，這一錢勝過萬貫家財。這一枚錢一直是她的祕密，誰都不知。珍藏這一枚錢其實是珍藏年少時那段快樂的私奔歲月。\n\
    \    酒肆遵父命關門的那天，卓王孫送來僕人和金錢。於是，她知道，這一切逾軌的快樂都結束了。事情後來的發展果真一如她所料，有了功名以後，長卿一度想娶一位茂陵女子為妾，文君用一首白頭吟挽回了自己的婚姻—對，挽回了婚姻，但不是愛情。\n\
    \    皚如山上雪，皎若雲間月。\n    聞君有兩意，故來相決絕。\n    淒淒復淒淒，嫁娶不須啼。\n    願得一心人，白頭不相離。\n    一心人？世上有那一心一意的男人嗎？藥涼了，可以喝了，她打算叫醒長卿，並且下定決心繼續愛他。\
    \ 不，其實不是愛他，而是愛屬於她自己的那分愛！把銅錢放回衣箱一角，卓文君輕聲喚道：「長卿，起來， 藥，熬好了。」\n                  \
    \                                                 （張曉風 卓文君和她的一文銅錢）\n【注釋】①消渴之疾：糖尿病"
