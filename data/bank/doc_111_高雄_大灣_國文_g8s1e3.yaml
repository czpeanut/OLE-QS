- id: doc_111_高雄_大灣_國文_g8s1e3_s1_21
  section: 1
  number: 21
  type: single
  page: 3
  stem: 同學們在課堂上朗誦張釋之執法課文，念到「縣人來，聞蹕，匿橋下。久之，以為行已過，即出，見乘輿車騎即走耳。」一段，老師提醒這段縣人的自白，要充分呈現人物形象。哪一選項的解讀錯誤？
  options:
  - label: A
    content: 念到「見乘輿車騎即走耳」時，要呈現縣人嚇得要死轉身就跑的樣子
  - label: B
    content: 朗誦時語氣要哀戚一點，使縣人其情可憫的形象生動呈現
  - label: C
    content: 以迫促、簡短的語氣，呈現縣人誠惶誠恐、緊張害怕的神情
  - label: D
    content: 念到「即出」應要加重語氣，呈現縣人逃躲官兵追捕的急切。
  lesson_raw:
    title: 張釋之執法
    basis: 題目引用課名「張釋之執法」
- id: doc_111_高雄_大灣_國文_g8s1e3_s1_22
  section: 1
  number: 22
  type: single
  page: 3
  stem: "小杉要做一篇有關史記的報告。根據他所查的史記體制分類資料，請同學判斷下面這篇文章應屬於哪一種體制﹖\n史 記 體 制 分 類\n| 史 記 體 制\
    \ 分 類 | |\n| --- | --- |\n| ﹙甲﹚本紀 | 歷代帝王的世系和國家大事 |\n| ﹙乙﹚世家 | 記述諸侯國興衰存亡的歷史 |\n\
    | ﹙丙﹚書 | 對經濟﹑文化及典章制度做專門論述 |\n| ﹙丁﹚列傳 | 專記歷史上的重要人物﹑社會各階層代表 |\n\n    曹沫，魯國人，以勇敢有力為魯莊公的臣子。莊公喜歡勇猛有力量的人。曹沫後來做了魯國將軍，在與齊國發生戰爭時，三次敗北。魯莊公很害怕，就獻上遂邑這個地方向齊國求和。仍舊以曹沫為將軍。齊桓公答應了，與魯在柯這個地方簽訂和平盟約。桓公與莊公已經在高壇上簽訂盟約，突然，曹沫手執匕首劫住齊桓公，桓公左右侍衛都不敢動，而問曰：「你想做什麼？」曹沫曰：「齊國強，魯國弱，而大國侵略魯國也太過了！現在魯國的城被破壞後就可以直接迫近齊國國境，閣下考慮看看吧！」桓公於是答應將佔領了的魯國國土全部歸還。\n\
    \  話一說完，曹沫就把匕首丟下，下了高壇，仍就面向北面坐回臣子的座位，且臉上毫無愧色，言談如故。桓公大怒，想要違背盟約。管仲曰：「不可。貪小利以自快，背信於諸侯，會失去天下的援助，不如給他們吧。」於是桓公就把魯國的土地都還給魯國，曹沫三次戰敗所失去的土地都歸還給魯國了。"
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
