- id: doc_111_高雄_大灣_國文_g8s1e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: "「梅克爾表現了她的腳踏實地，完全一如她科學家的求證精神，這就是思考的質量。而當思考有質量的時候， 觀看世界就能有平等的理念。於是，你所面對的每一個人，都是與你一樣平等的，沒有職業的高低，只有是否專業。當人能這樣思考時，就會比較注重互相尊敬。\n\
    \                                                            鄭華娟 柔軟的心，強大的力量\n\
    梅克爾觀看世界的觀點，與下列哪一選項最相近？"
  options:
  - label: A
    content: 願隨壯士斬蛟蜃，不願腰間纏錦絛 (蘇軾)
  - label: B
    content: 絕頂人來少，高松鶴不群 (劉禹錫)
  - label: C
    content: 人生交契無老少，論交何必先同調 (杜甫)
  - label: D
    content: 紙上得來終覺淺，絕知此事要躬行 (陸游)。
- id: doc_111_高雄_大灣_國文_g8s1e3_s1_19
  section: 1
