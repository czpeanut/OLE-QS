  stem: '花輪參加「金庫密碼」的活動，遊戲規則是：將例句與字義正確搭配，形成二組密碼就通過一關。請問花輪的第幾組密碼完全正確？

    | 例 句 | 字 義 |

    | --- | --- |

    | ﹙甲﹚廷尉乃當「之」罰金 | ﹙子﹚人犯 |

    | ﹙乙﹚廷尉「當」是也 | ﹙丑﹚的 |

    | ﹙丙﹚屬「之」廷尉 | ﹙寅﹚罪 |

    | ﹙丁﹚今法如此而更重「之」 | ﹙卯﹚名詞，判決 |

    | ﹙戊﹚廷尉奏當：一人犯蹕，「當」罰金 | ﹙辰﹚動詞，判決 |

    | ﹙己﹚天下「之」平也。 | ﹙巳﹚無義 |'
  options:
  - label: A
    content: 第一組：甲子／戊辰
  - label: B
    content: 第二組：丁巳／戊辰
  - label: C
    content: 第三組：乙卯／己巳
  - label: D
    content: 第四組：丙寅／己丑。
