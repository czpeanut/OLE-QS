  section: 1
  number: 28
  type: single
  page: 4
  stem: "有人問我吃不吃口香糖？我回答說：「不吃，那東西太像人生，我把它劃為『悲慘食物』。」\n我不能忍受的是：它始於清甜芳香，卻竟而愈嚼愈像白蠟，終而必須吐之棄之，成為廢物。\n\
    \    人的一生也是如此，一切最好的全在童年時期過完了，花瓣似的肌膚，星月般的眼眸，記憶力則如烙鐵之印，清晰永誌。然而當歲月走過，剩下的是菡萏香銷之餘的殘梗，是玉柱傾圮之後的廢墟。\n\
    雞皮鶴髮耳聾齒落之際，難道不像嚼餘的糖膠嗎？連成為垃圾都屬於不受歡迎的垃圾。\n    口香糖是眾糖之中最悲哀的糖。它的情節總是急轉直下，陡降深淵。\n \
    \                                                              ( 張曉風 口香糖.梨.便當\
    \ )\n上文中，作者說：「口香糖的情節總是急轉直下，陡降深淵。」下列何者並不屬於於作者所謂「情節」中？"
  options:
  - label: A
    content: 人生最美好的時光，非童年時期莫屬
  - label: B
    content: 人到晚年，晚景淒涼猶如口香糖殘渣
  - label: C
    content: 先甘後苦的人生過程最是悲哀
  - label: D
    content: 倒吃甘蔗的人生才是美好人生。
