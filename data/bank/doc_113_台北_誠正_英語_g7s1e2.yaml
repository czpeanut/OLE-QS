  group_stem: 'It’s Friday. Hana is talking with Mei, Alex and Rita online.

    They are in different cities.

    (At 9:10 a.m.)

    Hana: Hey everyone! Taylor Swift’s concert is tomorrow!

    I can’t wait to see her on the stage.

    Mei: Wow! What time is the concert?

    Hana: It’s at 7 p.m.

    Alex: Is the concert at Rogers Centre?

    Hana: That’s right. Swift’s six shows are at the place.

    Rita: Do you go with the handsome boy, Peter?

    Hana: No, he’s not free this weekend.

    Alex: Hey, my sister is in Taranto now. Maybe she can go with you. She’s a Swiftie,
    too. She can sing all Taylor Swift’s songs.

    Hana: That’s great!

    Mei: I’m watching Swift’s concert video with my sister now.

    I hope she can come to Taiwan.

    Rita: Hey, guys. I’m going to bed now. Don’t forget to share the concert with
    us, Hana.

    Hana: Sure. Good night, Rita.


    online 線上 tomorrow 明天 different 不同的 city 城市

