- id: doc_113_台中_五權_社會_歷史_g9s2e2_s1_17
  section: 1
  number: 17
  type: single
  page: 1
  stem: 下圖是二十世紀時，甲、乙二國領袖來往的信函，根據內容判斷，下列敘述何者正確？
  options:
  - label: A
    content: 甲國是指蘇聯，乙國是指古巴
  - label: B
    content: 此事件是因美國在古巴部署飛彈威脅蘇聯
  - label: C
    content: 經過此事件冷戰逐漸升溫，對立更加激烈
  - label: D
    content: 波蘭當時與甲國的政治理念持相同的立場
