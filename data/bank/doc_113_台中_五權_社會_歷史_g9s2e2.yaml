- id: doc_113_台中_五權_社會_歷史_g9s2e2_s1_18
  section: 1
  number: 18
  type: single
  page: 1
  stem: 下圖是美國在 1910 年至 1960 年失業率的統計表，表中數字的高峰期。請問，下列歷史事件何者與此時期有關？
  options:
  - label: A
    content: 發生的原因之一為美國降低關稅影響國內收入
  - label: B
    content: 美國政府興建大公共建設，藉此增加就業機會
  - label: C
    content: 美國總統門羅推行計畫經濟減緩失業率的危機
  - label: D
    content: 蘇聯發展軍事武力國防致使人民生活水準降低
  assets:
  - key: s1_18_f1
    kind: figure
    file: doc_113_台中_五權_社會_歷史_g9s2e2/s1_18_f1.png
- id: doc_113_台中_五權_社會_歷史_g9s2e2_s1_19
  section: 1
  number: 19
  type: single
  page: 1
  stem: 二戰過後，英國首相邱吉爾訪問美國時，曾發表著名的「鐵幕演說」：「從波羅的海到亞德里亞海，一道鐵幕已經在中東和東歐降下來了。這道鐵幕背後有華沙、柏林、布拉格、維也納等等……
    。蘇聯在鐵幕後…………。」這段演說後來被認為是□開始的標誌。請問，□應是指下列何者？
  options:
  - label: A
    content: 蘇聯在歐洲的擴張
  - label: B
    content: 德國對歐洲的威脅
  - label: C
    content: 日本在亞太的崛起
  - label: D
    content: 義大利對非洲侵略
- id: doc_113_台中_五權_社會_歷史_g9s2e2_s1_20
  section: 1
  number: 20
  type: single
  page: 1
  stem: 在戰間期，專制獨裁的極權主義大行其道，追根究底，極權主義能在全球占有一席之地的原因為何？
  options:
  - label: A
    content: 美國在一戰後走上孤立主義，助長極權主義的氣焰
  - label: B
    content: 群眾太過單純，被野心家之言論所蠱惑而崇拜偶像
  - label: C
    content: 在共產國際的支持下，東歐國家逐漸靠向共產勢力
  - label: D
    content: 因經濟大恐慌爆發，人民否定民主國家的經濟型態
- id: doc_113_台中_五權_社會_歷史_g9s2e2_s1_21
  section: 1
  number: 21
  type: single
  page: 1
  stem: 英國首相張伯倫，在某場會議後的公開演說中表示：「我從德國帶回了我們時代的和平」，認為在這場會議中止住了希特勒的野心，並認為這是一次空前的外交勝利；但不到半年的時間，希特勒的侵略行動粉碎了張伯倫的和平論。請問，張伯倫所參加的會議應是下列哪一場？
  options:
  - label: A
    content: 巴黎和會
  - label: B
    content: 開羅會議
  - label: C
    content: 慕尼黑會議
  - label: D
    content: 雅爾達會議
- id: doc_113_台中_五權_社會_歷史_g9s2e2_s1_22
  section: 1
  number: 22
  type: single
  page: 1
  stem: 二次世界大戰後，美蘇兩強對峙，夾在中間的歐洲思考如何走出自己的路。1950 年，一幅以「放大鏡下的歐洲：第三力量」為題的政治漫畫，將歐洲各國畫成小孩子，被兩位大人以放大鏡檢視，有些小孩更被壓制在一位大人的膝蓋下方。請問，以下何者最適合用來描述這幅圖片反應的國際局勢？
  options:
  - label: A
    content: 四國分占德國時期，兩位大人代表同盟國與軸心國，被壓制的是中歐
  - label: B
    content: 國際冷戰時期，兩位大人代表民主陣營與共產集團，被壓制的是東歐
  - label: C
    content: 殖民地解放時期，兩位大人代表美、蘇帝國主義，被壓制的是西南歐
  - label: D
    content: 西歐重建時期，兩位大人代表自由經濟與計畫經濟，被壓制的是北歐
  assets:
  - key: s1_22_f1
    kind: figure
    file: doc_113_台中_五權_社會_歷史_g9s2e2/s1_22_f1.png
- id: doc_113_台中_五權_社會_歷史_g9s2e2_s1_23
  section: 1
  number: 23
  type: single
  page: 1
  stem: 自美國爆發經濟大恐慌，此經濟風暴逐漸蔓延至全球，日本亦受影響，使其國內軍國主義昂揚；日本為了獲取資源解決國內經濟問題，選擇向外侵略。請問，日本下列哪一場侵略行動與經濟大恐慌無關？
  options:
  - label: A
    content: 蘆溝橋事變
  - label: B
    content: 九一八事變
  - label: C
    content: 一二八事變
  - label: D
    content: 日本入侵山東
- id: doc_113_台中_五權_社會_歷史_g9s2e2_s1_24
  section: 1
  number: 24
  type: single
  page: 1
  stem: 自 2014 年起，俄羅斯即對烏克蘭進行不定時小規模的武裝侵略；2022 年起烏俄衝突升級，至今已三年，烏俄仍在戰爭中。烏克蘭總統澤倫斯基不斷表達烏克蘭欲參與北大西洋公約組織（北約）的意願，甚至於今年
    2 月表示，「願意放棄總統職位換取烏克蘭加入北約」，欲透過北約的軍事武力使烏克蘭獲得一定的保障。請問，北約的成立與當時的哪一個時代背景相關？
  options:
  - label: A
    content: 致力於解決國際的紛爭
  - label: B
    content: 欲圍堵共產勢力的擴張
  - label: C
    content: 積極推展東亞經濟與安全合作
  - label: D
    content: 聯合亞洲國家防止共產勢力擴張
- id: doc_113_台中_五權_社會_歷史_g9s2e2_s1_25
  section: 1
  number: 25
  type: single
  page: 1
  stem: 1961 年德國哲學家漢娜‧鄂蘭(Hannah Arendt)在為《紐約客》（The New Yorker）報導法庭對阿道夫．艾希曼(Adolph
    Eichmann)戰犯審判。阿道夫．艾希曼是因為執行長官對種族滅絕屠殺的任務而被審判，這場滅絕行動屠殺了超過 600 萬人。透過審判過程中，漢娜‧鄂蘭提出「平庸的邪惡」的概念，指出社會中大多數的個人的不願意思考，將會推動整體社會走向終極的犯罪。請問「平庸的邪惡」最可能是出於對下列何者的反省？
  options:
  - label: A
    content: 日本的軍國主義
  - label: B
    content: 義大利的威權統治
  - label: C
    content: 納粹德國的屠殺猶太人
  - label: D
    content: 蘇聯對有產階級的鬥爭
- id: doc_113_台中_五權_社會_歷史_g9s2e2_s1_26
  section: 1
  number: 26
  type: single
  page: 2
  stem: 從政黨的特質加以判斷，可知該政黨的核心價值。請問，下列哪些精神最可以代表義大利法西斯黨的政治信條？
  options:
  - label: A
    content: 信仰、服從、戰鬥
  - label: B
    content: 民族、民權、民生
  - label: C
    content: 自由、平等、博愛
  - label: D
    content: 和平、土地、麵包
- id: doc_113_台中_五權_社會_歷史_g9s2e2_s1_27
  section: 1
  number: 27
  type: single
  page: 2
  stem: '這位歷史人物在擔任蘇聯共產黨總書記後，對內改革蘇聯停滯的經濟，對外改善與歐美民主國家的關係，以及放寬對共產國家的干預，並於 1990 年當選諾貝爾和平獎，不過
    1991 年蘇聯保守派對其發動政變但以失敗告終。請問下列事件哪些是這位歷史人物改革行動下的影響？

    （甲）蘇聯解體、（乙）冷戰結束、（丙）德國統一、（丁）第三世界興起。'
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙丙丁
  - label: C
    content: 甲丙丁
  - label: D
    content: 甲乙丁
- id: doc_113_台中_五權_社會_歷史_g9s2e2_s1_28
  section: 1
  number: 28
  type: single
  page: 2
  stem: 下列關於第三世界的敘述，何者正確？
  options:
  - label: A
    content: 成立東南亞公約組織對抗共產勢力
  - label: B
    content: 第三世界在國際舞臺上未有足夠影響力
  - label: C
    content: 大多是經濟貧困、政治動盪不安的國家
  - label: D
    content: 在冷戰中依據各國立場分別選擇親美或親蘇
- id: doc_113_台中_五權_社會_歷史_g9s2e2_s1_29
  section: 1
  number: 29
  type: single
  page: 2
  stem: 2023 年爆發的加薩戰爭，是巴勒斯坦激進武裝組織「哈瑪斯」與以色列軍隊的武裝衝突。在此次戰爭中，以色列發動現代史上最具破壞力的轟炸行動，並有大量平民在此次戰爭中遭到殺害，至
    2025 年 1 月停火；然而以色列 3 月時空襲加薩走廊(居民主要為戰火下被迫遷徙至此的巴勒斯坦人)，導致 413 名巴勒斯坦人喪生。不少國際輿論指出，以色列此次的軍事行動造成大量平民死傷和流離失所，此舉將會削弱國際社會對以色列的同情。請問，下列何者是造成以巴衝突的主因？
  options:
  - label: A
    content: 羅馬帝國迫害猶太人
  - label: B
    content: 民族自決引爆的族群紛爭
  - label: C
    content: 冷戰局勢美蘇對立的延伸
  - label: D
    content: 猶太人與阿拉伯人的衝突
- id: doc_113_台中_五權_社會_歷史_g9s2e2_s1_30
  section: 1
  number: 30
  type: single
  page: 2
  stem: 韓戰與越戰皆屬冷戰時期的區域性衝突，請問，下列何者是韓戰與越戰的共同點？
  options:
  - label: A
    content: 戰後皆由共產勢力獲勝
  - label: B
    content: 戰後兩國迄今尚未統一
  - label: C
    content: 戰後兩國仍被西方殖民
  - label: D
    content: 兩場戰役皆有美國參與
