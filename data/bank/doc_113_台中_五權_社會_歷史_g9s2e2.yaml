  stem: 第一站將前往由知名導演導演史蒂芬‧史匹柏和知名演員演員湯姆‧漢克斯擔任製作人所籌畫拍攝的《諾曼第大空降》，背景為 1944 年的諾曼第登陸。請問，這一站的地點應在地圖中的何處？
