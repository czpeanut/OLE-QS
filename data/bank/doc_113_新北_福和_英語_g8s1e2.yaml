- id: doc_113_新北_福和_英語_g8s1e2_s7_49
  section: 7
  number: 49
  type: single
  page: 4
  stem: What is the best title of the reading?
  options:
  - label: A
    content: The Famous Jump Boy.
  - label: B
    content: Tang’s Road to Success.
  - label: C
    content: The 2024 Paris Olympics.
  - label: D
    content: Asian Cat King Is a Man with ADHD.
  group_stem: '(49～51)

    The 2024 Paris Olympics were really great. A man from Taiwan, Tang Chia-Hung,
    was a gymnastics star. Some people called him the "Asian Cat King" for his high-difficulty
    gymnastics moves.

    However, Tang’s road to success was not easy at all. He was diagnosed with ADHD
    before elementary school, and the doctor told his parents to let him exercise
    more. He got hurt in high school and faced many problems when he practiced gymnastics,
    but he never gave up. He got first place in some competitions. On the Olympic
    stage, Tang became the "World Cat King."

    Tang’s passion for gymnastics began at a young age. After watching the video,
    Jump Boys, Tang started to learn from Lin Yu-Hsin. His mother even moved to Luodong
    because Lin Yu-Hsin lived there, and his father built some gymnastics equipments
    for him to practice on. Tang''s family was always there to cheer for him at competitions.

    Tang’s hard work is the key to his success at the 2020 Tokyo Olympics, where he
    set a record for Taiwan in the men''s all-around gymnastics. In the 2024 Paris
    Olympics, Tang won Taiwan’s first-ever Olympic bronze medal. He really sets a
    good example for us—hard work brings success.

