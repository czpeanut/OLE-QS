- id: doc_113_新北_福和_英語_g8s1e2_s7_52
  section: 7
  number: 52
  type: single
  page: 5
  stem: What idea does the test give?
  options:
  - label: A
    content: Think a lot about each question.
  - label: B
    content: Ask your friends for help. 📖 honestly 誠實的
  - label: C
    content: Answer quickly and honestly.
  - label: D
    content: Mark only 1 or 5 on each question.
  group_stem: '(52～55)

    What May You Become in the Future?

    How old are you? About 13 or 14? Did you ever think about your future? If you
    don’t have any idea, maybe the test can help you know yourself more and help you
    find out what kind of people you are and what your dream job may be.

    In each question, mark a number depending on the facts.

    Example: I like going out with my friends in my free time.

    False ①②③④⑤ True

    If you really like to be with your friends when you’re free, mark⑤. However, if
    you like being alone more, mark①. Remember, don’t overthink before answering the
    questions, or the test may be wrong.

    | I | You like being alone or with a small group. You think a lot before speaking
    and get energy from quiet time. | E | You like to go out with people and you always
    get energy from that. |

    |---|---|---|---|

    | S | You like real things and see facts easily. | N | You think about ideas and
    possibilities. You see the big picture and like imagining future possibilities.
    |

    | T | You decide everything depending on facts but not people’s feelings. | F
    | You take care of people’s feelings when deciding things and try very hard to
    be kind. |

    | J | You like to make plans and decide things very quickly. | P | You don’t like
    to decide things at the beginning. You enjoy planning at the last minute. |


    The test gives you only some ideas about who you may be but not who you are. You
    still should decide your own future.

    📖 depending on 依據 overthink 想太多 energy 活力 possibility 可能性 imagine 想像'
