- id: doc_113_新北_福和_英語_g8s1e2_s7_46
  section: 7
  number: 46
  type: single
  page: 4
  stem: What does "All Hallows' Eve" mean?
  options:
  - label: A
    content: The night after Halloween.
  - label: B
    content: The evening before All Hallows' Day.
  - label: C
    content: Another name for Christmas Eve.
  - label: D
    content: A day for decorating homes.
  group_stem: '(46～48)

    Halloween is a scary but fun holiday. People celebrate it on October 31st. It
    started over 2,000 years ago with the Celts, a group of people in Ireland and
    the UK. They had a festival, Samhain, then. It marks the end of summer and the
    start of winter. The Celts believed that on this night, the spirits of the dead
    could visit the living world, so people wore costumes to scare away the bad spirits.

    In the 8th century, the Christian church made a special day, All Hallows'' Day,
    on November 1st to remember saints. The night before became “All Hallows’ Eve,”
    and then it turned into “Halloween.” Over time, Halloween changed and grew popular
    in the United States and other countries.

    Today, Halloween is a day of fun activities like dressing up in costumes, carving
    pumkins, and going "trick-or-treating" for candy. People decorate their houses
    with scary things like ghosts, witches, and jack-o’-lanterns. It’s a time for
    people to make scary or funny costumes and show their ideas.

    People scared the bad spirits away at the beginning of Halloween, but now people
    all over the world like celebrating it with friends and family!

    📖 spirits 靈魂 century 世紀 Christian 基督教的 saints 聖者 decorate 裝飾'
