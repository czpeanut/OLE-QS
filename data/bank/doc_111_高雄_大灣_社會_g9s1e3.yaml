    資料二：到了十九世紀，英國東印度公司從中國輸出的商品，茶葉已經占了百分之九十以上，占了英國國庫收入的百分之十。英國東印度公司都是拿白銀買茶的，英國人心想，總不能老是拿白花花的銀子買吧？如果有一天，中國人突然心一橫，不賣了，又該怎麼辦呢？一心想平衡貿易逆差的英國人終於想出了辦法，拿某商品打入中國市場。'
