  - label: C
    content: 在十七世紀西班牙人進入澳洲，帶來的天花等傳染病讓原住民死傷過半
  - label: D
    content: 在十八世紀英國人侵略澳洲，原住民不敵英國的武力與帶來的疾病，最終使移民占了人數的優勢
