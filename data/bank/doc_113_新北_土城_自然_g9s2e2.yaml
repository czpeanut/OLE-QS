- id: doc_113_新北_土城_自然_g9s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '小政進行實驗，探討「不同的洗滌方法，對小白菜農藥殘留量的影響」，他以相同的方式種植一批小白菜且未噴灑農藥，採收小白菜後先做「前處理」，接著分成五組，分別經由甲～戊的洗滌方法後，再做檢測，結果如下表所示。


    | 組別 | 甲 | 乙 | 丙 | 丁 | 戊 |

    | --- | --- | --- | --- | --- | --- |

    | 洗滌方法 | 不洗滌 | 清水浸泡洗滌 | 清水加食鹽浸泡洗滌 | 清水加蔬果洗滌劑浸泡洗滌 | 清水直接沖洗 |

    | 對檢測用酵素的抑制率 | 44.74％ | 34.21％ | 42.11％ | 18.42％ | 2.52％ |


    說明：對檢測用酵素的抑制率愈高，代表小白菜的農藥殘留量愈高。

    小政提出以下觀點：

    (1)清水浸泡洗滌方法中，不用添加物比使用添加物的洗滌效果好

    (2)清水直接沖洗比各種浸泡洗滌方法的效果好

    根據本文，關於小政的觀點，下列敘述何者合理？'
  options:
  - label: A
    content: 比較乙、丁的結果，可知觀點1.不恰當。
  - label: B
    content: 比較乙、丙的結果，可知觀點1.不恰當。
  - label: C
    content: 比較乙、戊的結果，可知觀點2.不恰當。
  - label: D
    content: 比較甲、戊的結果，可知觀點2.不恰當。
  tags:
