  group_stem: "題組1：「無線充電」\n    無線充電之所以在近年興起的原因，就是因應智慧型手機、智慧手錶、真無線藍芽耳機等3C 產品蓬勃發展，造成人們在擁有多個攜帶式電子裝置下，所需要充電的產品跟充電線也越來越多。\n\
    \    無線充電基座中的線圈會發射訊號給手機／裝置上的接收線圈。感應到接收線圈後，就會產生磁場，讓電力開始流動，這時接收線圈裡面的電流就是幫手機電池充電的電力。\n\
    \     隨著無線充電的發展，在2008 年時有了無線充電聯盟（WPC）的成立，制定出「Qi」這個技術標準，在安全性、設備相容性等面向做了規範，成為現在世界上最受歡迎、分佈最廣的無線充電認證規格。"
