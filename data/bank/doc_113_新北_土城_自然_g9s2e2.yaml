- id: doc_113_新北_土城_自然_g9s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '單極馬達是最早被科學家發現的馬達形式，構造簡單，利用電池、強力磁鐵與一段銅線即可製作。小南製作了一個單極馬達裝置，裝置的電池負極連接強力磁鐵，銅線上方突起與電池正極接觸、下方兩端與強力磁鐵接觸，且強力磁鐵可導電，如附圖所示。關於此現象的描述，小政和小益想要表達他們的觀點，以下是他們的說法，請問關於兩位同學的敘述是否正確？

    小政：銅線順時針旋轉，可見下方強力磁鐵的N 極在下方。

    小益：其實也不一定要銅線，只要是金屬線都可以導電，但如果使用鐵線，不一定能順利轉動。'
