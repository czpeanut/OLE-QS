  group_stem: "題組2：「溫室效應」\n    地球表面由大氣層所包圍，就像溫室的透明玻璃，在陽光照射地球時，可防止地面溫度及溼度散失，使地面溫度不會下降太快，地表年均溫因此能保持15℃左右，此現象即稱為「溫室效應」。若無溫室效應，來自陽光的能量會很快由地表釋放回去，地球的溫度也將降至－18℃左右而成為極冷的世界。適度的溫室效應適宜地球生物存活，使人類悠遊於四季交替。"
