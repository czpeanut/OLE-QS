- id: doc_111_嘉義_北興_國文_g7s2e2_s4_1
  section: 4
  number: 1
  type: single
  page: 1
  stem: 在語文中，有些詞語為了避開禁忌，而使用含蓄、婉轉的說法，稱為「委婉詞」。下列各句「 」中的詞語，何者沒有使用委婉詞？
  options:
  - label: A
    content: 熱心的里長時常幫助「街友」，照料他們的三餐
  - label: B
    content: 那家五金行傳出即將「倒店」的消息，令人惋惜
  - label: C
    content: 奶奶交代等她「作古」之後，儲蓄捐給慈善機構
  - label: D
    content: 由於經濟不景氣，他「待業」在家已有半年多了
  tags:
    textbook: 七下 第四課 背影
    labeled_by: ai
    chapter:
      publisher: 康軒
      book: 七下
      subject: 國文
      code: 第四課
      title: 背影
      chapter: null
- id: doc_111_嘉義_北興_國文_g7s2e2_s4_2
  section: 4
  number: 2
  type: single
  page: 1
  stem: 下列各句「 」中的成語經替換後，何者文意不變？
