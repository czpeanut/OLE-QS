- id: doc_111_嘉義_北興_國文_g7s2e2_s5_21
  section: 5
  number: 21
  type: single
  page: 4
  stem: 依據上文，下列何者是作者的母親想到海邊挖蛤仔的最初原因？
  options:
  - label: A
    content: 爺爺說蛤仔的價格好，因此母親在閒暇時便到海邊挖蛤仔
  - label: B
    content: 母親不愛賭也學不會，無聊在家待不住，便到海邊挖蛤仔
  - label: C
    content: 母親看到海邊眾人在挖蛤仔，因此加入群聚的挖蛤仔大隊
  - label: D
    content: 家中經濟負擔大，母親以挖蛤仔為主要職業，賺取生活費
  group_stem: "(一)\n    有一次回金門，在后湖海邊碰見三姊。她帶朋友到海邊，告訴朋友，小時候她是如何辛勞謀生的。她跟朋友、我跟孩子，都捲起褲管、袖管，到海邊挖蛤仔。越近傍晚人越多，裡頭有身手俐落的歐吉桑、歐巴桑，帶斗笠跟粗大的水桶，一看就知專業，挖蛤仔不在娛樂，而在謀生。沙灘上小孩子築城堡，青年男女找樂子，青壯代如我跟三姊，則在海邊找童年，畢竟時間能把一切種種，都發酵做甜的。\n\
    \    六月中旬，堂哥到台北做客，帶來一大桶自個兒挖的蛤仔，告訴我昔果山已有通海的捷徑，不再需要繞經后湖。哪裡的蛤仔多、肥，也一併告知，讓人躍躍欲試，巴不得早一點回鄉挖去。母親提到跟蛤仔的一個秘辛，原來挖蛤仔在三、四十年前，並不是一個流行的賺外快方式，母親說：「以前的人，沒像現在挖得這麼勤。」\n\
    \    母親改變蛤仔跟村人關係的那一天，正跟眾多嬸啊、婆啊的，圍聚在入海處的小平房裡，等著父親跟村人的漁船到岸。婦女們等待時，不外說三道四，交換情報，有時候就地玩起四色牌。我二伯母就是箇中好手，好牌、爛牌，完全不動聲色，常常是贏家，賺進不少賭金。沒錯，玩牌不純粹娛樂，也賭些小錢。\n\
    \    母親不喜歡賭博，也總學不會，她在平房內坐得無聊，便到海邊挖蛤仔。一挖許多桶，回家後，跟捕獲的魚一起載到營區或金城賣。賣魚的攤販不少，賣蛤仔的卻很少，母親的蛤仔讓她小賺了一些錢，連爺爺也稱讚有加。鄉下人，閒聊也不設防，爺爺便將母親賣蛤仔賺錢一事，說了出去，一傳二、二傳十、再傳百，從此，沙灘上不再只有母親獨自挖蛤仔的身影，而成為群聚的挖蛤仔大隊。\n\
    \    這當然苦到了我跟三姊。明明已是農閒，卻還得揹水桶到海邊。\n    蛤仔跟村人連結的那一天，慢慢的，一部分金門人跟蛤仔的關係也有了變化。他們或也跟我一樣，在海灘尋找舊時代甜美滋味。或許他們年紀輕，沒有舊時代可以回憶，但沒有關係，當新的被更新的取代，年輕一代，也終究會擁有他們獨特的時間感。\n\
    \    按此說來，母親一時閒不下來的挖蛤仔，竟演變成許多人跟海、跟蛤仔的共同回憶了。\n    我聽得半信半疑，堂哥正一起用餐，聽完母親的話，並未反駁。想必，萬事必得有個開始，母親正是把挖蛤仔，變成農家、漁家，當副業的第一人？\n\
    \    這成就，跟這之後延續的影響，怎可不記上一筆？                             (節錄自吳鈞堯 蛤仔)"
