  group_stem: "(二)\n    王羲之嘗在蕺山➀見一老姥，持六角竹扇賣之。羲之書其扇，各為五字。姥初有慍色。因謂姥曰：「但言是王右軍➁書，以求百錢邪。」姥如其言，人競買之。他日，姥又持扇來，羲之笑而不答。\n\
