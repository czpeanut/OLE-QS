  stem: "題目：從那次比賽，我看到……\n    一場逆轉勝的經典棒球賽，展現團隊合作與永不放棄的精神；一次慘敗的咖啡拉花比賽，警惕勤於練習與注意細節的重要。從小到大，你或許曾透過電視或親臨現場看過比賽，而國中時期，你可能也經歷過幾場比賽，諸如：大隊接力、拔河比賽、德國圍棋比賽，演講比賽、音樂比賽……。不管是班級還是個人，不管是靜態還是動態，不管是選手還是觀眾，不管是得獎還是落敗，一場比賽，除了勝負結果，相信也給予人難忘的體驗與啟示。\n\
    \    在你的生活中，有哪一次比賽是令你印象深刻呢？從那次比賽中，你體驗到了什麼？又得到了什麼呢？請以「從那次比賽，我看到……」為題，就你的經驗或觀察，表達你的感受或看法。\n\
