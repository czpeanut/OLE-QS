- id: doc_111_嘉義_北興_國文_g7s2e2_s3_1
  section: 3
  number: 1
  type: matching
  page: 1
  stem: ①
  group_stem: '◎閱讀下列短文，在參考選項中找出最適合的詞語，依序填入代號。

    (Ａ)郎中 (Ｂ)仵作 (Ｃ)優伶 (Ｄ)刺客 (Ｅ)西席 (Ｆ)捕快

    (Ｇ)細作 (Ｈ)跑堂 (Ｉ)庖丁 (Ｊ)狀師 (Ｋ)舟子 (Ｌ)腳夫

    晏無明和司小念兩人一見鍾情而結為夫妻，晏無明的職業是緝捕罪犯的( ① )，而司小念表面上是花坊老闆娘，實際上是敵國的( ② )，負責蒐集情報。一日，龍鳳客棧發生命案，年輕有為的(
    ③ )被人發現倒臥在包廂，氣絕多時。晏無明請來( ④ )驗屍，找出致命的關鍵證據──天山紅花毒，進而鎖定三位嫌疑人，一位是委託死者打官司的花農，一位是客棧中負責招待客人的(
    ⑤ )，最後一位則是自己的妻子司小念，只有她的花坊販售天山紅花。晏無明火速奔回家中質問司小念，司小念坦承為敵國工作，但工作內容不是殺人，並指出真正的兇手是在西郊渡船口載客的(
    ⑥ )。'
  tags:
    textbook: 第二冊（七下）第2次段考範圍
    labeled_by: ai
    chapter:
      publisher: null
      book: 七下
      subject: 國文
      code: null
      title: null
      chapter: null
