  stem: 「我們看到別人的孩子或伴侶，難免想比較『你為什麼就不能像那個誰呢？』嗯，對家人一定有期許，但最好別比較，比較多了，彼此都學得嫉妒和怨懟，毫無養分。別人家的表象，那是展示的櫥窗，造出櫥窗裡那些東西要多少代價，外人不知道。家人是要共度真實生活的，何必拿來和櫥窗比較？」（蔡康永
