  - label: C
    content: 以海明威及柴契爾夫人作為正反兩面的對照比較
  - label: D
    content: 作出兩人相異處在於有無生命活力的結論。
  group_stem: "海明威有一篇短篇小說，名為〈蝴蝶與坦克〉，描述在戰爭的嚴肅氣氛中，一位歡樂的男子在酒館中被射殺的故事。蝴蝶象徵男子輕盈的歡樂，坦克象徵戰爭沉重的肅殺，這兩者起了衝突。但海明威的弦外之音是：歡樂與嚴肅、蝴蝶與坦克難道是不相容的、一定要有我無你嗎？\n\
    \  就一個人的生命或自我來說，我們也面對了同樣的問題：歡樂與嚴肅、溫柔與剛猛、理性與感性……你只能二選一，而不能兼容並蓄嗎？\n  我們很難用簡單的語彙來概括海明威，因為他熱愛生命又喜歡玩命，縱情享樂而又辛勤工作，喜歡活動而耽讀小說……。我們也很難用傳統的「男人」或「女人」來定義柴契爾夫人，因為她有極剛強果決的一面，在國會殿堂上，她為她的治國理念和政策激烈辯護，毫不退縮；雖然從政多年，她一直沒有雇用女傭，而是親自主持家務。\n\
    \  海明威和柴契爾夫人的共通點就是：他們是充滿了「生命活力」的男人和女人。所謂「活力」，是生命不會「固著」或「偏執」在一個定點上，而是在兩種不同的特質間流動，這也是讓他們生命顯得多彩與豐饒的祕密。因此，要使生命無悔，就要做個充滿生命活力的人。\n\
    \                                                                            \
    \        （王溢嘉 蝴蝶與坦克）"
