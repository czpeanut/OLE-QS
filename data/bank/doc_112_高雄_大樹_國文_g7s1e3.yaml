    content: 擁有假裝死亡以躲避危險的能力
  - label: B
    content: 具有堅硬如樹枝的保護殼
  - label: C
    content: 可以保持同一種姿勢長達數分鐘
  - label: D
    content: 可以乾脆俐落的斷腿求生。
