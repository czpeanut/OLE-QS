- id: doc_112_高雄_大樹_國文_g7s1e3_s5_6
  section: 5
  number: 6
  type: single
  page: 4
  stem: 下列敘述何者正確？
  options:
  - label: A
    content: 禁止進口外來的肉品，就不會感染狂牛症
  - label: B
    content: 狂牛症已經被證實是人畜共通的傳染性疾病
  - label: C
    content: 狂牛症病例最早是在美國的牛隻身上所發現的
  - label: D
    content: 安全標章、合格標示，是食品安全的第一道防線。
  group_stem: "狂牛症與瘦肉精\n    狂牛症的學名叫做「牛海綿樣腦症」，是牛腦細胞發生空泡狀病變，在腦部組織形成如同海綿空隙一般，故稱海綿樣腦症。牛隻感染初期會出現神經性的異常行為，如行動遲緩、精神沉鬱、煩躁不安、動作無法協調，進一步會對聲音、觸覺和周遭環境相當敏感，常有易驚易怒的強烈反應，同時舉動蹣跚、泌乳量降低和顯著虛弱等症狀，因此有「狂牛病」的俗稱，最早的狂牛病例1986\
    \ 年發生在英國，曾造成十幾萬頭牛隻死亡。\n    目前近似狂牛症的人類「新變型庫賈氏症」患者剛開始會產生憂鬱、焦慮及幻覺的症狀，接著慢慢出現走路不穩、行動困難以及無法自主的肢體動作，最後智力衰退，多數患者一年內死亡，目前仍無藥可醫。「新變型庫賈氏症」首例同樣發生在英國（1996\
    \ 年），目前尚無法確定「新變型庫賈氏症」源自狂牛症，美國曾在200 年出現狂牛症疫情，當時許多國家包括臺灣均曾禁止北美地區的牛、羊產品進口，目前則採有條件開放。\n\
    \    「瘦肉精」是一種動物用藥，將瘦肉精添加於飼料中，可以增加動物的瘦肉量，減少飼料使用，使肉品提早上市，降低成本，但對人體會產生副作用，因此各國開放使用的標準不一。牲畜吃了含瘦肉精的飼料，殘留瘦肉精會積蓄在肝、肺等處，如果不依照規定使用，以致殘餘量過高，民眾大量食用後，將會出現噁心、頭暈、肌肉顫抖、心悸、血壓上升等中毒徵狀。\n\
    \    2012 年政府考慮訂定瘦肉精殘餘標準，招致對可能殘留瘦肉精的美國牛肉進口的輿論批評，引發朝野對開放美牛進口與否爭議不休，前美國 在臺協會理事主席卜睿哲表示：「問題首先是美國不應該向貿易夥伴出售不安全的食品，至於食品是否安全，該由衛生專家決定，這是解決美牛進口爭議的基礎。」"
