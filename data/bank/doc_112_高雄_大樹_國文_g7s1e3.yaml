- id: doc_112_高雄_大樹_國文_g7s1e3_s5_3
  section: 5
  number: 3
  type: single
  page: 4
  stem: 關於安藤俊介對於怒氣的看法,下列說明何者正確?
  options:
  - label: A
    content: 只要善用怒氣,就可以有效控制情緒,增進情緒管理能力
  - label: B
    content: 怒氣是正常的情緒反應,因此要學會與之相處,自然表現
  - label: C
    content: 怒氣的出現,可以刺激大腦中的理性思考,強化計算能力
  - label: D
    content: 怒氣會影響人際關係,所以要隱藏在心中,不可表現出來。
  group_stem: "情緒管理四方法\n    日本「怒氣管理協會」的代表理事安藤俊介在《輸給怒氣的人;活用怒氣的人》一書中，提出「與怒氣相處」的方法。他認為不是完全不能生氣，而是要好好「活用怒氣」來控制情緒,並提供了四種管理情緒的方法:\n\
    一、轉移「注意力』:想著開心的事\n    只要一直想、一直看那個讓你生氣的對象或事情，情緒就不可能變好,反而越想越生氣!搞不好你的負面情緒還會變得更大。因此，擺脫當下處境，才有可能轉移情緒，大幅減少焦慮、憤怒等等的情況。我們可以做些自己喜歡的事來控制自己的情緒，像是有些人會去吃甜點、看搞笑影片、找朋友聊天。有人則會讀自己喜愛的小說，如果你也是這種人的話，不妨隨時在包包裡放入喜歡的書籍。\n\
    二、啟動「理性思考」:計算或翻譯\n    若是在無法立刻轉移注意力的處境時，你可以用有點複雜的「計算」或「翻譯」等理 性思維，讓你「沒空、無法再想著激怒你的對象」。試著「在心裡倒著數數」，例如「100、\
    \ 97、94、91、88......」像這樣，從100 開始每隔3 個數往回數。最好是能在情緒還沒那麼焦慮，或只有一點點生氣時就這麼做，如此就可避免突然失控發飆，事後再來後悔。「憤怒」是我們面對敵人時，大腦所作出的一種出於本能的防禦機制，來自於被稱為「原始腦」的大腦邊緣系統。而當我們「計算」或「翻譯」時，所使用到的部位是理性的「大腦皮質」——它位在大腦邊緣系統的外側，負責語言、計算等「理性」的功能，是讓人類能夠社會化、融入群體生活的腦區。藉此，我們將得以回到能夠冷靜判斷的狀態避免受情緒驅使，而做出過於衝動的行為，轉而採取理性的行動和表現來應對問題。\n\
    三、設立「人際防火區」:避免與輩分低的人接觸\n    「怒氣」這種東西，具有從「強勢」處往「弱勢」處宣洩的特性，就像水總會從上往下流一樣。比方說，當你很煩躁的時候，部屬來找你講話，你會板著個臭臉，愛理不理的；可是換作上司來找你講話，你就算再不耐煩，也會和顏悅色的小心應付。但這並不代表我們就可以對「從上往下」的怒氣視為理所當然。如果一味放任自己的情緒，將會失去周圍的人對你的信任。當你處在負面情緒時，或是快要衝著無辜的人發飆時，趕緊試著把對方的臉想成地位比你高、比你強勢的人。萬一真的沒有做好情緒管理，事後一定要道歉。\n\
    四、讓自己「習慣不方便」:不過度依賴手機\n    生活越是便利，我們就越容易焦慮，導致我們「等待」、「忍耐」的修養變得越來越差。為了重拾「耐心」，不妨試試「一日不帶手機」,好好練習「習慣不方便」這件事。「沒帶手機」這件事,意味著得「多花時間」、「多忍耐」、「思考替代方案」，這種習慣不方便的練習，也是一種控制情緒的練習。目的在於讓你日後碰到意外狀況時也能不緊張、不焦慮的做好情緒管理。\n\
    \    生活中還有許多有意義的事，做好情緒管理，就能避免把生命浪費在生氣、焦慮等等的負面情緒上，才不會「傷心」、「傷身」又傷和氣!"
