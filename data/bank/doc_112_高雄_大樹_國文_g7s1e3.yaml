- id: doc_112_高雄_大樹_國文_g7s1e3_s3_1
  section: 3
  number: 1
  type: single
  page: 1
  stem: 下列「  」中的字，何組意義相同？
  options:
  - label: A
    content: 項「為」之強/「為」之怡然稱快
  - label: B
    content: 為國捐「軀」/身「軀」短小
  - label: C
    content: 綢「繆」甜蜜/未雨綢「繆」
  - label: D
    content: 「豪」雨特報/「豪」邁不羈。
- id: doc_112_高雄_大樹_國文_g7s1e3_s3_2
  section: 3
  number: 2
  type: single
  page: 1
  stem: 下列選項中的注音寫成國字後，何組字形相同？
  options:
  - label: A
    content: 行事ㄌ一ˋ/履ㄌ一ˋ表
  - label: B
    content: 街頭遊ㄉㄤˋ/ㄉㄤˋ然無存
  - label: C
    content: 校ㄎㄢ文字/情何以ㄎㄢ
  - label: D
    content: 待磨ㄆㄨˊ玉/ㄆㄨˊ實無華。
- id: doc_112_高雄_大樹_國文_g7s1e3_s3_3
  section: 3
  number: 3
  type: single
  page: 1
  stem: 下列選項何者反映〈藍色串珠項鍊〉中琴．格雷斯的經濟狀況？
  options:
  - label: A
    content: 小女孩金黃的頭髮，像小麥一樣；藍藍的眼睛，像大海一樣
  - label: B
    content: 有個小女孩站在店門口，小臉貼近櫥窗玻璃，眼睛睜得大大的，很認真地仔細觀察櫥窗裡展示的商品，好像在找非常特別的東西
  - label: C
    content: 小女孩忙著打開手帕的結，倒出一把硬幣，放在櫃臺上。「這是我全部的積蓄。」
  - label: D
    content: 「太完美了。」小女孩對自己說「請您幫我包裝得漂漂亮亮的好嗎？」。
  lesson_raw:
    title: 藍色串珠項鍊
    basis: 題目引用了課文篇名〈藍色串珠項鍊〉
- id: doc_112_高雄_大樹_國文_g7s1e3_s3_4
  section: 3
  number: 4
  type: single
  page: 1
  stem: 大壯從〈兒時記趣〉一文中，領悟到「萬物靜觀皆自得」的道理。下列是大壯的座右銘，何者也帶給人相同的觸發及啟示？
  options:
  - label: A
    content: 即使我不贏，也要給大家一個微笑
  - label: B
    content: 若能澄心淨耳聽，萬籟俱寂亦是韻
  - label: C
    content: 與其錦上添花，不如雪中送炭
  - label: D
    content: 人生成功的祕訣，是化絆腳石為踏腳石。
  lesson_raw:
    title: 兒時記趣
    basis: 題目引用了課文篇名〈兒時記趣〉
- id: doc_112_高雄_大樹_國文_g7s1e3_s3_5
  section: 3
  number: 5
  type: single
  page: 1
  stem: 下列「  」中成語的使用，何者錯誤？
  options:
  - label: A
    content: 大壯和永強兩人是從小就認識的「總角之交」，所以合作無間
  - label: B
    content: 在作者的巧妙安排下，劇情總能「引人入勝」增加閱讀的趣味
  - label: C
    content: 若明瞭這件事情的「來龍去脈」，你會對這位兇手投以憐憫的眼光
  - label: D
    content: 歹徒假藉宗教名義，自稱能「出神入化」創造神蹟。
- id: doc_112_高雄_大樹_國文_g7s1e3_s3_6
  section: 3
  number: 6
  type: single
  page: 1
  stem: 〈音樂家與職籃巨星〉一文透過夾敘夾議的論述闡明什麼道理？
  options:
  - label: A
    content: 想要成功就必須付出努力勤練
  - label: B
    content: 成功或失敗都是盡人事聽天命
  - label: C
    content: 相要專精技藝，要有興趣從旁輔助
  - label: D
    content: 「不經一番徹骨寒，焉得梅花撲鼻香」，想成功就要經得起挫折的磨練。
  lesson_raw:
    title: 音樂家與職籃巨星
    basis: 題目引用了課文篇名〈音樂家與職籃巨星〉
- id: doc_112_高雄_大樹_國文_g7s1e3_s3_7
  section: 3
  number: 7
  type: single
  page: 1
  stem: 關於〈朋友相交〉一文的寫作手法，下列何者正確？
  options:
  - label: A
    content: 以李白的詩作開頭，表達作者對李白的喜愛
  - label: B
    content: 作者採用抒情的筆調、親切的口吻來抒發對朋友的真情
  - label: C
    content: 靈活運用詩文名句，凸顯作者學問淵博
  - label: D
    content: 以對比的手法論述君子、小人二種類型朋友的差異。
  lesson_raw:
    title: 朋友相交
    basis: 題目引用了課文篇名〈朋友相交〉
- id: doc_112_高雄_大樹_國文_g7s1e3_s3_8
  section: 3
  number: 8
  type: single
  page: 1
  stem: 〈朋友相交〉一文中，「君子坦蕩磊落，講究誠信，不逾規矩，其言行舉止，有若日月之蝕，人人得而見之。」從這句話可以推論出下列何意？
  options:
  - label: A
    content: 因為人人得而見之，所以君子不能犯錯
  - label: B
    content: 即使君子光明磊落，但仍會如日蝕月蝕般有缺陷
  - label: C
    content: 君子光明正大，如日月般受萬人景仰
  - label: D
    content: 君子有過失，如日月有虧蝕，但能面對改正不怕人知。
  lesson_raw:
    title: 朋友相交
    basis: 題目引用了課文篇名〈朋友相交〉
- id: doc_112_高雄_大樹_國文_g7s1e3_s3_9
  section: 3
  number: 9
  type: single
  page: 1
  stem: 〈行動的水滴才能匯流大河〉一文中，「六歲的孩子發願，果然改變世界，這當然是奇蹟。」這句話所傳達的想法，與下列何者最接近？
  options:
  - label: A
    content: 如果撐起一把無形的傘，使我們不去面對風雨，面對苦難，那我們永遠無法領略雨過天青的喜悅
  - label: B
    content: 人之一生，希望留名，實屬常情，但應以其道得之。出名容易成名難，因為出名只要敢拿出你最壞的一面就行，成名則要拿出最好的一面
  - label: C
    content: 我向默默耕耘者學習等待，也向堅持不懈者學習勇敢；我從高傲的人身上學會了彎腰，也從奢靡的人身上學到了簡樸
  - label: D
    content: 個人雖然渺小，只要我們把生命的資源充分發揮，就可將脆弱轉為堅強，將有限變成無限，將渺小化做偉大。
  lesson_raw:
    title: 行動的水滴才能匯流大河
    basis: 題目引用了課文篇名〈行動的水滴才能匯流大河〉
- id: doc_112_高雄_大樹_國文_g7s1e3_s3_10
  section: 3
  number: 10
  type: single
  page: 2
  stem: 下列何者不是「友直、友諒、友多聞」的朋友類型？
  options:
  - label: A
    content: 小華除了課本的知識外，對於動漫、電腦等知識也非常豐富，和他相處可以拓展生活領域
  - label: B
    content: 小明的心胸寬大，對於別人的錯，總抱持原諒並給予機會的態度，和他相處可以學得包容的態度
  - label: C
    content: 小強為人正派，對於朋友總能給予適當的規勸，和他相處可以導正我們的行為
  - label: D
    content: 小花為人重視誠信，答應朋友的事一定做到，可以放心信任他。
- id: doc_112_高雄_大樹_國文_g7s1e3_s3_11
  section: 3
  number: 11
  type: single
  page: 2
  stem: 關於〈朋友相交〉一文中，下列何者是作者在朋友相交時所抱持的觀點或主張？
  options:
  - label: A
    content: 學生時代結交的朋友，會隨著時間歷久彌新，更見真誠
  - label: B
    content: 「君子之交淡如水」，對待朋友心中無所求，如水沒有雜質，所以更能長長久久
  - label: C
    content: 和朋友往來，即使話不投機，仍應試著了解對方，以免錯失一位好朋友
  - label: D
    content: 朋友相交也是一種緣分，有緣相聚，緣盡分離，無須強求。
  lesson_raw:
    title: 朋友相交
    basis: 題目引用了課文篇名〈朋友相交〉
- id: doc_112_高雄_大樹_國文_g7s1e3_s3_12
  section: 3
  number: 12
  type: single
  page: 2
  stem: 細讀〈兒時記趣〉一文，下列何者並非作者能在平凡生活中獲得許多樂趣的原因？
  options:
  - label: A
    content: 能張目對日，明察秋毫。見藐小微物，必細察其紋理
  - label: B
    content: 夏蚊成雷，私擬作群鶴舞空，心之所向，則或千或百，果然鶴也
  - label: C
    content: 以土礫凸者為丘，凹者為壑，神遊其中，怡然自得
  - label: D
    content: 神定，抓蛤蟆，鞭數十，驅之別院。
  lesson_raw:
    title: 兒時記趣
    basis: 題目引用了課文篇名〈兒時記趣〉
- id: doc_112_高雄_大樹_國文_g7s1e3_s3_13
  section: 3
  number: 13
  type: single
  page: 2
  stem: 下列敘述，何者為魯賓斯坦與麥可·喬丹兩人的共同點？
  options:
  - label: A
    content: 兩人同樣在音樂的領域大放光彩，取得傲人成績
  - label: B
    content: 兩人同樣因為資質不高，原先都不被看重
  - label: C
    content: 在生命的過程中都遇到貴人的幫助
  - label: D
    content: 同樣都經過苦練，取得成就。
  lesson_raw:
    title: 音樂家與職籃巨星
    basis: 題目出自〈音樂家與職籃巨星〉主角人物
- id: doc_112_高雄_大樹_國文_g7s1e3_s3_14
  section: 3
  number: 14
  type: single
  page: 2
  stem: 〈音樂家與職籃巨星〉一文中，「如果喬丹要等到自己長得『夠高』，才加緊練習球技，那可能為時已晚。」這段話的涵義，與下列何者最接近？
  options:
  - label: A
    content: 等待機會的同時，也要不斷地壯大自己
  - label: B
    content: 臨陣磨鎗，不亮也光
  - label: C
    content: 磨鍊自己才能使敵人害怕
  - label: D
    content: 老天爺給你機會的時候，你千萬不要猶豫。
  lesson_raw:
    title: 音樂家與職籃巨星
    basis: 題目引用了課文篇名〈音樂家與職籃巨星〉
- id: doc_112_高雄_大樹_國文_g7s1e3_s3_15
  section: 3
  number: 15
  type: single
  page: 2
  stem: 〈兒時記趣〉一文中，「一日，見二蟲鬥草間，觀之，興正濃，忽有龐然大物，拔山倒樹而來，蓋一癩蝦蟆也。舌一吐而二蟲盡為所吞」，根據這段文字，下列敘述何者正確？
  options:
  - label: A
    content: 作者用拔山倒樹來誇飾癩蝦蟆的巨大
  - label: B
    content: 作者的出現，打斷了二蟲間的爭鬥
  - label: C
    content: 作者刻意放了一隻癩蛤蟆製造打鬥的趣味
  - label: D
    content: 作者埋伏了好久，終於看到二蟲相鬥，卻被癩蝦蟆給破壞了。
  lesson_raw:
    title: 兒時記趣
    basis: 題目引用了課文篇名〈兒時記趣〉及課文內容
- id: doc_112_高雄_大樹_國文_g7s1e3_s3_16
  section: 3
  number: 16
  type: single
  page: 2
  stem: 法國文學家福婁拜說：「天才只是長時間的忍耐、工作吧﹗」義大利的米開朗基羅說：「天才能忍受無窮痛苦。」根據這兩位名家對天才所下的定義，可知天才需要什麼？
  options:
  - label: A
    content: 包容
  - label: B
    content: 勤勞
  - label: C
    content: 堅毅
  - label: D
    content: 靈感。
- id: doc_112_高雄_大樹_國文_g7s1e3_s3_17
  section: 3
  number: 17
  type: single
  page: 2
  stem: 〈行動的水滴才能匯流大河〉一文中，「愛，如果沒有行動，如同藏在地底的水。」此句話的涵義為何？
  options:
  - label: A
    content: 付諸行動的愛才具有影響力
  - label: B
    content: 藏在心中的愛也能感動人心
  - label: C
    content: 默默付出的愛才能行之久遠
  - label: D
    content: 深厚的愛不需過多的言行表達。
  lesson_raw:
