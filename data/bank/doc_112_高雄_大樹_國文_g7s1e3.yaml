- id: doc_112_高雄_大樹_國文_g7s1e3_s5_1
  section: 5
  number: 1
  type: single
  page: 3
  stem: 看見陳堯咨射箭十中八九，賣油翁「但微頷之」。此舉透露出其對陳堯咨的箭術有何看法？
  options:
  - label: A
    content: 大為激賞，驚奇不已
  - label: B
    content: 頻頻點頭，深表佩服
  - label: C
    content: 技巧尚可，不足稱奇
  - label: D
    content: 雕蟲小技，不屑一顧。
  group_stem: '陳康肅公善射，當世無雙，公亦以此自矜。

    嘗射於家圃，有賣油翁釋擔而立，睨之，久而不去，見其發矢十中八九，但微頷之。

    康肅問曰：「汝亦知射乎？吾射不亦精乎？」翁曰：「無他，但手熟爾。」康肅忿然曰：「爾安敢輕吾射！」翁曰：「以我酌油知之。」乃取一葫蘆置於地，以錢覆其口，徐以杓酌油瀝之，自錢孔入，而錢不溼。因曰：「我亦無他，惟手熟爾。」康肅笑而遣之。

    自矜：自誇、自負。  矜，自大。  睨：斜著眼睛看。  頷：下巴，此作動詞用，點頭'
  lesson_raw:
    title: 賣油翁
    basis: 短文為歐陽脩〈賣油翁〉
