  section: 1
  number: 9
  type: single
  page: 1
  stem: 中國某一跨海大橋於2018 年完工，其連結中國兩個特別行政區及一個經濟特區，可縮短往來三地的距離，及強化三地經濟社會的交流。上述跨海大橋應位於下列哪條河川的出海口？
  options:
  - label: A
    content: 珠江
  - label: B
    content: 長江
  - label: C
    content: 海河
  - label: D
    content: 黃河。
