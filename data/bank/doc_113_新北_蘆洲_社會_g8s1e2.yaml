- id: doc_113_新北_蘆洲_社會_g8s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 青藏鐵路的車廂設計必須採用類似空中民航機的「全封閉式」艙體與設備，主要是因為當地具有下列哪一項環境特徵而採取的設計？
  options:
  - label: A
    content: 氣候乾燥，沙漠廣布
  - label: B
    content: 地勢高聳，空氣稀薄
  - label: C
    content: 風力強勁，平坦遼闊
  - label: D
    content: 流水侵蝕，千溝萬壑。
  group_stem: "青藏高原壯麗的大自然和神祕的人文景觀吸引著國內外遊客，昔日遊客進出西藏主要靠空運，但運輸量有限且費用高。西元2006 年青藏鐵路的建設完成後，將西北的絲綢之路與西藏的布達拉宮連接起來，成為新的黃金旅遊熱線。然而，可能很多人並不知道，早在青藏鐵路開通8\
    \ 年前，一條橫跨「世界屋脊」的光纜幹線已經通往了西藏。所以有人說，青藏、川藏公路第一次同時穿越青藏高原時，打破了西藏的「封閉」；光纖纜線的興建，為西藏各族人民裝上了「千里眼」、「順風耳」；青藏鐵路則成為西藏現代化發展的「助推器」。\n\
    \  請問："
