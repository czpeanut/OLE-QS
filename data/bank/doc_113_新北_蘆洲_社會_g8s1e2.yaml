- id: doc_113_新北_蘆洲_社會_g8s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '中國自西元1986 年起，由於人口壓力與工業發展對水資源的需求增加，因此開發跨國河川的水資源，時常造成鄰近國家的摩擦，其中又以湄公河的上游瀾滄江修築水壩議題最受矚目。請問:
    湄公河鄰近國家不包含下列何者？'
  options:
  - label: A
    content: 緬甸
  - label: B
    content: 寮國
  - label: C
    content: 泰國
  - label: D
    content: 馬來西亞。
- id: doc_113_新北_蘆洲_社會_g8s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 近年來，華為、Oppo、Vivo、小米及Realme 等中國企業所生產的手機積極擴張海外市場，如西元2022 年全球的智慧手機中，小米的市占率達13%，位居第三名。下列哪一個經濟現象，與中國手機在海外銷售量節節攀升有關？
  options:
  - label: A
    content: 農牧產品出口
  - label: B
    content: 產業轉型升級
  - label: C
    content: 網際網路普及
  - label: D
    content: 交通物流改革。
- id: doc_113_新北_蘆洲_社會_g8s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 上海都市發展快速，為中國最重要的金融中心，下列關於上海位置的描述，何者正確？
  options:
  - label: A
    content: 中國海岸線中點
  - label: B
    content: 珠江口東側
  - label: C
    content: 黃河出海口
  - label: D
    content: 舊市區位於黃浦江以東。
- id: doc_113_新北_蘆洲_社會_g8s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 冬末春初之際，因強風颳起裸露地表的塵土，中國北方時常發生沙塵暴，大量沙塵隨風飄揚，造成當地居民生活上困擾。請問:沙塵暴的形成主要與何種氣候區內過度開墾，關係最為密切？
  options:
  - label: A
    content: 溫帶季風氣候
  - label: B
    content: 副熱帶季風氣候
  - label: C
    content: 高地氣候
  - label: D
    content: 乾燥氣候區。
- id: doc_113_新北_蘆洲_社會_g8s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 中國於1978 年推動的改革開放政策，帶動經濟快速成長，但是卻加深區域發展失衡現象。下列關於中國的新聞報導，何者最能反映中國區域發展不均的現象？
  options:
  - label: A
    content: 今年出現的多起沙塵暴，已直接威脅北京、上海及南京等大都市
  - label: B
    content: 推動海上絲路計畫，發展從中國沿海港口經印度洋至歐洲的航線
  - label: C
    content: 農曆春節將湧現數億人次返鄉人潮，堪稱地表最大規模的人口移動
  - label: D
    content: 南方近年降雨減少，旱象環生，南水北調將威脅南方用水的供應量。
- id: doc_113_新北_蘆洲_社會_g8s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 西元2014 年北京亞太經濟合作組織APEC 峰會、西元2010 年上海世界博覽會，以及西元2010 年廣州亞運，以上三個國際盛事其舉辦地點的共同特色為何？
  options:
  - label: A
    content: 位置：皆位於華北平原
  - label: B
    content: 經濟帶：皆屬東部經濟帶
  - label: C
    content: 行政區：皆為直轄市
  - label: D
    content: 氣候：一月月均溫皆＞0℃。
- id: doc_113_新北_蘆洲_社會_g8s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 儘管近年電商平臺受到中國政府的強力監管，「雙11 購物節」仍然吸引龐大買氣，但也有愈來愈多媒體報導，類似的電商購物節已有逐漸退燒的趨勢。分析指出，這種自相殘殺的行銷活動，削價競爭導致利潤變低，爆衝的單量又拖累IT
    系統及倉儲物流作業，各電商在擔憂銷售量不如預期的狀況下，只能硬著頭皮參戰，狂歡購物節能否勝出的關鍵，已逐漸由「折扣」轉為誰的「倉儲／物流」準備最周全。請問：中國整體購物型態的轉變，與下列何者較無關係？
  options:
  - label: A
    content: 網際網路
  - label: B
    content: 店面服務
  - label: C
    content: 物流配送
  - label: D
    content: 無現金支付。
- id: doc_113_新北_蘆洲_社會_g8s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: '中國被認為是「世界最後一個世界工廠」，勞工從改革開放以來都是中國最大的優勢，然而這種優勢正在質變，加上少子化的衝擊，中國缺工的問題逐漸浮現。請問：下列哪些是中國缺工可能對產業造成的影響與因應措施？

    (甲)製鞋、成衣等產業陷入生產困境

    (乙)企業轉向越南、印尼等地

    (丙)人口逐漸向沿海集中

    (丁)產業結構需面臨轉型、升級'
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙丙丁
  - label: C
    content: 甲乙丁
  - label: D
    content: 甲丙丁。
