  section: 1
  number: 10
  type: single
  page: 1
  stem: 學者提到：「中國經濟正處於改革的轉捩點，面臨從『製造業大國』變為『服務業大國』，從『世界工廠』變為『世界市場』的轉型。」請問：下列哪一項事實可以說明中國逐漸成為全球最大的消費市場？
  options:
  - label: A
    content: 全球一半以上的電腦等數位產品都在中國組裝
  - label: B
    content: 出口貿易額名列世界前茅
  - label: C
    content: 由國外輸入許多工業原料到中國
  - label: D
    content: 消費能力龐大，吸引國外知名品牌進駐。
