  section: 1
  number: 11
  type: single
  page: 2
  stem: 中國自一九八〇年代改革開放以來經濟快速成長，有「世界工廠｣之稱，其當時主要的產業發展方向，應位於微笑曲線的哪一部分？
  options:
  - label: A
    content: 甲丙
  - label: B
    content: 甲
  - label: C
    content: 乙
  - label: D
    content: 丙。
  group_stem: 西元1992 年，宏碁電腦(Acer)創辦人施振榮先生為了「再造宏碁」，提出有名的「微笑曲線」理論。微笑曲線將企業在產業的發展分成三部分，左段為專利、技術，中段為組裝、製造，右段為品牌、服務；而曲線本身代表的是附加價值，中段位置的附加價值較低，左、右兩段的附加價值較高，如此整個曲線看起來像是一個微笑符號，如附圖所示。請問：
  shared_asset: g1_11_12
