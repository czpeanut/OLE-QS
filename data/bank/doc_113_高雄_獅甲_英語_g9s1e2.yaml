- id: doc_113_高雄_獅甲_英語_g9s1e2_s5_39
  section: 5
  number: 39
  type: single
  page: 3
  stem: 39. What is the writer trying to say?
  options:
  - label: A
    content: We should try to make the best use of our lives.
  - label: B
    content: It takes more than hard work to make a great artist.
  - label: C
    content: History always repeats itself.
  - label: D
    content: Art is the best medicine for a weak mind.
  group_stem: '(39 ~ 41)

    In the art world, many artists with “weak” bodies have shown us a “strong” power
    in their great works of art. Take Frida Kahlo for example. She was a healthy girl
    until she was knocked down by a bus at the age of twelve. Much of her body was
    seriously hurt, but her mind wasn’t. In her paintings, we can feel her strong
    love of art and life. Another example is Christy Brown. He was born in bad health,
    and the only part of his body that could move was his left foot. However, using
    his only foot, he still was able to write and draw wonderfully. In his autobiography,
    Brown wrote what happened in his life and how he began to draw pictures with his
    left foot. And don’t forget Stevie Wonder. He became blind soon after he was born,
    but he is now a popular singer and songwriter.

    These artists with “weak” bodies bring us many good things and much hope with
