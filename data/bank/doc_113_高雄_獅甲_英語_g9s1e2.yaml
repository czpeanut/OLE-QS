  group_stem: '(31 ~ 35)

    Summer vacation is 31. students all over the world look forward to. Some are so
    excited that they can’t wait to have fun. Others are too tired from all the schoolwork
    they have done to do anything, so they use the time to rest. Still others choose
    to spend the whole vacation studying.

    As for me, I joined a study program in Australia last summer vacation. At first,
    I was worried because I didn’t know what I would have to do, and 32. . But I soon
    found out that I had nothing to worry about.

    My mornings at the program were spent in English classes, and the afternoons were
    filled with visiting interesting places. The best part of the program was getting
    to stay with a local family. The single mother I stayed with worked hard to give
    her two kids what they needed. In return, 33. , such as cleaning the house, doing
    the washing, and preparing meals. I was surprised at that, and I wanted to know
    34. all Australian children were taught to do that at an early age. 35. I told
    myself that I should do more at home, so my parents don’t have to do so much housework
    after work, and we can spend more time together.

     look forward to 期待 schoolwork 課業 program 課程 Australia 澳洲 local 當地的 single 單親的
    in return 作為回報'
