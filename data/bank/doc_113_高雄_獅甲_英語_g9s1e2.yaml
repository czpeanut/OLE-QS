- id: doc_113_高雄_獅甲_英語_g9s1e2_s5_36
  section: 5
  number: 36
  type: single
  page: 3
  stem: 36. Why did Serena join the People of Iron Race?
  options:
  - label: A
    content: To make her parent proud.
  - label: B
    content: To be liked by her classmates.
  - label: C
    content: To show that women are strong.
  - label: D
    content: To get money for college.
  group_stem: '(36 ~ 38)

    It was once thought that women weren’t strong enough to compete in sports. Fortunately,
    things changed and women were finally allowed.

    Ever since she was little, Serena has dreamed of being in and winning the People
    of Iron Race. Her father told her about his competing in races like that when
    he was in college. He always tried hard, but he was never lucky enough to win.
    He said it was difficult because the first 1.5 kilometers were run, then 40 kilometers
    were swum, and the last 10 kilometers were biked. Serena could tell her father
    loved the sport because he always got excited when he talked about it. Because
    of that, her mind was made up, and she would compete in the sport to make her
    father proud.

    Last Saturday was Serena’s first People of Iron Race, and her father was there
    to cheer her on. The race got started, and everything was going well for her.
    Then something happened. She was bumped into during a crowded part of the run
    and fell. She landed on her knee and hurt it badly. She was told not to move.
    However, she didn’t want to give up when she was close to the end, so she got
    up and fought through the pain. Though she didn’t win, no one was prouder of her
    finishing than her father.

     compete 競賽 fortunately 幸運地 college 大學 kilometer 公里 bump into 撞 crowded 擁擠的 land
    著地 pain 疼痛'
