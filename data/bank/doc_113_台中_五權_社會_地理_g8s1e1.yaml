  stem: 喜馬拉雅山脈的珠穆朗瑪峰為世界第一高峰，是許多登山者的終極挑戰，也是中國和南亞國家的天險。請問：珠穆朗瑪峰的成因為哪兩個板塊所擠壓而形成？
