- id: doc_113_新北_中平_社會_公民_g7s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 庇護服務確實能有效協助受暴婦女脫離暴力環境，因為它提供了自立生活的重要支持與資源。請問：上文所提到的庇護服務是哪一種社會福利的項目？
  options:
  - label: A
    content: 社會保險
  - label: B
    content: 福利服務
  - label: C
    content: 社會救助
  - label: D
    content: 國民就業
  group_stem: '※題組一 (請回答第1 題到第4 題)

    庇護所是家庭暴力防治資源網絡中不可或缺的一環，除了保護家暴被害人的人身安全與提供基本生活所需，更能提供許多支持，以強化被害人保護自我與脫離暴力關係的能力。而勵馨基金會2015
    年承接了七個縣市政府委辦的婦女庇護所，服務情形如下表：


    | 區域別 | 婦女 人數 | 婦女 人日 | 隨行家人 人數 | 隨行家人 人日 | 總計 人數 | 總計 人日 | 占床率 (%) | 平均居住天數 |
    每人每日居住成本 (新臺幣元) |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 總計 | 106 | 329 | 8,786 | 262 | 7,423 | 591 | 16,209 | 41.89 | 27 | 2,441 |

