  stem: 某生態系的鹿群數量在經歷快速增長後趨於穩定，此時引入狼群作為天敵，一段時間後生態系重新達到平衡。請問引入狼群後，鹿群的負荷量會發生什麼變化？
  options:
  - label: A
    content: 負荷量不變，因為環境的承載能力是固定的
