    | :---: | :---: | :---: | :---: | :---: | :---: |

    | A | 有 | 有 | 無 | 有 | 充足 |

    | B | 無 | 有 | 有 | 有 | 充足 |

    | C | 有 | 有 | 有 | 無 | 充足 |

    | D | 有 | 無 | 有 | 有 | 充足 |'
