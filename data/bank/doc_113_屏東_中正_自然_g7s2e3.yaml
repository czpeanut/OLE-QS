  stem: 根據文章內容，下列哪一條食物鏈最能正確表示海星消失前的潮間帶生態關係？
  options:
  - label: A
    content: 浮游藻類→貽貝→海星
  - label: B
    content: 大型藻類→海膽→海星→海獺
  - label: C
    content: 浮游藻類→貽貝→海星→海獺
  - label: D
    content: 浮游藻類→貽貝→海膽→螃蟹→海獺。
  group_stem: '在北美太平洋沿岸的潮間帶，原本存在一個穩定的生態系統。貽貝以浮游藻類為食，海膽以大型藻類為食，而海星是一種重要的掠食者。牠們主要捕食貽貝，藉此維持獵物數量的平衡。

    自2013 年起，一種名為「海星衰弱症候群」的疾病，導致海星的數量急劇下降，幾乎從該生態系中消失。海星消失後，原本被牠們捕食的貽貝，因失去主要天敵而數量大增。而2014-2016
    年間的海洋溫度升高，造成了海膽數量增加，並大量啃食大型藻類。

    面對這種變化，另一種重要動物—海獺，開始調整牠們的覓食行為。原本蒙特雷半島地區的海獺主要以海膽和螃蟹為食，在海星消失後，開始大量捕食數量激增的兩種無脊椎動物。研究顯示，此地區的海獺透過增加對這兩種無脊椎動物的掠食，促進了本身族群數量的成長。不過，其他地區的海獺則仍維持原本的飲食習慣(改寫自：https://www.science.org/doi/10.1126/sciadv.adu1028)。根據上文試回答第30～31
    題：'
