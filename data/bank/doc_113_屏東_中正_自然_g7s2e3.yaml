  group_stem: '試根據下面的故事，回答第32～50題：

    暑輔下午，阿中、小正和阿國在學校生態池畔調查時，被一道奇異的光芒吸入名為「艾科利亞 (Ecoria)」的異世界。一本「生態祕典」飄浮在他們面前，指引他們必須運用所學的生態知識，解開各區域的謎團，才能找到回家的路。

    三人身處一片濃霧瀰漫的森林(Mistwood Forest)，參天巨木的枝幹上附生著各式各樣的植物，林間不時傳來生物叫聲。祕典提示：「理解此地生命間的奧秘，方能穿越迷霧前行。」'
