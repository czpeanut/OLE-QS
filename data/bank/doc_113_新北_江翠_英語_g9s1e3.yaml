- id: doc_113_新北_江翠_英語_g9s1e3_s5_43
  section: 5
  number: 43
  type: single
  page: 5
  stem: 43. What does “Net Zero Emissions” mean?
  options:
  - label: A
    content: Using no energy at all.
  - label: B
    content: Stopping all pollution forever.
  - label: C
    content: Balancing greenhouse gases.
  - label: D
    content: Using public transportation instead of biking or walking.
  group_stem: '2050 Net Zero Emissions

    What is 2050 Net Zero Emissions?

    “2050 Net Zero Emissions” means that by the year 2050, we will balance the greenhouse
    gases we put into the air and take out the same total. Greenhouse gases, like
    carbon dioxide (CO2), make the Earth hotter and cause climate change. These gases
    come from burning coal, oil, and gas for energy. They also come from cars, factories,
    and farms. If we want to protect the planet and have a healthy future, we need
    to reach net zero emissions by 2050.

    How to Do It in Taiwan?

    Taiwan is working to reach net zero emissions. One way is by using green energy,
    like solar power and wind power, instead of burning coal or gas. Solar panels
    can be put on rooftops, and wind power can make clean electricity. Another way
    is to use electric cars and scooters. These do not need gas, so they don’t make
    CO2 when people drive them. Public transportation, like buses and trains, is also
    a good choice because it uses less energy for each person.

    Factories in Taiwan can help by using new skills to make products in a cleaner
    way. They can also recycle something to use less energy. Planting trees is very
    important because trees take CO2 out of the air. Taiwan can also grow more green
    spaces, like parks, to make the air cleaner.

    If everyone helps by saving energy, using green power, and making smart choices,

    Taiwan can reach net zero emissions by 2050. This will make life better for people,

    animals, and the planet.

     net 淨值的 balance 平衡 gas 氣體 climate 氣候 coal 煤 energy 能源

    solar panel 太陽能板 electricity 電 electric 電動的 recycle 回收利用'
