    細菌只繁殖A 型細菌，B 細菌只繁殖B 型細菌，現在假設環境突然改變了，出現一種抗生素，A型細菌有抵抗能力，但是B 型細菌沒有。在新環境中，A 型細菌的適應力比B
    型細菌強，它們能存活下來，繁殖比B 型細菌更多的個體。結果就是A 型細菌的子代比B 型細菌多。天擇在無數事件脈絡中重複作用的結果，就呈現於我們今天所見到的以精巧方式適應環境的各種生物了。          【改編自《科學人雜誌》2009
    年2 月號】'
