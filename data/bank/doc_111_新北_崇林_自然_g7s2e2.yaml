- id: doc_111_新北_崇林_自然_g7s2e2_s1_45
  section: 1
  number: 45
  type: single
  page: 4
  stem: 請問天擇說是由誰提出的理論？
  options:
  - label: A
    content: 達爾文和華萊士
  - label: B
    content: 孟德爾
  - label: C
    content: 牛頓
  - label: D
    content: 林奈。
  group_stem: '【題組】請閱讀文章，回答下列問題：

    達爾文和華萊士在1858 年寫下天擇說，達爾文的《物種起源》在1859 年問世。在特定的情況下，有些個體適應得比其他個體要好，這些個體能產下較多的子代，隨著時間過去而變得比較常見。環境「選擇」這些在現有條件下適應得最好的個體。如果環境條件改變，那些擁有最適合新環境特徵的個體，就會取得優勢。

    了解天擇推動演化最好的方式，可以觀察生命週期特別短的生物。有些細菌每半小時就可以繁殖一次，想像由兩種基因型組成的細菌菌落，一開始A、B 兩種基因型的細菌數目相同。再假設，這兩種細菌都各自繁衍後代，即A
    細菌只繁殖A 型細菌，B 細菌只繁殖B 型細菌，現在假設環境突然改變了，出現一種抗生素，A型細菌有抵抗能力，但是B 型細菌沒有。在新環境中，A 型細菌的適應力比B
    型細菌強，它們能存活下來，繁殖比B 型細菌更多的個體。結果就是A 型細菌的子代比B 型細菌多。天擇在無數事件脈絡中重複作用的結果，就呈現於我們今天所見到的以精巧方式適應環境的各種生物了。          【改編自《科學人雜誌》2009
    年2 月號】'
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 生物
