- id: doc_111_新北_崇林_自然_g7s2e2_s1_48
  section: 1
  number: 48
  type: single
  page: 4
  stem: 大象不常發生癌症的原因為何？
  options:
  - label: A
    content: 具有20個p53複本
  - label: B
    content: 細胞太多
  - label: C
    content: p53基因沒有功能
  - label: D
    content: 可以哺育子代。
  group_stem: '【題組】請閱讀文章，回答下列問題：

    基因突變在細胞內隨著時間累積越來越多，就會引發癌症，然而有些細胞多又長壽的動物（例如大象或鯨）卻罕有癌症，科學家稱這現象為佩托悖論（Peto''s paradox）。對大象來說，原因之一是p53基因。它在人類和許多動物體內負責於細胞複製時修復受損的DNA。不過大象有驚人的20個p53複本，每個複本又有兩個對偶基因，能製造出40種蛋白質。而人類和大部份動物都只有一對這個基因，產生2種蛋白質。

    發表在《分子生物學與演化》的研究，深入探討大象眾多的p53如何提供抗癌優勢。法國科學家費瑞里斯說：「這研究開啟了許多新的可能性，來探討大象和人類細胞在基因組損壞時如何修復。」哺乳動物的p53對防止突變細胞轉為腫瘤至關重要，它會停止細胞複製，再啟動修復機制，損壞太嚴重時促使細胞自我摧毀。如果沒有p53的作用，癌症很容易發生：逾一半的人類癌症中，p53因隨機突變失去功能。

    科學家利用電腦模型檢測了大象的40種p53蛋白質，發現它們透過兩種方式避免大象罹患癌症。首先，擁有眾多複本就減低了突變造成p53失去功能的機會；此外，細胞受損時會引發各種分子反應，而大象的各個p53複本也隨之採取不同反應，使大象在偵測並排除突變上格外有效率。【改編自《科學人新聞》2022年11月1日】'
