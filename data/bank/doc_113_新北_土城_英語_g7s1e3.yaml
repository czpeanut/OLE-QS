- id: doc_113_新北_土城_英語_g7s1e3_s4_51
  section: 4
  number: 51
  type: single
  page: 3
  stem: 51. Where is Mrs. White at 8 a.m.?
  options:
  - label: A
    content: She is in the kitchen.
  - label: B
    content: She is in the living room.
  - label: C
    content: She is in the park.
  - label: D
    content: She is at the dining table.
  group_stem: 'Today is the first day of May. It’s not a holiday, but it’s Mr. and
    Mrs. White’s favorite day of the year.

    It’s 8 a.m. Mr. White is cooking eggs for Mrs. White and fish for Mika in the
    kitchen. Mrs. White is sitting on the sofa. She is having orange juice and listening
    to music in the living room. Mika is sleeping next to Mrs. White.

    It’s 3 p.m. Mr. and Mrs. White are taking a walk with Mika in the park. Three
    boys are playing basketball. Two birds are singing in the tree. Mika is singing,
    too, but her voice is always “meow, meow.”

    It’s 8 p.m. Mr. and Mrs. White are sitting at the dining table after their turkey
    dinner. Mika is eating fish under the table. “Thank you, my dear wife.” “Thank
    you, my dear husband.” “Let’s have our birthday cake.” “I can’t wait!”


    juice 果汁

    voice 聲音

    always 總是

    cake 蛋糕'
