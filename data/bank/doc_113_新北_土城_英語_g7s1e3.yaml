- id: doc_113_新北_土城_英語_g7s1e3_s4_53
  section: 4
  number: 53
  type: single
  page: 3
  stem: 53.What is the main idea of the reading?
  options:
  - label: A
    content: Christmas dinners are celebrated in different ways around the world.
  - label: B
    content: Christmas dinner is a time for family and friends to meet and enjoy food.
  - label: C
    content: Taiwan does not celebrate Christmas at all.
  - label: D
    content: Turkey is the most important part of Christmas dinner.
  group_stem: 'Every year on December 25th, families celebrate Christmas with a special
    dinner. Traditional Christmas dinners often include turkey, potatoes, and vegetables.
    In the USA, pumpkin pie is also a popular dessert.

    In Taiwan, Christmas is not a traditional but popular holiday. Restaurants offer
