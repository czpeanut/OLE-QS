    content: 追求愛情無瑕的美麗，每個瞬間都不帶一絲塵埃
  - label: B
    content: 要紀錄下相處的點點滴滴，留待多年後可以回憶
  - label: C
    content: 無論愛持續多久，都應以溫柔與感激的心去面對
  - label: D
    content: 有情人由相知到相惜，最後終成眷屬，陪伴一生
