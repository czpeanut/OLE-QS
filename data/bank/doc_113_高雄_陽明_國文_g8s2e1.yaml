- id: doc_113_高雄_陽明_國文_g8s2e1_s2_9
  section: 2
  number: 9
  type: single
  page: 2
  stem: 在〈一棵開花的樹〉一詩中，深情的「我」最終與其心儀之人擦肩而過，雖然並不是圓滿喜悅的結局，卻能夠引發廣大讀者的共鳴。以下對於結局解讀，何者較為正確呢？
  options:
  - label: A
    content: 詩中「我」執著的落空充滿戲劇性與衝擊力，更讓讀者為其深情與堅持動容
  - label: B
    content: 暗示「我」過於羞怯，使其無法明確將情感傳達給心儀之人，導致戀情失敗
  - label: C
    content: 鼓勵人們不要輕易放棄，天涯何處無芳草，別為一次的失敗而不再追求真愛
  - label: D
    content: 為「我」的來生再埋下伏筆，深情終究會感動對方，更顯示感情的堅貞不渝
  lesson_raw:
    title: 一棵開花的樹
    basis: 題幹提及〈一棵開花的樹〉
  tags:
    chapter:
      publisher: 南一
      book: 八下
      subject: 國文
      code: 第三課
      title: 朋友相交
      chapter: null
    textbook: 八下 第三課 朋友相交
    labeled_by: ai
- id: doc_113_高雄_陽明_國文_g8s2e1_s2_10
  section: 2
  number: 10
  type: single
  page: 2
  stem: 以下是陽明國中二年級同學整理有關「樂府詩」的資訊，請問哪位同學的資訊正確無誤？
  options:
  - label: A
    content: 珉奎：「樂府詩」可簡稱為「樂府」，原本指唐代掌管音樂的官署名稱
  - label: B
    content: 在玹：在形式上，除了字數有五言的規定，其餘句數、押韻均無限制
  - label: C
    content: 珍妮：語言風格上，多鋪陳誇飾，辭藻華麗，大多能夠反映貴族生活
  - label: D
    content: 員瑛：「樂府詩」又稱「歌行體」，多為民間歌謠，也有文人模擬作品
  tags:
    chapter:
      publisher: 南一
      book: 八下
      subject: 國文
      code: 第五課
      title: 木蘭詩
      chapter: null
