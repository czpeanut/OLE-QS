  stem: 根據上文有關烏魚子的故事，以下理解何者正確？
  options:
  - label: A
    content: 每年冬天，烏魚準時洄游至長江口，這是牠們被稱為「信魚」的原因
  - label: B
    content: 烏魚喜愛攝氏24-26 度的溫暖海域，這是牠們選擇產卵地點的重要因素
  - label: C
    content: 南台灣海域準備產卵的雌烏魚處於成熟狀態，使得野生烏魚子品質極佳
  - label: D
    content: 沿著來時路洄游回去，即所謂的「回頭烏」，體態瘦小，經濟價值最高
  group_stem: '大自然果真是無奇不有，有一種魚每年冬天都會準時造訪台灣，為漁民帶來豐厚的收入，所以我們習慣將烏魚叫做「信魚」，因為烏魚每年依約來到台灣海峽報到。生活在西北太平洋的烏魚群，一到冬天的產卵期，開始成群結隊南下，找尋適合產卵的海域，烏魚喜愛的產卵水溫約在攝氏20
    到22 度之間。

    原本洄游在中國 長江口的烏魚群，在冬至前後三十天內，沿著台灣西部海域的新竹、苗栗、台中、雲林、嘉義、台南及高屏一路南下，陸續在高雄到屏東之間的外海產卵，一般過了林邊溪口便會開始產卵。

    最後到了台灣尾鵝鸞鼻再回頭沿著來時路洄游回去，也就是所謂的「回頭烏」，產卵後的回頭烏變得體態瘦小，食用價值不高。台灣漁民在冬天捕捉烏魚的歷史，已經長達數百年，甚至發展出特有的捕烏文化。來到台灣南部海域準備產卵的雌烏魚，往往處於最飽滿成熟的階段，使得台灣野生烏魚子的品質向來是有口皆碑的。

    烏魚長成至產卵的成熟期約需2 至3 年，近十幾年來中國漁業需求的快速成長，加上烏魚子的高單價，導致大量烏魚群早在長江口即被捕撈一空，每年能夠洄游至台灣海域的野生烏魚群越來越少，每年冬天必來的「信魚」幾乎快要變成傳說了。

    如果信魚有一天無法再依約前來，將是台灣漁業無可彌補的損失。幸而台灣的烏魚養殖技術獨步全球，以海邊魚塭養殖即將成熟的雌魚，每年白露之後細心照料兩三個月，讓雌烏魚的卵巢充分成熟飽滿，生產的烏魚子一樣品質優異。

    ──節選自張惠芬《我的食物地圖》'
