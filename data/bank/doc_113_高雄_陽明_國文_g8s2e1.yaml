- id: doc_113_高雄_陽明_國文_g8s2e1_s2_13
  section: 2
  number: 13
  type: single
  page: 2
  stem: 〈木蘭詩〉中「朝辭爺孃去，暮宿黃河邊。不聞爺孃喚女聲，但聞黃河流水鳴濺濺。旦辭黃河去，暮至黑山頭，不聞爺孃喚女聲，但聞燕山胡騎聲啾啾。」關於上述詩句的說明，下列何者不正確？
  options:
  - label: A
    content: 透過時間與空間的迅速變換，傳達出行軍迅捷及戰情緊急
  - label: B
    content: 意味著木蘭離她的故鄉愈來愈遠，思親之情也越發深刻了
  - label: C
    content: 詩句「不聞爺娘喚女聲」的反覆顯示木蘭後悔莫及的心境
  - label: D
    content: 木蘭勇敢與堅毅的形象，隨著離故鄉越來越遠而更加凸顯
  lesson_raw:
    title: 木蘭詩
    basis: 題幹提及〈木蘭詩〉並引用課文原句
