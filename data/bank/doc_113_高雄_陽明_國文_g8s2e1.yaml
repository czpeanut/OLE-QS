- id: doc_113_高雄_陽明_國文_g8s2e1_s2_22
  section: 2
  number: 22
  type: single
  page: 4
  stem: "根據下文，有關於虱目魚的描述，何者錯誤？\n「鳴螿①幾日吊秋菰②，出網鮮鱗腹正腴。\n頓頓飽餐麻虱目，台人不羨四腮鱸。」\n(註：麻虱目，魚名。狀如鯔魚，細鱗。產陂③澤中，夏秋盛出。台人以為貴品。)\n\
    \    本詩作者朱仕玠於乾隆28 年（1763）來臺擔任鳳山縣教諭，曾寫組詩〈瀛涯漁唱〉一百首，詩作內容為記錄來臺期間所見所聽聞之風土民情，詩後亦有註補充說明。又據《重修臺灣府志》（1747）記載：「麻虱目，魚塭中所產，夏、秋盛出。狀類鯔，鱗細；臺以為貴品。」\n\
    【注釋】：①螿：音ㄐㄧㄤ，昆蟲名。似蟬而較小，色青赤。\n②菰：音ㄍㄨ，植物名。「菰菜」、「茭白筍」之古稱。\n③陂：音ㄆㄧˊ，池塘、湖泊。"
  options:
  - label: A
    content: 詩文首兩句點出虱目魚產季是寒蟬鳴叫、茭白鮮美的秋天，此時撒網補撈麻虱目，正是魚腹最肥腴的時刻
  - label: B
    content: 詩文後兩句寫出由於麻虱目量多而價廉，餐餐幾乎都吃，因此台灣人對四腮鱸魚的喜愛超過對麻虱目的喜愛
  - label: C
    content: 虱目魚又稱麻虱目，形狀類似鯔魚，擁有細小的鱗片，主要生長於淺水區，夏秋季節產量豐富
  - label: D
    content: 麻虱目主要產自魚塭，台灣人視虱目魚為貴重的食材，並將其列為常見的美味，常常食用
