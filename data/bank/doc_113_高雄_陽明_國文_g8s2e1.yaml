- id: doc_113_高雄_陽明_國文_g8s2e1_s2_8
  section: 2
  number: 8
  type: single
  page: 1
  stem: 席慕蓉〈一棵開花的樹〉詩中寫到：「而當你終於無視地走過／在你身後落了一地的／朋友啊 那不是花瓣／是我凋零的心」，下列選項何者最適合用來形容這樣的心情？
  options:
  - label: A
    content: 落花有意隨流水，流水無情戀落花
  - label: B
    content: 落紅不是無情物，化作春泥更護花
  - label: C
    content: 桃花盡日隨流水，洞在清溪何處邊
  - label: D
    content: 無邊落木蕭蕭下，不盡長江滾滾來
  lesson_raw:
    title: 一棵開花的樹
    basis: 題幹提及席慕蓉〈一棵開花的樹〉
