    根據勞動部之研究統計，2023 年男、女性畢業生的平均起薪，可知女性初任人員薪資平均是3.4 萬元，男性則是3.7 萬元。而就各教育程度觀察，大學以下性別薪資相近，但研究所女性薪資4.5
    萬元，為男性5.2 萬元的87.1%，差距12.9%為各教育程度之冠。勞動部表示，此應與研究所畢業男性初任人員中，就讀資訊通訊科技學門、工程及工程業學門者占61.2%
    （女性僅占24.8%），致男性從事薪資較高的科技、工程領域人數較多有關。

