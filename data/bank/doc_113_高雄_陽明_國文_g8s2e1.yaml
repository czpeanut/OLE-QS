  section: 2
  number: 18
  type: single
  page: 3
  stem: '請閱讀下列兩段文字，根據下文，下列敘述何者正確？

    (甲) 鬼頭刀，果然是海中一把快刀。牠快速的身影從船邊一閃而過，在深邃的波光中閃耀著青藍光芒。偶爾，牠會放慢速度，甚或停在船邊，用好奇的龍銀大眼與我在不同的世界裡相互對望。

    —廖鴻基〈鬼頭刀〉

    (乙) 我還想體會被鬼頭刀魚拉著船穿破浪頭的快感，就像過去我們釣到大魚的時候，牠們讓我們興奮得血脈賁（ㄅㄣ）張，那股難以言喻的瞬間感觸，是我仍想出海的原始動機。

    —夏曼．藍波安〈望海的歲月〉'
  options:
  - label: A
    content: 兩者皆在鬼頭刀的顏色及外形上，有著詳盡細膩的描繪
  - label: B
    content: 兩者皆強調獵捕鬼頭刀的過程，興奮之情令人難以言喻
  - label: C
    content: (甲)指出鬼頭刀的游速甚快，(乙)則未能點出鬼頭刀的速度
  - label: D
    content: (甲)是對鬼頭刀的觀察紀錄，(乙)則是寫有關鬼頭刀的回憶
