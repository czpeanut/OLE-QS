  stem: 下列哪一句詩句的描述，最能表現出家中貧窮的困境？
  options:
  - label: A
    content: 來入門，悵欲悲
  - label: B
    content: 盎中無鬥米儲，還視架上無懸衣
  - label: C
    content: 拔劍東門去，舍中兒母牽衣啼
  - label: D
    content: 咄！行！吾去爲遲
  group_stem: '出東門，不顧歸。來入門，悵欲悲。

    盎①中無鬥米儲，還視架上無懸衣。

    拔劍東門去，舍中兒母牽衣啼：「他家但願富貴，賤妾與君共餔②糜③。上用倉浪天故，下當用此黃口兒④。今非！」

    「咄！行！吾去爲遲！白髮時下難久居。」

    ──節錄自 佚名〈東門行〉

    【注釋】

    ①盎：音ㄤˋ，儲米的器具。

    ②餔：音ㄅㄨ，吃。

    ③糜：音ㄇㄧˊ，稀飯，粗劣的飲食。

    ④黃口兒：幼兒。'
