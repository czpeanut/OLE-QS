  type: single
  page: 4
  stem: '閱讀下列詩作並判讀內容，詩人認為如何才能使青春無怨無悔？

    在年輕的時候，如果你愛上了一個人

    請你 請你一定要溫柔地對待他

    不管你們相愛的時間有多長或多短

    若你們能始終溫柔地相待 那麼所有的時刻

    都將是一種無瑕的美麗

    若不得不分離 也要好好地說聲再見

    也要在心裡存著感謝 感謝他給了你一份記憶

    長大了以後 你才會知道

    在驀然回首的剎那 沒有怨恨的青春才會了無遺憾

    如山岡上那輪 靜靜的滿月

    ──席慕蓉〈無怨的青春〉'
