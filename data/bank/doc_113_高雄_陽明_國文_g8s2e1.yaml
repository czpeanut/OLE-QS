  group_stem: '現今音樂串流平臺盛行，每個人耳機裡的浪潮也許無遠弗屆，跨及不同風格、類型、國度、年代，但總有那麼幾首華語經典抒情歌，經年累月常駐心中，在深晚無眠時悄悄迴盪腦海。為何這些歌曲令人深深著迷？是歌詞打動人心？旋律別有心機？還是有更深刻全面的解釋？

    張惠妹〈聽海〉、陳奕迅〈愛情轉移〉、徐佳瑩〈失落沙洲〉……臺灣大學音樂學研究所教授蔡振家列出一首又一首華語情歌。他想知道，為什麼這些歌看似惆悵感傷，卻彷彿具備「療癒」的心理功效？剖析音樂結構，主歌與副歌的差異、連結、重複、變化，如何與一個人梳理生命經驗的心路歷程遙相呼應？音樂與大腦、演化之間又有什麼關係？


    每首情傷歌曲，都是一趟重返舊地的旅程


    傷心的人總愛聽慢歌。可是，人為什麼會想要一再沉浸於哀傷？聽情歌真的能分擔心中的苦嗎？蔡振家觀測人們聆聽華語抒情歌的生理反應，發現一個奇特現象。

    「我們選用〈給我一個理由忘記〉、〈洋蔥〉等五首情傷歌曲，發現從歌剛開始到中段，聆聽者的平均手指溫度會越來越冰冷，但隨後回升，呈現開低走高的趨勢。」生理訊號的變化反映情緒波動，蔡振家解釋，根據過去研究，負面情緒會導致手指溫度降低，放鬆的感受則使手指溫度上升。

    也就是說，在一首情傷歌曲的時間裡，人的心情會先跌入低谷，再回到放鬆、平靜的狀態。呼吸指標也呈現類似結果：在歌曲進入尾聲時，有些聆聽者的呼吸變得又深又慢。

    這樣的情緒生理變化有何意涵？蔡振家用一個案例說明：

    「我記憶很深刻，有位實驗參與者戴著儀器，歌聽到一半就哭了出來。奇怪的是，他哭完之後，手指溫度馬上回升。這就告訴我們宣洩（catharsis）是一個重要的機制，情傷歌曲能讓人把蓄積心中的負面情緒給宣洩出來，而不只是重新感受這些情緒。」

    借用創傷後成長（post-traumatic growth）的模式進一步說明，經歷情傷的人若想成長，就必須不斷重返、親歷情傷事件的現場，才能得到有意義的教訓與體會。「失戀的人聽情傷歌，不會只是聽歌而已。」蔡振家說，「他也在回顧自己經歷的一切，再度體驗那些悲傷、難過。」


    節錄自林義宏〈與心交響的旋律：臺大蔡振家以音樂心理學，告訴你情歌沒告訴你的事〉'
