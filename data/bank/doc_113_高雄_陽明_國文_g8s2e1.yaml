  section: 2
  number: 12
  type: single
  page: 2
  stem: 下列關於〈木蘭詩〉的文句分析，何者正確？
  options:
  - label: A
    content: 「東市買駿馬，西市買鞍韉，南市買轡頭，北市買長鞭」寫出木蘭在戰場上的奔波與繁忙
  - label: B
    content: 「阿爺無大兒，木蘭無長兄，願為市鞍馬，從此替爺征」表示木蘭代父從軍的無奈與哀傷
  - label: C
    content: 「策勳十二轉，賞賜百千強」用誇張的手法寫木蘭凱旋而歸，受到天子豐厚的獎賞
  - label: D
    content: 「木蘭不用尚書郎，願借明駝千里足，送兒還故鄉」寫木蘭的不慕榮利，只盼望獲得明駝
  lesson_raw:
    title: 木蘭詩
    basis: 題幹提及〈木蘭詩〉
