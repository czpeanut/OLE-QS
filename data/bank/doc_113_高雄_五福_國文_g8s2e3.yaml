  group_stem: 【丙】 人到了中年以後，心情由絢燦趨於平淡，本來都會傾向山水田園。可是生為一個忙碌的現代人，既無時間尋幽探勝，更不可能遁跡深山；倒不如安之若命地在現實生活中追尋一些那位文友所謂的「俗願」，亦未始不可以充實一下心靈。否則居魏闕而思江湖，心情反而不能平靜。杜甫雖然謳歌「在山泉水清，出山泉水濁。」他自己並不甘心做個「天寒翠袖薄，日暮倚修竹」的佳人。因為他既有「致君堯舜上，再使風俗淳」的大願，也有「但願我與汝，終老不相離」的小願。人若沒有了願，就沒有了熱誠，也失去了生活的情趣，恐怕連山水田園之樂，都不能體會了。
    ( 節錄琦君〈方寸田園〉)
