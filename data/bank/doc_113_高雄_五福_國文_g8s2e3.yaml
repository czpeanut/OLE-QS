  stem: 「人生際遇變化無常，不就如天際雲彩，瞬息萬變，難以掌控捉摸。」這段文字說明人生具何種特質？
  options:
  - label: A
    content: 精彩絕倫
  - label: B
    content: 暗藏玄機
  - label: C
    content: 難以預料
  - label: D
    content: 一路順遂
  group_stem: '【戊】 抬頭仰望藍天，有時晴空萬里，有時風起雲湧，不管是棉絮般柔軟的白雲，呈波浪渦流狀或如棋盤、魚鱗、羽扇、綿羊捲曲狀雲層，在陽光折射下，因高度、質地、結構的不同，各自展現或壯觀或精巧或眩目的風貌。在觀雲時刻，覺得天地何其浩渺，胸中塊壘豁然開朗，不再為小傷小痛而悲情。人生際遇變化無常，不就如天際雲彩，瞬息萬變，難以掌控捉摸，世間種種翻騰好比過眼雲煙，倏忽消逝，耀眼明亮時值得喝采，黯淡孤獨時，也是另種人生歷程。一切風輕雲淡，自如自在，天地自然體現了無常的道理，無需執著擁有或失去，沒有什麼是永恆不變，也許不斷的變動才是唯一不變的真理。

    「我是天空裡的一片雲，偶爾投影在你的波心，你不必訝異，無需歡喜，在轉瞬間消滅了蹤影。」徐志摩膾炙人口的詩句描述的雖然是愛情，但也貼切的點出生命如浮雲，在不停的變異中如實展現各自獨特本質。此刻對著天空呆想的我，已非當年玩著冰淇淋、小綿羊雲朵遊戲的小女孩，看雲的姿態未變，心態在時間及種種歲月行旅的發酵下已起了化學變化，少了些童稚的純真，多了些成熟的了然，但歡喜讚嘆的心卻總是在的。呼嘯而過的日子，從不曾真正離去，只是換種風情繼續在天涯響遏行雲，見證一切。

    （節錄曉亞 〈看雲的日子〉）'
