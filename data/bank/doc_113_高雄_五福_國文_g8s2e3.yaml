  group_stem: '【丁】 海濱有介蟲焉，狀如蟚蜞⑴，八足二螯，惟右螯獨鉅，長二寸許。潮退，行沮洳⑵中，聞人聲弗避，豎其螯以待，若禦敵者然。土人取而烹之，螯雖熟而不僵也。嗚呼！螳螂奮臂以當車轍，漆園之吏⑶固笑之矣。彼夫恃其區區之才與力，殺身而不悟者多矣！之二蟲又何知焉？

