  group_stem: '【乙】 樂樂國中「數位學生證」掛失暨補發申請 注意事項

    一、 數位學生證如有遺失狀況：學生須自行至一卡通官網申請掛失暨補發。

    二、 申請掛失暨補發步驟： ( 路徑https://www.i-pass.com.tw/ )

    一卡通官網→顧客服務→記名/掛失→學生證掛失暨補發→注意事項勾選「同意」

    →填寫資料→繳費

    三、 申請掛失暨補發費用：學生自費。

    掛失手續費為每張20 元，補發者另需繳交票卡工本費。(一卡通公司收款)

    四、 申請補發工作天：繳費後約 10 個工作天，新卡寄到教務處註冊組，將通知同學領取。

    五、 如有其他疑問，請洽一卡通客服中心(07)791-2000。

    教務處註冊組 2024/01/11'
