    content: 陳述古和同事祭拜發生作用
  group_stem: '【己】 陳述古 密直知⑴建州 浦城縣日，有人失物。捕得莫知誰為盜者。述古乃紿⑵之曰：「某縣有一鐘，能辨盜至靈。」使人迎置後閣祠之，引群囚立鐘前，自陳不為盜者摸之則無聲，為盜者摸之則有聲。述古自率同職禱鐘甚肅，祭訖，以帷⑶圍之，乃陰⑷使人以墨塗鐘。良久，引囚逐一令引手入帷摸之。出乃驗其手，皆有墨。唯有一囚無墨。訊之，遂承為盜。蓋恐鐘有聲不敢摸也。

    （沈括〈辨盜鐘〉）

    ※注釋：⑴「知」建州浦城縣日：當知縣，即當縣長。 ⑵紿：音ㄉㄞˋ，欺騙。⑶帷：障蔽的布幕。 ⑷陰：暗中。'
