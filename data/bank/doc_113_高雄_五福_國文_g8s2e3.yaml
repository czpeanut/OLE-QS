  group_stem: '【甲】 自朝至暮，時而在山之南，時而在山之北，或穿籬覓樹，或隱竹據石⑴，或隔溪看雲，或背花臨水⑵，或聞鳥聲久坐，或循柳陰獨行。每至夕陽墜樵⑶，晚風在笛⑷，則攜酒一壺，棋一局，求一能領者，相與躡蘿蹬，坐藤崖，下視菜花萬斛⑸，高下積黃，牧童行歌，各在歸犢；當此之際，胸鬲塵穢⑹，洗滌殆盡，樂趣所及，無非天機(指天賦性靈)，殆覺春融(指春日和煦)日長，歲豐物茂，悉充洽於方寸之地。

