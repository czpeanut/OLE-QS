  group_stem: '【題組】請在閱讀下列敘述後，回答 47~50 題：

    皮膚及黏膜組織是抵抗病原的第一防線。健康的皮膚及器官表面所分布的汗腺、皮脂腺、胃腺可以保護身體不被外在

    的汙染原侵犯。從呼吸道一直到泌尿系統出口，都有覆蓋著黏膜組織來保護人體。

    當入侵物超越第一防線，內部的主動防禦系統就展開「免疫戰爭」，特殊白血球如單核球或巨噬細胞，會吞噬入侵物。

    當入侵者極強悍，單核球或巨噬細胞無法將其制伏時，巨噬細胞就會發出訊息給T 細胞及B 細胞，T 細胞會幫助B 細胞產

    生抗體對抗病原，而抗體是具有「專一性」及「記憶性」的。

    一旦這二道防禦線都無法遏阻入侵者，病原便開始在身體組織及血液內繁殖。雖然免疫系統無法成功的完全阻止病原

    入侵，但並不表示免疫細胞就完全放棄了，此時免疫細胞仍在體內不斷反擊，並以全身的淋巴器官為據點。這也就是為何

    我們常會聽到醫生說淋巴結或脾臟腫大，有感染的現象。或者是小孩子一感冒，扁桃腺就會發炎腫大等自然的身體反應。'
