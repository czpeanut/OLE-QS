    Jessica: Rent? Rent it at a clothes store?

    Kate: No. I rent it online. Check this website. There are thousands of fashionable
    clothes and bags on it.

    Jessica: Interesting! Show me!

    Kate: Choose one and let’s get the ball rolling.

    Jessica: Well, this green dress.

    Kate: Click the picture of the green dress and key in the number of the days which
