  section: 2
  number: 36
  type: single
  page: 7
  stem: What helped Tina’s team get the answers to the puzzles?
  options:
  - label: A
    content: A teacher gave them all the answers.
  - label: B
    content: They used a computer to look up answers.
  - label: C
    content: Everyone in the team used their different skills.
  - label: D
    content: They had more time than the other teams.
  group_stem: 'An Exciting Day in an Escape Room  by Tina Chen


    Last Friday, our class went to an escape room for a special activity. An escape
    room, also called a puzzle room, is a fun game where people are in a locked room
    and must work out clues and puzzles to get out before time runs out.


    We were grouped into teams of six. Each team had to find clues and answer questions
    about history, science, and math. We needed to work together and think quickly.


    At first, my team didn’t know where to start. There were strange signs on the
    walls and a locked box on the floor. After a few minutes, we found a clue behind
    a painting. Everyone got excited! We followed the clue, opened the box, and found
    a key and a riddle. We worked out puzzles in the room one by one, and in the last
    two minutes, we escaped from the room!


    I learned that teamwork is very important. Some classmates were good at solving
    riddles. Others were good at finding hidden clues. Everyone helped. It was a fun
    and exciting way to learn outside the classroom.


    📖 puzzles 難題 riddle 謎語 clue 線索 solve 解決'
