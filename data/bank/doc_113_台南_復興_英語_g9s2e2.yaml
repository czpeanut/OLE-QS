- id: doc_113_台南_復興_英語_g9s2e2_s2_33
  section: 2
  number: 33
  type: single
  page: 6
  stem: What can you NOT do when you go slow jogging?
  options:
  - label: A
    content: Move your arms.
  - label: B
    content: Watch a movie on TV.
  - label: C
    content: Talk with your friends.
  - label: D
    content: Lie on the floor.
  group_stem: 'Slow jogging is a way to jog. Hiroaki Tanaka, a Japanese, comes up
    with this new way of exercise and it becomes more and more popular. It is very
    easy to start slow jogging; you don’t need to go to somewhere special, such as
    the gym or the school playground. You can do it in the office, in the living room
    and even in the classroom. Also, you don’t need any special equipment, either.
    Just bring a bottle of water and wear something comfortable.

    Going slow jogging is a great way to exercise your body. When you go slow jogging,
    look ahead, swing your arms and move your knees easily. What''s more, take small
    steps and don’t step too hard. It is like a fast walk. You can chat, listen to
    music or watch TV freely during slow jogging without getting tired. That''s why
    you can do it with your friends, parents and even your grandparents. At first,
    you can go for a short while, about ten minutes, and then do another five more
    or ten more minutes when you get used to it. Besides, for people who want to get
    thin, it is best to go slow jogging for thirty minutes a day.

    📖 equipment 設備 step 踏步; 步伐'
