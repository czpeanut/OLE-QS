  - label: D
    content: Tennis started giving the same prize money to women in 2007.
  group_stem: 'VOICES OF PEOPLE

    Let Girls Win the Same


    I''m Mandy Wu, a junior high school student in Tainan. I love watching sports,
    and I think boys and girls should get the same prize money.


    Many girls work just as hard as boys. They train every day and want to win. But
    in some games, girls get less money than boys, even when they win the same kind
    of match. That is not fair.


    Let’s look at tennis. Men and women now get the same prize money in the four biggest
    matches, called Grand Slams. This started many years ago and is still true today.
    In early years, in some big tennis games, women won less than half of the money
    that men got. Until 1973, the US Open, one of the Grand Slams, started giving
    the same money to men and women who won. Later, in 1984, the Australian Open did
    the same. But then, they gave more money to men again in 1996. Finally, in 2001,
    they changed back to giving the same money to everyone, no matter if the winners
    were a man or a woman. After that, in 2007, Wimbledon, the most famous Grand Slam,
    also gave equal prize money.

    Now, all the biggest tennis games give the same money. However, there is still
    a long way to go. In many other sports, this does not happen. Even when women
    win or play just as well, they often get less. That doesn''t sound right to me.


    Dr. Anita Ross, a teacher from Canada, says, “When girls see they get less, they
    may think they are not good enough.” I think that’s very true. If we want boys
    and girls to believe in themselves, we must treat them the same. That includes
    how we reward them in sports.


    Boys and girls may look different, but they both play with the same heart. They
    run, jump, and try their best. They win for their team and their country. If they
    do the same work, they should get the same prize.


    📖 match 比賽 includes 包含'
