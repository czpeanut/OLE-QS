    Kate: In three days or so.

    Jessica: Wait! How do I know whether the clothes I rent clean or not?

    Kate: No worries. Check here. The website shows you how they clean the clothes
    sent back to them.

    Jessica: Wow! They clean the clothes more carefully than I do.

    Kate: It does! I started to rent clothes on this website about three months ago.

    Jessica: That’s why you never wear the same item twice.

    Kate: I love being fashionable and going green at the same time.


