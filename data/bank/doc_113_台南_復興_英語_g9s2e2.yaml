  group_stem: 'If you visit Amsterdam, you will quickly notice that bicycles are everywhere.
    In fact, there are more bikes than people in the city. Amsterdam has become one
    of the most bike-friendly cities in the world, and this didn’t happen by chance.
    The city has worked hard over the past few years __38.__. It has built hundreds
    of kilometers of bike lanes and made it safer and easier for people to travel
    by bicycle instead of by car.


    __39.__, many streets in the city center have been closed to cars or made only
    for bicycles and pedestrians. This makes the air cleaner and the streets quieter.
    Of course, some drivers were not happy about these changes at first. But over
    time, people began to see the good sides. Today, more than 60% of trips in the
    city center are made by bicycle.


    You might wonder __40.__. The main reason is that the city wants to make the quality
    of life for everyone who lives there better. With fewer cars on the road, there
    is less noise, less air pollution, and more space for people to enjoy.


    📖 lane 巷弄 pedestrain 行人 quality 品質'
