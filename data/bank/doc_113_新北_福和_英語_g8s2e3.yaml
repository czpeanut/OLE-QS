- id: doc_113_新北_福和_英語_g8s2e3_s2_46
  section: 2
  number: 46
  type: single
  page: 3
  stem: 46. How do people in Japan usually show their respect during Ghost Festival?
  options:
  - label: A
    content: They bring flowers and photos for the dead.
  - label: B
    content: They prepare sweets for their loved ones.
  - label: C
    content: They dance to show their love to their ancestors.
  - label: D
    content: They show respect to the dead by cleaning the graves.
  group_stem: 'People around the world remember their loved ones in special ways.
    In Mexico, the Day of the Dead is a colorful and lively festival held in November.
    Families get together and bring food, flowers, and photos to welcome the spirits
    of the dead. It is a time to celebrate, not to fear, death.

    In some parts of Asia, Tomb Sweeping Day is a time for families to clean their
    ancestors’ graves. For example, people in Taiwan bring flowers and food to show
    respect. This quiet holiday happens every spring and helps people remember where
    they come from and the importance of being with family.

    Some people in Asia also celebrate the Ghost Festival. It takes place in the seventh
    lunar month. People believe that ghosts come back to the world of the living during
    this time. In Taiwan, families prepare food and burn paper money to make both
    family spirits and lonely ghosts happy, and people in Japan usually show their
    respect through dancing. What’s more, countries like Vietnam and Malaysia even
    provide sweets for the dead.

    Though these festivals look different, they share the same heart, to show love
    and respect for the dead. They help people stay close to their family, even across
    time.  held 被舉辦的 spirit 靈魂 ancestor 祖先 ghost 鬼 lunar 陰曆的'
  ai_answers:
    gemini: C
    qwen: C
  answer:
  - C
  answer_status: ai_generated
  answer_source: ai:gemini+qwen
