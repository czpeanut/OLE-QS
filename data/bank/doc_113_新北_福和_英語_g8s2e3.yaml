  group_stem: 'More and more people are choosing to eat healthy food. These years,
    people in the West started to drink “golden milk,” a kind of healthy drink. It
    uses milk and turmeric. Turmeric is a spice that both looks and tastes like ginger.
    When people use it in their drinks and food, they often make it into powder.

    When it comes to turmeric, it’s easy for us to think of India. It was the first
    place people found turmeric in history. Indians used turmeric to make curry. In
    fact, India is famous for its curry food. Another use for turmeric is for medicine.
    People use turmeric in medicine to ease pain, and doctors like it because it comes
    from nature.

    Though turmeric is popular in India, people in the West didn’t begin to ask for
    it until today. Walking on the streets in New York, you will notice some Americans
    having golden milk in coffee shops. Interestingly, some people drink “golden milk”
    with soy milk, not with cow’s milk. Americans like it because they care about
    their health more now. Actually, you can make your own golden milk at home. Go
    online, and you will find more recipes for it!

