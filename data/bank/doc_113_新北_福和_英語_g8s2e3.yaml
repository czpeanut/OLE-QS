  group_stem: 'A big truck drives in. The driver gets out of it and begins working.
    What kind of driver are you expecting to see? A tall strong man? In fact, there
    are many female truck drivers around the world. Sharon Moore, a 160-cm-tall woman
    from the USA, is one of them. “Everyone says I can’t do it. They say I can’t reach
    the pedals because of my height. Well, I move my seat closer to the front, so
    I can reach them,” she said. She even started S.H.E. Trucking Company to help
    other women like her. She wants the world to know: Women can also drive big trucks.

    Eric works in the hospital. He is kind, hard-working, and pretty good at his job.
    After he gives kids a shot, some people will say, “Thank you, Doctor!” And he
    will answer, “I''m a nurse, not a doctor.” Do you think of women when it comes
    to nurses? In fact, more and more men choose to be nurses, and being a man doesn''t
    mean he cannot be a great nurse. However, some people still see them differently
    and don''t believe they can do the job well: For them, there is still a long way
    to go.

