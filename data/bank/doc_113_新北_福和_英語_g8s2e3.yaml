  stem: 55. After reading the first paragraph, which question do we have an answer
    to?
  options:
  - label: A
    content: What are the differences between colds and the flu?
  - label: B
    content: What causes colds and the flu?
  - label: C
    content: Who gets colds or the flu more easily?
  - label: D
    content: What should you do when you have a cold or the flu?
  group_stem: 'Colds and the flu share many symptoms, but there are still some differences.
    Usually, the flu is worse than the common cold, and it has symptoms like high
    fever, severe headache, and cough. People with the flu sometimes also experience
    a sore throat and a runny nose, and many of them feel tired. So, when students
    get the flu, they should stay at home and get more rest. On the other hand, when
    people have a cold, it is rare to have a high fever or a severe headache. A runny
    nose and a sore throat are the more common symptoms.

    Although it can be difficult to tell a cold from the flu just by looking at the
    symptoms alone, doctors can know that through a special test. But, just keep in
    mind: Drinking more water and getting enough rest are always important when you
    feel under the weather.

     the flu (influenza) 流感 symptom 症狀 difference 區別 severe 嚴重的 rare 少見的'
