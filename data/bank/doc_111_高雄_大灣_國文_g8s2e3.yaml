  group_stem: '網路上看到鯨落的影片。濛濛藍的海水中，一團霧似的龐大物體，漂浮著一動不動。講述者說那是鯨魚，正在緩慢下沉中。我盯著畫面，半天，沒看到明顯的下沉狀況，鯨魚自若地凝固在海水中，幾乎像靜物。

    據說鯨魚知道自己的死期。在將亡之際，它會游到深海區，之後垂直下沉。由於海水浮力，這個下沉非常緩慢，緩慢到如同花開，如同種子發芽，並非肉眼可見。要用延時攝影，才能觀察到動靜。而在這似乎靜止的狀態中，鯨魚的身體成為了供養。一大群魚類環繞它分食。在深海中，這個狀態，能維持四個月到半年，視鯨魚的體積而定。

    沉到海床上後，繼續有其餘的深海生物，在鯨魚的軀骸中各取所需。一座「鯨魚食堂」，據說可以供應上萬種生物體的存續繁衍。這種供養，長達百年。不但滋生萬物，還改變了海洋生態。

    當文章被收集成書之後，某種程度，可以視同「鯨落」。該完成的已然完成，而浮沉在時光長流中，供養了什麼人，我們其實不知道。作家和出版社懷著熱情，製造了一個又一個美妙的鯨落，定錨文學海床上，看似無聲，其影響和威力要在百年後才見真章。

    每次付梓，成為了鯨落的一塊小小的小小的肉片，都是我的榮幸。

    改寫自 袁瓊瓊 鯨落'
