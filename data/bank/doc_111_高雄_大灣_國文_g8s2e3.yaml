  stem: '景公之時，雨雪三日而不霽。公被狐白之裘，坐於堂側陛。晏子入見，立有間。公曰：「怪哉！雨雪三日而天不寒。」 晏子對曰：「天不寒乎？」公笑。晏子曰：「嬰聞古之賢君，飽而知人之飢，溫而知人之寒，逸而知人之勞；今君不知也。」公曰：「善！寡人聞命矣。」乃令出裘發粟與飢寒。
    《晏子春秋》

    「嬰聞古之賢君，飽而知人之飢，溫而知人之寒，逸而知人之勞；今君不知也。」晏子這段話的解讀，下列敘述何者有誤？'
