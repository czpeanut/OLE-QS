- id: doc_111_高雄_大灣_國文_g8s2e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: '有關〈深藍的憂鬱〉和〈替代死刑〉兩篇文章，下列敘述何者正確？


    | | 深藍的憂鬱 | 替代死刑 |

    | :--- | :--- | :--- |

    | A 敘事人稱 | 第三人稱 | 第一人稱 |

    | B 情節轉折 | 棋王在腦部植入晶片，打算與深藍電腦再次對決 | 對於陷害自己的王達成，王朝明產生報復的念頭。 |

    | C 時空背景 | 想像未來 | 改寫過去 |

    | D 科幻發想應用 | 司法判刑懲處 | 技能學習與人性化 |'
  options:
  - label: A
    content: 敘事人稱：深藍的憂鬱為第三人稱，替代死刑為第一人稱
  - label: B
    content: 情節轉折：深藍的憂鬱為棋王在腦部植入晶片，打算與深藍電腦再次對決；替代死刑為對於陷害自己的王達成，王朝明產生報復的念頭。
  - label: C
    content: 時空背景：深藍的憂鬱為想像未來，替代死刑為改寫過去
  - label: D
    content: 科幻發想應用：深藍的憂鬱為司法判刑懲處，替代死刑為技能學習與人性化
  uncertain_spans:
  - 內容與原卷文字層不符（吻合 89%）
