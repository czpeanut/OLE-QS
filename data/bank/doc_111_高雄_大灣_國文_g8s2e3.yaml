  stem: 廖鴻基先生蒞臨學校演講時，曾表示「藉著我的描寫，我當一座橋，讓岸上的朋友走過這座橋，看見海洋。」這段話的涵義，與下列何者最接近？
  options:
  - label: A
    content: 珍古德：「唯有接觸，才有機會認識；也唯有認識，才有機會關懷。」
  - label: B
    content: 安迪．沃荷：「走得多慢都無所謂，只要你不停下腳步。」
  - label: C
    content: 傅雷：「不會觸類旁通，研究哪一門學問都難有成就。」
  - label: D
    content: 阿姆斯壯：「這是我個人的一小步，卻是全人類的一大步。」
