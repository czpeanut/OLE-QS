  stem: 文中穿插閩南方言，可使文意更傳神。例如黃永武在〈管好舌頭〉一文中使用「老神在在」描述傻瓜的不動聲色，頗為貼切。請問下列畫線處使用的閩南方言，何者使用最正確？
  options:
  - label: A
    content: 哥哥：「我要好好來辦桌，書房乾乾淨淨，才會定下心來好好讀書！」
  - label: B
    content: 爸爸：「真是好孩子！爸爸相信你的成績一定會成為頭家的。」
  - label: C
    content: 妹妹：「算了吧！他三不五時就跑去玩電動，成績哪可能會進步？」
  - label: D
    content: 媽媽：「你們兄妹誰再敢玩電動，我就好好打拚誰一頓！」
  lesson_raw:
