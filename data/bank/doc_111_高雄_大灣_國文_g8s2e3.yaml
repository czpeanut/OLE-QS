- id: doc_111_高雄_大灣_國文_g8s2e3_s2_38
  section: 2
  number: 38
  type: single
  page: 6
  stem: 根據前後文，缺空處「 」填入下列哪一選項最合適？
  options:
  - label: A
    content: 越重要的話，越要慢慢說出來
  - label: B
    content: 良好的溝通是「聽」出來的
  - label: C
    content: 幽默感，是讓話更動聽的關鍵
  - label: D
    content: 關係再近，說話也要有分寸
  group_stem: '當你在聽別人說話的時候，你有一邊滑手機的習慣嗎？或是，你有沒有遇過，當你在說話時，卻發現對方心不在焉，好像沒在聽。這時候，你的感覺是什麼？其實，溝通是「互相整理」的過程，對方協助自己釐清想法，自己也能幫助對方整理出重點，但是一直以來，大家努力精進溝通表達技巧時，卻忽略了一個事實：「
    」。

    作者劉秀丹在《阿丹老師的幸福說話課》一書中，提供5 個技巧，若能在生活或工作中多加注意及練習，將能幫助你「和誰都聊得來」！

    一、利用肢體語言表達關心

    善用肢體語言，可以幫助說話者感受到你的專注。有時候多說無益，只要給予對方一個微笑，或適時的點頭，就能表達出內心的支持。

    二、用簡短的回應引導對方「多說話」

    你該扮演的角色應該是「鼓勵對方多說話」的聽眾，讓對方從梳理自己的思緒當中，「自己解決問題」，反而能讓對方有自我成長的機會。但給予對方說話空間的同時，也要注意你的傾聽過程和回應，能讓對方感受到你的關心和支持

    三、摘要式重點整理

    當對方說完話後，你可以簡單扼要地重複重點內容，一方面是確認自己是否理解正確，避免有誤解的地方，另一方面則是讓說話者能有被了解的溫暖感受。

    四、發揮同理心去傾聽對方的聲音

    《阿丹老師的幸福說話課》指出，一段聆聽是否能讓人感到溫暖，關鍵就在於聽者能否走出自己的世界，去貼近對方現在經歷的各種情緒。

    舉例來說，若說話者對於「主管突然指派一堆工作」表達出無奈的心情，你身為一個傾聽者，若做出「沒什麼好擔心的啦！」的回應，可能只會讓對方覺得你沒有試著了解他，甚至還否認了他的感受。相反地，若你能站在對方的角度傾聽，給予正面回應，像是「這樣壓力真的很大，看來這陣子要辛苦一點了。」反而能讓對方有被理解、情感被支持的感受。

    五、謹慎地給予忠告

    當說話者對於想要解決的問題感到不知所措時，他可能需要的並不是情緒上的支持或安慰，而是希望能尋求協助。此時，我們還是可以提供具體的建議給對方。但是在說話前，應該要注意
    2 件事：

    (１)心態：要確認自己的傾聽與提供的幫助，是「真的想幫助對方解決問題」，而不是為了表現出自己比較厲害。

    (２)需求：開口講出建議前，你可以先透過「你覺得我可以怎麼幫你呢？」「我能幫上什麼忙嗎？」「你會想聽看看我的看法嗎？」來確認對方是否真的需要自己的忠告。'
