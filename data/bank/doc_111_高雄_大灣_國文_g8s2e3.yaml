  stem: 這是BTS 成員的中文造句，請問何者用字有誤？
  options:
  - label: A
    content: 碩珍：這起貪汙案涉及的官員人數之多、金額之鉅，真是「駭人聽聞」，已有數十人因此遭到「彈劾」
  - label: B
    content: 玧其：別看他一副「放浪形骸」的樣子，但是談起話來總能「言簡意賅」、切中事理，真是人不可貌相
  - label: C
    content: 號錫：埃及金字塔建造「迄今」已有數千年，歷經歲月的摧折仍「屹立不搖」，是建築史上的奇蹟之一
  - label: D
    content: 智旻：他做生意向來講求誠信，「銀貨兩迄」，加上多年來「孜孜矻矻」的努力，終於在事業上有所成就
