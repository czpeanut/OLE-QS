  group_stem: "■ 題組五、請閱讀下列文章後，回答問題：\n    2019年2月26日，印度戰機越過「實際控制線」，空襲巴基斯坦激進組織的訓練基地。27日巴基斯坦擊落兩架侵犯巴屬喀什米爾地區的印度戰機。\n\
    \    兩國持續隔著「印巴實際控制線」交火，1947年印巴脫離英國獨立以來，兩國已經打了3場戰爭，其中2場皆因喀什米爾爭議。也因此印巴開始發展核武，形成軍備競賽。1947年協議分治後，巴基斯坦派兵攻占維持獨立、人民多數信仰伊斯蘭教的喀什米爾。喀什米爾國王逃往印度求助，並同意喀什米爾併入印度，因此印巴都宣稱擁有喀什米爾控制權，兩國靠著「印巴實際控制線」區隔控制區域，爭端持續至今。（資料來源：改寫自康世人，印度巴基斯坦衝突急遽升溫，喀什米爾爭議難解，中央社，2019/02/28）"
