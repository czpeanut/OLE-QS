- id: doc_111_桃園_中興_社會_歷史_g8s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 清遜帝溥儀在自己的自傳中道：「有一天在養心殿東暖閣里，隆裕太后坐在靠南窗的炕上，用手絹擦著眼。她面前的紅氈子墊上，跪著一個粗胖的老頭子，也是滿臉淚痕。殿里別無他人，安靜得很。胖老頭抽縮著鼻子，聲響很大，一邊說著話。再後來太后帶著他舉行最後一次朝見儀式，頒布詔書。那天氣氛很不一樣，滿朝哀戚之色。但他只想著等一下要去逗蛐蛐玩，完全沒想過大清國在那天之後已經結束了。」請問：上述事件後，中國進入了何種新局面？
