  options:
  - label: A
    content: 魔鬼藏在細節裡
  - label: B
    content: 你和誰當朋友，決定了你是誰
  - label: C
    content: 認識自己，是所有智慧的源頭
  - label: D
    content: 告訴我你讀什麼書，我就告訴你你是什麼人。
  group_stem: '美國是個富裕國家，美國的垃圾箱幾乎是百寶箱。我在關島管公寓，垃圾箱裡整包上好白米、麵粉、植物油，無數家用器皿，完好的大毛巾、布料、內衣褲，吃不完的整條麵包、乳酪、汽水等……時時發現。垃圾工說，還有箱子、手提電視機、金魚缸、烤爐、運動器械、汽車電池等等，完全可用。我們能想像，在貧窮的國家垃圾箱裡找得到這些東西嗎？說實話，就連舊貨店裡也沒有這些好東西。

    說起垃圾裡有乾坤，樣樣東西、件件事也透露你的祕密。不但你家送出去的舊雜誌把你們的知識水準和範圍、注意的事情、嗜好等等洩漏，有時候你說一句話，吃一頓點心，都把你整個人暴露出來。人的嗜好、習慣、手上的皮膚(掌心的老繭)、身上的傷痕，都是生活情況的說明。

    現在的觀察家很多，我想聰明人真是聞一知十的，而笨人呢，即使把全部的現象給他看了，也不會知道底細如何。有一點想起來教人寒毛直豎，我們不喜歡透露自己的祕密，可是有一千樣東西包括垃圾，把我們的隱私告訴人家－包括收倒垃圾的工人。

    節錄／改寫自 思果〈垃圾裡的乾坤〉'
