  stem: 下列何者歌詠的人物與本文主角相同？
  options:
  - label: A
    content: 折戟沉沙鐵未銷，自將磨洗認前朝。東風不與周郎便，銅雀春深鎖二喬
  - label: B
    content: 在天願作比翼鳥，在地願為連理枝。天長地久有時盡，此恨綿綿無絕期
  - label: C
    content: 三顧頻繁天下計，兩朝開濟老臣心。出師未捷身先死，長使英雄淚滿襟
  - label: D
    content: 勝敗兵家事不期，包羞忍恥是男兒。江東子弟多才俊，捲土重來未可知。
  group_stem: '項王軍壁垓下，兵少食盡，漢軍及諸侯兵圍之數重。夜聞漢軍四面皆楚歌，項王乃大驚曰：「漢皆已得楚乎？是何楚人之多也！」項王則夜起，飲帳中。有美人名虞，常幸從；駿馬名騅，常騎之。於是項王乃悲歌慨，自為詩曰：「力拔山兮氣蓋世，時不利兮騅不逝。騅不逝兮可奈何，虞兮虞兮奈若何！」歌數闋，美人和之。項王泣數行下，左右皆泣，莫能仰視。

    司馬遷〈史記．項羽本紀〉'
