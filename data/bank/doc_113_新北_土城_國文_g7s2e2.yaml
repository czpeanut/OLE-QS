- id: doc_113_新北_土城_國文_g7s2e2_s1_33
  section: 1
  number: 33
  type: single
  page: 3
  stem: 下列對於第二段的敘述，何者錯誤？
  options:
  - label: A
    content: 作者肯定古代匠人的用心
  - label: B
    content: 作者認為只要衣服符合時尚，就必然「穩稱身」
  - label: C
    content: 現今裁縫多只重尺寸與樣式，忽略穿者個性與需求
  - label: D
    content: 「穩稱身」指衣服貼合穿著者，是理想的裁衣標準。
  group_stem: '昔有人持匹帛命成衣者裁剪。逐①詢主人之性情、年紀、狀貌，並何年得科第，而獨不言尺寸。其人怪之。成衣者曰：「少年科第者，其性傲，胸必挺，需前長而後短；老年科第者，其心慵②，背必傴③，需前短而後長。肥者其腰寬，瘦者其身仄④。性之急者宜衣⑤短，性之緩者宜衣長。至於尺寸，成法也，何必問耶！」

    余謂斯匠可與言成衣矣。今之成衣者，輒⑥以舊衣定尺寸，以新樣為時尚，不知短長之理，先蓄覬覦之心⑦。不論男女衣裳，要如杜少陵詩所謂「穩稱身」者，實難其人焉。

    【注釋】

    ①逐：逐一。 ②慵：懶。 ③傴：駝背。 ④仄：窄。

    ⑤衣：一ˋ，穿，動詞。 ⑥輒：總是、每每。

    ⑦覬覦之心：貪汙布料的心態。'
  tags:
