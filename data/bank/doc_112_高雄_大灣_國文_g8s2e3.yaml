- id: doc_112_高雄_大灣_國文_g8s2e3_s2_36
  section: 2
  number: 36
  type: single
  page: 5
  stem: 請依上文判斷，孔明為何未能接納蔣琬的諫言，最後還是決定揮淚斬馬謖？
  options:
  - label: A
    content: 認為用兵須賞罰分明、明正軍律，方能建立法度
  - label: B
    content: 有意效法楚成王公正無私，懲處成得臣的事蹟
  - label: C
    content: 因劉備生前早已叮囑必須嚴懲馬謖
  - label: D
    content: 孫武建議孔明這樣做才能致勝於天下
  group_stem: "（一）\n   孔明喝退，又喚馬謖入帳，謖自縛跪於帳前。孔明變色曰：「汝自幼飽讀兵書，熟諳戰法。吾累次叮嚀告戒街亭是吾根本，汝以全家之命，領此重任。汝若早聽王平之言，豈有此禍？今敗軍折將，失地陷城，皆汝之過也！若不明正軍律，何以服眾？汝今犯法，休得怨吾。汝死之後，汝之家小，吾按月給與祿米，汝不必掛心。」叱左右推出斬之。謖泣曰：「丞相視某如子，某以丞相為父。某之死罪，實已難逃，願丞相思舜帝殛鯀用禹之義(註1)，某雖死亦無恨於九泉！」言訖大哭。孔明揮淚曰：「吾與汝義同兄弟，汝之子即吾之子也，不必多囑。」\n\
    \   左右推出馬謖於轅門之外，將斬。參軍蔣琬自成都至，見武士欲斬馬謖，大驚，高叫留人，入見孔明曰：「昔楚殺得臣而文公喜(註2)。今天下未定，而戮智謀之士，豈不可惜乎？」孔明答曰：「昔孫武所以能制勝於天下者，用法明也。今四方分爭，兵交方始，若復廢法，何以討賊耶？合當斬之。」須臾，武士獻馬謖首級於階下。孔明大哭不已。蔣琬問曰：「今幼常得罪，既正軍法，丞相何故哭耶？」孔明曰：「吾非為馬謖哭。吾思先帝在白帝城臨危之時曾囑吾曰：『馬謖言過其實，不可大用。』今果應此言，乃深恨己之不明，追思先帝之明，因此痛哭耳！」\n\
    \n註：1.舜帝殛鯀用禹之義：舜起初用鯀治水，因鯀治水失敗而殺之，再用鯀之子禹治水。禹治水大獲成功，後來舜帝將地位禪讓給禹。\n    2.楚殺得臣而文公喜：春秋時代時晉楚爭霸。晉文公於城濮大敗成得臣所率領的楚軍，卻因成得臣尚存而對後勢感到憂心。後成得臣因受到楚成王責備而羞愧自殺，晉文公才喜出望外，認為勝負已定。\n\
    (節錄自《三國演義．九十六回》)"
