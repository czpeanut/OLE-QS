- id: doc_112_高雄_大灣_國文_g8s2e3_s2_42
  section: 2
  number: 42
  type: single
  page: 6
  stem: 下列關於「AlphaGo Zero」的敘述，何者正確？
  options:
  - label: A
    content: 透過圍棋規則自我學習
  - label: B
    content: 擊敗李世乭，驚豔全球
  - label: C
    content: 曾多次在網上找人對戰
  - label: D
    content: 耗時3 年才成為圍棋九段高手。
  group_stem: "（四）\n    說起 AI 不能不提 AlphaGo。他是一款圍棋程式，中文翻譯成「阿爾法圍棋」，Go 正是圍棋的英文。AlphaGo\
    \ 戰勝圍棋棋王，舉世聞名。但這有什麼了不起？早先專家系統「深藍」不是已經贏過西洋棋棋王了嗎？圍棋複雜度遠高於西洋棋，西洋棋平均每一步約有 35 種下法，但圍棋平均每一步下法卻將近\
    \ 200 種！有人甚至說：一盤圍棋可能的下法比宇宙中的原子數還要更多！故 AlphaGo 的成就可以說是 AI 界的里程碑，而使用的方法正是讓機器去學習\n\
    \     2014 年 AlphaGo 計畫正式啟動，科學家找來無數的棋譜，輸入多達 3000 萬步的人類棋步，讓電腦學會下棋，之後讓電腦自我對戰，並追蹤哪一種走法最容易獲勝。為了累積經驗，AlphaGo\
    \ 先在網路上找人對戰，到了 2015 年，AlphaGo 打敗了二段棋士，成為第一個打敗職業圍棋的電腦程式。隔年3 月，AlphaGo 前往韓國挑戰 9\
    \ 段高手李世乭，在全球矚目下，它彷彿具有人類的直覺般，下出一手出人意表的棋，以四勝一敗的成績戰勝人類圍棋高手。之後 AlphaGo 繼續精進並推出新版本，能力越來越強大。2017\
    \ 年，它前往中國烏鎮挑戰圍棋世界冠軍，以三連勝的戰績打敗中國柯潔。\n    從 2014 到 2017 短短數年間，AlphaGo 從圍棋菜鳥變成九段高手，似乎再也沒有人類能成為它的對手。戰勝柯潔不久後，AlphaGo\
    \ 從棋賽中引退，但故事並未結束。AlphaGo 隊繼續實驗有關 AI 的技術，並在 2017 年 10 月發表了 AlphaGo Zero。這次AlphaGo\
    \ 不再使用人類知識了！ AlphaGo Zero 的 Zero 代表從「零」開始，這個人工智慧程式只輸入了圍棋規則，由程式自己根據規則學習，短短三天和自己對戰幾百萬次。而成效呢？它以\
    \ 100 ：0 的成績戰勝「打敗李世乭的 AlphaGo」版本；40 天後，更完勝之前所有版本的 AlphaGo！只是 Zero 不曾挑戰人類，不知誰有能力和它對戰？\n\
    \              備註：人工智慧：AI 是 Artificial Intelligence 的縮寫，指所有能讓機器表現出好像具有人類智慧的方法。\n\
    選自《科學少年第 60 期．AlphaGo 的進擊》"
