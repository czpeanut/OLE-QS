- id: doc_113_高雄_鼎金_社會_歷史_g9s1e1_s1_25
  section: 1
  number: 25
  type: single
  page: 1
  stem: 西元1799 年，法國人在埃及發現的羅塞塔石碑刻有三種文字：埃及象形文、埃及世俗體、古希臘文，後人才得以透過對古希臘文的認識解讀埃及象形文，揭開埃及文明的神祕面紗。請問：有關埃及象形文字的敘述，何者正確？
  options:
  - label: A
    content: 起初是由抽象符號所構成
  - label: B
    content: 埃及人的文字中沒有表音字母
  - label: C
    content: 經腓尼基人簡化傳播到地中海一帶
  - label: D
    content: 由於埃及文字過於複雜，故西方文字甚少受到埃及文字的影響。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 歷史
      code: 1-2
      title: 埃及古文明
      chapter: 第1章 西亞與非洲的古文明
