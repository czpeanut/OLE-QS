  section: 1
  number: 28
  type: single
  page: 1
  stem: 有關中國商朝、埃及與西亞這三個古文明在文字上的發展，下列敘述何者正確？
  options:
  - label: A
    content: 埃及使用楔形文字在商業與文書上
  - label: B
    content: 西亞以象形文字與字母文字作為書寫型式
  - label: C
    content: 埃及的象形文字後來成為西方文字的基礎
  - label: D
    content: 商朝的甲骨文依舊停留在圖案階段。
