- id: doc_113_高雄_鼎金_社會_歷史_g9s1e1_s1_26
  section: 1
  number: 26
  type: single
  page: 1
  stem: 希臘史學家希羅多德曾經說過：「埃及是尼羅河的贈禮。」這句話道盡了埃及古文明與尼羅河的關係。請問：希羅多德的這句話，我們可以如何解讀？
  options:
  - label: A
    content: 尼羅河定期氾濫帶來肥沃的淤泥
  - label: B
    content: 尼羅河從不氾濫因而相當安全
  - label: C
    content: 尼羅河方便埃及人航行於亞非兩洲
  - label: D
    content: 尼羅河是天然的屏障阻絕埃及與外地。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 歷史
      code: 1-2
      title: 埃及古文明
      chapter: 第1章 西亞與非洲的古文明
    textbook: 九上歷史 1-2 埃及古文明
    labeled_by: ai
- id: doc_113_高雄_鼎金_社會_歷史_g9s1e1_s1_27
  section: 1
  number: 27
  type: single
  page: 1
  stem: 古埃及的測量、醫藥、曆法、文字等文明成就都相當卓越，即使已過了數千年，仍為後世讚嘆不已。請問：有關古埃及文明的敘述，何者正確？
  options:
  - label: A
    content: 為了要建造金字塔，與丈量氾濫後的土地，故測量技術發達
  - label: B
    content: 埃及位處熱帶，常有傳染病肆虐，為了防治因而醫藥學很先進
  - label: C
    content: 長期觀察河水氾濫的時間，並根據月球運行的週期，發展出陰曆
  - label: D
    content: 用削尖的蘆葦桿在溼軟的泥版上書寫，發明了楔形文字。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 歷史
      code: 1-2
      title: 埃及古文明
      chapter: 第1章 西亞與非洲的古文明
    textbook: 九上歷史 1-2 埃及古文明
    labeled_by: ai
