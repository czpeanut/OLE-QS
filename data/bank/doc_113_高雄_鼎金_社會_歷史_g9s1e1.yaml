  number: 22
  type: single
  page: 1
  stem: 西亞古文明的所在地來往民族眾多、商業貿易頻繁，因而較為注重契約與法律概念。其中，巴比倫國王漢摩拉比將先前已存在的規定進行統整，頒布了《漢摩拉比法典》。請問：下列何者為《漢摩拉比法典》強調的原則？
  options:
  - label: A
    content: 以和為貴
  - label: B
    content: 以牙還牙
  - label: C
    content: 農民最高
  - label: D
    content: 不分階級。
