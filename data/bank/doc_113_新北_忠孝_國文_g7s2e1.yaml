- id: doc_113_新北_忠孝_國文_g7s2e1_s4_9
  section: 4
  number: 9
  type: single
  page: 4
  stem: 根據本文判斷，下列飲食模式出現的先後順序，何者為正確？
  options:
  - label: A
    content: 法式官方料理→日西合併料理→一品洋食
  - label: B
    content: 法式官方料理→一品洋食→日西合併料理
  - label: C
    content: 一品洋食→法式官方料理→日西合併料理
  - label: D
    content: 一品洋食→日西合併料理→法式官方料理
  group_stem: '明治初期，出於政治意圖，日本政府積極推動飲食生活西化。首先，因為需要與西方各國外交，於明治6年(1873年)採用法式料理作為官方料理。此外，為富國強兵，政府不斷探索提升國民體能的營養飲食方式，終於解禁了長期以來一直忌諱的肉食。隨著肉食解禁，各地開始紛紛出現西餐廳，但此時期的西式料理僅限財政界、富裕人士等階層人士才能享用，且這個時代對於西式料理的主食肉食仍有所抗拒。

    　　到了明治中期，西式料理開始從部分階層的大餐轉為日常飲食，其背景有著將西式料理竭力改良為適合日本人口味的廚師們的努力。銀座煉瓦亭的「炸豬排」等就是其中一例，他們開發出搭配高麗菜絲，與白飯一同享用的形式。

    　　明治中期至後期，廚師們開始設計「日西合併料理」（如今的「洋食」的原型），以代替正統西式料理。此階段的試誤法①與心思造就了大正時代之後誕生的「炸豬排」、「蛋包飯」等「洋食」。

    　　此外，一種名為「一品洋食」（使用洋食店的剩飯或中古西式餐具，在攤販提供「洋食」的型態）的商業模式於明治時代末誕生，使各階層人士也有機會得以品嘗「洋食」。

    ——節錄《西式料理在民間的普及》

    ①試誤法：一般問題的求解，當不易直接獲得正確結論時，往往可以試估一個近似的結果，然後設法修正其誤差'
