- id: doc_113_新北_忠孝_國文_g7s2e1_s4_1
  section: 4
  number: 1
  type: single
  page: 3
  stem: 根據本文內容，下列敘述何者正確？
  options:
  - label: A
    content: 於王莽創立新朝時貢獻己力的劉恭、劉茂，之後受到樊崇重用
  - label: B
    content: 樊崇參考史例，深知必須擁立漢朝宗室才得以號令群雄
  - label: C
    content: 劉盆子登基成為帝是因為機緣巧合，並非出自於政治野心
  - label: D
    content: 赤眉軍大敗劉秀後，劉盆子投降的態度讓自己得免於一死
  group_stem: '劉盆子家族受到王莽篡位建立新朝的影響，原本的世侯爵位被廢黜，成為了普通的百姓。赤眉軍經過式縣時，恰好得知了在此的劉盆子一家。

    　　赤眉軍的首領想，自己畢竟是農民出身，想要從眾多農民起義軍中脫穎而出必然需要一個名正言順的理由，有了劉氏子弟，自然會變得師出有名。於是，便將劉盆子和他的兩個哥哥劉恭、劉茂劫掠到軍營當中。劉恭和劉茂都是自小讀過書的，聰明人懂得看形勢，很快就為自己在赤眉軍謀到了職位，而年少無知的劉盆子看到赤眉軍有一群牛需人照顧，便愉快地放起牛來。

    　　可是，劉盆子的放牛生涯並沒有維持太久，赤眉軍首領樊崇採納方望「擁立漢朝宗室為帝，以號令天下」的建議，決定從劉氏三兄弟中找出一個人來登基稱帝，於是樊崇把選擇權交給老天，並命下屬準備了一個籤筒，做了三支竹籤，一短兩長，等到一切準備就緒，便命劉盆子三兄弟抽籤決定誰來做皇帝。劉盆子一聽要玩遊戲，心裡十分高興，當發現自己抽中了籤贏了遊戲更是樂不可支。於是，在同年六月，抽中籤的劉盆子就這樣高高興興地正式登基成為了皇帝，年號為建世，史稱建世帝。

    　　劉秀打敗赤眉軍時，樊崇帶著劉盆子前來投降，第二天，劉秀將自己的軍隊召集起來列成陣勢給樊崇等人觀看，劉秀問劉盆子，「我的軍隊如此強大，你能夠抗衡嗎？」劉盆子低頭乞求著回答：「我冒犯陛下，罪該萬死，但希望看在同是劉氏子孫的份上，能饒我不死。」劉秀笑起來，命劉盆子居住洛陽，並分了一所住宅，兩頃田地給他。

    ——節錄自江輝〈抽籤來的好運〉'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
