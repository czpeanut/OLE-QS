  stem: 本文的內容暗示了什麼道理？
  options:
  - label: A
    content: 道士多長於法術，敬而遠之以免遭受愚弄
  - label: B
    content: 必須禮遇身懷絕技者，才能適時得到協助
  - label: C
    content: 種瓜得瓜種豆得豆，努力耕耘者才有收穫
  - label: D
    content: 吝嗇又無同情心的人，到頭來將一無所有
  group_stem: '吳時有徐光者，嘗行術於市里。從人乞瓜，其主勿與，便從索瓣①，杖地種之。俄而瓜生蔓延、生花成實，乃取食之，因賜觀者。鬻②者反視所出賣，皆亡耗矣③。——《搜神記·種瓜》

    ①瓣：瓜類的種子

    ②鬻：音ㄩˋ，賣

    ③皆亡耗矣：全不見了'
