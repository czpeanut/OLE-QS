  - label: B
    content: 行大澤草中，眠不能動
  - label: C
    content: 周旋跬步，草皆沾濕
  - label: D
    content: 人即出之，繫之而去
  group_stem: '晉 太和中，廣陵人楊生，養一狗，甚愛憐之，行止與俱。後生飲酒醉，行大澤草中，眠不能動。時方冬月，燎原，風勢極盛。狗乃周章號喚，生醉不覺。前有一坑水，狗便走往水中，還，以身灑生左右草上。如此數次，周旋跬①步，草皆沾濕，火至免焚。生醒，方見之。爾後，生因暗行，墮於空井中，狗呻吟徹曉。有人經過，怪此狗向井號，往視，見生。生曰：「君可出我，當有厚報。」人曰：「以此狗見與，便當相出。」生曰：「此狗曾活我已死，不得相與。餘即無惜。」人曰：「若爾，便不相出。」狗因下頭目井。生知其意，乃語路人云：「以狗相與。」人即出之，繫之而去。卻後五日，狗夜走歸。

    ——東晉 陶潛《搜神後記·卷九》

    ①跬（ㄎㄨㄟˇ）步：半步'
