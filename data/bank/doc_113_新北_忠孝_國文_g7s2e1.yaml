- id: doc_113_新北_忠孝_國文_g7s2e1_s4_3
  section: 4
  number: 3
  type: single
  page: 3
  stem: 根據本文內容，下列何者並非文中所傳達的觀點？
  options:
  - label: A
    content: 人民的基本權利應該受到妥善的保障
  - label: B
    content: 至高無上的王權是不容侵犯的
  - label: C
    content: 家是人們最安全自在的避風港
  - label: D
    content: 法律之前，人人平等
  group_stem: '十八世紀，德國國王威廉一世曾在波茨坦建立了一座行宮。一次，他住進了行宮，登高遠眺波茨坦的全景，但他的視線卻被一座磨坊擋住了，他大為光火。覺得這座磨坊「有礙觀瞻」。於是派人去與磨坊主人協商，打算買下這磨坊，以便拆除。殊不知，磨坊主堅決不賣，理由很簡單：這是我的祖產，不能敗在我手上，無論多少錢都不賣！威廉一世很生氣，派出皇家衛隊，強行將磨坊拆了。

    　　倔強的磨坊主人向法院提出了訴訟。讓人驚訝的是，經過審理後，法院居然判國王敗訴。判決他必須在原地按照原貌重建這座磨坊，並賠償磨坊主的一切損失。國王順從地執行了法院的判決，重建了這座磨坊。

    　　索爾仁尼勤：「生命最長久的人，並不是活得時間最長的人。」數十年後，威廉一世與磨坊主相繼去世。而第二代的磨坊主因經營不善而瀕臨破產。他寫信給當時的國王威廉二世，自願將磨坊出賣他。威廉二世接到這封信後，感慨萬千。他認為磨坊的事攸關國家的司法獨立與審判公正的形象。那是一座具有意義的紀念碑，是德國司法獨立和公正判決的象徵，應當永遠保留。便親筆回信，勸其保留這座磨坊，以傳給後代子孫。並贈給了他6000馬克，以便償還債務。小磨坊主收到回信後，十分感動。決定不再出售這座磨坊，以紀念這段往事。

    　　人最自由、自主、安全和獨立的時候是在被稱為家的房子裡，如果連這棲身之地都不是自己所有的，人到哪裡去尋求確自己的獨立、自主、安全和幸福呢？財政權是其他權利的基礎和保障，也是人類自由和尊嚴的根基。財政權使個人權利具體化，從而在根本上限制了政府對個人權利的侵犯。

    ——改寫自《閱讀人，三個發人省思的歷史故事》'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
