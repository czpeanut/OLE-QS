  group_stem: '( 2 ) (閱讀素養題)

    Poem (I)

    The clothes are cheap, the colors bright,

    They call to us, both day and night.

    But every thread and every seam,

    Hides a cost, beyond our dream.

    The rivers dark, the air unclear,

    The waste of fashion draws us near.

    If we could stop and buy with care,

    The earth would thank us, then and there.       * thread 線索  seam 接縫   beyond
    越過


    Poem (II)

    The ocean waves, so blue and wide,

    A sunny beach where I can hide.

    No noisy cars, no rush, no fear,

    Just peaceful days, with skies so clear.

    I leave my worries far behind,

    And find new joys that ease my mind.

    Each sunset paints the sky with gold,

    A memory I’ll forever hold.              * rush 匆忙'
