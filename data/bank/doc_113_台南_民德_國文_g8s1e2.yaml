  stem: 荷花定律：｢一個荷花池，第一天荷花開放得很少，第二天開放的數量是第一天的兩倍，之後的每一天，荷花都會以前一天兩倍的數量開放。如果到第 30 天，荷花就開滿了整個池塘，那麼請問：在第幾天池塘中的荷花開了一半？答案是第
