  stem: '根據下面的資訊，關於藍腹鷴，何者推論有誤？

    藍腹鷴

    ☆又稱藍鷴、華雞或斯文豪氏鷴，俗稱臺灣山雞。雄鳥軀體幾乎皆為藍色，因而得名。

    ☆為臺灣特有種，是一種大型雉類。

    ☆以植物果實、種子為食，也吃一些無脊椎動物。

    ☆樓息在海拔 2000 公尺以下中低海拔的闊葉林或混生林中。行動謹慎，常常悄然無聲地活動，故不易見到。'
