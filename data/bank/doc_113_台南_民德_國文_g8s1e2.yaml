- id: doc_113_台南_民德_國文_g8s1e2_s3_3
  section: 3
  number: 3
  type: single
  page: 1
  stem: 下文是芊芊為了這次台南設計展所撰寫的新聞稿，身為主編的你，請幫她檢查一下是否有錯字。請挑出用字完全正確的選項
  options:
  - label: A
    content: 2024 台灣設計展移師台南舉辨，活動於 10 月 26 日開募至今累積逾 60 萬人次觀展
  - label: B
    content: 「西門布市」則籍城市美學計畫設計改造入口場域，以布市空間說故事，帶領民眾循著歷史脈絡發現歲月寶臟
  - label: C
    content: 團隊在多元跨域的背景下，認為設計藝術沒有實質專業的界限，期許不拘呢於單一類型的創作路線
  - label: D
