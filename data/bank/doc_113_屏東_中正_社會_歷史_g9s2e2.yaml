- id: doc_113_屏東_中正_社會_歷史_g9s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 二次大戰，削弱了西方列強的殖民統治勢力，動搖帝國主義的殖民體系，同時也使殖民地的人民經歷各式苦難，逐漸增強民族獨立意識，先後獲得獨立。有關這些新興國家的說明，何者有誤？
  options:
  - label: A
    content: 這些國家大都位於亞洲、非洲及拉丁美洲，形成第三勢力
  - label: B
    content: 在國際上為弱勢國家，故多選擇依附美國或蘇聯等強國
  - label: C
    content: 強調反帝國、反殖民主義，彼此團結結盟，被稱為「第三世界」
  - label: D
    content: 雖然大多為新興國家，但也陸續加入聯合國等國際組織，集結力量扮演關鍵性角色。
