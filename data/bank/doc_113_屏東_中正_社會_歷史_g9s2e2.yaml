  stem: 2023年10月7日清晨，巴勒斯坦激進組織哈瑪斯(Hamas)突襲以色列，殺傷軍警民眾，綁架人質，此行動被認為是以色列版的「911事件」建國以來最大災難。而以色列也報復性的密集轟炸加薩走廊，平民也無法倖免，是以巴衝突50年來最血腥的一役，直至今日仍持續衝突中。這些毀滅與死傷，根植於以巴之間多年來對土地與主權的歷史死結。就宗教層面來看，以巴衝突主要是指哪兩種宗教的對抗
