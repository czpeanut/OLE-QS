  page: 1
  stem: 一位德國學者說道：「西元1961年開始建造這堵高牆，高牆取代了原來的鐵絲網，不但隔絕了人民對於自由以及民主的希望，也成為冷戰時期的重要標誌性建築物。」請問：這堵高牆建立與拆除的時代背景，分別為何？
  options:
  - label: A
    content: 古巴危機發生、以色列建國
  - label: B
    content: 韓戰開始、越戰結束
  - label: C
    content: 二戰爆發、蘇聯解體
  - label: D
    content: 柏林危機發生、蘇聯解體。
