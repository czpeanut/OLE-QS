  stem: 第二次世界大戰前，德國的希特勒主要是透過  毀約  、擴軍、組建軍事同盟、 又毀約  併吞鄰國……等手段完成了對發動戰爭的準備……二戰期間更是不顧道義的  再度毀約
    侵犯與希特勒簽訂互不侵犯條約的國家……。請問：下列敘述何者有誤 ?
  options:
  - label: A
    content: 上述被希特勒先後毀棄的三個條約，依序應為凡爾賽條約→慕尼黑協定→德蘇互不侵犯條約
  - label: B
    content: 希特勒廢除凡爾賽條約，並與奧、義組成軸心國
  - label: C
    content: 希特勒又毀約，併吞的鄰國是指捷克
  - label: D
    content: 德蘇簽訂互不侵犯條約雙方約定共同瓜分波蘭，希特勒卻再度毀約攻擊蘇聯。
