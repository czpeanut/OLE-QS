  stem: '立法院於 2023 年 5 月 29 日通過《國民教育法》修正案，明訂中小學應有「學生列席校務會議」(如圖 4)畫線部分所示，並於 112 學年度開始實施。對於《國民教育法》的修訂，應與《兒童權利公約》哪一項原則的精神相通？


