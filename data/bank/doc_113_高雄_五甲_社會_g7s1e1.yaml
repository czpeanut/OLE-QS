    《國民教育法》第 19 條

    學校設校務會議議決下列事項，由校長召集並主持之：

    一、校務發展或校園規劃等重大事項。          二、依法令或本於職權所訂定之各種重要章則。

    三、教務、學生事務、總務及其他校內重要事項。  四、其他依法令應經校務會議議決事項。

    校務會議成員應包括校長、全體專任教師或教師代表、家長會代表及職工代表，並應邀請學生列席會議；採教師代表為組成成員者，任一性別成員人數不得少於成員總數 1/3；其各類成員比例及運作原則，由各該主管機關定之。

