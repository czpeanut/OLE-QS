  group_stem: '帶著一張微笑的臉，面對你的生命，面對別人的生命。

    對著鏡子練習，讓自己看看這是一張多麼令人愉悅的臉。不要鎖起你的眉頭，不要把你的臉陰沉得有如暴風雨即將來臨的天空。

    不要忘記，情緒是最容易感染別人的，任何暴躁的脾氣、乖張的行為、粗魯的言語都是一種「公害」，汙染別人的心田。所以，不要讓你的不快影響別人，不要把你的重擔加添在別人肩頭，人間的苦難已經夠多了。

    盡可能帶著一張笑臉出門，盡可能使你四周的氣氛輕鬆、活潑而愉快，你要知道，分擔的擔子是輕省的，分享的快樂是加倍的。

    有歡笑的地方，就有愛，就有溫暖。

    （節錄自杏林子 行到水窮處）'
