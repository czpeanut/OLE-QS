  section: 3
  number: 31
  type: single
  page: 2
  stem: 從「賽跑著離開了天上的宮廷」這句話中，可以知道小雨點們的心情為何？
  options:
  - label: A
    content: 爭強好勝
  - label: B
    content: 服從命令
  - label: C
    content: 迫不及待
  - label: D
    content: 奮不顧身
  group_stem: '接到了太陽國王的大掃除的命令，

    小雨點們就都坐上飛跑著的烏雲，

    賽跑著離開了天上的宮廷。


    他們給稻田和小河加足了水，

    他們給骯髒的山谷洗過了澡，

    就又來洗淨了清道夫永遠也掃不完的城市，

    也洗淨了悶熱的飛滿了塵土的天空。


    太陽國王為了獎賞他們真能幹，

    就送給他們一條美麗的長彩帶，

    那就是掛在明亮的雨後的天空中的

    紅、橙、黃、綠、青、藍、紫的七彩的虹。

    （楊喚 七彩的虹）'
