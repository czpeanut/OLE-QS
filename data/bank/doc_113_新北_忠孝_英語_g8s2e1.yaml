  group_stem: "Save Lives with Old Shoes: Stories from Africa and Taiwan\nDear Students,\n\
    Today, I want to share with you two important stories about saving lives with\
    \ old shoes. One story is from Africa and the other is from Taiwan. These stories\
    \ show how donating old shoes can make a big difference.\nStory from Africa: In\
    \ Africa, many children do not have shoes. Without shoes, they can get hurt and\
    \ sick. For example, a boy named John lives in a small village. He walked to school\
    \ with no shoes. Sharp rocks cut his feet. Sometimes, those cuts hurt him a lot.\
    \ One day, John got a pair of old shoes from a donation center. Now, he can walk\
    \ to school safely and he is very happy.\nStory from Taiwan: In Taiwan, a girl\
    \ named Mei wanted to help children in Africa. She decided to collect old shoes\
    \ from her classmates and relatives. Mei and her friends worked together to clean\
    \ and pack the shoes. They sent the shoes to Africa. When children got the shoes,\
    \ they were very happy. Mei also felt happy because she could help others.\nWhat\
    \ Can You Do?\n1. Find Old Shoes: Look for shoes you do not wear anymore. Make\
    \ sure they are still in good shape.\n2. Clean Them: Wash the shoes so they are\
    \ clean and ready to use.\n3. Donate: Give the shoes to a donation center. There\
    \ are many organizations that collect shoes and send them to people in need.\n\
    Why It Matters: Donating old shoes is a simple way to make a big difference. You\
    \ can help people stay healthy and go to school. It is a small action that comes\
    \ with a big help. Let’s start today! Together, we can save lives with old shoes.\n\
