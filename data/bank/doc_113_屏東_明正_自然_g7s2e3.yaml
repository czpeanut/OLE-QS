  group_stem: "氣喘是一種慢性疾病，氣喘的成因通常是呼吸道發炎或變窄，病人的氣管平滑肌會呈現肥大及收縮，基底膜增厚、黏膜腫脹及分泌物增加，組織則呈現發炎及損傷現象。\n\
    \    氣喘可能於任何年齡產生，而在孩童期具有過敏病存在者較易在青少年出現氣喘。容易引發氣喘發作的刺激物，包含寵物的毛髮、塵蟎、花粉、黴菌孢子、香菸、油漆及蟑螂等，其中以塵蟎為臺灣氣喘過敏的主要原因，塵蟎是一種八隻腳的小型節肢動物，屬於蛛形綱，體型非常小，約\
    \ 0.3~0.5 毫米，軀幹有紋狀外皮。塵蟎以人畜皮屑和毛髮為主食，有時也吃黴菌，喜歡生長在溫暖潮溼的環境中，適合生長的環境溫度為 22～26℃、溼度為\
    \ 70～80％，通常藏身在地毯、絨毛玩具或寢具中，塵蟎所產生的糞便常會引發氣喘，因此應該儘可能保持居家環境的清潔，以減少氣喘病的發生。"
