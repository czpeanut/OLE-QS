  section: 1
  number: 47
  type: single
  page: 3
  stem: 大王具足蟲在分類上屬於動物界、_________、軟甲綱、等足目、漂水蝨科的生物，上述空格應該填寫什麼最合適？
  options:
  - label: A
    content: 節肢動物門
  - label: B
    content: 環節動物門
  - label: C
    content: 棘皮動物門
  - label: D
    content: 脊索動物門。
  group_stem: "如右圖(六)，大王具足蟲（學名：Bathynomus giganteus）是個具有 7 對關節肢、2 對觸鬚、龐大甲殼和堅硬鱗片的生物，牠與龍蝦、海蟑螂屬於同一個動物門，成年的大王具足蟲體長可達\
    \ 19—37 公分，又稱為「巨深水蝨」。成年母體在生殖期會長出一個育幼袋，蟲卵都被安置在育幼袋中度過孵化期，每顆卵粒直徑將近 1 公分，新鮮卵粒外型就像透明大珍珠。牠們是無脊椎動物裡卵粒最大的動物之一。\n\
    \    大王具足蟲的棲息地，最主要都在極端的深海裡，特別是 500 公尺深以下的大海、黑暗的深處，這種地方的陽光照射亮度，不足地表的百萬分之一，在西太平洋和西大西洋都可以發現牠們的蹤跡。大王具足蟲是一種食腐動物，牠以沈積在海洋底部的碎片為食，包含魚類的屍體碎屑、殘渣、腐植質等，也會吃動物排泄的糞便，偶爾也能抓捕一些海底生物為食。"
