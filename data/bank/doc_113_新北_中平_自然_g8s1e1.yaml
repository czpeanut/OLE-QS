- id: doc_113_新北_中平_自然_g8s1e1_s1_38
  section: 1
  number: 38
  type: single
  page: 4
  stem: 生命吸管（LifeStraw）是由一位瑞士企業家麥克‧韋斯特‧弗蘭德森（Mikkel Vestergaard Frandsen）所發明。此吸管不需供電，即可過濾掉水中約99.99%的病菌與寄生蟲。現今生命吸管常使用在國際救援中，像在印度、肯亞、海地等缺乏乾淨用水的地區，幫助當地人民避免因使用汙水而致病死亡。儘管地表約70%是水，但仍有數億人缺乏乾淨的飲用水，髒水造成人們生病或死亡，吸管式的濾水用品ˇ「生命吸管」因而問世。生命吸管因可去除水中雜質與部分的微生物，獲得「本世紀最佳發明之一」的美稱。生命吸管的使用很簡單且不需要電，只需把吸管底部插入淡水中，由上端直接吸吮即可，故被許多國際組織作為救援工具。不過生命吸管無法將海水轉化為飲用水，因此「水資源」依然是需要我們持續關注的議題。根據本文敘述，生命吸管的原理與下列何者相似？【素養題】
  options:
  - label: A
    content: 漁網的網孔捕抓大魚，放走小魚
  - label: B
