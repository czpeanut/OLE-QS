  stem: 甲、用溫度計攪拌溶液，使其均勻混合；乙、除了試管可直接加熱外，其餘容器應放在陶瓷纖維網上加熱；丙、酒精燈使用完畢，熄滅酒精燈時，必須以燈蓋蓋熄；丁、稀釋濃硫酸時，應將水沿著玻璃棒緩慢滴入濃硫酸中，並加以攪拌；戊、想要辨認藥品氣味時，應該以手搧聞；己、眼睛或皮膚不慎沾到酸或鹼，應先以大量清水沖洗，並立即報告老師；庚、加熱時，試管口應朝向自己，以方便觀察。上述各項實驗操作，正確的有幾項呢？
