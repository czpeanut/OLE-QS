  stem: 「拉瓦爾噴管：是由兩個錐形管構成，其中一個為收縮管，另一個為擴張管，是火箭發動機和航空發動機最常用的構件。拉瓦爾噴管實際上起到了一個"流速增大器"的作用。拉瓦爾噴管是推力室的重要組成部分。噴管的前半部是由大變小向中間收縮至一個窄喉。窄喉之後又由小變大向外擴張至箭底。箭體中的氣體受高壓流入噴嘴的前半部，穿過窄喉後由後半部逸出。這一架構可使氣流的速度因噴截面積的變化而變化，使氣流從亞音速到音速，直至加速至超音速。所以，人們把這種喇叭形噴管叫跨音速噴管。由於它是瑞典人拉瓦爾發明的，因此也稱為"拉瓦爾噴管"。」按照以上說明拉瓦爾噴管的圖形應該是下列何者？
