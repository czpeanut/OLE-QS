  section: 2
  number: 34
  type: single
  page: 4
  stem: 有關這首曲的敘述，何者錯誤？
  options:
  - label: A
    content: 在首曲〈一枝花〉中，作者以濃烈的色彩渲染了「折柳攀花」「眠花臥柳」的風流生活
  - label: B
    content: 「人到中年萬事休，我怎肯虛度了春秋」，表達出作者珍惜時光並甘願為理想獻身的信念
  - label: C
    content: 〈尾〉曲中一開始連續以五個詞語凸顯「銅豌豆」（老狎客）的堅韌不屈、與世抗爭的特性
  - label: D
    content: 由這首曲中可以清楚表現出作者博學恭謹的性格以及功成名就的自豪
  group_stem: "〈一枝花〉\n    攀出牆朵朵花，折臨路枝枝柳。花攀紅蕊嫩，柳折翠條柔，浪子風流。憑着我折柳攀花手，直煞得花殘柳敗休。半生來折柳攀花，一世裏眠花臥柳。\n\
    〈梁州〉\n    我是個普天下郎君領袖，蓋世界浪子班頭。願朱顏不改常依舊，花中消遣，酒內忘憂。分茶攧竹，打馬藏鬮1；通五音六律滑熟，甚閒愁到我心頭？伴的是銀箏女銀臺前理銀箏笑倚銀屏，伴的是玉天仙攜玉手並玉肩同登玉樓，伴的是金釵客歌金縷捧金樽滿泛金甌。你道我老也，暫休。佔排場風月功名首，更玲瓏又剔透。我是個錦陣花營都帥頭，曾玩府遊州。\n\
    〈隔尾〉\n   子弟每是個茅草岡、沙土窩初生的兔羔兒乍向圍場上走，我是個經籠罩、受索網蒼翎毛老野雞蹅踏的陣馬兒熟。經了些窩弓冷箭鑞槍頭，不曾落人後。恰不道人到中年萬事休，我怎肯虛度了春秋。\n\
    〈尾〉\n   我是個蒸不爛煮不熟捶不扁炒不爆響璫璫一粒銅豌豆，恁子弟每誰教你鑽入他鋤不斷碰不下解不開頓不脫慢騰騰千層錦套頭。我玩的是梁園月，飲的是東陽酒，賞的是洛陽花，攀的是章臺柳。我也吟詩，會篆籀；會彈絲，會品竹；我也會唱鷓鴣，舞垂手2；會打圍3、會蹴鞠4；會圍棋，會雙陸5。你便是落了我牙、歪了我口、瘸了我腿，折了我手，天與我這幾般歹症候，尚兀自不肯休。則除是閻王親令喚，神鬼自來勾。三魂歸地府，七魄喪冥幽。那其間才不向煙花路上走！\
    \ ── 關漢卿 〈一枝花 不伏老〉\n1.藏鬮：鬮，音ㄐㄧㄡ。一種遊戲。飲宴時設鬮，拈出時，依其所言而決勝負。 2.垂手：古樂舞。舞者舞而垂其手。 3.打圍：田獵。\n\
    4.蹴鞠：音ㄘㄨˋ ㄐㄩˊ。一種古代踢球遊戲，類似現今的踢足球。 5.雙陸：一種古代的賭博遊戲方式，類似下棋。"
  lesson_raw:
    title: 一枝花 不伏老
    basis: 題目出自關漢卿〈一枝花 不伏老〉
