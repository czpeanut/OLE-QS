  group_stem: "【甲】 追求腦部快速發展反而□□□□？怎樣才能幫孩子「贏在起跑點」？\n加州大學柏克萊分校心理學教授高普尼克（Alison Gopnik）在《華爾街日報》的專欄引述不少研究指出，過早、過快的認知學習，讓孩子的壓力大增，反而使孩子的心智僵化，對孩子的長期發展，並沒有比較好。\n\
    賓州大學心理系助理教授馬凱（Allyson Mackey）的研究也發現，過度填鴨的壓力和童年的逆境經驗，會使得孩子的腦部快速成長，這看似達到心智發展快一點的目標。然而，當腦部漸漸成長、愈來愈「老」時，我們變得更有效率，卻更沒有彈性；更懂得耗用腦力，卻不會自在探索新潛力；想要更快看到效果，卻不願意嘗試新事物。更嚴重的是，如果孩子一直苦於提早學習，對於這些加速心智發展的活動倍感壓力，長期下來會導致憂鬱等問題。在生理上，罹患癌症與心臟病的風險也比較高。\n\
    相反的，如果童年可以慢慢來、自由一點，跟朋友玩樂、無須擔憂的時光久一點，多一點愛與多元的滋養，反而是準備長大成人最好的方法。因為這讓孩子有更多不同的生活刺激與體驗，有餘裕探索、讓身心有更健全的發展，也讓腦部慢慢發展時有更多延伸效益，讓可塑性維持更久，延緩僵化的時刻到來，更開放、有彈性願意學習。馬凱的團隊更發現，如果孩子反覆經歷不愉快的經驗，會帶來最糟的加速發展結果。多元甚至超乎預期的愉\
    \ 快經驗，最可能幫助腦部彈性地、心態開放地學習，而且能夠因應突如其來的挑戰。\n高普尼克提醒，照顧幼兒最重要的是用最簡單的方法。好好愛他們，給他們學習與探索的空間，比精練某一項特定的課程更重要。更長、更慢的童年，或許更好。\
    \ (改寫自 2022 年 1 月 10 日《親子天下》文章)\n【乙】\n    有問之，對曰：「橐駝非能使木壽且孳也，能順木之天，以致其性焉爾。凡植木之性，其本欲舒，其培1\
    \ 欲平2，其土欲故，其築欲密。既然已，勿動勿慮，去不復顧。其蒔3也若子，其置也若棄，則其天者全，而其性得矣。故吾不害其長而已，非有能碩而茂之也；不抑耗4其實而已，非有能蚤5而蕃之也。他植者則不然，根拳6而土易，其培之也，若不過焉，則不及焉。苟有能反是者，則又愛之太殷7，憂之太勤，旦視而暮撫，已去而復顧。甚者爪其膚以驗其生枯，搖其本以觀其疏密，而木之性日以離矣。雖曰愛之，其實害之；雖曰憂之，其實讎8\
    \ 之，故不我若也。吾又何能為哉？」 (節錄自柳宗元〈種樹郭橐駝傳〉)\n【注釋】1.培：培土，在植物根部覆蓋泥土。 2.平：均勻。 3.蒔：種植。 4.抑耗：壓制損傷。\
    \ 5.蚤：通「早」。 6.拳：彎曲。\n        7.殷：殷勤。 8. 讎：通「仇」。"
