  - label: B
    content: 富翁家裡的僕人，有挑水的、煮飯的、切菜的，他們都覺得別人的工作比較輕鬆。有一天富翁不在，他們私自交換工作，結果挑水的切傷手，洗菜的煮出生飯，切菜的把地板弄溼還滑了一跤
  - label: C
    content: 大雄裝好新門，發現門框不正，門鎖沒對準，每次鎖門，都得用力往上提著把手，才鎖得上門，幾個月後只好請木匠打掉重修
  - label: D
    content: 在半粒米大的象牙上居然刻著一座花園，樓亭花木，栩栩如生。只見老師傅拿起微型刻刀，瞇著眼，三下兩下，就刻成了一隻綠豆大的玉兔。走近一看，老師父竟然瞎了一隻眼，人們更覺得不可思議了，問他：「您是怎麼做到的？」他說：「哪怕是最弱的生命，只要用毅力集中可用的部分，就能創造出奇蹟。」
