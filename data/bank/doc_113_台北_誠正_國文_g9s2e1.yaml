  group_stem: "「蘇打綠」的創始團員及主唱—吳青峰，以他獨特的唱腔，及具深度有意涵的曲風在樂壇中大放異彩。兩歲開始翻辭典，並迷戀字的幽微奧祕，他創作的歌曲意境濃厚，曾選為國中的國文教材。\n\
    \    吳青峰曾經說過「傷口是創作的養分」。小時候這首歌便是修復他與父親傷口的代表作。歌詞中的「長大後我們的存在像塵埃，我們的距離被拉開。有時相處很難，想很多，話很短」道盡了父子間的隔閡與距離；「這時候我們的心變得柔軟，放下了父子的身段，知道時間太晚，不要躲，不要散」說明了父子在感受生死離散間的珍貴親情；「當我仔細回想，腦海最珍貴的一幅畫，是你載著我，叮嚀我，要我抓牢你身旁，安心在你背後飛翔」記錄了小時候與父親相處的美好記憶。吳青峰用歌詞寫下他對父親的孺慕之情，期盼自己能得到父親的肯定與支持，更表達了孝親的急迫性。\n\
    \    隨著吳青峰一字字地唱，彷彿也苦行了一步步人生，他透過歌曲正視傷口，接受自己，然後放下過去。有人說，吳青峰的詞，填補了內心的黑洞；有人說，聽著他的歌，好像能從過去的傷痛走出來了；也有人說，他的音樂就像橋梁一樣，能替你把情感傳達出去。蘇打綠音樂的療癒力量並非單向，而是雙向的反饋。\
    \ （張儷禎 蘇打綠歌曲魅力）"
