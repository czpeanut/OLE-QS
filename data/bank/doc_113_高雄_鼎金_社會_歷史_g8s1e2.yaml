  stem: 利瑪竇已經逝世四百多年，但許多地方仍會舉辦紀念利瑪竇的儀式和活動，甚至也有發行他的紀念郵票，國家圖書館還成立「利瑪竇太平洋研究室」。請問：利瑪竇令人如此景仰的原因，應該為下列何者？
