  stem: 紐特很喜歡看韓國的古裝劇，意外發現朝鮮王朝時的讀書人都會上私塾，向老師學習儒學、作詩。雖然紐特聽不懂韓語，但他們寫的書法都是紐特看得懂的漢字。請問：這樣的現象與下列何者最為相關？
  options:
  - label: A
    content: 隋唐時期，東亞地區與中國交往密切，形成東亞文化圈
  - label: B
    content: 因應全球化，韓國欲將本土文化推廣至人口最多的漢字族群，所以更改劇中文字
  - label: C
    content: 在西漢武帝全盛時期，統治疆域擴及整個朝鮮半島
  - label: D
    content: 為與西域貿易，朝鮮王朝多次派遣使者至中國學習佛法。
