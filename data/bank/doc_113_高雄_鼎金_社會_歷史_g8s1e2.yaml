- id: doc_113_高雄_鼎金_社會_歷史_g8s1e2_s1_21
  section: 1
  number: 21
  type: single
  page: 1
  stem: 北方草原民族在管理中國政權的時候，並非都是單面向的融於漢人文化，相反的，一方面保留漢人文化來統治漢人，另一方面也維持原本草原民族的文化體制，不只在自己民族上繼續沿用，有時也會強迫漢人學習效法。例如：利用科舉制度來統治漢人，學習漢語，但不會放棄自己的語言。下列哪一個朝代符合文中所說的概念？
  options:
  - label: A
    content: 漢
  - label: B
    content: 唐
  - label: C
    content: 宋
  - label: D
    content: 元。
