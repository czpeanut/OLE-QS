  stem: 史書有載：四夷君長進入長安城拜會唐太宗，欲尊唐太宗為天可汗，唐太宗問道：「我為大唐天子，又下行可汗事乎？」群臣和四夷君長高呼萬歲，望唐太宗接受。自此以後，唐太宗發往各族的文書中，皆印有「天可汗」的印璽。下列關於上述記載的敘述，何者正確？
  options:
  - label: A
    content: 四夷君長所指為海外各國的領袖
