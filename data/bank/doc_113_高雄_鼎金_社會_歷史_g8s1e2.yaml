  section: 1
  number: 22
  type: single
  page: 1
  stem: 在〈泌園春〉一詞中，對於成吉思汗有如下的描述：「江山如此多嬌，引無數英雄競折腰。惜秦皇漢武，略輸文采；唐宗宋祖，稍遜風騷。一代天驕，成吉思汗，只識彎弓射大鵰。俱往矣，數風流人物，還看今朝。」關於歷史上的成吉思汗，下列敘述何者正確？
  options:
  - label: A
    content: 曾經發動三次西征
  - label: B
    content: 曾消滅金國與南宋政權
  - label: C
    content: 建立橫跨歐、亞、非的大帝國
  - label: D
    content: 統一蒙古各個部落。
