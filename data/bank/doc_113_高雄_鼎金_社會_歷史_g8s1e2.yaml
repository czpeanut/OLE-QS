  section: 1
  number: 25
  type: single
  page: 1
  stem: 英國科學家培根在《新工具》一書裡指出：「印刷術、火藥、指南針這三種發明已經把全世界事物的面貌和情況都改變了，第一種是在學術方面，第二種是在戰事方面，第三種是在航行方面，並由此又引起難以數計的變化，任何教派、任何帝國、任何星辰對人類事務的影響，都無法超過這些機械性的發現。」培根提到的三種發明，是在哪個時代發展逐漸成熟並投入到實用？
  options:
  - label: A
    content: 唐
  - label: B
    content: 宋
  - label: C
    content: 元
  - label: D
    content: 明。
