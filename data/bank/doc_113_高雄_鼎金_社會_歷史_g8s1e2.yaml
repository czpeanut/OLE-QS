  stem: 番薯(地瓜)，原生長於熱帶中美洲，最先由印第安人種植成功，抗病蟲害力強，對土壤品質要求較低，栽培容易。新航路開通後傳入中國，緩和了因人口增加造成的糧食不足問題，請問：番薯傳入中國是在哪一朝代？
