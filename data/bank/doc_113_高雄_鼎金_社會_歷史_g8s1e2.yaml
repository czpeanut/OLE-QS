  section: 1
  number: 23
  type: single
  page: 1
  stem: 蒙古統治時期，漢人已不再是帝國內壓倒性的多數，對於政治的影響力降低，取而代之的是蒙古族與其他各民族。請問：關於當時的色目人，下列敘述何者正確？
  options:
  - label: A
    content: 多擔任軍人、武官職務
  - label: B
    content: 地位為四個階層中最低
  - label: C
    content: 入籍中國後須完全放棄自身文化
  - label: D
    content: 當時的西域各民族被劃分為此階級。
