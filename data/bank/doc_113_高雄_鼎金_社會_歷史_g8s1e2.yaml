  stem: 「坊市制度」是一種基於《周禮》的城市布局，唐代以前的城市多屬軍事要衝或地方政治中心，為了治安和軍隊的需要，城中住宅區以「坊」的短牆區隔，管理人員及物資的進出。城市中的貿易，僅能在白天於「市」進行。請問何時此一制度被取消？
