  section: 1
  number: 24
  type: single
  page: 1
  stem: 阿德與阿才是元朝人，阿德居住在江南一帶，而阿才居住在大都。某年兩人一齊參加進士科考試，阿德考的是左榜，題目較難、錄取率較低；阿才考的是右榜，題目較易、錄取率較高。請問：阿才最不可能屬於哪一族群的人？
