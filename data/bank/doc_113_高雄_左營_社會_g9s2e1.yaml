    content: 著作權、商標權
  - label: D
    content: 專利權、商標權
  group_stem: "【新聞一】右圖為漫畫家遠藤達哉創作的漫畫《SPY×FAMILY 間諜家家酒》中的角色安妮雅，但 9 張圖片中只有一張是遠藤達哉親自繪製的，其他全部都是在專門分享AI\
    \ 生成圖片的社群平台，以「安妮雅」為題的AI 創作圖片。為了調查AI 生成圖片是否侵犯了日本動漫的權利，日本媒體《日經新聞》分別在Civitai、PixAI.Art\
    \ 等AI 生成網站，搜尋了包括《寶可夢》、《航海王》、《鬼滅之刃》等熱門動漫作品，發現 9 萬張圖片中約有2500張與原作動漫非常相似的圖片。媒體繼續分析，發現九成的圖片幾乎都直接使用了動漫主角的名字作為指令，有些則是會加入動漫作品的名字，代表使用者是有意識使用AI\
    \ 生成跟原作相似的圖片。律師表示，「如果角色名稱出現在提示語中，很容易被認定為侵犯【甲】權。」\n  除了上述這些紅遍全球、家喻戶曉的作品之外，近幾年竄紅的動漫作品，從《鬼滅之刃》、《咒術迴戰》再到《鏈鋸人》，都成為被餵養生成式AI\
    \ 的素材。這些AI 生成圖的風格多變，許多AI「使用者」會將角色置於自己喜愛的背景，並改變角色的面部表情和姿勢。其中，又以越來越多的使用者，刻意使用AI\
    \ 生成圖，凸顯出女性動漫角色的胸部特徵，或是生成出遊走在情色邊緣的圖片。\n【新聞二】台灣首間寶可夢中心於台北盛大開幕，讓想買寶可夢周邊商品的台灣民眾不用再飛到日本。關於限定台灣販售的寶可夢商品中，皮卡丘圖樣的杯套是不少民眾會購買的商品，但因以普遍市場上杯套的價格而言，寶可夢中心販售的杯套價格偏高，故有些民眾會選擇購入正版布料來自己製作杯套，或是到坊間購買相似成品，但警方提醒，自己購入正版布料並未違法，但若是在坊間將自己製作、有卡通品牌圖案的杯套進行販售時，會違反【乙】權的相關法律。"
