  section: 6
  number: 49
  type: single
  page: 7
  stem: SHEIN 的發展，就全球化的面向探討，和下列何者相同?
  options:
  - label: A
    content: 台鐵公司推廣「2025 新北市平溪天燈節」，開發活動聯名的「許願便當」，結合元宵節應景食材與在地特色，為民眾帶來一場味蕾饗宴
  - label: B
    content: 從東京和紐約的歷史修復飯店到沖繩小島 Villa，台北迎來嘉佩樂酒店品牌插旗，館內規劃以「當代藝術雅居」為靈感，邀賓客沉浸在專屬的世外桃源
  - label: C
    content: 日本漫畫與動畫產值年年上升，2023 年10 月英國倫敦動漫展(MCM)，可以看到外國人們打扮成《薩爾達傳說》、《美少女戰士》中熱門角色
  - label: D
    content: 為了協調解決全球糧食分配運用問題，四十五個國家通過組織章程，設立聯合國糧食及農業組織
  group_stem: "創立於2012 年的SHEIN 是全球當前最大的服飾電商之一，儘管販售的商品價格非常低廉，卻能靠著快速翻新的大量產品緊緊抓住年輕消費者的口味，2023\
    \ 年全球營收超過300 億美元。事實上，數位技術力才是SHEIN的崛起關鍵。SHEIN 將快時尚的「快」發揮極致，深知消費者喜歡創新設計的重點不在創意而在於「新」，SHEIN每天新增高達2,000\
    \ 至6,000 件服飾新品，但為節省成本，SHEIN 讓多達5000 多家的中國供應商削價競爭，這些成衣工廠必須祭出最優惠的方案，才能搶下SHEIN 的製造訂單。低廉的收益迫使他們使用高風險化學物質，包含製造衣服使用甲醛超標的染料、不符規範的軟化劑等等，對河川自然生態造成極大負擔，而劣質的商品也導致汰換率升高，使得接收這些廢棄布料的開發中國家面臨另一個垃圾掩埋問題。此外，由於SHEIN\
    \ 的出產量極高，中國工廠的工人都得靠長時間輪班及加班趕工製作衣服。\n    Z 世代對SHEIN 特別買單，不只因為其超低價格能滿足年輕人的荷包，讓他們能以驚人速度更新全身行頭；也因為Z\
    \ 世代最注重塑造自我特色， 2023 年5 月，SHEIN 的App 下載量在美國Android 與iOS 榜上都是購物類第一名，也佔據超過50 個國家的iOS\
    \ 榜下載量第一名。"
