- id: doc_113_高雄_左營_社會_g9s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 苗栗大湖有「草莓王國」美稱。大湖在漢人入墾前，東部山區為泰雅族汶水群、大湖群聚居之地。關於大湖地名的由來，咸豐六年（西元1856 年），吳立傳至觀音山狩獵，站在高崗遠眺四面山嶺環繞，山谷間雲霧飄渺，茅草、蘆葦隨風搖曳如湖面波狀，故命名為「大湖」而沿用迄今。請問:根據以上敘述，「大湖」的等高線型態最接近下列何者？
