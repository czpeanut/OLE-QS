  group_stem: '由於氣候變遷、經濟成長、貧富差距等難題如重兵壓境，2015 年，聯合國宣布了「2030 永續發展目標」（Sustainable Development
    Goals, SDGs）。當時，有193 個國家同意在2030 年前，努力達成 SDGs 17 項目標。聯合國2024 年最新SDGs 進展報告指出，截至2023
