- id: doc_113_屏東_明正_自然_g7s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: '(二) 生物技術之探索：出自2-5 課本 p.55~59 請回答下列9~14 題：

    根據上文，黃金米應屬於哪一類作物？'
  options:
  - label: A
    content: 物種變異後經人為選擇的產物
  - label: B
    content: 物種變異後經大自然選擇的產物
  - label: C
    content: 自然突變後的產物
  - label: D
    content: 生物技術下的產物
  group_stem: '請閱讀下列敘述後，回答9~10題

    基因轉殖技術，可將甲生物的特定基因轉殖至乙生物體內，使乙生物也能表現出該轉殖基因的功能。在農業方面，科學家已成功地將合成胡蘿蔔素的三個基因（一個來自細菌，兩個來自黃水仙花）轉殖至水稻的基因體中。這種水稻的米粒富含胡蘿蔔素，稱為「黃金米」。

    在農業方面，基改作物能夠降低農藥和肥料的使用，因而能夠減少對環境的汙染。此外，基改作物也可提高作物的生產力，因此能夠降低土地的開墾面積，也可以減少對棲地的破壞。但是可能的疑慮是基改作物與非基改作物進行雜交後，可能演變成優勢種，將可能改變原有的生態環境，降低生物多樣性、產生抗性等，因此要深思。'
  tags:
    chapter:
      publisher: 南一
      book: 七下
      subject: 生物
      code: 2-5
      title: 生物技術
      chapter: 第2章 遺傳
    textbook: 七下生物 2-5 生物技術
    labeled_by: ai
