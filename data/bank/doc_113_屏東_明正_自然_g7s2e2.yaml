  - label: B
    content: 藉由孢子散播
  - label: C
    content: 藉由風傳播黑色種子
  - label: D
    content: 黑色的毬果可以結出種子
  group_stem: '請閱讀下列敘述後，回答41~42 題

    總鋪師主廚經常料理松露，松露是一種美食，烹飪時會將松露刨成薄片灑在料理上，利用食物的熱度使松露更加散發迷人的香氣。松露和鵝肝、魚子醬被稱為「世界三大珍饌」，法國美食家曾盛讚松露是美食界的鑽石。到底松露是什麼，為什麼能擁有如此高的評價呢？

    松露的英文名是Truffle，是一種蕈類，分類上屬於子囊菌門、西洋松露科、西洋松露屬，松露會在樹木的根部生長出菌絲，而樹木也可透過松露的菌根獲得水分和養分，松露一般是生長在松樹、櫟樹、橡樹下。松露會利用香氣擴散吸引動物取食，幫助傳播與生殖，因為不易以人工栽培，所以十分稀少。'
