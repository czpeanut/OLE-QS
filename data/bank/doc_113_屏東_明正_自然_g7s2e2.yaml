  group_stem: '請閱讀下列敘述後，回答4~5題

    哈士奇犬、柯基犬等，犬的品系很多，但其外觀多數是由人類培育出來的。大約在19 世紀，養育純種狗為一種顯示身分地位的象徵，人類為了追求品系完美獨特的外表，利用近親繁殖的方式培育出各種符合人類審美標準的純種狗，然而研究發現約63%的純種狗有遺傳病。例如臘腸狗的短腿屬於一種遺傳的侏儒症，學術上稱為「軟骨發育不全症」，此外，脊椎較長，脊椎骨及腰骨也較易磨損。'
