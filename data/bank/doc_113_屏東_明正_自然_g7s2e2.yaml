  stem: '(一) 突變、遺傳病和遺傳諮詢之探索：出自2-4 課本p.52~54 請回答下列1~8 題：

    根據研究發現，軟骨發育不全症是因體染色體中FGFR3 基因發生突變所造成，患者具有身材矮小、四肢短小變形等特徵，若是親代只有其中一方為患者，子代就會有50%以上的罹病率。已知凱生因突變而患有軟骨發育不全症，但其父母皆未患病，若是以F
    代表突變的FGFR3 遺傳因子，f 代表正常的FGFR3 遺傳因子，則關於凱生父母基因型的推論，下列何者最合理？'
  options:
  - label: A
    content: 父：FF、母：FF
  - label: B
    content: 父：Ff、母：ff
  - label: C
    content: 父：Ff、母：Ff
  - label: D
    content: 父：ff、母：ff
