- id: doc_113_台中_居仁_自然_g8s2e1_s1_30
  section: 1
  number: 30
  type: single
  page: 3
  stem: "鎂離子為海水中含量第二多的金屬離子，從海水中提取鎂離子為工業上製造鎂的方法之一。其步驟如下：\n步驟一：在濃縮的海水中加入氫氧化鈉，會產生氫氧化鎂而沉澱析出。\n\
    \  $\\text{Mg}^{2+} + 2\\ \\text{NaOH} \\rightarrow 2\\ \\text{Na}^{+} + \\text{Mg}(\\\
    text{OH})_{2}$\n步驟二：之後再加入鹽酸，經處理後可得到固態的氯化鎂。\n  $\\text{Mg}(\\text{OH})_{2} + 2\\\
    \ \\text{HCl} \\rightarrow \\text{MgCl}_{2} + 2\\ \\text{H}_{2}\\text{O}$\n步驟三：電解熔融狀態的氯化鎂即可得到鎂。\n\
    \  $\\text{MgCl}_{2} \\rightarrow \\text{Mg} + \\text{Cl}_{2}$\n依據上述方法，在某次製鎂的反應後，共產生鎂\
    \ 720 公克，則該次製鎂反應中，理論上會消耗重量百分濃度為 30% 的鹽酸共多少公克？\n(鎂的原子量為 24，氯化氫的分子量為 36.5)"
  options:
  - label: A
    content: '1825'
  - label: B
    content: '2190'
  - label: C
    content: '3650'
  - label: D
    content: '7300'
- id: doc_113_台中_居仁_自然_g8s2e1_s1_31
  section: 1
  number: 31
  type: single
  page: 3
  stem: 關於豆芽菜的購買和食用有哪些觀念是不妥的?
  options:
  - label: A
    content: 豆芽菜不可用低亞硫酸鈉作為食品添加劑
  - label: B
    content: 購買豆芽菜要選擇外觀越白的越好吃
  - label: C
    content: 食用前多用清水浸泡和換水，有助於除去殘餘的食品添加劑
  - label: D
    content: 不肖商人會添加非法添加劑使豆芽菜不易腐敗
  group_stem: "題組題：請閱讀下列文章後，回答第31、32 題。\n    低亞硫酸鈉(Sodium Hydrosulfite)分子式為Na2S2O4，俗稱保險粉，外觀為白色砂狀結晶物，屬亞硫酸鹽類之物質，為食品加工上使用已久的合法添加物。依據「食品添加物使用範圍及限量暨規格標準」規定，低亞硫酸鈉屬於食品添加物中的第三類抗氧化劑及第四類漂白劑，抗氧化劑為減低或延緩食品氧化方法之一，主要用於金針乾、白葡萄乾、杏乾等脫水食品上，不得用於生鮮蔬果與芽菜類等，違法使用者可依法處行政罰鍰。近年常被不肖業者添加於豆芽菜中浸泡，因能阻止葡萄糖-甘胺酸形成氧化而褐變，達到漂白效果，並使豆芽菜不易腐敗，賣相與儲存時間皆提高。\n\
    \    彰化縣衛生局提醒民眾於選購豆芽菜時，應注意外觀色澤要自然，避免購買外觀過白，且聞起來有異味的豆芽菜；若仍不放心，建議烹調前用清水浸泡，且多次換水，烹煮時將鍋蓋打開，幫助殘餘物質揮發，以維護食用安全。\n\
    \    參考資料：衛生福利部食品藥物管理署-食藥闢謠專區"
