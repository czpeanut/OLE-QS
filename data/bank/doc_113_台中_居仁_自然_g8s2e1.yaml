- id: doc_113_台中_居仁_自然_g8s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 小馨觀察下列化學反應，並記錄其所伴隨的現象，哪一個是正確的？
  options:
  - label: A
    content: 藍色蝶豆花水溶液加食醋後，顏色由紫轉藍
  - label: B
    content: 加熱小蘇打粉，產生白煙
  - label: C
    content: 二氧化碳通入澄清石灰水，水溶液變混濁
  - label: D
    content: 打開暖暖包，鐵粉變成白色
- id: doc_113_台中_居仁_自然_g8s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列現象產生的原因，何者不是因為與空氣內的物質發生化學反應所造成？
  options:
