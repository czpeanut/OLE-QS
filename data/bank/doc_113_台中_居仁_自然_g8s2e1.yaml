- id: doc_113_台中_居仁_自然_g8s2e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 有關鎂、鋅、銅三種金屬燃燒情形與氧化物溶於水的狀況，何者正確?
  options:
  - label: A
    content: 鎂燃燒時產生強烈黃光，氧化物為白色
