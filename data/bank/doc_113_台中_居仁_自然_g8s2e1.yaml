- id: doc_113_台中_居仁_自然_g8s2e1_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 某篇關於氫應用的報導說明如下：「金屬多以氧化物的形式封藏於岩石礦物中，可利用氫和氧易起反應的特性，將氧從礦物中移除，留下可用的純金屬和水。」關於上述畫線處提及的反應，下列說明何者最合理？（鐵對氧的活性大於氫對氧的活性）
  options:
  - label: A
    content: 因為氫被氧化，所以是氧化還原反應
  - label: B
    content: 因為礦物被氧化，所以是氧化還原反應
  - label: C
    content: 此方式是利用金屬對氧活性比氫大做反應
  - label: D
    content: 此方法可以將鐵礦變成鐵金屬
- id: doc_113_台中_居仁_自然_g8s2e1_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: 砒霜是一種毒物，主成分為三氧化二砷（$\text{As}_{2}\text{O}_{3}$）。古代製作砒霜的技術較不成熟，砒霜中會含有少量的不純物質—硫或硫化物，硫或硫化物接觸到銀，會使銀氧化產生黑色的硫化銀（$\text{Ag}_{2}\text{S}$），這就是古裝劇中常見的以銀針試毒，銀針變黑即表示有毒。依據上述，下列推論何者最合理？
  options:
  - label: A
    content: 硫化物發生還原反應而使銀針變黑
  - label: B
    content: 銀針變黑，是因為三氧化二砷被還原的結果
  - label: C
    content: 砒霜的純度愈高，與銀針反應變黑的結果愈明顯
  - label: D
    content: 將銀針改成活性較小的金屬如黃金，也會反應產生硫化物
- id: doc_113_台中_居仁_自然_g8s2e1_s1_24
  section: 1
  number: 24
  type: single
  page: 2
  stem: '柴油引擎排放的廢氣含有較多的氮氧化物（$\text{NO}_{X}$），若能加入氨氣與柴油引擎產生的氮氧化物反應，則可減少排放廢氣造成的空氣汙染。氨氣與氮氧化物的反應中，速率最快的反應為：

    $\text{NO} + \text{NO}_{2} + 2\text{NH}_{3} \rightarrow 2\text{N}_{2} + 3\text{H}_{2}\text{O}$

    已知柴油引擎排放的廢氣中，$\text{NO}$ 所占比例約為 $\text{NO}_{2}$ 的 9 倍。若欲藉由上述反應消耗大部分的氮氧化物，需使用觸媒轉化器調整反應前氮氧化物的比例，下列何種觸媒轉化器的設計最合理？'
  options:
  - label: A
    content: 將 $\text{NO}_{2}$ 氧化成 $\text{NO}$ ，以提高 $\text{NO}$ 的比例
  - label: B
