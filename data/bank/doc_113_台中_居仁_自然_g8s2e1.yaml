  section: 1
  number: 12
  type: single
  page: 1
  stem: 把點燃的鎂帶放進二氧化碳的集氣瓶中，發現鎂帶繼續燃燒，但反應後瓶上有黑色斑點附著，試問下列敘述何者錯誤？
