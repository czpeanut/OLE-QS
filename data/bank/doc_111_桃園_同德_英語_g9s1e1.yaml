  group_stem: 'Colors are often used to describe emotions. For example, if you “feel
    blue,” it means that you’re sad. A person who “sees red” is angry, and someone
    who’s “tickled pink” is happy about something. Besides expressing feelings, colors
    may also influence our actions.

    In Japan, officials have put in blue lights around railroad platforms to discourage
    people from jumping in front of trains. As a result, certain stations with blue
    lights have seen an 84 percent drop in suicide numbers.

    Pink has been believed to prevent violence. In the United States, jail cells were
    painted this color to calm prisoners. In sports, some visiting teams have had
    to use all-pink locker rooms, which were mean to weaken the teams and make them
    lose.

    Unlike pink, red may let you gain an upper hand in sports. Red is also believed
    to be the color of energy and power.

    The ways in which colors affect us may be a result of nature and evolution. Red
    is the color of fire and blood, so it is connected to life, appetite, and danger.
    Yellow describes sunny days and can make us feel energetic and happy, while blue
    relaxes us with image of the sea and sky.

    Colors are seen in all parts of life, and they can affect us in ways that we may
    not notice.

