- id: doc_111_桃園_同德_英語_g9s1e1_s4_40
  section: 4
  number: 40
  type: single
  page: 4
  stem: Which is true?
  options:
  - label: A
    content: Leonardo da Vinci’s smile was warm.
  - label: B
    content: The woman in the Isleworth Mona Lisa and the woman in Mona Lisa are twin
      sisters.
  - label: C
    content: The Isleworth Mona Lisa is older than Mona Lisa in the Louvre Museum
      in Paris.
  - label: D
    content: Leonardo da Vinci had a twin.
  group_stem: 'Leonardo da Vinci’s Mona Lisa is the most famous painting in the world.
    Almost everyone has seen a photo of it or even seen it in person in the Louvre
    Museum in Paris. But did you know it has a twin?

    Not all art lovers know that Leonardo painted two versions of the Mona Lisa. The
    first painting, known as the Isleworth Mona Lisa, was created some years earlier
    than the version shown today in the Louvre in Paris.

    The woman in the first painting is younger. She sat at a three-quarter angle from
    the artist, with her head tilted forward and her hands crossed. When Leonardo
    painted Lisa, he captured her spirit and personality. It is easy to see the warmth
    in her smile.

    The Isleworth Mona Lisa is likely 10 years earlier than the Mona Lisa we know
    so well. Maybe the two paintings of Lisa were an early example of the 10-year
    challenge.'
  shared_asset: g4_40_42
  tags:
    textbook: 第五冊（九上）第1次段考範圍
    labeled_by: ai
