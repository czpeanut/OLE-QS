    week, so I’ve been busy studying.

    Paul: Oh, can’t you just upload the whole pictures? It would only take a few minutes.
    I want to share some pictures of the waterfall with my parents.

    Kelly: What?! No way! I have to look through them first. That way I can choose
    the ones I look good in.

    Paul: Uh, but it was a hike. Climbing up the mountains was so hard. We all looked
    terrible by the end.

