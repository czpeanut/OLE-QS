- id: doc_113_高雄_陽明_國文_g8s2e3_s3_37
  section: 3
  number: 37
  type: single
  page: 7
  stem: 根據以上兩筆資料，可知人們面對AI 時應保有怎樣的態度？
  options:
  - label: A
    content: 人們應努力提升自身各項能力，以確保永不被AI 超越
  - label: B
    content: 人們應努力開發更多新型AI，以提升社會進步的速度
  - label: C
    content: 人們應盡可能運用AI 來創造財富，提升個人生活品質
  - label: D
    content: 人們藉助AI 提升工作效益的同時，也須不斷精進自我。
  group_stem: "請閱讀以下文章,並回答37~39 題\n科技新思維\n一、人們會因「生成式AI」而變得更強大，或直接被取代？\n          \
    \                                李佳樺\n  面對AI 在職場掀起的驚濤巨浪，我們該如何建立正確心態站上浪尖呢？職場上大致可見以下三種面對AI\
    \ 的不同族群：\n(一)抗拒族\n  這群人害怕使用AI，更擔心被取代。要破除這種焦慮，就要以「工作技能」為單位來分析工作性質，先了解自己的工作性質為何，並歸納工作與AI\
    \ 的互動關係，而非困在「AI 將取代人類」的單一思維陷阱中，方可轉出職涯新方向。\n(二)猶豫族\n  這群人了解如何運用AI 提升生產力，但擔心沒有獲得相應的報酬，或被變相增加工作量，而猶豫是否要在工作中增加使用AI\
    \ 的頻率。不過，與其計較付出所得的回報，更應該思考創新帶來的無形價值。因為錢潮還是往創造「別人做不到」的方向流，當中蘊藏著新的高報酬機會點，與其觀望，不如成為先行者。\n\
    (三)上手族\n  這群人對AI 協作已經駕輕就熟，工作時間大幅下降。然而人們若滿足於現狀，認為既然AI 能讓自己在三天內就能完成一週的工作量，那麼另外兩天是否就不用工作了呢？專家提醒，如果抱持這樣的心態，那麼按照AI\
    \ 發展的速度，很快就可能會讓你連工作一天的機會都沒有。因此，懂得與AI 協作不代表不會被淘汰，唯一的生存之道是不斷強化自己，追求更高層次的技能。\n\n\
    二、工作技能與生成式AI 的互動關係\n  工作技能與生成式AI 的互動關係可分為以下三種：\n(一)被AI 增強：指AI 能取代工作中繁瑣、重複但耗時的低價值工作，讓人專注於較難被取代的高價值任務。\n\
    (二)被AI 顛覆：指工作中大部分的技能都會被取代，因此需要以更新穎的創意、更高階的技能重組來因應。\n(三)與AI 隔絕：指工作技能屬於AI 無法做到的，具專精與不可取代性，如部分藍領階級的工作，或需要與人互動、處理情緒的工作。\n\
    \n                             （改寫自「Cheers 快樂工作人」網站）"
