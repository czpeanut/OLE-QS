- id: doc_113_高雄_陽明_國文_g8s2e3_s2_25
  section: 2
  number: 25
  type: single
  page: 4
  stem: "「門人問日：『古之文章，足以觀人；今之文章，不足以觀人者。何也？』予曰:『古人文章無一定格例，各就其造詣所至，意所欲言者，發抒而出。故其文純雜瑕瑜，犁然①並見。至於後世，則古人能事已備，有格可肖，有法可學。忠孝仁義有其文，智能勇功有其文。孰者雄古，孰者卑弱。父兄所教，師友所傳，莫不取其尤工而最篤者，日夕揣摩，以取名於時。是以大奸能為大忠之文，至拙能襲至巧之論。』」\n\
    \ (註釋:①犁然:明確的樣子)\n\n 根據本文，下列何者最可能是作者認為今之文章「不足以觀人」的原因？"
  options:
  - label: A
    content: 仿效前人，作品未能展現個人特質
  - label: B
    content: 另闢蹊徑，不願取法古人優秀作品
  - label: C
    content: 過度強調技巧，內容違背聖賢之道
  - label: D
    content: 作品結構紊亂，難以表現文學美感
