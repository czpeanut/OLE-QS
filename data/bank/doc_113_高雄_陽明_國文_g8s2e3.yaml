    content: 《世說新語》增加里人相慶、周處聞知情節，以突出周處悔悟自新的轉折
  - label: D
    content: 《世說新語》渲染周處殺虎以見其兇彊，呈現與志怪相異的志人特質。
  group_stem: "請閱讀以下文章,並回答41~42 題\n(一)\n    周處生時或死後沒有多久，便有關於他的軼聞流傳。如孔約《志怪》云：「義興有邪足虎，溪渚長橋有蒼蛟，並大啖人，並周處也，時謂郡中三害。」又如祖台之《志怪》所述：「義興郡溪渚長橋下有蒼蛟吞啖人，周處執劍橋側伺。久之，遇出，於是懸自橋上投下蛟背而刺蛟，數創，流血滿溪。」兩書均成於東晉時期，時間相近。《世說新語》則結合「三害」與「斬蛟」，並增加「殺虎」情節，使傳說更為完整:\n\
    \    「周處年少時，兇彊俠氣，為鄉里所患。又義興水中有蛟，山中有白額虎，義興人謂為『三橫』，而處尤劇。或說處殺虎斬蛟，實冀三橫唯餘其一。處刺殺虎，又入水擊蛟。蛟或浮或沒，行數十里，處與之俱。經三日三夜，鄉里皆謂已死，更相慶。竟殺蛟而出，聞里人相慶，始知為人情所患，有自改意……處遂改勵，終為忠臣孝子。」\n\
    \                                 (改寫自羅景文〈周處傳說探究〉)\n(二) \n 迷因（meme）是文化傳遞的微型單位，經由模仿、複製、改作，承載片段資訊或觀點，透過語文、圖片或影音等型態流傳，帶來影響。「周處除三害」即屬迷因。下列為電影《周處除三害》簡介:\n\
    \n電影《周處除三害》簡介\n亡命天涯的槍擊犯陳桂林，誤信醫師的診斷，以為自己身罹絕症。在醫師勸說自首後，因為不希望自己死後被別人遺忘，決定以惡制惡，追殺排名在他之前的二大通緝要犯。最後投案自首，接受槍決伏法。陳桂林自以為是現代周處，卻沒想到困住他，讓他逃無可逃的，從來都不是外在環境，而是內心的貪、嗔、痴。"
