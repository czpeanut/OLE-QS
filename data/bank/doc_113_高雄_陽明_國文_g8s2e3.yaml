- id: doc_113_高雄_陽明_國文_g8s2e3_s3_31
  section: 3
  number: 31
  type: single
  page: 6
  stem: 請問依照許榮哲的靶心人公式來分析「項鍊」一文，以下的分析何者有誤？
  options:
  - label: A
    content: 出身微寒的瑪蒂達，其目標在於得到旁人欣羨的目光，滿足其虛榮感
  - label: B
    content: 向珍娜借的鑽石項鍊，是瑪蒂達對於貧困阻礙所做出的努力
  - label: C
    content: 瑪蒂達並未在宴會中成為焦點，甚至丟失了珍貴項鍊，這個意外讓夫妻倆的人生轉彎，龐大債務讓生活跌落谷底
  - label: D
    content: 而故事最後的結局，瑪蒂達為她的虛榮付出極大代價，甚至得知項鍊原本就是假的，故事收束在巨大的衝擊中，強化戲劇張力。
  group_stem: "請閱讀以下文章，並回答31~33 題\n（一）下列是莫泊桑〈項鍊〉故事發展的整理表\n| 綱要 | 內容 |\n| :--- | :---\
    \ |\n| 鋪敘背景 | 1.瑪蒂達是一位出身貧寒的美女，嫁給了教育部小職員洛瓦塞爾。<br>2.瑪蒂達嚮往奢華的生活，洛瓦塞爾則安於平凡的日子。<br>3.珍娜是瑪蒂達的朋友，家境富有，瑪蒂達卻因難以忍受兩人之間的落差而與她漸行漸遠。\
    \ |\n| 商借項鍊 | 1.洛瓦塞爾得到教育部部長的晚宴請帖，瑪蒂達卻因為沒有適合的衣著而悲傷。<br>2.洛瓦塞爾放棄買獵槍的心願，把積蓄給瑪蒂達訂做晚禮服。<br>3.瑪蒂達向珍娜商借首飾，選中一條「鑽石項鍊」，珍娜爽快出借。<br>4.瑪蒂達在晚宴中大放異彩，成為眾所矚目的焦點，讓她十分陶醉。\
    \ |\n| 遺失項鍊 | 1.回到家，瑪蒂達驚覺項鍊遺失，不得不以修理為由拖延歸還項鍊的時間。<br>2.夫妻倆遍尋不到項鍊，決定買一條新的作為賠償，但項鍊盒蓋上標示的寶石店不是項鍊的賣家，老闆說他只做了盒子。<br>3.洛瓦塞爾為了在另一家店購買式樣相近的項鍊而四處借貸。<br>4.瑪蒂達將新項鍊歸還給珍娜時，珍娜卻連盒蓋都沒打開。\
    \ |\n| 償還債務 | 1.瑪蒂達下定決心還清龐大的債務。<br>2.夫妻倆省吃儉用，辛勤工作，過著貧窮的生活，花費十年終於還清債務。 |\n| 發現真相\
    \ | 1.瑪蒂達因長年勞動，外貌不再美麗，與十年前判若兩人。<br>2.在街上偶遇珍娜，瑪蒂達才得知當初借來的鑽石項鍊居然是「假貨」。 |\n\n(二)三分鐘說一個完整的故事\n\
    \    不論是小說、電影還是漫畫，只要他的核心是故事，大部分都有類似的戲劇結構。\n    所謂故事的公式，透過問自己七個問題，就可以在三分鐘內，說出一個「有頭、有尾、有衝突、有轉折」的完整故事。\n\
    第一個問題：主人翁的「目標」是什麼？\n第二個問題：他的「阻礙」是什麼？\n第三個問題：他如何「努力」？\n第四個問題：「結果」如何？（通常是不好的結果）\n\
    第五個問題：如果結果不理想，代表努力無效，那麼有超越努力的「意外」可以改變這一切嗎？\n第六個問題：意外發生，情節會如何「轉彎」？\n第七個問題：最後的「結局」是什麼？\n\
    將以上七個問題簡化以後，就可以得到故事的公式――「靶心人公式」\n\n(改寫自許榮哲《3 分鐘說18 萬個故事，打造影響力》)"
