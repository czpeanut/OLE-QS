- id: doc_113_高雄_陽明_國文_g8s2e3_s2_17
  section: 2
  number: 17
  type: single
  page: 2
  stem: 「成功是失敗之母」是改寫自諺語「失敗是成功之母」，下列何者是本文所強調的重點？
  options:
  - label: A
    content: 成功後心態不可驕縱自滿，否則將招致失敗
  - label: B
    content: 不應以成敗結果來論斷是否為英雄
  - label: C
    content: 失敗後若能持續奮進努力，最終將能走向成功
  - label: D
    content: 所有的失敗經驗都能成為成功的養分。
  lesson_raw:
    title: 成功是失敗之母
    basis: 題幹提及「『成功是失敗之母』……下列何者是本文所強調的重點」
