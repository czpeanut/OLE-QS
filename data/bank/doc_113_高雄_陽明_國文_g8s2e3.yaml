  - label: B
    content: 調素琴、閱金經：興趣廣泛且特別熱愛閱讀財經書籍
  - label: C
    content: 談笑有鴻儒，往來無白丁：多與學識淵博之人聚會，但鮮少與之真正交心。
  - label: D
    content: 南陽 諸葛廬，西蜀 子雲亭：自比諸葛亮、揚雄，有恃才傲物之意味。
  lesson_raw:
