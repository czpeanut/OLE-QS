  stem: 由兩個意思相反的字所組成，且同時保留兩個字意思的複詞，稱為「反義複詞」。下列選項「 」何者不是反義複詞？
  options:
  - label: A
    content: 這部電影「雅俗」共賞，票房屢創新高
  - label: B
    content: 二手貨品質「良莠」不齊，挑選時應該仔細檢視
  - label: C
    content: 這是我們的「國家」，更該好好把關每一項政策
  - label: D
    content: 職業無分「貴賤」，各行各業都有其價值。
- id: doc_113_高雄_陽明_國文_g8s2e3_s2_19
  section: 2
  number: 19
  type: single
  page: 3
  stem: 「雲」在古典詩詞中的意涵各有其趣，下列敘述何者有誤？
  options:
  - label: A
    content: 「雲來山更佳，雲去山如畫，山因雲晦明，雲共山高下。」詩中寫出雲偕伴山水的自然之美。
  - label: B
    content: 「乘時做霖雨，遂使嘉禾秀。膏澤遍蒼生，普世登仁壽。不自居其功，飄然復歸岫。」詩中寫雲化為甘霖滋潤萬物，恩澤遍佈卻不居功自傲的濟世之志。
  - label: C
    content: 「昔人已乘黃鶴去，此地空餘黃鶴樓。黃鶴一去不復返，白雲千載空悠悠。」詩中寫人去樓空的景象，也流露出歲月如流、時光不再的慨嘆。
  - label: D
    content: 「中歲頗好道，晚家南山陲。興來每獨往，勝事空自知。行到水窮處，坐看雲起時。偶然值林叟，談笑無還期。」詩中寫出對於官場的嫌惡失望，只能寄情山水的無奈。
- id: doc_113_高雄_陽明_國文_g8s2e3_s2_20
