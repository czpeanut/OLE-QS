  stem: 「歇後語」是一種具有鮮明性格的口語，它生動、活潑、通俗、幽默。它有點像猜謎語，帶給人一種隱含的意思，有時又一語雙關。試問下列源自《三國演義》的歇後語，何者有誤？
  options:
  - label: A
    content: 草船借箭――滿載而歸
  - label: B
    content: 周瑜打黃蓋――路人皆知
  - label: C
    content: 張飛穿針――大眼瞪小眼
  - label: D
    content: 孔明大擺空城計――化險為夷。
- id: doc_113_高雄_陽明_國文_g8s2e3_s2_21
  section: 2
  number: 21
  type: single
  page: 3
  stem: 「曹操引三萬兵馬據守官渡時，遭袁紹率領數十萬大軍攻打，情勢危急。幸得許攸獻計，由曹操親自帶領五千精兵發動奇襲，燒毀袁軍在烏巢的糧倉，導致袁紹最後因為缺糧而戰敗。」根據文意，請問曹操使用了哪種計策而獲勝？
  options:
  - label: A
    content: 用計誘使對方離開據點的「調虎離山」
  - label: B
    content: 不正面迎擊，暗中消滅敵人力量根源的「釜底抽薪」
  - label: C
    content: 作戰時採取守勢，等待敵方疲憊時予以痛擊的「以逸待勞」
  - label: D
    content: 先擊敗敵人的大將，以打亂敵方形勢的「擒賊擒王」。
- id: doc_113_高雄_陽明_國文_g8s2e3_s2_22
  section: 2
  number: 22
  type: single
  page: 3
  stem: 「一組詞語像積木一樣／說出去的一刻便散掉了／你聽著卻把他自由組裝／砌成為你想聽見的模樣。」（青木原〈溝通〉）關於本詩，下列解讀最適當的是？
  options:
  - label: A
    content: 本詩利用誇飾手法，將積木可任意組裝的特性，與語言連結
  - label: B
    content: 以「一組組詞語」、「散掉」等意象，暗指言多必失的道理
  - label: C
    content: 「砌成為你想聽見的模樣」指聽者斷章取義，曲解說者的原意
  - label: D
    content: 「你聽著卻把他自由組裝」說明言行不一，讓聽者無所適從。
