- id: doc_113_高雄_陽明_國文_g8s2e3_s3_34
  section: 3
  number: 34
  type: single
  page: 6
  stem: 根據本文所述，「跨越困境的能力」具有何特性？
  options:
  - label: A
    content: 能讓人們學會如何理解並利用困難
  - label: B
    content: 不必合於現實的思考就能釐清問題
  - label: C
    content: 這種能力是天生的，而非後天培養的
  - label: D
    content: 可有可無，即使不具備亦能克服困境。
  group_stem: "請閱讀以下文章，並回答34~36 題\n人生碰到困境在所難免，若我們缺乏面對困境需具備的能力和特質，便難以克服困境。\n  當現有的工作環境或工作要求，沒有挑戰到人們所缺少的某項特質或知識能力時，人們就會感覺自己處於順境。困境的定義則很主觀，我們甚至傾向於誇大解讀自身困境。\n\
    \  有些人遭遇挫折後，被自己的失敗感、挫折感綁住，無法走出來，陷於一種停滯狀態。這是因為人們往往沒有意識到自己可以學習新的知識和能力，來因應那些困境。事實上，困難能夠讓人成長，端賴人們如何理解與利用這些困難。這正是所謂的「不經一事，不長一智」。\n\
    \  那麼，我們該如何跨越困境？重要的是，要對困境有合於現實的理解，想想這個困境代表什麼意思，並且告訴自己此刻要學些什麼。對困境的解釋，將影響我們處理困境的態度和方法。若能告訴自己，「我必須學點新的知識和能力，來處理眼前的問題」，就不會讓自己坐困愁城。\n\
    \  一個人面對困境的態度，攸關①他將向前邁進還是原地踏步，甚或一蹶不振②。積極的態度是以合於現實的思考來釐清問題，認清自己要負多少責任，而不是只要求環境來配合他。這需要以智慧來判斷問題，以勇氣來承擔自己應付出的努力。不推諉③失敗到他人和環境，也不以過去的創傷為藉口。\n\
    \  很多人突破不了困境，是因沒有覺察到自己被過去的經驗困住了，也不知道應該超越過去的框架，在觀念、技能、眼界上成長。\n  跨越困境的能力，是可以從小培養的。幼年有培養出勇氣面對世界的人，比較願意去努力突破困境。而這種勇氣必須透過完成某些事物或親身體驗來養成。孩子的自信、能力感，來自完成某件事情的感覺和喜悅。對孩子的要求不能高過孩子所能承擔，才能讓孩子逐步累積成功的經驗，這是訓練孩子時的重要原則。當孩子有挫折感時，必須以鼓勵的方法讓他有勇氣繼續嘗試。如果沒有鼓勵，只是批評與要求，便無法讓孩子在完成事情的歷程中培養出面對困難的勇氣。\n\
    \  然而，如果你將現在的挫折歸咎於幼年沒有培養出勇氣，那就錯了。任何事只要你願意學，都能從現在開始訓練自己。\n                    \
    \                 （選自《天下雜誌》第400 期）\n【注釋】①攸關：有所關聯。攸，音ㄧㄡ。②一蹶不振：比喻遭受挫折或失敗後，無法再振作恢復。蹶，音ㄐㄩㄝˊ。③推諉：找藉口推托，不負責任。諉，音ㄨㄟˇ。"
