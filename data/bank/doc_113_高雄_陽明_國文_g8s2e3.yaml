- id: doc_113_高雄_陽明_國文_g8s2e3_s2_12
  section: 2
  number: 12
  type: single
  page: 2
  stem: 「台灣的防疫經驗，成為各國媒體關注的焦點！美國最具知名度的《時代雜誌》，近日官網首頁正中央最醒目的專欄，刊登台灣抗疫的成功展現。文中引用總統提及台灣的處境，表示台灣長期被排除在世衛和聯合國之外，但還是願意與國際戮力合作。就連美國前白宮國安顧問博騰，也推文肯定台灣抗疫的努力。這幾個月來，台灣由一個蕞爾小國，憑藉過往累積的經驗與沉著的應對，躋身為國際著名的防疫國度。」請問以下〈陋室銘〉中的文句，何者較不合適呼應這則新聞報導？
  options:
  - label: A
    content: 「山不在高，有仙則名。水不在深，有龍則靈。」台灣防疫有成，便能名聞國際。
  - label: B
    content: 「斯是陋室，惟吾德馨。」縱使台灣所處環境不如他國，只要有實力與品德，便能耀眼國際。
  - label: C
    content: 「苔痕上階綠，草色入簾青。」清幽的環境是防疫的關鍵，台灣山區資源豐富，是防疫成功的關鍵。
  - label: D
    content: 「孔子云：『何陋之有？』」台灣雖然地小人稠，但機警防疫，也不吝於分享經驗，大受國際青睞。
  lesson_raw:
    title: 陋室銘
    basis: 題幹提及「請問以下〈陋室銘〉中的文句」
- id: doc_113_高雄_陽明_國文_g8s2e3_s2_13
  section: 2
  number: 13
  type: single
  page: 2
  stem: 下列有關〈陋室銘〉文意的敘述，何者正確？
