  type: single
  page: 1
  stem: 小明在未定刻度的酒精溫度計上刻劃攝氏溫標時，發現水的冰點（0℃）和沸點（100℃）之間，酒精柱高度差為10 公分，則每1℃應刻劃多少公分？
