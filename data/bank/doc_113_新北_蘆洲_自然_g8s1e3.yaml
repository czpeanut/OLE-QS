  section: 1
  number: 2
  type: single
  page: 1
  stem: 如附圖，在甲、乙兩相同的錐形瓶上插玻璃管，甲瓶玻璃管較乙瓶細，25℃時兩管水面在等高處，若溫度下降至5℃時，哪一管的水面較高？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 兩管相等
  - label: D
    content: 不一定。
