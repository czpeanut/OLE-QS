- id: doc_113_新北_蘆洲_自然_g8s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '小明想測量一杯溫度範圍約在－85℃至10℃的液體，但手邊沒有現成的溫度計，他可以利用表一何種物質自製液體溫度計較合適？


    表一


    | | 水 | 水銀 | 酒精 |

    | :--- | :--- | :--- | :--- |

    | 沸點 | 100℃ | 357℃ | 78℃ |

    | 熔點 | 0℃ | -37℃ | -114℃ |'
  options:
  - label: A
    content: 水
  - label: B
    content: 水銀
  - label: C
    content: 酒精
  - label: D
    content: 水銀和酒精
- id: doc_113_新北_蘆洲_自然_g8s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '使用同一組設備，以相同的穩定熱源分別加熱質量為100 公克的水與A 物體，溫度變化如附表所示，若熱能皆被完全吸收，請問10分鐘後，A 物體吸收多少卡的熱量？


    | 加熱時間（分） | 0 | 5 | 10 | 15 | 20 |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 100公克水 | 25℃ | 30℃ | 35℃ | 40℃ | 45℃ |

    | 100公克A物體 | 25℃ | 35℃ | 45℃ | 55℃ | 65℃ |'
  options:
  - label: A
    content: '1000'
  - label: B
    content: '2000'
  - label: C
    content: '3000'
  - label: D
    content: 無法計算。
