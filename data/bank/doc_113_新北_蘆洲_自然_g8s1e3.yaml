  section: 1
  number: 19
  type: single
  page: 2
  stem: 如附圖，在大小相同的兩試管中，裝有等量、等溫的水，以火力相等的酒精燈同時加熱。圖中A 處位於左試管底部，B 處位於右試管頸部，則A、B 兩處水溫，何者上升較快？
  options:
  - label: A
    content: 一樣快
  - label: B
    content: A 較快
  - label: C
    content: B 較快
  - label: D
    content: 不一定 。
