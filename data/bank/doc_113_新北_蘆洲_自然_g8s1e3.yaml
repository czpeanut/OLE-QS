  group_stem: '題組：請閱讀下列文章後回答34-36 題：

    享受春天燦爛的陽光，對人類來說療癒身心，但對於春天時南極洲上空的臭氧層而言，陽光卻是破壞臭氧的共犯。人類使用冷媒等物質所排放的氟氯碳化合物進入大氣後，會分解產生氯原子（Cl）。氯原子會快速地摧毀臭氧（O3），形成氧氣（O2）及氧化氯（ClO）。在臭氧層中，
    兩個氧化氯易結合形成過氧化氯（ClOOCl）。這時候問題大了！過氧化氯分子會吸收陽光而分解，並再次產生氯原子（Cl）。在這個光化學現象的循環下，只要陽光足夠，少量的氯原子（Cl）
    就會破壞千倍以上的臭氧分子（O3）。'
