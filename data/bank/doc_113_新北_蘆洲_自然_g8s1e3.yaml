- id: doc_113_新北_蘆洲_自然_g8s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 相傳手沖咖啡使用的熱水，溫度控制在85℃時為最佳萃取咖啡溫度。咖啡師指出，若家裡沒有溫度計，則可將煮沸的熱水倒入手沖壺，熱水會因傾倒過程散失熱量於空氣中，並與手沖壺達到熱平衡，此時壺中的水溫大約就是85℃。若使用此方式將200
    毫升、100℃的沸水倒入手沖壺，且熱水降溫到最佳萃取溫度，則散失到空氣中的熱量約為多少卡？
