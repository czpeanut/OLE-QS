- id: doc_113_新北_蘆洲_自然_g8s1e3_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 將常溫常壓下的某些物質分為兩類，已知分類結果中一組有「金、汞、銅」，另一組有「硫、石墨」，請問最可能是依何種規則來分類？
  options:
  - label: A
    content: 是否具有導電性
  - label: B
    content: 是否以固態存在
  - label: C
    content: 是否屬於金屬物質
  - label: D
    content: 是否是銀白色。
- id: doc_113_新北_蘆洲_自然_g8s1e3_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: 關於元素的應用，下列敘述何者完全正確？
  options:
  - label: A
    content: 石墨為銀白色固體，可作為電極和鉛筆芯的材料
  - label: B
    content: 矽用於製造矽晶圓，應用於半導體工業，是地殼含量第二多的元素
  - label: C
    content: 銅的導電性是金屬中的第一名，常作為一般電線的導電材料
  - label: D
    content: 硫為黑色固體，可以製作硫酸與製作用於煙火中的黑火藥。
- id: doc_113_新北_蘆洲_自然_g8s1e3_s1_24
  section: 1
  number: 24
  type: single
  page: 3
  stem: 某元素可形成一種無色透明的結晶，是所有物質中硬度最高的，可以切割任何堅硬的物質，其元素符號為何?
  options:
  - label: A
    content: B
  - label: B
    content: Ag
  - label: C
    content: C
  - label: D
    content: Ca。
- id: doc_113_新北_蘆洲_自然_g8s1e3_s1_25
  section: 1
  number: 25
  type: single
  page: 3
  stem: 有關鈉、鉀兩金屬，下列敘述何者有誤？
  options:
  - label: A
    content: 鈉、鉀皆可用小刀切開
  - label: B
    content: 鈉、鉀避免與空氣接觸，可儲存在礦物油中
  - label: C
