  section: 1
  number: 10
  type: single
  page: 1
  stem: '大仁哥做實驗若將將100 公克80℃的甲、乙、丙、丁四種金屬放進100 公克初溫20℃的水中，已知四種金屬的比熱如下表，假設熱量無散失的情形下，則放進水中達到熱平衡時的溫度何者最高？


    | 金屬 | 甲 | 乙 | 丙 | 丁 |

    | :--- | :--- | :--- | :--- | :--- |

    | 比熱（卡／公克‧℃） | 0.031 | 0.056 | 0.093 | 0.113 |'
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
- id: doc_113_新北_蘆洲_自然_g8s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 梅君取質量100 公克、溫度 90℃的甲、乙、丙和丁四種金屬，其比熱值如第10 題的上表所示。若放置相同環境的室溫25℃中，則哪一種物質的溫度最先降到25℃？
  options:
  - label: A
    content: 丁
  - label: B
    content: 丙
  - label: C
    content: 乙
  - label: D
    content: 甲。
- id: doc_113_新北_蘆洲_自然_g8s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 小文與阿明兩人正在比賽乒乓球，不慎乒乓球飛到球室的門邊，此時冠綸正走進球室想參加比賽，不巧將地上的乒乓球踩扁了，試問他們該如何做才能讓凹陷但尚未破裂的乒乓球恢復圓球狀？
  options:
  - label: A
    content: 用手擠壓沒有凹陷的另一端
  - label: B
    content: 使用兩手掌將乒乓球以順時鐘方向搓揉
  - label: C
    content: 放入冷凍庫冰凍
  - label: D
    content: 浸泡熱水。
- id: doc_113_新北_蘆洲_自然_g8s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 打針前，護士都會在打針的部位塗上消毒酒精，塗了之後會感覺涼涼的，其主要原因為何？
  options:
  - label: A
    content: 酒精的溫度非常低
  - label: B
    content: 酒精非常容易揮發，所以會快速的帶走皮膚表層的熱量
  - label: C
    content: 酒精容易和皮膚產生吸熱的化學反應
  - label: D
    content: 酒精容易將熱釋放到空氣中。
- id: doc_113_新北_蘆洲_自然_g8s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 宜人和家人前往合歡山賞雪，他發現融雪時比下雪時更冷，請問造成此現象的原因為何？
  options:
  - label: A
    content: 這是本國特有的氣候特徵
  - label: B
    content: 這是熱帶地區特有的天氣型態
  - label: C
    content: 心理作用
  - label: D
    content: 因為水氣變成雪的過程會放熱，而融雪的過程則會吸熱。
- id: doc_113_新北_蘆洲_自然_g8s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 下列哪一種現象或反應會釋放出能量？
  options:
  - label: A
    content: 元素鈉溶於水時
  - label: B
    content: 冰熔化
  - label: C
    content: 酒精蒸發
  - label: D
    content: 植物行光合作用。
- id: doc_113_新北_蘆洲_自然_g8s1e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 尚恩打球的時候，不小心扭傷腳踝，小均同學馬上去健康中心拿冷凍冰袋與溼毛巾，幫尚恩冰敷以舒緩疼痛，經過一段時間後，尚恩發現溼毛巾黏在冰袋上，請問其原因為何？
  options:
  - label: A
    content: 溼毛巾與冰袋起化學變化，使水變黏
  - label: B
    content: 溼毛巾與冰袋接觸傳熱，使水結冰
  - label: C
    content: 溼毛巾與冰袋接觸發生物理變化，使冰袋產生黏性
  - label: D
    content: 溼毛巾與冰袋接觸傳熱，使水溫升高。
- id: doc_113_新北_蘆洲_自然_g8s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 將受潮的粉紅色氯化亞鈷試紙烘乾，使試紙變回藍色，請問熱量變化為何？
  options:
  - label: A
    content: 吸熱
  - label: B
    content: 放熱
  - label: C
    content: 先吸熱再放熱
  - label: D
    content: 先放熱再吸熱。
- id: doc_113_新北_蘆洲_自然_g8s1e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 小英與家人前往土地公廟拜拜，發現廟方設有一座煙囪高聳的「自動吸金爐」，安安按照金爐上的指示，發現金爐內部在燃燒時，只要將整疊金紙放在金爐口，金紙就會自動一張張的被吸入爐內燃燒。請問此現象應該與熱的哪種傳播方式最有關？
  options:
  - label: A
    content: 傳導
  - label: B
    content: 對流
  - label: C
    content: 輻射
  - label: D
    content: 以上皆有關。
