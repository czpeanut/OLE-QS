- id: doc_113_新北_蘆洲_自然_g8s1e3_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 媽媽生病了，為此小昀想要煮稀飯給媽媽吃，媽媽擔心小昀第一次煮稀飯不知道訣竅，跟小昀說：「用鍋子煮稀飯的時候，稀飯容易燒焦，你要用湯勺攪拌底部的稀飯，不然就會產生苦苦的味道，很不好吃喔！」，稀飯容易燒焦的主要原因是，煮稀飯時何種熱的傳播特性較差所致？
  options:
  - label: A
    content: 輻射
  - label: B
    content: 傳導
  - label: C
    content: 對流
  - label: D
    content: 輻射及傳導。
- id: doc_113_新北_蘆洲_自然_g8s1e3_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 附圖為保溫瓶的剖面圖與各部位構造，有關保溫瓶的功能與熱傳播原理，下列敘述何者錯誤？
  options:
  - label: A
    content: 真空夾層可防止熱的傳導與對流
  - label: B
    content: 內壁鍍銀是防止熱輻射的方法
  - label: C
    content: 絕熱材質的瓶蓋可使熱不易因傳導與對流而散失
  - label: D
    content: 保溫瓶不適合保存低溫的冰水。
