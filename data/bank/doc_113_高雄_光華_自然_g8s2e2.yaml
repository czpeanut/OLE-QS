- id: doc_113_高雄_光華_自然_g8s2e2_s1_49
  section: 1
  number: 49
  type: single
  page: 5
  stem: 閱讀完文章後，請判斷「酸性體質較容易被蚊子叮，可以多吃鹼性食物調理」的說法是否正確？
  options:
  - label: A
    content: 正確，因為鹼性食物消化後可使血液的pH 值上升
  - label: B
    content: 正確，因為鹼性食物可中和酸性體質
  - label: C
    content: 不正確，因為人體具有恆定性，血液的pH 值必須維持7.35∼7.45
  - label: D
    content: 不正確，多吃鹼性物質會使血液的pH 值高於7.45，生命活動無法正常進行。
  group_stem: "閱讀素養題：\n    你聽過「酸性體質較容易被蚊子叮，可多吃鹼性食物調理」的說法嗎？有部分營養界人士將食物區分為「酸性食物」或「鹼性食物」，主要依據為食物在體內經過代謝之後，其產物會對腎產生酸負荷量的多寡作為標準。通常蛋白質和澱粉含量高的食物中，有較多的硫、磷等元素，經代謝後會排出較多酸性物質，就被歸類成「酸性食物」；而蔬果、奶類等食物中，則含較多鉀、鈣等礦物質，經代謝後會排出較多鹼性物質，就被歸類成「鹼性食物」。\n\
    \    然而人體會維持體內的恆定，血液的pH 值必須維持在7.35∼7.45，不管是過低還是過高，生命活動都無法正常進行。身體中的血液對外加的酸鹼性物質有一定「調節」能力，無論攝入酸性或鹼性物質，血液的pH\
    \ 值都不會有太大改變。此外，肺部的氣體交換和腎臟的過濾功能，也可以協助血液pH 值的恆定，所以通常食物不會使血液的酸鹼性有明顯變化，也沒有酸、鹼性體質之分了。"
