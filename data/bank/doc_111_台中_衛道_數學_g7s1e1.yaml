- id: doc_111_台中_衛道_數學_g7s1e1_s3_1
  section: 3
  number: 1
  type: calc
  page: 4
  stem: 若後三洞，豪哥抓下一隻Eagle，一隻Birdie，還吞下了一個Double Bogey（非按照比賽順序）。請問：豪哥在這場球敘中共揮出多少桿？
  group_stem: '素養題（資料來源：維基百科）

    現代高爾夫球起源於1456年的蘇格蘭，當地亦有全球最歷史悠久的高球會，被視作蘇格蘭國粹。與許多運動不同的是，高爾夫比賽大部分是在沒有裁判的監督下進行。這項運動有賴個人的誠實來表現對其他球員的尊重和對規則的遵守。不論比賽有多麼激烈，所有球員的舉止都要有紀律，並隨時表現禮貌和運動家精神。這就是高爾夫精神。
    GOLF的英文四個單字各有其特殊的健康定義：G表示Green，就是綠色和草地樹木。O表示Oxygen，就是氧，氧氣充足的地方。L表示Light就是光，陽光普照的地方。F表示Fresh，就是清新，輕鬆活潑的地方，年青有活力(或是Friendship，表示友誼之意)。基本上，高爾夫是以18洞為一回合，設於大自然之球場中進行，球場面積方面，從占地幾十公頃的土地規劃出18個球道。標準桿是按照每洞的距離長短所訂定之，在一般18洞球道中依球道距離，設有標準桿4桿的有10洞，標準長度在251至470碼之間，屬中距離洞；設有標準桿3桿的有4個洞，標準長度在250碼以下，稱為短洞；設有標準桿5桿的有4個洞，標準長度在471碼以上，是為長洞。球場根據設計者及地形的須求，球場中必須要有18洞，標準桿是72。比賽的勝負是以打出最少桿數之競賽者為優勝者，而且計分方式如下表：


    | 計分 | 術語 | 定義 |

    | :---: | :---: | :---: |

    | -4 | Condor或Triple eagle（三鷹） | 少於標準桿4桿 |

    | -3 | Albatross或Golden eagle或Double eagle(雙鷹) | 少於標準桿3桿 |

    | -2 | Eagle（老鷹） | 少於標準桿2桿 |

    | -1 | Birdie（小鳥） | 少於標準桿1桿 |

    | 0 | Par（標準桿） | 等於標準桿 |

    | +1 | Bogey（柏忌） | 多於標準桿1桿 |

    | +2 | Double Bogey（雙柏忌） | 多於標準桿2桿 |

    | +3 | Triple Bogey（三柏忌） | 多於標準桿3桿 |

    | +4 | Quadruple Bogey（四柏忌） | 多於標準桿4桿 |


    例如：阿哲打一個標準桿為4桿的球洞，揮了3桿，球就進洞，那麼阿哲在這個球洞就抓到了1隻小鳥（Birdie），意即得到-1分。


    中秋節一大早五點，豪哥和小胡、馬柏、老徐 三位球友相約在豐原高爾夫球場來一場球敘，打完前15洞，小胡揮出62桿，而豪哥還領先2桿，馬柏落後1桿，老徐落後3桿，剩下的球洞為1個短洞、1個中距離洞以及1個長洞，試回答下列問題'
