  type: single
  page: 1
  stem: '小華原本有一個幸福美滿的家庭，但是一場突如其來的意外，帶走了他父親的性命，家中頓時失去經濟支柱，甚至連最基本的生活條件都無法獲得滿足。右表是小華上網查到可能獲得的協助，他尋求了哪一方面的協助？


    | 急難紓困 | 戶籍地、居住地公所 | 對象：家中負擔家庭主要生計者<br>事件：死亡、失蹤、罹病、失業……，生活陷於困境<br>時間：3 個月內<br>補助：1～3
    萬 |

    | 急難救助 | 戶籍地、居住地公所 | 對象：家庭所有成員<br>事件：喪葬、傷病、生活、車資……，生活陷於困境<br>時間：依救助事件及各縣市規定<br>補助：依各縣市急難救助辦法基準
    |

    | 教育部學產基金設置急難慰問金 | 學校 | 對象：學生或家長<br>事件：死亡、重大傷病、失業、入獄……<br>時間：3 個月內<br>補助：5 千～2
    萬 |'
  options:
  - label: A
    content: 社會救助
  - label: B
    content: 福利服務
  - label: C
    content: 就業安全
  - label: D
    content: 居住正義。
