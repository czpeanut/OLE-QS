  group_stem: "※請閱讀以下選文，並回答下列兩題。\n臺灣和地形有關的地名，多是古人依照當時的地理環境所命名，隨著時間變化，原先的山丘、河或湖可能會變遷甚至消失，僅剩下地名而已。因此，透過地名可推估過去的地景樣貌，例如「墘」字代表位於某一地物或水體的旁邊，如厝墘、田墘、港墘與溪墘等，圖(四)為「墘」字地名的分布圖。\n\
    \  小華家鄉地名也有「墘」字，雖然現今已經看不到當時的地貌；為了印證上述命名原則，她找到1921年日治時期家鄉的地圖，如圖(五)所示，並將當時的河流及水體標示在現今的電子地圖上，發現與上述原則是一致的，如圖(六)所示。"
