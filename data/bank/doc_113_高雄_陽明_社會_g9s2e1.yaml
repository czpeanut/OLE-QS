- id: doc_113_高雄_陽明_社會_g9s2e1_s1_22
  section: 1
  number: 22
  type: single
  page: 4
  stem: 關於文中畫底線處提及的對外戰爭，下列敘述何者正確？
  options:
  - label: A
    content: 這場戰爭為加富爾所策劃
  - label: B
    content: 這場戰爭促成義大利統一
  - label: C
    content: 戰爭背景為帝國主義高漲
  - label: D
    content: 戰爭後導致奧匈帝國瓦解
  group_stem: "※閱讀以下短文，回答第22、23題\n    位於法國巴黎郊區的凡爾賽宮，由法王路易十四耗費重金打造，是當時歐洲最大、最雄偉、最豪華的宮殿建築，充分彰顯了太陽王「朕即國家」的地位與野心。這座宮殿自1682年起作為法國君王與政府機構所在，見證了許多重大歷史事件的發生。1783年，《巴黎條約》在此簽訂，美洲首個獨立國家誕生；1789年，《網球場宣言》在此發表，展開法國大革命。後來法國王室被推翻，凡爾賽宮便不再有王室入住，逐漸轉型為外交場館及博物館。\n\
    \    即使不再作為政治中心，凡爾賽宮仍然在法國人心中占有重要地位。1870年，由於對外戰爭失利，凡爾賽宮被普魯士軍隊佔領；隔年，普魯士國王在此登基，德意志帝國正式成立。此事深深傷害了法國人的民族情感，使法國因此仇視德國。出於報復心態，1919年第一次世界大戰結束後，法國特意於凡爾賽宮的鏡廳－－當初普魯士國王加冕典禮舉行之處－－與戰勝國集團召開和平會議、討論並簽訂對德國的《凡爾賽條約》。如此一來一往，不僅未能解消兩國間的仇恨，反而埋下第二次世界大戰的火種。\n\
    參考資料：Wilhelm Chang｜凡爾賽宮 歐洲的極致宮殿 (https://wilhelmchang.com/zh/chateau-de-versailles/)"
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 歷史
      code: 1-4
      title: 德國與義大利的建國
