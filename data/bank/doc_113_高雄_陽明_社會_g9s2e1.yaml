- id: doc_113_高雄_陽明_社會_g9s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 在台灣凡是大型的合作社或產銷班，在農產品採收後都會根據大小、重量、外觀進行分級，通常農民分級的愈準確、農產品的銷售出路也愈多，整體而言才能提高農民收入。然而，市場規格之外但品質無虞的農產品，例如規格不符或賣相不佳，稱為「格外品」(GoodWill
