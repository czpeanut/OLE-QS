  stem: 「置入性行銷」俗稱「業配文」，就是把廣告隱藏在新聞或戲劇之中，以「自然而然」的方式，讓我們在看戲劇或新聞的時候，不知不覺接觸到廣告資訊，進而支持某個政府政策或購買某項商品。在戲劇中放入好的「置入性行銷」，可以為廣告商、製作單位和閱聽人創造三贏，但在新聞中的「置入性行銷」可能就存在著問題。新聞的「置入性行銷」，多半以新聞編寫方式包裝政府績效，或以特派記者專訪形式，變相成為政治的廣告，被許多學者與資深媒體人認為嚴重影響新聞倫理及專業。因此英國以及我國的國家通訊傳播委員會(NCC)一律禁止廣電媒體的新聞節目採用「置入性行銷」，以保護新聞專業繼續被大眾信任。根據上文敘述，下列何種作法能直接避免閱聽人落入「置入性行銷」的陷阱？
