- id: doc_113_高雄_陽明_社會_g9s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 根據文中畫線處可以用下列哪一個地理概念解釋？
  options:
  - label: A
    content: 經濟全球化
  - label: B
    content: 作物單一化
  - label: C
    content: 農業企業化
  - label: D
    content: 區域專業化
  group_stem: "※請閱讀以下選文，並回答下列兩題。\n田尾鄉花卉培植及交易始於日治時期，據傳當地的花卉交易源於民眾將品質較好與奇特的花，透過交換方式攜回家中培養及繁殖。戰後，田尾鄉農會開始專責培育種苗，再提供當地農民種植，從此逐漸開啟朝花卉及景觀園藝發展的契機。\n\
    \ 根據民國112年《臺灣地區農產品批發市場年報》的資料顯示，彰化縣的花卉成交量共2137萬把，占全國36％， 田尾鄉成為全臺花卉產量最高的鄉鎮。而花卉從業人口部分，大員林地區占全臺花卉從業人口的近五成，其中田尾鄉的居民約有八成以上從事花卉產業，形成獨特的花卉聚落。所以田尾有「花的故鄉」、「東方荷蘭」的美稱。\n\
    \   其中，田尾鄉農會花卉產銷班第19班成員栽培27公頃花田，採取資材共購、產品共選，團結力量每年創造3億元產值。然而近來花卉業者面臨缺工、同業間削價競爭，與數位轉型衝擊，不少業者轉型做休閒觀光，業者推出許多手作體驗課程，部分商家也經營網路銷售，接觸更多客源，讓業績成長。"
