- id: doc_113_台中_向上_社會_g9s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: 由文章可知，奈及利亞近十年來綁架案頻傳的原因為何？
  options:
  - label: A
    content: 伊斯蘭教不同教派的教義紛爭
  - label: B
    content: 貧富不均與族群、宗教的衝突
  - label: C
    content: 高比例的基督教人口使得與周圍國家格格不入
  - label: D
    content: 爭奪石油、天然氣資源引發戰爭
  group_stem: "題組一奈及利亞是非洲人口最多的國家，也是非洲數一數二的經濟體，石油、天然氣產量更是非洲第一，臨海的交通與氣候也為該國提供良好的發展條件。但在這樣的優勢下，奈及利亞卻綁架案頻傳，自2014\
    \ 年~2024 年間，每年有上千人遭綁架，多起案件直接闖入校園，直接擄走數百名師生。\n      奈及利亞境內超過250 個民族，人數最多的富拉尼人約佔全國35%，而南方信奉基督教和北方信奉伊斯蘭教的人口差距僅約10%，境內本就有族群及宗教的矛盾，而石油拉大了南、北經濟差距，暖化也導致北部游牧民族須南遷尋找水源，讓從事農牧業的族群爆發衝突。經濟發展較落後的北部地區缺乏有效警力，難以遏阻橫行的恐怖組織與犯罪集團，綁架成為其獲取財源的手段。請回答14.~15.題："
  tags:
    chapter:
      publisher: 南一
      book: 九下
      subject: 公民
      code: 1-2
      title: 全球化帶來的影響與評價
      chapter: null
    textbook: 九下公民 1-2 全球化帶來的影響與評價
