  stem: 「一個人存在的目的，必須由自己來建立。不過，我認為這個時代的年輕人，已經不再從自己的心底深處、從熾熱的靈魂出口構築存在的目的。頂多把存在的目的替換成『夢想』這個字眼，拿來高唱口號，將自身的淺薄暫且黏附在電視或雜誌頁面上，任其左右而已。」根據這段文字，下列何者最符合作者對「這個時代的年輕人」的觀點？
