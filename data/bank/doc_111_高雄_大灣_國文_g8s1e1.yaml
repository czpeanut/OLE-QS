  stem: 下列哪一選項的詩句，最能代表父母心甘情願的心情？
  options:
  - label: A
    content: 感此撫童雛，何殊此禽羽
  - label: B
    content: 瘁羽豈暇梳，嬌音不遑吐
  - label: C
    content: 戴一出掠青蟲，一居禦鷹虎
  - label: D
    content: 不辨誰雌雄，四翼共辛苦。
  group_stem: "（四）\n    抱兒嬉樹下，新綠遮庭戶。忽聞啁啾聲，仰見春鳥乳。不辨誰雌雄，四翼共辛苦。一出掠青蟲，一居禦鷹虎；出憂居力單，居憂出遭罟。瘁羽豈暇梳，嬌音不遑吐。黃口快得食，那知翁與姆。感此撫童雛，何殊此禽羽？上念父母恩，淚下如注雨！\
    \                                           （徐善建 哺雛詩）"
