  stem: 關於各種濾網的比較，以下哪一個說明是正確的？
  options:
  - label: A
    content: HEPA 濾網和活性碳濾網很貴，但是可吸附有毒物質與塵蟎、細菌、黴菌等微生物，對PM2.5 也能有效過濾，可以互相替代使用
  - label: B
    content: 前置濾網與預濾網只能過濾大顆粒灰塵與毛髮，無法過濾小顆粒，對於現代人在意的PM2.5 無法過濾，因此可以不加裝此類濾網
  - label: C
    content: 光觸媒與冷觸媒濾網是目前最先進的濾網，最重要的是無毒、價格便宜又環保，且經過英國過敏協會與美國FDA 認證效果卓越
  - label: D
    content: 負離子濾網可分解有機物質，一運轉即可產生電子與空氣分子結合成負離子，但是懸浮物質卻會吸附到家具與地板、牆壁表面。
