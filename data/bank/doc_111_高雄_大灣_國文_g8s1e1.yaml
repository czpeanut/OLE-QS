  stem: 下列「 」中的字，何者音義全對？
  options:
  - label: A
    content: 使爾悲不「任」：音ㄖㄣˋ，忍受
  - label: B
    content: 「逞」英雄：音ㄔㄥˇ，顯示
  - label: C
    content: 魂牽夢「縈」：音一ㄣˊ，圍繞
  - label: D
    content: 行「潦」：音ㄌㄠˊ，淹水。
- id: doc_111_高雄_大灣_國文_g8s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列字音寫成國字後，何組相同？
  options:
  - label: A
    content: 各「ㄕㄨ」己見╱「ㄕㄨ」困貸款
  - label: B
    content: 氣勢「ㄆㄤ」礡／大雨「ㄆㄤ」沱
  - label: C
    content: 「ㄓㄚ」針／掙「ㄓㄚˊ」
  - label: D
    content: 震「ㄓㄜˊ」不已／「ㄋㄧㄝˋ」嚅難言。
- id: doc_111_高雄_大灣_國文_g8s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 下列選項「 」中的字，何組讀音相同？
  options:
  - label: A
    content: 潔「癖」／「闢」謠
  - label: B
    content: 含「氟」牙膏／春風「拂」面
  - label: C
    content: 「匍」伏前進／灌溉花「圃」
  - label: D
    content: 「殲」滅敵軍／一語成「讖」。
- id: doc_111_高雄_大灣_國文_g8s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 以下解釋正確的有哪些？（甲）盈盈：水清淺的樣子。（乙）經年：整年。（丙）終日不成章：整天寫不出文章。（丁）泣涕：眼淚。（戊）啟蒙：傳授高階知識。（己）氣脫委頓：失神無力，疲乏困頓。（庚）「皎皎」：細長柔美的樣子。
  options:
  - label: A
    content: 甲丁戊己
  - label: B
    content: 甲丙己庚
  - label: C
    content: 甲乙丁己
  - label: D
    content: 甲乙戊己。
- id: doc_111_高雄_大灣_國文_g8s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 下列文句，何者用字完全正確？
  options:
  - label: A
    content: 在熙微的晨光中，我望著母親的臉
  - label: B
    content: 被逮捕的搶劫犯，在警局脈脈不語
  - label: C
    content: 我要用雨珠的鍊子把回憶串起來，繞在手腕上
  - label: D
    content: 慈烏夜啼赤責不孝之人，歌頌反哺的慈烏，藉此奉勸世人及時行孝，免留撼恨。
- id: doc_111_高雄_大灣_國文_g8s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 下列「 」中的詞語，何者運用正確？
  options:
  - label: A
    content: 他是最盡職的業務員，數十年來「櫛風沐雨」地辛勞奔波，終於創業成功
  - label: B
    content: 這一則假新聞已經鬧得「風雨如晦」，讓他蒙受不白之冤， 百口莫辯
  - label: C
    content: 老師的諄諄教誨有如「鴨子聽雷」，讓同學茅塞頓開，恍然大悟
  - label: D
    content: 國際政治形勢處於「雷大雨小」的時刻，我們一定要提高警惕，不可掉以輕心。
- id: doc_111_高雄_大灣_國文_g8s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 下列「 」中的字，何者經替換後意思改變？
  options:
  - label: A
    content: 相「去」復幾許：距
  - label: B
    content: 聞者為沾「襟」：衿
  - label: C
    content: 五月黃梅天，到處「黏答答」的：油膩膩
  - label: D
    content: 經過醫生的急救，小天終於「蘇」醒過來了：甦。
- id: doc_111_高雄_大灣_國文_g8s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 下列字詞的使用，何者不正確？
  options:
  - label: A
    content: 閃電像一把利刃，從手指間隙射出，將天幕「切」成碎片
  - label: B
    content: 大海咆哮着「捲」起巨浪，似乎要把一切淹没
  - label: C
    content: 小玲天生好嗓音，技巧純熟、感情豐沛，要在這場比賽中獲勝，簡直是「探」囊取物
  - label: D
    content: 儘管母雞小心翼翼地護衛著小雞，老鷹仍能準確地「攫」住其中一隻，飛上天去。
- id: doc_111_高雄_大灣_國文_g8s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 下列文句，何者用字最為精簡？
  options:
  - label: A
    content: 阿銘見女子落水，立馬登時跳入河中，迅速將人救起
  - label: B
    content: 串串葡萄煥發著彷若水晶一般似的光澤
  - label: C
    content: 如果我持續一直不長大，就可以永遠沉浸在雨的歡樂中
  - label: D
    content: 昨天深夜大火，整個校區付之一炬，財物損失慘重， 所幸無人傷亡。
- id: doc_111_高雄_大灣_國文_g8s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 下列詞語、諺語的應用，何者正確？
  options:
  - label: A
    content: 春天的氣息將此處染上一抹綠意、「寸草春暉」，是郊遊的好時光
  - label: B
    content: 這兩兄弟從小「青梅竹馬」，感情如膠似漆地十分要好
  - label: C
    content: 戀愛中的男女，總覺得對方無處不美、無處不好，正所謂「情人眼裡出西施」
  - label: D
    content: 孟郊所寫的遊子吟道盡了「子欲養而親不待」，親恩難報的感慨。
- id: doc_111_高雄_大灣_國文_g8s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 下列文句，何者有語病？
  options:
  - label: A
    content: 台灣勝景不只有阿里山和日月潭，還有許多別具特色的地方值得造訪
  - label: B
    content: 朦朧中，遠方田埂上老農夫的皺紋，清晰地映入眼簾
  - label: C
    content: 西子灣的落日像是潑墨山水畫上的一顆紅印
  - label: D
    content: 即使你現在願意這樣做，對方也未必會感激。
- id: doc_111_高雄_大灣_國文_g8s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 小倩在整理時間詞時，不小心弄錯了幾個，下列她整理的何者都是表示「時間短暫」的語詞？
  options:
  - label: A
    content: 頓時、終日、剎那
  - label: B
    content: 登時、已而、一會兒
  - label: C
    content: 彈指、霎時間、須臾
  - label: D
    content: 逐日、一溜煙、終食之間。
- id: doc_111_高雄_大灣_國文_g8s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 下列疊字詞的運用，哪一項正確？
  options:
  - label: A
    content: 在「滔滔」紅塵中，有人汲汲於功名利祿的追求，也有人安貧樂道、恬然自足
  - label: B
    content: 一陣寒風吹來，樹葉「呼呼」地響，我忍不住打了個哆嗦
  - label: C
    content: 方文山寫的歌詞，透過周杰倫的歌聲詮釋，總能使人心有「悽悽」焉
  - label: D
    content: 看著別人溜直排輪的英姿，也使我有種「躍躍」欲試的衝動。
- id: doc_111_高雄_大灣_國文_g8s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: 語文中誇張鋪飾，超過了客觀的事實，叫做「誇飾」如：「遇到這樣氣勢萬鈞的大西北雨前奏，誰也不能逞英雄。」以下各句中都運用了具誇飾意義的成語，請根據上下文意判讀何者使用錯誤？
  options:
  - label: A
    content: 這次考試作弊危機，幸虧副班長阿良「一手遮天」，才化險為夷
  - label: B
    content: 媽媽發現買到黑心商品，氣的「七竅生煙」，還跑去跟商家要求退貨
  - label: C
    content: 這種八卦新聞往往會造成「眾口鑠金」的局面，讓當事人遭受莫大的傷害
  - label: D
    content: 臺灣雖然只是「彈丸之地」，但半導體產業的發展卻不容小覷。
- id: doc_111_高雄_大灣_國文_g8s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 1
  stem: 下列「 」中的詞語，何者不是狀聲詞？
  options:
  - label: A
    content: 我跟著小木船在爛泥地裡踩水，「吱嗒吱嗒」地響
  - label: B
    content: 這美麗的景觀讓人們「嘖嘖」稱奇
  - label: C
    content: 夜深了，蟬與螢越是「沾沾」自喜地恣肆歌唱
  - label: D
    content: 慈烏失其母，「啞啞」吐哀音。
- id: doc_111_高雄_大灣_國文_g8s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: '以下是小臻在國文課所做的筆記，一時大意寫錯一處。筆記中的錯處應是下列何者？


    | | | | 句數不固定（甲） | 不一定對仗 | 不可以換韻（乙） |

    | --- | --- | --- | --- | --- | --- |

    | 古 詩 | 多五言七言 | | 句數不固定（甲） | 不一定對仗 | 不可以換韻（乙） |

    | 近體詩 | 律詩 | 五言、七言 | 八句 | 一定要對仗 | 一韻到底（丙） |

    | 近體詩 | 絕句 | 五言、七言 | 四句 | 不一定要對仗（丁） | 一韻到底 |'
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
- id: doc_111_高雄_大灣_國文_g8s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 關於慈烏夜啼一詩的文意說明，下列何者最恰當？
  options:
  - label: A
    content: 「晝夜不飛去，經年守故林」可見慈烏眷戀自小生長的故鄉
  - label: B
    content: 「應是母慈重，使爾悲不任」如同「誰言寸草心，報得三春暉」的心情
  - label: C
    content: 「聲中如告訴，未盡反哺心」抒發了「養兒方知父母恩」的遺憾
  - label: D
    content: 「慈烏復慈烏，鳥中之曾參」是借慈烏來稱讚曾參不愧為廿四孝之一。
  lesson_raw:
    title: 慈烏夜啼
    basis: 題目指名「慈烏夜啼」
- id: doc_111_高雄_大灣_國文_g8s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 下列關於迢迢牽牛星一詩的敘述，何者正確？
  options:
  - label: A
    content: 迢迢牽牛星，皎皎河漢女：藉天上星宿的美麗傳說，暗寓人間別離之苦
  - label: B
    content: 纖纖擢素手，札札弄機杼：寫織女因相思無心織布，淚如雨下
  - label: C
    content: 終日不成章，泣涕零如雨：傳達人間戀人分隔兩地可望而不可即之情
  - label: D
    content: 盈盈一水間，脈脈不得語：點出有情人終成眷屬，為全詩旨意所在。
  lesson_raw:
    title: 迢迢牽牛星
    basis: 題目指名「迢迢牽牛星」
- id: doc_111_高雄_大灣_國文_g8s1e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 有關下雨天，真好一文文意的敘述，下列何者正確？
  options:
  - label: A
    content: 「我得趕緊爬上去採，採了滿籃子送左右鄰居」、「晚上就在大廳裡唱，請左鄰右舍都來聽」，從這些描寫可知下雨天的美好不是作者自己獨享，而是熱鬧、有溫馨的人情往來
  - label: B
    content: 「母親一邊做飯，一邊聽（鼓兒詞），淚水掛滿了臉頰」可見母親情感內斂，不善表達
  - label: C
    content: 「二十年了，那笛聲低沉而遙遠，然而我仍能依稀聽見，在雨中……」作者對於許多年前雨天歡樂的情景，必須藉由聽笛聲才能一一想起
  - label: D
    content: 「屋子裡掛滿萬國旗似的溼衣服，牆壁地板都冒著溼氣，我也不抱怨」是因為在下雨天不用做家事，掛滿溼衣服也不用收。
  lesson_raw:
    title: 下雨天，真好
    basis: 題目指名「下雨天，真好」
- id: doc_111_高雄_大灣_國文_g8s1e1_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 田園之秋選中「大雨滂沱，霹靂環起」一句描繪出西北雨特色之一—「狂風暴雨」，下列哪一詩句所描寫的景象與此差異最大？
  options:
  - label: A
    content: 雷霹老松疑虎怒，雨沖煙洞覺龍醒
  - label: B
    content: 風聲撼山翻怒濤，雨點飛空射強弩
  - label: C
    content: 黑雲翻墨未 遮山，白雨跳珠亂入船
  - label: D
    content: 朔風鳴淅淅，寒雨下霏霏。
  lesson_raw:
    title: 田園之秋選
    basis: 題目指名「田園之秋選」
- id: doc_111_高雄_大灣_國文_g8s1e1_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 下列對於古詩十九首的說明，何者最正確？
  options:
  - label: A
    content: 原詩本無題目，後世遂以詩的內容梗概來命名
  - label: B
    content: 內容反映東漢末年社會動亂不安，充滿離情別愁，以及生命無常的哀傷與苦悶
  - label: C
    content: 作者是南朝 梁 昭明太子 蕭統，收錄在其所作的昭明文選
  - label: D
    content: 語言質樸自然，情感真摯，是五言律詩的代表作。
- id: doc_111_高雄_大灣_國文_g8s1e1_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 小林老師說文學作品中，經常以自然界的景物透露季節的訊息。所以要讓學生回家找尋描寫「秋天」的作品，請問下列何者找錯了呢？
  options:
  - label: A
    content: 小夫：接天蓮葉無窮碧，映日荷花別樣紅
  - label: B
    content: 胖虎：隔斷紅塵三十里，白雲紅葉兩悠悠
  - label: C
    content: 大雄：水風輕、蘋花漸老；月露冷、梧葉飄黃
  - label: D
    content: 靜香：採菊東籬下，悠然見南山。
- id: doc_111_高雄_大灣_國文_g8s1e1_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: 以下節日與詩詞的配對，何者錯誤？
  options:
  - label: A
    content: 萬里此情同皎潔，一年今日最分明：清明節
  - label: B
    content: 不效艾符趨習俗，但祈蒲酒話昇平：端午節
  - label: C
    content: 河耿月涼時，牽牛織女期：七夕
  - label: D
    content: 黃花宜泛酒，青嶽好登高：重陽節。
- id: doc_111_高雄_大灣_國文_g8s1e1_s1_24
  section: 1
  number: 24
  type: single
  page: 2
  stem: 迢迢牽牛星中抒發了相思卻不得見的惆悵，下列詩歌中何者所抒發的情懷與此最為相近？
  options:
  - label: A
    content: 輕輕的我走了／正如我輕輕的來／我輕輕的招手／作別西天的雲彩
  - label: B
    content: 是時候說再見了／在能源枯竭之前／你碾著回憶轉往未來／我也該離開杳無人煙的車站
  - label: C
    content: 讓我與你握別／再輕輕抽出我的手／華年從此停頓／熱淚在心中匯成河流／是那樣萬般無奈的凝視／渡口旁找不到一朵可以相送的花／就把祝福別在襟上吧
  - label: D
    content: 靜靜的夜 月兒明又亮 照著我和你 各自在一方／寂寞的夜 滿懷相思長 付著流水 流到身旁／期待著你的音訊 別讓我迷惘。
  lesson_raw:
    title: 迢迢牽牛星
    basis: 題目指名「迢迢牽牛星」
- id: doc_111_高雄_大灣_國文_g8s1e1_s1_25
  section: 1
  number: 25
