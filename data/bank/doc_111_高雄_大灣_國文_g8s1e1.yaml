- id: doc_111_高雄_大灣_國文_g8s1e1_s2_36
  section: 2
  number: 36
  type: single
  page: 4
  stem: 二十歲的小敏從小就是個過敏兒，父母幫她在宿舍買了一臺空氣清淨機，請問她如何使用才正確？
  options:
  - label: A
    content: 小敏的宿舍坪數不大，為了活動方便，她將清淨機緊靠在窗戶對角的角落，以免影響日常生活
  - label: B
    content: 小敏一回到宿舍先開窗，因為怕活動揚起灰塵，影響清淨機運轉的效果，睡覺時才開啟清淨機過濾空氣
  - label: C
    content: HEPA 濾網太昂貴，節省的小敏覺得清淨機只要使用一般預濾網即可，且小敏有常常清洗
  - label: D
    content: 小敏的清淨機放在窗戶牆角前30 公分，傍晚一回到宿舍就先開啟清淨機再去樓下餐廳買便當。
  group_stem: "（一）\n    近年空氣品質不佳，全臺都曝露在空汙中，我們每天呼吸的空氣隱含懸浮微粒（PM2.5），PM2.5 的直徑不到頭髮28\
    \ 分之一，會隨空氣進入我們的身體裡，並隨著血液循環到全身，人體器官無法自行過濾，使得我們連呼吸空氣都有致癌的危險。空氣清淨機幾乎已成為每個家庭必備家電，如何正確使用與選擇適合自己的空氣清淨機十分重要！\n\
    一、空氣清淨機最佳使用方法\n1.HEPA 濾網：一定要按時更換，不然會影響過濾效能。\n2.預濾網（prefilter）：HEPA 空氣清淨機的外層，會有一個孔隙比較大的預濾網或初期濾網。預濾網清洗更換得越勤快，HEPA\
    \ 濾網就可以用得越久、效果越好。\n3.運轉時間：自進入房間的前幾小時到離開房間為止持續開啟空氣清淨機。然而現代人長時間在外工作，建議在睡覺時讓清淨機運轉，無人走動揚起灰塵，循環效率會更好，也能提升睡眠品質。\n\
    4.擺放位置：建議放在微粒子濃度較高區域、房間對角，或靠近窗戶的牆角，記得機身和牆壁要預留空間，讓主機能有效循環。\n5.開窗與否：使用空氣清淨機時，窗戶必須維持最小換氣量。空氣不流通，二氧化碳濃度太高，有害健康。\n\
    二、空氣清淨機功能比較：\n\n| | 原理 | 優點 | 缺點 |\n| --- | --- | --- | --- |\n| 前置濾網與預濾網 | 可過濾大顆粒灰塵與毛髮\
    \ | 1.可重複清洗<br>2.耗材花費少 | 無法過濾小顆粒 |\n| HEPA 高效濾網 | 使用精密濾網過濾空氣 | 1.過濾粉塵微粒物質<br>2.過濾塵蟎、細菌、黴菌等微生物<br>3.有效過濾PM2.5\
    \ | 1.耗材昂貴<br>2.無法分解揮發物質 |\n| 靜電集塵板（非濾網） | 以高壓的電流產生靜電，靜電集塵板吸附空氣中帶電的微粒 | 1.可重複清洗<br>2.耗材花費<br>3.噪音低\
    \ | 1.產生臭氧對呼吸道有刺激性<br>2.靜電集塵板若無定時清理將使黏附的顆粒回到空氣中 |\n\n| | 原理 | 優點 | 缺點 |\n| ---\
    \ | --- | --- | --- |\n| 活性碳濾網 | 活性碳具備吸附物質的特性 | 1.可吸附有毒物質<br>2.可吸附有機揮發氣體 | 1.僅過濾大微粒物質<br>2.活性碳壽命短<br>3.耗材昂貴\
    \ |\n| 光觸媒 | 紫外線照射產生電子、電洞，可分解有機物質成對人體無害的水和二氧化碳 | 1.無毒<br>2.價格便宜又環保 | 1.分解效果有限<br>2.須紫外線照射\
    \ |\n| 冷觸媒 | 自然分解有機物質 | 1.便宜又環保<br>2.不須紫外線照射 | 冷觸媒的研究很少，實際的作用效果仍需要更多檢驗 |\n| 負離子\
    \ | 產生電子與空氣分子結合成負離子後使懸浮物質吸附到家具與地板、牆壁表面 | 1.使汙染物質吸附家具地板<br>2.可分解有機物質 | 1.效果有限<br>2.產生臭氧刺激呼吸道<br>3.落塵會再次揚起\
    \ |"
