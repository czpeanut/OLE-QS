  group_stem: "孟子謂戴不勝曰：「子欲子之王之善與？我明告子。有楚大夫於此，欲其子之齊語也，則使齊人傅諸？使楚人傅諸？」曰：「使齊人傅之。」曰：「一齊人傅之，眾楚人咻之，雖日撻而求其齊也，不可得矣。引而置之莊、嶽之間數年，雖日撻而求其楚，亦不可得矣。子謂薛居州，善士也，使之居於王所，在於王所者，長幼卑尊，皆薛居州也，王誰與為不善？在王所者，長幼卑尊，皆非薛居州也，王誰與為善？一薛居州，獨如宋王何？」\n\
