- id: doc_111_桃園_中興_國文_g9s1e2_s1_35
  section: 1
  number: 35
  type: single
  page: 4
  stem: 從梵谷的辯解來看，他之所以被視為怪人，主因是：
  options:
  - label: A
    content: 個性孤僻，不擅人際溝通
  - label: B
    content: 家境清寒，導致服儀髒亂
  - label: C
    content: 極度認真，造成同業不堪
  - label: D
    content: 作品怪異，世人無法接納
  group_stem: "人們總認為我是一個不可理喻的怪人，我必須申明，我不是怪人。\n    的確，我常常衣冠不整，外表寒酸，不能保持莊重的模樣。這是因為我長期沒有收入，衣服是拿弟弟提奧的舊衣服改的，加上作畫時濺上的顏料，這讓我無法成為一個受歡迎的人。\n\
    \    有人說我的性格壞透了，因而無端地猜疑我，懷疑我做了什麼見不得人的事。對此，我要說的是，我不追求地位和金錢，不會為世俗去改變我的性格。我熱愛生活，我相信只要牢牢抓住生活，我的作品就會得到人們的喜愛。\n\
    \    我承認，我是一個有著明顯缺點的人，急躁的性格經常使我做出愚蠢的事，讓我在後來或多或少地感到後悔。但我從來沒有想過要去搶別人的朋友和生活，更不會謀害他人的生命。\n\
    \    我是一個生活有困難卻又從未停止努力工作的人。為了工作，我需要一個安靜的環境，需要人們的寬容，否則，我無法順利地工作。\n    我時常處在可怕的憂鬱和煩躁中，對人發無名的火，說話刺耳。我喜歡獨處，與人聚會交流，對我是一件痛苦的事。在肉體和精神上，我都是極端敏感的人，這是造成我脾氣古怪的原因，它讓我意志消沉，損害我的健康。\n\
    \    我說「我是一個藝術家」，有人因此對我進行攻擊，但我堅信我說的話。在我的理解中，藝術家就是要努力地奮鬥，不斷地探索，無條件獻身藝術事業。     \
    \ ，      ／      ／哪怕是處於崩潰的邊緣／      。因為我知道，偉大的事業不可能一蹴而就，也不是憑一時的衝動就會有成就。\n      \
    \                                                                      （改寫自梵谷〈我不是一個怪人〉）"
