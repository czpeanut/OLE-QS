  section: 1
  number: 24
  type: single
  page: 1
  stem: 漢克擔任外國歷史短劇的男主角。在劇中，他看到自己國家的街道上，插滿如附圖的旗幟。而後，又從新聞得知原來在戰爭中，外國勢力已入侵。過沒幾年，好不容易戰爭獲勝了，政府又加入華沙公約組織，落入他國的牢籠。請問：漢克最有可能扮演下列哪一身分的人？
  options:
  - label: A
    content: 美國的士兵
  - label: B
    content: 波蘭的工人
  - label: C
