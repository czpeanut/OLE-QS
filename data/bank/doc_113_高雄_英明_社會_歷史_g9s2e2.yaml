    content: 新成立的聯合國強制建國
  - label: B
    content: 國際聯盟居中協調脫貧獨立
  - label: C
    content: 受民族自決思想影響而獨立
  - label: D
    content: 英、法等國因戰事消耗，無力控制殖民地。
