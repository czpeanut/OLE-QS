- id: doc_113_高雄_英明_社會_歷史_g9s2e2_s1_25
  section: 1
  number: 25
  type: single
  page: 1
  stem: '網路上正在流行一款歷史手機遊戲「一戰風雲」。在遊戲中，主角必須進入各國歷史館，查閱該國在第一次世界大戰發生的事件，最終才能獲得獎勵。附表是四個國家在戰爭中經歷的事件，下列何者是主角在乙國歷史館會看到的內容？


    | 代號 | 事件 |

    | :--- | :--- |

    | 甲 | 支持塞爾維亞，而與奧匈帝國敵對。 |

    | 乙 | 因德國實施無限制潛艇政策而參戰。 |

    | 丙 | 原本是同盟國的一員，中途退出戰場。 |

    | 丁 | 國內發生革命，中途退出戰爭。 |'
  options:
  - label: A
    content: 參與巴黎和會，提出民族自決
  - label: B
    content: 運用外交手段，完成獨立建國
  - label: C
    content: 戰爭引發抗爭，實行恐怖統治
  - label: D
    content: 成立共產國際，建立共產政權。
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 歷史
      code: 2-2
      title: 第一次世界大戰
      chapter: 第2章 帝國主義與第一次世界大戰
    textbook: 九下歷史 2-2 第一次世界大戰
    labeled_by: ai
- id: doc_113_高雄_英明_社會_歷史_g9s2e2_s1_26
  section: 1
  number: 26
  type: single
  page: 1
  stem: 冷戰時期，美、蘇兩國一方面處於衝突競爭的狀態，另一方面又避免引起全面戰爭，但是國際上仍然出現區域性的危機和衝突。1960 年代，蘇聯在某地興建飛彈基地，直接威脅美國本土的安全，美蘇兩國為此瀕臨戰爭邊緣，甚至有人認為這是最接近第三次世界大戰的時刻。請問：當時蘇聯在哪一地方興建飛彈基地?
  options:
  - label: A
    content: 巴西
  - label: B
    content: 古巴
  - label: C
    content: 柏林
  - label: D
    content: 巴拿馬。
  tags:
    chapter:
      publisher: 翰林
