  section: 1
  number: 28
  type: single
  page: 1
  stem: 第二次世界大戰結束後，原本是殖民地的非洲、南亞及拉丁美洲等地，紛紛成立了許多新興的國家。請問:上述新興國家可以獨立建國的原因為何？
  options:
