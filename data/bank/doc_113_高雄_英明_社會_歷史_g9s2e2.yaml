    | 乙 | 威爾遜-第一次世界大戰結束後，提出民族自決，此風潮促使日本更改統治臺灣的方針，進入皇民化運動時期 |

    | 丙 | 門羅-發表「門羅宣言」，強調美洲的事務由美洲國家自行解決，反對歐洲國家干預 |

