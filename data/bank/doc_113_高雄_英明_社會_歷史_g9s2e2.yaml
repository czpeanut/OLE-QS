  - label: C
    content: 西元1949 年柏林分為東西兩區，東德政府建起柏林圍牆，隔絕人民往西柏林
  - label: D
    content: 以色列建國後陸續跟周遭的國家爆發多次戰爭，甚至引起能源危機，台灣身受其害苦不堪言。
