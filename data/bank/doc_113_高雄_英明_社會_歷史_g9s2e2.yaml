  section: 1
  number: 23
  type: single
  page: 1
  stem: 《西線無戰事》是德國作家雷馬克的反戰小說，雷馬克以自身經歷過的第一次世界大戰為基礎構思。該書因帶有強烈的反戰意識，曾於1930 年代被查禁，雷馬克也因猶太人的身分被撤銷國籍。本書出版後不久即遭到查禁，作者也被撤銷德國國籍。此事可能與下列哪些德國的政策直接相關？甲、實施極權統治；乙、積極建設經濟；丙、積極迫害猶太人；丁、宣布廢除凡爾賽條約
  options:
  - label: A
    content: 甲丙
  - label: B
    content: 甲乙
  - label: C
    content: 乙丙
  - label: D
    content: 甲丁。
