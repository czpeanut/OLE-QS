  section: 1
  number: 27
  type: single
  page: 1
  stem: 德國之聲電視台正在報導第二次世界大戰之後德國境內的政治發展，德國為美、英、法、蘇四國分區佔領;而東歐部分地區，例如波蘭、匈牙利、捷克等也被蘇聯所接收。請問：上述情況是哪一場會議所形成的結果？
  options:
  - label: A
    content: 開羅會議
  - label: B
    content: 萬隆會議
  - label: C
    content: 雅爾達會議
  - label: D
    content: 巴黎和會。
