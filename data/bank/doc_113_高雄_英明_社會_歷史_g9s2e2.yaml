  section: 1
  number: 22
  type: single
  page: 1
  stem: '小涵在圖書館看到一份歷史文獻呈現1932 年某項數據的最大值，如右表。此情況對當時的社會造成嚴重問題，許多人忍受不了痛苦而自殺，治安惡化，各城市排隊領救濟食物的窮人長達幾個街區。由此可知，這些數據最可能代表下列何者？


    | 國家 | 人數 |

    | :--- | :--- |

    | 美國 | 1370 萬 |

    | 德國 | 560 萬 |

    | 英國 | 280 萬 |'
  options:
  - label: A
    content: 移民人數
  - label: B
    content: 失業人數
  - label: C
    content: 戰爭傷亡人數
  - label: D
    content: 黑奴輸入人數。
