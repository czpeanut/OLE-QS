- id: doc_113_台中_大業_社會_歷史_g7s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 原住民講話會加「的啦」的刻板印象，來自1988 年的電影《報告班長2》，片中飾演班長的施孝榮，在片中帶著濃濃的原住民腔，講話都會加上「的啦」作為語助詞，引起觀眾哄堂大笑。本以為是自娛娛人，20
    年後才揭曉，根本是配音員自行加上。原住民在漢人的發展進程，扮演著被剝削者，不只生存空間被掠奪，也遭受來自媒體、教育的文化暴力，使部分原住民在漢人文化霸權下，對於自己的族群產生自卑，成為介於原住民和漢人中的邊緣人。試問，以下關於戰後原住民的評述何者正確？
  options:
  - label: A
    content: 「山胞」係日治時期日本人對高山族原住民的稱呼
  - label: B
    content: 面對土地流失，許多原住民離開部落，前往都市從事第一級產業應付社會變遷
  - label: C
    content: 在原住民的努力爭取下，現今平埔族原住民已獲得國家法定原住民的身分
  - label: D
    content: 「你的篳路藍縷，是我的顛沛流離」這句話應是自原住民的角度出發
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 歷史
      code: 6-2
      title: 社會與文化的變遷
      chapter: 第6章 戰後臺灣的經濟與社會
    textbook: 七下歷史 6-2 社會與文化的變遷
    labeled_by: ai
- id: doc_113_台中_大業_社會_歷史_g7s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '下為四位中華民國總統的發言，試就內容分析後按出現順序進行排序。

    甲：「我們本漢賊不兩立的立場及維護憲章之尊嚴…同時聲明，對本屆大會通過此項違反憲章規定的非法決議，我國政府與全中國人民，決不承認其有任何效力。」

    乙：「今美國政府不顧道義和信守，與匪建交……在此國家遭逢重大困難的時刻，我首先要為全國同胞指出：這正是我中華兒女為了自身安全與幸福，為了國家前途與人類正義，拿出最大決心與力量的時候。」

    丙：「在我們背後的，是兩岸分隔超過一甲子的歷史；在我們眼前的，是這幾年來，雙方致力「以對話取代對立、以和解替代衝突」的成果；在我們手上的，是永續和平與繁榮的目標。此時此刻，海峽兩岸正大聲向全世界宣示鞏固臺海和平的決心，以及促進區域和平的訊息」'
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙甲丙
  - label: C
    content: 甲丙乙
  - label: D
    content: 乙甲丙。
  tags:
