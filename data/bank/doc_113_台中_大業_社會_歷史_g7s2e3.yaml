  stem: 潑水節是傳統緬甸及泰國的新年習俗，其用意是除去前一年的災厄，並為來年祈福，潑水的動作意謂著為對方帶來好運。近年來，新北市政府定期舉辦潑水節，藉由潑水儀式，祈求新的一年運勢更好。請問透過舉辦這項活動可以反映何種社會風貌？
