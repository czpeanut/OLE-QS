  group_stem: '27~28 為題組。歷史課後，秀彬整理戰後臺灣各階段經濟發展資料，內容如下

    甲：政府提供廠房、公共設施（完善的水電、通訊、道路等）、租稅減免等優惠條件，吸引外國商人來臺灣投資，將成品加工，再將產品出口，拓展海外市場。

    乙：隨著一系列國家基礎建設逐步展開，創造大量就業機會，帶領臺灣走出全球性的經濟衰退，加速經濟及社會的發展，並對臺灣經濟起飛有巨大的貢獻。

    丙：臺灣政府藉美援物資中的棉花、棉紗來發展紡織業，以小麥、黃豆來發展麵粉、食油與飼料工業。同時配合政策，以國營四大公司股票換取地主土地，做為發展工業的資金。

    丁：政府決定推動經濟轉型，強調消耗能源少、低汙染、技術密集、高附加價值的「策略性工業」，如機械、資訊、電子等，將臺灣打造成「科技島」。'
