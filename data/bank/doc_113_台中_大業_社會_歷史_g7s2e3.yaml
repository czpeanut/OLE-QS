- id: doc_113_台中_大業_社會_歷史_g7s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 「『十萬青年十萬肝，GG 輪班救臺灣(GG：台積電)』為近年內在網路上流行的俗諺，一方面暗諷台積電不分日夜工作的爆肝生活，一方面也點出晶圓代工業為帶動臺灣經濟發展的一大支柱的現實。當路上無燈，街上無人的時候，工程師們仍然還在公司內獻出自己的肝臟，就像可替換式的零件一樣，源源不絕地一批替換著一批。」試問，關於臺灣高科技產業的發展敘述何者正確？
  options:
  - label: A
    content: 台灣發展高科技產業的背景為石油危機
  - label: B
    content: 為了解決當時發展高科技產業需要的能源，政府以發展再生能源的方式來解決問題
  - label: C
    content: 當時傳統勞力密集性工業，面臨鄰近國家如中國、東南亞的挑戰
  - label: D
    content: 最早的科學園區設置於臺中。
  tags:
