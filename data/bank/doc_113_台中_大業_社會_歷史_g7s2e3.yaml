  group_stem: '29~30 為題組。以下三則資料為20 世紀的臺灣小說之部分節錄，試閱讀後並分析其背景回答問題

    資料一：「整個共產黨的將來，也一定要像一陣旋風。他們雖然蓬勃一時，然而終必轉瞬即逝，消滅得無蹤無影，變成歷史的陳跡。⋯⋯旋風，旋風，他們不過是一陣旋風！」

    資料二：「讓阿凸仔(外國人)大開眼界，終身難忘。他講不要忘啦！這回我們訓練出來的酒吧女是要與美軍接觸，可說是從事一項內心對內心，屁股對屁股的外交活動。—他是這樣講的呀！內心對內心，屁股對屁股(實際說的是：Nation
    To Nation.People To People），誰知道是什麼意思！」

    資料三：「阿珠把小孩子遞給他，跟著走進屋子裡。但是阿龍竟突然的哭起來，儘管坤樹怎麼搖，怎麼逗他都沒用。阿龍愈哭愈大聲……阿龍不但哭得大聲，還掙扎著將身子往後倒翻過去，像早上坤樹打扮好要出門之前，在阿珠的懷抱中想掙脫到坤樹這邊來的情形一樣……坤樹把小孩子還給阿珠。心突然沉下來。他走到阿珠的小梳妝台，坐下來，躊躇的打開抽屜，取出粉塊，深深的望著鏡子，慢慢的把臉塗抹起來……因為抑制著什麼的原因，坤樹的話有點顫然地：『我要阿龍，認出我……』」'
