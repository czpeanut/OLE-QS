- id: doc_113_台中_大業_社會_歷史_g7s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 那天夜晚，七海官邸內的燈亮了，總統被突如其來的燈光驚醒，當時打開電燈的，是時任總統秘書宋楚瑜，他小心翼翼地說了：「美國大使安克志大使緊急求見。」那一夜，世界的歷史改變了。當時的總統依照《動員戡亂時期臨時條款》，宣布例行性選舉延期，引發黨外勢力不滿，於是在世界人權日走上街頭，要求恢復選舉，主張由臺灣人民決定自己的前途和命運。然而本次的遊行最後遭到政府的鎮壓，主事者皆被判十年以上徒刑。黨外勢力並不因此氣餒，反而在全台展開大串聯，於隔年的選舉大有斬獲，取得許多中央議員席次。試問，那天夜晚，安克志大使可能向總統說了什麼？
  options:
  - label: A
    content: 我國決定支持以中華人民共和國取代中華民國於聯合國中代表席次之議案
  - label: B
    content: 我國決定廢除與貴國的軍事協定，但我國總統會制訂新的法律來確保兩國間的交流關係
  - label: C
    content: 總統請放心，為確保臺灣不受朝鮮戰事波及，我國已派遣海軍巡防臺灣海峽
  - label: D
    content: 非常遺憾，我國總統決定承認北京政府乃唯一合法的中國政府。
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 歷史
      code: 4-2
      title: 戒嚴體制與白色恐怖
