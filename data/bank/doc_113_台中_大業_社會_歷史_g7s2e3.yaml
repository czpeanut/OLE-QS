  page: 1
  stem: 2020 十二月，新冠肺炎盛行，我國滯留於武漢的部分國民，在兩岸政府協商後以包機方式返台。然而，一部分被稱為「小明」尚未取得我國國籍的的中配子女，寒假隨父母返中時，因我國防疫政策升級而無法返台。某行政單位長官言，此種中配前親子女，實際長期住在臺灣，生活與臺灣人無異，只是因制度問題而尚未取得我國國籍，站在人道角度考量，應讓「小明」們返台。試問，文中所提及某行政單位是指何機構？
