  number: 13
  type: single
  page: 2
  stem: 1960 年代臺灣經濟發展迅速，幾乎每年經濟成長率皆超過8%，被視為東亞發展型國家的典範，甚至有「臺灣奇蹟」的美稱。試問，何者係是當時臺灣經濟成長的因素？
  options:
  - label: A
