  stem: '以下係四則關於二十世紀中華民國外交的相關記錄，試將以下四則記錄按出現順序排列

    （甲）臺灣人民拿著「卡特無恥（卡特：時任美國總統）」的標語，抗議美匪建交，群聚在臺北松山機場外，朝著來訪的美國代表團車輛，激憤的丟擲雞蛋……，四周不斷的傳出民眾憤怒的抗議聲……。

