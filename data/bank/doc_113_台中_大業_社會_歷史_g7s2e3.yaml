- id: doc_113_台中_大業_社會_歷史_g7s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: '以下是某法律文件的截取內容

    由於美國總統已終止美國和臺灣統治當局間的官方外交關係（在甲年一月一日前，美國承認臺灣為乙），美國國會為以下目的，認為有必要制訂本法。

    1.有助於維持丙地區的和平、安全及穩定；

    2.授權繼續維持美國人民及臺灣人民間的商務、文化及其他各種關係，以促進美國外交政策的推行。

    試問：文中的「丙」最有可能指哪一區域？'
  options:
  - label: A
    content: 大西洋
  - label: B
    content: 東太平洋
  - label: C
    content: 西太平洋
  - label: D
    content: 巴士海峽。
