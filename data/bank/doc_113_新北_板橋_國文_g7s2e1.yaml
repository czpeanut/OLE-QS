- id: doc_113_新北_板橋_國文_g7s2e1_s2_26
  section: 2
  number: 26
  type: single
  page: 7
  stem: 在一個風和日麗的禮拜四，不惑之年的廣志與而立之年的美冴，計畫帶著七歲的小新、古稀之年的爺爺及花甲之年的奶奶，一家五口前往參觀國立臺灣史前文化博物館，他們總共應支付多少門票費用？
  options:
  - label: A
    content: 300 元
  - label: B
    content: 360 元
  - label: C
    content: 400 元
  - label: D
    content: 460 元。
  group_stem: "(四)\n    臺灣東部第一座國家級博物館「國立臺灣史前文化博物館」，源自於卑南文化遺址的發現。博物館擁有世界級建築設計與豐富的展品，並規劃了親近宜人的戶外場域，摩艾石像以及館外綿延的草坪地景等深受旅客喜愛的特色造景。內部常設展分為三個主要展廳：「臺灣史前史廳」呈現百年來的考古發現，引導探索臺灣史前歷史；「南島廳」以南島族群視角介紹大洋文化，並連結世界文化互動；「臺灣自然史廳」透過誕生、冰期、新世代等三個展示室展示不同時期的臺灣自然歷史。「探索館」則是俱備舒適的軟硬體設備，空間中也設置許多原住民族藝術家創作的藝術作品，以公共設施結合圖畫或是透過繪本、遊戲和展示引導親子了解史前文化與原住民議題。\n\
    \    史前文化博物館是來臺東的必訪之地，雖多為考古遺址出土文物，卻以生動的文創作品呼應當代的議題，使文物與生活結合，拉近與民眾的距離。特別是善用古文物特徵創作的人獸形玉玦，Q\
    \ 版的形象受到許多孩童喜愛，更加深對臺灣史前文化之美的理解。1980 年代，因臺東車站新建工程發現卑南文化遺址，是臺灣最完整的石板棺墓葬群；國立臺灣史前文化博物館因此而成立。跟隨國立臺灣史前文化博物館的腳步，探訪珍貴玉器國寶、擁抱世界的南島文化與認識臺灣島誕生至今土地的故事。\n\
    一、參觀時間\n\n| 開放時間 | 週二至週日09:00〜17:00 |\n| :--- | :--- |\n| 休館時間 | 週一(遇國定假日、補假日、選舉日則照常開放)、農曆除夕、年初一\
    \ |\n\n＊2025 年連假期間特殊開館及休館日期\n1、農曆新年期間：開館 1/25(六)〜1/26(日)、1/30(四)〜2/2(日)  休館 1/27(一)〜1/29(三)\n\
    2、中秋連假期間：開館 10/4(六)〜10/6(一)  休館 10/7(二)\n二、展示廳票價資訊(售票截止時間至16:30)\n\n| 票種 | 金額\
    \ | 條件 |\n| :--- | :--- | :--- |\n| 全票 | NT$ 100 | 一般民眾 |\n| 團體票 | NT$ 80 | 購買全票者達20\
    \ 人(含)以上 |\n| 優待票 | NT$ 60 | 1、6 歲以上未滿12 歲之兒童 2、持教育部立案學校有效學生證者 |\n| 免費及其他 | |\
    \ 1、未滿6 歲之兒童免費<br>2、65 歲以上長者平日免費、假日半價<br>3、領有身心障礙手冊者及一位必要之陪伴者皆免費<br>4、持有志願服務榮譽卡者免費\
    \ |\n\n備註：凡購買優待票及免費票者，敬請出示相關身份證明文件，未攜帶者請依規定購票。\n＊本館優惠活動\n˙教師及學生優惠：每週三憑相關證件，可免費參觀。\n\
    ˙臺東縣優惠：(1)身份證字號開頭為V 或設籍臺東縣者，憑相關證件可享優惠票價40 元。\n            (2)任職於臺東縣各公私立機關單位者，須憑有效身份證件或工作證明，可享優惠票價40\
    \ 元。\n(節選自臺東觀光旅遊網、國立臺灣史前文化博物館官網)"
  answer:
  - B
