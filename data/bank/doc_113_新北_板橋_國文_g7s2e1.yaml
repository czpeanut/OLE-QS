  stem: 關於孩子的鐘塔一文，下列敘述何者錯誤﹖
  options:
  - label: A
    content: 尼可拉斯過世後，捐出的器官救助七名病人，「這些人，當然全是義大利人」可見格林夫婦未因喪子而陷入仇恨，可說是以德報怨
  - label: B
    content: 尼可拉斯的動人事跡，使器官捐贈的行為忽然成倍成倍地增加，不僅改變許多人對器官捐贈的保守概念，更改變許多病人的命運，這個現象被稱為「尼可拉斯效應」
  - label: C
    content: 「鐘塔下滿置著花束、小汽車、玩具熊、零錢……顯然許多來訪的人，都準備了一份送給七歲男孩的小禮物」可見人們對尼可拉斯的感念，及格林一家的大愛獲得迴響
  - label: D
    content: 格林夫婦用來紀念尼可拉斯的「高貴的方式」，即透過媒體和文字，讓世人了解生命無常，更要珍惜當下。
