  group_stem: "(四)\n    臺灣東部第一座國家級博物館「國立臺灣史前文化博物館」，源自於卑南文化遺址的發現。博物館擁有世界級建築設計與豐富的展品，並規劃了親近宜人的戶外場域，摩艾石像以及館外綿延的草坪地景等深受旅客喜愛的特色造景。內部常設展分為三個主要展廳：「臺灣史前史廳」呈現百年來的考古發現，引導探索臺灣史前歷史；「南島廳」以南島族群視角介紹大洋文化，並連結世界文化互動；「臺灣自然史廳」透過誕生、冰期、新世代等三個展示室展示不同時期的臺灣自然歷史。「探索館」則是俱備舒適的軟硬體設備，空間中也設置許多原住民族藝術家創作的藝術作品，以公共設施結合圖畫或是透過繪本、遊戲和展示引導親子了解史前文化與原住民議題。\n\
    \    史前文化博物館是來臺東的必訪之地，雖多為考古遺址出土文物，卻以生動的文創作品呼應當代的議題，使文物與生活結合，拉近與民眾的距離。特別是善用古文物特徵創作的人獸形玉玦，Q\
    \ 版的形象受到許多孩童喜愛，更加深對臺灣史前文化之美的理解。1980 年代，因臺東車站新建工程發現卑南文化遺址，是臺灣最完整的石板棺墓葬群；國立臺灣史前文化博物館因此而成立。跟隨國立臺灣史前文化博物館的腳步，探訪珍貴玉器國寶、擁抱世界的南島文化與認識臺灣島誕生至今土地的故事。\n\
