  stem: 關於紙船印象一文的說明，下列何者正確﹖
  options:
  - label: A
    content: 「我曾經有過許多紙船，在童年的無三尺浪的簷下水道航行，使我幼時的雨天時光，特別顯得亮麗充實，讓人眷戀」可見紙船為作者留下許多溫馨美好的回憶
  - label: B
    content: 「各色各樣的紙船或列隊而出，或千里單騎，或比肩齊步，或互相追逐」除了紙船，與鄰居賽跑也是作者童年難忘的回憶之一
  - label: C
    content: 「我們住的是低矮簡陋的農舍，簷下無排水溝，庭院未鋪柏油，一下雨，便泥濘不堪」作者藉此凸顯當時農業社會貧富差距極大
