- id: doc_113_新北_板橋_國文_g7s2e1_s2_22
  section: 2
  number: 22
  type: single
  page: 5
  stem: 根據本文內容，下列敘述何者正確？
  options:
  - label: A
    content: 跳繩是屬於全身運動，僅有助於鍛鍊腹部肌肉
  - label: B
    content: 每次跳躍與地面產生的衝擊，都會使軟骨受傷
  - label: C
    content: 心血管疾病患者只要勤加跳繩，都能恢復健康
  - label: D
    content: 平衡感及協調性不佳者，定期跳繩會有所助益。
  group_stem: "(二)\n＊跳繩好處有哪些？\n  1、改善心血管健康：跳繩是一種很好的有氧運動，能提高你的心跳速率，並有助於降低心血管疾病的風險。專家指出，根據你跳繩的速度，它還可能讓你達到無氧的心血管運動，這意味著它是一種短時間、高強度的運動形式。\n\
    \  2、全身性鍛鍊：跳繩是一種全身運動，運動時需要使用腹部肌肉來穩定身體，腿部肌肉來跳躍，肩膀和手臂來轉動繩子。因此，它提供的是一個全身性的鍛煉，而不僅僅是集中於身體的某一部分。\n\
    \  3、提高協調性：跳繩需要協調性，將跳躍的時機與繩子的旋轉同步，有研究顯示，定期跳繩可以改善你的平衡感和協調性。\n  4、增加骨密度：隨著年齡增長，你的骨密度會下降，增加骨折或骨質疏鬆症的可能性。但研究顯示，跳繩有助於保持骨骼強健，由於跳繩每次跳躍都會與地面產生衝擊，這些衝擊促使我們的骨骼進行重塑，使其變得更強壯，從而增加骨密度。除此之外，提高骨密度和平衡能力可以減少未來跌倒的機會。\n\
    ＊多久進行一次跳繩？\n      專家建議，你可以每週跳繩兩到三天，讓跳繩可以成為你運動計畫的一部分，幫助達到每週150 分鐘中等強度或75 分鐘高強度有氧運動的官方建議。每次跳繩的時間長短取決於你，假如一次只能跳30\
    \ 秒也沒關係，你可以逐步增加時間。\n      無論你跳的時間長短，正確的跳繩方式非常重要，因為跳繩和跑步在所涉及的力量和衝擊方面是相同的。首先，你需要確保跳繩的長度適合你，在跳躍時，稍微彎曲膝蓋，並保持手臂靠近身體，此時，嘗試保持肩膀和脖子放鬆，並且避免聳肩，動作主要集中在你的手腕上，當雙腳與地面接觸時，確保著地輕柔安靜。如果你打算將跳繩納入運動計畫的一部分，做一些小腿加強和拉伸運動可能會有幫助。\n\
    \      專家提醒，若你過度跳繩，像是每天跳或跳很長時間，這可能會引起足踝問題，甚至膝蓋都會有影響，除此之外，跳繩時最好穿著運動鞋。\n(節錄自聯合新聞網)"
  answer:
  - D
