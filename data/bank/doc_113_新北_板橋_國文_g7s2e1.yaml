  - label: C
    content: 兒子為替父親報仇，在追殺白鹿時不慎摔傷，終身無法握弓
  - label: D
    content: 因為鹿角上的七星符，孫子才發現白鹿實為其祖父所變。
  group_stem: 昔番陽郡 安樂縣有人姓彭，世以捕射為業，兒隨父入山，父忽蹶然倒地，乃變成白鹿，兒悲號追，鹿超然遠逝，遂失所在，兒於是不捉弓終身。至孫複學射，忽得一白鹿，乃於鹿角間得道家七星符，並有其祖姓名年月分明，視之惋悔，乃燒去弧失。                 (改寫自列異傳)
