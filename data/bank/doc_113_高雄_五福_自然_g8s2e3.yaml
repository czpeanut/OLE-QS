  stem: 「第一種人工合成的高分子聚合物是在 1908 年，由美國人雷奧．貝克蘭德以苯酚和甲醛做成的『酚醛樹酯』，特性是不吸水、不導電、耐高溫、強度高，因為多用在電器上，製成電路板，所以又稱電木。」根據以上文字內容，判斷下列關於電路板材質的性質敘述和結構示意圖，何者正確？
  options:
  - label: A
    content: 加熱後會熔化
