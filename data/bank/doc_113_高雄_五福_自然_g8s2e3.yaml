- id: doc_113_高雄_五福_自然_g8s2e3_s1_50
  section: 1
  number: 50
  type: single
  page: 7
  stem: 下列相關敘述，哪些正確？
  options:
  - label: A
    content: 新鮮油脂本身屬於脂肪酸類
  - label: B
    content: 油炸過後的油只要經過一定的過濾與加入某些藥劑，保持顏色清澈便安全無虞
  - label: C
    content: 測定酸價時，可利用氫氧化鉀中和 1 克油脂所需要的毫克數求得
  - label: D
    content: 汽油加入氫氧化鈉溶液可以製成肥皂。
  group_stem: "請給廢油一個重生機會\n  每個家庭、小吃攤販、餐廳幾乎都會有油炸廢油產生。若油經油炸使用過久，更容易使油脂產生分解而生成游離脂肪酸（RCOOH），這是油產生酸敗，亦是變質的現象之一，通常採用酸價來表示油脂酸敗的程度。酸價的定義是指平均中和\
    \ 1 克油脂含有的游離脂肪酸所需要的 KOH 毫克數，反應式如下：\nRCOOH＋KOH → RCOOK＋$H_{2}O$\n  新鮮油脂所含的游離脂肪酸濃度極低，因此酸價低，以\
    \ CNS（國家標準）來說，品質良好的食用油脂酸價需在 0.2 毫克 KOH∕克油脂以下，當酸價增加時，即表示油脂已有酸敗變質的現象，酸價愈高愈不宜食用。一般而言，油脂的酸價大於\
    \ 2 毫克 KOH∕克油脂便不可再食用，應立即更換新油。\n  大多數人認為最容易且方便的處理廢油方法，就是倒入廚房水槽、下水道或馬桶沖掉，讓油順著管線流走，眼不見為淨，但是卻沒有去思考，油脂不溶於水，排入水管後形成的脂化物硬塊會阻塞管線，甚至堆積在水溝或下水道。臺灣地區目前汙水下水道系統的接管率仍偏低，換句話說，有絕大部分倒在水槽裡的油汙都沒有妥當處理，因此廢油會直接進入水溝或河川中，造成惡臭並使得水質變壞，魚、蝦等水中生物都無法生活，破壞生態平衡。\n\
    \  在了解到油脂對河川的汙染性後，如何防止汙染源繼續危害環境便成為一大課題。除了廢油回收管道之外，政府預期發展廢油轉製為生質燃料油原料；而民眾除了環保自覺之外，部分環保團體發揮民間社團的力量，呼籲民眾集中回收不再繼續食用的油品或已過濾乾淨的油炸用油，並透過製成肥皂，讓廢油可以重生再利用。環保團體的環保志工們不僅展開廢油募集行動，教導民眾\
    \ DIY 製作環保肥皂，也鼓勵使用肥皂來清除油汙髒垢，同時減少使用合成清潔劑，避免造成河川另一種汙染。推廣再生皂不僅是給廢油一個再生機會，更重要的是傳達廢物再利用的概念，作為另一種形式的環境保護教育。\n\
    \  肥皂的原料是油脂，例如：牛油、椰子油、棕櫚油等，加入氫氧化鈉溶液，便可以將油脂皂化成肥皂。再生皂的製作方法如下：\n\n步驟(一)：將 700 克的廢食用油先以網篩濾除殘渣，再和\
    \ 300 克的椰子油一起倒入不鏽鋼鍋中。\n步驟(二)：將 370 克的冷水倒入量杯中，並取鹽 1 大匙、糖 1 大匙加入水中用攪拌棒（可使用打蛋器）拌勻。再將\
    \ 160 克的氫氧化鈉慢慢倒入量杯中溶解、拌勻，並降溫至 40 ～ 50 ℃。\n步驟(三)：邊攪拌邊將步驟(二)量杯中的溶液緩緩倒入不鏽鋼鍋中與廢食用油混合，過程中需攪拌至少\
    \ 20 分鐘後休息再繼續攪拌，若持續攪拌則可以縮短皂化反應時間。每隔一段時間必須攪拌一次，尤其要把鍋邊較濃稠部分混入溶液中，重複此步驟到整鍋溶液呈現濃稠狀（似美乃滋），此時也可以加入欲添加之香精、精油或色料。\n\
    步驟(四)：把溶液倒入預先準備的模具容器中，靜置三天後再脫模，便可得肥皂，其必須放置一個月後，才能使用（放愈久，會愈硬、愈好用）。\n註 1：全程須戴手套，因氫氧化鈉具腐蝕性，且與水混合時會產生熱氣（煙霧之類），務必注意安全！\n\
    註 2：加入少許糖可讓肥皂易起泡；加入少許鹽可加強肥皂硬化；加入少許醋可除臭。"
