  group_stem: "切開的蘋果變色了？！\n  切開蘋果放置一段時間後，蘋果果肉會變成黃褐色，很多人誤以為是蘋果中的鐵質氧化造成，但其真正的原因是蘋果中所含的多酚類化合物，當切開蘋果時會破壞內部結構，使果肉內的多酚類與多酚氧化酵素（polyphenol\
    \ oxidase）和氧氣接觸，多酚類在酵素催化下進行氧化反應形成鄰醌，再經過聚合反應而變成褐色的色素，稱為酵素性褐變。多酚氧化酵素屬於一種蛋白質，會受到環境影響而變性。\n\
    \  褐變反應速率的影響因素有：接觸的氧氣濃度大小、多酚氧化酵素活性大小、多酚氧化酵素含量多寡、多酚類含量多寡等。不同水果、蔬菜內含的多酚氧化酵素含量不同，活性不同，而溫度與維生素\
    \ C 這些外在因素則會影響酵素的活性，導致變色時間也不同。"
