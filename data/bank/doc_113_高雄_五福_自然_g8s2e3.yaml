  group_stem: "現代人注重休閒生活，有時會想出遠門渡假幾天，家裡如果有飼養貓、狗等寵物，沒有人可以幫忙餵食或倒水將是一大煩惱。\n  我們可以藉由基礎的理化概念，動手\
