  group_stem: "想像一下，穿在身上一整天的髒衣服，回家後不必脫掉，直接進浴室洗澡便可將衣服「洗」去，不會再有洗衣、晾衣的家事，這種便利性極高的產品可能即將成真！\n\
    \    最近，一位英國時尚學院的教授在廣播節目中，聽到化學教授談起能夠分解的塑膠，引起了他的興趣，於是時尚界和化學界一同合作激盪出了一項藝術品—可溶於水的衣服。構成這種衣服的布料主要由聚乙烯醇組成，是一種石油化學聚合物，與傳統的天然或合成纖維布料的性質有很大的差異，更特別的是能夠溶解在水中，因此在下大雨的時候，可能真的會讓人變成衣不蔽體的窘狀。這種衣料在生活中的實用性並不高，但可以將其運用在只穿一次就須焚毀的手術衣上，以減少焚燒造成的汙染。試回答第42~44\
