  - label: D
    content: Staying home without going to work
  group_stem: 'I.  Going camping during holidays is more and more popular with young
    parents.


    Take Allen and Lisa for example. After a week of busy work and having no time
    to be with their two sons, Tony and Jacob, Allen and Lisa sometimes take them
    to go camping. Camping is a lot of fun.   26   can be a fresh experience to their
    family. Because they don’t have to do anything about work or study, there is much
    of time for leisure and activities. For children, it can be a great time   27  .
    For parents, they can get back away from their heavy work.


    During summer time, there are many exciting things to do in the water when their
    campsite is near a lake, a river, a pool or a beach. Another part of the joy of
    camping is   28  . Allen and Lisa can take their sons to go bird watching, bug
    collecting, leaf collecting and do many other things. Even when it is rainy, they
    read together in the tent, play card games or enjoy playing in the rain. All this
    makes them   29   again and again. They like camping because it takes Allen’s
    family away from TV, smartphones, and the Internet. Camping helps the family love
    each other more!

     leisure 悠閒'
