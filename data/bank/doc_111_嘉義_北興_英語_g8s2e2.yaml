  group_stem: "III.  Beyond Burger is a new kind of burger from the USA. It’s getting\
    \ more and more popular these days. It looks like a beef burger, but there is\
    \ no meat inside.\n     Ethan Brown made the first Beyond Burger in the world.\
    \ He wanted everyone to eat healthy food, and at the same time, he didn’t want\
    \ any animals to die for it. Besides, these burgers are more friendly to the Earth\
    \ than beef burgers because they need less water and land to produce.\n     Some\
    \ people may ask the questions: “Does this kind of burger have more nutrition\
    \ than a beef burger?” Well, the answer is yes and it even tastes more delicious.\
    \ Now a few shops in Taiwan are selling Beyond Burgers. Why not give them a try?\
    \ Eat well and be healthier!\n produce 生產     nutrition 營養"
