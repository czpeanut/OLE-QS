- id: doc_113_台中_向上_自然_g8s1e2_s1_43
  section: 1
  number: 43
  type: single
  page: 3
  stem: 彩虹是氣象中的一種光學現象。當陽光照射到天空中的水珠，會形成拱形的七彩光譜。其實只要空氣中有水滴，而陽光正在觀察者的背後以低角度照射，便可能產生可以觀察到的彩虹現象。彩虹最常在雨後剛轉天晴時出現。形成彩虹的光學原理為陽光射到空中接近球形的小水滴，光線被折射及反射造成色散而成(如圖)。陽光射入水滴時會同時以不同角度入射，在水滴內亦以不同的角度反射後再折射到空氣中。當中以40
    至42 度的反射最為強烈，這是為什麼彩虹很少在中午出現的原因。。根據上面敘述，在下雨過後，以下何種情形最容易看到彩虹？
  options:
  - label: A
    content: 早上8 點人面向東方天空
  - label: B
    content: 中午12 點人面向西方天空
