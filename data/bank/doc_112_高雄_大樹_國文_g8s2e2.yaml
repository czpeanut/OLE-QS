- id: doc_112_高雄_大樹_國文_g8s2e2_s3_6
  section: 3
  number: 6
  type: single
  page: 1
  stem: 「我是天空裡的一片雲，/ 偶爾投影在你的波心── / 你不必訝異，更無須歡喜──/ 在轉瞬間即消滅了蹤影。   你我相逢在黑夜的海上，/ 你有你的，我有我的，方向。/
    你記得也好。 / 最好你忘掉，/ 在這交會時互放的光亮!」（徐志摩 〈偶然〉）關於本詩的內容，下列何者說明錯誤？
  options:
  - label: A
    content: 「我是天空裡的一片雲」點出「我」的飄忽不定
  - label: B
    content: 「偶爾投影在你的波心」指「我」不經意觸動了「你」的心弦
  - label: C
    content: 「你有你的，我有我的，方向」意謂「你」和「我」久別重逢後，終能白頭偕老
  - label: D
    content: 「你我相逢在黑夜的海上」比喻雙方在茫茫人海中偶遇
