  stem: "請判斷下文的表達方式是屬於下列哪一種文體？\n    大型爬蟲類曾統治地球長達一億五千萬年，也就是指恐龍，其中包括地震龍這種曾在陸地上出現的最大型生物。但是在六千五百萬年前，所有恐龍竟然都神祕地滅絕了。科學家依髖骨排列的方式，將恐龍分成兩大目，龍盤目的髖骨排列方式與蜥蜴相似，有草食和肉食兩種；鳥盤目的髖骨排列方式與鳥類相似，全為草食性。"
