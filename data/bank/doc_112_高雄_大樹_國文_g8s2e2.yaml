- id: doc_112_高雄_大樹_國文_g8s2e2_s3_7
  section: 3
  number: 7
  type: single
  page: 2
  stem: 徐志摩在〈我所知道的康橋〉一文中熱情介紹：「你如愛花，這裡多的是錦繡似的草原。你如愛鳥，這裡多的是巧囀的鳴禽。你如愛兒童，這鄉間到處是可親的稚子。你如愛人情，這裡多的是不嫌遠客的鄉人，你到處可以掛單借宿。」關於此段的敘述，下列說明何者最為正確？
  options:
  - label: A
    content: 敘事視角以「你」為主，無法呈現個人鮮明觀點
  - label: B
    content: 說明康橋環境優美，四季如春，十分適合人居住
  - label: C
    content: 作者把讀者「你」當作親近之人，給予熱情且真誠的建議
  - label: D
    content: 深入文中「你」的內心世界，呈現「你」的心靈感受
