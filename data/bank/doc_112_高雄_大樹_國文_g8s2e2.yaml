  group_stem: '(乙)

    在實際生活中，街角是一個擁有許多移動聲音的場合。我們可以到街角去，閉著眼睛安靜地站上幾分鐘，聆聽所有聲音的移動。如果選擇站在繁忙的街角，通常會讓人嚇一跳，聽見的聲音大部分離我們很近。如果站在沒那麼繁忙的街角，則是能聽見比較遠的聲音。如此一來我們便發現，一個範圍內活動的多寡會使聲景擴大或縮小。視野通常也是這樣，如果視野範圍內有高聳的建築物，會將我們的視野局限在幾公尺內，如果身在郊外，眼睛
    和耳朵聽到的距離會比較遠。試試看你最遠能聽到哪裡的聲音。是什麼聲音?你能估計出聲音離你有多遠嗎?隨著過去一百年來人口遷居城市，人們開始對「近處」的聲音產生偏好，在唱片及廣播圈尤其明顯。我們幾乎可以說，已經喪失聆聽遠方聲音的能力。儘管如此，聆聽遠處的聲音，會讓聲音產生一種獨特的魅力，而且聆聽繁忙的街角與開闊環境並將經驗互相比較，是一種有益的練習。'
