  - label: B
    content: 「死水般的分泌物窩居在幽暗的細支氣管內，日日夜夜蔓結蛛網，在病人的胸腔中形成聚落」說明痰液堆積容易成為細菌的溫床
  - label: C
    content: 「總是把身形藏在陰影裡，彷彿她們只是病房中一抹淡淡的異國香水，沒有實質地位。」凸顯外籍看護存在感並不強烈，容易被忽視
  - label: D
