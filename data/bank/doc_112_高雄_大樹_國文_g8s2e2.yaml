  stem: 「她們喉中也卡著痰。她們遠渡異國，含著那塊濃痰，口音混濁地學習陌生的語言，手忙腳亂做醫師與家屬之間的橋梁，每天在醫院裡替另一個痰聲隆隆的老人拍背，過著呼吸少少新鮮空氣的生活。卻沒有人想要幫她們化痰。」關於〈拍痰〉一文的這段文字，下列敘述何者正確？
  options:
  - label: A
    content: 醫院看護工作繁重，使得外籍看護們積勞成疾
  - label: B
