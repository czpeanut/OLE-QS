- id: doc_112_高雄_大樹_國文_g8s2e2_s3_8
  section: 3
  number: 8
  type: single
  page: 2
  stem: 「靜極了，這朝來水溶溶的大道，只遠處牛奶車的鈴聲，點綴這周遭的沉默。」此處運用聲音的出現凸顯背景的寂靜，下列何者也運用這樣的寫作手法？
  options:
  - label: A
    content: 蟬噪林逾靜
  - label: B
