- id: doc_112_高雄_大樹_國文_g8s2e2_s5_6
  section: 5
  number: 6
  type: single
  page: 6
  stem: 文中「流魚出聽」、「六馬仰秣」都有音樂動聽的意思，下列何者也同樣表達這個含義？
  options:
  - label: A
    content: 出水芙蓉
  - label: B
    content: 沉魚落雁
  - label: C
    content: 餘音繞梁
  - label: D
    content: 閉月羞花。
  group_stem: '(丙)

    春秋 楚國的伯牙善於彈琴，荀子曾說：「昔者瓠巴鼓瑟而流魚出聽，伯牙鼓琴而六馬仰秣。」意思是說，瓠巴彈瑟時，魚兒都浮出水面傾聽，伯牙鼓琴時，連正在吃草的馬兒都停下來昂首聆聽。可見二人的琴藝是多麼高超啊！

    伯牙有個朋友叫鍾子期，善於鑑賞音樂，伯牙彈琴時心裡所要表達的意思，他都能夠聽得出來。有一回伯牙彈琴時，想要表達雄偉的高山，子期聽後說：「這琴聲好雄偉，像那巍峨的泰山啊！」又有一次，伯牙想要表現浩瀚的流水，子期聽後說：「這琴聲真是壯闊，就像澎湃的大江一般啊！」可見伯牙彈奏技巧非常高妙，而子期能聽出琴聲的含義。

    後來子期先伯牙而死，伯牙悶悶不樂，把琴摔壞，終生不再彈奏了。'
