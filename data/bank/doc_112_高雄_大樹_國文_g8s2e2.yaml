    labeled_by: ai
- id: doc_112_高雄_大樹_國文_g8s2e2_s3_4
  section: 3
  number: 4
  type: single
  page: 1
  stem: 「遠近的炊煙，成絲的……，在靜定的朝氣裡漸漸地上騰，漸漸地不見，彷彿是朝來人們的祈禱，參差地翳入了天聽。」這段文字是以「聽覺」印象來表現「視覺」感受，這種手法稱之為「感覺轉移」。下列文句，何者使用的手法與之相同？
  options:
  - label: A
    content: 陽光穿透林蔭小徑，灑下叮叮噹噹的金光，好愉悅的午後
  - label: B
    content: 他哀傷痛苦的目光，熊熊灼傷了我的皮膚，但我無能為力
  - label: C
    content: 雲朵沉浸在艷紅的夕陽餘暉中，彷彿是泡在蕃茄湯裡的奶油吐司
  - label: D
    content: 雨停了，但枝葉間雨滴依然紛亂的灑下，這時林間傳來斑鳩與水車的聲響
