- id: doc_112_高雄_大樹_國文_g8s2e2_s3_3
  section: 3
  number: 3
  type: single
  page: 1
  stem: 老師請班上同學為〈我所知道的康橋〉一文中的文句做整理分析，並請同學上臺發表。下列何者的報告內容完全正確？
  options:
  - label: A
    content: 小碩：「晚景的溫存卻被我這樣偷嘗了不少。」是以誇飾手法描述欣賞黃昏美景的快樂
  - label: B
    content: 正閔：由「我心頭頓時感著神異性的壓迫，我真的跪下了，對著這冉冉漸隱的金光。」可見作者對自然界的神奇景象感到惶恐
  - label: C
    content: 小萍：「頃刻間這田野添深了顏色……白天誕生的光榮。」作者連用三個「頃刻間」是強調清晨的天氣多變，令人不明所以無法捉摸
  - label: D
    content: 君豪：「關心石上的苔痕……關心天上的雲霞，關心新來的鳥語。」作者連用六個「關心」，表示對康河風光細心探訪和熱切盼望
  lesson_raw:
    title: 我所知道的康橋
    basis: 題幹提及〈我所知道的康橋〉
