  group_stem: '「一人家庭」的增加，許多「家」已無力承擔照顧病人的責任。如何在醫院與家之外，打造一個臨終處所，讓末期病患安心走向人生終站，是正步入「多死社會」(註1)的台灣必須正視的重要課題。已有公民嘗試在不同的工作角色中，協助社區開闢出安死的各種可能──包括建立「安寧家屋」，租一方處所，讓不住院、也無法在家死亡的末期者，透過共居、相互扶持，以及專業居家醫護提供的安寧照護下，有地方走完人生的最後一哩路。註1:
