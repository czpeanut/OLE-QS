  - label: C
    content: A village.
  - label: D
    content: A market.
  group_stem: "In Kenya, life as a girl or woman is difficult. They can only follow\
    \ their fathers or husbands. Many girls can’t go to\nschool, and men decide everything\
    \ for them.\n   However, this village in Kenya is different. People call it Umoja.\
    \ The girls and women here are happy. They make\nbeautiful things and sell them\
    \ to tourists. Only women and their kids live and work here. Men can visit the\
    \ village, but they\ncan’t sleep here. In Umoja, women make the rules, not men.\
    \ In 1990, Rebecca Lolosoli and 15 other women started\nUmoja. They wanted to\
    \ build a safe place for women and kids. They also built a school in the village.\
    \ Every girl can go to\nschool here.\n   Later, Umoja became famous around the\
    \ country. More and more women and girls came to the village. Some left\nUmoja\
    \ and started more villages like Umoja for women. They all have one hope: One\
    \ day in Kenya, everything will be\ndifferent. Women will not need to listen to\
    \ men, and they can be their own boss.\nas 作為   village 村莊   tourist 遊客"
