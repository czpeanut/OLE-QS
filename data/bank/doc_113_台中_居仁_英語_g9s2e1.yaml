  group_stem: 'D.

    Every February for two weeks, Nice Carnival in France attracts almost one million
    visitors. Each year, it has a different theme, but there are always three major
    events:

    1. The Main Carnival Parade

    This features around 20 floats and many international musical groups. The parade
    is filled with colors and a joyful atmosphere.

    2. The Battle of Flowers Parade

    First held in 1856, this parade has become the most famous event. Characters dressed
    in colorful costumes throw flowers into the crowds. Over 80% of these flowers
    are grown locally.

    3. The Carnival Parade of Lights

    While the content is basically the same as the Main Carnival Parade, this event
    takes place at night. The floats are therefore decorated with bright lights.


    ※If you plan to attend Nice Carnival, here are some tips:

    1. Book your tickets online

    Since the ticket stands only open on the same day the parades take place, it is
    best to get your tickets beforehand to avoid long lines. Also, make sure to print
    out your tickets before going to the events.

    2. Dress in full costume

    People who are in full costume will be able to get access to the standing area
    for free. So, if you want to save money, get your costume ready.

    3. Get through security early

    Arrive early before the show starts since there will be security guards checking
    your bags. Only bring necessary things in small bags.'
