  group_stem: 'C.

    Taking care of plants takes patience and skill. Much like your favorite pets,
    plants need special care. Fortunately, some are a little easier to care for than
    others.

    If you haven’t quite developed a green thumb yet, start with a paddle plant. They
    look great, with large, round leaves that have pink tips. What’s more, they don’t
    drink. Or, if you like a more tropical style, introduce a lady palm to your living
    room. It does not need direct sunlight, so there’s no need to rearrange furniture
    in order to place it next to a window.

    As for general care tips, remember to water a plant whenever the soil starts to
    feel dry. When it comes to fertilizer, add some in spring and summer, when plants
    tend to grow the most. Don’t forget to check the roots, too. If your plant’s roots
    are circling the container, it’s time to move it to a bigger pot. Also, remember
    to wipe the dust off the leaves of the plants. This helps them soak up more sun.
    Get some green in your life, and things will only get better and better!'
