  group_stem: 'A.

    Internet Addiction

    Experts indicate that millions of people around the world are one click away from
    ''online'' addiction.

    The Internet is where we spend more and more of our time. But for a growing number
    of people, it''s a habit that interferes with daily living and causes serious
    problems of family, friends, loved ones and work.

    Dr. Kimberly Young says that about 5% to 10% of Americans -- 15 to 30 million
    people -- may have the problem of Internet addiction. And the problem may be even
    greater in countries like China, Korea and Taiwan. She developed a test with 20
    questions to know the levels of Internet addiction. "There are no real drugs for
    this yet." she says. Some patients need 30 to 90 days of treatment, followed by
    a continuing care program. But Internet addiction recovery, like any other addiction,
    needs lifelong treatment, experts say.

    Dr. Coleen Moore tells us that many of her patients, mostly college students and
    young adults, spend 14 to 18 hours a day online. But Young notes that it''s not
    just how long people spend using a computer; it''s what they''re doing online.
    Online gaming is the form of Internet addiction most quickly growing among young
    people. "In the beginning, we had people addicted to surfing the Web, chat rooms,
    and things like that. Now, we are looking more to gaming," Moore says. "Gaming
