  group_stem: '◎「行動電源」是一種儲備電能、可隨身攜帶的充電器。挑選行動電源時有哪些注意事項呢？

    1.選購有經濟部標準檢驗局BSMI 認證字號的產品，才表示產品有通過必要檢測項目，品質較有保障。

    2.行動電源的容量有5000 mAh、10000 mAh 等，挑選時建議以個人使用需求為主。另外，電能輸出的過程中會產生耗損，因此也要注意「轉換率」，轉換率越高，行動電源的效能越佳，產品規格中的額定容量才是行動電源實際能輸出的電量。

    現有一行動電源，其規格如下：

    ● 電池類型：鋰離子電池

    ● 電池容量：10000 mAh

    ● 額定容量：8000 mAh

