  section: 1
  number: 4
  type: single
  page: 1
  stem: 下列何者是造成地球四季變化的主要原因? （7-2）
  options:
  - label: A
    content: 地球繞太陽公轉時，有時靠近太陽，有時遠離太陽，造成能量變化。
  - label: B
    content: 地球自轉，使陽光在一天之中直射及斜射地面，能量變化大。
  - label: C
    content: 地球的大氣及海水運動，將能量由赤道傳向南北極，使不同緯度的能量分布不均。
  - label: D
    content: 地軸傾斜且地球繞太陽公轉，使同一地點接收到的陽光能量有所變化。
