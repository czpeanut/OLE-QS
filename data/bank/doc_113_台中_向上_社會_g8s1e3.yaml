  page: 2
  stem: 一位學者說到：「一八五零年代，英國與法國聯合進犯中國，這場戰事進逼天津，清國被迫答應英法兩國提出的和平交涉。其後，英、法兩國為求清國履行前述約定，攻陷清帝國的首都。一八六一年，恭親王奕訢成立一個統籌涉外事務的外交機關。該機構翻譯了一本美國著作，中文譯名為《萬國公法》，隨後日本進口《萬國公法》該書並翻印出版，為日本日後推行西化運動的契機。此後，日本更透過一系列的西化運動躋身列強之林，後來對清國、俄國的戰爭皆獲得勝利。」請問下列的解讀，何者正確？
  options:
  - label: A
    content: 文中所提到的「戰事」是「英法聯軍」
  - label: B
    content: 翻譯萬國公法的機構是「大清郵政局」
  - label: C
    content: 文中所述日本的西化運動是指「大化維新」
  - label: D
    content: 統籌涉外事務的外交機關是指「京師大學堂」。
- id: doc_113_台中_向上_社會_g8s1e3_s1_26
  section: 1
  number: 26
  type: single
  page: 2
  stem: 根據上述資料所述，上海的公園最早的設立目的為何？
  options:
  - label: A
    content: 用來提供給上海的所有居民娛樂休閒享用
  - label: B
    content: 用來作為清代官方設立之公共設施
  - label: C
    content: 用來作為上海租界區特色設施
  - label: D
    content: 用來作為上海地區西方人遊樂的場所 。
  group_stem: '◎請閱讀以下資料，回答26-28 題：

    資料一:蘇州北河和黃浦江交會處的外灘花園是英國人在上海建造的第一個『公園』，實際上也是中國出現的第一個公共花園。西元一八六四年英國領事館向上海道臺提議和申請，認為上海已經開放多年，旅遊上海的僑民與日俱增，而上海卻沒有一個可供外人休息和遊樂的場地，因此希望上海道臺可以允許，由工部局出資將上海的淺灘填平後改建為花園，既可以保障水上航運的暢通及安全，也可以為旅遊上海的西人提供遊樂的場所。--摘自薛理勇，《舊上海租界史話》


    資料二:英租界的畫定給上海帶來倫敦風，公園作為公眾文明的休閒場所和都市的公共空間，逐漸散布在租界的各處。然而，最初的公園雖然寫著『公』字，卻只專供西洋人享用，所謂的公共花園其實是『外國公園』，生活在同一租界區內的中國人被排除在外，直到一九二八
    年，租界公園才真正成為都市大眾刻意共同享用的綠色空間。--摘自陳祖恩，《上海老城記》'
