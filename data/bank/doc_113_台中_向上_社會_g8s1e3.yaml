  stem: 日本京都附近的特色建築：美山町茅草屋、白川鄉合掌屋與下鄉町大內宿並列為日本三大茅草屋之鄉，茅草屋內部建築完全以木頭構成，屋頂則以茅草蓋著，大約每二十年更換一次。請問：日本傳統民居以木料茅草做為建材的主要原因，與下列何者最有關？
  options:
  - label: A
    content: 暖流流經較潮溼
  - label: B
    content: 位居高緯較寒冷
  - label: C
    content: 板塊交接帶常有地震
  - label: D
    content: 地形崎嶇交通不便。
