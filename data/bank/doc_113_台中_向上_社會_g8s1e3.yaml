- id: doc_113_台中_向上_社會_g8s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: '朝鮮半島因為歷史發展的緣故，分裂成兩個不同政體的國家－南韓與北韓，雖然位在同一個半島上，但是自然資源與人文環境有很大的差異。 下列有關兩個國家的比較，何者錯誤？


    | | (A) 政治體制 | (B) 收穫次數 | (C) 天然資源 | (D) 產業活動 |

    | :--- | :--- | :--- | :--- | :--- |

    | 北韓 | 專制集權 | 一穫 | 缺乏資源 | 國防工業 |

    | 南韓 | 民主政治 | 二穫 | 盛產煤鐵 | 高科技產業 |'
  options:
  - label: A
    content: 政治體制
  - label: B
    content: 收穫次數
  - label: C
    content: 天然資源
  - label: D
    content: 產業活動
- id: doc_113_台中_向上_社會_g8s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 在日劇中，經常出現劇中人物食用生魚片的畫面。日本人喜愛海鮮，多樣的海鮮飲食方式，也成為吸引觀光客的特色之一。請問：日本漁業發達、魚獲量豐富的主要原因為何？
  options:
  - label: A
    content: 海岸平直，魚塭眾多
  - label: B
    content: 寒、暖流交會，魚群容易聚集
  - label: C
    content: 氣候舒適，利於魚群繁殖
  - label: D
    content: 漁業勞動人力充足而低廉。
  group_stem: ✽自 1990 年代起，日、韓兩國皆提出「文化立國」的發展政策，結合各地傳統工藝與祭典，大力推動多元的文化活動， 更透過影視戲劇、流行音樂、電玩等產業，達到發展觀光及行銷本國產品的目的。請根據敘述回答
    9-10 題：
