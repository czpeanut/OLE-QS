  stem: 韓國國語院與文化體育觀光部，及農林畜產食品部合作，針對200 種著名的韓式料理，規定了標準的日文、華文與英文名稱。其中引發議論的是將「泡菜」重新譯為發音較接近韓語的「辛奇」，以便跟中式泡菜做出區別。請問：朝鮮半島盛行製作辛奇的原因為何？
