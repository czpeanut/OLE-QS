- id: doc_111_桃園_同德_社會_地理_g8s2e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 根據文章判斷，鈴芽的日記斷在三月十一日，應該是當天發生了很大的災難，推論電影是在指涉哪種災難？
  options:
  - label: A
    content: 地震
  - label: B
    content: 洪水
  - label: C
    content: 暴風
  - label: D
    content: 乾旱
  group_stem: "新海誠是日本繼宮崎駿後，第二位達成百億票房的動畫導演，他的知名作品包括「你的名字」、「天氣之子」，其最新動畫「鈴芽之旅」，是在敘述女主角鈴芽偶然遇見一個「關門師」(虛構職業)的故事。\n\
    \  劇情中的關門師會在日本各處旅遊，尋找廢墟中的門，這些門會通往往生者的世界，如果沒有來得及找到這些門將其關閉，在這些門後的災難生物就會竄出，導致災難發生。\n\
    \  這趟和關門師的旅程，最後到了鈴芽小時候的家，因為當時發生極嚴重的災難，她家附近所有的房子都垮掉變成了廢墟，連鈴芽的家人也在當時過世了，所以她才被阿姨帶到較南邊的地方展開新生活。\n\
    \  鈴芽在廢墟中挖出自己小時候寫的日記，發現只寫到最後一天的三月十一日…"
  tags:
    chapter:
      publisher: null
      book: 八下
      subject: 社會
      code: null
      title: null
      chapter: null
    textbook: 八下 第1次段考範圍
    labeled_by: ai
