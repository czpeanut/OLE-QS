    Joe: He is very tall. He is on our school basketball team. He is really good at
    it. His team won the game again last week. He is also nice. He often shares his
    skills with us.

    Andy: Really? I always want to make three-point shots, but I can’t. Maybe I can
    ask him for help.

    Joe: Then, let’s meet at the park in twenty minutes.

    Andy: OK. See you then.


