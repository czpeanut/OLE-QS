  section: 1
  number: 40
  type: single
  page: 5
  stem: '臺南市平均年總日照量為 1200 萬度/公頃，目前南市府水利局於安定區轄內的公滯一、二滯洪池上方設置全臺最大「水域型浮動式太陽能光電系統」，面積達
    4.25 公頃，預計 1 年發電 800 萬度，平均每天約 2.1 萬度電，幾乎可供應安定區約 30%的電力，可減少 4500 噸碳排放，相當於 13 座臺南公園可吸收的二氧化碳量。108
    年 4 月底已開始運轉。

    家庭用電中，其中一部分是用來取代柴火，將水加熱，供應人們作各種用途使用，估計每人每天洗澡、喝水、煮飯…平均會用上 10 公升的熱水。經初步規劃後，能源科科長即將在市府會議中向上級報告此款系統的使用效益，以民生用水為例，若將目前安定區建置的此座「水域型浮動式太陽能光電系統」提供的電能全部用以供應熱水的使用，且無能量散失，平均來說若以水由室溫
    20℃加熱至 80℃計算，則約可供應臺南市每天多少人，有充足的熱水使用無虞？（1 度＝1 千瓦・小時＝$3.6\times 10^6$ 焦耳，1 卡＝4.2
