- id: doc_113_新北_崇林_自然_g7s1e2_s1_49
  section: 1
  number: 49
  type: single
  page: 6
  stem: 下列有關冠狀動脈的敘述，何者正確？
  options:
  - label: A
    content: 是從大靜脈分支出來的血管
  - label: B
    content: 可以提供心臟氧氣與養分
  - label: C
    content: 血管中蛋白質沉積形成血塊而阻塞血管
  - label: D
    content: 冠狀動脈心臟病跟生活習慣沒有關係。
  group_stem: '請閱讀文章，回答下列問題：


    身體健康的人每天心跳約十萬次，二十四小時打出800公升以上的血液流經全身各處，為了維持不眠不休的劇烈運動，心臟自然也需要足夠的氧氣和養分。而供應心臟物質的重要血管，就是在心臟表面的冠狀動脈。


    冠狀動脈是從主動脈分支出來的血管，以確保心臟能獲得充足的血液。也因為僅靠冠狀動脈提供氧氣與養分，如果發生堵塞將會導致嚴重後果，主要原因是由於血管內形成一種類似脂肪沉積的斑塊，其破裂後造成血液凝集形成血塊而開始阻塞血管。由於初期尚有足夠的血流通過不容易被察覺，但是隨著堵塞越來越嚴重，冠狀動脈血流量減少將使得心肌開始缺氧，並出現心肌梗塞症狀，此即為冠狀動脈心臟病。（如下圖）。


    目前已確認造成的危險因子包括遺傳、高齡、高血壓、糖尿病、高脂血症、肥胖、抽菸。依據世界衛生組織對心臟血管疾病危險性的評估分類，高血壓是心臟血管疾病發生的最危險因子，若還併有其他因素時，也都大大提高心臟血管疾病的發生率，千萬不可不慎！'
