- id: doc_113_高雄_英明_自然_g7s1e2_s2_49
  section: 2
  number: 49
  type: single
  page: 5
  stem: 上述文章中，關於酒精的吸收，何者正確？
  options:
  - label: A
    content: 酒精的吸收與醣類、脂質、蛋白質一樣，都是由小腸開始
  - label: B
    content: 口腔黏膜及食道不會吸收酒精
  - label: C
    content: 胃雖然不會吸收養分，但是會吸收酒精
  - label: D
    content: 空腹時喝酒，酒精的吸收效率較慢
  group_stem: 題組：人在飲酒之後，酒精的吸收速度非常快，酒精可由口腔粘膜吸收進入血液，並分佈全身。假如空腹，酒精的吸收會更加快速。酒後30 分鐘至2
    小時內，人體血液中的酒精濃度就會達到高峰。喝酒後，酒精在口中及食道就可以少量吸收，接著在胃及小腸大量吸收。因此如果先吃些食物才飲酒，會減少胃壁對酒精的吸收。酒精被吸收後進入血液循環，在肺循環時，血液流經肺泡微血管，會將部分酒精呼出體外，而在體循環時，酒精則會在肝臟透過一連串的代謝反應最終變成二氧化碳跟水。（回答第49~50
    題）
