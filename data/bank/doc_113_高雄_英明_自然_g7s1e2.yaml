- id: doc_113_高雄_英明_自然_g7s1e2_s2_44
  section: 2
  number: 44
  type: single
  page: 5
  stem: 根據文章的描述，二尖瓣脫垂是是哪一個瓣膜無法完全關閉
  options:
  - label: A
    content: ㄅ
  - label: B
    content: ㄆ
  - label: C
    content: ㄇ
  - label: D
    content: ㄈ
  group_stem: 題組：二尖瓣脫垂是一種發生在心臟瓣膜上的問題。其盛行率大約是一般人口的2 至3％，二尖瓣位於左心房和左心室之間。當心臟收縮時，為了能讓血液順利打入動脈，這道瓣膜會關閉，防止血液逆流回左心房。正常的情況下，二尖瓣在心臟跳動時會平穩地打開和關閉，但在二尖瓣脫垂的情況下，瓣膜的部分結構因為鬆弛或變形而無法完全密閉，這樣血液就會逆流回左心房，這叫做「二尖瓣逆流」。大多數二尖瓣脫垂的患者都沒有症狀，因此有很多病患是因為例行性的心臟聽診發現到心雜音，或者是由於其他原因安排了心臟超音波檢查而得以發現。下圖為人類心臟瓣膜位置的示意圖，試回答44~45
    題
