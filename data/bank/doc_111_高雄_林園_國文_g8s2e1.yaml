- id: doc_111_高雄_林園_國文_g8s2e1_s4_22
  section: 4
  number: 22
  type: single
  page: 4
  stem: '孔明登城望之，果然塵土沖天，魏兵分兩路望西城縣殺來。孔明傳仙：「眾將旌旗，盡皆藏匿。諸軍各孚城鋪，如有妄行出入及高聲言語者，立斬。大開四門，每一門上用二十軍士扮作百姓，灑掃街道，如魏兵到時，不可擅動，吾自有計。」孔明乃披鶴氅，戴綸巾，引二小童，攜琴一張，於城上敵樓前，憑欄而坐，焚香操琴。


    上文關於孔明的敘述，哪個選項錯誤?'
  options:
  - label: A
    content: 孔明再三思考斟酌後，傳仙將軍旗藏起、軍士全都躲藏起來，不准出聲。
  - label: B
    content: 孔明遠望敵人軍隊揚起塵土，直奔而來，可見兵馬眾多，顯見孔明遇到棘手的難題。
  - label: C
    content: 孔明做出城中沒有任何軍力的空城狀態，以斬首立威，命仙眾人服從指揮，展現孔明的果決威嚴，不容懷疑。
  - label: D
    content: 孔明自己則羽扇綸巾的打扮，在城上焚香操琴，旁邊沒有一兵一卒，城門還大開，一派泰然自若，可見孔明機智用計，臨危不亂。
  group_stem: 《三國演義》是一部歷史小說，由宋元話本演變而來，盛行於明清。描述魏、蜀、吳三國鼎立的故事，內容主要取材於《三國志》，再加上作者羅貫中的虛構與渲染，是流傳極廣的中國文學作品。全書結構嚴謹，文字精鍊，情節生動緊湊，人物刻畫突出，如劉備的仁義、曹操的奸詐、關羽的忠義、張飛的勇猛等。本文空城計也是渲染虛構的，其中塑造的孔明與司馬懿的形象，仙人津津樂道。請閱讀提供的文本後，回答問題。
