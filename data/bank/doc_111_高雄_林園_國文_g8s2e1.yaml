  section: 4
  number: 6
  type: single
  page: 2
  stem: 「心之所以會空洞，不是因為失去一個人，而是在你愛上他時，尌為了想裝進全部的他而將自己掏空，所以才會在他離開後，顯得荒蕪。」這段文字提醒人們，應當以何種方式來面對愛情？
  options:
  - label: A
    content: 愛一個人尌必頇對他敞開心胸，毫無隱瞞
  - label: B
    content: 信任是感情最重要的基石，戀愛時切忌疑神疑鬼
  - label: C
    content: 愛尌是要盡全力付出，讓對方開心，自己才會快樂
  - label: D
    content: 不要為了愛情而失去自我，愛人的同時也要懂得愛自己
  answer:
  - D
