    content: ChatGPT 實在太厲害了，完全正確。
  group_stem: '《ChatGPT 是什麼？6 個關鍵問題一次看》

    聊天機器人ChatGPT 為什麼爆紅？它到底哪裡厲害？除了「假論文」問題外，它還可以給人類社會帶來什麼衝擊？

    關鍵問題1 (              ) ？ ---------------------------------------------------------------------

    ChatGPT 是一款聊天機器人，它會生成類似人類會寫出來的文字。ChatGPT 可以自然地回答眾多問題、精通許多學科，尌像個私人導師一樣。尌技術面而言，ChatGPT
    是「文本生成」的AI 家族中，「生成式預訓練轉換器」（Generative Pre-Trained Transformer）技術的最新發展。

    它採用深度學習（deep learning），根據從網路上獲取的大量文本樣本進行訓練。

    使用者們可以透過其官網：https://chat.openai.co，創建帳號體驗。


    關鍵問題2  ChatGPT 是誰做的？--------------------------------------------------------------------------

    ChatGPT 由馬斯克（Elon Musk）參與創立的獨立研究機構OpenAI 基金會所研發。馬斯克於2015 年底，和其他矽谷投資者共同創立了這家新創，包括技術風險投資家奧特曼（Sam
    Altman），並表示該研究中心將「以最可能造福人類的方式推進數位智慧」。

    不過，馬斯克後來離開了OpenAI 董事會，並與之保持距離。

    關鍵問題3   (              )？-------------------------------------------------------------------------------

    根據網友們實際測試，ChatGPT 可以流暢地回應各式問題、求解數學方程式、寫作文章（基礎學術文章、文學文本、電影劇本等）、檢查和調整程式碼、翻譯語言、文本摘要和關鍵字檢測、解釋事情（包含解釋一段程式碼的功用）⋯⋯。

    可以說生活中遇到「語言」與「程式語言」相關的情境，它都能處理得有模有樣，有些時候甚至比真人更專業、博學。

    根據OpenAI CEO 奧特曼，ChatGPT 在發布不到一週尌突破了100 萬用戶。網友們紛紛在自己的社群媒體上分享與ChatGPT 對話的截圖，持續造成旋風。


    關鍵問題4   (                )? ---------------------------------------------------------------------------

    根據OpenAI，ChatGPT 目前存在著一些局限，包括：有時會給出看起來正確但荒謬的答案、微調提問的方式會得到完全不同的回答、有時會反覆使用某些句子等等。

    此外，由於目前的機器人都是透過網路上海量資訊來建立回答，可能延續或強化偏見與歧視，甚至擁護仇恨言論如納粹思想等等。關於這點，Google 和Amazon 之前都承認，它們的AI
    存在「道德風險」，還是需要人類介入。

    也有些人擔心，ChatGPT 會被用來設計惡意軟體，未來網路上的病毒會更防不勝防。而廣大的學生們將拿AI 來寫作業，造成教育價值崩潰，更是近日不斷被討論的話題。


    關鍵問題5  (                 )？------------------------------------------------------------------------------

    預期現在搜尋引擎向商家收廣告費的模式可能被扭轉，改為AI 軟體向用戶收一筆訂閱費。

    更仙人擔憂的是，ChatGPT 可能衝擊人類。有些人猜測，與「內容製作」有關的行業可能會被AI 淘汰，包括劇作家、教授、程式設計師、新聞記者等等。


    關鍵問題6   ChatGPT 的未來收益？-----------------------------------------------------------------------------

    根據研究機構Grand View Research，2021 年全球人工智慧市場規模為935 億美元，預計2022 年至2030 年的複合年成長率將達到38.1%。科技巨頭們正在推動各產業的AI
    發展，如汽車、醫療保健、零售、金融和製造業等等。

    該研究機構亦指出，AI 的技術展望包含自然語言處理、深度學習、機器學習、機器視覺等，這些技術合併佔據未來八年10 億美元的收入成長。透過這些關鍵技術打造的ChatGPT，有望在有利可圖的AI
    市場取得一席之地。

    (摘自天下雜誌)'
