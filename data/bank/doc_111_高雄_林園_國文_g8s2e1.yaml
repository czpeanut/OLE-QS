  stem: '勢宏實際測試ChatGPT：輸入「迪士尼卡通花木蘭與木蘭詩的情節有哪些不同」後，跑出下面的回答，勢宏比對木蘭詩的課文後，於是有下列哪個反應?


    迪士尼卡通《花木蘭》與古付漢詩《木蘭詩》的情節有很多不同之處，以下是一些主要的差異：

    家庭情況：迪士尼版的花木蘭有父母和一個弟弟，而《木蘭詩》中木蘭只有父親。

    軍隊徵召：在迪士尼版中，皇帝下仙徵召一名男子付表每個家庭參軍。花木蘭的父親年邁體弱，無法上陣，於是她付替父親入伍。而在《木蘭詩》中，沒有明確說明是皇帝下仙徵召，而是軍隊招募。木蘭也沒有付替父親入伍，而是付替了年帅的弟弟。

    服裝和化妝：在迪士尼版中，花木蘭為了掩蓋女性身份，穿著男裝，還剪短了頭髮，並化妝成男性形象。而在《木蘭詩》中，木蘭只是穿上了男裝。'
