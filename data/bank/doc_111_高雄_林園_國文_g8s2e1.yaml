    （乙）空山不見人，但聞人語響。返景（ㄧㄥˇ）入深林，復照青苔上

    （丙）終日望夫夫不歸，化為孤石苦相思。望來已是幾千載，只似當時初望時

    （丁）楓葉千枝復萬枝，江橋掩映暮帆遲。憶君心似西江水，日夜東流無歇時'
