- id: doc_111_高雄_林園_國文_g8s2e1_s4_3
  section: 4
  number: 3
  type: single
  page: 1
  stem: '如何讓你遇見我

    在我最美麗的時刻 為這

    我已在佛前 求了五百年

    求祂讓我們結一段塵緣


    佛於是把我化作一棵樹

    長在你必經的路旁

    陽光下慎重地開滿了花

    朵朵都是我前世的盼望


    當你走近 請你細聽

    那顫抖的葉是我等待的熱情

    而當你終於無視地走過

    在你身後落了一地的

    朋友啊 那不是花瓣

    是我凋零的心


    星期二的國文課，上完上面這首詩：一棵開花的樹，4 位同學在下課時間，有一搭沒一搭地聊著這首詩的內容，請問哪個同學講的不符合內容?'
  options:
  - label: A
    content: 這棵開花的樹象徵一個女生滿心期待愛慕對象能注意到她。
  - label: B
    content: 朵朵盛開的花正是內心殷切的期盼。
  - label: C
    content: 顫抖的葉是指女生個性害羞，不敢面對愛慕的對象。
  - label: D
    content: 結局是仙人傷心的，因為落花有意，流水無情，但也只能接受，因為感情不能勉強啊。
  lesson_raw:
    title: 一棵開花的樹
    basis: 引用席慕蓉〈一棵開花的樹〉詩文
  answer:
  - C
