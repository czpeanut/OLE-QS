  type: single
  page: 3
  stem: '(甲)我還想體會被鬼頭刀魚拉著船穿破浪頭的快感，尌像過去我們釣到大魚的時候，牠們讓我們興奮得血脈賁（ㄅㄣ）張，那股難以言喻的瞬間感觸，是我仍想出海的原始動機。       —夏曼〃藍波安〈望海的歲月〉

