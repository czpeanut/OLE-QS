    | | 甲 作物生長季 | 乙. 礦產資源 | 丙. 主要工業類型 | 丁. 經濟發展程度 |

    |---|---|---|---|---|

    | 北韓 | 較長 | 礦產稀少 | 軍事、國防工業 | 較高 |

    | 南韓 | 較短 | 盛產煤鐵 | 電子、民生工業 | 較低 |'
