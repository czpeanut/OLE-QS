  stem: '日本政府發布的《觀光白皮書》內呈現不同外國旅客主要的消費傾向。澳洲人是所有旅客中花最多錢在住宿方面的，臺灣人則主要買藥品和保健相關產品，而歐美旅客訪日的最大動機則是「體驗日本的傳統文化和歷史」。

