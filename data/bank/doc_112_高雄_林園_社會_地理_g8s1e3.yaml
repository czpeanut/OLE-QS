  section: 1
  number: 12
  type: single
  page: 2
  stem: '右表為西元2021 年日本進出口的主要商品。由表中資料可以判斷，日本的工業發展具有下列哪兩項特徵？

    (甲)主要產業為勞力密集型

    (乙)汽車工業為經濟重要骨幹之一

    (丙)缺乏能源及礦產

    (丁)呈現嚴重的貿易逆差。

    以上正確的是：


    | 主要輸出項目 | 汽車、半導體等電子零件、汽車零件、鋼鐵、發動機、半導體等製造設備、塑膠、科學光學儀器、電路板等機器 |

    | --- | --- |

    | 主要輸入項目 | 原油、液化天然氣、衣類及其附屬品、通信機、醫藥品、半導體等電子零件、煤炭、石油製品、電子計算機(含周邊配備)、非鐵金屬 |'
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 乙丁
  - label: D
    content: 丙丁。
  answer:
  - B
  answer_source: answer_key_vlm
