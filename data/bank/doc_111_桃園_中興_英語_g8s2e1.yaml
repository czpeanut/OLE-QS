- id: doc_111_桃園_中興_英語_g8s2e1_s6_33
  section: 6
  number: 33
  type: single
  page: 4
  stem: What is the purpose of the second paragraph?  purpose 目的 paragraph 段落
  options:
  - label: A
    content: To answer all our questions about animal sounds.
  - label: B
    content: To talk about people used languages during communication.
  - label: C
    content: To show that people could know each other without saying anything.
  - label: D
    content: To explain how people communicate with animals.
  group_stem: "Cats meow at each other when they have something to say. Dogs do the\
    \ same when they bark at each other. When they \nmeow and bark at us, they are\
    \ also talking to us. Do you want to know what they are thinking?\nWith animal\
    \ communicators, you can now get the answers to all your questions. Actually,\
    \ animal communication exists \nfor years. Before people used languages to communicate,\
    \ people were able to communicate with just their senses. They knew \nwhat each\
    \ other was saying without words. They used their thoughts and feelings. What’s\
    \ more, they could read each other’s \nminds.\nAnimal communicators are just like\
    \ that. They have to go through training to make their power stronger. That way\
    \ they \ncan communicate with animals easier and better. The communicator used\
    \ a photo of someone’s pet to connect with the \nanimals many times. After that,\
    \ they can find out what the animal wants, needs, and worries about, and then\
    \ tell the owner \nabout them. It is really amazing. Do you want to give it a\
    \ try?\n meow 喵喵叫 bark 狗吠聲 animal communicator 動物溝通師  communication 溝通 exist\
    \ 存在  \n   sense 知覺   connect 連結 owner 主人"
