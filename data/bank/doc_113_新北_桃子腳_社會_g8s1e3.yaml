  group_stem: "【題組三】參考下列資料，回答25~26 題。\n    英法兩國的軍隊攻佔北京，並火燒了皇家園林圓明園，一些知識分子很快從夢中清醒過來，大聲疾呼整頓海防、軍隊。但這幾個清醒的人要面對的，卻是不斷的詆毀、謾罵、反駁和冷嘲熱諷。丁日昌，就是這樣一個先醒的人。曾國藩說他「精思果力，熟悉洋務。」，李鴻章稱讚他「洋務吏治，精能罕匹，足以干濟時艱。」然而丁日昌推薦引用洋人的做法，卻也被不少官員罵為漢奸誤國，「丁日昌矯飾傾險，心術不正。」、「臣在江南，聞丁日昌有『丁鬼奴』之稱。如此謀國，誠不知是何居心。」、「洋人之所長在機器，中國之所貴在人心。」\n\
    --改寫自故事網站，〈上有守舊朝廷、下有頑固同僚-丁日昌的〇〇〇〇，一個救國知識分子的困難與頓挫〉"
