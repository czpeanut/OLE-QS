- id: doc_113_新北_桃子腳_社會_g8s1e3_s2_23
  section: 2
  number: 23
  type: single
  page: 2
  stem: 有關於〇〇的相關敘述，請問下列何者正確？
  options:
  - label: A
    content: 〇〇是銅錢：是當時清政府徵稅、與人民購買鴉片主要的貨幣。
  - label: B
    content: 〇〇是白銀：因其價值而成為當時世界貿易所使用的主要媒介。
  - label: C
    content: 〇〇是銅錢：消費支出導致物價上漲，百姓逐漸負擔不起糧食。
  - label: D
    content: 〇〇是白銀：從清朝時期的外國貿易開始大量流入中國的市場。
  group_stem: "【題組二】參考有關鴉片的兩則資料，回答23~24 題。\n資料一18 世紀末，英國向清朝輸入印度種植的鴉片，導致清朝〇〇外流，〇〇價格飆漲，且吸食鴉片有害人體健康，清政府決定嚴禁鴉片，乃派遣官員至廣州查緝鴉片，此舉損害了英國的商業利益。\n\
    \                         --改寫自南一版課本第125 頁\n資料二20 世紀初，鴉片的危害被廣泛揭露和討論，歐美國家陸續以法律規定禁止使用。英國與清廷簽署協議，未來將減少鴉片出口數量，但這卻無法緩解中國民間鴉片成癮的情況，因為中國已經實現了鴉片的「進口替代」：在此之前，為了對抗西洋鴉片，減少〇〇外流，清廷舉朝野之力，鼓勵在地種植與生產本土鴉片。由於高額的利益與商機，很快地各地都出現了龐大數量的罌粟田，甚至金門、馬祖，也曾經歷過種植鴉片的時代。\n\
    --改寫自國家文化記憶庫2.0 線上策展平台〈歷史課本以外的鴉片〉"
