  stem: 19 世紀的美國女性和非裔男性都沒有投票權。至1870 年非裔男性獲得投票權時，女性仍被排除在外。女性上街遊行、絕食、靜坐抗議，在嘲笑聲中繼續爭取投票權。1920
    年美國女性才取得投票權。但百年後的現在，許多女性，特別是非裔女性，行使投票權時仍面臨打壓。約翰霍普金斯大學歷史學教授瓊斯說：「被針對性的要求檢查選民身分，投票所被關閉或特別從投票名單中刪掉。」關於人民爭取投票權的歷史進程，下列敘述何者正確？
  options:
  - label: A
    content: 基於投票的平等原則婦女取得投票權
  - label: B
    content: 1920 年後美國已達成人人平等的目標
  - label: C
    content: 瓊斯教授所描述的情況違反普通原則
  - label: D
    content: 禁止非裔、女性投票的規定具有正當性
