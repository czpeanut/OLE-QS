  group_stem: "【題組一】參考下列與清末婦女社會角色有關的兩則資料，回答21~22 題。\n資料一西元1898 年，康有為上奏〈請禁婦女裹足摺〉，強烈地描述了纏足之害，且認為因為纏足一事使中國受到世界各國取笑野蠻，並認為女子體弱會影響生出來的孩子，使中國缺乏強健的士兵，這樣的主張得到光緒皇帝支持，曾一度下令禁止纏足。\n\
    \                  --改寫自康有為，〈請禁婦女裹足摺〉\n資料二男子怕我們有知識有學問，不准我們求學，這總是我們女子自己放棄責任，自己樂得偷懶。自己又看看無功受祿，恐怕不長久，一聽見男子喜歡腳小，就急急忙忙把它纏了，使男人看見喜歡，可以借此白吃白喝。諸位想想，天下有享現成福的麼？自然是有學問、有見識、出力做事的男人得了權利，我們作他的奴隸了。既作了他的奴隸，怎麼不壓制呢？自作自受，又怎麼怨得人呢？這些事情，提起來，我也覺得難過。\n\
    --改寫自秋瑾，〈敬告中國二萬萬女同胞〉"
