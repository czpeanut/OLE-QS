  stem: 炘穎上網搜尋「分權制衡」，網頁上寫著「在美國，分權是指將政府的權力劃分並由不同機構掌理，並且每個權力間要相互牽制，以避免任何一個權力過大。」以下哪個選項的內容可能出現在該網頁上？
