  group_stem: '(Six people are being interviewed about the building of a new factory
    in their area.)


    Terry： I’m glad it’s coming into the area. We haven’t had any new stores, restaurants,
    or other businesses that start up here for too long. Now, there will be more jobs
    for the people here, and families won’t be going without food anymore.


    James： I hate the idea more than I can tell you. The factory is not only going
    to pollute the water and air but also to kill a lot of plants and animals here.
    Basically, it’s going to make all of it a lot worse.


    Louis： Everything is going to be different from now on. On one hand, it’s a good
    change because more people will be able to get work. On the other hand, more people
    also means more traffic and possibly more crime.


    Carla： My husband and I fought hard against it when it was first reported. It’s
    sad more people didn’t do the same. Now, the area will lose its natural beauty
    for good.


    Erica： I believe we’re very lucky that they decided to build the factory here
    because we really need the help. Without the factory, the locals either have to
    leave to work somewhere else or stay looking for jobs with little pay. I want
    both a good-paid work and a life in my hometown.


    Doris： I really don’t care one way or another about the factory. Life will go
    on as it always does.

    📖 pollute 汙染  basically 基本上  crime 犯罪  beauty 美麗'
