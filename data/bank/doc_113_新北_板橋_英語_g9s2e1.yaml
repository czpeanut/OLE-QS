  - label: C
    content: The best technology for warning about typhoons.
  - label: D
    content: How we choose safer places to build our houses.
  group_stem: '(39-41) The way that typhoons act is changing as ocean temperatures
    rise. They now have longer seasons and are getting stronger faster than ever before.
    For example, warm water helps them to get strength quickly, and they are harder
    to be known first. Scientists are thinking of new ways to study typhoons and then
    we can adapt to the changes. But what about you and me? What can we do to keep
    these storms from hurting us?

    In fact, there are many things we can do! People are using new technology to follow
    typhoons and improve early-warning systems to save lives. Also, people are planting
    natural barriers like grasses and oyster beds to keep away water damage. Builder
    are making smarter decisions about where to build houses to make life safer. Storms
    can change, the weather can change, but people can change, too.

    📖 temperature 溫度  adapt 調適  warn 警告  barriers 屏障  system 系統  oyster 牡蠣'
