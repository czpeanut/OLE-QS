  section: 1
  number: 4
  type: single
  page: 1
  stem: 一個面對「北京-莫斯科專制和侵略軸心」的新國際聯盟正在成形，這個歐、亞跨洋多邊集體防禦聯盟，可以被稱為「北大西洋-印度-太平洋公約組織」，將破除美國在印太地區多邊聯盟的不足。這樣的構想在
