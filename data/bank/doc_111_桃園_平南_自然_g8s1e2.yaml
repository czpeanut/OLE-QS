- id: doc_111_桃園_平南_自然_g8s1e2_s1_41
  section: 1
  number: 41
  type: single
  page: 4
  stem: 天體的重力透鏡效應，可以使原本難以觀測的遙遠天體變得較容易觀測，請問重力透鏡效應比較類似下列哪一種透鏡的效果？
  options:
  - label: A
    content: 凸透鏡
  - label: B
    content: 凹透鏡
  - label: C
    content: 凸凹透鏡
  - label: D
    content: 三稜透鏡 。
  group_stem: "重力透鏡\n    有質量的物體可彎曲周圍的時空，質量越大時空彎曲越厲害，因為光線會沿著彎曲的時空前進，所以光線經過大質量天體旁邊時行進路徑也會彎曲。這時空的彎曲，不是只有空間彎曲，時間也會受到影響。\n\
    \    如果有一遙遠的A 天體，恰巧和地球、大質量天體大致排成一條線，A 天體發出的光線經過大質量天體時，會沿彎曲的時空行進到達地球，造成如同透鏡般的效果，稱為重力透鏡效應。黑洞、星系、星系團等巨大質量的天體，都可以造成這種效應。\n\
    \    有質量的物體做加速度運動時，例如揮揮手，會將彎曲時空的效應像漣漪一般傳出去，稱為重力波。在2015年9 月科學家第一次偵測到重力波，遙遠黑洞合併時產生的重力波，這證實了愛因斯坦多年前的預測，也是科學史上的一個驚人成就。"
