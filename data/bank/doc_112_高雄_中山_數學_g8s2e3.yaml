- id: doc_112_高雄_中山_數學_g8s2e3_s2_1
  section: 2
  number: 1
  type: calc
  page: 4
  stem: (1). 正六邊形每一個內角是多少?(2 分)
  group_stem: '1. 蜂窩上的六角形:

    如果講到許多排列在一起的六角形，相信許多人第一印象就是蜂窩。蜜蜂是天生的建築能手，工蜂的身體具有蠟腺，他們會將新鮮蜂蠟咀嚼後拿來築巢，主要用途是在蜂巢裡做隔間（也就是蜂蛹的小套房），而六角形則擁有「最少材料」來做「最大空間」的優點。從圖形的排列上，最小數目由三角型開始，單一內角最小為
    60 度，共 6 片正三角形；最大為 120 度，共 3 片正六角形，所以只有正三角形、正四角形、正六角形可以密合排列。


