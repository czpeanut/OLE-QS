  stem: '判斷下列敘述哪些正確？

    甲： 投擲一枚公正的硬幣 2 次，2次都出現同一面的機率是$\frac{2}{4}$

    乙：投擲兩顆公正的骰子 1 次，點數和為 4 的機率是$\frac{3}{36}$

    丙： 假設男孩與女孩出生的機會相等，在一個有2名小孩的家庭中，有1名男孩、1名女孩的機率是$\frac{2}{4}$

    丁： 一副撲克牌有52張（不含鬼牌），分為黑桃、紅心、方塊及梅花4種花色。從撲克牌中任取1張，每張牌被抽到的機率都相等，則抽到花色為黑桃，點數大於5且小於10的機率是$\frac{4}{52}$

    戊：猜拳遊戲中，可能出現剪刀、石頭、布。兩個人猜拳，以樹狀圖表示所有可能的結果為 6 種。'
