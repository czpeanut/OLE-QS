- id: doc_113_高雄_光華_社會_g7s1e3_s1_49
  section: 1
  number: 49
  type: single
  page: 6
  stem: 依據文章內容判斷，《尋找達魯瑪克》紀錄片拍攝之主題，最有可能為下列何者？
  options:
  - label: A
    content: 發展原鄉經濟產業，促進部落就業機會
  - label: B
    content: 尋找部落文化根源，凝聚傳統文化認同
  - label: C
    content: 透過部落自治會議，建構部落事務共識
  - label: D
    content: 推動原住民族自治，形成文化高低位階。
  group_stem: '達魯瑪克是位於台東縣卑南鄉的魯凱族部落，意為勇士居住之地。

    近年部落在前任頭目領導下，展開祖靈屋等傳統建築重建，並透過傳統祭儀，例如除草祭、收穫祭、鞦韆祭，積極保存傳統文化。以傳統農作小米為祭典核心，凝聚族人向心力。

    在族人的努力下，他們推動實驗小學，傳承傳統族語，發展生態旅遊，帶領外界了解達魯瑪克祖先的生存智慧，他們相信｢進到山裡，你就能找到自己」。

    魯凱族部落紀錄片《尋找達魯瑪克》則透過現任頭目的視角，呈現部落靠自己的力量找回傳統的歷程，並榮獲紐約電影獎最佳紀錄片。'
