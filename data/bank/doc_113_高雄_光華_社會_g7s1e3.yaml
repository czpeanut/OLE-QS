  - label: D
    content: 討論欲販售商品是在「討論事項」程序進行。
  group_stem: '向日葵班召開班會，導師讓同學針對校慶園遊會要販售商品集思廣益。

    阿呆在班會前，就先將販賣氣球的■■交給主席風間。

    開會中，小新覺得「天氣冷就是要吃冰，不然要幹嘛？」提出販賣冰淇淋的想法；

    正男不認同，認為「誰想要冬天吃冰」、堅持冬天應該要賣熱湯圓、燒仙草；兩人一言不合、大打出手。

    妮妮看到打架事件，向○提出△，請○處理。

    一直沒有說話的風紀股長康平看同學亂成一團，無奈搖搖頭「還是我們先討論班服圖案？」

    大家熱烈討論哪個商品適合在園遊會販售後，風間：「關於園遊會販售商品，我們已經討論完畢，現在開始表決。」

    最終大家決定要販賣冰淇淋，小舞卻反對「我剛剛在看書沒投到票，我的權益受損，要重新投票！」'
