- id: doc_113_高雄_楠梓_自然_g8s1e3_s2_15
  section: 2
  number: 15
  type: single
  page: 1
  stem: 水結冰時，體積會如何變化？
  options:
  - label: A
    content: 因為熱脹冷縮，所以水結冰時，體積會變小
  - label: B
    content: 因為密度是物質的特性之一，不會改變，所以水結冰時，體積不變
  - label: C
    content: 因為結冰前後質量相等，但冰的密度比水小，故水結冰時，體積會變大
  - label: D
    content: 因為結冰前後質量相等，但水在 0~4℃時候具有反常現象，故水結冰時，體積會變小。
