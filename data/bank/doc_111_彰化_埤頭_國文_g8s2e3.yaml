  - label: D
    content: 治理的土地、人民都沒有增加，賦稅收入卻增加數倍。
  group_stem: '解扁為泉封，上計而入三倍，有司請賞之。文侯曰：「吾土地非益(1)廣也，人民非益眾也，入何以三倍？」對曰：「以冬伐木而積之，於春浮之河而鬻（2）之。」文侯曰：「民春以力耕，夏以強耘，秋以收斂，冬間無事，又伐林而積之，負軛（3）而浮之河，是民不得休息也。民以疲矣，雖有三倍之入，將焉用之？」

    【注釋】(1) 益：更加。(2) 鬻：賣。(3) 軛：套在牛、馬等頸背上的曲木。'
