    content: 召集第一屆的國會
  - label: C
    content: 選出第一任大總統
  - label: D
    content: 成為終身制總統
  group_stem: '**下文分別是孫中山與袁世凱就任臨時大總統時的誓詞，請回答下列問題


    【孫中山誓詞（白話意譯）】

    推翻滿清專制政府，鞏固中華民國，謀取民生幸福，是國民整體的意志，我將遵從該意志，忠於國家、為民服務。直到專制政府遭推翻、國內和平，中華民國獨立自主於世界，並受各國承認之時，我將卸下臨時大總統的職位。在此向國民發誓。


    【袁世凱誓詞（白話意譯）】

    中華民國才剛開始建設，有很多事情還需要興辦、治理，我深深期望能夠竭盡全力，發揚民主共和精神，洗去專制的影響，遵照臨時約法，並依照國民的願望，讓國家成為安全、完好、堅固的地方，讓五大民族共同享有快樂與利益。

    為了此一目標，將遵循禮法不逾越。等到召集國會，選出第一任大總統後，我隨即辭職。在此向同胞發誓。'
