  section: 1
  number: 7
  type: single
  page: 1
  stem: 中國共產黨能夠崛起甚至打敗中國國民黨而統治中國，其中蘇聯出力不少。但右圖則是 1962 年美國雜誌報導兩國決裂時的封面，請問：中蘇兩國關係生變的時空背景，應該是什麼情況呢？
