  section: 1
  number: 8
  type: single
  page: 1
  stem: 中共在1970 年代末開始進行的改革開放政策，帶來了經濟的繁榮，但也連帶產生很多問題和影響；歷史老師讓同學們發表意見，下列哪位同學說的與史實相符？
  options:
  - label: A
    content: 晨妤:改革開放後有嚴重的貧富差距問題
  - label: B
    content: 庭揚:因為經濟的開放帶動了政治的開放
  - label: C
    content: 忻霈:中國共產黨的專制統治被人民推翻
  - label: D
    content: 景鴻:共產黨主動開放人民有組黨的權利。
