  section: 1
  number: 11
  type: single
  page: 2
  stem: 第二次世界大戰結束後，國際之間除了冷戰的對峙，也出現區域統合的趨勢，下列為此時期對於東南亞局勢發展較為重要的兩個組織的會旗。請問：關於這兩個組織的敘述，下列何者與史實相符？
  options:
  - label: A
    content: 今兩個組織仍在運作中
  - label: B
    content: 甲組織是在越戰結束之後，美國為防制共產勢力在東南亞蔓延而建立的
  - label: C
    content: 乙組織是由二戰後取得獨立的東南亞各國，於1955 年成立，目的是擺脫殖民統治。
  - label: D
    content: 兩個組織都有加入的會員是泰國與菲律賓。
