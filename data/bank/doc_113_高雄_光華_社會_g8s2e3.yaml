- id: doc_113_高雄_光華_社會_g8s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 1971 年4 月10 日毛澤東邀請美國桌球隊前來中國，美國總統尼克森非常興奮，「中國給了我們與蘇聯斡旋的空間，我們不再腹背受敵」。翌年，中國桌球隊回訪美國，還參觀了迪士尼樂園。中美桌球隊的交流，被媒體稱為「乒乓外交」。根據上文，乒乓外交產生的背景可能是因為下列何者？
  options:
  - label: A
    content: 蘇聯瓦解，企圖拉攏中國
  - label: B
    content: 利用中蘇分歧之際，希望拉攏中國以制衡蘇聯
  - label: C
    content: 韓戰期間，美國希望拉攏中國，讓中國退出戰場
  - label: D
    content: 在亞洲的圍堵政策下，希望中國加入東南亞公約組織。
