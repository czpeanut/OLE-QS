- id: doc_113_高雄_光華_社會_g8s2e3_s1_16
  section: 1
  number: 16
  type: single
  page: 3
  stem: 請問關於資料中的這場戰爭，下列敘述何者與史實不符？
  options:
  - label: A
    content: 資料中的戰爭指的是韓戰
  - label: B
    content: 聯合國曾派兵援助南方的政權
  - label: C
    content: 資料二是中共以「抗美援朝」為名，派志願軍支援北韓與美國作戰
