  number: 4
  type: single
  page: 1
  stem: 西元 1960 年代被稱為「激情與叛逆的年代」，對體制反抗的運動在世界各地遍地開花，例如：歐洲法國爆發持續約七周的學生運動，稱之為「五月運動」，這次事件出現大量的總罷工、遊行、占領大學及工廠等行動，導致法國經濟發展停滯。在遊行隊伍中，竟有抗議民眾高舉毛澤東肖像，甚至裝扮成紅衛兵走上街頭。請問：為何在
    1960 年代的法國會出現這樣的場景？
  options:
  - label: A
    content: 毛澤東發起的文化大革命影響全球
  - label: B
    content: 毛澤東逝世，法國學生自發性上街哀悼
  - label: C
    content: 希望法國人民學習毛澤東的「大躍進」
  - label: D
    content: 慶祝毛澤東建立中華人民共和國。
