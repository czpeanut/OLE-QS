  section: 1
  number: 1
  type: single
  page: 1
  stem: 西元 1958 年，住在河南省鄉村的禮齊和百森來到人民公社吃飯，牆上貼著許多的標語：「三年超英，五年趕美」、「你是英雄咱好漢，高爐旁邊比比看，你能煉一噸，咱煉一噸半」、「肥豬賽大象，只是鼻子短，全村宰一頭，足夠吃半年」。請問：禮齊和百森當時生活在下列哪一事件發生的時期？
  options:
  - label: A
    content: 大躍進運動
  - label: B
    content: 文化大革命
  - label: C
    content: 國共內戰
  - label: D
    content: 六四天安門事件。
