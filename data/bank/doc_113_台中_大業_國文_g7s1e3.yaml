  - label: B
    content: 曾雅妮舉辦的記者會主題為「感恩」
  - label: C
    content: 曾雅妮認為不管是贏球或輸球，能與家鄉分享是最幸福的事
  - label: D
    content: 由於曾雅妮的影響，高爾夫球勢必成為政府發展奧運重點項目的焦點之一
  group_stem: '41～42

    一掃前兩場表現不盡理想的陰霾，這次曾雅妮帶著英國公開賽冠軍頭銜，和熱騰騰的阿肯薩斯錦標賽冠軍的光環回家，她特別在今天舉辦一場主題為「感恩」的記者會，藉以感謝一直以來，來自臺灣的高球先進、贊助商、媒體以及球迷們的鼓勵與支持。曾雅妮表示：「能將贏得比賽的榮耀與喜悅、參加比賽的壓力與辛苦、甚至是輸球的挫折與傷心與來自家鄉的前輩與好友分享，是最幸福的事。」

    體委會副主委陳顯宗表示：「曾雅妮憑藉著自己的天分與努力，不但在國際女子高壇上創下臺灣高爾夫運動員在國際賽會上的最佳成績，也為臺灣爭取至高的榮耀和能見度。而雅妮高超的球技與親和的態度，更讓全球廣大的高爾夫球迷透過她更認識臺灣。隨著2016
    奧運即將把高爾夫球納為正式比賽項目，曾雅妮的球技，再加上她以個人魅力帶動了國內高爾夫運動水準，高爾夫勢必將成為政府發展奧運重點項目的焦點之一。」

    —改寫自高球新聞'
