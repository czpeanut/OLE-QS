  type: single
  page: 1
  stem: 在詩詞曲中「鷗鳥」一詞，常寄寓閒適淡泊之意，例如：「點秋江白鷺沙鷗」。請判斷下列選項中的鷗鳥，何者亦為表達此種情境？
  options:
  - label: A
    content: 昔如水上鷗，今如檻中猿
  - label: B
    content: 飄飄何所似？天地一沙鷗
  - label: C
    content: 滄洲澀歸跡，飄撇慚吳鷗
  - label: D
    content: 客子倦遊思故鄉，歸心往來鷗鷺行。
  lesson_raw:
    title: 沉醉東風漁父詞
    basis: 引用白樸〈沉醉東風漁父詞〉課文原句「點秋江白鷺沙鷗」
- id: doc_113_高雄_陽明_國文_g9s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 關於馬致遠〈天淨沙秋思〉與白樸〈沉醉東風漁父詞〉這二首曲的比較，下列說明何者正確？
  options:
  - label: A
    content: 曲中主角皆因遠離家鄉而悲傷不已
  - label: B
    content: 皆先極力描寫自然美景再敘寫人事
  - label: C
    content: 皆藉由外在景物來抒發內心的孤寂
  - label: D
    content: 末兩句皆可窺見曲中所蘊含的主旨。
  lesson_raw:
    title: 天淨沙秋思、沉醉東風漁父詞
    basis: 題目指明馬致遠〈天淨沙秋思〉與白樸〈沉醉東風漁父詞〉
- id: doc_113_高雄_陽明_國文_g9s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 方位詞有些實指方向或位置，有些則是虛指，且另有涵義。〈天淨沙秋思〉中「夕陽西下」的「西」就是實指的方位詞。下列各文句「」的方位詞，何者的用法不表示方位？
  options:
  - label: A
    content: 微管仲，吾其披髮「左」衽矣
  - label: B
    content: 塞「北」苦寒，士卒多以戍邊為苦
  - label: C
    content: 世人聞此皆掉頭，有如「東」風射馬耳
  - label: D
    content: 秉翰執簡，敗「北」而歸，不可以言乎文。
- id: doc_113_高雄_陽明_國文_g9s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 「白樸雖出身自官宦世家，但自小遭逢亂世與父母失散，由元好問收養，元好問對其□□□□，在其悉心教導下，白樸學業□□□□。長大後，白樸原想藉由科舉入仕，然□□□□，元代長期不舉行科舉，白樸因而轉向文學創作，留下許多□□□□的作品。」根據文意，句中缺空處依序應填入下列何者最恰當？
  options:
  - label: A
    content: 視如己出／突飛猛進／生不逢辰／膾炙人口
  - label: B
    content: 嬌生慣養／蒸蒸日上／造化弄人／頌聲遍野
  - label: C
    content: 撫摩鞠育／故步自封／時不我與／引經據典
  - label: D
    content: 肝膽相照／放縱不拘／命途多舛／口碑載道。
  lesson_raw:
    title: 沉醉東風漁父詞
    basis: 題目敘述作者白樸生平背景
- id: doc_113_高雄_陽明_國文_g9s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 請根據在國文課堂上所學到的元曲知識，判斷誰的說法正確？
  options:
  - label: A
    content: 灰原哀：散曲是元代的新詩，因受到蒙古文化影響，故不講究押韻
  - label: B
    content: 柯南：雜劇是元代的歌劇，具有科、白、曲，可被搬上戲臺上表演
  - label: C
    content: 小五郎：散曲中的小令比詞更自由，故每首曲都加襯字，無一例外
  - label: D
    content: 阿笠博士：因散曲的句子長短不齊，格律自由，故又稱「曲子詞」。
- id: doc_113_高雄_陽明_國文_g9s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 有關韻文的敘述，下列何者不正確？
  options:
  - label: A
    content: 元代散曲的「曲牌」，是填詞的曲調，與內容無關
  - label: B
    content: 唐代的近體詩又稱為當代詩，且字數、句數有限制
  - label: C
    content: 宋詞由於可以配樂歌唱，所以也可以叫做「樂府」
  - label: D
    content: 古體詩以五、七言為主，格律較自由，可以換韻。
- id: doc_113_高雄_陽明_國文_g9s2e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 「峰巒如聚，波濤如怒，山河表裡潼關路。望西都，意踟躕，傷心秦漢經行處，宮闕萬間都做了土。興，百姓苦；亡，百姓苦！」（張養浩〈山坡羊潼關懷古〉） 根據上文意涵，下列何者正確？
  options:
  - label: A
    content: 作者感嘆楚漢相爭，項羽最後落敗的結局
  - label: B
    content: 作者為水災過後，百姓受苦，而感到不忍
  - label: C
    content: 作者弔古傷今，感嘆政權交替，人民悲苦
  - label: D
    content: 作者面臨國破家亡，報效無門，感到傷心。
- id: doc_113_高雄_陽明_國文_g9s2e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 〈鄒忌諷齊王納諫〉一文中，「吾妻之美我者」，句中的「美」字，其意思與下列何者相同？
  options:
  - label: A
    content: 徐公不若君之「美」也
  - label: B
    content: 有「美」一人，清揚婉兮
  - label: C
    content: 君子有成人之「美」，不成人之惡
  - label: D
    content: 然則今有「美」堯、舜、湯、武、禹之道於當今之世者，必為新聖笑矣。
  lesson_raw:
    title: 鄒忌諷齊王納諫
    basis: 題目指明出自〈鄒忌諷齊王納諫〉
- id: doc_113_高雄_陽明_國文_g9s2e1_s1_17
  section: 1
  number: 17
