- id: doc_113_高雄_陽明_國文_g9s2e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 〈鄒忌諷齊王納諫〉一文提及：「令初下，群臣進諫，門庭若市；數月之後，時時而間進；期年之後，雖欲言，無可進者。」根據本段說明，下列何者錯誤？
  options:
  - label: A
    content: 從「門庭若市」可以得知，自齊王下令後，進諫者眾多
  - label: B
    content: 「無可進者」是因為沒有賞金，所以沒有臣民願意進諫
  - label: C
    content: 齊國得以步入正軌而大治的關鍵在於齊王願意接納諫言
  - label: D
    content: 「時時而間進」因齊王已改善國政，可提出的諫言不多。
  lesson_raw:
    title: 鄒忌諷齊王納諫
    basis: 題目指明出自〈鄒忌諷齊王納諫〉
- id: doc_113_高雄_陽明_國文_g9s2e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 《墨子．兼愛》云：「昔者，楚靈王好士細腰，故靈王之臣，皆以一飯為節，脅息然後帶，扶牆然後起。比期年，朝有黧黑之色。」下列各選項之文意最符合上文旨趣的是？
  options:
  - label: A
    content: 上悅之，眾能為之
  - label: B
    content: 悅以使民，不竭其力
  - label: C
    content: 正人求諸己，小人求諸人
  - label: D
    content: 人生七尺軀，謹防三寸舌
- id: doc_113_高雄_陽明_國文_g9s2e1_s1_20
  section: 1
  number: 20
  type: single
  page: 3
  stem: 出自清 俞樾《一笑･戴高帽》文中所述：「其人出，語人曰：『吾高帽一百，今止存九十九矣。』」這段話的涵義，下列選項中的敘述何者正確？
  options:
  - label: A
    content: 說明一言既出，駟馬難追的重要
  - label: B
    content: 暗諷當局者迷，旁觀者清的道理
  - label: C
    content: 告誡物歸原主，不得侵占他人財
  - label: D
    content: 奉勸物盡其用，切勿任意隨手丟。
- id: doc_113_高雄_陽明_國文_g9s2e1_s1_21
  section: 1
  number: 21
  type: single
  page: 3
  stem: 擔任立法委員的甄玫利，對地方百姓訂立許多規章制度，但卻常為了自身的利益而無視規範，這種「只許州官放火，不許百姓點燈」的行為，可用下列哪句話來勸告他？
  options:
  - label: A
    content: 人不可無癖，宜設立界線
  - label: B
    content: 正人先正己，應以身作則
  - label: C
    content: 任重而道遠，必不遺餘力
  - label: D
    content: 人不可貌相，須明察言行。
- id: doc_113_高雄_陽明_國文_g9s2e1_s1_22
  section: 1
  number: 22
  type: single
  page: 3
  stem: 對於安祿山回答玄宗：「我肚中別無他物，只有滿滿的忠心啊！」這句話，我們可以用下列哪個選項來形容安祿山的為人？
  options:
  - label: A
    content: 正直敢言，忠心耿耿
  - label: B
    content: 心思縝密，為人設想
  - label: C
    content: 心懷鬼胎，假冒偽善
  - label: D
    content: 舌燦蓮花，口吐真言。
- id: doc_113_高雄_陽明_國文_g9s2e1_s1_23
  section: 1
  number: 23
  type: single
  page: 3
  stem: 關於呂蒙正不受鏡的原因，下列敘述何者正確？
  options:
  - label: A
    content: 贈與者沒有正式登門拜訪，無禮行為讓呂蒙正不受鏡
  - label: B
    content: 呂蒙正覺得鏡面太小，不足以顯現自己的身分及地位
  - label: C
    content: 明白胞弟的心意，故拒絕受鏡讓胞弟可順理成章擁有
  - label: D
    content: 與自身的操守相違背，故呂蒙正意有所指的委婉拒絕。
- id: doc_113_高雄_陽明_國文_g9s2e1_s1_24
  section: 1
  number: 24
  type: single
  page: 3
  stem: 錢若賡斷鵝的經過及結果，我們可以用下列哪二句話來形容他？
  options:
  - label: A
    content: 故弄玄虛，明察秋毫
  - label: B
    content: 束手無策，順應民情
  - label: C
    content: 胡扯亂謅，正中下懷
  - label: D
    content: 疾言厲色，痛懲奸人。
- id: doc_113_高雄_陽明_國文_g9s2e1_s1_25
  section: 1
  number: 25
  type: single
  page: 3
  stem: 試問下列選項中，關於語氣的說明，何者敘述正確？
  options:
  - label: A
    content: 你這胡兒肚子裡裝了什麼？怎會如此大呢？----責備語氣
  - label: B
    content: 我們按照正道對待別人，哪裡需要這樣呢！----讚嘆語氣
  - label: C
    content: 我的臉不過碟子那麼大，哪裡需要可照兩百里的鏡子呢？----嘲諷語氣
  - label: D
    content: 天底下像老師您這樣不喜歡被戴高帽的人，能有幾個呢？----反詰語氣。
- id: doc_113_高雄_陽明_國文_g9s2e1_s1_26
  section: 1
  number: 26
