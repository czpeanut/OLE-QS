- id: doc_113_高雄_陽明_國文_g9s2e1_s2_43
  section: 2
  number: 43
  type: single
  page: 8
  stem: 關於本文的內容，下列敘述何者正確？
  options:
  - label: A
    content: 道士會施法種梨，是想藉此賺取錢財
  - label: B
    content: 鄉人因車上的梨所剩不多，故不願施捨給道士
  - label: C
    content: 道士一發現鄉人夾雜在人群中觀看，便快速將梨樹砍斷
  - label: D
    content: 鄉人最後才知道道士分送的是自己的貨品，但已無法追究。
  group_stem: "有鄉人貨梨於市，頗甘芳，價騰貴。有道士破巾絮衣，丐於車前。鄉人咄之，亦不去，鄉人怒，加以叱罵。道士曰：「一車數百顆，老衲止丐其一，於居士亦無大損，何怒為？」觀者勸置劣者一枚令去，鄉人執不肯。\n\
    \  肆中傭保者，見喋聒不堪，遂出錢市一枚，付道士。道士拜謝，謂眾曰：「出家人不解吝惜，我有佳梨，請出供客。」或曰：「既有之，何不自食？」曰：「吾特需此核作種。」於是掬梨大啗，且盡，把核於手，解肩上鑱，坎地深數寸，納之而覆以土，向市人索湯沃灌。好事者於臨路店索得沸瀋，道士接浸坎處。萬目攢視，見有勾萌出，漸大。俄成樹，枝葉扶疏，倏而花，倏而實，碩大芳馥，纍纍滿樹。道士乃即樹頭摘賜觀者，頃刻向盡。已，乃以鑱伐樹，丁丁良久，乃斷，帶葉荷肩頭，從容徐步而去。\n\
    \    初，道士作法時，鄉人亦雜眾中，引領注目，竟忘其業。道士既去，始顧車中，則梨已空矣。方悟適所俵散，皆己物也。又細視車上一靶亡，是新鑿斷者，心大憤恨。急跡之，轉過牆隅，則斷靶棄垣下，始知所伐梨本，即是物也。道士不知所在，一市粲然。\n\
    （蒲松齡 《聊齋誌異》）"
- id: doc_113_高雄_陽明_國文_g9s2e1_s2_44
  section: 2
  number: 44
  type: single
  page: 8
  stem: 關於文中人物的對比，下列敘述何者正確？
  options:
  - label: A
    content: 以鄉人的怒罵不絕，對比道士的軟弱可欺
  - label: B
    content: 以道士的擅長種梨，對比鄉人的庸碌無能
  - label: C
    content: 以道士種梨送人的慷慨行為，對比圍觀群眾的自私自利
  - label: D
    content: 以店夥計主動買梨送道士的大方，對比鄉人堅持不願贈梨的吝嗇。
  group_stem: "有鄉人貨梨於市，頗甘芳，價騰貴。有道士破巾絮衣，丐於車前。鄉人咄之，亦不去，鄉人怒，加以叱罵。道士曰：「一車數百顆，老衲止丐其一，於居士亦無大損，何怒為？」觀者勸置劣者一枚令去，鄉人執不肯。\n\
    \  肆中傭保者，見喋聒不堪，遂出錢市一枚，付道士。道士拜謝，謂眾曰：「出家人不解吝惜，我有佳梨，請出供客。」或曰：「既有之，何不自食？」曰：「吾特需此核作種。」於是掬梨大啗，且盡，把核於手，解肩上鑱，坎地深數寸，納之而覆以土，向市人索湯沃灌。好事者於臨路店索得沸瀋，道士接浸坎處。萬目攢視，見有勾萌出，漸大。俄成樹，枝葉扶疏，倏而花，倏而實，碩大芳馥，纍纍滿樹。道士乃即樹頭摘賜觀者，頃刻向盡。已，乃以鑱伐樹，丁丁良久，乃斷，帶葉荷肩頭，從容徐步而去。\n\
    \    初，道士作法時，鄉人亦雜眾中，引領注目，竟忘其業。道士既去，始顧車中，則梨已空矣。方悟適所俵散，皆己物也。又細視車上一靶亡，是新鑿斷者，心大憤恨。急跡之，轉過牆隅，則斷靶棄垣下，始知所伐梨本，即是物也。道士不知所在，一市粲然。\n\
    （蒲松齡 《聊齋誌異》）"
