- id: doc_113_高雄_陽明_國文_g9s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 下列文句「」中的成語，何者使用最恰當？
  options:
  - label: A
    content: 沒想到他平日笑臉迎人，卻竟都是「會心一笑」，整人手段如此狠毒
  - label: B
    content: 這對夫妻兩人的年紀相差甚大，但因爲彼此相愛而成為「忘年之交」
  - label: C
    content: 只用個人見解就要評定天下人物，豈不就像「以管窺天」，自以為是？
  - label: D
    content: 從政者若「孤家寡人」，只求個人利益，違法亂紀的事就將層出不窮。
- id: doc_113_高雄_陽明_國文_g9s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: '關於馬致遠〈天淨沙秋思〉一曲，下列哪些敘述正確？

    （甲）「夕陽」二字點明時間，「瘦馬」二字由情入景，令人低迴不已 （乙）整首小令多為靜態景物的排列，而悲涼之氣自然充塞其間 （丙）作者是元曲四大家之一，曲風以豪放為主
    （丁）韻腳只有「鴉、家、馬、涯」四字'
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 甲丁
  - label: C
    content: 乙丙
  - label: D
    content: 乙丁。
  lesson_raw:
    title: 天淨沙秋思
    basis: 題目指明馬致遠〈天淨沙秋思〉
- id: doc_113_高雄_陽明_國文_g9s2e1_s1_9
  section: 1
