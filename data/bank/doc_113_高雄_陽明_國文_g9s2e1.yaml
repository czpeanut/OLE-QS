    2.店長每隔一小時就會向你詢問進度。\n3.沒有寫完不可以離開店裡。\n4.店內並沒有規定配戴口罩的義務（在店內不可能發生對話，請自行判斷）。\n5.店內提供插座、USB\
    \ 快充、高速無線網路、PC 散熱板給你使用。\n6.有咖啡、可帶外食、中途可以外出、不可付現（30 分鐘150 日圓）\n※詢問進度方式可選擇：溫和/嚴厲/普通\n\
    \n高圓寺三角地帶是由經營JUNS 株式會社、直播和YouTube 的川井拓也開設，平時是攝影複合工作室，提供訪談、節目與戲劇拍攝使用。但因為不時會遇到沒有形成預定的空檔，再加上空間也取得飲食經營執照，因此店長突發奇想，將這個空間搖身一變成為「影音剪片咖啡廳」（動画編集カフェ)、「趕稿寫作咖啡廳」（原稿執筆カフェ)等特色咖啡廳型態，一方面維持收益，一方面則能提供有需要的人一個好去處。\n\
    其實先前店長曾經開拓過「影像編輯咖啡廳」的路線，獲得很好的迴響，因此後續也出現「希望變成趕稿咖啡廳」這樣的聲音，如今算是幫大家圓夢，讓愛壓死線的人們找到了解方。為了讓這裡達到「趕稿」的功用，店長在開幕首日便在社群上寫下「不是被死線追著跑的人不准入店！為了維持店內的緊張感，敬請配合」的貼文，希望真的能夠幫助顧客擺脫拖延症。\n\
    \    雖然稿件、工作有無完成還是自己知道，但因為這裡有店長隨時盯進度，再加上進到店內的人們都是為了趕稿而來，空間中無形產生緊張壓力感，似乎也讓每位趕稿者更能進入狀況。\n\
    \                 （節選自洪雅筠「ShoppingDesign」網2022.04.20）"
