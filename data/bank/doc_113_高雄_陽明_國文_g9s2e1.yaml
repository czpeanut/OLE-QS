  stem: 下列文句，何者用字完全正確？
  options:
  - label: A
    content: 現在正值秋天，草木黃落，放眼望去盡是蕭澀的景象
  - label: B
    content: 他身材修長，形貌昳麗，是許多女子夢寐以求的對象
