- id: doc_113_高雄_陽明_國文_g9s2e1_s2_41
  section: 2
  number: 41
  type: single
  page: 7
  stem: 就上文作者的論述，請問下列說明何者能夠鍛鍊「感覺•運動腦」呢？
  options:
  - label: A
    content: 人的第六感是最真實的，判斷事物從第六感出發
  - label: B
    content: 長時間不斷訓練自己的五感，使自己成為專才者
  - label: C
    content: 心是一切根本，凡事專心致志必可順利提升能力
  - label: D
    content: 運動可以活化腦細胞，每天藉著鍛鍊體魄來增長。
  group_stem: "大腦的能力是無限的，它可以每天連續工作二十四小時。只要有足夠的睡眠，無論怎麼使用都不會讓大腦疲勞過度，而且大腦會愈用愈進化。\n  \
    \  要促進大腦進化，就需要給予五感更多的刺激。當然，不是所有的刺激都合適，而是那些對大腦活性化有促進作用的刺激。\n    有些人在練習英語會話時聽力較差，並不是因為天生不擅長英語，而是在理解母語和英語的口語時，聽覺的周波是不同的。用聽慣了國語、已經適應了國語周波的耳朵來聽英語，當然就無法提高學習效率。要想提高英語聽力，培養出一副習慣英語的耳朵，只能依靠集中進行原聲英語聽力訓練，比如每天早晨在坐車上班的路上，聽一聽前一天晚上錄下來的CNN\
    \ 新聞等。\n    一天二十四小時，你有多少時間分給了英語？讓我們試一下這樣的生活，每個星期天除了吃飯之，所有時間都盡量待在書房裡，一直播放著CNN 新聞，可以在書房裡讀書，也可以下圍棋或打掃，但是耳朵一定只用來聽英語。這樣，只需一天，你的聽力就能夠提升。但使用這種方法不能提高閱讀理解能力。透過集中時間聽英語，你的耳朵會被改造得更習慣聽英語。這種方法既不花錢，又可以在短時間內迅速提升英語聽力。\n\
    \    有些人支付了高額學費，用一年的時間去上英語會話班，但是英語能力完全沒有提高，因而感到非常苦惱。這些人其實已經具備了說英語的基本能力，但是首先要訓練「感覺腦」、改善聽力上著手，否則學習再努力也難以熟練的進行英語會話。\n\
    \    體育和樂器演奏也是同樣的道理，其實你早已經具備學習那一技能的潛力了，只是因為「感覺•運動腦」的鍛鍊方法不太對，所以沒能充分發揮自己的潛力罷了。玩象棋、圍棋、麻將等也可以透過反覆多次訓練感覺器官而提高效率，這一點適用於任何人。\n\
    \    鍛鍊我們的「感覺•運動腦」吧，你將輕鬆成為一個「有一技之長的人」。\n                                 （兒玉光雄《召喚成功的6\
    \ 種腦力》)"
