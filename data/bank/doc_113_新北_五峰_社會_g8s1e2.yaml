  section: 1
  number: 8
  type: single
  page: 1
  stem: 中國礦產相當豐富，早期因東北地區因為礦產豐富就成為中國重工業的主要生產基地。近年來，由於中國經濟起飛，工業發展所需的礦產原料，不只數量激增，且種類變多，國內的產量逐漸不敷使用，多數仰賴進口，因此沿海及長江沿岸，成為設廠的首選地區。根據中國工廠選址的方式，「早期」與「近年來」各自是以哪個區位因素為考量？
