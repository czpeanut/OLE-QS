  section: 1
  number: 5
  type: single
  page: 1
  stem: 1990 年代屈臣氏進駐中國，最初進入中國的 17 年裡，只完成 250 家分店的佈局。然而，至 2014 年竟以每兩天開設超過一家店鋪的速度拓展業務，該年就開設
    400 家店鋪，2012 年至 2015 年間，在中國開設近 700 家分店。上述情形與中國時代背景由何關聯？
  options:
  - label: A
    content: 因應改革開放，促使輕工業得以進入中國
  - label: B
    content: 西部大開發，多數企業將店鋪拓展至西部
  - label: C
    content: 出生率持續上升，大量人口成為消費市場
  - label: D
    content: 由世界工廠轉為製造強國，消費水準提高。
