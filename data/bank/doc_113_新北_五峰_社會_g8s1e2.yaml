- id: doc_113_新北_五峰_社會_g8s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 「甲」鐵路為中國西部大開發的建設之一，該工程難度極高，須穿越「乙」地區，此地區空氣稀薄且長期積雪地區，甚至在鐵路沿線設置加熱棒，避免凍土使鐵軌變形。「甲」、「乙」分別應為何？
  options:
  - label: A
    content: 青藏鐵路；橫斷山脈
  - label: B
    content: 中巴鐵路；橫斷山脈
  - label: C
    content: 青藏鐵路；青藏高原
  - label: D
    content: 中巴鐵路；青藏高原。
