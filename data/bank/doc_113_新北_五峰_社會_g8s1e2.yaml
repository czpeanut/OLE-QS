  section: 1
  number: 13
  type: single
  page: 2
  stem: 'S.H.E 女團曾唱過〈你曾是少年〉，歌詞唱到：「…卻在北京、上海、廣州、深圳某天夜半忽然醒來，站在寂寞的陽臺，只想從這無邊的寂寞中逃出來…」，唱出人們在都市的繁忙之中而迷失自我初衷的心境，這四大城市名列經濟發展前四名，各具不同特色，與下表對應，甲、乙、丙、丁依序為哪個城市？

    | 甲 | 為珠江出海口，歷代以來重要的商港。 |

    | :--- | :--- |

    | 乙 | 是中國首都，也是其政治、經濟、文化中心 |

    | 丙 | 位於珠江出海口，為中國第一個經濟特區。 |

    | 丁 | 擁有世界第一大港，為中國亞太門戶。 |'
