- id: doc_113_新北_五峰_社會_g8s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 中國曾在九年前頒布《中國製造 2025》，明年即是計畫截止的年份。目標是準備全面推動製造強國戰略，成為和歐美並駕齊驅的先進製造強國，強調擁有先進技術、高品質、高價產品的製造業強國，並以機械設備、工業自動化/智慧化和機器人為重心，目標在未來能和歐美日一樣。下列哪種概念最適合說明《中國製造
    2025》的核心想法？
  options:
  - label: A
    content: 利用政策、交通與勞力優勢，廣設經濟特區
  - label: B
    content: 將研發、製造與銷售串聯，形成紅色供應鏈
  - label: C
    content: 避免市場經濟導致紛亂，政府推行計劃經濟
  - label: D
    content: 積極開發原料，並以礦產優勢吸引外商投資。
  tags:
    chapter:
      publisher: 翰林
