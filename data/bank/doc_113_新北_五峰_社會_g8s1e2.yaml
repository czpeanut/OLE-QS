  type: single
  page: 1
  stem: 「麥草方格」據說是固沙工人工作閒暇時，偶然紮了“人定勝天”，竟意外發現這幾個字當中，方塊的形狀沒有被沙子埋沒，因此發明「麥草方格固沙法」避免土壤持續沙漠化。依照中國的環境特色，此工程應該分布於何處？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
