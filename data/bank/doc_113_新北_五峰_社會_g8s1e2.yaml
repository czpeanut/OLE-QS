  section: 1
  number: 3
  type: single
  page: 1
  stem: 曾經一位中國領導人說：「不管黑貓白貓，能捉到老鼠就是好貓」，表示無論是計畫經濟或者市場經濟，無非都是資源分配的手段，與政治制度無關，因此允許一部分的城市先流通與累積資本。上述說法導致中國得以執行哪項政策？
  options:
  - label: A
    content: 改革開放
  - label: B
    content: 西部大開發
  - label: C
    content: 一帶一路
  - label: D
    content: 紅色供應鏈。
