  section: 1
  number: 53
  type: single
  page: 2
  stem: '2021 年的公視電視劇《斯卡羅》，故事背景在1867 年，描述美國商船羅妹號（Rover）在臺灣南部恆春

    半島的瑯嶠地區發生海難。船上成員上岸求生時，因誤闖原住民的領地，被當地原住民誤為侵略者而

    被殺害，史稱「羅妹號事件」。請問：上述文中船員上岸的地點，最可能見到哪種沿海地形景觀？'
  options:
  - label: A
    content: 平淺的沙灘及寬廣平原
  - label: B
    content: 岬角及灣澳相間
  - label: C
    content: 崎嶇的珊瑚礁
  - label: D
    content: 陡峭的斷崖。
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 地理
      code: 4-2
      title: 臺灣的海岸與利用
