- id: doc_111_桃園_同德_社會_公民_g9s2e1_s1_41
  section: 1
  number: 41
  type: single
  page: 1
  stem: 預防COVID-19 病毒感染的疫苗有BNT、Novavax、Moderna、AZ 等各家疫苗，其中以AZ 較快上市且價格比他家廠商便宜，要感謝英國牛津大學研發團隊放棄擁有專利權，因為該團隊希望貧窮國家也能打得起疫苗，所以外界稱為「公益疫苗」。關於上文提及之「專利權」，何者敘述為正確？
  options:
  - label: A
    content: 完成時即取得專利權
  - label: B
    content: 專利權並無保障年限
  - label: C
    content: 目的為保護並鼓勵發明創作
  - label: D
    content: 詳細規範於《商標法》。
- id: doc_111_桃園_同德_社會_公民_g9s2e1_s1_42
  section: 1
  number: 42
  type: single
  page: 1
  stem: '科技的進步，對人類生活有正反兩面影響，無論結果如何，都須由人類共同承擔。

    下列哪一敘述是科技運用帶來的惡果？'
  options:
  - label: A
    content: 農業技術提升，生產出高營養價值及耐寒作物
  - label: B
    content: 網際網路興起，人人都可提供影音上傳，打破國與國的界限
  - label: C
    content: 透過手機APP 可讓用戶遠端遙控雲端智慧家電
  - label: D
    content: 網站連結暗藏陷阱，非法盜取個人資訊。
- id: doc_111_桃園_同德_社會_公民_g9s2e1_s1_43
  section: 1
  number: 43
  type: single
  page: 1
  stem: 承上題，要解決上述問題，請問何者的作法不恰當？
  options:
  - label: A
    content: 蕭楚河:應該強化人類的科技倫理
  - label: B
    content: 歸曉:採取放任措施不加以處罰
  - label: C
    content: 司空洛:明確規範科技的使用範圍
  - label: D
    content: 炎晨:對侵害公眾利益的非法行為，訂立相關法律處罰
  group_stem: '（第 42 題）科技的進步，對人類生活有正反兩面影響，無論結果如何，都須由人類共同承擔。

    下列哪一敘述是科技運用帶來的惡果？'
- id: doc_111_桃園_同德_社會_公民_g9s2e1_s1_44
  section: 1
  number: 44
  type: single
  page: 1
  stem: 在2003 年，某民眾為抗議開放白米進口的問題，放置3 顆用稻米與火藥做成的炸彈，震驚全台灣！他在炸彈的外觀貼「不要進口白米」的字條，揭露加入WTO
    對台灣農業的衝擊。根據上文，這位民眾為何反對稻米進口？
  options:
  - label: A
    content: 會加劇國內貧富差距問題
  - label: B
    content: 消費者無法接受進口的稻米
  - label: C
    content: 我國稻米成產成本高於其他國家稻米
  - label: D
    content: 我國稻米品質優於其他國家稻米。
- id: doc_111_桃園_同德_社會_公民_g9s2e1_s1_45
  section: 1
  number: 45
  type: single
  page: 1
  stem: 二月十五日各大新聞媒體報導某知名藝人於日前在美國因心肌梗塞而逝世，此消息一出震撼華人影藝圈。不料隔天，由藝人的親屬親自證實該知名藝人目前身體健康在世，並未因心肌梗塞而逝世。證實報導與現實不符，這類新聞層出不窮，凸顯資訊科技的何種隱憂？
  options:
  - label: A
    content: 個人資料外洩
  - label: B
    content: 訊息真偽難辨
  - label: C
    content: 影響人際溝通
  - label: D
    content: 破壞生態環境
- id: doc_111_桃園_同德_社會_公民_g9s2e1_s1_46
  section: 1
  number: 46
  type: single
  page: 1
  stem: 新聞報導：「某公司舉辦抽獎活動時，蒐集消費者的資料作為日後業務推銷資料。然根據政府規定依法蒐集的資料僅可使用於此次抽獎，於活動結束後，應將消費者的人資料須全數銷毀」，根據上文法規內容，何者敘述錯誤？
  options:
  - label: A
    content: 此法規稱為《個人資料保護法》
  - label: B
    content: 避免個人資料遭人盜用
  - label: C
    content: 保護民眾的隱私權與財產權
  - label: D
    content: 避免造成資訊氾濫的情形。
- id: doc_111_桃園_同德_社會_公民_g9s2e1_s1_47
  section: 1
  number: 47
  type: single
  page: 1
  stem: '政府為保障人類運用智慧發明創作所得之成果，制定保護智慧財產的相關法律，除了讓所有權人獲得經濟利益的保障之外，進一步希望鼓勵發明創新，促進社會的發展與進步。下列何者為上述的法律？

    (甲)《民法》 (乙)《著作權法》(丙)《憲法》(丁)《商標法》(戊)《積體電路電路布局保護法》(己)《公司法》(庚)《個人資料保護法》'
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙丁戊
  - label: C
    content: 丙戊庚
  - label: D
    content: 丁戊己。
- id: doc_111_桃園_同德_社會_公民_g9s2e1_s1_48
  section: 1
  number: 48
  type: single
  page: 1
  stem: 請問下列舉例與相關法規配對，何者出現錯誤？
  options:
  - label: A
    content: 天龍八部小說－－《著作權法》
  - label: B
    content: 暮光之城電影－－《著作權法》
  - label: C
    content: 肯德基的笑臉爺爺圖片－－《商標法》
  - label: D
    content: 戴森無葉電風扇－－《商標法》。
- id: doc_111_桃園_同德_社會_公民_g9s2e1_s1_49
  section: 1
  number: 49
  type: single
  page: 1
  stem: 在台灣，我們可以享用到智利的櫻桃、祕魯秋翠葡萄、宏都拉斯哈密瓜、美國砂糖橘等水國，其原因為下列何者？
  options:
  - label: A
    content: 國際條約的簽訂
  - label: B
    content: 以物易物的興盛
  - label: C
    content: 跨國企業的強大
  - label: D
    content: 跨國貿易的發達。
- id: doc_111_桃園_同德_社會_公民_g9s2e1_s1_50
  section: 1
  number: 50
  type: single
  page: 1
  stem: 麥當勞公司在全球近120 個國家設有分公司，其產品採購、設計、製造、資訊產品、服務業務等，均由不同國家的不同部門來執行，其中主要目的為何？
  options:
  - label: A
    content: 促進國際交流
  - label: B
    content: 增加就業機會
  - label: C
    content: 降低生產成本
  - label: D
    content: 傳播速食文化。
- id: doc_111_桃園_同德_社會_公民_g9s2e1_s1_51
  section: 1
  number: 51
  type: single
  page: 1
  stem: 台灣加入WTO 後，國內蘭花產業未受衝擊還成為頗具競爭力的產業，其中台灣蝴蝶蘭更成為歐美及日本市場的新寵兒，全球約有80%的蝴蝶蘭由台灣出口。依上文內容判斷，這是受下列哪一因素影響？
  options:
  - label: A
    content: 我國生產蘭花較具競爭優勢
  - label: B
    content: 國際蘭花市場規模較小
  - label: C
    content: 我國經濟不景氣
  - label: D
    content: 我國蘭花需求量小。
- id: doc_111_桃園_同德_社會_公民_g9s2e1_s1_52
  section: 1
  number: 52
  type: single
  page: 2
  stem: 某些國家為了吸引外商到此投資以發展當地經濟，會先忽略本國環境保護的要求，而逐漸對當地的環境造成負擔。請問下列哪一國家最可能採取上述方法吸引外商投資？
  options:
  - label: A
    content: 寮國
  - label: B
    content: 德國
  - label: C
    content: 日本
  - label: D
    content: 美國。
- id: doc_111_桃園_同德_社會_公民_g9s2e1_s1_53
  section: 1
  number: 53
  type: single
  page: 2
  stem: 台灣垃圾車沿街收集垃圾時的廣播提示音樂有兩種，其中耳熟能詳的《少女的祈禱》，是波蘭女作曲家特克拉·巴達捷夫斯卡的傳世名作，於1851 年在華沙出版，若有作曲家將此歌曲旋律重新編曲與翻唱。關於該作曲家的作法，下列分析何者最適當？
  options:
  - label: A
    content: 不屬於合理使用範圍
  - label: B
    content: 該作曲家使用行為未違反法律
  - label: C
    content: 波蘭女作曲家的後代可請求民事賠償
  - label: D
    content: 已經觸犯波蘭女作曲家的著作權。
- id: doc_111_桃園_同德_社會_公民_g9s2e1_s1_54
  section: 1
  number: 54
  type: single
  page: 2
  stem: 茂盛國擁有高水準的科技人才，因此在科技產業有高度競爭力，美妙國擁有優良的自然環境與先進的農牧技術，因此畜牧業在國際上具有競爭優勢。關此這兩國間的進出口貿易發展，下列敘述何者正確？
  options:
  - label: A
    content: 茂盛國應該從外國進口高科技產品
  - label: B
    content: 茂盛國應該發展高科技產業做為出口主力
  - label: C
    content: 美妙國應該發展高科技產業進行外銷
  - label: D
    content: 美妙國應該至茂盛國發展農牧業然後外銷其他國家。
- id: doc_111_桃園_同德_社會_公民_g9s2e1_s1_55
  section: 1
  number: 55
  type: single
  page: 2
  stem: 許多人喜歡如CAOAH、Celine、Gucci、Dior 等名牌皮件，而皮件商品的皮革初期生產需耗費大量人力，因此皮革廠多設置在下列哪一個地方？
  options:
  - label: A
    content: 開發中國家
  - label: B
    content: 已開發國家
  - label: C
    content: 未開發國家
  - label: D
    content: 高開發國家。
- id: doc_111_桃園_同德_社會_公民_g9s2e1_s1_56
  section: 1
  number: 56
  type: single
  page: 2
  stem: '下表是某一年度四個國家進出口貿易的數據，根據表中資料判斷，哪一國家正處於「貿易收入大於貿易支出的國家」的狀態？


    | | 出口總額 | 進口總額 |

    | --- | --- | --- |

    | (A)青龍國 | 225 億美金 | 150 億美金 |

    | (B)白虎國 | 1280 億美金 | 2350 億美金 |

    | (C)朱雀國 | 325 億美金 | 452 億美金 |

    | (D)玄武國 | 2230 億美金 | 4320 億美金 |'
  options:
  - label: A
    content: 青龍國
  - label: B
    content: 白虎國
  - label: C
    content: 朱雀國
  - label: D
    content: 玄武國
- id: doc_111_桃園_同德_社會_公民_g9s2e1_s1_57
  section: 1
  number: 57
  type: single
  page: 2
  stem: 由於全球經濟市場互相連結，且國際貿易需互惠共利。基於發展經濟，並使得消費者與廠商的權益不受侵害，各國政府在開放進口時，應多方考量利弊得失，才能減少對國內產業的衝擊，使消費者真正獲利。上述內容符合以下何項經濟概念？
  options:
  - label: A
    content: 負向誘因
  - label: B
    content: 負擔能力原則
  - label: C
    content: 機會成本
  - label: D
    content: 計畫經濟。
- id: doc_111_桃園_同德_社會_公民_g9s2e1_s1_58
  section: 1
  number: 58
  type: single
  page: 2
  stem: '如下列所述，跨國企業利用國際分工的生產模式，主要為達成哪些目標？


    > 跨國企業在世界各地進行資源分配，尋找最佳的生產地，例如購買非洲農礦，在東南亞設置工廠生產，運用日本、美國研發的技術等。


    (甲)獲得更高利潤(乙)降低生產成本(丙)增加企業母國低技術勞工工作機會(丁)促使財富分配平均'
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 甲丙
  - label: C
    content: 乙丁
  - label: D
    content: 丙丁。
- id: doc_111_桃園_同德_社會_公民_g9s2e1_s2_59
  section: 2
  number: 59
  type: single
  page: 2
  stem: 上述對兩國透過跨國貿易活動，以下列何項敘述來說明最適切？
  options:
  - label: A
    content: 對黑熊國有利，不須生產家電產品的製造
  - label: B
    content: 對白鶴國有利，不須擔心原料匱乏的問題
  - label: C
    content: 對兩國都有利，提高生產資源的使用效率
  - label: D
    content: 對兩國都不利，消費者無法買到他國產品。
  group_stem: '＊黑熊國與白鶴國兩國有密切的貿易往來。下表是兩國彼此之間主要進出口物品資料。請問：


    | | 主要進口物品 | 主要出口物品 |

    | --- | --- | --- |

    | 黑熊國 | 原物料、民生物資 | 家電產品 |

    | 白鶴國 | 家電產品 | 原物料、加工製造品 |'
- id: doc_111_桃園_同德_社會_公民_g9s2e1_s2_60
  section: 2
  number: 60
  type: single
  page: 2
  stem: 下列哪一項跨國貿易活動為白鶴國帶來貿易收入？
  options:
  - label: A
    content: 進口原物料
  - label: B
    content: 進口家電產品
  - label: C
    content: 出口家電產品
  - label: D
    content: 出口加工製造品。
  group_stem: '＊黑熊國與白鶴國兩國有密切的貿易往來。下表是兩國彼此之間主要進出口物品資料。請問：


    | | 主要進口物品 | 主要出口物品 |

    | --- | --- | --- |

    | 黑熊國 | 原物料、民生物資 | 家電產品 |

    | 白鶴國 | 家電產品 | 原物料、加工製造品 |'
