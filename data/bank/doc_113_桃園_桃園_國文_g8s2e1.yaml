- id: doc_113_桃園_桃園_國文_g8s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: '用來模擬事物或動作等聲音的詞，稱為「狀聲詞」，例如〈木蘭詩〉中，以「濺濺」形容水流聲、以「啾啾」形容馬鳴聲、以「霍霍」形容磨刀聲等。下列例句何者使用的疊字辭屬於「狀聲詞」且解釋正確？


    | | 例句 | 解釋 |

    | :--- | :--- | :--- |

    | (A) | 十年生死兩「茫茫」。不思量，自難忘 | 水勢浩大無邊。 |

    | (B) | 薄暮空潭曲，「涓涓」細流通 | 形容清脆的水流聲。 |

    | (C) | 新鬼煩冤舊鬼哭，天陰雨溼聲「啾啾」 | 形容馬鳴聲。 |

    | (D) | 我聞琵琶已嘆息，又聞此語重「唧唧」 | 形容嘆息聲。 |'
  options:
  - label: A
    content: 十年生死兩「茫茫」。不思量，自難忘／水勢浩大無邊。
  - label: B
    content: 薄暮空潭曲，「涓涓」細流通／形容清脆的水流聲。
  - label: C
    content: 新鬼煩冤舊鬼哭，天陰雨溼聲「啾啾」／形容馬鳴聲。
  - label: D
    content: 我聞琵琶已嘆息，又聞此語重「唧唧」／形容嘆息聲。
  tags:
