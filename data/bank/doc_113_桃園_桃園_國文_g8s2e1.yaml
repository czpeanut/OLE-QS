- id: doc_113_桃園_桃園_國文_g8s2e1_s2_35
  section: 2
  number: 35
  type: single
  page: 6
  stem: 下列關於「大美不言」展覽的描述，何者最符合展覽的特色？
  options:
  - label: A
    content: 展覽主題強調歐洲裝飾藝術與東方藝術的對比，並以競爭關係來展示其異同
  - label: B
    content: 展覽涵蓋多個文化與歷史時期，透過材質、工藝與風格的分類來呈現跨時代藝術特色
  - label: C
    content: 展覽以靜態展示為主，並排除科技與互動元素，以維持藝術的純粹性
  - label: D
    content: 展覽主要強調梵克雅寶珠寶工藝的發展，並以此為主線來串聯不同時代的藝術品
  group_stem: "請閱讀以下短文，並回答35～37 題：\n故宮《大美不言》展覽概述：體驗無須言語的視覺魅力\n「大美不言」典藏精粹特展移師嘉義故宮南院千萬別錯過\n\
    \ 「天地有大美而不言」出自〈莊子．知北遊〉，意喻天地間蘊含非凡、無法言喻的美麗事物，無須藉由言語來表達。國立故宮博物院、巴黎裝飾藝術博物館（Paris Musée\
    \ des Arts Décoratifs）與Van Cleef & Arpels 梵克雅寶三方共同策劃的「大美不言」典藏精粹特展，繼在台北故宮累積近50\
    \ 萬參觀人次，1 月23 日移師故宮南院展出至4月20 日止，邀請觀者踏上穿越時間的沉浸式旅程，探索定義裝飾藝術的複雜工藝與創新，百年難遇的精彩展出千萬別錯過。\n\
    \ 精選三方典藏珍品，涵蓋陶瓷、玉石、家飾、瓷器、服飾、雕塑、平面藝術、珠寶與鐘錶等，講述東西方工匠藝師共通的靈光繆思。考量260 件來自三方的瑰麗藏品橫跨古今時空和東西地域，策展團隊依然保留「自然萬物」、「動靜有形」、「奇幻仙境」、「神祕莫測」和「五彩繽紛」5\
    \ 大主題單元，透過相似主題材質、工藝與視覺風格的系統歸納，讓觀者有機會深入領略不同年代、地區的工藝演進與創意展現，見證傳統工藝的豐富內蘊，見證跨文化交流在歷史發展中的重要地位。每一展櫃同時並陳三方館藏精粹，包括96\
    \ 組件故宮藏品、80 件裝飾藝術博物館藏品及85 件Van Cleef & Arpels 梵克雅寶典藏珍品。透過跨時代、地域及文化的匠心之作，彼此連結與呼應，令人感受「人造物」那份媲美自然，無須言語傳遞的魅力。\n\
    \ 為了讓南部觀眾也能感受北院深受歡迎的沉浸式體驗，移師故宮南院展出的「大美不言」典藏精粹特展同樣邀請到日本設計師田根剛打造繽紛詩意的沉浸式展場，結合透明、懸浮的空間設計，讓展品在各自獨立空間自行展現美感並彼此對話，觀者延著其所創造如迷宮般的參觀路徑，在各主題區背景音樂陪伴下逐步探索，深度感受展品的非凡工藝，領略三方典藏瑰寶不言自證的臻美姿態。\n\
    \ 過去，故宮展覽多聚焦於文物的藝術史脈絡與文化內涵，本次改以美學角度切入，帶領觀眾逐步感受物件裝飾散發的視覺魅力。展場內，策展團隊刻意排除知識訊息的介入與干預，所有展品除了品名卡資訊外，未放置過多的說明文字。如同在漆黑的展場中，光源只聚焦於展品，僅留些許餘光為觀眾引路。對那些失去文字指引的觀眾而言，唯一能做的，便是全神貫注地欣賞眼前的作品。"
  tags:
    textbook: 八下 第五課 陋室銘
    labeled_by: ai
