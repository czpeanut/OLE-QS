  section: 2
  number: 38
  type: single
  page: 7
  stem: 根據健康管理建議，下列哪一個方法有助於降低心血管疾病風險？
  options:
  - label: A
    content: 每天攝取高脂肪、高糖的飲食，補充能量
  - label: B
    content: 吸菸能夠穩定血壓，減少心血管疾病的風險
  - label: C
    content: 每天喝 3,000 c.c.的水，促進血液循環
  - label: D
    content: 每週進行至少 150 分鐘的中等強度運動
  group_stem: "請閱讀以下圖文，並回答 38～40 題：\n 慢性腎臟病早期無明顯症狀，糖尿病、高血壓、肥胖是主要原因！成人健檢數據顯示3 成三高患者有腎功能異常。114\
    \ 年起國民健康署新增30-39 歲每5 年1 次健康檢查、擴大成人健檢服務，並且提供「腎病識能衛教指導」，幫助民眾掌握腎臟健康，預防「腎」於治療！\n【掌握護腎8\
    \ 招 人生逆轉「腎」】\n一、 均衡飲食：均衡攝取六大類原型食物，避免加工食品、甜點、油炸物等\n二、 飲水充足：健康成人建議每日攝取約2,000 c.c.的水\n\
