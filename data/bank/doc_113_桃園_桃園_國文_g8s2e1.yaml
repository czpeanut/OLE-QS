  section: 1
  number: 31
  type: single
  page: 5
  stem: '「布萊爾斯福德跟他的團隊繼續在被忽略、未被料想到之處尋求百分之一的改善：測試不同的按摩油，看哪種能讓肌肉最快恢復；雇請一名外科醫師來教導選手如何洗手，以減少感冒的機率；為每個選手找出能帶來最佳睡眠品質的枕頭與床墊；他們甚至把後勤卡車的內壁漆成純白，以便察覺到往往會被看漏的細小塵埃，避免其影響到精確調校過的比賽用車。           。

    之後短短五年，英國自行車隊就在北京奧運稱霸公路賽與場地賽項目，拿下六成的金牌，驚天動地。」(節錄自〈原子習慣〉)

    依據上文，畫線部份最適合接續的選項是何者？'
  options:
  - label: A
    content: 百分之八十的時間裡，癌症都無法被檢測到，卻在幾個月內接管整個身體
  - label: B
    content: 習慣就是「自我改善」這件事的複利。習慣的效果也在你重複執行的過程中加倍
  - label: C
    content: 在任何追尋的前期或中期，常常出現所謂的「失望之谷」——你期待有線性進展
  - label: D
    content: 當數百個這類微小的改善累積起來，成果來得比所有人的預想都快
  tags:
    textbook: 八下 第一課 運動家的風度
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 八下
      subject: 國文
      code: 第一課
      title: 運動家的風度
      chapter: null
- id: doc_113_桃園_桃園_國文_g8s2e1_s1_32
  section: 1
  number: 32
  type: single
  page: 5
  stem: '《公無渡河》又名《箜篌引》。東漢蔡邕《琴操》中記述：一天早晨，霍里子高划船，見一狂夫披散頭髮，提壺渡河。他的妻子在後面制止他，他不聽，終於淹死了。其妻援箜篌而歌：「公無渡河，公竟渡河。墮河而死，將奈公何！」聲甚悽愴，曲終也投河而死。

    古人常吟此詩來諷喻對方，《大軍師司馬懿之軍事聯盟》中司馬懿與曹丕屢提這首詩，其大意用心如此。下列何者是此詩所欲傳達的啟示？'
  options:
  - label: A
    content: 前路莫測或身處險境時切不可執迷不悟、苦勸不聽，不納諫將有嚴重的危險
  - label: B
    content: 人在順境時，應當珍惜機會，不可輕忽安逸，時機一旦錯過，就無法重來
  - label: C
    content: 真正珍惜自身安全的人，不應過於追求顯赫的名聲，因為過度張揚容易帶來禍患
  - label: D
    content: 強調學習的重要性，光靠空想無法成就大事，唯有持續學習才能提升自己
  tags:
    textbook: 八下 第二課 木蘭詩
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 八下
      subject: 國文
      code: 第二課
      title: 木蘭詩
      chapter: null
