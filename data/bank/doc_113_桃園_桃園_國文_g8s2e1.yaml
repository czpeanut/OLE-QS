  stem: 以下是一則詩體由來的簡介：「□□」詩作為一種詩體的名稱，是由漢代專門掌管音樂的官署而來。漢代人把當時由機關所編錄和演奏的詩篇稱為「歌詩」，魏晉六朝時，才開始稱這些歌詩為「□□」或「□□詩」。從此，在中國古典詩歌中，便有了這一門類和名稱。」根據這段文字的描述，缺空處應填入下列何者？
  options:
  - label: A
    content: 樂府
  - label: B
    content: 古體
  - label: C
    content: 近體
  - label: D
    content: 現代
