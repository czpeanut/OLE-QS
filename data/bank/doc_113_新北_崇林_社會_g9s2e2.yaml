  group_stem: '芳芳拿出一組人物卡：請參賽者依照題目給予的提示，回答下列問題

    (甲)德國牧師馬丁·尼莫拉於1946 年寫了一首懺悔詩〈起初他們……〉：「起初，納粹抓○○人的時候，我沉默，因為我不是○○人。當他們抓社會民主主義者的時候，我沉默，因為我不是社會民主主義者。……當他們抓猶太人的時候，我沉默，因為我不是猶太人。最後當他們來抓我時，再也沒有人站起來為我說話了。」

    (乙)西元1938 年，英國首相張伯倫發表演說：「我認為，目前捷克斯洛伐克問題的解決只是更大規模解決方案的序曲而已，而這項方案將使整個歐洲都能獲得和平。今天早上，我與德國總理希特勒先生進行了另一次會談，而這張紙上有他和我兩人的簽名。……我的好朋友們，英國首相在我們的歷史上第二次從德國回來，帶來了和平。我相信這是〈我們這個時代的和平〉。」

    (丙)列寧於1917 年發表〈告工人、士兵和農民書〉：「如果政權由蘇维埃掌握，俄國將有一個工農政府，……立刻向一切交戰國的人民提出公正的和約。那時人員就會知道誰要非正義的戰爭。那時人民就會在立憲會議中作出决定。如果政權由蘇维埃掌握，那麼立刻就會宣布地主的土地是全體人民的财產。《列寧全集，卷34》」'
