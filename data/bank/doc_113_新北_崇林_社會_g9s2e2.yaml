  group_stem: '請閱讀下列文章，回答第07-08題：


    美國北達科他州的田野景觀，過去一向是由亞麻籽的藍、向日葵的黃，以及小麥的琥珀色交織而成的。近年來，當地在夏季時，放眼盡是黃豆苗的綠。當地的農戶提及：「四年前，我們根本不種黃豆，但目前近三分之一的農地都種黃豆。」黃豆的種植已深入巴西內陸草原、阿根廷大草原及美國的農業心臟地帶，在這三個國家的產量佔全球總產量的八成以上。

    黃豆田在全球快速擴張，主因是中國對黃豆需求量大增。黃豆有絕佳的蛋白質來源，碾碎的豆粕，可以快速養肥豬、雞等牲畜。但由於中國本土的黃豆年產量僅1,500 萬噸，並且中國國產黃豆的成本較進口黃豆還高，其需求靠食品禁用基改作物尚能勉強維持，而中國禽畜飼料用黃豆與煉油黃豆則不在此限，屬於基改工程下的產物。因此，原本中國政府堅持自給自足的糧食政策，卻對進口黃豆敞開大門。'
