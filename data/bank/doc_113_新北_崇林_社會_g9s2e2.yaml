  - label: D
    content: 極端氣候事件更為劇烈
  group_stem: '◎讀完下文，回答第26~27 題

    「末日鐘」（Doomsday Clock）是一虛構鐘面，由芝加哥大學的原子科學家公報雜誌社（Bulletin of the Atomic Scientists）於1947
    年冷戰期間設立，標示出世界受核毀滅威脅的擊破程度：午夜零時象徵世界末日來臨。

    科學家透過觀察國際局勢、科技發展和全球現象，每年宣布末日鐘的時間，最近一次調整是在2025 年的1 月28日自去年再往前撥快一秒，距離象徵毀滅點的午夜剩下89
    秒，是史上最接近午夜的時刻。

    原子科學家公報的科學與安全委員會主席霍爾茲（Daniel Holz）說：「影響2024 年決策的因素包括……等，這些因素雖非2024 年首見，但解決這些關鍵挑戰的進展卻不足。」且表示將世界從懸崖邊緣拉回來的責任，主要落在美國、中國和俄羅斯的肩上，並疾呼國際間展開善意對話。'
  shared_asset: g2_26_27
