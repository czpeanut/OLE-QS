  stem: 關於甲、乙二文的內容，下列敘述何者正確？
  options:
  - label: A
    content: 「遺其雙鶴」乃某人表達與支公癖好相同，以討好支公
  - label: B
    content: 「如有懊喪意」描述支公見鶴鳥垂頭喪氣，而心生懊悔
  - label: C
    content: 「何肯為人作耳目近玩？」表示支公終能理解鶴鳥天性
  - label: D
    content: 「五素不得一紫」指齊國上行下效以致於全國難買紫衣
  group_stem: "【甲】\n    支公①好鶴，住剡東峁山，有人遺其雙鶴；少時，翅長欲飛，支意惜之，乃鎩其翮。鶴軒翥②不能復起，乃舒翼反頭視之，如有懊喪意。林曰：「既有凌霄之姿，何肯為人作耳目近玩？」養令翮成，置使飛去。\n\
    （出自《世說新語．言語第二》）\n【乙】\n    齊桓公好服紫，一國盡服紫。當是時也，五素不得一紫。桓公患之，謂管仲曰：「寡人好服紫，紫貴甚，一國百姓好服紫不已，寡人奈何？」管仲曰：「君欲止之，何不試勿衣紫也？謂左右曰：『吾甚惡紫之臭。』於是左右適有衣紫而進者，公必曰：『少却，吾惡紫臭。』」公曰：「諾。」於是日，郎中③莫衣紫；其明日，國中莫衣紫；三日，境内莫衣紫也。\n\
    （出自《韓非子．外儲說左上》）\n註：①支公：支遁，字道林，晉 河內 林慮(今河南省 林縣)人。東晉名僧。世稱支公，又稱林公。\n②軒翥：振翅高飛。 ③郎中：官名，侍衛近臣，此處泛指宮中官員。"
