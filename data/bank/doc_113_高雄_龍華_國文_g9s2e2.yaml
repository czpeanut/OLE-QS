  stem: 根據本文，科技發展對社會造成的影響，下列敘述何者正確？
  options:
  - label: A
    content: 網路的影響遠遠超過往昔所有科技發明，改變了人類生活的全部面向
  - label: B
    content: 洗衣機的普及讓美國家庭傭工的需求量下降，有效降低家庭生活開支
  - label: C
    content: 電報發明使跨大西洋訊息的傳遞速度大幅提升，全世界因此改變甚鉅
  - label: D
    content: 因電子郵件傳遞的速度只比傳真機快五倍，因此網路的發明意義不大
  group_stem: "當我們說：網路帶來翻天覆地的改變，是否只因它發生在眼前？\n    1870 年代的美國，家庭傭工占就業人口8%，到1990 年代只占0.6%。家庭傭工減少，與家電問世關係密切。美國1940\
    \ 年代的一項調查顯示：洗38 磅衣服，人工需4 小時，用洗衣機只花41 分鐘。當家事不再占用大量時間，家庭成員的生活也跟著改變。美國35～44 歲已婚白人婦女的外出工作比率，1890\
    \ 年代極低，2000年代則將近80%。女性在家庭和社會的角色轉變，使重男輕女的觀念逐漸消失，進而提高女性的地位。\n    在1866 年跨大西洋有線電報啟動之前，一份300\
    \ 字文件以輪船寄送約要兩星期，但改用電報傳輸，只需7.5 分鐘，速度快了2500 倍以上。而網路發明後， email 發送300 字訊息雖只要2 秒，卻只比用傳真機花10秒快了5\
    \ 倍。\n    洗衣機、電報和網路均對世界產生革命性的影響，但當前過度宣稱網路無遠弗屆的效益，往往造成一些國家誤以為製造業已經「過時」，應努力靠創意過活，導致產業發展失衡。當我們回顧過往至今的科技發展，不應「把望遠鏡拿反」，以免對國家政策、企業經營或個人職涯，做出失當的決定。（網路文章）"
