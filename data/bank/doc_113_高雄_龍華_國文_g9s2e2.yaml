  stem: '底下為某書畫大師對兩幅書法作品的鑑賞說明，綜整(甲)、(乙)兩文，最有可能是指何種字體？

    (甲)：通篇為方筆，方整勁挺，稜角分明，結構謹嚴，筆法凝練；書風端正樸茂，方勁雄渾，被尊為方筆典範。其用筆，有時波磔分明，有時四角方折，字體方整中多變化，樸厚中見媚勁，外方內圓，內擫外拓，方整而不板滯，乃為上品。

    (乙)：筆劃略粗，給人一種更為豐滿的感覺。它的橫畫起筆略向下壓，筆勢稍稍向下，使得字的體勢稍斜，更增靈秀之美；而捺畫沉重有力，燕尾呈方形挑出，遒勁有力。'
