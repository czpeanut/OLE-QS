  - label: D
    content: 英國生物學家提出「藤壺屬於甲殼動物」的說法，至今出現已逾一百八十多年
  group_stem: "「咦，這些貝類好像火山哪！」「小心，不要被這些尖尖的貝殼劃傷。」\n    礁岩上密密麻麻的藤壺就像小火山，加上外形酷似貝殼，瑞典分類學家林奈及法國自然學家居維葉，都把藤壺當成貝類；直到一八三五年，英國海洋生物學家約翰．湯姆森出版了藤壺從卵到幼蟲的報告，發現幼蟲與甲殼動物的幼蟲類似，這才證明了酷似貝類的藤壺，竟然是蝦蟹的親戚呢！\n\
    \    藤壺剛從母體釋放到海中的時候是有腳的，牠們能用三對附肢游泳，稱為「無節幼蟲」。等到變態為「腺介幼蟲」，開始尋找適合著陸的地點，並且分泌出獨特的黏著劑，準備把自己牢牢固定住；著陸地點可能是海邊岩礁、漂流物、船殼，甚至是鯨或海龜身上。變態成「腺介幼蟲」的時候，藤壺原先的附肢變成捕食的蔓足，大部分的種類從此一輩子待在固定地點，以「守株待浮游動物」的方式討生活。\n\
    \    藤壺從卵孵化到變態的過程，古人無法親眼目睹全貌，因此對岩礁上的藤壺有許多臆測，並且依據外觀將牠們歸為貝類。清 康熙年間的聶璜在《海錯圖》指出撮嘴，即現今的藤壺，「非螺非蛤而有殼」，推測牠的來源是「水花凝結而成」！東西方大師受限於當時的知識，得到的結論縱然悖於現代的觀點，卻也合乎邏輯，這都是科學演變的必經過程。不過，聶璜引述好友的描述，指出藤壺「開殼伸爪可收潮內細蟲以食」，倒是精確說明藤壺以蔓足捕捉浮游動物的樣貌。\n\
    \    有些種類的藤壺，只會棲息在特定種類的鯨身上，例如桶冠鯨藤壺和隱鯨藤壺，分別在座頭鯨與灰鯨身上才找得到。目前，這兩種鯨都有長途遷徙的習性，牠們游過不會留下證據，如何推測牠們遷徙的路徑呢？\n\
    \    藤壺的外殼由碳酸鈣組成，碳酸鈣需要的氧原子，在成長的過程由周圍的海水取得。海水中的氧原子有「氧18」與「氧16」兩種同位素，不同海域的氧同位素比例各不相同。二○一九年，加州\
    \ 柏克萊大學的研究團隊想出妙招：既然藤壺跟著鯨遨遊各地，分析外殼的氧同位素比例，就可以推測藤壺到過哪些海域，不就找出鯨的遷徙路徑了嗎？這篇創意十足的論文，刊登於《美國國家科學院刊》。\n\
    \    相同的研究方法，也用於搜尋飛機失事地點。二○一四年，馬來西亞航空M370 號班機在印度洋上空失聯，迄今下落不明。科學家在法屬留尼旺島找到一片飛機殘骸，根據上頭藤壺的氧同位素比例，重建殘骸曾漂流於東經七十度以西、南緯二十度以南。這篇二○二三年刊載於《美國地球物理學會進展》的文章，進一步縮小失事地點的範圍，再次揭露海洋科研蘊藏無窮潛力。"
