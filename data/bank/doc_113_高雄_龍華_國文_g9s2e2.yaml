  stem: '名稱：自然人憑證

    ⚫ 申辦說明：

    大家都知道網路很方便，但過去政府無法在網路上為人民服務，主要原因除了網路上每個人的身分很難確認，同時，在網路上上傳資料，並不是絕對安全的。因此，目前為止，許多政府相關的業務都要求本人帶著身分證親自到場辦理。「自然人憑證」如同網路身分證，讓您在網路上進行資料交換時，能辨識雙方身分。辦理自然人憑證卡後，未來您要申請什麼網路業務都不用再跑政府機關，只要在家上網就可以經由網際網路享受政府數位化服務，降低個人資料外洩的風險。

    ⚫ 申辦資格：年滿18 歲以上，本國國民

    ⚫ 攜帶項目：國民身分證正本、手續費200 元，卡片工本費275 元

    ⚫ 申請步驟：

    1、 申請人攜帶本人身分證親赴申辦地點

    2、 申請人填寫自然人憑證卡申請書後繳回

    3、 承辦人員列印申請書後，請申請人確認個人資料無誤後簽名並繳回，印製憑證卡

    4、 申請人取回身分證件，即完成申辦手續

    ⚫ 特別注意：

    1、 一般來說，申辦手續約半天可完成，約兩週可領到憑證

    2、 若卡片遺失欲重辦得再次繳交卡片工本費（免手續費）

    3、 憑證有效期限為五年，若重新辦理，應自第一次申辦起算，而非自重辦之日起算


    關於上文「自然人憑證」的說明，下列敘述何者正確?'
