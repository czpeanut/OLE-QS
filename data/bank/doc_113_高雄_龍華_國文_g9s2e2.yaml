  section: 2
  number: 36
  type: single
  page: 8
  stem: 關於本文的寫作手法，下列說明何者最恰當？
  options:
  - label: A
    content: 反覆強調時間是珍貴的資源，未來樣貌是自己的選擇和時間轉化而成
  - label: B
    content: 作者對比年輕和現在的不同狀態突顯自己從德國養成跑步習慣的影響
  - label: C
    content: 使用敘事，藉個人經歷闡述「時間會即時回饋故需善加利用」的觀點
  - label: D
    content: 全文夾敘夾議，說明跑步不僅讓作者身強體健，更鍛鍊出強大的意志
  group_stem: "我跑步以後身體真的改變很多，以前像這種寒冷的天氣，只能穿著厚重的外套躲在家裡，我在柏林時那種冰天雪地的環境，常常讓我生病，生病的時候很討厭去看德國的醫生，看一次病要浪費很久的時間，醫生護士通常也不那麼和藹可親，相較之下台灣的醫療環境真的是天堂，對病人是天堂，我想對從業人員應該就是地獄。\n\
    \    不到一個月之前我去跑金門馬拉松，那時候天氣也很冷，我租摩托車，因為猶豫不決到底要不要去跑，訂的住宿離起跑點騎摩托車要二十分鐘，天還沒有亮，沒有穿太多衣服也沒有帶手套和帽子，頂著租車行附的一個簡單的安全帽。\n\
    \    一邊騎車的時候一邊想到自己大學的時代，有次社團辦活動，前一個禮拜去勘查場地，從公館騎機車經過陽明山，然後到金山，再繞濱海公路回來，就這樣繞一圈。回來以後我就病了一個多禮拜，那時候我才二十歲，身體真的很糟糕，真正活動時卻沒有辦法參加。\n\
    \    昨天跑步跟那個在卓蘭馬拉松遇到的七十五歲老先生前前後後好幾公里，我穿短袖、外面再加上柏林馬拉松的外套，一直跑到十公里以後，才把外套脫掉，這個老先生只穿一件背心。\n\
    \    我常常跟我的大學同學聊天談到，我們年輕的時候知道把握時間好好念書，等到一個年紀之後，不再只能為生存的問題傷腦筋時，人生應該要追求什麼？我這麼認真在跑步，很多我的前輩都不以為然，有人告訴我：你跑馬拉松又不能拿獎牌，這樣跑的目的到底是為什麼？\n\
    \    每個人花掉的時間都是因為他的選擇，昨天跑完步我跟朋友去吃飯，然後騎摩托車和我女兒在文化路逛了好一陣子，晚上再開車回台南。\n    我讀書時真的感覺到讀書的快樂，跑步時也真的感覺到跑步的痛苦。跑一場馬拉松真的很痛苦，尤其像昨天那樣一開始十六公里一直在爬升，三十公里以後，肌肉緊繃、呼吸困難、舉步維艱，憑藉的都是自己的毅力，告訴雙腳誰才是老大，到終點之後，可能還會有一些小抽筋。\n\
    \    但休息一陣子以後，好像重生！\n    我們的選擇塑造自己成為什麼人，我在那個穿背心的老先生後面，深深地體會到這句話！\n    時間沒有不見，它只是轉化為我們的選擇，而我們的選擇決定我們是誰。\n\
    \    時間是最寶貴的資源，選擇如何運用時間，便是決定我們成為何種人的關鍵。從過去在柏林的寒冬中動輒生病，到如今能在嚴寒中跑完一場馬拉松，我的身體與心境都發生了翻天覆地的變化。\n\
    \    跑步不只是鍛鍊，更是一種對抗自我的過程，當雙腿在三十公里後逐漸抗拒前進時，真正決定我們能否抵達終點的，是內心的意志。\n    人生並不是所有選擇都能帶來即時的回報，但它們會在未來的某一刻，以另一種形式回到我們身上。像那位七十五歲仍能只穿著背心奔跑的老先生一樣，長年的選擇積累成他的體魄，而這場馬拉松，也讓我更加確信：時間不會消失，它只是轉化為我們真正想要的東西。\n\
    （出自李忠憲〈時間和選擇〉）"
