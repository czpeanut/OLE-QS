  stem: '人都說，心結宜解不宜結。又說，解開心結就是海闊天空。可是，人生怎麼少得了心結？一旦海闊天空，人心又將空懸何處？許多人心裡都有心結的場所，例如：故鄉的母校──初戀、體罰、模擬考，都在那裡發生。有些人每次回到故鄉，就一定要去母校走走；有些人卻一定要避開母校。心結可能是甜美的，也可能是痛苦的。不管心結的場所被珍愛，還是被憎惡，此等強烈的愛憎情緒，都證明了心結有多要緊。心結的場所，是數學X
