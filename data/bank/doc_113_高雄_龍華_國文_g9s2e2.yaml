    \    最要緊的基本動作是煮的過程不能任意增減水量，李漁以煎藥為喻，解答不善廚事者煮飯熬粥常徒具美形，卻無美味，關鍵在於：粥水忌增，飯水忌減。米用幾何，則水用幾何，宜有一定之度數；如醫人用藥，水一鍾、或鍾半，煎至七分、或八分，皆有定數。若以意為增減，則非藥味不出，即藥性不存，而服之無效矣。不善執爨者，用水不均，煮粥常患其少，煮飯常苦其多；多則逼而去之，少則增而入之。不知米之精液，全在於水，逼去飯湯者，非去飯湯，去飯之精液也。精液去則飯為渣滓，食之尚有味乎？\n\
    \    米的天性既純真又深情，跟什麼水結合，加熱，就變成什麼飯。煮飯的過程因此富於變化，若採用雞汁煮飯，即煮出雞飯；加入薑汁烹，則煮出薑飯；加入檸檬汁，就是檸檬飯；加入椰漿，自然呈現椰漿飯；加入墨魚汁，鍋子裡將變出烏亮的墨魚飯……《清稗類鈔》：「炊米為飯時，欲其潔白，可入檸檬汁少許於水中，且鬆散。」\n\
    \    淘米切忌粗魯，需以渦旋方式溫柔淘洗，不必洗到完全清淨潔白，否則養分有流失之虞；也不可使勁搓揉米粒，以免斷裂、破碎了米的原形。去除米粒中的髒物後，淘洗、倒水的速度要快，因為溶出的米糠粉很容易被米吸收，令煮出來的飯殘留著米糠味；雖則講究敏捷，卻不可有絲毫粗暴，重複換幾次水，直到水顯得有點清澈。\n\
    \    吃飯很像家居生活，平常到地位低落的地步，往往忽略其存在，名稱明明叫「主食」，卻吃成附屬品，愈講究的飯館愈挑精揀肥，專吃各式菜肴，從來也不配一口飯。白飯之於佳肴，好比畫布之於色彩和線條。一席筵宴總不乏華麗的菜肴，互相爭奇鬥豔；若缺少白飯的搭配調和，不免會彼此扞格。\n\
    (節選自焦桐〈論吃飯〉)"
