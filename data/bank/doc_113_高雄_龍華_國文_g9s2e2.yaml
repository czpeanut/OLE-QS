  stem: 根據本文，下列選項敘述何者正確？
  options:
  - label: A
    content: 為了讓米飯更潔白，需反覆搓洗米粒，淘洗、倒水的速度宜慢，直到水完全清澈
  - label: B
    content: 煮飯時先以大火煮沸，再轉小火悶煮，適時增加或減少水量以確保米飯口感適宜
  - label: C
    content: 作者認為好米好飯能夠調和菜餚的味道，使整體更加和諧平衡，顯示其重要價值
  - label: D
    content: 文章強調不受重視的米飯應該成為筵席的主角，讓佳肴作為配角襯托米飯的美味
  group_stem: "市面上米的種類愈來愈多，米粒依長度可粗分為短、長兩種。短粒米分布甚廣，長粒米以印度、泰國、緬甸、柬埔寨為主。依顏色分，有白、紅、深紫、黑。隨著健康意識抬頭，有機米、合鴨米的廠牌也日益增多，並且更講究生產履歷，和米粒的飽滿、透明度、彈勁。\n\
    \    米飯總是帶著一種樸素的美感，自足而清純。飯本身如果優秀，不必佐侑任何菜肴，即滋味無窮，漢 枚乘：「楚苗之食，安胡之飯，摶之不解，一啜而散」，可見以好米煮出好飯是了不起的美味。袁枚也說，飯乃「百味之本」，「飯之甘，在百味之上，知味者，遇好飯不必用菜」。他公布要把飯煮得顆粒分明，入口軟糯的四項祕訣：一、米好；二、善淘；三、用火要先武後文，悶起得宜；四、放水要燥濕得宜。\n\
    \    煮飯成功的關鍵在於水量的控制，包括煮飯時的氣溫、濕度，都影響些微的水量差，是調節水和火候的參考。為了精準控制水分，我洗好米粒先濾乾。如果沒有電鍋，煮飯顯得有點麻煩──首先需準確拿捏水量，一般米和水的比例約1：1.5，蒸飯的米水比例則約1：1.2，棕米、紅米需要更多水。傳統方式是手掌按在米上，以水剛好可以蓋過指關節為準；或倒豎拇指貼著米，水量抵第一關節處。\n\
    \    最要緊的基本動作是煮的過程不能任意增減水量，李漁以煎藥為喻，解答不善廚事者煮飯熬粥常徒具美形，卻無美味，關鍵在於：粥水忌增，飯水忌減。米用幾何，則水用幾何，宜有一定之度數；如醫人用藥，水一鍾、或鍾半，煎至七分、或八分，皆有定數。若以意為增減，則非藥味不出，即藥性不存，而服之無效矣。不善執爨者，用水不均，煮粥常患其少，煮飯常苦其多；多則逼而去之，少則增而入之。不知米之精液，全在於水，逼去飯湯者，非去飯湯，去飯之精液也。精液去則飯為渣滓，食之尚有味乎？\n\
    \    米的天性既純真又深情，跟什麼水結合，加熱，就變成什麼飯。煮飯的過程因此富於變化，若採用雞汁煮飯，即煮出雞飯；加入薑汁烹，則煮出薑飯；加入檸檬汁，就是檸檬飯；加入椰漿，自然呈現椰漿飯；加入墨魚汁，鍋子裡將變出烏亮的墨魚飯……《清稗類鈔》：「炊米為飯時，欲其潔白，可入檸檬汁少許於水中，且鬆散。」\n\
    \    淘米切忌粗魯，需以渦旋方式溫柔淘洗，不必洗到完全清淨潔白，否則養分有流失之虞；也不可使勁搓揉米粒，以免斷裂、破碎了米的原形。去除米粒中的髒物後，淘洗、倒水的速度要快，因為溶出的米糠粉很容易被米吸收，令煮出來的飯殘留著米糠味；雖則講究敏捷，卻不可有絲毫粗暴，重複換幾次水，直到水顯得有點清澈。\n\
    \    吃飯很像家居生活，平常到地位低落的地步，往往忽略其存在，名稱明明叫「主食」，卻吃成附屬品，愈講究的飯館愈挑精揀肥，專吃各式菜肴，從來也不配一口飯。白飯之於佳肴，好比畫布之於色彩和線條。一席筵宴總不乏華麗的菜肴，互相爭奇鬥豔；若缺少白飯的搭配調和，不免會彼此扞格。\n\
    (節選自焦桐〈論吃飯〉)"
