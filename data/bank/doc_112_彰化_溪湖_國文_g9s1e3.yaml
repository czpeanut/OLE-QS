  group_stem: 多數人類無法忍受長期只吃一兩種食物的單調無聊，我們食性廣雜，而且對舌頭的要求嚴格—或許，這是文明的重要特質，人們是自然界中少數能好好坐在餐桌前吃飯，不必擔心天敵趁機掠食或搶奪的物種。面對這不可割捨的感官，有些修行者挑戰味覺，他們把舌頭的欲望降到最低，讓它除了擔任「能吃與不能吃」的防線外，不參與「口腹之慾」的創造。但味覺的感受恐怕跟「念頭」一樣快，我們常在吃到美味食物時瞬間感到「原來如此」的釋然，我懷疑修行者能完全將它去除。
