  options:
  - label: A
    content: 「彷彿宋人趙千里的一幅大畫，做了一架數十里長的屏風」比喻湖面遼闊，風景如畫
  - label: B
    content: 「一片白花映著帶水氣的斜陽，好似一條粉紅絨毯」指荷花在湖面的倒影，被夕陽染紅的景色
  - label: C
    content: 「家家泉水，戶戶垂楊」寫濟南城的人文景觀，泉水充沛，詩意盎然
  - label: D
    content: 「紅的火紅，白的雪白，青的靛青，綠的碧綠」形容百花爭妍，美不勝收的景色。
