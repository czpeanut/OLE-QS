- id: doc_112_彰化_溪湖_國文_g9s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 蘇東坡：「吾聞《戰國策》中有一方，吾服之有效，故以奉傳。其藥四味而已：一曰無事以當貴，二曰早寢以當富，三曰安步以當車，四曰晚食以當肉。夫已饑而食，蔬食有過於八珍，而既飽之餘，雖芻豢滿前，惟恐其不持去也。若此可謂善處窮者矣，然而於道則未也。安步自佚，晚食為美，安以當車與肉為哉？車與肉猶存於胸中，是以有此言也。」根據此段文字，下列何者最符合東坡的生活原則？
  options:
  - label: A
    content: 安分知福，儉以養生
  - label: B
    content: 養尊處優，暖衣飽食
  - label: C
    content: 不作不食，勤奮自力
  - label: D
    content: 安分守己，清閒自在。
  tags:
    textbook: 九上 第八課 孟子選：生於憂患死於安樂
