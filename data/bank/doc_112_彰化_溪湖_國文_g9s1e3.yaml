    老殘對著雪月交輝的景致，想起謝靈運的詩：「明月照積雪，北風勁且哀」兩句。若非經歷北方苦寒景象，哪裡知道「北風勁且哀」的個「哀」字下得好呢？這時月光照得滿地灼亮，抬起頭來，天上的星一個也看不見，只有北邊北斗七星，開陽、搖光，像幾個淡白點子一樣，還看得清楚。老殘心裡想道：「歲月如流，眼見斗杓又將東指了，人又要添一歲了。一年一年的這樣瞎混下去，如何是個了局呢？」想到此地，不覺滴下淚來，也就無心觀玩景致，慢慢走回店去了。一面走著，覺得臉上有樣物件附著似的，用手一摸，原來兩邊著了兩條滴滑的冰。初起不懂什麼緣故，既而想起，自己也就笑了。
    —劉鶚 黃河結冰記'
