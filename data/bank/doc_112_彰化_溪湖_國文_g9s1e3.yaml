  stem: 逯耀東曾用烹飪來比喻治學之道：「不宜急火熱爆，只能文火燜燉，如東坡煮肉，所謂『火到東坡膩如脂』，就在火候上，但火候的拿捏，非親自為之，是無法體悟其中奧妙的。」這段話的主旨，與下列何者最接近？
