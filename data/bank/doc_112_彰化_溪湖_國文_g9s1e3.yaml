  section: 1
  number: 39
  type: single
  page: 4
  stem: 根據上文，作者在文中提及的「魚與熊掌」，是用來表達什麼意思？
  options:
  - label: A
    content: 在蔬食界中，新鮮的筍最適合用來搭配珍貴的熊掌
  - label: B
    content: 古人食用時捨棄肉而吃筍，就好比捨魚而取熊掌
  - label: C
    content: 城市中的筍就像魚一樣，哪有山林中的筍來得珍貴
  - label: D
    content: 所謂魚與熊掌不可兼得，所以筍只適合用來單吃
  group_stem: '請閱讀以下短文，回答39～40 題：

    筍之一物，則斷斷宜在山林，城市所產者，任爾芳鮮，終是筍之剩義。此蔬食中第一品也，肥羊嫩豕，何足比肩？但將筍肉齊烹，合盛一簋1，人止食筍而遺肉，則肉為魚而筍為熊掌可知矣。購於市者且然，況山中之旋掘者乎？

    食筍之法多端，不能悉紀，請以兩言概之，曰：「素宜白水，葷用肥豬。」茹2 齋者食筍，若以他物伴之，香油和之，則陳味奪鮮，而筍之真趣沒矣。白煮俟熟，略加醬油。從來至美之物皆利於孤行，此類是也。以之伴葷，則牛羊雞鴨等物皆非所宜，獨宜於豕，又獨宜於肥。肥非欲其膩也，肉之肥者能甘，甘味入筍，則不見其甘，但覺其鮮之至也。烹之既熟，肥肉盡當去之，即汁亦不宜多存，存其半，而益以清湯。調和之物，惟醋與酒。此制葷筍之大凡也。筍之為物，不止孤行並用，各見其美，凡食物中無論葷素，皆當用作調和。

    （註：1 簋：音ㄍㄨㄟˇ，古代祭祀時盛黍稷的圓形器皿。2：茹：吃。）'
