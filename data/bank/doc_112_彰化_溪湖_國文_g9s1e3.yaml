  type: single
  page: 1
  stem: 蔡珠兒 我們的饕餮時代：「這年頭底到什麼是主食，什麼是零食？小時候媽媽總是說，正餐之前不可以吃零食，但是這條原本清楚嚴明的分界線，現在逐漸變得漫漶模糊，甚至互相錯位了。」這段話主要想表達什麼？
  options:
  - label: A
    content: 人們分辨主食、零食的標準，已隨著時代演進而不同
  - label: B
    content: 以往母親管教過於嚴格，現今作者已不再遵循此要求
  - label: C
    content: 現代食物的成分標示不清，讓人不清楚自己吃了什麼
  - label: D
    content: 零食的營養價值高於主食，已逐漸取代了主食的地位。
