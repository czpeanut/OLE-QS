  type: single
  page: 2
  stem: 有人曾詢問蔡珠兒對「無國界料理」的看法。她認為：「有些廚師不知該如何好好煲一鍋廣東湯，索性粵式、臺式混一起，美其名為臺粵式；不知道如何扎實的做一鍋西班牙海鮮飯，就來個義式臺式混合。甚或根本就興之所至，方便取材，冒然改變了食物的味道。」根據上文，蔡珠兒對「無國界料理」廚師的評價為何？
  options:
  - label: A
    content: 認為他們畫虎類犬，基本功不足就隨意烹調
  - label: B
    content: 覺得他們能通權達變，迎合顧客喜好而創新
  - label: C
    content: 批評他們崇洋媚外，忽視了傳統料理的價值
  - label: D
    content: 肯定他們別出心裁，勇於突破料理既定框架。
  tags:
