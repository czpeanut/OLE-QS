    | 英國劍橋大學數學橋 | 走進劍橋大學皇后學院，可以見到一座古老的木橋橫跨於劍河之上，這就是舉世聞名的數學橋，又叫作(丙)橋。相傳(丙)採用數學和力學的方法設計並建造了這座橋，橋上沒有用一顆釘子。數學橋那多姿多彩的神奇圖案，那看似不規則、不經意的三角形、長方形、菱形等幾何圖形居然都是(丙)在設計紙上經過周密策劃、計算而搭建而成，難怪有人說這座數學橋正是劍橋治學精神的象徵，無論誰在這裡都會對科學王國的神奇魅力充滿嚮往，對劍橋人孜孜不倦追求真理的執著而感到由衷欽佩和敬重。
    |

    | 聖約翰座堂 | 位於中環(香港島)，於1847 年3 月11 日由香港總督戴維斯奠基；1849 年建築工程完成，為香港最古老的西式教會建築物，是香港唯一以永久業權形式持有的土地。座堂主要由3
    幢主樓構成，乃香港較古舊的維多利亞時期哥德式建築物之一， |'
