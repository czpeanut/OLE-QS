    content: 黑奴出現和工業革命有關
  group_stem: '(四) 慕瑤到博物館參觀一個展覽，以下是展覽的主題介紹，請閱讀完後回答下列問題:

    資料一:

    剛果曼尼（國王）阿方索一世寫道葡萄牙商販湧入是販賣黑人貿易的緣由: 「販子們每天都在拐賣我們的人——這個國家的孩子，貴族諸侯的孩子、甚至是我們自己家裡的孩子。我們希望王國不再是奴隸販賣或運輸的地點了。我們的很多臣民貪求葡萄牙商販帶進國門的商品。為了滿足這種異常的胃口，他們抓走了很多原本自由的黑人同胞⋯⋯販賣他們。在之後他們把這些囚犯秘密地或趁著天黑（帶到海岸）⋯⋯一旦俘虜落入白人的手中，就會被燒紅的鐵烙上印記」

    資料二:

    雨果的作品《悲慘世界》 描寫 19 世紀初法國社會的生活狀況。雨果在前言寫下： 「……只要本世紀的三個問題──貧窮使男子潦倒，饑餓使婦女墮落，黑暗使兒童羸弱──還得不到解決；只要在某些地區還可能發生社會的毒害，換句話說，只要這世界上還有愚昧和困苦，那麼，和本書同一性質的作品就不會是無益的。」

    資料三:

    西元1492 年10 月 12 日是哥倫布發現新大陸的日子，美國將這天訂為「哥倫布日」。每到這天，各地多有慶祝活動，但在活動進行時，也常有許多美洲原住民抗議……在2020
    年10月11 日墨西哥的社運組織發起「我們要將它拉倒」的抗議行動，他們的目標是城市中佇立的哥倫布雕像。'
