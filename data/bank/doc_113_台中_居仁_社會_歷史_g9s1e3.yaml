  group_stem: '(二) 以下是姍姍整理此次段考人物的理念，請閱讀完後回答下列問題:

    甲:「個人只關心自己的安危， 其致力於產業發展也不過是為了自利，然而他卻被一隻『看不見的手』所引導，進而促進社會整體的效率。因此，統治者若在經濟問題上企圖引導人民，去做出最佳的選擇，其結果不僅不好，而且也將造成政府權力的不當擴充。」

    乙:「政府能夠代表國家行使統治權，是因為它經由合法的方式，獲得大多數人民的授權，而被統治的人民為了本身利益也願意與政府合作。若政府沒有獲得多數人民的授權，也不代表多數人民的利益，那麼人民應撤回自願的合作，絕不履行所謂的國民義務。」

    丙:「人們最初生活在自由狀態下，並沒有政府組織，而且每個人皆有三種天賦人權……但久而久之，人們發覺在自由狀態下，大家都過分強調自己的權利，導致混亂和不安，於是經由大家的同意，設立政府，並賦予政府若干權力……但後來政府濫權，出現暴政，故此時人們有權去推翻它。」

    丁:「富人為了自己的利益，不斷剝削窮人，給他們很低的薪資，卻希望他們生產最多的產品。這種不合理的現象應該要靠公有共享，規定大家一起勞動才能獲得解決。」

    戊:「一個科學假設是否正確，要看它是否在演繹推論上沒有問題，而不是看是否能用實驗證明，覺得人類從感官經驗獲得的結論不一定是正確的，反而從基礎概念出發，並透過論證推理，才有可能得到一個可靠的結論。」'
