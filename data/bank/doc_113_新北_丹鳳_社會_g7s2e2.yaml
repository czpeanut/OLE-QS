- id: doc_113_新北_丹鳳_社會_g7s2e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: '台灣的漁業發展與四面環海、大陸棚廣大、寒暖洋流交會等自然條件有關；目前以養殖漁業、遠洋漁業與近海漁業、沿岸漁業比較，為何會有所差異？請依題目的選項找出你認為正確的因素？

    甲、遠洋漁業由於過度捕撈，致使海洋魚源枯竭；

    乙、雖然養殖漁業有造成地層下陷的環境問題，但政府已經在近年推廣箱網養殖，直接利用現成的海洋空間，避免陸地魚塭的養殖產生環境問題；

    丙、近海漁業卻發生海水汙染，因此近海捕撈的魚種往往造成食安議題的紛擾；

    丁、遠洋漁業與養殖漁業的產值高於沿岸漁業與養殖漁業，是因能顧到市場的需要，魚種優質；

    戊、漁業對海洋資源的維護雖有所期待，然而目前來看，1960-2021 年台灣漁業的產量還是以遠洋漁業最高。'
  options:
  - label: A
    content: 甲乙丙戊
  - label: B
    content: 甲丁戊
  - label: C
    content: 乙丙丁
  - label: D
    content: 乙丁戊。
  tags:
