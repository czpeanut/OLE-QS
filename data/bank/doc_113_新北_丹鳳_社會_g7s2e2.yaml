- id: doc_113_新北_丹鳳_社會_g7s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 新竹科學園區設立於1980 年代，為臺灣第一個科學園區，加上民國 70 年代，由於國內工資上漲，再加上環保意識抬頭；回顧臺灣的工業發展歷程，在不同時間背景下皆有其代表性的產品，近年來，臺灣出口產品以電腦、半導體、光電等為主。從下面▼圖(三)的資料顯示民國111
    年我國對外貿易總額為9,074.9 億美元，進、出口皆創歷年新高紀錄，進、出口成長率持續擴張。請問下列選項中，哪一個答案是『錯誤』的？
  options:
  - label: A
    content: 民國 50 年代政府設立加工出口區，拓展海外市場並吸引外資，工廠的產品以出口為主，賺取外匯，使工業快速成長，產值逐漸超越農業，開創臺灣經濟奇蹟
  - label: B
    content: 民國 110 年，政府正式將「加工出口區」轉型為「科技產業園區」，園區分別形成半導體封測、顯示器、光學、電子、資訊軟體及數位內容等產業聚落，並提供廠商入區投資享有關稅、貨物稅、營業稅免稅等租稅優惠，可大幅降低營運成本，此與政府的政策有關
  - label: C
    content: 隨著ICT 產業的發展，臺灣也致力於將生醫與資訊科技結合，推動精準健康產業的發展。這包括新藥開發及醫療器材製造等領域，以滿足現代醫療需求
  - label: D
    content: 由圖可知出口總值持續大於進口總值，因此臺灣的國際貿易狀態呈現逆差，故而自民國70 年以後，第二級產業由勞力密集產業升級至資本、技術密集的附加價值產業。
  assets:
