- id: doc_113_新北_丹鳳_社會_g7s2e2_s2_21
  section: 2
  number: 21
  type: single
  page: 3
  stem: '仔細閱讀日治時期的教育政策，會發現一個弔詭的現象：日本治臺期間，雖然積極推動現代化教育，但是臺灣人如果想進一步獲取應有的教育資源，仍不容易。關於日治時期臺灣教育的發展概況，何人說法正確？

    佳柔：初期對日臺學童採差別待遇，日本學童課程相對簡單

    英雪：後期為配合皇民化運動，將「國民學校」改成：臺人就讀「公學校」，日人就讀「小學校」

    成育：臺灣學齡兒童就學率大大增加，是因「臺日共學」的成功

