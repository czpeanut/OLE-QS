  group_stem: "《為了活下去：脫北女孩朴研美》，此書作者述說著自己是如何脫逃北韓這個獨裁國家。這本書分成三部分，第一部敘說她在北韓的生活，由北韓惠山逃亡到中國瀋陽、青島。故事的出發點主要是為了活下去，十三歲那年，飢荒再加上父親做走私工作入獄，朴研美決定和母親涉險橫渡邊界逃亡到中國，展開一連串驚心動魄的逃亡之旅。因為環境的影響迫使他做這個決定－離開北韓，朝著自由之路前進。\n\
    \    第二部分是到中國後卻落入人口販子的手中，在人口販子的掌控下度過兩年生不如死的歲月。在現實無盡的摧殘下，她與母親只能再逃亡一次，她們在漆黑的寒夜橫越戈壁沙漠，受了無數的考驗。第三部分從中國逃亡到蒙古，尋求政治庇護，最後回到南韓，重獲自由！"
