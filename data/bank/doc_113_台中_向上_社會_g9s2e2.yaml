  - label: C
    content: 頂洲仔
  - label: D
    content: 南崁。
  group_stem: "四百年前，當時臺灣就已經是整個東亞貿易的重鎮，荷蘭東印度公司在安平建立了熱蘭遮城與大員市。然而早在一兩千年甚至五六千年前，南島語族早就開啟了屬於臺灣的大航海時代。\n\
    \    依照荷蘭時期地圖，發現現今臺南市石門國小位於當時海陸交界處。因此在國小校內北側發現一處清代磚造結構，再向下挖掘則有疑似大水氾濫沖積以及沉積的地層。在臺南市關廟區，因開路工程而意外挖到疑似清代的文化遺址，經學者開挖探勘，認為是目前全台首見的清代瓦漏窯遺址，文史學者認為這與臺南早期產業發展史的重要發現，也逐步為解開臺南人愛吃甜的秘密。"
