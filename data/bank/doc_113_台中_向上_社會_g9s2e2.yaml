- id: doc_113_台中_向上_社會_g9s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 附圖是北極冰洋東北航道的路線示意圖，依據圖中資訊判斷，選擇走該航線會較原有的舊航線節省約8,000 公里的路程，未來若可全面通航，其商業效益將大幅提升。請問：上文提及的舊有航線所經過的地區不包括下列何者？
  options:
  - label: A
    content: 巴拿馬運河
  - label: B
    content: 麻六甲海峽
  - label: C
    content: 蘇伊士運河
  - label: D
    content: 印度洋。
  group_stem: "隨著全球暖化，北極冰洋逐漸融化，過去被稱為「傳說中的航道」的北極航道航行潛力與商業價值大幅提升。相較於傳統航線，北極航道可節省7 至15\
    \ 天的航行時間。然而，受限於人員訓練與沿線補給，目前無法全面通行，環保人士更擔憂通航恐帶來生態浩劫。\n   隨著北冰洋解封，出現東北航道、西北航道及中央航道3\
    \ 條可能通道。其中，中央航道穿越北極中心點；東北航道沿俄國西伯利亞海岸，由東亞地區航行至北歐港口；西北航道則沿加拿大沿岸，連結北大西洋與北太平洋的海上貿易航道。"
