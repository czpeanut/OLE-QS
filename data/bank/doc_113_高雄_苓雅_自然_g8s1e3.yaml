- id: doc_113_高雄_苓雅_自然_g8s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 小倩的爸爸在公司尾牙抽獎時抽到了一台氣炸鍋。小倩好奇而上網 Google 了氣炸鍋的原理：「氣炸鍋的原理跟旋風式烤箱差不多，是用熱風去「烤」，而不是炸！氣炸鍋藉由氣炸鍋上方的加熱器產生高溫熱風，讓食物被熱空氣包圍、高溫烘烤，把食物本身的油脂逼出，產生「油炸」的效果。所以，如果是本身就含油的食物，例如帶皮的雞腿，真的是一滴油都不用放，就會產生金黃酥脆的油炸效果。」根據上述資料氣炸鍋能使食物快速均勻地受熱，這種主要靠熱傳播的哪一種方式？
  options:
  - label: A
    content: 傳導
  - label: B
    content: 對流
  - label: C
    content: 輻射
  - label: D
    content: 折射。
