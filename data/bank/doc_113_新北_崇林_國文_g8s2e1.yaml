- id: doc_113_新北_崇林_國文_g8s2e1_s5_4
  section: 5
  number: 4
  type: single
  page: 5
  stem: 請問2024 巴黎奧運聖火炬的對稱設計具有什麼意涵？
  options:
  - label: A
    content: 強調性別平等
  - label: B
    content: 弘揚科技工藝
  - label: C
    content: 致敬和平精神
  - label: D
    content: 象徵城市文化。
  group_stem: 'CIDA 中華民國工業設計協會理事長，「臺灣百大設計師」之一，同時也是操刀2017 臺北世界大學運動會火炬、母火燈、聖火臺製作的總設計師張漢寧（Jimmy）分享：「工業設計要滿足3
    件事，一是美學（有藝術感、吸睛美觀）、二是工學（材料或設計內容具有功能跟目的）、三是商學（能夠在預算內做到極致）。奥運的火炬設計，就是工業設計的全球性展現舞臺。」

    這就好像一個學生在選擇要買一雙鞋子時，大多數人肯定會想要選一雙既好看、有特色且不會跟別人撞鞋的鞋子，同時還要穿起來走路、跑跳時舒服，不會讓你的腳痛，而且最重要的是，還要你買的起，因為一定是在存了好久的零用錢或是父母給的有限預算下，要想辦法買到最值得、最滿意的一雙鞋子一樣。火炬設計也是如此，懂得怎麼平衡美觀、實用和經濟這3
    個面向，是非常重要的。

    而困難在哪裡呢？Jimmy 分享：「像是火炬設計，基本上都是在奧運舉辦城市確定後就開始規劃，但也會面臨種種的意外，像是2020 東京奧運有設計抄襲的事件，以及遇到疫情延後等等，我自己在2017
    年設計臺北世大運聖火炬時，僅有大約8 個月的時間設計火炬，時間上算是非常的趕，既要美觀有臺灣在地特色，還要克服火炬重量需要在1 公斤半以下的IOC（國際奧林匹克委員會InternationalOlympic
    Committee）要求，並要使用環保材質，且點燃火焰的瓦斯噴燈，還必須能夠從平地到玉山3 千多公尺高的地方接力時不能熄滅，真的是很有挑戰的一件事。」

    時尚之都巴黎過去在1900 年是第2 屆奧運會的舉辦城市，也是歷史上首次開放女性參與比賽的奧運會，時隔124 年，2024 巴黎奧運延續理念，也將是歷史上首次女性與男性選手參與比例達到相等數量的一屆，因此在火炬設計上採用完全對稱結構，彰顯此重大的賽會意義，同時也展現出奧運會的平等精神。2019
    年時，巴黎奧運官方就先行公布奧運的會徽Logo，設計上就巧妙結合了奧運聖火、金牌以及代表法國的擬人化「瑪麗安娜」（Marianne） 形象，結合了女性、時尚與平等的形象，將Logo
    印製在火炬上，整體更是相得益彰。

    (節錄自奧運聖火、海報、火炬設計，運動美學設計有何特別之處? 曾荃鈺)'
