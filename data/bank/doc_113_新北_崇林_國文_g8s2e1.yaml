  section: 4
  number: 18
  type: single
  page: 3
  stem: 讀完〈柳毅傳書結奇緣〉的故事，阿雄在筆記本中摘述文本內容並分析人物的特質，請問下列何者敘述最為恰當？
  options:
  - label: A
    content: 文本內容：柳毅起身嚴肅地說：「想不到錢塘君竟愚昧不明事理到如此地步！原以為您是救人危難、頂天立地的大丈夫，沒想到卻不顧正道，用武力來脅迫人。我雖是個平凡人，不是您的對手，但也絕不會被您的威勢所屈服！」這番話說得錢塘君面紅耳赤，連忙謝罪：「我言詞冒犯您，實在慚愧，請不要介意。」當下兩人握手言歡，成了好友。｜人物的特質：錢塘君→勇於認錯
  - label: B
    content: 文本內容：龍王派人把信送進宮去，不久宮裡就傳出一片哭聲。龍王連忙吩咐侍從：「快去通知宮裡的人不要哭出聲來，若讓我弟弟錢塘君知道就糟了。他脾氣暴躁又神勇過人，當年堯所遇到的九年洪水就是他發怒的結果。最近他和天將不和，又水淹五嶽。玉帝顧念我平日的功勞，特別赦免他的罪過，囚禁在我這裡看管……」｜人物的特質：龍王→怕事懦弱
  - label: C
    content: 文本內容：小龍女微笑著對柳毅說：「我確實是洞庭龍王的女兒，為感謝你救了我，一心想報答你，不料你拒絕錢塘叔父的提親，以致未能結緣。後來你的兩任妻子相繼過世，父母才成全我的心意。現在終於可以報答恩德，我死而無憾！」說完後，不禁哭了起來。｜人物的特質：小龍女→古道熱腸
  - label: D
    content: 文本內容：女子向柳毅哭訴：「我是洞庭龍王的小女兒，父母把我許配給涇河龍王的次子。但丈夫放蕩風流成性，對我百般嫌惡。公婆因寵愛兒子，非但不阻止還把我趕到這兒。現在您要回鄉，貴府離洞庭湖很近，能幫我捎封信回去，讓父母知道我的悲苦嗎？」柳毅說：「我向來喜歡打抱不平，此刻恨不得插翅飛到洞庭湖。但我是個凡人，如何把信送進水底龍宮呢？」｜人物的特質：柳毅→理性客觀
