- id: doc_113_台中_鹿寮_社會_g7s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 「2018年老年占總人口數14.1%，正式邁入『高齡社會』。預估再8年後則將進入『超高齡社會』，相關社會問題亦隨之而來。在2019年7月統計，臺灣的勞動參與率為59.28%，均低於日本、南韓及美國等國，也因此造成政府各項退休基金、健保未來恐將難逃破產命運。」請問：近年政府所推動的年金改革，主要針對各種社會保險制度入不敷出的現象加以改善，避免出現破產的現象。如文中統計，臺灣的勞動參與率偏低，亦是加重其問題的嚴重性。請問：對該問題進行改善，所推行的方式可能為下列何者？
