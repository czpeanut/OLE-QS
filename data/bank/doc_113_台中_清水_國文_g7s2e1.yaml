  stem: '阿公愛用日曆更甚於月曆，因為一天撕一張，不會弄錯日期，月曆一張裡有三十、三十一格，要記得今天是哪格。這個額外的記憶對老人家來說已經是個負擔，輕微的帕金森氏症使阿公瞬間即忘眼前事。我不去多想，阿公撕日曆時，是否也會如此，心裡老惦記著每天要撕日曆，卻忘了自己今天是否已經撕過，所以過不多時再去撕一張，導致到最後還是弄不清楚今夕是何夕。其實，今天是何日對一個過目即忘的老人家來說，也許不再那麼重要。日曆之於阿公，可能已不在於報日的功用，而是在一切可能將逐漸忘卻的日子裡，陪伴著他履行生命永恆的規律。

