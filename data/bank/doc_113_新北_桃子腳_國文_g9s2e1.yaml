    content: 車子撞過來那一瞬的剎那，他彷彿看到人生走馬燈。
- id: doc_113_新北_桃子腳_國文_g9s2e1_s2_21
  section: 2
  number: 21
  type: single
  page: 2
  stem: '小陶因接近會考壓力太大，導致上課精神渙散，筆記錯誤百出。請你幫他找出下列哪個選項中的成語，字形完全正確？


    | 甲 | 肆無忌殫 | 己 | 戰戰兢兢 |

    | --- | --- | --- | --- |

    | 乙 | 鉅細糜遺 | 庚 | 鴉雀無聲 |

    | 丙 | 裨官野史 | 辛 | 暮鼓晨鐘 |

    | 丁 | 察顏觀色 | 壬 | 韶光荏苒 |

    | 戊 | 微妙微肖 | 癸 | 摩肩接踵 |'
  options:
  - label: A
    content: 甲丙戊己辛
  - label: B
    content: 乙丁庚壬癸
  - label: C
    content: 甲乙丙丁戊
  - label: D
    content: 己庚辛壬癸。
- id: doc_113_新北_桃子腳_國文_g9s2e1_s2_22
  section: 2
  number: 22
  type: single
  page: 2
  stem: 請問下列哪一則新聞標題的成語使用帶有負面意涵？
  options:
  - label: A
    content: 惡保母虐死凱凱細節公開，法院旁聽民眾義憤填膺
  - label: B
    content: 雷厲風行！美總統川普上任才半個月創下9 大政績
  - label: C
    content: 投資市場將撥雲見日？政策不確定性消退推動反彈
  - label: D
    content: 解放軍自比媽祖，我國軍：「窮兵黷武悖離慈悲精神」。
- id: doc_113_新北_桃子腳_國文_g9s2e1_s2_23
  section: 2
  number: 23
  type: single
  page: 2
  stem: 請問下列文句「」中的成語，何者應用正確？
  options:
  - label: A
    content: 郭奶奶今日八十大壽，真是「福壽全歸」，令人欣羨
  - label: B
    content: 曉諭常口不擇言胡亂攻訐他人，應該當心「齒牙為禍」
  - label: C
    content: 阿宸歸隱山林，不問世事，過著「與世長辭」的生活
  - label: D
    content: 她最近升官，還發了一筆意外之財，大享「齊人之福」。
- id: doc_113_新北_桃子腳_國文_g9s2e1_s2_24
  section: 2
