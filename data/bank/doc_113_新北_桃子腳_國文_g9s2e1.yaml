  group_stem: "請閱讀以下短文，並回答40~42 題：\n    太宗嘗謂皇屬曰：「朕即位以來，十三年矣。朕持儉素，外絕遊觀之樂，內卻①聲色之娛，真實之言，固無虛飾。汝等生於富貴，長自深宮，民庶艱難，人之善惡，必是未曉。略說其本②，豈盡余懷。夫帝子親王，先須克己厲情③，聽言納誨。每著一衣則憫蠶婦；每餐一食，則念耕夫。至於聽斷④之間，勿先恣其喜怒。朕每親臨庶政，豈敢憚⑤於焦勞；禮接群臣，無非求於啟沃⑥。汝等勿鄙人短，勿恃己長，乃可永久富貴，以保終吉。先賢有言曰：『逆吾者是吾師，順吾者是吾賊。』不可不察。」\n\
