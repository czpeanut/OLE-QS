  stem: "以吃生魚片聞名的日本，為何市面上卻看不到鰻魚的生魚片呢？因為鰻魚的血液裡有Ichthyotoxin 這種蛋白質毒素，如果大量飲用鰻魚的血液，可能會引發腹瀉、嘔吐、皮膚疹、發紺、無力症、心律不整、虛弱、感覺異常、麻痺、呼吸困難，甚至可能導致死亡。但不用太緊張，根據文獻來計算鰻魚血致死量：體重60\
    \ 公斤的人大約要攝取近1000毫升才會死亡。另外，因為鰻魚的毒素只要以超過60℃烹調5 分鐘後，就會完全失去毒性。不過即使是這樣，鰻魚毒的可怕之處在於，即使只是接觸到它也會引起劇烈發炎反應，如果進入傷口，則會引發炎症、化膿、浮腫等問題。如果進入眼睛，會引起強烈的灼熱感和疼痛，導致流淚、眼皮腫脹、結膜炎，嚴重的情況下，甚至有失明的風險。事實上，鰻魚表面的黏液也具有與血液相同的毒性，因此手有傷口的人不要抓鰻魚，抓完鰻魚後也要徹底洗手把黏液洗掉。\
    \ \n──改寫自韋恩的食農生活\n   根據上文，下列敘述何者不正確？"
