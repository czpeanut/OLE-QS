- id: doc_113_新北_桃子腳_國文_g9s2e1_s3_43
  section: 3
  number: 43
  type: single
  page: 6
  stem: 根據上文，MBTI 的「外向」與「內向」主要指的是什麼？
  options:
  - label: A
    content: 一個人是否擅長社交和與人互動
  - label: B
    content: 一個人能量的來源和專注力方向
  - label: C
    content: 一個人說話是否流利、表達自然
  - label: D
    content: 一個人傾向獨處或是習慣在團體裡。
  group_stem: "請閱讀以下文章，並回答43~45 題：\nMBTI（Myers–Briggs Type Indicator）是一項性格評量，將人的性格分成\
    \ 16 種類型。MBTI 測驗出的性格評量共有4 項指標，包含人在「產生能量的方式」（E 外向／I 內向）、「思維模式」（S 實感／N 直覺）、「做決策的依據」（T\
    \ 思考／F 情感），以及「生活的反應態度」（J 判斷／P感知）。 從每個選項得到一個英文字母，把 4 個字母組起來，就可以得知自己在16 型人格類型中屬於哪一型的性格分類。\n\
    請注意，MBTI 的「外向」與「內向」跟日常口語的意思不太一樣。一般認為，外向的人不怕生，天生很會跟人互動、能言善道等；而內向的人就是話比較少，看到人會害羞、不太擅長說話。然而，MBTI\
    \ 的外向（E）跟內向（I）是在講人的態度、專注的點，以及可以獲得能量的來源。也許E 傾向的人比較專注在外，可能因為放更多精神在那裡，所以從小更願意跟人互動，長久的練習也讓他們長大後看似在這方面更為擅長；相對地，I\
    \ 傾向的人更專注於內在世界，有時就算處在很多人的環境裡，也能像自帶小包廂一樣待在自己的小天地裡。但可能因為比較少練習跟外界互動，所以變得不太擅長。然而，如果我們說E\
    \ 傾向的人一定比較會社交、I 傾向的人一定不善與人互動，這就流於刻板印象了。\n你如何接收資訊？實感（S）VS.直覺（N）\nS 是實感，S 傾向的人比較喜歡透過感官來獲取資訊，也因此，他們比較相信來自感官的資訊。他們看事情會比較關注細節，也比較信賴親身經歷的體驗。N\
    \ 是直覺，N傾向的人比較喜歡觀察大局跟趨勢。他們一點一滴吸收了各種外在環境的線索，再把這些線索連在一起，變成一個他們理解的圖像。\n你如何做決定？思考（T）VS.情感（F）\n\
    T 是思考，T 傾向的人比較擅長用邏輯做決定，通常也覺得這樣做才對。他們傾向讓自己跳脫情境，再做出「合理」的決定，也比較不考量這個決定可能帶給自己或別人的感受。F\
    \ 是情感，F 傾向的人比較習慣從情感面、同理心來做決定。他們比較知道自己的感受，也比較善於透過換位思考來理解別人的感覺。因此，他們做決定時會想更深入了解相關人物的感受。實際上，T\
    \ 傾向的人不是沒有情感，F 傾向的人也不是沒有邏輯。以MBTI 官方統計來說，較多男性是T 傾向，較多女性是F 傾向，所以這個功能常常也跟社會的性別刻板印象（stereotype）掛勾在一起，加深了誤會。\n\
    做了決定之後，你會如何執行？判斷（J）VS.感知（P）\nJ 是判斷，J 傾向的人比較喜歡有條理的執行方式。對他們來說，效率很重要，而人生就是不斷地下判斷、做決定，再往前行。他們通常都會想辦法控制外在環境，依照他們的規劃來做事情。他們透過對外在的控制來達到內心的自由，這樣一來也比較不會因為未知而感到焦慮。P是感知，P\
    \ 傾向的人比較喜歡靈活、有彈性的生活，對他們來說，過程與體驗是重要的。P 傾向的人不喜歡被約束，因為他們每分每秒都在感知各種訊息，如果一切都規劃得很詳細，他們可能被迫放棄一些體驗人生的機會，做事情也不能隨機應變。如果你做事傾向事先規劃執行的步驟與細節，那你比較可能是J\
    \ 傾向；如果你喜歡更自由靈活一些的生活，也常常在截止時間快到之前才開始做事，那你比較可能是P 傾向。\n接下來，開始組合真正的你\n了解了你在每個向度的傾向後，就可以把這4\
    \ 個字母拼起來，那就是最符合你的人格類型（best fit type）。如果有一個向度你實在難以確定，例如一半時間是用實感獲取資訊，一半時間又是用直覺，你可以同時參考這兩個人格類型的內容（例如ISFP\
    \ vs.INFP）。還有一點很重要：雖然一個人的人格類型不會改變，但人的行為可以改變，就像我們會根據外在環境調整說話方式，不太可能用同樣的口吻對待父母、老闆和好朋友。此外，我們也能透過反思來開發自己不擅長的一面，讓自己成長、變得更成熟，所以很可能你在某些時候像這個型、在其他時候又像那個型，這很正常，因為我們在社會化的過程中，會學習到最適合的生存方式。\n\
    \        節錄自夏瑄澧 MBTI 我，和我的使用說明書"
