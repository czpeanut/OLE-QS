- id: doc_113_新北_桃子腳_國文_g9s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 「人在潛意識深處，藏著能提供無窮智慧、力量，以及一切必要之物的無盡源頭。只要敞開心胸，活用那些資源，所有夢想皆能實現。也就是說你把思想聚焦在某一件事物上，那麼整個宇宙就會把這樣東西帶來你的身邊，這就是所謂的『□□□法則』。」根據以上內容，文中所謂的「□□□法則」，最適合填入下列者？
  options:
  - label: A
    content: 執行力
  - label: B
    content: 想像力
  - label: C
    content: 吸引力
  - label: D
    content: 影響力
- id: doc_113_新北_桃子腳_國文_g9s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 下列詞語的使用，何者正確？
  options:
  - label: A
    content: 上山的路上有許多遊客，大家「亦步亦趨」，朝攻頂的方向前進
  - label: B
    content: 他參加演說比賽，在台上「大放厥詞」，贏得滿堂聽眾的喝采
  - label: C
    content: 他整個寒假都關在家裡「閉門造車」，專心致志的準備開學的模擬考
  - label: D
    content: 如果單用這幾筆紀錄就要評斷一個人的人格，未免有如「管中窺豹」。
- id: doc_113_新北_桃子腳_國文_g9s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 關於詞、曲的比較，以下選項的說法何者正確？
  options:
  - label: A
    content: 詞和曲除正文外都可加襯字，使句式變化較靈活
  - label: B
    content: 詞有詩餘、長短句的別稱；曲有詞餘、曲子詞的別稱
  - label: C
    content: 詞有詞牌，曲有曲牌，二者皆要入樂，依聲填寫
  - label: D
    content: 詞多不避俚俗，較淺白自然；曲尚文雅，較婉約含蓄。
- id: doc_113_新北_桃子腳_國文_g9s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 關於馬致遠天淨沙：「夕陽西下，斷腸人在天涯」的理解，下列何者不正確？
  options:
  - label: A
    content: 句中描寫的情感與「日暮鄉關何處是，煙波江上使人愁」相似
  - label: B
    content: 藉「古道、西風、瘦馬」等場景，烘托遊子孑然無依的身影
  - label: C
    content: 此曲透過外在景物的鋪排，襯托出淒苦的心境，深具感染力
  - label: D
    content: 全篇至此由情轉景，並將情和景相融合，點出「秋思」的主題。
  lesson_raw:
    number: 第一課
    title: 天淨沙秋思
    basis: 引述馬致遠天淨沙
- id: doc_113_新北_桃子腳_國文_g9s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 對於白樸沉醉東風：「傲殺人間萬戶侯，不識字煙波釣叟」的理解，下列何者不正確？
  options:
  - label: A
    content: 「煙波釣叟」不僅呼應題目「漁父詞」，同時也是作者嚮往的對象
  - label: B
    content: 所表達的情感和「人生在世不稱意，明朝散髮弄扁舟」相近
  - label: C
    content: 讀者可以從中感受作者想要寄情山水、淡泊名利的悠然心境
  - label: D
    content: 作者直接展現了對萬戶侯的輕蔑以及對煙波釣叟的欣羨之情。
  lesson_raw:
    number: 第一課
    title: 沉醉東風漁父詞
    basis: 引述白樸沉醉東風
- id: doc_113_新北_桃子腳_國文_g9s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 方位詞有些明指方位或位置，有些則是虛指，另有涵義。請判斷以下「 」內的方位詞何者是虛指？
  options:
  - label: A
    content: 坐「北」朝「南」的房子
  - label: B
    content: 我軍被敵軍擊潰，敗「北」而歸
  - label: C
    content: 微管仲，吾其披髮「左」衽矣
  - label: D
    content: 歲月如流，眼見斗杓又將「東」指了。
- id: doc_113_新北_桃子腳_國文_g9s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 「蘭茝蓀蕙之芳眾人之所好，海畔亦有逐臭之夫。」這段話旨意為何？
  options:
  - label: A
    content: 人要適時檢視自己的特殊癖好能否為他人所接受
  - label: B
    content: 結交朋友要留意「近朱者赤，近墨者黑」的情形
  - label: C
    content: 世人癖好雖各有不同，但各種事物皆有其喜好者
  - label: D
    content: 擁有高雅的癖好，往往就能造就良好的人際關係。
  lesson_raw:
    number: 第四課
    title: 人不可以無癖
    basis: 引述人不可以無癖課文
- id: doc_113_新北_桃子腳_國文_g9s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 人不可以無癖文中所舉例子，下列何者說明不正確？
  options:
  - label: A
    content: 援引幽夢影章句說明癖好能使生活展現出情趣、意境
  - label: B
    content: 張岱認為無癖之人因缺乏修養，所以不適合與之結交
  - label: C
    content: 白居易、歐陽脩靠自身癖好調整心情，度過人生困境
  - label: D
    content: 孔子「樂以忘憂，不知老之將至」是因有求知的癖好
  lesson_raw:
    number: 第四課
    title: 人不可以無癖
    basis: 題幹提及人不可以無癖
- id: doc_113_新北_桃子腳_國文_g9s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: 鄒忌諷齊王納諫中：「宮婦左右，莫不私王；朝廷之臣，莫不畏王；四境之內，莫不有求於王。由此觀之，王之蔽甚矣！」對於上述文句的說明，下列何者正確？
  options:
  - label: A
    content: 朝廷大臣因有求於齊王，故蒙蔽良心屈從齊王
  - label: B
    content: 宮婦左右因敬畏齊王，而無法客觀地勸諫齊王
  - label: C
    content: 依親疏遠近的關係，敘述齊王遭受蒙蔽的情形
  - label: D
    content: 鄒忌受到君王庇護的程度最高，所以敢言進諫。
  lesson_raw:
    number: 第三課
    title: 鄒忌諷齊王納諫
    basis: 題幹提及鄒忌諷齊王納諫
- id: doc_113_新北_桃子腳_國文_g9s2e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 關於鄒忌諷齊王納諫一文的寫作手法，下列說明哪些不正確？
  options:
  - label: A
    content: 敘述中加入了對話、動作的描寫，使情節更生動、形象更鮮活
  - label: B
    content: 前半段敘述鄒忌與齊王比美的過程，後半段則藉此說明道理
  - label: C
    content: 透過排比的寫作手法，呈現鄒忌與齊王遭受眾人蒙蔽的情形
  - label: D
    content: 採設喻說理的方式，使讀者容易明白作者所要表達的道理
  lesson_raw:
    number: 第三課
    title: 鄒忌諷齊王納諫
    basis: 題幹提及鄒忌諷齊王納諫
- id: doc_113_新北_桃子腳_國文_g9s2e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 「防民之口，甚於防川。川壅而潰，傷人必多，民亦如之。是故為川者決之使導，為民者宣之使言。」（國語 周語一）本段文字所強調的主旨為何？
  options:
  - label: A
    content: 人民的言論若不加以規範，會比水患更可怕
  - label: B
    content: 建堤疏濬以防水患，為政府安民的首要工作
  - label: C
    content: 政府對風災水患應該要提高警覺，隨時防範
  - label: D
    content: 政府要傾聽民意，讓人民享有言論自由為佳。
