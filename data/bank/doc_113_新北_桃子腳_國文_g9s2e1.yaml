    \ 丙、如有王者，必「世」而後仁\n   丁、他們倆年紀差了一「輪」，相處卻毫無隔閡"
  options:
  - label: A
    content: 丙丁乙甲
  - label: B
    content: 丁丙乙甲
  - label: C
