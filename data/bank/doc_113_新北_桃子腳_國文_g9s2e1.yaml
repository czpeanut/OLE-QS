  stem: 下列文句，何者用字完全正確？
  options:
  - label: A
    content: 天邊飛過的一隻烏鴨，吸引了教室裡學生的注意力，引起一陣騷動
  - label: B
    content: 她遠遠看到湖畔的小男孩被一顆大石頭絆倒，連忙跑過去察看傷勢。
  - label: C
    content: 這家商店十幾年來講究貨真價實，童臾無欺，因此贏得顧客的信任
  - label: D
    content: 讀書若能達到焚膏繼晷、發奮忘食的境界，才能說真正體會讀書的樂趣。
- id: doc_113_新北_桃子腳_國文_g9s2e1_s1_2
