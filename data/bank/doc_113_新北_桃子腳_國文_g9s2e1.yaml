  stem: 下列最能呼應文中所提到的「在知上有不周全」的成語為何？
  options:
  - label: A
    content: 運斤成風
  - label: B
    content: 牖中窺日
  - label: C
    content: 聞一知十
  - label: D
    content: 鉤章棘句。
  group_stem: '請閱讀以下文章，並回答36~37 題：


    孔子有言：「知之者不如好之者，好之者不如樂之者。」彷彿以為知、好、樂是三層事，一層深一層；其實在文藝方面，第一難關是知，能知就能好，能好就能樂。知、好、樂三種心理活動融為一體就是欣賞，而欣賞所憑的就是趣味。許多人在文藝趣味上有欠缺，大半由於在知上有欠缺。


    有些人根本不知，當然不會觸感到趣味，看到任何好的作品都沒有感受，這是精神上的殘廢，犯這種毛病的人失去大部分生命的意味。有些人知得不正確，於是趣味低劣，缺乏鑒別力，只以需要刺激或麻醉，取惡劣作品療飢過癮，以為這就是欣賞文學。這是精神上的中毒，可以使整個的精神受腐化。有些人知得不周全，趣味就難免窄狹，往往囿於某一派別的傳統習尚，不能自拔。這是精神上的短視，「坐井觀天，誣天藐小」。


    要診治這三種流行的毛病，唯一的方法是擴大眼界，加深知解。一切價值都由比較得來，生長在平原，你說一個小山坡最高，你可以被原諒，但其實你錯了。「登東山而小魯，登泰山而小天下」，那「天下」也只是孔子所能見到的天下。要把山估計得準確，你必須把世界名山都遊歷過、測量過。研究文學也是如此，你玩索的作品愈多，種類愈複雜，風格愈紛歧，你的比較資料愈豐富，透視愈正確，你的鑒別力（這就是趣味）也就愈可靠。


    改寫自朱光潛 文學的趣味'
