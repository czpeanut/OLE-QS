- id: doc_113_新北_桃子腳_國文_g9s2e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: "呂文穆公 蒙正以寬厚為宰相，太宗尤所眷遇。有一朝士家藏古鑒，自言能照二百里，欲因公弟獻以求知。其弟伺間從容言之，公笑曰：「吾面不過碟子大，安用照二百里？」其弟遂不復敢言。聞者嘆服，以為賢於李衛公遠矣。蓋寡好而不為物累者，昔賢之所難也。\n\
    \  試推論呂蒙正「不受鏡」的原因為何?"
  options:
  - label: A
    content: 鏡子過大，存放不方便
  - label: B
    content: 暗示對方改贈其他禮物
  - label: C
    content: 廉潔自持不收非份禮物
  - label: D
    content: 皇帝賞賜已經足夠使用。
- id: doc_113_新北_桃子腳_國文_g9s2e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 下列各「」中的詞語的使用，何者最適合？
  options:
  - label: A
    content: 「只許州官放火，不許百姓點燈」，豈能讓下屬心服口服
  - label: B
    content: 愛爬山的大方，早已把附近登山路線的「來龍去脈」都查清楚了
  - label: C
    content: 清廉高潔的李老師喜歡人家給他「戴高帽」，以抬高自己的身價
  - label: D
    content: 「解鈴還須繫鈴人」，凡事要靠自己努力，不要一味依賴別人。
- id: doc_113_新北_桃子腳_國文_g9s2e1_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 下列文句何者沒有冗言贅字，用字最精簡？
  options:
  - label: A
    content: 海風吹拂著她的臉龐，也吹亂她那一頭烏黑的秀髮
