  stem: 「上海城市近代化的拓展，由租界肇始而改變了上海舊城的面貌。『租界』最初被劃定時不過是上城外的一片荒野之地，然而現代化以後的『租界』之所以興起，最基本的原因是在中國最動亂的年代，西方列強提供了安全的保障，吸引了全國的富室巨商及其資本向租界集中。每次戰爭動盪，不論是從小刀會的起義、太平天國事變、辛亥革命、軍閥混戰，迫使各地的富人大量攜資移居上海租界避難，同時也使大量難民紛紛湧入租界，成為廉價的勞動力，促使租界地區人口和財富的迅速積累。在西方列強建設租界地的同時，也把當時先進的市政建設、公共事業及西方治理城市的方法和物質文明帶進上海。因此上海二、三○年代，都市的繁華到達頂點。」就以上資料論述的重點說明，下列何者最為合理？
