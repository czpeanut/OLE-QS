    -Write down everything you think.

    -Ask some questions to know your feelings, like “How do I feel now?”, “What makes
    me be angry/sad/worried?”, “What can I do now?”

    2. Control Your Anxiety

    -Find a quiet place. Then, close your eyes, and take a slow breath.

