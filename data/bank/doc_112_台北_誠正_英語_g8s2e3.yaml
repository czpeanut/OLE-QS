  section: 2
  number: 53
  type: single
  page: 4
  stem: 53. What does “She has reached the zenith” mean?
  options:
  - label: A
    content: She swam more beautifully than others.
  - label: B
    content: She was worse than others.
  - label: C
    content: She hurt her arms when swimming.
  - label: D
    content: She broke the records.
  group_stem: 'Merle Liivand is an excellent swimmer in Estonia. She has reached the
    zenith for swimming with a monofin with 26.22 miles in just over 11 hours. She
    did better than anyone else, and no one could do it. Because she had health problems
    when she was a child, she decided to swim to be stronger and healthier. Sometimes,
    she has to swim in very cold water in winter, but she never gives up practicing
    swimming.

    In one of her training classes, there was some plastic in the sea, and she swallowed
    it. She felt terrible, and this made her think of the sea animals. They may be
    in trouble because of the plastic around them. To Merle Liivand, keeping the sea
    clean and protecting the sea animals are important. Also, she hoped everyone can
    be friendly to our earth. So, she started swimming with a special swimming fin
    in order to let more people know her ideas. This “monofin” helped her experience
    a new way to swim just like the sea animals. And she didn’t use her arms when
    she swam with monofins. To help her finish the work, a friend followed her in
    a boat and gave her food and water. Because of that, she was able to keep swimming
    after having some food. Along the way, she picked up all the trash and put it
    in the bags on the boat. By the end of her work, the boat held three bags full
    of trash. “At the end of the day,” she says, “This isn’t just about a record.
    It’s about helping the world.”

    monofin 單一潛水腳蹼 plastic 塑膠 swallow 吞 fin 鰭'
