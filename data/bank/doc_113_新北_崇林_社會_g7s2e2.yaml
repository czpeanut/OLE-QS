  stem: 臺灣缺蛋的新聞並非偶發事件，這是雞蛋產業結構長期以來的問題。下列關於雞蛋產業相關敘述，何者較為正確？(甲)臺灣的蛋雞產業較沒有人口老化的問題；(乙)臺灣蛋雞場應以欄牧的方式來飼養雞隻；(丙)臺灣的蛋雞產業有明顯的農產品商品化現象；(丁)雞蛋年產量持續增加，應與雞蛋價格長期高漲有關
