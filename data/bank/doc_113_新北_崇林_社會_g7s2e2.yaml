  - label: B
    content: 乙丙
  - label: C
    content: 丙丁
  - label: D
    content: 甲丁。
  group_stem: "題組\n 由於三級警戒的防疫措施，各縣市紛紛開始遠距上班、上課，餐廳也全面禁止內用。原本這些攤販、餐廳、學校營養午餐的雞蛋消耗驚人，但在防疫措施下，許多餐飲業者本身都難以維持營運，根本不可能再向蛋商購入大量雞蛋，使得全臺的雞蛋需求量大幅下降，每天至少有1,200\
    \ 萬顆蛋滯銷。再加上作為飼料的玉米價格持續上漲，飼養成本大幅升高，小規模的蛋雞場更深受飼料價格飆漲的影響。種種原因之下，迫使蛋農以減少、汰換飼養的蛋雞來降低損失。\n\
    2022 年初，臺灣COVID-19 疫情趨緩，又適逢農曆新年，雞蛋需求大增。但此時許多蛋雞場仍因先前的減產措施，而維持較少的供給量。更雪上加霜的是：蛋雞場受到禽流感疫情影響，導致許多雞隻死亡或被全面撲殺。又因為當時日夜溫差大，導致雞隻產蛋率下降，使得雞蛋產量短時間內無法因應全臺所需，而出現長達3\
    \ 個月的缺蛋潮。\n  根據相關資料也能發現，缺蛋的新聞並非偶發事件，2019 年1 月也曾出現蛋荒，卻都未根本解決。這是雞蛋生產的產業結構長期以來的問題，蛋價長期過低，蛋農多為年紀較大的小農、傳統蛋雞場設備老舊等，都是亟需改善的部分。也唯有改善整個雞蛋生產結構，才能避免出現下一波的蛋荒。"
