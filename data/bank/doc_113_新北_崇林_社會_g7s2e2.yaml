  group_stem: '▶鄧雨賢創作〈雨夜花〉、〈望春風〉、〈月夜愁〉、〈四季紅〉等名曲，被譽為「臺灣歌謠之父」。他的生平略表如下：


    | 1906年 | 出生於桃園龍潭的書香世家 |

    | 1914年 | 就讀艋舺○學校 |

    | 1920年 | 考上臺灣總督府臺北師範學校，1925年畢業後，曾在◇學校任教 |

    | 1929年 | 遠渡□留學，學習音樂 |

    | 1932年 | 進入唱片公司，專職作曲 |

    | 1938年 | 將〈望春風〉、〈雨夜花〉、〈月夜愁〉等歌曲重填日文歌詞 |

    | 1940年 | 離開唱片業的工作，遷居新竹芎林，在◇學校任教 |

    | 1942年 | 因時勢改日本姓名東田曉雨 |

    | 1944年 | 鄧雨賢因心肺疾病去世 |'
