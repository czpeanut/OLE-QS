- id: doc_113_新北_崇林_社會_g7s2e2_s1_39
  section: 1
  number: 39
  type: single
  page: 5
  stem: '有一段描述戰後臺灣歷史的「五天五地」順口溜如下：「盟軍轟炸，驚天動地；臺灣光復，歡天喜地；政治混亂，昏天暗地；官吏貪汙，花天酒地；物價飛漲，呼天喚地。」

    有關這段順口溜的理解，那些敘述正確？(甲)盟軍轟炸—是指第二次世界大戰期間，因為臺灣是日本的殖民地，所以遭受美軍的大規模空襲攻擊行動 (乙)民國34 年，日本無條件投降，成立臺灣省政府負責接收事宜，並定受降典禮的10
    月25 日為臺灣光復節 (丙)當時政府重用大陸來臺人士擔任高階主管，不少官員藉機貪汙或濫用特權，因此政治昏天暗地 (丁)政府徵調臺灣的米糧等物資支援中日戰爭，導致國內物價飛漲，社會秩序不穩。'
