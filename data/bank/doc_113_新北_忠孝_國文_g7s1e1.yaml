  section: 4
  number: 5
  type: single
  page: 1
  stem: 「酒醉駕車肇事的人是有心殺人嗎？……考試時受不住朋友請託而傳個紙條的是惡意犯規嗎？」無心的錯誤一文中，作者連續提出三個問句，其用意為何？
  options:
  - label: A
    content: 勸勉兒子：知過能改，善莫大焉
  - label: B
    content: 提醒兒子：人心難測，不能片面下評判
  - label: C
    content: 要兒子深思：無心也會造成不好的後果
  - label: D
    content: 要兒子警惕：生活處處有陷阱，要隨時提高警覺
  lesson_raw:
