- id: doc_113_新北_忠孝_國文_g7s1e1_s5_9
  section: 5
  number: 9
  type: single
  page: 4
  stem: 根據文章內容，下列敘述何者錯誤？
  options:
  - label: A
    content: 相較春夏的勃發，秋天顯得淡薄而成熟
  - label: B
    content: 初秋不與蔥翠爭榮，自有其溫婉的性情
  - label: C
    content: 初秋的風姿，有如文人筆下驚人的格調
  - label: D
    content: 作者所愛的初秋是萬物熟成收穫的季節
  group_stem: 秋代表成熟，對於春天之明媚嬌豔，夏日之茂密農深，都是過來人，不足為奇了，所以其色淡，葉多黃，有古色蒼蘢之慨，不單以蔥翠爭榮了。這是我所謂秋的意味。大概我所愛的不是晚秋，是初秋，那時暄氣初消，月正圓，蟹正肥，桂花皎潔，也未陷入凜冽蕭瑟氣態，這是最值得賞樂的。如我煙上的紅灰，只是一股薰熟的溫香罷了。或如文人已擺脫下筆驚人的格調，而漸趨純熟練達，宏毅堅實，其文讀來有深長意味。這就是莊子所謂「正得秋而萬寶成」結實的意義。
