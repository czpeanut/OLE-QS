  section: 3
  number: 2
  type: fill
  page: 1
  stem: 做任何事情之前，一定要思考其候果，不能因為一時沖動而誤事，也不能拿無心來當籍口，畢竟不是每一句「對不起」，都能換來「沒關係」。與其是後懊悔，不如事前瑾慎，以免造成無法挽救的撼事。
  tags:
