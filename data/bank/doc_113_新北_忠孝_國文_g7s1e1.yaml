- id: doc_113_新北_忠孝_國文_g7s1e1_s5_1
  section: 5
  number: 1
  type: single
  page: 3
  stem: 下列四個人的做法，何者最接近本實驗的傳遞原則？
  options:
  - label: A
    content: 小明為了祈福，寄出「轉發越多，幸運越多」的電子郵件給親朋好友，並鼓勵大家轉發
  - label: B
    content: 小英想發結婚喜帖給久違謀面的朋友小哀，於是寄給與小哀比鄰而居的步美，請他轉交
  - label: C
    content: 小華邂逅柯南，僅知他家住台東，於是將情書寄給不認識的郵政局長，請他指派下屬送達
  - label: D
    content: 毛利親筆寫信給只聞其名的某作家，並寄給任職出版社的朋友，請他設法將信轉寄該作家
  group_stem: "1970 年，哈佛大學社會關係實驗室設計一項傳遞實驗，傳遞的原則是：某甲要傳遞一封信給一個不相識的人某乙，但甲只能把信寄給自己認識而又可能認識乙的某位朋友；這位朋友若與乙相識，就將信轉寄給乙，否則就再依照相同的原則將信寄出經過婉轉曲折的旅程，信平安到達乙手中後，研究人員再統計中間經過的人數。\n\
    \    結果發現，最短的旅程只經過兩個人就到達對方手裡，最常則需要十個人，平均從寄信到收信聯絡線是五到六個人。有些中途失蹤的信，根據調查，它往往只離收信者幾百步遠，住得近的人並不一定在我們的「相識圈」內。由於平均每兩個不相識的人要經過六次轉信，所以稱這個實驗為「六度分離」。從這個實驗可以知道，人與人之間都有一條看不見的線將彼此連接起來，所以世界真的小。不論你身在何處，都有一根與人相連的牽引線因此你並不孤單。"
  tags:
    chapter:
      publisher: null
      book: 七上
      subject: 國文
      code: null
      title: null
      chapter: null
    textbook: 七上 第1次段考範圍
    labeled_by: ai
