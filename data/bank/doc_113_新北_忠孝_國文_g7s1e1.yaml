- id: doc_113_新北_忠孝_國文_g7s1e1_s5_3
  section: 5
  number: 3
  type: single
  page: 3
  stem: 根據上面的圖表內容，下列推論何者最為恰當？
  options:
  - label: A
    content: 劉邦過度專制，導致最後被推翻
  - label: B
    content: 漢朝主要以丞相的意見為主，皇帝職位形同虛設
  - label: C
    content: 皇帝與臣子間的情感，兩者有巨大的差別
  - label: D
    content: 明太祖善用人才的治國能力，深受後世認可
  group_stem: '國政經營比較

    | | 明太祖朱元璋 | 漢高祖劉邦 |

    | :--- | :--- | :--- |

    | 風格 | 保守 | 開展 |

    | 創業 | 穩紮穩打 | 敢於一搏 |

    | 用人 | 缺少氣魄 | 信任夥伴 |

