  section: 4
  number: 7
  type: single
  page: 1
  stem: 下列關於母親的教誨一文，何者敘述正確？
  options:
  - label: A
    content: 「無論怎樣重罰，總不許我哭出聲音來。」：故意展現慈母形象
  - label: B
    content: 「我母親管束我最嚴。她是慈母兼任嚴父。但她從來不在別人面前罵我一句，打我一下。」：說明母親對孩子寵愛有加，縱容犯錯
  - label: C
    content: 有一夜她把我叫醒，真用舌頭舔我的病眼。」：母親一味相信偏方，思想迂腐。
  - label: D
    content: 作者犯了錯，母親從不寬容，或隔天早晨教訓他，或當天夜裡懲罰他：說明母親的嚴師角色。
  lesson_raw:
