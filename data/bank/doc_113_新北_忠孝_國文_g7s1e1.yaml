  stem: 海葵的獵食活動須仰賴小丑魚，主要原因為何？
  options:
  - label: A
    content: 海葵的觸手不夠機敏
  - label: B
    content: 小丑魚是海葵的守護神
  - label: C
    content: 海葵本身難以移動身體
  - label: D
    content: 小丑魚能夠分泌出毒液
  group_stem: 小丑魚和海葵，共同生長在海底岩石邊。小丑魚撿食海葵吃剩的殘渣，而海葵則靠小丑魚清除口中的廢物。附著在岩石上的海葵，用如花瓣似的觸手捕捉獵物，分泌毒液將之麻痺然後吞食海葵難以移動，只能靜待獵物上門，而小丑魚就成了誘敵上鉤的餌。牠在海葵伸開來的漂亮觸手間游來游去，引誘其他小魚，使牠們對海葵不存戒心，想到其中嬉遊，結果就成為海葵的餐點小丑魚也以海葵為避難所，在遇到敵人時，牠就逃到海葵的觸手間甚至口中躲避，海葵卻不會對牠對牠施放毒液。
