  section: 5
  number: 4
  type: single
  page: 3
  stem: 李先生向房東租房子，打算開店專賣各類茶品。若依據上面租賃契約的內容，以下哪一件事必須事先取得房東的同意？
  options:
  - label: A
    content: 販賣茶飲的種類
  - label: B
    content: 店面內部的裝潢
  - label: C
    content: 桌椅擺放的位置
  - label: D
    content: 張貼傳單及售價
  group_stem: '第一條、使用租賃物之限制

    1.本房係供住家/營業之用

    未經甲方同意，乙方不得將房屋全部或一部分轉租、出借、頂讓或以其他變相方法由他人使用房屋。。

    2.乙方於租賃期滿應立即將房屋遷讓交還，不得向甲方請求遷移或任何費用。

    3.房屋不得供非法使用，或存放危險物品影響公共安全。

    4.房屋有改裝之必要，乙方取得甲方同意後得自行裝設，但不得損壞原有建築，乙方於交還房屋時應負責恢復原狀。

    第二條、危險負擔：乙方應以善良管理人之注意使用房屋，除因天災地變等不可抗拒之情形外，因乙方之過失，導致房屋毀損，應負損害賠償之責。房屋因自然之損壞有修繕必要時，由甲方負責修理。

    第三條、其他特約事項：

    1.房屋之捐稅由甲方負擔：有關水電費、瓦斯費、大樓管理費及營業必須繳納之捐稅，則由乙方自行負擔。

    2.乙方遷出時，如遺留家具雜物不搬者，視為放棄，應由甲方處理，費用由乙方負擔'
