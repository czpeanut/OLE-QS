  group_stem: "A.\n\nOn the Day of the Dead, people in Mexico usually paint faces,\
    \ dress up in costumes, and dance at a street party. They also sweep \ntombs and\
    \ prepare food offerings just like people in Taiwan. They have another thing special:\
    \ they put pictures of their dead \nrelatives on the table. That’s a way to invite\
    \ dead relatives back to the world on the special day.  \n In Taiwan, people burn\
    \ paper money for their dead relatives on Tomb Sweeping Day. Some people even\
    \ place colorful paper on \nthe tombs. People from different countries remember\
    \ their dead relatives by different means, but the meaning is the same: they all\
    \ \nwant to remember their dead relatives by special means. \n\n* offerings 供品/\
    \ burn 燒/ mean 方式/ match 符合"
