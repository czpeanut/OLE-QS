  - label: C
    content: America
  - label: D
    content: Greece
  group_stem: "C. \n \nThe Olympic Games, also known as the Olympics, started in ancient\
    \ Greece. The first Olympic Games were held in 776 BC, \nwhere athletes from different\
    \ city-states fought for honor in sports. The earliest events included running,\
    \ wrestling, and boxing. \nThe winners were awarded a circle made of olive sticks,\
    \ showing honor and victory. \nThe modern Olympic Games were started again by\
    \ a Frenchman named Pierre de Coubertin in 1896. Unlike the ancient games, \n\
    the modern Olympics include more events, such as table tennis, tennis, gymnastics,\
    \ and long jump. Athletes now come from all \nover the world, showing their nations\
    \ and competing to win medals. \nThe modern Olympics not only focus on speed and\
    \ strength but also on unity and fair play. During the opening ceremony of \n\
    each Olympic Games, there is a grand parade where athletes carry their national\
