  group_stem: "B. \n \nTom visits Philip on Sunday morning, and they are in Philip’s\
    \ room. \nTom: Are you still drawing your grandpa’s home? \nPhilip: You bet. I’m\
    \ drawing a tree. We often played under the tree, remember? \nTom: Yeah. Sometimes\
    \ we climbed it for fruit. And we often played in the river near the tree. \n\
    Philip: Oh, yes. I’m going to draw it later. \nTom: By the way, why not draw some\
    \ chicken and ducks? There were always some between the house and the tree. \n\
    Philip: Good idea. You can see them next time. \nTom: Didn’t your grandpa have\
    \ a black dog and a white cat? \nPhilip: The dog, Lucky, wasn’t my grandpa’s.\
    \ It was Aunt Judy’s. The cat’s name was Sandy, but she often wasn’t home. \n\
    Tom: I get it. Who’s the woman with a baby on her back standing in front of the\
    \ house? \nPhilip: That is Aunt Judy. She is talking with my grandma in the house.\
    \ The baby is Debby; she was two years old then. She studies in senior high school\
    \ now. \nTom: Wow, fifteen years passed. Time flies fast."
