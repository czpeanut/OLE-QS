- id: doc_113_台北_仁愛_國文_g8s2e1_s4_8
  section: 4
  number: 8
  type: single
  page: 1
  stem: 關於〈木蘭詩〉中作者簡略帶過木蘭多年的從軍生活，卻詳細敘述其返鄉時的情況。下列敘述何者正確？
  options:
  - label: A
    content: 因為非寫實詩，所以無須詳述戰爭下生靈塗炭的慘景
  - label: B
    content: 略寫從軍生活，暗示軍旅艱辛與戰爭慘烈的一言難盡
  - label: C
    content: 為帶出木蘭與家人情誼深厚，故詳述其返鄉歡聚之景
  - label: D
    content: 以木蘭家中人物眾多，襯托其願意代父出征的孝心。
  lesson_raw:
    title: 木蘭詩
    basis: 題目指明〈木蘭詩〉
