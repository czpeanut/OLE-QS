- id: doc_113_台北_仁愛_國文_g8s2e1_s4_5
  section: 4
  number: 5
  type: single
  page: 1
  stem: 關於〈控訴一枝煙囪〉一詩的敘述，下列何者正確？
  options:
  - label: A
    content: 「一只煙灰碟」比喻高雄地形像煙灰碟，導致空汙難以散去
  - label: B
    content: 連續使用「你」字，以物擬人，既讓情節生動，更凸顯嚴肅的環保議題
  - label: C
    content: 用「大煙客」、「黑懨懨的蝴蝶」，勾勒出空汙「蠻不講理」的形象
  - label: D
    content: 用批判的口吻譴責高雄的煙囪林立，破壞了原本美麗的環境景觀。
  lesson_raw:
    title: 控訴一枝煙囪
    basis: 題目指明〈控訴一枝煙囪〉
