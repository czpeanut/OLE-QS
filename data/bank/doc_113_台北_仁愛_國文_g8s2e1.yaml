- id: doc_113_台北_仁愛_國文_g8s2e1_s4_34
  section: 4
  number: 34
  type: single
  page: 4
  stem: 圖一可以印證文中提到的哪一件事？
  options:
  - label: A
    content: 造成人口下降的原因除了戰爭，還有災害
  - label: B
    content: 中國人口從東漢中期之後就開始顯著下降
  - label: C
    content: 魏晉南北朝平均每年約要發生三次的災害
  - label: D
    content: 圖一的人口統計即是運用長條圖做成。
  group_stem: '魏晉南北朝是中國古代著名的亂世，這麼說絕非信口開河。根據《漢書》、《續漢書》、《晉書》的記載與後代學者的研究，中國人口從東漢中期之後就開始顯著下降，魏晉南北朝各時期的平均人口不到東漢盛世的一半，直到南北朝後期才逐漸回升。

    造成人口下降的原因除了人為戰爭導致流亡離散之外，災害也是重要的原因。根據統計，魏晉南北朝的369年間，是中國歷史上災害最頻密的時期，平均每年約要發生三次的災害。


    這些災害包含地質活動、氣候所引發的旱災、水災、地震、風災、雹災、霜害，因為生物(動植物或病菌)所引起的蝗害、瘟疫，以及成因較為複雜的飢荒。

    四川大學的王亞利在《魏晉南北朝災害研究》中詳細統計了這些災害的紀錄，並對這些災害進行分析。旱災、水災往往具有跨地域性的特點；地震突如其來、難以防範，容易造成急遽的人財損失；饑荒與瘟疫造成的人口死亡數量最多，是對人的生命有直接、嚴重影響的災害。


    雖然這些災害被分開統計，但彼此之間互有關聯。史書中明確記載，約有四成的飢荒成因是旱災、水災和蝗災，而其他未寫明的，或許也多半與上述因素有關。另外，不當的人為措施也是災難迭生的原因。魏晉南北朝頻繁的戰爭造成大量人口死亡，屍體可能引發瘟疫，且由於政局不穩，政府對於人口流動的管控能力低下，造成疫情傳播，擴大了瘟疫的影響。

    改寫自《閱讀理解季刊 VOL.33‧從圖表看六朝災害》'
