- id: doc_113_台北_仁愛_國文_g8s2e1_s4_30
  section: 4
  number: 30
  type: single
  page: 4
  stem: 關於本文的敘述，下列何者正確？
  options:
  - label: A
    content: 年輕時的司馬相如顧盼生姿、文武雙全，可謂才貌兼具
  - label: B
    content: 守寡的文君為了得到卓王孫的財力支持，改嫁司馬相如
  - label: C
    content: 昔日卓文君拋棄富裕生活而改嫁，得到了精神上的富足
  - label: D
    content: 兩人情變從開酒肆起，從濃烈的愛情轉為平穩的親情。
  group_stem: "下午的陽光意外的和暖，在多煙多嶂的蜀地，這樣的冬日也算難得了。藥香微微，爐火上氤氳著朦朧的白霧。\n    婦人望著榻上的男子，這個被消渴之疾①所苦的老漢，他的手腳細瘦，膚色黯敗，她用目光愛撫那衰殘的軀體。一生了，一生之久啊!\n\
    \    「這男人是誰？」記憶裡不曾有這樣一副面孔，他的額髮已禿，頸項上疊著像駱駝一般的贅皮。他不像當年的才子司馬相如，倒像司馬相如的父親或祖父。年輕時候的司馬雖非美男子，但肌膚堅實，顧盼生姿，能將一把琴彈得曲折多情如一腔幽腸。他又善劍，琴聲中每有劍風的清揚裊健。又彷彿那琴不是什麼人製造的什麼樂器，每根琴絃一一都如他指尖瀉下的寒泉翠瀑，琤琤琮琮，淌不完的高山流水、谷煙壑雲。\n\
    \    猶記得那個遙遠的長夜，她新寡，他的琴聲傳來，如荷花的花苞在中宵柔緩綻放，彈指間，一池香瓣已燦然如萬千火苗。她選擇了那琴聲，冒險跟隨了那琴聲，從父親卓王孫的家中逃逸。從此她放棄了僕從如雲、揮金如土的生涯。她不覺乍貧，狂喜中反覺乍富。\n\
    \    當年，她和愛胡鬧的長卿一同開起酒肆來。開酒肆真好，當月光映在酒卮里，實在是時間最美麗的景象啊！可惜，酒肆在父親的反對下被關閉了。父親覺得千金小姐賣酒是可恥的。唉！父親卻從來不知賣酒是那麼好玩的事啊！\n\
    \    想著，她站起來，走到衣箱前，掀了蓋，掏摸出一枚銅錢，錢雖舊了，卻還晶亮。這是她當年開酒肆賣出第一杯酒的酒錢。對她而言，這一錢勝過萬貫家財。這一枚錢一直是她的祕密，誰都不知。滿室酒香中盈耳的總是歌，迎面的總是笑，這枚錢上彷彿仍留著當年的聲紋，如同冬日結冰的池塘留著夏夜蛙聲的記憶。\n\
    \    酒肆遵父命關門的那天，卓王孫送來僕人和金錢。於是，她知道，這一切逾軌的快樂都結束了。事情後來的發展果真一如她所料，有了功名以後，長卿一度想娶一位茂陵女子為妾。啊！身為蜀人，他竟已不再愛蜀女，他想娶的，居然是京城附近的女子。文君用一首白頭吟挽回了自己的婚姻—對，挽回了婚姻，但不是愛情。\n\
    \    皚如山上雪，皎若雲間月。\n    聞君有兩意，故來相決絕。\n    淒淒復淒淒，嫁娶不須啼。\n    願得一心人，白頭不相離。\n    一心人？世上有那一心一意的男人嗎？\n\
    \    藥涼了，可以喝了，她打算叫醒長卿，並且下定決心繼續愛他。不，其實不是愛他，而是愛屬於她自己的那分愛！把銅錢放回衣箱一角，卓文君輕聲喚道：「長卿，起來，藥，熬好了。」\n\
    【注釋】①消渴之疾：糖尿病。\n節選 張曉風 〈卓文君和她的一文銅錢〉"
