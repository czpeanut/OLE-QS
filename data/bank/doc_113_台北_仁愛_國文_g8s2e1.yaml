- id: doc_113_台北_仁愛_國文_g8s2e1_s4_6
  section: 4
  number: 6
  type: single
  page: 1
  stem: 下列有關〈木蘭詩〉的詩句說明，何者正確？
  options:
  - label: A
    content: 「不聞機杼聲，惟聞女嘆息」：木蘭愁思滿腹是因擔憂自己須隻身離鄉
  - label: B
    content: 「東市買駿馬，西市買鞍韉」：表現木蘭為征戰準備，匆促忙碌的樣子
  - label: C
    content: 「萬里赴戎機，關山度若飛」：充分展現木蘭軍旅生活艱苦，居無定所
  - label: D
    content: 「策勳十二轉，賞賜百千強」：表現出天子對木蘭巾幗不讓鬚眉的讚賞。
  lesson_raw:
    title: 木蘭詩
