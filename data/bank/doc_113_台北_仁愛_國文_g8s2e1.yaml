- id: doc_113_台北_仁愛_國文_g8s2e1_s4_7
  section: 4
  number: 7
  type: single
  page: 1
  stem: 下列有關〈木蘭詩〉的寫作手法，何者正確？
  options:
  - label: A
    content: 全詩善用排比、類疊、頂真，充分展現不避雷同、反覆吟詠的民歌特色
  - label: B
    content: 全詩使用第一人稱敘述，善用問答手法，且能靈活運用繁筆簡筆
  - label: C
    content: 採用順敘法交代木蘭代父從軍的故事，詩末運用擬物法頌揚木蘭的智勇
  - label: D
    content: 第二節透過配備的採買與時空的瞬變，展現木蘭奮勇殺敵的不凡氣概。
  lesson_raw:
    title: 木蘭詩
