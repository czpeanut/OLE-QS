  page: 2
  stem: 米花市舉辦了一場書信大會考，吸引許多名偵探來參加，請問誰的觀念最正確？
  options:
  - label: A
    content: 柯南：寫信提及人名或其字、號，應書寫在同一行，避免將人名分寫於兩行
  - label: B
    content: 灰原：明信片的寫法與一般書信相同，因此在收件人的名字後面用「啟」，在寄件人的名字後面則用「緘」
  - label: C
    content: 新一：當寫橫式信封時，寄信人地址應寫於收件人地址之下以表示尊敬對方，郵票則是貼在右上角
  - label: D
    content: 平次：因為只有寄信人才知道收信人的身分，所以直式信封框內欄的稱呼，是寫寄信人對收信人的稱呼。
