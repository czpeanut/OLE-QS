  type: single
  page: 4
  stem: 依據文意，上引文字中，________內最適合填入的文句為何？
  options:
  - label: A
    content: 舟人大恐，請棄船所載
  - label: B
    content: 士衡驚駭，遇倉皇逃走
  - label: C
    content: 副使鎮定，命棄船逃生
  - label: D
    content: 眾人相詬，爭相急逃脫。
  group_stem: "李士衡為館職，使高麗，一武人為副。高麗禮幣贈遺之物，士衡不關意，一切委於副使。時船底疏漏，副使者以士衡所得縑帛藉①船底，然後實己物，以避漏濕。至海中，遇大風，船遇傾覆，___________________，不爾，船重必難免。\n\
    \    副使倉惶，悉取船中之物投之海中，更不暇撿擇。約投及半，風息船定。既而點檢所投，皆副使之物。士衡所得在船底，一無所失。\n【注釋】①藉：鋪墊。\n\
    沈括《夢悉筆談·人事一》"
