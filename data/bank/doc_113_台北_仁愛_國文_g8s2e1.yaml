- id: doc_113_台北_仁愛_國文_g8s2e1_s4_4
  section: 4
  number: 4
  type: single
  page: 1
  stem: 關於〈讓春天從高雄出發〉一詩的說明，何者正確？
  options:
  - label: A
    content: 「太陽回來了／從南迴歸線」運用倒裝法強調季節轉換由南向北
  - label: B
    content: 首節以「海峽」、「潮水」、「堤岸」自近而遠描寫，引領讀者的眼光
  - label: C
    content: 以「春天」為焦點，透過熱情的筆調，道出作者對高雄工業蓬勃發展的祈願
  - label: D
    content: 「讓木棉花的火把／用越野賽跑的速度」強調木棉花在高雄的重要性。
  lesson_raw:
    title: 讓春天從高雄出發
    basis: 題目指明〈讓春天從高雄出發〉
