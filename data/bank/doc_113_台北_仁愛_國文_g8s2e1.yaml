  stem: "根據歐陽脩的文章內容，下列選項敘述何者正確？\n    馮相道，和相凝，同在中書。一日，和問馮曰：「公靴新買，其直幾何？」馮舉左足示和曰：「九百。」和性褊急，遽回顧小吏云：「吾靴何得用一千八百？」因詬責。久之，馮徐舉其右足曰：「此亦九百。」於是哄堂大笑。時謂宰相如此，何以鎮服百僚？"
  options:
