- id: doc_113_台北_仁愛_國文_g8s2e1_s4_9
  section: 4
  number: 9
  type: single
  page: 1
  stem: 〈木蘭詩〉善用狀聲詞來描摹聽覺印象。請問下列選項「」中的詞語，何者皆是狀聲詞？
  options:
  - label: A
    content: 「濛濛」細雨／書聲「琅琅」／波光「粼粼」
  - label: B
    content: 「姍姍」來遲／蟲聲「唧唧」／餘音「裊裊」
  - label: C
    content: 星光「熠熠」／「拳拳」服膺／「侃侃」而談
  - label: D
