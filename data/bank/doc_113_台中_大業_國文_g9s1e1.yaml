- id: doc_113_台中_大業_國文_g9s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 美學家說：「感覺是我們進入審美經驗的門戶。」因此，文學家多善用視覺、聽覺、嗅覺、味覺、觸覺等感覺意象，藉以引起讀者的聯想，激動讀者的情緒。下列作品中，何者感覺意象運用未達三者？
  options:
  - label: A
    content: 醉別江樓橘柚香，江風引雨入舟涼。憶君遙在瀟湘月，愁聽清猿夢裡長
  - label: B
    content: 霧失樓臺，月迷津渡，桃源望斷無尋處。可堪孤館閉春寒，杜鵑聲裡斜陽暮
  - label: C
    content: 乘彩舫，過蓮塘，棹歌驚起睡鴛鴦。遊女帶香偎伴笑，爭窈窕，競折團荷遮晚照
  - label: D
    content: 少年聽雨歌樓上，紅燭昏羅帳。壯年聽雨客舟中，江闊雲低，斷雁叫西風。而今聽雨僧廬下，鬢已星星也。悲歡離合總無情，一任階前點滴到天明。
