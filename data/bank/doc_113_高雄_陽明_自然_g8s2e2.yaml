  stem: 在海水浸化法中。將每塊鴉片割成數瓣後丟入池中浸泡會較容易溶解。此與下列何種影響反應速率的因素最相關？
  options:
  - label: A
    content: 溫度
  - label: B
    content: 濃度
  - label: C
    content: 催化劑
  - label: D
    content: 接觸面積
  group_stem: "【題組五】虎門銷煙 \n  19 世紀時。英國將鴉片輸入中國。造成大量官員、人民吸食鴉片。除了造成白銀流出。還嚴重危害國人的身心健康。林則徐受命前往廣州查禁鴉片。並在虎門當眾銷毀鴉片。史稱「虎門\
    \ \n銷煙」。林則徐銷鴉片並非直接焚燒。因為會造成大量的鴉片煙而毒害周圍居民。故採用海水 \n浸化法。方法如下: \n1.在海邊挖出池子。在池底鋪上石塊。四周釘上木板。\
    \ \n2.將海水引入池中。再將每塊鴉片割成數瓣後丟入池中浸泡。 \n3.投入石灰讓池水沸騰。並不斷攪拌使鴉片溶解。 \n4.待退潮時挖開池壁。使池水流入海中。最後再以清水洗刷池底。"
  tags:
