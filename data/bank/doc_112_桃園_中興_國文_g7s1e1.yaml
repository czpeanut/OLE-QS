- id: doc_112_桃園_中興_國文_g7s1e1_s2_28
  section: 2
  number: 28
  type: single
  page: 5
  stem: 本詩中以「歌聲、忙來忙去、醒來、燃燒、微笑」等詞語來象徵春天的何種特色？
  options:
  - label: A
    content: 火傘高張
  - label: B
    content: 富麗堂皇
  - label: C
    content: 生機蓬勃
  - label: D
    content: 萬籟俱寂
  group_stem: '——春天來了！

    ——春天在哪兒呀？

    小弟弟想了半天也搞不清，

    頂著南風放長了線，

    就請風箏去打聽。


    海鷗說：春天坐著船在海上旅行，

    難道你還沒有聽見水手們迎接春天的歌聲？

    燕子說：春天在天空裡休息，

    難道你還沒有看見忙來忙去的雲彩，

    仔細地把天空擦得那麼藍又那麼亮？

    麻雀說：春天在田野裡沿著小河散步，

    難道你還沒有看見大地從冬眠裡醒來，

    梳過了森林的頭髮，又給原野換上新裳？


    太陽說：

    春天在我的心裡燃燒，

    春天在花朵的臉上微笑，

    春天在學校裡跟著孩子們一道遊戲一道上課，

    春天在工廠裡伴著工人們一面工作又一面唱歌，

    春天穿過了每一條熱鬧的大街，

    春天也走進了每一條骯髒的小巷，

    輕輕地爬過了你鄰家的牆，

    也輕輕地走進了你的家。

    ——節選自《楊喚全集》'
