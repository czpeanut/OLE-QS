- id: doc_112_桃園_中興_國文_g7s1e1_s2_22
  section: 2
  number: 22
  type: single
  page: 4
  stem: 根據文章內容，下列說明何者正確？
  options:
  - label: A
    content: 作者認為喝茶是要「擺譜」的，即茶具、烹飲方法都要講究，也為此特別鑽研專家的茶經
  - label: B
    content: 臺靜農先生家中濃郁的茶香之所以令人難忘，乃是好客之道以及主客間的學問與溫情使然
  - label: C
    content: 羅聯添老師沒有特別喜歡的茶葉也不特別講究喝茶的規矩，唯茶海乃名家手筆、精選而來
  - label: D
    content: 作者認為「茶」乃雅事一樁，「文士品茶」更勝於「壯夫牛飲」，才不致辜負了品茗之美事
  group_stem: "喜歡泡一壺茶，在獨自一人的時候。不拘茶品，不拘茶具，只要是茶，當金黃的茶湯慢慢注入杯底，我的心情也跟著寧靜愉悅。茶香入鼻，茶味入喉，一切盡在不言中。\n\
    \  什麼是好茶？我試著記下專家說的茶經，卻總是在下一次喝茶時忘得一乾二淨。喝茶是要擺譜的，對講究的人來說。不只是壺，還要一些高高低低□大大小小□長長短短的器具□然後加上一套繁文縟節□此之謂茶道也！但我這個凡俗之人，喝茶，以往都是一壺一杯；壺是雜貨店裡買來的，杯是開會時送的，天南地北的兩物，加上一個悠閒的我，齊聚一堂，倒也一團和氣，誰也不嫌棄誰。\n\
    \  曾聽師長說起，昔日在臺靜農先生家中品茗談天，那濃郁的茶香最令人難忘。然而每次請教臺先生泡茶的祕訣，臺先生總是呵呵笑，指著一只大茶壺，說：「就是它，從早到晚浸泡著茶葉，白開水也變成好茶了。」原來，那茶中充滿了學問與溫情，好客之道正是其中的祕方。\n\
    \  我讀研究所時，選修了羅聯添老師的唐代文學專題。羅老師說，唐人的茶文化興盛，於是教我們在課堂上輪流泡茶，體驗一下茶與生活的關係。到了三月天，羅老師就把我們帶到木柵茶園，一邊喝春茶、賞桃花，一邊討論李白、杜甫的詩文。\n\
    \  我們很好奇的問羅老師，有沒有特別喜歡的茶葉？喝茶有沒有什麼規矩？羅老師搖搖手，說：「沒有沒有，只要是茶都可以喝。」「那這個茶海是在哪裡買的？看起來好特別。」羅老師笑了：「在校門口的路邊攤買的，一個才十塊錢。」我們也跟著笑了，原來東西只要好用就好，不一定要名家手筆。\n\
    \  文士品茶，壯夫牛飲，各取所需罷了。茶，是那麼的雅俗共賞，可繁可簡，我說的不過是茶事一樁。\n                            \
    \               ──洪淑苓〈茶事〉"
