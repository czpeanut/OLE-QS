    content: 保存期太短、來不及食用，也是不想收到這些中秋禮物的原因
  - label: D
    content: 由於孫子孫女喜歡邊吃文旦、邊剝皮做帽子來遊戲，只有二成左右的壯世代不想收到文旦柚子做為中秋禮物
  group_stem: '中秋連假即將到來，有不少民眾都有送禮的需求，但若是不小心選錯禮品，恐怕會白白浪費了一番心意！

    根據「壯世代中秋節網路調查」結果顯示，50 歲以上的壯世代，最不想收到的禮物竟是常見的月餅、香腸、蛋糕禮盒，最想收到的第一名則是飯店餐券，提醒晚輩們要送禮物千萬別踩雷了！

    壯世代教科文協會日前針對50 歲以上的民眾發起調查，了解壯世代對於「過中秋」的需求與真實想法，結果驚人的發現，最不受歡迎的中秋節禮物前五名排行，依序為月餅禮盒、香腸禮盒、蛋糕禮盒、餅乾禮盒、柚子文旦。主要原因大多為「重複性太高沒有變化」、「口味太甜或太膩」、「不健康」等等；甚至有人直言，中秋禮盒多保存期限短，來不及食用；且多為加工食品，影響健康！

    不過中秋節應景吃月餅還是很有過節氛圍的，這次調查也詢問壯世代最喜歡的月餅種類，結果發現綠豆椪、蛋黃酥、冰淇淋月餅、鳳梨酥、創意月餅最受到歡迎。有不少人偏好傳統口味，而綠豆椪、蛋黃酥較其他品項不甜膩所以受歡迎；但也有長輩欣賞冰淇淋月餅的創意及新鮮感，且孫子孫女喜歡吃，適合拿來分享。所以不要以為送長輩老派的月餅就能送到心坎裡，適時換換口味也相當不錯。壯世代教科文協會理事長吳春城表示，許多壯世代會有中秋月餅收到吃不完的窘境，也許糕點業者能以此參考調整。

    若是常見禮盒是送禮雷品，那麼壯世代最想收到的中秋禮物是什麼呢？有高達54.2%的壯世代最想收到的是飯店餐券，其次為飯店住宿券（49%）及旅遊票券（38.7%），皆與旅遊相關。主要原因為「喜歡旅遊」、實用、可以約家人或好友一同使用等。

    最後，關於中秋節最想從事的活動，有58.1%壯世代想和親戚家人聚餐、34.2%希望能賞月、32.3%想趁連假出遊。顯示出「團聚」對壯世代來說可能是最為重要的過節元素，也呼應他們對收禮的品項偏好！因此，送壯世代中秋禮物，或是安排中秋活動時，不妨能以此為參考，讓今年中秋多點不一樣感受。

    ──改寫自鍾怡婷〈中秋節送禮 多數長輩都愛「它」〉2022 年09 月07 日'
