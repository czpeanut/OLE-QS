- id: doc_112_彰化_福興_數學_g9s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: '以下敘述正確者有幾個？

    ◎當直線與圓心的距離小於半徑，此直線與圓會有兩個交點。

    ◎圓心與切點的連線必垂直切線，且圓心到切線的距離等於半徑。

    ◎過圓外一點對此圓可以作出無限多條切線。

    ◎平面上，過圓上一點對此圓只能作出一條切線。

    ◎圓中的弦愈長，其所對應的弦心距也愈大。

    ◎對同弧的圓心角度數等於圓周角度數。

    ◎直徑所對的圓周角是直角。

    ◎圓內接四邊形的對角互補。

    ◎一弦的中垂線必通過其所在圓的圓心。

    ◎半徑不等長的兩圓中，相同圓心角所對弧的度數不會相等。'
  options:
  - label: A
    content: '4'
  - label: B
    content: '5'
  - label: C
    content: '6'
  - label: D
    content: 7 個
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
