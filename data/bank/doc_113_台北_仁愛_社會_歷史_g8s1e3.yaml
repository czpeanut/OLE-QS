  group_stem: '【題組四】

    以下為幾則關於自強運動教育方面的歷史資料，請根據資料回答以下問題：

    【資料一】

    國家不惜經費之浩繁，遣諸學徒出洋，孰料出洋之後不知自好，中國第一次出洋並無故家世族，巨商大賈之子弟，其應募而來者類多庸碌之子，流品殊雜，此等人何足以與言西學，何足以與言水師兵法等事。性情則多乖戾，稟賦則多魯鈍，聞此輩在美有與談及國家大事及一切艱巨之任皆昏昏欲睡，則其將來造就又何足觀。

    【資料二】

    奏為擬選聰穎子弟，前赴西洋各國，學習技藝，以培人材……凡西人游學他國，得有長技者，歸國後即延覽入書院，分科傳授，精益求精；其於軍政船政，直視為身心性命之學。今中國欲仿傚其意，而精通其法，當此風氣既開，宜荐選聰穎子弟，前往外國修習，實力講求，以仰副我皇上徐圖自強之至意。

    【資料三】

    我聽聞立國之道，尚禮義不尚權謀；根本之圖，在人心不在技藝。今為學習而奉夷人為師，何況夷人詭譎，未必傳其精巧，即使教者誠教，學者誠學，所成就者不過術數之士。古今來未聞有依靠術數而能振興國家。天下之大，不患無才，如以天文算學必須學習，博采旁求，必有精其術者，何必夷人？何必師事夷人？且夷人吾仇也。'
