  group_stem: '【題組五】

    電影《讓子彈飛》的故事背景是設定在20 世紀初的中國。在最後一幕中，原為一群山賊的主角群，各奔東西。當山賊頭目問道：「老三，去上海還是浦東？」老三回道：「上海就是浦東，浦東就是上海。」便乘著火車離開了。

    上海在當時是中國發展最新進的城市，可追朔到19世紀中葉因中國簽訂「某條約」之後，開放了通商口岸，外國人為上海這座城市帶來許多西方器物及文化，也被譽為「十里洋場」、「冒險家的樂園」。在「某條約」的內容中，允許外國人在「特定區域」居住，並給予保護。當戰爭爆發時，這些區域得倖免於戰火。'
