  stem: 針對上文中所提及的「中華民國消費者文教基金會」，下列敘述何者最不恰當？
  options:
  - label: A
    content: 其組織目的為改善台灣消費環境、伸張消費者權利，經費來源主要為民間捐款和雜誌發行的收入，可見其非營利性
