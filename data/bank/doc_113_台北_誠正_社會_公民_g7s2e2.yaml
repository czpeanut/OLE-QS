- id: doc_113_台北_誠正_社會_公民_g7s2e2_s2_33
  section: 2
  number: 33
  type: single
  page: 4
  stem: 根據上文，請問當時會發生衛生紙之亂的原因最不可能包含下列何者？
  options:
  - label: A
    content: 當時閱聽人的媒體識讀能力不足
  - label: B
    content: 新聞媒體沒有盡事實查核的義務
  - label: C
    content: 商業公司為自身利益散布假訊息
  - label: D
    content: 政府對新聞的事先審查不夠嚴格
  group_stem: '題組二：

    衛生紙之亂

    2019 年1 月中華民國消費者文教基金會(簡稱消基會)舉行「2018 年度十大消費新聞」活動。活動中收集2018 年出現的百則消費新聞，並讓民眾網路票選心目中最重要的消費新聞。

    票選結果第一名為：炒作不實漲價資訊引爆「衛生紙之亂」 大潤發遭重罰350 萬

    2018 年開春新年甫過，全民突然瘋狂搶購起衛生紙，以致各大實體賣場的貨架被一掃而空、網購平台紛紛缺貨，被媒體戲稱為「安屎之亂」，加拿大多倫多星報還將「台灣衛生紙危機」列為「本週全球趣聞」。

    這股搶購起因於大潤發公司為推銷自家2 月23日至2 月27 日的衛生紙促銷活動，於是在2 月23 日上午主動向媒體發出「衛生紙確定大漲30%，賣場業績急飆5
    倍」等訊息，使得民眾聞訊後趕緊趁漲價前搶購囤貨，形成亂潮。

    (摘改自中華民國消費者文教基金會官網)'
