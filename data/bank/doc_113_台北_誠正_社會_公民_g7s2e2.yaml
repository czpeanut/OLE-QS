  type: single
  page: 2
  stem: 針對志願結社所擁有的四項特色，下列何者敘述有誤？
  options:
  - label: A
    content: 民間性：組織由人民所組成，不屬於政府的一部分，運作更具靈活性與彈性
  - label: B
    content: 自主性：由組織成員自主決定行動，不受政府或其他團體影響，發揮公民自治的精神
  - label: C
    content: 組織性：為能有效達成目標，採取制度化的組織分工，使成員能發揮各自的專長
  - label: D
    content: 非營利性：運作經費來源須全數來自募款與捐贈，不得從事任何經營事業的行為
  tags:
