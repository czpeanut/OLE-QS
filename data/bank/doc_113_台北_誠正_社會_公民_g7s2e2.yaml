- id: doc_113_台北_誠正_社會_公民_g7s2e2_s2_31
  section: 2
  number: 31
  type: single
  page: 4
  stem: 請問文中提及的空服員職業工會，其組職的目的與下列何者最相關？
  options:
  - label: A
    content: 致力提升空服員的服務品質
  - label: B
    content: 避免航空公司惡性削價競爭
  - label: C
    content: 爭取空服員勞動權益與保障
  - label: D
    content: 推廣空服員優質專業的形象
  group_stem: '題組一：

    長榮罷工

    桃園市空服員職業工會在2019 年發動長榮空服員罷工，歷時17 天。長榮航空以罷工程序違法，造成公司損失，向工會及幹部提民事求償3400萬元，一、二審皆敗訴，再提上訴三審，仍遭最高法院駁回，全案定讞。勞動學者分析，合法罷工是免責的，若出現勞資爭議時，雇主務必妥善與員工溝通。而長榮航空表示，目前尚未收到判決書，無法回應。(擷取自公視新聞網)'
