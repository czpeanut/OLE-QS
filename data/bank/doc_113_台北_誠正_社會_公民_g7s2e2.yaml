  type: single
  page: 4
  stem: 我國公會在與資方做勞資談判上擁有合法的罷工權利，對公司的損失免責。請問針對工會權利的描述，下列何者最不恰當？
  options:
  - label: A
    content: 小文：勞工能夠組成工會是希望讓弱勢的勞工個人能夠擴大個人影響力
  - label: B
    content: 大明：勞工可成立與加入工會，這是民主國家對公民所保障的結社自由
  - label: C
    content: 小美：組織工會是社會不安定的亂源。作為民主社會，政府應該強力禁止
  - label: D
    content: 阿祥：罷工是勞工與工會所擁有的合法權利，但在使用前應先盡力溝通，避免衝突
  group_stem: '題組一：

