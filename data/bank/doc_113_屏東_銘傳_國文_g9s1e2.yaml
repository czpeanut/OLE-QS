  options:
  - label: A
    content: 「當苦味慢慢離開後，竟然留下淡淡的清甜。」作者終於體會到「苦味消逝前會回甘」的味覺感受。
  - label: B
    content: 「一逕追求甜蜜的人生，常常愈活愈苦。」說明執著追求美滿人生，反而易鑽牛角尖感到生活更痛苦。
  - label: C
    content: 「人生之秋是帶著微苦的感受。」表達人到遲暮階段，常有青春已逝，時不再來的苦澀感慨。
  - label: D
    content: 「甜過了頭的味道會變成苦的，但苦過了之後反而轉甜。」意近於「物極必反，苦盡甘來」。
