  type: essay
  page: 7
  stem: '題目：面對挑戰


    引導語：在〈生於憂患，死於安樂〉一文中，孟子指出歷史上幾位聖賢人物都是歷經困苦，才可能有好的成就，並提及人往往在發生錯誤之後才能求改善，在內心思慮受困擾下才能奮發振作。請以此為出發點，論述你認為要如何面對人生的挑戰，並舉實例說明之。


    建議寫作架構：

    1. 開門見山提出自己的論點。

    2. 使用論據證明論點。可用正反對比論證，舉正反兩面例子並論述，形成強烈對照，使是非分明，亦可使用古今事例，佐證論點的正確性。

    3. 運用名言錦句總結論證，引出結論。


    測驗注意事項：

    1. 請用本國文字書寫，可不用抄題，請記得在作文卷上寫明班級、座號、姓名。

    2. 請於寫作測驗答案卷上作答，如需擬草稿，可以使用本卷空白的部分。

    3. 依據試場規則，寫作測驗答案卷中不得作任何標記。故意污損答案卷、損壞試題本，或在作文內容中顯示自己身分者，該科不予計分。

    4. 依據試場規則，寫作測驗作答時，書寫內容不得超出答案卷格線外框，且務必使用黑色墨水的筆，不得使用鉛筆或其他顏色的筆，違者扣 1 級分。更正時，請使用修正帶（液）。如有超出格線外框、字跡太過潦草或汙損等情事，導致閱卷老師無法判讀寫作內容者，其責任由考生自負，不得提出異議。

    5. 不可使用詩歌體裁，否則不予計分，亦不得要求增加作答用紙。'
