  group_stem: '我的父親常說：「吃是為己，穿是為人。」這話有時想來的確有些意思，吃在肚裡長在身上，自是一點肥不了別人；但穿在身上，漂亮一番，往往取悅了別人而折騰了自己。父親做菜時這麼說，吃菜時這麼說，看我們穿新衣時也這麼說，我一度以為這是父親的人生體會，但後來才知道我的父親並不是這個哲學的「始作俑者」，而是當時我們健樂園大廚曾先生的口頭禪。


    曾先生從不動手做菜，只吃菜，即使再怎麼忙，曾先生都是一派閒氣地坐在櫃檯後讀他的《中央日報》，但曾先生說：「天下的吃到底都是一個樣的，不過是一根舌頭九樣味。」據父親說，曾先生是花了大錢請了人物套交情才聘來的。花錢請人來光吃而不做事，我怎麼看都是不合算的。


    母親的手藝絕佳，我們家有道經常上桌的家常菜，名曰：「冬瓜蒸火腿」，作法極簡，將火腿切成薄片，冬瓜取中段一截，削皮後切成梯形塊，一塊冬瓜一片火腿放好，蒸熟即可食。需知此菜的奧妙在於蒸熟的過程冬瓜會吸乾火腿之蜜汁，所以上桌後火腿已淡乎寡味，而冬瓜則具有瓜蔬的清苦之風與火腿的華貴之氣，心軟邊硬，汁甜而不膩，令人傾倒。但父親總嫌母親切菜時肉片厚薄不一，瓜塊大小不勻，因此味道上有些太濃而有些太淡，只能「湊合湊合」。父親在買菜切菜炒菜調味上頗有功夫，一片冬瓜切得硬是像量角器般精準，話說父親雖有一手絕藝，但每每感嘆他只是個「二廚」的料，真正的大廚，只有曾先生。


    要知道在廚房經年累月的師傅，大多熟能生巧，經常喜歡苛扣菜色，中飽私囊，或是變些魔術，譬如鮑魚海參排翅之類，成色不同自有些價差，而大廚的功用就是在於此。他是一個餐廳信譽的保證，有大廚排席的菜色，廚師們便不敢裝神弄鬼，大廚的舌頭是老天賞來人間享口福的，禁不起一點假，你不要想瞞混過關，稍經察覺，即使你是國家鑑定的廚師也很難再立足廚界。有這層顧忌，曾先生的席便沒人敢滑頭，自是順利穩當。


    曾先生特愛和我講故事，說南道北，尤其半醉之際。曾先生嗜辣，說這是百味之王，正因為是王者之味，所以他味不易親近，有些菜中酸甜鹹澀交雜，曾先生謂之「風塵味」，沒有意思。辣之於味最高最純，不與他味相混，是王者氣象，有君子自重之道在其中，曾先生說用辣宜猛，否則是昏君庸主，綱紀凌遲，人人可欺，國焉有不亡之理？而甜則是后妃之味，最解辣，最怡人，但用甜則尚淡，才是淑女之德，過膩之甜最令人反感，是露骨的諂媚。


    有一次父親問起鹹苦兩味之理，曾先生說道：鹹最俗而苦最高，常人日不可無鹹，但苦不可兼日。況且苦味要等眾味散盡方才知覺，是味之隱逸者，如晚秋之菊，冬雪之梅。而鹹則最易化舌，入口便覺，看似最尋常不過，但很奇怪，鹹到極致反而是苦，所以尋常之中，往往有最不尋常之處，舊時王謝堂前燕，就看你怎麼嘗它，怎麼用它。


    曾先生從不阻止父親作筆記，但他常說烹調之道要出自機杼，□□□□□□，記記筆記不過是紙上的工夫，與真正的吃是不可同日而語的。


    健樂園結束於民國七十年間。健樂園的結束與曾先生的離去有很密切的關係。


    曾先生好賭，有時常一連幾天不見人影，有人說他去豪賭，有人說他去躲債，誰也不知道，但經常急死大家。許多次趙胖子私下建議父親曾先生似乎不大可靠，不如另請高明，但總被父親一句「刀三火五吃一生」給回絕。意謂刀工三年或可以成，而火候的精準則需時間稍長，但真正能吃出真味，非用一輩子去追求，不是一般遇得上的，父親對曾先生既敬且妒自不在話下。


    從學校畢業後，我被分發至澎湖當裝甲兵。有一回在文化中心看完了書報雜誌，正打算好吃一頓，轉入附近的巷子，一片①低矮的小店歪歪斜斜地寫著「九味牛肉麵」，我進到店中，一個肥胖的女人幫我點單下麵後，自顧自的忙了起來，我這才發現暗暝的店中還有一桌有人，一個禿頭的老人沉浸在電視新聞的巨大聲量中，好熟悉的身影，尤其桌上一份《中央日報》。


    我們聊起了許多往事，曾先生依然精神，但眼角已有一些落寞與滄桑之感，滿身廚房的氣味，磨破的袖口油漬斑斑，想來常常抹桌下麵之類。


    我們談到了吃，曾先生說：一般人好吃，但大多食之無味，要能粗辨味者，始可言吃，但真正能入味之人，又不在乎吃了，像那些大和尚，一杯水也能喝出許多道理來。我指著招牌問他「九味」的意思，曾先生說：辣甜鹹苦是四主味，屬正；酸澀腥沖是四賓味，屬偏。偏不能勝正而賓不能奪主，主菜必以正味出之，而小菜則多偏味……。


    那逝去的像流水，像雲煙，多少繁華的盛宴聚了又散散了又聚，多少人事在其中，而沒有一樣是留得住的。曾先生談興極好，用香吉士的果汁杯倒滿了白金龍，顫抖地舉起，我們的眼中都有了淚光。


    如今我重新拾起書本，覺得天地間充滿了學問，一啄一飲都是一種寬慰。曾先生一直沒有告訴我那第九味的真義究竟是什麼，也許是連他自己也不清楚；也許是因為他相信，我很快就會明白。

    改寫自徐國能《第九味》

