  group_stem: '【甲】

    颶之尤甚者曰颳，颳無定期，必與大雨同至，必拔木壞垣，飄瓦裂石，久而愈勁；舟雖泊澳，常至齏粉①，海上人甚畏之，惟得雷聲即止。占颳風者，每視風向反常為戒：如夏月應南而反北，秋冬與春應北而反南；惟七月北風多主颳，旋必成颱，幸其至也漸，人得早避之。（節錄自《郁永河·裨海紀遊》）

    【乙】

    未幾天氣陰且霾，棟搖瓦翻萬木折。稻似黃雲任捲舒，十分摧落三分餘。既穫未乾稿已爛，一場豐作付華胥②。豆棚瓜架盡傾覆，園圃收成望又虛。牖戶③綢繆已莫及，橋梁流失水盈渠。風威愈張雨不休，山間拔木浪翻舟。（節錄自〈黃守謙·暴風雨行〉

    【注釋】①齏粉：碎成粉屑。齏，音ㄐㄧ。 ②華胥：比喻夢境。 ③牖戶：門窗。牖，音ㄧㄡˇ。'
