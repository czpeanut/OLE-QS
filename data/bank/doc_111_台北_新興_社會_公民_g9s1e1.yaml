  - label: A
    content: 小明選擇吃大餐的機會成本最高，開心指數也最高
  - label: B
    content: 小明選擇小旅行的機會成本最低，開心指數也最低
  - label: C
    content: 小明應該選擇小旅行，因為開心指數最低
  - label: D
    content: 小明應選擇吃大餐，因為其機會成本最低。
