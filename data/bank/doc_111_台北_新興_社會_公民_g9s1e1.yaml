  - label: D
    content: 水資源無窮。
  group_stem: '二、水利署指出，2021 年由於無颱風過境，導致西部水庫集水區降雨量僅為過去的2 到6 成，造成水情相對嚴峻。地理老師居住的桃園市已針對此狀況常常實施自來水減壓或減量供水。為此，有咖啡廳業者將清洗噴管的熱水，回收起來清潔流理臺、室外地板等，除了有效節省咖啡廳成本外，也達到省水的功效。臺灣自來水費與世界各國相比相當低廉，導致民眾不懂珍惜用水，此事件剛好可讓大家思考水費問題，引導民眾節約用水，避免再次遭遇同樣的窘境。

