  section: 5
  number: 26
  type: single
  page: 3
  stem: 下列關於本文的敘述，何者恰當？
  options:
  - label: A
    content: 父親知道作者是因償還賭債而要錢，所以故意串通阿樹伯，藉此教育兒子
  - label: B
    content: 看著父親付出勞力借錢，對比自己說謊要錢，加深作者的罪惡感
  - label: C
    content: 阿樹伯剛好有打零工的機會提供給需要錢的作者父子
  - label: D
    content: 作者最後向父親坦承真相，誠心懺悔，並歸還一千五百元。
  group_stem: '有一年，我已經二十幾歲，在學校沒有認真讀書，沉迷賭博，積欠別人一千五百元的賭債，那時的一千五百元很大，恐怕相當於現在的五千元。我沒有弄錢的地方，回家去，騙父親說我要買書，父親照樣二話不說，低頭沉吟甚久，叫起我，說：「走吧！我們去向阿樹伯借！」


    我跟在他後面，那時太陽很大，我走在後面，看他不住的揮汗，背有點駝。到了阿樹伯家，他們一家人正在忙碌的工作，把剛晒乾的稻穀用風鼓吹去沙粒與壞穀，然後用布袋裝起來，滿滿的一個大晒穀場，恐怕有兩三百袋。阿樹伯問父親有什麼事，父親嘿嘿乾笑兩聲，欲言又止，看樣子很難啟齒，阿樹伯又追問一次，他說沒有什麼，就去幫他們的忙，也示意我一起幫著工作，工作中，父親出現好幾次欲言又止的場面，最後還是把話嚥了下去。一直到工作做完，天都黑了，父親背對著阿樹伯，才怯怯的的把話說出來。


    我拿到那一千五百元，心都碎了，但仍然裝作若無其事。回家的路上，父親像做完一件大事似的，很輕鬆的講一些趣事。我把手插在褲袋裡，捏著那一千五百元，捏成一團，錢都被我的手汗弄濕了。（節錄自洪醒夫〈父親大人〉）'
