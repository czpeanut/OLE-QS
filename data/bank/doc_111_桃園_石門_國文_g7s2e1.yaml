- id: doc_111_桃園_石門_國文_g7s2e1_s5_31
  section: 5
  number: 31
  type: single
  page: 4
  stem: 根據甲篇，下列敘述何者正確？
  options:
  - label: A
    content: 薛譚向秦青學歌唱有成，榮歸故里
  - label: B
    content: 秦青認可薛譚的技藝已青出於藍
  - label: C
    content: 秦青用高超的歌唱實力讓薛譚自知不足
  - label: D
    content: 薛譚始終不明白自己歌唱技藝淺薄。
  group_stem: '甲、

    薛譚學謳①於秦青，未窮青之技，自謂盡之，遂辭歸。秦青弗止。餞於郊衢，撫節②悲歌，聲振林木，響遏行雲。薛譚乃謝③求反，終身不敢言歸。

    乙、

    昔韓娥東之齊，匱糧，過雍門，鬻歌假食④。既去，而餘音繞梁欐，三日不絕，左右以其人弗去。過逆旅⑤，逆旅人辱之。韓娥因曼聲哀哭，一里老幼，悲愁垂涕相對，三日不食。遽而追之。娥還復為曼聲長歌，一里長幼，喜躍抃舞，弗能自禁，忘向之悲也，乃厚賂發之。故雍門之人至今善歌哭，效娥之遺聲。」（出自《列子・湯問》）


    注：

    ①謳：歌唱。

    ②撫節：打著拍子。

    ③謝：謝罪、道歉。

    ④鬻歌假食：賣唱換取食物

    ⑤逆旅：旅店、客棧'
