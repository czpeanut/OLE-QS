  group_stem: '2023TIFA 楊景翔演劇團《阮是廖添丁》

    1927 年熙來攘往的臺北車站，一個瘦長俐落的身影一閃而過，大時鐘突然憑空消失，只見牆上留下字跡可疑的『廖』『添』『丁』三字，難不成傳聞過世已十餘年的廖添丁尚在人世，準備要重出江湖？

    由『魔術師Crystal』、『童養媳扒手阿珠』、『高女畢業生Yuli』三名女性組成名為「廖添丁」集團，在這個男人當道的時代，打著義賊的名號，即將翻轉自己命運，要幹一場大事！

    由楊景翔演劇團與被譽為「臺灣當代戲曲的最佳詮釋者」的編劇施如芳共同編創，並邀請作曲家柯智豪、音樂執導王希文，以臺灣日治時期為時空背景，將廖添丁生平史實與民間傳說、鄉野傳奇重新改編，結合魔術、武打、歌舞及混搭東西配樂曲，打造大正時期末年，後廖添丁時代的女性俠盜傳奇。

    楊景翔演劇團

    成立於2013 年，以「透析時代氣氛，紀錄當代現象」，從跨文化角度寓言式文本體現當代生活。創團至今，藝術總監楊景翔作品陸續受兩廳院台灣國際藝術節、烏鎮戲劇節、新舞臺藝術節等重要藝術節邀請演出。2014
    年加入駐團導演陳仕瑛，推出國外經典劇作重製系列，並與編劇林孟寰合作科幻系列作品「方舟三部曲」，開創連續入選高雄春天藝術節徵選紀錄。2015 年加入核心團員潘冠宏，主持以培養新生代創作者進修與發表的「尚青培訓計畫」平台。

