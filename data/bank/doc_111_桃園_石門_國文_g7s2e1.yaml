  - label: A
    content: 童年舊事，歷歷在目，而今早已年過而立，自然不再是涎著臉求母親摺紙船的年紀——作者明白不能如兒時般，理所當然地接受母親的付出了
  - label: B
    content: 母親摺船給孩子，讓孩子在雨天裡也有笑聲，這種美麗的感情要到年事稍長後才能體會出來——小時候未能體會母親操煩生計時，仍為孩子摺船的心意
  - label: C
    content: 我曾經有過許多紙船，在童年的無三尺浪的簷下水道航行，使我幼時的雨天時光，特別顯得亮麗充實，讓人眷戀——兒時生活安穩，且因特別的娛樂而豐富
  - label: D
    content: 而有一些事，卻像夏日的小河、冬天的落葉，像春花，也像秋草，似無所見，又非視而不見——形容不起眼、毫無印象的往事。
