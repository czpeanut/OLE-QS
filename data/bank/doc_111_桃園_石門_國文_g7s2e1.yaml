  type: single
  page: 1
  stem: 根據〈聲音鐘〉，下列文句解釋何者恰當？
  options:
  - label: A
    content: 平常在家，除了自己偶然放的唱片，日子安靜得像掛在壁上的月曆——作者的生活多彩多姿
  - label: B
    content: 「豆奶哦！煎包哦！糯米飯哦！」的叫賣聲就正好穿過你推開的窗戶，不客氣地進來，而且你知道這是用純正臺灣國語呼叫的「中華臺北版」早餐——作者暗諷小販的發音不標準，破壞寧靜的早晨
  - label: C
    content: 這簡直是人間天籟，臺語的瑰寶——具體而微地把整個民族、整塊土地的生命濃縮進一句呼喊——賣芭樂的叫賣聲音節簡單卻富有生命力
  - label: D
    content: 那位賣蝦仁羹的歐巴桑的叫賣聲恐怕是最平淡無奇的，但還沒看到她就拿著大碗小碗衝出來的大人小孩，每天不知凡幾——賣蝦仁羹的叫賣聲過於平淡，以致影響生意。
