  section: 1
  number: 5
  type: single
  page: 1
  stem: 史書記載：「某城市是宋元時期馳名世界的國際貿易港口，有「東方第一大港」之稱。官方在此設立某機構加以管理，其稅收是政府的重要收入。」請問：上文是指哪一座城市設立何種機構?
  options:
  - label: A
    content: 泉州設立市舶司
  - label: B
    content: 廣州設立市舶司
  - label: C
    content: 汴京設立驛站
  - label: D
    content: 北京設立驛站。
- id: doc_113_屏東_中正_社會_歷史_g8s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 元代實施了哪一項政策，有助於宋代理學能在元代之後繼續流傳？
  options:
  - label: A
    content: 推崇以經學傳家的世家大族
  - label: B
    content: 以《四書集注》作為科舉考試的定本
  - label: C
    content: 積極展開漢化運動
  - label: D
    content: 實施公平待遇的科舉制度。
- id: doc_113_屏東_中正_社會_歷史_g8s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 《吃一場有趣的宋朝飯局》一書的作者，在該書一開始就建議讀者，想穿越的人最好穿越到宋代，不但食物比較好吃，娛樂也比以前多很多。請問：下列何者不會是該書描寫的內容？
  options:
  - label: A
    content: 在人口聚集的住宅區開店直到深夜才打烊
  - label: B
    content: 筵席上會出現占城品種的白米飯
  - label: C
    content: 庶民穿著棉布服飾
  - label: D
    content: 使用叫做寶鈔的紙幣。
- id: doc_113_屏東_中正_社會_歷史_g8s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 英國史學家湯恩比說：「一個文化體想要成長，就必須有外界持續不斷大小適合的挑戰。文化體會因應挑戰而產生回應，在不斷挑戰與回應的過程中，文化體便會逐漸成長。」明末清初來華傳教士即扮演著挑戰的角色，促使中國逐漸成長，直到哪位皇帝驅逐傳教士離華，才造成中西文化交流中斷？
  options:
  - label: A
    content: 明朝永樂皇帝
  - label: B
    content: 清朝康熙皇帝
  - label: C
    content: 清朝雍正皇帝
  - label: D
    content: 清朝乾隆皇帝。
