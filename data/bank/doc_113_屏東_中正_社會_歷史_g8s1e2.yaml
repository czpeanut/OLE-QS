  section: 1
  number: 17
  type: single
  page: 2
  stem: 元帝國為維持本族地位，實施差別待遇的種族政策，激起人民的反抗，結束了元帝國對中國本土的統治。在差別待遇的種族政策下，哪一階級擅長理財，多負責財政事務？
