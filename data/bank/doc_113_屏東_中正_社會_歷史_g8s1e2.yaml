  section: 1
  number: 14
  type: single
  page: 2
  stem: 明代曾經出現兩種群體「流寇」與「倭寇」，兩者皆影響著明朝歷史發展。下列何者說法正確？
  options:
  - label: A
    content: 明代實施海禁政策是為了防「流寇」
  - label: B
    content: 流寇中勢力最大的是吳三桂
  - label: C
    content: 流寇首領李自成攻陷北京
  - label: D
    content: 倭寇勢力造成了明朝的滅亡。
