  section: 1
  number: 16
  type: single
  page: 2
  stem: 明代鄭和曾七次下「西洋」，下列對鄭和與其事蹟的敘述，何者正確？
  options:
  - label: A
    content: 鄭和的船隊最遠曾抵達今日的義大利威尼斯
  - label: B
    content: 鄭和下「西洋」的西洋指的是東南亞與大西洋一帶
  - label: C
    content: 明太祖派遣鄭和下西洋宣揚明朝國威，並擴大朝貢貿易的範圍
  - label: D
    content: 鄭和下西洋奠定中國沿海居民移民東南亞的基礎。
