  section: 1
  number: 18
  type: single
  page: 2
  stem: 清初的統治政策中，採取高壓與懷柔並行的策略，其中迫使漢人男子遵從滿人習俗，目的在打擊自尊心與民族意識，表示臣服的統治手段是哪一項？
  options:
  - label: A
    content: 逼迫漢人薙髮留辮
  - label: B
