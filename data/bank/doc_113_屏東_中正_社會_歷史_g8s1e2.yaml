  number: 15
  type: single
  page: 2
  stem: 丹丹閱讀中國歷史人物故事書，發現書中介紹唐朝有個「天可汗」，而元朝有位「成吉思汗」，皆為當時偉大強盛的君主。請問「成吉思汗」是指何人？
  options:
  - label: A
    content: 趙匡胤
  - label: B
