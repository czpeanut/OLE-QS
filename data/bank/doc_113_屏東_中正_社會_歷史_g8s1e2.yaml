- id: doc_113_屏東_中正_社會_歷史_g8s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 宋代建立後，偏重「文人政治、重文輕武」，造成了宋代國勢積弱不振，長期受到外患的困擾，最後亡於外族。請問，北宋和南宋先後亡於哪一外族？
  options:
  - label: A
    content: 契丹、女真
  - label: B
    content: 女真、蒙古
  - label: C
    content: 蒙古、女真
  - label: D
    content: 契丹、蒙古。
