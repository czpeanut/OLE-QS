- id: doc_113_屏東_中正_社會_歷史_g8s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 知名武俠小說《射鵰英雄傳》開頭寫到，錢塘江邊臨安牛家村來了一位說書人，那說書人說道：「兵火過後，原來的家家戶戶，都變成了斷牆殘瓦的破敗之地…………那金兵佔了我大宋天下，殺人放火無惡不作…….只怪我大宋官家不爭氣…….。」請問，小說裡這位說書人描述的應該是下列哪一事件？
  options:
  - label: A
    content: 蒙古西征
  - label: B
    content: 流寇之禍
  - label: C
    content: 靖康之禍
  - label: D
    content: 滿清入關。
- id: doc_113_屏東_中正_社會_歷史_g8s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 某位傳教士被認為是天主教在中國傳教的開拓者之一，也是第一位閱讀中國文學並對中國典籍進行鑽研的西方學者。他除了傳教外，還廣交明朝官員和社會名流，傳播西方天文、數學、地理等科學技術知識，對中西文化交流作出了重要貢獻。請問此位傳教士應為何人？
  options:
  - label: A
    content: 馬偕
  - label: B
    content: 徐光啟
  - label: C
    content: 馬雅各
  - label: D
    content: 利瑪竇。
- id: doc_113_屏東_中正_社會_歷史_g8s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 南宋將領岳飛曾留下一首著名的作品〈滿江紅〉，以下為節錄：「靖康恥，猶未雪。臣子恨，何時滅！駕長車，踏破賀蘭山缺。壯志飢餐胡虜肉，笑談渴飲匈奴血。待從頭，收拾舊山河，朝天闕。」請問，文中的「胡虜」、「匈奴」應是指哪個民族？
  options:
  - label: A
    content: 蒙古
  - label: B
    content: 女真
  - label: C
    content: 契丹
  - label: D
    content: 匈奴。
- id: doc_113_屏東_中正_社會_歷史_g8s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 明初貨幣原以紙幣為主銅錢為輔，後因紙幣濫發嚴重貶值民間拒絕使用，適值歐洲人於○○開採白銀大量流入中國，政府逐漸廢棄紙幣改採白銀與銅錢並用的制度。請問上文中的「○○」是指何處？
  options:
  - label: A
    content: 非洲
  - label: B
    content: 美洲
  - label: C
    content: 歐洲
  - label: D
    content: 東南亞。
