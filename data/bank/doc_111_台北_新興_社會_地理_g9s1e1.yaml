  section: 1
  number: 3
  type: single
  page: 1
  stem: 非洲南部的喀拉哈里盆地內多為沙漠地帶，氣候乾燥。請問：影響此區氣候乾燥的主要原因為何？
  options:
  - label: A
    content: 距海遙遠
  - label: B
    content: 暖流經過
  - label: C
    content: 涼流流經
  - label: D
    content: 副熱帶高氣壓籠罩。
- id: doc_111_台北_新興_社會_地理_g9s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 漠南非洲的開發時間較晚，且外來文化的傳入較不易，使其產業處於較傳統型態，上述狀況的產生與下列何因素較「無關」？
  options:
  - label: A
    content: 海岸陡直，少良港
  - label: B
    content: 撒哈拉沙漠橫亙，交通不便
  - label: C
    content: 遠離其他各大洲，位置獨立
  - label: D
    content: 河川多急流瀑布，不利航行。
- id: doc_111_台北_新興_社會_地理_g9s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 非洲面積較廣大氣候中的雨林、莽原、乾燥三種氣候類型的主要的劃分依據為何？
  options:
  - label: A
    content: 人口的疏密
  - label: B
    content: 降水量的多寡
  - label: C
    content: 盛行風的強弱
  - label: D
    content: 年均溫的高低。
- id: doc_111_台北_新興_社會_地理_g9s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 非洲大部分的地區位於熱帶氣候區，其中熱帶雨林森林茂密，樹種繁多；熱帶莽原卻樹木稀疏，高草原雜生。請問：造成兩地植被景觀不同的主要因素為何？
  options:
  - label: A
    content: 氣溫的高低
  - label: B
    content: 雨季的長短
  - label: C
    content: 距海的遠近
  - label: D
    content: 地勢的高低。
