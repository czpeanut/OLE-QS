- id: doc_111_台北_新興_社會_地理_g9s1e1_s2_23
  section: 2
  number: 23
  type: single
  page: 2
  stem: 不只盧安達，非洲還有部分國家長年陷於「內戰」的戰火之中，這顯示出非洲國家在建國時，已出現什麼問題？
  options:
  - label: A
    content: 同一國家出現不同族群
  - label: B
    content: 以熱帶栽培業為主要產業
  - label: C
    content: 人民信仰宗教複雜
  - label: D
    content: 地理位置具戰略性。
  group_stem: 一、電影《盧安達飯店》由真人真事所改編，以1994 年位於剛果與坦尚尼亞間的東部非洲國家盧安達大屠殺為背景，講述了一位盧安達胡圖族飯店經理保羅·魯塞薩巴吉納如何在種族仇殺中設法挽救1268
