- id: doc_111_台北_新興_社會_地理_g9s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 附圖一為坦尚尼亞的「塞倫蓋提國家公園」及肯亞「馬賽馬拉國家保護區」分布圖。每年當南方坦尚尼亞的水草枯竭，130 多萬頭的牛羚及其他動物便越過邊境，來到北面的馬賽馬拉國家保護區尋找草莖及水源。請參考附圖二判斷，此情形應發生在幾月？
  options:
  - label: A
    content: 1～2 月
  - label: B
    content: 3～5 月
  - label: C
    content: 6～9 月
  - label: D
    content: 10～12 月。
  assets:
  - key: s1_11_f1
    kind: figure
    file: doc_111_台北_新興_社會_地理_g9s1e1/s1_11_f1.png
- id: doc_111_台北_新興_社會_地理_g9s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 附圖為非洲國家分布圖。由圖可發現許多國家國界為直線或直角，而非以山脈河川為界。請問：這與非洲哪一地理背景有關？
  options:
  - label: A
    content: 以高原為地形主體
  - label: B
    content: 氣候南北對稱分布
  - label: C
    content: 族群部落多，政治動盪
  - label: D
    content: 歐洲列強殖民，以經緯線劃定。
  assets:
  - key: s1_12_f1
    kind: figure
    file: doc_111_台北_新興_社會_地理_g9s1e1/s1_12_f1.png
- id: doc_111_台北_新興_社會_地理_g9s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 西元2020 年，各國政府採取嚴格的鎖國措施，防止新冠肺炎疫情擴大，在民眾搶購及囤積物資的情況下，咖啡價格上漲30%。非洲當地的咖啡收成也不受疫情的影響，持續向海外輸出。然而，非洲的咖啡農家卻沒有因此顯著的提升收入，主要原因可能為何？
  options:
  - label: A
    content: 大多數利潤落入西方資本家
  - label: B
    content: 非洲地區並未受到疫情影響
  - label: C
    content: 僅有少數市場使用非洲咖啡
  - label: D
    content: 受疫情影響使出口貨物受阻。
- id: doc_111_台北_新興_社會_地理_g9s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 非洲對於電力的需求日益增加。但在回歸線附近的地區，擁有潛能極高的再生能源，若他們能善加利用，必能改善非洲用電短缺的問題。此擁有潛能的再生能源，最有可能為下列何者？
  options:
  - label: A
    content: 風力發電
  - label: B
    content: 水力發電
  - label: C
    content: 地熱能發電
  - label: D
    content: 太陽能發電。
- id: doc_111_台北_新興_社會_地理_g9s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: '附圖是非洲某一可可生產國的困境，由此圖可看出可可的種植對該國最大的影響為下列何者？

    可可農夫收入過低

    ↓

    政府保障收購價格

    ↓

    國際可可價格下跌

    ↓

    政府舉債收購可可

    ↓

    引發多項經濟問題'
  options:
  - label: A
    content: 造成饑荒問題日益嚴重
  - label: B
    content: 破壞當地自然生態環境
  - label: C
    content: 無法掌握生產關鍵技術
  - label: D
    content: 經濟易受市場價格波動。
- id: doc_111_台北_新興_社會_地理_g9s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 某經濟學家指出了漠南非洲饑荒問題的癥結點—將自己最為優良的耕地拿來種植其他作物，以出口至國外市場，又從國外進口大量糧食作物。請問：漠南非洲主要的進、出口作物情況最可能為下列何者？
  options:
  - label: A
    content: 進口咖啡、出口葡萄
  - label: B
    content: 進口棉花、出口稻米
  - label: C
    content: 進口橡膠、出口咖啡
  - label: D
    content: 進口小麥、出口可可豆
- id: doc_111_台北_新興_社會_地理_g9s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 附圖為西部非洲地區的都市與鐵路分布圖。受到殖民影響，可發現其鐵路多呈現單線式，以沿海都市為起點直接連結到內陸。請問：當時此種鐵路修築目的為何？
  options:
  - label: A
    content: 解決都市通勤問題
  - label: B
    content: 發展觀光旅遊
  - label: C
    content: 掠奪農礦資源
  - label: D
    content: 促進內陸發展。
  assets:
  - key: s1_17_f1
    kind: figure
    file: doc_111_台北_新興_社會_地理_g9s1e1/s1_17_f1.png
- id: doc_111_台北_新興_社會_地理_g9s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: '以下為非洲不公平貿易制度的形成原因，請判斷事件發生的先後順序應為何？

    1 形成不公平的貿易制度

    2 殖民母國帶來熱帶栽培業與礦業

    3 原料價格控制在資本家手中

    4 本地農民獲利空間持續受到壓縮'
  options:
  - label: A
    content: '3421'
  - label: B
    content: '2341'
  - label: C
    content: '1234'
  - label: D
    content: 3124。
- id: doc_111_台北_新興_社會_地理_g9s1e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: '漠南非洲因殖民和氣候條件影響，多半以出口熱帶栽培業為主要經濟來源，但也因此產生經濟發展的問題。

    (甲)大量栽種單一作物，可避免受國際價格波動影響

    (乙)大部分國家都包含從生產、加工到製成商品的技術

    (丙)熱帶栽培業需要投入大量勞力

    (丁)經濟作物以出口為主，並非當地居民生活所必需。

    請問：上述何者正確？'
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 甲丙
  - label: C
    content: 乙丁
  - label: D
    content: 丙丁。
- id: doc_111_台北_新興_社會_地理_g9s1e1_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 翻開課本漠南非洲的農產分布圖，可看到西部非洲從沿海到內陸的農產由可可轉為棉花栽種，造成兩地農作物的不同，主要是何種地理條件變化所致？
  options:
  - label: A
    content: 雨季的長短
  - label: B
    content: 地勢的高低
  - label: C
    content: 迎風、背風的差異
  - label: D
    content: 人口的多寡。
- id: doc_111_台北_新興_社會_地理_g9s1e1_s2_21
  section: 2
  number: 21
  type: single
  page: 2
  stem: 盧安達兩大種族之間的矛盾與紛爭，其主要原因為何？
  options:
  - label: A
    content: 兩族膚色迥異
  - label: B
    content: 宗教彼此對立
  - label: C
    content: 被殖民挑撥的結果
  - label: D
    content: 文化差異甚大。
  group_stem: 一、電影《盧安達飯店》由真人真事所改編，以1994 年位於剛果與坦尚尼亞間的東部非洲國家盧安達大屠殺為背景，講述了一位盧安達胡圖族飯店經理保羅·魯塞薩巴吉納如何在種族仇殺中設法挽救1268
