  section: 2
  number: 24
  type: single
  page: 2
  stem: 臺商欲前往漠南非洲投資設廠，下列關於當地主要優勢與不利投資的要素敘述，何者符合事實？
  options:
  - label: A
    content: 高科技人員眾多；物價昂貴
  - label: B
    content: 農礦原料豐富；地震頻繁
  - label: C
    content: 工資低廉；基礎設施不足
