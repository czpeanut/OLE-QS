  stem: 白粉病菌較常以何種方式進行繁殖？
  options:
  - label: A
    content: 無性生殖
  - label: B
    content: 有性生殖
  - label: C
    content: 斷裂生殖
  - label: D
    content: 營養器官生殖。
  group_stem: '有性生殖不一定好！白粉病菌的無性生殖

    具有致病能力的白粉病菌，好幾個世紀才會發生一次成功的有性生殖，其餘的時後大部分都是無性生殖。其實這個令人困惑的現象其來有自：為了要感染植物，白粉病菌必須能夠成功地抑制植物的防禦系統，也就是說，病原菌必須完美地適應宿主植物。「在病原菌和植物宿主的交互作用中，基因重組可能會讓病菌產生負面的改變，原本成功致病的病原菌可能因此失去適應植物宿主的能力，或是失去癱瘓植物防禦系統的能力。」所以對於已經具有致病能力的病菌來說，無性生殖的後代會擁有親代的感染能力，換句話說，無性生殖讓遺傳訊息維持相同，確保了白粉病菌後代的致病能力。

    如果小麥演化出抗病能力，白粉病菌必須有辦法去適應，不然就會輸掉這場競賽。而新的適應只能靠基因重組，也就是有性生殖。很明確地，白粉病菌的有性生殖和基因重組在這幾百萬年的演化中，的確發生過幾次，而且讓後代具有新的致病能力，並成功地感染了新的小麥品系。(改寫自泛科學)

