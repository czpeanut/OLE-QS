- id: doc_113_新北_崇林_自然_g7s2e1_s3_47
  section: 3
  number: 47
  type: single
  page: 4
  stem: 公貓的倒刺有什麼功能？
  options:
  - label: A
    content: 用來幫助牠捕捉獵物
  - label: B
    content: 促進母貓排卵
  - label: C
    content: 保護公貓免受其他動物攻擊
  - label: D
    content: 幫助公貓在爬樹時抓住枝條。
  group_stem: '刺激母豹排卵的方式

    一般來說，雌性動物的排卵機制分成兩種：一種是「自發性」，會在固定時間規律排卵；一種是「誘導性」，要透過特殊刺激，特別像是交配等外力影響才會排卵。例如公貓生殖器上長滿的倒刺，就是為了在交配時刺激母貓排卵。

    至於今天要說的獵豹，雖然也是一種大貓，但過去一直沒人知道牠們究竟什麼時候排卵，既沒有固定週期，也不是在交配中被喚起。後來終於有科學家注意到，每當公獵豹發出一種奇異的喵喵叫，周圍母豹就有很高的機會在未來幾天受孕，才進一步發現，這是因為在聽到這種愛的呼喚後，母豹體內和發情或排卵有關連的性荷爾蒙──例如動情激素、黃體素都會立刻噴發，從而刺激母豹排卵。像這樣靠聲控啟動的繁殖機制，在哺乳動物中可是非常非常罕見，我想，這也是少數經過科學認證的──能讓人懷孕的好聲音。(改寫自泛科學)

