  stem: 根據文章，下列何者敘述正確？
  options:
  - label: A
    content: 芋螺種類超過一千種，其中地圖芋螺因毒液強烈，成為此實驗團隊分離化合物的主要對象
  - label: B
    content: 研究團隊從地圖芋螺的毒液中分離出全新化合物，已通過人體試驗，可抑制血糖上升
  - label: C
    content: 芋螺獵食時，會用毒牙刺進獵物體內，還會把毒液釋放到獵物的周圍，使獵物產生昏迷
  - label: D
    content: 在文中提及的實驗中，斑馬魚屬於「天然物」，而地圖芋螺屬於「模式生物」。
  group_stem: "芋螺的外殼像三角錐，殼口狹小，種類超過一千種。芋螺獵食時，會用齒舌刺進獵物體內，利用毒液將獵物麻痺再吞進肚。芋螺毒液中的神經毒素讓獵物神經的離子通道失效，達到麻痺獵物的效果，原理和某些蛇毒相仿。其實早在2015\
    \ 年，研究團隊成員就已經發現：芋螺還會分泌類似胰島素的「芋螺胰島素」，讓獵物體內血糖驟降而瞬間喪失運動能力。\n  特別是毒液強烈的「地圖芋螺」，這種芋螺除了以齒舌把毒液注入獵物體內，還會把毒液釋放到獵物周圍，讓獵物產生昏迷。研究團隊從毒液中分離出全新的化合物，也就是簡稱為G1\
    \ 與G2 的兩種「類體抑素」。為了分析類體抑素的用處，研究人員把G1 注射到斑馬魚體內，發現升糖素的分泌受到抑制。也就是地圖芋螺的毒液不但含有降低血糖的芋螺胰島素，更有抑制升糖素分泌的類體抑素，讓魚體血糖沒有上升的機會，致使血糖濃度極低，讓獵物瞬間癱瘓。\n\
    \  科學家挑選實驗對象時，會考慮取得容易、方便照護或生命週期短暫等條件，具備這些特質的生物稱為「模式生物」。斑馬魚的再生能力強，基因與人類高度相似，近年成熱門模式生物，這次芋螺類體抑素的發現，斑馬魚又立了大功。\n\
    \  存在於大自然的化合物，通稱為「天然物」，人類從古早的親嘗百草，到現代的研究分析，已產出許多「天然物」的醫藥用藥。本研究從地圖芋螺毒液分離的「類體抑素」，不但具有長效功能，且作用標的明確單純，科學家若能從中合成新藥，對糖尿病或其他罹患荷爾蒙病症的患者，不啻是一種福音。\n\
    \  台灣海邊的潮間帶本來也盛產芋螺，但因缺乏完善的永續管理，大型芋螺目前是可遇不可求，地圖芋螺更是如鳳毛麟角。這篇研究告訴我們：        。\n \
    \                    ──改寫自好讀週報"
