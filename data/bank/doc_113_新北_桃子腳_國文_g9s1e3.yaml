  type: single
  page: 6
  stem: 根據文意，試比較作者家和伯母家包的餛飩，何者正確？
  options:
  - label: A
    content: 形狀：作者家（大）、伯母家（小）
  - label: B
    content: 外皮：作者家（薄）、伯母家（厚）
  - label: C
    content: 餡料：作者家（絞肉）、伯母家（青菜）
  - label: D
    content: 稱呼：作者家（鼻涕餛飩）、伯母家（雲雀餛飩）
  group_stem: "我家去市場買餛飩皮的時候，一定要指名小而薄的那一種，拿回家之後，便開始剁肉做餡兒。將一張張餛飩皮攤整齊，把餡料放在四方麵皮的中央，對角包住餡料摺成三角形，再將裹住餡的一邊往三角尖端滾摺幾圈，左右兩邊成了細長的翅膀尖，用一點涼水沾著其中一根翅膀，將另一邊交疊黏住，就成了。\n\
    \  那時候家裡有個常常往來的親戚，我們小孩子喊做伯母的，她也有很好的手藝，能包菜肉餛飩。她特別瞧不上我家的小餛飩，而我還懵懂無知，熱烈的拉著她：「來吃餛飩，很好吃的餛飩喔。」她斜著眼瞄了一桌餛飩，頗為嫌棄地說：「那有什麼好吃？你們家就愛吃鼻涕餛飩。」我愣在那裡，半天回不過神。我偷偷看著正忙碌地招呼大家吃餛飩的父母親，彷彿完全沒聽見這樣的嘲諷，仍很起勁的笑著。但，我的童稚的世界確實不一樣了，認識到被糟蹋是怎麼一回事。\n\
    \  後來，去那位伯母家，她包了菜肉餛飩給我們吃，大家都吃得很起勁，而我吃得很少，像是噎了太多東西，無法化解。我進入難堪的少女時代，什麼都不如意，不知道自己的價值在哪裡。伯母似有若無的嫌棄和嘲笑，都令我想到鼻涕餛飩，我甚至覺得自己根本就是鼻涕餛飩。好幾年之後，母親的一位好友來家裡做客，我們叫她阿姨，她笑起來有個美麗的酒窩，她又愛笑，總是開開心心的，那天家裡包餛飩，阿姨一旁幫忙，我們都圍在桌旁，母親忽然說：「妳嚐嚐我們家的鼻涕餛飩。」我一時詫異，原來，母親一直都聽見的。阿姨搖搖頭說：「我們管這種餛飩叫\n\
    做雲雀餛飩。」「雲雀？」我脫口而出。「嗯。飛在天上的那種小雲雀，體態又美，聲音又好聽。」阿姨滿心喜悅地說。她一定不知道，雲雀餛飩釋放了被憂鬱囚禁的我，使我相信自己展翅便可以高飛。\n\
    \                       ──節選自張曼娟飛翔的雲雀"
