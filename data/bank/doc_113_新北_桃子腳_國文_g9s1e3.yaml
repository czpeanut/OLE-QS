  group_stem: "記得七月底的某個清晨，與鄰居站在大門口談話，此時我們發現一隻山羌正從門邊的斜坡中間穿行進入，然後一溜煙不見蹤影了，履斜坡如履平地是山羌的本領，斜坡上是一片櫻花樹林及草叢，我還是瞥見了牠的背影，是隻成年的山羌，在山村撞見山羌是很平常的事，我們並沒有放在心上。\n\
    \    隔周回到山村時，一進大門便聞到一股異味，那是散發著動物腐敗的難聞氣味，經過的鄰居也都聞到了，我們到處尋找氣味來源卻都徒然，但只要一走出屋外就會聞到空氣中那飄散的氣味。隔日鄰居從駁坎下經過，終於讓他發現了露台旁的駁坎中間有隻死掉的山羌，牠選擇面對佛堂窗戶的下方駁坎石階壽終正寢。\n\
    \  這讓我想起一部日片，年輕的禮儀師那專注的神情，溫柔俐落、充滿感情與敬重的每一個動作，我看到死者得以尊嚴地往生。而火葬場的守爐者說的一段話更是令人印象深刻：「在這裡待了這麼久，不禁會這麼想，死亡就像是一道門，死亡並不是結束，而是通過這道關卡，進入下個世界，就好像一道門一樣，而我則是守門人，在這裡送走無數的人，一邊對他們說：一路好走，來生再見。」\n\
    \  秋天是蕭蕭落葉飄零的季節，相映園中那紛紛結蕾清麗盛開的茶花，生與死從來就一直在周遭不斷上演著。我凝視駁坎中間空蕩的石階，彷彿看見一隻山羌在薄霧的清晨，優雅地消隱於樹林中，回眸時我見到牠沉靜清亮的眼神。明年葉子會再次茁長，茶花退場，新花代之，小山羌一樣會闖入園中嚼食，年年歲歲如是輪替，悲喜隨風亦不長久，如何尊嚴地面對生命的每一段旅程，尊嚴地前往下一個世界通道，我們都是自己的守門人。\n\
    \                ──節選自琹川緣於一隻山羌的出沒"
