- id: doc_113_新北_桃子腳_國文_g9s1e3_s2_27
  section: 2
  number: 27
  type: single
  page: 3
  stem: "郭嘯天、楊鐵心越聽越怒。郭嘯天道：「靖康年間徽、欽二帝被金兵擄去這件大恥，我們聽得多了。天神天將什麼的，倒也聽見過的，只道是說說笑話，豈難道真有此事？」張十五道：「那還有假的？」楊鐵心道：「後來康王在南京接位做皇帝，手下有韓世忠、岳爺爺這些大將，本來大可發兵北伐，就算不能直搗黃龍，要收復京城汴梁，卻也並非難事。只恨秦檜這奸賊一心想議和，卻把岳爺爺給害死了。」\
    \ \n    張十五給郭、楊二人斟了酒，自己又斟一杯，一口飲乾，說道：「岳爺爺有兩句詩道：『壯志飢餐胡虜肉，笑談渴飲匈奴血。』這兩句詩，當真說出了中國全國百姓的心裡話。唉，秦檜這大奸臣運氣好，只可惜咱們遲生了六十年。郭嘯天道：「若是早了六十年，卻又如何？」張十五道：「那時憑兩位這般英雄氣概，豪傑身手，去到臨安，將這奸臣一把揪住，咱三個就吃他的肉，喝他的血，卻不用在這裡吃蠶豆、喝冷酒了！」說著三人大笑。\
