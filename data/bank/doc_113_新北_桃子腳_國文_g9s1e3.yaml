  stem: 根據以上圖文，若小桃23:00 入睡，請判斷下列敘述何者不正確？
  options:
  - label: A
    content: 想用「睡眠學習」法，應在清晨5:00 設定播單字
  - label: B
    content: 午夜12:30 至2:00 是小桃獲得深度睡眠最多的階段
  - label: C
    content: 小桃隔天早上7:00 起床，睡眠周期會完整循環五次
  - label: D
    content: 小桃當晚有做夢，做夢時間可能落在半夜2:00 左右。
  group_stem: "科學家量測睡眠中的人所發出的腦波，發現睡眠大致分為快速動眼期睡眠和非快速動眼期睡眠兩大階段。入睡後這兩階段會輪流出現，形成一個約90\
    \ 分鐘的睡眠周期。\n  快速動眼期，伴隨眼球快速運動，腦波呈現快速不規則的波動，大腦活動的程度居然和醒著的時候差不多，科學家稱為「矛盾睡眠」，做夢通常也都發生在這個階段。目前許多研究顯示，夢境可能具有記憶重現的功能，對於情緒調控更是至關重要，比如說，做了好夢和噩夢後，隔天起床時的心情會有很大的不同。\n\
    \  非快速動眼期的睡眠中，眼球幾乎不動。非快速動眼期又分為淺層睡眠與深層睡眠。深層睡眠時腦波呈現緩慢、高振幅的狀態，這個階段大腦正在重整一天的記憶，把不重要的情報篩除，重要的放入長期記憶中。深層睡眠期也會發出學習相關的腦波，因此發展出所謂的「睡眠學習」概念。曾有實驗要求學生入睡前先學習外語單字，進入深層睡眠期在背景音樂播放這些單字，叫醒後發現學生答題正確率提高了。\n\
    \  你有沒有偶爾在半夢半醒之間靈光一閃的經驗呢？這其實不是玄學，而是真實發生在剛入睡時的現象。研究發現，當我們剛進入淺層睡眠時，會呈現稍快、低振幅的腦波模式，雖然大腦活動較少，但可能會激發創造力和洞察力。科學家認為在淺層睡眠時人腦會跳脫清醒時的思考框架，把睡前念念不忘的想法在腦中激盪出創意火花來。\n\
    \                                ──改寫自好讀週報"
