  group_stem: "夫令①之於民，誠重矣。令誠賢也，其地之山川草木，亦被其澤而有榮也；令誠不賢也，其地之山川草木，亦被其殃而有辱也。魏君於吳之山川，蓋增重矣。異時②吾民將擇勝於巖巒之間，尸祝③於浮屠、老子之宮也固宜。而君則亦既去矣，何復惓惓④於此山哉？昔蘇子瞻稱韓魏公⑤去黃州四十餘年，而思之不忘，至以為思黃州詩，子瞻為黃人刻之於石。然後知賢者於其所至，不獨使其人之不忍忘，而己亦不能自忘於其人也。\
