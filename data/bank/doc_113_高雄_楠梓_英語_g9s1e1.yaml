    , and each tiny change only takes you about five to ten minutes a day. Sounds
    easy, right?

    You can write down your feelings in a notebook every night before you go to bed.
    For example, when you write down your worries, it helps you to calm down and think
    about things in a clear way. This can put your worries out of your head and think
    about other happy things.

