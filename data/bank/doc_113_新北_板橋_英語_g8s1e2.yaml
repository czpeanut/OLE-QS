    you do that?

    David: I didn''t eat Cathy''s pie. I had a stomachache twenty minutes ago, and
    I went to the toilet.

    Eason: I saw Frank walking away with an empty plate.

    Amy: Frank, did you do it?

    Frank: No, I didn''t. I walked away because my cake fell on the ground. I needed
    to clean it up.

    Amy: Then who ate the pie? Was it you, Betty?

    Betty: Come on, Amy! I just got here. How could I eat the pie?

    Cathy: Look at Gigi! There''s something on her face and mouth.

    Amy: David, is Gigi your dog?

    David: Yes. I thought she ate Cathy''s pie when I was in the toilet. I am so sorry
    about that.

    Cathy: Maybe Gigi was so hungry, so she ate it.

    Amy: We found out the answer finally!

    David: Let me buy what you like to eat later.

    📖 picnic 野餐, empty 空的'
