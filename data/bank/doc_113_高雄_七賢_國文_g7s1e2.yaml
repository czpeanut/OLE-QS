    content: 悲傷可以自行「料理」，快樂的滋味若要充分體會，就需要有人分享才行／煮飯、縫衣和「料理」家務都是持家的藝術
  - label: B
    content: 所謂「謀事」在人，成事在天，凡事但求盡力而為／大學畢業後他打算前往北部「謀事」
  - label: C
    content: 他父親經商失敗，家中「光景」一日不如一日／每當夜幕降臨，華燈初上，自寬敞落地窗向外遠眺，盡是絕妙都市「光景」任你游目賞玩
  - label: D
    content: 看到兒子的傑出表現，通過了多所頂尖大學的入學申請，他不禁為之「躊躇」自得，深慶自己的努力沒有白費工夫／錯綜複雜的案件內容讓承審法官「躊躇」難斷。
