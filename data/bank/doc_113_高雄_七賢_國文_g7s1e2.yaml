- id: doc_113_高雄_七賢_國文_g7s1e2_s5_30
  section: 5
  number: 30
  type: single
  page: 4
  stem: 「孔子很讚賞晏嬰的交友之道，稱他……與朋友交往能做到心存恭敬，以禮相待，對於維持友誼是非常重要的。」這段話的文意表達與下列何者最接近？
  options:
  - label: A
    content: 把友誼歸結於利益的人，我認為是把友誼中最寶貴的東西勾銷了
  - label: B
    content: 真正的友誼需要保持一定的距離。有距離，才會有尊重；有尊重友誼才會長久
  - label: C
    content: 當朋友之間互相都覺得對方比自己優秀時，友誼更能長久維持
  - label: D
    content: 不論是多情詩句、漂亮文章，還是閒暇的歡樂，什麼都不能代替無比親密的友誼。
  group_stem: '(三)

    孔子之學以修身為本，首要目的是要人成就有道德的君子人格。孔子的交友之道，即建立於此原則之上。

    孔子的學生曾子曾說：「君子以文會友，以友輔仁。」意思是說，君子交友就是為了相互幫助完成德行修養。所以孔子說：「友①其士之仁者。」也就是要和仁者、有德的人交朋友。

    交友是為了互相輔助養成美好的德行，所以孔子強調要善於選擇朋友。孔子說：「益者三友，損者三友。友直、友諒②、友多聞，益矣；友便辟③、友善柔④、友便佞⑤，損矣。」孔子主張交益友，去損友。

    孔子很讚賞晏嬰的交友之道，稱他「善與人交，久而不失其敬」。與朋友交往能做到心存恭敬，以禮相待，對於維持友誼是非常重要的。

    節錄自〈彭耀光 孔子有怎樣的交友之道〉

    【註釋】①友：結交，動詞 ②諒：誠信 ③便辟：習於威儀而不正直 ④善柔：善於和顏悅色卻缺乏誠信 ⑤便佞：慣於花言巧語卻無聞見之實'
  answer:
  - D
  answer_source: answer_key_vlm
