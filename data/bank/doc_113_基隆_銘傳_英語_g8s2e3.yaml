    I held your hand when you were small,

    Soft fingers scratching my palm,

    Telling me stories in your head.

    From morning to night,

    Talking and laughing,

    I was the only world you knew.


    Now you walk ahead,

    No need to hold my hand anymore.

    You say K-pop songs are great; the game Arena of Valor is exciting...

    A world I am not part of.

    Then you turn to me and say...

    "Well... maybe you don''t understand."


    Late at night, I sit and think of you,

    Wishing for the days of bedtime stories and laughter.

    Love means learning to let go,

    Watching you grow and fly.

    I will always be here - your home, always.


    Written by Nicole Chen


