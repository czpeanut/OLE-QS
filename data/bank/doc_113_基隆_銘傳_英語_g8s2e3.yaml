    Hawaii is a great place to see rainbows. A rainbow appears when sunlight goes
    through raindrops. The light bends and makes different colors. Hawaii often has
    sunshine and light rain, so rainbows appear often.

    ____54.____. For example, they are on car license plates and are the symbol of
    the University of Hawaii''s teams, the Rainbow Warriors, like basketball and football.
    Also, in old Hawaiian stories, rainbows connect gods and people. People see rainbows
    as signs of something special or royal.

    ____54.____. Sometimes, a double rainbow appears. That means there are two rainbows
    in the sky at the same time. At night, if the moon is bright, a "moonbow" may
    appear. Because Hawaii has clean air, moonbows are clear and easy to see.

    ____54.____. If the drops are very small, the rainbow might look white. This is
    called a "fog bow." Also, people in airplanes can sometimes see a full circle
    rainbow. This is because they are high above the ground.

    Interestingly, Hawaii even has an app called RainbowChase. This app uses weather
    information to help people find rainbows. This makes it easier to see them.

    Rainbows are a beautiful part of nature. Next time you visit Hawaii, let yourself
    enjoy these special and wonderful sights.


