  stem: (  )36. Why does Gary like to make friend on the Net?
  options:
  - label: A
    content: He thinks the Net is dangerous.
  - label: B
    content: He can type very fast.
  - label: C
    content: He is a boring person.
  - label: D
    content: Talking face to face is hard for him.
  group_stem: 'What do they think about the Net?


    Leon

    Using the Net is really convenient. I can share any information in a short time.
    I love using the social network very much.


    Kathy

    I think using the social network is dangerous. All my secrets will be shown on
    it. I don’t like it at all, so I don’t use it. I still like to send e-mail to
    my friends. It’s safer.


    Gary

    I can look for a lot of useful information on the Net. I also enjoy making friends
    on the Net because I’m too shy to talk to others face to face. Chatting online
    is easier for me.


    Iris

    I can’t imagine what the world will be without the Net. Perhaps everything will
    be known after a long time. Just like in the past, we will have to write letters.
    No. I don’t want that to happen. I like to chat with my friends online at any
    time or get any information right away. Besides, I can watch videos online.


     social network 社群網路

    imagine 想像'
