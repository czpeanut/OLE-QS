  stem: (      ) 49. What do we know from the reading?
  options:
  - label: A
    content: Manga cafés are mainly for people to use as hotels.
  - label: B
    content: Small beds can be seen in most manga cafés.
  - label: C
    content: Internet cafés and manga cafés are totally different.
  - label: D
    content: Manga cafés can be as quiet as libraries.
  group_stem: 'Manga Cafés

    You may be no stranger to Internet cafés in which you pay to use the Internet
    and a computer. But have you heard of manga cafés? Like Internet cafés, manga
    cafés provide Internet services. They also provide comic books. You pay for the
    time you spend there, and you can read as many books as you want.

    In Japan, manga cafés are very common and can be found easily in the city. In
    a manga café, you can get your own room with a key. The room is usually very small;
    the space is only enough for a chair, a small desk, and a person. Also, people
    who are at a manga café have to be quiet, so they won’t disturb others.

    Some people in Japan choose to live in a manga café because renting an apartment
    in a big city can be very expensive. Many manga cafés are open 24 hours, and they
    also have shower rooms, so it’s not a bad choice to live in a manga café. Many
    people who live in a manga café have a home, but their home may be hours away
    from their workplace. Living in a manga café means they don’t need to spend hours
    in traffic every day, and it’s also cheaper.

    Although it may not be the most comfortable place to live in, for those who like
    comic books, living in a manga café is like living in their dream.


     disturb 干擾 rent 租用 workplace 工作場所'
