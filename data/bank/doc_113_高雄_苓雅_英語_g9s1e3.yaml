- id: doc_113_高雄_苓雅_英語_g9s1e3_s3_46
  section: 3
  number: 46
  type: single
  page: 5
  stem: (   ) 46. What does Jeff mean by saying “show you the ropes”?
  options:
  - label: A
    content: To teach him how to do a good job.
  - label: B
    content: To prepare useful tools for him.
  - label: C
    content: To make him show up on time.
  - label: D
    content: To show him items that are on sale.
  group_stem: 'Jeff：Hi, you must be the new guy. I’m going to show you the ropes today.

    Rick：Thanks! This is my first week working at BIG Supermarket.

    Jeff：First, let’s start from the back. We put important groceries like eggs and
    milk there so that people will have to go through the whole store to get them.
    Perhaps they will pick up something on the way that they don’t plan to buy.

    Rick：I never knew the trick!

    Jeff：Another reason why the fridges are at the back of the store is it takes less
    time for the delivery trucks to stock them. We want to make sure they stay fresh
    the whole time.

    Rick：I see your point.

    Jeff：Next, you can see we put up nutritional information signs for some items.
    These not only make us a responsible store but also stand out and help customers
    choose which to buy. Sometimes, they can be helpful when it’s something we want
    to sell more.

    Rick：Sounds very smart. Let me take some notes.

    Jeff：At the end of the aisles, we put items that are on sale. These are usually
    products that people might not need or have on their grocery lists.

    Rick：So when they see the good deals, they can’t help but put them in the cart!
    This is amazing!

    Jeff：You’ve got it! Lastly, have you noticed where we put the small packages of
    things?

    Rick：I know they are usually placed where people line up to pay, but is there
    also a reason behind it?

