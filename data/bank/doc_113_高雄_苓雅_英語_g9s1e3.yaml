- id: doc_113_高雄_苓雅_英語_g9s1e3_s3_39
  section: 3
  number: 39
  type: single
  page: 4
  stem: (    ) 39. What are these people talking about?
  options:
  - label: A
    content: What roles computers play in their lives.
  - label: B
    content: How often they surf the Internet.
  - label: C
    content: How they do online shopping through the Internet.
  - label: D
    content: When they bought their first computers.
  group_stem: '(Four people are talking about computers during lunch.)

    Brad：Computers are the things I can live without because they never work for me.
    All I can do is turn them on, and that’s it. No matter what I do, something strange
    always happens. I think life is easier without them.

    Flora：They are great machines that I use for putting reports together and making
    them look good. I also use them to get on the Internet and find information that
    I need easily and quickly. However, playing games and watching videos are not
    the things that I like to do on computers.

    Eugene：Whether I’m at home or at school, I spend lots of time on computers. I
    use them for checking my e-mails, watching videos, and everything in between.
    What’s more, getting my homework done without them is something that I can’t even
    imagine.

    Justine：Just call me Miss Computer because my life is all about those amazing
    machines. I have been known to fix my friends’ computers when problems that they
    can’t deal with come up. Now, people see me as an expert on computers. When I
    finish high school, I plan to study computer engineering like my sister.

     no matter 不論 imagine 想像 engineering 工程學'
