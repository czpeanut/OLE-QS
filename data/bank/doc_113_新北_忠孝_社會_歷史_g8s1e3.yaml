- id: doc_113_新北_忠孝_社會_歷史_g8s1e3_s1_39
  section: 1
  number: 39
  type: single
  page: 2
  stem: 根據梁啟超的主張：「西方孩童之所以可以功成名就，是因為負責教導孩童啟蒙教育者是何人」？
  options:
  - label: A
    content: 學堂的老師
  - label: B
    content: 孩童的母親
  - label: C
    content: 孩童的兄長
  - label: D
    content: 孩童的父親
  group_stem: 梁啟超曾說道：「西人在教育學童之事，由母親擔任教育者占十分之七左右，孩童的性情與嗜好，惟有母親能順著其性情與能力加以教導；因此母親善於教導者，其子容易有所成就，母親不善教導者，其子要有所成就則倍感困難。⋯⋯故治理天下之根本要務有兩項，一則是正人心，二則是廣人才，而二者之根本，必須從孩童的啟蒙教育出發；而啟蒙教育之根本，必須從母親的教養開始；母親的教養之本，必自婦女教育作為開端，故婦女教育實在是關係著天下存亡強弱之根本也。」
