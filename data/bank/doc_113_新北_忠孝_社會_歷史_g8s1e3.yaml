- id: doc_113_新北_忠孝_社會_歷史_g8s1e3_s1_28
  section: 1
  number: 28
  type: single
  page: 1
  stem: 歷史老師上課時說道：「中國簽訂了這個條約內容以後，若將來有其他國家與中國簽訂不平等條約，英國都能因此援例同享了。喪失權利給一個國家便等於喪失給所有簽訂此條款的國家，對中國的危害不小呢！」上述是指外國取得什麼權利？
  options:
  - label: A
    content: 領事裁判權
  - label: B
    content: 協定關稅
  - label: C
    content: 片面最惠國待遇
  - label: D
    content: 租界使用權。
- id: doc_113_新北_忠孝_社會_歷史_g8s1e3_s1_29
  section: 1
  number: 29
  type: single
  page: 1
  stem: 有位中國官員對外國商人說：「中國並不稀罕西人的奇巧之器，外國人在廣州的生意，每年有幾千萬銀兩的利益，這些都是中國對外國人的恩賜。」上述官員的說法，反映了當時的哪一種思想？
  options:
  - label: A
    content: 兼容並蓄
  - label: B
    content: 反對改革
  - label: C
    content: 變法維新
  - label: D
    content: 天朝心態。
- id: doc_113_新北_忠孝_社會_歷史_g8s1e3_s1_30
  section: 1
  number: 30
  type: single
  page: 1
  stem: 中國有一句話說「二十年看深圳、百年看上海。」在上海可以看到各式西洋建築，迥異於中國其他城市。在上海可以看到異國風貌建築的原因為下列何者？
  options:
  - label: A
    content: 鴉片戰爭後上海成為通商口岸
  - label: B
    content: 有志之士在此推動明治維新
  - label: C
    content: 清初即為外國商人聚集之地
  - label: D
    content: 自強運動大量興建異國建築。
- id: doc_113_新北_忠孝_社會_歷史_g8s1e3_s1_31
  section: 1
  number: 31
  type: single
  page: 1
  stem: 清末以來數次改革的結果雖未必成功，但仍可由其中看出中國面對外力進逼下，所做出的回應與進步。若比較清末的自強運動與百日維新，兩者在改革時遇到的共同阻力為何？
  options:
  - label: A
    content: 在上位者沒有實權
  - label: B
    content: 保守人士的反對
  - label: C
    content: 外國勢力的干涉
  - label: D
    content: 只注重軍事國防。
- id: doc_113_新北_忠孝_社會_歷史_g8s1e3_s1_32
  section: 1
  number: 32
  type: single
  page: 1
  stem: "函館古稱為「箱館」，位於北海道南部，三面環海，自古以來就是一個利於漁業與航運的城市。19世紀中葉，率領艦隊迫使日本開港通商的將軍，曾經讚賞箱館為「世界最棒的港口」。當時的日本政府不敵外力，最後被迫與之簽訂條約箱館便成為日本首座國際貿易港口。\n\
    \    請問：上文敘述箱館便成為日本首座國際貿易港口，應與下列何者最為相關？"
  options:
  - label: A
    content: 明治維新
  - label: B
    content: 日俄戰爭
  - label: C
    content: 黑船事件
  - label: D
    content: 甲午戰爭。
- id: doc_113_新北_忠孝_社會_歷史_g8s1e3_s1_33
  section: 1
  number: 33
  type: single
  page: 1
  stem: 西元1840年中國與英國之間的戰爭，其開戰的原因牽涉到貿易、外交和國家尊嚴，而更重要的是毒品走私。然而，對於許多英國人來說，為了毒販的利益去與中國開戰，是一個可恥的想法。當時的英人曾有如下評論：「我很擔心上帝會因我們對中國開戰，將會帶給英國人民什麼樣的懲罰呢？」
  options:
  - label: A
    content: 八國聯軍
  - label: B
    content: 鴉片戰爭
  - label: C
    content: 日俄戰爭
  - label: D
    content: 英法聯軍。
- id: doc_113_新北_忠孝_社會_歷史_g8s1e3_s1_34
  section: 1
  number: 34
  type: single
  page: 1
  stem: 下列短文是慈禧太后的一段自述：「我本來執定不同洋人破臉的，中間一段時期，因洋人欺負太甚了，也不免有些動氣。雖是沒攔阻他們，始終沒叫他們十分盡意的胡鬧。火氣一過，我也就回轉頭來，處處都留著餘地。我若由他們盡意的鬧，難道一個使館有攻不下來的道理？」由慈禧太后的自述可以看出，慈禧太后抱持這樣的對外態度，最後引發了下列哪場戰爭？
  options:
  - label: A
    content: 鴉片戰爭
  - label: B
    content: 甲午戰爭
  - label: C
    content: 英法聯軍
  - label: D
    content: 八國聯軍
- id: doc_113_新北_忠孝_社會_歷史_g8s1e3_s1_35
  section: 1
  number: 35
  type: single
  page: 1
  stem: 清末，某篇社論報導：「長期以來都是白種人打敗黃種人，而這次戰爭將使人認識到國家強弱之分，不是由於種族而是由於制度。明確提出，國家強弱的關鍵在於制度，而不在其他。」上述所指的戰爭應為何？
  options:
  - label: A
    content: 日俄戰爭
  - label: B
    content: 八國聯軍
  - label: C
    content: 中法戰爭
  - label: D
    content: 英法聯軍。
- id: doc_113_新北_忠孝_社會_歷史_g8s1e3_s1_36
  section: 1
  number: 36
  type: single
  page: 2
  stem: 右框是清代某位大臣呈給朝廷的奏摺內容。請判斷這位大臣陳奏的內容，最有可能與下列何者有關？
  options:
  - label: A
    content: 呼應廣州禁絕鴉片
  - label: B
    content: 因應英法聯軍進攻
  - label: C
    content: 推動自強運動
  - label: D
    content: 推動立憲運動
