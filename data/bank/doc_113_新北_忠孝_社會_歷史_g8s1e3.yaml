- id: doc_113_新北_忠孝_社會_歷史_g8s1e3_s1_37
  section: 1
  number: 37
  type: single
  page: 2
  stem: 上述資料中提到的「我國」應該指的是何國？
  options:
  - label: A
    content: 中國
  - label: B
    content: 朝鮮
  - label: C
    content: 俄國
  - label: D
    content: 日本。
  group_stem: 時事新報中有一篇文章其內容節錄如下：「⋯⋯雖然我國位於亞細亞東部，但國民的精神已經開始脫離亞細亞的頑固守舊，向西洋文明轉移。然而不幸的是在近鄰有兩個國家，一個叫支那(中國)，一個叫朝鮮。⋯⋯以我來看，這兩個國家在今日文明東漸的風潮之際，連他們自己的獨立都維持不了。除非這兩個國家出現有識之士，帶頭推進進步，就像我國的維新一樣，對其政府實行重大改革，⋯⋯如果不是這樣的情況，那麼毫無疑問，從現在開始不出數年他們將會亡國，其國土將被世界文明諸國所分割。」
