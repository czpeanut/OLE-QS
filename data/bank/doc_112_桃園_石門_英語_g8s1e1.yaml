  number: 46
  type: single
  page: 5
  stem: (   ) 46. According to the article, what may cyber mean?
  options:
  - label: A
    content: Family
  - label: B
    content: Internet
  - label: C
    content: School
  - label: D
    content: Neighborhood
  group_stem: 'School Bullying

    Bullying is now a very serious problem in school. More and more students experience
    bullying in school. Those students may be afraid of going to school. Some of them
    will not have hope anymore and even kill themselves.

    Bullying is when someone makes you feel bad or hurts you again and again. Many
    kids think of bullying as hitting or pushing, but it is more than that. Calling
    people mean names, laughing at people, speaking something bad about people, taking
    someone’s things without permission, and not letting someone play in a group are
    also bullying. Now we even have cyberbullying, and it happens online. Bullying
    can happen at any age, anywhere, and anytime. It can happen for different reasons.
    Some students bully others just because they want to get more attention. Some
    of them feel powerful or popular by bullying others.

    If someone is mean to you, ignore him or her and show that you don’t care about
    it at all. When the bullies see that you don’t care about it, they may feel bored
    and then stop bullying. If you really don’t know how to do it, you can talk to
    your parents or teachers. They may help you.

    If you are a teacher or a parent and students come to tell you that someone bullies
    them, please make them feel safe and listen to them without judgement. Try to
    help them as much as you can. We all have a job to stop bullying.

    【bully 霸凌  permission 允許  reason原因  ignore 忽略  judgment 判斷】'
