- id: doc_113_台中_五權_社會_公民_g7s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: '某個青年旅宿裡，從世界各地來到臺灣旅遊的背包客，正在進行文化交流。請根據下列的對話內容判斷，下列敘述何者正確？

    日本的美代子說 ：「我們也會在過年時到寺廟參拜 ，並許下新年願望。但我們是午夜參拜而不是白天喔！」

    義大利的少年說 ：「新年時 ，我們會刻意摔碎家中的碗盤甚至花盆，象徵送走過去一年的煩惱和惡運。」

    德國的帥哥說 ：「我們則是會爬到椅子上 ，等跨年的鐘聲一響就跳下來， 象徵甩去惡運、跳進新年！」'
  options:
  - label: A
    content: 文化不會影響地方社會規範的生成
  - label: B
    content: 不同社會規範可能會彼此互相影響
  - label: C
    content: 上述人們談論的規範屬於倫理道德
  - label: D
    content: 社會規範會因地而異呈現不同樣貌
