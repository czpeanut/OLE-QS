- id: doc_113_台中_五權_社會_公民_g7s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 在多元文化社會中，人們來自不同背景，可能會因為文化差異產生誤解。例如：歐洲人通常不會因為台灣人是老闆，對上司就唯命是從，反而比較視為工作夥伴，直接稱呼英文名字。台灣的企業也別想直接移植加班文化到歐洲，因為他們的文化認為，工作是為了生活，即使公司給加班費，員工通常也不見得願意配合。請問解決這種文化衝突最好的方法是什麼？
  options:
  - label: A
    content: 在台灣的企業裡，台灣的文化屬於強勢文化，強迫公司人員接受台灣的加班文化
  - label: B
    content: 拒絕與不同文化背景的人接觸
  - label: C
    content: 透過對話與理解來增進彼此的尊重
  - label: D
    content: 因為是在歐洲設立的公司，所以歐洲原本的企業文化是主流文化須完全保留，讓其他文化消失
  tags:
