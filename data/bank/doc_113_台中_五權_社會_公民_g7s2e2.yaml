- id: doc_113_台中_五權_社會_公民_g7s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 根據聯合國教科文組織的瀕危語言紅皮書，1950年到2010年之間共有230種語言滅絕。目前世界上有三分之一的語言只剩下不到1,000名使用者。每兩週就有一種語言隨著最後的使用者死去而消失，這些語言中有50%到90%預計將在下個世紀以前消失。請問：這對使用該語言的民族，他的文化可能造成什麼影響？
  options:
  - label: A
    content: 沒有影響，因為文化與語言無關
  - label: B
    content: 該民族的文化可能會逐漸消失
  - label: C
    content: 這表示該民族的文化變得更強大
  - label: D
    content: 語言消失後，該民族會變成另一個民族
  tags:
