- id: doc_113_台中_五權_社會_公民_g7s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 在台灣「博愛座」的標誌，表明博愛座位是為老人、孕婦、殘疾人和抱著嬰兒的乘客準備的。因多起博愛座逼讓位事件凸顯其他公民對有需求者主動讓座的品德匱乏與作壁上觀，引發民間呼籲廢除博愛座的聲音。但因「博愛座」名稱與比率明確定義在《身心障礙者權益保障法》，若要修正、改名都必須修法，會再找交通部與專家學者研商，而受訪民眾大部分認為博愛座的存在有必要性。請問：題目畫雙底線的部份是屬於何種社會規範？
  options:
  - label: A
    content: 風俗習慣
  - label: B
    content: 倫理道德
  - label: C
    content: 宗教信仰
  - label: D
    content: 法律
