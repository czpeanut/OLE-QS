    labeled_by: ai
- id: doc_113_台中_五權_社會_公民_g7s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 隨著全球化的發展，許多國家的飲食文化受到外來影響，例如台灣有許多速食店。對於這種現象，下列哪個說法最適合？
  options:
  - label: A
    content: 全球化讓所有國家的文化變得完全相同
  - label: B
    content: 我們只能選擇本國的傳統食物，不能接受外國食物
  - label: C
    content: 全球化讓我們能體驗不同文化，但也要重視本土文化
  - label: D
    content: 外國文化比本土文化更好，應該完全改變自己的文化
