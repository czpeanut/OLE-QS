- id: doc_113_台中_五權_社會_公民_g7s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 第二次世界大戰後，許多殖民地脫離原殖民母國獨立而成為新興國家，但由於當初列強占領時未考慮該地區族群、宗教等因素，導致這些新興國家境內常因不同立場、生活方式等而發生衝突。下列何種作法最有助於減緩上述衝突？
  options:
  - label: A
    content: 發揚主流價值，同化少數族群
  - label: B
    content: 削弱次文化勢力，獨尊強勢文化
  - label: C
    content: 尊重不同族群，包容多元文化差異
  - label: D
    content: 鼓勵全球化思維，限制本土文化發展
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 公民
      code: 1-3
      title: 尊重和包容文化差異
