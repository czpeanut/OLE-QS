  section: 1
  number: 31
  type: single
  page: 2
  stem: 歷史上曾有學者指出，目前世界上的共產黨政權只剩北朝鮮仍維持原狀，其他的共產國家則已經開始程度不一的經濟和政治轉型。這些國家中，又只有中國接受了經濟轉型卻明確拒絕民主化，因而形成一種獨特的政治經濟制度。請問：使中國走向該種制度的關鍵人物最有可能發表下列何言論？
  options:
  - label: A
    content: 馬克思主義的道理千條萬緒，歸根結底就是一句話，造反有理！
  - label: B
    content: 不堅持社會主義，不改革開放，不發展經濟，不改善人民生活，只能是死路一條
  - label: C
    content: 共產主義是天堂，人民公社是金橋
  - label: D
    content: 凡是鎮壓學生運動的人，都沒有好下場！
