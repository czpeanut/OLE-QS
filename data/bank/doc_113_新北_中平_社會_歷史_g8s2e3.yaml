- id: doc_113_新北_中平_社會_歷史_g8s2e3_s1_17
  section: 1
  number: 17
  type: single
  page: 1
  stem: 某一位歷史人物曾在視察中國南方時發表言論：「我們過去的革命常以蘇聯為榜樣。但蘇聯，我們過去頂禮膜拜的詞語，一下子就成為歷史名詞，值得我們深思呀！蘇聯完了，中國向何處去？怎麼辦？……其實，蘇聯垮臺有很多因素。其他不講，成天搞核武器，搞理論專政，不顧人民死活，而老百姓為了基本生活品還成天排隊，我看就是一個主要因素。號稱是發達社會主義，結果折騰了七十多年，連老百姓的肚子都喂不飽，說得過去嗎？說不過去。中國怎麼辦？中國就得以經濟建設為中心，把老百姓的生活解決好。」請問：這位歷史人物應為何者？
  options:
  - label: A
    content: 孫中山
  - label: B
    content: 毛澤東
  - label: C
    content: 鄧小平
  - label: D
    content: 習近平。
  tags:
