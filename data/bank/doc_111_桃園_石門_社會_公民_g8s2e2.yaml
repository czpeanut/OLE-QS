- id: doc_111_桃園_石門_社會_公民_g8s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 肖奈是線上遊戲玩家，帳號角色擁有非常多珍貴的高級裝備與寶物。但是卻遭到其他不肖玩家盜用帳號，把他的裝備與寶物一掃而空。肖奈不甘心向警局報案，要以「竊盜罪」來進行刑事救濟，警方卻告訴肖奈：虛擬寶物並不屬於動產，遊戲伺服器也不歸玩家所有，是屬於遊戲公司的，因此被歸類為「電磁紀錄」，不在刑法第320
    條第1 項「竊盜罪」範圍內。但這並不代表盜取虛擬寶物就沒有處罰，在刑法第359 條規定中，只要是取得、刪除或無故變更輸入他人電磁紀錄，造成他人損害，仍然有對應的罰則。」請問肖奈無法以「竊盜罪」的罪名來進行刑事救濟的原因是？
  options:
  - label: A
    content: 刑責相當原則，為了保護被害者，必須擴大竊盜罪適用範圍。
  - label: B
    content: 無罪推定原則，因為刑法規定，竊取虛擬寶物不算犯罪。
  - label: C
    content: 罪刑法定原則，因為盜用帳號行為發生當下，並無刑法規範。
  - label: D
    content: 罪刑法定原則，因為竊取虛擬寶物不符合竊盜罪規範的條件。
  answer:
  - D
  answer_source: answer_key_vlm
