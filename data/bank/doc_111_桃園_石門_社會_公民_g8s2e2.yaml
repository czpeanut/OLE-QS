- id: doc_111_桃園_石門_社會_公民_g8s2e2_s2_39
  section: 2
  number: 39
  type: single
  page: 4
  stem: 根據上文，請問丹麥「開放式監獄」的監管方式，展現出何項刑罰的目的？
  options:
  - label: A
    content: 處罰犯罪
  - label: B
    content: 嚇阻犯罪
  - label: C
    content: 矯正犯罪
  - label: D
    content: 縱容犯罪
  group_stem: '(三) 丹麥的監獄─再犯率極低的國家

    丹麥的監獄可以分為兩大系統：封閉式監獄和開放式監獄。重大刑犯或被認為有危險性的罪犯會被監禁在封閉式監獄中，被相對嚴格地管控；但若只是犯下竊盜等輕罪或已被關了一段時間且表現良好的重刑犯，就會被關在沒有圍牆或只有矮牆的開放式監獄中。開放式監獄秉持的最重要理念是「正常化」(normalization)，亦即準備回歸社會的犯人，可以在監獄過近乎正常的生活。開放式監獄的囚犯有尊嚴，獄警在要進他們房間時會敲門；他們可以在獄中工作和學習；他們繼續擁有朋友和家人，平日或節慶都能在獄中聚一聚；他們被信任，可以過上一個近乎正常的生活，社會選擇原諒犯人所以給了他們上述的這一切，他們便更可能告訴自己：向前看，還有機會重新當個好人。台灣現在雖然有「外役監獄」，其管制相對台灣一般監獄更寬鬆，但其內部生活環境「正常化」程度低，收容的總犯罪人口比例也遠低於丹麥開放式監獄。'
  answer:
  - C
  answer_source: answer_key_vlm
  tags:
