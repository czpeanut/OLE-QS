    content: 十六歲的君雅：君雅正值「破瓜之年」，但她的琴齡已有十年，歡迎她帶來的鋼琴表演
  - label: C
    content: 四十歲的恩浩：恩浩正值「春秋鼎盛」，熱愛學習新事物，今天將表演練習了半年的吉他
  - label: D
    content: 七十歲的美雲：美雲獻上的劍舞，一招一式、一旋一踢充滿力與美，看不出已屆「花甲之年」。
