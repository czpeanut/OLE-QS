  stem: 多慧擔任才藝表演的主持人，要邀請不同人上臺表演，她事先寫下了介紹詞，請問何者需要修改？
  options:
  - label: A
    content: 七歲的叡叡：別看叡叡才到「始齔之年」，自小極具節奏感的他被譽為舞蹈神童，請各位給予掌聲
