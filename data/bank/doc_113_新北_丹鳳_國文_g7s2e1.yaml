- id: doc_113_新北_丹鳳_國文_g7s2e1_s4_24
  section: 4
  number: 24
  type: single
  page: 3
  stem: 透過(甲)文敘述，下列何者最適切？
  options:
  - label: A
    content: 虎鯨只會出現在太平洋海域
  - label: B
    content: 夭折的虎鯨寶寶編號是J35
  - label: C
    content: 在過去的紀錄中母鯨通常一天就會丟下寶寶，以免沒有食物可以吃
  - label: D
    content: 虎鯨以陪伴著夭折的虎鯨寶寶，表示內心的不捨。
  group_stem: "題組（二）\n\n(甲)\n    西元2018 年，西北太平洋一隻虎鯨的經歷，觸動了無數網友的心。7 月24 日，在維多利亞附近海域，一隻小虎鯨出生，然而不知道什麼原因，這隻小虎鯨在出生半個小時後，就夭折去世了。\n\
    \   生產這隻夭折的小虎鯨的，是一隻編號J35，被研究人員暱稱為Tahlequah 的20 歲母虎鯨。\n   當天晚些時候，人們觀察到了牠和虎鯨寶寶出現在另一片附近的海域。這隻母虎鯨不但沒有離開自己夭折的虎鯨寶寶，反而一直將牠帶在身邊。\n\
    \    大家以為這是一個母親對自己孩子的簡單的不捨行為，過一會，這隻母鯨自然就會離開，畢竟在過去的記錄裡，母鯨通常一天就會丟下寶寶，以免跟不上族群。然而，就在第二天的另一片水域，人們又觀察到了Tahlequah，而牠居然還帶著虎鯨寶寶！牠一直將牠帶在身邊，未曾遠離。牠有時把牠背在背上，有時用嘴將牠推在水裡前進，就這麼帶著牠遊了上百英里。人們開始擔心Tahlequah，因為照看自己的虎鯨寶寶，牠已經開始落後鯨魚群里的其他成員。當時，陪伴在鯨魚寶寶身邊的，除了Tahlequah，還有牠的親人，這隻虎鯨寶寶的夭折，對這個虎鯨族群是一個很大的打擊，牠的家人沒有離棄牠，幫助牠看管寶寶的遺體。\n\
    在接下來的日子裡，牠幾乎沒有進食，一直陪伴在自己寶寶的屍體旁邊。一天，兩天……六天……十天……每一天，媒體都在跟蹤報導著這個母親，而牠，似乎沒有離開自己寶寶的打算，甚至到了今天，已經是虎鯨寶寶去世的第17\
    \ 天，牠依然守在牠的身邊。\n或許是母親的天性，或許不理解自己孩子死去這個事實，這隻鯨魚媽媽可能還希望自己的孩子能夠醒過來，所以牠一直沒有拋棄孩子的遺體，久久不肯離去。在這個星球上，對自己孩子的愛，每一個物種，都是相同的……\n\
    \                 改寫自美聯社\n(乙)\n桓公入蜀，至三峽中，部伍中有得猿子者。其母緣岸①哀號，行百餘里不去，遂跳上船，至便即絕②。破視其腹中，腸皆寸寸斷。公聞之，怒，命黜③其人。\n\
    【注釋】\n① 緣岸：沿著河岸\n② 絕：死亡\n③ 黜：音ㄔㄨˋ，革職，免去職務\n     劉義慶《世說新語․黜免》"
