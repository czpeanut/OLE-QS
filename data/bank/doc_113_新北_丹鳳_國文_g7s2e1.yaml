  stem: 有關紙船印象一文的寫作手法，下列何者不恰當？
  options:
  - label: A
    content: 本文是一篇藉物抒懷，描述孩子孝順母親的文章
  - label: B
    content: 「這些紙船都是有感情的」是全文轉折處，由玩紙船的回憶轉入對母愛的懷念
  - label: C
    content: 文中運用許多譬喻和排比的手法，使童年玩紙船的描述更加鮮明、生動
  - label: D
    content: 全文脈絡由「物」而「人」而「情」，層次井然。
