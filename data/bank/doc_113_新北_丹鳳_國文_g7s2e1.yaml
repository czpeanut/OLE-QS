- id: doc_113_新北_丹鳳_國文_g7s2e1_s4_28
  section: 4
  number: 28
  type: single
  page: 4
  stem: 根據本文，當人們吃到流動小販所兜售的食物時，為何會覺得特別美味?
  options:
  - label: A
    content: 製作過程經歷多道手續烹調入味
  - label: B
    content: 盛裝食物的器具環保又乾淨
  - label: C
    content: 期待的心理提升味覺感受
  - label: D
    content: 食物採用高級的原料製造。
  group_stem: "題組（三）\n\n有那麼一個時代，街上沒有便利商店，沒有那麼多的餐館，人們不能隨時想吃些什麼，就上街去買。但卻有一些流動的小販，他們會在大城小鎮的某些路段行走，常常在固定的時段到達某個定點，也因此讓人們味覺的滿足多了一些等待的光陰，而也許正因為有所期待，屆時吃到嘴中的東西似乎都變得特別美味了。\n\
    上半天課的小學生涯，整個下午，會有好多不同賣吃的小販經過家門口；整個下午，生活就是一連串的期待，總是一邊寫著家庭作業，一邊側耳傾聽各種小販的叫賣聲。賣麥芽糖的小販，騎著一輛老式的腳踏車，吆喝著：「收破銅爛鐵喲！」要吃麥芽糖，是不必準備錢的，但必須要從家裡翻出一些用過的玻璃瓶、罐頭等等。一個臺鳳罐頭，就可以換一小木串的麥芽糖，如果是個外國酒瓶，還可以換三小木串麥芽糖。\n\
    下午四點，是挑著擔子賣豆花的阿伯出現的時候，他賣的豆花軟滑又有彈性，尤其是一口撲鼻的豆香，只要一開蓋，會四處飄散，讓人聞了馬上餓了起來。當時買豆花的人要從自己家中拿個碗或搪①瓷一杯來，豆花裝在自家的碗杯中，又健康又環保，這麼好的方式，後來卻不知為什麼消失了。\n\
    五點多時，推著醬菜車的老夫婦出現了，車上掛著一串鈴鐺，在黃昏的街道上叮叮噹噹的響起。我們這些小孩最感興趣的是那些染成紅色的豆絲，吃在嘴中甜甜的，央求媽媽買一些，包在一個小紙袋中，當場就可以當成零嘴吃起來。吃過豆絲的嘴邊總是染成紅通通的，被大人笑是猴子的屁股。\n\
    \    這些日日夜夜流動的味道，也許出現在自家門口，也許出現在小鎮的街上，也許在臺北市區的鬧街上，都成了生命中難忘的味道。而這些味道，並不只是食物的味道，還有光陰的味道和人情的味道，最後都成為不可磨滅的童年的味道。\n\
    【注釋】\n① 搪：ㄊㄤˊ，一種工藝品。\n\n              節選自韓良露 <童年流動的味道>"
