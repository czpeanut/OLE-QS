- id: doc_113_台北_仁愛_國文_g7s2e1_s5_34
  section: 5
  number: 34
  type: single
  page: 4
  stem: 本文背景出自〈白蛇傳〉這一則民間故事，話劇社期末公演時想根據本文內容排一齣短劇，請判斷許士林應為下列哪個腳色？
  options:
  - label: A
    content: 青蛇的娘子
  - label: B
    content: 白蛇的犬子
  - label: C
    content: 許仙的內子
  - label: D
    content: 法海的外子。
  group_stem: '西湖上的雨就這樣來了。是不是從一開頭你就知道和父親注定不能天長日久做夫妻呢？茫茫天地，你只死心塌地眷著傘下的那一刹那溫情。一把紫竹為柄的八十四骨的油紙傘下，有人跟人的聚首，傘下有人世的芳馨。千年修持①是一張沒有記憶的空白，而傘下的片刻卻足以傳誦千年。娘，你所以戀眷於那把傘，只是愛與那把傘下的人同行，而你心悅那人，只是因為你愛人世，愛這個溫柔纏綿的人世。

    而人間聚散無常，娘，傘是聚，傘也是散，八十四支骨架，每一支都可能骨肉撕離。娘啊！也許一開頭你就是都知道的，知道又怎樣，上天下地，你都敢去較量，你不知道什麼叫生死。你硬把人間的死亡扭回生命，金山寺一鬥，勝利的究竟是誰呢？法海做了一場靈驗的法事，而你，娘，你傳下了一則喧騰②人口的故事。而終於，娘繞著一湖無情的寒碧，你來到斷橋，斬斷情緣的斷橋。故事從一湖水開始，也向一湖水結束。娘，是再也回不去了。在斷橋，一場驚天動地的嬰啼，我們在彼此的眼淚中相逢，然後，分離。

    （張曉風〈許士林的獨白〉）

    【注釋】①修持：修行。②喧騰：比喻聲名廣播。'
  tags:
    textbook: 第二冊（七下）第1次段考範圍
    labeled_by: ai
