    labeled_by: ai
- id: doc_113_台北_仁愛_國文_g7s2e1_s4_9
  section: 4
  number: 9
  type: single
  page: 1
  stem: 關於〈早發白帝城〉與〈聞官軍收河南河北〉兩詩的敘述，下列何者正確？
  options:
  - label: A
    content: 兩首詩皆為「平起式平聲韻」的近體詩，首句都不押韻，兩詩字數相加(不含題目)總合為84 字
  - label: B
    content: 兩首詩皆以誇飾手法表達返鄉心情，並運用視覺、聽覺、嗅覺等多種摹寫技巧來描繪歸途景色
  - label: C
    content: 兩詩的作者不論是採用實際或想像的筆法，都寫出船隻行動的迅捷，藉以呈現自己當時的愉快心情
  - label: D
    content: 前者李白聽「兩岸猿聲」有感自身遭遇而落淚，後者「涕淚滿衣裳」是杜甫飽經流離苦難的辛酸之淚。
  lesson_raw:
    title: 近體詩選
    basis: 題幹提及〈早發白帝城〉與〈聞官軍收河南河北〉
  tags:
    textbook: 第二冊 近體詩選
    labeled_by: ai
- id: doc_113_台北_仁愛_國文_g7s2e1_s4_10
  section: 4
  number: 10
  type: single
  page: 1
  stem: 關於〈四種讀書的方法〉，下列解讀何者最符合作者的看法？
  options:
  - label: A
    content: 「若想站得穩、走得快，自然非有精讀的細密工夫不可。」在資訊浪潮快速更迭的時代，精讀可讓人廣泛涉獵各類型新書，正可謂「讀書百遍，其義自見。」
  - label: B
    content: 「真正的念書是重讀。」在不同的時期重讀書籍，因自己的人生歷練不同，對書中所談論的內容或能有不同的領悟與共鳴，更能發掘書中文字意境的深刻與美妙
  - label: C
    content: 「略讀是為了增廣見聞，……訊息隨時代而改變，我們只須保持大概的認識即可。」對於自己本行的專業知識或個人興趣，作者認為聚焦在幾個章節甚至幾個觀念略讀就已足夠
  - label: D
    content: 「至於默讀，是就且讀且思而言，並非只是安靜念書。……宗教聖典、哲理格言、詩詞小品，皆以默讀為宜。」默讀要能深思，邊聆賞音樂，再佐以一杯手搖飲，默讀效率必能大幅提升。
  lesson_raw:
    title: 四種讀書的方法
    basis: 題幹提及〈四種讀書的方法〉
  tags:
    textbook: 第二冊 四種讀書的方法
    labeled_by: ai
- id: doc_113_台北_仁愛_國文_g7s2e1_s4_11
  section: 4
  number: 11
  type: single
  page: 2
  stem: 「外表安靜，內心卻不妨澎湃奔騰、起伏周旋，跟隨作者走一趟心路歷程。」下列何人的閱讀分享與〈四種讀書的方法〉這段文字所描述最相符？
  options:
  - label: A
    content: 柯南：「讀王之渙的哲理詩〈登鸛雀樓〉，不僅可隨之一覽登高遠眺的壯闊景色，亦能感染詩人積極奮起的凌雲壯志。」
  - label: B
    content: 灰原：「讀李時珍的《本草綱目》，瀏覽各種植物殊異的姿態、各味藥材獨特的屬性，有如劉姥姥入大觀園般欣喜莫名。」
  - label: C
    content: 秀一：「此際再讀《三國》，我所關注的竟是連年烽火下人民流離轉徙的悲苦，和昔日純粹著迷於三國群雄已判若雲泥。」
  - label: D
