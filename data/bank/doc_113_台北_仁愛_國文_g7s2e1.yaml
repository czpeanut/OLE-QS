  section: 4
  number: 5
  type: single
  page: 1
  stem: 下列各選項中的文句，何者用字完全正確？
  options:
  - label: A
    content: 你的一席話讓苦惱已久的我感到醍醐灌鼎，頓時豁然開朗
  - label: B
    content: 他為人豪爽經常疏財仗義，有英雄氣慨，家中總是高朋滿座
  - label: C
    content: 史上不知民間疾苦的例子莫過於晉惠帝的「何不食肉糜？」
  - label: D
    content: 人爭一口氣，佛爭一柱香，為了面子，我定要和他周懸到底。
