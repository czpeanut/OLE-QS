  - label: D
    content: 蜀賈三人的結果反映了產品品質並無法決定市場的競爭力，賣家所採取的經商策略才是關鍵。
  group_stem: '蜀賈①三人，皆賣藥於市。其一人專取良，計入以為出，不虛價，亦不過取贏②；一人良不良皆取焉，其價之賤貴，惟買者之欲，而隨以其良不良應之；一人不取良，惟其多，賣則賤其價，請益則益之不較③，於是爭趨之，其門之限④月一易，歲餘而大富。其兼取者趨稍緩，再朞⑤亦富。其專取良者，肆⑥日中如宵，旦食而昏不足。

    (劉基《郁離子》)

    【注釋】①賈：商人。②贏：利潤。③較：計較。④限：門檻。⑤朞：一年。⑥肆：商店。'
