  type: single
  page: 1
  stem: 下列有關〈傘〉這首詩的文意分析，以下選項何者錯誤？
  options:
  - label: A
    content: 「鳥翅初撲／幅幅相連 以蝙蝠弧形的雙翼／連成一個無懈可擊的圓」――生動呈現傘在開啟過程中的不同型態
  - label: B
    content: 「各種顏色的傘是載花的樹／而且能夠行走……」――描寫傘的「動態美感」
  - label: C
    content: 「一傘在握 開闔自如」――寫執傘者的心境，凸顯傘的開闔操之在我
  - label: D
    content: 「亭中藏一個寧靜的我」――暗示作者對外在噪音感到厭煩，想尋找靜謐的空間。
  lesson_raw:
    title: 傘
    basis: 題幹提及〈傘〉
  tags:
    textbook: 第二冊 傘
    labeled_by: ai
