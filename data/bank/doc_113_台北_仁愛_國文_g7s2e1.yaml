- id: doc_113_台北_仁愛_國文_g7s2e1_s4_6
  section: 4
  number: 6
  type: single
  page: 1
  stem: 蓉子在〈傘〉這首詩抒發其「無入而不自得」的生命情懷，下列何者也可看出作者有意在詩中寄託自己的人生態度？
  options:
  - label: A
    content: 虞世南〈蟬〉：「垂緌飲清露，流響出疏桐。居高聲自遠，非是藉秋風。」
  - label: B
    content: 駱賓王〈詠鵝〉：「鵝，鵝，鵝，曲項向天歌。白毛浮綠水，紅掌撥清波。」
  - label: C
    content: 崔顥〈長干曲〉：「君家何處住，妾住在橫塘。停船暫借問，或恐是同鄉。」
  - label: D
    content: 李白〈送友人〉：「浮雲遊子意，落日故人情。揮手自茲去，蕭蕭斑馬鳴。」。
  lesson_raw:
    title: 傘
    basis: 題幹提及蓉子〈傘〉
  tags:
    textbook: 第二冊 傘
    labeled_by: ai
- id: doc_113_台北_仁愛_國文_g7s2e1_s4_7
  section: 4
  number: 7
  type: single
  page: 1
  stem: 關於〈早發白帝城〉一詩的分析，下列敘述何者正確？
  options:
  - label: A
    content: 首句說明作者一早便迫不及待的動身前往白帝城
  - label: B
    content: 次句「千里」與「一日」以空間之遠對比時間之短
  - label: C
    content: 第三句藉由不絕於耳的淒楚猿聲，襯托內心的隱憂
  - label: D
    content: 末句「萬重山」暗指路途遙遠，歸鄉之日遙遙無期。
  lesson_raw:
    title: 早發白帝城
    basis: 題幹提及〈早發白帝城〉
  tags:
    textbook: 第二冊 早發白帝城
    labeled_by: ai
- id: doc_113_台北_仁愛_國文_g7s2e1_s4_8
  section: 4
  number: 8
  type: single
  page: 1
  stem: 關於〈山居秋暝〉一詩的分析，以下選項何者錯誤？
  options:
  - label: A
    content: 首聯開門見山緊扣題目，並點出地點、時間與季節
  - label: B
    content: 頷聯使用動靜相襯手法，勾勒出山林間的人事活動
  - label: C
    content: 頸聯上下兩句皆運用倒裝手法，內容也有因果關係
  - label: D
    content: 尾聯傳達作者不戀棧繁華世俗，追求歸隱生活之志。
  lesson_raw:
    title: 山居秋暝
    basis: 題幹提及〈山居秋暝〉
  tags:
