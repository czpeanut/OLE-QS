  group_stem: 'Dear future self,

    I''m tired of not having money. I hope by the time you read this you''ll have
    won the lottery! Then I can be lazy and sleep in late, travel around the world,
    and do not have to worry about anything!

    Bobby Fisher, 12 years old

    Dear future self,

    My dream is to become a doctor. Maybe in ten years we will be working for Doctors
    Without Borders and saving lives in other countries!

    Jenny Azure, 13 years old

    Dear future self,

    I got some teeth pulled last week and it was terrible. I decided right then and
    there that I would become a dentist so I could make others feel the same horrible
    pain as I did. I wonder how many teeth you''ve already pulled...

    Trista Coughlin, 9 years old

    Dear future self,

    Life is so boring. I have never left this farm, and I am tired of living on it.
    I think the best job for us is to be a backpacker. We could travel around the
    whole world, working in every country and getting a taste of what it''s like before
    moving on. Now that''s my kind of job!

    Mike Hayden, 14 years old


