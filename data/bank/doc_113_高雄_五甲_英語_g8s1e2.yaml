  group_stem: 'Here is an interesting test for you to see what role you are in cartoons
    and movies. Let''s enjoy and find out the fun facts about yourself!


    | | |

    | :--- | :--- |

    | **Do you want to play a main character?** | **yes** → Do people judge you on
    your appearance first? / **no** → Are you happy with your social life? |

    | **Do people judge you on your appearance first?** | **yes** → You''re Shrek.
    You are a positive, responsible person. Other people can understand you more after
    getting along with you. / **no** → Are you happy with your social life? |

    | **Are you happy with your social life?** | **yes** → You''re Donkey. You are
    close to people. You live for every moment but easy to make others angry. / **no**
    → Are you a little naughty? |

    | **Are you a little naughty?** | **yes** → Are you individualistic? / **no**
    → You''re Zazu. Though sometimes you have fights with others, your boss loves
    your abilities. |

    | **Are you individualistic?** | **yes** → You''re Kung Fu Panda. You are naughty,
    but you always work alone without help. / **no** → You''re Penguin. You are energetic
    and always look on the bright side of things. You enjoy teamwork. |


    cartoon 卡通 main character 主角 judge 評斷 appearance 外表 social 社交的

    positive 正向的 responsible 負責的 naughty 頑皮的 ability 能力'
