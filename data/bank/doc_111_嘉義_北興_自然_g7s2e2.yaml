- id: doc_111_嘉義_北興_自然_g7s2e2_s2_31
  section: 2
  number: 31
  type: single
  page: 4
  stem: 下列關於四方竹的敘述何者正確？
  options:
  - label: A
    content: 維管束環狀排列
  - label: B
    content: 不會開花
  - label: C
    content: 根是鬚根系
  - label: D
    content: 利用孢子繁殖。
  group_stem: "(三)、閱讀完文章後，回答第31-35題：\n【奮起湖之旅】\n        首先來到種植四方竹的區域，解說牌上寫著四方竹是禾本科植物，解說老師說，水稻和玉米也是禾本科植物，它們都是單子葉植物。接著一群人走進森林裡，記得要降低音量，聽聽大自然的聲音。步道兩旁是高大的台灣杉和柳杉，這時小明被一顆從柳杉樹上掉落的直徑約2公分球狀物打到頭，同學們都圍過來看且議論紛紛。老師說，柳杉是裸子植物。大家抬頭看樹上時，發現有像鳥巢一樣的植物整叢長在高高的樹上。拿出望遠鏡觀察，可發現葉子背面有孢子囊堆，正是自然課本裡介紹的鳥巢蕨。走著走著有同學注意到在步道的階梯上，長著小小的綠色生物，老師說這是蘚苔植物土馬騌。中午大家在月台上享用奮起湖便當，打開餐盒，裡面有白飯、雞腿、龍鬚菜、海帶，小明把龍鬚菜的葉子攤平，看的出來是網狀脈，跟剛剛回程的路上在一戶住家菜園看到的佛手瓜的葉子一樣。而龍鬚菜就是佛手瓜的嫩芽。"
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 生物
      code: 3-4
      title: 植物界
      chapter: 第3章 生物的演化與分類
    textbook: 七下生物 3-4 植物界
    labeled_by: ai
