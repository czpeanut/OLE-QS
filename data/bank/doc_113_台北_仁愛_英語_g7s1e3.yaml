    What is it like on the moon? Well, here are some fun facts.

    There is no air or water on the moon. You have to take

    your own oxygen and water with you. And because there is no

    air, it is silent on the moon. Sounds cannot be carried from

    place to place.

    The temperature can go down to -173°C at night, and can

    rise up to 127°C during the day. But you don’t need a raincoat

