- id: doc_113_台北_仁愛_英語_g7s1e3_s4_51
  section: 4
  number: 51
  type: single
  page: 3
  stem: What are the most important (最重要的) things to take during the travel to the
    moon?
  options:
  - label: A
    content: Water and oxygen.
  - label: B
    content: Food and drinks.
  - label: C
    content: Raincoats and umbrellas.
  - label: D
    content: Warm clothes and calendars.
  group_stem: 'II. 51~53 題

    Do you want to travel to the moon? A lot of people do.

    What is it like on the moon? Well, here are some fun facts.

    There is no air or water on the moon. You have to take

    your own oxygen and water with you. And because there is no

    air, it is silent on the moon. Sounds cannot be carried from

    place to place.

    The temperature can go down to -173°C at night, and can

    rise up to 127°C during the day. But you don’t need a raincoat

    on the moon because there is no rain at all. The weather on

    the moon does not change.

    What about a little moon walk? Well, you will feel very

    light on your feet. Let’s say, you weigh 60kg on Earth, but you

    weigh only about 10kg on the moon. So, your walk may end

    up like jumping!

    “What day is it?” When on the moon, you may have

    problem thinking about it because one day there is about 29.5

    days long on Earth. That’s also why, from Earth, we can only

    see the same side of the moon all the time.


    📖 oxygen 氧氣   because 因為   be carried 被傳遞

    temperature 溫度   raincoat 雨衣   weigh 重    may 可能'
