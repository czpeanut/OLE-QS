    小明和小勝一起去參觀數學好好玩的展覽，在世界的數學館中，介紹了印度的 $19\times 19$ 乘法表，其中 $11\sim 19$ 乘法表的計算法如圖所示。


    請根據上述資訊回答下列問題，完整寫出你的解題過程並詳細解釋：

    (１)請依上述步驟計算 $15\times 12$ 的值。(15 是被乘數，12 是乘數)

    (２)請以 $28\times 23$ 為例，判斷當相乘的兩數的十位數字皆為 2 時，是否可以依上述步驟計算？若可以，請以乘法對加法的分配律展開 $28\times
    23=(20+8)\times (20+3)$ 來說明理由；若不可以，請說明上述步驟的方法哪裡錯誤？'
