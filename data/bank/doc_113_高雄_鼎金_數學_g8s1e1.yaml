- id: doc_113_高雄_鼎金_數學_g8s1e1_s2_1
  section: 2
  number: 1
  type: calc
  page: 3
  stem: '【非選擇題第一題】

    ※請注意：只有答案，不予計分！

    體感溫度（apparent temperature）係指人體所感受到的冷暖程度，轉換成同等之溫度，會受到氣溫、風速與相對溼度的綜合影響。而氣溫垂直遞減率（Lapse
    rate of temperature）是氣溫隨著高度上升而遞減的幅度，在對流層中，平均每上升 100 公尺，氣溫約下降 0.6 ℃。已知體感溫度（℃）＝當地氣溫（℃）$-2\times
    \sqrt{\text{風速（公尺／秒）}}$，例如：若當地氣溫 37℃，目前風速 4 公尺／秒，則當地體感溫度 $=37-2\times \sqrt{4}=37-2\times
    2=33$ ℃。


    請根據上述資訊回答下列問題，完整寫出你的解題過程並詳細解釋：

    (１)某日小明從氣溫 33 ℃的平地攀登玉山，已知玉山的高度約為 4000 公尺，當小明登頂後，此時山頂的氣溫約為多少 ℃？

    (２)承(１)，小明登頂後，拿出風速器測得當時的風速為 24 公尺／秒，則此時他的體感溫度約為多少℃？（$\sqrt{12}\fallingdotseq 3.464$，$\sqrt{24}\fallingdotseq
    4.899$，以四捨五入法求到小數點後第一位）'
