  - label: B
    content: 海巡單位可以對貓執行安樂死，是因為具備人民賦予政府的公權力
  - label: C
    content: 《走私沒入動物及其產品處理作業程序》的法律位階與《地方稅法通則》相同
  - label: D
    content: 《走私沒入動物及其產品處理作業程序》是由立法院制定，總統公布後執行的法規。
