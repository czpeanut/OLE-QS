  group_stem: "跨科整合題組\n東西往来要道--河西走廊\n    附圖 1 的河西走廊位處黃河河套平原西方，是夾在內蒙古高原與祁連山中間的狹長地塹，呈現西北-一東南走向，是中原通往西域的必經之路，自古就是東西往來的通道。此區乾燥少雨，年溫差、日溫差均大，祁連山山麓夏季可藉由融雪進行綠洲農業，發展出今日的武威、張掖、酒泉、敦煌等城。\n\
    \    河西走廊的歷史可追溯至先秦時期,最初為月氏族領地，以游牧維生的月氏族在西元前 2 世紀遭匈奴擊敗，月氏部落西遷往新疆伊犁一帶，稱大月氏，此地成為匈奴領土；日後此地部分匈奴部眾投降漢朝，陸續在此地建立酒泉、張掖、敦煌、武威四郡。其中敦煌之名，因為此地位置處中原和西域之間，取「敦為大，煌為盛」的寓意，也蘊含漢朝宣揚國威之意，漢在此駐軍並移民屯墾，強化在此地的控制力，以削弱匈奴的影響力。河西走廊大致與附圖中的部分古絲路陸線相似。\n\
    \    2013 年 9 月和 10 月，中國領導人習近平分別提出一帶一路「絲綢之路經濟帶」(「一帶」)和「21 世紀海上絲綢之路」(「一路」)的經濟合作概念（附圖\
    \ 2）。目前已有 60 個國家和國際組織響應「一帶一路」，這些國家的總人口約 44 億，經濟總量約 21 萬億美元，分别占全世界的 63%和 29%。"
