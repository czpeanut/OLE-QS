    侯景本為東魏叛將，被南朝梁武帝蕭衍所收留。侯景初入南朝梁時，欲求婚於王、謝名門，請梁武帝做媒，梁武帝嫌其家世不夠而予以拒絕，侯景因而心懷怨念。又因對梁朝與東魏通好疑感不安，主於西元
    548 年以清君側為由在壽陽（今安徽壽縣）起兵叛亂，隔年攻占梁朝都城，將梁武帝活活餓死，掌控梁朝軍政大權。此時梁朝諸王反而自相殘殺，在侯景與梁朝軍官的雙重燒殺搶掠之下，再加上饑荒、瘟疫，江南百姓流離失所，社會經濟遭到毀減性的破壞，因而加速南朝世族的衰亡。'
