  stem: '公民

    8 年丙班同學上完公民課之後，討論起國家的組成要素。請問：誰的說法是正確的？'
  options:
  - label: A
    content: 梓鳶：領海是指海岸基線向外延伸 200 浬的海域
  - label: B
    content: 政祺：主權是國家最高權力，是領導者所賦予的
  - label: C
    content: 隕擇：政府的更迭，不會影響到國家主權的變化
  - label: D
    content: 卉棠：國家是指一群人在固定的領土內，組織政黨，行使主權，在國際上享有獨立地位的政治性團體。
