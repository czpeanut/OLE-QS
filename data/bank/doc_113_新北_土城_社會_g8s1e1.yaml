  page: 1
  stem: 嘉鞍在上國文課時，發現張釋之執法的課文中，其中有一段張釋之的發言：「廷尉，天下之平也，一傾而天下用法皆為輕重，民安所錯其手足？」（註釋：廷尉是天下執行法律的標準，一有偏差，天下執法的官員就會因此或輕或重，這樣執法不公，要人民如何做才好？）而聯想到公民課學到的課程內容。請問：張釋之的想法較符合下列何者？
