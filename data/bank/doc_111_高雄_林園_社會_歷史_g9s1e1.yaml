  section: 1
  number: 31
  type: single
  page: 2
  stem: 根據上述資訊，請你判斷以下的說法何者正確？
  options:
  - label: A
    content: 法典主張傷人者只需付錢賠償
  - label: B
    content: 法典中不承認女性的法律地位
  - label: C
    content: 法典主張法律之前，人人平等
  - label: D
    content: 法典蘊含以牙還牙的報復原則
  group_stem: '＊阿國國閱讀《美索不達米亞》一書，看到西亞地區刻在玄武岩上一部法典，是目前找到最古老的成文法典。以下法典的部分內容翻譯：

    (一)如果一個人毀了一個貴族的眼，他的眼也必須被打瞎。

    (二)如果他打斷了同等身分人的骨頭，他的骨頭也應被打斷。

    (三)如果他打瞎一個平民的眼，或打斷骨頭，他應付銀子。

    (四)如果他打瞎一個奴隸的眼，或打斷骨頭，他應付奴隸身價的半數。

    (五)如果妻子受丈夫百般虐待，妻子有取回全部嫁妝而回娘家的權利。

    請根據上文回答31~32題：'
  answer:
  - D
