- id: doc_113_台中_五權_社會_公民_g8s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 阿隆認為自己當時支持的市長，違背了競選時所提出的政見，於是發動連署提案罷免該位市長。請問：上述阿隆行使的基本權利類型與下列何者行為相同？
  options:
  - label: A
    content: 報考國家考試擔任公務員
  - label: B
    content: 參加政府舉辦的公聽會
  - label: C
    content: 依照個人需求搬家
  - label: D
    content: 根據個人政治理念參加政黨。
- id: doc_113_台中_五權_社會_公民_g8s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 我國憲政制度有設計一套不信任案的機制，期能發揮分權制衡的效果。關於該制度的敘述，下列何者正確？
  options:
  - label: A
    content: 為考試院對監察院的制衡關係
  - label: B
    content: 立法院與行政院長皆可提出
  - label: C
    content: 為人民對行政院施政滿意度之公投
  - label: D
    content: 該案若通過，總統得經行政院長呈請後解散立法院
- id: doc_113_台中_五權_社會_公民_g8s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 在民主國家的政治運作過程中，如果國家遇到重大緊急危難的事件，(甲)可以宣布緊急命令，但是要經過(乙)的決議，並且在10日內請(丙)追認。請問以上(甲)(乙)(丙)分別依序填入？
  options:
  - label: A
    content: 總統，行政院長，立法院
  - label: B
    content: 行政院長，立法院會，監察院
  - label: C
    content: 總統，行政院會議，立法院
  - label: D
    content: 總統，立法院會，行政院會議。
- id: doc_113_台中_五權_社會_公民_g8s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 阿漢用 Youtube 觀看立法院議事直播，請問：下列何項議事不可能出現在直播當中？
  options:
  - label: A
    content: 提出正副總統罷免案
  - label: B
    content: 修改《刑法》酒駕刑度
  - label: C
    content: 提出違法官員糾舉案
  - label: D
    content: 質詢經濟及科技部長。
- id: doc_113_台中_五權_社會_公民_g8s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 台灣今年出現首宗氣候憲法訴訟，在氣候變遷加劇下，海洋資源枯竭，影響漁民生活；台灣年均溫上升，農民於第一線承受環境變化；極端氣候造成的天災，使得山區的原住民族隨時處在風險中。於是農漁民和原住民族攜手環保團體提起憲法訴訟，要求政府提出更具體、積極的方式，以保障人民基本權利。根據上述內容的報導,是要重視人民的何種權利?
  options:
  - label: A
    content: 多元文化權
  - label: B
    content: 環境權
  - label: C
    content: 自由權
  - label: D
    content: 請願權。
- id: doc_113_台中_五權_社會_公民_g8s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 司法院7 位大法官任期於今年10 月31 日屆滿，為使大法官任期銜接，總統賴清德日前提名包含正、副院長在內的7 位大法官人選，咨請立法院同意。下列何者並非大法官的職權？
  options:
  - label: A
    content: 組憲法法庭審理正副總統彈劾案件
  - label: B
    content: 統一解釋法律或命令是否違憲
  - label: C
    content: 審理政黨違憲解散案件
  - label: D
    content: 依法懲戒違法失職的公務人員。
- id: doc_113_台中_五權_社會_公民_g8s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: '育嫻整理了我國五院院長的產生方式，其中敘述正確的有哪些？


    | 甲 | 行政院院長 | 全國公民直接選舉 |

    | --- | --- | --- |

    | 乙 | 立法院院長 | 立法委員互相選舉 |

    | 丙 | 司法院院長 | 總統直接任命 |

    | 丁 | 考試院院長 | 由總統提名，經行政院同意後，由總統任命 |

    | 戊 | 監察院院長 | 由總統提名，經立法院同意後，由總統任命 |'
  options:
  - label: A
    content: 乙戊
  - label: B
    content: 甲丁
  - label: C
    content: 丙戊
  - label: D
    content: 乙丁。
- id: doc_113_台中_五權_社會_公民_g8s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 「一人得道，雞犬升天。」這句俗話是指：在過去，比喻一個人做官得勢，和他有關係的人也跟著沾光，甚至發展出裙帶關係，任人唯親、私相授受，一同進到政府機關擔任一官半職。請問我國中央政府為了避免這樣的陋習採取何種作法加以因應？
  options:
  - label: A
    content: 將行政權從監察權獨立出來
  - label: B
    content: 將立法權從考試權獨立出來
  - label: C
    content: 將考試權從行政權獨立出來
  - label: D
    content: 從監察權從立法權獨立出來
- id: doc_113_台中_五權_社會_公民_g8s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 我國中央政府的互動關係，其中一個是覆議制度。下列 有關覆議制度的流程，請排出正確的順序？ 甲、立法委員投票決定維持或否決原決議 乙、經總統核可移請立法院覆議
    丙、行政院認為窒礙難行 丁、立法院決議
  options:
  - label: A
    content: 乙甲丁丙
  - label: B
    content: 甲乙丙丁
  - label: C
    content: 丁乙甲丙
  - label: D
    content: 丁丙乙甲
- id: doc_113_台中_五權_社會_公民_g8s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 下列有關立法院各項提案權及決議方式的敘述，何者有誤？
  options:
  - label: A
    content: 提出正副總統彈劾案，送交司法院懲戒法院審理
  - label: B
