  - label: D
    content: 提出正副總統罷免案，交付選舉人投票複決
- id: doc_113_台中_五權_社會_公民_g8s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 新北市清水派出所劉姓所長執勤時遭女毒嫌開車衝撞身亡，留下妻子與2 名幼子。新北市警局表示，將爭取最優渥因公撫卹金，若審核通過最高可領新台幣4035
    萬元。請問：有關撫卹工作，是下列何者政府機關的職務？
  options:
  - label: A
    content: 監察院審計部
  - label: B
    content: 考試院銓敘部
  - label: C
    content: 行政院財政部
  - label: D
    content: 行政院內政部。
- id: doc_113_台中_五權_社會_公民_g8s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 某機關提醒考生：「依刑法第１３７條規定，若應考人在公務人員考試時舞弊，不僅五年內不得再應考，最重還可能被處一年有期徒刑，希望應考人不要以身試法。」下列有關上述的提醒說明，何者錯誤？
  options:
  - label: A
    content: 舞弊考生處以一年有期徒刑，須經由懲戒法院審判確定
  - label: B
    content: 某機關為考試院考選部
  - label: C
    content: 被處一年有期徒刑，將限制考生的人身自由
  - label: D
    content: 五年內不得再應考，可能限制該考生的參政權
