- id: doc_113_台中_五權_社會_公民_g8s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 憲法又被稱為「人民權利的保障書」，請問下列人民的基本權利，何者對應錯誤？
  options:
  - label: A
    content: 捷運廣播系統播報到站語言包含國語、英語、閩南語、客家語、原住民語：自由權
  - label: B
    content: 立委提案希望將公民權從20 歲下修至18 歲：參政權
  - label: C
    content: 身心障礙學生參加國中教育會考，可以申請特殊考場：平等權
  - label: D
    content: 於國民教育階段推行雙語政策以期達成雙語國家：受益權。
- id: doc_113_台中_五權_社會_公民_g8s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 有關上述▲▲、■■、●●依序應填入?
  options:
  - label: A
    content: 彈劾、糾舉、糾正
  - label: B
    content: 糾舉、糾正、彈劾
  - label: C
    content: 糾正、彈劾、糾舉
  - label: D
    content: 彈劾、糾正、倒閣
  group_stem: '➢ 經濟部能源署組長林某涉嫌光電弊案，今年4 月底遭台南地檢署起訴，監察委員認為，雖該署已將其職務調整為專門委員，但仍有接觸光電業務之可能，為確保行政機關之公正、中立、客觀形象，有急速處分予以調離現職之必要，監察院也通過林某▲▲案，全案移送經濟部長依法處理。

    ➢ 衛福部先前公布二○二三年醫學中心評鑑結果，台北區醫學中心家數由八家增為十家，引發爭議。監察院表示，衛福部未依正常作業程序規定，逕自增額評定為十家，傷害醫院評鑑公信力，監察院會已通過對衛福部的■■案。

    ➢ 監察院指出，陸軍金門防衛指揮部前參謀長林姓少將涉侵占公用暨公有財物、挪用單位經費物品、浮報帳目及公器私用，違失事證明確，情節重大，嚴重敗壞法紀及損害政府廉潔形象，監察院通過監委蔡崇義、賴振昌、林文程提案●●林姓少將彈劾並移送懲戒法院審理。'
