  section: 2
  number: 40
  type: single
  page: 4
  stem: 根據本文，下列何者點出武俠電影中的矛盾點？
  options:
  - label: A
    content: 超級劇毒、解藥、暗器都產自西域
  - label: B
    content: 長著超長白髮和鬍子的絕對是曠世高人，要與他拉好關係
  - label: C
    content: 英雄總會配一把好兵器，好到從來不用保養修理
  - label: D
    content: 高手都無視萬有引力，到處飛且飛得超快。不過要是趕遠路，卻會騎馬。
  group_stem: '１．悅來客棧是古代最大的連鎖客棧。

    ２．超級劇毒、解藥、暗器都產自西域。

    ３．平時朝夕相處的人，只要穿上夜行衣，再蒙個面紗，對方就不認識了。

    ４．不起眼的小角色，使用的武功名稱有很強的文學性和動物性，就是用起來總不大靈光。

    ５．長著超長白髮和鬍子的絕對是曠世高人，要與他拉好關係。

    ６．英雄總會配一把好兵器，好到從來不用保養修理。

    ７．在亂箭中，英雄要是不想死，就絕不會死；萬一中了箭，那也是因為一旁有大惡人挾持其親人導致英雄分心。

    ８．一定要象徵性的打幾下才出絕招，並噴著口水大叫：去死吧！

    ９．使出必殺技法之前一定要做很花的動作，還要做上一兩分鐘，而敵方絕不會乘機偷襲，儘管這是個好機會……

    １０．高手都無視萬有引力，到處飛且飛得超快。不過要是趕遠路，卻會騎馬。

    １１．大俠套餐：二斤熟牛肉加上等女兒紅（悅來客棧長期供應）。

    １２．好人從不下毒，壞人從來都下毒；但好人從不下毒卻老被誣陷下毒，壞人從來都下毒卻沒人懷疑他。

    １３．在一條筆直的街道被人追殺，儘管有很多事要做，但弄翻兩旁的小攤是最重要的。

