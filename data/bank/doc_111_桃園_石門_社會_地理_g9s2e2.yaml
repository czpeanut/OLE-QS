- id: doc_111_桃園_石門_社會_地理_g9s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: "閱讀下列新聞，請問：台灣屬於缺水國家的原因，不包括下列哪個選項?\n\n驚！台灣其實很缺水 全球排名第18 位缺水國家\n2020-10-30 經濟日報\n\
    \ 針對水情，經濟部水利署今日表示，根據ESI（Environment Sustainable Index）評比，台灣為全球146 個國家中第18 位缺水國家，台灣水資源問題的挑戰，如同撒哈拉地區的國家一樣險峻。\n\
    \ 台灣每人每年能分配降雨量4,000 噸，不到世界平均值的五分之一。今年迄今無颱風侵台，更是1964 年以來第一次發生，6 月迄今主要水庫集水區降雨僅約歷年平均值2\
    \ 至6 成，是造成今年下半年旱象主要原因。"
  options:
  - label: A
    content: 氣候：降水集中不平均，有乾季
  - label: B
    content: 地形：坡陡流急，水很快就流入大海了
  - label: C
    content: 人口：人口密度大，用水量多
  - label: D
    content: 氣候：台灣年降水量低於世界平均。
