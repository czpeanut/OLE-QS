    | 丙 | $30^\circ$ | $19^\circ$ | 1.53 | 1.52 |

    | 丙 | $40^\circ$ | $25^\circ$ | 1.52 | 1.52 |

    | 丁 | $20^\circ$ | $12^\circ$ | 1.64 | 1.63 |

