  stem: 關於國兒的實驗推論，下列何者最合理？
  options:
  - label: A
    content: 同一杯溶液的入射角越大，折射角越小
  - label: B
    content: 若以相同角度入射，光在濃度越大的糖水中的折射角越大
  - label: C
    content: 光在濃度越大的糖水中越不容易偏離原來的行進方向
  - label: D
    content: 光在濃度越大的糖水中光速越慢。
  group_stem: '38~40題為題組

    國兒和中兒學完濃度和光的折射概念，想要研究兩者是否有相關性，上網搜尋資料後，發現有一款糖度計是以折射率的概念測量糖電的多寡。國兒想研究水溶液的糖量與折射的關係，中兒想要研究此糖度計糖量與糖度的關係，所以他們調配以下五杯水溶液進行實驗，並比較糖量、糖度和折射率的關係。

    甲杯：$100\text{g}$ 水

    乙杯：$100\text{g}$ 水 $+ 10\text{g}$ 白糖

    丙杯：$100\text{g}$ 水 $+ 20\text{g}$ 白糖

    丁杯：$100\text{g}$ 水 $+ 30\text{g}$ 白糖

    戊杯：$100\text{g}$ 水 $+ 40\text{g}$ 白糖


    【國兒的實驗結果，並利用網路查的公式，算出折射率】

    | 水溶液 | 入射角 | 折射角 | 折射率 | 平均折射率 |

    | :---: | :---: | :---: | :---: | :---: |

