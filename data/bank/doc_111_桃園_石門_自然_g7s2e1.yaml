  - label: C
    content: 愛滋病
  - label: D
    content: 地中海型貧血。
  group_stem: '(二) 閱讀文章，並回答下列問題：

    近年來由於生物科技的進步，科學家已發展出「基因治療法」，可以治療一些遺傳性或非遺傳性的疾病。基因治療法是將病人壞掉的基因，換上好的基因，以恢復基因功能。此種治療方式在目前仍屬於臨床實驗階段，尚未大規模正式使用。一般會使用病毒當「載體」，將正常基因準確地嵌入病毒內，再利用病毒感染細胞，此時病毒所攜帶的基因就會進入細胞中發揮功能，取代已經壞掉的基因。當然這些病毒都是經過特別處理，不會導致生病。基因治療法的實驗對象以癌症病人最多，大約占一半以上。原本大家對於基因治療法抱以相當高的期待，但從一九九○年開始的臨床實驗，成效似乎沒有預期中的好，這讓許多的科學家感到失望。也許人類仍需加強基礎科學的研究，畢竟基因是無法用眼睛看到的，所以實驗上還有許多盲點。'
