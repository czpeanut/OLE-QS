  group_stem: '(三) 閱讀文章，並回答下列問題：

    花生屬於豆科草本植物，莖直立，蝶形花呈橘黃色，原產於南美洲，從熱蘭遮城日誌可知，荷蘭在臺時期臺南一帶已有栽培花生。花生屬於地上開花、地下結果的作物，但是花生既然是地上開花，那是如何到地下結果的呢？花生的花開於枝條上，而花朵授粉凋謝後，完成受精的子房基部會伸長成為「果針」，具向地性的果針會在兩至三天的生長後鑽入土中，入土一定深度的子房會在適宜的環境下發育成果實。花生的果實屬於莢果，果殼內的種子通稱為花生米或花生仁，即我們所食用的花生。花生富含營養，有豐富的脂肪和蛋白質，並含有維生素B1、B2
    等多種維生素，還含有人體的必需胺基酸，有促進腦部細胞發育、強化記憶的功能，因此花生的營養價值高，可媲美雞蛋、牛奶和肉類等動物性食材。'
