- id: doc_111_桃園_石門_自然_g7s2e1_s3_48
  section: 3
  number: 48
  type: single
  page: 4
  stem: 愛麗絲公主的性染色體表示方式應為下列何者？
  options:
  - label: A
    content: $X^{H}X^{H}$
  - label: B
    content: $X^{H}X^{h}$
  - label: C
    content: $X^{h}X^{h}$
  - label: D
    content: $X^{h}Y$。
  group_stem: '(四) 閱讀文章，並回答下列問題：

    血友病是一種遺傳性的血液疾病，健康人的體內有一種幫助血液凝固的凝血蛋白，該蛋白質可以在受傷後幫助血液凝固。而血友病患幾乎沒有凝血蛋白，其原因是單基因突變所造成。與血友病有關的基因位於性染色體中的X
    染色體上。因為男性只有一條X 染色體，所以只要該等位基因不正常，就會患病。而女性因為有兩條X 染色體，加上血友病為隱性等位基因(h)，故要兩條染色體都帶有隱性等位基因才能引起疾病（表1）。如果女性體中只有一條帶有致病的等位基因，則稱為帶因者（carrier），本身雖然不生病，但卻可能將此致病基因傳遞給孩子。

    例如英國的維多利亞女王（Queen Victoria），因為自然突變而成為血友病的帶因者。她將此致病因子傳遞給了其中3 位孩子：兒子利奧波德在成年後，因意外受傷後血流不止而去世；女兒愛麗絲和彼阿特麗斯則如同母親成為血友病的帶因者，繼續將致病的$X^{h}$
    染色體分別傳進了西班牙和俄羅斯沙皇的歐洲皇室中，也因為如此，血友病在歐洲皇家中廣為流傳，故也被稱為「皇家疾病（Royal disease）」。


    表1 血友病的遺傳($X^{h}$ 表示帶有血友病隱性等位基因的X 染色體)

    | 性別 | 狀況 | 性染色體 |

    | :--- | :--- | :--- |

    | 男 | 健康 | $X^{H}Y$ |

    | | 血友病患者 | $X^{h}Y$ |

    | 女 | 健康 | $X^{H}X^{H}$ |

    | | 血友病帶因者 | $X^{H}X^{h}$ |

    | | 血友病患者 | $X^{h}X^{h}$ |'
