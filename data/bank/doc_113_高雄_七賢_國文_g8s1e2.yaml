  options:
  - label: A
    content: 年輕人與長者一同至健身房運動，是美國高齡者擺脫年齡歧視的重要方法之一
  - label: B
    content: 從生物學的角度讓學子知道老人癡呆與年齡的必然關係，逐漸消弭歧視
  - label: C
