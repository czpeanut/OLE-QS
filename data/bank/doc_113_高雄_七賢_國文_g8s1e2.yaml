- id: doc_113_高雄_七賢_國文_g8s1e2_s5_26
  section: 5
  number: 26
  type: single
  page: 4
  stem: 下列何者為「見巢墜於地……則某氏僮奴取以去」的原因？
  options:
  - label: A
    content: 巢大如盞，精密完固，細草盤結而成
  - label: B
    content: 小不能盈掬，色明潔，娟皎可愛
  - label: C
    content: 去地不五、六尺，人手能及之
  - label: D
    content: 主人戲以手撼其巢，則下瞰而鳴，小撼之則小鳴，大撼之則大鳴。
  group_stem: "余讀書之室，其旁有桂一株焉。桂之上，日有聲啁啾者，即而視之，則二鳥巢於枝幹之間，去地不五、六尺，人手能及之。巢大如盞，精密完固，細草盤結而成。鳥雌一雄一，小不能盈掬①，色明潔，娟皎可愛，不知其何鳥也。\n\
    \    雛且出矣，雌者翼覆之，雄者往取食。每得食，輒息於屋上，不即下。主人戲以手撼其巢，則下瞰而鳴，小撼之則小鳴，大撼之則大鳴。手下，鳴乃已。他日，余從外來，見巢墜於地，覓二鳥及鷇②，無有。問之，則某氏僮奴取以去。\n\
    \    嗟呼！以此鳥之羽毛潔且音鳴好也。奚③不深山之適④茂林之棲，乃託身非所，見⑤辱於人奴以死。彼其以為世路為甚寬也哉。\n【注釋】①不能盈掬：無法握滿。②鷇：音ㄎㄡˋ，初生小鳥。③奚：為何，表示疑問語氣。④適：往、至。⑤見：被。"
  tags:
    textbook: 八上 第六課 鳥
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
      code: 第六課
      title: 鳥
      chapter: null
