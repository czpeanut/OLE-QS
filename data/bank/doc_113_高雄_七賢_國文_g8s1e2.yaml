- id: doc_113_高雄_七賢_國文_g8s1e2_s5_34
  section: 5
  number: 34
  type: single
  page: 5
  stem: 關於文中的寶兒，下列敘述何者正確？
  options:
  - label: A
    content: 不願收書，只接受寄售與新書
  - label: B
    content: 出不了書，就只好開書店
  - label: C
    content: 一開始不了解書店的經營，只是嚮往圓夢
  - label: D
    content: 堅信二手書店不會從世界上滅絕。
  group_stem: "聊起永樂座的緣起，寶兒坦承回答，最初是嚮往有河Book 的主人686與隱匿，感覺他們堅守一間書店的風骨讓人欽羨，加上自己是一個起步很晚的寫作者，才華上無法與駱以軍和陳雪等作家相比，因此決定開一間書店圓夢（說歸這麼說，寶兒也出了好幾本書）。「剛開始我想得很單純，就是開二手書店，因為二手書店的利潤比較高嘛。」她堅信如果有一天書店這個行業要滅絕了，二手書店一定是最晚從世界上消失的。\n\
    \    然而公關公司出身的她，缺乏書業方面的經營知識，也無法走販售古本、珍本的路線，因此很快發現原來「收書」沒有想像中那麼容易。如何突破收書這個門檻？寶兒笑說，就是因為比不過別人，所以永樂座打從一開始就接受「寄售」與「新書」，並承接一些社運活動，自然的與其他的二手書店做出區隔。\n\
    如今的永樂座，新書櫃位大約占了整間店面的四分之一，更有數不清的新書活動在此舉辦。別人的複合書店或許是音樂CD 與文創商品和其他服務兼具，永樂座的複合性卻大多數以書為主，成為了永樂座的特色。\n\
    \    不可避免的，永樂座當然也有販售少數的音樂CD 與卡片、明信片、自製產品等文創商品，亦提供幾項常見的飲料。採訪的當下我點了拿鐵振奮下午的精神，正貪婪啜飲的同時，卻聽見寶兒說：「但這些東西的營收加起來沒有超過總營業額的10％。」也就是說，書籍收入占了全店的90％！對於消費時代下必須走向多元化才得以生存的獨立書店來說，這就像拿到白金獎盃一樣困難。（陳怡慈\
    \ 永樂座書店：我想經營一個「人與書相遇的空間」）"
