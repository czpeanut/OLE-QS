  stem: 相赫同學發現五柳先生傳的講義上中出現錯字：「還堵蕭然」的「還」字應更正為「環」。此種情況屬於「音同形近」的錯誤，下列選項中何者與此情況相同？
  options:
  - label: A
    content: 大野中，孤伶伶的一個人，不由膽魄魂奪
  - label: B
