- id: doc_113_高雄_七賢_國文_g8s1e2_s5_31
  section: 5
  number: 31
  type: single
  page: 5
  stem: 根據本文內容，下列何者屬於對高齡者的「年齡歧視」？
  options:
  - label: A
    content: 速食餐廳請白髮蒼蒼的爺爺自行至櫃台取餐
  - label: B
    content: 姊姊跟著朋友一起親暱地稱呼祖母為「奶奶」
  - label: C
    content: 健身房只接受50歲以下的會員註冊入籍
  - label: D
    content: 奶奶使用銀髮優惠搭乘大眾運輸工具。
  group_stem: "隨著全球人口高齡化，人們對於高齡者的權利也越來越重視，近年來「年齡歧視」(ageism)的議題也日益受到重視。不過年齡歧視這件事情其實也包含兩個不同的面相：第一個面向就是對於年齡已經到了某個年紀的人的歧視。例如：在徵才廣告上，如果有註記「年齡55歲以下才可應徵」，就屬於此範疇。第二個面向則是對於描述高齡者的語彙使用，是否有一些歧視的字詞出現，例如：稱呼一位75歲的男性為「老先生」。\n\
    \    根據美國 康乃爾大學及加拿大 多倫多大學的研究，發現以下兩種消弭年齡歧視的方法：\n一、老年相關教育不可少\n    透過課堂上的教育，以生物學的角度告訴學子們老化的過程，並幫助學生破除「老了會癡呆且長住療養院」的刻板印象。台灣其實有許多活得閃閃發亮的老年人，像是在2010年登上時代雜誌「時代百大人物」的台灣慈善家陳樹菊。她出生於1951年，一直以來以賣菜收入做公益，捐錢興建圖書館與貧困癌友的關懷基金，累積金額皆超過千萬元。\n\
    二、推廣世代交流活動\n    有些年輕人對老人的認識可能來自家中垂垂老矣的長輩，不是臥病在床，就是窩在沙發看電視。其實長輩們對生命的見解可說是珍貴的寶藏，畢竟他們人生閱歷豐富，故對於事物的看法往往成熟圓融且充滿智慧。在北美，研究人員建議醫學院學生可以跟長輩上美術館，討論美學與藝術的流派。大學生與長輩也能當網友，用電子郵件來聊聊人生大哉問或是職場上的疑惑。而台灣也有「青銀共居」的實驗計畫，即老人與年輕人當室友，一起生活、互相扶持。"
  tags:
    textbook: 第三冊（八上）第2次段考範圍
    labeled_by: ai
    chapter:
      publisher: null
      book: 八上
      subject: 國文
      code: null
      title: null
      chapter: null
- id: doc_113_高雄_七賢_國文_g8s1e2_s5_32
  section: 5
  number: 32
  type: single
