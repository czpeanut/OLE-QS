- id: doc_113_高雄_七賢_國文_g8s1e2_s5_29
  section: 5
  number: 29
  type: single
  page: 4
  stem: 根據第一篇文章，下列何者使簽訂AB 約的誘因？
  options:
  - label: A
    content: 方便日後將房屋產權轉賣他人，並從中獲利
  - label: B
    content: 向銀行申請更多貸款，並提高實價登錄行情
  - label: C
    content: 可規避房地產相關稅務，減少買方付出金額
  - label: D
    content: 有助於穩定房價，讓更多人有機會買房。
  group_stem: "【一次看懂AB 合約】\n    近期爆發知名網紅與旗下員工的合約糾紛，該員工利用「AB 合約」等不法行為欺騙公司及廠商，獲利高達八位數。什麼是「AB\
    \ 合約」呢？顧名思義，「AB 合約」就是指有兩份合約存在，因此也被稱為「陰陽合約」。\n    「AB 合約」最常出現在房地產買賣中，建商會在交易裡製作兩份不同的合約，一份用來抬高房屋總價並拿來向銀行申請房屋貸款、拉抬實價登錄的假合約；另一份則是真正的交易價格合約，由建商與買方簽訂。假合約通常會以折讓或退款的形式，讓買家達成真正的交易價格，但若東窗事發，則恐吃上官司。\n\
    \    以目前的房屋買賣市場中，「AB 合約」已經演變到只有真實的A 合約，而假的B 合約則成為私底下口承諾，目的在不留下白紙黑字的犯罪證據。但是只有口頭承諾，對於買賣雙方來說更加沒有保障，且一經查獲私下買賣承諾屬實，不論有無紙本合約，同樣屬於違法行為。\n\
    【買賣房屋簽署AB 合約可能造成的風險】\n    一、違反平均地權條例：3~15萬元罰鍰，並得以連續處罰。\n    二、觸犯偽造文書罪：判處5年以下有期徒刑。\n\
    \    三、觸犯詐欺罪：判處1年以上7年以下有期徒刑，得併科100萬元以下罰金。\n    四、觸犯公務員登載不實罪：判處3年以下有期徒刑、拘役或1.5萬元以下罰金。\n\
    \    五、成為銀行拒絕往來戶：要求立刻返還不當得利、要求立刻還清房屋貸款並解除貸款關係。"
  tags:
    textbook: 第三冊（八上）第2次段考範圍
    labeled_by: ai
