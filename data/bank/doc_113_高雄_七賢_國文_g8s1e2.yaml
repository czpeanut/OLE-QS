  stem: '以下為杉林溪知名景點石井磯的介紹告示牌，請依據上文敘述選出錯誤選項：

    杉林溪 石井磯介紹：

    1. 長年受到急流砂石沖刷，因此此處岩石有著凹洞，再經長年沖磨而成為井。

    2. 石井磯共有十多口井，井深五公尺多，井旁光滑不易站立。此處為危險地帶，請勿靠近觀測。'
  options:
  - label: A
    content: 第一點介紹中的「長年受到急流砂石沖刷」為判斷句
  - label: B
    content: 第二點介紹中的「井深五公尺多」為表態句
  - label: C
    content: 第一點介紹未使用判斷句
  - label: D
    content: 第二點介紹中的「石井磯共有十多口井」為有無句。
