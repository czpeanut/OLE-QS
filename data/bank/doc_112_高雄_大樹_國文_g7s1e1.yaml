    content: 夜登「擎天崗」—順著古道登上擎天崗，脫去鞋襪在溫泉池泡腳，洗滌一身的疲憊，再仰躺於草原上享受彷彿觸手可及的星空
  - label: B
    content: 夜宿「海生館」—與白鯨、企鵝及深海魚群同眠，還有機會一睹珊瑚產卵，珊瑚卵飄散海中如點點星光的奇景
