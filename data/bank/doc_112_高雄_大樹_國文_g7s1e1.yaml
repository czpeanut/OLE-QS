- id: doc_112_高雄_大樹_國文_g7s1e1_s4_8
  section: 4
  number: 8
  type: single
  page: 5
  stem: 作者想告訴女兒什麼道理？
  options:
  - label: A
    content: 要有打破砂鍋問到底的求知精神
  - label: B
    content: 懂得做人處世才能寫出好的文章
  - label: C
    content: 給別人留餘地，不要得理不饒人
  - label: D
    content: 從各領域廣博學習，拓展視野。
  group_stem: "第四則：〈談處世．分寸〉（節錄）劉墉（素養題）\n  我女兒說她有個叫艾琳達的同學，暑假去了北京，住在我帶她住過的那家有名的飯店。可是當她提到飯店大廳的水晶球、擺滿瓶瓶罐罐的餐廳和地下室的畫廊時，艾琳達卻答不上來，所以我女兒猜她同學根本是吹年的。\n\
    \  我突然發覺孩子大了，應該學習怎麼處世。課本上雖然說：「世事洞明皆學問」。但是那「洞明」並不是教人把每個真相都挖出來，而且攤在大家眼前。「人情練達即文章」，「練」是熟練、是成熟，是知道什麼可以問，什麼不必問。「達」是通達，要通情達理，為自己想，也為別人想。\n\
    \  所以我對女兒說：「當你感覺艾琳達可能吹牛，發現她一問三不知的時候，你應該繼續問，甚至當著大家的面問？還是把話帶開？你打破砂鍋問到底，叫對方認錯，甚至當場落淚，對你有什麼好處？而且你要知道，有些人因為行程趕，早起晚歸，旅館只是他睡覺的地方，確實可能連旅館大廳都沒看清就離開了。你何不往這個角度去想，犯得著猜她說謊嗎？」\n\
    （選自跨一步，就成功）"
