- id: doc_112_高雄_大樹_國文_g7s1e1_s4_10
  section: 4
  number: 10
  type: single
  page: 6
  stem: 根據本詩，下列敘述何者正確？
  options:
  - label: A
    content: 首節「飛跑著的烏雲」是指放晴的徵兆
  - label: B
    content: 次節描寫雨水能夠滋潤萬物、洗淨大地
  - label: C
    content: 全詩表現小雨點的嬉鬧調皮
  - label: D
    content: 「美麗的長彩帶」是用擬人法描繪彩虹。
  group_stem: '第五則：七彩的虹 楊 喚

    接到了太陽國王的大掃除的命令，

    小雨點們就都坐上飛跑著的烏雲，

    賽跑著離開了天上的宮廷。


    他們給稻田和小河加足了水，

    他們給骯髒的山谷洗過了澡，

    就又來洗淨了清道夫永遠也掃不完的城市，

    也洗淨了悶熱的飛滿了塵土的天空。


    太陽國王為了獎賞他們真能幹，

    就送給他們一條美麗的長彩帶，

    那就是掛在明亮的雨後的天空中的

    紅、橙、黃、綠、青、藍、紫的七彩的虹。 （選自楊喚詩集）'
