  stem: （素養題）「一位香港的朋友來臺，母親知道他是北方人，特地烙韭菜餡餅請他吃，誰知他捧著餡餅卻淚流滿面，無法下嚥。他想起了他母親親手做的餡餅，但他到哪裡再嘗一口母親的餡餅呢？遊子思親的眼淚使我衷心惻然，也使我怵然一驚。我是隨時可以吃到母親親手做的餡餅，然而，我幾曾咀嚼出那餡餅的滋味？是否也要等到含淚懷念時才體會得出？母親，天下多麼孤單的角色。孩子小時，懵懂無知，只會哭，只會吵；孩子大了，眼界廣了，有了他自己的天地，自己的朋友，母親的世界再也容不下他了。母親的關懷往往變成嘮叨，母親的管教成了干涉。母親只有默默地把她的愛和進麵裡，把她的期盼包進餡裡。」（杏林子
