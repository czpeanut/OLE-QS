- id: doc_112_高雄_大樹_國文_g7s1e1_s4_5
  section: 4
  number: 5
  type: single
  page: 5
  stem: 根據本文，幼魚怎麼知道何時該回家睡覺了？
  options:
  - label: A
    content: 天一黑，幼魚就會自動回到洞裡睡覺
  - label: B
    content: 魚爸爸直截了當的把幼魚吸進嘴裡，帶回家
  - label: C
    content: 魚媽媽會擺動脊鰭，發出信號，召喚幼魚
  - label: D
    content: 月光會像發亮的寶石，親切召喚幼魚回家。
  group_stem: "第三則：\n  太陽魚教養子女的方法十分有趣引人。任何人，只要看過牠們時時對卵或幼魚輕撫一道輕流，或小心地帶著幼魚試水，都會永難忘懷。而當幼兒能游泳之後，魚爸爸或魚媽媽晚上安置牠們上床的景象，更是可愛。通常幼魚在沒有滿月之前，只要天一黑，就要回到牠們孵化的洞裡睡覺。這時做媽媽的會站在巢的上方，擺動魚鰭，讓暗紅脊鰭上的青色斑點，像寶石般的閃閃發光。幼魚見到了這種信號，立刻會聚集到母親的身邊，聽話的回到巢裡睡覺。這時，魚爸爸也會到處尋找走失的孩子。\n\
    \  一旦找著，牠總是直截了當地把孩子吸進嘴裡，帶回家，再把牠們一起吐在洞裡。這時，小魚們馬上就會重重地沉到洞底，並且一直停留到第二天早晨。原來這是一種奇妙的反射作用；幼魚的氣囊一到入睡的時候，就會自動地、緊緊地收縮起來，牠們的身體會變得比水重，然後像小石子般直沉到底。這和牠們嬰兒時，氣囊的氣還沒裝滿的情形一樣。而當魚爸爸把幼魚含在嘴裡時，這種變重的反應也會發生。\n\
    \  有一次，當魚爸爸一邊把孩子趕回巢睡覺，一邊偷空吞下一段蚯蚓尾巴時，忽然看見一條幼魚正在水裡游來游去，牠立刻追上那條幼魚，並且一口氣吞進早已塞滿蚯蚓肉的嘴裡，這一下子可就精彩了，現在牠的嘴裡有兩樣東西：一樣要進胃，一樣要進巢，牠會怎麼辦？牠頓在那裡一動也不動，滿嘴的肉也顧不得吃了。就在這一刻，我總算看到魚怎樣想心事、動腦筋了。魚爸爸就這樣呆了好幾秒，然後把嘴裡所有的東西都吐出來，等到蚯蚓及幼魚自然沉到水底後，再不慌不忙地把蚯蚓吃掉，並且監視著躺在水底的小孩。等牠吃完後，立刻又把小孩吸進嘴裡，帶回家。\n\
    （改寫自勞倫茲 可憐的魚）"
