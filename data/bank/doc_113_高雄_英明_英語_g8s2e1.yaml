- id: doc_113_高雄_英明_英語_g8s2e1_s4_34
  section: 4
  number: 34
  type: single
  page: 4
  stem: Why is Summer Solstice the longest day of the year?
  options:
  - label: A
    content: Because it falls on June 20 or 21 every year.
  - label: B
    content: Because it is in the northern hemisphere.
  - label: C
    content: Because the Earth’ North Pole is closest to the sun.
  - label: D
    content: Because it is the first day of summer.
  group_stem: 'The Longest Day of the Year

    Summer Solstice falls on June 20 or 21 every year. It is the longest day of the
    year in the northern hemisphere. It is the day when the Earth’s North Pole is
    closest to the sun. In the northern hemisphere, today is also the first day of
    summer. People around the world celebrate this day in many ways.

    In Sweden, girls wear flower crowns, dance and sing. Single girls also put seven
    flowers under their pillows at night to dream their future husband. Also, in Iceland,
    some places there have 24 hours of daylight during the time. They even hold a
    music festival for three days to celebrate the longest day of the day. However,
    not every nation celebrates Summer Solstice with many activities. In China, people
    just eat noodles for good luck.


    📖 Summer Solstice 夏至 northern hemisphere 北半球 North Pole 北極 crown 王冠 single 單身
    pillow 枕頭'
