- id: doc_113_高雄_英明_英語_g8s2e1_s4_31
  section: 4
  number: 31
  type: single
  page: 3
  stem: What does Susie have for her lunch?
  options:
  - label: A
    content: Peanut butter sandwiches.
  - label: B
    content: Peanut candy.
  - label: C
    content: Peanut butter pies.
  - label: D
    content: Peanut butter cakes.
  group_stem: 'Have Some Peanuts

    Jack: What do you have for your lunch, Susie?

    Susie: I eat some sandwiches with some fruit and peanut butter.

    Jack: They look yummy. Peanut makes food more delicious.

    Susie: You can say that again. In the U.S., people eat peanuts as cookies just
    like peanut candy or peanut butter pies and cakes.

    Jack: It sounds sweet! However, people in Asia like another way to enjoy peanuts.

    Susie: Really? Tell me more about it.

    Jack: Take Taiwan for example, most people like to use peanuts with a healthier
    way. Like my grandma, she likes to fry or boil peanuts and even cook food in peanut
    oil, too.

    Susie: Wow, it’s very interesting to hear that. People enjoy peanuts in many ways.

    Jack: Yes, maybe you can try it. I believe you can have different taste when you
    eat peanuts.

    Susie: Sure, I will.


    📖 peanut butter 花生醬 Asia 亞洲 take....for example 舉例來說 boil 水煮 oil 油'
  shared_asset: g4_31_33
