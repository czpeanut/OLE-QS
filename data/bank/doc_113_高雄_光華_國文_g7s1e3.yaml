    \    先說農家曬穀子吧，就希望一連幾個大晴天，千萬別下雨。好不容易把一簟簟的穀子攤開來，用竹耙子耙得勻勻的，若忽然一陣大雨來臨，那許多簟的穀子，千萬雙手都來不及收撥，就只好把簟子摺過來一半，蓋住穀子。可是雨一直不停，眼看穀子都漸漸濕透，一粒粒從篾簟邊漂出來。我站在廊下楞楞地看，心裡也有點著急，因為母親直念：「菩薩保佑，雨不要再下了，不要再下了。」老長工阿榮伯就直嘆氣，卻又不敢抱怨天，因為怨了天，只怕想要雨的時候，雨又不來了。\n\
    \    至於父親呢？他不像母親那樣關心穀子的事，他關心的是書。書要趕在三伏天太陽最猛的時候曬，可是三伏天偏偏又是陣雨最多的日子。父親是個讀書人，又在外面做官多年，對於農家「早晚看天色」的經驗是沒有的。所以一到要曬書的日子，就要問母親或是阿榮伯，今天天氣如何？母親就得意地念起來：「早上雲黃，大水滿池塘。晚上雲黃，沒水煎糖。」意思是說，大清早太陽出來得太快，把雲都照得黃黃的，反而會下雨。下半天太陽下山了，如果滿天都是金黃的雲，第二天一定是個大晴天，父親就可以曬書了。\n\
    \    在我童年生活中，真真不希望下雨的只有一天，那就是我的生日，我的生日正是颱風季節。平時一逢有颱風，我就興奮地問大人：「大水什麼時候才漲到我們家後門口呢？」只有我生日那天，我就要拜菩薩，保佑不要下雨。一下雨，母親就不讓我穿新衣服，唱〈鼓兒詞〉的先生就不會來，小朋友們也不會來吃我的「長壽麵」了。最糟的是老師只答應晴天才放我「生日假」，下雨天就照常上課。所以「晴天的生日」，對我是多麼重要啊！可是我的生日，多半都在風雨中過去。想起母親的愁風愁雨，是為了穀米的收成，為了牲畜的安全；而我的愁風愁雨，卻是為自己的玩樂。\n\
    \    回首童稚無知歲月，老去情懷，於悲喜參半中，倒不如「也無風雨也無晴」，豈不更好呢？\n                              \
    \                                                      琦君〈下雨天，真不好〉"
