- id: doc_113_高雄_光華_國文_g7s1e3_s2_46
  section: 2
  number: 46
  type: single
  page: 8
  stem: 關於臺灣的「青銀共居」，下列敘述何者正確？
  options:
  - label: A
    content: 推動相關政策的時間，僅晚於荷蘭與日本
  - label: B
    content: 主要目的為透過跨代交流經驗，解決房價問題
  - label: C
    content: 投入青銀共居的最終目標，是達成全面的青銀共融
  - label: D
    content: 在國外考察時看到的案例，成為陽明老人公寓的構想
  group_stem: "(四)\n    「青銀共居」概念最早起源於荷蘭，日本也有推動政策。顧名思義是讓年輕人與銀髮族居住於同一個空間，透過跨代交流經驗，維持銀髮族與社會的互動、降低社交上的隔離與孤獨感，也可略略紓解高房價所帶來的居住正義問題。\n\
    \    「2017 年，陽明老人公寓進行全面整修時，我們剛好在國外考察時看到相關的案例，而有了這個構想。」臺北市是台灣投入青銀共居的城市先驅之一，臺北市政府社會局老人福利科科長楊雅茹說，當時，臺北市政府將創立逾20\
    \ 年的陽明老人公寓，以及鄰近的文化大學聚在一起，用一個月的時間商定細節、簽定合作備忘錄。\n    「青銀共居的成功關鍵是『共融』，必須引導兩代彼此磨合、產生深度交流。」楊雅茹說，絕不是把老人跟年輕人丟在那邊，兩者就會擦出火花。入住前，學生要清楚了解老人公寓的生活規範、自己要負擔的義務，並且確實、用心投入公共服務。「促進青銀共居的互動品質是需要人力的。」陽明老人公寓副主任陳淑芬說，學生通常把生活重心放在學校或其他打工等外務，實際操作上，如果沒有人力去協助兩代互動，青銀共居就容易流於形式。臺北市社會局有給予預算聘請專職人力，提供學生在入住前先上課了解空間特色與長輩需求，入住初期也會以「解任務」的方式協助兩代之間破冰。如果真的遇到學生外務太多，也得有人在後頭追趕進度，以免他們無法達成每年20\
    \ 小時的公共服務時數。\n    「她們陪我們做好多事，一起去買東西、唱歌、玩桌遊。不過，最重要的還是『3C 解惑時間』。」安娜奶奶是陽明老人公寓的活躍分子，講起大學生們在公寓裡頭的角色，話匣子一開就停不下來。安娜奶奶說的沒錯，同學們在公寓所開設的課程，最熱門的莫過於每個禮拜兩次的「3C\
    \ 解惑時間」，爺爺、奶奶們舉凡手機使用上有任何疑難雜症，都歡迎來找同學們解惑。\n    「很多人以為青銀共居只有長輩能得到好處，其實不一定。」陳淑芬說，大學生們面臨生涯規劃疑難雜症，經過長輩分享自己的人生經驗，反而讓學生茅塞頓開。曾經有一位非常依賴母親的學生，就連小感冒都要回家請媽媽帶他去看醫生，這樣十指不沾陽春水①\
    \ 的學生，為了一圓長輩想吃甜品的願望，主動研究食譜、帶領大家一連完成4 場甜點DIY，也讓他的母親直呼：「他會做甜點？怎麼可能？」\n    楊雅茹說，老人設施的服務對象不僅是老人，青銀共居只是青銀共融的其中一種模式，複合式的空間規劃也是正在推廣的理念，比如去年剛啟用的銀髮服務創新活力中心，就是採取二樓日照、一樓托嬰的規劃。「我還記得計畫開辦第一年，我來這裡看到年輕人跟長輩坐在一起用餐聊天，氣氛整個改變了。」回首來時路，楊雅茹始終記得最初的感動，這座歷史超過20\
    \ 年的老人公寓，在年輕人的活力注入後，一點一滴地，有了嶄新的活力面貌。\n                                       \
    \                      (改寫自「50+(Fifty Plus)」網站2022.12.09)"
