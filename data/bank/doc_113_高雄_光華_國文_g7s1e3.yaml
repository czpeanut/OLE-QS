    content: 臺灣盛產蘿蔔，蘿蔔乾是家家戶戶都會製作的美食
  - label: C
    content: 蘿蔔乾是鄰居互相餽贈的家常食材
  - label: D
    content: 作者與朋友說好都要帶蘿蔔乾
  group_stem: "（三）\n    我不知道她到哪裡去了？至少，我確定在茫茫人海之中，我和當初的那一群小孩，都像被撒入海中的一把粗糠，隨著潮汐而漂浮。如今，我停泊在狹小的港灣，而她，是否仍在海上風暴裡沉浮，抑或早被魚群吞食？我真的不知道，也無從知道了。\n\
    \    她是我的啟蒙師，其實只比我大一歲，留著西瓜皮頭髮，同樣又乾又瘦又小。但她對於樹木花草的常識卻比我豐富，在平原的農村裡，第一個教我辨識海邊林投果與鳳梨之差別的就是她，至於防風林的木麻黃與高山松針也是她告訴我的。可笑的是，我用她教我的常識在野外辨識植物的比賽得了獎狀，而她卻遙遙掛尾，因為許多生字不會寫，在「木麻黃」那題格裡，她說她只會寫一個「木」字。\n\
    \    她與我坐在一起，小學老師為了提高學習成績，刻意把功課好與功課差的編在一塊兒。一起寫字，一起打掃戶外，一起種菜，一起上廁所。但她的成績並沒有進步，每天早上我盯她：「生字寫了沒？」她溜著大眼睛盯著百褶裙，隨即又高興地問我：「你今天便當帶什麼菜？」就這樣養成每天早上交換看便當的習慣，而且非常神秘，掀一道小縫快速瞄一下，馬上緊蓋交回對方，這些動作都在桌底下進行，好像兩個間諜交換情報。其實都是蘿蔔乾主題，但因為我父親賣魚，天天塞魚，她家賣菜，天天塞菜。我們偷看之後，總是下一致的結論：「又是魚！」「哼，又是菜！」她老是不能控制口腹之欲，順道把便當吃完。我們原本說好中午吃便當時交換菜，一直沒換成。\n\
    \    中午吃便當，她就溜到操場盪鞦韆，百褶裙張得像傘，快碰到大榕樹的頭頂了。我坐在教室裡可以看到她盪來盪去，偌大的操場就她一個人，我吃飯一向慢，別的學生開始往操場跑，她就改坐在鞦韆板上閒晃，一手抓著另一台鞦韆繩，不給別人玩，待我解決掉便當，跑去找她，盪沒兩下，又得進教室午睡了。\n\
    \    她還教我怎麼逃過男生們的欺負，通常玩躲避球時，敵國的男生都十分默契，一定先打死其他人，把場子空出來，最後才盡全力攻擊我。她雖為敵軍，卻很護我，大叫往左、往右，趴下，但我仍然被球砸到，衣服上一大團球印。她看我這麼不成材，打定主意叫我下回跑出場外「自動求死」。有時，被欺負的心很酸，不免吸鼻子掉眼淚，她就說：「我替你報仇！」她的報仇方式很簡單，回狠狠地瞪男生一眼。\n\
    \    不過，我也替她得了一面獎狀，我教她這次月考交白卷，下次月考再答題，終於得了「進步獎」，賞鉛筆一支。嚴格說，不能算我的功勞，因為交空白卷那回，她的手心被打得發紅。\n\
    \    我與她只合坐一學期，編班之後少有來往。但我永遠記得，分散前有天中午，她不知從哪裡摘來幾片茸茸的葉子，告訴我那是薄荷。那天的午睡，我完全睡不著，嘴裡含的薄荷葉涼得讓我拼命吞口水。現在的我對薄荷茶特別喜歡，應該是她賜給我。\n\
    \  「我替你報仇！」曾經有位尋找薄荷的小女孩這樣對我說，也是唯一對我說這話的人。但我不知道她漂浮在哪一處海面，如果她像我當初一般哭泣，希望換我對她說：「我替你報仇！」\n\
    \                                                                            \
    \  簡媜〈尋找薄荷的小孩〉"
