- id: doc_113_高雄_鼎金_數學_g9s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '如右圖，四邊形 $ABCD$ 中，$\overline{AB}=\overline{AD}$，$\overline{BC}=\overline{CD}$，求證
    $\angle ABC=\angle ADC$ 的過程如下：

    連接 $\overline{BD}$

    ∵$\overline{AB}=\overline{AD}$

    ∴ ① （等腰三角形兩底角相等）

    ∵ ②

    ∴$\angle CBD=\angle CDB$（等腰三角形兩底角相等）

    $\angle ABC=$ ③ $=\angle ADB+\angle CDB=$ ④

    故 $\angle ABC=\angle ADC$

    則關於空格的內容，下列何者正確？'
  options:
  - label: A
    content: ①為 $\angle ABC=\angle ADC$
  - label: B
    content: ②為 $\overline{BC}=\overline{CD}$
  - label: C
    content: ③為 $\angle BAC+\angle DAC$
  - label: D
    content: ④為 $\angle BCD$
