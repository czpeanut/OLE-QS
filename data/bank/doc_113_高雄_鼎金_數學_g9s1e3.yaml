  stem: '如圖，有一等腰 $\triangle ABC$，$\overline{AB}=\overline{AC}$，及其外接圓，今欲在圖形上畫一直線，始其成為線對稱圖形。

    以下是飛歌、小佛兩人的作法：

    飛歌：作 $\angle B$ 的角平分線和 $\angle C$ 角平分線之交點 $O$，連接 $\overline{AO}$ 即為所求。

    小佛：作 $\overline{AB}$ 中垂線和 $\overline{AC}$ 中垂線之交點 $P$，連接 $\overline{AP}$ 即為所求。

    對於兩人的作法，下列判斷何者正確？'
  options:
