      title: 推理證明
      chapter: 第3章 推理證明與三角形的心
    textbook: 九上 3-1 推理證明
    labeled_by: ai
- id: doc_113_高雄_鼎金_數學_g9s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '如圖，以下為軒銘利用尺規作圖的步驟：

    ①以 $A$ 點為圓心，適當長為半徑畫弧，分別交 $\angle A$ 的兩邊於 $B$、$C$ 兩點。

    ②分別以 $B$、$C$ 兩點為圓心，大於 $\frac{1}{2}\overline{BC}$ 長為半徑畫弧，兩弧交於 $D$ 點，$\overline{AD}$
    即為所求。

    依照軒銘尺規作圖的步驟，說明 $\triangle ABD\cong\triangle ACD$ 依據的是何種三角形全等性質？'
  options:
  - label: A
    content: SAS
  - label: B
    content: ASA
