- id: doc_113_高雄_鼎金_數學_g9s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '吳老師問：「在 $\triangle ABC$ 和 $\triangle DEF$ 中，若 $\overline{AC}=\overline{DF}$，$\overline{BC}=\overline{EF}$，如果要證明
    $\triangle ABC\cong\triangle DEF$ 應該要加上哪一個條件？」

    甲生說：「$\overline{AB}=\overline{DE}$。」

    乙生說：「$\angle A=\angle D$。」

    丙生說：「$\angle C=\angle F$。」

    丁生說：「$\angle B=\angle E=90^\circ$。」

    請問哪一位說的條件無法證明？'
  options:
  - label: A
    content: 甲生
  - label: B
    content: 乙生
  - label: C
    content: 丙生
  - label: D
    content: 丁生
  tags:
