- id: doc_113_基隆_銘傳_國文_g8s1e2_s4_32
  section: 4
  number: 32
  type: single
  page: 4
  stem: 本文第一段的寫作手法，下列何者正確？
  options:
  - label: A
    content: 作者先總論段落文旨，再加以舉例說明
  - label: B
    content: 以祖母的話總結，強調手機的用途廣泛
  - label: C
    content: 運用誇飾手法，敘述年輕世代濫用手機
  - label: D
    content: 使用今昔對比，感嘆手機造成人情淡薄。
  group_stem: "(二)\n    手機之用雖廣，然眾亦未皆稱其善也。清明時節，餘家有宴，親友歸，眾賓至，圍坐大桌，酒冽而肴甘，實盛事也。然席間不聞寒暄笑語，但見少小者人手一機，低頭垂目，唯按鍵之聲不絕於耳；而長者亦不免持機離席，於走廊低聲私語，蓋有生意聯絡也。席畢，餘未見宴之歡也。祖母黯然謂餘：「人情之薄如此，手機之過矣！」\n\
    \    由是觀之，凡今所謂高科技者，有其一利必有其一弊。譬如槍支彈藥，可持之保家衛國、伸張正義，亦可持之殺人越貨、逞己私欲。而余以為，物之利弊，大抵在於馭物之人。馭者善，則用物於善處，故物善；馭者惡，則用物於惡處，故物惡。手機乃一通訊小器，善用則便利多多，惡用則亂心擾擾。嗚呼，余尚慶手機之弊小矣，僅止於淡泊人情、疏遠人心爾。倘若惡用電腦、槍械乃至艦艇、核彈者，輕則害人性命，重則毀其家國。科技之用，敢不慎乎？\n\
    孫婧妍 手機論"
