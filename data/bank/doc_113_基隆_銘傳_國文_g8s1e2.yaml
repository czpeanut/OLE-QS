  stem: '題目：○○ 的街景 （○○ 不限兩個字）


    引導語：「街景」是豐富多變的，有的充滿當地生活文化，有的隨著季節或節日而有不同的風貌，每一條街道蘊藏著不同的故事與風景。這條街可能在上學路上，可能在採買的路上，也可能是漫步的途中，沿路有些什麼景色，或曾發生什麼事而觸動你的心靈？請就平日的生活經驗與觀察，以你的生活圈為取材範圍，寫出一篇題目為「○○的街景」，題目自訂，請抄題。'
