- id: doc_113_基隆_銘傳_國文_g8s1e2_s4_30
  section: 4
  number: 30
  type: single
  page: 4
  stem: 依據文中所述，下列選項何者不符合 賈穆斯進行訪談與報導的目的？
  options:
  - label: A
    content: 讓國際能關注戰爭對兒童的影響
  - label: B
    content: 難得遇到戰爭能拍片作為紀念
  - label: C
    content: 將生活困境即時呈現並向外求救
  - label: D
    content: 藉由一己之力來為國家和平努力。
  group_stem: "(一)\n    2023年10月7日，以色列遭巴勒斯坦的哈瑪斯集團突擊，以色列人們平靜的早晨就被一陣陣的空襲警報及爆炸聲給打破，就在一陣錯愕與驚慌中躲進防空洞中，等待恢復平靜的時刻。然而在這場戰爭的開打，不只是以色列人民受到影響，被回擊的巴勒斯坦地區也有許多無辜的人民同樣在逃難、躲避攻擊。脫離了防空洞的庇護，他們迎接的不只有陽光，而是嚴重的傷亡以及被入侵的、殘破不堪的家園。這場以巴戰爭重演了50年前由埃及與敘利亞對以色列發動「贖罪日戰爭」的模式，也是近20年來死傷最嚴重的一次。\n\
    \    在這場動亂中將資訊即時傳達給外界的，除了有國際新聞記者報導前線戰況外，也出現了一位年僅9歲的巴勒斯坦籍女孩賈穆斯，用簡便的麥克風收音、用母親的智慧型手機錄製周遭環境，以自己「在戰爭中的一天生活」為主題，在小孩的視角下記錄了她向南逃難的過程，也將加薩走廊的戰地現場與難民營內的生活困境向外傳遞，並上傳到數十萬不分國界粉絲們關注的Instagram平臺。\n\
    \    用小小的手拿起麥克風的賈穆斯，頭頂戴著頭盔，穿梭在飽受戰爭所蹂躪的街道上，訪問著被砲火摧毀家園的大人、兒童及老年人們。她的影片如實呈現了當地兒童每天面臨的困境，包括極為有限的食品、醫療保健用品和生活必需品，及因戰爭而被剝奪的受教育機會。她希望能藉著這些紀錄片，將巴勒斯坦孩子的聲音傳遞出去，提高全球觀眾對他們處境的關切，並期待這些紀錄能為她的同胞帶來積極的改變，讓戰火能盡早平息。\n\
    \    根據保護記者委員會統計，從戰爭開始截至當年度12月底，人員死傷、房屋被摧毀、工作場所遭轟炸，已有至少77名記者和媒體工作者在戰爭中死亡。如今戰事未歇，加薩走廊的天空中仍戰火瀰漫，一個矮小的身影仍堅毅的為世界帶來她所見所聞的，最直接的第一手戰況消息。\n\
    加薩9歲女孩戰地記者"
