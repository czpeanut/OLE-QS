  options:
  - label: A
    content: 移工組織呼籲臺灣社會需肯定國際漁工的貢獻
  - label: B
    content: 國際漁工在遠洋漁船的勞動環境已逐漸獲得改善
  - label: C
    content: 人權團體倡議內容涉及國際漁工需求滿足與否
  - label: D
    content: 補助遠洋漁船裝設Wi-Fi可降低族群之刻板印象
  group_stem: '影集「八尺門的辯護人」引發民眾討論的熱潮，劇中國際漁工因遭受虐待而殺害船長，出自真實發生的案件。國際漁工在臺灣遠洋漁船上遭到剝削的情形，包含經常超時工作，處於惡劣的勞動環境，並遭受管理階層的暴力對待。此外，還被仲介公司騙取高昂的仲介費用，船東即使獲利也常發生拖欠或苛扣工資的情形，導致國際漁工只能拿到與辛勤工作不成比例的微薄薪資。

    多個人權團體及移工組織表示，遠洋漁船的國際漁工需要對外聯絡與求救的管道，才能有效的避免遭到虐待或剝削，因此希望政府能夠立法強制要求所有遠洋漁船裝設Wi-Fi，並開放讓國際漁工自由使用。

    政府對此的回應是，目前已實施專案補助遠洋漁船裝設Wi-Fi 或衛星電話設備及通訊費用，但根據「外籍船員互動服務平臺」的調查指出，在超過1,100 艘的遠洋漁船中，裝設Wi-Fi
    者不到一成，而且絕大多數的國際漁工一週僅有約5 分鐘的上網時間。今年6 月10 日高雄前鎮漁港船員會館正式啟用，推動符合國際衛生標準及人性化的船員會館，也為船員加入文康活動、家鄉活動，期盼打造重視船員人權的遠洋基地。請回答下列44-45
    題'
  answer:
  - C
  answer_source: answer_key_vlm
