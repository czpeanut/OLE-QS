- id: doc_113_新北_永和_國文_g8s2e1_s6_10
  section: 6
  number: 10
  type: single
  page: 2
  stem: 「如何讓你遇見我∕在我最美麗的時刻 為這∕我已在佛前 求了五百年」根據這段文字，下列何者說明正確？
  options:
  - label: A
    content: 「最美麗的時刻」：表現出女子處於年華最盛的時間點，並展現胸有成竹的自信
  - label: B
    content: 「我已在佛前求了五百年」：表現出佛家輪迴的高深道義與自己對於這段愛情的低微
  - label: C
    content: 「如何讓你遇見我」：突顯女子對於這段愛情不擇手段，勢在必得的決心與毅力
  - label: D
    content: 「在我最美麗的時刻」與「求了五百年」：表現出女子對兩人一面之緣的懇切期盼
- id: doc_113_新北_永和_國文_g8s2e1_s6_11
  section: 6
  number: 11
  type: single
  page: 2
  stem: 在〈木蘭詩〉中出現了不少「虛數」的運用，例如：「將軍百戰死，壯士十年歸」裡面的「百」和「十」都是虛數，分別表示「多次」與「多年」的意思。以下成語中的數字，何者也是屬於這種情形？
  options:
  - label: A
    content: 三姑六婆
  - label: B
    content: 四民之末
  - label: C
    content: 三令五申
  - label: D
    content: 五內如焚
  lesson_raw:
    title: 木蘭詩
    basis: 題目引述〈木蘭詩〉文句
- id: doc_113_新北_永和_國文_g8s2e1_s6_12
  section: 6
  number: 12
  type: single
  page: 2
  stem: 關於樂府詩、古體詩和近體詩的比較，以下何者正確？
  options:
  - label: A
    content: 三者的格律以近體詩最嚴格，因為近體詩皆須對仗
  - label: B
    content: 樂府詩的名稱源自漢代，來源多為民間歌謠
  - label: C
    content: 樂府詩的用韻較近體詩寬，但不可以換韻
  - label: D
    content: 古詩多為文人創作，並且以雜言為主，亦有五、七言
