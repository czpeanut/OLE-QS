- id: doc_113_新北_永和_國文_g8s2e1_s7_32
  section: 7
  number: 32
  type: single
  page: 6
  stem: 請問以下選項的說明何者最不能符合本文的意涵？
  options:
  - label: A
    content: 閨怨詩屬於一種具有感傷色調的文學創作
  - label: B
    content: 比、興是創作閨怨詩時常使用的一種文字技巧
  - label: C
    content: 閨怨詩以獨守家中的女性為題材，表現出當代女性所受到的壓迫
  - label: D
    content: 閨怨詩常以男性視角書寫女性的情感，難免有時失之偏頗、流於主觀
  group_stem: "閨怨詩，中國古代詩歌類型之一，以獨守家中的女子為題材，抒寫其對遠行丈夫的思慕與悲傷之情，就文學而言，閨怨詩具有濃重的感傷色調，細膩的心理描寫，妥貼的比、興①\
    \ 寄託，由淺入深的藝術風格，都呈現出婉約纏綿幽怨感傷之美；但就現實狀況而言，傳統閨怨詩的書寫大多出自男性手筆，非女性創作。男性藉由心態投射，表現出女子獨守深閨的孤寂與落寞，這樣的書寫會存在一種是否能完整呈現女子內心獨白的疑問？當時的社會風氣與制度，男性地位遠大於女性，因此作者在對女性心理進行描摹時，很大程度上可能對女性心理產生誤解。女子憑欄，可能就只是倚欄吹風；女子登高，可能就是賞樓望遠，但卻往往被作家寄託思念之閨怨。\n\
    \    因此，我們現代人欣賞閨怨詩，可以就其文學性去進行欣賞，倘若把它當作時人女性的一種悲悽，那可能就讓當時女性的悲戚更為悲戚了。\n① 比、興：為作詩的創作方式，比是以彼喻此，興是托物興詞。\
    \                               洋子〈閨怨詩〉"
- id: doc_113_新北_永和_國文_g8s2e1_s7_33
  section: 7
  number: 33
  type: single
  page: 6
  stem: 請問對於文中「倘若把它當作時人女性的一種悲悽，那可能就讓當時女性的悲戚更為悲戚了」這句話的意思，下列何者說明正確？
  options:
  - label: A
    content: 當時女子已失丈夫，我們誤解了意思，反而讓作者真正想表達的意念失去意義
  - label: B
    content: 詩人是以歷史當代的角度去進行創作，可以更為貼切的理解當代人的問題與悲悽
  - label: C
    content: 我們現代人在解讀古代人的文學作品時，要考慮到社會背景與風氣對文本產生的影響
  - label: D
    content: 倘若我們真的以此角度去解讀，反而讓我們對當時受到壓迫的女性產生更多的誤解
