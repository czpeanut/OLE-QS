  stem: 根據上文內容           內的物品應該為何？
  options:
  - label: A
    content: 餅乾
  - label: B
    content: 文件
  - label: C
    content: 蘋果
  - label: D
    content: 書本
  group_stem: "請閱讀以下小說，回答問題\n     愛莉絲正坐在研究室中的椅子上，突然瞥見諾頓站在窗前看著愛莉絲。愛莉絲急忙放下手中的      \
    \   起身追去，諾頓此時早已轉身離開。出了研究室，愛莉絲已經看不見諾頓的影子，但還是朝著走道底追去，因為她知道，此時諾頓一定會回自己的研究室。當愛莉絲轉向諾頓研究室，他果然站在研究室門口，從口袋中掏出鎖匙要開門進去，她趕緊追上去喊道：「諾頓！」\n\
    諾頓向右轉過身，朝著愛莉絲道：「怎麼了？」\n    愛莉絲：「威爾郡的那件案子我發現了端倪，原來……」正當愛莉絲還要說下去，只見諾頓用食指輕輕畫上一個小圓，停在自己的嘴巴旁，示意愛莉絲停止說話，然後優雅地退下手套，從胸前的口袋裡拿出方巾遞給愛莉絲，愛莉絲才發現自己的嘴角還殘留著剛剛吃過東西的碎屑，於是尷尬地接過方巾擦拭，不好意思地笑著。\n\
    「每個案子都很緊急，但身為卡內基研究室的研究員不管在哪，都仍必須注意儀態。」諾頓說道\n「但是我剛發現作為這件案子的直接證據……」\n「沒找到！我知道。」諾頓擺擺手\n\
    「沒錯，可是我剛查了出入庫紀錄，居然有一把武器有入庫的紀錄，東西卻不見了，代表有人從證據庫房裡拿走了證據。」\n諾頓一聽眉頭皺起：「證據入庫登記人是誰？」\n\
    「是佐斯！」\n    兩人不約而同想到什麼，愛莉絲把頭撇向右邊，看見佐斯正站在自己的研究室對著窗外的兩人發出懾人的微笑。"
