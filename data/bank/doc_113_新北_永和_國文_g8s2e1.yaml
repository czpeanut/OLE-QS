- id: doc_113_新北_永和_國文_g8s2e1_s6_6
  section: 6
  number: 6
  type: single
  page: 2
  stem: 「這時，我們已經累積了兩個月的觀察經驗，遠遠一段距離外，就憑這些水花特徵，船上每個工作夥伴都能立即判斷，是那群緊張兮兮的迷途羔羊──弗氏海豚。……牠們鐵定不喜歡船隻靠近，不像一般海豚，多少總會主動游近船邊。」從這段文字可以得知哪一個線索？
  options:
  - label: A
    content: 能夠推斷出水花特徵應是富有節奏而穩定的
  - label: B
    content: 弗氏海豚已在海上漂流了兩個月，所以心情緊張兮兮
  - label: C
    content: 一般鯨豚比較不喜歡船隻靠近，然而弗氏海豚例外
  - label: D
    content: 由水花特徵就能猜測遇到的是弗氏海豚，可見觀察人員對於鯨豚的熟悉度高
- id: doc_113_新北_永和_國文_g8s2e1_s6_7
  section: 6
  number: 7
  type: single
  page: 2
  stem: 《鯨生鯨世》中取用了「今生今世」的諧音，意指本書在介紹鯨豚的「今生今世」。以下何者也取用了這種「諧音雙關」的手法？
  options:
  - label: A
    content: 他在非洲過著「非人生活」
  - label: B
    content: 炸雞店的廣告用「勿失良雞」
  - label: C
    content: 獨眼龍看戲，真是「一目了然」
  - label: D
    content: 外國歌手來台辦演唱會，掀起「登台旋風」。
- id: doc_113_新北_永和_國文_g8s2e1_s6_8
  section: 6
  number: 8
  type: single
  page: 2
  stem: 野比大雄寫了一封信給他同學剛田武，但是哆啦A 夢卻發現他只有一個細節寫對了，請問是哪一個地方呢？
  options:
