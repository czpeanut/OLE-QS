    content: 空身出來，遊賞所需，只在爐火，所以樂而忘返。
  group_stem: "(甲)  ○月○日 晨陰  甚涼  巳後晴\n    傍晚，獨步至倉頡祠前看稻花。時夕陽在山，蒼翠欲滴，風葉露穗，搖蕩若千頃波，山外煙嵐，遠近接簇，悠然暢寄，書味滿胸。此樂非但忘貧，兼可入道。\
    \                           ──節錄自李慈銘《越縵堂日記》\n(乙)\n    江南多竹，其民習於食筍。每方春時，苞甲出土，頭角繭栗，率以供采食。或蒸瀹以為湯，茹介茶荈以充饋，好事者目以清嗜，不靳方長。故雖園林豐美，複垣重扃，主人居常愛護，及其甘於食之也，剪伐不顧。獨其味苦而不入食品者，筍常全。每當溪谷岩陸之間，散漫於地而不收，必棄於苦者也。而甘者至取之或盡其類。然甘者近自戕，而苦者雖棄，猶免於剪伐。\
    \                                          ──節錄自陸樹聲〈苦竹記〉"
