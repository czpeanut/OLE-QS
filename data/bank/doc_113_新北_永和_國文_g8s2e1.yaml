- id: doc_113_新北_永和_國文_g8s2e1_s6_4
  section: 6
  number: 4
  type: single
  page: 1
  stem: "「當你走近  請你細聽／那顫抖的葉是我等待的熱情／而當你終於無視地走過／在你身後落了一地的／朋友啊   \n    那不是花瓣／是我凋零的心」關於以上詩句含意，以下解讀哪一項最為正確？"
  options:
  - label: A
    content: 詩中的「我」可能是單相思
  - label: B
    content: 詩中的「你」已經心有所屬
  - label: C
    content: 詩中的「我」因太過熱情而嚇跑了意中人
  - label: D
    content: 詩中的「我」不確定是否得到了她期待中的回應
