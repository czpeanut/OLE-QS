  group_stem: "搖滾樂，自1960 年代披頭四將它推向藝術的層次，並證明其在商業上的價值，它在之後的數十年成為了最受歡迎的一種音樂類型。而在時間的推移下，搖滾樂也歷經了多次的變革，每個時代都有其相對應的搖滾類型和代表樂團。皇后樂團之於1970\
    \ 年代的華麗搖滾，音樂家穿著華麗的服裝，艷麗的化妝和髮型，特別是高跟舞台鞋和閃光顆粒與亮片；槍與玫瑰之於1980 年代的硬式搖滾，硬式搖滾主要使用大量回饋效果的音箱，加上產生失真的吉他效果器。當然還有超脫樂團在1990\
    \ 年掀起的油漬搖滾風潮，是一個將另類搖滾、噪音搖滾、硬蕊龐克和重金屬混合的樂派。而在千禧交替的2000 年毫無疑問聯合公園和代表他們風格的新金屬，無疑是在眾多搖滾樂團中最閃耀的一顆星。\n\
    \    焦慮、迷惘、不安、恐懼，他們的第一張專輯的每一首歌都是圍繞在這些負面情緒展開，然而充斥著絕望，在聽完後反而能讓你沉悶的內心獲得釋放。聯合公園利用雙主唱的方式運行，雙主唱反映出樂團音樂結構的兩大要素──搖滾及嘻哈。主歌由團長麥克的文字充斥著每個小節，當把情緒堆疊到最高點時，查斯特充滿爆發力且渾厚的歌聲，或者說「咆哮」，頓時將一切宣洩出來，結合金屬搖滾、嘻哈元素的聯合公園也被許多人納入新金屬的門派。後來這張專輯在全球三千萬張的誇張成績，得到了美國唱片協會的鑽石認證，也是2000\
    \ 年以來暢銷的專輯之一，成為了當時影響力最大的樂團。\n    2007 年的第三張專輯《末日警鐘──毀滅．新生》普遍認為是聯合公園的轉折點，他們音樂採用了更多電子音色，音樂氛圍上比起以往更為輕鬆，主題也沒有先前如此般的壓抑，反倒開始有希望的概念存在，比如說其中〈過去的我〉作為電影變形金剛的插曲，歌曲圍繞著自我反思展開，在MV\
    \ 的呈現上，可以看到許多關於戰爭、污染的畫面，從宏觀的觀點來切入我們對這個世界造成不可逆的影響，但在最後的畫面卻能看到剛誕生的胚芽，意味著新生，這首歌反映著專輯的概念，當人類擁有越來越多的力量時，我們也必須認真思考這份力量背後所帶來的危險性。\n\
    \    聯合公園是最偉大的樂團，他們從初始充滿憤怒的搖滾小子，到後來身上多了許多來自家庭、社會的負擔，都利用搖滾樂向我們訴說著「即使背負著痛苦前進，其實你們並不孤單，我們都一樣」讓人振奮人心的吶喊。\n\
    (改寫自Youtube OMIO_BEN 你還記得聯合公園嗎？)"
