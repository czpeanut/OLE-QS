- id: doc_113_高雄_苓雅_社會_歷史_g8s1e1_s1_21
  section: 1
  number: 21
  type: single
  page: 1
  stem: '正亮寫了一篇歷史報告，結語如下：

    這個朝代是中國最具世界主義色彩的朝代。政治上，皇帝因打敗強敵東突厥，曾被周邊民族尊為國際盟

    主；社會上，……；宗教上，對信仰自由給予保障，許多宗教傳入，是一段充滿光輝的時期。

    文中「……」部分，最適合填入下列哪一段敘述？'
  options:
  - label: A
    content: 朝廷積極推動漢化，如說漢語、通婚姻
  - label: B
    content: 朝廷將人民區分不同階級，訂定禮樂制度作為規範
  - label: C
    content: 朝廷對於各種族一視同仁，許多留學生與外國人前來學習
  - label: D
    content: '朝廷有感於西方國家科技先進產業

      發達，禮聘外國人士來華指導。'
