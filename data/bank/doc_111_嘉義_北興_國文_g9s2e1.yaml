- id: doc_111_嘉義_北興_國文_g9s2e1_s1_32
  section: 1
  number: 32
  type: single
  page: 5
  stem: 根據上文，龍貓最後是以什麼形式上映？
  options:
  - label: A
    content: 以電視特輯形式單獨上映
  - label: B
    content: 以電影形式合併上映
  - label: C
    content: 以電視特輯形式合併上映
  - label: D
    content: 以電影形式單獨上映
  group_stem: "大家有看過龍貓這部動畫片嗎？那個只有小孩才能看見的龐大身軀，像是森林守護神，個性卻又那麼天真，像個孩子一樣；當他大吼，原野上的風都呼嘯；當他奮力一躍，就能持著雨傘在天空飛翔，這樣一個也被稱為「豆豆龍」的角色，可能是很多人的童年回憶，但這部片的製作過程，卻不如片中的單純美好。\n\
    \  龍貓早十年前就想拍成電視特輯，但當時的日本電視臺不買單。一來宮崎駿不太會推銷角色；二來就算不停強調這部片是「以昭和三○年代的日本為舞臺，描寫妖怪與小孩互動的故事」，沒有看到人物動作，也很難感受到人物的魅力；三來日本當時不太流行妖怪的電影，比較喜歡西洋風味的作品。\n\
    \  龍貓要拍成電影當時，原著宮崎駿想找高畑勳當導演，請鈴木敏夫去說服他。鈴木先生原本覺得這個世紀合作非常棒，沒想到高畑勳死都不答應，一直到兩人面談都要結束時，高畑勳才說出他覺得原著是宮崎駿，他當導演的話吃力不討好。\n\
    \  後來公司決定龍貓與另外一部作品螢火蟲之墓一起合併首映，由宮崎駿執導龍貓，高畑勳執導螢火蟲之墓。要跟上映公司談合作時卻得到「龍貓已經滿嘴妖怪了，這次居然連墳墓都來了。妖怪加墳墓，你到底在搞什麼！」的回應，後來又幾經波折才終於將這兩部作品公諸於世。\n\
    \  流行瞬息萬變，誰知道曾經風靡一時的龍貓與螢火蟲之墓的製作過程如此艱辛，卻又在推出之後聲名大噪呢？\n─改寫自〈天才的思考：高畑勳與宮崎駿〉"
  tags:
    textbook: 九下 第四課 憶高畑勳：螢火蟲之墓
