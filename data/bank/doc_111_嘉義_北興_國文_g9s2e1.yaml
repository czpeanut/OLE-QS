- id: doc_111_嘉義_北興_國文_g9s2e1_s1_35
  section: 1
  number: 35
  type: single
  page: 5
  stem: 針對上文內容，何者敘述最正確？
  options:
  - label: A
    content: 臺灣竹枝詞是臺灣原創的文學類型
  - label: B
    content: 竹枝詞在唐代是最為流行的近體詩創作模式
  - label: C
    content: 郁永河當時來到臺灣是為了主持旅遊節目
  - label: D
    content: 以臺灣為主角而特別創作的竹枝詞，目前最早的見於埤海記遊
  group_stem: "竹枝詞源於唐代劉禹錫等人，大致來說是一種類似七言詩體的文學創作，最為人津津樂道的莫過於「東邊日出西邊雨，道是無晴卻有晴」一句。而當這個文類來到臺灣之後也變成了歌詠在地風光絕佳利器。其中最早記載歌詠臺灣風光的竹枝詞，即收錄在郁永河的埤海記遊一書當中，裡頭大量的收錄了郁永河來到臺灣之後的一切所見所聞，因此也可以將臺灣竹枝詞當作是當代旅遊節目的介紹詞呢！\n\
    \  因此如果想要更加了解過去臺灣的在地風光，透過這些作品的敘述，我們便能夠很輕易的一窺其實，內容包山包海：自然景色、動植物瓜果、人文藝術等，都是詩人創作的對象。而且撇除掉太過政治或是個人情感的描述，竹枝詞顯得更純樸、更可愛，也更容易勾起我們對這塊土地的親切感。\n\
    —陳冠廷 臺灣竹枝詞簡介"
