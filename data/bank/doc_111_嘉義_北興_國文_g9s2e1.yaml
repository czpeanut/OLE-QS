  stem: 文中缺空處分別代表此四人的原形，根據本文，依序應為下列何者？
  options:
  - label: A
    content: 紡錘、燈臺、麻繩、破鐺（鍋）
  - label: B
    content: 故杵、蠟燭、水桶、破甌（盆）
  - label: C
    content: 故杵、燈臺、水桶、破鐺（鍋）
  - label: D
    content: 故杵、燈油、破鐺（鍋）、水桶。
  group_stem: "寶應中，有元無有，獨行維揚郊野。值日晚，風雨大\n至。時兵荒後，人戶多逃，遂入路旁空莊。須臾霽（１）\n止，斜月方出。未幾，見月中有四人，衣冠皆異，相\n\
    與談諧，吟詠甚暢。其一衣冠長人即先吟曰：「齊紈\n魯縞（２）如霜雪，寥亮高聲予所發。」其二黑衣冠\n短陋人詩曰：「嘉賓良會清夜時，煌煌燈燭我能持。」\n其三故弊黃衣冠人亦短陋，詩曰：「清冷之泉候朝汲\n\
    （３），桑綆（４）相牽常出入。」其四故黑衣冠人詩\n曰：「爨薪（５）貯泉相煎熬，充他口腹我為勞。」四\n人遲明方歸舊所，無有就尋之，堂中惟有□□、□□、\n\
    □□、□□。乃知四人，即此物所為也。（太平廣記 \n元無有） \n【注釋】（１）霽：雨後轉晴。（２）齊紈魯縞：指質\n地細緻的絲織品。（３）汲：自井中取水。（４）綆：\n\
    音ㄍㄥˇ，汲水所用的繩子。（５）爨薪：點火所用的\n柴草。爨，音ㄘㄨㄢˋ。"
