    \  肆中傭保者，見喋聒不堪，遂出錢市一枚，付道士。道士拜謝，謂眾曰︰「出家人不解吝惜。我有佳梨，請出供客。」或曰︰「既有之，何不自食？」曰︰「吾特需此核作種。」於是掬梨大啗。且盡，把核於手，解肩上鑱，坎地上深數寸，納之而覆以土。向市人索湯沃灌。好事者於臨路店索得沸瀋，道士接浸坎處。萬目攢視，見有勾萌出，漸大；俄成樹，枝葉扶疎；倏而花，倏而實，碩大芳馥，纍纍滿樹。道士乃即樹頭摘賜觀者，頃刻向盡。已，乃以鑱伐樹，丁丁良久，方斷。帶葉荷肩頭，從容徐步而去。\n\
    \  初，道士作法時，鄉人亦雜眾中，引領注目，竟忘其業。道士既去，始顧車中，則梨已空矣，方悟適所俵散，皆己物也。又細視車上一靶亡，是新鑿斷者。心大憤恨。急跡之，轉過牆隅，則斷靶棄垣下，始知所伐梨本，即是物也。道士不知所在。一市粲然。\n\
    \                      蒲松齡  聊齋誌異選 種梨"
