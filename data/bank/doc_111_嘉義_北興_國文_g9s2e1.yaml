  group_stem: "風飄飄，雨瀟瀟，便做陳搏也睡不著。懊惱傷懷抱， \n撲簌簌淚點拋。秋蟬兒噪罷寒蛩兒叫，淅零零細雨灑芭。 \n            \
    \                    關漢卿 大德歌 \n註：陳摶，字圖南，自號扶搖子，宋 真源人。五代時\n隱居華山，以善睡聞名，常睡百餘日方起，世人稱之\n\
    為「睡仙」。"
