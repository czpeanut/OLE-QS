- id: doc_113_高雄_五甲_國文_g8s1e1_s4_9
  section: 4
  number: 9
  type: single
  page: 4
  stem: 下列關於郵局「代收貨款服務」之特色說明,何者錯誤?
  options:
  - label: A
    content: 郵局的服務對象限於企業用戶及郵政存簿儲金帳戶者
  - label: B
    content: 郵局提供到府收件服務,不需親自將郵件送至郵局窗口
  - label: C
    content: 全國郵局均提供此項服務
  - label: D
    content: 國內包裹、便利箱(袋)、國內快捷或小包掛號函件皆提供此項服務。
  group_stem: '郵局「代收貨款服務」說明

    ※服務特色

    1. 手續簡便,免申請、免簽約:服務對象不限企業用戶,凡於郵局開立郵政劃撥或存簿儲金帳戶者均可直接使用本服務。

    2. 多項遞送服務可供搭配選擇:郵局之國內包裹、便利箱(袋)、國內快捷及小包掛號函件等均提供本項服務。

    3. 交寄便利:全國郵局均提供本項服務。

    4. 供您一站購足之完整服務:提供您從「窗口收寄 / 上門收件 / 物流倉儲中心出貨」→「遞送」→「貨款收取」→「貨款至遲於次一營業日入帳」之完整服務。

    ※服務流程

    1. 先選擇配送郵件種類:郵局提供國內包裹、便利箱(袋)、國內快捷或小包掛號函件服務。

    2. 按件填寫「代收貨款郵件託運單」:於託運單上註明詳細資料。

    3. 全國送透透:代收貨款之郵件將經由郵局之遞送系統送至全國各地。

    4. 收件人付款前先確認:物品送達時,收件人應確認係其訂購之商品無誤再付款,郵差收取貨款後,將郵件妥交收件人。

    5. 貨款匯入:目前有二種代收貨款入帳方式可供選擇:

    (1)撥存於寄件人之劃撥儲金帳戶。(免再扣收匯費)

    (2)撥存於寄件人之存簿儲金帳戶。(免再扣收匯費)

    (節錄自中華郵政全球資訊網)'
