    content: 西北雨轉成龍捲風
  - label: C
    content: 西北雨愈下愈大
  - label: D
    content: 西北雨造成水災。
  group_stem: '西北雨像個愛捉弄人的頑童。它打著赤腳,在曠野田壟農舍之間奔來跑去,誰見了都要搖頭。

    曾經,你也是個不喜歡穿鞋、走到哪兒玩到哪兒的鄉下半樁小子?【半樁小子:形容不懂人情世故的人】

    南臺灣的老曆六月天,熱得菜葉捲邊的六月天。坐在田畔的榕樹粗幹上,你遙看水牛與白鷺鷥,水牛沒事做,白鷺鷥也閒著;你不忙活,正午的南風裹腳老太【老太:即老太婆】行路似地慢悠悠晃過臉晃過胸口。不須再打呵欠,你眼皮已然垂下……這當頭,西北雨遠遠地放足【放足:放開腳步】飛躍而來了,你聽得分明,還一路呼喝著呢。

    土狗豎起耳朵,顯然牠比你早一點發現事情。得得得得夾帶著絲絲絲絲,聽聲音,你判斷西北雨在兩甲四方田以外;達達達達夾帶著沙沙沙沙,不急,這在五分四方田以外;豆豆豆豆夾帶著嘩嘩嘩嘩,你坐不住了,拔腿就跑。西北雨追在你身後幾丈,拚力地跑,你不停腳地往後看,空中有陽光,照在粗粗實實的雨柱上,土狗在你前面,你想趕過牠,也想不讓西北雨追上,你沒有一次贏過西北雨;跑跑跑跑跑——直到一滴兩滴三滴打在身上微微發疼的雨點提醒你又輸了。

    可是你並不懊惱,你與所有南台灣的小男孩一樣,蟋蟀鬥輸了再抓一隻來,沒什麼丟臉的。反正輸了,放緩腳步吧,土狗在你跟前,類似這種緊急時刻,牠是永遠不會丟下你的,雖然牠身子也溼了。你衣服很快地全溼了,望見家門時,你這才重新快跑,越過稻埕【埕:庭院、場地】,躲在大廳前的雨簷底下。

    免不了要挨母親幾巴掌,母親必是剛剛掩蓋好埕上稻穀,稍稍喘著不輕不重打你幾下屁股;父親站在一旁,似看不看地瞄你一眼,搖搖頭,搖搖手上的竹笠,土狗哈哈哈蹲在廂房過道【過道:指房子與房子或牆與牆之間,可以通行的狹窄道路】邊吐氣。你心中多少有些不甘,下回——,下回鐵定要打敗西北雨!

    (阿盛 西北雨 節選自嘉南平原四題)'
