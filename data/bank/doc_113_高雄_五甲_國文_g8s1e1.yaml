  group_stem: '帝城春欲暮,喧喧車馬度。共道牡丹時,相隨買花去。貴賤無常價,酬值看花數。灼灼【灼灼:牡丹花顏色美艷奪目】百朵紅,戔戔【戔戔:積聚】五束素。上張幄幕庇,旁織笆籬護。水灑復泥封,移來色如故。家家習為俗,人人迷不悟。

