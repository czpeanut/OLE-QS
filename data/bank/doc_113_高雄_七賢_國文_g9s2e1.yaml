  stem: 關於人不可無癖一文的句意說明，下列何者正確？
  options:
  - label: A
    content: 「人無癖，不可與交，以其無深情也」：無癖好者冷血無情，不可與其來往
  - label: B
    content: 「事到可傳皆具癖」：可被記載流傳下來的才是高雅的癖好
  - label: C
    content: 「情必近於痴而始真」：情感要到痴傻的境界才是真情
  - label: D
    content: 「蘭茞蓀蕙之芳眾人之所好，海畔我有逐臭之夫」：情人眼裡出西施，環肥燕瘦各有所好。
