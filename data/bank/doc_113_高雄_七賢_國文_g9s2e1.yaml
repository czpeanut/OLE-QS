  stem: 「香道在宋代發展至巔峰，宮廷與民間都愛香，其中皇帝、官員和文人尤愛沉香，譬如天下第一極品文青宋徽宗，一下朝就急著躲回書房燒爐沉水香，然後專注研磨，提筆臨摹王羲之的書法，孤自清幽。皇帝常以沉香作為賞賜朝臣的禮物，臣子也以身上的香息作為身份象徵，甚至因為太香擄獲龍心而屢被召見，如翰林學士梅詢每次上朝前必先焚兩爐香，薰得公服內兩袖懷香，稟奏要事時兩手一甩，就是滿堂如意了。看來梅詢深諳為官之道，沉香本具通關開竅、暢通氣脈的功效，上書前讓皇帝心平氣和，方不致因錯置一詞而遭怪罪。」（陳健瑜
    文人香癖）根據上文，關於宋代香道的描述，以下哪一項是正確的？
  options:
  - label: A
    content: 只有皇帝能使用沉香作為賞賜，文人和官員並不常用香
  - label: B
    content: 梅詢每次上朝前焚香是為了展示自己對香道的專業知識，而非為了改善與皇帝的關係
  - label: C
    content: 宋徽宗喜愛香道，常在朝後燒爐沉水香，並以此作為靜心修習書法的方式
  - label: D
    content: 文章中提到的沉香有通關開竅、暢通氣脈的效果，但並未提到其對皇帝心境的影響。
