  stem: 「工作上一遇到問題就馬上拋出來，那叫拋展一個燙手山芋，不叫拋出問題，有所準備、思考消化過的才是問題。主管的存在，不是給你當搜尋引擎那樣隨問隨答，空手而來隻顯示出自己的懶惰、不想負責以及未經思考。日子久了，不管是同事還是主管，都會覺得你是一個不經大腦的人，凡事只要伸手，凡事只要出一張嘴。這樣的態度不僅消耗別人，也浪費自己在職場上的時間。」（劉冠吟聯合報決定性的十秒鐘）閱讀本段文字後，下列何者最接近本文主旨？
