- id: doc_113_高雄_七賢_國文_g9s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 「健康大數據、人工智慧（AI）已經成為醫療研發的新聖杯，新型肺炎更將（AI）技術推上防疫舞臺，各國紛紛串聯大數據監控足跡或採用電子圍籬。但當科技防疫介入公衛醫療，我們是否在不知不覺中讓渡了個人隱私？規範不完備是臺灣個資保護的一大隱憂，個資法問世遠早於（AI）時代、去識別化定義不清、缺乏獨立專責監管機構，都是當前課題。」根據本文，下列敘述何者正確？
  options:
  - label: A
    content: 新型肺炎的疫情使人工智慧有了突破性發展
  - label: B
    content: 個資法的訂定早於人工智慧，故尚有待修正
  - label: C
    content: 去識別化的定義已經在個資法中清楚條列出
  - label: D
    content: 臺灣現已擁有獨立專責監管個人資訊的機構。
