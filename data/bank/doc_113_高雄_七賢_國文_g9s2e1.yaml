- id: doc_113_高雄_七賢_國文_g9s2e1_s2_35
  section: 2
  number: 35
  type: single
  page: 6
  stem: 根據文章中「準備定心」的建議，考前學生應該如何調整心態？
  options:
  - label: A
    content: 考前應該加強緊張感，讓自己保持高度警覺
  - label: B
    content: 考前只需放鬆，保持緊繃的狀態，才能發揮最佳實力
  - label: C
    content: 考前要放鬆，避免過度緊張，並利用小物幫助自己穩定心情
  - label: D
    content: 考前應該完全放鬆，不再接觸任何學習資料，讓大腦完全休息。
  group_stem: '國中會考即將到來，面對許多學生第一個大型考試，在考前最後期間，學生可以做哪些最後準備？用什麼樣的心態、狀態來迎戰這個三年學習成果的驗收？

    一、 念書「定時」

    ◇ 每天固定念書時間：建議每天至少念兩到三科。每科不要超過一天完全沒有碰觸。最後一週各科以看重點整理為主，已經比較不適合地毯式的溫習細節。

    ◇ 每天固定練寫題本：盡量每天至少練寫一科模擬考題本。寫題本的時候務必按照會考的時間，例如數學科就是80分鐘內完成，且要預留畫卡和最後檢查一到兩次的時間。寫題本發現錯誤也不必慌張！反而要感謝考試之神幫自己在上正式考場前又找出不熟悉之處，等於多撈回了幾分，簡直太幸運了！

    ◇ 訓練自己的答題速度：考試的結果是「正確率 X 速度」，只要其一偏低，整體結果就會被往下拉。而答題速度要快，請記得，遇到思考兩次還是不確定的題目，勇敢地先跳過！但要記得做記號，以免後面題目畫卡全錯！等全部做完題本、畫卡完畢，若還有時間，再回頭慢慢思考。若開始答題不久就在同一題目上面卡住，導致後面題目來不及好好寫完，得不償失！以英文科來說，盡量從線索當中去找做整體判斷，找出最合適的答案。請避免腦補或過度推論題目沒有提供的訊息！一方面讓自己花太多不必要時間，如此得出的答案也容易有誤。

    二、 複習「定量」

    ◇ 要平均分配各科念書時間嗎？請不要！每個人對於各科的掌握度不盡相同，時間分配要依據自己對於該科的熟悉度做出權重調整，不需要齊頭式的平均分配。但基本建議，至少每兩天內就要接觸到全科一遍。

    ◇ 勘誤錯題本和整體總複習同樣重要：現在很多孩子會針對自己不熟的錯題做整理，幫自己補強不熟悉的區塊，很棒！但請記得，重新複習自己原本認為極熟悉內容也同樣重要！如果一味針對錯題內容加強，卻很久沒有去接觸其他自認原本熟悉的內容，原本的掌握度也可能慢慢降低，卻不自覺！再熟悉的內容，也需要定時快速翻過，以免顧此失彼。

