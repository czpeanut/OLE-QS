  stem: 「習慣為精通創造基礎。下棋時，只有讓基本棋路自動化之後，棋士才能更專注於更高層次的棋藝。每記住一組資訊，就為需要更耗費心力的思考騰出心理空間。這個道理適用所有技藝。當你熟知簡單的動作，到不假思索就能執行的程度，就可以把注意力放在更高階的細節上。習慣便是這樣成為追求任何卓越表現的骨幹」（詹姆斯·克萊爾
    原子習慣）根據這段文字，可明確推論出下列何者？
  options:
  - label: A
    content: 當我們熟練掌握某項技藝後，便可以輕鬆應對所有更高層次的挑戰
  - label: B
    content: 習慣的建立過程不需要花費太多的心理空間和精力
  - label: C
    content: 在學習任何技藝時，基本動作的熟練是達到高層次表現的必要條件
  - label: D
    content: 無論是簡單還是複雜的動作，專注力始終應該集中在細節上，而非基本動作。
