  stem: 恩採常常在睡前滑手機，越滑越不想睡覺，導致上學遲到還需靜坐反思，看完文章後，下定決心要戒除這項壞習慣，請問何者較不適當？
  options:
  - label: A
    content: 讓「提示」隱而不見：將手機的提示音換成自己平常使用的音效
  - label: B
    content: 讓「渴望」毫無吸引力：列舉睡前玩手機的壞處：青光眼、失眠
  - label: C
    content: 讓「行動」困難無比：將手機放在房門口，增加自己與手機的距離
  - label: D
    content: 讓「後果」令人不滿：宣布12點後絕不滑手機，被人抓到要繳罰款。
