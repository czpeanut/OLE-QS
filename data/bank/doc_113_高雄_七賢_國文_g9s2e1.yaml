  stem: 張潮 幽夢影：「藏書不難，能看為難；看書不難，能讀為難；讀書不難，能用為難；能用不難，能記為難。」由此段文字可知張潮對於「書」的看法不包括下列何者？
  options:
  - label: A
    content: 藏書只是開始，真正的困難是找出時間學習知識
  - label: B
    content: 閱讀書籍不只是為了消遣，還要領會其內涵
  - label: C
    content: 讀書不必理解應用，最重要的且最難的是全部記住
  - label: D
    content: 讀書的最高境界是能將書中智慧牢記、身體力行。
