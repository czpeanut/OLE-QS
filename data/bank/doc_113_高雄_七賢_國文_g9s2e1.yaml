  type: single
  page: 6
  stem: 張潮在文中所謂「意之曲折者，宜寫之以顯淺之詞」，意謂要表達深奧複雜、抽象模糊的道理時，必須掌握什麼原則？
  options:
  - label: A
    content: 鉅細靡遺
  - label: B
    content: 自出機杼
  - label: C
    content: 望文生義
  - label: D
    content: 深入淺出。
  group_stem: '作文之法，意之曲折者，宜寫之以顯淺之詞；理之顯淺者，宜運之以曲折之筆。題之熟者，參之以新奇之想；題之庸者，深之以關繫之論。至於奢者舒之使長，縟者刪之使簡，俚者文之使雅，闌者攝之使靜，皆所謂裁制也。

    ——張潮 幽夢影'
