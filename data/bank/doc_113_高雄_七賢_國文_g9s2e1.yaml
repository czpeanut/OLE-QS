    ◇ 考前學生可以做的事：平常要有緊張感，適度壓力會督促人成長；考前反而要放鬆，學到的東西跑不掉，避免過度緊繃的心態容易拿出最佳表現。考前購買的各科重點整理、自製的超精華筆記、爸媽或老師給自己的加油小物，都可以幫助自己穩定下來，知道我真的很努力，而且背後還有這麼多人在守護著自己。

    ◇ 我需要調整作息嗎？如果你常常在早上第一節課的時間感覺昏昏沈沈，那答案當然是肯定的！且請務必至少提早一週開始調整作息，給身體適應的時間！當身體適應了不同的時間表，頭腦才會跟著清醒，考試才可全力發揮。

    最後，願所有考生：勇敢前進、築夢踏實！

    ——改寫自 Ms. 蔡蔡 翻轉教育國中教育會考考前關鍵提醒'
