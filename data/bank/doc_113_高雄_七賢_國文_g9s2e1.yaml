  stem: 中文詞語中的方位詞多有特殊意涵，請問下列含有方位詞的詞語，何者解釋錯誤？
  options:
  - label: A
    content: 「東宮」是古代太子所居住的地方，亦為太子的代稱
  - label: B
    content: 傳統習俗「男左女右」，而古代男尊女卑，故古人尊左而卑右，稱官吏被貶職為「右遷」
  - label: C
    content: 古時主位在東，賓位在西，漢代桓榮為明帝當太子時之師，令其坐西位以示尊敬，後因此稱塾師為「西席」
  - label: D
    content: 自古臣子面「北」朝見天子，因此以「南面」為天子的代稱。
