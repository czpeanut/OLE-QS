- id: doc_113_高雄_七賢_國文_g9s2e1_s2_31
  section: 2
  number: 31
  type: single
  page: 5
  stem: 根據本文，下列誰的說法最接近文章敘述？
  options:
  - label: A
    content: 然竣：戒除掉壞習慣需要仰賴堅強的意志力
  - label: B
    content: 秀彬：人類說要改變，都只是嘴上說說而已
  - label: C
    content: 杋圭：養成習慣和人類大腦的慣性選擇有關
  - label: D
    content: 太顯：自律使我們能主導自己的生活與選擇。
  group_stem: '你是否身邊有人常常嚷嚷著：好胖喔想減肥！好窮喔想存錢！好累喔想早睡！但從來沒看他們改變過？

    大部分的人以為壞習慣很難去掉是因為不夠自律，但事實上可以不用靠自律或是意志力就能輕鬆去掉壞習慣。

    今天就要告訴你：最有效的方法是什麼，如果你也想去掉壞習慣的話，就繼續看下去吧！

    首先你必須知道的是：你的習慣是怎麼建立的？

    習慣就是你重複做一件事，直到你不用思考也能重複做的事。大腦的設定是盡可能節省能量，「不用思考」也就代表「不用花費能量」，所以當在兩個類似選項中抉擇時，人自然傾向選擇花費最少力氣的那個，因此習慣很容易主導我們的生活或選擇。習慣的形成會遵循一定的途徑，這個途徑稱為行為改變的四法則。

    引發習慣的第一個要件就是提示，因此第一個打破迴路的訣竅就是讓這個提示弱化甚至是完全消失。第二個步驟是消除渴望，或是讓原本的渴望不再有吸引力。第三個步驟是回應，也就是你對於提示和渴望會不自覺進行的動作，所以你必須讓這個動作的困難度增加，以降低執行這個動作的意願。第四個步驟是獎賞或懲罰，這是大腦決定是否要形成習慣迴路的最後一步，如果你不想讓習慣形成的話，你就要讓後果令你感到不滿。

    在理解習慣形成的四個步驟後，我們只要針對每個步驟各個擊破就可以成功打破讓習慣成形的迴路，因此順利戒掉壞習慣！

    ——Cheers 快樂工作人網站〈想自律，不能只靠意志力！4個步驟教你無痛戒掉壞習慣〉'
