- id: doc_113_高雄_七賢_國文_g9s2e1_s1_22
  section: 1
  number: 22
  type: single
  page: 3
  stem: 「根據《富比士》的實驗測試，在不同類型的問題上，ChatGPT 搜尋和 Google 搜尋雖各有優勢，但整體來說 ChatGPT 仍略勝一籌。《富比士》指出，雖然
    Google 搜尋也試圖將最佳答案放在最搜尋結果的最前面，但由於必須列出連結，因此無法直接給予使用者完整答案，且搜尋結果還會受到廣告影響；相較之下 ChatGPT
    則能提供更深度、完整的資訊，使用者還能夠依照獲得的資訊進一步提問。例如搜尋某處的推薦景點時，Google 搜尋的第一頁會充斥著 Airbnb、Tripadvisor
    等相關廣告；ChatGPT 則會列出景點、風景、美食等清單。但根據《富比士》的實驗，ChatGPT 雖會附上資料來源，但來源網站的可信度並不看得可靠，因此必須由使用者自行至來源網站檢驗資料真實性。《富比士》認為，Google
    搜尋目前具有的優勢，是擁有悠久的歷史及龐大的產品，包含地圖、天氣等同產品，都能夠相互結合提供使用者更完整的服務。」（節錄公視新聞網）根據上文，ChatGPT
    與 Google 搜尋各有優勢，以下關於兩者的敘述，何者正確？
  options:
  - label: A
    content: Google 搜尋的優勢在於不受廣告影響，能直接提供完整答案
  - label: B
    content: ChatGPT 附所的資料來源皆為可信網站，無須再行查證
  - label: C
    content: ChatGPT 能提供較完整且深度的資訊，並可依據回應進一步提問
  - label: D
    content: Google 搜尋無法與其他產品結合，因此服務較不完整。
