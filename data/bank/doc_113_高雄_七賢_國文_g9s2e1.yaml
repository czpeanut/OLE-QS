- id: doc_113_高雄_七賢_國文_g9s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 所謂「詩莊詞媚曲俗」，詞為宋代文學代表，元曲之體製則較詞活潑自然，無論抒情敘事、寫景狀物，都能酣暢淋漓、極妍盡態，別有尖新質樸之特色。鄭騫先生〈詞曲的特質〉說：「內容風格方面……詞是翩翩佳公子，曲則多少有點兒少氣味。詞所表現的是中國文化的陰柔美，曲所表現的則是中國文化衰落時期一般文人對於現實的反應。」依據上述這些說法，下列選項何者是元曲？
  options:
  - label: A
    content: 青山盡解招人醉，得失到頭皆物理。得，他命裡；失，啥命裡
  - label: B
    content: 庭院深深深幾許？楊柳堆煙，簾幕無重數
  - label: C
    content: 日月忽其不淹兮 春與秋其代序。惟草木之零落兮，恐美人之遲暮
  - label: D
    content: 日出東南隅，照我秦氏樓。秦氏有好女，自名為羅敷。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
