- id: doc_113_高雄_陽明_國文_g8s2e2_s3_31
  section: 3
  number: 31
  type: single
  page: 6
  stem: 關於本文的寫作手法，下列敘述何者錯誤？
  options:
  - label: A
    content: 首段先聚焦於健康，說明運動的重要
  - label: B
    content: 先總論運動的意義及重要性，再透過反面事例針砭國人的怠惰
  - label: C
    content: 引用名言佳句，並適時穿插例證，分述何謂「運動家的風度」
  - label: D
    content: 說明運動家的風度是優秀民族所應努力培養的。
  group_stem: '提倡運動的人，以為運動可以增加個人和民族體力的健康。是的，健康的體力，是一生努力成功的基礎，大家體力不發展，民族的生命力也就衰落下 去。

    古代希臘人以為「健全的心靈，寓於健全的身體」，這也是深刻的理論。身體不健康，心靈容易生病態，歷史上、傳記裡和心理學中的例證太多了。

    這些都是對的，但是運動的精義，還不只此。它更有道德的意義，這意義就是在運動場上養成人生的正大態度、政治的光明修養，以陶鑄優良的民族性。這就是我所謂「運動家的風度」。

    養成運動家的風度，首先要認識「君子之爭」。「君子無所爭，必也射乎。揖讓而升，下而飲，其爭也君子。」這是何等的光明，何等的雍容。運動是要守著一定的規律，在萬目睽睽的監視之下，從公開競爭而求得勝利的，所以一切不光明的態度，暗箭傷人的舉動，和背地裡占小便宜的心理，都當排斥。犯規的行動，雖然可因此得勝，且未被裁判者所覺察，然而這是有風度的運動家所引為恥辱而不屑採取的。

    有風度的運動家，要有服輸的精神。「君子不怨天，不尤人」，運動家正是這種君子。按照正道做，輸了有何怨尤。我輸了只怪我自己不行，等我充實改進以後，下次再來。人家勝了，是他本事好，我只有佩服他，罵他不但無聊，而且是無恥。歐
    美先進國家的人民，因為受了運動場上的訓練，服輸的精神是很豐富的。這種精神，常從體育的運動場上，帶進了政治的運動場上。譬如這次羅斯福與威爾基競選，在競選的時候，雖然互相批評，但是選舉揭曉以後，羅斯福收到第一個賀電，就是威爾基發的。這賀電的大意是：我們的政策，公諸國民之前，現在國民選擇你的，我竭誠的賀你成功。這和網球結局以後，勝利者和失敗者隔網握手的精神一樣。此次威爾基失敗以後，還幫助羅斯福作種種外交活動，一切以國家為前提，這也是值得讚許的。

    有風度的運動家，不但有服輸的精神，而且更有超越勝敗的心胸。來競爭當然要求勝利，來比賽當然想創紀錄。但是有修養的運動家，必定要達到得失無動於衷的境地。運動所重，乃在運動的精神。「勝固欣然，敗亦可喜」，正是重要的運動精神之一，否則就要變成「悻悻然」的小人了！

    有風度的運動家是「言必信，行必果」的人。運動會要舉行宣誓，義即在此。臨陣脫逃，半途而廢，都不是運動家所應有的。「任重而道遠」和「貫徹始終」的精神，應由運動家表現。所以賽跑落後，無希望得獎，還要努力跑到的人，乃是有毅力的人。

    運動家的風度表現在人生上，是一個莊嚴公正、協調進取的人生。有運動家風度的人，寧可有光明的失敗，絕不要不榮譽的成功！

    --羅家倫〈運動家的風度〉'
