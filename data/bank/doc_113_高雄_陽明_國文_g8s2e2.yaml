  stem: 「回文」是上下兩句，詞彙大多相同，但詞序相反的修辭技巧，如：「有村舍處有佳蔭，有佳蔭處有村舍」，請問下列選項何者未運用「回文」修辭？
  options:
  - label: A
    content: 柳庭風靜人眠晝，晝眠人靜風庭柳
  - label: B
    content: 桂林山水甲天下，陽朔山水甲桂林
  - label: C
    content: 文章是案頭之山水，山水是地上之文章
  - label: D
    content: 孤單是一個人的狂歡，狂歡是一群人的孤單
