  group_stem: '在古典文學裡，所謂遊記通常是指一篇遊賞山水的散文，題目也明白標示所遊何地，例如〈遊嶽麓記〉。旅遊當然不限於山水，像元好問的〈濟南行記〉，龔自珍的〈己亥六月重過揚州記〉，便以城市為主；其動機也不必在於遊賞，像程敏政的〈夜渡兩關記〉，戴名世的〈乙亥北行日迅〉，目的只在趕路，沿途的景色和事件只是偶然相值，並非刻意求來。這些都是遊記的支流，主流的遊記仍是志在山水，所以如此。除了大自然能滿足人的美感並消除世務的煩憂之外，還有悠久的文化因素。

    在教育上，中國人素信大自然對性情的陶冶移化之功：孔子就說「知者樂水，仁者樂山。知者動，仁者靜。」司馬遷少時遊蹤遍天下，對他日後的治學著述極有益處。蘇轍〈上樞密韓太尉書〉便說：「太史公行天下，周覽四海名山大川，與燕趙間豪俊交遊。故其文疏蕩，頗有奇氣。」在同一封信中蘇轍又自恨寡陋，願多遊歷以開拓胸襟：「所見不過數百里之間，無高山大野可登覽以自廣……恐遂汩沒，故決然舍去，求天下奇聞壯觀，以知天地之廣大。」語云：「讀萬卷書，行萬里路。」足見名山大川之遊，正是讀書人修養的要道。

    在政治上，讀書人雖從儒家先憂後樂，以天下為己任。但在情操上卻最推崇「功成而不居」的退隱人物，如范蠡、張良之輩。李商隱詩「永憶江湖歸白髮，欲回天地人扁舟」所詠，正是此意。就算一時不能挂冠歸田，也要「百重堆案制身閑」，乘機多近自然。身逢亂世，為了逃避暴政或異族統治，有為的儒者也被迫變成逸民，隱跡江湖。有心仕進的人，更是בע一生在宦遊、赴任、遷調、
    貶謫的途中。蘇軾便是典型的例子，曾經自歎「此生定向江湖老，默數淮中十往來。」但是貶官之禍往往成了遊客之福，所以蘇軾在飽啖荔枝之餘，又不禁自喜「南來萬里真良圖」。柳宗元如果不遠謫，我們也讀不到〈永州八記〉了。

    節錄自余光中〈杖底煙霞――山水遊記的藝術＞'
