  type: single
  page: 2
  stem: 關於〈張釋之執法〉一文的寫作手法，下列敘述何者錯誤？
  options:
  - label: A
    content: 全文運用順敘法記敘歷史事件，以旁觀者的立場寫作
  - label: B
    content: 以文中人物的對話，生動刻畫文帝與張釋之的性格與想法
  - label: C
    content: 以文帝態度的「變」與張釋之的「不變」對比，凸顯張釋之不知變通
  - label: D
    content: 「君臣論辯」是全文最精采之處。
