      chapter: null
    textbook: 八下 第四課 我所知道的康橋
    labeled_by: ai
- id: doc_113_高雄_陽明_國文_g8s2e2_s2_9
  section: 2
  number: 9
  type: single
  page: 2
  stem: 〈我所知道的康橋〉中「遠近的炊煙，彷彿朝來人們的祈禱，參差地翳入了天聽」，是以「聽覺」摹寫表現「視覺」摹寫，下列何句的感官移轉方式與此相同？
  options:
  - label: A
    content: 馬蹄聲，孤獨又憂鬱的自遠至近，灑落在沉默的街上成白色的小花朵
  - label: B
    content: 我為那燃燒著強烈睡欲的眼神所懾，那眼神充滿陰冷的寒意
  - label: C
    content: 巷子深處，有孤獨的鞋聲響起，蕭瑟如秋天的落葉，緩緩飄墜
  - label: D
    content: 光與影有著和諧的旋律，像梵婀玲上奏著的名曲
