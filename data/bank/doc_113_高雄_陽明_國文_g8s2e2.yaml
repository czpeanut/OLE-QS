- id: doc_113_高雄_陽明_國文_g8s2e2_s2_5
  section: 2
  number: 5
  type: single
  page: 1
  stem: 陽明影視製作團隊，計畫以英國 康橋作為拍攝場景，他們參考了〈我所知道的康橋〉一文，請問下列何者的解讀最恰當？
  options:
  - label: A
    content: 「關心石上的苔痕、關心敗草裡的鮮花……」：連用多個「關心」，表現作者急於了解自然的運轉，不斷尋訪春天是否來臨
  - label: B
    content: 引用「傳呼快馬迎新月，卻上輕輿趁晚涼」:用來述說作者趁著夜晚涼風，在月下騎車的風流經驗
  - label: C
    content: 文末用「這草田變成了……」:是因為作者對眼前的景象，無言以對而故弄玄虛，留給讀者想像的空間
  - label: D
    content: 「我心頭頓時感著神異性的壓迫，我真的跪下了，對著這冉冉漸隱的金光」:是作者看見夕陽在放牧歸來的羊群背後，放射著萬縷金輝，因而感到震撼與讚嘆
  lesson_raw:
    title: 我所知道的康橋
    basis: 題幹提及〈我所知道的康橋〉
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 國文
      code: 第四課
      title: 我所知道的康橋
      chapter: null
    textbook: 八下 第四課 我所知道的康橋
    labeled_by: ai
