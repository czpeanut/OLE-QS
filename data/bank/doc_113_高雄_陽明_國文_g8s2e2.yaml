- id: doc_113_高雄_陽明_國文_g8s2e2_s3_44
  section: 3
  number: 44
  type: single
  page: 10
  stem: 根據本文， 徐志摩去歐洲時的心境， 與下列何者最相近？
  options:
  - label: A
    content: 樹蔭底下微風徐徐，吹走了幾分熱氣。我躺下，感受著這一刻的寧靜
  - label: B
    content: 陽光燦爛，鳥兒的鳴叫顯得格外動聽，溫柔的春風像母親溫暖的雙手
  - label: C
    content: 興奮和激動如同決了堤的洪水，浩浩蕩蕩，嘩嘩啦啦地從心裡傾瀉而出
  - label: D
    content: 品一盞茶，如同品一段人生，淡中有思，思中有悟，點滴回味，點滴人生
  group_stem: '我處境是向來順的，現在，如其有不同，只是更順了的。那麼為什麼這變遷？遠的不說，就比如我年前到歐洲去時的心境：啊！我那時還不是一隻初長毛角的野鹿？什麼顏色不激動我的視覺，什麼香味不興奮我的嗅覺？我記得我在義大利寫遊記的時候，情緒是何等的活潑，興趣何等的醇厚，一路來眼見耳聽心感的種種，那一樣不活栩栩的叢集在我的筆端爭求充分的表現！

    如今呢？我這次到南方去，來回也有一個多月的光景，這期內眼見耳聽心感的事物也該有不少。我未動身前，又何嘗不自喜此去又可以有機會飽餐西湖的風色，鄧尉的梅香――單提一兩件最合我脾胃的事。有好多朋友也曾期望我在這閒暇的假期中採集一點江南風趣，歸來時，至少也該帶回一兩篇爽口的詩文，給在北京泥土的空氣中活命的朋友們一些清醒的消遣。但在事實上不但在南中時我白瞪著大眼，看天亮換天昏，又閉上了眼，拚天昏換天亮，一枝禿筆跟著我涉海去，又跟著我涉海回來，正如巖洞裡的一根石筍，壓根兒就沒一點搖動的消息；就在我回京後這十來天，任憑朋友們怎樣的催促，自己良心怎樣的責備，我的筆尖上還是滴不出一點墨沉來。我也曾勉強想想，勉強想寫，但到底還是白費！可怕是這心靈驟然的呆頓。完全死了不成？我自己在疑惑。

    說來是時局也許有關係。我到京幾天就逢著空前的血案。五卅事件發生時我正在義大利山中，採茉莉花編花籃兒玩，翡冷翠山中只見明星與流螢的交喚，花香與山色的溫存，俗氛是吹不到的。直到七月間到了倫敦，我才理會國內風光的慘淡，等得我趕回來時，設想中的激昂，又早變成了明日黃花；看得見的痕跡只有滿城黃牆上墨彩斑斕的「泣告」。

    (節錄自徐志摩 《自剖》)'
