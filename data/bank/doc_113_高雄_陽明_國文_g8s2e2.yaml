  stem: 根據本文，下列何者最符合作者的看法？
  options:
  - label: A
    content: 真正的友情脫離世俗利益權力的糾葛，因此得以歷久彌堅、愈陳愈香
  - label: B
    content: 人想要保持距離，是因為想擺脫過於濃厚煩人的友情，追尋個人自由
  - label: C
    content: 為了刻意淡化友情，將笑容、握手等禮儀表現得拘謹，往往令人生厭
  - label: D
    content: 「 君子之交淡如水」， 能夠使友情細水長流，是最為高明的交友態度
  group_stem: '真正的友情因為不企求什麼不依靠什麼，總是既純淨又脆弱。

    世間的一切孤獨者也都遭遇過友情，只是不知鑑別和維護，一一破碎了。

    為了防範破碎，前輩們想過很多辦法。

    一個比較軟的辦法是淡化友情。出於對友情穩固性的不信任，只能用稀釋濃度來求得延長。不讓它凝結成實體，它還能破碎得了麼？「君子之交淡如水」，這種高明的說法包藏著一種機智的無奈。怕一切許諾無法兌現，於是不作許諾；怕一切歡晤無法延續，於是不作歡晤，只把微笑點頭維繫於影影綽綽之間。有人還曾經借用神秘的東方美學來支持這種態度：只可意會，不可言傳；不著一字，盡得風流；羚羊掛角，無跡可尋……這樣一來，友情也就成了一種水墨寫意，若有若無。但是，事情到了這個地步，友情和相識還有什麼區別？這與其說是維護，不如說是窒息，而奄奄一息的友情還不如沒有友情，對此我們都深有體會。在大街上，一位熟人彬彬有禮地牽了牽嘴角向我們遞過來一個過於矜持的笑容，為什麼那麼使我們膩煩，寧肯轉過臉去向一座塑像大喊一聲早安？在宴會裡，一位客人伸出手來以示友好卻又在相握之際繃直了手指以示淡然，為什麼那麼使我們噁心，以致恨不得到水池邊把手洗個乾淨？

    ――改寫自余秋雨〈關於友情〉'
