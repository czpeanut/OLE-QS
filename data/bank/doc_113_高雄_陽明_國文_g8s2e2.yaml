- id: doc_113_高雄_陽明_國文_g8s2e2_s3_34
  section: 3
  number: 34
  type: single
  page: 7
  stem: 本文主旨可用下列何者概括？
  options:
  - label: A
    content: 屢敗屢戰
  - label: B
    content: 軍令如山
  - label: C
    content: 草木皆兵
  - label: D
    content: 婦人之仁。
  group_stem: 春秋時期，孫武向吳王闔閭獻《兵法》十三篇，吳王稱善，並想觀看實際的應用。於是，從宮中挑選宮女分作兩隊，以吳王的兩名寵妃為隊長，進行操練。孫武講明紀律，擊鼓演習，眾宮女譁笑不止。三令五申，宮女依然不守約束，孫武說：「軍令不明，是將領的責任，軍令申明之後，依然譁亂，就是軍士的罪責。」於是命令將兩個隊長斬首。吳王看到孫武要斬自己的寵妃，連忙派人勸阻。孫武回答道：「將在外，君命有所不受。」就把兩寵妃斬首，然後再進行操練。全軍肅然整齊。
    〈孫武練兵〉
