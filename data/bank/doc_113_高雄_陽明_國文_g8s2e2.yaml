- id: doc_113_高雄_陽明_國文_g8s2e2_s2_13
  section: 2
  number: 13
  type: single
  page: 2
  stem: '對人恭敬的稱呼用語，稱為「敬稱詞」；謙遜的自稱用語，稱為「謙稱詞」。

    下列「 」中的敬詞、謙詞，何者使用正確？'
  options:
  - label: A
    content: 竭誠邀請老友於本週末晚上六點蒞臨，將使「貴府」蓬蓽生輝
  - label: B
