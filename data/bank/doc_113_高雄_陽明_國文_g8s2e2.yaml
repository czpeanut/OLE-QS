- id: doc_113_高雄_陽明_國文_g8s2e2_s2_8
  section: 2
  number: 8
  type: single
  page: 2
  stem: 徐志摩說：「數大了似乎按照著一種自然律，自然地會有一種特別的排列，一種特別的節奏，一種特殊的式樣，激動我們審美的本能，激發我們審美的情緒。」下列選項，何者不屬於這種「壯闊之美」的景致？
  options:
  - label: A
    content: 一天的繁星，千萬隻閃亮的神眼，從無極的藍空中下窺大地，是美
  - label: B
    content: 放眼望去，盛開的金針花如波浪般，與豪氣的縱谷山脈交織成色彩斑斕的黃金海浪
  - label: C
    content: 池上的雲千變萬化，有時候是藍天上一綹一綹向上輕颺升起的雲，像溫柔的絲絮
  - label: D
    content: 海岸山脈的雲跟隨太平洋的風，翻山越嶺，突然像瀑布一樣，形成壯觀的雲瀑
  lesson_raw:
    title: 我所知道的康橋
    basis: 引用徐志摩〈我所知道的康橋〉
  tags:
