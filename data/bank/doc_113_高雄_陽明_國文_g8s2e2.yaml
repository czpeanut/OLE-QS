    豆類食材則以市場上常見的小方豆干含鈣量最佳，以一塊豆干約 40～50 克計算，只要2～2.5 塊，就能攝取到 685mg 鈣質，超過一天所需的一半。至於豆腐和豆漿，劉怡里強調，雖然因為水分較多，單位含鈣量不如豆干，但是其中的大豆異黃酮可以促進骨質合成，因此對骨骼有保護效果，對於不喝牛奶的人來說，改喝豆漿是個好選擇。

    二、多吃堅果種子，黑芝麻最優

    臺安醫院推行的新起點飲食就是無蛋、奶料理，劉怡里常以各式堅果打碎拌入料理中，除了攝取不飽和好脂肪之外，也能補充一部份的鈣質。

    其中尤以黑芝麻的含鈣量最豐富，100 克就有 1456mg 的鈣質，劉怡里建議，平時撒在白飯上就很美味。不過，她也提醒，堅果類屬於油脂類食物，攝取時必須替換原有油脂量，以免吃下過量脂肪。

    三、別忘了多吃富含維生素Ｃ的水果

    維生素 C 能幫助膠原蛋白形成，有助骨骼健康，也可以促進腸道對鈣質的吸收，因此平時別忘了多吃富含維生素Ｃ的新鮮蔬果，例如芭樂、奇異果、小番茄都是很好的選擇。

    不過，臺北市立聯合醫院 陽明院區營養師陳芝諺也提醒，許多人吃高劑量維他命Ｃ保健食品，導致維生素Ｃ的代謝物「草酸」干擾鈣質吸收，因此她提醒，每天吃維他命Ｃ補充劑不應超過
    2000mg，並且應多喝水，使身體無法分解吸收的多餘維生素Ｃ隨尿液排出，以免影響鈣質吸收。

    四、少量多次攝取，比一餐吃足高鈣好

    將一天所需的 1000mg 鈣質分散在各餐食用，而不是一次吞下高劑量的鈣。劉怡里解釋，這是因為人體有自行調節的能力，因此當我們一次吃下高劑量的鈣質時，身體的吸收率會降低，也就是說，鈣的吸收率和攝取量呈反比。因此，每餐都攝取到適量鈣質，讓身體穩定吸收，是比較有效的補鈣方法。

    五、避免導致鈣流失的地雷食物，避免四幫兇

    陳芝諺提醒，酗咖啡、飲酒過量、嗜吃重口味、以及愛喝碳酸飲料，都是加速鈣質流失的幫兇。

    ●酗咖啡：過多咖啡因會增加鈣質流失於尿中。衛生署建議，每人每日咖啡因攝取量以不超過 300mg 為原則，約為 2 杯咖啡。

    ●飲酒過量：男生每天超過 2 當量（如：紅酒 300 ㏄）女生每天超過 1 當量（如：紅酒 150 ㏄）再加上飲食失衡，會使骨質密度降低。

    ●重口味：過多的鈉攝取會增加鈣質流失於尿中。

    ●愛喝碳酸飲料：碳酸飲料含磷量高，長期下來血液中磷的濃度升高，人體就會將儲存在骨骼中的鈣釋出，以保持鈣、磷比例的平衡。長期下來，就會引發骨鈣不足和骨質流失的問題。

    節選自：《康健雜誌》 林慧淳'
