- id: doc_113_高雄_陽明_國文_g8s2e2_s2_10
  section: 2
  number: 10
  type: single
  page: 2
  stem: 行文時，為了使語意更加簡單扼要，時常會將連接詞去掉，但在語意的理解上，卻必須將連接詞帶上，使語意變得完整清楚。例如：「『因為』嫵媚的康河也望不見蹤跡，『所以』你只能循著那錦帶似的林木想像那一流清淺。」此處加上「因為……所以……」並不影響語意的表達。下列句子何者加入「因為……所以……」後，反而改變原本的語意？
  options:
  - label: A
    content: 「因為」這早起是看炊煙的時辰，「所以」朝霧漸漸升起，揭開了這灰蒼蒼的天幕
  - label: B
    content: 「因為」可愛的路政，「所以」這裡哪一處不是坦蕩蕩的大道
  - label: C
    content: 「因為」在康橋騎車是普通的技術，「所以」婦人、稚子、老翁，一致享受這雙輪舞的快樂
  - label: D
    content: 「因為」這道上有的是清蔭與美草，「所以」隨地都可以供你休憩
  lesson_raw:
    title: 我所知道的康橋
    basis: 引用〈我所知道的康橋〉課文內容
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 國文
      code: 第四課
      title: 我所知道的康橋
      chapter: null
    textbook: 八下 第四課 我所知道的康橋
    labeled_by: ai
