  group_stem: '請閱讀以下資料並回答第 62 至 63 題：


    資料一：魏晉南北朝後期盛傳：「上車不落則著作，體中何如則秘書」。意思是只要到了坐上車不會跌落的年紀，便可當著作郎（官名），會寫簡單的問候信，就可被選為秘書郎（官名），這是諷刺世家子弟可憑家世任官。

    資料二：唐代初年，藉由科舉入仕的平民宰相，所占比例不超過一成；但到了唐代後期，其比例已經超過八成。

    （參考資料：梁庚堯，中國社會史。）'
