- id: doc_113_屏東_明正_社會_g8s1e1_s3_64
  section: 3
  number: 64
  type: single
  page: 5
  stem: 文中的胡族「甲」為下列哪一民族？
  options:
  - label: A
    content: 鮮卑
  - label: B
    content: 匈奴
  - label: C
    content: 突厥
  - label: D
    content: 吐蕃
  group_stem: '請閱讀下方短文並回答第 64 至 66 題：


    草原民族的傳統文化與南方農業民族大相逕庭，在古代中國，有一支胡族「甲」曾與秦、漢兩大帝國分庭抗禮。漢朝更為抵禦這支民族，聯絡西域各國抵制，打通東西要道，外來宗教由此路傳入中國，間接開創文化交流的新局面。這支胡族的勢力最後趁著中國的亂局，攻陷了當時中國的首都洛陽，造成農業民族的南遷，以及胡族入主中原。

    在進入中原的胡族當中，以「乙」族建立的政權勢力最盛，其推動了漢化政策，對胡漢融合有關鍵性的作用。後來的隋唐帝國，即是承繼了這支民族的文化，締造輝煌的盛世。

    （參考資料：林俊雄，草原王權的誕生：斯基泰與匈奴，早期游牧國家的文明。）'
