  group_stem: 'The New York Times is very furious with OpenAI and Microsoft. It believes
    that these companies'' super-smart computers are stealing the newspaper''s ideas
    without asking. To protect the copyrights, it''s the first time that a main American
    media brought a lawsuit against the companies behind chatbot. It clearly shows
    that the copyright issue is very important in the age of AI.

    According to The Times, OpenAI and Microsoft are using a large number of its articles
    to teach their computers without permission or payment. The New York Times thinks
    it''s very unfair because their writers worked hard to write those articles. Even
    after The Times kindly asked OpenAI and Microsoft to stop using their articles,
    they didn''t pay attention to what was asked.

    The newspaper is asking OpenAI and Microsoft for billions of dollars for the damage
    and wants these two companies to stop using the articles right away. The case
    shows how it is important to have balance between chatbot training and copyrights.

