- id: doc_113_高雄_英明_英語_g9s2e1_s3_48
  section: 3
  number: 48
  type: single
  page: 8
  stem: "Mark is a 7-11 clerk and Tiffany is a famous singer. According to the reading,\
    \ what types of people  \n    are they?"
  options:
  - label: A
    content: Mark- “I-shaped”; Tiffany- a generalist.
  - label: B
    content: Mark- a generalist; Tiffany- “I-shaped.”
  - label: C
    content: Mark- “T-shaped”; Tiffany- “I-sharped.”
  - label: D
    content: Mark- “I-sharped”; Tiffany- “I-sharped.”
  group_stem: 'What is your career plan? What do you want to be in the future? A specialist
    or a generalist? Or Both? If you want to be both, then you’ll be a T-shaped person.
    What is a T-shaped person? Look at the following picture


    A generalist is someone who has good knowledge of many different areas. On the
    other hand, an “I-shaped” person which is also called a specialist is someone
    who focuses deeply on one thing. They put a lot of time into becoming experts
    in their chosen field. For example, a specialist might spend years studying and
    practicing just one subject, like a scientist who focuses on studying butterflies.
    A "T-shaped" person is like a combination of a generalist and a specialist. "T-
    shaped" people are super good at one thing, but they also know a little about
    lots of other things.

    In the following example of Rex and May, you’ll see how a specialist is different
    from a generalist and what a T-shaped person is. Both Rex and May are doctors,
    but they take care of different patients.


    If May wants to be a “T-shaped” doctor, she will have to be very skillful in one
    area like Rex, too.

    Specialists and generalists may work in different businesses. Small businesses
    usually need people who can do a lots of things. On the other hand, large companies
    usually need people who are professional in one thing. In this way, T- shaped
    people will surely have better opportunities than others.

    When you are young, it may be easier to be a generalist, but when you have more
    work experiences, you many think about working harder and learning more to be
    a specialist or a T-shaped person.

     specialist 專家  generalist 通才  skillful 純熟的  combination 合併  patient 病人

    general 一般的    professional 專業的  opportunity 機會'
