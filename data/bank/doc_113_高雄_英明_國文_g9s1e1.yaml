questions:
- id: doc_113_高雄_英明_國文_g9s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 下列「」中的注音，何組寫成國字後皆不相同？
  options:
  - label: A
    content: 「ㄏㄜˋ」槍實彈／握鋤「ㄏㄜˋ」犁／「ㄏㄜˋ」ㄏㄜˋ有名
  - label: B
    content: 一「ㄑㄩㄝˋ」詞／天子宮「ㄑㄩㄝˋ」／拾遺補「ㄑㄩㄝ」
  - label: C
    content: 「ㄅㄛˊ」得喝采／「ㄅㄛˊ」大精深／壯碩胳「ㄅㄛˊ」
  - label: D
    content: 瑕不掩「ㄩˊ」／揶「ㄩˊ」嘲弄／至死不「ㄩˊ」
- id: doc_113_高雄_英明_國文_g9s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列「 」中的字，何者讀音正確？
  options:
  - label: A
    content: 吳「晟」：ㄔㄥˊ
  - label: B
    content: 吟「哦」：ㄛˊ
  - label: C
    content: 兜「鍪」：ㄇㄠˊ
  - label: D
    content: 「幾」多愁：ㄐㄧ
- id: doc_113_高雄_英明_國文_g9s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 下列選項「」中的字音，何者兩兩相同？
  options:
  - label: A
    content: 遁入空門的他穿起「袈」裟，潛心修行／他膝蓋的傷口已經結「痂」，沒有大礙
  - label: B
    content: 這本書資料詳實，內容鉅細「靡」遺／這個家傳的玉鐲對我來說可是意義非凡，「彌」足珍貴
  - label: C
    content: 這座水晶宮雕欄玉「砌」，別具一格／我習慣以優雅的「沏」茶來開始我的每一天
  - label: D
    content: 巴黎羅浮宮內陳列各種收藏，遊客莫不「嘖」嘖讚嘆／有些蔬菜、水果經過醃「漬」後，風味更佳
- id: doc_113_高雄_英明_國文_g9s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 「如果說九二一大地震，為臺灣社會帶來了什麼新學習，也許以更健全、開放的態度面對生命與死亡的課題，正是其中一項。第一步，就是面對和承認傷痛。」這段話的涵義，下列何者說明正確？
  options:
  - label: A
    content: 只要能面對傷痛就會知道該如何面對死亡
  - label: B
    content: 九二一大地震只帶給我們生命與死亡的學習
  - label: C
    content: 正視問題才可能有機會找出解決方法
  - label: D
    content: 承認九二一的存在就是一種健全開放的態度
  lesson_raw:
    number: 第1課
    title: 與921說再見：20年的生命練習題
    basis: 引用課文
- id: doc_113_高雄_英明_國文_g9s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 下列選項「」中的字，何者字義前後相同？
  options:
  - label: A
    content: 「赤」手空拳／「赤」膽忠心
  - label: B
    content: 千古興「亡」／「亡」羊補牢
  - label: C
    content: 冤冤相報何時「了」／「了」無生趣
  - label: D
    content: 「沿」街叫賣／「沿」著田畝
- id: doc_113_高雄_英明_國文_g9s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 下列「」中的詞性，何者前後相同？
  options:
  - label: A
    content: 這碗餛飩湯就像「溫暖」的冬陽，「溫暖」了我的身心
  - label: B
    content: 「自由」選擇工作，是憲法賦予我們每一個人的「自由」
  - label: C
    content: 你沒事就大獻「殷勤」，不得不令人懷疑你的「殷勤」是否另有居心
  - label: D
    content: 有些社福人員標榜「人道」，私下卻藉機斂財，盡做些不「人道」的事
- id: doc_113_高雄_英明_國文_g9s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 下列文句，何者用字完全正確？
  options:
  - label: A
    content: 一場突如其來的狂暴風雨，蝕盡農夫所有勤勤懇懇的耕耘
  - label: B
    content: 房屋倒塌的災難情景，至今仍是曆曆在目，連聲音都十分清晰
  - label: C
    content: 瓦爍堆中的求生術，就是要不斷敲打身邊的牆面或聲音較大的器物
  - label: D
    content: 回想當時天崩地折的一瞬間，腳底傳來一陣冷冽感，一直擴散到頭頂
- id: doc_113_高雄_英明_國文_g9s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 關於土這一首詩，下列何者說明不正確？
  options:
  - label: A
    content: 詩中的土，是農人胼手胝足、辛勤工作的地方，是農家生活的全部依靠
  - label: B
    content: 「揮汗吟哦自己的吟哦」指作者代替農民發聲，抒發他們內心的不平
  - label: C
    content: 祈願死後成為大地的一部分，以此表達他對土地至死不渝的熱忱
  - label: D
    content: 具體呈現農民辛勞耕種的形象，及樸實認命、知足感恩的生存哲學
  lesson_raw:
    number: 第2課
    title: 土
    basis: 題目指名「土這一首詩」
- id: doc_113_高雄_英明_國文_g9s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 下列紅樓國中四位同學介紹「詞」的格律，誰的說明最正確？
  options:
  - label: A
    content: 寶玉：詞受胡樂、市井民歌影響而產生，又可稱為「詞餘」、「樂府」或「長短句」
  - label: B
    content: 探春：每首詞的平仄並沒有一定限制，是元代文學的代表，為中國四大韻文之一
  - label: C
    content: 寶釵：詞先有曲調，然後再依曲譜填入歌詞，所以可合樂歌唱，押韻則依詞牌規定
  - label: D
    content: 黛玉：每首詞皆有調名，稱為詞牌，而詞牌名大多是根據詞的內容來做決定的
  lesson_raw:
    number: 第3課
    title: 詞選
    basis: 詞選語文常識
- id: doc_113_高雄_英明_國文_g9s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 「東風夜放花千樹。更吹落，星如雨。」（辛棄疾 青玉案）請問詞中描寫節慶和下列何者相同？
  options:
  - label: A
    content: 老去又逢新歲月，春來更有好花枝
  - label: B
    content: 平分秋色一輪滿，長伴雲衢千里明
  - label: C
    content: 不效艾符趨習俗，但祈蒲酒畫昇平
  - label: D
    content: 千門開鎖萬燈明，正月中旬動地京
- id: doc_113_高雄_英明_國文_g9s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 以鄉土的語言，寫作鄉土的人、事、物，來表達濃厚的鄉土感情，是「鄉土詩」最大的特色。下列詩句，何者不屬於鄉土詩？
  options:
  - label: A
    content: 不在意遠方城市的文明／怎樣嘲笑，母親／在我家這片田地上／用一生的汗水，灌溉她的夢
  - label: B
    content: 以那樣虔誠的跪姿／溫柔的抹去雜草／再彎下那樣虔誠的腰／灑呀！灑呀！灑呀／一桶一桶的肥料
  - label: C
    content: 一吐舌，泥土的香腥味／捲著玉米、番薯、龍眼、芒果／稻米、桂花、文旦、芭樂的氣息
  - label: D
    content: 溪水急著要流向海洋／浪潮卻渴望重回土地／在綠樹白花的籬前／曾那樣輕易地揮手道別
- id: doc_113_高雄_英明_國文_g9s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 若說李煜的詞風以亡國前後做為一個分水嶺，前期風格多描寫宮廷歡樂生活，綺麗溫軟；後期多抒亡國之痛，哀怨淒絕。依此判斷，下列節選詞句，何者應是李煜後期的作品？
  options:
  - label: A
    content: 晚妝初了明肌雪，春殿嬪娥魚貫列。鳳簫吹斷水雲間，重按霓裳歌遍徹
  - label: B
    content: 花明月暗飛輕霧，今宵好向郎邊去。剗襪步香階，手提金縷鞋。畫堂南畔見，一向偎人顫
  - label: C
    content: 雁來音信無憑，路遙歸夢難成。離恨恰如春草，更行更遠還生
  - label: D
    content: 曉妝初過，沉檀輕注些兒個。向人微露丁香顆，一曲清歌，暫引櫻桃破
  lesson_raw:
    number: 第3課
    title: 詞選
    basis: 李煜詞相關概念
- id: doc_113_高雄_英明_國文_g9s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 「年少萬兜鍪，坐斷東南戰未休。天下英雄誰敵手？曹 劉。生子當如孫仲謀。」關於上述文句的說明，何者正確？
  options:
  - label: A
    content: 年少萬兜鍪，坐斷東南戰未休：指戰火連綿不斷，國力衰微
  - label: B
    content: 天下英雄誰敵手？曹 劉：藉曹操、劉備凸顯孫權的英雄形象
  - label: C
    content: 生子當如孫仲謀：期望兒子能繼承己志，成就光復神州大業
  - label: D
    content: 旨在感嘆戰亂使得人民流離失所，抒發對太平盛世的渴望
  lesson_raw:
    number: 第3課
    title: 詞選
    basis: 引用辛棄疾〈南鄉子〉課文
- id: doc_113_高雄_英明_國文_g9s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: '以下關於李煜 虞美人和辛棄疾 南鄉子兩首詞的比較，何者正確？

    【甲】、皆運用問答方式書寫

    【乙】、皆是一韻到底，沒有換韻

    【丙】、作者皆是南宋時人

    【丁】、皆透過歌詠古人來抒發己志

    【戊】、皆以無盡江水抒發愁緒

    【己】、皆是抒發國破家亡的悲痛

    【庚】、兩首字數依照體制皆是小令

    【辛】、兩首除詞牌名外，皆另有題目

    【壬】、虞美人善用對比，南鄉子活用典故'
  options:
  - label: A
    content: 甲戊庚壬
  - label: B
    content: 甲乙庚辛
  - label: C
    content: 乙戊己壬
  - label: D
    content: 丙戊丁辛
  lesson_raw:
    number: 第3課
    title: 詞選
    basis: 比較李煜〈虞美人〉與辛棄疾〈南鄉子〉課文
- id: doc_113_高雄_英明_國文_g9s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: '驛外斷橋邊，寂寞開無主。已是黃昏獨自愁，更著風和雨。

    無意苦爭春，一任群芳妒。零落成泥碾作塵，只有香如故。 （陸游 卜算子 詠梅）

    本闋詞藉詠梅以抒懷，詞中哪一句最能看出陸游堅守高尚節操的心志？'
  options:
  - label: A
    content: 驛外斷橋邊，寂寞開無主
  - label: B
    content: 已是黃昏獨自愁，更著風和雨
  - label: C
    content: 無意苦爭春，一任群芳妒
  - label: D
    content: 零落成泥碾作塵，只有香如故
- id: doc_113_高雄_英明_國文_g9s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 吳晟 土的詩句「滴不盡的汗漬／寫上誠誠懇懇的土地」其中詩意相近似於下列何者？
  options:
  - label: A
    content: 斜陽照墟落，窮巷牛羊歸。野老念牧童，倚杖候荊扉
  - label: B
    content: 開軒面場圃，把酒話桑麻。待到重陽日，還來就菊花
  - label: C
    content: 羈鳥戀舊林，池魚思故淵。開荒南野際，守拙歸園田
  - label: D
    content: 雨足高田白，披蓑半夜耕。人牛力俱盡，東方殊未明
  lesson_raw:
    number: 第2課
    title: 土
    basis: 引用吳晟〈土〉詩句
- id: doc_113_高雄_英明_國文_g9s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: '「談經論道」與「說賢話聖」都是屬於「句中對」的對偶修辭。請判斷下列哪幾個屬於句中對？

    (甲)壓抑悲傷(乙)街頭巷尾(丙)路崩橋斷(丁)雕梁畫棟(戊)明查暗訪(己)山河變色'
  options:
  - label: A
    content: 甲乙丙丁
  - label: B
    content: 甲乙戊己
  - label: C
    content: 乙丙丁戊
  - label: D
    content: 丙丁戊己
- id: doc_113_高雄_英明_國文_g9s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 古詩、近體詩及詞都是中國文學上的重要文體，關於這三種文體的比較，下列敘述何者正確？
  options:
  - label: A
    content: 近體詩和詞的字數皆是固定不變，古詩則不拘
  - label: B
    content: 詩題與詞牌都可看出作品的主旨涵義
  - label: C
    content: 三者皆須押韻，但是用韻方式各有不同
  - label: D
    content: 三者皆按曲譜創作，以呈顯音韻之美
  lesson_raw:
    number: 第3課
    title: 詞選
    basis: 韻文文體比較
- id: doc_113_高雄_英明_國文_g9s1e1_s1_19
  section: 1
  number: 19
  type: single
  page: 3
  stem: 下列何者為與 921 說再見：20 年的生命練習題一文的主旨？
  options:
  - label: A
    content: 敘述兒福聯盟在九二一前後的付出
  - label: B
    content: 陳述九二一倖存者面對傷痛的歷程
  - label: C
    content: 報導九二一倖存失依兒的生涯發展
  - label: D
    content: 說明民間基金會如何參與災後重建
  lesson_raw:
    number: 第1課
    title: 與921說再見：20年的生命練習題
    basis: 題目指名課名〈與921說再見：20年的生命練習題〉
- id: doc_113_高雄_英明_國文_g9s1e1_s1_20
  section: 1
  number: 20
  type: single
  page: 3
  stem: '昨日入城市，歸來淚滿巾。遍身羅綺者，不是養蠶人 。 （張俞 蠶婦）

    關於此詩的說明，下列何者正確？'
  options:
  - label: A
    content: 蠶婦「歸來淚滿巾」是因為蠶絲在城市的銷路不好
  - label: B
    content: 本詩透過對比的方式，反映了勞動人民生活的悲苦
  - label: C
    content: 意旨與「誰知盤中飧，粒粒皆辛苦」意義相近
  - label: D
    content: 「遍身羅綺者，不是養蠶人」指城中人好逸惡勞
- id: doc_113_高雄_英明_國文_g9s1e1_s1_21
  section: 1
  number: 21
  type: single
  page: 3
  stem: 在詩詞中常以具體的流水比喻抽象的愁思，使讀者更能領略作品內涵。下列詩詞也藉流水抒懷，何者所表達的情感異於其他三者？
  options:
  - label: A
    content: 梳洗罷，獨倚望江樓。過盡千帆皆不是，斜暉脈脈水悠悠
  - label: B
    content: 日日思君不見君，共飲長江水。此水幾時休，此恨何時已
  - label: C
    content: 無邊落木蕭蕭下，不盡長江滾滾來。萬里悲秋常作客，百年多病獨登臺
  - label: D
    content: 花自飄零水自流，一種相思，兩處閒愁。此情無計可消除，才下眉頭，卻上心頭
- id: doc_113_高雄_英明_國文_g9s1e1_s1_22
  section: 1
  number: 22
  type: single
  page: 3
