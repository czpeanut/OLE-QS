  stem: '我們的一生花很長的時間與心力處理「生」的問題，卻只有很短的時間處理「老病死」，甚至，也有人抵死不願意面對這無人能免的終極課題。然而，不管願不願意，無論如何掙扎、號叫，「老病死」聯合帳單終會找上門――先找上我們的父母，再找我們。大約從四、五十歲開始，我們得先承接父母的帳單，一把鼻涕一把眼淚和著肝腸寸斷，甚至滿腹怒火付完了帳單，接著，輪到自己的了。

    （節選自簡媜 誰在銀閃閃的地方等你）

    這段文字的主旨，最可能是下列何者？'
  options:
  - label: A
    content: 許多人在走向生命盡頭時，常惋惜自己終其一生沒有貢獻
  - label: B
    content: 談論老病死的話題將使人們過於悲觀，讓氣氛變得低迷
  - label: C
    content: 人們慣於迴避老病死，但這是每個人不能不面對的課題
  - label: D
    content: 人生應有始有終，既然帶著哭聲來到世界，也要帶著哭聲離開世界
