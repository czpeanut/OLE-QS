  - label: B
    content: 「竹杖芒鞋輕勝馬」寫作者面對風雨慌忙閃避，忍不住嘲笑自己如此驚慌失措的儀態
  - label: C
    content: 「一蓑煙雨任平生」由眼前風雨推及人生，強化作者面對人生風雨卻能超然物外的曠達
  - label: D
    content: 「回首向來蕭瑟處，歸去，也無風雨也無晴」以此作結，道出作者看淡人世榮辱的頓悟
