- id: doc_113_高雄_英明_國文_g9s1e1_s2_42
  section: 2
  number: 42
  type: single
  page: 6
  stem: 根據本文，關於馬克．吐溫的說明，下列何者正確？
  options:
  - label: A
    content: 作品風格幽默擅長布局
  - label: B
    content: 擅長寫大時代下的悲劇
  - label: C
    content: 生活順遂成為寫作養分
  - label: D
    content: 因禍不單行得了憂鬱症
  group_stem: '在西方的著名作家中，馬克．吐溫無疑地具有決定性的地位，而一名作家的傳世作品，往往也可以反映出作家的人格特質和道德態度。馬克．吐溫許多的著作都是取材自美國人的文化、生活背景及大時代的變化，他那種高度巧妙運用之下的幽默感，以及別人無可取代的幻變構思、詭譎起伏的情節，無人可以出其右的布局及巧思，至今恐怕很難有人可以凌駕其上。如果讀者仔細閱讀他所有著作的話，必然會臣服在他那精準無比的字詞上，而且每個字都極度地吸引讀者的目光，就如同身歷其境或在作者身旁聆聽床邊故事一般，引人入勝無法忘懷，這就是馬克．吐溫過人的文字魅力。

    世界上大多數人的思維模式，都只是聚焦在一個人成功的具象外表上，很少人會去看隱藏在成功人士身後的慘痛和困頓。馬克．吐溫的童年其實過得並不是那樣地順利。他的父親在他十二歲時就已過世，從那時起他就必須自力更生地養活自己，在三十歲之前，馬克．吐溫是極度地不穩定，居無定所，工作漂泊，投資也從未得利過。後來的日子裡，也曾經因為投資不當而遭遇到破產的厄運，霎時間，他變成了一位債臺高築的作家。那時他已年過六十，為了還債和維持家人的生計，他必須四處去演講和販賣自己的書籍。厄運之神似乎對馬克．吐溫特別感興趣，他最鍾愛的妻子去世了，照顧他妻子的小女兒也因為身心負荷過量，而罹患了精神官能症，另一位女兒也發生車禍，與他感情最深切的親姐姐也在那段時間離開人世……。一般人如果像馬克．吐溫這般的際遇，應該消極厭世，甚至於精神崩潰，種種心理、身體疾病都會接踵而來。但馬克．吐溫遭遇到如此的三災八難，禍不單行，卻不會因此而被擊垮。相反地，他大量地著作，大量地閱讀，藉以充實自身的創作泉源及刺激新思潮的湧現，在那段時間裡成為舉國皆知的大文豪。

    （閱讀最前線 王薀 馬克．吐溫以幽默大師聞名，鮮少人注意到他的人生充滿艱辛）'
