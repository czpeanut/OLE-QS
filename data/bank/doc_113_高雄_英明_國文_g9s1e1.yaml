- id: doc_113_高雄_英明_國文_g9s1e1_s2_46
  section: 2
  number: 46
  type: single
  page: 8
  stem: 閱讀上文內容，下列分析何者錯誤？
  options:
  - label: A
    content: 高起、王陵認為劉邦個性傲慢且好侮辱別人，項羽仁厚而愛人
  - label: B
    content: 張良擅長運籌帷幄，掌控千里之外的戰事，是劉邦的得力助手
  - label: C
    content: 高起、王陵對劉邦能得到天下的看法和劉邦本人認知不謀而合
  - label: D
    content: 項羽陣營並非沒有人才，只是他未能知人善任，所以失去天下
  group_stem: '高祖置酒洛陽南宮。高祖曰：「列侯諸將無敢隱朕，皆言其情。吾所以有天下者何？項氏之所以失天下者何？」高起、王陵對曰：「陛下慢而侮人，項羽仁而愛人。然陛下使人攻城略地，所降下者因以予之，與天下同利也。項羽妒賢嫉能，有功者害之，賢者疑之，戰勝而不予人功，得地而不予人利，此所以失天下也。」高祖曰：「公知其一，未知其二。夫運籌策帷帳之中，決勝於千里之外，吾不如子房。鎮國家，撫百姓，給餽餉，不絕糧道，吾不如蕭何。連百萬之軍，戰必勝，攻必取，吾不如韓信。此三者，皆人傑也，吾能用之，此吾所以取天下也。項羽有一范增而不能用，此其所以為我擒也。」

    （節錄自司馬遷 史記 高祖本紀）'
