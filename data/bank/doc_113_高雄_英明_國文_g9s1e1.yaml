  group_stem: '【甲】昨夜雨疏風驟，濃睡不消殘酒。試問捲簾人，卻道海棠依舊。知否？知否？應是綠肥紅瘦。

    （李清照 如夢令）

    【乙】李清照的如夢令善於化用古人詩句，更技高一籌，成為千古絕唱。此詞情境取唐人孟浩然 春曉：「春眠不覺曉，處處聞啼鳥。夜來風雨聲，花落知多少。」夜來風雨後花落的意象。更直接的關聯，則取自唐末韓偓的懶起：「昨夜三更雨，今朝一陣寒。海棠花在否？側臥捲簾看。」詩中的夜雨、海棠、捲簾，皆被李清照襲用，脫胎成「昨夜雨疏風驟，濃睡不消殘酒。試問捲簾人，卻道海棠依舊」。綜觀如夢令一詞，語言婉轉含蓄，筆調跌宕有致，看似描寫海棠花的凋零，實為李清照對大自然變化的敏感，以及對春光一瞬和好花不常在的無限惋惜。其中「綠肥紅瘦」一句抒發傷春之情，尤為後人所稱道。'
