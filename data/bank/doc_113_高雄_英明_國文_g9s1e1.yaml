  stem: 關於將進酒此詩的內容，下列分析何者正確？
  options:
  - label: A
    content: 「陳王昔時宴平樂」以曹植的坎坷經歷自比，充滿自憐的哀愁情調
  - label: B
    content: 藉由誇飾父母頭髮變白的過程，充分展現未能「及時行孝」的感嘆
  - label: C
    content: 「天生我材必有用」這句千古嘉言是作者對自己人生價值的滿懷信心和肯定
  - label: D
    content: 運用河水奔流不返、瞬間白頭的意象，感嘆歲月流逝迅速，強調勤學宜趁早
  group_stem: '【甲】君不見黃河之水天上來，奔流到海不復回。君不見高堂明鏡悲白髮，朝如青絲暮成雪。人生得意須盡歡，莫使金樽空對月。天生我材必有用，千金散盡還復來。烹羊宰牛且爲樂，會須一飲三百杯。岑夫子，丹丘生。將進酒，杯莫停。與君歌一曲，請君爲我側耳聽。鐘鼓饌玉不足貴，但願長醉不復醒。古來聖賢皆寂寞，惟有飲者留其名。陳王昔時宴平樂，斗酒十千恣歡謔。主人何為言少錢？徑須沽取對君酌。五花馬，千金裘。呼兒將出換美酒，與爾同銷萬古愁。
    （李白 將進酒）

    【乙】莫聽穿林打葉聲，何妨吟嘯且徐行。竹杖芒鞋輕勝馬，誰怕？一蓑煙雨任平生。 料峭春風吹酒醒，微冷，山頭斜照卻相迎。回首向來蕭瑟處，歸去，也無風雨也無晴。
    （蘇軾 定風波）'
- id: doc_113_高雄_英明_國文_g9s1e1_s2_49
