  stem: 下列食用番薯的方式何者並非文中所載古人的吃法？
  options:
  - label: A
    content: 直接生食
  - label: B
    content: 取蔓來吃
  - label: C
    content: 做地瓜粉
  - label: D
    content: 切條曬乾
  group_stem: 番薯，一名地瓜，種出呂宋。明 萬歷中，閩人得之，始入漳、泉。瘠土沙地，皆可以種。取蔓植之，數月即生。實在土中，大小纍纍。巨者重可斤餘。生熟可食。臺人藉以為糧，可以淘粉，可釀酒。其蔓可以飼豚。長年不絕，夏秋最盛。大出之時，掇為細條，曝日極乾，以供日食。澎湖乏糧，依此為生。多自安、鳳二邑配往。薯有數種：曰鸚哥，皮赤肉黃，為第一；曰烏葉，皮肉俱白；曰青藤尾，曰雞膏，最劣。又有煮糖以作茶點，風味尤佳。
    （節選自台灣通史 農業志）
