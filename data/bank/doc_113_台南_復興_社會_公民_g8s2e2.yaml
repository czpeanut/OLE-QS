- id: doc_113_台南_復興_社會_公民_g8s2e2_s1_43
  section: 1
  number: 43
  type: single
  page: 1
  stem: 15歲小威放學騎腳踏車回家時，被突然闖出的狗嚇了一跳，而不小心撞到停在路邊的汽車，導致汽車出現刮痕。車主聽到聲響急忙出來查看愛車狀況，看到愛車出現刮痕而非常生氣，決定怒告小威毀損罪及請求損害賠償責任。經諮詢律師之後，才知道關於毀損罪，依刑法規定，必須是「故意」毀棄、損壞他人物品，且足以生損害於公眾或他人者，才會成立，並無處罰過失毀損的規定。根據內文情境判斷，下列選項說明何者正確？
  options:
  - label: A
    content: 小威是限制責任能力人，此案件依照刑法規定得減輕其刑
  - label: B
    content: 小威是限制行為能力人，由法定代理人負連帶賠償責任
  - label: C
    content: 小威要負起民事責任及刑事責任
  - label: D
    content: 刑法不處罰過失毀損的規定，故小威不需負起賠償責任。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
