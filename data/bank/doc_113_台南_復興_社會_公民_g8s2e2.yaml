  stem: 新聞報導：房客小豪於前年7月向女房東阿鳳租屋，簽訂一年租約卻未依約繳納租金。阿鳳在氣憤之下，未循法律途徑處理，反而擅自進入小豪住處丟光他的物品，最終因無故侵入住宅罪遭嘉義地方法院判處拘役30日，得易科罰金3萬元。關於新聞中提及之刑罰，下列說明何者正確？
  options:
