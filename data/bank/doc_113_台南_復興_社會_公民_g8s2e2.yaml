- id: doc_113_台南_復興_社會_公民_g8s2e2_s1_48
  section: 1
  number: 48
  type: single
  page: 1
  stem: 刑罰有三個目的，請問下列何者是以「藉由刑法明文規定犯罪行為的懲處，對於做出侵犯法益的犯罪行為人，給予適當且應有的刑責，以伸張正義。」為核心的發言？
  options:
  - label: A
    content: 監獄的技能訓練可讓受刑人學有專長及謀生技能，以便將來重返社會後能過正常生活，不要再犯罪
  - label: B
    content: 以牙還牙，以眼還眼，為了讓行為人對於自己的犯行付出相應的代價
  - label: C
    content: 要求賠償的用意不在於懲罰，而是彌補當事人的損失
  - label: D
    content: 死刑為結束惡行重大的犯罪者之生命，是刑法中最嚴厲的處罰，以作為一般社會大眾的前車之鑑，產生威嚇的效果。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
