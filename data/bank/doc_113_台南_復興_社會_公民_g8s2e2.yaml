  stem: 關於盜用他人帳號密碼的行為，已於在2003年6月納入刑法。請問下列敘述何者正確？
  options:
  - label: A
    content: 在2003年6月以前，盜用他人帳號密碼可用刑罰處罰
  - label: B
    content: 在2003年6月以後，法官依據《刑法》來審判盜用他人帳號密碼之行為，此為無罪推定原則之展現
  - label: C
    content: 犯下此罪的人可能會被單獨科處褫奪公權
  - label: D
    content: 現年15歲國三生若有該行為，依刑法規定可減輕其刑。
  group_stem: "題組題，請依下列新聞內容回答第58～第60題\n\t一名許姓女子在IG收到好友私訊，傳送名為「繪畫大公投」的網址，要求許女幫自己小孩畫作競賽投票，許女依指示點擊網址，網站隨即跳出需登入LINE進行投票畫面，許女輸入帳號、密碼及手機驗證碼後，發現自己LINE帳號遭盜用，詐騙集團取得許女帳號後，假借許女名義向帳號內好友借錢，共詐得二十三萬元。"
