  section: 1
  number: 45
  type: single
  page: 1
  stem: 下列關於刑罰的說明，何者錯誤？
  options:
  - label: A
    content: 不讓座的行為雖然不道德，但因為刑法沒有明文規定，故國家不能以刑罰來處罰該行為
  - label: B
    content: 犯罪行為的處罰，以行為時的法律有明文規定者為限
  - label: C
    content: 褫奪公權及沒收皆必須附加於主刑科處
  - label: D
    content: 刑罰具有以下幾種目的：懲罰犯罪、預防犯罪、矯正犯罪。
