  stem: 007 系列電影是電影史上續集最多，票房名列前茅的經典作品，主角詹姆士龐德是英國情報員，為了民主陣營的利益與世界和帄，不斷跟各種邪惡勢力對抗，電影的主題也隨著時代變遷與時俱進，反恐行動、與中國的競合關係，成為近年來電影的新題材。許多世界知名企業的注目，開始與片商合作在影片中製造自家產品的曝光機會，而使得該系列電影變成置入性行銷的著名範例。曾經投資贊助過影片拍攝的主要廠商包括阿斯頓·馬丁、BMW、勞斯萊斯、福特、奧迪等汽車集團。另外如瓦爾特（Walther，德國槍械製造商）與歐米茄（OMEGA，瑞士鐘錶廠）在該系列電影中都有非常高的曝光度。請問：從上文007
    電影的演變，可以推測當前世界逐漸走向的趨勢何為？
