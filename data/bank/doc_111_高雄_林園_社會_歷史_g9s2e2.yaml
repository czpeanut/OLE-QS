  stem: 國際聯盟是世界上第一個以維護世界和帄為其主要任務的國際組織，國際聯盟的成立目的如《國際聯盟盟約》所述，包括透過集體安全及軍備控制來預防戰爭，藉由談判及仲裁來帄息國際間的紛爭。國際聯盟沒有自己的武裝力量，因而需要依靠當時的大國執行其決議、維持經濟制裁，或是在必要時提供軍隊，然而這些大國未必願意這麼做。經濟制裁也會傷害國際聯盟的成員，因此這些國家不願意配合。在第二次義大利衣索比亞戰爭時，國際聯盟指責義大利軍隊將國際紅十字與紅新月運動的醫療帳篷作為攻擊目標，墨索里尼則回應道：「國際聯盟在麻雀大聲喊叫時運作的很好，但在老鷹掉下來時一點用都沒有」。請問：由墨索里尼的回應可以推論國際聯盟最致命的缺點為何？
  options:
  - label: A
    content: 美國未加入
  - label: B
    content: 本身沒有軍事力量
  - label: C
    content: 以維護世界和帄為目標
  - label: D
    content: 無法實行經濟制裁
  answer:
  - B
  answer_source: answer_key_vlm
