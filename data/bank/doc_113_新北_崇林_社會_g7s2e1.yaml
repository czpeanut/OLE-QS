  - label: B
    content: 皇太子東宮裕仁訪臺期間為「皇民化運動時期」，因此可以訪視臺人逐漸日本化的情形
  - label: C
    content: 1930 年代中期後，日本皇族來臺訪視的軍事目的，極為可能是為了因應「中日戰爭」的爆發
  - label: D
    content: 皇太子東宮裕仁來臺訪視期間，恰巧可以訪視「工業臺灣，農業南洋」的政策發展成果
  group_stem: '1895 年春天，也就是在條約簽訂之後，臺灣各地掀起了大規模的反日浪潮，日本政府在評估無法和平接收臺灣後，決定派出還未在戰場上馳騁過的天皇親衛軍「近衛師團」作為接收部隊。隨部隊來臺的團長即為北白川宮能久親王。

    1923 年4 月，日本帝國海軍第二艦隊航行至臺灣東北外海，帶領者正是當時攝政的皇太子東宮裕仁(他是北白川宮能久親王的侄孫)。皇太子於基隆港下船，展開為期12
    天的行啟行程，以了解日本經營臺灣30 年的成果。

    皇族來臺的行程表，其行程的長短、目的、主要活動等，會因時局改變來進行參訪地點、路線的選擇。時局的改變，影響菊花皇朝(指日本)成員訪臺的主要方向與定位；國際情勢的不同、臺灣島上的情形等，皆是當局籌畫行程的重要準則。在1930
    年代中期之後，日本逐漸邁向戰爭之路，無論男女，軍事目的已凌駕一切，成為他們共通的來訪名目。'
