  group_stem: '〈資料一〉 聖鈞與日本友人野比のび太有幸一同在臺北鐵路局工作，同樣擔任技師一職。根據政府所標榜的訴求，原本以為兩人工作時間與薪資待遇會相同，但聖鈞卻發現在他在鐵路局的工作時間比野比のび太久，但領到的酬勞卻比野比のび太少很多，連升遷都沒有他的份。

    〈資料二〉 奇哥在日記中寫到他所處的環境：「總督府下令，禁止演出布袋戲、歌仔戲，廢除報紙漢文欄，不准進入寺廟、只能參拜神社……等。」

    〈資料三〉 後藤新平採取生物學原則，認為：「施政前必須先了解臺灣人的習性，再制定出一套管理辦法才有效。」依據此原則他對臺灣展開調查、訂定治臺政策以及各項建設。

    〈資料四〉 某一場戰爭結束後，『民族自決』思潮風行國際，日本當局也在此時透過『法三號』來加以限制臺灣總督的立法權，把臺灣視為日本的一部分。'
