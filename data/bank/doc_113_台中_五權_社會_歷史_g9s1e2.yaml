  stem: 有個著名的傳說「□皇帝之夢」：相傳，某位羅馬皇帝與勢均力敵的對手交戰，在一場決定性戰役前夜曾經做一個夢。夢中□看見耶穌對他說，「只要以基督十字架作為部隊旌旗，就一定會戰勝敵軍。」夢醒之後的□皇帝半信半疑，照著夢中得到的指示更改旌旗，他的軍隊果然在這場決定性的戰役中大獲全勝。在該戰役的
