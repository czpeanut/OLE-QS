  stem: 這位歷史人物在傳授聖經時，採用 1516 年伊拉斯莫斯(Erasmus)編訂的希臘文新約，這本新約的前言：「我願每個婦女能夠讀福音書和保羅書信。希望能夠譯成各種語文，不僅蘇格蘭人和愛爾蘭人，連土耳其人和阿拉伯人也能誦讀。…扶犁而耕的農夫可以低吟經文，織布的可以在機杼聲中唱誦經文，行旅可以講聖經故事減除旅途的勞頓。」這位歷史人物不僅認同信徒藉由閱讀聖經與上帝溝通，並將這段前言的精神當作他所創教派的主張；這個教派的口號為：「惟獨信心（sola
