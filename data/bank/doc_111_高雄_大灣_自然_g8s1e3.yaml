    content: 已知氯和鈣化合時的原子個數比為 2：1，可推測氯化鈣的化學式為 $\mathrm{Cl_{2}Ca}$
  - label: D
    content: 中文名稱順序與元素符號順序相反，所以 $\mathrm{NaCl}$ 稱為氯化鈉。
