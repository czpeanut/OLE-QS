  - label: D
    content: There are many examples of inattentional blindness in our life.
  group_stem: "Inattentional blindness happens when a person is not able to notice\
    \ something, and it can happen to anyone. When people fully focus on one thing,\
    \ they may fail to see other things right in front of them.\n  The most famous\
    \ experiment on inattentional blindness is the “Invisible Gorilla Test.” In the\
    \ experiment, the scientists had the subjects watch a video. In the video, there\
    \ were two groups of people, one in black T-shirts, and the other in white T-shirts.\
    \ The scientists asked the subjects to count how many times the players in white\
    \ would pass the basketball. About 3 minutes after the video started, someone\
    \ who dressed up as a gorilla walked in, stopped in front of the camera, and then\
    \ walked away. In total, the gorilla was there for up to 9 seconds. After watching\
    \ the video, the subjects were asked if they noticed the gorilla. Surprisingly,\
    \ more than 50% of the subjects said that they didn't see the gorilla. In other\
    \ words, the gorilla was invisible to them, and that was how the experiment got\
    \ the name. Because the subjects only focused on counting, they were not able\
    \ to notice the gorilla. It was hard for the subjects to believe it when they\
    \ were told that there was a gorilla.\n  Examples of inattentional blindness are\
    \ often seen in our life. We believe our eyes deeply, but they don't always tell\
    \ us everything. Be careful. When we fully focus on something, we may go blind!\n\
