  - label: C
    content: Knife.
  - label: D
    content: Live.
  group_stem: 'To save your beloved country you could no longer save,

    You were always honest, strong, and brave.

    They didn’t listen. You were exiled,

    But still you hoped, and still you smiled.

    You wrote Li Sao with pain inside,

    Your love for homeland is the feelings you could not hide.

    Your heart broke into pieces, cut deep like a knife,

    Still held onto the country’s life, peace sharp as strife.

    At the dragon boat festival, people race,

    To honor you, your life, your place.

    They throw rice in the river, and they beat the drum.

    For you, the poet, and still, you would not succumb.

     exiled 流放 poet 詩人 strife 衝突、爭鬥 beat 敲 succumb 屈服'
