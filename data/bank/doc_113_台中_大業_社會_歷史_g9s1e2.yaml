  section: 1
  number: 4
  type: single
  page: 1
  stem: 基督教在多年的演進歷程中，曾出現一位重要關鍵人物。他強化基督教的正統地位，使當時他所統治疆域內的眾多宗教面臨取締及打擊，紛紛消失於當下，甚至連「奧林匹亞」祭典也是當時被禁止舉辦的眾多宗教活動之一。請問，這位人物為下列何者？
  options:
  - label: A
    content: 查士丁尼
  - label: B
    content: 君士坦丁
  - label: C
    content: 狄奧多西
  - label: D
    content: 奧古斯都。
