- id: doc_113_台中_大業_社會_歷史_g9s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 歐洲在歷經宗教改革一連串的衝擊後，呈現有別以往的新氣象。請問，下列敘述何者不符合當時的情況？
  options:
  - label: A
    content: 歷經各國之間的宗教戰爭後，發展出宗教寬容態度，能包容不同教派
  - label: B
    content: 教會影響力不受影響，教宗依然掌控西歐社會大勢
  - label: C
    content: 各國國君強化王權，有助於近代國家出現
  - label: D
    content: 基督教派更為多元，百花齊放。
