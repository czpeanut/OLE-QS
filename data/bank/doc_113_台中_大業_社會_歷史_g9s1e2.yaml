- id: doc_113_台中_大業_社會_歷史_g9s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 中世紀的歐洲，基督教具有關鍵性的地位，影響當時歐洲局勢發展。據你所知，下列何選項非為當時西歐概況？
  options:
  - label: A
    content: 傳教士需要抄寫典籍，保存方言文學
  - label: B
    content: 日耳曼民族大量改信基督教，西歐成為基督教世界
  - label: C
    content: 中世紀始於西羅馬帝國滅亡
  - label: D
    content: 中世紀西歐商業活動停滯，形成自給自足的經濟型態。
