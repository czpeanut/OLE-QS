  section: 1
  number: 7
  type: single
  page: 1
  stem: 近代以來，耶穌會總是在許多重要事件中扮演重要角色。下列關於耶穌會的敘述，何者為非？
  options:
  - label: A
    content: 創立者為西班牙人羅耀拉
  - label: B
    content: 派遣傳教士赴亞洲傳教，例如明朝來到中國的利瑪竇，與中國士大夫合譯《幾何原本》
  - label: C
    content: 傳教士皆須經過嚴格培育，對上帝信仰絕對服從，也具有廣博知識，有利於傳教推行
  - label: D
    content: 推崇政教合一制度。
