- id: doc_113_台南_民德_國文_g7s1e1_s4_5
  section: 4
  number: 5
  type: single
  page: 4
  stem: 福樓拜：「我每天上午用四個小時來讀書寫作，下午用四個小時來讀書寫作，晚上，我還會用四個小時來讀書寫作。」這段話所強調的精神與下列何者最接近？
  options:
  - label: A
    content: 人的價值，不在壽命的長短，而在貢獻的大小
  - label: B
    content: 人之所以犯錯誤，不是因為他們不懂，而是因為自以為什麼都懂
  - label: C
    content: 如果送禮的人不是出於真心，再貴重的禮物也會失去它的價值
  - label: D
    content: 與其花許多時間和精力去鑿許多淺井，不如花同樣的時間和精力去鑿一口深井。
  group_stem: "法國作家莫泊桑小時候曾在福樓拜面前自信的說：「我上午用兩個小時來讀書寫作，用另兩個小時來彈鋼琴，下午則用一個小時向鄰居學習修理汽車，用三個小時來練習踢足球，晚上，我會去燒烤店學習怎樣製作燒鴨，星期天則去鄉下種菜。」說完後一臉得意。福樓拜笑了笑說：「我每天上午用四個小時來讀書寫作，下午用四個小時來讀書寫作，晚上，我還會用四個小時來讀書寫作。」福樓拜接著問：「你究竟有什麼特長？」這下，莫泊桑答不上來了。於是他便問：「那麼，您的特長又是什麼呢？」福樓拜說：「寫作。」\n\
    \  專注於一件事，看似簡單，其實是對毅力與恆心的考量。成功學上有個著名的「兩萬小時理論」，即「經過兩萬小時鍛煉，任何人都能從平凡變成卓越」。但芸芸眾生平凡者不可計數，卓越者鳳毛麟角。原因很簡單，兩萬小時鍛鍊太過漫長、枯燥、無趣，沒有堅如磐石的信念，動搖、絕望直至放棄是順理成章的事。\n\
    （改寫自《一輩子做好一件事》）"
