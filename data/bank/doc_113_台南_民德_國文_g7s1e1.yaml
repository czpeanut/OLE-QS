- id: doc_113_台南_民德_國文_g7s1e1_s4_7
  section: 4
  number: 7
  type: single
  page: 4
  stem: 請問小王子的腳步聲為何會吸引狐狸走出狐洞？
  options:
  - label: A
    content: 因為狐狸喜歡的音樂就是腳步聲
  - label: B
    content: 因為狐狸與小王子情投意合，形影不離
  - label: C
    content: 因為小王子攜帶很多食物給狐狸享用
  - label: D
    content: 因為狐狸期盼被小王子馴養。
  group_stem: "狐狸說：「我的生活很單調，我獵雞，人獵我。所有雞都是一樣的，所有的人類也一樣。結果我感到心煩。可是你若馴養我，就好像陽光照亮了我的生命。我會認出有一陣腳步聲與別人不同。別的腳步聲使我匆匆躲回地下，你的腳步聲就像音樂，會吸引我走出狐洞。而且你瞧瞧：你看見那邊的麥田沒有？我不吃麵包，麵粉對我沒有用處，麥田吸引不了我，真可悲。但你的美髮是金色的，想想你馴養我之後有多美妙！麥子也是金色的，我看了就想起你。我會喜歡聽麥田裡的風聲……」\n\
    \  狐狸打量小王子好一段時間。\n小王子答道：「我很想這麼做，卻沒有時間，我要找朋友，還要去了解好多事。」\n  狐狸說：「人只了解他馴養過東西，人類再也沒有時間了解什麼了。他們到店舖買現成的，可是天下沒有買得到友誼的店鋪，所以人類不再有朋友。你若要找朋友，請馴養我吧……」\n\
    \  「我要怎麼馴養你呢？」小王子問道。\n  狐狸說：「你必須很有耐心。首先你坐在地上，和我隔一段距離──就這樣。我會用眼角偷看你，你一句話也不說，語言是誤解之源。你每天坐得離我愈來愈近……」\n\
    \  第二天小王子回來了。\n  狐狸說：「每天同一個時間回來比較好。例如你下午四點來，我三點就開始興奮。時間一分一秒接近，我愈來愈開心。四點鐘我已心魂動盪，跳來跳去了。我要讓你看看我多開心！反之，你若隨時會來，我不知道我的心該在什麼時刻準備迎接你……人必須遵守恰當的禮儀……」\n\
    (節選自聖修伯里《小王子》  )"
