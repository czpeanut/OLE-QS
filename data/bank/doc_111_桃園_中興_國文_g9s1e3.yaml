- id: doc_111_桃園_中興_國文_g9s1e3_s2_37
  section: 2
  number: 37
  type: single
  page: 5
  stem: 請問根據上文下列何者錯誤？
  options:
  - label: A
    content: 線上文字雲工具使用需要付費
  - label: B
    content: 文字雲工具可能不支援中文
  - label: C
    content: 文字雲工具可將文字以圖像化的方式呈現
  - label: D
    content: 手機或是桌機都可以使用文字雲工具。
  group_stem: 近年來「文字雲」、「數據雲」好夯！隨著免費線上工具越來越方便，大家隨手就可以產生好幾個。「文字雲」工具簡單地說，就是提供一篇文章或一大串文字，它就會自動分析出哪些字或詞出現的頻率較多，據以作出視覺化的呈現，通常是以字體大小來表現。若是搭配形狀、字型、配色等，就更有趣了。若依對中文的支援與否，「文字雲」工具可以分成三類：1、直接支援中文2、間接支援中文3、目前還不支援。中文桌機可直接線上使用，手機可以安裝APP，完成的文字雲，可下載圖檔，若線上觀看，它也可以是動態的喔！
