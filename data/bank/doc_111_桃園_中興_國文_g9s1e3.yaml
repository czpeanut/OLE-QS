  stem: 「『墨菲定律』是一種心理學效應，是由愛德華·墨菲提出的。它的原句是這樣說的：如果有兩種或兩種以上的方式去做某件事情，而其中一種選擇方式將導致災難，則必定有人會做出這種選擇。人們對墨菲定律其進行了多種衍義，但究其根本，就是：墨菲定理告訴我們，如果事情有變壞的可能，不管這種可能性有多小，它總會發生。」請依照說明，判斷下列行為何種不屬於「莫非定律」？
