  group_stem: 過了一段時間，新園內的工程大部分完工後，只缺花柳庭園的匾額與對聯，賈政想考考兒子的學問，趁天氣暖和，帶了賈府養的一些客人逛新園，命令寶玉也跟著出出主意。賈政喜歡淡雅，踏入正門，就讚賞門窗上精心雕琢的花樣；下面是白石臺階，左右是雪白粉牆，不落俗套。一進門就有一座假山擋在前頭，客人們都稱讚這山擋得好，賈政也說：「如果不是有座山擋著，一進來，一眼就把這園裡的東西看完，就無趣了。」山後正是一條羊腸小徑，賈政要寶玉帶頭走，抬頭忽然看見假山上有面光滑的白石，想必是該題字的地方。寶玉認為這石上該題「□□□□」，客人們聽了，紛紛讚美：「妙極了，公子果然有才情！」賈政要大家不要誇獎寶玉，只說他運氣。(節錄自吳淡如新說紅樓夢)
