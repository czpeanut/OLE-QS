  type: single
  page: 2
  stem: '小光班上舉辦有獎徵答，要將下列敘述正確配對才能得獎，請問下列敘述正確配對選項為何？


    甲、該韻文以婉約為正宗，周邦彥、李清照等為代表。蘇軾、辛棄疾則為豪放派代表。

    乙、該韻文形式設官署採集民間作品，用語淺白俚俗，內容多以敘事為主；句式長短不一，入樂可歌。

    丙、該韻文對於字數、句數、平仄、對仗與用韻都有嚴格規定，必須一韻到底。'
  options:
  - label: A
    content: 古詩、樂府詩、詞
  - label: B
    content: 詞、樂府詩、近體詩
  - label: C
    content: 近體詩、詞、樂府詩
  - label: D
    content: 詞、樂府詩、古詩。
