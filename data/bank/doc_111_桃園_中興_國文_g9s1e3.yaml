- id: doc_111_桃園_中興_國文_g9s1e3_s2_34
  section: 2
  number: 34
  type: single
  page: 4
  stem: 請問關於甲文寫作手法何者錯誤？
  options:
  - label: A
    content: 以實例故事開頭，說明宋人喜愛茶藝的藝術氛圍
  - label: B
    content: 先讚賞宋代茶藝水準高超，再以設問帶出點茶步驟
  - label: C
    content: 一步一步帶領讀者認識點茶方式
  - label: D
    content: 引用宋徽宗大觀茶論理論說明點茶技巧，可謂失之毫釐，差以千里。
  group_stem: "【甲】在空前濃厚的飲茶氛圍中，宋代茶藝也達到前所未有的水準。那麼一套完整的宋代點茶法是怎樣的呢？首先焙製茶餅，敲成小塊，碾碎後研磨到極細，網羅過篩，收納到茶盒之中。煮水候湯。熁①盞。此即加熱茶盞的意思，可以使茶末更好的懸浮起來。熁盞後將重約一錢七分的茶粉加到盞中，開始正式點茶。先加入少量的沸水，將茶粉調成糊狀，這一步謂之調膏；然後一邊加入沸水，一邊以茶筅②擊拂茶湯，打起持久不散的茶沫。然後將茶盞置於漆器展托或相同材質的展托之上，呈給客人或自己飲用。至此，一套完整的宋代點茶流程結束。看起來只寥寥數行，可想要行雲流水，完美呈現一盞點茶作品絕非易事，按宋徽宗在大觀茶論所述理論─「七湯點茶法」，點小小一盞茶，便要注湯、擊拂七次，每一次注水角度、擊拂所需手法和力道都不盡相同，直到茶與湯水調和後濃度適宜，乳花洶湧則止。(改寫自魏策\
    \ 跟著宋朝人過一天)\n【乙】茶少湯多，則雲腳散；湯少茶多，則粥面聚。鈔茶一錢七，先注湯調令極勻，又添注入環回擊拂。湯上盞可四分則止，視其面色鮮白，著盞無水痕為絕佳。建安斗試③，以水痕先者為負，耐久者為勝，故較勝負之說，曰相去一水兩水。(蔡襄茶錄)\n\
    \  注釋：①熁：音ㄒㄧㄝˊ，烤。②筅：ㄒㄧㄢˇ，指茶筅由一截竹筒經精細切割製成，形如竹刷。③建安斗試：今福建一代在宋朝盛行茶的評比比賽。"
