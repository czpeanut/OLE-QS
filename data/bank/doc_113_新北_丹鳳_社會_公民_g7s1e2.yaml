  type: single
  page: 1
  stem: 請青青後來再婚，生下一男孩；她和她現任老公蓋瑞，都想要小孩姓自己姓氏；最後蓋瑞基於愛屋及烏，同意小孩姓青青姓氏。請問下列何者，是我國目前子女的姓氏法規的首要規定？
