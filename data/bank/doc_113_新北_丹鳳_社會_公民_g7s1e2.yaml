- id: doc_113_新北_丹鳳_社會_公民_g7s1e2_s1_35
  section: 1
  number: 35
  type: single
  page: 1
  stem: 家庭是我們每個人最早接觸的場所，也是開始學習為人處世的地方，而爸媽是影響我們至深的人。請問下列兩句話：『巧婦難為無米之炊』(炊指煮食或煮飯) 與『有其父必有其子』，強調家庭的哪兩項功能的重要性？
  options:
  - label: A
    content: 生育與教育功能
  - label: B
    content: 經濟與教育功能
  - label: C
    content: 保護與照顧及生育功能
  - label: D
    content: 保護與照顧及經濟功能。
