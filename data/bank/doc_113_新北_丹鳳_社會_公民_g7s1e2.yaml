  section: 1
  number: 46
  type: single
  page: 2
  stem: 時秋的親屬們在客廳裡，聊起現在的有效婚姻條件，和以往有些差異。請問實秋的親屬中，何人說條件有誤？
  options:
  - label: A
    content: 祖母說：要準備結婚證書喔…！
  - label: B
    content: 嬸嬸說：我跟你叔叔可以當你們的證人。
  - label: C
    content: 祖父從後面過來，用台語說：一定要辦桌請人客，讓親情五十(指親朋好友)，攏來鬧熱一下，按呢才算是結婚啊。
  - label: D
    content: 叔叔建議說：時秋他們可去法院公證結婚，將省下的錢，當買房基金；但要記得去戶政事務所登記。
