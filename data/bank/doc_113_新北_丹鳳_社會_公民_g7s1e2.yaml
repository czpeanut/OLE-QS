    content: 判給簡易；因為小甜大部分由他照顧
  - label: B
    content: 青青有經濟能力，才能養小甜，故判給青青
  - label: C
    content: 判給祖父母，最沒爭議，而且他們也很疼愛小甜
  - label: D
    content: 將依小甜的最佳利益，來做判定。
