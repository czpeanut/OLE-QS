  section: 1
  number: 40
  type: single
  page: 1
  stem: 三珊終於和交往三年的男友一郎結婚，婚後原本很恩愛，但自從生了孩子後，公婆便搬來一起住，說是為幫忙照顧孫子；但實際上，是為了怕孫子姓母姓後，財產就落入媳婦手中，所以兩人因此常起爭端。請問我國法令規定財產繼承權，下列敘述：(甲)無論男女，都可以繼承父母財產(乙)無論從父姓或從母姓，皆能繼承雙親的財產(丙)即使嫁出去的女兒，亦能繼承父母財產
    (丁)養子女因為收養關係，非親生的，故不能繼承養父母財產。正確的是？
