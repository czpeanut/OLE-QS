- id: doc_113_新北_丹鳳_社會_公民_g7s1e2_s1_38
  section: 1
  number: 38
  type: single
  page: 1
  stem: 古時候強調：法不入家門，但現代強調保障人權，我國為防治家庭暴力，採行多種措施，如設置婦幼保護專線，安置庇護所，心理諮商輔導等等。如家人間有語言或肢體等暴力行為，請問受害人可向何機關尋求協助，及此機關將採取何種方式，來達到法律上的隔離效力？下列何者是正確的：
  options:
  - label: A
    content: 法院、核發保護令
  - label: B
    content: 警察局、核發保護令
  - label: C
    content: 社會局、安置庇護所
  - label: D
    content: 社會局、宣告停止親權。
  tags:
