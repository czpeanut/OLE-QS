- id: doc_113_新北_丹鳳_社會_公民_g7s1e2_s1_36
  section: 1
  number: 36
  type: single
  page: 1
  stem: 飄伯年輕時好賭又玩，都沒有花任何心思在家裡，且到處留情！現今六十好幾，身染不治之症，才回故鄉去看自己四十年來，未曾照顧的兒子阿泰，且希望他養自己。他的兒子阿泰，非常生氣的將飄伯趕出去。請依敘述和法令規定，選出正確的？
  options:
  - label: A
    content: 阿泰沒有義務扶養飄伯
  - label: B
    content: 飄伯可以依憲法告阿泰
  - label: C
    content: 飄伯早就被依刑法宣告，停止行使親權
  - label: D
    content: 阿泰沒有和飄伯在一起生活，所以無法繼承飄伯財產。
