  section: 1
  number: 37
  type: single
  page: 1
  stem: 芯朝到了假日，最喜歡做的事是：騎著YOUBIKE 到新月橋上眺望大漢溪；今日他騎經過鹿角溪人工溼地時，停下來欣賞花草、與鳥類時….聽見有人在叫他名字！他定睛一看，原來是住在淡水的舅舅和他和前妻生的6
    歲女兒，及半年前再婚的舅媽。閒聊幾句後，就看到外婆和外公騎過來。請問畫線部分，芯朝沿途遇見的親戚和他，依序是屬於那些親屬關係？
  options:
