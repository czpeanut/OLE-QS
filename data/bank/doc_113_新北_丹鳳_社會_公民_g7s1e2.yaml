  stem: 根據美國的統計，我國生育率是目前全球最低的，這也代表政府想改善少子化現象，是相當困難的。造成我國少子化現象嚴重的原因，有下列哪些？(甲)年輕人面對低薪高房價，不敢生
    (乙)雖然可以請育嬰假，但沒有薪水，怕養不起 (丙)托育與教育費用太高  (丁)因性別平權，且女性就業率提升，所以女性希望男性全職照顧孩子，造成男性怯步。最正確的是：
