- id: doc_113_新北_板橋_自然_g7s1e3_s1_49
  section: 1
  number: 49
  type: single
  page: 4
  stem: 關於神經疾病與神經系統配對，下列敘述何者錯誤?
  options:
  - label: A
    content: 腦死-大腦受損
  - label: B
    content: 植物人-大腦受損
  - label: C
    content: 漸凍人症-運動神經元受損
  - label: D
    content: 小腦萎縮症-小腦受損
  group_stem: "◎請閱讀以下文章並回答下列題目49~50：\n    神經疾病是指影響大腦、脊髓和神經系統的病症，這些疾病可能導致意識、運動或協調能力的嚴重損傷，對患者與家屬的生活影響深遠。\n\
    \    腦死是指腦幹功能完全喪失的狀態，患者無法自主呼吸且不可逆，因此被視為法律上的死亡標準。這與植物人不同，植物人的腦幹功能仍存，能自主呼吸，但因大腦皮層受損而長期喪失意識，難以與外界互動。\n\
    \    漸凍人症（肌萎縮性側索硬化症）是一種進行性神經退化疾病，患者的運動神經元逐漸失去功能，導致肌肉無力、萎縮，最終可能無法吞嚥或呼吸。儘管目前無法治癒，但透過藥物和輔助設備能延緩病情並改善生活品質。\n\
    \    小腦萎縮症則是影響小腦功能的疾病，導致患者行走不穩、動作笨拙及平衡困難。這可能由遺傳或後天因素（如酒精中毒）引起，目前的治療以復健與對症支持為主。\n\
    \    透過早期診斷與綜合治療，神經疾病患者的生活品質可以得到一定程度的改善，而未來的醫學進步將為患者帶來更多希望與可能性。"
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 生物
      code: 5-2
      title: 神經系統
      chapter: 第5章 生物體的協調作用
    textbook: 七上生物 5-2 神經系統
    labeled_by: ai
