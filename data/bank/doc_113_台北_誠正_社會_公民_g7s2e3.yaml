  type: single
  page: 2
  stem: 探討一社會議題是否公平可以從多個面向切入，請問對於是否公平的判斷方式，下列敘述何者有誤？
  options:
  - label: A
    content: 可從利益分配是否合理來判斷，如薪資待遇
  - label: B
    content: 可從個人基本需求是否獲得合理照顧判斷，如是否設有無障礙設施
  - label: C
    content: 可透過換位思考，利用同理心判斷，不能一昧以自己的狀況類比其他人
  - label: D
    content: 可透過個人負擔責任是否合理判斷，如富人就必須捐錢幫助需要的人
