- id: doc_113_台北_誠正_社會_公民_g7s2e3_s2_31
  section: 2
  number: 31
  type: single
  page: 4
  stem: 根據上文所述，下列敘述何者最為恰當？
  options:
  - label: A
    content: 國民住宅失敗的原因主要在於價格不夠便宜，只要夠便宜就可以落實居住正義
  - label: B
    content: 合宜住宅雖是一次性政策，但有設置禁售期，已確實解決了國民住宅所遇到的問題
  - label: C
    content: 中繼住宅目的在於給予有需要的民眾暫時的幫助，平時有空屋也不算浪費資源
  - label: D
    content: 社會住宅考量過去政策無法確實解決長期的居住問題，限制承租期限有其必要性
  group_stem: '國宅、合宜宅、中繼宅、社宅比比看

    居住安全是人民基本人權之一，政府為落實居住正義，在《住宅法》修法後，目前確立以「只租不賣」的社會住宅政策為主要方向，而過去有過多種居住政策，包含國民住宅、合宜住宅、中繼住宅、社會住宅。

    國民住宅

    簡稱國宅，是政府於1975 年陸續實施興建的公營住宅，以較為親民的價格出售為主，屬於一次性的住宅政策，無法永續解決居住問題，雖然後續開放出租，但屋齡較高且設計老舊也降低了民眾吸引力，於1999
    年停止興辦。

    合宜住宅

    政府於2010 年推動的出售式公共住宅，為改善過往國宅設計品質不佳的問題，由政府提供土地，低價出售給民間廠商興建，以合宜價位給無自用住宅的中低收入戶購買，一開始有禁售期(後續開放買賣)，但因仍屬於一次性政策且後續爆出弊案，2014
    年政府宣布不再興建。

    中繼住宅

    政府為了能順利推動都市更新與老屋重建，特別興建或挪用國宅提供因都更暫時沒有居所的民眾承租，待新建物完工就可以搬回去。但由於租戶較少，常發生無人承租的狀況，近年政府也推出短期中繼住宅承租方案，充分利用資源。

    社會住宅

    當今政府主要推動的住宅政策，以政府直接、補助興建、或找適合既有空屋轉租(包租代管)，採只租不賣的模式，讓住宅資源能重複利用，照顧更多世代的民眾，設有承租年限。目前興建數目不夠多，導致民眾需要抽籤承租且中籤率很低。'
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 公民
      code: 6-3
      title: 我國的社會福利制度
      chapter: 第6章 社會安全與國家責任
