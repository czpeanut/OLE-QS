  section: 1
  number: 15
  type: single
  page: 2
  stem: 針對「平等」的解釋，請問下列何者最不恰當？
  options:
  - label: A
    content: 主要分作形式平等與實質平等
  - label: B
    content: 形式平等意指機會與資源的均等，如全國實施國民義務教育
  - label: C
    content: 實質平等意指針對有額外需要的族群給予合理的差別待遇，如設置無障礙坡道
  - label: D
    content: 實質平等才是真正的平等，為追求公平正義，應完全放棄形式平等
