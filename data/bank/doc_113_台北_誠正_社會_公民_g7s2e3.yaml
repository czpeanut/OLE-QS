- id: doc_113_台北_誠正_社會_公民_g7s2e3_s2_33
  section: 2
  number: 33
  type: single
  page: 4
  stem: 根據上文所述，下列敘述何者最不恰當？
  options:
  - label: A
    content: 從國富毛額每年增加可見台灣經濟正成長的趨勢
  - label: B
    content: 財富差距達66.9 倍表示社會中有人不夠努力賺錢
  - label: C
    content: 「問題」若持續擴大可能造成社會流動受阻礙
  - label: D
    content: 解決「問題」的責任不只在政府，社會也應該盡一份力
  group_stem: '2024 年國富統計報告

    行政院主計總處於2024 年時隔30 年再次公布國富統計報告。據數據顯示，台灣全體國民所擁有的財貨總價值(國富毛額)突破300 兆台幣，每年都以9%左右的幅度成長。

    但同時家庭財富分布前20%的家庭與後20%的家庭差距高達66.9 倍，與30 年前的16.8 倍有巨大差距。雖然從統計數據來看，台灣與其他有公布資料的主要國家相比差距倍數並不算高(澳洲93.1
    倍、英國109.5 倍)，但社會與政府仍應持續關心此議題，盡量避免「問題」持續擴大。'
  tags:
