  stem: 2011 年前，根據《身心障礙者權益保障法》規定，非視障者不得從事按摩業，以保障視障者的工作權。但2008 年大法官釋憲作成釋字649 號，認為該限制排擠有意從事按摩業的非視障者，保障與影響不符合比例原則，宣告違憲並於三年後當然失效。請問上述與下列哪兩種議題的衝突最相關？
  options:
  - label: A
    content: 弱勢族群的工作保障與大眾工作的權利
  - label: B
    content: 政府機關的公權力與民眾的基本人權
  - label: C
    content: 按摩產業的發展與社會安全的維護
  - label: D
    content: 視障族群的特權與大法官的釋憲效力
