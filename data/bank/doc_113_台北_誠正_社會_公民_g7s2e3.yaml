  options:
  - label: A
    content: 禁止雇主以種族、宗教、性別等因素歧視受雇者
  - label: B
    content: 統一分配每個人所能獲得的工作與待遇，確保待遇都完全相同
  - label: C
    content: 政府實施國民義務教育，讓所有人都可以上學受教育
  - label: D
    content: 設置公立圖書館，讓各地的人都有獲得知識的機會
