  group_stem: '(一) Read the poster and answer the questions.


    Sun Yanzi’s two concerts in Taiwan


    Don’t miss it!

    August 16 and 17, 2025

    The diva, Sun Yanzi, is coming to Taiwan to have the concerts at the Kaohsiung
