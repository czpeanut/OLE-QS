  group_stem: "More and more Taiwanese go to Japan to celebrate New Year every year.\
    \ On New Year’s Day, 33. . They want to do what Japanese people do, but some are\
    \ not sure how to do it. Here are the steps to follow:\n First, 34. . That door\
    \ is for the gods, not for people. People should use the left or the right door.\
    \ Second, 35. . Wash your left hand first and then your right hand. After that,\
    \ put water in your left hand and use it to wash your mouth. Third, when you stand\
    \ in front of the gods, bow once. Then, 36. . After that, bow two times, clap\
    \ your hands twice, and make a wish. In the end, bow once again.\n When you go\
    \ to a temple in Japan, remember to follow these steps. It is a right way to show\
    \ respect. Do as the Japanese do!\n\ncelebrate 慶祝 god 神 bow 鞠躬 clap 拍手 respect\
    \ 尊重\n\n(A) throw a coin (硬幣) into the box and ring the bell\n(B) wash your hands\
    \ and mouth before you pray(祈禱)\n(C) do not walk through the middle door\n(D)\
    \ they visit a temple (寺廟) and hope for a lucky year"
  tags:
    textbook: 第二冊（七下）第3次段考範圍
    labeled_by: ai
