  group_stem: 'Ann：Here we are in Bali!

    Nick：I love the airport. It’s so clean and bright!

    Nick’s dad：Follow me, guys. We must 37. our bags and suitcases through here.

    Customs Official：Welcome to Bali! 38. you bring any plastic bags with you?

    Nick’s dad：Yes, we 38. . Guys, take out your plastic bags.

    Customs Official：That’s fine, thank you. Please keep these bags and don’t 39.
    them 39. here. We’re plastic bag-free in Bali.

    Ann：That was so cool!

    Nick：Yeah! Plastic bag-free! Great idea! 40.

    Nick’s dad：In fact, it began with two elementary school children.

    Nick：Really?

    Nick’s dad：Uh-huh. Two sisters, Melati and Isabel, hated all the trash in Bali
    and started “Bye Bye Plastic Bags.”

    Ann：That’s amazing! What did they do?

    Nick’s dad：Well, first they got lots of people together and cleaned up Bali’s
    beaches.

    Then, 41. everyone’s help, Bali changed its plastic bag laws. Thanks to this,
    Bali now uses its plastic bags again and again.'
  tags:
