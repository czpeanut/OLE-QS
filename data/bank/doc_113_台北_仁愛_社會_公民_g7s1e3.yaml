- id: doc_113_台北_仁愛_社會_公民_g7s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 過去法律禁止任何人擅自狩獵與砍伐，政府與原住民族在傳統習慣、傳統領域等面向產生衝突，其中林務局與原住民族常因山林管理有摩擦。近年來，林務局推動「山林共管」政策，例如：與族人展開和解，並成立林業合作社發展林下經濟，也委由族人組成巡山隊等工作。林務局過去與原住民族時有摩擦的主因，應為下列何者？
  options:
  - label: A
    content: 因林務局推動山林共管造成部落經濟的停滯
  - label: B
    content: 因林務局對傳統領域內的山林造成環境破壞
  - label: C
    content: 因原住民族希望將傳統領域的土地交給政府
  - label: D
    content: 因過去的法律沒有考量原住民族的傳統文化
