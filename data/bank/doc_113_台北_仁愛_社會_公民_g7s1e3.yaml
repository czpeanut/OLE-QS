  type: single
  page: 1
  stem: 我國政府於2017 年通過原住民族語言發展法，立法保障原住民族語言為「國家語言」，並推動族語復興。下列哪項部落面臨的挑戰最可能因為該法而獲得改善？
  options:
  - label: A
    content: 傳統文化的斷層
  - label: B
    content: 部落經濟的停滯
  - label: C
    content: 傳統領域的爭議
  - label: D
