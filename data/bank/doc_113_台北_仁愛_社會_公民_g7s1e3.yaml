  stem: 在電影《哈勇家》中，談及哈勇一家人因有未婚懷孕的家人，依照「gaga」慣習殺豬與族人分食，但此時正逢競選期間，會讓人有藉著舉辦婚禮籠絡部落族人的聯想；只是賄選是以法律的角度來講，而殺豬本來就是部落的習慣。且在泰雅族的文化中，要選舉的年輕人如果不帶禮物去拜票，老人家會覺得沒有禮貌。所以禮物其實不是賄選，只是基本禮貌，其內容與事實相符。根據上文敘述，可看出我國原住民族面臨的何種挑戰？
