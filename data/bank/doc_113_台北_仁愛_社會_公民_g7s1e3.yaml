  type: single
  page: 1
  stem: 傑米、泰瑞和西德尼三人是好朋友，每年夏天，三人都會一同參加營隊。今年，新朋友泰勒和他們分在同一間房間。傑米為了湊齊營隊的報名費，需要去打工，卻遭到泰勒的嘲笑。傑米紅著臉，感到相當難為情，泰勒卻回答：「我是開玩笑的啦！」對此，傑米思考該如何讓泰勒知道帶有惡意的玩笑，會傷害他人的尊嚴。根據前述內容，泰勒可能侵害到傑米的何項權利。
