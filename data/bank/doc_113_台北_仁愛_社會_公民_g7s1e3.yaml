  section: 1
  number: 1
  type: single
  page: 1
  stem: 克漢在原住民族委員會的網站中發現有歲時祭儀專區，裡面是原住民族歲時祭儀放假日期的公告。原住民身分者在本人、父母或配偶的歲時祭儀放日期中，可擇一日放假。該政策主要考量最可能是下列何者？
  options:
  - label: A
    content: 落實部落自治，提升地方行政效率
  - label: B
    content: 推動觀光發展，增加青年工作機會
  - label: C
    content: 尊重多元文化，促進部落文化傳承
  - label: D
    content: 凝聚居民認同，保護部落傳統領域
