  stem: 日治時期，日本人曾以軟硬兼施的方式促使原本居住於山區的原住民族遷徙。但搬到較低海拔的原住民遭遇傳染病時，部落的醫師因為無法取得過去部落周邊既有的草藥，對許多疾病無法即時進行醫治，造成死傷。上述內容最能說明下列何項概念？
