  stem: "(1) 每年的65 歲以上人口成長率 $x$ 為固定值，則預計一年後的65 歲以上人口數為多少？( 列出含有 $x$ 的算式 ) (1 分)\n\
    \                           ( 註：人口成長率＝$\\frac{\\text{今年人口數}－\\text{去年人口數}}{\\\
    text{去年人口數}}\\times 100\\%$ )\n(2) 文中提到，預計兩年後65 歲以上的老人約有4410 人，請問成長率 $x$ 為多少？\
    \ (2 分)"
  group_stem: "1. 【時間銀行】\n  根據推估，到了民國115 年時，臺灣 65 歲以上的老人約占總人口的20 %。少子化的情形日益嚴重，人口老化的現象正逐年加劇，其他國家也都面臨了相同的情形，長照問題是一個不可忽視的重要議題。目前不少國家都已經推動了「時間銀行」的政策。簡單來說，這是一個「施與受」的計畫，也可比擬為存款與提款。參與此計畫的人，在自己年輕時先照顧其他長者，期間所有照顧他人的時數都會被一一紀錄下來\
    \ ( 存款 )，等到未來自己年老時需要他人照料，就能從銀行提領相等時數的免費服務 ( 提款 )。\n   \n         某市人口老化問題嚴重，目前65\
    \ 歲以上的老人約有 4000 人，預計兩年後65 歲以上的老人約有4410 人。該市的市政府早已推行「時間銀行」政策，至今剛好滿五年。由於其強力的推廣，因此在推行滿一年後的總存款時間便已有1.6\
    \ 萬小時，之後的第二年到第五年也以驚人的成長率累積時數，目前已經累積到了62.5 萬小時，且尚未有參與者提領免費服務。請根據上面的敘述，回答下列問題。"
