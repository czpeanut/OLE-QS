  stem: "齊有富人，家累千金，其二子甚愚。其父又不教之。一日，艾子謂其父曰：「君之子雖美，而不通世務。他日曷①能克其家？」父怒曰：「吾之子，敏而且恃多能，豈有不通世務耶？」艾子曰：「不須試之他，但問君之子，所食者米，從何來？若知之，吾當妄言之罪。」父遂呼其子問之。其子嘻然笑曰：「吾豈不知此也，每以布囊取來。」其父愀然②改容曰：「子之愚甚也！彼米不是田中來？」艾子曰：「非其父不生其子。」\n\
