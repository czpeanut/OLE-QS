    \ Temperature and Long Time，LTLT)、高溫短時間殺菌法(High Temperature and Short Time，HTST)、超高溫殺菌法(Ultra\
    \ High Temperature，UHT)。溫度越高，則需要的殺菌時間越短。\n    台灣大部分的鮮乳採用的UHT，以125~135 度的高溫加熱2~5\
    \ 秒。台灣業者大多使用這種殺菌法的主要原因有兩個：首先是因為這種殺菌法的產能最高，在相同的時間內能處理完較多的牛奶；再來則是因為它的殺菌效果最好。而台灣運送保存鮮乳的冷鏈系統不如歐美嚴謹，市面上的開放式冷藏櫃常常未達應有的保存溫度，採用UHT\
    \ 的鮮奶較不容易因此變質。\n    由於溫度極高，採用UHT 的鮮奶在加熱過程中會產生梅納反應。梅納反應是蛋白質與糖在高溫下產生的化學反應，能夠產生多樣化且豐富的香氣與味道，許多料理例如炒洋蔥、煎牛排的香味都是由梅納反應產生，台灣鮮奶的香味也是梅納反應的結果。\n\
    \    但是，這種味道並非所有人都喜歡。有些歐美國家因為消費者把這種味道辨識為異味，所以乳品廠普遍使用HTST，將生乳在72~75 度下加熱15 秒~1\
    \ 分鐘。由於溫度較低，這樣生產的鮮奶比較「不香醇」，但同時也更接近生乳原本的風味。台灣也少有廠牌採用這種作法。至於溫度更低、殺菌時間更長的LTLT 殺菌法，由於產能太低，只有少數規模較小的牧場會使用。而市面上常見的保久乳，則是以比UHT\
    \ 更高的溫度或更長的時間來達到更強的滅菌效果，再採用無菌包裝，所以可以在室溫存放，也能存放較長的時間。\n    總之，台灣的鮮奶之所以特別濃醇香，並不是因為額外加入食品添加物，而是因為採用UHT\
    \ 而產生的梅納反應。喜歡這種味道的人可以繼續安心購買習慣的品牌，不喜歡的人除了購買外國品牌外，也不妨試著尋找採用HTST 或LTLT 的台灣鮮奶，或許會有意外之喜。\
    \                   品學堂   為什麼有些鮮奶比較「濃醇香」？"
