- id: doc_113_高雄_左營_國文_g8s1e2_s4_17
  section: 4
  number: 17
  type: single
  page: 4
  stem: '人註定是歷史的動物，人之所以為人，在於他雖不能取消前一刻，卻能超越前一刻。人即使能超越前一刻，也還在活在整個古往今來的歷史之中。所以在超越前一刻之前，仍然得好好了解前一刻，就像看電影不能只看最後那一幕，也不能滿眼只是現在。

    有關這段文字意涵的理解，何者正確？'
