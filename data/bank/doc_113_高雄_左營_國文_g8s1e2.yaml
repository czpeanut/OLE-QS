  section: 5
  number: 21
  type: single
  page: 5
  stem: 根據上述三文的脈絡，「」中填入的主詞，何者正確？
  options:
  - label: A
    content: 「子敬」以其少言，故知之。
  - label: B
    content: 「子敬」便逕入坐靈床上。
  - label: C
    content: 「子猷」因慟絕良久，月餘亦卒。
  - label: D
    content: 「安道」經宿方至，造門不前而返。
  group_stem: '（一）

    【甲】獻之字子敬。少有盛名，而高邁不羈，雖閑居終日，容止不怠，風流為一時之冠。嘗與兄徽之①、操之②俱詣③謝安，二兄多言俗事，獻之寒溫而已。既出，客問安 王氏兄弟優劣，安曰：「小者佳。」客問其故，安曰：「吉人之辭寡，以其少言，故知之。」嘗與徽之共在一室，忽然火發，徽之遽走，不遑取履。獻之神色恬然，徐呼左右扶出。夜卧齋中，而有偷人入其室，盜物都盡。獻之徐曰：「偷兒！靑氊，我家舊物，可特置之。」羣偷驚走。                                                  節選自晉書卷八十  王羲之列傳

    【乙】王子猷、子敬俱病篤④，而子敬先亡。子猷問左右：「何以都不聞消息？此已喪矣！」語時了⑤不悲。便索輿⑥來奔喪，都不哭。子敬素好琴，便逕入⑦坐靈床上，取子敬琴彈，弦既不調，擲地云：「子敬！子敬！人琴俱亡。」因慟絕良久，月餘亦卒。                                         節選自世說新語
    傷逝

    【丙】王子猷居山陰，夜大雪，眠覺，開室，命酌酒。四望皎然，因起仿偟，詠左思招隱詩。忽憶戴安道，時戴在剡，即便夜乘小船就之。經宿方至，造門不前而返。人問其故，王曰：「吾本乘興而行，興盡而返，何必見戴？」                                                                     節選自世說新語
    任誕

    注釋：

    ①徽之：王徽之字子猷，東晉名士、書法家，王羲之眾多兒子之一。

    ②操之：王操之字子重，東晉琅邪郡臨沂縣（治今山東省臨沂市）人。王羲之眾多兒子之一。

    ③詣：一ˋ，造訪。

    ④篤：嚴重。

    ⑤了：ㄌㄧㄠˇ，完全。

    ⑥輿：轎子。

    ⑦逕入：直接進入。'
