- id: doc_113_高雄_左營_國文_g8s1e2_s4_2
  section: 4
  number: 2
  type: single
  page: 2
  stem: 下列有關愛蓮說文意的敘述，何者正確？
  options:
  - label: A
    content: 呈鞠：「香遠益清」顯示君子無遠弗屆的影響力。
  - label: B
    content: 富美：「中通外直」象徵君子嶔崎磊落，胸懷坦蕩正直。
  - label: C
    content: 宛莉：「不蔓不枝」反映君子不一心二用，專心致志的處事態度。
  - label: D
    content: 康麗：「出淤泥而不染」凸顯君子即使出身寒微仍自立自強的意志力。
  lesson_raw:
