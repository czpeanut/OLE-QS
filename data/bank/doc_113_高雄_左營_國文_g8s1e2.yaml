  section: 5
  number: 23
  type: single
  page: 6
  stem: 根據這兩段文字，下列何者敘述正確？
  options:
  - label: A
    content: 規律使用防曬乳者，血液中維生素D 的濃度必定比不用防曬乳的人高。
  - label: B
    content: 只要常常擦防曬乳，即使待在室內，接收到的紫外線也會較高。
  - label: C
    content: 無論在何處使用，防曬係數愈高效果愈好，只是對皮膚負擔也成正比。
  - label: D
    content: 一般而言，敏感性肌膚的人，使用油膩的物理性防曬乳較佳。
  group_stem: "（二）\n【甲】維生素D 的合成來自兩個主要來源：人體皮膚接受日照中的紫外線後合成，以及食物中的攝取。食物中攝取維生素D 的速度遠不及皮膚中合成的速度，因此，適當的日照應該還是維持健康所必需的。\n\
    \    根據很多針對成人的國外研究顯示，規律使用防曬乳液的受試者，其血液中維生素D 的濃度，並不低於（甚至高於）不常使用防曬乳液的人。當然這些研究都有個盲點：規律使用防曬乳液的人，想當然耳也是比較常做日光浴，或是暴露在陽光下活動的人，就算常常擦防曬乳液，接受到的紫外線還是偏高。總而言之，只要有在陽光下曝曬，不管有沒有擦防曬乳液，都能夠吸收足夠的維生素D，所以放心的擦就對了！\
    \      黃瑽寧  親子天下\n【乙】防曬四重點：\n1.防曬乳有兩種：一種是化學性防曬，清爽不油膩，但比較刺激、過敏可能性高；另一種是物理性防曬，成分有二氧化鋅、氧化鋅等物質，比較油膩但相對安全溫和。\n\
    2.防曬係數愈高，皮膚負擔愈大。\n3.防曬乳的SPF 係數是指延遲皮膚被曬傷的時間。一般而言，人體在太陽底下約15 分鐘會被曬黑，若SPF30 來計算則為：15×30=450，意味著防曬乳能在室內提供450\
    \ 分鐘的保護，但室外則得把分鐘數再÷2，變成225 分鐘。\n4.紫外線分為兩種：UVA(長波紫外線)、UVB(短波紫外線)。SPF 是隔離抵擋UVB，PA\
    \ 則是隔離抵擋UVA，選擇防曬乳要兩種紫外線都阻隔。                                                  \
    \     漢森醫師  親子天下"
