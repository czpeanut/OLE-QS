- id: doc_113_高雄_左營_國文_g8s1e2_s4_15
  section: 4
  number: 15
  type: single
  page: 3
  stem: "小時候，最害怕被老師點名的時刻。\n(甲)但，弔詭的是，只要坐下以後，我的心情就像搭雲霄飛車似的，從忐忑到緩和下來，沉浸於聆聽同學發表的精湛言論，內心的不安也漸漸消退，取而代之的是醍醐灌頂的喜悅。\n\
    (乙)一瞬間，內心的膽怯無所遁逃，身體像是觸電一樣，不只腦袋一片空白，還會語塞茫然。當我好不容易整理完紊亂的思緒，想要認真回答的時候，暢所欲言的機會就彈指而過了。\n\
    (丙)從此，羞澀木訥已成撕不掉的正字標記。我把說話視為畏途，任何需要侃侃發表的場合，都會讓我心跳加速、臉色慘淡。\n(丁)當時，老師體諒我木然站立的尷尬，將心比心要我先坐下。但殊不知，不善言辭成為學習系譜的一道傷痕。\n\
    \    由於同學們的思考都太有創意，讓我忍不住振筆疾書，紀錄課間如燦花般的互動。那段安靜坐在課堂裡，傾聽同學辯才無礙、靈光閃現的言談，讓我內心豐盈、收穫滿滿。\n\
    根據本文文意，下列排序何者恰當？"
  options:
