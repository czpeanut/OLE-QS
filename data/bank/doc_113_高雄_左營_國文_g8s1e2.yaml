  stem: "荊王所愛妾有鄭袖者。荊王新得美女，鄭袖因教之曰：「王甚喜人之掩口也，為近王，必掩口。」美女入見，近王，因掩口。王問其故，鄭袖曰：「此固言惡王之臭。」及王與鄭袖、美女三人坐，袖因先誡御者曰：「王適有言，必亟聽從。」王言美女前，近王，甚數掩口，王悖然怒曰：「劓①之。」御因揄刀而劓美人。\n\
