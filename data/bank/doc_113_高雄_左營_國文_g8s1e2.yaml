  stem: '漢武帝乳母嘗於外犯事，帝欲申憲，乳母求救東方朔。朔曰：「此非唇舌所爭，爾必望濟者，將去時，但當屢顧帝，慎勿言。此或可萬一冀耳。」乳母既至，朔亦侍側，因謂曰：「汝癡耳！帝豈復憶汝乳哺時恩邪！」帝雖才雄心忍，亦深有情戀，乃淒然湣①之，即敕免罪。                           世說新語
