  stem: '上文借用右框文獻以編寫情節。若對照二者提出①、②，最適當的研判是：

    ①《夢溪筆談》中的吳丞相，推斷的是「畫中物體所處的時間」，而非「繪圖者作畫的時間」。

    ②《大唐狄公案》中的狄仁傑，是以「畫中物體所處的時間」即「繪圖者作畫的時間」做為推斷案情的基礎。


    【參考文獻】

    歐陽公嘗得一古畫──牡丹叢其下有一貓，未知其精粗。丞相正肅吳公與歐陽公姻家，一見曰：「此正午牡丹也。何以明之？其花披哆而色燥，此日中時花也；貓眼黑睛如線，此正午貓眼也。」（《夢溪筆談》）'
