- id: doc_113_屏東_明正_國文_g9s2e2_s2_26
  section: 2
  number: 26
  type: single
  page: 4
  stem: 依據甲文，關於宋代防治傳染病的敘述，何者錯誤？
  options:
  - label: A
    content: 已經意識到環境衛生與疫病相關
  - label: B
    content: 加強邊境檢查以免疫病危及軍隊
  - label: C
    content: 透過隔離降低患者交互感染機率
  - label: D
    content: 翰林院醫官和太醫局多參與救治。
  group_stem: "(二)  \n【甲】宋代防疫 \n宋代有近百次的大規模傳染病發生。除了天然災害所引起的疫病,戰爭也使軍隊和邊境的疫病次數超越前代。此外，不合理的生活方式所引發的疫病也逐漸增多，例如淳熙五年寧海縣的疫病，便是當地人食用海鰍所致。\
    \ \n當疫病流行，政府通常令翰林院醫官、太醫局派人巡診賜藥,如紹興二十六年，臨安疫，宋高宗令醫官配製小柴胡湯醫治患者。改善環境衛生也是一項作為，如真德秀任職泉州時，見城內溝渠淤塞，蒸為癘疫，乃下令清理。為防止疫情擴散，政府也採取隔離病人的措施，如元祐四年，杭州因乾旱而發生大疫，蘇軾設立專門的「病坊」來收治患者。蘇軾在杭州的賑災抗疫，不僅蘇轍在其兄的墓誌銘有具體記載，明代醫書也說蘇軾以「聖散子」這帖藥方為滿城病患施救。後來，政府以「安濟坊」為名在各地設置這類病坊，持續推行「以病人輕重而異室處之,以防漸染」。\
    \                 改寫自韓毅〈宋代政府應對疫病的歷史借鑒〉 \n【乙】蘇東坡防疫 \n明年方春，即減價糶①常平米，民遂免大旱之苦。公又多作饘粥、藥劑，遣吏挾醫，分坊治病，活者甚眾。公曰:「杭，水陸之會，因疫病死比他處常多。」乃裒②羨緡③得二千，復發私橐④得黃金五十兩，以作病坊，稍蓄錢糧以待之。\
    \                                               蘇轍〈東坡先生墓誌銘〉 \n注釋①糶:音ㄊㄧㄠˋ，出售穀物。②裒:音ㄆㄡˊ，聚集。③羨緡:盈餘款項。④橐:音ㄊㄨㄛˊ，袋子。\
    \ \n【丙】 \n| 傳染病介紹 | |\n| :--- | :--- |\n| 傷寒 | 由傷寒桿菌引起的腸道傳染病，多發生於缺乏乾淨水源或環境衛生較差的地區。\
    \ |\n| 百日咳 | 由百日咳桿菌侵犯呼吸道引起的疾病，一年四季都可能發生，病患多半是五歲以下兒童。 |\n| 結核病 | 由結核桿菌引起的慢性傳染病，主要藉由飛沫與空氣傳染，常發生在與病患同住一室的家人。\
    \ |\n| 桿菌性痢疾 | 由志賀氏桿菌引起的腸道疾病，在缺乏乾淨水源或環境衛生較差的地區容易流行。 |\n| 退伍軍人病 | 由退伍軍人菌引起的疾病，水塔與冷熱水源都曾發現此菌，目前尚無人傳人的病例。\
    \ |"
  tags:
    textbook: 第六冊（九下）第2次段考範圍
    labeled_by: ai
    chapter:
      publisher: null
      book: 九下
      subject: 國文
      code: null
      title: null
      chapter: null
