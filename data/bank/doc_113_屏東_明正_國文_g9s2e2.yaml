  stem: 「丟失一個釘子，壞了一只蹄鐵；壞了一只蹄鐵，折了一匹戰馬；折了一匹戰馬，傷了一位騎士；傷了一位騎 ，輸了一場戰鬥；輸了一場戰鬥，亡了一個帝國。」這首異國民謠，符合下列哪一種效應?
  options:
  - label: A
    content: 「鯰魚效應」：管理理論之一，引進強者進入團體，創造競爭機制，刺激弱者變強，致使績效產。
  - label: B
    content: 「蝴蝶效應」：連鎖效應之一，意即表面上看來毫無關係、非常微小的事情，可能帶來巨大的影響。
  - label: C
    content: 「破窗效應」：犯罪學理論之一，即環境中的不良現象若被放任，會誘使人們仿效，甚至變本加厲。
  - label: D
    content: 「羊群效應」：人際理論之一，意即從眾心理，從眾容易導致盲從，而盲從往往會受騙或遭遇失敗。
