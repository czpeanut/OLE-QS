  stem: 以下哪一選項的「之」字，指「奇鬼」？
  options:
  - label: A
    content: 欲遇而刺殺「之」
  - label: B
    content: 「之」市而歸
  - label: C
    content: 遂逝迎「之」
  - label: D
    content: 拔劍而刺「之」。
  group_stem: "(一)《呂氏春秋．疑似》戰國 呂不韋 \n梁北有黎丘部，有奇鬼焉，喜効①人之子姪昆弟之狀。邑丈人有之市而醉歸者，黎丘之鬼効其子之狀，扶而道苦之。丈人歸，酒醒，而誚②其子曰：「吾為汝父也，豈謂不慈哉？我醉，汝道苦我，何故？」其子泣而觸地曰：「孽③矣，無此事也；昔也往責④于東邑，人可問也。」\
    \ \n其父信之，曰：「嘻，是必夫奇鬼也，我固嘗聞之矣。」 \n明日，端⑤復飲於市，欲遇而刺殺之。明旦，之市而醉，其真子恐其父之不能反也，遂逝⑥迎之。丈人望其真子，拔劍而刺之。丈人智惑於似其子者而殺於真子。\
    \ (莊芳池〈湯圍溫泉〉) \n註①：効，「效」的異體字，摹仿   註②：誚，音ㄑㄧㄠˋ，責備   註③：孽，罪過。 \n註④：責，索取，求取。     \
    \     註⑤：端，故意，特地。       註⑥：逝，往，去"
