  group_stem: "(三) 龐氏騙局 \n龐氏騙局(Ponzi Scheme)是一種金融詐騙手法，最初源自於1919 年的美國，一名義大利移民查爾斯龐氏(CharlesPonzi)成立了一家空殼公司並設計了一個投資計畫，宣稱三個月內可以獲40%的利潤回報，接著龐氏利用後來投資人所支付的資金，付給早期的投資人作為紅利，也就是所謂的「A」，以誘使更多人上當，並成功地在七個月內吸引了三萬名投資者，這場陰謀持續了一年之久才被戳破，最終投資金額超過1500\
    \ 萬美元。不過龐氏也因此被判刑，出獄後又陸續因為幾起金融詐騙案而坐了更久的牢。1934 年龐氏被遣返回義大利，並在1949 年病逝於巴西里約。龐氏騙局手法有以下幾種特徵：1.號稱穩賺不賠且高額報酬投資機會。2.「B」式的投資模式，拉人當下線能獲得獎金。3.投資策略複雜，藉由認知偏差來詐騙。4.看到帳面有獲利，卻很難取出來。5.資金累積到一定程度後，負責人直接捲款潛逃。\
    \  \n                                                   -節錄自：小資女想退休〈龐氏騙局是什麼〉"
