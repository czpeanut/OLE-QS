  stem: 「俄羅斯娃娃是俄羅斯特產木製玩具，一般由多個一樣圖案的空心木娃娃一個套一個組成，一般在六個以上。娃娃通常為圓柱形，底部平坦可以直立。最普通的圖案是一個穿著俄羅斯服裝的姑娘，叫做『瑪特廖·什卡』，這也成為這種娃娃的通稱。」下列何者屬於此段文字所運用的說明方法？
  options:
  - label: A
    content: 概括說明：針對事物或事理的內容、特徵，作出簡明且扼要的介紹
  - label: B
    content: 分類說明：將一組事務、現象，按一定的標準分門別類地加以說明
  - label: C
    content: 舉例說明：選取事物中最具代表性的實例，用以說明事物的共同性
  - label: D
    content: 故事說明：通過講故事的形式，對某個事物或事理進行說明的方法。
