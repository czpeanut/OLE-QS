  number: 18
  type: single
  page: 2
  stem: 「①一群人圍著宮廟互相介紹工作，板模拿到就介紹泥作，水電進場就推薦木工；賠了錢，②回頭進宮廟找兄弟哭訴周轉，賺到錢立刻點燭，還願加碼普渡。然後隨著年齡增加，技術和功夫進步後，一個一個獨立出來變成真正的師傅，又變成真正的包商。賺了錢，再回頭謝神，謝兄弟，③謝拜把的情義相挺，謝老婆不離不棄。相較於那少數回家被報導的什麼新貴創業或是小文青回家開咖啡廳，④這些「八嘎囧世代」才是真正支撐郊區地方和文化的主力。」這段論述中畫雙線的文字，何者屬於作者意圖陳述的論點？
