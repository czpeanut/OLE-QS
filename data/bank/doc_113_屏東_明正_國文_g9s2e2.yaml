    \ \n狄公連忙跨上露臺，孫天師臉色慘白，「真智……大概想扶著欄杆走上露臺，但那欄杆早已朽斷，他怎麼忘了呢？只恨貧道晚了一步，沒抓住他。」狄公命陶干速到崖下查看，與孫天師進了書房。\
    \ \n「狄兄，究竟發生何事？」孫天師盯著狄公，狄公自懷中掏出一卷畫，「我在地室見了許多玉鏡真人畫貓之作，發現他很重視細節描繪。其中一幅，貓眼微瞇，瞳仁如同細線，我心裡一動，想起真人的最後一幅畫，就是您指給我看的那幅，貓的瞳仁很大，炯炯有光，作畫時間絕非如真智所言。」\
    \ \n「貧道不明白你在想什麼。」孫天師臉上有些惱意。 \n「我推測事發日，玉鏡一直在室內畫貓。午膳後，真智來與玉鏡喝茶，暗將毒藥撒入玉鏡的茶盅，離去時特地告訴門外道士，玉鏡要畫畫，不喜旁人在，藉以表明玉鏡乃午後方始作畫。半個時辰後，玉鏡精神亢奮，自言自語，此皆毒藥引發幻想，他卻以為是神靈啟示。待他向全體道人長篇宣講後，終究支撐不住，渾渾噩噩就此去了。」\
    \ \n「那真智為何要殺玉鏡？」 \n「我想是因為他害怕自己違背教律的行為，已讓玉鏡發現。玉鏡給宗笠的信中，透露了他的懷疑。」 \n「作孽啊！」孫天師捂著眼睛，不看狄公，「貧道不該整日關在書房，對道觀的事不聞不問。」\
    \ \n                                     （改寫自高羅佩( Robert H. van Gulik )《大唐狄公案》）"
