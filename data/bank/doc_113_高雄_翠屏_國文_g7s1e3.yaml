- id: doc_113_高雄_翠屏_國文_g7s1e3_s1_24
  section: 1
  number: 24
  type: single
  page: 6
  stem: 根據本文，下列敘述何者最恰當？
  options:
  - label: A
    content: 母親的冬瓜湯會加入泡發的香菇和干貝
  - label: B
    content: 賈媽媽的冬瓜盅須用蝦米和蔥爆香油鍋
  - label: C
    content: 作者覺得吃過最好的料理是母親的冬瓜湯
  - label: D
    content: 作者認為賈媽媽的冬瓜盅的做法較為繁複
  group_stem: "一片薄薄的冬瓜（改寫） 張曼娟\n 小時候陪母親上市場，夏天裡總要買塊冬瓜回去煮湯。母親將冬瓜削皮切成小片，用蝦米和蔥爆香油鍋，再將它們投進煮沸了水的湯鍋中。煎成焦黃的蝦米吱吱叫著，冬瓜片一進鍋裡就安靜下來，蝦米的燙熱和疼痛彷彿都獲得了安撫。我一直覺得，媽媽的冬瓜湯，已經是冬瓜最好的料理方式了，這想法被鄰居賈媽媽的冬瓜盅徹底顛覆。賈媽媽有次宴客，當她將一顆矮矮的冬瓜蓋子打開來，我看見裡頭的羹湯時，驚詫到說不出話來。香菇與干貝的氣味混著冬瓜的清香，那湯汁說不得混也說不得清。賈媽媽說她先將肥大香菇泡發，加上金黃色的干貝燉湯，倒進挖空的冬瓜裡再蒸一遍。那夜賈家姐妹來叫我，說賈媽媽留了冬瓜盅給我，他們家的客人已經離開了。我們穿越煙霧彌漫混著酒氣的客廳，走進杯盤狼藉的廚房，冬瓜盅裡的湯汁僅剩一點點，我們拿起小湯匙，挖著冬瓜肉吃，被湯汁潤透的冬瓜肉透明著，不可思議的美味。\n\
    \ 很多年後，我在一家餐廳吃飯，冬瓜盅上了桌，我起鬨說要用湯匙舀起瓜肉來吃才過癮。興致勃勃的舀起冬瓜的那一刻，眼睛忽然酸熱起來。我想起賈家早逝的那個兄弟，各自遠嫁卻又不斷飄泊的姐妹，想起我們擠在一起挖冬瓜吃的那個永遠不會返來的童年時光。\n\
    \ 此刻，我獨自提著一片薄薄的冬瓜回家，仍是用母親煮湯的方式料理，而我的心裡藏著的是繁複美麗的冬瓜盅。我有時候羨慕冬瓜煮過就透明了，人生卻要經歷多少的烹煮，才能夠明明白白？"
