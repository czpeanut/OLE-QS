- id: doc_113_高雄_翠屏_國文_g7s1e3_s1_22
  section: 1
  number: 22
  type: single
  page: 5
  stem: 「它們伸長了手臂與橋相互擁抱，接回一個個回村的孩子，也送走一個個離村的老人。」這句話中「也送走一個個離村的老人」的涵義，與下列何者最能相呼應？
  options:
  - label: A
    content: 楊柳護著河堤，護著橋
  - label: B
    content: 然而到了最後，村莊的人們都會被抬過橋
  - label: C
    content: 出村的那座橋是離鄉背井的人所有鄉愁的起點
  - label: D
    content: 被河水、沙與日子磨得光溜溜的石柱像赤著胳膊挑山的漢子
  group_stem: "故鄉原風景（改寫） 朱慧彬\n 山裡雲寵愛的故鄉有過許多的小橋：獨木橋、鐵索橋，石拱橋……它們都曾鮮活地活在時光的河流裡。而出村的那座橋是離鄉背井的人所有鄉愁的起點。起初的橋是石木搭建的，橋面是木，支撐木橋的橋墩是紮根在泥水裡的石頭。被河水、沙與日子磨得光溜溜的石柱像赤著胳膊挑山的漢子，硬生地托起人們往來的腳程。楊柳護著河堤，護著橋。它們伸長了手臂與橋相互擁抱，接回一個個回村的孩子，也送走一個個離村的老人。他們許多人的一生，都在過橋。不同的是，人們有時是哭著過橋，有時是笑著過橋，有時是被抱過橋，或者背過橋，然而到了最後，村莊的人們都會被抬過橋。因此，村裡人若要出遠門，遠在遠方的親人總會在電話那端習慣地問一句——走了？過橋了沒？\n\
    \ 故鄉的春夏，楊柳會生長成一道道符，如煙如霧地張貼在橋頭橋尾。楊柳通常將大部分的身體埋進河面，阻擋著有些興奮過頭的河水沒過橋面；而冬夏時則瘦成一條條手臂，一根根手指，隨時挽扶住路過溼滑橋面的行人。煙柳橋是村莊歷史的書寫者與參與者。在老人們語焉不詳的故事裡承擔著重要的角色。它是故事的原點，或者終點。是紅娘橋、婚姻橋、狀元橋，官運橋。它知禍福，知前程。村裡出去的人長成大人物後回村必談煙柳橋，必修煙柳橋，就像說自己的父母，修自家的門楣與屋簷。\n\
    \ 對於許多活在異鄉的遊子而言，故鄉的地理標籤便是這座煙柳橋——過了煙柳橋便是進了村，到了家。"
