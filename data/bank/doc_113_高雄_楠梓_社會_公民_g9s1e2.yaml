- id: doc_113_高雄_楠梓_社會_公民_g9s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 甲機關是『錯誤』的，應修正為？
  options:
  - label: A
    content: 消費者保護處
  - label: B
    content: 消保官
  - label: C
    content: 公平交易委員會
  - label: D
    content: 經濟部。
  group_stem: '素養二公平競爭

    全聯併購大潤發有條件通過

    全聯福利中心2021 年10 月底宣布收購大潤發，(甲)消費者服務中心於2022 年7 月中決議：不禁止其結合，但附加7 項負擔，以確保結合後「整體經濟利益」大於「限制競爭之不利益」。

    全聯主張收購大潤發有助於提高營運、商品調度的效率，也可以減少店面的缺貨率、提升消費者滿意度。而公司也將對大潤發既有店面進行改裝、更新設備環境，創造更好的消費體驗。然而，外界仍擔心結合可能造成市場過度集中、調漲價格，導致消費者荷包縮水、在通路為王的時代，是否會導致相對弱勢的供貨商，在交易上處於更不利的地位，甚至有不當新增或提高各種附加費用等問題。

    全聯及大潤發是民生消費市場的龍頭，兩者確實能提升經營的績效、更有效的運用資源，但也因為兩者都是大型企業，(乙)其結合確實也可能對市場競爭產生負面影響，不可不慎。因此，受理此案後，即邀集上游供貨商所屬相關公（協）會、零售通路同業、學者專家及消費者保護主管機關充分討論。對此，(丙)提出附加的7
    項限制，包含「不得任意漲價」、「全國定價一致原則」、「對供貨廠商不收取商品上架費、新點贊助費」等。希望透過此一結合案，能達到業者、消費者、社會大眾三贏的局面，而全聯確實也在過程中主動承諾並提出許多願意負(丁)企業社會責任的相關作法，包含平抑物價、協助農產品促銷、加強對離島與偏鄉服務及致力於社會公益或急難救助等。'
  shared_asset: g1_11_13
  tags:
    chapter:
      publisher: 翰林
      book: 九上
