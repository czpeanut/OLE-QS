- id: doc_112_彰化_福興_英語_g8s1e2_s5_1
  section: 5
  number: 1
  type: single
  page: 2
  stem: What did the keys of the piano look like in the past?
  options:
  - label: A
    content: Its keys were colorful.
  - label: B
    content: It had 5 black and 7 white keys in one group of notes
  - label: C
    content: It had 7 black and 5white keys in one group of notes
  - label: D
    content: Its 88 keys were all black.
  group_stem: '(1)

    Why Are Piano Keys Black and White?

    We can find out the answer by looking at the history of the piano. In the past,
    the keys of the pianos were arranged in a repeating pattern of 7 black and 5 white
    keys. There were two reasons for this. First, the musicians had to recognize the
    notes quickly. If all the keys looked the same, it would be difficult to tell
    one note from another. Because of this, people separated 88 keys into repeating
    groups of 12 notes. In each group of 12 notes, there were 7 black and 5 white
    keys. Second, people used ivory that was elephant''s tusk to make white keys and
    ebony wood whose color was dark for the black keys. These two materials were durable,
    elegant and smooth. There were more black keys because of the price of the ivory.
    The price of the ivory was high. But now people don''t use ivory as keys, so there
    are 7 white and 5 black keys in modern pianos.


