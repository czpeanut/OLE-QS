- id: doc_111_高雄_林園_國文_g7s2e3_s2_45
  section: 2
  number: 45
  type: single
  page: 6
  stem: 老教授說：「我是為釣，不是為魚。」根據本文，這句話的含義不包括下列何者？
  options:
  - label: A
    content: 只重工作，不重休閒
  - label: B
    content: 只問耕耘，不問收穫
  - label: C
    content: 只看過程，不看結果
  - label: D
    content: 只圖樂趣，不圖名利。
  group_stem: "(三)〈釣勝於魚〉陳之藩 \n    每天早晨我在湖邊整頓小艇，常有位銀髮的老教授蹣跚的走來。 \n  「早安。」他老遠的打招呼。 \n\
    \  「今天還出去划船嗎？」我問。 \n  「當然，天氣真好啊，我太喜歡釣魚，可惜這湖中的魚不大。」 \n  「反正你是為釣，並非為魚。」 \n  「對極了，對極了。我是為釣，不是為魚。」他一邊說著，一邊登上小船，帶著他的釣具與幾本書，馬達照例不開，雙槳輕輕划破水面，悠然遠去。\
    \ \n  這位老教授在哥倫比亞大學已教書三十年了，這幾年的暑假常到這湖邊來。每天扁舟垂釣，竟日方歸，最多能釣上一兩條三四吋長的小魚，而他的享受卻是在釣。\
    \ \n  能夠欣賞釣，而不計較魚，是會使一個人快樂，使一個團體健康，使一個社會成功的。美國有許多學者，在一個學校工作，一工作尌是一生，真是數十年如一日。並不是美國人的耐性特別長，實是他們在工作本身發現出無限的趣味，感覺自己沉醉於鳥語花香，和山清水媚。至於魚竿之下是否有魚，他們反而忘了。\
    \ \n  愛因斯坦剛到普林斯頓時，主事人問他一年要多少薪俸，他說五千差不多了。一年五千元是物理系剛畢業的學生的水準，主事人說：「給你年俸五千，給別人尌不好給了，請為我們著想一下，還是勉強訂年俸一萬五千元罷。」\
    \ \n  其實，愛因斯坦常忘了兌取支票，正如釣魚者釣上魚來，又拋入水中一樣。他們從來尌未考慮到這些瑣事。 \n  然而，不是為魚的釣者，卻常常釣上大的魚來，因為他終年在水濱，常有機遇到來，非如緣木而求魚的「智者」，徒勞心力而已。\
    \ \n  日已正午，老者的扁舟又悠悠划回來了，照例的提著他的兩條小魚，登上岸來向我笑了笑，並且說：「我是為釣，不是為魚。」 \n  老者的背影消失在山坡的綠叢裡，唯日光照去，他的髮色與魚的鱗色偶閃銀光。"
