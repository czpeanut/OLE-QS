  group_stem: "(四) 〈俗不可耐〉蒲松齡 \n    沂水某秀才，課業山中。夜有二美人入，含笑不言，各以長袖拂榻，相將坐，衣軟無聲。少間，一美人貣，以白綾巾展几上，上有草書三、四行，亦未嘗審其何詞。一美人置白金一鋌，可三、四兩許；秀才掇內袖中。美人取巾，握手笑出，曰：「俗不可耐！」秀才捫金，則烏有矣。"
