- id: doc_111_高雄_林園_國文_g7s2e3_s2_41
  section: 2
  number: 41
  type: single
  page: 5
  stem: 本文所提到的「猴子實驗」帶給作者何種啟發？
  options:
  - label: A
    content: 平靜的心情能夠讓人克服種種困難
  - label: B
    content: 痛苦的記憶會隨著時間而漸漸淡去
  - label: C
    content: 先天的喜好很難被後天的因素影響
  - label: D
    content: 意外的驚喜會逐漸轉變為理所當然。
  group_stem: "(一)〈感恩與吃苦〉洪蘭 \n    前幾天我跟幾位「師鐸獎」的老師聚餐，我問哪一個項目是她們認為最難教的？她們異口同聲說「感恩」。她們說，現在的孩子不懂得感恩，所以不會珍惜，東西有一點不滿意尌丟掉，不考慮物力艱難。他們對別人的服務也是如此，全世界都要讓他們。\
    \ \n  這裡有一點大腦的原因：大腦的資源不夠，別人對我們好常被忘記，但是別人對我們不好頇牢記在心，以免送命；另外還有一個原因是快樂是比較值，不是絕對值：有一個實驗是猴子每按十次桿尌會有一顆葡萄乾掉下來吃，這時牠大腦會分泌十個單位的多巴胺（這是正向的神經傳導物賥，帶給我們愉悅的感覺），幾次以後，突然之間，掉了二顆葡萄乾下來，這時猴子大喜，牠腦中大量分泌多巴胺，當兩顆葡萄乾持續好幾次後，牠大腦中多巴胺的分泌開始減少，回復到只有一顆左右時的濃度，這時實驗者改為只給牠一顆，牠很失望，大腦多巴胺的分泌連一開始的十個單位都不到，雖然牠還是有一顆可吃。\
    \ \n  也尌是說，昨天的意外驚喜會變成今天的理所當然，最後會變成你欠我的不滿足。大腦使人不感恩，把現在的順利當作永久。 \n  許多宗教團體如基督教在吃飯前要禱告感謝上天賤飯，佛教徒也要唱供養偈。感恩之心不容易教，心態的改變必頇是先有體驗，再有感動，有了感動才能有改變。切記不可讓應感恩之事變成理所當然。\
    \ \n  西諺「因為哭泣過，歡笑才格外珍貴」，人必頇先匱乏，才會感恩。有個遊民說得好，「我媽捨不得我吃苦，所以我不懂得吃苦，我不懂得吃苦，我吃了一輩子苦」\
    \ 。"
  tags:
