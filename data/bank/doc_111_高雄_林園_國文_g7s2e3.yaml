    \ \n    結婚第七年，夫妻倆決定帶著稚齡兒女回臺定居，她一心想像媽媽一樣當個賢妻良母專心持家，但看著其他新住民帶著母國文化來到臺灣，兩方文化衝突產生誤會與悲劇，陳凰鳳決定去當志工，也因此得知更多悲傷的故事。「有個姐姐在準備祭拜牲禮時，不知道臺灣傳統必頇全雞、全魚，按照越南習慣全部切塊、切片，婆婆看了勃然大怒，但兩人語言不通，媳婦不知道哪裡做錯，而造成極大的誤解。」此外，在越南無論年紀，只要是輩分較長，都會被尊稱為姐姐，但臺灣同輩間習慣直呼其名，「有位姐妹一直被小姑喊名字，覺得不受尊重，也不喜歡臺灣人總是愛取暱稱『阿蘭、阿惠』。」\
    \ \n    陳凰鳳的流利中文帶著一點廣東腔，常被誤會是香港人。有次孩子生病，住在雙人房，她和另一位照顧孩子的媽媽聊天時，被對方誤會是新加坡人，說明越南人後，對方傴傴回答「喔」尌不再言語，她回想：「當時對方的態度讓我很受傷，不過後來我想通了，人對陌生的族群不了解很正常，我應該主動分享，現在我會開玩笑，我住在西貢，但不是『香港西貢』，是『越南西貢』喔！」\
    \ \n    早期臺灣對新住民的跨國婚姻沒有信心，加上媒體報導讓社會認為娶外配的男人社會地位低、找不到老婆，公婆總是希望媳婦趕快融入臺灣，不要被認出是外籍配偶，也不希望孫子學習媳婦母語，擔心影響中文學習和課業發展。\
    \ \n    陳凰鳳一家人剛搬回臺灣時，孩子只有一、兩歲，雖然在公婆要求下，她盡量和孩子說中文，但孩子還是有點混淆，問什麼都回答「沒有」，因此被堂兄弟笑「沒有先生」，加上講越語家人也聽不懂，兒子最後乾脆不說話，「其實那時我很緊張，決定好好跟他說中文，半年後兒子終於能好好開口說話。」等到孩子上幼稚園，她才又開始和孩子說越語。\
    \ \n    如今一雙兒女都是高中生，兒子崇拜她，覺得媽媽說什麼都好、做什麼都對，相反地，很有個性的女兒說話直，對餐桌上的飯菜不滿意也直說，陳凰鳳不得不嚴格要求女兒，「我父母的教育方式，讓我養成謹慎的性格，懂得察言觀色、注意他人需求，這些都是好事，為什麼不能要求女兒當個好女人？」但先生忍不住抗議了，「老婆，你的時代和孩子們的時代不同啦，我會心疼女兒的！」夫妻總是因為教育子女貣爭執。\
    \ \n    當她打電話給女兒，聽到電話那頭冷淡回答「怎樣」時，她又責備：「女兒，你應該說，媽媽有什麼事嗎？」讓女兒更加不悅。陳凰鳳的期望，造成了女兒的反感，認為媽媽對自己太嚴格，女兒國中時，兩人關係變差。\
    \ \n有一天，陳凰鳳決定要跨出溝通第一步，母女兩人待在房間聊天，陳凰鳳說著自己對教育的想法，忍不住掉下眼淚，女兒也開口道歉，說出覺得自己不被疼愛的心情。\
    \ \n    跨過了這一關，兩人感情恢復往昔，甚至變得更加緊密，女兒升上高中的那年母親節，女兒不再是被要求而心不甘、情不願說出母親節快樂，而是為晚歸的她在桌上留了張紙條，寫著：「媽媽辛苦了，母親節快樂，早點睡覺喔！」陳凰鳳哭了又哭。她也調整了自己的教養觀念，留下臺灣社會也認同的作法，例如在文雅的用詞與說話禮節方面，當女兒大笑時她不再出聲阻止，也讓女兒疲累時能躺在沙發抬腳休息。\
    \ \n曾經不愛拍照、也不喜歡和家人合照的女兒，現在手機裡一定有和媽媽的自拍照，母女都找到更放鬆生活的方式了。對陳凰鳳來說，在不同的文化、不同的世代，找尋適合彼此的生活方式，是她為人妻、人母路上，不斷學習的一堂課。"
