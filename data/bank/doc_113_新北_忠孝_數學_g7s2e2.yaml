  stem: "漂白水是一種強效的清潔劑，許多人使用稀釋漂白水進行環境消毒。根據衛福部疾病管制署的建議，稀釋漂白水能有效殺滅流行性感冒病毒、腸病毒和諾羅病毒。透過「漂白水：清水＝1：49」的比例稀釋，調配出的稀釋漂白水，可用於消毒染有嘔吐物、分泌物、血液的表面。而以「漂白水：清水＝1：99」的比例稀釋，調配出的稀釋漂白水，適用於一般家居或校園環境的清潔工作。請根據上述資訊回答以下問題\n\
    \      品潔手上有一桶5 公升用於消毒嘔吐物的稀釋漂白水，現在想調成一般清潔工作用的漂白水20 公升，請問品潔還需要多少公升的漂白水與清水"
