- id: doc_112_彰化_埤頭_國文_g7s2e1_s3_43
  section: 3
  number: 43
  type: single
  page: 3
  stem: 根據這段文字，關於詹氏下列行為的動機，何者說明正確？
  options:
  - label: A
    content: 醫院拿藥——以備淑華生產之需
  - label: B
    content: 幫助淑華——因淑華不會照顧阿彬
  - label: C
    content: 長年寄居——幫傭分攤以獨立維生
  - label: D
    content: 淚水難忍——思及育女疏失導致的意外。
  group_stem: '素娥把母親的拉鍊扣好，詹氏轉身面對她說：「你不高興嗎？」


    「不，母親。」素娥深為難過地說：「你昨天才到醫院看醫生，今天就要走……」


    詹氏接著說：「我去拿藥是給旅途做準備，我知道自己的身體，你說我不去可以嗎？阿彬娶了那樣的妻子，什麼也不懂，肚子那麼大了，生產的時候怎麼辦？」


    素娥有點生氣地說：「他們自己不會想辦法？」


    詹氏又說：「阿彬是一個脫線的人，我是去幫淑華，現代的女孩子那裡懂得那麼多。」


    素娥憤憤地說：「淑華有她自己的母親。」


    詹氏說：「我這個祖母會輸給她那個母親？」


    素娥說：「當然輸，你還不知道？」


    詹氏倔強地說：「不輸。」


    素娥說：「到時候你就知道了。」


    詹氏說：「你要想想，你的兩個孩子誕生時，都是我幫的忙。」


    素娥辯解道：「我知道，但不是為這個。」


    素娥心中只是不忍她的老母親還要去做那些像傭婦的事，但她不能當面對母親說你年老了，當年是當年，現在是現在。


    兩個母女爭論到都眼溼了才罷手。自從素娥結婚以來，十幾年間，詹氏一直寄居在這個宿舍裡，大小事都為這一隻手殘廢的女兒去做。年輕時在鄉村艱苦生活的歲月影像又浮現到詹氏的心頭來，她必須在夜間替隊排來水，以致割會爬行的素娥無知地向油燈前進，想到那些不堪回首的往事，她的淚水奪眶而出，像兩條白銀珠劃過那兩面蠟黃的臉頰。

    （七等生 老婦人）'
