- id: doc_112_彰化_埤頭_國文_g7s2e1_s3_41
  section: 3
  number: 41
  type: single
  page: 2
  stem: 根據本文，越南咖啡市占率在1994年躍升，其最關鍵的因素應是下列何者？
  options:
  - label: A
    content: 臺商大量投資栽種優良品種的咖啡
  - label: B
    content: 出口貿易順暢加上巴西咖啡大歉收
  - label: C
    content: 越南咖啡品質優於哥倫比亞與印尼
  - label: D
    content: 越南政府聚焦扶植，鼓勵投資種植。
  group_stem: '西方咖啡，東方茶。


    然而，全球咖啡第二大產地和出口國，就在離臺灣不遠的越南。令人訝異的是，越南從全球市占率僅千分之二到世界第二，只花二十年的時間。


    1994年是扭轉越南在全球咖啡版圖最關鍵的一年，美國解除對越南的禁運機制，加上巴西大歉收，越南咖啡順勢以量大價低攻掠市場，逼退哥倫比亞、印尼等傳統咖啡出口國，僅次於巴西，市占率直逼百分之二十。


    越南政府聚焦扶植的結果，使得越南有完整的咖啡產業鏈，吸引許多人前往投資種植。前往越南的臺商原先要種植適合高冷氣候的臺灣茶，但種茶、製茶過程繁複，於是改種品質較好管理的咖啡。此外，選擇種植薑黃、發病率高的阿拉比卡咖啡，不但貼近全球咖啡市場潮流，也與當地大量種植的羅布斯塔咖啡做出市場區隔。接著，再花六年的時間改良土壤，利用微生物菌改良受到水氣流通的固粒化土壤。不同於越南本地咖啡豆一年兩到三次的化學肥料，改為兩週施放一次有機肥，因此，種植出來的咖啡豆每公斤價格是越南本地咖啡豆的三倍多。種植四到五年即可生成的咖啡，就像接地底湧出的黑金。

    （改寫自陳嚀誼 越南地湧黑金—量大價低的致富傳奇）'
