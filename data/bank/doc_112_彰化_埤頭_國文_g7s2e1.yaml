  stem: 端午饌：「屈原於五月初五投汨羅江而死，楚國人紛紛哀悼他。到了這一天，人們用竹筒裝米，扔進水裡來祭奠他。東漢建武年間，長沙有個人叫區曲，大白天忽然看見一個士人，自稱三閣大夫。他對區曲說：『得知你要來此祭奠，很好。但這些年大家送來的東西，全被蛟龍偷去吃了。今天如果有什麼東西要送的話，可以塞些棟樹葉，再用五彩線纏上。這兩樣東西是蛟龍最害怕的！』」關於這段文字，下列敘述何者錯誤？
