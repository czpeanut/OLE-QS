  section: 3
  number: 47
  type: single
  page: 3
  stem: 關於曹丕的生平，下列敘述何者正確？
  options:
  - label: A
    content: 曹丕是正室丁夫人所生的長子
  - label: B
    content: 曹丕擊敗烏丸，不負父親期待
  - label: C
    content: 曹丕為銅雀臺作賦，文思敏捷
  - label: D
    content: 曹丕文武雙全，後來篡漢稱帝。
  group_stem: '曹操有子二十五人，曹丕是曹操第一個妾卞氏所生的。卞氏出身倡女，原是琅邪郡人，後流落於沛國 譙縣，被曹操看中，而飛上枝頭當鳳凰。卞氏生曹丕、曹彰、曹植和曹熊四人。由於曹操的正室丁夫人在曹昂（長子）死後與夫不和睦，回娘家住，曹丕篡漢後，卞氏即是皇太后。曹叡即位後，更尊為太皇太后。


    曹操眾兒中最勇猛的是曹彰，他不負父命擊敗烏丸，令曹操大喜。曹植小曹丕五歲，文思敏捷，曾為銅雀臺賦一篇拔得頭籌，令曹操異常，深得寵愛。但他「不自雕勵，飲酒不節」（三國志），曹操最後改立「御之以術，矯情自飾」（三國志）的曹丕為太子。


    由於曹丕幼年即習武學文，加上隨軍出征經驗豐富，因此在文武兩方面均奠定很好的基礎，這對他後來的稱帝、治國以及文學創作、理論批評等方面的成就與發展，影響甚鉅。

    （節錄自曹丕的生平）'
