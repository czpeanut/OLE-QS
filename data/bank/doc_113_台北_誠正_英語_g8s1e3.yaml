  group_stem: "(二)\n   Santa Claus is busy again, and we are, too! We are Santa’s\
    \ big helpers. We help Santa answer Christmas letters from children all over the\
    \ world at a special post office in Himmelpfort, a town in the north of Germany.\n\
    \   Every year at this time, we start our day by grouping letters from the same\
    \ country or language together. Some letters, with drawings or small gifts, need\
    \ special care. We keep the drawings safe and take a close look at the gifts to\
    \ understand their meaning. In the afternoon, we write back to every child in\
    \ their language and try to make it special. Then, we add Santa’s special postmark\
    \ to give it a touch of magic. Some workers check to make sure each letter is\
    \ okay before we send it. At the end of the workday, we share happy stories from\
    \ the letters together. It makes us feel proud to bring Christmas joy to children.\n\
    \   This tradition started in 1984 when two children from Berlin and Saxony sent\
    \ letters to Santa at Himmelpfort. The name \"Himmelpfort\" means \"heaven's gate,\"\
    \ so the children thought Santa might live there. The workers didn’t want to send\
    \ the letters back, so they decided to answer them.\n   This year, if you want\
    \ to get a letter from Santa, make sure to send your letter before December 15.\
