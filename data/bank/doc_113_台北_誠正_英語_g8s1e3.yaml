  group_stem: '(一)

    There is a job that doesn’t need lots of knowledge or skills. That is the job
    of a line stander. A line stander waits in line with a lot of people. The line
    stander can wait for food, tickets, or a new cell phone. However, that thing isn’t
    for the line stander. The thing is for other people. Those people don’t have time,
    or they just don’t want to wait in line. So, they pay the line stander to do it
    for them. Line standers can make good money, but their job isn’t easy. They may
    have to wait in line for hours. So, they may not be able to use the restroom.
    Also, they may have to deal with other people that aren’t polite to them.'
