- id: doc_113_高雄_苓雅_社會_歷史_g9s2e2_s2_32
  section: 2
  number: 32
  type: single
  page: 2
  stem: 上文中提到「軍事力量衰弱」，最可能造成下列何結果？
  options:
  - label: A
    content: 東南沿海受到倭寇侵擾
  - label: B
    content: 長江流域由外族所控制
  - label: C
    content: 與遼簽盟約以維持和平
  - label: D
    content: 戰敗後割讓燕雲十六州。
  group_stem: '(1)歷史的發展，可以透過不同的觀察角度，得窺不同的歷史面貌，由以下例子可知，從政治軍事角度所認定的強權朝代，與社會經濟富裕未必有絕對的關係。


    唐代一向以軍事力量強大著稱，宋代則剛好相反，因為國家政策影響，使軍事力量衰弱，且當時受到外族政權的阻隔，對外陸路貿易並不發達，但由關稅資料可知，宋代海路貿易的興盛以使其成為世界級海上商業帝國。由《清明上河圖》中亦可以看到首都民間經濟活動蓬勃發展，經濟數據更顯示當時生產力高於唐代。
    元代是重視商貿的政權，所有利權都收歸國營，但政治上稱霸卻在貨幣改革失敗後造成政權的衰亡。明代國勢在明成祖時達到鼎盛，聲威遠播至非洲東岸，但有學者認為「明成祖要權不要錢」，因此不但沒有創造出新的財富，甚至促使原有的財富消耗大半。明代中期以後，雖因內憂外患逐漸衰弱，但靠著瓷器與絲綢的外銷，使得全世界一半以上的白銀不斷自海外流向中國。'
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 歷史
