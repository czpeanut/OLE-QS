  stem: 大學宿舍裡住著來自三個不同國家的同學，有一天他們各自介紹自己國家的歷史，都表露出身為該國人民的光榮。甲說：「 15 世紀末，我國是首先往海外探險的先驅。16
    世紀，我國在海外有殖民地，鼓動了整個歐洲積極往海外探險。」乙說：「我國有位科學家強調科學和哲學都得先靠感官、經驗來認知『個別的事實』，然後才能運用歸納法獲得真理；甚至有位科學家的數學、物理學成就，只要是學生大都知道且要學習其基礎理論。」丙說：「我國有豐富多元的原住民文化，19
    世紀更是淘金移民者的天堂。在各族群胼手胝足的努力下，一起形塑新國家，現今政府對原住民積極進行轉型正義的各種配套措施，例如：修改國歌歌詞、金錢補償。」請問甲、乙、丙三人的國籍依序是
