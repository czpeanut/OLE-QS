  stem: 關於偃師所造倡者，下列敘述何者正確？
  options:
  - label: A
    content: 身體全由無機物構成，未使用有機材料
  - label: B
    content: 偃師在旁操控，故能「瞬其目而招王之左右侍妾」
  - label: C
    content: 是一尊具有自主意識的機器人
  - label: D
    content: 具備人體一切器官，且能拆卸後再組合運作。
  group_stem: "(6)\n    周穆王西巡狩，未及中國，道有獻工人名偃師。越日，偃師謁見王。王薦之曰：「若與偕來者何人邪？」對曰：「臣之所造能倡①者。」穆王驚視之，趣步俯仰，信人也。與盛姬內御並觀之。\n\
    \    技將終，倡者瞬其目而招王之左右侍妾。王大怒，立欲誅偃師。偃師大懾立剖散倡者以示王，皆傅會②革、木、膠、漆、白、黑、丹、青之所為。王諦料之，內則肝、膽、心、肺、脾、腎、腸、胃，外則筋骨、支節、皮毛、齒髮，皆假物也，而無不畢具者。合會復如初見。王試廢其心，則口不能言；廢其肝，則目不能視；廢其腎，則足不能步。穆王始悅而嘆曰：「人之巧乃可與造化者同功乎？」詔貳車③載之以歸。\
    \                       (節選自列子‧湯問)\n\n註：①倡：同「唱」。②傅會：湊合。③貳車：副車。"
