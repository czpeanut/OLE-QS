  group_stem: "(4)\n【甲】\n艾子有孫年十許，慵劣不學，每加榎楚①，而不悛②。其子僅有是兒，恆恐兒之不勝杖而死也，責必涕泣以請。艾子怒曰：「吾為若教子不善邪？」杖之愈峻，其子無如之何。一旦雪作，孫摶雪而嬉，艾子見之，褫其衣使跪雪中，寒戰之色可掬。其子不復敢言，亦脫其衣跪其旁。艾子驚問曰：「汝兒有罪，應受此罰，汝何與焉？」其子泣曰：「汝凍吾兒，吾亦凍汝兒。」艾子笑而釋之。\
