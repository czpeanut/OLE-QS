- id: doc_113_高雄_翠屏_國文_g9s2e2_s2_37
  section: 2
  number: 37
  type: single
  page: 6
  stem: 關於本文的敘述，何者正確？
  options:
  - label: A
    content: 成年人食用過多甜食，易使後代記憶力下降
  - label: B
    content: 正常飲食的人在使用海馬迴的記憶較困難
  - label: C
    content: 世界衛生組織公布每日應攝取25 克以上的糖量
  - label: D
    content: 食用過多甜食可能會造成方向知覺的喪失。
  group_stem: "(3)\n  甜食對許多人來說是不能抗拒的美味，不僅能讓人心情愉悅，小孩更是熱愛甜食――糖果、零食、巧克力的滋味令兒童無法忘懷。但最新研究證實：在孩童時期，吃過多的甜食和含糖飲料，可能會導致成年後記憶力下降。\n\
    \  專家透過老鼠實驗觀察含糖飲料對大腦發育的影響。在兩組老鼠的實驗對照組中，一組添加類似人類所攝取的含糖飲料成分、另一組給予正常的飲食，並以這樣的方式持續餵養，進而觀察這些幼鼠的成長過程，大腦是否有產生變化。\n\
    \  最後將攝取含糖飲料的老鼠及單純喝水的老鼠各自放進迷宮中，結果發現，雖然曾接受相同的訓練，但前者比後者多耗費一倍的時間才走出迷宮。這表示，喝果糖的老鼠記憶力明顯受到損害，與單純只喝水的老鼠相比，喝含糖飲料的老鼠，在使用海馬迴的記憶上有非常大的困難，它表現症狀為記憶力衰退以及方向知覺的喪失。\n\
    \  世界衛生組織曾公布，每日的食用糖量應不超過25 公克，在注重飲食的現代，應該避免食用過多甜食，努力抵抗甜食的誘惑。"
