  stem: '南蕪國中九年五班正進行「鯊魚的知冷識問答」分組答題比賽，第1～6 題目和依序對應的答案，哪一組排列正確？


    | | 1 | 2 | 3 | 4 | 5 | 6 |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | （Ａ） | 乙 | 戊 | 丁 | 丙 | 己 | 甲 |

    | （Ｂ） | 丙 | 丁 | 乙 | 戊 | 甲 | 己 |

    | （Ｃ） | 戊 | 丙 | 己 | 丁 | 乙 | 甲 |

    | （Ｄ） | 甲 | 丁 | 乙 | 戊 | 丙 | 己 |'
  options:
  - label: A
    content: 1:乙, 2:戊, 3:丁, 4:丙, 5:己, 6:甲
  - label: B
    content: 1:丙, 2:丁, 3:乙, 4:戊, 5:甲, 6:己
  - label: C
    content: 1:戊, 2:丙, 3:己, 4:丁, 5:乙, 6:甲
  - label: D
    content: 1:甲, 2:丁, 3:乙, 4:戊, 5:丙, 6:己
  group_stem: '(2)

    以下是「鯊魚的冷知識問答」的題目與答案：

    題目：

    1、鯊魚會睡覺嗎？ 4、鯊魚只會生活在海洋裡嗎？

    2、鯊魚是游泳高手嗎？ 5、鯊魚能有什麼特殊捕獵能力？

    3、鯊魚最多可以活多久？ 6、鯊魚有天敵嗎？


    答案：

    甲：鯊魚雖然是海洋頂尖掠食者，也並非天不怕、地不怕。研究發現，即使是大白鯊，在遇見虎鯨時，也會試圖遠離該區域。然而，對於瀕臨絕種的鯊魚而言，最大的敵大還是非人類莫屬。

    乙：除了敏銳的五感之外，鯊魚擁有特殊的第六感――電感能力。鯊魚頭部有一個特殊的結構，能感受到獵物發出的生物電。所以即使在無法使用五感的汙濁水域中，鯊魚依然能準確地捕捉到獵物。

    丙：鯊魚體表覆蓋著一層微小彎曲的鱗片，能抑制身旁的尾流形成渦流，進而減少阻力，此構造也成為仿生科技的靈感來源。游行速度最快的是「尖吻鯖鯊」，最高衝刺速度可達到每小時100
    公里，有著「海洋獵豹」之稱。

    丁：目前已知有7 種可進入淡水域的真鯊科鯊魚，牠們擁有在淡水中存活的能力，如公牛鯊尾部附近的內臟能儲存鹽分，而恆河露齒鯊可直接生活在淡水域中，包括產卵。

    戊：大多數鯊魚為了呼吸，必須要不斷地游動，從鰓過濾水中的氧氣。但是，鯊魚也會以較不活躍的活動模式，同時維持呼吸與休息。所以若看到鯊魚在水裡慢慢游動，有可能就是牠們正在睡覺喔！

    己：世界上最長壽的脊椎動物，是格陵蘭鯊魚，因生長緩慢，要到156 歲左右才真正成年，因此壽命也極為長久，甚至可以達到400 歲呢！'
