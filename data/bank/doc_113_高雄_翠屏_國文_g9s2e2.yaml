    \n【乙】\n有一天吃晚飯的時候，太太跟我開玩笑，隔著飯桌，用筷子在我頭上敲了一下（我居然沒閃開，被她敲中）。接著就聽見啪一聲，我的兒子胳臂上被奶奶狠狠打了一巴掌。「奶奶！你為什麼打我？」兒子吃驚地問。八十歲的老奶奶一笑：「你媽打我兒子，我就打她兒子。」\n\
