- id: doc_113_高雄_翠屏_國文_g9s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 心理描寫的方法有很多種，大致上可分為直接描寫和間接描寫兩大類。直接描寫包括內心獨白、夢境幻覺描寫等；間接描寫則包括透過描寫表情、動作、語言、景物等傳達人物心理。請問以下選項何者運用了直接描寫中的「內心獨白」？
  options:
  - label: A
    content: 她在市場裡盡可能的討價還價，即使被嘲笑也要守護那可憐的零錢包
  - label: B
    content: 她帶著滿腔不安，遲疑地問：「可以把這個借我嗎？借我這一樣就好。」
  - label: C
    content: 我覺得臉上熱辣辣的，手心裡透出一片冷汗，心頭像有千百個螞蟻爬過
  - label: D
    content: 瑪蒂爾內心非常激動――她該去打招呼嗎？現在，債務已然還清，可以把事情全盤托出了。為什麼不呢？
