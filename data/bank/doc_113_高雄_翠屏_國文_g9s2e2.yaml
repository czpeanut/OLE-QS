  section: 1
  number: 9
  type: single
  page: 2
  stem: 常保好奇心：「一個人為什麼會好奇？因為擁有一顆開放且不自我設限的心靈，開放又源於願意擁抱外在世界的正向人生觀。因為樂於擁抱世界，所以積極探索外界事物，勇於參與未知領域，透過探索與參與，人會得到豐富的經驗、知識」根據上文，作者認為人會「好奇」的因果順序應為下列何者？
  options:
  - label: A
    content: 開放的心靈→積極探索參與未知→得到經驗知識
  - label: B
