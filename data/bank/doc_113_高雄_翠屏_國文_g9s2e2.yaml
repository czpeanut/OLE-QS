    content: 瑪蒂爾一直悶悶不樂，她覺得自己是為打扮而生的，生來就該享受所有精緻和奢侈的事物
  - label: B
    content: 瑪蒂爾在一只黑緞盒子裡發現一條極美的鑽石項鍊，一股無法扼抑的欲望撲撲跳動
  - label: C
    content: 瑪蒂爾使勁抑下傷痛，擦拭濡溼的臉頰，一面平靜以對：「我沒事，只不過我沒有像樣的衣服可以穿。你若有同事的太太比我穿的體面些，就把邀請卡給她。」
  - label: D
    content: 偶爾，丈夫不在時，她會在窗戶旁坐著，想起從前的那次晚會。
