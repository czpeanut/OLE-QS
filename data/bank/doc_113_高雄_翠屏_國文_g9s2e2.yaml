  group_stem: "(5)\n  儉，美德也，而流俗顧薄①之。\n    貧者見富者而羨之，富者見尤富者而羨之。一飯十金，一衣百金，一室千金，奈何不至貧且匱也？每見閭閻②之中，其父兄古樸質實，足以自給，而其子弟羞向者之為鄙陋，盡舉其規模而變之，於是累世之藏，盡廢於一人之手。況乎用之奢者，取之不得不貪，算及錙銖，欲深谿壑；其究③也，諂求詐騙④，寡廉鮮恥，無所不至；則何若量入為出，享恆足之利乎？\n\
    \    且吾所謂儉者，豈必一切捐⑤之？養生送死之具，吉凶慶弔之需，人道之所不能廢，稱情⑥以施焉，庶乎其不至於固耳。                   \
    \                    (儉訓 李文炤)\n\n註：①「薄」之：輕視。 ②閭閻：音ㄌㄩˊ ㄧㄢˊ，鄉里。 ③其「究」也：最後。 ④諂求詐騙：諂媚貪求，欺詐騙取。\
    \ ⑤「捐」之：捨棄。 ⑥「稱」情：音ㄔㄥˋ，酌量。"
