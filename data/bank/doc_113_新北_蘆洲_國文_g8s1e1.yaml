  section: 1
  number: 39
  type: single
  page: 4
  stem: 根據本文內容，下列關於梅雨說明，何者完全正確？
  options:
  - label: A
    content: 梅雨覆蓋區大，鋒面覆蓋的地區時雨時晴
  - label: B
    content: 梅雨變動性大，有時大雨滂沱，有時陰雨綿綿
  - label: C
    content: 梅雨差異性大，總雨量主要落在五百到一千公釐間
  - label: D
    content: 梅雨變化性大，台灣每年的梅雨季不同，但以冬季為主。
  group_stem: "題組：丙\n   「黃梅時候家家雨，青草池塘處處蛙。有約不來過夜半，閒敲棋子落燈花。」這首宋代 趙師秀的〈約客〉詩中，第一句描述出梅雨的降雨是家家雨，也就是鋒面帶覆蓋的地方都是雨。另外江南諺語「雨打黃梅頭，四十五日無日頭」又說出梅雨陰雨連綿的特性，「梅子成熟傾盆雨」則是表示梅雨雨勢相當大。從這些記述可以知道，梅雨的降雨特性是持續性並挾有較大雨勢的天氣。\n\
    \    不過也有些記述，例如：「梅子黃時日日晴，黃梅時節燥鬆鬆」卻是說梅雨時出現的晴朗天氣；「吃了端午粽，還有三天凍」的「冷水黃梅」則表示梅雨來得特別早，另有「陣頭黃梅」及「小暑一聲雷，黃梅倒轉來」，表示梅雨來得特別遲，以及梅雨過後又再度出現持續降雨天氣，這又說明梅雨降雨的變動性。\n\
    \    這種變動性，不論是梅雨開始時間的早遲、梅雨期的長短，雨量的多寡、下雨天數的多少等，每年都有很大的差異。不但長江梅雨如此，變動性更大的台灣梅雨更是變化多端：梅雨期有時長達五十天以上，卻也短到十天以下；雨量有超過一千公釐，也有少於一百公釐；下雨天數有時比不下雨的天數還要少，南部曾有連續十三天晴朗天氣，但也會連續降雨不止，譬如北部在民國三十六年那年，就連續下了二十二天的雨。由於台灣的梅雨變動性高，每年都不同，很難訂出梅雨開始與結束的定義，所以只能約略將五、六月訂為台灣的梅雨期。\
    \                               (任立渝 梅雨! 霉雨！)"
