- id: doc_113_新北_蘆洲_國文_g8s1e1_s1_37
  section: 1
  number: 37
  type: single
  page: 4
  stem: 小豪看見天空出現流星，之後經由新聞得知這顆流星墜落後的殘留被尋獲，請問它應屬於下列何者？
  options:
  - label: A
    content: 流星體
  - label: B
    content: 鐵隕石
  - label: C
    content: 墬落隕石
  - label: D
    content: 發現隕石。
  group_stem: "題組：乙\n    隕石起源於外太空撞擊到地球表面後殘存的天然物體。當它還在太空時稱為流星體，當進入大氣層時，撞擊壓力使這個物體被加熱和放射出光線，於是成為火球，也就是所謂的流星。更通俗的說，隕石是來自太空中任何地方，落在表面上的自然天體①。有些被發現的隕石來自月球和火星。\n\
    \    隕石因為撞擊或經過大氣層時，發光成為流星而被觀測到並被尋獲的稱為墬②落隕石，所有其他的隕石都為發現隕石。截至二〇○六年中期，全世界收藏的墬落隕石標本大約有一千零五十顆;相對的，被認定的發現隕石則有三萬一千顆。\n\
    \    隕石在傳統上被分為三大類:石隕石是岩石，主要的成分是矽酸鹽礦物;鐵隕石有很大部分的成分是鐵、鎳；石鐵隕石則包含大量的金屬及岩石的成分。現代的分類法則依據隕石的結構、化學和同位素的組成和礦物來分組。\n\
    【注釋】\n①天體:天文物體的總稱。泛指天空星體,包括恒星、行星、星雲、彗星、宇宙塵等。②墬:音ㄉ一ˋ ,同「地」。\n                 \
    \                                                                     (改寫自維基百科)"
