  group_stem: "題組：甲\n    吳起者，衛人也，好用兵。嘗學於曾子，事魯君。齊人攻魯，魯欲將①吳起，吳起娶齊女為妻，而魯疑之。吳起於是欲就名，遂殺其妻，以明不與②齊也。魯卒以為將，將而攻齊，大破之。\n\
    　　起之為將，與士卒最下者同衣食。臥不設席，行不騎乘，親裹贏糧③，與士卒分勞苦。卒有病疽④者，起為吮之。卒母聞而哭之。人曰：「子卒也，而將軍自吮其疽，何哭為？」母曰：「非然也。往年吳公吮其父，其父戰不旋踵⑤，遂死於敵。吳公今又吮其子，妾不知其死所矣。是以哭之。」\
    \                                (司馬遷《史記》吳起好用兵)\n【注釋】\n①將：以……為將軍。②與：接近、親近。③贏糧：擔負糧食，引申指攜帶糧食。④疽：音\
    \ ㄐㄩ，一種毒瘡。\n⑤不旋踵：腳跟不向後轉，此指不退卻，奮勇殺敵。"
