- id: doc_113_高雄_英明_社會_公民_g9s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: '小宇最近獲得了五個不同薪資的工作機會，分別是甲、乙、丙、丁、戊。如果他僅以薪資作為選擇工作的依據，且他在選擇甲與乙時，會選擇乙工作，且機會成本為42,000
    元；他另將甲與丙、甲與丁及丁與戊工作進行比較，結果如附表所示：根據表中的資訊判斷，甲、丙、丁、戊四項工作的薪資高低順序應為何？

    | 選擇比較的工作 | 最佳選擇的機會成本 |

    | --- | --- |

    | 甲、丙 | 42,000 元 |

    | 甲、丁 | 39,000 元 |

    | 丁、戊 | 36,000 元 |'
  options:
  - label: A
    content: 丙>甲>丁>戊
  - label: B
    content: 丁>戊>甲>丙
  - label: C
    content: 丙>甲>戊>丁
  - label: D
    content: 甲>丙>戊>丁。
- id: doc_113_高雄_英明_社會_公民_g9s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 阿魁開了一家親子遊樂中心，提供多種設施供遊客使用。遊樂中心內有投籃機5 台、夾娃娃機3 台、電子遊樂器6 台，還有一台5 人座的旋轉木馬。某天，小橙一家四口來到這裡玩耍，發現場內沒有其他遊客。儘管如此，哪項設施可能會面臨「稀少性」問題？
  options:
  - label: A
    content: 投籃機
  - label: B
    content: 旋轉木馬
  - label: C
    content: 夾娃娃機
  - label: D
    content: 電子遊樂器。
- id: doc_113_高雄_英明_社會_公民_g9s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 九二一地震後，豐原客運的「豐原—梨山」路線改道繼續運行，儘管班次少、成本高，政府仍提供補助以維持服務。政府補助的主要考量是什麼？
  options:
  - label: A
    content: 以公平作為原則，提供偏遠地區居民必要的交通服務
  - label: B
    content: 以非金錢誘因來促進偏遠地區企業的持續經營和創新
  - label: C
    content: 透過補貼來確保企業的營運獲利，推動區域經濟發展
  - label: D
    content: 以交通誘因吸引旅遊業發展，提升偏鄉旅客的參與度。
- id: doc_113_高雄_英明_社會_公民_g9s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 在疫情期間，台灣政府優先將疫苗分配給高風險族群，如醫護人員和長者，而非按先到先得的方式來分配。這種疫苗分配方式體現了哪一種資源分配原則？
  options:
  - label: A
    content: 根據公平原則分配
  - label: B
    content: 根據市場需求分配
  - label: C
    content: 根據職業貢獻分配
  - label: D
    content: 根據效率優先分配。
