- id: doc_113_高雄_英明_社會_公民_g9s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 某市政府的公車誤點罰款法規要求司機必須準時到達站點，業者將罰款轉嫁給司機，這導致司機為了避免罰款而過度加速，忽視交通安全。上述導致司機有此不當駕駛的誘因屬於以下哪一種？
  options:
  - label: A
    content: 負向金錢誘因
  - label: B
    content: 正向金錢誘因
  - label: C
    content: 正向非金錢誘因
  - label: D
    content: 負向非金錢誘因。
  group_stem: 某市政府實施公車誤點罰款規定，要求公車業者在規定時間內須到達站點，否則將給予罰款。業者將罰款轉嫁給司機，導致司機為避免罰款而冒險駕駛，忽視安全。此外，長時間工作和缺乏休息也影響了司機的情緒和服務態度。雖然法規旨在提高準點率，但實施後反而降低了交通安全和服務品質。
- id: doc_113_高雄_英明_社會_公民_g9s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 假設市政府打算改進上述困境，避免過大壓力影響司機行為，以下哪一項措施最有效？
  options:
  - label: A
    content: 提高罰款金額，但減少司機獎金，以促使穩定駕駛
  - label: B
    content: 降低罰款金額，並根據司機安全駕駛表現發放獎金
  - label: C
    content: 要求下班後，司機須參加交通安全課程達一定時數
  - label: D
    content: 延長行程時間，並依乘客滿意度評定司機表現獎勵。
  group_stem: 某市政府實施公車誤點罰款規定，要求公車業者在規定時間內須到達站點，否則將給予罰款。業者將罰款轉嫁給司機，導致司機為避免罰款而冒險駕駛，忽視安全。此外，長時間工作和缺乏休息也影響了司機的情緒和服務態度。雖然法規旨在提高準點率，但實施後反而降低了交通安全和服務品質。
- id: doc_113_高雄_英明_社會_公民_g9s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 環保咖啡廳「綠意森活館」推出了一系列措施，鼓勵顧客支持綠色消費。常客小葳正在思考以下措施，哪一項最符合「非金錢誘因」的概念？
  options:
  - label: A
    content: 攜帶自備購物袋的顧客，每次消費均可享九折優惠折扣
  - label: B
    content: 使用自備環保杯的顧客，下一次消費均可折抵現金十元
  - label: C
    content: 自備環保餐具到店用餐，顧客可累積積分參與店內活動
  - label: D
    content: 推薦親友來店消費的顧客，雙方均可享有八折優惠折扣。
- id: doc_113_高雄_英明_社會_公民_g9s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 學校的園遊會即將舉行，心怡的班級正在討論販賣哪種食物最能吸引顧客並賺取更多收益。這個討論涉及到哪一種生產課題的考量？
  options:
  - label: A
    content: 生產什麼
  - label: B
    content: 如何生產
  - label: C
    content: 為誰生產
  - label: D
    content: 何時生產。
- id: doc_113_高雄_英明_社會_公民_g9s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 台灣的水資源有限，為了應對乾旱，政府決定實行分區限水措施，並對用水量大的工業進行額外的限制，確保家庭和公共設施的用水需求。這反映了哪一種資源分配的方式？
  options:
  - label: A
    content: 市場價格機制
  - label: B
    content: 政府計畫分配
  - label: C
    content: 自由競爭分配
  - label: D
    content: 隨機抽籤分配。
- id: doc_113_高雄_英明_社會_公民_g9s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 依據上文，哪一項原因最有可能導致遠端工作者選擇暫時離開勞動市場？
  options:
  - label: A
    content: 家庭收入無法負擔日常生活需求，需尋找額外經濟來源
  - label: B
    content: 面對不斷增加的工作量，員工無法平衡專業和家庭責任
  - label: C
    content: 缺少專業技能提升的機會，導致遠端工作成效不如預期
  - label: D
    content: 家中負擔過重的看護工作，使員工無法兼顧工作和照護。
  group_stem: 疫情期間，許多企業開始推行遠端工作，這一方式雖然靈活，但也引發了新挑戰。許多員工因需照顧家中成員，難以全心投入工作，甚至有些人選擇暫時退出勞動市場。專家指出，這些勞動者需要政府和企業的額外支持，才能平衡家庭與工作。
- id: doc_113_高雄_英明_社會_公民_g9s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 政府可以採取下列哪項措施來幫助家庭有照護責任的勞動者重返工作崗位？
  options:
  - label: A
    content: 加大補貼力度，為遠端工作者提供更豐厚的工資回饋
  - label: B
    content: 鼓勵企業提供免費培訓課程，提升勞動者的工作技能
  - label: C
    content: 強制縮短遠端工作的時間，讓家庭責任更容易被兼顧
  - label: D
    content: 建立完善的照護支持體系，減輕家庭照護負擔與壓力。
  group_stem: 疫情期間，許多企業開始推行遠端工作，這一方式雖然靈活，但也引發了新挑戰。許多員工因需照顧家中成員，難以全心投入工作，甚至有些人選擇暫時退出勞動市場。專家指出，這些勞動者需要政府和企業的額外支持，才能平衡家庭與工作。
- id: doc_113_高雄_英明_社會_公民_g9s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 企業應採取什麼策略來提升遠端工作者的工作效率，並減少他們退出勞動市場的風險？
  options:
  - label: A
    content: 召開更多會議，確保遠端員工與公司內部的聯繫更加緊密
  - label: B
    content: 強制推行更多加班，確保在遠端工作中增加員工工作時數
  - label: C
    content: 增加員工的工作彈性，讓員工更靈活調整工作與生活時間
  - label: D
    content: 減少員工的休假天數，讓員工有更多的時間來專注於工作。
  group_stem: 疫情期間，許多企業開始推行遠端工作，這一方式雖然靈活，但也引發了新挑戰。許多員工因需照顧家中成員，難以全心投入工作，甚至有些人選擇暫時退出勞動市場。專家指出，這些勞動者需要政府和企業的額外支持，才能平衡家庭與工作。
- id: doc_113_高雄_英明_社會_公民_g9s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 新聞報導，高麗菜豐收時，部分菜農開放民眾自行付費採摘，而不是自行僱人採收銷售。從經濟學角度來看，下列敘述何者正確？
  options:
  - label: A
    content: 對民眾而言，這是屬於增加個人利益的非金錢誘因
  - label: B
    content: 開放民眾自行採摘是為了獲得更多收益，提高利潤
  - label: C
    content: 高麗菜價格波動頻繁，讓民眾採摘可減少銷售風險
  - label: D
    content: 高麗菜豐收導致價格下跌，僱人採收無法彌補成本。
- id: doc_113_高雄_英明_社會_公民_g9s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 由於成本上升，小誠考慮將「酥脆霸王雞」的價格調高。他的主要目的是為了什麼？
  options:
  - label: A
    content: 降低生產成本
  - label: B
    content: 增加銷售數量
  - label: C
    content: 維持整體利潤
  - label: D
    content: 提升產品品質。
  group_stem: 小誠經營的「好吃炸物店」最近面臨成本上升的挑戰。店內的食材成本增加，人工工資和設備維護費用也有所提升。小誠希望調整策略來確保利潤最大化。此外，小誠特別重視顧客的滿意度，他經常說：「看到顧客開心吃完我的食物，我就覺得非常滿足。」
