  stem: 布魯先生打算開設一家手工咖啡店，並列出了所需的生產資源成本比例。這些資源包括租賃店面、雇用員工以及購買咖啡機和設備。請問：如果布魯先生向銀行貸款購買咖啡設備，所需支付的生產成本屬於哪一項？
