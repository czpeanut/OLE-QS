  section: 1
  number: 13
  type: single
  page: 2
  stem: 當媒體報導雞蛋發生短缺的情況，消費者認為蛋價未來會上漲，因此搶購雞蛋。這種情況反映了消費者選擇受到什麼因素的影響？
  options:
  - label: A
    content: 產品價格
  - label: B
