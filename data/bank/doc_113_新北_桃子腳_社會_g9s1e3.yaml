  group_stem: '【題組三】請依序完成題目第31 題至33 題

    資料一：被稱為「航海者」的葡萄牙王子亨利(Infante D. Henrique)他所派遣的船隊，從大西洋沿著非洲海岸一路探險，非洲海岸一一成了該國的殖民地。黃金、象牙、香料也跟著而來，今日非洲國家迦納的沿岸被稱為「黃金海岸」，也是因地理大發現時，每年在此地運出黃金410
    公斤而得名。在亨利王子去世時，他的水手們已發現大約2400 公里的非洲海岸線，並將其中繪製成地圖，在地理大發現時代葡萄牙的地圖就是當時全球最精準的地圖，是各國政治間諜搶著要的情資。

    出處；吳宜蓉，《這樣的歷史我可以》，P53-56

    資料二：『大航海時代Online』是以16 世紀歐洲「大航海時代」為舞台的線上模擬海洋冒險遊戲。玩家在遊戲中是在大航海時代生活的人們，駕船展開世界之旅，在世界中的海洋中航行賺取金錢。遊戲人物瓦斯柯．達﹒伽瑪以遙遠東方的印度為目標，帶領水手前往未知的海洋展開了旅程…

    出處；https://gvo.wasabii.com.tw/novice/game.shtml'
