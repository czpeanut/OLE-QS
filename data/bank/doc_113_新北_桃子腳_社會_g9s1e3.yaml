  stem: 被讚譽其為「印度穆斯林藝術的瑰寶奇葩」的泰姬瑪哈陵，相傳是蒙兀兒皇帝沙加罕為紀念已故皇后而建。蒙兀兒帝國自16 世紀建立後，其統治者的宗教信仰皆相同，並且以溫和的方式與國內的其他宗教共存。後來受到歐洲強權的勢力進逼後，蒙兀兒帝國逐漸失去對印度的控制權，西元1858
    年，帝國最後一任皇帝巴哈杜爾沙被歐洲強權流放。從此印度成為歐洲強權的殖民地，歐洲強權從印度得到相當大的利益，包括將印度培植的農產品銷售到各地等。上述蒙兀兒帝國統治者的宗教信仰為下列何者？
  options:
  - label: A
    content: 佛教
  - label: B
    content: 基督教
  - label: C
    content: 婆羅門教
  - label: D
    content: 伊斯蘭教。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 歷史
      code: 3-3
      title: 伊斯蘭教的興起與擴張
