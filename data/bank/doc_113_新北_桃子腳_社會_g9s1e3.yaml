  page: 4
  stem: 文中提到，他的學說當時人們以「革命」形容他的影響力，挑戰教會，請問他是下列何者？
  options:
  - label: A
    content: 歐文
  - label: B
    content: 伽利略
  - label: C
    content: 克卜勒
  - label: D
    content: 哥白尼
  group_stem: "【題組四】請依題目回答第34 題~第35 題\n    桃子腳九年級「喜閱一百」中，有一本共讀書《追蹤□□□》，作者是哈佛教授歐文。這是一本關於另一本書的故事，西元1543\
    \ 年問世，作者提出日心說，為歐洲學術界投下一顆震撼彈，書中論點和《聖經》以及一般人的認知不符，當時人們以「革命」形容此顛覆傳統思想的影響力，挑戰中世紀時期教會及以往學者的地心說認知。歐文在愛丁堡看到初版《天體運行論》寫滿批註，引發他想親身經歷見證最早版本四百多年輾轉流傳的歷史。\n\
    \   歐洲在某時期，一位義大利天文學家也受到啟發，從荷蘭眼鏡製造商獲得製作望遠鏡的靈感，將一根長管子的兩端各裝入一枚鏡片，舉向天空，他觀察到月球表面、太陽黑子等，並提出證明地球繞太陽而轉的理論，讓人們建立科學的宇宙觀—探究自然、提倡理性等信念，因不再堅信基督教的宇宙觀被稱為「現代科學之父」。他認為只有日心說才能導出最要緊的東西：「宇宙的結構與各個組成的真實對稱」成近代天文學的奠基者。\n\
    出處：改寫自金格瑞契，《追蹤□□□》。"
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 歷史
      code: 5-2
      title: 科學革命
      chapter: 第5章 近代歐洲的變革
    textbook: 九上歷史 5-2 科學革命
    labeled_by: ai
