- id: doc_113_新北_桃子腳_社會_g9s1e3_s2_48
  section: 2
  number: 48
  type: single
  page: 5
  stem: 根據上文達明格的研究中關於家務分配的情形，下列敘述何者正確？
  options:
  - label: A
    content: 家務勞動是自願性勞動，與市場勞動無關
  - label: B
    content: 因情緒勞動產生精神壓力應自行承擔後果
  - label: C
    content: 隱形的家務事兼具私人與公共事務的性質
  - label: D
    content: 男性性格不拘小節，不適合負責家務規劃
  group_stem: "【題組六】請閱讀下文，回答48-50 題\n家務分配與性別平等：「思慮萬千」讓媽媽們心力交瘁\n    隱形的家務事分為三類。一類是認知層面的家務，即天天要費心考慮所有日常生活的方方面面，比如安排孩子與同伴玩耍、購物和計劃家庭活動等。然後是情緒層面的家務，即維持家庭情緒和睦安康的付出，比如孩子不聽話或者為自己在學校表現差勁而感到焦慮時，如何予以安撫平息。第三類事為前兩類家務操心而形成的腦力精神負荷，即為了使全家人生活過下去，需要籌辦、安排和計劃涉及情感和實務的一切家事。這種隱形的家務很難度量，因為看不見，藏在可見家務之中。哈佛大學社會學和社會政策博士研究生艾莉森・達明格發現，儘管大多數接受研究的參與者知道是女方承擔了大部分家務，但並不認可家務勞動是一種「正規的工作」。她發現，男性提到妻子時使用了「計劃管理者」等詞語，或說妻子「照顧家務較多」。\n\
    \    與家務相關的腦力工作有四個明顯階段：第一，預計家事所需要做的工作；第二，列出各種選項；第三，在選項中作出最終選擇；第四，對最終決定結果進行監測。達明格的研究顯示，母親在所有四個階段的付出都比父親多;\
    \ 雖然決定常由父母一起制定，但母親在預期、計劃和研究方面做得更多。換句話說，需要做決定時，才會告訴父親，而母親為此決定要思前想後忙前忙後好多時間。\n \
    \   這種隱性的家務會產生多種影響。例如，我們知道，即使孩子不在身邊，母親也會操心孩子。操心家務會產生額外的精神壓力，因為即使當你應該專注於其他事情的時候，這種壓力仍然存在。\n\
    ——梅麗莎・霍根博姆，《BBC NEWS 中文》"
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 公民
      code: 1-1
      title: 選擇與機會成本
      chapter: 第1章 選擇與消費
