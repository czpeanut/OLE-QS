  stem: 兩頭班制度在餐飲業很常見。用餐高峰是中午和晚上，在其他時間用餐人數就會大幅減少。為了應對這種情況產生兩頭班制度，將員工的一天工作時間拆分為兩個時段，例如上午10
    點到下午2 點和下午5 點到晚上9 點，而中間則有一段休息時間。雖然這種排班方式在法律上並不違法，但卻讓員工感覺整天都被束縛在工作上，無法兼顧生活與工作平衡。網友坦言，「很討厭兩頭班」，等於下午休息的時間哪都去不了，回到家沒多久又要去上班的感覺。下列關於市場勞動的敘述何者正確？
  options:
  - label: A
    content: 勞動基準法保障勞工權益，但仍然有修法改善的必要
  - label: B
    content: 原本契約約定一段班，老闆臨時改為兩頭班只需支付加班費即可
  - label: C
    content: 兩頭班並不違法，雇主應該大力推動兩頭班以節省成本有利企業成長
  - label: D
    content: 為了重現經濟起飛的輝煌年代，勞動基準法應該放寬最低工時的規定
