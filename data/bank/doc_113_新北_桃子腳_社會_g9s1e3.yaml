    content: 己。
  group_stem: '【題組一】請閱讀下文，回答第26題至28題：

    你可以把澳大利亞的葡萄酒產業想像成一個賣酒的商店，這家商店一直在海外擁有忠實客戶。起初這些客戶來自英美，幾年前，一位新顧客走進來，看上了這些葡萄酒。不久之後，他不僅比其他顧客的購買量多出一倍，還開始購買高級產品。這個顧客就是中國。過去幾年裏，中國購買了澳大利亞近40%的出口葡萄酒。

    2019年，中國從澳大利亞購買的瓶裝葡萄酒比從法國購買的還多。經過數年的市場開拓，雙方達成貿易協議，兩國在葡萄酒產品上的親密關係迅速發展。但這一通道現在被堵塞了。在兩國政治關係急速惡化的情況下，中國發動貿易打擊，對澳大利亞瓶裝葡萄酒加徵收最高超過200%的關稅。這迅猛的一擊再次暴露了澳大利亞經濟對北京的依賴。

    資料來源：BBC新聞網(2020/12/7)'
