- id: doc_113_高雄_光華_社會_g7s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: (   )根據上文所述，小女孩的遭遇屬於下列哪一方面的不公平現象？
  options:
  - label: A
    content: 貧富差距
  - label: B
    content: 性別不平等
  - label: C
    content: 族群歧視
  - label: D
    content: 城鄉差距。
  group_stem: '這是某國的聖誕夜，家家戶戶開心團圓、吃著耶誕大餐。有一個小女孩獨自在寒冷的夜晚，一邊發抖、一邊叫賣火柴。

    小女孩的父親發生意外受傷，沒辦法工作，只能待在又窮又破的家中，小女孩必須把火柴賣完，才有錢買食物養活全家。

    小女孩在街上站了好久，又冷又餓，但是路過的人卻都不願意買火柴，甚至沒有人停下來看她一眼，每個人都匆忙趕回家

    準備和家人團圓。

    小女孩實在冷到受不了，她決定點火柴取暖。

    當她點燃第一根火柴時，在火光中看見一棟溫馨的房子，全家人安心的住在一起；

    點起第二根火柴，她看見雞肉、麵包、玉米濃湯，全都是平常不可能吃到的美味大餐；

    點燃第三根火柴，小女孩看見去世的媽媽和爺爺奶奶，然而，一下子他們都消失在火光裡。

    於是，小女孩把剩下的火柴全部點燃，見到已經去世的家人都在對她微笑，媽媽伸出溫暖的雙臂，小女孩興奮的跑過去，

    投入媽媽的懷抱。                                  摘錄自丹麥童話作家安徒生《賣火柴的小女孩》'
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 公民
      code: 5-1
      title: 社會地位與不公平處境
      chapter: 第5章 公平正義
    textbook: 七下公民 5-1 社會地位與不公平處境
    labeled_by: ai
