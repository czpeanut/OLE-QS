  type: single
  page: 1
  stem: (   )為提供弱勢學生多元學習機會，教育部國教署自1994 年起推動「教育優先區計畫」，補助學校推展親職教育活動、發展教育特色、充實基本教學設備等項目。111
    學年核定各地方政府教育優先區計畫經費約3 億元，支持並提升偏鄉學校辦學，鼓勵弱勢學生踴躍參與各項特色教育活動，開拓學生視野。關於「教育優先區計畫」的敘述，下列何者正確？
  options:
  - label: A
    content: 是透過個人影響力的投入來彌補教育資源的不均
  - label: B
    content: 教育優先區計畫的目的是在幫助縮短城鄉差距
  - label: C
    content: 政府是從改善族群待遇的不公平現象著手
  - label: D
    content: 此項計畫的行動，無法達到幫助弱勢群體的目標。
