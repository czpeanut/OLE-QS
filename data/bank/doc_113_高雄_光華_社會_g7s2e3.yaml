- id: doc_113_高雄_光華_社會_g7s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: (   )「根據台灣環保署統計，我國每人平均每年會生產150 公斤的廚餘，但在這些浪費背後，仍有60 萬個邊緣家庭因為經濟關係而無法溫飽。為解決剩食浪費的現象，有民間業者開發『惜食軟體』並與商家合作，把剩食領取服務的據點展示在地圖上，有需要的民眾只要搜尋自己所在的區域，就可以查詢到附近能領取食物的地方。希望未來能有更多的業者願意加入惜食行列，盼透過『良』食循環，讓每份食物都不會被輕易浪費。」關於本則報導的敘述，下列何者與文章主旨最相符？
  options:
  - label: A
    content: 可以減少因為資源分配不均造成的社會不平等現象
  - label: B
    content: 已婚婦女在工作上可像男性一樣取得平等升遷的機會
  - label: C
    content: 以社會的整體利益為重，限制個人的基本權利
  - label: D
    content: 為保障視障生的權益，會考時可延長視障考生的作答時間。
