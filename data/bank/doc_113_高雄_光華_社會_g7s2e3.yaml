  stem: (   )根據我國建築法規，「廁所同時使用」類型的建築，男女廁比例不得低於一比五；「廁所分散使用」類型的建築，男女廁比例為一比三。由此可知，公平正義是讓「弱勢群體」得到更多照顧。請問何者最符合上述精神？
  options:
  - label: A
    content: 每位考生在同一個科目的作答時間一致
  - label: B
    content: 立法委員的選舉對原住民設置保障席次
  - label: C
    content: 凡具有我國國籍者就有普發六千元資格
  - label: D
    content: 不論貧或富皆享有高中職免學費的福利。
