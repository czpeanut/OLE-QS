- id: doc_113_高雄_光華_社會_g7s2e3_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: (   )根據上面資料敘述與圖示說明，請問下列何者正確？
  options:
  - label: A
    content: 健保負債降低後，再也無須擔心健保收支失衡的問題
  - label: B
    content: 民間團體整合社福資源，負責執行社會福利措施
  - label: C
    content: 政府的財政負擔加重，更應有效運用且嚴格控管開支
  - label: D
    content: 個人有繳納保費，應盡量使用健保資源，避免浪費。
  group_stem: '「全民健康保險」是台灣行之有年、引以為傲的醫療體制，但近年來健保收支不平衡的問題浮出檯面(如下圖所示)，在政

    府不得不調升健保費率後才有些許改善，但仍脫離不了健保負債的狀況。

    行政院會通過疫後特別預算案，其中撥款補助新台幣200 億元挹注健保作為安全準備金，另外健保署說明部分負擔新制調

    整目的，並非為了彌補健保財務缺口，其用意是透過小幅度調整部分負擔，引導民眾轉診就醫習慣，讓輕症或慢性病人至

    基層院所就醫，大型醫院則回歸照顧急重患者的角色。健保署也提到，為了避免影響弱勢族群就醫權益，除法定重大傷

    病、分娩及山地離島就醫，其他機關補助弱勢群體，如低收入戶等，維持免部分負擔外，中低收入戶及身心障礙者，在藥

    品部分負擔調整都不調升。                               資料來源:衛生福利部'
  shared_asset: g1_8_9
  tags:
