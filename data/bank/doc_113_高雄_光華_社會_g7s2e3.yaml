- id: doc_113_高雄_光華_社會_g7s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: (   )｢躺平主義」是中國近年的網路用語，指當代年輕人即使努力奮鬥，卻依然處於低工資、低福利的狀況並難以改善，讓年輕人對生活與工作感到疲倦，認為與其努力，不如採取不買房、不買車、不結婚、不生下一代、不消費的方式，以維持最低的生存標準。從上文可看到下列何者的不公平現象？
  options:
  - label: A
    content: 身心障礙者的生存權益受到現實職場潛規則阻礙
  - label: B
    content: 女性工作者在職場上遭遇玻璃天花板的限制
  - label: C
    content: 國際移工族群受到不公平待遇
  - label: D
    content: 資源分配不均，貧富差距擴大，不利於職場新鮮人競爭。
