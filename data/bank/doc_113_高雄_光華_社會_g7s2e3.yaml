  section: 1
  number: 10
  type: single
  page: 2
  stem: (   )我國全民健康保險是世界稱羨的制度，民眾就醫便利，看病的經濟負擔也不大。《憲法增修條文》明文要求政府應實施全民健保，以增進民族健康及謀求社會福利；基於國家整體的公共利益考量、社會互助與危險分攤，強制人民納保及繳費是必要的手段。根據上述，以下何者最可能是政府強制全體國民參加全民健保的理由？
  options:
  - label: A
    content: 提供全民健保彌補社會津貼的不足
  - label: B
    content: 透過強制納保可以分散民眾生活上的風險
  - label: C
    content: 提供弱勢族群基本的生活水準
  - label: D
    content: 強制納保能夠增加政府的財政收入。
