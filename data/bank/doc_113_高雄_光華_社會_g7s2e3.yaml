- id: doc_113_高雄_光華_社會_g7s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: (   )為解決缺工問題，勞動部曾於近年調整聘僱移工資格，放寬製造業、營造業、農業及機構看護工等四大產業移工，且其均適用《勞動基準法》規定。另外新增製造業雇主於國內承接額外5%名額的彈性機制，可提高外籍移工在國內轉換工作的機會。但台灣國際勞工協會對此表示，若只談鬆綁卻沒提及外籍移工實質上保障，移工權益問題仍然存在。希望政府能對症下藥，保護移工的權利。關於上文敘述，請問下列何者正確？
  options:
  - label: A
    content: 政府提出的政策一定能解決現實的問題
  - label: B
    content: 台灣國際勞工協會是透過團體力量影響及監督政府施政
  - label: C
    content: 移工的工作權益提升會壓縮到本國勞工權益
  - label: D
    content: 保障移工的權益無法達成社會的公平正義。
