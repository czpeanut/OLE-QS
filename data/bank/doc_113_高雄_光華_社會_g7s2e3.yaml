  stem: (   )承上題，請根據右圖(一)的資訊，並對應到下列各個區域的敘述，何者完全正確？
  options:
  - label: A
    content: 甲： 本區有大甲溪流貫其中，因位於台灣西部交通網絡的中樞，南北往來便利。工業部分，近年來由勞力密集的產業轉型成為精密機械的重鎮。
  - label: B
    content: 乙： 本區是台灣的政治、經濟重心，藉由便捷網絡連串臺北市、新北市、宜蘭縣、桃園市，現已形成一個生活圈。
  - label: C
    content: 丙：此區海岸主要為沙岸，故沿岸遍布著許多蚵田、魚塭。安平港為此區第一大港，因海運便利，成為台灣的重工業帶。
  - label: D
    content: 丁： 此區地形主要為山脈、丘陵，由於受到雪山山脈的阻隔，比起其他地區，直到清朝吳沙才來到此處發展，因此保存了良好的環境供台灣人民觀光和休憩。
