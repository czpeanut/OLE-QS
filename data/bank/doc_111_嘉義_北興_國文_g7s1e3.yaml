- id: doc_111_嘉義_北興_國文_g7s1e3_s5_6
  section: 5
  number: 6
  type: single
  page: 1
  stem: 「那是許多年前的事了，笛聲低沉而遙遠，然而我卻仍能依稀聽見，在雨中。……」根據這段文字，下列敘述何者不正確？
  options:
  - label: A
    content: 低沉而遙遠的笛聲如同遠逝的童年
  - label: B
    content: 這場雨與童年之雨皆充滿歡樂之情
  - label: C
    content: 笛聲也引發作者的思鄉情懷
  - label: D
    content: 文末用刪節號更能顯得笛聲悠揚與餘韻無窮。
  lesson_raw:
    title: 下雨天，真好
    basis: 引述琦君〈下雨天，真好〉課文原句
  tags:
    textbook: 第一冊 下雨天，真好
    labeled_by: ai
