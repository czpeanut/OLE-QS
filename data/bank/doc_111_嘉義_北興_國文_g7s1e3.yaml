- id: doc_111_嘉義_北興_國文_g7s1e3_s6_31
  section: 6
  number: 31
  type: single
  page: 3
  stem: 根據本文，人類為何堅持撲翼飛行的研究？
  options:
  - label: A
    content: 要突破航空的瓶頸，讓科學更發達
  - label: B
    content: 想在藍天中自由翱翔
  - label: C
    content: 使固定機翼的載具更完美
  - label: D
    content: 能深切掌控鳥的生態，以便隨時取代。
  group_stem: "（四）人能與鳥比翼齊飛嗎？\n    人類自古以來就嚮往能像鳥一樣在藍天上翱翔。據後漢書記載，我國在一千九百多年前就有人用大鳥的羽毛製造成翅膀試驗過飛行。直到十七世紀，歐洲還有人試圖這樣模仿鳥類飛行，但都未能成功。這是為什麼呢？\n\
    \    經過長期研究，人類終於弄明白：人的肌肉能量與鳥類比較，相對來說要小得多，因此靠雙臂來搧動翅膀，是無法克服自身重量進行有效飛行的。\n    撲翼飛行的失敗，並不能阻擋人類的探索。一七八三年，人們利用輕於空氣的飛行器――氣球，第一次升上了天空。隨著生產技術和科學的發展，人們又在重於空氣的飛行器方面探索，開始也進行過撲翼機的研究，但是由於鳥類飛行時翅膀的運動十分複雜，限於當時的生產技術水準，還不能提供輕而堅固的材料和高效率的動力，這種嘗試仍未成功。後來，還是鳥類的翱翔和風箏的飛行給人以啟示，人們終於採用固定機翼的形式，於一九０三年發明了世界上第一架有動力的載人飛機，實現了飛行的理想。\n\
    \    從那以後，航空事業有了飛速的發展。今天，千姿百態的飛機飛向藍天，為國防和國民經濟服務著，乘坐飛機已成為極為普通的事了。不過，人們感到乘坐飛機並不能享受在藍天自由飛翔的樂趣。於是，許多航空愛好者絞盡腦汁進行撲翼飛行的研究。不久前，科學家們製成一種「機械鳥」，它以一臺小電動機為動力，搧動兩隻三米長的滌綸薄膜翅膀，便可輕盈地飛向天空。這種撲翼機可用於體育運動，也可用於軍事偵察和和通訊聯絡，引起各國航空界的極大關注。我們相信，在科學技術高度發展的今天，人類一定能實現像鳥一樣在廣闊的藍天中自由翱翔的美好願望。"
  tags:
    textbook: 第一冊（七上）第3次段考範圍
    labeled_by: ai
