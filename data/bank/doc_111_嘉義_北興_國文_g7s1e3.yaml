- id: doc_111_嘉義_北興_國文_g7s1e3_s5_3
  section: 5
  number: 3
  type: single
  page: 1
  stem: 作者故意運用誇大鋪張的手法來描述，以加深讀者的印象，這種技巧稱為「誇飾」，下列各選項何者並無此修辭？
  options:
  - label: A
    content: 夏蚊成雷，私擬作群鶴舞空
  - label: B
    content: 在鞭炮的煙硝裡，那龍活脫脫的就要騰雲駕霧沖天而去了
  - label: C
    content: 而有一些事，卻像夏日的小河、冬天的落葉
  - label: D
    content: 忽有龐然大物，拔山倒樹而來。
  tags:
    textbook: 第一冊（七上）第3次段考範圍
    labeled_by: ai
- id: doc_111_嘉義_北興_國文_g7s1e3_s5_4
  section: 5
  number: 4
  type: single
  page: 1
  stem: 下列哪一個場景最能呼應〈下雨天，真好〉的主題？
  options:
  - label: A
    content: 屋裡掛滿萬國旗似的溼衣服，牆壁地板都冒著溼氣
  - label: B
    content: 我的啟蒙老師說菩薩慈眉善目，母親的長相一定就跟菩薩一樣
  - label: C
    content: 母親一起床，我也跟著起來，顧不得吃早飯，就套上叔叔的舊皮靴，頂著雨在院子裡玩
  - label: D
    content: 那時在浙江 永嘉老家，我才六歲，睡在母親暖和的手臂彎裡。
  lesson_raw:
    title: 下雨天，真好
    basis: 題幹引述篇名〈下雨天，真好〉
  tags:
    textbook: 第一冊 下雨天，真好
    labeled_by: ai
