    content: 傍晚一場小雨，「淅零零」打在玻璃窗上
  - label: B
    content: 煙雨「濛濛」的西湖，遠遠看去有一種朦朧的美
  - label: C
    content: 清明時節，細雨「紛紛」，增添些許追念先人的感傷
  - label: D
    content: 風雨「淒淒」的夜晚，流落街頭的狗兒，忍不住縮在角落嗚咽。
