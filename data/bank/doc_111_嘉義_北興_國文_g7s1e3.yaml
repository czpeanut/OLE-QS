- id: doc_111_嘉義_北興_國文_g7s1e3_s5_8
  section: 5
  number: 8
  type: single
  page: 1
  stem: 〈下雨天，真好〉一文之敘述，何者最能體現作者母親的同情心？
  options:
  - label: A
    content: 母親不用老早起來做飯，可以在熱被窩裡多躺會兒
  - label: B
    content: 我望著母親的臉，她的額角方方正正，眉毛細細長長，眼睛瞇成一條線
  - label: C
    content: 五月黃梅天，到處黏糊糊的，母親走進走出的抱怨
  - label: D
    content: 母親一邊做飯，一邊聽。淚水掛滿了臉頰，拉起青布圍裙擦一下，又連忙盛一大碗滿滿的白米飯，請瞎子先生吃，再給他一大包的米。
  lesson_raw:
    title: 下雨天，真好
    basis: 題幹引述篇名〈下雨天，真好〉
  tags:
    textbook: 第一冊 下雨天，真好
    labeled_by: ai
