  group_stem: '（三）東施效顰    莊子

    西施病心而顰其里。其里之醜人見之而美之，歸亦捧心而顰其里。其里之富人見之，堅閉門而不出；貧人見之，挈妻子而去走。彼知顰美，而不知顰之所以美。

    ①顰：皺眉頭             ②挈：帶領。'
