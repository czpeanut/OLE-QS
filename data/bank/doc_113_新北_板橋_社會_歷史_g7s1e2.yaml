- id: doc_113_新北_板橋_社會_歷史_g7s1e2_s1_18
  section: 1
  number: 18
  type: single
  page: 1
  stem: 在一部以大航海時代的臺灣為背景的話劇中，小橘的臺詞如下：「聽說他是個狠角色，動用軍隊把公司趕走……公司走後，他們擴大開墾、還派軍隊來打我們，我們有好多土地都被搶走了。」請問：關於這段劇情，下列何者正確？
  options:
  - label: A
    content: 小橘扮演的角色應該是原住民
  - label: B
    content: 臺詞中的狠角色指的應是施琅
  - label: C
    content: 雙方應是在臺灣東部爆發衝突
  - label: D
    content: 這段劇情應改編自麻豆社事件。
