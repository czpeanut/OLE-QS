  section: 1
  number: 19
  type: single
  page: 1
  stem: 龍馬郵票（如右圖）是臺灣第一張訂製郵票。因未發行使用，又洽逢臺北至基隆間鐵路陸續通車，車票趕印不及，便以未發行的龍馬郵票改作鐵路車票使用。請問：龍馬郵票應與下列何者在臺灣推行的建設成果有關？
  options:
  - label: A
    content: 朱一貴
  - label: B
    content: 林爽文
  - label: C
    content: 沈葆楨
  - label: D
    content: 劉銘傳。
