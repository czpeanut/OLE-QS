  section: 1
  number: 30
  type: single
  page: 2
  stem: 清代官員記錄當時的臺灣社會現象：「無田宅、無妻子、不工不農；嫖賭摸竊、械鬥樹旗，靡所不為。單身遊食四方，隨處結黨，且衫褲不全，赤腳終生。」請問：下列何者解讀正確？
  options:
  - label: A
    content: 此種社會現象對治安不會有影響
  - label: B
    content: 此種社會現象被稱作「羅漢腳」
  - label: C
    content: 此種社會現象是開港通商導致的
  - label: D
    content: 此種社會現象反映了渡臺的危險。
