  section: 1
  number: 29
  type: single
  page: 2
  stem: 以下是臺灣某一時期官方所設學校的教學情形：「……學校教授他們羅馬字的讀法及寫法，讓他們用羅馬字拼寫自己的語言；並主要傳授學生祈禱文、基督教教義以及教唱聖歌。」請問：這段話最有助於我們用來說明下列何者？
  options:
  - label: A
    content: 荷蘭聯合東印度公司如何教導臺灣原住民
  - label: B
    content: 西班牙統治者在北臺灣宣教的內容與方式
  - label: C
    content: 明鄭時期儒學教育在臺灣創建的原因始末
  - label: D
    content: 臺灣巡撫劉銘傳設置西學堂的目的與內容。
