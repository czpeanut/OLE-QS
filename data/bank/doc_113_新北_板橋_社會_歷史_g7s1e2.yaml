  section: 1
  number: 21
  type: single
  page: 1
  stem: 阿橋在網路上查到一則資料：「大肚王在荷蘭人來到臺灣後，曾選擇與荷蘭人長期對抗，但可能考量到徒然消耗自己實力，不如以和平換取實力的保存，故後來與荷蘭人簽約，表示臣服。」請問：關於這則資料，下列何者正確？
  options:
  - label: A
    content: 資料中的大肚王為臺灣中部高山族領袖
  - label: B
    content: 臣服荷蘭的大肚王須定期參加地方會議
  - label: C
    content: 簽約後荷蘭直接取代大肚王成為新領袖
  - label: D
    content: 大肚王的決定可能有利荷蘭傳播天主教。
