  section: 1
  number: 23
  type: single
  page: 1
  stem: "某本書中記載了臺灣某個政權所採行的商業制度：\n● 名稱：來臺漢人有承包「番社」交易者，稱為「社商」。\n● 方式：公司利用競標方式，將某社商業交易權包給出價高者，並分四季向得標社商收稅。\n\
    \   得標社商以各種日用品向各社換取的鹿皮、鹿肉，部分上繳統治者、部分自行出售。\n      請問：關於這份資料，下列何者敘述正確？"
  options:
  - label: A
    content: 這份資料應是記載於《熱蘭遮城日誌》
  - label: B
    content: 這時期的政府是從中國移入的漢人政權
  - label: C
    content: 此種商業制度能使原住民獲得最大利益
  - label: D
    content: 統治者透過此種制度直接與原住民交易。
