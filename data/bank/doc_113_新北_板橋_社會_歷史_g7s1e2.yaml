    content: 臺灣。
  group_stem: "中元普度跨越國界 基隆紀念清法戰爭亡魂\n  今年（2024 年）正逢清法戰爭140 周年，基隆市正砂社區發展協會8 月11 日上午循往例，於法國公墓舉行中元普度儀式，使用紅酒、威士忌和法國麵包等，祭拜在當地戰死的法國士兵。\n\
    \  1884 年，清朝與法國為爭奪〇〇而展開清法戰爭，於外交協商陷入僵局時，法軍決定對煤礦資源豐富且守備薄弱的基隆發起攻擊，後續戰火亦波及淡水、澎湖等地。這場戰爭對臺灣影響深遠，不僅激發全島軍民的抵抗意志，更使清政府重新評估臺灣的戰略地位，決定進一步加強建設與治理。\n\
    資料來源：中國時報｜基隆清法戰爭140 周年 Podcast 談歷史重回獅球嶺古戰場\n（https://www.chinatimes.com/realtimenews/20240525001690-260405）"
