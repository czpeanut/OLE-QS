- id: doc_113_新北_板橋_社會_歷史_g7s1e2_s2_31
  section: 2
  number: 31
  type: single
  page: 2
  stem: 清朝地方官員所謂「生番地帶，不歸王化」，和當時清朝治臺的何種政策有關？
  options:
  - label: A
    content: 渡臺禁令
  - label: B
    content: 劃界封山
  - label: C
    content: 開港通商
  - label: D
    content: 開山撫番。
  group_stem: "漂流船與臺灣原住民的遭逢──清末以來的國際法爭議\n  西元1867 年3 月，一艘美國商船羅妹號（Rover）在臺灣南端發生海難，船長夫婦等14\
    \ 人被原住民社人所殺。清朝地方官員以「生番地帶，不歸王化」，拒不受理此事件，美國於是決定自行處理。在攻打原住民部落失利後，美國派遣李仙得（Charles\
    \ W. Le Gendre）直接與原住民談判，最後雙方達成協議：「原住民不得殺害海難生還者，並以紅旗作為識別。」\n  西元1871 年12 月，一艘琉球船隻因颱風漂流至臺灣東南部八瑤灣，船上69\
    \ 人當中，3 人溺死，54人因故被排灣族人殺害，僅12 人生還回國。企圖藉此船難事件加強控制琉球的日本，聘請熟悉南臺灣「番情」的李仙得為外交顧問。李仙得根據過往處理羅妹號事件的經驗，認為臺灣「生番地」不隸屬於清國，日本遂在西元1874\
    \ 年以「番地無主論」為理由出兵臺灣。\n資料來源：原住民族文獻｜漂流船與臺灣原住民的遭逢──清末以來的國際法爭議\n（https://ihc.cip.gov.tw/EJournal/EJournalCat/41）"
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 歷史
      code: 4-1
      title: 清初治臺政策與措施
      chapter: 第4章 清帝國統治政策的變遷
    textbook: 七上歷史 4-1 清初治臺政策與措施
    labeled_by: ai
