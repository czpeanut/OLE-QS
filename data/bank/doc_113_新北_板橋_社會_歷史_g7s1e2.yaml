  type: single
  page: 1
  stem: 清帝國攻取臺灣後，朝廷中有兩派人馬爭論不休，其中一派主張放棄臺灣，另一派則認為應該要保留臺灣。請問：主張保留臺灣者，其主要理由為何？
  options:
  - label: A
    content: 臺灣人口眾多，土地開發完善
  - label: B
    content: 臺灣容易治理，不會拖累財政
  - label: C
    content: 臺灣面積雖小，仍可增加版圖
  - label: D
    content: 臺灣土地肥沃，戰略地位重要。
