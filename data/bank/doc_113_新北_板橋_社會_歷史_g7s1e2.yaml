  page: 1
  stem: 大航海時代，臺灣原住民受到外來勢力的入侵，逐漸改變了原有的生活型態，但部分在管轄區外的族群則未受影響。請問：大航海時代，下列何族群最有可能維持原本的生活與信仰？
  options:
  - label: A
    content: 西拉雅族
  - label: B
    content: 凱達格蘭族
  - label: C
    content: 大肚王部落
  - label: D
    content: 賽德克族。
