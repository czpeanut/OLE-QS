  stem: 小明家裡有一臺 IH 爐，規格 110 V／60 Hz，最大功率 1800 W。按臺灣現在電價約3.5 元／度，若在廚房連用2 個小時的 IH 爐準備晚餐，則準備這頓晚餐約要花多少電費？
