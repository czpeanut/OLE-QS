  - label: D
    content: 1.8 × 2 × 3.5＝12.6（元）。
  group_stem: 4. IH 爐英文為 Induction Heating 直接翻譯為誘導發熱，其實是利用磁場變化使鍋具產生「渦電流」。磁場變化愈快，渦電流就愈強；渦電流在電阻較大的金屬上能使導體發熱。因此
    IH 爐非常挑鍋具，非金屬的鍋具不能用，金屬電阻較低的銅鍋或鋁鍋，也因為不易發熱也不能使用。而 IH 爐的爐面幾乎不發燙，安全性提高。因為直接發燙的是鍋具本身，因此能源轉成熱能的效率較佳，可達
    85％。試回答下列問題：
