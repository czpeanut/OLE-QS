  group_stem: "(題組30-32)\nFun Fact 1\n    A leaf sheep is a cute little animal that\
    \ has drawn lots of people’s eye. However, it’s neither a leaf nor a sheep. It’s\
    \ actually a sea slug. It looks like a snail, but it has small green parts like\
    \ leaves on its back.\n    Leaf sheep are no bigger than one centimeter long,\
    \ and they feed on algae. They were first seen around the island of Kuroshima\
    \ in 1993. Today, they can be found in the waters of Japan, Indonesia, and the\
    \ Philippines.\n    People love leaf sheep for their looks, but scientists love\
    \ them for what they can do. They’re able to turn the power of the sun into energy.\
    \ For leaf sheep, that’s food, and they can survive on just that for several months.\n\
    Fun Fact 2\n    Outside a new shop, you see a tall thin man. He’s smiling and\
    \ waving his long thin arms at you. He’s also bowing down and rising up to greet\
    \ you. The man continues this way for some time, and you can’t take your eyes\
    \ off him. His crazy dance moves are fun to watch. You want to tell him that,\
    \ but you can’t. The man isn’t human. He’s a tube man. His body and arms are made\
    \ of tubes of plastic fabric, and a fan blows air into them.\n\n    Tube men are\
    \ also called tall boys. That’s the name that artist Peter Minshall gave them.\
    \ He invented them for the 1966 Summer Olympics in Atlanta, Georgia. Minshall’s\
    \ tall boys were 60 feet tall. Some of them have not only a body but also two\
    \ legs. People loved his human-shaped balloons. Before long, tube men were everywhere.\
    \ Today, you can see tube men at businesses, special events, and even farms. Farmers\
    \ love how they scare birds away from their fields. Tube men have really danced\
    \ their way into the world.\nslug 蛞蝓 algae 藻類 motion 動作 fabric 纖維"
