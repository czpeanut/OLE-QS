    content: the school has many holidays
  group_stem: "(題組27-29)\n   Bruce is going to finish junior high school soon. He\
    \ has to choose a senior high school to go. He found some helpful information\
    \ of two schools: Excellence Senior High School and Wonderland Senior High School.\n\
    \nExcellence Senior High School is 2 km away from Bruce’s home. It is about 7-minute\
    \ bike ride from Bruce’s home to the school. The school is not very big. It is\
    \ built on a small piece of land. There is a modern library with 10 floors, and\
    \ the students can find a lot of books for studying. The school also has good\
    \ new classrooms with the latest computers and 120-inch TVs. It costs the students\
    \ NT$15,000 to study here each semester, and there is no scholarship for new students.\
    \ The school lunch is not tasty but healthy. Because of this, many students buy\
    \ food from outside restaurants. One field trip would be held one time every semester,\
    \ so students won’t just learn inside the classroom. The teachers give a lot of\
    \ homework and tests. Some students cannot deal with the hard work, and they stop\
    \ going to school before graduation. However, most students work hard and go to\
    \ very well-known universities. 45% of the students became very successful businessmen\
    \ or scientists after graduating from the school and working for years.\n\nWonderland\
    \ Senior High School is 15 km away, and it takes 40-minute bus ride from Bruce’s\
    \ home. The school is super big. There are even an amusement park and a movie\
    \ theater in the school, and the students can take the fun rides and watch movies\
    \ for free anytime. The students pay NT$8,000 each semester, and every new student\
    \ gets a NT$5,000 scholarship. There are many different choices about school lunch,\
    \ even McDonald's and KFC. Students can eat hamburgers and French fries every\
    \ day. As for learning style, the teachers like to take the students to learn\
    \ outside the classroom, so there would be ten field trips every semester. On\
    \ school days, students have classes only in the morning. They need to go to school\
    \ only four days a week. There is only one test at the end of the semester. Almost\
    \ all students finish school because the lessons are not too hard and the teachers\
    \ do not give too much homework. However, no one knows what jobs the students\
    \ get and where the students go after graduation.\nscholarship 獎學金 semester 學期\
    \ field trip 戶外教學 university 大學"
