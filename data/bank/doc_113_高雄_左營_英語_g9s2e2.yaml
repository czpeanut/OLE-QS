  group_stem: '(題組33-35 )

    There was a very big earthquake last night. The following are news reports from
    four different cities.


    In Elm City, the people have a strong system in place to prepare for earthquakes.
    Every month, all people here join safety drills to make sure they know what to
    do when an earthquake happens. So, during the earthquake, all the people in the
    city were well-prepared. When the shaking started, everyone quickly moved to safe
    places and knew exactly what to do. This quick action saved many lives in the
    city though few people died and hundreds of people got hurt. The regular drills
    were still a success.


    Maple City was lucky in this earthquake because of its modern buildings. All the
    buildings in the city are new and built with the latest earthquake safety rules.
    Because of these strong buildings, there was no serious damage, and no one died.
    The city cares a lot about teaching people how to stay safe. People here are always
    reminded about what to do in a disaster. Because of these efforts, Maple city
    had the fewest injured people.


    In Oak City, the situation was much worse. During the earthquake, three buildings
    fell down, and many others became dangerous to live in. The buildings in the city
    were built 30 years ago, following old earthquake safety rules. The rules at that
    time were not strong enough for such a powerful earthquake. Many people here had
    no idea about how to protect themselves when the shaking started, and that made
    everything even worse. Not enough knowledge and old buildings caused serious damage
    and great loss of life here.


    Fir City experienced the worst damage from the earthquake. Almost half of the
    city’s buildings, which were built 80 years ago, fell down. These buildings were
    not strong enough to go through such a strong earthquake. What’s worse, many of
    the people here were over 70 years old and had difficulty moving quickly. Many
    of them couldn’t run away from the falling buildings in time. The city’s older
    buildings, together with the old weak people, made Fir City one of the hardest-hit
    areas in the earthquake.

