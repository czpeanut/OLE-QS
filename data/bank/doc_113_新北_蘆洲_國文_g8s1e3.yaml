    李宅之整體造型樸素簡約，全宅未用木柱，是磚造石構之大型院落；少華飾，疊層之馬背脊屋頂，昂揚天際，是此建築之特色。據「七星下地-浮水蓮花」的風水寶地，復因矗立於田尾，鄉人皆稱「田仔尾」（後雅稱之田野美），厝前蓮花池，每逢天氣晴朗，池中映現觀音山頂倒影，清晰美觀，是謂「李厝一景」。

    ＜摘錄網路文章＞'
- id: doc_113_新北_蘆洲_國文_g8s1e3_s2_39
  section: 2
  number: 39
  type: single
  page: 6
  stem: 根據本文下列敘述何者正確？
  options:
  - label: A
    content: 作者現在跟著十八歲那年相同的朋友一起上山賞花
  - label: B
    content: 作者感念此情此景將失去，遂發出人生無常的感慨
  - label: C
    content: 作者以感性的筆調，傳達出對人間美好情誼的眷戀
  - label: D
    content: 作者的友人為了討好她，紛紛幫忙摘花來聯繫感情。
  group_stem: '那天，當我們四個人在那條山道上停下來的時候，原來只是想就近觀察那一群黑色的飛鳥的，沒想到，下了車以後，卻發現在這高高的清涼的山上，竟然四處盛開著野生的百合花。山很高，很清涼，是黃昏的時刻，濕潤的雲霧在我們身邊遊走，帶著一種淡淡的芬芳，這所有的一切竟然完全一樣。所有的一切竟然完全一樣，而雖然那麼多年已經過去了，為什麼連我心裡的感覺竟然也完全一樣。我迫不及待地想告訴同行的朋友，這眼前的一切和我十八歲那年的一個黃昏有著多少相似之處。一樣的灰綠色的暮靄、一樣的濕潤和清涼的雲霧、一樣的滿山盛開的潔白花朵；誰說時光不能重回？誰說世間充滿著變幻的事物？誰說我不能與曾經錯過的美麗再重新相遇？

    我幾乎有點語無倫次了，朋友們大概也感染到我的興奮。陳開始攀下山岩，在深草叢裡為我一朵一朵地採擷起來，宋也拿起相機一張又一張地拍攝著，我一面擔心山岩的陡削，一面又暗暗希望陳能夠多摘幾朵。陳果然是深知我心的朋友，他給我採了滿滿的一大把，笑著遞給了我。當我把百合抱在懷中的時候，真有一種無法形容的快樂和滿足。一生能有幾次，在高高的清涼的山上，懷抱著一整束又香又白的百合花？

    而這一切都要感激我的朋友們。所以，你說我愛的是花嗎？我愛的其實是伴隨著花香而來的珍惜與感激的心情。

    我實在愛極了這個世界。一直想不透的是，為什麼這個世界對我總是特別仁慈？為什麼我的朋友都對我特別偏袒與縱容？在我往前走的路上，為什麼總是充塞著一種淡淡的花香？有時恍惚，有時清晰，卻總是那樣久久地不肯散去？我有著這麼多這麼好的朋友們陪我一起走這一條路，你說，我怎麼能不希望這一段路途可以走得更長和更久一點呢？也就是因為這樣，我竟然開始憂慮和害怕起來，在我的幸福與喜悅裡，總無法不摻進一些淡淡的悲傷，就像那隨著雲霧襲來的，若有若無的花香一樣。

    然而，生命也許就是這樣的吧，無論是歡喜或是悲傷、總值得我們認認真真地來走上一趟。

    我想，生命應該就是這樣了。

    （節錄自席慕蓉 淡淡的花香）'
