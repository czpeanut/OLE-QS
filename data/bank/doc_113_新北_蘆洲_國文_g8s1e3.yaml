  group_stem: '王烈，字彥方，太原人也。少師事陳寔，以義行稱。鄉里有盜牛者，主得之，盜請罪曰：「邢戮是甘，乞不使王彥方知也。」烈聞而使人謝之，遺布一端。或問其故，烈曰
    ：「盜懼吾聞其過，是有恥惡之心。既懷恥惡，必能改善，故以此激之。」後有老父遺劍於路，行道一人見而守之，至暮，老父還，尋得劍，怪而問其姓名，以事告烈。烈使推求，乃先盜牛者也。

    《後漢書.王烈傳》

    刑戮是甘：甘願接受刑罰或被殺。'
