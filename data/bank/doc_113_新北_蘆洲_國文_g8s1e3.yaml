  page: 1
  stem: 生命中的碎珠 ：「零碎的時間，應該是生命中的碎珠、沙金、片玉」，作者用「碎珠、沙金、片玉」來比喻零碎的時間，是因為它們具有許多相同可對應的本質，但其中「不包括」下列何者？
  options:
  - label: A
    content: 累積起來價值不斐
  - label: B
    content: 雖為次級但仍珍貴
  - label: C
    content: 可以不斷重複利用
  - label: D
    content: 容易被人遺忘忽略。
  lesson_raw:
    title: 生命中的碎珠
    basis: 題幹引用《生命中的碎珠》
