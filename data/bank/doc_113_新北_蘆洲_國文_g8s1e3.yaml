  section: 1
  number: 12
  type: single
  page: 2
  stem: 「夙夜匪懈，主義是從」的「是」為賓語提前的助詞。下列「　」中的字，何者「不是」這樣的用法？
  options:
  - label: A
    content: 而廷尉乃當「之」罰金
  - label: B
    content: 蓮「之」愛
  - label: C
    content: 尺璧非寶，寸陰「是」競
  - label: D
    content: 唯利「是」圖。
- id: doc_113_新北_蘆洲_國文_g8s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 關於史記一書的敘述，下列何者「錯誤」？
  options:
  - label: A
