  number: 2
  type: single
  page: 1
  stem: 下列「 」中的國字，何組讀音前後相同？
  options:
  - label: A
    content: 上「行」，出中渭橋／以為「行」已過
  - label: B
    content: 獎「掖」後進／集「腋」成裘
  - label: C
    content: 思慮「縝」密／行事謹「慎」
