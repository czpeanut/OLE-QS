  section: 1
  number: 11
  type: single
  page: 1
  stem: 下列文句中，何者運用了「超出客觀事實」的誇飾修辭？
  options:
  - label: A
    content: 當午夜夢迴，孤單盪在我心底
  - label: B
    content: 那一塊在我夢裡的乾淨天空，是否玩大風吹也許就能看到
  - label: C
    content: 想法在我的左手，旋律在右手，就這樣找到了自由
  - label: D
    content: 想不到我只要一刻不見你，就無法呼吸。
