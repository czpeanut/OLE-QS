- id: doc_113_新北_蘆洲_國文_g8s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 下列選項「　」中的數量詞，何者使用「不恰當」？
  options:
  - label: A
    content: 這「隻」鋼筆是爸爸送給我的生日禮物
  - label: B
    content: 檢方正在審理「一樁」轟動社會的司法黃牛案
  - label: C
    content: 這「一幀」舊照片，勾起六、七年級生童年的回憶
  - label: D
    content: 凶殺案現場留下的那「一枚」可疑的指紋，將成破案的關鍵。
- id: doc_113_新北_蘆洲_國文_g8s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 席慕蓉 在一棵開花的樹一詩中，以「在佛前求了五百年」表達女子期盼情緣的心，運用這一句有什麼效果？
  options:
  - label: A
    content: 顯示出女子的願望難以達到，只有神才能完成這宿願
  - label: B
    content: 讓愛情的專注加上宗教的虔敬，顯出愛的神聖與崇高
  - label: C
    content: 表達兩情相悅的境界難能可貴，有圓滿的結局甚珍貴
  - label: D
    content: 有神的加持才能顯示願望的可行性，讓故事更為動人。
  lesson_raw:
    title: 一棵開花的樹
    basis: 題幹提及席慕蓉《一棵開花的樹》
- id: doc_113_新北_蘆洲_國文_g8s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 畫的哀傷 一文末段，作者刻意安排盛夏時節讓岡本回到過去與志村 一同寫生的野外，其用意為何？
  options:
  - label: A
    content: 藉由今昔相比產生落差，增添愁緒
  - label: B
    content: 夏天自然景色優美，適合回憶過去
  - label: C
    content: 因為人事已非，寄託景色舒放身心
  - label: D
    content: 志村在夏天死去，藉以緬懷並追思。
  lesson_raw:
    title: 畫的哀傷
    basis: 題幹提及《畫的哀傷》
- id: doc_113_新北_蘆洲_國文_g8s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 下列各選項對於句型的判斷，何者正確？
  options:
  - label: A
    content: 一把綠色小傘是一頂荷蓋：表態句
  - label: B
    content: 法者，天子所與天下公共也：敘事句
  - label: C
    content: 朵朵都是我前世的盼望：敘事句
  - label: D
    content: 廷尉，天下之平也：判斷句。
