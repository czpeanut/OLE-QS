    content: 草原不期而遇交談結下友誼作畫忘卻敵意
  - label: B
    content: 交談結下友誼作畫忘卻敵意草原不期而遇
  - label: C
    content: 作畫忘卻敵意草原不期而遇交談結下友誼
  - label: D
