    content: 口「ㄓㄨ」筆伐／錙「ㄓㄨ」必較
  - label: B
    content: 完「ㄅㄧˋ」歸趙／「ㄅㄧˋ」壘分明
  - label: C
    content: 發人深「ㄒㄧㄥˇ」／晨昏定「ㄒㄧㄥˇ」
  - label: D
    content: 能歌「ㄕㄢˋ」舞／四季遞「ㄕㄢˋ」。
