- id: doc_113_新北_蘆洲_國文_g8s1e3_s2_37
  section: 2
  number: 37
  type: single
  page: 5
  stem: 根據本文，下列敘述何者正確？
  options:
  - label: A
    content: 蘆洲李宅建造之初是作為官邸使用
  - label: B
    content: 蘆洲李宅四周樹木扶疏是為了美觀
  - label: C
    content: 蘆洲李宅的完成是歷經數代人之力
  - label: D
    content: 蘆洲李宅是台灣建築師傅得力作品。
  group_stem: '蘆洲李宅

    蘆洲李氏原籍福建省泉州府同安縣，於乾隆晚期的移民到蘆洲一帶落腳墾拓，最初李氏舊居於中路18 番地之土角茅草房，而現址是七番地，蘆洲田仔尾李宅又稱李祖厝。

    初建於1857 年，由李氏來台二世祖濯夫公創建，其時地基廣闊，初具規模。光緒二十一年(1895 年左右)，復由子嗣七房兄弟合資延聘大陸山西名建築師廖鳳山，專程來台設計擴建，當地人稱之為中原厝。三世祖士實公(諱樹華)，於清季擔任「儒學正堂」主管全台秀才科考業務，得光緒皇帝派令題繪；中門書懸「外翰」匾額(為清羅秀惠舉人題字)，並敕派丹桂九鼎門神守護李宅。是以蘆洲李宅兼具農莊與官宅格局。

    古厝建築之美

    蘆洲李宅位於新北市蘆洲區，建於台灣日治時期1903 年，規模為正身三進帶內、外護龍，全宅方整矩形，共七廳五十六房。1982 年中華民國內政部頒布實施《文化資產保存法》，1985
    年核定為台北縣縣定（今新北市直轄市市定）古蹟「三級古蹟蘆洲李宅」，成為首批列為古蹟的民宅之一；全宅至今大部份仍留原貌，破壞極少十分可貴，2018 年升等為國定古蹟。

    蘆洲李宅整體略成橢圓，構宅屋為中心四周植樹，具清代台灣民宅防禦特徵。李宅前有埕，分內外兩層，一道矮牆及門樓隔開，埕之前方為蓮花池。李宅正身三進帶內外護龍的大型三合院，九廳六十房三落、一百二十門，縱向主軸五（正身明間、正身、內護龍間的中庭，內、外護龍間的中庭），橫向主軸有三（門廳後廊，正、後廳的前廊及門所對應的護龍通道）。內、外護龍各自成獨立合院，正身除明間、廊及廂房外皆付「半樓仔」，平日儲藏物品，兼避洪水之用。

    李宅之整體造型樸素簡約，全宅未用木柱，是磚造石構之大型院落；少華飾，疊層之馬背脊屋頂，昂揚天際，是此建築之特色。據「七星下地-浮水蓮花」的風水寶地，復因矗立於田尾，鄉人皆稱「田仔尾」（後雅稱之田野美），厝前蓮花池，每逢天氣晴朗，池中映現觀音山頂倒影，清晰美觀，是謂「李厝一景」。

    ＜摘錄網路文章＞'
