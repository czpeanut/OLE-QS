  number: 14
  type: single
  page: 2
  stem: 席慕蓉在一棵開花的樹一詩最後並未能得到喜悅的結局，為什麼作者這樣安排？
  options:
  - label: A
    content: 為接下來再等五百年鋪陳，更顯示這份情感的堅貞
  - label: B
    content: 暗示女子對自己的情感過於羞怯，未能明確地表達
  - label: C
    content: 為女子另一段新情感做伏筆，鼓勵人不應輕易放棄
  - label: D
    content: 執著的落空具有震撼效果，讓人更對這份情感動容。
  lesson_raw:
    title: 一棵開花的樹
    basis: 題幹提及席慕蓉《一棵開花的樹》
- id: doc_113_新北_蘆洲_國文_g8s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 下列各選項中的「一」字，何者「不是」在表達人、事或物的實際數量？
  options:
  - label: A
    content: 「一」傘在握
  - label: B
    content: 在你身後落了「一」地的
  - label: C
    content: 連成「一」個無懈可擊的圓
  - label: D
    content: 佛於是把我化作「一」棵樹。
- id: doc_113_新北_蘆洲_國文_g8s1e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 蓉子　傘：「一傘在握　開闔自如／闔則為竿為杖　開則為花為亭／亭中藏一個寧靜的我。」啟示何種人生哲理？
  options:
  - label: A
    content: 人人皆可做自己的主人
  - label: B
    content: 工欲善其事，必先利其器
  - label: C
    content: 人生如苦海，只能苦中作樂
  - label: D
    content: 外在環境的變化，是難以操控的。
  lesson_raw:
    title: 傘
    basis: 題幹引用蓉子《傘》
- id: doc_113_新北_蘆洲_國文_g8s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 下列何者與「積沙能夠成塔，集腋可以成裘」意義相似？
  options:
  - label: A
    content: 近朱者赤，近墨者黑
  - label: B
    content: 不積跬步，無以至千里；不積小流，無以成江海
  - label: C
    content: 一沙一世界，一花一天堂
  - label: D
    content: 人莫恃才逞能，莫以智傲物。
- id: doc_113_新北_蘆洲_國文_g8s1e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 有關新詩、古詩、近體詩三者的敘述，下列何者「錯誤」？
  options:
  - label: A
    content: 古詩字數不限制
  - label: B
    content: 近體詩只分律詩和絕句
  - label: C
    content: 新詩一定要押韻
  - label: D
    content: 新詩在規律上比古詩、近體詩自由。
- id: doc_113_新北_蘆洲_國文_g8s1e3_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 下列詞語可以用來描述太陽初升情景的共有哪幾個？(甲)晌午(乙)紅色朝暾(丙)山居秋暝(丁)天才矇矇亮(戊)向暮的天空(己)暮靄沉沉(庚)透露著漠楞楞的曙色
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙丁庚
  - label: C
    content: 丁戊己
  - label: D
    content: 乙丙戊。
- id: doc_113_新北_蘆洲_國文_g8s1e3_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 唐 先生打破蟠龍花瓶，唐 太太暴跳如雷，其他家人都來說情。奶奶說：「老實說，這件事你未嘗沒有責任。」婆婆說：「這也許可能不是他的錯。」兒子說：「爸爸又不是故意的，說不定大概是不小心吧！」女兒說：「給爸爸一個機會，爸爸一定必然會改過。」以上誰說的話用字最精簡？
  options:
  - label: A
    content: 奶奶
  - label: B
    content: 婆婆
  - label: C
    content: 兒子
  - label: D
    content: 女兒。
- id: doc_113_新北_蘆洲_國文_g8s1e3_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 在日常生活中，我們會用敬詞、謙詞表達禮貌，下列「 」中的敬、謙詞，何者使用正確？
  options:
  - label: A
    content: 「閣下」才疏學淺，懇請諸位多多賜教
  - label: B
    content: 承蒙「敝伉儷」蒞臨會場，讓這場慈善晚會蓬蓽生輝
  - label: C
    content: 「貴府」的一席話，使我醍醐灌頂，茅塞頓開
  - label: D
    content: 待歸國後，歡迎再度光臨「寒舍」，必竭誠相待。
- id: doc_113_新北_蘆洲_國文_g8s1e3_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: '下列有關史記的說明，誰的說法「有誤」？

    結倫：作者張釋之是一位公正無私的廷尉，得漢文帝信任器重

    宜琳：首創以記人為主的紀傳體例，樹立後世正史寫作的典範

    芷琪：透過動作對話將人物性格、事件始末，刻劃得細膩深刻

    淋久：內容分為本紀、表、書、志、世家、列傳，文學價值高。'
  options:
  - label: A
    content: 結倫、宜琳
  - label: B
    content: 芷琪、淋久
  - label: C
    content: 結倫、淋久
  - label: D
    content: 宜琳、芷琪
  lesson_raw:
    title: 張釋之執法
    basis: 考查《史記》國學常識
- id: doc_113_新北_蘆洲_國文_g8s1e3_s1_23
  section: 1
  number: 23
  type: single
  page: 3
  stem: 「我們去看煙火好嗎／去／去看那／繁花之中如何再生繁花／夢境之上如何再現夢境／讓我們並肩走過荒涼的河岸仰望夜空／生命的狂喜與刺痛／都在這頃刻／宛如煙火」（席慕蓉
    請柬──給讀詩的人）下列關於本詩的敘述何者「錯誤」？
  options:
  - label: A
    content: 這是一首邀請讀者一同去河岸看煙火的邀約詩
  - label: B
    content: 以「荒涼的河岸」比喻充滿憂傷、惆悵、缺憾的生命
  - label: C
    content: 「仰望夜空」暗示脫離生命之苦的希望
  - label: D
    content: 點出了詩歌的文學價值，在於詩人與讀者間的心靈交流
- id: doc_113_新北_蘆洲_國文_g8s1e3_s1_24
  section: 1
  number: 24
  type: single
  page: 3
  stem: 「一個女孩送給青年乞丐一束玫瑰花。青年回家後，把玫瑰花插在凌亂無比的桌子上，玫瑰的高雅，凸顯桌子的雜亂。感覺不妥的青年，開始自覺的整理桌子，接著又打掃周遭髒亂的環境。等到都打掃乾淨了，他若有所悟:生活可以美麗如玫瑰，也可以混亂如垃圾。只要自己願意有所作為，一切都是可以被改變的，要活得像玫瑰或者垃圾，都看自己了。」(妙凡
    打掃的滋味 )文中玫瑰花帶給青年的啟示與下列何者最接近？
  options:
  - label: A
    content: 比上不足，比下有餘
  - label: B
    content: 近朱者赤，近墨者黑
  - label: C
    content: 順逆榮枯，存乎一心
  - label: D
    content: 如人飲水，冷暖自知。
- id: doc_113_新北_蘆洲_國文_g8s1e3_s1_25
  section: 1
  number: 25
  type: single
  page: 3
  stem: 「我不知道世人怎麼看我，不過我自己只覺得好像一個孩子在海邊玩耍的時候，偶爾拾到幾只光亮的貝殼。但是對於真正的知識大海，我還沒有發現呢！」(牛頓) 這段話的寓意，與下列何句相同？
  options:
  - label: A
    content: 有了屋頂，便失去了繁星
  - label: B
    content: 業精於勤，荒於嬉；行成於思，毀於隨
  - label: C
    content: 合抱之木，生於毫末；九層之臺，起於累土
  - label: D
    content: 不登高山，不知天之高也；不臨深溪，不知地之厚也。
