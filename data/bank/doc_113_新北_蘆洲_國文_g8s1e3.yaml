  page: 1
  stem: 下列「　」中的字經替換後，何者意思「改變」了？
  options:
  - label: A
    content: 且「方」其時：當
  - label: B
    content: 「乃」當之罰金：竟
  - label: C
    content: 「固」不敗傷我乎：豈
  - label: D
