  section: 3
  number: 21
  type: single
  page: 2
  stem: 李太白一斗百篇，援筆立成；杜子美改罷長吟，一字不苟。二公蓋亦互相譏嘲，太白贈子美云：「借問因何太瘦生，只為從前作詩苦。」苦之一字，譏其困雕鐫也。子美寄太白云：「何時一樽酒，重與細論文。」細之一字，譏其欠縝密也。(選自鶴林玉露)，根據這段文字，可推知下列何者？
  options:
  - label: A
    content: 李白文思敏捷，但是不夠縝密
  - label: B
    content: 杜甫喜愛飲酒，導致身形過分消瘦
  - label: C
    content: 杜甫覺得作詩痛苦，所以一改再改
  - label: D
    content: 杜甫譏笑李白不喝酒就寫不出詩文
- id: doc_113_台中_五權_國文_g7s1e2_s3_22
  section: 3
  number: 22
  type: single
  page: 2
  stem: 國文老師要學生以有關「冰」的成語造句，下列四位同學，誰的造句不當？
  options:
  - label: A
    content: 樣：每月獲報的虐童案超過百起，但這不過是「冰山一角」，未被揭露的案子，還不知有多少。
  - label: B
    content: 倪：他看似「冷若冰霜」，實際是個溫暖熱心的人，只是不善表達而已。
  - label: C
    content: 節：經過多方勸解，他們倆的誤會終於「冰消瓦解」了。
  - label: D
    content: 旭：她氣質高雅，皮膚更是「如履薄冰」，吹彈可破。
