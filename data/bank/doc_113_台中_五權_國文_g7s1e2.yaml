  stem: '請判斷下列各詩句所屬的風格，並依「田園派」、「浪漫派」、「邊塞派」、「社會寫實派」的順序排列。

    （甲）秦時明月漢時關，萬里長征人未還。但使龍城飛將在，不教胡馬度陰山。

    （乙）時難年荒世業空，弟兄羈旅各西東。田園寥落干戈後，骨肉流離道路中。

    （丙）朝辭白帝彩雲間，千里江陵一日還。兩岸猿聲啼不住，輕舟已過萬重山。

    （丁）積雨空林煙火遲，蒸藜炊黍餉東菑。漠漠水田飛白鷺，陰陰夏木囀黃鸝。'
