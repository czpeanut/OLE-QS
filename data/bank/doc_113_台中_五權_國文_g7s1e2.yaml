  group_stem: "看小孩吃冰，確實令大人賞心悅目，遠比自己吃冰還要過癮，因為小孩喜形於色，表情比他們實際吃下的東西還要豐富。一根冰棒握在他們手中，比什麼金銀財寶還要珍貴，舔之再三，就是捨不得一口吃完吞下，總要等冰棒融化了，糖水四流，才萬分不捨的舔個乾淨。\n\
    \    相較之下，大人們吃冰就比較實際，而且直截了當多了。他們首要的考量是止渴，其次才是口味，只要能當下消暑去火，一仰而盡，反而痛快！\n我的父親就是這樣的人，吃冰就像喝酒時乾杯，絕不拖泥帶水。他身強體壯，肌肉結實，十分容易流汗。每到夏天總是一身汗水，身上的汗衫從早溼到晚。由於怕熱，他消暑的方法很簡單，一是吹電風扇，一是吃冰。只要他中午回家睡午覺，電風扇總是開著，嗡嗡的在榻榻米上旋轉個不停。起床後，總要喝完一大碗的冰水後，才心滿意足的頂著大太陽去上班。\n\
    \    父親雖在糖廠上班，但對福利社的冰品向來興趣缺缺，碰都不碰，當我們小孩沒事往福利社跑時，他反而喜歡到街上的冰店買冰塊。\n  夏天日照長，日落也晚，傍晚時日式的宿舍區熱得像個大火爐，父親下班回家時，腳踏車的手把上總會掛著一塊用麻繩綁著的冰塊，搖搖晃晃的閃耀著晶亮的寒芒。我們一擁而上，接過冰塊後，便知道晚飯後會有一大碗、一大碗的冰水可以喝了。\n\
    假如光是買冰塊，對我們的誘惑還不大，充其量也不過是冰涼的糖水罷了。一向懂得享受的父親，一定會叫母親上市場時買些仙草或米苔目回來，先用糖水泡勻，等他將冰塊買回來放在裡頭。不消半個小時，原本像一座冰山的冰塊，就會融去一大半，而一大盆的仙草或米苔目早已冰透，金屬的盆子上全凝聚著一粒粒汗水一般的顆粒，光是看著暑氣就消失大半了。\n\
    \   冰塊無疑是最偉大的發明，安撫了、沉澱了、冷卻了人們煩躁不安、火爆剛烈的情緒，而能捱過炎炎的夏日。年復一年，一代傳過一代，多少吃冰的故事發生了，多少吃冰的趣味、記憶和生活的點滴，譜成了夏日的組曲。像一條冰河，載浮載沉的流過我們的歲月和生命。\n\
    \                                                （節選自古蒙仁〈夏日冰塊組曲〉"
  uncertain_spans:
  - 內容與原卷文字層不符（吻合 86%）
