  group_stem: '請在閱讀下列敘述後，回答29.～30.題

    消防隊員為了搶救人的生命，常得先進入發生火災的建築物內。進入火場後，得先控制火勢，最常見的方法，是將水柱直接澆灌在火焰上；但是在一些情況下，會將水噴成細霧狀以籠罩火焰，則是更有效的滅火方式，因為細霧狀的水容易轉變成水蒸氣，這個過程會迅速吸收周遭環境中大量的熱能，讓燃燒中的物質降溫及冷卻，以達到滅火的目的。'
