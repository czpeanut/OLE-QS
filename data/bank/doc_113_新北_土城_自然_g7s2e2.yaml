- id: doc_113_新北_土城_自然_g7s2e2_s2_29
  section: 2
  number: 29
  type: single
  page: 3
  stem: 2025 年恐狼的產生屬於下列哪一種生物技術？ [2-5]
  options:
  - label: A
    content: 育種
  - label: B
    content: 基因轉殖技術
  - label: C
    content: 複製生物
  - label: D
    content: 發酵
  group_stem: "◼ 恐狼回歸(第29~30 題，每題4 分)\n 2025 年4 月，美國生技公司 Colossal Bioscience 聲稱復活了一萬年前滅絕的「恐狼」。該生技公司的首席科學家\
    \ Beth Shapiro 提到，他們是從博物館的骨頭樣本取得古代 DNA，重建基因組，再和灰狼比對，並試圖將灰狼重建\n成「恐狼」，主要是改變灰狼的臉部特徵，並賦予雪白的毛皮外觀；也就是說，並不是直接從恐狼\
    \ (學名Aenocyon dirus) 身上萃取 DNA 並完整復育，而是用灰狼細胞作為模板，將他們從化石中比對出來的一小部分（15 個）「巨狼特徵」的基因利用基因編輯技術修改灰狼的這些基因片段，再將這些基因編輯細胞植入代孕犬體內，成功誕下三隻小狼。\n\
    \ 2021 年研究顯示，灰狼(學名Canis lupus)和恐狼早在約 570 萬年前就分家，即便灰狼與恐狼有 99.5 % 的 DNA 是一樣的，但是只修改\
    \ 20 處 DNA 的位置，並不足以創造出不同的物種，因為仍有數百萬個鹼基對的差異。所以，這三隻小狼可能長得像恐狼、行為（有點）類似、毛色也比較古老感，但牠們的絕大部分DNA\
    \ 還是屬於現代灰狼的。\n -摘自中央研究院<研之有物>\n依上文回答第29~30 題"
  tags:
