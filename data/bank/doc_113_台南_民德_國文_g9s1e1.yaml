  group_stem: "（三）\n當年，沒有馬來人到不列顛①去留學；\n  沒有馬來人進殖民地政府的辦公廳；沒有\n  馬來人摘椰子給英國人榨油；沒有馬來人\n\
    \  為白種人做苦工，被踢、罵；那時大家都快樂，\n   不必耕，不必流汗，果樹滿地生；\n   森林裡到處有肥美鳥獸等你捕擒。\n\n  馬來人    \
    \    。蓊鬱富饒的熱帶土地\n  給他們；棕色的皮膚給他們，好擋住赤道線\n  射出的白火；三面送來清涼的海風，海上\n  悲壯的大合唱，森林裡廣闊無邊的交響樂；\n\
    \   最諧和的單純，最大膽的大混合，\n   只有天空可以比擬，那神祕的籌畫！\n\n  一尺長的香蕉，枕頭大的波蘿蜜，晶米啦；\n  榴槤迷人的香味，幾十步外就要你垂涎；\n\
    \  紅毛丹的水紅、粉紅、火紅；山竹紫得化不開，\n  緊包住甜脆雪白的肥瓣；還有那蘭沙，\n   杜果，一咕嚕就連核溜進你的胃底；\n   芭漿，芒果，金黃的甜汁氾濫在口裡，\n\
    \  要使你無法呼吸。 … …\n\n  四腳蛇②有雞肉的美味；鯧魚如顏色牒；\n  林中古潭裡有漆黑的大鮎魚，強橫的\n  土鯽；當海潮消退，紅木的叢林裡\n\
    \  有成堆的蟶、充血的蚶③、碗大的蟳和蠘④；\n   剖開半熟的椰子，吃冰淇凌般的嫩漿；\n   劈斷大藤條，流糖水，喝得你發嗆。（節選自杜運燮 馬來亞）\
    \  \n\n【注釋】①不列顛：英國的音譯。②四腳蛇：蜥蜴的俗稱。③有成堆的蟶充血的蚶：蟶、蚶，可食用的海產貝類。蟶，音ㄔㄥ。蚶，音ㄏㄢ。④蠘：音ㄐㄧㄝˊ，甲殼類動物。"
