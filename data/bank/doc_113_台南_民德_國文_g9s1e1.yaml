  type: single
  page: 4
  stem: 根據本文，田饒之所以想離開魯哀公，是因為魯哀公如何？
  options:
  - label: A
    content: 曲高和寡
  - label: B
    content: 鳥盡弓藏
  - label: C
    content: 貴遠賤近
  - label: D
    content: 優柔寡斷。
  group_stem: "（二）\n田饒謂魯哀公曰：「臣將去君而鴻鵠舉①矣。」哀公曰：「何謂也？」田饒曰：「君獨不見夫雞乎？頭戴冠者，文②也；足傅距③者，武也；敵在前敢鬥者，勇也；見食相呼，仁也；守夜不失時，信也。雞雖有此五者，君猶曰瀹④而食之。何則？以其所從來近也。夫鴻鵠一舉千里，止⑤君園池，食君魚鱉，啄君菽粟，無此五者，君猶貴之，以其所從來遠也。臣請鴻鵠舉矣。」\n\
    \  哀公曰：「止！吾書⑥子之言。」田饒曰：「臣聞食其食者不毀其器，蔭其樹者不折其枝。有士不用，何書其言為⑦？」遂去之燕。\n  燕立以為相。三年，燕之政大平，國無盜賊。（劉向\
    \ 新序 雜事五）\n\n【注釋】①舉：飛。②文：文采。③傅距：傅，附著。距，雄雞腳掌後面像腳趾一樣凸起的部分。④瀹：音ㄩㄝˋ，煮。⑤止：停留、居住。⑥書：寫。⑦為：用於句末，表示疑問、反詰的意思。"
