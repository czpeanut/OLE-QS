- id: doc_113_台南_民德_國文_g9s1e1_s4_1
  section: 4
  number: 1
  type: single
  page: 4
  stem: 作者最後一次來到外公的鐵道宿舍時，最有可能看到的情景為何？
  options:
  - label: A
    content: 清晨時，外公因朋友來訪起身出了鋪著榻榻米的起居室
  - label: B
    content: 下午時，外公在宿舍前庭和朋友聊天
  - label: C
    content: 正午時，外公開著日光燈精神抖擻坐在凳子
  - label: D
    content: 黃昏時，外公在未開燈的宿舍外整理著盆栽。
  group_stem: "(一)\n外公居住的日式鐵道宿舍，屋頂脊線平實，形式單一，並不富有律動之美。日式房舍興建供給公家人員居住，本來就依據職等不同而在建築大小、式樣以及庭園面積等方面，有所規範。高雄\
    \ 壽山腳下的鐵道宿舍，房子樣式簡樸，一層樓高，二十幾坪大，但是前後皆有庭園，未知日治時代屬於什麼職等的人居住。宿舍型制因應臺灣氣候經過改良，外公家的房子底下是加高、附有氣窗通風以避免溼氣的。\n\
    \  屋內原有一處榻榻米，後來因為更換麻煩，也就和其他部分一樣改鋪木板條，走起來嘎滋作響；從前是深赭色的，配合著綠紗窗和窗外的無數盆栽，天然一種靜謐，時間都變慢了；後來，親戚們主張稍事整修，木板重新修過，而居然是蜜蠟色的了，有點刺眼。老人眼力衰敗得快，不能適應日光燈，除非天已完全暗下，外公大多數時候都是在沉沉的影子裡活動，或者就僅僅端坐著，不知道想些什麼；黯淡光下，木頭顏色也就不太重要了。倒是和服娃娃的繡線，仍因為外在光源流轉，偶爾可以瞥見那金線一瞬。\n\
    \  我記得最後一次到那裡去，外公精神罕見的抖擻起來，原來是有老朋友來訪，搬了木凳，兩人坐在前庭，以日語和河洛語夾雜交談，陽光透過空蕩蕩的花架灑下來，兩個相對而坐的老人，面色看來極為柔和。（楊佳嫻\
    \ 惜別）"
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 國文
      code: 第一課
      title: 土
      chapter: null
    textbook: 九上 第一課 土
    labeled_by: ai
