  stem: 高雄市政府在2024 年12 月宣佈和輝達、鴻海等集團發表「智慧高雄燈塔計畫」，透過生成式AI 分析數據，從洪水防災到智慧交通管理，提升城市治理效率。業界分析，高雄雖離首都較遠，重要運輸接點目前都仍以北部為主，但高雄的水電優惠條件充足、天氣穩定，且鴻海集團與輝達合作建置的「鴻海高雄超級算力中心」，在高軟體園區的一棟雲端科技大樓內，預計於2026
