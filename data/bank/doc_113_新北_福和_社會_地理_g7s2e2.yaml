  stem: 「直播帶貨」近年已成為新的購物風潮。直播主在網路平台上向顧客介紹產品，顧客也能直接向主播提問、獲取產品的詳細資訊，簡化購買決策過程。不僅如此，主播透過真實的分享與客製化推薦，能有效建立消費者的信任與品牌忠誠度，省去部分實體空間的租用成本。有關直播帶貨的興起，下列敘述何者正確？【4-3】
