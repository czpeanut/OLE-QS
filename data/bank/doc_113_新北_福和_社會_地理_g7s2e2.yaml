- id: doc_113_新北_福和_社會_地理_g7s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: '為彌補貿易損失，美國總統川普發布「關稅價目表」，若美國對某國貿易進口額大於出口額，則對該國加徵關稅：

    美國應課徵關稅 $\text{= } \frac{1}{2} \times \frac{\text{美國對某國的貿易入超額}}{\text{該國對美出口總額}}$

    白宮幕僚發布上述公式，指出美國徵收各國家基本關稅為10％，並依貿易入超額加徵關稅。此原則下，臺灣將被課徵近32％的關稅。這項舉措造成近期國際貿易情勢擺盪不定。臺灣被課徵高關稅，最可能基於下列何項理由？【4-3】'
  options:
  - label: A
    content: 臺灣對美國呈現貿易額出超
  - label: B
    content: 臺灣對美國呈現貿易額入超
  - label: C
    content: 美國是臺灣的出超國
  - label: D
    content: 臺灣是美國的入超國
