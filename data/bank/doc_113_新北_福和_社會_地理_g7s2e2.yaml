  group_stem: '今時今日，臺灣的甘蔗都在比較溫暖潮濕的低緯度地區栽培，糖廠也大都在產區附近。但很少人知道，百年前先民曾在今日新北市永和區一帶種植甘蔗，開「糖廍」（即傳統的製糖廠）製糖。永和北方沿著新店溪一帶的平原，舊稱「溪洲庄」。此地地勢較低，容易因新店溪的河水氾濫而造成泥沙淤積。清朝中葉，來自福建的泉州人遷入了溪洲平原。泉州人運用來自原鄉的製糖技術，將溪洲開闢成埔園種蔗，並在蔗田不遠處的糖廍製糖。

    今天的和平街附近，樂華夜市一帶有一個稱「舊廍」的舊地名，即是曾經的糖廍所在地之一。住在舊廍的楊華英女士，是畫家楊三郎的二姐，從小就被送給舊廍的許家當童養媳。許家是大農戶，所開設的糖廍早年經過大水氾濫流失後，移到地勢較高的地方。楊女士回憶道放糖的木桶很大，要拿梯子才能取到糖。直至日治時期，為了滿足大量的市場需求，官方扶植糖業株式會社與現代化糖廠建設，個別農戶的製糖事業才日漸式微，製糖事業才在永和成為絕響。'
