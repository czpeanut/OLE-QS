    | 甲 | 國內需求已被滿足，故發展港邊的園區轉向出口發展 |

    | 乙 | 工資上漲，紡織業逐漸外移，出口額大幅下降 |

    | 丙 | 受政府保護政策扶植，紡織業於此時期快速成長 |

    | 丁 | 對化學纖維需求日增，政府將上游石化產業列為發展重點，開發重大建設以穩固臺灣紡織業在全球供應鏈的地位 |'
