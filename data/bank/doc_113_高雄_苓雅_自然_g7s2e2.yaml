- id: doc_113_高雄_苓雅_自然_g7s2e2_s1_48
  section: 1
  number: 48
  type: single
  page: 6
  stem: 下列何者與製作藍紋起司的真菌有較近的親緣關係？
  options:
  - label: A
    content: 黑黴菌
  - label: B
    content: 靈芝
  - label: C
    content: 酵母菌
  - label: D
    content: 香菇。
  group_stem: "【題組四】閱讀下列文本後，回答48~50 題：\n  一般而言，食物只要一發霉就不能吃了，然而「藍紋起司」卻是故意在製造過程中加入黴菌使它發霉。讓藍紋起司有著藍色大理石紋路，以及強烈氣味的正是青黴菌，雖然和製造青黴素的金黃青黴菌（Penicillium\
    \ chrysogenum）同屬，但是不同種的菌種。\n  依傳統製作的藍紋起司，主要使用的菌種有洛克福耳青黴菌（Penicillium roqueforti）、灰綠青黴菌（Penicillium\
    \ glaucum）等。這兩種菌種都是屬於可食用的微生物，非病原菌，不會導致人體生病或感染。製作起司時，須使用未殺菌的生乳，加入凝乳酵素、撒上單一菌種青黴菌粉，凝結後將乳凝塊壓入模具中成型。脫模後，在表面抹上大量鹽，再放入低溫、潮溼的環境中，讓青黴菌緩慢生長、發酵、熟成。過程中會在起司上刺小洞，讓空氣進入，幫助黴菌生長。\n\
    \  在發酵過程裡，菌絲會深入分解起司中的脂肪及蛋白質，改變起司質地並產生出特殊的風味。同時，因為青黴菌也會抑制其他病原菌的生長，延長了保存的時間。\n \
    \ 利用黴菌發酵製作的食物，除了藍紋起司外，像是我們常吃的醬油、味噌、豆腐乳等也都是藉由黴菌發酵製成。這些黴菌都是對人體無害的微生物，讓人們可以藉由它們品嘗到獨特的美味。但是其他黴菌通常會產生毒素，因此不要吃發霉的食物，避免食物中毒。"
