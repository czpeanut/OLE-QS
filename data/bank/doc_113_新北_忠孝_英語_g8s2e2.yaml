  stem: 3. What is the main idea of the news?  main 主要的
  options:
  - label: A
    content: April is the best time to stay at hotels in Taiwan.
  - label: B
    content: A new hotel law in Taiwan helps reduce plastic waste.  reduce 減少
  - label: C
    content: People should travel more to support hotels.  support 支持
  - label: D
    content: Hotels now must give more free things to people.
  group_stem: April is a great time to travel in Taiwan. You can stay at a hotel.
    Put some clothes in a bag and you're ready! But wait! There's a new law! Hotels
    in Taiwan used to give you some free things. But now, they can't. Those are the
    things you throw away after using them one time. This law started on January 1st.
    Hotels can't give you toothbrushes, combs, or shower caps. Bring your own! And
    now hotels are using big bottles for shampoo and soap. They fill the bottles again
    and again. Goodbye, cute mini bottles! This law means 460 million plastic bottles
    won't be needed every year. That cuts Taiwan's plastic use by 30 percent! Most
    people didn't want this law a few years ago. But now, people see these small changes
    to their hotel stays aren't so bad. They see these small changes make a big change
    for Taiwan's environment. Let's all help cut plastic waste. Be ready for your
    hotel stay! Remember to bring everything you need!   (ICRT News for Kids)
