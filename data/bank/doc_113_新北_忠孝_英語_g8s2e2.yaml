  group_stem: 'Baby flies are called larvae. They have no legs or wings. They are
    very small. One kind of larvae is black soldier fly larvae. These larvae can make
    something good! Black soldier fly larvae eat and eat. They can eat lots of food
    waste. That''s the food we don''t eat. Eating it is good for the Earth. But that''s
    not all they do. They poop! Their poop is called frass. These larvae make lots
    of frass! And that''s good for the Earth too. Why? Frass can make soil healthy.
    Healthy soil helps plants grow better. Frass also helps soil hold water longer.
    So frass can be great for farms! Frass is also natural. Some farms use natural
    ways to grow food. But in some countries, these farms cannot use frass. The countries
    have not okayed the use of frass. So now, scientists and farmers are trying to
    change this. They are teaching more people about frass. One day, black soldier
    fly larvae frass may help farms all over the world. These small larvae can help
    the Earth with their frass!

    (ICRT News for Kids)'
