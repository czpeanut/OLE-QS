- id: doc_113_新北_忠孝_英語_g8s2e2_s2_25
  section: 2
  number: 25
  type: single
  page: 4
  stem: 5.  What is the main idea of the reading?
  options:
  - label: A
    content: Earthquakes and typhoons bring lots of driftwood to Hualien.
  - label: B
    content: People like to take pictures of driftwood on the beach.
  - label: C
    content: Scientists are finding ways to make good use of driftwood.
  - label: D
    content: Driftwood makes Hualien’s beaches clean and beautiful.
  group_stem: Hualien has been hit by some big earthquakes and typhoons since last
    April. They made trees fall down! They also made trees break into smaller pieces
    of wood. The wind pushed the wood into the ocean. There, it became driftwood!
    Now there is too much driftwood on Hualien's beaches. One typhoon left 13,000
    tons of it! People go to the beaches to take pictures of it! But so much driftwood
    is not good for the beaches. People can take big pieces to make furniture or art.
    But what about all the small driftwood? Scientists have found new ways to use
    it. They break it into smaller pieces. Then they burn it to make fuel. When this
    happens, the wood becomes hard, black, and gray. It's charcoal! It can help plants
    grow. Farmers are using it on their land. It can also be used to make homes for
    fish and other ocean animals! Scientists are making useful things for the land
    and the ocean from driftwood! One day Hualien's beaches will be clean and beautiful
    again!  (ICRT News for Kids)
