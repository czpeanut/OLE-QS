    content: because she found a better way to spend money
  - label: B
    content: after she started to go shopping every weekend
  - label: C
    content: when her father’s business started to lose money
  - label: D
    content: as soon as her parents decided to buy a bigger house
  group_stem: 'Cathy used to think she was the happiest girl in the world when her
    father was doing business successfully. Her family lived in a big house. She always
    had beautiful clothes to wear and delicious food to eat. Her parents often took
    her for a trip abroad.

    However, when Cathy was in the first year of junior high school, everything changed    (9)    .
    The family sold the house and moved into a small apartment. With no more good
    food or clothes, Cathy always missed the good old days. One day, Cathy’s best
    friend invited her to her birthday party, Cathy wanted to go, but she knew she
    didn’t have good shoes to wear. After she got home, she told her mother about
    her worry.

    Her mother showed her a picture in the newspaper. In the picture were some smiling
    children with no shoes on their feet. They were children in a very poor country.
    Seeing their bright smiles, Cathy thought, “If they can be so happy without shoes,
    why can’t I, still with some shoes, be happier than they?” She realized that    (10)    .
    She forgot about the new shoes and decided to live on happily.

     used to 以前經常  abroad 在國外  apartment 公寓  smile 微笑  realize 了解'
