  group_stem: "51-52 題組\n    飛魚是蘭嶼達悟族人重要的食物之一，相傳達悟族的祖先混吃不同的魚貝類而生病，在夢中遇到好心的魚神教導，讓達悟族人學會如何捕捉、儲藏與食用，這些知識演變至今，成為飛魚季非常重要的活動，飛魚季通常在每年二月底開始到九月中結束，結束後則不可以再捕捉飛魚。對達悟族人來說，出海捕魚是男人的工作，捕捉到的漁獲則會分享給部落裡的人。飛魚可分為老人魚、男人魚及女人魚，捕魚時必須捕撈不同種，以供應家裡的男女老少享用。若遊客到蘭嶼觀光時碰上部落正在捕捉飛魚，應遵守部落的相關禁忌規範。"
