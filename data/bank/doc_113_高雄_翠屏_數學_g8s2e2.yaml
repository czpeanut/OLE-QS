- id: doc_113_高雄_翠屏_數學_g8s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: '關於全等的性質，下列敘述有哪幾個是正確的？

    甲：兩個三角形中若有兩組對應角相等，一組對應邊等長，則此兩三角形必全等

    乙：兩個等面積的三角形必全等

    丙：若兩個等腰直角三角形的斜邊相等，則此兩個三角形必全等

    丁：若兩個直角三角形的兩銳角分別對應相等，則此三角形必全等'
  options:
  - label: A
    content: 甲、乙
  - label: B
    content: 甲、丙
  - label: C
    content: 丙、丁
  - label: D
    content: 甲、丙、丁
  tags:
