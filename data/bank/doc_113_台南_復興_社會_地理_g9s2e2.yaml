- id: doc_113_台南_復興_社會_地理_g9s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 小林和家人來到臺南旅遊，午後走訪熱鬧的安平老街，品嚐在地美食後，決定前往一處較為寧靜的海邊景點散步放鬆。他們穿越一座名為「漁光橋」的橋，來到被稱為「漁光島」的小島。這裡位於臺南市安平區西南方，島上有林蔭步道與遼闊的海景，氣氛恬靜悠閒，與老街的熱鬧形成鮮明對比。傍晚時分，夕陽緩緩落入海平面，照亮整片天空與水面，成為小林此行最難忘的畫面之一。在欣賞這片美景的同時，小林也開始思考，像這樣靠近海邊、並透過橋樑與本島相連的小島，是如何形成的呢？請問，下列何者為漁光島的主要地形成因？
  options:
  - label: A
    content: 海水面上升，沿海丘陵相對下沉。
  - label: B
    content: 海底珊瑚礁堆積，因海面下降或陸地上升而露出海面。
  - label: C
    content: 來自於河川沖積下來的泥沙堆積而凸出於海面的地形。
  - label: D
    content: 海底火山噴發後，熔岩、火山灰等噴發物堆積形成。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
