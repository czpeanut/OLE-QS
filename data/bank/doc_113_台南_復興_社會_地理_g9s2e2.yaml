  type: single
  page: 2
  stem: 高雄市旗山區的百賢農場負責人侯兆百栽種品種改良「高雄九號毛豆」，他的田間設立了土壤感測儀、微氣象站，用以蒐集土壤肥力與氣象數據，採用智慧化與標準化的種植模式。他更利用機械大規模採收，趕在採收後黃金四小時內加工，毛豆的種植與加工過程皆一一記錄，商品具有產銷履歷。因毛豆粒粒飽滿、口感鮮甜，成功輸往世界12個國家，創造台灣新綠金。請問，下列何者不屬於百賢農產所具備的競爭力？
  options:
