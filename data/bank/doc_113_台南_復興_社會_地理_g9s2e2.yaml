  group_stem: '《題組二》

    在世界各國邁向淨零碳排的路上，應該少有國家比澳洲更「狂」了。雖然有充足的石油、煤礦等化石燃料，卻狠心拆掉境內三分之一的火力發電廠，全力邁向綠能。從2019年開始，澳洲興建綠能設備比德國快兩倍、比美國快五倍，更是全球綠能設備建置平均速度的十倍。

    據統計，2022年再生能源已佔澳洲發電量35.9％，其中又以風力發電與太陽能光電，貢獻最為顯著。澳洲政府已經批准了一項價值200億澳元（約135億美元）的「太陽能計劃」，該計劃預計在澳洲某一行政區(圖十一)建設一個全球最大的太陽能發電場和儲能設施，並通過一條長達4,300公里的海底電纜將電力輸送到以最短路徑送至新加坡。而今年，澳洲亦啟動「南方之星」離岸風電工程，並預計在2030年末正式營運，目標是於2035年達成100%綠能供應，以實現碳中和，並成為能源出口大國。'
