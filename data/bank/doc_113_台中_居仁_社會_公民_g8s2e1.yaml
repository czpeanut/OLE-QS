  group_stem: '【題組一】


    2 國中生看電影破千元？疑遭加收餐飲錢 台中市政府說話了

    台中2 名國中生到台中大遠百威秀影城看電影，購買2 人套餐，加上電影票竟花了上千元，家長心生疑慮查看發票，發現疑似被超收了300 餘元的飲料與爆米花，憤而PO
    網。台中市政府表示，業者疑似有不當行銷之虞，消費者可向市政府提出消費爭議申訴。

    1 名民眾昨天在臉書社團爆料公設二社發文，表示孩子和同學2 名國中生上周末到大遠百威秀影城看電影，現場人員告訴他們套餐比較便宜，就點了2 人套餐，領取2 份爆米花與2
    杯可樂入場，不過2 人加起來竟花了1088 元，引起家長懷疑。PO 文者研究發票，發現除了電影票520 元，餐飲費高達568 元，然而2 人套餐明明才240
    元；細究發票內容，剩下328 元是2 杯100 元的紅茶與1 份128 元的爆米花，但入場時只有領到2 人套餐，並無多出來的紅茶與爆米花，疑似被偷加錢。

    PO 文者表示，瀏覽Google 評論，發現其他人也有類似遭遇，被話術誤導欺騙，在不知情的情況下遭到加價；他已向消保官提出申訴，不只是希望退款，而是想擁有安心休閒的環境，不要看個電影都得擔心被詐騙。

    台中市法制局表示，消費者如果出示電影含餐的票券，除非主動表示要增購食物，否則不用多付錢，業者應主動確認消費者是否有加購意願；本案明細有4 杯飲料、3 份爆米花，卻只有出2
    份餐，疑似有不完全給付與不當行銷之虞，消費者如有疑義可向業者反映，若仍無法解決，可向市府申訴。'
