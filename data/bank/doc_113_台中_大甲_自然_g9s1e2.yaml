  options:
  - label: A
    content: 有甲、乙兩車行駛在水平直線的公路上,若甲車的質量較大,則甲車的動能比乙車的動能大
  - label: B
    content: 有一垂直落下的雨滴,受到重力與空氣阻力影響,假設在一段期間內,雨滴(不考慮蒸發影響)維持等速下降一段距離,此期間水滴動能不變
  - label: C
    content: 質量不同的兩物體自同一高度作自由落體運動,落地前一瞬間,兩物具有相同的速率,但動能可能不同
  - label: D
    content: 將棒球從溜滑梯高處下滑,棒球下滑過程動能會增加,當棒球到平地滾動時,因為受到阻力影響,造成棒球的動能慢慢減少
