  section: 1
  number: 40
  type: single
  page: 3
  stem: 【金門拚觀光！古厝「轉型民宿」大改造】金門國家公園古厝重建堅持使用傳統技術及方法，保存了原有的色彩、形貌及文化風貌，並採用原用或相近建材。整修後的古厝成為著名的閩各式古厝民宿，包括水頭「定風波」、古寧頭「歇心苑」、瓊林「老閩宅」，以及山后「忘了飛羽居」等，都是旅客造訪金門「必住」的特色民宿，古樸的外觀下隱藏著現代化的室內裝潢，讓住客們既能感受住在傳統古厝的幽思情懷，又享受舒適住宿服務。請問上述情況這與下列何者最為相近？
  options:
  - label: A
    content: 都市建設更新與創新，強化文創軟實力
  - label: B
    content: 都市聚落由港口轉移到陸運交通的交會點
  - label: C
    content: 都市與鄰近都市市間連成一體，形成都會區
