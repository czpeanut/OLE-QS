- id: doc_113_屏東_明正_國文_g8s1e1_s6_2
  section: 6
  number: 2
  type: single
  page: 2
  stem: 「鄉愁是一杯茶，這是一個平庸的比喻，但我卻很喜歡。我不願把鄉愁說成酒，因為鄉愁沒酒那麼濃烈，鄉愁只能是在無人的暗夜的一縷清香，將遠離喧囂世界的我們一點一點溶解。鄉愁是茶，總在苦澀中帶著那麼一點甘甜；鄉愁是茶，但卻不會愈沖而愈淡。」這段文字點出「鄉愁」具有下列何種特質？
  options:
  - label: A
    content: 近鄉情怯
  - label: B
    content: 歷久彌新
  - label: C
    content: 與世隔絕
  - label: D
    content: 沉重苦澀。
- id: doc_113_屏東_明正_國文_g8s1e1_s6_3
  section: 6
  number: 3
  type: single
  page: 2
  stem: 「人生像一場旅行，從簡到繁，然後再反璞歸真。簡單到複雜，是前半生的閱歷；複雜到簡單，是後半生的修行。人老心先老，皺紋長在心上，比長在額上更讓人憔悴。半世浮沉，可貴的不是地位有多高，財富有多少，而是常懷赤子，永保童真。」此段文句的重點為何？
  options:
  - label: A
    content: 追求財富不易同時保有純真
  - label: B
    content: 外表往往比內心更容易老去
  - label: C
    content: 複雜的生活能獲得更多閱歷
  - label: D
    content: 保有純真之心更勝地位財富。
- id: doc_113_屏東_明正_國文_g8s1e1_s6_4
