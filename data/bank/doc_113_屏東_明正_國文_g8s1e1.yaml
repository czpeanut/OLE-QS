- id: doc_113_屏東_明正_國文_g8s1e1_s6_6
  section: 6
  number: 6
  type: single
  page: 2
  stem: 下列敘述，何者最合乎陳太丘友人的表現？
  options:
  - label: A
    content: 信口開河
  - label: B
    content: 循規蹈矩
  - label: C
    content: 一諾千金
  - label: D
    content: 言而無信。
  group_stem: '陳太丘與友期行，期日中。過中不至，太丘舍去。去後乃至。

    元方時年七歲，門外戲。客問元方：「尊君在不？」答曰：「待君久不至，已去。」友人便怒曰：「非人哉！與人期行，相委而去。」元方曰：「君與家君期日中，日中不至，則是無信；對子罵父，則是無禮。」友人慚，下車引之，元方入門不顧。                                                             （劉義慶
    陳元方答客問）'
  lesson_raw:
    title: 世說新語選
    basis: 世說新語選
