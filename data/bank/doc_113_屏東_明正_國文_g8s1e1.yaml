    娥娥紅粉妝，纖纖出素手。

    昔為倡家女，今為蕩子婦。

    蕩子行不歸，空床難獨守。        （古詩十九首之二）

    注釋：

    鬱鬱：茂盛的樣子。

    窗牖：窗戶。牖，音一ㄡˇ。'
  lesson_raw:
    title: 古詩十九首
    basis: 古詩十九首選
