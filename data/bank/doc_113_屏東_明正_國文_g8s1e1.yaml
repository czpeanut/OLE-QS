- id: doc_113_屏東_明正_國文_g8s1e1_s6_1
  section: 6
  number: 1
  type: single
  page: 2
  stem: 「毛巾廠長接到一個電話：『貴廠生產的毛巾上印的喜鵲圖案，真是栩栩如生啊！』廠長高興地說：『謝謝你的誇獎，何以見得呢？』『我用毛巾一擦臉，喜鵲馬上就飛到我臉上了。』」根據這段對話，可明確得知下列何者？
  options:
