- id: doc_113_屏東_明正_國文_g8s1e1_s6_8
  section: 6
  number: 8
  type: single
  page: 2
  stem: 閱讀完此詩內容，試問此詩意旨為何？
  options:
  - label: A
    content: 展現唐人照顧牡丹不遺餘力
  - label: B
    content: 突顯貧富差距極大的現象
  - label: C
    content: 讚賞農民質樸勤儉的作風
  - label: D
    content: 譴責當代人民奢靡成性的風氣。
  group_stem: '「帝城春欲暮，喧喧車馬度。共道牡丹時，相隨買花去。貴賤無常價，酬直看花數。灼灼百朵紅，戔戔五束素。上張幄幕庇，旁織籬笆護。水灑復泥封，移來色如故。家家習為俗，人人迷不悟。有一田舍翁，偶來買花處。低頭獨長嘆，此嘆無人諭。一叢深色花，十戶中人賦！」                        （白居易
    買花）

    （注釋：①帝城：即都城。②春欲暮：快到暮春的時候。③喧喧：嘈雜、喧鬧。④灼灼：花茂盛鮮明。⑤戔戔：積聚的樣子。⑥五束素：二十五匹帛。⑦幄：帳幕。⑧庇：遮蔽、掩蓋。⑨如故：像原來一樣。⑩俗：群眾的風尚習慣。⑪諭：明白、了解。⑫賦：稅收。）'
- id: doc_113_屏東_明正_國文_g8s1e1_s6_9
  section: 6
  number: 9
  type: single
  page: 2
  stem: 請問下列四個人的做法，何者最接近本實驗的「傳遞原則」？
  options:
  - label: A
    content: 小杰為了替即將應試同學們祈福，寄出「考試必勝」的電子郵件給身旁同學，並鼓勵大家轉寄
  - label: B
    content: 小宏想寫信給只聞其名的某作家，並將信寄給任職出版社的朋友，請他設法將信轉寄該作家
  - label: C
    content: 小山對小敏一見鍾情，僅知她家住屏東，於是將情書寄給不認識的郵政局長，請他指派下屬送達
  - label: D
    content: 小文想發結婚喜帖給許久不見的朋友小志，於是寄給小志的公司同事小亮，請他轉交。
  group_stem: '1970 年，哈佛大學社會關係實驗室設計一項傳遞實驗，傳遞的原則是：某甲要傳遞一封信給一個不相識的人----某乙，但甲只能把信寄給自己認識而又可能認識乙的某位朋友；這位朋友若與乙相識，就將信轉寄給乙，否則就再依照相同的原則將信寄出。經過婉轉曲折的旅程，信平安到達乙手中後，研究人員再統計中間經過的人數。

    結果發現，最短的旅程只經過兩個人就到達對方手裡，最長則需要十個人，平均從寄信到收信聯絡線是五到六個人。有些中途失蹤的信，根據調查，它往往只離收信者幾百步遠，住得近的人並不一定在我們的「相識圈」內。由於平均每兩個不相識的人要經過六次轉信，所以稱這個實驗為「六度分離」。從這個實驗可以知道，人與人之間都有一條看不見的線將彼此連接起來，所以世界真的很小。不論你身在何處，都有一根與人相連的牽引線，因此你並不孤單。                                                    改寫自呂政達〈心的實驗密碼〉'
- id: doc_113_屏東_明正_國文_g8s1e1_s6_10
  section: 6
  number: 10
  type: single
  page: 2
  stem: 根據文章，下列何者最適合做為這個實驗結果的注腳？
  options:
  - label: A
    content: 命運能將有共同信念的朋友連結在一起
  - label: B
    content: 人若擁有廣闊胸襟，即使遠方的人也能成為朋友
  - label: C
    content: 有些朋友未必是真朋友，反而陌生人可能在需要幫助時伸出援手
  - label: D
    content: 莫名的相互關係，能把一個個的生命連接在一起。
