    content: 王濟俊美挺拔，眾人稱羨，但只要衛玠出現，如同珠玉在旁，自認比不上：自慚形穢
  - label: B
    content: 王羲之坦腹在東邊床上，反而因不矯揉造作，受郗太尉讚賞，選為女婿：東床快婿
  - label: C
    content: 陳韙批評孔融小時聰慧敏捷，長大未必有成就：小時了了
  - label: D
    content: 左思在大街上漫遊，因容貌極為醜陋，路人紛紛向他投擲水果，水果多得將車子都塞滿：擲果盈車。
  lesson_raw:
    title: 世說新語
    basis: 題目寫了書名世說新語
