  group_stem: "古時候有一個廚師非常會宰牛，靈活的動作好像在跳舞一樣，輕輕鬆鬆地就把牛的骨、肉和皮分解完畢。梁惠王看到了，忍不住讚美他：｢我從沒看過這種技術，你真了不起！｣\n\
    \ 廚師放下刀子回答：｢大王，因為宰牛的原理比技術更重要。我剛開始學習宰牛的時候，眼睛看到的是牛的樣子； 練習三年之後，看到的不只是牛的外形；現在的話，只需要憑感覺宰牛就夠了，不用再靠眼睛去看。\n\
    \ 我是按照牛骨的位置，用刀從骨頭之間的空隙割開，再沿著骨頭把肉分出來。刀子不是用來切割皮肉，更不是用來砍大骨頭的。好的廚師每年必須換一把刀，是因為拿刀子直接割肉；普通的廚師每個月就得換一把刀，是因為拿刀子直接砍骨頭。我的這把刀已經用了十九年了，宰牛好幾千頭，刀子還是像剛磨好的一樣。\n\
    \ 骨頭之間的空隙，用薄薄的刀子伸進去，一下子就能分開骨、肉和皮。如果碰到不容易割開的地方，我只要小心地使用刀子，輕輕地動一下，骨、肉和皮就會像一堆泥土掉在地上了。我拿著刀子站起來，看看四周，才會滿意地把刀收起來。｣\
    \ —— 節錄 《莊子·養生主》"
