  stem: 下列關於本文的說明，何者正確？
  options:
  - label: A
    content: 「未窮青之技」是指還沒有學盡秦青的演唱技巧
  - label: B
    content: 「自謂盡之」是指自己的壽命已盡
  - label: C
    content: 「秦青弗止」是指秦青不讓他停止練習
  - label: D
    content: 「薛譚乃謝求反」是指薛譚感謝老師送行，他企求早日返家。
  group_stem: "（五）\n 薛譚學謳於秦青①，未窮②青之技，自謂③盡之，遂辭歸。秦青弗止，餞於郊衢④，撫節⑤悲歌，聲振林木，響遏⑥行雲。薛譚乃謝求反，終身不敢言歸。\
    \ ——《列子·湯問》\n【注釋】①薛譚學謳於秦青：薛譚向秦青學習唱歌。薛譚、秦青兩人皆為秦國著名的歌唱家。②窮，窮盡。③謂，認為、以為。④郊衢，城郊的大路。⑤撫節，擊節、打拍子。⑥遏，阻止。"
