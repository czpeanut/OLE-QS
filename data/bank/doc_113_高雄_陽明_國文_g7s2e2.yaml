  stem: 「老人們都說螢是腐草所化，以露水為食，因而牠弱質蕙心。」關於這句話的含義，下列說明何者正確？
  options:
  - label: A
    content: 螢是腐草所化，以露水為食，所以體質孱弱
  - label: B
    content: 螢是腐草所化，以露水為食，並非事實，作者卻信以為真
  - label: C
    content: 老一輩的人所說的話都是經驗之談，不可不信
  - label: D
    content: 我們必須像憐惜人那樣的體貼善待螢。
  group_stem: "（一）\n 很久沒有看到螢火蟲了。\n 那天深夜，專程到臺北一處荒郊看螢。時間已過子夜，沿著中央印製廠邊的小路，直入山徑。路窮之處，星月無輝，而水聲潺潺。忽然間，一隻螢火蟲從草叢裡飛了出來，接著兩隻、三隻……，儘管沒有群螢亂飛的盛況，但看著那翩翩舞姿，就足以動人風懷。\n\
    \ 小時候住在臺中近郊，有一條羊腸小徑，兩側高高低低叢生著含羞草，再遠處則是田疇和雜林，每當夏夜，總是螢火紛飛，有時候甚至還熱鬧成一片。牠會停在衣服上、頭髮間，雖然只是那一小點光亮，卻讓人彷彿有了一燈相照的感覺。杜甫寫螢，總喜歡強調流螢沾衣，因而有「簾疏巧入坐人衣」，「未足臨書卷，時能點客衣」之句，他所珍惜的，大概就是流螢沾衣、慰我寂寥的會心之感。\n\
    \ 因此，看螢讓人覺得溫暖。彷彿暗夜的漆黑裡，小小的山精水靈打著一盞迎迓的風燈，不管路是多麼的黑，也能讓人寬慰。\n 除了這種喜悅溫暖外，螢的舞姿也最讓人流連。牠隨著氣流舞動，時而舒緩如一個定點，時而急高急低的起伏，梁\
    \ 簡文帝的詩句：「騰空類星隕，拂木若花生。」前句說螢光的急舞，後句說螢火的繁華，只是現在的流螢已稀，再難有如此盛況了。\n 螢還可以與牠一同玩耍，可以慢慢的向牠靠近，伸出手掌，讓牠停在掌心，珍惜剎那的邂逅。或者像古代書本上所說的，閨秀人家用紈扇和螢共玩。紈扇戲螢，如同人螢共舞，那是古典的另一種曼妙。\n\
    \ 每個人都喜歡螢火蟲，牠嫻靜、舒緩，點綴著夏夜的童心與浪漫。以前螢多，入夜輒見此起彼落，與螢共玩，曾是美好回憶的一部分。老人們都說螢是腐草所化，以露水為食，因而牠弱質蕙心，想著這些說法，都覺得對螢應該格外的體貼善待。只是現今流螢日稀，都市的小孩少了螢火蟲的童年，那會是多麼大的一場遺憾。\n\
    \ 於是，我看螢去。走過沒有路燈的小山徑，牠打著小燈將我迎接，而我會晤到的，不僅是那閃爍著的點點星星，而且是一大片重新再來的童年！\n 南方朔＜今夜看螢去＞"
