  group_stem: "（四）\n 有醫者，自稱善外科。\n 一裨將①陣回，中流矢，深入膜②內，延使治。乃持并州③剪，剪去矢管，跪而請謝④。裨將曰：「簇⑤在膜內者，須亟⑥治。」\n\
    \ 醫曰：「此內科事，不意並責我⑦！」\n —— 江盈科 《雪濤小說》\n【注釋】①裨將，副將。②膜，此指肌肉。③并州：地名，在今山西省太原市一帶。以出產鋒利的剪刀聞名。④請謝：請求酬謝、酬賞。⑤簇：箭頭。⑥亟：緊急、急切。⑦不意並責我：沒料到這事也要求我做。不意，出乎意料之外。責，要求。"
