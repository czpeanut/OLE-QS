- id: doc_113_高雄_陽明_國文_g7s2e2_s2_22
  section: 2
  number: 22
  type: single
  page: 3
  stem: 「人生有很多選擇，同樣的，感情不是只有一次的錯誤，就會造成不可收拾的地步，任誰也很難保證自己的抉擇與認識能正確到什麼程度，因此在人生的過程中將有許多的抉擇機會，分手便是理所當然的囉，做一個感情的贏家，並不表示不可能失敗，而是懂得讓自己在失敗中主動醞釀出成熟的感情觀，並且不再讓自己重蹈覆轍。」這段文句告訴我們，如何才能做一個感情的贏家？
  options:
  - label: A
    content: 感情實在難以捉摸，因此應該避免去碰觸感情的事
  - label: B
    content: 在失敗中檢討，找出較成熟的方法來解決感情問題
  - label: C
    content: 在感情中要屢敗屢戰，多試幾次總能遇到一次成功
  - label: D
    content: 遇到感情抉擇的關鍵時，要多方請教專家學者的意見。
- id: doc_113_高雄_陽明_國文_g7s2e2_s2_23
  section: 2
  number: 23
  type: single
  page: 3
  stem: 「我慢慢地、慢慢地了解到，所謂父女母子一場，只不過意味著，你和他的緣分就是今生今世不斷地在目送他的背影漸行漸遠。你站立在小路的一端，看著他逐漸消失在小路轉彎的地方，而且，他用背影默默告訴你：不必追。」此句涵義為何？
  options:
  - label: A
    content: 對親人的離別或衰老，只能無奈感傷地接受
  - label: B
    content: 父母傑出成就，打擊孩子，使得親情疏離
  - label: C
    content: 幼時孩子追不上父母，長大捨棄父母
  - label: D
    content: 今生緣起緣盡，親情無形中早已斷絕。
