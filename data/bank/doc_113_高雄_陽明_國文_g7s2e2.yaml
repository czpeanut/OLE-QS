  group_stem: '宋 陳諫議家有劣馬，性暴，不可馭，蹄嚙傷人多矣。一日，諫議入廄，不見是馬，因詰① 僕：「彼馬何以不見？」僕言為陳堯咨售之賈人矣。堯咨者，陳諫議之子也。諫議遽召子，曰：「汝為貴臣，家中左右尚不能制，賈人安能蓄之？是移禍於人也！」急命人追賈人取馬，而償其直②。戒僕養之終老，時人稱陳諫議有古仁人之風。

