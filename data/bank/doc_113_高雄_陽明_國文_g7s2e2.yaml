  group_stem: '（三）

    筷子好幫手，吃飯好輕鬆

    那位舉箸提筆諸多不便的朱老爸說自己大約大去之期不遠矣，覺得自己快要……

    他肯定沒聽過筷子輔具跟握筆輔具

    筷子，是華人餐桌上重要的文化

    ＜背影＞一文中，朱自清的爸爸以「筷子跟筆已經拿不太起來了」、「肩膀痛到不行」這些事來表示自己距離死亡之日已經不遠…

    連筷子這麼輕都拿不起來，代表著身體機能走下坡、手變得無力且疼痛、飯吃得少、營養漸漸不夠，這些跡象或許就是朱老爸認為自己快要不行了的原因

    你家中是否也有筷子拿不好的家人呢？但是你知道有些「特別的筷子」可以幫助他們輕鬆進食嗎？

    特殊設計筷子的功能，檢視是否有符合需求

    ＃特殊握把設計，協助個案緊握筷子

    職能治療師評估每個人不同的狀況，提供筷子握把建議，合適的握把可以讓拿筷更輕鬆，也預防吃飯過程中掉筷子。

    ＃像鑷子一樣開合，夾食物更省力

    提供給食指跟拇指無法隨意活動的個案（例如燒燙傷、關節炎、脊髓損傷或是中風偏癱等使用者），以及手指握力弱的老人家，

    ＃筷子前端有紋理，夾取食物不易掉

    筷子的前端內側平坦增加接觸面積，紋理增加摩擦力，夾麵及豆子等滑溜食物更加容易。市面上（常見於百貨公司銀髮照護或餐具等區域）以及網路平台上有許多購買筷子輔具的管道，不難看到材質質感好，易清洗又美觀的商品，你可以跟職能治療師討論，挑選最適合自己需求的筷子，讓吃飯使用輔具也是一種時尚。

    #朱老爸需要輔助筷來幫助他吃飯順利

    攝取足夠的營養幫助身體組織修復

    #朱老爸的肩膀痛肯定穿衣也有問題

    使用穿衣桿手，可以不用抬高就能自己穿上衣服喔

    #朱老爸光是寫一封家書給朱自清肯定手痛到不行

    治療師可以幫忙調整寫字姿勢，調整成最少疼痛的角度，加上握筆輔具方便他寫信，可能朱爸爸的碎念會多寫很多張信紙吧！生活大小事，就找職能治療師。'
