  stem: 「今日復今日，今日何其少。今日又不為，此事何時了。人生百年幾今日，今日不為真可惜。若言姑待明朝至，明朝又有明朝事。為君聊賦今日詩，努力請從今日始。」（明文嘉＜今日詩＞）請問對於本詩的理解，下列說明何者正確？
