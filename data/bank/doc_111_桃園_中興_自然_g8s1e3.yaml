- id: doc_111_桃園_中興_自然_g8s1e3_s1_39
  section: 1
  number: 39
  type: single
  page: 4
  stem: 下列哪一組物質是同素異形體？
  options:
  - label: A
    content: 鑽石、$C_{60}$
  - label: B
    content: 一氧化碳、二氧化碳
  - label: C
    content: 鈉、鉀
  - label: D
    content: 鐵、不鏽鋼。
  group_stem: '問題39 ~ 40：

    許多存在於自然界的元素，不是只有單一型態，而是具有多樣的組成樣貌，例如：碳元素可組成鑽石、石墨、$C_{60}$以及奈米碳管。雖然彼此間的型態不同，但是組成物質都是相同元素，因此科學上稱之為同素異形體。


    天然鑽石來自於金剛石礦物，是自然界中已知硬度最大的物質，可以用來製造鑽探用的探頭和磨削工具；它在空氣中燃點約為850～1000℃。現代工業可在高溫高壓下生產金剛石，稱為合成金剛石。石墨具有層狀的平面結構，因其具有導電性，故可做為導電材料。天然石墨很容易互相剝離，形成薄薄的石墨片。若把石墨片剝離到只有一個碳原子厚度的單層，即可獲得奈米級導電材質石墨烯。$C_{60}$由六十個碳原子所組成，具有由20
    個六角形和12 個五角形所圍成的球狀結構，外形與足球相似，俗稱巴克球。奈米碳管是一種管狀的碳分子，直徑分布約0.8~2 奈米，幾萬根奈米碳管併起來也只有一根頭髮絲寬。研究發現奈米碳管未來在微機電、生物科技、醫療及電子等領域的應用極具潛力。'
