- id: doc_112_彰化_埤頭_社會_公民_g7s1e1_s3_29
  section: 3
  number: 29
  type: single
  page: 2
  stem: 事實上，早在 2016 年國立中山大學即設有「男女同棟分層」，2020 年國立台灣師範大學則創設「男女同層分房」，這些性別友善宿舍的概念都是出自「性別平等」、「接納跨性別的少數群體」的嘗試。若是放眼國際，事實上在歐美國家的部分大學裡，「男女混宿」的宿舍體制早已行之有年。請問：下列敘述何者錯誤？
  options:
  - label: A
    content: 國內大多數學校是以性別為特徵來區分學生住宿空間
  - label: B
    content: 台灣多數大學宿舍採男女區或分棟設計，容易加深性別歧視
  - label: C
    content: 設置性別友善宿舍的出發點是維護人性尊嚴
  - label: D
    content: 男女混宿的設計是希望尊重差異，透過教育去理解跨性別者，進一步達到尊重。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_112_彰化_埤頭_社會_公民_g7s1e1_s3_30
  section: 3
  number: 30
  type: single
  page: 2
  stem: 在 2023 年元旦以後，下列相關敘述何者正確？（註：完全行為能力人結婚不須法定代理人同意）
  options:
  - label: A
    content: 民法年滿 18 歲，結婚仍須得到法定代理人的同意
  - label: B
    content: 人民年滿 18 歲，就可以行使所有的參政權
  - label: C
    content: 人民年滿 18 歲但未滿 20 歲，僅能行使部分參政權
  - label: D
    content: 人民會先取得公民的資格，之後才能取得國民的資格。
  group_stem: ◎ 民法修正條文於 2023 年元旦施行，法律成年年齡下修至 18 歲。現在年滿 18 歲的我國國民，不但是完全行為能力人，也可以行使公民投票權。但憲法規定年滿
    20 歲才有選舉權，這些未滿 20 歲的「新成人」選舉時仍舊不能投票。因此許多民間團體呼籲修改憲法將選舉權的年齡降為 18 歲，統一投票的年齡標準。請問：
