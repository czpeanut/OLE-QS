  section: 1
  number: 27
  type: single
  page: 1
  stem: 日本民間曾流傳著這麼一首狂歌：：上喜撰（蒸汽船）喚醒太平夢，喝上四杯就難以入眠。(「上喜撰」是一種日本茶，與「蒸汽船」諧音 )就你所學，此首狂歌出現的背景是下列哪一個？
  options:
  - label: A
    content: 美國人的「黑船」出現在江戶灣，引發朝野騷動
  - label: B
    content: 葡萄牙人乘坐帆船遇到風暴，抵達九州
  - label: C
    content: 美國 B-29 轟炸機投擲原子彈於廣島
  - label: D
    content: 孝德天皇實行一系列社會政治改革。
- id: doc_113_新北_丹鳳_社會_歷史_g8s1e3_s1_28
  section: 1
  number: 28
  type: single
  page: 2
  stem: '「資料一：中華民國政府將 6 月 3 日定為不放假的禁菸節。

    資料二：中華人民共國政府對於他的作為，也給與正面評價，並視為民族英雄，將其事績列入教科書之中。

    資料三：英國倫敦的杜莎夫人蠟像館裡，最早展出的中國人蠟像是誰？答案是世界禁毒先驅者與他的夫人！」根據以上資料，可以得知此位中國人是下列哪一個？'
  options:
  - label: A
    content: 林則徐
  - label: B
    content: 徐則林
  - label: C
    content: 馬加爾尼
  - label: D
    content: 曾國藩。
- id: doc_113_新北_丹鳳_社會_歷史_g8s1e3_s1_29
  section: 1
  number: 29
  type: single
  page: 2
  stem: 清朝末年時局艱難，清政府曾經派遣朝廷重臣數人，分別前往東西洋各國考察政治，後一連串的下詔、選舉等作為，目的使大清帝國成為君主立憲政體的國家。關於此一改革運動的敘述，下列哪一個正確？
  options:
  - label: A
    content: 受到甲午戰爭失敗刺激而起
  - label: B
    content: 奕訢、曾國藩等人倡導
  - label: C
    content: 因慈禧太后反對而失敗
  - label: D
    content: 支持者對清政府失望，轉而支持革命運動。
