- id: doc_113_新北_丹鳳_社會_歷史_g8s1e3_s1_32
  section: 1
  number: 32
  type: single
  page: 2
  stem: 戲中的皇帝、太后應該是下列哪一組？
  options:
  - label: A
    content: 孝莊文太后、順治帝
  - label: B
    content: 孝莊文太皇太后、康熙帝
  - label: C
    content: 慈禧太后、光緒帝
  - label: D
    content: 隆裕太后、宣統帝。
  group_stem: '中國戲劇「那年花開月正圓」，以陝西省涇陽縣安吳堡吳氏家族的真人史實為背景，講述清末出身民間的陝西女首富吳周氏跌宕起伏的人生故事。其中一幕戲

    【趙白石：太后、皇上巡遊涇陽，點名吳家東院接駕。

    周瑩：接就接唄，不就是遠道而來的婆婆和大兄弟。

    趙白石：太后是你婆婆？皇帝是你兄弟？這件事辦得好，是天大的喜事，辦得不好，就是天大的禍事。】

    另一幕戲，太后宣吳周氏覲見

    【皇帝：聽說你少年守寡，吳家破敗你一手接掌，將吳家再次振興。

    太后：你說說，你掙下這份家業靠的是甚麼？

    周瑩：回太后的話，只靠一個字，變。

    皇帝、太后臉色大變。

    周瑩：回太后的話，天下已經變成世界，我們做生意的如果還固守成規，那就只有破敗一條路可走。唯有順應時勢，求新求變才能立足。】

    當你追著這齣戲劇情發展時，對應歷史課本所學。'
