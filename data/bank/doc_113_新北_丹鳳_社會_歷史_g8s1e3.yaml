  stem: 「中國共付各國賠償金四億五千萬兩銀，分三十九年付清，每年利息為四厘，由中國的關稅和鹽稅來償付；北京的大使館區內中國人不得居住，各國可以派兵保護；大沽炮台以及北京到天津之間的炮台一律拆毀。」請問以上是哪一條約的內容？
