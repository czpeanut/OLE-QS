  section: 1
  number: 25
  type: single
  page: 1
  stem: 「他歷經清末內憂外患，征戰南北，為清朝建立了一支西式海軍。晚清「中興四大名臣」之一，曾獲英國維多利亞女王授予皇家維多利亞勳章，與德國首相俾斯麥齊名。」請問以上敘述是指下列哪一位？
  options:
