- id: doc_113_新北_丹鳳_社會_歷史_g8s1e3_s1_18
  section: 1
  number: 18
  type: single
  page: 1
  stem: 《萬國公報》是晚清時期教會創辦的報紙中最具有影響的，也是存在時間最長的。對於晚清知識分子的思想啟蒙產生重要作用。從光緒皇帝到李鴻章等封疆大吏，再到康有為、梁啓超等維新派都是其讀者。下列哪一篇文章不會出自於此刊物？
  options:
  - label: A
    content: 聞英日聯盟事感書
  - label: B
    content: 留學生應注重國文
  - label: C
    content: 救民必立新法
  - label: D
    content: 耶穌示人以四海為兄弟。
- id: doc_113_新北_丹鳳_社會_歷史_g8s1e3_s1_19
  section: 1
  number: 19
  type: single
  page: 1
  stem: 1903 年金天翮(1873-1947)的《女界鐘》出版，這本書包含了晚清有關女性問題的所有重要觀點，並敲響了革命女權主義的鐘聲。下列哪一敘述不會出現在此書中？
  options:
  - label: A
    content: 宣揚男女平等
  - label: B
    content: 提倡女學
  - label: C
    content: 「女子無才便是德」
  - label: D
    content: 支持女性爭取個人權利。
- id: doc_113_新北_丹鳳_社會_歷史_g8s1e3_s1_20
  section: 1
  number: 20
  type: single
  page: 1
  stem: 以下為 1832 年，某位英國東印度公司廣州商館職員與中國福建官員對話。中國官員問道：「你們來自何方？是什麼國家？來做什麼生意？請你們立即離開。」英國職員：「Great
    Britain is my nation。」中國官員聽後輕蔑地笑道：「大英國？胡說！小英國的才是！」下列哪一敘述可以適當解釋以上對話顯示的意義？
  options:
  - label: A
    content: 中國外交理念只有藩屬朝貢國，沒有對等鄰國觀念
  - label: B
    content: 中國官員對於英文不熟悉，無法分辨大小
  - label: C
    content: 英國職員放大自己的地位，凸顯自己國家的重要性
  - label: D
    content: 英國外交理念沒有對等鄰國觀念。
- id: doc_113_新北_丹鳳_社會_歷史_g8s1e3_s1_21
  section: 1
  number: 21
  type: single
  page: 1
  stem: 日本於 2024 年 7 月，時隔 20 年發行新紙幣。紙幣的設計、以及新登場的 3 名肖像人物受到矚目。這次刷新的 1 萬圓、5 千圓與千元鈔，將分別採用日本資本主義之父澀澤榮一、津田塾大學創立人津田梅子和細菌學者北里柴三郎的肖像。日本財務省指出，日本紙鈔上採用的肖像，必須符合
    3 條件。包括擁有符合成為紙幣肖像的品格、功績受到民眾認可、以及能取得清晰照片，防止偽造。以你推斷這三位應該是出自下列哪一時期的成就人士？
  options:
  - label: A
    content: 戰國時代
  - label: B
    content: 江戶時代
  - label: C
    content: 明治維新時代
  - label: D
    content: 奈良時代
- id: doc_113_新北_丹鳳_社會_歷史_g8s1e3_s1_22
  section: 1
  number: 22
  type: single
  page: 1
  stem: 1850-1890 年代的上海報章雜誌上刊登的詩詞吟詠，出版業的城市旅遊手冊與圖文書，皆勾勒出滬城的文化變貌，在當時所呈現的文字或圖片應該不會出現下列哪一場景？
  options:
  - label: A
    content: 身穿洋裝的女子站在古剎前，擺姿勢照相
  - label: B
    content: 身穿西式制服，留著長辮子的巡警維持秩序
  - label: C
    content: 雙層電車上的乘客，聚精會神低頭滑手機
  - label: D
    content: 賓客吃著西餐，喝著咖啡，耳裡聽著滬劇。
- id: doc_113_新北_丹鳳_社會_歷史_g8s1e3_s1_23
  section: 1
  number: 23
  type: single
  page: 1
  stem: '以下三位人士，分別評論某一場戰爭對自己國家的影響。

    A：使我四萬萬國人，無貴無賤，如同在覆屋之下，漏舟之中；為奴隸，為牛馬，為犬羊，聽人驅使，聽人宰割。此四千年中二十朝未有之奇變。

    B：使我國從「被壓迫國」向「壓迫國」過渡的轉折點，是一次劃時代的戰爭，具有和第二次世界大戰相匹敵的意義。

    C：此戰爭後，情勢急轉直下，外來的兇猛壓力，跟蹤而至，片刻未弛，直可謂危急存亡之秋，我國毫無喘息苟延空間時間。根據他們的看法，此戰爭是指下列哪一場？'
  options:
  - label: A
    content: 鴉片戰爭
  - label: B
    content: 英法聯軍
  - label: C
    content: 甲午戰爭
  - label: D
    content: 八國聯軍。
- id: doc_113_新北_丹鳳_社會_歷史_g8s1e3_s1_24
  section: 1
  number: 24
  type: single
  page: 1
  stem: 晚清時期，內憂外患的中國危如累卵，清政府不得不通過改革以救亡圖存。從自強運動到立憲運動，然而最後仍未能挽救清朝的滅亡。關於這些改革運動的敘述，下列哪一個是錯誤的？
  options:
  - label: A
    content: 戊戌變法：改革主體缺乏領導權威
  - label: B
    content: 立憲運動：改革動機過於狹隘「保滿制漢」
  - label: C
    content: 自強運動：謀求制度層面的改革
  - label: D
    content: 改革缺乏兼顧各方利益，凝聚共識，導致反對勢眾。
