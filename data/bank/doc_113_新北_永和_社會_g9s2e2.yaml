  group_stem: '◎曉華於某次假期過後，寫了旅遊日記如下圖。請根據附圖內容回答相關問題。

    假期一開始，我先搭車到旁系血親家借住。我在那裡參加了有名的熱氣球節，親戚跟我說，這是每年地方政府都會舉辦的活動，當地居民也能因此賺取觀光收入。兩個禮拜後，我的直系血親來接我，並帶我去另一個姻親的家借住。姻親帶我去拜訪民選的區長，聽著區長訴說這些年的興建與規劃。假期的最後，我自己到另一個地方獨旅，恰巧碰到當地的市民代表正在選民服務。'
