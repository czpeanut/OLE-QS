  section: 1
  number: 1
  type: single
  page: 1
  stem: '外電報導: 緬甸2025 年3 月28 日發生芮氏規模7.7 強震，目前緬甸第一大城仰光水電通訊都沒問題，不過緬甸第二大城瓦城狀況相當嚴重，中國雲南和泰國廣泛地區均有震感，並導致泰國曼谷一座建設中高樓倒塌，上百人下落不明。此地震發生主要原因是緬甸位於四個板塊：歐亞板塊、印度板塊、巽他板塊和緬甸微板塊的交匯處，因為板塊滑動而造成淺層地震，而導致增加地表面的震動量。位於板塊交界處的地區，常常因為板塊錯動而產生地震，請問下列哪一個地理區因為遠離板塊交界處，因此較不常出現此種地震災害?'
  options:
  - label: A
    content: 南洋群島
  - label: B
    content: 青藏高原
  - label: C
    content: 阿拉伯高原
  - label: D
    content: 菲律賓群島。
