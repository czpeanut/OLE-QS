- id: doc_113_新北_永和_社會_g9s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 在印度德干高原區種植咖啡，據說是起源自十七世紀一位宗教修行者在前往聖地履行一生至少朝覲聖地義務時，於回程時所帶回的種子。後來在歐洲到印度殖民時，將該地生產的咖啡豆以海運方式載回殖民母國。但咖啡豆因為在長時間的航程中受到濕潤海風吹拂，形成獨特風味，頗受消費者喜愛。十九世紀後，隨著海運技術改進和新航道開通，航程大幅縮短，這些獨特風味不再，於是咖啡業者便在鄰近產地的馬拉巴海岸闢設風漬場，先讓溫暖潮濕季風吹拂咖啡豆數個月，增添其獨特風味，稱為「季風馬拉巴」咖啡。請問文中所提到的新航道是指?
  options:
  - label: A
    content: 麻六甲海峽
  - label: B
    content: 蘇伊士運河
  - label: C
    content: 巴拿馬運河
  - label: D
    content: 直布羅陀海峽。
  assets:
  - key: s1_9_f1
    kind: figure
    file: doc_113_新北_永和_社會_g9s2e2/s1_9_f1.png
  tags:
