    \ told him the empty chair was for her father. She said, “Two years ago, my dad\n\
    went mountain climbing by himself, but he never came back home. My mother believes\
    \ he will come home one day and keeps\npreparing a meal for him.” Rebecca showed\
    \ Steve her dad’s picture. Then, Steve heard a man coming up to them. It was the\
    \ man\nin the picture. Steve jumped up and ran out of the house quickly. Mr. Liu\
    \ asked what happened to Steve and then knew that Rebecca\ntold the story about\
    \ the empty chair again.\n\U0001F4D6 town 鎮 B & B 民宿（附床和早餐） surprised 感到驚訝的 empty\
