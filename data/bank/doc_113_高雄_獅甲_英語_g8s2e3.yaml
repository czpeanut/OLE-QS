  stem: What can we learn about the Little Blue Penguins in the reading?
  options:
  - label: A
    content: They live about sixteen to seventeen years.
  - label: B
    content: Baby Little Blue Penguins can feed themselves during the breeding season.
  - label: C
    content: Both（兩者）baby Little Blue Penguins and their parents are good swimmers.
  - label: D
    content: Female penguins are a little smaller than male ones.
  group_stem: "(48~50)\n Do you know the world’s smallest penguins? Here are some\
    \ facts about them.\n1. What is the smallest penguin in the world called?\nNew\
    \ Zealanders call the penguins the Little Blue Penguins. Australians call them\
    \ the Fairy Penguins. The name comes from\ntheir small body, and the color of\
    \ the plumage.\n2. How big is the smallest penguin?\nThey are around 33 centimeters\
    \ tall and only weigh about one kilogram. A male penguin is bigger than female.\n\
    3. How long can the smallest penguin live?\nThey can live 6 to 7 years.\n4. Breeding\n\
    Little Blue Penguins can give birth to 4 baby birds in every breeding season.\
    \ The parents are very busy during the breeding\nseason. They must fish for themselves\
    \ and feed their baby birds.\n5. Others\nPenguins’ predators (seals, sea lions,\
    \ whales, and sharks) all live in the water, so these birds feel much safer on\
    \ land. They are\nfriendly with people－for better or for worse.\n\U0001F4D6 penguin\
    \ 企鵝 plumage 羽毛 call 稱呼 fairy 仙子 male 雄性 female 雌性 breeding 繁殖 predator 捕食者\n\
    seal 海豹 whale 鯨魚 shark 鯊魚 land 陸地"
