  stem: （克漏字第36格）
  options:
  - label: A
    content: people from Fujian love to celebrate Muzu’s birthday
  - label: B
    content: many people in Taiwan believe in Mazu
  - label: C
    content: Dajia Zhenlan temple has more believers than before
  - label: D
    content: people can earn more money from the believers
  group_stem: "(36 ~ 39)\n There are different religious activities in Taiwan. Mazu\
    \ pilgrimage is sure to be the most popular and well-known. Mazu is the\nChinese\
    \ goddess of the sea. It is reported that Mazu believers are up to 140 million.\
    \ That is, (36) . So, it is not surprising to see\nmore than 850 Mazu temples\
    \ in Taiwan. Then how did Mazu pilgrimage come from?\n From 1800 to 1900, many\
    \ people from Fujian moved to Taiwan (37) crossing the dangerous Taiwan Strait\
    \ (台灣海峽). To\nthank Mazu for arriving Taiwan safe, these people hold the Mazu\
    \ pilgrimage, and it usually takes place in March or April (38)\nMazu’s birthday\
    \ in March of lunar calendar. The trip starts from Dajia, Taichung, Changhua,\
    \ Chiayi, to Yunlin, and then back to Dajia.\nBefore the Mazu pilgrimage, Dajia\
    \ Zhenlan temple will hold a firework show around Dajia River with hundreds of\
    \ thousands of\npeople watching. During the trip, Mazu believers carry the Mazu\
    \ statue inside a palanquin to different cities, hoping Mazu will bring\ngood\
    \ luck and keep the people safe. On the way, you can find warmth and kindness\
    \ from the Taiwanese because (39) . If you\nwant to have an in-depth trip in Taiwan,\
    \ Dajia Mazu pilgrimage is the best choice for you.\n\U0001F4D6 religious 宗教的\
    \ pilgrimage 繞境 goddess 女神\nbeliever 信徒 lunar calendar 農曆 firework 煙火\nstatue\
    \ 神像 palanquin 神轎 warmth 熱情\nkindness 友善 in-depth 深入詳盡的 choice 選擇"
