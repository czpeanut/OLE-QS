  group_stem: "(46~47)\n Hi, this is Hedwig from the most famous Harry Potter. First\
    \ of all, thanks for inviting me to talk about this. Owls were\nseldom for business.\
    \ However, the business sharply grew up after 2001, the year of the first Harry\
    \ Potter on. In 2008, the\nbusiness was almost 8 times more than before.\n Why?\
    \ Because they need owls to work for them? No. They wanted more. Some wanted to\
    \ look special with a beautiful\nowl; some even thought they could get magic from\
    \ the owls, like Harry Potter, the boy.\n Selling and buying us doesn’t bring\
    \ you magic, but it kills us. Baby owls are in the shops everywhere. They are\
    \ lovely, but\nthey would die soon without the care from their parents. The number\
    \ of us is getting lower and lower. Some kinds of us are even\nendangered.\n I\
    \ am here to ask for your help. Please leave magic in the movies. Please leave\
    \ owls in the nature. Your kindness will bring\npower!\n \U0001F4D6 invite 邀請\
    \ owl 貓頭鷹 business 商業 sharply 急速地 times 倍 bring 帶來 everywhere 到處\n endangered\
    \ 瀕臨絕種的 kindness 善良 power 力量"
