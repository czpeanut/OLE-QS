  section: 1
  number: 21
  type: single
  page: 2
  stem: 若將國道三號高速公路上的土城交流道(南下39.4 公里處)標為數線上的原點。樹林交流道(南下44.7 公里處)記為+5.3公里，則中和交流道(南下33.7
    公里處)記為多少公里？
  options:
  - label: A
    content: $-5.7$
  - label: B
    content: $-33.7$
  - label: C
    content: '+5.7'
  - label: D
    content: '+33.7'
  group_stem: '請閱讀以下內容，並回答第21、22 題


    國道高速公路的通行費，依照路程當中經過的門架來計費。例如若從圓山交流道上高速公路，至林口(文化一路)下高速公路，將經過五個門架，總金額為21.3 元計算方式如下，可參考附圖。


    1. 將每兩個門架之間的距離乘以1.2，取近似值(小數點第二位以後無條件捨去)。

