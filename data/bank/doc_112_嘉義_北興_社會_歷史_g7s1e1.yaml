    content: 排灣族。
  group_stem: '(四) 請閱讀以下短文並回答問題：

    1697年（康熙36年），郁永河奉命來臺採集硫磺，他帶領工人由府城安平沿岸北上。他觀察到此處少壯未婚的男子都居住在一間比較大的住屋，叫做「公廨」，這是村民們平常議事的場所。

    郁永河歷經艱苦後終於抵達目的地─現今的北投地區，他僱用當地原住民，讓原住民以獨木舟載運硫土到他的工寮換取布匹，再由漢人工人展開提煉硫磺工作。'
