- id: doc_113_高雄_陽明_社會_g7s1e3_s1_34
  section: 1
  number: 34
  type: single
  page: 5
  stem: '以下三則資料是學者對清代臺灣移民籍貫分布的看法。


    資料一：受清初禁令的影響，粵東的客家人比起福建的泉州人、漳州人晚來，由於西部平原的肥沃土地多數已被開墾，他們只好轉往丘陵和山區一帶開發謀生。

    資料二：在一些民變發生後，為了安全起見，人們會搬到和自己同鄉的人比較多的地方居住，形成了不同族群各自集中的村落。

    資料三：從明末到清初，泉州的工商業發展比較興盛，來台後多居住在沿海港口城鎮。而漳州人的社會主要以農業為主，多集中在平原一帶。客家人則來自山區，從明朝到清朝都以務農為生，也多定居在近山一帶的區域。


    請問下列哪一個選項敘述，完全沒有出現在以上三則資料的內容中？'
  options:
