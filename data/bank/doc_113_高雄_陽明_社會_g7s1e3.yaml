  group_stem: "把部落種回來！「部落蔬店」挺來義小農，小米、黑藜、月桃產品賣到欲罷不能\n    用一間蔬菜店慢慢把部落種回來！莫拉克風災重創高屏原鄉，屏東的義林、丹林、來義部落搬到新來義永久屋，為重新凝聚部落，新來義部落發展協會自\
    \ 2014 年起鼓勵族人回到原居地務農，以不用農藥的友善栽培方式，種植小米、紅藜、黑藜等傳統作物以及蔬菜，並開設粉專協助族人銷售。協會理事長 Gaku 表示：「想不到賣菜賣到欲罷不能，於是就開店了！」2020\
    \ 年 2 月，部落蔬店正式開張，客群集中於高屏一帶，不過新竹縣、台東縣的原鄉部落也會特別來購買，因爲原住民傳統食材採購管道少，但各地的原鄉部落仍有觀光及基本飲食需求，所以部落蔬店的小米、紅藜、黑藜、樹豆廣受歡迎，甚至還以月桃開發出沐浴產品。\n\
    \     義林、丹林及來義三部落均為排灣族，協會志工 Ljavaus 表示，排灣族在收成時，會把作物分為三份，分別給家人、部落以及部落以外的親友。過去部落長者務農收成後，回程路上都會沿路分享，協會希望延續這樣的分享精神，並讓部落族人可以增加收入，因此在\
    \ 2015 年成立粉專開始販售農產品。部落農戶的種植面積都不大，每戶平均頂多三分地，協會的四位幹部也分工經營粉專、擺攤、賣菜等事務。Gaku 表示，一開始賣菜是以勞動部的計劃經費聘請一位專職人員，隨著計畫期限慢慢告終，協會本來想結束，「想不到賣菜賣到欲罷不能，於是就開店了」。\n\
    \    Ubi 是部落蔬店合作已久的小農，她每天都親自照顧農園裡的十多種作物。「我啊，從小就跟著爸爸媽媽下田了」，雖然在外工作了數十年才返鄉，她沒有忘記每項作物的產季、特性。Ubi\
    \ 認為，務農的生活特別充實，心裡很踏實，務農也是懷念父母、祖父母的方式，而部落蔬店的出現更讓族人士氣大振，「開幕的時候，老人家都好高興，看到自己種的東西賣光光，好有成就感」。《上下游》到訪當天，竟有客人專程從高雄鳥松來買菜，詢問來客蔬店有何特別之處，對方回應：「菜很特別，吃起來很新鮮、很有活力，來買菜還能享受美景，感覺很好！」蔬店為部落帶來活力和收入，Ljavaus\
    \ 表示，族人都將蔬店視為公共空間，有東西要宅配、孩子上下學等待時間都會來蔬店，甚至遇到朋友就在店內聊天。蔬店也會舉辦體驗活動，部落 Ina 可以做菜給客人吃；月桃編織教學也讓更多人認識傳統技藝。\
    \               上下游記者 林怡均 2023.06.14"
