- id: doc_113_高雄_陽明_社會_g7s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 山坡地因地勢影響，引河水不易，常以農塘蓄水灌溉。農塘是以築壩或開挖的方式，將地表逕流蓄存後，作為提供農業用水的一種設施。近年來農委會為了改善農塘的功能，針對塘底淤積清除、滲漏問題處理及緩坡植草等項目，提供農民補助。上述補助所欲達到的效益，除了增加坡地農塘儲水量外，最可能包括下列何者？
  options:
  - label: A
    content: 滯留洪水以減緩下游洪患
  - label: B
    content: 降低地表水分蒸發及蒸散量
  - label: C
    content: 提高來自鄰近水庫的灌溉用水量
  - label: D
    content: 增加河口泥沙堆積防止海岸侵蝕。
