    content: 移民根據來台時間先後可能分布在不同地方
  - label: B
    content: 移民的居住分布受到原鄉的生活方式影響甚大
  - label: C
    content: 村落的形成與分類械鬥的頻繁有關
  - label: D
    content: 政府曾經頒布禁令間接影響到移民的居住分布
