  stem: "自花蓮港隨吳哨長至大坪林，突出生番五、六十人；勇丁及民人死者六人，受傷者一人。餘急率親兵馳救；比至，已逃入山矣。忿極，令各勇砍伐樹木，並派隊四棚於彼駐守......二十七之夜，生番又結隊撲我大樹坪小營。初聞槍聲，即令親兵銜枚疾走；將至營，又發號數聲及震之，小營軍心以固。番不知援兵至者若干，亦驚遁無蹤。二十八日，率親兵攜開花炮於對山林木蓊鬱之所，轟擊數四；以生番所在要殺，故憑空震撼之以奪其魄耳。\n\
