    content: 公益彩券只有「中獎」與「不中獎」二種情形，所以中獎的機率是 $\frac{1}{2}$
  - label: B
    content: 投擲一枚均勻硬幣，出現正面的機率是 $\frac{1}{2}$ ，所以投擲10 次會有5 次是正面
  - label: C
    content: 投擲一個長方體的盒子，各面朝上的機率都是 $\frac{1}{6}$
  - label: D
    content: 機率是介於0 和1 之間的數值
