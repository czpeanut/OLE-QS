  stem: 觸犯刑法規定應透過司法審判程序，接受刑罰的制裁，下列相關敘述何者正確？ (習作)
  options:
  - label: A
    content: 人民行為觸犯刑法時，必須經由法官宣判刑罰後，才能加以處罰
  - label: B
    content: 罰金是一種依法剝奪犯罪者財產的處罰，是不能單獨科處的刑罰
  - label: C
    content: 刑罰有主刑與從刑的分別，從刑必須附隨主刑才能科處，如沒收
  - label: D
    content: 無期徒刑、有期徒刑、拘役、罰金等，都是屬於剝奪自由的刑罰
  answer:
  - A
