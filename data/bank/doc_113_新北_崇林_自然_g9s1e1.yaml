  type: single
  page: 4
  stem: 野柳女王頭因外形如同移位凝視遠方的女王的頭部而得名，是臺灣北海岸野柳地質公園的代表景點。政府從1997 年開始記錄女王頭的頸圍，發現女王頭的頸圍每年以0.2～0.5
    公分不等的速度減少，預估再過10～15 年的時間就會斷頭，為此園區積極尋覓其他特色的岩石希望能取代女王頭成為新的代表景點。推測造成女王頭頸圍逐年減少最不可能的原因是下列哪一選項？
  options:
