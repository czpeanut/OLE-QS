  stem: '根據上文，國際特赦組織和「寫信馬拉松」的支持者一起改變了超過100人的生命，幫助他們不再受到酷刑、騷擾或不公正監禁所苦。從畫底線處可知，這些人權受侵害害者被剝奪了下列《世界人權宣言》中的哪些權利？

    甲、人人有權享有生命、自由與人身安全

    乙、任何人不容使為奴役；奴隸制度及奴隸販賣，不論出於何種方式，應予以禁止

    丙、任何人不得遭受酷刑或殘忍、不人道或有辱人格的待遇或處罰

    丁、成年男女，不受種族、國籍或宗教的任何限制，有權結婚和成立家庭

    戊、每個人都有受教育的權利'
