  stem: 學校老師為了讓學生了解世界各地的人權問題，透過「寫信馬拉松」活動，邀約學生一起寫明信片，聲援受迫害的個案之教學設計，最有效於培養下列哪一種現代公民應具備的基本德性？
  options:
  - label: A
    content: 遵守法律規範
  - label: B
    content: 捍衛公平正義
  - label: C
    content: 和平尊重包容
  - label: D
    content: 理性思考批判
  group_stem: "※「寫信馬拉松」是藉由文字的力量聲援世界各地人權受侵害的人們，這項活動起源於1991年國際特赦組織波蘭分會的一群社運人士，決定用不一樣的方式慶祝世界人權日，他們舉辦24小時不間斷為權利受到損害的人們寫信。此行動逐漸擴大並發展成全球性國際特赦組織運動的年度盛事，也是全球最大的人權行動。每年12月，全球各地的支持者寫下數百萬封信，共同聲援人權遭受侵害的人，一起對抗世界的不公不義。而這項全球寫信聲援的活動，其信件除了寄給人權受到侵害的人之外，還會寄給人權受害者的政府，以呼籲該政府做出改變。\n\
    \    根據國際特赦組織臺灣分會的統計資料顯示，「寫信馬拉松」從1991年2326封信，到2020年4500萬包含信件、推文、連署等各種形式的「信」從世界各地而來，支持著受苦的人們。多年來，他們一起改變了超過100人的生命，幫助他們不再受到酷刑、騷擾或不公正監禁所苦。\n\
    \    近年來，我國也有許多學校單位及教師積極推動國際人權運動，而「寫信馬拉松」也獲得眾多教師與學生的參與，透過寫信聲援的具體行動，實踐維護人權的普世價值。\n\
    \    寫一封信，可以改變一個人的生命，世界各地「寫信馬拉松」的支持者使用文字的力量，一起捍衛人權。身為學子的我們，也可藉由這個活動，付出自己的力量，實踐世界公民的責任。請問："
