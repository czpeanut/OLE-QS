  group_stem: "大多數的動物包含人，體細胞內多含有雙套染色體，一套來自父親、一套來自母親，此類生物通稱為二倍體。但是自然界中，卻有許多植物細胞為多倍體，也就是其染色體不只有雙套，有些是三套、四套或更多。市場上常見的香蕉就屬於三倍體，三倍體的植物種子會發育不良，所以香蕉中央小小黑點就是不孕的種子。\n\
    \    既然種子通常不孕，那麼香蕉如何繁殖呢？香蕉藉著地下莖進行營養器官繁殖，不僅可以產生新的後代，也讓香甜的優秀特性傳遞到新植株上。"
