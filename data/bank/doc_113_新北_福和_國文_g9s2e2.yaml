  group_stem: "初二日，飯後，雨始止。遂越潦攀嶺，溪石漸幽，二十里，暮抵天封寺。臥念晨上峰頂，以朗霽①為緣，蓋連日晚霽，並無曉晴。及五更夢中，聞明星滿天，喜不成寐。\n\
    \  初三日，晨起，果日光燁燁②決策向頂。上數里，至華頂庵；又三里，將近頂，為太白堂，俱無可觀。聞堂左下有黃經洞，乃從小徑。二里，俯見一突石，頗覺秀蔚。至則一髮僧結庵於前，恐風自洞來，以石甃③塞其門，大為嘆惋。復上至太白，循路登絕頂。荒草靡靡④，山高風冽，草上結霜高寸許，而四山回映，琪花玉樹⑤，玲瓏彌望。嶺角山花盛開，頂上反不吐色，蓋為高寒所勒⑥耳。（徐霞客\
    \ 遊天台山日記）\n【注釋】①霽：雨後或霜雪過後轉晴。②燁燁：光鮮明亮的樣子。燁，音ㄧㄝˋ。\n③甃：音ㄓㄡˋ，砌磚。④靡靡：草隨風倒伏相依的樣子。\n\
    ⑤琪花玉樹：古人指仙景中的花木，亦以形容霜雪中的景色。⑥勒：約束、限制。"
