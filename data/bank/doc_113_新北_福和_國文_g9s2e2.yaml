- id: doc_113_新北_福和_國文_g9s2e2_s1_31
  section: 1
  number: 31
  type: single
  page: 4
  stem: 根據本文，判斷火車車票「集票族」的方式為何？
  options:
  - label: A
    content: 熟悉車站名稱變革史
  - label: B
    content: 蒐集車票的吉祥語
  - label: C
    content: 熟知車票術語
  - label: D
    content: 認識每條鐵道路線。
  group_stem: "你若要問問一個鐵道迷是不是「集票族」，很簡單，只要試探一下他喜不喜歡「紅復興、橫自強、舊底紋、孩斷線、中孔、短去回、稅值票、指定票、百週年紀念……」，如果這人露出一副發亮的眼神，恨不得馬上掏出新臺幣去買這車票，對的，他就是火車票的收藏族。\n\
    \    事實上，這堆莫名其妙的術語，可是臺灣收集火車票的基本常識，也同時反映出大多數民眾喜好火車票的方向。比方說，後期的名片式復興號車票是淺綠色，但以前是跟莒光號一樣的紅紫色加一道紅線，所以車票收集者喜歡老式的「紅復興」車票；自強號推出時車票是橫式的但後來已經改為直式的，如果有「橫自強」，那表示這車票有點年紀了，值得收藏！「指定票」則是一種票面上印有多站名，販售時站員須把下段不用的站名剪去的一種稀有車票。至於「孩斷線」，是以前成人票下面會印的一條線，售票員沿它剪下便可把這票當孩童票用，所以有此稱呼。\n\
    \  這些年，「永保安康」帶起的購票熱潮，確實讓臺鐵大撈一「票」。而臺鐵在永保安康熱潮退燒之後，竟又搞出「榮華—富貴」這個堪稱臺鐵鐵道百年歷史上最荒唐之創舉。因為，臺鐵竟把內灣線上有著古老歷史地名的「南河車站」，更改名稱為「富貴車站」，只為了跟內灣線新設的「榮華站」能一起湊合成「榮華—富貴」賣吉祥車票！\n\
    \  雖說臺鐵曾掀起一股火車站名串接成吉祥語的風潮是事實，但類似「永保安康」的風潮在臺灣人一窩蜂的三分鐘熱度後，便漸漸銷聲匿跡。曾因永保安康大賺一「票」的臺鐵，儘管還想拿「榮華—富貴」再撈一次，但憑空造出的吉祥配對還是大敗市①，卻犧牲了老地名的歷史文化意義。\
    \                 （改寫自洪致文 台灣鐵道文化志）\n【注釋】①敗市：閩南語。滯銷。貨品不易銷售，導致價格慘跌。"
