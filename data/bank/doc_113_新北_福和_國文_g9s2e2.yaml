- id: doc_113_新北_福和_國文_g9s2e2_s2_46
  section: 2
  number: 46
  type: single
  page: 6
  stem: 根據郭進安排賓客座位的方式來看，下列何者最適合用來形容郭進的人格特質？
  options:
  - label: A
    content: 機智幽默
  - label: B
    content: 洞察世事
  - label: C
    content: 睚眥必報
  - label: D
    content: 疑神疑鬼。
  group_stem: "郭進有才略，累有戰功。嘗刺①邢州，今邢州城乃進所築。其厚六丈，至今堅完。\n鎧仗精巧，以至封貯②亦有法度。進於城北治第③，既成，聚族人賓客落之，下至土木\n\
    之工皆與。乃設諸工之席於東廡，群子之席於西廡④。人或曰：「諸子安可與工徒齒\n⑤？」進指諸工曰：「此造宅者。」指諸子曰：「此賣宅者，固宜坐造宅者下也。」進\n\
    死未幾，果為他人所有。今資政殿學士陳彥升宅，乃進舊第東南一隅也。\n【注釋】①刺：刺史。此指擔任刺史  ②封貯：標封貯存  ③治第：營造宅第   \n④廡：廳堂兩側的廂房\
    \   ⑤齒：並列                          （沈括 夢溪筆談）"
