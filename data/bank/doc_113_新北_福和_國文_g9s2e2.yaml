- id: doc_113_新北_福和_國文_g9s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 〈火車與熱氣球〉：「或許，熱氣球這種飛行器，是專門載著尚有童心的人，飛往其他交通工具都無法到達的王國，就像童年的夢。」關於這段文字的含義，下列敘述何者最恰當？
  options:
  - label: A
    content: 認為熱氣球基於負重的考量，僅適用於為兒童實現搭乘的夢想，然其飛行的高度與距離皆有限制。
  - label: B
    content: 說明熱氣球可擺脫空間的局限，不受地形或建物影響，遊賞的區域較任何交通工具都來得寬廣
  - label: C
    content: 說明熱氣球藉由空中飛行的方式，能夠迅速抵達目的地，其效率遠勝地面上的任何交通工具
  - label: D
    content: 認為乘坐熱氣球旅行，猶如童話中的浪漫想像，是懷抱赤子之心的人最美麗的夢想。
  lesson_raw:
    number: 第四課
    title: 火車與熱氣球
    basis: 題目引文出自〈火車與熱氣球〉，卷標【第四課】
- id: doc_113_新北_福和_國文_g9s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 「戰後，有錢人重返家園，留聲機播奏出〈甜蜜的家庭〉女高音版本，然而觀眾看的 卻是節子在山洞裡過著野人般生活時，苦中作樂的褪色畫面。」根據這段文字，下列
    何者是此段電影情節想表達的深意？
  options:
  - label: A
    content: 以戰後有錢人返家團聚，來對比節子生前失去雙親、無家可歸的處境，更加深悲情 的力量
  - label: B
    content: 藉由〈甜蜜的家庭〉一曲，表示山洞裡的生活雖苦，但兄妹倆仍相當快樂
  - label: C
    content: 藉由有錢人重返家園，暗示清太和節子也能再度享有天倫之樂
  - label: D
    content: 以褪色的畫面表現一切痛苦都已隨戰爭遠去，很快就能迎來幸福的生活。
  lesson_raw:
    number: 第五課
    basis: 卷標【第五課】
- id: doc_113_新北_福和_國文_g9s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 「人不是沒有呼吸心跳之後才死亡，當你再也不哭不笑的時候，你就已經死了……。」 關於這段文字的含義，下列說明何者正確？
  options:
  - label: A
    content: 當呼吸心跳停止，各種情緒將無從表達
  - label: B
    content: 情感未能適度宣洩，容易使人走向死路
  - label: C
    content: 缺乏情感的人，就如同行屍走肉一般
  - label: D
    content: 人的生理與心理，非常容易相互影響。
  lesson_raw:
    number: 第六課
    basis: 卷標【第六課】
- id: doc_113_新北_福和_國文_g9s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 〈賀伯吹來的教導〉：「在此一大宇長宙中，人只是滄海之一粟，風雨水火甚至草木瓦石，都是我們有機宇宙的一部分。它們的活力和威力，都會在適當的時機展現出來。看那滔滔洪水，看那滾動、崩裂的巨石，看那無形的風力，颱風讓大自然的一切活力如脫韁的野馬，揮灑得淋漓盡致，其場面之浩大，只能用神話語言去加以捕捉。」關於這段文字的含義，下列敘述何者正確？
  options:
  - label: A
    content: 風雨水火的無情肆虐對人類生命造成威脅，人唯有征服自然才能免於災厄
  - label: B
    content: 大自然的威力透過颱風展現出來時，足以使人類感受到自我的渺小
  - label: C
    content: 宇宙是充滿活力的，居處其間的人們應效法其精神，自強不息
  - label: D
    content: 颱風在神話中常化身為野馬，所到之處皆山崩地裂，場面十分浩大。
  lesson_raw:
    number: 自學三
    title: 賀伯吹來的教導
    basis: 題目引文出自〈賀伯吹來的教導〉，卷標【自學三】
- id: doc_113_新北_福和_國文_g9s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 〈錢是省出來的〉：「『蘇哩吧』第一次開口笑的時候，我興奮萬分，以為可以買新鞋， 但是大人只是到對面文具店買了一條強力膠，幫我把鞋底黏回去，壓在專門用來搥當歸的巨型柴砧底下，隔天膠全乾了，就能再穿幾個月。」根據這段文字，大人秉持的
    原則為何？
  options:
  - label: A
    content: 既然故意把東西弄壞，就必須自己想辦法處理
  - label: B
    content: 購買商品應該要貨比三家再入手，不可輕易揮霍
  - label: C
    content: 替換購物時須以實用性為主要考量，而非外形美醜
  - label: D
    content: 東西壞掉應該要盡力修復，而非直接以新品。
  lesson_raw:
    number: 自學二
    title: 錢是省出來的
    basis: 題目引文出自〈錢是省出來的〉，卷標【自學二】
- id: doc_113_新北_福和_國文_g9s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 「戰時物資缺乏，寄人籬下的兄妹，受盡嘲諷，出走後，三餐不繼，勉強下肚的是酸臭 野菜。」根據這段文字，兄妹倆最需要被滿足的應是下列「馬斯洛需求層次理論」的
    哪一階段？
  options:
  - label: A
    content: 生理需求：最基本、急迫的需求，例如食物、水、空氣、睡眠
  - label: B
    content: 安全需求：對人身安全、生活穩定等與自身安全感有關的需求
  - label: C
    content: 自我實現：實現理想、抱負，發揮個人潛能到最大程度
  - label: D
    content: 愛與歸屬：對家庭、友誼、愛情等和諧人際關係的需求。
  lesson_raw:
    number: 第五課
    basis: 卷標【第五課】
- id: doc_113_新北_福和_國文_g9s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 〈火車與熱氣球〉一文中以《西遊記》唐僧師徒西天取經說明的生命隱喻，下列何者最 能與之相呼應？
  options:
  - label: A
    content: 船錨不怕埋沒自己，當人們看不見它時，正是它在為人類服務的時候
  - label: B
    content: 你自己和你所有的一切，倘不拿出來貢獻於人世，僅僅一個人獨善其身，那實在是一種浪費
  - label: C
    content: 整個生命就是一場冒險，走得最遠的人，常是願意去做，並願意去冒險的人
  - label: D
    content: 幸運所需要的美德是節制，而逆境所需要的美德是堅忍。
  lesson_raw:
    number: 第四課
    title: 火車與熱氣球
    basis: 題目引文出自〈火車與熱氣球〉，卷標【第四課】
- id: doc_113_新北_福和_國文_g9s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 「我希望你們追求現實，但並不是以夢想為代價，而是作為你夢想的基礎。」（克里 斯多福．諾蘭）這句話的含義，可以與下列何者相呼應？
  options:
  - label: A
    content: 一邊瀏覽窗外倏忽變幻的景致，一邊啜飲甘醇的咖啡，搭車原來也可以是一種享受
  - label: B
    content: 真正有求道之心，不必買舟，無須備糧，一瓶一缽與虔敬的心就足夠了
  - label: C
    content: 「任重而道遠」是先哲為人生下的注腳，我們也許就是永遠在奔往理想的道路上吧
  - label: D
    content: 也許蘇軾正是以那些旅途中的困厄，來凸顯兄弟間的患難之情。
  lesson_raw:
    number: 第四課
    basis: 卷標【第四課】
- id: doc_113_新北_福和_國文_g9s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 「人生究竟是『備戰，才有和平』？抑或『修和，才能避戰』？」關於這句話，下列 說明何者正確？
  options:
  - label: A
    content: 從不同的角度思考達到和平應該採取的正確作為
  - label: B
    content: 說明憂患意識的重要，提醒大家「生於憂患，死於安樂」的重要
  - label: C
    content: 強調彼此講信用的互信基礎，才是達到和平的不二法門
  - label: D
    content: 不論「備戰」或「修和」，人類好戰的天性使和平淪為空談。
  lesson_raw:
    number: 第五課
    basis: 卷標【第五課】
- id: doc_113_新北_福和_國文_g9s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 片岡惠過年買了兩副春聯，卻被一陣怪風吹落地，兩副對聯對應的上下聯已經弄亂了，四句分別是「人在春風和氣中／八方丹鳳共朝陽／萬國金雞爭唱曉／家居白日青天下。」請依據文意和對聯格式判斷，下列何人的組合是對的？
  options:
  - label: A
    content: 磯貝悠馬：人在春風和氣中／家居白日青天下
  - label: B
    content: 岡島大河：家居白日青天下／萬國金雞爭唱曉
  - label: C
    content: 奧田愛美：八方丹鳳共朝陽／人在春風和氣中
  - label: D
    content: 木村正義：萬國金雞爭唱曉／八方丹鳳共朝陽。
- id: doc_113_新北_福和_國文_g9s2e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 伊莉娜老師在教授有關「節令」的對聯時，被潮田渚指出其中一副對聯說明有誤，請選出錯誤的選項？
  options:
  - label: A
    content: 五色雲開祥氣麗／三陽運轉惠風和→春節
  - label: B
    content: 華燈燦爛逢盛世／鑼鼓鏗鏘頌豐年→元宵節
  - label: C
    content: 艾旗招百福／蒲劍斬千邪→重陽節
  - label: D
    content: 天上一輪滿／人間萬里明→中秋節。
- id: doc_113_新北_福和_國文_g9s2e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: "雪村吾師(甲)膝前：\n       拜別 尊顏，忽已經年。昔日蒙您教誨，至今不曾忘懷，國文一科，尤高居全班之首，或可稍慰 遠懷。今學生將參加臺灣大學中文系的甄選，盼吾師能為學生寫一推荐信，學生定用心學習，必不負吾師之厚望。(乙)敬請\
    \  (丙)崇安\n                                            學生神崎有希子(丁)謹啟○月○日\n這是神崎有希子要拜託雪村老師幫她寫推荐甄試推荐函的書信，請問以上書信中畫雙線的詞語，何者正確？"
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
- id: doc_113_新北_福和_國文_g9s2e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 琦君：「煙雨樓，顧名思義是連綿不斷的煙和雨。」＜南湖煙雨＞在四大句型中與下列哪一個選項相同？
  options:
  - label: A
    content: 這座心靈上的小茶棚裡，永遠有朋友在等待我  (琦君 ＜茶與同情＞)
  - label: B
    content: 它雖是一處具有千餘年歷史的古蹟  (琦君＜故鄉的江心寺＞)
  - label: C
    content: 他老人家慈祥博大的胸懷  (琦君 ＜金門行＞)
  - label: D
    content: 桂花香裡啜蓮羹  (琦君 ＜西湖憶舊＞) 。
- id: doc_113_新北_福和_國文_g9s2e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 下列各組對答中，敬詞、謙詞以及禮貌語的運用，何者完全正確？
  options:
  - label: A
    content: 淺野學峯：請問芳名？今年貴庚？ 乙：小弟大谷翔平，正值而立之年
  - label: B
    content: 淺野學峯：鄙人技遜一籌，甘拜下風。 乙：在下承讓了，愧不敢當！
  - label: C
    content: 淺野學峯：今日聽到麾下高見，受益良多。乙：末學獻醜了，尚祈不吝賜教
  - label: D
    content: 淺野學峯：你如此勤學，將來必成大器。 乙：多謝夫子勉勵！弟子當加倍努力。
