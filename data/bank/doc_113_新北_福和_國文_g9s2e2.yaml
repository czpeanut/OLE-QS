  group_stem: "在日常生活中或工作領域中，和別人競爭優劣勝負，並非我想要的。這樣說好像在陳述無聊理論似的，不過正因為有各種人所以世界才能成立。別人有別人的價值觀，有配合那個的生活方式。我有我的價值觀，有配合這個的生活方式。這種差異在日常生活中就產生了細微的分歧，若干分歧的組合有時也會逐漸發展成巨大的誤解，甚至遭受到無故的責備。當然，被誤解或責備，絕對不是一件愉快的事。有時內心因此而受到深深的傷害。這是很難過的體驗。\n\
    \  不過隨著年齡的增長，會逐漸體認到，那樣的難過和受傷，在人生中某種程度也是必要的。試想起來，正因為和別人有差異，人才能確立所謂的自己，並繼續保持自立狀態。就我來說，因此才能繼續寫小說。唯有能在同一個風景中看出和別人不同的樣貌，感受到和他人不同的事情，選和別人不同的語言，才能繼續寫出特有的故事，並產生為數不少的人拿起來閱讀這樣的狀況。我是我，而不是別的什麼人，這對我是一種重要的資產。內心所受的傷痕，正是一個人在那樣的自立性中不得不向世界付出的當然代價。\n\
