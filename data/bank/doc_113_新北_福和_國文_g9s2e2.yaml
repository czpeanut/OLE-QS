  stem: 在古典詩歌中，詩人們或借柳寫景，或借柳抒情，或借柳喻人，或借柳諷時，或借柳感悟人生等。「柳」由柳枝、柳絮、柳葉等組成，構成具體可感的審美意象蘊含著多重的情意，給讀者無限的想像空間，下列何者是以柳表示離別之情？
  options:
  - label: A
    content: 莫笑農家臘酒渾，豐年留客足雞豚。山重水複疑無路，柳暗花明又一村
  - label: B
    content: 碧玉妝成一樹高，萬條垂下綠絲縧。不知細葉誰裁出，二月春風似剪刀
  - label: C
    content: 腸斷春江欲盡頭，杖藜徐步立芳洲。顛狂柳絮隨風去，輕薄桃花逐水流
  - label: D
    content: 誰家玉笛暗飛聲，散入春風滿洛城。此夜曲中聞折柳，何人不起故園情。
