  stem: 摹寫可分為五覺，在行文時可透過交錯表現的方式，使意象更活潑、更新奇，且更能體會文中意境。如:「昨夜的月色／至少有一瓣是甜的」以味覺印象表現視覺印象。下列句子也都使用感官交錯的摹寫方式，請判斷何者說明正確？
  options:
  - label: A
    content: 星星是靜靜的掛在空中，卻好像帶著聲音，是早晨的幽遠之鐘，也是靜夜中雄渾的鼓 聲，有著清脆的節奏與閃耀的聲息——以視覺印象描寫聽覺印象
  - label: B
    content: 我低下頭去喊自己的名字，井水也大聲應和，連那回聲都彷彿有淡淡的餘香——以嗅覺印象描寫聽覺印象
  - label: C
    content: 秋天的月亮像句酒話似的，傍晚時被二大爺隨手掛在樹上，有些酸，還有些甜。盪在風裡。——以視覺印象描寫味覺印象
  - label: D
    content: 柚樹的葉影在緩緩的移動，移上我臉頰的是幾朵擠碎的陽光，到這裡，它成了一種柔軟的撫摸——以視覺印象描寫觸覺印象。
