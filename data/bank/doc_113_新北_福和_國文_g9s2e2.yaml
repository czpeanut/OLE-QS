  stem: 下列句子，何者沒有錯別字？
  options:
  - label: A
    content: 他已經被屢次提醒，但還是輕忽殆慢，分明是明知故犯
  - label: B
    content: 矢田桃花雖然外貌如出水芙蓉，但勝氣凌人的態度還是人敬而遠之
  - label: C
    content: 一聽到下課鐘聲，學生們迫不急待的拿起書包衝回家
  - label: D
    content: 這群歹徒的行徑囂張狂妄真令人感到不齒。
