  stem: '余聽其說〈景陽岡武松打虎〉白文，與本傳大異。其描寫刻畫，微入毫髮，然又找截乾淨，並不嘮叨。哱夬聲①如巨鐘，說至筋節處，叱吒叫喊，洶洶崩屋。武松到店沽酒，店內無人，謈②地一吼，店中空缸空甓，皆甕甕有聲。閒中著色，細微至此。主人必屏息靜坐，傾耳聽之。彼方掉舌③，稍見下人呫嗶④耳語，聽者欠伸有倦色，輒不言，故不得強。

