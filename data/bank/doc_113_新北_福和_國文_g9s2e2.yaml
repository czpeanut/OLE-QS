  stem: '為颱風提供能量的是熱帶海洋的溫暖海水，大型積雨雲層透過溫暖海水補充了大量的水分，水分隨著上升氣流進入空中，不斷形成新的積雨雲，一邊緩慢地旋轉一邊北上。就像是一個吸收了海水能量後不斷壯大的怪物，規模越大，中心附近的氣壓越低，水蒸氣的吸收力越強，所產生的颱風風力就越發強勁。
