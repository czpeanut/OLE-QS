  stem: 下列何者是從本文文意中，無法得知的訊息？
  options:
  - label: A
    content: 從笄的質料上可看出地位高低
  - label: B
    content: 笄的上端多刻有雞、鳥等圖案
  - label: C
    content: 殷商時期的男子也會以笄簪髮
  - label: D
    content: 地位高的男子成年會戴上巾帽。
  group_stem: "從故宮博物院收藏的青玉女佩等飾物來看，這時的婦女，頭上都插有髮笄。按周代禮俗：女子年過十五，如已許嫁，便得舉行笄禮，以示成人及身有所屬；如年過二十而未許嫁，也得舉行笄禮，不過這種笄禮不及上述隆重，所用笄飾也不一樣。這種風俗，一直影響到後世，明\
    \ 清時期的開臉上頭（拔去臉上的汗毛，並梳上成人的髮髻）之俗，即由此發展而來。商代的髮笄實物在古墓中曾有出土，它的質料大多是獸骨，也有用象牙、寶玉製成的。在笄的上端，一般都刻有雞、鳥、鴛鴦或幾何紋圖樣。從文獻記載來看，這種髮飾不僅婦女使用，男子也可用來簪髮，且以笄的質料分別貴賤等差。\n\
    \                                            （中華服飾五千年 商代髮式和髮飾）"
- id: doc_113_新北_福和_國文_g9s2e2_s2_43
  section: 2
  number: 43
  type: single
  page: 6
  stem: 根據文章，下列何者最能合理推論綬草在福和校園現蹤的意義？
  options:
  - label: A
    content: 表示當地草地施肥充足，促進植物生長
  - label: B
    content: 顯示校園的自然環境具高度人為管理痕跡
  - label: C
    content: 顯示該校區具有良好的生態環境與生物多樣性
  - label: D
    content: 表示綬草的分布已逐漸普及，不再稀有。
  group_stem: "福和校園 綬草現蹤！珍稀原生蘭悄然綻放 見證生態地永續共生\n    春意盎然的時節，福和校園悄然迎來一位嬌小的訪客──綬草（Spiranthes\n\
    sinensis）。這種珍貴原生蘭科植物，近日於中庭廣場草地、香草園草坪、開心農場等處\n綻放小花，粉白色花朵螺旋排列，宛如綬帶般纏繞，是春季草地上最引人注目的生態亮\n\
    點，也為福和國中校園生物多樣性再添一筆亮麗風采。綬草，又名「清明草」，是台灣花\n形最小的原生蘭花，其花期多在清明前後，因而得名。它對環境條件要求極高，須仰賴無\n\
    農藥污染的草地、共生菌根菌及土壤微生物等自然因素才能生長茁壯，因此被視為典型的\n生態指標物種（indicator species），是一種能反映當地生態環境健康程度的代表植物。\n\
    綬草的文化脈絡可追溯至中國周代，《詩經．陳風》中曾以綬草比喻世事無常。\n    除了觀賞價值，綬草亦具藥用潛力，據《中華本草》記載，具益氣養陰、清熱解毒\n\
    等療效，現代醫學更指出所含成分，具抗腫瘤等生物活性，展現未來生藥開發的潛力。\n    雖然綬草在全球分布廣泛，但由於其對生長條件的敏感性，在人類活動密集或農藥\n\
    使用普遍的區域難以繁衍，導致其生存受到威脅。根據《瀕危野生動植物物種國際貿易\n公約》（CITES），綬草目前被列入附錄Ⅱ物種，雖未立即瀕危，仍須嚴格監管與保護，例\n\
    如關渡自然公園已將盜採綬草行為，列為明文禁止之項目。\n   同學們在校園看到它時，請注意您的腳步，不要踐踏了它們。記得，蹲下身子，細心\n觀察呵護我們的「嬌客」喔!"
