  stem: 「始欲識郎時，兩心望如一。理絲入殘機，何悟不成匹」詩中以「絲」作「思」的相關語，不成「匹」，也是指人兒不能成雙。下列「」內的字，何者不是利用雙關製造雙重意義？
  options:
