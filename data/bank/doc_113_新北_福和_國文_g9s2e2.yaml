  stem: 根據本文敘述，下列何者最符合王羲之《蘭亭集序》真跡的歷史與書法特性？
  options:
  - label: A
    content: 《蘭亭集序》雖為草稿，卻已雕刻成碑刻，並以嚴謹結構著稱。
  - label: B
    content: 《蘭亭集序》書法風格受到唐太宗推崇，將其作為官定的書法典範加以複製。
  - label: C
    content: 《蘭亭集序》真跡雖已不存，但其行草美學精神成為書法史的重要轉折。
  - label: D
    content: 《蘭亭集序》保存在故宮博物院，因其結構嚴整，被視為楷書範例。
  group_stem: "「蘭亭」原作真跡看不見了，一千四百年來，「複製」代替了真跡，難以想像真跡有多美，美到使一代君王唐太宗迷戀至此。\n  漢字書法有許多工整規矩的作品，漢代被推崇為隸書典範的「禮器」、「曹全」、「乙瑛」、「史晨」，也都是間架結構嚴謹的碑刻書法。然而東晉\
    \ 王羲之開創的「帖學」，卻是以毛筆行走於絹帛上的行草。\n  「行草」像在「立正」的緊張書法之中，找到了一種可以放鬆的「稍息」。\n  「蘭亭」是一篇還沒有謄寫恭正的「草稿」，因為是草稿，保留了最初書寫的隨興、自在、心情的自由節奏，連思維過程的「塗」「改」墨漬筆痕，也一併成為書寫節奏的跌宕變化，可以閱讀原創者當下不經修飾的一種即興美學。\n\
    \  「蘭亭」真跡不在人世了，但是「蘭亭」確立了漢字書法「行草」美學的本質—追求原創當下的即興之美，保留創作者最飽滿也最不修飾、最不做作的原始情緒。\n \
    \ 「行草」隱藏著對典範楷模的抗拒，「行草」隱藏著對規矩工整的叛逆，「行草」在充分認知了楷模規矩之後，卻大膽遊走於主流體制之外，筆隨心行，「心事」比「技巧」重要。「行草」擺脫了形式的限制拘束，更嚮往於完成簡單真實的自己。\n\
    \  「行草」其實是不能「複製」的。「蘭亭」陪葬了昭陵，也許只是留下了一個嘲諷又感傷的荒謬故事，令後人哭笑不得吧！   （節錄自蔣勳 漢字書法之美：舞動行草）"
