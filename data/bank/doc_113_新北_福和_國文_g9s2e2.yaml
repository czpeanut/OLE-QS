  stem: '南方多沒人①，日與水居也，七歲而能涉，十歲而能浮，十五而能沒矣。夫沒者豈苟然②哉？必將有得於水之道者。日與水居，則十五而得其道。生不識水，則雖壯，見舟而畏之。故北方之勇者，問於沒人，而求其所以沒，以其言試之河，未有不溺者也。故凡不學而務求道，北方之學沒者也。                                 （蘇軾
    ＜日喻＞）

    【注釋】①沒人：能潛水的人。②苟然：隨隨便便就會這樣

    本文主要說明何種道理？'
  options:
