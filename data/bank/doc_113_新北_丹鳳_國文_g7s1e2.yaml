  stem: 語言給予我們想像的能力，可以擁有更好、更偉大、更能改變世界的想法，而且最重要的是，讓我們保留自己的想法—不只留在自己腦中，也能留在其他人的心中。有了語言，資訊可以用音速傳播；若你用的是手語，就是以光速傳播了。分享想法能形成社群，而社群是文化和文明的基礎，因此我們可以得到第一個文明廢知識：「語言是傳播所有事物的技術，而你早已無償取得。」關於上列文字敘述，下列選項何者為非？
