    職場與商場上，不也是如此。生命原本就是一個選擇，當獅子未必好，當長頸鹿未必差，只要一切恰如其分。想擁有權力、想主導棋局的獅子，能力就要相當，也要 願意承擔。人生最可怕的是，錯置。所謂錯置，就是搞不清楚自己是誰或想成為什麼樣的人，沒有獅子的能力、地位，卻想過獅子的生活。\n\
    獅子有獅子的得失，何必羨慕牠一天可睡十五小時？有人想當叢林之王，碰到獵物（問題）卻搞不定。相對的，我也看過很多平凡但可愛的小人物，認分與踏實，當一隻長頸鹿就像長頸鹿。\n\
    美國洛杉磯大學的科學家研究發現，飲食和環境決定哺乳動物的睡眠需求量。\n我因此好奇，後天環境如果變遷，行為能有多大改變？從非洲回來後，這問題一直在我腦海中縈繞。我好奇，台北動物園的長頸鹿，不再有獅子時時獵殺，牠們的睡眠還會只有三分鐘嗎，牠們還是維持站立睡覺的「祖訓」嗎？是的！長頸鹿從非洲搬到了台北，還是只睡幾分鐘。不過，有時候會趴下來睡。"
