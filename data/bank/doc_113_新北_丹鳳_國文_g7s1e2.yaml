- id: doc_113_新北_丹鳳_國文_g7s1e2_s5_27
  section: 5
  number: 27
  type: single
  page: 5
  stem: 根據本文，下列敘述何者為非？
  options:
  - label: A
    content: 海昏侯墓所出土的竹簡，最為大眾所關注的是《論語》
  - label: B
    content: 海昏侯墓出土的《詩經》的價值在於他是最早的《詩經》版本，極富學術價值
  - label: C
    content: 海昏侯墓出土的竹簡應該是最大程度地保存漢中葉改動經書前的原貌
  - label: D
    content: 海昏侯墓出土的青銅蒸餾器，確實能夠蒸餾酒。
  group_stem: "題組（四）27~28\n南昌 漢代海昏侯墓出土的大型青銅蒸餾器一直受到考古界的關注。近日，鄭州大學歷史文化遺產保護研究中心研究團隊在前期研究基礎上，首次對青銅蒸餾器進行仿制和模擬實驗，證實其確有蒸餾酒的功用，這將中國蒸餾酒的技術實現可能性上推千年。\n\
    \n海昏侯 劉賀墓出土了5200餘枚簡牘，裡面有《論語》、《詩經》、《禮記》等儒家經典的古代典籍失傳版本或較早版本，這些具有極高學術價值的文物究竟什麼時候可以與大眾見面呢？近日，歷史學博士、南昌漢代\
    \ 海昏侯國遺址管理局局長、南昌 漢代 海昏侯國遺址博物館館長彭明瀚攜新書《吉金海昏：劉賀墓園出土青銅器》，受邀登上南昌市圖書館「豫章講壇」，暢談海昏侯墓出土文物背後的故事。在接受本報全媒體記者採訪時，彭明瀚透露：「也許在明年，我們會展出一部分修復完成的竹簡。」\n\
    \n  海昏侯墓出土的《論語》，今年9月被編進了2024年秋季義務教育教材，因為它是失傳1800多年的《齊論語》版本。在「豫章講壇」上，彭明瀚告訴讀者，海昏侯墓的竹簡文物，目前登記號已經達到5279枚，每一枚竹簡上都有20多個字。他認為，在這些出土的珍貴的海昏侯墓竹簡里，雖然大家現在關心和聚焦的是《論語》，「但價值最高的其實是《詩經》，因為《詩經》的竹簡量很大，有1000多枚」。\n\
    \n劉賀所處的時代是西漢中後期，他去世後沒多久，《論語》《詩經》等典籍均被統一進行了改動，有刪減也可能有增加，改動後的版本就是我們現在所能讀到的經書版本。彭明瀚表示，「但劉賀這套《詩經》竹簡，所記載的應該是最接近那次改動經書活動之前的文獻原貌，所以它的價值是巨大的」。"
