- id: doc_113_新北_丹鳳_國文_g7s1e2_s5_21
  section: 5
  number: 21
  type: single
  page: 4
  stem: 下列何者最符合本文「錯置」的意義？
  options:
  - label: A
    content: 性格害羞的小美希望增強自信，主動爭取大型舞台主持的機會
  - label: B
    content: 小文英文能力不佳，但仍努力報名補習班準備多益考試
  - label: C
    content: 阿明擔任主管後，積極參加領導力課程以提升管理技能
  - label: D
    content: 對管理毫無經驗的小張，在入職一個月就要求升任部門主管。
  group_stem: "題組(二)  21～23 題\n〈貪睡的長頸鹿〉節錄  王文靜\n    在物競天擇的萬年演化，在獅子、豹子環伺的非洲叢林裡，敢大搖大擺睡覺的長頸鹿應該都變成獅子的盤中飧。根據研究，長頸鹿的睡眠時間是所有哺乳動物中最短，一天平均睡眠總時間低於兩小時。牠們通常站著打瞌睡，長長的脖子往下垂，就是牠們最奢侈的休息。要活下來，就必須保持高度警覺。相較之下，獅子，每天\
    \ 能睡十五至二十個小時，三分之二的時間都在睡覺，沒人能拿牠如何。\n這就是叢林法則。如果你無法成為叢林之王，就要是永不鬆懈的長頸鹿。很嚴酷，你只有三分鐘睡眠，完全沒有貪睡的權利，貪睡的下場，就是出局。在大自然，不只長頸鹿，草食性動物的平均睡眠時間都是比肉食性動物短。\n\
    職場與商場上，不也是如此。生命原本就是一個選擇，當獅子未必好，當長頸鹿未必差，只要一切恰如其分。想擁有權力、想主導棋局的獅子，能力就要相當，也要 願意承擔。人生最可怕的是，錯置。所謂錯置，就是搞不清楚自己是誰或想成為什麼樣的人，沒有獅子的能力、地位，卻想過獅子的生活。\n\
    獅子有獅子的得失，何必羨慕牠一天可睡十五小時？有人想當叢林之王，碰到獵物（問題）卻搞不定。相對的，我也看過很多平凡但可愛的小人物，認分與踏實，當一隻長頸鹿就像長頸鹿。\n\
    美國洛杉磯大學的科學家研究發現，飲食和環境決定哺乳動物的睡眠需求量。\n我因此好奇，後天環境如果變遷，行為能有多大改變？從非洲回來後，這問題一直在我腦海中縈繞。我好奇，台北動物園的長頸鹿，不再有獅子時時獵殺，牠們的睡眠還會只有三分鐘嗎，牠們還是維持站立睡覺的「祖訓」嗎？是的！長頸鹿從非洲搬到了台北，還是只睡幾分鐘。不過，有時候會趴下來睡。"
