    「天神叫道：『○○○，值得讚美的人君，諸神的虔敬者，你的責任應當使正義廣被四方，你應當除滅邪惡，你應當教化萬民，你當增進萬民福祉。○，你使巴比倫繁榮昌盛。』…」法典正文共有
    282 條，試舉其中幾條為例：


    (1)丈夫去世後，其妻可與子女共同繼承財產。

    (2)丈夫經常外出，對其妻凌辱備至，妻子可以取回嫁妝回到娘家。

    (3)妻子久病不起，丈夫可以另娶，但是應對病妻不離不棄，供養終生。

    (4)若兒子毆打父親，則法官應該砍掉他的手。

    (5)若自由民損毀任何自由民之子之眼，則應毀其眼。

    (6)若貴族毀傷另一個貴族的眼睛，則法官應該毀傷他的眼睛。'
