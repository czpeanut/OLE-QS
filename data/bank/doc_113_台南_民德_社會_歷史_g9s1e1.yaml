  stem: 《吉爾伽美什史詩》是來自美索不達米亞的文學作品﹐現今保存於大英博物館。由英國考古學家於1849 年，在古都尼尼微發現了亞述國王的圖書館，陸續開挖出大量的泥版，解讀後發現泥版中主要講述了蘇美時代英雄吉爾伽美什的傳說故事。請問：此泥版最有可能於何處出土？
  options:
  - label: A
    content: 埃及
  - label: B
    content: 雅典
  - label: C
    content: 兩河流域
  - label: D
    content: 特洛伊城。
