  section: 1
  number: 17
  type: single
  page: 2
  stem: 荷馬史詩是古希臘重要的文化遺產，其中有一篇內容如下：居住在奧林帕斯山的希臘眾神，將要舉辦海洋女神賽蒂斯下嫁凡人英雄佩柳斯的婚禮。婚宴那天，希臘眾神都接到了喜帖，卻只有搗亂女神厄里斯沒有被邀請。憤怒的厄里斯，在眾神酒酣耳熱之際，將一顆寫著「獻給最美麗的女神」的金蘋果，丟進婚禮現場，立刻引來了眾女神的紛搶爭奪、互不相讓。從這篇故事中，可知希臘眾神具有何種特色？
  options:
  - label: A
    content: 都住在奧林帕斯山，和諧與快樂的相處
  - label: B
    content: 與凡人沒有差別，嚮往舉行盛大的婚禮
  - label: C
    content: 具有突出的個性，擁有喜怒哀樂的情感
  - label: D
    content: 都聽從厄里斯所言，爭奪金蘋果的榮耀。
