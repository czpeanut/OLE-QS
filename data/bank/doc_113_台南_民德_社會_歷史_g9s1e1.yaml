  type: single
  page: 1
  stem: 當今全球最重要的國際體育賽事莫屬四年一度的奧林匹克運動會，最早的雛形從西元前8 世紀的古希臘開始。比賽項目以田徑運動賽跑為主，後又逐漸增加了摔跤、拳擊、角鬥、賽車、賽馬、跳遠、擲標槍、擲鐵餅等等的運動項目，冠軍獎品是一頂橄欖枝編成的桂冠。請問：請問古代奧運會原本是為了何種緣故而舉辦？
  options:
  - label: A
    content: 為了取悅國王與貴族
  - label: B
    content: 為了增強國民體能
  - label: C
    content: 為了增進國際的友好
  - label: D
    content: 為了取悅希臘眾神。
- id: doc_113_台南_民德_社會_歷史_g9s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: '阿德在書上看到某部歷史文獻的摘錄如附圖。請問：創造此文獻的民族，其居住的地理環境有何特色？


    | 若一個平民打瞎另一個平民的眼睛，前者的眼睛應該被打瞎。若一個平民打瞎一個奴隸的眼睛或打斷他的頭骨，平民應該賠償此奴隸他的身價的一半。 |'
  options:
  - label: A
    content: 位於北非沙漠地帶，尼羅河每年都會定期氾濫帶來肥沃的淤泥
  - label: B
    content: 分布在兩河流域延伸到地中海被稱為「肥沃月彎」的地區
  - label: C
    content: 分布在義大利中部由臺伯河沖積成的平原地帶
  - label: D
    content: 由於此地多山且地形崎嶇，故發展出許多獨立的小城邦。
