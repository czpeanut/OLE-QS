  type: single
  page: 1
  stem: 古埃及人認為有許多神存在於世且這些神能控制世界，宗教實踐以法老為中心，他們是人民和眾神的中介，因此會花很大資源來建設神廟和舉行祭祀。以下古埃及人的宗教的敘述，何者正確？
  options:
  - label: A
    content: 會火化屍體將骨灰放入金字塔
  - label: B
    content: 古埃及人相信法老就是太陽神
  - label: C
    content: 法老以尼羅河神之子的身分治理人間
  - label: D
    content: 古埃及人相信死後會經過審判。
