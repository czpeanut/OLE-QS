  group_stem: 'How to check online information?

    The SIFT method helps you run a fact check in four steps.


    Every day, millions of new posts and videos are    37    to the Internet. Although
    the web is a good source for getting information, a lot of what’s posted online
    can be fake. Finding the truth can be difficult, but there is a method(方法) that
    can help you. It’s the SIFT method. SIFT stands for “stop, investigate, find,
    and trace.”


    Here’s how you can use this method when you read something online. First, Stop
    and take a moment to think before you share it. Next, Investigate the website
    or the source of the information itself. Check if it’s a respected newspaper or
    news website, for example, or just someone’s personal(個人的) web page? Then, Find
    out if other respected websites are reporting the same information. If not, it
    might be fake. Finally, Trace any sentences or studies in the information back
    to their original(最初的、原始的) source to make sure they’re being used right.


    Never share the information until it has passed the four steps. By taking these
    simple but important steps, you’ll help protect yourself and others from falling
    for half-truth or fake news.'
