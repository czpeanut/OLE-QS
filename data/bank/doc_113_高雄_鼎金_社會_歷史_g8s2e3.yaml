- id: doc_113_高雄_鼎金_社會_歷史_g8s2e3_s1_36
  section: 1
  number: 36
  type: single
  page: 2
  stem: 冷戰期間，民主陣營與共產陣營針鋒相對，全球處於一種「低盪時期」，雖然有小規模的地區衝突，但是沒有演變成大規模的戰爭。請問：下列有關冷戰的敘述，何者有誤？
  options:
  - label: A
    content: 冷戰開始於第二次世界大戰結束後
  - label: B
    content: 民主陣營以美國為首，共產陣營以蘇聯為首
  - label: C
    content: 兩大陣營相互對峙也相互抑制
  - label: D
    content: 韓戰結束後，冷戰隨之結束。
- id: doc_113_高雄_鼎金_社會_歷史_g8s2e3_s1_37
  section: 1
  number: 37
  type: single
  page: 2
  stem: 福氣國中為了讓學生更加了解戰後國際局勢演變，特地規畫了一系列電影欣賞活動，其宣傳海報如附圖。請問：海報中的○○最有可能是下列何者？
  options:
  - label: A
    content: 北伐
  - label: B
    content: 抗日
  - label: C
    content: 冷戰
  - label: D
    content: 二次大戰。
