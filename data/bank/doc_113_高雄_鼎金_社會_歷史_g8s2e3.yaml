- id: doc_113_高雄_鼎金_社會_歷史_g8s2e3_s1_39
  section: 1
  number: 39
  type: single
  page: 2
  stem: 附圖是二戰後東亞某區域衝突的形勢圖，深色部分是衝突所在地。這裡在歷史上曾是中國的保護國，清帝國時期因中國對外戰爭失利而淪為歐洲國家的殖民地。二戰後，當地擺脫殖民統治，在追求國家統一及受國際局勢的對立發展而爆發戰爭。請問：關於這場區域衝突，下列敘述何者正確？
  options:
  - label: A
    content: 內戰結束後仍未完成統一
  - label: B
    content: 這場戰爭爆發於朝鮮半島
  - label: C
    content: 可視為美蘇對抗的角力賽
  - label: D
    content: 美國強力支持下終結分裂。
  assets:
