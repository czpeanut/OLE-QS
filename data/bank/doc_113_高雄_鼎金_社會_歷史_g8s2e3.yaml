- id: doc_113_高雄_鼎金_社會_歷史_g8s2e3_s1_26
  section: 1
  number: 26
  type: single
  page: 1
  stem: 老蕭為了寫論文向國家檔案局調閱檔案，發現檔案資料中有些他從來沒有看過的地址，例如：「駐馬店嵖岈山衛星人民公社」。這些地點最可能出現在哪個時期？
  options:
  - label: A
    content: 西元1914 年一次大戰時日本入侵的山東
  - label: B
    content: 西元1936年發生西安事變的陝西
  - label: C
    content: 西元1949 年中華人民共和國定都的北京
  - label: D
    content: 西元1961 年大躍進時期的河南。
- id: doc_113_高雄_鼎金_社會_歷史_g8s2e3_s1_27
  section: 1
  number: 27
  type: single
  page: 1
  stem: 中華人民共和國建立後，採取許多不同的政策。請問：下列有關於中共所實行的政治體制，何者正確？
  options:
  - label: A
    content: 多黨掌政
  - label: B
    content: 君主專制
  - label: C
    content: 君主立憲
  - label: D
    content: 一黨專政。
- id: doc_113_高雄_鼎金_社會_歷史_g8s2e3_s1_28
  section: 1
  number: 28
  type: single
  page: 1
  stem: 西元1966 年「文化大革命」開始後，《人民日報》發表〈橫掃一切牛鬼蛇神〉一文，提出「要澈底破除幾千年來一切剝削階級所造成的毒害人民的舊思想、舊文化、舊風俗、舊習慣」。8
    月17 日晚上，北京紅衛兵擬寫了大字報《最後通牒——向舊世界宣戰》，宣布要「砸爛一切舊思想、舊文化、舊風俗、舊習慣」。請問：這是文化大革命中的哪一項運動？
  options:
  - label: A
    content: 破四舊
  - label: B
    content: 立四新
  - label: C
    content: 大躍進
  - label: D
    content: 改革開放。
- id: doc_113_高雄_鼎金_社會_歷史_g8s2e3_s1_29
  section: 1
  number: 29
  type: single
  page: 1
  stem: 敏俊在網路上看到有個圖書網站介紹一本重新印刷的書籍，書籍簡介寫著：「這部書是共產黨領導人著作內容的選編，是一九六○、七○年代中國最流行的版本，通常使用紅色封面，紅色也代表共產黨的顏色，因此被當時的中國人稱為『紅寶書』。」請問：這本書記載的應該是哪位領導人的思想？
  options:
  - label: A
    content: 毛澤東
  - label: B
    content: 蔣中正
  - label: C
    content: 袁世凱
  - label: D
    content: 張學良。
- id: doc_113_高雄_鼎金_社會_歷史_g8s2e3_s1_30
  section: 1
  number: 30
  type: single
  page: 1
  stem: 關於文化大革命的敘述，下列何者正確？
  options:
  - label: A
    content: 時間為西元1960～1970 年，又稱十年浩劫
  - label: B
    content: 毛澤東培養紅衛兵為自身勢力，後來暗中剷除
  - label: C
    content: 對中國影響甚巨，人民彼此愈加信任，更加團結
  - label: D
    content: 文革的口號「革命無罪，造反有理」讓許多地方的年輕人紛紛響應。
- id: doc_113_高雄_鼎金_社會_歷史_g8s2e3_s1_31
  section: 1
  number: 31
  type: single
  page: 1
  stem: 西元1978 年鄧小平執政後，改走務實路線，有下列哪一項策略可以說明他的施政成效？
  options:
  - label: A
    content: 沿海設置經濟特區
  - label: B
    content: 大躍進
  - label: C
    content: 破四舊、立四新
  - label: D
    content: 超英趕美。
- id: doc_113_高雄_鼎金_社會_歷史_g8s2e3_s1_32
  section: 1
  number: 32
  type: single
  page: 1
  stem: 西元1919 年的「五四運動」和西元1989 年發生的「六四天安門事件」，其共同之處為何？
  options:
  - label: A
    content: 均為反抗列強侵略而起
  - label: B
    content: 均為學生發起的運動
  - label: C
    content: 均曾受到政府的血腥鎮壓
  - label: D
    content: 均刺激中國的政治改革運動。
- id: doc_113_高雄_鼎金_社會_歷史_g8s2e3_s1_33
  section: 1
  number: 33
  type: single
  page: 1
  stem: 鄧小平推動的「改革開放」政策，主要是針對哪個部門的改變所發動的政策？
  options:
  - label: A
    content: 法律
  - label: B
    content: 教育
  - label: C
    content: 經濟
  - label: D
    content: 政治。
- id: doc_113_高雄_鼎金_社會_歷史_g8s2e3_s1_34
  section: 1
  number: 34
  type: single
  page: 1
  stem: 「我們來了，但是太晚了，對不起，對不起同學們。」西元1989 年5 月19 日中共總書記趙紫陽，前往北京天安門廣場與抗議的學生對話，但事件結束後趙紫陽權力盡失，遭到中共軟禁直至西元2005
    年1 月去世為止。請問：當年學生在天安門抗議的結果為何？
  options:
  - label: A
    content: 中共採納學生意見，實施民主制度
  - label: B
    content: 中共與學生達成協議，未發生流血衝突
  - label: C
    content: 趙紫陽支持武力鎮壓，與鄧小平理念不合
  - label: D
    content: 北京政府下令軍隊強力鎮壓，學生遭驅散。
- id: doc_113_高雄_鼎金_社會_歷史_g8s2e3_s1_35
  section: 1
  number: 35
  type: single
  page: 2
  stem: 小祥考完會考後，打算報名旅遊團出國旅行。他從旅行社拿到了旅遊行程簡介單，部分內容如附圖所示。請問：共同警備區的形成，與下列何者有關？
  options:
  - label: A
    content: 二次大戰
  - label: B
    content: 國共內戰
  - label: C
    content: 韓戰
  - label: D
    content: 越戰。
