- id: doc_113_高雄_鼎金_社會_歷史_g8s2e3_s1_40
  section: 1
  number: 40
  type: single
  page: 2
  stem: 民國107 年4 月，我國農委會發布爭議訊息澄清：「臺商到越南投資所產製之『臺式烏龍茶』地區並非過去美軍噴灑落葉劑的地區，目前並無橙劑殘留的問題，請國人安心飲茶。」請問：美軍是何時在越南大量噴灑落葉劑？
  options:
  - label: A
    content: 第一次世界大戰
  - label: B
    content: 第二次世界大戰
  - label: C
    content: 韓戰時期
  - label: D
    content: 越戰時期。
