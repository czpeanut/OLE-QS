- id: doc_113_高雄_鼎金_社會_歷史_g8s2e3_s1_23
  section: 1
  number: 23
  type: single
  page: 1
  stem: 中國在中共建國後，由毛澤東掌權了很長一段時間。請問：下列何者並非毛澤東時期的政策？
  options:
  - label: A
    content: 為進行重新分配，將土地、企業收歸國有
  - label: B
    content: 為攏絡知識分子，對其言論不做批鬥
  - label: C
    content: 為加速農工發展，推動「大躍進」
  - label: D
    content: 為提高鋼鐵產量，推行「土法煉鋼」。
- id: doc_113_高雄_鼎金_社會_歷史_g8s2e3_s1_24
  section: 1
  number: 24
  type: single
  page: 1
  stem: 中共建國後不久，所流行的口號為：「村村流血，戶戶鬥爭。」中共幹部則認為：「打死地主一百、死不了一個雇貧農，就不要緊。」請問：此時期政府所推行的政策為下列何者？
  options:
  - label: A
    content: 土地改革
  - label: B
    content: 人民公社
  - label: C
    content: 土法煉鋼
  - label: D
    content: 民間企業收歸國有。
- id: doc_113_高雄_鼎金_社會_歷史_g8s2e3_s1_25
  section: 1
  number: 25
  type: single
  page: 1
  stem: 搜索教育部國語辭典「土法煉鋼」會得到如附圖的解釋。中國歷史上曾經展開一段全民「土法煉鋼」的時期，然而因為技術上受限，鋼沒煉成卻造成農地荒廢與各種汙染。請問：這是指哪一個時期？
  options:
  - label: A
    content: 十年建設
  - label: B
    content: 大躍進
  - label: C
    content: 十大建設
  - label: D
    content: 中日戰爭。
  assets:
  - key: s1_25_f1
    kind: figure
    file: doc_113_高雄_鼎金_社會_歷史_g8s2e3/s1_25_f1.png
