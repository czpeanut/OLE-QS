- id: doc_113_高雄_鼎金_社會_歷史_g8s2e3_s1_38
  section: 1
  number: 38
  type: single
  page: 2
  stem: 明明在網路上搜尋越南歷史相關資料時，看到了一篇新聞報導，其部分內容如附圖。請問：美軍使用橙劑的時代背景，與下列何者相關？
  options:
  - label: A
    content: 冷戰期間，美軍扶植的南越與北越衝突
  - label: B
    content: 二次大戰爆發，美軍與日本在越南對峙
  - label: C
    content: 越南為了脫離法國殖民，請求美軍協助
  - label: D
    content: 美國刻意制衡蘇聯，因此派軍占領越南。
