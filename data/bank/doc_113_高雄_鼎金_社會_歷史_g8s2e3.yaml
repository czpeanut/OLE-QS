questions:
- id: doc_113_高雄_鼎金_社會_歷史_g8s2e3_s1_21
  section: 1
  number: 21
  type: single
  page: 1
  stem: 西元1958 年，距離中共建國正好十年，毛澤東希望能夠加速農業、工業的發展，以此為契機，展開了「大躍進」。有關這場大躍進的說明，下列何者錯誤？
  options:
  - label: A
    content: 當時的口號是「超英趕美」
  - label: B
    content: 農村成立「人民公社」、「公共食堂」，農民共耕共食
  - label: C
    content: 雖然農業的目標未達成，但是土法煉鋼獲得了良好的成效
  - label: D
    content: 因為糧食不足與過度勞動，最終造成了數千萬人餓死。
- id: doc_113_高雄_鼎金_社會_歷史_g8s2e3_s1_22
  section: 1
  number: 22
  type: single
  page: 1
  stem: 曾教授是研究中國人口變化的專家，他在中國人口史專題報告中，放了一張圖片，內容是西元1950 年～2015 年的中國人口自然增加率。曾教授特別解釋在西元1950～1960
    年期間，中國自然增加率急速下降的原因。請問：他有可能提出下列何項解釋？
  options:
  - label: A
    content: 國共兩黨激烈衝突
  - label: B
    content: 大躍進運動的推行
  - label: C
    content: 文化大革命的發生
  - label: D
    content: 日本對中國的侵略。
