- id: doc_111_高雄_大灣_國文_g9s1e3_s1_30
  section: 1
  number: 30
  type: single
  page: 3
  stem: "孟子謂戴不勝曰：「有楚大夫於此，欲其子之齊語也。則使齊人傅諸？使楚人傅諸？」曰：「使齊人傅之。」曰：「一齊人傅之，眾楚人咻之，雖日撻而求其齊也，不可得矣。引而置之莊、嶽之間數年，雖日撻而求其楚，亦不可得矣。」\
    \ \n                                                                         --節選自《孟子˙滕文公下》\
    \ \n   根據上述內容判斷，哪個選項解讀正確？"
  options:
  - label: A
    content: 語言學習與環境息息相關，若僅憑強力施壓恐無助於學習
  - label: B
    content: 孟子認為學齊語最好的方式是請齊人教導，口音方能純正
  - label: C
    content: 本文說明朋友良窳是影響語言學習的關鍵，故要謹慎擇友
  - label: D
    content: 孟子與戴不勝對於教育皆不遺餘力，常於莊、嶽一帶講學
