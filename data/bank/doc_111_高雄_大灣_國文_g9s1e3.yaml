- id: doc_111_高雄_大灣_國文_g9s1e3_s1_35
  section: 1
  number: 35
  type: single
  page: 4
  stem: "楚莊王謀事而當，群臣莫能逮，退朝而有憂色。申公巫臣進曰：「君朝而有憂色，何也？」楚王曰：「吾聞之：諸侯自擇師者王，自擇友者霸，足於己而群臣莫若之者亡。今以不穀①之不肖而議於朝，且群臣莫能逮，吾國其幾於亡矣，是以有憂色也。」（注：①不穀：古代君王自稱的謙詞。）\
    \                         劉向《新序．雜事》 \n根據這則故事，楚莊王有憂色的原因，最可能是下列何者？"
  options:
  - label: A
    content: 難以抉擇施政方向
  - label: B
    content: 群臣不願追隨國君
  - label: C
    content: 缺乏優秀人才輔政
  - label: D
    content: 朝中小人當道亂政。
- id: doc_111_高雄_大灣_國文_g9s1e3_s2_36
  section: 2
  number: 36
  type: single
  page: 4
  stem: 下列文句的解讀，何者正確？
  options:
  - label: A
    content: （甲）句指出花點小錢就能享受搭遊船出國的樂趣
  - label: B
    content: （乙）句指咖啡館充滿兒時歡樂回憶，有如走進時光隧道
  - label: C
    content: （丙）句說明羹湯店生意興隆，七點後只提供簡便的點心
  - label: D
    content: （丁）句指觀音山的景致迷人，無論晴雨朝夕皆引人遐思。
  group_stem: "（一）\n    位於臺灣北端的淡水好似一扇窗，讓窒息於都市叢林的臺北人，有換氣吐納餘地，她不遠，搭捷運不到一個小時，就可物換星移置身另一個時空。有大屯山為屏，觀音山守候，川流了整個城市的河脈，行至此變得更緩更闊，隨著潮汐，把污穢一併還給汪洋，海水交接處因此有了難得的潔淨。\n\
    \    四周櫛比林立的新興大廈，發展不到鎮上，古街老店仍維持著它的步調，緩緩彳亍①於時間的長河。充滿古意的糕餅店賣的古早囍餅，似乎讓紅底金字的婚約，在此得到更雋永的保證；擠在巷弄裡的淡江戲院，百元票價便可觀賞二輪強檔西片，戲院內斑剝老舊，揮之不去的尿騷味與蚊蟲聲，喚醒了孩提時看「梁\
    \ 祝」的記憶；清水祖師廟前的小攤販售的零嘴玩具，則完全是童年雜貨店的翻版。時光彷彿在此靜止了，淡水老街勾起的是臺北人逝去已久的夢。\n    老舊的渡船失去運輸的意義，卻仍要擔負著遊客思古幽情。尤其滿潮時，河面寬了闊了，行駛間的波濤起伏也大，有種不危及性命的驚險，濕濕鹹鹹的海風，吹亂了髮絲，也吹亂了閉塞的心，帶來陌生又新奇的感覺，（甲）微薄的船資，便能享受放逐他鄉的悲壯。\n\
    \    渡船碼頭當然是不可錯過的，在一地燒酒螺的引領下，踅過一攤又一攤，阿婆鐵蛋、魚丸、阿給、蝦卷及彈珠汽水，是另一種童稚的嘉年華，不過夾雜其間不起眼的糯米腸鋪子，可千萬別錯過，它的米粉湯及米腸，可是臺灣地道美食小吃。（乙）至於那些錯落在河岸邊的個性咖啡館，散發的又是另一種情調，佇足其間啜飲一杯咖啡，眺望對岸穩穩沉睡的觀音，看著淡水河光瀲灩在眼前流淌而去，那靜與動之間，予人無限的遐思，不僅讓走倦的身子得以休憩，更讓心魂暫時得到釋然。\n\
    \    榕樹堤岸適合蹲踞，夥在老人堆裡，逗弄曬暖了的貓咪、形色匆匆的狗兒，在一寸寸老去的斜陽裡，可以提前品味一下垂老的光景。從堤岸繼續往前走，是婚紗照的新人最常出沒處，景觀之佳由此可見。行至此，若有些兵困馬疲，斜對面巷子裡的「黑店排骨」可以是一種選擇，店裡現炸排骨自然是好吃的，其他滷味和大滷湯也十分味美，（丙）不過最好不要晚於七點來此，因為這裡熱賣的情況，絕對超出想像，七點以後只有閉門羹可享。\n\
    \    如果僅止於當個遊客，淡水滿足的是往日情懷，設若長佇在此，淡水則令人有沉溺的危險，她的奇特複雜遠超出想像，正如她的潮汐，左右著河堤景觀，左右著賴以存活的蝦蟹魚鳥及倚水而立的各色草木，就算每天同一時刻佇足其間，總都有不同的景致吸引著你，（丁）對岸的觀音，或晴或雨或晨或暮，也總能幻化不同的身姿，供你想望。\n\
    \    即使你只是過客，一樣可沉浸在淡水的氛圍裡，只要有裕如的時間，悠閒的心情。所以，選個不是假期的日子來淡水吧！                   \
    \                                           節錄自 朱天衣 《臺北．淡水》\n【注釋】①彳亍：緩步慢行。"
