- id: doc_111_高雄_大灣_國文_g9s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 下列選項何者用字完全正確？
  options:
  - label: A
    content: 他對商場爾虞我詐習以為常，甚至從事不法勾當也無悔意，真是恬不知恥
  - label: B
    content: 有些媒體報導與事實不符，經常遷強附會，因此要有辨識能力，不可完全相信
  - label: C
    content: 他對工作的憧憬與熱情，早在枯燥的細瑣事務中消失怠盡
  - label: D
    content: 他在詭蹫多變的政局中長期立於不敗之地，在政治上卻幾乎毫無建樹。
- id: doc_111_高雄_大灣_國文_g9s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 下列各組「 」中的字義，何者相同？
  options:
  - label: A
    content: 管夷吾舉於「士」／入則無法家拂「士」
  - label: B
    content: 「曾」益其所不能／「曾」不吝情去留
  - label: C
    content: 不「勝」其擾／不「勝」枚舉
  - label: D
    content: 徵於「色」，發於聲／巧言令「色」，鮮矣仁。
- id: doc_111_高雄_大灣_國文_g9s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 下列「 」中的字詞，何組意思相同？
  options:
  - label: A
    content: 百里奚舉於「市」／願為「市」鞍馬
  - label: B
    content: 天將降大任「於」是人也／己所不欲，勿施「於」人
  - label: C
    content: 「古道」西風瘦馬 ／「古道」熱腸
  - label: D
    content: 行「拂」亂其所為／法家「拂」士。
- id: doc_111_高雄_大灣_國文_g9s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 有關《孟子》一書的說明，下列敘述何者正確？
  options:
  - label: A
    content: 由孟子弟子與再傳弟子編著而成
  - label: B
    content: 篇名都取自首章開頭的幾個字，都蘊含作者特定含意
  - label: C
    content: 篇幅短小，文字簡約，文辭犀利
  - label: D
    content: 為語錄體，是「四書」之一，代表儒家的重要經典。
  lesson_raw:
    title: 孟子選
    basis: 題目詢問《孟子》一書說明
- id: doc_111_高雄_大灣_國文_g9s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 下列關於韻文「曲」的說明，何者敘述錯誤？
  options:
  - label: A
    content: 曲又稱「詞餘」、「樂府」、「長短句」，內容依曲牌而撰寫
  - label: B
    content: 風格不避俚俗，可依據文意需求加襯字，補足語氣或描摹情態
  - label: C
    content: 元曲可分成散曲和劇曲：散曲，只有曲，沒有科、白。劇曲，由科、白、曲三部分構成
  - label: D
    content: 散曲中單支曲子稱做小令，多支同宮調的小令串聯稱做散套，皆一韻到底，平仄通押。
  lesson_raw:
    title: 元曲選
    basis: 題目詢問韻文「曲」常識
- id: doc_111_高雄_大灣_國文_g9s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 下列文句「」中的成語，何者運用不恰當？
  options:
  - label: A
    content: 這位歌手隱退之後久未露面，此次活動應邀「重作馮婦」，獻唱公益歌曲
  - label: B
    content: 這位作家生活體驗豐富，下筆時總是能信手拈來，「左右逢源」
  - label: C
    content: 身為慈善募款的「始作俑者」，她謙稱只是為社會略盡棉薄之力
  - label: D
    content: 環保工作需要全民的配合，單靠政府的力量，猶如「杯水車薪」，起不了太大的作用。
- id: doc_111_高雄_大灣_國文_g9s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 下列文句「」中的成語，何者運用正確？
  options:
  - label: A
    content: 籃球常勝軍的阿丹，因一次比賽失利，便自暴自棄、「泰山其頹」
  - label: B
    content: 人如果慾望無窮，「得隴望蜀」，生活將陷入痛苦的深淵
  - label: C
    content: 在表演晚會上，她的一番「長袖善舞」，贏得在場觀眾的喝采
  - label: D
    content: 疫情造成全球通貨膨脹，民生物資一時之間「洛陽紙貴」，人民生活苦不堪言。
- id: doc_111_高雄_大灣_國文_g9s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 關於〈孟子選——生於憂患死於安樂〉一文的文意說明，何者正確？
  options:
  - label: A
    content: 「舜發於畎畝之中，傅說舉於版築之間，膠鬲舉於魚鹽之中，管夷吾舉於士，孫叔敖舉於海，百里奚舉於市」：說明「將相本無種，男兒當自強」的道理
  - label: B
    content: 「人恆過，然後能改」：說明「人非聖賢，孰能無過」，要原諒他人的無心之過
  - label: C
    content: 「徵於色，發於聲，而後喻」：意指觀人神色，聽人言語，才能了解其人
  - label: D
    content: 「入則無法家拂士，出則無敵國外患」：意同於「憂勞所以興國，逸豫足以亡身」，呼應「生於憂患」。
  lesson_raw:
    title: 生於憂患死於安樂
    basis: 題目提及〈孟子選——生於憂患死於安樂〉
- id: doc_111_高雄_大灣_國文_g9s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 下列有關〈孟子選——生於憂患死於安樂〉一文的寫作手法分析，何者正確？
  options:
  - label: A
    content: 文章開始採開門見山法，先點明主旨，再舉六位賢者的事例說明「見賢思齊」的道理
  - label: B
    content: 全文以「天將降大任於是人也，必先苦其心志」為總綱
  - label: C
    content: 文末使用映襯手法「生於憂患，死於安樂」提出結論，說明「憂以天下，樂以天下」的道理
  - label: D
    content: 全文文字風格旁徵博引，信而有徵，大量運用排比法，氣勢磅礡，條理分明，極具說服力。
  lesson_raw:
    title: 生於憂患死於安樂
    basis: 題目提及〈孟子選——生於憂患死於安樂〉
- id: doc_111_高雄_大灣_國文_g9s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 「徵於色，發於聲，而後喻。」前兩句的主語是他人，第三句主語才是自己，下列何者的前後句主語不同？
  options:
  - label: A
    content: 困於心，衡於慮，而後作
  - label: B
    content: 試問捲簾人，卻道海棠依舊
  - label: C
    content: 故人西辭黃鶴樓，煙花三月下揚州
  - label: D
    content: 君自故鄉來，應知故鄉事。
  lesson_raw:
    title: 生於憂患死於安樂
    basis: 引用〈生於憂患死於安樂〉課文原句
- id: doc_111_高雄_大灣_國文_g9s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 郭靖在黃昏酉時遭人襲擊而昏迷不醒，醒來後只見黃蓉隨侍在側。「蓉兒，我已昏迷多久？」「靖哥哥，你昏迷了足足十八個時辰。」請問郭靖醒時是哪一個時辰？
  options:
  - label: A
    content: 寅時
  - label: B
    content: 卯時
  - label: C
    content: 巳時
  - label: D
    content: 未時。
- id: doc_111_高雄_大灣_國文_g9s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: "孟子，名軻，為中國古代著名思想家、教育家，畢生闡揚孔子思想，提倡「性善」的學說，主張「民貴君輕」，並奔走各國勸導諸侯實施仁政，後世尊稱他為「亞聖」。\
    \ 唐代大詩人孟浩然是孟子的第三十三代孫，長子曰雲卿，次子曰庭玢。長子雲卿又生二子，長子曰簡，次子曰華，他們是孟子的第三十五代孫，但孟簡、孟華均無後代， 所以把孟浩然次子孟庭玢的孫子\
    \ ――孟郊（唐代大詩人）之子孟常謙作為孟子的第三十七代繼承人。\n\n     根據上述內容判斷，哪個選項解讀正確？"
  options:
  - label: A
    content: 孟子曾受到孔子教導，畢生闡揚孔子思想，並以此世代傳承，至孟浩然真正發揚光大
  - label: B
    content: 孟子的民本思想對後世影響深遠，實施仁政的主張在當時更成為儒家顯學
  - label: C
    content: 我們可尊稱孟簡與孟華為「賢喬梓」，其祖父孟浩然是唐代有名的詩人
  - label: D
    content: 孟子一脈人才輩出，第三十三及第三十六代皆是唐代有名的大詩人。
- id: doc_111_高雄_大灣_國文_g9s1e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 「昔西伯拘羑里，演《周易》；孔子厄陳、蔡，作《春秋》；屈原放逐，著《離騷》；左丘失明，厥有《國語》；孫子臏腳，而論《兵法》。」關於這段文字與下列何者文句意思最不相近？
  options:
  - label: A
    content: 人無遠慮，必有近憂
  - label: B
    content: 人之有德慧術智者，恆存乎疢疾
  - label: C
    content: 寶劍鋒從磨礪出，梅花香自苦寒來
  - label: D
    content: 世界榮譽的桂冠，是用荊棘編織而成。
- id: doc_111_高雄_大灣_國文_g9s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 人際往來中，經常運用謙詞與敬詞，來表示「貶抑自己、稱揚對方」的禮節。下列「 」中的詞語，何者沒有自謙的涵義？
  options:
  - label: A
    content: 您「過獎」了，其實我這只是雕蟲小技
  - label: B
    content: 今日與您一決高下，有幸「承讓」
  - label: C
    content: 多虧您「青眼」有加，我才能擔此重任
  - label: D
    content: 承蒙長官「錯愛」，我才能升任經理。
- id: doc_111_高雄_大灣_國文_g9s1e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 漢字多數是合體成字，因此可以透過拆開、拼組的方式產生語文趣味，下列各副對聯，都是利用拆合字特性所創作的，其中部分關鍵字已經挖空，請根據上下聯的線索，判斷(
    )的字，何者正確？
  options:
  - label: A
    content: 一□分日月／五岳各丘山 — (朋)
  - label: B
    content: 踏破磊橋三塊石／分開出路兩重□ —（門）
  - label: C
    content: 鴻是江邊鳥／□乃山下風 — （嵐）
  - label: D
    content: 嫁得□家郎，有田有米有水／娶來何門女，添人添口添丁 — (糞)
- id: doc_111_高雄_大灣_國文_g9s1e3_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 關於〈射鵰英雄傳──智鬥書生〉一文的寫作手法，下列何者說明最恰當？
  options:
  - label: A
    content: 鬥智過程主要由黃蓉主導，藉以烘托黃蓉的聰慧機智形象
  - label: B
    content: 透過人物對話及內心的獨白，讓讀者一窺鬥智的內外交鋒
  - label: C
    content: 全文以第一人稱的敘事觀點推展情節，描述精彩比武經過
  - label: D
    content: 以郭靖、黃蓉二人對書生的態度轉變，點出鬥智最終結果。
  lesson_raw:
    title: 智鬥書生
    basis: 題目提及課名〈射鵰英雄傳──智鬥書生〉
- id: doc_111_高雄_大灣_國文_g9s1e3_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 下列關於〈天淨沙秋思〉「枯藤老樹昏鴉，小橋流水人家，古道西風瘦馬。夕陽西下，斷腸人在天涯。」的賞析說明，何者敘述錯誤?
  options:
  - label: A
    content: 屬散曲中的小令，「天淨沙」是曲牌，只標明音樂性；「秋思」是題目，揭示內容
  - label: B
    content: 前三句運用九個詞語及重複句式，形成互為對偶的「鼎足對」，勾繪出具體的畫面
  - label: C
    content: 末兩句由景入情，烘托人物心緒，點出「秋思」的主題
  - label: D
    content: 描寫方式由時間推展到空間，借景抒情，韻腳有「鴉、家、馬、下、涯」。
  lesson_raw:
    title: 天淨沙秋思
    basis: 題目引用〈天淨沙秋思〉
- id: doc_111_高雄_大灣_國文_g9s1e3_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 下列關於〈天淨沙秋思〉一曲的敘述，何者正確？
  options:
  - label: A
    content: 「枯藤老樹昏鴉」運用層遞的手法呈現出遊子悲苦的心情
  - label: B
    content: 「小橋流水人家」運用轉化修辭，透過溫馨畫面傳達遊子漂泊他鄉的落寞之情
  - label: C
    content: 「古道西風瘦馬」烘托遊子孑然無依的身影，曲中描寫的季節與「金風玉露一相逢」相同
  - label: D
    content: 「夕陽西下，斷腸人在天涯」所表現的情懷和「勸君更盡一杯酒，西出陽關無故人」相同。
  lesson_raw:
    title: 天淨沙秋思
    basis: 題目引用〈天淨沙秋思〉
- id: doc_111_高雄_大灣_國文_g9s1e3_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 下列關於白樸〈沉醉東風漁父詞〉一曲的分析解釋，何者敘述正確？
  options:
  - label: A
    content: 「黃蘆岸白蘋渡口，綠楊堤紅蓼灘頭」運用色彩鮮明的顏色字，描繪出盎然生機的春景
  - label: B
    content: 「雖無刎頸交，卻有忘機友」表現出漁父高風亮節，對清高人格品德的嚮往
  - label: C
    content: 「點秋江白鷺沙鷗」呈現動態江面景色，暗寓作者嚮往閒適自在的生活情趣
  - label: D
    content: 「傲殺人間萬戶侯，不識字煙波釣叟」展現對萬戶侯的輕視及對煙波釣叟的欣羨之情，情感近於「人生在世不稱意，明朝散髮弄扁舟」。
  lesson_raw:
    title: 沉醉東風漁父詞
    basis: 題目引用〈沉醉東風漁父詞〉
- id: doc_111_高雄_大灣_國文_g9s1e3_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: "（甲）枯藤老樹昏鴉，小橋流水人家，古道西風瘦馬。夕陽西下，斷腸人在天涯。         馬致遠〈天淨沙秋思〉 \n（乙）黃蘆岸白蘋渡口，綠楊堤紅蓼灘頭。雖無刎頸交，卻有忘機友，點秋江白鷺沙鷗。傲殺人間萬戶侯，不識字煙波釣叟。\
    \                                                                      白樸〈沉醉東風漁父詞〉\
