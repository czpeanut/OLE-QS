  group_stem: "（五）\n    吾八歲入小學，以道士張易簡為師，童子幾百人，師獨稱吾與陳太初者。太初， 眉山市井人子也。余稍長，學日益，遂第進士制策，而太初乃為郡小吏。其後余謫居黃州，有眉山道士陸惟忠自蜀來，云：「太初已尸解①矣。蜀人吳師道為漢州太守，太初往客焉。正歲日，見師道求衣食錢物，且告別。持所得盡與市人貧者，反坐於戟門下，遂卒。師道使卒舁②往野外焚之，卒罵曰：『何物道士，使吾正旦舁死人！』太初微笑開目曰：『不復煩汝。』乃步戟門至金鴈橋下，趺坐③而逝。焚之，舉城人見煙燄上眇眇焉有一陳道人也。」\n\
    \   蘇軾《東坡志林•異事》\n注釋\n①尸解：修練得道者遺其形骸而成仙\n②舁：抬舉、扛抬\n③趺坐：兩腳盤腿打坐"
