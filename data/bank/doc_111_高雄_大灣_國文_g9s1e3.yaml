    content: 「桃之夭夭，灼灼其華，之子于歸，宜其室家。桃之夭夭，有蕡其實，之子于歸，宜其家室。」— 楚辭
  - label: B
    content: 「種豆南山下，草盛豆苗稀。晨興理荒穢，帶月荷鋤歸。道狹草木長，夕露沾我衣。衣沾不足惜，但使願無違。」— 近體詩
  - label: C
    content: 「簾外雨潺潺，春意闌珊。羅衾不耐五更寒。夢裡不知身是客，一晌貪歡。   獨自莫凭欄，無限江山。別時容易見時難。流水落花春去也，天上人間」—宋詞
