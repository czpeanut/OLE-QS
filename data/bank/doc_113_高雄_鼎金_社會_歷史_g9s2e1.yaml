- id: doc_113_高雄_鼎金_社會_歷史_g9s2e1_s1_28
  section: 1
  number: 28
  type: single
  page: 1
  stem: 西元1789 年爆發法國大革命，群眾力量打倒專制王權，震撼歐洲其他國家。下列何者是法國大革命產生的影響？
  options:
  - label: A
    content: 「自由、平等、博愛」的口號隨著拿破崙的占領行動，深入歐洲各國的民心
  - label: B
    content: 路易十六趁發動政變而當選第一執政，並向外征戰、橫掃歐洲
  - label: C
    content: 給予北美十三州脫離英國獨立的勇氣，而有美利堅合眾國的誕生
  - label: D
    content: 維也納會議標榜「以人為本」，肯定人性的尊嚴與價值。
