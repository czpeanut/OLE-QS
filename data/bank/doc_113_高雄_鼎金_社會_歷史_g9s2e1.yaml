    labeled_by: ai
- id: doc_113_高雄_鼎金_社會_歷史_g9s2e1_s1_26
  section: 1
  number: 26
  type: single
  page: 1
  stem: 拿破崙曾帶領法國對抗反法聯軍的外力干涉，被當時的法國人民視為英雄。然而，拿破崙的影響不只僅限於法國，尤其是《拿破崙法典》對當時國際社會帶來的影響甚深。下列關於《拿破崙法典》的敘述，何者正確？
  options:
  - label: A
    content: 《拿破崙法典》主要推崇法國大革命宣揚的「自由、平等、博愛」精神
  - label: B
    content: 《拿破崙法典》對於宗教信仰自由的保障並沒有明文訂立
  - label: C
    content: 《拿破崙法典》亦鼓吹民族自決的理想
  - label: D
    content: 《拿破崙法典》推行地區僅限於法國，並沒有擴及至歐洲其他地方。
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 歷史
      code: 1-2
      title: 法國大革命
      chapter: 第1章 現代國家的建立
    textbook: 九下歷史 1-2 法國大革命
    labeled_by: ai
