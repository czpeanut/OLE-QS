  section: 1
  number: 31
  type: single
  page: 1
  stem: 法國大革命後，民族主義思想擴散至歐洲，甚至世界各地亦受影響。請問：下列何者是民族主義所造成的影響？
  options:
  - label: A
    content: 德意志帝國的建立
  - label: B
    content: 工業革命
  - label: C
    content: 美國獨立
  - label: D
    content: 維也納會議。
