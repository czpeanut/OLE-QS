  type: single
  page: 1
  stem: 某位歷史人物在義大利統一的過程中，曾率領千名志願軍攻占兩西西里王國，而後將土地獻出來，自己背著一袋豆子到鄉下隱居。請問：這應該是指下列何者？
  options:
