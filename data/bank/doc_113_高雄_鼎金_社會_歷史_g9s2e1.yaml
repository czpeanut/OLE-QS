  section: 1
  number: 34
  type: single
  page: 2
  stem: 第一次世界大戰原本只是歐洲內部的戰爭，但隨著戰爭爆發，各國殖民地亦逐漸捲入。請問：關於第一次世界大戰的過程與結果，下列何者正確？
  options:
  - label: A
    content: 戰爭初期，由協約國率先取得優勢
  - label: B
    content: 美國因商船被波及，又因義大利干涉美洲事務而加入戰局
  - label: C
    content: 後因各國不堪長期作戰，雙方達成停戰協議
  - label: D
    content: 此次戰爭交戰雙方有所節制，雖有死傷，但並不慘重。
