  section: 1
  number: 22
  type: single
  page: 1
  stem: 「他一生行事堅毅，具有非凡的軍事才幹，率領美國脫離英國的統治。美國獨立後，他又以極強的判斷力，化解了建國之初各種分歧的意見，為美國奠下不朽的基業。」請問：文中的主角應為何人？
  options:
  - label: A
    content: 洛克
  - label: B
    content: 尼克森
  - label: C
    content: 拿破崙
  - label: D
    content: 華盛頓。
