  section: 1
  number: 33
  type: single
  page: 1
  stem: 十九世紀晚期，歐美盛行「社會達爾文主義」，強調自身優越的民族文化，對其他民族的侵略與壓迫，乃是合理且必須完成的任務，下列何種思想與「社會達爾文主義」類似？
  options:
  - label: A
    content: 共產主義
  - label: B
    content: 人文主義
  - label: C
    content: 帝國主義
  - label: D
    content: 社會主義。
