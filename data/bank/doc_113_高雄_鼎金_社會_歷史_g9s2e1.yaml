- id: doc_113_高雄_鼎金_社會_歷史_g9s2e1_s1_23
  section: 1
  number: 23
  type: single
  page: 1
  stem: 西元1773 年，英屬東印度公司的茶葉船自波士頓入港後，有一群打扮成印第安人和黑人的民眾，將船上342 箱的茶葉丟進海中，此為「波士頓茶葉事件」。請問：此事件發生的背景為何？
  options:
  - label: A
    content: 茶葉未在北美洲種植，有損當地民眾利益
  - label: B
    content: 大陸會議擬定《獨立宣言》，表達北美民眾與英國抗爭的決心
  - label: C
    content: 英國放縱若干抗議民眾，百姓藉此事件表明心聲
  - label: D
    content: 民眾長期以來對英國強徵新稅、經濟壟斷等政策不滿。
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 歷史
      code: 1-1
      title: 美國獨立革命
      chapter: 第1章 現代國家的建立
