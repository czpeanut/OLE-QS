  section: 1
  number: 27
  type: single
  page: 1
  stem: 他在法國大革命後取得政權，曾頒布〈懲治嫌疑犯條例〉，採取恐怖統治，以公安委員會為其機構，剷除異己，數萬人被暗殺或處死。請問：他應是下列何人？
  options:
  - label: A
    content: 梅特涅
  - label: B
    content: 路易十六
  - label: C
    content: 拿破崙
  - label: D
    content: 羅伯斯比。
