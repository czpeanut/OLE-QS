  section: 1
  number: 21
  type: single
  page: 1
  stem: 「殖民地的人民認為，假若他們沒有代表出席母國的議會，母國政府就無權向他們徵稅；如果政府堅持徵稅，就是暴政！」這段話說明了美國獨立運動爆發的原因，顯示出當時殖民地人民主要欲爭取下列哪一項權益？
  options:
  - label: A
    content: 自由權
  - label: B
    content: 行政權
  - label: C
    content: 參政權
  - label: D
    content: 工作權。
