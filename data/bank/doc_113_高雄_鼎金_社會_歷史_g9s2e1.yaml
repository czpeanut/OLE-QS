  type: single
  page: 2
  stem: 「德國對於英國的海軍甚感棘手。因此決定採取無差別攻擊，經過英國的船隻皆成為其海軍的目標。甲國在戰爭前期尚未與德國決裂，但在一艘承載上千位平民乘客的船隻遭到攻擊後，甲國群情激憤，成為參與第一次世界大戰的契機之一。」上文敘述中的甲國應為何者？
