  section: 1
  number: 30
  type: single
  page: 1
  stem: 十九世紀初期，有位革命家趁拿破崙占領伊比利半島的時機，反抗歐洲國家的殖民統治，在拉丁美洲各地領導獨立戰爭，被譽為拉丁美洲的解放者。請問：上述的革命家最有可能是何人？
