    labeled_by: ai
- id: doc_113_高雄_鼎金_社會_歷史_g9s2e1_s1_24
  section: 1
  number: 24
  type: single
  page: 1
  stem: 英國與美國都是現今世界上重要的民主國家，下列關於兩者的比較，何者不正確？
  options:
  - label: A
    content: 英國制定現代第一部成文憲法
  - label: B
    content: 美國建立了近代史上第一個聯邦共和國
  - label: C
    content: 美國以行政、立法、司法三權分立為原則，建立聯邦政府
  - label: D
    content: 美國的獨立建國，堪稱為啟蒙理想的實現。
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 歷史
      code: 1-1
      title: 美國獨立革命
      chapter: 第1章 現代國家的建立
    textbook: 九下歷史 1-1 美國獨立革命
    labeled_by: ai
- id: doc_113_高雄_鼎金_社會_歷史_g9s2e1_s1_25
  section: 1
  number: 25
  type: single
  page: 1
  stem: 歐洲各國君主人心惶惶，這種心態使得他們的態度趨於一致，著手發動聯軍企圖撲滅法國大革命的燎原之火。但這些軍事干涉行為，反倒促使法國人民抵抗的決心。請問：導致歐洲各國君主人心惶惶的原因應為下列何者？
  options:
  - label: A
    content: 組國民會議
  - label: B
    content: 頒布《人權宣言》
  - label: C
    content: 廢除君主制度
  - label: D
    content: 攻陷巴士底監獄。
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 歷史
      code: 1-2
      title: 法國大革命
      chapter: 第1章 現代國家的建立
