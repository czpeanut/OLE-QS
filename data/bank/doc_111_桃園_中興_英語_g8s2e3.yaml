  stem: Which may be the title（標題）of this reading?
  options:
  - label: A
    content: What Do Bears Eat?
  - label: B
    content: Brown Bears and Black Bears
  - label: C
    content: Should I play Dead If I See a Bear?
  - label: D
    content: Bears, the Most Dangerous Animals
  group_stem: "What do you do if you see a bear in the forest?  Some might answer,\
    \ “Play dead.”  The question is, “Does it work?” \n  If you see a bear, don’t\
    \ be scared.  Just leave, but don’t turn your back on the bear.  Slowly back away\
    \ from it.  \nHowever, it’s another story if the bear attacks you.  Brown bears\
    \ seldom attack a person; most of the attacks happen because \nthey want to protect\
    \ their food, babies, or home.  So, playing dead could be helpful. \n  However,\
    \ playing dead probably won’t work with predatory bears.  Although brown bears\
    \ don’t usually want to hurt \npeople, black bears may see people as food.  They\
    \ kill and eat animals, so playing dead in front of them could make you the \n\
    meat on their plate.  Also, don’t try to run from them or climb a tree.  They\
    \ can do both much faster than you.  You have to \nfight back. \n play 扮演；裝 work\
    \ 有效 \nback 往後退 attack 攻擊 \npredatory 掠食性的"
  tags:
    textbook: 第四冊（八下）第3次段考範圍
    labeled_by: ai
