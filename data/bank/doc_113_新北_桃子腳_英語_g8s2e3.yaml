  stem: Why do some dogs become stray dogs?
  options:
  - label: A
    content: They like living outside.
  - label: B
    content: Their owners give them food.
  - label: C
    content: They get lost or are left by their owners.
  - label: D
    content: They run away to the zoo.
  group_stem: '(43~46)  In many cities, there are stray dogs. These dogs do not have
    homes. Some were born on the streets, and others were left by their owners. Stray
    dogs often look dirty and hungry. They sometimes walk around looking for food.

    Stray dogs can be dangerous if they are sick or scared. But most of them are not
    bad. They just need love and care. Some people try to help stray dogs by giving
    them food or taking them to animal shelters. An animal shelter is a place that
    takes care of animals without homes. We can help stray dogs in different ways.
    We can donate food or money to shelters. We can also tell others to be kind to
    animals. If you want a pet, it’s better to adopt one from a shelter than to buy
    one from a pet store.                                               stray 流浪的
