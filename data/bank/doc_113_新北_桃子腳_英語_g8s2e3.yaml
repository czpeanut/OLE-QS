    content: He heard a loud train.
  group_stem: '(39~42)  Many scientists and inventors watch nature to get good ideas.
    This is biomimicry. It means using nature’s ideas to fix human problems. One famous
    example is Velcro. In 1941, a man named George de Mestral walked his dog. He saw
    small sticky balls on the dog’s hair. He looked at them with a microscope and
    saw many little hooks. He got an idea. He made Velcro. Now people use Velcro on
    clothes, shoes, and bags. Another idea came from a bird. The Japanese bullet train
    made a loud sound. One engineer saw a bird called a kingfisher. This bird dives
    into water quietly. The engineer changed the train’s front to look like the bird’s
    beak. After this, the train went faster and made less noise. Nature has many smart
    ideas. If we look at nature, we can find ways to fix problems in life.

     inventor 發明家  sticky 黏的  microscope 顯微鏡   hook 鉤子  dive 俯衝'
  ai_answers:
    gemini: A
    qwen: A
  answer:
  - A
  answer_status: ai_generated
  answer_source: ai:gemini+qwen
