  stem: Why did Steve Jobs’ mom send him to a children’s home?
  options:
  - label: A
    content: She didn’t love him.
  - label: B
    content: She was too busy.
  - label: C
    content: She wasn’t able to look after him.
  - label: D
    content: She wanted him to meet a rich couple.
  group_stem: '(36~38)

    Amy: Hey Ben, do you know who Steve Jobs is?

    Ben: Hmm… I think so. Isn’t he the Apple guy?

    Amy: Yes! He started Apple Computer. But his early life was very interesting.

    Ben: Really? What happened?

    Amy: When he was born, his mom couldn’t take care of him, so she sent him to a
    children’s home.

    Ben: That’s sad. Did someone take him home?

    Amy: Yes, a kind couple adopted him. Before they took him, his mom made them promise
    to send him to university one day.

    Ben: Oh! Did they keep their promise?

    Amy: Yes, they did. They used all their money to send him to Harvard University.

    Ben: That’s amazing!

    Amy: But guess what? Steve dropped out after one year.

    Ben: What?! Why?

    Amy: He thought going to university was not useful for him. So, he left and started
    Apple.

    Ben: Wow, he really knew what he wanted!      couple 夫妻  adopt 領養  promise 允諾   drop
