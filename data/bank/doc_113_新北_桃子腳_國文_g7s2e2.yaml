  type: single
  page: 4
  stem: 閱讀上面的文章後，請判斷下列敘述何者於內文中並未提及？
  options:
  - label: A
    content: 假新聞與假消息的種類
  - label: B
    content: 如何區分假新聞與假消息
  - label: C
    content: 假新聞與假消息出現的原因
  - label: D
    content: 假新聞與假消息議題受到高度關注。
  group_stem: "乙、\n  假新聞議題持續受到全球高度關注，近期卡達遭中東各國斷交風波，傳背後導火線正是假新聞，一日之內引發中東七國與卡達宣布斷交，甚至間接影響油價價格，可見假新聞影響層面之廣泛不容忽視。\n\
    \  諸如此類的假消息與假新聞層出不窮，它們究竟從何而來？又為何存在呢？\n  身處網路時代的我們早已習慣使用手機等行動裝置來獲取資訊，而使用者瀏覽時間的長短則影響了媒體營收的多寡。各大平台使用人工智慧技術預測哪些內容是你「最有可能停留最久時間並與之互動」的內容，並把這些你更願意花時間的內容呈現給你。對於網站本身而言，目標只有一個：「如何吸引與留住瀏覽者」，因此呈現的通常是使用者「想看見的」，並且過濾了「不想看見的」或不經常瀏覽的。\n\
    \  有些媒體為了吸引讀者注意力而常以聳動標題呈現，卻造成讀者誤會；或是有心人士利用散佈不實消息帶風向，藉此獲取政治或商業的利益，使社會充斥各種錯誤資訊難以辨別真偽。根據歐洲理事會2017\
    \ 年報告，把這個情況稱為「資訊失序」，並以「錯誤」與「惡意」分成三種：\n\n1. 錯誤消息：與事實不符但沒有惡意，就是我們常見的以訛傳訛。\n2. 不實消息：與事實不符且為惡意，故意為了傷害特定對象或達到某個目的。\n\
    3. 惡意消息：符合事實但懷有惡意，通常為了攻擊特定對象，造成對方名譽受損。\n\n(改寫自網路文章什麼是假新聞／假消息？)"
