- id: doc_113_新北_桃子腳_國文_g7s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 「再三囑咐茶房，甚是仔細」，句中「甚」字的詞性為副詞，與下列何者相同？
  options:
  - label: A
    content: 他「望」車外看了看
  - label: B
    content: 我心裡暗笑他的「迂」
  - label: C
    content: 好在天無「絕」人之路
  - label: D
    content: 「惟」膀子疼痛得厲害。
  lesson_raw:
    title: 背影
    basis: 引自朱自清〈背影〉
- id: doc_113_新北_桃子腳_國文_g7s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列「 」中的詞語，何者使用錯誤？
  options:
  - label: A
    content: 鐵雄決定離開鄉下前往都市「謀事」
  - label: B
    content: 大明為了還清房貸四處「東奔西走」
  - label: C
    content: 珍珍即將畢業，面臨要升學還是就業的選擇，令他「躊躇滿志」
  - label: D
    content: 阿丁「賦閒」已有一段時日，卻不積極找工作，在家當個啃老族。
- id: doc_113_新北_桃子腳_國文_g7s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 關於朱自清背影一文，下列敘述何者正確？
  options:
  - label: A
    content: 全文皆在描述過去的回憶
  - label: B
    content: 以父親的立場敘述對兒子的關愛
  - label: C
    content: 表達一位父親對兒子的深切期許
  - label: D
    content: 文中藉由具體事件的描述表達真切的情感。
  lesson_raw:
    title: 背影
    basis: 題幹提及朱自清背影
- id: doc_113_新北_桃子腳_國文_g7s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 下列「 」中的字，何組讀音相同？
  options:
  - label: A
    content: 「混」入人群／「混」水摸魚
  - label: B
    content: 典「質」財物／「質」地良好
  - label: C
    content: 杯盤狼「藉」／愛找「藉」口
  - label: D
    content: 照「看」行李／「看」見台灣。
- id: doc_113_新北_桃子腳_國文_g7s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 下列複詞中，屬於雙聲複詞的是哪一個？
  options:
  - label: A
    content: 爛縵
  - label: B
    content: 尷尬
  - label: C
    content: 叨擾
  - label: D
    content: 齷齪。
- id: doc_113_新北_桃子腳_國文_g7s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 下列何者是聲音鐘一文的轉折處？
  options:
  - label: A
    content: 自從我把書桌從前面的房間移到後面之後
  - label: B
    content: 那是因為走過那塊小小空地的小販的叫賣聲
  - label: C
    content: 時間一到，這些叫賣聲就像報時的鐘一般準確地出現
  - label: D
    content: 過了下午，乍暖還寒，此起彼落的叫賣聲就更加豐富了。
  lesson_raw:
    title: 聲音鐘
    basis: 題幹提及聲音鐘一文
- id: doc_113_新北_桃子腳_國文_g7s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 關於聲音鐘一文的敘述，下列何者不正確？
  options:
  - label: A
    content: 作者陳黎的散文風格清新而真摯
  - label: B
    content: 作者善用譬喻，把叫賣聲形容成像古典樂般吸引人
  - label: C
    content: 作者認為這些美妙的叫賣聲是活力人間不可或缺的色彩
  - label: D
    content: 文章首尾呼應，以「我喜歡那些像鐘一般準確出現的小販的叫賣聲」來貫穿全文。
  lesson_raw:
    title: 聲音鐘
    basis: 題幹提及聲音鐘一文與作者陳黎
- id: doc_113_新北_桃子腳_國文_g7s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 「(甲)歐巴桑(乙)阿奇毛(丙)宅急便(丁)『酷』斃了(戊)菩薩(己)抓狂(庚)菜鳥(辛)龜毛」。以上詞語，推究它們的由來，屬於外來用語的有哪幾個？
  options:
  - label: A
    content: 甲乙丙丁辛
  - label: B
    content: 甲乙丙丁戊
  - label: C
    content: 乙丙丁戊己
  - label: D
    content: 甲丁戊庚己。
- id: doc_113_新北_桃子腳_國文_g7s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 下列何者敘述不正確？
  options:
  - label: A
    content: 行書由楷書變化而來
  - label: B
    content: 鐘鼎文是商、周時代的文字
  - label: C
    content: 楷書為現代漢字的通用字體
  - label: D
    content: 秦始皇施行「書同文」的政策，大篆成為全國統一使用的文字。
- id: doc_113_新北_桃子腳_國文_g7s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 對於現代生活而言，哪一種字體的實用性很高，寫來靈活？
  options:
  - label: A
    content: 行書
  - label: B
    content: 楷書
  - label: C
    content: 篆書
  - label: D
