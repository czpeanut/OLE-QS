- id: doc_113_新北_桃子腳_國文_g7s2e2_s2_40
  section: 2
  number: 40
  type: single
  page: 5
  stem: 關於本文的主角，下列敘述何者正確？
  options:
  - label: A
    content: 故鄉就在台北的蕉園
  - label: B
    content: 婚後發現當初的蕉園已經不在了
  - label: C
    content: 為王家要開發蕉園，才搬離此地
  - label: D
    content: 找不到市中心的房子，才住到蕉園附近。
  group_stem: "戊、\n  放榜，她考上了公職，分發到台北來，她刻意來蕉園這一區找房子，在一家便當店的樓上租了雅房。終於離家了，身體裡的水塔不斷壯大，快把她撐破了，來到台北，她要過全新的清淡生活，故鄉一切都太濃烈了，菊花太鮮豔，殺豬聲太淒厲，鳳凰木太血紅，她渴望黯淡。台北正在急速發展，她可輕易在城市裡隱身，無人知曉，甘心慘澹。\n\
    \  結婚之後，她搬離這一區，與丈夫省吃儉用，在高密度的住宅區買了一棟小公寓。幾年後她搭公車經過這裡，突然想看蕉園還在不在，結果稻田消失了，綠樹消失了，小溪不見了，香蕉不見了。那片蕉園被王家的財團看上，蓋了一棟環保的綠建築，屋頂都是太陽能板，夜裡不關燈，王家的商標閃閃發光。她真的不懂，什麼叫綠建築？蓋一個肥碩的建築，裡面卻只有王家的人才能進入，環保什麼？以前這塊地，完全沒有籬笆，附近的孩子進來捉迷藏，老人家拿板凳進來泡茶聊天，沒有蕉農看管，附近的居民都是蕉農，一起除草灌溉，香蕉收成後，大家分享，毫無買賣。給這棟建築大獎的評審，有沒有看過動土前的那片蕉園？那些香蕉樹好健康，樹葉毫無黃斑，香蕉串串肥美。那時站在蕉園裡，抬頭有星星。\n\
    \  （選自陳思宏 鬼地方）"
