  stem: 上文中寫道：「她只是過馬路去幫我寄信。這樣簡單的動作，卻要叫我終身難忘。」為什麼文中的「我」會對於這件事感到終身難忘？
  options:
  - label: A
    content: 「她」難得願意幫忙寄信
  - label: B
    content: 那封信對於「我」來說非常重要
  - label: C
    content: 「我」認為過馬路寄信是重大的儀式
  - label: D
    content: 寄信過程中意外突然發生，造成難以磨滅的傷痛。
  group_stem: "甲、\n  那時候剛好下著雨，柏油路面溼冷冷的，還閃爍著青、黃、紅顏色的燈火。我們就在騎樓下躲雨，看綠色郵筒孤獨的站立在街的對面。我白色風衣的大口袋裡有一封要寄給在南部的母親的信。\n\
    \  櫻子說她可以撐著傘過去幫我寄信。我默默點頭，把信交給她。「誰叫我們只帶來一把小傘哪！」她微笑著說，一面撐起傘，準備過馬路去幫我寄信。從她傘骨滲下來的小雨點濺在我眼境玻璃上。\n\
    \  隨著一聲拔尖的剎車聲，櫻子的一生輕輕地飛了起來，緩緩地，飄落在溼冷的街面，好像一只夜晚的蝴蝶。\n  雖然是春天，好像已是深秋了。\n  她只是過馬路去幫我寄信。這樣簡單的動作，卻要叫我終身難忘。我緩緩睜開眼，茫然站在騎樓下，眼裡藏著滾燙的淚水。世上所有車子都停了下來，人潮湧向馬路中央。沒有人知道那躺在街面的，就是我的，蝴蝶。這時候她只離我五公尺，竟是那麼遙遠。更大的雨點濺在我的眼睛上，濺到我的生命裡來。\n\
    \  為什麼呢？只帶一把雨傘？\n  然而我又看到了櫻子穿著白色的風衣，撐著傘，靜靜地過了馬路了。她是要幫我寄信的，那是一封寫給在南部母親的信，我茫然站在騎樓下，我又看到永遠的櫻子走到街心，回頭望我。其實雨下得並不很大，卻是我們一生ㄧ世中最大的一場雨。而那封信是這樣寫的，年輕的櫻子知不知道呢？\n\
    \  媽：我打算在下個月初和櫻子結婚。\n  (選自渡也 永遠的蝴蝶)"
