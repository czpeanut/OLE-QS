  stem: 下列敘述最符合蘇格拉底意旨的是哪一選項？
  options:
  - label: A
    content: 說話之道在於掌握說話之術
  - label: B
    content: 坦誠待人，真誠做事，講求誠信
  - label: C
    content: 謠言止於智者，勿妄議他人是非
  - label: D
    content: 見智者智，見愚者愚，各行其是。
  group_stem: "丙、\n  有一次，蘇格拉底的一位門生匆匆忙忙地跑來找蘇格拉底，邊喘氣邊興奮地說：「告訴你一件事，你絕對想像不到的……」\n  「等一下！」蘇格拉底毫不留情地制止他。「你告訴我的話，用三個篩子過濾過了嗎？」\n\
    \  他的學生察覺情況不妙，不解地搖了搖頭。\n  蘇格拉底繼續說：「當你要告訴別人一件事時，至少應該用三個篩子過濾一遍！第一個篩子叫做真實，你要告訴我的事是真實的嗎？」\n\
    \  「我是從街上聽來的，大家都這麼說，我也不知道是不是真的。」\n  「那就應該用你的第二個篩子去檢查，如果不是真的，至少也應該是善意的，你要告訴我的事是善意的嗎？」\n\
    \  「不，正好相反。」他的學生羞愧地低下頭來。\n  蘇格拉底不厭其煩地繼續說：「那麼我們再用第三個篩子檢查看看，你這麼急著要告訴我的事，是重要的嗎？」\n\
    \  「並不是很重要……」\n  蘇格拉底打斷了他的話：「既然這個消息並不重要，又不是出自善意，更不知道它是真是假，你又何必說呢？說了也只會造成大家的困擾罷了。」\n\
    \n                 (選自蘇格拉底 三個篩子)"
