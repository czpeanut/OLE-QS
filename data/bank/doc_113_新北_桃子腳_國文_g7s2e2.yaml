- id: doc_113_新北_桃子腳_國文_g7s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 「同義複詞」是語義相同或相近的語詞構成的副詞，如「遭遇」、「追逐」。下列選項「 」中的詞語，何者即屬於同義複詞？
  options:
  - label: A
    content: 這是一間會「呼吸」的圖書館
  - label: B
    content: 他們言歸於好，一笑泯「恩仇」
  - label: C
    content: 我愛在山中靜靜「聆聽」大自然的聲音
  - label: D
    content: 他喜歡和同學交換「彼此」的生活經驗。
- id: doc_113_新北_桃子腳_國文_g7s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 有關今夜看螢去一文的敘述，何者正確？
  options:
  - label: A
    content: 作者透過今昔對比，說明螢火蟲日漸稀少的主要原因
  - label: B
    content: 作者透過本文，主要是為了呼籲國人保護生態環境，重視復育
  - label: C
    content: 作者描寫賞螢的感懷，傳達人螢相親的溫暖，並流露螢已稀，童年已逝的感慨
  - label: D
    content: 全文採順序法，先憶童年情景，再寫專程到台北荒郊賞螢，途中所發生的趣事。
  lesson_raw:
    title: 今夜看螢去
    basis: 題幹提及今夜看螢去
- id: doc_113_新北_桃子腳_國文_g7s2e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 今夜看螢去文中引用了許多古典詩句，關於下列詩句的說明，何者錯誤？
  options:
  - label: A
    content: 「未足臨書卷」說明螢火的亮度不足以用來照明讀書
  - label: B
    content: 「時能點客衣」說明螢火時時依附在遊子的衣服上能慰人寂寥
  - label: C
    content: 「簾疏巧入坐人衣」描寫流螢穿過稀疏的竹簾，停在衣服上的景象
  - label: D
    content: 「騰空類星隕，拂木若花生」前句是說螢火的繁華，後句是說螢光的急舞。
  lesson_raw:
    title: 今夜看螢去
    basis: 題幹提及今夜看螢去
- id: doc_113_新北_桃子腳_國文_g7s2e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 關於賣油翁一文的文意解析，下列何者正確？
  options:
  - label: A
    content: 「康肅笑而遣之。」──陳康肅覺得遇到賣油翁真是有理也說不清，所以笑著打發賣油翁離開
  - label: B
    content: 「取一葫蘆置於地，以錢覆其口，徐以杓酌油瀝之」──賣油翁以實際行動證明「手熟」的道理
  - label: C
    content: 「陳康肅公善射，當世無雙，公亦以此自矜。」──陳康肅對於自己擅長射箭的情形，抱持著見不得人的態度
  - label: D
    content: 「賣油翁釋擔而立，睨之，久而不去」──賣油翁久聞陳康肅名聲，特地停下腳步，表現了對其射藝的熱愛及激賞。
  lesson_raw:
    title: 賣油翁
    basis: 題幹提及賣油翁
- id: doc_113_新北_桃子腳_國文_g7s2e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 歐陽脩自述晚號六一居士由來：「吾家藏書一萬卷，集錄三代以來金石遺文一千卷，有琴一張，有棋一局，而常置酒一壺，以吾一翁，老於此五物之間，是豈不為六一乎？」根據此文，下列何者與「六一居士」之稱號無關？
  options:
  - label: A
    content: 品茗
  - label: B
    content: 老翁
  - label: C
    content: 書籍
  - label: D
    content: 金石遺文。
- id: doc_113_新北_桃子腳_國文_g7s2e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 「三更半夜」是指晚上十一點到一點這段時間。若貪玩的阿貴晚上十一點開始寫作業，寫了三小時，他完成的時間是幾時？
  options:
  - label: A
    content: 丑時
  - label: B
    content: 子時
  - label: C
    content: 亥時
  - label: D
    content: 寅時。
- id: doc_113_新北_桃子腳_國文_g7s2e2_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 在寫作手法中有分為實筆和虛筆的寫法。實筆指描寫實際可見、可感知的事物，虛筆則是指想像或象徵性的事物。根據此定義，下列選項哪段敘述用最多虛筆寫法？
  options:
  - label: A
    content: 早晨的陽光灑進了窗戶，微風輕拂，樹葉沙沙作響
  - label: B
    content: 遠處的山脈輪廓分明，綠色的田野和金黃色的稻穀相映成趣
  - label: C
    content: 此時此刻，所有的喧囂都安沉靜下來，世界彷彿被這片寧靜所包圍
  - label: D
    content: 小鳥在枝頭歡快地歌唱，天空湛藍如水，雲朵像棉花糖一樣輕飄飄地漂浮著。
- id: doc_113_新北_桃子腳_國文_g7s2e2_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 林亨泰：「你的聲音，若不從你的喉嚨發出；／而要裝成有體面的人的喉嚨發出；／那是可悲的。」上文的涵義與下列何者最相近？
  options:
  - label: A
    content: 聲音能引起心靈的共鳴
  - label: B
    content: 寧可因發聲而死，也絕不因沉默而苟活
  - label: C
    content: 即使是小人物也有權力發出自己的聲音
  - label: D
    content: 壓抑自己良心的聲音，這是很危險的事情。
- id: doc_113_新北_桃子腳_國文_g7s2e2_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 「超狂『呷霸王紅糟肉圓披薩』直接把肉圓放進披薩拿去烤，不僅豪放九顆烤肉圓，屏東紅糟肉餡酒香抓醃入味，搭配煸炒香菇麻筍，淋上古早味肉圓米醬，再加上濃郁莫札瑞拉起司，最後撒上香菜，引發熱議。有人認為『如果義大利出兵攻打台灣，應該是這披薩造成的。』」文章中提到「如果義大利出兵攻打台灣，應該是這披薩造成的」，這句話的含義是什麼？
  options:
  - label: A
    content: 這款披薩的創意過於大膽，讓人驚訝
  - label: B
    content: 台灣的傳統食物正遭到外來文化的侵略
  - label: C
    content: 義大利的料理文化可能會對台灣造成威脅
  - label: D
    content: 義大利的軍事行動與披薩的受歡迎程度有關。
- id: doc_113_新北_桃子腳_國文_g7s2e2_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 根據下文，下列敘述何者正確？
  options:
  - label: A
    content: 紐西蘭的螢火蟲和台灣的一樣都是為了吸引配偶而發光
  - label: B
    content: 懷托摩螢火蟲洞中像蚊子的小蟲，在洞中飛舞閃爍著點點白光
  - label: C
    content: 身處在地下洞穴中，幼蟲Larva 在洞頂上，螢光像浩瀚無垠的銀河
  - label: D
    content: 被稱為世界第九大奇跡的螢火蟲洞，洞中溫暖乾燥為不會飛的Fungus Gnat 營造出最適合的生存環境。
  group_stem: "位於台灣東南方的紐西蘭，有個被稱為世界第九大奇跡的懷托摩螢火蟲洞，在這個滿是螢火蟲相伴的地下洞穴，就像置身在浩瀚無垠的銀河中！……是外型類似蚊子但卻不會飛的Fungus\
    \ Gnat 真菌類蚊蚋幼蟲Larva，附著在濕潤的岩壁上，為了吸引獵物上鉤，利用了昆蟲的趨光性，在尾巴末端處發出藍色光芒；當眾多的幼蟲聚集在一起，形成了如此奇妙的景觀。\n\
    \             （節錄自Styletc 旅遊網）"
- id: doc_113_新北_桃子腳_國文_g7s2e2_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 根據下文，下列敘述何者正確？
  options:
  - label: A
    content: 特殊橡皮擦頭可以磨擦生熱，所以要擦掉筆跡，只能用這種特別的筆蓋
  - label: B
    content: 筆跡溫度被瞬間提高，而墨色設定在降回室溫時，依然處於透明無色的狀態
  - label: C
    content: 擦擦筆上的特殊橡皮擦頭，分泌出可遮蔽字跡的物質，能真的把筆跡擦掉
  - label: D
    content: 用吹風機高溫烘考字跡，可以讓整張紙烤焦，從而達到消除筆跡的目的，作者建議大家拿來變魔術。
  group_stem: "「好寫，好擦，好乾淨」到底好在哪裡呢？新型調整劑能夠設定墨色在特定溫度（攝氏60 至 65 度）以上時消失，而且當溫度降回室溫時，依然處於透明無色的狀態。因此只要利用筆蓋上的特殊橡皮擦頭，透過摩擦生熱的原理，讓紙面的溫度瞬間提高，那麼筆跡就會隱形，看起來就像被擦掉一樣。如果想一次清除大面積的筆跡，可以用吹風機試試看喔，魔術效果十足！\n\
