  group_stem: '(There was little trash in Aunt Stella''s garden. One month

    later, there was lots of trash instead.)

    Mom : Look, Bruce, why is Aunt Stella''s garden so dirty

    now?

    Bruce : It becomes so dirty because Aunt Stella neglects

    the trash.

    Mom : Well. It''s like the Broken Windows Theory?

    Bruce : What is Broken Windows Theory ?

    Mom : If a window in your house is broken, there will be

    more broken ones. So fix it before it gets worse.

    Bruce : I see. The trash in Aunt Stella''s house is the same

    as the broken windows of the house.

    Mom : Right. Nobody tried to stop the first trash, and then

    there would be more and more trash.

    Bruce : That sounds terrible.

