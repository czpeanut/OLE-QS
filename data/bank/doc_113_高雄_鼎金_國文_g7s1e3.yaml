- id: doc_113_高雄_鼎金_國文_g7s1e3_s4_32
  section: 4
  number: 32
  type: single
  page: 4
  stem: 關於這篇文章的寫作手法，何者敘述正確？
  options:
  - label: A
    content: 首段開門見山法，寫媽媽又生了一個小弟弟，要作者把金盒子讓給弟弟
  - label: B
    content: 第一人稱敘述，以金盒子為主線貫串全文
  - label: C
    content: 敘述作者與弟弟的感情從爭執到老死不相往來的過程
  - label: D
    content: 結尾總結全文，說明作者對兄弟的思念之情，日漸淡薄。
  group_stem: "三年後，母親因不堪家中的寂寞，領了一個族裡的小弟弟。他是個十二分聰明的孩子，父母親都非常愛他，給他買了許多玩具。我也把我與哥哥幼年的玩具都給了他，卻始終藏過了這隻小金盒子，再也捨不得給他。有一次，被他發現了，他跳著叫著一定要。母親帶著責備的口吻說：「這麽大的人了，還與六歲的小弟弟爭玩具呢！」我無可奈何，含著淚把金盒子讓給小弟弟，卻始終不認將一段愛惜金盒子的心事，向母親吐露。\n\
    \    金盒子在六歲的童子手裡顯得多麽不堅牢啊！我眼看他扭斷了小鎖，打碎了爛泥兵，連那幾個最寶貴的小信封也幾乎要遭殃了。我的心如絞著一樣痛，趁母親不在，急忙從小弟弟手裡搶救回來，可以金盒子已被摧毀得支離破碎了。我真是心疼而且憤怒，忍不住打了他，他也罵我「小氣的姊姊」，他哭了，我也哭了。\n\
    \    一年又一年地，弟弟已漸漸長大，他不再毀壞東西了。九歲的孩子，就那麽聰明懂事，他已明白我愛惜金盒子的苦心，幫著我用美麗的花紙包紮起爛泥兵的腿，再用銅絲修補起盒子上的小鎖，說是為了紀念他不曾晤面的哥哥，他一定得好好愛護這隻金盒子。我們姊弟間的感情，因而與日俱增，我也把思念哥哥的心，完全寄託於弟弟了。\n\
    \    弟弟十歲那年，我要離家外出，臨別時，我將他的玩具都理在他的小抽屜中，自己帶了這隻金盒子在身邊，因為金盒子對於我不僅是一種紀念，而且是骨肉情愛之所繫了。\n\
    \    作客他鄉，一連就是五年，小弟弟的來信，是我惟一的安慰。他告訴我他已經念了許多書，並且會畫圖畫了。他又告訴我說自己的身體於好，時常咳嗽發燒，說每當病在牀上時，是多麽寂寞，多麽盼我回家，坐在他身邊給他講香菸片上《封神榜》的故事。可是因為戰時交通不便，又為了求學不能請假，我竟一直不曾回家看看他。\n\
    \    恍惚又是一場噩耗，一個電報告訴我弟弟突患腸熱病，只兩天就不省人事，在一個淒涼的七月十五深夜，他去世了！在臨死時，他忽然清醒起來，問姊姊可曾回家。我不能不怨恨殘忍的天心，在十年前奪去了我的哥哥，十年後竟又要奪去我的弟弟，我不忍回想這接二連三的不幸事件，我是連眼淚也枯乾了。\n\
    \    哥哥與弟弟就這樣地離開了我，留下的這一隻金盒子，給與我的慘痛該多麽深？但正為它給我與如許慘痛的回憶，使我可以捧著它盡情一哭，總覺得要比甚麽都不留下好得多吧！\n\
    \    幾年後，年邁的雙親，都相繼去世了，暗淡的人間，茫茫的世路，就只丟下我踽踽獨行。如今我又打開這修補過的小鎖，撫摸著裡面一件年的寶物，貼補爛泥兵腳的美麗花紙，已減退了往日的光彩，小信封上的鉛筆字，也已逐漸模糊得不能辨認了。可是我痛悼哥哥與幼弟的心，卻是與日俱增，因為這些暗淡的事物，正告訴我他們離開我是一天比一天更遠了。(節錄自琦君\
    \ 金盒子)"
