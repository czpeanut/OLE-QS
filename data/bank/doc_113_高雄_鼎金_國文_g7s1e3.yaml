  stem: 根據本文，文聘不繼續追擊的原因為何？
  options:
  - label: A
    content: 被張飛聲勢所震
  - label: B
    content: 張飛兵馬眾多
  - label: C
    content: 曹操下令退兵
  - label: D
    content: 懷疑有埋伏。
  group_stem: '卻說文聘引軍追至長阪橋，只見張飛倒豎虎鬚，圓睜環眼，手綽（１）蛇矛，立馬橋上；又見橋東樹林之後，塵頭大起，疑有伏兵，便勒住馬不敢近前。操聞知，從陣後來。張飛圓睜環眼，隱隱見後軍青羅傘蓋、旄鉞（２）旌旗來到，料得是曹操心疑，親自來看。飛乃厲聲大喝曰：「我乃燕人張翼德也！誰敢與我決一死戰？」聲如巨雷。曹軍聞之，盡皆股栗（３）。曹操急令去其傘蓋，回顧左右曰：「我向曾聞雲長言，翼德於百萬軍中，取上將之首，如探囊取物。今日相逢，不可輕敵。」飛望見曹操後軍陣腳移動，乃挺矛又喝曰：「戰又不戰，退又不退，卻是何故！」喊聲未絕，曹操身邊夏侯傑驚得肝膽碎裂，倒撞於馬下，操便回馬而走。於是諸軍眾將一齊望西逃奔。（羅貫中
    三國演義）

    【注釋】（１）綽：抓取。（２）旄鉞：音ㄇㄠˊ ㄩㄝˋ，為將帥領統權柄的代表。（３）股栗：腿部發抖。形容極為恐懼的樣子。'
