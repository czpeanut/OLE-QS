  group_stem: "剪黏又稱為「剪花」，由於交趾陶燒製較不容易，並且又屬於「軟陶」，在廟頂經風吹雨打容易損壞，於是剪黏應運而生。\n  早期的剪黏主要材料是瓷碗片；先用石灰與石棉拌合糖水，成為一種既有黏性，又具可塑性的固體，然後塑成各種造型，再將瓷碗片剪成需要的形狀，黏貼上去，它的原理是利用碗的弧度及彩繪，黏貼成為各類的飛禽走獸，花木人物。\n\
    \  後來玻璃工藝發達之後，出現了彩色玻璃，由於它容易裁剪，色彩又豔麗，作品更具可看性，碗片、花瓶片一類的廢物利用再也沒有人採用了。慢慢的，又有玻璃工廠專門供應剪黏用的成形玻璃；自從小片成形彩色磁磚出後，又有人以它為材料來做剪黏。\n\
    \  材料本是固定而刻版，透過藝匠的巧手創作，才能剪出生動的造型，如今出現「寺廟工程公司」之類營造廠，不只大小木作以水泥替代，連剪黏也以電腦程式設計圖案，再以「馬賽克」拼貼，有若幼童的著色畫，變成千篇一律沒有生命的東西了，而剪黏的老師傅失去創作的空間，這門手藝也漸次式微。（節錄自民俗思想起——消失中的常民生活文化網站）"
