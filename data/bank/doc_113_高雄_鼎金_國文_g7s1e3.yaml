    我最忘情的哭聲有兩次／一次，在我生命的開始／一次，在你生命的告終／ 第一次，我不會記得，是聽你說的／第二次，妳不會曉得，我說也沒用／但 兩次哭聲的中間啊／有無窮無盡的笑聲／一遍一遍又一遍／迴盪了整整三十
    年／妳都曉得，我都記得

    矛盾世界(母難日三題之二)

    快樂的世界啊／當初我們見面／你迎我以微笑／而我答你以大哭／驚天，動 地／悲哀的世界啊／最後我們分手／我送你以大哭／而你答我以無言／關 天，閉地／矛盾的世界啊／不論初見或永別／我總是對妳以大哭／哭世界始
    於妳一笑／而幸福終於你閉目

    天國地府(母難日三題之三)

    每年到母難日／總握著電話筒／很想撥一個電話／給久別的母親／只為了再 聽一次／一次也好／催眠的磁性母音／但是她住的地方／不知是什麼號碼／ 何況她已經睡了／不能接我的電話／「這裡是長途臺／究竟你要／接哪一個
    國家？」／我該怎麼回答呢／天國，是什麼字頭／地府，有多少區號／那不 耐的接線生／卡撻把線路切斷／留給我手裡一截／算是電線呢還是／若斷若 連的臍帶／就算真的接通了／又能夠說些什麼／「這世界從妳走後／變得已
    不能指認／唯一不變的只有／對妳永久的感恩」（余光中 母難日）'
