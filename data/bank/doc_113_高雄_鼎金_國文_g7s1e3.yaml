  number: 4
  type: single
  page: 1
  stem: 關於沈復〈兒時記趣〉一文的寫作手法，下列敘述何者正確？
  options:
  - label: A
    content: 作者透過馬虎的觀察和白日夢的幻想，無中生有許多樂趣
  - label: B
    content: 作者使用倒反法，把花臺的景物寫成原始叢林
  - label: C
    content: 結尾使用誇飾法，想像青蛙是巨獸將二蟲吞食
  - label: D
    content: 總說觀察仔細，時常體會到物外的樂趣，再分別舉例三件物外之趣。
