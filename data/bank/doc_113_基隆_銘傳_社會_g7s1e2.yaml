  type: single
  page: 3
  stem: 有關外來政權來台統治的敘述，何者錯誤？
  options:
  - label: A
    content: 荷蘭傳教士為了傳播基督教，教西拉雅族用羅馬字母拼寫自己的語言，因新港社留下的文獻最多，稱「新港文書」
  - label: B
    content: 西班牙人在統治地區傳播天主教，與原住民互動頗多，不少原住民能說西班牙語
  - label: C
    content: 鄭氏政權時期，原住民學習漢人農耕技術，在原住民部落設立學校，原住民逐漸接觸漢人文化
  - label: D
    content: 劉銘傳來台建設後，才推動開山撫番的措施。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
