  stem: 「李大胖是清帝國嘉慶年間的福建人，他努力賺錢打拼、養活妻小。(甲)他想到臺灣打拚卻無法攜帶妻兒，忍痛將妻兒託給鄉人照顧後，隻身前往臺灣(乙)遇上無良的船東差點溺死在臺灣海峽。好不容易自行脫困游上岸後，卻捲入(丙)朱一貴事件，被官府逮捕入獄，還好發現是誤會一場而被釋放，(丁)李大胖最後與同鄉友人一起開墾今天臺北盆地。」以上是某一歷史小說內容，其中李大胖的哪一項遭遇不符合史實？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
