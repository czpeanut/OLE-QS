  group_stem: '題組

    唐宋八大家中並稱”三蘇”的”蘇洵、蘇軾、蘇轍”是著名的大文豪父子檔，在他們的名氣背後有一位了不起的女性，就是蘇洵的妻子程氏。蘇洵18歲結婚，到27歲才開始立志讀書，妻子程夫人除了親自教育孩子之外，更努力承擔起家計。後來蘇洵帶著蘇軾和蘇轍離開故鄉到京城參加考試，雖然第二年兩兄弟就金榜題名，但是留在家鄉的程夫人卻病故了。蘇軾擔任官職之後，特地請司馬光為母親寫了墓誌銘，以為紀念。'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
