- id: doc_113_基隆_銘傳_社會_g7s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 圖一為臺灣萬金石馬拉松的比賽路線圖，萬金石馬拉松是臺灣層級最高的馬拉松賽事，是臺灣首個取得認證標籤的賽事，其路線途經萬里、金山、石門等行政區，因而得名。萬金石馬拉松的賽道沿途大多是濱海公路，在視野寬闊的景致中，跑者能在賽程中能夠欣賞到令人心曠神怡的海岸景色。請問：跑者在比賽過程中，看到的主要景色有何特色？
  options:
  - label: A
    content: 地表崎嶇，造型奇特的珊瑚礁岩
  - label: B
    content: 寬廣的沙灘、海中的沙洲
  - label: C
    content: 岬角與海灣相關，海岸線曲折
  - label: D
    content: 陡直的海岸線，氣勢雄偉的懸崖峭壁
