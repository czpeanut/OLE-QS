- id: doc_113_新北_崇林_英語_g8s1e2_s4_8
  section: 4
  number: 8
  type: single
  page: 3
  stem: Why wouldn’t Henry do what Wally wanted him to do?
  options:
  - label: A
    content: He didn’t want to spend the money.
  - label: B
    content: He was too lazy.
  - label: C
    content: He had one clock in his house.
  - label: D
    content: He didn’t know what Wally wanted.
  group_stem: 'Wally sold clocks in a shop. One day his next door neighbor, Henry,
    came into his shop. Henry was very stingy. His stinginess made Wally very angry.
    Wally said to him, “When are you going to buy a clock?” “Never,” Henry said. “I
    don’t need a clock.”

    “Everyone needs a clock,” Wally said. “How do you know when it’s time to get up?”

    “The man living on the other side of me turns on his radio at seven for the news,”
    Henry said. “I hear the announcer say, ‘The time is seven o’clock. Here is the
    news.’”

    “OK. But how do you know when to go to work?” Wally wanted to know.

    “By the time I get out of bed and brush my teeth, it’s half past seven. By the
    time I finish my breakfast of toast and coffee, it’s eight o’clock, time to leave
    for the office. When I get to the bus stop, it’s ten past eight. The bus arrives
    in a few minutes and by the time it gets to my stop, it’s half past eight. That’s
    the time I start work,” Henry said.

    “OK. But how do you know when it’s time to go home?” Wally said, getting angry.

    “I leave the office when everyone does,” Henry told him.

    “Then how do you know when it’s time to go to bed?”

    “The TV programs come to an end.”

    Now Wally was really angry. “OK,” he shouted. “Now tell me what would happen if
    you woke up in the middle of the night and wanted to know the time?”

    “That’s easy,” Henry said. “I have a hammer.”

    “A hammer? What good is a hammer when you want to know the time?” Wally asked.

    “I use it to knock on your wall. You’d shout at me, ‘What are you doing? Knocking
    on my wall at three o’clock in the morning?’”


    neighbor 鄰居 stingy 小氣 announcer 廣播員 program 節目 if 如果 hammer 鐵鎚'
