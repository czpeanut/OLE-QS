  group_stem: 'Bill had a bad dream last night. The nightmare was so real that Bill
    couldn’t forget anything that happened in the dream. The dream was about outer
    space. In the dream, it was raining heavily and the wind was very strong.

    Bill saw a spaceship flying in the sky and then it stopped outside his window.
    From the spaceship came some strange people with the looks Bill never saw before.
    Every one of them had three eyes and two sharp ears. They wanted to catch Bill
    and take him into the spaceship. Bill was very scared and he ran for help. Then
    he woke up just when they were about to catch him. He was so afraid that he was
    sweating like a pig. “How scary the dream is!” Bill said.


