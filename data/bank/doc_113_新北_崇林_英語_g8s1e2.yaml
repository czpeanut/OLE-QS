- id: doc_113_新北_崇林_英語_g8s1e2_s4_10
  section: 4
  number: 10
  type: single
  page: 4
  stem: What does “they” refer to in the reading?
  options:
  - label: A
    content: Apartments.
  - label: B
    content: Their dinner.
  - label: C
    content: Young workers’ jobs.
  - label: D
    content: The young workers.
  group_stem: 'Now, on IG and TikTok, it’s popular around the world to post a video
    about your “girl dinner.” Cambridge Dictionary is even thinking about making “girl
    dinner” a new word. But what’s girl dinner? It isn’t a dinner for little girls
    or kids. It’s a new dinner style for young workers. Many young workers are busy
    with their jobs and live alone. They don’t want to cook dinner after work, and
    they might not have a kitchen in their apartments. So, they put different snacks
    on a plate to make a simple and quick dinner. The snacks don’t need cooking. For
    example, cheese, cookies, popcorn, salad, and fruit like apples or oranges. The
    dinner style is different from the hearty dinner in the past. People don’t need
    to spend much time in the kitchen, and they don’t eat a lot for dinner. They can
    use the time for their other hobbies.


    Cambridge 劍橋 style 風格 apartment 公寓

    simple 簡單的 refer to 指涉 convenient 方便的'
