  group_stem: 'For some people, it can be hard __(1)__ new friends when they are in
    a new place.

    Luckily, __(2)__ a few easy ways to help you make friends.

    Most of the time, we show how we feel on our faces without knowing it. If we’re
    nervous, we may look that way, too. So, try to show our best side and smile often,
    and then people may think we’re friendly.

    Besides, self-confidence is also important for __(3)__ new friends. One of the
    best ways is to wear clothes that both show the real you and make you feel relaxed.
    Of course, you can’t wear pajamas on your first day of school! Just __(4)__ yourself—in
    your favorite clothes.

    If you don’t know how to talk with people you just met, try asking them some questions
    about themselves. People usually enjoy __(5)__ about themselves. For example,
    ask the boy behind you in class what his favorite subject is.

    It takes some time for deep friendships to form, so don’t worry too much.


    friendly 友善的 -self 自己 confidence 信心 pajama 睡衣 deep 深的 friendship 友誼 form 形成'
