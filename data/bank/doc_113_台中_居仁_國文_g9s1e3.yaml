  group_stem: 金聘齡爲歙穀縣令，嘗行宿於海上漁父之家，問若得何魚，對曰：「民之漁，得人魚六首，其二則創而死，其四猶生之。」出視之，皆如四歲兒，容顔明媚，鼻樑聳，耳輪郭，其鬚黃，黑髮被額，體或微赤，或全白，背上有淡黑紋。男女陰陽一如人，掌心皆皺紋，及抱膝而坐，皆與人無別，垂淚如雨。聘齡憐之，請漁人放之。漁人甚惜之，曰：「人魚取其膏甚美，久而不敗，不比鯨油日多而臭腐。」奪而還之海，其逝也，如龜鼈之遊焉。聘齡甚異之，漁人曰：「魚之大者，大如人，此特其小兒耳。」
