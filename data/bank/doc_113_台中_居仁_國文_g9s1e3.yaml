  stem: 下列有關本文的敘述何者正確？
  options:
  - label: A
    content: 「每迎女，婿固不遣」婿因路途遙遠，無法前往
  - label: B
    content: 「夫人一夕置酒，跪白公」王夫人慈愛晚輩，仗義執言
  - label: C
    content: 「公拆襖，出珠授之，封識宛然」可見王忠肅公的清廉
  - label: D
