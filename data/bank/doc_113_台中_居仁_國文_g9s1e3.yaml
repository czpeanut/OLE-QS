  group_stem: 屠龍子與都黎弈，都黎數敗。館人憐而助之，又敗。觀者皆愕，胥助焉。從者請已，曰：「吾聞寡不敵眾，彼方鳩群智，吾憂子之不勝以圮前勞也。」屠龍子弗應，坐而弈如故。都黎乃大敗不能支，助者相顧皆失色，執子以詬。從者喜曰：「神矣哉，夫子之弈也！」屠龍子曰：「未也，子不觀夫鬥獸乎？夫獸虎為猛，今以虎鬥虎，則獨虎之不勝多虎也，明矣；以狐鬥虎，則雖千狐其能勝一虎哉？多愈見其自亂也。」
