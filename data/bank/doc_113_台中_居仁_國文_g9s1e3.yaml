  type: single
  page: 2
  stem: "文學體裁有其特色，請將下列詩詞依照文學演進的順序「樂府詩、絕句、律詩、宋詞」依序排列，正確順序為何？\n（甲）無言獨上西樓，月如鉤。寂寞梧桐深院鎖清秋。\
    \ 剪不斷、理還亂，是離愁。別是一般滋味在心頭。\n（乙）鳳凰臺上鳳凰遊，鳳去臺空江自流。\n 吳宮花草埋幽徑，晉代衣冠成古丘。\n 三山半落青天外，二水中分白鷺洲。\n\
    \ 總為浮雲能蔽日，長安不見使人愁。\n（丙）江南可採蓮，蓮葉何田田，魚戲蓮葉間。\n 魚戲蓮葉東，魚戲蓮葉西，魚戲蓮葉南，\n 魚戲蓮葉北。\n（丁）建德非吾土，維揚憶舊遊，\n\
