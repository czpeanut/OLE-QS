  group_stem: '宋天禧年間，宰相王欽若奏以杭州西湖為放生池，禁捕魚鳥，為人主祈福。每歲四月八日，郡人數萬會於湖上，所活羽毛鱗介以萬萬計。此王侯宰官今生作者之因也。吾鄉亦有放生會。每朔望輸錢於櫃，至期買羽水二族放之，亦是一事。第流浪陋劣之徒，乘機捕逐甚，有伺其釋放，而網罟之者，又不知作何慈悲，可免此厄，可度此等人也。正旦放生，人競逐之。論者以為不如勿放，此亦一時不得已之談。廣大教化，當不如是。僧本源欲建放生堂於玉柱塔之側，不知何時可了此願。塔在三江口，地闊天空，即不能禁民勿捕。於此放生，必多得所者。

    張大復〈放生〉'
