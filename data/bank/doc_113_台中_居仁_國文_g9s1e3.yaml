  section: 6
  number: 2
  type: single
  page: 4
  stem: 作者認為歷來批評家對杜甫〈遣興〉一詩，所產生的誤讀是：
  options:
  - label: A
    content: 以為杜甫嘲諷陶潛猶未能達道
  - label: B
    content: 認為杜甫質疑陶潛的隱士形象
  - label: C
    content: 以為杜甫批評陶潛的詩風枯槁
  - label: D
    content: 認為杜甫藉陶潛自嘲窮困潦倒
  group_stem: '陶醉於田園的陶潛，是否曾為他決定隱居後悔過？是否有時候也想過另外一種生活？清代以降的批評家已開始質疑陶潛作為一個隱士的「單純性」----詩人龔自珍就把陶潛當成有經世抱負的豪傑之士，可與三國時代的諸葛亮相比擬：「陶潛酷似臥龍豪，萬古潯陽松菊高。莫信詩人竟平淡，二分梁甫一分騷。」很顯然，龔自珍並沒有把陶潛當作一個平淡的人。對龔氏及其同時代的人而言，陶潛代表了一個典型的知識分子，有出仕的凌雲之志卻扼腕而棄之----因為生不逢時。

    其實早在唐代，詩人杜甫便已經對陶潛作為一個恬然自樂的隱士形象提出質疑。杜甫在其〈遣興〉一詩中說：「陶潛避俗翁，未必能達道。觀其著詩集，頗亦恨枯槁。」學者李華認為杜甫所要傳遞的訊息是：「陶淵明雖然避俗，卻也未能免俗。何以知之？因為從陶潛詩集來看，其中很有恨自己一生枯槁之意。」李華將杜甫詩中的「枯槁」解作「窮困潦倒」是很有理由的，因為陶潛〈飲酒〉第十一首用了同一個詞來形容孔子得意門生顏回的窘迫：「顏生稱為仁，榮公言有道。屢空不獲年，長飢至於老。雖留後世名，一生亦枯槁……」。我們自然可以聯想到當杜甫試圖揭開清貧隱士陶潛的面具時，實際上也是自我示現。浦起龍在評解杜甫〈遣興〉時，便指出：「嘲淵明，自嘲也。假一淵明為本身象贊」。由此，也就解釋了為什麼杜甫詩作中一再提到陶潛。而實際上，杜甫正是第一個將陶潛提升到文學經典地位的人。

    然而在過去的數世紀內，批評家一直誤讀杜甫，或者可以說是對杜甫解讀陶潛的誤讀。由於批評家常將「枯槁」解作「風格上的平淡」，自然而然會認定杜甫以其〈遣興〉一詩來批評陶潛的詩風。這種誤解導致明代學者胡應麟在其《詩藪》中以為「子美之不甚喜陶詩，而恨其枯槁也」。後來朱光潛也沿襲了胡應麟的說法。這一有趣的誤讀實例證實了：經典化的作者總是處於不斷變化的流程中，是讀者反饋的產物。

    改寫自孫康宜〈揭開陶潛的面具〉'
