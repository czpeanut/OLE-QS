- id: doc_113_台中_居仁_國文_g9s1e3_s3_14
  section: 3
  number: 14
  type: single
  page: 2
  stem: '我想，李清照是能夠恣意享受生活的那一種人。文學史上喝醉並以之為傲的男人甚多，敢於喝醉的女人卻少。尤其明清以後大量的女性文學家湧現，她們不只對自己的創作水準有極高要求，個人的生活也是一絲不苟、面面俱到。閱讀她們的生命總讓人「望之儼然」。李清照的生活卻富有情趣，她會因為打賭贏了而潑自己一身茶，那樣張揚自信。她會划著小舟出去遊玩到興致盡了，日頭也西下了才肯回家。頗有六朝人「興盡而返」的任情自適。

    關於上述這段文字，下列敘述何者正確？'
  options:
  - label: A
    content: 明清之後女性文學家明顯增多，但作品水準參差不齊
  - label: B
    content: 「望之儼然」，意指莊重嚴肅，以李清照為典型
  - label: C
    content: 由文中可知李清照不受傳統束縛，勇於活出自我
  - label: D
    content: 作者對於李清照享受生活的態度，頗有微詞
