  group_stem: '公一女，嫁為畿輔某官某妻。公夫人甚愛女，每迎女，婿固不遣，恚①而語女曰：「汝翁長銓②，遷我京職，則汝朝夕侍母。且遷我如振落葉耳，而固吝者何？」女寄言於母。夫人一夕置酒，跪白公。公大怒，取案上器擊傷夫人，出，駕而宿于朝房③，旬乃還第。婿竟不調。

    公為都禦史，與太監某守遼東。某亦守法，與公甚相得也。後公改兩廣，太監泣別，贈大珠四枚。公固辭。太監泣曰：「是非賄得之。昔先皇頒僧保所貨西洋珠於侍臣，某得八焉，今以半別公，公固知某不貪也。」公受珠，納所著披襖中，紉之。後還朝，求太監後，得二姪。公勞之曰：「汝翁廉，汝輩得無苦貧乎?」皆曰：「然。」公曰：「如有營，予佐爾賈④。」二子心計，公無從辦，特示故人意耳，皆陽應曰：「諾。」公屢促之，必如約。乃偽為屋券，列賈五百金，告公。公拆襖，出珠授之，封識宛然⑤。

    改寫自崔銑〈記王忠肅公翱事〉

    ①恚：音ㄏㄨㄟˋ，怨恨、憤怒。②長銓：掌管官吏銓選遷調的職事。③朝房：吏部辦公室。④賈：買賣。⑤封識宛然：封識完好如初。'
