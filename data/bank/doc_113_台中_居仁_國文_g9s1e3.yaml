  stem: 根據本文所述，下列敘述何者最恰當？
  options:
  - label: A
    content: 做事看人必須完全依據事實，眼見為憑，不臆測
  - label: B
    content: 顏回代替孔子祭拜其父，抓取一撮煮熟的米來吃
  - label: C
    content: 孔子雖然內心有所懷疑，但以委婉的方法詢問顏回
  - label: D
    content: 孔子提醒顏回即使身陷窘境，也不能因窮困失去節操
  group_stem: '孔子窮乎陳、蔡之間，藜羹①不斟，七日不嘗粒，晝寢。顏回索米，得而爨②之，幾熟。孔子望見顏回攫其甑③中而食之。選間，食熟，謁孔子而進食。孔子佯為不見之。孔子起曰：「今者夢見先君，食潔而後饋。」顏回對曰：「不可。向者煤室入甑中，棄食不祥，回攫而飯之。」孔子歎曰：「所信者目也，而目猶不可信；所恃者心也，而心猶不足恃。弟子記之，知人固不易矣。」故知非難也，孔子之所以知人難也。

    《呂氏春秋》

