  stem: '杜蘭特在網路上求助，內容如右。請問：下列哪位網友的回答最正確？

    ┌────────────────────────────────────────┐

    │請問歌曲的智慧財產權規定？              │

    │發問者：杜蘭特                          │

    │我的朋友創作了一首啦啦隊應援曲，關於    │

    │這首歌曲的著作財產權保障期限是如何計    │

    │算呢？                                  │

    └────────────────────────────────────────┘'
  options:
  - label: A
    content: 柯瑞：任何著作作品都沒有保障權益的期限
  - label: B
    content: 唐契奇：只要向政府申請，你朋友可以自行決定保障期限
  - label: C
    content: 詹姆斯：歌曲一被完成開始計算 50 年的保障期限
  - label: D
    content: 文班亞馬：從你朋友完成歌曲開始，到他死後 50 年為止。
