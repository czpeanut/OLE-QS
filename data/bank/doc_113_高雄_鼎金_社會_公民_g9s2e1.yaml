    恤、馬克杯、鑰匙圈、捷運卡等。有民眾發出質疑，擔心商家使用這張電腦系統產生的圖片是否造成侵權。除此之外，智慧財產局表示，已收到多起案件申請，希望經審查通過後，取得此圖案的專屬權利，因而引發公眾討論相關智慧財產權問題。
