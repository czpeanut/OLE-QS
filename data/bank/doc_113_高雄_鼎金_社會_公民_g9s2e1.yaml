- id: doc_113_高雄_鼎金_社會_公民_g9s2e1_s1_50
  section: 1
  number: 50
  type: single
  page: 1
  stem: '博玄摘取一段文章向同學說明「政治全球化」的涵義，請問：依照以下內容判斷，下列何者較可能是他所做出的解釋？

    聯合國大會在 1966 年決議通過《公民與政治權利國際公約》及《經濟社會文化權利國際公約》，簡稱《兩公約》，並於1976 年正式生效，簽署國均須遵守該公約的內容。我國身為國際社會的一員，在民國98
    年亦制定了《兩公約施行法》，為守護人權發展盡一分心力。'
  options:
  - label: A
    content: 各國政府參與國際組織共同制定政策
  - label: B
    content: 國際公約對未簽署的國家並無影響力
  - label: C
    content: 對人權的維護無法成為公共議題
  - label: D
    content: 人權通常是個別國家的內政問題。
  tags:
