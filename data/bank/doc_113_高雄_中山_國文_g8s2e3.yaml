  stem: '五條悟老師整理了有關《三國志》與《三國演義》的比較表。請根據表格內容，判斷誰的理解正確？


    | | 《三國志》 | 《三國演義》 |

    | :--- | :--- | :--- |

    | 作者／成書年代 | 陳壽／西晉 | 羅貫中／元末明初 |

    | 體例／性質 | 紀傳體／正史 | 章回體／歷史小說 |

    | 歷史觀 | 以「曹 魏」為正統 | 以「蜀 漢」為正統 |

    | 內容特色 | 資料嚴謹可靠，內容與敘事俱簡潔 | 藉歷史人物褒忠貶奸，表彰忠孝節義 |'
