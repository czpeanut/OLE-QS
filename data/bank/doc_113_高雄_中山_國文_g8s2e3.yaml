  stem: 根據本文，徐庶離開劉備的主要原因是什麼？
  options:
  - label: A
    content: 因為母親被曹操囚禁，他決定離開以免洩露軍機
  - label: B
    content: 母親遭曹操拘禁，徐庶不得不離去以盡人子之道
  - label: C
    content: 劉備將遠遁山林，徐庶覺得無法再圖霸業有所作為
  - label: D
    content: 劉備將訪孔明，徐庶自愧不如孔明才學，黯然離去
  group_stem: "玄德1 聞言，大哭曰：「母子乃天性之親，元直2 無以備為念。待與老夫人相見之後，或者再得奉教。」徐庶便拜謝欲行。玄德曰：「乞再聚一宵，來日餞行。」孫乾密謂玄德曰：「元直天下奇才，久在新野，盡知我軍中虛實。今若使歸曹操，必然重用，我其危矣。主公宜苦留之，切勿放去．操見元直不去，必斬其母。元直知母死，必為母報讎，力攻曹操也。」玄德曰：「不可。使人殺其母，而吾用其子，不仁也；留之不使去，以絕其母子之道，不義也。吾寧死，不為不仁不義之事。」眾皆感歎。玄德請徐庶飲酒，庶曰：「今聞老母被囚，雖金波玉液，不能下咽矣。」玄德曰：「備聞公將去，如失左右手，雖龍肝鳳髓，亦不甘味。\n\
    \  二人相對而泣，坐以待旦。諸將已於郭外安排筵席餞行。玄德與徐庶並馬出城，至長亭，下馬相辭。玄德舉杯謂徐庶曰：「備分淺緣薄，不能與先生相聚，望先生善事新主，以成功名。」庶泣曰：「某才微智淺，深荷使君重用。今不幸半途而別，實為老母故也。縱使曹操相迫，庶亦終身不設一謀。」玄德曰：「先生既去，劉備亦將遠遁山林矣。」庶曰：「某所以與使君共圖王霸之業者，恃此方寸耳。今以老母之故，方寸亂矣，縱使在此，無益於事。使君宜別求高賢輔佐，共圖大業，何便灰心如此？」玄德曰：「天下高賢，無有出先生右者。」諸將無不傷感。玄德不忍相離，送了一程。又送一程。庶辭曰：「不勞使君遠送，庶就此告別。」玄德就馬上執庶之手曰：「先生此去，天各一方，未知相會卻在何日！」說罷，淚如雨下。庶亦涕泣而別。\n\
    \  玄德立馬於林畔，看徐庶乘馬與從者匆匆而去。玄德哭曰：「元直去矣！吾將奈何？」凝淚而望，卻被一樹林隔斷。玄德以鞭指曰：「吾欲盡伐此處樹木。」眾問何故。玄德曰：「因阻吾望徐元直之目也。」\n\
    \  正望間，忽見徐庶拍馬而回。玄德曰：「元直復回，莫非無去意乎？」遂欣然拍馬向前迎問曰：「先生此回，必有主意？」庶勒馬謂玄德曰：「某因心緒如麻，忘卻一語。此間有一奇士，只在襄陽城外二十里隆中。使君何不求之？」玄德曰：「敢煩元直為備請來相見。」庶曰：「此人不可屈致，使君可親往求之。若得此人，無異周得呂望、漢得張良也。」玄德曰：「此人比先生才德何如？」庶曰：「以某比之，譬猶駑馬並麒麟、寒鴉配鸞鳳耳。此人每嘗自比管仲、樂毅；以吾觀之，管、樂殆不及此人。此人有經天緯地之才，蓋天下一人也。」\n\
    \    玄德喜曰：「願聞此人姓名。」庶曰：「此人乃瑯琊 陽都人，複姓諸葛，名亮，字孔明。乃漢司隸校尉諸葛豐之後。其父名珪，字子貢，為泰山郡丞，早卒。亮從其叔玄。玄與荊州\
    \ 劉景升有舊，因往依之，遂家於襄陽。後玄卒，亮與弟諸葛均躬耕於南陽。嘗好為〈梁父吟〉。所居之地，有一岡，名臥龍岡，因自號為臥龍先生。此人乃絕代奇才，使君急宜枉駕見之。若此人肯相輔佐，何愁天下不定乎？」玄德曰：「昔水鏡先生曾為備言：『伏龍、鳳雛，兩人得一，可安天下。』今所云莫非即伏龍、鳳雛乎？」庶曰：「鳳雛乃襄陽\
