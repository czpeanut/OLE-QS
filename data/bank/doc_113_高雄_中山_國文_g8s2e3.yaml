  - label: B
    content: 伏黑惠：兩本書的歷史觀不同，相互參照後有助於更全面認識三國時代的事件與人物
  - label: C
    content: 釘崎野薔薇：《三國演義》人物刻劃突出，曹操的奸詐、關羽的忠義等形象影響後世甚深
