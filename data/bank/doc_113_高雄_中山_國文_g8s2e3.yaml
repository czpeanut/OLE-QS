- id: doc_113_高雄_中山_國文_g8s2e3_s2_33
  section: 2
  number: 33
  type: single
  page: 6
  stem: 以下對於雲的諸多描寫，何者屬於客觀描寫？
  options:
  - label: A
    content: 我想那雲朵像極了舞者，將藍天當成舞臺，恣意的在上頭揮灑絕佳的舞技
  - label: B
    content: 有時候真的像極了可口清涼的霜淇淋，讓人忍不住想飛上天咬一口
  - label: C
    content: 前一秒鐘雲層湧動形成厚實一片雲海，覆蓋整座山谷，過一會兒已煙消雲散，恢復青山翠綠風采
  - label: D
    content: 它們就像是具有昂揚生命力的精靈，蹦蹦跳跳喳喳呼呼的不斷舞動身姿 。
  group_stem: "秋天的天空，藍得像是一片海洋，走在落葉繽紛的街道上，仰頭欣賞著那無盡的虛空，那層層藍色便如海水般盈滿所有視線。鑲嵌於上的朵朵白雲，此刻呈現仙女散花似的延伸，曼妙玲瓏的姿態彷彿在舞出一場淋漓盡致的劇目，湛藍與雪白的明顯輝映與襯托，及雲朵不斷變化身形的絢爛光景，儼然是一幅渾然天成美麗無比的圖畫，往往讓人目眩神迷，不得不讚嘆大自然的神奇緻麗。\n\
    \   我想那雲朵像極了舞者，將藍天當成舞臺，恣意的在上頭揮灑絕佳的舞技，一會兒旋轉柔軟身體，一會兒跳躍美妙的舞姿，這一刻飛舞在山這頭，下一刻便又躍升到遙遠天際。它們還不斷變化隊形，有時獨舞，有時集體創作，有時綿密緊依，有時散落各處，整個天空都是雲朵舞動的空間，一輪隱約月白有時也來客串演出，是偌大劇目最佳陪襯。\n\
    \   從有記憶以來，便極喜愛對著天空發呆，揣想浩瀚宇宙無窮無盡，充滿了各種想像與可能。放學回家，在令人昏昏欲睡的夏日午後，坐在家中院子，抬起頭與玩伴們玩著雲朵拼圖遊戲，想像著一朵朵形狀樣式相異的雲塊，是一隻小貓、一隻小綿羊、一隻大恐龍，還是一杯冰淇淋、一串棉花糖……，任憑想像力無限延伸帶來許多童年樂趣。夏天的雲，綿密細緻，經常是一大朵一大朵獨自飄動，有時候真的像極了可口清涼的霜淇淋，讓人忍不住想飛上天咬一口。\n\
    \   每一個季節、每種天候都有形狀質地不同的雲，小時候讀的地理課，將雲類分成四個家族，有低雲族、中雲族、高雲族及直展雲族，再細分為層雲、卷雲、積雲等種類。記得卷雲及卷層雲是變化最多最美麗的雲相，像喜愛在天上跳舞的秋雲就是屬於卷雲，它的高度在一萬公尺以上，是君臨在上睥睨天下的雲種，它的質地細緻而分散，像羽毛、頭髮、亂絲或馬尾，姿態千變萬化，在清晨日出或黃昏日落時，因為位置極高便會印染上橘紅色柔和的太陽光線。如果仔細觀看，它們就像是具有昂揚生命力的精靈，蹦蹦跳跳喳喳呼呼的不斷舞動身姿。有時，也像仙女的魔棒，所到之處撒下魔幻金粉，帶給觀者無窮盡的驚奇。\n\
    \   去年回臺灣時，去了一趟清境農場，我們住在一家歐洲式城堡民宿，不是很寬敞的房間卻有著超大乾淨明亮的落地窗。清晨起床，打開窗簾，赫然瞧見一片片雲朵便在窗外流動，彷彿下榻的地方不在地球表面而在雲端上，一伸出手便能掬起滿掌雲彩，過起了神仙生活。山中雲朵變化速度極快，前一秒鐘雲層湧動形成厚實一片雲海，覆蓋整座山谷，過一會兒已煙消雲散，恢復青山翠綠風采。當雲霧在面前飄忽飛舞，帶來朦朦朧朧意境，人似乎也跟著清明靈動起來。\n\
    \  抬頭仰望藍天，有時晴空萬里，有時風起雲湧，不管是棉絮般柔軟的白雲，呈波浪渦流狀或如棋盤、魚鱗、羽扇、綿羊捲曲狀雲層，在陽光反折下，因高度、質地、結構的不同，各自展現或壯觀或精巧或眩目的風貌。在觀雲時刻，覺得天地何其浩渺，胸中塊壘豁然開朗，不再為小傷小痛而悲情。人生際遇變化無常，不就如天際雲彩，瞬息萬變，難以掌控捉摸，世間種種翻騰好比過眼雲煙，倏忽消逝，耀眼明亮時值得喝采，黯淡孤獨時，也是另種人生歷程。一切風輕雲淡，自如自在，天地自然體現了無常的道理，無須執著擁有或失去，沒有什麼是永恆不變，也許不斷的變動才是唯一不變的真理。\n\
    \   「我是天空裡的一片雲，偶爾投影在你的波心──你不必訝異，更無須歡喜──在轉瞬間消滅了蹤影。」徐志摩膾炙人口的詩句描述的雖然是愛情，但也貼切的點出生命如浮雲，在不停的變異中如實展現各自獨特本質。此刻對著天空呆想的我，已非當年玩著冰淇淋、小綿羊雲朵遊戲的小女孩，看雲的姿態未變，心態在時間及種種歲月行旅的發酵下已起了化學變化，少了些童稚的純真，多了些成熟的了然，但歡喜讚嘆的心卻總是在的。呼嘯而過的日子，從不曾真正離去，只是換種風情繼續在天涯響遏行雲，見證一切。\n\
    ──曉亞〈看雲的日子〉"
