    \     毛利王族的歷史可追溯至一百六十多年前，且在紐西蘭政壇扮演舉足輕重的地位。不過，現年五十歲的瑪胡塔並非紐西蘭首位毛利族外交部長，前任外交部長彼德斯也是毛利族人，但他沒有紋面。瑪胡塔的紋面具有強大的賦權意義，「在國際層面展現紐西蘭文化，人們看得到毛利人的重要性，讓毛利人擔任此角色更能凸顯其差異性。紋面承載了她祖先的標記，並向人們展現，毛利人的發展不受限制。」毛利電視臺政治記者艾倫這樣說。（改寫自陳韻涵\
    \ 紐西蘭新內閣組成多元：紋面毛利人任外交部長）"
