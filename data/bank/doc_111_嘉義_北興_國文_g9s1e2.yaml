  - label: D
    content: 小米酒的由來。
  group_stem: 「相傳在三、四百年前，祖靈派遣一隻小鳥叼來了小米的種子，從此泰雅族才開始種植小米。為感謝祖靈，泰雅族人每年都會釀製小米酒以獻祭祖靈。小米酒在泰雅傳統是十分珍貴的飲料，主要是在祭典中使用，味道清甜帶有小米香味，風味非常特別。熱情豪爽的泰雅族把喝酒當作誠懇待人之道，衍生出稱為『柯和吉』的共飲文化，以表達人與人之間的和睦相處，及相互祝福之意。」(文章來源綱路)
  tags:
