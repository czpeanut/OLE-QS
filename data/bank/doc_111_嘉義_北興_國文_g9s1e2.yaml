  type: single
  page: 1
  stem: 清心苦味：「阿媽說的道理，我可是花了好多好多年頭後才逐漸明白，而當我明白時，我也同時發現自己的青春已一去不復返了。」當作者明白阿媽所說「苦可清心」的道理時，卻也發現自己的青春早已逝去，這裡頭抒發了什麼感受？
  options:
  - label: A
    content: 歡喜體悟老一輩的真理，令人再三回味
  - label: B
    content: 感慨年歲稍長有人生歷練，才能有所成長
  - label: C
    content: 惋惜自己沒有及時行樂，讓時間匆匆流逝
  - label: D
    content: 感嘆青春不等人，當下的自己仍一事無成。
  lesson_raw:
    title: 清心苦味
    basis: 題幹引用清心苦味課文原句
  tags:
