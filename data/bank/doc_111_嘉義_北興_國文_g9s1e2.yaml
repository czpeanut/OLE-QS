    | 選項 | 人物 | 舜 | 傅說 | 膠鬲 | 管仲 | 孫叔敖 | 百里奚 |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | (Ａ) | 背景 | 歷山耕田 | 築牆 | 市場奴隸 | 輔佐大臣 | 賣魚鹽 | 住海濱 |

    | (Ｂ) | 身份 | 農人 | 工人 | 小販 | 囚犯 | 避禍之人 | 奴僕 |

    | (Ｃ) | 伯樂 | 堯 | 殷高宗 | 紂王 | 公子小白 | 楚莊王 | 秦穆公 |

    | (Ｄ) | 旨意說明 | 寶劍鋒從磨礪出，梅花香自苦寒來 吃得苦中苦，方為人上人 |'
  options:
  - label: A
    content: 背景：舜（歷山耕田）、傅說（築牆）、膠鬲（市場奴隸）、管仲（輔佐大臣）、孫叔敖（賣魚鹽）、百里奚（住海濱）
  - label: B
    content: 身份：舜（農人）、傅說（工人）、膠鬲（小販）、管仲（囚犯）、孫叔敖（避禍之人）、百里奚（奴僕）
  - label: C
    content: 伯樂：舜（堯）、傅說（殷高宗）、膠鬲（紂王）、管仲（公子小白）、孫叔敖（楚莊王）、百里奚（秦穆公）
  - label: D
    content: 旨意說明：寶劍鋒從磨礪出，梅花香自苦寒來 吃得苦中苦，方為人上人
