  group_stem: 這真是一個多采多姿的年代，每天我們都有看不完的訊息，學習不完的知識，不僅很多都是免費的，還會自己搶著送上門。你高興訂閱什麼粉絲頁就訂閱什麼粉絲頁，你高興加誰好友就加誰好友，相較於過往我們的訊息容易被少數主流媒體壟斷，這個時代的新媒體概況，似乎提供了一種救贖，好像讓我們獲得了解放。但是長久以來所累積的經驗法則也告誡過我們「免費的最貴」，這是個屢試不爽的硬道理，所以美好的人生真的有透過這種媒體型態的改變來獲得嗎？相信所有深諳社群媒體背後那套演算法運作的人，應該都不會這麼地樂觀，因為這些無所不在的社群媒體網絡正在用一套全新的模式支配我們每一個人對於訊息的獲得。
    (文章來源自學二)
  tags:
    textbook: 第五冊（九上）第2次段考範圍
    labeled_by: ai
