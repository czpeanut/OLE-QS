  stem: 下列關於各文的敘述，何者正確？
  options:
  - label: A
    content: 生於憂患死於安樂：表達先天下之憂而憂，後天下之樂而樂的道理
  - label: B
    content: 清心苦味：由行文中得知懂得欣賞苦味的人，更能體會人生的課題，不認為吃苦是苦差事。
