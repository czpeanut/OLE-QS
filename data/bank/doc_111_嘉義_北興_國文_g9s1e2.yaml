- id: doc_111_嘉義_北興_國文_g9s1e2_s4_30
  section: 4
  number: 30
  type: single
  page: 4
  stem: 下列何者是接受「莫克紋面」的毛利原住民應注意的事項？
  options:
  - label: A
    content: 應要勇於參與政治，包含競選國會議員
  - label: B
    content: 必須遵守許多神聖的禮節
  - label: C
    content: 必須在國際上推廣毛利王族的歷史
  - label: D
    content: 必須在社會上發揮舉足輕重的影響力。
  group_stem: "紐西蘭於二○二○年十月舉行大選，計票一度因新冠肺炎疫情惡化而暫停，選舉結果出爐，總理阿爾登的政黨大獲全勝，新內閣成員組成也堪稱全球最多元，包括首位紋面的毛利原住民外交部長瑪胡塔、首位出櫃的副總理羅伯森，以及首位非裔難民後裔議員等。二○一六年瑪胡塔在女兒的鼓勵下，接受毛利傳統刺青「莫克紋面」，成為紐西蘭首位下巴紋面的國會女議員。「莫克紋面」具有極大象徵意義，圖騰涵蓋紋面者的祖先、歷史與地位等訊息，紋面也有許多神聖的禮節必須遵守。\n\
    \     毛利王族的歷史可追溯至一百六十多年前，且在紐西蘭政壇扮演舉足輕重的地位。不過，現年五十歲的瑪胡塔並非紐西蘭首位毛利族外交部長，前任外交部長彼德斯也是毛利族人，但他沒有紋面。瑪胡塔的紋面具有強大的賦權意義，「在國際層面展現紐西蘭文化，人們看得到毛利人的重要性，讓毛利人擔任此角色更能凸顯其差異性。紋面承載了她祖先的標記，並向人們展現，毛利人的發展不受限制。」毛利電視臺政治記者艾倫這樣說。（改寫自陳韻涵\
    \ 紐西蘭新內閣組成多元：紋面毛利人任外交部長）"
  tags:
    textbook: 第五冊（九上）第2次段考範圍
    labeled_by: ai
