- id: doc_111_嘉義_北興_自然_g9s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 在一含有電池、導線和小燈泡的電路中，由電池提供電壓使電子流動而造成燈泡發亮。關於電子在此電路中的敘述，下列何者正確？
  options:
  - label: A
    content: 電子在正極比在負極具有較高的電能
  - label: B
    content: 電子從電池正極出發經由導線回到電池負極
  - label: C
    content: 電子在導線傳輸的過程中，能量損耗在導線與小燈泡上
  - label: D
    content: 回到負極的電子必須經由電池內部的化學反應產生能量。
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 理化
      code: 1-2
      title: 生活用電
      chapter: 第1章 電與生活
