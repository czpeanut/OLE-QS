    W 充電器，若同時使用這些電器，儘管計算出的電流低於安全容量，但這樣作法卻仍有危險性。因為延長線會隨著使用時間增加而逐漸老化，而內部的銅線氧化會使得電阻增加，當大量的電流流經延長線時，由於電流的熱效應，將使得電線溫度升高。尤其當延長線纏繞在一起時，散熱不易，有時才經過幾分鐘，溫度就從室溫升高至九十幾度，導致電線外皮融毀而起火。
