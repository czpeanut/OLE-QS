- id: doc_111_嘉義_北興_自然_g9s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '下表為甲、乙兩款省電燈泡所使用的電壓及其電功率。若兩燈泡正常使用 100 小時，甲消耗的電能為 $X_{甲}$ 度；乙消耗的電能為 $X_{乙}$
    度，則下列關係式何者正確？


    | 燈泡款式 | 甲 | 乙 |

    | :--- | :---: | :---: |

    | 電壓（V） | 110 | 220 |

    | 電功率（W） | 23 | 23 |'
  options:
  - label: A
    content: $X_{甲}＝X_{乙}$
  - label: B
    content: $X_{甲}＝3X_{乙}$
  - label: C
    content: $X_{甲}＝6X_{乙}$
  - label: D
    content: $3X_{甲}＝X_{乙}$。
