  section: 7
  number: 5
  type: single
  page: 3
  stem: Which big cat is a social animal?
  options:
  - label: A
    content: A tiger.
  - label: B
    content: A cheetah.
  - label: C
    content: A lion.
  - label: D
    content: A leopard.
  group_stem: 'Big cats are beautiful wild animals. Let’s find out

    something interesting about them. The cheetah has long

    legs and a long tail. It is called the fastest land animal.

    Long legs and tails help cheetahs run quickly. The tiger is

    the biggest of all the big cats. It is much bigger than the

    cheetah. Leopards are the smallest of the big cats. They are

    good at climbing. The leopard may look small, but it has

    lots of power. Jaguars come from America. They have

    cool spots and have the strongest bite of all the big cats.

    They are known to eat more than 85 species of prey,

    including deer, squirrels, birds, and even snails. A lion

    lives with its family and has no fear of other animals.

    Female lions give birth to baby lions. What’s more, mother

    lions do most of the hunting. They hunt for as a group and

    bring food back for the pride, their family. As for male

    lions, they sleep a lot to save energy and keep cool. Male

    lions protect the pride. Therefore, people say that a lion is

    the king of the jungle. These facts about the big cats are

    amazing, aren’t they?

     wild 野生的；cheetah 獵豹；leopard 豹；

    power力量 ; jaguar 美洲豹；spot 斑點 ; fear 害怕

    species 種類； prey 獵物 ； including 包括

    deer 鹿； squirrel 松鼠； snail 蝸牛；pride 獅群'
