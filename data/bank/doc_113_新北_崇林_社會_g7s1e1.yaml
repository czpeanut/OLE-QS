  stem: 請選出最適合本資料的標題。
  options:
  - label: A
    content: 紐西蘭毛利人向外擴散足跡報導
  - label: B
    content: 紐西蘭毛利人尋找音樂靈感的報導
  - label: C
    content: 阿美族歷史的延續報導
  - label: D
    content: 紐西蘭毛利人的尋根之旅
  group_stem: '自由時報 2012/11/20 紐西蘭毛利人 拜訪阿美族「兄弟」

    「我們回家了！」兩名紐西蘭毛利族語言學者來到台灣，直奔阿美族太巴塱部落，見到部落Kakitaan 祖祠的形制和毛利人的聚會所幾乎完全相同，就連語言、傳說都類似，他們流淚唱起毛利人禱歌，向祖先報告「我們回來了」！部落頭目王成發盛裝迎接，見到「兄弟」來訪，也感動流淚。

    語言與建築相隔千里竟相似。

    語言學研究顯示，台灣很可能是毛利人的源頭，紐西蘭威靈頓維多利亞大學的毛利族女教授Te Ripowai Higgins、毛利語教師Winiata Vincent
    Whare 十七日抵台，參加語言研討會，傳授毛利語從瀕臨滅絕到復振的三十年經驗，會議還沒開始，兩人就帶著孺慕之情，直奔太巴塱部落。

    兩位毛利族人一到部落，看見Kakitaan 祖祠建築形式和屋內祖靈柱雕刻，竟與毛利人部落的聚會所幾無二致，當場問前來迎接的太巴塱部落頭目王成發：「能不能在這裡唱毛利人的禱歌？」開口唱沒二句，他們倆淚水潸潸，直呼：「我們回家了！」'
