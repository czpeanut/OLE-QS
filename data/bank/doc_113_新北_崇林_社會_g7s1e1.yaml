  group_stem: "◎題組一：請回答39~42 題\n 「小紅帽」臉書(facebook)粉絲專頁中介紹小紅帽是臺灣第一個專注於推動月經平權的非營利組織，創辦人林薇致力於透過社福、教育、研究、倡議消弭月經貧窮與汙名，也在全臺灣推動從小學到大學，更全面、完整、不分性別的月經教育，及營造月經友善環境。\n\
    \ 全球小紅帽協會創辦人林薇表示：「我們希望以後衛生棉拿出來，掉在地上不再是一件會讓人嘲笑的事情，月經來了想要請生理假，不再是一件難以啟齒的事。」\n月經貧窮（Period\
    \ Poverty）指的是因經濟困境，導致無法負擔或取得足夠且適當的生理用品，進而造成生理疾病並破壞心理健康，生活陷入長期受影響的狀態。\n 根據調查顯示，在臺灣約有9%的人曾陷入月經貧窮的困境，在購買生理用品與其他日常必需品中，出現兩難的情況；更有14%的人，因無法負擔購買生理用品所需的花費，而長期感到壓力。\n\
    \ 2020 年蘇格蘭通過《生理用品免費供應法》，成為全世界第一個全境免費提供生理用品的國家；紐西蘭為終結月經貧窮、避免學生受教權受損，自2021 年6 月起，在各級學校為學生免費提供生理用品；日本於2021\
    \ 年3 月公布，對無力購買生理用品、陷入月經貧窮的女性提供免費生理用品。我國教育部自2023 年8 月1 日起實施「友善提供多元生理用品計畫」，針對各級學校有需要的學生發放多元生理用品，規劃適性友善的發放方式。"
