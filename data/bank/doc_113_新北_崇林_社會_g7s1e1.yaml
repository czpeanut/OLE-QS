  type: single
  page: 1
  stem: 歷史是過去發生的事,是對過去的紀錄,是過去留下的遺跡以及對過去的解釋,為了掌握事情的變遷,歷史紀錄必須標註時間,以便明白事情發生的先後與因果關係。請問下列關於紀年方式的描述,何者「正確」?
  options:
  - label: A
    content: 西元紀年是以傳說上帝誕生年作為紀年的開始
  - label: B
    content: 中國傳統以 10 天干和 12 地支的組合來紀年,每 120 年為一週期(一甲子)
  - label: C
    content: 民國紀年是由中華民國頒布的紀年方式,以西元 1912 年為民國元年
  - label: D
    content: 帝王紀年是以君主的年號來紀年，例如同治二十年甲午戰爭爆發。
