    \ \n    「觀光」一直是日本很重要的經濟來源，據統計2024 上半年入境日本人數達到1,777 萬人次突破歷史新高。旅遊不能少了買伴手禮、紀念品等消費，今年截至目前為止日本財政光是退稅所支出的金額以來到破千億日元。越來越低的日幣匯率、百貨公司針對外國觀光客的優惠折扣，使飛日本買精品成為時下趨勢，以精品包為例與台灣專櫃價格相比足足就差了7\
    \ 折之多，日幣的疲軟使觀光客購買奢侈品能享有極大的折扣。根據線上資料統計，今年日本奢侈品市場有望產生至少323 億美元的收入，且每年將增長4.69%個百分點為基準。\
    \ \n    當然不只在奢侈品上，從藥妝、服飾、維他命、玩具再到包裝精緻的伴手禮，無一不成為外國觀光客掃貨的重點，過去，在商店內只要買滿5,000~5,500\
    \ 日圓，即可於店上或是百貨公司免稅服務台出示護照即時退稅，而服務人員便會以密封包裝與防破壞封條將商品完整包好，目的是為了防止旅客將免稅商品於境內兜售。每次退稅民眾可收到10~20%的消費稅，相當於購買商品能享有八至九折的優惠。雖說一再強調免稅品不可於國內拆封使用與販售，但實際在機場遇到抽驗的機會根本微乎其微，因此低抽驗率便成為有心人士圖利的管道。日本海關於機場對於購買價值1\
    \ 億日圓（約台幣2,203 萬元）以上免稅品的近400 人，隨機挑選當中的六分之一人，最終結果竟然只有1 人把退稅品帶出境，其餘已在日本當地將商品已轉售，光是此次抽驗就預計將討回18.5\
    \ 億日圓的消費稅。 \n    除了奢侈品上有逃稅情形發生，今年年中台灣人最愛的藥妝店「大國藥妝店」也傳出逃稅事件，位在大阪中央、道頓堀兩家分店被檢舉，刻意放水給不符合免稅資格的「買手」，長期累計下來金額已達到3\
    \ 億日圓以上。隨著此次事件被揭發，旅客最愛的電器賣場Bic Camera 也傳出類似事件，為落實退稅制度Bic Camera 主動加裝偵測系統，在免稅結帳時如果消費者過去有轉賣的紀錄將會出現警示。\
    \ \n    日本政府為有效打擊轉賣、消費稅漏洞等詐欺行為，將於2025 年取消「即買即退稅」的服務，將效法歐洲國家延後免稅制度，統一在出關前於機場辦理，民眾可選擇退到信用卡內，或是實領現金等選項。目前內閣會議上已針對稅制修正大綱中，確定明年飛日本將有全新的退稅制度，不過為考量到本就塞到不行的機場將會更塞，因此更妥善的制度仍在研擬中。\
    \ \n \n       網路新聞2024.8.26 日本逃漏消費稅半年破千億！2025 年取消「現買現退」，全新退稅新制統一機場辦理"
