  group_stem: "予客建業①，見有畜波斯魚者，俗訛為師婆魚。其大如指，鰭鬣②具五采③，兩腮有小黑點如黛④，性矯悍善鬥。人以二缶⑤畜之，折藕葉覆水面，飼以蚓或蠅，魚吐泡葉畔，知其勇可用。乃貯水大缶，合之。各揚鰭鬣相鼓視，怒氣所乘，體拳曲如弓，鱗甲變黑。久之，忽作秋隼⑥擊，水泙⑦然鳴，濺珠上人衣。連數合，復分。當合，如矢激弦，絕不可遏。已而相糾纏，盤旋弗解。其一或負，勝者奮威逐之。負者懼，自擲缶外，視其身純白云。\
    \ \n  予聞有血氣者必有爭心。然則斯魚者，其亦有爭心否歟？抑⑧冥頑不靈而至于是歟？哀哉！然予所哀者豈獨魚歟？          \n         \
    \                                                                            \
