  group_stem: "(一) 迷你戰爭 \n    古時候，有一個官吏想排擠他的同僚，向老謀深算的師爺問計。師爺問：「其人最近的言行舉止如何？」 \n「他的工作辛勤，但表情輕鬆；他的生活清苦，但操守廉潔；他的處境孤單，但不求聞達。」\
    \ \n師爺搖頭說：「毫無辦法，你現在打不倒他。還是忍耐一下，以後再說吧！」 \n三年以後，蓄意發動攻勢的一方又來找師爺商量。師爺又問對方的言行舉止。回答是：「對方工作辛勤，但表情煩惱；操守廉潔，但言談偏激；不求聞達，只飲酒博弈。」\
    \ \n「情況大有進展，露出一線希望。不過，你想除掉他，目前還言之過早。」師爺說。 \n    又是過了三年，舊話重提。那個被放在計算機裡的人此時的景況是「表情倔強，言語沉默，縱酒享樂。」師爺說：「是時候了！他已經覺得不耐煩。他開始感覺不值得。他有了絕望和自暴自棄的心情。他必然焦躁易怒，甘居下流。你的機會來了！」\
    \ \n「我應該怎麼辦？」 \n「第一，設法刺激他，常常給他一些小小的杯葛，他會受到別人看不出來的傷害。」 \n「第二，利用各種機會告訴你的同事、長官，說他是個多疑善妒的人，使他沒有對象可以訴苦。」\
    \ \n「第三，對他製造較大的爭執，使他崩潰。」 \n「然後呢？」 \n「然後你就成功了！不過，你要永遠記住你是怎樣成功的。一個人什麼時候覺得不耐煩、不值得，他的前途已到終站，他已難以適應他賴以生存的環境。」\
    \ \n    這人依計而行，果然奏效。爲了記取這一戰役的寶貴經驗，他寫了幾句話放在案頭： \n任勞不任怨，無功；任怨不任勞，無用。 \n \n(二) 焦尾琴\
    \ \n    傳說有人拿桐木當柴燒，蔡邕經過爐旁，聽見火裂之聲，知道這塊桐木是製造樂器的上等材料，就立即把沒有燒完的半截木柴從火裡抽出來，交給良工做琴。桐木的長度恰合琴身的需要，不過琴尾必須留下燒焦的痕跡。這張琴，就叫「焦尾琴」。這個故事教給我們的是當機立斷。蔡邕如果稍稍遲疑片刻，讓桐木多燒一會兒，剩下的長度就不夠製琴之用了。琴尾的焦痕代表一位音律專家的果決。「果決」曾經為世界保全了許多美好的事物。\
    \ \n    從這個角度看，人生原是一種不斷的選擇：種瓜還是種豆？取魚還是取熊？有人為自己選擇，有人為一家選擇，有人為一群選擇，負重責大任的人為一國選擇。每一種選擇都有後果，每一種後果都需要有人承擔，果斷的人能夠毫不膽怯地負起這種責任來。郵輪在海上航行，第一艙忽然進水，船長派兩名水手入艙潛水勘察船底，人還沒有回來，第一艙水已漲滿，即將溢入第二艙，這時需要有一個人為全船作一選擇，斷然下令封閉第一艙的艙門，這人當然是船長。果決的反面是因循。因循是積累問題，不加解決，日久「沉澱」成為潛在的危機。潛在的危機有一天表面化，那就是「當斷不斷反受其亂」了。亞歷山大大帝深明此理，有人請他解一團百年無人能解的死結，他是一劍劈開的。\
