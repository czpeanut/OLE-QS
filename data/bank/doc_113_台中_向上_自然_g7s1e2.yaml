  stem: '小夫在生物實驗室找到兩杯溶液 (溶液X 與溶液Y)，他利用了下列四種方法想分析出兩杯溶液為何，將甲乙丙丁四組配置完畢後，置於實驗桌上 30 分鐘，再滴入碘液觀察顏色呈現。請問溶液X
    與溶液Y 最可能是以下何者？

    | 組別 | 添加物質 | 滴入 | 顏色呈現 |

