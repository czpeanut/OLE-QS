    | 甲組 | X+葡萄糖液 | 碘液 | 藍黑色 |

    | 乙組 | X+澱粉液 | 碘液 | 藍黑色 |

    | 丙組 | Y+葡萄糖液 | 碘液 | 黃褐色 |

