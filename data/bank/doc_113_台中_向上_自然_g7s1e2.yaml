  section: 1
  number: 18
  type: single
  page: 1
  stem: 今天晚餐，阿星吃了五根水煮玉米；小刀吃了清蒸鱈魚配茶葉蛋；達叔吃了綜合堅果佐油醋醬；大軍吃了西瓜芒果香蕉剉冰。下圖最可能是誰體內養分未消化分子含量的變化圖？
