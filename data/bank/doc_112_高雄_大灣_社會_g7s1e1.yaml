  group_stem: "臺灣的貿易爭霸\n    1624 年荷蘭人占領臺灣以後，由於防衛、築城的經費造成東印度公司的財務負擔，打算向在島上從事轉口貿易的日本商人開徵稅收。日人指稱在平戶的荷蘭商館無需繳稅，因此在臺的日本商人也不應繳稅，荷、日兩國為此爆發衝突。1626\
    \ 年，日本商人濱田彌兵衛率船到臺灣購買生絲，荷蘭首任臺灣長官宋克限制他們的行動。\n    1627 年7 月，濱田偷偷拐跑了16 名新港社的土人，帶著他們回日本，向貿易商末次平藏報告荷蘭人的態度。末次心懷憤慨，將16\
    \ 名臺灣土人打扮成使者模樣，獻給前將軍德川秀忠和現將軍德川家光，並報告荷蘭人的行為。荷蘭新任駐臺長官彼得．努易茲（Pieter Nuyts）聽到濱田跑了，怕誤了荷蘭在日本的商業利益，匆匆趕去江戶（今東京），求見德川家光，但是將軍拒見，勒令努易茲迅即離開日本，荷、日糾葛一時難以排解。\n\
    \    1628 年春天，濱田又率船三艘到臺灣，努易茲懷恨，將他帶回的新港社土人和濱田本人扣押起來，三個月不釋放。濱田怒極，趁努易茲不備向他發動襲擊，闖進他的官舍，以刀相抵，脅迫他交換人質，共同前往日本，並賠償損失。努易茲不得不屈服，將兒子與濱田之子互質，送去日本，並賠償了濱田一萬多斤生絲。但是，濱田回到日本，立即變卦，將荷蘭人的人質扣在長崎，幕府也下令封閉平戶荷蘭商館。\n\
    \    最後是荷蘭東印度公司在印尼巴達維亞的總部屈從於對日的貿易利益，於1632 年將努易茲解送平戶，囚禁在一戶平民家中，交換從前被扣的人質，幕府這才應允恢復通商，消除了兩國糾纏多年的糾紛。"
