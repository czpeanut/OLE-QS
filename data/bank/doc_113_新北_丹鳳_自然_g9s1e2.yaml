  stem: '牛頓發現的萬有引力，結合牛頓第二運動定律後可以解釋天體運行。下列關於萬有引力的敘述，正確者有幾項﹖

    (甲)同是圍繞地球運行的人造衛星與月球，兩者受到地球的萬有引力相同

    (乙)任何具有質量的物體間，必存在著萬有引力

    (丙)因為質量大小的差異，所以地球對太陽的萬有引力小於太陽對地球的萬有引力

    (丁)兩磁鐵的N 極與S 極相對而互相吸引，主要是依靠萬有引力

    (戊)人造衛星繞行地球屬於等加速度運動

    (己)阿剛出大恭過程中，隨著排出的米田共越來越多，阿剛與落入糞池內便便之間的吸引力也變大'
  options:
  - label: A
    content: 2 項
  - label: B
    content: 3 項
