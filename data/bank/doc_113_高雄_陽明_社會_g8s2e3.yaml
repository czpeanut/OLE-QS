    content: 《兒童及少年福利與權益保障法》。
  group_stem: '(三)請閱讀下列新聞內容，回答第46 至47 題：


    「創意私房會員」北市狼師偷拍少女9 年 求交保再押2 月

    台中地檢署偵破創意私房性影像網站，自大量會員中抓到台北市陳姓補習班老師，發見他利用教職近9 年來對國小、國中女學童偷拍，至少30 人受害，痛批他愧對「教師」身分，起訴求刑15
    年；陳主張已和3 人和解賠償請求交保，法院仍裁定他再延押2 月。檢方統計，陳男偷拍人數多達30 名女子，包括25名未成年人，陳還將偷拍影像用AI 合成傳到社群Telegram
    上群組分享；檢方搜索陳住處、學校，查扣電腦、手機，隨身碟，還有自製的寶特瓶密錄器、芳香劑造型密錄器，依【甲】法等起訴他，求刑15 年。

    全案目前審理中，台中地院指出陳男坦承全部犯行，有事證可佐其嫌疑重大，且所犯為重罪有相當逃亡之虞，且審酌他身為教師，竟濫用職業機會與被害人信任，自2015 年至2023
    年間，持續多次偷拍，犯罪時間長、被害人數多，有羈押必要。

    陳男及其辯護人主張，已和3 名被害人和解、全數賠償，希望在入監前陪伴幼女、年邁雙親，實在沒有逃亡動機，請求停止羈押並交保。法院表示，陳男和3 名被害人和解，對方也撤告，因此再開辯論庭審理，考量陳犯罪數甚多，預期將來可能面臨刑期非短暫，仍有逃亡之虞，加上他嚴重危害多名少女身心，依目前訴訟程序仍認有羈押必要，裁定自4
    月13 日起，延長羈押2 月。

    新聞資料來源:聯合報 2025.4.9 記者:曾健祐'
