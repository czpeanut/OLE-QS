  - label: D
    content: 找尋可以食用的食物。
  group_stem: '馬賽馬拉國家公園位於肯亞境內，是世界大型哺乳類動物的棲息地，與鄰近坦尚尼亞的塞倫蓋堤國家公園形成一個大型的生態保護區，數以百萬計的斑馬、牛羚、蹬羚、非洲水牛等動物每年會在兩地間遷徙，如圖9。

    12~2 月是繁殖季節，動物媽媽們聚集在塞倫蓋提南邊生下小寶寶；3~6 月啟程往北遷徙，7~10 月動物們穿越馬拉河，獵食者如獅子、獵豹等趁動物渡河進行狩獵，最終到達馬賽馬拉國家公園；11
    月後又啟程往南返回塞倫蓋提國家公園。東非動物大遷徙的壯景為「世界八大自然奇觀」之一，也為非洲生態旅遊帶來一片榮景。試回答15~16 題：'
