  group_stem: '(二)請閱讀下列選文內容，回答 43～45 題：


    在南韓的校園中，不少學生常因熬夜看書導致白天精神不濟，於是飲用咖啡來提神與增加專注力，但攝取過量咖啡因會有頭暈、心跳加速、睡眠障礙等症狀，可能不利於青少年神經及心血管系統的發育。南韓政府擔心校園內飲用咖啡的風氣，對於未來整體的國民健康、醫療資源會產生負面影響，因此修法規定自2018
    年9 月起，全面禁止在高中以下校園內販售含有咖啡因的飲料。或許臺灣人的咖啡癮還沒有南韓這麼嚴重，不過我國已有相關法令規範高中以下校園內飲品及點心的販售項目，違規販售不符規範的商品將被主管機關要求下架，以避免類似的問題在臺灣發生。'
