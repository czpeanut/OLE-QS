  group_stem: '(一)請閱讀下列新聞內容，回答 41～42 題：


    【新北國三生殺人案】涉案乾兄妹一審各判9 年、8 年，死者父親：「一定上訴」 2024/9/30

    新北市某國中郭姓三年級生去年（2023）年底持彈簧刀刺死隔壁班楊姓同學，該案今日上午一審宣判，新北地院依殺人罪判處郭生9 年徒刑、涉嫌教唆殺人的林姓乾妹8
    年徒刑。新北地院發布新聞稿說明，被告二人誤認暴力得以解決紛爭，在本不應有任何暴力發生的校園內犯案，嚴重危害校園安全，被害人寶貴性命消逝，其雙親痛失摯愛，被害人家屬請求從重量刑。考量被告家庭狀況、智識程度、犯罪動機、下手方式等情狀，且二人於少年觀護所分別經過多次諮商、晤談，已漸能覺察、反省過錯，另參考相關案件量刑，認有必要藉由較長期的機構矯正處遇，加強、調整二人的身心狀態，教育及導正其偏差觀念與行為。

    郭、林兩人的父親均出席聆判，郭父對媒體表示，該怎麼判就怎麼判，他對受害者家屬很抱歉，兒子也感到後悔。楊父輕撫著兒子使用過的書包，想起理應有著大好人生的貼心兒子，人生竟在理應安全的校園中戛然而止，不禁紅了眼眶。「法律對加害人太寬容，兒子再也沒機會活出自己的人生」，死者楊同學的姊姊是身心障礙者，近日因病住院，預計明天開刀，心焦的楊家父母在醫院陪病，未到地院聆判。楊父透過聲明稿與媒體的視訊聯訪，流淚表示對判決結果非常灰心，【甲】法對加害方太寬容，9年刑度比貪汙罪還輕，難道人命不值錢？他的兒子再也沒有機會活出自己的人生，凶殘、不知悔改且卸責的人，卻能在法律保護下重返社會。楊父批評不尊重被害者生命權的【甲】法，無疑造成被害家庭的二度傷害，「我一定上訴，這判決誰會接受？」'
