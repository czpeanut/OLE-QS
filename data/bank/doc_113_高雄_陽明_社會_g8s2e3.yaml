  stem: 【政府規定汽、機車所有人都要將車牌懸掛在指定位置】，上述政府的行政行為與下列何者最為相同？
  options:
  - label: A
    content: 百貨氣爆現場禁止人車通行
  - label: B
    content: 餐廳因食安事件遭停止營業
  - label: C
    content: 鄰居的違章建築被強制拆除
  - label: D
    content: 酒駕傷人遭監理所吊銷執照。
  group_stem: '(四)請閱讀下列選文，回答第48 至50 題：


    我國現行汽、機車車牌號碼的編碼規則，原則上每組號碼皆是由英文字母與阿拉伯數字組成，但在民意反應及諸多考量下，有些數字、英文字母或是特定組合，已不再使用於新發放的車牌。例如：數字的「4」，是因為其發音與「死」字相近，一般民眾認為觸霉頭而不願使用；英文字母的「I」、「O」不再被使用，是因為與數字「1」、「0」太相似；至於BAD、BUM、END
    等，則由於字母組合具有負面意涵，因此也加以排除。

    除此之外，政府也開放民眾可額外付費選擇號碼，有些民眾會想要擁有6666、8888、9999 等特殊號碼的車牌，因此這些號碼的價格常遠高於其他車牌；也有另一些民眾只對與生日、特殊紀念日有關的號碼組合有興趣，因此選擇購買這些特定號碼。至於不在意車牌號碼的民眾，則可接受政府發放一般組合的車牌，無需額外支付選號費。但不論最後是選擇哪一個車牌號碼，汽、機車所有人都要將車牌懸掛在指定位置，違規者將被【甲】機關依《道路交通管理處罰條例》開罰。'
