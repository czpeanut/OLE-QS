  stem: 民國 70 年代初期，臺灣電影受香港電影新浪潮的影響，進入「臺灣新電影」時期。一開始「新電影」在劇本上使用鄉土文學題材創作，拍攝風格則以自然與寫實為主軸，如王拓的短編小說《金水嬸》就曾改編成電影於民國
    76 年上映。試問：「新電影」發展最初，極有可能以下列何者作為電影題材？
