- id: doc_113_新北_板橋_自然_g7s2e2_s1_46
  section: 1
  number: 46
  type: single
  page: 4
  stem: 根據本文，為什麼鯖魚被歸類為建議食用的海鮮？
  options:
  - label: A
    content: 魚種數量充足
  - label: B
    content: 野生資源逐漸減少
  - label: C
    content: 繁殖速度慢
  - label: D
    content: 成長緩慢
  group_stem: '◎請閱讀以下文章並回答下列題目46~47：

    台灣四面環海，海鮮種類豐富，是國人餐桌上的常客。然而，在享受美味的同時，我們也應該思考：怎樣的選擇，才能同時兼顧美食與環境永續？根據台灣海鮮資源的狀況，可分為三大類型。

    首先是建議食用的海鮮，如文蛤、鯖魚、白帶魚、虱目魚等，這些魚種數量充足、繁殖速度快，且多以對環境影響較小的方式捕撈，是兼顧生態與美味的好選擇。第二類是需斟酌食用的海鮮，如白鯧、鰻魚、旗魚與進口鮭魚等。這些魚類多為野生資源逐漸減少，或其捕撈方式對棲地有一定破壞，若攝取過量，恐加速資源枯竭。最需留意的是應避免食用的海鮮，包括鯊魚、黑鮪魚、烏魚子（野生）、馬糞海膽等。這類物種通常數量稀少、成長緩慢，一旦過度捕撈，極難恢復原有數量。

    此外，不同的捕撈方式對海洋環境的影響也大相逕庭。拖網漁業是利用一個大型的網具，由漁船拖曳著在海中行進，將魚群捕撈起來，主要捕撈對象：底棲魚類（如比目魚、鱈魚）、蝦蟹類、貝類等，但因會破壞海床生態而應謹慎看待。而圍網漁業是利用一張巨大的網具，將魚群圍起來，然後收緊網底，主要捕撈對象：特定洄游魚類如鮪魚、鰹魚、沙丁魚、鯖魚而言，無直接接觸海床，對海床生態影響較小，是較可接受的捕撈方式。'
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 生物
