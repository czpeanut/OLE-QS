- id: doc_113_新北_板橋_自然_g7s2e2_s1_48
  section: 1
  number: 48
  type: single
  page: 4
  stem: 根據本文，過去亞洲小爪水獺面臨下列何種問題？
  options:
  - label: A
    content: 棲地破壞
  - label: B
    content: 環境汙染
  - label: C
    content: 過度捕捉
  - label: D
    content: 外來種引入
  group_stem: '◎請閱讀以下文章並回答下列題目48~50：

    近年來，由於社群媒體的興起，亞洲小爪水獺作為寵物的需求急劇增加，導致大量的非法盜捕和走私，特別是在東南亞和日本等地。雖然《瀕危野生動植物種國際貿易公約》(CITES)
    在 2019 年已將亞洲小爪水獺提升至禁止國際間的商業貿易，但非法買賣仍難以遏止。

    國際自然保護聯盟（IUCN）為了維護生物多樣性，維持環境的穩定，會評估生物的滅絕風險。附圖為 IUCN 評估物種滅絕風險的簡略流程，目前亞洲小爪水獺被歸類為（VU）物種。

