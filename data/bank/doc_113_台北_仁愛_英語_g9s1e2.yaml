  group_stem: 'In the early 1900s, British explorer Percy Fawcett became famous for
    his trips into the Amazon rainforest. Fawcett believed __30___ was a lost city,
    called “Z” by him, deep in the jungle. It is said that “Z” was a beautiful hidden
    city with treasures, and many explorers before Fawcett tried to find this city,
    but no one did it.

    In 1925, Fawcett went on his most famous trip with his son Jack and a small team.
    They entered the thick Amazon jungle again, ___31___. Even with lots of problems
    such as wild animals, no food, and terrible weather, Fawcett and his team kept
    moving forward and sent letters back home to let everyone know___32___.

    In one of his last letters, he said he was getting closer to the city of Z. However,
    after that, __33___. Many explore teams looked for them, but there weren’t any
    signs of how they were doing.

    Fawcett’s last trip into the Amazon rainforest became a big puzzle; however, it
    has inspired other explorers. Over the years, they have tried to follow Fawcett’s
    steps to find the lost city, but no one has been successful. Today, scientists
    see this matter in different ways. Some believe the lost city of Z might __34___
    ; however, others think that __34___.

