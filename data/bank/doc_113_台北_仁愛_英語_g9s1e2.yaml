    terms. Donald Trump’s first term was from 2017 to 2021. He ran for reelection
    but did not win. Four years after his first term ended, Trump became the president
    again.

    Trump is only the second president in U.S. history to win nonconsecutive terms.
    The first was President Grover Cleveland. He served in the White House from 1885
    to 1889—and then again, four years later, from 1893 to 1897.

