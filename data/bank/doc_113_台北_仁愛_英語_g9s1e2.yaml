    in the US and other countries were surprised by his win.

    At 78, Trump is now the oldest person elected as president in the US. He ran against
    Kamala Harris, the current vice president. Harris focused on rights for women
    and hoped to make history by becoming the first woman and first Black and South
    Asian American president, but she lost.

    This election shows that many Americans still support Trump, even with some different
    opinions about him. After winning, Trump gave a speech. He said he wants America
    to be "strong and safe." He promised to make changes, such as protecting the country''s
    borders.

