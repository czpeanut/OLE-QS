  stem: 下列是1899 年被刊登在雜誌上的一首詩作：「挑起白種男人的負擔，把你們最優秀的品種送出去；捆綁起你們的兒子們將他們放逐出去，去替你們的奴隸服務。挑起白種男人的負擔，讓他們背負著沉重馬韁，去伺候那些剛被抓到，又急躁又野蠻，又慍怒，一半像邪魔一半像小孩一樣的人們；挑起白種男人的負擔，堅持著耐心、掩飾起恐懼、隱藏起驕傲，用公開與簡易的語言，不厭其煩的說清楚，去替別人謀福利，去為別人爭利益。」請問該詩作所傳遞出的最接近下列哪種思想？
