    ˉˉ怎樣的人才受歡迎？怎樣的人會更快樂？我們在蜜蜂和黃蜂身上找到了答案。黃蜂只會抱怨，牠總覺得為什麼要幫人們做事，但是勤勞的蜜蜂卻知道：希望別人怎樣待你，你就得先怎樣待人。

    ˉˉ一個人在世界上的價值，不在你「擁有」什麼，而在你「付出」多少，就像外表鮮豔，自認為擁有優勢、才華和能力的黃蜂，牠不懂得付出，只會嫉妒別人、炫耀自己，牠是不會快樂的。

    ˉˉ一個人的存在，如果無法成為別人的祝福，那麼擁有再好的條件也是枉然。所以，讓我們的存在，成為別人的祝福；讓我們的存在，為別人帶來幸福。讓身邊的人，因為有你而變得更美好，哪怕只是多做一個小動作，哪怕只是分享一件快樂的事，都可能會有許多意外的驚喜與感動，都可能因為有你――世界更美好。

    (擁有與付出)'
