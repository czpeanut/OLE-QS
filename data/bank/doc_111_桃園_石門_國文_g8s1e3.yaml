  stem: 本文與周敦頤的愛蓮說互相比較，請問下列何者正確？
  options:
  - label: A
    content: 都藉由描寫蓮花的外觀來讚美蓮花
  - label: B
    content: 都運用譬喻的修辭來寫蓮花的節操
  - label: C
    content: 都提到因為賞荷的經驗而愛上蓮花
  - label: D
    content: 都引用古人詩句來支持自己的論述
  group_stem: '余憶年少時，住西湖。每至夏日，臨湖賞荷，便欣然忘食。一日，偕數友，觀荷於湖邊亭中。興正濃，忽有大雨傾盆而至，湖中荷花盡作飄搖之態。少時，雨過天晴，波瀾不驚，湖天一色。荷花為雨所洗，鮮妍明媚，婀娜多姿，清麗雅致，實為花中仙子也。李太白詩云：「清水出芙蓉，天然去雕飾」，余以為妙絕。

    (李盛仙 夏日賞荷)'
