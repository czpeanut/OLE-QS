  number: 18
  type: single
  page: 2
  stem: 棒球靈魂學一文作者舉出棒球比賽特有的現象，來印證人生的道理。下列何者配對正確？
  options:
  - label: A
    content: 你安於現狀，只想固守原來的壘包，後面的隊友卻會逼你跑――人生是由無數抉擇時刻組成
  - label: B
    content: 成功的得分者只是一個歷盡滄桑渴望回家的倦客，一點都不英雄――人必須進步，別無選擇
  - label: C
    content: 打點者往往不能奔馳得點――成功只是外在表象，不代表實質成就
  - label: D
    content: 棒球卻不行，是誰守護機會，是誰沒接到球，都會一一記下，每個錯誤都會跟著球員一輩子――人必須為自己的行為負責任
  lesson_raw:
    title: 棒球靈魂學
    basis: 題幹討論《棒球靈魂學》
