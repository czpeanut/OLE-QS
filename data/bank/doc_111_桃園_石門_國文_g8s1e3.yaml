  group_stem: "書籍內容簡介\n一位澳洲電視工作者，有一年，父親突然身故、工作遭遇瓶頸、家庭關係也陷入僵局，就在人生跌落谷底、生活即將崩潰時，偶然間讀到一本百年古書，發現了一個生命中的重大祕密，而過去知道這個祕密的，竟然都是歷史上的偉大人物。\n\
