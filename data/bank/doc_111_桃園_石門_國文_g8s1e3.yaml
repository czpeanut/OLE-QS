  stem: 「菊花被形容為具有不老長壽藥效的植物，是神仙之食。在中國還會將菊花花瓣乾燥，泡成菊花茶飲用。東亞國家中，最常食用菊花的就屬日本。甚至還開發了專供食用的菊花品種，在果菜市場被當作一種蔬菜交易流通。菊花可防止腐敗、消毒，與生魚片一起吃有預防食物中毒的效果。阿房宮是江戶時代後期培育出來的『食用菊』品種，栽種於東北地方，除了當作商品，也可種植於庭院，秋季時用於家庭料理中。」根據本文，關於菊花的用處何者沒有提到？
