  group_stem: '書籍內容簡介

    一位澳洲電視工作者，有一年，父親突然身故、工作遭遇瓶頸、家庭關係也陷入僵局，就在人生跌落谷底、生活即將崩潰時，偶然間讀到一本百年古書，發現了一個生命中的重大祕密，而過去知道這個祕密的，竟然都是歷史上的偉大人物。

    於是，她開始組織一個工作團隊，尋找當世知道這個祕密的人。他們都是各行各業的佼佼者，並且現身說法告訴你：

    了解這個祕密，就沒有做不到的事；不論你是誰，你想要什麼，這個祕密都能給你！'
