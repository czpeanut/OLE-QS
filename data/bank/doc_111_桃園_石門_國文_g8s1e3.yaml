  grade: 8
  subject: 國文
  academic_year_roc: 111
  semester: 1
  exam_seq: 3
  city: 桃園
  school_short: 石門
  school: "桃園市立石門國民中學\n班級： 座號： 姓名：\n一、選擇題(每題3 分，共90 分)\n1.下列「」中的字何者使用正確？\n(A) 龍潭區是一個人文薈「粹」的地方\n\
    (B) 書法是中華文化的國「淬」之一\n(C) 班長領導班級的能力出類拔「萃」\n(D) 照顧患有失智症的家人他心力交「悴」\n2.蜜蜂的讚美：「全世界的小蟲兒，給人類讚美得最\n\
    多的，大概要推螞蟻、蝴蝶、蜘蛛、蠶、蜜蜂這幾樣\n東西了。」關於上文，下列敘述何者正確？\n(A) 說明蜜蜂是最被讚美的昆蟲之一\n(B) 點出全世界的人最愛讚美的昆蟲\n\
    (C) 描述人類最愛讚美的昆蟲是螞蟻\n(D) 敘述蜜蜂比其他昆蟲受到人讚美\n3.蜜蜂的讚美：「真正的哲學家，則是像蜜蜂一樣。\n牠們從花園和田野裡面的花朵採集材料，但是用牠自\n\
    己的一種力量來改變和消化這種材料。」下列何者求\n知的方式和蜜蜂相同？\n(A) 學而不思的阿三\n(B) 思而不學的小夫\n(C) 學思並重的大明\n(D)\
    \ 力學不倦的祥祥\n4.關於蜜蜂的讚美一文的寫作手法，何者說明正確？\n(A) 使用冒題法，於文章中間才點題\n(B) 文中以螞蟻、蝴蝶與蜘蛛作為對照\n\
    (C) 採用借物說理的方式說明團結力量大\n(D) 舉科學數據並以哲學家培根的名言為證\n5.蜜蜂的讚美一文提培根的三種不同求知方式，並以\n昆蟲的特色來比喻。下列表格何者正確？\n\
    昆蟲名稱 捕食方式 求知方式\n螞蟻 看到食物就搬\n(A)卓越的創造\n(B)採集消化\n蜘蛛 結網捕捉食物 (C)主觀的創造\n蜜蜂 採集各種花蜜 (D)盲目的堆積\n\
    6.蜜蜂的生態有許多面向，給予人許多人不同的啟\n示。蜜蜂的各種生物特性與人類眼中某些美德也有所\n連結，請問下列連結何者正確？\n(A) 蜜蜂採一公斤蜜約繞地球赤道飛十一圈：博採眾\n\
    長、去蕪存菁\n(B) 接受每一朵花中最甜美的東西，不雜亂搬取：團\n結合作、井然有序\n(C) 消化搜集的材料，重新釀造出蜂蜜：推陳出新、\n別出新裁\n\
    (D) 工蜂依日齡負責不同的工作：辛勤工作、鍥而不\n捨\n7.蜜蜂的讚美一文中提到蜜蜂採一公斤的蜂蜜，要飛\n上四十五萬公里。請問這樣的方式不可以用下列哪句\n\
    話來形容牠？\n(A) 業精於勤，荒於嬉\n(B) 含淚播種者，必歡呼收割\n(C) 誰知盤中飧，粒粒皆辛苦\n(D) 寶劍鋒從磨礪出，梅花香自苦寒來\n\
    8.類比聯想是利用事物間的相似之處來進行聯想，請\n問下列動物的特性以及能聯想到的職業何者正確？\n(A) 蝴蝶―色彩豔麗―建築師\n(B) 螞蟻―收集食物―搬家工人\n\
    (C) 鴿子―眼神銳利―警探\n(D) 蜘蛛―吐絲結網―舞蹈家\n9.下列「」中的音義，何者完全正確？\n(A) 亭亭淨「植」：ㄓˊ，種植\n(B) 不可「褻」玩：ㄒㄧㄝˋ，玩弄\n\
    (C) 可愛者甚「蕃」：ㄈㄢˊ，眾多\n(D) 陶後「鮮」有聞：ㄒㄧㄢ，少\n10.「水陸草木之花」中的「之」的字義，與下列何\n者相同？\n(A) 項為「之」強\n\
    (B) 牡丹「之」愛\n(C) 故時有物外「之」趣\n(D) 送孟浩然「之」廣陵\n11.愛蓮說一文藉由蓮花的各種特質，象徵君子的德\n行。下列何者對應的關係正確？\n\
    (A) 出淤泥而不染―品格高潔，挺直不屈\n(B) 濯清漣而不妖―品德醇美，芳名遠播\n1\n\n(C) 中通外直，不蔓不枝―節操高雅，不逢迎諂媚\n(D)\
    \ 可遠觀而不可褻玩―端莊嚴正，不為人輕慢\n12.唐朝人酷愛牡丹花，劉禹錫賞牡丹詩：「唯有牡丹\n真國色，花開時節動京城。」下列詩句何者所描述的\n也是牡丹花？\n\
    (A) 須知富貴仙鄉種，已是人間自由花\n(B) 乃作小桃紅杏色，尚餘孤瘦雪霜枝\n(C) 想因會得淵明性，爛熳黃花著一墩\n(D) 紫莖綠業生空谷，識曲知音自古難\n\
    13.小芳趁著暑假到各地旅遊，並在社群網站上分享\n他的心得，其中引用了一段詩句。下列何者最可能是\n他所引用的詩句？\n(A) 停車坐愛楓林晚，霜葉紅於二月花\n\
    (B) 黃梅時節家家雨，青草池塘處處蛙\n(C) 沾衣欲溼杏花雨，吹面不寒楊柳風\n(D) 木落水盡千崖枯，迥然吾亦見真吾\n14.關於愛蓮說寫作的手法分析，下列何者有誤？\n\
    (A) 以花喻人，各有象徵\n(B) 藉物言志，寓意深遠\n(C) 以「說」為題，客觀記錄\n(D) 善用對比及象徵，凸顯主題\n15.下列「」中的字形，何者前後相同？\n\
    (A) 「ㄆ一ㄝ」見∕「ㄆ一ㄝ」開\n(B) 嚴「ㄌㄧˋ」∕「ㄌㄧˋ」志\n(C) 瞄「ㄓㄨㄣˇ」∕「ㄓㄨㄣˇ」備\n(D) 「ㄐㄩㄝˊ」定∕「ㄐㄩㄝˊ」擇\n\
    16.棒球靈魂學：「既然人人犯錯，犯錯就不那麼可怕\n了。」請問這段文字旨在說明什麼？\n(A) 每個人都會犯錯，無需改過\n(B) 對於犯錯的人應該嚴厲譴責\n\
    (C) 犯錯很可怕，應當努力避免\n(D) 失敗不可怕，不用過度在意\n17.「有次看到一個打擊者，明知自己擊出的球很可\n能被接殺而出局，但他仍然如此賣力，不顧一切地跑\n\
    向一壘，結果被接殺了。」這段文字表現出了打擊者\n什麼樣的精神？\n(A) 旁若無人\n(B) 強出風頭\n(C) 盡其在我\n(D) 謙沖自牧\n18.棒球靈魂學一文作者舉出棒球比賽特有的現象，\n\
    來印證人生的道理。下列何者配對正確？\n(A) 你安於現狀，只想固守原來的壘包，後面的隊友\n卻會逼你跑――人生是由無數抉擇時刻組成\n(B) 成功的得分者只是一個歷盡滄桑渴望回家的倦\n\
    客，一點都不英雄――人必須進步，別無選擇\n(C) 打點者往往不能奔馳得點――成功只是外在表\n象，不代表實質成就\n(D) 棒球卻不行，是誰守護機會，是誰沒接到球，都\n\
    會一一記下，每個錯誤都會跟著球員一輩子――\n人必須為自己的行為負責任\n19.「三振出局」中的「三」指的是三次。下列成語\n中的「三」，何者為實指？\n\
    (A) 垂涎「三」尺\n(B) 「三」從四德\n(C) 「三」心二意\n(D) 挑「三」揀四\n20.下列有關棒球靈魂學一文的分析，何者正確？\n(A) 由棒球的靜描寫到動，彰顯亦靜亦動的特色\n\
    (B) 藉物說理，由棒球的外形特色延伸哲理\n(C) 引用名人事例以加強文章的說服力\n(D) 運用譬喻的手法來說明棒球的特色\n21.在棒球靈魂學一文中，作者提到了棒球教我們很\n\
    多事。下列何者不包括在內？\n(A) 結果重於過程\n(B) 謹慎做出正確抉擇\n(C) 勝而不驕，敗而不怨\n(D) 去爭取成功，但不要期望一定會成功\n\
    22.關於指尖上的故事：簡報所提及的簡報製作技\n巧，下列何者正確？\n(A) 重點比較多要分多張投影片呈現\n(B) 字體越花俏越能吸引觀眾注意力\n(C)\
    \ 用大量色彩呈現出繽紛多彩的畫面\n(D) 越多動畫與聲音特效越能增加趣味\n23.關於簡報時間的掌控，有十分鐘的簡報時間，主\n題為介紹簡報常見的六大問題及解決方法。請問要準\n\
    備多少張投影片才能確保簡報品質及有效掌握時間？\n(A)大約五張 (B)大約十五張\n(C)大約二十五張 (D)大約三十張\n2\n\n書籍內容簡介\n一位澳洲電視工作者，有一年，父親突然身故、\n\
    工作遭遇瓶頸、家庭關係也陷入僵局，就在人生跌\n落谷底、生活即將崩潰時，偶然間讀到一本百年古\n書，發現了一個生命中的重大祕密，而過去知道這\n個祕密的，竟然都是歷史上的偉大人物。\n\
    於是，她開始組織一個工作團隊，尋找當世知\n道這個祕密的人。他們都是各行各業的佼佼者，並\n且現身說法告訴你：\n 了解這個祕密，就沒有做不到的事；不論你是誰，\n\
    你想要什麼，這個祕密都能給你！\n24.小君和小文為了在閱讀課上台報告他們所閱讀的\n書籍，製作了上面的簡報。請問他們犯了六種簡報常\n犯的錯誤的哪種？\n\
    (A) 投影片變講稿\n(B) 動畫音效大轟炸\n(C) 螢幕像大花臉\n(D) 同一張投影片重點過多\n25.關於一顆珍珠的主旨，下列何者正確？\n(A)\
    \ 要經歷磨練才能散發光芒\n(B) 人生是由必然的事件組成\n(C) 悲觀的人會覺得生命充滿苦難\n(D) 人生無法預測要懂得珍惜光陰\n26.關於一顆珍珠的寫作手法，下列何者正確？\n\
    (A) 利用數據作為論證\n(B) 用美麗珍珠來象徵人生要有夢想\n(C) 採用總述――分述――總述的結構\n(D) 藉由珍珠的形成來說明人生需禁得起考驗\n\
    27.一顆珍珠作者舉用兩個例子來說明人生的道理，\n下列敘述何者正確？\n(A) 蚌強忍沙石礫入侵的痛苦，路易斯則沒有感受痛\n苦\n(B) 路易斯突然遭逢意外的打擊，蚌被沙礫入侵則是\n\
    人為的\n(C) 蚌分泌真珠質來包容沙礫，路易斯則忍受黑暗發\n明點字法\n(D) 兩者都說明人生道理，只有擁有夢想才能發出不\n朽的光輝\n28.「巴西大頭家蟻有時會把羽毛放置在地下蟻巢的\n\
    入口做為獵食誘餌，當蟎、彈尾蟲或別種螞蟻掉入，\n入口周圍鬆軟的洞壁讓牠們難以爬出，大頭家蟻便能\n很快制伏牠們。」根據上述內容，下列說明何者正\n確？\n\
    (A) 大頭家蟻會透過直接獵捕方式獲得食物\n(B) 本段文字旨在敘述大頭家蟻的繁殖方式\n(C) 蟎掉入大頭家蟻的巢穴因為洞很深很難爬出\n(D) 大頭家蟻放置羽毛，是為了吸引其他小生物\n\
    29.「菊花被形容為具有不老長壽藥效的植物，是神\n仙之食。在中國還會將菊花花瓣乾燥，泡成菊花茶飲\n用。東亞國家中，最常食用菊花的就屬日本。甚至還\n開發了專供食用的菊花品種，在果菜市場被當作一種\n\
    蔬菜交易流通。菊花可防止腐敗、消毒，與生魚片一\n起吃有預防食物中毒的效果。阿房宮是江戶時代後期\n培育出來的『食用菊』品種，栽種於東北地方，除了\n當作商品，也可種植於庭院，秋季時用於家庭料理\n\
    中。」根據本文，關於菊花的用處何者沒有提到？\n(A) 菊花常會被用來釀酒\n(B) 菊花可用來配生魚片\n(C) 菊花可防止食物腐敗\n(D) 菊花可用在料理當中\n\
    30.龍應台：「思想需要經驗的積累，靈感需要孤獨的\n沉澱，最細緻的體驗需要最寧靜透徹的觀照。」根據\n上文，下列推論何者最恰當？\n(A) 靈感來自經驗的積累\n\
    (B) 思想來自靈感的累積\n(C) 沉澱自我能夠享受孤獨\n(D) 靜心能體驗深刻的感受\n二、題組(每題2 分。共10 分)\nˉˉ蜜蜂和黃蜂正在聊天，黃蜂氣惱的說：「奇\n\
    怪，我們兩個有很多共同點，同樣是一對翅膀，\n一個圓圓的肚子，為什麼人類提到你常是開心\n的，卻說我是害蟲呢？」黃蜂接著又說：「我真不\n明白，你看，我有一件天生的漂亮黃色大衣，而\n\
    你成天髒兮兮的忙裡忙外，人類卻都喜歡你，我\n到底哪一點不如你呢？」蜜蜂溫和的說：「黃蜂先\n生，你說的都對，但我想人類會喜歡我，是因為\n我能夠製作蜂蜜，而你為人類做了什麼呢？」\n\
    ˉˉ怎樣的人才受歡迎？怎樣的人會更快樂？我\n們在蜜蜂和黃蜂身上找到了答案。黃蜂只會抱\n怨，牠總覺得為什麼要幫人們做事，但是勤勞的\n3\n\n蜜蜂卻知道：希望別人怎樣待你，你就得先怎樣\n\
    待人。\nˉˉ一個人在世界上的價值，不在你「擁有」什\n麼，而在你「付出」多少，就像外表鮮豔，自認\n為擁有優勢、才華和能力的黃蜂，牠不懂得付\n出，只會嫉妒別人、炫耀自己，牠是不會快樂\n\
    的。\nˉˉ一個人的存在，如果無法成為別人的祝福，\n那麼擁有再好的條件也是枉然。所以，讓我們的\n存在，成為別人的祝福；讓我們的存在，為別人\n帶來幸福。讓身邊的人，因為有你而變得更美\n\
    好，哪怕只是多做一個小動作，哪怕只是分享一\n件快樂的事，都可能會有許多意外的驚喜與感\n動，都可能因為有你――世界更美好。\n (擁有與付出)\n31.依據本文，人們為什麼比較喜歡蜜蜂而不喜歡黃\n\
    蜂？\n(A) 黃蜂會螫傷人們\n(B) 黃蜂沒有美麗的外表\n(C) 黃蜂常會欺負蜜蜂\n(D) 黃蜂對人們沒有貢獻\n32.依據本文內容，下列文句可以突顯本文要展現的\n\
    涵義？\n(A) 沒有比金錢便腐蝕人心的了\n(B) 今天能做到的事情，絕對不要留到明天\n(C) 如果把工作當成一種樂趣，人生就是天堂了\n(D) 一個人的價值，應當看他貢獻什麼，而不應當看\n\
    他取得什麼\n掌聲繞場一周後\n沉默凝聚成美麗而危險的星雲\n等待，一枚白色隕石超越極限\n在速度裡調整舞姿，旋轉中\n騙過一枝木棒的眼睛\n終於在裁判華麗的指揮下\n\
    整座天空被一陣歡呼\n炸開\n\n側投適合上飄與下旋搭配演出\n直球有錐心的快感\n慢球進壘的弧線\n束緊觀眾的咽喉\n而變化球是一尾狡猾的魚\n挑逗眼波後\n\
    扭身走了\n留給一支木棒失戀\n\n當外角與內角球還在討論戰事\n子彈已貫穿胸中的塊壘\n世界被判\n出局 （李進文 棒球系列）\n33.依據本詩的內容，「整座天空被一陣歡呼╱炸開」\n\
    的原因是什麼？\n(A)投手讓三位打擊者出局形成三振\n(B)投球被打出去，打擊者安全上壘形成安打\n(C)球被打擊者打擊出去越過圍牆形成全壘打\n(D)壘包上的跑者趁投手投球時，偷跑至下一個壘包\n\
    形成盜壘\n34.請問本詩所描寫的應該是棒球場上什麼位置？\n(A)捕手 (B)投手 (C)一壘手 (D)外野手\n 余憶年少時，住西湖。每至夏日，臨湖賞\n\
    荷，便欣然忘食。一日，偕數友，觀荷於湖邊亭\n中。興正濃，忽有大雨傾盆而至，湖中荷花盡作\n飄搖之態。少時，雨過天晴，波瀾不驚，湖天一\n色。荷花為雨所洗，鮮妍明媚，婀娜多姿，清麗\n\
    雅致，實為花中仙子也。李太白詩云：「清水出芙\n蓉，天然去雕飾」，余以為妙絕。\n (李盛仙 夏日賞荷)\n35.本文與周敦頤的愛蓮說互相比較，請問下列何者\n\
