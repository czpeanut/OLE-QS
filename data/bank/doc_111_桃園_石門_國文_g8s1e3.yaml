  section: 2
  number: 31
  type: single
  page: 4
  stem: 依據本文，人們為什麼比較喜歡蜜蜂而不喜歡黃蜂？
  options:
  - label: A
    content: 黃蜂會螫傷人們
  - label: B
    content: 黃蜂沒有美麗的外表
  - label: C
    content: 黃蜂常會欺負蜜蜂
  - label: D
    content: 黃蜂對人們沒有貢獻
  group_stem: 'ˉˉ蜜蜂和黃蜂正在聊天，黃蜂氣惱的說：「奇怪，我們兩個有很多共同點，同樣是一對翅膀，一個圓圓的肚子，為什麼人類提到你常是開心的，卻說我是害蟲呢？」黃蜂接著又說：「我真不明白，你看，我有一件天生的漂亮黃色大衣，而你成天髒兮兮的忙裡忙外，人類卻都喜歡你，我到底哪一點不如你呢？」蜜蜂溫和的說：「黃蜂先生，你說的都對，但我想人類會喜歡我，是因為我能夠製作蜂蜜，而你為人類做了什麼呢？」

    ˉˉ怎樣的人才受歡迎？怎樣的人會更快樂？我們在蜜蜂和黃蜂身上找到了答案。黃蜂只會抱怨，牠總覺得為什麼要幫人們做事，但是勤勞的蜜蜂卻知道：希望別人怎樣待你，你就得先怎樣待人。

    ˉˉ一個人在世界上的價值，不在你「擁有」什麼，而在你「付出」多少，就像外表鮮豔，自認為擁有優勢、才華和能力的黃蜂，牠不懂得付出，只會嫉妒別人、炫耀自己，牠是不會快樂的。

    ˉˉ一個人的存在，如果無法成為別人的祝福，那麼擁有再好的條件也是枉然。所以，讓我們的存在，成為別人的祝福；讓我們的存在，為別人帶來幸福。讓身邊的人，因為有你而變得更美好，哪怕只是多做一個小動作，哪怕只是分享一件快樂的事，都可能會有許多意外的驚喜與感動，都可能因為有你――世界更美好。

    (擁有與付出)'
  tags:
    textbook: 八上 第六課 蜜蜂的讚美
    labeled_by: ai
    chapter:
      publisher: 南一
      book: 八上
      subject: 國文
      code: 第六課
      title: 蜜蜂的讚美
      chapter: null
