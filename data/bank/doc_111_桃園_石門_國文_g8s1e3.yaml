  section: 1
  number: 6
  type: single
  page: 1
  stem: 蜜蜂的生態有許多面向，給予人許多人不同的啟示。蜜蜂的各種生物特性與人類眼中某些美德也有所連結，請問下列連結何者正確？
  options:
  - label: A
    content: 蜜蜂採一公斤蜜約繞地球赤道飛十一圈：博採眾長、去蕪存菁
  - label: B
    content: 接受每一朵花中最甜美的東西，不雜亂搬取：團結合作、井然有序
  - label: C
    content: 消化搜集的材料，重新釀造出蜂蜜：推陳出新、別出新裁
  - label: D
    content: 工蜂依日齡負責不同的工作：辛勤工作、鍥而不捨
  lesson_raw:
