  group_stem: '掌聲繞場一周後

    沉默凝聚成美麗而危險的星雲

    等待，一枚白色隕石超越極限

    在速度裡調整舞姿，旋轉中

    騙過一枝木棒的眼睛

    終於在裁判華麗的指揮下

    整座天空被一陣歡呼

    炸開


    側投適合上飄與下旋搭配演出

    直球有錐心的快感

    慢球進壘的弧線

    束緊觀眾的咽喉

    而變化球是一尾狡猾的魚

    挑逗眼波後

    扭身走了

    留給一支木棒失戀


    當外角與內角球還在討論戰事

    子彈已貫穿胸中的塊壘

    世界被判

