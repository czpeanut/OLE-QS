  stem: 根據上文，天燈最原始的功能為何？
  options:
  - label: A
    content: 紀念孔明
  - label: B
    content: 計算風向
  - label: C
    content: 傳遞消息
  - label: D
    content: 表達祝福。
  group_stem: "（四）\n    天燈亦稱「孔明燈」，相傳為三國時期諸葛亮的發明，也被公認為熱氣球的始祖，起初是為了傳遞訊息之用，而目前多被當成節慶祈福許願的工具。但考量恐引發火災因素，除特例如限時限地外，施放為非法行為。\n\
    \    「孔明燈」相傳源自中國 四川 平樂古鎮，三國時代，此鎮乃為軍事重地，諸葛亮當時被司馬懿困於平陽，諸葛亮算準風向，製成紙燈籠繫上求救信息放上天空，最終得以脫險。宋朝此鎮更以造紙聞名，後人為紀念諸葛亮，放「孔明燈」漸變成節慶儀式。現今，「孔明燈」更常用於祝福，象徵平安和幸福。\n\
    \    另外，知名學者李約瑟指出，西元1241 年蒙古人曾經在列格尼卡戰役中使用過龍形天燈傳遞信號。\n                        \
    \ （節錄自 維基百科）"
