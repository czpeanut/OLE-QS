- id: doc_111_彰化_溪湖_國文_g7s2e3_s2_35
  section: 2
  number: 35
  type: single
  page: 3
  stem: 根據此文，麗勒特·沃斯認為VR 和AR 技術對電影造成的影響最可能的是何者？
  options:
  - label: A
    content: 不必走進電影院就能觀賞電影
  - label: B
    content: 虛擬不切實際的內容大幅增加
  - label: C
    content: 觀眾的感官體驗將會更加深刻
  - label: D
    content: 使自閉症者能了解電影內容。
  group_stem: "（三）\n    艾美獎得主、兩部虛擬實景電影的導演麗勒特‧沃斯（Lynette Wallworth）說：「有了VR 技術的加持，未來的電影敘事體驗能夠讓我們看到不同人眼中的世界。VR\
    \ 帶來的感官體驗能夠讓我們感受到不同人的感知差異，這是其他藝術形式做不到的。」\n    展望未來，沃斯認為VR 和AR 技術能擴大傳統電影的觀看界限，其中一種方式就是通過佩戴頭戴式設備，讓觀眾既可以觀看電影又可以獲得身臨其境的體驗。沃斯說：「拿喬治‧米勒（George\
    \ Miller）的電影瘋狂的麥克斯：狂暴之路舉例，你可以戴著VR 設備觀看電影並切換模式。當電影女主角費羅莎駕駛戰車全速穿越沙漠時，你就彷彿坐在她的旁邊一樣。」\n\
    \    用一句已被人說爛了的話來說，隨著VR 技術的飛速發展，這種可能性是無限的。2016 年，美國著名導演斯皮爾·伯格（Steven Spielberg）認為虛擬現實是「危險的」，因為與非互動性電影作品相比，電影製作人在虛擬實景電影中能夠控制和操作的功能將會小很多。他警告說，虛擬世界「使觀眾更加自由，可以不按敘述者的套路走，做出自己的選擇。」\n\
    \    但對未來電影的這一趨勢，即電影觀眾可以參與對電影敘事的塑造，很多人會認為是好事而非壞事。電影觀眾能夠對劇情做出自己的選擇，這與海里戈的預測是一致的。他認為，「未來的電影將不再是一種視覺藝術，而是一種意識藝術。」這也許就是「講故事」和「活在故事裡」的區別。\n\
    \          （節錄自你能想像出20 年後看電影是什麼感覺）"
