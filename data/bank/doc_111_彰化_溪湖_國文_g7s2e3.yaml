  stem: 根據上文所述，「番茄鐘工作法」能帶來什麼好處？
  options:
  - label: A
    content: 減少休息時間，可以增加工作時間
  - label: B
    content: 長時間嚴密訓練後就能專注工作
  - label: C
    content: 在合宜的工作壓力下達到最高效率
  - label: D
    content: 能自然而然做到「計畫、執行、評核」。
  group_stem: "（五）\n    何謂「番茄鐘工作法」？此方法是1980 年代後期，弗朗西斯科．西里洛（FrancescoCirillo）所開發的時間整理法。是一種可以讓自己抓緊時間並維持最高專注力的方法，此方法運用如下：\n\
    1.早晨寫下今天必須完成的所有工作後，排列出優先順序。\n2.將鬧鐘設定25 分鐘，並在這25 分鐘內全心專注於一件事\n  情上。\n3.當計時器響了之後，徹底休息5\
    \ 分鐘。\n4.休息結束後，再重新開始25 分鐘的工作。\n    像這樣簡單的方法，不需特別的知識或訓練便能馬上開始進行。因為25 分鐘內只做一件事，自然可以培養出專注力，還能克服拖延的壞習慣。拖延習慣會導致你總是無法開始一件事情，只會整天操心掛念，但是只要先轉動了鬧鐘，就會開始一項工作，一旦開始進行，你就會發現其實也沒什麼，工作的壓力也會減低許多。\n\
    \    此外，還會意外獲得更多時間休息的效果，藉此解決明明有休息卻仍覺得沒有休息，明明在工作卻又沒有成果的問題。當然，最大的收穫莫過於能達到計畫、執行、評核這三個階段。\n\
    \   （改寫自 番茄鐘工作法！改變習慣作好「時間整理」）"
