- id: doc_113_高雄_七賢_社會_g7s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 林先生一家人居住在雲林縣臺西鄉沿海地區，由於謀生不易，全家決定遷移到工作機會較多的臺中生活。對林先生一家人而言，他們的遷移較符合下列何種人口現象？
  options:
  - label: A
    content: 國內遷移、移入地拉力
  - label: B
    content: 國內遷移、移入地推力
  - label: C
    content: 國際遷移、移出地推力
  - label: D
    content: 國際遷移、移出地拉力。
- id: doc_113_高雄_七賢_社會_g7s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 曉明今年24 歲，六年前從宜蘭到臺北就讀大學，預計今年從臺北某大學研究所畢業。畢業後，他規畫在臺北的外商公司上班，努力工作並攀升到一定的地位後，開設自己的公司，並在30
    歲以前結婚生子。結婚後從臺北搬回宜蘭，給小孩一個寬廣的生活空間，並帶家人到臺灣各地旅行，體驗臺灣的美好。請問：以曉明的規畫來說，有關人口遷移型態下列何者說明正確？
  options:
  - label: A
    content: 至臺北就讀大學屬於暫時遷移
  - label: B
    content: 進入外商公司工作是國際遷移
  - label: C
    content: 結婚後定居宜蘭屬於國際遷移
  - label: D
    content: 帶家人到臺灣各地旅行屬於國際遷移。
