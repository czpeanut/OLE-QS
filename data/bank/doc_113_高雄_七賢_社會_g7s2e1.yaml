  stem: 某台灣日治時期的歷史資料提到：「……按國際公法之義，若土地割讓而民不受，則其約不成，外邦已有成例。倘諸國仗義直言，使臺灣歸於大清，臺人願傾其所有，以報厚德。」，此內容最早可能出現於下列何時？
