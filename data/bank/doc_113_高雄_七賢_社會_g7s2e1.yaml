  stem: 「人口倍時」是指人口增加一倍所需要的時間，也就是說，假若有一地區人口數原有100 人，經過5 年人口增加到200 人，該地區的人口倍時即為5 年，用這個概念可以比較出不同時期人口成長速度變化的差異。附圖為臺灣人口成長變化圖，根據圖中資訊，請問下列敘述何者正確？
  options:
  - label: A
    content: 人口成長速度一開始緩慢接著變快，後來又變慢
  - label: B
