  type: single
  page: 1
  stem: '附表為天龍國某年的人口資料，其中「6」代表下列何種概念？


    | 項目 | 天龍國 |

    | --- | --- |

    | (甲)出生率 | 18 |

    | (乙)死亡率 | 12 |

    | (甲)-(乙) | 6 |'
  options:
  - label: A
    content: 移入率
  - label: B
    content: 移出率
  - label: C
    content: 自然增加率
  - label: D
    content: 社會增加率。
- id: doc_113_高雄_七賢_社會_g7s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 臺灣人口的變化趨勢，由早年的快速增加，到近年的逐漸趨緩甚至停滯。請問造成臺灣人口增加逐漸趨緩甚至停滯的主要原因為何？
  options:
  - label: A
    content: 出生率下降
  - label: B
    content: 死亡率上升
  - label: C
    content: 移入率上升
  - label: D
    content: 移出率下降。
- id: doc_113_高雄_七賢_社會_g7s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 附圖為臺灣的人口變化統計資料圖，圖中約於民國57 年時某一數值異常大幅升高。請問此數值異常大幅升高的原因最有可能為下列何者？
