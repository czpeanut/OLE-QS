- id: doc_113_高雄_七賢_社會_g7s2e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 「自1991 年以來，全球人口的大趨勢遷移已成為無法逆轉的趨勢。台灣是亞洲經濟的一部分，自1989 年正式開放外籍勞工進來臺灣，已成為東南亞移工重要的目的地。隨著外來移工與新住民的增加，台灣社會的文化樣貌也變得更加多元、也提供了本地居民認同不同文化的機會，促進族群融合與文化交流。也讓台灣社會對移民與移工議題的關注提升，政府與民眾團體也大力推動多元文化政策，如開設母語課程、提供移工權益保障等。」請問：根據上文的論述，下列說明何者正確？
  options:
  - label: A
    content: 邊陲國家通常具有較強的拉力
  - label: B
    content: 臺灣屬於拉力較強的核心國家
  - label: C
    content: 核心國家因推力較強而有較多新住民移入
  - label: D
    content: 外來移民會因台灣社會的同化而使臺灣文化漸趨單一。
- id: doc_113_高雄_七賢_社會_g7s2e1_s1_16
  section: 1
  number: 16
  type: single
  page: 3
  stem: 在高齡社會的今日，許多銀髮族未與子女同住，過著獨居的生活。根據研究顯示，社交上的隔離與孤獨感將會增加老年人的死亡率；同時，都市房價居高不下，也造成許多青年人買不起或租不起房子。在這樣的情形下，許多國家近來推動「青銀共居」，希望一方面解決銀髮族獨居所帶來的風險，一方面也緩和青年人的住屋問題。請問下列何者並非青銀共居的理想狀態？
  options:
  - label: A
    content: 主動成為好鄰居，偶爾一同用餐，或是輕鬆地聊天話家常及提供生活上的協助
  - label: B
    content: 青年人與老年人各有自己的生活模式，彼此少有機會交流互動
  - label: C
    content: 設立交誼廳，鼓勵銀髮族與年輕人交流互動
  - label: D
    content: 大學相關科系或民間組織積極舉辦短期的共居體驗或交流會。
- id: doc_113_高雄_七賢_社會_g7s2e1_s1_17
  section: 1
  number: 17
  type: single
  page: 3
  stem: 「行政院曾針對臺灣幾項人口問題，提出一份《人口政策白皮書》，內容包含健全生育保健體系、營造友善家庭之職場環境、落實產假及育嬰留職停薪措施，以及推動高齡者社會參與、完善高齡教育等。」依據上述內容，這份白皮書應是針對臺灣哪兩項人口議題而擬定？
  options:
  - label: A
    content: 性別比例失衡、扶養比上升
  - label: B
    content: 扶養比上升、多元族群
  - label: C
    content: 少子化、高齡社會來臨
  - label: D
    content: 少子化、性別比例失衡。
- id: doc_113_高雄_七賢_社會_g7s2e1_s1_18
  section: 1
  number: 18
  type: single
  page: 3
  stem: 某描寫日治時期的書，其內容敘述如下：「總督府規定每月的1、8、15 日，全校都要按時參拜當地神社，學童每日到校後要向天皇肖像行禮，每天朝會升國旗後必須遙拜日本皇宮，不准學童講自己的母語，一律要用『國語』交談。社會上也獎勵『國語』，還鼓勵改用日本姓名。」，根據這段敘述可以了解台灣總督府主要的目的為下列何者？
  options:
  - label: A
    content: 促進臺灣經濟發展
  - label: B
    content: 提高臺灣的識字率
  - label: C
    content: 促進中日文化交流
  - label: D
    content: 使臺灣人民接受日本文化並成為忠誠的日本臣民。
- id: doc_113_高雄_七賢_社會_g7s2e1_s1_19
  section: 1
  number: 19
  type: single
  page: 3
  stem: 臺灣總督對外表示：「雖然臺灣的法律制度與日本本土有些許差異，但仍將其視為本土的延伸，直接適用日本法律，並以日本領土的方式來治理。」這種治臺政策的轉變與下列哪一事件有關？
  options:
  - label: A
    content: 受到民族自決思潮影響，促使日本調整對臺政策
  - label: B
    content: 臺灣民主國滅亡，使日本得以全面接管臺灣
  - label: C
    content: 日本與中國之間的戰爭爆發，影響臺灣治理方針
  - label: D
    content: 推行警察保甲制度以加強社會控制。
- id: doc_113_高雄_七賢_社會_g7s2e1_s1_20
  section: 1
  number: 20
  type: single
  page: 3
  stem: 日本殖民統治時期，臺灣人民的抗日行動始終沒有間斷，其抗日型態的演變為何？
  options:
  - label: A
    content: 抗日行動始終以武裝鬥爭的方式進行，未曾改變
  - label: B
    content: 抗日行動先是透過武裝衝突，後來轉向政治與社會運動的方式進行
  - label: C
    content: 抗日行動一開始以政治與社會運動為主，後來改以宗教信仰為掩護繼續抗爭
  - label: D
    content: 抗日行動先從政治與文化領域展開，後來轉變為武裝鬥爭的方式。
- id: doc_113_高雄_七賢_社會_g7s2e1_s1_21
  section: 1
