  - label: A
    content: 戰爭剛結束，出現戰後嬰兒潮
  - label: B
    content: 政府將軍籍人口併入戶籍人口
  - label: C
    content: 戰爭爆發，造成許多人口移出
  - label: D
    content: 發生天然災害，人口大量死亡。
