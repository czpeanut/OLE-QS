- id: doc_113_屏東_中正_社會_歷史_g8s1e3_s1_20
  section: 1
  number: 20
  type: single
  page: 3
  stem: 十九世紀末，中國有許多類似《蘇報》等新媒體出現。請問最早將新式報刊引進中國的是下列何人?
  options:
  - label: A
    content: 留學生
  - label: B
    content: 傳教士
  - label: C
    content: 英國商人
  - label: D
    content: 自強運動官員
  group_stem: "(一)請根據短文，回答20-22 題\n\n    《蘇報》1896年創刊於上海，在日本駐上海領事館註冊，以刊登當時社會新聞為主，並致力於保皇立憲的宣傳。1902年起，《蘇報》報導態度丕變，公開支持學生的愛國運動和革命活動，言論日趨激烈。\n\
    \     1903年《蘇報》發表鄒容的《革命軍》以及章太炎的《駁康有為論革命書》。以飽滿的激情、極富感染力的文辭讚美革命，此文一出，朝野轟動，舉世譁然。蘇報的行為惹怒了朝廷，加快查禁《蘇報》的步伐。\n\
    \     因《蘇報》館設在租界之內，章太炎、鄒容雖被捕，卻是在租界掌控下。經過多次鎮壓，蘇報館被封，但租界拒絕引渡嫌犯。"
  tags:
    chapter:
      publisher: 翰林
      book: 八上
