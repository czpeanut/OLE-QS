    content: 秦朝
  - label: B
    content: 魏晉南北朝
  - label: C
    content: 隋朝
  - label: D
    content: 唐朝
  group_stem: "(二)請根據短文，回答23-25 題\n    清代舉辦科舉考試，選拔人才。廣東人林柏桐，寫下《公車見聞錄》一書，分享眾多赴京趕考須知，例如：路線選擇、飲食特產、租車要點、國考文具等。書中歸納五條最佳路線，逐一分析時間、旅費、勞累度、風景值，提供路線規劃參考。\n\
    \    為何書名以公車為名？原來，「公車」是當時舉人的別稱。考上舉人後，朝廷會提供「公務車」派用，故而得名，清末梁啟超等人聯名奏請光緒皇帝改革，也被稱為公車上書。"
