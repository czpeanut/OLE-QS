- id: doc_113_台中_向上_國文_g7s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 「庭下如積水空明，水中藻荇交橫，蓋竹柏影也。何夜無月？何處無竹柏？但少閑人如吾兩人耳！」文中所呈現的心境與下列何者最不接近？
  options:
  - label: A
    content: 人閒桂花落，夜靜春山空
  - label: B
    content: 莫等閒，白了少年頭，空悲切
  - label: C
    content: 問余何意棲碧山，笑而不答心自閑
  - label: D
    content: 江山風月本無常主，閒者便是主人。
  lesson_raw:
    title: 記承天夜遊
    basis: 題幹引用蘇軾〈記承天夜遊〉課文原句
