- id: doc_113_台中_向上_國文_g7s2e3_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 「她老了，但是她教導一個年輕人學會什麼叫做勇敢，以及對生命的熱情，而那頭銀髮是我春天在希臘旅行，捕捉到的最美麗的一幅風景。」這句話的含義與下列何者最相近？
  options:
  - label: A
    content: 作者常常追求新事物、新世界的勇氣與活力
  - label: B
    content: 作者希臘之旅的最佳旅伴竟然是這位老太太
  - label: C
    content: 老太太對生命的熱情是作者旅遊中美麗風景
  - label: D
    content: 此次旅程的風景不佳，幸好旅伴熱情又和善。
  lesson_raw:
    title: 另一個春天
    basis: 引用課文〈另一個春天〉結尾段落
  tags:
    textbook: 七下 第十課 另一個春天
    labeled_by: ai
    chapter:
