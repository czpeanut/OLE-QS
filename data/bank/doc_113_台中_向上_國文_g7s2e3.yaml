  group_stem: "請閱讀以下短文，並回答49～50 題：（請注意中間三段須重組）\n  雨絲拂過面頰，我戴上帽子，等候十字路口小紅人變裝。售屋看板旁的女孩，牛仔長褲，深藍棉質夾克，初出茅廬的模樣，迴避的眼神藏不住鬱悶與自卑。我帶著興頭盯著看板，想趨近聊聊，見她低著頭，加上小綠人催得緊。雲暫時不會散的樣子。她也許感謝這雨吧，讓臉蛋有了理由躲進連衣帽裡。\n\
    \   【甲】每逢這道風景線，總會想起《兒子的大玩偶》中的坤樹仔，他的廣告三明治、小丑裝扮和臭汗淋漓的體能折磨。同樣是討生活，這裡的廣告人多賺了份尊嚴。\n\
    \   【乙】建案如雨後春筍，周末假日打工族紛紛出籠。倚著各式圖文並茂廣告牌，為自個的肚腹，或站樁或揮舞。下個廣告駐點是個中年壯漢，陽光臉龐，舉牌面對人潮車流，熟練地左右移動，讓人聯想起選舉時的助選員。\n\
    \   【丙】這活，有人稱之為站街的。其實也不盡然，曾見過三角架看板裡縮了個苗條女，抱膝假寐。喔，原來只為守著這活動版面，但鐘似乎停擺了。可忍一忍，口袋進帳時，心情自有回饋。\n\
    \n晌午經同一條街，女孩旁多了同業。他們正聊著呢，連衣帽躺在她後背，露出一大把馬尾來。\n雨仍默默飄著……。\n                     \
    \              --林捷津《舉牌的人》"
