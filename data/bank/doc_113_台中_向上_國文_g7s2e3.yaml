- id: doc_113_台中_向上_國文_g7s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 記承天夜遊一文中，「月色入戶，欣然起行。念無與樂者，遂至承天寺，尋張懷民。」根據這段文字，下列分析何者正確？
  options:
  - label: A
    content: 「念」字寫出作者的心情由欣喜轉入悲愴、低沉
  - label: B
    content: 「遂」字是由「欣然起行」的「行」字轉化而來
  - label: C
    content: 「尋」字寫出被貶謫後知音難尋，知己難覓的處境
  - label: D
    content: 「樂」字表達作者「獨樂樂，不若與人樂樂」的胸懷。
  lesson_raw:
    title: 記承天夜遊
    basis: 題目指明〈記承天夜遊〉
