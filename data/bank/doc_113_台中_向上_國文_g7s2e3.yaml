- id: doc_113_台中_向上_國文_g7s2e3_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: 「人生何嘗不像一場競賽。跑得慢的人有些會怨天尤人，一路上窩囊委屈；有的卻抱著龜兔賽跑的精神，努力不懈直到終點。而那些跑得快的也不見得永遠領先，有的後繼無力被人超前，有的半路摔倒一蹶不起，選擇放棄。因此，     。」根據文意，畫線處填入下列何者最恰當？
  options:
  - label: A
    content: 勝敗皆由天定，無須怨天尤人
  - label: B
    content: 堅持到底的人才是最後的贏家
  - label: C
    content: 人生的競賽往往是暗潮洶湧的
  - label: D
    content: 臺前風光是背後汗水累積而成。
  tags:
    textbook: 七下 第八課 音樂家與職籃巨星
    labeled_by: ai
