  section: 1
  number: 19
  type: single
  page: 1
  stem: 下列選項「 」中的注音寫成國字後，何者字形前後相同？
  options:
  - label: A
    content: 心無旁「ㄨˋ」／好高「ㄨˋ」遠
  - label: B
    content: 「ㄓㄢˇ」露頭角／一「ㄓㄢˇ」身手
  - label: C
