      chapter: null
- id: doc_113_台中_向上_國文_g7s2e3_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 另一個春天一文中，老太太說：「我沒有時間流淚，也沒有時間悲傷，這就是我的哲學！」這句話的含義與下列何者最相近？
  options:
  - label: A
    content: 早年嘗盡艱苦，如今已能豁達地面對生活窮困
  - label: B
    content: 即使生活艱苦，也要把握時間實現長久的夢想
  - label: C
    content: 即使白髮蒼蒼，也要彌補往昔未能旅行的遺憾
  - label: D
    content: 無視他人對我行動遲緩的抱怨，因為生命有限。
  lesson_raw:
    title: 另一個春天
    basis: 題目指明〈另一個春天〉
