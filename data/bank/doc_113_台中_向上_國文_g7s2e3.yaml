- id: doc_113_台中_向上_國文_g7s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 「偶步忘歸遠，心閒逸興增。山深知有寺，路盡不逢僧。」這段文字的情境與下列何者較為接近？
  options:
  - label: A
    content: 念無與樂者，遂至承天寺，尋張懷民
  - label: B
    content: 元豐六年十月十二日，夜，解衣欲睡
  - label: C
    content: 庭下如積水空明，水中藻荇交橫，蓋竹柏影也
  - label: D
    content: 何夜無月？何夜無竹柏？但少閑人如吾兩人耳
