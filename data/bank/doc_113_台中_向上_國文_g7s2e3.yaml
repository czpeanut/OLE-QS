  section: 1
  number: 3
  type: single
  page: 1
  stem: 「如果沒有苦練，那即使有再高的天分，也難以開花結果。」這句話的含義與下列何者最相近？
  options:
  - label: A
    content: 天賦資質無法培養
  - label: B
    content: 劍雖利，不厲不斷
  - label: C
    content: 人無遠慮，必有近憂
  - label: D
    content: 死生有命，富貴在天。
