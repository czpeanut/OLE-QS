  stem: '臺灣一夕之間本土確診創新高，每日高達數百人，全國陷入第三級防疫警戒，距離「全面封城」的第四級警戒只差一步，焦慮與恐慌開始蔓延。我們失去了常態，害怕到處瀰漫著集體悲傷的黑暗。但如果你掉進了黑暗裡，你能做的，    ，並在那些最黑暗的時刻裡，找到意義。

