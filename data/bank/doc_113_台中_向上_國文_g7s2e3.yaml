  group_stem: '【甲】呂文穆公 蒙正以寬厚為宰相。太宗尤所眷遇①。有一朝士②，家藏古鏡，自言能照二百里。欲因公弟獻以求知。其弟伺間③從容言之，公笑曰：「吾面不過碟大，安用照二百里？」其弟遂不復敢言。聞者嘆服，以為賢於李衛公遠矣。蓋④寡好而不為物累者⑤，昔賢之所難也⑥。———
    選自歐陽修《歸田錄》

    【乙】呂蒙正為相，有以古鑑獻者，云：「能照二百里。」公曰：「吾面不過碟子大，安用照二百里為？」 又有以古硯求售者，云：「一呵即潤，無煩注水也。」公曰：「就使一日能呵一擔水，亦止⑦值十文錢而已。」———選自梁紹壬
    《兩般秋雨庵隨筆》

