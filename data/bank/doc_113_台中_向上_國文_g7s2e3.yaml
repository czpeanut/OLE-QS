- id: doc_113_台中_向上_國文_g7s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 「我們常常迷惑於莫札特、貝多芬等人特殊的天分或資賦，而忽略了絢麗背後更可貴的苦練。」這段文字的含義與下列何者最相近？
  options:
  - label: A
    content: 臺上一分鐘，臺下十年功
  - label: B
    content: 路遙知馬力，日久見人心
  - label: C
    content: 荷花雖美，不可否定汙泥
  - label: D
    content: 見賢思齊，見不賢而內自省
