- id: doc_113_台中_向上_國文_g7s2e3_s1_26
  section: 1
  number: 26
  type: single
  page: 2
  stem: '以「饕餮」自居的蘇東坡，最大的癖好就是吃了。讓他在被貶的情況下，依然讓生活充滿情趣。蘇東坡被貶到黃州時，爲了實現「想吃什麼魚就吃什麼魚」的心願，他帶著家人一起挖魚塘，做了名副其實的「塘主」，還研究出了獨家吃法「東坡魚」。他被貶到嶺南時，一看到那繁盛的荔枝，瞬間歡喜起來，還寫出了膾炙人口的「日啖荔枝三百顆，不辭長作嶺南人」這樣的名句。    。他能把柴米油鹽的平淡生活，過得趣味盎然，把苦日子過成詩，把詩哼成歌。他能把短暫的人生過得無限快活，熱鬧、繽紛，不負韶華。

    根據文意，畫線處填入下列何者最恰當？'
