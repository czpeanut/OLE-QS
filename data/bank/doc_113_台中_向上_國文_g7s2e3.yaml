- id: doc_113_台中_向上_國文_g7s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 「如果你因為自覺在某方面不如人，而且相信『勤能補拙』，願意比別人花更多的心血去練習，使它成為一種良好的習慣，那麼有一天物換星移，情況變得對自己有利時，這種良好的習慣就更能使你脫穎而出。」這段文字的主要含義為何？
  options:
  - label: A
    content: 人十若能之，而己千之
  - label: B
    content: 宜未雨而綢繆，毋臨渴而掘井
  - label: C
    content: 仁者不憂；知者不惑；勇者不懼
  - label: D
    content: 吾日三省吾身：為人謀而不忠乎。
  tags:
    textbook: 七下 第八課 音樂家與職籃巨星
    labeled_by: ai
