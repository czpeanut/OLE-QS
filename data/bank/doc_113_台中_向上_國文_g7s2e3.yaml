  section: 1
  number: 17
  type: single
  page: 1
  stem: 「貝多芬出身寒微，【甲】雖遭到諸多不幸與痛苦，可是他有不屈不嶢的精神，【乙】並將對人生的深刻感觸，以及對人生的了悟，融入在作品中，【丙】使他的樂曲擁有前人不曾想像的深刻感情，處處充滿了自信，也換發萬丈光芒。【丁】他積極向上的進取心，不向命運低頭，自我充實，終成一代巨將。」文中畫雙線處的文句，何者用字完全正確？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
