  section: 1
  number: 4
  type: single
  page: 1
  stem: 「如果喬丹要等到自己長得『夠高』，才加緊練習球技，那可能為時已晚。」下列文句，何者可以說明這段話的含義？
  options:
  - label: A
    content: 少壯不努力，老大徒傷悲
  - label: B
    content: 時過然後學，則勤苦而難成
  - label: C
    content: 學然後知不足，教然後知困
  - label: D
    content: 人不知而不慍，不亦君子乎。
