  stem: 關於「語文天地——字體的演變與書法欣賞」，下列敘述而者有誤？
  options:
  - label: A
    content: 甲骨文又稱「卜辭」，是用刀刻在龜甲和獸骨上的，字體線條纖細多稜角，內容多為占卜吉凶之記錄
  - label: B
    content: 金文常見於鐘、鼎之上，故又稱「鐘鼎文」，鑄刻工具銳利，故線條筆畫較甲骨文更為纖細緊密
  - label: C
    content: 大篆又稱「籀文」，筆畫圓轉，結構繁複。小篆是繼承大篆而來，並在其基礎上加以發展、簡化
  - label: D
    content: 欣賞書法時，宜先看章法，次看結構，最後再看細看筆畫。
  lesson_raw:
    title: 字體的演變與書法欣賞
    basis: 題目指明「語文天地——字體的演變與書法欣賞」
