    content: 文章傳達出人螢相親之暖，也透露流螢已稀、童年已逝的感慨
  - label: B
    content: 文章巧妙地引用古典詩句和自己兒時的流螢盛況，帶領讀者置身古代，來了一趟穿越之旅
  - label: C
    content: 以第二人稱觀點寫作，拉近與讀者的距離，使其更能感同身受
  - label: D
    content: 以關懷「生態保育」為主旨，不只提醒大眾要愛惜環境，作者自己更是投身公益。
