  number: 8
  type: single
  page: 1
  stem: 下列「  」中的詞語，何者不是外來語？
  options:
  - label: A
    content: 電腦裡的重要文件，最好「複製」至行動硬碟，以備不時之需
  - label: B
    content: 她素來冷靜自持，少有波瀾，然而此刻情緒潰堤，幾近「歇斯底里」，真教人憐惜
  - label: C
    content: 他性情爽朗，處事一向「阿莎力」，從不拖泥帶水，令人欣賞
  - label: D
    content: 他的發言條理分明，思緒清晰，展現出很好的「邏輯」思維，令人心服口服。
