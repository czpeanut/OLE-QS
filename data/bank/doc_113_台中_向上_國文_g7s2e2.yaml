  number: 7
  type: single
  page: 1
  stem: 請問下列「  」中的詞語，何者不是同義複詞？
  options:
  - label: A
    content: 今日祖母大展廚藝，才靠近廚房就香氣撲鼻，菜餚還未上桌，已教人「垂涎」三尺
  - label: B
    content: 這棵樹不但結實纍纍，果實還顆顆「碩大」看起來真是可口
  - label: C
    content: 這條道路的兩邊，是一片「田疇」，每當夏夜，總是螢火紛飛
  - label: D
    content: 這趟校外教學，讓同學們一同「遭遇」了許多趣事。
  tags:
