  stem: 〈背影〉一文中「行李太多了，得向腳夫行些小費才可過去。」句中的「腳夫」是指今日的「搬運工人」。由此可知，古今詞語用法大不同，下列選項「  」中，今日的從業人員與古時的用法配對何者相同？
  options:
  - label: A
    content: 那「警察」身手矯健，一瞬間的功夫便捉住了嫌犯——優伶
  - label: B
