  type: single
  page: 2
  stem: 閱讀完陳黎的〈聲音鐘〉之後，我們可以看到他刻畫出市井小民的日常樣貌，也流露對鄉土的熱愛與關懷，下列敘述何者也同樣流露出對鄉土深刻的情感？
  options:
  - label: A
    content: 夜晚的火車從遠方駛過，微微的轟隆轟隆聲傳來，讓他想到過去離家時自己的心境，那聲音像一場時光對話
  - label: B
    content: 我深愛這塊地，因為這裡的風一吹拂就能知道我臉上的皺紋，熾熱的陽光也認得我掌心的老繭
  - label: C
    content: 父親一如往常地推開門回家，門軸吱呀作響，那聲音竟讓我忽然鼻酸，彷彿他從未離開過
  - label: D
    content: 他站在古戰場遺址上，遙想千年前兵戈鐵馬的歷史光景，胸中湧起萬千感慨，耳邊彷彿響起將士們的廝殺聲。
