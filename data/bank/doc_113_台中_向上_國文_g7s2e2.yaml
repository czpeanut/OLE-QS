- id: doc_113_台中_向上_國文_g7s2e2_s3_35
  section: 3
  number: 35
  type: single
  page: 3
  stem: 根據上文內容，下列推論何者正確？
  options:
  - label: A
    content: 作者賞鳥十年間，第一次看見鷹類順著氣流盤旋而上
  - label: B
    content: 見到林鵰的蹤影，讓作者的心情是既驚喜又感慨
  - label: C
    content: 作者在山林守候林鵰，不負期望終於見到牠們結伴翱翔
  - label: D
    content: 林鵰的叫聲和羽色，和作者聽聞的傳說相同。
  group_stem: '太陽一出，山谷會有蒸騰而上的熱氣流，猛禽科知道如何利用熱氣流的對流原理，藉它的運送，不斷地盤飛、滑行，升至頂空，鳥瞰下面的森林。我們走出門，滿山盡是迎接陽光的鳥語。果然，一隻碩大的林鵰，從御油山的稜線赫然浮上，發出嬰孩起床似的哭啼。

    牠是臺灣最大的猛禽，傳說中會抓掠小孩的老鷹。遠遠望去，一身烏亮，只尾羽露出淡灰的細橫斑與黃爪。賞鳥十年，第一次見到林鵰，不知臺灣還剩下幾隻？

    ——劉克襄〈荖濃溪畔的六龜〉'
  tags:
    textbook: 七下 第六課 劉墉寓言作品選
