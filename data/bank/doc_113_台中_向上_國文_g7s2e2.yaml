- id: doc_113_台中_向上_國文_g7s2e2_s3_33
  section: 3
  number: 33
  type: single
  page: 3
  stem: 根據上文，「走風的人」擁有下列何種特質？
  options:
  - label: A
    content: 能運用文字和語言得到老一輩的認同
  - label: B
    content: 能預測並掌控風的流向
  - label: C
    content: 能感受和解讀大自然的生命靈魂
  - label: D
    content: 能用雙腳走過最後一道山稜線。
  group_stem: '「讓吹來的風流動、灌進，我們叫替風開路的人；凡經過的地方，讓風跟進追流，我們叫風的路；替風開路的那個人，我們叫走風的人。」黃昏老獵人說著說著，突然雙手張開，讓風聞著、親著，那是自然跟人感覺的文字和語言，風是自然的語言，人的感覺是對自然的回應。「你的父親，我們叫走風的人，用雙腳走過、看過、踩遍，沒有一個地方被隱藏。那是你父親生命歲月換來的，『走風的人』這個稱號是土地、自然給你『卡瑪（父親）』的，它的意思是對大自然生命靈魂的溝通者和詮釋者。」老人指著視覺最後一條山的稜線說。

    ——亞榮隆‧撒可努《走風的人——我的獵人父親》'
  tags:
    textbook: 七下 第六課 劉墉寓言作品選
