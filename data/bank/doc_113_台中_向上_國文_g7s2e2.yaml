- id: doc_113_台中_向上_國文_g7s2e2_s3_31
  section: 3
  number: 31
  type: single
  page: 3
  stem: 關於上文的敘述，下列何者最為正確？
  options:
  - label: A
    content: 馬正惠公珍藏名畫《鬥牛圖》覺得自己欣賞太可惜，於是曝光出來與民同樂
  - label: B
    content: 本文說明保持懷疑態度是科學精神的重要成分，古人也很科學
  - label: C
    content: 農民因有實際生活經驗，因此能指出畫中的錯誤
  - label: D
    content: 馬正惠公的情緒變化順序為：珍惜＞偷笑＞佩服。
  group_stem: '馬正惠１公嘗珍其所藏戴嵩２《鬥牛圖》，暇日展曝３於廳前。有輸租氓４見而竊笑。公疑之，問其故。對曰：「農非知畫，乃識真牛。方其鬥牛時，夾尾於髀５間，雖壯夫膂力６不能出之。此圖皆舉其尾，似不類矣。」公為之歎服。

    （獨醒雜誌卷一）

    【注釋】

    １馬正惠公：馬知節，字子元，諡正惠，宋朝將領。

    ２戴嵩：唐朝畫家，善畫牛。

    ３曝：曬太陽

    ４輸租氓：交租的農民。氓，古時稱庶民為「氓」。

    ５髀：音，ㄅㄧˋ，大腿。

    ６膂力：音，ㄌㄩˇ，也作「旅力」，指體力、筋力。'
  tags:
    textbook: 七下 第六課 劉墉寓言作品選
    labeled_by: ai
    chapter:
      publisher: 南一
      book: 七下
      subject: 國文
      code: 第六課
      title: 劉墉寓言作品選
      chapter: null
- id: doc_113_台中_向上_國文_g7s2e2_s3_32
  section: 3
  number: 32
  type: single
  page: 3
  stem: 〈一疊紙的哲學〉說明的是什麼樣的生活態度？
  options:
  - label: A
    content: 見到他人的優點要努力看齊，發現他人的錯誤要反省自己是否也跟對方一樣
  - label: B
    content: 隨著環境的不同，要懂得因地制宜，馬上調整
  - label: C
    content: 行事要小心謹慎，不要輕易指責他人
  - label: D
    content: 做事用心負責，凡事盡力而為。
  group_stem: '請學生從後面幫我把考卷收過來，六排五個人當中，最多就兩、三個會將考卷疊整齊再交給我，甚至只有一、兩個不只會弄整齊，還會翻到同一面再整整齊齊的交上來。這讓我想起在海軍陸戰隊學校服預官役的時候，那一件讓我至今都很難以忘記的小事。

    我在學校的教務處負責教官鐘點費的工作，每個月要把厚厚的一疊課表收集好，結算教官上課的時數以及該給的鐘點費。有一次，我把釘好的課表和核算好的鐘點費清冊拿去給我們的上校處長檢查。只見他面露微笑，一面溫和的關心我在軍中的生活起居，一面不慌不忙的拿起鉗子，把釘書針夾起來，把我那一疊參差不齊的課表重新撥弄、排放，等四邊切齊之後，再把課表釘好，遞還給我。

    從此以後，我送到處長面前的課表一定是裝釘的整整齊齊的，那是一種對處長身教的感動和感謝。

    最近看到一則報導：我們那位處長已經官拜陸戰隊中將司令。我想，應該是他那種「認真生活」的哲學造就了他今天的地位。所以，看到孩子遞給我的那一疊參差不齊的考卷，我也會不動聲色地把它排弄整齊。

    （改寫自〈一疊紙的哲學〉）'
  tags:
    textbook: 七下 第二課 背影
    labeled_by: ai
    chapter:
      publisher: 南一
      book: 七下
      subject: 國文
      code: 第二課
      title: 背影
