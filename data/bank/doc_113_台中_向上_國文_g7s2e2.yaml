- id: doc_113_台中_向上_國文_g7s2e2_s3_6
  section: 3
  number: 6
  type: single
  page: 1
  stem: 關於〈背影〉一文的分析，下列何者有誤？
  options:
  - label: A
    content: 「我心裡暗笑他的迂⋯⋯我都這樣大了，難道還不能料理自己嗎？現在想想，那時實在是太聰明了！」這段話暗藏自鳴得意
  - label: B
    content: 父親將買來的橘子一股腦兒的放在兒子的皮大衣上，是表示父親對兒子毫不保留的愛
  - label: C
    content: 文末：「我讀到此處，在晶瑩的淚光中，又看見那肥胖的青布棉袍、黑布馬褂的背影。」此句話是表達對父親無盡的思念
  - label: D
    content: 文中大多追述往事，其中「買橘子的背影」為全文焦點。
  lesson_raw:
    title: 背影
    basis: 題目指明分析〈背影〉
