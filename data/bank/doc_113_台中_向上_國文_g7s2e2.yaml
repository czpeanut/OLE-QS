  stem: 在口語表達或書面文章中使用修辭法，不僅可以使語言表達更生動、富有感染力，甚至可以提高語言的美感和藝術性，進而使文章或演講更加生動易懂，引人入勝。下列文句運用的修辭法何者有誤？
  options:
  - label: A
    content: 陳康肅公的射箭技術是當世無雙，世界第一，他也因此而感到自滿——誇飾
  - label: B
    content: 螢火蟲高高低低的飛，似暗夜中的一盞風燈，讓人覺得很溫暖——轉化
  - label: C
    content: 只要我們具備足夠的審美觀，就能從看似單調的景觀中發現豐富的生命力——映襯
  - label: D
    content: 阿明的眼睛真雪亮，連老師寫在黑板上的字都會寫錯——倒反
