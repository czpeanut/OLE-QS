      chapter: null
- id: doc_113_台中_向上_國文_g7s2e2_s3_34
  section: 3
  number: 34
  type: single
  page: 3
  stem: 根據上文所述，下列選項何者有誤？
  options:
  - label: A
    content: 每個人都需要被提醒，才知道要對母親感恩
  - label: B
    content: 百貨公司人員奉勸大家感恩母親多是為了賺取業績
  - label: C
    content: 現代社會中的母職角色，缺乏許多支援
  - label: D
    content: 政客常在選舉結束後，漠視婦女與孩童們的權益。
  group_stem: '每年都有一天叫做「母親節」，這一天百貨公司的專櫃人員會像身負神職一樣，奉勸大家要大大的感恩母親，然而每位人員都是這樣想的嗎？大約是有業績壓力吧！

    在現代社會，作為母親仍然是艱辛且時常感到寂寞的。榮譽、支援與尊重，實在太少。他們與孩童只有在選舉期間才被油滑的政客想起，等把「神聖的一票」投出去後，又被忘了……

    從坐在巍峨之位者的眼中望去，這島嶼上還有婦女與孩童嗎？大概……大概……沒有。'
  tags:
