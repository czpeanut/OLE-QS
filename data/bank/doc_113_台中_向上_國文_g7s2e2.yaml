- id: doc_113_台中_向上_國文_g7s2e2_s3_4
  section: 3
  number: 4
  type: single
  page: 1
  stem: 下列文句，何者用字完全正確？
  options:
  - label: A
    content: 朱自清籍《背影》一文，展現其對父親的真摯情意，將父親的慈愛刻畫得思思入扣
  - label: B
    content: 農夫一身疲憊的回家後，洋洋得意的告訴家人，自己將田中秧苗都先拔高了，這樣一定會長得比別家還好，家人聽了直搖頭
  - label: C
    content: 南方朔深夜專程駕車到台北一處近郊看螢，時間己過子夜，延著小路開到路窮之處，就見螢火蟲翩翩飛來
  - label: D
    content: 閏秀人家用紈扇和螢共玩，如同人螢共舞，那是古典的另一種蔓妙。
  tags:
    textbook: 七下 第二課 背影
    labeled_by: ai
    chapter:
      publisher: 南一
      book: 七下
      subject: 國文
      code: 第二課
      title: 背影
      chapter: null
- id: doc_113_台中_向上_國文_g7s2e2_s3_5
  section: 3
  number: 5
  type: single
  page: 1
  stem: 下列文句何者最合乎邏輯，沒有語病？
  options:
  - label: A
    content: 燦爛的星空下，兩、三個​​人熙熙攘攘地走著，靜靜地分享夜晚的沉默
  - label: B
    content: 天快亮時，站在大雪山巔準備欣賞朝陽從雲海緩緩升起之美
  - label: C
    content: 小明悲痛難忍的目睹著曾祖父心臟病緩緩猝發而離世，實在令人同情
  - label: D
    content: 我時常以騎腳踏車的方式來鍛鍊體力，這是我最喜歡的健行方式。
  tags:
    textbook: 七下 第六課 劉墉寓言作品選
    labeled_by: ai
