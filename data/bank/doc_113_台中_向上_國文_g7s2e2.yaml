  stem: 「古代使用十二時辰來記錄時間，每個時辰約等於現代的兩小時，並以地支命名，如子、丑、寅、卯等。北宋以後，人們進一步將每個時辰分為『初』與『正』，分別對應該時辰的前後各一小時，與現今的一天二十四小時制相吻合。小樂與小安約好在『亥時初』一起看煙火表演。請問小安『最晚』幾點到現場，才不會遲到？」
