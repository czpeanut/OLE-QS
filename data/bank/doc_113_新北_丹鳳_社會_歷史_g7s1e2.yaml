  section: 1
  number: 26
  type: single
  page: 1
  stem: 彰化舊稱「半線」，意為臺灣南北交通要道中點。雍正皇帝在位時，此地增設一縣，並將其改名為彰化，意為「彰顯皇化」。究其原因，雍正年間增設彰化等行政區，是因哪一事件的發生？
  options:
