- id: doc_113_新北_丹鳳_社會_歷史_g7s1e2_s1_22
  section: 1
  number: 22
  type: single
  page: 1
  stem: '沈葆楨開啟了臺灣的近代化倡導之路，對臺灣歷史發展也有重大影響。關於沈葆楨在臺灣推行的新政，下列何者正確?

    (甲)開闢北中南三條連接臺灣南、北部的古道

    (乙)推動「化番為民」及「開山撫番」政策，廢除「土牛溝」

    (丙)開始架設電報線

    (丁)修築第一座西式砲台「億載金城 」，加強防務'
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丁
  - label: C
    content: 甲丙
  - label: D
    content: 丙丁
