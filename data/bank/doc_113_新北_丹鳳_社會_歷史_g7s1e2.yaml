  section: 1
  number: 32
  type: single
  page: 2
  stem: '大肚王國曾是臺灣中部一個原住民跨部落聯盟，勢力範圍主要在今日的中、彰、投一帶。17 世紀因外來勢力不斷入侵其傳統領域，大肚王曾領導部落反抗，但仍被迫妥協。而後又遭另一外來勢力派兵鎮壓，至
    18 世紀已消失瓦解。請問：上文中所提到的外來勢力有那些？

    (甲)荷蘭人 (乙)西班牙人 (丙)日本人 (丁)鄭氏政權'
