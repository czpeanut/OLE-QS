- id: doc_113_新北_丹鳳_社會_歷史_g7s1e2_s1_23
  section: 1
  number: 23
  type: single
  page: 1
  stem: '法國文化部於1984 年舉辦「古蹟開放日」，迄今全球已有50 多個國家共襄盛舉。2020 年，臺灣也希望透過全國古蹟日活動的舉辦，增進新生世代保護文化資產的概念。新北市政府因此舉辦全國古蹟日，活動的主題為「回到1884---探訪滬尾之役歷史軌跡」。

    請問，「滬尾之役」是指哪一場戰役？'
  options:
  - label: A
    content: 英法聯軍
  - label: B
    content: 牡丹社事件
  - label: C
    content: 清法戰爭
  - label: D
    content: 甲午戰爭
  tags:
