  stem: 《丹鳳歷史報》記者頌恩的報導：「此文件俗稱「番仔契」，(甲)是由漢人與原住民所簽訂的土地契約。文件上的文字被稱為「新港文」，(乙)是十七世紀荷蘭人統治臺灣時，為了統治和傳教之便，傳教士以(丙)羅馬文字拼寫(丁)凱達格蘭族語言，其中以新港社留下文件最多，故稱「新港文書」。請問，頌恩的報導何處錯誤？
