  number: 27
  type: single
  page: 1
  stem: 因漢人移民的拓墾範圍不斷擴張，清廷經營臺灣是由南而北，由西而東陸續設置行政單位。而吳沙率領漢人成功進入此地區開墾，因而促使清廷增設那一行政區，為清領前期最晚設置的行政區？
  options:
