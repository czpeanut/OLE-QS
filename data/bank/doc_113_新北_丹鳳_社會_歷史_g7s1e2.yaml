- id: doc_113_新北_丹鳳_社會_歷史_g7s1e2_s1_21
  section: 1
  number: 21
  type: single
  page: 1
  stem: 淡水英國領事館的創建，象徵西洋勢力的到達。隨著英國的商務拓展，領事館的地位更加重要。甚至還與清廷訂立「紅毛城永久租約」，將領事館設在紅毛城內。請問，西方勢力再度進入臺灣的背景為何？
  options:
  - label: A
    content: 牡丹社事件後，英人來臺設領事館
  - label: B
    content: 臺灣建省後，開放外人自由貿易傳教
  - label: C
    content: 清法戰爭後，清朝簽約通商，准許各國來臺貿易
  - label: D
    content: 英法聯軍後，臺灣被迫開放淡水等通商口岸
