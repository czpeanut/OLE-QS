  section: 1
  number: 25
  type: single
  page: 1
  stem: 昱珉翻閱《話說臺灣地名》時，發現在清領前期「竹圍、木柵、土城」等地名與城牆改建具有關聯性。關於這些地名的變化，其共同的原因為何？
