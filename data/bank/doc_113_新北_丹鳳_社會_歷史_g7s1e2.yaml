  section: 1
  number: 24
  type: single
  page: 1
  stem: 承上題，「滬尾之役」之後，對臺灣所造成的影響為何？
  options:
  - label: A
    content: 清帝國開始積極建設臺灣
  - label: B
    content: 臺灣建立行省，不再隸屬於福建省
  - label: C
    content: 臺灣開了四個通商口岸
  - label: D
    content: 解除過去限制漢人來臺的禁令
