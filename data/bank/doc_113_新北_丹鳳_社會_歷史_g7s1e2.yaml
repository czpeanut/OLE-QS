  section: 1
  number: 33
  type: single
  page: 2
  stem: 荷蘭總督曾說：「臺灣真是一頭好乳牛」。荷蘭人統治臺灣並非想建設臺灣，而是盡可能的榨取利益。關於荷蘭人對臺灣的統治，何者有誤？
  options:
  - label: A
    content: 授予長老權力，實行間接統治
  - label: B
    content: 曾聯合原住民，鎮壓反抗的郭懷一
  - label: C
    content: 強迫原住民學習荷蘭文以讀聖經
  - label: D
    content: 各社長老必須定期參加地方會議
