  type: single
  page: 1
  stem: 臺東有「鐵花路」及「鐵花村」景點地名，是為了感謝《母親的教誨》作者胡適的父親「胡傳」（字鐵花），調任臺東直隸州代理知州時，對當地的貢獻而得名。請問，胡鐵花應是在哪一時期調派至臺灣？
  options:
  - label: A
    content: 沈葆楨治臺時期
  - label: B
    content: 劉銘傳治臺時期
  - label: C
    content: 臺灣納入版圖後
  - label: D
    content: 臺灣開港通商後
