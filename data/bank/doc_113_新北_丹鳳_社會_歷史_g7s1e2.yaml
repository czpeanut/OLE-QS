  section: 1
  number: 29
  type: single
  page: 1
  stem: 劉銘傳在臺六年，對臺灣的現代化有極大貢獻，被譽為「臺灣現代化之父」。綜觀他對臺灣的建設，下列敘述何者並非他的政績？
  options:
  - label: A
    content: 開闢南迴公路等三條通往後山的道路
  - label: B
    content: 於淡水、基隆修築西式砲台
  - label: C
    content: 穿越獅球嶺隧道，往來於臺北到基隆的鐵路
  - label: D
    content: 在臺南、臺北架設電報線，並遠及海峽對岸的福州
