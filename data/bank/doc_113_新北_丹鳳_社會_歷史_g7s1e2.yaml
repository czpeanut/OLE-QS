- id: doc_113_新北_丹鳳_社會_歷史_g7s1e2_s1_20
  section: 1
  number: 20
  type: single
  page: 1
  stem: 鄭克塽降清後，清廷對臺灣的棄留，意見不一。以皇帝為首的多數官員主張放棄臺灣，認為臺灣是孤懸海外的彈丸之地，一來統治不易，二來收不收入版圖對大清帝國也沒多大影響。而某官員則強烈反對放棄臺灣，力主保留。關於這段歷史，何人說法符合史實？
  options:
  - label: A
    content: 晨威：被保留的關鍵因素之一是臺灣戰略價值高
  - label: B
    content: 林立：主張必須保留臺灣的官員是沈葆楨
  - label: C
    content: 傑憲：乾隆皇帝最後決定將臺灣納入中國版圖
  - label: D
    content: 俊麟：海外貿易興盛是力主留下臺灣的另一原因
  tags:
