  section: 1
  number: 30
  type: single
  page: 1
  stem: 清朝統治臺灣初期，為避免臺灣再度成為反清的基地，採取了「為防臺而治臺」的政策，頒布許多限制。對於當時的政策，何項敘述並不屬實？
  options:
  - label: A
    content: 漢人不允許進入山區開墾
  - label: B
    content: 禁令執行嚴格，偷渡來臺者甚少
  - label: C
    content: 渡臺者不可攜帶家眷隨行
  - label: D
    content: 渡臺者必須申請證照
