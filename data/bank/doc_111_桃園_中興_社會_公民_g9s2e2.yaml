- id: doc_111_桃園_中興_社會_公民_g9s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 某製作公司為拍攝影集，到苗栗南庄神仙谷取景，卻發生攝影師及助理兩人跌落山谷喪命的意外，勞動部職安署中區職業安全衛生中心派員檢查，初步認定劇組未依『甲』法準備救生圈、攔截繩等緊急救援器材，將依『甲』法開罰
    3 萬到 30 萬元罰鍰。致勞工死亡部分可處 3 年以下有期徒刑，將移送地檢署偵辦。上文中所提的『甲』法，應為下列何項法律？
  options:
  - label: A
    content: 性別工作平等法
  - label: B
    content: 職業安全衛生法
  - label: C
    content: 就業保險法
  - label: D
    content: 勞動基準法。
- id: doc_111_桃園_中興_社會_公民_g9s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 在全球化的趨勢下，跨國移動的機率增加，我國許多家庭也朝向聘雇國際移工來進行家務或照顧工作，即使聘雇過程必須克服申請手續、語言障礙等關卡，國際移工仍成為此項工作的首選或主力。下列何者可能是最主要的原因？
  options:
  - label: A
    content: 我國法律給予國際移工較多保障
  - label: B
    content: 全球化使國際移工成為強勢文化
  - label: C
    content: 移工到他國工作具有正向非金錢誘因
  - label: D
    content: 給付移工薪資低於聘雇本國籍的勞工。
- id: doc_111_桃園_中興_社會_公民_g9s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 「疫苗外交」是指一國利用疫苗作為拉攏或排斥其他國家的手段，成為新冠肺炎疫情期間，國際間的重要議題。由此可知，疫苗外交與下列哪一個概念密切相關？
  options:
  - label: A
    content: 政治全球化
  - label: B
    content: 環境全球化
  - label: C
    content: 經濟全球化
  - label: D
    content: 文化全球化。
- id: doc_111_桃園_中興_社會_公民_g9s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 西元2012 年，臺鐵為了避免國際移工在臺北車站大廳聚會，拉起了紅龍，限制移工使用。西元2015 年，臺鐵臺北車站設置「穆斯林祈禱室」，踏出友善穆斯林移工的一步。到了西元2017
    年，臺鐵桃園火車站考量我國移工信仰的需求，利用桃園新站一樓設置「穆斯林祈禱室」，祈禱室中有男女獨立空間、拜毯、沙龍、《古蘭經》等軟硬體，讓移工在異鄉，也能自在禱告。根據上述在公共空間的使用政策演進，以下何項詮釋最符合上文的要旨？
  options:
  - label: A
    content: 從公平貿易的角度來保障國際移工的勞動權
  - label: B
    content: 從減緩貧富差距的角度保障國際移工的薪資
  - label: C
    content: 從消除刻板印象的角度尊重移工的宗教文化
  - label: D
    content: 從消除多元文化的角度鼓勵移工要融入我國。
- id: doc_111_桃園_中興_社會_公民_g9s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 資方(雇主，老闆)聘僱勞工協助生產並給予薪資，勞方(勞工)受雇於固定的雇主並按月取薪資，雇主和勞工間為僱傭關係，政府特制定勞基法以保障勞工工資、工時、資遣費、休假等最低保障，下列何人享有勞基法最低保障？
  options:
  - label: A
    content: 大醫院小護士
  - label: B
    content: 平台外送員
  - label: C
    content: 接案水電工
  - label: D
    content: Uber 司機
  group_stem: '《勞動基準法》第1 條

    1. 為規定勞動條件最低標準，保障勞工權益，加強勞雇關係，促進社會與經濟發展，特制定本法；本法未規定者，適用其他法律之規定。

    2. 雇主與勞工所訂勞動條件，不得低於本法所定之最低標準。

    請回答第12、13 題'
- id: doc_111_桃園_中興_社會_公民_g9s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 我國特別制定上述《勞動基準法》相關內容來限制雇主以保障勞工，最主要的原因為下列何者？
  options:
  - label: A
    content: 勞方社會地位低下，需特別給予保護
  - label: B
    content: 資方擁有訴訟權而勞方無，需明確法律規範
  - label: C
    content: 資方握有發薪權力，勞資權力不對等
  - label: D
    content: 促成社會地位流動，保障勞方的平等權。
  group_stem: '《勞動基準法》第1 條

    1. 為規定勞動條件最低標準，保障勞工權益，加強勞雇關係，促進社會與經濟發展，特制定本法；本法未規定者，適用其他法律之規定。

    2. 雇主與勞工所訂勞動條件，不得低於本法所定之最低標準。

    請回答第12、13 題'
