- id: doc_111_桃園_中興_社會_公民_g9s2e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: '某國學者在研究國內勞動行為時，發現了右表的某種現象。根據表中內容判斷，該位學者所發現的現象應為下列何者？


    | | 女性所占比例 |

    | :--- | :--- |

    | 本國籍從事家務勞動 | 92% |

    | 國際移工從事家庭幫傭工作 | 95% |'
  options:
  - label: A
    content: 女性擅長家庭照顧的工作
  - label: B
    content: 市場勞動對女性具有負向非金錢誘因
  - label: C
    content: 家務工作由特定性別承擔
  - label: D
    content: 家務勞動對女性具有正向金錢誘因。
- id: doc_111_桃園_中興_社會_公民_g9s2e2_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 全球化帶給全人類許多便利與福利，但也帶來負面的影響，而引發反全球化的省思。下列何者最可能是反全球化人士提出的看法？
  options:
  - label: A
    content: 增進個人與國際間的溝通，改變人際交往模式
  - label: B
    content: 經濟活動多樣化，消費者的選擇增多
  - label: C
    content: 文化交流頻繁，開闊個人胸襟視野
  - label: D
    content: 跨國經濟發展，造成貧富差距。
- id: doc_111_桃園_中興_社會_公民_g9s2e2_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 根據財政部統計處公布我國111 年出進口貿易概況報告，最大出口項目為電子零組件，出口金額約2,001 億美元，創歷年新高，年增率16.4％，占整體出口比重41.7％。由上述資料判斷我國可能出現以下何種狀況？
  options:
  - label: A
    content: 生產電子零組件的機會成本較進口國高
  - label: B
    content: 電子零組件廠商因應全球布局擴建廠房
  - label: C
    content: 電子零組件廠商必須透過降價來吸引消費者
