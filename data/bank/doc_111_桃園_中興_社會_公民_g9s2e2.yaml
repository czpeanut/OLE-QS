- id: doc_111_桃園_中興_社會_公民_g9s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 依上述，各國多數投票通過要求俄羅斯從烏克蘭領土無條件撤出，文中***國際組織是下列何項組織？
  options:
  - label: A
    content: 聯合國
  - label: B
    content: 歐洲聯盟
  - label: C
    content: 北大西洋公約組織
  - label: D
    content: 亞太經濟合作會議。
  group_stem: '二十國集團（G20）峇里島峰會於2022 年11 月15 日至16 日舉行，二十國集團領導人會後發表了峇里島峰會宣言，其中重申各國2022
    年3 月2 日在***國際組織多數投票通過的ES-11/1 號決議（141 票贊成、5 票反對、35 票棄權、12 國未投票）對俄羅斯侵略烏克蘭表達最強烈的痛惜，並要求俄羅斯從烏克蘭領土上徹底、無條件撤出。和平解決衝突，一切有利於解決危機的努力，以及外交和對話都很重要。當今時代絕不能是戰爭時代（借用印度總理莫迪向俄羅斯總統普亭的發言），強調這場戰爭正在導致人民嚴重受苦並放大了世界經濟現存的脆弱性。

    請回答第1、2 題'
