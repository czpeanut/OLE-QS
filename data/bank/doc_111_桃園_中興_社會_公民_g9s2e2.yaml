  section: 1
  number: 7
  type: single
  page: 1
  stem: '小康在假日時參加某場講座，聽到右列的部分演講內容。

    有關這場講座的主題最有可能為下列何者？'
  options:
  - label: A
    content: 文化交流對解決國際衝突的重要性
  - label: B
    content: 全球化的浪潮對文化交流有何影響
  - label: C
    content: 國家為何應積極參與國際公共事務
  - label: D
    content: 反全球化對於民間團體有何影響性。
