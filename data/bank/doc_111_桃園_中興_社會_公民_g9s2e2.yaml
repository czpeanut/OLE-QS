- id: doc_111_桃園_中興_社會_公民_g9s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 「無國界醫生」的全球團隊從西元2015 年開始的地中海搜救和希臘難民營，敘利亞和南蘇丹的境內流民，以及孟加拉的羅興亞難民營，他們一直在最需要的地方，協助和保護身處險境的脆弱群體。根據上述，「無國界醫生」最主要從事下列何者？
  options:
  - label: A
    content: 國際交流
  - label: B
    content: 國際衝突
  - label: C
    content: 國際合作
  - label: D
    content: 國際援助。
- id: doc_111_桃園_中興_社會_公民_g9s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 國際組織的分類可以依照加入成員的分布區域區分為全球性與區域性國際組織，依此分類判斷，下列哪一組國際組織的類型完全相同？
  options:
  - label: A
    content: 聯合國、歐洲聯盟、東南亞國協
  - label: B
    content: 聯合國、世界衛生組織、無國界醫生
  - label: C
    content: 歐洲聯盟、綠色和平組織、台灣路竹會
  - label: D
    content: 國際原子能總署、解放兒童組織、亞太經濟合作會議。
- id: doc_111_桃園_中興_社會_公民_g9s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 我國勞動部職業安全衛生署建立「勞工照護資訊平臺」，該平臺提供勞工健康服務專業諮詢與衛教資訊等服務。上述勞動部此舉具有下列何種意涵？
  options:
  - label: A
    content: 政府積極介入改善勞工不利處境
  - label: B
    content: 資訊科技發展使勞工處境更不利
  - label: C
    content: 積極訂定法規以期保障勞工權益
  - label: D
    content: 立法約束雇主保障市場勞動參與。
- id: doc_111_桃園_中興_社會_公民_g9s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 某律師認為臺灣目前沒有「家務有給」的觀念，一般先生給太太家用，只給菜錢、水電費等基本開銷，卻忽略妻子的「人力成本」，而這些人力支出加總後，家庭主婦從事家務勞動的年薪應有百萬。由上述內容判斷，下列推論何者最正確？
  options:
  - label: A
    content: 文中所提及的家務勞動不具備任何的價值
  - label: B
    content: 文中所提及的家務勞動應該屬於市場勞動
  - label: C
    content: 文中所提家務勞動已為社會創造實質的經濟價值
  - label: D
    content: 文中所提及的家務勞動應該屬於無酬勞動。
