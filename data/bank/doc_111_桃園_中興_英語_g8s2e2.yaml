  group_stem: 'Please read the dialogue and answer the following questions:


    Taco: Tom, I have been thinking about one song lately but couldn’t come up with
    the name of it. Can you give me a hand?

    Tom: Sure. I can lend you a hand and an ear. Sing it to me.

    Taco: I can’t. I forget its melody. But I have the lyrics. Here it is:

    Without you it feels like

    A sentence without no spaces

    It’d be like YouTube without no playlist

    Or a chapter without no pages

    Without you it feels just wrong

    Tom: I know it. This song is very popular in Taiwan, and the name of the song
    is already in the lyrics.

    Taco: ...“YouTube”?

    Tom: …


    * melody 旋律 lyrics 歌詞

    * figure of speech 修辭法'
