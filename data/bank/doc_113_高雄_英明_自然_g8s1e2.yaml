    content: 因太陽光中的可見光僅有紅綠藍三種顏色的光波，故定三原色為紅綠藍
  - label: B
    content: 對任何動物而言，光都可分為紅綠藍三原色
  - label: C
    content: 人的三原色是紅綠藍，故可看到的顏色僅有黑、白、紅、綠、藍五色
  - label: D
    content: 人的錐狀細胞中，又以分辨紅、綠、藍的三種錐狀細胞最多，故光的三原色為紅綠藍。
  group_stem: 為什麼光的三原色是紅綠藍，而不是其他顏色呢？人的視網膜中有一種柱狀細胞，有助於暗處視力及偵視移動物體；另一種細胞為錐狀細胞，其主要功能在於分辨顏色和辨別微細之處。而人的錐狀細胞中，又以分辨紅、綠、藍的三種錐狀細胞最多，因此人們所見的顏色主要就是以紅、綠、藍相配色而成，所以我們將紅、綠、藍稱為光的三原色。而狗僅有兩種錐狀細胞，因此它所見到世界的顏色，會與我們大不相同。舉例來說，若有種染料僅能吸收綠光，則用白光照射此染料時，染料會呈現洋紅色，此即為染料三原色之一。試回答下列問題：
