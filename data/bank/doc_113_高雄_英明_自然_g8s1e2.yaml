- id: doc_113_高雄_英明_自然_g8s1e2_s1_41
  section: 1
  number: 41
  type: single
  page: 6
  stem: 下列有關雷射的敘述，何者錯誤？
  options:
  - label: A
    content: 在自然界是觀察不到的
  - label: B
    content: 入射面鏡仍會產生反射且遵守反射定律
  - label: C
    content: 在空氣或水中或玻璃以直線傳播
  - label: D
    content: 由空氣斜射入水中不會產生折射現象。
  group_stem: "雷射是一種光源，只是它發光的原理和一般光源不同，一般光源是經由「自發放射」，而雷射是以「受激放射」來發光的，但受激放射，在自然界是觀察不到的。而不論是氣體、液體、晶體及半導體都可作為產生雷射的介質，雷射產生的光束具有高度的平行、純色、同調及高強度等特性。\n\
    \  雷射起初是應用在遙測、科學研究、工業及軍事等方面。時至今日，它已經廣泛地應用在日常生活中，除了切割、焊接和鑽孔等類型的加工外，半導體雷射可以讀取光碟中儲存的訊息，經轉換後可以成為音樂或影像。如果把雷射應用到人體上，雷射的功率不必太高，就可以作外科手術、止血、去除色斑和修正視力等。因為進行手術時不接觸傷口，可減少感染。此外，雷射在整容方面的功能極受重視，這正反映了人愛美的天性。"
