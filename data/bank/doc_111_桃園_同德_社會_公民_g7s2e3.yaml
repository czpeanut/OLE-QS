  - label: B
    content: 社會流動
  - label: C
    content: 性別歧視
  - label: D
    content: 責任負擔
  group_stem: '「#MeToo」是 2017 年 10 月哈維•韋恩斯坦性騷擾事件後在社交媒體上廣泛傳播的一個主題標籤，用於譴責性侵犯與性騷擾行為。美國女演員艾莉莎•米蘭諾鼓勵女性在推特上公開被侵犯的經歷，以使人們能認識到這些行為的普遍性。自此之後，數百萬人使用了這一標籤來公開她們的不快經歷，其中也包括許多知名人士。

    台灣版的「#MeToo」運動則是由劇集《人選之人-造浪者》在台灣掀起一股巨浪，並且從政治圈延燒到各個領域。這些知名人物紛紛在這場「#Me too」浪潮中，因為過往的性騷擾事件，紛紛中箭落馬而形象崩毀。'
