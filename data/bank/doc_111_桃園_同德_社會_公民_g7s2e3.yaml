- id: doc_111_桃園_同德_社會_公民_g7s2e3_s1_55
  section: 1
  number: 55
  type: single
  page: 2
  stem: 根據上文所述，說明社會福利資源的分配受到哪項影響很深？
  options:
  - label: A
    content: 人民實際需要
  - label: B
    content: 政治因素影響
  - label: C
    content: 城鄉差距影響
  - label: D
    content: 國家財政因素。
  group_stem: '我國經常舉辦選舉，為爭取選民支持，社會福利議題常常是勝選的最大利器。例如：「農民健康保險」的誕生，就是由雲林縣農民權益促進會的林國華等人，以農業開放可能導致農民權利受損，率領農民北上臺北請願，並提出全面農保眷保、肥料自由買賣、農地自由買賣等
    7 項要求。

    1989 年余陳月瑛爭取高雄縣縣長連任，提出「高雄縣農民健康保險」政策，最終連任成功，甚至迫使當時執政的國民黨，全面實施「試辦農民健康保險」，以免在選舉中失利。至此以後，這種以爭取選票為導向的社會福利政策，就成為選舉的常態。

    （資料來源：改寫自鍾起岱，臺灣農村社會保障制度之變遷與發展，2019/5/1。）'
