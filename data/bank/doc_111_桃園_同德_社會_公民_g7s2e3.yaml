  group_stem: '芒草心慈善協會「街遊城市導覽員」計畫

    街遊 Hidden Taipei 是芒草心慈善協會專注於社會溝通的專案，自 2014 年開始帶著遊客探索臺北的另一面。導覽員是曾有流浪經驗的民眾，不僅帶著遊客一探臺北街頭，也在這過程中看見他們的人生故事。導覽員和協會規畫出和他們生命故事緊緊連結的導覽路線，透過導覽員的敘說，遊客得以從無家者的角度重新認識臺北。導覽員透過更多人際互動，更有自信及得到改善生活的機會（導覽收入改善生活）。'
