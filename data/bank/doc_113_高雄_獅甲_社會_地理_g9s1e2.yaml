  stem: 根據文中所述，俄羅斯西側海岸臨的海域為圖(一)中哪些代號，下列配對何者完全正確？
  options:
  - label: A
    content: ㄅ-北海、ㄇ-黑海
  - label: B
    content: ㄆ-波羅的海、ㄈ-裏海
  - label: C
    content: ㄅ-波羅的海、ㄇ-黑海
  - label: D
    content: ㄆ-北海、ㄈ-裏海
  group_stem: "俄烏戰爭讓俄羅斯經濟快垮了？\n   俄羅斯是世界上國土面積最大的國家，除了北鄰北極海，東、西兩側也均擁有海岸。廣大的國土及豐富的天然資源雖然提供了俄羅斯經濟成長的動能，但從長期來看，其極度依賴天然資源輸出的結果，使其他產業的發展相對弱勢，難以在國際市場上具競爭動能。\n\
    \   此外，雖然受惠於蘇聯時期遺留下來的教育體系，俄羅斯的勞工普遍受教育程度高，相對於許多發展中國家擁有更強的競爭力，然而其在人口結構、經商環境及國內市場機制等方面，都限制著俄羅斯獲得更多來自外部投資的潛能。\n\
    \   西元2022年，俄羅斯軍隊入侵烏克蘭，俄羅斯遭到國際社會普遍譴責，並對其進行各種制裁，如俄羅斯中央銀行高達3,000多億美金的外匯存底遭凍結(將近俄羅斯政府一半的外匯儲備)，加上戰爭進展遠不如預期、歐洲國家限制俄羅斯能源的進口等一系列因素，使得俄羅斯在西元2022年的經濟成長衰退3.4%。\n\
    \   根據學者分析，俄羅斯入侵烏克蘭除了經濟受影響之外，國家也會面臨嚴重的人口危機。除了受過良好教育的年輕人加速流失之外，若將新冠肺炎(Covid-19)疫情病亡、戰爭傷亡及因動員而逃亡的人數加總，\
    \ 俄羅斯近三年的人口大幅減少190～280萬人，15歲以上的平均壽命更少了近5年；且戰爭還導致女性人口至少比男性多1,000萬人，讓俄羅斯的性別比失衡情況加劇。學者也估計西元2024～2027年，俄羅斯將因國內情勢動盪、國際一系列的制裁影響、缺乏投資及貿易夥伴轉移等因素，使俄羅斯的經濟發展陷入低成長。\
    \      (取自中時新聞網https://www.chinatimes.com/realtimenews/20230306002824-260410?chdtv)"
