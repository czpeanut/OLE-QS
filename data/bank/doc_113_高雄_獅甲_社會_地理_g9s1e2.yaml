    content: 歷史文化
  group_stem: "風靡全球的NBA\n   NBA(National Basketball Association，美國國家籃球協會)是北美洲最大的職業籃球組織，由30支球隊組成(29支在美國、1支在加拿大)，分屬東區與西區兩大聯盟，被視為世界最高水準的男子職業籃球賽事。\n\
    \   目前NBA的球隊多數是以球隊所在城市命名，部分以州的名稱命名，如明尼蘇達灰狼、猶他爵士、印第安納溜馬和金州勇士(金州為加利福尼亞州的別名)等；而布魯克林籃網則是唯一使用區名的隊伍，\
    \ 其隊名來自紐約市布魯克林區。此外，從這些球隊的隊伍名稱，也可觀察出當地的特色。"
