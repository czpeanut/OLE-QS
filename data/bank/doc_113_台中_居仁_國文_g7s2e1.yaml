  - label: D
    content: 卻入空巢裡，啁啾終夜悲
  group_stem: "（一）\n    梁上有雙燕，翩翩雄與雌。銜泥兩椽（１）間，一巢生四兒。四兒日夜長，索（２）食聲孜孜。青蟲不易捕，黃口（３）無飽期。嘴爪雖欲敝（４），心力不知疲。須臾（５）十來往，猶恐巢中飢。辛勤三十日，母瘦雛漸肥。喃喃教言語，一一刷毛衣。一旦羽翼成，引上庭樹枝；舉翅不回顧，隨風四散飛。雌雄空中鳴，聲盡呼不歸；卻入空巢裡，啁啾終夜悲。燕燕爾勿悲，爾當反自思：思爾為雛日，高飛背母時。當時父母念，今日爾應知。\
    \            （白居易 燕詩示劉叟）\n注：（1）椽：架在桁上用以承接木條及屋頂的木材。（2）索：討、要。（3）黃口：雛鳥。因出生時，嘴為黃色。（4）敝：毀壞。（5）須臾：片刻。"
