- id: doc_113_台中_居仁_國文_g7s2e1_s5_6
  section: 5
  number: 6
  type: single
  page: 4
  stem: 「吃冰淇淋要有一點小小的童趣，要暫時放下成人世界裡的一些禮儀。」關於這段文字，下列說明何者正確？
  options:
  - label: A
    content: 孩童吃冰的形象比成人更加體面
  - label: B
    content: 吃冰時不妨展露出孩童般的天真
  - label: C
    content: 孩童吃冰時不須注意大人的禮儀
  - label: D
    content: 成人比孩童更能體會吃冰的樂趣
  group_stem: "（三）\n    「冰淇淋」三字翻譯得真好，好像在酷熱的夏天把一些即將融化的、冰冰涼涼的東西淋澆在你的頭上、心上一般。除了好聽，當然也好吃，中國古代的莊子在書中曾經提到一個叫葉公子高的人，接受了君王的誥命（1），內心煎熬發熱，便要討冰吃，書中沒說此時是冬是夏，可見吃冰淇淋與季節無關，全然與心情，或是境界有關。\n\
    \  我常去的那家冰淇淋專賣店就在兩條馬路的交叉轉角，店面不大，亮晶晶的櫥窗十分可愛，外面裝飾得像城堡一樣，非常合我的心意。那時往往一坐就是一下午，感到外面世界的奔忙都被融化在湯匙底下，自己停格在喧囂城市的某個角落。回臺北以後每天忙得不得了，不過我偶爾還是得偷空去幢（2）奶油色的二樓小鋪吃上一杯，像是一種信仰，並為之醺然、陶然而茫然。\n\
    \  吃冰淇淋要有一點小小的童趣，要暫時放下成人世界裡的一些禮儀，比如說手指沾上了冰淇淋，非用嘴吮不可，又比如說你吃得太慢，許多冰淇淋融成液狀流於杯底，你也不用不好意思，儘管伸長舌頭去舔，這樣才能享受那種快樂，得到那層滋味。在我來說，無論是那家轉角的冰淇淋店，或是奶油色的二樓小鋪，其實都有一層童話的色彩，走進其中，就好像進入了童戈利先生的巷子（3），裡面是旋轉馬的搖鈴聲與神奇的廚師，為你帶來一晌（4）的歡樂與無憂。所以冰淇淋店是最好的約會場所，感覺有點像一對淡綠色翅膀的精靈，帶著一束鮮花去造訪寂寞老巨人的祕密花園，在奇幻而純真的冰淇淋世界裡，就像魔法，約會的兩人將會看到真正的彼此。\n\
    \  藍色的冰淇淋是有翅膀的小馬，披著花氈帶你到橘色冰淇淋的甜月亮上，紫色的是一支魔笛，吹奏流水與無花果的歌帶走全村的童年，留下咖啡色的森林，藏住公主金黃色的長髮，這是冰淇淋的王國，無憂的世界。只可惜誰都無法長留，有如童年一般，穿過街角就長大，再回頭什麼也找不到。所以街角的冰淇淋店有時帶著一種逝去的感傷，在人生匆忙裡無法暫停的一瞬間。\n\
    \  最近一次去冰淇淋店已是數月以前，美好的週末下午，陽光融融，妻子穿著美麗的花裙與輕巧的便鞋，人潮擁擠，等待的隊伍很長，午後的時光變得焦躁了起來，而我們居然幸運地坐到了窗邊的位置，窗外的綠樹正開黃花，冰淇淋也相同的沁涼，然我們卻越坐越感到不安，馬路上川流的車潮，室內震耳的喧譁，旁邊的人不是在品嘗冰淇淋，而是在急切地推銷一種商品，或是努力說服別人購買一種服務，我們終是黯然地離開了那小小的窗邊，像遺失了往下一站的車票一般，心情不知放在哪裡才好。\n\
    \  之後我們就真的長大了，很在乎生命裡的得失，而不是喜悅。\n  前幾天，我們竟嚴重地思念那家街角的冰淇淋店，一個悠閒的下午，一種神祕而強烈的幸褔的感覺，或是廣袤的柔軟的夜晚，星星們在朗誦一首詩，「啊！那個時候啊……」我們都感嘆著，感嘆著，最後，像以前戀愛的時候那樣，我約她找一個不錯的好日子，一起穿過街角，回到那有旋轉馬鈴聲的冰淇淋小店。\
    \       （節選自徐國能 街角的冰淇淋小店）\n注：（1）誥命：古時朝廷頒賜爵位的詔令。（2）幢：計算房屋的單位。（3）童戈利先生的巷子：英國童話保母包萍中一條只能偶爾闖入，但無法在現實中找到的魔法小巷。（4）晌：一會兒、片刻的時間。"
