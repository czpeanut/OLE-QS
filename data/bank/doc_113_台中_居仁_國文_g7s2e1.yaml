  options:
  - label: A
    content: 兩人都好大喜功，不腳踏實地
  - label: B
    content: 兩人都沒奉行父親所傳的技藝
  - label: C
    content: 兩人都重視羽毛鮮豔的天雞
  - label: D
    content: 兩人養雞的方式都如出一轍
  group_stem: "（二）\n    狙氏子（１）不得父術，而得雞之性焉。其畜養者，冠距（２）不舉，毛羽不彰，兀然（３）若無飲啄意。洎（４）見敵，則他雞之雄也；伺晨，則他雞之先也。故謂之天雞。\n\
    \  狙氏死，傳其術於子焉，乃反先人之道，非毛羽彩錯、嘴距銛利（５）者，不與其棲。無復向時伺晨之儔、見敵之勇，峨冠（６）高步，飲啄而已。\n  吁（７）！道之壞也，有是夫！\
    \    （羅隱 說天雞）\n注：（１）狙氏子：一說狙為姓氏，另一說，指養猴的人。狙，音ㄐㄩ，獼猴。（２）距：爪。（３）兀然：渾然無知的樣子，此指無精打采。（４）洎：音ㄐㄧˋ，到、及。（５）銛利：鋒利。銛，音ㄒㄧㄢ。（６）峨冠：指聳著雞冠。（７）吁：音ㄒㄩ，表示驚嘆、疑怪的意思。"
