- id: doc_113_台中_居仁_國文_g7s2e1_s5_9
  section: 5
  number: 9
  type: single
  page: 5
  stem: 根據甲文，可知「吉伊卡哇」聲量忽然飆高的原因為何？
  options:
  - label: A
    content: 臺灣代理商取得獨家授權後，開發眾多限定的商品
  - label: B
    content: 粉絲以其角色為原型進行再次創作，展現更多創意
  - label: C
    content: 原作者創造出全新角色，並首次出現在動畫作品中
  - label: D
    content: 動畫的播出不僅造成討論風潮，也擴大了受眾範圍
  group_stem: "（四）\n(甲)\n    吉伊卡哇故事中的角色雖然可愛又療癒，但在他們溫馨的日常故事中，其實隱藏了許多真實的人生寫照，讓粉絲們感到被同理。在「吉伊卡哇」的世界裡，不僅要打工賺錢養活自己，有時還要討伐怪物，雖然為了生活而努力工作，但付出卻不一定能獲得相應回報……。隨著愈來愈多人喜愛「吉伊卡哇」，其近一年多來的聲量也持續升高，走勢由下表可見：\n\
    （改寫自：聯合新聞網 日本超人氣吉伊卡哇竄紅 可愛療癒背後是人生寫照2024.03.21）\n (乙)\n    圓胖可愛的多肉植物、姿勢逗趣的動物公仔……，造型各異的療癒小物掀起蒐集熱潮，成為現代人最即時的精神支柱。這些療癒小物的單價不高，對上班族來說不僅容易入手，也可立即撫慰人心，因此愈來愈多人喜歡在辦公桌上用療癒小物布置一方天地，讓心靈有個暫時的避風港。\n\
    \    社會學專家指出，人們在面對難以動搖的社會結構時，普遍充滿無力感，當社會對人們要求得太多，而人們自認能做到的太少，又矛盾的覺得他人對不起自己時，內心所湧現的匱乏感、混亂感及不平衡感，便驅使人們向療癒商品尋求心理安慰。療癒商品帶來的「小確幸」使宛如身在壓力鍋中的現代人有了一絲洩壓的空隙，也讓「有話題、有故事、有共鳴」成為其共同特性。\n\
    \    不過，療癒商品也許可以使人們「短期回血」，卻很難真正解決問題。當人們因為獲得短暫療癒而對現實痛苦或困境感到麻痺時，會否因此失去對於未來的感知能力呢？\n\
    \         （改寫：Cheers 快樂工作人網站2020.02.03）"
