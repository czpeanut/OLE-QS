    content: 臺灣擁有特有種生態
  - label: B
    content: 臺灣多高山地形
  - label: C
    content: 臺灣位在溫帶和熱帶交界
  - label: D
    content: 臺灣位在東亞島弧上。
  group_stem: ◆黑面琵鷺是世界上非常稀少的鳥種，被列為瀕臨滅絕動物保護，每年10 月左右會從朝鮮半島飛抵臺灣，一直待到翌年的3 至5 月左右，才陸續飛離。這一段時期是賞黑面琵鷺的最佳時機。由於黑面琵鷺是白天休息、晚間覓食，因此，若透過望遠鏡觀察，白天所看到的黑面琵鷺，幾乎都是一動也不動的群聚在一起，到了下午4、5
    點開始，牠們會開始玩耍、洗澡，或是互相整理羽毛，然後開始活動，幸運的話可以看到黑面琵鷺振趐飛翔的英姿。請依敘述回答13-14 題：
