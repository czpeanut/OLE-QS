- id: doc_113_新北_板橋_國文_g8s2e1_s5_28
  section: 5
  number: 28
  type: single
  page: 5
  stem: 關於本文的敘述說明，下列何者正確？
  options:
  - label: A
    content: 鰻魚資源因工業化、海陸生態變化以及鰻魚產卵方式的改變而持續下降
  - label: B
    content: 無論國內外皆建議全面禁止鰻魚的捕撈，以期鰻魚資源能更快恢復
  - label: C
    content: 由上圖可知，2009 年CITES 生效後，鰻魚資源量持續穩定上升，可見成效顯著
  - label: D
    content: 「封溪護鰻措施」仍有其執行上的問題，需多面向考量方能有更確切效果。
  group_stem: "(3)香甜可口的鰻魚飯，是大多數人對於鰻魚的第一印象，而這類料理的鰻魚，就是日本鰻。國立台灣大學漁業科學研究所教授韓玉山指出，鰻魚至今依舊只能倚賴野生苗作為魚苗來源，而全球的鰻魚資源，持續走向衰敗的頹勢沒有反轉跡象。由於人們吃的鰻魚高度依賴天然資源，在長期過度捕撈、工業發展、棲地破壞等因素下，全球鰻魚資源正處於極端衰退的態勢。\n\
    \ 公視2014 年紀錄片《消失的鰻魚》指出，日本鰻在近40 年數量減少95％。韓玉山強調，經過這十年的宣導和規範管制，鰻魚的衰敗頹勢幾乎沒有反轉跡象，「以前每天都可以抓，但如今一年抓不到幾條」。\n\
    \ 韓玉山解釋，鰻魚資源下降的主要原因有：鰻魚棲息地多位於河川和河口，然而工業化使得棲地生態環境受嚴重破壞，鰻苗數量急劇下降；此外，由於鰻魚經濟價值高，早年更有「鰻苗是窮人的年終獎金」一說，撈越多、賺越多。長期疏於管制下，過度捕撈造成鰻魚數量大幅減少；全球氣候變遷和河川、海洋生態變化對棲息地帶來巨大影響，使鰻魚洄游產卵的過程更加艱鉅、不易生存。\n\
    \ 韓玉山提到，自2009 年《瀕危野生動植物種國際貿易公約》（CITES，又名《華盛頓公約》）生效以來，歐盟已全面禁止出口歐洲鰻至非歐盟地區，以控制捕撈量，減少鰻魚資源的消耗。\n\
    \ 儘管自管制政策實施以來，成鰻的捕獲和養殖量都有減少，但數據指出，歐洲鰻的資源量在這十幾年間其實並未大幅度回升。有鑑於此，國際海洋考察理事會（ICES）進一步建議歐洲全面禁止鰻魚的捕撈與利用，以期未來資源能更快恢復。\n\
    \ 台灣除了規定每年3 至10 月為鰻苗捕撈禁漁期，禁止在距岸三浬內的海域、潮間帶及河口水域以任何方式捕撈鰻苗，為了保護成鰻順利降海產卵，也實施了鰻魚保護河川計畫。由漁業署輔導15個縣市政府中至少一條河川的中下游流域，全年禁止以任何方式捕撈鰻魚。\n\
    \ 不過，「封溪護鰻措施」仍然存在著盲點。一方面僅禁止捕撈鰻魚而非所有魚，便只能仰賴漁民在誤捉鰻魚後，確實放生回溪流中，護鰻效果有限。且只要有漁業活動，河川的保護效果便極其有限，尤以常見的大面積拖網對生態破壞力最強；另一方面，選擇封溪的河川若非日本鰻棲息地，即已受嚴重污染，本就鮮少有鰻魚出沒。\n\
    \n2025 年01 月07 日環境資訊中心 記者鄭芷穎\n節選自《餐桌上炭火香氣也難掩危機 鰻魚捕撈資源保育戰》報導"
