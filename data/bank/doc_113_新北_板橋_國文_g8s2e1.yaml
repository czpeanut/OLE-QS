- id: doc_113_新北_板橋_國文_g8s2e1_s5_26
  section: 5
  number: 26
  type: single
  page: 4
  stem: 關於本文敘述，下列何者正確？
  options:
  - label: A
    content: 作者小時候書籍資源缺乏，只能跟同學借書一起閱讀
  - label: B
    content: 與同學一起閱讀的經驗讓作者能透過氣息、情緒的轉變窺探同伴的靈魂
  - label: C
    content: 網路無遠弗屆，也因其即時性而全面取代了紙本
  - label: D
    content: 紙本閱讀的優點在於可以透過感官，感受其中意義。
  group_stem: "(2)小時候，課外書那麼缺乏的年代，哪個孩子家裏有故事書，就變成眾星拱月的公主或王子，大家年級時，每個教室都規畫出一個小小的閱讀區，由學校圖書館提供幾本書，輪流在每個班級借給學生閱讀，不管有多喜歡那本書，一、兩個禮拜之後，它都會離開。\n\
    \ 為了節省閱讀時間，我和好朋友共讀一本書，這樣一來，就可以在故事書離開我們教室之前，把所有的故事都讀完。我們並肩坐下，將書攤展開來，平放在她右邊膝蓋與我的左邊膝蓋上，我們的視線與呼吸幾乎調成一致，配合著彼此的速度與感受，我們必須按捺住好奇，耐心等待，等著一起翻頁，一起發出驚歎或笑聲，有時是眼淚。可能因為並肩貼靠著的關係，我特別能感受到同伴在閱讀過程中的細微變化，眼珠的轉動，氣息的頻率，情緒的起伏，彷彿我在窺探的，是她內在的靈魂。從那時候我就知道，閱讀是一件很深沈的事，一種很繁複的活動。只是，看起來安靜而已。\n\
    \ 當網路愈來愈無所不在，我總被問道，「有一天，網路會不會全面取代紙本？」或者是，「文學並沒有實用價值，我們為什麼要閱讀？」網路比較像是一種即時的傳播媒體，能夠迅速有效地帶領我們抵達目的地，卻無法令我們一遍又一遍的觀看那些細微的景物，紙本的優越性，就在這裏。打開一本書，嗅聞它的氣味、觸摸它的質感，真正懂得欣賞的人，會像品味紅酒或是鑑賞珍貴皮革那樣地，感受一本書。至於文學有沒有實用價值，就看你怎麼看待了。文學的閱讀與一切藝術活動一樣，都屬於無形的、內在的、靈魂的層次，它不同於有形的、外在的、專業的層次，卻非常重要。\n\
    \ 有些人在專業能力上有很好的表現，卻始終感覺空虛煩躁、不快樂；有些人或許在生活上表現平庸，卻平靜知足與喜樂。受到滋養的靈魂，才會有快樂的人生。而我相信，閱讀是一種豐厚的滋養。\n\
    張曼娟 節錄自《那些美好時光-閱讀的姿態這麼美》"
