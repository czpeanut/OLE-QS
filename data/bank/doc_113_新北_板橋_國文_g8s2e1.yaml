    content: 「弗氏海豚的眼睛非常容易看到，就像每一個玩具布偶總是少不了圓睜睜的眼睛。」藉缺乏生命力的眼神，強化弗氏海豚倉卒慌亂、茫然前行的樣子
  - label: C
    content: 「牠們分裂出的每一個小群體，隨時都在變化隊形，都在改變方向」表現出弗氏海豚擁有堅強的意識及堅定的方向
  - label: D
