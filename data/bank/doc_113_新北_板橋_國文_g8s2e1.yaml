  group_stem: '(1)許允為吏部郎，多用①其鄉里。魏明帝遣虎賁收②之。其婦出誡允曰：「明主可以理奪，難以情求。」既至，帝覈問之。允對曰：「『舉爾所知』。臣之鄉人，臣所知也。陛下檢校為稱職與不？若不稱職，臣受其罪。」既檢校，皆官得其人，於是乃釋。允衣服敗壞，詔賜新衣。初，允被收，舉家號哭。阮新婦自若云：「無憂，尋③還。」作粟粥待。頃之，允至。


