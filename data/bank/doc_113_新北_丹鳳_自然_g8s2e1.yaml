- id: doc_113_新北_丹鳳_自然_g8s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 質量守恆定律及化學反應式是依據道耳頓原子說中的哪一個論點來說明？
  options:
  - label: A
    content: 化學反應，是原子間以新的方式重新結合成另一種物質，在反應過程中，原子的種類與數目不會增加，也不會消失。
  - label: B
    content: 一切物質都是由原子所組成，這種粒子不能再分割。
  - label: C
    content: 相同元素的原子，其原子質量與原子大小均相同；不同元素的原子，其原子質量與原子大小均不同
  - label: D
    content: 化合物是由不同種類的原子以固定的比例組成的。
