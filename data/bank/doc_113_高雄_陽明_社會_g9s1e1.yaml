  group_stem: '閱讀下列選文，回答第10 至11 題：

    在紅豆播種期間，有些農民會在田間施用毒餌，以避免小型鳥類啄食剛撒在土壤上的種子而影響收成，這樣的作法雖能降低農業損失，但由於黑鳶會撿食遭毒死的小型鳥類屍體，所以也間接造成許多黑鳶中毒死亡，影響整體生態環境。有位林姓農夫因認同守護黑鳶的想法和作為，決定改採較友善的耕作方式種植紅豆，他以機械播種將紅豆深埋入土中，取代毒害鳥群的行為，雖然生產成本因而上升，但他相信這才是正確的作法。

    此情況經媒體報導後，吸引某一企業主的關注，決定與農民簽訂耕作契約，保證以特定價格收購農產品，讓農民專心生產，而由該企業負責銷售。受到契約保障的鼓勵，有更多農夫願意嘗試改變作法，與生態環境和諧共生。'
