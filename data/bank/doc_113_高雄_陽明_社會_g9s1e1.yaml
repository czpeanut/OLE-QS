  section: 1
  number: 4
  type: single
  page: 1
  stem: 為了探訪在地美食，小美特地挑了幾家標榜使用在地農產的主題餐廳用餐，她發現義大利的特色菜肴比法國的特色風味餐更愛使用一種植物的果實當作佐料入菜，她上網查了該種作物的分布，如上圖(一)的灰色區域。請問：關於上述植物果實的敘述何者正確？
  options:
  - label: A
    content: 此植物果實為番茄，主要分布於歐洲大平原
  - label: B
