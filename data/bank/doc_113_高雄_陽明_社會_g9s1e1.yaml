  group_stem: 約翰•馬歇爾，畢業於英國劍橋大學，曾經參與希臘克里特島考古遺址的挖掘工作。1902年，他獲得大英博物館的推薦，被派遣到英國在亞洲的殖民地，擔任該地的考古局局長。他熱衷考古，在派駐該地時，接續前人工作，繼續進行多個古代遺址的挖掘，並對桑奇遺址展開復原及研究工作。桑奇遺址主要由三座塔構成：大塔由阿育王所建的磚塔擴建而來，相傳曾藏有釋迦牟尼的遺骨，而二塔、三塔則出土了阿育王時代向外傳法的僧侶們及釋迦牟尼弟子的骨骸，這些考古發現為阿育王致力於該宗教的信仰與傳播提供了實證。同時，馬歇爾也推動制定《古代遺跡保護法案》，界定考古的工作目標及範圍，確立了當地考古研究的基礎。
