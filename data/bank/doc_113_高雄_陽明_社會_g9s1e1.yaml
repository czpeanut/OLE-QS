  group_stem: "◎摩西分紅海是真的？科學家找到關鍵物品\n    「摩西分紅海」是經典著名的舊約聖經故事，據《出埃及記》記載，摩西在西元前1250年帶領受奴役的希伯來人逃出埃及，被法老的軍隊追到紅海海邊，「摩西向海伸杖，上帝便用大東風，使海水一夜退去，水便分開、海就成了乾地」，使希伯來人平安渡海逃離埃及，當埃及軍隊追上來時，紅海再度閉起的經典神蹟。多年來，民眾都認為是虛構的。不過愈來愈多科學家或考古學家宣稱，摩西分紅海的故事可能是真的！瑞典科學家莫勒博士\
    \ (Dr. Lennart Moller) 帶著一隊研究人員踏上當年摩西走過的路，抵達紅海時調查了紅海的底部，結果竟發現許多屬於埃及軍隊的遺物！\n  \
    \  美國科學家按《聖經》所述，用電腦算出3,000年前當地水流和水深等資料，並模擬一股時速101公里的強勁東風，徹夜刮了12小時的情況，發現確可將1.8米深的海水捲走，就有可能令海水分開，露出海底四小時之久。但地點很可能是紅海附近、尼羅河三角洲一處河流與礁湖交滙的地方。領導這項研究的科羅拉多州全國大氣研究中心專家德魯斯說：「這次研究證實，分開海水的確合乎流體動力學原則。」\
    \                                                改編自英國《每日郵報》路透社"
