- id: doc_113_高雄_陽明_社會_g9s1e1_s1_30
  section: 1
  number: 30
  type: single
  page: 5
  stem: 喜愛運動的強恩對於上述的故事十分感興趣，請問他可以去圖書館尋找誰的文學作品？
  options:
