  - label: C
    content: 亞里斯多德
  - label: D
    content: 歐幾里德。
  group_stem: "◎阿基里斯腱--The Heel of Achilles  唯一弱點\n     阿基里斯是希臘早期神話中最英勇善戰的驍將，傳說他是海神女兒西蒂斯所生的兒子。阿基里斯呱呱墜地以後，母親想使兒子健壯永生，把他放在火裡鍛鍊，又捏著他的腳踝倒浸在冥河（Styx）聖水裡浸泡。因此阿基里斯渾身像鋼筋鐵骨，刀槍不入，只有腳踝部位被母親的手捏住，沒有沾到冥河聖水，成為他的唯一致命弱點。在特洛伊戰爭中，太陽神阿波羅把阿基里斯的弱點告訴了特洛伊王子帕里斯，帕里斯知道後，就從遠處射中他的腳跟，殺死了英雄阿基里斯。\n\
    \     阿基里斯腱，是人體最大的肌腱，俗稱『腳筋』，當年籃球巨星 Kobe Bryant 報銷了整個賽季都是因為肌腱受傷。阿基里斯腱斷裂時，會聽到「啪」的一聲，隨後，突然間產生劇痛，腿會瞬間無力，順勢摔倒，就感覺被人從後面踢了一腳一樣。這也是為什麼當年\
    \ Kobe 摔倒時說的第一句話是「你們有沒有踢我？」。直到現在，歐洲人依然把「致命傷」叫做「阿基里斯腱」。\n                     \
