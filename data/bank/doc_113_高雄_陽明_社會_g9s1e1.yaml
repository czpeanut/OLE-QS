- id: doc_113_高雄_陽明_社會_g9s1e1_s1_48
  section: 1
  number: 48
  type: single
  page: 9
  stem: 關於文中10 月1 日第二階段搶票，其資源分配方式最可能為下列何者？
  options:
  - label: A
    content: 先占先贏
  - label: B
    content: 輪流使用
  - label: C
    content: 抽籤決定
  - label: D
    content: 相互協調。
  group_stem: '閱讀下列選文，回答第15 至17 題：

    今年雙十國慶日國慶晚會選在台北市大巨蛋舉辦，市長邀請「二姐」江蕙獻唱，北市府和國慶籌備委員會也宣布9 月30 日開放民眾透過線上搶票入場，更有不分藍綠市議員、立委狂接選服電話，希望能透過管道拿票一睹二姐風采，議會和立院只好限額報名。江蕙將於10
    月5 日登上國慶晚會，這也是她復出後首場演唱，北市釋出5400 張票券，分成兩階段搶票，第一階段有5000 張，將在9 月30 日中午12 時網路上開搶 ;
    第二階段則另發放400 張敬老票券【65 歲以上市民】，於10 月1 日舉辦抽選。然而台北大巨蛋正式首場個人演唱會，則為周杰倫「嘉年華」世界巡迴演唱搶得頭香，將於10
    月23 日中午12 時拓元售票系統開賣。

    周杰倫「嘉年華」世界巡迴演唱會即將於今年12 月5 日～8 日在台北大巨蛋一連開唱4 天，進階版的設計，準備顛覆歌迷的想像。「嘉年華」演唱會的製作成本最初就高達台幣2
    億元，在預算不斷追加的情形下，已刷新周杰倫演唱會成本的紀錄。作為第一位登上台北大巨蛋舉辦專場個人演唱會的歌手，周杰倫與演出團隊將呈獻精彩內容給歌迷朋友。演唱會上酷炫的視覺效果是最新科技與美學相乘的呈現，舞台將是其「嘉年華」巡演以來規模最大的一次，並增加了更多舞者和道具。演唱會的票價也已揭曉，分別是6880、5880、4880、3880、3280、2280
    、1880 元，提供多種選擇供歌迷購買。身為杰倫頭號粉絲的婕箖老師搶到5880 的票，欣喜若狂之餘趕緊取消演唱會當天的家教工作，直說就算損失2000元的家教費也是值得的選擇。'
