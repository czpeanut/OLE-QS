  section: 1
  number: 29
  type: single
  page: 5
  stem: 請問美國俄亥俄州法官Michael Cicconetti會有這樣的判決，可能是受到上古時期哪個民族法律觀點的影響？
  options:
  - label: A
    content: 希臘
  - label: B
    content: 波斯
  - label: C
    content: 巴比倫
  - label: D
    content: 羅馬。
  group_stem: "◎美國法官「以眼還眼」，讓罪犯得到相對應的教訓！\n    有少女在暴風雪中，惡意將一窩幼貓丟到樹林，法官就判她也在暴風雪日子去森林過一夜，而且不能蓋毛毯；有人跑到餐廳對店員噴胡椒噴霧，法官就在庭上，讓他也嚐嚐被噴胡椒噴霧的滋味，以其人之道、還治其人之身。一位男子在交通糾紛中辱罵警察是「豬」，於是他被罰和一隻\
    \ 350 磅的豬站在街角，手裡舉著牌子寫著：「這不是警察」。另外有人坐霸王車不付錢，法官判他坐的路程有多長，就得徒步走回來，被告得在48小時內徒步走完30英哩路，全程都有衛星系統監視。\n\
    \    俄亥俄州法官Michael Cicconetti以判決「罪罰相稱」聞名，同時提出入獄的創意替代方案。他說：「我想每個人都樂見以眼還眼。」儘管這樣的判決裁量非正統，但比起傳統，卻讓被告真正得以懲罰，受害者更樂見接受。\
    \                                   摘錄自2020/02/13 Line Today"
