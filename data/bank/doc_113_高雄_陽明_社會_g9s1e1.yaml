- id: doc_113_高雄_陽明_社會_g9s1e1_s1_45
  section: 1
  number: 45
  type: single
  page: 8
  stem: 根據文中第一段內容判斷，相較於電動機車，部分民眾喜愛使用電動自行車的原因，最可能為下列何者？
  options:
  - label: A
    content: 該產品的市場競爭程度日漸提升
  - label: B
    content: 選擇使用該項產品的機會成本較低
  - label: C
    content: 受政府管制影響，產品販售價格提高
  - label: D
    content: 負向誘因增加，民眾使用產品意願提高。
  group_stem: '閱讀下列選文，回答第12 至14 題：

    過去《道路交通管理處罰條例》中的「電動自行車」，僅以電力驅動行駛，因與電動機車的使用差異不大，且不須懸掛車牌、不須駕照、駕駛者無年齡限制、價格較低廉，部分民眾喜愛以它作為代步工具，卻也衍生諸多問題。

    2022 年4 月時，政府修正《道路交通管理處罰條例》，將「電動自行車」更名為「微型電動二輪車」，加入應領用並懸掛車牌進行管理、投保強制汽車責任保險、年滿14
    歲才能駕駛等規定，違規者將遭主管機關開罰，並於5 月4 日由總統公布。此外，若在修正規定施行前就已持有微型電動二輪車的車主，須在施行後的二年內領用並懸掛車牌，逾期亦將處罰鍰。'
