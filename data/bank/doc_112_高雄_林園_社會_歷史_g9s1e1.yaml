  stem: (     ) 「柯因奈語」(Koine)，又稱「通用希臘」，是大約發源於西元前四世紀的國際性語言。此一語言於某帝國在政治上統一了愛琴海地區各希臘城邦，融合了該地區多種方言發展而成；其後又伴隨帝國對外武力征服，向埃及、西亞等地區擴散傳播，對於往後數百年間科學、文學和宗教的發展影響深遠。上述的「某帝國」，最可能為下列何者？
  options:
  - label: A
    content: 波斯帝國
  - label: B
    content: 拜占庭帝國
  - label: C
    content: 亞歷山大帝國
  - label: D
    content: 羅馬帝國
  answer:
  - C
  answer_source: answer_key_vlm
