  stem: (     ) 漢摩拉比最讓世人熟知的事跡是他頒布了一部新的巴比倫法律《漢摩拉比法典》。法典刻在一塊巨大的玄武岩石碑上，並放置於公共場所以便所有人能看見，儘管那時可能很少有人識字。石碑後來被埃蘭人所奪，並被運回埃蘭首都蘇薩。1901
    年石碑再次被考古人員發現，現藏於法國巴黎羅浮宮博物館。它採用「同態復仇法」即「以眼還眼，以牙還牙」（第196 和200 條）的方式來解決上層自由民之間的糾紛，造成許多傷殘甚至死亡，以今天的標準看來過於殘酷。儘管如此，該法典在歷史上仍然有著廣泛而深遠的影響，之後的歷代帝王仍不時提到它，以它作為榜樣。請問：上述的漢摩拉比法典，可能源自於下列哪一個文明？
  options:
  - label: A
    content: 中國
  - label: B
    content: 西亞
  - label: C
    content: 印度
  - label: D
    content: 埃及
  answer:
  - B
  answer_source: answer_key_vlm
