  group_stem: '義大利南部那不勒斯灣東海岸的維蘇威火山在西元79 年噴發，這場噴發將龐貝城埋在火山灰中，使這座城市及其居民被時間永遠凍結，成為考古學家的豐富研究資源。近期又發現2
    具完整的男子遺體，龐貝城考古公園（ArchaeologicalPark of Pompeii）的官員說明，其中一人生前可能是身分地位高貴者，而在旁的另一人則可能是他的奴隸。

    考古學家在一個壁畫上發現類似披薩的食物圖畫，上面還放了石榴、椰棗等配料，考古學家認為這有可能是披薩的祖先，而且龐貝城距離披薩的發源地拿坡里只有約20 公里，因此飲食習慣相互影響也不無可能。考古學家推測，這應該是用來招待賓客的禮物，過去也曾在其他房屋遺跡找到類似的食物壁畫，但外觀類似披薩的圓餅麵包倒是相當罕見。至於壁畫中在圓餅上放水果的作法，義大利知名主廚索比洛表示，如果要做甜披薩上面可以放無花果或草莓，但被英國媒體問到可不可以放鳳梨，主廚態度非常堅決地說：「不行！品味就是品味！我們製作傳統的披薩，絕不會使用鳳梨。」強調傳統披薩上絕對沒有鳳梨，要捍衛義大利人對美食品味的堅持。'
  answer:
  - B
  answer_source: answer_key_vlm
