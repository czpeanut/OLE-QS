  group_stem: '馬拉松是希臘的一個城鎮，也是西元前490 年馬拉松戰役的地點，在此戰役中，雅典軍隊以寡敵眾擊敗了波斯人。相傳希臘士兵費迪皮德斯(Pheidippides)被派從馬拉松一路攜著勝利的消息奔向雅典宣布戰報，但這位士兵卻在報完戰果後因過度疲勞而死亡，而馬拉松賽事正是為了紀念這歷史性的長跑。

    1896 年在希臘舉行的首屆奧林匹克運動會中馬拉松已被已列為正式競賽項目之一，但長度並沒有精確丈量固定，前幾屆奧運會的馬拉松比賽長度大約是40 公里（25
    英里），大致是從馬拉松到雅典的距離。

    首屆的奧林匹克運動會，而希臘又是主辦國，因此取得首屆馬拉松賽的冠軍更是能為希臘人帶來榮耀，首屆馬拉松賽僅25 人參加，比賽結果只有9 人完賽，有8 位是希臘人，其中冠軍正是由希臘人斯皮里宗·路易斯(Spyros
    Louis)以2 小時58 分50秒贏得，此戰果轟動全希臘，馬拉松賽事也正式成為奧林匹克運動會最後一個項目的傳統。'
  answer:
  - B
  answer_source: answer_key_vlm
