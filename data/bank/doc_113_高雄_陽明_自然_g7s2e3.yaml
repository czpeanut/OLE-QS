  - label: A
    content: 人類所擁有的科技能力，都對生態環境有害無益
  - label: B
    content: 人類大量燃燒煤、石油等燃料的行為，會造成全球暖化
  - label: C
    content: 人類破壞生態環境的行為不會影響其他生物和人類自己的生存
  - label: D
    content: 臺灣製造的汙染只對臺灣產生影響，不會影響到其他國家。
