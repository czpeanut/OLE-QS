  section: 1
  number: 20
  type: single
  page: 2
  stem: 生物之所以會產生多樣性的可能原因包含下列哪些條件？甲.有性生殖造成生物個體性狀特徵的多樣性；乙.基因突變與天擇共同作用下，產生新物種；丙.棲地環境有不同的組成因子。
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 僅甲乙
  - label: C
    content: 僅乙丙
  - label: D
    content: 僅甲丙。
