  section: 1
  number: 22
  type: single
  page: 2
  stem: 生物多樣性形成的原因可能為何？
  options:
  - label: A
    content: 引入外來物種所造成
  - label: B
    content: 遺傳物質的組合與各種生活環境長期交互作用的結果
  - label: C
    content: 生物保護區的設立
  - label: D
    content: 生態系失去平衡的結果。
