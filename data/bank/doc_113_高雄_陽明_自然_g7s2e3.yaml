  section: 1
  number: 21
  type: single
  page: 2
  stem: 有關生物多樣性的觀念，下列何者不適當？
  options:
  - label: A
    content: 任何生物都有其存在的價值
  - label: B
    content: 應多引入各地區不同物種以增加當地生態系中的生物多樣性
  - label: C
    content: 生物多樣性有利於自然界中物質的循環與能量的流動
  - label: D
    content: 生物多樣性越高，生態系的平衡越不易被破壞。
