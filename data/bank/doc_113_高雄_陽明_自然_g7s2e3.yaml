- id: doc_113_高雄_陽明_自然_g7s2e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 生物間會存在著各種不同的交互關係，則下列敘述何者正確？
  options:
  - label: A
    content: 不同種生物間只會有掠食或競爭關係
  - label: B
    content: 寄生是對一方有利、對另一方無害的交互關係
  - label: C
    content: 在農業方面常利用生物間的交互關係來防治病蟲害
  - label: D
    content: 當生物間須爭取相同的資源時，便會產生共生關係。
