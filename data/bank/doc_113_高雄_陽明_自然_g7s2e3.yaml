  section: 1
  number: 23
  type: single
  page: 2
  stem: 地球的永續發展是很重要的，試問下列何種情況中，較容易維持生態的平衡？
  options:
  - label: A
    content: 生態系中，族群的種類少，但其個體數較多
  - label: B
    content: 生態系中，生物種類豐富，環境、氣候都沒有太大的改變
  - label: C
    content: 各種生態系由人類加以開發管理
  - label: D
    content: 多引入外來生物，增加生物多樣性。
