    content: 海洋中的含氧量，跟浮游藻類有直接相關
  - label: B
    content: 捕食者與被捕食者的關係連起來稱作食物鏈
  - label: C
    content: 攝食浮游動物的動物，可稱為次級消費者
  - label: D
    content: 海洋所有區域的生態系，生產者皆為藻類。
  group_stem: "3. 在海洋生物群落中，從細菌或藻類開始，經草食動物至各級肉食動物，依次形成捕食者與被捕食者的營養關係稱為食物鏈。食物鏈的結構有些像金字塔：第一級是由數量驚人的海洋浮游藻類構成的，是食物鏈金字塔的最基礎部分，透過光合作用生產出碳水化合物和氧氣，是海洋生物生長的物質基礎；食物鏈的第二級是海洋浮游動物，他們以海洋浮游藻類為食；第三級是攝食浮游動物的海洋動物；第四級則是海洋中的食肉類動物，例如：金槍魚和鯊魚等，他們處在金字塔的最高層。\n\
    \  食物鏈每升高一個層次，有機物質和能量就有很大的損失。食物鏈的層次越多，總體效率就越低。因此，處於食物鏈層次越高的動物，其相對數量越少；相反地，處於食物鏈層次越低的動物，其相對數量越多。這就構成了生物量和能量的金字塔。生態學中有所謂的1/10\
    \ 定律，也就是食物鏈每傳一層能量就會散失9/10，聽起來很可怕；其中一個原因是因為吃下去的食物，並無法完完全全地被轉換成可利用的能量，但最大宗被損失掉的原因是變成散亂的熱能。"
