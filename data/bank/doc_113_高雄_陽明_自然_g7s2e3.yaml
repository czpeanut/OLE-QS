  section: 1
  number: 19
  type: single
  page: 2
  stem: 報載乳製品遭戴奧辛汙染的事件，引起民眾恐慌，已知露天燃燒廢電纜會產生含戴奧辛的氣體，且戴奧辛可溶於脂質中，下列敘述何者正確？
  options:
  - label: A
    content: 戴奧辛只會累積在草食性動物體內
  - label: B
    content: 露天燃燒廢電纜產生的戴奧辛，對當地造成危害，對其他地區則無影響
  - label: C
    content: 戴奧辛的汙染只存於乳製品中
  - label: D
    content: 戴奧辛會隨食物鏈轉移累積至高階層的消費者體內。
