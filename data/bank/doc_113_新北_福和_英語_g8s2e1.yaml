- id: doc_113_新北_福和_英語_g8s2e1_s7_53
  section: 7
  number: 53
  type: single
  page: 6
  stem: What is the main idea of the diary?
  options:
  - label: A
    content: Friends make school life better.
  - label: B
    content: Bullying hurts, but we can ask for help.
  - label: C
    content: Being new at school is difficult.
  - label: D
    content: Teachers should always hit bullies.
  group_stem: 'Dear Diary,

    School was really hard today. There is a boy named Jake. He usually makes others
    feel bad. I saw him do it to Sarah and Michael. Sarah enjoys drawing and Michael
    loves reading books. Jake said mean things about Sarah''s pictures and bullied
    Michael in front of the classroom, laughing with his friends. It''s not just at
    school, sometimes, I hear about mean words from him online.

    Sarah used to love art class before, but now she doesn''t want to go. She doesn’t
    even touch her pencil anymore. And Michael can''t read his stories happily because
    he''s always worried. I can see how sad they feel.

    The strange thing is, Jake isn''t always mean. Sometimes, he is nice, but then
    he turns around and spreads rumors or laughs at people when they aren''t looking.
    I wonder if he has any trouble of his own, something that makes him act this way.
    Maybe he doesn''t even know how much he''s hurting others.

    But today, something different happened. Sarah, with tears in her eyes, finally
    told Ms. Evans what was going on. Michael saw how brave she was and decided to
    talk to Ms. Evans, too. Ms. Evans listened carefully and promised to help. Ms.
    Evans told them that they weren''t alone, and they will be safe at school.

    I think things might get better. Maybe Jake will finally understand how much he
    hurts people. Maybe Sarah and Michael will feel free again – free to draw, free
    to read, free to be themselves. I really hope so.

    For the first time in a long time, it feels like the bad things from bullying
    are starting to go away. And in their place, there''s something better: kindness,
    understanding, and hope.


     used to 以前 bully 霸凌 spread rumor 散播謠言 tear 眼淚 promise 承諾 alone 單獨的'
