    1. Safety First: Always stay with your group and follow the instructions of your
    camp leaders.

    2. Campfire Safety: Keep fires small and under control. Make sure it is completely
    out before sleeping or leaving.

    3. Keep the Science Park Clean: Let’s protect nature by leaving no trash.

    4. Food: Store food in sealed containers, so the animals won’t find it.

    5. Water: Drink enough water and keep yourself healthy during activities.

    6. First Aid: Bring First Aid Kit with you. You can use it for small cuts or insects’
    bites during activities.


