- id: doc_113_高雄_龍華_國文_g8s1e2_s4_34
  section: 4
  number: 34
  type: single
  page: 6
  stem: 依據文意，以下成語或佳句所搭配的文意何者不恰當？
  options:
  - label: A
    content: 吳寶春去台北當學徒的第一天，遇到了一個很大很大的挫折，原因是因為他「目不識丁」
  - label: B
    content: 吳寶春認為優秀的麵包師傅，不應只做一隻「井底之蛙」，一定要想辦法跨出原有的領域
  - label: C
    content: 吳寶春認為「書中自有黃金屋」，他認為看書時的重點應該是要努力複製人家成功的經驗
  - label: D
    content: 當兵時，官建良教吳寶春注音符號和查字典，當時他一個禮拜有五天幾乎都「手不釋卷」
  group_stem: "吳寶春2010 年參加在巴黎舉行的首屆世界盃麵包大師賽，獲得歐式麵包組世界冠軍，以下為他的專訪：\n    國中畢業的時候，我認得的字不到五百個，也不會注音符號。那時候我不想要讓媽媽那麼辛苦，所以就到台北當學徒。可是，去台北當學徒的第一天，就發現我不認識字，這是一個很大很大的挫折。第一天上班，師傅叫我秤一百兩砂糖。我不知道一斤是十六兩，不會秤，就一格一格算，算到一半亂掉又重新算。那時師傅很兇、我做麵包常常燙傷手、我們住的地方就是工廠隔壁，睡覺時候都會有蟑螂、老鼠從身上爬過去。我告訴自己，不要再哭了，也不要再掉眼淚了，為了媽媽要勇敢、堅強。\n\
    \    到台北之前，我以為當個麵包師傅就成功了；可是後來發現，如果我不讀書、不認識字是不可能成功的。\n後來我去當兵，遇到一個大專兵叫官建良。他是啟發我的人，是他讓我看到不一樣的世界。官先生年紀比我大，但是因為大學重考兩次，晚我幾年當兵，算是我當兵時的學弟。感覺他比較老成、觀念較新。他帶我去參與他的大學生活，我才發現原來大學生的生活這麼好玩！\n\
    \    他念中山大學海洋系，他帶我去實驗室、圖書館，帶我去他戀愛散步的地方，也帶我去認識他的同學。那時候他還有一個同學很厲害，修兩個學位。我跟他們接觸之後，慢慢在他們身上看到我的希望，那種希望就是：「我好希望跟他們一樣！」因為有知識而讓他們有很多的創造力。比如，他在研究很多還沒有人發現的生物，當他發現這些生物，他就會幫這些生物取名「建良一號」、「建良二號」……我就覺得，哇！他們怎麼可以這樣子。我就想，以後做麵包也可以把麵包取做「寶春一號」、「寶春二號」……但是要能這樣子，必須有獨特性，必須有知識、有方法。也因為如此，開啟了我學習的欲望。那時候的感覺就像腦袋被封住了二十年，現在有人把這層膜輕輕的撥開了。\n\
    \    在海軍當兵很輕鬆，白天就是保養船，敲鐵鏽。保養完了，晚上就沒事了。我看到官建良都在看書，就跑去找他聊天，去翻他的書。帶著很好奇、很想學的欲望看他。他看出來，就跟我說：「阿春啊，你認識的字不多，你不想識字嗎？」我就說：「我好想識字，可是沒人教我，我也不知道怎麼辦？」那時候翻他的書，其實是看不太懂的。一方面覺得很難過，一方面也很好奇，他看這些書可以做什麼？他就跟我說：「如果你想看懂，我可以教你。」記得他教我的第一本書是本簡單的小說，內容我已經忘了。我就是自己看，不懂就問他。一開始看兩三個字就不懂，慢慢愈來愈不用問他。後來他也教我注音符號，教我查字典。當我自己會查字典的時候，很多成語就懂了。我們幾乎一個星期有五天都在讀書。我讀書的時候是快樂的。我發現讀了書以後，自己的想法跟以前不一樣了！\n\
    \    退伍之後，我看了一本書，是許文龍的《觀念》，內容寫到他以前也是很貧困，到最後成就了奇美王國。看這本書的時候，很多麵包師傅跟我說：「看這個，沒路用……那是他的成功模式，你也學不起來。」但這不是我看的重點；我看到的是，當他遇到問題的時候如何去面對、如何解決、如何思考、決策。決策之後、成敗之後，心態是什麼。我那時候就給自己設定一個目標，未來我要跟他一樣，成為一個企業家。\n\
    \    麵包師傅以前是很保守、很封閉的。當兵前，我沒有麵包師傅以外的朋友。相對的，麵包師傅的圈子小，想法就跟著狹隘。所以每個行業都一樣，一定要想辦法跨出那領域，多認識一些人。我退伍的時候就告訴自己，不要只是個麵包師傅，這句話的意思倒不是因為麵包師傅不好，而是我覺得，要做優秀的麵包師傅，我應該有更多的學習，不是只有學習麵包而已。\
    \                 （作者：許芳菊 採訪整理 《親子天下第31 期》）"
