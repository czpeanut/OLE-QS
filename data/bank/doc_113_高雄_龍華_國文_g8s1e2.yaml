  group_stem: "世有伯樂，然後有千里馬。千里馬常有，而伯樂不常有。故雖有名馬，只辱於奴隸人之手，駢①死於槽櫪②之間，不以千里稱也。\n  馬之千里者，一食或盡粟一石。食馬者，不知其能千里而食也。是馬也，雖有千里之能，食不飽，力不足，才美不外見，且欲與常馬等，不可得，安求其能千里也？\n\
    \  策之不以其道，食之不能盡其材，鳴之而不能通其意，執策③而臨之，曰：「天下無馬。」嗚呼！其真無馬耶？其真不知馬也！\n（韓愈〈馬說〉）\n註：①「駢」死：齊、併。\n\
    \  ②槽櫪：養馬的地方。\n  ③執「策」而臨之：馬鞭。"
