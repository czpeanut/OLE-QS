  stem: '加州 聖瑪利諾市（San Marino）的知名景點漢庭頓圖書館（The Huntington Library），五彩蓮花同池盛開，吸引不少人駐足觀看。許多人將荷花、蓮花混為一談，但事實上，現代人講的蓮花一般是指睡蓮。荷花的花朵比較大，是挺水植物，花與葉會長出長柄，睡蓮的花朵較小，葉片偏圓並有Ｖ形裂縫緊貼在水面上。此外，睡蓮花朵小，顏色較多且鮮豔；荷花花形較大且飽滿，花色多為白色、粉紅色，而漢庭頓圖書館池塘中盛開的正是睡蓮。

