- id: doc_113_高雄_龍華_國文_g8s1e2_s3_26
  section: 3
  number: 26
  type: single
  page: 4
  stem: '「『拖延、延宕、拖延症』（英語：Procrastination）是指一種自願推遲某事的行為，儘管知道這樣做會帶來負面後果。通常這是一種習慣性的人類行為，常見的經驗包含拖延日常雜事，甚至推遲重要的任務，如參加約會、提交工作報告或學術任務，或與合作夥伴討論壓力大的問題等。其實每個人都有拖延症，只是程度不一樣。拖延症不是簡單的時間管理或品格問題，更不是單純的懶惰，事實上，拖延症背後有複雜的心理因素，而心理與外在行為是相扣的，通常涉及一系列相關的想法、情緒以及行為模式。」根據以上描述及下方圖表，關於「拖延症」的說明下列何者最正確？

    | 外在行動 | 心理原因 |

    | --- | --- |

    | 為自己找藉口 | 想避開不舒服的感覺 |

    | 工作延遲與期限壓力 | 無法認清任務的困難度 |

    | 衝動與分心行為 | 情緒不穩、心情不好 |

    | 工作品質低效 | 總在計畫，沒有行動力 |'
  options:
  - label: A
    content: 工作品質較低的人，多來自於其內心無法認清工作困難度
  - label: B
