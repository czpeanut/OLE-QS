- id: doc_113_高雄_龍華_國文_g8s1e2_s3_10
  section: 3
  number: 10
  type: single
  page: 2
  stem: '月眉山每到三四月，就在草叢中開出許多壯碩清麗芬芳沁人的野百合，據我所知，十年前就有花蓮的年輕人成群結隊到鹽寮郊遊，大把大把採去，漸漸的，野百合終於少了。今年，雨停之後，鹽寮的大人小孩開始大量採取，孩子們採野百合，並不一定是為了自己喜歡，而是為了拿到花蓮去賣。而今，山道上到處是摧殘的花梗與花朵，凡能見到的能採到的，都會被採光，只有山溝懸崖頂上的得免於難。鹽寮的大人們是好大人，鹽寮的孩子們是好孩子，沒有人能說去採一捧野百合是不對的，但問題是在這自然的豐碩中，常有叫人心痛的擔憂：鹽寮這自然的恩賜能任我們揮霍到幾時？這樣的殺雞取卵的採擷，豈不是在野百合還來不及孕育下一代時，就已被拔除了嗎？今年所採的地方，明年還會再有嗎？我相信鹽寮的百合還可以讓人再採幾年，但幾年以後呢？鹽寮還有百合嗎？臺灣還有一個「遍山野百合」的鹽寮嗎？
    （孟東籬）

    依據本文內容，作者的期待為何？'
