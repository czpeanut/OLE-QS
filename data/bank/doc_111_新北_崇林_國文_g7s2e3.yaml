- id: doc_111_新北_崇林_國文_g7s2e3_s2_45
  section: 2
  number: 45
  type: single
  page: 5
  stem: 根據上文，下列敘述何者正確？
  options:
  - label: A
    content: 德國人連尋常的住宅都蓋得張牙舞爪，美得令人羨慕又忌妒
  - label: B
    content: 德國的林相與住宅相似，都能保持互相尊重的距離
  - label: C
    content: 作者由卡夫卡的詩句聯想到人生經常要面臨抉擇
  - label: D
    content: 「鼻間卻重重吸入一股很好聞的，浸滿時間的味道」，意指想在這兒待很久
  group_stem: "（三）\n若不算臨終前健康狀況極差的那三個月，卡夫卡人生中最後、也最快樂的時光，可說是在柏林度過的。一九二三年九月，他違抗父母，搬到柏林與小女友朵拉同居。他對這裡滿意極了，本來飽受失眠之苦，在此總算可以安穩入睡。\n\
    \  柏林確實是個能鼓舞創作的地方，在我來到柏林文學學會開始駐村後，很快就感受到這點。學會位於萬湖，離卡夫卡當年在柏林的幾個住處不遠，房舍是一棟擁有百年歷史宛如中世紀宮廷的建築，有漂亮的塔樓和典雅的拱廊。樓梯是木造的，走起來嘰嘎作響，逐階而上之時腳步必須放輕，鼻間卻重重吸入一股很好聞的，浸滿時間的味道。\n\
    \  我抵達萬湖的時間是三月中，正是德國春天開始的時候。春日氣候變化不定，時而細雨霏霏，時而陽光普照，一天之內溫差可達十五度以上。寒冷又下雨的日子最適合創作，因為哪都去不了，只能關在房裡埋首錘鍊字句。然而一旦氣溫回升，一早被窗外灰色烏鴉喚醒，發現一屋子都是陽光時，那就很難按捺往心中騷動，想去戶外走走了。\n\
    \  我在背包裡放了一塊三明治，一瓶黑啤酒，以及滿滿一袋德國的春天，開始我的柏林 萬湖環島單車之旅。\n  我順時針環島，一開始得先爬坡進入一個住宅區。坡不陡，車也不算難騎，可是我卻騎得咬牙切齒，邊踩邊在嘴裡喃喃唸著：「太過分！太過分了！」看起來只是德國人的尋常住宅區，卻美到讓人由嫉妒生出憤恨的程度。這些房舍或兩層或三層，每幢造型都不一樣，不見鐵皮、鐵窗、磁磚或塑膠屋瓦等臺灣常見建材，也沒人把房子蓋得張牙舞爪，畢露土豪爆發戶性格。\n\
    \  離開住宅區，我騎過一座短橋，進入了森林。春日剛至，樹木在冬天落盡的樹葉尚未補回，林間仍是一片蕭瑟。\n  德國的林相與亞熱帶的臺灣截然不同，臺灣植物生得茂密，走進森林得拿開山刀才能劈出一條通路。這裡的森林稀疏許多，樹木分得開開的，和我剛才經過的住宅區一樣，彼此之間保留著互相尊重的距離。然而，它們又直挺挺的拚命向上生長，一株長得比一株高。我猜這是在日照有限下，為爭奪陽光而造成的，這讓我想起在萊比錫市政廣場見到的有趣現象：陽光照耀下的露天咖啡座高朋滿座，被建築物陰影蓋住的露天座則空無一人。\n\
    \  森林杳無人煙，就在我來到一個岔路口停下，又拿出手機準備查看地圖時，突然發覺眼前的景象似曾相識——這不正是佛洛斯特詩中描述的情境？\n  「兩條小徑分岔在鋪滿金黄落葉的樹林中，可惜我只能選其中一條走。」人生實難，因為大部分時間都得面對選擇。優柔寡斷太浪費時間，魯莽躁進又容易身陷危險。佛洛斯特在一九二○年寫下這首詩後的第三年，卡夫卡挑選了柏林，那是任性快意的決定，但隔年他在離開前燒掉自己大部分的手稿，應是在無路可走之下的絕望選擇吧？\n\
    \  在柏林春天的森林騎行，兩側坡地蓋滿厚厚一層已變白的落葉和松樹的毬果，偶爾視線從林間穿越，可見到湖面的帆船和不時飛起降落的水鳥。面前的兩條小徑，或許其中一條會帶我深入森林的靜謐，另一條將引我至湖畔的開闊。比起前人做過的選擇，在此徘徊不前顯然是可笑的事。\n\
    \  我關掉手機，選擇其中一條路繼續往前騎，同時心中也做了一個決定。\n  我一定還要再回來。（何致和 柏林春天的森林騎行）"
  tags:
    textbook: 第二冊（七下）第3次段考範圍
