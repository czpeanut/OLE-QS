  stem: 「在小時候，每當冬夜，我們一大家人圍著個大圓桌吃飯。我總是坐在祖母身旁，祖母總是摸著我的頭說：『老天爺賞我們家飽飯吃，記住，飯碗裡一粒米都不許剩，要是糟蹋糧食，老天爺就不給咱們飯了。』剛上小學的我，正在念打倒偶像及破除迷信等為內容的課文，我的學校就是從前的關帝廟，我的書桌就是供桌，我曾給周倉畫上眼鏡，給關平戴上鬍子……。」根據這段文字，請判斷下列敘述何者有誤？
  options:
  - label: A
    content: 作者當時覺得祖母的話既多餘又落伍
  - label: B
    content: 祖母的話反映作者幼時奢侈浪費的習慣
  - label: C
    content: 作者不認同祖母的話，且持續了很多年
  - label: D
    content: 祖母在吃飯時進行機會教育，盼望作者能夠惜物，不要暴殄天物
  lesson_raw:
    title: 謝天
    basis: 引用課文《謝天》內容
  tags:
    textbook: 第二冊 謝天
    labeled_by: ai
