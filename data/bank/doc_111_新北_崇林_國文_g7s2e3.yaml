- id: doc_111_新北_崇林_國文_g7s2e3_s2_47
  section: 2
  number: 47
  type: single
  page: 6
  stem: 晨蟬的聲音，給人什麼感受？
  options:
  - label: A
    content: 高亢激昂
  - label: B
    content: 輕逸空靈
  - label: C
    content: 嘈雜擾人
  - label: D
    content: 呢喃婉轉
  group_stem: '（四）

    晨間聽蟬，想其高潔。蟬該是有翅族中的隱士吧！高據樹梢，餐風飲露，不食人間煙火。那蟬聲在晨光朦朧之中分外輕逸，似遠似近，又似有似無。

    一段蟬唱之後，自己的心靈也跟著透明澄淨起來，有一種「何處惹塵埃」的了悟。蟬亦是禪。

    午後也有蟬，但喧囂了點。像一群吟遊詩人，不期然地相遇在樹蔭下，閒散地歇牠們的腳。拉拉雜雜地，牠們談天探詢、問候季節，倒沒有人想作詩，於是聲浪陣陣，缺乏韻律也沒有押韻。他們也交換流浪的方向，但並不熱心，因為「流浪」，其實並沒有方向。（簡媜
    夏之絕句）'
  tags:
    textbook: 第二冊（七下）第3次段考範圍
    labeled_by: ai
