  section: 2
  number: 49
  type: single
  page: 6
  stem: 學者告訴中年人應該「抓緊現在和未來的日子」，理由何在？
  options:
  - label: A
    content: 唯有把握當下，妥善計畫並一步步實踐，才有達成目標的可能
  - label: B
    content: 因為過去的種種成就已成為歷史，不值得緬懷留戀
  - label: C
    content: 學者年事已高，認為自己所剩時日不多，心生感慨
  - label: D
    content: 學者厭倦了日復一日的工作，想馬上改變人生，過嶄新的生活
  group_stem: "（五）\n在美國的一個小鎮上，一位中年人拜訪了一位八十四歲的學者。在學者那狹窄的廚房裡，中年人傾訴了內心的困惑。\n  學者說：「你應該抓緊現在和未來的日子。」\n\
    \  中年人說：「是的，我在努力，但是，我已經浪費了幾十年。」\n  學者搖搖頭：「達爾文說他貪睡，把時間浪費了，卻寫了物競天擇論；奧本海默說他鋤草，把時間浪費了，後來成為『原子彈之父』；海明威說他打獵、釣魚，把時間浪費了，最終獲得諾貝爾獎；瑪麗．居禮說她為孩子和家務，浪費了時間，然而她不但發現了鐳，而且把孩子培養成了科學家。」\n\
    \  中年人大喊：「這些人都是天才！我只是個平凡人，愚蠢的平凡人！」\n  「你有權評定你自己是愚蠢的平凡人。但是我說只要有確定的目標，在任何時候做任何事情，都不會妨礙思考和研究，甚至有助於思考和研究。他們以為浪費了時間，實際上並沒有浪費。」\n\
    \  「但是，我年紀大了。」\n  「我七十歲那年，擬出一個需要十年才能完成的研究計畫。當時我向一位三十多歲的年輕朋友談到這個計畫，他笑了笑。我知道他為什麼笑。在他看來，七十多歲的老人，時日已不多，還能做些什麼呢？十年過去了，我的工作如期完成，現在我仍能在實驗室裡忙著。」學者挺了挺胸，笑了。\n\
    \  「你那位年輕的朋友呢？」中年人問。\n  「依舊熙熙攘攘，庸庸碌碌的生活。十年一眨眼就過去了。」（關於信念和堅持的故事）"
  tags:
    textbook: 第二冊（七下）第3次段考範圍
    labeled_by: ai
