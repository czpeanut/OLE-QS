- id: doc_111_高雄_林園_社會_歷史_g8s2e1_s1_28
  section: 1
  number: 28
  type: single
  page: 2
  stem: 1919 年巴黎和會中，日本最有可能提出下列何種論點說服英法，認同日本擁有山東的主權？
  options:
  - label: A
    content: 中國早已簽認二十一條要求，承認日本擁有山東權利
  - label: B
    content: 日俄戰爭後，俄國轉讓山東主權，日本勢力正式進入
  - label: C
    content: 中國未參加第一次世界大戰，無權要求收回山東權利
  - label: D
    content: 馬關條約時早已割讓，後來受列強逼迫而讓中國贖回
  group_stem: '※請根據下文，回答28~30 題：

    中國作為戰勝國之一受邀參加巴黎和會，政府派出了以陸征祥、顧維鈞等人為首的外交使團赴法參加巴黎和會，他們希望能為中國收回山東的權益，但英法卻主張將山東權利轉給日本。1919
    年6 月28 日，巴黎和會的最後一天，也是全體戰勝國在和約上簽字的一天，但作為戰勝國的中國代表沒有出席會議，拒絕簽字，山東問題成為懸案。在之後召開的華盛頓會議上討論了山東問題，中國代表強烈要求收回山東主權和廢除「二十一條」，在美英斡旋下，中日兩國於1922
    年2 月4 日在會外簽訂了《解決山東懸案的條約》及其附約，成功收回山東權益。'
  answer:
  - A
  answer_source: answer_key_vlm
