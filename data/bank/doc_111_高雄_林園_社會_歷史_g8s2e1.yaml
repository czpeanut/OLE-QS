  stem: 民國初年的軍閥形成地方割據勢力，對當時政局發展造成莫大的影響。請問：下列關於軍閥的敘述，何者正確？
  options:
  - label: A
    content: 袁世凱去世後，逐漸演變成軍閥割據的局面
  - label: B
    content: 陳獨秀在上海成立中國共產黨，造成南北分裂
  - label: C
