  stem: 國國上完歷史課後，試圖歸納出中華民國成功建國的主要因素，請問下列何者最為正確？
  options:
  - label: A
    content: 因鐵路中斷，導致外援無法進入武昌
  - label: B
    content: 革命軍獲得蘇聯支持，開始聯俄容共
  - label: C
    content: 南部各省相宣告獨立，脫離清廷統治
