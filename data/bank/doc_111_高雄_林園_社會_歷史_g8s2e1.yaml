  stem: 一篇文章中提到：「他是民國初年組建國民黨的實際負責人，因國民黨在首屆國會選舉中獲得絕對多數，當他從上海赴北京準備依法組織責任內閣時，在上海火車站遭槍手暗殺。」文中被暗殺的應該是下列何人？【習作】
