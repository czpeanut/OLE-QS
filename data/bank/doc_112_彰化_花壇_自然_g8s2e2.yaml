  stem: '在 25 ℃下，某固定體積之密閉系統中的化學反應已達成平衡，其反應式如下所示：

    $2\mathrm{NO}_{2(g)} \rightleftharpoons \mathrm{N}_{2}\mathrm{O}_{4(g)} + \text{熱量}$

