- id: doc_113_高雄_獅甲_社會_公民_g8s2e3_s1_45
  section: 1
  number: 45
  type: single
  page: 2
  stem: 某攤販因違規擺攤，多次遭到附近攤商檢舉，兩年來被警方開了上千張罰單。該攤販認為，土地是他所有，擺攤沒有問題，因此拒絕繳納罰款。警方表示，由於工務局認定此私人土地是「類似騎樓」的用地，屬公眾可以通行的場所而不得設攤，因此警方依法取締。該攤販若對於此私人土地是否可以擺攤的認定有疑義，他應該如何救濟？
  options:
  - label: A
    content: 提出請願；請願未過則尋求司法救濟
  - label: B
    content: 提出訴願；不服訴願決定，提起行政訴訟
  - label: C
    content: 提出調解；調解不成，再提訴訟處理
  - label: D
    content: 提出行政訴訟；訴訟判決不利則改採訴願
