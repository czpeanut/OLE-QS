- id: doc_113_高雄_獅甲_社會_公民_g8s2e3_s1_49
  section: 1
  number: 49
  type: single
  page: 2
  stem: 下列是少年事件處理程序中某相關工作者的分享：「我的工作是與受處分的少年保持接觸，針對他們的生活及交友狀況，提供輔導、監督和協助。我曾協助幾個濫用毒品、喜歡在外遊蕩的孩子投入職業訓綀，讓他們找到生活重心，努力工作，還存了一筆錢；最後因表現良好，爭取到法官的認同。透過把孩子留在社區及家庭中，為他們設定行為界線，協助正常生活、就學或就業，引導他們思考如何在一定範圍內找到適合白己的道路，就是我工作的價值。」根據上述內容推論，下列何者為其工作內容？
  options:
  - label: A
    content: 塗銷少年刑事紀錄，避免受到標籤化
  - label: B
    content: 協助曝險少年，以監禁代替保護措施
  - label: C
