- id: doc_113_高雄_獅甲_社會_公民_g8s2e3_s1_47
  section: 1
  number: 47
  type: single
  page: 2
  stem: 我國改名的規定是依據《姓名條例》，如字義粗俗不雅、音譯過長或有特殊原因可申請改名，以三次為限。而某知名迴轉壽司連鎖店推出優惠活動，姓名有「鮭魚」兩字者可免費用餐，活動消息釋出後陸續有民眾至戶政機關辦理改名，至活動結束為止，有超過三百人以「鮭魚」兩字改名，部分民眾、媒體將響應活動改名的行為稱為「鮭魚之亂」。根據新聞內容判斷，下列哪一個敘述最合理？
  options:
  - label: A
    content: 《姓名條例》屬於行政法規，其法律位階低於《戶籍法》
  - label: B
    content: 名為鮭魚的顧客到店用餐不用付費，仍與店家構成民事契約關係
  - label: C
    content: 戶政人員可因字義粗俗不雅，拒絕民眾以「鮭魚」兩字更改姓名
  - label: D
    content: 造成鮭魚之亂的主因是政府限制人民改名次數，不當執行公權力
  tags:
