  stem: 臺中地檢署於2023 年破獲色情論壇「創意私房」，起出大量未成年少女被性凌虐、性猥褻、性侵的影片，而2024 年橋頭地檢署也破獲「Fans17」網站裡的上萬部兒少性影像。某網路政論節目邀請幾位網路名人以現行法律規定來評論這些事件，誰的說法完全正確？
  options:
  - label: A
