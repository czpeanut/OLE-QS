  - label: C
    content: 人形貓網紅：「民眾發現類似狀況，可撥打113 通報家暴及性侵害防治中心。」
  - label: D
    content: 健身房老闆：「政府會針對這些身心遭受侵害的兒童及青少年施予保護管束。」
