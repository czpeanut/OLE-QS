  section: 1
  number: 46
  type: single
  page: 2
  stem: '近年青少年開毒品轟趴的事件經常登上新聞版面，引起社會各界關注。若查獲開毒趴的青少年，在參考右表(一)《毒品危害防制條例》的法律規定後，何者的處置最為適當？


    表(一)

    | 施用毒品 | 一級毒品：處六個月以上，五年以下有期徒刑<br>二級毒品：三年以下有期徒刑 |

    | --- | --- |

    | 販售毒品 | 一級毒品：死刑、無期徒刑<br>二級毒品：無期徒刑、七年以上有期徒刑 |'
  options:
  - label: A
    content: 15 歲的裕民販售一級毒品，將移送檢察官偵查起訴
  - label: B
    content: 17 歲的家旻施用二級毒品，將以刑罰達到嚇阻效果
  - label: C
    content: 不分年齡者販售毒品均送交法官訓誡並立下悔過書
  - label: D
    content: 不分年齡者施用毒品均須負起違反行政法規的責任
