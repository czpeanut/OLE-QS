      publisher: 翰林
      book: 八下
      subject: 公民
      code: 5-2
      title: 生活中的行政管制
      chapter: 第5章 行政法規與行政救濟
    textbook: 八下公民 5-2 生活中的行政管制
    labeled_by: ai
