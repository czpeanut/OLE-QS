  stem: '下表是日治時期某公學校的課表，根據此課表，請問日治時期的教育特色是？


    | | 土 | 金 | 木 | 水 | 火 | 土 |

    |---|---|---|---|---|---|---|

    | 一時 | 讀書 | 修身 | 體操 | 算數 | 修身 | 體操 |

    | 二時 | 裁縫 | 算數 | 習字 | 圖畫 | 算數 | 讀書 |

    | 三時 | 體操 | 讀書 | 唱歌 | 修身 | 讀書 | 習字 |

    | 四時 | 唱歌 | 家事 | 算數 | 習字 | 裁縫 | 算數 |

    | 五時 | 習字 | 裁縫 | 家事 | 唱歌 | 家事 | 修身 |'
  options:
  - label: A
    content: 引進西式現代教育，不主張儒家思想
  - label: B
    content: 執行隔離政策，臺日不可在同一教室
  - label: C
    content: 公學校為中等教育，加強日語教學
  - label: D
    content: 小學校與公學校教授內容完全一樣。
