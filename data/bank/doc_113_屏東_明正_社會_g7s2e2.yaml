- id: doc_113_屏東_明正_社會_g7s2e2_s3_56
  section: 3
  number: 56
  type: single
  page: 5
  stem: 新媒體時代來臨，人們接收訊息較以往快速頻繁。但網路上也充斥了各種假新聞、不實訊息等情形。下列四種閱聽人對於網路訊息的處理方式，何者較符合媒體識讀的素養？
  options:
  - label: A
    content: 網路訊息都是錯誤的，一律不看網路新聞避免遭到誤導
  - label: B
    content: 新聞都是經過記者嚴格查證，可完全信任訊息的正確性
  - label: C
    content: 新聞報導不一定是對的，應多方查證訊息內容的真偽
  - label: D
