- id: doc_113_屏東_明正_社會_g7s2e2_s3_60
  section: 3
  number: 60
  type: single
  page: 6
  stem: '聖祥在電視上看到兩位學者針對組織人民團體的看法進行討論，內容摘要如下：

    甲學者：「自古以來，知識份子就會集結討論國家大事。若是組成團體來討論，有時會受到打壓。」

    乙學者：「想要獨攬政權的掌政者當然不樂見團體力量過大，就會想辦法限制。」

    甲學者：「所以在民主國家，會立法保障人民組成及加入團體的自由權利。」

    在我國，劃線處所保障的權利以及保障該權力的法規依序應為下列何者？'
  options:
  - label: A
    content: 意見自由、《人民團體法》
  - label: B
    content: 集會自由、《組織犯罪防制條例》
  - label: C
    content: 結社自由、《憲法》
  - label: D
    content: 言論自由、《憲法》。
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 公民
      code: 3-1
