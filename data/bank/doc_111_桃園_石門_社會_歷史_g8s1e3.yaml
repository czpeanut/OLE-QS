  section: 2
  number: 19
  type: single
  page: 2
  stem: 清末，通商口岸出現不少西式報刊雜誌，報導時事新聞，也帶進新思想。美國傳教士林樂知創辦的報刊，便介紹了西方各國的地理、歷史、政治等，成為當時中國接觸西方思想的重要管道。下列何者是林樂知創辦的報刊？
