  group_stem: (三)1846 年，英國商人阿斯脫豪夫禮查(Richard)在租界興建了一座以他名字命名的旅館，名為 Richard's Hotel and
    Restaurant(禮查飯店)。後來，又增設酒吧、舞廳及撲克室，大廳常有歌舞、戲劇演出，外國旅客明顯增多。19 世紀後期，禮查飯店經常是中國最早接受現代事物的場所，如使用煤氣、安裝電燈、客房電話、升降電梯等，曾引來好奇參觀人潮，成為當時遠東設備最現代化的豪華飯店之一。
