  group_stem: '請閱讀下列敘述後，回答 24.~25. 題：


    小碩因為第二次段考的數學科及生物科不甚理想，故下定決心提早準備，他為自己擬定了複習計畫，每天只分兩個複習階段，複習階段內容必須同時滿足下列五個條件：

    (1) 每天只分兩階段，每個階段為一個小時，每小時只能複習一個科目

    (2) 若第一個小時複習生物科，則第二小時只能複習數學科

    (3) 共 28 個小時複習生物科

    (4) 共有 25 天在第一個小時複習數學科

    (5) 共有 27 天在第二個小時複習數學科'
