  stem: '神奇的生日靈數

    小豐跟安安和妮妮說將自己的生日依下列四步驟,算出結果,答案會很神奇,你相信嗎?

    步驟一:將生日的日期乘以2 倍再加上月分得到一個生日靈數,

    步驟二:再把這生日靈數變成三位數(ABC),

    步驟三:然後用這ABC 去減CBA 得到另一組數字DEF,

    步驟四:利用這DEF+FED 算出答案

    例如:

    | 生日 | 步驟一 | 步驟二 | 步驟三 | 步驟四 |

    |---|---|---|---|---|

    | X 月 Y 日 | 將日期Y× 2 +月份X=生日靈數 | 變成ABC | ABC-CBA=DEF | DEF+FED=???? |

    | 8 月30 日 | 30 × 2 + 8 = 68 | 680 | 680-086=594 | 594+495= |

    | 12 月31 日 | 31 × 2 +12 = 74 | 740 | 740-047=693 | 693+396= |

    | 2 月 3 日 | 3 × 2 + 2 = 8 | 800 | 800-008=792 | 792+297= |

    | 1 月 6 日 | 6 × 2 + 1 = 13 | 130 | 130-031=099 | 099+990= |


    請回答下列各題,來驗證你的答案

    (1)安安生日是 10 月10 日,請依照上面步驟一~四,算出最後結果? （２分）

    (2)妮妮生日是 6 月24 日,請依照上面步驟一～四,算出最後結果? （２分）

    (3)小豐說不管你生日是何時?大家最後依上列四步驟,算出的答案結果都會一樣,請問小豐說的是否正確? （２分）'
