    Do you sometimes feel someone is standing too close to you? Or maybe the person
    you’re talking to keeps backing away, and you try to stay close by stepping closer
    to him or her? If so, it’s probably because of different ideas about the personal
    space between you and the person you’re talking to. According to one study, these
    ideas may have something to do with where you come from.

    The study shows that people in different countries have different ideas about
    personal space. Romanians like to keep the greatest distance between themselves
    and someone they’ve just met. They usually keep a distance of 1.3 meters between
    themselves and others. However, Argentinians stand the closest to other people,
    at a distance of only about 76 centimeters.

    Another interesting thing was also found. People from hot and cold countries show
    the greatest differences in distance. This makes some people think that people
    in warmer places are friendlier. Whether that’s true or not, one thing is for
    sure—such differences could lead to misunderstanding. So, it’s important to keep
    the right distance, or the person you’re talking to might think you’re invading
    his or her personal space. As a result, he or she might not feel comfortable around
    you.


