  stem: According to the study in the dialogue, which is true?  according to 根據
  options:
  - label: A
    content: You will feel happier if you find out you are better than others.
  - label: B
    content: The more we use social media, the less happy we seem to be.
  - label: C
    content: Through social media, you can know others’ lives well.
  - label: D
    content: Instagram is great because it helps us share our lives with our friends.
  group_stem: '(31-33)

    Leon: Irene, what are you doing?

    Irene: Hi, Leon. I’m checking my friends’ Instagram.

    Leon: Again? You really spend too much time on it.

    Irene: Maybe you’re right. But I just can’t help looking at everyone’s Instagram.
    Most of the time, I check others’ Instagram because they look happy, but I am
    not happy. I want to know why.

    Leon: Have you ever heard of “social media depression”?

    Irene: No, what is that?

    Leon: Some studies say social media has something to do with depression. It’s
    easy for social media users to compare themselves with their friends. However,
    whether they are better or worse than their friends, they always feel worse about
    themselves in the end.

    Irene: I agree. Every time I check my friends’ Instagram, I feel sad. It seems
    that they have better lives than I do.

    Leon: Hey! You should read this study. It says, “Instagram, out of other social
    media, is most likely to make young people feel depressed.”

    Irene: Really? Why is that?

    Leon: I don’t know, but I do know one thing—Online communication is very different
    from face-to-face communication. What you see on social media is not always true.

