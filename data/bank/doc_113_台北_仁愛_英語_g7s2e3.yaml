  group_stem: 'II. 52~53 題

    Do you like to visit museums? You can see so many interesting exhibits. You can
    go to an art museum and see famous paintings. You can go to a natural history
    museum and learn about animals and insects. At some museums, you can even learn
    about dinosaurs! Go to a history museum and learn about things in the past. Science
    museums are very popular, too. They have hands-on exhibits. It is impossible to
    go to a museum and not learn something new.

    There are many great museums in the world. They exhibit wonderful art. The British
    Museum in London has a collection of around eight million objects. They preserve
    human history, culture and art across two million years. The Louvre in Paris exhibits
    380,000 pieces of art! The most famous are the Mona Lisa, the Winged Victory of
    Samothrace and the Venus de Milo. Everyone wants to see them.

    At Museum of Modern Art (MoMA) in New York City, you can see many famous paintings
    by world famous artists, such as Vincent van Gogh’s the Starry Night, Marc Chagall’s
    I and the Village, Henri Matisse’s Dance, and Claud Monet’s Water Lilies.

    Another famous museum in New York is the Metropolitan Museum of Art. Some of the
    paintings from this museum will be exhibited at National Palace Museum in Taipei
    from this June to October. Go and see these famous paintings yourself!


