  stem: 54. Which does the reading NOT say about living in large groups?
  options:
  - label: A
    content: It’s good for raising animals.
  - label: B
    content: It’s easy for sharing knowledge.
  - label: C
    content: Places with large groups of people turned into towns.
  - label: D
    content: It helped with the rise of art and science.
  group_stem: 'II. 54~55 題

    Long time ago, people hunted for their food. They picked fruit from trees and
    plants from the ground. They moved a lot, following the animals or looking for
    food. They lived in small groups of about 150 people. There were no villages or
    towns. One thing changed all of that: farming.


    People started farming about 10,000 years ago. Farmers grew different crops in
    different parts of the world. Later, people also raised animals on the farms.

    Farming let people stay in the same place all year. They started to build strong
    houses to keep away from bad weather and wild animals. And they saved crops for
    winter. There was no need to move to other places and look for food. People’s
    lives improved, so they lived in bigger and bigger groups.


    Soon, more towns grew. These towns traded with each other, and people often got
    together to share their knowledge. Cultures rose up—in Egypt, China, Greece, and
    other places.

    Farming let people stay in one place and live in large groups. Art, science, and
    a lot of knowledge come from living together and sharing ideas among the groups.
    We humans owe a lot to farming—the key to civilization.


     village 村莊 crop 穀物 raise 飼養 stay 停留 improve 改善 trade 交易 owe 歸功於 civilization
    文明'
