- id: doc_113_台北_仁愛_英語_g7s2e3_s4_48
  section: 4
  number: 48
  type: single
  page: 3
  stem: 48. When did Josh and his family visit Great Hill Campground?
  options:
  - label: A
    content: On November 16.
  - label: B
    content: On November 17.
  - label: C
    content: On November 18.
  - label: D
    content: On November 19.
  group_stem: 'I. 48~51 題

    Dear Sir/Madam,

    November 19

    I’m writing to tell you that I’m not happy with Great Hill Campground. My family
    went there the day before yesterday. There were a few problems and we didn’t enjoy
    our stay at your campground.


    First, there were not enough parking spaces in the camp area. We had to park our
    car far away from our camp. Second, the restrooms were not clean enough. There
    were often mud and hair on the bathroom floor. What’s more, I have something to
    say about the staff at the front gate. He didn’t give us clear directions, and
    he didn’t give us a map of the campground until we asked for one. He didn’t even
    look up at us when he talked. Is he always so inhospitable?


    But I was happy that there were enough tables, chairs, and trash cans around the
    campground. It was really convenient.

    I hope you can try to make some changes to make this campground better. Then maybe
    I will want to visit it again next time.


    Sincerely,

    Josh Chen


     sir/madam 先生/女士 area 地區 restroom 廁所 staff 員工 direction 方向 convenient 方便的 sincerely
    誠摯的'
