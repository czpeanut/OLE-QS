  group_stem: '《題組三》閱讀下方短文後，回答下列問題

    京東商城是中國的購物網站，利用自身在銷售及物流方面的優勢，從而實現現代農業的轉型發展。例如：四川福仁緣農業開發公司在政府引導下與京東商城合作，在線上銷售枇杷等農產品。過去四川的枇杷因對外交通不便、缺乏產銷通路和市場資訊封閉，不易向外販售。如今與京東商城的合作開啟新紀元。2018
    年的京東枇杷節，福仁緣的銷售額竟達192 萬人民幣。後來，福仁緣也積極參加京東618、雙十一、年貨節等線上促銷活動，除了解決地方農產品滯銷的問題，也為公司打開知名度。請問：'
