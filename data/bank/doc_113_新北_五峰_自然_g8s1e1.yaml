  stem: '有甲、乙、丙三種固體純物質，三者對水的溶解情形及沸點如表所示。有一份參雜甲、乙、丙的混合物，可經由兩步驟（加熱、加水過濾）而分離出甲、乙、丙，其中最後收集到的固體結晶是◆，已知條件如所下圖所示。


    | | 甲 | 乙 | 丙 |

    | :--- | :--- | :--- | :--- |

    | 對水的溶解情形 | 可溶 | 可溶 | 難溶 |

    | 沸點 | 1465 ℃ | 238 ℃ | 340 ℃ |


    依據上述資訊，下列推論何者最合理？'
  options:
  - label: A
    content: ○可能是甲，步驟一是加水過濾
  - label: B
    content: ◆可能是丙， 步驟一是加水過濾
  - label: C
    content: ▲可能是乙，步驟二需加熱至 250 ℃，才可使甲、乙分離
  - label: D
