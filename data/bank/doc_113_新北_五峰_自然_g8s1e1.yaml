  - label: A
    content: 用酒精燈直接加熱燒杯，可以使實驗加快並節省時間
  - label: B
    content: 量筒除了用來測量溶液體積，也可用來配製溶液和進行反應
  - label: C
    content: 稀釋濃硫酸時要將濃硫酸緩緩加入大量水中，以免燒杯破裂或酸液濺射
  - label: D
    content: 要將眼鼻盡量靠近藥品才能準確觀察藥品的顏色、氣味和狀態。
