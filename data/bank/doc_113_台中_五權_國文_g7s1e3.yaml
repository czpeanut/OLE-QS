  group_stem: "「改天教你怎麼做飯？」那天，妳突然問我，做完爸的七七幾天後。\n   「你爸不在了，哪天我也不在，你一個人怎麼辦？」輕聲叨念，對我說，但更像是說給自己聽。\n\
    \    妳總是這樣，從我失明之後，就一直為我擔心。擔心我怎麼養活自己、怎麼吃飯、怎麼出門，從食衣住行到婚姻大事，妳都擔心。\n    我能了解妳，一個剛失去丈夫的女人，有著患得患失，擔心這、擔心那，一種過渡的不安全感。所以，我安慰妳：「別想那麼多，那都是很久很久以後的事了。」可很久很久的以後會是多久呢？\n\
    \    爾後，每隔幾天，妳就提一次，說要教我煮飯做菜。幾次後，我突然意識到，身為兒子，我有義務消除妳的不安全感。所以，當妳再次提起時，我說好。\n   \
    \ 看不見下廚，我們都沒經驗，一個不知該如何教，一個不知該怎麼學。那就先學炒飯吧，妳覺得那最簡單。\n    煮飯時，怕觸電，我拿乾毛巾包住手按開關，妳很無語。切菜時，妳緊張怕我受傷。看到我用菜刀鋸肉塊，妳有動手的衝動，以為妳想幫我，結果是想K\
    \ 我。而蛋總是敲不破，見我小心翼翼，妳笑罵：「用力點，沒吃飯喔。」妳笑了，妳終於笑了，多久了。這時我才發現，整個過程，妳似乎忘了想起妳的丈夫、我的爸。於是，我更加笨拙了。\n\
    \    過程是狀況百出的，經過無數次失敗，我們終於理出只屬於我的SOP。方形碟子放青菜，圓形放火腿片，小碗裝蛋液，不同容器我較容易辨識。肉片換成火腿，「隨你怎麼煮，一定是熟的。」妳說。滴幾滴油，中火，小碗、圓碟、方碟依序入鍋翻炒，小匙精鹽醬油，最後關火，大碗飯入鍋翻攪，大功告成。那是專為我客製的炒飯SOP。\n\
    \    終究還是一個人下廚了。\n    按下電鍋開關時，想了妳一分；切菜時，再多一分；火腿切片，又多了一分。蛋液碎殼灑滿地時，想起那次，同樣滿地蛋液碎殼，妳叫我：「不要動。」雖看不見，但我知道，妳正俯身擦拭地板。那一刻，好心疼，好想哭。\n\
    \   就剩我一個人的餐桌了。才拿起筷子，忽然明白，很久很久的以後，不管多久，其實，都沒有很久。\n                           \
    \                            (世民 炒飯SOP  2024 第四屆台灣房屋親情文學獎佳作)"
