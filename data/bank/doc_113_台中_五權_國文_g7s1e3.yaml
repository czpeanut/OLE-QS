  stem: "「時間，讓深的東西愈來愈深，讓淺的東西愈來愈淺。看得淡一點，傷得就會少一點，時間過了，愛情淡了，也 \n    就散了。別等不該等的人，別傷不該傷的心。我們真的要過了很久很久，才能夠明白，自己真正懷念的，到底是怎樣\
