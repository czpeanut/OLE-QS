  stem: "「人生的一切遭遇，都是陶冶人的性情，磨練人的精神，鑄造人的人格，使之能夠承擔人生的嚴肅責任的途  \n    徑。」請問這句話所表達的意思與下列何者最接近？"
  options:
  - label: A
    content: 人生在世不會總是一帆風順和美妙動人的
  - label: B
    content: 患難困苦，是磨鍊人格之最高學校
  - label: C
    content: 含淚播種的人，一定能含笑收穫
  - label: D
    content: 所有堅忍不拔的努力遲早會取得報酬的。
  group_stem: "人生是多方面的，有輕鬆的一面，也有刻板的一面；有快樂的一面，也有愁苦的一面；正猶如天氣一樣的變化多端，有晴空萬里，和風順暢的日子，也有漫天雨雪，朔風凜冽的時候；惟其如此，也才顯得多采多姿。\n\
    \  西哲培根說過這樣一句話：「人們沒有哭，便不會有笑；一個人不先瞭解悲哀，便無法理解快樂。」推而言之，人生的一切遭遇，都是陶冶人的性情，磨練人的精神，鑄造人的人格，使之能夠承擔人生的嚴肅責任的途徑。\n\
    \  然而，在人性中，有一個最大的弱點，它能使人不顧責任，疏忽職分，成為美善人生的絆腳石。這個弱點，就是貪圖享樂的欲望。誠如西哲白爾衛的警語所說：「逸樂的生活可使一顆本來是堅強的心變成猥弱。」一個人一旦只圖享樂，便會放縱恣肆，不可遏止；從而蔑視一己的人生天職，終於無所不為，招來的只有伴同著禍患罪殃而來的絕望。\n\
    \  享樂主義者之所以錯誤，是因為他們分不清享樂與享受、快樂與逸樂之間的界限。要知道，人人都應該有其人生的享受，譬如親子之情、手足之愛、伉儷之歡、朋友之誼，以及大自然與社會提供的一切可喜可樂的事物；但是這些享受，必須是要你盡了人生相對的責任之後，給予相當的辛勞代價，方才收穫的；它和純粹依賴金錢換得的物質與情欲的享樂，是有天壤之別的。\n\
    \                                                                            \
    \    （節錄自宋瑞 享樂與享受）"
  tags:
    textbook: 第一冊（七上）第3次段考範圍
    labeled_by: ai
