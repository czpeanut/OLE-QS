- id: doc_113_台中_五權_國文_g7s1e3_s2_28
  section: 2
  number: 28
  type: single
  page: 3
  stem: 作者朋友的孫子喜歡看電視，但功課又很好的原因為何？
  options:
  - label: A
    content: 除了連續劇之外，也會看益智節目增長見識
  - label: B
    content: 強迫自己將全部的功課做完後才可看電視
  - label: C
    content: 將做功課與看電視等事情規畫先後順序
  - label: D
    content: 規定自已每天都要閱讀一定數量的書。
  group_stem: "彤彤：\n    前天，我的一個朋友告訴我一件關於他孫子的有趣的事情。我聽了覺得很有意思，所以也說給你聽聽。\n    我朋友的孫子是個國中生，很愛看電視連續劇，每天晚上八點鐘一到，他就會「咚咚咚咚」地從二樓樓梯走下來，端端正正地坐在客廳的電視機前面，靜靜地欣賞連續劇，直到播映完了才離去。可是說也奇怪，他的功課好得很，每次成績單發下來，他的成績都在班上的前段。\n\
    \    我的朋友說，孫子的祕密只有他知道。原來他的孫子每天放學回家，第一件事就是走進自己的房間，關起門來靜靜地做功課，直到母親喊他下來吃飯，那時候他作業已經寫完，下來吃過飯後，又回到房間裡去看課外書，等到八點鐘的鬧鐘響了，他就出現在電視機前面。我的朋友說:「我這個孫子做事很有規畫，這是他的長處。」\n\
    \    做功課，寫作業，也是一種「做事」，換句話說，那是學生該做的事。既然是做事，就要有規畫。不懂得規畫的學生，通常都是想起一件做一件。雖然這也是「做」，但是因為沒有規畫，很可能會把不重要的事拿起來先做，甚至把可以安排在星期六、星期天做的作業也拿出來做，卻把明天一定要交的作業放在一邊，或者根本忘得乾乾淨淨。\n\
    \    「規畫」有幾個步驟。第一個步驟是「檢視」，就是通盤的檢查，看看今天要寫的作業一共有多少，是兩項，是三項，是四項，一樣一樣記下來。這樣，就知道今天的作業究竟是多少，有沒有漏掉。能夠做到這個步驟，就不會誤事，不會糊裡糊塗地以為今天可以大玩一場。\n\
    \    第二個步驟是「排序」，把該做的事情安排個先後。有的人喜歡把最容易的由排在前面，有的人喜歡把最容易的排在最後。明天一定要交的，一定要排在最前面，可以安排在另一天做的，排列在後面。\n\
    \    第三個步驟，就是靜下心來，好好去做。\n    對自己要做的事情有完整的了解，並且能根據事情的輕重緩急安排一個先後，這就是「規畫」。\n    把寫作業看成一種學習活動，並且懂得好好規畫，就不會有人老是催他「去寫作業」，不會有人老是問他「功課寫了沒有」。想做一個快樂的學生並不難，你說對嗎?\n\
    祝你健康快樂!                                                                      \
    \                   外公\n( 林良 林良爺爺的30 封信 )"
  tags:
    textbook: 第一冊（七上）第3次段考範圍
    labeled_by: ai
