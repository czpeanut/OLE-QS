- id: doc_112_桃園_石門_自然_g8s2e2_s1_22
  section: 1
  number: 22
  type: single
  page: 3
  stem: '在一個已達平衡的可逆反應中，反應式如下：


    $\mathrm{A} + \mathrm{B} \rightleftharpoons \mathrm{C} + \mathrm{D} + \text{熱量}


    若移除容器內的B 物質，則有關反應的變化，何者正確？'
  options:
  - label: A
    content: 平衡往正反應的方向移動
  - label: B
    content: 會進行放熱反應，使環境溫度升高
  - label: C
    content: 達到新平衡前，C、D 的量會持續減少
  - label: D
    content: 達到新平衡後，容器內仍不會有B 物質
