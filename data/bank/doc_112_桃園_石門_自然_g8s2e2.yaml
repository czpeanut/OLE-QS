- id: doc_112_桃園_石門_自然_g8s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '參考下表，判斷下列化合物的化學式何者正確？


    | 陽離子 | $\mathrm{Mg}^{2+}$、$\mathrm{Ca}^{2+}$、$\mathrm{Al}^{3+}$、$\mathrm{NH}_{4}^{+}$
    |

    | :---: | :---: |

    | 陰離子 | $\mathrm{OH}^{-}$、$\mathrm{NO}_{3}^{-}$、$\mathrm{CO}_{3}^{2-}$ |'
  options:
  - label: A
    content: 碳酸鎂為$Mg_{2}CO_{3}$
  - label: B
    content: 氫氧化鈣為$CaOH_{2}$
  - label: C
    content: 硝酸銨為$NH_{4}NO_{3}$
  - label: D
    content: 氫氧化鋁為$Al_{2}(OH)_{3}$。
- id: doc_112_桃園_石門_自然_g8s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 下列各物質加入水中的解離反應式，何者正確？
  options:
  - label: A
    content: 氯化鈣：$CaCl_{2}\rightarrow Ca^{2+}＋Cl_{2}^{-}$
  - label: B
    content: 硫酸：$H_{2}SO_{4}\rightarrow 2H^{+}＋SO_{4}^{2-}$
  - label: C
    content: 氨氣：$NH_{3}\rightarrow NH_{2}^{-}＋H^{+}$
  - label: D
    content: 酒精：$C_{2}H_{5}OH\rightarrow C_{2}H_{5}^{+}＋OH^{-}$
- id: doc_112_桃園_石門_自然_g8s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 有些冷凍廠會以液態氨作為冷媒，若不幸發生氨氣外洩，為了避免逸出的氣體造成人員危害，剛發生時應如何緊急處理？
  options:
  - label: A
    content: 噴灑大量清水
  - label: B
    content: 向空氣噴灑稀鹽酸
  - label: C
    content: 使用強光照射
  - label: D
    content: 使用抽氣機吸回容器內
- id: doc_112_桃園_石門_自然_g8s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 由指示劑變色範圍判斷，變色口紅膠可能含有下列哪一種指示劑？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
  group_stem: '※市面上的變色口紅膠也是酸鹼指示劑的應用。口紅膠原本呈現紫色，以廣用試紙測試為弱鹼性，塗抹後接觸空氣，顏色會變為無色。請回答以下問題：(9、10題)


    | 指示劑 | 低pH值的顏色 | pH值變色範圍 | 高pH值的顏色 |

    | :---: | :---: | :---: | :---: |

    | 甲 | 無色 | 8.2-10.0 | 粉紅 |

    | 乙 | 黃 | 6.6-8.0 | 紅 |

    | 丙 | 無色 | 9.4-10.6 | 紫 |

    | 丁 | 紅 | 4.5-8.3 | 紫 |'
