    content: 由圖可知加入二氧化錳不影響氧氣產量
  - label: B
    content: 由圖可判斷加入二氧化錳的實驗為甲組
  - label: C
    content: 二氧化錳只改變反應速率，未參與反應
  - label: D
    content: 反應結束後，二氧化錳的質量或化學性質不會發生變化
