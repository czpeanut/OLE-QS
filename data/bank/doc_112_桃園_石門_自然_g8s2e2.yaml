- id: doc_112_桃園_石門_自然_g8s2e2_s1_28
  section: 1
  number: 28
  type: single
  page: 3
  stem: '在水溶液中，溴（$Br_{2}$）與水作用產生無色的氫離子（$H^{+}$）、溴離子（$Br^{-}$）及次溴酸（$HBrO$），此反應是可逆反應：


    $\mathrm{Br_{2}} + \mathrm{H_{2}O} \rightleftharpoons \mathrm{H}^{+} + \mathrm{Br}^{-}
    + \mathrm{HBrO}$


    已知溴水具有毒性，請問如何利用化學平衡的概念控制反應方向，使溴反應成較無毒性的溴離子？'
  options:
  - label: A
    content: 加入酸性物質，使反應往正反應的方向移動
  - label: B
    content: 加入酸性物質，使反應往逆反應的方向移動
  - label: C
    content: 加入鹼性物質，使反應往正反應的方向移動
  - label: D
    content: 加入鹼性物質，使反應往逆反應的方向移動
