  options:
  - label: A
    content: 溶液中的沉澱物為白色的碳酸鈣
  - label: B
    content: 計時結束時，三杯遮蓋「＋」字記號的沉澱量大小關係為甲＝乙＝丙
  - label: C
    content: 遮住「＋」所需的時間為丙＞乙＞甲
  - label: D
    content: 由實驗結果可知鹽酸的濃度越高，反應速率越快
