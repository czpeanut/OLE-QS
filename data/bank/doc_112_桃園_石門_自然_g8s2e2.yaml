  stem: 硫酸鉀（$K_{2}SO_{4}$）在水溶液中完全解離成鉀離子和硫酸根離子，若硫酸鉀溶液中含有0.4莫耳的鉀離子，則應含有多少莫耳的硫酸根離子？
  options:
  - label: A
    content: 0.2莫耳
  - label: B
    content: 0.4莫耳
  - label: C
    content: 0.6莫耳
  - label: D
    content: 0.8莫耳。
- id: doc_112_桃園_石門_自然_g8s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 關於阿瑞尼士電離說的內容何者正確？
  options:
  - label: A
    content: 電解質溶於水，不需通電即可解離產生陽離子與陰離子
  - label: B
    content: 水溶液中的陽、陰離子數目相同，呈電中性
  - label: C
    content: 電解質水溶液通電後，陽離子移向正極、陰離子移向負極。
  - label: D
    content: 因為與法拉第的觀點相符，提出電離說的當下即被大眾所接受。
