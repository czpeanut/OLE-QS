  stem: '桌上放置有甲、乙、丙三杯無色溶液，已知此三種溶液分別為鹽酸、碳酸鈉、酚酞指示劑。老師從三種溶液中分別各取兩種溶液混合，並觀察混合後的變化，所得結果如下表所示。請問甲、乙、丙這三杯溶液的成分依序為何？


    | 混合成分 | 混合後溶液的變化 |

    | :---: | :---: |

    | 甲＋丙 | 混合後溶液變紅色 |

    | 乙＋丙 | 混合後產生氣體 |'
  options:
  - label: A
    content: 鹽酸、碳酸鈉、酚酞
  - label: B
    content: 鹽酸、酚酞、碳酸鈉
  - label: C
    content: 酚酞、鹽酸、碳酸鈉
  - label: D
    content: 碳酸鈉、鹽酸、酚酞。
