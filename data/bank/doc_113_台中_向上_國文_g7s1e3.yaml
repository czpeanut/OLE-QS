- id: doc_113_台中_向上_國文_g7s1e3_s1_28
  section: 1
  number: 28
  type: single
  page: 2
  stem: 蘇城有南園、北園二處，菜花黃時，苦無酒家小飲。攜盒而往，對花冷飲，殊無意味。或議就近覓飲者，或議看花歸飲者，終不如對花熱飲為快。眾議未定。芸笑曰：「明日但各出杖頭錢，我自擔爐火來。」眾笑曰：「諾。」眾去，余問曰：「卿果自往乎？」芸曰：「非也，妾見市中賣餛飩者，其擔鍋、灶無不備，盍雇之而往？」根據這段文字，何者敘述正確？
