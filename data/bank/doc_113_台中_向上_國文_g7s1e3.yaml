  stem: （甲）故事中的鄭人與（乙）故事中的楚人有什麼共同的個性？
  options:
  - label: A
    content: 過度自信，眼高於頂
  - label: B
    content: 墨守成規，不知變通
  - label: C
    content: 用志不專，易於分心
  - label: D
    content: 以假亂真，魚目混珠。
  group_stem: '（二）閱讀以下兩則短文後回答問題：

    （甲）鄭人有欲買履①者，先自度其足，而置之其坐。至之市而忘操之。已得履，乃曰：「吾忘持度。」反②歸取之。及反，市罷，遂不得履。

    （《韓非子》）

    （乙）楚人有涉江者，其劍自舟中墜於水。遽③契其舟，曰：「是吾劍之所從墜。」舟止，從其所契者入水求之。舟已行矣，而劍不行，求劍若此，不亦惑乎！

    （《呂氏春秋》）


    註：①履：鞋子。 ②反：通「返」，返回。 ③遽：急忙、迫促。'
