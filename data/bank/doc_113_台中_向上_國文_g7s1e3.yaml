  - label: D
    content: 利用物流系統提供境內社福團體食物。
  group_stem: '（三） 瑞士的減碳行動—從市場策略的改變開始

    超市是現代人最常購物的場所，減碳風潮下，也成為行動的第一線。Coop 和Migros 超市是瑞士零售雙雄，包辦瑞士人的食衣住行：不只引領減碳潮流，還用市場策略改變消費者購物習慣。

    兩家超市都有歐洲共同認可的Demeter Bio 有機商標、AOP 古法農作商標等國際農作商標，超市架上的多元商標不只展示了分眾市場，也鼓勵農民在農作中展現各自區域的優勢，走出食物「愈在地、愈國際」的價值。

    Coop 的本土商品系列（Miini Region），標榜的就是瑞士農夫自產的區域特殊商品；Migros 也發展出為土地而生系列（Aus der Region.
    Für die Region.）商品，與本地農夫契作①做為市場行銷對策；有的商品上甚至印上農夫的照片，以示誠信。

    它的「坐而言不如起而行」（Taten statt Worte）企劃包含400項實際行動，例如第400 號「食物零浪費行動」的目標，是在2026 年之前達到食物不被丟棄的零浪費目標。為達到這個目標，Coop
    建立「Schweizer Tafel」物流系統，讓食物在過期前就能在瑞士境內被食用完畢。這項計畫每年省下約5000 噸、相當於2700 萬法郎的食物，在瑞士境內供應中低收入戶救濟站、遊民協助站、婦女中繼之家等500家社福團體。

    Migros 的氣候及環境的永續指標M-check，可顯示產品生產過程中排放的二氧化碳當量。五顆星，代表該產品每公斤排放量小於一公斤二氧化碳；四顆星代表介於一到一點九公斤碳。以此類推，一顆星產品的碳排放量已超過十公斤的碳當量，對環境及氣候最不友善。Migros
    的各項日常商品都有減碳選擇。比方，購買Migros 集團下的瑞士製造家具，得到的永續積分會高於在亞洲生產的家具；而亞洲生產的家具，也有永續木材與一般木材的標章。Migros
    不止賣減碳商品，也研發減碳商品。它的自產品牌清潔劑，會使用製程中收集的二氧化碳與酒精；它也與新創公司LanzaTech 合作，以製程中產生的二氧化碳，生產自有品牌洗手乳及清潔劑的PET
    瓶，是全球首創。


