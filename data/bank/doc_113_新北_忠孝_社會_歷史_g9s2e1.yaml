questions:
- id: doc_113_新北_忠孝_社會_歷史_g9s2e1_s1_28
  section: 1
  number: 28
  type: single
  page: 1
  stem: 他在上任美國總統的一年後，戰爭爆發。美國的輿論認為這場戰爭與自己國家沒有任何關係，不想干涉其他國家的事務，反對參戰，直到事件發生後，美國承受巨大的人員與物質的損失，國內開始有參戰的呼聲出現。之後，美國宣布參戰，加入協約國陣營。參戰後，他除了面對戰事，也開始草擬和平方案，為戰後世界做規劃，其部分內容如下：各國裁減軍備；恢復比利時、波蘭領土；歸還德法戰爭中法國的失土；給予奧匈帝國、鄂圖曼帝國統治下各民族自由發展的機會；設立國際和平組織。他因推動成立國際和平組織等貢獻，榮獲諾貝爾和平獎。請問：這位榮獲諾貝爾和平獎的美國總統是指何人？
  options:
  - label: A
    content: 威爾遜
  - label: B
    content: 林肯
  - label: C
    content: 梅特涅
  - label: D
    content: 門羅。
- id: doc_113_新北_忠孝_社會_歷史_g9s2e1_s1_29
  section: 1
  number: 29
  type: single
  page: 1
  stem: 此人出生於委內瑞拉，後在當地成立祕密組織進行獨立運動，並驅逐殖民當地的歐洲人總督。他曾指出：「三百年的等待還不夠？難道還要再等三百年嗎？」以鼓動民眾勇於爭取國家獨立自主。在他持續努力下，終於玻利維亞共和國成立，其國名以他命名，並尊其爲總統。他在南美五國（哥倫比亞、委內瑞拉、厄瓜多、秘魯和玻利維亞）獨立過程中功勳卓著，因此被稱爲「南美的華盛頓」。請問：此人為下列何人？
  options:
  - label: A
    content: 波利瓦
  - label: B
    content: 俾斯麥
  - label: C
    content: 拿破崙
  - label: D
    content: 加里坡底。
- id: doc_113_新北_忠孝_社會_歷史_g9s2e1_s1_30
  section: 1
  number: 30
  type: single
  page: 1
  stem: 在歐洲歷史上，在某個會議之後的30 年常常被稱為「復辟時代」。這是一個以恢復保守為核心的會議，為了歐洲持久的和平，在他們看來，必須要貫徹「正統」原則和實施歐洲各國的「均勢」；而此會議的主導人物也曾表示「各國國王應當思量他們在未來還有多少機會可以安坐王位，除非各國團結合作，維護政治體制，否則歐洲社會將會崩解。」請問：這個會議最可能是下列哪場會議？
  options:
  - label: A
    content: 開羅會議
  - label: B
    content: 柏林會議
  - label: C
    content: 巴黎和會
  - label: D
    content: 維也納會議。
- id: doc_113_新北_忠孝_社會_歷史_g9s2e1_s1_31
  section: 1
  number: 31
  type: single
  page: 1
  stem: 歐洲在某時期有流通一種銀幣如右圖，銀幣上面印章刻有文字:「法國皇帝、義大利國王、萊茵邦聯的護國主。」請問這枚銀幣最可能是何人所鑄造發行的硬幣？
  options:
  - label: A
    content: 路易十四
  - label: B
    content: 拿破崙
  - label: C
    content: 凱薩
  - label: D
    content: 亨利八世。
  assets:
  - key: s1_31_f1
    kind: figure
    file: doc_113_新北_忠孝_社會_歷史_g9s2e1/s1_31_f1.png
- id: doc_113_新北_忠孝_社會_歷史_g9s2e1_s1_32
  section: 1
  number: 32
  type: single
  page: 1
  stem: 豪豪 在閱讀一本歷史書時，看到描寫某次戰爭的情景，說：「從某些方面來看，它是十九世紀的最後一場戰爭。軍官依然配帶長劍，騎兵則縱馬馳騁，國王和貴族在軍事上仍扮演重要角色。然而從技術觀之，它無疑是二十世紀的一場衝突；碉堡再也無法抵擋巨大的榴彈砲攻勢，步兵的衝鋒槍在機槍面前不過是自取滅亡。這時的戰鬥，士兵大多是坐在狹小的泥洞裡，任憑外面砲彈傾瀉而下，卻永遠無法離開那令人作嘔的壕溝，恐懼而絕望的情緒在每一條地表的裂縫中蔓延。……」請問：豪豪所看到這本歷史書所描寫的最可能是下列哪場戰爭？
  options:
  - label: A
    content: 1776 年的美國獨立運動
  - label: B
    content: 1789 年的法國大革命
  - label: C
    content: 1870 年的德法戰爭
  - label: D
    content: 1914 年的第一次世界大戰。
- id: doc_113_新北_忠孝_社會_歷史_g9s2e1_s1_33
  section: 1
  number: 33
  type: single
  page: 1
  stem: 十九世紀的經濟學家李斯特曾對某地區的經濟發展提出這樣的擔憂：「這38 條海關收費線，使得內部交通呈現混亂，其效果與人體的每個部位都被阻塞以使血液不會流入另一個部位時產生的效果沒什麼兩樣。一個人為了從漢堡到奧地利，為了從柏林到瑞士，就得穿越十來個國家，並繳納十來次過境稅。但凡誰很不幸地生在有三四個國家交界的地方，一生都在煩人的稅收和過路費徵收者之間度過，他的心裡不可能會有祖國。」請問：下列哪一個組織的成立有效地解決李斯特所提到的擔憂？
  options:
  - label: A
    content: 國際聯盟
  - label: B
    content: 協約國
  - label: C
    content: 關稅同盟
  - label: D
    content: 萊茵邦聯。
- id: doc_113_新北_忠孝_社會_歷史_g9s2e1_s1_34
  section: 1
  number: 34
  type: single
  page: 1
  stem: 右圖為某時期的一張報紙上的宣傳圖，內容畫著一個人正背著當地的土著前往遠方的學校，並認為這件事是他們應該負起的重要責任。請問：右圖所表示的看法對世界造成什麼樣的影響？
  options:
  - label: A
    content: 保守主義之下，君王重拾權力並以保護國家為己任
  - label: B
    content: 民族自決的理論下，教導各地殖民地發動獨立活動
  - label: C
    content: 工業化國家為取得大量原料與市場，瓜分落後地區
  - label: D
    content: 歐洲各地發起革命活動，宣揚自由與平等的新概念。
  assets:
  - key: s1_34_f1
    kind: figure
    file: doc_113_新北_忠孝_社會_歷史_g9s2e1/s1_34_f1.png
- id: doc_113_新北_忠孝_社會_歷史_g9s2e1_s1_35
  section: 1
  number: 35
  type: single
  page: 1
  stem: 貝多芬是歐洲歷史上非常有名的音樂家，他曾經非常敬佩某位人物的貢獻，因此於1803 年編寫一首交響曲，並直接用這位人物的名字來命名以此表達他的敬意。但隔年這位人物稱帝的消息傳來，使貝多芬氣憤不已，並且把寫到一半的曲子撕毀。不過後來貝多芬還是將曲子完成，只是將曲風改為送葬的悲悽感，以表達對此人的不滿，並將曲子改名為「英雄交響曲」。請問：關於貝多芬「英雄交響曲」原先讚頌的對象所帶來的貢獻，下列敘述何者正確？
  options:
  - label: A
    content: 以土生白人身分帶領南美洲各地人民發起獨立運動
  - label: B
    content: 以保守主義穩定整個歐洲因革命而混亂的社會秩序
  - label: C
    content: 制定法典並透過征服傳遞自由平等的啟蒙政治理念
  - label: D
    content: 透過外交手段及無數的鐵與血逐步將民族帶向統一。
- id: doc_113_新北_忠孝_社會_歷史_g9s2e1_s1_36
  section: 1
  number: 36
  type: single
  page: 2
  stem: 右圖為中國某時期的報紙上所登載的新聞，同篇報紙上也有記者寫下關於對此事件的評論：「山東人民自古為中國民族，用中國語言，信中國宗教，山東是中國文化發祥地之一，為中國北部門戶，山東經濟發展，人口稠密，不容殖民。將山東交還中國符合和會『承認民族領土完整』的原則。」請問：這篇報導的出現與下列何事最為相關？
  options:
  - label: A
    content: 清朝末年時中國被歐洲各國劃分勢力範圍
  - label: B
    content: 第一次世界大戰後戰勝國召開的巴黎和會
  - label: C
    content: 民初軍閥為取得日本支持而出讓中國利益
  - label: D
    content: 國際聯盟中日本與中國為山東問題的爭論。
  assets:
  - key: s1_36_f1
    kind: figure
    file: doc_113_新北_忠孝_社會_歷史_g9s2e1/s1_36_f1.png
- id: doc_113_新北_忠孝_社會_歷史_g9s2e1_s1_37
  section: 1
  number: 37
  type: single
  page: 2
  stem: 小勛 在美術館中參觀一個主題是歐洲某時期的繪畫特展，看到了一幅名為「馬拉之死」的畫，畫展的簡介說此畫是該時期最有名的一幅畫，「1793 年，新成立政府除處死原本國王外，也瘋狂追捕異議分子並處死，革命家馬拉為此而躲進了下水道，但最後卻被他的政敵派出刺客在浴缸中刺殺。他的畫家朋友為悼念馬拉之死，將他描繪成了為革命而獻身的殉道者，留下『馬拉之死』的著名畫作。」請問：小勛最可能是參觀哪個時期的繪畫特展？
  options:
  - label: A
    content: 法國大革命時期
  - label: B
    content: 拿破崙稱霸歐洲時期
  - label: C
    content: 美國南北戰爭時期
  - label: D
    content: 第一次世界大戰時期。
- id: doc_113_新北_忠孝_社會_歷史_g9s2e1_s1_38
  section: 1
  number: 38
  type: single
  page: 2
  stem: 在印度沒有叫做「咖哩」的料理，印度人對不同的菜餚與烹調方法都有特定的名稱，今日我們所說的咖哩，其實是歐洲人對印度飲食文化的概念。咖哩一詞，據說是從印度南部坦米爾語（Tamil）中的「kari」演化而來的，原是指一種醬汁，當時印度的統治者以咖哩統稱印度人混合數
    10 種香料，調製成氣味濃郁而辛辣的菜餚，並把配方帶到歐洲，將它包裝成為商品，所謂的咖哩風味正式成形，後來也成為該統治者轄下地區的美食。請問：根據文章所示，當時的咖哩最可能流行於下列哪些地方？
  options:
  - label: A
    content: 朝鮮
  - label: B
    content: 香港
  - label: C
    content: 越南
  - label: D
    content: 臺灣。
- id: doc_113_新北_忠孝_社會_歷史_g9s2e1_s1_39
  section: 1
  number: 39
  type: single
  page: 2
  stem: 自由古巴(Cuba libre) 是古巴獨立運動的口號，也是一款雞尾酒的名字。1900 年代初期，自由古巴這款酒在古巴誕生，這款雞尾酒是由古巴當地的萊姆酒以及某國的飲料調和而成，一般認為，自由古巴的誕生和古巴的獨立及某國支持古巴獨立、勢力湧入古巴有很重要的聯繫，當時該國的政壇針對古巴的獨立運動曾做出評論：「關於任何歐洲國家對美洲的入侵，我們有權進行干預，使歐洲勢力撤離。」後來這款雞尾酒因配方簡單，很快打入世界市場，成為受歡迎的酒精飲料之一。請問：自由古巴的原料最可能是古巴的萊姆酒與下列何種飲料調和而成？
  options:
  - label: A
    content: 西班牙水果酒
  - label: B
    content: 英國伯爵茶
  - label: C
    content: 德國黑啤酒
  - label: D
    content: 美國可口可樂。
- id: doc_113_新北_忠孝_社會_歷史_g9s2e1_s1_40
  section: 1
  number: 40
  type: single
  page: 2
  stem: 西元1930 年，臺灣發生霧社事件，當時以蔣渭水為首的臺灣民眾黨除在報紙上刊登事件始末外，也拍發電報向日本內閣表達不滿，請內閣派人至臺灣調查，但未得到重視。隔年，臺灣民眾黨向當時的國際組織發電報，抗議日本軍方違反國際約定使用毒瓦斯屠殺臺灣霧社人民。因狀告國際，日本內閣終於正視此問題，但這也成為加速臺灣總督府解散臺灣民眾黨的原因之一。請問：當時臺灣民眾黨最可能向下列哪個國際組織進行抗議？
  options:
  - label: A
    content: 聯合國
  - label: B
    content: 同盟國
  - label: C
    content: 關稅同盟
  - label: D
    content: 國際聯盟。
