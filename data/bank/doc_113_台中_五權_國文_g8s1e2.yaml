- id: doc_113_台中_五權_國文_g8s1e2_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 「移覺」，是一種修辭，指運用具體生動形象的語言，將「某種感官」的感覺，移轉到「另一種感官」，打破原有感官與感官之間的界線，將不同感覺融合一起描述，因此判斷是否為「移覺」修辭，是根據是否同時具備兩個以上的感官描述一起出現。「移覺」修辭多藉助「譬喻」修辭來表現，常出現在「譬喻」修辭中。讓「顏色似乎會有溫度，聲音似乎會有形象，冷暖似乎會有重量，氣味似乎會有鋒芒。」，這便是「移覺」的巧妙呈現。譬如「太陽又出來了，一片清新的空氣、鮮潔的色彩，彷彿聽見了貝多芬的《田園交響曲》…」，就是用【聽覺】印象描寫【視覺】效果。請問下列何者「移覺」使用說明是「錯誤」的？
  options:
  - label: A
    content: 漸漸的愈唱愈高，忽然拔了一個尖兒，像一線鋼絲拋入天際：以【視覺】印象表達【聽覺】效果
  - label: B
    content: 微風過處，送來縷縷清香，彷彿遠處高樓上緲茫的歌聲似的：以【聽覺】印象表達【嗅覺】效果
  - label: C
    content: 空的眠床，是軟軟的灰色偎襯著我：以【觸覺】印象表達【視覺】效果
  - label: D
    content: 陽光好亮，透過葉隙叮叮噹噹擲下一大把金幣：以【視覺】印象表達【聽覺】效果
  tags:
    textbook: 第三冊（八上）第2次段考範圍
    labeled_by: ai
