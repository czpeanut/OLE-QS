  group_stem: "（二）\n歸園田居其一    陶淵明\n少無適俗韻，性本愛丘山。誤落塵網中，一去三十年。\n羈鳥戀舊林，池魚思故淵。開荒南野際，守拙歸園田。\n\
    方宅十餘畝，草屋八九間。榆柳蔭後簷，桃李羅堂前。\n曖曖遠人村，依依墟里煙。狗吠深巷中，雞鳴桑樹巔。\n戶庭無塵雜，虛室有餘閒。久在樊籠裏，復得返自然。\n\
