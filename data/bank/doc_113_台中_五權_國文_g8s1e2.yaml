- id: doc_113_台中_五權_國文_g8s1e2_s2_38
  section: 2
  number: 38
  type: single
  page: 4
  stem: <聽聽那冷雨>的標題，藉「冷」寄寓故國情思，「冷」字雙關，暗示作者尋故國而不得的傷感，而「聽」則貫串成為全文主線，使全文充滿雨的「旋律」，也從「雨」將「中國」、「台灣」作了土地和情感上的連結
    。這裡節錄其中幾段，請問各段文意，下列敘述何者「錯誤」？
  options:
  - label: A
    content: 首段藉由王禹偁在黃岡的小竹屋聽雨聽雪的經驗，描寫竹屋有放大各種聲音的效果，聲音特別清脆
  - label: B
    content: 第二段描寫雨落在碎片面積的屋瓦上， 有時雨大，有時雨小，還有細流沿著屋簷流下。讓他想起灰美人的童話故事，回想到童年悲傷的情懷
  - label: C
    content: 第三段前半描寫了雨天的景象，從天色變暗開始，城市被陰影籠罩，涼意瀰漫，風在每個角落旋起。
  - label: D
    content: 第三段後半描寫雨水輕輕敲打屋頂，像是一場古老的音樂會，節奏細膩而親切，讓人聯想到童年的搖籃曲或江南水鄉的蠶食聲。雨聲如同瓦片的合奏，從驚蟄到清明，間歇地敲打，彷彿在為零落的墳墓奏輓歌。充滿了詩意和懷舊的情感
  group_stem: "（三）\n寫作背景介紹：這是余光中1974年到香港中文大學任教後寫下的一篇散文。文章從結構上分為三個部分：第一部分由雨季的開始，滿懷深情地聯想到祖國（中國江南）；第二部分由雨展開具體的想像，描寫獨特的體驗，書寫濃濃的相思；第三部分思緒回到現實，將對故鄉的思念、回憶埋入心底，沉澱。\n\
    下面節錄其中的第二部分的某幾段，在描寫雨的聯想、雨的具體比喻、和思念母親與兒時家鄉江南的回憶。\n請根據此文，閱讀後，回答下面問題：\n\n聽聽那冷雨  \
    \  余光中\n    雨打在樹上和瓦上，韻律都清脆可聽。尤其是鏗鏗敲在屋瓦上，那古老的音樂，屬於中國。王禹偁在黃岡，破如椽的大竹為屋瓦。據說住在竹樓上面，急雨聲如瀑布，密雪聲比碎玉，而無論鼓琴，詠詩，下棋，投壺，共鳴的效果都特別好。這樣豈不像住在竹筒裡面，任何細脆的聲響，怕都會加倍誇大，反而令人耳朵過敏吧。\n\
    \    雨天的屋瓦，浮漾溼溼的流光，灰而溫柔，迎光則微明，背光則幽黯，對於視覺，是一種低沉的安慰。至於雨敲在鱗鱗千瓣的瓦上，由遠而近，輕輕重重輕輕，夾著一股股的細流沿瓦漕與屋簷潺潺瀉下，各種敲擊音與滑音密織成網，誰的千指百指在按摩耳輪。「下雨了」，溫柔的灰美人來了，她冰冰的纖手在屋頂拂弄著無數的黑鍵啊灰鍵，把晌午一下子奏成了黃昏。\n\
    \    在古老的大陸上，千屋萬戶是如此。二十多年前，初來這島上，日式的瓦屋亦是如此。先是天黯了下來，城市像罩在一塊巨幅的毛玻璃裡，陰影在戶內延長復加深。然後涼涼的水意瀰漫在空間，風自每一個角落裡旋起，感覺得到，每一個屋頂上呼吸沉重都覆著灰雲。雨來了，最輕的敲打樂敲打這城市，蒼茫的屋頂，遠遠近近，一張張敲過去，古老的琴，那細細密密的節奏，單調裡自有一種柔婉與親切，滴滴點點滴滴，似幻似真，若孩時在搖籃裡，一曲耳熟的童謠搖搖欲睡，母親吟哦鼻音與喉音。或是在江南的澤國水鄉，一大筐綠油油的桑葉被嚙於千百頭蠶，細細瑣瑣屑屑，口器與口器咀咀嚼嚼。雨來了，雨來的時候瓦這麼說，一片瓦說千億片瓦說，說輕輕地奏吧沉沉地彈，徐徐地叩吧撻撻地打，間間歇歇敲一個雨季，即興演奏驚蟄到清明，在零落的墳上冷冷奏輓歌，一片瓦吟千億片瓦吟。"
