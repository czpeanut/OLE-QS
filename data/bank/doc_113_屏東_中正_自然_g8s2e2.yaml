  stem: 在歷史中，貝托萊到了埃及後，開始對當地進行考察，當他考察到開羅附近的湖泊時，湖邊的沉積物引起了他的好奇。經過貝托萊的研究後發現，湖水中的鹽類就是我們平常會碰到的氯化鈉(我們俗稱食鹽)，不過特別的是，湖邊的沉積物並不是食鹽的結晶，而是碳酸鈉(也就是我們俗稱的蘇打)，這時候貝托萊心想，碳酸鈉應當會反應產生碳酸鈣結晶才是，反應式如下：氯化鈣+碳酸鈉→碳酸鈣+食鹽，下列何者是碳酸鈉會存在的合理解釋？
