- id: doc_113_新北_福和_國文_g8s1e1_s3_6
  section: 3
  number: 6
  type: single
  page: 1
  stem: "（甲）虛擬的線上遊戲/就像是人生的道路/你永遠無法預料/會遭遇甚麼樣的\n        人/只要儲備實力/就不必畏懼未知的對手\n  （乙）成功必須仰賴團隊精神/眾人力道要一致/並遵守吆喝的節奏/個人若想\n\
    \        強出頭/力量因而分散/將會牽動隊友走向失敗\n  （丙）拇指和中指/要輕輕地捏住/食指在後面/要及時推出/出手要快/脫手要\n     \
    \   平穩而飛旋/進去的角度/要緊貼而切入/才能叫這片頑石/入水為魚/出\n        水為鳥\n  （丁）滿口袋嘩啦啦的/歡笑/從家裡一直響到/學校/從學校一直響到/媽祖廟\n\
    \        廣場/嘩啦嘩啦/沒有演布袋戲的日子/我們蹲著/彎起拇指/用力彈出/\n        一彈/童年就隨著時間/轟然飛出\n   永福國中的老師教授「趣味韻文」，隨意舉出上述四首新詩，請班上同學依序寫出正確答案。請問那一位同學寫對了？\
    \  【綜合理解】"
  options:
  - label: A
    content: 小瑤：電腦遊戲---打彈珠---打水漂---打紙牌
  - label: B
    content: 小威：打彈珠---打水漂---打紙牌---拔河
  - label: C
    content: 小潔：電腦遊戲---打水漂---打紙牌---躲避球
  - label: D
    content: 小怡：電腦遊戲---拔河---打水漂---打彈珠。
