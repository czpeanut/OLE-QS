    \  母親對土芭樂真是物盡其用，除了把果實變成美食外，每當我們拉肚子，母親就會摘土芭樂葉心跟鹽巴一起搗碎，讓我們吞下。或許窮苦孩子比較沒有生病的本錢，也或許是那味道恐怖極了，總之，只要吃個一、二回，拉肚子就會痊癒。還好，隨著醫療逐漸方便後，母親就不再使用這帖藥方，土芭樂葉心拌鹽巴的味道也漸漸被淡忘。\n\
    \  土芭樂並沒有為外公賺進什麼財富，但外公仍像對待自己孩子般細心呵護。只是隨著外公健康每況愈下，果樹也如風中殘燭般逐漸黯淡。後來大舅把土芭樂樹全部連根拔除，改種經濟價值較高的荔枝跟愛文芒果。當荔枝樹跟芒果樹成為果園新主角後，土芭樂就跟我們的童年一樣，只成為記憶角落的一幅風景。\n\
    \  當又脆又甜的泰國芭樂、珍珠芭樂等改良品種在市面上大受歡迎時，母親還是只愛吃土芭樂，不管到哪裡去，只要有看到土芭樂，都會買一包回家吃，甚至還會交代我們若有看到土芭樂要記得買。當時並沒有深究母親的心思，只認為或許是吃習慣罷了。直到母親過世，偶然開車路過嘉義一個鄉鎮，看到路旁一輛小發財車上寫著「正港臺灣土芭樂」，不禁停下車買了一包醃漬土芭樂，輕輕咬下一口，才猛然體會母親愛吃土芭樂的心情，原來土芭樂藏著母親對外公濃濃的思念，就如我咬下的每一口都是童年的記憶、成長的剪影，在脣齒間回甘的都是媽媽的味道。\n\
    —節選自李玲茹〈思念的滋味〉"
