- id: doc_113_新北_福和_國文_g8s1e1_s3_24
  section: 3
  number: 24
  type: single
  page: 3
  stem: 如果請你幫上述文章下標題，下列那一個選項最不適當？【課外閱讀】
  options:
  - label: A
    content: 如何善用你的基因
  - label: B
    content: 建立好習慣的壞處
  - label: C
    content: 了解自己全力以赴
  - label: D
    content: 成功並非只靠幸運。
  group_stem: '基因不會消除努力的必要，而是讓努力的方向變清楚。基因告訴我們要努力去做什麼。一旦明白自己的強項，我們就知道該把時間與精力投注於何處，知道要尋找那些機會、避開何種挑戰。愈了解自身天性，我們就能制訂愈好的策略。


    生物學上的差異很重要，但儘管如此，與其跟別人比較，不如把焦點放在你是否發揮了自身潛能還比較有生產力。你在任何特定能力上有著先天限制這個事實，與你是否將自身能力發揮到極限無關。人們太執著於自己「有極限」這件事，以致於很少真正盡力去接近那些極限。


    此外，若不付出努力，基因也無法讓你成功。沒錯，健身房裡那些肌肉線條明顯的教練擁有的基因可能比你好，但如果你沒有投入同等分量的訓練，不可能確定自己在基因上拿到的是比較好或比較差的牌。在付出跟你佩服的那些人同等的努力之前，不要把他們的成功歸因於幸運。

    摘錄自〈原子習慣〉'
