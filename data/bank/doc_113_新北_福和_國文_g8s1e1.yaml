  section: 3
  number: 7
  type: single
  page: 1
  stem: 〈慈烏夜啼〉：「慈烏失其母，啞啞吐哀音。晝夜不飛去，經年守故林。夜夜夜半啼，聞者為沾襟。聲中如告訴，未盡反哺心。」這段詩句所傳達的意旨，與下列何者最接近？    【第二課】
  options:
  - label: A
    content: 樹欲靜而風不止，子欲養而親不待
  - label: B
    content: 一失足成千古恨，再回頭是百年身
  - label: C
    content: 松柏後凋於歲寒，雞鳴不已於風雨
  - label: D
    content: 在天願做比翼鳥，在地願為連理枝
  lesson_raw:
