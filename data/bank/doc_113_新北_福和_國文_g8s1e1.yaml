  section: 3
  number: 4
  type: single
  page: 1
  stem: 〈庭中有奇樹〉：「馨香盈懷袖。路遠莫致之。」關於這段詩句的含義，下列何者正確？【第二課】
  options:
  - label: A
    content: 相聚的時光短暫，只能在離別前折花相贈，期盼下次的重逢
  - label: B
    content: 奇樹之花香滿溢，卻因相隔遙遠，無法送達，徒留滿懷無奈
  - label: C
    content: 奇樹之花高不可攀，難以親近，只能在遠處觀賞
  - label: D
    content: 滿懷的思念，如同奇花的馨香，能跨越距離鴻溝，無所不至。
