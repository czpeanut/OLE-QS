- id: doc_113_新北_福和_國文_g8s1e1_s3_10
  section: 3
  number: 10
  type: single
  page: 2
  stem: 「四兒日夜長，．．．．．．猶恐巢中飢」一段，是要描寫下列何者概念？【文意理解】
  options:
