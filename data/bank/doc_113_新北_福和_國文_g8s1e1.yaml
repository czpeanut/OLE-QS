  group_stem: '丁

    【台灣常識集 083 | #蔴芛湯】

    阿嬤的炎夏抗暑對策！台中限定的地區美食，你有沒有吃過呢？

    #極度限定 #做法獨特 #好吃


    | #這碗湯到底怎麼念呢？

    蔴芛，一般慣用台語發音（muâ-ínn-thng）

    為了方便溝通，產生麻笋、蔴蕙等寫法，

    更正確的台語標音寫法為「麻穎」，

    所以不需要唸成ㄇㄚˊ ㄨㄟˇ喔！

    本篇是參考官方台中市文化局與南屯麻芛文化館的用法

    至於到底怎麼讀——問問你台中的朋友或許最準！


    | #蔴芛湯的誕生與拚經濟有關？

    黃麻約在康熙年間引進台灣，

    但大量種植，是從日本時代開始。

    當時，日本人計畫大量出口稻米與糖回日本，

    然而糖有了，米也有了——

    但是裝糖跟米的麻布袋卻不夠了。

    怎麼辦呢？

    為了解決這個問題，政府在中部種植大量的黃麻，

    抽取黃麻纖維製成麻繩與麻布袋。

    然而，每當採收季一到，纖維被一車車載走，

    派不上用場的黃麻嫩葉卻被丟棄在地上。

    農民們覺得太可惜了，就想說：

    「不然煮來吃吃看好了？」

    結果，不吃還好，一吃驚為天人——的難吃

    因為麻葉實在是太苦啦！！！！！

    #被丟掉也不是沒有原因的

    然而性格倔強的台中人，怎能輕易認輸呢？

    經歷一番努力，發現去除葉脈後再用清水搓洗，

    就可以去除苦味！

    加上地瓜與魚乾煮成湯，不僅微苦爽口，

    更能在炎炎夏日裡帶走泰半暑氣喔！

    久而久之，食譜口耳相傳，

    就成了 #台中夏日限定 的湯品。

    不是台中人還真是很少聽過呢！


    清澈透綠的麻芛湯，冷熱都很爽口，

    淡淡苦味，更加凸顯地瓜與吻仔魚的鮮美。

    淋在白飯上據說是內行人的吃法？

    #如果有更棒的搭配歡迎留言告訴我們

    地區限定、時節也限定

    夏天到台中玩的話，找來品嚐看看吧！'
