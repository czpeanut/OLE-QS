- id: doc_113_新北_福和_國文_g8s1e1_s4_32
  section: 4
  number: 32
  type: single
  page: 5
  stem: 根據上文，下列何者不是土芭樂對作者的意義？
  options:
  - label: A
    content: 代表著家鄉
  - label: B
    content: 勾起童年回憶
  - label: C
    content: 象徵著經濟富裕
  - label: D
    content: 連結著親情
  group_stem: "丙\n  在關渡自然公園裡，看到數棵土芭樂樹排列在休閒步道旁，不禁有著他鄉遇故知的欣喜。那茂密的樹葉隨風飄動，依然閃著自然、純樸的青綠，外表不起眼的果實沐浴在陽光下，仍散發著熟悉的香氣。是的，不管歲月如何流轉，滄海如何變桑田，土芭樂還是刻滿童年的記憶、成長的痕跡，藏著濃濃的思念……。\n\
    \  小時候，全家借住在外公果園旁的茅草屋。外公的果園裡種滿了土芭樂，那一大片土芭樂樹是我們兄弟姐妹的乘涼好所在、玩捉迷藏的最佳藏身處。成熟的土芭樂是我們的免費零食，然而整顆果實往往只有被太陽照到的那一邊才比較脆甜，其他部分盡是粗澀感，籽又特別多，因此，我們常常只咬數口就丟棄在地。沒有玩具，我們就摘些未成熟的土芭樂當成棒球打、彈珠玩，或撿拾掉在地上熟爛的果實當飛天炮彈互丟。外公是個相當節儉、惜物的人，只要被他看到我們隨意丟棄土芭樂，或把它們當成玩具，一定會拿著細竹條追著我們打。此時，頑皮孩子的嘻笑聲、尖叫聲，伴隨著外公的怒罵聲就會迴盪在田園。往後，每當回首來時路，總會發現在這段童年歲月裡，物質雖貧乏，卻留下最美麗的成長痕跡。\n\
    \  土芭樂在外公細心照顧加上南投好山好水的滋養下，長得特別快、特別多。但在五○年代，土芭樂是沒什麼經濟價值的水果，因為無論是野生或自家栽種的，幾乎隨處可見，隨手可得。所以外公的土芭樂並不能賣到好價錢，有時要送給別人吃，都很少有人要。還好母親有一雙巧手，總能把一顆顆的土芭樂變成人間極品，讓我們兄弟姐妹時常能享受幸福的「土芭樂饗宴」。\n\
    \  母親會把土芭樂洗乾淨、晾乾、去掉頭尾後，與白糖一起放入甕裡，釀成土芭樂酒。為了怕我們這些小鬼「下手」，母親總會把甕口一層層封住，並一再告誡「不可以偷開」。但隨著時間的逝去，那藏不住的香氣仍誘惑我們「犯規」。當別人喝著津津蘆筍汁、黑松汽水時，這些甜甜帶有濃郁水果酒香的土芭樂酒，就是我們喝不膩的上等果汁，也是成長離家後常在夢裡飄香的鄉愁。\n\
    \  母親對土芭樂真是物盡其用，除了把果實變成美食外，每當我們拉肚子，母親就會摘土芭樂葉心跟鹽巴一起搗碎，讓我們吞下。或許窮苦孩子比較沒有生病的本錢，也或許是那味道恐怖極了，總之，只要吃個一、二回，拉肚子就會痊癒。還好，隨著醫療逐漸方便後，母親就不再使用這帖藥方，土芭樂葉心拌鹽巴的味道也漸漸被淡忘。\n\
    \  土芭樂並沒有為外公賺進什麼財富，但外公仍像對待自己孩子般細心呵護。只是隨著外公健康每況愈下，果樹也如風中殘燭般逐漸黯淡。後來大舅把土芭樂樹全部連根拔除，改種經濟價值較高的荔枝跟愛文芒果。當荔枝樹跟芒果樹成為果園新主角後，土芭樂就跟我們的童年一樣，只成為記憶角落的一幅風景。\n\
    \  當又脆又甜的泰國芭樂、珍珠芭樂等改良品種在市面上大受歡迎時，母親還是只愛吃土芭樂，不管到哪裡去，只要有看到土芭樂，都會買一包回家吃，甚至還會交代我們若有看到土芭樂要記得買。當時並沒有深究母親的心思，只認為或許是吃習慣罷了。直到母親過世，偶然開車路過嘉義一個鄉鎮，看到路旁一輛小發財車上寫著「正港臺灣土芭樂」，不禁停下車買了一包醃漬土芭樂，輕輕咬下一口，才猛然體會母親愛吃土芭樂的心情，原來土芭樂藏著母親對外公濃濃的思念，就如我咬下的每一口都是童年的記憶、成長的剪影，在脣齒間回甘的都是媽媽的味道。\n\
    —節選自李玲茹〈思念的滋味〉"
