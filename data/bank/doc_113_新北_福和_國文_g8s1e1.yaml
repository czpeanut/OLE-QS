  stem: 作者在文中多次提及「童年」，並將土芭樂與童年記憶緊密連結。除了直接的描述，作者還透過哪些手法來營造出濃濃的懷舊氛圍？請仔細分析文中的敘述方式，並選出最符合的選項：
  options:
