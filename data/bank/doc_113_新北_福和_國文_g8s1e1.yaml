  group_stem: '荀巨伯遠看友人疾，值胡賊攻郡。友人語巨伯曰：「吾今死矣，子可去！」巨伯曰：「遠來相視，子令吾去，敗義以求生，豈荀巨伯所行邪？」賊既至，謂巨伯曰：「大軍至，一郡盡空，汝何男子，而敢獨止？」巨伯曰：「友人有疾，不忍委之，寧以我身代友人命！」賊相謂曰：「我輩無義之人，而入有義之國！」遂班軍而還，一郡並獲全。

    〈世說新語，德行〉'
