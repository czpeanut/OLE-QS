- id: doc_113_高雄_左營_自然_g7s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '已知塑膠微粒是塑膠分解後形成的極小塑膠片段，難以被生物代謝。附表為某地區食物鏈中甲、乙、丙、丁四種生物體內含有的塑膠微粒濃度。已知其中一種生物為生產者，根據上述，下列推論何者正確？

    | 生物種類 | 甲 | 乙 | 丙 | 丁 |

    | --- | --- | --- | --- | --- |

    | 生物體內塑膠微粒的含量(ppm) | 3.0 | 0.3 | 30 | 0.05 |'
