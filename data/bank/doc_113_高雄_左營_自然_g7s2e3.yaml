    content: 黑鮪魚在海中的天敵(鯊魚)數量大量增加。
  group_stem: '<黑鮪魚的悲歌>

    黑鮪魚，又被稱為「海中黑金」，是世界上最珍貴的經濟魚種之一。牠的肉質鮮美，特別是腹部的油脂部位，被認為是壽司中最頂級的食材。在日本，每年新年開市時，拍賣市場常會出現天價的黑鮪魚，曾有一條售出高達數千萬日圓。然而，這種高經濟價值卻也成為黑鮪魚悲劇的開端。近幾十年來，由於市場需求暴增，漁民為了利益，過度捕撈黑鮪魚。特別是東大西洋與地中海區域，過度捕撈已導致黑鮪魚數量急遽下降。根據國際自然保護聯盟（IUCN）的資料，黑鮪魚曾一度被列為瀕危物種。年幼的黑鮪魚還沒來得及長大繁殖就被捕撈，讓整體族群無法自然恢復。黑鮪魚的數量減少也引發生態系中食物鏈的問題。作為海洋中的頂級掠食者之一，黑鮪魚能控制小型魚類的數量，保持海洋生態的平衡。若牠們大量消失，將可能造成某些小型魚類數量暴增，間接破壞其他生物的棲息環境。因此，國際社會開始重視保育行動。例如，國際海洋保育組織（ICCAT）實施漁獲配額制度，限制每年可捕撈的黑鮪魚數量；部分國家也制定了禁捕季，保護黑鮪魚在繁殖季節能順利生育。雖然保育行動已有初步成果，部分區域的黑鮪魚族群略有回升，但仍需全球合作與長期努力，才能真正避免這一珍貴物種從海洋中消失。'
