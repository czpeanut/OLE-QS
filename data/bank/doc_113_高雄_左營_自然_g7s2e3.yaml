- id: doc_113_高雄_左營_自然_g7s2e3_s2_38
  section: 2
  number: 38
  type: single
  page: 4
  stem: 根據文章內容，試問下列哪一項是海洋塑膠微粒的主要來源？
  options:
  - label: A
    content: 燒烤產生的煙霧
  - label: B
    content: 丟棄至海洋中的一次性塑膠製品
  - label: C
    content: 使用天然洗劑產生的泡沫
  - label: D
    content: 水果中的天然纖維。
  group_stem: '<海洋塑膠濃湯>

    在你去海邊玩耍時，有沒有發現沙灘上總有一些垃圾？從寶特瓶、塑膠袋到吸管與食物包裝，這些看似不起眼的垃圾，其實構成了地球嚴重的環境問題。根據聯合國環境署的調查，全球每年約有1100
    萬噸塑膠垃圾流入海洋，等於每分鐘就有一卡車的塑膠倒進海中。這些垃圾大部分來自陸地，透過河川與風力進入海洋。由於塑膠不易分解，會長期留存在環境中，對生態系統造成極大威脅。許多海洋生物會誤食塑膠垃圾。例如，海龜會把漂浮的塑膠袋誤認為水母吞下，導致腸道阻塞甚至死亡。海鳥也常因誤食塑膠碎片而無法進食真正的食物，最終餓死。此外，廢棄漁網若在海中漂浮，還會纏住魚類與哺乳動物，形成所謂「幽靈漁具」問題。海洋廢棄物除了生態層面的危害，也會影響人類的生活與經濟活動。被污染的海灘不但破壞觀光形象，也需要大量資源清理；而漁民若在捕魚時被垃圾纏住，則可能損壞漁具或延誤作業，造成經濟損失。此外，這些被我們丟棄的塑膠垃圾，最後可能會分解成肉眼幾乎看不見的微小碎片──就是所謂的「塑膠微粒」。當微粒進入水中，牠們可能被浮游生物或貝類吞下。由於這些生物是食物鏈的底層，一旦塑膠微粒進入牠們體內，就可能一路往上傳遞，最後甚至進入人類的餐桌。這種現象稱為「生物累積」。

    目前有科學家在遠離人類活動的深海與冰層中發現塑膠微粒，顯示這種污染無所不在。更令人擔憂的是，塑膠不只是物理性污染物，還可能釋放有害化學物質，干擾動物荷爾蒙、影響繁殖，甚至使整個物種族群面臨減少的風險。隨著塑膠污染問題日益嚴重，國際社會開始尋求更具約束力的解決方式。2022
    年，聯合國環境大會通過了一項重要決議，決定展開制定「全球塑膠公約」的談判，目標是在2025 年前完成全球首部針對塑膠污染的國際法律文件。這項即將制定的塑膠公約，將要求參與國家針對塑膠製品的全生命週期進行管控，也就是從設計、生產、使用到廢棄與回收的每個階段都要納入考量。這與以往只針對垃圾清理的方式不同，它更強調源頭減量與制度管理。為了對抗這些問題，許多國家與社區開始展開行動。有的限制一次性塑膠製品的使用，有的推廣環保餐具與自備購物袋。許多學校與志工團體也定期舉辦淨灘活動，讓學生與民眾親自感受塑膠污染的嚴重性。'
