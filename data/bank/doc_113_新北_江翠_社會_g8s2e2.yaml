  group_stem: 民國17 年，北伐軍正在挺進北京、天津等地，當時統治北京政府的軍閥張作霖見大勢已去，於6 月3日搭乘鐵路專車，返回他的老地盤—中國東北地區。4
    日清晨，專車就要抵達瀋陽，卻在行經皇姑屯時，遭到日軍預埋的炸藥襲擊，車廂被炸得慘不忍睹，張作霖傷重不治。這場「皇姑屯事件」讓張家長子張學良繼承父業，繼續經營東北，並宣布服從國民政府。民國20
    年，日軍製造九一八事變後，不但占領整個東北，還成立滿洲國，張學良和他的東北軍因此再也回不去老家。他因無法忘懷這一件件的國仇家恨，最後發動了震驚中外的西安事變。
