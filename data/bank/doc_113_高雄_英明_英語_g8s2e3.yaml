    content: ① → ③ → ② → ④
  group_stem: 'Aromatherapy is a way to help people feel better by using scents from
    natural plant oils. These oils come from flowers, leaves, or trees. Some commonly
    used oils include lavender, peppermint, and eucalyptus.


    When people smell these scents, the molecules travel through the nose to the brain.
    This can help relax the body or make people feel more awake. For example, after
    a long, tiring day at work, some people feel sleepy or slow. Smelling peppermint
    oil can help them feel alert, so they can focus again. Peppermint is also used
    to reduce headaches.


    Another example is lavender. Its soft scent helps people feel calm, reduce stress,
    and fall asleep more easily. Another commonly used oil is eucalyptus oil. It is
    often used when people have a cold. Its fresh, sharp smell can help clear a stuffy
    nose and make breathing easier.


    There are several ways people use essential oils in daily life. Some people put
    a few drops of oil into hot water and breathe in the steam. Others use oil in
    a diffuser to spread the smell in a room. Some even use oil in massage.


    However, aromatherapy doesn’t work for everyone. Scientists are still studying
    how aromatherapy works and how strong its effects really are.


     aromatherapy 芳香療法 scent 氣味 include 包含 lavender 薰衣草 peppermint 薄荷 eucalyptus
