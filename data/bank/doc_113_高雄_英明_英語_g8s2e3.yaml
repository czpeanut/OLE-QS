- id: doc_113_高雄_英明_英語_g8s2e3_s3_49
  section: 3
  number: 49
  type: single
  page: 7
  stem: Why is it important to break gender stereotypes?
  options:
  - label: A
    content: Because they make boys stronger and girls kinder.
  - label: B
    content: Because they are always true for boys and girls.
  - label: C
    content: Because they make people like pink and blue.
  - label: D
    content: Because they stop people from trying new things.
  group_stem: 'Understanding Gender Stereotypes

    What are Gender Stereotypes?

    Gender stereotypes are ideas about how boys and girls should act because of their
    gender. These ideas are not always true and can stop people from doing what they
    like or believe in themselves.

    Common Stereotypes

    ★ Boys are tough; girls are gentle: This means boys should be strong and not show
    feelings, while girls should be kind and soft. However, both boys and girls can
    be strong and kind.

    ★ Boys are better at math and science; on the other hand, girls are better at
    reading and art: This is not true. Everyone can be good at any subject if they
    work hard and like it.

    ★ Girls should like pink; boys should like blue. People can like any color they
    want, no matter what their gender is.

    Why Do Stereotypes Matter?

    Stereotypes can be bad because they give wrong ideas and stop people from trying
    new things. For example, a girl might not play sports because she thinks it''s
    only for boys. A boy might not want to be a nurse because some people say that
    is a job for girls.

    How to Break Stereotypes?

    We should stop believing these wrong ideas. Everyone should do what they like
    and are good at. Here are some ways to break stereotypes:

    ★Let boys and girls try all kinds of activities, like sports, arts, and sciences.

    ★Respect people who break these stereotypes, like female scientists or male nurses.

    ★Speak up when you hear someone say something that supports stereotypes. Remember,
    everyone is different and should be free to be themselves.  tough 堅強的 gentle
    溫柔的'
