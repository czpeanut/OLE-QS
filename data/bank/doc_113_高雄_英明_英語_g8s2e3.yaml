  stem: What does the word “showcase” in the conversation mean?
  options:
  - label: A
    content: To show something proudly in front of people.
  - label: B
    content: To do something secretly(祕密地).
  - label: C
    content: To wear special clothes to feel comfortable.
  - label: D
    content: To move around quickly.
  group_stem: 'Kiki: Who is the person in the picture? Why is she wearing such a bright
    dress and so much makeup?

    May: That’s Nymphia Wind, a famous drag queen from Taiwan.

    Kiki: Drag queen? What does that mean?

    May: A drag queen is a man who dresses up in beautiful clothes and makeup to showcase
    his talent on stage.

    Kiki: Oh, I see. So, does Nymphia like to dress like this all the time?

    May: No, not all the time. She usually wears regular clothes in her daily life.

    But when she performs, she likes to show her style and creativity.

    Kiki: Wow, that’s cool! It must be hard to be different and stand out like that.

    May: Yes, but she wants to tell people it’s okay to be different and to show your
    true colors. She says everyone should be proud of who they are!

    Kiki: I like that. We should all show our true colors!


     makeup 化妝  drag queen 變裝皇后  creativity 創意  be proud of 感到驕傲'
