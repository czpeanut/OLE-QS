  group_stem: 'Bacteria and viruses are very small, so people can hardly see them.
    Because they are so small and can make people sick, many people are scared of
    them. However, bacteria and viruses are actually very different. Here are some
    facts about them:

    1. Bacteria or viruses can spread from one person to another by touching or shaking
    hands. If we touch food with dirty hands, bacteria and viruses can also enter
    our body. However, not all bacteria are bad. Some bacteria are good for people,
    plants, and animals. Viruses, however, always need to live inside another living
    thing (host), and they make the host sick.

    2. Bacteria are much bigger than viruses.

    Viruses are usually 10 to 100 times smaller than bacteria.

    The biggest virus is only as big as the smallest bacteria.

    3. Bacteria come in many shapes: they can be round, like rods, or like a comma.

    Viruses also have different shapes: they can be like tiny balls, long like spaghetti,
    or hard rods.

    4. Bacteria can live almost anywhere, inside or outside other cells. They can
    live alone in hot or cold places. But viruses can only live inside host cells
    and use them to make more viruses.


