  group_stem: "去年，我有幸和教宗參與一場會議，他很關注科技發展的潛在風險和道德問題。他以深層的思考看待科技：科技的力量從未如現在這般龐大，但無人能確保科技會被合理明智地使用。今日科技已滲透我們的生活，改善我們的生活，但也存在隱憂。它對安全隱私和社交活動的威脅將不利於社會發展。科技可以帶來便利，但也可能影響我們的價值、尊嚴和信念。我不擔心人工智慧讓電腦像人類一樣思考，我擔憂的是人類像電腦那樣思考——（\
    \ ）。\n 當科技在黑暗中摸索時，人性的光輝讓我們看清自己的處境與面臨的危險。史蒂夫．賈伯斯曾說過，光有科技是不夠的，科技要與人文、人性結合，才能產生令人欣喜的結果。當你真的投入，你會發現所做的事情可能改變社會。這意味著，智慧型手機可讓盲人參加馬拉松比賽，智慧型手錶可以在患者心臟病發作前捕捉到異常情況，平板電腦可幫助自閉症兒童重新建立與世界的聯繫。\n\
    \ 〈改寫自提姆•庫克 麻省理工學院 2017 年畢業典禮演講〉"
