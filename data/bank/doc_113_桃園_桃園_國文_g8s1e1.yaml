  group_stem: '| 國 家 | 旅 遊 規 矩 與 禁 忌 |

    | --- | --- |

    | 英 國 | ★比「V」手勢時，手掌不可向內，那含有挑釁、侮辱的意思。<br>★不送人百合花，因為意味著死亡。 |

    | 日 本 | ★與日本人交談切忌用手抓頭，這意味著「不滿」。<br>★浴衣與和服的穿法是左上右下，右上左下是過世者的穿法。<br>★需要服務生時，只要把手臂向上伸，手掌向下，擺動手指，不用付小費。<br>★電車上要求安靜、禁止交談。有些電車是屬「女性專用車輛」，男性勿上車。
