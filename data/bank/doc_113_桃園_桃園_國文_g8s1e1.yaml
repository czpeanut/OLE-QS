  stem: 林爺爺退休後，計畫去環遊世界，和晚輩閒談之際，得知各國的旅遊禁忌，下列何人的說法比較正確？
  options:
  - label: A
    content: 大兒子：尼泊爾人點頭是代表同意
  - label: B
