  group_stem: "Count Your Blessings\n     Cathy used to think she was the happiest\
    \ girl in the world when her father was doing business successfully. Her family\
    \ lived in a big house. She always had beautiful clothes to wear and delicious\
    \ food to eat. Every winter and summer vacation, her parents would take her for\
    \ a trip abroad.\n   However, when Cathy was in the first year of junior high\
    \ school, everything changed. His father’s business lost a lot of money. The family\
    \ sold the house and moved into a small apartment. With no more good food or clothes,\
    \ Cathy always missed the good old days.\n   One day, Cathy’s best friend invited\
    \ her to her birthday party, Cathy wanted to go, but she knew she didn’t have\
    \ good shoes to wear. After she got home, she told her mother about her worry.\
    \ Her mother showed her a picture in the newspaper. In the picture were some smiling\
    \ children with no shoes on their feet. They were children in a very poor country.\n\
    \   Seeing their bright smiles, Cathy thought to herself, “If they can be so happy\
    \ without shoes, why can’t I, still with some shoes, be happier than they?” She\
