  options:
  - label: A
    content: Love Makes a Change
  - label: B
    content: A Hard Life
  - label: C
    content: Home, My Sweet Home
  - label: D
    content: A Kind Old Man
  group_stem: 'A Poem

    It’s Saturday again.

    Another day of joy!

    Getting out of bed early

    And waiting happily for those boys,

    Josh keeps telling himself how lucky he is,

    Just like a kid getting a new toy.


    A man with no wife and kids,

    Josh lives on his own.

    At the age of 80,

    Friends are all gone.

    He felt like living in an ice home.


    Things changed when he answered the door one cold day.

    He saw sunny smiles on four boys’ faces.

    One of them asked if they could visit him

    Every Saturday in his place.

    Josh didn’t know them but nodded his head quickly,

    Thanking them for their grace.


    Now Josh finds himself happier than ever.

    The boys not only come to see him but bring him soup.

    When they ask him whether the soup is OK,

    His only answer is that it’s really good.

    The Saturday soup warms both his stomach and heart.

    The young friends help him stay in a good mood.


    📖 poem 詩 nod 點頭

    grace 恩惠 mood 心情'
