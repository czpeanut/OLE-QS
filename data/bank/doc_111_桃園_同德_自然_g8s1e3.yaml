  - label: A
    content: 甲：傳導；乙：輻射；丙：輻射
  - label: B
    content: 甲：對流；乙：傳導；丙：傳導
  - label: C
    content: 甲：輻射；乙：傳導；丙：傳導
  - label: D
    content: 甲：對流；乙：輻射；丙：傳導。
  group_stem: 'I. 你有吃過窯烤披薩嗎？窯烤披薩是以磚窯烤製而成，雖然比起一般烤箱製作的披薩更需要廚師的技術，但完成的披薩多了木材的薰香味，食材溼潤柔軟，餅皮也更酥脆耐嚼，究竟磚窯有什麼特別之處？

    傳統的窯烤披薩是用柴火當作熱源，在磚窯內將木柴點燃後，要保持煙囪及磚窯口的通風，以利煙霧排出。磚窯內部會不斷吸收柴火燃燒放出的熱能，待溫度足夠後將披薩放入窯內，柴火和儲存在磚窯內壁裡的熱就會開始加熱披薩了。除此之外，由於磚窯底部會直接接觸到披薩的緣故，如此一來便可以創造出餅皮酥脆的口感喔（圖一）！

    磚窯特殊的環繞結構讓熱可以從四面八方傳給披薩，所以只需要幾分鐘的時間，好吃美味的窯烤披薩就可以出爐，不像一般的電烤箱花費的時間較長，因此食材較能夠留住水分，讓披薩吃起來更加可口！

