  section: 2
  number: 37
  type: single
  page: 8
  stem: 甲：煙囪及磚窯口要保持通風，讓煙霧排出；乙：柴火與儲存在磚窯內壁裡的熱加熱披薩；丙：高溫的磚窯底部可創造酥脆餅皮。上述磚窯加熱披薩的過程主要對應到哪一種熱傳播方式？
