- id: doc_111_桃園_同德_自然_g8s1e3_s2_39
  section: 2
  number: 39
  type: single
  page: 8
  stem: 下表為一般木構造建築物自火災起火燃燒後，時間與溫度之變化所連成之溫度曲線，請問鑽石可能在哪個階段將燃燒成二氧化碳？
  options:
  - label: A
    content: AB 階段
  - label: B
    content: GH 階段
  - label: C
    content: BC 階段
  - label: D
    content: DE 階段。
  group_stem: 'II. 許多存在於自然界的元素，不是只有單一型態，而是具有多樣的組成樣貌，例如：碳元素可組成鑽石、石墨、$\text{C}_{60}$以及奈米碳管。雖然彼此間的型態不同，但是組成物質都是相同元素，因此科學上稱之為同素異形體。

    天然鑽石來自於金剛石礦物，是自然界中已知硬度最大的物質，可以用來製造鑽探用的探頭和磨削工具。它在空氣中燃點約為850～1000℃。現代工業可在高溫高壓下生產金剛石，稱為合成金剛石。石墨具有層狀的平面結構，因其具有導電性，故可做為導電材料。天然石墨很容易互相剝離，形成薄薄的石墨片。若把石墨片剝離到只有一個碳原子厚度的單層，即可獲得奈米級導電材質石墨烯。$\text{C}_{60}$由六十個碳原子所組成，具有由20
    個六角形和12 個五角形所圍成的球狀結構，外形與足球相似，俗稱巴克球。奈米碳管是一種管狀的碳分子，由於處於奈米尺度內，幾萬根奈米碳管併起來也只有一根頭髮絲寬。研究發現奈米碳管未來在微機電、生物科技、醫療及電子等領域的應用極具潛力。

