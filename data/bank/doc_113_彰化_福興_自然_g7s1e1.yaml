  type: single
  page: 1
  stem: '阿賢在某份報告上看到一張實驗紀錄表，內容如附表所示。此表包含五組實驗，且報告上指出可能影響實驗結果的因素只有變因一與變因二，則利用此表，作出下列哪一個判斷最合理？

    | 實驗組別 | 一 | 二 | 三 | 四 | 五 |

    | :--- | :---: | :---: | :---: | :---: | :---: |

    | 變因一 | 10 g | 20 g | 30 g | 40 g | 50 g |

    | 變因二 | 2 g | 2 g | 2 g | 2 g | 2 g |

    | 實驗結果 | 10 g | 20 g | 30 g | 40 g | 50 g |'
  options:
  - label: A
    content: 變因一與實驗結果無關，變因二與實驗結果無關
  - label: B
    content: 變因一與實驗結果無關，變因二無法判定與實驗結果的關係
  - label: C
    content: 變因一與實驗結果成正比，變因二與實驗結果無關
  - label: D
    content: 變因一與實驗結果成正比，變因二無法判定與實驗結果的關係
