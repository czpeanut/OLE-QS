  stem: What is the reading about?
  options:
  - label: A
    content: The I PROMISE School is only for basketball players.
  - label: B
    content: LeBron James’ family helped him to be a great basketball player.
  - label: C
    content: LeBron James gives free food and bikes to all children in Akron.
  - label: D
    content: LeBron James opened a school to help children who have a hard time learning.
  group_stem: 'III.

    LeBron James and His School

    LeBron James is a great basketball player. He was born in Akron, Ohio. In 2018,
    he opened a special school in his hometown. The school is called the I PROMISE
    School.

    This school is for kids who have trouble learning. LeBron opened the school because
    he also had problems as a student. When he was young, he missed many days of school
    because his family moved a lot. It was hard for him to learn. But with the help
    from teachers, he became successful.

    LeBron wanted to help other kids who have the same problems. At the I PROMISE
    School, students get free uniforms, free food, and even free bikes. LeBron also
    helps the students’ families by giving them support and job training.

    LeBron thinks that helping kids and their families will make his hometown a good
    place. He hopes every child to have a good future.


    📖 hometown 家鄉 called 稱呼為 because 因為 miss 錯過 move 搬家

    successful 成功的 same 相同的 problem 困擾 uniform 制服

    support 支持 job training 職訓'
