  group_stem: 'IV.

    Shiba Inu

    Shiba Inu is a small dog from Japan. It has thick fur, pointy ears, and a curly
    tail. Shiba Inus come in colors like red, black, and white.

    Shiba Inus are active and love to play. They are smart and can learn things quickly.
    But they are also very independent. Sometimes they do not listen to their owners,
    which makes them hard to train.

    These dogs need exercise every day to stay happy and healthy. They also clean
    themselves like cats. Many people like Shiba Inus because they look cute and funny.
    You can see them in many Internet pictures and videos.

    Shiba Inus are small but brave. They protect their families and are always there
    for them. If you want a smart and active pet, a Shiba Inu is a good choice.


