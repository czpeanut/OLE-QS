    (丙) 若六位數 $65\square873$ 是 9 的倍數，$\square$ 應填 7。

    (丁) 1 的相反數等於 1 的倒數。

    (戊) 如果兩個整數「互質」，則這兩個整數的最小公倍數必為 1。'
