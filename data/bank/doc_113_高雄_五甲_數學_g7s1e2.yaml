  type: single
  page: 1
  stem: '阿蜜與阿篁在討論一道分數比大小的題目，請根據兩人的敘述判斷誰的說法正確？

    題目：$a = -\frac{5}{3}$，$b = -\frac{7}{5}$，$c = -\frac{17}{15}$；請比較 $a, b, a$ 的大小。

    阿蜜：第一步，先比較 $\frac{5}{3}, \frac{7}{5}, \frac{17}{15}$ 的大小

    第二步，因為 $[3, 5, 15] = 15$，所以 $\frac{5}{3} = \frac{25}{15}, \frac{7}{5} = \frac{21}{15}$，因此
    $\frac{25}{15} > \frac{21}{15} > \frac{17}{15}$，即 $a > b > c$

    阿篁：$a = -1\frac{2}{3}$，$b = -1\frac{2}{5}$，$c = -1\frac{2}{15}$，分子都是 2，分母越大則分數越小，因此
    $a > b > c$'
  options:
  - label: A
    content: 只有阿蜜是對的
  - label: B
    content: 只有阿篁是對的
  - label: C
    content: 兩人都是對的
  - label: D
    content: 兩人都不對
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
