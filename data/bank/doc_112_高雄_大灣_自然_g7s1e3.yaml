    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
  group_stem: "◎新冠肺炎後遺症－肺部纖維化\n  被新冠肺炎病毒(COVID-19)所感染的人體，即使與病魔搏鬥後成功康復仍會留下一些後遺症，在康復的病例當中，醫生觀察到部分病例發生了肺部纖維化。肺部纖維化是因為當病人的免疫細胞與新冠肺炎病毒搏鬥時，難免會傷到一些自身的細胞，所以當好不容易清除了病原後，肺部也受到了一定的損傷。而肺部利用纖維細絲來修補受損的部分，儘管修補了受損的區域，纖維細絲也會堆積在肺泡內。纖維細絲的堆積使得肺泡變硬失去彈性，因此失去換氣功能，患者肺部最後會變得像菜瓜布一般粗糙，不再有彈性。\n\
    \  堅韌的纖維組織會阻礙氣體交換，使身體難以獲得氧氣，也無法排除二氧化碳，讓肺部失去功能：患者的呼吸深度可能會每年下降200 mL。如果患者出現肺部纖維化，會有呼吸困難、慢性咳嗽與倦怠感等症狀，同時肺部纖維化在成人是較難恢復的。請根據以上文章，回答下列39~40\
    \ 題："
