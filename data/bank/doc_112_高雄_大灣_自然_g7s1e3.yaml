  type: single
  page: 4
  stem: 關於普林與尿酸的相關敘述，何者正確？
  options:
  - label: A
    content: 植物細胞不含普林
  - label: B
    content: 尿酸只由腎臟排泄
  - label: C
    content: 人體只產生尿素，不產生尿酸
  - label: D
    content: 尿酸可經由大腸排出。
  group_stem: ◎普林（又稱為嘌呤）是普遍存於動植物細胞中，遺傳物質的組成成分之一。人體分解胺基酸、核酸或代謝含普林或核蛋白食物會形成尿酸。正常人每天約產生750
    mg，其中約500 mg 由腎臟排泄，其餘經膽汁由大腸排出體外。如果體內產生過多或排泄尿酸不良，血漿中的尿酸會偏高，甚至導致痛風（尿酸鈉鹽堆積，造成關節腫脹極度疼痛）。最新研究發現普林含量並不是痛風的關鍵風險因子，而是食物「種類」。例如豆製品與蕈菇雖為高普林物質，但並非致病因子，啤酒、海鮮、內臟類食物則有明顯影響，含糖飲料雖然低普林，卻與痛風呈現正相關。試回答下列37~38
