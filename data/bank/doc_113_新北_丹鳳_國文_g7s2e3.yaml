- id: doc_113_新北_丹鳳_國文_g7s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: '(甲)修詩書／作春秋，含笑，栽植／那七十二株等待茂盛的杏樹

    (乙)英傑那堪屈下僚，便栽門柳事蕭條。鳳凰不共雞爭食，莫怪先生懶折腰

    (丙)杜陵有布衣，老大意轉拙。許身一何愚，竊比稷與契

    (丁)姊妹兄弟皆列土，可憐光彩生門戶。遂令天下父母心，不重生男重生女。

    以上詩句所歌詠的人物依序為下列何者？'
  options:
  - label: A
    content: 孔明／陶淵明／杜甫／楊貴妃
  - label: B
    content: 孔明／韓信／杜牧／王昭君
  - label: C
    content: 孔子／陶淵明／杜甫／楊貴妃
  - label: D
    content: 孔子／韓信／杜牧／王昭君。
