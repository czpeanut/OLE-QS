  type: single
  page: 4
  stem: '根據本文，關於清末民初雞蛋與鴨蛋的比較，下列表格中的敘述何者正確？


    | 項目 | 雞蛋 | 鴨蛋 |

    | :--- | :--- | :--- |

    | (A) 地位 | 餐桌常見料理 | 人民營養來源 |

    | (B) 特性 | 殼薄，容易保存 | 殼厚，適合加工 |

    | (C) 商品 | 乾心松花 | 溏心松花 |

    | (D) 市場 | 交易較冷清 | 交易較熱絡 |'
  options:
  - label: A
    content: 地位：雞蛋（餐桌常見料理）／鴨蛋（人民營養來源）
  - label: B
    content: 特性：雞蛋（殼薄，容易保存）／鴨蛋（殼厚，適合加工）
  - label: C
    content: 商品：雞蛋（乾心松花）／鴨蛋（溏心松花）
  - label: D
    content: 市場：雞蛋（交易較冷清）／鴨蛋（交易較熱絡）
  group_stem: "（二）\n    在二十一世紀的今日，「雞蛋」已成為不可或缺的食物，更是「營養」的代名詞。然而，如果我們回到清末民初的中國，端上桌來的通常會是「鴨蛋」料理。一九三○年間，雞一年產蛋不到百顆，而鴨養得好的話，每年的產蛋量高達二百多顆。雞蛋的體積小、殼薄、易碎、不易保存；而鴨蛋的體積大、殼厚，可以做出比較多料理，也適合加工製成鹹蛋、皮蛋長期保存。\n\
    \    事實上，養雞鴨的最初目的是為了吃肉，而蛋則因為節日、奉神、驅邪、解毒等民俗需求而被賦予特殊意義。一直到清代以後，由於人工孵化技術的成熟，讓農人可以大批養殖雞鴨，再加上鴨蛋加工技術的進步，蛋才逐漸成為可獨立販售的商品。當中同時受到華南與華北歡迎的加工蛋品，非「皮蛋」莫屬！\n\
    \    皮蛋於明 崇禎年間見諸文獻，最初稱作「牛皮鴨子」，多由農家自行製作，清代以後才由作坊量產，銷往城鎮。據說皮蛋剛從南方傳入北京時，北方人不喜歡其又乾又澀的口感，於是透過阻斷鴨蛋熟成的技術，改良出外表凝固、中心軟嫩的「溏心松花」皮蛋。「溏心松花」大受北方人歡迎，反倒笑稱南方的皮蛋為「乾心／死心松花」。\n\
    \    鴨蛋的興起也有賴輪船航運的開通，一八六○年代從上海到漢口的輪船通商開放，只需二至三天便可往返兩地，讓漢口成為名副其實的九省通衢、中國內陸重要的農產品集散地。\n\
    \    當時流傳著一句諺語「鴨蛋客管飯吃，雞蛋客乾著急」，說明鴨蛋交易市場的火熱程度，可以讓賣鴨蛋的商人先領錢，還包吃包住。根據一九二八年福州府的統計，每月的銷蛋量高達一百四十萬顆，當中有70%是鴨蛋，僅有30%是雞蛋。\n\
    （改寫自研之有物 你今天吃蛋了嗎？）"
