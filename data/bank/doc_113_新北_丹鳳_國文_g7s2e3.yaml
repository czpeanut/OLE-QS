  - label: C
    content: 為自己坎坷飄零的身世感到悲傷
  - label: D
    content: 悔恨當時自己不該自殺結束生命。
  group_stem: "（四）\n    杭州北關門外有一屋，鬼屢見①，人不敢居，扃鎖②甚固。書生蔡姓者將買其宅。人危之，蔡不聽。券③成，家人不肯入。蔡親自啟屋，秉燭坐。至夜半，有女子冉冉來，頸拖紅帛，向蔡伏拜，結繩於梁④，伸頸就⑤之。蔡無怖色。女子再掛一繩，招蔡。蔡曳⑥一足就之。女子曰：「君誤矣。」蔡笑曰：「汝誤才有今日，我勿誤也。」鬼大哭，伏地再拜去。自此，怪遂絕，蔡亦登第。\n\
    \                         （袁枚 子不語．蔡書生）\n【注釋】\n①見：通「現」，出現。②扃鎖：大門的鎖。③券：契約。\n④梁：屋梁。⑤就：趨近、靠近。⑥曳：伸出。"
