- id: doc_113_新北_丹鳳_國文_g7s2e3_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: '根據甲乙丙的文句敘述，試問謝天作者陳之藩的思維變化為何？

    甲、祖母的話，老天爺也者，我覺得是既多餘，又落伍的。

    乙、他們（祖父母）明明知道要滴下眉毛上的汗珠，才能撿起田中的麥穗，而為什麼要謝天？

    丙、因為需要感謝的人太多了，就感謝天罷。'
  options:
  - label: A
    content: 不謝人謝天→謝人謝天
  - label: B
    content: 謝人不謝天→謝人謝天
  - label: C
    content: 謝人謝天→不謝人不謝天
  - label: D
    content: 不謝人不謝天→謝人謝天。
  lesson_raw:
    title: 謝天
    basis: 題幹提及〈謝天〉作者陳之藩與課文文句
- id: doc_113_新北_丹鳳_國文_g7s2e3_s1_21
