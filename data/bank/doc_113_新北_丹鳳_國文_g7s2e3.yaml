- id: doc_113_新北_丹鳳_國文_g7s2e3_s1_24
  section: 1
  number: 24
  type: single
  page: 2
  stem: 請閱讀下列選項內文，判斷何者可能是志怪小說？
  options:
  - label: A
    content: 齊人就趙人學瑟，因之先調，膠柱而歸，三年不成一曲。齊人怪之，有從趙來者，問其意，方知向人之愚。（向：從前）
  - label: B
    content: 滿奮畏風。在晉武帝坐，北窗作琉璃屏，實密似疏，奮有難色。帝笑之。奮答曰：「臣猶吳牛，見月而喘。」
  - label: C
    content: 豫寧女子戴氏久病，出見小石曰：「爾有神，能差我疾者，當事汝。」夜夢人告之：「吾將佑汝。」後漸差，遂為立祠，名石侯祠。（差：音ㄔㄞˋ，通「瘥」，病癒）。
  - label: D
    content: 人有和羹者，以杓嘗之，少鹽，便益之。後復嘗之向杓中者，故云：「鹽不足。」如此數益升許鹽，故不鹹，因以為怪。（益：增加）
- id: doc_113_新北_丹鳳_國文_g7s2e3_s1_25
  section: 1
  number: 25
