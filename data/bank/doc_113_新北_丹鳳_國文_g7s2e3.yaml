  type: single
  page: 2
  stem: 以下有關五柳先生傳文意的敘述，何者錯誤？
  options:
  - label: A
    content: 「無懷氏之民歟！葛天氏之民歟！」暗喻自己如上古社會中的人一般純樸率真
  - label: B
    content: 「忘懷得失，以此自終」意謂五柳先生終其一生都急公好義，不顧己利，以社會福祉為責任
  - label: C
    content: 「常著文章自娛，頗示己志」指五柳先生寫文章的目的並非求名，而是展現人生志趣
  - label: D
    content: 「閑靜少言，不慕榮利」表明五柳先生個性沉靜，不沽名釣譽、不追求富貴。
