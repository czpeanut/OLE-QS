  type: single
  page: 2
  stem: 下列選項「」中的名句諺語，何者使用不正確？
  options:
  - label: A
    content: 現代人常陷入比較的陷阱，常羨慕別人家的富裕，卻無視自己家庭的付出，真可謂「金玉其外，敗絮其中」
  - label: B
    content: 她身陷在感情的拉扯中，無奈「當局者迷，旁觀者清」，完全聽不進去朋友的勸告
  - label: C
    content: 職場上「明槍易躲，暗箭難防」，真正傷人的，往往不是正面衝突，而是來自背後的算計
  - label: D
    content: 君主若一味壓榨百姓，終將遭遇反抗，正所謂「水能載舟，亦能覆舟」，人民既能成就王朝，也能推翻它。
- id: doc_113_新北_丹鳳_國文_g7s2e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 下列選項中的「於」字，何者意思前後相同？
  options:
  - label: A
