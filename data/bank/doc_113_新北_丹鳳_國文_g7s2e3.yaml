  type: single
  page: 1
  stem: 「好讀書，不求甚解，每有會意，便欣然忘食。」這句話的意涵與下列何者最為相近？
  options:
  - label: A
    content: 其為人也，發憤忘食，樂以忘憂，不知老之將至
  - label: B
    content: 士志於道，而恥惡衣惡食者，未足與議也
  - label: C
    content: 主忠信。毋友不如己者。過，則勿憚改
  - label: D
    content: 飯疏食飲水，曲肱而枕之，樂亦在其中矣。
