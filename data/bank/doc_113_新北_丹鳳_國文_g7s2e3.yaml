  - label: B
    content: 得之「於」人者太多，出之「於」己者太少／青出「於」藍，更勝於藍
  - label: C
    content: 不戚戚「於」貧賤，不汲汲於富貴／生「於」斯，長「於」斯
  - label: D
    content: 又留蚊「於」素帳中，徐噴以煙／千里之行，始「於」足下。
- id: doc_113_新北_丹鳳_國文_g7s2e3_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 關於謝天一文的說明，下列敘述何者正確？
  options:
  - label: A
    content: 作者以第一人稱的觀點寫作，藉由與祖母的相處表達愛要及時
  - label: B
