  group_stem: "（三）\n    魏 鮑子都，暮行於野，見一書生，卒①心痛。\n子都下馬，為摩②其心。有頃，書生卒。子都視其囊中，有素書一卷，金十餅。乃賣一餅，具葬書生，其餘枕之頭下，置素書於腹旁。後數年，子都於道上，有乘驄馬者逐之。既及，以子都為盜，固問兒屍所在。子都具言，於是相隨往。開墓，取兒屍歸，見金九餅在頭下，素書在腹旁，舉家感子都之德義。由是聲名大振。\n\
