  - label: D
    content: 結合生活或興趣以便掌握。
  group_stem: "「我們到底是用腦思考？還是用心思考？」這是一個有趣的問題。有時候我們生氣會罵人說：「沒用大腦。」有時候把事情搞砸，又會說：「真是不夠用心。」顯然的所謂不用心，是對某件事情投入的專注力不夠，所以有時候會「視若無睹」、「聽而不聞」，所看到的東西或聽到的東西，都無法儲存於大腦，科學家證實，大腦只會記錄自己關心的資訊。因此腦科學家教導人們利用「集中意識」，改寫腦地圖。\
    \ \n  生田哲博士倡導，人可以把「不幸腦」變成「幸福腦」。他提到「明確知道生存的目標」、「能掌握自己的人生」、「能接受最真實的自己」，就比較容易獲得滿足感，感受幸福。這三件事看起來比較像「心」的事多過「腦」的事不是嗎？無論如何，我們用心用腦，都要創造美好人生。\
    \ \n（節錄自青年軟實力 幸福迴路）"
  answer:
  - D
  answer_source: answer_key_vlm
