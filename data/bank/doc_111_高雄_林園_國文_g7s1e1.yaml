- id: doc_111_高雄_林園_國文_g7s1e1_s4_9
  section: 4
  number: 9
  type: single
  page: 4
  stem: 「盤古開天」的神話，來自於遠古人民對下列何者的理解與想像？
  options:
  - label: A
    content: 宇宙形成，萬物生成
  - label: B
    content: 世事無常，生命脆弱
  - label: C
    content: 晝夜變化，四季推移
  - label: D
    content: 山河劇變，滄海桑田。
  group_stem: "「神話」是遠古人民的口頭創作。當時的人們看到天地萬物的變化無常，對於無法理解的現象，有時會按照自己的想像、理解或期望，創造出神話故事。\
    \ \n世界是怎麼形成的？人類又從何而來？正因為有這些疑惑，盤古開天的神話於是應運而生。當世界剛剛形成時，天地宛如雞蛋般一團混沌，其中孕育了一個叫盤古的神異之人。他在裡面沉睡了一萬八千年，而後天地漸漸分開，天日高一丈，地日厚一丈，盤古也每天長高一丈。就這樣又經過一萬八千年，天地之間相距達九萬里，盤古也成了頂天立地的超級巨人。\
    \ \n盤古臨死前，他呼出的氣形成了風和雲，聲音變成巨大雷響，雙眼化為太陽與月亮，身體成了四方的擎天大柱與五嶽名山，血液化成江河湖泊，筋脈變成山川道路，肌肉化作沃土，髮鬚變成閃爍的星辰，皮膚、細毛變成花草樹木，牙齒、骨骼變成金屬和岩石，骨髓變成珍珠美玉，汗水變成潤澤大地的雨露，連身上寄生的小蟲受到暖風的吹拂，也化為大地上眾多的百姓。\
    \ \n「寓言」是「寄託之言」。作者把抽象的道理寄託在生動的故事中，讓讀者更容易領悟，以達到勸諭的作用。先秦的史傳與思想家的典籍，如戰國策、孟子、莊子、列子、韓非子等，都能看到許多精彩的寓言，可與大約同期出現於古希臘的伊索寓言相媲美。\
    \ \n戰國時代，有一些思想家善用寓言來宣揚自己的理念。「濫竽充數」便是法家大學者韓非用來宣揚政治理念的一則寓言： \n   齊宣王喜歡聽竽樂合奏，每次演出都要三百位樂工。南郭先生請求為宣王吹竽，宣王高興地答應了，俸祿比照其他數百位樂工，於是他混在樂隊中裝模作樣地吹奏。宣王死後，湣王繼位，喜歡聽樂工一個個地演奏，南郭先生就逃走了。\
    \ \n此則寓言是強調國君考核屬下要確實，才不致於讓臣下有欺矇的機會。後人便用「濫竽充數」來比喻沒有真才實學的人，卻混在行家中充數，或比喻拿不好的東西充場面。有時也用來當作自謙之辭，比喻自己才德不足。\
    \ \n神話與寓言雖然不是小說，但這些故事饒富興味，其中某些重要的題材與藝術手法，為後來小說的創作提供了養分與借鏡，因此有學者認為二者可視為小說的先河。"
  answer:
  - A
  answer_source: answer_key_vlm
