- id: doc_111_高雄_林園_國文_g7s1e1_s4_7
  section: 4
  number: 7
  type: single
  page: 4
  stem: 這是熱愛日劇的雅婷在觀劇後所做的筆記，根據故事背景可得知下列何者？
  options:
  - label: A
    content: 演員的名單
  - label: B
    content: 開播的時間
  - label: C
    content: 劇情的梗概
  - label: D
    content: 故事的結局。
  group_stem: "一、日劇東大特訓班簡介： \n  改編自2003 開始連載的日本漫畫龍櫻，作者為三田紀房。原作漫畫介紹了各種考試與唸書技巧，描寫教養與學習的內容相當廣泛，故事中的櫻木老師讓學生直接體驗現實世界的嚴苛。並對不唸書的高中生和學生，提供了「為了什麼我要讀書」的解答。\
    \ \n  龍櫻，取自故事背景龍山高中的「龍」和代表「櫻花開花結果」（サクラサク，日本的用法）的「櫻」來命名。劇中櫻花樹象徵隔年 4 月要考上東京大學的誓言。\
    \ \n二、故事背景： \n  曾是暴走族（飆車族）的三流律師櫻木建二，為了增加自己業績，不惜賭上聲譽，要將原本瀕臨破產、大學錄取率只有 2％、被稱為「笨蛋高中」的私立龍山高中，改造成升學名校。\
    \ \n  櫻木的主要目標是讓學校經營狀態良好、有實際升學成績，並且以「東大上榜人數」為主要的賣點，針對功課落後的學生開設特訓班。在上榜之前給予學生各種考試指導，使其提升成績，並將因社會變遷而消失的各種形形色色老師集合起來替學生上課。另一方面，也對原職老師進行大規模裁員，結果引起老師們大規模的反彈。究竟這所學校能否如櫻木的希望，從笨蛋高中轉變為東大升學名校？"
  answer:
  - C
  answer_source: answer_key_vlm
