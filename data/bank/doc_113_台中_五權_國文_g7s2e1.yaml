- id: doc_113_台中_五權_國文_g7s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 「倒反」是指言詞表面的意義和作者內心的真意相反。下列選項中的文句何者沒有使用倒反修辭？
  options:
  - label: A
    content: 古今中外，幾多聖賢豪傑，哪一個不是從吃苦中磨練出來的
  - label: B
    content: 我現在想想，那時真是太聰明了
  - label: C
    content: 差不多先生一生不肯認真，不肯計較，真是一位有德性的人
  - label: D
    content: 睿睿的騎車技術超凡入聖，連電線桿都被他撞壞了。
- id: doc_113_台中_五權_國文_g7s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 明代馮夢龍古今譚概中記載：「有一個書生家貧，沒有酒為朋友祝壽，於是拿著一杯水，對友人說：『君子之交淡如。』友人很懂他，回道：『醉翁之意不在。』」根據上文判斷，對話中被隱去的字分別為？
  options:
  - label: A
    content: 酒、湯
  - label: B
    content: 水、酒
  - label: C
    content: 水、油
  - label: D
    content: 泉、酒。
- id: doc_113_台中_五權_國文_g7s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 古典文學中，作者為了抒發自己滿腔愁緒，多會在文字中流露出他們的哀婉惆悵，他們會為了自己的命運而哭、為了生離死別而哭，為了國家興亡或百姓苦痛而哭。請問，下列選項中詩句的眼淚，所代表的愁緒何者與「在晶瑩的淚光中，又看見那肥胖的青布棉袍、黑布馬褂的背影」相同？
  options:
  - label: A
    content: 念天地之悠悠，獨愴然而涕下
  - label: B
    content: 故園東望路漫漫，雙袖龍鐘淚不乾
  - label: C
    content: 劍外忽傳收薊北，初聞涕淚滿衣裳
  - label: D
    content: 思父千回夢裡尋，醒來淚水灑衣襟。
  lesson_raw:
    title: 背影
    basis: 引用朱自清《背影》課文原句
- id: doc_113_台中_五權_國文_g7s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 作者在背影文中提到「我那時真是聰明過分」、「那時真是太聰明了」，他真正想表達的意涵應為何者？
  options:
  - label: A
    content: 自責在當時未能體會父愛
  - label: B
    content: 嘲笑父親思想古板迂腐
  - label: C
    content: 認為自己當時的能力高於父親
  - label: D
    content: 難過父親已是風燭殘年的年紀了。
  lesson_raw:
    title: 背影
    basis: 題幹提及「作者在背影文中」
- id: doc_113_台中_五權_國文_g7s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 視力與偏見：「我視力良好，因此我偏見猶在，多麼不幸的事！」根據這段文字，為何作者認為自己視力良好是不幸的事？
  options:
  - label: A
    content: 因為種族偏見，而造成自身不幸
  - label: B
    content: 感嘆自己仍然以外觀來評斷人，是不幸的事
  - label: C
    content: 感嘆自己因膚色而受歧視並遭遇不幸
  - label: D
    content: 種族偏見所造成的不幸，容易導致心理創傷。
  lesson_raw:
    title: 視力與偏見
    basis: 題幹指名出自《視力與偏見》
- id: doc_113_台中_五權_國文_g7s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 下列何者不能看出視力與偏見一文中，白人老先生曾經對黑人的歧視？
  options:
  - label: A
    content: 從未和黑人一起吃飯、上學
  - label: B
    content: 主辦餐會時不歡迎黑人參加
  - label: C
    content: 認為和黑人結婚會使父母蒙辱
  - label: D
    content: 將黑人輔導員當成自己的良師益友。
  lesson_raw:
    title: 視力與偏見
    basis: 題幹指名出自《視力與偏見》
- id: doc_113_台中_五權_國文_g7s2e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 背影一文中，作者善用具體的事物來象徵抽象情感，關於文中的象徵，下列說明何者正確？
  options:
  - label: A
    content: 以「背影」象徵無法及時盡孝的遺憾
  - label: B
    content: 以「紫毛大衣」象徵家中經濟狀況尚佳
  - label: C
    content: 以「橘子」象徵父親對孩子的關愛
  - label: D
    content: 以「黑布衣帽」象徵父親沉浸在祖母過世的哀傷中。
  lesson_raw:
    title: 背影
    basis: 題幹指名出自《背影》
- id: doc_113_台中_五權_國文_g7s2e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 動作的描繪，可令讀者揣想人物當時的神態。請問：下列文句「」內的人物動作，何者分析正確？
  options:
  - label: A
    content: 「睨」之，久而不去：刻畫賣油翁對陳康肅公射箭技術的推崇
  - label: B
    content: 但微「頷」之：可見賣油翁對陳康肅公的箭法僅略表認同
  - label: C
    content: 乃取一葫蘆置於地，以錢「覆」其口：表現賣油翁自信且傲慢的態度
  - label: D
    content: 康肅「笑」而遣之：表現陳康肅公對賣油翁的酌油技術充滿嘲笑。
  lesson_raw:
    title: 賣油翁
    basis: 選項引用歐陽脩《賣油翁》課文文句
- id: doc_113_台中_五權_國文_g7s2e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 李家同：「如果你願意張大眼睛看一下的話，一定會發現自己絕對是個幸運的人，世界上比你不幸的人比比皆是也。」上述文句所表現出的情懷與下列何者相同？
  options:
  - label: A
    content: 勇敢面對困難，生活才會更加精采
  - label: B
    content: 有良知的人不會去苛求完美，而是在發現錯誤後，力行改正
  - label: C
    content: 永遠對所擁有感到欣喜的人是生活最富足的人
  - label: D
    content: 既然太陽上也有黑點，人世間的事情就更不可能有缺陷。
- id: doc_113_台中_五權_國文_g7s2e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 荀子：「凡人之患，蔽於一曲而暗於大理。」昀昀在書本上看到這句話，因為不懂意思而詢問班上其他人的看法，請問下列何人的解釋最接近？
  options:
  - label: A
    content: 小昂：人往往為片面的現象所蒙蔽，而看不清全面的真理
  - label: B
    content: 小全：人往往為成見所囿，而失去獲取最大利益的機會
  - label: C
    content: 小澄：偏見往往令人失去理智，而做出令自己後悔的決定
  - label: D
    content: 小杰：偏見容易造成人與人之間的對立，應小心謹慎。
- id: doc_113_台中_五權_國文_g7s2e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 〈賣油翁〉一文所啟示的道理最接近下列何者？
  options:
  - label: A
    content: 天行健，君子以自強不息
  - label: B
    content: 人誰無過，過而能改，善莫大焉
  - label: C
    content: 見善如不及，見不善如探湯
  - label: D
    content: 如人學射，久習則巧，後雖無心，以久習故，箭發接中。
  lesson_raw:
    title: 賣油翁
    basis: 題幹指名出自〈賣油翁〉
- id: doc_113_台中_五權_國文_g7s2e1_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 古人稱近視為「不能遠視」，就是看不清遠處的東西。古人也已經知道用眼過度是導致近視的主要原因，如「數看日月，夜視星火，夜讀細書，月下看書，抄寫多年，雕鏤細作」等。根據文章推論下列何者不是古人認為導致近視的原因？
  options:
  - label: A
    content: 在光線不佳處看書
  - label: B
    content: 未能多看綠色植物
  - label: C
    content: 長期抄寫文字
  - label: D
    content: 經常做精細的手工藝品。
- id: doc_113_台中_五權_國文_g7s2e1_s1_21
  section: 1
  number: 21
  type: single
