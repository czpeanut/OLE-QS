    content: □絲馬跡
  - label: B
    content: 招蜂引□
  - label: C
    content: 映雪囊□
  - label: D
    content: □擁而至。
  group_stem: "雨後的蜘蛛\n    雨後，有三個人由屋內往屋外走去，在門口處看到有隻蜘蛛，艱難的向牆上已經支離破碎的網爬去，由於牆壁潮濕，牠爬到一定的高度，就會掉下來。當牠一次次的向上爬，卻又一次次地掉下來。\n\
    \    第一個人看到這情景，嘆了一口氣，自言自語：「我的一生不正如這隻蜘蛛嗎？忙忙碌碌而無所得。」於是，他日漸消沉。第二個人看到後，他心想：「這隻蜘蛛真愚蠢，為什麼不從旁邊乾燥的地方繞一下爬上去？我以後可不能像牠那樣的愚蠢。」於是，他變得聰明起來。第三個人看到後，他內心被那蜘蛛屢敗屢戰的精神感動了，於是，他變得堅強起來。"
