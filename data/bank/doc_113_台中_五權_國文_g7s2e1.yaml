- id: doc_113_台中_五權_國文_g7s2e1_s1_23
  section: 1
  number: 23
  type: single
  page: 3
  stem: 徐國能：「在現代化的資本社會裡，『一無所有』是比生老病死更可怕事。因此我們不能只求安於現狀，而要靠不斷地攫取來壯大自我，藉以對抗隨時可能的失去。」上文提醒讀者應當如何？
  options:
  - label: A
    content: 安分守己，知足常樂
  - label: B
    content: 發憤圖強，與日俱進
  - label: C
    content: 超然世俗，遺世獨立
  - label: D
    content: 敬業樂群，與人為善。
- id: doc_113_台中_五權_國文_g7s2e1_s1_24
  section: 1
  number: 24
  type: single
  page: 3
  stem: 下圖為2024 年不同遊戲載具數量的季報表，根據統計圖，下列選項說明何者錯誤？
  options:
  - label: A
    content: 四個季度的統計中，遊樂器遊戲類的數量皆為最高
  - label: B
    content: 實境體感類的遊戲最不受青睞
  - label: C
    content: 遊戲製作國家中，歐美獨占鰲頭，日韓則緊接在後
  - label: D
    content: 三類遊戲載具中，第一季的數量皆是最多的。
  assets:
