- id: doc_113_台中_五權_國文_g7s2e1_s2_31
  section: 2
  number: 31
  type: single
  page: 4
  stem: 根據上文，下列敘述何者正確？
  options:
  - label: A
    content: 古代天子嫁女兒於諸侯時，並不會由自己親自主持婚禮
  - label: B
    content: 漢制規定，天子的姐妹及女兒皆可稱為公主
  - label: C
    content: 「公主」的稱呼始於戰國，之後便一直沿用
  - label: D
    content: 古代公主的婚姻大事往往由同姓諸侯決定。
  group_stem: "為什麼皇帝的女兒叫公主？\n    周朝以前，帝王的女兒被稱為「王姬」，到了戰國時期才出現「公主」這個稱呼，根據《春秋公羊傳》記載：「天子嫁女子於諸侯，必使諸侯同姓者主之，故謂之公主。」意思是，當周天子將女兒嫁給諸侯時，自己不主持婚禮，而由同姓的諸侯主持婚禮。當時同姓諸侯被尊稱為「公」，而「主」字為主持婚禮之意，自此之後，天子的女兒就稱為公主。根據五代馮鑑《續事始》卷十記載：「漢制天子女為公主，姊妹曰長公主，帝姑為大長公主。」到了北宋，由於徽宗崇尚古制，曾將公主更名為「帝姬」，但在北宋滅亡之後，南宋又恢復了「公主」的稱謂。"
- id: doc_113_台中_五權_國文_g7s2e1_s2_32
