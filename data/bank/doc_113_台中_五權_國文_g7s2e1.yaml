  - label: B
    content: 漫天風雪
  - label: C
    content: 火樹銀花
  - label: D
    content: 丹楓如火。
  group_stem: "元宵節到了宋代，更是發展成最熱鬧的市井狂歡節，政府同樣也出資贊助各項活動，例如煙火和燈會，並且從放假三天延長至五天。白天在街上馳馬，晚上女孩打扮得漂漂亮亮出來賞夜燈，聽著音樂在酒樓茶館談笑，這就是元宵節必備活動。因此在這個時候非常適合情侶見面約會、宅宅約妹看花燈，互通相思之情。\n\
    \    宋代已經沒有宵禁，到了元宵節更是夜遊的狂歡日，這期間少男少女都會認真打扮一番，希望在燈會能夠邂逅一段美麗的戀情。多麼浪漫，在美麗的燈會中，遇見了百分之百的你。然而像歐陽脩這種人生勝利組，竟然約不到妹看花燈？他寫過一闕詞是這樣的：「去年元夜時，花市燈如晝，月上柳梢頭，人約黃昏後。今年元夜時，月與燈依舊，不見去年人，淚濕春衫袖。」"
