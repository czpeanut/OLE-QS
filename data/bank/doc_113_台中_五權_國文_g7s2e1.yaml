- id: doc_113_台中_五權_國文_g7s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 下列選項文句中所表達的語氣，何者與「大約大去之期不遠矣」相同？
  options:
  - label: A
    content: 我走了，到那邊來信
  - label: B
