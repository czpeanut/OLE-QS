- id: doc_113_台中_五權_國文_g7s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 下列選項中的文句，何者完全沒有錯別字？
  options:
  - label: A
    content: 比賽要開始了，選手們各個準備就序，鬥志高昂
  - label: B
    content: 他總是行縱不定，你永遠不知道他會出現在何處
  - label: C
    content: 對於未能如期完成任務，他愧疚難安，無法入眠
  - label: D
    content: 戰場上戰士為國捐軀，犧牲奉獻的精神令人恕然起敬。
- id: doc_113_台中_五權_國文_g7s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列選項「」內的詞語，何者意思前後相同？
  options:
  - label: A
    content: 大家相約「同行」到海邊看落日 / 他出眾的才能早已在「同行」中脫穎而出
  - label: B
    content: 遇事便「躊躇」不前的人是無法成功的 / 這次的成功令他「躊躇」滿志，喜悅不已
  - label: C
    content: 他們倆因嫌隙，早已多年不「來往」了 / 路上「來往」的車輛眾多，行人要更加注意
  - label: D
    content: 小毓上了一節課後「赫然」發覺自己走錯教室了 / 在那棟廢棄的建築物中，「赫然」發現一隻小貓。
- id: doc_113_台中_五權_國文_g7s2e1_s1_3
