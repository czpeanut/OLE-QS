- id: doc_113_台中_五權_國文_g7s2e1_s1_22
  section: 1
  number: 22
  type: single
  page: 3
  stem: 「具」，甲骨文字形為，上面是鼎，下面是雙手。陶鼎是家家戶戶必備的燒器具，主婦一早起床，就得捧著鼎去生火煮食，準備一家人用餐。所以「具」有準備、配備等意思。根據上文推論，「具」應當為造字法則中的哪一類？
  options:
  - label: A
    content: 象形
  - label: B
    content: 指事
  - label: C
    content: 會意
  - label: D
    content: 形聲。
