- id: doc_111_桃園_同德_數學_g9s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: '如圖，小香與小芬對於『$\triangle ABC$ 中，$\overline{CD} \perp \overline{AB}$，$\overline{BE}
    \perp \overline{AC}$，且 $\overline{CD}=\overline{BE}$，試證 $\overline{AB}=\overline{AC}$』，其證明如下。判斷他們的說法是否正確？

    | 小香: | 小芬: |

    | :--- | :--- |

    | ∵ $\angle ADC=\angle AEB=90^{\circ}$<br>$\overline{CD}=\overline{BE}$<br>$\angle
    A=\angle A$<br>∴ $\triangle ACD \cong \triangle ABE$ (RHS 全等性質)<br>因此 $\overline{AB}=\overline{AC}$
    | ∵ $\overline{CD} \perp \overline{AB}$，$\overline{BE} \perp \overline{AC}$<br>$\triangle
    ABC$ 面積= $\frac{1}{2} \times \overline{AC} \times \overline{BE}=\frac{1}{2} \times
    \overline{AB} \times \overline{CD}$<br>又 $\overline{CD}=\overline{BE}$，因此 $\overline{AB}=\overline{AC}$
    |'
  options:
  - label: A
    content: 兩人說法都正確
  - label: B
    content: 小香正確，小芬錯誤
  - label: C
    content: 小香錯誤，小芬正確
  - label: D
    content: 兩人說法都有錯誤
