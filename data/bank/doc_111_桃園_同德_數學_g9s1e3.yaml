- id: doc_111_桃園_同德_數學_g9s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 如圖，關於 $\triangle ABC$ 與 $\triangle DEF$ 全等條件與性質，下列何者錯誤？
  options:
  - label: A
    content: 若 $\overline{AB}=\overline{DE}$，$\overline{AC}=\overline{DF}$，$\overline{BC}=\overline{EF}$，則
      $\triangle ABC \cong \triangle DEF$ 根據 SSS 全等性質。
  - label: B
    content: 若 $\overline{AB}=\overline{DE}$，$\overline{AC}=\overline{DF}$，$\angle
      A=\angle D$，則 $\triangle ABC \cong \triangle DEF$ 根據 SAS 全等性質。
  - label: C
    content: 若 $\overline{AB}=\overline{DE}$，$\overline{BC}=\overline{EF}$，$\angle
      A=\angle D$，則 $\triangle ABC \cong \triangle DEF$ 根據 SSA 全等性質。
  - label: D
    content: 若 $\overline{AB}=\overline{DE}$，$\angle B=\angle E$，$\angle A=\angle
      D$，則 $\triangle ABC \cong \triangle DEF$ 根據 ASA 全等性質。
