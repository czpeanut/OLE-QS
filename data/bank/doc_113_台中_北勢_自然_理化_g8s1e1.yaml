  - label: B
    content: 45%
  - label: C
    content: 33%
  - label: D
    content: 55%
  group_stem: '◎天氣瓶

    1. 分別秤取2.5g硝酸鉀（$KNO_{3}$）以及2.5g氯化銨（$NH_{4}Cl$）加入33mL蒸餾水中。

    2. 秤取10g樟腦（$C_{10}H_{16}O$，Camphor）加入40mL乙醇（酒精95%）中。

    3. 將上述二步驟的溶液互相混合在錐形瓶中（會形成白色沉澱的溶液），然後將錐形瓶以橡皮塞密封。

    完成後，將混和溶液放置於35℃溫水中水浴（隔水加熱）並輕輕搖晃，白色沉澱會逐漸溶解，約20分鐘後形成澄清透明溶液。在靜置冷卻過程中，天氣瓶會出現「下雪」的現象——溶液中出現很多雪花狀結晶，紛紛下降到瓶底（如一），頗為美觀'
