- id: doc_113_台中_北勢_自然_理化_g8s1e1_s1_31
  section: 1
  number: 31
  type: single
  page: 3
  stem: '台中一所私立中學，發生實驗室爆炸意外，當時師生在進行「糖蛇」實驗，疑似操作不慎，造成三名國一學生燙傷送醫，其中最嚴重的女學生，脖子和臉部有10%二度燙傷。在國中小實驗室，經常看到的膨糖實驗，把糖和小蘇打粉混合（甲）後燃燒（乙），產生有如黑色長蛇的物體，實驗是為了讓學生知道，糖是碳水化合物可燃性，燃燒產生水、二氧化碳和黑色的碳，小蘇打受熱，分解出大量二氧化碳（丙），學生可觀察一邊燃燒，一邊冒出黑蛇的現象。

    除了用糖和小蘇打粉混合後燃燒產生二氧化碳，有關二氧化碳的性質那些敘述是不正確的'
