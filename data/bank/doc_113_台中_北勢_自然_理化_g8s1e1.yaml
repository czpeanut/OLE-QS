- id: doc_113_台中_北勢_自然_理化_g8s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 下列關於糖漿的敘述，何者正確？
  options:
  - label: A
    content: 糖在水中溶解屬於化學變化
  - label: B
    content: 未添加小蘇打粉的糖水屬於純物質
  - label: C
    content: 糖水中糖為溶質
  - label: D
    content: 糖水稱為溶劑
  group_stem: '◎膨糖：紅糖、二砂、小蘇打粉、大湯匙一支、筷子、卡式爐、水、盤子

    1. 將紅糖及二砂以1：5的比例混合後，倒入大湯匙中，約湯匙一半的量。加水至大湯匙中淹過糖面即可。

    2. 將加好水的湯匙置於卡式爐上加熱，起先是湯匙中的糖溶解，持續加熱至糖漿開始變成紅褐色（旁邊可裝一小盒清水，將糖漿滴於水中不會擴散即可移出。

    3. 將湯匙從爐火中移出，用筷子攪拌約3~5秒，再用筷子沾小蘇打粉於湯匙中攪拌，直至湯匙中的糖漿變色（顏色會轉成淡褐色），此時繼續攪拌並將筷子慢慢往上拉（糖漿膨脹時筷子完全抽出），直至膨脹停止。

    4. 膨脹停止後，把湯匙置於小火中烤，讓底部的糖再度溶解，將糖倒於盤子中即完成。'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
