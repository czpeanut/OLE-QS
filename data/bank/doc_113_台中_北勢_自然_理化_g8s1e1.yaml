  group_stem: '◎彩鹽瓶:將繽紛的彩鹽裝於玻璃瓶內進行創作，除了享受DIY的樂趣，還可將獨一無二彩鹽作品帶在身上，可以祈福避邪，淨化磁場唷。首先，準備鹽巴還有彩色粉筆

    1. 找個容器倒入鹽巴，用粉筆稍加按壓或繞圈把顏色磨進到鹽巴裡就能完成顏色飽和的彩鹽了。

