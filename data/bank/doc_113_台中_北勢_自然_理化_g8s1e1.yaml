    2. 除了原本粉筆的紅黃綠橘藍也可以兩色混合可以試著混了黃綠和藍綠其他也可以自己試

    3. 接下來,就能動工了!準備透明的玻璃瓶，將彩鹽分層倒入、每一層的份量不要差太多、但有高有低也能呈現層次感

    4. 不過記得不要搭得太用力把顏色混在一起囉!除讓彩鹽分佈均勻也讓它往下結實的堆疊才不會封蓋後因搖動而混色!

    最後一層一定要填滿不能有空隙

    馬蓋先利用寒假到臺南七股的鹽山遊玩，從那裡帶回了一些含有泥沙的粗鹽，他想自己做彩鹽瓶但要有精鹽，所以回到家後，他將含有泥沙的粗鹽精製成食鹽晶體，並將整個實驗過程畫下來，如附圖所示，請回答下列問題：'
