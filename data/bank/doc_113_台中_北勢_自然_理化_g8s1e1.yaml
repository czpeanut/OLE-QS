    2. 將加好水的湯匙置於卡式爐上加熱，起先是湯匙中的糖溶解，持續加熱至糖漿開始變成紅褐色（旁邊可裝一小盒清水，將糖漿滴於水中不會擴散即可移出。

    3. 將湯匙從爐火中移出，用筷子攪拌約3~5秒，再用筷子沾小蘇打粉於湯匙中攪拌，直至湯匙中的糖漿變色（顏色會轉成淡褐色），此時繼續攪拌並將筷子慢慢往上拉（糖漿膨脹時筷子完全抽出），直至膨脹停止。

    4. 膨脹停止後，把湯匙置於小火中烤，讓底部的糖再度溶解，將糖倒於盤子中即完成。'
