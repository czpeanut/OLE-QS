- id: doc_113_台中_北勢_自然_理化_g8s1e1_s1_29
  section: 1
  number: 29
  type: single
  page: 3
  stem: 試問若只考慮40 ml乙醇（酒精95%）加入33 ml蒸餾水中，此時酒精的體積百分率濃度約為
  options:
