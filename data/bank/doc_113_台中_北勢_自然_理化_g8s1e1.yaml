  group_stem: '某天馬蓋先在網路上發現一些有趣的實驗，所以喜歡親自動手的他，就著手準備器材來驗證網路的實驗是否正確

    ◎大象牙膏

    大象牙膏（英語：Elephant toothpaste）是一個化學實驗，因實驗中過氧化氫快速分解所產生大量氣泡而得名。這個實驗需要的原料較少，而產生的效果卻和火山噴發一樣壯觀，故常用於課堂演示中。

    1. 首先將過氧化氫約50毫升倒入杯子中，再倒入30毫升的洗碗精，輕輕攪拌使充分混和。

    2. 在另一個杯子中裝水約20毫升，再加入碘化鉀一小匙勺（約0.5克），攪拌溶解。

    3. 取100毫升量筒放在水盆中央，將步驟1過氧化氫與洗碗精混和液倒入量筒中，再將碘化鉀水溶液迅速倒入量筒中。'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
