- id: doc_113_台中_大甲_國文_g9s2e1_s2_43
  section: 2
  number: 43
  type: single
  page: 4
  stem: 根據甲文，晚明文人如何看待旅遊活動？
  options:
  - label: A
    content: 旅遊是一種純粹的娛樂活動
  - label: B
    content: 旅遊是展現財富與地位的方式
  - label: C
    content: 旅遊是為了探尋創作靈感，無關個人品味
  - label: D
    content: 旅遊是一種綜合性的審美活動。
  group_stem: '2.

    （甲）

    　　晚明文人嗜遊山水，旅遊對他們而言，是一項綜合性的審美活動，標誌著生活的雅化。文人遊賞之後，會將所見所聞、所思所感以詩文記錄下來。由於當時刻書作坊眾多，文人雅士書寫的遊記，可整理出版，向公眾發行。撰寫遊記，便成為士人重要的文化資本，用以塑造品味，並以此區別普通遊客。

    　　從晚明文人的論述與當時出現的大量西湖旅遊書籍可知，西湖已成為文人旅遊的重要目的地。文人在記遊詩文中，以自身的審美情趣，對西湖風景資源進行梳理、總結，發展了與大眾不同的遊觀。作品發行後，對閱讀者多會產生行為與審美的指引，從而不斷塑造並加強西湖景物的內涵。

    （乙）

    　　西湖最盛，為春為月。一日之盛，為朝煙，為夕嵐。……然杭人遊湖，止午、未、申三時。其實湖光染翠之工，山嵐設色之妙，皆在朝日始出，夕舂①未下，始極其濃媚。月景尤不可言，花態柳情，山容水意，別是一種趣味。此樂留與山僧遊客受用，安可為俗士道哉！

    （袁宏道 晚遊六橋待月記）


    註：①夕舂：即夕陽。

    　　②六橋：西湖蘇堤上的六座橋。'
