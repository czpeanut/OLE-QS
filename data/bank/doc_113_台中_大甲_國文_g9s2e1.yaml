- id: doc_113_台中_大甲_國文_g9s2e1_s2_41
  section: 2
  number: 41
  type: single
  page: 4
  stem: 關於甲文中的人物，下列推論何者最為恰當？
  options:
  - label: A
    content: 商鞅為孝公及惠王的寵臣
  - label: B
    content: 秦人守法，全因商鞅公正
  - label: C
    content: 惠王聽信某人，認為商鞅會危及君權
  - label: D
    content: 商鞅最後因叛變，慘遭車裂之。
  group_stem: '1.

    （甲）

    　　衛鞅①亡魏入秦，孝公以為相，封之於商，號曰商君。商君治秦，法令至行，公平無私，罰不諱強大，賞不私親近，法及太子，黥劓②其傅。期年之後，道不拾遺，民不妄取，兵革大強，諸侯畏懼。然刻深寡恩，特以強服之耳。孝公行之八年，疾且不起，欲傳商君，辭不受。孝公已死，惠王代後，蒞政有頃，商君告歸。人說惠王曰：「大臣太重者國危，左右太親者深危。今秦婦人嬰兒皆言商君之法，莫言大王之法。是商君反為主，大王更為臣也。且夫商君，固大王仇讎也，願大王圖之。」商君歸還，惠王車裂之，而秦人不憐。

    （戰國策 秦策）

    （乙）

    　　明主不蔽之謂明，不欺之謂察。故賞厚而利，刑重而必，不失疏遠，不私親近。故臣不敢主，下不欺上。

    （商君書 修權）


    註：①衛鞅：即商鞅。

    　　②黥劓：音ㄑㄧㄥˊ ㄧˋ，古代的酷刑。黥，在罪人臉上刺字；劓，割掉鼻子。'
