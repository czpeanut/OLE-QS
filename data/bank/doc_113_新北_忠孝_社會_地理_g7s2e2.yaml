- id: doc_113_新北_忠孝_社會_地理_g7s2e2_s1_17
  section: 1
  number: 17
  type: single
  page: 1
  stem: '下列為各時期臺灣工業發展的特色，請依照時間先後，按照順序排列：

    甲、發展輕工業和農產加工業

    乙、產業升級，發展高科技產業

    丙、成立加工出口區，發展勞力密集產業

    丁、發展重化工業為主，如石化與造船工業'
  options:
