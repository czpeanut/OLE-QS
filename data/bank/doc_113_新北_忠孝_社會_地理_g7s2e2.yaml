  section: 1
  number: 18
  type: single
  page: 1
  stem: 下圖為某國對其他四國進出口貿易額統計圖，依據此圖可知，某國對哪些國家的貿易是呈現「出超」的狀況？
  options:
  - label: A
    content: 甲乙
