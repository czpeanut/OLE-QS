- id: doc_113_新北_忠孝_社會_地理_g7s2e2_s1_19
  section: 1
  number: 19
  type: single
  page: 1
  stem: 新竹科學園區是台灣第一座科學園區，主要產業包括有半導體業、電腦業、通訊業、光電業、精密機械與生物科技業，是全球半導體製造業最密集的地區之一。由新竹科學園區設廠的產業類別來分析，下列何者「不是」該區工業發展的特性？
  options:
  - label: A
    content: 外銷潛力大
  - label: B
    content: 附加價值低
  - label: C
    content: 資金密集度高
  - label: D
    content: 技術密集度高
- id: doc_113_新北_忠孝_社會_地理_g7s2e2_s1_20
  section: 1
  number: 20
  type: single
  page: 1
  stem: 臺灣國際貿易十分發達，下圖為臺灣民國112 年主要經貿伙伴進口、出口貿易值比例圖。根據圖中資料，臺灣的國際貿易具備何種特徵？
  options:
  - label: A
    content: 目前貿易額呈現入超的情況
  - label: B
    content: 出口對象較進口對象更分散
  - label: C
    content: 排名前五的進出口國家一致
  - label: D
    content: 主要貿易對象集中歐美國家
  assets:
  - key: s1_20_f1
    kind: figure
    file: doc_113_新北_忠孝_社會_地理_g7s2e2/s1_20_f1.png
- id: doc_113_新北_忠孝_社會_地理_g7s2e2_s1_21
  section: 1
  number: 21
  type: single
  page: 1
  stem: 臺灣政府在面臨「美援」停止後所造成經濟發展資金短缺的困境，採取以勞力密集的輕工業來拓展出口的策略，陸續設立高雄、楠梓、臺中加工出口區。請問：下列何者是當時加工出口區的主要產品？
  options:
  - label: A
    content: 紡織、電子裝配
  - label: B
    content: 汽車、電鍍鋅鋼品
  - label: C
    content: 農、漁產加工製品
  - label: D
    content: 半導體、液晶螢幕
- id: doc_113_新北_忠孝_社會_地理_g7s2e2_s1_22
  section: 1
  number: 22
  type: single
  page: 1
  stem: 彰化溪湖為重要的果菜市場，而鄰近的花卉更為當地重要的作物。請問：該地區農業「商品化」的特徵可由下列何者觀察得知？
  options:
  - label: A
    content: 種植高經濟價值作物
  - label: B
    content: 作物單位面積產量大
  - label: C
    content: 作物多運往市場銷售
  - label: D
    content: 作物以集約方式耕作
- id: doc_113_新北_忠孝_社會_地理_g7s2e2_s1_23
  section: 1
  number: 23
  type: single
  page: 1
  stem: '下圖為農業部推出的「農村四季，生命之歌」活動海報，根據海報內容判斷，此一活動可以因應目前台灣何項農業發展的現況？


    農村四季‧生命之歌

    ~濁溪搶水文化節~

    早年農村的水利設施不完善，取水不易，農民製作「籠仔笱」引濁水溪灌溉千畝良田。活動中以4~6 人為一組，扛著「籠仔笱」在泥巴水中賽跑，速度最快者獲勝，歡迎民眾前來共襄盛舉！'
  options:
  - label: A
    content: 農產品商品化
  - label: B
    content: 農村勞力老化
  - label: C
    content: 發展休閒農業
  - label: D
    content: 推動精緻農業
  assets:
  - key: s1_23_f1
    kind: figure
    file: doc_113_新北_忠孝_社會_地理_g7s2e2/s1_23_f1.png
- id: doc_113_新北_忠孝_社會_地理_g7s2e2_s1_24
  section: 1
  number: 24
  type: single
  page: 2
  stem: 近年來我國政府積極推動「漁電共生」政策，鼓勵養殖業者在魚塭設置太陽能光電板。由於太陽能板須設置在日照充足、乾季較長且四周無遮蔽的地區，因此初步選定養殖業發達且自然環境條件適合的地區開始這一個政策。根據上文，下列哪一個縣市較適合推動上述的政策？
  options:
  - label: A
    content: 宜蘭縣
  - label: B
    content: 台東縣
  - label: C
    content: 基隆市
  - label: D
    content: 台南市
- id: doc_113_新北_忠孝_社會_地理_g7s2e2_s1_25
  section: 1
  number: 25
  type: single
  page: 2
  stem: 鶯歌擁有「台灣景德鎮」美名，為台灣重要的陶瓷生產地。清朝時，在附近的尖山發現適於製作陶器的黏土，並以鄰近開採的煤炭作為燃料，開創當地的陶瓷業。依上文所述，鶯歌陶瓷產業當初開創時的主要區位因素為下列何者？
  options:
  - label: A
    content: 原料
  - label: B
    content: 勞力
  - label: C
    content: 交通
  - label: D
    content: 市場
- id: doc_113_新北_忠孝_社會_地理_g7s2e2_s1_26
  section: 1
  number: 26
  type: single
  page: 2
  stem: 台灣因蔗糖的生產成本較高，近年來糖廠紛紛吹熄燈號，或轉型為觀光糖廠，目前僅剩兩間糖廠還有在榨糖。請問還在榨糖的糖廠，最有可能座落於下列何處？
  options:
  - label: A
    content: 宜蘭縣三星鄉
  - label: B
    content: 新竹縣北埔鄉
  - label: C
    content: 新北市坪林區
  - label: D
    content: 台南市善化區
- id: doc_113_新北_忠孝_社會_地理_g7s2e2_s1_27
  section: 1
  number: 27
  type: single
  page: 2
  stem: 民國六十年代的十大建設，將高雄市打造為台灣石化產業的重鎮。高雄之所以成為台灣石化產業的重心，除了政府政策的推動外，主要也是與當地哪一項特色關係密切？
  options:
  - label: A
    content: 擁有大量廉價的勞工
  - label: B
    content: 擁有大型的國際商港
  - label: C
    content: 位於高速鐵路的終點
  - label: D
    content: 沿海蘊藏豐富的石油
