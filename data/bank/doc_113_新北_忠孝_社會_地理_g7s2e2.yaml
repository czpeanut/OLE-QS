  number: 15
  type: single
  page: 1
  stem: 泰熙是住在韓國的國中生，未來的夢想是成為偶像歌手。泰熙的媽媽在東大門賣女裝，爸爸是三星電子工廠的作業員。爺爺以前是漁夫，奶奶是家庭主婦。姊姊現在在小學教書，哥哥是銀行的理財顧問。請問泰熙一家人中曾經從事第三級產業的有幾位？
  options:
  - label: A
    content: 二位
  - label: B
    content: 三位
  - label: C
    content: 四位
  - label: D
    content: 五位
- id: doc_113_新北_忠孝_社會_地理_g7s2e2_s1_16
  section: 1
  number: 16
  type: single
  page: 1
  stem: 台灣漁業發達，除了因為四面環海，海岸線長之外，最重要的是附近海域的大陸棚廣大且有寒暖洋流在此交會，帶來豐富魚源。請問：下圖中那一個點是屬於在大陸棚的範圍內，適合漁撈漁業的發展？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
