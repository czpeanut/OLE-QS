  - label: D
    content: Ox didn’t swim faster than Rat.
  group_stem: 'D. 每題 1 分，共 3 分

    Twelve animal signs of the Chinese zodiac came from a quite interesting story.
    One day, the Jade Emperor was having a swimming race to decide the first twelve
    animals to be the signs. To win the race, Cat and his best friend, Rat, were thinking
    about the best way to get ahead of the other animals. Finally, they planned to
    jump onto Ox’s back because Ox was good at swimming. When the day of the race
    came, Cat and Rat were on Ox’s back and successfully left the others behind. With
    the finish line in sight, Rat was so excited that he only cared about winning.
    He didn’t care about his best friend and pushed Cat into the river suddenly. In
    the end, Rat won first place. Since then, Rat and Cat have not been friends any
    more. Maybe that’s why cats are always running after rats to catch them.


     zodiac 生肖 Jade Emperor 玉皇大帝'
