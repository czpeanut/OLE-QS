    content: What to Do When You Feel Lost
  group_stem: "B. 每題 1 分，共 2 分\nSome choices are as easy as deciding which clothes\
    \ to wear. Some choices, on the other hand, are more difficult to make and need\
    \ careful thought. For example, many people feel lost when they are choosing a\
    \ school or a career. That is why it is important to learn how to make a good\
    \ decision.\n  Here are the steps you can follow to make a good decision. First,\
    \ write down all the options. Listing them is a way to help you get a clear idea\
    \ of what options you have. Second, look for information about the options. Knowing\
    \ the options well helps you make a better decision. Third, think about the possible\
    \ risks of each option. Try to ask yourself what might happen when you take different\
    \ options. Finally, make your decision and believe in yourself.\n  Making a good\
    \ decision is never easy. Follow the steps above and be careful with every decision\
    \ you make. Then you will be able to make a great one.\n\n thought 考慮 step 步驟\
    \ option 選項\nrisk 風險"
