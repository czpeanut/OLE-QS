  group_stem: "Many children have heard of Oxford University because of Harry Potter.\
    \ In fact, many great stories were written there. For example, The Lord of the\
    \ Rings, The Chronicles of Narnia and Alice in Wonderland. When Lewis Carroll\
    \ wrote Alice in Wonderland, he was a teacher of mathematics at Oxford University.\
    \ The main character, Alice was based upon a real person.\n One day, Mr. Carroll\
    \ went for a boat trip with the Liddell family. One of the three daughters was\
    \ called Alice. She asked Mr. Carroll to tell her some stories. So, Mr. Carroll\
    \ made up a story based on her name, Alice. This was the beginning of Alice's\
    \ adventures in Wonderland.\n Alice often went to a shop to buy sweets. That shop\
    \ is now known as the Alice Shop. It is also known as a sheep shop. The reason\
    \ is because the salesperson in the shop was an old lady. When she talked, her\
    \ voice sounded just like that of a sheep.\n Now, there is another Alice Shop\
    \ in London. The shop is open from 11:00 a.m. to 5:00 p.m. every day of the year\
    \ except for two days in the year. Those two days are December 25 and 26. In summer,\
    \ the shop closes one hour later.\n adventure 冒險 salesperson 店員"
