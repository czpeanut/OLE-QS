    content: If the toy is right for kids' age and skills.
  - label: C
    content: What color kids like the most.
  - label: D
    content: How much kids will pay for the toy.
  group_stem: '(46-48) ICRT Lunchbox 2024/12/19

    What Will Be the Toys of the Year?

    Making a new toy sounds fun. But it''s hard to do. Inventors think about the toy.

    They think about the kids who will play with it. Is the toy too easy or too hard
    for the kids?

    Inventors make one sample of their toy. They take the sample to kids to play with.
    Do kids like it?

    Then the inventor tests the toy. Does it break easily? Does it have dangerous
    parts?

    When there are no more problems, a toy factory makes a lot of the toy. Then the
    inventor needs to sell them! Phew! It takes lots of work to make a new toy! But...
    maybe kids around the world will play with it! Every year, toy inventors hope
    their toy gets a Toy Foundation award. Toys that get the most votes win. Everyone
    can vote on the foundation''s website. You can vote for sixteen kinds of toys.
    There are action figures, stuffed animals, toys that help you make things your
    own way, toys that teach, and more! You can vote until January tenth! Good luck,
    inventors!'
