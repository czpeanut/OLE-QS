- id: doc_113_新北_忠孝_英語_g8s1e3_s3_49
  section: 3
  number: 49
  type: single
  page: 5
  stem: "49.Which of the following about Hsu Wen-erh is true?   \nfollowing 以下  complete\
    \ 完成     challenge 挑戰      include 包含"
  options:
  - label: A
    content: She is the first one to complete the Triple Crown challenge.
  - label: B
    content: Her swimming successes include crossing seas.
  - label: C
    content: It took Hsu Wen-erh 33 hours in total to finish the famous event.
  - label: D
    content: She didn’t stop during her first try at any swim.
  group_stem: '(49-50) ICRT Lunchbox 2024/12/24

    Taiwanese Wins the Triple Crown of Open Water Swimming

    "If at first you don''t succeed, try, try again." This means when you want something
    very much,

    keep going! Never give up!

    Hsu Wen-erh is an open water swimmer. This means she swims in lakes, rivers, and
    seas!

    Hsu is the first Taiwanese to get the Triple Crown of Open Water Swimming!

    She finished a famous event. It''s very long and very hard… It has three long
    swims!

    First, Hsu swam from England to France. She took 12 hours!

    Second, Hsu swam from a small island to California.

    She took 13 hours! Third, Hsu swam around an island in New York City.

    That was the hardest swim. On her first try, she couldn''t finish.

    The swim was too hard. She had to stop. But Hsu didn''t give up!

    The next day, she tried again! She took 9 hours. And this time, she finished!

    The swims were hard, but Hsu kept trying.

    She worked hard, tried again, and got the Triple Crown of Open Swimming!

    So when you want something very much, be like Hsu and never give up!'
