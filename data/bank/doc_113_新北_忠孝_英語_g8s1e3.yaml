    Eric: Excuse me, I’m visiting this place for the first time. I am trying to find
    a restaurant called "Happy Bistro." Could you tell me how to get there?

    Wilson: Sure! Walk straight down Spring Street. When you see a bus stop, turn
    right. You''ll see a bakery on your left. Keep walking for one block, and the
    restaurant will be on your right. There’s a train station across from it, so you
    won’t miss it.

    Eric: Thanks a lot! I will meet my girlfriend there for her birthday dinner, and
    I do not want to be late.

    Wilson: Oh, happy birthday to your girlfriend! The food there is wonderful. I
    worked there for many years. They have the best food in this city. You’ll like
    it. I hope you enjoy the evening.

    Eric: Thanks for your help.

    Wilson: You are welcome. Have a wonderful evening!

    Eric: I will. Thanks again!'
