questions:
- id: doc_113_屏東_中正_社會_歷史_g8s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 民國68年，美國因與中共建交，故宣布與我國斷交，對我國造成重大的影響，下列敘述何者有誤 ?
  options:
  - label: A
    content: 美國與中華民國制定臺灣關係法，維持非官方往來
  - label: B
    content: 我國因此被迫退出聯合國
  - label: C
    content: 完成與美國建交的中共領導人是鄧小平
  - label: D
    content: 兩岸關係從武力對抗走向政治對峙。
- id: doc_113_屏東_中正_社會_歷史_g8s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 1960年代，有些西方青年走上街頭進行示威遊行，常將「造反有理」和「橫掃一切牛鬼蛇神」等口號吹捧為最前衛、最革命的精神理念，1968年5月，法國巴黎美術學院的學生，甚至搗毀校內供素描教學之用的石膏像，視其行為為破除傳統。上述巴黎學生的這些行為是受到中國何者的影響？
  options:
  - label: A
    content: 人民公社的農民
  - label: B
    content: 五四運動的群眾
  - label: C
    content: 六四天安門的學生
  - label: D
    content: 文革時期的紅衛兵
- id: doc_113_屏東_中正_社會_歷史_g8s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '以下三段資料均與韓戰有關，請問《甲》、《乙》、《丙》依序代表哪些國家的立場?

    《甲》：我們聯合國部隊絕不可將戰事擴大，主要目的是圍堵這隻橫跨歐亞的巨獸。

    《乙》：北韓的存在使我們不必直接與美國勢力為鄰，故以抗美援朝為口號號召志願軍作為北韓的援軍。

    《丙》：我們獲得美援與第七艦隊協防共產勢力擴張。'
  options:
  - label: A
    content: 蘇聯、美國、南韓
  - label: B
    content: 美國、中華人民共和國、北韓
  - label: C
    content: 蘇聯、南韓、日本
  - label: D
    content: 美國、中華人民共和國、中華民國。
- id: doc_113_屏東_中正_社會_歷史_g8s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 2022年香港故宮文化博物館開幕，被視為香港回歸中國25週年的紀念禮。香港特首出席致詞：「本博物館的建設，離不開香港在“一國兩制”下的獨特優勢，可以與內地文化機構攜手推動中華文化走出去。」下列相關敘述何者正確?
  options:
  - label: A
    content: 毛澤東親眼見證香港主權回歸中國
  - label: B
    content: 1997年，終結葡萄牙百餘年的殖民歷史
  - label: C
    content: 清朝割讓香港，可遠溯至鴉片戰爭戰敗簽訂南京條約喪失主權
  - label: D
    content: 香港回歸中國後設立經濟特區，實施一國兩制。
- id: doc_113_屏東_中正_社會_歷史_g8s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 目前東南亞國家協會有　10　個會員國，但因為與周遭國家密切往來，開始展開合作，而形成「東協＋3」。請問：「＋3」中不包括下列何者？
  options:
  - label: A
    content: 南韓
  - label: B
    content: 日本
  - label: C
    content: 美國
  - label: D
    content: 中國。
- id: doc_113_屏東_中正_社會_歷史_g8s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 冷戰期間，反共陣營與共產陣營針鋒相對，經常出現小規模的區域性衝突和戰爭。下列有關冷戰的敘述，何者正確?
  options:
  - label: A
    content: 冷戰開始於第一次世界大戰結束後
  - label: B
    content: 共產陣營以美國為首，反共陣營以蘇聯為首
  - label: C
    content: 越戰後，冷戰時期隨之結束
  - label: D
    content: 冷戰時期，國際上也出現區域統合的趨勢。
- id: doc_113_屏東_中正_社會_歷史_g8s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 中國近代史上所發生的歷史事件，往往會有口號產生，以表現事件的訴求與主軸，以下那一組事件與其對應的口號是錯誤的？
  options:
  - label: A
    content: 韓戰 → 抗美援朝
  - label: B
    content: 大躍進 → 超英趕美
  - label: C
    content: 文化大革命 → 破四舊、立四新
  - label: D
    content: 六四天安門事件 → 革命無罪，造反有理。
- id: doc_113_屏東_中正_社會_歷史_g8s2e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 中共建國後，從1950年代〜1970年代，在外交關係上出現三個階段：《甲》中蘇交惡  《乙》中美抗蘇  《丙》中蘇友好。若依照時間先後順序，這三個階段的發展順序應該是：
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲丙乙
  - label: C
    content: 丙甲乙
  - label: D
    content: 丙乙甲。
- id: doc_113_屏東_中正_社會_歷史_g8s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 有關中共建國初期，毛澤東擔任國家領導人的各項措施，下列何者為非？
  options:
  - label: A
    content: 實施土地改革，沒收地主土地改行「公地放領」及「耕者有其田」等措施
  - label: B
    content: 為鞏固政權排除異己，對於知識分子展開言論和思想控制
  - label: C
    content: 為迅速提升經濟，提高鋼鐵產量號召「全民大煉鋼鐵」
  - label: D
    content: 以蘇聯為榜樣，積極學習其治國經驗
- id: doc_113_屏東_中正_社會_歷史_g8s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 「1989　年的天安門事件很像七十年前的五四運動，都是以《甲》城市為中心，然後擴向全國；也都是由《乙》發起，然後吸引社會其他各階層參加。……事件的發生，是兩個因素的互動所致。一方面是領導人《丙》實施《丁》改革政策的內在矛盾；另一方面則是中共內部的繼承人問題，不同的繼承人對《乙》運動有不同的看法；有主張強硬鎮壓的，也有主張溫和互動的……。」依上文內容，以下敘述何者有誤
    ?
  options:
  - label: A
    content: 《甲》城市是指北京
  - label: B
    content: 《乙》身分是指學生
  - label: C
    content: 《丙》是指鄧小平
  - label: D
    content: 《丁》改革政策的內在矛盾是指政治上推動改革開放，卻仍嚴格管控國內經濟發展。
- id: doc_113_屏東_中正_社會_歷史_g8s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 中共建國初期，中蘇關係全面左右了當代中國的動向。下列哪一因素，是造成中蘇兩國關係生變的導火線？
  options:
  - label: A
    content: 韓戰爆發，中共被迫參戰
  - label: B
    content: 中共推行大躍進運動時，不滿蘇聯過度干涉
  - label: C
    content: 越戰時中共與蘇聯支持不同勢力
  - label: D
    content: 中共進行改革開放，違背蘇聯理念。
- id: doc_113_屏東_中正_社會_歷史_g8s2e3_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 近七十多年來，中美蘇三方的關係一直有著相當微妙的轉變，經常是其中的兩者聯合起來，一起對抗第三者的態勢，牽動著東亞與全球局勢的發展。在下列哪一位中共領導人執政期間，中共與美國、蘇聯三方開始保持彼此較友善的互動關係？
  options:
  - label: A
    content: 毛澤東
  - label: B
    content: 鄧小平
  - label: C
    content: 胡錦濤
  - label: D
    content: 江澤民。
- id: doc_113_屏東_中正_社會_歷史_g8s2e3_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 東南亞公約組織(縮寫為 SEATO)，是1955年在泰國曼谷成立的集體防衛組織。下列敘述何者有誤？
  options:
  - label: A
    content: 是由美國主導建立
  - label: B
    content: 成立目的是防制亞洲的共產主義勢力蔓延
  - label: C
    content: 東約組織將中華民國納入成為創始會員國
  - label: D
    content: 東南亞的泰國、菲律賓為東約組織的成員國
- id: doc_113_屏東_中正_社會_歷史_g8s2e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 文化大革命這場動亂不但在中國境內造成深遠的影響，對世界也造成一定程度的衝擊。下列何者不是文化大革命的影響之一？
  options:
  - label: A
    content: 美國的黑人民權人士利用集會的機會討論、學習《毛語錄》
  - label: B
    content: 美國為避免共產勢力擴散，與中華民國簽訂《中美共同防禦條約》
  - label: C
    content: 中共積極推廣共產革命思想，擴大援助亞、非、拉丁美洲的共產武裝勢力
  - label: D
    content: 「革命無罪、造反有理」的口號，促進歐美地區的學生運動。
- id: doc_113_屏東_中正_社會_歷史_g8s2e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 東南亞國家協會於西元1967年在泰國曼谷成立。下列關於東協的敘述，何者有誤？
  options:
  - label: A
    content: 中華民國目前為東協的會員國
  - label: B
    content: 冷戰時期，著重於政治協商與維持區域秩序
  - label: C
    content: 冷戰後，逐漸轉型為注重成員間的經貿合作
  - label: D
    content: 至今仍在運作並促進區域統合。
- id: doc_113_屏東_中正_社會_歷史_g8s2e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 美國為防止共產勢力的擴張而支援越戰多年。後來美軍中途撤離越南的主因為何？
  options:
  - label: A
    content: 蘇聯向美國本土發動攻擊
  - label: B
    content: 美國國內發生內戰
  - label: C
    content: 中共威脅出兵臺灣
  - label: D
    content: 美國國內反戰情緒高漲。
- id: doc_113_屏東_中正_社會_歷史_g8s2e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 第二次世界大戰後，亞洲的韓國與越南在經歷獨立之後卻走向分裂的地步，其主要的原因為何？
  options:
  - label: A
    content: 共產勢力的介入
  - label: B
    content: 美國的新霸權地位
  - label: C
    content: 日本的軍國主義
  - label: D
    content: 法國勢力的擴張。
- id: doc_113_屏東_中正_社會_歷史_g8s2e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 中共領導人習近平提出「兩個100年」，被認為是具體實踐中國夢的路徑。美國總統川普的美國夢則是「美國再次偉大」到「美國繼續偉大」的具體實踐。中共建國後與美國間的外交關係，下列敘述何者正確？
  options:
  - label: A
    content: 一九五○年代，毛澤東推行「大躍進」與美國開始正常往來
  - label: B
    content: 一九六○年代，毛澤東與美國完成建交訪問美國
  - label: C
    content: 一九七○年代，毛澤東聯合美國制衡蘇聯
  - label: D
    content: 一九八○年代，鄧小平改善與蘇聯關係停止與美國的貿易合作
- id: doc_113_屏東_中正_社會_歷史_g8s2e3_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 冷戰時期，美國藉由協防西太平洋地區，提供美援打造出亞太圍堵體系。下列何國不會屬於東亞反共島弧的集體防衛體系之一？
  options:
  - label: A
    content: 越南
  - label: B
    content: 日本
  - label: C
    content: 菲律賓
  - label: D
    content: 紐西蘭。
- id: doc_113_屏東_中正_社會_歷史_g8s2e3_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 1961年，美國派兵援助南越對抗北越，越戰爆發。從意氣風發的出兵，到灰頭土臉的撤退，完全始料未及。有關越戰的敘述何者正確？
  options:
  - label: A
    content: 越南脫離了殖民母國英國卻受到共產主義入侵
  - label: B
    content: 法國扶植的北越入侵南越
  - label: C
    content: 戰前南北越的分界線為北緯38度線
  - label: D
    content: 戰後北越統一全國越南成為共產國家
- id: doc_113_屏東_中正_社會_歷史_g8s2e3_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 1966~1976年，毛澤東發動文化大革命期間，人民陷入一種集體瘋狂的情緒中，人倫綱常、傳統道德在此期間蕩然無存，對於文化、文物的破壞也到達了高峰，許多學者稱這段時間為「十年浩劫」。當初發生的根本原因為何？
  options:
  - label: A
    content: 思想改造
  - label: B
    content: 改革傳統文化
  - label: C
    content: 奪權鬥爭
  - label: D
    content: 驅逐外國勢力。
- id: doc_113_屏東_中正_社會_歷史_g8s2e3_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 1990年代我國開始推行「南向政策」，試圖以經濟與文化實力增加對□的影響力。2016年政府推動「新南向政策」，並成立直接隸屬於總統府的新南向政策辦公室，希望藉此促進台灣和□、南亞及紐、澳等國的經貿、科技、文化等各層面的互動，藉此開創外交新局面。依據上述內容，文中□應為下列何者？
  options:
  - label: A
    content: 聯合國
  - label: B
    content: 東南亞公約組織
  - label: C
    content: 東南亞國家協會
  - label: D
    content: 歐洲聯盟。
- id: doc_113_屏東_中正_社會_歷史_g8s2e3_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: 1971年4月，美國《時代》周刊封面以「China： A Whole New Game」為題，刊登了美國乒乓球隊員登上中國長城的相片，這一幕，歷史上稱為「乒乓外交」，為冰封二十載的中美關係打開缺口，為隔年美國統總尼克森訪問中國鋪陳。中美兩國之間出現破冰之舉，此事對當年世界局勢有何影響？
  options:
  - label: A
    content: 中共成功進入聯合國
  - label: B
    content: 蘇聯共產政權解體
  - label: C
    content: 美國開始介入越戰
  - label: D
    content: 鄧小平推行改革開放。
- id: doc_113_屏東_中正_社會_歷史_g8s2e3_s1_24
  section: 1
  number: 24
  type: single
  page: 2
  stem: 美國為了完整圍堵共產勢力，與未加入東南亞公約組織的東亞國家分別簽訂條約。其中何項的簽署，成為圍堵體系的最後一塊拼圖 ?
  options:
  - label: A
    content: 《台灣關係法》
  - label: B
    content: 《中美共同防禦條約》
  - label: C
    content: 《開羅宣言》
  - label: D
    content: 《聯合國憲章》
- id: doc_113_屏東_中正_社會_歷史_g8s2e3_s1_25
  section: 1
  number: 25
  type: single
  page: 2
  stem: 1999年繼香港主權回歸中國之後，澳門主權也由何國移交中國，成立特別行政區？
  options:
