- id: doc_113_台中_五權_自然_g8s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '下列兩種體積的測量方式，何者正確？

    (甲)將米粒放入空量筒中，輕敲後米粒堆積至Xml刻度上，然後倒入Yml 的水，且米粒皆在水面下，此時水面刻度到Zml，則米粒的體積為(Z-Y)ml

    (乙)先將糖慢慢倒入50cm$^{3}$的水中，直至量筒底部出現沉澱，記錄此時的刻度為R cm$^{3}$，再將20g的糖倒入糖水中，刻度升至T cm$^{3}$，此時即可測出20g
    糖的體積為(T- R) cm$^{3}$'
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 甲乙
  - label: D
    content: 兩者皆錯誤
