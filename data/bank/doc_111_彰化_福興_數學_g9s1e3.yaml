    $Q$，使得 $\triangle APQ$ 與 $\triangle DPQ$ 全等，以下是阿寶、小翰兩人的作法：

    阿寶：過 $D$ 作與 $\overline{AC}$ 平行的直線交 $\overline{AB}$ 於點，過 $D$ 作與 $\overline{AB}$
    平行的直線交 $\overline{AC}$ 於 $Q$ 點，則 $P$、$Q$ 兩點即為所求。

    小翰：連接 $\overline{AD}$，作 $\overline{AD}$ 的中垂線分別交 $\overline{AB}$、$\overline{AC}$
    於 $P$ 點、$Q$ 點，則 $P$、$Q$ 兩點即為所求。

    對於阿寶、小翰兩人的作法，下列判斷何者正確？'
