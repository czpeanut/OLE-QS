  section: 1
  number: 21
  type: single
  page: 4
  stem: '秋瑾與懷生同做一題尺規作圖的題目，題目如下：

    如圖，直線 $L$ 上有 $A$ 、 $B$ 、 $C$ 三點，其中 $\overline{AB}=1$ ， $\overline{BC}=\pi$ ，以尺規作圖做出一段長度為
    $\pi^{2}$ 的線段。

    以下為兩人的做法，請問誰做的是正確的？

    秋瑾：過 $A$ 點做一條異於 $L$ 的直線 $M$ ，接著以 $A$ 點為圓心，以 $\overline{BC}$ 為半徑畫弧交直線 $M$ 於 $D$
    點，再過 $C$ 點做與 $\overline{BD}$ 平行的直線 $N$ ，直線 $N$ 與直線 $M$ 相交於 $E$ 點，則 $\overline{DE}$
    即為所求。

    懷生：以 $B$ 點為圓心， $\overline{AB}$ 為半徑畫弧交直線 $L$ 於 $D$ 點(異於 $A$ 點)，分別過 $D$ 、 $C$ 兩點做垂直
    $L$ 的直線 $M$ 、 $N$ ，接著以 $D$ 點為圓心， $\overline{BC}$ 為半徑畫弧交直線 $M$ 於 $E$ 點，連接 $\vec{BE}$
    交直線 $N$ 於 $F$ 點，則 $\overline{CF}$ 即為所求。'
  options:
  - label: A
    content: 秋瑾正確，懷生錯誤
  - label: B
    content: 秋瑾錯誤，懷生正確
  - label: C
    content: 兩人皆正確
  - label: D
    content: 兩人皆錯誤。
  assets:
  - key: s1_21_f1
    kind: figure
    file: doc_113_台北_仁愛_數學_g9s1e1/s1_21_f1.png
