  stem: '上數學課的時候，老師要大家討論相似的狀況，則以下有幾位同學的說法是正確的？

    阿軒：「兩個正五邊形一定會相似。」

    小凌：「兩個等腰三角形中，如果有一組對應角相等，則這兩個三角形相似。」

    阿仁：「若兩個六邊形的所有內角皆為120°，則這兩個六邊形相似。」

    小愛：「平行四邊形如果有一個角是90度，那就一定會和長方形相似。」

    阿國：「兩個三角形如果有兩組對應邊比例一樣，還有一組對應角相等，就會相似了。」

    中中：「兩個等腰直角三角形一定會相似。」'
  options:
  - label: A
    content: 2 個
  - label: B
    content: 3 個
  - label: C
    content: 4 個
  - label: D
    content: 5 個。
