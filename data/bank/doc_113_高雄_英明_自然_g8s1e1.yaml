    content: 冰塊沉入油底，融化成水後浮在油面上
  group_stem: "請在閱讀下列敘述後，回答第31 題\n  密度除了可作為判斷物質種類的依據，還可用來判斷固體在液體中的浮沉，例如：鐵、鋁、銅等金屬的密度都比水大，會沉入水底；而木塊和冰塊等密度比水小的物體，則會浮在水面上。若固體和液體的密度正好相同時，此固體就可在此液體中隨處停留。若將互不相溶的液體放在同一容器中，密度較大的會在下層，而密度較小的會浮在上層。由於我們已知水、糖漿、酒精和沙拉油的密度，若將這四種液體由密度大到小，依序放入杯中，便會呈現如附圖的景象。"
