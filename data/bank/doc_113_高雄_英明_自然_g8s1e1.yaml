  stem: 已知冰塊的密度約為 0.92 g/cm³，汽油的密度約為 0.75 g/cm³。將冰塊丟入汽油中時，冰塊會浮在油面上還是沉入油底？當冰塊融化成水後，水會浮在油面上還是沉入油底？
