  section: 1
  number: 20
  type: single
  page: 2
  stem: '以下是弘宇解方程式 $(2x+3)^2=(3x-2)^2$ 的過程：

    步驟一：兩邊同時去掉平方，得 $(2x+3)=(3x-2)$

    步驟二：移項得 $3+2=3x-2x$

    步驟三：化簡得 $x=5$

    請問弘宇從哪一個步驟開始出錯？'
  options:
  - label: A
    content: 步驟一
  - label: B
    content: 步驟二
  - label: C
    content: 步驟三
  - label: D
    content: 三個步驟都沒錯誤
  tags:
