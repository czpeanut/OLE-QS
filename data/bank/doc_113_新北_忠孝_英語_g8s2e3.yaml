- id: doc_113_新北_忠孝_英語_g8s2e3_s2_42
  section: 2
  number: 42
  type: single
  page: 4
  stem: 42. According to the reading, what is NOT one of the four ways Taiwan plans
    to help people exercise more?
  options:
  - label: A
    content: Creating more places like bike paths.
  - label: B
    content: Giving free gym memberships to everyone.        memberships 會員
  - label: C
    content: Having National Exercise Days.
  - label: D
    content: Teaching students about health in schools.
  group_stem: "C. (42-43)\n    Do you go for walks, ride a bike, or play sports? Exercise\
    \ is not just good for your muscles. It helps your brain and heart too!\nBut...\
    \ many people don't get enough movement each day. That's why Taiwan's government\
    \ has a new plan to help everyone get more active.\n    President Lai says the\
    \ government has a new goal. By the year 2030, they want 15% more people in Taiwan\
    \ to be active and exercise often. Why? Because moving our bodies is great for\
    \ our health. The World Health Organization says we need at least 150 minutes\
    \ of exercise each week. That's about 20 minutes a day. But in a 2021 survey,\
    \ over half of the people said they don't do that much.\n    To help change this,\
    \ Taiwan is trying four big ideas. First, the government will create more places\
    \ to exercise, like bike paths and walking trails. Second, they will set special\
    \ \"National Exercise Days.\" Third, people can get help from sports centers if\
    \ they don't know how to start. And fourth, schools will keep teaching students\
    \ how to stay healthy. President Lai says it's best to start young. When kids\
    \ learn healthy habits early, they're more likely to keep them for life. The government\
    \ also wants people to live longer and healthier. Exercise doesn't have to be\
    \ hard. You can start small, have fun, and stay strong!      (選自ICRT 6/9 國中)"
  ai_answers:
    gemini: B
    qwen: B
  answer:
  - B
  answer_status: ai_generated
  answer_source: ai:gemini+qwen
