  group_stem: "E.(46-47)\nToday's story is a definite winner! A man from Thailand\
    \ just won two gold medals. His name is Sawang Janpram. And he is 105 years old!\
    \ Sawang is taking part in the 2025 World Masters Games. It's a big sports competition\
    \ that's held every four years. Anyone over 25 to 35 years old can take part.\
    \ The World Masters Games is all about \"sports for all\". It believes everyone\
    \ can enjoy sports through their entire life. This year's games are in Taipei\
    \ and New Taipei. There's more than 25,000 athletes competing! And Sawang is one\
    \ of those amazing athletes. He ran the 100-meter race. He finished the race in\
    \ 38.55 seconds. He also threw a javelin. That's a long stick you throw as far\
    \ as you can. Sawang threw the javelin 10.55 meters. That's about as long as a\
    \ bus!\n     How does he stay so strong? Sawang says he started exercising when\
    \ he was 80 years old. A friend of his got very sick, and couldn't move anymore.\
    \ Sawang says he didn't want that to happen to himself. And around that time,\
    \ Sawang's daughter also got strong from exercising. So he decided to start working\
    \ out too. Sawang started joining races. At that time, he was 97 years old. He\
    \ says all those races helped him get healthier. He also became friends with people\
    \ from around the world.\n     So what's next for this star athlete? He wants\
    \ to compete in more countries. And eventually, Sawang wants to become a world\
    \ champion! Another champion is Lin Pan Hsiu-yun from Taiwan. She is 88 years\
    \ old. She won gold in the women's 100-meter race. She says running makes her\
    \ feel strong and happy. Hsiu-yun hurt her leg a few years ago. But now she's\
    \ back and running fast. Her new goal? To run until she's 100 years old!\n   \
    \  These amazing athletes show us that it's never too late to start moving, dream\
    \ big, and have fun. Whether you're 8 or 88, 10 or 100, you can be strong, brave,\
    \ and awesome!                                               (選自ICRT 5/28 國中)"
