  stem: 44. What does the Ministry of Education say about using phones during class?
  options:
  - label: A
    content: Phones must be turned off or in airplane mode unless students use them
      for learning or emergencies.    unless 除非
  - label: B
    content: Students can use their phones during break time to do homework.
  - label: C
    content: Students can keep their phones as long as they don’t make noise.   
      as long as 只要
  - label: D
    content: Teachers must collect all phones before every class begins.        
      collect  收集
  group_stem: "D. (44-45)\n      Do you think students should be able to use their\
    \ phones at school? Some people think it's a good idea because phones help us\
    \ learn. Others think it's bad because phones can be a big distraction. The Ministry\
    \ of Education has announced new rules about using phones at school. These rules\
    \ will keep students safe and focused.\n      For elementary school and junior-high\
    \ schools, students can only bring phones if they have permission from their parents\
    \ or guardians. Their phones would be held by the school or class. This rule is\
    \ called \"centralized management\" and will be decided by the school. High school\
    \ students will have a bit more freedom because they can manage themselves better.\
    \ But even in high schools, schools must still make sure everyone understands\
    \ the rules. Teachers, parents, and high school students will work together to\
    \ make phone-use plans. This means schools can decide when students can use their\
    \ phones during the school day. A student group called Ed Youth said that phone\
    \ rules should only be strict during class to stop students from using their phones\
    \ too much. They don't want teachers to control everything. The Ministry agreed\
    \ that phones should be turned off or put in airplane mode during class. But they\
    \ said it's okay to use phones for learning or emergencies.\n    The Ministry\
    \ also said that today's students are \"digital natives\" which means they grew\
    \ up using technology. They say phones can be helpful for learning. But there\
    \ needs to be a balance because too much phone use can be bad. Too much time on\
    \ social media or playing games isn't good for health or learning. So, these new\
    \ rules try to keep learning fun and safe for everyone!\n(選自ICRT 6/3 國中)"
  ai_answers:
    gemini: A
    qwen: A
  answer:
  - A
