  group_stem: 漂白水，是一種強而有效的家居消毒劑，其主要成分是次氯酸鈉（Sodium hypochlorite），能使微生物的蛋白質變質，有效殺滅細菌、真菌及病毒。家用漂白水到處皆售，且價格便宜，功效快速，因此，市民可使用稀釋的家用漂白水來消毒環境。使用漂白水時應小心處理，因為漂白水對黏膜、皮膚及呼吸道具有刺激性，遇熱和光會分解，亦容易與其他物質產生化學反應。不當使用漂白水會影響其殺菌功能，造成意外、威脅健康。過量使用漂白水或使用濃度過高的漂白水，會產生有毒物質汙染環境，破壞生態。
