  section: 1
  number: 6
  type: single
  page: 1
  stem: 「女真，古代西北游牧民族，早期名稱眾多。遼國強盛時，女真有生、熟兩部，以是否編入戶籍為大略區別。生女真在北宋初年，完顏阿骨打統一生女真故部，叛遼建金國；之後滅遼，屢屢南侵，發動靖難之變虜走欽、徽二帝，北宋滅亡。面對金國南侵勢烈，南宋與之簽訂「紹興和議」，之後與後來崛起的契丹聯手，覆滅金國。至明初分化為建州女真、海西女真、野人女真三部，後又因為地域而更為分化，建州女真在努爾哈赤的帶領下，再度崛起建國。西元1636
    年皇太極稱帝，建號大清，並改族名為滿洲。」請問以上資料，以方框圈選之處，錯誤的有幾個？
  options:
  - label: A
    content: '2'
  - label: B
    content: '3'
  - label: C
    content: '4'
  - label: D
    content: 5。
