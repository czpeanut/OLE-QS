- id: doc_113_台南_復興_自然_g7s2e1_s2_5
  section: 2
  number: 5
  type: single
  page: 4
  stem: 外耳道多毛症，外耳道兩側出現過多毛髮，控制此性狀的基因只位於 Y 染色體上、在 X 染色體上無此等位基因存在，則此性狀只可能出現在哪一種性別的人身上？
  options:
  - label: A
    content: 男性
  - label: B
    content: 女性
  - label: C
    content: 男性與女性皆有
  - label: D
    content: 無法確定
  group_stem: '關於人類性狀的遺傳，有些性狀的表現是由單一基因所控制，稱為單基因遺傳，例如：美人尖和 ABO 血型等；而由多個基因所共同控制的，則稱為多基因遺傳，例如：身高和膚色等。

    人類的美人尖屬於單基因遺傳，每個人都有一對控制有無美人尖的等位基因，若其中含有一個顯性等位基因（PP 或 Pp），便會有美人尖；具有兩個隱性等位基因（pp），則無美人尖。

    人類的 ABO 血型也是屬於單基因遺傳，但決定人類 ABO 血型的等位基因卻有 $I^{A}$、$I^{B}$ 及 $i$ 三種，其中 $I^{A}$ 和
    $I^{B}$ 為顯性，$i$ 為隱性。基因型為 $I^{A}I^{A}$ 或 $I^{A}i$ 者，其表現型為 A 型；$I^{B}I^{B}$ 或 $I^{B}i$
    者為 B 型；$I^{A}I^{B}$ 者，兩個等位基因均為顯性，為 AB 型；$ii$ 者兩個等位基因均為隱性，為 O 型。

    在多基因遺傳中，其性狀的表現通常具有多種表現型，而且呈現程度不同的連續性變化。以人類的身高為例，具有從矮到高連續性的差異，通常身高中等的人數最多，特別矮及特別高的人數則較少；膚色亦有從黑到白的差異。

    女性個體有兩條 X 染色體，分別來源於她的父親和母親，而她本人又可傳給兒子，也可傳給女兒，且傳給兒子和女兒的機率是相等的。而 Y 染色體，是來源於親代男方，也一定是傳給下一代的男方，所以它是在世代男性個體中直線下傳。

    「性聯遺傳」即遺傳基因位於性染色體上的遺傳現象，控制性狀的基因恰巧位於性染色體上，其性狀的遺傳與性別產生相關聯。

    若控制性狀的基因位於 X 性染色體上，因為 Y 染色體上無此等位基因存在，所以雄性只要有一個隱性基因，就可以表現出性狀，雄性患病機率大於雌性；若此基因為顯性，則雌性患病機率大於雄性。

    若控制性狀的基因位於 Y 性染色體上，因為 X 染色體上無此等位基因存在，所以雄性只要有此基因，就可以表現出性狀，而且一定是父傳子，雌性不會患病。

    請依據上述說明，回答下列第 5 題。'
