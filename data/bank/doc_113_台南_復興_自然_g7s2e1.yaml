- id: doc_113_台南_復興_自然_g7s2e1_s2_1
  section: 2
  number: 1
  type: fill
  page: 3
  stem: (甲)渦蟲的斷裂生殖、(乙)草莓的匍匐莖繁殖、(丙)草莓的種子繁殖、(丁)冠軍犬的胎生繁殖、(戊)變形蟲的分裂生殖、(己)蝴蝶蘭的組織培養。上述哪些生物的生殖過程，子代容易和香蕉面臨到相同困境？（2分，全對給分）
  group_stem: '香蕉再度面臨絕種危機？「香蕉殺手」捲土重來

    目前全世界廣泛種植的香蕉都是一種名為「香芽蕉（Cavendish）」的香蕉，又稱為華蕉。因為香芽蕉是無性生殖產生，所以全世界的香芽蕉基因幾近完全一樣，無法透過
    DNA 變異發展出對抗黃葉病的基因。一棵香芽蕉樹出事，就等於全球的香芽蕉玩完。

    黃葉病主要是通過香蕉樹的根部進入樹的中心，令蕉樹內部發黑及枯萎。由於患病的蕉樹無法傳送水分及養分，最後使整棵樹死亡。黃葉病容易傳染，能透過水分及泥土散播，黃葉病的真菌孢子還可留在土地裏數十年。因此，若一棵蕉樹受感染，兩、三年內便可令香蕉園內所有香蕉樹也枯萎。

    請依據上述說明，回答下列第 1 題。'
