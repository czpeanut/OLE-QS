  group_stem: "題組：請依據下列圖表回答第48-50 題。\n  南韓總統尹錫悅於2024 年12 月3 日晚間十點在首爾發表緊急電視談話，表示共同民主黨為首的國會反對黨為「親北韓勢力」並透過「反國家活動」癱瘓政府，據此宣布全國戒嚴。戒嚴令生效後，當局在國會議事堂部署軍隊，阻止國會議員進入，並與示威者發生衝突。軍隊甚至一度進入大樓內，試圖逮捕議員。\n\
    \  戒嚴事件引發南韓國內強烈反應，包括執政黨國民力量、反對黨共同民主黨及各工會組織均反對戒嚴令，大批民眾發動抗議並阻擋戒嚴部隊進入國會。12 月4 日凌晨1\
    \ 時左右，南韓國會召開會議，當時已進入國會議事堂的190 名議員全票通過決議，宣布總統頒布之戒嚴無效。\n  南韓總統尹錫悅最終遭到國會通過彈劾，至於代理總統職務的國務總理韓悳洙，則因暫緩任命憲法裁判所（憲法法庭）法官，而遭到在野黨發起彈劾案，韓國國會於27\
    \ 日表決通過代理總統韓悳洙的彈劾案，創下韓國代理總統被彈劾首例，這場政治風暴導致韓國政局陷入紛亂，拖累韓國股市和匯市劇烈震盪。面對政局動盪不安，韓圓兌美元匯率首度跌破1480\
    \ 韓元關口，再刷2009年全球金融危機以來的最低紀錄。"
