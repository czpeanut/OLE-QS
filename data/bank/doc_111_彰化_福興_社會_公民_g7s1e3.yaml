  type: single
  page: 2
  stem: 依上文所述，如果這個故事發生在妳我身邊，下列關於我國法律保障奧吉在校園中權利的敘述，何者最適當？
  options:
  - label: A
    content: 為了協助奧吉人格發展，禁止他人言語嘲笑奧吉
  - label: B
    content: 為了讓奧吉享有受教權，學校應提供他隔離課程
  - label: C
    content: 基於保障奧吉的尊嚴，禁止其他的同學與他互動
  - label: D
    content: 奧吉與他人發生衝突時，奧吉的權利優先於其他人
  group_stem: ※『…電影「奇蹟男孩」改編自同名暢銷小說，故事講述一個遺傳罕見基因，天生臉部有殘缺的男孩—出生，醫生就斷定他活不過三個月，但奧吉卻憑著旺盛的生命力活了下來，經過27次大小小部的面部整容手術，他逐漸朝「正常人」的路走去，但五官仍然非常扭曲，像有人用大鉗子把他的臉從中間壓扁。小時候，他無論走到哪都要戴著一頂太空人頭盔，因為唯有躲在頭盔之下，才不會引來別人異樣的眼光。奧吉媽媽認為奧吉總有一天要面對社會，要學習面對來自同學間的異樣眼光，因此主張結束一對一在家自學，讓他進入學校中實際生活與學習。10歲的奧吉結束了在家由媽媽自學的生活，決定踏出家門上學去。奧吉第一次踏進學校，進入了醜的、胖的、和別人稍有不同就會被嘲弄的殘酷青春期。就在他融入新學校之際，開始與奧吉自然在校園中成為大家指指點點的目標，有人嘲笑他、有人欺負他、甚至直接說他有「傳染病」，一場萬聖節的惡作劇把奧吉的自信打到谷底。在充滿潛規則的中學校園，一不小心，就會從「受歡迎」淪落為「被排擠」的邊緣人。奧吉靠著他的智慧和幽默感，化解一次一次的危機。奧吉的入學像是一顆震撼彈，深深影響了他周圍的人。電影除了描繪奧吉眼中的世界，也加入他同班同學、姊姊、姊姊的男友等六個青少年的多重敘事觀點，透過他們不同的快樂、煩惱、困惑和掙扎，逐漸拼湊出每一次霸凌事件的全貌。一個充滿淚水、愛與希望的生命旅程，述說一個平凡的男孩，如何接納自己、勇敢長大的不凡故事，也述說他的出現，如何奇蹟似的改變了所有人的生命。』請回答以下問題：
