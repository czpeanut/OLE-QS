  stem: 上文中女主角在家中的情況，主要是受到哪一個概念影響？
  options:
  - label: A
    content: 生理性別
  - label: B
    content: 性別平等
  - label: C
    content: 性別刻板印象
  - label: D
    content: 性騷擾
  group_stem: ※『…《82年生的金智英》電影改編自作者趙南柱的同名小說，描述的是一位名叫智英，出生於1982年的女性在韓國的生命故事。身為次女的她，從小在家中的地位就不如弟弟。家裡有什麼好吃的、好用的，一定都是男生先用。學生時期有一次晚上補習回家途中，遇到一位同校男同學尾隨騷擾，使得智英非常害怕，傳簡訊給爸爸求救，爸爸反倒怪她為什麼裙子穿那麼短！出了社會好不容易找到了不錯的工作，在女性錄取率僅29.6%的高競爭下，好不容易擠進一家小型公司上班，儘管勤奮付出，升遷卻仍不如同期進公司的男同事們，且只有同等職位男同事的八成，但她仍然認真努力工作，此外，不但遇到職場性騷擾，還因為結婚育兒關係，結婚生子後，社會風氣傾向「男主外、女主內」，她只好辭職在家帶小孩，被迫離開職場。結了婚的智英，狀況並沒有更好，面對當個好媳婦、好太太、好媽媽的期待，每天忙進忙出的瑣碎雜事把她壓的喘不過氣來。帶著孩子出現在公共場合，想忙裡偷閒帶著孩子外出喝杯咖啡，卻被旁邊的男性上班族譏笑是「媽蟲」，意指拿著老公辛苦賺來的錢在這邊悠閒度日，連蟲都不如。還被譏笑是個沒有生產力的「媽蟲」。電影只是巧妙地將這些事件集中起來，在完全無需刻意強化的情況下，便給人一種無處可逃，極為酸楚的感受，進而對金智英一角產生了高度共鳴，彷彿成為踩隨她的一道影子，與她共享著那股無所適從的茫然感。電影也同時以此作為核心，成功將問題的範圍進一步地拓展出去，描繪出許多社會與企業文化對於家庭結構的不友善之處，導致就算女性擁有良好的家庭溝通關係，卻也可能會因為以公司利益為唯一考量的職場文化，導致家庭成員相互協助的機制也因此失能，除了女性會在職場上遭受不公平待遇之外，就連想要幫助妻子的男性，若是想使用類似育嬰假這類的社會福利時，卻也因此會受到職場潛規則的影響，導致職涯出現問題，使一切變成了惡性循環，彷彿沒有出路一般。』請回答以下問題：
