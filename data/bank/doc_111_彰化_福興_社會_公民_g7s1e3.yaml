- id: doc_111_彰化_福興_社會_公民_g7s1e3_s1_33
  section: 1
  number: 33
  type: single
  page: 5
  stem: 媒體報導日本私立東京醫科大學在入學考試調實改考生成績，將女性考生的成績扣分，並將男性考生的成績加分，以降低女性入學的比例。事件爆發後，日本社會批評該作法，且傷害了許多努力準備考試的女學生，迫使該校校長下臺負責。代理校長向社會公開道歉，並表示願意提出補救措施，也會配合檢調單位的調查。然而，許多醫師表示這不是唯一一間這麼做的學校，很多醫科學院或多或少都會這樣做，是醫科學院普遍現象。他們認為女性醫師未來可能因為結婚生子的關係，而不會將重心放在工作上，或是造成醫院人力短缺，因此藉由此作法以降低女性擔任醫師的可能性。根據上述內容判斷，下列敘述何者正確？
  options:
  - label: A
    content: 文中的事件若發生在我國，能透過《性別工作平等法》來進行救濟
  - label: B
    content: 此種作法降低了女性擔任醫師的機會，是一種性別歧視的現象
  - label: C
    content: 因為男性醫生的貢獻大於女性醫生，故東京醫科大學的作法合理
  - label: D
    content: 女性醫生會分心照顧小孩，因此其薪水少於男性醫生應屬合理
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
