  group_stem: '※『…曩縣布農族獵人王光祿為了讓年邁的母親品嘗到野味，持獵槍獵捕當時被列為野生保育動物的山羌，遭到判刑三年半，最高法院認為有違憲之虞聲請釋憲。以下節錄其中一項所探討的層面：

    聲請人：獵人二字代表的是守護獵場之人，真正的獵人在守護的同時也會維持生物多樣性、顧及生態保育而非濫捕濫殺，原住民族文化中打獵是非常神聖的事，不會去預設打獵的目標或是要打多少數量，而現行的狩獵制度採「事前許可制」與傳統文化有相違之處。

    農委會：雖認同現行《野生動物保育法》的規定過於僵化，未來也將修法簡化程序，並與各部落進行協商，事前申請、事後回報」的方式確實對生物資源進行管理，也確保不會侵犯到其他部落的獵場而產生爭端。』'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
