    導演陳潔瑤表示《哈勇家》的故事不只是高山部落家庭的縮影，家庭成員間的問題與糾結，也是世上每個家庭都會面臨的問題，只是生活背景的不同，而有不同的表現，也顯現出家庭親情的可貴和價值。《哈勇家》呈現出「家家有本難唸的經」是世界通感的主題，導演陳潔瑤表示從一樣的家庭問題中，讓大家多多了解一點原住民，尤其是他們面對問題特有的「幽默感」，希望觀眾可以藉由電影感受到這個特殊的生命氣息。』根據以上報導內容，請回答以下問題：'
