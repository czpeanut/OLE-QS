    『…你離開後 世界可改變 多少無知罪愆 事過不境遷 永誌不忘記念 往事不如煙…』

    B：『…摘錄自親子天下 2022/3/28

    2000年4月20日，當時葉永鋕就讀屏東高樹國中三年級，他正上著最喜歡的音樂課，到了快要下課的時候，他一如往常把握下課前的5分鐘去上廁所，等到被其他學生發現時，他卻已經倒臥在血泊中，送醫後不治過世。葉永鋕總是在下課前匆匆上廁所，這是一件全校老師都知道的事情。葉媽媽在紀錄片中回想起葉永鋕曾向她求助，告訴她有人「每天都抓我，要脫我褲子」，她也曾向學校反映，卻因此引起反感，學校也並未處理。言語和肢體霸凌仍然發生在葉永鋕身上，他經常受到班上同學嘲笑「娘娘腔」，被迫幫同學當作業，上下學路上被修理，就連下課上廁所都會被同學強行脫褲子「驗明正身」，導致他再也不敢在下課時間去上廁所。

    葉永鋕事件纏訟七年，最後認定，葉永鋕是小便之後急著要回到教室，步下台階時卻遇地板濕滑而重心失衡，引發迷走神經性昏厥跌倒在地，頭部撞擊地面致死，因而判決校方「未營造安全合乎衛生之環境，以維護學生在校時之身心安全」。在葉永鋕媽媽陳君汝的回憶中，葉永鋕是個體貼細膩的孩子，喜歡編織和烹飪，會在媽媽工作晚歸時張羅晚餐，主動分擔家事之外，還會每天幫筋疲力竭的媽媽按摩，是別人口中說「一個抵三個」的貼心兒子。學校老師也曾說葉永鋕並非常細心，他能發現有老師身體不舒服，並主動買飲料關心，有的老師改變髮型、染髮時，他也總是第一個察覺，此外葉永鋕也愛唱歌，聲音高亢的他喜歡音樂課，因為音樂能讓聲音高亢的葉永鋕找到信心。

    而在葉永鋕過世當年，教育部將「兩性平等教育委員會」改名為「性別平等教育委員會」，離世後第4年，台灣通過了《性別平等教育法》，規範「學校應提供性別平等之學習環境，尊重及考量學生與教職員工之不同性別、性別氣質、性別認同或性傾向，並建立安全之校園空間」。』'
