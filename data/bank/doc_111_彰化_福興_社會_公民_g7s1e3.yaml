- id: doc_111_彰化_福興_社會_公民_g7s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 上述「#Me Too」運動所關心的行為
  options:
  - label: A
    content: 女職員林虛虛的薪資始終比相同資歷男同事吳格翰要來的低
  - label: B
    content: 男同事失戈故意碰觸女同事珍珍每曆的身體
  - label: C
    content: 雇主要求女性上班必須要穿三吋高跟鞋才算是專業職員
  - label: D
    content: 男職員吳象發投訴因為女裝打扮因此被公司開除
  group_stem: '3.『…社會活動人士與社區組織者塔拉納·伯克於2006年在Myspace上最早使用了「我也是（#Me Too）」這一詞。當時伯克發起了草根運動，在被性騷擾侵犯的有色人種、特別是底層女性中推廣「用同理心實現賦權」（empowerment
    through empathy），而「我也是」便是這場運動的一部分。2017年10月15日，女演員艾莉莎·米蘭諾在推特上鼓勵女性儘可能地傳播這個詞，使人們能意識到該問題的嚴重性與普遍性。當時她寫到：「如果所有被性騷擾或侵犯過的女性都能發一條『我也是』的狀態，那人們或許能認識到這個問題的重要性。」米蘭諾後來提到她受到了伯克的啟發，還說伯克的故事「感人至深、鼓舞人心」。『#Me
    Too』運動是美國演員米蘭諾(Milano)鼓勵曾受到性騷擾或性侵害的女性，勇敢說出自身經驗，讓社會重視性別暴力問題，獲得全球至少85個國家，數百萬人的響應。』

    4.『…西元1993年水利署預計動工興建瑪家水庫，但此舉將影響到魯凱族及排灣族世居的好茶村及伊拉村，導致這兩個原住民族部落將永遠被水庫吞噬，因此，反瑪家水庫的請願運動者台邦·撒沙勒帶領族人到屏東縣政府以唱歌跳舞的方式表達反對決心，最後政府在輿論壓力、族人團結與民間團體努力下，放棄興建瑪家水庫的計畫。』'
  shared_asset: g1_3_4
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
