- id: doc_111_彰化_福興_社會_公民_g7s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 以下描述何者有誤？
  options:
  - label: A
    content: 從上文中可得知原住民在資源分配上發展出重視共享互助的價值觀
  - label: B
    content: 從上文中得知 Gaga 是泰雅族的文化精神，是一種互助共享的文化價值，是一種部落族人和族人之間的連結方式
  - label: C
    content: 部落獨特的生活經驗，不僅凝聚族人的向心力，同時也塑造其身分認同，展現原住民的生命力，部落更因此能永續經營，無須擔心文化斷層與部落經濟停滯的問題
  - label: D
    content: 原住民族的認同與土地高度連結，不可分割，部落若離開原本的生活空間，容易有文化失根的危機。
