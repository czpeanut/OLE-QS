- id: doc_111_彰化_福興_社會_公民_g7s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 導演陳潔瑤想藉這部影片傳遞的訊息最不可能包含以下何者？
  options:
  - label: A
    content: 《哈勇家》的故事不只是高山部落家庭的縮影，家庭成員間的問題與糾結，也是世上每個家庭都會面臨的問題
  - label: B
    content: 《哈勇家》呈現出「家家有本難唸的經」的主題，從一樣的家庭問題中，讓大家多多了解一點原住民，希望觀眾可以藉由電影感受到這個特殊的生命氣息
  - label: C
    content: 這部片名，涵蓋的意涵，包括「哈勇」一家人的家庭生活點滴，另一要呈現的是泰雅族群體的血親共生信仰，以單一家庭帶出群體概念價值
  - label: D
    content: 部落是傳統的生活空間與信仰重心，藉此連結原住民的獨特文化，並認同自己的族群。而部落是極為鞏固原有的生活空間，不會有文化失根的危機。
  group_stem: '※請閱讀以下報導：『……入圍2022年6項金馬大獎的《哈勇家》在泰雅族原住民導演「陳潔瑤」執導下，榮獲第59屆最佳導演，而在素人演員中，林詹珍妹第一次演戲即獲得最佳女配角獎。溫暖可愛的家庭電影《哈勇家》【英文片名Gaga來自於泰雅族語Gaga，被定義為：「血族、祭祀、地緣、共食等功能，其本意為祖先定下的制度規範，逐漸變成功態群體，發揮共勞合作、同負罪責、同甘共苦的團隊精神。」】電影故事聚焦在哈勇一家人失去家中精神支柱後面對的難關，而「家家有本難唸的經」，電影所反應出的不只是哈勇家遇到的問題，也是所有家庭會面臨的難題！故事描述在宜蘭南山鄉三代同堂的泰雅家庭哈勇一家人，他們家有一位一直遵循泰雅傳統精神gaga（泰雅傳統的原則）過生活的阿公，但也有想改變家族地位的兒子，以及孫女在紐西蘭打工兩年回到家，卻開始面對一連串的事件；而女主角的父親巴尚為了家中土地特權的問題，不顧阿公的反對，決定參選鄉長，提升家族地位。然而巴尚參與的這場選戰，讓家族感情一夕凍結，如同高山上冬季的那一場雪。三代同堂的家族裡，因不同的想法互相碰撞，有著家庭中各種喜怒哀樂。

    導演陳潔瑤表示《哈勇家》的故事不只是高山部落家庭的縮影，家庭成員間的問題與糾結，也是世上每個家庭都會面臨的問題，只是生活背景的不同，而有不同的表現，也顯現出家庭親情的可貴和價值。《哈勇家》呈現出「家家有本難唸的經」是世界通感的主題，導演陳潔瑤表示從一樣的家庭問題中，讓大家多多了解一點原住民，尤其是他們面對問題特有的「幽默感」，希望觀眾可以藉由電影感受到這個特殊的生命氣息。』根據以上報導內容，請回答以下問題：'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
  answer:
  - D
  answer_source: answer_key_vlm
