- id: doc_113_台中_居仁_自然_g7s1e3_s1_36
  section: 1
  number: 36
  type: single
  page: 4
  stem: (36)下列敘述何者正確？
  options:
  - label: A
    content: 若有腦炎，發燒必定會影響腦部功能
  - label: B
    content: 若患有長期心臟疾病的病患，睡冰枕有可能導致心肺衰竭
  - label: C
    content: 生病發燒後，多吃退燒藥，可減少往後生病發燒次數
  - label: D
    content: 腦部體溫調節中樞，會調節體溫，並使體溫與外界溫度一致。
  group_stem: "12. 請閱讀下列文章，並回答以下問題：\n  傳統上，大家總認為發燒是件壞事。近年醫學界對於發燒的研究，才發現我們對於發燒居然有那麼多錯誤觀念。人們生病會發燒這件事，其實具有重要的生理意義。\n\
    \  迷思之一：發燒都是有害的，燒太久可能把腦子燒壞。\n  很多研究顯示適度發燒可以提升免疫系統的效能。人類生病的時候發燒，算是一種保護性的本能反應。41\
    \ ℃以下的發燒不會對腦神經組織直接造成傷害，目前沒有任何證據顯示高燒本身會對神經組織造成永久性的傷害。一般口耳傳說發燒把小孩腦子燒壞的事例，是因為那些小孩罹患了腦炎、腦膜炎等疾病，真正影響腦部的是腦部嚴重感染病症。\n\
    \  迷思之二：生病發燒的時候，睡冰枕會有退燒效果。\n  人體因為感染等各種疾病出現發炎反應的時候，白血球製造的一些小分子會作用在腦部的體溫調節中樞，而使體溫的定位點上升，於是人體會進行很多生理反應使體溫上升。就好比說發燒的時候，我們的腦子會認為\
    \ 38 ℃以上才是正常體溫，冰枕等物理退燒法違背腦部的設定而讓熱量流失，就好比把熱水器溫度設在 100 ℃，一面插電加溫，一面卻一直丟冰塊進去，不但讓病人有寒冷的不適感覺，也會增加無謂的能量消耗。對於代謝疾病、慢性心肺疾病、慢性貧血等患者而言，他們無法應付突增的能量需求，可能導致代謝機制崩潰或心肺衰竭，這類病人發燒時使用冰枕的危險性更高。（節錄自衛福部\
    \ 國民健康署）"
