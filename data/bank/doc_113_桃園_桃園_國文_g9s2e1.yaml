    尊重需求」、「自我實現」等層次，描述人類動機推移的脈絡。一般人通常在滿足了第一層的生理需求後，才

    能進一步追求滿足第二層的安全需求， 然後依此類推，滿足第二層 安全需求後，才會追求社交需求的滿足

