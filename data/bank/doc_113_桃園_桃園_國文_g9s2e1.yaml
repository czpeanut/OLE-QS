  stem: 關於人不可無癖一文所舉的例子，下列何者正確?
  options:
  - label: A
    content: 孔子能夠「發憤忘食，樂以忘憂」是因為有求知的癖好
  - label: B
    content: 以白居易的「我癖在章句……此病獨未去。」指自己沉痾未癒，只能靠文章自娛
  - label: C
    content: 援引幽夢影「花不可無蝶……人不可無癖。」說明有癖好能使人因興趣而有專精
  - label: D
    content: 引歐陽脩「六一居士」名號的由來，說明在人生順境中培養癖好能讓生活錦上添花。
