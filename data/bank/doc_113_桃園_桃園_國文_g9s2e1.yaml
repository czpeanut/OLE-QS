  group_stem: '列子學射，中矣，請於關尹子。尹子曰：「子知子之所以中者乎？」對曰：「弗知也。」關尹子曰：「未可。」退而習之。三年，又以報關尹子。尹子曰：『子知子之所以中乎？』列子曰：「知之矣。」關尹子曰：「可矣，守而勿失也。非獨射也，為國與身亦皆如之。」

    ----《列子》'
