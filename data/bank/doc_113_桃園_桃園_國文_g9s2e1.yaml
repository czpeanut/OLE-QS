  type: single
  page: 1
  stem: 下列有關元曲的敘述，何者為非？
  options:
  - label: A
    content: 元曲是金、元以來的新文體，由詞演變而來並具音樂性，故可稱為「詞餘」及「樂府」
  - label: B
    content: 元曲可分清唱的「散曲」及含科白可於舞台表演的「雜劇」，後者堪稱是元代的歌劇
  - label: C
    content: 元曲中，曲牌不只是曲調，也和內容有關，作者也可另加題目來概括所要抒發的主題
  - label: D
    content: 散曲可分為「小令」和「散套」，小令為單支的曲，而散套由同宮調的若干小令組成。
