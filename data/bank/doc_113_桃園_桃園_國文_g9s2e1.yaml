  section: 2
  number: 38
  type: single
  page: 6
  stem: 根據本文，下列何者解釋了男性傾向於將「軟弱的情感」推開的原因？
  options:
  - label: A
    content: 男性天生對各種情感的感知力較為薄弱
  - label: B
    content: 抽象思考能力與感性同理能力兩者難以並存
  - label: C
    content: 長期以來男尊女卑觀念所造成的社會刻板印象
  - label: D
    content: 與負責狩獵所演化來的天性有密不可分的關係。
  group_stem: "能夠順暢與自己的「情感溝通」的人，會遠比「壓抑情感」的人更容易反思自我，也更容易解決自己的問題。習於壓抑的人並非只會壓抑自己的情感，他們通常也不喜歡反思自我及自己的人生，這多半是出於某種潛意識的恐懼，害怕因而讓許多負面情感在自己身上油然而生。他們顯然不願意把注意力放在自己身上。\n\
    \ 特別是男性，無論是天性還是教育使然，往往傾向於完全認同自己的理智及理性，以致不太具有感性能力。這種情況當然不是男性的專利，只不過整體來說，男性比女性更傾向於將悲傷、無助和恐懼等「軟弱的情感」推開，而對那些「強大的情感」，例如快樂、憤怒，大多數男性則能夠良好感知。\n\
    \ 千百年來，男性的社會化方向讓男性不被允許顯露任何軟弱的情感，直到近期才有些轉變。如今男孩也可以顯露悲傷或恐懼。\n 然而除了教育的影響以外，男性在演化上也具有將情感擱在一旁的天性，這點與石器時代的男女分工有關。如果男性想要狩獵成功，就必須擁有可以暫時將軟弱情感擱置的能力。他們必須勇敢。女性雖然也必須勇敢，不過無論是石器時代或今日，她們的責任範圍多半還是在家庭這個區塊。在這個領域裡，同理能力比勇敢更有用。就這點來說，男性帶有將這個世界物化的遺傳天性，女性則帶有較能同理他人的遺傳天性。\n\
    \ 男性這種將負面情緒推開的傾向，絕對有其優點，特別是涉及解決與具體事物有關的問題時。然而在人際關係方面，某些男性扁平的感情經驗就會造成問題。為了能進入或評價某種狀況，情感是不可或缺的。情感會顯示出，某項事物對我們的重要與否，例如:「恐懼」會警告我們小心危險，驅使我們避難；「悲傷」會讓我們曉得，我們失去某些更重要的東西；「羞愧」則代表我們違反了某項社會或個人規範；至於「快樂」則會告訴我們，我們從什麼事物上能夠獲得樂趣。\n\
    \ 如果一個人很少接觸自己的情感，那麼他在了解自己的需求上也會有障礙，也因此，不少人都會抱怨不曉得自己要的是什麼。我見過不少在抽象思考上極富才智，但對自己的生活一籌莫展的男性，他們總是糾結在自己的抽象思考中，每當必須做出情緒上的重要決定時，他們總是仔細列出利弊得失。他們缺乏與自己感情的接觸，這些情感其實可以與他們的理性思考共同攜手，為他們指出一個方向。\n\
    〈改寫 史蒂芬妮˙史塔爾 壓抑問題的人和不太有感覺的人〉"
