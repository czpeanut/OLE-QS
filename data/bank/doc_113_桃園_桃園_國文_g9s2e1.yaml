  stem: 「人不可以無癖」，句中運用「不可」、「無」兩個否定詞來表示肯定，這種句式稱為「雙重否定句」。下列「 」 中的詞語，何者不是以雙重否定來表達肯定的意思？
  options:
  - label: A
    content: 由於事出緊急，考慮不周也是「無可厚非」的
  - label: B
    content: 拜科技所賜，網路的「無遠弗屆」使天涯若比鄰
  - label: C
    content: 作為這宗案件的唯一目擊者，我一定「知無不言」
  - label: D
    content: 司法辦案應秉持「無徵不信」的立場，才足夠公正。
