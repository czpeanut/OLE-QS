  group_stem: '楚有直躬者，其父竊羊而謁之上，上執而將誅之。直躬請代之。將誅矣，告吏曰:「父竊羊而謁之，不亦信乎？父誅而代之，不亦孝乎？信且孝而誅之，國將有不誅者乎？」荊王聞之，乃不誅也。孔子聞之曰：「異哉！直躬之為信也，一父而載①
