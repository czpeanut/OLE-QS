  - label: B
    content: 少小離鄉老大回，鄉音無改鬢毛衰。兒童相見不相識，笑問客從何處來
  - label: C
    content: 冰簟銀床夢不成，碧天如水夜雲輕。雁聲遠過瀟湘去，十二樓中月自明
  - label: D
    content: 草滿池塘水滿陂，山銜落日浸寒漪。牧童歸去橫牛背，短笛無腔信口吹。
