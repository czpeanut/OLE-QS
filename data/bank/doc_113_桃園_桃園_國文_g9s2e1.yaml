  stem: 關於人不可無癖一文的文句理解，下列何者敘述有誤？
  options:
  - label: A
    content: 宜玲：「事到可傳皆具癖」-- 一個人的喜好到廣為人知，成為個人標誌後，那就可說是癖好了
  - label: B
    content: 學友：「人無癖，不可與交，以其無深情也。」--人如果沒有嗜好，就是性情中人，可以與之深交
  - label: C
    content: 文傑：「人生自是有情痴，此恨不關風與月。」--多情之人就算不因外在環境也易為情所困、為情所苦
  - label: D
    content: 人偉：「花若盛開，蝴蝶自來。」--人生與其不斷苦苦追求，何不好好充實自己，而使生命多彩且豐盈。
  lesson_raw:
