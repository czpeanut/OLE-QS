  stem: 關於天淨沙 秋思 一曲，下列何者敘述為非?
  options:
  - label: A
    content: 由「西風」可推知描寫的季節為秋天
  - label: B
    content: 全篇多由動態的景物並列而成，藉景襯情
  - label: C
