    content: 陳美雲支持吳季剛探索與發展自己的興趣喜好，是因為人性尊嚴必須受到平等的尊重
  - label: D
    content: 陳美雲會因為親友和同學的嘲弄而傷心落淚，覺得自己的人性尊嚴受到侵犯。
  group_stem: "出生於台灣的國際知名服裝設計師吳季剛，從小就不同於一般男孩喜歡槍砲汽車等玩具，反而特別喜歡玩洋娃娃，還經常托人幫他蒐集，就連出門逛街都吵著要買洋娃娃，母親陳美雲為了吳季剛的喜好，家中堆滿了洋娃娃。還喜歡研究京劇名伶的戲服，他喜歡任何跟「美」有關的事物，因此除了洋娃娃外，也包含衣服、建築與各種藝術品等。\n\
    \  但這也得多虧吳季剛的母親陳美雲，陪著兒子一路走來，陳美雲知道在這榮耀的背後有多少的努力與不為人知的辛酸，因為從小愛玩洋娃娃的吳季剛，就曾因親友和同學的嘲弄而傷心落淚，所以陳美雲相當重視培養孩子的天分，也要求孩子必須具備基礎教育，不僅開發了吳季剛的天賦，也致力於擴展他的視野，在背後全心全意的支持著吳季剛探索與發展自己的興趣，才能成就今天的他。\n\
