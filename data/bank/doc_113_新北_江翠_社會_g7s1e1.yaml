  stem: 吳季剛探索自我，發現自己是誰，勇於追逐自己的興趣與夢想，最後成為國際知名服裝設計師，關於吳季剛個人擁有得以自我決定的能力與機會，即是人性尊嚴的一種具體實踐，請問下述何種情形不屬之？
  options:
  - label: A
    content: 10 歲的小智，花了25 年的時間旅行與努力，終於獲得寶可夢世界大賽的冠軍，成為寶可夢大師
  - label: B
    content: 15 歲的日向翔陽在國中時努力練習排球，招集社員，終於順利湊足六人參加比賽，首戰雖敗猶榮
