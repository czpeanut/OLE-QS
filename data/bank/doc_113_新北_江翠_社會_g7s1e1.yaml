  section: 1
  number: 7
  type: single
  page: 1
  stem: 右圖為「原住民族日」宣傳海報，起源是原住民族四百多年來受到外來政權輪番的統治，不同年代被賦予不同的名稱，這些名詞常帶有歧視涵義，而且是被汙名化的符號。2005年行政院相關法案通過，明定每年8月1日為「原住民族日」。有關原住民的敘述，請問：下列何者「錯誤」？
  options:
  - label: A
    content: 屬於南島語族，主要分布於大西洋群島上
  - label: B
    content: 清帝國時期分為生番與熟番，差別是有無納稅、服勞役
  - label: C
    content: 日治時期分為高砂族與平埔族
  - label: D
    content: 目前官方認定台灣原住民族有16族。
