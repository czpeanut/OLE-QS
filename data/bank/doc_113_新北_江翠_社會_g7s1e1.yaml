- id: doc_113_新北_江翠_社會_g7s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 我們常透過考古遺址的文物推論當時的生活情景，請問：由上述資料內容來判斷，這些遺址出現的先後順序為何?
  options:
  - label: A
    content: 資料一、資料二、資料三
  - label: B
    content: 資料二、資料三、資料一
  - label: C
    content: 資料三、資料二、資料一
  - label: D
    content: 資料二、資料一、資料三。
  group_stem: '丁丁對史前文化非常有興趣，還打算用史前文化做歷史期中報告，在蒐集資料時，找到以下內容：

    資料一：這裡出土的文物極為豐富，光是石棺就多達二千多具，更有陶器、玉器、石器等數以萬計，以人獸形玉器載具特色。

    資料二：考古學家在遺址裡發現單面偏鋒砍器、石片器、小型尖石器、骨針、骨尖器等生活工具，當時人類利用海濱洞穴遮風避雨，並能打製生活工具及生火煮飯。

    資料三：這個考古遺址中發現中國大陸和東南亞一帶的銅錢，金屬裝飾品、繩紋陶器、煉鐵爐殘渣及瑪瑙珠首飾，反映當時生態發展概況。'
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 歷史
      code: 1-1
      title: 考古發掘與史前文化
      chapter: 第1章 史前臺灣與原住民文化
