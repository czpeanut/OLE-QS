  stem: '文化層是指過去人類生活遺留下的遺物、遺跡，在地層中堆積形成的地層順序，江翠國中在整建操場時挖掘到不同年代的三個遺址，在各遺址中找到的文物如右表。請問：依照文化層形成的情況來說，這三個遺址如果由上到下挖掘，出土的先後順序應該為何？


    | 甲遺址 | 乙遺址 | 丙遺址 |

    | --- | --- | --- |

    | 陶器 | 灰燼 | 石器 |

    | 鐵渣 | 石器 | 灰燼 |

    | 銅錢 | 骨針 | 陶片 |'
