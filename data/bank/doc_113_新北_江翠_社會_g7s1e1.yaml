- id: doc_113_新北_江翠_社會_g7s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 小軒暑假參觀歷史博物館時看到一段台灣17世紀時的歷史紀錄記錄「今天指揮官召開議會做出決議，一旦天氣許可，就要帶軍隊出發去淡水，遵照在大員的長官命令，在那裡尋找一個適當地方以興建城堡。又遵照總督閣下與東印度議會的指令，要把所有西班牙人屬下的人員，全部送去大員。⋯⋯議會結束後，指揮官命令被俘虜的西班牙人與其他人，要他們立刻去小船那裡，在傍晚以前都運上船。」請問：由以上資料推測，這段紀錄的時空背景為何？
  options:
  - label: A
    content: 1624年，西班牙人被沈有容趕出澎湖後，轉往臺灣北部
  - label: B
    content: 1626年，西班牙與葡萄牙爭奪澳門失利，改往淡水發展
  - label: C
    content: 1642年，荷蘭人從大員北上，將西班牙人趕出臺灣北部
  - label: D
    content: 1664年，日本政府開始鎖國後，西班牙人被迫離開臺灣。
