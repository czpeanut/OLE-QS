  group_stem: 'Funny Pun Joke

    A teacher asked her class, “Why did the student bring a ladder to school?”

    One student raised his hand and guessed, “To clean the windows?”

    The teacher smiled and shook her head.

    Another student said, “Maybe to fix the lights?”

    The teacher laughed and replied, “No, he brought it because he wanted to go to

    high school!”


    The whole class burst into laughter.

    Then the teacher added, “And why did the math book look so sad?”

    The students thought hard, but no one knew.

    The teacher said, “Because it had too many problems!”

