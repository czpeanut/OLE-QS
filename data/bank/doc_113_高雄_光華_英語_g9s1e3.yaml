  group_stem: 'Comparing Typhoon Krathon and Hurricane Milton


    In 2024, Typhoon Krathon hit Taiwan in October, while Hurricane Milton struck
    the southeastern United States in September. Both storms were powerful, but they
    had different impacts because of their positions and characteristics.


    Typhoon Krathon brought very strong winds, reaching speeds of 185 kilometers per
    hour. These winds caused power outages and damage to buildings in Taiwan’s coastal
    areas. Krathon also caused heavy rainfall, which led to flash floods in some areas,
    making it difficult for people to travel safely.


    Hurricane Milton, however, had slightly weaker winds at around 160 kilometers
    per hour but brought rain over several days. This led to very serious flooding
    in many neighborhoods, and some areas even experienced landslides because of the
    very wet ground.


    One major difference between these two storms is where they form: typhoons like
    Krathon develop in the Pacific Ocean, while hurricanes like Milton form in the
    Atlantic Ocean. Both storms show the importance of being prepared for extreme
    weather.

