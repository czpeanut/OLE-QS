  group_stem: 'Animals’ Super Noses


    Did you know that some animals have an amazing sense of smell? While humans rely
    a lot on their vision, many animals depend on their noses to understand the world.
    For example, dogs have about 300 million smell receptors in their noses, compared
    to only 5 million in humans. This helps them detect smells that we can’t even
    imagine. They can be trained to find things like explosives or drugs, and some
    can even feel sickness like cancer!


    Another animal with a powerful nose is the African elephant. Elephants can smell
    water from several kilometers away, helping them be able to live in dry weathers.
    Sharks, on the other hand, use their smell to hunt underwater. They can detect
    even a little bit amount of blood in the water, which leads them to injured fish.


    Each of these animals uses its sense of smell in unusual ways to be alive and
    find food. Their super noses show just how interesting and different the animal
    kingdom is from us!

