- id: doc_113_新北_江翠_自然_g9s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 「民眾舉報黃老闆工廠中有一批盜採的岩塊，稽查人員到達黃老闆宣稱採集岩塊的地點進行了解，發現此地的岩塊外形比較圓滑，體積較小，而工廠中的岩塊有稜有角，體積也較大，且該地點幾乎不見與工廠中外形、大小相似的岩塊，令稽查人員懷疑黃老闆謊報其採集地點……」根據上述資訊，關於黃老闆實際盜採岩塊的地點與說明，最可能為下列何者？
  options:
  - label: A
    content: 河川上游，因上游雨量較豐沛，岩塊體積普遍較大
  - label: B
    content: 河川下游，因下游河水流量大，岩塊體積普遍較大
  - label: C
    content: 河川上游，因岩塊被搬運距離短，形狀普遍有稜有角
  - label: D
    content: 河川下游，因岩塊被搬運距離長，形狀普遍有稜有角。
  tags:
