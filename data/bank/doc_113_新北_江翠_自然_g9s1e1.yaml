- id: doc_113_新北_江翠_自然_g9s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 當岩石受到壓力、溫度、海水等因素影響，會逐漸破裂，而海浪長期在破裂的裂隙中反覆作用，使裂隙加大，會形成一塊塊形狀像豆腐的岩石，稱為「豆腐岩」。根據上述資訊，「豆腐岩」的形成原因應以哪兩種地質作用為主？
  options:
  - label: A
    content: 風化作用與侵蝕作用
  - label: B
    content: 風化作用與沉積作用
  - label: C
    content: 侵蝕作用與沉積作用
  - label: D
    content: 搬運作用與沉積作用。
