- id: doc_113_新北_江翠_自然_g9s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 艋舺被視為臺北市的發源地之一，亦為當時台灣原住民交易之地。當時平埔族與泰雅族原住民則多以獨木舟自淡水河上游載運農、獵產品等物與漢人交易； 艋舺因港商之利，曾經盛極一時，於清代，與臺南府城、彰化鹿港並列為臺灣三大城鎮，有「一府二鹿三艋舺」之稱。1860
    年代以後，艋舺港口因河沙淤積，功能逐漸被同安人群聚的大稻埕取代。試推測造成此種改變的主要原因應為下列何者？
  options:
  - label: A
    content: 大地震造成地殼變動
  - label: B
    content: 沿海陸地隆起，海水遠離
  - label: C
    content: 海平面下降，海水遠離
  - label: D
    content: 河川淤沙導致海岸線外移。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 地科
      code: 5-2
      title: 地表的改變與平衡
      chapter: 第5章 地球的環境
