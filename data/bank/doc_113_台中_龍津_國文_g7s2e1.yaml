    content: 每天半夜起來手工揉拌糯米粉，大塊切條後蒸煮販售
  - label: B
    content: 阿媽肉粿的攤位在大灣濱海小城的某一處小小廣場裡
  - label: C
    content: 肉粿煎妥，加上肉羹、肉燥、辣醬、蛋是內行人吃法
  - label: D
    content: 阿媽年紀大了，食客多會忙不過來，堅持不願被報導。
  group_stem: '彎進一條不知名的小巷弄，眼前就是傳奇的無名肉粿。那是一位阿媽的攤位，默默的在永康區 大灣的傳統菜市裡，經營了四十多年。

    前有南鯤鯓分身的五府千歲，後有百年的萬善堂。小小廣場十來蔬果菜販或小吃攤，都沒什麼店名。阿媽的也是，只掛一個招牌，兩個斗大的字「肉粿」，告知此攤販賣的內容。所幸當地人都熟識，顧客群亦囿於此。

    眼前的肉粿和我在此屏東接觸的很不同。屏東視肉粿為在地代表美食，糯米炊煮講究，大塊蒸煮後切條，再加豬肉、香腸和蝦猴等等，盡露濱海小城的精緻。大灣一帶，乃鄉下點心，半夜起來手工揉拌糯米粉，再做成一塊塊小圓餅，不摻任何食品添加物，以煎餅的方式販售。

    肉粿煎妥後，放進碗裡，淋上肉羹，接著加入肉燥和蒜泥，口味重者還能添上豆瓣醬、醬油。內行人更懂得加個蛋，再一匙阿嬤自製的辣醬，一道好吃又便宜的美食便有形了。我一囫圇吞，忘形的吃了兩碗。

    阿媽邊煎可是邊勸說，呷歡喜就好，不要報導出去。萬一要寫，那便拜託，不要描述得太好。現下光是照顧附近鄉里的食客，就忙不過來。太多遊客按圖索驥到來，她的身體負荷不了。可她又那麼好客，多麼希望跟大家分享，這道傳統在地食物的美好。一邊說著，還取出番茄和有機地瓜請我吃。

    後來，我便逐漸懂了，不要介紹是客套，不宜形容得太好吃則是真心話。光顧這攤，享受的真不只是食物的風味，還有人情味。（劉克襄 大灣阿媽的肉粿信念）'
