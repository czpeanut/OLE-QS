- id: doc_113_台中_龍津_國文_g7s2e1_s4_4
  section: 4
  number: 4
  type: single
  page: 3
  stem: 根據本文，作者的父親為何「仰著臉，覷著眼睛」？
  options:
  - label: A
    content: 天氣太冷
  - label: B
    content: 笑得很開心
  - label: C
    content: 室內的燈光太暗，視線不清楚
  - label: D
    content: 鍋子太高，要站起來從熱氣中夾豆腐。
  group_stem: '說起冬天，忽然想到豆腐。是一「小洋鍋」（鋁鍋）白煮豆腐，熱騰騰的。水滾著，像好些魚眼睛，一小塊一小塊豆腐養在裡面，嫩而滑，彷彿反穿的白狐大衣。鍋在「洋爐子」（煤油不打氣爐）上，和爐子都熏得烏黑烏黑，愈顯出豆腐的白。這是晚上，屋子老了，雖點著「洋燈」，也還是陰暗。圍著桌子坐的是父親跟我們哥兒三個。「洋爐子」太高了，父親得常常站起來，微微地仰著臉，覷著眼睛，從氤氳的熱氣裡伸進筷子，夾起豆腐，——地放在我們的醬油碟裡。我們有時也自己動手，但爐子實在太高了，總還是坐享其成的多。這並不是吃飯，只是玩兒。父親說晚上冷，吃了大家暖和些。我們都喜歡這種白水豆腐，一上桌就眼巴巴望著那鍋，等著那熱氣，等著熱氣裡從父親筷子上掉下來的豆腐。

    無論怎麼冷，大風大雪，想到這些，我心上總是溫暖的。（朱自清 冬天）'
