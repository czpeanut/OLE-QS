- id: doc_113_台北_誠正_英語_g8s2e3_s6_39
  section: 6
  number: 39
  type: single
  page: 2
  stem: 39. What is the author’s purpose(目的) in writing this passage?
  options:
  - label: A
    content: Teach people how to make money from trash.
  - label: B
    content: "Have people waste less and think more before throwing \nthings away."
  - label: C
    content: Tell people about a kind of popular exercise in the USA.
  - label: D
    content: Ask companies to charge poor people less.
  group_stem: '(一)

    Hi, I’m Anna Sacks from the USA. I started an activity : trash walking. Every
    day, many people and businesses throw away clothes, food, and home appliances
    even though these things are still good to use. To stop this waste, I walk around
    the streets, open trash bags, look for usable things. These things may still be
    clean or not broken. I keep some of them for myself and give others to people
    in need. I often find food, books, clothes, and things like soap.

    I also share my “trash walking” experiences on Instagram and TikTok. In my videos,
    you will see shops throw away items because of some law problems. For example,
    in the USA, companies get more money back from taxes if they throw things away
    instead of giving them to others for free.

    My biggest goal is to help people buy more carefully and keep using the things
    they already have for as long as possible. I hope you can start “trash walking”,
    too. We should feel proud to do this because it can help the planet and the people.

     home appliances 家用品 tax 稅 law 法律 goal 目標'
