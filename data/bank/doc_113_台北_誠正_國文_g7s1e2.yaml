    \    小象長大變成了大象，在馬戲團中可以做很多的表演。大象力大無窮，可以搬很多東西，但在表演後，卻很安分的被繩子拴在木樁上。\n    大象的力量其實是很大的，但是牠因為從小的經驗，覺得木樁的力道比自己大，是唯一可以拴住自己的東西，使得牠不敢去移動木樁。其實大象是被自己以前的觀念所束縛，不了解自己的體力已有很大的改變了，因而放棄了想移動木樁的念頭。"
