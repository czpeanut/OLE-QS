  group_stem: "人民識字率被視為一個關鍵的發展指標，因為它與教育機會、經濟增長、健康和社會參與等方面有密切相關。聯合國通過可持續發展目標(SDGs)提出了提高全球識字率的目標，以促進包容性和可持續的發展。\n\
