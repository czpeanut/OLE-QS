  group_stem: 海圍著山，山圍著我。沙田山居，峰迴路轉，我的朝朝暮暮，日起日落，月望月朔，全在此山中度過，我成了山人。問余何事棲碧山，笑而不答，山已經代我答了。其實山並未回答，是鳥代山答了，是蟲，是松風帶山答了。山是禪機深藏的高僧，不輕易開口的。人在樓上倚欄杆，山列坐在四面如十八尊羅漢疊羅漢，相看兩不厭。早晨，我攀上佛頭去看日出，黃昏，從聯合書院的文學院一路走回來，家，在半山腰上等我，那地勢，比佛肩還低，卻比佛肚子要高些。這時，山什麼也不說，只是爭噪的鳥雀洩漏了他愉悅的心境。等到眾鳥棲定，山影茫然，天籟便低沉下去，若斷若續，樹間的歌手才歇下，草間的吟哦又四起。
