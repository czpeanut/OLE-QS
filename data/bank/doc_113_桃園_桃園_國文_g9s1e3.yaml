  group_stem: '【甲】 夫頭上有緌，則其文也；含氣飲露,則其清也；黍稷不食，則其廉也；處不巢居，則其儉也；應候守節，則其信也；加以冠冕，則其容也。君子則其操，可以事君，可以立身，豈非至德之蟲哉?
    (陸雲 寒蟬賦 )

    【乙】 蚱蟬，夏月身與聲俱大，始終一般聲。乘昏夜，出土中，升高處，拆背殼而出。日出則畏人，且畏日炙乾其殼,不能蛻也。至時寒則墜地，小兒畜之，雖數日亦不飲食。古人言其飲風露，觀其不糞而溺，亦可見矣。
    (李時珍 本草綱目 )

    【丙】 晨間聽蟬,想其高潔。蟬該是有翅族中的隱士吧！高據樹梢，餐風飲露，不食人間煙火。那蟬聲在晨光朦朧之中分外輕逸，似遠似近，又似有似無。一段蟬唱之後，自己的心靈也跟著透明澄淨起來，有一種「何處惹塵埃」的了悟。蟬亦是禪。
    (簡媜 夏之絕句 )'
