  stem: 蘇東坡突圍一文，以多面向來詮釋蘇軾貶謫黃州後，心境上的圓融與內斂。文中所說的「成熟」和實際上生活相對應的例子，下列不適當的選項是：
  options:
  - label: A
    content: 一種圓潤而不膩耳的聲響 → 面對他人的錯處，能委婉的給予指正
  - label: B
    content: 一種並不陡峭的高度     → 雖然貴為公司的執行長，但對待員工十分客氣
  - label: C
    content: 一種不再需要對別人察言觀色的從容 → 即使聽到別人的惡意批評也無動於心
  - label: D
