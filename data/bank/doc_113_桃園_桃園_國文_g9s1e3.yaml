  group_stem: "蘇東坡在最落難的時候，在岸邊寫下「大江東去，浪淘盡」，寫出最好的詩句出來。受到皇帝賞識時，他的書法好漂亮、工整、華麗，而且得意。因為他是一個才子，才子總是很得意的。但是他從來沒有想過，他讓很多人受過傷。他得意的時候，很多人恨得要死，別人沒有他的才氣，當然要恨他。但是他落難寫的書法，這麼笨、這麼拙，歪歪倒倒無所謂，卻變成中國書法的極品。\n\
    \    此時苦味出來了，他開始知道生命的苦味，並不是你年輕時得意忘形的樣子，而是在這麼卑屈、所有的朋友都不敢見你的時候，在河邊寫出最美的詩句。他原來是一個翰林大學士，但因為政治，朋友都避得遠遠的。當時他的朋友馬夢得，不怕政治上受連累，就關說把那個地方的軍營靠東邊的地，撥給蘇軾夫婦使用，所以蘇軾就改名叫蘇東坡。蘇東坡開始在那裡種田、寫詩，他忽然覺得：我何必一定要在政治裡爭這些東西？為什麼不在歷史上建立一個光明磊落的生命情感？所以他那時候寫出最好的詩。他有米可吃了，還跟他太太說，讓我釀點酒喝好不好？他還是要喝酒！\n\
    \     「夜飲東坡醒復醉」是說，晚上就在這個坡地喝酒，醉了又醒、醒了又醉；「歸來彷彿三更」則是，回來已經很晚。「家童鼻息已雷鳴」是說，當地還有一個小孩幫他管管家務，但是他睡著了，鼻子打呼。「敲門都不應」意思是指，蘇東坡敲門都不應。我們看到他之前的詩，敲門都不應，就要發脾氣了，可是現在就算了，他就走去聽江水的聲音，「倚仗聽江聲。」\n\
    \    蘇軾變成了蘇東坡後，他覺得醜都可以是美。他開始欣賞不同的東西，他那時候跑到黃州的夜市喝點酒，碰到一身刺青的壯漢，那個人就把他打在地上說：「什麼東西，你敢碰我！你不知道我在這裡混得怎樣？」他不知道這個人是蘇東坡，然後倒在地上的蘇東坡，忽然就笑起來，回家寫了封信給馬夢得說：「自喜漸不為人知。」我覺得是了不起生命的過程，他過去為什麼這麼容易得意忘形？他是才子，全天下都要認識他，然後他常常不給人好臉色，可是落難之後，他的生命開始有另外一種包容，有另外一種力量。\n\
    \    所以我覺得，蘇東坡酸甜苦辣鹹百味雜陳最後出來的一個味覺是「淡」，所有的味覺都過了，你才知道淡的精采，你才知道一碗白稀飯、一塊豆腐好像沒有味道，可是這個味覺是生命中最深的味覺。"
