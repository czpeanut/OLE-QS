- id: doc_113_桃園_桃園_國文_g9s1e3_s2_29
  section: 2
  number: 29
  type: single
  page: 5
  stem: 本文中提到「待對方報清了名字，我不由自主地握著電話筒站起身來」，這是為什麼？
  options:
  - label: A
    content: 內心驚慌不知所措
  - label: B
    content: 受寵若驚的感覺
  - label: C
    content: 愕然的瞬間舉動
  - label: D
    content: 對老師孺慕之情的自然動作。
  group_stem: '實在想不到，在接不完的電話中，生楞楞地插進來一個蒼老的聲音。待對方報清了名字，我不由自主地握著電話筒站起身來：那是我三十年前讀中學時的老師穆尼先生。他在電話中說，三十年前的春節我曾和同學曹齊合作，畫了一張賀年片送給他。老人說：「你們能不能補畫一張送我，作為我晚年最珍貴的收藏？」

    放下了電話，我立刻斷定，這將是我繁忙的歲末活動中最有意義的一件事。

    我呆坐在書桌前，腦海中出現了六○年代初，歡樂而清苦的中學生活。那時候，中學教師中很奇異地隱藏著許多出色的學者。哪怕是再稚嫩的目光，也能約略辨識學問和人格的亮度。我們當時才十四、五歲，一直傻傻地想著感激這些老師的辦法。到放寒假，終於有了主意，我和曹齊代表全班同學繪製賀年片。就是那點稚拙的塗畫，竟深深地鐫刻在一位長者的心扉間，把三十年的歲月都刻穿了。

    今日的曹齊，已是一位有名的書畫家，當他一聽到穆尼老師的要求，和我一樣，把手上的工作立即停止……。現在，這卷書畫已送到穆尼老師手上。

    老師，在你面前，為你執筆，我們頭上的一切名號、頭銜全都抖落了，只剩下兩個赤誠的學生。只有在這種情況下，我們才能超拔煩囂，感悟到某種跨越時空的人間至情。

    （節錄自余秋雨 三十年的重量）'
