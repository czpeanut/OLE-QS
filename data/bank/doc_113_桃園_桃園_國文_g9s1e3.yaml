    \ 此外，專業人才的養成也需要時間和教育成本，農政與司法分屬不同專業領域，養成系統也不同，實在難以要求農政體系出身的動檢員同時具備刑事調查技能，反過來要求司法人員同時具備動保專業，也同樣強人所難。\n\
    \                                                                            (改寫自網路文章)"
