- id: doc_113_桃園_桃園_國文_g9s1e3_s2_32
  section: 2
  number: 32
  type: single
  page: 6
  stem: '根據第二篇文章，關於設置動物法醫及動保警察面臨的困境，下列說明何者正確？


    | 選項 | 動物法醫 | 動保警察 |

    | :--- | :--- | :--- |

    | （Ａ） | 缺乏願跨足動物界的法醫人才 | 須提升層級以利指揮其他單位 |

    | （Ｂ） | 需加強司法體制的規範和支援 | 牽涉不同專業領域的人才培養 |

    | （Ｃ） | 所需具備之專業技術門檻過高 | 動保專業的需求高於司法專業 |

    | （Ｄ） | 社會地位比一般法醫相對要低 | 較難在動保界中延攬相關人才 |'
  options:
  - label: A
    content: （Ａ）
  - label: B
    content: （Ｂ）
  - label: C
    content: （Ｃ）
  - label: D
    content: （Ｄ）
  group_stem: "為鴉申冤\n    唐 溫璋為京兆尹，勇於殺戮，京邑憚之。一日，聞挽鈴聲，俾看架下，不見有人。凡三度挽掣，乃見鴉一隻，尹曰：「是必有人探其雛而訴冤也。」命吏隨鴉所在捕之。其鴉盤旋，引吏至城外樹間，果有人探其雛，尚憩樹下。吏乃執之送府。以禽鳥訴冤，事異於常，乃斃捕雛者而報之。\n\
    \                                                             ( 選自北夢瑣言．卷十 )\n\n\
    設立動物法醫及動保警察-為沉默的動物伸張正義\n     動物受虐就像人類遭到家暴一樣，需要到醫院驗傷證明受害程度，找出受傷的原因。如果受虐者不幸死亡了，也要送到專業的動物法醫機構驗屍來確定死因，因此，動物法醫之於動物虐待案件，確實有其必要性。\n\
    \    無論是處理人類非正常死亡案件或動物虐待致死案件，遺體解剖都是其中非常重要的蒐證環節，透過遺體解剖，可以從其身上的跡證還原受害經過，輔助法官判斷兇手的罪行是否成立。專家認為每個動物受虐致死案件都應解剖，才能強化「物證、受害者、兇手、現場」四項犯罪偵查要素的連結，確立犯罪事實，如此一來，即使行為人證詞反覆，也不用擔心會混淆事實。\n\
    \    國內法醫隸屬法務部，有《法醫師法》作為其權利與義務的依據，但動物法醫目前仍無相關法令依據，採證、分析的過程也缺乏可依循的標準流程。現況是動物法醫提出的證據公信力容易受質疑，法庭上也未必能被採用。\n\
    \    在法律認定上，當動物重傷或死亡，動保案件就涉及刑事責任，這時才由警察介入調查。不過實務上，只要動檢員合理懷疑虐待案件涉及刑案，就可以找警方協助。但並不是每一次，動檢員都和警察合作無間。如曾有受虐貓咪被困在屋內，最後破門救貓的不是動檢員，也不是警察，而是民間的愛貓人士。雖然案發時已經通報警察和動保處，但是現場只有不得其門而入的警察，而沒有動保處的人影。警方現場再次電話聯繫動保處，得到的回應是動保處沒有權利破門，也不會到現場來。因為動保處和警察彼此是平行單位，動保處並不像檢察官可以指揮警察辦案。\n\
    \    由於動保法同時涉及行政處分與刑罰，需要動保和司法兩種專業。因此設立動保警察是提高動保與警察合作效率的最佳方案。但是設立動保警察牽涉許多複雜問題，無論設置在農政或者是警政單位之下，都會涉及到人力增補、經費增加，還有職權的調整。耗費的人力、物力、財力都非常可觀，在政府預算有限的狀況下較難以實現。\
    \ 此外，專業人才的養成也需要時間和教育成本，農政與司法分屬不同專業領域，養成系統也不同，實在難以要求農政體系出身的動檢員同時具備刑事調查技能，反過來要求司法人員同時具備動保專業，也同樣強人所難。\n\
    \                                                                            (改寫自網路文章)"
