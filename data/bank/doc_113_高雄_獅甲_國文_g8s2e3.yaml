    content: 唐朝賞梅之風傳入日本後，成為上層社會的時尚活動
  - label: C
    content: 長屋王因謀反獲罪，大伴旅人亦受牽連而貶為大宰帥
  - label: D
    content: 山上憶良與大伴旅人曾同往唐朝，故能先識梅花之美。
  group_stem: "(二)41-42 題\n    「唐朝人愛牡丹，也賞梅花。我回日本後不久，賞梅之風開始吹到國內，貴族競相模仿。」三十年前曾跟隨遣唐使到唐朝的山上憶良，向大宰府的賓客們介紹梅花宴的起源。位於九州的大宰府，是與朝鮮半島、中國往來的門戶，自然有更多機會接觸外來文化。\n\
    \  這天是公元730 年正月十三。府邸庭園覆雪，梅花盛開。\n  「請大家輪流以梅賦歌一首吧！山上大夫，麻煩記錄下來。我會寫篇短文，述說此刻坐擁天地的歡愉。」大伴旅人就任大宰帥已經兩年。此前，他在朝廷位高權重，但藤原家族的有意排擠，使他不得不離開京城。到職不久，妻子因病過世；隔年，政治盟友長屋王被控謀反而遭賜死。接連而來的人生衝擊，讓已屆耳順之年、也讀過老莊思想的他，對生命體悟良深。\n\
    \  當晚，大伴旅人寫好序言，喚山上憶良同看。\n  「您這是……從王羲之〈蘭亭集序〉得到啟發吧？」\n  「這當中完全沒有王羲之『死生亦大矣，豈不痛哉』的省思，就算有些許文句相似，離〈蘭亭集序〉還遠得很！」\n\
    \  「就是因為您經歷過死生之痛，才想在這遠離京城的大宰府，召集類似『蘭亭脩褉』的聚會吧！我注意到您用了跟〈蘭亭集序〉相同的『快然自足』四個字，想必希望大家在梅花宴中，一同體驗『欣於所遇』的境界。」\n\
    \  「我確實這麼想。所以不希望大家又抒發戍邊、思鄉之情。中國梅花詩雖然常這麼寫，但也有單純投入欣賞、充滿美感聯想的那面。賞花正應如此。」\n  「早知要由此著筆，我的歌就不會只呼籲相偕同樂，莫負良辰『梅』景了。您的歌以雪喻梅，真是絕佳示範！」"
