    \ |\n\n乙\n\n丙\n    珠說得對，不必對未來感到迷惘。我知道我在臺灣所賺的錢，不能保證我家人的未來會好好的，但就如珠所說的，若有上帝的照顧，我還擔心什麼呢？\n\
    \    雇主對我做的決定感到驚訝，但我向他們保證，一定會找到比我更好的代替者。他們最終同意我的決定，這個月便是我工作的最後一個月。\n    「這是我們最後一年看龍舟賽了。」我呼喚珠。「以後一定會很想念的。」\n\
