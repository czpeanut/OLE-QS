- id: doc_113_高雄_獅甲_國文_g8s2e3_s1_35
  section: 1
  number: 35
  type: single
  page: 3
  stem: 朱光潛在《談美》的序言中說到：「人心之壞，由於『未能免俗』。什麼叫做『俗』？這無非是像蛆鑽糞似的求溫飽，不能以『無所為而為』的精神作高尚、純潔的企求。總之，『俗』無非是缺乏美感的修養。」根據這段話的涵
    義，下列敘述何者正確？
  options:
  - label: A
    content: 美感的修養與物質的溫飽不能兩全
  - label: B
    content: 缺乏美感修養的人，難以免俗
  - label: C
    content: 無法求得溫飽，是人心變壞的主要根源
  - label: D
    content: 以「蛆鑽糞」形容溫飽是缺乏美感的表現。
