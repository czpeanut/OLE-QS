    \    「哈哈……好吧，我們搭龍舟回去。」珠以大笑回答我的玩笑。\n    我想跟珠說一句在讀國小時就聽過的諺語，但我打消這念頭。我想，如果不是珠也知道那諺語的道理，她一定會繼續留在臺灣。事實上，她選擇回國，對未來仍然存在著許多問號，但「\
    \       」，我相信，她一定也跟我有相同的體會。\n                                          （改寫自Safitrie\
    \ Sadik 著，鐘妙燕譯〈珠和龍舟〉）"
