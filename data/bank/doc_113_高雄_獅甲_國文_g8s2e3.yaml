  type: single
  page: 2
  stem: 「秋天的天空，藍得像是一片海洋，走在落葉繽紛的街道上，仰頭欣賞著那無盡的虛空，那層層藍色便如海水般盈滿所有視線。鑲嵌於上的朵朵白雲，此刻呈現仙女散花似的延伸，曼妙玲瓏的姿態彷彿在舞出一場淋漓盡致的劇目，湛藍與雪白的明顯輝映與襯托，及雲朵不斷變化身形的絢爛光景，儼然是一幅渾然天成美麗無比的圖畫。」根據文意，下列選項何者錯誤？
  options:
  - label: A
    content: 天空：落葉
  - label: B
    content: 雲朵：舞者
  - label: C
    content: 類比物：渾然天成美麗無比的圖畫
  - label: D
    content: 修辭：譬喻。
