  stem: 「古人畫草蟲，多半用工筆，打稿、勾勒、填色，即齊白石亦不例外，畫寫意草蟲者甚少。八大山人、揚州八怪、新羅山人等，有時用簡筆在枝葉草叢間點綴一二小蟲，極為有趣。現在已是工業繁忙時代，無暇細寫細染，何不用寫意方法畫草蟲，只要取景適合，位置恰當，姿態自然，一揮即成，縱然意到筆不到，又有何妨？」根據這段文字，下列何者最符合作者的觀點？
  options:
  - label: A
    content: 齊白石擅長用工筆的畫法來畫人物
  - label: B
    content: 由於筆法太簡易，古人少用寫意畫草蟲
  - label: C
    content: 揚州八怪有時用簡筆在枝葉草叢間點綴一二小蟲，非常有趣
  - label: D
    content: 生動的草蟲畫，得經過細筆點染的功夫。
- id: doc_113_高雄_獅甲_國文_g8s2e3_s1_29
  section: 1
  number: 29
  type: single
  page: 2
  stem: 陋室銘一文中，作者展現了一種精神上的充實。因為精神上的充實，而能忽略物質上的不足，下列文句，何者也是如此？
  options:
  - label: A
    content: 死生有命，富貴在天。君子敬而無失，與人恭而有禮（論語 顏淵）
  - label: B
    content: 君子無終食之間違仁，造次必於是，顛沛必於是（論語 里仁）
  - label: C
    content: 飯疏食飲水，曲肱而枕之，樂在其中矣！不義而富且貴，於我如浮雲（論語 述而）
  - label: D
    content: 富而可求也，雖執鞭之士，吾亦為之。如不可求，從吾所好（論語 述而）。
