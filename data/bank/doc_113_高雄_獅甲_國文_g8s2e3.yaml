  group_stem: "(五)48-50 題\n   蕭山 陳景初，久客天津。後束裝歸里，路過山東界。時歲大饑，窮民死者無算。旅店蕭條，不留宿客。投止一寺院，見東廂積棺三十餘口，西廂一棺，巋然獨存。三更後，棺中盡出一手，皆焦瘦黃瘠者，惟西廂一手，稍覺肥白。陳素負膽力，左右顧盼，\
    \ 笑曰：「汝等窮鬼，想手頭窘矣，盡向我乞錢耶？」遂解青橐，各選一大錢予之。東廂鬼手盡縮，西廂一手伸出如故。陳曰：「一文錢恐不滿君意，吾當益之。」增至百數，\
    \ 兀然不動。陳怒曰：「是鬼太作喬，可謂貪得而無厭者矣！」竟提兩貫錢置其掌，鬼手 頓縮。陳 ①     之，移燈四照，見東廂之棺，皆書饑民某字樣；而西廂一棺，上書某縣典史某公之柩。固\
    \ ②     曰：「饑民無大志，一錢便能滿願。而四公慣受書儀，不到其數不 收也。」（《諧鐸》）"
