  stem: What do “advantages” mean here?
  options:
  - label: A
    content: good points
  - label: B
    content: changes
  - label: C
    content: problems
  - label: D
    content: trouble
  group_stem: 'In most companies, workers spend five days a week at the office. They
    often spend 30 minutes or longer traveling to and from work. During busy hours,
    traffic and pollution are often quite serious. Teleworking is one way to fix these
    problems.

    Teleworkers have office jobs, but they work from home one or more days each week.
    Using phones and computers with Internet, they can do all their office work. Many
    jobs, such as sales, design, and even office management, can be done at home.

    Teleworking has many advantages. With fewer cars on the road, traffic and air
    quality get better. Companies save money by using less light power or water for
    restrooms. Also, employees don''t need to spend time taking a bus or taxi. They
    can get more sleep or enjoy a great breakfast.

    However, some companies are slow to move to telework. They think employees need
    managers to look over their shoulders, or they won''t work hard. In fact, studies
    show that people actually get 25% more work done when they telework.

    There are already more than 20 million teleworkers in Europe and the USA. Japan
    has more than 10 million, and Australia has about 3 million. These numbers are
    growing because more people are learning the help of this new working style. How
    about you? Do you like to work from home? Imagine you go down the hall to your
    home office. Here you have everything you need to do your work. You don''t have
    to hurry to work in a car or on the metro to work . WFH (working from home) is
    a good idea, isn''t it?'
