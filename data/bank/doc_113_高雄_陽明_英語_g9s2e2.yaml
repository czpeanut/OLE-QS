  group_stem: "題組六 (45-46) \nTetris: The Game That Becomes a Hit \nIt is one of the\
    \ most popular video games of all time, with over 500 million copies sold. It\
    \ is also, perhaps, one of the simplest game. All you need to do is put shapes\
    \ into rows that clear once completed. Players score points by clearing as many\
    \ rows as possible before the shapes stack up too high and end the game. Do you\
    \ know what it is? I’m talking, of course, about Tetris. \nTetris was created\
    \ in 1985 by a Russian programmer named Alexey Pajitnov. As a young software engineer\
    \ at the Soviet Academy of Sciences, he had been asked to come up with games to\
    \ test the new Electronika 60 computer. One day, he got an idea, and he would\
    \ try to re-create a game from his childhood on the computer. The game was simple:\
    \ players would put blocks of different shapes into a box without leaving any\
    \ gaps.  \nHowever, this would not do for a computer game. It had to be more exciting.\
    \ So, Pajitnov had the blocks drop down from the top of the screen one at a time,\
    \ pushing the player to decide on the next step in order to stay away from losing\
    \ the game. The further through the game the player went, the faster the blocks\
    \ would drop. Tetris was born. \nBefore long, all of Pajitnov’s friends were drawn\
    \ to his new game and loved it. Soon enough, it could be found on computers all\
    \ over Moscow. Seeing that his game could be a big success, Pajitnov wanted to\
    \ make Tetris sold outside of Russia, but he had no real idea how to make that\
    \ possible. What’s more, he lived in Soviet Union(蘇聯), which made business deals\
    \ with the outside world very difficult. \nAfter several difficult years, during\
    \ which the rights to the game passed back and forth between many different gaming\
    \ companies, Tetris was finally bought by the Japanese company Nintendo. In 1989,\
    \ it even became the first video game to be played in space, when a Russian cosmonaut\
    \ took his Game Boy with him to the Mir space station. \nToday, Tetris stays as\
    \ popular as ever, with over 200 versions of the game for different gaming consoles(遊戲機),\
    \ smartphones, and home computers. No matter how interesting modern video games\
    \ get, there’s still nothing quite as exciting as stacking blocks! \n   complete\
    \ 完成  stack 堆疊   Russian 俄羅斯籍的   gap 缺口   cosmonaut 太空人  version 版本"
