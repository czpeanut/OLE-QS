    content: Cutting your hair more often is bad for the environment.
  group_stem: "題組四 (40-41)\nSurprising Uses for Hair\nMost of us spend time thinking\
    \ about our hair. We make sure it looks OK before we leave the house, and we have\
    \ haircuts every three or four weeks. But few of us think about what happens to\
    \ our unwanted hair. You may be surprised to learn that human hair is actually\
    \ a great material with many uses. So, let’s take a look at some of the ways that\
    \ hair can be used once it’s been cut off.\n \nHair can be used to make wigs for\
    \ people who have lost their hair because of cancer treatments. Wearing wigs can\
    \ help them get through difficult times and make them feel better. Therefore,\
    \ more and more people agree to give their own cut hair to these people.\n \n\
    Believe it or not, human hair makes great food for plants. Hair is rich in nutrients\
    \ that plants need. If you put hair underground, it will break down over time\
    \ and give out nutrients into the earth. Plants will then take in the nutrients\
    \ when they grow.\n \nHair can absorb chemicals that are making water dirty, such\
    \ as formaldehyde(甲醛) and mercury(汞). For this reason, mats that are made from\
    \ human hair have also been used to clean up oil in countries like the US and\
    \ the Philippines.\n \nIn order to save the environment, people are starting to\
    \ use cut human hair to make new materials. In the UK, the Green Salon Collective\
    \ works hard to turn hair into thick strings, thick cloth, and more. They have\
    \ even teamed up with a company that is using hair to make new building materials.\
    \ Also, the Dutch company Human Material Loop has been developing new clothes\
    \ from human hair.\n \nGiving human hair a second life is a useful way to cut\
    \ down on waste and help the environment. So, after your hair has been cut, it\
    \ may be re-used in surprising ways that will help both people and the planet.\n\
