    \ \n \nObon, or the Bon Festival, is a Japanese holiday that honors the spirits\
    \ of the dead.   47.   The festival usually lasts for four to five days in August.\
    \ On these days, many people travel back to their hometowns and spend time with\
    \ loved ones, both past and present. \n \nThough not a national holiday, Obon\
    \ is surely one of the most important events of the year. Celebration often begins\
    \ with mukaebi (welcoming fire), during which people make a small bonfire in front\
    \ of their house to lead spirits to go back home.   48.   Food offerings are presented\
    \ at house altars and temples. In some areas, people prepare horses and cows made\
    \ of vegetables, hoping that the spirits will come back to Earth quickly, on a\
    \ horse, and leave slowly, riding the cow. \n \n  49.   Paper lanterns and offerings\
    \ are sent sliding down rivers to go with the ancestors back to their resting\
    \ place. Many areas will also hold bon-odori dances. The styles of the dances\
    \ are different from place to place, but the dances commonly go with the taiko\
    \ drums. Dancers usually play on a tall stage with lanterns all around. People,\
    \ often dressed in light kimonos(和服), are invited to dance to the music around\
    \ the stage.   50.   In the beginning, the dances are presented to the dead, but\
    \ they have now become a sign of the summer festival themselves.  \n \n(A) Some\
    \ people also go to clean up the family graves and pray for their ancestors. \n\
    (B) Such festival activities are usually held in parks, temples, and other public\
    \ places around Japan. \n(C) Obon ends with another bonfire, okuribi, lighting\
    \ up the sky to see the ancestors’ spirits off. \n(D) Coming from the Chinese\
