  group_stem: "題組三 (38-39)\nWhy Are Brits So Obsessed with the Weather?\nThere are\
    \ lots of different stereotypes about the British. People think that they all\
    \ love drinking tea, watching soccer, and eating boring food. Another popular\
    \ stereotype is that Brits love talking about the weather. But how true is this?\n\
    Well, one study says the weather is the go-to topic for small talk for nearly\
    \ 50% of the British people. In fact, the study found that a British person spends\
    \ around 10 minutes every day talking about the subject. That adds up to an hour\
    \ every week and over four months in a lifetime. That’s really a lot!\nDifferent\
    \ areas of the country have developed a great number of words to chat about the\
    \ topic. In the eastern English county of Norfolk, the weather is often described\
    \ as “bange” when it is gray and wet. In Scotland, the same type of weather would\
    \ be called “dreich.” There is also a whole dictionary of words just for talking\
    \ about rain, such as a light “mizzle” and a heavy “land-lashing.”\nSo, what’s\
    \ at the root of this obsession? One answer is that British weather is always\
    \ changing. People will never know what the weather will be like next hour. Mostly,\
    \ the country’s weather follows the four seasons and has wet springs, sunny summers,\
    \ windy falls and cold winters. However, Brits can often experience all of these\
    \ types in one day. This surely gives them something to talk about !\nSome studies\
    \ say that there is a deeper reason, though. People in the Middle East and South\
    \ America are usually open with strangers. However, the British try not to bother\
    \ people when they meet them. Therefore, people from countries like Brazil or\
    \ Israel might ask questions that British people may consider not polite. The\
    \ weather, on the other hand, gives Brits the chance to talk with other people\
    \ in a safe way that makes both sides feel easy.\nSo, if you ever visit the UK,\
    \ just look up at the sky and start talking about it. You’ll fit right in!   \
    \   \n  Brit/british 英國人 obsessed/obsession 著迷  describe 描述  consider 認為"
