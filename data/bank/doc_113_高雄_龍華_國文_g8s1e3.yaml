  type: single
  page: 4
  stem: '「只是，若在金澤走動一陣，很快能感到金澤與京都兩地內在紋理是如何南轅北轍。金澤人有比較簡單的說法：「京都為公家（貴族）文化，金澤為武家（武士）文化。」這話十分委婉，感覺也帶點「說來話長，解釋起來太麻煩，就勉強這樣分別吧」的意思。」
    （黃麗群〈如果有一天你去金澤〉）

    請問這段文字作者主要在說明什麼？'
