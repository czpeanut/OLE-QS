- id: doc_113_高雄_龍華_國文_g8s1e3_s4_29
  section: 4
  number: 29
  type: single
  page: 5
  stem: 關於文中畫雙體線處粗體文字的敘述，下列說明何者正確？
  options:
  - label: A
    content: 第①句敘述時人一致認同糖果為孩子帶來極大的歡愉，無須禁止
  - label: B
    content: 第②句說明每個孩子天性不同，並非都能用糖果及玩具加以誘惑
  - label: C
    content: 第③句說明能接受甜味之外味道的孩子，其社交能力多優於同儕
  - label: D
    content: 第④句敘述女人本身喜歡甜食，照顧孩子時也常用甜食滿足他們
  group_stem: "法語的「糖果」（bonbon）是由兩個相同音節所組成的兒語，原指給孩童服用、裹上糖衣的藥物；一六○四年，年幼的路易十三的御醫艾侯阿在《日記》裡首次使用這個詞彙，利希雷與弗荷帖則完全把它定位在兒童世界中，將之定義為兒語詞彙，意指給兒童吃的糖果。自十七世紀末，糖果常和玩具搭擋，在舊制度最後一世紀中，糖果變成小孩最期待收到的新年禮物之一。①一七一五年英國人史賴爾不惜與詆毀糖果的群眾對立並為糖果辯護，宣稱禁止孩童吃糖是非常殘酷的行為，甚至稱得上罪惡！盧梭則以為評判一名孩童慈悲與否，並非以他能捐出的錢財而定，而是看他是否能施捨「珍愛的東西，譬如玩具、糖果、點心」。\n\
    \  由於能帶來莫大的本能歡愉，新生兒喜愛甜味是與生俱來的。母乳含有乳糖因此甘甜，而中世紀的醫師為了刺激幼兒的胃口，囑咐家長在幼兒嘴上塗抹蜂蜜。「應該把有益嬰孩健康的食物浸漬在糖裡，而把那些有害健康的食物醃得又酸又苦。」蒙田在《隨筆集》中做出這個譬喻性的建議。確實，嬰孩天生厭惡強烈與苦澀的味道。在嬰孩斷奶期間，為了迫使嬰孩停止對乳房的依戀，現代醫生會建議母親或奶媽用蒜頭、蘆薈或芥末塗抹乳頭。而從喜愛甜味轉變成嗜吃鹹食這段期間也常被視為離開童年的時刻。弗荷帖在一六六六年的《布爾喬亞小說》裡寫道：「②他變得狡猾古怪，我們對他束手無策了，現在不能再用糖果和薑餅蛋糕取悅他，而必須藉助山鶉和蔬菜燉肉，我們也不能送他玩具和玩偶，而得改送鑲滿鑽石的珠寶和鍍金銀板。」\n\
    \  除了玩具和玩偶外，糖果和薑餅蛋糕也被用來做為童年的特徵，幼兒天生喜愛糖而且會本能地排斥苦味，這兩點在上個世紀都獲得科學證實，科學家並提出演化上的解釋：③甜味傾向於揭露自然界中易於被人體吸收、能產生熱量的物質，而苦味則經常意味毒性。因此苦味跟酸味、辣味、嗆味或微腐野味的味道一樣，都必須經過學習才能接受。法蘭索‧布雪在一七三九年畫作《早餐》裡描繪家庭生活情景時，即想表現味覺的練習這個主題：做母親的讓小孩習慣咖啡的苦味，藉此教導他咖啡的社交功能。\n\
    \  無論是奶媽、女管家或為人母親，女人都不會對幼童嗜糖的現象感到陌生，起碼到七歲左右的懂事年紀，小孩都由女人照顧，而女人本身喜歡吃糖，因此無形中對幼童對糖的偏好有推波助瀾之效。亞伯拉罕‧博斯有一幅描繪糕餅師傅工作室的版畫，附帶的詩文將這層關係描寫得淋漓盡致：「太多美味的點心／這裡有精心調製的佳餚／為了取悅味蕾而販賣／各式各樣的產品……這家店有許多珍饈／千姿百媚地迷惑／許多女孩和小男孩／所有女傭和奶媽。」\n\
    \  也就是說，④女傭和奶媽會討好孩童對甜食的喜好，夏多布里昂在其一八二六年的《一生回憶錄》裡描寫他那位女管家拉維勒尼夫「偷偷（給我）所有她能找到的甜食」、「拚命讓（我）喝酒吃糖」。這種對甜食的共通嗜好意味的正是一種被歸諸於女人與幼童的共同弱點。\n\
    （節錄自弗羅杭．柯立葉《饞，貪吃的歷史》）"
