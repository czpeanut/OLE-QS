  stem: 請問在文中提到的「高名之士」，所指為誰？
  options:
  - label: A
    content: 皇甫謐
  - label: B
    content: 時人
  - label: C
    content: 張公
  - label: D
    content: 左太沖
  group_stem: '左太沖作《三都賦》初成，時人互有譏訾①，思意不愜。後示張公。張曰：「此《二京》②可三，然君文未重於世，宜以經高名之士。」思乃詢求於皇甫謐。謐見之嗟歎，遂為作敘。於是先相非貳者，莫不斂衽③讚述焉。

    （節錄自劉義慶《世說新語˙文學》）

    注①訾：詆毀。②《二京》：指班固的《兩都賦》、張衡的《二京賦》。③斂衽：整理衣襟，表示恭敬。'
