  section: 4
  number: 26
  type: single
  page: 4
  stem: 依文中鴻門宴席次安排的敘述，請問坐在沛公對面的人是誰？
  options:
  - label: A
    content: 項王
  - label: B
    content: 范增
  - label: C
    content: 張良
  - label: D
    content: 項伯
  group_stem: '項王即日因留沛公與飲。項王、項伯東向坐；亞父南向坐，亞父者，范增也。沛公北向坐，張良西向侍。范增數目項王，舉所佩玉玦以示之者三，項王默然不應。范增起，出召項莊，謂曰：「君王為人不忍。若入前為壽①，壽畢，請以劍舞，因擊沛公於坐，殺之。不者②，若屬③皆且為所虜。」莊則入為壽。壽畢，曰：「君王與沛公飲，軍中無以為樂，請以劍舞。」項王曰：「諾。」項莊拔劍起舞，項伯亦拔劍起舞，常以身翼蔽沛公，莊不得擊。於是張良至軍門見樊噲。樊噲曰：「今日之事何如？」良曰：「甚急！今者項莊拔劍舞，其意常在沛公也。」噲曰：「此迫矣！臣請入，與之同命。」噲即帶劍擁盾入軍門。

    （節選自司馬遷《史記．項羽本紀．鴻門宴》）

    注①壽：對尊長敬酒祝賀為「壽」。②不者：否者。不，音ㄈㄡˇ，通「否」。③若屬：你們。'
