  stem: '「謝安嘗欲詣①陸納，而納殊無供備，其兄子俶不敢問之，乃密為之具。安既至，納所設惟茶果而已。俶遂陳盛饌，珍羞畢具。客罷，納大怒曰：『汝既不能光益叔父，乃復穢吾素業②邪！』於是杖之四十。」

