    content: 「王藍田性急」──首句便點出王藍田特性，以此貫穿整篇文章，再藉由一連串的動作凸顯性急特色
  - label: B
    content: 「仍下地以屐齒蹍之」──刻意強調是用最堅硬、尖銳的「屐齒」部份去踩踏，流露了藍田怒氣高漲
  - label: C
    content: 「復於地取內口中，齧破即吐之」──把掉落地面的髒雞蛋咬破立刻吐出，將藍田的怒意升到最高點
  - label: D
    content: 「使安期有此性，猶當無一豪可論，況藍田耶？」──王羲之藉「食雞子」一事，表明藍田優於安期
