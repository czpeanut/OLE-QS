  stem: 根據本文內容，下列何者最符合作者對於真正善良的看法？
  options:
  - label: A
    content: 丟麵包餵食園區內的可愛動物
  - label: B
    content: 勸說家人不要違抗無理的上司
  - label: C
    content: 手頭不寬裕仍然不斷借錢給人
  - label: D
    content: 告誡經常出口傷害他人的同學
  group_stem: "你可以善良，但是請不要無謂的善良。如果經過歲月的磨練，你稍微修練出一些鋒芒，反倒可能游刃於人際，更從容地生活。我已經明白了，所以我希望更多善良的人，都能懂得善良的智慧。否則我們只能把自己憋成內傷。因為這個世上，有太多所謂的低能善良。\n\
    \  比如，缺乏常識的善良──好心的老太太為生病的人推薦各種「偏方」、心懷慈悲的人把海龜帶到公園的池塘去放生……\n  比如，不同情受害者只同情弱者的善良──你有一個不做家務、亂丟垃圾的嬌室友，你忍無可忍發飆之後，別人卻勸你要對室友寬容一點。\n\
    \  比如，用妥協忍讓的方式表達「都是為你好」的善良──某人的丈夫喝酒賭博，還沙文主義，有一天他出軌了，卻有人來勸她說：「好歹夫妻一場，還是原諒他吧。」\n\
    \  比如，無止境的幫助卻帶來反效果的善良──升米恩，斗米仇，不願將醜話說在前頭，結果不斷借錢給親戚幫他們渡過難關，卻在要回借款的時候與他們反目成仇。\n\
    \  我不能為善良下一個定義，但是，善良不善良，你要自己學會去選擇。生活不是用來妥協的，你越退縮，喘息的空間就越少；日子也不是用來將就的，你越卑微，幸福就離你越遠。\n\
    \  你無須把自己的姿態擺得太低。屬於你的，就要積極爭取；不屬於你的，也請果斷放棄。不想做的事，不必勉強自己去做；忍了很久的事，不必一而再，再而三地忍下去。不要再讓別人來踐踏你\n\
    （節錄自慕顏歌《你的善良必須有點鋒芒˙作者序》"
