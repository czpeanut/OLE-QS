    content: 在連敗三場後，教練團為激勵球員，自嘲若是再敗，就「無顏見江東父老」了
  - label: B
    content: 俗話說：「智者千慮，必有一失」，所以愚者提出的論點，就更無可觀之處了
  - label: C
    content: 在講究科學的現代，「失之毫釐，謬以千里」，一旦有些微差錯就會鑄下大錯
  - label: D
