  stem: 針對文中描述事件的評論，下列何人的說明最正確？
  options:
  - label: A
    content: 索隆：大將軍對美人被殺一事面不改色，是因他認為不宜跟女子太親近
  - label: B
    content: 喬巴：王丞相喝得酩酊大醉，是因為他貪圖美色，不忍見美女因此喪命
  - label: C
    content: 娜美：石崇此一舉動無非是想要爭豪鬥富，為了己身的玩樂而大肆揮霍
  - label: D
    content: 魯夫：石崇之所以殺害美人，是由於美人知道他太多秘密，不得不封口
  group_stem: '石崇每要客燕集，常令美人行酒。客飲酒不盡者，使黃門①交斬美人。王丞相②與大將軍③嘗共詣崇。丞相素不能飲，輒自勉強，至於沉醉。每至大將軍，固不飲，以觀其變。已斬三人，顏色如故，尚不肯飲。丞相讓④之，大將軍曰：「自殺伊家人，何預卿事！」

    （節錄自劉義慶《世說新語˙汰侈》）

    注①黃門：官職名，此指家將。②王丞相：指王導。③大將軍：指王敦，為王導的堂兄。④讓：譴責。'
