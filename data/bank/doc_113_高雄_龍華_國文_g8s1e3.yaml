  type: single
  page: 4
  stem: 若要形容此文中王丞相與大將軍的行為，下列成語何者最適合？
  options:
  - label: A
    content: 王丞相：成仁取義／大將軍：冷面冷心
  - label: B
    content: 王丞相：仁心仁術／大將軍：心如古井
  - label: C
    content: 王丞相：宅心仁厚／大將軍：冷眼旁觀
  - label: D
    content: 王丞相：明辨是非／大將軍：流水無情
  group_stem: '石崇每要客燕集，常令美人行酒。客飲酒不盡者，使黃門①交斬美人。王丞相②與大將軍③嘗共詣崇。丞相素不能飲，輒自勉強，至於沉醉。每至大將軍，固不飲，以觀其變。已斬三人，顏色如故，尚不肯飲。丞相讓④之，大將軍曰：「自殺伊家人，何預卿事！」

    （節錄自劉義慶《世說新語˙汰侈》）

    注①黃門：官職名，此指家將。②王丞相：指王導。③大將軍：指王敦，為王導的堂兄。④讓：譴責。'
