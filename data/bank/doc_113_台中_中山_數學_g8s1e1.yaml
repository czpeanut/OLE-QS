- id: doc_113_台中_中山_數學_g8s1e1_s3_1
  section: 3
  number: 1
  type: essay
  page: 2
  stem: '在製作各式皮革製品時，通常要按照以下幾個步驟：

    畫設計圖→做紙模型→打版→裁切→縫製

    其中打版是極為重要的步驟，如果出錯不僅會導致實品與設計圖尺寸不合，最嚴重可能要直接放棄已裁好的皮革，再重新打版。若尚非要製作皮包，在打版的步驟時，測量出其中一塊皮革的版型是一塊邊長為30公分的正方形，但是在縫製的過程中才發現他出錯了，所需的皮革邊長要再少0.2公分。試回答下列問題：

    (1)該皮革依正確的版型裁切後，正方形的邊長為多少公分？

    (2)該皮革依正確的版型裁切後，面積為多少平方公分？'
