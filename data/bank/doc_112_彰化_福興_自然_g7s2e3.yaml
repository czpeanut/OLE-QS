  stem: '幾個同學參加「生態系 VR 虛擬實境體驗」。戴上 VR 設備後，幾個同學都對虛擬的生態系感到驚奇，並說出自己看到的場景：

    小張：「我腳下有好多次單類跟蘚苔喔，還有看到一些青蛙。」

    小佳：「小聲點，我看到前面有隻黑熊。是胸口有白色 V 形花紋的那種黑熊。」

    小昕：「哪裡有熊？我只看到兩隻駱駝悠哉悠哉地晃過去。」

    小寧：「我啥動物都沒看到，雨超大的，地上到處都是積水，我只好躲在一棵大樹下躲雨。」

    依照四人的對話內容判斷，哪位同學可能和其他三人處於不同的虛擬生態系？'
