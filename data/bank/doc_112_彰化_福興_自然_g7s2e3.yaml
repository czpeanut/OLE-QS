  stem: '小張假日爬山時，沿途發現三種會生長在榕樹上的植物，回家查了資料，結果如下：

    ◎小花蔓澤蘭：喜歡光照且生長迅速的多年生藤本植物，一旦攀上樹木就會纏繞全株，遮蔽陽光使樹木難以行光合作用，又稱「綠色癌症」。

    ◎菟絲子：本身無法行光合作用，莖上有構造會直接鑽入其他植物體吸收養分。

    ◎鳥巢蕨：俗稱山蘇，附著在其他植物的樹幹上，但並未吸收其他植物的養分，幼葉可食用。

    請問以上 3 種植物與榕樹的關係依序是？'
