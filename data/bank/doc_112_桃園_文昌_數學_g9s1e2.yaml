- id: doc_112_桃園_文昌_數學_g9s1e2_s1_19
  section: 1
  number: 19
  type: single
  page: 3
  stem: '如下圖 15，唯唯畫了一個圓，並且過 P 點做此圓的兩條切線，且交於 A、B 二點。結果唯唯不小心擦掉了某部分痕跡，只留下 $\overgroup{AB}$
    及 P、A、B 三點。宸宸、堯堯、丹丹、楷楷 4 個人想了一些辦法，要幫唯唯找到原本的圓心。試著判斷四個人的作法中，有幾個人的作法是正確的。


    宸宸：作 $\overline{AB}$ 的中垂線交 $\overgroup{AB}$ 於 M 點，並且作 $\overline{BM}$ 的中垂線，二線的交點即為圓心

    堯堯：分別作 $\overline{PA}$、$\overline{PB}$ 的中垂線，二線的交點即為圓心

    丹丹：延長 $\overleftrightarrow{PA}$、$\overleftrightarrow{PB}$，分別過 A、B 二點作 $\overleftrightarrow{PA}$、$\overleftrightarrow{PB}$
    的垂線，二線的交點即為圓心

    楷楷：作 $\angle APB$ 的角平分線，交 $\overgroup{AB}$ 於 K 點，並且作 $\overline{AK}$ 的中垂線，二線的交點即為圓心'
