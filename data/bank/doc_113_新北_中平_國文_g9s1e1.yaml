  type: single
  page: 5
  stem: 關於上文「非慣性思考」的敘述，最適當的是：
  options:
  - label: A
    content: 脫離習慣性思維的軌道，有助自由揮灑於藝術創作中
  - label: B
    content: 非慣性思考能使人看穿事情的表象，發現困難裡隱藏著的新契機
  - label: C
    content: 不要拘泥在慣性的思考中，不用受道德價值的框限，才能從心所欲解放思維
  - label: D
    content: 遇到「困卦」的情境，應秉持「窮則變，變則通」的信念，務必達成「澤中有水」的目標。
  group_stem: '在《易經》中，有一個卦叫做「困卦」，困卦就是遇到困難，其卦象是上兌下坎。兌即是澤的意思，而坎是水的意思。照理說，水應該在湖面上，但此卦卻讓水到了湖面下，意即「澤中無水」，整個解釋就是「舟行澤中，澤無水，困。」也就是一艘在無水的湖中行駛的船。既然沒了水，船就不能動了。這意味著遇到了困難。那麼，遇到困難該怎麼辦呢？……「怨天尤人」這是我們遇到困難的習慣性思考方向。然而，如果我們有興趣提升自己，就不要做這種無意義的思考了。遇到困難就想辦法解決，但是天不下雨有什麼辦法？我們又沒這麼多水可以灌滿整個湖泊。想不出正常的解決方法，就讓思考轉個彎，尋找變通的方法。

    我們要船做什麼，要到對岸去嗎？那麼，既然沒水，騎馬過去就好了啊！或是走路過去也行啊！誰說到湖的對岸一定要搭船啊？既然湖中無水，脫離了習慣性的軌道，那麼，我們就不要拘泥在慣性的思考中了，解放我們的思維，跳脫價值的束縛，奔向自由揮灑的思維世界。

    有時，我們會讚嘆古人的智慧真了不起。因為在《易經》困卦的卦象中間，竟隱藏了巽卦和離卦。大師解釋：「這就是和風與陽光，象徵著新的希望。」也就是說，在古人眼中，困難只是表象，裡面卻隱藏著無窮的契機。

    （改寫自冀劍制《這樣想沒錯但也不對的 40 件事》）'
