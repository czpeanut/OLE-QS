  section: 1
  number: 39
  type: single
  page: 5
  stem: 依據上文，這起加拿大獵熊案最重要的意義為何？
  options:
  - label: A
    content: 第一樁由昆蟲學專家協助調查的刑事案件
  - label: B
    content: 野生動物保育的議題因這起獵熊案得到世界的重視
  - label: C
    content: 射殺野生動物被判定為犯罪行為
  - label: D
    content: 加拿大成為第一個禁獵野熊的國家。
  group_stem: '時間：1997 年 7 月 14 日

    地點：加拿大的 Manitoba

    案發現場：1997 年 7 月 14 日，Manitoba 的禁獵區中發現兩頭幼熊遭人射殺，並被開膛剖肚，取走膽囊。警方雖已鎖定當日進出該地區的數名嫌犯，但因無法確定幼熊的死亡時間，故案情陷入膠著狀態，只好轉而向法醫昆蟲學家求援。

    專家檢驗現場證物後發現，幼熊的屍體上有麗蠅的卵，經鑑定後確定有三種麗蠅，便以其中生活史最為穩定的 Phaenicia sericata 回推幼熊的死亡時間。由於這種麗蠅的卵在攝氏
    21.4 度時，大約需 20.9～23.5 個小時才會孵化，而屍體上的卵塊經法醫昆蟲學家飼育後，於 7 月 15 日早晨七點開始孵化。再以此回推幼熊死亡的時間—屍體上的第一顆卵大約是在14
    日午夜至清晨九點間產下的，因此種麗蠅不會在半夜時產卵，故嫌犯可能是前一夜就在此地射殺幼熊，麗蠅則在隔天清晨前來產卵。

    按法醫昆蟲學所得到的資料，加拿大警方鎖定兩名嫌犯，他們在前一夜進入該地區，附近居民也表示曾在晚間十點左右聽見槍聲。最後他們終於招供，承認為了牟取熊膽的暴利而射殺那兩頭幼熊。經法官判決，兩人各服三個月有期徒刑。這個案件不僅是少數幾個將法醫昆蟲學應用在動物保育上的例子之一，同時也是加拿大地區首次因射殺野生動物被送入監牢的案例，可說具有十分重大的意義。

    （陳俊憲、陳俊宏、石正人〈法醫昆蟲學—昆蟲讓屍體說話了〉）'
