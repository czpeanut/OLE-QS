  group_stem: '嘉靖皇帝讀罷奏疏，其震怒的情狀自然可想而知。傳說他當時把奏摺往地上一摔，嘴裡喊叫：「抓住這個人，不要讓他跑了！」旁邊的宦官為了平息皇帝的怒氣，就不慌不忙地跪奏：「萬歲不必動怒。這個人向來就有痴名，聽說他已自知必死無疑，所以他在遞上奏本以前就買好一口棺材，召集家人訣別，僕從已經嚇得通通逃散。這個人是不會逃跑的。」
    嘉靖聽完，長嘆一聲，又從地上撿起奏本一讀再讀。

    嘉靖沒有給予海瑞任何懲罰，但是把奏章留中不發。他不能忘記這一奏疏，其中有那麼多的事實無可迴避，可是就從來沒有人敢在他面前哪怕是提到其中的一丁點！皇帝的情緒顯得很矛盾，他有時把海瑞比做古代的忠臣比干，有時又痛罵他為「那個痛罵我的畜物」。有時他責打宮女，宮女就會在背後偷偷的說：「他自己給海瑞罵了，就找咱們出氣！」

    （黃仁宇〈萬曆十五年海瑞——古代的模範官僚〉）'
