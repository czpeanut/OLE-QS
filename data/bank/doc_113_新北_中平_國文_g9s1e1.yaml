  group_stem: '(甲)艾葉生則微苦太辛，熟則微辛太苦，生溫熟熱，純陽也。可以取太陽真火，可以回垂絕元陽。服之則走三陰，而逐一切寒溼，轉肅殺之氣為融和。
    （李時珍《本草綱目》）


    (乙)艾葉稟天地之陽氣以生，故味苦微溫，熟則大熱。可升可降，其氣芳烈，純陽之草也，故無毒。入足太陰、厥陰、少陰三經。燒則熱氣內注，通筋入骨，故灸白病①；性能通竅，辟惡殺鬼精，故止鬼擊②吐血。
    （繆希雍《本草經疏》）

    【注釋】①白病：皮膚疾患。②鬼擊：是指突然出現胸腹部絞痛或出血的疾病


    (丙)古人食艾，非僅為其綠意香氣，更因為它能祛毒鎮邪，去瘟避疫，防範換季時乍暖還寒，忽溼忽乾，令人失調生病的各種「邪症」。除了冬春之交，春夏之交的端午，也有食艾之風，洛陽人飲艾酒以防暑熱，韓國人吃艾草粥和艾草汁以健腸胃。

    （節錄自蔡珠兒〈艾之味〉）'
