  stem: 西元2021 年5 月，以色列與巴勒斯坦中的哈瑪斯組織爆發戰火，雖在各國調停下，雙方得以停火，但仍釀成三百多人死傷的悲劇。而以色列與巴勒斯坦兩大民族的紛爭，其中之一是來自於「耶路撒冷」這座城市的歸屬問題，雙方均認為自己擁有該城市的主權，也使以巴雙方的談判長期陷入僵局。請問：以色列人與巴勒斯坦人對耶路撒冷的爭奪權，是下列哪兩個宗教教派在認知上的爭端？
  options:
