  number: 5
  type: single
  page: 1
  stem: 埃及象形文字中的聖書體，原本流傳於上層階級，並寫於神殿壁畫或是雕刻於紀念碑上。但隨著四世紀末羅馬帝國的「宗教政策」轉變，埃及傳統信仰的神殿停止興建，原本流傳就相當有限的聖書體因而失傳。請問：上述短文中提及的「宗教政策」轉變，應該是指下列何者？
  options:
  - label: A
    content: 君士坦丁皇帝宣布基督教合法
  - label: B
    content: 狄奧多西皇帝宣布基督教為國教
  - label: C
    content: 羅馬皇帝爭取基督教世界的領導權
  - label: D
    content: 羅馬政府以武力鎮壓基督徒。
