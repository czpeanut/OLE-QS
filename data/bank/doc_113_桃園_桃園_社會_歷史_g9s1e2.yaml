  type: single
  page: 1
  stem: '阿拉伯人與鄂圖曼土耳其人均曾建立橫跨三洲的大帝國。以下為幾位同學提出看法，請問：有幾位同學說法正確？


    美美：阿拉伯帝國興起於八世紀；鄂圖曼土耳其帝國興起於11 世紀

    暖暖：阿拉伯帝國占領的歐洲領土是巴爾幹半島；鄂圖曼土耳其帝國占領的歐洲領土是伊比利半島

    東東：阿拉伯人與鄂圖曼土耳其人皆信仰伊斯蘭教

    西西：兩者在擴張過程中皆與拜占庭帝國爆發衝突'
