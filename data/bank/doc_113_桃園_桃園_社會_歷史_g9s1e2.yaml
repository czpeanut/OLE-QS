- id: doc_113_桃園_桃園_社會_歷史_g9s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 清韻睡完午覺醒來，意外的發現她穿越時空，來到了歐洲某一時代。為了能生存下去，她四處觀察人們生活方式，並在她的日記中寫下紀錄：「修道院的修士遠離塵囂，以懺悔方式進行修行，祈禱與工作是他們的生活格言。他們也抄寫古書、努力耕種土地，不僅為了修道院生活的自給自足，也為了救助窮人。在動盪不安的時代，旅人可以在修道院過夜，得到安全照顧。修士們還指導附近的孩子們拉丁文，講解《聖經》。」請問：清韻的日記中，還有可能會記錄下列何事？
  options:
  - label: A
    content: 互許終身的年輕男女在教堂舉行婚禮
  - label: B
    content: 眾人批判猶太教的專制腐敗
  - label: C
    content: 皇帝同時掌管政治與宗教事務
  - label: D
    content: 學校指定學生閱讀《漢摩拉比法典》。
