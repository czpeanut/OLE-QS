  type: single
  page: 2
  stem: '1095 年 9 月教宗烏爾班二世召開克萊芒會議，並發表演說，如下列：

    一個來自波斯的伊斯蘭教民族，已經入侵我們東方兄弟的國家，他們一路攻到地中海，又侵占了我們的聖地──耶路撒冷，……。如果你們仍然無動於衷，上帝的信徒就會在這次入侵中犧牲更多，……，我告訴在座的各位，也通知不在場的人：這是主的旨意。讓我們投入一場神聖的戰爭，……！讓一切爭辨和傾軋休止，登上赴聖地的征途吧！從那個邪惡的種族手中奪回聖地吧！

    召開會議後，基督徒們開始展開行動組織軍隊出征。請問：文中的「邪惡的種族」是指何者？'
  options:
  - label: A
    content: 阿拉伯人
  - label: B
    content: 日耳曼人
  - label: C
    content: 塞爾柱土耳其人
  - label: D
    content: 鄂圖曼土耳其人。
