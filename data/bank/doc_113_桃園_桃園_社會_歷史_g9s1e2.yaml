  stem: 七世紀時，穆罕默德創立伊斯蘭教，至八世紀時，阿拉伯人積極擴張，建立橫跨三洲的阿拉伯帝國。隨著帝國的擴張，西亞、埃及、北非逐漸成為伊斯蘭世界。請問：關於中古時期的伊斯蘭世界，何者有誤？
  options:
  - label: A
    content: 伊斯蘭教的經典為《古蘭經》，必須以阿拉伯文誦讀
  - label: B
    content: 阿拉伯人在歐亞大陸與印度洋、地中海建立暢通的貿易路線
  - label: C
    content: 可從《天方夜譚》中，了解巴格達繁榮的城市風貌
  - label: D
    content: 伊斯蘭教在征服地區實施種姓制度。
