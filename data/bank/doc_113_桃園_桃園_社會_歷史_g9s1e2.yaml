- id: doc_113_桃園_桃園_社會_歷史_g9s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 德國學者韋伯在「新教倫理」中提出：「一方面強調消費的節制，另一方面則強調自願勞動的重要性。…正是因為節制消費，以及強調勞動的觀念，使得資產階級的資本逐漸積累，由此，漸漸發展成一種屬於資產階級的經濟倫理。資產階級累積自己的財富，在合理的範圍自由使用金錢，這些行為都是受到上帝所祝福的。」請根據上述內容，判斷下列何者正確？
  options:
  - label: A
    content: 此教派為路德教派
  - label: B
    content: 文中論點為「因信得救」
  - label: C
    content: 此教派支持教宗權威至上
  - label: D
    content: 此教派提出「預選說」。
