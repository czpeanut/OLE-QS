- id: doc_112_彰化_福興_數學_g9s2e2_s2_2
  section: 2
  number: 2
  type: essay
  page: 3
  stem: '伸縮型的工作梯可以調整梯子長度，以因應不同場合高度之需求。若登高的牆面高度固定時，則梯腳離牆越近，梯子與地面的夾角越大，需要的梯子越短，但因為坡度會越大，所以越陡；反之，離牆越遠，夾角小，需要的梯子就越長，如圖所示。


    (1)下圖中是一長5公尺的梯子，靠在牆面高4.2公尺的位置，若工作人員希望梯子頂置放到牆的最高點時，梯子與地面的夾角不大於$60^{\circ}$，請利用表格中角度的邊長比近似值計算，此梯長是否符合工作人員之需求。


    | | $40^{\circ}$ | $45^{\circ}$ | $50^{\circ}$ | $55^{\circ}$ | $60^{\circ}$ |
    $65^{\circ}$ |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | $\sin$ | 0.642 | 0.707 | 0.766 | 0.819 | 0.866 | 0.906 |

    | $\cos$ | 0.766 | 0.707 | 0.642 | 0.574 | 0.5 | 0.423 |


    (2)若工作人員將梯子靠牆面後(不一定是最高點)，想要讓梯腳距離牆腳100公分，且梯腳與地面夾角呈$65^{\circ}$，則他應如何調整梯長？(四捨五入至整數位)'
