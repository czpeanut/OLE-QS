  group_stem: "汽車安全設計\n\n    早期的車輛沒有安全帶，人們認為甩飛出去比在壓扁的鐵製車體內好，但後來許多案例發現，車禍時乘客被拋出車外時不一定會生還，常常因為身體卡在車門，或是距離車輛殘骸過近，被自己駕駛的車輛壓過而遭受傷害，於是改變安全觀念，認為固定在車內才是有效的生存要件。車體安全結構的概念萌芽，從打造相當堅固的車輛到開始明白硬碰硬絕對不是汽車撞擊安全的出路，透過「潰縮區」和強固結構組合，來保障車室空間並吸收外部衝擊，降低車內人員地傷亡。\n\
    \    「潰縮區」是汽車的碰撞吸收能量區域，透過強度較低的鋼材製成，同時也會在鋼材上設計摺痕，以便在撞擊時讓鋼材像手風琴一樣凹折壓縮，達到減緩衝擊力道並延長車輛滑行至靜止的時間，車頭和車尾非乘客所在的位置，即潰縮區。乘客所在的座艙位置則為「Safety\
    \ Zone 安全區」，亦稱為「不可潰縮區」，採用高強度的鋼材搭配堅固的結構設計，讓整個座艙區域在撞擊之後仍然能夠維持完整，保護車內乘客的生存空間不被壓縮。\n\
    \    根據道路交通管理處罰條例第31 條-1：「汽車行駛於道路上，其駕駛人、前座或小型車後座乘客未依規定繫安全帶者，處駕駛人新臺幣一千五百元罰鍰。」若不繫安全帶，除了罰款外，汽車撞擊時可能使車內人員：\n\
    (1)撞上車中的硬物，即使是安全氣囊，基於慣性原理，瞬間碰撞的撞擊力甚大。\n(2)甩飛出車外。按照不同的碰撞狀態，對人員死亡率的影響不能確定。\n(3)根據東京大學的研究，若後座乘客繫安全帶能降低前座者的八成死亡率，因為汽車撞擊時，沒繫安全帶的後座乘客會撞向前座背後。"
