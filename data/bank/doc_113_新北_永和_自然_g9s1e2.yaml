  group_stem: "臺灣的地震與斷層\n\n      2024 年花蓮地震（又稱為0403 大地震）發生於當地時間4 月3 日上午7 時58 分09 秒，震央位於臺灣的花蓮縣壽豐鄉，芮氏規模7.2，震源深度為22.5\
    \ 公里，並在花蓮縣秀林鄉和平村觀測到中央氣象署地震分級中最大震度6 強的地震，持續搖晃共大約98 秒，是極淺層地震，期間臺灣全島都感受到明顯搖晃，圖(二十五)是中央氣象署發布的今年第019\
    \ 號的地震報告，這場地震肇因於嶺頂斷層的錯動，另有學者認為，這次地震可能是由嶺頂斷層與米崙斷層同時活動所引起。\n      花蓮為何地震多？根據經濟部地質調查及礦業管理中心的資料，臺灣的活動斷層也就是距今約十萬年以來曾經活動過，未來很可能會再度活動的斷層，截至西元2021\
    \ 年為止，臺灣總計有36 條活動斷層，大都為南北走向的逆斷層，如圖(二十六)所示，東部現有8 條活動斷層，其中米崙斷層呈南北走向，陸地上全長約7 公里，橫亘過多數花蓮人聚居的花蓮市區，米崙斷層過去就有地震紀錄，1951\
    \ 年10 月開始的縱谷地震系列，地震帶綿延100 多公里，地震系列持續至12 月，共造成多人傷亡，發生錯動的其中一條斷層就是米崙斷層，花蓮在該次地震系列的10\
    \ 月22 日記錄到3 起規模7 以上的地震。2016 年米崙斷層正式被台灣政府列為地質敏感區，在地質敏感區的建築物建造前要經過更嚴格的審核。"
