  type: single
  page: 2
  stem: 徐仁修《森林最優美的一天》文中指出「臺灣低海拔的森林，不但優美而且極富特色，……只是因為我們很少去接近，也沒空去留意，更無心去關懷，而忘了森林。」此段與下列哪一句話的涵義最相近？
  options:
  - label: A
    content: 自然是陶冶心胸的偉大學校。（德 貝多芬）
  - label: B
    content: 這世界並不缺少美，只是缺少發現。（法 羅丹）
  - label: C
    content: 自然是上帝最偉大的神來之筆。（英 哈威）
  - label: D
    content: 對我來說，大自然一直是知識的泉源。（法 羅曼•羅蘭）
  lesson_raw:
    title: 森林最優美的一天
    basis: 題目指明《森林最優美的一天》
  answer:
  - B
  answer_source: answer_key_vlm
- id: doc_111_彰化_埔心_國文_g8s1e2_s4_10
  section: 4
  number: 10
  type: single
  page: 2
  stem: 下列關於《鳥》的文句解釋何者不恰當？
  options:
  - label: A
    content: 鳥到了這種地步，我想牠的苦悶，大概是僅次於黏在膠紙上的蒼蠅，牠的快樂，大概是僅優於在標本室裡住著吧！→籠鳥的自由僅強過膠紙上的蒼蠅和標本鳥
  - label: B
    content: 再令人觸目的就是那些偶然一見的囚在籠裡的小鳥兒了，但是我不忍看。→愛鳥自在活著的姿態
  - label: C
    content: 一直等到夜晚,才又聽到杜鵑叫，由遠叫到近,由近叫到遠，一聲急似一聲，竟是淒絕的哀樂。客夜聞此，說不出的酸楚。→杜鵑叫聲引起鄉愁,令作者心生厭煩
  - label: D
    content: 不知是什麼東西驚動牠了，牠倏地振翅飛去，牠不回顧，牠不徘徊，牠像虹似地一下就消逝了，牠留下的是無限的迷惘。→美好的事物無預警消逝，徒生惆悵
  lesson_raw:
    title: 鳥
    basis: 題目指明《鳥》
  answer:
  - C
  answer_source: answer_key_vlm
