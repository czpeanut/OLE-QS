  group_stem: '當你走在幽暗的沼澤、茂密的森林，你會感到一種神聖的氣氛，令你不敢出聲，怕驚起一條蜷在枯葉裡的蛇，怕一不小心有隻大灰熊的頭從樹後探出來說：「嘿！你在做什麼？」你將發現這個世界不屬於你，而你像一個闖入者，這種複雜的情緒混合著，令人不得不放掉以人為本位、為主宰的思考。

    有一個經驗使我非常難過，我在台灣拍雁鴨時，即使匍伏前進一百公尺處，雁鴨依舊「啪」的一聲飛掉了，但有一年我在日本用標準攝影鏡頭來拍，牠們竟旁若無人一點也不害怕，而這群雁鴨，其實也是飛來台灣的那一群。或許在牠們的遺傳基因中，已經要牠們一代告訴一代：南遷過程中的台灣島，是個專門吃雁鴨的島，必須格外小心。

    在進化的過程中令我們感動的、恐懼的，其實都還在我們的潛意識裡面，而這裡有一個非常重要的課題，那就是人和自然也是我們生活中的一份子，雖然現今的環境，已經很少機會讓你好好的觀察一棵樹，和一棵樹做朋友。

    徐仁修《每個人都是天生的自然觀察家》'
  answer:
  - A
  answer_source: answer_key_vlm
