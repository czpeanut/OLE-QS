  group_stem: '賣炭翁，伐薪燒炭(1)南山(2)中。

    滿面塵灰煙火色，兩鬢蒼蒼(3)十指黑。賣炭得錢何所營(4)？身上衣裳口中食。可憐身上衣正單，心憂炭賤願天寒。夜來城外一尺雪，曉駕炭車輾冰轍(5)。牛困人饑日已高，市南門外泥中歇。翩翩兩騎來是誰？黃衣使者白衫兒。手把文書口稱敕(6)，回車叱牛牽向北。一車炭，千餘斤，宮使驅將惜不得。半匹紅綃一丈綾，繫向牛頭充炭直(7)

