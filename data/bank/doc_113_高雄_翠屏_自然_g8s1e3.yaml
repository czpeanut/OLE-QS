  stem: 甲、乙兩人模仿古人鑽木取火，甲拿銅棒、乙拿木棒，各在相同材質的乾木材上不斷快速摩擦。若銅棒與木棒的外形、大小皆相同，則下列敘述何者正確？
  options:
  - label: A
    content: 甲可鑽出火來，因銅棒比熱較小，溫度上升較快，使乾木材燃燒
  - label: B
    content: 甲可鑽出火來，因銅棒導熱較快，易把熱量傳給木材，使乾木材燃燒
  - label: C
    content: 乙可鑽出火來，因木棒質量較小，產生的熱量可使溫度上升較多，使乾木材燃燒
  - label: D
    content: 乙可鑽出火來，因木棒不易導熱，產生的熱量較能集中於摩擦處，使乾木材燃燒。
