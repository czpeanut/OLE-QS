- id: doc_113_高雄_翠屏_自然_g8s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 最近幾年紡織業者推出了兩種特殊功能的衣服。第一種是在衣物纖維裡添加容易散熱的礦石粉末，當衣服與肌膚接觸時只要溫度相差 0.5 ℃以上就會有涼爽的感覺產生，也就是俗稱的「涼感衣」。另一種則是加入遠紅外線陶瓷成分，能夠反射人體發出的遠紅外線，且將可見光轉成遠紅外線並釋放熱能的「發熱衣」。請問上述兩種功能衣是利用什麼熱的傳播方式達到效果？
