  stem: '如圖，已知 $\overline{AB}=\overline{AD}$，$\overline{AC}=\overline{AE}$，$\angle
    BAD=\angle CAE=90^{\circ}$，下面為證明 $\overline{BC}=\overline{DE}$ 的過程，其順序為何？


    ① ∵ $\triangle BAC\cong\triangle DAE$ ( SAS 全等性質 )，

    ② 又 $\overline{AB}=\overline{AD}$，$\overline{AC}=\overline{AE}$，

    ③ ∵ $\angle BAC=90^{\circ}+\angle DAC=\angle DAE$，

    ④ 在 $\triangle BAC$ 與 $\triangle DAE$ 中，

    ⑤ 故 $\overline{BC}=\overline{DE}$ ( 對應邊相等 )。'
  options:
  - label: A
    content: ④ → ③ → ① → ② → ⑤
  - label: B
    content: ④ → ③ → ② → ① → ⑤
  - label: C
    content: ④ → ③ → ① → ⑤ → ②
  - label: D
    content: ④ → ③ → ② → ⑤ → ①
