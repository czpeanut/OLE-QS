- id: doc_113_高雄_英明_國文_g8s1e1_s5_30
  section: 5
  number: 30
  type: single
  page: 6
  stem: 「……它打著赤腳，在曠野田壟農舍之間奔來跑去……」此寫作手法和下列哪一選項不同？
  options:
  - label: A
    content: 陽光催我趕快，叫我別等待
  - label: B
    content: 你並不懊惱，你與所有南臺灣的小男孩一樣
  - label: C
    content: 西北雨追在你身後幾丈，拚力地跑
  - label: D
    content: 西北雨遠遠地放足飛躍而來了。
  group_stem: "西北雨像個愛捉弄人的頑童。它打著赤腳，在曠野田壟農舍之間奔來跑去，誰見了都要搖頭。\n 曾經，你也是個不喜歡穿鞋、走到哪兒玩到哪兒的鄉下半樁小子？\n\
    \ 南臺灣的老曆六月天，熱得菜葉捲邊的六月天。坐在田畔的榕樹粗幹上，你遙看水牛與白鷺鷥，水牛沒事做，白鷺鷥也閒著；你不忙活，正午的南風裹腳老太行路似地慢悠悠晃過胸口。不須再打呵欠，你眼皮已然垂下……這當頭，西北雨遠遠地放足飛躍而來了，你聽得分明，還一路呼喝著呢。\n\
    \ 土狗豎起耳朵，顯然牠比你早一點發現事情。得得得得夾帶著絲絲絲絲，聽聲音，你判斷西北雨在兩甲四方田以外；達達達達夾帶著沙沙沙沙，不急，這在五分四方田以外；豆豆豆豆夾帶著嘩嘩嘩嘩，你坐不住了，拔腿就跑。西北雨追在你身後幾丈，拚力地跑，你不停腳地往後看，空中有陽光，照在粗粗實實的雨柱上，土狗在你前面，你想趕過牠，也想不讓西北雨追上，你沒有一次贏過西北雨；跑跑跑跑跑—直到一滴兩滴三滴打在身上微微發疼的雨點提醒你又輸了。\n\
    \ 可是你並不懊惱，你與所有南臺灣的小男孩一樣，蟋蟀鬥輸了再抓一隻來，沒什麼丟臉的。反正輸了，放緩腳步吧，土狗在你跟前，類似這種緊急時刻，牠是永遠不會丟下你的，雖然牠身子也溼了。你衣服很快地全溼了，望見家門時，你這才重新快跑，越過稻埕，躲在大廳前的雨簷底下。\n\
    \ 免不了要挨母親幾巴掌，母親必是剛剛掩蓋好埕上稻穀，稍稍喘著不輕不重打你幾下屁股；父親站在一旁，似看不看地瞄你一眼，搖搖頭，搖搖手上的竹笠，土狗哈哈哈哈蹲在廂房過道邊吐氣。你心中多少有些不甘，下回—，下回鐵定要打敗西北雨！\
    \ (阿盛西北雨)"
