  stem: 根據上文，下列敘述何者正確？
  options:
  - label: A
    content: 虛擬貨幣並非由中央銀行發行，無法用提款卡或存摺從銀行提領出來
  - label: B
    content: 在臺灣，購買虛擬貨幣僅能透過虛擬貨幣兌換所和場外市場這二種管道
  - label: C
    content: 虛擬貨幣通行全世界，在交易過程中僅需支付極低的手續費，交易成本較低
  - label: D
    content: 虛擬貨幣沒有買賣匯率，因此投資人無需注意投資風險。
  group_stem: "虛擬貨幣，是指沒有實體的貨幣，如比特幣（Bitcoin）、以太幣（Ether）和狗狗幣（Dogecoin）等。虛擬貨幣並非由特定國家、地區發行，可以在全世界通用，是一種不須支付手續費，就能夠讓資產自由轉移的貨幣。而虛擬貨幣的買賣，會透過虛擬貨幣交易所這樣的集中市場，減少交易的成本。\n\
    \ 虛擬貨幣使用「密碼學原理」，來確保交易安全及控制交易單位。以比特幣為例，比特幣的核心原理是「區塊鏈」，一個區塊會對應到一筆帳單，所有的交易資訊、紀錄都會存在區塊鏈中。比特幣建構在P2P（Peer-to-peer）的網路上，創造一個去中心化的交易系統，讓使用者透過對等的網路進行交易，再加上密碼學的設計，讓交易更加安全。\n\
    \ 在臺灣，購買虛擬貨幣可透過虛擬貨幣兌換所、交易所和場外市場三種管道。兌換所有點類似銀行的概念，會有買賣的匯率；交易所像是一個虛擬貨幣的交易平臺，可以在上面和別人進行交易；場外交易則是私下交易或是在專門的平臺上進行買賣。\n\
    （綜合網路資訊）"
