  stem: 關於上文寫作方式的說明，下列敘述何者不正確？
  options:
  - label: A
    content: 使用第三人稱的立場敘述全文
  - label: B
    content: 文章穿插古典詩詞、運用人物對話
  - label: C
    content: 藉由過去與荷花相關的回憶，表達對父親的追念
  - label: D
    content: 藉父親生日、忌日和荷花生日同一天的巧合，抒發思念與感傷。
  group_stem: '父親的生日是農曆六月初六日，正是荷花含苞待放的時候。到兩個星期後的六月二十四日，便是荷花生日。母親說荷花盛開，象徵父親身體健康。所以在六月初六那天，她總要託城裡的楊伯伯，千方百計地採購來一束滿是花蕾的荷花，插在瓶中供佛。等待花瓣漸漸開放，散發出淡淡的清香，與香爐裡的檀香味混和在一起，給人一份沉靜安詳的感覺。

    「家裡太熱，到湖濱乘涼去。」父親總是這麼說。其實湖濱並不比家裡涼爽，因為公園裡遊人摩肩擦背，反而泛著一股熱騰騰的氣息。我總是要求：「爸爸，我們坐船吧！」父親每回都微笑答應了。可是坐在船上也不覺得涼爽，因為湖水晒了整整一天太陽，到了夜晚，把熱氣放散出來，撲面而來的是陣陣熱風。詞人說「湖水湖風涼不管」的「涼」字，實在是騙人的話。但無論如何，蕩著船兒，聽槳聲欸乃，看淡月疏星，聞荷花陣陣清香，畢竟是人間天上的享受。

    六月二十四既然是荷花生日，杭州人的遊湖賞花就從六月十八開始，到廿四這一天是最高潮，整個裡外湖都放起荷花燈來。大小畫舫，來往穿梭，談笑聲中，絲竹滿耳。這種遊湖，杭州人稱之為「落夜湖」，歡樂可通宵達旦。

    我不是個懂得賞花的雅人，也體會不到周濂溪愛蓮的那份高潔情操。我喜歡「落夜湖」，只是為了趕熱鬧。父親卻不愛這種熱鬧。母親呢？只要是住在杭州的日子，倒是每年都去「落夜湖」一番。她不是趕熱鬧，而是替父親放荷花燈。放一百盞荷花燈，祈求上天保佑父親長命百歲。所以她坐在船上，總是手撥念佛珠，嘴裡低低地念著心經。因為外公說過的，父親和荷花同生日，照佛家說法，是有一段善緣的。

    記得有一天，父親忽然問我：「『新著荷衣人未識，年年湖海客』是什麼意思，你懂嗎？」我說：「是退隱的意思吧。」父親笑笑說：「就是我現在的心境，擺脫了官職，一身輕快。」但我覺得他臉上似有一絲驀然回首的落寞神情。難道父親仍有用世之心，只是嘆知遇難求嗎？

    抗戰軍興，我們舉家避寇回到故鄉。父親竟因肺病不治，於翌年溘然逝世。那不幸的一天，正是他的生日六月初六。如此悲痛的巧合，使我們對一向喜愛的荷花，也無心欣賞了。

    (節錄自琦君想念荷花)'
