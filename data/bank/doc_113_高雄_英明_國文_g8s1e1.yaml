  group_stem: '余嘗寓居惠州 嘉祐寺，縱步松風亭下，足力疲乏，思欲就林止息。望亭宇尚在木末，意謂是如何得到？良久，忽曰：「此間有什麼歇不得處？」由是如掛鉤之魚，忽得解脫。若人悟此，雖兵陣相接，鼓聲如雷霆，進則死敵，退則死法，當什麼時也不妨熟歇。
