  stem: 關於本文的寫作方式，下列敘述何者錯誤？
  options:
  - label: A
    content: 文中多處運用譬喻手法，擬寫人群聚集虎丘的宴遊盛況
  - label: B
    content: 以細膩文筆描寫虎丘的自然美景，與遊人盛況相互呼應
  - label: C
