  stem: 根據以上這段文字，下列敘述何者最不恰當？
  options:
  - label: A
    content: 流星的顏色會有不同，包括:橙色、黃色、藍綠色等
  - label: B
    content: 流星會出現在天空的任何地方
  - label: C
    content: 智慧型手機的明亮屏幕利於夜視
  - label: D
    content: 獅子座流星雨被認為可產生每秒72 公里速度的流星。
  group_stem: '流星的速度有多快？根據美國流星協會觀測，即將成為流星的太空塵埃粒子以每秒11公里至每秒72 公里的速度進入地球的大氣層。獅子座流星雨被認為產生一些最快的流星。

    流星為什麼會有不同的顏色？流星的顏色會不同，取決於星體內的成分與大氣中分子的相互作用。包括：橙色（鈉）、黃色（鐵）、藍綠色（鎂）、紫羅蘭（鈣）、紅色（氮和氧）。

    如何觀看流星雨？

    （1）查看天氣預報。要想看到最多的流星，需要晴朗的夜空；雲、雨和雪很容易破壞你的觀察。

    （2）帶上毯子或躺椅。觀測流星時需要抬頭很多次，因此與其站著，不如躺在毯子或躺椅上。你的脖子會感謝你！

    （3）看向天頂。所有流星看起來起源於流星雨的輻射點，但實際上，它們會出現在天空的任何地方。所以你看到的天空部分越大，你發現流星的機會也越高。最好平躺並向上看。

    （4）避免看手機。智慧型手機的明亮屏幕不利於夜視，因此應該避免使用它。如果需要使用手機，請事先打開夜間模式。'
