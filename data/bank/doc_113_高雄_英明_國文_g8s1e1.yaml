  group_stem: '虎丘去城可六七里，其山無高岩深壑，獨以近城，故簫鼓樓船，無日無之。凡月之夜，花之晨，雪之夕，遊人往來，紛錯如織，而中秋為尤勝。每至是日，傾城闔戶，連臂而至。衣冠仕女，下至蔀屋，莫不靚妝麗服，重茵累席，置酒交衢間。從千人石上至山門，櫛比如鱗，檀板丘積，樽罍雲瀉。遠而望之，如雁落平沙，霞鋪江上，無得而狀。
    （袁宏道 虎丘記）

