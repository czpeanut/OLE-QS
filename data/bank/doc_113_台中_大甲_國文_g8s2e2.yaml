  section: 5
  number: 3
  type: single
  page: 3
  stem: 文中所述「現代文明的牢籠」是指什麼？
  options:
  - label: A
    content: 設備現代化的牢獄
  - label: B
    content: 交通阻塞的大都會
  - label: C
    content: 現代化後的人類城市
  - label: D
    content: 空氣汙染嚴重的大社區
  group_stem: "2.\n    中國人的天地本和自然同義。人本來是生自自然的，只是因為如今生存在現代文明的牢籠裡，遠離了自然。人一旦進入自然環境之中，就會像回到故鄉一樣的快樂；一草一木都像闊別多年的老朋友，自有一番情趣。\n\
    \    自然之趣到處都有，並不限於名山大川。如果你把你所居住的城市看成你的家，那麼植物園就是你家的後院。坐在自己後院，看到春天透過新葉的陽光，任微風送來花香，都可以怡然自得。\n\
    （韓韓 植物園就在你身邊）"
