  type: single
  page: 1
  stem: 「朝鮮八道」意指朝鮮半島的8 個地方，範圍涵蓋現今的南韓及北韓，受自然環境影響，這些地區的飲食文化各具特色。圖(二)為朝鮮八道的分布圖，依各地區的環境判斷，「江原道」地區的飲食特色最可能為下列何者？
