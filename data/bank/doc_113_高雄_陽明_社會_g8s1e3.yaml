- id: doc_113_高雄_陽明_社會_g8s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 在日系汽車公司上班的大仁哥奉命至日本出差並利用公餘時間進行觀光活動，行程規劃為：①至豐田汽車位於名古屋的總部報告臺灣地區的銷售狀況；②參加三大祭典之一的京都祇園祭；③到東京淺草寺參拜祈求工作順利。大仁哥發現走訪的地點恰好行經日本的主要平原。請問：若依照①～③的順序將對應到的平原排列，下列哪個組合正確？
  options:
  - label: A
    content: 濃尾平原→關東平原→近畿平原
  - label: B
    content: 關東平原→濃尾平原→近畿平原
  - label: C
    content: 濃尾平原→近畿平原→關東平原
  - label: D
    content: 近畿平原→濃尾平原→關東平原
