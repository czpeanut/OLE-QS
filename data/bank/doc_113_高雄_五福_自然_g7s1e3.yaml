- id: doc_113_高雄_五福_自然_g7s1e3_s1_29
  section: 1
  number: 29
  type: single
  page: 4
  stem: 小婷臉上「長痘痘」，出現一個一個膿包，應該是發生了什麼事？
  options:
  - label: A
    content: 抗體防禦
  - label: B
    content: 白血球吞噬作用
  - label: C
    content: 發炎反應
  - label: D
    content: 皮膜阻隔遭到破壞。
  group_stem: "【題組：請閱讀下文並回答29~33 題】\n    小婷因為進入了青春期，內分泌的變化使她出現一系列的生理變化，包含胸部會脹痛、長痘痘、月經來時的疼痛等，讓她非常困擾。媽媽說一定是她沒有好好保養，皮膚缺水，才會分泌過多油脂長痘痘。\n\
    \    但小婷上網查詢後得知：\n    女性卵巢所製造的雌激素是以雄性素作為原料轉化來的，通常，卵巢所製造的雄性素很少分泌至血液中，大多直接轉化成雌激素，只有在特定時段，會有較多的雄性素分泌到血液中，如：每個月的排卵期、青春期、以及停經後的幾年內。\n\
    \    青春期的皮膚容易在男性荷爾蒙的高濃度刺激下，變得較為敏感，由於「抗雄激素作用」，當女性荷爾蒙濃度升高，男性荷爾蒙偏低時，皮膚和頭髮就更加光澤亮麗，可一旦荷爾蒙失調，皮膚也會跟著黯淡無光，瘋狂冒痘。\n\
    \    形成痘痘有三個原因：\n一、荷爾蒙失調\n    增加的男性荷爾蒙或稱作「雄激素佔優勢」（在青春期、月經來之前或是停經期間常見），觸發皮膚脂肪的過多產生，並刺激皮膚細胞的異常快速脱落，隨後阻塞了毛孔，就會變成痘痘。\n\
    二、皮膚菌群的失衡\n    皮膚菌群失衡會使細菌在毛囊中繁殖，當皮膚上的毛囊基本上被死細胞和皮脂阻塞，對於細菌來說，就是養分豐富和肥沃的好所在，新痘便會源源不絕地冒出來。\n\
    三、免疫系統處於警戒狀態\n    免疫系統處於警戒狀態會導致發炎、腫脹和膿液積聚。\n    而且，在大量攝取精緻澱粉類和乳製品後，會增加胰島素和生長因子-1\
    \ 的濃度，使雄激素水平升高，進而促使更多的油脂分泌和誘發發炎。因此，減少高升糖指數的碳水化合物、乳蛋白和飽和脂肪酸的食物，並增加魚類、綠茶、白藜蘆醇和富含維生素D\
    \ 的食物攝入，都有助於緩解痘痘生成。\n    另外，痘痘並非源自皮膚太乾。角質層太乾的表現是乾燥、脫屑；出油多是皮脂腺分泌旺盛。出油多的皮膚，若擦上太多保濕產品，反而會使毛孔被保養品裡的油脂塞得更滿，細菌繁殖更多，讓情況更加惡化。"
