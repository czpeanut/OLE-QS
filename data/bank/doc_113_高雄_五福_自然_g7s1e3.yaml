- id: doc_113_高雄_五福_自然_g7s1e3_s1_45
  section: 1
  number: 45
  type: single
  page: 6
  stem: 請問八仙塵爆的受害者為何會死於感染性疾病？
  options:
  - label: A
    content: 因為其皮膜屏障被破壞，使病原體易侵入體內
  - label: B
    content: 因高溫使白血球失去活性，無法吞噬病原體
  - label: C
    content: 因高溫使全身的抗體失去活性，無法發揮專一性防禦
  - label: D
    content: 因受害者腦死，使免疫功能衰退。
  group_stem: "【請閱讀下文並回答45~48 題】\n    民國104 年6 月27 日，八仙水上樂園發生重大意外，原本是場歡愉的5,000 人粉彩派對，卻因為專業知識不足和人為疏失，導致「粉塵爆炸」，造成499\
    \ 人燒燙傷，15 人死亡。\n    粉塵爆炸（dust explosion）是指懸浮的可燃粉塵顆粒瞬間快速燃燒。可燃物玉米澱粉的粉塵其顆粒小表面積大，且彩色玉米粉添加的人工色素含脂質成分，會降低燃點，加上空氣中本就有氧分子等助燃物。當工讀生將彩粉噴向舞台射燈，彩粉被高溫燈泡引燃，小範圍著火的彩粉本來瞬間被燒盡，但工作人員卻用二氧化碳滅火器意圖「滅火」，滅火器的噴射氣流揚起彩粉，使零星火頭變成火海。\n\
    \    而現場又有「好心人」用衣服拍火，身上著火的民眾因驚恐而跑跳、沒有停下來摀臉，擾動了空氣，使新的氧氣再度接觸高溫彩粉，造成更劇烈燃燒，為燒傷慘劇的主因。\n\
    \    許多人遭火吻而「體無完膚」，醫生們用盡一切手段：包含利用靜脈輸液補充病人大量失去的水分，並在其中加入抗生素抑制感染，但許多人仍死於燒燙傷之後的感染疾病，如：敗血症、休克、腦死、器官衰竭等原因死亡。倖存之被害人，有些因截肢而喪失機能；其他多數被害人亦因二度至三度大面積燒傷，需要歷經清創、換藥、植皮手術，承受生不如死之疼痛，且隨著疤痕增生攣縮，需進行多次皮膚修整重建手術，每日復健更需忍受皮膚拉扯之疼痛，治療及復健過程極其艱辛漫長，且體溫調節功能也出現障礙。\n\
    \    受害者們承受諸此種種生理層面的煎熬，難以完全治癒回復正常，影響日常生活自理能力，不僅無法正常生活，對未來求學、工作就業均產生極大之困難與障礙，信心低落。"
  tags:
    chapter:
      publisher: 康軒
