    \    形成痘痘有三個原因：\n一、荷爾蒙失調\n    增加的男性荷爾蒙或稱作「雄激素佔優勢」（在青春期、月經來之前或是停經期間常見），觸發皮膚脂肪的過多產生，並刺激皮膚細胞的異常快速脱落，隨後阻塞了毛孔，就會變成痘痘。\n\
    二、皮膚菌群的失衡\n    皮膚菌群失衡會使細菌在毛囊中繁殖，當皮膚上的毛囊基本上被死細胞和皮脂阻塞，對於細菌來說，就是養分豐富和肥沃的好所在，新痘便會源源不絕地冒出來。\n\
    三、免疫系統處於警戒狀態\n    免疫系統處於警戒狀態會導致發炎、腫脹和膿液積聚。\n    而且，在大量攝取精緻澱粉類和乳製品後，會增加胰島素和生長因子-1\
    \ 的濃度，使雄激素水平升高，進而促使更多的油脂分泌和誘發發炎。因此，減少高升糖指數的碳水化合物、乳蛋白和飽和脂肪酸的食物，並增加魚類、綠茶、白藜蘆醇和富含維生素D\
    \ 的食物攝入，都有助於緩解痘痘生成。\n    另外，痘痘並非源自皮膚太乾。角質層太乾的表現是乾燥、脫屑；出油多是皮脂腺分泌旺盛。出油多的皮膚，若擦上太多保濕產品，反而會使毛孔被保養品裡的油脂塞得更滿，細菌繁殖更多，讓情況更加惡化。"
