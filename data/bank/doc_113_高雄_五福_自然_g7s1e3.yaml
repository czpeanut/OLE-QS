- id: doc_113_高雄_五福_自然_g7s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '阿通是個棒球迷，在電視前很興奮並專心看著2024 年世界棒球12 強賽，並將音量調大，電視正在轉播著：「投手準備投出，打者面對這顆外角高球，打擊出去……，是全壘打！」

    請問下列敘述何者正確？'
  options:
  - label: A
    content: 投手投球的控制中樞是脊髓
  - label: B
    content: 打者「看到球揮棒的反應時間」是其大腦命令手部肌肉收縮所需的時間
  - label: C
    content: 阿通「將電視音量調大」時，此中樞發出的命令經由腦神經傳到手部肌肉
  - label: D
    content: 當阿通繃緊神經看轉播時，體內的腎上腺素分泌量會增加，使血糖上升。
