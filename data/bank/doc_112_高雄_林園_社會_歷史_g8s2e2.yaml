  stem: 中華人民共和國有一個時期流行的順口溜如下：「生活集體化，食堂如我家」、「吃飯不花錢，努力搞生產」、「人人進入新樂園，吃喝穿用不要錢；雞鴨魚肉味道鮮，頓頓可吃四個盤；天天可以吃水果，各樣衣服穿不完。」這些順口溜的內容是指下列何者？【習作】
