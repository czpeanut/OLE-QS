  group_stem: '葡萄種植三項自然條件

    1.氣候

    葡萄適合生長在南北緯38-53 度的地區生長，所有著名的葡萄酒產區都是在這個緯度之間。太冷，葡萄無法達到成熟，太熱則葡萄成熟過快，只會釀成甜度高、酸度低的酒。

    葡萄藤於生長期約需要1300-1500 小時的日照，一年需要約690 公厘的雨量，如此葡萄才能拿來釀酒。較涼爽且生長期無霜的氣候則可讓葡萄較早熟成並增添適當的酸度，而理想的年均溫約為攝氏15
    度左右。

    2.土壤

    葡萄不需要生長在肥沃的土地，反而特別適合貧瘠的土壤。葡萄樹就有如葡萄的父母，當樹根本身吸收不到足夠的養分，反而會努力將養分往上輸送，養育出品質佳的的葡萄。

    3.降雨量

    降雨對葡萄也很重要。春季葡萄發芽時要充足，成熟時要乾燥，以免影響葡萄的含糖度。在農業環境的因素中，自然降水的多寡與降水量的季節分配，強烈地影響著葡萄的生長和發育，並會影響到產量和品質。'
