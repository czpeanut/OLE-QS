  section: 3
  number: 59
  type: single
  page: 6
  stem: 有關「很吵的小鎮拉巴斯」決定罷免鎮長一案，下列敘述何者正確？(L6)
  options:
  - label: A
    content: 屬於對事的投票，表達對政府的支持與否
  - label: B
    content: 實踐創制權及複決權
  - label: C
    content: 罷免鎮長是對政府定期的授權行動
  - label: D
    content: 透過投票罷免鎮長，落實責任政治。
  group_stem: "故事發生在一個很快樂、很吵的小鎮拉巴斯，小鎮裡住著許多的動物，但動物們覺得小鎮實在太吵了，所以他們決定罷免鎮長。新的鎮長承諾可以帶給大家安靜和安寧，他起先訂了一條很客氣的法律，禁止在公眾場合大聲唱歌。不過，接下來公布的法律卻愈來愈多，最後讓拉巴斯靜得像墳墓一樣。鎮民有些選擇離開，有些留下來學習小聲說話，有些人倒是非常高興可以安靜睡覺。\n\
    \  直到7 年之後，公雞一家搬進這個小鎮。這隻公雞才不管規定是什麼，牠一起床就「咯咯咯」大聲歌唱，鎮長聽到大怒，威脅公雞不准再唱，但公雞完全不理會要脅。即便被關入籠中，即便面對死亡威脅，公雞仍然不願意噤聲，堅持歌唱的自由。最終，公雞的行動引發人們支持回應，法律修改後，小鎮又恢復原來的吵鬧。\n\
    「改寫自繪本:不肯沉默的公雞」"
