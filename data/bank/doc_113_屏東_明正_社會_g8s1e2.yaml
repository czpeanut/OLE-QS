- id: doc_113_屏東_明正_社會_g8s1e2_s3_64
  section: 3
  number: 64
  type: single
  page: 6
  stem: 民眾提出質疑「要求已確診或有感染疑慮者必須接受強制隔離」，是認為政府可能損害到人民的何種基本權利？
  options:
  - label: A
    content: 平等權
  - label: B
    content: 自由權
  - label: C
    content: 受益權
  - label: D
    content: 參政權。
  group_stem: '【題組二】

    2003 年4 月，台北市和平醫院發生集體感染SARS 事件，為防堵急性傳染病擴大傳播，台北市政府依照當時的傳染病防治法規定，要求已確診或有感染疑慮者必須接受強制隔離，主管機關在必要時得為「必要之處置」，當時院內某周醫師因違反必要之處置規定，被記兩支大過、停職，併罰24
    萬元、停業3 個月處分。

    周醫師不服處分提出【甲】被駁回，而後提出的訴訟也被駁回。逕而聲請大法官釋憲，大法官做出釋字第690號解釋，為了維護隔離者及他人的生命、身體之安全所做的「必要之處置」，此作為並不違憲。

    請依據上文內容回答第64 題至第66 題：'
