  page: 1
  stem: 清朝以少數民族入主中原，一方面沿用明朝科舉制度，籠絡人心。另一方面則屠殺反清勢力，試圖消滅任何對清政權不利的因素，因此清初曾締造長達一百多年的「康雍乾盛世」。請問：上述的盛世時間長達清朝壽命的二分之一，主要得力於下列哪一因素？
