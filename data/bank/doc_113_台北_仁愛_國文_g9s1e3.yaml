  stem: 關於文中引述的三則周處傳說，說明不適當的是：
  options:
  - label: A
    content: 孔約《志怪》僅簡單提出人們懼怕的三害，尚未有完整故事
  - label: B
    content: 祖台《志怪》則擴大渲染，將周處除三害的過程詳實描述
  - label: C
    content: 《世說新語》結合了前人故事並增加周處改過自新的情節
  - label: D
    content: 《世說新語》加入里人相慶，可視為故事中的轉折情節。
  group_stem: "周處生時或死後沒有多久，都有關於他的軼聞流傳。如孔約\n《志怪》云：「義興有邪足虎，溪渚長橋有蒼蛟，並大啖人，並郭\n西周，時謂郡中三害。周即處也。」又如祖台之《志怪》所述：「義\n\
    興郡溪渚長橋下有蒼蛟吞啖人，周處執劍橋側伺。久之，遇出，\n於是懸自橋上投下蛟背而刺蛟，數創，流血滿溪，自郡渚至太湖\n句浦乃死。」兩書均成於東晉時期，時間相近。同一件事，何以\n\
    在記述上各有其偏重之處？蓋由民間口傳，各記見聞，彼此歧異，\n故是尋常事。《世說新語》則結合「三害」與「斬蛟」，並增加「殺\n虎」情節，使傳說更為完整：\n\
    \ 周處年少時，兇彊俠氣，為鄉里所患。又義興水中有蛟，山\n中有白額虎，並皆暴犯百姓。義興人謂為「三橫」，而處尤劇。\n或說處殺虎斬蛟，實冀三橫唯餘其一。處即刺殺虎，又入水\n\
    擊蛟。蛟或浮或沒，行數十里，處與之俱。經三日三夜，鄉\n里皆謂已死，更相慶。竟殺蛟而出，聞里人相慶，始知為人\n情所患，有自改意……處遂自改勵，終為忠臣孝子。\n\
    \ 而近期有電影業者將周處的故事改作，成為電影《周處除三\n害》：亡命天涯的槍擊犯陳桂林，誤信醫師的診斷，以為自己身罹\n絕症。在醫師勸說自首後，因為不希望自己死後被別人遺忘，決\n\
    定以惡制惡，追殺排名在他之前的二大通緝要犯。最後投案自首，\n接受槍決伏法。陳桂林自以為是現代周處，卻沒想到困住他，讓\n他逃無可逃的，從來都不是外在環境，而是內心的貪、嗔、痴。\n\
    \ 改寫自羅景文〈周處傳說探究〉"
