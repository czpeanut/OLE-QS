    Collection & More 1951-2005」一展，聚焦於草間彌生1951 年\n至2005 年間的創作。展覽分為四大主題，以草間彌生生涯中的創\n\
    作探索為脈絡，帶領觀眾深入其豐富的藝術歷程與心靈世界。\n 以獨特的外觀和大膽的藝術風格而聞名的當代藝術家草間彌\n生擁有「前衛女王」的稱號，為引領當代日本藝術的先驅人物。\n\
    她於1929 年出生於長野縣，為地方望族，因此有許多接觸美術和\n藝術的機會。因幼年時父母失和，導致她自幼便患上了思覺失調\n症，長期受幻聽和幻覺折磨，而支撐她走下去的是藝術。她試圖\n\
    將自己的幻聽和幻覺用繪畫呈現出來，藉此從襲來的苦痛中逃離。\n 《南瓜》是草間彌生的代表作也是最受喜愛的作品。這座巨\n大的南瓜雕塑目前座落在瀨戶內海的「直島」上，如今已成為直\n\
    島的象徵，也成為熱門的旅遊景點。「南瓜最吸引我的是它脂粉未\n施的大肚子，還有強大的精神安定感。」\n 草間彌生的「圓點圖案」給人可愛淘氣的印象，背後蘊含著\n\
    她獨特的哲學。從小就患有精神分裂症的草間彌生，童年時所看\n到的景象是被圓點和細密的網格圖案所填滿的「幻視」，以及植物\n和動物用人類語言和她對話的「幻聽」。即使知道這不是現實卻無\n\
    法適應，她面對恐懼的方式就是「繪畫」。\n 草間彌生的作品受到日本畫的影響，善用不同媒材，風格橫\n跨各種主義及形式。不止純藝術的創作，她同時與流行、時尚、\n\
    商業等領域結合，獲得豐厚報酬。\n 她的作品以高度對比的圓點著名，大量相似的圓點，經過縝\n密的構思後佈滿物件表面。例如：具有繁殖意義的蕈類，以及代\n表日本戰後心靈糧食的南瓜，都經由草間雙手呈現在世人眼前。\n\
    她也擁有藝術家自戀的部份，習慣打扮得跟作品一樣，全身包裹\n著各色圓點的服裝，在鏡頭前大量曝光。對日本人來說，草間彌\n生就如同南瓜般，營養了生理也滋養了心靈。\n\
