- id: doc_113_台北_仁愛_國文_g9s1e3_s3_39
  section: 3
  number: 39
  type: single
  page: 3
  stem: 依據甲文，關於宋代防治傳染病的敘述，何者錯誤？
  options:
  - label: A
    content: 已經意識到環境衛生與疫病相關
  - label: B
    content: 加強邊境檢查以免疫病危及軍隊
  - label: C
    content: 透過隔離降低患者交互感染機率
  - label: D
    content: 翰林院醫官和太醫局多參與救治。
  group_stem: "【甲】宋代防疫\n宋代有近百次的大規模傳染病發生。除了天然災害所引起的疫\n病，戰爭也使軍隊和邊境的疫病次數超越前代。此外，不合理的\n\
    生活方式所引發的疫病也逐漸增多，例如淳熙五年寧海縣的疫\n病，便是當地人食用海鰍所致。\n 當疫病流行，政府通常令翰林院醫官、太醫局派人巡診賜藥，\n如紹興二十六年，臨安疫，宋高宗令醫官配製小柴胡湯醫治患者。\n\
    改善環境衛生也是一項作為，如真德秀任職泉州時，見城內溝渠\n淤塞，蒸為癘疫，乃下令清理。為防止疫情擴散，政府也採取隔\n離病人的措施，如元祐四年，杭州因乾旱而發生大疫，蘇軾設立\n\
    專門的「病坊」來收治患者。蘇軾在杭州的賑災抗疫，不僅蘇轍\n在其兄的墓誌銘有具體記載，明代醫書也說蘇軾以「聖散子」這\n帖藥方為滿城病患施救。後來，政府以「安濟坊」為名在各地設\n\
    置這類病坊，持續推行「以病人輕重而異室處之，以防漸染」。\n 改寫自韓毅〈宋代政府應對疫病的歷史借鑒〉\n【乙】 蘇東坡防疫\n明年方春，即減價糶①常平米，民遂免大旱之苦。公又多\n\
    作饘粥、藥劑，遣吏挾醫，分坊治病，活者甚眾。公曰：「杭，\n水陸之會，因疫病死比他處常多。」乃裒②羨緡③得二千，復\n發私橐④得黃金五十兩，以作病坊，稍蓄錢糧以待之。\n\
    \ 蘇轍〈東坡先生墓誌銘〉\n【注釋】① 糶：音ㄊㄧㄠˋ，出售穀物。② 裒：音ㄆㄡˊ，聚\n集。③ 羨緡：盈餘款項。④ 橐：音ㄊㄨㄛˊ，袋子。"
