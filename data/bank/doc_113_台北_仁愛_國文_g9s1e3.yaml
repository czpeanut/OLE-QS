    骨的諂媚。……鹹最俗而苦最高，常人日不可無鹹但苦不可兼日，

    況且苦味要等眾味散盡方才知覺，是味之隱逸者，如晚秋之菊，

    冬雪之梅。而鹹則最易化舌，入口便覺，看似最尋常不過，但很

    奇怪，鹹到極致反而是苦，所以尋常之中，往往有最不尋常之處。

