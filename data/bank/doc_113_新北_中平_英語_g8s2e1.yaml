  stem: What is the reading mainly about?
  options:
  - label: A
    content: Different ways to cook insects.
  - label: B
    content: Eating insects as food.
  - label: C
    content: The most special snack in the world.
  - label: D
    content: Something fun about insects.
  group_stem: '(D)

    Would you like to eat an insect? Many people in the world don’t have enough to
    eat, and insects may be a kind of food in the coming years.

    Insects are full of protein, so they are good for your health. Eating insects
    is good for the environment, too. Farms for them are easier to take care of than
    farms for animals and vegetables. They need less room and less water. Even so,
    it may be hard to get some people to eat insects. Some people do not even like
    to look at them. They won’t want to touch them, so it may take a long time for
    them to think of insects as food.

    You can cook insects in many different ways, and you can eat them as a snack or
    a dish. They taste better than you think. For example, some ants are sweet like
    honey, and other ants taste like mushrooms. So, why not give it a try next time?

    protein 蛋白質 take care of 照顧 room 空間 mushroom 蘑菇'
