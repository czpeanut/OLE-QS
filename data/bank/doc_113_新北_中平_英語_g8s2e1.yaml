  number: 4
  type: single
  page: 3
  stem: What is a common(共同的) characteristic(特徵) of snakes?
  options:
  - label: A
    content: They can make sounds.
  - label: B
    content: They have four legs.
  - label: C
    content: They have flexible bodies and with no legs.
  - label: D
    content: They can fly.
  group_stem: '(B)

    Snakes are reptiles with long bodies and no legs. There are over 3000 different
    species of snakes in the world. Snakes shed their skin about 3-6 times a year.
    The age of the snake plays an important role in how often it sheds. Do you know
    why snakes shed their skin? Because snakes are always growing, but their skin
    doesn’t grow with them.

    Some snakes are venomous. They use their venom to kill other animals. They also
    can attack other animals even in the dark. There are two holes called pits in
    their faces. They can use them to sense the heat of other animals and kill them
    .

    With their flexible jaws, snakes can eat animals that are bigger than them. Next
    time if you see a snake in the forest, just stay away from it. It’s better to
    be safe than sorry.

