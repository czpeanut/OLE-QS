  group_stem: '【甲】

    常常看見你／在鳥店徘徊留連／終日素描一隻籠中的畫眉／所以猜想你喜歡鳥

    我也喜歡，不過／比你貪心一點／總共擁有幾萬幾千幾百零幾隻／統統養在天空裡／從來不必擔心／誰會遠走高飛

    我請大風陪它們賽跑／如果累了便躺在雲上喘口氣／如果吃膩春天的食物／夏天自然會有新奇的菜單／夜晚如果睏倦／每棵樹都可供高枕安眠／我一點也不擔心／如果真的十分想念／一抬頭便能相見

    ——節錄自陳斐雯〈養鳥須知〉

    【乙】

    平生不喜籠中養鳥，而予又未嘗不愛鳥，但養之有道耳。欲養鳥莫如多種樹，使繞屋數百株，扶疏茂密，為鳥國鳥家。將旦時，睡夢初醒，尚輾轉在被，聽一片啁啾，如〈雲門〉、〈咸池〉１之奏。及披衣而起，頮面２、漱口、啜茗，見其揚翬振彩３，倏往倏來，目不暇給，固非一籠一羽之樂而已。大率平生樂處，欲以天地為囿，江漢為池，各適其天，斯為大快。比之盆魚籠鳥，其鉅細仁忍何如也！

    ——鄭燮〈濰縣署中與舍弟墨第二書〉信後又附一紙

     1.〈雲門〉、〈咸池〉：黃帝以下六代的古樂。

    2.頮面：洗臉。頮，音ㄏㄨㄟˋ。

    3.揚翬振彩：張開五彩繽紛的翅膀飛行。翬，音ㄏㄨㄟ。'
