    content: 鳳凰臺上鳳凰遊，鳳去臺空江自留
  - label: B
    content: 始知鎖向金籠聽，不及林間自在啼
  - label: C
    content: 曾經滄海難為水，除卻巫山不是雲
  - label: D
    content: 但得眾生皆得飽，不辭羸病臥殘陽。
