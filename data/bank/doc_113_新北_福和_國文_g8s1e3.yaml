- id: doc_113_新北_福和_國文_g8s1e3_s2_26
  section: 2
  number: 26
  type: single
  page: 5
  stem: 下列有關大人國的敘述，何者正確？　　　　　　　　　　【閱讀素養題】
  options:
  - label: A
    content: 天生足下有雲，定出社會階級
  - label: B
    content: 色由心生，足下雲因行為而變
  - label: C
    content: 位居高官腳下紅鞋，顯示貴氣
  - label: D
    content: 急公好義，爭取晉升官爵機會。
  group_stem: '走了幾日，到了大人國。國中以嶺為城：嶺外都是稻田，嶺內才有居民。唐敖、林之洋、多九公三人到了市中，一切光景與君子國相仿，只是每個人足下的雲五顏六色，形狀不一。這時有個乞丐腳登彩雲走過，唐敖問九公：「聽說雲之顏色，以五彩為貴，黃色次之，黑色為卑，為何這個乞丐卻登彩雲？」林之洋道：「嶺上那個秃驢，又吃葷，又喝酒，又有老婆，明明是個酒肉和尚，他的腳下也是彩雲。難道這個花子同那和尚有其好處麼？」

    多九公解釋道：「雲之顏色全由心生，關鍵在行為善惡，不在富貴貧賤。胸襟光明正大，足下就會出現彩雲；倘或滿腔奸私暗昧，足下自生黑雲。雲由足生，色隨心變，因此國人皆以黑雲為取，遇見惡事都是藏身退後；遇見善事莫不踴躍爭先，毫無小人習氣，故鄰邦以『大人國』呼之。」

    忽見街上民人都向兩旁一閃，讓出一條大路。原來有位官員走過，頭戴烏紗，身穿官服，上置紅傘，前呼後擁十分威嚴，腳下圍著紅綾。多九公道：「此等人，因腳下忽生一股惡雲，其色似黑非黑，類如灰色，人都叫做『晦氣色』。凡生此雲的人必是暗中做了虧心事，因此在他腳下生出這股晦氣，教他人前現醜。他雖用綾布遮蓋以掩眾人耳目，那知卻是『掩耳盜鈴』。只要痛改前非，一心向善，雲的顏色就會隨心變換。若惡雲久生足下，不但國王會查訪其劣跡，重治其罪，國人也會因他甘於下流而避開。」

    林之洋道：「原來老天做事也不公！」唐敖道：「為何不公？」林之洋道：「老天只將這雲生在大人國，別處都不生，難道不是不公？若天下人都有這塊招牌，讓那些瞞心昧已、不明道德的，兩隻腳下都生一股黑雲，個個人前現醜，人人看著驚心，豈不痛快？」多九公道：「世間那些不明道德的，腳下雖未現出黑雲，他頭上卻是黑氣沖天，比腳下黑雲還更利害！」林之洋道：「他頭上黑氣，為甚俺看不見？」多九公道：「你雖看不見，老天卻看得明白，分得清楚。善的給他善路走，惡的給他惡路走，自有一定道理。」林之洋道：「若果這樣，俺也不怪他老人家不公了。」大家又到各處走走，惟恐天晚，隨即回船。

    ——改寫自李汝珍《鏡花緣》'
