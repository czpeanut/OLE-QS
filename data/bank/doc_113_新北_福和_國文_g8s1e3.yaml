  - label: D
    content: 不陰不晴的天氣，乍寒乍暖的時令。樹枝間新透出葉芽，稀疏瑣碎的點綴著，地上黃一塊，黑一塊，又淺淺的綠一塊，看去很不順眼，但幾天後，便成了一片蓊然的綠雲，一條綴滿星星野花的繡氈了。
