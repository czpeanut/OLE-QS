  group_stem: '蝴蝶以美麗的色彩與優美的飛舞姿態著稱，與蛾屬於同一綱目下的家族，與其他昆蟲最大的不同，是身上長有大而耀眼的翅膀。蝴蝶的翅膀上覆蓋了一層一觸即落的鱗片，所以才歸屬鱗翅目。這些鱗片上有葉狀物、脊狀物與許多溝紋，藉著射入的光波反射開來，產生炫目的色彩，因此翅膀才會豔麗動人。然而蝴蝶的翅膀除了美觀之外，還有自衛的功能。舉例來說，蛇目蝶的翅膀上有明顯的蛇眼點，當牠們發現有敵人接近時，就會徐徐拍動雙翅，借蛇眼使敵人產生錯覺，以達嚇阻之效。

    有些雄蝶具有很強的領域性，牠們會站在樹上的葉片或曠地上守衛，當有雌蝶闖入，便會進行求偶；如果飛入的是雄蝶，便互相追逐，直至入侵者離開領域範圍。

    蝴蝶是完全變態類昆蟲，牠們的生命週期必須歷經卵、幼蟲、蛹、成蟲四個階段，絲毫馬虎不得。

    曾經有個小孩撿到一個蛹，他想看蛹如何羽化成蝴蝶。過了幾天，蛹上出現一道裂痕，裡面的蝴蝶似乎被什麼東西卡住了，掙扎了幾個小時仍然出不來。小孩於心不忍，拿起剪刀把蛹剪開，幫助蝴蝶脫蛹而出，可是蝴蝶的身軀臃腫，翅膀乾癟，根本飛不起來。過了幾個小時，蝴蝶的翅膀仍舊舒展不開，牠注定要拖著乾癟的翅膀爬行一生。

    每一個生命的成長都充滿了神奇與莊嚴，瓜熟墜地，水到渠成；蝴蝶一定得在蛹中痛苦的掙扎，一直到牠的翅膀強壯之後，才會破蛹而出。

    ——改寫自郭泰〈拜動物為師〉'
