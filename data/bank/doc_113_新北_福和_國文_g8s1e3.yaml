- id: doc_113_新北_福和_國文_g8s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 3
  stem: '曾幾何時，這半世紀以來，人類的高度科技改變了地球的生態，澈底顛覆大自然的運作。這其中已被馴育做為人類「寵物」角色的貓貓狗狗，被大量的人工繁殖，改造牠們的原始本能，以喪失自由換取溫飽代價進駐人類家庭。這對於一個生命來說，等同豢養在沒有出口的牢籠而已，牠們是現代文明的羔羊，是芸芸眾生的苦難者。

    ——心岱〈愛、時間與記憶〉

    下列哪個選項最符合上文中所傳達的觀點？　　　　　　　【白話閱讀理解】'
