  group_stem: '吾昔少年時，所居書屋前，有竹柏雜花，叢生滿庭，眾鳥巢其上。武陽君 1惡殺生，兒童僕婢，皆不得捕取鳥雀。數年間，皆巢於低枝，其鷇2可俯而窺也。又有桐花鳳四、五，日翔集其間。此鳥羽毛，至為珍異難見，而能馴擾，殊不畏人，閭里間見之，以為異事。此無他，不忮之誠，信於異類也。

    有野老言：鳥雀巢去人太遠，則其子有蛇、鼠、狐狸、鴟、鳶之憂；人既不殺，則自近人者，欲免此患也。由是觀之，異時鳥雀不敢近人者，以人甚於蛇、鼠之類也。「苛政猛於虎」，信哉！

    ——蘇軾《東坡志林•記先夫人不殘鳥雀》

    1.武陽君：蘇軾母程氏，曾受皇帝封為「武陽君」。

    2.鷇：尚須由母鳥餵哺之幼鳥，音ㄎㄡˋ。'
