    content: 最妙的是下點小雪呀。看吧，山上的矮松越發的青黑，樹尖上頂著一髻兒花，好像日本看護婦。山尖全白了，給藍天鑲上一道銀邊。山坡上，有的地方點，有的地方草色還露著。
  - label: B
    content: 那時暄氣初消，月正圓，蟹正肥，桂花皎潔，也未陷入凜冽蕭瑟氣態，這是最值得賞樂的。
