  section: 5
  number: 8
  type: single
  page: 2
  stem: Which might the writer agree with? [agree同意]
  options:
  - label: A
    content: Following a friend's travel plan is a good idea.
  - label: B
    content: Being safe is important when you plan a trip.
  - label: C
    content: If it's your first trip to a different country, you should take a backpackig
      tour.
  - label: D
    content: A backpacking tour is safer.
  group_stem: '(三)

    Group Tours vs. Backpacking Tours

    People like to spend their vacations in other countries, but before you decide
    where to go, ask yourself this quesiton-which is your favorite, a group tour or
    a backpacking tour?

    A group tour means a travel agency will plan everyting for your trip. On the other
    hand, a backpacking tour means you travel by yourself and need to plan everyting
    on your own.

    Here are some differences between them.

    *Group Tours

    1. The travel agency will do the planning for you.

    2. It may be safer to travel with a group.

    3. Your tour guide knows the place well, and you may learn a lot from him/her.

    *Backpacking Tours

    1. You can visit the sights according to your needs. You can decide how much you
    want to spend on the trip.

    2. You need to be more careful when you travel alone.

    3. Planning the trip can help your time management.

