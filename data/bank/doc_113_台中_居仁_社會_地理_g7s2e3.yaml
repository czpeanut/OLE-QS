  stem: 馬祖藍眼淚是海中一種微小生物「夜光藻」發光所造成的自然奇觀。當這種藻類在受到外力擾動時（如浪花拍打、船隻劃過或人為觸碰），會產生冷光反應，發出淡藍色光芒，看起來就像是夜海中灑滿的藍色淚滴。每年在春末至夏季的4~6
