  group_stem: '閱讀二：植物界螢火蟲－黑暗中持續自發光的植物

    從今以後，在夜間觀賞植物可能不用另外打燈照明了。科學家最近利用生物技術成功將發光蘑菇的遺傳物質（DNA）移植到菸草植物身上，讓後者在整個生命週期都持續散發明亮的綠色可見光，以前只聞螢火蟲滿天飛，未來或許將聽聞螢光植物遍地開。

