- id: doc_113_桃園_桃園_自然_g7s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: '正洋以複式顯微鏡觀察到的視野如右圖。若正洋想要放大觀察的物體，則相關的操作步驟如下：

    (1) 將“A”移到視野中央，應將載玻片稍稍往_甲_方向移動。

    (2) 當“A”在視野中央時，轉動顯微鏡的_乙_，使40X物鏡對準鏡臺圓孔，此時視野亮度會變_丙_。

    (3)然後稍稍轉動顯微鏡的_丁_，便能看清楚“A”如圖。


    則下列操作步驟的填空(甲、乙、丙、丁)，何者正確？


    | 選項 | 甲 | 乙 | 丙 | 丁 |

    | :---: | :---: | :---: | :---: | :---: |

    | (A) | 左方 | 光圈 | 暗 | 細調節輪 |

    | (B) | 左方 | 旋轉盤 | 暗 | 細調節輪 |

    | (C) | 右方 | 光圈 | 亮 | 粗調節輪 |

    | (D) | 右方 | 旋轉盤 | 暗 | 細調節輪 |'
  options:
  - label: A
    content: 甲：左方、乙：光圈、丙：暗、丁：細調節輪
  - label: B
    content: 甲：左方、乙：旋轉盤、丙：暗、丁：細調節輪
  - label: C
    content: 甲：右方、乙：光圈、丙：亮、丁：粗調節輪
  - label: D
    content: 甲：右方、乙：旋轉盤、丙：暗、丁：細調節輪
