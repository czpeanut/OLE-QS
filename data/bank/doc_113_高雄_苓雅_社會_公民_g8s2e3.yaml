questions:
- id: doc_113_高雄_苓雅_社會_公民_g8s2e3_s1_41
  section: 1
  number: 41
  type: single
  page: 1
  stem: 以下哪一種情況屬於行政處分的範疇？
  options:
  - label: A
    content: 小美申請在自家空地興建房屋，經建管單位審查後核發建築執照，准許施工
  - label: B
    content: 無相關停車識別證不得任意占用特定對象（婦幼、身障）專用的停車
  - label: C
    content: 小志因犯竊盜罪，被法院判處拘留 50 天，需到看守所執行
  - label: D
    content: 小華與健身房簽約後發現對方違約，便依民法規定單方面解除契約。
- id: doc_113_高雄_苓雅_社會_公民_g8s2e3_s1_42
  section: 1
  number: 42
  type: single
  page: 1
  stem: 2019 年我國修正《少年事件處理法》，以「曝險少年」取代「虞犯少年」，希望透過輔導與安置幫助少年脫離不利環境。下列何者並非辨識「曝險少年」的行為徵兆？
  options:
  - label: A
    content: 經常出入夜店、酒店等場所
  - label: B
    content: 和同學唱歌時喝毒品咖啡包助興
  - label: C
    content: 計畫要偷金飾店的項鍊，買好工具準備偷竊
  - label: D
    content: 經常攜帶刀械在背包中。
- id: doc_113_高雄_苓雅_社會_公民_g8s2e3_s1_43
  section: 1
  number: 43
  type: single
  page: 1
  stem: 晨風在網路上訂購了一架模型飛機，並完成了付款。他的這次行為涉及到的法律與下列何者相同？
  options:
  - label: A
    content: 陳小姐向政府投書，要求正視環保問題
  - label: B
    content: 呂伯母返鄉投票，支持心目中的候選人
  - label: C
    content: 王大哥一時糊塗，偷竊店家財物
  - label: D
    content: 嘉雲在父親過世後繼承遺產。
- id: doc_113_高雄_苓雅_社會_公民_g8s2e3_s1_44
  section: 1
  number: 44
  type: single
  page: 1
  stem: 某人因為無照駕駛被警察攔下，依法開出了罰單。以下哪一種情況屬於相同的責任類型？
  options:
  - label: A
    content: 小傑把鄰居的車窗打破，被報警逮捕
  - label: B
    content: 小芸搬出租屋處後，積欠兩個月房租未繳
  - label: C
    content: 小宏酒醉後在公共場所製造騷亂，遭警拘留
  - label: D
    content: 小喬在超商搶奪收銀機裡的現金後逃跑。
- id: doc_113_高雄_苓雅_社會_公民_g8s2e3_s1_45
  section: 1
  number: 45
  type: single
  page: 1
  stem: 林先生為了擴展家中空間，未經核准便封住了住家旁的防火巷。此舉引起鄰居反彈，也被建築主管機關注意，隨後林先生收到「限期拆除」的通知書。若林先生對該行政處分感到不服，想要依法捍衛自身權益，下列何者才是正確的權利救濟方式？
  options:
  - label: A
    content: 到當地議員服務處陳情，請求協助伸張參政權
  - label: B
    content: 向法院提出民事訴訟，要求鄰居不得干涉
  - label: C
    content: 先向原處分機關的上級機關提起訴願
  - label: D
    content: 聯絡社區調解委員會，希望透過調解解決糾紛。
- id: doc_113_高雄_苓雅_社會_公民_g8s2e3_s1_46
  section: 1
  number: 46
  type: single
  page: 1
  stem: 網紅家寧發現某週刊刊登她的不實緋聞，內容不但嚴重影響名譽，甚至影響到她的工作與家庭。她氣憤之下前往法院提告，希望能依法追究該週刊記者的刑事責任。請問：家寧的這項行為在刑事訴訟上稱為什麼？
  options:
  - label: A
    content: 上訴
  - label: B
    content: 自訴
  - label: C
    content: 告訴
  - label: D
    content: 公訴。
- id: doc_113_高雄_苓雅_社會_公民_g8s2e3_s1_47
  section: 1
  number: 47
  type: single
  page: 1
  stem: 在日常生活中，當個人權利受到損害時，依法進行救濟是非常重要的。下列哪一種情況，只能以提起訴訟來主張權益？
  options:
  - label: A
    content: 藝人與經紀人工作分潤爭議，協商破裂
  - label: B
    content: 夫妻離婚爭子女監護權，雙方調解無果
  - label: C
    content: 阿傑在夜店迷昏小慧，將其性侵
  - label: D
    content: 梅梁新申請改名字遭戶政事務所駁回。
- id: doc_113_高雄_苓雅_社會_公民_g8s2e3_s1_48
  section: 1
  number: 48
  type: single
  page: 1
  stem: 阿明看連續劇時劇中提到「打官司」情節，讓他隔天到校與同學討論，下列同學的說法，何者正確？
  options:
  - label: A
    content: 大華說：「我爸之前和房客吵租金，是去找檢察官幫他打民事官司的。」
  - label: B
    content: 毛毛說：「有人偷我腳踏車，不處理的話，我可以再提起一次公訴。」
  - label: C
    content: 阿丁說：「如果有人被打，只有被打的人才能對傷人者提刑事訴訟。」
  - label: D
    content: 珍珍說：「我表姐被網拍賣家詐騙，她提民事訴訟要求賠償損失。」
- id: doc_113_高雄_苓雅_社會_公民_g8s2e3_s1_49
  section: 1
  number: 49
  type: single
  page: 1
  stem: 小宇因為想要獨立生活，便與房東簽了三年的租屋契約。某天他在超商偷了一瓶飲料，雖然被逮捕，但由於他的年齡與身分特殊，法院決定減輕其刑責。請問，下列何者最可能是小宇的情況？
  options:
  - label: A
    content: 小宇尚未滿14 歲
  - label: B
    content: 小宇具有完全行為能力，故須負完全刑事責任
  - label: C
    content: 小宇是喑啞人士，依法得以減刑
  - label: D
    content: 小宇屬於無行為能力人，所有法律行為無效。
- id: doc_113_高雄_苓雅_社會_公民_g8s2e3_s1_50
  section: 1
  number: 50
  type: single
  page: 1
  stem: 小恩今年 15 歲，父母同意讓她擁有一支手機並自行繳納月租費，怎料她竟在手機聊天室中造謠同學販售電子菸。根據我國法律，下列哪一項正確反映她在民事與刑事上的法律地位？
  options:
  - label: A
    content: 屬無行為能力人，所有民事契約皆無效
  - label: B
    content: 屬限制責任能力人，但不用負賠償責任
  - label: C
    content: 她為限制行為能力人，民事部分需法定代理人同意，刑事可減輕其刑
  - label: D
    content: 她為完全行為能力人與責任能力人，需為行為負全部責任。
- id: doc_113_高雄_苓雅_社會_公民_g8s2e3_s1_51
  section: 1
  number: 51
  type: single
  page: 1
  stem: 小禾看到新聞上說，有人因為在網路開玩笑就被抓去罰，她好奇地問：「法律可以這樣亂罰人嗎？」老師回答：「不行，法律要先寫清楚什麼是犯罪，才能處罰。」請問，這種做法可以下列哪個例子說明？
  options:
  - label: A
    content: 小偉說：「像我亂穿搭配色可能會被笑，但法律沒寫說穿衣難看是犯罪，警察就不能罰我啦！」
  - label: B
    content: 小萍在網購時發現賣家突然漲價，她氣得說：「這樣很不講信用耶！」
  - label: C
    content: 阿強因被懷疑偷東西被帶去警局，但警察說：「還沒判決前不會當你有罪。」
  - label: D
    content: 錦鑫跟朋友合夥開咖啡店，他們一起決定了合約內容與分工方式。
- id: doc_113_高雄_苓雅_社會_公民_g8s2e3_s1_52
  section: 1
  number: 52
  type: single
  page: 2
  stem: 新聞報導：「某地檢署檢察官利用職權，從經辦的案件中牟取利益，被法院依貪汙罪從重判處無期徒刑，褫奪公權終身，所得贓款與不法利益還要追繳。」上述檢察官被判處的刑責，相關敘述下列何者正確？
  options:
  - label: A
    content: 所受的從刑為剝奪自由
  - label: B
    content: 所受的主刑為剝奪權利
  - label: C
    content: 可以參與選舉，但不能公投
  - label: D
    content: 可以參加公投，但不能競選。
- id: doc_113_高雄_苓雅_社會_公民_g8s2e3_s1_53
  section: 1
  number: 53
  type: single
  page: 2
  stem: 依《少年事件處理法》的立法精神，下列哪一項案件的處理方式與其他案件不同？
  options:
  - label: A
    content: 17 歲少女與同齡好友一起犯下強盜案件
  - label: B
    content: 16 歲少年無正當理由攜帶危險器械到校
  - label: C
    content: 14 歲少女偷拿走同學放在置物櫃的東西
  - label: D
    content: 12 歲少年與家人發生口角因而氣憤傷人。
- id: doc_113_高雄_苓雅_社會_公民_g8s2e3_s1_54
  section: 1
  number: 54
  type: single
  page: 2
  stem: 品禹正在參加一場以「防制兒少性剝削」為主題的研討會，請問下列哪一個案例最符合這類研討會的討論範圍？
  options:
  - label: A
    content: KTV 業者讓國中生穿著性感服裝陪唱客人、招攬消費
  - label: B
    content: 某遊戲公司推出手機遊戲，內容出現大量不雅畫面，卻未限制年齡下載
  - label: C
    content: 某直播平台未設年齡限制，國小生半夜進入成人直播間互動
  - label: D
    content: 某YouTuber 分享與弟弟的日常生活Vlog，並設定為全齡觀看頻道。
- id: doc_113_高雄_苓雅_社會_公民_g8s2e3_s1_55
  section: 1
  number: 55
  type: single
  page: 2
  stem: '右列為3 名少年觸法後所受到的處置，相關分析何者正確？

    (甲) 國中七年級的煒傑在超商偷東西，法官看在他是初犯，告知應遵守的事項後，將他交由法定代理人帶回

    (乙) 16歲的國柱身上背有5 條詐欺罪，法官責令他離開自己的家，住進社福機構

    (丙) 17 歲的阿正在這裡遵守住宿規定，經由學校教育矯正其不良習性'
  options:
  - label: A
    content: 甲案會交付少年保護官管束
  - label: B
    content: 乙採取感化教育的進行方式
  - label: C
    content: 乙若該生表現良好將准予減刑
  - label: D
    content: 丙地點推測是少年矯正學校。
  assets:
  - key: s1_55_f1
    kind: figure
    file: doc_113_高雄_苓雅_社會_公民_g8s2e3/s1_55_f1.png
- id: doc_113_高雄_苓雅_社會_公民_g8s2e3_s1_56
  section: 1
  number: 56
  type: single
  page: 2
  stem: '(甲)蝦妹今年15 歲，暑假在媽媽好友的飲料店打工，(乙)她平日（週一到週五）從早上10 點工作到下午5 點半，(丙)週末則是從中午12 點工作到晚上7
    點，(丁)她的工作主要是在廚房裡幫忙煮、倒熱茶。

    請問根據勞動相關法規，上述哪些情況可能已違法？'
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 丙丁
  - label: C
    content: 乙丙
  - label: D
    content: 甲丁。
- id: doc_113_高雄_苓雅_社會_公民_g8s2e3_s1_57
  section: 1
  number: 57
  type: single
  page: 2
  stem: 原則上今年九月開學後，學生進入校園手機就必須集中管理，理由之一是避免超過「合理時間」持續使用電子類產品，而《兒童及少年福利與權益保障法》亦明定，父母、監護人或其他實際照顧兒少者，應禁止兒少有上述行為，若父母違反規定，情節嚴重者，處1
    萬元以上5 萬元以下罰鍰。請問此舉屬於該法的何種措施？
  options:
  - label: A
    content: 福利措施
  - label: B
    content: 保護措施
  - label: C
    content: 教育措施
  - label: D
    content: 服務措施。
- id: doc_113_高雄_苓雅_社會_公民_g8s2e3_s1_58
  section: 1
  number: 58
  type: single
  page: 2
  stem: 乃菁上台報告附圖糾紛的相關法律責任解說，請問下列何者完全正確？
  options:
  - label: A
    content: 因為此舉違反公序良俗，故男主角應該賠償
  - label: B
    content: 男主角最可能被要求以罰鍰賠償劇團損失
  - label: C
    content: 團長應主動向檢察官提供男主角違約證據
  - label: D
    content: 團長訴諸法律是基於雙方均有履行契約的義務。
  assets:
  - key: s1_58_f1
    kind: figure
    file: doc_113_高雄_苓雅_社會_公民_g8s2e3/s1_58_f1.png
- id: doc_113_高雄_苓雅_社會_公民_g8s2e3_s1_59
  section: 1
  number: 59
  type: single
  page: 2
  stem: 老師要同學討論憲法與法律修改的相同點、相異點，請問下列敘述何者完全正確？
  options:
  - label: A
    content: 憲法和法律都可由立法委員提案
  - label: B
    content: 憲法修正案須公告一年，法律修正案須經立法院表決
  - label: C
    content: 憲法修正案須公民投票複決通過，法律修正案須立法院審查，二讀通過
  - label: D
    content: 憲法修正案的有效票要超過選票總人數的1/4，法律修正案須總統公布才生效。
- id: doc_113_高雄_苓雅_社會_公民_g8s2e3_s1_60
  section: 1
  number: 60
  type: single
  page: 2
  stem: '請問，根據我國法律，上述三人從年齡最小到最大的正確排序是？

    小辰說：「七月過完生日，剛好八月的公投是我人生第一次投票」

    小芳說：「不行，我還得等一年才能嘗試抽雪茄」

    小傑說：「再一年，我就沒有少年事件處理法的保護了。」'
  options:
  - label: A
    content: 小辰、小傑、小芳
  - label: B
    content: 小傑、小辰、小芳
  - label: C
    content: 小辰、小芳、小傑
  - label: D
    content: 小傑、小芳、小辰
  assets:
  - key: s1_60_f1
    kind: figure
    file: doc_113_高雄_苓雅_社會_公民_g8s2e3/s1_60_f1.png
