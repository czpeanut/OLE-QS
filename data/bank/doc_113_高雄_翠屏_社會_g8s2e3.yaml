  group_stem: '老師授課時說：中華人民共和國建立後，通貨膨脹並未因此停止。

    中國政府決定採行大膽的土地政策，並將民營企業收歸國有，政治上則是黨的權威高於政府和軍隊。通貨膨脹問題，終於在1950 年3 月起才告趨緩。

    1958 年起，整個中國約六億五千萬人開始被政府總動員，努力執行一項新的經濟政策，不停地開礦煉鐵、築路、蓋工廠、水壩與造林、墾荒。可是遺憾的是，這樣子的大忙一場，所得到的鋼鐵成品，卻大半是不能使用的。

    直到十多年後，才因採行另一項新政策，景氣逐漸出現起色。'
