  group_stem: '右圖是非洲氣候分布簡圖，請配合文章回答 17~20 題:


    Okapi 是 1901 年由英國探險家在非洲發現的大型哺乳動物。牠屬於長頸鹿科的原始物種，是長頸鹿唯一尚未滅絕的近親，牠們主要分布在剛果民主共和國東部的雨林區。Okapi
    外觀看上去像一匹馬，皮毛是巧克力色的，臀部和腿有白色條紋，因此過去曾經有人以為 Okapi 是長頸鹿與斑馬交配產生的，但實際上牠與斑馬不是近親。Okapi
    的白色條紋在其棲地環境可充當保護色，有著偽裝作用;同時也是「跟著我」的標誌，讓幼獸可以緊跟著母獸。


    Okapi 在當地被視為精神象徵，紙鈔上甚至印有牠們的身影。然而，近年來由於人口過剩，民眾漸漸移居到 Okapi 棲地附近，以刀耕火種(火耕)的方式發展農業;加上嚴重內戰，政府無暇管制盜獵、伐木、或非法採礦，這些情況都大大破壞
    Okapi 的棲地環境。Okapi 的野外數量，猶如當地貨幣的價值，不斷往下滑。'
  shared_asset: g1_17_20
  answer:
  - B
  answer_source: answer_key_vlm
