  group_stem: '報導一:瑪氏(Mars)、雀巢(Nestle)等巧克力品牌早在西元 2001 年就簽署禁用童工協議，但 2015 年美國勞工部公布的調查報告顯示，非洲的可可豆童工人數增至
    210 萬人，迫使巧克力大廠重新簽訂新協議，目標是將童工人數減少 70%，但外界依舊質疑協議能否落實。

    報導二:迦納政府為了讓農民擺脫貧窮，宣布可可豆價格期貨價要進行調漲。迦納副總統巴伍米亞表示:「石油輸出國家組織(OPEC)只控制全球 30%到 40%的石油供應量，卻能主導油價。假設產油國有
    OPEC，我們也該有 COPEC(可可豆輸出國組織)。」配合上面兩則報導，回答 11~12 題:'
  answer:
  - D
  answer_source: answer_key_vlm
