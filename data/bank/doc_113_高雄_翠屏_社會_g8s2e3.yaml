  section: 3
  number: 56
  type: single
  page: 11
  stem: 登革熱防疫期間，阿祥因為違反傳染病防治法而被高雄市政府衛生局開罰10 萬元。阿祥不滿被開罰，向政府機關尋求救濟卻被駁回，現在他只好另尋救濟管道。依上述，下列哪一項正確?
