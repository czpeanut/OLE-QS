  group_stem: '*題組一 (請回答第9、10題)：請根據下列文章回答問題:某位藝人於社群平台發文，認為中正紀念堂園區不應該砍樹設置吸菸區，此舉引起許多網友關注，但該負責人表示此為誤會一場，現場被砍的大樹因為感染褐根病移除，使得原來茂密的樹叢砍伐後視野變得空曠，才讓2009年就已經設置的吸菸區，看起來更加醒目，並非新設置的吸菸區。中正紀念堂園區管理機關是文化部，因此過去依照《菸害防制法》得設置吸菸區，但隨著現在禁菸意識抬頭，目前已改為園區室內全面禁菸，並預計將此最後一塊吸菸區告示拆除，但也有民眾質疑，台北市政府是否應依法必須設置吸菸區?
    對此政府人員表示，文化場域本來就是「非吸菸區全面禁菸」，若沒有設置吸菸區就等同於全面禁菸，且可依照各地方縣市政府、場所管理者因地制宜，酌情進行規範，呼籲民眾互相尊重，人人都具備健康危害的公共意識，不在他人面前吸菸。'
