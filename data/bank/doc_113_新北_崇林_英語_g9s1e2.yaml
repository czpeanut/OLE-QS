  stem: What is a food coma?
  options:
  - label: A
    content: Feeling down about food.
  - label: B
    content: Getting tired of food.
  - label: C
    content: Feeling sleepy after a meal.
  - label: D
    content: Becoming unconcious about food.
  group_stem: '(30-32)

    Have you ever felt sleepy after eating a big meal?  This feeling is known as a
    food coma.  A true coma is that a person becomes unconscious for a long time.  However,
    a food coma is much less serious because it isn’t dangerous and doesn’t last long.

    Scientists have studied the food coma to understand how it works.  One explanation
    is that when we eat a lot of food, our blood goes to our stomach to help digest
    the food.  This means that there is less blood going to our brain and makes us
    feel tired.

    Certain types of food can also lead to a food coma.  Food with more fat and carbohydrates
    makes us feel sleepy more easily.  After we eat meals with high fat, our bodies
    gives off a homone and that slows down the digestion process and results in the
    tired feeling.  Also, carbohydrates raise our blood sugar levels quickly and make
    us want to sleep.  The next time you feel sleepy after a meal, take a close look
    at what you just ate and think about making changes if you wish to keep from sleepiness
    after a heavy meal.

     unconscious 無意識的 explanation 解釋   digest/ digestion 消化  certain 某種   carbohydrates
    碳水化合物 homone 賀爾蒙 result 產生…的結果'
