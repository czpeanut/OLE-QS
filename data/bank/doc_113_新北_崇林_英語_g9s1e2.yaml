  group_stem: '(33-35)

    How do mosquitoes find you?  It has nothing to do with your blood type.  Some
    people say if you have an acidic body, it is easier for mosquitoes to bite you.  This
    is also far from the correct answer.

    First, they find you from the smell of your body.  There is something interesting
    in your sweat for mosquitoes.  They know where they should head for.  If you have
    a strong body smell, it’s even easier for mosquitoes to find you.  On cold days
    when you seldom sweat, the cosmetics on your face can also let mosquitoes know
    where you are.

    Second, every time you take a breath, you will give off carbon dioxide.  Mosquitoes
    can feel it from 36 meters away.  Then they will find where it comes from.

    Third, the heat of your body plays an important role.  When mosquitoes get close
    to you, they try to find out where to give a bite by the heat from your body and
    then find a place to land.  That’s why you always feel mosquitoes flying around
    your head and ears when you are falling asleep.  Also, it explains why you often
    get bitten on your face or hands.

    How can we keep them away?  Mosquitoes don’t like bright colors.  They don’t like
    red, orange, and yellow.  Black and blue are their favorite colors.  White is
    not welcome by mosquitoes, but when you sweat a lot or your body temperature is
    high, white can’t do much to keep them away from you.


     blood 血 acidic 酸性的 sweat 汗水;流汗  cosmetics 化妝品  carbon dioxide 二氧化碳  temperature
    溫度'
