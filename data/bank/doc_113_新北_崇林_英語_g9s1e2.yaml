  group_stem: "(38-40)                               Oh!  This!\n  Your cellphone\
    \ must be thin and light.  You watch videos, take photos, listen to music and\
    \ do many other things with your cellphone now.  However, can you believe people\
    \ carried a 2-kg cellphone in the past?  It could only be used to make phone calls.\
    \  Nothing else.  Oh! This! shows you the most modern things in history.  You\
    \ may also touch them and feel them\n\n| | |\n|---|---|\n| This was the first\
