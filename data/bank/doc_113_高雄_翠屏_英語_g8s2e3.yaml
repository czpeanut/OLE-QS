  group_stem: "III\n\nA Letter from an Indian Girl:\nHoping for Clean Water and a\
    \ Better Life\nDear Mayor,\n  My name is Nita.  I am ten.  I live in India.  Every\
    \ day, I need to collect water for drinking, cooking, cleaning, and farming. \
    \  57.   I am not the only    58.    to use the water, I still need to collect\
