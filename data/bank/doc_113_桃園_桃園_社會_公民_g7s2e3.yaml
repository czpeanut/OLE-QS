- id: doc_113_桃園_桃園_社會_公民_g7s2e3_s1_42
  section: 1
  number: 42
  type: single
  page: 2
  stem: 上文第二段有關新北市政府提供的社會福利內涵，下列描述何者正確？
  options:
  - label: A
    content: 提供急難民眾生活的補助
  - label: B
    content: 透過保險轉移民眾的風險
  - label: C
    content: 滿足民眾居住需求，保障住的權利
  - label: D
    content: 提供妥善的健康與醫療照護。
  group_stem: '過往，民眾的就醫習慣就是前往診所或醫院，由於偏鄉地區交通不便，常面臨醫療資源缺乏的問題，不僅醫療院所極少，願意入鄉看診的醫生也很少。政府為了解決此一問題，與電信業者共同推動5G
    科技診療，帶動偏遠地區的遠距診療應用，提供居家照護與長照服務。

    例如：新北市政府、國家衛生研究院、亞東醫院與電信業者合作，為新北市石碇、萬里地區的糖尿病患者提供5G 糖尿病遠距醫療照護服務，患者只要前往衛生所，在護理人員協助使用眼底鏡檢查視網膜，經由5G
    傳送檢查影像，由亞東醫院的醫生和衛生所的家醫科醫師共同會診，及早發現視網膜是否病變，降低患者失明的風險。未來，衛福部希望將遠距醫療推廣至全臺偏鄉地區，造福更多偏鄉地區的民眾。請回答下列問題：'
