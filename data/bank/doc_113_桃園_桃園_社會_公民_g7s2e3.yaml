  stem: '圖(九)呈現我國1998 至2018 年間，收入最高20%家庭與收入最低20%家庭的可支配所得成長率變化，其中灰階區塊是曾發生經濟成長率大幅衰退的兩段時間。根據圖中內容判斷，上述兩個灰階區塊的數據，呈現出下列哪一現象？


