- id: doc_113_桃園_桃園_社會_公民_g7s2e3_s1_32
  section: 1
  number: 32
  type: single
  page: 1
  stem: 我國政府於曾調降遺產稅的稅率，由最高50%調整為單一稅率10%。稅率調整後，投入房屋的資金顯著增加，繼承遺產者可使用大筆資金投入房市，為自己增加更多財富。上述狀況呈現哪方面的不公平現象？
  options:
  - label: A
    content: 不同性別者在繼承遺產上的不平等
  - label: B
    content: 少數族群在租屋時受到更多的歧視
  - label: C
    content: 房市成資金聚集地而加劇貧富差距
  - label: D
    content: 身心障礙者缺乏無障礙的居住空間。
