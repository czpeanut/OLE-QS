- id: doc_113_桃園_桃園_社會_公民_g7s2e3_s1_33
  section: 1
  number: 33
  type: single
  page: 1
  stem: 幸福國國內興建的社會住宅占全國60%的家戶數，比例非常高，不只低收入戶和弱勢群體有申請社會住宅的資格，包括土生土長的本國人或新移民、身心障礙者、銀髮族、單親家庭、社會新鮮人、子女數較多的一般家庭，以及被認定教育費用支出較高的雙薪家庭，都在可申請範圍內，並保留5%供給無家可歸的人或無經濟來源的人居住。有關幸福國社會住宅的政策，下列哪一位學者的說法較為適當？
  options:
  - label: A
    content: 學者甲：未能讓弱勢者得到妥善的照顧
  - label: B
    content: 學者乙：社會住宅的數量明顯不夠充足
  - label: C
    content: 學者丙：在機會均等的前提下照顧弱勢者
  - label: D
    content: 學者丁：無經濟來源的人就無法獲得資源。
