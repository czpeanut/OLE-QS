  section: 1
  number: 31
  type: single
  page: 1
  stem: 我國衛生福利部對新住民族群提供生活適應輔導、親子教養、家庭聯誼等服務，各縣市的就業服務中心也會協助新住民在求職時的子女照顧需求，如提供短期的幼兒托育等服務。這些措施在我國的社會福利項目類別中，與下列何項事例相同？
  options:
  - label: A
    content: 病患以全民健康保險給付住院或門診費用
  - label: B
    content: 身障者申請手語翻譯協助或居家看護服務
  - label: C
    content: 待業中的勞工參加勞動局舉辦的職業訓練
  - label: D
    content: 新手父母向地方政府申請發放的育兒津貼。
