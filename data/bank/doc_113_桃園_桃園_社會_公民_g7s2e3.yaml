- id: doc_113_桃園_桃園_社會_公民_g7s2e3_s1_39
  section: 1
  number: 39
  type: single
  page: 2
  stem: 根據上文，公益彩券經銷商的遴選，最有可能是為落實下列何種目的？
  options:
  - label: A
    content: 平均分配福利服務
  - label: B
    content: 人人皆有均等機會
  - label: C
    content: 讓弱勢者得到更多照顧
  - label: D
    content: 以社會保險協助弱勢者。
  group_stem: 你的家人買過公益彩券嗎？你知道公益彩券的設置目的嗎？依規定，公益彩券經銷商的遴選，以具有工作能力且能親自在場銷售的身心障礙者、原住民及低收入單親家庭為限。此外，為了提升社會福利，公益彩券的盈餘分配，50%供地方政府辦理社會福利及慈善活動，5%挹注全民健康保險準備，45%供政府補助國民年金，用於老人、兒童、婦女、原住民、殘障人士以及各縣市政府辦理各項社會救助與福利。因此，這一張彩券，不僅是對中獎的期待，也是給予弱勢群體能自立生活建立尊嚴的機會。請回答下列問題：
