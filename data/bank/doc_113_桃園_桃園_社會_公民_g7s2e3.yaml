  stem: 南投縣偏遠山區交通不便，醫療資源相對缺乏，居民生病常須翻山越嶺下山看病，尤其仁愛鄉部落分散，許多部落沒有任何醫療設施，南投縣政府這幾年來積極申請經費，在仁愛與信義鄉設置近20
