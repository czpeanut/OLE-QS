- id: doc_113_桃園_桃園_社會_公民_g7s2e3_s1_37
  section: 1
  number: 37
  type: single
  page: 1
  stem: 瑞典的勞資關係以「協商合作」為核心，原則上政府僅具輔導、補充之功用，不干預勞工薪資、工時、福利等條件，而是由工會與雇主組織透過集體協議的方式來決定，透過不斷積極協商、談判，瑞典國內較少發生罷工事件，創造了有利勞方、資方、政府三方的共贏局面。下列何者最符合文中瑞典社會的現象？
  options:
  - label: A
    content: 政府的福利措施缺乏就業安全保障
  - label: B
    content: 社會保險能支應瑞典勞資雙方需求
  - label: C
    content: 社會津貼能補足社會救助的不完善
  - label: D
    content: 民間的共同參與可以完善福利制度
