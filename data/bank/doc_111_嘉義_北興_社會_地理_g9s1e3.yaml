  section: 1
  number: 38
  type: single
  page: 4
  stem: '早年因為北美自由貿易協定 (NAFTA)，成為製造業產品輸往美國的製造、組裝據點之一的墨西哥，憑藉著關稅優惠享有顯著的優勢。但在2020年7月美墨加協定(USMCA)生效後，這些優勢可能不再。汽車工業更受影響，其相關規定如下：

    (1)至少75％零組件的產地需來自北美(NAFTA為 62.5％)；

    (2)至少70％鋼鐵、鋁材的產地需為北美；

    (3) 至少40~45 ％零組件是由每小時薪資16 美元( 約臺幣471 元) 的工人製造。

    請問 :美墨加協定生效後，可能會產下列那些現象？'
  options:
  - label: A
    content: 汽車整體製造成本下降
  - label: B
    content: 墨西哥不再發展汽車產業
  - label: C
    content: 電動車市佔率提升
  - label: D
    content: 北美汽車製造職缺增加
