  - label: D
    content: It’s when the student is immersed in liquid.     liquid 液體
  group_stem: "Use a Variety of Techniques to Learn English\n    There are several\
    \ methods to learn English, or any second language. One method is called immersion.\
    \ This is when the student spends time in an environment that immerses him completely\
    \ in the language he wishes to learn.\n    For example, he can live with an English\
    \ family, or visit an English-speaking neighborhood or social club. Or he can\
    \ attend a class where only English is spoken by teachers and students. The student\
    \ then learns English naturally, hearing English and repeating what he hears.\n\
    \    Another method to learn English is for the student to do exercises and quizzes,\
    \ correcting his/her mistakes and learning by example. He/She can write out the\
    \ exercises, or repeat them orally. In this way, she will remember the language\
    \ structure through repetition.\n    A third way to learn English is to study\
    \ the language’s grammar from a grammar rule book. In this method, the student\
    \ must memorize grammar rules and exceptions. A good grammar book will offer clear\
    \ explanations of the rules of the language, and give examples of how to apply\
    \ them.\n    The most efficient and fastest way to learn a language is to combine\
    \ all three of these methods.\n\n completely 完全地 attend 參加 orally 口頭地 structure\
    \ 結構 repetition 重複 grammar 文法 exception 例外\n      apply 應用 efficient 效率高的 combine\
    \ 使結合"
