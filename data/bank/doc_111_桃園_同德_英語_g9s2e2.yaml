  section: 2
  number: 48
  type: single
  page: 6
  stem: 48. What is the main idea of this passage?
  options:
  - label: A
    content: “OK” is the most popular hand gesture in the world.
  - label: B
    content: There are different hand gestures which mean “OK” in different countries.
  - label: C
    content: People use the “OK” hand gesture when everything is all right.
  - label: D
    content: The “OK” hand gesture has various meanings around the world.
  group_stem: "The “OK” Gesture\nYou are probably familiar with the “OK” hand gesture.\
    \ It’s made by connecting the thumb and first finger to make an “O.” In many countries,\
    \ it’s used to say that everything is all right, or nothing is wrong, in other\
    \ words. But in some countries, it can have a very different meaning.\n    Whatever\
    \ you do, don’t make the “OK” sign in France or Belgium. There, this gesture is\
    \ used to mean “zero,” which could imply to someone that they are worthless. Don’t\
    \ use it in Brazil and many other South American countries, either. There, this\
    \ sign is an insult. In the Middle East, this hand signal is not “OK”, either.\
    \ It is the “evil eye,” used when one person wants to put a curse on another.\n\
    \    Of course, sometimes this signal is completely harmless. In sign language,\
    \ for example, it can mean “housefly.” It can also be used to represent something\
