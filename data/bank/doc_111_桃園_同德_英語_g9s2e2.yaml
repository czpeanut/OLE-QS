  section: 2
  number: 44
  type: single
  page: 5
  stem: 44. What is a special feature of cyberbullying?
  options:
  - label: A
    content: It happens when the name of the bully is “Cyber”.
  - label: B
    content: It only happens at school.
  - label: C
    content: It only affects young people.
  - label: D
    content: It is bullying that happens online.
  group_stem: "Bullying\n    Bullying has long been a fact of life. It used to be\
    \ limited to schools and playgrounds, but in recent years it has made its way\
    \ onto the Internet. When bullying happens online, it is known as cyberbullying,\
    \ and it can happen anywhere and anytime.\n    There are many examples of cyberbullying.\
    \ These include spreading rumors online about other people, stealing another person’s\
    \ social media account to post personal pictures of that person, or sending threatening\
    \ messages.\n    The Internet allows cyberbullies to act without having to show\
    \ their identity. For this point, it’s important to know what to do if you or\
    \ someone you care about is bullied online. One piece of advice is to avoid answering.\
    \ Another helpful step is to take a picture of your phone or computer screen so\
    \ that cyberbullies won’t be able to deny their actions later.\n    Perhaps the\
    \ best way to control cyberbullying is to stop it from happening in the first\
    \ place. Many times, it happens when someone takes control of one of your social\
    \ media accounts. Besides, remember that the Internet is a public place. Even\
    \ if you erase a post, someone else might have saved it. Therefore, before you\
    \ post anything, ask yourself, “Would I say this in a room that’s full of strangers?”\
    \ If not, think about choosing a more private form of communication.\n    The\
    \ Internet has given us new and exciting ways to communicate with each other,\
    \ but some people see it as another means to continue hurting others. It is important\
    \ that we join together and learn how to stop cyberbullying. Let’s make the Internet\
    \ safe again for everyone to use.\n\n rumor 謠言 threatening 脅迫的 identity 身分advice\
    \ 勸告 deny 否認 communication 溝通"
