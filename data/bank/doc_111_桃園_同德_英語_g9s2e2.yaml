  section: 2
  number: 41
  type: single
  page: 5
  stem: 41. What is the immersion method of learning a language?
  options:
  - label: A
    content: It’s when someone visits a social club.
  - label: B
    content: It’s when the student learns naturally by speaking and hearing the second
      language.
