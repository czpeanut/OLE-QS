- id: doc_113_新北_崇林_國文_g8s1e1_s5_5
  section: 5
  number: 5
  type: single
  page: 4
  stem: 關於文中的「我」，下列敘述何者最恰當？
  options:
  - label: A
    content: 在愛丁堡的期間是帶有目的性的停留
  - label: B
    content: 認為去大象咖啡館是一種偏頗的決定
  - label: C
    content: 因沉浸在老圖書館的氛圍裡而忘卻時間
  - label: D
    content: 討厭愛丁堡的寒冷而不願回想留學時光
  group_stem: '最近經常想起愛丁堡。

    可能是冬天到了的緣故，我就想起那個寒冷的城市。但想起愛丁堡時，記憶幾乎都局限在從宿舍到圖書館的一段路。其他的地方，有時連路名都想不起來了。我在那個城市住了三年多，但從離開的那天起，有關它的記憶卻迅速風乾縮小，失去細節的厚度。

    在愛丁堡的期間，最常走的一段路，是從宿舍到國家圖書館。有時也會為了特定的資料，改去大學總圖或神學院圖書館。我喜歡圖書館，尤其老圖書館厚重的木頭桌椅，沉靜的氣氛和古書味。但每天最盼望的還是我給自己訂下的休息時間——下午三四點時到對街的大象咖啡館喝咖啡，吃杏仁牛角麵包，看報紙。那家咖啡館有一面窗正對著峭壁上的愛丁堡古城。從溫暖嘈雜的咖啡館，遠望冷峻的城堡，好像一種提醒。城堡的歷史以千年計，峭壁以萬年計，
    眼下我以時日計算的時間，不過是零頭。

    二十幾歲的時候，人和城市的關係是有目的性的，有了目的就偏頗。你去到一個地方，心裡清楚它不是終點，只是為了完成些什麼，然後又收拾行李往別處去。例如留學，每個留學生的心裡都有一張時間表，底限是完成學業回家的時間——而那往往和獎學金的年限有關。懷著這張時間表生活，每一天都不是獨立的日子，「現在」不只是現在，是朝向日後而存在，日子長長地投影在未來。

    那是一種生活在他方。只是當時不覺得匆忙，往後回想，才看出其中的風塵僕僕。那時我們都還不知道，攜帶著單一的目標去生活是件挂一漏萬的事。 二十來歲時銳意求知，要到稍晚才學會，那個尖銳的姿態，同時也是狹窄的。

    ——張惠菁〈冬城〉'
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
      code: 第五課
      title: 生命中的碎珠
      chapter: null
    textbook: 八上 第五課 生命中的碎珠
    labeled_by: ai
