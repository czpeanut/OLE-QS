  section: 5
  number: 1
  type: single
  page: 4
  stem: 詩中所提到的事物，何者不是比喻這位女子？
  options:
  - label: A
    content: 孤生竹
  - label: B
    content: 泰山
  - label: C
    content: 菟絲
  - label: D
    content: 蕙蘭花
  group_stem: '冉冉孤生竹

    冉冉(1)孤生竹(2)，結根泰山阿(3)。與君為新婚，菟絲附女蘿(4)。 菟絲生有時，夫婦會有宜。

    千里遠結婚，悠悠隔山陂(5)。 思君令人老，軒車(6)來何遲！傷彼蕙蘭花，含英(7)揚光輝。

    過時而不采(8)，將隨秋草萎。君亮(9)執(10)高節，賤妾亦何為(11)？

    注釋

    (1)冉冉：柔弱下垂的樣子。 (2) 孤生竹：孤單生長的竹子，此為女子自喻。

    (3) 阿：音 ㄜ，兩山間凹下的地方。

    (4 )菟絲附女蘿：菟絲與女蘿都需攀附其他植物才能生長，古詩文常以這兩種植物比喻夫妻或情人的關係。此喻夫妻互相依賴。

    (5)陂：山坡。 (6)軒車：有幃幕的車子。這裡指丈夫前來迎接自己的車子。

    (7)含英：含苞。 (8)采：同「採」。 (9)亮：同「諒」，料想。

    (10)執：堅持。 (11)亦何為：又何必感傷呢？'
