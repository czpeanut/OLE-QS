  group_stem: '僕(1)始生六、七月時，乳母抱弄於書屏下，有指「之」字、「無」字示僕者，僕雖口未能言，心已默識(2)。後有問此二字者，雖百十其試，而指之不差。則僕宿昔(3)之緣，已在文字中矣。及五六歲，便學為詩。九歲諳識聲韻。十五六，始知有進士，苦節讀書。二十已來，晝課賦，夜課書，間又課詩，不遑(4)寢息矣。以至於口舌成瘡、手肘成胝。
    --白居易〈與元九書〉

    注釋

    (1)僕:引申為自謙之詞

    (2)默識:暗中記誦在心

    (3)宿昔:前世具有的習性

    (4) 不遑:無暇，沒有時間'
