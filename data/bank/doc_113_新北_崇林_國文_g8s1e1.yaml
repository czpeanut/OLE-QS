  stem: 「你倒有硬骨頭，竟敢對朕頂撞！起去！你這頂帽兒，便留在這裡吧！」皇帝說這句話的目的最可能為下列何者？
  options:
  - label: A
    content: 想要革除尹章垓的官職
  - label: B
    content: 計畫將尹章垓株連九族
  - label: C
    content: 藉機測試尹章垓的忠誠
  - label: D
    content: 欲取尹章垓的首級洩憤。
  group_stem: '二更時分，陳家洛與趙半山收拾起行，施展輕功，向撫衙奔去。正要飛身上屋，忽然撫臺衙門邊門「呀」的一聲開了，走出一名武官，後面跟著四名旗兵，兩人縱身過去，將五人提到暗處，剝下旗兵號衣，自己換上了。兩人又趁巡哨轉身，跳入圍牆，裡面成千名官兵來來往往，怎分辨得清已有外敵混入？隔了半晌，陳家洛見行藏①未被發覺，雙腳便勾住屋梁，掛下身子，舐②溼窗子，張眼內望。陳家洛見一人背向而坐，俯讀書冊，這時外面走進一個官員，向坐著那人三跪九叩首的行起大禮來。陳家洛大吃一驚，心想：「這是參見皇帝的儀節，難道皇帝微服到了杭州不成？正疑惑間，只聽那官說道：「臣浙江布政司尹章垓叩見皇上。」只聽皇帝哼了一聲，沉聲說道：「你好大的膽子！我派兵征討回疆，聽說你很不以為然。」尹章垓一面叩頭，一面說道：「臣該死，臣不敢。只是古人云：『兵者是凶器，聖人不得已而用之。』聖上若罷了遠征之兵，天下皆感恩德。」皇帝冷冷地道：「我定要派兵征伐，那麼天下就是怨聲載道了？」尹章垓拚命叩頭，額角上都是鮮血，皇帝嘿嘿一笑，說道：「你倒有硬骨頭，竟敢對朕頂撞！起去！你這頂帽兒，便留在這裡吧！」

    （改寫自金庸 書劍恩仇錄）

    注釋：①行藏：動向、蹤跡。

    ②舐：音ㄕˋ，用舌頭舔。'
