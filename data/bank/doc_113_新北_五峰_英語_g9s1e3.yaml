- id: doc_113_新北_五峰_英語_g9s1e3_s3_27
  section: 3
  number: 27
  type: single
  page: 2
  stem: How much will Kyle have to pay if he gives the books back right after the
    phone call??
  options:
  - label: A
    content: NT$ 55.
  - label: B
    content: NT$ 75.
  - label: C
    content: NT$ 105.
  - label: D
    content: NT$ 140.
  group_stem: '(一)

    Clerk: Hello, may I speak to Kyle Wang?

    Kyle: Speaking. Who’s calling, please?

    Clerk: I’m calling from Eslite Rentals. The deadline for the five comic books
    and the novel you borrowed was three days ago.

    Kyle: Oh, no! I totally forgot about that. I’m really sorry. Can you tell me what
    the books are?

    Clerk: Sure. They are Spy Family, number one to number five, and the first Atomic
    Habits book. Please get them back as soon as possible if you don’t want to pay
    a bigger late fee for the overdue books.

    Kyle: OK, got it. Also, could you tell me how much you charge for the overdue
    books?

    Clerk: It’s NT$ 5 a day for each comic book, and NT$ 10 for each novel.

    Kyle: OK, I’ll be there in one hour with them because I’m in the middle of cooking
    dinner.

    Clerk: I’m afraid we will be closing in 30 minutes. We open in the morning at
    nine, so if you get them back before nine thirty tomorrow, we won’t charge you
    for another day.

    Kyle: Oh, that’s fantastic, thank you!

    Clerk: No worries. See you tomorrow.  deadline 最後期限 fee 費用 overdue 過期的 charge
    索費'
