  - label: D
    content: How to become a successful singer despite difficulties.
  group_stem: "(三)\nBTS, South Korean boy band, made history by being the first K-pop\
    \ group to speak at the United Nations (UN) on September 24, 2018. Kim Nam Joon,\
    \ better known as RM, the leader of the group, spoke for the band for about seven\
    \ minutes.\n The speech has touched many people around the world. It is about\
    \ following our heart and loving ourselves. RM said when he was maybe nine or\
    \ ten, he started to worry about what others thought of him. That made him fail\
    \ to listen to his own voice, and he said, “I, we, all lost our names. We became\
    \ like ghosts.” Luckily, there was voice inside that pushed him to follow music.\
    \ However, it wasn’t simple to become a great singer.\n He faced a lot of difficulties,\
    \ including people who were mean to him and thought he was a loser and would fail.\
    \ Sometimes, he wanted to quit, but thanks to himself, he didn’t give up. It is\
    \ perhaps because he has never quit and has always chosen to follow his heart\
    \ that he has become a successful singer.\n At the end of the speech, RM again\
    \ told people to love themselves. He said, I’m gonna accept myself, and I’m starting\
    \ to love myself just little by little.”\nIn 2017, BTS started working with UNICEF\
    \ to protect young people from violence. Like Anti-Bullying Day, also called Pink\
    \ Shirt Day, which started in Canada, their “Love Myself “campaign is changing\
    \ the world. What about you? What are you going to do to make a difference?\n\
     United Nations (UN) 聯合國 UNICEF 聯合國兒童基金會 violence 暴力 campaign 活動 Anti-Bullying\
    \ Day 反霸凌日"
