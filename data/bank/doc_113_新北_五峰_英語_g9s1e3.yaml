- id: doc_113_新北_五峰_英語_g9s1e3_s3_30
  section: 3
  number: 30
  type: single
  page: 2
  stem: What is the purpose of the haka?
  options:
  - label: A
    content: To make people happy during festivals.
  - label: B
    content: To show power, unity, and pride.
  - label: C
    content: To celebrate New Year’s Eve.
  - label: D
    content: To teach people how to dance.
  group_stem: '(二)

    The haka is a traditional dance from New Zealand, which is usually performed by
    the Māori people. It is often done before a fight to show power and how brave
    they are, but today it is also performed at celebrations and special events. The
    dance includes stomping of the feet, expressing scary face, and singing again
    and again or shouting.

    The haka is meant to show power, unity, and pride. Each movement has meaning,
    and every group has its own style of haka. The most famous haka is called "Ka
    Mate," which was created by a Māori leader.

    In modern times, the haka is often performed by New Zealand''s national football
    team, the All Blacks, before their games. It is a way to respect for the country''s
    traditions and their opponents. People all over the world now know the haka as
    a symbol of New Zealand''s culture.

    The haka is not just a dance; it is a powerful expression of Māori history, pride,
    and identity. It helps people connect with the past and with each other, making
    it an important part of New Zealand''s culture.

     perform 表演 stomping 重踏 unity 團結 pride 驕傲 opponent 對手 identity 身分'
