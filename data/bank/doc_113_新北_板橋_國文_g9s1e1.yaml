  section: 4
  number: 30
  type: single
  page: 4
  stem: 根據本文，下列文句「 」中的字義，何者說明最為恰當？
  options:
  - label: A
    content: 「畋」得麋麑：種植
  - label: B
    content: 自是日抱「就」犬：親近
  - label: C
    content: 其人怒，「怛」之：毆打
  - label: D
    content: 以為犬「良」我友：美好。
  group_stem: '臨江之人，畋得麋麑，畜之。入門，群犬垂涎，揚尾皆來。其人怒，怛之，自是日抱就犬，習示之，使勿動，稍使與之戲。

    積久，犬皆如人意。麋稍大，忘己之麋也;以為犬良我友，抵觸偃仆益狎。犬畏主人，與之俯仰甚善，然時啖其舌。

    三年，麋出門外，見外犬在道，甚眾，走欲與為戲。外犬見而喜且怒，共殺食之，狼藉道上。麋至死不悟。(柳河東集)'
