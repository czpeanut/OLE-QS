    content: 人生應如柳絮四處飄揚，隨波逐流
  - label: B
    content: 人生應似柳絮謙沖自牧，努力精進
  - label: C
    content: 人生應如葵花立定目標，勇敢堅定
  - label: D
    content: 人生應同葵花悠然自得，不計得失。
