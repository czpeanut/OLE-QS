  type: single
  page: 1
  stem: 下列關於辛棄疾南鄉子登京口北固亭有懷一詞的文句敘述，何者正確？
  options:
  - label: A
    content: 「何處望神州？滿眼風光北固樓。」：作者起兵收復北固樓後，欣賞如畫的江山
  - label: B
    content: 「千古興亡多少事？悠悠，不盡長江滾滾流」：感慨千古朝代的盛衰興亡
  - label: C
    content: 「年少萬兜鍪，坐斷東南戰未休。」：讚美曹操從年輕就率兵捍衛疆土，鞠躬盡瘁
  - label: D
    content: 「天下英雄誰敵手？曹劉。生子當如孫仲謀。」：貶斥孫權心胸狹隘，痛失國土。
