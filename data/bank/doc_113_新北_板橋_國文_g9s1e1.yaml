    content: 「濃睡不消殘酒」：表示作者被屋外的狂風暴雨打擾致無法入眠
  - label: B
    content: 「試問捲簾人，卻道海棠依舊。」：表現出作者對海棠的關心，和侍女的漫不經心
  - label: C
    content: 「知否？知否？」：連用兩個問句，反駁侍女的回答
  - label: D
    content: 「應是綠肥紅瘦」：藉由推測的景色，暗含作者對生命無常、青春易逝的感傷。
