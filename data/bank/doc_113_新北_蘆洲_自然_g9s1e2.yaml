  stem: '利用地震波在地球內部的反射、折射和速度變化，科學家將地球內部由內而外依序分為甲、乙、丙三層，下列有關這三層的名稱及對應的主要組成成分，何者正確?
    (6-1)


    | | 甲 | 乙 | 丙 |

    | :--- | :--- | :--- | :--- |

    | (A) | 地殼(岩石) | 地函(岩石) | 地核(金屬) |

    | (B) | 地核(岩石) | 地函(岩漿) | 地殼(岩石) |

    | (C) | 地殼(岩石) | 地函(岩漿) | 地核(金屬) |

    | (D) | 地核(金屬) | 地函(岩石) | 地殼(岩石) |'
  options:
  - label: A
    content: 甲：地殼(岩石)；乙：地函(岩石)；丙：地核(金屬)
  - label: B
    content: 甲：地核(岩石)；乙：地函(岩漿)；丙：地殼(岩石)
  - label: C
    content: 甲：地殼(岩石)；乙：地函(岩漿)；丙：地核(金屬)
  - label: D
    content: 甲：地核(金屬)；乙：地函(岩石)；丙：地殼(岩石)
