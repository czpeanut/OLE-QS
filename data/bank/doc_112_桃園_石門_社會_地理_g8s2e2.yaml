  group_stem: "(二) 請閱讀以下文章，並回答38-40 問題： \n  巴勒斯坦地區於西元前原本為猶太人的居所，猶太人\n遭羅馬帝國驅逐後，流離失所到世界各地逾千年之久。二\n\
    戰後，在國際力量支持下，猶太人重新回到巴勒斯坦地區\n，並建立以色列，但此地區早已居住著信奉伊斯蘭教的阿\n拉伯人。雙方因領土糾葛、宗教對立、族群差異、難民問\n\
    題等新仇舊恨，屢屢發生衝突，以色列及巴勒斯坦各聲稱\n擁有所有的領土範圍。 \n  2014 年為期 50 多日的槍戰，是近年來最大規模的以 \n巴衝突，造成巴勒斯坦平民死傷慘重，至少\
    \ 2,100 人死亡\n。2020 年 2 月，美國前總統川普提出中東和平計畫，然而\n該計畫被認為偏袒以色列。2020 年 5 月，巴勒斯坦總統阿\n\
    巴斯宣布停止與美國和以色列的所有協議，讓以 巴衝突新\n增變數。\n\n▲巴勒斯坦地區位置圖 \n（參考資料：改寫自張道宜等，跨世紀的領土種族衝突，圖解簡明世界局勢，2017。）"
