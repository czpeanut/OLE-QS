    \ 21:24 中央社／ 杜拜18 日綜合外電報導暴雨 \n杜拜近日暴雨成災，有人歸咎於種雲增雨。  \n對此，氣象學家解釋，種雲技術可能有助降雨，但無法製造大\n\
    雨或洪患等級的暴雨，也不可能達到讓杜拜陷入癱瘓的程度。\n民間氣象學家、前美國國家海洋暨大氣總署（U.S.National Oceanic and\n Atmospheric\
    \ Administration）首席科學家茂伊（Ryan Maue）說，杜拜的暴\n雨「很可能不是種雲所造成。若是種雲所導致，他們就不會缺\n水了。人們無法利用稀薄的空氣來造雨，並創造152\
    \ 毫米的雨\n量。」氣象學家表示，這種極端降雨符合世界對人為氣候變遷\n的預期。「隨著氣候暖化，世界各地降雨越來越大，因為暖空\n氣可以留住更多水氣。」"
