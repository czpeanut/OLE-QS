  options:
  - label: A
    content: 由甲到乙的期間，天易的副甲狀腺素漸漸升高而甲狀腺素漸漸減少
  - label: B
    content: 由甲到乙的期間，天易的副甲狀腺素漸漸減少，能增加小腸吸收鈣的量
  - label: C
    content: 若某人長時間血液處於甲階段，可能出現肌肉痙攣與體重下降的現象。
  - label: D
    content: 若某人長時間血液處於乙階段，可能出現骨質疏鬆與腎結石的現象。
