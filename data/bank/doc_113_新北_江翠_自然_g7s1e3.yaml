- id: doc_113_新北_江翠_自然_g7s1e3_s2_45
  section: 2
  number: 45
  type: single
  page: 4
  stem: 下列何者為文中「甲」構造的功能？
  options:
  - label: A
    content: 人工肺臟
  - label: B
    content: 人工心臟
  - label: C
    content: 人工腎臟
  - label: D
    content: 人工肝臟
  group_stem: "【題組五】請回答45~46 題\n※請閱讀下列短文後，回答第49~50 題： 【6-1】\n      「葉克膜」是模仿人體構造的體外循環機器。其原理是將體內的靜脈血利用動力泵（甲）引出體外，再經氧合器（乙）使缺氧血血液藉擴散進行氧氣交換形成充氧血，而後經體溫熱交換器後將血液主動注入病人動脈或靜脈系統，造成部分心肺替代作用，維持人體臟器組織的充氧血供應。\n\
    \  「葉克膜」簡便快速的操作方法使熟練的團隊可在極快的速度下建立循環，而可廣泛應用於臨床急救；延長時間的生命支援作用，則可提供受損器官較充裕的恢復時間與治療空間，因而提高治癒率。使用方式則依照病因、病情，可以兩種方式使用：靜脈-靜脈迴路（V-V\
    \ 轉流）與靜脈-動脈迴路（V-A 轉流）。大致而言，靜脈-靜脈迴路用以代替肺臟呼吸機能，只用於肺部疾病；而靜脈-動脈迴路則除代替肺臟呼吸機能之外，也能代替心臟的血液循環機能。"
  shared_asset: g2_45_46
