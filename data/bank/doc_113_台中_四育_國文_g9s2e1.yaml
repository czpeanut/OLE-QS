  page: 7
  stem: 根據本文,下列「」中的詞語,何者解釋最不恰當?
  options:
  - label: A
    content: 「望風」不敢問:觀望情勢
  - label: B
    content: 追逮「囚繫」:囚禁於監牢
  - label: C
    content: 賦入「不時」:不按時
  - label: D
    content: 安可「屈法」:屈服於法律。
  group_stem: '(四)請閱讀下文,回答第 46~47 題:

    劉丞相在位時,族人偶有逋負(1)官租數十萬,丞相不知也。官吏多望風不敢問。程公瑜為廬陵縣尉,主賦事,始追逮囚繫,責令盡償而後已。或以告丞相,丞相曰:「賦入不時,吾家之罪,縣官安可屈法也!」乃致書謝之。後瑜罷官至京師,丞相延見,禮貌有加。瑜出,謂人曰:「劉公偉量,非他人能及,真宰相也。」

    ——改寫自曾敏行 獨醒雜誌

    【注釋】(1)逋負:拖欠賦稅。'
