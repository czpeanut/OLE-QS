  - label: A
    content: 這裡是樹的海洋、鳥的天堂。這裡枝連著枝,葉疊著葉,沒有道路,也無人煙
  - label: B
    content: 夜幕徐徐的降臨了,紅霞已經消退。深藍色的天空格外的空曠,一片暮色瀰漫
  - label: C
    content: 廣闊的田野,湧起金黃色的穀浪,茂盛的蕉林,點綴其間,好一幅豐收的圖景
  - label: D
    content: 廣袤的大漠,死寂的沙海。雄渾、靜穆、板著個臉,總是給你一種單調的顏色。
