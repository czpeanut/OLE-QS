- id: doc_113_台中_四育_國文_g9s2e1_s3_33
  section: 3
  number: 33
  type: single
  page: 4
  stem: 根據文意,下列文句的主與說明,何者正確?
  options:
  - label: A
    content: 或身自早出督切——諸將士
  - label: B
    content: 令人縛置地上暴之——于吉
  - label: C
    content: 明旦往視,不知所在——孫策
  - label: D
    content: 意深惡之,頗有失常——孫策。
  group_stem: '(一)請閱讀下文,回答第33~35題:

    孫策欲渡江襲許,與于吉(1)俱行,時大旱,所在熇厲(2),策催諸將士,使速引船,或身自早出督切(3)。見將吏多在吉許,策因此激怒,言:「我為不如吉耶?而先趨附(4)之。」便使收吉至,呵(5)問之曰:「天旱不雨,道路艱澀,不時得過,故自早出。而卿不同憂感,安坐船中,作鬼物態,敗吾部伍。今當相除(6)。」

    令人縛置地上暴之,使請雨若能感天,日中雨者,當原赦;不爾,行誅。俄而雲氣上蒸,膚寸而合(7);比至日中,大雨總至,溪澗盈溢。將士喜悅,以為吉必見原,並往慶慰。策遂殺之,將士哀惜藏其屍。天夜,忽更興雲覆之;明旦往視,不知所在。

    策既殺吉,每獨坐,彷彿見吉在左右。意深惡之,頗有失常。後治瘡方差(8),而引鏡自照,見吉在鏡中,顧而弗見,如是再三。撲鏡大叫,瘡皆崩裂,須臾而死。

    ——搜神記

    【注釋】(1)于吉:東漢時期道士,精通法術。(2)熇厲:指發生旱災。熇:音ㄏㄨㄟˋ,熾熱。(3)督切:急切地督促。(4)趨附:依附追隨。(5)呵:怒聲責罵。(6)相除:指將你除去。(7)膚寸而合:指雲氣一塊一塊地聚攏起來。(8)方差:剛剛痊癒。'
  tags:
    chapter:
      publisher: null
      book: 九下
      subject: 國文
      code: null
      title: null
      chapter: null
    textbook: 九下 第1次段考範圍
    labeled_by: ai
