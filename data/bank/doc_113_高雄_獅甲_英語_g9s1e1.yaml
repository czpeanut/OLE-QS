    companies; some of the victims shopped online and bought fakes at high prices.  What’s
    worse, these Internet scam victims usually feel hopeless and sad about losing
    so much money after being tricked.  When the scammers lie again about their identity
    and say that they can help, the victims always believe them again.

    This is called “the second-time scam.”  Mr. Ripley is one of the victims.  He
    told us that he got scammed and lost one million dollars.  That was all his saving.  He
