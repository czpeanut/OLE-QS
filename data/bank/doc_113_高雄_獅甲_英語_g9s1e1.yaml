  group_stem: "Two Pieces of Terrible News\n  Here are two pieces of news that Emma\
    \ found for her report.\n  Isabelle Caro, who died at the age of 28, was a French\
    \ model and actress.  She was noted after she showed up in a picture with a sick\
    \ and weak body.  She was 165 centimeters, but her weight was only 25 kilograms.\
    \  People all over the world knew that she got serious anorexia.  She tried to\
    \ share her story about anorexia and tell people how important it is to have a\
    \ healthy body.\n  Thomas Mansfield, a 29-year-old coach, died because of caffeine\
    \ toxicity.  A study from International Journal of Sport Nutrition and Exercise\
    \ Metabolism shows, drinking black coffee before doing exercise can burn more\
    \ fat.  That is why Thomas Mansfield took the drink with a lot of caffeine.  In\
    \ fact, a cup of coffee would only bring the level of caffeine in the blood from\
    \ 2 to 6.  However, Thomas Mansfield had a level of 392 mg of caffeine before\
    \ he exercised.  What he didn’t know was that the thing can helped him burn more\
    \ fat, but it also made him lose his life.\n\U0001F4D6 model 模特兒 anorexia 厭食症\
    \ coach 教練\ncaffeine toxicity 咖啡因中毒 level 數值 blood 血"
