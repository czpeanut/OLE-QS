  group_stem: "Since the 1920s, the Oscars have been Hollywood’s most important events,\
    \ and winning an Oscar has been a dream for everyone in the movie industry.  The\
    \ movie itself is not the only reason for winning an Oscar.  The producers spend\
    \ a lot of time going to parties and holding previews.  Asking reporters to write\
    \ about their movies costs a lot of money, too.  Is winning an Oscar really worth\
    \ all that hard work and money?\n  Almost all the movies become successful after\
    \ they are nominated for Best Picture.  Because of the news, more and more people\
    \ will notice those movies and be interested in them.  Take Birdman, the Best\
    \ Picture winner in 2015, for example.  After its nomination, its box office sales\
    \ suddenly grew 132%.  However, its sales grew less than 8% after it won the Oscar.\
    \  That still made people believe it was truly a good movie.  Though some think\
    \ the Oscars don’t choose the real best picture of the year anymore, most movie\
    \ makers will keep working hard for that title to win at the box office.\n\n \
