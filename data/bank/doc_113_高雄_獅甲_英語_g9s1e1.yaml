    and said that he was a lawyer.  He said he could help Mr. Ripley to get the money
    back, but Mr. Ripley had to pay him first.  Mr. Ripley believed him and paid “the
    lawyer” twenty thousand dollars.  He didn’t know that was a scam trick until his
    daughter called the police station.

