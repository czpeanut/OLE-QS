  group_stem: "題組一： \n2644 天，史上最長的原住民族運動結束了 \n自2017 年2 月，巴奈、那布與原住民族電視台前台長馬躍．比吼，在凱道召開記者會，抗議行政院發布的「原住民族土地或部落範圍土地劃設辦法」，違反「原住民族基本法」，將導致原住民土地被財團大量開發，阻礙原住民族文化發展，也傷害生態環境。他們宣布在凱道上原地紮營，以示抗議，後來經過多次協調和警方的清場，改在二二八和平紀念公園紮營。\
