  group_stem: 'Monopoly is a game where you buy and sell property. You can buy houses
    and hotels to make much money. The goal of the game is to be the last player with
    money. You can play Monopoly with your family and friends. You can also play it
    online with people all over the world.

    Monopoly is a very popular game. It is one of the best-selling board games in
    the world. There are many different types of Monopoly. You can play Monopoly with
    your favorite characters from movies and TV shows. You can even play Monopoly
    with dinosaurs or Hello Kitty!


