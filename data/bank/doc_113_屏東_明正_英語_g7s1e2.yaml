  group_stem: 'What is an AI voice assistant? Many phone users can use an AI voice
    assistant like Google Assistant or Apple’s Siri, on their phones. They can make
    a phone call, play music, or set an alarm with it. Users can also practice their
    English by asking it questions. Here are some questions people like to ask an
    AI voice assistant.


     assistant 助理 set 設置 alarm 鬧鐘 practice 練習


    Q1: How old are you?

    ＞I’m as young as a newborn caterpillar.

    Q2: Sing a song.

    ＞OK…Wait, let me try again. It’s hard for me.

    Q3: What are you made for?

    ＞To make your life easy and for fun.


