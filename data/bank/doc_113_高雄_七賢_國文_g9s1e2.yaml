- id: doc_113_高雄_七賢_國文_g9s1e2_s5_26
  section: 5
  number: 26
  type: single
  page: 4
  stem: 關於富春山居圖的介紹，下列敘述何者正確？
  options:
  - label: A
    content: 此畫位居中國十大名畫之首
  - label: B
    content: 對於明、清時期的繪畫影響深遠
  - label: C
    content: 在蘇富比拍賣會上創下破億新臺幣的紀錄
  - label: D
    content: 以單一、極簡的畫風呈現沙渚山石的景色。
  group_stem: '（一）

    富春山居圖是元朝四大家之首黃公望的代表作，不僅是中國十大名畫之一，也是中國長卷美學，發展到極致巔峰的精彩傑作。

    這幅圖卷是黃公望八十二歲上下富春江創作的山水長卷，全長將近七百公分，近山線條皴擦，遠淡墨渲染，沙渚兩岸，樹石錯落，極富變化。在元代以後成為歷史巨作，影響明、清六百多年的繪畫主流。

    黃公望逝世，長卷流傳人間，在不同的收藏家手中流傳，不斷發生「巧取」與「豪奪」的事。其後輾轉在明朝大畫家沈周、無錫 譚志伊、董其昌等流傳，經歷三百年到了清 順治七年，當時擁有富春山居圖的是吳問卿，臨終病危，捨不得和畫分別，竟將畫投入火中殉葬。他的姪兒自火中搶救，卻已燒成兩段，前段重裱，有
    51.4 公分，就是現在收藏於浙江博物館的「剩山圖」；後段 639.9 公分，即著名的「無用師卷」，現存臺北 故宮博物院。

    黃公望的富春山居圖流傳至今 600 餘年，經過兩岸藝文界多年奔走努力，總算讓一燒為二歷經 360 年分離的巨作首度合體。前後兩段圖卷於 2011 年 6 月在臺北故宮首度合璧展出——「山水合璧——黃公望與富春山居圖特展」，開展首日盛況空前。（節錄、改寫自蔣勳
    黃公望富春山居圖卷）'
