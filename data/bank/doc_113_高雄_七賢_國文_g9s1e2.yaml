    | 張景 | 970～1018 | 1000 |

    | 宋祁 | 998～1061 | 1024 |

    | 沈括 | 1031～1095 | 1063 |

    註：①凌物：傲視他人。②引試：面試。③張公：指張景。④墓誌銘：記錄死者生平事蹟的石刻文字。'
