- id: doc_113_高雄_七賢_國文_g9s1e2_s5_34
  section: 5
  number: 34
  type: single
  page: 6
  stem: 根據本文，下列關於冷泉亭的敘述，何者最恰當？
  options:
  - label: A
    content: 作者以此亭的孤峭屹立象徵清靜自持的人格
  - label: B
    content: 經歷任首長多次翻修之後，才有今日的風貌
  - label: C
    content: 為餘杭郡勝景乃因位置得宜，具先天的優勢
  - label: D
    content: 秋冬之景最為宜人，可以除去眼耳心神之垢。
  group_stem: '（五）

    東南山水，餘杭郡為最。就郡言，靈隱寺為尤。由寺觀，冷泉亭為甲。亭在山下，水中央，寺西南隅。高不倍尋①，廣不累丈，而撮奇得要，地搜勝概，物無遁形。

    春之日，吾愛其草薰薰，木欣欣，可以導和納粹，暢人血氣。夏之夜，吾愛其泉渟渟，風泠泠，可以消煩解醉，起人心情。山樹為蓋，岩石為屏，雲從棟生，水與階平。坐而玩之者，可濯足於床下；臥而狎之者，可垂釣於枕上。況又潺湲潔澈，粹冷柔滑。若俗士，若道人，眼耳之塵，心舌之垢，不待盥滌，見輒除去。潛利陰益②，可勝言哉？斯所以最餘杭而甲靈隱也。

    餘杭叢山複湖，易為形勝。先是，領郡者有相里造作虛白亭，有韓皋作候仙亭，有裴棠棣作觀風亭，有盧元輔作見山亭，及元藇最後作此亭。於是五亭相望，如指之列，可謂佳境殫③矣、能事畢矣，後來者雖有敏心巧目，無所加焉。——改寫自白居易〈冷泉亭記〉

    註：①尋：古代以八尺為一尋。②潛利陰益：指冷泉亭無形中給人的益處。③殫：音ㄉㄢ，盡。'
