  group_stem: '據說武則天稱帝後，在冬月某日遊賞御花園，醺醉時寫了〈臘日宣詔幸上苑①〉一詩：「明朝遊上苑，火急報春知。花須連夜發，莫待曉風吹。」作為詔令，令眾花神催開百花。隔天百花齊放，唯牡丹花神傲骨，獨不奉詔②，武則天遂將牡丹花神貶至洛陽。牡丹移植洛陽後，開得滿山遍野，名聞天下。武則天聽說後，下令把牡丹全部燒掉，誰知來年春天，被燒焦的枝幹上竟開出更紅豔的牡丹。後人便將之稱為「焦骨牡丹」。

