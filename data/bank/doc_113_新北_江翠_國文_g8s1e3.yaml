- id: doc_113_新北_江翠_國文_g8s1e3_s2_38
  section: 2
  number: 38
  type: single
  page: 5
  stem: 依據文意，□□內最適合填入的詞語依序為何？
  options:
  - label: A
    content: 淘金客∕暈頭轉向∕技術精湛
  - label: B
    content: 觀光客∕頭昏眼花∕出神入化
  - label: C
    content: 觀光客∕目眩神迷∕爐火純青
  - label: D
    content: 淘金客∕撲朔迷離∕鬼斧神工
  group_stem: "不管從生物、地理、文化意義、歷史命運來看，藏羚羊恐怕都是青藏高原的最佳代言者。回首上個世紀八○年代可可西里發現金礦以來，那個連牧民都不願久留的荒原便湧入數以萬計的□□□。他們在河床上竭力淘洗致富美夢的同時，意外發現藏羚羊身上的毛料極為細膩柔軟，價值堪比黃金，於是一場大屠殺就此展開。\n\
    \    田野生物學家喬治．夏勒在他的研究手記《第三極的饋贈》中如此描述：「牧民、政府官員、卡車司機，大家都因為獵殺藏羚羊而快速獲利。其中最具傷害性的是那些有組織的盜獵團伙，他們開車從格爾木、西寧、昌都等地遠道而來，一旦找到羊群，便會趁夜打開車頭燈，大舉屠殺被閃得□□□□的藏羚羊。此外還有一種危害更大的殺戮方式—當發現藏羚羊在北方的集體產崽地，他們便會槍殺那些剛分娩或將要分娩、活動力較低的母羊，剝其毛皮，棄屍曠野，任由失去至親的小羊捱餓致死。」\n\
    \    接著，這些羚羊皮會被送往城鎮，讓工人們拔下羊毛和羊絨，將其混在普通羊毛間走私出境。原料經尼泊爾輾轉運至喀什米爾後，由當地□□□□的織工們製成等級最高的、名為沙圖什的披巾，再送到各大城市販售。當這奢侈之物最終擺上紐約百貨公司的精品櫃，與消費者相遇時，上頭除了高昂的價錢牌，還會附贈一則漂亮的謊言：沙圖什使用的原料來自西藏一種北山羊，春天換毛時，牠們會在灌木上蹭落絨毛，再由當地牧民一點一點收集起來。那就好像在說：「尊貴又善良的客人呀，您的消費不只幫助偏遠世界的貧困人民，過程中也沒有動物受害。」\n\
    (摘錄自徐振輔《馴羊記》)"
