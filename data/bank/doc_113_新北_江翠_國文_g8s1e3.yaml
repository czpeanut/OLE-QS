- id: doc_113_新北_江翠_國文_g8s1e3_s2_33
  section: 2
  number: 33
  type: single
  page: 4
  stem: 根據本文，有關「窗殺」的敘述何者正確？
  options:
  - label: A
    content: 玻璃外牆反射強烈光線，鳥類因目眩而窗殺
  - label: B
    content: 室外景物在鏡面上形成反射，容易造成窗殺
  - label: C
    content: 大面玻璃外種植密集樹木，可有效阻絕窗殺
  - label: D
    content: 內外溫差霧氣凝結，鳥類看不清路線而窗殺
  group_stem: "在自然界中鳥類是最善於在空中活動的生物，自由飛翔的姿態，美妙悅耳的鳴聲，常令人羨慕與憧憬。近年來，鳥類撞擊玻璃導致傷病死亡（簡稱窗殺）在許多國家受到重視。以下是窗殺防治概念的議題文章，請閱讀後回答問題。\n\
    \    臺灣大學動物博物館中，有一隻美麗的五色鳥標本，乍看下栩栩如生，從外觀很難看出，牠其實是因為撞上窗戶而死於非命。鳥類因為撞擊建築玻璃結構而死亡的事件稱為「窗殺」。\n\
    \    鳥兒之所以會撞上玻璃，有兩個主要原因，一是室內光線比室外暗，或是玻璃上貼了隔熱紙，室外景物就容易在玻璃上形成鏡像反射，鳥類無法分辨眼中的藍天綠樹只是倒影，便會一頭撞上玻璃。\n\
    \    一般人都認為，在大面積玻璃上貼一、兩張猛禽貼紙，就可以防止窗殺，但猛禽貼紙對鳥來說，只是單純的障礙物，牠們仍會試圖從貼紙周遭穿越而撞上玻璃。防治窗殺的措施要能發揮效果，關鍵在於密度。根據美國奧杜邦學會的實驗結果，寬五公分、長十公分的布置間隔，能夠減少90％以上的窗殺。只要符合這樣的原則，懸掛細線、標籤貼、油漆筆等隨手可得的材料，都可應用於防治窗殺。此外，因為玻璃的鏡像反射是從外側產生，無論是哪種布置，都必須在玻璃外側進行，才能發揮最大效果。\n\
    \    美國紐約已在 2019 年通過法案，新建或翻修建築的玻璃，必須要有 90％以上的防鳥撞設計，才能取得建照。\n    當鳥類與人類的生活環境高度重疊，思考如何為牠們打造友善的城市空間，是我們共同的責任。期望未來我們的城市中，不再有看不見的陷阱，讓這些有翅膀的朋友，自由翱翔天際。\n\
    （改寫自林書帆〈看不見的陷阱：窗殺〉）\n註:奧杜邦學會：The National Audubon Society，美國的一個非營利性民間環保組織，這一組織以美國著名畫家、博物學家奧杜邦來命名，專注於自然保育。"
