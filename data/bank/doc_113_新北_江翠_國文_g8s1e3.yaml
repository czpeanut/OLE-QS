- id: doc_113_新北_江翠_國文_g8s1e3_s2_36
  section: 2
  number: 36
  type: single
  page: 5
  stem: 依據上文，關於廖瓊枝女士的敘述，何者有誤？
  options:
  - label: A
    content: 曾獲得多種獎項，在歌仔戲界地位崇高
  - label: B
    content: 因為家學淵源，幼年時即選擇投身歌仔戲
  - label: C
    content: 因為擅長哭腔，有「第一苦旦」的稱號
  - label: D
    content: 為教戲之便，特地去學習開車並考取駕照
  group_stem: "廖瓊枝是一位令人尊敬的歌仔戲藝師，他的偉大不僅是在表演藝術上的成就，更在於他對歌仔戲教育傳承的奉獻。\n    廖瓊枝出身卑微命運多舛，因此必須勇敢面對人生的挑戰。他一生致力於臺灣歌仔戲的各種演出型態，從外臺、內臺、唱片、廣播、電視到精緻歌仔戲，廖瓊枝見證了歌仔戲的繁華與衰落。由於唱腔、身段優美演技精湛，廖瓊枝被譽為「臺灣第一苦旦」，尤其以演唱哭調，迴腸蕩氣如泣如訴而有「臺灣最會哭的女人」之稱。他對苦旦的詮釋能夠如此淋漓盡致，扣人心弦應是源自他悲愴的生命歷程。\n\
    \    廖瓊枝精緻的表演藝術使他得到觀眾、學者的field一致肯定，先後榮獲民族藝術薪傳獎、國家文藝獎、總統文化獎等多種獎項，更榮獲文建會指定為國家重要文化資產歌仔戲保存者，而每一個獎項也都加重他對歌仔戲的使命感，廖瓊枝不但活躍於舞臺上，長期以來足跡踏遍全臺各地傳授歌仔戲，每天教學、排戲、演講、錄音、錄影，疲於奔命，為了交通便利，廖瓊枝年近六十歲才去報考汽車駕照，從此「一臺車凸歸臺灣」，南北奔波四處教戲，他那股「拼命」的精神感動許多人，挺他、支持他從事歌仔戲的傳承與保存工作。\n\
    （改寫自林茂賢《凍水牡丹：廖瓊枝》，印刻)"
