  group_stem: "自2022 年俄羅斯入侵烏克蘭以來，捷克是烏克蘭最堅定的盟友之一，並收留大批烏克蘭難民。截至2025 年2月，捷克已提供逾39.5 萬名烏克蘭難民臨時保護。\n\
    \ 最近，捷克總統帕維爾還簽署一項修正案，延長對烏克蘭難民的保護措施，並提供醫療健保、教育與就業機會；已住滿2 年的難民則可申請特殊的長期居留，條件是申請者必須經濟獨立、有穩定的住所，且確保孩子就學；另外，修正案中也提到加強對俄羅斯公民申請捷克國籍的限制，若俄羅斯公民申請捷克國籍時，必須放棄俄羅斯國籍並提供證明。\n\
