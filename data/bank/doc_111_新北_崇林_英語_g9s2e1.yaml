  group_stem: "Barry Parker was a very successful businessman. He lived in a big house\
    \ and drove a big car. He wore expensive clothes and ate his meals in famous restaurants.\
    \ His name was often seen in the newspapers.\n    One day a newspaper reporter\
    \ asked him, “What is the secret of your success?”\n    Barry thought for a few\
    \ seconds and said, “I eat a special kind of fish.”\n    “You eat a special kind\
    \ of fish!” the reporter said. “What does that do?”\n    “It makes my brain work\
    \ better,” Berry said.\n    “What kind of fish is it?” the reporter asked.\n \
    \   “Give me fifty dollars and come back tomorrow. I’ll have some for you.”\n\
    \    The reporter gave Barry fifty dollars and came back the next day.\n    “Have\
    \ you got my special fish?” she asked.\n    “Yes. Come into the house. It’s in\
    \ the refrigerator.”\n    Berry took the reporter into his kitchen. He opened\
    \ the refrigerator and took out a very small fish. “Here you are. Have this for\
    \ dinner.”\n    The next day, the reporter called on Barry again.\n    “Did you\
    \ eat the fish?” Barry asked her.\n    “Yes, I fried it.”\n    “Good. Do you feel\
    \ different today?”\n    “No, I don’t. And I think that fifty dollars was a lot\
    \ to pay for such a small fish.”\n    “Well done!” Barry said. “You see, the fish\
    \ is working. You’re using your brain now.”\n secret 秘密 success 成功"
