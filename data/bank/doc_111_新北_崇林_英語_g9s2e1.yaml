- id: doc_111_新北_崇林_英語_g9s2e1_s1_28
  section: 1
  number: 28
  type: single
  page: 2
  stem: Which of the following is the best title for this reading?
  options:
  - label: A
    content: Smartphone Use at Home— Good for Kids, Good for Parents?
  - label: B
    content: Smartphone Makes Real-life Conversation Better.
  - label: C
    content: Restaurants Encourage Parents to Give Up Their Smart Phones During Meals.
      encourage 鼓勵
  - label: D
    content: Parents Should Ask Their Children to Spend Less Time on Conversation.
  group_stem: "Usually, a group of friends or family will go out to eat but they are\
    \ not talking to each other. They are on their phones sending messages, reading\
    \ emails, playing online games or looking at their posts. Some restaurants have\
    \ noticed this problem and decided to give free kids’ meals if parents give up\
    \ their smartphones when they eat there. And this allows them to truly enjoy their\
    \ meals without being distracted.\n    Last Saturday, I took my daughters out\
    \ to dinner. As we talked, I noticed two parents with their two children. The\
    \ children focused on their smartphone games only. Their parents were also tapping\
    \ on their smartphones, and there was no conversation at all.\n    Conversation\
    \ plays an important role in parenting. My children are still young, but they\
    \ are starting to be more interested in the world around them. Conversations are\
    \ starting to become more important. I will ask my children more questions. If\
    \ I don’t, I’ll never learn about their thoughts and their lives.\n    In a word,\
    \ I like those restaurants’ great idea. I think parents should give up their phones\
    \ and enjoy conversations with their children instead.\n distracted 分心 focus\
    \ on 專注於 conversation 對話"
  tags:
    textbook: 第六冊（九下）第1次段考範圍
    labeled_by: ai
