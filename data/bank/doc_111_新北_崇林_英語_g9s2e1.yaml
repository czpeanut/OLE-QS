  group_stem: "ChongLin News\nMar, 24, 2023\n    Meimei enjoys writing. Ever since\
    \ she had a baby, she has kept a diary every night. By writing, she understands\
    \ her life better and looks at the world in a kinder and happier way. Words always\
    \ have a magic power over her. The more she writes, the more she wants to write.\n\
    \    In 2018, Meimei found a new way to think, write and share her thoughts. She\
    \ built a Facebook fan page, MEIMEIQ, and began to write her posts every day.\
    \ At first, only few people visited her page. But after writing some posts about\
    \ the difference between living in Taiwan and in Australia, Meimei got the attention\
    \ of a Youtuber in Taiwan. She was invited to her show, and after that, her fan\
    \ page became a hit. The number of people visiting her fan page has risen sharply\
    \ since then. (see Figure 1),\n    Meimei writes about herself, her family life,\
    \ friends, pets and vacations on her fan page. Her posts are loved by many people\
    \ from around the world. You may like to know what people like most about her\
    \ fan page posts (see Figure 2).\n    With her fan page getting more and more\
    \ popular, Meimei is on her way to writing a book. Her dream to become a full-time\
    \ writer is only inches away.\n    Visit MEIMEIQ on Facebook, and enjoy her magic\
    \ land of words.\n thought 想法 attention 注意 figure 圖"
  shared_asset: g1_35_37
