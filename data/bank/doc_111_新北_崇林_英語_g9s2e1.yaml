  group_stem: "There are many humor styles. Read about the humor styles below and\
    \ decide which style is like yours.\n*Bonding Humor\n    The joke tellers always\
    \ bring joy to the people around them. They often make fun of their common experiences,\
    \ and sometimes they may even laugh at their own misfortune. The basic message\
    \ they send is: We’re all alike, we find the same things funny, and we are all\
    \ in this together.\n*Put-down Humor\n    Put-down humor is not very polite because\
    \ those jokes may seem so real that they hurt people’s feelings. An example of\
    \ such humor is telling friends an embarrassing story about another friend. This\
    \ type of humor may hurt the feeling of the one being laughed at and make the\
    \ joke-teller less popular.\n*Hate-me Humor\n    In hate-me humor, joke tellers\
    \ always laugh at themselves. For example, they may say they are too fat or too\
    \ slow to win the game. This kind of humor is not good for the joke-tellers. Those\
    \ who always use this kind of humor may end up feeling depressed and even lose\
    \ hope for the future.\n humor 幽默 misfortune 不幸 embarrassing 尷尬的 *Adapted from\
    \ 康軒課本"
  tags:
    textbook: 第六冊（九下）第1次段考範圍
    labeled_by: ai
