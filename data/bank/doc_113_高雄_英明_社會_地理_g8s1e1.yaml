  stem: 「玄奘之路戈壁挑戰賽」是一場極限跑步賽事，參加的選手主要為兩岸就讀EMBA(高階管理碩士班)在職的企業主和高階經理人。2024 年9 月在新疆與甘肅交界的「莫賀延磧戈壁」舉行，四天三夜的賽程直線距離約112
    公里，主辦單位只提供每日起終點座標，沒有路線圖，挑戰隊伍每日必須以GPS 判斷方位和實際可行的路線，每晚則在荒漠中紮營。這場沙漠超馬，參賽者腳下是滿佈礫石的荒漠和足以刺穿鞋底的野生沙漠植物-駱駝刺。加上這裡的氣候，對選手都是身心的煎熬。請問參賽選手面臨是那種氣候環境？
