- id: doc_113_高雄_陽明_社會_g8s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 「11 月 11 日『光棍節』前夕，中國的○寶網站推出免費送網友去越南找新娘『脫光』(脫離單身)的活動，吸引了一萬一千八百多人參與。隨著中國結婚成本愈來愈高，一些剩男白領也加入相親大軍，成為相親團主力。」
    上述現象的形成，與中國何種政策的推動最相關？
