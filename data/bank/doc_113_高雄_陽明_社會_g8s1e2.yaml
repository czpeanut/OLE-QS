- id: doc_113_高雄_陽明_社會_g8s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 1960 年代前，中國著重發展重工業，主要集中在中國的北部與東北部，例如：中國第一輛國產汽車就在吉林省長春市製造。請問：影響早期中國重工業分布的區位因素為何？
  options:
  - label: A
    content: 交通區位
  - label: B
    content: 勞力區位
  - label: C
    content: 市場區位
  - label: D
    content: 原料區位。
- id: doc_113_高雄_陽明_社會_g8s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 印尼最大的唐人街位於雅加達的草埔（Glodok）。草埔知名的建築物金德院，便是當地最早的華人寺廟之一。除印尼之外，許多東南亞國家也有不少華人居住。請問：這些華人的祖先原先最可能居住在下列哪個地形區？
  options:
  - label: A
    content: 內蒙古高原
  - label: B
    content: 嶺南丘陵
  - label: C
    content: 四川盆地
  - label: D
    content: 華北平原。
- id: doc_113_高雄_陽明_社會_g8s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '中國各大都市各有不同的發展歷程與特色，以下是北京、上海、喀什、深圳的描述，請配合圖(一)各城市的位置，選出城市名稱與特色敘述完全正確的選項：

    | 城市 | 城市名稱 | 特色 |

    | :---: | :---: | :--- |

    | (A) | 上海 | 中國的政治中心，也以豐富、悠久的歷史文化聞名。 |

    | (B) | 深圳 | 地處中國海岸線中點和長江的出海口，因交通位置優越且腹地廣大，快速發展成中國重要的金融中心。 |

    | (C) | 喀什 | 位於中國西部經濟區，因與鄰國接壤，邊境貿易興盛，是經濟特區之一。 |

    | (D) | 北京 | 位於珠江三角洲，鄰近香港、澳門。設立經濟特區後，吸引大量新創企業與人才。 |'
  options:
  - label: A
    content: 上海 中國的政治中心，也以豐富、悠久的歷史文化聞名。
  - label: B
    content: 深圳 地處中國海岸線中點和長江的出海口，因交通位置優越且腹地廣大，快速發展成中國重要的金融中心。
  - label: C
    content: 喀什 位於中國西部經濟區，因與鄰國接壤，邊境貿易興盛，是經濟特區之一。
  - label: D
    content: 北京 位於珠江三角洲，鄰近香港、澳門。設立經濟特區後，吸引大量新創企業與人才。
