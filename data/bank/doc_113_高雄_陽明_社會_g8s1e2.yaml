- id: doc_113_高雄_陽明_社會_g8s1e2_s3_47
  section: 3
  number: 47
  type: single
  page: 8
  stem: 上述陳女參加的消防警察特種考試，應是由哪一個中央政府機關辦理？
  options:
  - label: A
    content: 行政院人事行政總處
  - label: B
    content: 行政院內政部
  - label: C
    content: 考試院考選部
  - label: D
    content: 考試院銓敘部。
  group_stem: "請閱讀下列短文，回答第47.~50.題：\n  《公務人員特種考試一般警察人員考試規則》第8 條第1 款規定：「本考試體格檢查有下列情形之一者，為體格檢查不合格：一、身高：男性不及165.0\
    \ 公分，女性不及160.0 公分。但具原住民身分者，男性不及158.0 公分，女性不及155.0 公分。」原為義消的陳姓女子2018 年通過消防警察特種考試，翌年至內政部消防署訓練中心受訓，卻因身高僅158.9\
    \ 公分，不符《公務人員特種考試一般警察人員考試規則》160 公分標準，遭廢止受訓資格。\n  陳女不服，提起訴願遭駁回，改提行政訴訟，台北高等行政法院判她勝訴，但最高行政法院認為基於救災、救護考量，設定身高限制有助消防警察執行任務，具有公共利益，改判她敗訴。\n\
    \  陳女認為規則牴觸《憲法》，聲請憲法審查，於今(2024)年1 月間開庭進行言詞辯論，最終在5 月31 日做出113 年憲判字第6 號判決。判決指出，在消防警察範圍內，所設的身高標準排除女性應考人的群體比例顯著高於男性，明顯使女性在「擔任消防警察的權利」上有「不利的差別待遇」，不符《憲法》保障人權之意旨，判決該規定違憲，一年內失效。\n\
    (資料來源：聯合新聞網2024/06/01《消防警察特考矮1.1 公分遭消防退訓 她釋憲成功》)"
