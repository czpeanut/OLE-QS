  group_stem: '請閱讀下列短文，回答第45.~ 46.題：

    五權分立是我國獨有的體制，國父孫中山在行政、立法、司法三權外，另外獨立出監察、考試兩權。然而國內學界、政界關於考、監兩院是否該廢除的爭論，長久以來，未曾停止。近日此議題因藍綠爭端而再度浮上檯面，國民黨和民眾黨提案廢除監察院和考試院，並主張廢院不廢權；民進黨內部也有提案廢除考、監兩院之聲浪。對此監察院長陳菊受媒體採訪時表示，只要透過修憲程序來廢除監察院，她全力支持與尊重。

    (資料來源：公視新聞網2024/06/05《藍白提案廢考監 陳菊：符合修憲程序將支持》、臺灣醒報2024/06/02《考、監該不該廢？學界仁智互見》)'
