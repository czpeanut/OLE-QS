  type: single
  page: 1
  stem: 圖(二)是歷年臺商對中國投資金額統計圖，自1990 年代起，台灣開始准許人民赴中國投資，投資金額也在2008 年後屢次突破百億美元，然而2010 年以後卻出現不同的發展趨勢。請問造成此現象的原因何者正確？
