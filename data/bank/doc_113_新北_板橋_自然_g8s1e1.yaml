- id: doc_113_新北_板橋_自然_g8s1e1_s2_38
  section: 2
  number: 38
  type: single
  page: 4
  stem: 現代人為了方便泡茶，將茶葉置於不織布茶包袋內，如圖所示。浸入熱水中，茶葉成分包含茶多酚、咖啡因、維生素、醣類等水溶性物質，茶葉中水溶性成分即可溶出，茶葉則留置在袋內。有關利用茶包泡茶的敘述，下列何者錯誤?
  options:
  - label: A
    content: 咖啡因沸點比水低，咖啡因粒子才能透出茶包
  - label: B
    content: 泡茶過程包含溶解及過濾
  - label: C
    content: 茶水中的水溶性物質稱為溶質
  - label: D
    content: 茶葉顆粒大於茶包孔隙，茶葉才會留置在袋內
  group_stem: '台灣地理環境多山脈， 台灣三萬六千多平方公里的土地上，有高達269座海拔3,000米以上的山脈，故台灣可說是全世界高山密度最高的島嶼之一。

    「台灣高山茶」並非專指台灣某地所生產的茶葉，而是指台灣海拔1,000公尺以上茶園所生產出來的茶葉。雖然臺灣高山分布極廣，但主要以嘉義縣及南投縣為主，其中更以阿里山茶、杉林溪茶、梨山茶為代表。

    因為高山茶區下午就會起霧，阻隔了強烈的陽光與紫外線等，它累積出來的兒茶素、茶鹼、咖啡因等苦澀味物質含量會比較低，所以高海拔的茶口感比較好，喝起來比較不苦澀，茶葉主要成分含有茶多酚，其含量如下表，功效為延緩衰老、有助抑制心血管疾病，並在食品工業中用作抗氧化劑、食品保色劑、食品除臭劑等等……。板橋國中畢旅參訪阿里山製茶廠時，學務主任買了5包各1斤(1斤=600公克)的茶葉送給家人喝。


    | 茶葉成分 | 每公斤含量 |

    | --- | --- |

    | 茶多酚 | 20% |

    | 鋅(Zn) | 30～75ppm |


    請回答以下38-40 題：'
