- id: doc_113_新北_板橋_自然_g8s1e1_s1_36
  section: 1
  number: 36
  type: single
  page: 3
  stem: 請問從步驟(一)至步驟(二)的過程中，糖水濃度的變化為何?
  options:
  - label: A
    content: 變大
  - label: B
    content: 變小
  - label: C
    content: 不變
  - label: D
    content: 先變小後維持不變。
  group_stem: '題組題：

    焦糖烤布丁是甜點的基礎入門，這道甜點最美的風味在於焦糖的香氣和甜味。糖在受熱之後產生一連串的分子變化，不僅呈現帶光澤感的琥珀色，風味也變得更繁複飽滿，糖不再是單純的甜味，而變得高貴華麗。

    製作布丁底部焦糖液的配方與作法如下:

    步驟(一)將50公克的白砂糖放在鍋中，加入25公克的水後於爐火上以小火加熱。

    步驟(二)當鍋中出現大氣泡表示水已沸騰，靜待大氣泡減少且溶液開始轉為褐色時搖晃鍋身。

    步驟(三)溶液轉為深褐色且散發出濃濃焦糖味時，熄火並加入50公克熱開水，即完成焦糖液。

    根據上述，試回答36~37 題。'
