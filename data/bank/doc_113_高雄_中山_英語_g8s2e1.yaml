    \ because of COVID-19. Our sales were bad during the following three months. In\
    \ May, things got better, and we started to make men’s shirts. The shirts brought\
    \ us more customers in town. They loved the shirts because there were so many\
    \ colors of shirts for them to choose from. I think we can use the same way for\
    \ our upcoming items. When summer came, we made swimsuits in many different styles,\
    \ and people liked them, too. The sales in June were only a little lower than\
    \ those in January because the swimsuits were much cheaper than coats. During\
