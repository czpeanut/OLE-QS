- id: doc_113_台中_大業_自然_g8s1e1_s1_33
  section: 1
  number: 33
  type: single
  page: 6
  stem: 楷君是大業國中八年級學生，體重為40公斤重，以咖啡因的安全密碼計算，他每日咖啡因攝取量不超過多少較佳？
  options:
  - label: A
    content: 100 mg
  - label: B
    content: 200 mg
  - label: C
    content: 300 mg
  - label: D
    content: 400 mg
  group_stem: '※請閱讀文章後，回答33~34 題

    美國傳出一則 16 歲少年在 2 小時內喝完 3 種咖啡因飲料，導致心律失常猝死的案例，除了咖啡以外，茶飲、能量飲料、部分碳酸飲料、巧克力等都含有咖啡因。

    衛福部食藥署新規「含咖啡因飲料」都得標示咖啡因含量。咖啡因「紅、黃、綠」標誌說明如下：

    紅色：每杯飲品咖啡因總含量為201 毫克以上。

    黃色：每杯飲品咖啡因總含量介於101~200 毫克。

    綠色：每杯飲品咖啡因總含量為100 毫克以下。

    咖啡因的建議攝取量如下：

    成人為 400 毫克/天；孕婦（包括準備懷孕）為 300 毫克/天；青少年和兒童則為2.5 毫克/公斤重/天，因此簡化這些數據結論為 400（成人）- 300（孕婦）-
    2.5 BW，因此「400-300-2.5 BW」 即為咖啡因的安全密碼

    說明：因青少年和兒童由於身體尚未發育健全，且體重變化較大，故以 2.5 乘上體重(公斤重)計算，BW 為 Body Weight 之縮寫'
  answer:
  - A
  answer_source: answer_key_vlm
