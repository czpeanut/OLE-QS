  type: single
  page: 6
  stem: 以文章內容，下列何者敘述正確？
  options:
  - label: A
    content: AQI表的數值是指空氣中PM2.5的含量
  - label: B
    content: PM2.5是指微粒粒徑2.5μm以下的細懸浮微粒
  - label: C
    content: 臺中地區AQI值達到「紫爆」等級，表示臺中地區紫外線指數過高
  - label: D
    content: 所謂的「紫爆」等級是指AQI值達301以上
  group_stem: '※請閱讀文章後，回答 35 題

    「粒徑10微米以下的懸浮微粒（PM10）常造成霾害影響能見度；若吸入粒徑 2.5微米以下的細懸浮微粒（PM2.5）更能穿透肺泡隨著血液循環至全身，對健康影響甚大。

    行政院環保署提供民眾AQI表，如下表所示。AQI值是依據PM2.5等汙染物濃度換算出的數值，數值越大對健康危害可能也越大。

    AQI 根據不同數值有不同的顏色，為綠、黃、橘、紅、紫及棕色。


    | 對健康影響 | 良好 | 普通 | 對敏感族群不健康 | 對所有族群不健康 | 非常不健康 | 危害 |

    | --- | --- | --- | --- | --- | --- | --- |

    | AQI 值 | 0～50 | 51～100 | 101～150 | 151～200 | 201～300 | 301～500 |

    | 顏色 | 綠 | 黃 | 橘 | 紅 | 紫 | 棕 |'
  answer:
  - B
