- id: doc_113_新北_福和_社會_地理_g7s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 台灣是天然的火山教室，本島與離島多處曾有或目前仍有火山活動的紀錄。包括同屬北部火山帶的龜山島與大屯火山群，是目前已被確認的兩處活火山，仍有再次噴發的可能，隨著科技進步，目前都有地質研究單位對台灣的火山及火山島進行監控，因為其預測準確度遠大於地震，可及時疏散避難，不用過分擔心，因為多一分監測，就多一分安全。請問下列哪一處離島不須進行火山監測？
