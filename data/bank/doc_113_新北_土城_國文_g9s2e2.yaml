  stem: "荀子〈勸學〉一文中提及「善假於物」揭示了透過外物，如閱讀可提高我們的視野，開闊我們的胸襟。閱讀的好處不只是打開了一扇通往古今中外的門，讓我們得以爬上巨人的肩膀，還可讓人翱遊其中，同時可以刺激大腦神經的發展，使大腦不會退化。義大利北部文盲和讀過五年書的老人，在阿茲海默症上的比例是十四比一，十四倍在醫學上是個很大的差距，有沒有動腦筋造成這個差距，是因為大腦的神經元基本上是用進廢退，而閱讀是促進思考的好幫手。（張儷禛〈洪蘭談「閱讀使人爬上巨人的肩膀」〉）\
    \ \n \n請依據上文，下列敘述何者最不恰當？"
