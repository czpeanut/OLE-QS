  type: single
  page: 3
  stem: "甲、杜鵑出蜀中，今南方亦有之。狀如雀鷂而色慘黑，赤口有小冠。□暮即鳴，夜啼達旦，鳴必向北，至夏尤甚，晝夜不止，其聲哀切。田家候之，以興農事。唯食蟲蠹，不能為巢，居他巢生子，冬月則藏蟄①。\
    \ \n（李時珍《本草綱目．禽部》） \n乙、昔有人飲於錦城 謝氏，其女窺而悅之。其人聞子規啼，心動，即謝去。女恨甚，後聞子規啼，則怔忡②若豹鳴也，使侍女以竹枝驅之，曰：「豹！汝尚敢至此啼乎！」故「子規」亦一名「謝豹」。\
    \  \n（伊士珍《瑯嬛記》）（註：①藏蟄：伏匿、潛藏。②怔忡：心跳劇烈，驚慌不安。） \n在文學作品中出現的「杜鵑」、「子規」皆指杜鵑鳥，往往被藉以塑造形象或表現情懷。請依據上述甲、乙文中，下列何者為最適切的敘述?"
  options:
  - label: A
    content: 由甲文可得知杜鵑鳥的外形、鳴叫狀態及繁殖時間點
