- id: doc_113_新北_土城_國文_g9s2e2_s2_35
  section: 2
  number: 35
  type: single
  page: 4
  stem: 請依據上述甲、乙二文的描述，下列何者敘述何者正確？
  options:
  - label: A
    content: 甲文著重描寫蜂王的習性，說明如何採集花蜜及出遊巡視的季節
  - label: B
    content: 乙文記錄蜜蜂的階級特質及其分工狀況，特別推崇雄蜂工作繁多
  - label: C
    content: 甲、乙二文皆說明蜂王與其他蜜蜂的階層關係
  - label: D
    content: 蜜蜂是一種母系社會性昆蟲，可分為雄蜂、蜂王及蜂后三種。
  group_stem: "(甲) 凡蜂不論於家於野，皆有蜂王。王之所居，造一臺如桃大。王之子世為王。王生而不採花，每日群蜂輪值，分班採花供王。王每日出遊兩度（春夏造蜜時），遊則八蜂輪值以侍。蜂王自至孔隙口，四蜂以頭頂腹，四蜂傍翼飛翔而去，遊數刻而返，翼、頂如前。\
    \ \n（宋應星《天工開物．蜂蜜》） \n(乙) 蜜蜂是一種母系社會性昆蟲，有明顯的階級區分，可分為雄蜂、蜂王及工蜂三種。前兩者專司全巢之繁殖任務，尤其蜂王不斷在產卵，因而地位崇高；而工蜂乃巢中的勞動者，在短短三十來天的壽命中，必須擔負築巢、育幼、採蜜、採水、採集花粉及保衛巢穴的工作，非常辛苦。\
    \ \n  一群蜂群中，只有一隻蜂王，是蜂群的主宰者。牠不需要親自外出採集花粉，蜂王雖然經過交配，但不是所產的卵都受了精，牠會按照社會群體的需求，產下受精卵將來發育為雌蜂（無生殖能力之工蜂），不受精卵將來發育為雄蜂。\
    \ \n  當蜜蜂生活的大家庭繁殖過多，造成擁擠時，就要分群。分群的過程大致如下：首先由工蜂製造特殊的蜂房—王臺，蜂王在所居王臺內產下受精卵後，待此一受精卵孵化，工蜂們即給予特殊的營養—蜂王漿飼育，當此一小幼蟲羽化為成蟲時，就成為具有繁殖能力的新蜂王。蜂王不隨便離巢，但假如蜂群中有新的蜂王產生，舊蜂王就會帶領一部分工蜂，飛離原來的蜂巢，另覓地方築新巢，建立新的蜂群，即通常所說的分封。\
    \    \n（節錄自顧世紅〈社會性昆蟲與化學語言〉）"
