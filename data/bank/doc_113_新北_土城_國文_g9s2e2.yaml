  group_stem: "甲、離震央約 200 公里的文獻—蒲松齡〈地震〉 \n  康熙七年六月十七日戌刻，地大震。余適客稷下，方與表兄李篤之對燭飲。忽聞有聲如雷，自東南來，向西北去。眾駭異，不解其故。俄而几案擺簸，酒杯傾覆；屋梁椽柱，錯折有聲。相顧失色。久之，方知地震，各疾趨出。見樓閣房舍，仆而復起；牆傾屋塌之聲，與兒啼女號，喧如鼎沸。\
    \ \n  人眩暈不能立，坐地上，隨地轉側。河水傾潑丈餘，雞鳴犬吠滿城中。逾一時許，始稍定。視街上，則男女裸聚，競相告語，並忘其未衣也。後聞某處井傾仄，不可汲；某家樓臺南北易向；棲霞山裂；沂水陷穴，廣數畝。此真非常之奇變也。\
    \ \n乙、近震央當地的文獻—康熙《郯城縣志》 \n  康熙七年六月十七日戌時地震，有聲自西北來，一時樓房樹木皆前俯後仰，以頂至地者連二三次，遂一顫即傾。城樓垛口、官舍、民房並村落、寺觀，一時俱倒，塌如平地。……合邑震塌房屋約數十萬間，其他裂處或縫寬不可越，或縫深不敢視，其陷塌處皆如階級，有層次，裂縫兩岸皆有淤泥細沙，其所陷深淺闊狹，形狀難以備述，真為曠古奇災。\
    \ \n丙、地震烈度表（GB/T 17742 — 2008）\n\n※地震烈度：烈度是用來量化地震對某一特定地點所受到的影響，由地震時地面建築物受破壞程度、地形地貌改變、人的感覺等宏觀現象判定。"
