- id: doc_113_台南_復興_社會_地理_g7s2e3_s1_23
  section: 1
  number: 23
  type: single
  page: 1
  stem: '為了完成地理報告，小華與同學們在老師指導下分組蒐集臺灣各大港口的資料，了解其地理環境與發展歷史。他們整理如右的表格，請根據相關敘述，判斷甲、乙、丙三個港口分別是哪裡：

    | 港口 | 特色 |

    | :--- | :--- |

    | 甲 | 港口位在大肚台地附近，周圍海岸淺且多沙岸，早期天然條件不佳，後來政府透過疏浚工程改善航道，逐漸發展成為現代化貨運港。 |

    | 乙 | 港口附近多為岩岸，海岸線陡峭且海水深，早期大型船隻無法直接靠岸，只能停在外海等待小船接駁。 |

    | 丙 | 原為潟湖地形，水域寬闊且水深適中，自清代起就有船隻進出，日治時期進行大規模港口整建與擴建，現為臺灣最大的國際商港。 |'
  options:
  - label: A
    content: 甲：花蓮港；乙：臺中港；丙：高雄港
  - label: B
    content: 甲：高雄港；乙：基隆港；丙：臺中港
  - label: C
    content: 甲：臺中港；乙：花蓮港；丙：高雄港
  - label: D
    content: 甲：基隆港；乙：臺中港；丙：高雄港
