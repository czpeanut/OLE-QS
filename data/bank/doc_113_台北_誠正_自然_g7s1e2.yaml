  number: 27
  type: single
  page: 3
  stem: 請依據本文，說明益生菌對人體可能的好處。
  options:
  - label: A
    content: 益生菌能透過代謝補充人體需要的營養素
  - label: B
    content: 益生菌能治百病
  - label: C
    content: 使用益生菌能保證長命百歲
  - label: D
    content: 益生菌能使人百毒不侵
  group_stem: "※題組26~28 \n食品挑選一點靈 \n  某些人因體重過重而誘發相關疾病，因此「高纖、低脂、低熱量」常是這類族群接受到的提醒與建議，也是一般人透過飲食減重的祕訣。高纖食品是指含有相對高比例的膳食纖維（dietary-fiber），膳食纖維多存在於植物細胞壁及細胞內，是不被人體消化酵素所分解的碳水化合物，包括果膠、纖維素、半纖維素、木質素等，它們能促進糞便的形成與腸道蠕動，同時避免便祕或痔瘡的發生。\
    \ \n  市面上許多「益生菌」為名的商品，泛指具有乳酸菌、酵母菌等據稱對人體有益的商品。然而，我國食品安全法規中並沒有這種統稱的說法，而是列出可用的菌種；乳酸菌有許多種類，法規也並未將所有乳酸菌菌種納入可食用範圍，故在使用這些所謂的健康食品時，必須注意其品質或商品標示是否安全無虞。\
    \ \n請在閱讀本文後，回答下列問題："
