    content: 公然侮辱罪與毀謗罪的前提皆為散播於公眾場所
  - label: B
    content: 只要沒有指名道姓，公然侮辱的罪名就無法成立
  - label: C
    content: 檢警在查網路IP 時限制多，所以匿名罵人是沒有風險的行為
  - label: D
    content: 倘若發表的言論內容沒有惡意，理論上不會涉及毀謗罪
  group_stem: '在臉書、IG、社團留言或發文批判別人，這樣也有責任嗎？罵人，會涉及「公然侮辱罪」或「毀謗罪」。但前提是，「公然侮辱」要成立，有兩個要件：一是公然；二是要知悉你在罵誰。公然就是要在公開場所，是在大家都看得到、聽得到的情況下罵。網路討論區、線上遊戲、BBS⋯⋯只要是公開留言，都算是「公然」。千萬不要以為，沒有指名道姓就沒事。如果你的描述，足以讓他人對號入座，就算沒有寫出姓名，也會觸法。

    基於憲法保障言論自由，對於善意發表的言論，會從寬解釋，採取「真正惡意原則」。也就是說，只要發表言論時，沒有毀損他人名譽的惡念，就算事後發現與真相有差距，都符合「善意」，否則就「有礙整體人類社會之進步」。

    誹謗，簡單說就是惡意栽贓，讓對方名譽受損。誹謗沒有公不公然的問題，只要你故意在大眾間散播就成立。很多人誤以為，只要講的內容是真實的，就不會構成誹謗。其實能說的事，只限於可受公評的公眾人物，以及與公共利益有關的事項，所以不要以訛傳訛，傷害同學。

    依據「通訊保障監察法」，檢警要查網路IP 雖然有很多限制，但如果從別的跡證可以查出這個帳號是你在使用，還是有成立犯罪的可能。聰明的你一定要懂，人際衝突處理需要技巧，在學校有衝突或誤會，務必找師長討論，用最有利自己的方式處理。人際技巧是需要學習的，就跟學業一樣。除了不損他人，也要懂得保護自己，正確回應人際衝突。

    (改寫自吉靜如 只是開玩笑，竟然變被告)'
