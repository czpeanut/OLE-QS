- id: doc_111_高雄_大灣_國文_g7s1e1_s3_6
  section: 3
  number: 6
  type: single
  page: 1
  stem: 下列關於「新詩」與「童詩」的說明，何者正確？
  options:
  - label: A
    content: 新詩也稱「現代詩」、「白話詩」、「今體詩」
  - label: B
    content: 新詩表現手法自由靈活，不像古典詩受形式與格律的限制
  - label: C
    content: 「童詩」以兒童的內心世界和生活經驗為題材，所以只有兒童才能創作
  - label: D
    content: 楊喚發起文學革命，提倡白話詩、文創作，被譽為台灣新詩創作的先驅
