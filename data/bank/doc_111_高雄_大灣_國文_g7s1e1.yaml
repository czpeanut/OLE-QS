  type: single
  page: 1
  stem: '「諧音雙關」是利用語言文字同音或是音近的關係，使一句話或一個詞語關涉到兩件事，產生互相引申、聯想的手法。

    下列「」中的詞語，何者沒有使用此手法？'
  options:
  - label: A
    content: 網路發達，人們在家中就能和世界溝通，可謂：人在一方，「網連世界」
  - label: B
    content: 長輩們苦口婆心的勸告，在他耳裡竟然都成了「廢腐之言」
  - label: C
    content: 時序入秋，旅行社推出奧萬大「楓華萬千」的賞楓專案
  - label: D
    content: 他們愛情長跑十年終成眷屬，但結婚一年就「相敬如冰」，令人慨嘆
