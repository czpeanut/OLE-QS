  options:
  - label: A
    content: 「熱帶藍的天空／藍得醉得倒人」──描述湛藍的晴空，天氣炎熱，熱昏了喝醉酒的人
  - label: B
    content: 「城南的小山／像一杯滿出來的綠酒」──形容滿山的青翠蓊鬱，綠意逼人，生機盎然
  - label: C
    content: 「白熱的陽光燙平了的檯布」──指開滿花的短短樹影像一塊被燙平的布
  - label: D
    content: 「一年裡最使人醉薰薰的／季節」──作者認為在初夏最適合和友人共飲，享受一飲而醉的痛快
  group_stem: '熱帶藍的天空

    藍得醉得倒人。

    城南的小山

    像一杯滿出來的綠酒。

    有短短的樹影做花邊的

    馬路是

    白熱的陽光燙平了的檯布。

    又是這樣的午後，又是這樣的星期日，

    又是這樣的和風

    吹進了輕飄飄的衣袖。

    多麼渴望多麼渴望舉杯

    跟大家喝一巡，

    為這個像野宴那樣歡樂的

    一年裡最使人醉薰薰的

    季節。

    (初夏──選自林良的 78 首詩)'
