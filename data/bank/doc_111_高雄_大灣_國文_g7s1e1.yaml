- id: doc_111_高雄_大灣_國文_g7s1e1_s4_4
  section: 4
  number: 4
  type: single
  page: 3
  stem: 下列何者並非描述母親腳疼痛的句子？
  options:
  - label: A
    content: 母親也會暗中咬牙，因為凍傷的地方會突然一陣刺骨難禁
  - label: B
    content: 我和貓都仰起臉來看她，端詳她平靜的面容幾條不平靜的皺紋
  - label: C
    content: 母親咬牙的時候，沒有聲音，只是身體輕輕震動一下
  - label: D
    content: 年復一年，冬天的訊息乍到，她的腳面和腳跟立即有了反應
  group_stem: '在我的記憶中，每到冬天，母親總要抱怨她的腳痛。

    她的腳是凍傷的。當年做媳婦的時候，住在陰暗的南房裡，整年不見陽光。寒凜凜的水氣，從地下冒上來，從室外滲進室內，首先侵害她的腳，兩隻腳永遠冰冷。

    在嚴寒中凍壞了的肌肉，據說無藥可醫。年復一年，冬天的訊息乍到，她的腳面和腳跟立即有了反應，那裡的肌肉變色、浮腫、失去彈性，用手指按一下，你會看見一個坑兒。看不見的，是隱隱刺骨的疼痛。

    分了家，有自己的主房，情況改善了很多，可是年年腳痛依然，它已成為終身的痼疾。儘管在那一方陽光裡，暖流洋溢，母親仍然不時皺起眉頭，咬一咬牙。當刺繡刺破手指的時候，她有這樣的表情。母親常常刺破手指。正在繡製的枕頭上面，星星點點有些血痕。繡好了，第一件事是把這些多餘的顏色洗掉。據說，刺繡的時候心煩慮亂，容易把繡花針扎進指尖的軟肉裡。母親的心常常很亂嗎？不刺繡的時候，母親也會暗中咬牙，因為凍傷的地方會突然一陣刺骨難禁。

    在那一方陽光裡，母親是側坐的，她為了讓一半陽光給我，才把自己的半個身子放在陰影裡。常常是，在門旁端坐的母親，只有左足感到溫暖舒適，相形之下，右足特別難過。這樣，左足受到的傷害並沒有復元，右足受到的摧殘反而加重了。

    母親咬牙的時候，沒有聲音，只是身體輕輕震動一下。不論我在做什麼，不論那貓睡多甜，我們都能感覺出來。這時，我和貓都仰起臉來看她，端詳她平靜的面容幾條不平靜的皺紋。我忽然得到一個靈感：「媽，我把你的座位搬到另一邊來好不好？換個方向，讓右腳也多曬一點太陽。」母親搖搖頭。

    節錄自(王鼎鈞 一方陽光)'
