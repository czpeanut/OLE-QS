  stem: '【甲】「盤古開天」的神話中，盤古死後，牙齒、骨骼變成金屬和岩石，骨髓變成珍珠美玉，汗水變成潤澤大地的雨露，連身上寄生的小蟲受到暖風的吹拂，也化為大地上眾多的百姓。

    【乙】相傳女媧是一位人頭蛇身的女神，她巡視大地時，總覺得孤獨寂寞，於是就用池邊泥土捏成許多小土偶，他們一放到地上就成了活蹦亂跳的真人。

