  stem: 「當街燈亮起來向村莊道過晚安」點出夜晚的降臨。下列詩句對於時間點的描述，何者配對正確？
  options:
  - label: A
    content: 一只便當∕一個我∕灼灼的陽光∕在窗外伴奏——旭日東升
  - label: B
    content: 雙翅一翻∕把斜陽掉在江上∕頭白的蘆葦∕也妝成一瞬的紅顏了——薄暮時分
  - label: C
    content: 剩下了牛女二星∕在情淚積成的天河∕划起輕妙的小艇唱著哀婉的情歌——天色將晚
  - label: D
    content: 柔鬚伸出去∕一行青碧的詩句∕攀上籬笆∕那牽牛花∕日∕出——日正當中
