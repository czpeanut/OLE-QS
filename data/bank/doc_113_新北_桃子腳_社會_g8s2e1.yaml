- id: doc_113_新北_桃子腳_社會_g8s2e1_s1_16
  section: 1
  number: 16
  type: single
  page: 1
  stem: 依民法規定，陳小姐屬於何種能力之人？
  options:
  - label: A
    content: 無行為能力人
  - label: B
    content: 限制行為能力人
  - label: C
    content: 完全行為能力人
  - label: D
    content: 受輔助宣告之人
  group_stem: '【題組一】請閱讀下文，回答16-20 題

    臺北一名陳小姐，騎機車時跟王姓女騎士發生擦撞，，由於陳小姐要趕著上班，雙方當場同意賠款5000 元了事，王女立刻將現金交給陳小姐。

    但在事發當日晚上，陳小姐發現腳越來越不舒服，到醫院檢查才知道骨折，要休養3 個月。這時候才求助警方，找到肇事人，想要求償。

    但沒有當時事故發生的相關資料與證據，王女亦認為陳小姐當下沒就醫，何時受傷難釐清，不願負擔額外賠償。

    陳小姐也試圖要聲請調解委員會進行（甲），但對方不願意出席。至此，陳小姐決定下一步要向法院提起（乙）。'
