    資料一孫文：「所謂訓政，即訓練清朝之遺民，而成為民國之主人翁，以行直接民權也」，又稱：「訓政時期，為保養、教育此主人，成年而後還之政也」。

    彭桂英，《中山先生「訓政時期」規劃之研究》，1990。

    資料二胡適指出，國民黨誤解因為人民知識程度低落，所以如果沒有經過訓政，就沒辦法實施民主政治。實際上民主政治需要的是「參政的經驗」，而不是「專門的知識」。民主制度本身就是一種教育，只有在實踐中才能學會。

