  group_stem: "【題組二】參考下列資料，回答21~22 題。\n    你知道中國最有名的人是誰？他姓差，名不多，差不多先生的名字天天掛在大家的口頭，因為他是全中國人的代表。他常常說：「凡事只要差不多就好了，何必太精明呢？」\n\
    \    有一天他得了急病，趕快叫家人去請東街的汪醫生，結果家人卻把西街的牛醫王大夫請來了。差不多先生心想：「好在王大夫和汪大夫也差不多，讓他試試看吧！」於是王大夫用醫牛的方法給差不多先生治病，不久後差不多先生就一命嗚呼了。\n\
    \    他死後，大家都稱讚差不多先生樣樣事情看得破、想得通、不計較，真是一個有德行的人，無數的人都以他為榜樣，於是人人都成為了差不多先生—然而中國從此就成為一個懶人國了。\n\
    改寫自胡適，〈差不多先生傳〉，1924 年6 月28 日"
