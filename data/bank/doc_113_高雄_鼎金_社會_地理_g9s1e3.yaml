  stem: 紐西蘭原住民的傳說裡，他們的祖先是從一處稱為『哈瓦基』(Hawaiki)的地方飄洋過海，在700年前來到紐西蘭，居住於北島。他們選擇北島居住的主要原因可能為下列何者？
  options:
  - label: A
    content: 降水量較多
  - label: B
    content: 氣候較溫暖
  - label: C
