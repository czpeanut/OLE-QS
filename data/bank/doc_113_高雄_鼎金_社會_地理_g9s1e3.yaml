  section: 1
  number: 14
  type: single
  page: 2
  stem: 紐西蘭的農牧業發達，農牧產品佔出口總值的一半，其中，Zespri是紐西蘭一個擁有高品質的奇異果品牌，種類眾多，如：陽光金圓頭、綠奇異果、寶石紅奇異果等，利用「某項優勢」，大量出口到世界各國，廣受歡迎。請問:上述提到的「某項優勢」為何？
  options:
