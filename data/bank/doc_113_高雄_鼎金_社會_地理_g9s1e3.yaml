  section: 1
  number: 12
  type: single
  page: 2
  stem: 紐西蘭善於利用自身的環境優勢進行發電，是南半球的再生能源大國，目前全國再生綠能的電力運用已達85％，目標於2025年提升至90％，大幅降低對石化燃料的依賴。請問：根據紐西蘭的自然環境判斷，下列哪種再生能源在紐西蘭的發電成效最低？
  options:
  - label: A
    content: 太陽能發電
  - label: B
    content: 風力發電
  - label: C
    content: 地熱發電
  - label: D
    content: 水力發電。
