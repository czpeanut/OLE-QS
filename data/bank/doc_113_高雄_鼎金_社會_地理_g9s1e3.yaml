- id: doc_113_高雄_鼎金_社會_地理_g9s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 新聞報導(2024.07.01)：「據NASA的計畫，國際太空站營運至2030年底後，將墜入太平洋的偏遠地區『尼莫點』(Point Nemo)，此區位於南太平洋中央的海洋上，正式名稱叫『海洋難抵極』。選擇此區域是因為它的偏遠、離最近的陸地都有2688公里且不影響交通往來，可避免任何墜落物的碎片危及人類性命，因此被各國太空機構選為舊的太空船和衛星的墓地。」請參考【圖一】，『尼莫點』的位置最可能位於下列哪個群島附近？
  options:
  - label: A
    content: 密克羅尼西亞
  - label: B
    content: 美拉尼西亞
  - label: C
    content: 印度尼西亞
  - label: D
    content: 玻里尼西亞。
