- id: doc_113_高雄_鼎金_社會_地理_g9s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 2024年聯合國氣候峰會(COP29)於11月24日在亞塞拜然閉幕，COP29與會代表拍板通過《巴黎協定》第6.4條，建立全球碳權交易機制，為國家、公司創建一個由聯合國管理的中央系統，藉由交易碳權抵銷碳排放。請問：下列哪一項措施是《巴黎協議》的主要訴求？
  options:
  - label: A
    content: 限制南極地區探勘資源的範圍
  - label: B
    content: 訂定明確的減碳排目標
  - label: C
    content: 推動全球海洋生態保育
  - label: D
    content: 確保締約國之間能共享能源。
- id: doc_113_高雄_鼎金_社會_地理_g9s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 自工業革命以來，人類活動已成為影響氣候的主要因素，且造成地球有些年代的溫度較高，更使短時間氣候劇烈變化並顯著的影響地球各國。【圖二】為世界各國易受氣候變遷的影響程度高低統計分布圖，由圖中資料顯示，易受氣候變遷影響的國家，普遍具有下列何項問題？
  options:
  - label: A
    content: 人口老化問題嚴重
  - label: B
    content: 沙漠面積逐漸擴大
  - label: C
    content: 勞工薪資成本較高
  - label: D
    content: 經濟發展程度不佳。
