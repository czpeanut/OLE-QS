  stem: 格陵蘭島位處北極圈附近，某研究針對島上居民進行「氣候變遷對人類心理影響」的抽樣調查，結果顯示大部分受訪者曾親身經歷全球暖化對生活帶來的影響，氣候變遷正為北極地區居民帶來前所未有的壓力和焦慮。下列何者最可能為當地居民擔憂的事情？
  options:
  - label: A
    content: 日益變薄的冰層讓雪橇通行變得危險
  - label: B
    content: 冰河侵蝕日漸增強導致耕地面積減少
  - label: C
    content: 海中珊瑚大量死亡造成觀光收益下滑
  - label: D
    content: 氣溫逐年變化使得冬天變長夏天變短。
