  stem: 科學家預測，未來的北極海航道將會重塑全球的交通網絡，可航運時間也將延長，大幅減少歐美到亞洲的通行距離。請問：無論是西北航道或東北航道，北極海上的航行危險性已降低，這與下列哪一個現象密切相關？
  options:
  - label: A
