  stem: 2015年，聯合國宣布了「2030永續發展目標(SDGs)」，包含消除貧窮、減緩氣候變遷、促進性別平權等17項SDGs目標，指引全球共同努力、邁向永續。當時有193個國家同意在2030年前，努力達成SDGs
    17項目標。下列做法何者符合SDGs欲達成的目標？
  options:
  - label: A
    content: 購買巴西雨林生產的牛肉
  - label: B
    content: 飼養資源需求較低的寵物
  - label: C
    content: 追求平價快速的時尚服飾
  - label: D
    content: 以私有運具取代大眾運輸。
