  stem: 2021年的聯合國氣候會議上，吐瓦魯的外交部長站在海洋上發布宣言，「我們將成立第一個數位國家，讓我們美麗的島嶼永遠留在元宇宙中。」身為第一個地球環境難民國，現已經陸續將居民遷移到其他國家。上述的環境難民，最可能是來自哪一種自然威脅？
