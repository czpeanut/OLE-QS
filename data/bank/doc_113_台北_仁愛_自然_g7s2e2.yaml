  group_stem: '冬蟲夏草【參考資料：維基百科】

    冬蟲夏草生長在海拔3000-5000 公尺的高山草地，冬季時，蝙蝠蛾的幼蟲被蟲草菌寄生，被菌絲吸收蟲體的養分，至蝙蝠蛾幼蟲死亡，因外表仍維持幼蟲樣貌，故稱為冬蟲；到夏天，蟲草菌從幼蟲頭部長出並突出地面，外觀形似植物，故稱為夏草。依序回答44-45
