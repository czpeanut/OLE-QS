  group_stem: '血友病(Hemophilia)的遺傳【參考資料：台大醫院 血友病中心 血友病的成因及歷史】

    血友病的出血症狀是因為缺乏第八或第九凝血因子所致。缺乏第八凝血因子稱為A 型血友病，缺乏第九凝血因子稱為B型血友病，兩種血友病的臨床表現非常相似。

    根據研究，19 世紀統治英國的維多利雅女王應該是整個家族中第一個發生突變者，她自己沒有明顯的症狀，但是當時的歐洲皇室互相通婚，因此皇室成員中出現了相當多的血友病患者，其中罹病者多為男性，且女性有正常∕血友病∕帶因(帶有疾病基因，但不表現)三種表徵，男性僅有正常∕血友病兩種表徵。

