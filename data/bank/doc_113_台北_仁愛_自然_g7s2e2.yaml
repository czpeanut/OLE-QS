    content: 公貓、母貓都不會有玳瑁貓
  group_stem: '貓的毛髮顏色【本文節錄自維基百科】

    從遺傳學上來說，貓的毛髮只有產生黑色的真黑色素和產生紅色的嗜鉻黑色素兩種色素，再因為兩種色素分布的疏密而產生不同的花色。

    全色貓的每根毛髮都有完整的色素沉澱，身上只有單獨顏色；紅貓則因為基因的緣故，紅色多數出現在幼貓時期，成年貓則呈現橘色、奶油色。

    全色(單色)貓基本毛色

    | 影響毛髮的色素 | 色素分布密集 | 色素分布疏落 |

    | :--- | :--- | :--- |

    | 真黑色素 | 黑色、巧克力色 | 藍色、焦糖色 |

    | 嗜鉻黑色素 | 紅色、橘色 | 奶油色、杏色 |

    貓咪的性別遺傳和人類相同，雌貓的性染色體是XX，雄貓的性染色體是XY；決定貓咪毛色遺傳的基因只位於X 染色體，如果X 染色體上一條帶有嗜鉻黑色素基因，一條帶有真黑色素基因，貓身上的毛色會呈現黑橘交雜的玳瑁色。

    請根據上文，依序回答29-31 題：'
