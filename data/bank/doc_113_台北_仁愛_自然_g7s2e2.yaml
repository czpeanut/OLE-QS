- id: doc_113_台北_仁愛_自然_g7s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 製造青黴素的生物與下列何種生物在分類階層上較為接近？
  options:
  - label: A
    content: 大腸桿菌
  - label: B
    content: 酵母菌
  - label: C
    content: 草履蟲
  - label: D
    content: 土馬騌
  group_stem: '【抗生素的發現】

    西元1922 年，生物學家弗萊明（Alexander Fleming，西元1881～1955 年）感冒時對著培養細菌的器皿打噴嚏，後來他注意到器皿上沾有鼻涕的位置都沒有細菌生成。隨著進一步的研究，弗萊明發現了溶菌酶─體液和身體組織中可溶解細菌的物質。他以為這可能是獲得有效天然抗菌劑的關鍵，但後來發現這種溶菌酶只對無害的微生物有用。

    西元1928 年，弗萊明外出休假兩星期，回到實驗室時發現一個未清洗的廢棄培養皿中長出青黴菌。他觀察到青黴菌周圍沒有細菌生長，因此推論青黴菌具有抗菌作用。這次的細菌是會使人類生病的葡萄球菌。後續研究證實，青黴菌所分泌的青黴素能夠阻礙多種細菌的生長，成為最早發現的抗生素，從此開創了抗生素的時代。'
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 生物
      code: 3-3
      title: 原核、原生生物及真菌界
      chapter: 第3章 生物的演化與分類
    textbook: 七下生物 3-3 原核、原生生物及真菌界
    labeled_by: ai
