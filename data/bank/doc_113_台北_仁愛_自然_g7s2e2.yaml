    民國91 年4 月15 日，臺灣動物科技研究所研究多時的複製豬——酷比豬誕生，牠是全球首例的雙基因轉殖複製豬，不僅以豬耳朵的皮膚細胞作為複製原料，並且將治療血友病患的人類第九凝血因子基因，以及抑制細菌生長，豬的乳鐵蛋白基因轉殖入豬胚，經收集酷比豬泌乳期乳汁分析，證實每毫升豬乳中含有人類凝血第九因子濃度約200~500$\mu$g，為正常人血漿中所含凝血第九因子濃度(5$\mu$g/ml)的40-100倍，以正常豬隻泌乳量(520
    公升/年)而言，只需維持20-30頭擁有人類凝血第九因子基因轉殖母豬，即可滿足全球之需求量。依序回答41-43 題：'
