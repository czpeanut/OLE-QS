  group_stem: '臺灣稻米的改良【參考資料：維基百科、農業新知與技術-陸稻 】

    目前全世界約有22 個稻種，除了亞洲種和小部分非洲種，其餘20 種均為野生稻。亞洲種是世界栽培稻最主要的稻種，又可細分為秈稻、梗稻及爪哇稻。秈稻適合熱帶及亞熱帶地區種植，梗稻適合溫帶地區栽培，爪哇稻則分布在熱帶山區，臺灣現有的陸稻特性類似爪哇稻，耐旱，一般種植於旱地或山坡地，極少種植於水田。

    臺灣稻米本的歷史可追溯至明鄭時期由中國引入秈稻的稻種，秈稻米較長、黏性差，在臺灣的氣候可一年兩收；日治時期因秈稻不符合日本人口味，開始從日本引進梗稻，初期氣候差異，梗稻僅能在陽明山竹子湖種植，一年一收；經反覆試驗，1926
    年磯永吉技士將日本梗稻「龜治」和「神力」雜交培植出新品種，即台中65 號，1926 年正式命名為「蓬萊米」，蓬萊米的外觀比秈稻短，呈橢圓形，米粒較大，黏性強，能適應高溫。

    中研院植物暨微生物研究所邢禹依團隊於2019 發表論文，分析臺灣陸稻的基因，發現日本梗稻能在臺灣孕育成蓬萊米，是因為山地陸稻的花粉飛到了新育種的梗稻上，產生雜交，才形成蓬萊米品種。依序回答35-37
