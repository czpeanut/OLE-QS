    隨著弱勢族群（如：露宿者、殘障人士、低收入戶或獨居長者……等）的議題日益被重視 ，我們在生活中或多或少能夠感受到來自大眾給予的關懷，如上圖所示的設計，即為我們幫忙弱勢族群所提供的一些設備或措施。

