- id: doc_113_高雄_英明_國文_g9s1e2_s2_41
  section: 2
  number: 41
  type: single
  page: 8
  stem: 根據本文首段，下列景物的美感程度依高至低的次序排列，何者正確？
  options:
  - label: A
    content: 景物的倒影→對岸的景物→此岸的景物
  - label: B
    content: 景物的倒影→此岸的景物→對岸的景物
  - label: C
    content: 對岸的景物→景物的倒影→此岸的景物
  - label: D
    content: 此岸的景物→對岸的景物→景物的倒影。
  group_stem: "丙、\n   我的寓所後面有一條小河通萊茵河。我在晚間時常到那裡散步，走成了習慣，總是沿東岸去，過橋沿西岸回來。走東岸時我覺得西岸的景物比東岸美；走西岸時適得其反，東岸的景物又比西岸的美。對岸的草木房屋固然比這邊的美，但是它們又不如河裡的倒影。同是一棵樹，若它的正身本極平凡，看它的倒影卻帶有幾分另一世界的色彩。我平時又歡喜看煙霧朦朧的遠樹，大雪覆蓋的世界和更深夜靜的月景。本來是習見不以為奇的東西，讓霧、雪、月蓋上一層白紗，便覺得很美麗。\n\
    \    北方人初看到西湖，平原人初看到峨嵋，雖然審美力薄弱的村夫，也驚訝它們的奇景；但在生長在西湖或峨嵋的人除了以居近名勝自豪以外，心裡往往覺得西湖和峨嵋實在也不過如此。……讀陶淵明的詩，我們常覺到農人的生活真是理想的生活，可是農人自己在烈日寒風之中耕作時所嘗到的況味，絕不似陶淵明所描寫的那樣閑逸。人常是不滿意自己的境遇而羨慕他人的境遇，所以俗話說：「家花不比野花香」。人對於現在和過去的態度也有同樣的分別，本來是很酸辛的遭遇到後來往往變成很甜美的回憶。我小時在鄉下住，早晨看到的是那幾座茅屋、幾畦田、幾排青山，晚上看到的也還是那幾座茅屋、幾畦田、幾排青山，覺得它們真是單調無味，現在回憶起來，卻不免有些留戀。\n\
    \    這些經驗你一定也注意到的。它們是什麼緣故呢？這全是觀點和態度的差別。看倒影，看過去，看旁人的境遇，看稀奇的景物，都好比站在陸地上遠看海霧，不受實際的切身的利害牽絆，能安閑自ptr在地的玩味目前美妙的景致。看正身，看現在，看自己的境遇，看習見的景物，都好比乘海船遇著海霧，只知它妨礙呼吸，只嫌它耽誤程期、預兆危險，沒有心思去玩味它的美妙。持實用的態度看事物，它們都只是實際生活的工具或障礙物，都只能引起欲念或嫌惡。要見出事物本身的美，我們一定要從實用世界跳開，以「無所為而為」的精神欣賞它們本身的形象。……\n\
    \    再就上面的實例說，樹的倒影何以比正身美呢？它的正身是實用世界中的一個片段，人一看見它，不免想到它在實用上的意義，發生許多實際生活的聯想。倒影是隔著一個世界的，是幻境的，是與實際人生無直接關聯的。我們一看到它，就立刻注意到它的輪廓線紋和顏色，好比看一幅圖畫一樣。這是形象的直覺，所以是美感的經驗。總而言之，正身和實際人生沒有距離，倒影和實際人生有距離，美的差別即起於此。\
    \                                          （節錄自朱光潛談美）"
