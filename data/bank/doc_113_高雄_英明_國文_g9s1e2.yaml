    \    ……宴中劉邦屈辭卑顏，項羽久無動作，范增候之不耐，而召項莊舞劍，意在刺殺劉邦。正當危機迫在眉睫，樊噲帶劍擁盾闖入帳中，先以氣勢鎮壓全場，又以嚴詞正義說得項羽無以應對。其後劉邦藉尿遁脫身，終於免了一場大難!司馬遷走筆至此功德圓滿，而我們放心之後，也嘆了一口氣。難道不是慨嘆項羽的婦人之仁嗎？難道不是厭膩劉邦的厚顏無恥嗎？難道不是想到壯盛青春對抗中年的無奈，而天下動盪，居然落入一個習慣口呼恁爸，折辱儒生的流氓手中嗎？不，當然不是，因為天下大勢莫不如此，李宗吾（註：《厚黑學》一書作者）早就語帶諷刺地說過，只有面厚心黑，才能成功立業。而我們心知肚明，早就習慣奉天承化當順民，人吃牛肉我喝湯，到沒湯喝的時候才想到要出聲喊喊農民起義。不是因為這些，而是難過那些華美飲宴精緻餐食，怎麼老是變成有心人士較量實力成逞鬥心機的工具呢？……\n\
    \    每當從新聞中看見勾結圖利的聚會又在某餐廳舉行，誰誰讓媒體飛車追逐又讓檢調約談，我便懷念起從前在大洋之濱的日子，漁港裡總有新鮮的海產，市場中到處是便宜的蔬菜。彼時好悠閒，樂於調和鼎鼐，整治出一道豐盛菜色，趁熱上桌，酒食皆備，心神都安。\n\
    \                                               （節錄自吳岱穎誰來晚餐──讀〈鴻門宴〉）"
