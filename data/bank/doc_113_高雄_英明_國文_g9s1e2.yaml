- id: doc_113_高雄_英明_國文_g9s1e2_s2_49
  section: 2
  number: 49
  type: single
  page: 10
  stem: 依據上文旨意，下列哪一個選項敘述正確?
  options:
  - label: A
    content: 人們通常因為無法快速看到改變的成效就恢復本性
  - label: B
    content: 若某階段的決定太過微小，對人生不會有任何影響
  - label: C
    content: 大部分的人都能注意到自己做出的改變帶來的價值
  - label: D
    content: 這是一篇理財的文章，教導我們如何用小錢賺大錢。
  group_stem: "庚、\n    「聚沙成塔、滴水穿石」告訴我們積少成多、持續努力就能成功。我們熟知此道理，卻往往還是低估每天累積的重要性，而過於高估單一決定的重要性。\n\
    \    隨著時間遞嬗，微小改善能造成的變化是非常驚人的。例如：如果每天都能進步百分之一，持續一年，最後你會進步將近三十七倍；相反地，若是每天退步百分之一，持續一年，你則會弱化到趨近於零。\n\
    \    以金錢更具體的來說明，存款能透過「複利」逐漸累積而加倍；同樣的道理，若想要「自我改善」，也能透過「習慣」這個複利來達成目標，因為習慣的效果會在你重複執行的過程中加倍。然而我們往往輕視小小的改變，因為它們在當下似乎並不重要。好比現在存一點錢，仍舊不是百萬富翁；連續上健身房三天，身材也沒有變得結實。每當我們嘗試做些改變，但成果總是不夠明顯，於是又回歸先前的慣例。不幸的是，變化的緩慢步調也同時讓惡習悄悄產生。\n\
    \    惡習的產生，猶如日復一日重複百分之一的錯誤，若我們不斷複製細微的過錯，並將藉口合理化，就也如同以複利計算一樣，最終可能會導致難以承擔的後果。\n\
    \    做出百分之一好或壞的選擇，在當下似乎沒有太大的差別，但是經過長時間的放大，便會決定你是怎麼樣的人。換句話說，造就成功的往往是日常生活中看似微不足道的習慣，而非千載難逢的機運。因此比起當前擁有的成果，你更該關注的是現在正處於什麼樣的路徑？目前養成的習慣，是否能帶領你通往成功的道路呢?\
    \                                      (改寫自詹姆斯·克利爾原子習慣)"
