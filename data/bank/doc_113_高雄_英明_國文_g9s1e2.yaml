  - label: C
    content: 豪哥想要和好兄弟一起讀第一志願的明星高中，於是在國中會考前一週開始復習，每天挑燈夜戰讀書到凌晨
  - label: D
    content: 芃芃為了實現開咖啡廳的夢想，大學時期就開始打工存錢，畢業後存到人生第一桶金，並擁有了自己的店面。
