- id: doc_113_高雄_英明_國文_g9s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: '論語和孟子皆為儒家經典四書之一，下列表格整理了有關這兩本書的比較，何者正確？


    | | 論語 | 孟子 |

    | :--- | :--- | :--- |

    | （Ａ）編撰者 | 孔子、孔子弟子與再傳弟子 | 孟子與孟子弟子 |

    | （Ｂ）體例與思想 | 紀傳體，主張仁政，因材施教，以民為本 | 語錄體，提出義利之辨，有教無類，民貴君輕 |

    | （Ｃ）篇名 | 取各篇首章二至三字為名，篇名與內容無直接關聯 | 篇名取自該篇首章開頭的幾個字，並無實際意義 |

    | （Ｄ）內容 | 主要記載孔子周遊列國的事蹟 | 主要記述孟子思想、言行 |'
  options:
  - label: A
    content: 編撰者：論語為孔子、孔子弟子與再傳弟子；孟子為孟子與孟子弟子
  - label: B
    content: 體例與思想：論語為紀傳體，主張仁政，因材施教，以民為本；孟子為語錄體，提出義利之辨，有教無類，民貴君輕
  - label: C
    content: 篇名：論語取各篇首章二至三字為名，篇名與內容無直接關聯；孟子篇名取自該篇首章開頭的幾個字，並無實際意義
  - label: D
    content: 內容：論語主要記載孔子周遊列國的事蹟；孟子主要記述孟子思想、言行
