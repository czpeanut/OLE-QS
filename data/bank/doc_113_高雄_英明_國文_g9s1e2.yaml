  group_stem: "戊、\n    吃食如何給人幸福的感覺，其心緒變化種種，我已然生疏。在我北城山居的日子裡，總是獨飲獨食。獨飲令人精神渙散，獨食教我腰圍膨脹，每當吃飽喝足，腆著肚腩坐在沙發上的時刻，心中莫名感慨，譬如愛，譬如死，譬如怎樣才是一個家──家是什麼？或許是一方餐桌罩滿溫暖的燈光，食物煙氣騰騰散發誘人色香味，最重要的是還有生命中那個無比重要的人，坐在你的對面，一次咀嚼綻開一朵笑靨。若有幸福，正該是那樣的時刻，身心靈魂、連腸胃都有人相伴。\n\
