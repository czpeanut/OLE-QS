  - label: C
    content: 既懷恥惡，必能改善，故以此激「之」
  - label: D
    content: 後有老父遺劍於路，行道一人見而守「之」。
  group_stem: "甲、\n   (一)王烈，字彥方，太原人也。少師事陳寔，以義行稱。鄉里有盜牛者，主得之，盜請罪曰：「刑戮是甘，乞不使王彥方知也。」烈聞而使人謝之，遺布一端。或問其故，烈曰：「盜懼吾聞其過，是有恥惡之心。既懷恥惡，必能改善，故以此激之。」後有老父遺劍於路，行道一人見而守之，至暮，老父還，尋得劍，怪而問其姓名，以事告烈。烈使推求，乃先盜牛者也。\n\
    \                                                                     (後漢書．王烈傳)\n\
    \   (二)徐有功，為政仁，不忍杖罰，民服其恩，更相約曰：「犯徐參軍杖者，必斥之。」訖代不辱一人。累遷司刑丞。時武后僭位，吏爭以周內窮詆相高，后輒勸以官賞，於是以急變相告言者無虛日。朝野震恐，莫敢正言，獨有功數犯顏爭枉直，后厲語折抑，有功爭益牢。嘗謂所親曰：「大理，人命所繫，不可阿旨詭詞，以求苟免。」故有功為獄，常持平守正，以執據冤枉，凡三坐大辟，將死，泰然不憂，赦之，亦不喜，后以此重之。\
    \                   (新唐書)"
