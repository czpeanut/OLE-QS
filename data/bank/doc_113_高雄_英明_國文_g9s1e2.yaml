  section: 1
  number: 1
  type: single
  page: 1
  stem: 吳均與宋元思書是一封「給宋元思的信」（宋元思，字玉山），但完全不見書信的格式，大概這篇流傳後世的篇章只是原來書信的其中片段，被古代編書家選入文集供人欣賞，至於原來書信的其他部分，早已不傳。若您有幸搭乘哆啦A
    夢的時光機回到當時，可能在這封信看到以下哪個選項「 」內的文字呢？
  options:
  - label: A
    content: 開頭用「玉山吾友尊鑒」
  - label: B
