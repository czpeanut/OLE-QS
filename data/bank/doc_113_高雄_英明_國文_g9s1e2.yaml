    content: 爭帝圖王勢已傾，八千兵散楚歌聲。烏江不是無船渡，恥向東吳再起兵(胡曾烏江)
  - label: C
    content: 勝敗兵家事不期，包羞忍恥是男兒。江東子弟多才俊，捲土重來未可知(杜牧題烏江亭)
  - label: D
    content: 百戰疲勞壯士哀，中原一敗勢難回。江東子弟今雖在，肯與君王捲土來(王安石烏江亭)
  group_stem: "戊、\n    吃食如何給人幸福的感覺，其心緒變化種種，我已然生疏。在我北城山居的日子裡，總是獨飲獨食。獨飲令人精神渙散，獨食教我腰圍膨脹，每當吃飽喝足，腆著肚腩坐在沙發上的時刻，心中莫名感慨，譬如愛，譬如死，譬如怎樣才是一個家──家是什麼？或許是一方餐桌罩滿溫暖的燈光，食物煙氣騰騰散發誘人色香味，最重要的是還有生命中那個無比重要的人，坐在你的對面，一次咀嚼綻開一朵笑靨。若有幸福，正該是那樣的時刻，身心靈魂、連腸胃都有人相伴。\n\
    \    從前只覺得吃得好比較要緊，座間何人倒不那麼重要……一頓飯能計較多少？……至大大不過天下，權力角逐，利益輸送，有所求者不過如此。席間有時市道之交，買進賣出煞費苦心，一日東窗事發，各備說詞還前後矛盾；有時卻是兩雄相爭，列強環伺，飲食不忘攻防，言談意帶殺伐，一不留神便血濺五步，鴻圖霸業化為煙雲。所謂宴無好宴，會無好會，司馬遷留給我們這個帶有殺氣的名詞：鴻門宴。\n\
    \    ……宴中劉邦屈辭卑顏，項羽久無動作，范增候之不耐，而召項莊舞劍，意在刺殺劉邦。正當危機迫在眉睫，樊噲帶劍擁盾闖入帳中，先以氣勢鎮壓全場，又以嚴詞正義說得項羽無以應對。其後劉邦藉尿遁脫身，終於免了一場大難!司馬遷走筆至此功德圓滿，而我們放心之後，也嘆了一口氣。難道不是慨嘆項羽的婦人之仁嗎？難道不是厭膩劉邦的厚顏無恥嗎？難道不是想到壯盛青春對抗中年的無奈，而天下動盪，居然落入一個習慣口呼恁爸，折辱儒生的流氓手中嗎？不，當然不是，因為天下大勢莫不如此，李宗吾（註：《厚黑學》一書作者）早就語帶諷刺地說過，只有面厚心黑，才能成功立業。而我們心知肚明，早就習慣奉天承化當順民，人吃牛肉我喝湯，到沒湯喝的時候才想到要出聲喊喊農民起義。不是因為這些，而是難過那些華美飲宴精緻餐食，怎麼老是變成有心人士較量實力成逞鬥心機的工具呢？……\n\
    \    每當從新聞中看見勾結圖利的聚會又在某餐廳舉行，誰誰讓媒體飛車追逐又讓檢調約談，我便懷念起從前在大洋之濱的日子，漁港裡總有新鮮的海產，市場中到處是便宜的蔬菜。彼時好悠閒，樂於調和鼎鼐，整治出一道豐盛菜色，趁熱上桌，酒食皆備，心神都安。\n\
    \                                               （節錄自吳岱穎誰來晚餐──讀〈鴻門宴〉）"
