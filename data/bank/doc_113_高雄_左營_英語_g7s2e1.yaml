- id: doc_113_高雄_左營_英語_g7s2e1_s3_34
  section: 3
  number: 34
  type: single
  page: 3
  stem: What is the flu different from a cold?
  options:
  - label: A
    content: A cold makes people feel very tired, but the flu does not.
  - label: B
    content: The flu is worse than a cold and can make people very sick.
  - label: C
    content: A cold always causes(造成) a high fever, but the flu does not.
  - label: D
    content: The flu only makes people sick in Japan.
  group_stem: 'Flu or Cold? What Are They Different?


    A cold is mild. People with a cold have a runny nose, cough, and sometimes a sore
    throat. They may feel a little tired.

    The flu is worse. People with the flu have a high fever, muscle pain, and feel
    very tired. Some also have a cough and sore throat. The flu can make people very
    sick. Now, many people in Japan have the flu. Some schools close because of this.

    How to Stay Safe:

    1. Wash hands often. Wear a mask.

    2. Drink water and rest when you are sick.

    3. See a doctor if you have a fever.

    4. Get a flu shot every year.

    Stay healthy!


    tired 累的 mild 溫和的 runny nose 流鼻水

    cough 咳嗽 sore throat 喉嚨痛 worse 更糟的

    fever 發燒 muscle pain 肌肉痛

    mask 口罩 if 如果 shot 注射'
  ai_answers:
    gemini: B
    qwen: B
  answer:
  - B
  answer_status: ai_generated
  answer_source: ai:gemini+qwen
