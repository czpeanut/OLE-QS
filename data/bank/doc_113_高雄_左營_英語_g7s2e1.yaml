    about the test. If he fails it again, he can’t go out with his classmates. So,
    he picks up the phone and calls his school teacher, Ms. Chen.

    Jimmy: May I speak to Ms. Chen?

    Ms. Chen: Speaking.

    Jimmy: Good morning, Ms. Chen. My son has a bad cold. He can’t go to school today.

    Ms. Chen: Who is this?

    Jimmy: This is my mother speaking. Oh, no. I mean this is his mother speaking.

