  stem: What does a “gondolier” do?
  options:
  - label: A
    content: gondolier works on boats for rich people.
  - label: B
    content: A gondolier plays gondolas with people.
  - label: C
    content: A gondolier takes people around Venice by boat.
  - label: D
    content: A gondolier teaches people to row a boat.
  group_stem: 'Venice is a world-famous spot in Italy. There are about 177 canals
    in the city and over 400 bridges because Venice is a city of over 100 islands.
    Every day people move from one island to another by crossing the bridges over
    the canals, or taking gondolas. In fact, many people around the world come to
    visit the city for the experience of a gondola trip.

    But not everyone can row the gondola. It is just a small flat-bottomed rowing
    boat, but the rowing isn’t easy. You need over 400 hours of training and then
    there is a very difficult test. People have to be strong enough and smart enough
    to know every street, road and place in the city. But many people failed. They
    failed the training or the test. And for over 900 years, only men have the job
    as a gondolier. Until 2010. Giorgia, a 26-year-old woman, was the first lady gondolier.


