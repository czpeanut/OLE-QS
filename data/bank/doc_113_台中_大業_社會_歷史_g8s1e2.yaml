  group_stem: '18~19 為題組。以下三則資料為對某歷史事件之評論，試分析資料後回答問題。

    資料一：國家自從和ＯＯ交好以來，河朔地區的人民過的都很安穩，雖然每年都要給歲幣，但相較於用兵的費用，不到百分之一

    資料二：太宗皇帝因親征失敗，敵人十分囂張，常常騷擾邊境。真宗皇帝繼位之時，著重於文德，於時舊兵老將，往往戰敗，敵方的騎兵，直達澶淵，河朔地區大為騷動，於是皇帝駕車至澶淵。用錢與布匹去交好敵人。從此以後此地的百姓，四十年沒有戰爭。每年給的錢再多，都不到戰爭的百分之一。

    資料三：太宗從燕京城下軍隊崩潰，北虜追之，僅能脫逃。帶著的寶物武器都被奪走，侍者和嬪妃也都被抓走。大腿上中兩箭，每年都在痛，最後竟因箭瘡而死。這和北虜是不共戴天之仇，現在卻反給他們錢和布匹，讓他們把我們當作叔父，為人子孫，怎麼可以這樣做呢！'
