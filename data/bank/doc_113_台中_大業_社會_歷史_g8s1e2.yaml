  section: 1
  number: 11
  type: single
  page: 2
  stem: '此種貿易模式並不是國與國之間的平等互惠關係。如要進行此種貿易，必須先經過宗主國的冊封，確立藩屬國與宗主國之間的君臣關係才始得進行。確立宗藩關係後則依與宗主國的親疏程度，決定貿易的頻率，如琉球、朝鮮此種與中國關係親密者，一年一貢。日本則十年一貢，時室町幕府接受明朝冊封，以「日本國王」為名，向明朝納貢；日本船隊在進入中國前，必須查驗「勘合底簿」上的文號關防是否正確，無誤後使節團便可經由明朝的大運河系統前往北京遞交國書與貢品。遞交國書與貢品後，會獲得明朝的優渥賞賜，這部分的利益屬於幕府將軍。同時，其他船隊或使節團的隨行人員則可在港口寧波或北京進行官方許可的貿易，由於使節團經過的地方都是中國繁榮之地，他們來回之際，也促成交易的興盛。

    試問，關於此文敘述何者正確？'
  options:
  - label: A
    content: 比起經濟利益，幕府將軍更重視國家名份
  - label: B
    content: 此種貿易對明朝而言，是一種厚來薄往的貿易
  - label: C
    content: 此種貿易模式係在海禁政策下仍特許進行的貿易模式
  - label: D
    content: 當時日本處於鎖國的狀態。
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 歷史
      code: 4-2
      title: 明清的經濟與全球貿易
      chapter: 第4章 明清時期東亞世界的變動
    textbook: 八上歷史 4-2 明清的經濟與全球貿易
