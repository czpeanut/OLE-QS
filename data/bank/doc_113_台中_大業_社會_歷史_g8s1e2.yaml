  group_stem: "27~28 為題組，試閱讀下文以回答問題。\n  說到中國歷史上最著名的女詞人，多數人想到的非李清照莫屬。李清照生於神宗元豐年間。其父李格非為進士出身，官至禮部員外郎，是當時著名的作家，深受當時文壇宗匠蘇軾所賞識，常以文章相往來。母親王氏，出身名門，亦善文。這樣的家庭使李清照從小就受了良好的薰陶，為她日後擁有良好的創造能力奠定了基礎；寬鬆開明的家庭氛圍使李清照擁有了率真的性格。詞尤新生，這兩個條件使李清照在這一階段創造的詞較為寬鬆，較為活潑明朗。\n\
    \  徽宗建中靖國年間，李清照與長她三歲的趙明誠結婚。趙是金石家，夫妻二人前期生活安定優裕，李清照生活美滿，然而也是因為婚後的離別相思，讓李清照的詞出現了愁意。然而某事發生後，李清照的人生出現了莫大的改變。高宗建炎年間，李清照隨夫南渡，不久趙明誠逝於江寧。國破家亡的痛苦使其李清照的詞風轉為孤寂悽苦，多寫顛沛流離之苦，孤獨無依之痛，纏綿悽苦，轉為深沉的感傷。"
