    content: 乾隆。
  group_stem: "25~26 為題組，試閱讀並分析下文後作答。\n  此人於明末東來，自澳門登陸中國。訪中之初，該人自稱西僧，後知僧人於中國不為人所重視，改稱西儒。此人一方面透過介紹新器物吸引群眾；同時為在中國傳教順利，亦放寬部分宗教的規定以適應中國社會，進而招攬信徒。最終獲得官員推薦，成功獲得晉見皇帝的機會，而後其亦透過介紹西方知識結交許多宮廷士人，還與其中一人翻譯一本數學著作《幾何原本》。然而其傳教的成功卻引起其他派別不滿，向教皇控告之。此種教派間的相互攻訐，最後竟驚動中國皇帝頒佈對基督徒的宗教規定。"
