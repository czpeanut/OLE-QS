  group_stem: '15~16 為題組。以下三則資料為北宋時人對「聯金滅遼」政策之評論，試分析後回答問題。

    資料一：「今天的舉動就像有小偷跑進鄰居家，不幫忙還趁這個機會瓜分他們家，怎麼可以這樣做呢？。」

    資料二：「中國與遼雖為兄弟之邦，然百餘年間，他們常還是常來騷擾邊境。現在遼已衰弱而不取燕、雲，女真就要強盛了，中原故地將永遠不再被我們所擁有。」

    資料三：「兩國間的約定，背棄者禍及九族。陛下以孝治理天下，怎麼能忘了列祖列宗之靈呢？」'
