  stem: '以下兩則資料為對某政策的敘述，試分析後回答問題。

    資料一：「國家明文禁止，不准有任何一艘船入海，法令雖然嚴格，但沿海的居民以海維生，採捕魚蝦，這些人是無法禁止的，這種狀況則容易有人混在這群人之中。」

    資料二：「嚴禁商民船隻私自出海，有將一切糧食、貨物等項與逆賊貿易者，……不論官民，俱行奏聞正法，貨物入官，本犯家產盡給告發之人」

    試問，對此二則資料之敘述哪些正確？(甲)資料一的出現時間早於資料二 (乙)資料一顯示該政策實際上難以貫徹 (丙)資料二中的逆賊係指倭寇 (丁)資料二的政策在解決台灣問題後逐漸鬆綁'
  options:
  - label: A
    content: 甲丙丁
  - label: B
    content: 甲乙丁
  - label: C
    content: 甲乙丙
  - label: D
    content: 甲乙丙丁。
