  stem: '以下為兩則宋代之文學作品，試閱讀進行分析後回答問題。

    資料一：岳飛〈滿江紅〉

    「怒髮衝冠，憑欄處、瀟瀟雨歇。擡望眼，仰天長嘯，壯懷激烈。三十功名塵與土，八千里路雲和月。莫等閒、白了少年頭，空悲切。靖康恥，猶未雪。臣子恨，何時滅!駕長車，踏破賀蘭山缺。壯志飢餐胡虜肉，笑談渴飲匈奴血。待從頭、收拾舊山河，朝天闕。」

    資料二: 文天祥<過零丁洋>

    「辛苦遭逢起一經，干戈寥落四周星。山河破碎風飄絮，身世浮沉雨打萍。惶恐灘頭說惶恐，零丁洋裏嘆零丁。人生自古誰無死?留取丹心照汗青。」 (備註：其被忽必烈抓到首都關押幾年後，從容就義)

    這兩首文學作品皆表達出愛國忠心的情操，試問下列對兩文作者之敘述哪些錯誤？(甲)皆為外族所殺 (乙)資料二應出現於蒙古西征前 (丙)皆為抗金名臣'
