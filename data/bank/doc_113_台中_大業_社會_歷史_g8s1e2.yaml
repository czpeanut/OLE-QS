  section: 1
  number: 14
  type: single
  page: 2
  stem: '以下三則資料為十三世紀東亞地區三個國家出現的歷史紀錄，試分析後回答問題。

    資料一：「OO 滅了四十幾個國家，現在已經輪到西夏，西夏滅亡就輪到我國，我國亡國，下個就是貴國。唇亡齒寒，自然的道理。」

    資料二：「該國是過去我國的仇人，現在是我國的屏障。古人唇亡齒寒的錯誤可以被修正，應該給該國歲幣，一同抵抗外族。」

    資料三：「金的精兵在潼關，難以攻破。然而這兩國是世仇，其中一國必能借道於我。金急則必自潼關調兵。然以數萬之眾，跨越千里去救援，人馬疲憊，就算到了也無法戰鬥，一定能擊破他們。」

    試問，三則資料分別為何國立場？'
  options:
  - label: A
    content: 宋、金、蒙古
  - label: B
    content: 金、宋、蒙古
  - label: C
    content: 遼、宋、金
  - label: D
    content: 遼、金、宋
