  group_stem: "21~22 為題組，試閱讀並分析下文後作答。\n  郭靖見耶律齊一隊人被攔在城外，□□援兵調遣不便，傳令下去，命武氏兄弟揮兵放開缺口，任由□□兵爬上城頭。\
    \ 城下千千萬萬□□兵將見城破，大叫：「萬歲！萬歲！」 呂文德臉如土色，嚇得全身如篩糠般抖個不住，只叫：「郭大俠，這……這便……便如何是好？咱們這……這該當……」\n\
    \  郭靖不語，眼見□□兵已有五千餘人爬上城頭，舉起黑旗一招，驀地裡金鼓齊鳴，朱子柳與武三通各率一隊精兵，從埋伏處殺將出來，立時填住了缺口，不令□□兵再行攻上，城頭的五千餘人陷入了包圍圈之中。\
    \ 這時城外宋軍被圍，城頭□□軍被圍，東西南三門也是攻拒惡鬥，十分慘烈，喊聲一陣響似一陣。\n  □□大汗立馬於小丘之上，親自督戰，身旁兩百多面大皮鼓打得咚咚聲響，震耳欲聾，甚麼說話的聲音都給淹沒了。\
    \ 但見千夫長、百夫長一個個或死或傷，血染鐵甲，從陣前抬了下來。大汗蒙哥身經百戰，當年隨拔都西征，曾殺得歐洲諸國聯軍望風披靡，直攻至多瑙河畔，維也納城下，此刻見了這一番廝殺，也不由得暗暗心驚：「往常都說南蠻懦弱無用，其實絲毫不弱於我們□□精兵呢！」\
    \  節錄自《神鵰俠侶》"
