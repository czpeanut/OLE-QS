  stem: 發熱包中含有生石灰，其主要成分為氧化鈣，加水後反應生成氫氧化鈣，並產生熱使水沸騰。關於此化學反應式，下列何者正確？
  options:
  - label: A
    content: Ca$(OH)_{2}$→CaO + $H_{2}O$
  - label: B
    content: 2Ca$(OH)_{2}$→2CaO + $H_{2}O$
  - label: C
    content: 2CaO + $H_{2}O$→Ca$(OH)_{2}$
  - label: D
    content: CaO + $H_{2}O$→Ca$(OH)_{2}$。
  group_stem: '最近市面上推出了一種無須用電、火，便能快速煮好的火鍋，被稱為「自煮火鍋」。自煮火鍋主要利用化學反應自行發熱蒸煮，使用時將發熱包置於外鍋容器，並加冷水浸泡，再將食材鍋放置於上方即可。發熱包內含有生石灰（CaO）、金屬粉、活性炭、鹽等成分，加入冷水浸泡後，生石灰與水發生化學反應，產生氫氧化鈣及大量的熱能，使水沸騰產生蒸氣，便可將食物煮熟。

    然而，便利的背後仍有必須留意的安全事項，例如：發熱包反應後的溶液為鹼性，具有腐蝕性，對人體肌膚會造成傷害，且若隨意傾倒至河川，也會導致水汙染破壞生態，必須謹慎處理；而自煮火鍋的包裝材質多使用塑膠，若將塑膠容器長時間高溫加熱，也可能會溶出有害物質並將其吃下肚，須多加留意。'
  shared_asset: g1_29_30
  answer:
  - D
  answer_source: answer_key_vlm
