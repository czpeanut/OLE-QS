- id: doc_113_高雄_五福_社會_g9s2e2_s1_39
  section: 1
  number: 39
  type: single
  page: 5
  stem: '「我們在這次戰爭中所要求的，絕不僅是和我們本身有關的東西。我們所要求的，就是要使世界適合人類生存和安居樂業；尤其要使它成為一個這樣的世界：所有愛好和平的國家那些像我們一樣希望依照自己的方式生活，決定自己的制度的國家，能夠獲得正義的保證，並得到世界上其他民族的公平待遇而不致遭受暴力和損人利己的侵略。事實上，全世界各民族都是這一事業的共事者......關於各國對殖民地的權益的要求，應進行自由、開明和對公正的協調，並基於對下述原則的嚴格遵守：在決定關於主權的一切問題時，當地居民的利益，應與管治權待決的政府的正當要求，獲得同等的重視。」

    請問：上述這段內容，最有可能出自於哪位歷史人物的演講？'
