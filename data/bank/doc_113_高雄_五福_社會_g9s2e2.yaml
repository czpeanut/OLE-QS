- id: doc_113_高雄_五福_社會_g9s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 為了提升農產品的競爭力，我國許多農民逐漸轉向企業化經營。他們透過合作社、契作、品牌經營、品質管控等方式，提高農產品的價值與穩定市場銷售。以下是幾位農民的做法，下列哪一位農民的做法較不符合「農業企業化」的特性？
  options:
  - label: A
    content: 小志和附近稻農合作種植，成立品牌並統一包裝銷售。
  - label: B
    content: 小華根據市場行情，改變蔬菜品項並種植多種蔬菜。
  - label: C
    content: 小芬與連鎖手搖飲店簽約，固定供應高品質茶葉。
  - label: D
    content: 小成定期清理養雞場環境，確保符合檢疫與衛生規定。
  tags:
