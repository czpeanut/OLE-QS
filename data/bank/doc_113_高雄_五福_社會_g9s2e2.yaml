- id: doc_113_高雄_五福_社會_g9s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 代表軍屯的「鎮」或「營」等地名，最可能分布於哪個地區？
  options:
  - label: A
    content: 臺北
  - label: B
    content: 新竹
  - label: C
    content: 臺中
  - label: D
    content: 臺南。
  group_stem: ※臺灣的地名與歷史產業有密切的關聯。例如：「鎮」與「營」的相關地名，是因為當地曾實施寓兵於農的「軍屯」；而「大稻埕」則是晒穀場的意思；「張犁」、「甲」代表土地的計算單位；「股」是墾戶募集資金，墾成後分配土地股份；「結」是漢人墾地「結首」制的代稱，這些地名都反映當時農業開墾的狀況。除此之外，地名含有「樟」或「腦」者多半與製造樟腦有關，而含有「茶」字者大多為產茶區域，地名若有「蔗」、「廍」，則大多是製糖的聚落。請參考上文，回答8~11
