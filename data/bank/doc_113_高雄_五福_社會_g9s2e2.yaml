- id: doc_113_高雄_五福_社會_g9s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 基因改造技術自1970 年代問世以來，廣泛應用於農業領域。近年來，市面上含有基因改造成分的食品日益普遍，常見的基改作物如黃豆、玉米和棉花等，主要來自基改種植面積較大的國家，如美國、巴西與阿根廷。下列關於基因改造技術的敘述，何者最符合目前的科學研究與實際應用情形？
  options:
  - label: A
    content: 基因改造技術通常能有效提高作物產量
  - label: B
    content: 基因改造會削弱作物對病蟲害的抵抗能力
  - label: C
    content: 栽種基因改造作物會增加農藥的使用量
  - label: D
    content: 吃基因改造作物已被完全證實對人體安全無虞。
  tags:
    chapter:
      publisher: 翰林
      book: 九下
