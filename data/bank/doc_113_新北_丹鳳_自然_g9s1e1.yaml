- id: doc_113_新北_丹鳳_自然_g9s1e1_s2_30
  section: 2
  number: 30
  type: single
  page: 3
  stem: 當球自斜面高處滾下來的過程屬於何種運動？
  options:
  - label: A
    content: 變加速度運動
  - label: B
    content: 加速度變小
  - label: C
    content: 等加速度運動
  - label: D
    content: 自由落體運動球。
  group_stem: '【30~33題為題組】

    在義大利佛羅倫斯的科學史博物館成立於西元1927年，經兩年翻修後於西元2010年6月10日重新開館，更名為伽利略博物館（Museo Galileo）。

    館內收藏了一座十八世紀後期的一個演示儀器，長寬高為544cm $\times$39cm $\times$124cm，作者不詳，在史上最美的十項科學實驗這本書裡，作者克里斯（Crease）將此斜面稱為Belled
    Plane。

    如圖10所示。此演示器材有兩組鈴鐺，第一組鈴鐺是受懸掛在斜面後方的單擺牽動，每擺到最高點時會敲響鈴鐺，並發出等時距的鈴鐺聲。第二組是斜面上5個活動鈴鐺組，沿著斜面設置，當球自高處滾下來經過鈴鐺時，就會發出聲音，演示者可以一邊聆聽單擺敲出的鈴鐺聲，一邊排列這組活動鈴鐺，使球滾下來敲響的鈴鐺聲也是等時距的，以測量各組活動鈴鐺的間距比例是否符合「等加速度」的特性。'
  shared_asset: g2_30_33
