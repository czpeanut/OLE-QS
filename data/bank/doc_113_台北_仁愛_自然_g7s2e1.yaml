  group_stem: "◎請依據下列文章，回答下列第40-42 題： \n    海馬是海洋中的一種特殊魚類，具有獨特的生殖行為。在大多數動物中，雌性負責懷孕和生育後代。然而，海馬卻是例外，雄性海馬負責懷孕。在繁殖季節，雌性海馬會將卵子放入雄性海馬的育兒袋中。這個袋子位於雄性海馬的腹部，具有類似子宮的功能。雌性海馬會將數百顆卵子輸送到雄性身上，而雄性海馬則負責對卵子進行受精並使受精卵在育兒袋中孵化。雄性海馬的懷孕過程通常會持續10\
    \ 天到6 週，具體時間取決於水溫和其他環境因素。懷孕過程結束後，雄性海馬會釋放出孵化完成的小海馬。這些小海馬通常會直接游入海水中，並開始自主生活。這種雄性懷孕的行為，對物種的生存有重要意義。\
