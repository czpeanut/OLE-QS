  group_stem: "◎請依據下列文章，回答下列第36-40 題： \n  人類的性別是由性染色體所決定的，具有Y 染色體者為男性，而不具有Y 染色體者則是女性；同理的有貓和狗，具有Y\
    \ 染色體的貓、狗為雄性，不具有Y 染色體者則是雌性。然而，並非所有動物的性別決定方式都是如此，例如雞的性染色體有兩種，分別是Z 染色體和W 染色體，母雞的性染色體組合為ZW，公雞的性染色體組合為ZZ。\
    \ \n  有些動物甚至沒有性染色體，其性別的決定可能和環境的溫度高低有關，例如海龜剛產下的卵是沒有性別之分的，在蛋孵化的過程中，若溫度高於某個特定溫度時，就會孵出雌性；低於該特定溫度時，則會孵出雄性。\
