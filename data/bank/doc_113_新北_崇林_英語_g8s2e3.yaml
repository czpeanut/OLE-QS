- id: doc_113_新北_崇林_英語_g8s2e3_s3_35
  section: 3
  number: 35
  type: single
  page: 4
  stem: Why did so many people phone the hospital?
  options:
  - label: A
    content: They wanted to ask about their friends or relatives.
  - label: B
    content: They wanted to talk to the doctors.
  - label: C
    content: They wanted to ask the nurses out for a date.
  - label: D
    content: They were sick.
  group_stem: "The hospital was very busy. The nurses hurried from patient to patient,\
    \ so they didn’t have time to \ntalk with the patients or answer their questions.\
    \ They just gave them their medicines, made their beds and \nmoved on. The head\
    \ nurse was as busy as the others. She had to walk around with the doctors, make\
    \ sure \nthe nurses were doing their work, complete her reports and answer the\
    \ phone. Many of the phone calls \nwere from the friends and relatives of the\
    \ patients. They were telephoning for information about the \npeople in the hospital.\
    \ One phone call, however, was a little different from all the others.   \n“Hello,”\
    \ she said.  \nAt the other end of the line a voice said, “Good morning. I’m phoning\
    \ about Fred Williams. Could \nyou tell me how he is, please?”   \nThe nurse looked\
    \ at her notes and said, “Mr. Williams just had his operation, and is now resting.”\
    \   \n“Can you tell me if his condition is good?” the voice asked.   \n“Yes, his\
    \ operation was a success.” the woman answered.   \n“When do you think he will\
    \ be able to go home?” the voice asked.   \n“Maybe at the end of the week,” and\
    \ then she asked, “May I tell him who is asking about him?”\n“Yes. Fred Williams,”\
    \ the voice said.   \n“No, that’s the patient’s name,” the nurse said.  \n“Yes.\
    \ I’m the patient. Phoning you is the only way I can get any information about\
    \ my condition.”\n\npatient 病人    complete 完成 \nrelative 親戚    operation 手術 \n\
    if 是否        condition 狀況"
