    \ safe. Now, the group, Japan Weak Men’s \nCenter, also wants to have “men-only\
    \ train cars.” In fact, Japan did a survey before and interviewed 800 people.\
    \ Many \nwomen agreed to have “men-only train cars.” Surprisingly, there were\
    \ 66% of young men hoping to have special train \ncars just for men and also over\
    \ 50% of men in their thirties saying yes to the idea. From the angle of gender\
    \ equality, it’s \nmen’s right to have their own train cars. Second, there are\
    \ many people on trains during busy times. Men might \naccidentally touch someone,\
    \ and they are afraid of being wrongly accused. A “men-only train car” can deal\
    \ with the \nproblem very well. Will “men-only train car” work? No one can be\
    \ sure. However, it’s always good to see people caring \nabout the topic and bringing\
