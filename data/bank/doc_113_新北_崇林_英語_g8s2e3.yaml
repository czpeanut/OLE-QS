  stem: What’s the main purpose of this reading?
  options:
  - label: A
    content: To tell readers how to eat healthily.
  - label: B
    content: To teach readers how to lose weight.
  - label: C
    content: To teach readers how to stay healthy.
  - label: D
    content: To ask readers to drink more water.
  group_stem: "We should watch what we eat every day to keep ourselves healthy. First,\
    \ you should \nhave a balanced breakfast including things like low-fat milk, bread,\
    \ and fruit. Remember \nthat eating too much makes you sleepy. Second, don’t drink\
    \ more than two cups of coffee \nor tea a day. A little coffee or tea helps keep\
    \ you awake, but too much of it may get you \nvery excited and later make you\
    \ feel even more tired than before. Third, have a lunch and \ndinner with enough\
    \ protein. Low-fat meat, fish or beans are good. Fourth, only have fruit \nor\
    \ fresh vegetables for snacks. A few snacks between meals are good, but don’t\
    \ eat too \nmany. Finally, drink a lot of water. It’s good to drink water, even\
    \ when you are not thirsty.\n\nbalanced 均衡的  including 包含  protein 蛋白質 purpose\
    \ 目的"
