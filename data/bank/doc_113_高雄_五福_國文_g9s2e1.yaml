  stem: 「一撮葉，每天看到一生。看久了，說心花怒放也可以，說不動聲色亦可。」這段文字的涵義與何者最接近？
  options:
  - label: A
    content: 作者學習古人品茗的方式與生活態度
  - label: B
    content: 傳統茶道重視品茗人無動於衷的涵養
  - label: C
    content: 茶葉品質的好壞決定飲茶的心情感受
  - label: D
    content: 透過觀察茶葉的變化能體會生命意趣
  group_stem: "喜歡讀茶名，甚於賞壺。茶樹管它長成什麼樣其實都是枝枝葉葉，本來無名無姓，人替它取了名，是擬人化了。不管名字背後代表它的出身、製造過程，抑或沖泡時的香味，總是人的自作多情。\n\
    \    反正，人就是霸道，喜歡用建構社會解釋生命的一套邏輯轉嫁在茶身上，必要時還要改良品種。所以，茶也有尊卑高低了。我既然寫茶，自然無法避免使用現有的茶名，這是基礎語言。但我純粹想像，用舊軀殼裝新靈魂。\n\
    \    幾乎天天喝茶，通常一杯從早到晚只添水不換茶葉，所以濃冽是早晨，清香已到了中午，淡如白水合該熄燈就寢。喝茶順道看杯中茶，蜷縮是嬰兒，收放自如到了豆蔻年華，肥碩即是陽壽將近。一撮葉，每天看到一生。看久了，說心花怒放也可以，說不動聲色亦可。\n\
    \    平日逛街，看到茶店總會溜進去，平白叫幾個生張熟魏的茶名也很過癮。很少不買的，買回來首先獨品。烏龍茶好比高人，喝一口即能指點迷津。花茶非常精靈，可惜少了雍容氣度。冰的檸檬紅茶有點志不同道不合，可夏日炎炎，它是個好人。白毫烏龍耐品，像溫厚而睿智的老者。加味茶裡，薄荷最是天真可愛，月桂有點城府，玫瑰妖嬈，英國皇家紅茶，恕我直言，鍍金皇冠。\n\
    \    還是愛喝中國的茶，情感特別體貼。鐵觀音外剛內柔，佛手喝來春暖花開，柚茶苦口婆心，至於陳年普洱，好比走進王 謝堂內，蛛網恢恢疏而不漏，龍鬚茶，真像聖旨駕到，五臟六腑統統下跪。\n\
    \    喝茶也會「茶醉」。在朋友的茶莊，說是上好烏龍，到了第七泡，喉鼻暢通，滿腔清香，竟會醺醺然，走路好像誤入仙人花苑，可見「七碗歌」絕非子虛烏有。\n\
    \    既然茶不挑嘴，嘴不挑茶，有些滋味就寫入文章。不見得真有其人其事，只不過從茶味中得著一點靈犀，與我內心版圖上的人物一一印合，我在替舌尖的滋味找人的面目而已。\n\
    \    這樣的寫法，也可以說看不出跟茶有什麼瓜葛！話說回來，這是我的喝法，有何不可呢？況且，真正讓我感興趣的，不是茶的製造或茶藝，是茶味。       \
    \                             (節錄改寫自簡媜 下午茶)"
