    \    根據水產試驗所一份研究報告指出，魩仔魚是兩百多種魚類幼苗的統稱，牠們是海洋魚種數量及海洋食物鍊的基礎。海域若失去了這樣的基礎，研究報告中已清楚的指出後果——這樣的捕撈情況若是不加以管理和改善的話，最後，可能導至整個沿岸漁業的滅亡。\n\
    \    照理說，魩仔魚除了是多種魚類的數量基礎，同時牠們也是多種魚類願意靠岸覓食的主要原因。魩仔魚的確是重要的食物，但他們是許多種魚類賴以生存的重要食物，而絕不是人類賴以生存的重要食物。\n\
    \    沒人不曉得，沒有小魚就沒有大魚的簡單道理，而我們吃魩仔魚竟然一吃吃了一百多年，那樣無骨、無刺、糊里糊塗地吃掉了我們的海洋生機。\n(廖鴻基 拒吃魩仔魚)"
