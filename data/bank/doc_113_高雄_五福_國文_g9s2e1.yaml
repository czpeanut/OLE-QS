  stem: 文中所指「鶴將軍」應是下列何者？
  options:
  - label: A
    content: 負責管理鶴群的官員
  - label: B
    content: 擅長獵捕鶴的高手
  - label: C
    content: 懿公所豢養的鶴群
  - label: D
    content: 能聽懂鶴語的人才
  group_stem: "(四)話說衛惠公之子懿公，自周惠王九年嗣立，在位九年，般樂怠傲，不恤國政，最好的是羽族中一物，其名曰鶴。那鶴色潔形清，能鳴善舞，所以懿公好之。因懿公偏好那鶴，幾獻鶴者皆有重賞，弋人八方羅致，都來進獻。自苑囿宮廷，處處養鶴，何止數百。懿公所畜之鶴，皆有品位俸祿：上者食大夫俸，次者食士俸。懿公若出游，其鶴亦分班從幸，命以大軒載於車前，號曰「鶴將軍」。養鶴之人，亦有常俸。厚斂於民，以充鶴糧，民有飢凍，全不撫恤。\n\
    \    北狄主名曰瞍瞞，控弦數萬，常有侵吞中原之意。時衛懿公正欲載鶴出游，諜報：「狄人入寇。」百姓皆逃避村野，不肯即戎。懿公使司徒拘執之，須臾，擒百餘人來，問其逃避之故。眾人曰：「君用一物，足以禦狄，安用我等？」懿公問：「何物？」眾曰：「鶴。」懿公日：「鶴何能禦狄耶？」眾人曰：「鶴既不能戰，是無用之物，君敝有用以養無用，百姓所以不服也！」懿公曰：「寡人知罪矣！原散鶴以從民，可乎？」懿公果使人縱鶴，鶴素受豢養，盤旋故處，終不肯去。\n\
    \    一路軍人口出怨言，懿公夜往察之，軍中歌曰：「鶴食祿，民力耕；鶴乘軒，民操兵。狄鋒厲兮不可攖，欲戰兮九死而一生！鶴今何在兮？而我瞿翟①為此行！」懿公終被狄人砍為肉泥，全軍俱沒。\n\
    注解：①驚恐不安                          ──節錄並改寫自余邵魚、馮夢龍《東周列國演義第二十三回》"
