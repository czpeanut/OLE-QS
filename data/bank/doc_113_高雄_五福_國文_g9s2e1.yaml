    content: 立即理解→認同想法→表示支持
  group_stem: "(三)和一位老船長聊天，談到漁獲現況，老船長嘆了口氣回答:「現在的魚仔，連談戀愛的機會都沒有。」我一時聽不懂老船長的意思——魚仔沒機會談愛？最後，老船長又蹙著眉頭說：「連吃奶嘴的都不放過，哪有機會談戀愛？」老船長見證了臺灣沿海數十年來的枯榮，我能感受他幽默背後的沉重和沉痛。臺灣沿海曾經是漁產富饒之鄉，為何走到幾乎無魚可捕的窘境？老船長說出魚源枯竭的主要原因之一——撈了太多魩仔魚。\n\
    \    我們愛吃魩仔魚，說是鈣質豐富、營養豐富；我們一口幾百條，一餐數千條地囫圇吞……因為嗜吃而渾然不覺，我們已經吃掉了曾經豐盛的沿海漁產資源，同時也贏得了嗜吃魚苗等只有海鮮文化沒有海洋文化的惡名。\n\
    \    根據水產試驗所一份研究報告指出，魩仔魚是兩百多種魚類幼苗的統稱，牠們是海洋魚種數量及海洋食物鍊的基礎。海域若失去了這樣的基礎，研究報告中已清楚的指出後果——這樣的捕撈情況若是不加以管理和改善的話，最後，可能導至整個沿岸漁業的滅亡。\n\
    \    照理說，魩仔魚除了是多種魚類的數量基礎，同時牠們也是多種魚類願意靠岸覓食的主要原因。魩仔魚的確是重要的食物，但他們是許多種魚類賴以生存的重要食物，而絕不是人類賴以生存的重要食物。\n\
    \    沒人不曉得，沒有小魚就沒有大魚的簡單道理，而我們吃魩仔魚竟然一吃吃了一百多年，那樣無骨、無刺、糊里糊塗地吃掉了我們的海洋生機。\n(廖鴻基 拒吃魩仔魚)"
