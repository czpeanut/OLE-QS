    labeled_by: ai
- id: doc_113_台北_誠正_社會_公民_g8s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 在我國某次公職人員考試時，有出題教授利用擔任典試委員機會，將審題時記下的試題重點洩漏給坊間公職補習班，使考生在考前知悉試題重點並加強準備，嚴重傷害國家考試的公正性。因情節重大，由(甲)提案彈劾，並在(乙)機關的審理下降級改敘。有關此事件涉及的機關，下列何者敘述正確？
  options:
  - label: A
    content: 此事件處理的流程與正副總統彈劾案相同
  - label: B
    content: 甲對乙可提出不信任案，要求院長下台負責
  - label: C
    content: 甲負責審查預算，乙負責審查決算
  - label: D
    content: 甲、乙的院長都由總統提名，立法院同意。
