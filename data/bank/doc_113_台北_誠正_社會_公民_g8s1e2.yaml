  section: 1
  number: 2
  type: single
  page: 1
  stem: 新聞報導近日內湖一名二十多歲女子遭到恐怖情人刺傷，導致目前仍在醫院接受治療尚未脫險，經媒體批露，原來該女子已於一年半前申請保護令但仍未獲核准。報導出爐後，不少網友憤怒湧進各政治人物的臉書留言：「政府高喊社會安全網，但這麼多年下來，什麼時候才要修法讓這些人受到應得的處罰呢？」請問：網友針對此事件留言下列說明何者正確？
  options:
  - label: A
    content: 因為行政機關仍受依法行政的限制
  - label: B
    content: 因為一切社會問題僅能用法律解決
  - label: C
    content: 因為政治人物能夠迅速修改法律
  - label: D
    content: 因為只有法治國家才會有法律。
