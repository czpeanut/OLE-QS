- id: doc_113_台北_誠正_社會_公民_g8s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 《憲法》是人民權益的保障書，也是法治國家的一切根本。我國憲法對人民權利的其中一項保障為參政權，乙書寫制憲法內保障人民參與政治的權利。下列相關參政權敘述，何者正確？
  options:
  - label: A
    content: 罷免權是指人民可針對所有的公職人員，依法定程序使其去職的權利
  - label: B
    content: 為保障人民對於政治的參與，參加政黨也是參政權的一種形式
  - label: C
    content: 應考試與我們的生活息息相關，如教育會考也是其中之一
  - label: D
    content: 複決權是指人民針對法律或政策，表示同意或反對的權利。
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 公民
      code: 6-2
      title: 為什麼投票是重要的參與形式？
      chapter: 第6章 政治參與
    textbook: 八上公民 6-2 為什麼投票是重要的參與形式？
