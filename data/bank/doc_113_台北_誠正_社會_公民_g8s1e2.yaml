    labeled_by: ai
- id: doc_113_台北_誠正_社會_公民_g8s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: '某官員針對國內限塑措施的執行成效召開記者會表示如下：

    臺灣被海洋垃圾包圍，環保署在民國95 年修正公告取消有店面餐飲業的管制，放寬限塑措施，未能持續改變民眾使用習慣，延宕塑膠袋禁用時程，再加上近10 年國內塑膠袋整體生產及使用量不減反增，環保署明顯有疏失……。上述該名政府官員，最可能是下列何者？'
  options:
  - label: A
    content: 總統
  - label: B
    content: 大法官
  - label: C
    content: 審計長
  - label: D
