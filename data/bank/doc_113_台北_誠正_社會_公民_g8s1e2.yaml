- id: doc_113_台北_誠正_社會_公民_g8s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 我國《憲法》明文規定：「中華民國人民，無分男女、宗教、種族、階級、黨派，在法律上一律平等。」請問：下列哪項做法，符合上述基本權利的意涵？
  options:
  - label: A
    content: 為促進人民充分就業，政府開立各類職業訓練專班
  - label: B
    content: 人民對政策有疑慮時，可透過各種管道向政府提建言
  - label: C
    content: 搭乘大眾交通工具時，政府要求撥放不同母語的廣播以服務人民
  - label: D
    content: 人民若有從政的意願，可參與國家考試擔任公職人員。
  tags:
    chapter:
      publisher: 翰林
