  number: 1
  type: single
  page: 1
  stem: 「城武對政治十分熱衷，最近因勞動部霸凌案而對國家政府機關的施政感到痛心疾首，為改變如此現象，城武聯絡國內幾個主要的政黨，希望於週末招開記者會要求政府嚴懲職場霸凌」請問：關於上述城武的行為，與憲法所保障的合種基本權利最息息相關？
  options:
  - label: A
    content: 平等權
  - label: B
    content: 自由權
  - label: C
    content: 受益權
  - label: D
    content: 參政權。
