- id: doc_113_台北_誠正_社會_公民_g8s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 馨勻和班上同學聊天時，說她長大之後一定要選上教育部長，讓國中生能睡飽再上學，但同學聽了後都提醒她她剛剛講的內容有誤，請問：馨勻的對話問題在哪?
  options:
  - label: A
    content: 上學時間由憲法規定，部長不得更改
  - label: B
    content: 教育部長的職責為監督行政官員
  - label: C
    content: 擔任方式為行政院院長提請總統任命
  - label: D
    content: 需先通過考試院國家考試才能擔任
