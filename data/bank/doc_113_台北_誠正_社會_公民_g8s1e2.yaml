  number: 15
  type: single
  page: 2
  stem: '甲：「官員若有違法失職，我們會查明必要時提出彈劾」

    乙：「人民可經由請願的程序讓我知道，來做改進的目標。」

    丙：「針對人民所提起的訴訟，我有必要採公正客觀的態度來審理。」

    請根據內容，請問三人服務的機關分別是?'
