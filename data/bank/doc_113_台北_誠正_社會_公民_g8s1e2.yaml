- id: doc_113_台北_誠正_社會_公民_g8s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 2016 年正副總統與中央民意代表選舉後，原執政黨落敗，失去了(甲)國會的多數優勢，因此提出在新總統尚未上任前的四個月，希望由勝選的多數黨推派(乙)閣揆人選，以避免政局不安。而勝選的多數黨回應，將會尊重現任總統任命的院長施政，並且在遵循《憲法增修條文》的規定下，兩院分權制衡的制度各司其職，以便在政權交接過程中能維持政局穩定。請問：關於上文中提及的兩院分權制衡制度說明，下列何者屬之？
  options:
  - label: A
    content: 甲可審核乙院提出之決算
  - label: B
    content: 乙院可對甲願提糾正案
  - label: C
    content: 甲院可要求乙院去接受質詢
  - label: D
    content: 乙院可對甲院提不信任案。
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 公民
      code: 4-2
      title: 我國中央政府的互動關係
      chapter: 第4章 中央政府
    textbook: 八上公民 4-2 我國中央政府的互動關係
    labeled_by: ai
- id: doc_113_台北_誠正_社會_公民_g8s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 過去《勞動基準法》限制女性勞工夜間出勤，但是只要取得工會或是勞資協商同意就可以。然而在2021 年釋憲宣告《勞動基準法》第49 條第1 項，限制女性勞工夜間工作的法令無效，因此近日新北市政府依《職業安全衛生法》稽查夜間勞工工作情況，無論男女都應有相關的安全配套，並針對未符規定的業者予以裁罰。請問：依據上文，下列相關描述何者正確？
  options:
  - label: A
    content: 此為人民自由權的保障
  - label: B
    content: 文末政府的作法未依法行政
  - label: C
    content: 本文顯示命令不可牴觸憲法
  - label: D
    content: 釋憲機關同時負責審理彈劾之懲戒。
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 公民
      code: 2-1
      title: 法律的位階
      chapter: 第2章 憲法與權利保障
