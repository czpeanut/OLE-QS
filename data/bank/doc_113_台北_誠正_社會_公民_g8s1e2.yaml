    labeled_by: ai
- id: doc_113_台北_誠正_社會_公民_g8s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 我國《憲法》對於人民權利的保障僅作原則性的規定，而透過相關政策的實施，將可更進一步落實《憲法》條文的精神。下列政府的施政內容，何者最有助於維護《憲法》所保障的自由權？
  options:
  - label: A
    content: 政府對集會遊行以報備准許為原則
  - label: B
    content: 提供身心障礙學生升學名額的措施
  - label: C
    content: 定期舉行選舉廣泛地顯示民意
  - label: D
    content: 提出擴大就業方案以解決失業問題。
