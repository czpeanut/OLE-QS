  group_stem: "屏東基督教醫院工會理事長詹智鈞，被院方通知不續聘，引發工運界關注，屏東縣議員洪明江認為已經明顯違反工會法，批評屏縣府處置太消極。\n\
    \  洪明江質詢指出，工會理事長詹智鈞的權利受憲法保障，詹智鈞在屏基已經服務7 年，深獲患者信任，只因為擔任工會理事長，被院方通知6 月底將不續聘，此舉已經違反工會法，縣府應要求限期改善，否則可連續開罰，但至今縣府卻消極以對，只關心卻未開罰，有損屏東形象。\n\
    \  屏東縣勞動處長林德輝表示，詹智鈞醫師4 月24 日接獲口頭通知不續聘後，他立即多次與院方聯繫協調，並告知工會法相關規定，希望有所轉圜，上週五還邀請勞動部南下參加勞資爭議調解，結論是6\
    \ 月11 日邀集詹醫師、屏基院長、衛生局長、勞動處長4 人再度協商。\n  縣長潘孟安指出，詹醫師與屏基對於是否存在僱傭關係有認知差距，已請勞動部協調，勞資糾紛縣府居中調解責無旁貸，但絕對不能影響病患的就醫權，也必須確保醫院順利運作，最終則是希望勞資取得雙贏。\n\
    ~摘改自《屏基工會理事長遭解聘 議員批縣府態度消極》"
