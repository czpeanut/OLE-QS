- id: doc_113_台北_誠正_社會_公民_g8s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 現今西方許多國家的政府運作方式是，內閣總理負責國家的行政事務，並對該國的國會負責，並設立超然獨立的司法系統，針對政府的施政爭端作出公允的裁判，並對法律進行審核。請問：上述的運作方式其主要的目的為何？
  options:
  - label: A
    content: 權力間彼此制衡，可以滿足人民權利的保障
  - label: B
    content: 權力間互相競爭，提高政府施政的效率
  - label: C
    content: 集中權力於政府手中，為國家提供服務
  - label: D
    content: 採取分權制衡，避免人民濫權傷害到國家。
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 公民
      code: 3-2
      title: 為什麼政府的體制需要權力分立？
      chapter: 第3章 法治與權力分立
    textbook: 八上公民 3-2 為什麼政府的體制需要權力分立？
    labeled_by: ai
- id: doc_113_台北_誠正_社會_公民_g8s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 前幾年新冠肺炎疫情剛爆發的時候政府要求出入公共場所須實名制登記，方便政府日後調查確診者足跡上，將與確診者足跡重疊的民眾進一步匡列並強制隔離。此舉造成不少民眾的生活不便而產生不少抗議聲浪，對此，我國政府回應表示……。請問：下列哪一項回應，較符合法治國家的精神？
  options:
  - label: A
    content: 政府執政時須保持彈性，才能有效發揮權力
  - label: B
    content: 若法規獲得多數人支持，即可限制少數人的權利
  - label: C
    content: 國家的法律和政策，以保障人民權利為目的
  - label: D
    content: 人民應建立守法的觀念，避免影響政府權力。
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 公民
      code: 3-1
      title: 人治與法治
      chapter: 第3章 法治與權力分立
