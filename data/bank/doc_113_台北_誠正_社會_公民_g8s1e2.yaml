    labeled_by: ai
- id: doc_113_台北_誠正_社會_公民_g8s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 我國《憲法》規定：「中華民國之主權屬於國民全體。」，落實了我國「主權在民」的原則。請問：下列哪一作法足以印證上述？
  options:
  - label: A
    content: 為服務民眾返鄉需求，交通部協調客運業者於春節期間加開班次
  - label: B
    content: 按法律規定，行政命令可由行政機關依其職權逕行發布
  - label: C
    content: 我國於2022 年舉辦公投，人民透過投票來決定選舉權是否下修至18 歲
  - label: D
    content: 司法院大法官於2024 年釋憲宣布，死刑在條件都符合的情況下不違反憲法。
