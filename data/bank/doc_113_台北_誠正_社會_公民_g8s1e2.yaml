  group_stem: "明年度(甲）案昨再度在立法院闖關，藍白再次聯手以人數優勢，表決擋下(甲）案，這已是(甲)第五度卡關，行政院長卓榮泰揚言，若不得已，行政院必須思考是否釋憲，以因應僵局。\n\
    \  立法院在野黨團以「原住民禁伐補償」沒有編足等理由，多次退回明年度中央政府（甲）案。\n  民進黨立院黨團昨在立法院會提案，盼（甲）案能夠闖關。藍綠昨都祭出一級動員令，經過表決後，一○七人出席，贊成四十九票、反對五十八票，國民黨、民眾黨立委再度聯手封殺民進黨團提案，（甲）案仍未列議程，繼續擱置。\n\
    \  卓榮泰表示，行政院對於原住民禁伐補償並非一毛不編，只是持續考量國家財政，循序漸進，立法院不能以違憲、違法程序要求政院，若不得已，行政院必須思考是否將依法聲請釋憲因應僵局。\n\
    \  國民黨立委李彥秀說，不論是朝野協商、政黨協商，或是院際協調，都是解決政治僵局的方法，但民進黨「釋憲釋上癮」，把大法官當成解決政治紛爭的「工具人」，讓原本應該超然中立的大法官陷入爭議的第一線。\n\
    \  （甲）案角力，民進黨昨凌晨三時就在議場門口排隊，昨早七時議場一開門就成功遞案，爭取提案優先表決。國民黨團並未提早排隊送案，但也發出一級動員，並依黨團決議將（甲）案排除在議程外。\n\
    \  禁伐補償 綠有壓力\n  行政院對原住民禁伐補償遲不鬆口，在綠營內也形成壓力。雖然民進黨團總召柯建銘前天在朝野協商中提出每公頃四萬元的「折衷方案」，但民進黨原民立委伍麗華仍堅持每公頃六萬元。伍麗華昨天強調，她已向基層言明，拿政治生命擔保，禁伐補償一公頃六萬元，明年一定會給，若沒有如實發放，她就退選。\n\
    ~摘改自聯合報《藍白5 度擋下 卓揆嗆釋憲》"
