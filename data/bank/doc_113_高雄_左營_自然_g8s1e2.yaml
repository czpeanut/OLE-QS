  group_stem: "10.情境閱讀題：\n柯南參加一場萬聖節的化妝晚宴。宴會中為了營造恐怖氣氛，會場的白色日光燈管皆以綠色玻璃紙包覆住，且用厚重窗簾遮住窗戶不使外面光線透入。不幸的是卻在現場發生了一起謀殺命案，案發時兇手設計機關使電源斷電後的黑暗期間行兇，但是斷電30\
    \ 秒鐘後被藍色玻璃紙包覆住的緊急照明燈管啟動了。命案發生後柯南立即封鎖現場並經過緊急搶修電源且逐一採證……。以下為三位證人的證詞：\n證人甲：斷電前看見一名穿著綠衣的人走向被害人。\n\
    證人乙：斷電的30 秒中曾用自己帶的紅色雷射筆快速掃過會場，隱約看見一名身穿黑色衣服並手持利刀的人。\n證人丙：緊急照明燈管啟動時看見一名穿著黑色衣服的人快速將兇器丟進垃圾桶內。\n\
    經修復電源後過濾並找出所有與被害人接觸的八位嫌疑人：\n  (A)穿著藍色套裝的男明星       (B)身穿洋紅色套裝的女網紅\n  (C)扮演京劇青衣角色的演唱家\
