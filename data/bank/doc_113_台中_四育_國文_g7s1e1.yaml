- id: doc_113_台中_四育_國文_g7s1e1_s2_13
  section: 2
  number: 13
  type: single
  page: 1
  stem: '夏天是蟬兒吹牛的季節。

    他不知道

    榕樹公公為什麼要撐起大綠傘？

    他不知道

    石榴姐姐為什麼要穿上小紅衫？

    卻站在高高的樹梢大叫：

    知了！

    知了！

    （蔡季男 蟬）

    詩的開頭說「夏天是蟬兒吹牛的季節」，原因為何？'
  options:
  - label: A
    content: 蟬兒的叫聲很誇張，像在吹牛
  - label: B
    content: 蟬兒假裝不畏酷暑，大聲唱歌
  - label: C
    content: 蟬兒站在高處大叫的姿態像吹牛
  - label: D
    content: 因為蟬兒什麼都不知道，卻一再說「知了！知了！」處。
