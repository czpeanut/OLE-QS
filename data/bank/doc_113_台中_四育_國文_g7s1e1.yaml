- id: doc_113_台中_四育_國文_g7s1e1_s2_3
  section: 2
  number: 3
  type: single
  page: 1
  stem: 「酒醉駕車肇事的人是有心殺人嗎？……考試時受不住朋友請託而傳個紙條的是惡意犯規嗎？」無心的錯誤作者連續提出三個問句，其用意為何？
  options:
  - label: A
    content: 勸勉兒子：知過能改，善莫大焉
  - label: B
    content: 提醒兒子：人心難測，不能片面下評判
  - label: C
    content: 要兒子深思：無心也會造成不好的後果
  - label: D
    content: 要兒子警惕：生活處處有陷阱，要隨時提高警覺。
  lesson_raw:
    title: 無心的錯誤
    basis: 題目指明出自無心的錯誤
- id: doc_113_台中_四育_國文_g7s1e1_s2_4
  section: 2
  number: 4
  type: single
  page: 1
  stem: 無心的錯誤文中，作者妻子告訴他留學生開玩笑要劫機卻遭逮捕一事，其用意為何？
  options:
  - label: A
    content: 她認為美國社會仍有種族歧視的現象，令人遺憾
  - label: B
    content: 她擔心兒子也會因他人的煽動而犯下類似的行為
  - label: C
    content: 她感嘆青少年愛開玩笑，又常遊手好閒惹是生非
  - label: D
    content: 她擔憂作者乘坐飛機，會遇上劫機而有生命危險。
  lesson_raw:
    title: 無心的錯誤
    basis: 題目指明出自無心的錯誤
- id: doc_113_台中_四育_國文_g7s1e1_s2_5
  section: 2
  number: 5
  type: single
  page: 1
  stem: 「飄流的雲沒有家，天一陰就急得不住地流眼淚」句中用「沒有家」與「流眼淚」將雲「人性化」，下列選項何者也使用這種寫作手法？
  options:
  - label: A
    content: 深情一眼摯愛萬年，幾度輪迴戀戀不滅（S.H.E.演唱一眼萬年）
  - label: B
    content: 逛公園散步，你木訥得像植物（孫盛希演唱稀有植物）
  - label: C
    content: 聽！海哭的聲音，這片海未免也太多情，悲泣到天明（張惠妹演唱聽海）
  - label: D
    content: 你是太陽，我的星光顯得多黯淡（鄧紫棋演唱透明）。
- id: doc_113_台中_四育_國文_g7s1e1_s2_6
  section: 2
  number: 6
  type: single
  page: 1
  stem: 劉墉曾說：「能不傳話，最好不要傳話；能不套話，最好不要套話。能不涉入『背後的批評』，最好不要涉入。讓自己像沙灘，多大的浪來了也是輕撫著沙灘，一波波地退去。而不要像岩石，使小小的浪也激起高高的水花。」請問文中所提及的說話原則為何？
  options:
  - label: A
    content: 話多不如話少，開口前多動腦
  - label: B
    content: 知無不言言無不盡，想說就說
  - label: C
    content: 四兩撥千金，講話宜避重就輕
  - label: D
    content: 說話是種藝術，著重包裝修飾。
- id: doc_113_台中_四育_國文_g7s1e1_s2_7
  section: 2
  number: 7
  type: single
  page: 1
  stem: 母親的教誨一文中，「我母親心裡又悔又急，聽說眼翳可以用舌頭舔去，有一夜她把我叫醒，真用舌頭舔我的病眼。」此處呈現胡母何種形象？
  options:
  - label: A
    content: 具備充分的醫療知識
  - label: B
    content: 對孩子的慈愛與關懷
  - label: C
    content: 深思熟慮，三思後行
  - label: D
