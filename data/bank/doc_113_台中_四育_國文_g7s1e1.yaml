    content: 一「起」擄人勒贖案
  - label: B
    content: 費了一「遭」苦心
  - label: C
    content: 一「道」鼻涕，一包眼淚
  - label: D
    content: 少了一「列」飛機。
- id: doc_113_台中_四育_國文_g7s1e1_s2_24
