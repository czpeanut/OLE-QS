- id: doc_113_台中_四育_國文_g7s1e1_s2_19
  section: 2
  number: 19
  type: single
  page: 2
  stem: 「學生對師長的勸導『一言九頂』，在校園中時有所聞」，「一言九頂」一詞是借用諧音雙關來表達特別的用意。下列選項中何者沒有使用此手法？
  options:
  - label: A
    content: 長輩們苦口婆心的勸告，在他耳裡竟然都成了「廢腐之言」
  - label: B
    content: 謝謝你「開金口」的祝福，這期大樂透的號碼我一個也沒中
  - label: C
    content: 許多青少年迷戀於負面新聞連連的「青春嘔像」，讓人十分不解
  - label: D
    content: 他們愛情長跑十年終成眷屬，但結婚一年就「相敬如冰」，令人慨嘆。
- id: doc_113_台中_四育_國文_g7s1e1_s2_20
  section: 2
  number: 20
  type: single
  page: 2
  stem: 文章裡用來標明語意轉變、聲音的延續，或補充說明的符號，稱為破折號。下列各句破折號的使用，何者不當？
  options:
  - label: A
    content: 噹—噹—噹—，鐘聲響了，學生魚貫進入考場。
  - label: B
    content: 此處山川秀麗—物產豐富，文化多元，人民生活安樂。
  - label: C
    content: 這裡似乎還有一個小問題—也罷，橫豎我們不易做到盡善盡美。
  - label: D
    content: 有出版社為使古籍普及化，除了將其內容改寫成白話外，並為書名添加新標題，如取經的歷險—西遊記，以彰顯該書的特色，使讀者樂於接近。
- id: doc_113_台中_四育_國文_g7s1e1_s2_21
  section: 2
  number: 21
  type: single
  page: 2
  stem: '下是小漢和好友們在通信軟體互傳的訊息。請問何者用字完全正確？

    育琳：我今天真倒黴，不僅沒趕上車，還淋了一身雨。

    小漢：你若跟我搭上同一班車，就會遇到酒醉肇事，差點就回不了家。

    書偉：太可怕了！如果我在現場會非常驚煌！當下你有什麼反應？

    小霖：你一定不會冷默以對，應該會撥打 110 報警吧？'
  options:
  - label: A
    content: 育琳
  - label: B
    content: 小漢
  - label: C
    content: 書偉
  - label: D
    content: 小霖。
- id: doc_113_台中_四育_國文_g7s1e1_s2_22
  section: 2
  number: 22
  type: single
  page: 2
  stem: 關於為學，胡適曾說：「做學問要在不疑處有疑。」這句話的涵義與下列何者最相近？
  options:
  - label: A
    content: 在可疑而不疑者，不曾學，學則須疑
  - label: B
    content: 善學者，假人之長以補其短
  - label: C
    content: 學貴得師，亦貴得友
  - label: D
    content: 學至乎沒而後止。
- id: doc_113_台中_四育_國文_g7s1e1_s2_23
  section: 2
  number: 23
  type: single
  page: 2
  stem: 下列「 」中的量詞，何者使用正確？
