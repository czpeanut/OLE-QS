- id: doc_113_台中_四育_國文_g7s1e1_s4_3
  section: 4
  number: 3
  type: single
  page: 3
  stem: 根據本文，下列敘述何者最恰當？
  options:
  - label: A
    content: 「智慧家庭」的數據資料庫能保護網路隱私
  - label: B
    content: 網路上的瀏覽紀錄、按讚喜好具有商業價值
  - label: C
    content: 只要設好高強度的密碼，就不用擔心個資外洩
  - label: D
    content: 「優化人工智慧」是指電腦全面取代人類工作。
  group_stem: "（二）個資可以吃嗎？給現代公民的網路隱私守則 \n黃哲斌 \n「隱私」是一種多元流動的概念，窗簾代表一種隱私，提款卡密碼是一種隱私，筆電防窺貼片是一種隱私。在我讀高中的年代，「隱私」意謂著上鎖的日記本、父母進房間前先敲門。\
    \ \n  如今在網路上，瀏覽紀錄、按讚喜好、地理位置、基本個資等這些看不到的數據，都是商業可變現、政治可操縱的黑箱資料。 \n  以往，我們常嘲笑將網站密碼設為「1234」或自己生日的朋友，然而，真實世界更幽微：\
    \ \n  你是否知道，Google 的智慧音箱、臉書的語音通話，都被他們錄下來，並交由人力聽取並抄錄，理由是「優化人工智慧」？ \n  你是否知道，YouTube\
    \ 因未經監護人同意，違法蒐集兒童隱私，被美國政府重罰？ \n  你是否知道，看似無關隱私的掃地機器人龍頭 iRobot，執行長一度動念將機器人蒐集的用戶住家平面圖出售作為「智慧家庭」的數據資料庫，後因輿論反彈才作罷？\
    \ \n  這些例子，說明數位時代「隱私」的高度複雜性，更別提，我們點閱特定產品網頁後，不管逛到哪個網站，同一產品廣告如影隨形。未來可能無論我們走到哪裡，戶外廣告牆會自動掃描每個人的眼球，播放符合個人興趣特徵的廣告。\
    \ \n  關於網路隱私，當前最重要的挑戰是，當我們同意使用某一網路服務，形同自願交出私密資料。然而，我們完全不知道，誰可能取得這些資料，又會用在哪些地方？"
