  stem: "高雄市政府 社會局一年一度「美力媽媽推荐徵選」活動開跑囉！為讓大家看見多元的母職角色，及母愛對家庭與社會的貢獻，高雄市設置七種象徵不同美力媽媽精神的獎項供大家推荐，收件到\
    \ 113 年 3 月 7 日(四)，歡迎大家將美力故事說出來。\n這七種代表不同精神的美力媽媽分別如下：\n| 多力媽媽 | 活力媽媽 | 魔力媽媽 |\
    \ 給力媽媽 | 自力媽媽 | 新力媽媽 | 毅力媽媽 |\n| :--- | :--- | :--- | :--- | :--- | :--- | :---\
    \ |\n| 響應政府鼓勵家庭生育人口政策，用心照顧教養三名以上子女的母親。（本獎項受推薦者須為四十九歲以下，以符合鼓勵生育之用意） | 積極規畫自我生涯、勇敢實現自我夢想與創意，給予家庭成員自由發揮空間，並與子女或家庭成員間有良好互動、溝通與瞭解、彼此相互成長，跳脫傳統母職角色者。\
    \ | 父代母職或照顧教養自己／他人子女（例如：祖孫、姑侄、師生、寄養家庭、機構安置教養等關係），且發揮家庭內母職角色功能者。 | 投入心力教養身心障礙子女，堅持不懈且發揮母職的母親。\
    \ | 身處弱勢，卻以積極、樂觀態度面對生活、努力引導家庭方向、克服逆境之清寒或單親家庭的母親。 | 努力適應不同文化生活，致力於家庭、教導子女學習母語，積極參與公共事務奉獻公益，並發揮母職之新住民母親。\
    \ | 致力於家庭照顧，且奉獻公益之母親。（本獎項受推荐者年齡須為六十五歲以上，原住民五十五歲以上） |\n  上述各獎項均接受本市各機關、區公所、學校與公益社福等團體或個人／親友推荐。團體推荐須自行初審後至多推荐三名，個人或親友至多可以推荐一名，歡迎各界踴躍推荐，讓媽媽的多元角色被看見。\n\
