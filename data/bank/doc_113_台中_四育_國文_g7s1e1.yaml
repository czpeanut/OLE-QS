- id: doc_113_台中_四育_國文_g7s1e1_s2_11
  section: 2
  number: 11
  type: single
  page: 1
  stem: 「琦君童年時，有一天晚上發現她存了很久的十塊大洋不翼而飛，她捧著盒子跺腳大哭，還喊著要母親賠。母親說：『哭有什麼用呢？你自己不小心丟的，我也不能賠你呀！』父親則笑著勸母親再給她十塊大洋，母親卻不肯，說：『我不要讓她覺得那麼容易就可拿回她失去的東西。她既肯花那麼長時間耐心存錢，以後仍應該那麼做。』」（改寫自琦君
    煙愁 倒賬）根據這段敘述，下列何者最適合用來說明琦君母親對孩子的教育態度？
  options:
  - label: A
    content: 堅持原則，絕不溺愛
  - label: B
    content: 嚴格苛刻，不容犯錯
  - label: C
    content: 一板一眼，不知變通
  - label: D
    content: 軟硬兼施，寬嚴並濟。
- id: doc_113_台中_四育_國文_g7s1e1_s2_12
