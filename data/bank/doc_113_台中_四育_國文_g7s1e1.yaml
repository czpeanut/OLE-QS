  stem: 母親的教誨一文中，「我母親管束我最嚴。她是慈母兼任嚴父。但她從來不在別人面前罵我一句，打我一下。」請問胡母的管教態度為何？
  options:
  - label: A
    content: 對孩子寵愛有加，縱容犯錯
  - label: B
    content: 對孩子溫柔體貼，以愛心教導
  - label: C
    content: 糾正孩子錯誤，又顧及其自尊
  - label: D
    content: 維護自己顏面，不被人看笑話。
