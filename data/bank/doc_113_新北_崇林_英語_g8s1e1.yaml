    Dear Emma,

    I hope you are doing well! I want to tell you some fun things from my summer break.
    I am in

    Australia now, and I have a great time. The weather here is quite chilly, and
    it even snowed for a

    few days.

    You know what? My uncle took me on a lovely ostrich ride for my birthday. I know
    you might

    think it was unique, but I was really pleased and liked it! I also took some pictures
    and will show

    you when I go back to school.

    People in Australia speak differently, too. They speak Australian English. When
    I went to the

    supermarket, I heard someone say, “Can I get some veggies?” but not “vegetables.”
