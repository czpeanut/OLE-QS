- id: doc_113_高雄_鼎金_社會_公民_g8s1e3_s1_42
  section: 1
  number: 42
  type: single
  page: 1
  stem: 毓縉未來想在政府機關工作，趁著環島的行程到各級地方政府去參觀其行政與立法機關。請問：下列地方行政機關與地方立法機關的配對，何者正確？
  options:
  - label: A
    content: 斗六市政府—斗六市議會
  - label: B
    content: 台中市北屯區區公所—台中市北屯區區民代表會
  - label: C
    content: 土庫鎮公所—土庫鎮民代表會
  - label: D
    content: 嘉義市政府—嘉義縣議會。
- id: doc_113_高雄_鼎金_社會_公民_g8s1e3_s1_43
  section: 1
  number: 43
  type: single
  page: 1
  stem: '伯安、伯羽、楷育三人的居住地資料如附表，近日三人分別向當地選出的民意代表陳情，希望他們能反映民情。請問：根據右表資料判斷，此三人所陳情的對象，最可能分別為下列何者？


    | 居民 | 居住地 |

    | :--- | :--- |

    | 伯安 | 台南市 |

    | 伯羽 | 基隆市 |

    | 楷育 | 澎湖縣馬公市 |'
  options:
  - label: A
    content: 甲：市議員，乙：立法委員，丙：市民代表
  - label: B
    content: 甲：市議員，乙：市民代表，丙：立法委員
  - label: C
    content: 甲：立法委員，乙：市民代表，丙：市議員
  - label: D
    content: 甲：市民代表，乙：市議員，丙：立法委員。
- id: doc_113_高雄_鼎金_社會_公民_g8s1e3_s1_44
  section: 1
  number: 44
  type: single
  page: 1
  stem: 心潔想在寒假時與好友一同旅遊，於是上網瀏覽觀光資訊。請問：下列她所瀏覽的四個景點中，哪一個地方的層級與其他三者不同？
  options:
  - label: A
    content: 「魚池鄉」的日月潭
  - label: B
    content: 「蘇澳鎮」的白米木屐館
  - label: C
    content: 「花蓮市」的松園別館
  - label: D
    content: 「台東縣」的紅葉少棒球博物館。
- id: doc_113_高雄_鼎金_社會_公民_g8s1e3_s1_45
  section: 1
  number: 45
  type: single
  page: 1
  stem: 我國政府分權是依照均權制度，並依據事務的性質畫分職權，凡事務具有全國一致之性質者，屬於中央權限。請問：下列何者屬於中央政府所管轄之事務？
  options:
  - label: A
    content: 規畫環潭自行車觀光步道
  - label: B
    content: 規畫大學免試入學方案
  - label: C
    content: 協助弱勢家庭申請社會救助
  - label: D
    content: 舉辦虱目魚文化節系列活動。
- id: doc_113_高雄_鼎金_社會_公民_g8s1e3_s1_46
  section: 1
  number: 46
  type: single
  page: 1
  stem: 各級地方政府作為民眾尋求協助的第一線政府，每天都影響民眾日常生活的品質。請問：允玟已滿14 歲了，可以辦理身分證，她應該要到區公所的哪一個單位辦理？
  options:
  - label: A
    content: 稅捐稽徵處
  - label: B
    content: 戶政事務所
  - label: C
    content: 社會人文課
  - label: D
    content: 役政災防課。
- id: doc_113_高雄_鼎金_社會_公民_g8s1e3_s1_47
  section: 1
  number: 47
  type: single
  page: 1
  stem: 承上題，允玟的同學牧岑，因應冬天到來，為讓身體獲得足夠的保護力，去衛生所接種流感疫苗，請問：此事務應屬於地方政府的哪一項職權？
  options:
  - label: A
    content: 安全衛生
  - label: B
    content: 教育文化
  - label: C
    content: 社會福利
  - label: D
    content: 經濟發展。
  group_stem: （第 46 題）各級地方政府作為民眾尋求協助的第一線政府，每天都影響民眾日常生活的品質。請問：允玟已滿14 歲了，可以辦理身分證，她應該要到區公所的哪一個單位辦理？
- id: doc_113_高雄_鼎金_社會_公民_g8s1e3_s1_48
  section: 1
  number: 48
  type: single
  page: 1
  stem: 據報載，高雄市人口數下滑，市府統計，截至2022 年5 月底止，高市扣除原住民後區域人口跌破270 萬人，以此推算，年底民意代表選舉席次，第7、8
    選區將各少1 席，但第4 選區因人口增長，將增加1 席。請問：上述報導中所指稱的地方民意代表，應為下列何者？
  options:
  - label: A
    content: 區民代表
  - label: B
    content: 立法委員
  - label: C
    content: 市議員
  - label: D
    content: 里長。
- id: doc_113_高雄_鼎金_社會_公民_g8s1e3_s1_49
  section: 1
  number: 49
  type: single
  page: 1
  stem: 我國制定《公民投票法》，主要是讓人民可以直接參與公共政策的決策與法案的制定。請問：下列有關公民投票流程何者正確？
  options:
  - label: A
    content: 提案→人民連署→公告→投票
  - label: B
    content: 人民連署→提案→公告→投票
  - label: C
    content: 提案→投票→人民連署→公告
  - label: D
    content: 投票→提案→人民連署→公告。
- id: doc_113_高雄_鼎金_社會_公民_g8s1e3_s1_50
  section: 1
  number: 50
  type: single
  page: 1
  stem: 小宴將選舉過程整理列出下列四項，請問：下列何者錯誤？
  options:
  - label: A
    content: 第一項：候選人須向選務機關辦理參選登記
  - label: B
    content: 第二項：候選人舉辦競選活動有規定期間
  - label: C
    content: 第三項：攜帶國民身分證（可用健保卡取代）、印章、投票通知單，前往投票
  - label: D
    content: 第四項：投票所計票結果交由內政部統計後公告。
- id: doc_113_高雄_鼎金_社會_公民_g8s1e3_s1_51
  section: 1
  number: 51
  type: single
  page: 1
  stem: 冠云去年研究所畢業後便出國留學，但去年（2024 年）適逢四年一次的總統大選，為了不想錯過此次選舉，冠云竟然要剛從高中畢業的妹妹亞云代替自己去投票。請問：冠云的做法違反了選舉的哪一項原則？
  options:
  - label: A
    content: 普通
  - label: B
    content: 平等
  - label: C
    content: 直接
  - label: D
    content: 無記名。
- id: doc_113_高雄_鼎金_社會_公民_g8s1e3_s1_52
  section: 1
  number: 52
  type: single
  page: 1
  stem: '柏昇在考前與讀書會的成員討論「單一選區兩票制」的內涵。請問：哪位同學的觀念正確？


    | 姓名 | 內涵 |

    | :--- | :--- |

    | 東勝 | 單一選區是每一選區只選出一名區域立委 |

    | 品洋 | 會拿到兩張選「黨」的選票 |

    | 祐樂 | 當選者負責施政，管理國家事務 |

    | 姵渝 | 不分區立委由各選區最高票者當選 |'
  options:
  - label: A
    content: 東勝
  - label: B
    content: 品洋
  - label: C
    content: 祐樂
  - label: D
    content: 姵渝。
- id: doc_113_高雄_鼎金_社會_公民_g8s1e3_s1_53
  section: 1
  number: 53
  type: single
  page: 2
  stem: 請問：為了讓國家民主政治的運作更加健全，選舉更加乾淨、公平，下列選民的何種態度較為正確？
  options:
  - label: A
    content: 只要候選人表現傑出，即使賄選也沒有關係
  - label: B
    content: 不實的造謠、抹黑手法為選舉必勝的策略
  - label: C
    content: 選民應珍惜手中神聖的一票，選出有能力的人為民喉舌
  - label: D
    content: 選舉的目的是要選出擁有卓越選舉技巧的候選人。
- id: doc_113_高雄_鼎金_社會_公民_g8s1e3_s1_54
  section: 1
  number: 54
  type: single
  page: 2
  stem: 彥良表態參選下一屆高雄市市長的選舉，請問：彥良須具備下列那些條件方能參選？
  options:
  - label: A
    content: 年滿30 歲
  - label: B
    content: 戶籍設籍高雄市四個月以上
  - label: C
    content: 未受監護宣告
  - label: D
    content: 以上皆是。
- id: doc_113_高雄_鼎金_社會_公民_g8s1e3_s1_55
  section: 1
  number: 55
  type: single
  page: 2
  stem: 下列關於桃園市的層級敘述，何者正確？
  options:
  - label: A
    content: 升格後，所有的區都是地方自治團體
  - label: B
    content: 升格後，與臺中市屬於同一層級的地方自治團體
  - label: C
    content: 原鄉（鎮、市）改為「區」後，區長全由市長派任
  - label: D
    content: 落實民意政治，原「鄉（鎮、市）民代表會」保留。
  group_stem: '行政院2013 年1 月3 日通過桃園縣升格直轄市案，正式升格為「桃園市」。

    民政局請民眾配合於升格後，再將「區」字遮蓋於門牌「鄉、鎮、市」上面，以符

    合升格現況。立法院在 2014 年三讀通過公職人員選舉罷免法修法，增列直轄市

    山地原住民「區民代表」及「區長」選舉。新增的直轄市山地原住民區代表及區長

    分別是新北市烏來區、桃園市復興區、臺中市和平區、高雄市那瑪夏區、桃源區、

    茂林區。為落實保障原住民族政治參與的精神，並積極回應原住民社會意見，享有

    地方自治權限。'
  shared_asset: g1_55_56
- id: doc_113_高雄_鼎金_社會_公民_g8s1e3_s1_56
  section: 1
  number: 56
  type: single
  page: 2
  stem: 下列有關直轄市山地原住民區的敘述，何者正確？
  options:
  - label: A
    content: 享有地方自治團體的地位
  - label: B
    content: 區長可以自行決定是否放颱風假
  - label: C
    content: 行政機關為區民代表會，立法機關為區公所
  - label: D
    content: 區長不是直轄市市長派任，故不用執行市政府的委辦事項。
  group_stem: '行政院2013 年1 月3 日通過桃園縣升格直轄市案，正式升格為「桃園市」。

    民政局請民眾配合於升格後，再將「區」字遮蓋於門牌「鄉、鎮、市」上面，以符

    合升格現況。立法院在 2014 年三讀通過公職人員選舉罷免法修法，增列直轄市

    山地原住民「區民代表」及「區長」選舉。新增的直轄市山地原住民區代表及區長

    分別是新北市烏來區、桃園市復興區、臺中市和平區、高雄市那瑪夏區、桃源區、

    茂林區。為落實保障原住民族政治參與的精神，並積極回應原住民社會意見，享有

    地方自治權限。'
  shared_asset: g1_55_56
- id: doc_113_高雄_鼎金_社會_公民_g8s1e3_s1_57
  section: 1
  number: 57
  type: single
  page: 2
  stem: 新北市全力打造「全臺借書最強卡」，繼 2017 年與基隆市、2018 年與臺北市展開閱讀資源共享的區域合作後，2019 年持續將閱讀服務向南延伸到桃園市，透過四縣市的跨域合作，來營造北北基桃的閱讀生活圈。未來只要透過一張借書證，就可以互相借閱四市圖書，給予民眾
    2,000 萬本書的多元選擇，將有近千萬的民眾可受惠。有關該措施所反映出的地方政府職權，下列何者最為正確？
  options:
  - label: A
    content: 此政策為教育文化項目，是中央政府的權限
  - label: B
    content: 透過跨區域合作的方式，可以擴大圖書資源
  - label: C
    content: 資源共享法律上只限於同一生活圈的北北基
  - label: D
    content: 此為跨縣市的區域合作，需由中央政府推動。
