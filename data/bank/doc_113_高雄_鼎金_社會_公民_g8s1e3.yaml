- id: doc_113_高雄_鼎金_社會_公民_g8s1e3_s1_58
  section: 1
  number: 58
  type: single
  page: 2
  stem: 在 2018 年底的大選與公投正如火如荼開票時，竟有網友公然在網路上發文，亮出自己公投圈票的照片，其廢票意圖明顯。該名網友必須了解哪項選舉投票的原則，以免再犯？
  options:
  - label: A
    content: 普通原則
  - label: B
    content: 平等原則
  - label: C
    content: 直接原則
  - label: D
    content: 無記名原則。
- id: doc_113_高雄_鼎金_社會_公民_g8s1e3_s1_59
  section: 1
  number: 59
  type: single
  page: 2
  stem: '志傑在查詢選舉原則時，看到如圖一段文字敘述。根據圖中的敘述，這段文字在說明哪項選舉原則？


    基於國民主權原理，具有國籍的公民均應享有選舉權。在此原則支配下，不得以階級、宗教、財產等因素限制人民選舉權，但是基於人民意志的表達，而限制年齡、受監護宣告者的選舉權，仍被允許。'
  options:
  - label: A
    content: 平等原則
  - label: B
    content: 普通原則
  - label: C
    content: 直接原則
  - label: D
    content: 祕密原則。
- id: doc_113_高雄_鼎金_社會_公民_g8s1e3_s1_60
  section: 1
  number: 60
  type: single
  page: 2
  stem: 青年學子為爭取《憲法》保障之人民基本權利，可能上街進行集會活動，例如 1990 年的「野百合學運」。上述青年學子的行為最可能是屬於下列何種概念的展現？
  options:
  - label: A
    content: 權力分立
  - label: B
    content: 政黨輪替
  - label: C
    content: 地方自治
  - label: D
    content: 政治參與。
