  group_stem: "【題組七】請依照文章內容回答第47~50 題\n\n建造月球基地得仰賴小便？   2020 年6 月 VOL:65 期科學少年編輯部\
    \ \n人類首次成功登陸月球後，至今大約過了50年，月球任務也從單純的地表探勘，演變成複雜的標本採集或儀器\n裝設。未來，人類停留在月球的時間更可能愈來愈久。\
    \ \n然而，臨時基地無法應付長時間的月球生活，人類需要一個更長遠的方案，譬如蓋房子。要在月球上蓋一棟房\n子，最基本的問題是建材，你能想像把一棟房子的建築材料從地球送上月球，要花費多少成本嗎？幾乎等於建造一\n\
    座城市的經費！因此，最佳解決方案是「就地取材」。 \n蓋房子需要的混凝土，基本成分是土壤和水，雖然月球土壤目前取之不竭，但由於月球幾乎沒有大氣層，加上\n\
    長時間高溫日照，存在於月球的水分極為稀少。這樣一來，要去哪裡尋找水源呢？ \n沒想到的是，科學家竟然把腦筋動到太空人的膀胱！來自歐洲的研究團隊發現，尿液不僅有機會替代混凝土中\n\
    的水分，當中的尿素還能讓月球土壤更加堅固！ \n一般來說，在調製混凝土時，會加入「強塑劑」來改善混凝土的性能，而研究人員進行模擬實驗時發現，和其\n他的強塑劑相比，添加尿素的月球土壤不但能承受較大的重量，還可長時間維持形狀，歷經八次高低溫循環仍不會\n\
    變形。這相當重要，畢竟月球溫度變化很大，白天高達攝氏120度，夜晚則下降至零下130度。 \n不過研究人員指出，實驗中使用的是尿素與水的混合液，而非人類直接排出的尿液，因此需進一步探討，是否\n\
    能直接利用人類尿液來蓋房子，以及尿液裡其餘成分是否會對月球土壤造成影響。"
