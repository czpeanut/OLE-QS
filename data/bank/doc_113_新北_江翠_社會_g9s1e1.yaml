  number: 5
  type: single
  page: 1
  stem: 巴比倫國王制定的漢摩拉比法典其正文有282 條，以下試舉其中幾條為例：①若自由民損毀任何自由民之子之眼，則應毀其眼。②若自由民損毀自由民奴隸之眼，則應賠償其買價之一半。③若醫生為自由民施行大手術而治癒其疾病，應得十銀。④小商販交給大商人的錢，若沒有收取蓋章的文件，則這些錢就不算數。以上可以看出漢摩拉比法典所記載的思想與內容包含下列者？
