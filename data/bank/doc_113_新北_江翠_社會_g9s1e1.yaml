- id: doc_113_新北_江翠_社會_g9s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 亞述帝國巴尼拔王統治時期，曾派遣學者與抄寫員到帝國各地蒐集、複寫文獻，再將其集中到首都尼尼微的圖書館。然而西元前6 世紀亞述帝國覆滅，尼尼微圖書館被大火所焚毀，但其中的泥板文書因其材質特性反而被遺存了下來，直到十九世紀才被英國考古學家在兩河流域北部庫雲吉克的考古遺址發現。請問尼尼微圖書館所藏圖書應該是使用哪一種文字記載？
