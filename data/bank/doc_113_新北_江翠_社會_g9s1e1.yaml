- id: doc_113_新北_江翠_社會_g9s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 在希臘神話中，潘朵拉是第一位人類女性，她被賦予了極高的美貌和智慧。然而，天神宙斯對於人類的本性心存疑慮，因此將一個盒子交給了潘朵拉，並警告她絕對不可以打開。然而潘朵拉敵不住好奇心的誘惑，最終打開了盒子。在那一瞬間，貪婪、虛偽、誹謗、嫉妒、痛苦、疾病、禍害等不幸的事物瞬間從盒子中釋放出來，蔓延至全世界。當潘朵拉發現後，她趕緊關上盒子，於是人類僅剩下唯一留在盒中的「希望」。從這篇故事中，可以知道希臘神明具有何種特色？
  options:
  - label: A
    content: 超然物外，不加以干涉世俗
  - label: B
    content: 寬容大愛，普渡眾生達到解脫
  - label: C
    content: 神愛世人，信我者得永生
  - label: D
    content: 七情六欲，積極干預人間的事務。
