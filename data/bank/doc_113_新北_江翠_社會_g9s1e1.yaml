  stem: 一位法學家說道：「羅馬曾三次征服世界，第一次是以武力，第二次是以宗教，第三次是以法律。而第三次征服也許是其中最為和平、最為持久的征服。」若想印證這位法學家的說法，可以舉下列何者為例？
