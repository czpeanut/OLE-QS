  - label: A
    content: 雅典的民主政治強調人人平等，人民皆能參與政治
  - label: B
    content: 現代的民主政治是由公民抽籤，輪流擔任政府官員
  - label: C
    content: 雅典的民主政治，婦女、奴隸皆無法表達意見
  - label: D
    content: 現代的民主政治無分男女或兒童，均有投票權。
