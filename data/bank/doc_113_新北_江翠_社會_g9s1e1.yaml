  group_stem: "※以下短文節錄自死者之書，請回答第9~10 題：\n    噢！讚美您！偉大的神，正義與真理的主宰。我的主宰，我被帶到此地，來到您的面前，瞻仰您美麗的神采，並接受您的審判。\n\
    \  我來到您面前，我曾為您彰顯正義，我曾為您消滅欺詐罪惡。我不曾對人行惡，我不曾虐待牛隻，我不曾在神廟中褻瀆神靈，我不曾知道人不該知道之事，我不曾行惡，我不曾蓄意製造聲譽，我不曾對神口出惡言，我不曾對窮人施暴……我不曾偷竊神的牛隻，我不曾阻攔神的遊行。我純潔無瑕！我純潔無瑕！"
