  group_stem: "※請根據以下短文回答第11~13 題：\n    羅馬帝國建立後，為了保護其帝國人民安危，在西元一到三世紀期間陸續在其邊界建造許多短邊牆，用於邊境防禦工事。其中哈德良長城更於1987\
    \ 年被聯合國教科文組織列為世界文化遺產(後加入安東尼長城)，哈德良長城與安東尼長城亦象徵著羅馬帝國擴張的最北界。\n    到了西元四世紀末，羅馬帝國受到「外族」的威脅，作為抵禦「外族」南下入侵的邊界長城似乎沒有發揮多少作用，最終使帝國西半部疆土淪喪。然而東半部卻城市興起，首都更成為聞名世界的大都市，地理位置優越，東西方貿易繁盛，甚至維持了長達一千年的統治，不但成為重要的屏障，更保存許多重要的古典文獻，為西方文化的發展奠定重要基礎。"
