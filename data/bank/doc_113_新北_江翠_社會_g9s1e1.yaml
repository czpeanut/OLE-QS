  group_stem: '「青年安心成家購屋優惠貸款」為鼓勵自住，協助青年購屋，政府於2023 年再開辦新青安貸款專案，減輕民眾居住負擔，為住宅政策之一。主要是從健全住宅租售市場、提供多元居助協助及提升居住環境品質。新青安貸款提供多項購房優惠措施，為房市帶來了買氣熱潮，但也導致亂象頻傳，衍生出貸後轉租、人頭戶等問題。房貸量衝太高，銀行紛紛祭出史上最嚴「限貸令」，申請限制增加、調升利率、放款時間延長，甚至多家銀行傳出年底前暫停收件，可能對房市造成不小衝擊。

    (摘自天下雜誌2024-08-26)'
