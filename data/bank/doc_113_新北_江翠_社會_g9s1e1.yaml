  stem: 印度北方出身種姓制度最低層賤民階級達利特(Dalit)的16 歲少女疑遭2 名男性輪流性侵後縱火焚燒。不到一週前，一對姐妹也疑遭6 名男性侵殺害，掛屍樹上。在印度，針對女性的犯罪率很高，以賤民階級為對象的性暴力案件也高得不成比例(聯合新聞網2022.09.20)。以下關於種姓制度與其來源宗教的敘述何者正確？
