- id: doc_112_高雄_大樹_國文_g8s1e2_s6_5
  section: 6
  number: 5
  type: single
  page: 6
  stem: 下列何者不是影響導線電阻大小的因素？
  options:
  - label: A
    content: 粗細
  - label: B
    content: 長度
  - label: C
    content: 重量
  - label: D
    content: 材質。
  group_stem: '＊(丙) 「你的神經怎麼這麼大條！」神經很大條是形容一個人反應老是慢半拍，但事實真是如此嗎？讓我們從神經生理學以及電學的角度來看。動物身體的協調要透過神經系統正確地傳遞訊息，它的基本單位是神經細胞，而神經細胞多具有很長的神經纖維，神經細胞接收訊息後，透過神經纖維將訊息傳遞出去，而神經纖維在傳遞訊息時，需要透過細胞膜電位的改變（電位差），而產生電流，神經傳導即是透過電流而傳出去的。

    大家應該都有用過電燈泡的經驗，臺灣地區的電壓是110伏特，將電器的插頭插上插座，插座提供了110伏特的電位差，於是產生了電流，經由電線傳到電燈泡而發光。如果這條電線的阻力（電阻）很大，電流便很難通過而消耗較多的電能，電燈泡的亮度就會較暗；相反地，如果電線的電阻很小，則電能耗損率較小，電燈泡的亮度會較亮。至於影響電阻大小的因素包括了電線的材質、長度以及粗細。當電線的材質相同，長度也相同，只考慮粗細大小時，電線越粗電阻越小。所以使用越粗的電線，電能損失越少，導電效果越佳。

    而俗話說的很大條的「神經」，其實指的就是神經纖維，它扮演「電線」的角色，在傳導過程當中，當然也需要考慮到「神經」的電阻，因此神經越大條，表示「電線」越粗，電阻越小。所以事實上「神經很大條的人」，反應應該很敏捷才對。'
