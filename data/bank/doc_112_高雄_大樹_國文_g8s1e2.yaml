  group_stem: '(甲) 世界衛生組織在今年年初將電玩遊戲成癮正式列為精神疾病，相關規定即日起生效，世衛將通知各國提出成癮防治對策；衛福部表示，我國已將電玩成癮視為精神疾病，只是還沒有健保診斷碼，未來不排除跟進。

    世衛指出，電玩成癮症狀包括無法控制地打電玩、將電玩置於其他生活興趣前，且即使有負面後果，依然持續或增加打電玩的時間，相關行為要持續至少十二個月才能確診；若症狀嚴重，確診前的觀察期可縮短。

    衛福部心理及口腔健康司長諶立中表示，國內健保診斷碼尚未有電玩成癮症這項，若醫師確診孩子有成癮現象，會以焦慮症、憂鬱症或衝動控制障礙等診斷替代。我國採用世衛的診斷分類系統，待最新版國際疾病分類翻譯更新，就可能納入。行政院也曾要求衛福部報告國內的電玩成癮問題，但報告完後因未重視電玩成癮危害，並無後續成癮防治作為。諶立中坦言，曾考慮參考韓國的「灰姑娘條款」，規定十八歲以下兒童和少年，午夜十二點到早上六點不能玩電玩，但這需要使用者實名制及業者配合，更需要全民凝聚共識，才可能訂出辦法來管理。柯慧貞說，若電玩遊戲有附加的經濟效益，政府更應同時注意全民的健康發展，進而提出配套措施。例如國家可靠生產酒精賺錢，但也要管制十八歲以下青少年飲酒，同時推動酒精成癮防治，「電玩也應如此才是。」'
