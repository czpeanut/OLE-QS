  - label: B
    content: 小樹是知名的觀光盛地，那裏有一座有著各類書藉的美麗圖書館，還有終年煙霧遼繞的迷幻谷公園，景色相當儀人。
  - label: C
    content: 退休的郭老師平常省吃檢用，日子過得並不富欲。但他揭盡心力的幫助他人，屢次為學校幕款，希望能幫助弱勢學童。
