- id: doc_113_新北_福和_社會_地理_g8s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 「遙遠地方的事情，雪山、帳篷、駿馬、牧人，這些事情對於生活在鋼筋水泥叢林裡的都市人來說，天然就有一種吸引力。《羊道三部曲》是一部描摹哈薩克民族逐水草而居，隨季節變化於不同高度轉場的故事。『羊道』，是哈薩克牧民生命中必經的道路，是大自然給他們安排的艱辛壯闊的遷徙之路。他們盛裝跋涉在祖先的道路上，完成自己的一生，青春、衰老、貧窮、愛情……他們是真正的『在路上』。作者以質樸而又充滿靈性的筆觸，記述了作者跟隨中國的哈薩克族一家人，歷經寒暑，在粗獷蒼茫的新疆阿勒泰山區游牧生活的日子。」請問：根據上述書籍的導讀文章判斷，作者所描述地區的氣候環境應為下列哪一張圖？
