- id: doc_113_新北_福和_社會_地理_g8s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 請問：文中所指的動物是什麼？分布於圖（九）中何處？
  options:
  - label: A
    content: 犛牛，甲地
  - label: B
    content: 駱駝，乙地
  - label: C
    content: 犛牛，丙地
  - label: D
    content: 水牛，丁地
  group_stem: 生活在中國最高海拔的哺乳動物，從頭到尾巴都長滿了抵禦寒風低溫的長毛，其毛皮可做成帳篷、衣物、靴子等。耐重的特性，更成為當地居民載運物資的最佳助手。其肉可食，可以做成各式美味可口的佳餚，像是肉乾、血腸等。其奶可飲，除了直接作為牛奶跟奶茶飲用，也可以製成酸奶、酥油或各式奶酪。其糞可燃，在茫茫白雪的大地上，保暖成為了最重要的事情，缺乏樹木生長的高寒地帶，居民們會將新鮮的糞與麥稈混勻，貼到石頭或牆上曬乾，曬乾後的糞不易碎裂且能持久燃燒，不僅解決當地缺乏燃料的問題，更是保護了生態環境。
