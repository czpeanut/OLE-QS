  options:
  - label: A
    content: 平台對使用者發布的內容完全無權管理
  - label: B
    content: 社群媒體所造成的影響力沒有想像中大
  - label: C
    content: 使用媒體的閱聽人應對內容具思辨能力
  - label: D
    content: 上傳分享的閱聽人無須負擔任何法律責任。
  group_stem: 'KOL 是 Key Opinion Leader 的縮寫，意思是關鍵意見領袖，代表具有話語權、能發揮影響力的人。在西方國家，KOL 通常是指醫師、教授、專家等「發言足以影響關鍵眾的人」；在台灣，則被網友廣泛使用於
    Facebook、Instagram 等平台有很多追蹤者的網紅。隨著口碑行銷蓬勃發展，越來越多企業捨棄以往砸重金請明星宣傳的方案，改找素人網紅利用社群貼文、線上直播等方式曝曬產品。

    知名的網紅「統神」張嘉航日前因為直言探討黃子佼事件而引發爭議，不只網友嚴厲撻伐，各家廠商也紛紛大動作切割，沒想到統神並沒有因此悔改，還憤而發文「台上謾真是可悲」，表示民眾不去關注更重要的事情，反而在網路上「一條龍式黑我」，只見風波越演越烈，最後
    YT 頻道還被官方移除。

    各類社群媒體平台出現受害者或是波及無辜第三人時，常會辯稱沒有辦法禁止使用者發布內容。但為什麼會有某些社群媒體的用戶常因違反社群守則而被刪除文章呢？網際網路與社群媒體的出現，讓過去「影響力」並不大的人不當行為或惡作劇提升到難以想像的地步。除了社群媒體應承擔社會責任外，身為使用者的閱聽人，也需具備思辨能力才行。請問：'
