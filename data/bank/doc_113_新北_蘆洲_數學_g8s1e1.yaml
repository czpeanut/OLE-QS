- id: doc_113_新北_蘆洲_數學_g8s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '有四位同學想算出 $10.5^{2}$ 的值，他們的方法如下：

    小娟：$10.5^{2}=\frac{21^{2}}{2}$

    小品：$10.5^{2}=10^{2}+0.5^{2}$

    阿惠：$10.5^{2}=(10+0.5)^{2}=10^{2}+2\times 10\times 0.5+0.5^{2}$

    阿明：$10.5^{2}=(11-0.5)^{2}=11^{2}-2\times 11\times 0.5-0.5^{2}$

    如果這四人接下來都沒有計算或其他方面的錯誤，那麼誰的計算過程是正確的?'
  options:
  - label: A
    content: 小娟
  - label: B
    content: 小品
