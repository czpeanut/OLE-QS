  stem: 自紐西蘭被歐洲人殖民後，毛利人逐漸面臨文化與語言消失的危機，1960 年代毛利人開始向政府要求恢復毛利文化，紐西蘭教育體制因而出現變化。1987 年時，紐西蘭政府將英語與毛利語同訂為紐西蘭官方語言，使毛利語得以保存。在小學前教育階段，更是重視毛利語及文化的傳承，透過教學使毛利文化得以保存。上述紐西蘭政府的做法是希望達成何種目標？
