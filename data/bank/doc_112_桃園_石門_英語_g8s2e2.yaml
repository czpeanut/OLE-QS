- id: doc_112_桃園_石門_英語_g8s2e2_s5_43
  section: 5
  number: 43
  type: single
  page: 4
  stem: 43. Why can Tom NOT meet Judy?
  options:
  - label: A
    content: He hates going out with her.
  - label: B
    content: He needs to clean up the house.
  - label: C
    content: He doesn’t like to go out on a rainy day.
  - label: D
    content: He is very busy in the office.
  group_stem: '(Judy is talking to Tom on the phone.)

    Judy: Hello, Tom. Are you ready to come?

    Tom: Sorry, but I can’t go out today.

    Judy: Why not? What happened?

    Tom: It began raining on August 6th, you know. It kept raining very hard for two
    more days, and the water came into our house. I never saw so much rain in my life.

    Judy: I learned about it on TV. Is everything fine?

    Tom: Well, there’s water almost everywhere, and the house is very, very dirty
    now. Luckily, the rain just stopped a few hours ago. Now all my family has lots
    of work to do. That’s why I can’t leave Pingtung for Taipei to meet you today.

    Judy: That’s OK. But the weather report said there will be another typhoon to
    hit Taiwan this weekend, and it will also bring us a lot of rain.

    Tom: Not again!


    begin 開始(過去式為began)

