    DDT(雙對氯苯基三氯乙烷) 被人類大量的使用，在某些瘧疾嚴重肆虐的地區成就了瘧疾消失的奇蹟。然而， DDT 會累積在魚類、植物以及哺乳類的脂肪組織，在整個食物鏈肆虐。白頭海鵰、魚鷹和隼等鳥類吃了受
    DDT 污染的魚後所產下的蛋變得脆弱，使得這些鳥類的數量大為減少，影響程度令人心驚。
