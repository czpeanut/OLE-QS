- id: doc_113_新北_江翠_自然_g8s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '下列有關混合物分離的敘述及分離方法，試問哪個對應是正確？(2-1)

    甲. 晒鹽是將海水中的水分蒸發分離出來，留下食鹽結晶    $\alpha$. 溶解過濾法

    乙. 泡咖啡時，會利用濾紙把咖啡豆渣和咖啡液分離       $\beta$. 蒸發結晶法

    丙. 利用濾紙，將一種彩色筆的色彩，分離出不同的色素     $\gamma$. 濾紙色層分析法'
  options:
  - label: A
    content: 甲—$\gamma$
  - label: B
    content: 乙—$\alpha$
  - label: C
    content: 丙—$\beta$
  - label: D
    content: 以上皆否。
