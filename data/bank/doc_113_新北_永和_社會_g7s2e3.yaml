- id: doc_113_新北_永和_社會_g7s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 「桃園市與臺北市相隔超過30 公里，但近年交通快速發展，除了兩條國道之外，隨著高鐵和桃園機捷的營運，使兩地通勤時間大幅縮短。另外桃園市相對親民的房價，即使加上每日來往的交通費，仍比在臺北市購買兩、三千萬的房子還來得划算，因此吸引許多臺北年輕的上班族，願意選擇在桃園市買房定居。」由上文可知，交通的革新改變了都市的型態，也影響了人口的分布，此一變遷最符合下列何者之敘述？(L5)
  options:
  - label: A
    content: 因都市擴張，提高桃園市人口總數
  - label: B
    content: 呈都市化現象，人口往桃園市集中
  - label: C
    content: 桃園推力強，社會增加率呈現負值
  - label: D
    content: 臺北拉力強，永久性遷移人口變多
