  stem: 不同於「微光行動協會」，衛生福利部有鑑於原、偏鄉或離島地區因地處偏遠、人口分散，導致長照交通接送服務發展不易，特別規劃推動《長照服務資源不足地區交通接送量能提升試辦計畫》。推動的試辦計畫，是立基於原本長照交通接送服務之目的，滿足長照需要民眾的就醫或復健需求之外，也提升原、偏鄉或離島地區民眾使用服務的可近性，並顧及服務提供單位的營運成本考量，期能藉此帶動長照資源不足地區的服務量能。請問這項計畫將可在哪一個角度上解決不公平的現象？(L5)
