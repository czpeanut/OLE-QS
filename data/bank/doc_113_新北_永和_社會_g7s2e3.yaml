  section: 3
  number: 41
  type: single
  page: 5
  stem: 台灣擁有368 鄉鎮，其中的134 個地區因為人口外移、資源失衡，只留下高齡的長輩。這些住在偏鄉的長輩為了每周要復健三次，得走三十分鐘的山路再搭一天僅兩班的公車，對他們而言，每次看病都是一趟翻山越嶺的長征。小鍾在網路平台上看到「微光行動協會」的介紹。指出此協會運用政府長照經費推出接駁專車之外，在網路平台也發起民眾募款。協會訓練當地計程車隊(司機)使之成為偏鄉長輩出門的力量。小鍾決定捐款支持。依上所述實現偏鄉交通上公平正義的方法中，沒有藉由哪一方面的力量來實現？(L5)
