  group_stem: "電動二輪車的發明和發展是一個漫長且持續進化的過程，從最早期的只是小型模型車到現代已發展成電動自行車和電動機車，都為人們提供了便捷、環保的交通選擇。早期在台灣由於平價且不需考駕照就能上路，騎電動自行車的用路人快速增長，成為許多媽媽族、偏鄉學生及外籍移工代步的交通工具。但據交通部在108\
    \ 年統計，當年所發生的3095 起電動自行車事故，當中15 至17 歲青少年就佔了420 人，是所有年齡層中比例最高。政府為了維護道路安全，已將電動自行車將正名為「微型電動二輪車」，並制定了相關的新法規，規定需完成掛牌、投保強制險才可以上路，且未滿14\
    \ 歲不得騎乘、不得擅自改裝、時速上限25 公里，違反者將處最高5400 元罰鍰。\n 修法通過後，首當其衝的是在偏鄉上學的國中生。根據靖娟兒童安全文教基金會在2020\
    \ 年四至五月進行的「兒童電動自行車使用狀況調查」顯示，花蓮縣有近四成五國中生使用電動自行車，人數居各縣市之首，台東縣和嘉義市則排名第二和第三。因此基金會對政府提出應提升偏鄉的多元公共運輸服務，以滿足學生們上學的需求。"
