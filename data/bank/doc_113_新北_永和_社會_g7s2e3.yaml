  section: 3
  number: 46
  type: single
  page: 5
  stem: 由於公立及非營利幼兒園收費低廉及管理上較有保障，因此一直都是家長優先的選項，但能入學的名額有限，所以主要以抽籤來維持其公平性。以下是新北市公立及非營利幼兒園的招生簡章。其中具備身心障礙幼兒、原住民、低收入戶、中低收入戶、特殊境遇家庭及父母、監護人為中度以上身心障礙者，這六類資格者被列為第一順位，不需要抽籤即可入學。對於這樣的安排在家長間有不同的看法，請找出何人的觀念最正確？(L5)
  options:
  - label: A
    content: 在僧多粥少的情況下最公平的方法就是抽籤，這六類家庭卻可以優先入學，就是違反了公平的原則
  - label: B
    content: 公平正義是指對人、對事堅持相同的原則和標準，不偏私，因此這樣順位下簡章的內容違反了公平正義。
  - label: C
    content: 公平是指根據個體的差異，提供不同的資源和支援，在此前提下應讓弱勢者獲得更多的照顧。
  - label: D
    content: 面對社會變遷帶來的不公平處境，只能靠民間團體投入來制訂政策才能提供合理的解決之道
  tags:
