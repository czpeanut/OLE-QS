    content: 大眾多元文化的年代
  group_stem: '請閱讀下列資料後並回答第39~40 題。 (L6)

    《兒子的大玩偶》是上映於民國70 年代的電影，改編自黃春明於民國60 年代撰寫的三篇小說。第一篇講述坤樹為了幫電影院宣傳，化妝成大玩偶四處宣傳。第二篇講述王武雄退伍後，擔任推銷員，公司派遣他跟隨林再發到沿海鄉鎮推銷日本生產的壓力鍋。第三篇則是述說阿發在上班的路途上，不幸被美軍軍官所駕駛的汽車撞斷了雙腿，住進臺北的美國海軍醫院療養。阿發卻因為軍官的賠償，經濟得到不少改善，還吃到遠從美國進口的蘋果，讓鄉下老家北上探望他的好友們都非常羨慕。'
