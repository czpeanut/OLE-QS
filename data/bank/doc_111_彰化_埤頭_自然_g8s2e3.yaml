  - label: C
    content: 甲、乙、丙
  - label: D
    content: 丙、戊
  group_stem: '◎近年來，坊間興起一股自製手工皂的風潮，手工皂標榜較為天然、溫和、不易傷肌膚。手工皂製造的基本原理就是皂化反應，製作時可以選用自己喜歡的油脂、精油等等，並可用反應後剩下的油脂來護膚。雖然自製手工皂比較耗時，但既能客製化，成分也相當清楚，因此仍深受許多人的喜愛。

    禾風國中的自然課也吹起這股風潮，805的阿琪與致勃勃地要製造手工皂，他準備了以下物品：

    材料：(甲)酒精 (乙)植物油 (丙)氫氧化鈉 (丁)水 (戊)食鹽

    器材：燒杯、玻棒、過濾設備、加熱設備'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
