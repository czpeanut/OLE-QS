  stem: 阿信老師想知道大物是不是地球生物，所以趁機取下大物身上的一塊物質想檢驗他身上的化合物是否為有機物，試問可以怎麼判斷呢？
  options:
  - label: A
    content: 放在火上燃燥，如果可燥就是有機物
  - label: B
    content: 溶於水中測導電性，如果可導電就是有機物
  - label: C
    content: 用摺試紙測試，如果為中性就是有機物
  - label: D
    content: 放在酒精燈上加熱，如果有黑色殘留物就是有機物
