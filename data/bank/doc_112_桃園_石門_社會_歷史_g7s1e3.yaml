- id: doc_112_桃園_石門_社會_歷史_g7s1e3_s2_38
  section: 2
  number: 38
  type: single
  page: 4
  stem: 臺灣樟腦的主要產地在何處？
  options:
  - label: A
    content: 南部平原
  - label: B
    content: 中北部山區
  - label: C
    content: 中部海岸
  - label: D
    content: 東部深山
  group_stem: "(二)茶、糖、樟腦是臺灣開港後的三大出口商品，其中樟腦的產量甚至曾高居世界第一。為了爭奪樟腦的利益，清朝和英國還在臺灣打過一場「樟腦戰爭」。樟腦有什麼重要性，值得兩個國家為它爆發戰爭呢？樟腦不僅能當作藥物，到了十九世紀末，也是許多工業產品與無煙火藥的必備原料（賽璐珞）。直到塑膠發明後，樟腦的重要性才逐漸被取代。樟腦須從樟樹樹幹中提煉，樹齡越老的所富含樟腦比例就越多。開港後的臺灣，因北部山區有許多樹齡上千年的樟樹，能產出大量的樟腦，因此被稱為「樟腦王國」。當時少數的外國洋行壟斷了臺灣的樟腦出口，讓中國商人非常不滿，清朝官員於是將樟腦收歸官辦，樟腦一切買賣皆由官方出資，外商須透過腦館才能承購樟腦，禁止民間私熬販售。\n\
    \        但英國商人認為在新的制度下所購得的樟腦成本上升，獲利甚少，仍然私下在民間大量收購樟腦，英國商人必麒麟（William A. Pickering）就是因為在梧棲港收購樟腦，因此和前來緝私的清朝士兵發生了衝突。隨著英國商人和清朝的衝突愈來愈激烈，英國駐臺領事以保護英商為由，請求英國政府派軍艦到臺灣，保護商人的「貿易自由」。清廷派官員和英國人談判，但談判官員對於英國人提出的條件，不敢拒絕，但也不敢同意。英國決定直接通過武力迫使清廷同意。1868\
    \ 年底，兩艘滿載英軍士兵的英國軍艦到達臺灣。兩艘軍艦向安平開炮，摧毀了許多民居和商鋪。隨後英國陸戰隊登陸，擊潰清軍，占領安平。臺灣府城的商人們湊出四萬元的保證金，英軍承諾不炮擊府城，並退出安平。英軍揚言，若清廷再不同意英國提出的條件，將占領全臺灣。清廷只好與英國簽訂《樟腦條約》，賠償英國的損失，放棄樟腦專賣並賠償英商洋行。隔年，更訂「樟腦章程」，明示凡領護照外商，皆得入內山購買樟腦，英國商人得以壟斷臺灣的樟腦貿易。"
