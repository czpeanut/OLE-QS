- id: doc_113_高雄_翠屏_自然_g9s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 道路上常可以看見環保局出動灑水車清洗路面、降低揚塵。灑水車的總質量包含車體及載運水的質量，以下是對灑水車在灑水過程中，關於灑水車的驅動力、總質量、加速度關係的敘述，請判斷哪一個最為合理？
  options:
  - label: A
    content: 灑水車的總質量 m 不變，若灑水車的驅動力 F 保持不變，則灑水車的加速度 a 便可保持不變
  - label: B
    content: 灑水車的總質量 m 逐漸減少，若灑水車的驅動力 F 保持不變，則灑水車的加速度 a 會逐漸減少
  - label: C
    content: 灑水車的總質量 m 逐漸增加，若灑水車要保持加速度 a 不變，則灑水車的驅動力 F 必須逐漸增加
  - label: D
    content: 灑水車的總質量 m 逐漸減少，若灑水車的驅動力 F 保持不變，則灑水車的加速度 a 會逐漸增加。
