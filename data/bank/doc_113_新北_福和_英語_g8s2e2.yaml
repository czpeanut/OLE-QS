- id: doc_113_新北_福和_英語_g8s2e2_s6_42
  section: 6
  number: 42
  type: single
  page: 3
  stem: 'In what order does the writer put his ideas about being on time in the reading?    
    order 順序

    a. Have better relationship with others.

    b. Never miss important information.

    c. Enjoy more time to get ready.

    d. Avoid school punishments.

     avoid 避免'
  options:
  - label: A
    content: d→b→c→a
  - label: B
    content: b→c→a→d
  - label: C
    content: c→b→d→a
  - label: D
    content: c→d→b→a
  group_stem: '(42~44)

    Getting up early can be difficult, but being on time for school is very important.

    When you arrive at school on time, you don’t need to rush. You can sit down, take
    out your books, and prepare for learning. This helps you stay calm and focus better
    on your studies. Starting your day calmly can make learning easier and help you
    do well on tests.

    Teachers often share important messages at the beginning of class. They talk about
    tests, class trips, homework, and school rules. If students are late, they might
    miss these announcements and not know what to do. In other words, arriving on
    time helps students stay informed and prepared.

    Most schools have rules about being late. Sometimes, being late is okay if there’s
    a good reason, like a doctor’s visit. But if a student is late too often without
    a good excuse, they might have to stay after school or do extra homework.

    If you are in the habit of going to school on time, you have a chance to talk
    to your teachers and classmates before class starts. This helps you build stronger
    friendships and communicate better with your teachers. They may begin to trust
    you more. It also improves your learning experience.

    Being on time is more than just showing up — it’s about being ready and responsible.
    If you make it a habit now, you will live a happier and more successful life in
    the future.

     focus 專注  message 訊息  informed 了解狀況的  extra 額外的  communicate 溝通'
  ai_answers:
    gemini: C
    qwen: C
  answer:
  - C
  answer_status: ai_generated
  answer_source: ai:gemini+qwen
