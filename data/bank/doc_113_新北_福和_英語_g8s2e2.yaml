  group_stem: '(48~50)

    BBC News                                                              2025/3/16

    --------------------------------------------------------------------------------------------------------------------------

    At least 34 people lost their lives in the US because of violent tornadoes: Houses
    were out of power, and everything was totally broken.

    The followings are the interviews from three people there:

    "The floor was upside down. We were walking on walls."

    "It was the scariest thing I''ve ever been through - it was so fast, and our ears
    hurt so much."

    "All I could hear was my six-year-old daughter shouting that she didn''t want
    to die."

    ---------------------------------------------------------------------------------------------------------------------------------------------------------

    As we know, tornadoes happened all over the world. There is even a place called
    Tornado Alley. A scientist, Josh Wurman, joined a team to study tornadoes in Tornado
    Alley. One day, the blue sky turned black. A giant cloud came to the team. Inside
    the truck, Wurman watched the storm through his window. Then, the wind made the
    storm spin faster and faster until it looked like a circle. When the circle touched
    the ground, it became a tornado. Wurman’s team came dangerously close to it. They
    spent half an hour watching the tornado move slowly like a soft rope. Suddenly,
    it was gone. But for Wurman and his team, they knew they had a lot of work to
    do---warn people and save lives.

