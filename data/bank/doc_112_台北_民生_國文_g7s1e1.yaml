  stem: 「主啊!感謝你,當初先去的是杜瑞。」關於杜瑞友人的這句話所傳達的訊息,下列解讀何者正確?
  options:
  - label: A
    content: 友人的一雙手因為長年的粗活變得粗糙笨拙,因此感到自暴自棄
  - label: B
    content: 友人在得知學習雕塑過程的艱難後,慶幸當初先去的人不是自己
  - label: C
    content: 友人除了為杜瑞的成就感到欣慰之外,也憾恨自身一事無成
  - label: D
    content: 可看出友人具有犧牲奉獻的精神,以及「成功不必在我」的胸懷。
  group_stem: '(三)

    我曾有過一雙美麗的手。白皙柔軟,十指纖纖,許多人都羨慕、讚賞過,我也深以擁有這樣一雙手為榮。然而,曾幾何時,十指的關節一個個在病魔的侵蝕下逐漸腫大、彎曲、僵硬,變得古怪而醜陋。望著這雙不再美麗的手,我常不免黯然神傷!

    直到我聽到一則有關手的故事。德國的大藝術家杜瑞,從小就有天分,然因家貧,無力拜師,只有去做學徒,他與另一學徒極其友好,兩人都有志到巴黎去學雕塑,卻都限於環境,難展抱負。最後兩人商議,由其中一人做工供另一人留學進修,學成後再彼此交換。對方讓杜瑞先去,可是,幾年後當杜瑞功成名就歸來時,卻發現朋友的一雙手因長年的粗活變得粗糙笨拙,再也無法做精細的雕塑了,杜瑞為之痛心不已。但就在當天夜裡,他卻聽見好友這樣的禱告:「主啊!感謝你,當初先去的是杜瑞。」杜瑞捧著這雙為他犧牲的手,感動得流下淚來。他把這雙手畫了出來,這就是那幅名畫〈祈禱的手〉的來歷。

    蔣故總統經國先生也曾提到,在他小時,蔣公常常訓示他,做人不要掌心向上,向人乞憐,要隨時不忘掌心向下,給人幫助救援。這兩個故事給我極深的啟示。

    雖然我的手不再美麗,但我希望它多學習一點付出的功課,在別人危難時及時伸出援手,但願這也是一雙懂得安慰的手,禱告的手。那麼,就是它的外表再醜陋又有什麼關係呢?

    (杏林子 手的故事)'
