  group_stem: '(二)

    我夢見自己正在小學校的講堂上預備作文,向老師請教立論的方法。

    「難!」老師從眼鏡圈外斜射出眼光來,看著我,說:「我告訴你一件事——」

    「一家人家生了一個男孩,全家高興透頂了。滿月的時候,抱出來給客人看——大概自然是想得一點好兆頭。

    一個說:『這孩子將來要發財的。』他於是得到一番感謝。

    一個說:『這孩子將來要做官的。』他於是收回幾句恭維。

    一個說:『這孩子將來是要死的。』他於是得到一頓大家合力的痛打。

    說要死的必然,說富貴的許謊。但說謊的得好報,說必然的遭打。你……」

    「我願意既不說人,也不遭打。那麼,老師,我得怎麼說呢?」

    「那麼,你得說:『啊呀!這孩子呵!您瞧!多麼……啊唷!哈哈!Hehe!he,hehehehe。』」(魯迅 立論)'
