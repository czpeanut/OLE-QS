- id: doc_113_台中_清水_數學_g7s1e1_s4_1
  section: 4
  number: 1
  type: calc
  page: 2
  stem: (1) 根據表二，臺灣臺北的時間比英國倫敦快了 8 小時，記為 +8。也就是說，如果英國倫敦現在是早上 5:00，再加上 8 小時，就可以得知臺灣臺北時間是
    13:00。請問小澄抵達德國法蘭克福時，此時臺灣臺北的「日期、時間」為何？
  group_stem: '小澄與爸媽在寒假規劃了德國中古世紀城堡之旅。出發之前，他發現航行程表(如表一)上面顯示的是當地的時間，於是，他上網查詢相關各地的國際標準時間(如表二)，方便在台灣的爺爺奶奶更瞭解行程時間。


