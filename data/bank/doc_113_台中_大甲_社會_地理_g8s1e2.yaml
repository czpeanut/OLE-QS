  stem: '酒為人類飲用歷史非常悠久的加工飲品,由植物發酵製成。酒除了作為飲品之外也有醫療、衛生等用途,就像現在把酒精作為簡易殺菌使用一樣,在中世紀歐洲,高酒精濃度的伏特加或白蘭地,即成為防範鼠疫蔓延的消毒藥,或戰場上傷病軍人的治療用藥。因此,酒對文明的發展有其貢獻,對於某些國家甚至有舉足輕重的影響力。


