- id: doc_113_台中_清水_社會_歷史_g9s1e1_s1_32
  section: 1
  number: 32
  type: single
  page: 4
  stem: 上述短文中營建新都的羅馬帝國皇帝應為何人？
  options:
  - label: A
    content: 凱撒
  - label: B
    content: 屋大維
  - label: C
    content: 君士坦丁
  - label: D
    content: 狄奧多西
  group_stem: '西元330年羅馬帝國的皇帝於古希臘的移民城市拜占庭營建新都，395年帝國一分為二，帝國的西半部危機不斷浮現，更受到外族的威脅，最終西半部疆土淪喪；東半部則城市興起、商業發達，首都更成為聞名世界的大都市，扼地中海及黑海的交通咽喉，地理位置優越，東西方貿易繁盛。

    在羅馬帝國西半部淪喪後，東半部的統治仍舊能存在長達一千年，不但成為重要的屏障，更保存許多重要的古典文獻，為西方文化的發展奠定重要基礎。直至十五世紀之際，東半部的統治趨於衰微，君王的管轄範圍僅剩首都及其附近城市，在不斷受到外族的攻勢下，最終首都淪陷，終結了長達一千多年的統治。

    ■資料來源：郭豫斌主編(2007)。圖解世界史。臺中：好讀出版社。'
