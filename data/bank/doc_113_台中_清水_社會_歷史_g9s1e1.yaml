  group_stem: '附圖是阿育王詔令（Edict of Ashoka）的分布地。阿育王詔令是印度孔雀王朝阿育王時代所流傳下的石刻文書，約在前269年至前231年間出現。在孟加拉、尼泊爾至巴基斯坦等地，都曾發現這類的古石刻文書。阿育王詔令是研究孔雀王朝與□□□的重要考古資料。阿富汗的坎達哈（Kandahar），古名Alexandria
