  - label: B
    content: 晉平公自詡為霸王之主，且師曠贊同他的說法
  - label: C
    content: 駮是虎的天敵，晉平公駕駮外出以避開虎的攻擊
  - label: D
    content: 乳虎將駮馬誤認為駮，晉平公卻以為乳虎畏懼自己。
