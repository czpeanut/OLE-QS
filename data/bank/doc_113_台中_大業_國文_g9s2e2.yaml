  section: 1
  number: 2
  type: single
  page: 1
  stem: 「蘭茝蓀蕙之芳眾人之所好，海畔亦有逐臭之夫。」這段話旨意為何？
  options:
  - label: A
    content: 人要適時檢視自己的特殊癖好能否為他人所接受
  - label: B
    content: 世人癖好雖各有不同，但各種事物皆有其喜好者
  - label: C
    content: 結交朋友要留意「近朱者赤，近墨者黑」的情形
  - label: D
    content: 擁有高雅的癖好，往往就能造就良好的人際關係。
