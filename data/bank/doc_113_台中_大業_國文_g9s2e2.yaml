  type: single
  page: 2
  stem: 「古希臘著名演說家戴摩西尼年輕的時候為了提高自己的演說能力，躲在一個地下室練習口才。由於耐不住寂寞，他時不時就想出去蹓躂蹓躂，心總也靜不下來，練習的效果很差。無奈之下，他橫下心，揮動剪刀把自己的頭髮剪去一半，變成了一個怪模怪樣的『陰陽頭』。這樣一來，因為頭髮而羞於見人，他只得徹底打消了出去玩的念頭，一心一意地訓練口才，演講水平突飛猛進。正是憑著這種專心執著的精神，戴摩西尼最終成為了世界聞名的大演說家。」以上關於戴摩西尼訓練口才的故事，可以印證下列何種道理？
