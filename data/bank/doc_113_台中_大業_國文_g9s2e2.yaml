- id: doc_113_台中_大業_國文_g9s2e2_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 「人永遠視眼前的艱辛為最大的艱辛，但事後回顧時，反倒成了美好的往事。」以上這段話的涵義，與下列何者最相近？
  options:
  - label: A
    content: 人總是將艱辛的事情幻想成美好的，藉此來當成努力的動力
  - label: B
    content: 美好的往事只能回味，終究還是要回歸現實面對眼前的艱難
  - label: C
