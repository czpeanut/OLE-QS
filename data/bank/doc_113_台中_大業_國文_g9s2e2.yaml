  stem: 「支公好鶴，住剡東，有人遺其雙鶴。不久鶴翅長欲飛，支憐惜之，乃鎩其翮。鶴高舉不復能飛，乃反顧翅，垂頭，視之如有懊喪意。支公曰：『既有凌霄之姿，何肯為人作耳目玩物？』養令翮成，置使飛去。」關於《世說新語》此文，下列敘述何者正確？
  options:
  - label: A
    content: 「遺其雙鶴」乃某人表達與支公癖好相同，以討好支公
  - label: B
    content: 「鎩其翮」因支公擔心鶴鳥會傷害他人，而摧殘其羽翮
  - label: C
    content: 「如有懊喪意」描述支公見鶴鳥垂頭喪氣，而心生懊悔
  - label: D
    content: 「何肯為人作耳目玩物？」表示支公終能理解鶴鳥天性。
