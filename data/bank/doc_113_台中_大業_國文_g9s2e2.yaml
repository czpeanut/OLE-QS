  group_stem: '幼安弟喜作草，攜筆東西家，動輒龍蛇滿壁，草聖之聲欲滿江西。來求法於老夫，老夫之書，本無法也，但觀世間萬緣，如蚊蚋聚散，未嘗一事橫於胸中，故不擇筆墨，遇紙則書，紙盡則已，亦不計較工拙與人之品藻譏彈。譬如木人舞中節拍，人嘆其工，舞罷則又蕭然矣。幼安然吾言乎？

    黃庭堅〈書家弟幼安作草後〉'
