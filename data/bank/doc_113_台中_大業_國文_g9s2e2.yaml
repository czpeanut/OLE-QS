  group_stem: '伍子胥知公子光之欲殺吳王僚，乃曰：「彼光將有內志，未可說以外事。」乃進專諸於公子光。

    光之父曰吳王諸樊。諸樊弟三人：次曰餘祭，次曰夷眛，次曰季子札。諸樊知季子札賢，而不立太子。以次傳三弟，欲卒致國於季子札。諸樊既死，傳餘祭。餘祭死，傳夷眛。夷眛死，當傳季子札。季子札逃不肯立，吳人乃立夷眛之子僚為王。公子光曰：「使以兄弟次邪，季子當立；必以子乎，則光真適嗣，當立。」故嘗陰養謀臣以求立。

    《史記·刺客列傳·專諸》

    適嗣：即「嫡嗣」，承嗣的嫡子。'
