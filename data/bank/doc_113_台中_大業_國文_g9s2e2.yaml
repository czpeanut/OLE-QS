- id: doc_113_台中_大業_國文_g9s2e2_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 「親愛的孩子，恭喜你考上大學。四十年前大學錄取率只有三成時，『大學生』三個字讓人肅然起敬；但在錄取率往百分百飆升的今天，不管你每科平均不到二十分或超過八十八分，你們都叫『大學生』。看看大陸跟你一樣年紀的孩子，每年考生超過一千萬人，錄取率六成，考題比我們難得多，壓力也大得多。但為脫貧，他們的成就動機像沸騰的水。也許你會說，臺灣是臺灣，大陸是大陸。孩子，政客可以這樣說，他要的是選票；但你不能這樣說，因為這是你的人生。你必須知道世界的真相，世界地圖不是只有臺灣。」這是一位母親寫給孩子的一段話，這位母親的用意為何？
