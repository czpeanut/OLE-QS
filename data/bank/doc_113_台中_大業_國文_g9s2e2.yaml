  stem: '韓信曰：「漢王遇我甚厚，載我以其車，衣我以其衣，食我以其食。吾聞之，乘人之車者載人之患，衣人之衣者懷人之憂，食人之食者死人之事，吾豈可以嚮利背義乎!」（《史記·淮陰侯列傳》）

    嚮：傾向。

