  section: 1
  number: 27
  type: single
  page: 3
  stem: 「在驚嘆手機功能愈來愈符合人性需求之際，我們應開始思考如何『不役於物』，脫離手機的禁錮，讓自己做工具的主人，合理、有智慧的使用它。也許可以回到手機初始的通訊功能，將彼此想表達的心意，急欲溝通的事理，透過科技將聲音如實的傳達給對方。如果感官可以不再局限於眼睛與手指間的距離，而是接收來自周遭親友、社會，甚至是世界的黑暗角落，我們將建立起更廣闊的情感交流，甚至運用通訊科技幫助弱勢。就像一位年僅七歲的女孩凱薩琳，她靠著大人的協助，善用網路通訊的力量，為飽受瘧疾所苦的非洲兒童，募集了數萬頂的蚊帳，甚至透過網路寄信給微軟總裁比爾·蓋茲，使他深深感動，捐獻更多的蚊帳。」關於這篇文章的行文手法，下列分析何者最恰當？
  options:
  - label: A
    content: 闡述勿受控於科技的想法，再舉出善用科技的事例加以佐證
  - label: B
