- id: doc_113_台中_大業_國文_g9s2e2_s1_31
  section: 1
  number: 31
  type: single
  page: 3
  stem: '晉平公出畋，見乳虎伏而不動，顧謂師曠曰：「吾聞之也，霸王之主出，則猛獸伏不敢起。今者寡人出，見乳虎伏而不動，此其猛獸乎？」師曠曰：「豹食駮，駮食虎。夫駮之狀有似駮馬。今者君之出，必驂駮馬而出畋乎？」公曰：「然。」師曠曰：「臣聞之，一自誣者窮，再自誣者辱，三自誣者死。今夫虎所以不動者，為駮馬也，固非主君之德義也。君奈何一自誣乎？」

    畋：狩獵。  駮：傳說中的猛獸。  驂：乘、駕。  誣：欺騙。

    關於這段文字的理解，下列敘述何者正確？'
  options:
  - label: A
