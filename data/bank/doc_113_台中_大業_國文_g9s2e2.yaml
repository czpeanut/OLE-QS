  stem: 〈人不可以無癖〉一文的主旨為何？
  options:
  - label: A
    content: 一個人未來的成就能從自身的癖好中窺知一二
  - label: B
    content: 呈現不同時代的古人所擁有的癖好和生活雅趣
  - label: C
    content: 說明癖好的各種作用，以此勉勵讀者培養癖好
  - label: D
    content: 結交朋友時，須注意對方癖好是否與自己相同。
