  stem: 根據題文，下列哪個敘述最符合學者的觀點？
  options:
  - label: A
    content: 縣市改制恐強化資源分配不均的問題
  - label: B
    content: 縣市改制由各地方政府自行決定
  - label: C
    content: 縣市改制對人民生活的影響弊大於利
  - label: D
    content: 縣市改制後將會減少跨區域合作。
  group_stem: 我國為整合行政資源及均衡區域發展，歷經數次縣市改制，2010 年首度大規模調整，我國直轄市除原有的台北市外，台北縣獨立升格，高雄、台中、台南縣市合併升格，而桃園則在2014
    年獨立升格，確立現行制度。直轄市所占台灣土地面積約30%，但人口數占全台人數的比例卻將近7 成，學者指出，縣市升格後人口、公共資源都集中在直轄市，呼籲各都會區應推動共同生活圈合作，確保縣市資源公平，否則恐邊緣化其他縣市，加劇城鄉差距。學者進一步分析，因「鄉、鎮、市」改制為「區」，雖然此舉能改善地方行政效率及財政收入，但恐違反地方自治的精神，無法符合各地人民的需求，請問：
  answer:
  - A
