  group_stem: '(37~39)

    PONPON’S DIARY

    I went to New Zealand to study English this summer vacation. The most special
    thing for me in New Zealand is its weather.

    I remembered(記得) the day I left(離開) Taiwan. It was 37°C. I wore a T-shirt to take
    the airplane. After arriving(抵達) in New Zealand, I started shaking so hard. I
    almost forgot(忘記) it was winter in the southern hemisphere(南半球)! There are two
    long islands in New Zealand, so the weather can be very different around the country
    and might change quickly every day. My friends in New Zealand liked to joke(開玩笑)
    that you can experience(體驗) four seasons in one day!

    During my stay, I lived in Wellington, the capital city(首都) of New Zealand. The
    average(平均的) temperature(氣溫) was below 10°C. I always brought an umbrella with
    me because July was the main(主要的) rainy season there. We never know when there
    might(可能) be showers(陣雨)! The average temperature in New Zealand goes down when
    we travel south. I visited Queenstown in the South Island in August. It was even
    colder than Wellington. There was heavy snow and the wind was bone-chilling. I
    missed the warm weather in Taiwan so much when I found my cellphone frozen(結凍)
    in the snow.'
