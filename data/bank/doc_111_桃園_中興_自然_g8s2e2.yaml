    content: '11'
  group_stem: '肆、請閱讀下列敘述後，回答(32)～(33)題：

    常溫、常壓下，$CO_{2}$ 以氣態存在，略溶於水，吸入少量 $CO_{2}$ 並不會感覺不舒服，但吸入高濃度的 $CO_{2}$ 時，$CO_{2}$
    會溶解在黏膜和唾液中，形成弱酸性的碳酸，使人感覺到呼吸器官刺痛。常溫下，加大壓力，氣態 $CO_{2}$ 會轉變為液態 $CO_{2}$。液態 $CO_{2}$
    可用來清洗衣物，汙垢溶於液態 $CO_{2}$，使衣物與汙垢分離後，再將壓力降低，使溶有汙垢的液態 $CO_{2}$ 汽化，此方法不需要烘乾的步驟，且分離後的
    $CO_{2}$ 氣體大部分可回收再使用。此種液態 $CO_{2}$ 的清洗法，可取代傳統清洗法中有害或易燃有機溶劑的使用，減少環境的汙染。'
