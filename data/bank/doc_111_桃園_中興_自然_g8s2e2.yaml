- id: doc_111_桃園_中興_自然_g8s2e2_s2_34
  section: 2
  number: 34
  type: single
  page: 4
  stem: 大量的麵粉在桌上不容易被點燃，但若麵粉瀰漫在乾燥空氣的場所中，卻常有燃燒的危險性。下列敘述何者為可能的原因？
  options:
  - label: A
    content: 桌子會吸收熱能讓麵粉不能燃燒
  - label: B
    content: 放在桌上的麵粉已變成麵團，所以不會燃燒
  - label: C
    content: 懸浮的麵粉總表面積大，比較容易接觸氧氣碰撞，反應速率快
  - label: D
    content: 只要是瀰漫在空氣中的粉塵，不管本身是否可燃，都有粉塵燃燒的可能
  group_stem: '伍、請閱讀下列敘述後，回答(34)～(36)題：

    生活中常見可燃性粉塵包括穀物、麵粉、糖、奶粉等，若懸浮在空氣中並接觸到高溫或火源，將會形成粉塵燃燒。發生粉塵燃燒的因素包含顆粒細、濃度高且環境乾燥、有火源。產生可燃粉塵的場所應列為禁火區和防止靜電，並採用良好的除塵設施，避免懸浮粉塵達到最低爆炸濃度，導致粉塵劇烈燃燒而引發爆炸。事故發生時，最有效的滅火劑是水，尤其以霧狀水較佳，既可以熄滅火勢，又可溼潤和驅散未燃燒的粉塵，降低空氣中懸浮粉塵的濃度。不宜用具衝擊力的乾粉、二氧化碳滅火劑，防止沉積的粉塵揚起，引起二次爆炸。然而，若是遇到金屬粉塵事故，如鋁、鎂粉等，遇水反應會使燃燒更劇烈，則禁止使用水滅火。根據上文，試回答下列問題：'
