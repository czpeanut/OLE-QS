  group_stem: "◎題組四：第28~34 題\n心路基金會簡介：  \n    1980 年代，家有心智障礙孩子的父母不僅沒有早期療育的支持，更不敢想孩子成年後的未來，連進小學受國民義務教育都必須排隊等機會，當一再奔走各校發現孩子竟被國家教育制度放棄了，他們不禁思考這樣的環境對孩子是公平的嗎？當時政府對於智能障礙者的權利、保障匱乏，且正值特殊教育法施行細則擬定、殘障福利法（現為身心障礙者權益保障法）修正之時，這群心智障礙孩子的父母們決定站出來，不僅要為自己的孩子爭取權益，更要為其他相同遭遇的孩子及家庭開闢一條好走的路。他們褪去平凡的家庭主婦、公務員或上班族身份，學習發行刊物、投書、組織家長團體，甚至高舉標語上立法院陳情。\n\
    \     民國76 年心路基金會成立，是台灣第一個由身心障礙者家長自立成立的團體，至今心路董事會成員仍以家長為主。從一支電話、一個員工開始，到現在500\
    \ 多位職工團隊，每年服務6,000 位心智障礙者；從提供成年心智障礙者居住服務的社區家園開始，到現在有0-6 歲的早期療育、18 歲以上之職業重建、日間照顧、夜間住宿、社區支持服務、安老服務等完整的專業支持，心路一步一步，堅持為台灣心智障礙者及其家庭提供優良的服務品質，這一條路有家長的淚，更有眾人無私投入的愛。【內文摘自心路基金會官網】"
