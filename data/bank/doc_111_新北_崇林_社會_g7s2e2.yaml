  type: single
  page: 5
  stem: '陳耕元(1905-1958)於1921 年就讀卑南公學校，1925 年進入嘉義農林學校就讀並參加棒球隊，擔任游擊手。嘉農棒球隊的組成，以臺灣本地青年、原住民為主，日本人為輔，一路從臺灣的資格賽過關斬將。1931
    年7 月，嘉農棒球隊代表臺灣前往日本參加甲子園高中棒球錦標賽，獲得亞軍。這批年輕人為自己贏得了「英雄戰場，天下嘉農」的美譽，揚名全臺。1932 年，陳耕元赴日本留學，就讀橫濱商業專門學校，其後回母校嘉義農林學校擔任教師及棒球隊教練。

    下列敘述何者錯誤？'
  options:
  - label: A
    content: 陳耕元在甲子園比賽後赴日本留學，最可能的原因是臺灣的高等教育升學不易
  - label: B
    content: 陳耕元就讀嘉義農林學校時，該校屬於中等教育的職業學校，主要在培養初級的技術人才
  - label: C
    content: 受到日臺共學的同化政策影響，總督府取消小學校、公學校的區別，陳耕元就讀的卑南公學校因而改為南王國民學校(今南王國小)
  - label: D
    content: 球隊中的學生因身分不同，在初等教育時分別就讀不同學校，但都有日語教學
