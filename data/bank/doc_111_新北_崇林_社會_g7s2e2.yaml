  section: 2
  number: 22
  type: single
  page: 2
  stem: 從上述網路民調的結果來看，呈現出公共意見的何種特性？
  options:
  - label: A
    content: 公開性
  - label: B
    content: 不穩定性
  - label: C
    content: 影響性
  - label: D
    content: 差異性
  group_stem: '◎題組二：第22~24 題

    立法院會24 日三讀通過「疫後特別預算」，財政部表示領取新台幣6000 元5 大管道中的登記入帳，3 月27 日起至10 月31 日止，不限身分證統一編號或居留證統一證號尾數，都可線上登記。但根據Youtube
    頻道木炭Charcoal 在25日發起網路民調，以「您是否支持因稅收超徵，而普發6000 元給國民？」為題，徵詢廣大網友是否支持該政策，截至28 日早上7:30，總計有4238
    人參與該投票，有41%的民眾表示支持；27%的網友則抱持不支持，應該要發更多錢的態度；另外剩下32%的參與者則認為不支持，不該普發現金

    支持普發現金的網友表示，「支持，反正錢不發最後也是被某些人拿去自肥」、「想想拿勞退去炒股票，結果慘賠收場，缺口變更大，這讓人怎麼相信政府能妥善運用」、「哪年不超徵的？民進黨把超徵當政績，多棒啊！」、「每次發錢架網站搞宣傳、搞一堆東西花了多少錢」；反對普發現金的人則留言認為，「較好的選擇應該是政策優先」、「政策買票」。

    而對於不少民眾擔憂，登記資料後，會有資料被駭而外洩的問題，因為先前一段時間，才發生內政部資料庫2000多萬筆個資外流事件；財政部針對民眾的擔憂進行強調：全民共享普發現金系統平台符合行政院「高」等級資通系統防護基準的控制措施，相關資訊傳輸及儲存均嚴格加密保護，專案結束後一個月刪除，絕不保存。【2023.3.28
    中央社】'
