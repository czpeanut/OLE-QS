  section: 3
  number: 41
  type: single
  page: 5
  stem: '廣播中傳來政府宣布武官出身的新任總督上任的消息，思思在房間裡靜靜的聽著，客廳中傳來的聲音則是父母親向親戚炫耀自己有多優秀的話語，心中不禁一陣難過。回憶過往，自己雖然成績優秀，但家境清貧籌不出留學的費用，後來雖然得到霧峰林家的資助，得以出國留學，卻沒想到遇上戰爭爆發而被迫提前結束學業回到臺灣。

    考慮思思生活的年代，下列何者可能是她剛回臺後會遭遇到的狀況？'
  options:
  - label: A
    content: 總督府開始施行義務教育，招募大量師資，讓她非常心動
  - label: B
