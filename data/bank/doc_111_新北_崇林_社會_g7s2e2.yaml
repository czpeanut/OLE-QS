  group_stem: '◎題組三：第25~27 題

    桃園市立東興國中師生於1 月28 日至2 月1 日辦理5 天4 夜的跟媽祖行百里健走公益活動，徒步健走為心路基金會「慢飛天使（遲緩兒）」募款。由校長林祺文帶領近70
    位師生及健走團隊，全程採徒步方式參拜苗栗、台中與彰化3地16 座媽祖廟，每位參與健走師生完成1 公里，可獲得企業捐款30 元，總計募得善款18 萬元（包括扶輪社5
