  stem: "根據上述自來水加氯氣的文章，小布和毛毛各自發表的他們的看法:\n  小布:氯氣和水反應產生次氯酸，次氯酸酸在自來水中發生氧化反應，而殺死水裏的病菌。\n\
    \ 毛毛:「自來水中加的氯含量，只要在 0.4 ~ 0.6 ppm左右，就是對人體無害」這表示在 1 公升的自來水中，含有氯含量為 0.4~0.6克就對人體無害。\n\
    根據小布和毛毛的看法，何者合理?"
  options:
  - label: A
    content: 小布說法合理
  - label: B
    content: 毛毛說法合理
  - label: C
    content: 兩者都合理
  - label: D
    content: 兩者都不合理
  group_stem: "飲用水中微生物和細菌，雖經過曝曬、沉澱、過濾等程序，仍無法完全去除，因此消毒是非常重要的處理程序，自來水消毒雖可採用臭氧、氯氣、紫外線等方式達到滅菌的目的，其中最具有效且有延續性消毒能力，以避免輸送及儲存過程中二次汙染發生者僅有「加氯消毒」。\n\
    \    自來水加氯消毒的原理，是讓氯氣與水反應生成次氯酸，次氯酸的強氧化性能殺死水裏的病菌，因此水中次氯酸含量越高，產生的消毒效果越好。\n    自來水中加的氯含量，只要在\
    \ 0.4 ~ 0.6 ppm左右，對人體是無害的，水中的氯氣容易揮發且易為光所分解，於照光或未加蓋情況下，很快即可消散。"
