    content: 由兩次地震震度可知，1時41分的地震釋放較多能量
  - label: C
    content: 由這兩次地震可推論發生的地震規模越大，則地震深度會越深
  - label: D
    content: 比較兩次地震，1時41分的地震對台北、花蓮、台中所造成的搖晃程度較大
