- id: doc_113_台中_向上_自然_g9s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 如右圖所示，將線圈的兩端接於檢流計上，取一棒形磁鐵的N極端迅速插入線圈內，此時檢流計指針向右邊偏轉。下列資料的解釋何者錯誤？
  options:
  - label: A
    content: 當磁鐵插入線圈後靜止不動，此時檢流計指針不偏轉
  - label: B
    content: 磁鐵插入線圈內的速率越快，檢流計指針偏轉角度越大
  - label: C
    content: 若將棒形磁鐵的S極端迅速插入線圈內，又迅速抽出線圈，則抽出線圈時檢流計指針會向左偏轉
  - label: D
    content: 若磁鐵靜止不動，改以線圈靠近磁鐵時，檢流計指針仍然會偏轉。
