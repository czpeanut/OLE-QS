- id: doc_113_台中_向上_自然_g9s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '魯夫和他的夥伴一同去尋找寶藏，經過大洋時遇到暴風雨，最後漂流到一座小島，小島上無人居住且森林茂密，他無法判斷方位，因此從背包拿出指北針，發現無論怎麼擺放，指北針的N極均會指向Ｘ方向，如右圖所示，魯夫和他的朋友討論「地磁北極」和「地球磁場的Ｎ極」後起了爭執。

    魯夫說：「地磁北極」和「地球磁場的Ｎ極」都應該是Ｘ方向。

    索隆說：不對!不對! 「地磁北極」和「地球磁場的Ｎ極」都應該是Ｙ方向。

    娜美說：你們都錯了!「地磁北極」應該是Ｙ方向，而「地球磁場的Ｎ極」在Ｘ方向。

    請問誰的說法是正確的：'
