- id: doc_113_台中_向上_自然_g9s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: '柯南參加科學競賽，桌上僅有下列藥品及器材：如下表(一)

    甲、50mL燒杯 2 個

    乙、10mL量筒1個

    丙、無刻度滴管1隻

    丁、電子天平

    戊、密度1.4g/cm$^{3}$的甲藥粉10g

    己、A液體10mL

    庚、B液體10mL

    辛、水10mL

    液體的相關資料如下表(二)所示

    | 種 類 | A | B | 水 |

    | --- | --- | --- | --- |

    | 密度（g/cm$^{3}$） | 0.7 | 1.6 | 1 |

    | 對甲藥粉的溶解度（g/100g 溶劑） | ＜0.001 | 100 | 5000 |


    競賽規定，只能用桌面上的藥品及器材進行實驗，不可自行添加任何器材或藥品，來幫助實驗的進行。則若要「測量」出5克甲藥粉的體積，應使用下列哪種方法？（25℃，1大氣壓下）'
  options:
  - label: A
    content: 用量筒量取0.1mL的水，加入5g的甲藥粉，配成飽和溶液後，再加入剩餘的甲藥粉，測量水增加的體積，即為5g甲的體積
  - label: B
    content: 用量筒量取 1mL的B液體，加入1g的甲藥粉，配成飽和溶液後，再加入5g的甲藥粉，測量B液體增加的體積，即為5g甲的體積
  - label: C
    content: 用量筒量取10mL的A液體，加入少量的甲藥粉，看到沉澱物後，再加入5g的甲藥粉，測量A液體增加的體積，即為5g甲的體積
  - label: D
    content: 用量筒量取2mL的A液體，加入少量的甲藥粉，看到沉澱物後，再加入5g的甲藥粉，測量A液體增加的體積，即為5g甲的體積。
