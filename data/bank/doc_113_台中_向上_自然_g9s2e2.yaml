- id: doc_113_台中_向上_自然_g9s2e2_s1_33
  section: 1
  number: 33
  type: single
  page: 4
  stem: "「民國103年7月31日深夜，高雄前鎮區因氣爆造成多人死傷，研判為輸送石化工業原料的高壓液管線破裂，造成液態丙烯外洩，揮發成氣體後產生爆炸。丙烯($C_{3}H_{6}$)的分子量小，沸點約為-47℃，加壓成液態後透過鋼瓶或管線輸送。若空氣中的丙烯氣體濃度達2%，有火花就能引爆，且會循著密閉管線燃燒造成連續爆炸。由於丙烯氣體比空氣重，容易沿地勢擴散至較低處，因此若有丙烯外洩，建議民眾勿靠近氣爆區域，並保持在環境上風處。」關於上述報導，下列何者正確?\n\
    \ (C原子量12、H原子量1、O原子量16)"
  options:
  - label: A
    content: 丙烯屬於烴類，常溫常壓下為液態狀
  - label: B
    content: 若有1莫耳丙烯燃燒則需要4.5莫耳的氧氣
  - label: C
    content: 丙烯完全燃燒會產生$CO_{2}$和$H_{2}O_{2}$
  - label: D
    content: 若有丙烯外洩要盡量往低處方向移動，比較不容易有丙烯氣體
