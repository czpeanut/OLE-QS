  group_stem: "千年罕見「血月掩天王星」\n  「血月」雖是月全食，卻可見古銅色的月亮。\n   光在真空中速率皆相同，但在空氣、玻璃中光速變慢，且各種色光速率有了差別。當太陽光通過大氣層時，藍光的波長比較短(在空氣中的波速較慢)，因此容易散射到四方，紅光波長比較長，因此不容易散射，沿著原來的路線前進，此為「血月」的原因。\n\
    \   西元2022年11月8日為月全食，此月全食恰逢「紅月掩天王星」的特殊現象，當日傍晚 5 時到晚間 9 時，月升同時將伴隨月食發生。晚間 19 時 02\
    \ 分，天王星將躲到全食階段的紅月後方，到了 19 時56 分後，天王星才會再度出現。下次要再「血月掩天王星」必須等到西元 4344年 8 月 8 日，也就是說，要再等\
    \ 2322年。"
