- id: doc_113_台中_向上_自然_g9s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: "小謹和阿祥為了更了解電流與磁場的交互作用，於是製作了一個電磁鐵，並在電磁鐵內沿南北方向水平懸掛一導線，將導線接上電源，發現水平導線會往某個方向移動，於是他們兩個各自發表自己的看法:\n\
    \ 小謹說:電磁鐵通電時所產生的磁場向上，使水平導線往西方向移動\n 阿祥說:將電磁鐵的電池組正、負極反接，按下開關後，可見到水平導線移動方向會往東方移動\n\
    根據小謹和阿祥的說詞，何者合理?"
