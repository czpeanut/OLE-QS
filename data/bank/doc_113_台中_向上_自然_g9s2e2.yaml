- id: doc_113_台中_向上_自然_g9s2e2_s1_34
  section: 1
  number: 34
  type: single
  page: 5
  stem: "蛋糕烘焙配方中的泡打粉可使蛋糕體具有蓬鬆口感，若不使用泡打粉，也可以使用小蘇打粉(碳酸氫鈉)與塔塔粉(1:2混合)來替代烘焙用的泡打粉，塔塔粉是酒石酸鉀;為酸性鹽類，烘焙過程中，小蘇打粉受熱會產生氣體和碳酸鈉，小蘇打粉和碳酸鈉跟塔塔粉作用，也會產生氣體，媽媽和姊姊針對此現象發表了他們的看法:\n\
    \ 媽媽:烘焙過程中，小蘇打粉受熱產生氣體及小蘇打粉和碳酸鈉跟塔塔粉作用所產生氣體都是相同的氣體;皆為二氧化碳。\n 姐姐:烘焙過程中，小蘇打粉或碳酸鈉跟塔塔粉作用的反應是屬於氧化還原反應。\n\
    \ 根據媽媽和姐姐的說法，何者合理?"
  options:
