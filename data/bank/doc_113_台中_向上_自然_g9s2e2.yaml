  stem: 將甲、乙兩種不相溶、體積相等且彼此不會發生化學反應的液體，先後倒入圓柱容器中，液面靜止時的情形如下圖(一)。將 a、b、c三個體積相同但材質不同的實心球置入此容器中，可發現這三顆球均不與甲、乙溶液發生化學反應，達力平衡時的情形如下圖(二)
    。若在容器內加入甲液體，使液面上升少許，此時 a 球在容器中的位置也會上升，達力平衡時的情形如下圖(三) ，則下列敘述何者錯誤?
  options:
  - label: A
    content: 圖(一)中，甲液體密度小於乙液體密度
  - label: B
    content: 若 a、b、c 三顆球的密度大小分別為 $D_{a}$、$D_{b}$、$D_{c}$ 則 $D_{a} < D_{b} < D_{c}$
