- id: doc_111_高雄_林園_自然_g7s1e3_s1_27
  section: 1
  number: 27
  type: single
  page: 2
  stem: 下列的呼吸運動方式，何者是利用胸腔的擴大縮小來進行吸氣或呼氣？
  options:
  - label: A
    content: 情緒性呼吸
  - label: B
    content: 自主性控制呼吸
  - label: C
    content: 非自主性控制呼吸
  - label: D
    content: 以上皆是。
  group_stem: "※人的呼吸運動，除了偶有因應特殊狀況而引發的「情緒性呼吸」外，就是「非自主性控制呼吸」和「自主性控制呼吸」兩大類。其中，非自主性控制呼吸是維持生命需求的生理性呼吸，不受意識控制，僅受血液中二氧化碳等化學因素的刺激，由大腦以外的呼吸中樞控制。\n\
    \  至於自主性控制呼吸，則是由大腦意識主動控制胸腔體積的擴大縮小，以進行吸氣或呼氣。因為肋間肌和橫膈都是骨骼肌，是大腦意識可以控制的肌肉，特別是橫膈，如果能練習多利用橫膈換氣（腹式呼吸），這樣，吸氣時，橫膈收縮下降、騰出空間給肺，吸入更多的空氣；呼氣時，橫膈放鬆上升、可以吐出沉滯在肺底部的二氧化碳。這樣的自主性控制呼吸，對人體健康有一定助益，在歌唱、吹奏樂器上，也能提供更充足的氣量。\n\
    \  你今天吸的氧夠嗎？手放在肋骨和肚臍之間肚子上，感受一下橫膈收縮（肚子往下脹）的深深吸氣，想像每個肺泡波波波波地脹大，充滿空氣；然後利用橫膈舒張（肚子往上縮），盡量吐氣。如此反覆幾次，會感受到神清氣爽、腦筋也變清楚許多。原來，有時候我們思考欠靈活，可能只是腦細胞缺氧。下次遇到類似情形時，不妨試試！請根據上文回答下列27～28\
    \ 題："
  answer:
  - D
  answer_source: answer_key_vlm
