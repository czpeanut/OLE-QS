    content: 酒泉、太原、西昌、文昌。
  group_stem: '圖二是中國四個衛星發射中心位置圖，①~④分別是四個中心的資料介紹，請回答第17-20 題：

    ①中國最早建立的綜合衛星發射中心，也是中國目前唯一的載人航太發射場。地勢平坦開闊、人煙稀少，每年約有300 天晴日可進行發射試驗，是發射衛星的理想場所。

    ②地理位置屬較高緯度的高原地區，具有發射極地軌道衛星的良好條件。交通便利且靠近中關村，有利於與首都航太科技控制中心團隊聯繫。

    ③中國目前發射衛星次數最多的發射場，位於橫斷山脈，具備海拔高，雲霧少、地形隱蔽等優勢條件。附近水資源豐富，能滿足發射中心的大量用水。

    ④中國首個濱海發射中心，大幅降低發射後未燃盡殘骸造成意外的機率，航區與落區安全性高。近海港可以海上運輸，火箭箭體直徑不再受鐵路橋梁涵洞限制。'
