  group_stem: 'In 1998, a six-year-old boy in Canada named Ryan found out that many
    children in Africa lived in places _(1)_ did not have clean water. They drank
    dirty water and often got sick. Ryan made up his mind _(2)_ them. He wanted to
    build wells in Africa, so he did work around the house and for his neighbors.
    He washed windows and cleaned floors for four months and made $70. _(3)_, the
    money was less than the cost of digging a well.


    Luckily, a newspaper in Canada reported on Ryan’s efforts to _(4)_ money. People
    there began to send him money. In twelve months, Ryan was able to collect over
    $2,000, and his first well was built in 1999.


    Over the next 10 years, Ryan’s project raised more than $1.5 million from the
    public. The money helped to build over 300 wells, and these wells give clean drinking
    water to half a million people. From Ryan’s project, people can learn an important
    lesson: Even a child can make a big _(5)_ in the world.'
  ai_answers:
