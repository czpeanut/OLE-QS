- id: doc_113_高雄_中山_國文_g8s2e2_s6_23
  section: 6
  number: 23
  type: single
  page: 5
  stem: 「古語說得好：『皇帝不差餓兵』。」根據本文，關於這句話的含義，下列敘述何者正確？
  options:
  - label: A
    content: 藉此說明請人做事時，應滿足其基本的需求。
  - label: B
    content: 頌揚古代皇帝仁民愛物的胸懷，能苦民所苦。
  - label: C
    content: 強調執政者必須有識人之明，懂得用人唯才。
  - label: D
    content: 指出唯有先解決經濟問題，才能使國家強盛。
  group_stem: "罐頭食物相當方便，不僅保存容易，也可以製成各種口味，鹹淡皆宜，隨時可食。相較之下，時下盛行的冷凍食品固然方便，卻受到電源及設備限制，野外活動時就沒有如此便利。罐頭問世約兩百多年，時間不長，卻足以改變人類的生產行為與飲食習慣。原本因保鮮問題無法大量出口的食材，一旦製成罐頭，便可飄洋過海，行銷世界。罐頭價格便宜，尤其受無產階級群眾的歡迎。當年在德國念書時，經常拿東歐牛肉罐頭，擱點五香、八角一燉，便是一鍋牛肉湯，麵條白菜同入，一頓飯就有著落，稱得上物美價廉。\n\
    \ 近代工業發展多先從輕工業做起，食品加工與紡織業算是兩個先行指標，逐漸帶動各種產業的發展。罐頭雖屬食品工業，起初的發展卻不見循此路徑，倒是與軍需工業有關。古語說得好：「皇帝不差餓兵」，自古征戰之際，首先要解決吃飯問題。一般糧食要不就是烹調不易，要不就不耐久放，征戰之際，伙食還真是問題。《水滸傳》中，魯智深到瓦官寺與崔道成、邱道人廝殺，因為「肚裡無食，又走了許多路途」，不敵兩人。幸虧碰到史進，將帶的乾肉燒餅讓魯智深吃個飽，才能回頭打敗崔道成，可見伙食是致勝之道。所以秦末諸雄爭霸之時，項羽下令破釜沉舟，讓軍隊了解，不打勝仗就得挨餓，果然大敗章邯。軍隊飲食影響作戰能力甚大，明矣。一旦軍用不足，或是糧草未至，大軍就必須就食於民，軍事行動中真正能夠做到秋毫無犯者，少之又少，歷史家才會書而榜之。\n\
    \ 歐洲歷史發展中，也有類似問題。近代以前，歐洲盛行傭兵制度，農民生活無著時，只得加入傭兵隊，為錢而戰。十七世紀中期，德意志地區因為宗教衝突，發生三十年戰爭，雙方戰鬥主力都是傭兵隊，一旦雇主供應不上，傭兵隨時倒戈，軍紀敗壞，所到之處，破壞莊稼，民家都得遭殃。這場戰爭中死傷慘重，並不都死於戰鬥，讓各國君主體認傭兵不可靠，才改弦更張，要組訓軍隊，也得思考如何供應軍糧。\n\
    \    一七九五年，拿破崙擔任法國陸軍統帥，下令解決軍隊口糧供應問題，軍方乃懸重賞向民間企業徵求保存食物方案。巴黎的糕餅商阿佩特為此潛心研究。他注意自己販賣的果漿、葡萄酒等食品中，有些玻璃罐密封的食品不易變質，仔細觀察、反覆試驗後，終於在一八0\
    \ 四年揭下榜文，向軍方提出研究心得。他的作法倒也不難：將食材裝入廣口瓶中，置於沸水鍋中加熱三十分鐘以上，趁熱用軟木塞塞緊，再用鐵線固定瓶蓋或用蠟封死，以阻絕空氣，食物便可保藏而不腐，現代罐頭雛形於焉出現。至今歐洲許多家庭自製果醬、兔肉罐頭，仍是沿用此法。無怪乎當年法國軍方一試之後，認為其作法可行，也依諾頒發獎金。\n\
    \  不過玻璃瓶裝的食物，不耐碰撞，玻璃罐自身也有相當重量，長途運送，仍有其局限，軍用罐頭還需進一步發展才行。英國商人杜蘭在法國食品保存技術的基礎上，繼續研究。他把三十多磅的肉品調製處理後，放在鐵皮罐中密封，由英國海軍帶上出航船隻，實況測試。六個月後，船隻返航，罐頭肉質仍然完好，風味未曾改變，英國政府隨即頒發專利。軍用罐頭於焉問世，但初期因飲食習慣改變不易，使用時並不方便，並非廣受歡迎。當時罐頭形制沒有規範，也尚未發展出開罐工具。罐頭一旦交到士兵手中，還得要費一番功夫，刺刀、斧頭全都用上，罐中的食物才能到口。一八五五年時，才有英國人葉慈發明開罐器，解決此一難題。\n\
    \ 罐頭發展初期，售價不菲，也經常有中毒的意外事件傳出，社會大眾普遍不接受這種新式飲食，只有軍隊或是行旅才會購買，還得冒著生命危險。一八六二年，法國科學家巴斯德提出食品腐敗與細菌的關係後，罐頭生產工序改變，高溫蒸氣殺菌可以防止食物腐敗，但是罐頭封口鉛條仍可能導致慢性中毒，防不勝防。一八四五年，英國遠征隊準備大量罐頭食品，前往北極探險，隊員食用鉛條封口罐頭長達三年，都出現鉛中毒的症狀。這事要發生在現代，準是個社會事件。\n\
    眼下各國都重視軍隊伙食，禮聘專家精心設計，講究營養均衡，色香味俱全，還有菜單可供挑選。講起軍隊埋鍋造飯，有幾人能夠體會？\n               \
    \                                                               ( 罐頭由來 周惠民)"
