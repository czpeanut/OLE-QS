- id: doc_113_高雄_中山_國文_g8s2e2_s6_21
  section: 6
  number: 21
  type: single
  page: 4
  stem: 有關陸游「釵頭鳳」的賞析，何者正確﹖
  options:
  - label: A
    content: 「東風惡，歡情薄」，用雙關手法點出兩人愛情悲劇的癥結所在。
  - label: B
    content: 「山盟雖在，錦書難託」說明了兩人對彼此雖仍無法忘情，卻再也不能將相思形諸於文字了。
  - label: C
    content: 從句尾的連用疊字「錯，錯，錯!」「莫，莫，莫!」，可看出陸游認為與唐琬的再次重逢是錯憾一場，不該發生。
  - label: D
    content: 上片的「紅酥手」是描寫唐琬再婚後美麗如昔，下片的「人空瘦」則對比出陸游對於唐琬舊情難忘，因而形銷骨立。
  group_stem: "陸游是宋代著名的愛國詩人，他的詩詞多為憂國傷時之作，風格以豪放為主，但也有一些婉約的作品，如釵頭鳳一 詞，描寫他與唐琬的愛情故事，哀婉悲悽，為大家所熟知。\n\
    \n     陸游二十歲時和唐琬結婚，婚後夫妻鶼鰈情深。但因母親不喜歡這個媳婦，在母命難違下，兩人被迫離婚。後來， 陸游另娶王氏，唐琬則改嫁同郡的士人趙士程。\n\
    \n    十多年後的某個春日，陸游到浙江 紹興城外的沈園遊賞時，和唐琬及其夫婿不期而遇。他想和唐琬說話，但又怕人說閒話，只好悄悄地走到一邊。後來唐琬得到夫婿的允許，為陸游送來了一些酒菜表達關懷，而後就與夫婿離去。陸游想起過去兩人的恩愛，不由悲從中來，於是在沈園的牆上題了一首釵頭鳳：\n\
    \n「紅酥手，黃縢酒，滿城春色宮牆柳。東風惡，歡情薄，一懷愁緒，幾年離索。錯，錯，錯！  春如舊，人空瘦，淚痕紅浥鮫綃透。桃花落，閒池閣，山盟雖在，錦書難託。莫，莫，莫！」\n\
    \n 這首作品寫兩人意外相逢，觸發被迫分離的痛楚；並點出相思的愁苦，往事不堪回首。流露出陸游的深情 與無奈，令人動容。\n    之後，唐琬再次來到沈園，見到陸游這首作品，十分感傷，便依韻和了一首：\n\
    \n 「世情薄，人情惡，雨送黃昏花易落。曉風乾，淚痕殘，欲箋心事，獨語斜闌。難，難，難！ 人成各，今非昨，病魂常似秋千索。角聲寒，夜闌珊，怕人尋問，咽淚裝歡。瞞，瞞，瞞！」\n\
    \n內容哀怨淒楚，流露出她餘情未斷，卻又無法復合的沉痛。幾年後，唐琬抑鬱而卒。 與唐琬的沈園重逢，讓陸游終身縈懷難忘，曾多次到沈園憑弔。去世的前一年，八十五歲的陸游再遊沈園，深情追憶那驚鴻一瞥的倩影，而留下了詩作春遊：\n\
    \ 「沈家園裡花如錦，半是當年識放翁。也信美人終作土，不堪幽夢太匆匆。」\n 這位愛國詩人對唐琬的款款深情至死不渝，真是令人低迴不已。\n        \
    \                                                      ( 改寫自「釵頭鳳」泣訴的愛情悲劇)"
