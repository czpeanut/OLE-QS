  stem: 摹寫可分為視覺、聽覺、味覺、嗅覺、觸覺等，在行文時可透過交錯表現的方式，啟發讀者去聯想和體會文中的意境。例如「聽了她唱完這首歌，我五臟六腑裡像熨斗熨過，無一處不服貼，三萬六千個毛孔，像吃了人參果，無一個毛孔不暢快。」就是以「觸覺和味覺」印象來表現「聽覺」感受。下列各題都運用了感官交錯的手法，何者配對最為正確?
