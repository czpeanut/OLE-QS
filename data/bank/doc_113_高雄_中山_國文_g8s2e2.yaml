- id: doc_113_高雄_中山_國文_g8s2e2_s6_28
  section: 6
  number: 28
  type: single
  page: 6
  stem: 有關「國民法官」的說明，下列何者正確？
  options:
  - label: A
    content: 制定此法的原因是因為人們不相信法律的公正性。
  - label: B
    content: 於2020/7/22 日上午經行政院三讀通過 。
  - label: C
    content: 酒駕若是未致人於死，便不需要國民法官參與。
  - label: D
    content: 「國民法官」組成的法庭可審判任何刑事案件。
  group_stem: '2023 年台灣開始施行國民法官制度，以下為國民法官的概略介紹:

    根據近期司法院民調顯示，有近八成的民眾認為「法官的判決結果和哪些人可以當國民法官，大家想法不一樣」，七成以上的民眾同意「人民和法官共同討論、參與審判」。

    為解決恐龍法官弊病，立法院2020/7/22 日上午三讀通過國民法官法，未來將由職業法官3 人、國民法官6 人組成法庭，共同審判特定刑案，預計在2023 年上路。

    國民法官會參與什麼案件的審判？

    • 最輕本刑10 年以上有期徒刑之罪（如殺人）。

    • 故意犯罪因而發生死亡結果之罪（如酒駕致死）。

    • 除外：少年刑事案件與毒品危害防制條例案件。

    怎麼形成判決？

    如果沒有國民法官與法官雙方的同意，不能判一個人有罪。。

    有罪？無罪？誰來決定？

    有罪要有6 票以上同意，國民法官與法官雙方都要有同意票。

    判重？判輕？如何決定？

    量刑(死刑以外)要有5 票以上同意，死刑要有6 票以上同意。以上國民法官與法官雙方都要有同意票。


    哪些人可以當國民法官?

    可以

    1. 年滿23 歲。

    2. 具有高中以上(含)學歷(或同等學力) 。

    3. 會聽說國語之中華民國國民。

    4. 在地方法院管轄區域內繼續居住四個月以上。


    不可以

    1.曾受有期徒刑以上刑之宣告確定。

    2.褫奪公權(尚未復權)等情形。

    3.正副總統、民意代表、政務人員、現役軍人、警察,以及司法官考試、律師考試及格人員等。


    可拒絕

    1.年滿70 歲以上者。

    2 公立或已立案私立學校的教師、在校學生。

    3.因生活、工作、家庭上的重大需要,以致執行國民法官、備位國民法官職務顯有困難。'
