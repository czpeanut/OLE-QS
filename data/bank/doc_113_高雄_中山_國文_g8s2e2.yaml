    content: 我低下頭去喊自己的名字，井水也大聲應和，連那回聲都彷彿有淡淡的餘香。（鍾怡雯芝麻開門） ─這是用  嗅 覺印象來表現 味 覺感受。
  - label: B
    content: 呼嘯的摩托車聲劃過寧靜的黑夜，尖銳地在我耳膜上劃出一道傷口。（陳克華告別秀姑巒溪）        ─這是用  觸 覺印象來表現  聽 覺感受。
