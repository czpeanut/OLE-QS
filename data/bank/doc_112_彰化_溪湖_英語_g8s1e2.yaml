  group_stem: "Helen Keller was very sick when she was a baby, and when she was back\
    \ in health, she couldn’t see and hear. Because of that, she couldn’t even learn\
    \ to speak. Nobody could teach her manners（禮儀）, so she couldn’t eat at the table.\
    \ She ate with her hands and threw (丟) her food everywhere. She was a terrible\
    \ and unhappygirl then.  \n    When Helen was six years old, Anne Sullivan came\
    \ into her life. Ms. Sullivan started being with Helen 24 hours a day, and taught\
    \ her table manners. At first, Helen didn’t like this teacher at all and even\
    \ fought with her. But Ms. Sullivan never gave up. Helen finally ate with a fork\
    \ and a spoon at the table.\n    Ms. Sullivan also kept teaching Helen words.\
    \ She wrote words with her fingers (手指) on Helen’s hand, but Helen never really\
    \ knew the meaning（意義）.\n    One day, when Helen put her hand under the water,\
    \ Ms. Sullivan wrote the word “water” on Helen’s other hand over and over (一次又一次).\
    \ Helen finally learned the meaning of the word. She was so happy and couldn’t\
    \ wait to learn more (更多) about the world around her. Helen Keller said, “Thanks\
    \ to Ms. Sullivan. She gave me a new life.”"
  tags:
    textbook: 第三冊（八上）第2次段考範圍
    labeled_by: ai
