    \ Ms. Sullivan wrote the word “water” on Helen’s other hand over and over (一次又一次).\
    \ Helen finally learned the meaning of the word. She was so happy and couldn’t\
    \ wait to learn more (更多) about the world around her. Helen Keller said, “Thanks\
    \ to Ms. Sullivan. She gave me a new life.”"
