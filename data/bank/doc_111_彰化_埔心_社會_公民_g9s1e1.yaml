  type: single
  page: 1
  stem: '「草原的悲歌」是指在公共的草原上，有一群牧羊人，每一個牧羊人都想要多獲利一些，所以某個牧羊人就帶了一大群羊來放牧，雖然他知道過度放牧，草地可能承受不起，但是他依然獲利了。而後，所有的牧羊人都跟進，所以草地牧草耗竭，最後大家都必須蒙受其害，悲劇因而發生。

    上文所敘述的現象，最適合用來討論下列哪一經濟學概念？'
