- id: doc_113_新北_江翠_數學_g8s2e2_s3_3
  section: 3
  number: 3
  type: essay
  page: 4
  stem: '如圖，四邊形 $ABCD$ 及四邊形 $AEFG$ 皆為正方形，其中 $E$ 點在 $\overline{AB}$ 上，試說明 $\overline{DE}=\overline{BG}$。（每格
    1 分，共 4 分）［3-3］


    說明：在 $\triangle ADE$ 和 $\triangle ABG$ 中，

    ∵ $\underline{\quad\quad\quad\quad}$ (四邊形 $AEFG$ 為正方形邊長相等)

    ∵ $\underline{\quad\quad\quad\quad}$ (四邊形 $ABCD$ 為正方形邊長相等)

    ∵ $\underline{\quad\quad\quad\quad}$ (四邊形 $ABCD$、$AEFG$ 皆為正方形內角相等)

    ∴ $\triangle ADE \cong \triangle ABG$ ( $\underline{\quad\quad}$ 全等性質)，故 $\overline{DE}=\overline{BG}$
    (對應邊相等)。'
