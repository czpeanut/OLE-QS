- id: doc_112_高雄_大灣_國文_g9s2e2_s2_32
  section: 2
  number: 32
  type: single
  page: 5
  stem: 這首詩中，作者對於事物的源頭看得比常人更遠、更透澈，下列敘述何者無法看出此特色？
  options:
  - label: A
    content: 一粒米的源頭無疑是一座村莊
  - label: B
    content: 我們寫下一個字。／我們已書寫它幾十年；但／從沒探究它所從何來
  - label: C
    content: 一座墳塋的源頭不是躺在它裡面的主人，／而是主人的生前
  - label: D
    content: 一滴淚的源頭不是眼睛，而是心靈。
  group_stem: "一粒米的源頭無疑是一座村莊，\n  儘管它像你一樣，\n  而今在城市中流浪。\n\n  一滴淚的源頭不是眼睛，而是心靈。\n\n \
    \ 一縷風的源頭也許是停歇在\n  華盛頓 越戰紀念碑上的一隻蝴蝶，當它\n  扇動翅膀，\n  靜謐的幼發拉底河掀起巨浪。\n\n  我們寫下一個字。\n\
    \  我們已書寫它幾十年；但\n  從沒探究它所從何來。\n  一個字的源頭，或許比\n  我們的想像力更遙遠，但一定比照臨在\n  我們頭上的陽光更親近。\n\
    \n  一座墳塋的源頭不是躺在它裡面的主人，\n  而是主人的生前。\n\n  一粒黴種的源頭不是它自身的\n  腐爛，而是引起它霉變的環境。\n\n  我沉思我—作為一個「人」的源頭，\n\
    \  星空浩蕩，\n  人世洶湧，\n  我在糾結的血液中追溯我的\n  源頭像追尋莫可預知的未來。（張作梗 源頭）"
