  stem: 「（杜）處士笑而然之」，是因為他了解到什麼道理？
  options:
  - label: A
    content: 牧童純真無邪，所以才口無遮攔
  - label: B
    content: 繪畫首重形似，形似在於多練習
  - label: C
    content: 珍貴的寶物絕非世俗凡人能鑑賞
  - label: D
    content: 仔細觀察是繪畫傳神的必備條件。
  group_stem: "戴嵩畫牛   蘇軾\n  蜀中有杜處士，好書畫，所寶以百數。有戴嵩牛一軸，尤所愛，錦囊玉軸，常以自隨。一日曝書畫，有一牧童見之，拊掌大笑，曰：「此畫鬥牛也，鬥牛力在角，尾搐入兩股間，今乃掉尾而鬥，謬矣！」處士笑而然之。\n\
    \  古語有云：「耕當問奴，織當問婢。」不可改也。（節錄自東坡志林）"
