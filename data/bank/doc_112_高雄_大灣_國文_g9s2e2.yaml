- id: doc_112_高雄_大灣_國文_g9s2e2_s2_38
  section: 2
  number: 38
  type: single
  page: 6
  stem: 由本文判斷，「買命錢」是指下列何者？
  options:
  - label: A
    content: 賣螃蟹的錢
  - label: B
    content: 替螃蟹命名的錢
  - label: C
    content: 買螃蟹的錢
  - label: D
    content: 以性命賺取的錢。
  group_stem: '予於飲食之美，無一物不能言之，且無一物不窮其想像，竭其幽渺而言之。獨於蟹螯一物，心能嗜之，口能甘之，無論終身一日皆不能忘之，至其可嗜可甘與不可忘之故，則絕口不能形容之。此一事一物也者，在我則為飲食中之痴情，在彼則為天地間之怪物矣。予嗜此一生。每歲於蟹之未出時，即儲錢以待，因家人笑予以蟹為命，即自呼其錢為「買命錢」。自初出之日始，至告竣○１之日止，未嘗虛負一夕○２，缺陷一時○３。同人知予癖○４蟹，召○５者餉○６者皆於此日，予因呼九月、十月為「蟹秋」。慮○７其易盡而難繼，又命家人滌瓮○８釀酒，以備糟○９之醉○10
    之之用。糟名「蟹糟」，酒名「蟹釀」，瓮名「蟹瓮」。向○11 有一婢，勤於事蟹，即易○12 其名為「蟹奴」，今亡之矣。蟹乎！蟹乎！汝於吾之一生，殆相終始者乎！
    （節錄自李漁 閒情偶寄‧蟹）

    【注釋】○１竣：音ㄐㄩㄣˋ，完畢。 ○２虛負一夕：此指一天不品嘗螃蟹。○３缺陷一時：此指錯過任何一次品嘗螃蟹的機會。○４癖：音ㄆㄧˇ，嗜好。○５召：邀請。○６餉：送食物給人。○７慮：擔憂、憂愁。○８滌「瓮」：一種口小腹大，用以盛東西的器具。○９糟：以酒醃漬食品。○10
    醉：用酒浸漬。○11向：昔日、從前。○12 易：改變。'
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 國文
      code: 第五課
      title: 人不可以無癖
      chapter: null
