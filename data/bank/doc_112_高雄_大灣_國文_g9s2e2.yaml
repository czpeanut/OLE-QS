- id: doc_112_高雄_大灣_國文_g9s2e2_s2_26
  section: 2
  number: 26
  type: single
  page: 4
  stem: 根據本文，跳舞的熊在重獲自由後，為何又開始跳舞？
  options:
  - label: A
    content: 碰到通了電的鐵絲網
  - label: B
    content: 面對新的現實和挑戰感到不知所措
  - label: C
    content: 不能盡情奔跑、覓食、交配
  - label: D
    content: 再度被人類責罵、毆打。
  group_stem: "從前從前，在遙遠的中、東歐，有一群熊，牠們的名字叫跳舞的熊。\n  這些熊從小就被人帶離森林，打掉牙齒，裝上鼻環，跟著馴熊師四處流浪，表演跳舞和名人模仿秀，娛樂大眾，或是為人治病、按摩，彷彿江湖郎中。不然，就是讓大家摸摸牠們—普遍相信，這會帶來好運。表演結束，馴熊師會得到小費，而熊則會得到食物—啤酒、馬鈴薯、巧克力、麵包。這些都不是熊該吃的，就像籠子不是熊該住的地方，跳舞不是熊該做的事，被人責罵、毆打、殺死不是熊該遭受到的對待。\n\
    \  二○○七年保加利亞加入歐盟，跳舞的熊於是不合法了。熊兒們被動保組織「四掌基金會」帶離馴熊師身邊，帶到位於貝利察的保護區，一座被群山環繞、有森林、堅果和草莓的跳舞熊公園。公園的員工開始了一項獨特的計畫：他們要在這中心，教導熊兒們什麼是自由。\n\
    \  乍看之下令人奇怪—自由還需要學習嗎？\n  在沒有任何痛苦、限制（除了通了電的鐵絲網）的大自然，這些熊只要盡情奔跑、覓食、交配，回歸自己的本能，好好享受自由，不就好了？\n\
    \  然而，這些熊從來不知道什麼是自由，牠們不會冬眠，不知道如何找食物，不知道怎麼打發過剩的時間。拿掉鼻環讓牠們失落，必須為自己做決定，而「為自己負責」卻讓牠們恐懼。當牠們面對新的現實和挑戰感到不知所措，牠們就會做那件牠們多年以來一直在做的事—跳舞。\n\
    \  自由不只會撫慰我們，也會令我們焦慮、痛苦、不安。即使是這樣，我們依然渴望，甚至必須渴望。就像民主一樣，它不是會來照顧我們的東西，而是我們必須去照顧的東西。並不是自由民主了，我們就會過得幸福快樂，但若沒有自由民主，我們會離幸福快樂非常遙遠，而且愈來愈遠。\n\
    （林蔚昀 那些熊教我們的事：在轉型正義的同時，看見轉型不易）"
