- id: doc_112_高雄_大灣_國文_g9s2e2_s2_29
  section: 2
  number: 29
  type: single
  page: 5
  stem: 根據本文，真實訊息及虛假訊息的散播狀況，下列敘述何者正確？
  options:
  - label: A
    content: 真實訊息比虛假訊息傳播得更廣
  - label: B
    content: 自然災害類型的訊息是真實訊息傳播較快
  - label: C
    content: 前百分之一的錯誤訊息的真相能擴散給一千到十萬個人
  - label: D
    content: 虛假訊息被轉發的可能性比真實訊息多了七〇％。
  group_stem: "從廣播、報紙、電視到如今的網際網路，資訊的傳播趨勢正往多向、多節點的網狀型態發展。根據二〇一六年的研究統計，有六十二％美國成年人會透過社群媒體獲得資訊。比起過往多從報紙、電視或是書本中接受資訊，透過網路乍看之下有更多主動的選擇。但事實上，社群媒體、搜尋引擎等仍利用演算法決定什麼樣的資訊應該送到我們的面前，而且更不著痕跡，甚或是讓我們被「過濾氣泡」包圍而不自覺。\n\
    \  進一步來說，在社群媒體上，真、假資訊的傳播力有何差異呢？二〇一八年，有研究團隊分析從二〇〇六年到二〇一七年，在Ｔｗｉｔｔｅｒ上十二點六萬則「ｃａｓｃａｄｅｓ」（指的是單一起源、沒有被打斷的轉發鏈），發現了虛假訊息比真實訊息傳播得更廣：前百分之一的錯誤訊息會擴散給一千到十萬個人，但其真相卻很少擴散超過一千人。虛假訊息被轉發的可能性比真實訊息多了七〇％，且散播速度更快，不管是哪種類型的主題（自然災害、科學、都市傳説、金融資訊、政治、娛樂）皆是如此。\n\
    \  而在這個傳播鏈中，網路機器人對於真、假訊息的反應是相似的—表示假訊息之所以比真訊息更行更遠還生，都是因為人類的關係。假訊息到底是哪裡誘人了？此研究也用了語意分析去比較真、假訊息的閱讀情緒，發現真訊息觸發的情緒是快樂、信任，而假訊息跟真訊息相比則有更多驚訝的回覆，更能吸引人的注意力。（雷雅淇\
    \ 讓我們成為中斷謠言傳播的真相追求者）"
