  stem: '「鶴岡文旦栽種於臺灣最後一塊淨土（花蓮縣 瑞穗），無工業汙染，無農藥殘留保證。這裡雨量豐沛，氣候溫暖，土壤屬黏質酸性，極適合文旦的生長，其品質好，產量高，且果樹齡都達三十年以上，本農場並噴灑獨特的魚精及深海的海草精來栽植，使其果肉品質及甜度皆屬特級品，不亞於麻豆文旦。」

