- id: doc_112_高雄_大灣_國文_g9s2e2_s1_23
  section: 1
  number: 23
  type: single
  page: 3
  stem: "傳統是一座巨大的牢籠。牢籠上有密密麻麻的鐵桿，其中一支鐵桿──勤能補拙。我們自小聽了，牢牢記住，勤真的能補拙嗎？不是吧，拙要靠聰明來補，否則只會變得又笨又勤快。\n\
    \    一○二○年，英國有個叫奧利佛的傢伙，雙臂綁上巨大的『鳥翅膀』，從高處向下飛，撲騰了一陣，摔斷了雙手、雙腳。儘管他身負重傷，還很開心的說：「這次疏忽了一點，忘了裝上『鳥尾巴』。只要裝上『鳥尾巴』，下次一定會成功。」又過了五百年，義大利的約凡尼‧達米恩，在蘇格蘭試飛。他擺動雞毛做成的翅膀，從高牆上縱身一跳，結果摔斷一條腿。達米恩說：「我犯了一個大錯，我不該用雞毛，因為雞是不會飛的。如果用老鷹的羽毛，那一定能成功。」後來他們怎麼死的？歷史上沒有記載。\n\
    關於這則短文，下列敘述何者不正確？"
  options:
  - label: A
    content: 此文以兩則人物事例否定「勤能補拙」的道理，並認為若以聰明輔助勤快，便能事半功倍
  - label: B
    content: 英國的奧利佛和義大利的約凡尼‧達米恩是「又笨又勤快」的最佳寫照
  - label: C
    content: 作者以譬喻開頭，暗指多項傳統美德實為思想綁架，「勤能補拙」即是一例
  - label: D
    content: 「後來他們怎麼死的？歷史上沒有記載」可知作者強調兩位「不居功」的美德。
