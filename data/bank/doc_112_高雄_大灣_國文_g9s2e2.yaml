  stem: '「Ｎ９５之類型口罩是可以有效濾除結核桿菌（直徑約為０．３~０．６微米，長１~４微米），防止空氣感染。根據美國 職業安全衛生研究所公布的測試標準，所有Ｎ型口罩都是用來過濾空氣中的非油性懸浮顆粒，可反覆使用。除另有標示外，通常無使用時限。Ｐ型口罩都是用來過濾空氣中的油性與非油性懸浮顆粒，使用時限為八小時。Ｒ型口罩是用來過濾空氣中的油性與非油性懸浮顆粒，可反覆使用。除另有標示外，通常無使用時限。此外，Ｎ１００、Ｐ１００、Ｒ１００三型口罩都是用０．３微米微粒進行測試時，阻隔效率須達９９．７％以上；Ｎ９９、Ｐ９９、Ｒ９９都是過濾率在９９％以上，而Ｎ９５、Ｐ９５、Ｒ９５都是過濾率在９５％以上。因此，Ｎ９５口罩是用０．３微米氯化納微粒進行測試，阻隔效率須達９５％以上，並經帶用者臉龐緊密度測試，確保在密貼臉部邊緣狀況下，空氣能透過口罩進出。符合此測試的才發出Ｎ９５認證號碼。」

