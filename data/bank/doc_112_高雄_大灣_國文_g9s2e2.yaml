  stem: '索孚，字國明，敦煌人。善射，十中八九。或謂之曰：「射有法乎？」孚曰：「射之為法，猶人主之治天下也。射者弓有強弱，矢有銖兩○1 ，弓不合度，矢不端直，主雖逢蒙○2
    ，不能以中；才不稱官，萬務荒殆，雖有堯、舜之君，亦無以治也。」 【注釋】○1 銖兩：比喻細微的差異。○2 逢蒙：人名，古代射箭的能手，是羿的弟子。

    由上文可知，索孚在射箭中體會到的施政之道為何？'
