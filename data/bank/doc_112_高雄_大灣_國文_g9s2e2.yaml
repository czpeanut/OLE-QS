- id: doc_112_高雄_大灣_國文_g9s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: '「竹之始生，一寸之萌耳，而節葉具焉。自蜩腹○1 蛇蚹○2 以至於劍拔十尋○3 者，生而有之也。今畫者乃節節而為之，葉葉而累之，豈復有竹乎？故畫竹必先得成竹於胸中，執筆熟視，乃見其所欲畫者，急起從之，振筆直遂○4
    ，以追其所見，如兔起鶻落○5 ，少○6 縱則逝矣。」（蘇軾 文與可畫篔簹谷偃竹記）【注釋】○1 蜩蝮：蟬腹。○2 蛇蚹：蛇鱗。○3 尋：古代八尺稱為「一尋」。○4
    直遂：直接表達。○5 兔起鶻落：兔子剛躍起，鶻鳥就猛衝下來。比喻動作快速敏捷。鶻，音ㄏㄨˊ。○6 少：略微、稍微。

    根據這段文字，作者認為畫竹之前應先如何？'
  options:
  - label: A
    content: 仔細觀察，心中具有完整的竹子形象
  - label: B
    content: 分析竹子節葉的構造，以求逼真生動
  - label: C
    content: 了解竹子由小到高大挺直的成長過程
  - label: D
    content: 探索竹子與動物的互動，以捕捉神韻。
  tags:
