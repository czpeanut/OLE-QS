  stem: 附圖為勞動部就勞資爭議事件統計的歷年數據，期間是自2010年統計至2018年底。由於勞動環境與職業類別的變動，2016年，立法院修正《勞資爭議處理法》中，關於勞資爭議處理的方式，藉由新增設置專業調解機制，提供勞動者多元的勞資爭議處理的管道。就圖中的數據資料，我們可以看出什麼訊息？
