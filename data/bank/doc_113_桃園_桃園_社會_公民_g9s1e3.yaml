  - label: A
    content: 2018年曲線下降顯示勞動環境大幅改善，未來將持續下降
  - label: B
    content: 2016年事件數量增加，顯示法律修訂完善勞動者救濟管道
  - label: C
    content: 2016年修法後事件數量增加，勞動環境未改善反而惡化
  - label: D
