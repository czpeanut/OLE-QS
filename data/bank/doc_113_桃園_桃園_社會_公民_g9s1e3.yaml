  - label: D
    content: 小公主:文化幣能永久的價值儲藏。
  group_stem: '●請根據下文回答問題:

    2025年「文化幣」文化禮金向下扎根，除了繼續發給16至22歲青年每人1200點，更推出13至15歲青少年試辦計畫，每人可領取600點。

    文化部表示，2025年的文化禮金1點等於新台幣1元，領取使用期間為2025年1月1日至12月31日。無論是具中華民國國籍或符合資格的外國人士，凡是出生日期介於2003年1月1日至2009年12月31日的16至22歲青年，可以領取1200點文化禮金；出生日期介於2010年1月1日至2012年12月31日的13至15歲青少年，可以領取600點文化禮金。領取方式為下載「文化幣」APP後，輸入相關資料，通過驗證即可完成領取。

    對於文化幣可以用在哪些場所？文化部提出完整攻略，可用於超過1.8萬個藝文消費點，包含聽音樂會、看表演、看展覽、Live house、桌遊體驗、社區營造活動、逛博物館、文化體驗旅程；買書、買漫畫、買雜誌、手作DIY及工藝體驗、逛文化創意園區、聚落、文化場域之展會、市集；看國片、唱片行、樂器行等。

    文化部最後提醒，文化禮金不可找零、轉售、兌換成等值現金，亦不可折抵藝文票券、退換票衍生手續費；不得用於餐飲相關消費。'
