    content: 可以降低雇主的成本
  - label: B
    content: 會降低受僱者的工作時數
  - label: C
    content: 會影響受僱者的工作收入
  - label: D
    content: 對職場的安全衛生有影響。
  group_stem: '●請根據下文回答問題:

    「勞雇雙方協商減少工時」（俗稱無薪假）是指當事業單位受景氣因素影響，為避免資遣員工，造成更多社會問題，雇主與勞工先行協商減少工時。但事業單位實施無薪假並沒有強制通報機制，倘若企業實施無薪假卻未向地方勞政主管機關通報，並沒有違法，導致部分被放無薪假的勞工淪於黑數。勞動部幕僚表示，減班休息法制化目前正在研議中，規畫將修正《就業服務法》且加上罰則，細節尚待評估。請問：'
