- id: doc_113_桃園_桃園_社會_公民_g9s1e3_s1_36
  section: 1
  number: 36
  type: single
  page: 1
  stem: 根據上文，關於「行動支付」的敘述何者正確？
  options:
  - label: A
    content: 行動支付是疫情下產生的新型態支付工具
  - label: B
    content: 行動支付普及將產生貨幣供給過多的現象
  - label: C
    content: 行動支付具有交易媒介的特性，但不屬於貨幣
  - label: D
    content: 2025 年行動支付將完全取代現金交易。
  group_stem: '2017 年行政院提出「國內行動支付普及率於 2025 年達 9 成」為目標（行動支付是指利用行動裝置付款的服務），2020 年後受到疫情影響，民眾使用行動支付的意願提高，2021
    年的行動支付使用率達到 7 成，有望在 2025 年達到目標。

    根據調查顯示，「疫情期間最常使用的支付方式」第一名為「行動支付」（42.4％），第二名是「信用卡」（25.0％），第三名為「現金」（20.3％）。而民眾改用行動支付的前
    3 名原因為「使用便利」、「避免接觸」、「回饋優惠」，顯示行動支付在疫情之下發揮不少作用，不但更便利也能減少紙張用量，也為環境盡一分心力。'
  tags:
    chapter:
