questions:
- id: doc_113_新北_忠孝_社會_歷史_g7s2e3_s1_28
  section: 1
  number: 28
  type: single
  page: 1
  stem: 民國三十九年(1950)，發生某一事件，美國政府認為這是共產主義在亞洲發動總攻勢的一部份，遂以軍事行動援助。且為防止共產勢力擴張，也決定提供台灣軍事經濟援助與外交支持，以維護台海和東亞地區的安定。請問：上述所指是哪一個事件？
  options:
  - label: A
    content: 二戰
  - label: B
    content: 國共內戰
  - label: C
    content: 韓戰
  - label: D
    content: 越戰
- id: doc_113_新北_忠孝_社會_歷史_g7s2e3_s1_29
  section: 1
  number: 29
  type: single
  page: 1
  stem: '民國38 年中央政府遷台後，外交政策有三個階段：

    (甲)彈性外交 (乙)務實外交 (丙)鞏固外交。

    按先後順序排列，正確的是：'
  options:
  - label: A
    content: (甲) (乙) (丙)
  - label: B
    content: (乙) (丙) (甲)
  - label: C
    content: (丙) (乙) (甲)
  - label: D
    content: (丙) (甲) (乙)
- id: doc_113_新北_忠孝_社會_歷史_g7s2e3_s1_30
  section: 1
  number: 30
  type: single
  page: 1
  stem: 民國68 年，美國國務卿訪臺說明美國的決定，許多民眾在機場聚集抗議，甚至朝向美國官員丟擲雞蛋。請問：當時令臺灣民眾感到憤怒的主要原因可能是下列何者？
  options:
  - label: A
    content: 中華民國退出聯合國
  - label: B
    content: 美國與我國斷交
  - label: C
    content: 美國停止軍售台灣
  - label: D
    content: 中共搶奪我國邦交國
- id: doc_113_新北_忠孝_社會_歷史_g7s2e3_s1_31
  section: 1
  number: 31
  type: single
  page: 1
  stem: 民國60 年代，我國失去聯合國席位也失去美國的邦交後，我國面臨孤立的衝擊，為了突破困境，所採取的外交政策是：
  options:
  - label: A
    content: 鞏固外交
  - label: B
    content: 彈性外交
  - label: C
    content: 金錢外交
  - label: D
    content: 務實外交
- id: doc_113_新北_忠孝_社會_歷史_g7s2e3_s1_32
  section: 1
  number: 32
  type: single
  page: 1
  stem: '政府遷臺後，曾經實施許多經濟政策；將這些政策依時間順序排列，下列何者正確？

    (甲)建立加工出口區 (乙)成立新竹科學園區

    (丙)推行十大建設 (丁)進行土地改革'
  options:
  - label: A
    content: 丁甲丙乙
  - label: B
    content: 乙甲丙丁
  - label: C
    content: 丙甲丁乙
  - label: D
    content: 甲乙丙丁。
- id: doc_113_新北_忠孝_社會_歷史_g7s2e3_s1_33
  section: 1
  number: 33
  type: single
  page: 1
  stem: '右表是四個年度臺灣佃農每年每公頃收益統計，表中的數字反應了政府的哪一項政策？


    | 單位：公斤 |

    | 年代 | 農民稻穀收益數 |

    | --- | --- |

    | 民國37 年 | 1,947 |

    | 民國38 年 | 2,788 |

    | 民國45 年 | 3,991 |

    | 民國55 年 | 7,525 |'
  options:
  - label: A
    content: 興修水利工程
  - label: B
    content: 實施土地改革
  - label: C
    content: 推動十大建設
  - label: D
    content: 新台幣的發行
- id: doc_113_新北_忠孝_社會_歷史_g7s2e3_s1_34
  section: 1
  number: 34
  type: single
  page: 1
  stem: 新北市政府每年4 月會在中和地區舉辦一年一度的潑水節活動。潑水節是東南亞地區最盛大的傳統節日，節慶期間大家會用純淨的清水相互潑灑，祈求洗去過去一年的不順，新的一年重新出發。請問：原為東南亞地區節慶的潑水節會在新北市出現，與下列何者關係最密切？
  options:
  - label: A
    content: 原住民族提倡並復興南島文化
  - label: B
    content: 政治上欲加強與東南亞的聯繫
  - label: C
    content: 新住民移入帶入不同地區文化
  - label: D
    content: 配合並推廣政府的新南向政策
- id: doc_113_新北_忠孝_社會_歷史_g7s2e3_s1_35
  section: 1
  number: 35
  type: single
  page: 1
  stem: 原住民族曾在民國77、78、82 年走上臺北街頭示威抗議，他們為土地的流失與限縮、土地正義未受正視，以及土地糾紛不斷的狀況，提出改革訴求，期間並與警察發生衝突。之後，政府為回應原住民族的訴求，開始小規模的增編保留地。請問：上述原住民族發起的活動指的應是下列何者？
  options:
  - label: A
    content: 還我土地運動
  - label: B
    content: 母語運動
  - label: C
    content: 政治運動
  - label: D
    content: 正名運動
- id: doc_113_新北_忠孝_社會_歷史_g7s2e3_s1_36
  section: 1
  number: 36
  type: single
  page: 1
  stem: '下列是一份關於美國與中華民國外交關係的文件，請閱讀後回答問題。

    (一) 任何企圖以非和平方式解決臺灣未來的作為，破壞西太平洋地區和平及穩定，關乎美國利益，美國將會關切。

    (二)提供臺灣足夠的防禦武器，使臺灣維持防禦能力。

    (三)美國與臺灣維持商業及文化關係，並在臺灣設立美國在臺協會，維持非官方關係。

    請問：此份文件的出處為下列何者？'
  options:
  - label: A
    content: 《共同防禦條約》
  - label: B
    content: 《聯合國憲章》
  - label: C
    content: 《台灣關係法》
  - label: D
    content: 《告台灣同胞書》
- id: doc_113_新北_忠孝_社會_歷史_g7s2e3_s1_37
  section: 1
  number: 37
  type: single
  page: 1
  stem: 民國六十年代的國際能源危機，對臺灣經濟造成嚴重衝擊，政府如何處理當時的經濟困境？
  options:
  - label: A
    content: 進行土地改革，引導地主投資工商業
  - label: B
    content: 鼓勵輕工業商品出口，拓展海外貿易
  - label: C
    content: 積極加入APEC，並降低貿易限制
  - label: D
    content: 推動十大建設，改善國內的投資環境
- id: doc_113_新北_忠孝_社會_歷史_g7s2e3_s1_38
  section: 1
  number: 38
  type: single
  page: 1
  stem: 現今臺灣隨處可見韓式、日式餐飲，韓系、日系、美系、法系等服飾品牌或生活用品，打開電視除了台劇外，還可看到韓劇、日劇、美劇、陸劇等不同風格的戲劇。這樣的生活方式反映了臺灣社會何種現象？
  options:
  - label: A
    content: 強勢文化的入侵
  - label: B
    content: 反共文化的強化
  - label: C
    content: 傳統文化的衰退
  - label: D
    content: 多元文化的並存
- id: doc_113_新北_忠孝_社會_歷史_g7s2e3_s1_39
  section: 1
  number: 39
  type: single
  page: 1
  stem: 政府自民國76 年來開放大陸探親，為兩岸的互動及商業、文化開啟新頁。請問：下列選項中，何者是我國與中共實際交流的單位？
  options:
  - label: A
    content: 海基會
  - label: B
    content: 陸委會
  - label: C
    content: 海協會
  - label: D
