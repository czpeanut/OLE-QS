- id: doc_111_桃園_中興_社會_公民_g7s1e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: '幾位好友利用通訊軟體閒聊近況，他們以下的談論內容，表現出何種意涵？

    群組對話

    子銓：我在社區開設工藝教室，教授一些我們族裡的傳統工藝技術，希望這些技藝不要失傳。

    傳一：我在遊客觀光區販賣部落製作的布織品，也提供現場編織教學，受到廣大迴響。

    瑋甯：實在是太棒了，真高興部落的文化之美可以和這麼多人分享。'
  options:
  - label: A
    content: 延續傳統，展現文化生命力
  - label: B
    content: 宣揚信仰，培養正確價值觀
  - label: C
    content: 守護生活場域，與自然同生同息
  - label: D
    content: 推選領導者，重建部落秩序。
  tags:
    chapter:
