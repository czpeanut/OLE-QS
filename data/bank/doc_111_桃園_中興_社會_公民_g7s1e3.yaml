    content: 學生在學校裡不受任何形式的霸凌行為而造成身心的傷害是屬於身體自主權的維護
  - label: C
    content: 為保障學生學習權與受教育權，課程規畫應以學生的需求為主
  - label: D
    content: 人格發展權指尊重他人價值，故對於未來志向，任何人都不可以干涉
