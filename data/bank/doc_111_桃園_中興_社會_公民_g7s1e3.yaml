- id: doc_111_桃園_中興_社會_公民_g7s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 學校針對可能就讀高職的學生，在國中九年級時會透過技藝教育課程，每週花至少3 節課時間讓學生到鄰近的高職或學校合作的技藝班上課，透過實務學習加深生涯試探。學校主任分享，試探並非想早早定型，而是讓學生確認自己的興趣。每年都有學生因技藝班找到興趣，升學想法逐漸清晰；同時也有些孩子發現某個領域不是真愛，刪掉一些升學選項，無論是哪一種，過程都讓學生更認識自己。畢業校友妍希曾是技藝班的學生，體驗過不同課程，他表示，好處就是「不會聽到別人說，以後你就一頭熱去做這工作，這樣可以減少日後因了解而分開的窘境。」有關此技藝課程的分析，下列何者正確？
  options:
  - label: A
    content: 參與學程的學生須掌握好學習的方法才能成功
  - label: B
    content: 此課程最大的貢獻在聯繫學生與高職間的人際互動
  - label: C
    content: 學程的主任認為此課程最重要在發掘學生潛能
  - label: D
    content: 妍希的說明可看到在學校積極參與公共事務的影響。
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 公民
      code: 5-2
      title: 如何參與校園公共事務？
      chapter: 第5章 學生權利與校園生活
    textbook: 七上公民 5-2 如何參與校園公共事務？
    labeled_by: ai
