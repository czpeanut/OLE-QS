  stem: '附圖為學務處針對校園生活進行問卷調查，列出幾項學生常見行為，請學生填入發生的頻率代號。從此份問卷中，可以看出什麼樣的校園生活樣貌？


    | 頻率 | 1 從不 2 偶爾 3 中間<br>4 很多 5 經常 |

    | :--- | :--- |

    | 行為 | (1)遭到他人破壞所屬物品<br>(2)遭到他人言語惡意攻擊<br>(3)被他人攻擊、傷害身體<br>(4)所屬物品不明原因被消失<br>(5)用不喜歡的方式觸摸身體
    |'
