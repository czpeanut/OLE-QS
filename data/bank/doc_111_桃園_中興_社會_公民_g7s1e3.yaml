  section: 1
  number: 15
  type: single
  page: 2
  stem: 我國於 2017 年通過《原住民族語言發展法》，將原住民族語列為國家語言，並於第一條揭示該法是為了促進原住民族語言之保存與發展，同時保障原住民族語言的使用及傳承。根據上述，該項法案的立法通過，彰顯了下列何種意義？
  options:
  - label: A
    content: 珍視原住民族部落特有文化資產
  - label: B
    content: 原住民族語言價值高於其他族群
  - label: C
    content: 漢人文化不敵原住民族傳統文化
  - label: D
    content: 原住民族成為國內法定特權階級。
