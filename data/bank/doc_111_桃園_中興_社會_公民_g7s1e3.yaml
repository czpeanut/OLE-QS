- id: doc_111_桃園_中興_社會_公民_g7s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 導師在班會時表示近期有家長反映，常有幹部忘了於放學前公告明日的重要事項，而在深夜時才公布於班級群組中，導致不少同學未能即時接收到相關訊息，隔天無法順利完成。有同學在群組中氣憤留下不雅言詞辱罵幹部，他希望班上同學能利用班會時間，集思廣益想出解決方法。請問哪一位同學提出的解決方法最為適當？
  options:
  - label: A
    content: 小翰：幹部只要願意針對錯誤的行為道歉，這件事就能完美的解決！
  - label: B
    content: 文軒：直接重新栗選新的幹部，透過多数決產生人選就不會起紛爭。
  - label: C
    content: 南南：導師經驗豐富，直接提供解決方法，由同學附議，最為有效！
  - label: D
    content: 林芸：應該先了解為何會延遲公布的原因，再來討論才能有效遵守。
