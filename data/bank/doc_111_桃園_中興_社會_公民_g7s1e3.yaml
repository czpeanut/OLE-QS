  type: single
  page: 1
  stem: 爸爸與剛上國中的女兒一同參加家長座談會，看到教室牆上貼著「班級生活公約」，感慨地說：「以前我們唸書時，學生只能遵守由學校制定的校規與班規，真羨慕你們現在師生可以相互溝通，共同擬定大家願意接受的生活公約。」下列何項敘述正確？
  options:
