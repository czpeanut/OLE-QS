  section: 2
  number: 3
  type: essay
  page: 2
  stem: '2. 國家發展委員會每兩年會依據內政部人口統計資料進行我國人口推估報告，報告內容包含出生率、死亡率、高齡化時程及扶養比等趨勢之推估資訊。最近一次推估報告「2022
    至 2070 年人口推估」於 2022 年 8 月 22 日更新並公布，其中老年人口占總人口比率未來將持續提高，預估於 2039 年突破 30%，至 2070
    年將達 43.6%（如圖一）。除了老年人口比率持續提高之外，由於我國生育率持續下降，若以工作年齡人口與老年人口之比進行預估，2022 年每 4 位工作年齡人口負擔
    1 位老年人口，至 2070 年將降至每 1.1 位須負擔 1 位老年人口（如圖二）。

    因此，政府思考要解決未來人口所帶來的問題與挑戰，擬推出如下政策，(甲)廣設老人安養中心 (乙)提高幼兒托育補助 (丙)延後勞工退休年齡 (丁)提倡三代同鄰觀念。希望可以減緩我國所面臨人口問題的衝擊。

    (三代同鄰：指祖父母、父母、子女，住在同一棟大樓、同一個社區或同一條街上)

    根據短文 2，若根據世界衛生組織對人口老化之定義，我國應該是在(圖一)XYZ 哪一個階段，屬於高齡社會？'
