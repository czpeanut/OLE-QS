  stem: '1.兒少團體為宣導家庭暴力防治之相關觀念，在街頭演出行動劇：《現代灰姑娘》，劇情描述自幼喪母的灰姑娘本來與爸爸相依為命，不久前爸爸再娶，於是後母與其前夫所生的兩個女兒就成了家中新成員。然而自從爸爸被調派至東南亞工作後，後母和兩個姐姐就開始虐待灰姑娘，對她言語辱罵、拳打腳踢，讓灰姑娘身心受創。直到某天晚上隔壁鄰居仙女姊姊見義勇為，幫忙撥打婦幼保護專線通報；得知消息返回臺灣的爸爸，也聲請核發保護令，灰姑娘才終於遠離家暴的陰影。

