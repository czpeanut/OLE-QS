  stem: Jasmine is in the library now. What time or what day is it?
  options:
  - label: A
    content: It’s 09:10 a.m. on Thursday.
  - label: B
    content: It’s 11 a.m. on Sunday.
  - label: C
    content: It’s 12:30 in the afternoon on Friday.
  - label: D
    content: It’s 04:05 p.m. on Monday
  group_stem: 'Good morning, everyone.  Nice to meet you.  I am your good friend,
    Robot Bobbie.  Welcome to Happy Junior High School Library.  Here are things you
    should know in the library:


    **The Library Rules**

    1. Be quiet and turn off your phone.

    2. Don’t run. Please walk.

    3. You can not eat or drink here.

    4. Don’t draw or write on the books.

    5. Put the books back to the right place.


    **Opening Hours**

    Monday ~ Friday

    08:00 a.m.~12:00 p.m.

    01:00 p.m.~04:00 p.m.

    Closed on weekends


    **7/19 (Fri.) The library is closed because of book inventory. Return all the
    books to the library before the day.**


    If you have any questions, please come and talk to me. I can help you look for
    books, lead you to the bookshelf, and show you information about the library.
