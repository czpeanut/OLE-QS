  group_stem: "除了廣為人知的塞納．馬恩省河（Seine）露天開幕式表演及最「綠」奧運的頭銜外，在觀看賽事之餘，不妨一起來認識 2024 巴黎 奧運還有哪些你不曾聽聞的小故事！\n\
    一、時隔百年再成主辦國，邀請百歲選手傳遞聖火\n     儘管在開幕前就因市區出入管制、塞納．馬恩省河水質管控等因素，受到當地民眾的反彈，巴黎 奧運仍在全球運動迷的引頸期盼下，於臺灣時間\
    \ 7 月 27 日凌晨舉行開幕式。\n     談到奧運，就不得不提每次皆有的奧運聖火（Olympic Flame）傳遞傳統，2024 巴黎 奧運的聖火傳遞名單可說是眾星雲集，邀請到國際多位傳奇選手、名人參加，包含希臘金牌划船選手恩托斯科斯（Stéfanos\
    \ Doúskos）、擁有 22 座大滿貫冠軍獎盃的拉法納達爾（Rafael Nadal）、韓國男團 BTS 成員 Jin、中國演員湯唯等等。\n    本次聖火傳遞儀式，同樣從奧運的起源地――希臘\
    \ 雅典――開始，途中經過法國 64 區、經手 11,000 位火炬手的接力，最終前往本屆奧運的舉行地巴黎。而在星光熠熠的名單中，身坐輪椅的倒數第二位火炬手卻格外吸引了大家的注意。這位高齡百歲的查理斯科斯特（Charles\
    \ Coste）曾在 1948 年的倫敦 奧運上奪得自行車團體賽項目的金牌，是目前法國國內最年長的奧運冠軍選手。他的加入不僅為各國選手帶來滿滿鼓勵，也因查理斯科斯特恰好出生於\
    \ 1924 年、巴黎首次舉辦奧運那年，為 2024 巴黎 奧運帶來別具意義的見證。\n二、奧運不可缺少的官方吉祥物：Phryges 是什麼？\n   四年一次的奧運賽事，除了有精彩比賽可以觀看外，在當地逛奧運紀念品店同樣成重要觀光活動之一，但你知道海報上常看到的紅色小精靈\
    \ Phryges 的設計靈感與法國歷史息息相關，甚至還可追溯回遠古時代嗎？\n   法國知名的弗裡吉亞帽（bonnet phrygien）被視為自由和解放的象徵，不僅在每個市政廳中都可見法國標誌性人物瑪麗安娜（Marianne）將其戴在頭上，甚至也可在當地隨處可見的硬幣、郵票等日常物品上發現其蹤跡。\n\
    \   Phryges 的造型源自於弗裡吉亞帽，希望藉此展現出「獨自一人走得快，但齊心協力的我們可以走得更遠」的含義；外觀則是依照法國國旗的藍、白、紅進行設計，並在胸前飾有金色的\
    \ 2024 巴黎 奧運標誌。\n三、翻轉創意：維也納雕像「找回雙手」宣傳奧運\n   如果邀請到《斷臂維納斯》（Venus de Milo）參與 2024\
    \ 巴黎奧運，會是什麼樣子？\n  因應本屆奧運的到來，巴黎吹起一陣創意旋風，藝術家們分別透過自己的方式慶祝這項特別的慶典。其中，受到法國國民議會（Assemblée\
    \ Nationale）邀請的藝術家 Laurent Perbos 選擇融合古代雕塑及運動賽事，將體育的歷史銘刻在大理石雕像上，讓羅浮宮鎮館之寶之一的斷臂維納斯「找回雙手」。Laurent\
    \ Perbos 利用環保材質打造出 6 座「長出手臂」的斷臂維納斯雕像，並分別讓她們體驗了 6 項經典奧運項目：網球、衝浪、射箭、籃球、拳擊及標槍。然而不同於原作的白色，他為各個雕像逐一換上繽紛、充滿活力的顏色，並將一系列作品命名為《Six\
    \ Venuses》。\n    這些色彩明亮的藝術品，不僅作為傳遞維持平等權利、反對仇恨及歧視的強烈提醒，同時也藉由改編作為女性美象徵的斷臂維納斯，獻給所有參與體育運動的女性。\n\
    \   值得注意的是，射箭項目的雕像不同於其他五個雕像「裝上」雙手，Laurent Perbos 刻意僅為此雕像裝上一隻手臂，作為對帕拉林匹克運動會（Paralympic\
    \ Games）*註 的致敬。\n   過去 25 年來，國際奧會為促進性別平等的承諾，不斷推出新的改變，其中包含：修改《奧林匹克憲章》（Olympic Charter）、增加女性參與奧運的人數、推出多項混合性別的運動項目……終於在首位女性選手參與的一個世紀後，於\
    \ 2024 巴黎 奧運首次迎來男女選手參加人數持平的日子。\n  *註：帕拉林匹克運動會（Paralympic Games），簡稱帕運會、帕運、帕奧，是一項為身心障礙者而舉辦的綜合型國際體育賽事，由國際帕拉林匹克委員會（IPC）主辦。\n\
    \n 節錄自羅思涵〈你看見層層標籤下的「細節」了嗎？――解密巴黎 奧運的五個「浪漫」冷知識〉"
