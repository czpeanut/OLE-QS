  - label: C
    content: 作者透過個人的觀察與感受，表達對大明湖的喜愛與珍視，這使得文章更具情感深度，讓讀者能夠共鳴
  - label: D
    content: 大明湖不僅僅是一個自然景觀，更象徵著作者內心的安靜和追求。在繁忙的現實生活中，湖泊成為了一種心靈上的避風港。
  group_stem: "常聽見人說，讀了老殘遊記去遊大明湖，一定會感到失望或幻滅，因為百花堤沒有花，歷下亭碰不到名士，大明湖不是湖，乃是一條小河，夾岸長滿了蘆葦。還有些粗心的人，既不注意時間，也不注意地方，在歷下亭邊找千佛山的倒影，在滿天雲霧裡看鵲華秋色，找不到，看不見，就懷疑老殘撒謊，或更斷定是文人誇誕。大明湖因為老殘遊記的描繪出了名，也因為好多遊人指出它的名不副實，使齊魯山水都減了聲價。\n\
    \      從劉鶚遊濟南到現在，不過半世紀多點，大明湖真老了醜俗化了嗎？照我看，明湖也許變了，變的可並不多。「荷花世界柳絲鄉」，還是照樣，只是種荷花的人，因為老殘一類的白吃蓮蓬，亂摘蓮花的客人太多了，培植了一排一排的葦牆，把荷花一區一區的圈起來。只留下幾條深水的通路，給閒人蕩槳。花是看不見，花香可沒有關住，你也可以從蘆葦縫裡窺見芬芳鮮豔的花海的一斑。你想要認識湖的全貌嗎？請到北極閣上看，請到城頭馬路上看，「一城山色半城湖」，「滿湖荷花繞湖柳」，並沒有什麼誇張。千佛山的倒影，一定在天高氣清的秋天，在鐵公祠前的湖面寬處，才看得分明。想認識大明湖的光明如鏡，也須在秋天冬天的蘆荷枯萎後。……荷花是可以遠觀，不可以褻玩的，明湖也跟廬山一樣，要認識它的真面日，須要站得高一點兒遠一點兒。\n\
    \     大明湖的特徵是安靜樸素，有含蓄，有用處。……冬天不結冰，夏天不咆哮，颳風不起洶湧的波濤，下雨沒有決堤的洪流。畫舫上難聽見笙歌管弦，繞湖岸多半是幽居蕭寺，連暮鼓晨鐘也沒有，整天是靜悄悄的。水上有一隊一隊的鴛鴦穿花戲草，玩得十分安詳自在。成群的白鷺鷥在凝神養氣，誰也不叫一聲。就是坐著小盆向遊客兜賣蓮花的小兒女，也只是拈花示意，並不吵著叫著賣。在這種寂靜的環境裡，宜於畫畫，宜於寫詩，更適於哲學家藝術家的深思。齊\
    \ 魯的先哲們喜歡講：「訥于言而敏於行」，「吉人之詞寡」，「惡夫佞者」，「多言多敗」，在我看都跟大明湖的德性有一脈相通的地方。\n       大明湖跟北平的昆明湖、杭洲的西湖，也性質不同，那是看的湖，玩的湖，點綴風景有餘，潤澤民生不足。大明湖在當地人看起來，只是水田的一種，與小清河沿岸的一切水田一樣，年年要出藕出魚，割蘆葦，收香稻。湖田又肥，水又足，生產量多，消費市場又近，所以價值也特別高。白蓮花長到五六尺高，大條的藕又脆又甜。圓圓的蓮子，又飽滿又有分量。種蓮把地種瘦了，就一塊一塊的改作漁塘，春天一放是幾萬條魚秧，到秋天就長到一斤來重。放去了塘水，魚鱗映著夕陽，密密匝匝，扒扒亂跳，真是一寸湖水一寸金。養魚的人笑了，魚價也便宜了。\n\
    \       山東人在厚重裡有瀟灑，在純樸裡有靈秀，在平凡裡有器用，接觸的越久越能發現心靈的美。大明湖正是山東人的象徵。我在湖邊作客，住過整整三年，我玩味過它的春夏秋冬，我領略過它的晴雨晝夜，理解的越深，越覺到它的可愛可親。……\n\
    \                                     節錄自 梁容若〈我看大明湖〉"
