- id: doc_113_高雄_陽明_國文_g9s1e1_s2_36
  section: 2
  number: 36
  type: single
  page: 5
  stem: 「去新城之北三十里，山漸深，草木泉石漸幽。初猶騎行石齒間，旁皆大松，曲者如蓋，直者如幢，立者如人，臥者如虯。松下草間有泉，沮洳伏見，墮石井，鏘然而鳴。松間藤數十尺，蜿蜒如大螈。其上有鳥，黑如鴝鵒(ㄑㄩˊㄩˋ八哥)，赤冠長喙，俯而啄，磔然有聲。」這段文字的寫作手法十分精緻，成功地將自然環境和自己的感受融為一體，使讀者能夠深入其境，體驗到文字帶來的美感與情感共鳴。以下關於寫作手法的說明，何者正確?
  options:
  - label: A
    content: 細節特寫：細緻描寫松樹的位置及色彩，增加了景物描寫的層次感
  - label: B
    content: 生動比喻：以豐富的比喻使讀者能夠具體的感受到鳥兒聲音的特徵
  - label: C
    content: 聲音描寫：透過聲音的描寫，增強畫面的動態感，讓山林顯得熱鬧喧騰如市集
  - label: D
    content: 動靜結合：在靜謐的山林中，特意描寫了鳥的動態，讓整個畫面更具活力與變化。
