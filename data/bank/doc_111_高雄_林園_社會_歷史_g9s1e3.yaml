  section: 1
  number: 33
  type: single
  page: 2
  stem: '2020 年開始受到新冠肺炎影響，全球經濟衰退。美國為因應此種狀況，2021 年3 月政府開始大量印鈔。有些經濟學者批

    評美國政府的做法無法挽救新冠肺炎造成的傷害，反而會讓經濟陷入更大危機，應該放任經濟自由發展，不該過度干預。

    請問：這些經濟學者應該是何人的信徒？'
  options:
  - label: A
    content: 亞當斯密
