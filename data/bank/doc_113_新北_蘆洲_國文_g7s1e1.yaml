- id: doc_113_新北_蘆洲_國文_g7s1e1_s1_44
  section: 1
  number: 44
  type: single
  page: 8
  stem: 由上文可知「抗生素是對抗人類與動物細菌感染的藥物」下列敘述何者正確？
  options:
  - label: A
    content: 症狀改善就表示可以停用抗生素
  - label: B
    content: 為了預防細菌感染，應該每日規律地使用
  - label: C
    content: 抗生素是對抗細菌感染的，所以可以自行混用
  - label: D
    content: 用抗生素時，務必仔細遵循說明，切勿自行停藥。
  group_stem: '抗生素是對抗人類與動物細菌感染的藥物。它們的作用是殺死細菌或使細菌難以生長及繁殖。通常抗生素可以透過不同的方式使用，如：口服（透過嘴巴服用），可以是藥丸、膠囊或液體；又如：局部塗抹在皮膚上的乳霜、噴霧劑或軟膏，也可以是眼藥膏、眼藥水或滴耳劑；也有透過注射或靜脈注射，通常用於更嚴重的感染。


    一般抗生素只能治療某些細菌感染，例如：鏈球菌性咽喉炎、泌尿道感染與大腸桿菌感染，對於某些細菌感染可能也不需要服用抗生素，例如，不需要它們來治療許多鼻竇感染或某些耳朵感染，因為在不需要的時候服用抗生素不會有任何幫助，而且可能會產生副作用。


    一般來說，應該只在需要時才服用抗生素，因為它們會引起副作用並導致抗生素抗藥性。當細菌發生變化並能夠抵抗抗生素的作用時，就會發生抗生素抗藥性。這意味著細菌繼續生長。當服用抗生素時，重要的是，要負責任地服用，務必仔細遵循說明，即使感覺好些了，也要吃完藥。如果過早停止服用，一些細菌可能會存活下來並重新感染。

    楊婷婷〈什麼是抗生素？〉'
