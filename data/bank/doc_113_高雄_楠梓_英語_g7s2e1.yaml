  - label: C
    content: '16'
  - label: D
    content: '32'
  group_stem: "【閱讀Part A】\nMBTI (MBTI 人格類型指標): To Know Myself Better (更加認識自我)\nHave\
    \ you ever wondered (納悶) why some people love big parties while others enjoy quiet\
    \ time alone (孤單一人)?\nOr why some friends make quick decisions (決定) while others\
    \ take their time? The MBTI, or Myers-Briggs Type\nIndicator, is a tool that helps\
    \ us understand our personalities. (人格)\nThe MBTI groups people into 16 personality\
    \ types (類型) based on four important choices (選擇):\n1. Introvert (I) or Extravert\
    \ (E) – Do you get happiness from being alone or with people?\n2. Sensing (S)\
    \ or Intuition (N) – Do you focus (專注) on facts (事實) or ideas?\n3. Thinking (T)\
    \ or Feeling (F) – Do you decide (決定) with logic (邏輯) or emotions (情緒)?\n4. Judging\
    \ (J) or Perceiving (P) — Do you like plans or being flexible (有彈性的)?\nFor example\
    \ (舉例), someone who is INFJ (Introvert, Intuition, Feeling, Judging) might enjoy\
    \ reading and helping\nothers. A ESTP (Extravert, Sensing, Thinking, Perceiving)\
    \ might love adventure (冒險) and trying new things.\nLearning about your MBTI type\
    \ can help you know yourself better. It can show your strengths (強項) and how you\n\
