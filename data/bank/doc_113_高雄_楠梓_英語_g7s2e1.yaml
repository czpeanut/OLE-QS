- id: doc_113_高雄_楠梓_英語_g7s2e1_s5_44
  section: 5
  number: 44
  type: single
  page: 5
  stem: What does “Meat-Free Day” mean?
  options:
  - label: A
    content: Eating only meat for a day.
  - label: B
    content: Not eating any food for a day.
  - label: C
    content: Eating no meat and choosing plant-based food.
  - label: D
    content: Eating only fast food.
  group_stem: "【閱讀Part B】\nMeat-Free Day\n Many people around the world are choosing\
    \ to have a “Meat-Free Day” once a week. This means that for one day,\nthey do\
    \ not eat meat. Instead, they eat vegetables, fruits, beans, and other plant-based\
    \ (植物為主的) food. But why do\npeople do this?\n     One reason (原因) is for the environment\
    \ (環境). Producing (生產) meat requires (需要) a lot of water, land, and\nenergy. It\
    \ also creates pollution (汙染) and contributes to climate change (造成氣候變遷). Eating\
    \ less (比較少) meat, even\njust one day a week, can help reduce (減少) these problems.\n\
    \     Another reason is health (健康). Eating too much meat, especially red meat,\
    \ can increase (增加) the risk of heart\ndisease (疾病) and other health problems.\
    \ On the other hand, eating more vegetables and plant-based food provides (提\n\
    供) important vitamins (維他命) and fiber (纖維), which help keep the body strong and\
    \ healthy.\n     Some people also don’t eat meat for ethical (道德) reasons. They\
    \ believe that eating less meat helps protect (保護)\nanimals from suffering (受折磨).\n\
    \     Meat-free meals can be delicious! There are many tasty options (選項), like\
    \ vegetable stir-fry, pasta with tomato\nsauce, lentil soup, or bean tacos. Trying\
    \ new plant-based meals can be fun and healthy.\n     Would you try a Meat-Free\
    \ Day? It’s a small change that can make a big difference for the planet, animals,\
    \ and your\nhealth!"
