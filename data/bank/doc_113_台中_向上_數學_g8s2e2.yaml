- id: doc_113_台中_向上_數學_g8s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: '以下是「過線外一點作垂線」的尺規作圖步驟：

    (1) 已知直線 $L$ 與線外一點 $P$，先以 $P$ 點為圓心，適當長為半徑畫弧，弧與直線 $L$ 交於 $A$、$B$ 兩點。

    (2) 分別以 $A$、$B$ 為圓心，大於 $\frac{1}{2}\overline{AB}$ 的相同長度為半徑，分別畫出兩弧交於 $Q$ 點。

    (3) 連接 $\overleftrightarrow{PQ}$。


    以上為小翊與小妍對上述的尺規作圖，發表自己的分析結論。則'
  options:
  - label: A
    content: 小翊正確、小妍錯誤
  - label: B
    content: 兩人都正確
  - label: C
    content: 小翊錯誤、小妍正確
  - label: D
    content: 兩人都錯誤 。
