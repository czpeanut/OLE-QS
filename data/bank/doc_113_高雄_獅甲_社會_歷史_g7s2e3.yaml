  section: 1
  number: 33
  type: single
  page: 2
  stem: 語言不僅是溝通的工具，也是文化傳承的載具。臺灣的本土語如族語、客語、臺語等，已有失傳的危機，為此現今政府已展開本土語保存計畫，希望可以延續語言的傳承。請問臺灣本土語的失傳危機是因為何者的緣故？
