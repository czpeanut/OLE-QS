    以當詞人登上鎮江的北固樓時，心境應為何者?'
  options:
  - label: A
    content: 莫聽穿林打葉聲，何妨吟嘯且徐行
  - label: B
    content: 花明月黯籠輕霧，今宵好向郎邊去
  - label: C
    content: 故國夢重歸，覺來雙淚垂
  - label: D
    content: 老驥伏櫪，志在千里。烈士暮年，壯心未已。
