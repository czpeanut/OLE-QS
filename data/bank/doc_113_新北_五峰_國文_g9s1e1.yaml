  group_stem: "長沮、桀溺耦(1)而耕，孔子過之，使子路問津焉。長\n沮曰：「夫執輿者為誰？」子路曰：「為孔丘。」曰：「是\n魯 孔丘與？」曰：「是也。」曰：「是知津矣。」問於桀\n\
    溺，桀溺曰：「子為誰？」曰：「為仲由。」曰：「是魯\n孔丘之徒與？」對曰：「然。」曰：「滔滔者天下皆是也，\n而誰以易之？且而與其從辟(2)人之士也，豈若從辟世之士\n\
    哉？」耰(3)而不輟。子路行以告。夫子憮然曰：「鳥獸不\n可與同群，吾非斯人之徒與而誰與？天下有道，丘不與易\n也。」 \n〔注釋〕 \n(1) 耦：並耕。\
