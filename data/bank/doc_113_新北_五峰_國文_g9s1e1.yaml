- id: doc_113_新北_五峰_國文_g9s1e1_s1_30
  section: 1
  number: 30
  type: single
  page: 3
  stem: '根據本文，同溫層是指「既有的信念、態度不斷的在傳

    播過程中被__________。」句中畫線處應填入下列何者最

    恰當？'
  options:
  - label: A
    content: 降溫或失效
  - label: B
    content: 塌陷或消失
  - label: C
    content: 放大或強化
  - label: D
    content: 縮小或弱化。
  group_stem: "同溫層效應是中文的講法，在英文稱作是echo \nchamber，香港翻譯為「迴音室效應」或「回音室效應」，\n以聲音在封閉的室内不斷迴響作為比喻，也就是在同質性\n\
    高的封閉團體內，既有的信念、態度不斷的在傳播過程中\n被__________。 \n  網路興起作為閱聽人傳播與接收訊息的主要管道之\n後，因為社群媒體的發展，同質性高的個人很容易在虛擬\n\
    空間中聚集成為團體，所謂「部落化」。特定社群或虛擬\n團體中流傳的資訊，與大眾媒體提供各式各樣的訊息相\n比，就顯得單一與偏頗。現今許多人只看友人轉貼的新聞，\n\
    這些被轉貼的新聞本就傾向於「獨沽一味」，不夠全面。\n加上網路各項運用的演算法會從個人過去的使用或搜尋歷\n史中，自動篩選提供相類似的訊息，傳統媒體的編輯功能\n\
    被網路演算法的「過濾氣泡」所取代。這種個人化的資料\n過濾功能，會讓使用者活在自己的世界。在這樣不斷自我\n增強迴路的閱聽環境中，個人的觀點或立場會不斷被強\n\
    化，甚至趨於極端，更加惡化選擇性接觸媒體内容的問題，\n對「合胃口」的極端觀點假新聞，也就當作是真的。為降\n低社群同溫層效應的影響，整合性新聞平臺應該要把不同\n\
    觀點的報導同時呈現，以提供大眾更多元的觀點，閱聽人\n也應該要避免相互取暖的狀況。（節錄自江志堅、陳才 相\n互取暖：社群傳播的同溫層效應）"
  tags:
