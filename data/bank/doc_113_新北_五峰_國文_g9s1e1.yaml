- id: doc_113_新北_五峰_國文_g9s1e1_s1_28
  section: 1
  number: 28
  type: single
  page: 3
  stem: '「人類的聰明，就在於他們創造了語言，並且玩著各種

    語言的花樣。這些語言的花樣逐漸脫離了真實的事物，也

    脫離了誠懇的心意，而編織成一片如煙似霧的假象。人類

    的愚蠢，也就在於逐漸不去揭開這層假象，而寧可先入為

    主地就認定它是真的。因此，不思不想，就隨著這層假象

    的翻覆，而哭哭笑笑起來。」這段文字的含義，與下列何

