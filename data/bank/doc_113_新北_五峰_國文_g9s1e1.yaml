  - label: B
    content: "黯鄉魂，追旅思，夜夜除非，好夢留人睡。明月樓高  \n休獨倚，酒入愁腸，化作相思淚"
  - label: C
    content: "金風細細，葉葉梧桐墜，綠酒初嘗人易醉，一枕小窗  \n濃睡"
  - label: D
