- id: doc_112_彰化_埤頭_社會_歷史_g9s2e2_s1_46
  section: 1
  number: 46
  type: single
  page: 3
  stem: 「赤崁夕照」這古色古香的古蹟，是台灣曾受何國的統治留下的歷史紀錄？
  options:
  - label: A
    content: 荷蘭
  - label: B
    content: 英國
  - label: C
    content: 西班牙
  - label: D
    content: 葡萄牙。
  group_stem: '◎蘇麗麗暑假想來趟時空之旅，探訪臺灣的歷史古蹟。

    首站她先到臺南「赤崁夕照」蘇麗麗欣賞這古色古香的古蹟，隨後前往著名的「億載金城」，緬懷當時建造她保衛護臺灣的歷史人物。蘇麗麗也是個鐵道迷，於是她搭火車北上到台中，來到清水國小，據說這是一所古蹟國小前身是清水公學校，校園保留了日治時代的日式宿舍群、老教室和古鐘樓，很有味道。蘇麗麗離開台中往台北前進，來到藍色公路，沿著基隆河，過了松江大橋與高速公路，前方正是台北市的地標---圓山飯店。從淡水坐了渡輪，來到對面觀音山下的八里。在此地有一座史前博物館，館內陳列著先民的「玻璃珠」遺物；最後蘇麗麗捷運到淡水探訪紅毛城，結束一場豐富的古蹟旅行。請依上文回答46-50題'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
