  type: single
  page: 1
  stem: 近年臺灣本土意識上揚，部分地區也討論是否要調整行政區名稱以找回居民的認同，原住民族基本法通過後，第一個申請正名通過的是 2008 年高雄縣「三民鄉」正名為「那瑪夏鄉」（Namasia）。文中「三民鄉」的更名是基於何項緣由？
