    content: 高頻率的聲波
  - label: B
    content: 震動音波
  - label: C
    content: 一樣快
  - label: D
    content: 無法比較。
  group_stem: "4. 請在閱讀下列敘述後，回答下列問題：\n   大象彼此間的溝通，除了用高頻率的叫聲外，還會使用另一種方式，可以把訊息傳遞到很遠之處。史丹佛大學研究團隊做了一些研究，發現大象除了用叫聲來傳遞訊息之外，還會用踩踏地面產生的震動音波來進行溝通，這些聲波是低於\
    \ 20 赫茲的次聲波，能傳到 16 公里至 32 公里之外，他們是怎麼知道的呢？\n  研究人員分別在納米比亞和肯亞兩地錄下獅子靠近象群時，象群反應所發出的次聲波，研究人員再將這兩種不同的次聲波傳送給位於納米比亞活動的象群，象群的反應先是嚇一跳，牠們以為有獅子出沒，接下來象群立刻圍成緊密的圈子，開始保護小象。\n\
    \  由上可知，當大象遇到危險，或是和群體走散時，牠們可藉由土壤傳遞地震式的通訊，後來有研究指出大象腳底有感覺接收器來接收震波而得到一些消息。另外，大象的耳朵也有特殊構造，能夠隔絕空氣中的噪音，專心分析收到的低頻聲波。"
