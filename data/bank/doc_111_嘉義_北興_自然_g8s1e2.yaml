  group_stem: "2. 請在閱讀下列敘述後，回答下列問題：\n  光束遇到平面鏡會發生反射現象，傳播方向發生改變，因此平面鏡除了可來成像，讓人修整儀容外，還可以用來改變光路徑。\n\
