- id: doc_113_新北_丹鳳_社會_g8s2e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 此作物的原產地位於哪一個國家？
  options:
  - label: A
    content: 肯亞
  - label: B
    content: 坦尚尼亞
  - label: C
    content: 衣索比亞
  - label: D
    content: 象牙海岸
  group_stem: '請閱讀文章，回答下列問題：

    一杯手沖咖啡賣多少錢？在台灣，從50 元到200 元的價位都有。然而，消費者每買一杯咖啡，非洲

    農夫平均僅能賺到0.25 元台幣。這是因為除了採摘和水洗這些簡單的加工外，咖啡還需要經過烘焙、提味、包裝、運輸丶製作商標和行銷廣告等多個環節。每個環節由不同的中間商而轉手，價格就會往上疊加。由於農民缺乏技術且無議價能力，長期以來，他們只能以低價將咖啡豆賣給西方企業。

    如果你也願意一起幫助農夫，購物時請尋找有「公平貿易認證標章」的產品。由於這些產品拒絕以低價向農夫收購原料，因此價格通常不是最便宜的，但這些認證產品能將合理的收益分配給農夫，而不是讓中間的轉手廠商獲取暴利。更進一步，希望能藉由貿易取得的利潤，推動保障當地孩童與婦女的措施，例如：興建學校、鼓勵婦女受教育、取締雇用童工的企業…等。請記得，你每一次的消費，都是你對「世界的未來」投下的一票！'
  shared_asset: g1_14_16
  tags:
    chapter:
