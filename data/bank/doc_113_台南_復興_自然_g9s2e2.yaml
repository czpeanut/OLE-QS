- id: doc_113_台南_復興_自然_g9s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 假設某種植物花朵顏色的性狀是由一對遺傳因子（等位基因）控制，R為顯性，r為隱性。有甲、乙兩株此種植物，已知甲植株的基因型是rr，今用乙植株的花粉來使甲植株受精，產生了1080株子代，其中509株為隱性性狀。根據遺傳的法則判斷在此受精作用中，卵和精細胞中所含控制花朵顏色的遺傳因子最可能為何？
  options:
  - label: A
    content: 卵：R或r；精細胞：r
  - label: B
    content: 卵：R；精細胞：r
  - label: C
    content: 卵：R或r；精細胞：R
  - label: D
    content: 卵：r；精細胞：R或r
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_台南_復興_自然_g9s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 市場販賣之蚵仔泡水的原意，是避免擠壓與碰撞，同時適度的保鮮，但現今有攤販將蚵仔泡淡水以增重的投機作法，而泡在淡水中的蚵仔會流失養分和甜味，牛磺酸等游離胺基酸也都會釋出，十分可惜。牡蠣殼中的原汁是1.5%-2.5%的鹽含量，則下列關於蚵仔的保存方式，何者最為適當？
  options:
  - label: A
    content: 泡在3%鹽水中，以吸收更多的游離胺基酸增加營養
  - label: B
    content: 泡在2.5%鹽水中，使蚵仔能吸更多水以增加重量
  - label: C
    content: 泡在2%鹽水中，使滲透進蚵仔和滲透出蚵仔的水大致平衡
  - label: D
    content: 泡在1%鹽水中，使滲透進蚵仔的水多於滲透出蚵仔的水
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
