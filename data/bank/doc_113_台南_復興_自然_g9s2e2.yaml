  stem: '豬體內沒有可以分解穀物中含磷分子的酵素，臺灣大學的研究團隊透過生物技術改造豬隻的遺傳物質培育出「環保豬」，讓豬具有特殊基因，可分泌植酸酶與纖維素分解酶，能轉化、吸收穀物中的含磷分子，降低豬糞中的有機磷含量，減少豬糞的臭味及對環境的污染。

    關於「環保豬」可分泌植酸酶與纖維素分解酶，最可能是運用下列哪一項生物技術所致？'
  options:
  - label: A
    content: 在正常豬隻個體中篩選、培育
  - label: B
    content: 基因轉殖
  - label: C
    content: 複製生物
  - label: D
    content: 組織培養
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
