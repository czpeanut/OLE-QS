  stem: 台灣中央山脈的地質以板岩為主，夾有淺層或中層變質砂岩、大理岩層。以下兩張相片中為中央山脈北段南湖大山山塊的陶賽峰與南湖東南峰，在上述兩地點可見大理岩以及層狀板岩。請問下列敘述哪一項正確？
