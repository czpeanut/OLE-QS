  stem: '已知珊瑚礁的鈣化過程中，鈣離子（$\text{Ca}^{2+}$）和碳酸根離子（$\text{CO}_{3}^{2-}$）反應，會生成碳酸鈣（$\text{CaCO}_{3}$）。反應式為：

    $\text{Ca}^{2+} + \text{CO}_{3}^{2-} \underset{\text{逆反應}}{\overset{\text{正反應}}{\rightleftharpoons}}
    \text{CaCO}_{3}$

    由於海洋酸化的影響，碳酸根離子的濃度會隨著時間變化，導致鈣化速率發生變化。在一個模擬海洋環境的實驗裝置中，當裝置中的pH值和鈣離子濃度穩定後，碳酸鈣的沉澱速率也趨於穩定不再改變。關於沉澱速率不再改變時，反應速率的說明，下列何者正確？'
  options:
  - label: A
    content: 正反應速率等於逆反應速率，且速率為0
  - label: B
    content: 正反應速率等於逆反應速率，且速率不為0
  - label: C
    content: 正反應速率不等於逆反應速率，且兩速率均不為0
  - label: D
    content: 正反應速率不等於逆反應速率，且其中一速率為0
