  stem: '台灣在發電的選擇上，這十年來主要是減少燃煤發電，增加燃氣發電（天然氣）。在這段能源轉型的過程中，空氣品質因為減少燃煤的各種粒狀汙染物而略有進步。而以燃氣代替燃煤，雖然減少二氧化碳排放的總量，但是天然氣運送過程中的洩漏，卻也帶來另一項更嚴重的溫室效應氣體作用。因天然氣的全球暖化潛勢，是二氧化碳的81.2倍，意即天然氣比起二氧化碳，在相同質量下，對[　　]的吸收能力更為強大，以致溫室效應更為明顯。

    請問[　　]內主要是指什麼？'
  options:
  - label: A
    content: 太陽輻射中的可見光
  - label: B
    content: 太陽輻射中的紅外線
  - label: C
    content: 地表輻射中的可見光
  - label: D
    content: 地表輻射中的紅外線
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
