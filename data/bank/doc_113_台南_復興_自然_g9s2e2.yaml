- id: doc_113_台南_復興_自然_g9s2e2_s1_27
  section: 1
  number: 27
  type: single
  page: 5
  stem: 臭氧（化學式為$\text{O}_{3}$）是一種淡藍色、有刺鼻氣味的氣體。當人體暴露高濃度的臭氧中時會感到不適，影響健康，但大氣層中的臭氧層卻可吸收輻射到地球的紫外線，達到保護的作用。已知臭氧層的形成，是因大氣中的氧氣受到高能量的輻射分解為氧原子，氧原子再與另一個氧分子結合成臭氧。上述中的「氧原子、氧氣、臭氧」依據物質的分類，分別屬於哪一類？
  options:
