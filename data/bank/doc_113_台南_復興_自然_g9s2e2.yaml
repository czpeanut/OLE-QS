  stem: 乳酸是一種常見的成分，廣泛存在於發酵食品和運動後的肌肉中，化學式為$\text{C}_{3}\text{H}_{6}\text{O}_{3}$，分子中含有一個$-\text{COOH}$原子團和一個$-\text{OH}$原子團，是運動後肌肉酸痛的來源，也常作為食品添加劑。在食品發酵過程中，乳酸菌會將葡萄糖轉化為乳酸，導致食品的酸度增加。關於乳酸的說明，下列何者正確？
