  section: 1
  number: 16
  type: single
  page: 2
  stem: 有關無性生殖與有性生殖的比較何者錯誤？
  options:
  - label: A
    content: 無性生殖：只會發生細胞分裂，繁殖速度較慢；有性生殖：只會發生減數分裂，繁殖速度較快
  - label: B
    content: 無性生殖：不會發生配子結合；有性生殖：會發生配子結合
  - label: C
    content: 無性生殖：子代與親代的特徵相同；有性生殖：子代與親代的特徵差異較大
  - label: D
    content: 無性生殖：環境改變時，容易被淘汰；有性生殖：環境改變時，適應力較高
