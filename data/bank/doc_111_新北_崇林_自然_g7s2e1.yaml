    在台灣本島及一些離島可找得到野生種香蕉，不同於我們常吃的栽培種香蕉，這些野生種儘管粗細不一，但通常較短。若正值結果期，不妨掰開果實觀察，可以看到果肉充滿又黑又硬、大小如木瓜籽、形狀不規則的種子。

    至於我們吃的香蕉，是如何從果肉中有種子的野生種變成沒有種子的栽培種？

    香蕉屬於芭蕉科植物，約從5,000 萬年前左右在陸地上開始出現，直到某一天，有些香蕉植株發生天然的基因變異，讓果實不再充滿種子，此特性用現在的術語來說，就是不需經由授粉或其他刺激的單性結果（vegetative
    parthenocarpy）。之後，這類會單性結果的香蕉又再度發生基因變異，雌蕊逐步演化為胚珠發育不完全，或沾附於雌蕊柱頭上的花粉無法伸入花柱與胚珠結合，這時就產生了果肉中完完全全沒有種子的香蕉。隨後人們廣為傳播與選拔，便造就了現今各式各樣的栽培種；那麼，栽培種香蕉又為何長短粗細不一呢？

    這主要是因遺傳組成與染色體套數的不同。一般而言，行有性生殖的生物會從雌雄親代各得到一套染色體，形成二倍體生物(也稱為雙套染色體生物)，當生物體內擁有多於雙套染色體，便形成所謂的多倍體生物。這種情形在動物界並不多見，但在植物界相當普遍，開花植物中有30~70％即為多倍體生物。多倍體的植株形態表現的優勢性狀常超越親代或祖先，其根、莖、葉、花及果實等器官都要比原二倍體植株更為粗大，適應環境的能力也較強。我們在市場上見到的一些較短或細的香蕉，例如蛋蕉和美人蕉，即為二倍體；而我們最常吃的北蕉和芭蕉則是三倍體，因此看起來較粗也較長。'
