  section: 1
  number: 33
  type: single
  page: 2
  stem: 基督教的主要經典是《聖經》，內容包含《舊約》和《新約》。前者從耶和華如何創世開始，然後講述早期猶太人的歷史及先知的預言。後者則記載耶穌與門徒傳道的經過。下列關於基督教的敘述，何者正確？
  options:
  - label: A
    content: 日耳曼人受到基督教的影響，成立羅馬公教
  - label: B
    content: 在中世紀的西歐，教會成為人們生活的中心
  - label: C
    content: 羅馬皇帝查士丁尼曾下令禁教並迫害基督徒
  - label: D
    content: 依基督教歷史記載，耶穌後來成為唯一真神。
