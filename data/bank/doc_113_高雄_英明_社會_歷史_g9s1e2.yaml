  section: 1
  number: 29
  type: single
  page: 1
  stem: 發生於16 到17 世紀間的宗教改革，許多新教派的出現改變了羅馬公教在歐洲獨大的局面，促使基督教世界分裂，對近代歐洲發展影響深遠。以下為同學們就宗教改革提出的看法，請問：何者敘述正確？
  options:
  - label: A
    content: 吉伊：各教派理念不合爆發戰爭，最後由羅馬公教掌控歐洲政局
  - label: B
    content: 小八：舊教肯定工作的價值，廣受工商業者支持，有助經濟成長
  - label: C
    content: 莫莫咖：新教主張由教會解讀聖經，再向信徒講授有助教育普及
  - label: D
    content: 烏薩奇：各國紛紛制定宗教寬容的法規確立了宗教信仰的自由。
