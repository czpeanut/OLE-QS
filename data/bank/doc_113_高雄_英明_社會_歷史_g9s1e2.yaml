  section: 1
  number: 26
  type: single
  page: 1
  stem: 小悟老師打算透過虛擬實境體驗的形式，帶領同學走入在歷史課堂上所提到，建造於西元6 世紀的「聖索菲亞大教堂」。為了真實的在虛擬實境中還原這座號稱「改變了建築歷史」的宗教建築。小悟找尋了許多關於「聖索菲亞大教堂」的歷史資料。下列關於這些資料的敘述，何者內容有誤？
