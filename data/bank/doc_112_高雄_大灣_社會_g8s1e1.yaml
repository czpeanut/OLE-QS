  type: single
  page: 4
  stem: 此時期中國文字開始成為東亞等國文字的藍本，圖 1 呈現片假名採取漢字楷書偏旁、平假名則摹仿漢字草書，請問圖 1 應是圖 2 中哪一地區模仿漢字而逐漸形成的文字？
