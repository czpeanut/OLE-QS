  group_stem: '請閱讀下列資料後回答問題。


    所謂的「東亞文化圈」是指唐代文化內涵豐富影響周邊民族。在七世紀中葉各國都不約而同的向唐朝進貢，更有定期派遣使節學習唐朝的典章制度，希望建立起中央集權的君主制國家。


    東亞文化圈的另一個顯著特點就是文字的傳播，中國文字開始成為東亞等國文字的藍本(如圖1)。


    另外，在宗教方面，□教逐漸與唐文化相互結合，以一種本土化宗教的形式持續發展，透過每年的節日典禮和生婚喪葬儀式滲入人們的日常生活之中，並由此傳入東亞，也使得唐朝重新構建起一個獨特的東亞□教的傳播中心。」'
