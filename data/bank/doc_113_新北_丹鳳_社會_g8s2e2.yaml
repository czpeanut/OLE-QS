  - label: C
    content: 袁世凱
  - label: D
    content: 孫中山。
  group_stem: '＊秉毅節錄了他最近讀的一本書，書中提到：

    1. ……光緒三十四年舊曆十一月初九，舉行了「登極大典」。這個大典被”我”哭得大煞風景。……父親急得滿頭是汗。文武百官的三跪九叩，沒完沒了，”我”的哭叫也越來越響。父親只好哄”我”說：「別哭別哭，快完了，快完了！」

    2. 那天”我”穿的是西式大禮服，行的是鞠躬禮。在日本要人的旁觀下，眾「元勛」們向我行了三鞠躬，……。臧式毅和張景惠二人代表「滿洲民眾」獻上了用黃綾包裹著的「執政印」。鄭孝胥代念了「執政宣言」……由於”我”專往稱心如意的方面想，……而且把「執政」的位置看成了通往「皇帝寶座」的階梯。'
