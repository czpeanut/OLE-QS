  stem: 烏魚對臺灣漁民而言是得天獨厚的恩賜，烏魚隨著洋流洄游至臺灣附近，每年冬至前後十天，是臺灣漁民最忙碌的日子。由於烏魚的經濟價值高，漁民出海捕烏魚如果收穫不錯，就可以過一個快樂的新年，所以烏魚又有「烏金」之稱。請問：若依上文中敘述的烏魚習性，烏魚冬至前後隨著哪一股洋流洄游至臺灣附近？
