  stem: 為了提高產業競爭力，臺灣目前有許多地方將農漁牧業轉型發展，結合觀光遊憩，提供民眾休閒體驗。例如：每年的5〜7月是民眾參與屏東黑鮪魚文化觀光季的時節。下列何項觀光休閒的農漁牧業活動，和屏東黑鮪魚季一樣有季節限定？
