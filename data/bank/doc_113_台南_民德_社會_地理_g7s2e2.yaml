  group_stem: (二)「西元1966年，臺灣第一個加工出口區『高雄加工出口區』成立，打下臺灣經濟成長的基礎。一條條生產線，製造出電子、皮革、鞋業、玩具等各類產品，並外銷出口。臺灣在此時期成立的幾個加工出口區，如楠梓加工出口區、臺中加工出口區等，曾雇用將近10萬人，下班時蜂湧而出的腳踏車、機車大隊，蔚為奇觀。一九九○年代，其榮華開始衰退，許多廠房關廠、歇業，加工出口區一度只剩下5萬名員工，減少了40％。西元2005年後，新產業開始陸續進駐，如臺中市潭子區的愛普生(EPSON)、高雄市楠梓區的夏普與前鎮區的日立，加工出口區逐漸形成一個新的光電科技聚落，與以往的面貌大為不同。」請問：
