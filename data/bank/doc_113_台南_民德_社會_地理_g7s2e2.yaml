  group_stem: (三) 位於宜蘭縣三星鄉的「行健有機夢想村」擁有得天獨厚的環境，鄰近山脈提供礦物質豐富的肥沃土壤，成為發展有機村的好地方。這裡是農夫平均年齡65歲的傳統農村，一開始要投入有機生產就非常不容易，年屆60歲的前村長認為，有機農業是農村未來的發展希望，耗盡心力慢慢說服一些稻農加入，這才開啟有機耕種的序幕。而如何銷售種植的有機米，行銷通路成為新挑戰，透過與政府、企業契作認購、網路平臺宣傳，讓行健村的有機米交出漂亮的成績單。同時舉辦經營管理、創意行銷、導覽解說等培訓課程，致力提升當地農民的行銷能力，並規畫稻米、青蔥、野菜、茭白筍等作物的有機示範田，吸引消費者來參與體驗，逐漸推動行健村朝一具有生態、生產與觀光多方面功能的有機村邁進。請問：
