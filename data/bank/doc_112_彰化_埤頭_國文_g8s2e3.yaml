  number: 4
  type: single
  page: 1
  stem: 「綠建築是指：消耗最少地球能源及資源，製造最少廢棄物，具有生態、節能、健康特性與減廢的建築物。必須是以人生活的健康、舒適為原則，對於居住環境進行全面性、系統性的環保設計。」下列關於綠建築的敘述，何者正確？
  options:
  - label: A
    content: 綠建築多使用植物做為建材，呈現多樣化的生態
  - label: B
    content: 綠建築多為客製化，以小空間設計為主
  - label: C
    content: 綠建築主打耐久性，建築物能歷久不衰
  - label: D
    content: 綠建築的設計以人為原點，必須能住得舒服
