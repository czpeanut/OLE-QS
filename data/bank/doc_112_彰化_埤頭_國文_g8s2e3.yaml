- id: doc_112_彰化_埤頭_國文_g8s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 「學習新知識都需要有先驗知識的基礎。如果你做的只是機械性的重複，沒錯，你很快就會碰到記憶的極限。然而，如果你練習詳細闡述，學習將沒有上限。詳細闡述是指利用自身的方式表達新的素材，並將它與已知的東西連結起來，因而賦予新素材意義的一種過程。愈能解釋新學到的東西與先驗知識的關連方式，對於新學到的東西就了解得愈穩固，而且你創建的更多關連性，將來會幫助你記住這些新知識。」下列何者最符合本文主旨？
  options:
  - label: A
    content: 聯想是學習的最佳方法
  - label: B
    content: 不同人應選擇不同的學習方法
  - label: C
    content: 重複練習能將新知識記憶得越穩固
  - label: D
    content: 將所學與日常已知經驗結合可以幫助你記得更久
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
