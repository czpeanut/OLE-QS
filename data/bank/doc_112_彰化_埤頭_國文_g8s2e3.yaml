- id: doc_112_彰化_埤頭_國文_g8s2e3_s2_33
  section: 2
  number: 33
  type: single
  page: 3
  stem: 「在別人身上看到的也盡是些瘡疤」中「瘡疤」指的是什麼？
  options:
  - label: A
    content: 疤痕
  - label: B
    content: 缺點
  - label: C
    content: 如意
  - label: D
    content: 罪惡
  group_stem: '2. 認識自己 逸苓

    我們常常會對自己不滿意，對自己的短處特別敏感，覺得自己的智力、體力和外表不如人，怨恨上天不公平。我們對於所處的環境和遭遇的事事物物，更是充滿了不滿意，在別人身上看到的也盡是些瘡疤。於是，我們覺得這真是個灰色世界，心中充滿了空虛、失望和憎恨。其實，我們若能換一個角度來看，認清我們所擁有的，慢慢地就會看到真正的自己，發現自己的特點，欣賞自己，尊重自己，也會去利用每一個機會，發揮自己的潛力了。

    世界的美與醜，完全取決於我們自身的看法。你認清了自己，對自己有信心，就更有力量去創造一個更美好的世界了！'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
