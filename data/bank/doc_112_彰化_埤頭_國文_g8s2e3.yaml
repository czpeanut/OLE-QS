- id: doc_112_彰化_埤頭_國文_g8s2e3_s2_31
  section: 2
  number: 31
  type: single
  page: 3
  stem: 從本文可知，在運動後補充下列何種飲品之修復效果最佳？
  options:
  - label: A
    content: 汽水
  - label: B
    content: 黑糖水
  - label: C
    content: 無糖咖啡
  - label: D
    content: 巧克力牛奶
  group_stem: '1. 不是運動飲料也不是水！運動後喝什麼是最佳選擇？

    過去運動後多半建議，吃（或喝）碳水化合物和電解質，或是加點蛋白質質就夠，但組合起來，什麼才是最佳飲料？發表在歐洲臨床營養期刊（European Journal
    of Clinical Nutrition）的研究提出解答。

    研究者分析了12個小型研究發現，相較於運動飲料和安慰劑，巧克力牛奶在運動後修復的幾個指標都領先。

    相關指標有：運動多久之後力竭、運動自覺強度、心律、乳酸、血液中稱為肌酸激酶的酵素等。整體來說，研究發現，巧克力牛奶和其他飲料相比，可以延長力竭的時間，提升自覺強度、心律和乳酸的表現等。

    資深研究員沙勒奇阿巴古維（Amin Salehi-Abargouei）對路透社說，「巧克力牛奶含有醣類、蛋白質、脂肪、多酚、電解質，和一些維生素，對運動選手而言，是修復的好選擇」。

    從巧克力牛奶的成分來看，除了乳糖，巧克力牛奶通常也會添加糖，加上牛奶裡的乳清蛋白和酪蛋白，是修復肌肉的完美組合。運動出汗也會導致電解質流失，巧克力牛奶也含有些微的鈉，幫助肌肉神經傳導。

    巧克力裡也有可可多酚，可以抗氧化，有助於清除發炎帶來的自由基。另外，牛奶裡還有鈣、維生素D，也有助於肌肉、骨骼修復。'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
