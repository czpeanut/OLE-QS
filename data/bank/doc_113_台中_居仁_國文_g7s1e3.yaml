- id: doc_113_台中_居仁_國文_g7s1e3_s5_59
  section: 5
  number: 59
  type: single
  page: 4
  stem: 下列有關各地異獸被后羿殲滅或捕捉的地點與名稱，何者敘述正確？
  options:
  - label: A
    content: 到北方疇華旱地荒野殺了傳說中的野獸——鑿齒
  - label: B
    content: 在中原一帶的桑林擒獲外觀像龍首的野豬——封豨
  - label: C
    content: 在青丘大澤射殺振翅能引發地震的風神——大風
  - label: D
    content: 在凶水斬殺了傳說長著九個腦袋的水火怪——九嬰
  group_stem: "堯之時，十日並出，焦禾稼，殺草木，而民無所食。猰貐①、鑿齒②、九嬰③、大風④、封豨⑤、修蛇⑥皆為民害。堯乃使羿誅鑿齒于疇華⑦之野，殺九嬰于凶水之上，繳⑧大風於青丘之澤，上射十日而下殺猰貐，斷修蛇於洞庭，禽⑨封豨于桑林⑩。萬民皆喜，置堯以為天子。於是天下廣狹險易遠近始有道里⑪。\n\
    \                           （淮南子 本經訓）\n【注釋】①猰貐：音ㄧㄚˋ ㄩˇ，古代傳說中的吃人猛獸，形狀似龍首，或說像狸，善跑，叫聲似嬰兒啼哭。\
    \ ②鑿齒：古代傳說中的野人，齒長三尺，其狀如鑿。 ③九嬰：傳說中的長著九個腦袋的水火怪。 ④大風：一種極兇猛的大鳥，飛過後能壞人房屋，被視為風神。 ⑤封豨：一種大野豬。豨，音ㄒㄧ。\
    \ ⑥修蛇：大蛇。 ⑦疇華：位於南方的水澤名。 \n⑧繳：用繫著絲繩的箭來射鳥。 ⑨禽： 同「擒」，捕捉。 \n⑩桑林：古地名。相傳為商湯祈雨的地方。⑪道里：道路。"
