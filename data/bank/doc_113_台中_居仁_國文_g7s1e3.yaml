  group_stem: "有一回，和一個喜歡畫畫的朋友聊天。我知道，所有藝術的追尋都是極為辛勞的。石濤提出「搜盡奇峰打草稿」的主張，白石老人則以「天道酬勤」為座右銘而自勉，這般的勤奮不懈，真值得我們讚美和學習。到底繪畫上的成就絕非朝夕倖致，那是一輩子的事。\n\
    \  朋友笑了起來：「有哪樣不是一輩子的事呢？書法、寫作、研究發明……都是的啊！」\n  想想也真是這樣。凡事如果淺嘗輒止，「一日曝之，十日寒之」，想要有所成，無異於緣木求魚。\n\
    \  堅持是必須的，也唯有持續不懈的努力，方能日起有功。不要輕忽所有的渺小微物，涓滴流注以成江河，土石堆積以成大山。重要的，在於堅持一念，所謂「吾心信其可行，則移山填海，終有可成之日」，也無非就是印證。\n\
    \  堅持也是辛苦的，因此，多的是半途而廢的人，終使前功盡棄，徒勞無功，真令人感到惋惜。相形之下，對於那些能「持其志，毋暴其氣」堅忍以圖成的人，我們總給予由衷的敬佩。他們以超凡的毅力和耐心，衝破重重的艱難險阻，終於攀越了人生的高峰。\n\
    \  現代的人喜歡立竿見影，過於急功近利的結果，常易陷入膚淺的追求，講究表面的包裝，忽略實質的內涵，目光如豆，缺乏遠大的見識和胸襟。慢慢的，不耐煩於理想的實踐，至此，人生再也無夢，更遑論要築夢成真了，想來可悲。\n\
    \  堅持生命裡的理念，做一個君子，的確要有所為，也有所不為的。鐘鼎山林，人各有志，原本無可強求。而我一直認為：人生苦短，一定要活得有意義、有價值，方才不負此生。\n\
    \  梅花香自苦寒來。傑出的表現、輝煌的成績，常是經歷了無數艱苦的磨練，鍥而不捨的勤學，才得以獲取成功的冠冕。                      \
    \      （琹涵 堅持）"
