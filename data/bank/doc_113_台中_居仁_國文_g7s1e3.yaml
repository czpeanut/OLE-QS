- id: doc_113_台中_居仁_國文_g7s1e3_s5_53
  section: 5
  number: 53
  type: single
  page: 3
  stem: 根據上文，文中的「大人」是用怎樣的態度，來面對主角小時候的創作？
  options:
  - label: A
    content: 沉默以對，不願表達任何看法
  - label: B
    content: 火冒三丈，責備主角浪費時間
  - label: C
    content: 期盼實際，希望主角能用心於課業
  - label: D
    content: 讚嘆不已，鼓勵主角繼續發揮創意
  group_stem: "六歲時，我在一本描寫原始森林的書《真實的故事》中，看到一幅奇特的畫，那是一張蟒蛇正要吞噬獵物的圖。書上說：「蟒蛇不咀嚼獵物，而是直接吞下去，接著，牠動也不動的睡上六個月，並在睡眠時消化獵物。」\n\
    \  這使我陷入對叢林探險的幻想，於是我用彩色鉛筆完成生平第一幅畫。這就是我的一號作品\n\n  我把這幅傑作拿給大人看，問他們覺不覺得可怕，他們卻回答：「一頂帽子有什麼可怕的？」\n\
    \  我畫的不是帽子，而是正在消化大象的蟒蛇。為了讓大人了解我的畫，我又畫了蟒蛇的透視圖。大人總是需要別人為他們做解釋。\n  我的二號作品就像這樣\n\n\
    \  這次，大人則是勸我，與其畫這些東西，不如把心思放在地理、歷史或算術上。就這樣，我在六歲時放棄了成為畫家的美好理想。一號作品和二號作品的失敗，令我十分傷心。大人們從來不靠自己去了解事情，總是需要別人跟他們說明，這對小孩子來說，實在不是普通的累。\
    \         （節選自安東尼．聖修伯里 小王子）"
