  stem: 10.下列關於拉奧的敘述，何者最能呈現她是一位「非典型」科學家？
  options:
  - label: A
    content: 從眾多或人中脫穎而出，獲得「年度風雲兒童」殊榮。
  - label: B
    content: 12 歲時，發明可攜式快速而低成本的鉛汙染水的檢測技術，解決鉛污染的問題。
  - label: C
    content: 不只致力發明科學裝置，且能激發並鼓舞他人，發揮正面影響力。
  - label: D
    content: 推出具有自主偵測功能的應用軟體，降低青少年的網路霸凌問題。
