- id: doc_111_高雄_大灣_國文_g7s1e2_s3_25
  section: 3
  number: 25
  type: single
  page: 3
  stem: 「人生最可怕的是，錯置。所謂錯置，就是搞不清楚自己是誰或想成為什麼樣的人，沒有獅子的能力、地位，卻想過獅子的生活。」請問何種心態不是造成「錯置」的原因？
  options:
  - label: A
