- id: doc_111_高雄_大灣_國文_g7s1e2_s3_17
  section: 3
  number: 17
  type: single
  page: 2
  stem: '海倫．凱勒說：「我曾與目光炯炯有神的人同行，但是他對海天、市街、書籍，似乎毫無所見。因此我覺得，與其是個能見而不能思考的人，倒不如只用心智在黑夜中摸索前進的人。世上唯一的黑暗，乃是無知和無覺。」

    根據這段文字，下列何者最可能是海倫．凱勒認為「處在黑暗中的人」？'
  options:
  - label: A
    content: 缺乏觀察力且不用心思的傑綸
  - label: B
    content: 只想到自己卻不關心他人的伊林
  - label: C
    content: 失去視力，只能靠摸索才能前行的黃奇
  - label: D
    content: 關在房間不願面對人群的勁藤
  tags:
