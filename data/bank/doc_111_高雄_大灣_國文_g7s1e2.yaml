- id: doc_111_高雄_大灣_國文_g7s1e2_s3_13
  section: 3
  number: 13
  type: single
  page: 2
  stem: '下列有關《論語選》一書的簡介，何者正確？

    | 選項 | | |

    |---|---|---|

    | （A） | 篇數、篇名 | 全書二十篇，各篇通常取首章開頭的二、三字作為篇名，篇名緊扣各篇內容旨意 |

    | （B） | 編輯者 | 由孔子及其弟子和再傳弟子記錄編輯而成 |

    | （C） | 體裁 | 為語錄體，記述孔子和弟子及時人應答談論的內容，並詳載孔子一生的經歷 |

    | （D） | 價值 | 透過本書可了解孔子的中心思想是「仁」，為儒家的重要經典 |'
  options:
  - label: A
    content: 篇數、篇名：全書二十篇，各篇通常取首章開頭的二、三字作為篇名，篇名緊扣各篇內容旨意
  - label: B
    content: 編輯者：由孔子及其弟子和再傳弟子記錄編輯而成
  - label: C
    content: 體裁：為語錄體，記述孔子和弟子及時人應答談論的內容，並詳載孔子一生的經歷
  - label: D
    content: 價值：透過本書可了解孔子的中心思想是「仁」，為儒家的重要經典
