- id: doc_111_高雄_大灣_國文_g7s1e2_s3_19
  section: 3
  number: 19
  type: single
  page: 2
  stem: '「枷」古代加在犯人頸上的木製刑具；「鎖」栓在犯人腳踝的刑具，也就是腳鐐。「枷鎖」引申為束縛的意思。

    下列「」中的字詞，何者不是運用此構詞法？'
  options:
  - label: A
    content: 「憤怒」有如火山，一旦爆發會造成大傷害。
  - label: B
    content: 說話常常自相「矛盾」的人，往往無法說服他人。
  - label: C
    content: 全身關節腫脹，有如戴上一道道無形的「鐐銬」。
  - label: D
    content: 遵守學校既定的「規矩」，是學生的本分。
