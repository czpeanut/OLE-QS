  section: 3
  number: 6
  type: single
  page: 1
  stem: 針對西方名言詮釋《論語》文句的配對，下列何者正確？
  options:
  - label: A
    content: 譬如為山，未成一簣，止，吾止也／一個真正偉大的人，在於知道自己的渺小（西方諺語）
  - label: B
    content: 譬如平地，雖覆一簣，進，吾往也／人們缺乏的不是力量而是意志（法國 雨果）
  - label: C
    content: 與朋友交而不信乎？／要把敬業盡責當作做人的根本，當作做人的靈魂（美國 馬克．吐溫）
  - label: D
    content: 為人謀而不忠乎？／如果要別人誠信，首先自己要誠信（英國 莎士比亞）
