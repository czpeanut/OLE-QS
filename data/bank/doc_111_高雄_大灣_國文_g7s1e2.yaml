- id: doc_111_高雄_大灣_國文_g7s1e2_s3_9
  section: 3
  number: 9
  type: single
  page: 1
  stem: 「我發現各位同學實在太厲害了！裙子可以⼀物多用：天熱當扇子搧風；流汗當毛巾擦汗；雨天頂在頭上當雨傘；桌子髒了還可以當抹布擦；實在妙用無窮啊！」這⼀番訓話，與下面哪⼀句話所用的修辭技巧不相同？
  options:
  - label: A
    content: 我跟你說喔，我今天真是出運了！我的段考成績沒有一科及格，又被老師抓到作業都是抄來的！
  - label: B
    content: 他的開車技術真厲害，居然將車子開到安全島上。
  - label: C
    content: 他的確請大家吃海陸大餐啊！下班帶著大夥兒點了巷口最大盤的蚵仔煎，還外加一碗滷肉飯！
  - label: D
