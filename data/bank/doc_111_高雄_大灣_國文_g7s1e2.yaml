- id: doc_111_高雄_大灣_國文_g7s1e2_s3_16
  section: 3
  number: 16
  type: single
  page: 2
  stem: '期末同樂會班上要排演戲劇節目「東廂記」，劇情介紹如下：

    第一幕：張生赴京趕考，投宿客棧，盤纏不足，被店小二趕走。

    第二幕：張生露宿街頭，感染風寒，病倒路旁，被好心的呂大夫帶回家救治。

    第三幕：張生病癒後，被呂大夫好心留宿家中準備應試。張生對呂大夫的千金一見鍾情。

    第四幕：丫鬟小卉充當紅娘，為二人牽線。張生後來金榜題名，出任百里侯，並抱得美人歸。

    下列哪一個畫面，會是當天大家欣賞節目時所看見的？'
  options:
  - label: A
    content: 第一幕的場景在旅館，張生沒帶錢被強盜擄走
  - label: B
    content: 第二幕看見一位和藹的老醫生為張生治療感冒
  - label: C
    content: 第三幕見到施生對呂夫人心生愛慕，表白心意
  - label: D
    content: 第四幕張生成為媒人，為小卉覓得了如意郎君
