- id: doc_111_高雄_大灣_國文_g7s1e2_s4_7
  section: 4
  number: 7
  type: single
  page: 4
  stem: 7. 根據上述文章，下列敘述何者正確？
  options:
  - label: A
    content: 雙十一購物節能有效提升電商業績，是振興經濟的萬靈丹。
  - label: B
    content: 購物節的業績看似亮麗，實際營收只有檯面上的三分之一。
  - label: C
    content: 行銷資源及衝動購買後的退貨率，皆應納入電商的成本考量。
  - label: D
    content: 雙十一購物節後，消費者的購買力能持續延燒一個月以上。
  group_stem: "近幾年商人們炒熱了光棍節，搖身一變成為了雙十一購物節，無論是業者或是消費者無不摩拳擦掌，想要狠狠的大撈一筆。根據2017 年大陸媒體的報導，雙十一結束後，退貨率高達3\
    \ 成。許多人晚上衝動消費，白天清醒後就退貨，業者的業績並不如公布的亮麗。\n    退貨率將直接影響雙十一的整體銷售金額，對各大電商業者來說都是一個秘密。曾有時尚飾品產業的業者分享，平常的退貨率大約都在10\
    \ %，但雙十一就會達到30%，業內甚至還有飆到40 %至50 %的，都是真實發生的事情。\n    對於各大電商平台來說，不同的貨品退貨率也不一樣，退貨率最高的是服裝、鞋帽、時尚飾品，而諸如\
    \ 玩具、保養品等品項，退貨率則相對較低。\n    但無論是哪一種品項，店家在統計雙十一的實際營收時，也會把退貨率納入成本考量，尤其在於小型電商，除了前期投入的行銷資源，雙十一檔期跟進下殺價格之外，還要再面對雙十一之後的各種問題，例如衝動消費以後，消費者購買能力有限，也需要一個月左右的恢復期。\n\
    \     雙十一不是萬靈丹，當網友進行衝動消費以後，電商業者固然可以在短期內衝高業績，清理庫存，但也必須面對隨之而來的大量客戶評價與退貨，對於電商的人力、倉儲、物流及客服等，都是一大考驗。\n\
    \            \n            (節錄自行銷人 20181126 網路文章〈雙十一後遺症！消費者「先買再說」，退貨率卻是平日 3 倍〉）"
  tags:
    textbook: 七上 語文常識(二) 閱讀導航——策略運用與資訊檢索
