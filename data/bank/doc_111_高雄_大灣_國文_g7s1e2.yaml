- id: doc_111_高雄_大灣_國文_g7s1e2_s4_5
  section: 4
  number: 5
  type: single
  page: 4
  stem: 5. 禿鷹、胡狼吞噬獅子、獵豹的遺骸，這個現象表現出？
  options:
  - label: A
    content: 動物生存的自然法則
  - label: B
    content: 以小搏大的勇士精神
  - label: C
    content: 冤冤相報的仇恨心理
  - label: D
    content: 恃強凌弱的卑鄙行為
  group_stem: "獅子、獵豹，面臨生命最後一刻，總覓一陰涼隱蔽的所在，輕輕的跪下，頭一垂，毫不拖泥帶水的走了。早早就等著的禿鷹、胡狼，很快的來收拾殘局，這原是自然的法則。\n\
    \    象有「象牙谷」，知道天命將盡的大象，會自己走到那兒，接受自然的結局。當然也有長途跋涉中自然死亡的大象，在旅途中走不動了，很想休息一下，但這一倒下，卻不會再起來，旅伴們圍繞著牠，盡力的鼓勵，實在不行了，躺下了，還用長鼻子去協助，去鞭策，但爬不起來了。\n\
    \    旅程必須繼續，象群只好離去。旱季過後，牠們又回來，昔日的旅伴，只剩下一根腿骨。領頭的母象，用敏感的長鼻把腿骨捲起，用鼻管輕輕的撫摸，其他的象，圍繞著慢慢的轉，掀起鼻子發出低沉的吼聲，牠們在唱輓歌呢！但旅程必須繼續，輕柔的放下腿骨，在老母象的帶領下，象群離去了，但還有一隻最後的，也許是牠的子女，也許是牠生前的伴侶，留下來再用鼻子捲起腿骨，用鼻管撫摸，一次，兩次……，終於放下，孤單的影子，追上同伴，一起走了。多麼感人的畫面！\n\
    \                                                                           沈君山〈動物輓歌〉"
  tags:
    textbook: 七上 語文常識(二) 閱讀導航——策略運用與資訊檢索
