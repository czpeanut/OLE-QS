  stem: "秦延善性憨怪，每閱史，至不平事，必拊①案切齒。偶觀秦檜殺岳飛，大怒，且罵且拍。其妻勸之曰：「家惟十幾，已碎其八，奈何復爾？」秦乘忿叱其妻曰：「不良婦，汝與秦檜通姦，故相為至此？」痛撻②之。\n\
