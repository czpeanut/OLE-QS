  stem: 9.拉奧說：「如果我做的到，妳也做得到，任何人都做得到。」這一句話傳達的涵義，與下列何者最相近？
  options:
  - label: A
    content: 先天下之憂而憂，後天下之樂而樂。
  - label: B
    content: 舜何人也？予何人也？有為者亦若是。
  - label: C
    content: 強中自有強中手，莫向人前滿自誇。
  - label: D
    content: 天生我材必有用，千金散盡還復來。
  group_stem: "《時代》雜誌（Time Magazine ）2020 年首次選出「年度風雲兒童」（Time Kid of the Year ），由美國科羅拉多州的15\
    \ 歲發明家少女吉坦賈利．拉奧（Gitanjali Rao ）獲得殊榮，成為《時代》雜誌有史以來評選最年輕的年度風雲人物，她表示希望自己能啟發其他人勇於提出想法，以「解決世界上的問題」。\n\
    \n   年僅15 歲的拉奧身為科學家兼發明家。12 歲時因為密西根州佛林特市，飲用水被鉛汙染，上萬名兒童鉛中毒，故發明可攜式快速而低成本的鉛污染水的檢測技術，能快速檢測飲用水中是否含鉛的設備。因此獲得美國傑出少年科學家獎，並獲得《富比世》頒發傑出青年獎。又試圖解決因人際關係所衍生的網路霸凌，推出可以偵測網絡霸凌詞彙的應用程序，給予使用者適時提醒，其目的在於提供使用者「停下來思考」的機會。故拉奧從5000\
    \ 多個候選人中脫穎而出，獲得此深具里程碑意義的頭銜。\n\n   獲獎後，拉奧在《時代》雜誌接受著名演員和人道主義提倡者安潔莉娜‧ 裘莉（Angelina\
    \ Jolie ）的專訪，並表示自己看上去並不像人們認為的「典型科學家」。她說：「我在電視上看到的都是年齡較大，而且通常都是白人的科學家。」「我的目標有所轉變，我希望不僅從透過自己的發明來解決世界上的問題，而是更要能夠激勵其他人加入我的行列。從我的個人經驗來看，找不到相似處境的人時，要跨出第一步並不容易。」「我很想要傳達這樣的訊息：如果我做的到，妳也做得到，任何人都做得到。」安潔莉娜‧\
    \ 裘莉詢問她：「『科學』什麼時候成為你的熱情所在？」拉奧回答：「其實我只不過是想要為他人帶來快樂的人；長大後，進一步轉變為－－如何把『正面力量』帶進我的周遭。」她還說；「不用試圖解決所有問題，只要專注於自己有熱情的事就足夠了，就算是像『撿起垃圾』這麼小的事，也能帶來影響力。」\n\
    \n 專訪中，拉奧更提及起過往，新的世代有許多問題需要解決。她說：「我們這一代人面臨著前所未有的許多新問題。然而同時，我們也仍然面臨著過去未解決的舊問題。」「就好比現在的我們面臨著嚴重的新冠疫情，同時我們卻也仍然面臨著長期遺留下來的人權問題。有些問題並不是我們這個世代造成的，卻必須由我們來解決，例如氣候變遷和隨著科技發達而興起的網絡霸凌問題。」\n\
    \   \n    身為一位「非典型」科學家，拉奧深信，許多青少年充滿潛能，只是缺乏起點。目前她已經跟世界各地機構合作。她表示：「只要我多接觸一位學生，就代表世界上又多了一個創意發想、解決問題的人。」"
