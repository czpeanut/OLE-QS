      chapter: null
- id: doc_111_高雄_大灣_國文_g7s1e2_s3_18
  section: 3
  number: 18
  type: single
  page: 2
  stem: 作家龍應台在目送一文中，回憶父親載送自己到大學報到後離去的身影，文中寫道：「我慢慢地、慢慢地了解到，所謂父女母子一場，只不過意味著，你和他的緣分就是今生今世不斷地在目送他的背影漸行漸遠。
    你站立在小路的這一端，看著他逐漸消失在小路轉彎的地方，而且，他用背影默默告訴你：不必追。」文末「不必追」的涵義為何？
