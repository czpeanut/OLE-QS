  group_stem: "曾見一丐，踞地坐，以兩手撐地，聳其臀向前，然後得行一步，蓋病瘓者也。意頗憫之。忽疾風濃雲驟起，雨大至，雜以冰雹。急走避人家簷下，回顧丐者，已起立，狂馳以去矣。\n\
