  options:
  - label: A
    content: Clean your cellphone more often.
  - label: B
    content: Don’t use your cellphone for too long.
  - label: C
    content: A toilet seat has more germs than (比…) a cellphone.
  - label: D
    content: Don’t use your cellphone in the bathroom.
  group_stem: 'How often do you clean your cellphone? Once a month? Twice a week?
    Read the following, and you may change your habits. Which has more germs, a cellphone
    or a toilet seat?

    The answer might be a cellphone. A study shows that. In it, people check their
    cellphones about forty-seven times a day. For example, they use them at work.
    They use them in their free time. They even use them in the bathroom. Germs move
    from their fingers to their cellphones. From now on, clean your cellphones once
