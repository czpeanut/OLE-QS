- id: doc_113_新北_忠孝_自然_g8s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '有關加熱對物質的影響，甲、乙、丙、丁四人各表達以下的敘述：

    (甲)當物體吸收了熱量，溫度必定會升高

    (乙)加熱液體一定要到達沸點時才能開始變成氣體

    (丙)任何物質受熱或冷卻，體積都必須符合熱脹冷縮的原理

    (丁)在固定的壓力下，同一種純物質的沸點與凝結點必定相同

    以上敘述何者正確？'
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
