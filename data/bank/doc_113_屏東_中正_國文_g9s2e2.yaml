- id: doc_113_屏東_中正_國文_g9s2e2_s3_14
  section: 3
  number: 14
  type: single
  page: 1
  stem: 常保好奇心：「一個人為什麼會好奇？因為擁有一顆開放且不自我設限的心靈，開放又源於願意擁抱外在世界的正向人生觀。因為樂於擁抱世界，所以積極探索外界事物，勇於參與未知領域，透過探索與參與，人會得到豐富的經驗、知識。」依據這段話的因果順序，「由因到果」的排列，下列何者正確？
  options:
  - label: A
    content: 好奇心→開放的心靈→樂於擁抱外在世界
  - label: B
    content: 樂於擁抱外在世界→好奇心→開放的心靈
  - label: C
    content: 樂於擁抱外在世界→積極探索參與未知→經驗知識
  - label: D
    content: 樂於擁抱外在世界→經驗知識→積極探索參與未知。
  lesson_raw:
    title: 常保好奇心
    basis: 題目引用「常保好奇心」
- id: doc_113_屏東_中正_國文_g9s2e2_s3_15
  section: 3
  number: 15
  type: single
  page: 1
  stem: 常保好奇心：「唯有回歸開放的心靈、回歸好奇的本能，才是學習的起點。」下列何者是這段話要闡釋的觀點？
  options:
  - label: A
    content: 回歸學習的起點才能有開放的心靈
  - label: B
    content: 開放與好奇之心能激起學習動力
  - label: C
    content: 正向積極的人生觀是需要培養的
  - label: D
    content: 勤奮學習才可以強化人的好奇心。
  lesson_raw:
    title: 常保好奇心
    basis: 題目引用「常保好奇心」
- id: doc_113_屏東_中正_國文_g9s2e2_s3_16
  section: 3
  number: 16
  type: single
  page: 2
  stem: 常保好奇心：「好奇心其實是人類與生俱來的良知良能，幼兒期的學習全來自好奇的探索。只是成長過程中的負面經驗及大人的限制，讓好奇的本能逐漸限縮，變成定向與功能性的學習，能力也因而被局限。」根據前段文意，下列何者解讀最正確？
  options:
  - label: A
    content: 幼兒時期的好奇探索常導致負面經驗
  - label: B
    content: 每個人天生就對這個世界感到好奇
  - label: C
    content: 失去好奇心都是因為大人的限制
  - label: D
    content: 成年人已經喪失對事物好奇的本能。
  lesson_raw:
    title: 常保好奇心
    basis: 題目引用「常保好奇心」
- id: doc_113_屏東_中正_國文_g9s2e2_s3_17
  section: 3
  number: 17
  type: single
  page: 2
  stem: 常保好奇心一文中，作者的太太說他「你實在是個奇怪的人，什麼人都可以聊、什麼事你都有興趣！」下列何句文意最能與上述句子相呼應？
