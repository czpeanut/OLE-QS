  group_stem: '司城子之圉人①之子，食鯸鮐②而死，弗哭。司城子問之曰：「父與子有愛乎？」曰：「何為其無愛也？」司城子曰：「然則爾之子死而弗哭，何也？」對曰：「臣聞之：死生有命，知命者不苟死。鯸鮐，毒魚也。食之者死，夫人莫不知也。而必食以死，是為口腹而輕其生，非人子也。是以弗哭。」

