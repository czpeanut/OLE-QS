- id: doc_113_屏東_中正_國文_g9s2e2_s4_8
  section: 4
  number: 8
  type: single
  page: 4
  stem: 回家後，恍然大悟出一句話，媽媽在我小時候常對我說：「天下千種花，你是一枝草，要______啊！」依據文意脈絡，______ 處宜填上的詞語，是下列何者？
  options:
  - label: A
    content: 謙虛
  - label: B
    content: 誠實
  - label: C
    content: 知足
  - label: D
    content: 尊敬。
  group_stem: '愛花的人真是有福氣，如果他們住在臺灣的話。

    在臺灣這塊「終年樹長綠」的土地上，隨時都見得到嫣紅奼紫，你要是細心一點，應當可以發現，十二月裡都能看到杜鵑花，不必等到「淡淡的三月天」；茉莉照說是開放在六月，但是此地九月裡仍處處有；秋天桂花飄香，這是常理，但是你可不能堅持，因為許多人家裡的桂樹總是在春天或冬天「花開滿枝頭」。

    一些人的觀念也得改，這些人常抱怨：臺灣沒有花市，花店太少，不像紐約、巴黎、羅馬的街頭上隨地有得買花。

    這真是瞎話，花市花圃多得很，花市通常都是趁著清晨做買賣，你知道，早晨的花，花色最好，花香較純。我做的是晨昏顛倒的工作，有一次清晨下班，獨自到大花市去，看著那遍地的翠紅，看著那些坐在花城之中的花商，好感動，心裡直在問：怎麼會有這麼多的花？走過來走過去，數一數，總共只認識七種，其餘，有的「似曾相識」，有的「素昧平生」。回家後，恍然大悟出一句話，媽媽在我小時候常對我說：「天下千種花，你是一枝草，要______啊！」

    你也愛花嗎？你該到花市花圃花店去走動走動，看看那些造物者千方百計為人間添加的千顏萬色、千姿萬態、千嬌百媚，你會猛然覺察到，看花容比看人臉好過千倍萬倍，聞花香比聞油煙好過千般萬般，而面對千枝萬朵的紫黃白紅，心中自然不再千頭萬緒。你儘可對著花傾訴千言萬語，得意時，瞧瞧玫瑰薔薇，它的刺當能使你深思；失意時，瞧瞧百合水仙，它一點色彩都沒有，還不是挺起枝幹抬起頭；你該學那蓮花，它不只頂上開花，它也在水底成藕；你該學那不知名的野花，它全靠自己，默默地、倔強地，硬是要開花；你該學……，該學菊花的堅忍精神：「百花發，我不發。我若發，都駭殺。要與西風戰一場，遍身穿就黃金甲。」
    ( 阿盛〈你該去看花〉)'
