- id: doc_113_屏東_中正_國文_g9s2e2_s3_11
  section: 3
  number: 11
  type: single
  page: 1
  stem: 水神的指引：「來到這裡的人，才能喝到最甜、最有味道的水。唯有付出才能知道享用、受益的感覺。」此段文句的意涵，與下列何者最接近？
  options:
  - label: A
    content: 香餌之下必有死魚，重賞之下必有勇夫
  - label: B
    content: 唯有滴下辛勤的汗珠，才能拾起田中的麥穗
  - label: C
    content: 山重水複疑無路，柳暗花明又一村
  - label: D
    content: 我們不能延伸生命的長度，但可以拓展它的寬度。
  lesson_raw:
    title: 水神的指引
    basis: 題目引用「水神的指引」
