  stem: 回收廢棄寶特瓶製成纖維，台灣也居領先地位。若上文要增補一段「寶特瓶紗」的敘述，並按上文兩個案例的模式撰寫，其敘述順序應該是：
  options:
  - label: A
    content: 生產者產品測試產品與機能
  - label: B
    content: 原料生產者產品與機能
  - label: C
    content: 原料產品與機能產品測試
  - label: D
    content: 生產者產品與機能原料原料。
  group_stem: '很多人喜歡喝咖啡，但咖啡烹煮後的咖啡渣經常被當成廢棄物。來自台灣的興采實業，首創將奈米級咖啡渣添加於紗線中，不但展現優異的水份擴散速乾的能力，還能折射紫外線，並達到異味控制的效果，不少廠商將之製成機能大衣、西裝外套、貼身衣物。

    魚身上的鱗，通常被視為毫無價值，台灣的博祥國際公司卻注意到其中富含膠原蛋白，運用奈米技術將膠原胜肽基酸注入紡織品中，創造出新機能纖維。第一代纖維與嫘縈結合，訴求親膚保濕、環保天然。其後又與台南紡織合作，開發超分子仿生性聚酯纖維，不僅具有親膚性和彈性，也保有聚酯的耐熱性與堅韌性。'
