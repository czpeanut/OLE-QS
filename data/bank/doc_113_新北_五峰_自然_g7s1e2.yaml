  group_stem: '小鋒取三支乾淨的試管，裝置如下表所示，混合均勻後，再分別放入40℃的溫水中作用 30 分鐘，然後在各試管中加入 3 毫升本氏液，並放入沸水中加熱，觀察試管中顏色的變化。試根據所提供的資料，回答下列問題：


