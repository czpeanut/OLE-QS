- id: doc_111_桃園_同德_自然_g7s1e3_s1_50
  section: 1
  number: 50
  type: single
  page: 6
  stem: 下列關於第二型糖尿病的敘述何者錯誤？
  options:
  - label: A
    content: 致病因素為遺傳、飲食、活動量少的生活習慣以及肥胖
  - label: B
    content: 糖尿病患者容易因心血管疾病問題而猝死
  - label: C
    content: 只要控制好血糖及適度運動是可以根治糖尿病
  - label: D
    content: 高血糖常見的併發症是腎臟、眼睛、和神經病變
  group_stem: "【閱讀測驗】：認識糖尿病\n第二型糖尿病是什麼？\n    第二型糖尿病是最常見的糖尿病類型，主要原因是細胞對胰島素的敏感度降低、產生阻抗，血糖沒有辦法進入細胞裡，胰臟為了讓血糖進入細胞，因此分泌更多胰島素，但胰島素有限，隨著時間推移而逐漸分泌不足，大量葡萄糖留在血液裡面造成高血糖，最後血糖隨尿液排出變成糖尿病。常見致病因素為遺傳、飲食、活動量少的生活習慣以及肥胖。\n\
    \    第二型糖尿病的早期症狀不明顯，大約三分之一的患者甚至不知道自己的血糖過高。而最可能讓患者注意到的早期症狀是所謂的「三多」：喝多、吃多、尿多。也就是說，糖尿病患者很容易覺得口渴、口乾，一灌就是好大一杯水。同時尿尿也很多，胃口大開吃的更多，不過人看起來還變瘦了。\n\
    \    高血糖讓我們的血管裡有愈來愈多斑塊堆積，血流速度變慢，甚至產生血塊，血管逐漸變硬，接下來找上門的就是突然心肌梗塞，狹心症發作。因此糖尿病患者容易因心血管疾病問題而猝死。高血糖常見的併發症是腎臟、眼睛、和神經病變。這幾個器官都內含有豐沛的小血管供應營養與氧氣，因此當血糖高傷害血管後，就容易受傷。\n\
    \    第二型糖尿病治療方法？可以治癒嗎？第二型糖尿病無法治癒，只可控制。糖尿病治療是藥物、飲食、運動搭配，如果飲食和運動就可以良好控制血糖，那麼就不用服藥，反之就必須服用口服藥。"
