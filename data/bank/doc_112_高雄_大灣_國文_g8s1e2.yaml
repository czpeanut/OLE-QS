- id: doc_112_高雄_大灣_國文_g8s1e2_s4_31
  section: 4
  number: 31
  type: single
  page: 3
  stem: 關於本文標題中以「使命必達」來形容外送員的主要原因，下列敘述何者正確？
  options:
  - label: A
    content: 強調外送員交通事故風險高
  - label: B
    content: 外送訂單過多造成外送員過勞
  - label: C
    content: 平臺罔顧外送員權益使送餐困難
  - label: D
    content: 即便有難以達成的要求也得送達。
  group_stem: "現今許多新聞記者會採用網路社群中的討論做為題材進行播報，而臉書社團「外送員的奇聞怪事」中有張被熱烈討論的照片，引起了許多新聞臺的關注。究竟是什麼樣的照片，能夠讓網友們在文章中留言讚嘆:「真是太狂了」、「大哥，你真是我的偶像」呢?\n\
    \  只見照片中一名foodpanda 外送員將餐點送達至訂餐的櫃姐手上，但仔細一看，這地點可不尋常!整台電動機車被直接騎進百貨公司內，停在一樓化妝品專櫃旁!此舉不只是讓當時逛街的民眾們大開眼界，也引發百貨公司業者的不滿，向外送平臺提出申訴，也表示會再與櫃姐溝通。而外送平臺則出面還原事情經過，表示由於該百貨公司不開放進去送餐，但該名櫃姐仍刁難，在訂單中要求將餐點送達進商場櫃位中，當時外送專用停車格也已被停滿，外送員才出此下策送餐。而平臺除了對該名外送員加強宣導，也希望百貨業者協助保留停車區域，幫助外送員順利送餐。\n\
    \  因疫情後的宅經濟興起的外送產業，外送員能自由選擇上下班時間，訂單量大時工資高，卻有著長工時、職災繁多，勞資糾紛等爭議，是一直以來外送從業人員辛酸之處。而諸如此類的奇聞怪事也不少，好比原先主打外送餐點的平臺，竟然與家電業者合作提供外送冰箱的服務，或是顧客在訂單附註欄位中表示請外送員告知取餐者：「我們分手吧！」，甚至還有商家老闆請外送員順路送非平臺的訂單給顧客，各種「不可能的任務」使外送員得使出渾身解數才能使命必達。\n\
    \  針對這些奇聞怪事，平臺業者也進一步表示，若外送員有接獲難以送達的訂單，應於送餐前聯絡平臺方，由平臺協助解決外送困境，讓餐點能順利送達顧客手中，而非自己想方設法反而鬧了個笑話。至於訂餐者也應留意所在地區的送餐規定，避免造成外送員的困擾，也才能讓自己不會因為美食而成為人們茶餘飯後的笑柄。\n\
    \                                   (史上最狂外送員:使命必達選自時事非讀BOOK)"
