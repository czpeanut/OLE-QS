  group_stem: "從興趣中找到夢想\n  在日本這個學歷至上的國家，大多數人直到上大學，才有機會摸索自己的興趣是什麼，尋找可能的夢想。\n  但是，安藤忠雄不然。\n\
    \  一九四一年，安藤忠雄在大阪出生，從小由外公外婆養大。後來，外公過世，安藤忠雄與外婆必須獨立生活。因此，當外婆開了雜貨店，他就幫忙顧店。每當鄰家的木匠帶著設計圖出入，不僅會跟他玩，也會教他削木頭。懵懂之間，安藤忠雄覺得很喜歡用木頭做東西的感覺。\n\
    \  13 歲時，安藤忠雄與鄰家的木匠合作增建家裡的二樓。當他在幽暗的長屋開了一個天窗，第一次，他體驗到自然光線的魅力，小小心靈中，愛上建築。\n  隔年，當鄰家有個失怙少年需要地方住，安藤忠雄自己設計施工，為少年蓋了一個7\
    \ 坪大的加蓋小屋。第一次，他興起自己的夢想：從事建築業。\n  發現夢想並不容易，但是，該如何去做，努力實現夢想，卻是大的挑戰。\n  國中畢業後，安藤忠雄遇到第一個夢想的阻礙。當他決定進木工工廠工作時，卻慘遭家人反對。\n\
    於是，他轉念高工機械科，從此走上自學之路。課餘，他勤跑學校的設計教室，閒暇時就搭電車到京都、奈良等地，親身參觀日本傳統建築，從中了解何謂建築。\n  後來，他聽說打拳擊可以拿工作簽證出國比賽，為了出國看建築，他只花了兩個多月練習就拿到職業拳擊賽執照，如願的，隻身到曼谷比賽。\n\
    孤獨一人，也要讓夢想開花\n  高工畢業了，安藤忠雄渴望進大學念建築。這一次，雖然家人並未反對，但在龐大的經濟壓力下，他必須放棄念大學建築系的正規管道。\n\
    \  他清楚地知道夢想只有一個，但是，邁向夢想的道路卻有很多途徑。\n  「所以，我決定，好！我一個人要朝這個方向努力。因此，一個人走上這條孤獨的道路。」安藤忠雄在演講中比喻，「康莊大道上綻放許多花朵，但是，我一個人卻走著這條大家都看不見的路，於是，我對自己說，我要讓這條路也能開花結果。」於是，他透過工作與讀書，繼續自學建築。\n\
    \  他先到室內設計公司擔任助手，後來協助大阪市立大學教授進行商店街調查與開發，不工作時，他就讀書。有一次，他在一個舊書攤看到柯布作品全集（柯布即柯比意，Le\
    \ Corbusier）時，心中震撼不已，於是，他每天都到舊書攤報到，甚至央求書店老闆暫先保存該書，等他存夠錢，就會把書買下。「再怎麼沒錢吃飯，我都要讀書。」他說。\n\
    \  後來，他終於買了書，隨後天天研究柯布的設計圖。有一整年，他甚至一早讀書直到凌晨三點鐘，就這樣，將建築系教科書研讀完畢。\n  「一個人要成功有兩個條件：意志力和熱情。」安藤忠雄說。\n\
    旅行，成就了建築家\n  刻苦自學只是實現夢想的初體驗，後面還有不屈不撓的奮鬥歷程。\n  24 歲時，日本開放出國觀光的第二年，安藤忠雄就是無法壓抑想用敏銳的五官與身體來感受空間的好奇心。於是，他存了微薄的旅費，從搭貨輪開始，踏上一個人對建築的摸索之路。經西伯利亞鐵路到莫斯科，然後從北歐進入中歐、南歐、直到印度。\n\
    \  當他目睹廣大的海平面，與在西伯利亞鐵路上連續5 天看著窗外一望無際的溼地草原，他比建築系學生更直接體驗何謂「水平」；當他在希臘仰望巴特農神殿時，他親身體會何謂「垂直」。\n\
    \  透過旅行，全世界的建築鉅作都跳出教科書，成為他的老師。\n  回日本之後，他勇奪一項大阪城公園設施設計的競圖，似乎，旅行，已隱隱造就了一位建築家。\n\
    \  隔年，他再度以旅行摸索建築。回國之後，他毅然開設自己的建築師事務所，決心以建築為本業，養活自己與家人。\n  沒想到，他周遭的人都說：「你沒受過正規的教育，怎麼能成為一個建築家？」\n\
    \  在日本菁英主義的環境下，這些質疑的確為真，但是，安藤忠雄追尋建築夢的熱情與意志力卻更為深刻。\n有一就會有十\n  他深信一句日本諺語：「只要有一，就會有十」。\n\
    \  開業初期幾乎毫無案子上門，於是，任何親友介紹的案子，儘管再微不足道，他都懷著感恩之心去做。\n  沒有案子的時候，他讀書，或是到戶外空地設身處地思考，如果是他自己的案子，他會怎麼做。藉此鍛鍊思考能力。\n\
    \  他鍥而不捨，就是不放棄。\n  他曾向大阪市政府提案，希望把屋頂全部綠化。結果，市政府毫不理睬。但是，他仍不斷加入新的創意，持續提案三、四次，最後，大阪市政府很困擾，甚至威脅他：「安藤先生，你以後再帶這種提案來，我們要逮捕你喔！」\n\
