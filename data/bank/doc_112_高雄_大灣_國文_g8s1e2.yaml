    \  記者問他：「如果不是做建築家，你會做什麼呢？」\n  他回答：「如果我不做建築家，我的人生就很失敗，沒什麼好說的。」\n  現在的安藤忠雄，儘管早已晉升國際大師，仍然秉持著熱情與意志力，追尋著他的建築夢。\n\
    \  不同的是，與剛入行前相比，當初那條沒人看見的孤獨路，現在，已經綻放出滿徑的繽紛花朵。\n                              \
