  section: 4
  number: 48
  type: single
  page: 6
  stem: Why couldn’t people in Czech build the dam?
  options:
  - label: A
    content: There were too many steps to take before work.
  - label: B
    content: The weather was worse and worse.
  - label: C
    content: The government ran out of money.
  - label: D
    content: There were not enough workers
  group_stem: "The Czech government wanted to build a dam in Brdy to protect the wetlands.\
    \ However, they kept delaying it because there were many difficult steps and rules\
    \ to follow.  To everyone’s surprise, one night, a group of about eight beavers\
    \ built the dam themselves. This saved the government 30 million Czech korunas\
    \ (about 40.45 million New Taiwan Dollars). The dam they built was very strong\
    \ and helped many animals live in the area.\n      In fact, the plan to build\
    \ the dam started seven years earlier. The government had enough money, 30 million\
    \ Czech korunas, to build the dam, but they didn’t start to build the dam because\
    \ different departments were working on several kinds of land problems.  While\
    \ they were still trying to work out these problems, the beavers built the dam\
    \ on their own, without “permission”.\n     Zoologist Jiri VlÄ ek said that the\
    \ beavers are much faster at building dams than humans.  Beavers can build a dam\
    \ in one or two nights, but humans need to get money and permission, that is,\
    \ many government departments need to check and study the plan before they let\
    \ the work get started.\n    The dam offers a good home for many kinds of animals\
    \ like giant stone crayfish and frogs. Jaroslav, from the Czech Natural and Landscape\
    \ Protection Agency (國家環境保護局), said the beavers picked the best spot for the dam—even\
    \ better than the one in our plan, he joked.\nScientists found that beavers help\
    \ nature in many ways.  Their dams help store the water, clean the water, make\
    \ the water warmer for all the animals there to live better, and even lower down\
    \ the carbon in the air. But sometimes, they can also make trouble for people,\
    \ like when they flooded fields and railways in the north American area.\n government\
    \ 政府 dam 水壩 delay 延宕 beavers 海狸 creature 生物 wetland 濕地 carbon 碳\n refer to 指涉"
  ai_answers:
    gemini: A
    qwen: A
  answer:
  - A
  answer_status: ai_generated
  answer_source: ai:gemini+qwen
