  - label: C
    content: To make space for new houses.
  - label: D
    content: To keep people away from the island.
  group_stem: "Phillip Island, a natural park in Australia, is one of the best places\
    \ to see penguins. The island is home to the world’s smallest species of penguin,\
    \ the little penguin. These penguins are shorter than most other penguin species\
    \ and have bluer feathers, helping them blend into the color of the ocean.\n \
    \ In the past, Phillip Island had serious environmental problems. There were too\
    \ many buildings on the island, and this made it harder for penguins to live there.\
    \ Because of this, people on the island decided to take action. They worked hard\
    \ to knock down most of the buildings and created a safer place for the penguins.\
    \ Over time, the number of penguins grew, and today, Phillip Island has one of\
    \ the largest little penguin groups in the world.\n  One of the most popular things\
    \ to see on the island is the Penguin Parade. Every evening, visitors can watch\
    \ penguins waddle back to their nests. It is surely one of the cutest wildlife\
    \ experiences in Australia. Thanks to people's hard work to protect nature, the\
    \ island is now healthier and more welcoming for wildlife than it was before.\n\
    \n penguin 企鵝 species 品種 feather 羽毛 blend 融入 waddle 搖搖擺擺 wildlife 野生動物\n distance\
