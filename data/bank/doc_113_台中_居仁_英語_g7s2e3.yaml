    \ Taiwan, people eat rice dumplings and row dragon boats for the Dragon Boat Festival.\n\
    • In Japan, people learn washoku, the old Japanese way of cooking.\n• In Spain,\
    \ people danced flamenco many years ago. Today, they still dance and teach it.\n\
    • In India, people celebrated the Diwali Festival. It is the festival of lights.\
    \ People put lamps and set off fireworks at home.\n• In Peru, many women learned\
