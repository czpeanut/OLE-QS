  group_stem: '(43.-44.)


    In Taiwan’s hills so green and wide,

    A black bear walks and stays with care.

    Its “V” of white shines on its face,

    It moves with care and finds its place.


    It once walked free in forests wide,

    The trees stood tall, the rivers ran.

    The forest were big, the sky looked clear,

    The bear could run and feel all right.


    But now the roads cut through the land,

    The trees fall down by human hand.

    It can''t find food or jump with joy,

    The sun is hot and there is no toy.


    It steps in traps and hurts its feet,

    It feels afraid and can’t run sweet.

    Some bears get lost or fall and die,

    The forest now feels dry and shy.


    But people help, so do not fear,

    They clear the traps and come near.

    They teach the young and care each day,

    So hope stands strong and lights the way.


    📖 trap 陷阱 afraid 害怕 sweet 暢快地 poem 詩'
