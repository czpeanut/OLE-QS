  page: 1
  stem: 甲、乙兩實驗裝置如右圖，在實驗中發現甲實驗的鋅片上有銅析出且溶液的溫度升高，而乙實驗的毫安培計顯示有電流產生。下列有關此兩實驗的敘述何者正確？
