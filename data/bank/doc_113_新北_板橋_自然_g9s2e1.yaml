- id: doc_113_新北_板橋_自然_g9s2e1_s2_35
  section: 2
  number: 35
  type: single
  page: 6
  stem: 根據文章，下列何者會加劇鋰離子電池內部化學反應的速率？
  options:
  - label: A
    content: 濃度
  - label: B
    content: 溫度
  - label: C
    content: 接觸面積
  - label: D
    content: 催化劑。
  group_stem: '鋰電池

    鋰離子電池的發明，促進了手機、筆記型電腦、行動電源以及電動車的發展，讓我們得以享受其所帶來的便利生活。然而鋰離子電池潛在的危險卻不容忽視，如西元2016年某知名手機廠商手機爆炸事件，其主角正是鋰離子電池。

    鋰離子電池因內部異常，造成溫度上升的一連串反應稱為熱失控（thermal runaway）。當電池受到撞擊造成變形而引起內部短路，或是因為充電過久，導致電池產生大量的熱，會破壞熱平衡。當電池所釋放出的熱無法逸散時，會加劇電池進行化學反應，可能導致電池燃燒甚至爆炸。

    因此在享受鋰離子電池帶來的便捷之餘，須謹記其所可能帶來的危害。要注意電器（或電池）不要摔傷，不要過度充電，並定期檢視電器（或電池）的狀況，才能安心的使用這些電器產品。'
