- id: doc_113_新北_板橋_自然_g9s2e1_s2_31
  section: 2
  number: 31
  type: single
  page: 5
  stem: 亮亮八月份使用的所有電器共約消耗多少焦耳的電能？
  options:
  - label: A
    content: $3 \times 10^{8}\text{ J}$
  - label: B
    content: $7 \times 10^{8}\text{ J}$
  - label: C
    content: $2 \times 10^{8}\text{ J}$
  - label: D
    content: $9 \times 10^{8}\text{ J}。$
  group_stem: '亮亮今年剛從大學畢業，決定到外地發展並尋找工作。在租屋時，他與房東簽訂契約，約定每月用電 120 度以內，每度收費 8 元，超過 120
    度後，每度收費 10 元。某天，他在網路上看到一則租屋新聞，提醒租屋族在簽約時應仔細檢查租約內容，以確保房東收取的電費沒有超過台電所訂的夏季用電最高級距費率。根據
    2024 年台電夏季電價標準，最高級距的費率為每度 8.46 元。因此，若租約約定按度計費，平均電費每度不得超過 8.46 元，否則即為超收，房客可向當地地政機關、消保處或消保官檢舉，以維護自身權益。


    | 電器 | 電鍋 | 電視機 | 洗衣機 | 冷氣機 | 電燈 |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 規格 | 110V (伏特)<br>500W (瓦特) | 110V (伏特)<br>200W (瓦特) | 110V (伏特)<br>900W (瓦特)
    | 110V (伏特)<br>1200W (瓦) | 110V (伏特)<br>100W (瓦特) |

    | 八月份使用時數 | 10 小時 | 150 小時 | 20 小時 | 100 小時 | 250 小時 |'
