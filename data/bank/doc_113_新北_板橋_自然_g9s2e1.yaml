- id: doc_113_新北_板橋_自然_g9s2e1_s2_37
  section: 2
  number: 37
  type: single
  page: 6
  stem: 電力公司建置的智慧電網，將電輸送到用戶的期間經過多次變壓程序，下列何者正確？
  options:
  - label: A
    content: 為減少電能損耗，輸送過程使用直流電
  - label: B
    content: 若增加電壓，則輸送的電流也會增加
  - label: C
    content: 以高電壓的形式輸送，可以減少電能損失
  - label: D
    content: 以高電流的形式輸送，可以增快輸送速度
  group_stem: '你家的電表智慧了嗎？

    台電發展智慧電網，目前正在六都試辦逐步更新家用電表，傳統電表紀錄家戶的用電量，但台電無法即時得知用電多少，只有兩個月派員抄表一次，才能確知用電量，但智慧電表紀錄可即時回傳數據給台電，不必再抄表。即時回傳用電量，台電可更精準的掌握需電量，不必發太多的電，像是目前的發電量都是依照預估的用電，再加上6%的備用量，如果沒有用到的電無法存起來，就白白浪費，相當可惜。

    不僅如此，再加上與電信商等不同業別的合作，就能以手機搖控用電，台電表示，因為可精準掌握用電，未來家戶就能實施不同時段不同電價，民眾可以在非尖鋒時刻多用電，節省電費。

    < 記者修瑞瑩 聯合報 / 2019-05-22 17:45 >'
