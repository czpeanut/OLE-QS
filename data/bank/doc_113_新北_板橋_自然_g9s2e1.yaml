- id: doc_113_新北_板橋_自然_g9s2e1_s2_33
  section: 2
  number: 33
  type: single
  page: 5
  stem: 燃料電池與二次電池的比較，下列敘述何者正確？
  options:
  - label: A
    content: 燃料電池可以向二次電池一樣充電
  - label: B
    content: 燃料電池需要持續提供燃料才能發電
  - label: C
    content: 燃料電池比鋰電池更輕，但產生的污染較嚴重
  - label: D
    content: 燃料電池屬於電流的化學效應。
  group_stem: '不是電池的燃料電池發電機

    燃料電池（Fuel cell），是一種透過氧化還原反應將燃料中的化學能轉換為電能，而並非透過燃燒來推動發電機的電力生產方式。近年來常被廣泛討論的燃料例如氫、天然氣、甲醇等都能作為燃料使用。也因此，相比起鋰電池或鉛蓄電池這種二次電池（Secondary
    Battery），燃料電池在發電過程中必須不斷提供氧氣與燃料才能穩定發電，與其說這是一顆電池，倒不如說他比較像是个發電機吧。但燃料電池由於體積比起汽柴油發電機小很多，發電過程安靜，僅有二氧化碳和水的排放，因此近年來的開發思維，均是想以燃料電池解決攜帶式電源不足的問題。例如美軍在沙漠戰爭因電子軍品的大幅使用，導致士兵身上需要背負到近十公斤的鋰電池。且鋰電池電量耗盡後就成了無用也不能隨意拋棄的重量負擔，但若以燃料電池取代，則可減輕至
    3.5 公斤，且燃料等補給也較為簡單。以及近十年來，個人隨身電子產品的普及與耗電量的大幅提升遠超過了鋰電池等一次電池的容量發展。而燃料電池，正能以一種便於攜帶的行動電源方式，補足這樣的戶外臨時的電源需求。

    目前燃料電池在國際上已開始被廣泛使用，例如 300W 的燃料電池可作為電力品質不穩地區的家戶緊急備用電源。而 1000W 的則可以用在室內廠房的重型機具電源，可免去鉛酸電池的重量與緩慢充電時間、電源線的接線困擾以及汽柴油引擎的廢氣汙染。

    燃料電池已在全球廣泛應用，能作為家庭備用電源或工業機具電源，減少傳統電池與發電機的缺點。透過跨領域合作，燃料電池的技術持續發展，並朝向產業化目標邁進。

    < 文章出處 / PanSci 76560 >'
