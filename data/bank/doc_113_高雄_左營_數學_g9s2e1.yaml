- id: doc_113_高雄_左營_數學_g9s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '小傑、酷拉皮卡、奇犽和雷歐力在獵人試驗中需要確認下列敘述正確的有多少個?

    (１)若二次函數 $y=ax^{2}+5$ 的圖形為開口向上的拋物線，則 $a>0$。

    (２)二次函數 $y=a(x-3)^{2}+4$ 圖形的對稱軸是 $y=4$。

    (３)二次函數 $y=3(x+1)^{2}+k$ 的最大值是 $y=k$。

    (４) $y=-2x^{2}+1$ 是以 $x$ 軸為對稱軸的對稱圖形。

    (５)二次函數 $y=-2x^{2}+3$ 的圖形向下平移 3 個單位後，可得新的二次函數 $y=-2x^{2}$。

    (６) $y=ax^{2}+bx+c$ 必為二次函數。

    (７)二次函數 $y=-2x^{2}+1$ 的圖形可經由平移後與 $y=x^{2}$ 的圖形重合。'
  options:
  - label: A
    content: '3'
  - label: B
    content: '4'
  - label: C
    content: '5'
  - label: D
    content: 6。
