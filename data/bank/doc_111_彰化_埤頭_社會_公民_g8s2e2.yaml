  group_stem: '不管你有沒有關注過實況主企鵝妹徒步環台，你都要知道「跟蹤騷擾防制法」已經施行將近一年。

    韓國知名實況主企鵝妹徒步環台，在直播中被黑衣男跟蹤約四小時。粉絲報警後，警方隨即到場給予書面告誡，但蒙面男出言不遜罵警察的態度，也引發討論：依據現行法第4條第2項規定，必要時，警察得採取保護被害人之必要措施，因此，才會出現新聞畫面中4輛警車保護企鵝妹的畫面。然而，警力有限，總不可能1天24小時保護被害人，因此跟騷法規定，被害人在行為發生2年內得特書面告誡向法院聲請保護令。

    企鵝妹事件點出法律漏洞，就算聲請保護令，法院核發的程序也緩不濟急，光是確定身份、寄送傳票等合法送達程序，企鵝妹保護令的聲請往往耗時1個月以上。等到保護令核發，跟騷族早就走完環島行程，甚至回韓國了。因此，這段「核發書面告誡到核發保護令之間」的空窗期，顯然是嚴重的法律漏洞。

    跟騷法於2022年正式實施，發現中定義8種跟蹤騷擾行為，只要持續或反覆違反特定人意願與性或性別有關，進行監視跟蹤、盯梢尾隨接近、威脅辱罵、通訊騷擾等騷擾，不管追求、寄送文字影像等行為，警察機關將可介入調查。此罪屬告訴乃論罪，可處1年以下有期徒刑、拘役或科或併科新台幣10萬元以下罰金。請問：'
