- id: doc_111_彰化_埤頭_社會_公民_g8s2e2_s3_30
  section: 3
  number: 30
  type: single
  page: 2
  stem: 根據文章內容，下列何項行為無法用跟騷法加以處罰？
  options:
  - label: A
    content: 志明擔心女友春嬌出軌，每天在工作地點外面監視
  - label: B
    content: 阿中和同學外出時，媽媽經常尾隨跟蹤他和他同學
