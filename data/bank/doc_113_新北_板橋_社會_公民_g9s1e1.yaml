    content: 民眾遷戶籍是受到非金錢誘因影響
  - label: B
    content: 民眾應衡量機會成本再決定是否遷戶籍
  - label: C
    content: 此政策對民眾完全沒有誘因
  - label: D
    content: 戶政單位呼籲的內容屬於正向誘因。
