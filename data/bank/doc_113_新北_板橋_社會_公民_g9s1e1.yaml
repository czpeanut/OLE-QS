- id: doc_113_新北_板橋_社會_公民_g9s1e1_s1_35
  section: 1
  number: 35
  type: single
  page: 1
  stem: 安和村附近的石化工廠因排放廢氣造成空氣汙染，遭環保局處以罰鍰，村民也多次進行圍廠抗議。業者提供村民水電補助，希望能減少村民的抗議。近年來，政府為推動當地產業轉型，乃規畫設置科學園區，以減稅措施鼓勵資訊、通訊等高科技廠商投資設廠，而為了吸引國際年輕科技人才遷入，陸續設立學校、休閒園區，讓科技人才不但能到此上班及發展，同時滿足其居住與孩子就學、休閒需求。若以誘因角度來看，下列針對上述內容的敘述，何者正確？
  options:
  - label: A
    content: 政府對石化工廠處以罰鍰以降低空汙，是金錢的負向誘因
  - label: B
    content: 業者對居民提供水電補助減少抗議，是非金錢的正向誘因
  - label: C
    content: 政府以減稅措施鼓勵科技廠商投資設廠，是非金錢的負向誘因
  - label: D
    content: 政府設立學校、休閒園區以吸引人才遷入，是金錢的正向誘因。
