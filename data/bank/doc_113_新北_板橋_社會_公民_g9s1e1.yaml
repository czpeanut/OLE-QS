- id: doc_113_新北_板橋_社會_公民_g9s1e1_s1_39
  section: 1
  number: 39
  type: single
  page: 1
  stem: '阿明拿到年終獎金20,000 元，決定用來購買家人共同需要的東西。阿明針對家人們想要購買商品的價格、理由與需求，整理如右表。請從機會成本的概念判斷，下列分析何者最正確？


    | 方案 | 甲 | 乙 |

    | :--- | :---: | :---: |

    | 物品 | 掃地機器人 | 空氣清淨機 |

    | 價格 | 18,000 元 | 16,000 元 |

    | 理由 | 減輕大家的家務勞動負擔 | 改善空氣品質與家人的過敏 |

    | 需求 | ✰✰✰✰ | ✰✰✰ |'
  options:
  - label: A
    content: 若以價格為依據，選擇甲的機會成本較低
  - label: B
    content: 若以理由為依據，選擇乙的機會成本較高
  - label: C
    content: 若選擇甲，應是以需求作為機會成本考量
  - label: D
    content: 文中資源僅具一種用途，因此必須做選擇。
