  section: 1
  number: 44
  type: single
  page: 2
  stem: '下文為社群網站上網友分享的一則訊息，根據內容判斷，下列敘述何者正確？


    好康報報

    地方首長宣布在期限內為本市市民者，可領到政府發放的紓困金 6,000 元，戶政事務所因此湧入千人，大排長龍預備將戶籍遷入，使辦理其他事務的民眾受到嚴重延誤。戶政單位緊急呼籲勿隨意遷戶籍，如果沒有實際居住，或是領完紓困金後立刻遷出，屬違反《戶籍法》的情形，將罰款
    3,000 元到 9,000 元。'
