  stem: 淑娟是一間建設公司的老闆，公司裡除了正職員工，還有領基本工資的工讀生，她的公司主要收入來源就是建造各種建築物再出售。某天她在看電視時，主播報了下列幾則新聞，僅根據內容判斷，何者最可能會使淑娟的公司利潤增加？
  options:
