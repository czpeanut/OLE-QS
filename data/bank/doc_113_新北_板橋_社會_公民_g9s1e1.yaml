  stem: 業者對演唱會的門票進行售票時，會因為座位所在區域差異而有不同的票價，像是愈靠近舞臺或視野較佳的區域，其票價較貴。關於上述演唱會座位之資源分配方式，下列敘述何者最為適當？
  options:
