  section: 1
  number: 18
  type: single
  page: 2
  stem: 從進軍葛萊美的華人設計師——蕭青陽一文，綜觀蕭青陽的發跡與奮鬥，下列哪句話最無法詮釋他的故事？
  options:
  - label: A
    content: 夢想從來都不會逃走，逃走的永遠是你自己
  - label: B
    content: 你不用急著完成夢想，但要不斷地靠近夢想
  - label: C
    content: 夢想是什麼？夢想是一種讓你覺得堅持就是幸福的東西
  - label: D
