  stem: 「精神的力量，是世界上最柔弱，同時也是最堅強的力量。在現實政治的天秤上，藝術的力量幾乎等於零。『冠蓋滿京華，斯人獨憔悴』，除了少數例外，一切藝術家莫不如此。可是天下之至柔，可以馳騁天下之至剛。秦始皇的劫火，燒不掉屈原的鬍子；安祿山的兵變，也燒不掉杜甫的那間破草堂。同樣地，納粹的重噸戰車也輾不死康定斯基和貝克曼。權力，像一塊新鮮的牛肉一樣，很快就會腐爛。只有藝術，像永不停電的冰箱，能保持靈魂的冷靜和清醒。」（余光中
    不朽的Ｐ）這段文字的主旨為下列何者？
