  stem: 根據資料甲，下列敘述何者正確？
  options:
  - label: A
    content: 細懸浮微粒(PM2.5)的濃度變化節節攀升，沒有下降趨勢
  - label: B
    content: 二氧化硫(SO2)每年的濃度變化與其他汙染物相比，皆減少最多
  - label: C
    content: 2023 年林園的空氣汙染物，以懸浮微粒 (PM10)佔總體的比例最高
  - label: D
