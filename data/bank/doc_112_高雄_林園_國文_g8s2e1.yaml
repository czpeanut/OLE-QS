  options:
  - label: A
    content: 「春天回來了，從南中國海」強調高雄地理位置的重要性
  - label: B
    content: 「讓木棉花的火把……一路向北方傳達」期望高雄的文藝等各方面如木棉花綻放
  - label: C
    content: 從「讓春天從高雄登陸」到「讓春天從高雄出發」作者認同高雄才是唯一的文藝重心
  - label: D
    content: 整首詩的主旨是希望以高雄春日美景推廣觀光事業。
