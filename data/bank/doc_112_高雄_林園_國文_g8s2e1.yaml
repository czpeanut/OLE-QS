  section: 4
  number: 2
  type: single
  page: 1
  stem: 關於〈控訴一枝煙囪〉一詩，下列何者說明錯誤？
  options:
  - label: A
    content: 「像一個流氓對著女童／噴吐你滿肚子不堪的髒話」:「流氓」比喻煙囪，「髒話」比喻工業排放的有害氣體
  - label: B
    content: 「有時，還裝出戒煙的樣子／卻躲在，哼，夜色的暗處／向我惡夢的窗口，偷偷地吞吐」：指工廠躲避稽查在夜晚排放有害氣體，導致作者晚上不得安眠
  - label: C
    content: 「兩百六十萬張肺葉／被你薰成了黑懨懨的蝴蝶」：以「黑懨懨的蝴蝶」比喻人民的肺部受到空汙嚴重影響
  - label: D
    content: 「那許多矇矇的眼瞳／正絕望地仰向／連風箏都透不過氣來的灰空」：指人民在空汙的危害下絕望無助的狀態。
  lesson_raw:
    title: 控訴一枝煙囪
