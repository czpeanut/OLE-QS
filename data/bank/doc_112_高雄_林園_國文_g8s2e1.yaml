  stem: 根據本文，下列敘述何者最恰當？
  options:
  - label: A
    content: 人如果沒有禮義的約束就會導致社會動亂災禍接踵而至
  - label: B
    content: 孟子認為善於機靈變通之人因愛惜自身羽毛而不需用到羞恥心
  - label: C
    content: 禮、義偏向掌權者如何管理人民；廉、恥則偏向個人自我管理
  - label: D
    content: 顧炎武的論點為「不廉則無所不取，不恥則無所不為」；論據則是孟子之言。
  group_stem: "請閱讀以下短文，並回答9～10 題：\n    禮、義，治人之大法；廉、恥，立人之大節。蓋不廉則無所不取，不恥則無所不為。人而如此，則禍敗亂亡，亦無所不至。然而四者之中，恥尤為要，孟子曰：「恥之於人大矣！為機變之巧者，無所用恥焉。」所以然者，人之不廉而至於悖①禮犯義，其原皆生於無恥也。\n\
    ——節選自顧炎武〈廉恥〉\n【注釋】\n①悖：音ㄅㄟˋ，違背、違反。"
