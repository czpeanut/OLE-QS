- id: doc_112_高雄_林園_國文_g8s2e1_s5_7
  section: 5
  number: 7
  type: single
  page: 5
  stem: 根據本文，下列敘述何者最恰當？
  options:
  - label: A
    content: 第二段所提及的好萊塢明星中，皆支持不論性別同工同酬
  - label: B
    content: 戈丁認為家務分工會導致職業的中斷與每週工時的差異
  - label: C
    content: 2021 年日本女性的時薪為男性的69.4%
  - label: D
    content: 「同酬日」是根據當年兩性的平均時薪差距換算成當年女性需增加的工作日數。
  group_stem: "請閱讀以下文章，並回答7～8 題：\n    2023 年全球票房第一的電影《芭比》，在1 月8 日金球獎上獲得電影票房成就獎，根據Variety\
    \ 報導，主演瑪格羅比（飾演芭比）、雷恩葛斯林（飾演肯尼）皆賺進了1250 萬美元酬勞。理所當然地，同樣的工作獲得相同的片酬，然而社會真的這樣運作嗎？\n\
    \  珍妮佛勞倫斯 2021 年《浮華世界》訪問時提到，在《千萬別抬頭》中的確存在片酬差距，他與男主角李奧納多的片酬差了500 萬美元。娜塔莉波曼、萊絲達拉斯霍華都曾公開抗議過同工不同酬，班尼迪克康伯拜區更曾表示：「若是同劇女主角未獲得相同的片酬，那麼將拒絕出演。」\n\
    \  根據2022 年主計總處資料顯示，臺灣女性的時薪是男性的84.2%，差距為15.8%，女性需要多工作58 天才能獲得與男性相同的年薪。世界各國也面臨了同工不同酬問題，歷年來臺灣兩性平均薪資差距相較美、日、韓等國為小，2021\
    \ 年臺灣差距為15.8%，低於日本30.6%、南韓30.2%及美國17%。\n  為喚起兩性同酬之公共意識，勞動部每年會發布「同酬日」，它是根據兩性平均時薪差距，計算自隔年1\
    \ 月1 日起，女性需增加的工作日數。2022 年差距為58 天，因此2023 年同酬日為2 月27 日。2024 年同酬日尚未公布，你覺得今年差距會放大還縮小呢？\n\
    \  「如果我們不討論家務分工，我們就無法真正討論同酬問題，也永遠不會實現性別平等。」2023 年諾貝爾經濟學獎的學者戈丁，在研究中發現，發生男女薪資差異的轉變，是在女性第一個孩子出生後，由此推論性別薪資差距很大程度，可以歸因於職業的中斷和每週工時的差異。\n\
    （資料來源：女人迷）"
