  group_stem: '請閱讀以下圖表，並回答5～6 題：

    【甲】下圖為林園站近十年污染物濃度變化趨勢。以2014 年為基礎，正向代表濃度增加；負向代表濃度減少。


    【乙】下表為各項污染物介紹。

    | 汙染物 | 汙染來源 |

    | :--- | :--- |

    | 細懸浮微粒 (PM2.5) | 交通污染 (道路揚塵、車輛排放廢氣)、營建施工、工業污染、境外污染、露天燃燒。 |

    | 懸浮微粒 (PM10) | 交通污染 (道路揚塵、車輛排放廢氣)、營建施工、工業污染、境外污染、露天燃燒。 |

    | 二氧化硫 (SO2) | 自然界 (火山)、燃料中硫份燃燒。 |

    | 氮氧化物 (NO2) | 燃燒過程中，空氣中氮或燃料中氮化物氧化而成，光化學反應中可反應成二氧化氮。 |

    | 一氧化碳 (CO) | 除森林火災、甲烷氧化及生物活動等自然現象產生外石化等燃料之不完全燃燒產生。 |

    | 臭氧 (O3) | 係一種由氮氧化物、反應性碳氫化合物及日光照射後產生之二次污染物。 |


    （資料來源：環境部 空氣品質監測網）'
