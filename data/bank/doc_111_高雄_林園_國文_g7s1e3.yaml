- id: doc_111_高雄_林園_國文_g7s1e3_s3_45
  section: 3
  number: 45
  type: single
  page: 5
  stem: 以上是從《祕密》這本書摘錄的佳句，同學們分享自己的讀後心得，下列何者的看法有誤？
  options:
  - label: A
    content: 芷怡：越懂得感恩，就越能吸引美好的事物來到你身邊
  - label: B
    content: 紫榛：若想改變自己的人生，就從調整自己的思想開始
  - label: C
    content: 博翰：人表現於外的行為，常與內心的意念背道而馳
  - label: D
    content: 愉顏：想想快樂的回憶或者聽喜歡的音樂，可以讓自己感覺好些。
  group_stem: '《祕密》書摘

    1、吸引力法則說「同類相吸」。當你有一個思想，你就會吸引同類的思想過來。

    2、思想是具有磁性的，並且有某種頻率。當你思考時，那些思想就發送到宇宙中，然後吸引所有同頻率的同類事物。所有發出的思想，都會回到源頭——你。

    3、你就像是一座「人體發射台」，用你的思想傳送某種頻率。如果想改變生命中的任何事，就藉由改變你的思想來轉換頻率。

    4、你當下的思想正在創造你的未來。你最常想的、或者最常把焦點放在上面的，將會出現在你的生命中，成爲你的人生。

    5、祕密轉移物——例如快樂的回憶、大自然或者你喜歡的音樂——可以瞬間改變你的感覺，轉換你的頻率。

    6、感恩可以轉換你的能量，並爲你的生命帶來更多你想要的東西。對目前擁有的一切感恩，你將會吸引更多美好的事物。'
