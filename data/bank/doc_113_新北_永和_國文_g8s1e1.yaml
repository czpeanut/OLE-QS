    content: 人類大腦思考模式單一，一次只能用一種思考帽來思考問題
  - label: D
    content: 「颱風天放假與否，應就各項客觀的氣象資料及當地環境來判定」，是屬於紅色思考帽的思維模式
  group_stem: "（六）\n    愛德華・狄波諾曾開發一套有趣的思考工具，叫做「六色思考帽」。分別用六種不同顏色的帽子表達六種不同思維模式。在不同的情境中，如果能用不同的思維模式去思考問題，或是一次使用幾種思維模式深入思索，往往能得到不同的結果。當然，任何人都有能力使用這六色思考帽，讓我們透過以下表格來了解這六色思考帽！\n\
    \n| 思維模式 | 顏色意義 | 關注特點 |\n| :--- | :--- | :--- |\n| 白色思考帽 | 中立、客觀（事實） | 客觀的事實和實證資料\
    \ |\n| 綠色思考帽 | 活力、創造（創意） | 發揮創造力和想像力，創造性思考與腦力激盪 |\n| 黃色思考帽 | 價值、肯定（樂觀） | 從正面考慮問題，表達樂觀、希望，有建設性的觀點\
    \ |\n| 黑色思考帽 | 質疑、負面意見（批判） | 帶著質疑的眼光，合乎邏輯的批判，盡情發表負面意見，找出邏輯上的錯誤 |\n| 紅色思考帽 | 直覺、感受（情感）\
    \ | 表達自己的情緒時說出直覺與感受，例如：我覺得 |\n| 藍色思考帽 | 冷靜、綜觀（管理） | 綜觀全局，控制各種思考帽使用順序，客觀規劃整個思考過程，並冷靜思考出結論\
    \ |\n\n當你戴上這些不同顏色的隱形帽子，你的思考也隨之改變，同時也因為有了限制而激發無限創意。\n（愛德華・狄波諾《6 頂思考帽》）"
