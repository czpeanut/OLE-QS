- id: doc_113_新北_永和_國文_g8s1e1_s5_25
  section: 5
  number: 25
  type: single
  page: 3
  stem: '如何讀現代詩是十分主觀的。英國著名詩人艾略特因為在詩裡大量地運用意象、象徵、典故，所以有關他作品的評論也往往意見紛紜。有人問他：「艾略特先生，您這首詩是否有這個含意？」他會說：「是的。」另一個人問他：「您這首詩是否有那個含義？」他也說：「是的。」你或許懷疑艾略特的誠懇，或許想問：「究竟他對誰說的是真話？」其實，艾略特兩次說的都是真話。文學作品在作者寫作之時，是作者的孩子，但是，一旦發表或出版後，它就成了所有讀者的孩子。

    下列何者最符合上述文字內容？'
  options:
