- id: doc_113_新北_永和_國文_g8s1e1_s6_36
  section: 6
  number: 36
  type: single
  page: 6
  stem: 依據甲、乙二文對於動物保育的觀念，說明最適當的是：
  options:
  - label: A
    content: 甲文強調維持動物間的生態平衡，建議多飼養狗與其他動物
  - label: B
    content: 甲文認為街貓比家貓快樂，反對在公寓大廈豢養動物的行為
  - label: C
    content: 乙文認同動物進行絕育手術，認為是控制街貓數量的必要手段
  - label: D
    content: 乙文認為人們應與街貓維持友善關係，不必拒絕外來貓咪移入
  group_stem: '（五）

    【甲文】

    愛貓的人愈來愈多，根據一項非正式的統計，臺灣養貓家庭的數量已超過養狗家庭。如果單以數量計算，貓口數必定遠多於狗，因為許多養貓人家裡都不只一隻。而如今走在街上，要看到流浪貓的機率比流浪狗高得多，街貓的實際數目則根本難以計算。

    養貓的人增加是因為觀念改變，已經沒有人相信貓來窮狗來富這種謬論了，而且愈來愈多人住在公寓大廈裡，養貓比養狗少了噪音問題與遛狗麻煩。當然，養的人多了，棄養的人也會跟著多，其實不只是貓，狗、蜥蜴、甚至鱷魚都一樣。

    日前發生的大橘子事件完全符合這個順序：牠曾是某人家中的寵物貓，後來被棄養，在街上被餵食、會主動與路人親近，最後慘遭毒手。

    所以街上有貓，到底是對還不對，好還是不好？

    愛貓人覺得貓比人可愛多了，更需要好好照顧，而不喜歡的就算沒親自動手，也常會打電話請清潔隊來處理。因為大部分先進國家都是沒有流浪動物的，所以我們應該讓街貓絕跡？還是貓本來就有權利生活在街上（就像野生動物在森林裡），只要沒人故意找牠們麻煩，其實過得比家裡的貓更自由快樂？

    （吳毅平〈城市新住民——街貓〉）

    【乙文】

    臺北市街貓友善照護行動方案（TCCP）意指街貓之誘捕、絕育、回置（即TNR），再加上領域照護管理，如定期除蚤、當地志工後續照護。

    實施TCCP 的好處：

    1.當區域街貓絕育率達7 成，街貓數量將會有效獲得控制；若絕育率達成100%，將不再有幼貓出生，也能防止外來貓咪移入。具有繁殖能力的母貓平均一年生產3 次，平均懷孕母貓可生出4～6
    隻小貓，如不妥善處理，將造成社區嚴重問題。

    2.絕育街貓回置後，可減少外來貓入侵，維護區域平衡，避免街貓數量增加。

    3.絕育後的街貓半夜爭奪地盤、發情導致的哭號聲將有效獲得改善，居民也能享有安寧環境。

    社區常有愛心餵養人士基於愛護動物尊重生命立場，餵食街貓，希望盡己心力維護動物的生存權。

    在不違反「廢棄物清理法」與「傳染病防治法」規範下，當地餵養人士須共同維護社區清潔，保護動物生存權，定點餵食，定時清潔，降低因髒亂餵食而產生的鄰里衝突。                    （〈乾淨照護——午夜動保食堂〉）'
