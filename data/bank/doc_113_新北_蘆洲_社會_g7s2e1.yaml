- id: doc_113_新北_蘆洲_社會_g7s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: "早年，蘆洲是由河流沖積的一片沙洲，地勢低漥，導致水患不斷，\n居民被迫與河流爭地。自民國70 年二重疏洪道完工，並推動都\n市計畫，完成排水系統改善工程，蘆洲揮別水患夢魘，取而代之\n\
    的是，高樓如雨後春筍到處林立，公共設施漸漸完善。民國99\n年，臺北縣改制升格為直轄市，捷運蘆洲支線也在同年完工通\n車，蘆洲可望脫胎換骨，躍登為一座最具發展潛力的衛星都會。\n\
    (文章來源：新北市蘆洲區公所) \n上述關於蘆洲的介紹，哪一項屬於推力？"
  options:
  - label: A
    content: 二重疏洪道工程完工
  - label: B
    content: 台北縣升格為直轄市
  - label: C
    content: 捷運蘆洲站支線通車
  - label: D
    content: 地勢低窪致水患不斷
