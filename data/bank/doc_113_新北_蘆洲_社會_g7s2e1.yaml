  stem: 國立中正大學以「須符合大學形象」為由向戶政機關申請更改原地址「民雄鄉三興村陳厝寮 160 號」為「嘉義縣民雄鄉大學路一段 168 號」通過。 中正大學解釋，校址更改是為了學校和國際接軌時，能有一個較符合大學形象的地址，「陳厝寮」確實感覺較鄉土，也很難用英文翻譯，不符合國際化，於當時引起熱議。
