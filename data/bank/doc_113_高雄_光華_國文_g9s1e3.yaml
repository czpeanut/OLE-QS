  group_stem: "（甲）一翁有三婿，長裁縫，次銀匠，唯第三者不學手藝，終日閒遊。翁責之曰：「做裁縫的，要落幾尺就是幾尺。做銀匠的，要落幾錢就是幾錢。獨汝遊手好閒，有何結局？」三婿曰：「不妨。待我打一把鐵撬，撬開有人家庫門，要取論千論百，也是易事，稀罕他幾尺幾錢！」翁曰：「這等說，竟是賊了。」婿曰：「他們兩個，整日落人家東西，難道不是賊嗎？」\
    \       \n（笑林廣記 有進益）\n（乙）廚子偷油，煉好灌在腸內，趁腸未熱，圍在腰間，用衣遮蓋，忙忙來至二門。恰遇新姑娘回門走進，腸已透熟，只好挨著疼，躲在一旁。姑奶奶一見太太，眼中落淚。太太見了姑娘，起心裡心疼，說：「我的心肝，你疼死我了！」廚子在旁應之曰：「我的大腸，你燙死我了！」\
    \                                                （嘻談續錄 廚子偷油）"
