- id: doc_113_高雄_光華_國文_g9s1e3_s2_41
  section: 2
  number: 41
  type: single
  page: 5
  stem: 根據文意，文中畫線處填入下列何者最恰當？
  options:
  - label: A
    content: 人只要相隔天涯就會產生相思愁緒
  - label: B
    content: 人只要湊在一塊就會產生嫌隙
  - label: C
    content: 人只要聚在一起就會努力尋找歡樂
  - label: D
    content: 人只要受到激勵就會奮發圖強。
  group_stem: "你喜歡過年嗎？\n  在我小時候的記憶裡，過年可是一件相當重要的事，除了要幫忙家裡大掃除之外，還有豐盛而飽足的年菜，久違的親戚孩童圍在一起快樂嬉戲，還有那誘人的紅包。那時候我對這個世界的想像力是如此貧乏，一點點金錢便像是無限的可能。\n\
    \  你不是不期待過年，只是不習慣這些親友相聚噓寒問暖的場面，讓你直覺的想躲回社群夥伴的對話框裡，在那裡談論著「過年」這件事，有多麼無奈多麼無聊，還不如遁入遊戲中抽卡、打怪。只是，老套而雷同的遊戲關卡、一直重複出現的廣告、靠著外掛作弊或花大錢課金買道具而得勝的角色，讓你覺得即使在手機世界裡也是比來比去的世界，找不到快樂。\n\
    \  還記得過年的由來嗎？相傳遠古時期，有隻怪獸潛伏在海裡，總會在隆冬之際上岸侵擾人群聚落，為了這頭名為「年」的怪獸，人們開始紛紛驚懼走避，後來卻發現怪獸也有其弱點：怕紅色、怕火光、怕爆竹聲。於是，人們組織義勇軍，你可以想像成是遊戲裡頭的工會，組隊並認真打怪，最後趕跑了年獸。\n\
    \  我們現在的過年習俗，原來出自這麼古老的傳說——現在過年時節，大人通宵打麻將、牌桌上拚搏生死，或在追劇時又哭又笑，原來這些阿叔阿伯嬸嬸阿姨，血液裡也帶著騎士法師或是弓箭手的屬性，而且各有必殺技，年復一年逗得眾人爆笑連連。你細細觀察就會發現\
    \      ，而我們年復一年聚首，竟得感謝遠古以前被爆竹火花嚇得逃竄的年獸。\n  姑且不論年獸的傳說有幾分杜撰的成分，人類與大自然爭奪生存權的故事，你一定能理解。打開電視節目，野外求生的高手會告訴你：一個人在荒郊野外過夜，營火及聲響是最能驅走野生動物侵擾的方式之一。但是在過往的某些時代，擁有這樣知識的人可以稱得上先知！\n\
    \  新時代的少年呀！你身處的世界充滿大量的資訊與知識，任何不懂的事情只要拿起手機搜尋就會有答案。但你知道為什麼過年總是讓你不開心嗎？          \
    \                                   （陳榕笙 寫給新世代少年的過年備忘）"
