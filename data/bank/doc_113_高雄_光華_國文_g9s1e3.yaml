- id: doc_113_高雄_光華_國文_g9s1e3_s2_45
  section: 2
  number: 45
  type: single
  page: 7
  stem: '根據本文，下列關於過碳酸鈉、小蘇打粉與檸檬酸的比較何者正確？


    | | 適用髒汙 | PH 值 | 不適用物品 |

    | :--- | :--- | :--- | :--- |

    | 過碳酸鈉 | 陶瓷杯茶垢、咖啡垢、砧板汙垢、衣物頑垢 | （甲)10～10.6 | 金屬 |

    | 小蘇打粉 | （乙) 廚房爐具油汙、餐具油汙、抽油煙機油汙、抹布髒汙 | 8 | 鋁製品、漆器、榻榻米 |

    | 檸檬酸 | （丙)鹼性的水漬、肥皂垢 | 3～6 | （丁)大理石、不鏽鋼製品 |'
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
  group_stem: "過碳酸鈉：適合對抗頑垢、陳年髒汙\n  過碳酸鈉也稱活氧粉、活氧酵素，主要適合清潔頑垢，也有抗菌功能，舉凡陶瓷杯具、馬克杯上的茶垢、咖啡垢，或砧板上的汙垢、抹布髒汙、衣物頑垢等，都適合使用過碳酸鈉處理。\n\
    \  值得注意的是，過碳酸鈉遇水分解，易產生氧氣等物質，當金屬遇到大量氧氣，容易產生氧化，所以金屬物質不適合接觸過碳酸鈉。\n小蘇打粉：適合清除油汙、異味\n\
    \  小蘇打粉可以去油汙和除臭，沾上油漬的廚房爐具、餐具等，使用小蘇打粉清潔，很快就能發揮效果。小蘇打粉也可以用於塑膠製品，但「不要粉狀直接使用，容易磨損塑膠表面。」此外，小蘇打粉不適合用於鋁製品、漆器、榻榻米等物品。\n\
    檸檬酸：適合清潔水垢、尿垢、肥皂垢\n  檸檬酸主要用於清除帶鹼性的水漬、尿垢或肥皂垢，也可用於陶瓷用品，但不能使用於大理石、鋁鍋等鋁製品。\n三種清潔神器的使用注意事項\n\
    \  林口長庚醫院 臨床毒物中心主任顏宗海指出，由於過碳酸鈉的酸鹼值（pH 值）為 10.4～10.6、小蘇打粉的酸鹼值為 8，檸檬酸的酸鹼值介於 3～6，如果呼吸道較敏感，或擔心這些物質可能刺激皮膚、眼睛，建議使用時可戴上口罩、手套或護目鏡，以免引起刺激造成不適。\n\
    （改寫自元氣網）"
