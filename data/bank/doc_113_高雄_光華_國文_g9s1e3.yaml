- id: doc_113_高雄_光華_國文_g9s1e3_s2_43
  section: 2
  number: 43
  type: single
  page: 6
  stem: 根據本文，下列何者是年輕味全龍隊選擇廖文揚的原因？
  options:
  - label: A
    content: 戰績彪炳
  - label: B
    content: 專注訓練
  - label: C
    content: 中規中矩
  - label: D
    content: 經歷豐富。
  group_stem: "2021 中華職棒32 年，因為味全龍隊的加入，增加更多話題、相關從業機會，更擴大選手表現的舞臺，舒緩臺灣棒運金字塔尖端狹窄的問題，除了在新人選秀會打撈新鮮人才，另透過特別選秀會引渡了現役選手入隊，其中不乏戰功彪炳的資深球星。\n\
    \  其中前統一 7-ELEVEn 獅隊投手廖文揚，曾經是球隊先發輪值的要角之一，備受郭泰源總教練的期待，也替球隊繳出過單季十勝的佳績。可惜隨著年紀漸長，身體素質下滑，沒有突破性的表現還得面對大小傷痛，很快地就在人才輩出的中華職棒場上被教練淡忘。\n\
    \  2016 年球季廖文揚還吃下了近百局，以及一場精彩的完投完封勝，也是生涯首次達到的成就！眾人以為這是廖文揚要「突破」的時刻，沒想到卻是急轉直下的翻弱訊號，2017\
    \ 年直到了四月底才趕上一軍出賽，帳上成績雖然中規中矩，但對於教練團而言，廖文揚原地踏步的表現，打擊了獅隊在季後挑戰賽的競爭力，間接讓球隊大膽啟用年輕球員，進而壓縮自己的表現機會。\n\
    \  職業舞臺非常現實，尤其在「僧多粥少」的中華職棒，2018-2019 年的廖文揚可說是完全從電視機裡頭消失了，兩個球季加起來僅在一軍投了 25 局，對於一個先發、長中繼角色的投手來說，若非有重大傷病，那就是完全被球隊棄用了，很明顯廖文揚屬於後者。\n\
    \  2019 年的特別選秀會，統一 7-ELEVEn 獅隊直接將他拉出 30 人保護名單，這對於邁入 30 歲大關的廖文揚來說，是一個強烈的警訊，很有可能過完生日就要離開職業舞臺，回歸士農工商。幸好，年輕的味全龍隊看上廖文揚的經驗，從小就是國家隊常客，除了代表中華隊出征國際賽，也有代表球隊出征職棒交流賽的經驗，加上標準「工作馬」的角色，足以成為年輕球員在訓練及競爭上的榜樣，獲得葉君璋總教練及其教練團肯定，期待他擔任年輕投手群的後盾，在場上及場下共同成長。\n\
    \  去年對於廖文揚而言內心肯定百感交集，世界的震盪讓棒球路更加迷離，除了適應後疫情時代的生活，同時還要融入駐紮二軍環境的心態。面對陌生的環境你我都會感到焦慮與不安，我想廖文揚肯定也不例外。\n\
    \  為了持續為棒球奮鬥，廖文揚很快地收拾心情、專注訓練，隨著臺灣疫情趨緩，一二軍球季也陸續開打，身為一位「高年級新學生」，他很快地步上軌道，同時替年輕的味全龍隊牛棚，以及尚在磨合的教練團，注入一股安定感。\n\
    \  也許是常駐二軍減少心態上的起伏，或是選手回歸初心與棒球對話，遮起名字廖文揚就像是「一年級生」，接受球隊所有的任務、扎實做完投手丘上的每一個動作，幫助球隊完成每一場精彩的比賽。2020\
    \ 球季，廖文揚總計出賽 47 場，雖然只是二軍舞臺的中繼投手，但是「出席率」已經寫下職棒生涯新高，防禦率 3.43 也是近五年來個人最好的表現（包含一、二軍），可以顯見強度問題可能不大，廖文揚的身手隨著成功地轉換角色，逐漸找回當初的銳利，不只大幅提升自信心，也幫助投手群甚至整體團隊，更接近一軍的競爭力。\n\
    \  2020 年對廖文揚來說，好像回到當初氣宇軒昂的年輕日子，不同的球衣和文化好像再青春了一次。不曉得是不是陽光的關係，看著在二軍出賽的廖文揚臉上好像多了一抹笑容，習慣深鎖的眉頭似乎也釋放出更多自信。\n\
    \  2021 年 10 月廖文揚就要邁入 34 歲，接近職棒選手生涯的尾聲，去年在二軍一整年，也許讓人覺得浪費，不過他卻沒有因此失志，反而重拾自己的心情，將一切功勳歸零，最後也成功找回自己應有的水準。「這一年」，比較像是上山修行，廖文揚離開臺南古都，在農業首都（雲林）用一步一腳印的態度，重新出發。\n\
    \  中華職棒 32 年昨天開打，今天味全龍隊也將迎來睽違 20 年的一軍舞臺，我想廖文揚肯定也是蓄勢待發！這次就讓我們一起期待，這些幾乎已經被你忘記，卻從未放棄的選手，在今年東山再起。\n\
    （改寫自【不要忘記我】：一起成長！—廖文揚）"
