  group_stem: 'What makes it rain? Rain falls from the clouds for the same reason
    anything falls to Earth. The Earth gravity pulls it down. Water droplets or ice
    crystals are what clouds are made of. Why don''t all of them fall from clouds?
    That''s because the droplets and ice crystals in clouds are so small that the
    effect of gravity on them is **minute**. Air and wind move and lift them. They
    just act like dust in the air. When the droplets grow big and heavy enough, they
    will fall from the clouds.


    | gravity 地心引力; droplet 小水滴; crystal 結晶體 |

