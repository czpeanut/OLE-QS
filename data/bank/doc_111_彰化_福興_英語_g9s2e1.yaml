  group_stem: "What's your eating order? Do you usually eat meat first, then rice,\
    \ and last, vegetables or eggs? Or do you just eat randomly: a bite of meat, a\
    \ bite of rice, and then a bite of vegetables and a spoon of soup?\n    If you\
    \ want to eat healthily and keep a good shape, here are some rules to help you\
    \ get slim: Eat soup first. A bowl of soup can make you feel a little full, and\
    \ you may not eat much afterwards. Soup can also warm your stomach. By the way,\
    \ thick soup is not as good as clear soup because it usually has more sugar and\
    \ flour in it. Second, try to eat a plate of vegetables at each meal. Vegetables\
    \ are great for your body. After eating a plate of them, you may start to feel\
    \ almost half full. Next, you can eat eggs, fish, or meat to get good protein.\
    \ Last, eat rice or noodles. Since the more rice or noodles you eat, the more\
    \ easily you will become fat. So it is better for them to take the least space\
    \ of your stomach. Also, the total calories should be in control: Too many of\
    \ them will make you heavier.\n    To become slim and stay healthy, eat wisely\
    \ and have food in correct order.\n\n*afterwards 之後; randomly 任意地/胡亂地"
