  group_stem: 'From March 1st, Bear Town will have a new bus network with more buses
    to more places in town. Here are some new changes for Bear Bus.

    1. Route A, which runs between Bear Station and City Park, will stop at two more
    stops, Joy Department Store and Queen''s Library. The first bus will run at 5:15
    a.m. on weekdays and at 5:30 a.m. on weekends after March 1st.

    2. Route B, which runs between Bear Station and Queen''s Library, will not stop
    at Joy Department Store from March 1st. Those who want to get to Joy Department
    Store will have to transfer to Route A at Queen''s Library. Route B will change
    its last bus from 9 p.m. to 10 p.m. every day after March 1st.

    3. Route C, a new route, will begin to run between Bear Station and Happy Zoo
    from March 1st. It will stop at High Street, Mia Bookstore, and George Road. The
    buses will run between 5:20 a.m. and 11 p.m. from Monday to Friday, and between
    7 a.m. and 8 p.m. on Saturday. It will not run on Sunday.


    | network 網狀系統; route 路線 |

