  stem: '8、清帝國統治時期，台灣隨著土地的拓墾，也開始興建水利設施。下表即是清帝國時期台灣的重要水圳。關於這四個水圳的介紹：①甲水圳是當時規模最大的水圳②乙水圳是由郭錫瑠父子興建，成為台中盆地最重要的灌溉渠道③丙水圳又稱為施厝圳，由當地的原住民割地換水④丁是由官方主導興建的水圳，⑤這四個水圳興建的先後順序是甲丙乙丁。正確的是


    | 水圳 | 水源 |

    | :--- | :--- |

    | (甲) | 濁水溪 |

    | (乙) | 新店溪 |

    | (丙) | 大甲溪 |

    | (丁) | 高屏溪 |'
  options:
  - label: A
    content: ①③⑤
  - label: B
    content: ②④⑤
  - label: C
    content: ③④⑤
  - label: D
    content: ①④⑤
