  stem: 15、回顧歷史，「大約在清朝嘉慶4 年(1800)，甲的港口已經『千帆林立，成為北台灣的貿易中心』。但在之後，通往甲的河道開始淤積，船隻要直達甲已有困難，所以乙順勢興起，取而代之。一府二鹿三甲逐漸變成一府二鹿三乙。但隨著河道持續淤積，加上早期移入乙地的三邑人與較晚到乙地的同安人爆發頂下郊拚，同安人落敗，最後輾轉至丙，利用此河道從事對渡貿易，後更因成為北台灣茶葉的加工區，丙地取代乙地，成為台北盆地最繁榮之處。」從以上短文，我們可擷取到哪些訊息?①甲乙丙三地的興起都與八里坌開港有關②頂下郊拚是屬於民變③丙地的崛起與英法聯軍有關④甲乙丙皆是利用基隆河發展對外貿易。正確的是
