  stem: '33、小漢和大原一起在討論開山撫番政策對台灣的影響：

    小漢：「我認為開山撫番是漢人披荊斬棘、歷經艱辛的偉大事業」

    大原：「我看完台灣的開墾歷程，只看得到漢人開墾史，卻完全看不到原住民的退卻史。」

    這兩人的論點：(甲)開山撫番與沈葆楨有關(乙)小漢是站在漢人的立場(丙)大原是以原住民的角度(丁)他們倆人的說法都太偏頗，無參考價值。正確的是'
