- id: doc_112_彰化_福興_國文_g8s2e2_s5_17
  section: 5
  number: 17
  type: single
  page: 4
  stem: 根據上篇文章，下列敘述何者正確？
  options:
  - label: A
    content: 「傷父之言」為淳于意因刑罰而受傷之時所說的話。
  - label: B
    content: 「上悲其意」是因為被緹縈的孝心感動。
  - label: C
    content: 「隨而泣」顯示五個女兒們因被父親連累一起受罰而十分哀怨。
  - label: D
    content: 淳于意生氣的原因是因為兒子未生下男孩以傳宗接代。
  group_stem: '題組17.-18.

    　　文帝四年中，人上書言意(1)，以刑(2)罪當傳，西之長安。意有五女，隨而泣。意怒，罵曰：“生子不生男，緩急無可使者！”於是少女緹縈傷父之言，乃隨父西之長安。上書曰：“妾父為吏，齊(3)中稱其廉平，今坐法當刑，妾切痛死者不可復生，而刑者不可復續，雖欲改過自新，其道莫由，終不可得。妾願入身(4)為官婢，以贖父刑罪，使得改行自新也。”書聞，上悲其意，此年即除肉刑法。（出自《史記·扁鵲倉公列傳》）


    注釋：

    (1) 意：淳于意，西漢時臨淄(今山東淄博東北)人。淳于意從前當過官，後來棄官行醫，救死扶傷，深受民間尊敬，人們從四面八方，長途跋涉，找他求醫。他精於醫術，替人醫病，治癒了很多病人

    (2) 刑：此指砍手足的刑罰。

    (3) 齊：古地名，今山東省，齊地。

    (4) 入身：古時刑律可把罪人收入官府為奴，此指這種懲罰。'
