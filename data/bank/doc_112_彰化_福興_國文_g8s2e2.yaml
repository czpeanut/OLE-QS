- id: doc_112_彰化_福興_國文_g8s2e2_s5_19
  section: 5
  number: 19
  type: single
  page: 4
  stem: 根據文中的敘述，作者的家鄉□□最有可能位於下列何地？
  options:
  - label: A
    content: 宜蘭
  - label: B
    content: 南投
  - label: C
    content: 高雄
  - label: D
    content: 澎湖
  group_stem: '題組19.-20.

    　　□□平原的孩子，首先認識的是水：雨水、井水、河水、溪水、湖水、海水、泉水。每一款又各有流派，譬如雨，春雨綿密、夏雨夾雷，一年兩百多天自成一本雨譜，□□人恐怕大部分在雨天出生，死時聽著雨歌斂目。


    　　□□地形長得大膽，像一隻從山脈躍下，打算盛海的「水畚箕」，眾水匯聚只好歸諸天意。這就難怪□□人長得水瘦水瘦，一街子來來往往，沒幾個胖；男的像瘦石、女似竹，眼睛裡七分水意三分淚意，好像一生都是濕的。…………


    　　我生於六○年代初，大水災後第三日。母親記得很牢，颱風那天屋頂被強風掀了，大水灌屋約膝蓋高，她躲在神案下流淚，肚子裡是頭胎，眼看要落地了，她說她全心全意命令我：「不要出來！」要是我不知好歹硬出娘胎，那節骨眼恐怕是死路一條。六○年代初□□農村，仍是茅茨土屋與油燈的日子，一條碎石窄路彎彎曲曲帶幾戶竹圍散厝，一旦強颱登陸，天地俱死，誰也救不了誰。（節錄自簡媜〈雨神眷顧的平原〉）'
