    content: 春雨又細又輕，夏雨既急且驟。
  - label: C
    content: 夏天雨聲淒切，令人不由得加快行走的步伐。
  - label: D
    content: 走在冬雨中，常會聽到人們哀怨瑣碎的嘮叨。
