  type: single
  page: 3
  stem: 《田園之秋選》描敘了名為「西北雨」的午後雷陣雨和其下雨情形，下列詩詞中形容的下雨情形何者與其他三者「不同」？
  options:
  - label: A
    content: 颶風忽起雲顛狂，波濤擺掣魚龍僵。海神怕急上岸走，山燕股慄入石藏。（顧雲〈天威行〉）
  - label: B
    content: 江海諸州縣，新秋卷颶風。樓台漂燕廈，城市化龍宮。舶寶千艘覆，亭鹽萬灶空。（方回〈古所無〉）
  - label: C
    content: 一雨復一陽，蒼茫颶風發。怒號兼晝夜，山海為顛蹶。（秦觀〈海康書事〉）
  - label: D
    content: 空山新雨後，天氣晚來秋。明月松間照，清泉石上流。（王維〈山居秋暝〉）
