    content: 彎彎月出掛城頭，城頭月出照涼州。涼州七里十萬家，胡人半解彈琵琶。（岑參〈涼州館中與諸判官夜集〉）
  - label: B
    content: 水光瀲灩晴方好，山色空濛雨亦奇。欲把西湖比西子，淡妝濃抹總相宜。（蘇軾〈飲湖上初晴後雨二首〉其二）
  - label: C
    content: 如此江山亦足雄，眼前鯤鹿擁南東。百年王氣消磨盡，一代人才侘傺空。（連橫〈江山樓題壁〉）
  - label: D
