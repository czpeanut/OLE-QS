- id: doc_113_台南_復興_社會_歷史_g8s1e3_s1_46
  section: 1
  number: 46
  type: single
  page: 1
  stem: '西元1872年，有一份文書這樣寫道：

    具結人詹興洪今與具結事：茲有子詹天佑情願送赴憲局，帶往花旗國肄業，學習機藝，回來之日，聽從中國差遣，不得在外逗留生理。倘有疾病，生死各安天命，此結是實。

    童男，詹天佑，年十二，身中面圓白，徽州府婺源縣人氏。

    曾祖文賢。祖世鸞。父興洪。

    同治十一年三月十五日　詹興洪親筆畫押

    ◎具結：保證的意思　◎生理：生活的意思

    請問：中國這段「學習機藝」的時期，後來的成效如何？'
  options:
  - label: A
    content: 捨棄中國文化而全面學習洋人制度，卻成效不佳
  - label: B
    content: 重視民生經濟而忽略軍事國防，造成對外戰爭失敗
  - label: C
    content: 培育具有國際觀的外交人才，國力蒸蒸日上
  - label: D
    content: 只模仿西式武器，卻缺乏整體性規劃，成效有限
