  group_stem: 'Read the following news from CAN:


    Five times a week, Taiwanese Bill Lin stops by a convenience store on his way
    home from work in New Taipei City. He visits it at this timing because he can
    get his hands on near-expired food items. Buying these discounted items allows
    Mr. Lin, a substitute teacher, to save about US$1 a day.

    “I can save about NT$700 to NT$1,000 (US$22 to US$31) a month by buying these
    discounted products. It’s quite a lot, and with the NT$1,000 that I save, I can
    treat myself to a nice meal that month.” the 30-year-old told CAN.


    Mr. Lin sounds poor, right? These years, because of inflation and low salaries,
    there are more and more young people like him. They are even called “beggar supermen”.
    Mr. Lin felt a little unhappy about that. He said, “These discounted hours actually
    help reduce food waste.”

    That’s really the point！In 2019, FamilyMart first started a food waste reduction
    program, and then lots of stores follow. They set a lower price for the fresh
    food items with a short shelf life for customers to buy before their expiration
    date. It leads to less food waste, and that means being nice to the Earth. What’s
    more, it’s also nice to customers because they can get the food at lower price.
    If you agree on the good idea, the following is more information for you to become
    a “superman”─a SDGs(Sustainable Development Goals) fighter instead of a beggar！


    The latest information about discounted hours for near-expired food items

