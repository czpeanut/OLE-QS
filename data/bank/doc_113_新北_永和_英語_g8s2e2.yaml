    bread, dessert. | 13:00~14:00: boxed lunch: 40% off<br>19:00~20:00: boxed dinner:
    40% off<br>08:00~23:00: fresh food items, bread, dessert: 20% off | 17:00~00:00:
    30% off<br><br>* bread, snacks, sandwiches, cake: 30% off |


