  group_stem: 'The English language has a lot of words. It is impossible to know exactly
    how many, but we think at least a quarter of a million！Of course, you don’t have
    to learn them all! Around 9,000 words cover 98 percent of everyday English. But
    that is still a lot！When you are trying to learn all these words, it can help
    to group words with similar meanings together.

    Take the word hard, for example. What are some other words for hard? Well, there
    is difficult, challenging, tough. Are there any more? Let’s look in a thesaurus
    to find out! A thesaurus is a book full of synonyms (words with the same meaning).
    What’s more, a thesaurus gives you a list of antonyms (words with the opposite
    meaning) as well. Each entry lists these synonyms and antonyms in alphabetical
    order (from A to Z).


    Hard

    1. a. difficult to do or understand

    Synonyms: baffling, challenging, complex, complicated, difficult, impenetrable,
    intricate, involved, problematic, puzzling, tough, tangled

    Antonyms: clear, easy, simple

    2. a. not soft

    Synonyms: compact, dense, firm, inflexible, rigid, solid, strong, tough, unyielding

    Antonyms: flexible, malleable, pliable, soft'
