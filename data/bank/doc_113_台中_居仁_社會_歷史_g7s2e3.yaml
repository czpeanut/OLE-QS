    美國總統與國會應根據他們對臺灣的需要所作的判斷，並依照法律程序，決定供應臺灣所需防衛性武器與服務的性質與數量。此種對臺灣防衛需要所作的決定，應包括美國所作的評估，並將此種建議像總統和國會提出報告。


