- id: doc_113_台中_順天_英語_g8s2e2_s2_34
  section: 2
  number: 34
  type: single
  page: 2
  stem: '三、閱讀測驗(每題 2 分，共 8 分)

    What is this reading mainly about?'
  options:
  - label: A
    content: The history of chocolate in West Africa.
  - label: B
    content: People can make chocolate in big companies.
  - label: C
    content: People can grow cocoa beans in warm places.
  - label: D
    content: Child labor is a problem in cocoa-growing countries.
  group_stem: 'People love chocolate around the world. But where does it come from?
    We use cocoa beans to make chocolate and people grow cocoa trees in warm places
    like West Africa. Two of the biggest cocoa-growing countries are Ivory Coast and
    Ghana.

    Sadly, many children work on cocoa farms. These children often work very hard.
    Some use sharp tools(工具) to cut cocoa pods(豆莢) or carry heavy bags. This work
    can be dangerous and hard. Many of these children do not go to school, and some
    do not get enough food or even get sick.

    Some kids work to help their families because they are poor. Others are forced(被強迫)
    to leave their homes and work long hours. This is called child labor, and it is
    against(違反) the laws.

    Some big chocolate companies said that they want to stop child labor. But in fact,
    they are not doing enough. What can we do to help them? We can choose not to buy
    chocolate from these mean companies or try to tell others the kids'' stories.
    Let''s start to make a change from now on!'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
