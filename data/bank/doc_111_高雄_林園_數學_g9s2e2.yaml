- id: doc_111_高雄_林園_數學_g9s2e2_s3_2
  section: 3
  number: 2
  type: calc
  page: 3
  stem: '如果玩家多次投注同一個賠率固定的賭局，他預期可贏得或失去的金額，稱為期望值。

    期望值可透過一個簡單的公式計算：

    將你獲勝的機率乘以每次投注能獲得的金額，再減去失敗的機率乘以每次投注失去的金額。

    期望值的簡易實例如下：如果你以10 元投注擲銅板中的人頭，每次你猜中時都可得到11 元，

    期望值就是 $\frac{1}{2}\times 11-\frac{1}{2}\times 10=\frac{1}{2}$，也就是，每次下注可期待自己贏得0.5
    元。

    思考一個問題吧！ 若有一個遊戲，擲一顆公正骰子一次：

    (1)賭局A：若擲出點數為1 或2，則可獲得10 元；但若擲出其它事件，則要賠20 元。請問期望值是多少？

    (2)賭局B：如果變成擲出點數為1 或2 可得1000 元；但若擲出其它事件，則要賠20 元，請問期望值為多少？

    (3)如果以期望值大小為考量，請問你會選擇玩賭局A 或是賭局B？'
  answer:
  - (1) -10
  - (2) 320
  - (3) B
  answer_source: answer_key_vlm
