- id: doc_113_新北_丹鳳_國文_g8s1e3_s1_39
  section: 1
  number: 39
  type: single
  page: 4
  stem: 「豬讓世界運轉」一句的意涵為何？
  options:
  - label: A
    content: 豬隻經濟價值高，製作的產品廣泛
  - label: B
    content: 透過豬隻的販賣，促進國際交流
  - label: C
    content: 豬可以被用來做人體移植和運輸工具
  - label: D
    content: 豬體的排泄物經過處理後，可製成替代能源
  group_stem: '荷蘭的一個藝術家，花了三年的時間，追蹤一頭豬被宰殺了之後，被物盡其用的程度，研究結果，令人嘆為觀止，原來豬的應用那麼廣泛，要說，豬讓世界維持運轉，也不為過。

    曼德絲瑪研究的那頭豬，沒有名字，只有編號，05049 號豬，被宰殺的時候，體重104 公斤。牠的屠體總共產生了185 種產品。裡面包括日常生活中不可或缺的肥皂、洗髮精、潤絲精、保養品、牙膏等。在發麵的時候使用的麵糰改良劑，是用豬毛裡面的一種蛋白質提煉，起司蛋糕、香草布丁、巧克力慕斯以及提拉米蘇等許多西點裡，會用到的吉利丁，以及啤酒、葡萄酒以及果汁製作過程中，用以過濾雜質的明膠過濾網，也是豬貢獻的。

    除了吃的和身體使用的物品，豬身上的東西、包括豬鬃、豬骨頭，幾乎無一沒有用處，就連豬的心臟瓣膜，都可以用做人體移植。

    ―― 豬讓世界運轉'
