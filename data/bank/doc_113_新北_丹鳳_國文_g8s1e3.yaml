  group_stem: '唐 溫璋為京兆尹，勇於殺戮，京邑憚之。一日，聞挽鈴聲，俾看架下，不見有人，凡三度挽掣，乃見鴉一隻。尹曰：「是必有人探其雛而訴冤也。」命吏隨鴉所在捕之。其鴉盤旋引吏至城外樹間，果有人探其雛，尚憩樹下。吏乃執之送府。以禽鳥訴冤，事異於常，乃斃捕雛者而報之。

    ―― 孫光憲 北夢瑣言

