  group_stem: 'Sue: Is this your picture, Zoe?

    Zoe: Yes, (26) .

    Sue: Who are the people in the picture?

    Zoe: They’re my teacher and classmates. The woman is my English teacher, Miss
    Brown.

    Her English classes are interesting, and we all like her.

    Sue: (27) is the girl between you and Miss Brown?

    Zoe: She is Jean. She’s very smart and good at math.

    Sue: I see. And the short girl next to you, what’s her name?

    Zoe: Her name is Ann. She is shy, but she’s nice to everyone.

    Sue: And the boy (28) you?

    Zoe: He’s Eric. He’s from the U.S. He always helps me with my English homework.

    Sue: How about the boy behind you?

    Zoe: (29) He’s a basketball player on our school team.

    Sue: Wow, you are so lucky. Your teacher and classmates are very cool!

    Zoe: Yes. Right. I think so, too.


    interesting 有趣的 smart 聰明的 shy 害羞的 always 總是 help 幫助 homework 功課'
