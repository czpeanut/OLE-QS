  options:
  - label: A
    content: 甲＜乙＜丙＜丁
  - label: B
    content: 甲＜丁＜丙＜乙
  - label: C
    content: 甲＜丙＜乙＜丁
  - label: D
    content: 乙＜丙＜丁＜甲
