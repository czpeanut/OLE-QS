- id: doc_113_高雄_龍華_數學_g9s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '以下敘述正確的有幾個？

    甲：$y=x^{2}+7$ 的圖形是以 $x-7=0$ 為對稱軸的線對稱圖形。

    乙：當 $a<0$ 時，$y=ax^{2}+b$ 的圖形有最高點，最高點坐標為 $(b,0)$。

    丙：$y=2x^{2}+1$ 圖形上的點 $(1,3)$，以 $y$ 軸為對稱軸的對稱點 $(-1,3)$ 也會落在 $y=2x^{2}+1$ 圖形上。

    丁：二次函數 $y=(x+1)^{2}-2$ 圖形的頂點為 $(-1,-2)$，則此函數圖形的對稱軸方程式為 $x=-1$。

    戊：二次函數 $y=(x+1)^{2}-2$ 圖形與 $x$ 軸有 2 個交點。

    己：$y=\frac{1}{2}x^{2}$ 的圖形向上平移 2 個單位，就可以得到 $y=x^{2}$ 的圖形。'
  options:
  - label: A
    content: '2'
  - label: B
    content: '3'
  - label: C
    content: '4'
  - label: D
    content: '5'
- id: doc_113_高雄_龍華_數學_g9s2e1_s1_2
