  group_stem: '(三)西元一世紀前後的人類歷史，在東方與西方不同的時空背景發展下，竟然出現類似的巧合。當時東方強權為中國的秦漢帝國，而西方則是偉大的羅馬帝國，兩者的發展巧合如下：

    巧合一：秦漢帝國以及羅馬帝國最主要的的外患皆來自於北方。

