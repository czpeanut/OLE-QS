  stem: 媽媽打不開玻璃罐頭，下列何種方法可以解決？
  options:
  - label: A
    content: 將金屬瓶蓋放在冰水下沖一會兒，就能因為金屬蓋收縮，內部半徑增加而打開
  - label: B
    content: 用熱毛巾包覆罐頭下半部，玻璃膨脹，即可轉開
  - label: C
    content: 用熱毛巾包覆玻璃罐的金屬蓋旋轉，因金屬蓋受熱膨脹，可輕易轉開
  - label: D
    content: 將罐頭冰在冷凍庫，隔天即可轉開。
