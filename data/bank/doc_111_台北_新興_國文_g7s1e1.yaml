  stem: （甲）心情／元氣 （乙）司機／ 運將 （丙）快遞／宅急便 （丁）浪漫／羅曼蒂克 （戊）可愛／卡哇伊（己）生魚片/哇沙米。上面各組，哪幾項前面的詞語和後面外來語的意思一樣？
