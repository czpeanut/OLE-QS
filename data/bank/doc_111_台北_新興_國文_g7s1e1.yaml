- id: doc_111_台北_新興_國文_g7s1e1_s3_7
  section: 3
  number: 7
  type: single
  page: 1
  stem: 關於夏夜一詩，下列何者的詮釋不正確？
  options:
  - label: A
    content: 藉由黃昏時昆蟲動物紛紛回家的滿足熱鬧，預告夏夜即將來臨
  - label: B
    content: 小弟弟小妹妹在老奶奶說故事的聲音中入睡，呈現了天倫之樂的溫馨
  - label: C
    content: 南瓜、小河、夜風、和螢火蟲還醒著，象徵寧靜的夏夜仍充滿生機
  - label: D
    content: 以豐富的想像力和擬人化名詞的活用，令全詩洋溢著活潑生動的氣息。
  lesson_raw:
    title: 夏夜
    basis: 題目指名夏夜一詩
- id: doc_111_台北_新興_國文_g7s1e1_s3_8
  section: 3
  number: 8
  type: single
  page: 1
  stem: 下雨天真好一文，下列何者不在作者「童年雨天有趣的事情」中？
  options:
  - label: A
    content: 躺在母親臂彎裡聽故事
  - label: B
    content: 和長工搶收玉蘭花送人
  - label: C
    content: 和父親在廊下賞雨看花
  - label: D
    content: 跟左鄰右舍一起聽鼓兒詞。
  lesson_raw:
    title: 下雨天真好
    basis: 題目指名下雨天真好一文
- id: doc_111_台北_新興_國文_g7s1e1_s3_9
  section: 3
  number: 9
  type: single
  page: 1
  stem: 下雨天真好一文中母親的形象生動清晰，請問下列何者最能呈現母親「敦厚善良」的特質？
  options:
  - label: A
    content: 母親瞇著眼，給我講雨天的故事
  - label: B
    content: 母親額角方方正正，眉毛細細長長，眼睛瞇成一條線
  - label: C
    content: 五月黃梅天，到處黏糊糊的，母親走進走出的抱怨
  - label: D
    content: 連忙盛一大碗滿滿的白米飯，請瞎子先生吃，再給他一大包的米。
  lesson_raw:
    title: 下雨天真好
    basis: 題目指名下雨天真好一文
