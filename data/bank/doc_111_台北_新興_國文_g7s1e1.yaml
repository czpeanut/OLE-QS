  group_stem: '我們過馬路的時候，大部分的人—那些所謂的「好人」，都會轉頭看反方向。老師就算發現我的手腕上有瘀血也不會直視我的眼睛；學校男生就算在走廊上撞到我，也只會瞪著我頭部上方的空氣，然後加速離開。黛兒薇和我一起修戲劇課，我敢發誓，即使舞台上只有我們兩個，其他同學依然可以對我們視而不見。

