  stem: 下列「 」中的字，何者讀音前後不同？
  options:
  - label: A
    content: 加以阻「撓」—不可「饒」恕
  - label: B
    content: 大聲「咆」哮—「刨」根究柢
  - label: C
    content: 「瑕」不掩瑜—好整以「暇」
  - label: D
    content: 「撤」職查辦—響「徹」雲霄。
