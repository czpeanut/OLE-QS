- id: doc_111_台北_新興_國文_g7s1e1_s3_13
  section: 3
  number: 13
  type: single
  page: 2
  stem: 下列選項，何者沒有使用「狀聲詞」？
  options:
  - label: A
    content: 我跟著小木船在爛泥地裡踩水，吱嗒吱嗒的響
  - label: B
    content: 聽到瓦背上嘩嘩的雨聲，我就放心了
  - label: C
    content: 瞎子先生的鼓咚咚咚咚的也敲得越起勁
  - label: D
    content: 笛聲低沉而遙遠，我依稀聽見，在雨中……。
- id: doc_111_台北_新興_國文_g7s1e1_s3_14
  section: 3
  number: 14
  type: single
  page: 2
  stem: 夏夜一詩中，由「提燈的螢火蟲」可知季節為夏季。下列文句，何者描寫的季節也是夏季？
  options:
  - label: A
    content: 下雪了，彷彿妙手的畫家為大地繪成了一幅白色、純潔的圖案
  - label: B
    content: 太陽把地面烤得滾燙滾燙，一陣南風颳來，從地上捲起一股熱浪
  - label: C
    content: 百花吐豔，陣陣清幽的竹香引來了翻飛的蝴蝶，於是靜謐的竹林變得熱鬧了
  - label: D
    content: 湖岸的樹木葉子變黃了，輕輕的飄到湖面，像一艘艘船，隨著流水向前遠航。
  lesson_raw:
    title: 夏夜
    basis: 題目指名夏夜一詩
- id: doc_111_台北_新興_國文_g7s1e1_s3_15
  section: 3
  number: 15
  type: single
  page: 2
  stem: 下列「 」中的詞語，何者使用不正確？
  options:
  - label: A
    content: 這件政治醜聞已鬧得「滿城風雨」，短時間內很難平息
  - label: B
    content: 陳先生為了償還工廠倒閉的債務，長年過著「眾星拱月」的辛苦生活
  - label: C
    content: 月黑風高的晚上聽鬼故事，令人不覺「毛骨悚然」
  - label: D
    content: 為了因應疫情的瞬息萬變，政府應當「未雨綢繆」及早準備。
- id: doc_111_台北_新興_國文_g7s1e1_s3_16
  section: 3
  number: 16
  type: single
  page: 2
  stem: 「□很愛唱歌／一下子用國語唱：花啦！花啦！／一下子用臺語唱：是你！是你！／咦？／花兒怎麼了？／我又怎麼了？」這首詩利用聲音的摹寫，呈現所詠之物的特色。根據詩意，句中缺空處應該填入下列何者最恰當？
  options:
  - label: A
    content: 雨
  - label: B
    content: 風
  - label: C
    content: 鳥
  - label: D
    content: 樹。
- id: doc_111_台北_新興_國文_g7s1e1_s3_17
  section: 3
  number: 17
  type: single
  page: 2
  stem: 關於吃冰的滋味一文，下列何者的詮釋不正確？
  options:
  - label: A
    content: 一旦把冰抽離，相信每個人的童年都會黯然失色—冰品豐富了許多人的童年，具有無可取代的地位
  - label: B
    content: 臺糖產製的冰棒和冰水，使用的都是道地的砂糖—臺糖貨真價實，品質優良
  - label: C
    content: 看得旁邊圍觀的小孩垂涎三尺，卻只有乾瞪眼的分—以前能吃上冰棒是很幸福的事，故意慢慢吃，引發別人的羨慕
  - label: D
    content: 像鄉愁般的隨著現代化的冰淇淋一一嚥下，竟別有一番古老的滋味在心頭—夏天吃冰，是作者味覺記憶的追尋，更是對逝去童年的眷戀。
  lesson_raw:
    title: 吃冰的滋味
    basis: 題目指名吃冰的滋味一文
- id: doc_111_台北_新興_國文_g7s1e1_s3_18
  section: 3
  number: 18
  type: single
  page: 2
  stem: 琦君：「寫文章不僅要鍛字鍊句，更要練意，要練到人人意中所有，人人筆下所無，才是人間至文。」由這句話可知，琦君認為人間至文須具備什麼條件？
  options:
  - label: A
    content: 動人心弦，神鬼莫測
  - label: B
    content: 膽大心細，字字珠璣
  - label: C
    content: 旁徵博引，廣泛舉例
  - label: D
    content: 人同此心，匠心獨運。
- id: doc_111_台北_新興_國文_g7s1e1_s3_19
  section: 3
  number: 19
  type: single
  page: 2
  stem: 下列詩句所描寫的皆是在夏夜一詩中出現的動物，請問哪一種入夜後才開始活動？
  options:
  - label: A
    content: 對摺的情書，尋找花的住址
  - label: B
    content: 我只是守著一方土地／一步一步／默默耕耘
  - label: C
