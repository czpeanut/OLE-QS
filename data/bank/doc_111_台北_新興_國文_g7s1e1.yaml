- id: doc_111_台北_新興_國文_g7s1e1_s3_11
  section: 3
  number: 11
  type: single
  page: 1
  stem: 關於下雨天真好一文，下列何者不正確？
  options:
  - label: A
    content: 末段低沉遙遠的笛聲，恰似作者飄然而逝的童年，令人惆悵
  - label: B
    content: 到杭州念中學是轉折點，作者在雨天的感受由快樂轉為淒涼寂寞
  - label: C
    content: 父親聽鼓兒詞紅了眼眶，索性溜進書房作唐詩，可見父親具有文人雅致
  - label: D
    content: 長工們下雨天不下田，陪吃陪玩，讓作者覺得熱鬧開心。
  lesson_raw:
    title: 下雨天真好
    basis: 題目指名下雨天真好一文
- id: doc_111_台北_新興_國文_g7s1e1_s3_12
