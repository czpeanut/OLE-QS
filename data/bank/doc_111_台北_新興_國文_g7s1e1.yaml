  group_stem: "馬桶與出恭 文／余遠炫\n 古時候有沒有廁所啊？當然有啦，有一句講來難聽的話叫做「占著茅坑不拉屎」，這個「茅坑」就是古人的廁所，但是很天然，沒有門也沒有沖水馬桶，就用茅草與竹子簡單搭個棚子遮一下。春秋時代，晉景公去上廁所時，竟然掉進茅坑裡淹死了，他應該是歷史上第一個死在廁所裡的君主。\n\
    \ 到了漢朝，茅坑的位置稍微變高了一點，設在宅院的後方，茅坑的下面是豬圈，人與豬的排泄物相混，稱為「溷廁」。這種廁所可以有效節省空間，混合的排泄物還可以做肥料；缺點則是，豬圈與排泄物混雜在一起可能會引發疾病。\n\
    \ 上廁所總要擦屁股，但紙張是東漢發明改良、一直到宋代才流行的產物，更不要說柔軟潔白的衛生紙還是近代才出現，而且只有少數奢華的家族得以使用。可見得在古代，用紙擦拭屁股，是一件不得了的大事情。那古人如廁後用什麼清潔呢？用扁平的石頭、光滑的竹片、大片的葉子或是用水清洗，也有講究的人會用布甚至絲織品。\n\
    \ 古時候上廁所有個文雅的說法，叫「出恭」。隋唐以來實施科舉考試，考場周圍都有「入則敬」、「出則恭」的標語，提醒考生恭敬有禮，因此考生內急時，就以「出則恭」的文雅方式表達，「出恭」因而成了上廁所的代名詞。\n\
    \ 那「馬桶」又是怎麼來的？原來，古代皇帝會便溺在桶裡，再由專門收運的人處理。而皇帝所使用的便器，一開始叫做「虎子」，就是將外觀做成老虎的樣子，在老虎頭上灑尿潑糞，代表一種精神勝利。到了唐朝則改叫「馬子」，因為唐朝開國皇帝李淵的父親叫做李虎，古代對帝王姓名有避諱的習慣。後來，便器就被通稱為「馬桶」。所以，如果你向古人介紹女朋友，然後用以前的流行語說「這是我馬子」，其實非常失禮，也容易造成誤會。\n\
    \ 唐代有專門收取馬桶的清潔人員，稱為「傾腳工」，會挨家專戶收集糞便，然後做成肥料賣到農村。宋朝時，這個行業形成一定的市場規模，競爭還頗激烈，甚至會為了爭奪經營權而告官。等到抽水馬桶出現後，這種收馬桶的行業自然就漸漸式微了。"
