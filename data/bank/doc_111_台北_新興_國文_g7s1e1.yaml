- id: doc_111_台北_新興_國文_g7s1e1_s3_4
  section: 3
  number: 4
  type: single
  page: 1
  stem: 夏夜「來了！來了！從山坡上輕輕地爬下來了。來了！來了！從椰子樹梢上輕輕地爬下來了。」關於這些詩句，下列何者的分析正確？
  options:
  - label: A
    content: 連用多次「來了」，塑造夏夜倏忽而至的恐怖氣氛
  - label: B
    content: 「山坡」與「椰子樹」是專屬於夏夜的獨特景觀
  - label: C
    content: 「爬下來了」呈現夏夜隆重登場的強烈存在感
  - label: D
    content: 連用兩次「輕輕地」，表示夏夜在不知不覺中悄悄降臨。
  lesson_raw:
    title: 夏夜
    basis: 引用課文夏夜原句
- id: doc_111_台北_新興_國文_g7s1e1_s3_5
  section: 3
  number: 5
  type: single
  page: 1
  stem: 下列「 」中的字音寫成國字，何組前後相同？
  options:
  - label: A
    content: 「ㄕㄠ」縱即逝—「ㄕㄠ」來訊息
  - label: B
    content: 作法自「ㄅ一ˋ」— 考試作「ㄅ一ˋ 」
  - label: C
    content: 「ㄏㄜˊ」上眼睛— 「ㄏㄜˊ」第光臨
  - label: D
    content: 溫柔「ㄨㄢˇ」約— 音容「ㄨㄢˇ」在。
