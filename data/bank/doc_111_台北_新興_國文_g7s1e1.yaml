- id: doc_111_台北_新興_國文_g7s1e1_s3_23
  section: 3
  number: 23
  type: single
  page: 2
  stem: 「人生裡，總有那麼一、兩道可以喚回時光的食物，可能是一碗尋常的滷肉飯，也或許是一甕油亮的紅燒肉、一盅熱騰騰的雞湯。因為記憶是用來調味的佐料之一，聞著吃著，光是氣味就教人回味無窮，無論身在怎樣物換星移的時空裡，總能真實生動的喚醒生活曾經的片刻滋味，記起某些人、甚至是某個微小的動作或言語。」這段文字的主旨為何？
  options:
  - label: A
    content: 不管過去或現在，人類的生活始終與食物有關
  - label: B
