    One possible explanation, given by Andrew Vanden Heuvel, is the Ebbinghaus illusion.  This
    idea says that two circles of the same size can look different depending on the
    size of the objects around them.  Maybe the moon looks bigger near the horizon
    because it is next to smaller things, like trees, houses, or buildings.  When
    the moon is higher up in the sky, it’s surrounded by the vast sky, so it seems
    much smaller.

    Another possible reason, also given by Andrew, is the Ponzo illusion.  According
    to this theory, our brains trick us into thinking that something looks larger
    when it is closer to the horizon.  For example, two lines of the same size might
    look different, with the one nearer the horizon appearing longer.

    In short, there is still some debate about the moon illusion. But as long as you
    can see the moon in the night sky, it will keep happening.

