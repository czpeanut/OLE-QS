  group_stem: "Foot massages are very popular in Taiwan. In a standard foot massage\
    \ procedure, which lasts about 30 minutes, the client will first receive a foot\
    \ bath. Then, the massage therapist will work on one foot at a time, rubbing lotion\
    \ or massage oil onto the skin and applying as much pressure as the client can\
    \ handle. As the massage therapist uses their hands to work wonders, they tend\
    \ to chat casually with the client.\n    Many massage shops employ blind or low-vision\
    \ massage therapists. This is an old practice in Taiwan, and for a time, it was\
    \ illegal for sighted people to work as massage therapists. Although more opportunities\
    \ are now available for blind citizens, many still choose to make a living by\
    \ benefiting the health and happiness of others in a massage shop.\n    Traditionally,\
