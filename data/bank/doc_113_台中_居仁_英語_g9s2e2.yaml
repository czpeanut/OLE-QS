  group_stem: "On dark evenings, people near the North Pole can witness an amazing\
    \ sight. They can look up and see red, green, purple, and yellow lights flashing\
    \ in the night sky. This colorful light show wasn’t created through technology,\
    \ though. It’s the aurora borealis, a mysterious gift from Mother Nature.\n  \
    \  The name aurora borealis comes from the ancient world. Aurora was the Roman\
    \ goddess of the dawn. Boreas was a Greek god who controlled the northern winds.\
    \ In scientific terms, an aurora is a natural phenomenon. It happens when solar\
    \ wind particles in space hit gases in Earth’s atmosphere, which results in light\
    \ energy. The colors produced depend on the atoms in the air. Oxygen atoms create\
    \ brown and red lights. Nitrogen atoms will make blue or purple lights. If atoms\
    \ are close to the ground, the lights are often green.\n    Seeing the aurora\
    \ borealis in person is an unforgettable experience, but it can differ from place\
    \ to place. Take Alaska, for example. Tourists can view the lights while enjoying\
    \ a hot spring. In Northern Canada, visitors can experience the aurora borealis\
    \ as part of a camping trip. In Sweden, it’s possible to have dogs pull you on\
    \ a sled to an excellent viewing place.\n    Whichever destination you choose,\
    \ snapping your own photos will help you remember your trip for years. So, consider\
    \ purchasing a good camera that works well in a low-light environment. You should\
    \ also consider packing a tripod and a wide-angle lens to capture the scenery."
  ai_answers:
    gemini: C
    qwen: B
    gemini_high: C
  answer:
