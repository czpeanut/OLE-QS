    ※請仔細閱讀下面的文章並回答 33-35 題：~~胎兒與母親的羈絆~~

    當精子與卵子在輸卵管相遇，新生命便踏出第一步。受精卵在約分裂三次後抵達子宮，並在此處著床。著床後的胚胎透過和子宮壁之間形成的胎盤，可以接受來自母親的氧氣及營養，並將自身代謝產生的廢物如二氧化碳等藉由母體排除。就這樣，子宮成了胎兒成長與發育的庇護所與營養加油站。

    胎盤是由胎兒的組織和母體的組織合力製造而成的。胎兒的組織部份形成分支的絨毛。而面向此處的母親之子宮壁組織，形成包圍絨毛的凹陷。在絨毛和子宮壁組織凹陷之間的空隙裡充滿了母親的血液，也就是說，胎兒的絨毛就浸泡在母親的血液裡。胎兒血液和母親的血液在胎盤內被絨毛的薄壁分開來。胎兒就透過這層薄壁來進行氣體交換。

    結合胚胎和胎盤的臍帶裡面有運送血液的血管。運送血液到胎盤的動脈為臍動脈，有兩條。另一條將血液送返胚胎的靜脈只有一條，稱為臍靜脈，通過肝臟下方後會回到大靜脈。'
