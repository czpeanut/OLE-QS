- id: doc_113_新北_土城_社會_g9s1e2_s2_51
  section: 2
  number: 51
  type: single
  page: 5
  stem: 請問：文中的此城是指下列哪一個城市？
  options:
  - label: A
    content: 耶路撒冷城
  - label: B
    content: 巴格達城
  - label: C
    content: 麥加城
  - label: D
    content: 伊斯坦堡
  group_stem: '此城是以色列的第一大城，建於內陸臺地之上，屬溫帶地中海型氣侯，距離主要港口較遠，且為保護宗教聖地而限制重工業發展，經濟發展不如第二大城特拉維夫，故轉而發展觀光業。對猶太人、基督徒和穆斯林而言，此城十分重要，是宗教間和平存在之地，也引發過許多爭論。

    3000 年前，猶太人曾在此設都、建聖殿。羅馬帝國初期，剷平猶太聖殿，另建羅馬神廟，並禁止猶太人在此地居住；由於耶穌在此城受難，西元4 世紀初時，某位羅馬皇帝下詔承認基督教合法後，該城因而成為基督教中心之一。此城於7
    世紀時遭鄰近興起的穆斯林攻下，初期採宗教寬容；11 世紀穆斯林世界出現新領袖，下令摧毀所有基督教堂和猶太會堂，身處義大利半島的羅馬教宗烏爾班二世號召眾人，協助同是基督教的拜占庭帝國共同抵抗穆斯林的侵略，收復該城，從此，穆斯林政權成為基督徒的攻擊目標，雙方戰役不斷。時至今日，以色列、巴勒斯坦兩國皆主張擁有此地主權，並多次爆發武力衝突，儘管如此，每年仍吸引許多信徒前往朝聖。'
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 歷史
      code: 3-2
      title: 基督教的起源與傳布
      chapter: 第3章 普世宗教的發展
