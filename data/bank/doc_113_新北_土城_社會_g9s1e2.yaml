- id: doc_113_新北_土城_社會_g9s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 聖索菲亞大教堂已有1500多年的歷史，其所在地點曾是兩大帝國的首都。原本是宗教建築，經歷多次政權的改變，其身分也不斷的轉變。請問：從政權的變化判斷，這座建築包含了哪兩大宗教的元素？
  options:
  - label: A
    content: 羅馬公教、希臘正教
  - label: B
    content: 猶太教、伊斯蘭教
  - label: C
    content: 基督教、婆羅門教
  - label: D
    content: 希臘正教、伊斯蘭教。
  tags:
