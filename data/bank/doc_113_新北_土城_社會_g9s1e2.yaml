- id: doc_113_新北_土城_社會_g9s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 孔雀王朝建立政權後，傳位到西元前 3 世紀阿育王在位時，政績輝煌，國力強盛，請問：下列何者是他的重要作為？
  options:
  - label: A
    content: 建立「種姓制度」，嚴格訂定各階層行為規範以維護社會秩序
  - label: B
    content: 建構婆羅門教教義，發展出因果報應主張
  - label: C
    content: 致力向外傳播佛教，使佛教信仰由印度逐漸擴展到鄰近的國家
  - label: D
    content: 結合民間習俗創立印度教，成為今日印度人民信奉的主要宗教。
