  group_stem: '(三)

    「快來買，日本新進產品一個五百！」胖胖的生意人聲嘶力竭的喊著，並且手裡還不斷反覆操作，然後摔在地上說：「這新產品不怕摔，不怕踩，日本貨就是品質保證！」

    「五百？太貴了！我那天在臺南，四百就買到了。」一個年輕人搖著頭。

    「少年仔，這是正港日本貨！」

    「錯不了，一模一樣。」

    「好！你拿來，如果一樣，我一個一千向你買。有多少，買多少！」

    「這可是你說的，大家都聽到了。」年輕人騎了車轉身就走。

    觀者如堵，沒人想離開，大家都等著看好戲。不一會兒，他走了進來。

    「你們看看不一樣？」他拿了幾個給現場觀眾檢驗，生意人無話可說。

    然後他對著大家說：「生意人講求的是公道和守信，……你之前說一個一千元向我買，相信在場各位可以幫我作證，我這有一百個。」他一邊說著一邊把東西搬到前面來，「放心，我不會這麼狠，只賣你五個，算給你一個做生意要講信用的警惕。」觀眾一邊為他喝采著。他拿了錢準備要走了，又停了下來，「既然東西都帶出來了，不想再拿回去，太麻煩了，如果各位要，一個算你們三百就好。」觀眾圍上來，他一手收錢，一手交貨找錢，忙得不可開支。

    夜已深，觀眾走了，剩下他們兩人。

    「今天賣了幾個？」生意人問。

    「你五個不算，共賣八十七個。」年輕人笑著問：「明天到哪裡？」

    「臺中。」'
