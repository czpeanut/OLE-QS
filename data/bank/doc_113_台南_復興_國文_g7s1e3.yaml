  type: single
  page: 2
  stem: '國文老師利用沈復的〈兒時記趣〉訓練學生摘要文本裡的總綱，再推想可以呼應的佳句詞語。請問下列選項中哪位學生的分析最正確？


    | 選項 | 文句 | 文句的意涵 | 可以呼應的佳句詞語 |

    | :--- | :--- | :--- | :--- |

    | (A)緯玲 | 見藐小微物，必細察其紋理 | 明察秋毫 | 善讀書者，無之而非書 |

    | (B)仲諺 | 夏蚊成雷，私擬作群鶴舞空 | 物外之趣 | 萬物靜觀皆自得 |

    | (C)秉佑 | 定神細視，以叢草為林，蟲蟻為獸 | 神遊其中 | 人生得意須盡歡 |

    | (D)翊凱 | 捉蝦蟆，鞭數十，驅之別院 | 行俠仗義 | 後天下之樂而樂 |'
  options:
  - label: A
    content: 緯玲
  - label: B
    content: 仲諺
  - label: C
    content: 秉佑
  - label: D
    content: 翊凱
