  type: single
  page: 2
  stem: '老師上完〈音樂家與職籃巨星〉想評量學生是否已理解課文內容。下列是課文與意近的文句，請問哪位學生理解有誤？


    | 選項 | 課文 | 文意理解 |

    | :--- | :--- | :--- |

    | (A)連穎 | (麥可‧喬丹)因為身高「暴漲」，他才順利地被選為學校正式代表隊的球員 | 麥可‧喬丹原本身高的條件不優 |

    | (B)昀儒 | 被譽為二十世紀最佳鋼琴曲目詮釋者的魯賓斯坦，像巴哈、莫札特般，是個音樂神童，三歲時就彈得一手好鋼琴 | 魯賓斯坦在音樂上具有絕佳天分 |

    | (C)振東 | 即使你的資質再好，若沒有經過琢磨，也是一塊沒有什麼價值的璞玉 | 勤練是成功的不二法門 |

    | (D)彥誠 | 苦練沒有什麼指望的事情，到頭來也許只是白費心血。這當然有部分的真實性，不過世事往往有出人意表者 | 點出徒勞無功的情形，強調行行出狀元的道理
    |'
  options:
  - label: A
    content: 連穎
  - label: B
    content: 昀儒
  - label: C
    content: 振東
  - label: D
    content: 彥誠
