  stem: 根據【乙】文，關於李尤《鞠城銘》的說明，下列何者錯誤？
  options:
  - label: A
    content: 前四句「圓鞠方牆，仿象陰陽。法月衝對，二六相當」主要在介紹比賽環境
  - label: B
    content: 第七、八句「不以親疏，不有阿私」所要求的對象■是指「裁判員」，必須公正
  - label: C
    content: 第九、十句「端心平意，莫怨其非」所要求的對象●是指「運動員」，須尊重判決
  - label: D
    content: 從銘文全文十二句的內容可讀出比賽人數、比賽時間、裁判原則、球員運動道德
  group_stem: '(四)

    【甲】

    東漢人李尤為一座剛完工的鞠城寫了一篇《鞠城銘》。鞠城是漢代專門從事蹴鞠的場所，類似今天的足球場。

    漢代的鞠城一般挖在地下，為的是不讓球滾到很遠的地方，免得撿球時耗費體力。蹴鞠隊員是分隊比賽的，他們之間進行的對抗與戰爭中兩軍對壘的形式很接近，比賽的激烈程度高。其中衝撞甚至比現在的足球賽更為激烈，為了防止對手攻擊，還允許有推摔等動作。漢代的蹴鞠也有球門，叫做鞠室，呈半月形，嵌在蹴鞠城的牆裡。雙方隊員直接衝撞，把球踢到對方的鞠室當中為贏。


    【乙】

    《鞠城銘》為後世留下最早的足球競技原則，短短四十八字，向千年後的人們傳達珍貴的漢代蹴鞠比賽資訊：

    圓鞠方牆，仿象陰陽。法月衝對，二六相當。建長立平，其例有常。

    不以親疏，不有阿私。端心平意，莫怨其非。鞠政由然，況乎執機！

    ＊「圓鞠方牆，仿象陰陽」，球是圓的，四面圍起的牆是方的，正符合天圓地方的陰陽之道。

    ＊「法月衝對，二六相當」，球場兩端，各設六個稱為「鞠室」的半圓形（月形）球洞，而每邊球員各六人，共十二人，正好表示一年的十二個月。

    ＊「建長立平，其例有常」是指比賽雙方各選出一個隊長、一個裁判，且比賽有穩定的規則。

    ＊「不以親疏，不有阿私」要求的對象是■

    ＊「端心平意，莫怨其非」要求的對象是●

    ＊「鞠政猶然，況乎執機」則指出足球運動尚且要依這樣的標準去做，何況是執政國事！

    （改寫自林將、黃武雄《Fuleco！世界盃足球戰國誌》）'
