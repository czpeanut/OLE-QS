- id: doc_113_台南_復興_國文_g7s1e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 關於〈兒時記趣〉一文的寫作手法說明，下列敘述何者正確？
  options:
  - label: A
    content: 「物外之趣」為全文綱領，描寫沈復善於運用觀察力縮小萬物，因而獲得童年生活的樂趣
  - label: B
    content: 由兒童的視角發揮豐富想像力，把叢草、蟲蟻、土壤變成了樹林、野獸、山丘，神遊其中
  - label: C
    content: 蚊子為沈復杜撰之物，用來對比群鶴飛舞在空中的數大之美，展現天馬行空的想像力
  - label: D
    content: 虛實交錯的筆法讓張聲勢的癩蝦蟆和打鬥的二蟲一起被作者趕出了花臺
  lesson_raw:
    title: 兒時記趣
    basis: 題目指明課名〈兒時記趣〉
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
