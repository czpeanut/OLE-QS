  stem: 下列哪個選項的文句翻譯得當？
  options:
  - label: A
    content: 「宣王說之，廩食以數百人」：宣王對此宣布給他的俸祿和其他數百名的樂師一樣
  - label: B
    content: 「渴，欲得飲，飲於河、渭，河、渭不足，北飲大澤」：夸父口渴難耐，想要得到喝的水，於是他痛飲黃河、渭水之水，仍喝不夠，又奔向北方，要痛飲大澤之水
  - label: C
    content: 「宣王死，湣王立。好一一聽之，處士逃」：宣王死去之後，由湣王繼承王位。人們一個個都聽說這個消息，處士得知宣王死訊後就逃走
  - label: D
    content: 「定神細視，以叢草為林，蟲蟻為獸」：我專注精神仔細觀看癩蝦蟆，只見癩蝦蟆把叢生的雜草當作樹林，把昆蟲螞蟻當作野獸。
