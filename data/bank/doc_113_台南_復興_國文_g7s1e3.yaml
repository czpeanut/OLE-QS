  options:
  - label: A
    content: 將來你也要和我一樣守護子女
  - label: B
    content: 有一天等你長大了才會了解我
  - label: C
    content: 莫忘原住民那神聖英勇的精神
  - label: D
    content: 我們父子再一次相約看電影吧
  group_stem: '(五)

    父親過世已整整二十年了，對他的「認識」與「思念」也成長了二十年。人的記憶和情感，真是一種奇妙的東西，它們常超越時空，讓生者與死者一次又一次地相逢。

    我十五歲便失去了父親，對他的認識當然是不成熟的。童年印象裡，父親溫和、沉默、閒散且善飲。他喜歡吃清淡的東西，做菜的風格與口味竟遺傳到我們每一個兄弟姊妹身上，尤其是二姊和哥哥。每次看他們兩人處理野菜的方式和效果都像極了父親。因此，在後來由他們主持的家庭聚餐裡，我們總不期然而然地想到父親做菜、吃飯和說話的神情，他二十多年來，似乎從未「缺席」過。也許這正是耶穌為什麼要透過「最後晚餐」，建立祂和追隨者「共融」、「合一」之方式的祕密。「聚餐」裡的「紀念」，可以讓參與者具體地經驗到死者的「臨在」；我想，「復活」的意義大致不出於此。

    從某個角度說，我們對死者的「認識」是「倒敘」的。我們是在「追憶」中，逐漸「發現」或「領悟」死者生時言行的全幅意義。少年時代，有一段時間，我不太能諒解父親飲酒、散漫的生活方式。那種對人生抱著「嘲弄」及帶著幾分「自棄」的態度，總讓我覺得是一種不負責任的表現。有一回，父親騎著單車載我到臺東市區看日本武士片，和往常一樣我們共同約定：我看我的電影，但不向母親「告發」；他喝他的酒，但不可喝醉。當然，時常是他「犯規」而喝得酩酊大醉。那一回，他又「背信」而爛醉如泥，我無論如何再也不肯妥協。一路上，淚流滿面地推著他和單車，歪歪斜斜地走了九公里的石子路返家。從此，我們偷偷看電影的機會便寥寥可數了。父親當時說：「______！」我始終記掛著他的這句話。這些年來，自己為人夫、為人父，而且更認識到原住民那種徘徊於「黃昏」及「黑夜」的命運，才漸漸體會到一個武士和獵人，失去其部落和弓箭，輾轉於家庭和民族責任間的心情。（改寫自孫大川〈紀念是另一種方式的相逢〉）'
