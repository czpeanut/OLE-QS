  stem: '夏至前一天，我從居住的城市出發。沒想到出發時天色忽然變暗，遠方滾動炸開低沉的雷聲，好像長久被積鬱壓抑的憤怒委屈，滿溢到了要翻騰激盪，在大氣間左衝右突，尋找宣洩爆發的出口。夏日午後熱帶島嶼雷陣雨前鬱悶潮溼、飽含水分的空氣，像一塊沉甸甸、溼答答、黏膩的布，緊緊貼在皮膚上。車子在山路上持續行駛，烏雲大片遮蔽了天空，光線迅速暗下來。

