  options:
  - label: A
    content: 如何讓瓶花保存時間更久
  - label: B
    content: 如何讓繪畫技術更加精進
  - label: C
    content: 如何讓瓶花吸引昆蟲依附
  - label: D
    content: 如何讓瓶花裝飾更加生動
  group_stem: '(六)

    余閒居，案頭瓶花不絕。芸曰：「子之插花能備風晴雨露，可謂精妙入神。而畫中有草蟲一法，盍1仿而效之。」余曰：「蟲躑躅2不受制，焉能仿效？」芸曰：「有一法，恐作俑3罪過耳。」余曰：「試言之。」曰：「蟲死色不變，覓螳螂蟬蝶之屬，以針刺死，用細絲扣蟲項繫花草間，整其足，或抱梗，或踏葉，宛然如生，不亦善乎？」余喜，如其法行之，見者無不稱絕。（節選自沈復《浮生六記》）

    【註：1.盍：何不，表示反問。 2.躑躅：徘徊不前的樣子。 3.作俑：引用「始作俑者」典故，比喻首創惡例之人。】'
