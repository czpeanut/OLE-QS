    圓鞠方牆，仿象陰陽。法月衝對，二六相當。建長立平，其例有常。

    不以親疏，不有阿私。端心平意，莫怨其非。鞠政由然，況乎執機！

    ＊「圓鞠方牆，仿象陰陽」，球是圓的，四面圍起的牆是方的，正符合天圓地方的陰陽之道。

    ＊「法月衝對，二六相當」，球場兩端，各設六個稱為「鞠室」的半圓形（月形）球洞，而每邊球員各六人，共十二人，正好表示一年的十二個月。

    ＊「建長立平，其例有常」是指比賽雙方各選出一個隊長、一個裁判，且比賽有穩定的規則。

    ＊「不以親疏，不有阿私」要求的對象是■

    ＊「端心平意，莫怨其非」要求的對象是●

    ＊「鞠政猶然，況乎執機」則指出足球運動尚且要依這樣的標準去做，何況是執政國事！

    （改寫自林將、黃武雄《Fuleco！世界盃足球戰國誌》）'
