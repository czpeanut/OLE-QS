    天下合從1。趙使魏加見楚春申君曰：「君有將乎？」曰：「有矣，僕欲將臨武君。」魏加曰：「臣少之時好射，臣願以射譬之，可乎？」春申君曰：「可。」加曰：「異日者，更贏與魏王處京臺之下，仰見飛鳥。更贏謂魏王曰：『臣為王引弓虛發而下鳥。』魏王曰：『然則射可至此乎？』更贏曰：『可。』有間，雁從東方來，更贏以虛發而下之。魏王曰：『然則射可至此乎？』更贏曰：『此孽2也。』王曰：『先生何以知之？』對曰：『其飛徐而鳴悲。飛徐者，故瘡痛也；鳴悲者，久失群也；故瘡未息而驚心未至也。聞弦音，引而高飛，故瘡隕也。』今臨武君嘗3為秦華，不可為拒秦之將也。」

