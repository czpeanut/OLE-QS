- id: doc_113_台北_誠正_國文_g8s2e1_s2_34
  section: 2
  number: 34
  type: single
  page: 4
  stem: 依據文意，下列何者正確？
  options:
  - label: A
    content: 余光中認為作品應該要客觀以符合社會期待
  - label: B
    content: 五四時期的作家多半呈現西方深度美感於作品中
  - label: C
    content: 作者認為余光中先生人如其文、文如其人
  - label: D
    content: 余光中認為必須慎選題材創作，否則無法創造風格
  group_stem: "「五四運動」以來，中文「現代化」的歷程往往跟「西化」有著不可切分的關係。余光中認為五四這一代的作家，不僅西化不夠，對中國古典文學的評估也不準確。他們往往偏重於文學的社會功能，忽略了作品的美感價值。他認為，現代散文不能流於口號宣傳，必須強化藝術性才能找到這個文類的生命力。余光中不斷拓展題材，無有不可寫者。不斷翻新技巧，務使手法鮮活，永遠對語言文字保持敏感。散文作品的呈現恰能印證他的美學觀：有聲、有色、有光。一個優秀的散文家，一定要能敏銳的覺知現象，形塑自己的風格，與讀者深刻地溝通。余光中運筆行文，總是統攝知性與感性，鎔鑄古典與現代，左手的美學讓我們看見現代中文原來可以如此深刻，如此豐美，就像他自己說的：「明滅閃爍於字裡行間的，應該有一種奇幻的光。」\n\
    \     余光中的散文一直不避諱有「我」，不故作客觀，也不蓄意保持距離。因為其中有「我」，更顯得快意淋漓。他驅遣文字一如開車，剛猛迅速中仍帶著風度翩翩。陳芳明說，有回南下西子灣探望余老師，年過八旬的余老師堅持開車送他去左營搭高鐵。只見余老俐落地轉動方向盤，有著咦呵西部裡的明朗暢快，恣意馳騁。高雄的道路筆直寬敞，最適合一路飛奔，讓詩人似乎不需要理會速限。高鐵左營站位在北高雄，小客車下客處在頂樓，其間幾多蜿蜒，許多駕駛人來到這裡都要變得遲緩。而余老過彎、滑行毫不猶豫，果然讓他準時搭上列車。在陳芳明的敘述裡，我彷彿看見，那花白的髮絲在風中飄揚，而詩人的眼神清亮，有一種睥睨，望向遠方。那態度其來有自，不外乎飛揚的才氣、深厚的學術功底，以及持續的努力。余光中文氣與人格一致，在恆久不懈的錘鍊、琢磨裡，一再地刷新了自己，乃至於卓然成家，氣度與風格並具。他的文字世界，有一股萬物皆備於我的氣勢。現代中文在他手上，終於有了一種奇幻的光。\n\
    \                                                                         （節錄自凌性傑\
    \ 有一種奇幻的光）"
