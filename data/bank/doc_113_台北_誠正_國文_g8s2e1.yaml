- id: doc_113_台北_誠正_國文_g8s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 在木蘭詩一詩中，「木蘭不用尚書郎，願借明駝千里足，送兒還故鄉。」所展現的情感與下列何者相同？
