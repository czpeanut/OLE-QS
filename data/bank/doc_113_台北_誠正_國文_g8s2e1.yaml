    content: 百川東到海，何時復西歸？少壯不努力，老大徒傷悲
  - label: B
    content: 還君明珠雙淚垂，恨不相逢未嫁時
  - label: C
    content: 穹廬為室兮氈為牆，以肉為食兮酪為漿。居常土思兮心內傷，願為黃鵠兮歸故鄉
  - label: D
    content: 夢見在我旁，忽覺在他鄉。他鄉各異縣，展轉不相見
  lesson_raw:
    title: 木蘭詩
    basis: 題幹提及課名木蘭詩並引述詩句
