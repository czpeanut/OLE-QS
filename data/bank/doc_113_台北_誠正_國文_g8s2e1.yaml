- id: doc_113_台北_誠正_國文_g8s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 關於木蘭詩一詩的文句分析，下列敘述何者正確？
  options:
  - label: A
    content: 「 將軍百戰死，壯士十年歸」前句寫征戰的慘烈、頻繁，後句寫征戰長久和壯士英勇的凱旋歸來
  - label: B
    content: 「策勳十二轉，賞賜百千強」以真實的數據直接寫出木蘭的戰功彪炳
  - label: C
    content: 「萬里赴戎機，關山度若飛」意近「即從巴峽穿巫峽，便下襄陽向洛陽」展現奔赴沙場的決心
  - label: D
    content: 「雄兔腳撲朔，雌兔眼迷離。兩兔傍地走，安能辨我是雄雌」這是以轉化手法，生動的說明「男女平等」觀點
  lesson_raw:
    title: 木蘭詩
    basis: 題幹提及課名木蘭詩
- id: doc_113_台北_誠正_國文_g8s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: '下列關於樂府詩和古詩的格律比較，何者說明正確？


    | | 樂府詩 | 古詩 |

    | :--- | :--- | :--- |

    | (A)由來 | 本是唐朝時掌管音樂的官署名 | 明代發展近體詩後，將漢、魏、六朝的詩作稱古詩 |

    | (B)作者 | 多為民間創作 | 大多為文人之作品 |

    | (C)句法 | 句式嚴整，多五言、七言 | 句式自由，多長短句 |

    | (D)格律 | 可以換韻，字數、句數不拘 | 不可換韻，字數、句數有限制 |'
  options:
  - label: A
    content: 由來：樂府詩本是唐朝時掌管音樂的官署名；古詩明代發展近體詩後，將漢、魏、六朝的詩作稱古詩
  - label: B
    content: 作者：樂府詩多為民間創作；古詩大多為文人之作品
  - label: C
    content: 句法：樂府詩句式嚴整，多五言、七言；古詩句式自由，多長短句
  - label: D
    content: 格律：樂府詩可以換韻，字數、句數不拘；古詩不可換韻，字數、句數有限制
  uncertain_spans:
  - 內容與原卷文字層不符（吻合 88%）
