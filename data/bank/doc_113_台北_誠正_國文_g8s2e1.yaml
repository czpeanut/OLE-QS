- id: doc_113_台北_誠正_國文_g8s2e1_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 「人生何嘗不像一場競賽。跑得慢的人有些會怨天尤人，一路上窩囊委屈；有的卻抱著龜兔賽跑的精神，努力不懈直到終點。而那些跑得快的也不見得永遠領先，有的後繼無力被人超前，有的半路摔倒一蹶不起，選擇放棄。因此，堅持到底的人才是最後的贏家。」下列何者可以作為這段話的佐證？
  options:
  - label: A
    content: 正義的事業能夠產生堅定信念和巨大的力量
  - label: B
    content: 我沒辦法決定我的成績如何，但我可以決定我在比賽中的樣子
  - label: C
    content: 老天爺之所以不停為難，只是想確定你能為這件事持之以恆、鍥而不捨到什麼程度
  - label: D
    content: 不要顧忌競爭，誰做事漂亮，他就能夠在競爭中取勝
- id: doc_113_台北_誠正_國文_g8s2e1_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 讓春天從高雄出發與控訴一支煙囪是余光中的名詩。有關這兩首詩的內容，下列何者敘述正確？
  options:
  - label: A
    content: 前一首詩滿載作者的祝願與期許，是他對自幼成長的故鄉愛之深的表現
  - label: B
    content: 前一首詩以「春天」為焦點，展現作者對高雄工業蓬勃發展的的讚賞與歌頌
  - label: C
    content: 後一首詩嚴厲譴責煙囪林立的情況，嚴重破壞美麗的高雄市容
  - label: D
    content: 兩首詩皆運用轉化，可看出作者透過深入了解當地風物與民情的深情摯意
