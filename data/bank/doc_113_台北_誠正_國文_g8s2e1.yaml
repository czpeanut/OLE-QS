- id: doc_113_台北_誠正_國文_g8s2e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 關於運動家的風度一文的文句分析，下列敘述何者正確？
  options:
  - label: A
    content: 「君子不怨天，不尤人」是一種永不服輸、再接再厲的心態
  - label: B
    content: 「超越勝敗的心胸」告訴我們輸了比賽就自認倒楣，下次再來
  - label: C
    content: 「言必信，行必果」說明說話信守承諾，行事堅毅果斷
  - label: D
    content: 「君子無所爭，必也射乎……其爭也君子。」指出君子在與人競爭時，應抱持著舉止合宜，依禮而行的態度
  lesson_raw:
    title: 運動家的風度
    basis: 題幹提及課名運動家的風度
- id: doc_113_台北_誠正_國文_g8s2e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 「乘舟而遇逆風，見揚帆者不無妒念。彼自處順，於我何關？我自處逆，於彼何與？」下列敘述，何者最能說明這段話的寓意？
  options:
  - label: A
    content: 人生順逆是個人的事，嫉妒只是徒增煩惱
  - label: B
    content: 處順境時切莫得意，處逆境時要隨遇而安
  - label: C
    content: 身處順境時更要謙卑以對，以免遭人嫉恨
  - label: D
    content: 善處逆境的人，將逆境視為助力而非阻礙
- id: doc_113_台北_誠正_國文_g8s2e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 「合音字」是由兩個音節急讀成一個音節的字，而被合音的字與合音字有意義上的關聯。例如：公諸，「諸」是「之於」二字的合音。下列同學在抄寫關於合音字的筆記時，何者不小心抄寫錯誤？
  options:
  - label: A
    content: 如如→你就「甭」操心了：「不用」
  - label: B
    content: 維維→這世衰道微，人心「叵」測：「不可」
  - label: C
    content: 甯甯→這種事情還「消」說嗎：「需要」
  - label: D
    content: 彤彤→請在座「諸」位起立：之於
