  stem: 下列何文句的「主語」和其他三者不同？
  options:
  - label: A
    content: 曾子衣敝衣以耕
  - label: B
    content: 請以此修衣
  - label: C
    content: 又不受
  - label: D
    content: 先生非求於人。
  group_stem: '曾子衣敝衣以耕，魯君使人往致邑①焉，曰：「請以此修衣。」曾子不受。反，復往，又不受。使者曰：「先生非求於人，人則獻之，奚②為不受？」曾子曰：「臣聞之，受人者畏人，予人者驕人；縱子有賜不我驕也③，我能勿畏乎？」終不受。孔子聞之曰：「參之言，足以全其節也。」

    （佚名 說苑．曾子不受魯君邑）

    【注釋】

    ①邑：封地。

    ②奚：為什麼。

    ③不我驕也：不對我顯露驕色。'
