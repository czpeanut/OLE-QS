  section: 1
  number: 13
  type: single
  page: 2
  stem: 杜甫 旅夜書懷：「細草微風岸，危檣獨夜舟。星垂平野闊，月湧大江流。名豈文章著，官因老病休，飄飄何所似？天地一沙鷗。」詩中末兩句杜甫以沙鷗自喻，表現出內心漂泊寂寞的感傷，下列何者的情意與此最接近？（註：①危檣：高聳的帆柱。檣，音ㄑㄧㄤˊ。②老病休：因年老多病而退休。）
  options:
  - label: A
    content: 來日綺窗前，寒梅著花未（王維）
  - label: B
    content: 人生無根蒂，飄如陌上塵（陶淵明）
  - label: C
    content: 夕陽無限好，只是近黃昏（李商隱）
  - label: D
    content: 欲取鳴琴彈，恨無知音賞（孟浩然）。
