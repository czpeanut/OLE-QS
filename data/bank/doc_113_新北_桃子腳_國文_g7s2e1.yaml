  stem: 「兩岸猿聲啼不住，輕舟已過萬重山。」關於這段詩句的解讀，下列何者正確？
  options:
  - label: A
    content: 「兩岸」象徵作者遭流放時，眾人的嘲諷與謾罵 從四面八方傳來
