  stem: 「格言」是指可以為人法則、砥礪言行的簡短詞語。下列與「讀書」有關的格言，何者解讀正確？
  options:
  - label: A
    content: 盡信書，則不如無書：讀書不可拘泥於書中內容，一味盲從
  - label: B
    content: 讀萬卷書，行萬里路：與其在家鑽研知識，不如外出開闊視野
  - label: C
    content: 讀書百遍，其義自見：透過反覆閱讀和背誦，可提高創作能力
  - label: D
    content: 光說不練，枉學百年：言行不一致，即使學問再深也無濟於事。
