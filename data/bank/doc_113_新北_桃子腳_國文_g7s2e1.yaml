    content: 「猿聲」的淒切不絕於耳，反襯作者內心難以抑制的澎湃之情
  - label: C
    content: 「輕」字不僅描寫作者輕裝出行，也傳達作者遇赦時輕鬆愉快的心情
  - label: D
    content: 「萬重山」暗示作者此番雖遇赦，但往後人生之路仍險阻重重。
