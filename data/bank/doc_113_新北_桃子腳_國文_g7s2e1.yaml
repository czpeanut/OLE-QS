  stem: 從曾子的行為中，我們可以得到什麼啟示？
  options:
  - label: A
    content: 在任何情況下，都應該拒絕他人的幫助和贈予，以保持自己的獨立性和尊嚴
  - label: B
    content: 應該積極尋求他人的幫助，這樣可以更快地達成自己的目標，實現個人價值
  - label: C
    content: 在接受他人贈予時，該考慮可能帶來的心理負擔和道德影響，權衡利弊後再做決定
  - label: D
    content: 對於上級的賞賜，無論是否需要，都應該欣然接受，以表示對對方的尊重和感激。
  group_stem: '曾子衣敝衣以耕，魯君使人往致邑①焉，曰：「請以此修衣。」曾子不受。反，復往，又不受。使者曰：「先生非求於人，人則獻之，奚②為不受？」曾子曰：「臣聞之，受人者畏人，予人者驕人；縱子有賜不我驕也③，我能勿畏乎？」終不受。孔子聞之曰：「參之言，足以全其節也。」

    （佚名 說苑．曾子不受魯君邑）

    【注釋】

    ①邑：封地。

    ②奚：為什麼。

    ③不我驕也：不對我顯露驕色。'
