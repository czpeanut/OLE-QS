  - label: B
    content: 「手機最先摧毀的，就是那些底層家庭的孩子」，因作者覺得只有底層家庭的孩子才會沉迷手機
  - label: C
    content: 引用馬斯克的觀點，主要是為了增強文章的權威性，使論點更具說服力
  - label: D
    content: 文末用「玩手機是欲望，不是需求」用對比的手法強調自己的觀點，希望喚醒被手機控制的青少年。
  group_stem: '有人說：

    「手機最先摧毀的，就是那些底層家庭的孩子。沒有背景，卻不思進取，沒有靠山，卻不肯努力，一天到晚，拿著手機，在虛擬的遊戲裏虛度光陰，在爛俗的劇情裏浪費青春。

    ……如今，手機已不再僅僅是一部聯絡感情的工具，一方小小的屏幕，早就主宰了人們的喜怒哀樂。尤其是青少年，彷佛掉進了手機裏，他們在打遊戲，刷視頻的爽感中，逐漸失去了情緒控制的能力，以及深度學習的能力。

    馬斯克曾經做出這樣的警告：

    短視頻算法會吃掉孩子的大腦。

    這不是危言聳聽，而是不爭的事實。曾有一項研究就指出，正常孩子的大腦和長期沉迷電子產品的孩子的大腦，結構明顯不同。前者紋路清晰，表面光滑，而後者則紋路混亂，甚至有些萎縮。

    孩子，你要清楚一點，玩手機是欲望，不是需求。

    需求一旦被滿足就會消失，可欲望不一樣，它是沒有盡頭的，你玩手機，玩了一個小時，還想再玩一個小時，若是不去控制，你可能會一直玩下去，直到毀掉你的一生。

    手機可以是連接世界的橋梁，拓寬知識的窗口，也可以是摧毀人生的毒藥，讓你無限沉淪，蹉跎一生。自律的孩子一直在努力向上爬，而不自律的孩子卻深陷垃圾快樂之中，難以翻身。沉迷遊戲的青少年，將會是人生賽道上被淘汰的第一批，放不下手機的人，註定也將扛不起生活。……

    （節錄自網路文章）'
