- id: doc_113_新北_桃子腳_國文_g7s2e1_s2_35
  section: 2
  number: 35
  type: single
  page: 4
  stem: 依據上文，當考古隊迷失方向時，他們最終如何找到回去的路？
  options:
  - label: A
    content: 他們依靠指南針來確認方向
  - label: B
    content: 他們是透過天文知識來判斷方位
  - label: C
    content: 被另一支來掩埋骸骨的探險隊救援
  - label: D
    content: 沿著他們來時埋葬骸骨所留下的標記行走。
  group_stem: '原來如此，善良是為自己留下路標！

    不論你傷害誰，就長遠來看，你都是傷害到你自己，或許你現在並沒有覺知，但它一定會繞回來。

    撒哈拉沙漠，又被稱為「死亡之海」，進入沙漠者的命運：有去無回。

    直到1814 年，一支考古隊第一次打破了這個死亡魔咒，當時，荒漠中隨處可見逝者的骸骨，隊長總讓大家停下來，選擇高地挖坑，把骸骨掩埋起來，還用樹枝或石塊為他們樹個簡易的墓碑。

    但是，沙漠中骸骨實在太多，掩埋工作佔用了大量時間。

    隊員們抱怨：「我們是來考古的，不是來替死人收屍的。」但隊長固執地說：「每一堆白骨，都曾是我們的同行，怎能忍心讓他們陳屍荒野呢？」

    約一個星期後，考古隊在沙漠中發現了許多古人遺跡和足以震驚世界的文物。

    但當他們離開時，突然刮起風暴，幾天幾夜不見天日，接著，指南針都失靈了，考古隊完全迷失方向，食物和淡水開始匱乏，他們這才明白了為什麼從前那些同行沒能走出來。

    危難之時，隊長突然說：「不要絕望，我們來時在路上留下了路標！」他們沿著來時一路掩埋骸骨樹起的墓碑，最終走出了死亡之海。

    在接受泰晤士報記者的採訪時，考古隊的隊員們都感慨：「善良，是我們為自己留下的路標！」

    在沙漠中，善良，是為自己留下的路標，讓我們找到回家的路。

    在人生道路上，善良，是心靈的指南針，讓我們永遠不迷失方向。不論你傷害誰，就長遠來看，你都是傷害到你自己，或許你現在並沒有覺知，但它一定會繞回來。

    凡你對別人所做的，就是對自己做，這是歷來最偉大的教誨，不管你對別人做了什麼，那個真正接收的人，並不是別人，而是你自己。

    （節錄自網路文章）'
