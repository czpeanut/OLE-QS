  type: single
  page: 5
  stem: 根據本文，杜甫在詩中提到「口脂面藥隨恩澤，翠管銀罌下九霄」，這些賞賜對他而言有什麼意義？
  options:
  - label: A
    content: 這些保養品象徵皇帝對他的重視
  - label: B
    content: 能得到「口脂面藥」喻示他即將升遷
  - label: C
    content: 「翠管」是裝口脂的竹管，「下九霄」指得到御賜之物，能得到代表他是位高權重的大官
  - label: D
    content: 因為進入「門下省」當諫官，而得到正月時的禮物，暗指他即將離開朝廷，是皇帝最後的恩澤。
  group_stem: '唐代的皇帝在正月的時候會頒賜口脂面藥給大臣，而且不是人人都有，通常是他的親信、宰相、北門學士還有諫官，換言之，收到這些保養品，就顯示你是皇帝看重的人，而收到禮物的人，都要寫一篇文章感謝皇帝……，這只是個例行公事中的小東西，但是杜甫四十六歲時初次收到這個禮物，他歡喜地寫下了這首詩。

    臘日常年暖尚遙，今年臘日凍全消。

    侵陵雪色還萱草，漏洩春光有柳條。

    縱酒欲謀良夜醉，還家初散紫宸朝。

    口脂面藥隨恩澤，翠管銀罌下九霄。

    臘日，就是農曆的十二月八日，是一年中最冷的時候。杜甫寫這首詩的時間是唐肅宗 至德二載（757 年），這一年，雖然安史之亂仍在持續，但西邊已經重歸唐廷，已經退位的唐玄宗從四川回到長安，看起來，唐廷已經積蓄了足夠的力量可以反擊。

    當然，對杜甫而言，最令他感到今年的冬天比往年溫暖的原因，是他擔任了諫官「左拾遺」，這個官職雖然不是非常高，卻是唐代的中樞機關「門下省」中一個很重要的位置。

    ……杜甫就是被選入了門下省，他的工作就是向皇帝提出諫言，這個職位象徵著一個人的剛正不阿，能得到這個位置，對杜甫而言，是個重要的肯定。……

    因此，至德二載的冬季，是杜甫一生中少有的燦爛時光，他並不覺得冷，一片冰冷的雪景中，他看見了金針花的嫩苗，明明是蕭瑟的柳條，在他看來卻隱約露出了春天的信息。他可能是在下班回家的路上吧，正盤算著晚上喝個通宵。……

    清冷的冬季，曾經悲憤吟頌「國破山河在，城春草木深」的長安城，或者曾有落魄王孫走避的巷弄，在至德二載可能都沒有太多改變，但是杜甫心中充滿了希望，他期盼已久的人生春天即將到來，他深信不疑。

    那是杜甫第一次、也是最後一次拿到皇帝的賞賜，隔年，他被貶謫，永遠離開了門下省，再也沒有回去。讀這首詩時，我常常想，如果時間可以停在至德二載的深冬，就好了。

    杜甫，你也是這樣想的嗎？

    （節錄自謝金魚 杜甫的護唇膏）'
