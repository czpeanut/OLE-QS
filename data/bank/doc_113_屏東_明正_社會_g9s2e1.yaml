  section: 2
  number: 41
  type: single
  page: 4
  stem: 法國紀錄片《醜陋快時尚》揭露了快時尚品牌背後的醜陋成本，導演波文(Gilles Bovon)認為快時尚品牌很懂得抓住人性的弱點：能以低廉的價格買到新潮的服飾，讓人很難抵抗消費衝動。然而，價格便宜很大的因素是靠著支付勞工低薪與逃避法規達成，跨國企業坐享高額的經濟利潤，工人依舊在危險和艱困的環境工作；且在過度製造與過度消費下，環境污染的問題不停循環。波文感嘆表示，要改變這些必須有賴政府制定法規來嚴格規範企業，不過現實就是世界上沒有任何政府會想介入，拍片時更看透了似乎根本就沒有所謂的「永續時尚」這件事，「希望大家在消費前，先去衣櫃好好診斷裡頭的衣服，衡量自己的需要。」請問：下列哪些是導演認為快時尚可能帶來的影響？
