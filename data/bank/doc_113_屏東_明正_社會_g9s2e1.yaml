- id: doc_113_屏東_明正_社會_g9s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 臺灣在早期的名稱相當多，早期曾被稱為 Tavoan，後來荷蘭人稱此地為 Tayovan，在此同時，漢人則出現大員、臺員或臺灣等寫法。請問：臺灣的命名由來，下列說法何者正確？
  options:
  - label: A
    content: 寫法拼字因使用者依聽音拼寫而來所以略有不同
  - label: B
    content: Tayovan 一詞源於當地平埔族，意指「美麗之島」
  - label: C
    content: 荷蘭人所說的Tayovan 指的是今日台北萬華一帶
  - label: D
    content: 鄭氏時期臺灣府已是官方的行政地名
