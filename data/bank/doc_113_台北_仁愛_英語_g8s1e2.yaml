  group_stem: "38-40\nDo you like birthdays? Do you like going to church? Do you \n\
    enjoy parties? Do you feel happy when you get lots of gifts? Do \nyou like to\
    \ dance? If you do, then you would probably like to \nhave a quinceañera.\nThe\
    \ word quinceañera is Spanish. Spanish is a language. It \nhas many different\
    \ words. Sometimes those words describe the \nculture of people who speak Spanish.\
    \ Quinceañera is one of those \nwords. A quinceañera is a special ceremony and\
    \ birthday party. \nThe birthday girl can also be called a quinceañera. Only \n\
    15-year-old birthday girls are called quinceañeras. Fifteen is an \nimportant\
    \ age for some girls who speak Spanish. When they turn \n15, they are no longer\
    \ children. The quinceañera party marks \nwhen childhood ends and adulthood begins.\n\
    A quinceañera is a very special event. It is like a wedding. It \nbegins with\
    \ a ceremony at church. It is a custom of their religion. \nAfter the ceremony,\
    \ there is a party with lots of decorations. The \ncommunity joins the party,\
    \ too. It is cheerful, and everyone \ndances. They give the birthday girl presents\
    \ and say good words \nto her.\nSome communities in America do not have quinceañeras.\
    \ \nMany Americans throw parties when kids turn 18. Those events \nare like quinceañeras,\
    \ but they are not the same. But people in \nAmerica who speak Spanish may have\
    \ quinceañeras. They may \nhave a ceremony and throw a big party for the community\
    \ when \ntheir girls turn 15.\n\nceremony 儀式   custom 習俗   religion 宗教\ncommunity\
    \ 社區"
