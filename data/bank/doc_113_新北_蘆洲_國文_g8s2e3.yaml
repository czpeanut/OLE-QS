  group_stem: '天行有常，不為堯存，不為桀亡。應之以治則吉，應之以亂則凶。彊本而節用，則天不能貧；養備而動時，則天不能病；修道而不貣，則天不能禍。故水旱不能使之飢，寒暑不能使之疾，妖怪不能使之凶。本荒而用侈，則天不能使之富；養略而動罕，則天不能使之全；背道而妄行，則天不能使之吉。故水旱未至而飢，寒暑未薄而疾，妖怪未至而凶。受時與治世同，而殃禍與治世異，不可以怨天，其道然也。故明於天人之分，則可謂至人矣。

    （荀子。天論）


