- id: doc_113_新北_蘆洲_國文_g8s2e3_s1_41
  section: 1
  number: 41
  type: single
  page: 6
  stem: 依據上文，飛魚季與達悟族的關係，下列敘述何者正確？
  options:
  - label: A
    content: 達悟族群的生態保育觀念通常比較迷信
  - label: B
    content: 飛魚捕撈的許多禁忌，是為了獲得庇佑
  - label: C
    content: 第一次煮飛魚放海水，表達對飛魚敬重
  - label: D
    content: 四月後改白天舟釣，是因為飛魚量太大。
  group_stem: '達悟族的永續海洋智慧

    許多原住民族的傳統生態知識都賦予自然「 神聖性 」，對原住民而言，自然不是外在的客體，人與自然是一體的，因此人與自然的互動必須遵守道德與倫理關係。神話中達悟族人將飛魚與其他海鮮混合煮食，導致人類皮膚生瘡、飛魚生病，隱喻人/魚之間跨物種的一體性關係，必須透過倫理法則才能維繫彼此的共生關係。

    製作飛魚專屬的「 飛魚盤 」，將生魚與煮熟的飛魚以不同的盤子分開盛裝的規則，今日看來完全符合食安原則。6 月前捕捉的飛魚只能用水煮，不可使用其他的烹調方式(
    煎炒炸 );飛魚季第一次煮飛魚必須加一些海水且不可放薑等規則，也傳達了族人敬畏飛魚的精神。

    飛魚的捕撈禁忌富含海洋永續的意義。例如，飛魚季的頭兩個月，可以夜間出海火漁，因為這期間飛魚量大，以火漁的方式捕撈效益佳。這段期間家家戶戶吃新鮮的飛魚，多餘的則曬成飛魚乾。4
    月之後過飛魚高峰期，改為白天舟釣禁止火漁，避免過度捕撈。5 至7 月飛魚漸少，只可舟釣飛魚，不可捕撈其他魚種，這是因為家家戶戶仍儲存不少飛魚乾，不需要也不必要花力氣再去捕其他魚種，讓其他魚種可休息養生。飛魚收藏祭之後，各部落禁止再捕撈飛魚，改捕其他魚種。

    最有意思的是飛魚終食祭，當天必須把家中儲存的飛魚全數吃完，終食祭後不能再儲存及食用飛魚的禁忌，無形中限制了家家戶戶在可終食的範圍內控制捕撈飛魚的數量。有人用「
    古代沒有冰箱，保存技術不良 」來解釋飛魚終食祭的用意，但這無疑是淺薄化了此一習俗的深層生態學意義。達悟族自古至今恪守的文化生態法則，達成了今日海洋資源管理科學所欲達到的目標。

    然而，近代蘭嶼觀光事業興盛，做為蘭嶼美食表徵的飛魚榮登餐飲業菜單及伴手禮名單，飛魚風味餐、飛魚麵、飛魚飯糰、飛魚卵炒飯等商品陸續出現，使得市場上對飛魚的需求提升。島嶼的發展吸引更多外地人落腳投入觀光產業，文化食物商品化是否受到危及飛魚的神聖地位？旅客如何能在觀光過程中學習擺脫獵奇心態，透過享用地方文化的神聖食物而同理在地的生態倫理？是關心飛魚文化及生態永續必須思考的問題。正如神聖生態學者所強調的：永續工作的成功，必須建立在神聖關係的基礎上，只有當執行資源管理的實踐與政策時也關心靈性，且人與非人物種間皆能秉持公平與尊重的互動關係下，才有可能達成目標。

    《節錄自 農訓雜誌397 期》'
