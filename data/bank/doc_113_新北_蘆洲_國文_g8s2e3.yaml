    古代沒有冰箱，保存技術不良 」來解釋飛魚終食祭的用意，但這無疑是淺薄化了此一習俗的深層生態學意義。達悟族自古至今恪守的文化生態法則，達成了今日海洋資源管理科學所欲達到的目標。

    然而，近代蘭嶼觀光事業興盛，做為蘭嶼美食表徵的飛魚榮登餐飲業菜單及伴手禮名單，飛魚風味餐、飛魚麵、飛魚飯糰、飛魚卵炒飯等商品陸續出現，使得市場上對飛魚的需求提升。島嶼的發展吸引更多外地人落腳投入觀光產業，文化食物商品化是否受到危及飛魚的神聖地位？旅客如何能在觀光過程中學習擺脫獵奇心態，透過享用地方文化的神聖食物而同理在地的生態倫理？是關心飛魚文化及生態永續必須思考的問題。正如神聖生態學者所強調的：永續工作的成功，必須建立在神聖關係的基礎上，只有當執行資源管理的實踐與政策時也關心靈性，且人與非人物種間皆能秉持公平與尊重的互動關係下，才有可能達成目標。

    《節錄自 農訓雜誌397 期》'
