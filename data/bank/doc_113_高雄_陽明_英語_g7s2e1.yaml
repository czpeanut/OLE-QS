  group_stem: 'Elisa has four nice roommates. She gets a secret letter from one of
    them. It says, “You are the best girl in the world. You always help me a lot.
    Here is a gift for you.” Elisa asks all of her roommates, but nobody says anything.
    The smart Elisa still knows. She puts her roommates’ habits in a chart and gives
    some clues. Please find out the secret roommate. Here are some clues:

    “The girl practices dancing a lot. Also, she uses much time to do photo shooting.
    She wants to work out at the gym, but she can’t do so because she doesn’t have
    enough time these days. What’s more, she doesn’t practice acting for a long time.
    She misses the acting classes so much. The girl is glad that she still has some
    time to sing some songs and has fun playing music.”


    | Roommates \ Frequency | Gym Work Out | Singing | Dancing | Acting | Photo Shooting
    |

    | --- | --- | --- | --- | --- | --- |

    | Shan | usually | always | often | seldom | usually |

    | Silver | seldom | sometimes | often | seldom | often |

    | Yen | always | sometimes | usually | often | usually |

    | Lily | never | sometimes | always | never | always |


     roommate 室友 the best 最好的 secret 秘密 clue 線索 chart 表格 frequency 頻率 What’s more
    此外'
