  section: 4
  number: 37
  type: single
  page: 7
  stem: 'What is the right order in the letter from the principal?

    A: What can we do to stop food waste?

    B: Why do we have to stop food waste?

    C: How much food people don’t eat in Taiwan in a day?

    D: How many people are hungry in the world every day?'
  options:
  - label: A
    content: D→ C →B→A.
  - label: B
    content: B→C→D→A.
  - label: C
    content: D→C→A→B.
  - label: D
    content: B→A→C→D.
  group_stem: "Dear students,\n    Do you have lunch at school every day? Do you have\
    \ enough food for lunch? What do you do to the food you don’t want? Do you throw\
    \ it away or eat it all? In Taiwan, many people have enough food; but not all\
    \ the people around the world have enough food. Over eight hundred million people\
    \ around the world are hungry every day.\n    In Taiwan, we throw away six thousand\
    \ tons of food every day, and that is really a lot of food. Can we do something\
    \ to stop food waste? Yes, we can. We can eat all the food in our daily life.\
    \ Don’t throw away food.\n    A lot of people are hungry every day. They don’t\
    \ have enough food. Think about this, “The food you throw away can be very important.\
    \ We can give the food to those hungry people.”\n    We have an event at eight\
    \ thirty this Friday. Come join us. Don’t eat for twelve hours. You can have only\
    \ water. You can also give money or food to those hungry people in the world.\
    \ You can talk about this event with your friends; let them know about this event.\n\
    \    I hope to see you on Friday morning. Let’s stop food waste together now.\n\
    Your principal,\nMary Lau\n\n enough 足夠的 million 百萬 ton 噸 waste 浪費 important\
    \ 重要的 event 事件 principal 校長"
