- id: doc_113_台南_民德_國文_g9s1e2_s4_1
  section: 4
  number: 1
  type: single
  page: 4
  stem: "「坐在運煤的車殼上，看檳榔樹一排一排往後退，就這樣退完了，就這樣到了花蓮。」句中所謂「檳榔\n   樹一排一往後退」是指："
  options:
  - label: A
    content: 檳榔樹隨著歲月遞嬗，漸漸消失
  - label: B
    content: 車行快速，檳榔樹的身影漸次隱沒於視線中
  - label: C
    content: 作者馳騁於想像所造成的感受
  - label: D
    content: 檳榔樹已被一排一排砍伐殆盡
  group_stem: "我曾經搭乘「戰後」的小火車離開這一帶鄉村，坐在運煤的車殼上，看檳榔樹一排一排往後退，就這樣退完了，就這樣到了花蓮。然後從花蓮出發，就從來沒有再回到那個山谷去過，三十年了。可是一旦回來的時候，又彷彿那三十年是虛幻的，也許因為外面的世界在變，劇烈地變，我也在變，只是山谷變得慢些，或甚至沒有變吧！是不是不變的比較實在，變的比較虛幻呢？這又不是我的哲學思維所能負荷的了。\n\
    \  這些是我對一個山谷的記載。我用這些文字記載一個山谷，懷念一塊土地，和一段日子。我知道我已經記載了一個山谷，雖然這個記載沒有結尾；可是我知道我還不曾認真寫下我對那一段日子的懷念，我無法接續，因為那是一段非常遙遠的日子，而且每當我感受到有什麼哲學之類的東西在我的心中蠢動的時候，我即知道，我必須停止。\n\
    \  我停止記載一個山谷。\n節錄自楊牧 山谷記載"
  tags:
    textbook: 九上 第三課 與921說再見：20年的生命練習題
