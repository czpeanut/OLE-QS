  options:
  - label: A
    content: 樹子夏季盛產的作物
  - label: B
    content: 樹子的撞擊聲由清脆轉無力表示可以收成了
  - label: C
    content: 樹子經過一二十分鐘熬煮即可煮熟裝罐
  - label: D
    content: 是絕佳的輔佐提味之料，有時滋味勝過主菜
  group_stem: "梅雨季後，樹子結出果實，逐漸肥大。夏初時，青綠果實形成纍纍的豐碩樣，還洋溢著亮光。\n有時西南風吹拂，彷彿諸多彈珠不斷碰觸，發出響亮悅耳的擦撞聲。家鄉的人都聽得出，那是果實\n\
    生嫩的清脆之聲，代表著尚未成熟。\n    又過一陣，撞擊聲輕軟無力，意味可以採收了。果實連枝帶梗取下，隨即放入清水中浸泡、清\n洗、摘取，以免黏手。緊接著，就是一二小時的熬煮。煮好瀝乾，盛入調製好的醬汁，涼冷即可裝\n\
    罐收藏。這樣的成品雖是輔佐之料，有時比主菜更受到歡迎。不論蒸魚、炒菜皆宜，或者任憑掌廚\n者摸索新吃法。\n    但昔時吾村的人，最愛製成一塊塊圓厚如漢堡肉的破布子餅，早晚餐皆為佐飯的必備菜肴。小\n\
    時候早上喝粥，我也頗能賞受這種傳統的醃漬內容。一小口稀飯配合一小口樹子，鹹滋滋的含在嘴\n裡咀嚼，再吐籽，最是開胃爽口。\n    食用樹子可消涼解暑，但如今不要說稀飯早點不流行，尋常家裡也少有這類醃漬品了。究其原\n\
    因，多數年輕一輩嫌其外形噁心，甚至懷疑傳統製作過程的骯髒。有陣子，北部不容易購得，還得\n專程遠到中南部的傳統菜市場，方能看到加工後的產品。\n    最近這等台灣古老的果物，頗有鹹魚翻身的跡象。原來，城市裡正在流行淡食、素食或者輕食、\n\
    慢食。麻煩的是食用者一多，過去俗賣的產品，如今價格上漲。種植的面積，似乎老趕不及需求量。\n不少對岸來的，嘗試以肥碩圓大的外貌充斥坊間。以我從小迄今的吃食經驗，切記，太青的恐無膠\n\
    質，過熟的則易籽肉分離。青黃摻雜最好，才能製出肉質豐厚，又有粘性醬菜的特性。\n\n                                   \
    \     ──改寫自劉克襄＜樹子──在地的提味之料＞"
