  stem: 有關《論語》和《孟子》的比較，下列何者的說明錯誤？
  options:
  - label: A
    content: 《論語》為孔子與弟子、時人談論對答的紀錄；《孟子》記錄孟子的言行與思想，闡揚孔子的思想
  - label: B
    content: 《論語》，《孟子》皆為《十三經》名著。兩書篇名都取自首章開頭幾個字，大多與文章內容相關
  - label: C
    content: 《論語》以仁為中心思想，提倡有教無類、因材施教；《孟子》提倡性善學說，主張民貴君輕
  - label: D
    content: 《論語》語言精練，含意深刻；《孟子》善用故事及譬喻，言詞犀利，雄辯滔滔
