- id: doc_113_新北_蘆洲_數學_g9s1e3_s1_4
  section: 1
  number: 4
  type: multiple
  page: 1
  stem: 以下敘述正確的有哪些? ( )
  options:
  - label: A
    content: 我們可以用對頂角相等的性質來判斷兩直線是否平行。
  - label: B
    content: 三角形的外心必在三角形內部。
  - label: C
    content: 重心與三頂點的連線段將此三角形的面積三等分。
  - label: D
    content: 三角形的三中線將三角形的面積六等分。
  - label: E
    content: 三角形的外心到三角形的三頂點等距離。
  - label: F
    content: 三角形的外心為三角平分線的交點。
  - label: G
    content: 任意兩個奇數的乘積是奇數。
  - label: H
    content: 任意兩個奇數相加的和是偶數。
