- id: doc_113_新北_蘆洲_數學_g9s1e3_s1_3
  section: 1
  number: 3
  type: fill
  page: 1
  stem: '已知: $\triangle ABC$ 和 $\triangle DCB$ 為兩個全等的直角三角形，其中 $\angle BAC=\angle CDB=90^\circ$，$\angle
    ACB=\angle DBC=30^\circ$，$E$ 點為 $\overline{BC}$ 的中點。


    求證: $\triangle ABE \cong \triangle DCE$


    證明：$\because E$ 點為 $\overline{BC}$ 的中點，

    $\therefore E$ 點為直角 $\triangle ABC$ 與 $\triangle DCB$ 的 ? 心，

    故 $\overline{AE}=\frac{1}{2}\overline{BC}=\overline{DE}$

    在 $\triangle ABE$ 和 $\triangle DCE$ 中，

    $\because$

    $\begin{cases} \overline{AB}=\overline{DC}\text{ (已知}\triangle ABC\cong\triangle
    DCB\text{)} \\ \overline{BE}=\overline{CE}\text{ (}E\text{ 點為}\overline{BC}\text{中點)}
    \\ \overline{AE}=\overline{DE} \end{cases}$

    $\therefore \triangle ABE \cong \triangle DCE$ (SSS 全等性質)。'
