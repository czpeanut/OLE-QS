  section: 1
  number: 1
  type: fill
  page: 1
  stem: '已知：如圖，$\overline{AB}=\overline{AC}$，$\overline{AD}=\overline{AE}$。


    求證：$\overline{BD}=\overline{CE}$。


    證明：在 $\triangle ABD$ 和 $\triangle ACE$ 中，

    $\because$

    $\begin{cases} \overline{AB}=\overline{AC}(\text{已知}) \\ \overline{AD}=\overline{AE}\quad(\text{已知})
    \\ \angle A=\angle A(\text{共用角}) \end{cases}$

    $\therefore \triangle ABD \cong \triangle ACE$（ ? 全等性質），

    故 $\overline{BD}=\overline{CE}$。'
