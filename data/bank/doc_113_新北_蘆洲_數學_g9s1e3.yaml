- id: doc_113_新北_蘆洲_數學_g9s1e3_s1_2
  section: 1
  number: 2
  type: fill
  page: 1
  stem: '已知：如圖，在正 $\triangle ABC$ 的兩邊 $\overline{AB}$、$\overline{AC}$ 分別往外側作正 $\triangle
    ABD$、正 $\triangle ACE$。

    求證：$\overline{BE}=\overline{CD}$。

    證明：(1) $\because \triangle ABC$、$\triangle ABD$、$\triangle ACE$ 均為正三角形，

    $\therefore \angle DAB=\angle BAC=\angle CAE=$ ① 度，

    得 $\angle BAE=\angle DAC=$ ② 度。

    (2) 在 $\triangle ABE$ 和 $\triangle ADC$ 中，

    $\because$

    $\begin{cases} \overline{AB}=\overline{AD}(\triangle ABD\text{ 為正三角形}) \\ \angle
    BAE=\angle DAC \\ \overline{AE}=\overline{AC}(\triangle ACE\text{ 為正三角形}) \end{cases}$

    $\therefore \triangle ABE \cong \triangle ADC$（ ③ 全等性質），

    故 $\overline{BE}=\overline{CD}$（對應邊相等）。'
  assets:
