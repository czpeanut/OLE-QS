  stem: '如圖，銳角三角形 $ABC$ 中，$D$ 點在 $\overline{BC}$ 上，$\angle B=\angle BAD=\angle CAD$。今欲在
    $\overline{AD}$ 上找一點 $P$，使得 $\angle APC=\angle ADB$，以下是秀賢、智媛兩人的作法：


    (秀賢) 作 $\overline{AC}$ 的中垂線交 $\overline{AD}$ 於 $P$ 點，則 $P$ 即為所求。

    (智媛) 以 $C$ 為圓心，$\overline{CD}$ 長為半徑畫弧，交 $\overline{AD}$ 於異於 $D$ 點的一點 $P$，則 $P$
    即為所求。


    對於秀賢、智媛兩人的作法，何人正確或兩人皆正確或兩人皆錯誤？( ) 。'
