  number: 46
  type: single
  page: 7
  stem: 根據大法官解釋的內容，主要著重在下列何者？
  options:
  - label: A
    content: 個人利益免受損害的消極「權利 」
  - label: B
    content: 人民依法向國家主張享受利益的積極「權利」
  - label: C
    content: 政府的「權利」應受到法律的限制
  - label: D
    content: 人治社會中統治者具絕對優勢。
  group_stem: 釋憲案之111 年憲判字第13 號是因民間團體認為：健保資料庫強制留存民眾就醫個資，卻欠缺監督機制或讓當事人要求停止利用的救濟方法，因而聲請釋憲。大法官解釋如下：本次判決雖然部分最後被認定合乎憲法但仍作出了許多違憲認定。從《個資法》與其他相關法律整體觀察，發現欠缺保護個人資料的獨立監督機制，對資訊隱私保障有不足之處，要求相關機關應自本判決宣示之日起三年內，制定或修正相關法律。就健保署使用個人健保資料的行為，大法官認為《健保法》及相關法律並沒有提供足夠的規範，保障人民的權利，因此違反重要事物應交由立法者制定對應規範的憲法精神。
