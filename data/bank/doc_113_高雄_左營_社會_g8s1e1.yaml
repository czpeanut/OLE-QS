  stem: 從國家的組成要素來看，請問以上討論的主題應為下列何者？
  options:
  - label: A
    content: 人民擁有該國國籍者，享有國家權利與義務
  - label: B
    content: 政府是國家機關的總稱，政府擁有統治權，不受外力干涉
  - label: C
    content: 一國政府統治權所能及的區域，代表國家主權行使的範圍
  - label: D
    content: 主權為國民所共有，不受其他國家與組織干涉，能與他國平等建立外交關係。
  group_stem: 小花在奧運的轉播賽中看到一段介紹科索沃的資料：「科索沃是塞爾維亞的一個自治省。1999 年科索沃戰爭結束後，科索沃由聯合國託管。2008
    年科索沃全體人民透過投票，達99.8%同意，單方面宣布獨立，但是塞爾維亞始終堅持反對，除塞爾維亞、俄羅斯和中國等90 個國家外，目前獲得了108 個國家和地區的承認。中國政府認為：科索沃享有高度自治，是塞爾維亞共和國領土的一部分。2010
    年國際法院就科索沃案發表諮詢意見，認為科索沃2008 年宣布獨立“不違反國際法”。2016 年科索沃首次參加奧運會。
