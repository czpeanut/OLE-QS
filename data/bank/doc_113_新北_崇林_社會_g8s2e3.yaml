  page: 1
  stem: 依據報導內容判斷，嚴重超速所處罰的3 萬6000 元，屬於以下何者？
  options:
  - label: A
    content: 罰金
  - label: B
    content: 罰鍰
  - label: C
    content: 賠償
  group_stem: 過去高速公路深夜經常成為豪車飆速、競速的「賽車道」，為維護交通安全，《道路交通管理處罰條例》修法重罰，在2023 年6 月30 日正式實施後，行駛速度超過速限的40
    公里以上的「嚴重超速」即屬危險駕駛，除可罰3萬6000 元，並吊扣汽車牌照6 個月，車輛完全不能上路。據統計，2024 年嚴重超速違規案件明顯減少，今年1-4月更較去年同期減少3
    成多，顯示重罰產生效果。此外，依規定，汽、機車所有人都要將車牌懸掛在指定位置，違者將會被警察依據《道路交通管理處罰條例》開罰。【2025-06-07 太報】
