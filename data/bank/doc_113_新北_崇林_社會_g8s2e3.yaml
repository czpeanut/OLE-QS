  stem: 請問以上四場運動，若以當初學生的目的而言，哪幾場是完全或部份成功的？
  options:
  - label: A
    content: 乙丙丁
  - label: B
    content: 甲乙丙
  - label: C
    content: 甲乙丁
  - label: D
    content: 甲丙丁
  group_stem: '以下四件事情是學生運動的報導

    (甲事件)外國媒體報導：「由學生領導的公眾自發悼念，很快就變成了大規模的上街遊行。他們呼籲為被排擠的領導人平反，並要求追隨他的遺願進行廣泛的改革：新聞自由、集會自由，以及結束官場腐敗。」

    (乙事件)北京大學等數千名學生於天安門舉行集會，以「外爭主權，內除國賊」、「還我青島」、「取消二十一條」為口號，抗議日本侵略山東以及要求懲辦曹汝霖、陸宗輿、章宗祥等與日交涉的官員，集會更迅即演變為全國規模的愛國運動。

    (丙事件)臺灣首次大規模的學生運動，數千名來自全國各地的大學生集結在今民主廣場上，提出「解散國民大會」、「廢除臨時條款」、「召開國是會議」和「政經改革時間表」等四大訴求，引起社會的同情支持。此次學運對臺灣的民主化產生了相當的影響。

    (丁事件)學生作為紅衛兵，將文革從學校蔓延到全社會，造成嚴重的社會動盪。大量學生積極參與了奪權活動和派性鬥爭。一些學校的群眾組織，甚至成為當地派性鬥爭的指揮和聯絡中心'
