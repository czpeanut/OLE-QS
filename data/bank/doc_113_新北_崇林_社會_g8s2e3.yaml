  section: 1
  number: 6
  type: single
  page: 1
  stem: 本次虐童案是台中市社會局主動稽查後揭露。關於社會局主動到托嬰中心稽查及後續的相關作為，下列敘述何者正確？
  options:
  - label: A
    content: 社會局稽查人員到托嬰中心稽查，屬於行政處分
  - label: B
    content: 相關作為的目的在於要求政府應對兒童及少年給予應有的福利
  - label: C
    content: 社會局對於陳姓托育人員及托嬰中心的裁罰，目的在限制人民權利
  - label: D
    content: 社會局人員稽查後發現虐童案件並予以裁罰，屬於依法行政
  group_stem: 台中市豐原區一間托嬰中心驚傳虐童案，經市府社會局主動稽查揭露，證實多名托育人員長期對幼童施以不當對待。社會局今（26）日公布調查及裁罰結果，對行為最惡劣的陳姓托育人員開罰最高金額60
