    （甲）作過 $B$ 且與 $\overline{AC}$ 垂直的直線，交 $\overline{AC}$ 於 $P$ 點，則 $P$ 即為所求

    （乙）以 $O$ 為圓心，$\overline{OA}$ 長為半徑畫弧，交 $\overline{AC}$ 於 $P$ 點，則 $P$ 即為所求

    對於甲、乙兩人的作法，下列判斷何者正確？'
