  section: 3
  number: 16
  type: single
  page: 2
  stem: 紙船印象一文的文句文意分析，下列何者正確？
  options:
  - label: A
    content: 「因雨勢而定，或急或緩，或大或小」：形容紙船下水後的各種姿態
  - label: B
    content: 「這些紙船都是有感情的」：是全文轉折處，由抒情轉為記敘
  - label: C
    content: 「這種美麗的情感要到年事稍長後才能體會出來」：意同「子欲養而親不待」
  - label: D
    content: 「只盼望自己能以母親的心情，為子女摺出一艘艘未必漂亮但卻堅強的、禁得住風雨的船」：作者盼望自己能傳承母親對子女的愛心，並盡最大的能力來護衛子女。。
  lesson_raw:
    title: 紙船印象
    basis: 分析〈紙船印象〉文意
