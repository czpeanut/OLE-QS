  stem: 關於文中對荔枝的介紹，下列解讀何者最恰當？
  options:
  - label: A
    content: 在春天收成，果實十分甜美
  - label: B
    content: 果肉潔白，汁液帶些酸味
  - label: C
    content: 味道與葡萄相似，僅顏色有別
  - label: D
    content: 賞味期僅五天，逾期就無法食用。
  group_stem: "（四）\n    荔枝生巴峽間。樹形團團如帷蓋，葉如桂，冬青。華如橘，春榮。實如丹，夏熟。朵如葡萄，核如枇杷，殼如紅繒1，膜如紫綃2，瓤3肉瑩白如白雪，漿液甘酸如醴4酪。大略如彼，其實過之。若離本枝，一日而色變，二日而香變，三日而味變，四五日外，色香味盡去矣。元和十五年夏，南賓守樂天命工吏圖而書之，蓋為不識者與識而不及一二三日者云。\n\
    白居易〈荔枝圖序〉\n【注釋】1繒：絲織品的總稱。 2綃：用生絲織成的絲織品。\n        3瓤：果內部可食的部分。 4醴：甜酒。"
