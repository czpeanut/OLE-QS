  group_stem: "（二）\n    世傳公冶長能解百禽語。一日，有鴟1來報長，曰：「冶長，冶長！南有死獐2！子食其肉，我食其腸！」公冶長應而往，果得獐，然其無意飼鴟以腸也。鴟是以怨之。居無何，鴟又來報如前。長復往，望見數人圍一物而嘩。長以為死獐，恐人奪之，遙呼曰：「我擊死也！我擊死也！」至，乃一死人。眾遂逮長見邑宰3。宰審問，長再三辯，宰曰：「爾自言『我擊死也』，何為詐？」冶長無以對。\n\
