    \    如果您還是非吃魩仔魚不可，在「魩鱙漁業管理規範」第二條第七款中：「各地方主管機關擇定每年5月1日至9月15日期間連續三個月為禁漁期」，建議各位不要在禁漁期內購買任何魩仔魚製品。因為如果禁漁期內能買到魩仔魚，這貨源便相當可疑了！以品質思考，是商家過季的冷凍庫存？以食安立場，這是安全的進口魩仔魚嗎？以法規層面，是違法捕撈的嗎？希望大家在購買前好好想一想，可以選擇產銷履歷清楚的守法魩仔魚。\n\
    \    即使魩仔魚不是經濟魚種，但任何一種「野生動物」都有牠存在的必要性，________________。\n——節錄改寫自尚儒〈不吃魩仔魚的理由：保留海洋一線生機〉\n\
    【注釋】1.魩仔魚：孵出未及一個月的魚苗。\n        2.鯷仔魚：魚苗長到超過一個月後，變成的亞成魚、成魚。"
