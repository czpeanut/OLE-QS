- id: doc_113_高雄_五甲_國文_g7s2e1_s4_5
  section: 4
  number: 5
  type: single
  page: 5
  stem: 依據上文，關於「媜」字的說明，最適當的是：
  options:
  - label: A
    content: 與「貞」字讀音相同
  - label: B
    content: 在甲骨文中象徵占卜的女巫
  - label: C
    content: 可以被聯想成品德貞潔的女子
  - label: D
    content: 《康熙字典》釋為女子寫得一手好字。
  group_stem: "（三）\n    記得小學四年級以前寫自己的名字是「楨」，導師說我是女生，應改成「媜」，從此我寫自己的名字都是「媜」。直到高中入學被一位大嬸譏笑：「連自己的名字都寫錯。」此生第一次翻看戶口名簿，果然是「媜」。\n\
    \    可惜因多次播遷，已無任何文件可以證明我的名字曾寫成「楨」與「媜」。日前查詢國小國中名冊，所留檔案皆是「媜」，戶政單位手抄戶籍登記簿上也「媜」，並無改名註記。\n\
    \    姓名乃標示「我是誰」之首端。「媜」字神秘莫測，《康熙字典》才找得到，讀音如「爭」非「真」。折騰到十七歲，字寫對了，會念了，但不知是什麼意思。……大學時上聲韻學，得知「媜」字確實念「爭」，義為「女字」，女子名字。撰聯名家張佛千先生曾以我名為題賜下一聯：「文章高詣貴在簡，女子美字古曰媜。」蘊涵勉勵之意。女子美字，既云女子有個美好的名字，又可衍義為寫得一手好字，再撮要假借為博得「文章美名」的女子，誰云不宜。\n\
    \    貞，會意字，甲骨文字形似一口寶鼎加上一支神杖「卜」形，相合而為：依據鼎內火炙變化而察看神跡。遠古殷商，無事不占卜，貞人即卜人，卜者釋義需求正確、堅定，故衍生貞定、堅貞、貞節之辭，所指皆是不可動搖的精神境界。《康熙字典》收有「媜」字，自字面推想，从女从貞，寓意品德貞潔女子，然我更愛這麼想：一個善占卜的女巫。而「簡」本是遠古用來書寫的狹長竹片，既簡且媜，一個聚精會神觀察大鼎內火炙變化再將占卜結果寫在竹片上的女巫形象，躍然而出。\n\
    改寫自簡媜〈迷霧中，呼喚我的名字〉"
