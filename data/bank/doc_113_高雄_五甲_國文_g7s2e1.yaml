  page: 1
  stem: 下列有關漢字的結構，何者說明正確？
  options:
  - label: A
    content: 「象形」和「指事」為字形不能再加以分析的獨體，稱為「字」
  - label: B
    content: 說文解字是中國最早依部首編排的字典，收錄字體多為小篆
  - label: C
    content: 倉頡是依據「象形、指事、會意、形聲」等基本法則來創造文字
  - label: D
    content: 象形造字法則是用線條來描摹物體外型輪廓，簡單好懂，因此占漢字總數的百分之九十左右。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
