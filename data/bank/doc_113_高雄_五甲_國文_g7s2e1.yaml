- id: doc_113_高雄_五甲_國文_g7s2e1_s4_1
  section: 4
  number: 1
  type: single
  page: 4
  stem: 根據文意，文末畫底線處最適合填入下列何者？
  options:
  - label: A
    content: 吃下肚前，請務必確保品質與價格是否相符
  - label: B
    content: 建立合理產銷渠道以增加其產銷是當務之急
  - label: C
    content: 不應以價值高低，而抹滅牠在環境中的地位
  - label: D
    content: 何況牠是「靠海吃海」的漁民日常食物來源。
  group_stem: "（一）\n    民國66年，魩鱙漁業發生了一場劇變！起源於農委會（行政院農委會前身）在民國66年6月時，從日本引進「雙船拖網」技術。小網孔（約0.2公分X0.2公分）的漁網搭配雙漁船的馬力優勢，在先進的魚探設備下，大幅提高了漁獲效率與產量，也替漁民們賺入大筆鈔票，改善了窮困的漁村生活。締造這樣的經濟佳績後，政府更是大幅推廣「雙船拖網」技術。\n\
    \    好景不常，漁民開始出現反對聲音！因為魩仔魚1產量提升了，但鯷仔魚2產量卻大不如前，且以流袋網、地曳網、搖鐘網、焚寄網捕撈魩鱙的漁民更傳出「空手而歸」的情況。\n\
    \    而其他鰺魚、鯖魚、鰹魚、鰆魚、旗魚、鮪魚等中大型魚類的漁獲產量也連帶下降，往常海上作業鯨豚作伴的情形也不見了！若以整個生態系統檢視，原來這魩鱙魚正是食物鏈中的「餌料魚」。中階消費者的鰺鯖鰹魚以魩鱙魚為食、高階消費者的鰆旗鮪與鯨豚又以鰺鯖鰹為食。當沿、近海的魩鱙魚消失時，這些以魩鱙為生的大魚們自然就消失了。\n\
    \    據聯合國糧食及農業組織統計，臺灣在民國65年前的漁獲量均維持1萬噸以上，但在民國66年後產量逐年下滑。從漁業年報中，更可見原先鯷仔魚的捕撈數量都是高於魩仔魚的，但是隨著時間發展，已轉變成魩仔魚高於鯷仔魚，且兩者的捕獲量更是逐年下降。我們是否可以合理懷疑有許多魩仔魚根本來不及長大？生態結構勢正因濫捕魩仔魚崩解？\n\
    \    如果您還是非吃魩仔魚不可，在「魩鱙漁業管理規範」第二條第七款中：「各地方主管機關擇定每年5月1日至9月15日期間連續三個月為禁漁期」，建議各位不要在禁漁期內購買任何魩仔魚製品。因為如果禁漁期內能買到魩仔魚，這貨源便相當可疑了！以品質思考，是商家過季的冷凍庫存？以食安立場，這是安全的進口魩仔魚嗎？以法規層面，是違法捕撈的嗎？希望大家在購買前好好想一想，可以選擇產銷履歷清楚的守法魩仔魚。\n\
    \    即使魩仔魚不是經濟魚種，但任何一種「野生動物」都有牠存在的必要性，________________。\n——節錄改寫自尚儒〈不吃魩仔魚的理由：保留海洋一線生機〉\n\
    【注釋】1.魩仔魚：孵出未及一個月的魚苗。\n        2.鯷仔魚：魚苗長到超過一個月後，變成的亞成魚、成魚。"
