    content: 小高：$\text{Al}_{2}\text{O}_{3}$ 和Cu 能發生氧化還原，因為Cu 能奪取$\text{Al}_{2}\text{O}_{3}$
      中的氧
  - label: D
    content: 涔妹：Al 和CuO 能發生氧化還原，因為Al 能奪取CuO 中的氧
