  stem: 已知鋁對氧的活性大於銅，若將下列各組混合物隔絕空氣加熱，請問哪一個說法正確？
  options:
  - label: A
    content: 粉紅翔：$\text{Al}_{2}\text{O}_{3}$ 和Cu不能發生氧化還原，因為缺乏空氣
