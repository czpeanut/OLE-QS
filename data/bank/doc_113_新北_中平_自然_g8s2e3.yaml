- id: doc_113_新北_中平_自然_g8s2e3_s1_30
  section: 1
  number: 30
  type: single
  page: 4
  stem: 有關文章提到的PLA，何者正確？【素養導向】
  options:
  - label: A
    content: PLA 容易被生物分解，並且屬於熱塑性聚合物。
  - label: B
    content: PLA 不容易被生物分解，並且屬於熱塑性聚合物。
  - label: C
    content: PLA 不容易被生物分解，並且屬於熱固性聚合物。
  - label: D
    content: PLA 容易被生物分解，並且屬於熱固性聚合物。
  group_stem: '[閱讀素養題] 替代塑膠的解方，真能永續嗎？——從PLA 談起

    在一場校園市集活動中，學生小恩發現攤位上的飲料杯底部印有「PLA」字樣。他本以為這只是另一種塑膠代碼，詢問後才知道這代表的是「聚乳酸」，一種被稱為生物可分解塑膠的新型材料。販售者說這種塑膠是從玉米澱粉做出來的，丟到土裡會自己分解，對環境比較友善。這讓小恩十分好奇：這樣的塑膠，真的可以取代傳統石化塑膠嗎？

    PLA 的出現，是在石化塑膠引發全球性污染問題背景下的回應。海洋中的塑膠微粒、土壤難以分解的垃圾、焚化造成的空氣污染……這些都讓科學家開始尋找新的替代材料。而
    PLA 恰好是一種從植物中提煉出來的高分子聚合物。它的原料來自玉米、甘蔗等可再生資源，製程也不需要依賴石油，成品則與一般透明塑膠非常相似，可以用來製作食品包裝、吸管、3D列印的線材。3D
    列印可以透過加熱PLA 線材，塑形成立體的物件。

    不過，當一項技術標榜「環保」時，事情往往沒有表面那麼單純。小恩開始查資料時，發現了一個令人驚訝的事實：雖然 PLA 的確能分解，但條件卻十分嚴苛。原來這種材料必頇在超過攝氏58
    度、濕度超過90%的工業堆肥場，才可能在數週至數月內分解成水與二氧化碳；若丟進一般的土壤、海水，甚至是家裡的廚餘桶中，它根本不會「自動消失」，可能會和一般塑膠一樣殘留多年。

    而另一個問題也開始引起政策制定者的注意。由於 PLA 和其他常見塑膠（如寶特瓶）在外觀上難以辨識，一旦進入回收系統，容易被誤分類，不但無法正確再利用，還可能破壞整體回收品質。更嚴重的是，目前台灣並未建立完整的
    PLA 回收與堆肥系統，大部分 PLA 最終只能送進焚化爐，與「可分解、可回收」的初衷背道而馳。

    因此，台灣政府在 2023 年 8 月起針對 PLA 製免洗餐具頒布使用禁令，禁止包括公部門、學校、百貨、超商與速食連鎖等八大類場所提供 PLA 餐具。政府指出，雖然
    PLA 的原料來自植物澱粉，但若無配套處理設施，其環境效益反而可能不如預期。同時，回收系統也尚未針對 PLA 建立獨立分類機制，多數僅能與一般廢棄物一併處理或作為燃料使用。

    站在科技與環境的交會點上，像 PLA 這樣的材料既是創新，也是挑戰。或許它還不完美，仍有許多改進的空間，但它所引發的反思——包括材料來源、處理方式、消費習慣與制度設計——正是邁向循環社會不可或缺的思辨起點。'
  answer:
  - B
  answer_source: answer_key_vlm
