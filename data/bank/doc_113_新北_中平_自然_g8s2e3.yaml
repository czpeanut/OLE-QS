  group_stem: '[閱讀素養題] 在壓力中改變世界——壓力鍋的故事

    一個週末午後，小菲祖母在廚房準備最拿手的紅燒牛腩。小菲在午休，被廚房傳來「咻咻咻」的聲音還有像蒸氣衝出的聲音節奏吵醒。沒多久，一股熟悉的香氣瀰漫整個屋子。小菲有些起床氣的走進廚房，看見爐子上那只銀色厚重的鍋子。他忍不住問：「奶奶，妳怎麼這麼快就煮好了？」

    奶奶:「這是壓力鍋啊!」這樣的回答讓小菲產生了疑問。他回房後開始查資料，想弄清楚這個「壓力鍋」，到底是怎麼回事。

    他發現，這種看似現代的鍋具其實源自三百多年前。1679 年，一位叫丹尼斯·帕潘的法國物理學家，發明了第一個「加壓煮食」的設備，當時被稱為「蒸汽消化器」。他原本的目的是為了解決食物煮不爛的問題，尤其是在沒有現代燃氣或電磁爐的年代，高效率煮熟食物是一種挑戰。帕潘發現：如果把水放在密封容器中加熱，水會變成蒸氣，而這些蒸氣在無處可逃的情況下，會使鍋內壓力上升。壓力升高，水的沸點也隨之提高，不再是大家熟知的攝氏
    100 度，而是能達到 120 度甚至更高。這樣一來，食物在高溫中可以更快變軟，蛋白質也更快變性、膠原蛋白釋放，口感自然就提升了。

    然而，壓力雖然帶來了效率，卻也隱藏風險。小菲繼續查下去，看到一些早期壓力鍋使用時爆炸的新聞。原來，若鍋子密封不良，壓力過高時又沒有及時釋放，多餘的蒸氣可能會撐破鍋體，造成危險。尤其在過去技術還不成熟的年代，有些使用者誤以為「壓力越高越好」，強行加熱，結果反而釀成事故。

    為了避免這樣的情況，現代壓力鍋設計時加入了多重安全裝置，例如安全閥、壓力閥、密封圈和防誤開蓋系統等。這些設計讓鍋內壓力若超過一定值時會自動洩壓，避免爆炸的風險。有些電動壓力鍋甚至會自動偵測壓力與溫度，控制火力與時間，進一步提升安全性與便利性。

    除了煮牛肉，小菲發現壓力鍋的應用還遠不止於此。在食品工廠裡，它被放大成為「高壓殺菌釜」，用來滅菌罐頭食品，確保保存期間不會發酵或腐敗；在實驗室裡，壓力鍋的原理也被應用於高壓滅菌器（autoclave），用於殺菌玻璃器皿與培養基，是科學研究中不可或缺的工具之一。

    一個晚上的閱讀後，小菲開始重新思考廚房的世界。他不再只看到「煮飯」、「做菜」這些日常動作，而是看到背後隱藏的物理原理!

    壓力鍋不只是鍋，也不只是壓力。它是一段歷史的結晶，是科學與生活交會的證明，是讓我們在現代生活中節省時間、提升效率的一項革命性工具。而當我們知道怎麼用它，也知道為什麼能用它，我們才真正學會了理解世界的運作方式。'
