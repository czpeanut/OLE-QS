  section: 1
  number: 48
  type: single
  page: 2
  stem: '即將到美國旅遊的莉芳至銀行購買外幣。請參考右表的銀行匯率告示牌，若莉芳想跟銀行買1 千美金，若不考慮手續費，他需要準備多少新臺幣？


    | 臺灣銀行匯率告示牌 | |

    | :---: | :---: |

    | 幣別 | 現金匯率 |

    | | 本行買入 | 本行賣出 |

    | 美金 | 29.3 | 30.1 |'
  options:
