- id: doc_113_新北_板橋_社會_公民_g9s1e3_s2_49
  section: 2
  number: 49
  type: single
  page: 2
  stem: 依據文中所提及之匯率變化情形判斷，下列對於當時情勢的分析，何者最為合理？
  options:
  - label: A
    content: 當時匯率仍有助我國機械廠商出口
  - label: B
    content: 國人在此時前往美國旅遊較為有利
  - label: C
    content: 此時用新臺幣可以兌換到更多美元
  - label: D
    content: 從美國進口的商品相對會調降價格。
  group_stem: '以巴衝突持續延燒，金融市場避險需求驅動下，轉而大量買進美元、黃金，新臺幣逐漸走貶，2023 年11 月一度出現1 美元兌新臺幣32.5
    元，創下近七年來新低。臺灣機械公會同業公會理事長表示，國際間機械設備競爭激烈，匯率成為接單的關鍵因素。新臺幣貶值幅度並不如主要競爭對手日本、南韓，在價格上未特別具有優勢，呼籲主管機關應讓新臺幣匯率與日、韓同升同貶。

    主管機關表示，政府重視業者心聲，且深刻體會業者經營處境；但匯率的變動主要應交由市場機制決定，若變動過於激烈，政府才會出面維持新臺幣匯率穩定。業者不宜過度仰賴匯率變化，應把握機會進行產業升級，以提升產品競爭力。請問：'
