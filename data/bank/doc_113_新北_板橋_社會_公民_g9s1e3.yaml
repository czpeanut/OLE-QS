  section: 1
  number: 41
  type: single
  page: 1
  stem: 有一位達人分享降低匯率變動風險的方式，以兌換日圓為例，那就是要緊抓著沒必要就不要換回新臺幣的原則，但是如果遇到最佳時機仍是可以換回新臺幣的。只要抱持著購買來的(甲)外幣是要用於旅遊資金或是留學費用，就能為自己(乙)累積一筆較低風險的外幣存款。根據上文的內容，下列哪一項解讀最為正確？
  options:
