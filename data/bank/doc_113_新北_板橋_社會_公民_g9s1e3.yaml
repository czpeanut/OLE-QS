  stem: 某法規是規定勞動條件的最低標準，已經上路40 年，每年仍有近8000 件雇主違法案例，多與勞工的工資、工時相關。違法比例為什麼居高不下？包含勞團、學者都認為，除了中小企業雇主可能因不熟悉法令挨罰外，雇主僥倖心態不願意遵守法規更是關鍵。上文所說的某法規應為下列何者？
