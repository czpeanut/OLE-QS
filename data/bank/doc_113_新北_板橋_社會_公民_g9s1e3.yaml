- id: doc_113_新北_板橋_社會_公民_g9s1e3_s1_38
  section: 1
  number: 38
  type: single
  page: 1
  stem: '兆中是個貿易商，特別關注日幣匯率的變化。下表是近期匯率變動情形。在其他條件不變的情況下，根據表中資料判斷，下列相關敘述何者正確？


    | 月分 | 8 | 9 | 10 | 11 |

    | :--- | :---: | :---: | :---: | :---: |

    | 新臺幣 | 0.2603 | 0.2561 | 0.2551 | 0.2479 |

    | 日幣 | 1 | 1 | 1 | 1 |'
  options:
  - label: A
    content: 兆中要將新臺幣兌換成日幣，就必須至中央銀行辦理
  - label: B
    content: 臺灣出口商品若與日本相似，則臺灣產品競爭力變強
  - label: C
    content: 對日本進口商而言，11 月從我國進口商品較8 月有利
  - label: D
    content: 對日本民眾而言，赴臺灣旅行，同樣行程的旅費較高。
