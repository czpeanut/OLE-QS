- id: doc_113_新北_板橋_社會_公民_g9s1e3_s1_39
  section: 1
  number: 39
  type: single
  page: 1
  stem: '在臺北國際旅展中，四家航空公司的促銷方式如下。對此下列分析何者最合理？

    甲航空：刷指定銀行信用卡買機票8 折優惠

    乙航空：刷卡購票優惠與甲公司相同，早鳥預購可再省10%

    丙航空：主打最新機型，擁有寬敞舒適的座位

    丁航空：定位為精品航空，以高級餐點、機上娛樂為賣點'
  options:
  - label: A
    content: 甲航空優惠屬價格競爭，必定可以增加獲利
  - label: B
    content: 乙航空為非價格競爭，長期下對消費者不利
  - label: C
    content: 丙航空採用非價格競爭，以提升品質為賣點
  - label: D
    content: 丁航空的方案屬價格競爭，以多元服務為主。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 公民
      code: 3-2
      title: 市場競爭方式與程度
      chapter: 第3章 市場與競爭
