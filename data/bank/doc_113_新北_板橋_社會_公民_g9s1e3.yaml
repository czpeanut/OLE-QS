- id: doc_113_新北_板橋_社會_公民_g9s1e3_s1_35
  section: 1
  number: 35
  type: single
  page: 1
  stem: 新聞報導：「知名餐飲集團員工向勞動局申訴，長期遭公司高層傳訊息騷擾，多次反映皆未獲改善。勞動局調查後，認定該集團未依法訂立《性騷擾防治措施申訴及懲戒辦法》，事件發生後也未採取立即有效的糾正和補救措施，因此開罰10
    萬元。」對於上述報導的解讀，下列何者正確？
  options:
  - label: A
    content: 餐飲集團未依《勞動基準法》處理騷擾事件
  - label: B
    content: 向勞動局申訴公司不當行為屬於員工的權力
  - label: C
    content: 報導提到的法律應是指《性別平等工作法》
  - label: D
    content: 勞動局對集團開出的罰款性質屬於損害賠償。
