  stem: 因新冠疫情影響，許多行業受衝擊而關門歇業，有的公司採取惡性歇業未提前依法通告，產生不少勞資爭議。權益受影響的勞工，往往求助無門，只能自力救濟。有律師表示，遇有勞資爭議時，可依據相關法令權利救濟。請問：發生勞資爭議時，勞工的救濟方式何者正確？
