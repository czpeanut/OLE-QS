- id: doc_113_台中_鹿寮_自然_g7s2e1_s2_44
  section: 2
  number: 44
  type: single
  page: 2
  stem: 下列有關鴨嘴獸生殖的推論，何者正確？
  options:
  - label: A
    content: 鴨嘴獸應為體外受精
  - label: B
    content: 鴨嘴獸應為體內受精
  - label: C
    content: 鴨嘴獸應具有肚臍
  - label: D
    content: 雌性鴨嘴獸應具有子宮
  group_stem: '【題組二】

    請閱讀下列文章，依據內容回答問題：

    鴨嘴獸是一種獨特的哺乳動物，與針鼴同屬單孔目，是現存僅有的卵生哺乳類之一。牠的外型結合了鴨子的扁平喙、海狸的尾巴與水獺的蹼狀四肢，使其能靈活適應水生環境，在河流與湖泊中活動與覓食。

    在生殖與育幼方面，鴨嘴獸與胎生哺乳類有顯著不同。雌性鴨嘴獸每年繁殖一次，一次可產下 1 至 3 顆卵，並在陸地上築巢、孵化卵。母體會用身體包覆住卵，提供適當的溫度與濕度，以確保胚胎正常發育。

    幼體孵化後，鴨嘴獸的哺育方式也異於一般哺乳動物。鴨嘴獸沒有乳頭，母體透過腹部皮膚腺體分泌乳汁，讓幼體直接舔食。幼體通常在巢穴待約 4 個月，期間母體會外出覓食並定期回來哺育。當幼體具備獨立的游泳與捕食能力後，便會離開巢穴，開始獨立生活。

    這種特殊的生殖方式，讓鴨嘴獸成為研究生化物演化的重要對象，也為科學家提供了哺乳動物早期演化的關鍵線索。'
