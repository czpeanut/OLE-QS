  group_stem: "齊景公遊於牛山之上，而北望齊，曰：「美哉國乎！鬱郁泰山。使古無死者，則寡人將去此而何之?」俯而泣沾襟。國子、高子曰：「然臣賴君之賜，疏食惡肉可得而食也，駑馬柴車可得而乘也，且猶不欲死，況君乎！」俯泣。晏子曰：「樂哉！今日嬰之游也。見怯君一，而諛臣二，使古而無死者，則太公至今猶存，吾君方今將被蓑苙而立乎畎畝之中，惟事之恤，何暇念死乎！」景公慚，而舉觴自罰，因罰二臣。\n\
    \                                                          《韓詩外傳˙齊景公遊於牛山之上》"
