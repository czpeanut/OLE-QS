- id: doc_113_新北_永和_國文_g9s1e1_s3_4
  section: 3
  number: 4
  type: fill
  page: 1
  stem: "《四季》是義大利作曲家安東尼奧˙韋瓦第(Vivaldi)創作的一組協奏曲，其中各分部用的音樂，分別對一年四季，進行不同的表現。\n    二○○九年，蘇打綠創作「韋瓦第計畫」，從臺灣臺東出發，發行專輯《春˙日光》，以世界民謠風作為核心，企圖將春天的溫暖包在整張專輯中，專輯音樂錄影帶也特地在臺東拍攝，希望能呈現更多的春天意象。\n\
    \    同年夏天，蘇打綠遠赴英國倫敦，在英國當地錄音室錄製搖滾風格的夏天專輯《夏˙狂熱》，專輯從音樂製作到母帶後期處理皆在倫敦進行，主打歌〈狂熱〉MV 更邀請知名團隊拍攝，同年正式發行。\n\
    \    二○一三年，蘇打綠發行以北京作為主題城市的秋天專輯《秋˙故事》，秋天專輯以憂傷詩歌作為主軸，專輯主打歌〈我好想你〉，同時也是電影《小時代》的主題曲。\n\
    \    走過春、夏、秋，蘇打綠冬天新專輯《冬˙未了》於二○一五年底發行，選擇德國柏林作為專屬主題城市。蘇打綠把德國柏林的莊嚴古典放入新專輯中，除了讓粉絲感受德國柏林的冬天氣息，更代表蘇打綠「韋瓦第計畫」的完結。\n\
    \    四張專輯都有明確的主題：《春˙日光》是對於生命、自然萬物的歌頌，《夏˙狂熱》是人心初萌的黑暗吶喊，《秋˙故事》是生活經歷了蕭瑟與豐收，而《冬˙未了》講的是結束，卻也同時帶來開始，主題是循環。\n\
