  group_stem: "女性的數理表現真的比較差嗎\n    刻板印象指的是人們對於特定團體所抱持普遍且典型的認知，當中「女性的數理表現真的比較差」屬於較為負面的刻板印象。1990\
    \ 美國社會學家克勞德．史提爾嘗試建立「刻板印象威脅」理論。根據這個理論，在「特定情境」下個人的表現的確會受到干擾，從而印證了且強化所屬群體背負的刻板印象。以下是史提爾提出的2\
    \ 項實驗：\n實驗一\n   實驗者找來數理能力相當的一群大學生，分為「男生組」、「女生組」，並依題目難易度，進行2 次測驗。實驗結果顯示在難易度「簡單」的第1\
    \ 次測驗當中，各組別獲得的成績沒有明顯的差別。而在難易度「困難」的第2 次測驗當中，2 個組別獲得的成績均不如第1 次測驗理想，且符合了性別的刻板印象。這使得史提爾提出實驗二，希望找出導致第2\
    \ 次測驗結果的可能原因。\n實驗二\n   實驗者找來數理能力相當的一群大學生，分為「男生組」、「女生組」，採取與「實驗一」難度相近的題目，並製造不同的情境，進行2\
    \ 次測驗。進行1 次測驗時，受試者被告知：「根據過去的經驗，男、女性取得的成績並無不同。」進行第2 次實驗前，受試者則被告知：「根據過去測驗的結果，男、女性取得的成績不一樣。」實驗結果如右圖。\n\
    \  實驗二第2 次測驗的結果印證了史提爾對於「刻板印象威脅」的設想。根據事後詢問，受試者均同意聽到「男、女性取得的成績不一樣」的時候，會想起「女性的數理表現比男生差」的刻板印象，而有「男性取得的成績比較好」的解讀，進一步擔心自己的表現可能會印證了這樣的刻板印象。史提爾藉此提出解釋，女性在如此情境中所感受到的焦慮，有可能便是其表現受到干擾的主因。\n\
    \    不同性別在數理領域的表現，可能會因刻板印象威脅而擴大，於長期下來造成女性缺乏自信心與成就感，進而抗拒數學、物理學等相關領域。然而根據實驗二第1 次測驗的結果，史提爾指出，若我們能使受試者意識到「數理表現並不會受到性別的影響」，或許可以解除刻板印象威脅的作用，使女性能與程度相等的男性，達成與之相等的數理表現。\
    \                                                                            \
    \ 閱讀理解季刊34 期"
