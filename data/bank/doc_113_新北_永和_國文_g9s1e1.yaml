  group_stem: '【甲】2020 年適逢臺灣毛豆外銷50 周年。有「臺灣綠金」之稱的毛豆，①在日本的市占率相當高。這個產業曾因中國大陸進入市場而大幅衰退─
    ②從1991 年狂銷日本4.4 萬公噸，到2007 年只剩2 萬公噸。最終在智慧科技協助下，③2019 年外銷世界超過3.8 萬公噸，④出口值超過8400
    萬美元。這個轉折的幕後推手，是高雄農改場旗南分場長周國隆。他認為「全面機械化才有競爭優勢，但要機械化，就要大面積種植」。周國隆於是在2001 年向農委會提出計畫，租用臺糖荒廢的甘蔗田經營大農場，並說服「豆販仔」（中盤商）轉型為專業農民，由他們和加工業者共同出資租地、買機具，建立夥伴關係。他又研發新品種，「高雄9
    號」即為代表作。「高雄9 號」每公頃產量可達8 公噸，高於以往「高雄5 號」的每公頃6 公噸，且抗病性更好，奠定產業起死回生的基礎。

    曾獲神農獎的百賢農產董事長侯兆百，也熬過毛豆產業低谷，積極朝精準農業發展。例如:採收機有AI 設備，能透過GPS 定位與自動拍照掌握產量與品質；土壤感測器可了解毛豆田不同區塊的溫濕度、導電度，提供施肥資訊；經雷射整平機器整地，作物才不會在灌溉時「前面淹死，後面渴死」。臺灣要發展智慧農業，關鍵是整合科技和農業，找到標準化及智慧化的切入點。（改寫自郭芝榕〈智慧新農業讓綠金產業逆轉勝〉）

    【乙】'
