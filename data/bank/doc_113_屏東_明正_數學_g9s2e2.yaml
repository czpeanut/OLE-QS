    content: 投擲一枚公正的骰子，每六次一定有一次是出現一點
  - label: B
    content: 若連續投擲一枚公正的硬幣 30 次均出現正面，則可知出現反面的機率是 0
  - label: C
    content: 某日天氣預測下雨的機率為 25％，表示該日必有 6 小時會下雨
  - label: D
    content: 投擲一枚公正的硬幣 10 次，有可能出現 10 次反面
