    \ take very seriously because it is very important not only for us people but\
    \ also for our planet.  \nFirst, I must tell you that before I found out some\
    \ facts about this special day, I drove my car everywhere.  Sadly, I even drove\
    \ to places \nthat were less than five minutes away on foot.  I now know that\
    \ was bad of me.  However, all that has changed.  On Car Free Day and \nall the\
    \ other days of the year, I ride my bike to the places I need to go.  At first,\
    \ it was very difficult for me to get to places that were far \naway from my house\
    \ because I was out of shape and got tired really easily.  Then, over time, I\
    \ got stronger and could travel to spots that \nwere miles away.  Now, there isn’t\
    \ a day that I don’t take my bike out somewhere nice in nature. \nBiking has truly\
