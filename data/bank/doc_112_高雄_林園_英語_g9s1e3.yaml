  group_stem: "3. Do you get tired easily?  Maybe the way you live has something to\
    \ do with that.  Check the following list of habits to see if they are \nthe reasons\
    \ for the problem and if you have any of them. \n1. Everything has to be perfect,\
    \ and you feel unhappy when it is not.  You work really hard to reach this goal,\
    \ but sometimes it is not \nwhat you are able to do.  In the end, the only thing\
    \ you get is wasted time. \n2. Fast food is a big part of your everyday life.\
    \  It is convenient to have fast food, but it is not healthy, and it makes your\
    \ blood sugar \nhigher.  To bring that back down to a safe level, you need to\
    \ change your eating habits, for example, get more fresh fruit and vegetables.\
    \ \n3. Your desk is always in a mess.  Get things in order by cleaning up your\
    \ desk, making it neat, and putting things that you don’t need \nin the drawers.\
    \  Before leaving the office, get everything ready for the next morning. \n4.\
    \ You always go to bed late on weekends.  If you stay up late on Saturday night\
    \ and sleep late on Sunday morning, you will have \nproblems getting to sleep\
    \ on Sunday night.  What you need to do is to get up at the same hour and take\
    \ a short break in the afternoon. \n5. You don’t exercise when you have free time.\
    \  You need to get 30 minutes of exercise a day, five days a week.  That will\
    \ help you \ngrow stronger. \n    How many of the bad habits above do you have?\
    \  If you have them all, you really need to change the way you live. \n cause\
    \ 造成   in a mess 一團亂  neat 整潔的；有序的"
