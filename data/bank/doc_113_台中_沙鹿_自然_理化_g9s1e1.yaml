  - label: B
    content: 湧泉較可能出現在山脈地勢較低窪的區域，沙鹿又有豐沛的湧泉地下水，可以推論大肚山的礫石層為良好的透水層
  - label: C
    content: 由於地下水抽取後便無法自然補充，因此未來附近建案完工後，即便停止抽取地下水，當地湧泉也無法恢復
  - label: D
    content: 如果在沙鹿有湧泉的地區開挖井水，可以預期井水面與地面的差距較大，要挖得更深才有機會取得地下水
