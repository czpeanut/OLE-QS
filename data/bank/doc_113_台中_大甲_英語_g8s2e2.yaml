- id: doc_113_台中_大甲_英語_g8s2e2_s3_28
  section: 3
  number: 28
  type: single
  page: 3
  stem: When people see something “<u>appetizing</u>,” what will they do?
  options:
  - label: A
    content: They will look at it.
  - label: B
    content: They will feel hotter.
  - label: C
    content: They will pass by that.
  - label: D
    content: They will go for a bite.
  group_stem: '(三)

    Do you know colors can affect people’s appetites? According to some studies, red,
    yellow, and orange may make people feel hungry. That is why many fast food restaurants
    use these colors in their store signs. Green is often used in store signs, too.
    When people see it, they think of healthy food. On the other hand, black doesn’t
    look so appetizing. That’s why you don’t see many restaurants use this color in
    their store signs. White makes people think of something clean, but it also feels
    plain. So when restaurants use it in their store signs, they should use it with
    care.


    What about the color blue? Does it make people feel hungry? The answer is no.
    Some people think it is because there is not a lot of food in this color. When
    people see it, their brains are turned off from it. However, when people are thirsty
    on hot days, which drinks look more eye-catching, the brown ones or the blue ones?
    Many people may go for the blue ones because the color makes people think of cool
    water. In a word, it is important for a person to know the magic of colors when
    he or she wants to open a restaurant.


     affect 影響 appetite 胃口 according to 根據 plain 平淡的 brain 大腦 eye-catching 吸引人的'
