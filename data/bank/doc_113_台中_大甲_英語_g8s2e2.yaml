- id: doc_113_台中_大甲_英語_g8s2e2_s3_27
  section: 3
  number: 27
  type: single
  page: 3
  stem: Which one is one of “seconds”?
  options:
  - label: A
    content: The strawberry looks strange but tastes good.
  - label: B
    content: The banana is the most special in the world.
  - label: C
    content: The apple tastes sweet and like peaches.
  - label: D
    content: The orange smells bad and looks terrible.
  group_stem: '(二)

    The food waste problem is becoming more and more serious. People in the USA, for
    example, throw out over 67 billion kilograms of good food each year. Here in Taiwan,
    it is around four billion kilograms. As a teenager, I have three suggestions for
    fixing this problem. First, don’t buy too much food at one time, and don’t make
    more food than you need. Make a shopping list before you shop, and plan your meals
    before you start cooking. This way, you can also save money. Second, store food
    properly, so it won’t go bad before its best-before date. For example, after you
    buy milk, you should put it in the fridge as soon as you get home. Third, you
    can buy “seconds” and save them from the trash can. They don’t look beautiful,
    but they are cheaper and still taste good. In short, cutting food waste is really
    important. It can save us money and help the world.


