- id: doc_113_台中_大業_英語_g7s1e2_s4_56
  section: 4
  number: 56
  type: single
  page: 6
  stem: ( ）56. How fast can F1 cars go?
  options:
  - label: A
    content: 100 kilometers an hour.
  - label: B
    content: 200 kilometers an hour.
  - label: C
    content: over 300 kilometers an hour.
  - label: D
    content: 90 kilometers an hour.
  group_stem: '(Part C) 56~59

    Sam: Car racing is so exciting! There are different types, like Formula 1 and
    NASCAR.

    Sara: What’s Formula 1?

    Sam: It’s where race cars go really fast, over 300 kilometers an hour, and they
    usually go on city streets that get closed off for the race.

    Sara: That sounds dangerous but good! How long do they race?

    Sam: Usually about 90 minutes. The drivers are the best in the world.

    Greg: NASCAR is also good. I’m excited to go to a race this weekend!

    James: Everyone knows NASCAR in the USA. The cars race on tracks, going around
    200 miles an hour.

    Greg: How long are the races?

    James: It depends. Some are 150 miles, others are up to 600 miles! It’s a dangerous
    sport because cars crash sometimes, too!

    Greg: Yes. It often happens when cars try to pass one another.

    James: Everyone wants to be first and win!

    Greg: Of course!

    James: Car racing is dangerous but exciting. I can’t wait to watch the race!

     know 知道'
