- id: doc_112_高雄_林園_國文_g7s2e2_s5_8
  section: 5
  number: 8
  type: single
  page: 5
  stem: '「青蔥乍下鍋時帶著刺激意味的茲啦一聲，以及頃刻後彌漫整個廚房、微帶焦味的蔥香」。關於這段文句，下列何者

    說明有誤？'
  options:
  - label: A
    content: 寫起油鍋爆香蔥段的場景
  - label: B
    content: 佐證正月是食蔥的好時節
  - label: C
    content: 為作者烹調蔥的生活經驗
  - label: D
    content: 運用了聽覺、嗅覺的摹寫。
  group_stem: "(六) 〈食蔥有時〉 韓良憶 \n  農曆正月倏忽將至，大啖青蔥的好時節又來了。 \n    老一輩臺灣人有句琅琅上口 的農諺，「正月蔥，二月韭，三月莧……」一路數到十二月的大白菜，闡述出先人的智慧：萬物有定時，食亦應合時。正月收成的蔥栽種於農曆十月，成長期間逢冬，氣溫較低，因而蔥白特長，最是美味。\
    \ \n    記得母親在世而我尚未出國時，有一年跟她上菜市場辦年貨，攤上大捆大捆的青蔥，蔥白修長挺直，蔥葉碧綠柔嫩，看得我目不轉睛，擠過去買了一大把，頇兩手才合握得住。媽媽說：「怎麼買這麼多？蔥不經擺，會枯掉。」\
    \ \n    「燒幾條蔥烤鯽頄，半把就用掉了。再炒個蔥爆牛肉或京醬肉絲，又是小半把。剩下來當調味料，不必等過年，兩天就吃光了。」 \n    「妳就是愛吃蔥。記得妳上小學以前偏食，簡直什麼都不吃，就愛從菜裡挑出蔥段來吃，還專舀漂在湯上的蔥花。」\
    \ \n    媽媽不知怎的，想起了我這個當事人幾乎快遺忘的遠年往事。天底下為人母者多半是這樣吧，她們深知每一個子女的習慣、嗜好與不同的個性，更把有關兒女的一些瑣細小事都記得牢牢的。\
    \ \n    在那天以前，我並未覺察自己有此偏嗜—雖然直到現在我仍保有吃菜先挑蔥段、喝湯先舀蔥花的習慣。燒中國菜時加蔥，於我始終是那麼自然而然的事。我總愛在燒菜前，先起油鍋放蔥段爆香，青蔥乍下鍋時帶著刺激意味的茲啦一聲，以及頃刻後彌漫整個廚房、微帶焦味的蔥香，往往叫我還沒做好一道菜，便已飢腸轆轆。\
    \ \n    喜以青蔥添味增香者何止我一人而已，蔥早已是烹調中國菜不可或缺的基本調味料。只不過它多半居於陪襯地位，充其量是舞臺上的小配角，在戲將落幕、菜臨上桌時方上陣，以蔥花或蔥絲的姿態驚鴻一瞥。然而你可別小覷這看似微不足道的青蔥，沒有它來畫龍點睛，紅燒牛肉麵、皮蛋豆腐和清蒸頄等多到不及細數的菜色，好像就失去該有的滋味。\
    \ \n    臺灣市面上常見的青蔥有北蔥和日蔥兩種。前者蔥白較短，質地稍粗，用來爆香還不錯，切成蔥花灑在熱湯或菜肴上亦佳，但較不宜切大段生食，有點辛辣。日蔥蔥白較長，質嫩且味較甜，身價自然也較高，宜蘭\
    \ 三星蔥即是日蔥的一種，用來爆炒固然好吃，即使佐烤鴨或捲大餅生食也並不很嗆。 \n    可惜我旅居的荷蘭只買得到北蔥，價錢貴不說，蔥白還特短，偶爾看到有蔥白長逾五吋的青蔥，簡直如獲至寶，趕緊買上三、四束。一束切除部分蔥葉，整根塗以橄欖油，炙烤到軟後，澆上更多的橄欖油、一點白酒醋，灑鹽和胡椒醃漬起來，冷透且入味後便是帶有義式風味的開胃小菜。其餘的蔥只留極少的蔥綠，切斜段，和以醬油、糖與酒醃過的牛肉片一同爆炒，佐以墨西哥烙餅，再來碗灑了蔥花的蝦皮蘿蔔湯，就是不中不西卻好吃到夫妻倆幾乎停不了嘴的家常美食。"
  answer:
  - B
  answer_source: answer_key_vlm
