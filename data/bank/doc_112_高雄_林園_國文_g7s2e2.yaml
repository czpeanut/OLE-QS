    \ \n    媽媽不知怎的，想起了我這個當事人幾乎快遺忘的遠年往事。天底下為人母者多半是這樣吧，她們深知每一個子女的習慣、嗜好與不同的個性，更把有關兒女的一些瑣細小事都記得牢牢的。\
