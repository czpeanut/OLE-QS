  group_stem: "(二) 〈酪梨，森林的奶油〉(改寫) 王浩一 \n   酪梨並非臺灣原生種，最早於1902 年引進，種植在臺北植物園，當時並未成功。之後陸續引進試種，直到1922\
    \ 年，從墨西哥引進來的50 株在嘉義農試所成功存活。日人繼續引進其他品種在嘉義栽種，累計有二十餘品種。可惜戰敗後，這些老樹被他們砍伐摧毀，只剩5 株殘活，共三品種。1954\
    \ 年，從美國引進八種品種，也是在嘉義農試所試種，成功了之後又引進不同品種。 \n  酪梨有相當多別稱：幸福果、牛油果、黃油果、鱷果，它是相當營養的水果，能使細胞維持年輕。有些品種成熟後外觀顏色不變，只是變軟，有些外觀會變成紫紅或黑褐。酪梨屬後熟水果，無法在樹上熟成，採收後必頇在常溫下放置，通常需要5-10\
    \ 天熟成。\n  酪梨單元不飽和脂肪酸含量高，能降低血液中壞的膽固醇濃度，還能增加好的膽固醇濃度。值得一提的是，單元不飽和脂肪酸占總油脂的近七成。此外，酪梨糖分低、高能量，適合為糖尿病患攝取；鐵含量高，也是貧血者的好選擇；除了作為特殊病患食物之外，也可為常人控制體重之用，具高營養密度，可預防中風，又可作為抗氧化物、水果蛋白質、纖維的來源；甚至可作為嬰兒食品，好處多多。"
