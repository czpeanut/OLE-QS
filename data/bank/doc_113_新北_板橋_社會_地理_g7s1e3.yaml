  group_stem: "◎請閱讀短文並回答第14-17 題：\n基隆輸了！年均雨量近10 年冠軍出爐\n    中央氣象局近日公布全台累積雨量數據，出乎意料的是第1\
    \ 名並不是基隆，而是新北萬里的大坪測站，以平均年雨量高達6533 毫米奪冠，宜蘭蘇澳則排名第2，為4456 毫米。\n    氣象局在臉書粉專「報天氣-中央氣象局」公布2011\
    \ 年至2020 年雨量數據，在基隆、大坪、蘇澳、阿里山、尾寮山這5 個具有指標性的測站中，以大坪的年平均雨量6533 毫米最多，其次為宜蘭蘇澳4456 毫米、屏東尾寮山3898\
    \ 毫米、嘉義阿里山3871 毫米，基隆年雨量則為3565 毫米，和第1 名相比整整少了將近3000 毫米。\n    氣象局說明，每年秋季至隔年春天（9-4\
    \ 月），長達半年以上的時間常有東北季風源源不斷將水氣吹進迎風面的新北、宜蘭、基隆等地，容易持續降雨；其中新北大坪因為山坡地的地形舉升，海上來的水氣會被抬升，更容易成雲化雨，所以前有大海、後有陽明山、位在半山腰處的大坪雨勢更為明顯，就擊敗位在平地的蘇澳與基隆。\n\
    \    氣象局補充，相較於「持續型」的東北季風迎風面降雨，中南部山區屬於「衝刺型」，雨勢相對集中，當颱風或西南氣流影響時，常在短短幾天內出現極大的雨量，其他時間除了午後雷陣雨外，就很少下雨，所以平均起來，還是東北季風迎風面略勝一籌。\n\
    \                                                     節錄自網址：https://tw.news.yahoo.com/-035515316.html"
