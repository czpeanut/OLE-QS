- id: doc_112_彰化_福興_英語_g9s1e3_s8_11
  section: 8
  number: 11
  type: single
  page: 4
  stem: Which of these people is most likely a quiet quitter?
  options:
  - label: A
    content: John, who became angry and quit his job when his boss said he lied
  - label: B
    content: Ray, who works hard and stays late in the office every night
  - label: C
    content: Ann, who leaves work as soon as possible and does only what she has to
      do
  - label: D
    content: Joe, the new daddy, needs to take care of his newborn baby
  group_stem: '(2)

    The term “quiet quitting” became common in offices in the early 2020s. It does
    not mean actually quitting one’s job; rather, it means only doing the necessary
    parts of one’s job. Quiet quitters put in no more time or effort than is needed
    to complete their daily duties, and they say no to any extra work. They don’t
    come in early, stay late, or answer work emails at home.


    It is said that quiet quitting started during the Covid-19 pandemic. Many workers
    realized that, compared to matters of life and death, what they did at work was
    not very important. They felt that their managers did not care about them and
    that they were not paid enough for their efforts. Also, they believed they were
    not getting the chance to learn new things or develop their skills.


    Quiet quitting is a problem for managers, who need to take steps to make their
    workers happier in their jobs. One way is to talk to the workers in person to
    find out what they want and need. During this talk, managers can make it clear
    what the workers will get if they do take on extra work.

     complete 完成 duty 責任 pandemic (疾病)大規模流行 realize 理解 compare 比較 manager 主管'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
