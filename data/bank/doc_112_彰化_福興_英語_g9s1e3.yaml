  stem: Which of the following is true about Jimmy's balloon?
  options:
  - label: A
    content: It has a big smile on it when dancing in the wind.
  - label: B
    content: The shape of it looks like a small dot.
  - label: C
    content: It’s a gift from his brother.
  - label: D
    content: It flies away from his hand.
  group_stem: '(3)

    With a big smile on his face,

    Jimmy holds a red balloon in his hand.

    He walks proudly,

    All his mind on the balloon,

    Which is dancing in the wind.


    When Jimmy comes to the river bank,

    The wind is blowing harder.

    It is a good day to fly a kite.

    Some kites are flying high up

    In the blue sky,

    And they look like small birds flying up against the wind.


    In the strong wind,

    Jimmy''s balloon is dancing more crazily.

    And he is having a hard time holding it.

    Jimmy''s fingers are hurting,

    And he is afraid that he might lose the balloon,

    A gift he wants to give his little brother,

    Who is sick and weak.


    Then another heavy wind rises,

    And it blows Jimmy''s balloon away

    From his hurting hand.

    The balloon goes up and up,

    And becomes a dot in the sky.


    Jimmy looks up at the sky

    Until the balloon is gone.

    He then lowers his head

    And goes home with a heavy heart.

     against 逆著'
