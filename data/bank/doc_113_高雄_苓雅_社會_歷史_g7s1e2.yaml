  section: 1
  number: 32
  type: single
  page: 1
  stem: 關於甲時代對於原住民族的分類，下列何者正確？
  options:
  - label: A
    content: 將原住民族分為高砂族與平埔族
  - label: B
    content: 以是否納稅作為標準之一，劃分生番與熟番
  - label: C
    content: 平埔番即是熟番，高山番即是生番
  - label: D
    content: 平埔族因漢化而沒有被視為原住民。
  group_stem: '以下為三個不同的時期，臺灣統治者對於原住民族教育的政策。請閱讀後回答32-34 題。

    (甲)我們為「高砂族人」設立了學校，在他們接受完基礎教育後，選拔頭腦清楚、身體健全、性情溫和的人繼續栽培，如此一來，他們便能成為我們往後開發山地的助力。

    (乙) 由於「山胞」的知識貧乏，對受教育不感興趣，但若不對山地文化進行改造，他們會停留在茹毛飲血的原始生活狀態，我們應對落後地區進行教育，廣設山地的國民學校。

    (丙)為了招撫這些凶狠又野蠻的「生番」，我們要他們各部落各送幾位「番童」來學我們的語言文字及禮儀，讓他們知書達禮，不再那麼野蠻。'
