  page: 4
  stem: 關於珍珠奶茶，下列敘述何者正確？
  options:
  - label: A
    content: 珍珠為溶質，奶茶為溶劑，珍珠奶茶為溶液
  - label: B
    content: 因為鮮奶與紅茶1：1，有固定的比例組成，所以奶茶為純物質
  - label: C
    content: 珍珠奶茶是混合物，但若去除珍珠只剩奶茶，因為是均勻溶液所以是純物質
  - label: D
    content: 珍珠奶茶的原料，珍珠、鮮奶、紅茶、二砂糖全部都是混合物
