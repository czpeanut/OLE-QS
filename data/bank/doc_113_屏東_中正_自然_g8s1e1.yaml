- id: doc_113_屏東_中正_自然_g8s1e1_s2_43
  section: 2
  number: 43
  type: single
  page: 4
  stem: 若要以此裝置製造收集氧氣，下列敘述何者正確？
  options:
  - label: A
    content: 甲裝置的底部應高於水面，避免壓力過大使液體由甲往上衝出
  - label: B
    content: 若要製造氧氣，乙瓶中應放入二氧化錳作為催化劑，若沒有二氧化錳，雙氧水就無法反應產生氧氣了
  - label: C
    content: 剛開始的氣體不收集，是因為裡面含有原本存在於乙瓶與橡皮管中的空氣
  - label: D
    content: 丙瓶須收集氣體至水面完全降至瓶口，也就是瓶中完全無水才行
