  section: 2
  number: 44
  type: single
  page: 4
  stem: 關於以此裝置製造收集二氧化碳以及二氧化碳的相關知識，何者正確？
  options:
  - label: A
    content: 二氧化碳其實易溶於水，以此方法收集會有大量損耗
  - label: B
    content: 若要製造二氧化碳，乙瓶中應放入大理石，若沒有放大理石僅有稀鹽酸，就無法反應產生二氧化碳了
  - label: C
    content: 要檢驗收集完的二氧化碳可使用石灰水，因為石灰水與二氧化碳反應會產生白色強光
  - label: D
    content: 乾冰常用來製造舞台效果，白色煙霧就是乾冰昇華產生的二氧化碳
