  group_stem: '(二) (第34-35 題)

    Many people know Thanksgiving is a special day in the USA. It’s on the fourth
    Thursday of November. It’s a day for family to get together and show their thanks
    for everything. And for some people, the day after Thanksgiving is another special
    day, too. It’s the start of the big shopping season of the year. Many stores have
    big sales on that day. People call it Black Friday. Do you know why people call
    it “black”? It doesn’t mean something bad. That was because many years ago, stores
    wrote their losses in red and profits in black. So when stores wanted to change
    their businesses from red to black, they usually had big sales and wanted to make
    great profits from them.

    Now Black Friday becomes a very special day for shoppers. Many people line up
    or even camp outside the stores just to wait for the opening of Black Friday.
    However, there are also many people shopping on the Net. The Internet stores also
    want to join this shopping activity. So they have big sales on the next Monday.
    That’s how another special shopping day, Cyber Monday, comes from.

     Thanksgiving 感恩節   shopping/shopper 購物/購物者   store 商店   sale 特賣;拍賣   loss 損失

