  group_stem: 'Do you play badminton? Are you a fan of badminton? If so, you must
    know Tai Tzu Ying. She is a badminton player. In fact, she is one of the top players
    in the world.


    Tai Tzu Ying comes from Kaohsiung, Taiwan. Her father likes to play badminton.
    Because of it, Tai Tzu Ying loves this sport, too. She started to practice badminton
    when she was nine. She joined many games and got good rankings. She reached World
    No. 1 for the first time in 2016. Many people love her. Tai Tzu Ying is really
    the glory of Taiwan.


    《Tai Tzu Ying’s Meet-and-Greet》

    Time: May 6th, 10:00~12:00

    Place: Taipei City Jhong Jheng Sports Center

    ** Listen to Tai Tzu Ying share her stories.

    ** Take photos with Tai Tzu Ying.


    ~改編自康軒超英豪

    badminton 羽毛球

    if 如果

    because of 因為

    ranking 排名

    reach 達到

    glory 光榮'
