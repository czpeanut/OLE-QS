    王老師將部分過程擦掉後，如下圖所示。

    請根據相關資訊回答下列問題，完整寫出你的解題過程並詳細解釋：

    (1) 請問 ” ◎”應該填入什麼數字？

    (2) 經過思考阿奎亞計算出原題目的被除式為 $3x^{2}-5x+5$ ，請問他算的是正確的嗎？

    若正確，請說明原因；如果不正確，請幫他計算出原題目正確的被除式為何。(此多項式請以降冪排列)'
