- id: doc_113_台北_誠正_數學_g8s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: '單純看小愛寫出來的算式：

    $( 4x^{2}+3x-1) \div A=( 2x+1)\dots 3$，你可以發現什麼？'
  options:
  - label: A
    content: $A= ( 4x^{2}+3x-1)\div( 2x+1)-3$
  - label: B
    content: $A=( 2x+1)( 4x^{2}+3x-1)+3$
  - label: C
    content: $A= ( 4x^{2}+3x-1-3) \div( 2x+1)$
  - label: D
    content: 以上皆非
  group_stem: '題組：

    請閱讀下列敘述後，回答11～12 題

    小愛在數學考卷上看到一個題目：

    「假設$A$ 為$x$ 的多項式，且$\frac{4x^{2}+3x-1}{A}=2x+1-\frac{3}{A}$，請問$A$為下列何者？」

    小愛想試著找出$A$，她發現$\frac{4x^{2}+3x-1}{A}$可以想成$( 4x^{2}+3x-1) \div A$，所以她寫出了一個算式$(
    4x^{2}+3x-1) \div A=( 2x+1)\dots 3$。

    老師看了小愛寫的算式後，請另一位同學阿奎亞也把這題寫一遍…'
  tags:
    chapter:
      publisher: 翰林
