- id: doc_113_台中_沙鹿_國文_g9s1e2_s5_1
  section: 5
  number: 1
  type: single
  page: 2
  stem: 〈春夜宴從弟桃花園序〉一文，以駢文的形式寫成，以下對駢文的敘述何者錯誤？
  options:
  - label: A
    content: 駢文屬於韻文的一類
  - label: B
    content: 每句的字數以四字和六字為主，而且字數相等的兩個句子為一組，彼此相對，極為工整勻稱
  - label: C
    content: 在詞語上講究華麗的色彩，常採用顏色、金玉、靈禽、香花、異草、奇獸等詞語來描寫
  - label: D
    content: 駢文在音韻方面的要求相當嚴格，講究兩句之間的平仄相對，常用典使文章含蓄、典雅，增加文章的美感。
  group_stem: '夫天地者，萬物之逆旅①；光陰者，百代之過客。而浮生若夢，為歡幾何？古人秉燭夜遊，良有以也。況陽春召我以煙景，大塊②假我以文章。會桃李之芳園，序天倫之樂事。群季俊秀，皆為惠連③；吾人詠歌，獨慚康樂④。幽賞未已，高談轉清。開瓊筵以坐花，飛羽觴⑤而醉月。不有佳作，何伸雅懷？如詩不成，罰依金谷酒數⑥。

    ——李白〈春夜宴從弟桃花園序〉

    📖 ①逆旅：旅館。 ②大塊：大自然。

    ③惠連：指謝惠連，與族兄謝靈運同以詩著稱。

    ④康樂：指謝靈運。南朝 宋文學家。

    ⑤羽觴：有雙耳的酒杯。

    ⑥金谷酒數：晉代石崇於金谷園宴請賓客，賦詩不成者則罰酒三杯。'
