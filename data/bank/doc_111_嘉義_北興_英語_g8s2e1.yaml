  group_stem: 'Do you still like the color on your car? A new technology from BMW
    will let you change it at on touch of a button. BMW brought in the new type of
    car at a technology show in January, 2022. It is the world''s first color-changing
    car, called the BMW iX Flow. However, the trick has nothing to do with the paint
    at all, but with the E Ink technology.

    BMW worked with a team from Taiwan, and they used the E Ink technology for the
    car. To allow the car to change colors, they covered it with a special kind of
    thick paper. The cover had a differently charged white and black pigments. When
    we put on the electric charge through the cover, the color pigments will rise
    and come down to change the color of the car. Right now, the car can only change
    colors to white, gray, or black.

    BMW says the color-changing cars can make them more relaxed. On hot days, white
    cars will stay cooler than black ones because they reflect more sunlight. In the
    same way, black colors help the car get more sunlight and more heat. Unluckily,
    BMW isn''t planning on bringing the car to market because the cost of making it
    is too high. But maybe we can see it on the market one day.


