- id: doc_113_台中_居仁_社會_地理_g7s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '關於經緯線的比較，下列何者正確？


    | 項目 | 經線 | 緯線 |

    | :--- | :--- | :--- |

    | (A)定義 | 赤道及與赤道平行的圓圈線 | 連結南、北極點的弧線 |

    | (B)方向 | 東西向 | 南北向 |

    | (C)長度 | 等長 | 赤道最長，往兩極縮短 |

    | (D)度數 | 南北半球各有 $0\sim 90$ 度 | 東西半球各有 $0\sim 180$ 度 |'
  options:
  - label: A
    content: 定義：經線為赤道及與赤道平行的圓圈線；緯線為連結南、北極點的弧線
  - label: B
    content: 方向：經線為東西向；緯線為南北向
  - label: C
    content: 長度：經線等長；緯線赤道最長，往兩極縮短
  - label: D
    content: 度數：經線為南北半球各有 $0\sim 90$ 度；緯線為東西半球各有 $0\sim 180$ 度
