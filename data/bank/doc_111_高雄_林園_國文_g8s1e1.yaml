- id: doc_111_高雄_林園_國文_g8s1e1_s4_9
  section: 4
  number: 9
  type: single
  page: 4
  stem: 關於愛玉，下列敘述何者錯誤？
  options:
  - label: A
    content: 臺灣特有草本植物
  - label: B
    content: 產量以嘉義縣居冠
  - label: C
    content: 口感軟嫩清涼
  - label: D
    content: 市面上贗品居多。
  group_stem: '(五)

    愛玉是一種臺灣特有藤本植物，生長時會慢慢往上攀爬，樹夠高大給它纏爬時，照顧得好可以存活幾十年以上。

    嘉義縣愛玉產量全國居冠，有「愛玉王國」美譽，其次為南投縣，高雄市、新竹縣、屏東縣、臺東縣等也有栽植。即使如此，市面上依然「贗品」不少，因為手工搓洗究竟費工費時，有人便開發出以一種大量的水，添加果凍粉做成的人造愛玉。銷量不少的傳統市場裡，超過半數是假貨，婆婆媽媽無法分辨，原以為買回家的愛玉可以降三高、助排便、降火氣，結果買回的是一堆水。

    好吃的愛玉凍單價不高，但值得你費心找出你家附近的放心好店。盛夏中的臺灣愛玉，從軟嫩清涼中，如蟬聲正在幻化出更多的可能，而我童年的愛玉的洗漿記憶，也將伴我消暑。

    （改寫自王浩一 在阿里山山上愛玉子賽黃金）'
  answer:
  - A
  answer_source: answer_key_vlm
  tags:
    textbook: 八上 第三課 下雨天，真好
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
