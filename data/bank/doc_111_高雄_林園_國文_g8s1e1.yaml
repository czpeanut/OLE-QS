  stem: 〈庭中有奇樹〉：「馨香盈懷袖，路遠莫致之。」關於這段詵句的含義，下列說明何者正確？
  options:
  - label: A
    content: 奇樹之花高不可攀，難以親近，只能在遠處欣賞
  - label: B
    content: 相聚的時光短暫，只能在離別前折花相贈，期盼下次的重逢
  - label: C
    content: 奇樹之花香氣滿溢，卻因相隔遙遠無法送達，徒留滿懷無奈
  - label: D
    content: 滿懷的思念如同奇花的馨香，能跨越距離鴻溝，無所不至。
  lesson_raw:
    title: 庭中有奇樹
    basis: 引用〈庭中有奇樹〉課文文句
  answer:
  - C
  answer_source: answer_key_vlm
