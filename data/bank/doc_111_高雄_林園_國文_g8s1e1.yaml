- id: doc_111_高雄_林園_國文_g8s1e1_s3_25
  section: 3
  number: 25
  type: single
  page: 3
  stem: '最早的風箏相傳出現在春秋 戰國時代，魯班用竹木做了一隻「竹鵲」，能夠在天空飛行三天。而後，墨子研究三年，用木材製作了「木鳶」，則可以在空中短暫飛行一天。到了東漢時期，隨著紙張的發明改變了風箏的材質，人們開始把紙糊在竹骨上，做成鳶鳥的形狀，再引線乘風而飛升，因此風箏又名「紙鳶」。直至五代時，有人把竹笛綁在鳶首，風吹會發出像古箏的聲響，這就是「風箏」、「鷂琴」的名稱由來。


    根據上文，關於風箏的名稱與由來，下列說明何者正確？'
  options:
  - label: A
    content: 「風箏」之稱是因為迎風時會發出如彈奏古箏的聲音
  - label: B
    content: 由「鷂琴」的名稱可知風箏最早的樣子如同鷂鷹造型的古琴
  - label: C
    content: 稱為「紙鳶」是因為風箏發出的聲音和鳶鳥的叫聲一樣
  - label: D
    content: 稱為「木鳶」是因為風箏能夠飛到與樹木一樣的高度。
  answer:
  - A
  answer_source: answer_key_vlm
