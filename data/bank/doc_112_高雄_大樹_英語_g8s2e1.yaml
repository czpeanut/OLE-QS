- id: doc_112_高雄_大樹_英語_g8s2e1_s3_1
  section: 3
  number: 1
  type: single
  page: 2
  stem: What is the writer’s main purpose?
  options:
  - label: A
    content: To ask more people to learn CPR.
  - label: B
    content: To teach people about cardiac arrest.
  - label: C
    content: To ask people to give more CPR classes.
  - label: D
    content: To talk about the death rate from cardiac arrest.
  group_stem: 'CPR

    Before we talk about CPR, we need to learn about “cardiac arrest.” When people
    experience cardiac arrest, their hearts stop. After that, their brain cells start
    to die. To save theirs lives, giving CPR is the first thing to do.

    However, not many people can do CPR. This causes a high death rate from cardiac
    arrest. In the USA, about 320,000 people die from cardiac arrest out of the hospital
    each year, and 70% of them happen at home. Cardiac arrest can happen to people
    around us at any time. When we put all the facts together, it is easy to see one
    thing : Everyone needs to learn to do CPR, even children.

    We don’t need to be an expert to give CPR, but we do need some education. It is
    easy to find CPR classes at schools, in hospitals, or even at fire stations, so
    signing up for one is not difficult at all. When we see people experiencing cardiac
    arrest, it’s everyone’s job to help them. Their lives are in our hands.

    * cardiac arrest 心臟驟停 heart 心臟 brian cells 腦細胞 death rate 死亡率 die 死亡 case 案例'
