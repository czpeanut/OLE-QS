- id: doc_112_高雄_大樹_英語_g8s2e1_s3_6
  section: 3
  number: 6
  type: single
  page: 3
  stem: How many cows with fake eyes painted on their butts were killed(被殺) by lions
    in Jordan’s four-year-study?
  options:
  - label: A
    content: '0.'
  - label: B
    content: '14.'
  - label: C
    content: '683.'
  - label: D
    content: More than 2,000.
  group_stem: 'Fake Eyes Protect Cows

    Imagine that you are a farmer and keep hundreds of cows. However, large predators
    like lions come and eat your cows. What will you do to solve this problem? Many
    people would hunt those lions. This is what farmers in the Okavango Delta in Botswana
    used to do. They shot the lions with guns, but the problem did not go away. Fow
    many years, cows died because of lions, and lions died because of people. The
    number of lions in Africa has dropped from more than 100,000 in the 1900s to lower
    than 30,000 in 2020.

    Luckily, an Australian biologist named Neil Jordan from the University of New
    South Wales came up with a smart idea to save both cows and lions. It is to paint
    eyes on cows butts. In his four-year-study, he followed over 2,000 cows at 14
    different farms in the Okavango area. There were 683 with eye-painted butts, but
    543 with “ X” painted on their butts,and 835 unpainted. The study showed that
    no cows from the butt-painted group were killed by lions. Jordan was not surprised.
    He knew before this study that lions usually give up their hunt if they think
    they’ve been spotted.

    Now, farmers in Botswana may not need to shoot lions ever again. Sometimes the
    best way to solve a problem is not to “kill” it but to understand it and “live”
    with it peacefully.

    * fake 假的 predator 肉食性動物 solve 解決 shot 射殺( shoot 的 過去式) gun 槍 biologist 生物學家 paint
    著色 butt 屁股 spot 認出；發現 were killed 被殺害 peacefully 和平地 Okavango Delt 歐卡萬哥三角洲 Botswana
    波扎那 Australian 澳洲的'
