  page: 3
  stem: Which is NOT an example(例子) of Murphy’s Law?
  options:
  - label: A
    content: When you forget your wallet, someone pays for you.
  - label: B
    content: You just finished washing your car, and it starts to rain.
  - label: C
    content: The school bus always comes late when you have a test on that day.
  - label: D
    content: You need to talk to someone right away, but they aren’t answering the
      phone.
  group_stem: 'Murphy’s Law

    Picture it’s breakfast time. You are going to take a bite of nice, warm piece
    of toast. Then you drop it and it falls, you pray for it to land on the side without
    butter on. However it lands butter-side down! This is a perfect example of Murphy’s
    Law.

    Did you notice that it always rains when you least expect it? Or when you stand
    in line at a checkout, why does the line next to yours always seem to move faster?
    And why does your teacher call on you when you don’t know the answer to a question?
    If it is possible for something to wrong, it will go wrong—this is Murphy’s Law.

    The lesson behind Murphy’s Law is to be prepared for the worst. So, if you aren’t
    ready for tomorrow’s test, don’t even think about cheating because you will get
    caught. Study hard.

    * law 定律 pray 祈禱 land 著地 butter 奶油 notice 注意到 expect 期待 seem 似乎是 prepare 預備 get
    caught 被抓到'
