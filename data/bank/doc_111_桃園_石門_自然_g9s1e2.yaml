- id: doc_111_桃園_石門_自然_g9s1e2_s2_22
  section: 2
  number: 22
  type: single
  page: 3
  stem: 在沒有任何阻力的條件下，鉛彈飛行過程中，受到什麼力作用及什麼原因造成不同的飛行路徑？
  options:
  - label: A
    content: 重力作用，初速不同
  - label: B
    content: 離心力作用，加速度不同
  - label: C
    content: 地球磁場作用，初速不同
  - label: D
    content: 重力作用，加速度不同
  group_stem: '請在閱讀下列敘述後，回答22.～24.題

    牛頓大砲（Newton''s cannonball）是物理學家牛頓所假想的圓周運動實驗。他假設在高山頂端有一大砲，在沒有任何阻力的條件下，平行發射出一顆鉛彈，若初速度不夠，鉛彈因為重力的關係會愈飛愈低，直到掉落於地面；如果鉛彈的初速度愈大時，飛行的距離就會愈長；如果初速度夠大，鉛彈能夠繞著地球的軌道飛行做等速率圓周運動。

    當時牛頓用此假設來推測引力的存在，以及引力是行星運動重要的動力來源。如今隨著科技的進步，人們將牛頓當年的推論實現，例如：月球、衛星以固定軌道繞行地球運動。'
  shared_asset: g2_22_24
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 理化
      code: 2-4
      title: 圓周運動與萬有引力
