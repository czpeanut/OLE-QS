  type: single
  page: 3
  stem: 容器是隔熱的，容器中的水無法由外界獲得熱量，那麼使容器內的水溫上升所需的熱量從何而來呢？
  options:
  - label: A
    content: 熱量由溫度計傳導進容器中
  - label: B
    content: 水在容器中產生化學變化
  - label: C
