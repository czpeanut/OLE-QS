  group_stem: '■閱讀下文內容後，請回答第26-27 題：

    「六堆」是指今日高屏一帶的客家族群，在清帝國時為了自保所形成的地方防衛組織。1721 年漳州籍移民朱一貴在岡山起兵叛清，順勢攻打屏東平原的客家村莊，客家人動員各庄組織六支部隊，抵擋朱一貴的部隊。事後，為了避免朝廷誤會，將「隊」改「堆」，稱六堆。

    1787 年，漳州籍的林爽文叛變，六堆擔心閩南移民再度攻打客庄，加上怨恨閩南移民平日的欺壓，於是起兵協助朝廷平亂，藉機報復殺害閩南移民。'
