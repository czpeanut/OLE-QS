  section: 1
  number: 31
  type: single
  page: 2
  stem: 文中日本文學家夏目漱石所描述的城市現象，應與下列何者的關係最密切？
  options:
  - label: A
    content: 科學革命
  - label: B
    content: 工業革命
  - label: C
    content: 啟蒙運動
  - label: D
    content: 海外探險
  group_stem: '＊請根據下文，回答31~33 題：


    日本明治時代文學家夏目漱石曾在日記中寫道：「在□□的街上散步時吐了口痰，當我看到自己吐出一團全黑的物體時真是吃驚。幾百萬市民每天都吸著煤煙和塵埃，汙染著他們的肺。」當時人們以煤作為驅動蒸汽機以及家中暖爐、廚具的燃料，加上西歐地區盛行風的吹拂，使空氣汙染物不斷飄向城市的下風處，形成煙霧瀰漫的景觀。燃煤帶來的空氣汙染會影響健康，可能降低新生兒存活率，使得兒童發育遲緩。城市的居民居住區域分布也反映出貧富差距，資本家與中產階級為了尋求較好的生活品質，紛紛遷往城市中汙染較少的區域，而較為窮困的低技術勞動階級，因受工作地點和經濟考量所限，只能居住於汙染嚴重區域。因此，思想家恩格斯在當時就發出「只有勞動階級才會呼吸受汙染的空氣」的不帄之鳴。'
  answer:
  - B
  answer_source: answer_key_vlm
