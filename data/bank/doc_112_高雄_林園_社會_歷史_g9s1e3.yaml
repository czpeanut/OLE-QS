  section: 1
  number: 28
  type: single
  page: 2
  stem: 「天婦羅」傳入日本的時代背景，最可能是下列何者？
  options:
  - label: A
    content: 科學革命的影響，讓水手具備遠航能力抵達亞洲
  - label: B
    content: 日本受大唐文化的薰染，效法唐朝推動制度改革
  - label: C
    content: 西方各國展開海外探險，建立到達東方的新航線
  - label: D
    content: 工業革命的刺激，使歐洲國家積極發展海上貿易
  group_stem: '＊請根據下文，回答28~30 題：


    日本料理「天婦羅」，是將食材裹上澱粉漿之後下鍋油炸，這種料理源自於天主教徒在齋戒期間，將食材油炸後食用。在沒有冷凍技術的時代，因為油炸食物容易保存，所以水手於遠洋航行時也會準備油炸魚類作為糧食。葡萄牙的天主教徒最初到日本傳教與貿易時，同時傳入這種料理。'
  answer:
  - C
  answer_source: answer_key_vlm
