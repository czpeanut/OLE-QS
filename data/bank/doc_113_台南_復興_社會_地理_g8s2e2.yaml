- id: doc_113_台南_復興_社會_地理_g8s2e2_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 穆斯林每天必須朝向聖城進行五次禮拜，稱為「禮功」，請問此聖城指的是下列哪一個城市？
  options:
  - label: A
    content: 伊斯斯坦堡
  - label: B
    content: 麥加
  - label: C
    content: 耶路撒冷
  - label: D
    content: 杜拜
  group_stem: '伊斯蘭教為世界第二大宗教。穆斯林奉行《古蘭經》教義，日常生活須嚴守「五功」—念功、禮功、齋功、課功、朝功。看似簡單，但要確實遵行，考驗著信徒對宗教的虔誠及毅力。

    「齋」即為齋戒（Ramadan），齋戒月白天不吃不喝、克制私欲。齋戒月在伊斯蘭曆的第九個月，穆斯林期間每日清晨日出起封齋禁食，直至下午日落才能開齋進食，為期
    30 天。而齋戒月結束後的隔天就是"開齋節"，這個節日就像我們的農曆新年般隆重，一般慶典維持三天，幾乎所有穆斯林都會趕回自己的家鄉和家人一起過節。請回答下列
    19~20 題'
