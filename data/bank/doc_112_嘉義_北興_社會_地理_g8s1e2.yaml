- id: doc_112_嘉義_北興_社會_地理_g8s1e2_s1_39
  section: 1
  number: 39
  type: single
  page: 4
  stem: 特斯拉是屬於何種產業類型？
  options:
  - label: A
    content: 第一級產業
  - label: B
    content: 第二級產業
  - label: C
    content: 第三級產業
  - label: D
    content: 第四級產業。
  group_stem: '※特斯拉上海設廠

    特斯拉（Tesla）是美國生產電動汽車的公司，在全球電動車研發、製造占有重要地位。特斯拉2018 年在上海建設首間美國以外的工廠，成為中國第一間外資全資持有的工廠。中國以補貼措施推廣電動車的使用，讓中國電動車使用率在全球名列前茅。近年中國對購買電動車的補貼金額大幅刪減，但中國為了優惠特斯拉，給予消費者每臺2.5
    萬元人民幣的購車補貼，除此之外特斯拉更不必負擔汽車進口稅，有機會於中美貿易戰中獲得利益。

    位於上海的特斯拉汽車，且皆以內銷為主。Model3 電動車的官方售價為每臺33 萬元人民幣，加上補貼，消費者只需30.5 萬元人民幣（約新臺幣129 萬元）就能買到。相較他國新臺幣150
    萬元的起跳售價，在中國購買Model 3 的價格相對較低，售價能如此便宜，除了與政府給予的建廠優惠待遇有關，還與特斯拉的製程大量採用中國供應鏈相關。特斯拉在上海工廠製造的電動車，大量採用勞工成本相對較低的中國供應鏈，從電池連接件、散熱器、線纜到充電樁設備等，都直接採用中國的供應鏈，使用率達30%以上，並預計之後將達成100%全中國供應鏈生產化的目標。'
