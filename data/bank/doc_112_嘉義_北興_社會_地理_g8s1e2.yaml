- id: doc_112_嘉義_北興_社會_地理_g8s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 中美貿易戰與兩國長期且巨大的貿易不平衡有關，由上文敘述中國對美國貿易為何？
  options:
  - label: A
    content: 逆差
  - label: B
    content: 出超
  - label: C
    content: 入超
  - label: D
    content: 平衡。
  group_stem: "※自2018 年時任美國總統川普（Donald Trump）針對「中國經濟侵略」簽署備忘錄，認定「中國偷竊美國智慧財產權和商業秘密」並展開關稅制裁以來，「中美貿易戰」已經持續超過5\
    \ 年，中美貿易戰被挑起的理由有三： \n(一)、中美貿易長期且巨大的不平衡：一些原本在美國生產後，出口到中國的產品，經直接投資就可以直接在中國生產、販售，減少美國對中國的出口；加上部分美國企業到中國投資設廠，生產零件或最終產品，再運回美國市場銷售，因此增加了美國從中國的進口；在加工貿易中，進口原料主要不是來自美國，但卻大量出口到美國，導致美國從中國的進口大幅增加。\
    \ \n(二)、中國強迫美國公司轉移技術：美國之音引述報告稱，中國政府指示企業以直接投資、創投方式收購美國企業和資產，藉此獲取美國尖端技術和智慧財產權，促進戰略性產業的技術轉型。\
    \ \n(三)、中國政府推動「中國製造2025」：中國大陸的製造業一直依賴外國的設備和人員研製，本地代工和仿製為主的型態使得中國的創新能力、品牌品質處於世界低下水準，產業沒有從上到下的自主化體系、或是完整的一條龍生產條件。2016\
    \ 年總理李克強提出《中國製造2025》政策，計劃通過「三步走」實現強國的戰略目標：第一步，2025 年邁入製造強國行列；第二步，2035 年製造業整體達到世界製造強國陣營中等水準；第三步，中共成立一百年時，實力進入世界製造強國。由於中國透過補助與保護背書等方式來補貼製造業的廠商以各種方式控制產業鏈的技術，美方認為這不符合市場做法，2018\
    \ 年美國對中國進口產品加徵25%關稅，而其公告直接指明「中國製造2025」相關的產業。請問："
