  group_stem: '※放緩的中國經濟與躺平的年輕人。

    1978 年中國改革開放，設立多處經濟特區，迎來多年的經濟快速成長。1978 年中國的人均國民所得毛額為200 美元，GDP 占全球1.7%，2021 年人均國民所得毛額達11,880
    美元，GDP 占全球18.4%。

    然而自2010 年代以來，中國經濟逐漸趨緩，更面臨許多挑戰。例如：2018 年的中美貿易戰，提高中國出口的稅率，促使外商將生產線遷移轉向鄰近的東南亞、南亞國家；2020
    年起受新冠肺炎疫情影響，清零政策影響工廠運作，為生產活動帶來不確定性；2022 年烏俄戰爭影響能源供給，導致物價上升，削弱經濟增長的成果。此外，一帶一路成效不明顯、人口紅利消失，也逐漸影響中國經濟的發展。

    對現在中國的年輕人而言，經濟狀況變化的感受更是深刻。雖然薪資仍持續上調，但仍難趕上生活成本上漲的速度。加上經濟發展放緩、工作機會減少，為了避開過度競爭的循環，拒絕加班、不追求買房、不結婚生子的「躺平哲學」成為年輕人們的另類選擇。請問：'
