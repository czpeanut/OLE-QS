  type: single
  page: 5
  stem: 依據上文，下列關於臺灣地牛神話的敘述，何者正確？
  options:
  - label: A
    content: 起源於臺灣漢族傳統的地震神話
  - label: B
    content: 因其他地震神話消失而成為主流
  - label: C
    content: 日治時期的文獻有地牛翻身記載
  - label: D
    content: 清領時期隨荷蘭人流傳進入臺灣
  group_stem: "（二）\n地牛翻身不僅存在於以原始思維為主的古社會，即便是科學昌盛的現代文明，地牛翻身亦成為臺灣社會對於地震形成原因的主流代名詞。根據牛隻引進臺灣的歷史來看，牛成為原住民地震神話交感對象的年代溯源，應以荷據時期引進牛隻入臺為上限。然而，地牛翻身一說，並未出現在清領時期的臺灣文獻之中；也就是說，現今臺灣社會普遍流傳的地牛神話，應是起源於荷據時期引進牛隻入臺後的原住民口傳地牛神話，而成為地牛翻身之說的萌芽期。\n\
    其後，地牛翻身經由日治時期日本人類學者的採錄與寫定，並在漢族對牛的特殊情感背景下，地牛神話遂從原住民神話擴展至臺灣漢族對地震的解釋。無論是日治時期報紙與漢人作品，抑或藉由俚諺的形式，地牛神話業已內蘊於一般人民的思維觀念之中，與「共工怒觸不周山」、「巨鼇（地震魚）載地」等地震神話，都成為解釋各種地震的成因之一，故此時為各種地震神話並行的多元發展期。\n\
    \  至於一九九○年以後，受到報紙媒體強大傳播力的影響，地牛翻身一躍成為臺灣社會代稱地震的代表性說法，使得地牛神話來到了一個新的時期。          \
    \           （改寫自陳忠信〈試論臺灣地牛神話的形成與發展〉）"
