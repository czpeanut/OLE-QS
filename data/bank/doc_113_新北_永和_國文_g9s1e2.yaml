  stem: 下列文句，何者為作者對楚惠王做法的評價?
  options:
  - label: A
    content: 庖廚罪覺而不誅，自新而改後
  - label: B
    content: 王有仁德，天之所奉也，病不為傷
  - label: C
    content: 使監食之臣 不聞其過，失禦下之威
  - label: D
    content: 念譴之而不行其罪乎？是廢法而威不立也。
  group_stem: '（五）

    楚惠王食寒菹① 而得蛭② ，因遂吞之 ，腹有疾而不能食 。令尹問 ：「王安得此疾也？」王曰 ：「我食寒菹而得蛭 ，念譴之而不行其罪乎？是廢法而威不立也，非所以使國人聞之也。譴而行誅乎？則庖廚監食者法皆當死，心又不忍也。吾恐左右見之也，因遂吞之。」令尹避席再拜而賀曰：「臣聞天道無親，唯德是輔。王有仁德，天之所奉也，病不為傷。」是夕也，惠王之後而蛭出，及久患心腹之積皆愈。故天之親德也，可謂不察③
    乎！曰：此虛言也。

    案惠王之吞蛭，不肖之主也。有不肖之行，天不祐也。何則?惠王不忍譴蛭，恐庖廚監食法皆誅也。一國之君，專擅賞罰 ；而赦 ，人君所為也 。惠王通譴菹中何故有蛭 ，庖廚監食皆當伏法
    。然能終不以飮食行誅於人 ，赦而不罪 ，惠莫大焉 。庖廚罪覺而不誅 ，自新而改後 。惠王赦細而活微 ，身安不病 。今則不然 ，強食害己之物 ，使監食之臣不聞其過，失禦④
    下之威，無禦非之心，不肖一也。

    ——節錄自王充《論衡.福虛篇》

    【注釋】① 菹ㄐㄩ：酸菜。② 蛭：水蛭。 ③ 察：清楚。 ④ 禦：同「御」(1)統治管理；(2)阻止、禁止。'
