    (乙) 兩人神經細胞的染色體數目必定相同；

    (丙) 兩人的肌肉細胞內的體染色體數量必定相同；

    (丁) 兩人白血球內的性染色體型式必定不同；

    (戊) 兩人的生殖細胞內的性染色體形式必定不同。'
