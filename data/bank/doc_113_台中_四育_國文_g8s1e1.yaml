  type: single
  page: 1
  stem: 在田園之秋選一文中「太陽又出來了，一片清新的空氣，鮮潔的色彩，彷彿聽見了貝多芬田園交響曲第四樂章牧羊人之歌。」來表現雨過天晴的景象，這一句是以「聽覺印象來表現視覺印象」，下列何者表現手法與此相同？
  options:
  - label: A
    content: 那王小玉唱到極高的三四疊後，陡然一落，又極力騁其千回百折的精神，如一條飛蛇在黃山三十六峰半中腰裡盤旋穿插
  - label: B
    content: 遠近的炊煙，成絲的，成縷的，成捲的，輕快的，遲重的，濃灰的，淡青的，慘白的，在靜定的朝氣裡漸漸的上騰，漸漸的不見，彷彿是朝來人們的祈禱，參差地翳入了天聽
  - label: C
    content: 我低下頭去喊自己的名字，井水也大聲應和，連那回聲都彷彿有淡淡的餘香
  - label: D
    content: 山寺剛做完一場荒涼的夢，晨鐘便以潑墨的方式，一路灑了過去。
  lesson_raw:
