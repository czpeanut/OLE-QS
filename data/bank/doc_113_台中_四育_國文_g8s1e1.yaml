- id: doc_113_台中_四育_國文_g8s1e1_s3_26
  section: 3
  number: 26
  type: single
  page: 3
  stem: 鮑叔牙多次包容管仲，最主要的原因為何？
  options:
  - label: A
    content: 愛其才能，知其必有大用
  - label: B
    content: 基於同事道義，毫無怨言
  - label: C
    content: 實踐管仲母親臨終前的託付
  - label: D
    content: 知道管仲家貧，不忍心責罵。
  group_stem: "管仲曰：「吾始困時，嘗與鮑叔賈➊，分財利多自與➋，鮑叔不以我為貪，知我貧也。吾嘗為➌鮑叔謀事➍而更窮困➎，鮑叔不以我為愚，知時➏有利不利也。吾嘗三仕三見➐逐於君，鮑叔不以我為不肖➑，知我不遭時➒也。吾嘗三戰三走➓，鮑叔不以我為怯，知我有老母也。公子糾⓫敗，召忽⓬死之，吾幽囚受辱，鮑叔不以我為無恥，知我不羞小節，而恥功名不顯於天下也。生我者父母，知我者鮑子也。\n\
    \                                 《史記•管晏列傳》\n【註解】\n➊賈：音「鼓」，做生意。\n➋與：給。\n➌為：音「位」，替。\n\
    ➍謀事：謀劃事情。\n➎窮困：困頓不堪。\n➏時：時運。\n➐見：被。\n➑不肖：沒有才能。\n➒遭時：遇到好時機。\n➓三戰三走：三次打仗，三次逃跑。\n\
    ⓫公子糾：管仲侍奉的君主。\n⓬召忽：與管仲一同侍奉公子糾的友人。"
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
      code: 語文常識(一)
      title: 語法(上)詞類
      chapter: null
    textbook: 八上 語文常識(一) 語法(上)詞類
    labeled_by: ai
