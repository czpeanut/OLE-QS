- id: doc_113_台中_四育_國文_g8s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 「有一次，在雨中徘徊西子湖畔。我駐足凝望著碧藍如玉的湖水和低斜的梅花，卻聽得放鶴亭中響起了悠揚的笛聲。」關於這段話的說明，下列何者錯誤？
  options:
  - label: A
    content: 「笛聲」隱含了作者的思鄉情緒
  - label: B
    content: 由「梅花」可知當時的季節為秋季
  - label: C
    content: 「西子湖」的「西子」指的是古代美女西施
  - label: D
