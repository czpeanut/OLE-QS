  stem: 根據這段文字，以下缺空處，何者適合填入「動如參商」一詞？
  options:
  - label: A
    content: 他們夫妻感情□□□□，非常恩愛
  - label: B
    content: 看他倆□□□□，越顯得我形單影隻
  - label: C
    content: 他固執地移居海外，結果眾叛親離，只能□□□□
  - label: D
    content: 出社會後，每位同學各分東西，□□□□，相聚的次數也是越來越少。
  group_stem: 杜甫 贈衛八處士詩中有句：「人生不相見，動如參與商。」意謂：世間上的摯友真難得相見，好比此起彼落的參星與商星這兩個星宿。參為參宿，商星則為心宿的主星。參、心二宿皆為二十八宿之一，參宿位於西方，心宿位於東方，兩者絕不會同時出現於天空。因此，「動如參商」用於比喻分別而無法相見。
  tags:
