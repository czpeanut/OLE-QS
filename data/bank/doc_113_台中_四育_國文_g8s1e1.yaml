- id: doc_113_台中_四育_國文_g8s1e1_s3_29
  section: 3
  number: 29
  type: single
  page: 3
  stem: 以下四人的說法，何者不是表現了真正的自信？
  options:
  - label: A
    content: 不管昨日如何，今天我要過得比昨日更好
  - label: B
    content: 天生我材必有用，每個人都是獨一無二的
  - label: C
    content: 每件事情，我追求第一，不在乎任何代價
  - label: D
    content: 我堅持走自己的路線，練習傾聽自己的心。
  group_stem: "其實，生活及成長，不也是一種創造而非競爭性的工作？所以，它也是不需要和別人去做任何比較的啊！一般來說，女性較易予人胸襟狹窄、器度不夠恢弘的印象，往往便在於愛比較：比髮型、比身材、比服裝、比男朋友、比薪水級職的高低等等。但各具特色的個體，如何相比？\n\
    \n    橘子與奇異果，如何一分高下？玫瑰與康乃馨，又何能見出軒輊？而自信，若建築在與人比較之後的勝利感與優越感之上，也不是真自信。\n\n    真正的自信，來自自我比較──以今日之我和昨日之我相比。只要比過去快樂、進步、活得更有意義與價值，真正的自信於焉產生，所以，橘子不必\
    \ v.s. 奇異果。玫瑰與康乃馨，卻應該學會相互欣賞。\n\n    因此，建立自信的第二做法，便是──拒絕再玩「相互比較」的人性遊戲！\n\n    \
    \         ──節錄自陳幸蕙•橘子 v.s. 奇異果"
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
      code: 語文常識(一)
      title: 語法(上)詞類
      chapter: null
    textbook: 八上 語文常識(一) 語法(上)詞類
    labeled_by: ai
