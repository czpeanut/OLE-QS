  stem: 雲林縣曾想制定碳費徵收自治條例，卻被環保署不予核定，理由是碳費徵收是全國一致性事務，非地方自治事項。目前的法規中對於哪些事項是中央委辦、哪些屬於地方自治，沒有明確區分。中原大學財經法律系副教授林春元指出，依憲法規定，中央政府不得侵犯地方財政自主權，然而氣候治理的概念在憲法制定的年代還不存在，因此中央和地方對於相關法規的分權容易出現扞挌。關於中央與地方政府的分權爭議，依法如何解決為佳?
