- id: doc_113_新北_桃子腳_社會_g8s1e2_s2_48
  section: 2
  number: 48
  type: single
  page: 5
  stem: 落實月經平權，需要社會大眾共同努力，關於文中提及之團體性質，下列何者正確？
  options:
  - label: A
    content: 社團法人全球小紅帽協會為壓力團體
  - label: B
    content: 在野黨的立委應監督執政黨，不應該和執政黨立委合作
  - label: C
    content: 聯合新聞網的報導可影響政府施政，屬於利益團體
  - label: D
    content: 新聞媒體僅能提供資訊，無法接受民眾的回應繼而形成輿論
  group_stem: "【題組四】請閱讀下文，回答48-50 題 \n月經是生理女性必經的生理現象，本該是件稀鬆平常之事，但仍有不少女性因月經承受身、心靈的折磨，隨著性別議題受到重視，我國的政府與民間團體也致力於推動「月經平權」。\
    \ \n桃園市政府社會局為消弭月經貧窮及破除月經汙名化，與民政局攜手中壢仁海宮及社團法人全球小紅帽協會合作辦理「世界月經日倡議活動」，同時也串聯桃園在地6間香火鼎盛廟宇共同簽署成為桃園月經友善廟宇，於廟宇中設置「衛生棉貼心盒」，讓有急用需求的女性香客可以安心取用。\
    \ \n為推動性別平權，民眾黨立委黃珊珊及吳春城、國民黨立委萬美玲、民進黨立委莊瑞雄舉行記者會，表示三黨均有共識，各自提案要求財政部修法，將女性生理用品免營業稅法案的修正草案送出委員會，使受益對象擴增至全國女性。\
    \ \n萬美玲表示，生理用品對女性有不可替代性，不能與其他民生用品類比，財政部不應該擔心破窗效應也有其他民生用品要求免稅，反而應該協助商家建立免稅系統，共同消弭稅制與社會帶來的性別不平等，減輕女性負擔，也可實質提升民眾的性別意識。\
    \ \n——修改自〈推動兩性平權 朝野立委擬提女性生理用品免稅法案〉，《聯合新聞網》"
  tags:
    chapter:
      publisher: 南一
      book: 八上
      subject: 公民
