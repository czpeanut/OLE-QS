  group_stem: "【題組二】參考以下資料，回答23~24 題。\n    「清明上河圖」現藏於北京故宮，研究員余輝多年研究，發掘出了深埋於此圖中的奧秘。儘管一般人都認為「上河圖」在寫實描繪盛世的繁榮景象，但余輝先生認為，張擇端之所以畫出這些場景，是經過有意的選擇，顯然是想透過此圖傳達出一些重要訊息。他相信當時深諳藝術的徽宗，一定會了解畫中的深意。\n\
    \    「上河圖」中最精彩的部分，絕對是畫中央河上的大船，以及橋上來來往往的人潮，如果沒有仔細觀察，很可能會以為畫家是在讚嘆市集的富庶與熱鬧。但拿起放大鏡，卻發現船上的人一個個都手忙腳亂——因為他們的船桅快要撞上那座大橋。照理來說，橋上及河岸都應該要有官兵負責指揮交通，早早就該提醒船隻將船桅收起來才對，但「上河圖」中竟沒看到任何一個官兵。同時，橋上其實也不太平。橋上兩側都是攤販，道路面積縮小，造成交通擁擠的現象，橋上恰好有個騎著馬的武官，與前方坐轎子的文官起了衝突，誰也不讓誰。\n\
    摘錄自余輝，《故宮研究員帶你看懂中國名畫》"
