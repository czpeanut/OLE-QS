- id: doc_113_台中_大甲_社會_歷史_g8s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 在八世紀時波斯人逐漸移居印度西海岸古吉拉特邦一帶。這些波斯移民在印度被稱為「帕西人」，至今共有十萬人左右，他們的語言和服飾已經是融入印度文化，但保留了原有的宗教信仰。帕西人以溫和、慈善著稱，且有商業天賦，雖然是印度人口很少的少數民族，卻享有巨大財富，被稱為「印度的猶太人」，帕西人的祖先向外遷徙的原因，與下列何者最相關？
  options:
  - label: A
    content: 波斯帝國的擴張
  - label: B
    content: 亞歷山大帝國的崛起
  - label: C
    content: 阿拉伯帝國的影響
  - label: D
    content: 日耳曼民族的遷徙。
