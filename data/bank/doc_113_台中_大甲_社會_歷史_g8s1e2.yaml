- id: doc_113_台中_大甲_社會_歷史_g8s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 阿勒坡為人類古老的定居地之一，是以手工古皂聞名的城鎮，位於地中海與美索不達米亞之間的平原沃土，八世紀時在這裡製作出第一塊固體肥皂。製皂是古法工藝技術，為了保護當地古皂產業，政府對於產地與製程有嚴格的定義，僅在阿勒坡及其他三個城鎮生產的古皂，才能稱作「阿勒坡古皂」。若<u>小宏</u>穿越時空回到第一塊製作古皂的年代會看到什麼景象？（原卷有誤，已修正）
  options:
  - label: A
