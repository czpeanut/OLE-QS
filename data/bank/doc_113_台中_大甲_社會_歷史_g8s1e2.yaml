  group_stem: 題組三：座落於台南市民生綠園旁的「太平境馬雅各紀念教會」至今已有百年以上的歷史，它是一間紀念長老教會差派宣教師馬雅各醫生來台宣教的第一間教會，也是我們台灣基督長老教會宣教事工之濫觴。馬雅各一面行醫一面傳教，當時台灣民間的醫療觀念還十分保守，馬雅各開始行醫後不久就傳出他挖取人的眼睛和心臟做成藥，造成騷動並包圍看西街醫館，只好轉往駐有英國領事館的旗後，繼續行醫傳教。不久在得到法定協議的保護後，馬雅各帶著妻子重返台南，開設醫館與禮拜堂，他認為在台灣將近7年多的時間，是他一生中最美好的時光；而對台灣來說，馬雅各帶來的西方醫學概念與技術，則為台灣現代醫療打下重要的基礎。請回答第43～45題。
