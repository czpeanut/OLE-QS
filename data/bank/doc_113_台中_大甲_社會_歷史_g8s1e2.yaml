  number: 1
  type: single
  page: 1
  stem: 歷史上某位皇帝在位期間，禁止祭祀其它神明，封閉各式神殿，更反對重新安置勝利之神的塑像於議會內，同時禁止奧運會的舉行，因為他說此為異教徒活動，不符信仰的精神。因此奧運會在連續舉辦一千年後，於西元393年被迫禁止舉辦。請問：上述史事的發生與下列何者有關？
