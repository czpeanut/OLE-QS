  stem: '在四支試管中分別裝入等量的食用油，並分別加入適量甲、乙或丙消化液(如下表)。根據表中所示結果，甲、乙、丙消化液最有可能分別為何？


    | 試管 | 內容物 | 經過一段時間後 |

    | :--- | :--- | :--- |

    | 1 | 食用油 + 甲消化液 | 有許多小油滴 |

    | 2 | 食用油 + 乙消化液 | 有少量脂肪酸 |

    | 3 | 食用油 + 甲消化液 +乙消化液 | 有大量脂肪酸 |

    | 4 | 食用油 + 丙消化液 | 食用油沒有變化 |'
  options:
  - label: A
    content: 甲–膽汁；乙–胰液；丙–唾液
  - label: B
    content: 甲–膽汁；乙–腸液；丙–胰液
  - label: C
    content: 甲–胰液；乙–腸液；丙–膽汁
  - label: D
    content: 甲–胰液；乙–膽汁；丙–唾液。
