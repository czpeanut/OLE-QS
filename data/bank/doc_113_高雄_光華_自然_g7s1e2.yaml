- id: doc_113_高雄_光華_自然_g7s1e2_s1_47
  section: 1
  number: 47
  type: single
  page: 5
  stem: 木瓜酵素的功能和人體中的哪一種液體中的酵素功能最相似？
  options:
  - label: A
    content: 淋巴液
  - label: B
    content: 唾液
  - label: C
    content: 膽汁
  - label: D
    content: 胃液。
  group_stem: "※素養題:\n神奇的木瓜酵素\n   用還沒有成熟的青木瓜來燉肉，這會讓肉類又嫩又好吃，那是因為木瓜所含的木瓜酵素可以幫助蛋白質分解，幫助消化。根據現代實用中藥記載：「未熟果液，治胃消化不良，並為營養品，又為發奶劑」。青木瓜為未熟的木瓜，含有較多的木瓜酵素（papain），而木瓜酵素的作用是在分解蛋白質，幫助體內對蛋白質的消化吸收。\n\
    \   這種酵素可治胃病，是被列入藥草的主要原因。又如果將未成熟的木瓜削一些與比較老成的肉類共煮，則木瓜酵素可以有效分解肉質纖維，所以肉質就會比較熟爛，而不會感覺老得咬不動，就是這種酵素的作用。木瓜酵素分解蛋白質，提純的木瓜酵素就是所謂「鬆肉粉」。所以木瓜煲牛湯，牛肉很快變得軟滑就是這個道理。因為這個原故，吃木瓜可以幫助消化，清理腸胃，如果您的胃腸吸收狀況不太理想，不妨試試在飯前吃下兩湯匙左右的木瓜，一星期吃\
    \ 2~3 次，就可以改善吸收情況。同時可以治療腸胃積滯，胃炎，十二指腸潰瘍，；如果在吃完大餐之後，腸胃脹得不舒服，吃些木瓜也能幫助消化。\n   木瓜汁可以消滅阿米巴原蟲和蛔蟲\
    \ （煮熟了的木瓜沒有這個效果，因為酵素已給高熱破壞了它的活性。）。由於木瓜性微寒，胃寒的人士不宜生吃木瓜。否則吃後會腹瀉或胃寒欲吐。鳳梨、木瓜天然酵素多\
    \ 抗炎助消化\n\n   在我們日常生活常接觸到天酵素產品，只是不自知而已，這些天然酵素其實有其各自特點也具有特殊用途。"
  tags:
