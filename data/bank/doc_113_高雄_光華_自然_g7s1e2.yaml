  stem: '下列關於胃的敘述哪些是正確的？

    甲、胃液是酸性 乙、可暫存食物 丙、可徹底分解蛋白質 丁、可吸收食物中大部分的水分'
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 甲乙丙
  - label: C
    content: 乙丙
  - label: D
    content: 乙丙丁。
  group_stem: '消化性潰瘍是指胃、十二指腸等處黏膜，受到胃液強酸侵蝕而形成的表面組織損傷。潰瘍發生在胃叫胃潰瘍，發生在十二指腸則為十二指腸潰瘍（如附圖）正常情況下，胃黏膜對胃酸的侵襲有很好的防衛能力，但情緒容易緊張焦慮、飲食習慣不良、抽煙、酗酒、服用某些藥物等行為，都容易造成此平衡被破壞而罹患消化性潰瘍。例如長時間處於精神緊張的狀態下，就容易使胃酸分泌增加，引發消化性潰瘍。大部分患者會有燒灼感、脹痛、飢餓痛、甚至劇烈疼痛；嚴重會有解黑便、吐血或胃穿孔等症狀。

    消化性潰瘍是現代人常見的一種疾病，了解它的症狀並隨時注意自己的身體狀況，可以幫助我們早期發現就醫。不過預防勝於治療，最重要的是在日常生活中遠離消化性潰瘍的各種危險因子。'
