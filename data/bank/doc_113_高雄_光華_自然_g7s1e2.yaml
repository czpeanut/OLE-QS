  - label: B
    content: 破壞葉片的表皮層，讓碘液可以滲入葉片中
  - label: C
    content: 溶掉葉內的色素，方便觀察顏色變化
  - label: D
    content: 使氣孔打開，讓碘液可以滲入葉片中。
