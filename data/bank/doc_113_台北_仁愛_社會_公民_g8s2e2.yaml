  stem: 《刑法》第 274 條原本規定:「母於生產時或甫生產後，殺其子女者， 處六月以上五年以下有期徒刑。」是考量到母親在子女剛出生時的精神狀態而減輕刑度，然而，為了避免對出生嬰兒的生命保護流於輕率，西元2019年又修法增「因不得已之事由」要件，如遭性侵而受孕，並交由司法審酌判斷，以避免該條寬恕規定被隨意引用。請問：從以上修法說明，可看出《刑法》的何種內涵?
