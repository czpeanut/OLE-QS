  - label: A
    content: 12 歲以上，未滿20 歲
  - label: B
    content: 12 歲以上，未滿18 歲
  - label: C
    content: 14 歲以上，未滿18 歲
  - label: D
    content: 14 歲以上，未滿20 歲。
