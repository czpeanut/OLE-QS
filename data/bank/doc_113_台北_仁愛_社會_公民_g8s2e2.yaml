- id: doc_113_台北_仁愛_社會_公民_g8s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '以下是我國政府依相關法令對散布假訊息者的處罰，請根據甲～丁法律內的資訊，試辨別出需承擔刑事責任的項目有哪些？：

    | 項目 | 法律 | 法條內容 | 處罰內容 |

    | :--- | :--- | :--- | :--- |

    | 甲 | 《傳染病防治法》 | 散播有關傳染病流行疫情之謠言或不實訊息，損害公眾或他人 | 300 萬元以下罰金 |

    | 乙 | 《社會秩序維護法》 | 散佈謠言影響公共安寧 | 3 日以下拘留或3 萬元以下罰鍰 |

    | 丙 | 《食品安全衛生管理法》 | 散播食安謠言或不實訊息損害公眾或他人 | 3 年以下有期徒刑、拘役或100 萬元以下罰金 |

    | 丁 | 《傳染病防治法》 | 利用傳播媒體發表傳染病疫情之相關訊息，若有錯誤、不實，致嚴重影響整體防疫，經主管機關通知仍拒不更正 | 10 萬~100
    萬元罰鍰 |'
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 甲丙
  - label: D
    content: 乙丁
