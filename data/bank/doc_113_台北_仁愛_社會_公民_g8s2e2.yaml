- id: doc_113_台北_仁愛_社會_公民_g8s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 刑罰會侵害人民的生命、自由和財產，因此唯有在其他法律都不足以遏止犯罪時，國家才會動用刑罰的制裁。下列4 位同學對刑罰的敘述，何者須修正？
  options:
  - label: A
    content: 阿布：藉由嚴峻的處罰，如死刑，達到威嚇目的，使人不敢以身試法
  - label: B
    content: 東銘：藉由明確的法律規定，約束人民的行為，以維護社會秩序
  - label: C
    content: 佳惠：刑罰應讓犯罪者得到應有的處罰，以撫平被害人及其家屬所受的傷害
  - label: D
    content: 品沂：觸犯刑法規定應透過立法審判程序，接受制裁。
  tags:
    chapter:
      publisher: 翰林
