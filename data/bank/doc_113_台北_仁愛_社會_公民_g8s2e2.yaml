- id: doc_113_台北_仁愛_社會_公民_g8s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '公園中兩名鄰居在聊天，請根據下列的對話內容判斷，下列敘述何者正確？

    庭華：剛才一個年輕人騎車撞壞了我的車。

    勇新：那你怎麼處理？

    庭華：他當場賠償了我的損失，所以我就不追究了。

    勇新：幸好你沒受傷，否則他可能就要負擔多種法律責任。'
  options:
  - label: A
    content: 庭華採取訴訟外和解的方式解決紛爭
  - label: B
    content: 庭華利用行政機關調解方式解決紛爭
  - label: C
    content: 勇新所說的法律責任是指民事責任和政治責任
  - label: D
    content: 勇新所說的法律責任是指刑事責任和政治責任。
