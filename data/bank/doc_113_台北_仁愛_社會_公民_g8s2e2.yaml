  group_stem: '從2021 下半年至今，不斷有台灣人被高薪工作誘騙至杜拜、柬埔寨、緬甸後，被強迫從事網路詐騙、甚至遭到拘禁、毆打、轉賣等案件。今年此類誘騙案例急速增加，政府決定修法因應，因過去的《刑法》對剝奪行動自由罪，尚無就特定情況加重處罰的規定，於是立法院2023
    年三讀通過相關條文。明定「5 種構成加重剝奪行動自由罪」的情形，規定如下：

    一、3 人以上共同犯之

    二、攜帶兇器犯之

    三、對被害人施以凌虐

    四、剝奪被害人行動自由7 日以上

    五、對精神、身體障礙或其他心智缺陷之人犯之。

    希望藉由以上加重罰則的情況來減少犯罪行為的發生。'
