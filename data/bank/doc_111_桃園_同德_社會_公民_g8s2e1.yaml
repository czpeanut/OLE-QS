- id: doc_111_桃園_同德_社會_公民_g8s2e1_s1_47
  section: 1
  number: 47
  type: single
  page: 1
  stem: '小美寫了一部劇本，內容與處理一件民事糾紛有關，她將劇本拆成四份，分給負責演出的同學背臺詞，部分內容如附表。依照我國現行法律判斷，這四位同學演出的先後順序應為下列何者？


    | 拉拉 | 即將進入訴訟階段，因此必須提出對自己有利的證據。 |

    | --- | --- |

    | 丁丁 | 他昨天竟然反悔，早知道一開始就拒絕私下和解！ |

    | 提西 | 現在由調解委員會為雙方進行調解。 |

    | 小波 | 官司進行到一半，您要不要考慮訴訟上和解？ |'
