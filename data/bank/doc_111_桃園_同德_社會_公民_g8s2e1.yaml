  section: 1
  number: 42
  type: single
  page: 1
  stem: 一名房東與租客產生租屋糾紛，租客認為兩人當初已經同意解除契約，他既未入住，也全額支付違約金，房東不該在隔了 3 年後，向他索取一年的房屋租金，並將他告上法院。房東表示雙方認知不同，就交由法官作出公正的裁判。請問：關於房東採取的民事糾紛解決途徑，下列敘述何者正確？
  options:
  - label: A
    content: 通常由法官主動介入調查與蒐證
  - label: B
    content: 雙方必須強制在法庭上進行和解
  - label: C
    content: 流程快速簡便，不收取任何費用
  - label: D
    content: 當事人須提出有利於自己的主張。
