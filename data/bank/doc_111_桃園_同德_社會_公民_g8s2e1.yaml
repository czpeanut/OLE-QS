  stem: 《關於我和鬼變成家人的那件事》劇情講述一個直男警察吳明翰在執行任務時意外撿到了阿嬤幫毛邦羽冥婚的紅包，一段冥婚姻緣就此展開！請問：在我國婚姻要有效需有哪些法定程序？
  options:
  - label: A
    content: 莎拉：只要兩人同意成為配偶，口頭上互相承諾，婚姻關係即算確認
  - label: B
    content: 約翰：除了公開的儀式之外，還必須徵求雙方父母同意才算正式成立
  - label: C
    content: 安琪：先經過訂婚、公開宴客，並在親友的見證下，雙方關係才確立
  - label: D
    content: 彼特：採書面方式，至少要有兩位證人簽名，雙方還必須親自去戶政機關登記。
