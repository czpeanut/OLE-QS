- id: doc_111_桃園_同德_社會_公民_g8s2e1_s1_48
  section: 1
  number: 48
  type: single
  page: 1
  stem: 黑暗榮耀是最近NETFLIX 上排行榜的韓劇，劇情講述一名只為復仇而活的女子，她打定主意要向兒時霸凌她、導致她人生全毀的昔日同學實施終極報復。劇情中還出現有女學生被電棒燙燙傷，也有女同學被強迫脫下衣服因此不小心掉到樓下造成死亡。請問：關於女主的終極報復何者敘述正確？
  options:
  - label: A
    content: 所有的事情都可經由和解，調解來權利救濟
