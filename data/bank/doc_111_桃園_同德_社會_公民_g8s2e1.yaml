- id: doc_111_桃園_同德_社會_公民_g8s2e1_s1_45
  section: 1
  number: 45
  type: single
  page: 1
  stem: 隨著車市熱絡，國人買氣上升，交易爭議也隨之增多。以往民眾經常使用(甲)途徑處理買賣糾紛，但由於曠日廢時，耗費精神過多，有時尚須支付律師費用等因素，近年來，民眾開始接受(乙)途徑尋求解決之道，只須向鄉鎮市區公所聲請，而且是免費服務，可作為民眾處理民事糾紛另一個選擇參考。請問：對於上文中(甲)
    (乙)途徑的說明，下列敘述何者正確？
  options:
  - label: A
    content: (甲) 當事人必須委任律師提出 (乙)由地方熱心人士協助溝通
  - label: B
    content: (甲) 雙方須自行提供有利證據 (乙) 任何一方可隨時反悔
  - label: C
    content: (甲) 雙方須自行提供有利證據 (乙) 無法向法院聲請強制執行
  - label: D
    content: (甲) 雙方須自行提供有利證據 (乙)可以向法院聲請強制執行。
