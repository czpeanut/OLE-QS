- id: doc_113_新北_忠孝_自然_g7s2e2_s4_46
  section: 4
  number: 46
  type: single
  page: 4
  stem: 文章中提到的細菌和真菌，下列關於這兩種微生物的比較，哪一項是正確的？
  options:
  - label: A
    content: 兩者都具有細胞壁
  - label: B
    content: 兩者的細胞都具有明顯的細胞核
  - label: C
    content: 細菌的細胞結構比真菌的細胞結構複雜
  - label: D
    content: 細菌屬於真核生物界，真菌屬於原核生物界
  group_stem: '你是否曾經好奇，為什麼有些小寶寶好像比較不容易生病？最近科學家發現，家裡有養寵物，像是貓咪或狗狗的寶寶，他們呼吸道感染的風險可能相對較低。這項有趣的研究指出，寵物可能會透過增加家中環境中微生物的多樣性，間接地影響寶寶的健康。

    我們的身體裡以及周遭環境中，存在著各式各樣的微生物，包括細菌、真菌，甚至是更微小的病毒。科學家發現，有養寵物的家庭，環境中的微生物種類往往更豐富，這可能使得寶寶在成長過程中，更早接觸到不同種類的微生物。

    這些早期接觸，就像是幫助寶寶的免疫系統「練習」。當寶寶接觸到多樣的微生物時，他們的免疫系統就能夠學習辨識哪些是敵人，哪些是朋友，進而發展出更完善的防禦能力。研究甚至發現，家中有養狗的嬰兒，其腸道中某些特定的有益細菌數量較多，而這些細菌被認為與較低的呼吸道疾病發生率有關。

    這顯示毛小孩不只是情感上的陪伴，也對新生兒的健康發展有正面影響。

    改寫自「泛科學」2024/8/25-「家中養貓狗，寶寶可能更健康？」'
