  group_stem: '你知道嗎？常見的酸種麵包，背後藏著一個微生物的大世界。酸種麵包的主要原料只有麵粉、水和鹽，利用自然界中的乳酸菌和酵母菌發酵麵團製成的。這些微生物一起作用，讓麵團產生微酸的風味與鬆軟的口感。

    酸種麵包和市售常見麵包不同，後者通常使用單一種商業酵母，發酵速度快，口感單一；而酸種麵包依靠自然界中多種微生物的合作，進行長達 24 小時以上的發酵，風味也更為複雜，口味和保存性都更佳。

    乳酸菌能分解糖類並產生乳酸，使麵包帶有微酸風味；酵母則能進行酒精發酵，產生氣體讓麵包變得蓬鬆。

    早在古埃及時代，人類就已開始用酸種來發酵麵包。各地也有自己的酸種麵包文化，如義大利的阿爾塔穆拉麵包和美國舊金山著名的酸種白麵包。

    這些微小的生命，不僅改變了食物的風味，也展現了人類如何利用自然界微生物，創造出獨特又美味的食品。

    改寫自「泛科學」2024/12/19-「微酸與麥香兼具透視酸種麵包的小世界」'
