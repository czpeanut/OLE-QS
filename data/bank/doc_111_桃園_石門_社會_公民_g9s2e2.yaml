  stem: 我國民法基於優生學及倫常觀念考量，在民法第983條明定:「直系血親及直系姻親不得結婚；且直系姻親於姻親關係消滅後仍不得結婚」。從此條規定來判斷「繼親家庭」中的各式問題，下列何者是正確的？
