  stem: '政府當初為了防疫祭出各項管制措施，包含機場出入境管控、下令酒店及舞廳業者無限期停業。請問，上述這些作法影響哪些人民基本權利:(甲)平等權(乙)自由權(丙)受益權(丁)參政權。正確者為:'
