  section: 1
  number: 13
  type: single
  page: 2
  stem: 原住民的傳統生活方式，是隨環境演變的經驗智慧。例如各部落皆有獵場，互不侵犯，且獵人們僅取生存所需，如此便可確保各獵場的動物不被濫獵。例如布農族只在特定季節捕捉獵物，且絕不趕盡殺絕，所捕獲的獵物，則會全部分享給部落的每個人，並將其皮、毛、牙做為服裝或頭飾，一絲一毫都不浪費。請問，這樣的生活智慧，有何好處？
  options:
  - label: A
    content: 讓部落環境生態永續發展
  - label: B
    content: 幫助部落經濟產業發展
  - label: C
    content: 讓部落各階層的人能各司其職
  - label: D
    content: 促進族群的文化認同。
