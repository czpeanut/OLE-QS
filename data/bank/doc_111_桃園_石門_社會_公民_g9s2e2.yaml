  type: single
  page: 1
  stem: 有民眾向立法委員請願，在搭乘台鐵及高鐵時都能飲水，且歐、美、日等國家的地鐵也沒有不能喝水的嚴苛規定，希望台北捷運公司能放寬在捷運上喝水的規定。因此，立法委員擬提案修改《大眾捷運法》，以能貼近民眾實際需要，但台北捷運公司卻持不同意見。由上述內容判斷，下列敘述何者正確？
