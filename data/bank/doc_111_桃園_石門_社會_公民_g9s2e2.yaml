- id: doc_111_桃園_石門_社會_公民_g9s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: '近來，網路上出現許多如「xx 爆料公社」、「黑特xx」的特殊社群，許多網友在上面以匿名方式宣洩情緒與攻擊他人，但往往後續事件的延燒，是所有人始料未及也無法掌控的。請問，如果校園內出現類似問題，下列哪組選項敘述完全正確？

    甲：網路是虛擬世界，無法追查到管理者與發文者身分。

    乙：若以匿名、暗示的方式發文，是不會有法律責任的。

    丙：不但違反校規、法律，更容易造成難以抹滅的傷害。

    丁：無論管理者有意無意，網路的匿名性容易助長霸凌。

    戊：未經求證發文，散播不實謠言可能構成妨害名譽罪。

    己：即使對方不喜歡，只要我說沒惡意就不會構成霸凌。

    庚：除發文者外，管理者、按讚、留言附和者均無責任。'
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 丁戊庚
  - label: C
    content: 丙丁戊
  - label: D
    content: 戊己庚。
