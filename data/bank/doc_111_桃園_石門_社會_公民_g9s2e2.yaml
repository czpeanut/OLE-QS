  section: 1
  number: 38
  type: single
  page: 4
  stem: '疫情除了影響民眾日常生活，同時也造成國內外經濟與許多產業受到波及，經濟產值嚴重縮水。政府因此制定「嚴重特殊傳染性肺炎防治及紓困振興特別條例」，希望能在疫情持續期間及未來經濟復甦階段，能給予需要的協助及經費補助。有關上述該條例的制定程序，何者正確？

