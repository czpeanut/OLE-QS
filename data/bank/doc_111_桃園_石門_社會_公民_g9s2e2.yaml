    content: 甲乙
  - label: B
    content: 甲丙
  - label: C
    content: 乙丙
  - label: D
    content: 丙丁。
  group_stem: "【題組三】\n    新冠肺炎疫情持續延燒近三年來，民眾已逐漸找到與病毒共存的生活方式，政府也從原來嚴格的防疫管制措施持續調整放寬各式管控作為，逐步要讓生活回歸正常。當初居家隔離或居家檢疫的民眾依法令規定不能外出，一般民眾也需配合佩戴口罩及保持社交距離等措施，著實讓大家感覺相當不便，因為違規除了當事人本身將遭受重罰外，更可能增加社區群聚感染風險，進而可能造成封城的恐慌及困境。各行各業也因為疫情受到不少衝擊，即使到現在，經濟的復甦還不到疫情前一半呢！請問:"
