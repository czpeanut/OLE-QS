  section: 2
  number: 38
  type: single
  page: 3
  stem: 盧安達位於非洲哪一地區？
  options:
  - label: A
    content: 東非
  - label: B
    content: 西非
  - label: C
    content: 南非
  - label: D
    content: 北非。
  group_stem: "（三）盧安達飯店是一部於2004 年跨國合作拍攝的電影。這部電影由真人真事所改編，以1994 年盧安達大屠殺為\n      背景，講述了一位飯店經理保羅．魯塞薩巴吉納，他要如何設法挽救1,268\
    \ 位圖西族和胡圖族難民的故事。\n  盧安達境內主要由胡圖族及圖西族組成，在殖民時期，殖民者考量圖西族多屬地主階級，胡圖族則多為\n       牧牛人，因此讓人口占少數的圖西族統治多數的胡圖族。盧安達獨立後，改由多數的胡圖族取得政權，並對\n\
    \       圖西族報復，使得兩族衝突日益加深，至1994 年爆發了胡圖族對圖西族的大規模屠殺事件，圖西族的難民\n       在鄰國烏干達組成反政府組織，欲推翻由胡圖族領導的政府……。"
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 地理
      code: 5-2
      title: 族群與文化
      chapter: 第5章 漠南非洲的自然環境與文化
