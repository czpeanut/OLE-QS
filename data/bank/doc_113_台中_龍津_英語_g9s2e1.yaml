  section: 4
  number: 36
  type: single
  page: 2
  stem: Which information is on the back of the ID card?
  options:
  - label: A
    content: Place you live.
  - label: B
    content: Name.
  - label: C
    content: Birthday.
  - label: D
    content: ID number.
  group_stem: 'Have you ever taken a close look at your ID card?

    What information can you find on it? In fact, many things about yourself can be
    found on this little piece of card.

    Now, let''s take a look together.

    On the front of the card, you can see your photo, name, date of birth, and the
    date you get the card. As for the back, your parents'' names, city of birth, and
    address are shown. If you are married, the name of your spouse will be shown.
    So, you can see Mr. Lin and Mrs. Lin''s name on each other''s ID cards.

    What else can you see on the ID card? Do you see a letter followed by nine numbers
    on the lower right part on the front? They are not random numbers but have meanings.
    If your ID number is A123456789, the letter means the city. For example, A is
    Taipei city, B is Taichung city, D is Tainan city, and E is Kaohsiung city. The
    first number is your gender. One means man, and two means woman. The following
    seven numbers are the order of your ID card. And the last number is to make sure
    if the letter and all the numbers are correct under a special math form.

    Next time, check your ID card and see if you can find all the information about
    yourself on it.


    📖 ID card 身分證 random 隨機的

    form 格式'
