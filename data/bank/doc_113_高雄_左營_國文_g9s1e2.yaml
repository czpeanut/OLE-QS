    粵令性悅諛，每布一政，群下交口贊譽，令乃歡。一隸欲阿①其意，故從旁與人偶語②曰：「凡居民上者，類喜人諛，唯阿主不然，視人譽蔑如耳。」其令耳之，亟召隸前，撫膺高蹈，嘉賞不已曰：「嘻，知余心者惟汝。」自是昵之有加。

