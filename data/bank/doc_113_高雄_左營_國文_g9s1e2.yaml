  stem: 話說老殘辭別蓮池潭的藕花荷香，來到左營 巨蛋商圈踅了一趟。沿途建築櫛比鱗次，人潮熙來攘往，好不熱鬧，但見商家副副聯語，他見著，內心暗暗稱許，也默默依序書於他的行旅手札：（甲）類多竹馬青梅之友/不失仁人赤子之心
    （乙）白雪陽春傳雅曲/高山流水覓知音 （丙）大塊文章百城富有/名山事業千古永留 （丁）憑君麗質未必羞花閉月/經我妙法定能沉魚落雁（戊）龍井泉多奇味/武夷茶發異香。請問老殘依序經過哪些地方？
  options:
  - label: A
    content: 玩具反斗城→高雄婆婆冰→爬格子寫作教室→那個花店→貢茶
  - label: B
    content: 揚梅吐氣梅子專賣店→山葉愛樂行→致富投顧公司→妖嬌美睫美甲→五十嵐
  - label: C
    content: 湯姆熊歡樂世界→河合音樂教室→誠品書店→愛爾麗醫美診所→茶之魔手
