- id: doc_113_高雄_左營_國文_g9s1e2_s2_23
  section: 2
  number: 23
  type: single
  page: 3
  stem: 從這次的看船經驗，作者在「快與慢之間」感悟出什麼樣的人生體會?
  options:
  - label: A
    content: 志行萬里者不會中道而輟，亦不會拘泥而誤大謀
  - label: B
    content: 勇者不在意所遭遇的風暴，所以能安然到達目標
  - label: C
    content: 才高意廣者足以任重致遠，不必與人爭一時之勝
  - label: D
    content: 行動迅捷快速者方能講求效率，獲取最大的利益
  group_stem: "(一)\n到基隆港去看船，靜靜地看一回船，就像讀一篇人生大道理的文章。\n    首先我看到遠方一艘滿載貨櫃的大船，好像動也不動，而近岸有許多小船，排浪疾馳，很容易就輕側轉彎，顯得矯健快捷而有神，小船跑一回就不見蹤影，而那負厚持重的大船，仍呆在視線的遠方，很吃力的樣子，究竟在不在移動前來呢？初步的印象，讓我覺得小船令人喜悅，大船令人悲苦。器物大了運轉一定艱難，吃水深了前進一定緩慢。\n\
    \    但是我又想：它卻是處在安泰踏實的方位，也是眾人肯托付它運載的重任，誰都明白，一時跑得快的容易翻倒，就像一時快書的字跡容易錯改。在沒有滔天巨浪的海面倒也罷了，一朝有了滔天巨浪，才知道那些疾馳的小船，是根本沒用的。況且再看一艘大船出港去，啟碇雖慢，掉頭更遲，但一出港外，面對萬里汪洋，那種「脫網魚遊江水深」的樂趣，也不是小船所能享有的。\n\
    (黃永武 船的哲思)"
