- id: doc_113_高雄_左營_國文_g9s1e2_s2_29
  section: 2
  number: 29
  type: single
  page: 4
  stem: 「力足以舉百鈞，而不足以舉一羽。」孟子認為此狀況的原因何在?
  options:
  - label: A
    content: 不肯用力
  - label: B
    content: 力有未逮
  - label: C
    content: 技窮力屈
  - label: D
    content: 力能扛鼎
  group_stem: "(四)\n    孟子曰：「有復①於王者曰：『吾力足以舉百鈞，而不足以舉一羽；明足以察秋毫之末，而不見輿薪』，則王許之乎？」曰：「否。」「今恩足以及禽獸，而功不至於百姓者，獨何與？然則一羽之不舉，為不用力焉；輿薪之不見，為不用明焉；百姓之不見保，為不用恩焉。故王之不王，不為也，非不能也。」\n\
    \    曰：「不為者與不能者之形何以異？」曰：「挾太山以超北海②，語人曰：『我不能』，是誠不能也。為長者折枝，語人曰：『我不能』，是不為也，非不能也。故王之不王，非挾太山以超北海之類也；王之不王，是折枝之類也。老吾老，以及人之老，幼吾幼，以及人之幼，天下可運於掌。」\n\
    （孟子･梁惠王）\n注釋\n①復：回答。\n②挾太山以超北海：挾泰山跨過北海，比喻人力所不能及之事。"
