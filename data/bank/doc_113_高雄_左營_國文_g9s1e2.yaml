  stem: 根據本文，下列敘述何者正確？
  options:
  - label: A
    content: 作者認為要先置身其中才能清楚看見明湖全景
  - label: B
    content: 大明湖因為淤泥阻塞而成為遊人眼中的「小河」
  - label: C
    content: 大明湖之所以安靜含蓄是因遊客稀少，環境安靜
  - label: D
    content: 作者認為遊人多不懂得要在正確時間與正確地點賞景。
  group_stem: "(五)\n    常聽人說，讀了老殘遊記去遊大明湖，一定會感到失望或幻滅，因為百花隄沒有花，歷下亭碰不到名士，大明湖不是湖，乃是一條小河，夾岸長滿了蘆葦。還有些粗心的人，既不注意時間，也不注意地方，在歷下亭邊找千佛山的倒影，在滿天雲霧裡看鵲華秋色，找不到，看不見，就懷疑老殘撒謊，或更斷定是文人誇誕。大明湖因為老殘遊記的描繪出了名，也因為好多遊人指出它的名不符實，使齊\
    \ 魯山水都減了聲價。\n  從劉鶚遊濟南到現在，不過半世紀多點，大明湖真老了、醜俗化了嗎？照我看，明湖也許變了，變的可並不多。「荷花世界柳絲鄉」還是照樣，只是種荷花的人，因為老殘一類的白吃蓮蓬，亂摘蓮花的客人太多了，培植了一排一排的葦牆，把荷花一區一區的圈起來。只留下幾條深水的通路，給閒人蕩槳。花是看不見卻可嗅聞到花香，你也可以從蘆葦縫裡窺見芬芳鮮豔的花海的一斑。你想要認識湖的全貌嗎？請到北極閣上看，請到城頭馬路上看，「一城山色半城湖」，「滿湖荷花繞湖柳」，並沒有什麼誇張。千佛山的倒影，一定是天高氣清時在鐵公祠前的湖面寬處，才看得分明。想認識大明湖的光明如鏡，也須在蘆荷枯萎後，到千佛山頭興國寺的敞廳遠眺，或是坐上飛機下看，黃河是一條寬而黃的長帶子，小清河是一條綠的頭繩，大明湖正是仙女放下來的一面亮晶晶的鏡臺。荷花是可以遠觀，不可以褻玩的，明湖也跟廬山一樣，要認識它的真面目，得站得高一點兒遠一點兒。\n\
    \  大明湖的特徵是安靜樸素，有含蓄，有用處。多少名泉的水，又新鮮，又乾淨，不分冬夏晝夜，流進流出，沒有聲響。冬天不結冰，夏天不咆哮，颳風不起洶湧的波濤，下雨沒有決隄的洪流。畫舫上難聽見笙歌管弦，繞湖岸多半是幽居蕭寺，連暮鼓晨鐘也沒有，整天是靜悄悄的。就是坐著小盆向遊客兜賣蓮花的小兒女，也只是拈花示意，並不吵著叫著賣。當地的諺語說：「湖裡的蝦蟆乾鼓肚。」以晝夜聒耳，不知趣，不看風色著名的蛙，到這裡都「守口如瓶」。雖然不一定由於什麼皇帝的金口玉言，總要算一種難解的奇蹟。\n\
    （梁容若 我看大明湖）"
