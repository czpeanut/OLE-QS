  group_stem: "(六)\n    我對山水世界的概念和情懷，到目前為止，大抵都是由太魯閣一帶那片豐富的天地塑造出來的。將近二十年了，除去期間遠行幾達五年的時光外，每年，我都會至少一次到峽谷內住一段日子。太魯閣那種有骨有神地揉合了磅礴與靈秀、高廣與幽奇的氣質與境界，一直深深地令我著迷。\n\
    \    早先的時候在山上，年輕而狂野，幾乎天天都要進入山林水澤裡搜巡，好像那是我假期裡自派的任務。我和年齡相若的同伴們溯著立霧溪的一些支流而上，在磊磊的巨石間攀爬跳躍，穿過寒冷嘩叫的水瀑，我們哆嗦著身體，也大聲地嘩叫著，然後我們有時就停下，躺在水中平板的大石上胡亂唱歌，看山間的樹葉在水霧飛濺中迴轉著緩緩飄落，蛙類驚慌地跳下水。有時，我們繼續走，為了繞過峭壁夾峙的深潭，便找來梗在石頭間的浮木，將它靠在長滿了青苔的陡崖，然後再顫巍巍地抱著木頭爬到可以落腳的更高處，或者腳踩著斜生在石壁上的樹幹，手也緊抓著枝葉，戒懼地一步一步走過。\n\
    \    當然我們也專門去爬山，循著獵人的小徑，穿過蓊鬱青蔥的雨林，腐葉混合著溼氣和密林的味道老是跟著我們走，偶爾還看到青竹絲掛在頭頂上方的細枝上。步道經常是沿著斷崖上升的，手腳並用地走在上面，腳下鬆動的石片唰唰滑落，無聲地跌入我們不敢探望的谷底。若是忽然飛起一隻鳥，並發出尖拔的嘯叫，我們更是一時渾身冷汗。所以我們常常是半路就退了下來，帶著一些挫折、沮喪。\n\
    \    然而我們還見到了幾個原住民近乎廢棄的部落和獵寮。我們躺在四下無人的嶺上看雲走過潔淨的藍天，覺得自己很偉大。有時，當我們採到了一些漂亮的楓葉或其他的什麼葉子摸黑下山時，耳邊全是風吹過迅速漆暗下來的樹林山岩的聲音，以及驚起的鳥獸噗噗飛竄的聲音和蟲鳴。山林的氣味一陣濃過一陣，彷彿是它們正要入睡的鼻息。\n\
    \    夏季裡，畢竟還是覺得碧澄的溪水較安全和誘人。我們往往是吃中飯時就說好要去哪一條溪谷，飯後就立即出發了。我們在巨石下的洞穴游進游出，順著滑溜的岩石從瀑布上滑入水潭，以藤蔓和撿來的樹幹紮成木筏，或坐或攀地一起努力順流而下，但經常是沒兩下子筏就翻覆或沉沒了，只留下歡笑聲在水面隨著那些可能已經散開的木頭四散，在岸壁間迴繞。當我們抬頭，也許可以看到一群獼猴垂掛在山腰的樹枝上，正對著我們吱吱叫，一邊還不停動著牠們的身軀，像是在為我們喝采，或者在嘲笑我們在大自然世界裡的笨拙。我們當然也哄鬧著逗牠們玩，在岸邊的石頭流水間跑上跑下。那清澄的澗水不斷地激越著，跳躍著，嘩啦嘩啦地唱歌，一如我們稚嫩的青春。\n\
    \    那激越的水，那清澄的水，等我五年後再來時，似乎沒什麼改變，青山也是。但我騷動的青春卻好像已隨著當年的流水匯入大海了。\n    近年來，我大概都是獨自上山的，偶爾也帶著妻子女兒同來。雖然也還不時深入溪谷去游泳，但已少有尋幽探奇的興致了，而往往只是坐在石頭上看流水，端詳石壁糾扭褶皺的陰陽紋路和色澤，或者仰臥著看葉隙後的一線天。雲緩緩走過。正午的時候，也許會有陽光照在某幾個段落的溪水上，而在氣候易變的晨昏，或者也不一定要是氣候易變的晨昏，在不遠的某個山彎水折處，我可能還會看到煙霧在溫暖的光線裡映著裸露的灰藍色的斷崖浮升，有時激烈地無聲噴騰，有時則如薄薄的棉絮飄忽飛舞。\n\
    \    更常的是，我只是在住處附近坐著看山，或毫無目的地閒閒散步。時而抬起頭來，看到的依然是山，挺拔硬毅，繞密厚實，一層疊著一層。而雲，各種風貌的雲，就在大山間遠遠近近地生息幻化，在陽光下，在陰雨中，有時還帶著大塊的影子悠緩地移過。我總覺得，那些山，在光影煙雲的烘托下，每一個分秒都呈現出絕佳的姿色，豐繁多變卻又極其單純的美的姿色，而那種美是完全悄無聲息卻又暗潮洶湧的，是一種雄渾無限的氣勢，靜的奧義，大自然生命深沉壯闊的訊息。\n\
    \    那奧義和訊息，我隱約體會著，把握著，然後回到室內，安心地看書，寫字。\n    安心地看書寫字，那些日子，一向就是如此。偶爾抬頭望向窗外，也仍是無邊的青山。紅塵裡的憂傷、爭執、憤怒等等彷彿很遠。這是我休息、回首端詳自己的地方。\n\
    \    最後，我甚至於搬來花蓮這個太魯閣的居住地了。\n(陳列 我的太魯閣)\n請依據前述文章回答下列問題:"
