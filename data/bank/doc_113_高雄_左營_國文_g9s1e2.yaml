  stem: 下列文句「 」中的詞語，何者運用不當?
  options:
  - label: A
    content: 台上老師滔滔不絕，台下同學騷動喧譁，在這種「一傅眾咻」的情況下，教學實在難收成效
  - label: B
    content: 搭上關渡遊輪夜航航班，飽覽淡水河畔慵懶迷人的夜景，頗能享受「暗渡陳倉」的浪漫情懷
