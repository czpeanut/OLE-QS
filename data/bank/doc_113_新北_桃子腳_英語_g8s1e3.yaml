  page: 3
  stem: What is the main problem for girls in Afghanistan under the Taliban?
  options:
  - label: A
    content: They cannot find food.
  - label: B
    content: They cannot go to school.
  - label: C
    content: They cannot play games.
  - label: D
    content: They cannot leave their homes.
  group_stem: "Thank you for letting me talk about girls' education in Afghanistan.\n\
    Life is very hard for girls under the Taliban. They cannot go to school, and women\
    \ teachers cannot work. Many girls face danger and fear. Aaria, an 11-year-old\
    \ girl, wants to be a lawyer, but she is losing hope. Roshan, a mother of three,\
    \ was a teacher but lost her job a few months ago. Education is not just important;\
    \ it helps bring peace. When girls go to school, countries can recover from war\
    \ and avoid future problems.\n  I ask the U.N. Security Council to tell the Taliban\
    \ to let girls go to school and give more help to schools and refugees. One child,\
    \ one teacher, one pen, and one book can change the world. When girls can study,\
    \ the future is better for everyone.\n        peach 和平 recover 復原 avoid 避免 refugee\
    \ 難民 better 更好的"
  ai_answers:
    gemini: B
    qwen: B
  answer:
