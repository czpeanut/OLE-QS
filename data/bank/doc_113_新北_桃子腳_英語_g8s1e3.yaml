  stem: According to the reading, why is it hard to find food at 3 a.m. in France?
  options:
  - label: A
    content: Most people are sleeping at that time.
  - label: B
    content: Only McDonald’s might be open.
  - label: C
    content: Supermarkets only sell snacks at night.
  - label: D
    content: Only pizza is good for food delivery. delivery 外送
  group_stem: 'Lucia is a French student in Taiwan. She says most shops in France
    close at night, and at 3 a.m., it’s hard to find food. Supermarkets and stores
    are closed, and only McDonald’s might be open. Taiwan is very different. There
    are convenience stores everywhere, open all day and night. Lucia says they are
    very helpful. If you’re hungry, you can buy food. You can even print train tickets.

    Before coming to Taiwan, Lucia already knew about convenience stores. In France,
    many people watch videos about 7-Eleven in Japan and Korea. These stores sell
    rice balls, instant noodles, and cute snacks. Lucia was excited to visit her first
    7-Eleven in Taiwan. She took videos, sent them to her friends, and loved the cute
    packing and nice prices. At first, Lucia thought convenience stores were perfect.
    She bought food, drinks, and things for her new room. But after a few months,
    she realized convenience stores cost more than supermarkets. One night, after
    jogging in the park, Lucia was very thirsty. She bought water from 7-Eleven even
    though she had water at home. She thinks convenience stores make people spend
    more because they are always open and easy to find.

    Lucia believes convenience stores make people spend more money, and the products
    are not the best. Still, she knows she will miss them when she goes back to France.

     packaging 包裝 perfect 完美的 realize 了解 product 產品 best 最好的'
