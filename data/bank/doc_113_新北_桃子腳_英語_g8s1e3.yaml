  group_stem: 'Cellphones today are very different from those twenty years ago. In
    the early 2000s, we could only make calls and play simple games and take photos.
    Surfing the internet, using social media, and watching movies online were impossible.
    Thanks to smartphones, we can now do all of these things. We can even buy things
    without cash. But if someone steals your cellphone, they might get your personal
    information. To prevent this, always keep your cellphone where you can see it.
    Cellphones make life easier, but we must protect them from theft.

     prevent 預防 steal 偷 easier 較便利 theft 偷竊'
