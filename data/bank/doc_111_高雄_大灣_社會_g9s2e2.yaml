- id: doc_111_高雄_大灣_社會_g9s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 台灣毛豆外銷歐、美、日等近30 個國家，從2017 年起，連續4 年的外銷金額突破8000 萬美元，外銷數量將近4 萬公噸，其中8 成以上銷往日本，在日本市占率達47.5%，在日本幾乎每兩包毛豆，就有一包來自台灣。請問：臺灣毛豆外銷日本最有利的競爭條件為何？
  options:
  - label: A
    content: 產品價格便宜
  - label: B
    content: 高品質供貨
  - label: C
    content: 保存期限較長
  - label: D
    content: 日本關稅優惠。
- id: doc_111_高雄_大灣_社會_g9s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 隨著交通革新、國際貿易興盛，以及近年來環保與健康意識抬頭，現代的飲食與過去相較之下所具有的特點，下列敘述哪些正確？ (甲)出現環保素食、低碳飲食 (乙)加工食品的種類更多樣化
    (丙)食品加工後的賣相較差 (丁)食物供應地範圍更廣。
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 丙丁
  - label: C
    content: 甲乙丁
  - label: D
    content: 甲乙丙丁。
- id: doc_111_高雄_大灣_社會_g9s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '右表是臺灣有籽葡萄的進口國家與生產月分，為了延長有籽葡萄的供應期，7~10 月有籽葡萄的進口國家來自日本、美國，3~5 月來自澳洲，1~4 月來自南非，上述情況的主要原因為下列何者？


    | 國家 | 生產月份 |

    | --- | --- |

    | 澳洲 | 3~5 月 |

    | 南非 | 1~4 月 |

    | 日本 | 7~10 月 |

    | 美國 | 7~10 月 |'
  options:
  - label: A
    content: 南、北半球季節相反
  - label: B
    content: 受WTO 貿易規範影響
  - label: C
    content: 產地時區的不同
  - label: D
    content: 市場對產地的選擇偏好。
- id: doc_111_高雄_大灣_社會_g9s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 台灣農地規模小，生產成本過高，屬於小農結構，產量與產值無法與農業大國相比。臺灣農產品想提升在國際市場的知名度及外銷產值，可以透過下列何種方式？
  options:
  - label: A
    content: 推廣農夫市集
  - label: B
    content: 透過自產自銷
  - label: C
    content: 國際知名人士的代言
  - label: D
    content: 建構農產品外銷平臺。
- id: doc_111_高雄_大灣_社會_g9s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 高雄萬豪酒店向來非常關心環保議題，致力於減少對地球的污染。萬豪酒店的宴會餐廳，如果要打出「食物里程」，響應節能減碳的宣傳廣告。請問：下列哪一個食材的選用最能符合這個環保概念？
  options:
  - label: A
    content: 四川麻辣湯包
  - label: B
    content: 錫蘭檸檬紅茶
  - label: C
    content: 法國的葡萄酒
  - label: D
    content: 燕巢芭樂汁。
- id: doc_111_高雄_大灣_社會_g9s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 「冷鏈物流」是指利用控制溫度的供應鏈體系，從原物料供應、運送、配送至零售皆以保鮮為目的，可減少運送過程中農產品腐壞的風險。臺灣農業冷鏈技術的改良，對農民而言可獲得下列何種經濟效益？
  options:
  - label: A
    content: 增加種植面積
  - label: B
    content: 減少農藥使用
  - label: C
    content: 減少勞力投入
  - label: D
    content: 擴大運銷範圍。
- id: doc_111_高雄_大灣_社會_g9s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 臺灣自從西元2002年加入世界貿易組織（WTO）後，國外農產品進口量增加，衝擊在地小農，為因應這種狀況，未來最適合的農業發展方向為何？
  options:
  - label: A
    content: 粗放經營，降低生產成本
  - label: B
    content: 種植高經濟價值農作物
  - label: C
    content: 推動機械耕作，增加農產量
  - label: D
    content: 開闢山林，增加耕地面積。
- id: doc_111_高雄_大灣_社會_g9s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 清真認證（HALAL 認證）在阿拉伯語中是「守法的、禁止的」，所有用於生產清真認證的食品原料或設備都必頇遵照較高的清潔和衛生標準，進行加工、生產和包裝，在該認證規定，下列哪一項食材是被嚴格禁止加入料理之中？
  options:
  - label: A
    content: 豬肉
  - label: B
    content: 羊肉
  - label: C
    content: 雞肉
  - label: D
    content: 牛肉。
- id: doc_111_高雄_大灣_社會_g9s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 小美從網路獲得一些「產地到餐桌」的農村廚房體驗課程資訊，她準備前往參加。根據上述，小美參加的課程內容最可能為下列何者？
  options:
  - label: A
    content: 多元進口食材的介紹
  - label: B
    content: 在地食材手作料理
  - label: C
    content: 西式飲食文化
  - label: D
    content: 異國創意料理。
- id: doc_111_高雄_大灣_社會_g9s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 由日本傳入的「地產地消」運動，強調「在地生產、在地消費」，近年來，「地產地消」的概念在臺灣逐漸興起，鼓勵消費者購買國內農產品，可以縮短運輸距離與環保減碳外，還能確保農產品的新鮮度。下列關於「地產地消」的概念，哪些敘述正確？
    (甲)減少食物里程 (乙)參加在地農夫市集 (丙)降低農業生產成本 (丁)舉辦異國農產展覽。
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 丙丁
  - label: C
    content: 甲乙丙
  - label: D
    content: 甲乙丙丁。
- id: doc_111_高雄_大灣_社會_g9s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 下圖是每公斤食物生產過程排放的溫室氣體量統計圖。隨著環保意識的抬頭，注重環境的飲食文化漸為大眾所接受，希望可以避免造成對地球的負擔。下列哪些內容敘述正確？
    (甲)根莖類蔬菜產生的溫室氣體量最低 (乙)吃素碳排放量較少，對環境較無負擔 (丙)環保飲食的食材應避免使用牛肉 (丁)吃素可以變瘦，熱量較低。
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 丙丁
  - label: C
    content: 甲乙丙
  - label: D
    content: 甲乙丙丁。
  assets:
  - key: s1_12_f1
    kind: figure
    file: doc_111_高雄_大灣_社會_g9s2e2/s1_12_f1.png
- id: doc_111_高雄_大灣_社會_g9s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 臺灣政府鼓勵各地農業從事人員參加農夫市集，直接與消費者面對面接觸。請問：消費者在農夫市集購買農產品，有以下哪些好處？ (甲)增加食物里程 (乙)降低「碳足跡」
    (丙)減少食品安全的疑慮 (丁)減少批發商轉運的成本。
  options:
  - label: A
    content: 乙丙
  - label: B
    content: 丙丁
  - label: C
    content: 甲乙丁
  - label: D
    content: 乙丙丁。
- id: doc_111_高雄_大灣_社會_g9s2e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 充斥在加工食品與日用品中的棕櫚油，因為價格低、穩定性高，被大量用於包裝食品中，甚至連洗髮精、清潔劑、化妝品等日用品都含有棕櫚油。民眾只要到超市逛一圈，拿起一包包零食、餅乾、泡麵、冰淇淋，仔細看看成份，就不難發現原來棕櫚油無所不在。下列有關棕櫚油的生產，哪些敘述正確？(甲)大量生產棕櫚油會破壞雨林
    (乙)棕櫚油攝取過量會影響人體健康 (丙)種植棕櫚樹使得紅毛猩猩的數量增加 (丁)消費者購買棕櫚油永續認證標章的產品，可以保護環境。
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 丙丁
  - label: C
    content: 甲乙丁
  - label: D
    content: 甲乙丙丁。
- id: doc_111_高雄_大灣_社會_g9s2e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 隨著全球氣候變遷及人口數增加，為了避免糧食缺乏，科學家開始改造作物的基因。請問：推出基因改造作物的主要目的及帶來的影響，下列敘述哪些正確？(甲)現已證實「基因改造」作物對人體有害
    (乙)加劇氣候的變遷 (丙)增加作物對蟲害的抵抗力 (丁)提高作物產量。
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 丙丁
  - label: C
    content: 乙丙丁
  - label: D
    content: 甲丙丁。
- id: doc_111_高雄_大灣_社會_g9s2e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 下列哪些做法符合友善環境飲食，可以減少排放二氧化碳？ (甲)選擇在地、當季的食物 (乙)多吃蔬菜，少吃肉 (丙)選擇加工較少的食物 (丁)購買包裝精美的結婚禮盒。
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 丙丁
  - label: C
    content: 甲乙丙
  - label: D
    content: 甲乙丙丁。
- id: doc_111_高雄_大灣_社會_g9s2e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 現代農業發展與食品製造過程中，為了降低成本或提高售價，可能會使用一些不當的生產方法，造成食物含有對人體健康有害的物質，引起食安問題；或是因為食物里程變長，增加食安的風險。請問：我們可以透過哪些方式提高食物來源的安全性？
    (甲)選擇已開發國家的農產品 (乙)利用農夫市集選購食材 (丙)購買產銷履歷驗證的農產品 (丁)多吃基因改造或加工的食品。
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 丙丁
  - label: D
    content: 甲丁。
- id: doc_111_高雄_大灣_社會_g9s2e2_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 1970 年代初期，中東爆發戰爭，沙烏地阿拉伯領導主要石油輸出國發動石油禁運，報復支持以色列的西方國家，石油價格因此在短期內大漲，造成全球性的經濟危機。當時臺灣推動下列哪一項措施，降低了此危機對國內經濟的衝擊？
  options:
  - label: A
    content: 加入世界貿易組織
  - label: B
    content: 設立科學園區
  - label: C
    content: 實施十大建設
  - label: D
    content: 推行土地改革。
- id: doc_111_高雄_大灣_社會_g9s2e2_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 義大利和德國都在一次大戰後展開極權統治，除此之外，當時兩國還有下列哪個共同點？
  options:
  - label: A
    content: 都是一戰的戰勝國
  - label: B
    content: 都以反共為主張
  - label: C
    content: 兩國領袖都以政變取得政權
  - label: D
    content: 皆推行計畫經濟來促進國防發展。
- id: doc_111_高雄_大灣_社會_g9s2e2_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 「1930 年代，美國遭逢經濟危機，當時羅斯福政府受經濟學者凱因斯的理論影響，推動相關方案，以紓緩國內困境。」上述方案最可能是下列何者？
  options:
  - label: A
    content: 提高關稅，以保護本國產業
  - label: B
    content: 擴張殖民地，取得重要資源
  - label: C
    content: 企業收歸國營，實施共產主義
  - label: D
    content: 推展公共建設，以消費刺激經濟。
- id: doc_111_高雄_大灣_社會_g9s2e2_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 某一時期，德國人宣稱「我們的未來在海上」、俄國人揚言「保衛斯拉夫兄弟」。這些聳動的口號與行動，最後導致哪個戰爭？
  options:
  - label: A
    content: 德法戰爭
  - label: B
    content: 一戰
  - label: C
    content: 二戰
  - label: D
    content: 冷戰。
- id: doc_111_高雄_大灣_社會_g9s2e2_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: (甲)德軍進攻波蘭 (乙)盧溝橋事變 (丙)諾曼第登陸 (丁)日軍偷襲珍珠港。小雅將上列與第二次世界大戰有關的史事，依發生先後順序排列，下列何者正確？
  options:
  - label: A
    content: 甲乙丙丁
  - label: B
    content: 乙丁丙甲
  - label: C
    content: 乙甲丁丙
  - label: D
    content: 丙乙甲丁。
- id: doc_111_高雄_大灣_社會_g9s2e2_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: 小廷的歷史報告以第二次世界大戰的始末為主題，下列哪一項敘述與史實不符合？
  options:
  - label: A
    content: 姑息主義是促成戰爭爆發的原因之一
  - label: B
    content: 盧溝橋事變爆發，中、美、英、蘇同盟國對抗軸心國的局面正式形成
  - label: C
    content: 美國參戰後大力援助盟軍
  - label: D
    content: 日本是軸心國最後投降的國家。
- id: doc_111_高雄_大灣_社會_g9s2e2_s1_24
  section: 1
  number: 24
  type: single
  page: 2
  stem: 卡爾斯基是「冷戰」時期蘇聯的情報員，那麼他最不可能奉派執行下列何種任務？
  options:
  - label: A
    content: 顛覆古巴政權
  - label: B
    content: 蒐集越戰資料
  - label: C
    content: 破壞北約組織活動
  - label: D
    content: 封鎖西柏林交通。
- id: doc_111_高雄_大灣_社會_g9s2e2_s1_25
  section: 1
  number: 25
  type: single
  page: 2
  stem: 一位政治人物為掌握政權，曾許諾「給農民以土地，給國家以和平，給飢民以麵包！」他號召民眾推翻舊政府，試圖建立一個新的政府。當革命成功，土地重新分配了。一年後，他卻要求農民們把農產品交給新政府，命令「紅軍士兵們挨村尋找那些最差的、最懶的、最奸猾的農民，給他們權力，讓這些精心挑選的人去沒收他們鄰居的『餘糧』。」根據上文，下列描述何者正確？
  options:
  - label: A
    content: 政治人物是指史達林
  - label: B
    content: 文中的革命指十月革命
