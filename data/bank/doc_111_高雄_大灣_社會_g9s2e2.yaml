  stem: 下表1-3-1 和1-3-2 分別是臺灣前五名外銷和進口水果統計表，下列有關臺灣進出口水果的描述，哪些敘述正確？ (甲)主要進口國家來自南、北半球
    (乙)主要出口國家多在北半球 (丙)出口以溫帶水果為主 (丁)進口以熱帶水果為主。
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 丙丁
  - label: C
    content: 甲乙丙
  - label: D
    content: 甲乙丙丁。
