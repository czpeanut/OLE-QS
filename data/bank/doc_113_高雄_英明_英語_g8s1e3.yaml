  section: 3
  number: 39
  type: single
  page: 4
  stem: 39. What is the difference in the sound of “r” between American and British
    English?
  options:
  - label: A
    content: Americans do not say it at all.
  - label: B
    content: Americans say it softer, but not the British.
  - label: C
    content: Americans say it more, but the British don’t.
  - label: D
    content: Americans and the British say it the same way.
  group_stem: 'People speak English in many places around the world, and there are
    two types: American English and British English. Even though they look similar,
    they are a little different in some important ways.

    Americans often say the “r” sound more. The British say it not as much or not
    at all. They also say some words and vowels in different ways. For example, in
    America, they might say "car" with a strong “r” sound, but in the UK, they might
    say it softer or leave out the “r”.

    Another difference is in the words they use. Many words are totally different,
    like “elevator” (American) and “lift” (British), or “apartment” (American) and
    “flat” (British). Some words have the same name but mean different things. For
    example, “football” in America is a sport with hands, but in the UK, it''s a game
    with feet. The British call what Americans call soccer “football.” On the other
    hand, the words “sweater” (American) and “jumper” (British) mean the same thing,
    a warm and soft piece of clothing, but people use different words in each place.

    American and British English have differences in how people say things and the
    words they use. These differences grew over time. Knowing them helps with talking
    and understanding both types of English.

