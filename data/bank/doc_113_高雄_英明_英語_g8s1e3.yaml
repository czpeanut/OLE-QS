  section: 3
  number: 37
  type: single
  page: 4
  stem: 37. Which is true about recycling clothes in Taiwan from the reading?
  options:
  - label: A
    content: Some companies run recycling clothes business in Taiwan.
  - label: B
    content: We can buy recycling clothes from Taiwan in Japan.
  - label: C
    content: Now the recycling business in Taiwan is easy.
  - label: D
    content: People throw away most new clothes in Taiwan.
  group_stem: 'Circular Fashion

    Thanks to fast fashion, we spend much money on new clothes. Then we put around
    20% of them in the closet, and we even never wear them. In Taiwan, some companies
    run the business of recycling old clothes. They sold them to Africa or some poor
    countries in old days, but now people there don’t buy that kind of clothes very
    often. Most recycling clothes are in garbage truck in the end.

    People throw away over two hundred million pieces of old clothes in a year in
    Taiwan. For our environment, some people in Taiwan stop following fast fashion.
    They get into another way: circular fashion. It’s about recycling, reusing, and
    remaking clothes. Circular fashion is becoming some businesses about renting new
    clothes, reselling second-hand clothes, and even upcycling old clothes. There
    are some websites about them, like ”Amazing Cloudset” and “SistaCloset” for renting,
    and “Lablaco” for exchanging.

    Circular fashion gives us some ways to save our money and stop hurting the environment,
    but we can still dress in fashion at the same time. Time to tidy up your closet
    and get into circular fashion.

