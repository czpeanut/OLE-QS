- id: doc_113_高雄_英明_英語_g8s1e3_s3_48
  section: 3
  number: 48
  type: single
  page: 8
  stem: 48. From the email, if Ms. Tsai and her husband choose to stay at Bright Hotel
    and eat breakfast on Day 2 and Day 3. How much do they have to pay?
  options:
  - label: A
    content: NT$15000.
  - label: B
    content: NT$15700.
  - label: C
    content: NT$16400.
  - label: D
    content: NT$22500.
  group_stem: 'Date: 3 April 2020

    From: amanda.chou@gtc.com

    To: lisa.tsai@gmail.com

    Subject: Sydney package tour


    Dear Ms. Tsai:

    Thank you for your e-mail asking about our Sydney package tour. For Sydney, our
    company has a three-night / four-day tour that should meet your and your husband''s
    needs perfectly. I hope the following will answer the questions in your e-mail.
    I look forward to hearing from you.

    The price of the tour is in the table below for 2 people.


    (A.) A night for 5000 NTD with taxes if you choose Bright Hotel with a double
    room.

    If you want breakfast, you have to pay another 350 for each person.

    (B.) A night for 7500 NTD with taxes if you choose Flora Hotel with a double room.

    The money already covered breakfast for two people.


    Both prices will cover these with no extra money:

    • Tickets for the cable cars of Blue Mountain National Park

    • Professional English and Chinese tour guide

    • meals mentioned in the table below.


    Here is the plan for each day of the tour.


    Day1

    Your tour guide will meet you at the airport when your flight lands. He and a
    driver will take you to the hotel. You will have the rest of the free day to take
    a rest or visit wherever you want.

    Meals: No. Please serve yourselves.


    Day2

    Our tour bus will take you to the Sydney Opera House in the morning. You can take
    a round-trip ferry ride for 200 NTD. Next, you can go to Darling Harbour and China
    Town by our tour bus.

    Meals: Lunch.


    Day3

    You will take our tour bus to Blue Mountain National Park. And you can take all
    the cable cars here for no extra tickets fee. Here, you can enjoy Three Sisters
    and the Echo Point.

    Meals: Lunch.


    Day 4

    After visiting the Sydney Tower at 12, you can enjoy your free time shopping in
    the Queen Victoria''s Building for 3 hours. And then we will drive you back to
    take your luggage and go to the airport. Your flight will take off at 7.

    Meals: No. Please serve yourselves.


    Best regards,

    Amada Chou

    Dragon Tours Inc.


     package tour 套裝旅遊行程 meet 符合 following 下列 perfectly 完美地 look forward to hearing
    from you 期待您的來信 tax 稅 extra 額外的  tour guide 導遊 mentioned 提及的 land 降落  serve yourself
    自理 cable car 纜車 luggage 行李'
