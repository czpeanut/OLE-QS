- id: doc_113_台南_民德_社會_地理_g9s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 「甲地位於(158°W,21°N)附近，面積16705 平方公里，最高山Mauna kea 海拔4205 公尺，為世界少有的幾個可以近距離觀察活火山的地點。甲地是全世界擁有最多瀕危物種的地方，也是美國唯一生產咖啡具有商業規模的州。」依據上文所述，下列何者正確?
  options:
  - label: A
    content: 甲地位於第三島鏈，戰略地位重要
  - label: B
    content: 甲地進行跨年倒數計時活動較台灣更早
  - label: C
    content: 甲地原住民屬於大洋洲美拉尼西亞人種
  - label: D
    content: 鴨嘴獸、鴯鶓為甲地特有種生物。
