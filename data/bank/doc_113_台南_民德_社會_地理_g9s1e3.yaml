  stem: 小胖參加旅行社的套裝行程「紐西蘭庫克山塔斯曼冰川探險半日遊」，搭乘觀光直升機從空中俯瞰壯麗冰川景緻，並由經驗豐富的導遊帶領徒步探索冰川。庫克山頂部有大量積雪（雪線僅1070
    米），以巨大冰川著名，最大的塔斯曼冰川長約30 公里，平均寬2公里，景色壯觀。請問:右圖為紐西蘭簡圖，小胖應是前往右圖中哪一處觀光旅遊?
