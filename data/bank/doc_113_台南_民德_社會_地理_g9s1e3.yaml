  stem: 「無尾熊屬於有袋目無尾熊科，僅分布於澳洲的尤加利樹森林中。無尾熊為樹棲動物，大多數時間都待在樹上，就連睡覺也不例外，它的尾巴已經退化成一個座墊， 因而能長時間舒適地坐在樹上。」請問:依據上文所述，無尾熊的分布地區應是位於右圖中哪一地點?
  options:
  - label: A
    content: 甲
  - label: B
