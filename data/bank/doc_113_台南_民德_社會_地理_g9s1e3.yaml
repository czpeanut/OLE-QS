- id: doc_113_台南_民德_社會_地理_g9s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 「根據學者研究，台灣以及同為南島語族的太平洋島國斐濟、東加等地的原住民族，都有以構樹作為材料，製作樹皮布的傳統。台灣構樹都是結種子再生，但是太平洋構樹只有一種性別，必須透過人工繁殖，且太平洋構樹基因，都同時擁有臺灣構樹的特有基因。」請問：上述文章主要傳達下列哪一項訊息？
  options:
  - label: A
    content: 台灣位於南島語族分布地區的中心點
  - label: B
    content: 台灣構樹起源自太平洋島國
  - label: C
    content: 台灣可能為南島語族起源地
  - label: D
    content: 台灣構樹為台灣特有種植物。
