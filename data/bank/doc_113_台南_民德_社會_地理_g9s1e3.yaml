  type: single
  page: 1
  stem: 「12 月17 日南太平洋島國萬那杜發生規模7.3 強震，導致萬那杜當地通訊中斷，許多民宅陷入一片漆黑，就連政府官網也處於癱瘓狀態。目前已知至少14
    人死亡、200 多人受傷。政府宣布進入緊急狀態。前中央氣象局地震測報中心主任郭鎧紋表示，全球已1200 多天沒發生規模8 以上地震，加上太平洋板塊開始活躍，2025
    年需特別關注地震狀態。」請問:下列哪一地與萬那杜「並非」位於同一地震帶上，相關災害產生機率較低?
  options:
  - label: A
    content: 澳洲
  - label: B
    content: 紐西蘭
  - label: C
    content: 智利
  - label: D
    content: 菲律賓。
