- id: doc_113_台南_民德_社會_地理_g9s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 「紐西蘭原住民毛利人，屬於南島語族    人種。毛利人的語言、文化及傳統建築與臺灣原住民阿美族很類似，文化上有許多共通點。毛利人的祖先戰爭前會先跳一種挑戰威脅的舞哈卡（Haka）。這個哈卡的目的是表示他們的勇士要開始宣戰或把敵人嚇怕和趕走。」請問：上文    中，應填入下列哪一選項？
  options:
  - label: A
    content: 澳大利亞
  - label: B
    content: 密克羅尼西亞
  - label: C
    content: 美拉尼西亞
  - label: D
    content: 玻里尼西亞。
