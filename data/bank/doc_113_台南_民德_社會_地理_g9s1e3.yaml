- id: doc_113_台南_民德_社會_地理_g9s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 位於大洋洲的吐瓦魯面積僅有26 平方公里，海拔最高也僅有4 公尺，總理戴斐立說：「吐瓦魯生計遭到損毀、家庭逐漸搬離、社區凝聚力遭到考驗、遺產消失了，最終我們國家結構受到越來越大的威脅。對我們許多人來說，這些都是我們今天經歷的殘酷現實，不是對未來的預測。」依據上文所述，吐瓦魯正面臨下列哪一項生存危機?
  options:
  - label: A
    content: 火山噴發產生有毒氣體
  - label: B
    content: 斷層陷落導致海水倒灌
  - label: C
    content: 溫室效應導致海水上升
  - label: D
    content: 夏季乾熱導致森林大火。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 地理
      code: 6-2
      title: 氣候變遷的衝擊
      chapter: 第6章 兩極地區與全球氣候變遷
    textbook: 九上地理 6-2 氣候變遷的衝擊
    labeled_by: ai
