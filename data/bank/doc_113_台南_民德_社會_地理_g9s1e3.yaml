- id: doc_113_台南_民德_社會_地理_g9s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 「帛琉位於大洋洲中的密克羅尼西亞。在帛琉，綠意盎然的樹海覆蓋大多數的島嶼，有黑檀木、孟加拉榕樹、麵包樹、椰子樹、露兜樹等。同時帛琉還有超過1,500
    種的多樣魚類、700 種的珊瑚和海葵。」依上文所述，帛琉應是屬於右圖中哪一種氣候類型?
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
