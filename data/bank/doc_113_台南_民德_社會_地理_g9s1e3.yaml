  stem: 1982 年，紐西蘭綿羊數量7200 萬頭，以當時人口計算，平均每人擁有22 隻綿羊。目前紐西蘭綿羊數量大幅減少至2500 萬頭，但仍遠高於全國總人口數500
    萬人。紐西蘭綿羊出口每年有30 億美元產值，就算羊兒變少，紐西蘭人仍對這塊產業深具信心。請問:紐西蘭畜牧業發達主要受下列哪一因素影響?
  options:
  - label: A
    content: 氣候乾旱不利產業發展
  - label: B
    content: 位置優越有利畜牧產品運銷國際市場
  - label: C
    content: 缺乏勞動力因此以粗放的畜牧業開發土地
  - label: D
    content: 受殖民地經濟影響工業技術落後。
