- id: doc_113_台南_民德_社會_地理_g9s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 右圖是世界知名的表演藝術中心，也是20 世紀知名的建築藝術代表。它有一系列看似貝殼狀的屋頂。事實上它們在構造上嚴格來說並不是「殼」，而是由肋骨狀預製混凝土構件支撐的嵌板。整個建築共有2194
    個這樣的嵌板，上面覆蓋著表面光滑的白色瓷磚，形成狀似貝殼的視覺效果。請問:此建築應是下列哪一座城市的知名地標?
  options:
  - label: A
    content: 巴黎
  - label: B
    content: 雪梨
  - label: C
    content: 奧克蘭
  - label: D
    content: 威靈頓。
