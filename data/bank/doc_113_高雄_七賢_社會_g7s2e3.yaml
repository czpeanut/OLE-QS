  - label: A
    content: 花花：「在桃園國際機場下飛機後，可以搭捷運到臺北，接著坐客運走國道3號到宜蘭。」
  - label: B
    content: 元元：「到宜蘭後，可以坐高速鐵路到花蓮，這樣速度最快！而且一定要體驗秀姑巒溪泛舟，超讚！」
  - label: C
    content: 平平：「接下來在花東地區應該租車走高速公路，這樣機動性最高，沿途想停留什麼景點都方便。」
  - label: D
    content: 真真：「再來就從臺東坐南迴鐵路穿越中央山脈到屏東枋寮，吃吃當地盛產的熱帶水果！」
