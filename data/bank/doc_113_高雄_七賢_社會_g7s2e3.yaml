  stem: 公平正義是維繫社會穩定的重要基石，但靠個人或民間團體的資源較無法改變根本性問題，也容易面臨財務困難與利益衝突；而政府作為國家中擁有最高權力的組織，有責全盤檢視、推動公平正義，民主國家的監督功能亦能促進政府施行相關政策的公正性。關於上文，下列敘述何者最適當？
