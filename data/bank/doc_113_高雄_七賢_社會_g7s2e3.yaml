- id: doc_113_高雄_七賢_社會_g7s2e3_s1_26
  section: 1
  number: 26
  type: single
  page: 3
  stem: 當時政府推動「文化清潔運動」，主要是利用黨、政、警的多方資源，來打擊紅、黃、黑三色的作品─「紅色」是共產主義的代表色，宣揚「紅色思想」的作家作品一律查禁。「黃色」是指內容淫穢的作品，只要有任何「傷風敗俗」的描寫，都在查禁名單之內。「黑色」則是報導政治內幕、破壞黨政形象的作品，亦為掃蕩的重點。這場運動表面上是清除這些「有毒作品」，實際上是當時的政府為了掃除文壇與當局相左的聲音，而這使得當時的作家與出版社心生恐懼，深怕無端遭受懲處。請問：這場「文化清潔運動」最可能在何時推動？
