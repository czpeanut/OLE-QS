- id: doc_113_高雄_七賢_社會_g7s2e3_s1_30
  section: 1
  number: 30
  type: single
  page: 4
  stem: '桑甚之收集以下四則資料來做為台灣不同階段文學發展的代表。請問：若依照其出現之先後順序排列，正確者應為？


    | 資料 | 內容 |

    | --- | --- |

    | 資料1 | 當地的名譽職，被錢新發佔了大半。公醫、協議會員、其他種種名譽的公務上，沒有一處會漏掉他的姓名。他率先躬行，當局也信任他。國語家庭，改姓名，也以他為首。
    |

    | 資料2 | 共產黨雖然蓬勃一時，然而終必轉瞬即逝，消滅得無蹤無影，變成歷史的陳跡。我們此時固然自以為身當大難，但從整個人類演進的過程來看，共產黨的興起祇是順流中偶然激起的一個回漩而已。
    |

    | 資料3 | 水盛把太太買藥的錢拿去賭輸，最後沒錢買藥，只好跑到漁船旁扶著漁船嘆息、感傷，旁邊的廟在演戲，傳來『叮！咚！喳！』的聲響，水盛心裡想到的卻是『情！痛！慘！』
    |

    | 資料4 | 從生番到山地同胞，我們的姓名，漸漸地被遺忘在臺灣史的角落…如果有一天，我們拒絕在歷史裡流浪，請先記下我們的神話與傳統，如果有一天，我們要停止在自己的土地上流浪，請先恢復我們的姓名與尊嚴。
    |'
  options:
  - label: A
    content: 資料1→資料2→資料3→資料4
  - label: B
    content: 資料1→資料3→資料2→資料4
  - label: C
    content: 資料4→資料1→資料2→資料3
  - label: D
    content: 資料4→資料3→資料2→資料1
