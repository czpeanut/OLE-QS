  stem: '◎這天大帥百八帶著一群學生出門來趟高雄雙軌歷史小旅行：

    第一站他們搭乘輕軌來到「凱旋中華站」，在步行前往當地有名的「銀座街」時，聽著當地耆老談起當時民國五十年代的前鎮吸引、匯集了南部各縣市鄉村的女性勞動人力前來從事紡織、製鞋等工作，而這些女工閒暇時，便喜歡到當時宿舍附近最熱鬧的「銀座街」逛逛，買衣服、做臉美容等，開啟了銀座街的繁華時光。請問：前鎮銀座街興起的背景應為？'
  options:
  - label: A
    content: 政府面臨國際能源危機衝擊下，努力發展基礎工業
  - label: B
    content: 政府為了吸引外資與技術，推動加工出口區的成立
  - label: C
    content: 面對產業環境的改變，政府重新發展勞力密集產業
  - label: D
    content: 政府想透過輕工業的發展來積極提高農業的生產量
  tags:
    chapter:
      publisher: 翰林
      book: 七下
