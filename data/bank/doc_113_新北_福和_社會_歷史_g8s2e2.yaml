  stem: 1966 年，北京一位中學生宋彬彬，因在天安門為毛主席戴上紅衛兵袖章而聲名大噪。毛主席問她的名字是否是「文質彬彬的彬」，並說：「要武嘛！」之後她改名為「宋要武」，學校也改為「紅色要武中學」。當時學生停課、貼大字報，紅衛兵組織席捲全國。根據這段描述，當時百姓生活情境中最可能出現的口號是：
  options:
