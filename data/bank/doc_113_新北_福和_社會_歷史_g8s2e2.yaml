  stem: 1950 年代，臺灣農村社會發生轉變，許多佃農開始擁有自己的土地，農業生產效率提高。不久之後，民間企業也開始發展手工業與加工出口。相對地，同一時期的中國，一些農民原擁有土地，卻被視為「階級敵人」，民間商號也遭收歸國有，許多人被迫放棄原有生計。根據上述情境，中國當時最可能實施的是哪一項經濟政策？
  options:
  - label: A
    content: 發展進口替代，積極提升農業產量
  - label: B
    content: 實施減租放領，減輕佃農經濟壓力
  - label: C
    content: 推動「大躍進」，強化農工業發展
  - label: D
    content: 沒收地主土地，民間企業收歸國有。
