  stem: 某位老紅軍回憶：「那時我們每日翻山越嶺，常常幾天吃不到一口糧，只能一起熬煮野菜、草根充飢，糧食用光的時候，甚至煮皮帶來吃。每到宿營地，全隊共用一口鍋、一張破布，吃飯、睡覺都擠在一起。雖然飢寒交迫，大家仍唱著革命歌，彼此鼓勵：『為了理想，再苦也要走下去。』」這段生活最可能發生於哪一段歷史事件？
