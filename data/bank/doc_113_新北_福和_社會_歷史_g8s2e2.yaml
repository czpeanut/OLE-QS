- id: doc_113_新北_福和_社會_歷史_g8s2e2_s1_18
  section: 1
  number: 18
  type: single
  page: 1
  stem: '表一為中國某時期交通建設的統計資料，從1927 年以後，無論是公路、鐵路或飛機航程皆大幅增加，呈現快速成長的趨勢。根據這項變化，最可能反映出當時政府的哪一項施政重點？


    | 表一 | 1921 年 | 1927 年 | 1929 年 | 1936 年 |

    | :--- | :--- | :--- | :--- | :--- |

    | 公路 | 1,000 公里 | 28,000 公里 | - | 110,000 公里 |

    | 鐵路 | - | 8,000 公里 | - | 12,000 公里 |

    | 飛機航程 | - | - | 56,000 英哩 | 2,290,000 英哩 |'
  options:
  - label: A
    content: 偏重物質建設，忽略思想改革與民族危機
  - label: B
    content: 民眾對現況不滿，轉向支持革命勢力崛起
  - label: C
    content: 提升國家實力，奠定日後對日長期抗戰的基礎
  - label: D
    content: 擴充基礎建設，突破外交困境與國際能源危機。
