- id: doc_113_新北_福和_社會_歷史_g8s2e2_s2_30
  section: 2
  number: 30
  type: single
  page: 2
  stem: 依據圖文內容，最符合下列哪一時期的教育方針？
  options:
  - label: A
    content: 日本明治維新提倡自由與文明開化，鼓勵探索與創新
  - label: B
    content: 一戰後日本為爭取國際認同，對台倡議內地延長原則
  - label: C
    content: 盛行軍國主義，灌輸對國家與最高領袖的無條件忠誠
  - label: D
    content: 滿州國以「王道樂土」理念為尊，強調絕對服從溥儀。
  group_stem: '◎回答第30 至31 題：

    【老師視角】

    我是昭和時代的教師，我的任務不只是教書，更是培養「正確信念」的使者。每天早晨，孩子們齊聲高舉手臂，這象徵他們對國家的忠誠。那天，當全班舉手敬禮，只有他低著頭不動。我知道他的父親因反戰遭捕，但我不能違背制度。我讓他座位上掛起那張紙條，那是我們這裡對「異見」的標籤。我不是沒良心，我只是活在一個不能動搖的體制裡的人。若我不服從，那就會輪到我成為那張椅子的下一個主角。

    【男孩視角】

    在這間教室裡，每個早晨都要向某種「象徵」致意，說是愛國，其實更像是壓力。當同學高舉右手敬禮，我選擇低頭沉默。爸爸因反對戰爭而被帶走，他教我思考，不盲從。今天，我沒有舉手，換來「不敬禮退學」的警告。我選擇記得父親，而不是順從旗幟。'
  shared_asset: g2_30_31
