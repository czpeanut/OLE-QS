  stem: 方宗英原為國防醫學院學生，當時校本部設於上海。隨著戰火擴大，政局動盪不安，學校為保存師資與教學設施，多次向南遷移。學生白天照常上課，晚上則需準備隨時撤離的行李。1949
    年底，學校進行全面撤離，方宗英與同儕搭乘軍用船艦抵達台灣，落腳台北水源地。根據當時的歷史背景判斷，此次遷移主要源自下列哪項事件？
