  stem: 印尼總統蘇卡諾年輕時，曾親眼目睹當地的資源與勞力在不到一年的時間內被「某國」大規模徵用。戰爭期間，他與其他東南亞青年被送往該國，接受教育與技術訓練，以培養協助掠奪東南亞資源的專業人才。戰爭結束後，部分留學生返回家鄉，有人成為反殖民運動的推動者，有人則在各行各業發展，成為社會中的重要菁英。「某國」應指哪個國家？
