  stem: 一位中學老師回憶：「有學生說我講過莎士比亞是人類的財富，就將我定為『崇洋媚外』。他們讓我下跪、唾我口水，還逼我承認父親是地主。牆上貼滿大字報，寫著『打倒牛鬼蛇神！砸爛舊世界！』。」許多古書、字畫、佛像與歷代建築都遭焚毀，一切非「革命」的象徵都被列為打擊目標。根據描述，當時的中國應是發生了什麼事情？
  options:
  - label: A
    content: 列強多次侵略中國，激起人民扶清滅洋情緒
  - label: B
    content: 太平洋戰爭期間，民間掀起抵制美國行動
  - label: C
    content: 鼓動民眾批鬥傳統價值，高倡破四舊立四新
  - label: D
    content: 擁護德先生與賽先生，打倒舊思想與舊制度。
