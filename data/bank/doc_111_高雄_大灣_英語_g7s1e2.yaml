- id: doc_111_高雄_大灣_英語_g7s1e2_s5_4
  section: 5
  number: 4
  type: single
  page: 3
  stem: Who are “both of them”?
  options:
  - label: A
    content: Molly and Karen.
  - label: B
    content: Dad and Tim.
  - label: C
    content: Karen and Grandma.
  - label: D
    content: Tim and Karen.
  group_stem: '(二)

    Molly：Where are my books?

    Dad：Ask your brother, Tim.  I saw him reading them in his bedroom.  I also saw
    Karen take away some books in the living room.

    Molly：OK, I will go ask both of them.  Thanks, Dad.

    ------------------------------------------------------

    Molly：Tim, did you take away my books?

    Tim：Yes, they should be on the sofa next to the TV.

    Molly：No, they aren’t.  OK, I will go ask Karen.

    ------------------------------------------------------

    Molly：Karen, did you take away my books?

    Karen：I did take away some books, but they’re not your books.  They are my books.

    Molly：Then, where are my books?

    Karen：Ha!  See?  Grandma is reading them in the front of the house.

    📖 ask 問  saw 看（see 的過去式）  also 也  take away 拿走  will 將會  should 應該'
  tags:
    textbook: 第一冊（七上）第2次段考範圍
    labeled_by: ai
