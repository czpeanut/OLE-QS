- id: doc_113_高雄_楠梓_國文_g7s2e2_s2_30
  section: 2
  number: 30
  type: single
  page: 5
  stem: 根據內容，本文主旨應為下列何者？
  options:
  - label: A
    content: 只有深入山林，才能發現自己的渺小與無知
  - label: B
    content: 以有情眼光，領略山岳之美與其豐富的內涵
  - label: C
    content: 山裡樹種繁多，樹都像人一樣，具有個性
  - label: D
    content: 憑多年登山經驗，告訴世人山是不可挑戰的
  group_stem: '(二)

    我是常常去讀山的，遠遠的讀其蒼茫，近近的讀其清幽；粗讀其豪放，細讀其深沉。

    讀青，讀綠，讀和諧，讀靜謐。

    我常常去讀那些嶙峋崢嶸的巉巖；讀它們的容顏，讀它們的生活，讀它們的風貌，讀它們的歷史。讀它們是用一種什麼樣子的步子走出了洪荒；讀它們是以一種什麼樣子的姿態去承受億萬年的風風雨雨。然後，我也去讀它們的威武，也去讀它們的溫順。讀它們為什麼會耐得住永恆的寂寞，為什麼會耐得住永恆的蹲坐；讀它們為什麼會有那麼好的氣度，可以容忍一些錯綜的根鬚在它們的身邊作蠻橫的盤纏。

    茂密的林木，在山中凝聚起了片片的青翠，形成了這些豐厚卷冊中的美麗的篇章，我就這樣靜靜的讀著它們：

    讀那些嫩芽如何成長，如何茁壯，如何把一些枝椏交給了它們的子孫，然後，它們又如何回到泥土中。

    讀一條細長的根鬚，如何穿過一段泥土，然後在另外的一個石隙中鑽出頭來，成長起另外一個新的生命。

    讀一根瘦弱的樹枝，如何自陰暗的一角伸出手來採摘陽光，然後去營養自己，去健壯自己。

    山林的本身就是一個豐富的世界，在這裡可以覓得一切。有一天，當我正在讀那棵爬藤如何借著一株枯樹而站了起來的時候，便驟然發現了那棵枯樹的笑顏，我已經意會出來，它是因為那棵爬藤為它裝飾了綠意而笑的。又有一天，當我正在讀著另外的一灘濃綠時，發現到一條蜿蜒的小徑，非常自在的自我的身旁伸向了山巔，我想，誰是這條小徑的母親呢？會選擇在這樣的一個山野中踩下了他的第一個步子？像這麼一條瘦小的小徑，為什麼可以負荷得了那麼多腳步的踐踏呢？

    這樣的山野並不純然是靜謐的，可以讀到吱吱喳喳的蟲叫，也可以讀到啁啁啾啾的鳥鳴。有時候，在一堆非常繁茂的草叢裡，還可以發現到昆蟲世界中的小小的戰爭。

    在讀山的時候，也會讀到一些偶發的事件。就像那年春天，當我正在初讀一片新鮮的山林時，聽到喊聲自四面八方響了起來，並且，在喧囂中還隱隱約約聽到一些殺殺砍砍的聲音，我便立刻盤登山巔，舉目遠眺，噢！看到了，山腳下，一群群勇壯的嫩芽，正在追攆著一個敗陣的冬天。

    山是一部豐厚的卷冊，怎樣讀也讀不完它，讀了巉巖再讀山林，還有那些挺聳的峰呢？還有那些深幽的谷呢？

    我是一個讀山的人，但是我知道，有時候人家也會讀我的，當我就像是一個短短的句子般的投向山林時。

    張騰蛟 讀山'
