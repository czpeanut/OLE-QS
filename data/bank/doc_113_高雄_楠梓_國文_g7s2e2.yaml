- id: doc_113_高雄_楠梓_國文_g7s2e2_s1_17
  section: 1
  number: 17
  type: single
  page: 3
  stem: '(甲) 我繼續攀行，越爬越興奮，要見竹林的心情也更加迫切，步伐也不斷地加快。「啊，竹！」我不由得驚叫起來。是的，還是兒時熟悉的那片竹林！「竹子搖，你莫長，讓我長，我長大了一樣高。」童年的歌謠幾乎是脫口而出。兒時在竹林中挑選最大的竹子，一邊搖一邊唱的場景也一一呈現。

    (乙) 最難忘是夏天的竹林。嫩筍陸續長高了許多，逐漸變成了挺拔秀麗、修長纖細的竹枝，像亭亭玉立的少女，你挨著我，我挨著你，相互扶攜。「新竹高於舊竹枝，全憑老幹為扶持。」夏天的夜晚，爸爸媽媽忙完了一天的農活，囫圇吞棗地吃完晚飯，就帶著我們到屋後的竹林邊乘涼。

    有關上述兩篇短文的比較，下列敘述何者正確？'
  options:
  - label: A
    content: (甲)的情感細膩婉約，用柔和文字營造溫馨氛圍
  - label: B
    content: (乙)強調竹子的自然美，並展現了家人在竹林中共享的生活點滴
  - label: C
    content: 兩者皆引用歌謠，喚醒讀者對童年美好回憶
  - label: D
    content: 兩者皆使用譬喻法來描寫竹子之美
