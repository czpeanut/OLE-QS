    content: 以「囓指痛心」，批評曾子愚孝
  - label: C
    content: 以「負薪以歸」，表現曾子「負荊請罪」的決心
  - label: D
    content: 藉由母子心靈感應，顯現曾子的孝心
  group_stem: '(四) 嚙指痛心

    周 曾參字子輿。事母至孝。參嘗採薪山中，家有客至，母無措，望參不還，乃囓其指。參忽心痛，負薪以歸，跪問其故，母曰：「有客忽至，吾囓指以悟汝耳。」後人系詩頌之，詩曰：「母指方纔囓，兒心痛不禁。負薪歸未晚，骨肉至情深。」注：①囓：用牙齒咬東西。'
