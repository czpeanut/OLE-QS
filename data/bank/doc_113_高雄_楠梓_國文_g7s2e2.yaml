  type: single
  page: 3
  stem: 「詩中有畫，詩中亦有樂，究竟哪一樣的成分比較高呢？詩不能沒有意象，也不能沒有音調，兩者融為詩的感性，主題或內容賴此以傳。缺乏意象則詩盲，不成音調則詩啞，詩盲且詩啞，就不成其為詩了。」上述文字中透露了哪一種觀點？
  options:
  - label: A
    content: 強調詩歌寫作應以生活感性為主題
  - label: B
    content: 關於詩歌的必要條件眾人莫衷一是
  - label: C
    content: 詩歌寫作只需要具有意象即可
  - label: D
    content: 詩歌寫作意象與音調缺一不可
