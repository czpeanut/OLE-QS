- id: doc_113_高雄_楠梓_國文_g7s2e2_s1_22
  section: 1
  number: 22
  type: single
  page: 3
  stem: 「只不過它多半居於陪襯地位，充其量是舞臺上的小配角，在戲將落幕、菜臨上桌時方上陣，以蔥花或蔥絲的姿態驚鴻一瞥。然而你可別小覷這看似微不足道的青蔥，沒有它來畫龍點睛，紅燒牛肉麵、皮蛋豆腐和清蒸魚等多到不及細數的菜色，好像就失去該有的滋味。」上述文字是在說明青蔥的何種功用？
  options:
