  stem: 「遠在周朝，『炮豕(豬)』便是宮廷美食，被列為『八珍』之一。今日的燒豬，即淵源於此。但現在製作的過程已複雜得多，且愈演愈妙。根據禮記 內則的記載，當時所謂的『炮豕』有三個步驟，首先是將豬隻宰殺後，剖腹除去內臟，填入棗子等料，外用葦草包裹，並在葦外塗滿黏土，投入火中燒烤。等到外土燒乾後，敲去其殼，揩去皮上的薄膜；再將稻米磨成的粉調成糊狀，遍抹豬身，然後過油，鍋中的油須多，要蓋過豬隻。最後將煎燒已畢的豬和調味料，同置於小鼎中，再把小鼎放在大鑊隔水燉，水不能過鼎。如此以文火燒了三天三夜，才算大功告成。取出豬隻後，加醋和醬調味來吃。」（朱振藩
    全方位吃豬）小胖看了這段介紹文字，做了幾個摘要，其中有一個寫錯了，請問是哪一個呢？注：①炮：燒、烤
  options:
  - label: A
    content: 炮豕須以小火煮三天三夜後，才能食用
  - label: B
    content: 周朝的炮豕作法記錄在禮記 內則
  - label: C
    content: 炮豕要經過「炮→炸→燉」三道大手續
  - label: D
    content: 現代人吃的燒豬指的是周朝的「炮豕」
- id: doc_113_高雄_楠梓_國文_g7s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: '以下是阿慶整理的漢字書體特色表，不過他卻粗心大意地把部分書體特色抄錯了，請問是哪些書體有誤？


    | 書體 | 書體特色 |

    | :--- | :--- |

    | 甲骨文 | 文字線條細瘦，筆畫有稜有角。 |

    | 金文 | 字形線條粗肥，筆畫圓轉。 |

    | 大篆 | 字形結構工整，筆畫圓轉曲折。 |

    | 小篆 | 字形高長，左右對稱，轉折地方都寫成方折。 |

    | 隸書 | 字形比小篆方扁，筆畫圓轉多於方折，結構整齊。 |

    | 草書 | 將隸書筆畫簡省，而筆畫更加瀟灑奔放，字形更加變化繁多。 |

    | 楷書 | 筆畫平直勻稱，字體明晰方正。 |

    | 行書 | 兼具楷書的規矩與草書的流動。 |'
  options:
  - label: A
    content: 楷書、行書
  - label: B
    content: 小篆、隸書
  - label: C
    content: 隸書、草書
  - label: D
    content: 甲骨文、小篆
  uncertain_spans:
  - 內容與原卷文字層不符（吻合 77%）
