  page: 2
  stem: 佛教由古印度的釋迦牟尼在公元前6 世紀以前創建，與基督教和伊斯蘭教並列為世界三大宗教。「佛」是佛陀的簡稱，其意思是覺悟者，而「教」可以理解為宗教或教育，意為佛陀對大眾的一種普遍而傳承的教育。佛教一般注重人心靈的清淨和覺悟，佛教認為世界是遵循因果循環，只有達到覺悟，才能超越生死輪迴。釋迦牟尼涅槃後，佛教慢慢衍生了不同的部派，並向外傳播。請問：下列有關佛教發展與傳播的敘述，何者錯誤？
  options:
  - label: A
    content: 北傳佛教的傳播方向是由印度→中亞→中國→朝鮮、日本
  - label: B
    content: 南洋群島主要流行的佛教是南傳佛教
  - label: C
    content: 中國主要信仰的佛教是北傳佛教
  - label: D
    content: 南傳佛教傳播路線為印度→錫蘭→中南半島→中國。
