- id: doc_113_高雄_楠梓_社會_歷史_g9s1e2_s1_35
  section: 1
  number: 35
  type: single
  page: 2
  stem: 麥地奇家族是佛羅倫斯15 世紀至18 世紀中期在歐洲擁有強大勢力的名門望族。麥地奇是醫師起家，其財富、勢力和影響源於經商、從事羊毛加工和在毛紡同業公會中的活動。然而真正使麥地奇發達起來的是金融業務。麥地奇銀行是歐洲最強大的銀行之一。麥地奇家族以此為基礎，開始是銀行家，進而躋身於政治家、教士、貴族，逐步走上了佛羅倫斯，義大利乃至歐洲上流社會的巔峰。麥地奇家族的最重大的成就在於藝術和建築方面，在文藝復興時期起了很大的促進作用。請問：該家族發跡地－佛羅倫斯城的興盛和下列何者最有關係？
  options:
  - label: A
    content: 該地自古就是中世紀神學重鎮
  - label: B
    content: 該城是羅馬教皇的居住地
  - label: C
    content: 該城為阿拉伯人翻譯古希臘、羅馬典籍的基地
  - label: D
    content: 該城位於義大利半島，為東西交通貿易要道。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 歷史
      code: 4-1
      title: 文藝復興
      chapter: 第4章 近代歐洲與多元世界
