  stem: 大偉與小偉在學校聽完老師講述「宗教的歷史」相關內容，他們整理了幾件其中發生的重要事件。請問：下列哪些事件是基督教曾經歷過的？甲、與羅馬一神信仰產生衝突；乙、羅馬教會權力凌駕君主產生政教衝突；丙、成為中世紀西歐人民的生活重心；丁、曾經遭到羅馬政府的迫害。
