  options:
  - label: A
    content: 漢代方士煉靈丹、製妙藥的求仙方式易傷害人體，茶文化發達後便取而代之
  - label: B
    content: 唐代文人飲茶喝的是一種心境，與百姓喝茶喝味道不同
  - label: C
    content: 唐代喝茶並不再追求肉體長生不朽，而是一門提升心靈美學的藝術
  - label: D
    content: 古代許多人成功因喝茶而成仙，因此喝茶成仙亦成為現代人飲茶除養生外重要目的
  group_stem: "西元八世紀，陸羽《茶經》寫到：「茶者，南方之嘉木也。」成為第一部寫種茶、選茶、製茶和品茶等的「飲茶指南」。西元十六世紀，《茶經》由絲路從中國傳到歐洲，成為貴族的昂貴飲品，他們甚至將茶罐鎖在櫃子裡珍藏，只有自己擁有鑰匙。時至今日，茶與咖啡、可可並列世界前三大無酒精飲料，超過二十億人口飲用。\n\
    \    事實上，茶除了被當成飲品之外，還有藥理、解酒、佐餐、養生、祭祀、成仙等用途。咦，成仙？現代的養生專家常在書上、電視上佐以最新醫學研究成果，大談喝茶的養生之道—可以養顏美容、減肥、降血壓、降膽固醇、預防骨質疏鬆……。但大家可能不知道，古人早已撇開這些「平凡」的功效，喝茶成仙去啦！\n\
    \    漢代時，一群方士以先秦 老 莊思想為基礎，加上戰國時期以來的神仙方術形成我們熟知的道教，他們的目的就是追求長生不老、羽化成仙。為了達成這個終極目標，這群方士想出了煉靈丹、製妙藥的方法來幫助自己，這股風潮延燒至唐代都未能停息。但古人科學知識畢竟有限，常拿鉛、汞、金銀這些有毒性的礦石來煉丹，服食之後，輕則危害人體，重則一命嗚呼。後來隨著茶文化的發達，方士們發現茶的服食效果同其他草本藥餌一樣安全、成本也較低廉，茶因而開始受到重視。\n\
    \    茶被列為聖品可不是毫無根據，陸羽《茶經》便曾引南朝 壺居士所言：「苦茶，久食可羽化」；南朝文學家、醫學家，亦是道士的陶弘景在其《名醫別錄》說道：「茗茶輕身換骨，昔丹丘子，黃山君服之。」壺居士、丹丘子、黃山君三位是道士界的名人、名仙，他們既然為茶背書，勢必在界內引起追隨者、其他道士們的注意，掀起服食茶餌的流行了。\n\
    \    喝茶成仙的風潮到了唐代，有了不同於肉體長生不朽的新意涵。唐代飲茶文化盛行，茶館林立，唐代的百姓喝茶喝味道。唐代文人喝茶喝的是一種「feeling」，他們崇尚佛法，也談道家，當士大夫、僧侶、道士互相串門子，聊這些文青話題的時候不配茶多無聊！茶除了是聊天的好夥伴，更是文人口中一門能夠提升心靈的美學藝術。陸羽《茶經》系統化整理出從選茶葉、挑水源的前置作業，到煮茶方法、茶器欣賞使用都做了仔細的說明。最重要的是，他提出了當時文人喝茶所追求的事—哥喝的不是茶，是心境。如果說以前的道士飲茶是為了輔助自己的肉體羽化成仙，那麼唐代的文人飲茶為的是比肉體更高一層的境界，也就是「心境成仙」，達到道家所謂無為、自然的逍遙境界。而陸羽在《茶經．五之煮》告訴我們，藉喝茶修養心性的重點就在於煮茶過程中內心對自然的體會。若要當一個唐代品茗文青，下列兩個要點須注意：\n\
    1.聽沸水聲：陸羽將水沸的程度分三級：「微有聲，為一沸；邊緣如湧連珠，為二沸；騰波鼓浪，為三沸。」文青須細心聆聽，去分辨、感受聲音變化，方能領略其中妙趣。\n\
    2.賞茶湯：當沸水逐漸停止時，須靜觀茶湯變化，在心中想像、體會一幅自然景象。在此，陸羽提供了一些字詞形容，如：棗花、浮雲、積雪、青萍等。詩人白居易則寫過「沫下麴塵香，花浮魚眼沸」的文句，以花浮形容茶湯，魚眼形容沸水。\n\
    \    古人是否真的藉喝茶成仙，我們不得而知。但他們將茶帶入文學、藝術、思想之中，拓展、深化茶在文化中的角色，藉由煮茶過程中，靜觀茶湯幻變、體會心中投射的自然景象，不僅是美的感受，亦是新的享受！\n\
    \                                                                           （節錄自品學堂〈喝茶成仙〉）"
