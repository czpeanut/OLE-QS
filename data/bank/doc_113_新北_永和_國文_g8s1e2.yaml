  group_stem: "故宮特展皇帝的移動花園－清代宮廷花卉畫\n展期：2024/07/06〜2024/9/22\n地點：故宮北部院區第一展覽區202、204、206、210、212\n\
    國立故宮博物院7 月推出「皇帝的移動花園－清代宮廷花卉畫」特展，透過宮廷留下的花卉畫，讓我們一窺清代皇帝們的生活小樂趣。展覽主題說明如下：\n◆歲時安樂◆\n\
    \    清朝皇帝和皇室成員隨著季節變化在宮廷花園賞花，享受自然的輪替與和諧，象徵了風調雨順、天下安定的理想世界。\n◆塞外考察◆\n 康熙皇帝多次帶領文人北上長城外，體驗不同地域的自然環境，並將所見野花帶回宮中作為畫作題材，豐富了宮廷的藝術創作。\n\
    ◆花譜考據◆\n 康熙朝編纂的《廣群芳譜》可是當時的「花百科」，整理出花卉的異名、習性、品種、歷史典故及古人詩詞，而它也是皇帝和文人為花吟詩的最佳參考書。乾隆皇帝更是大秀詩才，邊看畫邊題詩，陶醉其中，堪稱「花中學者」！\n\
    ◆移根禁苑◆\n南方花卉隨貢船進京，甚至北方高山的花草也被移植至紫禁城，展示了宮廷培育各地花卉的技術與用心。\n◆曇花一現◆\n引進自西洋的「洋花」成為宮廷珍品，儘管難以在本土繁殖，卻經由宮廷畫家的筆觸，永留畫作中，成為歷史的美麗見證。\n\
    這場展覽帶我們穿越時空，走進清代皇帝的移動花園，體會他們對花卉的欣賞與生活的美學。\n                                  \
    \                            ──改寫自故宮博物院「參觀主題網站」\n◆參展畫作◆\n清代 蔣廷錫〈野菊〉\n絹本設色／軸／故畫002488\n\
    \    上方由康熙皇帝（1654-1722）親筆題詩〈乙酉秋日山莊偶成〉，作於康熙四十四年（1705 年）秋。畫中的菊花被認為是詩中提到的塞外野菊，推測為「翠菊」，根據《廣群芳譜》記載，這種菊花起源於元代\
    \ 內蒙古，至清代已在長城以北廣泛生長。\n    本幅畫作採用了「沒骨技法」，即不勾墨線而直接以色彩繪製。花卉略顯隨性自然，部分花朵甚至背對畫面，仿若壓扁的標本，可能是忠實再現採集後的真實狀態。\n\
    \n清代 余省〈繪姑洗昌辰〉\n紙本設色／軸／故畫003056\n「姑洗」對應農曆三月，畫作描繪了圓明園後湖東南角的景致。前方觀景臺為牡丹臺，後院為養素書屋。花園中栽種了各色牡丹與白玉蘭。乾隆九年（1744\
    \ 年）將此地命名為鏤月開雲。\n    圓明園是雍正皇帝（1678-1735）未登基前的居所，康熙六十一年（1722 年）三月，年幼的乾隆皇帝（1711-1799）於牡丹臺首次見到應邀來賞花的祖父康熙皇帝（1654-1722），因而有幸移居宮廷受教，故此地對乾隆皇帝意義深遠。"
