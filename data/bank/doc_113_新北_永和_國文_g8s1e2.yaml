- id: doc_113_新北_永和_國文_g8s1e2_s6_26
  section: 6
  number: 26
  type: single
  page: 4
  stem: 文中作者用「納骨塔」來譬喻圖書館，請問這可與〈我在圖書館的一天〉哪句話來作呼應？
  options:
  - label: A
    content: 圖書館美則美矣，書卻顯得寂寞
  - label: B
    content: 圖書館也可說是一間靈屋，因為收藏的都是不同年代的作者之書，而書即是作者的靈魂
  - label: C
    content: 哈佛圖書館藏有詩人艾蜜莉‧狄金生手稿與眾偉大作家手稿，且收藏有作家遺物
  - label: D
    content: 我總是在椅子與椅子間轉換我的靈魂，以攝取不同的知識
  group_stem: "寒假期間的圖書館，呈現一種難得的閒逸姿態。這一棟半圓形的八層樓建築，環壁皆書，中間留下跟應用坪數相等的半圓形空間。從五樓俯望，偌大的建築十分空洞。尤其在下著雨的黃昏，窗外的溼氣彷彿都滲透書頁，陰冷盤踞了多餘的空間，恍如進入一座潔淨、但森冷的納骨塔。整齊有序的書本，宛如一個個編號骨灰罈，罈子裡都裝載著作者的魂。也許讀書的心都冬眠去了，這些思考宇宙大道，辯解生命本質的沉重書魂，都顯得有些黯然。我和所有放假的學生一樣，並沒有閱讀的心情，也不想和它們招呼或交談。電梯上來，門空空的開了，然後又空空的關上。整個五樓只有我和我的影子，這些書魂一定十分納悶，造訪者除了找資料做報告，或是純為閱讀的樂趣之外，竟然還有一種像我這樣，是帶著懷舊心情來逛圖書館的。\n\
    \    圖書館也有令人無法忍受的時候。那是期末，每個人帶著焦慮進入圖書館這個密閉空間。在電腦鍵盤上搜尋書目的手必須快速而敏捷，因為後面通常還有等待使用的人，那種無聲的壓迫使人心慌。我寧願耗費時間去查書卡，也不想被傳染那種緊張。找書查資料的人即使交談，也刻意壓低聲量。只有書本被搬動的輕微聲響是合法的。待久了，我總覺得頭腦會不斷腫脹，總要適時地出去透透氣，讓頭腦冷卻，神經鬆弛。從對面的草坪望去，孤立在夜空的圖書館真的很像一座現代化納骨塔，居住在裡面的古今書魂，此刻正忙於應付川流的讀者，人與魂共處的擁擠空間，總令人感到不安的吧！\
    \                （節錄自鍾怡雯〈藏魂〉）"
  tags:
    chapter:
      publisher: 康軒
