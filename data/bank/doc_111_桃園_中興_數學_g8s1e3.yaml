  type: single
  page: 1
  stem: '下列是用配方法解 $4x^{2}+5x-3=0$ 的過程：

    第一步：$x^{2}+\frac{5}{4}x=\frac{3}{4}$；第二步：$x^{2}+\frac{5}{4}x+(\frac{5}{2})^{2}=\frac{3}{4}+(\frac{5}{2})^{2}$；

    第三步：$(x+\frac{5}{2})^{2}=\frac{28}{4}$；第四步：$x+\frac{5}{2}=\pm\sqrt{7}$ ∴$x=-\frac{5}{2}\pm\sqrt{7}$。找出哪一步開始發生錯誤？'
  options:
