  section: 1
  number: 4
  type: single
  page: 1
  stem: 「腦寮」為產製樟樹製品的聚落。樟樹分布在臺灣平地至海拔 1,800 公尺的區域，其生產的樟腦、樟油可除蟲病害與除臭芳香，木材則可當作建材、雕刻品之原物料。「腦」地名的空間分布，最可能是右方附圖的哪一張？
