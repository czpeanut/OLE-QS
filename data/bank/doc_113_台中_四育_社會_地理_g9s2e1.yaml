  stem: 「這個地區原名『錫口』，位於甲地形東北方，東南為丘陵地，周圍有四獸山、姆指山、筆架山等山峰綿亙；山麓有基隆河蜿蜒流過，原屬原住民平埔族遊獵捕魚的勝地，景色雄偉秀麗。『錫口』二字是臺語發音，即平埔族人之所稱之『河流彎曲之處』。」上述中提及的甲盆地所指為何？
