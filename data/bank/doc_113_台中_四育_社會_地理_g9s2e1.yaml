  stem: 基於不同的理由與考量，行政區名會經歷數次的更名，擁有多個名稱。舉屏東為例，屏東舊稱「阿猴」，是因在漢人來臺開墾前，屏東一帶是平埔族馬卡道族阿猴社的聚落所在而得名，直至日治時期，阿猴經日本人雅化地名改為「阿緱」，最後又因其位於半屏山以東而改名「屏東」，沿用至今。根據上文，由屏東地名的演變可知其經歷了數次更名，下列何者並非此地名曾用過的命名原則？
  options:
  - label: A
    content: 相對位置
  - label: B
    content: 雅化用字
  - label: C
    content: 歷史事件
  - label: D
    content: 原住民族
