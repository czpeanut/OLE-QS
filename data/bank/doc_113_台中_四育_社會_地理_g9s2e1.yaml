- id: doc_113_台中_四育_社會_地理_g9s2e1_s1_34
  section: 1
  number: 34
  type: single
  page: 4
  stem: 施琅因收服臺灣而獲得封地，此地為紀念此事，故借「施琅」為此地命名，請問此地最可能是下列何者？
  options:
  - label: A
    content: 國姓
  - label: B
    content: 延平
  - label: C
    content: 將軍
  - label: D
    content: 萬榮
  group_stem: '題組（二）34～36

    「OO」之名，傳由施琅OO 而來：清將施琅靖臺有功，清廷賜跑馬三日為世襲業地，由今OO 區西隅的馬沙溝登陸起跑，經史椰甲社（由今OO 區山仔腳）向東騁馳，不料至現在的OO
    庄時馬斷腳蹄，乃在此地建「OO 府」，所經之地的田園即為「施候租」，並建公館管理，最盛時期達十處；之後，施琅率施姓族人及吳王兩姓戚親入墾漚汪溪南岸一帶，而形成「OO
    庄」；道光年間後裔因居北京乃出售六處公租館，剩下四處置督墾管理，再至日據時代，日人以施家非日本國民，乃沒其大租而編入官租。

    傳說施琅在此設府後，將軍府大柱左右各掛施吳兩姓的大燈，每屆夜晚，吳姓大燈總是燦爛輝煌，施姓大燈則忽明忽暗，此後吳姓愈旺，而施姓漸衰，大舉北遷鹿港，只留一家與吳姓聯婚者，這也就是今天OO
    庄何以「施琅開庄，舉庄皆吳」的原因了。'
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 地理
      code: 1-2
      title: 行政區名的由來與演變
      chapter: 第1章 臺灣與行政區名
    textbook: 九下地理 1-2 行政區名的由來與演變
    labeled_by: ai
