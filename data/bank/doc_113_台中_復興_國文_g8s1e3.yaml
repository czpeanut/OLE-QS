  stem: 下列關於乙文的敘述，何者錯誤？
  options:
  - label: A
    content: 王藍田的父親每次發言，在座者都表示讚美肯定
  - label: B
    content: 王藍田因父親的緣故，被王丞相聘用，擔任佐吏
  - label: C
    content: 王藍田聚會時恭陪末座，獨排眾議說出了心中的真話
  - label: D
    content: 王丞相對王藍田的質疑表示肯定，顯現寬宏的器量。
  group_stem: '（五）

    | 甲文 | 乙文 | 丙文 |

    | :--- | :--- | :--- |

    | 　　王丞相辟王藍田為掾，庾公問丞相：「藍田何似？」王曰：「真獨①簡貴，不減父祖，然曠澹②處，故當不如爾。」<br>《世說新語・品藻》<br>【注釋】<br>①獨：指獨特，與眾不同。<br>②曠澹：曠達、不求名利。
    | 　　王藍田為人晚成，時人乃謂之痴；王丞相以其東海①子，辟為掾②。嘗集聚，王公每發言，眾人競贊之，述③於末座曰：「主非堯舜，何得事事皆是？」丞相甚相嘆賞。<br>《世說新語・賞譽》<br>【注釋】<br>①東海：東海太守，此指王藍田的父親王承。<br>②辟為掾：聘用他為佐吏。<br>③述：王藍田名王述。
    | 　　謝無奕性麤彊①，以事不相得，自往數②王藍田，肆言極罵③。王正色面壁不敢動。半日，謝去良久，轉頭問左右小吏曰：「去未？」答云：「已去。」然後復坐。時人嘆其性急而能有所容。<br>《世說新語・忿狷》<br>【注釋】<br>①麤彊：音ㄘㄨ
    ㄑㄧㄤˊ，「粗強」的古寫，此指粗暴強悍。<br>②數：音ㄕㄨˇ，責備。<br>③肆言極罵：極力責罵。 |'
