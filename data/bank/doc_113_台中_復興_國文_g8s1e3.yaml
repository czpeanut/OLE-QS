- id: doc_113_台中_復興_國文_g8s1e3_s2_43
  section: 2
  number: 43
  type: single
  page: 6
  stem: 根據本文，關於皇帝用餐的敘述，下列何者未提及？
  options:
  - label: A
    content: 用餐時間
  - label: B
    content: 用餐人數
  - label: C
    content: 用餐次數
  - label: D
    content: 用餐品項。
  group_stem: '（二）

    　　隨著清宮劇的熱播，劇中的琳瑯滿目的菜色，也使皇帝的御膳成為亮點，然而在清代的宮廷中，皇帝也是如同現代人一日三餐嗎？

    　　「餐制」，即是指一天吃多少頓正餐。在清代，南方的餐制多為三餐制，而北方則多為兩餐制。當時的宮廷是典型的北方生活，也是以兩餐制為主。據說康熙年間，有一年大旱，康熙帝以身作則，主動將宮廷內的餐制暫時改為一餐制以示節儉。後來清末的時候，宮裡通了電，宮廷進入近代生活，逐漸改兩餐制為近代三餐制。除了這兩段特殊時期之外，清代宮廷的大部分時間均是實行兩餐制的。

    　　根據清代制度，皇帝一日兩餐，分別稱之為「早膳」和「晚膳」。「早膳」在卯正二刻（6:30），「晚膳」在午正二刻（12:30）。但查閱《膳底檔》等清宮檔案可發現，實際上「早膳」和「晚膳」的時間是根據皇帝的需求和情況靈活調整的。一般來說，「早膳」是在五點到十一點之間，而「晚膳」是在十一點到十五點之間。

    　　看到這裡，想必有人會以為皇帝吃不飽，其實不用擔心。清代皇帝雖然只用「兩餐」，但是所謂的「餐」，必須是相當正式的一頓飯，其餘不正式的飲食則稱之為「點」。「餐」被限制為「兩餐」，而「點」卻是自由的。以執行「兩餐制」的時代而言，皇帝的每日飲食情況是這樣的：每天起床之後，先吃一頓「早點」，在處理一些政務之後，再吃一頓正餐，稱為「早膳」。午休之後，還可以傳一頓午點，下午則吃第二頓正餐，即是「晚膳」。如果這一天皇帝就寢比較晚，還可以傳一頓夜宵。所以這樣算來，皇帝一天中，「餐」雖然只有兩次，但是「點」卻有三次之多。而且根據需求，這個「點」還可以繼續增多。

    　　在清初的時候，清宮的飲食比較樸素。康熙帝曾經有過「不食兼味」的說法，指的是一餐之內只食用一種類型的主食材。比如說這頓飯吃豬肉，那麼就只吃豬肉的菜餚，不再吃雞肉、魚肉。到了乾隆朝初期，清宮飲食還相對樸素，每餐只有18品。這裡的「品」，是清宮記錄菜餚的量詞，和我們今天的「一道菜」的「道」類似。這18品，是包括了主食、醬菜和甜點的，所以應該說並不算太奢華。

    改寫自李舒《皇上吃什麼》'
