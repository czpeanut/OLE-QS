- id: doc_113_台中_復興_國文_g8s1e3_s2_45
  section: 2
  number: 45
  type: single
  page: 7
  stem: 下列情況，何者並非文中所謂的螃蟹效應？
  options:
  - label: A
    content: 亂丟垃圾的同學被翔翔提醒後，竟回嘴道：「反正老師也不會發現。」
  - label: B
    content: 言言考試100分，被考60分的哥兒們損道：「你有沒有良心啊！背棄兄弟。」
  - label: C
    content: 恩恩唸英文中，突然line電話響起，來電同學說：「念什麼書？來打傳說啦！」
  - label: D
    content: 哲哲線上上課，messenger跳出同學的訊息：「來聊天啦！反正老師不會知道。」
  group_stem: '（三）

    　　在師長眼中，沉迷於電玩手遊，應該是「青少年次文化」最罪無可逭的一項，因為那會吃掉最寶貴的學習時間，然而，上個月收到一封桃園高中學生的直白訊息，發覺這個議題有其複雜性：「在我剛上高中的時候，大家都對彼此不熟悉，而電玩是最快拉近彼此距離的方法，還能找出話題化解許多時候的尷尬，開學後沒多久，下課的時候讀書的會自動聚集在一區，打電動的又會聚集在另一區，對於像我這種不太會讀書的人來說，也許下載遊戲才是能使我融入大家的方式，因此剛開學我看同學玩什麼我就跟著玩什麼，從傳說、第五人格、荒野大亂鬥、Free
    fire、神魔之塔、乃至最近的極速領域，每一款我都玩，但只有在同學約著一起打的時候才玩，也許像我們這樣的人並不是沉迷於電玩，是沉迷於歸屬感。」

    　　「歸屬感」，講得太好了！這正是在尚未組織家庭之前，青春期的我，內心最大的渴望。我可以為這個「歸屬感」來一次快問快答！

    高中時期最快樂的事——和死黨鬼混。

    高中時期最痛苦的事——「孤單」或「被關係霸凌」。

    放學後最常做的事——和死黨一起衝進彈子房，或是冷飲店，開始言不及義，……

    哇！那實在是一生中最自由放鬆的時光。然而，有時候，我們放太鬆了。

    　　當大家都鬆到視學業為無物時，若誰的成績「不小心」衝太高，還會引起大夥兒的公幹：「齁，偷讀書。」或是「你有沒有一點江湖道義？」被公審的「犯人」還必須知趣的說聲：「歹勢，下次不敢了。」


    班級「螃蟹效應」是彼此往下拉

    　　現在回想起來，覺得我們當日的小屁孩行為，就像一堆螃蟹——「螃蟹效應」（Crab Bucket Syndrome）裡，不斷把同伴往下拉的螃蟹。這個效應描述的是：當我們用不加蓋的桶子裝螃蟹，一隻螃蟹很容易爬出來，但是，如果裡面多裝幾隻，就沒有一隻能爬得出來！為什麼呢？因為當一隻往上爬時，其餘的螃蟹就會七手八腳絆住牠，最終把牠拖到底下，然後另一隻螃蟹踩著牠向上爬，就這樣不斷上演，最後無一隻螃蟹能夠爬出桶子。

    　　我曾是那隻不斷拉扯夥伴的螃蟹。高三時，最常和我玩樂的死黨，突然不見蹤跡。找他繼續逍遙快活，他總說有事要先回家。聯考放榜後，他考上了政大，而我的分數，輸他整整有五十多分。「你那個時候成績也沒有我好，為什麼聯考贏我那麼多？」現在見面，我還是會挖苦他。「拜託，我考前幾個月很拚的！」其實，我很替他高興，高興他雖然誤交我這個損友，仍能靠自己的力量爬出桶子。

    　　然而，一生中，我們會掉到不同的桶子，到處是螃蟹，如果不努力，我們永遠會是桶底的那一隻。

    　　大學時，一樣沉迷於撞球、橋牌、甚至打八圈。大家都知道我最混，所以一下課就往我的房間鑽。往往牌一打，不打到雞鳴破曉，人是不會散的。

    　　大三的時候，許多人爬出了自己的桶子，而我，還沉迷在自己的桶子裡。後來才知道，那幾年，影響了我們一生。


    可以一起墮落，也可以一起上升的「共振效應」

    　　例如有同學當了外交官，原來是同寢室的兩個學長找他一起準備外交官考試，現在三個人都是高階外交官。還有其他同學，一起準備研究所，結果他們寢室四個人，現在都是教授。還有整寢準備考國中老師，他們都比我早了十幾年進入公職。原來，他們爬出玩樂的桶子後，進入正向的「共振效應」。

    爬出桶子，才能橫著走。

    　　其實「電玩手遊」本身沒錯，真正的錯，是我們找不到正確的同儕目標或活動，結果把這些遊戲當成一個爬不出的桶子，每天跟同伴擠在桶內，不願意爬出桶子，去踩踏真實的天地。

    　　我們是螃蟹沒錯，但當一隻螃蟹，就該爬出桶子，然後，沙灘無垠，隨便你，橫著走！

    （蔡淇華〈一則高中生的來訊「我不是沉迷電玩，是沉迷於歸屬感」〉）'
