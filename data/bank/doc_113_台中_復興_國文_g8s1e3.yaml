- id: doc_113_台中_復興_國文_g8s1e3_s2_47
  section: 2
  number: 47
  type: single
  page: 9
  stem: 根據上文內容，下列何者最適合作為本文標題？
  options:
  - label: A
    content: 〈你問的問題，決定你是誰〉
  - label: B
    content: 〈別人怎麼對你，都因為你說的話〉
  - label: C
    content: 〈不要因「自我感覺良好」，阻礙你發現問題的真相！〉
  - label: D
    content: 〈大器可以晚成：當世界沉迷年少得志，耐心是你成功的本事〉
  group_stem: '（四）

    　　段考結束，接到家長著急的電話：「老師，昨天發下成績單後，我看到慘不忍睹的成績，原本想找兒子好好談談。但沒想到他竟然對我大吼大叫，說他已經夠努力了，壓力很大，叫我不要再給他壓力了。」……

    　　隔天一大早，我把早自習就趴在桌上睡覺的學生找來。

    「這次段考你的表現不理想，你媽媽很擔心，說你在家嚷著壓力很大；而老師也很擔心，因為我看你常常精神不好，上課也常打瞌睡，不知道你平常作息如何？這次段考，準備狀況是怎麼樣呢？」

    「我每次段考都超認真準備，但每次都考不好，我覺得很生氣也很氣餒，這讓我越來越不想努力了。」

    「超認真準備？是怎樣的準備呢？」

    「段考前兩週我一定會去圖書館讀書，讀書的時候也一定會把手機收起來，不懂的也一定會去問老師。我自己認為該做的都已經做了，可是成績還是不理想。」

    「聽起來蠻認真的。那沒有段考的時候，每天回家有唸書嗎？」

    「我每週有三天要補習，從六點到九點，補習的那三天，回家後很累就不會讀書了。」

    「恩，我可以理解。那其他天的讀書時間是多少呢？」

    「呃……其他時候每天都讀十到二十分鐘的書，有時候可能沒讀書。」

    「啊！！！十分鐘！十分鐘可以讀到甚麼東西嗎？就算二十分鐘也不夠把一課看完吧？」

    ＊＊＊

    這樣的對話並不僅止於一名學生，意料之外的，這是近期訪談近十位學生後的結果。

    ㊣他們普遍有三種情況：

    一、平時幾乎不讀書，倘若有，也大概在半小時到一小時之間。

    二、小考幾乎不準備，要嘛在家隨便翻翻，要嘛就是到學校後利用下課時間惡補一下。

    三、段考前才開始讀書，他們口中的「積極用功」是指段考前兩週，「有看書」是指段考前一週，真正的「沒準備」是指段考前的自習課才讀書。

    　　但這類學生卻普遍有一個共通的情緒，就是「只記得自己考前抱佛腳的『用功感』」，把失敗歸因於粗心，或推託「大家也都考不好」，還會自憐說：「我已經這麼努力，卻沒有好成績」。他們自我感覺良好，對考前兩週的努力讚歎不已，對那時候承受的壓力記憶猶新，因此，更加覺得「考不好都是外在的一切害的」，覺得自己無比委屈，還因為這種情緒變得更不想努力，落入惡性循環。

    　　而家長呢？或許也因為看到孩子這兩週的「努力」，因為他們那種自憐又委屈的情緒而不忍責備，最終，檢討成了安慰，忽略問題的本質使得一切只是原地踏步。但，真正問題的核心是：

    ♥你考不好，不是因為「你不努力」，而是「你『不夠』努力」！

    用臨時抱佛腳的方式讀書，就算是自認為已經提前的「考前兩週」，也只是「短期記憶」！

    　　提升成效的終極秘密在於平日腳踏實地的累積，說穿了就是預習、複習而已，今天教完今日畢，如果堆積功課不複習，最後結果就是：好像有看書，但都像是不穩固的根基，一考就倒，一比較就混淆。小考或許偶爾還可蒙混過關，到了大考絕對是一團混亂，全盤潰散。

    　　學習是反覆確認的過程，就像單字背不熟，只能靠反覆多背幾次解決；數學學不會，就得每一題蓋起來老老實實算三遍，再利用訂正回溯定理，原原本本弄清楚才能高分。考前抱佛腳，理科就變成「背作法」，連練習都不夠，遑論弄懂原理了；而文科也會讀得似是而非，變成「看起來都很像，選起來卻不一樣」的結果。

    ♥不要因為「自我感覺良好」，耽誤了反省的機會！

    ♥不要濫用自憐的情緒，自己親手毀了自己！

    ♥你的努力根本還不夠努力，只有每天持續讀書、踏實弄懂，才能稱得上用功。

    ＊＊＊

    　　然後，如果你真的想考好成績，最終還是想要考進前幾志願的話，那就一定要養成每天讀書的習慣，從每天半小時、一小時開始，再到兩小時或三小時；而且應該是先完成讀書的任務，之後才滑手機、玩遊戲，放鬆才不會變成放空。記住，真正要難過的是「我每天都拼死拼活讀書，卻還是考不好」，而不是「我考前兩週已經有讀書，卻還是考不好。」……

    （節錄自陳怡嘉老師的臉書文章）'
