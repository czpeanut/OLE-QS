  group_stem: '（一）

    　　台灣人講「雞婆」，可以指人好管閒事，也可以指好管閒事的人，雖然有個「婆」字，但對象男女通用。

    　　問題來了，好管閒事跟「雞」或「婆」有什麼關係？

    　　有人或許會想到「三姑六婆」，但「六婆」是古代從事不高尚職業的婦女，其中也沒有「雞婆」。若查證正統中文辭典，「雞婆」指母雞，例句：這群女孩子嘰嘰喳喳像雞婆一樣擠在一起。

    　　其實「雞婆」源自台灣閩南語「家婆」（ke-pô），而「家」與「雞」在閩南語同音，所以「家婆」在寫成中文時，就被誤寫成了「雞婆」。

    　　那麼再用「家婆」查證於正統中文辭典，一查發現，「家婆」指的是妻子或丈夫的母親，但這樣的意思似乎離「好管閒事」愈來愈遠。

    　　追根究柢，原來閩南語的「家婆」，其實是「管家婆」（kuan`-ke-pô）的簡稱，而中文的「管家婆」是古代官紳巨賈家中地位較高的女傭，被比喻為大小事都要管的人，由此衍生出「好管閒事」之意。

    　　「雞婆」本來是負面用詞，但隨著工商發達帶來的人情冷漠，在「各人自掃門前雪，莫管他人瓦上霜」的現代社會，反而需要一些好管閒事的「雞婆」了。

    改寫自曹銘宗〈台灣人也不知道的台式國語〉'
