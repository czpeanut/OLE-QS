- id: doc_113_台中_復興_國文_g8s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: '〈冬陽〉一文中「經過師傅翻彈過的棉被，質地蓬鬆多了，蓋在身上的重量變輕卻較前暖和，顏色會從原先的深褐色變成淺淺的乳黃，卻永遠也無法變回剛買時那種雪柔的白。」根據上文老棉被在翻彈前後的差異，下列哪一個項目內容有錯誤？

