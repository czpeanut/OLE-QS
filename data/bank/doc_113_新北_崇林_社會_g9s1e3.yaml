  stem: '吐瓦魯（Tuvalu）是我國在大洋洲的友邦，位於南緯5 度至10 度，東經176 度至179 度間，全國陸地面積僅26 平方公里，無山丘河流，最高處不超出海平面4
    公尺，海岸常遭海水侵蝕……。

    請問：吐瓦魯目前最可能面臨什麼環境危機？而吐瓦魯政府目前最關注的應是哪一個問題﹖'
  options:
  - label: A
    content: 土石流發生頻率增加；最關注極端天氣帶來強烈暴風雨，威脅居民生命財產安全的問題
  - label: B
    content: 熱帶雨林大量縮減；最關注乾旱導致野火蔓延，水土保持不佳引發糧食生產不足的問題
  - label: C
    content: 氣候變遷造成生物棲息地改變；最關注沿岸珊瑚大量白化死亡，大堡礁美景不復見之問題
  - label: D
    content: 全球暖化導致國土被淹沒；最關注海岸線維護，並極度關切溫室效應及海平面升高之問題
  group_stem: "賴總統訪吐瓦魯 簽署聯合公報深化夥伴合作 \n總統賴清德太平洋友邦出訪之旅，第二站是來到吐瓦魯，今年也是吐瓦魯跟台灣建交45 年，也是台灣在太平洋地區建交歷史最悠久的國家。為了對抗氣候變遷，近年來台灣跟吐瓦魯一起推動「吐瓦魯海岸調適計畫」（TCAP）等合作計畫，並跟美澳日紐等國共同合作「中部太平洋電纜計畫」（CPC）吐瓦魯段工程，協助吐瓦魯鋪設第一條海底電纜，讓吐瓦魯擁有安全、永續及具有韌性的網路通訊系統，促進吐瓦魯經濟及社會發展。原視新聞網\
    \ 2024.12.04"
