  section: 1
  number: 30
  type: single
  page: 4
  stem: 以上是法國大革命期間所發表的《人權宣言》部分條文，請問我們看不出哪位啟蒙思想家的理念？
  options:
  - label: A
    content: 孟德斯鳩
  - label: B
    content: 洛克
  - label: C
    content: 伏爾泰
  - label: D
    content: 盧梭。
  group_stem: '第二條：一切政治結社的目的都在於維護人類自然的和不可動搖的權利。這些權利是自由、財產、安全與反抗壓迫。

    第六條：法律是普遍意志的表達。每一個公民皆有權個別地或透過他們的代表去參與法律的制訂。法律對於所有的人，無論是施行保護或是懲罰都是一樣的。在法律的眼裡一律平等的所有公民，除了他們的德行和才能上的區別之外，皆能按照他們的能力，平等地取得擔任一切官職、公共職位與職務的資格。

    第十一條：自由傳達思想與意見乃是人類最為寶貴的權利之一。因此，每一個公民都可以自由地從事言論、著作與出版，但在法律所規定的情況下，仍應就於此項自由的濫用負擔責任。'
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 歷史
      code: 5-3
      title: 啟蒙運動
      chapter: 第5章 近代歐洲的變革
