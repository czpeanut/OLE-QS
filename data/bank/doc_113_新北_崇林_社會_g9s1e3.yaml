  type: single
  page: 1
  stem: 有關線上購書點數，下列何項敘述較為正確?
  options:
  - label: A
    content: 線上購書點數屬於一種交易媒介
  - label: B
    content: 使用線上購書點數來買書，等同以物易物的方式
  - label: C
    content: 線上購書點數是商品貨幣
  - label: D
    content: 線上購書點數，具備完整的貨幣功能。
  group_stem: '英國獨立書商服務線上平台Bookshop.org 推出一項稱為「Bookloop」的舊書回收運動。透過「Bookloop」，讀者可以選擇交換模式，把自己不需要的書籍用來交換線上購書點數，或直接換取讀物。

    「Bookloop」目前的合作夥伴是二手書回購平台Zeercle，Zeercle 的聯合創辦人暨執行長甘奈爾（Eric Gagnaire）表示：「這種交換與回收模式，賦予書籍第2
    次生命；我們不僅減少浪費，還培養了重視永續性並支持獨立書店的讀者群。我認為，這項計畫對環境和當地經濟都有利。」'
  tags:
    chapter:
      publisher: 翰林
