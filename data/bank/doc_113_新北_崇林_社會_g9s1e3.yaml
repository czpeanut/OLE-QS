  stem: 阿根廷實施貨幣緊縮政策，使通貨膨脹率降低。針對上文，以下敍述何者正確？
  options:
  - label: A
    content: 在我國發行貨幣的單位是財政部
  - label: B
    content: 一般民眾可以在發行貨幣的機構存款及借款
  - label: C
    content: 阿根廷的貨幣價值較之前貶值
  - label: D
    content: 阿根廷通貨膨脹率如此之高，最主要原因是貨幣發行量超過市場上流通所需要的數量。
  group_stem: （中央社布宜諾斯艾利斯11 月12 日綜合外電報導）統計機構INDEC 今天的數據顯示，阿根廷總統米雷伊（Javier Milei）貨幣緊縮政策收到效果，通貨膨脹率降至193%，近1
    年來首次來到200%以下。路透社報導，阿根廷政府大幅調整公共支出，一定程度拉低了通膨速度。然而，減緩通膨的代價是經濟遭受重創，一半以上人口陷入貧困。(甲)(緊縮貨幣政策：政府的銀行準備升息、降低債券購買量、減少貨幣供給的數量，使市場的可用資金變少，讓金融市場狀況變得較為緊縮)(通貨膨脹率為物價平均水準的上升幅度)
