  stem: 義大利著名學者─伽利略過世時，托斯卡納大公費迪南德二世希望把他葬在佛羅倫斯聖十字大殿，挨著他的父親及其他先祖們，並為他樹立一座大理石紀念陵墓。但卻由於伽利略的「有強烈異端嫌疑」之判決，使得此舉遭到教宗烏爾班八世和樞機的抗議，該計劃被否決。因此，他最後被葬在初學生禮拜堂隔壁的小屋旁。請問當時教會反對的理由是什麼？
