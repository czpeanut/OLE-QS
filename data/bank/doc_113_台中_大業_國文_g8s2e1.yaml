  stem: 「爺孃聞女來，出郭相扶將。阿姊聞妹來，當戶理紅妝。小弟聞姊來，磨刀霍霍向豬羊。開我東閣門，坐我西閣床。脫我戰時袍，著我舊時裳。當窗理雲鬢，對鏡貼花黃。」以上句子描寫許多動作，這一連串緊鑼密鼓的行動，所表現出的種種心情不包括下列何者？
