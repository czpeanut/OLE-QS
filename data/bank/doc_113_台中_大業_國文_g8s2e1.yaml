- id: doc_113_台中_大業_國文_g8s2e1_s4_4
  section: 4
  number: 4
  type: single
  page: 4
  stem: 依據本文，下列敘述何者正確？
  options:
  - label: A
    content: 名譽得經刺激，才能超越榮譽的價值
  - label: B
    content: 名譽實際上是人內心散發出來的光輝
  - label: C
    content: 榮譽與名譽實質相等，只是名稱相異
  - label: D
    content: 榮譽能擁有內心價值，故較名譽可貴。
  group_stem: "（二）\n  說到榮譽，往往就要聯想到「名譽」。但是榮譽和名譽不同，榮譽不等於名譽。「名譽」在英文裡面是另一個字，即「reputation」。名譽是外加的，而榮譽卻是內足的。更明白一點說，名譽只是外界的稱許，而榮譽則是內部發出來的光榮——也可說是光輝——與外界所加上的名譽相合而成的。所以榮譽具有內心的價值，較名譽還要可貴。西洋雖有名譽為第二生命的話，但榮譽卻簡直是第一生命，或是第一生命的一部分。不過，名譽和榮譽也有關聯。人是社會的動物，多少都需要外界的刺激，外界的鼓勵，外界的承認，才格外能自發的向上，自覺的求進步。所以人大都是要名譽的。\n\
    \  「三代以下，惟恐不好名，」好名譽不一定就是壞事。蘇聯就常常採取以名譽作為鼓勵人努力工作的方法，所以他選擇工作最努力的工人為「工人英雄」，用這工人的名字去名工廠，去名制度。對於到北極探險的人，也常常加以「英雄」的徽號，這都是用名譽來鼓勵人奮發有為的證據。\n\
    （羅家倫榮譽與愛榮譽）"
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 國文
