  group_stem: "(四) 請在閱讀下列敘述後，回答下列問題：\n有些住宅為求方便，將瓦斯熱水器裝設在浴室或是不通風的陽臺上，其實這是十分危險的行為，因此在冬季時，常會出現民眾瓦斯中毒而死亡的新聞。\n\
    \ 瓦斯燃燒不完全，會產生無色無臭的一氧化碳，人體吸入後，由於一氧化碳比氧氣更容易與血紅素結合，與一氧化碳結合後的血紅素便失去攜帶氧氣的能力，嚴重時會造成死亡。若能及早發現，將病患送至醫院，仍可利用高壓氧進行治療，使血紅素恢復攜氧能力。"
  tags:
