  stem: 依據上述的選購要點，禮盒裡面最有可能盛裝下列何種水果？
  options:
  - label: A
    content: 火龍果
  - label: B
    content: 百香果
  - label: C
    content: 哈密瓜
  - label: D
    content: 水蜜桃。
  group_stem: '【題組二】

    暑假時小新全家出遊，沿途不少販售當季水果的農民。小新看到其中一個禮盒上印著這段文字：

    □□□聰明選購：

    1.股溝淺品質佳：從蒂頭連到頂部的縫合線越不明顯，果實發育越完全。

    2.果頰對稱口感好：縫合線左右兩邊的果頰對稱均勻，果實成長越完整。

    3.果香濃甜度高：香氣會隨成熟度增加，越香表示果實甜的機率越高。

    4.越沉重越多汁：果實外觀飽滿、重量又沉，表示果實本身越鮮美多汁。

    5.絨毛多越新鮮：表面絨毛因運輸碰撞或觸摸會脫落，所以絨毛越多越新鮮。

    6.蒂頭黃表成熟：蒂頭最後變色，未成熟是淡綠色，若是淡黃表示成熟度高。'
