- id: doc_113_新北_板橋_國文_g7s1e1_s5_25
  section: 5
  number: 25
  type: single
  page: 4
  stem: '芳芳在札記裡寫上參訪導盲犬基金會的心得，根據這則說明，哪部分的敘述有誤？


    今天我參訪了導盲犬基金會，一進門，(甲)映入眼簾的是三隻排排坐的拉不拉多，正在安靜的休息。聽完一些關於導盲犬的知識後，我對導盲犬有了更深的認識。隨後，有視障人士來分享經驗，(乙)他的導盲犬雖然是幼犬，但專業度與穩定性卻不輸成犬，令人欽佩。

    接著來到訓練場，(丙)看到幾對視障人士與導盲犬的共同訓練，牠們真的很聰明。除了(丁)穿著紅色、藍色背心的訓練中導盲犬外，現場還有一些已經完成訓練、自由活動中的導盲犬，就跟一般狗狗一樣愛跑愛玩。'
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
  group_stem: '【題組一】

    問：什麼樣的犬種可以成為導盲犬？

    答：犬種以拉不拉多、黃金獵犬、及混血的黃金拉拉為主，血統上有一定的要求，以確保其性格穩定、沒有遺傳疾病。

