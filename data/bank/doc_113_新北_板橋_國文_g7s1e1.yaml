  stem: 「今天你還小，如果你長大之後，還不能慎交朋友，又不懂得審度自己的行為，只怕那無心，就會惹下天大的麻煩。」劉墉委婉告誡兒子這段話的用意，不包括下列何者？
  options:
  - label: A
    content: 無心也可能會有惡果
  - label: B
    content: 近朱者赤，近墨者黑
  - label: C
    content: 萬事三思而後行
  - label: D
    content: 善有善報，惡有惡報。
