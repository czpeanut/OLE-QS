    答：優秀的導盲犬經過配種，生下幼犬後，在母犬身邊生活直到第八週，便進入寄養家庭與人類互動，學習社會化。一歲成年時再回到基金會進行訓練。經過配對，導盲犬會與視障主人共同接受訓練，結訓後即開始正式服務。

    問：導盲犬會不會咬人？會不會隨地大小便？

    答：導盲犬是性格溫和、經過專業訓練的工作犬，絕不會攻擊人類，而且會聽從指導員或使用者的指令，在指定的地方大小便。

    問：在路上看到導盲犬，可以餵牠漢堡或餅乾嗎？

    答：執勤中的導盲犬會配戴導盲鞍，培訓中的導盲犬則穿著紅色或藍色背心。在公共場所遇到牠們時，要遵守「四不一問」的原則，以免影響導盲犬工作及視障朋友安全。

    ◎ 四不一問：不餵食、不撫摸、不呼叫、不拒絕導盲犬進出公共場所，主動詢問視障朋友是否需要協助。

    (改寫自惠光導盲犬基金會網站導盲犬Q﹠A)'
