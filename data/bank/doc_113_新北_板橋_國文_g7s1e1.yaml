  number: 28
  type: single
  page: 4
  stem: 根據本文，「外語就是我這位朋友的棋譜」一句中，「棋譜」指的是什麼？
  options:
  - label: A
    content: 增進語言的技巧
  - label: B
    content: 指導棋藝的書刊
  - label: C
    content: 充實生活的憑藉
  - label: D
    content: 囚禁人生的枷鎖。
  group_stem: "【題組三】\n一位朋友幾年前進了監獄。有一次我應邀到監獄為犯人們演講，沒有見到他，就請監獄長帶給他一張紙條，上面寫了一句話：「平日都忙，你現在終於獲得了學好一門外語的上好機會。」\n\
    幾年後我接到一個興高采烈的電話：「嘿，我出來了！」我一聽是他，便問：「外語學好了嗎？」他說：「我帶出來一部六十萬字的譯稿，準備出版。」\n    他是刑滿釋放的，但我相信他是為自己大大的減了刑。茨威格在《象棋的故事》裡寫一個被囚禁的人無所事事時度日如年，而獲得一本棋譜後日子過得飛快。外語就是我這位朋友的棋譜，輕鬆愉快的幾乎把他的牢獄之災全然赦免。\n\
    \    真正進監獄的人畢竟不多，但我卻由此想到，很多人正恰與我的這位朋友相反，明明沒有進監獄卻把自己關在心造的監獄裡，不肯自我減刑，自我赦免。\n   \
    \                                                               余秋雨〈為自己減刑〉"
