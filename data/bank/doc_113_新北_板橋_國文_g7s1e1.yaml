- id: doc_113_新北_板橋_國文_g7s1e1_s5_24
  section: 5
  number: 24
  type: single
  page: 3
  stem: 根據這則說明，遇到導盲犬時，下列何者的行為最合適？
  options:
  - label: A
    content: 花花看到導盲犬，為了表達友善，輕撫牠的頭並且餵食無調味的果乾
  - label: B
    content: 文文主動提供主人狗兒專用的便袋，以防導盲犬在公車上便溺
  - label: C
    content: 華華逕自拉起主人的手，想要協助視障者步行，以減輕導盲犬的負擔
  - label: D
    content: 強強天生怕狗，看到導盲犬馬上保持距離，避免自己的反應過大影響牠執行任務。
  group_stem: '【題組一】

    問：什麼樣的犬種可以成為導盲犬？

    答：犬種以拉不拉多、黃金獵犬、及混血的黃金拉拉為主，血統上有一定的要求，以確保其性格穩定、沒有遺傳疾病。

    問：一隻合格的導盲犬，需要經過哪些訓練流程？

    答：優秀的導盲犬經過配種，生下幼犬後，在母犬身邊生活直到第八週，便進入寄養家庭與人類互動，學習社會化。一歲成年時再回到基金會進行訓練。經過配對，導盲犬會與視障主人共同接受訓練，結訓後即開始正式服務。

    問：導盲犬會不會咬人？會不會隨地大小便？

    答：導盲犬是性格溫和、經過專業訓練的工作犬，絕不會攻擊人類，而且會聽從指導員或使用者的指令，在指定的地方大小便。

    問：在路上看到導盲犬，可以餵牠漢堡或餅乾嗎？

    答：執勤中的導盲犬會配戴導盲鞍，培訓中的導盲犬則穿著紅色或藍色背心。在公共場所遇到牠們時，要遵守「四不一問」的原則，以免影響導盲犬工作及視障朋友安全。

    ◎ 四不一問：不餵食、不撫摸、不呼叫、不拒絕導盲犬進出公共場所，主動詢問視障朋友是否需要協助。

    (改寫自惠光導盲犬基金會網站導盲犬Q﹠A)'
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 國文
      code: 語文常識(二)
      title: 閱讀導航——策略運用與資訊檢索
      chapter: null
    textbook: 七上 語文常識(二) 閱讀導航——策略運用與資訊檢索
