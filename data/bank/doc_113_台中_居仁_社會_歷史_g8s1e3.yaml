  section: 1
  number: 5
  type: single
  page: 1
  stem: 5.北京西什庫教堂建於1703年，為一座天主教教堂。此處曾在1900年時受到軍隊包圍攻擊，進攻方以穿屋火龍、炸彈等火器攻擊教堂。外國籍傳教士樊國梁帶領信徒與40幾位士兵守衛教堂，儘管糧食耗盡，教堂內的人員將馬匹殺來食用，並開始吃樹皮和野草，最終等到援軍到來成功守住教堂。上述攻擊西什庫教堂的軍隊最有可能是下列何者?
