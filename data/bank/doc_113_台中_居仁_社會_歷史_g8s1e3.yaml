  group_stem: "（三）請閱讀短文，回答下列問題：\n    西元1541 年，一位名叫沙勿略的耶穌會傳教士從歐洲出發，經過了一年多的旅行，最終沙勿略到達了印度。幾年之後，沙勿略輾轉來到日本，成為了第一位來到日本的天主教傳教士。\n\
    西元1552 年，沙勿略原本想要將傳教事業擴展到中國，但一直未能成功。更糟的是，在日本的傳教事業也不順遂，日本的德川幕府查禁了天主教，教徒的活動只能祕密進行。\n\
    \    西元1552 年，沙勿略因病去世，利瑪竇於同年出生於義大利，這位利瑪竇長大後，也成為了傳教士，做了沙勿略當初未能做到的事情——將天主教傳入中國。"
