  group_stem: "（八）秋瑾出生於官宦之家，長大後奉父母之命結婚，但秋瑾對婚姻帶來的束縛感到不滿，不顧家庭反對，前往日本留學。之後，更創辦報刊鼓吹男女平等思想、提倡女學，痛刺清廷的腐敗。她曾寫下一首名為「黃海舟中日人索句並見日俄戰爭地圖」的詩：\n\
