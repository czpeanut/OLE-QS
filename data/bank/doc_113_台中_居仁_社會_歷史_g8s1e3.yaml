  section: 2
  number: 34
  type: single
  page: 4
  stem: 34.上文中「唐手佐久川」與琉球王國的使節團得以前往中國，最可能與當時中國何項外交政策有關？
  options:
  - label: A
    content: 推行大化革新，學習唐朝文化
  - label: B
    content: 簽訂條約，開放五口通商
  - label: C
    content: 與受冊封國家建立朝貢貿易關係
  - label: D
    content: 訂定盟約，以兄弟相稱。
  group_stem: '（六）請閱讀短文，回答下列問題：

    歷史上的琉球王國與中國關係密切，在雙方數百年的交流之下，琉球文化在飲食、語言、風俗，甚至武術都受到中國影響。例如：1820 年代，琉球武術家佐久川寬賀，數度跟隨使節團前往中國，得以拜訪大師精進武藝，並將中國拳法融入傳統武術之中，形成「唐手」，他也被琉球人尊稱為「唐手佐久川」。之後，「唐手」得到琉球士族的重視，成為士族間秘傳的武術。

    1870 年代，由於政治局勢發生變化，琉球王國遭到他國併吞，國王與士族被迫前往新統治者的都城居住，「唐手」也隨之傳入該國。經過一段時間的發展，「唐手」名稱改為同音異字的「空手」，即為今日的「空手道」。'
