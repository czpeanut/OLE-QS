  stem: 下列關於＜庭中有奇樹＞一詩的分析，何者正確？
  options:
  - label: A
    content: 本詩有八句，一韻到底，為五言律詩
  - label: B
    content: 「馨香盈懷袖，路遠莫致之」兩句描述出主角執花在手，痴痴久立 ，目送故人遠去的無奈心情
  - label: C
    content: 本詩前四句從折花的動作寫到奇樹開滿繁花，再引出折花之人
  - label: D
    content: 本詩末二句藉由奇樹香花的不足重視，讓人感受到長久別離所增添的痛苦，凸顯出主題。
  lesson_raw:
    title: 庭中有奇樹
    basis: 題目提及課名〈庭中有奇樹〉
