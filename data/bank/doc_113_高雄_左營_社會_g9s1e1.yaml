- id: doc_113_高雄_左營_社會_g9s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 歐洲氣候溫和且全境無沙漠，主要是受到下列哪些因素的影響？(甲)盛行風吹拂；(乙)河川流向；(丙)位居板塊碰撞帶；(丁)東西走向的山脈不阻擋水氣。
  options:
  - label: A
    content: 甲、乙
  - label: B
    content: 丙、丁
  - label: C
    content: 乙、丙
  - label: D
    content: 甲、丁。
- id: doc_113_高雄_左營_社會_g9s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 阿爾卑斯山是歐洲最高大山脈，山間有許多谷地，為南北間的天然孔道，可從瑞士蘇黎世搭鐵路至義大利米蘭，沿途風景宜人，甚至可搭乘觀光火車觀看美麗的少女峰。請問：有關此地的交通建設敘述，下列何者正確？
  options:
  - label: A
    content: 地殼古老，溶蝕作用旺盛，地勢低平有利鐵路建設
  - label: B
    content: 冰蝕作用侵蝕而成U 型谷，交通建設上雖險峻卻不致成阻礙
  - label: C
    content: 河川侵蝕形成V 型谷地，交通線沿著河谷修築
  - label: D
    content: 斷層陷落而成的地塹，為開採礦產而興建鐵路。
- id: doc_113_高雄_左營_社會_g9s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '歐洲像一個巨型半島深入海洋，形成海中有灣，灣中有海的地形特徵，使歐洲具有優越的港灣條件，航運交通便捷。右圖為歐洲四大半島分布圖，請問：各半島與下列海岸類型圖示的配對，何者正確？


    | (a) | (b) | (c) |

    | :---: | :---: | :---: |

    |  |  |  |'
  options:
  - label: A
    content: 甲-a ,丁-b
  - label: B
    content: 乙-c ,丁-b
  - label: C
    content: 丙-b ,丁-c
  - label: D
    content: 甲-b ,丁-a。
