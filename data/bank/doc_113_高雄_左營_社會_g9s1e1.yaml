- id: doc_113_高雄_左營_社會_g9s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 北歐經濟普遍發達，以完善的社會福利著稱，是從搖籃到墳墓的全程照顧。以育兒環境來說，有數百天的有薪育嬰假，每個月有育嬰津貼；還有失業補助金、健全的公費醫療…等制度，是名符其實的『福利國』。請問：下列各項有關北歐福利政策的描述，何者正確？
  options:
  - label: A
    content: 近年來由於性別比失衡，使得福利政策備受考驗
  - label: B
    content: 福利制度的財源，來自高額稅收
  - label: C
    content: 良好的育兒環境，使得出生率高居不下，有幼年人口過多問題
  - label: D
    content: 福利政策帶動經濟發展，企業及資金多留在國內，國民失業率低。
- id: doc_113_高雄_左營_社會_g9s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '右圖為北歐國家的地理位置圖，地理課時同學在討論這五個國家的特色，請問下列哪些同學的說法正確？


    | 小柯 | 小麥 | 小安 | 小葉 | 小明 |

    | :--- | :--- | :--- | :--- | :--- |

    | 戊-『冰火島』 | 丙-『峽灣國』 | 乙-『千湖國』 | 甲-『福利國』 | 丁-『歐洲牧場』 |

    | 位居西半球，北極圈穿越本島，地熱豐沛。 | 冰河侵蝕，海水入侵，形成良港，冬不結凍，航運發達。 | 冰蝕湖廣布，針葉林豐富，帶動工業發展。 | 鐵礦及針葉林豐富，林業、汽車等產業發達，如
    IKEA(宜家家居) | 酪農業發達，外銷肉品與乳品至西歐國家。 |'
  options:
  - label: A
    content: 小柯、小麥
  - label: B
    content: 小安、小葉
  - label: C
    content: 小麥、小明
  - label: D
    content: 小柯、小明。
  assets:
  - key: s1_6_f1
    kind: figure
    file: doc_113_高雄_左營_社會_g9s1e1/s1_6_f1.png
