- id: doc_113_高雄_左營_社會_g9s1e1_s2_15
  section: 2
  number: 15
  type: single
  page: 3
  stem: '幸芬是名專業旅者，暑假她規劃遊程，帶領一群背包客，環遊西歐及南歐各國。行前她做了不少功課，將欲前往的國家，配合地圖整理簡介如下：

     ①：英國，有「日不落國」之稱，首都為倫敦，礦產有煤礦及北海的石油，工業發展條件佳；

     ②：荷蘭，有「花卉王國」之稱，首都為布魯塞爾，鬱金香、風車、木鞋為該國代表；

     ③：法國，首都為巴黎，該國航太工業、時尚產業發達，觀光資源豐富，以羅浮宮、凱旋門為代表；

     ④：德國，首都為柏林，該國工業技術先進，人民務實，BMW、Benz 為汽車工業的代表；

     ⑤：瑞士，有「世界公園」之稱，以精密的鐘錶工業聞名，冰河與山岳旅遊資源豐富。

     ⑥：希臘，首都雅典，歐洲文明與奧林匹克發源地，境內有許多重要遺址；

     ⑦：義大利，首都羅馬，有豐沛的水力資源發展工業，境內的教廷自成一國，是東正教教宗的駐地。

     ⑧：西班牙，緯度低，生長季長，為歐洲重要蔬果供應地，藝術文化資產豐富，如高第的聖家堂及佛朗明哥舞蹈。

    請問上列敘述及在地圖上的位置配對，何者正確？'
  options:
  - label: A
    content: ①③④
  - label: B
    content: ⑤⑥⑦
  - label: C
    content: ②③⑤
  - label: D
    content: ①⑥⑧。
