  stem: '克強是留學俄羅斯的中國學生，在新生自我介紹時，他針對中俄兩國做一比較，如下表所示，請問表中哪個項目內容才是正確的？


    |  | (A)主要河流流向 | (B)礦產資源 | (C)區域結盟 | (D)最大港 |

    | :---: | :---: | :---: | :---: | :---: |

    | 俄羅斯 | 向南注入黑海 | 礦產資源豐富，仰賴出口賺取外匯，經濟易受國際市場影響 | 歐洲聯盟(EU) | 莫斯科 |

    | 中國 | 向東注入太平洋 | 北部礦產較南部多 | 區域全面經濟夥伴關係協定(RCEP) | 上海 |'
  options:
  - label: A
    content: 主要河流流向
  - label: B
    content: 礦產資源
  - label: C
    content: 區域結盟
  - label: D
    content: 最大港
- id: doc_113_高雄_左營_社會_g9s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 企業家光漢想到東歐投資，『ㄅ國』因鄰近西歐，擁有素質較高且薪資較低的勞工，又有鴻海集團在此投資工廠，成為重要生產中心的成功經驗，讓光漢也躍躍欲試；但近年來，東歐國家經濟雖然普遍成長，2022
    年俄羅斯卻與『ㄆ國』爆發戰爭，此戰乃歐洲自二戰以來最大規模的武裝衝突，造成數十萬人傷亡之餘更引發難民危機，也嚴重影響民生及經濟發展，這又讓光漢有點望之卻步。右圖為東歐主要國家的地理位置，請根據此圖，指出文中『ㄅ國』、『ㄆ國』的位置為何？
  options:
  - label: A
    content: ㄅ國-甲、ㄆ國-丁
  - label: B
    content: ㄅ國-乙、ㄆ國-丁
  - label: C
    content: ㄅ國-甲、ㄆ國-丙
  - label: D
    content: ㄅ國-乙、ㄆ國-丙。
