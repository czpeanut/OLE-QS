  stem: 1896 年第1 屆現代奧運之舉辦地雅典，位於圖(四)何處？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
  group_stem: "2024 年4 月16 日奧運倒數100 天，聖火於希臘奧林匹亞點燃，開始傳遞旅程，4 月26 日抵達希臘境內最後一站—1896 年第1\
    \ 屆現代奧運舉辦地雅典，聖火於此遞交給巴黎代表，隨後進入法國境內。\n    7 月26 日巴黎奧運開幕式，史無前例讓各國選手搭船遊塞納河飽覽巴黎地標美景為進場方式，蔚為佳話。但因一段變裝皇后與LGBTQ(同志團體)的表演橋段，被認為指涉基督宗教的經典符號「最後的晚餐」，包括法國、義大利的部份天主教人士指稱這段表演侮辱冒犯基督教，引發了國內外批判。\n\
    \    開幕式總監喬利對此否認，表示：「靈感並非來自達文西《最後的晚餐》，而是想透過這段演出社會對於性別多樣性、性別認同的寬容。而且最後加入酒神的角色，與其說是達文西《最後的晚餐》，不如說更像《眾神的盛宴》（17\
    \ 世紀荷蘭比勒特畫），而這段演出的意象是酒神與奧林帕斯山眾神的慶典。」"
