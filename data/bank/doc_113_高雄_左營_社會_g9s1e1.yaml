  stem: '下表為歐洲兩條重要河川―萊因河與多瑙河的比較，何者正確？


    | 河 川 | (甲)出海口 | (乙)河流長度 | (丙)航運價值 | (丁)注入海洋 |

    | :---: | :---: | :---: | :---: | :---: |

    | 萊 因 河 | 鹿特丹 | 較短 | 較佳 | 北海 |

    | 多 瑙 河 | 布達佩斯 | 較長 | 較差 | 裏海 |'
