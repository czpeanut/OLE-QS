- id: doc_113_高雄_左營_社會_g9s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 地中海型氣候深受風帶季移的影響，擁有燦爛的陽光及碧海藍天，是歐洲人心目中的宜人氣候。右圖為地中海地區夏季的風帶示意圖。請問：圖中的「甲」、「乙」各屬哪個風帶？
  options:
  - label: A
    content: 甲-西風帶，乙-副熱帶高氣壓
  - label: B
    content: 甲-西風帶，乙-東南信風帶
  - label: C
    content: 甲-極地東風帶，乙-西風帶
  - label: D
    content: 甲-副熱帶高氣壓，乙-西風帶。
