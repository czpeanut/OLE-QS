  stem: 種姓制度最早源自哪一宗教？
  options:
  - label: A
    content: 婆羅門教
  - label: B
    content: 印度教
  - label: C
    content: 祆教
  - label: D
    content: 佛教
  group_stem: "2019 年印度偏遠村莊的一場婚禮上，受害者吉特卓被圍毆得遍體鱗傷，九天後傷重身亡。吉特卓及其家人來自「達利特」階級，吉特卓在新郎堂哥婚禮幫忙，忙完他盛裝了食物坐在椅子上吃飯。有些階級較高的人要求他去旁邊吃，但吉特卓拒絕了。階級較高的幾位男子踹翻吉特卓椅子，與他扭打在一起。吉特卓因受到毆打而感到被羞辱，忿忿不平地離開婚禮，但隨後在路上又再度被攻擊成重傷，九天後傷重身亡。\n\
    \    近年愈來愈多「達利特」為了擺脫種姓制度帶來的歧視，而改信○○教。「達利特」即是「賤民」，是印度早期階級制度下社會地位最低的一群，只能從事骯髒或被認為低賤的工作，甚至被排除四大種姓制度之外，世代不能翻身。他們也被稱為「不可碰觸者」，一旦碰觸到就會被玷汙，即使是碰到他們的影子也一樣。"
