  type: single
  page: 3
  stem: 歐洲聯盟成立後備受矚目，對歐洲各國經濟幫助頗大。下列有關歐盟的敘述，何者正確？(甲)會員國間免關稅，電氣規格統⼀；(乙)東歐國家如捷克、匈牙利，皆已加入歐盟，並使用歐元；(丙)西歐國家除英國退出外，皆為歐盟會員；(丁)北歐、南歐各國皆為申根區。
