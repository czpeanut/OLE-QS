- id: doc_111_新北_崇林_自然_g7s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 科學家研究發現防曬乳可能會導致珊瑚死亡。我們所看到色彩繽紛的珊瑚，其實是與珊瑚共生藻類的顏色；若我們塗抹防曬乳並到海邊玩水，可能會導致防曬乳進入海洋生態系中，但因為防曬乳無法溶解於水中，會在海面上形成一層薄膜，進而阻擋陽光照射、阻絕氣體交換，並使珊瑚表面沾上防曬成分，導致共生藻類離開，就會造成珊瑚白化。下列敘述何者有誤？
  options:
  - label: A
    content: 珊瑚的呼吸作用需要氧氣做為反應的原料
  - label: B
    content: 珊瑚健康存活在有陽光和氧氣之溫暖、清澈的淺海，不需要二氧化碳
  - label: C
    content: 防曬乳也會影響其他海洋生物的呼吸作用
  - label: D
    content: 珊瑚與共生藻類都會參與此生態系中的碳循環。
  tags:
    chapter:
      publisher: 翰林
      book: 七下
