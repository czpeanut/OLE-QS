    沉靜殺手—論黑冠麻鷺對校園生態的影響


    回顧三十年前，黑冠麻鷺是罕見的，稀有的，在賞鳥人的清單中常是亟欲尋找的稀有留鳥，整個大台北地區僅於植物園有零星發現紀錄。在關鍵的 1995 年，喜鵲已經逐漸擴大分布的範圍，同年4
    月，在內湖山區首次發現黑冠麻鷺築巢育幼。然後像雨後春筍般，都會區裡的發現紀錄也慢慢地多了起來。到了 2008 年之後，不僅像植物園或大學那樣的大型城市綠地可見黑冠麻鷺的蹤跡，連一般的社區公園、林蔭大道以及中小學校園，都可以發現牠的長期留滯。黑冠麻鷺，堪稱是現代都會區動物保護意識抬頭最顯著的受益者。


    問題終於浮現了。就在107 年夏天，有一組欲研究蚯蚓的科展團隊，回報找不到蚯蚓，我開始意識到黑冠麻鷺對地面生物的可能影響。我帶著學生重回我親自確認曾經有大量蚯蚓的榕樹下落葉層翻找，腐植質依舊深黑，但遍尋不著蚯蚓，不只蚯蚓，連蜈蚣、馬陸和雞母蟲等節肢動物門的生物都減少。我撇見一旁佇立的黑冠麻鷺，牠正定睛的打量著我們師生的一舉一動。經過幾番嘗試，我們發現，蚯蚓等土棲動物並沒有完全消失，而是躲進更深層的土壤之中。這種因應黑冠麻鷺強大捕食壓力的適應行為，並沒有解除我們對找不到蚯蚓這件事的憂慮。對於黑冠麻鷺來說，「你會躲，我會換」。於是，寬廣的食性和捕食技巧的精準，讓黑冠麻鷺上樹捕鳥追蜥蜴，低地啄蟾蜍，水邊刺鬥魚，陰溝抓老鼠，影響的層面，就不只是土層中的蚯蚓那麼單純了。


    像黑冠麻鷺這樣大型的鳥類，每天必須攝取足夠的熱能才能維持代謝，於是便見其大量捕食落葉層及淺土層動物，包括脊椎和無脊椎動物。這不但可以從食繭的殘骸、毛髮、殘翅和外骨骼來判斷，更可從糞便的大小和次數看出食量的多寡。長期的追蹤下，發現牠們還有可能清空校園生態池，小型魚類幾乎會完全遭殃。至於壓迫小型鳥類的生存空間，就從綠繡眼、麻雀及白頭翁這三種常見小型鳥類自從黑冠麻鷺進駐校園後，便少築巢於校園，且減少在校園出沒覓食的時間就可看出端倪。


    我們得重新思考一個問題，不是只有入侵外來種的擴張，才會破壞本土生態平衡。像黑冠麻鷺這個曾經的稀有物種，都有可能在幾十年內變成極度擴張的種類，緊迫壓縮了更多原生物種的生存空間，可見，萬事萬物的過與不及，都是造成失衡的引爆力量。於是，我們短期能做的，就是控制校校容納黑冠麻鷺的數量，以不影響蚯蚓及其他表層土壤生活的動物消失為準繩，對多量的黑冠麻鷺，進行人道的干擾使其離開，以免這沉靜殺手默默地將校園的地面變成單調寂寥的黑白世界。


    【摘錄自鍾兆晉校長網誌《斑馬校長的馬廄》】https://reurl.cc/nD5XLl'
