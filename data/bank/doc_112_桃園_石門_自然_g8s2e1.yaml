- id: doc_112_桃園_石門_自然_g8s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 翔喆在商店看到一種無須用電、火，便能快速煮好的火鍋，被稱為「自煮火鍋」。經研究自煮火鍋主要利用化學反應自行發熱蒸煮，使用時將發熱包置於外鍋容器，並加冷水浸泡，再將食材鍋放置於上方即可。發熱包內含有生石灰（CaO）、金屬粉、活性炭、鹽等成分，加入冷水浸泡後，生石灰與水發生化學反應，產生氫氧化鈣（$Ca(OH)_{2}$）及大量的熱能，使水沸騰產生蒸氣，便可將食物煮熟。關於此化學反應式，下列何者正確？
  options:
  - label: A
    content: $Ca(OH)_{2}$ + $CO_{2}$ → $CaCO_{3}$ + $H_{2}O$
  - label: B
    content: CaO + $H_{2}O$ → $Ca(OH)_{2}$
  - label: C
    content: $CaCO_{3}$ → CaO + $CO_{2}$
  - label: D
    content: CaO + HCl → $CaCl_{2}$ + $H_{2}O$
