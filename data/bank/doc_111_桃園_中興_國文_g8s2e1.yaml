    content: 濃鬱森林與雲陣暮靄
  group_stem: '(一)請根據以下內容，回答23~24題。

    我站在巍巍的燈塔尖頂，俯視著一片藍色的蒼茫。

    在我的前面無盡地翻滾，整個太平洋洶湧的波浪。

    一萬匹飄著白鬣的藍馬，呼嘯著，疾奔過我的腳下，

    這匹銜著那匹的尾巴，直奔向冥冥、寞寞的天涯。

    浩浩的天風從背後撲來，將我的亂髮向前撕開；我好像一隻待飛的巨鷹，張翅要衝下浮晃的大海。

    於是我也像崖頂的巨鷹，俯視迷濛的八荒九垓︰

    向北看，北方是濃鬱的森林；向南看，南極是灰色的雲陣，一堆一堆沉重的暮靄，

    壓住浮動的海水，向西橫陳，遮斷冬晚的落日、冬晚的星星，

    遮斷渺渺的眺望，眺望崑崙—

    驀然，看，一片光從我的腳下，旋向四方，水面轟地照亮；

    一聲歡呼，所有的海客與舟子，所有魚龍，都欣然向臺灣仰望。

    （余光中─鵝鑾鼻）'
