  group_stem: "(二)請根據以下內容，回答25~27題。\n羽球球后戴資穎闖進東京奧運羽球女單項目的金牌戰，不僅創下台灣羽球女單的最佳成績，同時也是她個人生涯的奧運最佳成績。這場爭金奪銀的金牌戰因雙方實力□□□□，比數十分□□，打完兩局雙方1:1平手，必須在決勝的第三局分出勝負，激烈的戰況不只讓全台觀眾為之瘋狂，更是讓大家直言「簡直快要嚇出心臟病」！\n\
    最後一局小戴以3分之差不敵陳雨菲的嚴密防守，奪得東京奧運銀牌，看到她站上頒獎台時，略為落寞的神情，不但令人心疼，也惹哭了一票球迷。\n有人會說，她已經連續把球打出界，送了好幾分給對手了，為什麼不控制一下力道，把球往中間打就好？\n\
    但是，那些追求完美的邊角球、主動出擊、主動得分的比賽節奏，就是小戴充滿靈氣的球風。她當然知道這樣的進攻方式會提高失誤率，但如果要因此把球風改成穩定的路線，就不會有這些高超球技的得分方式。而且這就是她，這就是戴資穎打球的方式，是全世界球迷愛她的原因，也是看她比賽最吸引人的地方。\n\
    \    她在最後一局落後7分的時候，面不改色地一分一分追回來，在關鍵時刻勇於嘗試已經出界多次的邊角球，這些都需要異於常人的強大心智能力。她的每一下揮拍、每一次扣殺，都是在和自己比賽，她沒有因為想要贏得比賽而打得保守、減少險球、耐心等待對手失誤，她選擇的是做自己，勇敢打出每一顆符合她要求的球，不留遺憾地在那個當下拚盡全力。\n\
    \    正是這樣的精神感動了無數個台灣人，她教會我們如何相信自己、如何勇於嘗試、如何接受失誤、如何突破極限，還有最重要的是如何堅持做自己，在每一個自我懷疑的時刻，保持勇敢和正向的思考。\n\
    \    賽後她在貼文上表示，她覺得自己今天其實發揮得很不錯，而且她仔細地想了想，覺得一切都如此的不容易，非常謝謝大家陪她走到這裡。這種面對挫折的坦然和勇氣，更是我們所應該學習的。\n\
    \    賽後受訪時她說：「其實比賽就像是一場模擬的人生，有一些你可以努力的地方，也有一些不可控制的因素，贏了值得開心，輸了也不必難過，因為只要你沒有輸了自己，比賽就會一直持續下去。」\n\
    \    最後想說一個小故事，小戴和陳雨菲上一次對決是2020全英公開賽，小戴直落二取得全英公開賽的第3座冠軍，奪冠後她沒有馬上和教練、團隊擁抱，而是去把對手打出界的那顆球撿起來，這樣謙遜有禮的風度真的很讓人感到驕傲。\n\
    (改寫自Tings〈輸掉比賽卻贏了人心──戴資穎用一場金牌戰，教會我們如何勇敢做自己〉)"
