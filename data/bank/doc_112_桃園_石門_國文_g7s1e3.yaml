    content: 青少年化妝、刺青的年齡下降——屬於「原因推論」
  - label: B
    content: 美妝產品公司針對年輕客群拓展業務——屬於「現況描述」
  - label: C
    content: 大人可陪伴孩子練習如何不讓焦慮影響社交互動——屬於「原因推論」
  - label: D
    content: 許多就醫的青少年會分享他們cosplay 或化妝練習的照片——屬於「現況描述」。
  group_stem: '（三）

    北市聯合醫院的兒童青少年精神科主治醫師賴柔吟，觀察到青少年化妝、刺青的年齡下降，儘管不能判定是否成為趨勢，但她認為，可能是美妝產品公司針對年輕客群拓展業務，以及青少年受到偶像的影響，上網看美妝影片學習和模仿。賴柔吟醫師表示，許多因為容貌焦慮而就醫的青少年會分享他們cosplay（1.）或化妝練習的照片，這是Alpha
    世代（2.）年輕人互動交流的方式，以及尋找自我價值和認同的途徑。

    容貌焦慮患者往往過度在意自己的外表，例如沒有特定打扮就不敢出門，在外面不敢脫下帽子或口罩等，行為的成因可能是表現對自己的期待，渴望在人際間獲肯定，但仍缺乏自信，大人可陪伴孩子練習如何不讓焦慮影響社交互動，協助孩子發展更多元的興趣和嗜好。

    過度專注外表 影響社交和健康 出處：國語日報112/8/7 教育版

    註解：

    1.裝扮（電影、電視或漫畫中的）角色活動。

    2.指出生於2010 年之後的世代，相較於先前的世代，擁有充沛的物質及先進的數位工具資源。'
