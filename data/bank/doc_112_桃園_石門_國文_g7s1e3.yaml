  stem: 依據本文內容，下列何者最符合其養生之道？
  options:
  - label: A
    content: 把握睡前珍貴的空檔，盡情追劇紓壓
  - label: B
    content: 白天避免過多的閒暇及午睡，以免夜間失眠
  - label: C
    content: 為了消除週間上課的疲憊，假日整整睡了一天
  - label: D
    content: 飲食不要求山珍海味，而是細嚐菜飯的純粹滋味。
  group_stem: '（二）

    養生之道，莫大於眠、食。菜根粗糲，但食之甘美，即勝於珍饌也。眠亦不在多寢，但實得神凝夢甜，即片刻，亦足攝生（1.）也。然睡亦有訣，孫真人云：「能息心，自瞑目。」蔡西山云：「先睡心，後睡眼。」此真未發之妙。

    余少時，見先君子（2.）於午餐之後，小睡片刻，燈後治事，精神煥發。余近日亦思法之，午餐後於竹床小睡，入夜果覺清爽，益信吾父之所為，一一皆可為法。

    節錄自《浮生六記‧養生記道》／沈復

    註解： 1.保養身體、持養生命。

    2.對已故父親的稱呼。'
