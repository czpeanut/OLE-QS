    | :--- | :--- | :--- | :--- | :--- |

    | 3 | 30×42 | 20 | 24 | 提耳式 |

    | 5 | 36×45 | 20 | 40 | 提耳式 |

    | 14 | 43×61.5 | 20 | 112 | 提耳式 |

    | 25 | 55×75 | 20 | 200 | 提耳式 |


