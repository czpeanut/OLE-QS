    | 規格 (公升) | 尺寸 (公分) | 每包裝個數 | 每包售價 (元) | 型式 |

    | :--- | :--- | :--- | :--- | :--- |

    | 3 | 30×42 | 20 | 21 | 提耳式 |

    | 5 | 36×45 | 20 | 36 | 提耳式 |

    | 14 | 43×61.5 | 20 | 100 | 提耳式 |

