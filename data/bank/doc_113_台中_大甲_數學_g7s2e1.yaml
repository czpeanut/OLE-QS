    包及 14 公升的專用垃圾袋 Y 包，自從 108 年 5 月 1 日起新北市垃圾袋宣布降價後，澤澤發現每個月固定購買專用垃圾袋的費用跟之前相比可以省下一些錢，請問：可以省下多少專用垃圾袋的費用？(以
