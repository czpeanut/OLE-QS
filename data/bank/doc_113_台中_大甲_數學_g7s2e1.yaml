  group_stem: '新北市從民國96年7月起，於深坑區首先試辦「垃圾費隨袋徵收」政策，民國99年11月1日起，全市29區全面實施後，每天垃圾量已從試辦前每天約2490公噸降至1150公噸。由於垃圾費「以袋計價」，不會像過去隨水費徵收，比較符合公平原則，所以達成垃圾減量之目標。

