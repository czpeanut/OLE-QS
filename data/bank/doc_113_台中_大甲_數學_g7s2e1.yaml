  page: 1
  stem: '以下敘述正確的有幾個？

    (1) $2x+3y$ 是一個二元一次方程式

    (2) 在沒有其他條件限制下，二元一次方程式有無限多組解。

    (3) $x=-1$、$y=6$ 是二元一次聯立方程式 $\begin{cases} 2x+y=4 \\ x-y=-7 \end{cases}$ 的解

    (4) x軸上的任意一點，其橫座標一定是0，y軸上的任意一點，其縱座標一定是0。'
