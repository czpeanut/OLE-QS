  stem: 諺語是指在民間流傳，以人民的生活經驗或知識凝聚而成的詞句，可以反映一地社會風氣與歷史。日治時期臺灣便流傳一句俗諺：「第一戆，種甘蔗予會社磅」，傳達當時何種社會現象？
