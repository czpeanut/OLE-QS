    content: 皇民化運動。
  group_stem: 〈先生媽〉是日治時期臺灣作家吳濁流創作的短篇小說。「先生」是臺語中對醫生的尊稱，先生媽則是稱醫生的母親。文中描述醫生錢新發與他的母親，在面對日本文化時，截然不同的態度；錢新發積極地配合政策，更改日式生活，以身為日式紳士為榮，暗中以不願改穿和服，改說日語的母親為恥；而先生媽則堅持穿臺灣衫，講臺灣話。在先生媽臨終之時，交代兒子喪禮絕對不可請日本和尚，但錢新發依舊以日式習俗為先生媽舉辦喪禮。請依照上文，回答25-27
