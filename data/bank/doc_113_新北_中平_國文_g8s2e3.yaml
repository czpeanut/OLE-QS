  group_stem: '※請根據下面文章回答第33～34 題：

    　　鄭之鄙人學為蓋，三年藝成而大旱，蓋無所用，乃棄而為桔槔，又三年藝成而大雨，桔槔無所用。則又還為蓋焉。未幾而盜起，民盡改戎服，鮮有用蓋者。欲學為兵，則老矣。

    　　粵有善農者鑿田以種稻，三年皆傷於澇➂，人謂之宜洩水以樹黍，弗對，而仍其舊。其年乃大旱，連三歲，計其獲則償➃所歉而贏➄焉。　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　──節選自
    劉基《郁離子》

