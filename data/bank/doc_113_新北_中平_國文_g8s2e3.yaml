- id: doc_113_新北_中平_國文_g8s2e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: '甲、乙兩段文字皆描述與雲相關的內容，下列敘述何者正確？【素養導向】

    甲、小時候讀的地理課，將雲類分成四個家族，有低雲族、中雲族、高雲族及直展雲族，再細分為層雲、卷雲、積雲等種

    類。記得卷雲及卷層雲是變化最多最美麗的雲相，像喜愛在天上跳舞的秋雲就是屬於卷雲，它的高度在一萬公尺以上，是

    君臨在上睥睨天下的雲種，它的質地細緻而分散，像羽毛、頭髮、亂絲或馬尾，姿態千變萬化，在清晨日出或黃昏日落

    時，因為位置極高便會印染上橘紅色柔和的太陽光線。

    乙、根據雲所在的高度，可以分成高雲族、中雲族、低雲族三種。高雲族是卷雲的家，像是卷雲、卷層雲及卷積雲都住在

    那裡，它們的家大約在七千公尺以上的天空。樓下的中雲族則住著高積雲和高層雲，大約住在兩千至七千公尺的天空中。

    離我們最近的就是低雲族的家了，裡面住著層雲、層積雲和雨層雲，兩千公尺以下的天空都是它們活動的空間。當天空出

    現一朵朵白色圓頂平底的積雲，或是有如棉花般的高積雲或羽毛狀的卷雲時，通常表示空氣非常平穩，雲淡風輕，是良好

    天氣的徵兆，非常適合出遊踏青。'
  options:
  - label: A
    content: 甲文強調雲的種類與天氣的關聯，從甲文可知，作者欣賞卷雲時，宜備妥雨具
  - label: B
