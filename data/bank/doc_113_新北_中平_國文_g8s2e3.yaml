  group_stem: '※請根據下面文章回答第35～37 題：

    有位紐約的朋友說：「人到了紐約而不能發財，那麼他到世界任何地方都不會發財了！」紐約人口冠於世界，腳步的節奏又快，人氣薈聚的地方，必然財氣也薈聚。

    但美國醫療單位發表統計數字宣稱：紐約市的居民，心臟病患比其他城市高出百分之五十五，即使來紐約作客的，心臟發病率，也比訪問其他城市要高出百分之三十五。果真是「財與命連」，腳步快、賺錢易，心臟病也發作得多。

    臺灣的摩托車潮與急遽的路影，都保證當地是發財容易的地方，但醫療單位也說：每五人中已有一人得了精神官能症。這時若說些「財退人安樂」、或「錢是追命鬼」之類，未免消極而不合時宜，倒不如講幾則「從容」的故事，勸人保持從容的心情，減輕些壓力，也許對健康有點助益。談從容：

    一是常常想著自己是快樂滿足的人，從容寬平的氣象是由和樂的內心自然發露出來。

    內心貪婪就顯得猴急，內心憤怒就顯得孤剛，內心憂戚就顯得退縮。學學北宋的邵雍，把所住的小屋叫「安樂窩」，做詩常是「歡喜吟」 ，有句道：「眼前隨分好光陰，誰道人生多不足?」也可以學元末愛吹鐵笛的楊鐵崖，把小屋叫「春不老」，胸中四時長春，他說自己能「遇憂不憂」，所以「遇病不病，遇喪亂不喪亂」，他們是千古從容的模範。

    二是自我作主宰，不被緊迫的時間趕著跑。

    凡事凝重片刻，氣息調均再說話，節奏自然才開步，不要像淘米時的糠糟，率先隨流浮出來。像清代的宰相史貽直，有一次皇帝忽然宣召他，他雅步如常，旁人禁不住催促快點快點，史制止說：「世上哪有奔迫的宰相呢?」依舊不疾不徐，從從容容，沒有人說他麻木不敬，反欽佩他懂得大體，器量非他人所及。

    三是保持內心的澹泊寧靜，才有退一步的餘裕，有餘裕的人才能從容。

    不然，追著外界的浪翻潮湧，腳跟都不定，如何從容呢？不懂澹泊寧靜，欲望太多，攬的事也多，心就勞苦。心一勞苦，耐心就不足，脾氣就火爆。嫌別人說話慢，動輒打斷別人的談話；嫌別人行動慢，動輒要搶佔別人的前頭。時時計較得失，處處徬徨失落，從容的神氣全散了。這就可以學學黃庭堅，他在洪州考了第一名解元，大家都猜他又會是省試的第一名，同學朋友聚集在酒席邊等放榜的佳音，不久有位僕人舉著三個指頭奔進來，一問原來是其他三位朋友中了，黃庭堅卻落榜，其他下第者悄然離席，有的還落淚。黃庭堅依然飲酒自若，並陪著考中的朋友一同去看榜，連一點難看的臉色都沒有。後來他做官被貶到黔州，別人見到他「容貌愈光澤」，一點不憔悴。後又貶宣州，別人看他「無異仕宦時」，不以得失而勞心焦躁，真是德性從容的好榜樣。

    四是還沒讓人等的時候，就早一步來；還沒惹人厭的時候，就早一步走，自然就來去從容。

    像唐代宰相蕭嵩請求退休的時候，唐玄宗對他說：「我對你沒有一點厭倦，你何必就要離開呢?」蕭回答說：「就因為陛下還不厭倦我，我才能從容地引退呀，如果已經厭倦，我的頭都保不住了，哪能照我自己的想法退休呢?」真的，多少人是要別人指著鼻子問他為什麼不退休無才無德賴著做什麼？才悻悻然下臺的。那場面多尷尬？如何從容？

    五是凡事有準備，有條理，自信滿滿，言行才從容不迫。

    像唐玄宗有一次從複道高處，窺見一位衛兵在用餐，餐畢將剩下的飯菜傾倒在溝竇中，玄宗大發脾氣，要把這衛士用杖打死。大家見皇帝盛怒不敢勸解，宋王憲想了一回，從容大膽地奏報說：「陛下從複道私窺別人的過失，這行為並不對，還要杖殺他，恐怕從此人人都無法自安了！陛下不准拋棄剩飯剩菜，為的是供養人畜吧？結果為了剩飯剩菜去殺人，不是本末倒置嗎？」不慌不忙，成竹在胸地分析，極有條理，令唐玄宗蹶然起立，大大覺悟自己快要成為暴君了。

    ──黃永武〈從容五則〉'
