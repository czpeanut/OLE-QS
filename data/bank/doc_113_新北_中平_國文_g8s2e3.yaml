    　　「喔！老天，可憐的瑪蒂達，你怎麼變了樣？……」

    　　「是呀！我這些年過得很苦，說起來這都是因為你的緣故……」

    　　「因為我？這是怎麼回事？」

    　　「你還記得嗎？你以前曾借我一條鑽石項鍊。」

    　　「是呀！我記得。怎麼樣呢？」

    　　「我把項鍊弄丟了。」

    　　「可是，你不是早就還我了？」

    　　「我當時還給你的是另一條相同的項鍊。我們花了十年的時間還債，現在總算還清了，再沒有比這更令人高興的了。」

    　　珍娜停下腳步，「你是說你買了一條新的項鍊還給我？」

    　　「是啊！你沒發現嗎？這也難怪，因為那兩串項鍊很像。」說著，瑪蒂達得意又天真的微笑起來。

    　　珍娜完全嚇住了，她抓住瑪蒂達的雙手說：「啊！可憐的瑪蒂達，我那串項鍊是假的，頂多值五百法郎而已！……」

    ──莫泊桑〈項鍊〉'
