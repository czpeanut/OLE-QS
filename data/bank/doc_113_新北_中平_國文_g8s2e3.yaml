  group_stem: '※請根據下面文章回答第38～40 題：

    （一）

    　　始皇以為咸陽人多，先王之宮廷小，吾聞周文王都豐，武王都鎬，豐.鎬之閒，帝王之都也。乃營作朝宮渭南上林苑中。先作①前殿阿房，東西五百步，南北五十丈，上可以坐萬人，下可以建五丈旗。……阿房宮未成；成，欲更擇令名名之。作宮阿房，故天下謂之阿房宮。隱宮②徒刑者七十餘萬人，乃分作阿房宮，或作驪山③。發北山石槨④，乃寫⑤蜀、荊地材皆至。關中計宮三百，關外四百餘。於是立石東海上朐界中，以為秦東門。因徙三萬家麗邑，五萬家雲陽，皆復不事十歲⑥。

    ──選自司馬遷《史記．秦始皇本紀》

    注釋：①作：建造　②隱宮：即宮刑　③驪山：此處指修建秦始皇位於驪山的陵寢　④槨：外棺　⑤寫：拆卸。通「卸」　⑥不事十歲：指免除勞役十年

    （二）

    　　唐代杜牧在其〈阿房宮賦〉中敘述秦王奢豪浪費，搜刮民脂民膏，建富麗堂皇的阿房宮，使天下人怒而抗暴，終至滅亡，並警惕後人以此為鑑。然而，這篇流傳千古的作品，其真實性竟然可能大有問題？

    　　據《中新網》報導，2004 年底，考古隊重點尋找並確定阿房宮的遺址範圍，從前殿遺址起，西至灃河、北至渭河、南至漢代昆明池北岸，面積達135 平方公里，考古隊在此範圍內進行大量調查、勘探和發掘，發現十餘處遺址，包括傳說中的烽火台、上天台、磁石門等。但考古證實，這些遺址均為秦.漢.上林苑的建築，與秦始皇興建的阿房宮毫無關係。

    　　報導指出，相傳項羽進入關中之後，移恨於物，將阿房宮及其所有附屬建築縱火燒毀，化為灰燼。此說法流傳約二千年，如今被最新考古技術翻案。考古隊在阿房宮前殿遺址20
    萬平方公尺勘探面積之內，僅發現幾處「紅燒土遺跡」。

    　　阿房宮考古隊領隊、中國.社科院考古所研究員李毓芳指出，《史記．秦始皇本紀》亦有記載，「項籍為從長，殺子嬰及秦諸公子宗族。遂屠咸陽，燒其宮室，虜其子女，收其珍寶貨財，諸侯共分之。」顯示項羽曾對咸陽採取燒、殺、搶虜的政策，但沒有提到火燒阿房宮。

    　　《史記．項羽本紀》亦稱，「燒秦宮室，火三月不滅。」此處也隻字未提火燒阿房宮。如今看來，項羽不燒阿房宮的原因，係因阿房宮根本沒有建成，連前殿都未完工，前殿夯土台基上並沒有宮殿建築，因此項羽也就沒有必要渡過渭河，火燒一個沒有宮殿建築的夯土台子，「所以傳說認為項羽燒了阿房宮是錯誤的。」

    　　報導稱，經過五年的詳盡調查、勘探和發掘，考古隊已經徹底搞清秦始皇未修建完成的阿房宮的規模、範圍、布局和結構，並澄清火燒阿房宮的說法，還原秦.阿房宮的本來面目。　　　──改寫自〈中國時報〉2007.12.12
    亓樂義／台北報導'
