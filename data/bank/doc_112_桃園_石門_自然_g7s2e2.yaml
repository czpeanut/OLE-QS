- id: doc_112_桃園_石門_自然_g7s2e2_s1_24
  section: 1
  number: 24
  type: single
  page: 2
  stem: 國際保育組織曾為了替海洋生物保育探險工作募款，拍賣十種在印尼新發現物種的命名權，開放各界競標，且可用任何人或任何東西加以命名。下列關於生物命名原則的敘述何者正確？
  options:
  - label: A
    content: 不同物種會有不同學名，白種人與黃種人的學名不相同
  - label: B
    content: 學名在國際交流時需以拉丁文書寫，在國內則可以用當地的官方語言書寫
  - label: C
    content: 「可用任何人或任何東西加以命名」的命名權應該只限於種小名，而不包括屬名
  - label: D
    content: 林奈是史上第一位為生物命名的人，並提出「二分法」奠定生物的學名。
