  stem: 林獻堂，號灌園，霧峰林家子弟，人稱「阿罩霧三少爺」，自1927 年起便開始書寫日記《灌園先生日記》，至1955 年為止，時間跨度長，是研究近代臺灣史的重要史料之一。請問：以下哪一研究無須用到《灌園先生日記》？
  options:
  - label: A
    content: 臺灣中等教育發展史
  - label: B
    content: 臺灣社會運動史
  - label: C
    content: 臺灣戒嚴歷程發展史
  - label: D
    content: 臺灣選舉發展史。
