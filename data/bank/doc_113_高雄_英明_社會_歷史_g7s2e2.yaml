  group_stem: ※2 月27 日傍晚，有一個賣香菸的婦人在臺北某店家門口擺攤子。不久專賣局的巡邏員出現了，指控她買賣漏稅的香菸，並沒收了香菸和現款。圍觀的人愈來愈多，她緊抓住一個巡邏員不放，想取回被沒收的現金，卻被推倒在地上，還被手槍柄打傷頭部。憤怒的群眾開始追趕巡邏員，害怕的巡邏員們趕緊逃走。第二天早晨，約有兩千多人的群眾手裡拿著昨夜準備的、寫上標語的旗幟，排隊由圓環向專賣總局走去，他們要求專賣局嚴懲惹事殺人的巡邏員及局長辭職。但局長因公不在，遲遲沒有人出現。經過一段冗長的等待後，他們決定向當時臺灣最高的行政人員「甲」請願。請問：
