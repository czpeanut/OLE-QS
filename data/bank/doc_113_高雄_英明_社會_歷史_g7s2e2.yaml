  section: 1
  number: 31
  type: single
  page: 2
  stem: 臺灣旅遊活動從何時逐漸普及，可以從負責旅遊活動的官方機構總督府交通局鐵道部的出現看出端倪。當時，總督府交通局鐵道部年年都發行的《臺灣鐵道旅行案內》，不僅成為現在鐵道迷醉心追求的經典，更反映當時臺人對旅遊的興致大增。民間當然也出現大量的旅館、溫泉區、海水浴場以及風景名勝等旅遊相關住宿與景點，以配合逐漸「習慣」旅遊的臺人或來臺日人。從文中可判斷，「旅行」成為臺人休閒生活之一，是受到下列哪些政策的影響？
  options:
  - label: A
    content: 星期制和基礎建設
  - label: B
    content: 星期制和司法制度
  - label: C
    content: 司法制度和基礎建設
  - label: D
    content: 星期制和警察與保甲制度。
