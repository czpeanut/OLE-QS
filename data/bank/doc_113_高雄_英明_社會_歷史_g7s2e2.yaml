      subject: 歷史
      code: 3-2
      title: 文化啟蒙與政治社會運動
      chapter: 第3章 日治時期的社會與文化
    textbook: 七下歷史 3-2 文化啟蒙與政治社會運動
    labeled_by: ai
- id: doc_113_高雄_英明_社會_歷史_g7s2e2_s1_28
  section: 1
  number: 28
  type: single
  page: 1
  stem: 某本雜誌第五十卷的首篇為社論：「〈壽總統蔣公〉，其中社方呼籲以法治代替人治，確立制度的權威，在選拔繼任人選、確立責任內閣制、軍隊國家化等問題，皆應納入法的規範中，才是長治久安之計……。但批評政府的威權統治，更被視為「毒素思想」，進而被其他媒體全面圍剿……。」關於這件事的敘述，下列何者正確？
  options:
  - label: A
    content: 這本雜誌應該是《美麗島》
  - label: B
    content: 雜誌主編應該是林獻堂和蔣渭水
  - label: C
    content: 此時應該是戒嚴時期，遭到政府壓迫
  - label: D
    content: 主事者更在49 年試圖成立臺灣民眾黨，遭到壓制。
  tags:
    chapter:
