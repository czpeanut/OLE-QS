  type: single
  page: 1
  stem: 敬杰參加答題拿獎金的比賽，主持人提問如下：「下列哪一條新聞不可能出現在《臺灣民報》上？」敬杰該如何回答才能贏取獎金？
  options:
  - label: A
    content: 蔣渭水成立台灣第一個合法政黨
  - label: B
    content: 慢分！臺灣火車竟然慢分長達 20 分
  - label: C
    content: 透過法院審判，還大眾一個公道
  - label: D
    content: 政府德政，鴉片收歸專賣，人民根絕吸食鴉片。
