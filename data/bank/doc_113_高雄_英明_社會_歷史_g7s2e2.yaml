  section: 1
  number: 35
  type: single
  page: 2
  stem: 鴉片又稱為阿片，俗稱大煙。最初是用在醫學治療上，舒緩病情，然一旦染上就會產生很強的依賴性，因而被視為毒品。但是臺灣在某個時空背景下，法律竟規定：「凡是向政府登記在案,並繳納稅金者，即可合法吸食鴉片。」關於上述內容最有可能出現在何時？
  options:
  - label: A
    content: 1850 年的基隆
  - label: B
    content: 1910 年的安平
  - label: C
    content: 1960 年的高雄
  - label: D
    content: 1990 年的台北。
