  section: 1
  number: 32
  type: single
  page: 2
  stem: 昀希針對「日治時期臺灣的教育發展」寫了一篇報告，報告中提到以下四項內容。請問：哪一項內容是有誤的？
  options:
  - label: A
    content: 初等教育：日人就讀小學校，臺人就讀公學校，在師資、課程等方面均有差別
  - label: B
    content: 中等教育：欲培養基層技術人才與公學校教師，特別重視職業訓練與師範學校
  - label: C
    content: 高等教育：以臺北帝國大學為代表學校，但臺人就讀比例甚低
  - label: D
    content: 為配合內地延長主義，取消小學校、公學校的區別，一律改稱國民學校。
