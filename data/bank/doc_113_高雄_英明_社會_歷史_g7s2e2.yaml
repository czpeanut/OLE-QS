  stem: 1921 年至1935 年間，林獻堂等人曾發起十五次的請願運動，然而均未獲得日本政府的同意。請問：該請願運動爭取的是哪種權利？另外，在1937 年之後，臺灣不管哪一種的政治社會運動都宣告結束的主要原因為何？
  options:
  - label: A
    content: 行政權；地方自治全面開放
  - label: B
    content: 立法權；中日戰爭全面爆發
  - label: C
    content: 司法權；人民放棄爭取自治
  - label: D
    content: 軍事權；日本放棄殖民臺灣。
