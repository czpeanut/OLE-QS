  stem: 出生於重慶的筱婷，20 歲時因時局的變化，隨國民政府軍隊遷移至臺灣。原本語言不通的姑娘落腳臺灣，結婚生子成家立業，也經歷了臺灣那段風雨飄搖的年代，45
    歲時不幸紅顏薄命。請問：在筱婷的人生中，應親眼見證過臺灣的哪一段歷史？
  options:
  - label: A
    content: 戒嚴體制下的白色恐怖冤獄
  - label: B
    content: 二二八事件中，軍隊的全臺鎮壓
  - label: C
    content: 全面開放黨禁、報禁的自由年代
  - label: D
    content: 美麗島事件時，激烈的警民衝突。
