  - label: A
    content: 民國39 年，台灣實行地方自治，媒體也開始蓬勃發展
  - label: B
    content: 可以發現戒嚴統治下，多元言論的發展空間有限
  - label: C
    content: 民國60 年代以來，黨國教育之下，人民怯於挑戰政府不合理的統治
  - label: D
    content: 民國76 年解除動員戡亂時期臨時條款，造成媒體數目增加。
