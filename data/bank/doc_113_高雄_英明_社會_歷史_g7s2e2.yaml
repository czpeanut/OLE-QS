  section: 1
  number: 30
  type: single
  page: 2
  stem: 民國 69 年 3 月，在一個政治案件的審判法庭上，有如下的對答：法官：「當初你們五人（按：黃信介、施明德、姚嘉文、張俊宏、許信良）一起討論要辦雜誌嗎？」施：「辦雜誌是其中一項。」法官：「目的是什麼？」施：「我們辦雜誌目的是要政府改善人民生活狀況及民主政治等問題，其中包括黨禁、報禁、戒嚴令及『萬年國會』。」對談中所指的雜誌為何？
  options:
  - label: A
    content: 《自由中國》
  - label: B
    content: 《臺灣日日新報》
  - label: C
    content: 《臺灣民報》
  - label: D
    content: 《美麗島》。
