  stem: 嘉義市噴水池圓環附近豎立著一尊雕像，此人是 1931 年代表臺灣參加日本甲子園棒球比賽的嘉義農林學校當家投手吳明捷，也是電影《KANO》的男主角。嘉義農林學校在
    1919 年創立，初期分設農業、林業兩科，用來培養相關的技術人才。上述學校在當時是屬於哪一種類型的教育制度？
  options:
  - label: A
    content: 臺北帝國大學
  - label: B
    content: 臺中中學校
  - label: C
    content: 臺北醫學校
  - label: D
    content: 艋舺公學校。
