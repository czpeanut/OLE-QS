- id: doc_113_高雄_英明_社會_歷史_g7s2e2_s1_29
  section: 1
  number: 29
  type: single
  page: 1
  stem: '右表是臺灣在民國 39～77 年間，核准登記的媒體家數統計表。請你依照圖表判斷以下選項何者正確？


    | 年度（民國） | 報紙（種） | 雜誌（種） | 通訊社（家） | 出版社（家） |

    | --- | --- | --- | --- | --- |

    | 39 | 44 | 184 | 28 |  |

    | 50 | 31 | 686 | 42 | 587 |

    | 60 | 31 | 1,534 | 43 | 1,395 |

    | 76 | 31 | 3,422 | 44 | 2,956 |

    | 77 | 126 | 3,708 | 126 | 3,191 |'
