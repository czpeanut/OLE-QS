- id: doc_113_高雄_英明_社會_歷史_g7s2e2_s1_26
  section: 1
  number: 26
  type: single
  page: 1
  stem: 1920 年代，一位臺灣女性在喜帖上聲明：「不用聘金、不用賀禮、不注重一切形式。」《臺灣民報》推崇這是前所未有的聲明、新時代男女結婚的參考。關於這位臺灣女性的日常，可能還有下列何者？
  options:
  - label: A
    content: 和朋友約定會面時間使用天干地支十二時辰計時
  - label: B
    content: 在公家機關上班一周能放假一天
  - label: C
    content: 從小纏足追求三寸金蓮
  - label: D
    content: 平時穿洋裝與朋友一起去逛臺灣第一家百貨公司—林百貨。
