- id: doc_113_高雄_英明_社會_歷史_g7s2e2_s1_27
  section: 1
  number: 27
  type: single
  page: 1
  stem: 「甲」是宜蘭人，1891 年生，他 16 歲才入公學校，成績一路領先，順利考入總督府醫學校，在校時期就是個活躍的政治青年。他以日文寫了一篇文章〈臨床講義：關於名為臺灣的病人〉。他以擬人化來為臺灣看病，他診斷臺灣人患有「知識營養不良症」，治療的方法則是學校、社會的各種教育，而且要馬上服用最大劑量，這樣或可在二十年內根治……。請依據上文敘述判斷，回答選出正確答案：
  options:
  - label: A
    content: 「甲」是指陳澄波
  - label: B
    content: 他成立臺灣地方自治聯盟，試圖改善這個情況
  - label: C
    content: 臺灣人的知識營養不良主要原因為殖民教育的遺毒
  - label: D
    content: 最後「甲」成功看到二十年後臺灣教育改善的情況。
  tags:
    chapter:
      publisher: 翰林
