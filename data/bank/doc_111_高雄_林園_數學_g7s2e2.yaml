  stem: '為了預防新型冠狀病毒傳播，老師購買漂白水提供各班消毒環境。老師告訴小明：｢使用前，漂白水與清水的比例須以 1：99 稀釋調配，才可作為消毒使用。｣根據下列問題，協助小明調配出可用的消毒水。

    (1)若小明希望調配出 5000 公克的消毒水，則小明須分別準備公克的漂白水和清水? (2 分)

    (2)承(1)，小明調配時不小心倒入過多的漂白水於清水中。若倒入的漂白水為 55 公克，且為了讓消毒水維持原來的比例，則小明需再補倒入多少公克的清水? (2
    分)'
  answer:
  - (1) 漂白水 50 公克，清水 4950 公克
  - (2) 495 公克
