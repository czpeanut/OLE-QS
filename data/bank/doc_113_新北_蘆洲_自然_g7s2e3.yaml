- id: doc_113_新北_蘆洲_自然_g7s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 關於生產者、消費者和分解者，下列敘述何者正確？
  options:
  - label: A
    content: 食物鏈中若無初級消費者，則生產者會因過度繁殖而導致水分與光線等資源分配不足，使競爭加劇
  - label: B
    content: 如果沒有消費者，則整個生態系將會毀滅
  - label: C
    content: 如果沒有分解者，生態系一樣可以運轉穩定通暢
  - label: D
    content: 可吸收、利用太陽能的生物是分解者。
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 生物
      code: 4-3
      title: 生態系
      chapter: 第4章 生物與環境
    textbook: 七下生物 4-3 生態系
    labeled_by: ai
