  group_stem: '位於南部非洲內陸的波札那共和國，境內皆為乾燥的高原地形，周圍與南非、納米比亞、辛巴威、尚比亞等國接壤，東北部的國界上有維多利亞瀑布。相較於多數獨裁統治的其他非洲國家，其國民擁有較多的基本人權，故在個人言論、所得財產上明顯受到保障，可說是非洲真正民主化的國家。國內政局在脫離殖民，獨立建國後，並沒有發生太多的內亂及變動，所以過去殖民政府留下的經濟模式與金融體系，得以繼續維持與發展，並得到國際透明組織評比為全非洲最不腐敗的國家，因此得到歐美企業集團的青睞與投資。尤其鑽石開採業，提供全國25%的就業機會，發展規模甚至超越南非共和國，成為全球鑽石產量及產值第一的國家，也讓國民每年收入達到
    10,000 美元以上，改善了偏遠地區的基礎建設、醫療和教育。

    波札那還擁有眾多的野生動植物棲息地，如：有黑尾牛羚、亞科羚羊、哺乳類、雀鳥等野生動物，主要分布於奧卡萬戈三角洲、喀拉哈里沙漠、草原和熱帶莽原。'
