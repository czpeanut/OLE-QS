  - label: D
    content: 李登輝推動「新南向政策」，強化與東協的聯繫。
  group_stem: "一九六○年代，全球正值冷戰高峰時期，中共發動文化大革命並覬覦將勢力擴延至東南亞。在混亂的時代背景下，東南亞五個反共國家馬來西亞、印尼、泰國、菲律賓、新加坡，於西元1967\
    \ 年正式成立東南亞國家協會，而中華人民共和國則視東協為反共集團。\n    東協的成立一方面是為了聯合抵抗各國國內的共產勢力，另一方面則是馬、印、泰等國的領袖有意透過區域平臺進行和解，預防衝突發生。\n\
    \    直至一九七○年代某一國際局勢變化後，東協各成員國開始陸續和中共建交，並解除對華貿易禁令。隨著東歐劇變、蘇聯解體與冷戰結束，中華人民共和國於西元1966\
    \ 年成為東協全面對話夥伴，一樣透過「東協十加三會議」與東協成員國進行共同協商。\n＊節引自中華經濟研究院臺灣東南亞國家協會研究中心資料：〈東協成立50 周年之成就與未來挑戰〉。"
