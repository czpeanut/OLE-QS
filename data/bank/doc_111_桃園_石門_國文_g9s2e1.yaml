- id: doc_111_桃園_石門_國文_g9s2e1_s3_6
  section: 3
  number: 6
  type: single
  page: 1
  stem: '甲、雲霞出海曙，梅柳渡江春。淑氣催黃鳥，晴光轉綠蘋。

    乙、老冉冉其將至兮，恐脩名之不立。朝飲木蘭之墜露兮，夕餐秋菊之落英。

    丙、關關雎鳩，在河之洲，窈窕淑女，君子好逑。參差荇菜，左右流之。窈窕淑女，寤寐求之。

    丁、江南可採蓮，蓮葉何田田，魚戲蓮葉間。魚戲蓮葉東，魚戲蓮葉西，魚戲蓮葉南，魚戲蓮葉北。

    幾位同學試著依序判斷甲～丁所節選的文句或篇章所屬的韻文體裁，何者正確？'
  options:
  - label: A
    content: 佛傑：近體詩／楚辭／詩經／樂府詩
  - label: B
    content: 安妮亞：楚辭／詩經／古詩／樂府詩
  - label: C
    content: 約兒：詩經／楚辭／古詩／近體詩
  - label: D
    content: 戴斯蒙德：近體詩／詩經／楚辭／樂府詩。
  answer:
  - 佳言「雋」語
