  group_stem: "Dear Christian,\nI just came back from a trip to Hokkaido with my mom,\
    \ and I can’t wait to tell you about it!\nOur first stop was Otaru, a beautiful\
    \ town by the sea. We walked along the river and had the delicious sushi at a\
    \ restaurant. We also visited some cute glass shops, and I bought a little glass\
    \ bear for you!\nThe next day, we drove to Furano. There were so many colorful\
    \ flower fields, and they were a sight for sore eyes. We took a lot of photos\
    \ and enjoyed being in nature. You told me about the lavender ice cream before,\
    \ and I tried it, too — it was strange but not bad at all.\nOur last day was at\
    \ Lake Shikotsu. We rented a boat to enjoy the view. The water was so clear, and\
    \ I could even see the bottom of the lake. Guess what? On the way back, we saw\
    \ a bear in the forest! But don’t worry, we were safe in the car. They are really\
    \ cute when they’re not close to me.\nThis trip to Hokkaido was wonderful. Maybe\
    \ we can visit it together next time!\nTiffany\n colorful 色彩繽紛的 field 田野 lavender\
    \ 薰衣草\n strange 奇怪的 rent 租借 bottom 底部"
