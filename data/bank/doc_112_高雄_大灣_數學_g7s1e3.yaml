  section: 1
  number: 22
  type: single
  page: 2
  stem: '以下是甲、乙兩人化簡$\frac{2x+1}{3}-\frac{-3x+2}{2}$的過程：


    | 甲 | 乙 |

    | :--- | :--- |

    | ①將式子乘以6，<br>得$2(2x+1)-3(-3x+2)$<br>②去括號，得$4x+2+9x-6$<br>③化簡得$13x-4$ | ①通分，得
    $\frac{4x+2}{6}-\frac{-9x+6}{6}$<br>②兩個式子合併，得 $\frac{4x+2+9x-6}{6}$<br>③化簡得 $\frac{13x-4}{6}$
    |


    對於兩人的化簡過程，下列判斷何者正確？'
  options:
  - label: A
    content: 甲錯誤，乙正確
  - label: B
    content: 甲、乙都正確
  - label: C
