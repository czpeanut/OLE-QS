- id: doc_113_新北_永和_國文_g7s1e1_s6_35
  section: 6
  number: 35
  type: single
  page: 6
  stem: 文中所述，造成「降低冷氣機的使用壽命」的最主要原因為何？
  options:
  - label: A
    content: 電廠的發電量不足，造成冷氣機轉速不正常
  - label: B
    content: 冷氣機硫氧化物和氮氧化物的排放不順
  - label: C
    content: 冷氣外流，使得冷氣機必須不斷運轉，以維持室內溫度
  - label: D
    content: 空氣汙染導致冷氣機通風阻塞
  group_stem: "夏季冷氣省電小祕訣                    經濟部 能源委員會\n    據估計，臺灣地區光是夏季冷氣的用電量，相當於一座大型電廠的發電量。如此驚人的數據，不僅說明了能源的快速消耗，同時更顯示了環境被嚴重的破壞。冷氣外流，是造成冷氣機耗電的最主要原因。為了快速的補充冷氣，以維持室內溫度，冷氣機必須不斷運轉，如此不但降低了冷氣機的使用壽命，更增加了能源的浪費和環境的汙染。（例如：硫氧化物和氮氧化物的排放。）\n\
    防止冷氣外流可用如下簡易方法：\n1. 房屋加裝窗簾或使用雙層玻璃可以防止冷風入侵並有隔熱效果。\n2. 避免一面開冷氣一面開窗，謹記隨手關閉房門。\n3.\
    \ 於房屋外牆種植爬牆植物，亦可以阻隔陽光直接照射。\n如何保養窗型冷氣機：\n1. 每兩週清洗空氣過濾網一次，空氣過濾網太髒時，容易造成電力浪費。\n2.\
    \ 依室外空氣汙濁程度，每一至三年應請廠商清洗散熱片一次。\n3. 溫度感測控制器異常時，較為耗電，應即時請廠商修復。\n4. 不明原因造成冷氣機不冷時，不宜勉強使用，避免浪費電力，造成機件故障。"
