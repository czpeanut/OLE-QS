- id: doc_113_高雄_英明_國文_g8s2e1_s5_3
  section: 5
  number: 3
  type: single
  page: 5
  stem: 本文之主旨為勉人如何？
  options:
  - label: A
    content: 安於平凡生活
  - label: B
    content: 樂於和而不同
  - label: C
    content: 勇於克服困難
  - label: D
    content: 善於即事生悟。
  group_stem: "生活裡的種種，隱含著無限的哲思。食衣住行，日常的細節，都可以觸發靈感，就看你是否善於觀察，善於體會。\n  有人從炒菜的油鍋裡，領悟出君子與小人的道理。油的滑膩濃稠是小人，水的清白恬淡是君子。水可以使不潔的歸於潔，油則使潔的變成不潔。君子群裡投進一個小人，就像滾水中滴進一滴油，水可以默默容納油，但水歸水，油歸油，乃是和而不同的；若是小人堆裡投進一個君子，就像滾油中滴進一滴水，油是激搏爆濺，絕不相容，非把水炸到兩敗俱傷，是不肯罷休的！所以從水與油裡，可以覺察君子與小人相處的情狀。\n\
    \  有人從劈柴之中，領悟出讀書做事的要訣。讀書不能盡選些軟熟輕鬆的東西來讀，做事也不能畏避困難棘手的問題去做；讀書要攻堅，做事要克服難關，才有成就感。就像劈柴時，不遇到盤根錯節的結節硬塊，就分辨不出哪一把斧頭是真正可信的利器！\n\
    \  有人從梳洗打扮裡，體悟出才人高士的寂寞，以領會處世的哲思。梳洗打扮，只求隨著自己的臉型個性，作適宜的化妝，顯出個人特有的俏麗就可以了。所謂「隨宜梳洗莫傾城」，何必弄成傾國傾城，絕世獨立，教人難以相配呢？高士的行為太高則毀謗叢集，才人的才思太美也忌刻叢生，都與傾國傾城一樣的寂寞，倒不如隨宜梳洗，少戴昂貴的首飾，少展矜貴的姿色，平易近人，教人可親。\n\
    \  人人心頭原都有這一點靈犀，只要能觸事生悟，就可妙應無窮。\n（黃永武 生活的哲思）"
  tags:
