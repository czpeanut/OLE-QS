- id: doc_113_桃園_桃園_社會_歷史_g7s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '某政權在統治台灣四十周年時舉辦盛大的紀念活動，右表為其中部分展場介紹。官方還在大稻埕設立分會場，宣揚當時積極推動的國策。根據展覽的時間與內容判斷，大稻埕分會場可能出現下列何種介紹?

    | 場館 | 展示內容 |

    | --- | --- |

    | 交通土木館 | 鐵道、通訊、港口等相關建設 |

    | 糖業館 | 各地製糖會社的產品 |

    | 興業館 | 中央研究院所推動台灣工業發展的成果 |'
  options:
  - label: A
    content: 近期培育的新品種蓬萊米，使稻米產量大幅提升
  - label: B
    content: 連接基隆、高雄兩地的鐵路即將完工，交通將更便利
  - label: C
    content: 大員與長崎商館獲利甚豐，可支援我軍北上攻佔聖多明哥城
  - label: D
    content: 東南亞特產與資源十分豐富，是帝國接下來發展的重要目標。
