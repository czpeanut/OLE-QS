- id: doc_113_桃園_桃園_社會_歷史_g7s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: '台灣總督府桂太郎曾在會議中提出其施政方針如下:

    內地法規雖宜逐漸施於台灣，然因人情風俗語言不同，若撤銷彼此之區別，而繩之以同一法規，難免彼此衝突，且不能達到保護人民生命財產之目的，故應隨著地方行政之推行，調查各地人情風俗語言之異同，其法規之不適合者，以敕令或律令訂定特殊規程，以期達成法規之目的。

    關於這位總督提出的施政方針，下列何者說明正確?'
  options:
  - label: A
    content: 此為依實際情況制定政策的無方針主義
  - label: B
    content: 此施政方針受到民族自決思潮的影響
  - label: C
    content: 此總督希望將日本制度直接沿用至台灣
  - label: D
    content: 此政策是將台人改造為效忠天皇的子民
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 歷史
      code: 1-2
      title: 日本治臺政策的演變
      chapter: 第1章 日治時期的政治
    textbook: 七下歷史 1-2 日本治臺政策的演變
    labeled_by: ai
