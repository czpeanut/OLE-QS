  page: 2
  stem: 台灣某政黨曾發表電文指出:「我黨認為此事件是恣意搾取及生活上之迫害與駐在警官不正、貪戾、殘忍之處置所激發者。應從速將總督、警務局長、臺中州知事以下責任者撤職，並立即保證蕃人之生活，承認其自由，不阻礙其民族發展之政策，並宜乘此機會，對向來為保持官吏威嚴，放任警察萬能之積弊，加以徹底的改革。」關於這則電文的說明，下列何者敘述正確?
