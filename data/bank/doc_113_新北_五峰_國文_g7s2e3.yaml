- id: doc_113_新北_五峰_國文_g7s2e3_s2_30
  section: 2
  number: 30
  type: single
  page: 3
  stem: 從文中犰狳在失去氣味後死亡的情形，可推知犰狳最無法適應的是什麼？
  options:
  - label: A
    content: 鐵欄構成的環境限制
  - label: B
    content: 管理員餵食的方式
  - label: C
    content: 缺乏嗅覺安全感的環境
  - label: D
    content: 沒有群體生活的孤獨。
  group_stem: "請閱讀以下短文，並回答30-32 題：\n\n很多動物以分泌物或排泄物的氣味來表示自己的勢力範圍，並吸引異性。犰狳是以在自己的活動範圍內撒尿來做記號，尿的氣味好像一堵無形的圍牆，當牠們置身在自己氣味的氛圍內時，就會有一種安全感。\n\
    \  在野地被捕獲的犰狳，放到動物園內時，雖然四面是鐵欄，但因失去了那代表安全的氣味，有些竟離奇地死亡。其他的則連忙在牢籠四周撒尿做記號，以確認自己的地盤。盡職的動物園管理員如果將這些尿漬清洗掉，犰狳立刻又會再撒尿「護盤」，如此反覆進行尿液的清除與保衛戰，直到有幾隻犰徐因撒尿太多「脫水」而死，管理員才悟出其中的道理。\n\
    \  啟示：一個人的行為必然有其原因，不問原因而想糾正他，「單純地為他好」，通常是愛之適足以害之。\n (節選自 王溢嘉動物啟示錄)"
  tags:
