- id: doc_113_新北_五峰_國文_g7s2e3_s2_34
  section: 2
  number: 34
  type: single
  page: 4
  stem: '大明、阿智和小美正在聊家中長者的近況，請根據海報內容判斷，誰的家人行為出現了失智症早期警訊？

    大明：跟你們說，我奶奶最近好奇怪喔！常常把洗好的襪子放到冰箱的冷凍櫃裡去，害我每次要穿的時候都找很久。

    阿智：哈哈！感覺妳奶奶是個很有趣的人耶！現在天氣那麼熱，她搞不好是想讓你穿冰冰涼涼的襪子啊！ 說到冰箱，我爺爺最近買了好多冰棒喔！冷凍庫都快爆了。我有叫他不要再買，可是他每次都不記得家裡已經有一大堆了。我也問他為什麼要買這麼多，他支支吾吾的，不太回答得出來，但我爺爺以前講話超溜的。不過沒差，冰才不嫌多呢！

    小美：別說了啦！好羨慕你，我姨婆超兇的，都不讓我吃零食。最近我考試考不好，她又對我更嚴格了，竟然還每天幫我安排讀書計畫，想放鬆一下也不行。'
