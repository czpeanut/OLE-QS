  group_stem: '科學素養題：真假皇冠-阿基米德 的傳人


    阿基米德可能使用了浮力的原理來判斷黃金王冠的密度是否小於等質量的純金塊。

    希倫二世國王，請金匠用純金打造了一頂純金王冠，做好了以後，吹哨者密報金匠造假摻了「白銀」在裡面，但是又不能把王冠毀壞來鑑定。阿基米德想了好久，一直沒有好方法，吃不下飯也睡不好覺。有一天，他在洗澡的時候發現，當他坐在浴盆裡時水位上升了，這使得他想到了：「上升了的水位正好應該等於王冠的體積，所以只要拿與王冠等重量的金子，放到水裡，測出它的體積，看看它的體積是否與王冠的體積相同，如果王冠體積更大，這就表示其中造了假，摻了銀。」……，經過證明之後，純金王冠中確實含有白銀，阿基米德成功的揭穿了金匠的舞弊詭計。

