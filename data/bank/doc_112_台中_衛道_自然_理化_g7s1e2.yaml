    阿基米德的方法待測物體必需是沉體，對於浮體則測量方式較繁複……。

    所以阿基米德的傳人楊先生提出了--密封法：$V_{物}$：待測物體體積、$W_{物}$：待測物重量、

    $W_{1}$、$W_{0}$：如下圖所示測得之重量、箱內液體為水，水密度=$1\text{g/cm}^{3}$

