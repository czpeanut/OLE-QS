  group_stem: "一市人，貧甚，朝不謀夕。偶一日，拾得一雞卵，喜而告其妻曰：「我有家當矣。」妻問安在。持卵示之曰：「此是，然須十年，家當乃就①。」因與妻計曰：「我持此卵，借鄰人伏雞②乳之，待彼雛成，就中取一雌者，歸而生卵，一月可得十五雞。兩年之內，雞又生雞，可得雞三百，堪易③十金。我以十金易五牸④，牸復生牸，三年可得二十五牛。牸所生者，又復生牸，三年可得百五十牛，堪易三百金矣。\n\
    \    吾持此金以舉債⑤，三年間，半千金可得也。就中以三之二市⑦田宅，以三之一市僮僕買小妻。我與爾優以終餘年，不亦快乎！」妻聞欲買小妻，怫然⑥大怒，以手擊雞卵碎之，曰：「毋留禍種。」\n\
    \                                                                (節選自江盈科雪濤小說．妄心)\n\
    注釋:①就:成功、完備  ②伏雞:孵蛋的雞  ③易:交換  ④牸:ㄗˋ，母牛  ⑤舉債:放債 \n     ⑥怫然:生氣的樣子  ⑦市:買"
