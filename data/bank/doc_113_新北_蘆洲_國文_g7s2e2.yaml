  group_stem: "孔子行，聞哭聲甚悲。孔子曰：「驅！驅！前有賢者。」至則皋魚也，披褐擁鎌①，哭於道旁。\n 孔子辟車②與之言曰：「子非有喪，何哭之悲也？」皋魚曰：「吾失之三矣：少而學，遊諸侯，以後吾親③，失之一也；高尚吾志，間吾事君④，失之二也；與友厚而小絕之，失之三矣！樹欲靜而風不止，子欲養而親不待也。往而不可得見者親也！吾請從此辭矣！」立槁而死。孔子曰：「弟子戒之，足以識⑤矣！」於是門人辭歸而養親者十有三人。\n\
