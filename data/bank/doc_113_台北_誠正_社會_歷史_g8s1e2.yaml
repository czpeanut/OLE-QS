  type: single
  page: 1
  stem: '小芬跟同學介紹中國歷史上的某個民族：「這個民族曾建立龐大的帝國，國土橫跨歐亞大陸。在征服土地的過程中，因為戰術強大，曾引起西方的震驚與恐慌。」

