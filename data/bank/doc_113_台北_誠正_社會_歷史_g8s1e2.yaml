- id: doc_113_台北_誠正_社會_歷史_g8s1e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: '歷史課時，老師請同學分組討論「宋元時期的經濟貿易」，但有幾組同學的討論偏離主題，被老師要求修正。請問：下列哪幾組的討論主題，會被老師要求修正？

    第一組：專業市鎮的出現—江西景德鎮聞名全國

