- id: doc_113_台北_誠正_社會_歷史_g8s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 《馬可波羅遊記》中有一段對泉州港口的描述：「泉州是世界上最大的港口之一，大批外國商人雲集這裡，貨物堆積如山。每一個商人，必須付自己投資的總額百分之十的稅收，所以，大汗從這個地方獲得了巨額的收入，商人也能取得很大的利潤。」請問：關於這段敘述，下列何者正確？
  options:
  - label: A
    content: 遊記中記錄的是宋朝統治下的泉州
  - label: B
    content: 負責向商人收稅的機構是市舶司
  - label: C
    content: 當時代的外國商人只能透過海路前來中國貿易
  - label: D
    content: 當時代指南針技術已由阿拉伯傳入中國
