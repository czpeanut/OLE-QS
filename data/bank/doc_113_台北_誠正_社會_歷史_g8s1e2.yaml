- id: doc_113_台北_誠正_社會_歷史_g8s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: '明清帝國是中國歷史最後的兩個朝代，此時期因與周邊政權關係密切，因而加深了帝國局勢的複雜性。請問：關於明清帝國的敘述，下列哪些正確？

    (甲)元朝末年天下大亂，朱元璋平定流寇，建立明朝

    (乙)明朝中期因內政腐敗，加上蒙古進犯、倭寇騷擾，國勢漸衰

    (丙)明朝後期，女真族崛起於東北，改名為「滿洲」，威脅明朝政權。

    (丁)明朝末年，滿洲政權攻陷北京，導致明朝滅亡。'
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲丁
  - label: C
    content: 乙丙
  - label: D
