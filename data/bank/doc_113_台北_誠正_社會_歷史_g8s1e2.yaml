  section: 1
  number: 4
  type: single
  page: 1
  stem: '小芬最近在看一本以宋朝社會作為背景的古風小說，但她發現小說中有些敘述並不符合史實。請問：下列哪一句(些)小說中的敘述，「不符合」故事的時代設定？

    (甲)男主為了能透過科舉考試光耀門楣，苦讀科舉考試的定本《四書集注》

    (乙)男主在市集的書坊見到運用活字版印刷術印製的書籍

    (丙)男主掏出身上的寶鈔，想買一支髮簪送給女主

    (丁)女主酷愛詩畫，聽說《清明上河圖》描繪汴京的城市生活，心生嚮往。'
