  page: 1
  stem: '歷史課時，老師要同學發表對「中國古代科技成就」的看法，下面四位同學所講的內容，哪幾位符合史實？

    甲生：「元代畢昇發明活字印刷術，改善以往印刷不能重新排版的缺點，提高了印刷效率。」

    乙生：「蒙古西征將造紙術傳入歐洲，刺激歐洲文化的發展。」

    丙生：「指南針在宋代開始用於航海，透過阿拉伯人傳入歐洲，有助於日後新航路的發現。」

    丁生：「火藥在宋代運用於戰爭，經蒙古人改良後傳入歐洲。」'
