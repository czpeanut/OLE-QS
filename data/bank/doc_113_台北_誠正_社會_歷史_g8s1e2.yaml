  stem: 燕雲十六州為古代地理名詞，所處地勢居高臨下，易守難攻，自秦漢以來，此地區便是農業民族抵禦北方草原民族南下的戰略要地。自從燕雲十六州被外族控制之後，漢人王朝失去了與北方草原民族之間的天然防線。請問：燕雲十六州在唐朝滅亡後不久為哪一民族所佔領？
