    content: 宋代重視科舉制度，忽略其他發展
  - label: B
    content: 宋代經濟衰弱，影響軍事力量
  - label: C
    content: 宋代偏重文人政治，縮減武將權力
  - label: D
    content: 宋代強敵環伺，科技技術落後
