    注釋：

    ①青青子衿：你那藍色的衣領

    ②悠悠：憂思的樣子

    ③縱：即使

    ④子寧不嗣音：你難道不能繼續傳遞音訊？

    ⑤挑兮達兮：走過來又走過去

    ⑥城闕：城門上的望樓


    如何讓你遇見我

    在我最美麗的時刻 為這

    我已在佛前 求了五百年

    求他讓我們結一段塵緣


    佛於是把我化作一棵樹

    長在你必經的路旁

    陽光下慎重地開滿了花

    朵朵都是我前世的盼望


    當你走近 請你細聽

    那顫抖的葉是我等待的熱情

    而當你終於無視地走過

    在你身後落了一地的

    朋友啊 那不是花瓣

    是我凋零的心

    ＜席慕蓉・一棵開花的樹＞'
