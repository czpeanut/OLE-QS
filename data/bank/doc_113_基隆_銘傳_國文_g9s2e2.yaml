- id: doc_113_基隆_銘傳_國文_g9s2e2_s3_39
  section: 3
  number: 39
  type: single
  page: 6
  stem: 根據本文，下列敘述何者正確？
  options:
  - label: A
    content: 政府規定回收二手衣並非舊衣氾濫的原因
  - label: B
    content: 捐舊衣做愛心兼行環保是造成二手衣氾濫的原因之一
  - label: C
    content: 捐出自己不再需要的廢棄物是「恩典牌」的意涵
  - label: D
    content: 「恩典牌」可解決貧窮孩子穿舊衣的問題
  group_stem: "「恩典牌」不是專指單一的時尚品牌，而是一種人間善意流動的總稱。把用不到的衣物、用品、電器、鍋碗……整理並檢修後，送給想要或需要的人家，讓循環再利用成為生活習慣，不但皆大歡喜，更讓地球有了小小喘息的機會，不會又多出一堆垃圾廢棄物……。\n\
    \    古時候有個民間習俗，嬰兒出生時，父母會挨家挨戶向鄰居祈求一塊舊布，然後用收集來的數百塊舊布縫製成嬰兒的衣服，稱為「百衲衣」。據說能保祐嬰兒平安成長、長命百歲。孩子成長的速度非常快，衣服一季穿沒多少次，隔年就穿不下了，購買時很貴，但擺在家裡用不到又占空間。直接扔掉似乎又捨不得，難怪朋友們把衣服送給我們時那麼感謝，因為幫他們解決了一個大難題啊！\n\
    \    五年前臺灣有個調查發現：每個民眾的衣櫃裡平均有七十五件衣服，其中有二成幾乎沒有在穿的。舊衣服之所以會這麼多，全世界的快時尚品牌是罪魁禍首之一。這些服裝公司超量製造，超量傾銷取得最低成本，以非常便宜的價格吸引消費者，再加上網購的便利，又自以為不要的衣服捐給需要的人是做善事又環保，所以心安理得地不斷買、不斷丟。\n\
    \    快時尚造成的資源浪費與環境汙染，近年來已引起廣泛關注，法國政府開出第一槍，2020 年 2 月通過反浪費及循環經濟法規範了服裝、食物、藥材、建材、電子產品等物品的回收規定，強制要求製造商或通路，必須對產品的最終處理負起責任，同時不能隨意丟棄或銷毀未售出的全新產品。\n\
    \    近年開始出現的網路二手衣交換或銷售平臺，也許是個方式，轉送給親朋好友也很好，然而最好的方式，還是從減少購買的源頭做起。\n＜李偉文・減少購買，零浪費＞"
