- id: doc_113_基隆_銘傳_國文_g9s2e2_s3_37
  section: 3
  number: 37
  type: single
  page: 5
  stem: 下列關於琉璃珠的敘述何者正確？
  options:
  - label: A
    content: 傳統排灣族社會只有頭目及貴族才能買得起琉璃珠
  - label: B
    content: 琉璃珠的美麗傳說和排灣族的孔雀王子及天神的女兒穆莉淡的愛情故事有關
  - label: C
    content: 琉璃珠在傳統排灣社會代表的宗教意義和階級性指標遠超過裝飾性意義
  - label: D
    content: 排灣族相信琉璃珠具有神秘力量，能占卜吉凶
  group_stem: "排灣族有三寶：青銅刀、陶壺及琉璃珠。其中的琉璃珠不僅色彩斑斕，每個圖珠皆有特別的象徵與神秘的力量，代表著排灣族人的信仰。\n    琉璃珠背後有個美麗的傳說。相傳有一天，天神化作孔雀王子，到人間遊玩，遇見排灣族大頭目的女兒穆莉淡，孔雀王子被這位美麗的女子吸引，想娶她為妻，但是頭目不答應。孔雀王子雖然感到難過但仍不放棄，振翅飛向天際，並從羽翼間撒下了一顆顆美麗的琉璃珠當作聘禮，同時帶著公主消失在彩虹的另一端。因此，傳說中的琉璃珠又稱為「孔雀珠」，是排灣貴族傳家或婚聘時不可或缺的寶物。\n\
    \    琉璃珠與排灣族社會的關係源遠流長，在傳統社會中，只有頭目階級才能擁有深具價值的琉璃珠，平民只能擁有一般的琉璃珠，代表持有者的特殊身分和地位的尊貴。琉璃珠除了代表社會階級、地位外，還兼具宗教意義，排灣族人相信琉璃珠具有神秘力量，能祈福保護，也能降禍懲戒。故琉璃珠在傳統排灣族社會所代表的宗教意義與階級性指標，遠遠超過裝飾性意義。\n\
    ＜排灣族三寶之一：琉璃珠＞\n❖手腳之珠：以紅色為底色的圓柱體，上面畫滿了黃、綠、白的斑紋。代表著精明、睿智，有智勇兼備的涵義。\n❖眼神之珠：為深綠色或黃色的圓柱體，上面有像眼睛一樣的同心圓紋路，由白、紅、藍、黃所組成。是象徵看管、保安、守護的珠子。\n\
    ❖孔雀之珠：基底為白色的圓柱體，上面圍繞著以藍、黃、橘、紅等顏色所組成的羽毛圖案，像極了孔雀尾花的花紋。這個珠子象徵的是愛情。\n❖土地之珠：基底為白色的圓柱體，以黑、紅、綠、黃依序環繞出上下兩層之色塊，像極了田畝。此珠代表擁有地權和無上的財富，在以往的排灣族社會中甚至具有土地權狀的功用。\n\
    ❖日光之珠：基底為白色的圓柱體，由中心向外依次畫上紅、黃、藍等波浪紋。這個珠子象徵高貴與地位，不僅是貴族婚姻中不可或缺的重要聘嫁禮，更是頭目身分的證明。"
