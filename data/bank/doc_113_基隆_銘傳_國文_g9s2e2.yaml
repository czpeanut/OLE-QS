- id: doc_113_基隆_銘傳_國文_g9s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: '蜀之鄙有二僧，其一貧，其一富。貧者語於富者曰：「吾欲之南海，何如？」富者曰：「子何恃而往？」曰：「吾一瓶一缽足矣。」富者曰：「吾數年來欲買舟而下，猶未能也。子何恃而往？」越明年①，貧者自南海還，以告富者，富者有慚色。

    注①越明年：過了第二年，即第三年

    根據本文，若貧僧於乙巳年出發，依傳統干支紀年法推算，他回來時應該是哪一年？'
  options:
  - label: A
    content: 丙午年
  - label: B
    content: 丁未年
  - label: C
    content: 甲子年
  - label: D
    content: 戊申年
  lesson_raw:
    title: 為學一首示子姪
    basis: 引用彭端淑《為學一首示子姪》（蜀之鄙有二僧）課文
