  stem: 根據本文，下列敘述何者正確？
  options:
  - label: A
    content: 愛玉凍最早在嘉義被當成夏日食品販賣
  - label: B
    content: 早期臺灣民眾可食用愛玉凍和仙草冰消暑
  - label: C
    content: 根據內容可推知愛玉原產地應在嘉義
  - label: D
    content: 後人可在《臺灣府誌》中找到仙草凍與愛玉凍的作法
  group_stem: "臺灣為熱帶之地，三十年前無賣冰者，夏時僅啜仙草與愛玉凍。按《臺灣府誌》謂：「仙草高五、六尺，晒乾可作茶，能解暑毒。煮爛絞汁去渣，和粉漿再煮成凍，和糖泡水，飲之甚涼。」而愛玉凍則府、縣各誌均未載。\n\
    \    聞諸故老，謂道光初有同安人某，居府治媽祖樓街，每往來嘉義，辦土宜①。一日過後大埔，天熱甚渴，赴溪飲。見水面成凍。掬而啜之，冷沁心脾。自念此間暑，何得有冰？細視水上，樹子錯落，揉之有漿，以為此物化之也。拾而歸家。子細如黍，以水絞之，頃刻成凍，和糖可食。或合兒茶少許，則色如瑪瑙。某有女曰「愛玉」，年十五，長日②無事，出凍以賣，人遂呼為「愛玉凍」。\n\
    ＜臺灣詩薈・臺灣漫錄＞\n注釋：①辦土宜：採買土產  ②長日：夏季的白天"
