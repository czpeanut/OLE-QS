  group_stem: "閱讀二\n    鐮形血球貧血症是一種體染色體隱性疾病，患者的血紅素$\\beta$球蛋白基因發生點突變。若以S代表正常血紅素基因，S'代表突變基因，鐮形血球貧血症患者基因型為S'S'，通常幼年期即夭折，而血球正常者其基因型為SS。鐮形血球性狀帶因者，其基因型為SS'，此種異型合子的血液中仍有若干紅血球呈鐮刀形，通常不發生嚴重貧血症狀，但在體內缺氧時，便會產生貧血症狀，如登高山或長時間運動後。\n\
    \    瘧疾在非洲造成許多死亡，然而鐮型血球貧血症患者因血球的型態與正常人不同，瘧原蟲無法在鐮刀形紅血球內成長，因禍得福而不會感染瘧疾。特別的是，帶因者(SS')在瘧疾流行區，存活率較基因型為SS之正常個體高。"
