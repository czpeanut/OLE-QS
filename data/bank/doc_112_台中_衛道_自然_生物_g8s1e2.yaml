  group_stem: "閱讀一\n    血友病是一種性聯遺傳疾病(控制該性狀的基因位於性染色體)，由於患者的基因缺陷，造成血液中缺乏第八和第九「凝血因子」，因此血液比其他人更不容易凝固。雖然血友病患者受傷時出血的速度並不會比常人快，但因為血液難以凝固，即使只是輕微的瘀傷、割傷，就連拔牙的傷口或是任何的內出血，都可能因為出血不止造成致命危險。與血友病有關的基因位於性染色體中的X染色體上。因為男性只有一條X染色體，所以只要該等位基因不正常，即帶有血友病隱性等位基因(h)，就會患病(基因型為$X^{h}Y$)。而女性因為有兩條X染色體，故要兩條X染色體都帶有血友病隱性等位基因(基因型為$X^{h}X^{h}$)才會生病。如果女性體內只有一條帶有致病的等位基因，則稱為帶因者(基因型為$X^{H}X^{h}$)，本身雖然不生病，但卻可能將此致病基因傳遞給孩子。\n\
    \    血友病被認為起源於英國的維多利亞女王(Queen Victoria)，因為自然突變而成為血友病的帶因者。她將此致病因子傳遞給了其中3位孩子：兒子利奧波德在成年後，因意外受傷後血流不止而去世；女兒愛麗絲和彼阿特麗斯則如同母親成為血友病的帶因者，繼續將致病的$X^{h}$染色體分別傳進了西班牙和俄羅斯沙皇的歐洲皇室中，也因為如此，血友病在歐洲皇家中共為流傳，故也被稱為「皇家疾病(Royal\
    \ disease)」。"
