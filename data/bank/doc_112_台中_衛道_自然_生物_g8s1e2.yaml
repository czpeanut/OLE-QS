  type: single
  page: 3
  stem: 爬蟲類決定性別的方式很特殊，有部分種類和人類一樣用性染色體決定性別，而另一部分卻是以孵化時周遭環境的溫度來決定性別。以綠蠵龜為例，當周圍的沙子溫度較高時，會孵化出雌性；溫度較低時才孵化出雄性。然而澳洲的鬃獅蜥卻有兩種決定性別的機制，一種由染色體決定，另一種則由溫度決定；當氣溫高於攝氏33度的孵化環境下，鬃獅蜥的性別就取決於溫度，且只產生雌性，即使牠的染色體為雄性的染色體。在現今因溫室氣體的排放使得全球暖化的情況下，這些依靠溫度決定性別的生物，未來的命運堪憂。下列關於本文的敘述何者正確？
