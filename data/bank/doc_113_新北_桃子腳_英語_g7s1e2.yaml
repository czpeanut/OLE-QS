- id: doc_113_新北_桃子腳_英語_g7s1e2_s6_35
  section: 6
  number: 35
  type: single
  page: 3
  stem: What is the reading about?
  options:
  - label: A
    content: Why is K-pop so famous?
  - label: B
    content: Where is the meet-and-greet?
  - label: C
    content: Who are K-pop stars?
  - label: D
    content: What are songs of BTS?
  group_stem: 'K-pop is short for Korean pop music. Musicians mixed Korean music with
    pop, hip-hop, and R&B to make something new from 1990s. Some boy groups like H.O.T.
    and Seo Taiji are popular and famous. K-pop stars, or K-pop idols. They sing and
    dance for many years before they show in front of everyone. Some big companies
    like SM, JYP, and YG make fun songs and cool music videos for them.

    K-pop is famous because of the internet. Fans around the world watch videos on
    YouTube. Groups like BTS and BLACKPINK now are super popular. BTS’s songs are
    about people’s life and they are cool. BLACKPINK is special and their dancing
    is great. Now, people everywhere are in the meet-and-greet! It is fun, exciting,
    and make people from all over the world together.

    Now, many people love K-pop very much over the world!

     musician 音樂家 mixed 混和 group 團體 before 之前 company 公司'
