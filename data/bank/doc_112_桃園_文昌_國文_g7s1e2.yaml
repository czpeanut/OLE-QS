  stem: 根據文意，子夏「和而不和，彈之而不成聲」的原因為何？
  options:
  - label: A
    content: 彈奏的琴品質糟糕
  - label: B
    content: 心情未平復，無法得心應手
  - label: C
    content: 太久沒彈了，功力退化
  - label: D
    content: 家中有事，欲尋理由繼續請假。
  group_stem: '子夏既①除喪②而見(孔子)，(孔子)予之琴，和③而不和④，彈之而不成聲。作⑤而曰：「哀未忘也。先王制禮⑥，而弗敢過⑦也。」子張既除喪而見(孔子)，(孔子)予之琴，和之而和，彈之而成聲。作而曰：「先王制禮，不敢不至⑧焉。」

    ―《禮記•檀弓上》

    ① 既：已經。②除喪：脫去喪服，指服完喪。③「和」而不和：音 ㄏㄜˋ，調弦使音調和諧。

    ④和而不「和」：音 ㄏㄜˊ，和諧。⑤作：起來、起身。⑥制禮：制定禮儀規範，制定守喪期為三年。⑦過：超過。

    ⑧不至：未達，不遵守。'
