- id: doc_112_桃園_文昌_國文_g7s1e2_s3_27
  section: 3
  number: 27
  type: single
  page: 3
  stem: '子夏問孝。子曰:「色難①!有事，弟子服其勞;有酒食，先生②饌③，曾④是以為孝乎?」

    ①色難:指和顏悅色。②先生:指父兄。③饌:ㄓㄨㄢˋ，吃喝。④曾:ㄗㄥ，竟然。 —《論語•為政》

    孟武伯問孝。子曰:「父母唯⑤其疾之憂⑥。」

    ⑤唯:只有。⑥其疾之憂:即「憂其疾」，擔心子女是否生病。 —《論語•為政》

    孔子回答子夏與孟武伯詢問孝道，其內容誠然不同，這種情形是因為孔子的教學方法為何?'
  options:
  - label: A
    content: 有教無類
  - label: B
    content: 有感而發
  - label: C
    content: 因材施教
  - label: D
    content: 舉一反三。
  lesson_raw:
    title: 論語選
    basis: 引述論語選相關文句
- id: doc_112_桃園_文昌_國文_g7s1e2_s3_28
  section: 3
  number: 28
  type: single
  page: 4
  stem: 根據文章脈絡和前後文句，標示①②③④的詞語分別為以下何者？
  options:
  - label: A
    content: 特定事實、公然侮辱、特定事實、誹謗
  - label: B
    content: 誹謗、公然侮辱、具體事實、誹謗
  - label: C
    content: 公然侮辱、特定事實、誹謗、公然侮辱
  - label: D
    content: 公然侮辱、誹謗、特定事實、公然侮辱。
  group_stem: '【題組】

    小俊剛走出校門，就看到一群人在路邊聚集，鬧哄哄的。小俊好奇的想知道發生什麼事，走近後，才看見是一名男同學與女同學似乎因為細故發生爭執，互相叫罵。

    「你就是一個騙子，不要臉！○○○的錢包就是你偷的，你就是小偷！」男同學對女同學說。

    「我才沒有偷任何人的東西。你才是白癡、神經病，腦袋裡裝大便！」女同學也不甘示弱的回應。

    「你不但偷東西，還亂勾引其他人，亂搞男女關係。」男同學繼續叫罵。

    「我沒有，你亂說，我要告你誹謗！」女同學氣得臉都紅了。

    聽了他們對話後，小俊想起昨天看到的新聞，有人因為亂說話被判決公然侮辱罪成立，究竟公然侮辱跟誹謗有什麼差別呢？

    刑法中關於妨害名譽，分別規定在刑法第三百零九條公然侮辱罪，與第三百一十條誹謗罪。

    「______①」指的是不講述具體事實，用足以貶損他人的輕蔑言語、文字、行為等，讓人在精神或心理上感到難堪或不快，達到貶低他人人格的行為；而「______②」，則是指針對「______③」，明明知道不是真實，卻惡意捏造散布讓其他人知悉，毀損他人的名譽。

    例如案例中，罵人「不要臉」、「白癡」、「神經病」等言語，都是用負面的字眼抽象謾罵，沒有講述具體事實，使人難堪、名譽減損，因此屬「______④」。

    男同學所說「○○○的錢包就是你偷的！」、「亂勾引其他人，亂搞男女關係。」都是針對「特定事實」的指涉。如果男同學明知不是事實，卻公然散布、發表不實言論，貶低女同學名譽，則可能構成「誹謗」。

    值得注意的是，公然侮辱與誹謗的言論都需要「公開散布」讓多數人見聞知悉，如果只是一對一的私人對話，或私下傳訊息謾罵，就不構成妨害名譽。

    此外，公然侮辱罪與誹謗罪都是告訴乃論之罪，名譽受到貶損的人，要在知悉犯罪事實，或犯罪人起六個月內提起告訴，否則過了告訴期間，會受到檢察官不起訴處分。

    ―轉載自《教育部人權及轉型正義教育資源網 》'
