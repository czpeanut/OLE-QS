- id: doc_112_桃園_文昌_國文_g7s1e2_s3_6
  section: 3
  number: 6
  type: single
  page: 1
  stem: 以下句中所運用的成語何者正確？
  options:
  - label: A
    content: 能夠為身邊的人著想，不就是「以鄰為壑」？
  - label: B
    content: 她的容貌動人，可說是「蒲柳之姿」。
  - label: C
    content: 就這樣如「陽春白雪」的一首歌，肯定是流行且通俗。
  - label: D
    content: 雖然懂得修飾外在，但是談話內容膚淺，不離「沐猴而冠」。
- id: doc_112_桃園_文昌_國文_g7s1e2_s3_7
  section: 3
  number: 7
  type: single
  page: 1
  stem: 以下句中所運用的成語何者正確？
  options:
  - label: A
    content: 睡著的人呼吸輕淺，確實可以說是「奄奄一息」。
  - label: B
    content: 牧草豐美又水質清澈，難怪能將馬匹養得「六馬仰秣」。
  - label: C
    content: 他長得壯碩無匹，當代的人都稱其為「冰肌玉骨」。
  - label: D
    content: 仰看此地關卡險峻、浪濤洶湧，自古即是「表裡山河」。
- id: doc_112_桃園_文昌_國文_g7s1e2_s3_8
  section: 3
  number: 8
  type: single
  page: 1
  stem: 「容光煥發」和「人老珠黃」的關係猶如以下何者？
  options:
  - label: A
    content: 「昂藏七尺」和「器宇軒昂」
  - label: B
    content: 「以管窺天」和「坐井觀天」
  - label: C
    content: 「棟樑之材」和「朽木難雕」
  - label: D
    content: 「不毛之地」和「牛山濯濯」。
- id: doc_112_桃園_文昌_國文_g7s1e2_s3_9
  section: 3
  number: 9
  type: single
  page: 2
  stem: 以下句中所運用的成語「用字」和「解釋」何者完全正確？
  options:
  - label: A
    content: 頭腳崢嶸：才華洋溢、能力出眾的年輕人。
  - label: B
    content: 吹毛求疵：故意挑剔、找對方毛病。
  - label: C
    content: 牝雞司晨：任官太泛濫或以壞續好。
  - label: D
    content: 心猿意馬：比喻人性情急躁或徒有表象、儀表卻本質低劣。
- id: doc_112_桃園_文昌_國文_g7s1e2_s3_10
  section: 3
  number: 10
  type: single
  page: 2
  stem: 下列文句中的的成語，何者運用最恰當？
  options:
  - label: A
    content: 今年全國圍棋比賽冠軍竟是一位高中女生，真是「後起之秀」。
  - label: B
    content: 買賣有童叟無欺、「巧言令色」的態度，總會因誠懇而生意上門。
  - label: C
    content: 阿昱今年九十歲，很多事早已「既往不咎」，甚至還會迷路。
  - label: D
    content: 既然他虧待你，那就「以德報怨」，用他的方式十倍奉還給他。
- id: doc_112_桃園_文昌_國文_g7s1e2_s3_11
  section: 3
  number: 11
  type: single
  page: 2
  stem: 「之」字常做代詞使用，請問下列關於「之」字所代替的事物，何者說明正確？
  options:
  - label: A
    content: 學而時習「之」：他人的優點。
  - label: B
    content: 有一言而可以終身行「之」者乎：他們，指朋友。
  - label: C
    content: 其不善者而改「之」：他人的缺點。
  - label: D
    content: 擇其善者而從「之」：已學得的內容。
  lesson_raw:
    title: 論語選
    basis: 選項引用論語選課文原句
- id: doc_112_桃園_文昌_國文_g7s1e2_s3_12
  section: 3
  number: 12
  type: single
  page: 2
  stem: 子曰：「其恕乎！己所不欲，勿施於人。」其中「其」、「乎」兩字同是語助詞，使句子產生特定語氣，下列何者語氣與此句相同？
  options:
  - label: A
    content: 記得學到的內容要時常復習。
  - label: B
    content: 謹慎分辨對與錯的難道不對嗎？
  - label: C
    content: 學習速度雖然緩慢，但我必然不會中止。
  - label: D
    content: 天色暗下來，似乎是天降甘霖。
  lesson_raw:
    title: 論語選
    basis: 題幹引用論語選課文原句
- id: doc_112_桃園_文昌_國文_g7s1e2_s3_13
  section: 3
  number: 13
  type: single
  page: 2
  stem: 「用鹹淚醃漬自己的生命」一句使「意象」之呈現更加深刻，下列文句修辭何者與其相同？
  options:
  - label: A
    content: 街道和巷弄才可以經常保有ㄧ張清潔的容顏。
  - label: B
    content: 早晨的印象像是鳥兒整日在腦海迴旋。
  - label: C
    content: 十字常常寫成千字，千字常常寫成十字。
  - label: D
    content: 拄杖如騎著他的寶馬一般。
- id: doc_112_桃園_文昌_國文_g7s1e2_s3_14
  section: 3
  number: 14
  type: single
  page: 2
  stem: 關於〈差不多先生傳〉一文的寫作特色，下列說明何者正確？
  options:
  - label: A
    content: 全文充滿嘲諷意味，筆調慷慨激昂，點出中國人缺乏民主精神。
  - label: B
    content: 本文的文章結構為：先寫主角背景簡介，再給予人物評論，最後才舉例說明差不多的態度。
  - label: C
    content: 文中使用許多倒反修辭，如運用「看得破」、「想得通」、「格言」、「圓通大師」等詞語。
  - label: D
    content: 本文是自傳式的寓言，以中國實際代表人物差不多先生點醒中國人苟且隨便的通病。
  lesson_raw:
    title: 差不多先生傳
    basis: 題目指明課名〈差不多先生傳〉
- id: doc_112_桃園_文昌_國文_g7s1e2_s3_15
  section: 3
  number: 15
  type: single
  page: 2
  stem: 〈差不多先生傳〉的主旨與下列何者涵義較近？
  options:
  - label: A
    content: 當局者迷，旁觀者清。
  - label: B
    content: 尺有所短，寸有所長。
  - label: C
    content: 己立立人，己達達人。
  - label: D
    content: 失之毫釐，差以千里。
  lesson_raw:
    title: 差不多先生傳
    basis: 題目指明課名〈差不多先生傳〉
- id: doc_112_桃園_文昌_國文_g7s1e2_s3_16
  section: 3
  number: 16
  type: single
  page: 2
  stem: 以下各句都是出於《論語》，何者理解是正確的？
  options:
  - label: A
    content: 「三人行，必有我師焉。擇其善者而從之，其不善者而改之。」表現出「見賢思齊」的態度，以及「不敬，何以別乎」的精神。
  - label: B
    content: 「人不知而不慍，不亦君子乎？」表現了「君子病無能焉，不病人之不己知也」的胸襟，重視自己的道德修養。
  - label: C
    content: 「己所不欲，勿施於人。」意謂著「獨學而無友，則孤陋而寡聞」，與人切磋才能更加精進。
  - label: D
    content: 「譬如平地，雖覆一簣，進，吾往也。」指出為學應該「巧為比喻」，先填平窪地再進一步為學。
  lesson_raw:
    title: 論語選
    basis: 題目指明《論語》且選項引用課文
- id: doc_112_桃園_文昌_國文_g7s1e2_s3_17
  section: 3
  number: 17
  type: single
  page: 2
  stem: 《論語》是儒家的經典之一，影響華人思想深遠，下列關於《論語》的說明，何者正確？
  options:
  - label: A
    content: 《論語》是孔子記錄自己談話的著作，主要是孔子對於如何修養自己、服務人群、治理國家的看法。
  - label: B
    content: 《論語》裡談「禮」和「忠恕之道」，其完善的儒家學說從孔子的時代就一直被君王推行於國家治理。
  - label: C
    content: 《論語》全書共二十篇，各章形式短小，通常取首章開頭的二至三字為篇名，是最早的「語錄體」著作。
  - label: D
    content: 我們可從《論語》找到孔子生存的戰國時期之政治情勢以及君王的言行，也有孔子的思想學說。
  lesson_raw:
    title: 論語選
    basis: 論語選之作者及常識
- id: doc_112_桃園_文昌_國文_g7s1e2_s3_18
  section: 3
  number: 18
  type: single
  page: 2
  stem: 下列何者符合孔子所說的「恕」道？
  options:
  - label: A
    content: 只要是我所喜歡的，別人也應該能接受。
  - label: B
    content: 掃廁所的同學很辛苦，所以我不能甩水在鏡子上。
  - label: C
    content: 怕好朋友無精打采，提供違禁品讓好朋友使用。
  - label: D
    content: 反正我的桌椅被塗鴉，我也塗鴉別人的桌椅。
  lesson_raw:
    title: 論語選
    basis: 論語選內容理解
- id: doc_112_桃園_文昌_國文_g7s1e2_s3_19
  section: 3
  number: 19
  type: single
  page: 3
  stem: 關於〈那默默的一群〉一文的寫作手法，下列敘述何者正確？
  options:
  - label: A
    content: 以「忠實的態度」貫穿全文
  - label: B
    content: 以轉化法開頭，點明主角的態度
  - label: C
    content: 舉出反面事例並加以說明
  - label: D
    content: 結尾稱讚清道婦的淡淡夜色下的紅顏，並肯定她們是傑出的「人物」。
  lesson_raw:
    title: 那默默的一群
    basis: 題目指明課名〈那默默的一群〉
- id: doc_112_桃園_文昌_國文_g7s1e2_s3_20
  section: 3
  number: 20
  type: single
  page: 3
  stem: 「泥土是人類所賴以生存的好東西，可是當它出現在馬路時，就惹人厭了：好天時會塵土飛揚，雨天時便泥濘遍地。當她們每天早上來清掃時，面對著那些黃黃的泥巴，誰也不會保留自己的力量，就像搶奪一種東西一樣，搶著去幹。」這段文字主要在說明什麼？
  options:
  - label: A
    content: 泥土是清道婦最討厭清掃的東西，每次泥土出現在馬路上就悲憤。
  - label: B
    content: 清道婦比誰都清楚泥土的重要性，因此將泥土視為台灣的珍寶。
  - label: C
    content: 泥土對台灣農民而言是相當重要的農耕基礎，台灣人不能沒有泥土。
  - label: D
