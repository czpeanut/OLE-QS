- id: doc_112_桃園_文昌_國文_g7s1e2_s3_4
  section: 3
  number: 4
  type: single
  page: 1
  stem: 請問下列各句中「 」內的詞語，何者使用錯誤？
  options:
  - label: A
    content: 運動會前大家對於創意進場的方案都沒有「意義」，一致通過。
  - label: B
    content: 他自從確診康復後，身體仍然感到不寧，需要一段時間的「休養」。
  - label: C
    content: 馬辛因為馬虎的個性，辦事「不力」，以致出廠貨品不良率太高。
  - label: D
    content: 到了不熟悉的水域，「切記」千萬不要貿然下水，以免發生憾事。
