    \ lot of people. They can wait \nfor food, tickets, or even new cellphones. However,\
    \ those things \nare not for the line standers. They are for other people. Some\
    \ \npeople are busy at work or don’t want to wait in line for a long \ntime, so\
    \ they pay the line standers to do that for them.  \n    Line standers are especially\
    \ popular in big cities. People \ndon’t need to have special skills to be a line\
    \ stander. But the job \nisn’t always easy. Line standers may have to wait in\
    \ line for \nhours or wait in bad weather. Anyone can be a line stander. \nYou\
    \ just have to like to wait in line. So, the next time you're in \na long line,\
    \ look around. You may see someone working as a \nline stander. It’s just another\
    \ example of how people find \ncreative ways to help others and make money! \n\
