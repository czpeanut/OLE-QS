questions:
- id: doc_113_台中_五權_社會_歷史_g7s2e3_s1_17
  section: 1
  number: 17
  type: single
  page: 1
  stem: 「這場戰役」規模不大，發生在民國38 年。僅能算是師級戰役，目標也只是福建沿海的兩座小島，但其影響非常深遠，蔣經國認為：「這場戰役是國民黨的轉折點。」同年
    12 月底，中華民國政府遷臺，海峽兩岸形成分裂分治的局面。請問：「這場戰役」為何？
  options:
  - label: A
    content: 古寧頭戰役
  - label: B
    content: 八二三炮戰
  - label: C
    content: 海南島戰役
  - label: D
    content: 大陳島戰役。
- id: doc_113_台中_五權_社會_歷史_g7s2e3_s1_18
  section: 1
  number: 18
  type: single
  page: 1
  stem: 民國 47 年，西方媒體報導：「第二次臺灣海峽危機爆發，中國人民解放軍首先以密集的炮火轟擊金門，中華民國國軍隨後開始反擊，情勢一觸即發。」請問：上述應該是指哪一事件？
  options:
  - label: A
    content: 八二三炮戰
  - label: B
    content: 國共內戰
  - label: C
    content: 韓戰
  - label: D
    content: 古寧頭戰役。
- id: doc_113_台中_五權_社會_歷史_g7s2e3_s1_19
  section: 1
  number: 19
  type: single
  page: 1
  stem: 民國68 年，中華人民共和國與美國建交，對台灣改採「和平統戰」策略。在和平統戰的策略下，中共對臺灣提出「三通」的口號。下列哪些是「三通」的內容？(甲)通航(乙)通郵(丙)通話(丁)通商
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲乙丁
  - label: C
    content: 甲丙丁
  - label: D
    content: 乙丙丁。
- id: doc_113_台中_五權_社會_歷史_g7s2e3_s1_20
  section: 1
  number: 20
  type: single
  page: 1
  stem: 附圖是兩岸交流事務處理機構的示意圖，根據圖中的內容判斷，圖中的「乙」應該是下列何者？
  options:
  - label: A
    content: 國務院臺灣事務辦公室
  - label: B
    content: 海峽兩岸關係協會
  - label: C
    content: 海峽交流基金會
  - label: D
    content: 行政院大陸委員會。
  assets:
  - key: s1_20_f1
    kind: figure
    file: doc_113_台中_五權_社會_歷史_g7s2e3/s1_20_f1.png
- id: doc_113_台中_五權_社會_歷史_g7s2e3_s1_21
  section: 1
  number: 21
  type: single
  page: 1
  stem: 蔣經國時期，臺灣面對中共的和平統戰，採取「三不政策」加以回應。請問：「三不政策」的內容為何？
  options:
  - label: A
    content: 不接觸、不通商、不妥協
  - label: B
    content: 不接觸、不談判、不妥協
  - label: C
    content: 不統一、不交流、不通話
  - label: D
    content: 不通航、不通郵、不通商。
- id: doc_113_台中_五權_社會_歷史_g7s2e3_s1_22
  section: 1
  number: 22
  type: single
  page: 1
  stem: 民國 43 年，臺灣與美國簽訂《中美共同防禦條約》，美國正式將臺灣納入哪一區域的防衛體系？
  options:
  - label: A
    content: 西太平洋
  - label: B
    content: 東太平洋
  - label: C
    content: 北大西洋
  - label: D
    content: 南大西洋。
- id: doc_113_台中_五權_社會_歷史_g7s2e3_s1_23
  section: 1
  number: 23
  type: single
  page: 1
  stem: 民國68 年，美國與中華民國斷絕邦交之後，美國國會通過哪一文件以保持和臺灣之間的經貿及文化關係？
  options:
  - label: A
    content: 中美共同防禦條約
  - label: B
    content: 解嚴令
  - label: C
    content: 臺灣關係法
  - label: D
    content: 六三法。
- id: doc_113_台中_五權_社會_歷史_g7s2e3_s1_24
  section: 1
  number: 24
  type: single
  page: 1
  stem: '康康在蒐集有關臺灣農業發展的資料時，得到有關臺灣自耕地與佃耕地比例變化的統計資料，如附表所示。根據表中內容顯示，導致此一變化的主要原因為何？


    | 西元<br>土地 | 1948 年 | 1953 年 | 1956 年 |

    | :--- | :--- | :--- | :--- |

    | 自耕地 | 56％ | 83％ | 85％ |

    | 佃耕地 | 44％ | 17％ | 15％ |'
  options:
  - label: A
    content: 日本統治結束，土地歸還人民
  - label: B
    content: 二二八事件後的土地賠償
  - label: C
    content: 政府遷臺後的土地改革
  - label: D
    content: 經濟快速成長後，帶動農業發展。
- id: doc_113_台中_五權_社會_歷史_g7s2e3_s1_25
  section: 1
  number: 25
  type: single
  page: 1
  stem: 一個國家在發展經濟的初期，為避免本國產業受到外國勢力的競爭，通常會採取保護政策，限制國外的相關產品進口。臺灣經濟發展在哪一階段即呈現上述現象？
  options:
  - label: A
    content: 進口替代
  - label: B
    content: 出口導向
  - label: C
    content: 十大建設
  - label: D
    content: 產業升級。
- id: doc_113_台中_五權_社會_歷史_g7s2e3_s1_26
  section: 1
  number: 26
  type: single
  page: 1
  stem: 依據經濟學的法則，某一時期的臺灣較適合發展勞力密集產業，因此政府成立「加工出口區」及制定「獎勵投資條例」，企圖以出口帶動經濟成長。根據上述，這應是指下列哪一個階段？
  options:
  - label: A
    content: 進口替代
  - label: B
    content: 出口導向
  - label: C
    content: 十大建設
  - label: D
    content: 產業升級。
- id: doc_113_台中_五權_社會_歷史_g7s2e3_s1_27
  section: 1
  number: 27
  type: single
  page: 1
  stem: 新竹的科學園區探索館是一棟黃色馬賽克的建物，為園區成立時之第一批標準廠房，之後因舊標準廠房陸續改建，所以將園區僅存的第一期廠房整建為史料館，館內記錄新竹科學工業園區的發展史。請問：上述的科學園區探索館應建於下列哪一個階段？？
  options:
  - label: A
    content: 進口替代
  - label: B
    content: 出口導向
  - label: C
    content: 十大建設
  - label: D
    content: 產業升級。
- id: doc_113_台中_五權_社會_歷史_g7s2e3_s1_28
  section: 1
  number: 28
  type: single
  page: 1
  stem: 解嚴後，臺灣社會運動蔚為風潮，民國 70 年代以後原住民走上街頭高舉「正名」、「權益」等標語，此社會運動帶來了下列何種影響？
  options:
  - label: A
    content: 原住民各族彼此融合大團結
  - label: B
    content: 原住民的權益取得法律保障
  - label: C
    content: 原住民被迫改回日本姓名
  - label: D
    content: 原住民取回原本的山林地。
- id: doc_113_台中_五權_社會_歷史_g7s2e3_s1_29
  section: 1
  number: 29
  type: single
  page: 1
  stem: 民國 60 年代，許多知識分子對臺灣的發展有更多的反省，知識分子把寫作的重點轉移到關心周遭環境，強調對故鄉與土地的情感，掀起何種文學類型的盛行？
  options:
  - label: A
    content: 鄉土文學
  - label: B
    content: 懷古文學
  - label: C
    content: 保護環境文學
  - label: D
    content: 教育創作文學。
- id: doc_113_台中_五權_社會_歷史_g7s2e3_s1_30
  section: 1
  number: 30
  type: single
  page: 1
  stem: 臺灣光復之後，政府為促進族群溝通，凝聚國家意識，積極推廣國語，禁止在學校使用方言。這種措施造成何種結果？
  options:
  - label: A
    content: 母語流失，鄉土文化受到忽視
  - label: B
    content: 培養堅定的反共愛國意識
  - label: C
    content: 全面提升臺灣的教育水準
  - label: D
    content: 因各族群風俗、文化的差異而造成衝突。
- id: doc_113_台中_五權_社會_歷史_g7s2e3_s1_31
  section: 1
  number: 31
  type: single
  page: 1
  stem: 臺灣是由許多族群所組成的社會，為建立共存共榮的社會環境，凝結「臺灣意識」是當前的重要課題之一。請問：下列哪一種觀念有助於「臺灣意識」的凝聚？
  options:
  - label: A
    content: 堅守自己族群的血統
  - label: B
    content: 革除傳統向西方學習
  - label: C
    content: 強制漢族本位的同化
  - label: D
    content: 強調每個族群都是臺灣人。
- id: doc_113_台中_五權_社會_歷史_g7s2e3_s1_32
  section: 1
  number: 32
  type: single
  page: 1
  stem: 民國 70 年代，我國社會日趨開放，各種新興的社會運動形成風潮，許多長期被社會大眾忽視的弱勢團體紛紛發出聲音，為自己爭取合法的權益。這與當時的哪一轉變有密切關係？
  options:
  - label: A
    content: 政府播遷來臺
  - label: B
    content: 宣布解除戒嚴
  - label: C
    content: 能源危機爆發
  - label: D
    content: 義務教育實施。
- id: doc_113_台中_五權_社會_歷史_g7s2e3_s1_33
  section: 1
  number: 33
  type: single
  page: 1
  stem: 近年來，臺灣處處可見東南亞風味的商店與外籍人士，由此可知其顯示的意義為何？
  options:
  - label: A
    content: 臺灣出生率高，人口增加快速
  - label: B
    content: 臺灣男女性別比例嚴重失衡
  - label: C
    content: 臺灣社會是多元文化的融合
  - label: D
    content: 臺灣本土意識沒落。。
