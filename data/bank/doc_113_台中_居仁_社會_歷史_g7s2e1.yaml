  section: 1
  number: 15
  type: single
  page: 2
  stem: 在1930年代，日籍公務員的月薪約為100-200日圓，而臺灣籍公務員的月薪約為50-100日圓。關於上述日籍與臺籍公務員的薪資差異，最符合歷史事實的解釋應該為下列何者？
  options:
  - label: A
    content: 日本將臺灣視為附屬領土，殖民統治理念下，但是恰恰給予日人優先的待遇
  - label: B
