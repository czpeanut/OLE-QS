  stem: 臺灣糖業博物館的前身是高雄糖廠(舊稱「橋仔頭糖廠」)，創建至今超過百年歷史，是臺灣第一座現代化機械式製糖工廠。館內展示一座糖廠如何往甘蔗運送到工廠後，經過壓榨、結晶、分蜜等製糖的過程。其中的介紹出現圖(二)照片與俗諺「第一憨，種甘蔗予會社磅」，請問：這句俗諺說明當時蔗農面對什麼樣的情況？
