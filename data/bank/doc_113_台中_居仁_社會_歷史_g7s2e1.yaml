  type: single
  page: 1
  stem: 西元1896年，日本基於臺灣乃有別於內地的特殊地區，由國會通過並公布《法律第六十三號》。第一條明文提到：「臺灣○○在其實管轄區域內，得發布具有法律效力之命令」第三條更進一步闡明：「在臨時緊急時，臺灣○○得不經……手續，即時發布第一條之命令。」關於上述內容，主要賦予何人在宣立法權的權力？
  options:
  - label: A
    content: 警察
  - label: B
    content: 保正
  - label: C
    content: 甲長
  - label: D
    content: 總督。
