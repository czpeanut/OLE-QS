  section: 1
  number: 3
  type: single
  page: 1
  stem: 日本政府組織的「高砂義勇隊」，約有8千名臺灣原住民被派往戰場，僅十分之一的人回到臺灣。臺東卑南族人陳德儀就是其中之一。他的手寫日記《一位高砂志願兵的部落衰退記事》，記錄著他參加中日戰爭的親身經歷。請問：下列敘述哪一項不可能出現在陳德儀的日記裡？
  options:
  - label: A
    content: 陳德儀因為具有高山族的身份而參加高砂義勇隊
  - label: B
    content: 陳德儀被派往東北參加戰爭
  - label: C
    content: 陳德儀參戰的時間為1940年代左右
  - label: D
    content: 日本戰敗，陳德儀脫身從軍單獨俘虜。
