  stem: 劉銘傳參觀基隆港一港口，導覽人員說道：「十九世紀，西班牙以本港作為在北臺灣的根據地之一，日治時期總督府西元1899到1944年間進行基隆港整建工程，清除港區內礁石，並興建造船廠、軍港區及漁港區等設備，使本港成為臺灣對日本、東南亞的重要貿易基地。一九七○年代以前本港為臺灣第一大港，在國際貿易的拓展上功不可沒。」請問，劃線到第幾句劃錯了？
  options:
