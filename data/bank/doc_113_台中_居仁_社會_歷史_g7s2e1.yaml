- id: doc_113_台中_居仁_社會_歷史_g7s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '下方附圖為「藍地黃虎旗」，此旗現今典藏在國立臺灣博物館，是鎮館之寶。

    2012年，國立臺灣博物館經過1年半的考證修復，確定藍地黃虎旗原為雙面。正反兩面的老虎眼睛並不相同，正面的黃虎瞳孔圓睜，象徵「夜行虎」；反面的黃虎瞳孔半開如彎月，象徵「日間虎」，正反兩面代表晝夜或陰陽，有象徵「日夜護國」一說。請問：關於「藍地黃虎旗」的敘述，下列何者正確？'
  options:
  - label: A
    content: 「藍地黃虎旗」啟用的時間應該為1894年
  - label: B
    content: 「藍地黃虎旗」為臺灣民主國的國旗，臺灣民主國成立的立場是為了獨立以自救抵抗日本接收
  - label: C
    content: 臺灣民主國是由巡撫唐景崧與紳士丘逢甲成立
  - label: D
    content: 「藍地黃虎旗」表示對清帝國的尊崇，年號為「天運」，以示不忘清。
  assets:
