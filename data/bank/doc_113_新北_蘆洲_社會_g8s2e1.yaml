- id: doc_113_新北_蘆洲_社會_g8s2e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 民國17 年12 月29 日，東北地方當局降下原北京政府時代的五色旗，改以國民政府的青天白日旗，宣告正式歸順南京國民政府；中國終於結束軍閥統治的混亂回歸統一。請問：這重要的歷史一刻，與何人有舉足輕重的關係？
  options:
  - label: A
    content: 蔣中正
  - label: B
    content: 張作霖
  - label: C
    content: 張學良
  - label: D
    content: 段祺瑞。
