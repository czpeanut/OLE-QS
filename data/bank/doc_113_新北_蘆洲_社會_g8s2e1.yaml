- id: doc_113_新北_蘆洲_社會_g8s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 有『千島之國』之稱的印尼，因位於板塊接觸帶上，國土破碎。請問下列國家，何者「不」位在板塊交界處？
  options:
  - label: A
    content: 印度
  - label: B
    content: 臺灣
  - label: C
    content: 越南
  - label: D
    content: 日本。
  group_stem: 國土分布在赤道兩側的印尼屬於熱帶雨林氣候，是世界上最大的群島國家，因此有『千島之國』的稱號。考量到環境生態問題以及區域均衡發展，印尼國會在2022年1月通過法案，將原本位在爪哇島的首都遷到婆羅洲東加里曼丹省，並命名新首都為『努山塔拉』。
