questions:
- id: doc_113_新北_蘆洲_社會_g8s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 如果要到南亞旅遊，許多人都會推薦在當地的『涼季』時間前往，主要的原因可能是？
  options:
  - label: A
    content: 6-10月西南季風帶來水氣，使當地的暑氣全消
  - label: B
    content: 11-2月喜瑪拉雅山阻擋冬季寒冷季風，氣候涼爽
  - label: C
    content: 3-5月陽光照射，對流旺盛，帶來許多對流雨
  - label: D
    content: 6-10月東南季風帶來水氣，使當地的暑氣全消。
- id: doc_113_新北_蘆洲_社會_g8s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 在臺灣有許多來自東南亞的國際移工，他們的宗教信仰不盡相同，因此也會在臺灣參與不同的宗教活動。請問：下面哪一個東南亞國家或地區主要的宗教信仰為伊斯蘭教，所以來自這裡的移工每年在臺灣都會參與伊斯蘭教開齋節的活動？
  options:
  - label: A
    content: 越南
  - label: B
    content: 巴基斯坦
  - label: C
    content: 馬來西亞
  - label: D
    content: 菲律賓北部。
- id: doc_113_新北_蘆洲_社會_g8s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 早期東南亞地區許多國家都受到歐美國家的殖民，加上高溫多雨的氣候，這些殖民國家都在當地發展『熱帶栽培業』。即使後來脫離了殖民，仍有不少國家仍然以此產業作為國家經濟發展的主軸之一。請問：關於『熱帶栽培業』的敘述，下列何者錯誤？
  options:
  - label: A
    content: 出口導向
  - label: B
    content: 粗放耕作，總產量高
  - label: C
    content: 大規模種植單一經濟作物
  - label: D
    content: 橡膠、油棕、可可、咖啡都是其代表性作物。
- id: doc_113_新北_蘆洲_社會_g8s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 在南亞地區由恆河與印度河所沖積形成的印度大平原是重要的農業區。配合不同農作物所需的生長環境條件，從恆河下游往中上游前進，再到印度河，所種植的作物分別會是？
  options:
  - label: A
    content: 黃麻、甘蔗、棉花
  - label: B
    content: 棉花、甘蔗、黃麻
  - label: C
    content: 棉花、黃麻、甘蔗
  - label: D
    content: 黃麻、棉花、甘蔗。
- id: doc_113_新北_蘆洲_社會_g8s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 馬爾地夫是許多喜愛海島旅遊者的願望清單之一，熱帶海域生態景觀豐富，美不勝收。請問其島嶼的成因為何？
  options:
  - label: A
    content: 海底珊瑚礁堆積，因海面下降或陸地上升而露出海面
  - label: B
    content: 因地殼下沉或海水上升導致與大陸分隔所形成
  - label: C
    content: 海底火山噴出岩漿，冷卻後堆積露出海面
  - label: D
    content: 河川夾帶大量泥沙流入海底堆積露出海面。
- id: doc_113_新北_蘆洲_社會_g8s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 小宇到了南亞某個地方進行地理實察，右圖是他畫在筆記本上用來代表此地地形的等高線地形圖，請問他是位在哪個地區？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
