- id: doc_113_新北_蘆洲_社會_g8s2e1_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 民國初年，某雜誌上有一篇答辯書指出：「本（雜）誌同仁本來無罪，只因……要擁護那德先生，便不得不反孔教、禮法、貞節、舊政治；要擁護那賽先生，便不得不反對舊藝術、舊宗教；要擁護德先生，又要擁護那賽先生，便不得不反對國粹和舊文學。」請問：文中的「本誌」應是指下列何者？
  options:
  - label: A
    content: 《萬國公報》
