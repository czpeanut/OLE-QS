- id: doc_113_新北_蘆洲_社會_g8s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 新加坡雖然國土面積不大，但因有優越的地理位置控制麻六甲海峽縮短了來往太平洋與印度洋之間的距離，所以發展出轉口貿易，帶動國家經濟的蓬勃發展。在只考量最短航運路徑的情況下，下面哪一條航線會經過麻六甲海峽？
  options:
  - label: A
    content: 緬甸－印度
  - label: B
    content: 臺灣－泰國
  - label: C
    content: 緬甸－菲律賓
  - label: D
    content: 臺灣－馬來西亞。
- id: doc_113_新北_蘆洲_社會_g8s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 隨著科技發達、交通便利，企業的國際分工越來越普遍。印度也憑藉其本身的一些優勢條件，吸引許多外國企業把部分部門移到此設置。請問：下列何者『不是』其優勢條件之一？
  options:
  - label: A
    content: 工資低廉
  - label: B
    content: 勞動力人口充足
  - label: C
    content: 高等教育發達，理工人才眾多
  - label: D
    content: 普遍會說中文和英語的人口比例很高。
- id: doc_113_新北_蘆洲_社會_g8s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 在這個國家裡，公民擁有許多社會福利，例如：公民免繳所得稅，國家政府還提供免費的教育以及醫療與生活開銷補助等，這一切都拜其擁有豐富的石油與天然氣所賜，成為東南亞的富裕小國。請問：以上描述的是哪個國家的特徵？
  options:
  - label: A
    content: 汶萊
  - label: B
    content: 泰國
  - label: C
    content: 柬埔寨
  - label: D
    content: 新加坡。
- id: doc_113_新北_蘆洲_社會_g8s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 在全球化的時代，許多國家為了增加競爭力會互相結盟形成一個組織。而在東南亞地區的國家以東協（ASEAN）為基礎，積極擴大合作對象，於2020年與周邊國家簽署完成『區域全面經濟夥伴協定』（RCEP），成為目前全球規模最大的自由貿易市場。請問：下面哪一個國家『不是』與東南亞國家簽訂RCEP
    的合作夥伴國家之一？
  options:
  - label: A
    content: 印度
  - label: B
    content: 日本
  - label: C
    content: 中國
  - label: D
    content: 澳洲。
- id: doc_113_新北_蘆洲_社會_g8s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 欣玫的期中報告是要介紹『印度』這個國家，於是前往圖書館找尋相關資料，請問下面哪項資料『不可能』是她的報告主題？
  options:
  - label: A
    content: 佛教的發源地與傳播
  - label: B
    content: 印度聖河－印度河對當地居民的意義
  - label: C
    content: 印度教種姓制度對當地社會所帶來的影響
  - label: D
    content: 印度古蹟泰姬瑪哈陵的建造與歷史背景。
- id: doc_113_新北_蘆洲_社會_g8s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 泰旭準備在海外投資設廠，經過一番研究之後，考量到其產業屬性與其他優勢條件，決定到相同屬性產業聚集的印度『邦加羅爾』投資。請問泰旭投資的產業是屬於哪一類？
  options:
  - label: A
    content: 食品製造業
  - label: B
    content: 成衣製造業
  - label: C
    content: 汽車製造業
  - label: D
    content: 電腦零件組製造業。
