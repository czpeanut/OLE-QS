  group_stem: '〈一〉戰後臺灣曾經有一段時間流行關懷人民生活，以寫實手法寫作的作品，例如：下列這篇《蘋果的滋味》。請閱讀內容後回答問題：


    江阿發在上班的路上，不幸被美國海軍陸戰隊駐臺軍官格雷上校所駕駛的汽車撞倒，導致他雙腿斷掉，住進天母的美國海軍醫院療養。出乎意料之外，江阿發的整個家庭並沒有因此陷入困境。格雷上校不僅賠償新臺幣五萬元現金，又願意帶阿發的啞女兒到美國留學。前來探望阿發的老婆、孩子，對於他能待在豪華的醫院裡，反而有點羨慕。後來，阿發讓老婆和孩子品嘗格雷上校送來作為禮物的美國進口蘋果，全家人有如品嘗到天堂的果實。'
