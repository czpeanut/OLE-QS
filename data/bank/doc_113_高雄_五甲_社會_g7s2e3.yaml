- id: doc_113_高雄_五甲_社會_g7s2e3_s3_50
  section: 3
  number: 50
  type: single
  page: 6
  stem: '社會福利 (social welfare) 又稱社會安全 (social Security) 制度，社會福利是指政府整合國家與民間資源，規畫、推動滿足人民生活需求的措施。附表3對社會福利制度發展的敘述，哪些選項正確？


    表3

    | 選項 | 時期 | 社會福利發展內涵 |

    |---|---|---|

    | 【甲】 | 歐洲中世紀 | 由宗教組織以施捨與救濟的方式來扶助貧窮 |

    | 【乙】 | 工業革命後 | 機器替代手工、雇主壓榨勞工，造成失業與貧困問題，於是民間團體承擔起保障弱勢的權益，維持其基本生活 |

    | 【丙】 | 進入20世紀 | 福利政策普及，從保障弱勢，提昇為增進全民生活的福祉 |

    | 【丁】 | 近年 | 政府規畫一套整合政府組織、社會團體與個人力量的社會福利政策 |'
