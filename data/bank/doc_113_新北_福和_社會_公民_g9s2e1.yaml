  group_stem: "(二)\n     Animage雜誌和吉卜力展今年1月8日至4月6日於華山1914文創園區展出經典拍照場景，製作多部經典電影動畫的日本吉卜力工作室曾宣布，免費開放網友可使用400張劇照，因此在社群軟體上掀起創作梗圖風，不少縣市首長也藉由動畫劇照來宣傳活動及政策。工作室在釋出劇照時，表示希望大家在「合法及合理範圍內」自由使用，因此如何運用才是既有梗，又不會侵權呢？\n\
    有三位律師針對民眾利用動畫劇照行為給了以下建議:\n甲律師:「網友將劇照修成梗圖，不宜加註自己的姓名，以免有侵害著作權人的姓名表示權」\n  乙律師:「網友可以發揮創意製作梗圖，但不能有營利行為，避免影響原著作的潛在市場利益」\n\
    \  丙律師：｢網友在使用梗圖要避免出現違反公序良俗的不雅字眼，以免破壞原著精神，且會侵害著作權人的權利」"
