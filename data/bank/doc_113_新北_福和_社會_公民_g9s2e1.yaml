  stem: 在台灣擁有2100萬用戶的通訊軟體LINE已經成為大家生活的一部分，也是假訊息傳遞的最主要工具之一，有鑑於此，專家以「疑、想、查、問、戳」五字訣教大家對抗假消息。除了要對訊息來源和內容保有警覺，民眾還可以透過台灣事實查核中心等第三方的查證平台確認訊息正確性，多一份留意，就能避免成為假訊息的傳播者。請問：以上所述主要是說明下列何者應該受到重視？(L2)
