- id: doc_113_新北_福和_社會_公民_g9s2e1_s1_44
  section: 1
  number: 44
  type: single
  page: 2
  stem: '人工智慧AI(Artificial Intelligence)的發展日新月異，已經愈來愈融入我們的生活。當你使用 Netflix 追劇時，它會推薦你可能喜歡的影片清單；在網路書店買書時，系統會根據你的喜好推薦相關書籍；甚至當你打電話到銀行客服，回應你的也不一定是真人，而可能是
    AI 客服機器人。AI未來將會更深入地影響我們的生活，例如：ChatGPT的推出儼然成為2023年最備受矚目的議題之一，人工智慧領域也成為各界互別苗頭的新戰場。部分學者指出，該技術若能融入現有產業，可大幅提升效率，例如製造業可透過AI
    找出更多瑕疵等。然而並非所有人都會是科技的受惠者，中低階工作能力者可能將隨AI 的發展而被取代，若政府未能及時制定督促的應變措施，恐發生重大影響。請問：下列何者是上述AI發展可能帶來的隱憂
    ？(L1)


    註：人工智慧AI是指透過機器模擬人類智慧的技術'
  options:
  - label: A
    content: 機器人取代人力可能導致失業問題
  - label: B
    content: AI 的日新月異帶來便利而無負面影響
  - label: C
    content: 個人資訊暴露產生資訊安全的問題
  - label: D
    content: 大規模的使用可能提升產業工作效率。
