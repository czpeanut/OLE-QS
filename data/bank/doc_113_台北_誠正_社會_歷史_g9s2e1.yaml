  group_stem: '他在上任美國總統的一年後，戰爭爆發。美國的輿論認為這場戰爭與自己國家沒有任何關係，不想干涉其他國家的事務，反對參戰。直到這個事件發生，讓美國承受巨大的人員與物質的損失，國內開始有參戰的呼聲出現。之後，美國宣布參戰，加入協約國陣營。

