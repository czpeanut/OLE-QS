- id: doc_113_新北_永和_自然_g9s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '有關大氣層的敘述，下列(1)～(6)敘述何者錯誤？

    (1)若地球表面沒有大氣，早晚氣溫不會有變化

    (2)若地球表面沒有大氣，將看不見彗星

    (3)因地表存在大氣層，所以常會看見流星雨，且地面上隕石坑會增加

    (4)大氣最低溫，常出現在「丙」層

    (5)因地表的人為污染物，使「丙」層的臭氧層產生破洞，地表增加了紫外線照射

    (6)可減緩隕石撞擊，流星多在「丙」層燃燒殆盡'
  options:
  - label: A
    content: (1)(2)(3)(4)
  - label: B
    content: (1)(2)(3)(5)
  - label: C
    content: (3)(4)(5)
  - label: D
    content: (1)(2)(4)(6) 。
