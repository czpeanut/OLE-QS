  page: 2
  stem: 臺灣加入世界貿易組織後，農業面臨嚴峻的競爭壓力，這主要與下列何項因素關係最密切？
  options:
  - label: A
    content: 農村人口高齡化，單位面積生產量低
  - label: B
    content: 耕地面積狹小，導致生產成本較高
  - label: C
    content: 大量使用化學農藥與肥料，汙染農業產品
  - label: D
    content: 受限氣候條件，農場經營規模小
  group_stem: ◆臺灣在全球化的過程中，積極擴展對外貿易，並申請加入國際組織。在2002 年正式成為世界貿易組織（WTO）的會員，此舉雖有利於對外貿易活動的進行，但也讓農業活動受到嚴重的衝擊。請根據上述回答第48〜50
