  - label: C
    content: 臺灣環境具孤立性特有種多
  - label: D
    content: 冷鏈運輸條件進步
- id: doc_113_新北_中平_社會_地理_g9s2e2_s1_45
  section: 1
  number: 45
  type: single
  page: 2
  stem: 下列何者是科學家開始進行作物基因的改造的主要原因？
  options:
  - label: A
    content: 提高農作物產量
  - label: B
    content: 防止水土流失
  - label: C
    content: 降低運輸成本
  - label: D
    content: 維持生態平衡
  group_stem: ◆ 自從1990 年代基因改造作物商業化後，全球栽培面積快速擴增，然而基因改造作物爭議與辯論卻持續至今。臺灣雖尚未核准任何基因改造作物在國內推廣種植，但開放部分飼料用或食品用的基因改造作物。依據《學校衛生法》部分條文，明訂學校供應膳食者，禁止使用含基因改造生鮮食材及其初級加工品。請根據上述回答第45〜47
