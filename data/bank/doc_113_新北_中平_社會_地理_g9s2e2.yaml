  page: 1
  stem: 台東鹿野生產的「福鹿米」，是採「合鴨水稻」栽種法，產量與品質皆高，名聲更遠播到日本。「合鴨水稻」栽種法是在稻田中放養一群鴨子，鴨子可以吃掉稻田裡的害蟲和雜草。另外，鴨糞可作為肥料，以此方式種出品質優良的稻米。請問，上述此種耕作方式符合下列何種農業類型的經營型態？
  options:
  - label: A
    content: 基因改造農業
  - label: B
    content: 酪農業
  - label: C
    content: 有機農業
  - label: D
    content: 休閒農業
