- id: doc_113_新北_桃子腳_自然_g9s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 依據肉雞育種的目的及手段，下列推論何者不正確？
  options:
  - label: A
    content: 經過育種後的高產肉雞已和原始雞種相異，屬於不同物種
  - label: B
    content: 人擇達成高產肉雞的過程中仍有基因突變或重組之發生
  - label: C
    content: 降低飼養天數和飼料成本是人擇的雙目標
  - label: D
    content: 飼料配方是否改變也應加入探討育種計畫的成效
  group_stem: '9-10題為題組

    媽媽去購物商場買烤全雞，聽老闆說這些雞只需要約40天就達到上市的尺寸。近數十年，高產肉雞育種選拔計畫有著重要的突破，在持續的選拔下，以56 日齡雞隻為例，可從1957
    年的905 克/隻提升到2005 年時的4202 克/隻（如圖C 所示）。此外，為降低飼養成本，育種過程也會參考肉雞的飼料轉化率，即肉雞每單位肉重所需的飼料重量（如圖D）。'
  shared_asset: g1_9_10
