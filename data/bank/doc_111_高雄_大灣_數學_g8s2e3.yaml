- id: doc_111_高雄_大灣_數學_g8s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: (  ) 如圖，已知 $\angle ABC$ 及 $A$、$C$ 兩點，則下列四種作圖方式，何者無法作出平行四邊形 $ABCD$？
  options:
  - label: A
    content: 過 $A$ 作一直線 $L$ 平行 $\overline{BC}$，在 $L$ 上取一點 $D$，使 $\overline{AD} = \overline{BC}$，則四邊形
      $ABCD$ 為平行四邊形
  - label: B
    content: 過 $A$ 作一直線 $L$ 平行 $\overline{BC}$，過 $C$ 作一直線 $M$ 平行 $\overline{AB}$，設
      $L$ 與 $M$ 相交於 $D$ 點，則四邊形 $ABCD$ 為平行四邊形
  - label: C
    content: 分別以 $A$、$C$ 為圓心，$\overline{BC}$、$\overline{AB}$ 為半徑畫弧，設兩弧交於 $D$ 點，連接
      $\overline{AD}$ 和 $\overline{CD}$，則四邊形 $ABCD$ 為平行四邊形
  - label: D
    content: 連接 $\overline{AC}$，作 $\angle ABC$ 的角平分線交 $\overline{AC}$ 於 $O$ 點，並在直線
      $BO$ 上取一點 $D$，使 $\overline{BO} = \overline{OD}$，連接 $\overline{AD}$ 和 $\overline{CD}$，則四邊形
      $ABCD$ 為平行四邊形
  assets:
  - key: s1_7_f1
    kind: figure
    file: doc_111_高雄_大灣_數學_g8s2e3/s1_7_f1.png
    crop:
