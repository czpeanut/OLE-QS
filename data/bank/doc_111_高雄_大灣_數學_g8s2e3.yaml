- id: doc_111_高雄_大灣_數學_g8s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: (  ) 下列敘述何者正確？
  options:
  - label: A
    content: 平行四邊形的對角相等，鄰角也相等。
  - label: B
    content: 在一平面上，相異兩直線被另一直線所截的同位角會相等、內錯角會相等、同側內角會互補。
  - label: C
    content: 在一平面上，相異兩直線被另一直線所截的任一組同位角相等時，則這兩條直線會互相平行。
  - label: D
    content: 如果有一個四邊形的一組對邊互相平行，且另一組對邊等長，則這個四邊形必為平行四邊形。
