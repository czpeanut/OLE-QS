- id: doc_111_高雄_大灣_數學_g8s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: (  ) 下列敘述何者錯誤？
  options:
  - label: A
    content: 若一平行四邊形的鄰邊等長，則此平行四邊形必為菱形。
  - label: B
    content: 若一平行四邊形的鄰角相等，則此平行四邊形必為正方形。
  - label: C
    content: 對角線互相平分且等長的四邊形必為長方形。
  - label: D
    content: 對角線互相平分且垂直的四邊形必為菱形。
