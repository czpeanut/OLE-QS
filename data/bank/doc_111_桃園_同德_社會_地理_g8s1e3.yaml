  section: 1
  number: 1
  type: single
  page: 1
  stem: 兩極地區由於地處偏遠，加上獨特的地理景觀，因此成為深度旅遊的首選。住在桃園的小如利用春節假期前往極地旅遊，在當地見到（圖一）中獨特的現象，有關此趟行程的相關敘述中，何者錯誤？
  options:
  - label: A
    content: 該地區主要為三大洲所包圍的海洋
  - label: B
    content: 當地受到全球暖化影響冰層不斷崩塌
  - label: C
    content: 小如此趟旅遊還可就近到紐西蘭參觀
  - label: D
    content: 圖中的景觀和地軸傾斜的關係最大。
