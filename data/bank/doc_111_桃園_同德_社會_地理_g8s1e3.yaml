- id: doc_111_桃園_同德_社會_地理_g8s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 全球暖化（Global Warming）現象，指的是大氣和海洋中的溫室氣體過量（包括二氧化碳、甲烷、水蒸氣、氧化亞氮），使地球猶如被籠罩在厚厚的溫室中，太陽照射的熱量難以散去，導致溫度升高，引發各種極端天氣如乾旱、暴雨、熱浪等。而溫室氣體大量排放，加速全球暖化的現象，已引起許多島國及沿海港口居民的恐慌。請問：下列何項人類活動與全球暖化關係最小？
  options:
  - label: A
    content: 工業快速成長，排放二氧化碳
  - label: B
    content: 農業灌溉超量抽取地下水
  - label: C
    content: 大量森林砍伐，影響溫度調節
  - label: D
    content: 都市鋪設水泥，吸熱溫度上升。
