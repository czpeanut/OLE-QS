  stem: What is the main idea of the passage?
  options:
  - label: A
    content: Cafés provide an ideal work environment because the caffeine in coffee
      increase energy levels.
  - label: B
    content: Many people are more productive in cafés due to background noise and
      social psychology factors.
  - label: C
    content: People work more efficiently at home or in the office, as these environments
      make them focus on their work.
  - label: D
    content: Cafés are often full of people because they offer a comfortable environment
      for taking breaks.
  group_stem: "【題組三】 \nWhen you have work to do, where do you like to work? At home,\
    \ in an \noffice, or perhaps at a café? For many people, the answer is a café.\
    \ While the \ncaffeine in coffee certainly gives us energy to stay on task, there’s\
    \ more to it. A \nlot of people find that they work more efficiently in cafés,\
    \ which is why cafés \nare often full of individuals typing away on their laptops.\
    \ \nWhy do some people seem to be more productive in cafés? Some \nscientists\
    \ believe that the background noise—such as music, people chatting, or \nthe sounds\
    \ of coffee being made—helps people focus better. These sounds \nprovide just\
    \ the right level of stimulation, allowing people to focus on their \ntasks without\
    \ feeling annoyed or lost in thoughts. \nAnother theory is about social psychology.\
    \ Research shows that people \ntend to be more productive when they feel like\
    \ they have an audience. In a café, \nbeing surrounded by others who are also\
    \ working can encourage people to \nfocus. Subconsciously, the brain might interpret\
    \ the presence of other hard-\nworking individuals as competition, causing us\
    \ to finish our work more quickly. \n* interpret 詮釋 presence 出現 individuals 個人"
