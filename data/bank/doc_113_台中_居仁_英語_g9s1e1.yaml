- id: doc_113_台中_居仁_英語_g9s1e1_s6_44
  section: 6
  number: 44
  type: single
  page: 4
  stem: 'Arrange the summaries(概要) of the paragraphs in the correct order:

    I.

    Ryuzo Shigeta created the gashapon machine after improving on the

    American vending machine design.

    II. Gashapon machines offer a fun and lucky experience since you can''t

    choose which toy you’ll get.

    III. Gashapon machines are popular in Japan, providing cute, collectible

    toys, and the name comes from the machine’s sounds.'
  options:
  - label: A
    content: I → III →II
  - label: B
    content: III → I → II
  - label: C
    content: II → III → I
  - label: D
    content: III → II → I
  group_stem: "【題組一】 \nJapan is well-known for its cute and collectible items, and\
    \ gashapon \nmachines are a fun feature in many Japanese shopping centers. Gashapon\
    \ are \nvending machines, offering cute, collectible toys in exchange for coins.\
    \ Here are \nsome steps for people to use gashapon machines. First, you insert\
    \ coins into the \nmachine. Then, by turning the handle, you receive a small toy\
    \ in a plastic \ncontainer. Do you know where the name “gashapon” comes from?\
    \ Take a guess! \nIt’s the sounds the machine makes: ‘gasha’ when you turn the\
    \ handle, and ‘pon’ \nwhen the toy drops out. \nRyuzo Shigeta invented the gashapon\
    \ machine in the 1960s after being \ninspired by an American vending machine,\
    \ but he improved it by offering \nhigher-quality things. Unlike American vending\
    \ machines, which usually offer \ncheap things, Shigeta's gashapon machines feature\
    \ high-quality toys in plastic \ncontainers. \n      One special element of gashapon\
    \ machines is that users cannot choose \nwhich toy they get, making gashapon machines\
    \ a fun and lucky experience. \nMany gashapon machines offer toys related to anime,\
    \ and some of these toys \nbecome valuable collectibles. In Japan, there are more\
    \ than 360,000 gashapon \nmachines, with new products being released every month.\
    \ With just a few coins, \nanyone can enjoy this exciting shopping experience.\
    \ \n*collectible 可收藏的；收藏品"
