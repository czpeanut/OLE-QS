  - label: D
    content: Egyptian farmers used wooden frames and nets to protect their fields.
  group_stem: "【題組二】 \n      Scarecrows are a common sight in fields, guarding crops\
    \ day and night, \na role they’ve had for thousands of years. The role of scarecrows\
    \ has been the \nsame for thousands of years. \nScarecrows have been around since\
    \ at least the time of ancient Egypt. \nEgyptian farmers would build wooden frames\
    \ and cover them with nets to \nprotect their wheat fields by the Nile River.\
    \ Farmers would then hide in the \nwheat and jump out to scare birds into the\
    \ nets. Around 2500 BCE, the Greeks \ncreated the first human-like scarecrows,\
    \ giving them a face similar to that of the \nGreek god Priapus. This design was\
    \ believed to drive birds away from the \ncrops. The Romans copied this design\
    \ and spread it across Europe during the \nRoman Empire. \n      Centuries after\
    \ the fall of the Roman Empire, many cultures around the \nworld began to create\
    \ their own versions of scarecrows. In Japan, scarecrows \nwere shaped like humans\
    \ and dressed in raincoats and straw hats. In Germany, \nthey were made to look\
    \ like witches. You would never guess. In Britain, \nchildren even act as living\
    \ scarecrows."
- id: doc_113_台中_居仁_英語_g9s1e1_s6_46
  section: 6
  number: 46
  type: single
