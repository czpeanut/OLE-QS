    \ simple kiss to the magical \nstone. According to legend, one kiss of the stone\
    \ will bring people good luck \nand have them gain the skills in persuasion. \n\
    The Blarney Stone is a piece of limestone built into Blarney Castle in \nIreland.\
    \ The story goes that the castle’s builder, Cormac MacCarthy, got caught \nup\
    \ in a trial in the 15th century. To improve his chances of winning, MacCarthy\
    \ \nasked the Queen of the Banshees for help. She told him to kiss the first stone\
    \ he \nsaw on his way to court. He followed her advice and was blessed with the\
    \ “gift \nof gab.” That helped him win his case. MacCarthy was so thankful that\
    \ he took \nthe stone and had it built into the castle wall. \nIn another version\
    \ of the legend, MacCarthy was heading to meet Queen \nElizabeth I, who was planning\
    \ to take his land. On the way, he kissed the stone \nand was gifted great power\
    \ of speech. With his new skill, he talked the Queen \ninto letting him keep his\
    \ land. Afterward, the story of the stone’s powers spread \nwidely.          \
