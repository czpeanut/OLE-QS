- id: doc_113_台中_居仁_英語_g9s1e1_s6_50
  section: 6
  number: 50
  type: single
  page: 6
  stem: 'To better understand chinchillas and rabbits, Alex creates a diagram.

    Based on the dialogue, which features should Alex choose to fill in

    the blank?


    | ① Exercise needs | ⑤ Active, love to climb |

    | --- | --- |

    | ② Soft fur | ⑥ Energetic, love to hop and dig |

    | ③ Self-grooming | ⑦ Dust baths, can’t get wet |

    | ④ Not rodent species | ⑧ A cooler environment needed |'
  options:
  - label: A
    content: ③、④、⑥
  - label: B
    content: ④、⑥、⑧
  - label: C
    content: ③、⑥、⑦
  - label: D
    content: ⑤、⑦、⑧
  group_stem: "【題組五】 \nAlex: Hey, Emily! I’m thinking about getting a pet, maybe a\
    \ chinchilla or a \nrabbit. Do you know much about them? \nEmily: Yeah, I know\
    \ a little! Both are cute, but they’re pretty different. Many \npeople think that\
    \ rabbits are rodents like chinchillas, but they actually \nare not. What kind\
    \ of pet are you looking for? \nAlex: I want something soft and fun to watch.\
    \ I heard chinchillas have really \nsoft fur. Is that true? \nEmily: Oh, yes!\
    \ But chinchillas need dust baths to stay clean, not water baths \nlike other\
    \ animals. If they get wet, it can cause skin problems because \ntheir fur is\
    \ so thick. \nAlex: That’s interesting! So, do rabbits also need special baths?\
    \ \nEmily: Not really. Rabbits groom themselves, kind of like cats. But if they\
    \ have \nlong fur, you might need to brush them, so they don’t get tangles. \n\
    Alex: What about their diet or need for exercise? Are they both playful? \nEmily:\
    \ Yes, but in different ways. Chinchillas love to climb and jump around. \nThey’re\
    \ very active, especially at night. Rabbits, on the other hand, love \nto hop\
    \ and dig. They can be playful and even learn tricks, but they’re \nusually more\
    \ calm than chinchillas. As for their eating habits, they are \nboth plant-eating\
    \ animals. \nAlex: Hmm, I don’t have much space at home. Which one would do better\
    \ in a \nsmall apartment? \nEmily: Chinchillas need a tall cage with levels to\
    \ climb, so they might need \nmore space than rabbits. Rabbits can live in smaller\
    \ spaces, but they’ll \nneed time outside the cage to hop around. \nAlex: I see.\
    \ And what about their care? Are they easy to take care of? \nEmily: Both need\
