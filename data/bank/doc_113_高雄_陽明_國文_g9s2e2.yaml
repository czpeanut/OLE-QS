- id: doc_113_高雄_陽明_國文_g9s2e2_s2_29
  section: 2
  number: 29
  type: single
  page: 6
  stem: 文中提到新細明體被學院指定用於報告，最主要原因是下列何者？
  options:
  - label: A
    content: 具有新潮的設計風格，能體現學術的前沿性
  - label: B
    content: 字體造型張狂，較能吸引讀者目光及注意力
  - label: C
    content: 給人素然無味的感覺，有助於讀者專心閱讀
  - label: D
    content: 取得方便，是大多數人電腦系統的預設字體
  group_stem: '大多數機場的指標都使用黑體字，因為它給人乾淨簡潔的現代感。若使用新細明體，由於筆畫很細，一段距離外就不易閱讀，甚至連發現它都有困難。新細明體的橫筆設計得偏細，不適合使用在距離讀者較遠的指標上。而黑體橫筆夠粗，就有良好的「易視性」。

    新細明體在80 年代曾是新潮設計，但時過境遷，難免審美疲乏，是想改變中文字型設計現狀者要革新的對象。高解析度螢幕時代，它更難以勝任螢幕上的閱讀。但只要它是系統內建的首要字型，就會是大多數人的首選。如此一來，文字風景的基本面一時難有什麼變化。

    新細明體是專門用在「紙本」上的，離讀者眼前不遠，可能是放在桌上、捧在手上讀。這種字體我們稱為「內文」。通常，內文字體會設計得讓人感覺變化不大，沒有張狂的造型，像喝水那樣素然無味。但這樣「無聊」的體驗，反而有助於專心吸收資訊。新細明體是很普遍的內文字體，因而有學院指定報告使用新細明體，以減輕教授閱讀的負擔。

    ——改寫自柯志傑、蘇煒翔《字型散步》'
