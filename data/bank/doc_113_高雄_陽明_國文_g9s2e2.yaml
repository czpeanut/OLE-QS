- id: doc_113_高雄_陽明_國文_g9s2e2_s2_38
  section: 2
  number: 38
  type: single
  page: 8
  stem: 根據本文，為什麼52 赫茲鯨魚最初被稱為「世界上最孤獨的鯨魚」？
  options:
  - label: A
    content: 當時未發現其他發出相似頻率的鯨魚
  - label: B
    content: 科學家發現牠總是在深海獨自地游動
  - label: C
    content: 因為牠的聲音頻率超越人類聽覺範圍
  - label: D
    content: 牠的遷徙路線與其他的鯨魚完全相反
  group_stem: '52 赫茲鯨魚的故事要從冷戰時期說起，當時美國海軍為了偵測蘇聯潛水艇，在海底放了大量水下麥克風（hydrophone），結果沒逮到潛水艇，反而收到一個很奇怪的聲音。這個聲音聽起來像鯨魚，但頻率超高，竟然有52
    赫茲，要知道，一般的藍鯨（blue whale）發出的聲音主要在10~40 赫茲之間，而長鬚鯨（fin whale）則約20 赫茲。因此，最初科學家認為，52
    赫茲鯨魚可能在深海中獨自鳴唱毫無回應。

    但是，生物能發出的聲音和牠的聽力範圍其實是兩回事，為了生存所需，大多數的動物都會演化出較廣的聽力範圍，來因應環境變動和躲避掠食者。雖然藍鯨的發聲頻率為10~40
    赫茲，但不代表牠們聽不到52 赫茲鯨魚的聲音，一般來說鬚鯨的聽力範圍約在10 赫茲到數千赫茲之間，範圍因物種而異。而且鯨魚的交流並不單單依賴頻率，還包括節奏、聲壓等其他聲音特徵。即使頻率不同，牠們仍可能透過這些特徵來解讀訊息。所以，52
    赫茲不一定「聽不見」，也不一定「聽不懂」。

    目前的研究只有透過水下麥克風收到這個52 赫茲的聲音，但誰能肯定牠只能發出這種聲音呢，科學家其實並不排除52 赫茲鯨魚也可能發出其他頻率的聲音，只是不巧目前還沒有被偵測到過。

    52 赫茲鯨魚在1989 年首次被發現並大幅報導後，人們浪漫的將牠稱為「世界上最孤獨的鯨魚」。然而，近年我們有了令人慶幸的發現。2010 年，美國 加州沿岸的水下麥克風偵測到與52
    赫茲鯨魚相似的鳴唱，而且確定不只一個來源。

    這個發現為52 赫茲鯨魚的故事帶來了轉機，也推翻了牠是完全孤獨的個體這個說法。或許，牠並非獨自遊蕩，而是屬於一個我們尚未完全了解的鯨魚族群，甚至是一個新的鯨魚種類。

    還有一個有趣的事，科學家發現，52 赫茲鯨魚的聲音頻率似乎隨著時間推移而降低。自1992 年以來，其頻率已從52 赫茲降至約47~49赫茲。這種變化可能與鯨魚的生長和成熟有關，就像男生青春期會變聲一樣。

    關於52 赫茲鯨魚，還存在著許多未知。由於牠的遷徙路線跟藍鯨很像，可是活動的時間又跟長鬚鯨相近，目前有科學家推測，52 赫茲鯨魚可能是藍鯨和長鬚鯨的雜交種（hybrid）。這種雜交種鯨魚的體型可能較接近長鬚鯨，但吻部和鰭狀肢則更像藍鯨。然而，至今科學家還沒觀察到52
    赫茲的本尊過，因此這個假說仍需要更多證據來支持。

    但在流行文化中，52 赫茲鯨魚的故事就多了。許多藝術家、音樂家和電影製作人，都以牠為靈感，創作出各種作品。例如南韓團體BTS的歌曲〈Whalien 52〉以及台灣導演魏德聖的電影《52
    赫茲我愛你》。在這些作品中，52 赫茲鯨魚往往被視為孤獨、被誤解的象徵，帶出藝術家對自我和社會的深刻反思。

    52 赫茲鯨魚的故事，並非只是一則關於一隻「疑似孤獨」鯨魚的故事，牠的存在提醒著我們對於海洋的了解實在太少，要持續保持好奇心去探索、去發現。同時，牠也讓我們反思人常常把自己的情感投射到動物身上，我們覺得牠如此孤單，可能是因為我們自己也曾經感到孤單。現在我們確定52
    赫茲有一同鳴唱的夥伴，但也許未來某天牠還會再次帶給科學家「鯨」奇！             ——郭毓璞〈52 赫茲鯨魚〉'
- id: doc_113_高雄_陽明_國文_g9s2e2_s2_39
  section: 2
  number: 39
  type: single
  page: 8
  stem: 根據本文，52 赫茲鯨魚聲音頻率下降的可能原因是？
  options:
  - label: A
    content: 海洋環境噪音的增加
  - label: B
    content: 為適應同類聽力範圍
  - label: C
    content: 聲帶受損的自然退化
  - label: D
    content: 生長成熟的生理變化
  group_stem: '52 赫茲鯨魚的故事要從冷戰時期說起，當時美國海軍為了偵測蘇聯潛水艇，在海底放了大量水下麥克風（hydrophone），結果沒逮到潛水艇，反而收到一個很奇怪的聲音。這個聲音聽起來像鯨魚，但頻率超高，竟然有52
    赫茲，要知道，一般的藍鯨（blue whale）發出的聲音主要在10~40 赫茲之間，而長鬚鯨（fin whale）則約20 赫茲。因此，最初科學家認為，52
    赫茲鯨魚可能在深海中獨自鳴唱毫無回應。

    但是，生物能發出的聲音和牠的聽力範圍其實是兩回事，為了生存所需，大多數的動物都會演化出較廣的聽力範圍，來因應環境變動和躲避掠食者。雖然藍鯨的發聲頻率為10~40
    赫茲，但不代表牠們聽不到52 赫茲鯨魚的聲音，一般來說鬚鯨的聽力範圍約在10 赫茲到數千赫茲之間，範圍因物種而異。而且鯨魚的交流並不單單依賴頻率，還包括節奏、聲壓等其他聲音特徵。即使頻率不同，牠們仍可能透過這些特徵來解讀訊息。所以，52
    赫茲不一定「聽不見」，也不一定「聽不懂」。

    目前的研究只有透過水下麥克風收到這個52 赫茲的聲音，但誰能肯定牠只能發出這種聲音呢，科學家其實並不排除52 赫茲鯨魚也可能發出其他頻率的聲音，只是不巧目前還沒有被偵測到過。

    52 赫茲鯨魚在1989 年首次被發現並大幅報導後，人們浪漫的將牠稱為「世界上最孤獨的鯨魚」。然而，近年我們有了令人慶幸的發現。2010 年，美國 加州沿岸的水下麥克風偵測到與52
    赫茲鯨魚相似的鳴唱，而且確定不只一個來源。

    這個發現為52 赫茲鯨魚的故事帶來了轉機，也推翻了牠是完全孤獨的個體這個說法。或許，牠並非獨自遊蕩，而是屬於一個我們尚未完全了解的鯨魚族群，甚至是一個新的鯨魚種類。

    還有一個有趣的事，科學家發現，52 赫茲鯨魚的聲音頻率似乎隨著時間推移而降低。自1992 年以來，其頻率已從52 赫茲降至約47~49赫茲。這種變化可能與鯨魚的生長和成熟有關，就像男生青春期會變聲一樣。

    關於52 赫茲鯨魚，還存在著許多未知。由於牠的遷徙路線跟藍鯨很像，可是活動的時間又跟長鬚鯨相近，目前有科學家推測，52 赫茲鯨魚可能是藍鯨和長鬚鯨的雜交種（hybrid）。這種雜交種鯨魚的體型可能較接近長鬚鯨，但吻部和鰭狀肢則更像藍鯨。然而，至今科學家還沒觀察到52
    赫茲的本尊過，因此這個假說仍需要更多證據來支持。

    但在流行文化中，52 赫茲鯨魚的故事就多了。許多藝術家、音樂家和電影製作人，都以牠為靈感，創作出各種作品。例如南韓團體BTS的歌曲〈Whalien 52〉以及台灣導演魏德聖的電影《52
    赫茲我愛你》。在這些作品中，52 赫茲鯨魚往往被視為孤獨、被誤解的象徵，帶出藝術家對自我和社會的深刻反思。

    52 赫茲鯨魚的故事，並非只是一則關於一隻「疑似孤獨」鯨魚的故事，牠的存在提醒著我們對於海洋的了解實在太少，要持續保持好奇心去探索、去發現。同時，牠也讓我們反思人常常把自己的情感投射到動物身上，我們覺得牠如此孤單，可能是因為我們自己也曾經感到孤單。現在我們確定52
    赫茲有一同鳴唱的夥伴，但也許未來某天牠還會再次帶給科學家「鯨」奇！             ——郭毓璞〈52 赫茲鯨魚〉'
