  group_stem: '自孔子聖人，其學必始於觀書。當是時，惟周之柱下史1 老聃為多書。韓宣子適魯，然後見《易象》與《魯春秋》。季札聘於上國2，然後得聞《詩》之風、雅、頌。而楚獨有左史倚相3，能讀《三墳》、《五典》、《八索》、《九丘》。士之生於是時，得見《六經》者蓋無幾，其學可謂難矣！而皆習於禮樂，深於道德，非後世君子所及。

    自秦 漢以來，作者益眾，紙與字畫日趨於簡便，而書益多，士莫不有，然學者益以苟簡，何哉？余猶及見老儒先生，自言其少時，欲求《史記》、《漢書》而不可得；幸而得之，皆手自書，日夜誦讀，惟恐不及。近歲市人轉相摹刻，諸子百家之書，日傳萬紙。學者之於書，多且易致如此，其文詞學術，當倍蓰4
    於昔人；而後生科舉之士，皆束書不觀，游談無根，此又何也？

    ——蘇軾〈李氏山房藏書記〉


    1.柱下史：掌管王室藏書的官。

    2.上國：此指魯國。

    3.倚相：春秋時楚國的史官。

    4.倍蓰：超過數倍。'
