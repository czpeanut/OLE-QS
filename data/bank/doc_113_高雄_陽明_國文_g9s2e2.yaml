  type: single
  page: 1
  stem: 「成長恰似破土而出的幼苗，土壤的阻力越大，就越能激發它向上生長的力量。成長幫我們篩選出人生最堅韌的品質。因此，成長中的困難是無需畏懼的，困難越多，就越應該把精力聚焦在向上生長的方向，那才是鑄就輝煌的必經之路。」下列何者最接近本文作者的觀點？
  options:
  - label: A
    content: 好漢不吃眼前虧
  - label: B
    content: 船到橋頭自然直
  - label: C
    content: 梅花香自苦寒來
  - label: D
    content: 眾人拾柴火焰高
