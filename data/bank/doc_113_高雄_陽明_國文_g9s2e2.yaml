- id: doc_113_高雄_陽明_國文_g9s2e2_s1_18
  section: 1
  number: 18
  type: single
  page: 3
  stem: 陳老師在教育界辛勤耕耘了四十年，如今光榮退休。眾多學生趕來為他舉辦了一場溫馨的歡送會。根據下面的對話，誰的做法或說法最恰當？
  options:
  - label: A
    content: 曉妍帶著一方寫著「杏林之光」的匾額，滿懷敬意地說：「老師，您這幾十年的教育工作就像杏林裡的光，照亮我們前行的道路，這塊匾額代表我們對您的感激。」
  - label: B
    content: 這時，宇軒開口道：「老師對我們的教育恩澤深厚，我覺得『教澤永懷』最能表達我們的感恩。」
  - label: C
    content: 一旁的梓豪也發表意見：「老師言傳身教，為我們樹立了榜樣，『師表千古』最能體現老師的影響力。」
  - label: D
    content: 最後，班長嘉怡微笑著拿出一幅寫著「弦歌不輟」的書法作品，說道：「老師，您在教育路上從未停歇，『弦歌不輟』正是您教育生涯的寫照，我們都很感激您。」
- id: doc_113_高雄_陽明_國文_g9s2e2_s1_19
  section: 1
  number: 19
  type: single
  page: 3
  stem: 「左思欲賦三都，遂構思十年。門庭藩溷皆著紙筆，偶得一句，即便疏之。及賦成，時人未之重。思自以所作不謝班、張，恐以人廢言，乃請皇甫謐為序。自是豪貴之家競相傳寫，洛陽為之紙貴。」根據上文，下列敘述何者最恰當？
  options:
  - label: A
    content: 左思隨興創作，耗時短暫就完成賦
  - label: B
    content: 《三都賦》成書以後立即風行洛陽
  - label: C
    content: 皇甫謐作序幫助左思擺脫世人輕蔑
  - label: D
    content: 左思因文采遜於班固、張衡而求序
- id: doc_113_高雄_陽明_國文_g9s2e2_s1_20
  section: 1
  number: 20
  type: single
  page: 4
  stem: 「孟子稱：『人之患，在好為人師。』由魏、晉氏以下，人益不事師。今之世不聞有師，有，輒譁笑之，以為狂人。獨韓愈奮不顧流俗，犯笑侮，收召後學，作〈師說〉，因抗顏而為師。世果群怪聚罵，指目牽引，而增與為言辭。愈以是得狂名，居長安，炊不暇熟，又挈挈而東，如是者數矣。」依據上文，韓愈被當世視為「狂人」的主要原因是：
  options:
  - label: A
    content: 大力抨擊孟子「好為人師是弊病」的觀點
  - label: B
    content: 自以為是，批判魏晉以來的不良學術風氣
  - label: C
