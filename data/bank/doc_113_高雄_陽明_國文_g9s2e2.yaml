- id: doc_113_高雄_陽明_國文_g9s2e2_s2_41
  section: 2
  number: 41
  type: single
  page: 9
  stem: 下列關於甲、乙二文文句的說明，何者最恰當？
  options:
  - label: A
    content: 「叱奴下車，因格殺之」凸顯董宣執法果斷且不畏權勢的態度
  - label: B
    content: 「天子先驅至，不得入」反映周亞夫輕視君主權威的傲慢心態
  - label: C
    content: 「將軍約，軍中不得驅馳」強調漢文帝對軍紀要求嚴格
  - label: D
    content: 「由是搏擊豪強，莫不震慄」暗示董宣藉職權打壓異己
  group_stem: '【甲】

    陳留 董宣為洛陽令。湖陽公主1 蒼頭2 白日殺人，因匿主家，吏不能得。及主出行，以奴驂乘3。宣於夏門亭侯之，駐車叩馬，以刀畫地，大言數主之失，叱奴下車，因格殺之。

    主即還宮訴帝。帝大怒，召宣，欲捶殺之。宣叩頭曰「願乞一言而死。」帝曰：「欲何言？」宣曰：「陛下聖德中興，而縱奴殺人，將何以治天下乎？臣不須捶，請得自殺。」即以頭擊楹，流血披面。帝令小黃門4
    持之，使宣叩頭謝主。宣不從，強使頓之，宣兩手據地，終不肯俯。主曰：「文叔5 為白衣6 時，藏亡匿死，吏不敢門。今為天子，威不能行一令乎！」帝笑曰：「天子不與白衣同。」因敕：「強項令7
    出！」賜錢三十萬。宣悉以班諸吏。由是能搏擊豪強，京師莫不震慄。

    ——節選自《後漢書・董宣傳》


    【乙】

    文帝后元六年，匈奴大入邊。乃以宗正劉禮為將軍，軍霸上；祝茲侯徐厲為將軍，軍棘門；以河內守亞夫為將軍，軍細柳，以備胡。

    上自勞軍。至霸上及棘門軍，直馳入，將以下騎送迎。已而之細柳軍……天子先驅至，不得入。先驅曰：「天子且8 至！」軍門都尉曰：「將軍令曰：『軍中聞將軍令，不聞天子之詔。』」居無何9，上至，又不得入。於是上乃使使持節詔將軍：「吾欲入勞軍。」亞夫乃傳言開壁門。壁門士吏謂從屬車騎曰：「將軍約，軍中不得驅馳。」於是天子乃按轡徐行。至營，將軍亞夫持兵揖曰：「介胄之士不拜，請以軍禮見。」天子為動，改容式車10。使人稱謝：「皇帝敬勞將軍。」成禮而去。

    ——節選自《史記・絳侯周勃世家》


    1.湖陽公主：漢 光武帝 劉秀的姐姐。

    2.蒼頭：僕人。

    3.驂乘：ㄘㄢ ㄕㄥˋ，駕車。

    4.黃門：太監。

    5.文叔：漢 光武帝 劉秀的字。

    6.白衣：平民。

    7.強項令：硬脖子縣令。

    8.且：即將。

    9.居無何：過了不久。

    10.式車：手扶車前橫木站在車上。'
