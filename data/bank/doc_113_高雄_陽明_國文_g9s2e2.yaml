  group_stem: '甘蔗是煉糖原料。溫暖潮濕的臺灣適合甘蔗生長，元朝 汪大淵《島夷志略》即有「釀蔗漿為酒」的記載。荷蘭占領臺灣後，引進製糖技術，將成品銷往日本。日本因地理環境，長期以來大量依賴外國的進口糖。

    日治時期，臺灣總督府積極推動糖業現代化，成立新式製糖廠。發達的糖業帶動了甜點、煉乳相關產業的發展。現今頗受歡迎的日本 明治巧克力，其製造商「明治製菓」，其實創立於臺灣。

    市面上常見的甘蔗，有供榨汁用的白甘蔗與可直接啃食的紅甘蔗。啃甘蔗在焦桐眼中，是複雜的口腔運動。《晉書》載名士顧愷之「每食甘蔗，恆自尾至本，人或怪之。云：『漸入佳境』。」余光中〈埔里甘蔗〉認為吃甘蔗：「無論是倒啖或者順吃／每一口都是口福／第一口就咬入了佳境／卻笑東晉的名士／嚼來還是太拘謹。」同時分享心得：「而真要啖得痛快／就務必冰得徹底／嚐到那樣的甜頭，幾乎／捨不得吐掉渣子／直到嚥最後的一口／還舔著黏黏的手指頭／像剛斷奶的孩子。」

    大夥一起啃甘蔗曾是許多人共同的回憶。洪愛珠在〈蘆洲老區涼水兩味〉中，憶起幼時家族老小並肩而坐啃甘蔗，覺得「於齒間碾緊，吮汁，樂呵呵吐出一碗渣來，是一種粗爽樸素的消遣。」但現在如果突然想啃，也不易買到。因而不禁說道:「時間這躡步之賊，是如此將一個許多人啃甘蔗的社會，置換成甘蔗難尋的社會。」

    ——節選自〈114 學年度學測國語文綜合能力測驗試題〉'
