  stem: 嘗有人問于蘇文忠公，曰：「公之博洽可學乎？」曰：「可。吾嘗讀《漢書》矣，蓋數過而始盡之。如治道、人物、地理、官制、兵法、貨財之類。每一過專求一事，不待數過，而事事精核矣。」根據本文，蘇文忠公認為面對浩瀚的書海，要能學有所成，最重要的功夫是下列何者？
