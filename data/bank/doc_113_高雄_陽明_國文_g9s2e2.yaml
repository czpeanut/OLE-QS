  stem: 根據上文，下列哪一項是文中未提及的影響風箏飛行的因素？
  options:
  - label: A
    content: 操作者年齡與經驗
  - label: B
    content: 空氣中的濕度變化
  - label: C
    content: 風速與風向穩定性
  - label: D
    content: 氣壓系統分佈狀態
  group_stem: '「草長鶯飛二月天，拂堤楊柳醉春煙。兒童散學歸來早，忙趁東風放紙鳶。」自古以來放紙鳶——放風箏就是一種深受人們喜愛的民俗活動。

    「結伴兒童褲褶紅，手提線索罵天公。人人誇你春來早，欠我風箏五丈風。」孩子們沒能把風箏成功放飛！非但不從自身找原因，反而抱怨風力不夠，可愛形象躍然紙上。

    看來想把風箏高高飛在天上，絕非易事。

    風力和風向對風箏的升空有決定性影響。風力較大時，適宜放大風箏；風力小時，適宜放小風箏。風力穩定時，風箏飛得比較平穩；風力變化不定時，控制風箏的人就有點兒手忙腳亂。同樣的道理，不斷變化的風向也會對空中的風箏產生影響。

    氣溫太高或者太低，人們容易中暑或被凍傷，不適合放風箏。

    空氣濕度較大時，風箏身上會吸附許多水汽，導致自重增加，蒙面變軟，加大放飛難度，風箏也容易脫膠或變形，影響放飛效果。

    氣壓同樣會影響放風箏。某個區域為高氣壓所控制時，由於大氣中盛行下沉氣流，風箏不易飛起來。反之，風箏易於飛起。

    ——節選自〈2024 年遼寧省中考語文試題〉'
