- id: doc_113_高雄_陽明_國文_g9s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 李斯〈諫逐客書〉中提到：「臣聞地廣者粟多，國大者人眾，兵彊則士勇。是以泰山不讓土壤，故能成其大；河海不擇細流，故能就其深；王者不卻眾庶，故能明其德。是以地無四方，民無異國，四時充美，鬼神降福，此五帝、三王之所以無敵也。今乃棄黔首以資敵國，卻賓客以業諸侯，使天下之士退而不敢西向，裹足不入秦，此所謂『藉寇兵而齎盜糧』者也。」關於這段文字的寫作分析，下列敘述何者最恰當？
  options:
  - label: A
    content: 對比分析，彰顯差異，支持秦王驅逐客卿
  - label: B
    content: 採先揚後抑筆法，讚賞秦王善於重用人才
  - label: C
    content: 以整齊句式增強氣勢，勸諫秦王勿逐客卿
  - label: D
    content: 列舉先王成功事例，告誡秦王勿驕傲自滿
  lesson_raw:
    title: 諫逐客書
    basis: 題目直接引用李斯〈諫逐客書〉課文內容
