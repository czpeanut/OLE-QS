- id: doc_113_高雄_陽明_國文_g9s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 「讀書時，須細看古人處一事，接一物，是如何思量？如何氣象？及自己處事接物時，又細心將古人比擬。設若古人當此，其措置之法，當是如何？我自己任性為之，又當如何？然後自己過錯始見，古人道理始出。斷不可以古人之書，與自己處事接物為兩事。」根據上文，下列敘述何者最符合作者的觀點？
  options:
  - label: A
    content: 讀書時要把古人的每一句話都當絕對真理，不能有任何自己的想法
  - label: B
    content: 處事接物時，應揣摩古人的應對思路，進而審視自身做法是否妥當
  - label: C
    content: 古人書籍所講內容和現代生活差異極大，無須將二者進行關聯思考
  - label: D
    content: 必須原原本本照搬古人在書中的處事接物方式，方夠獲得真正成長
