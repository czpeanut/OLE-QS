  type: single
  page: 3
  stem: 「在人際交往中，第一印象的形成包含三個關鍵因素：外貌、言行舉止和初次表達的觀點。當這三者傳遞出的資訊不一致時，外貌往往在第一印象的塑造中佔據更突出的地位。」下列情境，何者最符合這段文字的內容？
  options:
  - label: A
    content: 行業研討會上，一位穿著普通但見解深刻的專家，憑藉專業的觀點贏得眾人欽佩
  - label: B
    content: 初次見面，小趙穿著時尚得體，雖然交談時常打斷對方，仍給人留下良好的印象
  - label: C
    content: 志願活動中，大家都忙著交流，小張雖長相平凡，但熱情主動，很快與他人熟絡
  - label: D
    content: 商務晚宴上，小王穿著破舊不搭，但他的談吐優雅，廠商因此立即與他簽約合作
- id: doc_113_高雄_陽明_國文_g9s2e2_s1_16
  section: 1
  number: 16
  type: single
  page: 3
  stem: 「樽前一曲歌，歌裡千重意。才欲歌時淚已流，恨應更、多於淚。 試問緣何事？不語如癡醉。我亦情多不忍聞，怕和我、成憔悴。」關於這闋詞的分析，下列敘述何者正確？
  options:
  - label: A
    content: 「樽前一曲歌，歌裡千重意」描寫歌聲美妙動聽，令人陶醉於其中
  - label: B
    content: 「才欲歌時淚已流，恨應更、多於淚」借淚恨對比，訴說愁緒萬千
  - label: C
    content: 「試問緣何事？不語如癡醉」表明唱歌者故作神秘，不願與人交流
  - label: D
    content: 「我亦情多不忍聞，怕和我、成憔悴」體現聽者無情，想置身事外
