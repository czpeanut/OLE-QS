- id: doc_111_桃園_石門_國文_g7s1e2_s5_29
  section: 5
  number: 29
  type: single
  page: 4
  stem: 是什麼原因讓作者開始討厭爸爸？
  options:
  - label: A
    content: 同學嘲笑作者的爸爸臉上都是麻子
  - label: B
    content: 作者的父親生氣地用棍子毆打作者
  - label: C
    content: 作者的父親和校長抱怨作者不認真
  - label: D
    content: 作者常欺負同學的事情被父親知道。
  group_stem: '杜解萍〈天花惹的禍〉

    迎面走來一位矮個子的伯伯，戴著一頂滑稽的帽子，蓋不住滿臉坑坑疤疤的凹洞。一群同學們追在後面嘲笑他：「麻臉、麻臉，不要臉，女生不愛他的臉，麻臉、麻臉，不要臉……」我見狀馬上轉身快步離開，心急得快跳出來，噙著眼淚，滿臉通紅，恨不得有個地洞鑽進去，心裡多麼痛恨爸爸有一張這麼醜陋的臉呀！爸爸很疼我，從小就常帶著我去看歌仔戲、布袋戲，好吃的東西一定不會忘了我，一直以來，我都不認為爸爸臉上凹凸不平的皮膚有什麼問題。有時盯著爸爸看，他會笑瞇瞇地講述他出天花1的故事，媽媽也常叮嚀我們，因為出天花而左眼失明的爸爸，工作起來比正常人更辛苦，但他為了我們這些孩子，甘之如飴2地努力打拚，孩子們要多孝順爸爸才行呀。我點頭如搗蒜。懂懂懂！愛爸爸的心濃濃濃！

    但一切的美好，就在小學三年級發生那事件時，瞬間崩毀了。同學的嘲笑讓我無地自容，我的心像是被重重地搥了一拳，原來麻臉是種恥辱，是貼在臉上抹不去的印記。多麼羞恥啊！有這樣的爸爸，以後怎麼在同學面前抬起頭呢？我再也不要上學了，躲在扶桑花叢下哭了一節課，放學了也不想回家，低著頭，踢著小石子，爸爸那張花臉一直在眼前晃動，像蜘蛛網黏在身上，拍都拍不掉。爸爸為什麼要出天花？

    天愈來愈暗了，空蕩蕩的校園開始恐怖起來，正猶豫著該回家還是繼續待在學校，校長朝我走了過來。他溫和地問我：「這麼晚了為什麼還不回家？」問我的名字，問我住哪裡，問我家長是誰，要不要送我回去……

    一連串的關心，讓我的眼淚決堤，和盤托出3心中的鬱悶。我抽搐著，不算完整地表達……但校長已了然於心，拉著我坐在他身旁：「我認識你爸爸，他是一個最值得尊敬的人！生天花不是他願意的，那是一種疾病，就跟你感冒一樣，沒法子避免的。但是，崇高的人格卻是自己可以追求的。你爸爸因為生了這個病，失去一隻眼睛也毀了容，但是他不懼怕，反而自立自強，他是我見過最正直、最熱心的公務員，你應該以他為榮才是！小朋友們頑皮不懂事，這樣取笑別人是很幼稚的行為，你可別跟他們一般見識。」

    聽完校長的話，我突然羞愧起來。是呀，我一向不都覺得爸爸最偉大嗎？為什麼聽到別人的嘲弄，就失去了對爸爸的信任？還白白哭了一下午，真是太不應該了。我恨不得插翅飛到爸爸身邊，我要好好地向他懺悔，我要緊緊地抱住他，我要告訴他，麻臉、獨眼都不算什麼，「你是我最最偉大的爸爸！」

    ＊生難字詞解釋：

    1.天花：病名。病原體是一種病毒，潛伏期約十至十四天，其症狀有發高燒、發疹等，可種牛痘預防。

    2.甘之如飴：比喻樂意承擔艱苦的事情，或處於困境卻能甘心忍受。

    3.和盤托出：比喻毫無保留的全部拿出來或說出來。

    （選自一定會幸福：聯副50 個最動人的故事）'
