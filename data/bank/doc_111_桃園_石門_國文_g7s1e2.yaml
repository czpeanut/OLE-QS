- id: doc_111_桃園_石門_國文_g7s1e2_s5_23
  section: 5
  number: 23
  type: single
  page: 3
  stem: 關於上文數據統計運動類型的網路文章，下列敘述何者正確？
  options:
  - label: A
    content: 網路上運動類型的文章有超過半數是討論球類型的運動
  - label: B
    content: 就單一運動的關注度，依序為籃球、棒球、足球、健身、路跑
  - label: C
    content: 臺灣網友們在網路上僅只關注不同類型的球類運動賽事
  - label: D
    content: 網路上運動類型文章的數量前三名都屬於球類型的運動。
  group_stem: '體育圈現在最瘋哪項運動

    臺灣觀賞運動賽事的風氣非常盛行，每年都吸引許多球迷關注各大運動賽事的轉播。但你知道在臺灣，究竟哪幾項運動在網路社群球迷間的討論最為熱烈嗎？就讓我們用完整數據告訴你答案吧！

    提到運動，要是不聊籃球就不夠潮？

    根據搜尋「運動」類型文章的關鍵字顯示，在運動類型文章中，籃球相關文章以22%的比例成為最受關注的運動，其次是18%的棒球類，屬於球類尚有第四名的足球（14%），而分居第三、第五名的則是近期較受網友青睞的健身（15%）與路跑（9%）項目。

    別再相信不實謠言了，女生也很關心運動話題的，好嗎！

    很多人總認為，只有男生才喜歡運動賽事。但是現代女性也是很關心運動賽事的！根據數據顯示，運動類型文章有超過五成四的瀏覽者為女性，超越男性讀者近十個百分點，顯示女性讀者並不如想像中對於運動賽事那般「冷感」。

    另外，在運動類型文章的讀者中，擁有最多瀏覽者的年齡層是三十一至三十五歲的青年族群，是唯一超過20%的年齡層，其次則為占15.6%的二十一至二十五歲。而值得一提的是緊追在十五歲以下的族群，竟是年紀比青年族群再略長些的三十六至四十歲族群，約有9.3%的比率，而未能擠進前五名的四十至五十歲、五十歲以上兩大族群，則以6.4%、6.7%的比例排列在後，即便已經到了「愛運動但體力有限」的年紀，卻依然關心運動賽事，真是「熱血少年不夠看，熱血大叔大嬸才厲害」！

    （改寫自二○一五年四月二十七日遠見雜誌「痞客邦關鍵報告」）'
