  group_stem: "（圖片來源：桃園萬聖城活動官網）\n  2022 桃園萬聖城活動盛大開幕，有驚魂馬戲棚、巨耳兔的詛咒世界、萬聖小屋等各式裝置藝術等著大朋友、小朋友前來留下美好的回憶，每日都會發放萬聖節限定邪惡南瓜燈籠。\n\
    ＊活動時間：11/2(三)~11/10(四)，平日下午16 點開放、假日12 點開放入場，最晚展場開放至晚上22 點為止。第一天開幕活動延至17:30 開始。\n\
    ＊地點：桃園藝文廣場\n＊特殊活動:\n11/3 火辣辣淑女之夜 LADY’S NIGHT：當天高中以上的女孩們只要穿著含有紅色元素服裝來到現場就能得到造型棉花糖。\n\
    11/4 穿上制服我驕傲 Uniform NIGHT：當日穿著制服，不論是學生制服還是工作制服，經工作人員認定符合即可領取造型貓耳髮箍！\n11/5 萬聖城最帥一夜\
    \ Gentleman’s Night：男性朋友當天只要打著領帶、領結、穿西裝外套、皮鞋 (以上擇一)就可以得到造型巫師帽。\n11/6「Coser 伸展台大明星」：變裝者只要當日獲得民眾給予讚賞的粉紅氣球就可以兌換小禮物。\n\
