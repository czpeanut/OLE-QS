  group_stem: "(七)近年積極推動新型馬桶技術的比爾蓋茲，在北京一場新世紀廁所博覽會，手拿一罐人類的排泄物進行演講，藉此呼籲世界重視全球開發中國家廁所不足帶來的問題。\n\
