- id: doc_112_台北_民生_自然_g7s1e1_s3_38
  section: 3
  number: 38
  type: single
  page: 4
  stem: 水通道蛋白位於細胞的哪個構造中？
  options:
  - label: A
    content: 細胞膜
  - label: B
    content: 細胞質
  - label: C
    content: 細胞核
  - label: D
    content: 以上皆非。
  group_stem: '二、依據下列文章，回答第 38~40 題：

    　　早在 19 世紀中葉，人們就知道細胞一定有一個管道讓水與礦物質流通。在 1950 年代中期，發現了一個只能讓水分子迅速進出細胞的通道存在，在這之後的三十年間，透過詳細的研究，結論是一定有某種選擇性的通道能不讓礦物質通過細胞膜，但卻能讓水分子自由通過，而且每秒鐘有可讓成千上萬的水分子通過一個單一的通道。

    　　雖然知道這些，但直到 1992 年都還無人能指出這個水分子通道的構造到底是如何。1980 年代中期，阿格雷研究紅血球細胞上的各種細胞膜蛋白質(插在細胞膜上)，他發現現在腎臟中有一個和紅血球同類型的蛋白質，在解開了這個蛋白質的序列以及相對應的
    DNA 序列之後，他體認到這一定是在他之前的眾多學者所搜尋的那個蛋白質：細胞的水通道。

    　　阿格雷利用一個簡單的實驗(圖 1)來測試他的假設，在此實驗中，他比較含有此膜蛋白與不含此膜蛋白的細胞，當這些細胞放入水中時，那些含有此膜蛋白的細胞因為滲透壓之故會吸收水分而漲大，而那些沒有此膜蛋白者則闌風不動。阿格雷又利用一種稱為
    liposome 的人造細胞來測試，他發現當此人造細胞的膜上植有此種膜蛋白時，水就可以自由進出。

    　　由於阿格雷知道汞離子會阻礙細胞吸收及釋放水，因此他也證明了這個他所發現能控制水進出細胞的蛋白質，也會因為汞離子的存在而無法讓水通過。這使得他更確定這個蛋白質就是真正的水通道，他命名這個蛋白質為
    aquaporin ，即「水洞」之意。'
