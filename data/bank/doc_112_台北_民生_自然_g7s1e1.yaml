- id: doc_112_台北_民生_自然_g7s1e1_s2_34
  section: 2
  number: 34
  type: single
  page: 3
  stem: 若以上述探討科學現象的步驟排列甲、乙、丙、丁，下列何者正確？
  options:
  - label: A
    content: 乙$\rightarrow$丁$\rightarrow$丙$\rightarrow$甲
  - label: B
    content: 乙$\rightarrow$甲$\rightarrow$丙$\rightarrow$丁
  - label: C
    content: 丁$\rightarrow$乙$\rightarrow$甲$\rightarrow$丙
  - label: D
    content: 丁$\rightarrow$甲$\rightarrow$乙$\rightarrow$丙。
  group_stem: '【題組三】

    探討生活中的科學現象時，常可依序用「觀察$\rightarrow$提出問題$\rightarrow$提出假設性的答案$\rightarrow$設計與進行實驗」的步驟來得到結論。小宇要研究想要研究水中硬幣的存在與孑孓的關係，列出了甲、乙、丙、丁四個敘述，如附表所示。

    | 編號 | 敘述 |

    | :--- | :--- |

    | 甲 | 為什麼放有硬幣的許願池中孑孓無法生存？ |

    | 乙 | 含有硬幣的水可能會促使孑孓死亡。 |

