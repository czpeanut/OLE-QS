- id: doc_112_台北_民生_自然_g7s1e1_s3_36
  section: 3
  number: 36
  type: single
  page: 4
  stem: 下列何者容易沾黏在鯊魚體表？
  options:
  - label: A
    content: 微生物
  - label: B
    content: 海藻
  - label: C
    content: 藤壺
  - label: D
    content: 以上皆非。
  group_stem: '一、依據下列文章，回答第 36~37 題：

    　　在大自然的環境中，不同於其他海洋生物，鯊魚體表很少見到微生物、海藻及藤壺的沾黏，鯊魚的體表可視為一種具有自潔、低黏附的防污表面。鯊魚體表能具備自潔及低沾黏的特性可歸納三個因素：

    一、鯊魚表皮具有特殊的菱形盾鱗結構，每個盾鱗表面具有順向的微壕溝，使得鯊魚在海中游動時，減少體表渦流的形成，並產生一層水膜，可降低鯊魚在水中的阻力、增加水流過鯊魚體表的速度，因此可以減少鯊魚體表的微生物沾黏。

    二、微米級的盾鱗結構使鯊魚體表崎嶇不平，導致微生物不易貼附。

    三、鯊魚的表皮細胞會分泌特殊的物質，例如具有抗菌功能的抗菌胜肽、溶菌酶和凝集素等，使其體表具有抗菌的功能。'
  shared_asset: g3_36_37
