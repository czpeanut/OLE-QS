  stem: 31. What did Bruce Lee like to do?
  options:
  - label: A
    content: Read books.
  - label: B
    content: Hit and kick.
  - label: C
    content: Cook food.
  - label: D
    content: Sing songs.
  group_stem: 'Bruce Lee was born in 1940 in the USA. He lived in Hong Kong. He liked
    to climb hills. He also liked to hit and kick. Then, he learned to fight. He practiced
    every day. He won street fights many times.

    His father was worried. He said, “Stop fighting. Fighting is wrong.” He asked
    Bruce to go to the USA. He wanted Bruce to be safe. In the USA, Bruce taught fighting.
    He made a new art of fighting. Its name was Jeet Kune Do. It was fast and different.
    He did not follow old rules. Many people learned from him.

    Bruce was a movie star in 1971. His movies showed small people can be strong.
    His moves were fast. His fights looked real. Bruce was also a teacher. He said,
    “Be water, my friend.” Water is strong, and it is also soft. Bruce died in 1973.
    But people still like his movies. His movies and ideas still help people. His
    life was one of a kind.

     born 出生 USA 美國 Hong Kong 香港 kick 踢 fight 打架 safe 安全 strong 強壯 die 死'
  shared_asset: g2_31_35
  tags:
    textbook: 第二冊（七下）第3次段考範圍
    labeled_by: ai
