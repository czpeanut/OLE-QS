  section: 3
  number: 32
  type: single
  page: 3
  stem: 依上文所面臨的問題，請問下列何者是較為合理的解決方式？
  options:
  - label: A
    content: 督促政府修法，作為懲處兒少犯罪行為的依據
  - label: B
    content: 規範父母對兒少保護、教養的義務並對失職者增列刑責
  - label: C
    content: 增強相關人員的專業知能，並加強執法人員的權力
  - label: D
    content: 強化兒少的法律常識，並提供相關之進修、增能學習。
  group_stem: '警政署統計，去年查獲的青少年犯罪嫌疑達四萬七四六二人次，且近五年未滿十八歲的少年犯罪人數均在一萬人上下，因少子化影響，少年犯罪人口率增加約兩成，其中詐欺自二○二○年起躍升少年犯罪型態首位，連同黨立委都批評相關機關卸責。

    司法院主導修正的相關法案「輔導先行」施行兩年，立法院司法及法制委員會昨請相關單位專案報告。警政署統計顯示，去年警察機關查獲的十二到廿三歲青少年刑案嫌疑人達四萬七四六二人次，其中十二到十七歲少年有一萬一七八五人，十八到廿三歲青年有三萬五六七七人，兩者都是五年來新高。其中，少年犯罪集中在詐欺，約七成五是擔任車手及車手頭。

    立委指出，「四萬七千人」數字驚人。司法院副秘書長王梅英說，去年各地方法院受理少年調查事件約二萬八千餘件，其中詐欺案新收八二九二件，占整體新收百分之卅五點七四。

    立委質疑，各單位報告根本是各自築起「防火牆」，走出學校與教育部無關，發生事情與衛福部無關，出了矯正機關就與矯正署無關，街上「浪流連（台語）」到底是誰管理？立委提醒，今年青少年犯罪人數將更高，少子化後青少年人口往下掉，數字令人怵目驚心，不能裝作沒看見，究竟是政策有問題，還是執行力有問題？

    立委質疑，少輔會開案數倍增，人力配置不增反減，基層拚命反映缺人缺資源，主管機關卻沒感覺；警政署書面報告說現有人力「充足」，究竟有無充分掌握資訊？請警政署檢討各地少輔會人力運用與執行，請衛福部邀集各部會共同研商，建立「一主責多協力」分工機制，完善個案管理、轉介流程。

    警政署統計，二○二○年至二○二四年少年犯罪主要案類，以詐欺、竊盜、一般傷害、性交猥褻、妨害秩序和毒品六類為主，約占整體少年犯罪件數三分之二，其中詐欺去年所占比率為百分之廿七點七。

    少年容易遭吸收從事犯罪為詐欺、妨害秩序兩類，警政署認為可歸因於「成少共犯」案件持續上升。從去年數據來看，少年涉詐七成五是擔任最底層「車手」角色，主要是「犯罪技術、成本及門檻低」。

    王梅英說，司法院正推動少年保護管束風險管理試辦計畫，對參加詐團擔任車手少年，安排職能訓練、就業媒合，密切追蹤輔導。


    ~摘改自聯合報《青少年犯案去年查獲4.7 萬人次創新高 集中在詐欺》'
