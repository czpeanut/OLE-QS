  type: single
  page: 1
  stem: 《菸害防制法》明定任何人不得販售菸品予未成年人，但歷年來成效不彰，為遏阻業者賣菸給未成年人，有立委提案應對營業人祭出停止營業的處罰。上述文中對賣菸給未成年人的業者之處罰方式，也可適用於下列何者？
  options:
