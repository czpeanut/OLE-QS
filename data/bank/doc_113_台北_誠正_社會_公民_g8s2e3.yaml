  section: 1
  number: 6
  type: single
  page: 1
  stem: 根據我國相關兒少法律規定，家長不得讓未滿6 歲的兒童單獨在家，違者將遭到主管機關的開罰。上述規定具有下列何種意涵？
  options:
  - label: A
    content: 對兒童的保護應受到法律的保障
  - label: B
    content: 父母對子女行使親權可不受干涉
  - label: C
    content: 家庭暴力問題政府須積極處理
  - label: D
    content: 儘量減輕政府對未成年人照顧的義務。
