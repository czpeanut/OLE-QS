  section: 1
  number: 9
  type: single
  page: 1
  stem: 可欣開車在等紅綠燈時因禮讓救護車而將車開超過停止線，沒想到此善行卻遭他人拍照檢舉而遭開立罰單，可欣氣憤地嚷嚷說要報警。請問，下列哪一位朋友的建議較為適切？
  options:
  - label: A
    content: 芩貝：報警是維護權利的管道，可立即提出
  - label: B
    content: 芷晴：提起行政訴訟前，要先進行訴願程序
  - label: C
    content: 家馨：此類救濟的流程應該事先請願再訴願
