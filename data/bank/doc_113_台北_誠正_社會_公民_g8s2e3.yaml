  section: 1
  number: 17
  type: single
  page: 2
  stem: 為了促進兒少身心健全發展，保障兒少的權益與福利，政府制定《兒童及少年福利與權益保障法》。下列何者屬於上述法律明定的兒少「福利措施」？
