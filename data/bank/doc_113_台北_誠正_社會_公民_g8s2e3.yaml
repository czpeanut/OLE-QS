  section: 1
  number: 2
  type: single
  page: 1
  stem: 婦女救援基金會副執行長在演講時提到，據統計推估，全臺有約3 萬2 千名未成年人曾遭私密影像外流，其中四成六外流的影像，是由兒少自身拍攝所產生，近七成的兒少是在被誘騙、要脅的狀況下，自拍後傳給加害人。根據上述，婦女救援基金會副執行長在接下來的演講內容可能不會提到下列何者？
  options:
  - label: A
    content: 依《兒童及少年福利與權益保障法》論處
  - label: B
    content: 引誘兒少自拍私密照將處以有期徒刑
  - label: C
    content: 持有或散布兒少私密照都是犯罪行為
  - label: D
    content: 兒少要具備法治觀念，懂得保護自己。
