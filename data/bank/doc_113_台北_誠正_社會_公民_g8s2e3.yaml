- id: doc_113_台北_誠正_社會_公民_g8s2e3_s3_33
  section: 3
  number: 33
  type: single
  page: 4
  stem: 依文中提及的法律規定，可以達到下列哪一項目？
  options:
  - label: A
    content: 國家透過必要性的處罰，達成嚇阻犯罪的效果
  - label: B
    content: 公權力介入解決私人糾紛，更能保障當事人權益
  - label: C
    content: 行政機關做出干預人民權利的規定，以維護公共利益
  - label: D
    content: 政府透過提供人民各項服務，來建立社會福利制度。
  group_stem: '日前有位女網友在社群平台上po 出自己因亂丟菸蒂而被罰款6,000 元的罰單，表示自己被好好上了一課，也提醒大家不要犯一樣的錯，不過貼文底下卻引來一片罵聲，貼文也已經在稍早刪除。

    網友在社群平台上分享自己因亂丟菸蒂而被開罰的罰單，罰單上應繳金額為6,000 元，她也在文中抒發心情:「6,000 元是不是太貴了？」、「有這麼嚴重嗎？」不過留言區的網友們多不認同，有批「怎麼會覺得亂丟菸蒂不嚴重呢?」、「就是要貴,重罰才有用」、「可能是累犯吧，不要亂丟很難嗎？」…。面對批評，女網友也補充「我只是想警惕大家，也知道這樣做不對，不需要再留言罵我喔！」，不過現在原貼文也已經被刪除。

    也有人提問:「亂丟菸蒂不是罰1200 元? 怎麼會罰6 千元?」。董氏基金會菸害防制中心主任林清麗指出，依「廢棄物清理法」第27 條規定，在指定清除地區內嚴禁有隨地吐痰、檳榔汁、渣、拋棄紙屑、菸蒂、口香糖、瓜果或其皮、核、汁、渣或其他一般廢棄物。違法者可處新臺幣1,200
    元至6,000 元，而台北市、新北市與基隆市都將亂丟菸蒂提高為新台幣3,600 元至18,000 元，所以女網友的罰單6 千元「很正常」。

    菸蒂的原料有什麼?並不像大家想像中的只有紙和菸草，用來製造濾嘴的原料是「醋酸纖維(cellulose acetate)」，菸蒂就是一種最難分解的塑膠垃圾，一根菸蒂至少要15
    年以上才能分解，對於環境生態傷害非常大。菸蒂常被丟到排水溝、河川及花圃土地，殘留的菸草中含有各種化學物質，如排入環境，菸蒂內的有毒物質溶出，影響環境及海洋生態，最終循環至食物鏈，對於環境及人體健康都會造成危害。

    吸菸不僅有一、二、三手菸的危害，根據消防署資料，112 年全台就有1994 件因菸蒂成的火災，換言之,，平均每天都有5-6 件因吸菸導致的火災。董氏基金會也補充提醒吸菸者，無論在哪裡吸菸，都必須確實先將菸蒂熄滅，再丟進垃圾桶，把菸蒂引發的環保或危害問題降到最低。

    ~摘改自公民新聞《亂丟一根菸蒂被罰6 千 女網友痛喊:被狠上一課》'
