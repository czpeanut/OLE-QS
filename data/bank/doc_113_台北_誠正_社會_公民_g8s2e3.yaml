  section: 1
  number: 12
  type: single
  page: 1
  stem: 城武與同學正在討論一則新聞：男子甲不滿鄰居乙總是在住家附近亂丟垃圾，經勸阻後依舊故我，甲遂持球棒攻擊乙，造成其受傷送醫。事後甲遭警方移送法辦，而乙亂丟垃圾是否也應負起法律責任？
  options:
  - label: A
    content: 柔涵：乙應負刑事責任，可能被處以罰金
  - label: B
    content: 詩芸：乙應負行政責任，因造成衛生髒亂
  - label: C
    content: 函柔：乙以受甲制裁，所以不須負擔法律責任
  - label: D
    content: 易君：乙因受傷，所以減輕法律責任。
