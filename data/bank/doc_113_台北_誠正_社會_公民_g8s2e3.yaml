  stem: 據報導，約有10％的15 歲少年進入工地工作，此比例甚至高於16～18 歲的年齡層，代表著此年齡的少年因經濟需求而去找工作，但求職管道與技能不足等原因，容易落入高風險職場。關於未成年勞動問題的敘述，下列何者正確？
  options:
  - label: A
    content: 上文提及的少年，皆受童工的法規的保障
  - label: B
    content: 雇主聘童工應遵守《兒童及少年福利與權益保障法》
  - label: C
    content: 雇主將若讓少年從事危險性工作會受罰
  - label: D
    content: 少年的同事會被視為是性剝削行為的加害人。
