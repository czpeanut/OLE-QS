  type: single
  page: 1
  stem: 國一13 歲的辰宇與致宇在走廊上發生擦撞，心懷不滿的辰宇為了報復，趁致宇手機放在桌上的時候，利用他的手機在臉書上到處留言辱罵他人並且捏造謊言。事後，致宇對辰宇的行為感到憤怒，因此想要追究其責任。根據上述的內容下列何者正確?
  options:
  - label: A
    content: 辰宇的行為屬於曝險少年，因此適用少年保護事件
  - label: B
