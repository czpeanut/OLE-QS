  section: 1
  number: 11
  type: single
  page: 1
  stem: 臺北市勞動局表示，依現行「法律」規定，雇主不得使未滿15 歲的未成年人提供勞務，並須依相關之規定，事前向勞政主管機關申請工作許可，經審查許可後才能工作，若未經主管機關許可即上工，已涉及刑事責任，可處6
    個月以下有期徒刑、拘役或科或併科新臺幣30 萬元以下罰金。請問上述所述的內容最有可能是哪部法律?
