- id: doc_113_台北_誠正_社會_公民_g8s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 暑假將至，警察局每年都會於暑假期間執行「青春專案」，每週至少一次到轄內各網咖稽查，只要發現有少年深夜仍逗留在網咖，就會對業者開罰，並將少年帶回警局，通知家長領回。下列相關敘述何者正確？
  options:
  - label: A
    content: 此為法律對兒少的保護措施
  - label: B
    content: 家長需繳罰金才能將小孩領回
  - label: C
    content: 少年的行為符合少事法曝險少年的定義
  - label: D
    content: 業者因違反勞動基準法規定遭處行政罰。
