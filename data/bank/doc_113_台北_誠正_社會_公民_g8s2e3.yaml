- id: doc_113_台北_誠正_社會_公民_g8s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 諾貝爾和平獎的最年輕得主─馬拉拉呼籲:「一個孩子，一個老師，一本書，一支筆可以改變世界。」她挺身而出爭取自身與其他兒少權益，希望讓更多人關注此議題。下列敘述何者可以呼應她的訴求？
  options:
  - label: A
    content: 我國制定《兒童權利公約》保障兒少權益
  - label: B
    content: 青年學子可以發起募捐行動幫助受難兒童
  - label: C
    content: 政府將兒童及少年福利交給民間團體推動
  - label: D
    content: 政府實施長照政策、喘息政策照顧青少年。
