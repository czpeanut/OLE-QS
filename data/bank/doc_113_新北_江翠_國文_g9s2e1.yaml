  stem: 「人不可以無癖」，句中運用「不可」、「無」兩個否定詞來表示肯定，這種句式稱為「雙重否定句」。下列「 」中的詞語，何者也是以雙重否定來表達肯定的意思？
  options:
  - label: A
    content: 同學「不慌不忙」地打包整個置物櫃，為環境整頓出力
  - label: B
    content: 「沒完沒了」喋喋不休的叮嚀，早成耳際溜過的一陣涼風
  - label: C
    content: 航空飛行器從雷達「無緣無故」憑空消失了
