  section: 1
  number: 36
  type: single
  page: 5
  stem: 下列關於石滬的社會文化意涵，何者正確？
  options:
  - label: A
    content: 石滬僅為漁業用途，未曾涉及婚姻、財產等社會關係
  - label: B
    content: 石滬建設成本高，漁民視其為珍貴的不動產，甚至可作為嫁妝或交易標的
  - label: C
    content: 石滬的數量在清朝時期大幅減少，導致澎湖漁業衰退
  - label: D
    content: 石滬因天然因素無法長期保存，因此並未成為家族財產的一部分
  group_stem: "石滬是一種捕魚的陷阱，利用海水的漲退潮差使魚群陷於石滬之中。其原理是在潮間帶以石塊堆成圓弧狀的石堤，隨著漲潮而來的魚群在退潮之際陷入石滬中，漁民再以網具捕捉。唐代已記錄以「滬」法捕魚的技術。唐\
    \ 陸龜蒙魚具詩序有云：「列竹於海澨曰滬」，竹桿插在海潮間帶上，圍成方形，此稱為滬。滬內逆流設一水門，順著潮水的漲退而自行起閉，潮水退後便可入滬捕魚。」1736\
    \ 年（乾隆元年） 臺海使槎錄於澎湖石滬型態的記載十分詳細，並指出「寬者為大滬，狹者為小滬」。高拱乾所著之臺灣府志則指出「澎湖大網、泊、滬四十張口，共徵銀六十八兩六錢」，較1685\
    \ 年的「三十八張口」增加兩口。其中「大滬二口、小滬二十口」沿襲至1720 年（康熙59 年）臺灣縣志的記載數額並無增減，這22 口大石滬應為明 鄭時期徵收滬稅的基礎。\n\
    澎湖土地貧瘠，東北風強烈，農業活動受到極大的限制，然而在依靠風帆的時代裡，從事漁業活動依舊受到氣候上極大的限制。因此曾有一說澎湖是「宇內瘠苦」之最。石滬漁業適得其反。風浪越大的天候，\
    \ 石滬提供魚類棲息躲避的最佳場所，漁獲量相對提高。但是，石滬的興建必須投入大量的資金、人力與時間。填造石滬受制於潮汐、天候，並非天天都可進行。\n吉貝流傳因石滬漁獲一夜致富的例子：「1945\
    \ 年美軍空襲吉貝，楊順虎的家全毀。隔年楊順虎去巡「船仔船」滬，共捕獲九千多尾的鮸魚，約一萬台斤。楊請了十幾個人幫忙，用舢舨載了好幾趟才載完。當晚，又捕獲六千多台斤的丁香魚，晒乾運到台南販賣，一部分錢買米運回吉貝，所有的人都分到一包米。\
    \ 楊家經濟情況獲得改善，蓋了新房子」。吉貝漁民藉由石滬漁業所賺取的資金再購買機動漁船從事漁業活動，進而改善村莊的經濟，1960 年代吉貝因而擁有「小上海」之名，繁榮一時。\n\
    石滬被漁民視為珍貴的不動產，石滬股權也成為買賣的標的與建立婚姻關係的憑據。相傳西嶼「內滬」因薛家女兒嫁到赤馬村的楊家，而把「內滬」作為嫁妝送給楊家；外垵村盧姓嫁女兒到陳家，把「港仔滬」一半的股權贈與男方。南寮村有一口石滬名為「親家滬」，從其名稱可以推敲親家滬與婚姻嫁娶有密切的關係。\n\
    \                                                              改寫自網路文章"
