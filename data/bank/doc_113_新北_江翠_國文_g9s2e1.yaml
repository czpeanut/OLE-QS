  group_stem: '（劊子云：）你還有甚的說話，此時不對監斬大人說，幾時說那？

    （正旦再跪科，云：）大人，如今是三伏天道，若竇娥委實冤枉，身死之後，天降三尺瑞雪，遮掩了竇娥屍首。

    （監斬官云：）這等三伏天道，你便有沖天的怨氣，也召不得一片雪來，可不胡說！

    （正旦唱：）【二煞】你道是暑氣暄，不是那下雪天，豈不聞飛霜六月因鄒衍。若果有一腔怨氣噴如火，定要感的六出冰花滾似錦，免着我屍骸現﹔要甚麼素車白馬，斷送出古陌荒阡？

    （正旦再跪科，云︰）大人，我竇娥死的委實冤枉，從今以後，着這楚州亢旱三年。

    （監斬官云：）打嘴！哪有這等說話！

    （正旦唱：）【一煞】你道是天公不可期，人心不可憐。不知皇天也肯從人願。做甚麼三年不見甘霖降，也只為東海曾經孝婦冤。如今輪到你山陽縣，這都是官吏每無心正法，使百姓有口難言。

    選自關漢卿竇娥冤'
