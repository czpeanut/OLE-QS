- id: doc_113_新北_江翠_國文_g9s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 白樸 沉醉東風 漁父詞：「黃蘆岸白蘋渡口，綠楊堤紅蓼灘頭。雖無刎頸交，卻有忘機友，點秋江白鷺沙鷗。傲殺人間萬戶侯，不識字煙波釣叟。」關於此曲的剖析，下列敘述何者最恰當？
  options:
  - label: A
    content: 「黃蘆岸白蘋渡口，綠楊堤紅蓼灘頭」以黃、白、綠、紅等字，點染秋天的豐美絢麗，流露出盎然的生機，也烘托垂釣者恬靜愉悅的情懷
  - label: B
    content: 「雖無刎頸交，卻有忘機友」以「雖無」和「卻有」對比，強調「刎頸交」的重要，藉機表達遺憾
  - label: C
    content: 「傲殺人間萬戶侯，不識字煙波釣叟」內容反映作者妄自菲薄，無意爭奪功名富貴
  - label: D
    content: 「忘機友」指的是鄉野老農鄰居，「點」秋江營造出靈動自然的畫面。
  lesson_raw:
    number: 第一課
    title: 沉醉東風漁父詞
    basis: 引用元曲〈沉醉東風‧漁父詞〉
