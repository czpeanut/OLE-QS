  stem: 花媽參加里長選舉，共5位候選人，應選出1人。已知該選區可投票人數為1800人，若以投票率70%，有效票比率90%計算，則花媽至少要獲得多少票才能篤定當選？
  options:
  - label: A
    content: 567票
  - label: B
    content: 568票
  - label: C
    content: 1134票
  - label: D
    content: 1135票
  group_stem: '【生活素養題】

    選舉是公民基於自由意願投票，依法選出行政首長或民意代表。例如我國總統由人民直接選舉產生，每人只能一票，立法委員採「單一選區制」，即每一選區只選出一位區域立委；市議員採「複數選區制」，即每一選區中會選出多位議員。

    假設某次立法委員選舉，共有3位候選人，採單一選區制，每一個區僅選出1人。已知該選區可投票人數為40萬人，若以投票率 70%，有效票比率 96% 計算，則至少要獲得多少票才能篤定當選？

    由上可得：投票數= $400000 \times 70\% = 280000$；有效票= $280000 \times 96\% = 268800$。

    如果將有效票268800除以3，則每人得票數為89600票，事實上當候選人票數都非常少時，就算89601票也無法當選。

    假設甲參選人得票為 $x$ 票，則其他候選人的總得票數為$(268800 - x)$票。若要保證一定當選，則其得票數要大於所有落選人的總票數，因此可以列出不等式：$x
    > 268800 - x$，得 $x > 134400$。

    所以至少要得到 $134400 + 1 = 134401$（票）才能確定篤定當選。'
