- id: doc_113_台中_大業_國文_g8s1e1_s3_7
  section: 3
  number: 7
  type: single
  page: 1
  stem: 下列為陳冠學<田園之秋選>中文句的敘述，何者錯誤？
  options:
  - label: A
    content: 只覺滿天無數黑怪，張牙舞爪，盡向地面攫來：描寫烏雲密佈
  - label: B
    content: 在天地之間除了它是英雄之外，不准有第二個人是英雄：在西北雨的威力下，無物能與它相抗衡
  - label: C
