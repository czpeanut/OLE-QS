- id: doc_113_台中_大業_國文_g8s1e1_s3_6
  section: 3
  number: 6
  type: single
  page: 1
  stem: '使用生動的語言，將某種感官的感覺移轉到另一種感官，也就是改變角度來描述事物的手法，稱為「移覺」。例如:

    <田園之秋選>一文中「太陽又出來了，一片清新的空氣，鮮潔的色彩，彷彿聽見了貝多芬《田園交響曲》〈第四樂章牧羊人之歌〉。」用聽覺印象表達視覺印象。下列何者的感覺轉移用法，與此相同？'
  options:
  - label: A
    content: 南風徐徐，送來縷縷清香，彷彿遠處高樓上渺茫的歌聲似的
  - label: B
    content: 陽光好亮，透過葉隙叮叮噹噹擲下一大把金幣
  - label: C
    content: 柚樹的葉影在緩緩地移動，移上我的臉頰的是幾朵擠碎的陽光，到這裡，它成了一種柔軟的撫摸
  - label: D
    content: 山裡的霧像初泡的烏龍，帶著一絲甘醇，無聲無息滲入每吋肌膚。
  lesson_raw:
