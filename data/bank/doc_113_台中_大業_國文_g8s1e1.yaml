    2. 非乘車當日訂票：乘車前四週（二十八天）開始預訂，即週一可預訂至四週之後的週一期間內之乘車票，但每逢週五可多預訂二天至四週後之週日乘車票（即逢週五可預訂至四週後之週五、六、日之乘車票）。如因不可抗力、國定假日或特殊情事需調整開放時間，本局將另行公告。

    三、訂位付款方式

    1. 付款方式：訂票後（產生訂票代碼）請於付款期限內，透過本系統或網路線上完成付款，亦可至本局合作之代售業者(郵局及便利商店)或本局電腦售票車站窗口或對號列車自動售票機付款/取票。未於期限內完成付款者，自110
    年7 月1 日起，1 個月內有3 次訂票未取紀錄，施予停權1 個月之措施。

    2. 台鐵e 訂通可受理 VISA、MasterCard 及 JCB 等信用卡及Apple Pay 行動支付線上付款。

    四、付款期限

    1. 預訂之行程自訂位成功日起（含）2 日內完成付款。

