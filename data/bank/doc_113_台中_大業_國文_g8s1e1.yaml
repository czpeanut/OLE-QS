    一、系統服務時間

    服務時間為24 小時，系統如有維護時，請注意本局公告或推播訊息。

    二、訂位受理時間

    1. 乘車當日訂票：乘車當日可預訂開車前30 分鐘以上之車票，並於開車前20 分鐘完成付款取票。行動載具執行本機取票或多人分票，至遲應於票面車次開行前時間
