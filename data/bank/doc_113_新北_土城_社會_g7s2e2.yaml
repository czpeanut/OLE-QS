    歲、身高要達到五尺(約166cm)，女子中等學校或高等小學校畢業，受訓兩個月才能正式上線，在當時是臺北市少女夢想中最時髦的工作。未來菊元百貨若有機會重新核定變成古蹟，不論外觀或內部都能透過修復及再利用計畫，像臺南市定古蹟林百貨那樣成為文化景點。
