  section: 1
  number: 61
  type: single
  page: 6
  stem: '文中臺灣清代為一般民眾提供日常生活所需的衣服、雜貨…等用品的商店，是被稱為「!仔店」，請問「民眾日常活所需的衣服、雜貨……等用品」是屬於何種工業型態？

    (甲)輕工業 (乙)重工業 (丙)高科技工業(丁)勞力密集工業 (戊)技術密集工業(己)資金密集工業'
  options:
  - label: A
    content: 甲丁
  - label: B
    content: 甲戊
  - label: C
    content: 丙丁
  - label: D
    content: 丙己。
  group_stem: 清代臺灣為一般民眾提供日常生活所需衣物、雜貨用品的商店，是被稱為「!仔店」（kám-á-tiàm）的小型零售店面。日治時期臺北、臺南、高雄的都市區，一種全新的消費空間型態「百貨店」出現，為庶民帶來不同的空間新體驗與漢、和、洋並存的新風貌。臺北市衡陽路的國泰金融大樓，前身就是臺灣第一家百貨公司「菊元百貨」。由日本人重田榮治創立，於1932
    年12 月3 日開幕，是全臺首座現代化的百貨公司，也是日本時代臺灣最高的民間建築物，配有臺灣首座供民眾使用的公共電梯（流籠），轟動一時，造成大家排隊爭搭流籠的盛況。菊元百貨也是當時全臺最時髦、最著名的購物中心，一樓主要是化妝品、奢侈的甜點，二樓以各式精緻的洋服為主，三樓則是經典的吳服（日式和服），四樓則是販售了布料供客人可以訂製，五樓是著名的菊元食堂，為當時極少見的西餐廳，食堂提供咖啡、咖哩、蛋包飯等西洋輕食，六樓這一層是唱片部和展場、演講場等，第七層在一九三五年增建，設有庭園可供瞭望。當時菊元百貨的女性服務人員，人稱「菊元小姐」；前菊元百貨店員陳玉招接受採訪時回憶：「女性店員需經過口試，年齡約為18～25
    歲、身高要達到五尺(約166cm)，女子中等學校或高等小學校畢業，受訓兩個月才能正式上線，在當時是臺北市少女夢想中最時髦的工作。未來菊元百貨若有機會重新核定變成古蹟，不論外觀或內部都能透過修復及再利用計畫，像臺南市定古蹟林百貨那樣成為文化景點。
