  group_stem: "(甲)\n    然而，每回從陸地起飛，或者尋找食物時，信天翁則泰半選擇在一個區域滯留飛行，因而採取了繞圈圈的螺旋形飄舉。這是信天翁擅長的另一種變動翱翔。\n\
    \    多數幼鳥在初次飛行落海後，彷彿現代學子的第一次基測考試。在這次考試裡縱使不及格，相信都會更清楚而深刻地體會，海風是如此具體，又掌握不住的東西。\n\
    \    海風距離海面不同的高度，有明顯的落差，浪頭和浪腳也截然不同。牠必須學習，如何用羽翼去適應，摸熟海風的脾氣。好像把一種看似抽象的東西，弄清楚了真正的形影。等下次再大考時，便懂得如何掌握了。\n\
    \    總之，風是具體，看得見的。信天翁的飛行課程裡，如何看見風，則是必修的學分。\n--節錄自劉克襄《永遠的信天翁》"
