- id: doc_113_台中_大業_國文_g8s1e2_s4_3
  section: 4
  number: 3
  type: single
  page: 3
  stem: 根據上文，下列敘述何者正確？
  options:
  - label: A
    content: 根據《說文》和《爾雅》兩本典籍，「蓮」字和「荷」字從古至今皆為同樣涵義。
  - label: B
    content: 吳昌碩以篆隸運筆入畫，因此我們在其畫荷作品內可看到如同刀刻的瘦勁線條。
  - label: C
    content: 《嶺南雜記》稱睡蓮爲「瑞蓮花」，也有人稱「午時蓮」，是因為其在晌午時分開花。
  - label: D
    content: 蓮子、蓮藕、荷葉都能夠作為食材，其中蓮藕可以製作成藕粉，生吃煮食兩相宜。
  group_stem: "(乙)\n    蓮諧音「憐」字，古樂府中的描寫時有寓意雙關，多繫兒女情長，而最是流傳千古的，當數金聖歎行刑前的「蓮子心中苦，梨兒腹內酸」了。\n\
    \    蓮是一個形聲字。根據《說文》和《爾雅》的解釋，本來是和「荷」字有別的，(蓮是芙蕖實，荷是葉、藕是根)，但今日已彼此相混了。歷史上，明代的徐渭是畫荷能手，傳世之作《雜花圖卷》中的蓮，揮毫表現，墨趣淋漓；八大、石濤、齊白石、吳昌碩也有作品流傳。如齊老的《荷花影圖》、《荷花蜻蜓圖》，吳昌碩以篆隸運筆入畫，皆獨出心裁，別具丰致。\n\
    \    蓮的品種有建蓮、石蓮、大風蓮等，中興新村入口公路旁、臺北市植物園、臺南白河鎮的蓮潭里是幾個較著名的種植處所。此外還有一種「睡蓮」，葉緣呈鋸齒狀，浮於水面，不長蓮子蓮藕，純為觀賞，花瓣白天放，晚上合，也有晚上才開放的，《嶺南雜記》稱之爲瑞蓮花，也有人稱午時蓮，以前國內引進了不少，如非洲睡蓮、香睡蓮、黃花睡蓮均是。\n\
    \    最後，要談到蓮的食用價值。蓮藕滋肺潤喉，甜中帶脆，可製成藕粉，能生吃也能煮食；荷葉包飯、排骨，是有名的佳餚；而蓮子銀耳更能清涼消火。過去，南京玄武湖畔一到了下午三、四點鐘，挑擔子賣「煮藕」的小販沿岸叫賣，鍋子裡燉著玄武湖出的嫩藕蓮子，用糯米、冰糖調製，既香又綿密，令人難忘！\n\
    --改寫自楊振良《詩情畫意說漢字》"
