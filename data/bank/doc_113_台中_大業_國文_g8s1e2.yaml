  - label: B
    content: 莉靜：「他予(ㄩˊ)取予求，吃定對方的態度，令人感到不屑(ㄒㄧㄝˋ)。」
  - label: C
    content: 敬庭：「武夷山的摩崖(ㄞˊ)石刻(ㄎㄜˋ)是此山世界遺產重要組成部分。」
