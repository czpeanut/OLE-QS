  stem: 根據上文，下列敘述何者正確？
  options:
  - label: A
    content: 作者父親每天從中午賣臭豆腐直到旭日東昇。
  - label: B
    content: 作者父親用雨衣遮住臭豆腐是為了給兒子吃。
  - label: C
    content: 作者父親的一番話盡顯他對孩子的孺慕之情。
  - label: D
    content: 作者父親在作者取得正式律師證後因病離世。
  group_stem: "(丙)\n    阿爸踩著三輪車沿街叫賣臭豆腐，大家都叫他「牛車許」。每天從下午三點左右一直賣到晚上，但為了多賺些錢，他會利用半夜到三重天台外繼續賣，通常回到家已經凌晨兩點多了。\n\
    \    有一次颱風天的夜晚，阿母在家裡做好泡菜，要我送去給阿爸，當我將泡菜送到天台時，只見他穿著黑色雨衣，戴著斗笠，雙手捧著至少三碗臭豆腐，在大雨中來回穿梭於附近的電動玩具店、酒店間。阿爸的臉上滿是雨水，為了不讓雨水淋到臭豆腐上，他用雨衣遮住臭豆腐，反而不在意自己幾乎全身濕透，雨水從他的衣角不斷滴下來。當阿爸見到我時，劈頭就說：「你怎麼會送來？我等一下再踩著三輪車回家載就好，你吃飽沒？功課寫了嗎？趕快放著，快回家去念書。」\n\
    \    聽到阿爸這些話，我的淚水流了下來，心中充滿不捨，那一夜的場景，我到現在仍然記憶猶新……\n    在我記憶裡，阿爸和阿母是萬能的，所以小時候我總是認爲，阿爸和阿母會永遠陪著我們。殘酷的命運捉弄，阿爸在我大三那年罹患口腔癌，後來在我拿到正式律師證的那天晚上離開了人世，一切太突然，快到我沒有心理準備。\n\
    \    阿爸往生後一個月，阿母被診斷出得了肺癌，隨著病情不斷惡化，阿母越來越痛苦，最後我和姊姊們決定讓她接受緩和醫療，不再自私地將阿母留在身邊，不再讓她承受病魔的折磨。\n\
    \    直到現在，我心裡始終留有遺憾，因為我直到雙親都離世後才真正明白，父母需要的不是家財萬貫、錦衣玉食，他們要的只是我們可以放慢腳步，陪他們一起慢慢走。\n\
    --改寫自許峰源《年輕，不打安全牌》"
