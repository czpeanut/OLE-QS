- id: doc_113_台中_沙鹿_英語_g9s2e1_s2_26
  section: 2
  number: 26
  type: single
  page: 2
  stem: How did Mr. Lee act at the market?
  options:
  - label: A
    content: He helped others kindly.
  - label: B
    content: He talked in a polite way.
  - label: C
    content: He shouted at young people.
  - label: D
    content: He didn't care about others.
  group_stem: 'In a small town, there was an old man named Mr. Lee. He always thought
    that because he was old, he could act without caring about morals or kindness.
    He often took other people''s place at the market and shouted at young people
    to make way for him. One day, he even took vegetables from a young girl''s stand
    without paying.

    Mr. Lee''s behavior made the townspeople very unhappy, but they were afraid to
    say anything. They believed that being old should not be an excuse for breaking
    moral rules. Instead, older people should set a good example for the younger generation.

    Finally, one day, a group of young people decided to go together to talk to the
    town leader about the situation. The town leader agreed that Mr. Lee''s behavior
    was unacceptable and spoke to him. After that talk, Mr. Lee started to change
    his behavior and became kinder.

     moral 道德；unacceptable 無法接受的；behavior 行為'
