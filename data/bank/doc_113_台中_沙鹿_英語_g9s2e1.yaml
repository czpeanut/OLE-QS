- id: doc_113_台中_沙鹿_英語_g9s2e1_s2_21
  section: 2
  number: 21
  type: single
  page: 2
  stem: What is <u>social media addiction</u>?
  options:
  - label: A
    content: Enjoying social media much and making big money through social media.
  - label: B
    content: Spending too much time on social media and not being able to stop.
  - label: C
    content: Sharing photos with friends on social media and getting many likes.
  - label: D
    content: Watching videos online on social media and sleeping a lot after that.
  group_stem: 'Many teenagers today spend a lot of time on social media apps like
    Instagram, TikTok, and Facebook. These apps are fun and allow us to reach friends,
    share photos, and watch videos. However, spending too much time on social media
    can become a problem. This problem is called social media addiction.

    Social media addiction happens when people cannot stop using these apps, even
    when they need to do other important things like homework, eating, or sleeping.
    People who are addicted to social media may feel nervous or sad when they are
    not using their phones. They might check their phones many times a day, even when
    they are with friends or family.

    Social media apps are made to get their users addicted. They use notifications,
    likes, and comments to keep us coming back for more. It is important to use these
    apps in a healthy way. We should make our screen time limited and make sure we
    have time for other activities, like studying, playing sports, and spending time
    with family and friends.

    By using social media responsibly, we can enjoy the benefits without becoming
    addicted. Remember, it is okay to take a break from your phone and enjoy the world
    around you.

     addicted 成癮的；notification 通知；comment 評論；responsibly 負責任地；benefit 益處'
