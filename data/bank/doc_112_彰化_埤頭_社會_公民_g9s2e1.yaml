  - label: A
    content: 貧窮國家與先進國家勞工競爭就業的機會
  - label: B
    content: 全球化使得各國彼此的文化發展呈現極大的差異
  - label: C
    content: 跨國企業的發展，造成貧窮國家環境遭受破壞
  - label: D
    content: 經貿全球化的同時，也擴大國際間的貧富差距。
