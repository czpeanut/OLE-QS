  section: 2
  number: 19
  type: single
  page: 1
  stem: 新聞報導：「近日多名信用卡持有人發現個資被竄改、信用卡遭盜刷，檢警查出，三位嫌犯冒用信用卡持卡人個資，向銀行人員聲稱修改申請信用卡時留存的手機號碼與電子信箱，再以電子支付綁定遭冒用的信用卡，隨後大肆盜刷。」下列敘述何者正確？
  options:
  - label: A
    content: 手機號碼不屬於個人資訊保護範圍
  - label: B
    content: 電子支付幫助資訊快速傳遞累積
  - label: C
    content: 文中嫌犯行為違反《著作權法》的規定
  - label: D
    content: 蒐集、處理、利用他人個資須經當事人同意。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_112_彰化_埤頭_社會_公民_g9s2e1_s2_20
  section: 2
  number: 20
  type: single
  page: 1
  stem: 郝忙某次幫大母娘修手機時，發現裡面存了很多平安圖片，還有不少(甲)以是而非的消息，譬如說吃某些食物會致癌，但另一篇又說吃同樣的東西會抗癌。他深怕大母娘被騙，便做了一個「大母娘筆記」，後來想想可能也有很多長輩遇到同樣的狀況，便成立了「MyGoPen」網站。該網站由(乙)查證所有訊息，像是找專業、學者、政府單位協助幫忙闢謠，並(丙)採1對1真人回覆，不用聊天機器人，雖然不夠即時，但他們(丁)直接協助長輩解決問題，也讓長輩把他們當成朋友，每個月網站流量突破200萬次以上。根據上述畫線部分，下列敘述何者較適切？
  options:
  - label: A
    content: 甲呈現交易層面的風險
  - label: B
    content: 乙方式可避免錯誤訊息以訛傳訛
  - label: C
    content: 丙方式提高生產效率與競爭
  - label: D
    content: 丁做法可能會導致許多職業被取代。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
