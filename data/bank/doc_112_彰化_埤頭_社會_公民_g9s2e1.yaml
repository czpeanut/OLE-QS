  type: single
  page: 1
  stem: 在世界許多角落，有身在戰區的人面臨生命危險、有人受天災威脅、有人被迫流離失所、有孩童感染本可預防的疾病等。「無國界醫生」在有緊急需求的地方，為傷者進行手術、注射疫苗預防疾病傳播，協助接生並治療營養不良的病童。關於上文組織與行動的敘述何者正確？
