  source_ocr: true
- id: doc_112_彰化_埤頭_社會_公民_g9s2e1_s2_18
  section: 2
  number: 18
  type: single
  page: 1
  stem: 「山寨」一詞最先在電腦資訊產業，最初意指有模仿或抄襲嫌疑的手機生產廠商，如「山寨手機」，就是指大陸仿造的外國高級手機多用來形容盜版、仿冒或複製的產品。請問：有關盜版、仿冒產品的敘述，下列何者錯誤？
  options:
  - label: A
    content: 經構思、創作、發明而產生價值的產物，國家應立法保障其權利
  - label: B
    content: 盜版商品是一種侵犯廠商智慧財產權的行為
  - label: C
    content: 仿冒行為會阻礙新產品、新技術的創作與發明
  - label: D
    content: 盜版產品價格低廉，是消費者最經濟實惠的選擇。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
