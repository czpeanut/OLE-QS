  group_stem: ◎「世界衛生大會」是世界衛生組織的最高權力機構。每年5月在瑞士日內瓦召開，所有的會員國，以及其附屬的副會員均可出席世界衛生大會。此外，世衛組織視需要邀請非會員以觀察員身分與會，但沒有投票權，也無權取得內部的資料。自西元2009年起，世衛組織邀請我國以「中華臺北」的名稱獲邀觀察員資格參加「世界衛生大會」，此為我國退出聯合國後，首度參加聯合國所屬機構的會議。直到西元2017年，受政治因素影響，我國未能繼續獲邀參與該屆大會。請回答下列問題：
