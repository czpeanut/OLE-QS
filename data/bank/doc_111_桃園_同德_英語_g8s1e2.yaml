  section: 8
  number: 46
  type: single
  page: 4
  stem: （   ）46. What is the main idea of the reading?
  options:
  - label: A
    content: Do your best, even though life is difficult.
  - label: B
    content: Smile at yourself when you fall down from a bike.
  - label: C
    content: Find ways to be kind to yourself although you are down.
  - label: D
    content: Take care of yourself when you have a bad day.
  group_stem: 'Five Ways to Be Nice to Yourself

    Amber cares about her brother very much. Her brother had a bad day last weekend.
    He fell off from his bike and broke his leg. He was in a hospital when he woke
    up. Because of his broken leg, he couldn’t go out. He missed his classmates and
    school’s outdoor activities. He felt so sad, and he didn’t want to do anything.
    He felt like staying in a darking room. Amber gave his brother a note of “five
    ways to be nice to yourself.” After Amber’s brother read the picture, he wore
    a bright smile and felt much more comfortable.

    Amber hopes this note can help her brother find joy in his life and smile again.
    Although he isn’t always lucky, he can look for some possible pleasure.

    ＊outdoor activities 戶外教學 ＊pleasure 愉快，高興'
