- id: doc_113_台中_向上_數學_g9s1e2_s3_2
  section: 3
  number: 2
  type: calc
  page: 2
  stem: '我們平時所看到的隧道中有很多是弓形，其實隧道常見是圓形，只是另一半的弓形，是隧道中為了穩定隧道地基，以及承載鐵軌及車輛行駛的「反向拱形結構」，稱為『仰拱』；仰拱一方面要將隧道上部的地層壓力，透過隧道邊牆結構，將壓力有效的傳遞到地下，而且還要抵抗隧道下部地層傳來的反作用力。

    小智參考雪山隧道建置一個隧道模型，車輛高度限制不得超過22 公分，車道寬度40 公分、兩側設有4 公分緊急避難道

    則(1) 隧道模型內部半徑為？公分（2 分）

    (2)$\overparen{AB} \approx 160^\circ$，仰拱廊道面積為？平方公分（2 分）'
