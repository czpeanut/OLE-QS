    全球最幸福國家：芬蘭霸榜 台灣遠超中日韓


    芬蘭第七度蟬聯全球「最幸福國家」冠軍！在聯合國自2012年起每年發布的《世界幸福報告》中，芬蘭經常名列前茅，今年也不例外。佔據排名前四位的清一色都是北歐國家。


    西元2012 年聯合國(UN)大會宣布3 月20 日為世界幸福日，聯合國每年都會在這一天公布「全球幸福報告」(World Happiness Report)。根據西元2024
    年最新出爐的報告，在全球146 個國家和地區中，擁有充滿美食創意的首都、壯觀的北極光，還是聖誕老人家園的芬蘭，連續七年成為世界上最幸福的國家，其次是丹麥、冰島、瑞典。在亞洲國家部分的排名，我國排名第31
    名，僅次於新加坡，領先第51 名的日本和第52 名的韓國。


    該項調查報告是根據「收入、經濟表現、社會支持、與其壽命、社會自由程度、政府腐敗程度」等幸福指數的衡量指標，對各國進行幸福程度的排名。那些最幸福的國家的生活方式有著共同性：居民信任政府、生活自由、彼此互相支持、互相關心，這就是人們想要居住的地方。


    由塔利班執政的阿富汗，飽受戰爭蹂躪，蟬聯成為全球最不幸

    福的國家，其次是面臨經濟崩潰的黎巴嫩。'
