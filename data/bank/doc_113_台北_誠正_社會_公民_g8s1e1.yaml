  group_stem: '請閱讀文章，回答以下問題

    西元1993 年，役男彭先生向內政部入出境管理局申請出境，內政部依據《役男出境處理辦法》第8 條否決其申請。該條文內容是基於防範役男藉故出境，逃避服兵役義務而來。

    然而，以《役男出境處理辦法》限制役男出境是否違憲？大法官釋字第443 號解釋，認為限制役男出境是對人民居住遷徙自由的重大限制，但《兵役法》及《兵役法施行法》都沒有規定，也沒有明確授權內政部制訂《役男出境處理辦法》。換言之，《役男出境處理辦法》欠缺法律授權的依據，與《憲法》意旨不符。'
