- id: doc_113_台北_誠正_社會_公民_g8s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 今年十月，颱風山陀兒來勢洶洶，原本預計10 月2 日將從台灣南部登陸，但其慢速難測，直到10 月3 日才正式從高雄小港登陸，使得全國各地至少兩天颱風假，但仍有部分產業的勞工需要上班。在法律上，雇主不需要對颱風天出勤的勞工加發津貼或加班費，如果勞工不出勤，雇主則可以扣發當天工資。因為《勞動基準法》並沒有將颱風假列入法律，即使縣市政府發布停班停課通知，雇主仍然可以要求勞工依法出勤。但這不表示雇主在颱風天要求勞工出勤，完全不需要負擔法律責任。依法雇主有避免勞工發生職災的義務，像是勞工因為風雨過強，在通勤途中或是在工作場所發生職業災害，雇主必須負起損害賠償責任。請問：《勞動基準法》應屬於下列哪一法律位階？
  options:
  - label: A
    content: 命令
  - label: B
    content: 法律
  - label: C
    content: 《憲法》
  - label: D
    content: 《憲法增修條文》
