  group_stem: 台中市清水區發現四千多年前的史前時代，「牛罵頭遺址」。巴布拉族人原在此生活，直到十七世紀中葉以後，陸續受到荷蘭人統治以及明清時期的大量漢人移入開墾，改變了他們的生活方式與傳統文化。1895年進入日治時期，日本人先行在此地闢建運動場，因環境優美，而後興建「清水神社」，為政教合一的日本精神代表，也是做為控制殖民地人民信仰的工具。臺灣光復以後，此處改為陸軍砲兵部隊清水營區，因後來營區裁併土地歸還臺中市政府，牛罵頭遺址在多位學者專家建議之下，被列為市定遺址，園區入口處可見一座陶器標的物，象徵了距今約四千五百年至三千年之間，以紅、褐色繩紋陶器為主要代表的牛罵頭文化。
