- id: doc_113_台中_清水_社會_g7s1e1_s3_42
  section: 3
  number: 42
  type: single
  page: 4
  stem: 根據資料一的內容判斷，□□應為下列何者？
  options:
  - label: A
    content: 英國東印度公司
  - label: B
    content: 荷蘭東印度公司
  - label: C
    content: 葡萄牙
  - label: D
    content: 西班牙
  group_stem: '資料一：1637年7月，臺灣的□□長官在日誌中寫下：「要派往日本的快艇今天已經裝貨完畢，其中有84箱絲織品、94袋香料、1116 籃砂糖、232捆鹿皮。明天清晨，如果天氣許可，即可出航。願神保佑他們一路平安。」

    資料二：前期倭寇，確實以日本人為主體，被稱為「真倭」；後期倭寇，以中國人為主體、其他東亞族裔為輔，被稱為「假倭」，《明史 日本傳》有云：「大抵真倭十之三，從倭者十之七」。朝鮮歷史《世宗實錄》亦記載「然其間倭人不過一二而本國民假著倭服成黨作亂」。可見於後期倭寇（假倭）時期，根據《明史日本傳》記載日本人比例大約只有3成，根據《世宗實錄》記載日本人比例亦不過2成。

    資料三：顏思齊，福建漳州府海澄縣人，精通武術，為人豪爽，廣受敬重。17世紀東亞知名的武裝海商，曾為方便經商於馬尼拉受洗為天主教信徒，教名為彼得（Pedro，英文為Peter），故當時以「中國彼得」（Pedro
    Chino，英文Chinese Peter）而知名。曾以臺灣為基地，是早期登陸臺灣的漢人，受明朝政策影響，使得顏思齊得以招募漢人擴大發展。'
