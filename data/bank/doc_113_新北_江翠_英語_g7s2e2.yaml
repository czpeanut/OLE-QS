- id: doc_113_新北_江翠_英語_g7s2e2_s5_38
  section: 5
  number: 38
  type: single
  page: 5
  stem: 38. What do we know about The Piano Lesson from the reading?
  options:
  - label: A
    content: Matisse painted it when his son was eight years old.
  - label: B
    content: The woman sitting on a seat behind the boy is not his mother or teacher.
  - label: C
    content: Matisse uses yellow and red to show his son was happy.
  - label: D
    content: There are three paintings of Matisse’ inside this painting.
  group_stem: '(III) (37~39)

    Here’s The Piano Lesson, a very famous painting by Henri Matisse. The boy in the
    picture is the painter’s son, Pierre. In the picture, Pierre looks quite unhappy.
    Why? Well, look at the yellow candle on the red piano. It’s almost burned down.
    So maybe Pierre has already practiced for hours. And Matisse uses a lot of gray,
    not a very fun color, right? It shows how the poor kid feels, don’t you think?

    On the top right corner, you can see a woman sitting on a chair. Is she Pierre’s
    piano teacher? Or his mother? Well, if you’re a Matisse fan, you’ll know this
    is in fact another painting by him, Woman on a High Stool. Interesting, right?
    Matisse likes to do that a lot. In fact, there’s another work by Matisse in the
    picture. Did you find it? Right! The sculpture on the bottom left corner! Matisse
    painted this picture in 1916.

    Interestingly, Pierre was already 16 then, but inside the painting, he looked
    like he was only 8. Why did Matisse do that? Well, Pierre was in a war, and Matisse
    didn’t know whether he would come back. Maybe this is a worried father’s way to
    remember the good old days. 【改編自110 會考】

