- id: doc_113_新北_江翠_英語_g7s2e2_s5_40
  section: 5
  number: 40
  type: single
  page: 5
  stem: 40. According to the article, which of the following has a correct usage of
    the word, ”funeral”?  (funeral 用法何者正確)
  options:
  - label: A
    content: We have a funeral in the park every morning.
  - label: B
    content: Tom buys a funeral to eat for lunch.
  - label: C
    content: My grandpa's funeral was very sad.
  - label: D
    content: I like to play funeral after school.
  group_stem: "(IV)(40-41)\nTable Manners in Taiwan\nEating in Taiwan\n When you eat\
    \ in Taiwan, there are some special rules to follow. These rules show you are\
    \ polite. If you remember them, people will feel happy.\n\nEating with Chopsticks\n\
    \ In Taiwan, people eat with chopsticks. Long ago, a man named Confucius didn’t\
    \ like knives on the table. He thought they made people feel unfriendly. So now,\
    \ people use chopsticks. Most food is cut into small pieces before you eat it.\
    \ This makes it easy to pick up food with chopsticks. You don’t need a knife or\
    \ fork, unless you are eating things like French fries.\n\nHow to Use Chopsticks\n\
    ➢ Hold one chopstick tight. Move the other one to pick up food.\n➢ Don’t point\
    \ at people with your chopsticks. That is not polite.\n➢ Don’t put chopsticks\
    \ straight up in your rice bowl. It looks like incense at a funeral. People think\
    \ that is for the dead and bad luck.\n➢ Wait for the host to say you can start\
    \ eating.\n\nShowing You Are Full\n When you finish eating, leave a little food\
    \ on your plate. This means you are full and happy. If you eat everything, it\
    \ may mean you are still hungry.\n\nAccepting Gifts\nWhen someone gives you a\
    \ gift, use both hands to take it. This shows you respect the person and feel\
    \ thankful.\n\n respect 尊重 polite 有禮貌的 thought (think過去式) 認為 made (make過去式) 使…\
    \ hold …tight 緊緊握著 unless 除非 straight 直的 incense 香"
