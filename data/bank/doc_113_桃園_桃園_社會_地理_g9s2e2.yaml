- id: doc_113_桃園_桃園_社會_地理_g9s2e2_s1_29
  section: 1
  number: 29
  type: single
  page: 2
  stem: 臺灣自加入 WTO 之後，除了能將我國的農產品外銷出去之外，同時也必須開放外國農產品進口臺灣。上述的情況使臺灣面臨嚴重的競爭壓力，其主要與下列何項因素關係最密切？
  options:
  - label: A
    content: 耕地面積狹小，導致生產成本較高
  - label: B
    content: 投入大量資金，單位面積生產量低
  - label: C
    content: 過度使用農藥與肥料，增加生產成本
  - label: D
    content: 氣候條件不佳，影響農產品的品質。
