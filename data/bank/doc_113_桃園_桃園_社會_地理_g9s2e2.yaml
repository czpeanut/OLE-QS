  stem: 受到全球暖化的影響，北極地區的浮冰與南極地區的冰棚範圍逐漸縮小，這些融冰進入海洋後，使得全球海水總量增加，海平面上升將使得地勢低窪的島國，以及全球人口稠密的沿海地區面臨被淹沒的危機。請問：文中提及的情形對於下列哪一城市威脅最大？
