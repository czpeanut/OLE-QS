    \               （陳壽三國志諸葛亮傳）\n(乙)魏氏春秋記載:諸葛亮的使節來到，司馬懿詢問諸葛亮起居飲食及繁忙的程度，而沒有問軍事相關的問題。使者回答：「諸葛亮日以繼夜的工作，只要處罰二十棍以上，都要親自審理；所吃的食物不到幾升。」司馬懿聽了說：「諸葛亮不久將會死啊！」\n\
    (丙)\n| 朝代 年號 | 西元 紀年 | 大事紀 |\n| --- | --- | --- |\n| 蜀漢後主 建興五年 | 227 | 諸葛亮向劉禪上出師表準備北伐。\
    \ |\n| 蜀漢後主 建興六年 | 228 | 第一次北伐，街亭失守，諸葛亮揮淚斬馬謖，自貶為右將軍，行丞相事。同年冬天第二次北伐，出兵散關，終因糧食不繼而退兵。\
    \ |\n| 蜀漢後主 建興七年 | 229 | 第三次北伐，成功收復武都、陰平，恢復丞相職位。 |\n| 蜀漢後主 建興九年 | 231 | 第四次北伐，以「木牛」運糧，包圍祁山。司馬懿的軍隊幾乎全軍覆沒，蜀軍因糧盡而退兵。\
    \ |\n| 蜀漢後主 建興十二年 | 234 | 第五次北伐，諸葛亮發明「流馬」以解決軍糧問題。諸葛亮屯兵五丈原與司馬懿相持達一百多日之久，終因積勞成疾，病逝軍中。\
