  stem: 根據本文，下列虎丘的情景，依作者喜好的程度由高而低依次排列，何者正確？
  options:
  - label: A
    content: 山空人靜→笙歌笑語，填山沸林→紅粉笙歌一兩隊
  - label: B
    content: 山空人靜→紅粉笙歌一兩隊→笙歌笑語，填山沸林
  - label: C
    content: 紅粉笙歌一兩隊→山空人靜→笙歌笑語，填山沸林
  - label: D
    content: 紅粉笙歌一兩隊→笙歌笑語，填山沸林→山空人靜
  group_stem: "虎丘，中秋遊者尤盛。士女傾城而往，笙歌笑語，填山沸林，終夜不絕。遂使丘壑化為酒場，穢雜①可恨。\n    予初十日到郡，連夜遊虎丘。月色甚美，遊人尚稀，風亭月榭②間，以紅粉笙歌③一兩隊點綴，亦復不惡。然終不若山空人靜，獨往會心。嘗秋夜與弱生坐釣月磯，昏黑無往來，時聞風鐸④及佛燈隱現林杪⑤而已。\n\
    \    又今年春中，與無際舍姪偕⑥訪仲和於此。夜半月出無人，相與趺坐⑦石臺，不復飲酒，亦不復談，以靜意對之，覺悠然欲與清景俱往也。\n    生平過虎丘才兩度見虎丘本色耳。友人徐聲遠詩云：「獨有歲寒好，偏宜夜半遊。」真知言哉!\n\
    \                             (李流芳遊虎丘小記)\n【注】①穢雜:汙濁而雜亂。②榭:音ㄒㄧㄝˋ，建築在臺上的房屋。③紅粉笙歌:指歌女奏樂唱歌。\n\
    ④風鐸:塔簷所懸的鈴，亦稱「風鈴」。鐸，音ㄉㄨㄛˊ⑤林杪:林梢，樹林的末梢。杪，音ㄇ一ㄠˇ。\n⑥偕:共同、一起。⑦趺坐:兩腳盤腿打坐。趺，音ㄈㄨ"
