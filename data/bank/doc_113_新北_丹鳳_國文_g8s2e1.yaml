- id: doc_113_新北_丹鳳_國文_g8s2e1_s4_6
  section: 4
  number: 6
  type: single
  page: 1
  stem: 〈木蘭詩〉詩句中，「十二卷／十二轉／十二年」的數字「十二」為虛數，表示多數 。下列詞語中，何者數字不是虛數？
  options:
  - label: A
    content: 故國三千里，深宮二十年
  - label: B
    content: 七八個星天外，兩三點雨山前
  - label: C
    content: 兩個黄鸝鳴翠柳，一行白鷺上青天
  - label: D
    content: 彼采葛兮，一日不見，如三月兮。
  lesson_raw:
    title: 木蘭詩
    basis: 題目引用〈木蘭詩〉
- id: doc_113_新北_丹鳳_國文_g8s2e1_s4_7
  section: 4
  number: 7
  type: single
  page: 1
  stem: 下列有關「樂府詩」的敘述，正確的是？
  options:
  - label: A
    content: 「樂府」本為官署之名，周代時設置，以採集民間歌謠為主
  - label: B
    content: 內容多反映士人的思想感情，亦有遊子思鄉和思婦閨怨的作品
  - label: C
    content: 字數、句數沒有限制，字句可反覆且不避雷同，但不可換韻
  - label: D
    content: 後世文人沿用樂府舊題或仿作樂府體裁，雖未必合樂，但也可稱為「樂府」。
- id: doc_113_新北_丹鳳_國文_g8s2e1_s4_8
  section: 4
  number: 8
  type: single
  page: 1
  stem: 關於〈一棵開花的樹〉一詩，下列說明何者正確？
  options:
  - label: A
    content: 以「花開」、「花落」，象徵對愛情如曇花一現
  - label: B
    content: 求了「五百年」，表達對愛情的虔誠
  - label: C
    content: 落了一地花瓣，表示與對方破鏡重圓之意
  - label: D
    content: 詩中意境相似「兩情若是久長時，又豈在朝朝暮暮」。
  lesson_raw:
    title: 一棵開花的樹
    basis: 題目考查〈一棵開花的樹〉
- id: doc_113_新北_丹鳳_國文_g8s2e1_s4_9
  section: 4
  number: 9
  type: single
  page: 1
  stem: 下列對於〈木蘭詩〉詩句含意的解讀，何者有誤？
  options:
  - label: A
    content: 阿爺無大兒，木蘭無長兄——說明木蘭決定從軍主因
  - label: B
    content: 但聞燕山胡騎聲啾啾——表示已到達戰場，深入敵境
  - label: C
    content: 木蘭不用尚書郎，……，送兒還故鄉——木蘭推辭官職安排，因歸心似箭
  - label: D
    content: 安能辨我是雄雌——讚揚木蘭表現男子無法匹敵
  lesson_raw:
    title: 木蘭詩
    basis: 題目引用〈木蘭詩〉
- id: doc_113_新北_丹鳳_國文_g8s2e1_s4_10
  section: 4
  number: 10
  type: single
  page: 1
  stem: 透過作者廖鴻基對於海豚的觀察描述，那一項並非形容「弗氏海豚」？
  options:
  - label: A
    content: 像衛兵、管理員，可能更貼切的形容是牧者
  - label: B
    content: 像林立的保齡球瓶被撞翻成七零八落
  - label: C
    content: 龐大的群體如如秋風落葉散成小群
  - label: D
    content: 時而匯合成一大群，時而再度分裂散去。
- id: doc_113_新北_丹鳳_國文_g8s2e1_s4_11
  section: 4
  number: 11
  type: single
  page: 2
  stem: 下列文句中的成語，何者使用有誤？？
  options:
  - label: A
    content: 參觀台灣燈會，會場一片「火樹銀花」景象，令人目不轉睛。
  - label: B
    content: 這起案件，案情「撲朔迷離」，偵辦人員已不舍晝夜偵查，仍一無所獲。
  - label: C
    content: 做人處事「不倫不類」，且態度坦誠、誠信相待，方能受人敬重。
  - label: D
    content: 將軍一生南征北戰、「兵馬倥傯」， 終至如願迎來太平盛世。
- id: doc_113_新北_丹鳳_國文_g8s2e1_s4_12
  section: 4
  number: 12
  type: single
  page: 2
  stem: 〈木蘭詩〉中木蘭塑造巾幗英雄的形象。「巾幗」後來引申為女子的代稱。下列選項中，何者代稱有誤？
  options:
  - label: A
    content: 「朱門」酒肉臭，路有凍死骨——「富貴人家」
  - label: B
    content: 時窮節乃見，一一垂「丹青」——「史冊」
  - label: C
    content: 客從遠方來，遺我「雙鯉魚」——「書信」
  - label: D
    content: 但願人長久，千里共「嬋娟」——「美女」
  lesson_raw:
    title: 木蘭詩
    basis: 題目引用〈木蘭詩〉
- id: doc_113_新北_丹鳳_國文_g8s2e1_s4_13
  section: 4
  number: 13
  type: single
  page: 2
  stem: 丹鳳高中舉辦家長日。當日親師晤談時，何者話中「稱謂」詞語全部正確？
  options:
  - label: A
    content: 老師：歡迎「貴家長」蒞臨，關心「貴班」同學在校點滴。
  - label: B
    content: 媽媽：「外子」工作忙碌，若「小犬」在校有任何情況，請與「在下」聯繫即可。
  - label: C
    content: 家長：「閣下」想請教「令千金」參加「貴校」技藝班開課事宜，應該詢問那一行政單位。
  - label: D
    content: 學生：不好意思，「家慈」臨時有事，不克前來。敬請「愚師」見諒。
- id: doc_113_新北_丹鳳_國文_g8s2e1_s4_14
  section: 4
  number: 14
  type: single
  page: 2
  stem: 下列有關書信用語的說明，何者正確？
  options:
  - label: A
    content: 提稱語：對祖父母、父母用「大鑒」、「臺鑒」
  - label: B
    content: 問候語：對師長用「順問 近佳」、「即問 近好」
  - label: C
    content: 末啟詞：對平輩用「謹啟」、「敬啟」
  - label: D
    content: 信封中欄啟封詞，對長輩用「敬啟」、「鈞啟」
- id: doc_113_新北_丹鳳_國文_g8s2e1_s4_15
  section: 4
  number: 15
  type: single
  page: 2
  stem: 有關書信、便條在書寫時要注意的事項，下面的敘述何者最恰當？
  options:
  - label: A
    content: 信中提到對方，可在原行中空一格表示尊敬，叫做「挪抬」
  - label: B
    content: 現代人寫信大多不拘形式，所以弔唁的書信用紅線的信紙無妨
  - label: C
    content: 明信片的啟封詞用「啟」不用「收」，緘封詞用「寄」
  - label: D
    content: 便條過於簡便，稱謂、署名皆可省略，日常生活應少用為佳
- id: doc_113_新北_丹鳳_國文_g8s2e1_s4_16
  section: 4
  number: 16
  type: single
  page: 2
  stem: 「真正的詩是詩人的心靈，真正的船是造船者，我們倘若能把人剖開來，就能夠在他裡面看到他的作品裡最微末的一撇一鉤的理由。」這段文字的涵義與下列何者最接近？
  options:
  - label: A
    content: 創作理論的重要性遠高於呈現技巧
  - label: B
    content: 文學作品是創作者內心情志的投射
  - label: C
    content: 藝術創作的精髓源自用心觀察細膩
  - label: D
    content: 不同的創作可能有相同的內在精神
- id: doc_113_新北_丹鳳_國文_g8s2e1_s4_17
  section: 4
  number: 17
  type: single
  page: 2
  stem: 「一個作家是否辭窮，通覽其作品自可判斷。若是腹笥窘然，不免自相重複，說愈多而辭愈窮。但更嚴重的，或許是一個時代的辭窮。第一個想出『心頭如小鹿亂撞』的人，算得上是某種層次的詩人了，但現在我們加以套用，多半成了笑話。」這段文字最後所說的「笑話」是指下列何者？
  options:
  - label: A
    content: 無法與時並進，缺乏創意
  - label: B
    content: 引經據典不妥，使用錯誤
  - label: C
    content: 過於咬文嚼字，令人不解
  - label: D
    content: 文字浮誇不實，徒留戲謔
- id: doc_113_新北_丹鳳_國文_g8s2e1_s4_18
  section: 4
  number: 18
  type: single
  page: 2
  stem: 「海上垃圾桶的概念始於兩位衝浪者，他們在世界各地目睹聚集在碼頭的大量污染物，故而想改善這個現象。海上垃圾桶是由大型纖維網製成，架設於碼頭附近且漂在海面上，以收集不同尺寸的污染物，最小可攔住直徑2mm
    的浮動碎屑，當發生溢油事件時，也能派上極大的用場。」依據這段文字，下列關於海上垃圾桶的作用何者正確？
  options:
  - label: A
    content: 收集海底的各類垃圾
  - label: B
    content: 為預防溢油事件發生
  - label: C
    content: 以攔截沿海的污染物
  - label: D
    content: 清除所有尺寸的垃圾
- id: doc_113_新北_丹鳳_國文_g8s2e1_s4_19
  section: 4
  number: 19
  type: single
  page: 2
  stem: 「月有意而入窗，雲無心而出岫。其實月亮入窗哪會是有意？真正有意的，應該是室內那賞月的人兒吧！那一地的清輝，多麼惹人思念。雲本無心，隨風舒卷，四處飄流，卻和閒適的心情相應和。」根據這段文字，下列何者最能與作者的想法相呼應？
  options:
  - label: A
    content: 不畏浮雲遮望眼，只因身在最高層
  - label: B
    content: 世事洞明皆學問，人情練達是文章
  - label: C
