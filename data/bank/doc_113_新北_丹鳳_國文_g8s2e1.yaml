- id: doc_113_新北_丹鳳_國文_g8s2e1_s5_25
  section: 5
  number: 25
  type: single
  page: 3
  stem: 根據本文關於「走神」的敘述，下列哪一個選項說明不符合作者的觀點？
  options:
  - label: A
    content: 走神可說是生在意料之中，出於情理之外
  - label: B
    content: 是思想靜謐的開叉，是精神最純粹的漫遊
  - label: C
    content: 對於一個作家來說，走神得來的，是神品
  - label: D
    content: 彷彿心穿上了一雙舒適的鞋子在路上散步
  group_stem: "忽然覺得，「走神」這個詞，非常之美，彷彿心穿上了一雙舒適的鞋子，在一個分岔的小路上慢慢散步，散啊，散啊，不知散到了哪，又彷彿散到了任何一個地方。不驕不躁，有虛有實，節奏自由，韻味悠悠。這就是走神。\n\
    \    很多好東西，都是走神得來的。\n    一件中規中矩的衣服，衣襟下擺忽然調皮的斜出去了一角，上面繡了半隻蝴蝶。\n【甲】整件衣服便在蝴蝶這裡走神了，因此飄飄逸逸，韻味無窮。\n\
    \    艾菲爾鐵塔呢？乍看是那麼無來由的一個鐵架子，就那麼突兀的矗立在浪漫的巴黎心臟。但是，細想一下：哪一樣經典在誕生之初不是突兀的呢？不是經歷了晃眼甚至刺眼的歷程最後才抵達耀眼的呢？因此，只要這神走得好，那麼，終有一天它會用自己的光芒將所有的非議籠罩和說服。歲月如酒，泡在這酒裡，【乙】艾菲爾鐵塔成了巴黎最驕傲的走神。\n\
    \    生活中，也一樣。讓你走神的菜，一定是有故事的；讓你走神的話，一定是有淵源的；【丙】讓你走神走得最遠的那個身影，一定有著最刻骨銘心的秘密……\n \
    \   對於一個作家或藝術家來說，走神就更是奧妙，簡直是可遇而不可求。【丁】哪座雕塑，哪個線條，哪段旋律不是走神得來的？最走神的作品，也一定是他們最好的作品。走神得來的，是神品啊。\n\
    \    走神，生在情理之中，出於意料之外，拋卻所有的約定俗成，奔向心靈最本真的地方，奔向靈魂最自由的地方……\n    走神，是心靈從容的逃走，是思想靜謐的開叉，是精神最純粹的漫遊。\n\
    \    某種意義上講，走神，是未知的花園，是飛翔的神話，是深邃的探幽，也因此，它也是我們最澈底的凝神。因為，走神時的我們，才最接近於我們自己最內最內的那個內在。\n\
    \                                        (喬葉走神)"
