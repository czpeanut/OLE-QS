  group_stem: "Look at the faces of some clocks and you’ll notice that the hours are\
    \ not shown as 1, 2, 3, 4, and so on. Instead, they are shown by the symbols Ⅰ,\
    \ Ⅱ, Ⅲ, Ⅳ… ”Why are they written in this strange way?” you might wonder. It’s\
    \ because the numbers on clocks are often written in Roman numerals.\n    Roman\
    \ numerals are how numbers were written in ancient Rome, around two thousand years\
    \ ago. For modern people, the system can be a little tricky to understand, but\
    \ with practice it gets easier. First, just remember that a value of one is shown\
    \ by the letter Ⅰ, five by the letter Ⅴ, and ten by the letter Ⅹ. Next, follow\
    \ the rules below , and you’ll know what each symbol means.\n\n| Number | Rule\
    \ | Roman numerals |\n| :--- | :--- | :--- |\n| two | one plus one | Ⅱ |\n| four\
    \ | one less than five | Ⅳ |\n| six | five plus one | Ⅵ |\n| nine | one less than\
    \ ten | Ⅸ |\n| eleven | ten plus one | XI |\n| fourteen | ten plus four | XIV\
    \ |\n\nIt is thought that these numerals were invented by shepherds as a way to\
    \ count their sheep. For each sheep, they made a cut into a piece of wood (Ⅰ).\
    \ Every fifth sheep got two cuts (Ⅴ), and every tenth a cross (Ⅹ).\n    Today\
    \ we seldom use Roman numerals to count. Indeed, there are some mistakes in the\
    \ system, and one is that there is no symbol for zero. However, they are still\
    \ used sometimes. For example, you might see them marking chapter numbers in books\
    \ or dates on old buildings and statues. Now, when you see these strange symbols,\
    \ they’ll no longer be a mystery.           symbol 標記  statue 雕像"
