  group_stem: 'Changdong is in the north of Seoul in South Korea. Only a few hundred
    thousand people live there, and it has few facilities. It is not as rich as many
    other places in Seoul, but after 2021, it will be one of the most exciting places
    to visit. The reason for this is Korean popular music, which everybody knows as
    K-pop－the South Korean government wants Changdong to become the K-pop center of
    the world.

    South Korea knows that K-pop is very important. In 2015, South Korea made $ 5
    billion from selling K-pop music and related TV shows, films, games, and so on.
    What’s more, because of K-pop, other Korean products like Samsung smartphones,
    Korean-made cars, and Korean-style clothes have become very popular.

    K-pop is very global today. For a long time, it’s been very popular in China,
    Japan, Taiwan, and Hong Kong. However, Billboard magazine found a different trend
    between 2013 and 2016. During this time, the United States was the third biggest
    buyer of K-pop music. K-pop CDs were exported to 23 nations in 2012, then 88 nations
    in 2021. Therefore, it can be said that K-pop has a lot of fans in the West today.

    To attract fans from around the world, there are big plans for Changdong. It will
    have concert halls, music schools, recording studios, art galleries, and a K-pop
    museum. The place that will be the most important venue, however, is the huge
    arena. About 20,000 fans will be able to enjoy K-pop events there. Since it is
    a very big and important project, the arena, which won’t be completed until 2021,
    is already being built. When everything is finished, Changdong will be a very
    exciting place to visit. For K-pop fans, it will be the coolest place on earth!             
    facilities 設施 venue 會場 arena 舞台'
