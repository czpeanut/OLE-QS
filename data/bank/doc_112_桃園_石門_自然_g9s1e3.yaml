  stem: '（ ）圖（一）、圖（二）兩種連接方式皆為甲、乙兩個燈泡並聯，小美與迪琪皆認為圖（二）的接法，燈泡甲較不會因為線路故障而不亮。以下為兩人的解釋：

    小美：若燈泡乙的燈絲燒斷，在圖（一）中會使得燈泡甲不亮，而在圖（二）中燈泡甲仍會發亮。

    迪琪：若導線丙、丁其中一條斷裂，在圖（一）中會使得燈泡甲不亮，而在圖（二）中燈泡甲仍會發亮。

    關於兩人的解釋是否合理？'
  options:
  - label: A
    content: 兩人皆合理
