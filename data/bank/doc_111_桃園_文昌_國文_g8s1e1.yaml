- id: doc_111_桃園_文昌_國文_g8s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: ( ) 老師於課堂上介紹了一首長沙 銅官窯中的瓷器題詩:「君生我未生,我生君已老。君恨我生遲,我恨君生早」。後來詩人程東武在原作上加以續寫:「君生我未生,我生君已老。恨不生同時,日日與君好。我生君未生,君生我已老。我離君天涯,君隔我海角。我生君未生,君生我已老。化蝶去尋花,夜夜棲芳草」。其用字之細膩,使得此詩一時洛陽紙貴,被封為「最美古詩」之一。老師請同學讀完此作後,針對此詩的主題含義作分析,下列哪位同學的解讀較合適?
  options:
  - label: A
    content: 小玠:這是一首君臣詩。寫出臣子有滿腔抱負欲實行,然君主年事已高不願貿然採取革新手手段
  - label: B
    content: 大梓:這是一首親情詩。寫出父母年居高齡才喜獲麟兒,雖想伴兒成長,無奈心有餘而力不足
  - label: C
    content: 阿麗:這是一首送別詩。寫出忘年友將遠赴他鄉,追求人生更高的目標,因而內心有無限不捨
  - label: D
    content: 品品:這是一首愛情詩。寫出戀人因年紀差距甚大,無法如願相守,徒留下無盡的牽掛與遺憾
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
