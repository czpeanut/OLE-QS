- id: doc_111_桃園_文昌_國文_g8s1e1_s2_24
  section: 2
  number: 24
  type: single
  page: 6
  stem: '( ) 下表為常見的毒品介紹,根據本文的資訊,下列何者最有可能是笑氣?

    | | 濫用方式 | 類別 | 危害 |

    | :--- | :--- | :--- | :--- |

    | (A) | 口服 | 中樞神經抑制劑 | 為強力安眠藥,迅速誘導睡眠,被濫用於下毒強暴犯罪(將被害者迷昏予以性侵害)、自殺工具等 |

    | (B) | 口服 | 中樞神經興奮劑 | 由於中樞神經抑制能力減弱,加之易產生不會受傷害的幻想,濫用者往往對行為安全性掉以輕心,造成意外 |

    | (C) | 口服、鼻吸、煙吸、注射 | 中樞神經抑制劑 | 長期濫用會傷害膀胱功能,使膀胱壁增厚容量變小,出現頻尿、小便疼痛、血尿等症狀 |

    | (D) | 鼻吸 | 吸入性濫用物質 | 短效的吸入性全身麻醉劑,長期使用會產生末梢神經及脊髓病變,並可能產生精神異常,造成嚴重身心傷害 |'
  options:
  - label: A
    content: 口服 / 中樞神經抑制劑
