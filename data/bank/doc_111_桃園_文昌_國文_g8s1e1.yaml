  group_stem: "(四)\n    杭州北關門外有一屋,鬼屢見,人不敢居,扃鎖①甚固。書生蔡姓者將買其宅。人危之,蔡不聽。券成,家人不肯入。蔡親自啟屋,秉燭坐。至夜半,有女子冉冉來,頸拖紅帛,向蔡伏拜,結繩於梁,伸頸就之。蔡無怖色。女子再掛一繩,招蔡。蔡曳一足就之。女子曰:『君誤矣。』蔡笑曰:『汝誤才有今日,我勿誤也。』鬼大哭,伏地再拜去。自此,怪遂絕,蔡亦登第。\n\
    ①扃鎖:大門的鎖。扃,音ㄐㄩㄥ。\n——袁枚《子不語·蔡書生》"
