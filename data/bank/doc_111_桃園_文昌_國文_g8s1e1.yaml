  group_stem: "(一)\n(甲)\n    每當夜色翻轉進入最黑最濃的核心,燈光逐窗滅去,聲音也愈來愈單純、只剩嬰啼和狗吠的時候,我總能感受到萎縮的精神在夜色中發酵,情緒也逐漸高昂,於是感官便更敏銳起來。遠處細微的貓叫,在聽覺裡放大成高分貝的廝殺;機車的引擎特別容易發動不安的情緒;甚至還遷怒風扇的窗簾,它驚嚇了剛要蒞臨的膽小睡意。一隻該死的蚊子,發出絲毫沒有美感和品味的鼓翅聲,引爆我積累的敵意,於是乾脆起床追殺牠。蚊子被我的掌心夾成了肉餅,榨出無辜的鮮血。我對著那美麗的血色發呆,慣性的又去瞄一瞄鬧鐘。□□的人對時間總是特別在意,哎!三點半了!時間行走的聲音讓我反應過度,對分分秒秒無情的流失尤其小心眼。\n\
    \n(乙)\n    太過喧囂的寧靜\n    一個人的夜裡\n    是誰偷走了時間\n    只留高挑的影子,齜牙裂嘴\n\n    無法擱淺於夢景\n\
    \    只能放任鼓躁的時針\n    拖著人向前\n    肅殺的空氣,凍結了眼皮\n    歡鬧的羊群,翻倒了睡意\n    闔得上雙眼\n    卻闔不了今夜\n\
    \n    晃了晃黑眼圈\n    繼續與□□纏綿"
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
