  group_stem: "(三)\n    一八四四年十二月,美國鄉下一位二十九歲的牙醫師威爾斯(Horace Wells),帶著太太莉莎花費兩角五分買了門票站在人群中,愉快地觀賞江湖郎中的笑氣表演。不信邪的志願者上臺吸了笑氣之後,開始神志恍惚,做出大笑、唱歌、喋喋不休……各種令人捧腹的舉止。\n\
    \    ①威爾斯注意到有個志願者吸了笑氣之後,腳脛撞到桌角,血流如注,卻一點都不覺得痛,渾然忘我到處遊走。他開始想,是不是可以用這種氣體來幫助拔牙?這個沒沒無聞的年輕人當時可能並不明白這個想法的偉大,以及它如何改變了人類醫療的歷史,當然,他更不知道,這個想法是如何注定了他一生的悲劇。\n\
    \    連施行笑氣的郎中卡登(C. Q. Colton)都覺得威爾斯的想法荒謬無比,但威爾斯並不氣餒。他找到自己的同行好友雷格斯(J. M. Riggs)來幫忙。於是人類史上第一次的麻醉手術就這樣開始了。任務分配的結果雷格斯擔任牙醫,卡登是麻醉師,最熱衷的威爾斯自然責無旁貸成了實驗動物。\n\
    \    雷格斯從麻醉的威爾斯口中拔出牙齒時,他一點反應也沒有。有一度他們很擔心,萬一威爾斯死了怎麼辦?可是威爾斯畢竟還是從麻醉中恢復過來。不但如此,他高興地大叫:「偉大的發現,偉大的發現——」往後的十幾次無痛拔牙的臨床經驗使得威爾斯遠近馳名,許多人紛紛前來求醫。②有人勸他趕快申請專利好大撈一筆,但是威爾斯志不在此。這個虔誠基督徒認為這一切是神的啟示。他說:「讓它像空氣一樣免費吧!」\n\
    \    不但如此,他還將之積極推廣。不久,有人將威爾斯及他的發現介紹給哈佛大學著名的外科醫師華倫教授。\n    華倫教授安排了一節「特別演講」的時間給威爾斯。在講堂上,威爾斯身兼講師、麻醉師、牙醫師,當場示範起來。接受拔牙的是大學部的學生,而臺下聆聽的學生幾乎都抱著懷疑的心情,張大眼睛注視著。\n\
    \    如同往常一樣,病人吸了笑氣之後,漸漸昏沉,失去反應,雙眼鬆弛、雙手下垂……威爾斯顯得有些緊張,他抓緊拔牙鉗,伸進病人微張的嘴裡,臺下沒有一點聲音……\n\
    \    「啊——」這時病人發出的一聲慘叫,打碎了威爾斯的夢想。學生先是愣住了,接著笑鬧成一片。幾分鐘以後,威爾斯在所有人的噓聲以及嘲笑中,落荒逃離哈佛。\n\
    \    這一聲大叫,足足使麻醉以及外科技術的發展延後了兩年。身為一個麻醉醫師,以現代的麻醉知識,我可以很容易地發現:一、笑氣的濃度因為呼吸設備的關係,並不容易達到麻醉深度。二、在淺麻下,病人的反射動作可能比清醒時還要強烈。這些問題,其實都是很容易改正的錯誤,然而在當時卻不是簡單的事。威爾斯往後的日子幾乎都在悔恨之中度過。他認定示範的失敗導因於吸入氣體濃度不夠,因此重複地在自己身上做同樣的實驗。\n\
    \    「明明有效啊!」他一再地質疑。\n    部分的人都對他熱心推銷笑氣的瘋狂態度敬而遠之。威爾斯漸漸變得固執,不易接近。他唯一能做的事,是一再地以自己做實驗來印證最初的理念。然而,再也沒有人相信這種江湖郎中的把戲。\n\
    \    ③過度的笑氣腐蝕了威爾斯的身心狀態。到了最後,他幾乎瀕臨崩潰狀態,不久,便沮喪而死,死時年僅三十三歲。\n    威爾斯的夢並沒有因這樣而停止。④當年在哈佛講堂上有一位叫莫登(William\
    \ Thomas Green Moton)的學生,目睹了全部的情景,拾起威爾斯最初的構想,仍然不斷地去開發氣體麻醉的可能性。於是漸漸有了今日整個麻醉與外科的新領域和新天地。\n\
    \    人類因有夢想而偉大。威爾斯至死也許尚不知道,他所肩負的苦痛,事實上正是一個夢想,一個關於人類更美好未來的夢想。\n    沒有一個夢想不需付出代價。夢想的代價有時十分悲慘,然而比這更悲慘的卻是沒有夢想。\n\
    ——節選自 侯文詠〈夢想的代價〉"
