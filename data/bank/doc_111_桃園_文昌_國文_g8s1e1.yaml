  stem: ( ) 下列詩作皆與「雨」有關,請判斷何者的主題最有可能是西北雨?
  options:
  - label: A
    content: '烈日驕陽日當空,烏雲蔽天暗無光。風弦彈奏驚世音,枝幹搖曳添聲響。

      雨鎚敲出斷腸曲,蕉葉舞動雲飄速。玉珠輕落芭蕉葉,虹彩應對西斜陽。'
  - label: B
    content: '颯颯東風細雨來,芙蓉塘外有輕雷。金蟾齧鎖燒香入,玉虎牽絲汲井回。

      賈氏窺簾韓掾少,宓妃留枕魏王才。春心莫共花爭發,一寸相思一寸灰。'
  - label: C
    content: '一上高城萬里愁,蒹葭楊柳似汀洲。溪雲初起日沉閣,山雨欲來風滿樓。

      鳥下綠蕪秦苑夕,蟬鳴黃葉漢宮秋。行人莫問當年事,故國東來渭水流。'
  - label: D
    content: '瀟瀟冷雨灑輕塵,僵臥空齋百感新。早久喜滋栽麥隴,泥深恐阻寄書人。

      希聲或變中宵雪,貴價先愁來日薪。歲暮柴門寒較甚,可堪此夜倍思親。'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
