  group_stem: "(二)\n    今天一清早,掀開簾子看看,玻璃窗上已撒滿了水珠,啊,真好,又是個下雨天。\n    雨下了十天、半月、甚至一個月,屋子裡掛滿萬國旗似的溼衣服,牆壁地板都□著溼氣,我也不抱怨,好像雨天總是把我帶到另一個處所,離這紛紛擾擾的世界很遠很遠。在那兒,我又可以重享歡樂的童年。那些有趣的好時光啊,我要用雨珠的鍊子把它串起來,繞在手腕上。\n\
    \    那時在浙江 永嘉老家,我才六歲,睡在母親暖和的手臂彎裡。天亮了,聽到瓦背上嘩嘩的雨聲,我就放了心。因為下雨天長工不下田,母親不用老早起來做飯,可以在熱被窩裡多躺會兒。我捨不得再睡,也不讓母親睡,吵著要她講故事。母親閉著眼睛,給我講雨天的故事。在熹微的晨光中,我望著母親的臉,她的額角方方正正,眉毛細細長長,眼睛瞇成一條線。我的啟蒙老師說菩薩慈眉善目,母親的長相一定就跟菩薩一樣。\n\
    \    雨下得越來越大。母親一起床,我也跟著起來,顧不得吃早飯,就套上叔叔的舊皮靴,頂著雨在院子裡玩。陰溝裡水滿了,白繡球花瓣飄落在爛泥地和水溝裡。我把阿榮伯給我雕的小木船漂在水溝裡,中間坐著母親給我縫的大紅「布姑娘」。繡球花瓣繞著小木船打轉,一起向前流。我跟著小木船在爛泥地裡踩水,□□□□地響。\n\
    \    天下雨,長工們不下田,都蹲在大穀倉後面□豆子玩。我把小花貓抱在懷裡,自己再坐在阿榮伯懷裡,等著阿榮伯把一粒粒又香又脆的炒豆子剝了殼送到我嘴裡。豆子吃夠了再吃芝麻糖,嘴巴乾了吃柑子,肚子鼓得跟蜜蜂似的。下雨天真好,有吃有玩,長工們個個疼我,家裡人多,我就不寂寞了。\n\
    \    五月黃梅天,到處□□□的,母親走進走出抱怨,父親卻端著宜興茶壺,坐在廊下賞雨。院子裡各種花木,經雨一淋,新綠的枝子頑皮地張開翅膀,托著嬌豔的花朵,父親用旱煙管點著它們告訴我,這是丁香花,那是一丈紅。牆邊那株高大的玉蘭花開了滿樹,下雨天謝得快,我得趕緊爬上去採,採了滿籃子送左右鄰居。玉蘭樹葉上的水珠都是香的,灑了我滿頭滿身。\n\
    \    唱鼓兒詞的總在下雨天從我家後門摸索進來,坐在廚房的長凳上,唱一段「鄭元和學丐」。母親一邊做飯,一邊聽,淚水□滿了臉頰,拉起青布圍裙擦一下,又連忙盛一大碗滿滿的白米飯,請瞎子先生吃,再給他一大包的米。晚上就讓他在大廳裡唱,請左鄰右舍都來聽。寬敞的大廳正中央燃起了亮晃晃的煤氣燈,發出□□的聲音。煤氣燈一亮,我就有做喜事的感覺,心裡說不出地開心。雨嘩嘩地下越大了,瞎子先生的鼓咚咚咚咚地也敲得越起勁。母親和五叔婆聽了眼圈兒都哭得紅紅的,我就只顧吃炒米糕、花生糖。父親卻悄悄地溜進書房作他的「唐詩」去了。\n\
    \    八、九月颱風季節,雨水最多。那時沒有氣象報告預測天氣好壞,全靠有經驗的長工和母親看天色。雲腳長了毛,向西北飛奔,就知道颱風要來了。走廊下堆積如山的穀子,幾天不晒就要發霉,穀子發霉就是一粒粒綠色的麴。母親叫我和小幫工把麴一粒粒揀出來,不然就會越來越多。這工作真好玩,所以我盼望天一直不要晴起來。麴會越來越多,我就可以天天滾在穀子裡揀麴,多高興哪!\n\
    \    如果我一直不長大,就可以永遠沉浸在雨的歡樂中。然而誰能不長大呢?到杭州念中學了,下雨天,我有一股淒涼寂寞之感,因為我想念遠在故鄉的母親。下雨天,我格外想她。因為在幼年時,只有雨天裡,我就有更多的時間纏著她,雨給我一份靠近母親的感覺。\n\
    ——節選自 琦君〈下雨天真好〉"
