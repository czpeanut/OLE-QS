- id: doc_111_桃園_文昌_國文_g8s1e1_s2_19
  section: 2
  number: 19
  type: single
  page: 4
  stem: ( ) 根據文意,缺空處依序應填上什麼詞最合適呢?
  options:
  - label: A
    content: 冒/吱嗒吱嗒/彈/黏答答/掛/嘶嘶
  - label: B
    content: 散/嘩啦嘩啦/搖/溼答答/流/嘟嘟
  - label: C
    content: 發/淅瀝淅瀝/拍/羞答答/爬/沙沙
  - label: D
