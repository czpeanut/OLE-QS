  stem: '青春時/我是盲目的射手/自負有千萬隻箭/就無的放矢/自以為豪放/終於/射盡了囊中之箭

    中年時/我已百發百中/更發現無數更好的目標/可惜我已無箭可射/只惆悵地看一群拙劣的射手──浪費力氣！

    當我老邁時/啊！/我看見我鬢髮皆白/正以老花的眼/顫抖的手/撿一根枯乾木棒/夢想削成青春之箭……

    (梁雲坡〈射手〉)

    關於以上新詩的寫作手法及文意說明何者有誤?'
