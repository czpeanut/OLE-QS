- id: doc_111_桃園_石門_國文_g8s2e1_s5_30
  section: 5
  number: 30
  type: single
  page: 4
  stem: 根據本文的內容，下列選項何者正確？
  options:
  - label: A
    content: 李安用清蒸鱸魚形容電影《推手》，並評價為「很容易入口」。
  - label: B
    content: 三個菜系中，廣東菜清蒸鱸魚的口味比較重。
  - label: C
    content: 李安自認在他拍攝的三部電影中，《飲食男女》的講究程度最高。
  - label: D
    content: 《喜宴》與《飲食男女》兩部電影的成本相同。
  group_stem: 李安用三道中菜形容了他的三部電影：「第一部《推手》比較像廣東菜，清蒸鱸魚。味道還不太曉得，就原汁原味的，放了一點點醬油，清蒸一下，新鮮，把菜的原味給它弄出來，最好的做工。第二部《喜宴》好像是四川菜，豆瓣魚。味道比較重一點，很容易入口。第三部《飲食男女》，我覺得比較像江浙的菜，像紅燒鯽魚。燉的時間比較久一點，然後，烹調的方式、回味的滋味也比較講究一點。」李安自認是直到第三部，才開始有能力去多加講究。起初兩部，因為是非常低的成本，「我把故事講完都不錯了。」
