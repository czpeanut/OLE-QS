  section: 1
  number: 39
  type: single
  page: 3
  stem: 若根據「底食」原則，下列何者為建議消費者可購買的海鮮？
  options:
  - label: A
    content: 鯡魚
  - label: B
    content: 鯊魚
  - label: C
    content: 鮪魚
  - label: D
    content: 旗魚
  group_stem: "*閱讀下列敘述後，回答問題：\n    為保育海洋生態，延緩海洋漁業資源枯竭的速率，生態學者提出購買海鮮時可參考的「底食」原則，建議消費者應購買食物鏈底層（初級或次級消費者）的魚類。因為食物鏈底層的小型魚類，數量較多，繁殖速度快，生態回復的速度較快，資源恢復力強，而大型魚的繁殖速度慢，數量少，容易因過度捕撈而滅絕。\
    \ 減少對大型魚的消費，可以讓海洋生態有喘息的空間。如圖為某海域生態系中的食物網。"
  shared_asset: g1_39_40
