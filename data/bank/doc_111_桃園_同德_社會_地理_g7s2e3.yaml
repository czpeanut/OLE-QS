- id: doc_111_桃園_同德_社會_地理_g7s2e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 台灣的鳳梨這兩年受到中國禁運政策，嚴重影響出口，然而在澳洲台商的努力下，最近成功以海運配送了鳳梨到澳洲，這項創舉不僅節省了運輸成本，還使用了最新的『氣調櫃』技術，讓鳳梨就算經過長途運輸，依然新鮮甜美。請問：關於上述海運、空運兩種交通的比較，何者正確？
  options:
  - label: A
    content: 空運受天候狀況影響小
  - label: B
    content: 海運速度快，但運費相對昂貴
  - label: C
    content: 海運平均載貨量較空運少
  - label: D
    content: 空運適合運送貴重、具時效性的物品。
  tags:
    chapter:
      publisher: 翰林
      book: 七下
