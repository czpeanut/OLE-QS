  stem: 近年來為減少機車排放汙染，大力推廣電動機車以取代燃油機車。目前臺灣電動機車的主要充電方式 以設置交換站為主，相關的電池交換站主要依其人口密度來估算使用者數量，決定設置的密度高低。請問：小趙若騎乘該電動機車進行環島，則前往何處時較可能遇到電力不足，找不到交換站的窘境?
