- id: doc_111_桃園_同德_社會_地理_g7s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 根據統計，桃園市在2022 年2 月人口約有227 萬人，近三年內淨遷入桃園的2 萬多人中，來自雙北的最多，使桃園成為『脫北者』的首選。桃園不但具有空港、高鐵、捷運等便捷交通，更可於二十分鐘內到達大台北都會區，利於通勤者往返。請問:上述現象可能為北部區域帶來何種效益?
  options:
  - label: A
    content: 提高北部海運樞紐地位
  - label: B
    content: 提高北部的自然增加率
  - label: C
    content: 北部都會區規模向外擴大
  - label: D
    content: 舒緩蔣渭水高速公路的行車流量 。
  tags:
    chapter:
      publisher: 翰林
      book: 七下
