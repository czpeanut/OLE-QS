- id: doc_111_桃園_同德_社會_地理_g7s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 關於都市規模大小的理論中，有一個理論叫做『45 分鐘定律』，提出這個理論的學者屈菲爾(J.Trefil)主張都市範圍的大小，取決於通勤者花45 分鐘能抵達的範圍。根據這個理論，可以知道都市規模的大小取決於哪個因素?
  options:
  - label: A
    content: 都市產業的創新
  - label: B
    content: 產業結構類型
  - label: C
    content: 交通的便利性
  - label: D
    content: 勞動人口的多寡。
