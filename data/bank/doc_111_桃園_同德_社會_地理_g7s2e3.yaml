- id: doc_111_桃園_同德_社會_地理_g7s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '2023 年苗栗桐花祭於四月底開跑，每年活動期間都會吸引大量的旅客前往欣賞五月雪，加上周邊的遊樂園也配合辦理入園優惠活動，因此經常造成國道 1 號苗栗路段的嚴重壅塞，於此高公局提醒用路人儘量避開該路段，或避開10:00
    ~17:00 的尖峰時段，以免塞車之苦。請根據右表四人的旅遊計畫判斷，若行車路線都以國道1 號為主，何者遇到該路段交通阻塞的機會最大？


    | | 出發地 | 出發時間 | 目的地 |

    |---|---|---|---|

    | 洛伊德 | 彰化縣 | 06:00 | 新竹城隍廟 |

    | 安妮亞 | 桃園市 | 08:00 | 宜蘭頭城烏石港 |

    | 約兒 | 台中市 | 11:00 | 嘉義阿里山風景區 |

    | 彭德 | 台北市 | 13:00 | 雲林劍湖山樂園 |'
  options:
  - label: A
    content: 洛伊德
  - label: B
    content: 安妮亞
  - label: C
    content: 約兒
  - label: D
    content: 彭德。
