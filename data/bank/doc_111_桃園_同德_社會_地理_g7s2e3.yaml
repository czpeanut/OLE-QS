- id: doc_111_桃園_同德_社會_地理_g7s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 藻礁地形多孔隙的環境是各種魚蝦蟹貝最佳的『海洋生物育嬰房』，小魚小蝦長大游到附近海域，形成了豐富的漁場，該魚場造就了桃園南永安、北竹圍兩個漁港。如此豐富多樣的藻礁生態特色，誠然是最佳的環境教育場地；而潔淨的海岸和豐饒的漁產更是促進了休閒產業的蓬勃發展。請問:上述環境資源若以國土空間規畫的『三軸、海環、離島』架構分類，應隸屬於右圖中的哪個區域?
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
