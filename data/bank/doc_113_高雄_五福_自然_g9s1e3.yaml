- id: doc_113_高雄_五福_自然_g9s1e3_s1_37
  section: 1
  number: 37
  type: single
  page: 7
  stem: 下列有關太陽系的敘述，何者正確？
  options:
  - label: A
    content: 太陽系只不過是宇宙中數百億個星系之一
  - label: B
    content: 太陽系的成員並非皆具有固體的外殼
  - label: C
    content: 太陽、八大行星、小行星和彗星組成的系統稱為銀河系
  - label: D
    content: 太陽系主要的質量集中在8 顆行星
  group_stem: 太陽系的形成和演化始於 46 億年前一個巨型星際分子雲的重力塌縮。太陽系內絕大部分的質量都集中於太陽，其餘部分攤平並形成了一個原行星盤，繼而形成了行星、衛星、隕星和其他小型的太陽系天體系統。這被稱為星雲假說的廣泛接受模型，最早是由
    18 世紀的伊曼紐·斯威登堡、伊曼努爾·康德和拉普拉斯侯爵皮耶-西蒙提出。位於太陽系內側的是四顆較小被稱為類地行星。外側的四顆行星被稱為類木行星，它們都是氣態巨行星，幾乎所有的行星都在靠近黃道平面的軌道上運行。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 地科
      code: 7-1
      title: 宇宙與太陽系
      chapter: 第7章 浩瀚的宇宙
    textbook: 九上地科 7-1 宇宙與太陽系
    labeled_by: ai
