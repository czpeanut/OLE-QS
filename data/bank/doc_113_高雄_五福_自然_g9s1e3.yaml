  - label: D
    content: 密度最小的是海王星
  group_stem: 太陽系的形成和演化始於 46 億年前一個巨型星際分子雲的重力塌縮。太陽系內絕大部分的質量都集中於太陽，其餘部分攤平並形成了一個原行星盤，繼而形成了行星、衛星、隕星和其他小型的太陽系天體系統。這被稱為星雲假說的廣泛接受模型，最早是由
    18 世紀的伊曼紐·斯威登堡、伊曼努爾·康德和拉普拉斯侯爵皮耶-西蒙提出。位於太陽系內側的是四顆較小被稱為類地行星。外側的四顆行星被稱為類木行星，它們都是氣態巨行星，幾乎所有的行星都在靠近黃道平面的軌道上運行。
  tags:
