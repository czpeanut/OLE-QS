    4.5 伏特（三顆電池串聯）接上去，過大的電流可能會讓發光二極體燒毀，所以我們必須在電路上再     聯一個電子零件來降低電流，這個東西就是”電阻”，根據       定律，當電阻加大的時候，電流就會減少，讓發光二極體可以安全的工作。選擇的電阻不同，讓流過發光二極體的電流也不一樣。
