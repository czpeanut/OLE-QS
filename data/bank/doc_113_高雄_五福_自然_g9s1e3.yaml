  stem: 下列對於天文的敘述，何者正確？
  options:
  - label: A
    content: 天文學家觀測到最遠的星系約有一百多億光年，代表我們觀察到這個星系的光，是它約一百多年前發出的
  - label: B
    content: 組成銀河系的星體非常多，約有兩千億顆會自行發光的行星所組成
  - label: C
    content: 組成宇宙的基本單位為星系
  - label: D
    content: 夜空中偶爾可見劃過天際的流星，是因反射太陽光而被我們看到
  tags:
