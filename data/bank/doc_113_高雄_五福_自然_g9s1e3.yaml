  stem: 若以相同規格的礦石檢波器、電池與電阻組裝圖(甲)與圖(乙)兩電路，請依照文中礦石檢波器的特性判斷，兩圖中流經電池的電流何者較大呢？
  options:
  - label: A
    content: 圖(甲)
  - label: B
    content: 圖(乙)
  - label: C
    content: 一樣大
  - label: D
    content: 資訊不足，無法判斷
  group_stem: 直到 1947 年末，美國發明電晶體後，人類才正式開始使用半導體。不過在這之前，人類已經在使用類似半導體的東西，礦石檢波器就是其中的代表。日本從
    1925 年開始放送廣播，最早的收音機使用的是礦石檢波器。檢波器是一種可以接收電磁波，並從中提取出聲音與音樂等資訊訊號的元件。使用天然存在之礦石製作出來的檢波器，就叫做礦石檢波器。如圖所示，檢波器的構造是以金屬製的針碰觸著方鉛礦這種特殊礦石。電流容易從金屬針流向礦石，卻很難從礦石流向金屬針。這種特殊的性質稱為「整流性」，也是半導體的特性。
