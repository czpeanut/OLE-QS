- id: doc_113_台南_民德_國文_g7s2e1_s3_12
  section: 3
  number: 12
  type: single
  page: 2
  stem: 下列有關中國文字的敘述，何者正確？
  options:
  - label: A
    content: 文字經過長時間的演變，非一人所創造，史官倉頡對文字作了整理，並扼要解釋了造字法則的定義
  - label: B
    content: 先有象形、指事、會意、形聲這四種基本造字原則，才有文字的產生
  - label: C
    content: 東漢 許慎所著的說文解字，是中國最早將文字依照部首編排的字典，收錄的字體以楷書為主
  - label: D
    content: 象形字表示具體的「物」，指事字則表示抽象的「事」，會意是會合兩個或兩個以上文字組成新字，形聲字造字方式簡單方便，占漢字總數的百分之九十左右，為漢字的主體。
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 國文
      code: 語文常識(一)
      title: 漢字的結構
      chapter: null
