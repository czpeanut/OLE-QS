  type: single
  page: 3
  stem: "根據文章內容，下列何者最適合作為這篇短文的標題？\n    母親也和鄰居本地婦人們學做了發粿和閩式年糕。碾磨糯米的石磨現在是不常見到了。那從石磨下汩汩流出的白色米漿，被盛放在洗淨的麵粉袋中，紮成飽滿厚實胖鼓鼓的樣子，每每逗引孩子們禁不住去戳弄它們。水分被擠壓以後凝結的白色的米糕，放在大蒸籠裡，底下加上徹夜不熄的熾旺的大火，那香甜的氣味，混雜著炭火的煙氣便日夜瀰漫我們的巷弄。放假無事的孩童，在各處忙碌的大人腳邊鑽竄著，驅之不去，連那因為蒸年糕而時常引發的火警、消防車噹噹趕來的急迫和匆促，也變成心中不可解說的緊張與興奮。"
  options:
  - label: A
