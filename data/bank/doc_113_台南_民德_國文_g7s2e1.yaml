  stem: 「兩隻睏倦的刺蝟，由於寒冷而擁在一起。可因為各自身上都長著刺，於是牠們離開了一段距離，但實在冷得受不了，於是又湊在一起。幾經折騰，兩隻刺蝟終於找到一個合適的距離：既能互相獲得對方的溫暖而又不至於被扎。這就是『刺蝟法則』，主要是指人際交往中的『心理距離效應』。」下列何者最能呼應這段文字中提及的「刺蝟法則」？
