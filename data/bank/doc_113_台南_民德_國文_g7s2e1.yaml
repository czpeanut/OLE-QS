  section: 3
  number: 8
  type: single
  page: 2
  stem: 關於聲音鐘一文的句意說明，下列何者敘述不正確？
  options:
  - label: A
    content: 「時間的推移總是默默地在不知不覺中進行」說明時光流逝總是靜悄悄的，情境與「山中無甲子，寒盡不知年」相同
  - label: B
    content: 「你甚至擔心他是不是太老了，太累了，生病了，以至於不能出來賣了。但就在你懷疑、納悶的時候，那熟悉的聲音也許又出現了。」說明人們的心情隨著小販的出現與否而起伏變化
  - label: C
    content: 「如果你在心裡一遍遍學著，你一定可以聽到跟牛犁歌或丟丟銅仔一樣鮮活有趣的旋律」這句話點出聲音鐘具有民謠韻味及音樂性的特色，且都是宜蘭調的叫賣聲，旋律節奏相似，能打動人心
  - label: D
    content: 「簡直是人間天籟，臺語的瑰寶」，作者認為賣芭樂的老阿伯的叫賣聲中融入了整個民族的情感。
