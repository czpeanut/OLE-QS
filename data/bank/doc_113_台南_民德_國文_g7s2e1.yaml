  group_stem: "滿洲菜多燒煮，漢人菜多羹湯，童而習之，故擅長也。漢請滿人，滿請漢人，各用所長之菜，轉覺入口新鮮，不失邯鄲故步(1)。\n    今人忘其本分，而要格外討好。漢請滿人用滿菜，滿請漢人用漢菜，反致依樣葫蘆，有名無實，畫虎不成反類犬矣。秀才下場(2)，專作自己文字，務極其工，自有遇合。若逢一宗師(3)而摹仿之，逢一主考而摹仿之，則掇(4)皮無真，終身不中矣！\n\
    ──袁枚 隨園食單\n【注釋】(1)不失邯鄲故步：指不失去自己本來的面目。\n        (2)秀才下場：指讀書人進場參加考試。\n        (3)宗師：為眾所尊崇的學者。\n\
