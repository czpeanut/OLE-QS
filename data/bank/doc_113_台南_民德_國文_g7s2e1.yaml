  section: 3
  number: 10
  type: single
  page: 2
  stem: 關於紙船印象一文的句意說明，下列何者敘述正確？
  options:
  - label: A
    content: 「有一些事，卻像夏日的小河、冬天的落葉，像春花，也像秋草，似無所見，又非視而不見──童年的許多細碎事物，大體如此，不去想，什麼都沒有，一旦思想起，便歷歷如繪。」是指童年瑣事像小花、小草般細碎，想要記起來很不容易
  - label: B
    content: 「這種美麗的感情要到年事稍長後才能體會出來。」句中「美麗的感情」是指子女對父母孺慕深情的感念
  - label: C
    content: 文中，作者描述他的母親，儘管心中為著農事而操煩不已，仍能笑臉陪孩子摺紙船，是為了藉此彌補自己童年的遺憾
  - label: D
    content: 「只盼望自己能以母親的心情，為子女摺出一艘艘未必漂亮，但卻堅強的、禁得住風雨的船」，句中「堅強的、禁得住風雨的船」是指期望自己盡力照護子女，也期盼子女能面對未來的考驗。
  lesson_raw:
    title: 紙船印象
    basis: 題目指明「紙船印象一文」
