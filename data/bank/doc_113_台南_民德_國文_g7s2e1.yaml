  stem: 洪醒夫 撐傘印象：「撐一把有形的傘，那是正當的事，因為我們不必在雨中表現異於同類的乖張。但如果撐一把無形的傘，使我們不去面對風雨、面對苦難，那我們永遠無法領略雨過天青的喜悅。」這段話的含義與下列何者最相近？
