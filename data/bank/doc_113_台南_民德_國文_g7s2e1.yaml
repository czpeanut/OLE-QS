  stem: 本文所欲表達的意旨，不包含下列何者？
  options:
  - label: A
    content: 一個不能了解自己的人，談不上了解他人
  - label: B
    content: 每一個努力的今日，成就未來光明的明日
  - label: C
    content: 人們說我做了什麼無妨，要緊是我做了什麼
  - label: D
    content: 習慣，我們每一個人或多或少都是它的奴隸。
