  stem: '老師教完「漢字結構」之後，請學生舉例說明漢字的造字原則：

    | 綵瑜 | 「口、女、蓮、子」都屬合體的文。 |

    | --- | --- |

    | 羿萱 | 「上、下、手、寸」都屬獨體的文。 |

    | 愷昕 | 「解、刀、男、祭」皆屬合體的字。 |

    | 岱瑢 | 「花、森、好、江」皆屬獨體的字。 |

