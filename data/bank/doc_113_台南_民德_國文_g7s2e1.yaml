- id: doc_113_台南_民德_國文_g7s2e1_s4_4
  section: 4
  number: 4
  type: single
  page: 5
  stem: 根據本文，兩處畫雙線文字中，作者所展現的態度差異甚大，其原因最有可能是下列何者？
  options:
  - label: A
    content: 希望藉剝花生之舉討妹妹歡心
  - label: B
    content: 親身體認了花生衣的醫療功效
  - label: C
    content: 一心期盼病重的妹妹能夠好轉
  - label: D
    content: 妹妹所受治療由西醫改為中醫。
  group_stem: "水煮花生，去殼剝皮，半斤花生只得一小碗花生皮。\n花生仁外一層薄膜花生皮，在中醫稱花生衣。花生衣養血補血，具止血之效，科學論點指花生衣有助強化骨髓造血功能，增益血小板數量提升。\n\
    有一小段日子，我託小姑姑每隔幾日在早市購回水煮花生。繞口令說的，吃葡萄不吐葡萄皮，不吃葡萄倒吐葡萄皮；我剝花生不吃花生皮，若暉不吃花生倒吃花生皮。(若暉：作者的妹妹)\n\
    一般人血小板指數十五萬，低於兩萬便會引發自體性出血，腦出血即死，那時若暉的指數已經跌至一萬六。西醫安排固定時間輸血，醫囑定時服用鐵劑或者濃縮棗精。中醫合併照護，每天開立兩包水藥，此外建議以花生衣補血。\n\
    \    換作幾年以前，恐怕我會嗤之以鼻。花生的那一層薄膜欸，當真有效？然而那當下我彷彿沐浴焚香，慎重淨手去殼剝皮，無異敬神儀式。彼時我也真正虔誠敬神。每晚睡前禱告，雙手合十於胸前，黑暗裡我再三呼求耶和華上帝、媽祖娘娘、關聖帝君、藥師如來佛、宇宙大人的名，用盡全副心力向神明祈求說，拜託請讓我妹妹康復起來吧。\n\
    \    隔天日頭上升，世界絲毫未改，我如舊剝著花生衣。\n                                               \
    \               ──楊双子 不吃花生倒吃花生皮"
