  type: single
  page: 2
  stem: '甲乙丙三人在一宗交通意外中受傷了，一生發現他們的腦部運作正常，但為了檢查他們神經系統的其他部位是否受損，醫生進一步測試，結果如下表所示，試問哪一位的「感覺神經元」可能受傷了?


    | 傷者 | 蒙上眼睛所接受的測試 | 測試結果 |

    | :--- | :--- | :--- |

    | 甲 | 以針甲的指尖 | 甲覺得的痛但沒有縮手 |

    | 乙 | 以針刺乙的指尖 | 乙不覺得痛亦沒有縮手 |

    | 乙 | 命令乙移動他的手 | 乙可以移動他的手 |

    | 丙 | 以針刺丙的指尖 | 丙立刻縮手，但完全不知道有針刺及縮手的情況發生 |

    | 丙 | 命令丙移動他的手 | 丙不能移動他的手 |'
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 乙、丙皆有受傷。
