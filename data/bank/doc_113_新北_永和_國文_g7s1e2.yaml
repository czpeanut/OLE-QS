- id: doc_113_新北_永和_國文_g7s1e2_s6_32
  section: 6
  number: 32
  type: single
  page: 5
  stem: 下列敘述何者最符合本文的主旨？
  options:
  - label: A
    content: 懂得生命真諦的人，可使生命品質更豐美
  - label: B
    content: 在生命的困境中，最能看出一個人的氣節
  - label: C
    content: 人生的最高理想是為人民謀利益，為社會謀福祉
  - label: D
    content: 人生應如蠟燭，從頂部燃燒到底，始終保持光明。
  group_stem: "日本動漫電影《鬼滅之刃無限列車》創下極高票房，令人嘖嘖稱奇！\n    主角炎柱，是一位熱血青年，從小立志當劍士。父親對他的志向嗤之以鼻，認為當個劍士毫無意義；但是母親卻鼓勵他，要他做為一個強壯的人，去幫助保護弱小者，後來他果真成為濟弱扶貧、保護弱小的鬼殺隊隊員，最後甚至為了保護列車民眾，與鬼戰鬥至死。\n\
    \    所謂「無限列車」其實是一輛被鬼魅控制的列車，這隻鬼具有操縱人類夢境能力，它讓所有人深陷美好夢境的虛幻中，無法自拔！許多人選擇醉生夢死，而不願去面對真實的人生；主角卻要不斷地去揮砍夢境，想要回到真實的世界。\n\
    \    真實世界就是一場悲劇，是「在有限的人生中，去做無限的追尋」，這就是人和鬼最大的不同。鬼在無限之中，不再有生老病死，但是人卻會經歷老去和死亡的痛苦。正如炎柱所說的：「老去或是死亡，都是人類這種短暫生物的美。」\n\
    \    我們的人生就像是一列「無限列車」，很多人在其中醉生夢死，但是新冠病毒疫情打醒了許多人，驚覺原來人生是有限的，死神隨時就會出現在我們旁邊。不論何人，我們都無法證明自己可以逃過這個浩劫，所以只好誠實地面對自己的人生，在生命氣息存留之際，努力去尋求其中的意義與價值。\n\
    (改寫自李清志 鬼滅列車的人生)"
