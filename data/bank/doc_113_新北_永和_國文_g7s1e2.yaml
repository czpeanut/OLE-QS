  group_stem: '孫叔敖為嬰兒之時，出游，見兩頭蛇，殺而埋之。歸而泣，其母問其故，叔敖對曰：「吾聞見兩頭之蛇者死，嚮者（１）吾見之，恐去母而死也。」其母曰：「蛇今安在？」曰：「恐他人又見，殺而埋之矣。」其母曰：「吾聞有陰德（２）者，天報以福，汝不死也。」及長，為楚令尹（３），未治，而國人信其仁也。

