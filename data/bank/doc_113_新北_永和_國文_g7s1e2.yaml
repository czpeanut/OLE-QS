    content: 會讓協調睡眠週期的SCN 產生壞的影響。
  group_stem: "自2007年iPhone面世後，手機在這短短的13年已經澈底改變了人類的生活模式。現在我們每天都手機不離手，連睡覺前都一定要在床上被窩裡玩個15、20分鐘手機才捨得去睡。基本上我們有很多人都已經手機成癮，無聊時你會下意識地拿起手機滑一下、睡覺前不玩一玩就不舒服，其實這樣都已經是上癮的信號。手機就像毒癮一樣，沒有它時，你會焦躁，你要靠它舒緩壓力。\n\
    \  除了會上癮外，手機或其他電子屏幕為了使顏色更加亮麗，這些屏幕會發出大量短波長的光。短波長即高頻率的光，由於我們的視覺神經系統會將短波長的光感知為主觀上的「藍色」，所以一般我們會統稱這些短波長、高頻率的光叫「藍光」。\n\
    \  藍光除了傷眼之外，它還有機會影響人類的睡眠規律，也就是我們常說的生理時鐘。人類的生理時鐘由大腦內一個叫視交叉上核(SCN)的部位調節。SCN根據視網膜接受到的光資訊(例如光強度等)，會協調大腦的松果體適當地釋出安眠物質褪黑素去調節入睡時間。\n\
    \  在自然環境下，晚上的光會變得非常微弱，SCN感受到光度弱時，會讓大腦知道這是晚間的時間，配合內置的生理時鐘計算系統，會知道這是你睡眠的時間，這時它會和松果體互動，讓松果體釋放出一種讓你昏昏欲睡的荷爾蒙褪黑素。\n\
    \  即使在工業革命後，我們所處的地球發生了很大變化，夜間不再是漆黑一片，但是在電子屏幕氾濫的時代之前，地球上幾乎是沒有人造藍光光源的，唯一的藍光光源就是來自太陽的自然光，所以在演化的角度上，對大腦來說，藍光的出現代表著日照時間。但在2020年的今天，人造藍光光源在你的身邊實在多不勝數，你的手機、平板電腦等，無時無刻不在釋放出藍光。藍光對會讓調節睡眠週期的SCN產生壞的影響，讓它不能準確地分辨白晝或夜晚。SCN會開始搞不清楚什麼時候是日間，什麼時候是晚上，導致我們的生理時鐘及睡眠規律紊亂，影響我們的作息、精神及健康。\n\
    \   所以，夜間盡量少玩手機，讓大腦知道它正在處於夜間時間。讓自己好好地睡覺，好好地努力工作，好好地生活。\n                     \
    \                            (關鍵評論—藍光是什麼？它如何影響我們的睡眠機制？)"
