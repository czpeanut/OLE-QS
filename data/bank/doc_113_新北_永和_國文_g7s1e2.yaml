  section: 6
  number: 29
  type: single
  page: 4
  stem: 有關上圖的說明，下列選項何者正確？
  options:
  - label: A
    content: 烹調雞蛋前，可藉由再次清洗來確認是否新鮮
  - label: B
    content: 雞蛋買回後若有髒汙，務必用清水洗淨後保存
  - label: C
    content: 挑選雞蛋時，盡量挑選大顆雞蛋，品質較新鮮
  - label: D
    content: 購買雞蛋時，外表愈平滑的雞蛋，營養價值更高。
  group_stem: "市面上的雞蛋大致可分為洗選或非洗選蛋，兩者各有優缺點。首先要先了解，蛋殼有氣孔和薄膜，蛋雞下蛋後，薄膜會迅速包覆氣孔，阻止外界異物、病菌進入蛋中，不過在蛋雞生蛋過程中，不免沾附糞便和各種致病的細菌，例如沙門氏菌。\n\
    \    洗選的用意是把蛋殼表面的髒汙和病菌洗乾淨，相對地也會把保護膜清洗掉，使蛋容易變質，因此需要冷藏保存；而傳統市場中看到的散裝蛋，大都是非洗選蛋，因此有時可以看到雞蛋表面沾染羽毛或異物。\n\
    \    一位畜產專家表示，蛋要吃得安全，建議購買冷藏的洗選蛋，並在上面標示的有效期限內吃完；中興大學食品暨應用生物科技學系特聘教授謝昌衛也表示，如果有CAS\
    \ 認證的洗選場、生產履歷或有溯源系統的蛋品就更理想。\n    不過無論是冷藏盒裝蛋或是散裝蛋，買回家後都要冷藏。功能醫學營養師呂美寶表示，冷藏蛋不要放在冰箱門而是要放在層架上，才不會因為開關冰箱時溫度升高而增加腐壞機會，買回家的蛋建議二週內吃完，而散裝蛋無法確切知道生產日期，因此最好一週內就吃完。\n\
    \                                 (文章節選自康健---進口過期蛋爭議延燒!民眾如何自保?專家建議買這種蛋)\n\n###\
    \ 挑選及保存雞蛋四步驟\n\n| 步驟一：洗選蛋或散裝蛋？ | 步驟三：良好的保存環境 |\n| :--- | :--- |\n| 散裝蛋：有天然溶菌酶的保護，保存時間較長。<br>洗選蛋：透過水洗與分級處理，保存時間較短。\
    \ | 散裝蛋：可能還有髒汙、雞糞，建議擦拭外殼後再保存。<br>洗選蛋：不需要再次清洗，可直接尖端朝下放入冰箱。 |\n\n| 步驟二：看外觀挑選 | 步驟四：烹調前再次洗蛋\
    \ |\n| :--- | :--- |\n| 大小顆：兩種都可以選。<br>蛋殼：外表摸起來厚實、粗粗的。<br>重量：有厚實、沉重感。 | 除了清洗，也可以觀察雞蛋新鮮度：<br>雞蛋沉入水裡\
    \ $\\longrightarrow$ 新鮮<br>雞蛋浮起水面 $\\longrightarrow$ 已放一段時間 |"
