    \ 認證的洗選場、生產履歷或有溯源系統的蛋品就更理想。\n    不過無論是冷藏盒裝蛋或是散裝蛋，買回家後都要冷藏。功能醫學營養師呂美寶表示，冷藏蛋不要放在冰箱門而是要放在層架上，才不會因為開關冰箱時溫度升高而增加腐壞機會，買回家的蛋建議二週內吃完，而散裝蛋無法確切知道生產日期，因此最好一週內就吃完。\n\
    \                                 (文章節選自康健---進口過期蛋爭議延燒!民眾如何自保?專家建議買這種蛋)\n\n###\
    \ 挑選及保存雞蛋四步驟\n\n| 步驟一：洗選蛋或散裝蛋？ | 步驟三：良好的保存環境 |\n| :--- | :--- |\n| 散裝蛋：有天然溶菌酶的保護，保存時間較長。<br>洗選蛋：透過水洗與分級處理，保存時間較短。\
    \ | 散裝蛋：可能還有髒汙、雞糞，建議擦拭外殼後再保存。<br>洗選蛋：不需要再次清洗，可直接尖端朝下放入冰箱。 |\n\n| 步驟二：看外觀挑選 | 步驟四：烹調前再次洗蛋\
    \ |\n| :--- | :--- |\n| 大小顆：兩種都可以選。<br>蛋殼：外表摸起來厚實、粗粗的。<br>重量：有厚實、沉重感。 | 除了清洗，也可以觀察雞蛋新鮮度：<br>雞蛋沉入水裡\
    \ $\\longrightarrow$ 新鮮<br>雞蛋浮起水面 $\\longrightarrow$ 已放一段時間 |"
