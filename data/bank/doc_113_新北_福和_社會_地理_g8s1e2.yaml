- id: doc_113_新北_福和_社會_地理_g8s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 西元2010 年後，珠江三角洲地區的在地電子業上下游及周邊相關產業在政府的大力扶植本土廠商下，企圖將原本需要從國外進口的零件，轉為在國內生產，讓製造過程的上、中、下游串起一條完整的在地供應鏈，稱為「紅色供應鏈」。下列哪個選項不太可能為珠江三角洲的發展優勢？
  options:
  - label: A
    content: 達到產業升級
  - label: B
    content: 注重原料區位
  - label: C
    content: 變成製造強國
  - label: D
    content: 擁有廣大市場。
