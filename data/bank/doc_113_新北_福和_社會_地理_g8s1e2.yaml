- id: doc_113_新北_福和_社會_地理_g8s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 根據地理老師訪問來自中國的小莊，發現他們村裡的女方在婚嫁上對男方的要求愈來愈嚴苛，女生希望對方是獨子、有錢並且父母年輕健在，若是獨子和父母都年輕健在的話，父母還能工作，賺到的錢以後都歸兒子，還能幫忙帶孩子；而另外一個現象：『一家有女百家求』，婚姻的買賣性質浮出檯面，女方父母對男方要求高額彩禮，變相的婚姻牟利就此助長。請問：文中凸顯出中國面臨何種問題？
  options:
  - label: A
    content: 人口結構失衡
  - label: B
    content: 人口總數龐大
  - label: C
    content: 經濟發展過快
  - label: D
    content: 人口倍時縮短。
  tags:
    chapter:
      publisher: 康軒
      book: 八上
      subject: 地理
      code: 2-2
      title: 中國如何解決人口問題？
      chapter: null
