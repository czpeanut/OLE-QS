- id: doc_113_新北_福和_社會_地理_g8s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 中國共有55 個民族，語言、習俗與生活型態各具特色，少數民族雖然僅佔中國人口的9%左右，但族系眾多且分佈廣泛。其中〇〇為中國五大少數民族之一，主要分布在中國西南部，在三月會舉辦螞𧊅節，又稱蛙婆節，是一種民間祭祀性的節慶活動。在春節期間舉行請蛙婆、唱蛙婆、孝蛙婆與葬蛙婆的活動，青年男女藉此進行對歌的社交活動，活動最後將去年埋的青蛙棺材挖出，以青蛙骨頭的顏色判斷今年的氣候與收成，然後再把新的青蛙埋葬，整個活動結束後全村分食祭品，以祈求風調雨順、收成順利。請問：下列有關此少數民族的分布敘述，何者正確？
  options:
  - label: A
    content: 這個民族是維吾爾族，主要分布於乾燥地區
  - label: B
    content: 這個民族是壯族，主要分布於四川盆地
  - label: C
    content: 〇〇的所在地區因地形阻隔，族群複雜多元
  - label: D
    content: 〇〇為中國人數最多的少數民族，主要分布在中部經濟帶。
  tags:
    chapter:
      publisher: null
      book: 八上
      subject: 社會
      code: null
      title: null
      chapter: null
    textbook: 八上 第2次段考範圍
    labeled_by: ai
- id: doc_113_新北_福和_社會_地理_g8s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 中國沙塵暴天氣發生的越來越頻繁，黃沙漫漫引起民眾不滿，有民眾質疑中國當局投入的治沙資金都到哪裡去，許多網友紛紛在社群平台苦中作樂，表示『戴口罩也遮不住吃土感』、『不小心淋到雨就像剛出土的兵馬俑』等，「北京沙塵暴」話題更登上了微博熱搜榜。關於中國沙塵暴影響最嚴重的時間及發生的原因，下列何者敘述錯誤？
  options:
  - label: A
    content: 秋末冬初降水量少
  - label: B
    content: 乾燥地區過度開墾
  - label: C
    content: 地表裸露缺乏植被
  - label: D
    content: 全球暖化氣候變遷。
  group_stem: 根據新聞報導，中國中央氣象局發布沙塵暴「藍色預警」，在北京也因為空氣污染嚴重，發布了大風和沙塵暴「黃色預警」，因爲從地面上的光線看上去總體顏色偏藍，因此能在北京的天空看見「藍太陽」景象。不僅只有中國，沙塵暴也正向附近國家蔓延，嚴重影響周圍國家的空氣品質，引起民眾反彈。依上文與圖中的內容回答10-11
