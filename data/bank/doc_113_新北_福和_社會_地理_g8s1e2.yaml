  stem: '同學們根據老師上課介紹的政策進行重點歸納，請問：有關「一帶一路」的敘述，下列哪些同學說的是正確的？

    勝強：包括「絲綢之路經濟帶」與「21世紀海上絲綢之路」兩條路線

    安迪：「絲綢之路經濟帶」由福州出發，途經中亞後最終通往歐洲

    耀武：參與國大部分是經濟發展較佳的國家與中國合作影響世界經濟

    進輝：「21世紀海上絲綢之路」主要連結太平洋與印度洋的海運網絡'
  options:
  - label: A
    content: 勝強和耀武
  - label: B
    content: 安迪和進輝
  - label: C
    content: 耀武和進輝
  - label: D
    content: 勝強和進輝。
  group_stem: 在2013 年中國國家主席習近平開始推動全球規模最大「一帶一路」的經濟政策。中國藉由參與沿線國家的交通、通訊及能源等基礎設施的建設，取得穩定的能源供給，並消化國內過剩的工業生產能量，維持工業發展，同時擴大貿易市場，並開拓全球經濟戰略布局，圖(六)為「一帶一路」計畫路線圖。依上文與圖中的內容回答第15～17
