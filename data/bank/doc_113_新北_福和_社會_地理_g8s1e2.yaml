  section: 1
  number: 4
  type: single
  page: 1
  stem: 21 世紀初期中國成立自由貿易試驗區，簡稱『自貿區』，在主權國家或地區的境內，畫出特定區域，准許外國商品豁免關稅自由進出。自2013 年最先設立的上海自貿區到現在，從沿海到內陸，從國土邊緣到海島，共成立22
    個自貿區，其中又以上海發展的最好。請問：下列哪個選項為上海自貿區獨特的優勢？
  options:
  - label: A
    content: 礦產豐富帶動工業發展
  - label: B
    content: 勞力資源充足且農業發達
  - label: C
    content: 基礎建設完善並鄰近港澳
  - label: D
    content: 位置優越並擁有廣大腹地。
