  section: 1
  number: 1
  type: single
  page: 1
  stem: 在18 世紀時，一艘外國船隻因為遇上颱風，而漂流至中國東南沿海，乘客阿里幸運獲救後與當地人聊天發現這個地方的人口常往海外移出，最可能跟下列哪個環境特色有關？
  options:
  - label: A
    content: 位處缺水區，環境負載力低
  - label: B
    content: 缺乏礦產資源，生產效率不佳
  - label: C
    content: 缺乏基礎建設，工商業發展緩慢
  - label: D
    content: 山多平原少，糧食生產不足。
