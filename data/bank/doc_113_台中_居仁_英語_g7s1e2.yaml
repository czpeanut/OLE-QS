  stem: 16. What is NOT something people do during Moon Festival?
  options:
  - label: A
    content: They give gifts to each other.
  - label: B
    content: They look at the full moon.
  - label: C
    content: They enjoy mooncakes.
  - label: D
    content: They gather with their family.
  group_stem: 'II. (From ABC Magazine)

    Moon Festival is a big holiday in many Asian countries. It happens in the middle
    of autumn, so it’s also called Mid-Autumn Festival. During Moon Festival, people
    gather with their family and friends. They enjoy good food, eat mooncakes, and
    look at the full moon. Here are some interesting facts in other countries.

    In Cambodia, Moon Festival is in November. It lasts over three days, and there
    is a big boat race in the first two days. In South Korea, people wear traditional
    clothes and go back home. Together with their family, they have a special service
    for their ancestors. In Vietnam, Moon Festival is a mix of Halloween and Thanksgiving.
    Kids walk in the streets with lanterns and sing all kinds of festival songs.'
  ai_answers:
    gemini: A
    qwen: A
  answer:
  - A
