- id: doc_113_高雄_左營_英語_g8s1e2_s4_39
  section: 4
  number: 39
  type: single
  page: 4
  stem: (    ) 39. What does "pear" mean in the article?
  options:
  - label: A
    content: '"Pear" means two things that are different.'
  - label: B
    content: '"Pear" means a kind of fruit you can eat.'
  - label: C
    content: '"Pear" is a white powder for baking.'
  - label: D
    content: '"Pear" is a colorful and pretty plant that smells nice.'
  group_stem: 'Homophones are words that sound the same but have different meanings
    and spellings. They can be confusing! Let’s look at the two examples of the homophones:
    "pair" and "pear," and "flour" and "flower."

    First, a "pair" means two things that are the same, like a pair of shoes. For
    example, you can say, "I bought a new pair of sneakers." A "pear" is a kind of
    fruit, like when you say, "I like to eat a pear." These two words sound the same
    but mean different things!

    Another example is "flour" and "flower." "Flour" is a white powder for making
    bread and cakes. You can say, "I need flour to make a cake." A "flower" is a colorful
    part of a plant, like in the sentence, "There are many flowers in the garden."
    These two words also sound the same, but they have different meanings.

    Homophones can make English difficult for learners. They appear in poems and songs,
    but they are also common in everyday conversations, jokes, ads, and writing. If
    you are not careful, you may trip up and use the wrong word. Homophones show how
    important it is to listen to the words around us, and knowing the context helps
    you pick the right word. By learning these words, you can speak and write English
    more clearly!


     confusing 困惑的 sneakers 運動鞋 powder 粉末 appear 出現 common 普遍的 poem 詩 context 上下文'
