  type: single
  page: 5
  stem: (    ) 43. What is the main idea of this reading?
  options:
  - label: A
    content: The article introduces Leo and Edward.
  - label: B
    content: The article tells us how to make money.
  - label: C
    content: The article says it is good to work hard.
  - label: D
    content: The article shows two different ways of parenting.
  group_stem: 'There are different kinds of parenting around the world. Parents use
    different ways to help their kids grow. One way is the conservative style. It
    is common in many Asian countries. For example, Leo''s parents work hard to raise
    him. They want to buy land and many other things. They plan everything for Leo
    and his brothers and sisters, even their weddings. They give all their land to
    their kids. Leo’s parents want him to take care of them when they are old because
    they worked hard for the land.

    Another way is in Edward''s family. His parents come from a Middle-Eastern country.
    They work hard for money and love to travel. They often take Edward with them
    on trips. They do not save any money for him. When Edward turns eighteen, he will
    leave home. They want him to choose the sports he likes and make his own choices.
