  page: 5
  stem: (    ) 47. Why did Marie Curie move to Paris?
  options:
  - label: A
    content: Marie Curie moved to Paris because she wanted to visit her relatives.
  - label: B
    content: Marie Curie moved to Paris to look for a new job.
  - label: C
    content: Marie Curie moved to Paris to study at a university.
  - label: D
    content: Marie Curie moved to Paris to learn new languages and cultures.
  group_stem: 'Marie Curie was born in Poland. She loved science from a young age.
    She went to Paris to study at a university. There, she met her future husband,
    Pierre Curie. They worked together on their science studies.

    Marie Curie made important discoveries. She and her husband found two new elements:
    polonium and radium. Their work helped people understand radioactivity. Marie
    became well-known for her important discoveries.

    In 1903, Marie won her first Nobel Prize in Physics. She shared the prize with
    her husband, Pierre, and another scientist. Later, in 1911, she won a second Nobel
    Prize in Chemistry. She was the first person to win Nobel Prizes in two different
    fields.

    Marie Curie’s work is very important to science and medicine. She used her knowledge
    to help treat cancer with radiation. Her hard work and her love for science inspire
    many people. Her story shows that hard work can lead to great success.


     discoveries 發現 element 元素 polonium 鈽（化學元素） radium 鐳（化學元素） radioactivity 放射線
