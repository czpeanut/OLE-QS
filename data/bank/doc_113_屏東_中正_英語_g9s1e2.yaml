- id: doc_113_屏東_中正_英語_g9s1e2_s6_7
  section: 6
  number: 7
  type: single
  page: 4
  stem: About the saturated fat content, which is true?  content 含量
  options:
  - label: A
    content: Vegetable oil > Coconut oil.
  - label: B
    content: Canola oil > Vegetable oil.
  - label: C
    content: Canola oil < Coconut oil.
  - label: D
    content: Coconut oil < Olive oil.
  group_stem: 'Good Friends in the Kitchen-Cooking Oils

    | Olive oil | Olive oil is one of the most popular cooking oils. It comes from
    the olive fruit. It is believed to be the healthiest because it can help lower
    LDL(低密度脂蛋白膽固醇),"bad"cholesterol and increase HDL (高密度脂蛋白膽固醇),"good"cholesterol.
    Olive oil''s medium smoke point allows it to do a good job in cooking, baking,
    and roasting. However, if you want to deep-fry something, olive oil might not
    be a good choice. |

    | Coconut oil | Coconut oil is made from coconut meat. It is great for baking.
    However, different from olive oil, coconut oil is hard to use in cold dishes.
    It is important to note that coconut oil is 80 ~ 90% saturated fat. Because of
    that, the oil has been shown to increase LDL, "bad" cholesterol. When cooking
    with coconut oil, we need to be careful of how much we use. |

    | Vegetable oil | Vegetable oil is made from different oils, and usually there
    is soybean oil. It is light and doesn''t change the taste of our dish. What''s
    more, its high smoke point (up to 450"F) makes it great for cooking, frying, and
    baking. Although this oil is low in saturated fat, it is high in omega-6 fats,
    which may lead to health problems if we take in too much. |

    | Canola oil | Canola oil comes from the seeds of the canola plant. It can be
    seen as a kind of vegetable oil, and people started to use it in Canada in the
    1970s. It usually has less fat than other cooking oils, and it only has 7% saturated
    fat, which is the least of any plant oil, Canola oil also has a high smoke point
    (up to 400''F), so it is easy to use in different kinds of high-heat cooking ways.
    |

     lower 降低 cholesterol 膽固醇 increase 提高 roast 燒烤 saturated 飽和的 soybean 大豆'
