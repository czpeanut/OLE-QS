  section: 6
  number: 4
  type: single
  page: 3
  stem: What can you learn about the Navajo and their language?
  options:
  - label: A
    content: Navajo has only ever been a spoken language.
  - label: B
    content: They have given up their chance to live in the US.
  - label: C
    content: Navajo is among the most used Native American languages.
  - label: D
    content: Their language has been spoken in Japan since World War II.
  group_stem: 'Do you know what language the Navajo speak? They speak Navajo! It is
    one of the most spoken languages among all the many Native American languages.
    There are now around 200,000 speakers in the US.

    In the past, Navajo was still not a written language, so it was not known by many
    people outside of the Navajo Nation. That made it the perfect choice to be used
    as a code during World War II. Besides, there was a special group of Navajos called
    code talkers. They created and sent coded messages of important plans for the
    US. The Japanese couldn''t decipher what the messages were about. In fact, they
    were never able to break the code.

    In 2002, a story about these Navajos hit the big screen. The movie was called
    Windtalkers, and it showed how two Navajo code talkers helped the US successfully
    defeat Japan.


    ※ The Navajo are a group of Native American people. Most of them live in the southwestern
    United States. They are one of the largest tribes in the US.

     Native American 美洲原住民 Nation 保護區:保留地 World War II 第二次世界大戦

     code 密碼 coded 用密碼書寫的 defeat 擊敗 southwestern 西南的 tribe 部落'
  tags:
    textbook: 第五冊（九上）第2次段考範圍
