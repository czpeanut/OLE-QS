- id: doc_113_屏東_中正_英語_g9s1e2_s6_1
  section: 6
  number: 1
  type: single
  page: 2
  stem: What is the main idea of the reading?
  options:
  - label: A
    content: Taiwan has built many new incinerators to handle waste.
  - label: B
    content: 'The amount of waste in Taiwan has decreased in recent years.

       decrease 減少'
  - label: C
    content: The villlage head in Xinfeng is working to clean up the garbage mountain.
  - label: D
    content: Taiwan is facing a serious waste problem with growing "garbage mountains."
  group_stem: 'How Much Trash Does Taiwan Create?

    Taiwan is creating more and more trash. Over the past five years, the amount of
    trash has grown by 7%, reaching 32.19 million tons last year. However, not all
    of this trash is burned in incinerators. Each year, about 20% of Taiwan''s trash
    cannot be processed and ends up in piles called "garbage mountains."

    The biggest trash pile is in Xinfeng, Hsinchu County. Zeng Fu, the village head,
    says that every spring, strong winds spread a terrible smell from the trash mountain,
    making people close their windows and doors.

    This problem is not just in Xinfeng; it is happening all over Taiwan. Since the
    pandemic, trash from food deliveries and online shopping has increased, filling
    up the incinerators. The cities with the fastest-growing amounts of trash are
    Hsinchu, Taipei, and Pingtung. Many of Taiwan''s 25 incinerators are old, with
    over half being over 20 years old. Because of this, they break down often and
    cannot handle as much trash.

    With few options, places without incinerators, like Hsinchu County, are piling
    up trash, making more "garbage mountains." By June, Taiwan had 732,000 tons of
    waste waiting to be processed, forming 48 trash piles. Taiwan urgently needs to
    find better ways to manage and reduce its trash.

     ton 噸 incinerator 焚化爐 process 處理 piles 堆 handle 處理 option 選擇'
