    $\square$ 和 $\diamondsuit$ 中該填入什麼物質。

    而另外一邊的<u>敏諺</u>、<u>敏折</u>、<u>子旗</u>和<u>品軒</u>正嘗試著寫出呼吸作用的化學反應式，嘗試了許久未果，但一看到光合作用的反應式，立刻恍然大悟，四人寫下各自想出的反應式。'
