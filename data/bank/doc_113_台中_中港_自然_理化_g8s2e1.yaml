  stem: <u>睿裙</u>等人將“光合作用”的反應式交給老師，老吳老師看了看並提出問題，以下四人的解釋何者正確？
  options:
  - label: A
    content: <u>睿裙</u>說：$\square$ 裡面應存在C元素，化學反應式才合理
  - label: B
    content: <u>芷芸</u>說：化學反應式表示光合作用必須要有太陽光，所以將植物放在日光燈下是不會進行光合作用的
  - label: C
    content: <u>一嫻</u>說：光合作用進行時，吸收太陽光的能量，如果沒有光就不能進行光合作用，屬於放熱反應
  - label: D
    content: <u>宥禎</u>說：箭頭兩邊都有 $H_{2}O$，是我們記錯了，水並沒有參與反應，所以應該把 $H_{2}O$ 都去掉
  group_stem: '請根據以下閱讀，回答31～34題：

    一群國二學生在上氧化還原反應後，討論起曾經學過綠色植物的光合作用與呼吸作用，就是葉綠素利用氣氣、水份、二氧化碳與葡萄糖間的相互轉換進行生長代謝。

