  section: 3
  number: 25
  type: single
  page: 5
  stem: Which is Not true about Uluru?
  options:
  - label: A
    content: It’s able to be climbed on now.
  - label: B
    content: It has a lot of history and culture.
  - label: C
    content: It’s hard to miss its color.
  - label: D
    content: It’s in the center of Australia.
  group_stem: 'C.

    Uluru: More Than Just a Rock

    One of Australia’s most famous landmarks is Uluru. It’s a giant rock in the middle
    of the country. It’s rich in culture, history, and magic. Uluru is 348 meter high,
    almost four kilometers long, and more than two kilometers wide. Uluru’s size makes
    it hard to miss. Another thing is its color. The red rock changes color with the
    sun. It can appear yellow, orange, pink, and more.

    Uluru is very important to Aboriginal Australians. They believe their ancestors
    created the rock and the land around it. They also believe Uluru is alive and
    home to their ancestors spirits.

    In the 1930s, visitors started coming to Uluru. Soon, it became a popular spot
    which attracts almost every visitor to Australia. Shortly after, many visitors
    climbed up the rock, and that made the aboriginal people sad and angry. However,
    their pain is now over. In October 2019, Australia put a new rule in place. Visitors
    couldn’t climb Uluru anymore. That’s good for Aboriginal Australians and for Uluru.

    Resource from ABC Magazine March 2023


    The Moai on Easter Island

    Rapa Nui, or Easter Island, is 2,200 miles away from Chile in the Pacific Ocean.
    Although it is not easy to reach, the famous and mysterious moai on this faraway
    island have made it one of the most popular World Heritage Sites.

    There are around 1,000 moai dotting the island. They were made by the people of
    Rapa Nui between 1400 and 1650 A.D. We are not sure why the Rapa Nui built the
    moai. Some people believe that they were built to honor the islanders’ ancestors
    or other important people. Most moai face the center of the island. The Rapa Nui
    believe that moai watch over and protect them.

    Every year, the moai draw around 100,000 people to this island. This is good for
    business, but it also brings some problems. Some tourists know little about the
    Rapa Nui, and they do not show respect to them. For example, people take photos
    in which it looks like they are picking a moai’s nose. On top of that, some tourists
    have climbed on the statues and even damaged them.

    That''s why the islanders get very angry with those tourists that do not respect
    their cultural heritage.

    Traveling to Easter Island lets tourists enjoy many wonderful experiences. However,
    everyone needs to understand that they are guests. So, it is important to respect
    the local culture. If everyone can do this, they get to enjoy their trips without
    making trouble for the locals. Resource from Nanyi B6 L3 Reading'
