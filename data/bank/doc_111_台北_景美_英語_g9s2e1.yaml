  options:
  - label: A
    content: '2001'
  - label: B
    content: '2023'
  - label: C
    content: '2024'
  - label: D
    content: 34 years ago
  group_stem: 'B.

    “LIGHT UP THE FUTURE”: 2023 Taiwan Lantern Festival in Taipei


    The Taiwan Lantern Festival is a celebration of blessings that has been held for
    34 years during the Lunar New Year. The full moon carries ours hopes and dreams
    for the future. Since 2001, the Taiwan Lantern Festival has been held in different
    cities across Taiwan, and it is returning to Taipei after 23 years, where it was
    first held.

    After experiencing the challenges caused from COVID-19, we have begun to learn
    to live with the virus and started to reconnect with the world at our own pace.

    This is the first large-scale international event after the end of the epidemic.
    For the first time, the “urban” lantern festival will be held in the Taipei metropolitan
    area. With the theme of "LIGHT UP THE FUTURE", 12 administrative districts are
    connected in series, among which 4 major exhibition areas are set up, and more
    than 300 works are exhibited. The works integrate the Taiwan Lantern Festival
    with the city.

    The main lantern of the 2023 Taiwan Lantern Festival is a 22-meter-high rabbit-themed
    lantern. The main light show displays the work through a 360-degree turntable,
    providing a new and different experience to the visitors.

    The four major exhibition areas are:

    “Beacons of Light Display Zone” is in the commercial area in east district, “Fount
    of Light Display Zone” is in Songshan Cultural and Creative Park, and “Lights
    of the Future Display Zone” is in the business district of Xinyi District. “Central
    Display Zone” spans the National Dr. Sun Yat-sen Memorial Hall (north zone) and
    Taipei City Hall Square (south zone), where the main light is set.

    The 2023 Taiwan Lantern Festival came to an end on February 19. During the Lantern
    Festival, more than 12 million people visited, breaking the previous record. The
    next 2024 Taiwan Lantern Festival will be held in Tainan. Are you looking forward
    to it like I am? Resource from Kang Shan Reading Materials


     Songshan Cultural and Creative Park 松山文創園區

    National Dr. Sun Yat-sen Memorial Hall 國父紀念館

    Taipei City Hall Square 台北市政府廣場

    blessing 祝福 scale 尺度；等級 epidemic (疾病的) 流行，傳染

    urban 城市的 metropolitan 大都市的 exhibit 展覽；展示

    integrate (使) 成為一體 turntable 轉盤 span 橫跨'
