- id: doc_112_彰化_埤頭_國文_g9s2e2_s2_40
  section: 2
  number: 40
  type: single
  page: 3
  stem: 下列四個人的做法，何者最接近本實驗的傳遞原則？
  options:
  - label: A
    content: 小萱搬進小瑩，僅知她家住臺東，於是將情書寄給不認識的郵政局長，請他指派下屬送達
  - label: B
    content: 小愷為了祈福，寄出「轉發越多，幸運越多」的電子郵件給親朋好友，並鼓勵大家轉寄
  - label: C
    content: 小岩想發結婚喜帖給久未謀面的朋友岱紜，於是寄給與岱紜比鄰而居的靚玟，請她轉交
  - label: D
    content: 源源親筆寫信給只聞其名的某作家，並寄給任職出版社的朋友，請他設法將信轉寄該作家。
  group_stem: '(四)

    　　1970年，哈佛大學社會關係實驗室設計一項傳遞實驗，傳遞的原則是:某甲要傳遞一封信給一個不相識的人某乙，但甲只能把信寄給自己認識又可能認識乙的某位朋友;這位朋友若與乙相識，就將信轉寄給乙，否則就再依照相同的原則將信寄出。經過蜿蜒曲折的旅程，信平安到達乙手中後，研究人員再統計中間經過的人數。

    　　結果發現，最短的旅程只經過兩個人就達到對方手裡，最長則需要十個人，平均寄信直到收到信聯絡線是五到六個人。有些中途失蹤的信，根據調查，它往往只離收信者幾百步遠，使得邁入的人並不一定在我們的「相識圈」內。由於平均每兩個不相識的人要經過六次轉信，所以稱這個實驗為「六度分離」。從這個實驗可以知道，人與人之間都有一條看不見的線將彼此連接起來，所以世界真的很小。不論你身在何處，都有一根與人相連的牽引線，因此你不孤單。

    ——改寫自品政達《心的實驗密碼》'
