- id: doc_112_彰化_埤頭_國文_g9s2e2_s2_42
  section: 2
  number: 42
  type: single
  page: 3
  stem: 根據前後文判斷，首段的□□□分別應填入下列何者最恰當？
  options:
  - label: A
    content: 趣味性／娛樂性
  - label: B
    content: 哲學性／啟發性
  - label: C
    content: 懸疑性／刺激性
  - label: D
    content: 教育性／道德性。
  group_stem: '(五)

    　　丑角是戲劇中的甘草人物，在劇中插科打諢、製造笑料，以增添戲劇的□□□與□□□。傳統戲曲向來有「無丑不成戲」之說，意沒有丑角的戲，將是枯燥無趣的表演，可見丑角在傳統戲曲的重要性。

    　　丑角在劇中是地位卑微、造型醜陋，卻是最難扮壞的角色，扮演丑角的演員必須反應靈敏、幽默機智，且要不翻形貌方能勝任，在所有行當中是最難選定的角色。

    　　依照民間戲團倫理，丑角是地位最高尊的角色，因此有丑角「上臺小、落臺大」之行規，丑角在戲班中享有許多「特權」，例如：用餐時需由擔任丑角的演員先夾菜，其他演員才能開動；放置頭盔的戲箱只有丑角可以坐；劇團興典祭神時，丑角位於團主、戲先生之後，而站在所有演員之前。按民間戲班傳說，丑角地位尊貴乃因皇帝曾經扮演丑角，故其地位最高，其用意應在「心理補償作用」，蓋丑角在演出時總是裝瘋賣傻、犧牲形象，因此下戲後理當尊崇，以彌補在戲臺上所承受的委屈。

    ——林茂賢《無丑不成戲 歌仔戲的丑角》'
