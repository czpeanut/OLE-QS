    　　齊有善相狗者，其鄰假以買取鼠之狗，期年乃得之，曰：「良狗也。」其鄰畜之數年而不取鼠，以告相者，相者曰：「此良狗也。其志在獐麋豕鹿，不在鼠。欲其取鼠也，則緤之。」其鄰緤其後足，狗乃取鼠。夫驥驁之氣，鴻鵠之志，有踰乎人心者哉？此固不可以小智測，神應乎人矣，言豈足以論之哉？此謂不言之言也。

    ——呂不韋《呂氏春秋·士容論》'
