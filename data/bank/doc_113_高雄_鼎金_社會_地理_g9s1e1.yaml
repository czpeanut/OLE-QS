  section: 1
  number: 7
  type: single
  page: 1
  stem: '歐洲兩大河流藉由某一運河相互連結，以提升河流的航運價值。甲港口為該運河上重要的轉運樞紐，【表一】為2016年兩條河流流域內各國與甲港口之間的船舶貨運量。由表中資訊判斷，可推論出其中一條河流的貨運量較大，該河流應是注入哪個海域？


    【表一】

    | 國家 | 船舶貨運量(公噸) | 國家 | 船舶貨運量(公噸) |

