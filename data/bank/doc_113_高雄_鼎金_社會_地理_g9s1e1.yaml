- id: doc_113_高雄_鼎金_社會_地理_g9s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 阿爾卑斯山是歐洲最高大的山脈，山間有許多谷地，為南北間的天然孔道，如瑞士-蘇黎世可搭鐵路至義大利-米蘭，甚至可以搭乘觀光火車一窺著名景點－瑞士少女峰。請問：這些「天然孔道」主要是指什麼？
  options:
  - label: A
    content: 河蝕作用的峽谷
  - label: B
    content: 斷層作用的裂谷
  - label: C
    content: 風蝕作用的通道
  - label: D
    content: 冰蝕作用的U型谷。
- id: doc_113_高雄_鼎金_社會_地理_g9s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 歐洲國家積極發展綠色能源，丹麥是世界上再生能源發電佔比最高國家，從2023年9月到2024年8月，丹麥的電力消費狀況顯示，83.39%的電力來自低碳能源，其中風力發電占比達到驚人的60.63%，且供電穩定。丹麥風力發電盛行最主要與下列哪一個方向的盛行風最為相關？
  options:
  - label: A
    content: →
  - label: B
    content: ←
  - label: C
    content: ↑
  - label: D
    content: ↓ 。
