  stem: 由波蘭、匈牙利、斯洛伐克、捷克組成的維謝格拉德集團，近年來約有20%至30%的商品出口至德國，因此當德國經濟成長減緩時，該集團國家的產業可能衰退。根據上文，集團成員國最可能採取下列何項政策，以減少產業衰退所帶來的負面影響？
