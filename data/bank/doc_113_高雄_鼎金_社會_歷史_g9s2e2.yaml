- id: doc_113_高雄_鼎金_社會_歷史_g9s2e2_s1_24
  section: 1
  number: 24
  type: single
  page: 1
  stem: 一句美國的笑話說「想跳樓自殺請排隊」。因為被錢逼上絕路的人實在太多，當時全世界的失業率不斷升高，這場自一九二○年代末開始的金融危機，摧殘了包含美國在內的許多國家。請問：下列哪一個政策與美國解決前述經濟危機的方法相似？
  options:
  - label: A
    content: 放任股匯市自由發展
  - label: B
    content: 行政院推行十大建設
  - label: C
    content: 共產主義國家控制生產
  - label: D
    content: 侵略他國以補償損失。
