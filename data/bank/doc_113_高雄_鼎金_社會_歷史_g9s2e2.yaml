  section: 1
  number: 23
  type: single
  page: 1
  stem: 許多歷史學家喜歡針對阿道夫•希特勒的生平進行研究，甚至就他的成長背景與心理狀態去討論。對於希特勒事蹟的相關敘述，下列何者與歷史事實是一致的？
  options:
  - label: A
    content: 嚴格捍衛《凡爾賽條約》，並與共產黨合作打擊異己
  - label: B
    content: 崛起於國家經濟困頓、社會動盪的局勢下
  - label: C
    content: 所屬政黨透過軍事力量取得政治權力
  - label: D
    content: 政治上推行兩黨政治，經濟上採取計畫經濟政策。
