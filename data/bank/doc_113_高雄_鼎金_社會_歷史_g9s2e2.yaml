  section: 1
  number: 29
  type: single
  page: 1
  stem: 第二次世界戰爭時期的英國首相邱吉爾，曾對二戰爆發前的某個事情批評道：「在戰爭與屈辱面前，你選擇了屈辱！可是，屈辱過後，你仍得面對戰爭！」請問：為何邱吉爾會說出這些話？
  options:
  - label: A
    content: 英國實行孤立主義，對國際事務不聞不問
  - label: B
    content: 英國、法國對德國侵略採取姑息政策
  - label: C
    content: 英國與德國合謀，瓜分了捷克的蘇臺德區
  - label: D
    content: 英國選擇與德國、蘇聯簽訂互不侵犯條約。
