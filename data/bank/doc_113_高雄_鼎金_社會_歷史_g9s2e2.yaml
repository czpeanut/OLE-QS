  section: 1
  number: 21
  type: single
  page: 1
  stem: 學者評價「和平、土地、麵包」的口號，可能除了短暫的「和平」之外，「土地、麵包」的兩大口號，自始至終都未曾達成。以下關於「和平」的說法，何者敘述合乎真實狀況？
  options:
  - label: A
    content: 俄國確實退出第一次世界大戰戰場
  - label: B
    content: 俄國成功推翻沙皇
  - label: C
    content: 俄國成功建立臨時政府
  - label: D
    content: 俄國確實退出德法戰爭戰場。
