- id: doc_113_高雄_鼎金_社會_歷史_g9s2e2_s1_26
  section: 1
  number: 26
  type: single
  page: 1
  stem: 戰間期時，德國走上極權統治。請問：有關德國在戰間期的政治局勢，下列敘述何者錯誤？
  options:
  - label: A
    content: 《凡爾賽條約》讓德國面臨極大的財政壓力
  - label: B
    content: 希特勒加入共產黨，以解決經濟困頓為號召，受人民愛戴
  - label: C
    content: 希特勒抱持種族優越理論，迫害猶太人
  - label: D
    content: 希特勒掌政期間實行一黨專政，並同時進行高度控制。
