- id: doc_113_高雄_鼎金_社會_歷史_g9s2e2_s1_22
  section: 1
  number: 22
  type: single
  page: 1
  stem: 美國羅斯福總統在任期間曾經推動「新政」，對當時的社會狀況帶來正面影響。對於羅斯福總統新政推動的背景，下列敘述何者正確？
  options:
  - label: A
    content: 因為美國投入過多的戰爭資源，導致國家內部反對意見不斷，因此羅斯福總統透過新政加以挽救
  - label: B
    content: 歐洲大量傾銷廉價產品到美國，導致美國自產的貨物滯銷，造成經濟問題
  - label: C
    content: 由於美國帶頭施行貿易的孤立主義，使得各國同樣以高關稅回應，最終造成世界性的經濟問題
  - label: D
    content: 因為亞洲與非洲殖民地紛紛獨立，造成美國貨物缺乏傾銷管道。
  tags:
    chapter:
      publisher: 翰林
