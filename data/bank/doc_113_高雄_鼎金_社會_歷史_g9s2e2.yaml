- id: doc_113_高雄_鼎金_社會_歷史_g9s2e2_s1_25
  section: 1
  number: 25
  type: single
  page: 1
  stem: 近年來，新冠肺炎肆虐，造成經濟蕭條，就連英國廣播公司(BBC)都說，這可能是西元1930 年大蕭條以來最嚴重的經濟萎縮。請問：有關於一九三○年代的大蕭條，下列敘述何者正確？
  options:
  - label: A
    content: 在第一次世界大戰後便立即爆發
  - label: B
    content: 歐洲的工商業不振為其中一原因
  - label: C
    content: 各國皆仿效美國調高關稅，反而使商品不易賺錢
  - label: D
    content: 美國在羅斯福總統上任後，縮減公共建設來減少國家開銷，以因應大蕭條。
