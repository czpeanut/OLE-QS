  section: 1
  number: 33
  type: single
  page: 2
  stem: 「冷戰」意味著相較於戰爭的「熱戰」而言，並沒有實際的戰爭行為，不過冷戰的雙方仍在許多層面上有所較勁，因此在冷戰期間的國際局勢亦是十分險峻，兩方陣營皆怕一個不小心就會擦槍走火，走向「熱戰」的形式。關於冷戰的敘述，下列何者錯誤？
  options:
  - label: A
    content: 美國為首的國家建立「華沙公約組織」，對抗以蘇聯為首的「北大西洋公約組織」
  - label: B
    content: 冷戰兩方可視為資本主義世界與共產世界兩股勢力的相互對抗
  - label: C
    content: 會造成冷戰的局面，原因在於雙方陣營皆握有核子武器，並且深怕再次引發世界大戰
  - label: D
    content: 冷戰之下的兩方陣營仍有零星的區域
