  section: 1
  number: 30
  type: single
  page: 1
  stem: 佑群在臺上報告關於第二次世界大戰某國的經歷：「在先前，戰火原本各自於該國東西兩岸的歐亞陸地延燒。然而甲事件發生後，國家領土受到攻擊，因此加入大戰。成為影響戰局的重要勢力。」請問：甲事件應為下列何者？
  options:
  - label: A
    content: 日本發動珍珠港事變
  - label: B
    content: 德國奪取蘇臺德地區
  - label: C
    content: 英法進行諾曼地登陸
  - label: D
    content: 同盟國攻入德國柏林。
