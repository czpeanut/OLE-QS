  section: 1
  number: 28
  type: single
  page: 1
  stem: 西元1929 年10 月24 日，美國紐約出現瘋狂拋售股票的風潮，股票價格暴跌，一天之內竟有一千三百萬張股票賣出，而這一天也被稱為「黑色星期四」。此事件餘波盪漾，甚至影響全球經濟發展。請問：下列何者與此事件無關？
  options:
  - label: A
    content: 美國實施提高關稅政策
  - label: B
    content: 世界性的經濟大恐慌形成
  - label: C
    content: 美國盛行孤立主義
  - label: D
    content: 《門羅宣言》的發布。
