  section: 1
  number: 34
  type: single
  page: 2
  stem: 柏林圍牆是第二次世界大戰後德國分裂期間，德意志民主共和國(東德)政府環繞西柏林邊境修築的全封閉邊防系統。請問：東德為何要修築此圍牆？
  options:
  - label: A
    content: 防止共產主義入侵
  - label: B
    content: 防止法西斯主義入侵
  - label: C
    content: 防止東德人民遷往西柏林
  - label: D
    content: 防止英、美以空運方式援助西柏林物資。
