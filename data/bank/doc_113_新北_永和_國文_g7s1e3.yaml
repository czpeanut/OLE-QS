- id: doc_113_新北_永和_國文_g7s1e3_s7_35
  section: 7
  number: 35
  type: single
  page: 5
  stem: 根據本文，下列敘述何者正確？
  options:
  - label: A
    content: 歐陽脩請吳丞相細察牡丹和貓眼的樣態，試探其鑑賞能力
  - label: B
    content: 吳丞相細察牡丹和貓眼的樣態，提供鑑賞畫作的一種角度
  - label: C
    content: 畫工雖摹繪精巧，卻沒留意牡丹和貓眼的樣態有時間之別
  - label: D
    content: 由牡丹和貓眼的樣態，可推知歐陽脩偏好於正午時間作畫
  group_stem: '歐陽公嘗得一古畫，牡丹叢，其下有一貓，未知其精粗。丞相正肅 吳公與歐公姻家（１），一見曰：「此正午牡丹也。何以明之？其花披哆（２）而色燥，此日中時花也。貓眼黑睛如線，此正午貓眼也。有帶露花（３），則房斂
    （４）而色澤。貓眼早暮則睛圓，日漸中狹長，正午則如一線耳。」此亦善求（５）古人筆意也。

    【注釋】（１）姻家：締結婚姻的家族或成員。 （２）披哆：綻放、綻開。 （沈括《夢溪筆談》）

    （３）帶露花：指早上帶著露水的花朵。（４）房斂：花房收攏。 （５）求：推求。'
