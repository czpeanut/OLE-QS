- id: doc_113_新北_永和_國文_g7s1e3_s5_2
  section: 5
  number: 2
  type: essay
  page: 1
  stem: '埃及斑蚊與白線斑蚊比較表


    | | 埃及斑蚊 | 白線斑蚊 |

    |---|---|---|

    | 外觀特色 | 胸部背側有一對彎曲白線及中間二條縱線 | 胸部背面沒有彎曲條紋，只有一條白色縱線 |

    | 蟲卵抗旱能力 | 乾燥六個月以上尚具孵化能力 | 乾燥三個月尚具孵化能力 |

    | 幼蟲孳生地類型 | 人工容器(花瓶、花盆底盤、水桶) | 人工容器、天然容器(樹洞、椰子殼) |

    | 成蟲棲息習性 | 室內(深色衣服、窗簾、布幔、家具及暗處) | 室外(滋生地附近之植物或暗處) |

    | 分布 | 嘉義 布袋以南地區 | 全台1500 公尺以下的平地及山區 |


    由以上埃及斑蚊與白線斑蚊比較表得知﹕在新竹的草地被蚊子叮咬而得登革熱，「兇手」應該是﹕（ ② ）'
