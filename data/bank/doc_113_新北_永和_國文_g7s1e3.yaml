- id: doc_113_新北_永和_國文_g7s1e3_s7_36
  section: 7
  number: 36
  type: single
  page: 6
  stem: 依據本文，不發酵茶與全發酵茶最大的不同點為下列何者?
  options:
  - label: A
    content: 製成過程中是否氧化
  - label: B
    content: 是否經過凋萎步驟
  - label: C
    content: 產地氣候的相對溼度
  - label: D
    content: 是否為當天現採的茶葉
  group_stem: "茶葉因製程不同區分成：不發酵茶、部分發酵茶及全發酵茶。\n１.不發酵茶：\n 以綠茶為主，臺灣綠茶產地以北部為主要產區，如龍井。綠茶當天現採，茶菁略微萎凋失水後，直接以高溫進行炒菁，抑制酵素活性，防止茶葉氧化反應。\n\
    製成步驟：採茶 ＞ 炒菁 ＞ 揉捻 ＞ 乾燥\n2. 全發酵茶：\n 茶菁經萎凋失水後，揉捻破壞茶葉組織使茶葉內酵素釋出，調整相對濕度，使酵素與茶葉內容物進行氧化反應，使茶葉完整發酵，待形成紅茶特有香氣及色澤時，即以高溫停止酵素活性，並乾燥製成產品。全發酵茶茶色偏重，主要以南投為產區。\n\
    製成步驟：採茶 ＞ 室內萎凋 ＞ 揉捻 ＞ 發酵 ＞ 乾燥\n3. 部分發酵茶：\n 部分發酵茶種為臺灣最主的茶類，發酵程度則以茶葉中兒茶素多酚氧化程度進行估計，將未氧化綠茶所含的兒茶素多酚含量定為\
    \ 100%，若由發酵最淺的白茶，其茶葉中所含兒茶素與綠茶相較尚有 90%，因此其茶葉發酵度約為 10%。包種茶與高山烏龍茶，經日光萎凋後，進行8-25%的發酵，茶水色較淺。凍頂烏龍茶發酵程度約\
    \ 25-30%、鐵觀音茶發酵程度約 40%，而東方美人茶發酵的程度則有 50-60%。部分發酵茶之產製過程，在茶菁採摘後，以日光萎凋，再於室內進行萎凋，並進行均勻攪拌，其目的在於使茶葉均勻失水，促進氧化反應，茶色介於紅茶與綠茶之間。\n\
    有的茶類會多一道烘焙程序，以有效延長茶葉貯藏壽命。\n製成步驟：採茶 ＞ 日光萎凋 ＞ 室內萎凋與攪拌 ＞ 炒菁 ＞ 揉捻 ＞ 乾燥 ＞ 烘焙\n\n改寫自農業部台灣特色茶分類及加工製成簡介\n\
    \ 臺灣特色茶分類及加工製程簡介(茶及飲料作物改良場)"
