- id: doc_113_新北_永和_國文_g7s1e3_s7_33
  section: 7
  number: 33
  type: single
  page: 5
  stem: 根據本文，下列借書與否的敘述，何者正確？
  options:
  - label: A
    content: 作者借書給黃生
  - label: B
    content: 作者不借書給張氏
  - label: C
    content: 張氏不借書給黃生
  - label: D
    content: 張氏借書給作者
  group_stem: '余幼好書，家貧難致。有張氏藏書甚富。往借，不與，歸而形諸夢。其切如是。故有所覽輒省記。通籍（１）後，俸去書來，落落大滿，素蟫（２）灰絲時蒙捲軸。然後嘆借者之用心專，而少時之歲月為可惜也！今黃生貧類予，其借書亦類予，惟予之公書與張氏之吝書若不相類。然則予固不幸而遇張乎，生固幸而遇予乎？知幸與不幸，則其讀書也必專，而其歸書也必速。（袁枚
    《黃生借書說》）

    【注釋】（１）通籍：新官通報名籍於朝廷。朝廷中已有他的名籍。此指當官。

    （２）蟫：一種昆蟲。性喜陰暗，食害衣服、書本等。也稱為「白魚」。'
  lesson_raw:
    title: 黃生借書說
    basis: 引自《黃生借書說》
