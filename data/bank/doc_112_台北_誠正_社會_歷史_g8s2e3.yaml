  section: 2
  number: 44
  type: single
  page: 4
  stem: '小麗正在做一份國際組織的介紹報告，並收集當時各國家對於此組織的想法與意見。

    | 中國 | 此組織敵視中國，意欲分裂亞洲、插手亞洲國家內政，因此我們更應該加快和平共處五項原則的發布。 |

    | 英國 | 亞洲的共產主義問題是政治問題也是軍事問題，但不能單靠軍事手段牽制共產主義，如要使用軍事手段，便需要取得亞洲國家廣泛支持。 |

    根據上述各國針對此組織的敘述，小麗研究的國際組織為下列何者？'
