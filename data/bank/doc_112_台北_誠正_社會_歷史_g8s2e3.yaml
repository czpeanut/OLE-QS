  section: 2
  number: 45
  type: single
  page: 4
  stem: 美日安保關係的奠基與哪一史事最為相關﹖
  options:
  - label: A
    content: 越戰
  - label: B
    content: 韓戰
  - label: C
    content: 二戰
  - label: D
    content: 珍珠港事變
  group_stem: '二次大戰後，東北亞地區是東西方冷戰最激烈的地方之一。1951 年《美日安保條約》的簽訂，除了代表日本結束盟軍佔領期，也提供美日安保關係的基礎。1960
    年，《美日安保條約》更強化雙邊關係，宣示兩國共同維持與發展武力、美軍駐日，也將日本國土受衝擊認定為對美國的危害，美日關係是美國在亞太地區最重要的雙邊關係。

    冷戰後期，在面對中國勢力的崛起時，美國利用美日戰略合作、插手朝鮮與臺灣議題，建立以美國為中心的議題。冷戰結束後，中華人民共和國取代蘇聯成為美國的潛在敵人。美國聯合日本、南韓以及臺灣共同圍堵中國。'
