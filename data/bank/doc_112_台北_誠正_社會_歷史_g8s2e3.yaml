  group_stem: 李爺爺是四川省人，自願加入國軍，1949 年奉命來臺，從此近四十年與家人失去音訊。1987 年，兩岸開放探親，他終於重回故土。當年離家是二十多歲的青年，回家卻已是六十多歲的老人，雙親早已過世，透過當地村民找到弟妹。初次回去時，看到弟妹住在破瓦房，日子過很辛苦………。後來回鄉探親十多次，弟妹們經濟狀況好轉，以前家鄉是泥土爛地，如今整排是高樓大廈……。這二、三十年來因為中共政策的轉變，經濟進步神速……。
