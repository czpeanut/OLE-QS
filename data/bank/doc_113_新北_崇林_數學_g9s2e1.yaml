- id: doc_113_新北_崇林_數學_g9s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 下列關於”四分位數”的敘述，何者正確？
  options:
  - label: A
    content: 全距＝$Q_{3}-Q_{1}$。
  - label: B
    content: 四分位數 $Q_{3}$ 就是將資料由大到小排序，至少有 $\frac{3}{4}$ 的資料小於或等於 $Q_{3}$，且至少有 $\frac{1}{4}$
      的資料大於或等於 $Q_{3}$。
  - label: C
    content: 當我們知道一群資料的最小值、$Q_{1}$、$Q_{2}$、$Q_{3}$、最大值，則可以根據這 5 個數值，繪製出這群資料的盒狀圖。
  - label: D
    content: 根據四分位數的定義，則 $Q_{3}-Q_{2}=Q_{2}-Q_{1}$。
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 數學
      code: 2-1
      title: 四分位數與盒狀圖
      chapter: 第2章 統計與機率
