  section: 1
  number: 9
  type: single
  page: 2
  stem: 下列關於”機率”的敘述，何者正確？
  options:
  - label: A
    content: 某袋中有 1 號球 8 顆、2 號球 7 顆、3 號球 6 顆。若自袋中抽取一球，且每球被抽中的機會都相等，則抽中 1 號球的機率為 $\frac{1}{3}$。
  - label: B
    content: 對於不可能發生的事件，我們說它發生的機率是 0。
  - label: C
    content: 同時投擲 20 枚相同的十元硬幣，必出現 10 枚正面、10 枚反面。
  - label: D
    content: 如果一實驗可能發生的結果有 n 種，則每一種結果發生的機率都是 $\frac{1}{\mathrm{n}}$。
  tags:
