- id: doc_113_新北_板橋_社會_公民_g9s1e2_s1_40
  section: 1
  number: 40
  type: single
  page: 1
  stem: 臺灣與紐西蘭於 2013 年簽訂《臺紐經濟合作協定》。專家認為此協定可以促進兩國的經貿關係，為雙方創造更多利潤。而紐西蘭進口商品的關稅從 2017
    年到 2025 年將逐漸減免至零，也就是說，未來紐西蘭的牛乳可以在零關稅的狀況下輸入臺灣。我國自產鮮乳由於數量較少，價格一直居高不下，雖然紐西蘭的乳品口味或製程與臺灣不同，消費者未必會全部買單，不過，價格上的優勢仍對我國酪農業者造成巨大衝擊。因此，國產牛乳要如何增加競爭力、在市場上存活下去，已成為刻不容緩的重要課題。請問：根據上文，紐西蘭牛乳進口後最可能對我國造成什麼影響？
  options:
  - label: A
    content: 劣質牛乳氾濫，民眾買不到高品質的產品
  - label: B
    content: 本土業者在進口牛乳的競爭下，利潤減少
  - label: C
    content: 牛乳價格飆漲，消費者對乳品的需求減少
  - label: D
    content: 進口鮮乳利用價格優勢完全取代國產鮮乳。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 公民
      code: 4-2
      title: 保障市場勞動參與
      chapter: 第4章 勞動參與
    textbook: 九上公民 4-2 保障市場勞動參與
    labeled_by: ai
