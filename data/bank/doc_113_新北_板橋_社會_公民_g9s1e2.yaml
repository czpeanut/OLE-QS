  section: 2
  number: 48
  type: single
  page: 2
  stem: 文中消保官所說的「依據法律規定……」，應該是依何法？
  options:
  - label: A
    content: 社會秩序維護法
  - label: B
    content: 憲法
  - label: C
    content: 公平交易法
  - label: D
    content: 消費者保護法。
  group_stem: 只是逛個旅遊展、卻刷卡買了一堆保養品，事後想退貨，卻被沒收定金；走在路上被推銷員華麗的話術誘導下，貸款買了數十萬元的網路教學課程。消保官指出，依據法律規定，企業經營者若未經邀約，在消費者住居所或其他場所從事銷售，契約成立時，也無同類商品可供比較，而消費者在欠缺事前準備的心理狀況下，因為企業經營者的強力促銷手段，沒有深思熟慮發生的交易行為，即屬「訪問交易」，得於收受商品後
    7 天內解除契約。由於訪問交易通常是消費者在無法詳細判斷或思考的情形下，購買了不合意或不需要的商品，為衡平消費者在購買前無法獲得足夠的資料或時間加以選擇，予以特別保障，賦與消費者「後悔」的權利。
