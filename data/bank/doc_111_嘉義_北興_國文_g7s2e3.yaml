  group_stem: "三月七日沙湖道中遇雨，雨具先去，同行皆狼狽，余獨不覺。已而遂晴，故作此。\n  莫聽穿林打葉聲，何妨吟嘯（１）且徐行。竹杖芒鞋輕勝馬，誰怕！一蓑煙雨任平生。\
