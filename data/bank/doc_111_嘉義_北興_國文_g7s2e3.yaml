    content: 在吵雜環境下戴耳機聽音樂，能減輕耳朵的壓力
  group_stem: "請先閱讀圖文，再回答下列問題。\n\n  有些人體器官是二十四小時都不休息的，耳朵就是其中之一。相關研究指出，耳朵所能承受的安全音量是在八十五分貝以下，超過八十五分貝就會傷耳。一般來說，耳朵如未受保護，在九十分貝的環境下，不得超過八小時，否則便會使內耳受到傷害。每增加五分貝，所能容忍的時間就要減半。音量若超過一百一十五分貝，就可能會震破耳膜。\n\
    \  隨著科技的進步，現代人生活環境及型態產生轉變，生活中的噪音加上不良的生活習慣，如同無形的殺手，傷害我們的聽力。\n■戴著耳機聽音樂\n  許多學生、上班族會在通勤時戴著耳機聽音樂，希望能透過音樂隔絕外在吵雜的聲音，但如果想聽得清楚，收聽的音量要比環境音量高十到二十分貝。交通繁忙的馬路、行進中的公車、捷運內，環境音量往往有八十分貝以上，如此一來，耳機音量就可能超過一百分貝。經由長時間的累積，便容易造成聽力受損。\n\
    \  那麼，喜歡戴耳機聽音樂的人，應該如何降低聽損風險？耳鼻喉科醫師建議，無論是睡覺，或是搭乘大眾運輸工具，都不宜戴耳機聽音樂。若一定要聽，則應盡量選擇較安靜的地方，且每聽三十到四十分鐘就拿下耳機，至少休息五分鐘。\n\
    ■居家生活多噪音\n  家用電器所產生的噪音時常被人忽略，但部分家電所產生的音量甚至會超過八十五分貝。若沒注意到音量，或是長時間暴露在噪音下，就可能會對聽力造成影響。\n\
    \  為了保護聽力，無論是看電視、聽音樂，或是享受家庭劇院，都應該控制音量。在不得不使用音量較大的電器用品，像是抽油煙機、吸塵器時，則建議可戴上耳塞做好防護，而且應控制使用的時間，盡量避免超過三十分鐘。\n\
    ■慶典活動好熱鬧\n  廟會繞境及節慶活動中所施放的鞭炮、煙火，都可能帶來「衝擊性噪音」，音量可達一百四十分貝。這種衝擊性噪音，可能會造成暫時性的聽力損傷，甚至是永久性的損害。此外，慶典活動往往還會敲鑼、打鼓，或是使用擴音器，藉此來營造熱鬧的氣氛。所以，參加這類活動時，建議配戴耳罩、耳塞等防護用具，或是避免在現場待太久。活動結束後，如果發現自己的聽力有異常狀況，則必須趕快就醫，進行檢查。"
