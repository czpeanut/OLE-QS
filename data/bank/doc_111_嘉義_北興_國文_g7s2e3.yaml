- id: doc_111_嘉義_北興_國文_g7s2e3_s5_26
  section: 5
  number: 26
  type: single
  page: 4
  stem: 根據本文，現代所說的「昆蟲」應為下列何者？
  options:
  - label: A
    content: 除魚以外，所有的無脊椎動物
  - label: B
    content: 中文名裡有「蟲」字的生物
  - label: C
    content: 中文字裡有「虫」字邊的生物
  - label: D
    content: 所有被歸類在昆蟲綱底下的生物
  group_stem: "過去科學不夠進步，中國古代的人把一切動物都叫做蟲，例如有羽之蟲、有毛之蟲、有甲之蟲、有鱗之蟲等，漢代以後對動物才開始有較明顯區分，比較經典的分法是分成「蟲魚鳥（禽）獸」四類。「鳥」指的是鳥類；「獸」指的是哺乳類動物；除了魚之外，所有的無脊椎動物都被歸為「蟲」，外形怪異、不太好看的爬蟲、兩棲類也歸在「蟲」部。蝙蝠雖是哺乳類動物，但由於在夜間出沒並呈現黑灰色的怪狀，也被歸在「蟲」部。\n\
    \  我們現在說的昆蟲，指的是昆蟲綱的蟲子，昆是「後代」、「眾多」、「各種各類」的意思。有人將昆蟲寫成「昆虫」，以虫為蟲的簡體字，嚴格地講這是不太好的寫法，虫雖是「蟲」的異體字，但它屬於象形字，是依據蛇的大頭以及彎曲的外形所造，也就是「虺」的古字，因此寫成「昆蟲」才對。\n\
    \  從水棲的蜉蝣、蜻蜓，到我們周遭常見的蟑螂、蝴蝶、螞蟻，都是昆蟲，但是像蜈蚣、蜘蛛、螃蟹、蝦、蚯蚓、蝙蝠、蛇、蛙、蛤、蚵等雖有「虫」字邊，卻不屬於昆蟲；蛔蟲、鞭毛蟲、變形蟲等，名字雖然也有「蟲」字，但並未具備昆蟲的基本特徵。（朱耀沂\
    \ 昆蟲Ｑ＆Ａ）"
