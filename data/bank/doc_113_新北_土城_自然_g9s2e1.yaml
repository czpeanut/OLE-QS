  type: single
  page: 1
  stem: 關於臺灣天氣的敘述，下列何者正確？
  options:
  - label: A
    content: 夏季會由於暖鋒通過而形成暖溼的天氣型態
  - label: B
    content: 春末夏初，常因冷、暖氣團勢力相當而形成滯留鋒
  - label: C
    content: 秋季由於大陸冷氣團增強，所以不會有颱風
  - label: D
    content: 冬季的天氣型態，主要受到太平洋冷氣團的影響
