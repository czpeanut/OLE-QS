  group_stem: '【素養題】請詳細閱讀下列文章，回答35~36 題：

    電力排碳 台灣高於日、韓、星

    2022-06-27 聯合報 / 記者吳姿賢、鄭朝陽／專題報導

    高電力排碳係數(每發一度電所排放的二氧化碳量)是淨零的主要挑戰，台灣每度電比南韓多八十六克二氧化碳，這會對企業產生極高的碳成本。」台灣綜合研究院副院長李堅明直指南韓是科技產業主要對手，別小看這八十六克，換算為企業的碳成本，就是企業不可承受之重；但未來用電持續成長，台灣的能源結構仍有高比率火力發電，電力排碳係數壓低有限，綠能發展及節電措施必須加速並進，台灣每度電比南韓多八十六克的二氧化碳；若以年用電一百億度的半導體公司、每公噸碳費廿美元計價，台灣半導體公司每年比南韓公司多新台幣五億一千六百萬元碳成本，代價相當沉重，解決方案只有把再生能源極大化，降低電力含碳量。

    他表示，電力排碳係數受發電結構影響很大，目前台灣還是以化石燃料為主，綠能只約百分之六，電力排碳係數沒辦法壓到太低，且政府已估計未來用電年成長將有百分之二以上，總發電量可能因為用電量增加而被迫快速增加，在這種發電結構下，除非未來風力、光電等再生能源可以穩定成長，才能進一步降低電力排碳係數；但二○二五年又面臨核能除役，占百分之十的核電若無綠能取代，仍要以煤、氣發電，電力排碳係數更難降下來。

    李堅明表示，電力難脫碳對工商業減碳、競爭力和達成淨零排放是主要的障礙，非常需要關注，除了要不斷發展綠電，也要加強節能，包括大幅汰舊換新設備、提升能源效率，政府應提出更好的誘因及市場機制導入更多節電措施。'
