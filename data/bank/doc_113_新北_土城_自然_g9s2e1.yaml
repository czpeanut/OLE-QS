    content: 甲：以單原子形式存在空氣中的惰性氣體
  - label: B
    content: 乙：不可燃也不助燃，常用於填充食品包裝、以避免氧化腐敗
  - label: C
    content: 丙：具有助燃性，化學性質活潑，為動植物呼吸所需的氣體
  - label: D
    content: 丁：為混合氣體，包含有二氧化碳、氫氣等氣體
