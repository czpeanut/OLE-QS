  group_stem: "大明湖（節錄）      劉鶚 \n    到了鐵公祠前，朝南一望，只見對面千佛山上，梵宇僧樓，與那蒼松翠柏，高下相間，紅的火紅，白的雪白，青的靛青，綠的碧綠。更有一株半株的丹楓夾在裡面，彷彿宋人趙千里的一幅大畫，做了一架數十里長的屏風。正在嘆賞不絕，忽聽一聲漁唱，低頭看去，誰知那明湖業已澄淨得同鏡子一般。那千佛山的倒影映在湖裡，顯得明明白白。那樓臺樹木格外光彩，覺得比上頭的一個千佛山還要好看，還要清楚。這湖的南岸，上去便是街市，卻有一層蘆葦，密密遮住。現在正是開花的時候，一片白花映著帶水氣的斜陽，好似一條粉紅絨毯，做了上下兩個山的墊子，實在奇絕！"
