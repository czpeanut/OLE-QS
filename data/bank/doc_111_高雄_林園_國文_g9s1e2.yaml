  section: 3
  number: 45
  type: single
  page: 5
  stem: 作者反對將枯木從森林中移走的理由為何？
  options:
  - label: A
    content: 枯木是許多動物的糧食
  - label: B
    content: 枯木創造森林的獨特美感
  - label: C
    content: 枯木是生態循環的一部分
  - label: D
    content: 枯木是自然生態的消費者
  group_stem: "春天的日記（節錄）   徐仁修 \n  森林中的枯木一如其他的活木，是森林的組成分子之一，是五色鳥打洞營巢下蛋的洞房，是許多甲蟲產卵、成長的場所，也是眾多野蕈生長的地方。而經由各種生物的作用，枯木逐漸腐敗分解，其中的有機質重新進入大自然能源循環系統，再為其他樹木吸收，森林才得以繼續豐美，所以枯木不是廢物也不是垃圾，它是自然生態體系中的重要分子，所以我們反對將枯木自森林中移走，那將使森林的養分減少，並使許多生物失去家園。"
  answer:
  - C
  answer_source: answer_key_vlm
