    content: 從未來寫到過去
  group_stem: "山中與裴迪秀才書   王維 \n  接近農曆十二月下旬，景色宜人，氣候溫和舒暢，輞谷這個地方非常適合遊覽。知道您此時正在溫習經書，我不敢打擾您，就獨自到山中遊玩，在感配寺休息，跟和尚們一起吃了飯便離去。\
    \ \n  向北渡過水色深青的灞水，清朗的月光正映照著城牆。夜裡登上華子岡，看到輞川水面上的漣漪，和水中月影上下盪漾著。寒冷的山上，遠處的燈火，在樹林外忽明忽滅。寒夜裡傳來深巷中的狗吠聲，特別響亮，有如豹吼。村落裡夜間擣米的聲音，又和那疏落的鐘聲互相間雜著。這時候，我獨自閒坐，僕人們靜默無聲，我就想起許多從前的事：我們手牽著手作詩，漫步在狹隘小路上，觀賞清澈的溪流。\
    \ \n  等到春天的時候，草木滋生萌發，春天的山色，正值得一看。輕盈的鯈魚浮出水面，白色的鷗鳥張開翅膀飛翔。露水沾溼了水澤旁邊的青草地，晨起的雄雉在麥田裡啼鳴著。這些景色都距離現在不遠，到時您或許能陪我一起去遊覽吧？要不是您天性清遠高妙，我哪裡會邀您做這無關緊要的事呢？但是遊於山水之間，是有深厚的情趣，請不要忽視呀！\
    \ \n  趁著運黃檗的人下山之便，託他帶信給你，就不一一細說了。山中人王維上。"
  answer:
  - A
