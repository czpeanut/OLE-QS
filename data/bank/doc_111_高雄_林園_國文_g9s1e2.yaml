  group_stem: 往南有一條通巷，叫做「界身」，也是珠寶、彩帛交易的地方。這裡的樓閣雄偉壯立，店鋪門面寬闊，遠遠望去好像不可侵犯的樣子。進行的交易，數額之大往往一筆就達上千萬，所聞所見仙人驚駭。向東去的街北是潘樓酒店。酒店樓下，每天從五更時便有集市交易了，買賣衣物、書畫、珍寶古玩、犀角和玉器等。到天亮時，就有賣羊頭、肚肺、赤白腰子、奶房、肚胘、鶉兔、鳩鴿、野味，螃蟹、蛤蜊之類的。結束之後，才有各種手藝人上市，買賣零碎的原材料。午飯後，就有如酥蜜食、棗錮、砂團子、香糖果子、蜜煎雕花之類的飲食上市。到傍晚，則是賣粗陋的簪釵、帽子、梳子、領巾、珍寶古玩、精巧玩具之類的。
  answer:
  - B
