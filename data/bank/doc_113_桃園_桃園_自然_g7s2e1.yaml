  group_stem: '【題組六】請依照文章內容回答第47~50 題：


    走上孤雌生殖的不歸路？雄性竹節蟲的性行為毫無意義

    如果有性生殖的「機制」可以被完全淘汰，那麼「性別」是否也會在演化中徹底消失？

    改編自：高基氏體/科編 2025.02.17 科學快訊 SCIENTIFIC AMERICAN 科學人

    在自然界中，有性生殖一直被認為是生物適應環境變遷的關鍵策略，但部分物種卻選擇了另一條進化道路——孤雌生殖。這意味著，雌性可以不需要雄性直接生下後代，擺脫了找配偶的麻煩。

    「孤雌生殖」是指卵不需要受精，便能發育成個體。就昆蟲中的蜜蜂而言，雄蜂是由未受精的卵直接發育而成；至於雌蜂則包含負責生育的蜂后和不具生殖力的工蜂，牠們是由受精卵發育而成。

    一項由日本團隊合作的研究，分析了日本短肛竹節蟲（Ramulus mikado）的生殖行為，發現一項驚人事實：這些雄性竹節蟲雖然看似正常地與雌性交配，但完全不產生功能性精子，甚至基因分析顯示沒有任何雄性基因遺傳給下一代。

    稀有雄性只是基因錯誤的產物:日本短肛竹節蟲是日本最常見的竹節蟲之一，以孤雌生殖為主要繁殖方式。歷史上，該物種的雄性極為罕見，在學術報導與新聞中僅記錄過約 10
    例。這些雄性個體的產生，可能來自於染色體分離錯誤，導致「意外生成」，而非真正的生殖需求。研究團隊在四年間，進行詳細的交配行為觀察與基因分析。

    交配變成「沒有結果」的儀式:在實驗中，研究人員發現雄性竹節蟲仍然會主動尋找雌性交配，交配行為與正常有性繁殖物種完全相同，然而，當研究人員進一步分析交配後產下的卵，卻發現了一個驚人的事實——沒有任何雄性基因傳遞給後代！
    這意味著，這些交配行為僅是機械性的行為遺留，而非真正發揮繁殖功能。

    先前在《科學人》的文章〈竹節蟲秘密性關係〉中曾提到，幾乎都是雌性的美國矮竹節蟲（Timema）雖然主要透過孤雌生殖繁殖，但仍然可以透過與稀有雄性交配來恢復部分有性繁殖，確保族群的基因多樣性。

    然而，日本短肛竹節蟲的情況卻完全不同——雄性不僅無法傳遞基因，雌性的受精囊等生殖結構也已經退化，顯示該物種已經完全揮別有性生殖的可能性。這意味著整個物種的繁殖方式已經進入了一條不可逆的演化道路。'
