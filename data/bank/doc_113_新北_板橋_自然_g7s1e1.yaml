- id: doc_113_新北_板橋_自然_g7s1e1_s1_47
  section: 1
  number: 47
  type: single
  page: 4
  stem: 47. 某同學的看法屬於科學方法中的哪一個步驟？
  options:
  - label: A
    content: 觀察
  - label: B
    content: 提出問題
  - label: C
    content: 形成假說
  - label: D
    content: 提出結論
  group_stem: '捕蠅草捕蟲的趣事是生物適應的現象之一。捕蠅草生長在養分及礦物質缺乏的溼地，為了生存，它演化出肉食性的特質。它的葉片特化成捕器，是可以吸引、捕抓及消化小型節肢動物的器官。捕器閉合的機制源自於葉片細胞的膨脹與收縮。當水分從內層細胞流入外層細胞時，內層細胞收縮、外層細胞膨脹，因而造成葉片彎曲而閉合(如下圖)。


    捕器葉片的內側有焮毛，可感應獵物的觸動。每次觸發焮毛都會進行充電。研究顯示，第一次充電時，葉片仍會保持張開，並記憶第一次的觸發，若在20 秒內發生第二次觸發，葉片才會快速閉合困住獵物。科學家在葉子中肋和葉片分別插入電極進行充電，以模擬焮毛被觸發時進行充電的現象，他們發現無論是分段充電，還是連續充電，充電電量都要達到一個定值，葉片才會在大約0.5
    秒內快速閉合。然而，若將捕蠅草的土壤浸潤在pH 值高於4.5 的溶液中，就算觸發焮毛進行充電，也無法讓葉子閉合。


    某同學看完了以上對捕蠅草的敘述後，提出自己的看法：「焮毛第一次被觸發時，葉子中肋和葉片間會進行第一次充電，充電電量小於該定值，但會儲存在葉子中肋和葉片間。在第二次觸發會進行第二次充電，讓葉子中肋和葉片間的儲存電量達到該定值。由於儲存的電量會慢慢散去，所以若沒有在20
    秒內進行第二次觸發，則第二次觸發便無法讓儲存電量達到讓葉片閉合的定值。」他想證明自己的看法，設計了幾個實驗如以下表格。


    | | 探討的問題 | 控制變因 | 操作變因 | 應變變因 | 預期觀察到的現象 |

    |---|---|---|---|---|---|

    | 實驗一 | 第一次觸發焮毛後，葉子中肋和葉片之間的儲存電量隨時間變化的關係 | 培養土的pH值 | 時間 | | 1. 第一次觸發的充電電量小於定值<br>2.
    |

    | 實驗二 | 連續兩次觸發的時間間隔對葉子中肋和葉片之間累積的儲存電量之影響 | 培養土的pH值 | | 葉子中肋和葉片之間的儲存電量 | 1. 連續兩次觸發的時間間隔越大，累積的儲存電量越低<br>2.
    |


    改寫自【113 學年度大學入學考試學科能力測驗試題－自然考科】'
