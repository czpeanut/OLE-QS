    某同學看完了以上對捕蠅草的敘述後，提出自己的看法：「焮毛第一次被觸發時，葉子中肋和葉片間會進行第一次充電，充電電量小於該定值，但會儲存在葉子中肋和葉片間。在第二次觸發會進行第二次充電，讓葉子中肋和葉片間的儲存電量達到該定值。由於儲存的電量會慢慢散去，所以若沒有在20
    秒內進行第二次觸發，則第二次觸發便無法讓儲存電量達到讓葉片閉合的定值。」他想證明自己的看法，設計了幾個實驗如以下表格。


    | | 探討的問題 | 控制變因 | 操作變因 | 應變變因 | 預期觀察到的現象 |

    |---|---|---|---|---|---|

    | 實驗一 | 第一次觸發焮毛後，葉子中肋和葉片之間的儲存電量隨時間變化的關係 | 培養土的pH值 | 時間 | | 1. 第一次觸發的充電電量小於定值<br>2.
    |

    | 實驗二 | 連續兩次觸發的時間間隔對葉子中肋和葉片之間累積的儲存電量之影響 | 培養土的pH值 | | 葉子中肋和葉片之間的儲存電量 | 1. 連續兩次觸發的時間間隔越大，累積的儲存電量越低<br>2.
    |


