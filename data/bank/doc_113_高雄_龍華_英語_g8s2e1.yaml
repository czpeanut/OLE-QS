  group_stem: '(三) (第36-38 題)

    Easter is an important day for many people around the world. On this day, some
    people go to church, and many families get together and have a big lunch or dinner.

    Like Mother’s Day, Easter changes its date every year. It comes after the spring
    equinox, and it’s also on the first Sunday after the first full moon. This means
    Easter can be between March 22 and April 25. It’s always in spring, the beginning
    of the year, so many Easter activities have symbols about new life.

    One of the most popular activities is the Easter egg hunt. Parents put Easter
    eggs in the garden, and children try to find them. Some are chocolate eggs, and
    some are plastic ones with small toys inside. This is fun for kids and brings
    family together.

    The Easter Bunny is another exciting part of the day. Many believe the Easter
    Bunny visits children and leaves eggs for them. Before Easter, many shops sell
    chocolate bunnies and eggs. People buy them as gifts for family and friends.

    People around the world live the day in different ways. Some send cards to their
    friends. Some families visit friends or go on a trip. For many people, Easter
    is a happy time full of interesting activities. It also brings lots of fun to
    many around the world.

