  group_stem: '(四) (第39-40 題)

    Many things we use today are different from things in the past. In the past, people
    used letters to send messages, and it took days or even weeks to get a reply.
    Today, we use smartphones and the Internet to send and get messages in seconds.
    People can also make video calls to their family or friends even when they are
    far away.

    Transportation also changed a lot. Long time ago, people traveled by horse or
    walked a long way. Later, bicycles and scooters helped travel faster. Now we have
    cars, trains, and airplanes to help us reach far places in a shorter time.

    Even daily life at home is different. In the past, washing clothes and cleaning
    the floor took us a long time. Today, it’s faster and easier to do the housework
    with washing machines and vacuum cleaners.

    The ways of shopping also changed a lot. Before, people went to markets, but now
    they can buy things online. These changes help people live a more convenient life.

