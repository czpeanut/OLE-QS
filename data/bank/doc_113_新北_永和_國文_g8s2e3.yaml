- id: doc_113_新北_永和_國文_g8s2e3_s7_33
  section: 7
  number: 33
  type: single
  page: 6
  stem: 根據文章，下列哪一項最不可能是秦始皇建造地宮的目的？
  options:
  - label: A
    content: 展現帝王威嚴，使人民懼於反抗統治。
  - label: B
    content: 鞏固自身皇權，為帝國建立長久霸業。
  - label: C
    content: 為自己死後準備的陵墓。
  - label: D
    content: 保障秦帝國臣民的安全，並建立日後帝王墓葬的標準。
  group_stem: "（四）秦始皇地宮\n    秦始皇是中國歷史上第一位皇帝，他統一六國後，為了鞏固皇權與展現帝王威嚴，開始興建宏偉的陵墓——秦始皇陵。這座陵墓位於今天的陝西省西安市臨潼區，地宮就是陵墓的地下主體。\n\
    \    根據史書《史記》的記載，秦始皇地宮的建造歷時數十年，動用了大量人力物力。地宮內部設計精巧，據說有模擬江河湖海的水銀流動，以象徵天地四方，還設有機關，防止盜墓。地宮上方覆蓋著高大的土丘，也就是今天所見的陵墓封土。\n\
    \    1974 年，一位農民在打井時意外發現了兵馬俑坑，揭開了秦始皇陵的一角。兵馬俑栩栩如生，排列整齊，被認為是陪葬軍隊的一部分，顯示出秦朝軍隊的規模與氣勢。不過，至今地宮仍未被正式發掘，專家擔心現代技術尚不足以保護其內部文物與環境。\n\
    \    秦始皇地宮不僅是中國古代建築與工程技術的結晶，也是後人認識秦朝文化與思想的重要窗口。\n                            \
    \                                                   （改寫自網路文章）"
