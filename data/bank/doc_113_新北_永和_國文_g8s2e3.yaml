  group_stem: '（一）姑蘇 李章，敏於調戲。偶赴鄰人小集，主人者雖富而素鄙，會次章適坐其旁。既進饌，章視主人之前一煎鮭特大於眾客者，章即請於主人曰：「章與主人俱蘇人也，每見人書『蘇』字不同，其『魚』不知合在左邊者是，在右邊者是也？」主人曰：「古人作字，不拘一體，移易從便也。」章即引手取主人之魚，示眾客曰：「領主人指撝①，今日左邊之魚，亦合從便，移過右邊如何？」一座輟飯而笑，終席乃已。           （何遠《春渚紀聞•謔魚》）

