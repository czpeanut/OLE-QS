  stem: 從上文的內容判斷，此「萬國和會」召開的背景應該為何？2-1
  options:
  - label: A
    content: 甲午戰爭結束
  - label: B
    content: 辛亥革命成功
  - label: C
    content: 國民政府誓師北伐
  - label: D
    content: 第一次世界大戰結束。
  group_stem: '(一)閱讀下列敘述，並回答問題：

    北京學界全體宣言

    現在日本在萬國和會要求併吞青島，管理山東一切權利，就要成功了!他們的外交大勝利了!我們的外交大失敗了!山東大勢一去，就是破壞中國的領土!中國的領土破壞，中國就亡了!所以我們學界今天排隊到各公使館去，要求各國出來維持公理，務望全國工、商各界，一律起來設法開國民大會，外爭主權，內除國賊。中國存亡，就在此一舉了!今與全國同胞立兩個信條道：中國的土地可以征服而不可以斷送!中國的人民可以殺戮而不可以低頭!國亡了!同胞起來呀!'
  tags:
