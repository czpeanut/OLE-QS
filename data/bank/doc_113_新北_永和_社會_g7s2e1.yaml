  type: single
  page: 1
  stem: '一地的人口分布深受自然環境與產業活動的影響，圖(一)為世界人口密度圖，可從圖中判斷出哪些資訊正確？(L1)

    (甲)緯度高或地勢陡峭區因氣候嚴寒，人口較稀疏，如：非洲北部

    (乙)降水量充足且溫暖的地區人口較密集，如：亞洲東部、東南部

    (丙)位於中緯度的北美洲東部、歐洲西部因氣候溫和，人口較稠密

    (丁)世界人口分布十分平均'
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 乙丁
  - label: D
    content: 丙丁
