- id: doc_113_台南_復興_英語_g8s1e1_s7_8
  section: 7
  number: 8
  type: single
  page: 4
  stem: 8. What did the Taliban say about women?
  options:
  - label: A
    content: They should have an education.
  - label: B
    content: They should write something about their life.
  - label: C
    content: They should tell their troubles to the world.
  - label: D
    content: They should cook for their family.
  group_stem: 'There is a special woman from Pakistan, and her name is Malala Yousafzai.
    In her childhood, she loved school and always enjoyed her classes. At that same
    time in Pakistan, there was a group of people, the Taliban. They didn''t care
    about women''s education. “Women should be cooking at home and having babies.
    They shouldn''t go to school.” the Taliban said. They then stopped women from
    going to school ever again.

    Malala didn''t like this, so she did something about it. She wrote about her life
    and women’s troubles in Pakistan. She told the world her story, and the world
    listened. The Taliban were very angry about what she did. In 2012, the Taliban
    took action; they shot her. A bullet went straight through her head. Luckily,
    she was sent to the UK by the Pakistan government and survived. Two years later,
    she won the Nobel Peace Prize. What an amazing woman!'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
