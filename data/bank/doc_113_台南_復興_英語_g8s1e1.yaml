  group_stem: 'Animal Farm is a story by George Orwell, a great English writer. The
    animals in the story live on Mr. Jones'' farm and they all can talk. Mr. Jones
    treats them very badly. He takes their milk, and eggs, and he kills them for their
    meat. All the animals want to be free.

    One day, Old Major, the smartest pig of them all, tells the other animals that
    they must work for themselves and should not work for the farmer. He tells them,
    "Four legs good, two legs bad." The animals work together and get rid of Mr. Jones.
    Everyone is free and happy.

    Now the pigs run the farm because they are smarter than the horses, chickens,
    and sheep. One pig. Napoleon, wants more and more power. He wants to run the farm
    just like Mr. Jones. Napoleon takes food from the farm for himself when no other
    animals have food to eat. They work tirelessly. However, Napoleon sleeps lazily
    and eats up all the food. He makes the animals build a windmill to make money
    for him. If any animals question Napoleon, then they will be eaten by Napoleon''s
    dogs. Napoleon even starts to work with people and makes a lot of money. He even
    starts to walk on two legs. He now says, Four legs good, two legs better. At the
    end of the story, the pigs are just like people. They treat the other animals
    as awfully as they can.'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
