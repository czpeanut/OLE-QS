- id: doc_113_台南_復興_英語_g8s1e1_s7_4
  section: 7
  number: 4
  type: single
  page: 4
  stem: 4. What does the reading mainly talk about?
  options:
  - label: A
    content: Students are very busy at school.
  - label: B
    content: Not all clubs are popular with students.
  - label: C
    content: There are different school clubs in Japan.
  - label: D
    content: Students have a lot of time to play at school.
  group_stem: 'Many students in Japan join clubs after school because junior high
    school only runs from 9:00 a.m. to 3:00 p.m. They have enough time to join school
    clubs after school. There are two kinds of clubs at school. One is about sports,
    and the other is about culture.

    There are different kinds of practices in the sports clubs. Students can choose
    to play baseball, go swimming, go climbing, or learn judo. If they join a sports
    club, they have a chance to be a member of a school team. However, the members
    have to practice every day for the games. It is not easy. They need to think about
    it more carefully before joining sports clubs.

    There are also many activities in cultural clubs. Students can go to the drama
    club, the chorus club, the art club, the tea tasting club, or the railway club.
    Members don''t have many opportunities to perform outside of their school, but
    they have more opportunities to perform in front of all the teachers and students
    at school. There is an important event every fall in Japan. It is called "Cultural
    Festival." Students can show their skills to their family or people on this special
    day. It is a great time for everyone.'
