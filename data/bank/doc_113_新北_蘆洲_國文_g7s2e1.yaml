  group_stem: '從故宮博物院收藏的青玉女佩等飾物來看，這時的婦女，頭上都插有髮笄。按周代禮俗：女子年過十五，如已許嫁，便得舉行笄禮，以示成人及身有所屬；如年過二十而未許嫁，也得舉行笄禮，不過這種笄禮不及上述隆重，所用笄飾也不一樣。這種風俗，一直影響到後世，明　清時期的開臉上頭（拔去臉上的汗毛，並梳上成人的髮髻）之俗，即由此發展而來。商代的髮笄實物在古墓中曾有出土，它的質料大多是獸骨，也有用象牙、寶玉製成的。在笄的上端，一般都刻有雞、鳥、鴛鴦或幾何紋圖樣。從文獻記載來看，這種髮飾不僅婦女使用，男子也可用來簪髮，且以笄的質料分別貴賤等差。

    《中華服飾五千年．商代髮式和髮飾》'
