  group_stem: '我住在一個只有９００戶人家的村落，而且我的小家，距離９００戶人家聚集的一平方公里村落中心，還有四公里，四周沒有路燈，只有叢林環抱。從半山上遙望下面村落的燈火，有一種明亮的溫暖感。有一天，在毫無目的地的遊蕩中，吉普車駛過乾涸小溪，進入一條不曾走過的山路。顯然人跡久不至，落葉腐木覆蓋，路面中央破裂成深溝。緩慢行駛中，突然看見一隻巨大的鳥從路邊草叢啪啦啦振翅竄起；這龐大的猛禽，低低掠過我的車窗。牠的腳爪抓著一條垂下來長長的衣帶，是不是太重了，牠突然放鬆腳爪，竄進右邊的樹林，停在高枝上，俯視我。我清晰看見猛禽黃色的爪子，和爪子上面鐵鉤似的黑色腳趾。回頭仔細看那摔在地上的衣帶，竟然是一條大蛇，一公尺半長，和我的手腕一般粗。等候片刻，確定那蛇不動了，我下車，想知道那是什麼蛇，蛇有多長。靠近了才看見，無法知道蛇的長度，因為，可憐的南蛇，整個頭都被吃掉了，而且不知道被吃掉了多少。大冠鷲還在樹上，盯著我的一舉一動，顯然在等我離開，好回來打包，帶食物去給孩子吃。發動車，小心地避過南蛇，繼續這條荒野的路。雖然目睹血腥震動不已，心中卻充滿沉重的感恩。沉重，因為知道這個地球已經不堪負荷，山林大火、洪水暴發、瘟疫蔓延、海水淹城，世紀末的景象觸目驚心；感恩，因為看見村落的外面，還有叢林野地，還有荒溪亂石，還有猛禽大蛇，讓我知道，我這個大腦發達、肢體孱弱而貪得無厭的動物，和大自然生生不息的臍帶，並沒有完全斷裂。

    改自龍應台《注視》'
