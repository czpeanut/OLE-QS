  stem: 24、阿華夫婦帶著就讀幼稚園的小孩參加這套行程，三人入住一間標準雙人房。下列敘述，何者符合套裝行程的內容？
  options:
  - label: A
    content: 三人皆支付了基本費用3590 元
  - label: B
    content: 他們皆可免費享用渡假村的自助式早餐
  - label: C
    content: 他們須額外購買一張海洋歡樂世界的門票
  - label: D
    content: 小孩意外受傷，醫療險最高賠償額度為十萬元。
  group_stem: '『發現臺東』套裝行程

    東方美人號經濟艙・維多利亞渡假村＋海洋歡樂世界輕鬆2日遊

    【成人單價】3590元（老人、兒童價格另有優惠，歡迎來電洽詢）

    【行程景點特色】

    ・入住充滿英國小鎮風情的維多利亞渡假村。

    ・徜徉於海洋歡樂世界，欣賞豐富的海洋生態及美麗的海景，適合全家同遊。

    【房型】標準雙人房（恕不提供加床服務）

    【餐食】提供免費自助式早餐（不占床位的小孩及嬰兒餐費另計）

    【交通】「東方美人號」列車經濟艙（臺北——臺東）來回火車票

    【接送】臺東火車站、住宿處、海洋歡樂世界定點免費接駁

    【門票】費用已含海洋歡樂世界門票（不占床位小孩門票自理）

    【保險】400萬履約責任險＋10萬意外醫療險

