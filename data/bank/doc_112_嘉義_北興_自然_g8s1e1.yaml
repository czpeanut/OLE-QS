- id: doc_112_嘉義_北興_自然_g8s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 關於實驗步驟的修正，下列何者較為合理?
  options:
  - label: A
    content: 將步驟一的二氧化錳應該是從薊頭漏斗加入
  - label: B
    content: 步驟二需加入水，讓水位高於漏斗末端
  - label: C
    content: 步驟三在橡皮管冒出氣泡後，應立即收集氧氣
  - label: D
    content: 步驟四，收集氧氣的廣口平取出水面後，瓶口應朝下，避免氧氣跑走。
  group_stem: '小玉到實驗室進行2-1氧氣的製造與性質的實驗，小玉進行於氧氣製備的實驗步驟如下：

    步驟一：取半匙二氧化錳放入吸濾瓶中，並接上橡皮導管。

    步驟二：小心地將薊頭漏斗穿過橡皮塞，並塞緊吸濾瓶口，使漏斗末端盡量接近瓶底

    步驟三：將雙氧水緩緩滴入薊頭漏斗中，待冒泡約一段時間（約30秒）後，再將橡皮導管插入水槽的廣口瓶中，收集產生的氣體。

    步驟四：當氣體充滿廣口瓶後，在水中以玻片蓋緊瓶口，取出水面，瓶口朝上放置。請依上述內容，回答5-7題。'
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 理化
      code: 2-1
      title: 認識物質
      chapter: 第2章 物質的世界
    textbook: 八上理化 2-1 認識物質
    labeled_by: ai
