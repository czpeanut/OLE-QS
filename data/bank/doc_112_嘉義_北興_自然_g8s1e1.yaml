- id: doc_112_嘉義_北興_自然_g8s1e1_s3_28
  section: 3
  number: 28
  type: single
  page: 3
  stem: 琳琳不確定要配戴哪種大小的口罩，經媽媽幫忙測量，琳琳臉寬約為14.53cm，下列敘述何者錯誤？
  options:
  - label: A
    content: 琳琳應配戴成人用的口罩較適合
  - label: B
    content: 媽媽測量尺的最小刻度單位為毫米(mm)
  - label: C
    content: 此測量結果的估計值為 0.03
  - label: D
    content: 此測量結果的準確值為14.53。
  group_stem: "西元2020 年初，新型冠狀肺炎（COVID-19）肆虐全球。根據目前研究，新型冠狀病毒有兩種傳染途徑，一為接觸傳染，經直接或間接接觸患者身體或觸碰過的物體傳染。由於病毒肉眼看不到，容易輕忽接觸傳染的風險，因此勤洗手且不隨意觸摸眼、口、鼻是防疫的重要關鍵。二為飛沫傳染，飛沫是咳嗽或打噴嚏時，形成的液體顆粒，小至5\
    \ 微米，大至肉眼可見，而一般病毒顆粒直徑約為0.1 微米，可以想像成：病毒是旅客，飛沫是飛機，病毒可藉由飛沫傳染給健康的人，因此於密閉空間應配戴口罩，特別是有呼吸道症狀（例如：喉嚨癢、喉嚨痛、流鼻水、鼻塞、打噴嚏、反覆咳嗽、咳出濃痰、喘等）患者更應該配戴口罩，保護他人避免受自己的飛沫感染。\n\
    \    口罩過濾層的孔徑只要小於飛沫的尺寸，應能有效降低感染風險，但沾至口罩表面的飛沫會隨時間逐漸乾燥，粒徑會變小，病毒便可能藉此穿透過濾層，因此需配戴過濾孔徑小的口罩，且口罩應密合、完整包覆臉部並確實罩住口鼻，較能達到防疫效果。依口罩大小，可分為兒童用與成人用口罩，常見尺寸分別為\
    \ 12.9cm × 9.3cm 與 17.5cm × 9cm；而依口罩過濾孔徑大小與用途，常可分為以下幾種：\n\n| 種類 | 功能 |\n| :---\
    \ | :--- |\n| N95口罩 | 孔徑 30～75nm，可阻擋 95%以上 0.3 微米顆粒。呼吸阻抗較高，不適合一般人長期配戴。 |\n| 外科口罩\
    \ | 孔徑為數百 nm 不等，可阻擋 90%以上的 5 微米顆粒，有髒汙、潮溼即應更換。 |\n| 活性碳口罩 | 孔徑 260～1000nm，可吸附有機氣體與異味，較不易吸附細菌與病毒。無法吸附異味時就要更換。\
    \ |\n| 棉布口罩 | 孔徑 260～1000nm，只過濾較大顆粒。清洗後可重複使用。 |\n\n另外，專家指出，配戴口罩並沒有所謂的100%零風險，但是正確選用與配戴口罩、配合相關防疫措施，同時保持健康生活習慣，將可有效降低病毒感染風險。請依上文內容，回答34-35題。"
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 理化
      code: 1-2
      title: 測量與估計
      chapter: 第1章 基本測量
    textbook: 八上理化 1-2 測量與估計
    labeled_by: ai
