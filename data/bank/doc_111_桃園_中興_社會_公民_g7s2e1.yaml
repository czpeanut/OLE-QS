questions:
- id: doc_111_桃園_中興_社會_公民_g7s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 「舉頭三尺有神明」意思是說人的行為會被神明看在眼裡，希望藉由宗教信仰的力量建立人的道德良知，可說是文化的特徵當中對於人們制約的明顯例子，請問下列選項當中何者也屬於文化對於人們制約性的敘述?
  options:
  - label: A
    content: 韓國使用的筷子是扁筷，與台灣所使用的筷子不同
  - label: B
    content: 現今的青少年大多會利用社群媒體上傳並記錄自己的生活與他人分享
  - label: C
    content: 在清明連假期間，臺灣人大多數都會返鄉掃墓
  - label: D
    content: 台灣的粽子依照口味與製作方式可以分為北部粽、南部粽與野薑花粽等類型。
- id: doc_111_桃園_中興_社會_公民_g7s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 臺北市萬華區的市定古蹟林家古宅，將其1、2 樓出租給店家經營，3、4 樓依然為屋主所有，作為家族文物與地方歷史展示空間，被認為有助於在地歷史文化的維護與推廣。根據上述內容，這主要是指哪一部分的文化內容?
  options:
  - label: A
    content: 建築
  - label: B
    content: 宗教
  - label: C
    content: 飲食
  - label: D
    content: 文學。
- id: doc_111_桃園_中興_社會_公民_g7s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 電影「星際大戰」擁有許多粉絲，該電影有句經典台詞，「願原力與你同在」(May the force be with you)，便有粉絲以該電影的台詞作為響應，號召其他人在5/4(May
    the fourth)當天一起看完星際大戰系列相關的影視產品。請問根據上述內容，判斷粉絲相約看電影的行為屬於何種文化?
  options:
  - label: A
    content: 主流文化
  - label: B
    content: 次文化
  - label: C
    content: 弱勢文化
  - label: D
    content: 上流文化。
- id: doc_111_桃園_中興_社會_公民_g7s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 「紅包」這項風俗習慣在臺灣的許多慶祝的場合非常普遍，像是農曆新年、小孩滿月、搬家甚至是在生日也會有紅包的蹤跡，而日本所謂的「祝儀袋」雖然與台灣有同樣慶祝的意思，但是其顏色卻是白色。
    請問，臺灣與日本在禮金袋所使用的顏色不同所展現出的文化特性是下列何者?
  options:
  - label: A
    content: 普遍性
  - label: B
    content: 累積性
  - label: C
    content: 制約性
  - label: D
    content: 差異性
- id: doc_111_桃園_中興_社會_公民_g7s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 文化是指某一群人所共享的生活方式，為因應生活的需要，透過創造或學習而來的成果，成為該社會特有的現象，請問，下列關於文化的敘述，何者正確?
  options:
  - label: A
    content: 文化是透過先天遺傳的影響，代代相傳
  - label: B
    content: 文化是人類生活的一部份，其中包含思想與宗教信仰等非物質的文化
  - label: C
    content: 文化是人類的生活方式，主流文化不會隨著環境的影響而有所改變
  - label: D
    content: 文化是人類生活的一部分，特別指思想與宗教信仰等非物質的文化。
- id: doc_111_桃園_中興_社會_公民_g7s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 「寧賣祖宗田，莫忘祖宗言；寧賣祖宗坑，莫忘祖宗聲。」臺灣在早期語言政策的規範下，族語／母語遭到排擠、漠視，學生被迫接受強勢語言，導致族語／母語漸漸流失，甚至成為瀕危語言，請問此舉對台灣造成的影響，不包括下列何者?
  options:
  - label: A
    content: 造成傳統文化流失
  - label: B
    content: 形成文化位階現象
  - label: C
    content: 擴張強勢語言地位
  - label: D
    content: 增加台灣語言的多樣性。
- id: doc_111_桃園_中興_社會_公民_g7s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 行政院於「2030 雙語國家政策藍圖」當中提到，為提升國人英語能力，在當中投入許多資源，提出英語在教育、媒體、與英語友善環境的三大策略，但卻有學者提出雙語國家的願景與《國家語言發展法》的願景背道而馳，政府大量投入國家資源學習可以帶來大量經濟優勢的英文，反而讓台灣本土語言流失的速度更加快速。
    依照文化位階的概念，判斷下列選項何者並不是該學者提出質疑的理由?
  options:
  - label: A
    content: 忽視語言為文化、歷史與思想的載體，過度在乎英語的「經濟利益」，忽略對於本土文化的認同
  - label: B
    content: 政府以國家資源強調「英語至上」，會讓人覺得在學習的先後順序上，本土語言相對於英語更為後面
  - label: C
    content: 使用英語人口比較多，所以為了成為世界公民我們必須優先學習英語
  - label: D
    content: 英語為外語，臺灣不應有「英語為官方語言」的思維，且各級學校於語言教育中應加強建立平等的語言價值觀。
- id: doc_111_桃園_中興_社會_公民_g7s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 國立中正大學以「須符合大學形象」為由向戶政機關申請更改原地址「民雄鄉三興村陳厝寮160 號」為「嘉義縣民雄鄉大學路一段168 號」通過。 中正大學解釋，校址更改是為了學校和國際接軌時，能有一個較符合大學形象的地址，「陳厝寮」確實感覺較鄉土，也很難用英文翻譯，不符合國際化，於當時引起熱議。
    依照上述劃線內容，判斷中正大學的解釋可能隱含著下列何種觀念?
  options:
  - label: A
    content: 主流文化
  - label: B
    content: 次文化
  - label: C
    content: 文化傳承
  - label: D
    content: 文化位階。
- id: doc_111_桃園_中興_社會_公民_g7s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 阿布在研究室與教授討論論文的時候做了一小段摘要，「握有權力與資源者，認定自身生活方式與價值觀較為優越，因此以資源優勢決定不同文化的高低地位，限縮其他文化的發展空間」，請問下列情形何者最為符合阿布的摘要敘述?
  options:
  - label: A
    content: 文化部補助拍攝紀錄片
  - label: B
    content: 電視台舉辦青少年電競比賽
  - label: C
    content: 原住民族固定舉辦祭典
  - label: D
    content: 日本總督府運用政策讓台灣人改日本姓氏與講日語。
- id: doc_111_桃園_中興_社會_公民_g7s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 7 年18 班幾位同學在討論對於世界各種文化的調查結果，下列哪位同學的發言隱含有文化位階的想法?
  options:
  - label: A
    content: 小歐：學習歐美國家語言比學會東南亞語系還要優秀
  - label: B
    content: 梅伯：歐美文化重視個人隱私，與華人文化有相當大差異
  - label: C
    content: 關關：日本職場重視職場倫理，有前輩後輩的分別
  - label: D
    content: 大黑：阿根廷位在南半球，所以聖誕節在夏天。
- id: doc_111_桃園_中興_社會_公民_g7s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 2019 年4 月21 日早晨，「第九屆藤球友誼賽暨潑水節」在新北市市民廣場盛大舉辦，吸引來自全台上萬名移工朋友參加，開開心心度過屬於自己的新年。每年四月中旬左右，新北市政府為了旅居台灣的泰國移工朋友，貼心舉辦潑水節活動，這項原本不屬於台灣的傳統節慶，隨著越來越多東南亞新住民移入，規模越發盛大，成為新北市獨特的人文風景。
    根據上述內容，新北市政府舉辦此類活動有助於下列何種效果？
  options:
  - label: A
    content: 維護文化多樣性
  - label: B
    content: 認同在地文化發展
  - label: C
    content: 拒絕殖民文化入侵
  - label: D
    content: 淘汰弱勢落後文化
- id: doc_111_桃園_中興_社會_公民_g7s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: "澳洲知名景點烏魯魯巨岩，為原住民阿南古人傳統聖地，他們認為觀光客隨意攀爬巨岩，是褻瀆且危險的活動，為此     \n向澳洲政府申請「禁爬令」，並在2019\
    \ 年底生效。 請問禁爬令的目的最可能是下列何者?"
  options:
  - label: A
    content: 對於自身文化的優越感
  - label: B
    content: 製造文化間的衝突
  - label: C
    content: 尊重不同族群文化
  - label: D
    content: 促進文化的統合單一化。
- id: doc_111_桃園_中興_社會_公民_g7s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 3
  stem: 傳統社會有五倫關係的建立，是透過人倫關係來維繫社會秩序。下列關於五倫的敘述，何者正確？
  options:
  - label: A
    content: 強調群己關係
  - label: B
    content: 以公權力作為後盾
  - label: C
    content: 屬於倫理道德的社會規範
  - label: D
    content: 透過各種戒律來規範信徒的行為舉止。
- id: doc_111_桃園_中興_社會_公民_g7s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 3
  stem: 台北捷運是不少通勤族上下班的工具，不過很多乘客仍不確定在手扶梯左側是否能久站。北捷指出，「右側站立、左側通行」已經是很久以前的宣導，現在乘客已經養成禮讓好習慣，扶梯左側可通行也可站立，目前宣導一律是「緊握扶手、站穩踏階」。
    (節錄自 自由時報搭電扶梯應「右站左走」？台北捷運公布標準答案2019/11/10 記者蔡思培／台北報導 )  根據上述內容，請問台北捷運的宣傳標語，主要彰顯出社會規範的什麼功能?
  options:
  - label: A
    content: 促進人與人之間的競爭
  - label: B
    content: 具體落實法律規定的懲罰
  - label: C
    content: 賦予弱勢團體公平競爭機會
  - label: D
    content: 社會規範建立一套可依循的生活準則。
- id: doc_111_桃園_中興_社會_公民_g7s2e1_s1_15
  section: 1
  number: 15
  type: single
  page: 3
  stem: 某國每次發生殺人案件，專家學者和社會大眾就會紛紛討論，是什麼原因讓犯罪者做出不應該出現的行為？為什麼一般人共同遵守的規則沒有發生它的作用？死刑為什麼無法產生嚇阻作用？透過這些問題的討論，某國希望對此類事件有更好的預防方向。
    請問，關於上文所欲表達的內涵 ，下列敘述何者正確?
  options:
  - label: A
    content: 治安環境惡劣，嚴重影響社會安定
  - label: B
    content: 人民權利受損，社會衝突日益增加
  - label: C
    content: 如何有效約束個人行為，才能有效維持社會安定
  - label: D
    content: 教育程度低下，導致治安敗壞。
- id: doc_111_桃園_中興_社會_公民_g7s2e1_s1_16
  section: 1
  number: 16
  type: single
  page: 3
  stem: WBC 世界棒球錦標賽與今年3 月在台灣開始A 組預賽，許多大聯盟球星將會出賽，某些球員為回應球迷熱情，會在場外幫球迷簽名，卻有球迷未依照指示隨意插隊，導致現場狀況混亂，只好當場中止活動。
    從文章描述中，球迷的表現最能以下列何項敘述表示?
  options:
  - label: A
    content: 拒絕承擔對公共事務的責任
  - label: B
    content: 未遵守共同的行為準則
  - label: C
    content: 喪失對自身文化的認同感
  - label: D
    content: 過度強調自身文化的優越
- id: doc_111_桃園_中興_社會_公民_g7s2e1_s1_17
  section: 1
  number: 17
  type: single
  page: 3
  stem: 每年學校在升學考試前會送應屆考生肉包、蛋糕還有肉粽，還有其他學校會請學生端放著青椒的盤子，這是因為肉包、蛋糕還有肉粽可以取諧音為「包高中」；端放著青椒的盤子可以解釋為「台清交(抬青椒)」，皆為對考生祝福的意思，上述學校所隱含的社會規範，下列性質與題目內容最相似?
  options:
  - label: A
    content: 小孩誕生滿月會送親朋好友油飯還有紅蛋
  - label: B
    content: 遛狗時會主動清理寵物的排泄物
  - label: C
    content: 伊斯蘭教信徒每日都會做禮拜
  - label: D
    content: 騎車時使用手機會被開罰單
- id: doc_111_桃園_中興_社會_公民_g7s2e1_s1_18
  section: 1
  number: 18
  type: single
  page: 3
  stem: 科技發展能使資訊的傳播與獲取更有效率，但是如電腦病毒等的惡意傳播，也常造成個人及公共利益的損害，因此政府在《刑法》當中設立新的篇章「妨害電腦使用罪」，主要是針對電腦設備做出的犯罪行為而訂定。
    請問上述內容最為符合下列何種社會規範的特性？
  options:
  - label: A
    content: 倫理道德
  - label: B
    content: 法律
  - label: C
    content: 風俗習慣
  - label: D
    content: 宗教信仰
- id: doc_111_桃園_中興_社會_公民_g7s2e1_s1_19
  section: 1
  number: 19
  type: single
  page: 4
  stem: 立法院將《民法·親屬篇》當中對結婚的條件從「儀式婚」更改為「登記婚」，這是為了防止惡意人士騙婚、重婚；目前臺灣結婚不再以過去需要有公開儀式作為認定標準，而是必須向戶政機關登記接婚，才有之後的法律效力。
    請問更改結婚條件是顯現出哪兩項社會規範的衝突？
  options:
  - label: A
    content: 倫理道德與風俗習慣
  - label: B
    content: 法律與宗教信仰
  - label: C
    content: 宗教信仰與風俗習慣
  - label: D
    content: 法律與風俗習慣。
- id: doc_111_桃園_中興_社會_公民_g7s2e1_s1_20
  section: 1
  number: 20
  type: single
  page: 4
  stem: 白紙黑字訂立的學校規定，使學生知道哪些事可以做、哪些事情不可以做，若有問題亦可向學校申訴，請問校規是學生所共同遵循的哪一種社會規範?
  options:
  - label: A
    content: 倫理道德
  - label: B
    content: 宗教信仰
  - label: C
    content: 風俗習慣
  - label: D
    content: 法律。
- id: doc_111_桃園_中興_社會_公民_g7s2e1_s1_21
  section: 1
  number: 21
  type: single
  page: 4
  stem: 勞動部對於颱風天勞工是否要出勤表示：「雇主應以安全為首要考量，如有違反勞動基準法之規定，勞工可撥打1995專線申訴」上述內容說明下列哪種事實?
  options:
  - label: A
    content: 以法律規範規定外在行為
  - label: B
    content: 以宗教力量感化人心
  - label: C
    content: 以道德力量約束雇主
  - label: D
    content: 以社會規範降低颱風帶來的損失。
- id: doc_111_桃園_中興_社會_公民_g7s2e1_s1_22
  section: 1
  number: 22
  type: single
  page: 4
  stem: 宜蘭有豐富的人文與自然景觀，觀光業興盛，宜蘭冬山鄉的伯朗大道，整片綠油油的稻田成為新興觀光景點，不過卻有觀光客闖進田裡拍照破壞稻田，不僅破壞美景，稻田的損失亦須農民自行負責。
    請問，若農民覺得心有不甘，想要向法院提告要求觀光客賠償稻田損失，請問是因為遊客違反下列哪種社會規範？
  options:
  - label: A
    content: 風俗習慣
  - label: B
    content: 法律
  - label: C
    content: 倫理道德
  - label: D
    content: 宗教信仰。
- id: doc_111_桃園_中興_社會_公民_g7s2e1_s1_23
  section: 1
  number: 23
  type: single
  page: 4
  stem: 依照《警察職權行使法》規定警察盤查人民時，需向民眾表示其為警察之證明，且查驗完畢後，除非民眾為通緝犯或是有足以認定其有明顯危害自身或公共利益的事實，警察才可以做進一步的執法；另外若警察需要搜索民眾個人財產時，依據《刑事訴訟法》必須向法院申請搜索票或取得民眾同意，才能進行搜索；若民眾於過程當中有任何疑慮，可以在過程中錄影蒐證或是向警員申請異議單，且員警必須隨身攜帶異議單。
    請問依照上文，下列何者為非？
  options:
  - label: A
    content: 利用法律規範去限制公權力惡意使用的機率
  - label: B
    content: 透過法律明確具體的條文避免警察濫用職權隨意搜索侵害人民權利
  - label: C
    content: 若警察沒有隨身攜帶異議單，便是違法行使公權力
  - label: D
    content: 民眾在盤查過程中錄影為侵犯警察隱私權，所以不能在盤查過程中錄影。
- id: doc_111_桃園_中興_社會_公民_g7s2e1_s1_24
  section: 1
  number: 24
  type: single
  page: 4
  stem: 下列關於各種常見「社會規範」的說明，哪一敘述觀念正確？
  options:
  - label: A
    content: 違反倫理道德只會受到良心的譴責，沒有任何法律問題
  - label: B
    content: 宗教信仰是以各種經典和戒律來約束人的行為
  - label: C
    content: 民眾可以透過正義鄉民的力量，懲罰違反法律的人
  - label: D
    content: 違反風俗習慣並未具有一定的約束作用。
