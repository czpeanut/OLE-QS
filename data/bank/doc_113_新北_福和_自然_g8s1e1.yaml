  group_stem: "【閱讀理解題】\n「天氣瓶」，又稱「風暴瓶」，可藉由觀察瓶中的液體呈現澄清狀態或出現白色星狀、雪花狀結晶來判斷天氣的好壞。「天氣瓶」是一個雙溶劑系統，利用物質在不同溫度、不同溶劑下溶解度的差異，產生變化萬千的晶體型態，極具觀賞價值。台彎化學教育「改良式天氣瓶」一文中指出，將「天氣瓶」中溶液的基本配方修正為硝酸鉀\
    \ 4.0g、氯化銨 4.0g、蒸餾水 52.2g、樟腦 13.4 公克、酒精 50.0g 的比例，更容易得到結晶。天氣瓶做法為：把氯化銨和硝酸鉀溶解在水裡，再把樟腦溶解在酒精中，兩瓶液體一混合，就會有白色結晶析出。把這瓶混合物加熱至結晶消失，然後當溫度下降到\
    \ 31.4℃以下時，結晶便會再重新出現。下表即為天氣瓶中各成分在不同溫度、不同溶劑(水、酒精)的溶解度數據：\n\n| 溫度 (℃) | 物質在水中的溶解度\
    \ (Xg / 100g 水) 硝酸鉀 | 物質在水中的溶解度 (Xg / 100g 水) 氯化銨 | 物質在水中的溶解度 (Xg / 100g 水) 樟腦\
    \ | 溫度 (℃) | 物質在酒精中的溶解度 (Xg / 100g 酒精) 硝酸鉀 | 物質在酒精中的溶解度 (Xg / 100g 酒精) 氯化銨 | 物質在酒精中的溶解度\
    \ (Xg / 100g 酒精) 樟腦 |\n|---|---|---|---|---|---|---|---|\n| 20 | 31.60 | 37.20\
    \ | 0.04 | 20 | 0 | 0.11 | 233.6 |\n| 30 | 45.30 | 41.40 | 0.07 | 30 | 0 | 0.14\
    \ | 270.3 |\n| 40 | 61.30 | 45.80 | 0.08 | 40 | 0 | 0.16 | 306.7 |\n| 50 | 85.50\
    \ | 50.40 | 0.10 | 50 | 0 | 0.18 | 370.4 |\n\n由表格中的數據可知，硝酸鉀和氯化銨在水中溶解性佳、在酒精中溶解性極差，而樟腦則與之相反，那麼天氣瓶中的結晶到底是何物質呢？\n\
    \    Tanaka, Hagano, Kuno & Nagashima（2008）研究發現：以 X 光繞射分析得出天氣瓶內的結晶為樟腦晶體，而不是硝酸鉀或氯化銨的結晶。另一方面，硝酸鉀、氯化銨以及水，主要的作用為促使樟腦晶核(晶體的成長中心)的形成，進而產生小的星狀、雪花狀結晶。換言之，形成小雪花是因為冷卻較快時，樟腦迅速產生較多的晶核而分別結晶。當溫度降低很慢沒有產生晶核時，則結晶以「擴散」的方式成長，使結晶變長而成為樹枝狀。\n\
    請依以上敘述回答問題 38～40 題。"
