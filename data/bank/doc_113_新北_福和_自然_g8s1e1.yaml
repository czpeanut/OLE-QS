- id: doc_113_新北_福和_自然_g8s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '小姿做水的密度測量實驗，她的步驟如下：

    步驟一：調整上皿天平兩端之校準螺絲，進行歸零。

    步驟二：將水倒入量筒，並置放於天平左盤稱得總質量為 100g，如下圖(四)所示。

    步驟三：觀察水位刻度在 80 mL 處，記錄水的體積為 80 mL。

    步驟四：計算出水的密度：$100\div 80=1.25$（g／mL）。

    但是小姿發現水密度的實驗數據跟真實數據相差太多。

    請問造成水密度實驗數據跟真實數據相差太多的原因，下列何者較為合理？'
  options:
  - label: A
    content: 體積測量誤差太大，應該以測量體積較準確的燒杯取代量筒作為測量水體積的容器
  - label: B
    content: 質量測量誤差太大，應該以測量質量較準確的電子天平取代上皿天平作為測量質量的儀器
  - label: C
    content: 沒有把步驟二中測得的數據扣掉空量筒的質量。
  - label: D
    content: 步驟四中計算方法錯誤，水密度正確算法及答案為：$80\div 100=0.8$（g／mL）。
  assets:
