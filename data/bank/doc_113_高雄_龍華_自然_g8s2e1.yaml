  group_stem: '閱讀測驗（閱讀完下面文章回答34~35）

    眼鏡的鼻墊為什麼會綠綠的？那是青苔嗎？

    拿下你的眼鏡看一下，鼻墊上面有綠綠的東西嗎？

    對普遍戴眼鏡的亞洲人而言， 由於我們的輪廓不若歐洲人那般深邃立體， 所以，「鼻墊」的舒適度會大大影響眼鏡的配戴感，多了一對鼻墊，眼鏡變得更好戴，但也如宿命般，「銅綠」的問題出現了！幾乎每天接觸鼻樑兩側的鼻墊們，也等於長時間接觸皮膚的汗水與油脂，還有空氣中的髒汙、微塵等，這些都會堆積在眼鏡的小小零件上。綠綠的東西不是從鼻墊長出來的，大家不妨仔細看看眼鏡的結構，若你的鼻墊是由支架金屬（鼻架）來支撐，更可能會因為金屬含有銅合金成分或是表面鍍銅，而與酸性物質（汗水、雨水）、或是在長時間的氧化下，產生化學反應，生成綠綠的物質卡在鼻墊上，甚至是在眼鏡的其他地方發現，這便是所謂的「銅綠（亦稱銅鏽）」，看起來很像發霉，但它不是青苔喔！

    銅綠的主要成分化學式為$\text{Cu}_{2}(\text{OH})_{2}\text{CO}_{3}$，由此可知，除了銅之外，水、氧氣、二氧化碳皆含有銅綠的生成元素，這些都存在於空氣中，讓銅綠就像野草一樣，春風吹又增，換過鼻墊又出生。「銅綠」不溶於水，有高度附著力，若不處理，這坨物質會持續反應、變大、變黑，等同累積更多髒東西在您的眼鏡上，或是讓細菌有藏匿的地方。

    如果您不想眼鏡鼻墊綠意盎然，像是走在春天的草地上，那麼有兩個簡單解決方案：

    方法一：找專家幫忙

    鼻墊不僅影響著眼鏡的舒適度，更是影響整體配戴體驗的關鍵。因此，定期進行專業的鼻墊保養是非常必要的。不妨偶爾帶著您的眼鏡去“泡個澡”，讓專家幫您做個全面的保養，他們會運用超音波清潔機，將鼻墊恢復如新，並更換鼻墊上的螺絲，讓您的眼鏡焕然一新。您可能不知道，其實眼鏡鼻墊是可以免費更換的。

    方法二：選擇純鈦鼻墊

    選擇純鈦鼻墊，就像為您的眼鏡穿上一件防風雨的外套。由於純鈦不易受到氧化侵蝕，所以您再也不用擔心鼻墊會變色。這種鼻墊不僅具備抗氧化特性，還能長時間保持原有外觀。

    文章摘自 http://www.soeyewear.com/Article/Detail/2116 發表日期：2019-05-11

    文章摘自 https://ai-dai.com/Blog/View?Id=41 發表日期 2023-12-07'
