- id: doc_113_高雄_龍華_自然_g8s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 若有一化學反應式寫成 $\text{W}_{2}\text{X}+2\text{YZ} \xrightarrow{\triangle} 2\text{WZ}+\text{X}\downarrow+\text{Y}_{2}\uparrow$。關於此反應式的說明，何者正確？
  options:
  - label: A
    content: 箭頭上方的「△」代表此反應需於錐形瓶中進行
  - label: B
    content: $\text{W}_{2}\text{X}$前未加數字，代表係數為1
  - label: C
    content: 此反應的反應物包括WZ、X 和$\text{Y}_{2}$，且$\text{Y}_{2}$為氣體
  - label: D
    content: 「↓」代表反應的過程中，X的量會越來越少。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 理化
      code: 1-2
      title: 反應式與化學計量
      chapter: 第1章 化學反應
    textbook: 八下理化 1-2 反應式與化學計量
    labeled_by: ai
