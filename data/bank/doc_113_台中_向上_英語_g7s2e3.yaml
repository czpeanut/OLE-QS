    Benson: Do you know the Taj Mahal?

    Jerry: You mean the temple in Thailand?

    Benson: No, the Taj Mahal is in India, and it’s a mausoleum for the King Shah
    Jahan and his favorite wife, Mumtaz Mahal.

    Jerry: Cool. They must live there happily and enjoy their life a lot, right?

    Benson: Yes and wrong. In fact, they don’t live there. They REST there forever.

    Jerry: Why? Are they that tired?

    Benson: No, you dummy. They died and REST in the Taj Mahal.

    Jerry: Haha… It turned out that I misunderstood the meaning of a mausoleum. Well,
    tell me more about it.

    Benson: The story behind the Taj Mahal is all about love. King Shah Jahan and
    Mumtaz Mahal fell in love at a young age. Sadly, Mumtaz Mahal lost her life at
    age 37. Shah Jahan cried for days and didn’t want to see everyone. To show his
    love for Mumtaz Mahal, he built the Taj Mahal, and it took almost twenty years
    to build it. After Shah Jahan died, people rested the king with Mumtaz Mahal in
    the Taj Mahal to make their love last for good.

    Jerry: Good to know. I hope one day I can take a trip to India for the Taj Mahal.
    Thanks for sharing.

    Benson: Anytime!


