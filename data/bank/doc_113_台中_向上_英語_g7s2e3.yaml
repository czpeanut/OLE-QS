    Jahan and his favorite wife, Mumtaz Mahal.

    Jerry: Cool. They must live there happily and enjoy their life a lot, right?

    Benson: Yes and wrong. In fact, they don’t live there. They REST there forever.

    Jerry: Why? Are they that tired?

    Benson: No, you dummy. They died and REST in the Taj Mahal.

    Jerry: Haha… It turned out that I misunderstood the meaning of a mausoleum. Well,
