  group_stem: '(34-37)

    The cassowary is a large bird in the rainforests of Australia and New Guinea.
    It is one of the heaviest birds in the world. Cassowaries have strong legs, colorful
    necks, and a “casque” on their head, making it look like wearing a strange hat.
    They cannot fly, but they are good runners and swimmers.

    Cassowaries are shy but can be dangerous if they feel threatened. They have sharp
    claws on their feet and can kick with full power. These birds usually eat fruits,
    insects, and other small animals. They help the forest by spreading seeds from
    the fruits they eat.

    Father cassowaries take care of the eggs. After the mother cassowary lays the
    eggs, she leaves, and the father cassowary sits on them for about 50 days until
    they hatch. He also takes care of the chicks after they are born.

    Sadly, cassowaries’ population is getting smaller each year. In 2015, there were
    about 4,000 cassowaries. In 2020, the number went down to 2,500. By 2024, there
    were only 1,500. Although the change of weather and other animals eating their
    eggs may somehow affect the population, the main problem for the great drop of
    their number was because people cut down forests and built roads. To stop this,
    we should protect the rainforest, build safe road crossing for animals, and teach
    others about saving wildlife. If we don’t act now, we may no longer see these
    strange but beautiful animals in the near future.


     heaviest 最重的 threatened 受威脅的 claws 爪子 lay 下(蛋) hatch 孵化 population 數量 although
    雖然 affect 影響 wildlife 野生動物'
