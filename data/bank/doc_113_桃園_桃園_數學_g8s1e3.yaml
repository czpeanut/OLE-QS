  stem: '小桃利用配方法解一元二次方程式 $2x^{2}-6x-3=0$，下列為她的解題過程，請問他在哪一步開始發生錯誤？

    第一步：$x^{2}-3x=3$

    第二步：$x^{2}-3x+(\frac{3}{2})^{2}=3+(\frac{3}{2})^{2}$

    第三步：$(x-\frac{3}{2})^{2}=\frac{21}{4}$

    第四步：$x-\frac{3}{2}=\pm\sqrt{\frac{21}{4}} \rightarrow x=\frac{3\pm\sqrt{21}}{2}$'
