  stem: 子貢曾問老師孔子說：「管仲是沒有道德的人吧！齊桓公殺公子糾時，管仲不能為自己原來的主人挺身而出求情，反做了齊桓公的宰相。」孔子說：「管仲做齊桓公的宰相，輔佐齊桓公稱霸諸侯，抵禦北方外族的入侵。如果沒有管仲，恐怕我們還要受外族統治，衣服要改換成外族服飾，披頭散髮尌像野蠻人的樣子。」請問：依據孔子的回答，孔子認為「我們」與外族是以何者為區隔呢？
