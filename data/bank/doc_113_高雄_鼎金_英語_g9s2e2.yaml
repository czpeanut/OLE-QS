  group_stem: "2. Smartphones are so common that you can see people talking on smartphones\
    \ at any time and at any place. People of all ages use smartphones. They use smartphones\
    \ to do many things, like chatting with friends, making dates, surfing the Net,\
    \ and looking for useful information they need. People can almost do everything\
    \ the computer does with their smartphones.\n  However, smartphone users should\
    \ know that there are some things they must be careful about, like the phone ring\
    \ volume control. Have you had any unpleasant experiences of being bothered by\
    \ the loud phone ring? When you are taking the train to a far place and just beginning\
    \ to enjoy your quiet sleep, suddenly, you are woken up by a sharp and loud phone\
    \ ring. It should be a very terrible experience. So, always remember to turn down\
    \ your phone’s ring volume in public.\nvolume control 音量控制, unpleasant 不愉快的, bother\
