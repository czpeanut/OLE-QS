- id: doc_113_高雄_鼎金_英語_g9s2e2_s4_28
  section: 4
  number: 28
  type: single
  page: 3
  stem: What is the reading about?
  options:
  - label: A
    content: The wide use of AI.
  - label: B
    content: The history of AI.
  - label: C
    content: When AI will take away all the jobs.
  - label: D
    content: Why students can’t use AI.
  group_stem: "1.   What is the most popular topic these days? The answer is AI―artificial\
    \ intelligence. Is AI a new idea? No, it isn’t. In fact, it started in 1950s.\
    \ However, it didn’t develop successfully from 1950s to 1990s. Then scientists\
    \ developed machine learning. From it, they found the skills of deep learning.\
    \ Since 2010s, AI has been a hotter and hotter topic and become a part of our\
    \ lives.\n  Now AI is used widely. For example, it helps doctors find out how\
    \ to treat sick people faster. It can give us the latest information on the Net\
    \ or show what we may need and want to buy. If we have any questions after we\
    \ buy something, we don’t need to make a call. AI can answer our questions right\
    \ away through the computers or apps. When we plan to take a trip, it can provide\
    \ us the information about the hotels, the transportation, and the best routes.\
    \ Then we can have a better plan for our trip. AI is also used to make self-driven\
    \ cars. Besides, AI is used to play games like chess, make smarter robots, and\
    \ help farmers on the farm.\n  Can AI be helpful for teachers and students? Of\
    \ course. AI is a useful tool in education. Teachers can know how students will\
    \ perform and what problems students may have, so teachers can offer help to students\
    \ earlier. Students can get more information in different languages or from anywhere\
    \ in the world, too.\n  Although AI is useful and helpful, some people worry that\
    \ they may lose their own jobs. Some education experts also worry students may\
    \ depend too much on AI or that they may use AI to cheat. However, AI won’t take\
    \ away all the jobs, and students should be taught how to use AI wisely. All of\
    \ us have to learn to work with AI to save our time and do things better.\n\n\
     develop 發展 scientist 科學家\ntransportation 交通運輸系統 route 路線\neducation 教育"
