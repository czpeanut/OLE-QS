  group_stem: '4.   Lisa and her classmates are talking about something online.


    Lisa: I usually go shopping alone or with my cousin, Amy.  I buy something cute
    but cheap.  It often doesn’t cost me much, but it helps me a lot.

    Ben: I always go to the bathroom.  By taking a hot bath, I let the stress out.  Believe
    it or not, I feel much better after staying there for half an hour.

    Lily: I talk with my family.  My bad feeling runs out with my words out of my
    mouth.  I really thank my dad and mom, who can always lend an ear.

    Judy: I will eat snacks.  Once I even ate up all the cookies at home.  Do I worry
    about my weight?  Of course.  So I need someone to stop me from eating too much.

    Tom: I listen to music.  I like all kinds of music.  Music is my best friend in
    life.  No matter how sad or bad I feel, when I listen to music, the bad feelings
    flow out of my body and mind with the melody.


