- id: doc_113_台南_復興_自然_g7s2e3_s2_44
  section: 2
  number: 44
  type: single
  page: 5
  stem: 下列有關魚翅的相關敘述，何者正確？
  options:
  - label: A
    content: 味道濃郁，具有極高的營養價值，對健康也很有效助
  - label: B
    content: 鯊魚除魚翅之外，其他的部位價格低廉，故可丟棄於海中
  - label: C
    content: 魚翅是種珍貴的食材，應大量捕殺鯊魚並製成魚翅羹
  - label: D
    content: 魚翅是細絲狀軟骨，主要成分為膠原蛋白
  group_stem: '(四)請在閱讀下列敘述後，回答 44~45 題：

    生物與環境環環相扣，物種之間也會相互影響，特別是掠食動物在生態上更扮演了極重要的生態平衡角色地位，如鯊魚處在海洋食物鏈最頂端的位置，數量一旦下降，將導致中、小型魚類因失去天敵而數量暴增，間接造成海洋中植物、藻類及浮游生物等急遽減少。此外，鯊魚亦為食腐肉的動物，它們會吃掉垂死或已死亡的動物，減少病菌大肆傳播的機會。

    然而，由於許多人嗜吃魚翅，加上近十年來漁業技術的發達，海洋中的鯊魚正面臨著前所未有的生存壓力。根據研究，全球有 110 種鯊魚正處在瀕臨滅絕的邊緣，而魚翅的消費正是刺激捕鯊活動的根源。魚翅是以鯊魚的背鰭、胸鰭與尾鰭加工而成的一種食材，由於數量少、價格高，所以一直被認為是種珍貴的佳餚。長久以來，人們認為魚翅除了美味，也有極高的營養價值，事實上，魚翅是細絲狀的軟骨，主要成分為膠原蛋白，本身沒有味道，它的美味來自與它一起烹煮的湯頭與配料，而研究顯示魚翅的營養價值不高，對於健康其實也沒有特別的功效。

    雖然鯊魚的魚肉、顎骨、牙齒、軟骨與魚肝等，也可作為食用、紀念品及藥物等用途，但其價值無法與市價每公斤高達數仟至數萬的魚翅相提並論，造成漁民捕鯊時，常因為考量其船艙冷凍的空間有限，而將四片魚翅割下後，不將魚身帶回，而是丟回海中任其死亡。目前國際上也正試著積極立法限制捕獵及數量，但如果人們對食用魚翅的需求不減少，捕殺和買賣就無法根除。「保護鯊魚，拒吃魚翅」不只是口號，透過實際行動才能使捕獵鯊魚的業者失去市場，海洋才會更健康。'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
