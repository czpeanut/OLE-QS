    take a nap.

    Some people pick up seashells and sand dollars. They put seashells and sand dollars
    in a bucket. Watch out ! That shell may be an animal''s home.

    Some people play in the water. They run in and out of the waves. Some people go
    surfing. They paddle their surfboards far out into the water. Then they stand
    on the boards and ride the waves back to the beach.

    Not everyone likes to do the same things at the beach. But one thing is for sure---you
    have a good day there.'
