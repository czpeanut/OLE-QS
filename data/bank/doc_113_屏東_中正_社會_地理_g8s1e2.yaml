    2025」為中國近年來提出的政策，以產業升級為其發展核心。以資訊技術來說，中國向來是全球最大半導體晶片進口國，而中國政府的總體策略是減少對進口半導體的依賴，中國的提出「中國製造
    2025 計畫」，訴求之一就是在 2025 年自製率（國內自製的比率）達到 70％。這個政策促使中國企業紛紛進軍半導體產業，2014～2018 年中國半導體產業併購交易量，在全球占比從
    48％增至 72％，目的主要是提高市場地位，增加市場占比，尋找新興應用等。不僅如此，在「中國製造 2025」的基礎上，更提出「中國標準 2035」，決心在新一代高科技如
    AI、5G、大數據、雲端運算等領域超前世界各國，透過研發、申請專利，進入全球製造業強國之前列。請回答24-26 題
