- id: doc_113_台中_向上_自然_g7s1e3_s1_42
  section: 1
  number: 42
  type: single
  page: 3
  stem: 上述哪些疾病與神經系統異常有關？
  options:
  - label: A
    content: 乙丙丁
  - label: B
    content: 甲乙丁
  - label: C
    content: 甲丙丁
  - label: D
    content: 甲乙丙
  group_stem: '以下為不同疾病的成因，請回答下列問題：


    | 疾病名稱 | 說明 |

    | --- | --- |

    | (甲) 肌肉萎縮症 | 肌肉萎縮不是傳染性疾病，而是一種基因缺損的疾病。有缺損的基因使肌肉細胞功能逐漸喪失，最後因波及呼吸或心臟肌肉，導致患者呼吸困或心臟停止跳動而結束生命。
    |

    | (乙) 腦中風 | 是因為腦血管阻塞或腦血管破裂而造成突發性的大腦局部或全部的功能失調，腦部組織受到壓迫或得不到足夠的血液，而導致機能受損或壞死。其症狀進行快速，輕者可以使人半身不遂或言語失常，嚴重的可能當場死亡。
    |

    | (丙) 漸凍人 | 患者的運動神經元會快速凋亡，在兩三年內逐漸出現四肢癱瘓、無法言語、無法吞嚥，最後呼吸衰竭的症狀，以致於必須長期依賴呼吸器維生，外觀看來就像植物人一樣，然而他們的意識卻非常清醒，感覺也正常。
    |

    | (丁) 小腦失調障礙 | 因小腦神經細胞被破壞而發生的症狀，患者走路時左右搖晃、容易跌倒，臉部肌肉也無法協調，說話口齒不清且緩慢、吞嚥困難。目前仍沒有有效藥物可以治癒小腦萎縮症，僅能透過復健舒緩症狀並減緩惡化。
    |'
