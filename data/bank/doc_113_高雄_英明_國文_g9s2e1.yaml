  group_stem: "丁、\n    北宋 靖康元年(西元1126 年)正月，金軍圍攻汴京(今河南省 開封市)，並挖掘地道進行攻城。尚書右丞李綱指揮宋軍用草包裹火炮(即火球)，點火後扔進地道內，結果草燃炮發，地道內的金軍被燒傷、焚斃、熏死者甚眾。之後，李綱登城指揮宋軍，在夜間發霹靂炮打擊金軍，炮發火起，聲如霹靂，擊退了金軍對汴京的初次進攻。\n\
    \    金軍撤圍後，認真總結經驗，從被俘的宋軍和工匠中，學得了火器製造與使用之法，即進行仿製，用於作戰。靖康元年閏十一月，金軍第二次圍攻汴京，採用火球、火藥箭與冷兵器相結合的戰術，攻入汴京，滅亡了北宋。\
    \                                         (節錄自中國古代兵器)"
