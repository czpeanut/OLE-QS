- id: doc_113_高雄_英明_國文_g9s2e1_s2_49
  section: 2
  number: 49
  type: single
  page: 9
  stem: 根據本文，下列說明何者正確？
  options:
  - label: A
    content: 《說文解字》詳細說明小暑三候的定義與自然現象
  - label: B
    content: 小暑期間所吹的風變得更加溫熱，氣溫也逐漸升高
  - label: C
    content: 小暑氣溫變化緩慢，直到正午氣溫才和大暑一樣高
  - label: D
    content: 小暑接近尾聲時頻繁出現雷雨，大暑時降雨才減緩。
  group_stem: "庚、\n    《說文解字》裡對於暑的解釋只有一個字──熱。暑既是熱的意思，小暑當然意指小熱，而大暑則是大熱。從小暑到大暑，彷彿老式柴灶裡剛剛點燃的柴禾，在鼓風機或者大蒲扇的作用下，火頭愈燃愈旺，溫度愈來愈高。\n\
    \    雖然同樣都是熱，但小暑與大暑絕不僅僅只有大小程度的不同，還有儀態上的細微差別。民諺有云：「小暑大暑，上蒸下煮。」蒸與煮比起來，蒸的儀態較從容，而煮總給人一種冒冒失失的感覺。小暑與大暑的差別正在於此，大暑狂躁，而小暑不迫。無論作物生長還是氣候變化，抑或是人的情緒波動，小暑看起來都是漸漸地，慢慢地。\n\
    \    每個節氣都有三候，小暑亦不例外：「一候溫風至，二候蟋蟀居壁，三候鷹如鷙。」與其他節氣相比，小暑的三候極有層次感。「倏忽溫風至，因循小暑來。」風是節氣的報幕員，小暑的風，較先前大不相同，已有炙、烤之感，人如在天地間一個大蒸籠中。風報完幕之後，蟋蟀就登場了，但此時的蟋蟀羽翼剛剛長成，仍穴居土壁，真可以用安安靜靜的美男子來形容。再來與蟋蟀鮮明對比的是鷹，牠們從早到晚忙著同一件事情，那就是練習搏殺之技。\n\
    \    小暑前後，風放慢了速度，雲減緩了腳步，就連日落與月出，也要較往常來得更加拖沓。同樣變化的還有氣溫，它以人們可以感知的速度一點一點攀升，期間，午休的人多了，上山的人少了，而學校裡，學生們都放暑假了，大街上，正午時分更是難得瞧見幾個人影。無處躲藏的人們急需就近找一處避暑勝地，或者百貨公司，或者臨水涼亭……\n\
    \    隨著時間的推移，雷雨來得愈來愈頻繁了。雷雨來時，黑雲翻墨，白雨跳珠。這樣的天氣不宜外出，只適合待在屋裡，膽子大的可以趴在窗口欣賞遠處的電閃雷鳴，看霹靂震天，就好比看一部好萊塢大片，膽子小的可以捂上耳朵，也可以邀請幾個要好的朋友聊聊有意思或無意思的近來。\n\
    \    顯然，於漫長的人生而言，於四時的晴雨而言，小暑只是開始，遠未到結束時候。\n                                  \
    \                            (節選自潘玉毅 小暑漸漸)"
