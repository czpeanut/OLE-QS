  page: 10
  stem: "一個人的人生，什麼都可以被拿走，只有夢想不能      /林懷民 \n    2008 年農曆大年初五，八里大排練場發生大火。當天晚上，我打電話召集雲門幹部開會到清晨六點左右，把新聞稿寫好，告訴所有人：所有國內外合同都會履行，演出照常。我們沒有時間難過。清理火場和趕製道具同時進行，並如期展開巡演。演出、做事、尋找新的基地等，一切重建的步伐馬不停蹄地進行。同時，技術人員出國上課，學燈光、舞臺的專業技術，行政人員研究各種相關法律，一起努力蓋出新的雲門基地。……\
    \ \n    美國歌手巴布狄倫說：「有一件事是確定的，這個世界不但不是由上帝掌管，也不是由魔鬼掌管。」是好是壞，是苦是樂，都由我們自己掌控。如同俄國作家杜斯妥也夫斯基在小說中所寫：「明天太陽升起時，我要越過那道牆。」不管碰到任何事情，都不要怕失敗。永遠要記得，堅持夢想和初心，是世間最大的力量。\
    \                               (節錄自Cheers 快樂工作人網站) \n \n讀完以上內容，請問同學們，對你來說，人生裡什麼是不能被拿走的呢？是夢想、財富、家庭?\
    \ 抑或是善良、愛、誠實、自由、手機、網路、宗教信仰……。（可參考使用或自行發想） \n    現在，請你以「一個人的人生，什麼都可以被拿走，只有□□不能」為題目，並舉例說明，為何□□對你來說，絕對不可被拿走，對你的意義為何？未來，你又會如何運用或使用？\
    \ \n(備註: □□以5 字為限) \n  \n※注意： \n1.一定要寫題目。 \n2.請以黑色原子筆書寫。 \n3.請勿抄寫所給說明作為文章內容。 \n\
    4.文體除詩歌之外，其他文體不拘。"
