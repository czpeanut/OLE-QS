  group_stem: "己、\n    晉平公問於師曠曰：「吾年七十欲學，恐已暮矣！」師曠曰：「何不炳燭乎？」平公曰：「安有為人臣而戲其君乎？」師曠曰：「盲臣安敢戲其君乎！臣聞之：少而好學，如日出之陽；壯而好學，如日中之光；老而好學，如炳燭之明。炳燭之明，孰與昧行乎？」平公曰：「善哉！」\
    \           （劉向 說苑）"
