  group_stem: "丙、\n    上官飛道：「十年前，我已想殺你，你可知道為了什麼？」荊無命拒絕回答 ── 他一向只問，不答。上官飛突然激動起來，目中更充滿了怨毒之色，厲聲道：「這世上若是沒有你，我就可活得更好些，你不但搶走了我的地位，也搶走了我的父親，自從你來了之後，本來屬於我的一切，就忽然都變成了你的。」\n\
    \    荊無命冷冷道：「那也只怪你自己，你一向比不上我。」上官飛咬著牙，一字字道：「你心裡也明白並不是為了這緣故，那只因你是我父親的私生子，我母親就是被你母親氣死的。」荊無命死灰色的眼睛突然收縮，變得就像是兩滴血。兩滴早已乾枯，變色了的血。\n\
    \    上官飛道：「其實自從你來的那一天，我已經知道了，自從那一天，我就在等著機會殺你！」荊無命冷冷道：「你的機會並不多。」上官飛道：「那時你在我父親眼中，就像是殺人的刀，我若毀了他的刀，他絕不會饒我，但現在你只不過是塊廢鐵，你的生死，他已不會放在心上。」\n\
