- id: doc_113_高雄_英明_國文_g9s2e1_s2_41
  section: 2
  number: 41
  type: single
  page: 7
  stem: 造成上官飛和荊無命決鬥的主因是什麼？
  options:
  - label: A
    content: 荊無命殺死上官飛的母親
  - label: B
    content: 上官飛想知道荊無命不為人知的祕密
  - label: C
    content: 上官飛想替父親除掉沒有用處的部下
  - label: D
    content: 上官飛嫉恨荊無命奪走自己所擁有的一切。
  group_stem: "丙、\n    上官飛道：「十年前，我已想殺你，你可知道為了什麼？」荊無命拒絕回答 ── 他一向只問，不答。上官飛突然激動起來，目中更充滿了怨毒之色，厲聲道：「這世上若是沒有你，我就可活得更好些，你不但搶走了我的地位，也搶走了我的父親，自從你來了之後，本來屬於我的一切，就忽然都變成了你的。」\n\
    \    荊無命冷冷道：「那也只怪你自己，你一向比不上我。」上官飛咬著牙，一字字道：「你心裡也明白並不是為了這緣故，那只因你是我父親的私生子，我母親就是被你母親氣死的。」荊無命死灰色的眼睛突然收縮，變得就像是兩滴血。兩滴早已乾枯，變色了的血。\n\
    \    上官飛道：「其實自從你來的那一天，我已經知道了，自從那一天，我就在等著機會殺你！」荊無命冷冷道：「你的機會並不多。」上官飛道：「那時你在我父親眼中，就像是殺人的刀，我若毀了他的刀，他絕不會饒我，但現在你只不過是塊廢鐵，你的生死，他已不會放在心上。」\n\
    \    「叮」的一聲，他龍鳳雙環已出手，冷冷接著道：「現在我隨時可殺你！」\n    荊無命沉默了很久，緩緩道：「看來你好像什麼事都知道。」上官飛道：「我至少比你想像中高明得多。」荊無命突然又笑了笑，道：「只可惜你還有一件事不知道。因為這是我的祕密，我從未告訴過別人。我若告訴了你，你就得死！」上官飛道：「你要我死。」荊無命道：「沒錯，因為活著的人，沒有人能知道這祕密。」\n\
    \    上官飛瞪著他，突然縱聲大笑了起來。這事的確很可笑，一個手殘之人，居然還想要別人的命？上官飛大笑道：「你想用什麼來殺我？用你的頭來撞，用你的嘴來咬？」荊無命的回答很簡短，也很妙，只有兩個字\
    \ ──「不是。」\n    上官飛笑聲突然停頓，龍鳳雙環已脫手飛出。「一寸短，一寸險」，龍鳳雙環本是武林中至絕至險之兵刃，這一著「龍翔鳳舞脫手雙飛」更是險中之險，若非情急拚命，或是明知對方已被逼入死角時，本不該使出這一著。這一著若是使出，對方也就很難閃避得開。但就在這時，劍光已飛出。劍光只一「閃」已刺入了上官飛咽喉。劍鋒入喉僅七分。\n\
    \    上官飛的呼吸尚未停頓，額上青筋一根根暴露，眼珠子也凸了出來，死魚般瞪著荊無命。他死也不明白荊無命這一劍是怎麼刺出來的。荊無命也在冷冷地瞧著他，一字字緩緩道：「我的右手比左手更快，這就是我的祕密！」\n\
    \    上官飛和他同門十餘年，從未見他練過一天右手劍，所以死也不明白他這右手劍是如何練成的。但他必須相信，因為世上絕沒有比「死」更真實的事。      \
    \          (改寫自古龍 多情劍客無情劍)"
