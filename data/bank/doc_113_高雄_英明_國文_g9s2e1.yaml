  type: single
  page: 8
  stem: 根據本文，下列圖片中的(甲)應為何者？
  options:
  - label: A
    content: 鎂
  - label: B
    content: 硝化菌
  - label: C
    content: 胺基酸
  - label: D
    content: 水中懸浮物。
  group_stem: "戊、\n    魚菜共生，指的是結合水產養殖與水耕栽培的互利共生生態系統。如再配合溫室設施，將可對抗惡劣氣候，可為人類未來生活提供更美好願景的種植方式之一。\n\
    \  在系統中，利用魚的排泄物，經由水泵送到有硝化作用的蔬菜水耕（礫耕）池，其中的水中懸浮物與有害原素（有機大分子狀），經硝化菌的轉化為營養小分子（氮、磷、鉀、鎂等），以供給植物的水根吸收，輸至葉片經光合作用轉成胺基酸促使植物成長，同時也淨化了水質，再循環回魚池供給魚類健康的生長環境。這種利用水循環交換所需，使三種生物（魚、細菌、植物）互惠互利共同生長的方式。\n\
    \  目前也有不少學校已有裝置魚菜共生，要用哪一種方式端看學校的場地適合甚麼方式，一般方式有：\n  1.浮筏式：直接在浮板上種植，適合葉菜類生長，水不必太深，一般商業農場大量生產蔬菜也都用這種方式，浮板式可種多種植物如番茄、魔鬼椒、草莓等。\n\
    \  2.管根式：營養水通過水管，植物的根接觸營養水即可。\n  3.方管式：另有方形管系統設計，易於堆積，種植面積可以擴大。\n  4.垂直式：垂直農場可以減少用水的需求和對土地衝突。\n\
    \  5.氣霧栽培：將營養水變成為霧狀噴灑植物的根部，空間須密封，可種植多種蔬果。\n  6.毛細管植床：將花盆底部的排水孔封住，鋪設水管，並將上下各開一個小洞，將水管露出表面以利澆水，其形成一地下水層，在水管上鋪設不織布、石子、沙子、及吸水較好之土壤，利用毛細作用將水吸上來供植物根部吸收，如此可以將澆水時間延長。\n\
    \  7.迴轉懸吊盤式：輪轉吊盤式栽培架較地面或單層植床可提高土地利用率達80％。\n                        （改寫自新北市環境教育輔導電子報\
    \ 自給自足生態圈．魚菜共生體驗行）"
