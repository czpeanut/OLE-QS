  page: 1
  stem: '華語班的劉老師教了漫威英雄們一首謝靈運的歲暮：

    殷憂不能寐，苦此夜難頹。明月照積雪，朔風勁且哀。運往無淹物，年逝覺已催。

    英雄們紛紛表示意見，但只有一位敘述正確!請您依據對韻文的認識，選出正確的是下列哪位？'
  options:
  - label: A
    content: 鋼鐵人：這是一首平起式的律詩
  - label: B
    content: 蜘蛛人：此詩強烈悲嘆身世之飄零
  - label: C
    content: 雷神索爾：三四句用外在豪壯之景映襯出自身的微渺
  - label: D
    content: 美國隊長：全詩巧妙運用了敘事、寫景、抒情交融的寫法。
