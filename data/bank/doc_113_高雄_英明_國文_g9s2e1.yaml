  stem: 有關詞、曲的比較，以下選項的說明何者正確？
  options:
  - label: A
    content: 詞有詞牌，曲有曲牌，二者不ㄧ定要入樂，也多和內容無關
  - label: B
    content: 詞和曲除了正文之外都可加襯字，用以補足語氣和或描摹情態
  - label: C
    content: 詞有「詩餘」、「長短句」的別稱 ; 曲有「詞餘」、「樂府」的別稱
  - label: D
    content: 詞依字數多寡而分小令、中調、長調；曲則依科白有無而分小令和散套。
