- id: doc_111_高雄_林園_社會_歷史_g7s2e2_s1_22
  section: 1
  number: 22
  type: single
  page: 1
  stem: '某報紙社論：「最近物價狂飆，整個經濟社會在震盪著，人民生活極端困苦，誰都希望政府能夠設法徹底解決。人民實在太苦了，再提起日本投降時所設想的美麗遠景，似乎只是痴人說夢。人民現在沒有絲毫的奢望，只求有最低限度的安定生活。貧者愈貧，富者愈富，兩者之間的差距愈來愈大，這種社會實在太危險了。」文中提及「物價狂飆」，主要與下列何者的關係最密切？

    (習作)'
  options:
  - label: A
    content: 日軍帶走大量物資，導致臺灣資源短缺
  - label: B
    content: 廢除專賣制度，使人民與政府收入減少
  - label: C
    content: 臺灣資源大量輸往中國大陸以支援內戰
  - label: D
    content: 人口大量的移入，造成日常物資的缺乏
  answer:
  - C
  answer_source: answer_key_vlm
