- id: doc_111_高雄_林園_社會_歷史_g7s2e2_s1_21
  section: 1
  number: 21
  type: single
  page: 1
  stem: '歷史老師在課堂上說：「花岡一郎(賽德克族族名Dakis Nomin)與花岡二郎(族名Dakis Nawi)的名字是日本人取的，兩人既不是兄弟，也非日本人，卻進入埔里小學校就讀，
    是受到日本人精心培養的原住民青年。他們的婚姻由日本人安排，家庭生活也深受日本影響，與一般日本人幾乎相同……」根據上述的內容，老師應該正在講述哪一個主題？

    (習作)'
  options:
  - label: A
    content: 開山撫番與原住民非武裝抗日
  - label: B
    content: 教育措施與原住民傳統的變遷
  - label: C
    content: 劃界封山與原住民族群的復興
  - label: D
    content: 理蕃政策與原住民土地的流失
  answer:
  - B
  answer_source: answer_key_vlm
