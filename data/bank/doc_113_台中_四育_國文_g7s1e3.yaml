- id: doc_113_台中_四育_國文_g7s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 關於〈兒時記趣〉一文的分析，何者最正確？
  options:
  - label: A
    content: 文中動態寫土牆、花臺所建構出的山谷、叢林，靜態寫群鶴舞空、二蟲決鬥，使畫面動靜結合充滿生命力
  - label: B
    content: 末段作者不直接先點出癩蛤蟆，而是先描寫其來勢洶洶的駭人畫面，是為了製造懸疑感，亦可讓讀者更如臨其境，體會作者當下的感受
  - label: C
    content: 本文與〈夏夜〉有許多共同之處，例如：兩篇作品皆以兒童的視角書寫，以及皆善用擬人法來描摹所見之事物，使文章充滿想像力與童趣
  - label: D
    content: 作者見二蟲鬥草間，又看見二蟲被癩蝦蟆吞食，於是把癩蝦蟆趕到別的院子。這過程中他的情緒轉變是：好奇→憤怒→驚嚇。
  lesson_raw:
    title: 兒時記趣
    basis: 題目指明〈兒時記趣〉
  tags:
