    content: 懂得體諒對方，就能在即將獲勝之際去小輸對方，讓對方感受到勝利的快樂
  - label: C
    content: 無論是正式競技場或非正式比賽中，全力以赴、不留餘地，這才是尊敬比賽，有運動精神
  - label: D
    content: 優勝劣敗，弱肉強食，這是合情合理的事，強者不需要感到心軟。
