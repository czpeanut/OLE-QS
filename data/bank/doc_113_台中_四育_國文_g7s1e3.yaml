- id: doc_113_台中_四育_國文_g7s1e3_s1_41
  section: 1
  number: 41
  type: single
  page: 4
  stem: 「可憐之人，必有可恨之處」這句話在本文中的含義？
  options:
  - label: A
    content: 可憐之人因被人陷害，心中總是懷抱憤怒
  - label: B
    content: 在可憐之人的眼中，世上許多人都是可恨的
  - label: C
    content: 可憐之人的境遇往往來自於本身許多問題
  - label: D
    content: 可憐之人無論走到哪裡，都散播著可恨的負面能量。
  group_stem: "紀伯倫有一則小故事是這樣的：瑪莉太太多年來不斷抱怨對面鄰居的太太很懶惰：「那個女人的衣服，永遠洗不乾淨，看，她晾在院子裡的衣服，總是有斑點。我真的不知道，她怎麼會洗衣服都洗成那個樣子……」直到有一天，有個明察秋毫的朋友到瑪莉家，才發現不是對面的太太衣服洗不乾淨。細心的朋友拿了一塊抹布，把她家窗戶上的汙漬抹掉，說：「看，這不就乾淨了嗎？」原來是她自己家裡的窗戶髒了。\n\
    \    每一個人都曾經遇過不少憤世嫉俗的人，或者，你也有過一些看什麼都不順眼，永遠覺得命運對自己比較壞的朋友，但在傾聽他們的怨言之後，總會發現有句老話說得很妙：「可憐之人，必有可恨之處。」看到外面的問題，總比看到自己內在的問題容易些；而把錯誤歸咎給別人，也比檢討自己來得容易。於是，憤世嫉俗的人常從年輕憤怒到老，遇上有人過得比他好，都想咬對方一口，「斜視久了的眼睛看什麼都不順眼。」\
    \                     《樂觀者的座右銘》吳淡如"
