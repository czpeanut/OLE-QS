  stem: 〈音樂家與職籃巨星〉一文中，「很多人可能會認為，要花心血苦練以前，必須先衡量投資報酬率，苦練沒有什麼指望的事情，到頭來也許只是白費心血。這當然有部分的真實性，不過世事往往有出人意表者。」對於這段話的詮釋，何者最為恰當？
  options:
