    content: 確知自己將是勝方，御恩提醒夥伴：友誼賽贏歸贏，但要手下留情。
  group_stem: "小倫和阿穎看到御恩和他朋友在打籃球，於是找他們玩鬥牛。沒想到兩人一路輸得很慘，擔心輸得太難看。就在此時，御恩喊暫停，他對自己的隊友說：「畢竟是一場友誼賽，不要讓他們這麼難看！」好友謙謙也附議：「也是啦！不過畢竟是場比賽，我們不要贏太多就是了！」\n\
    \    待人為什麼應該敦厚？ 對於生活在現代社會的人們來說，不太容易感受到「敦厚」這種品德的重要性。不過，從日常生活的事件就很容易可以發現敦厚的重要。想想看，在你自己的生活當中，有沒有過這樣的經驗：你覺得當時對方如果能多為你想一點，用比較厚道的方式來對待你，那麼你的感覺會不會比較舒服？\n\
    \    前面那個打籃球的事件，就是個好例子。打籃球時你喜歡被人痛宰嗎？假設你今天跟幾個朋友打三對三鬥牛，希望來場友誼性的比賽。然而，猜拳分隊的結果，你這隊的實力差了對方一大截。幾場球打下來，對方毫不留情，讓你們這隊的分數總是掛蛋。你和隊友再怎麼拚命地搶籃板、切入，還是落得被痛宰的結果。打完球以後，你的感覺是很過癮，因為對方很有運動精神、很尊重你們？還是你會覺得有點難過？\n\
    \    我想，多數被痛宰的人都會覺得有點難過，甚至會覺得對方是故意藉此來羞辱自己。其實，如果對方能夠多為你們想一下，防守時留點餘地，不要拚命抄球、包夾，或許可以讓你們感覺開心一點。\n\
    \    我要說的重點不是在一個正式的運動競技場上，強隊就應該讓分，而是在一個非正式的比賽中，參賽者背後的心態，我們也不可忽視。如果這是一場代表學校或國家的比賽，那麼當然要賣命打。不過，在一場友誼性質的運動比賽中，當你確定自己這隊會贏時，為什麼不給輸的一方留點餘地呢？「敦厚」強調的是多為別人著想的心態，在批評別人時不要得理不饒人，在運動場上給失敗的一方留點餘地，這麼做的重點在於背後的態度，這個你如何看待輸家的態度，顯示出你是不是一個厚道的人。在籃球場上痛宰對方，或許在道德上並沒有瑕疵，但是能夠體諒對方的心情，則是更值得讚賞的品德。\n\
    <「敦厚」──多為別人想一想>  林火旺"
