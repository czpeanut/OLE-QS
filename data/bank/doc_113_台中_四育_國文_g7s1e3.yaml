- id: doc_113_台中_四育_國文_g7s1e3_s1_16
  section: 1
  number: 16
  type: single
  page: 1
  stem: 關於〈兒時記趣〉一文的分析，何者最正確？
  options:
  - label: A
    content: 本文節選自《浮生六記》，可謂作者沈復的自傳，記敘生動活潑，文筆真切自然，深情動人。
  - label: B
    content: 「作青雲白鶴觀，果如鶴唳雲端」一句是「實際描寫」，作者發揮敏銳的觀察力，清楚看見白鶴飛舞。
  - label: C
    content: 文體為記敘文，寫作手法多以視覺為主，故以「明察秋毫」為全文綱領，豐富了生活的情趣。
  - label: D
    content: 以第一人稱敘述，先分述三件趣味之事，再總結全文，採「先分後總」的寫作筆法。
  lesson_raw:
    title: 兒時記趣
    basis: 題目指明〈兒時記趣〉
  tags:
