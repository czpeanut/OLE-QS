  section: 1
  number: 43
  type: single
  page: 4
  stem: 根據本文的敘述，下列何者正確？
  options:
  - label: A
    content: 作者夫妻隨著老夫婦從早上吃飯到晚上
  - label: B
    content: 作者夫妻贈送給老夫婦魚和蔬菜
  - label: C
    content: 老夫婦堅持不肯收下任何回報
  - label: D
    content: 此事發生的季節是夏天。
  group_stem: "鄰僅老夫婦二人，灌園①為業，知余夫婦避暑於此，先來通慇勤②，並釣池魚，摘園蔬為饋③。償④其價不受，芸作鞋報之，始謝而受。\n    時方七月，綠樹蔭濃，水面風來，蟬聲聒耳；鄰老又為製魚竿，與芸垂釣于柳蔭深處。日落時，登土山，觀晚霞夕照，隨意聯吟，有「獸雲吞落日，弓月彈流星」之句。\n\
    \    少焉⑤，月印池中，蟲聲四起，設竹榻於籬下，老嫗⑥報酒溫飯熟，遂就月光對酌，微醺而飯。\n <避暑記樂>沈復\n註：①灌園：種植菜園。②慇勤：誠意周到。③饋：贈送。④償：報酬。⑤少焉：不久。⑥老嫗：老婦人。"
