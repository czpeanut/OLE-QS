  stem: 顫藻是絲狀的藍綠菌。細胞除了細胞膜外，沒有任何膜狀構造，表面有黏液鞘，在顯微鏡底下可以看見細薄的絲狀構造，體內分泌的膠狀物質把絲質在水作媒體的作用下推動,在水面作有韻律的顫動,故名。是分布最廣，種類最多的藍綠菌，其生命力極強。顫藻分布廣泛，水溝、濕地、樹皮、牆壁以及溫泉中皆可發現。顫藻生長不受季節變化的影響，一年四季都可以採到。關於顫藻，下列敘述何者正確？
