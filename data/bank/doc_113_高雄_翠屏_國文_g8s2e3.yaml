- id: doc_113_高雄_翠屏_國文_g8s2e3_s1_36
  section: 1
  number: 36
  type: single
  page: 5
  stem: 「『移情』的運用，使古典詩詞極大的增強了藝術感染力，眾多的詩人正是通過這種移情於物的手法，委婉含蓄的表達了各自複雜的內心世界。而移情也來自生活。現實生活是一切藝術的源泉，『移情』現象當然也不例外。作為人移之於物的思想感情，更只能是詩人和現實生活的關係的反映，而且是一種能動的、創造性的反映。」根據文意，下列敘述何者正確？
  options:
  - label: A
    content: 詩人透過移情，以一種熱烈奔放的方式表達了自己的內在世界
  - label: B
    content: 移情作用使古典詩詞增強其藝術感染力，也使詩人展現自己的內在精神世界
  - label: C
    content: 藝術是對一切現實的反動，反映了文人對現實的不滿與悲傷
  - label: D
    content: 所移之情來自於文人對現實生活的體悟與反思，多用來省思自身過錯
