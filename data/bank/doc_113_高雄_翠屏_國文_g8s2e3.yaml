- id: doc_113_高雄_翠屏_國文_g8s2e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 成功是失敗之母一文舉了因驕傲而失敗的例子，若要勸戒驕傲的人，下列何者最恰當？
  options:
  - label: A
    content: 成就是謙虛者前進的階梯，也是驕傲者後退的滑梯
  - label: B
    content: 三軍可奪帥也，匹夫不可奪志也
  - label: C
    content: 勤奮的人是時間的主人，懶惰的人是時間的奴隸
  - label: D
    content: 書到用時方恨少，學富五車不為多
  lesson_raw:
    title: 成功是失敗之母
    basis: 題目指明〈成功是失敗之母〉
- id: doc_113_高雄_翠屏_國文_g8s2e3_s1_18
  section: 1
  number: 18
  type: single
  page: 3
  stem: 「累積失敗的經驗，改正前番的缺點，開拓出成功的道路，這話是教人失敗時不要氣餒。」這段文字的含義，與下列何者最相近？
  options:
  - label: A
    content: 天可補，海可填，南山可移。日月既往，不可復追
  - label: B
    content: 卓越的人一大優點是：在不利與艱難的遭遇裡百折不撓
  - label: C
    content: 世界上能為別人減輕負擔的都不是庸庸碌碌之徒
  - label: D
    content: 外物之味，久則可厭；讀書之味，愈久愈深
  lesson_raw:
    title: 成功是失敗之母
    basis: 引用〈成功是失敗之母〉課文原句
- id: doc_113_高雄_翠屏_國文_g8s2e3_s1_19
  section: 1
  number: 19
  type: single
  page: 3
  stem: 「許多人邁上成功的巔峰就隕跌，成功常成為失敗的陷阱。」這段文字的含義為何？
  options:
  - label: A
    content: 成功之後反而容易失敗
  - label: B
    content: 成功之後必定會失敗
  - label: C
    content: 成功與失敗是一體兩面的觀念
  - label: D
    content: 成功後遭人陷害才會失敗
  lesson_raw:
    title: 成功是失敗之母
    basis: 引用〈成功是失敗之母〉課文原句
- id: doc_113_高雄_翠屏_國文_g8s2e3_s1_20
  section: 1
  number: 20
  type: single
  page: 3
  stem: 關於「禍福互為倚伏，成敗轉眼易位」一句，下列敘述何者正確？
  options:
  - label: A
    content: 由於禍福相依，招惹禍事也可以獲得福分
  - label: B
    content: 成敗無常，成功時更應該小心謹慎
  - label: C
    content: 禍福乃一體兩面，只能任憑造化弄人
  - label: D
    content: 成敗變化無定，因此無須致力於追求成功
  lesson_raw:
    title: 成功是失敗之母
    basis: 引用〈成功是失敗之母〉課文原句
- id: doc_113_高雄_翠屏_國文_g8s2e3_s1_21
  section: 1
  number: 21
  type: single
  page: 3
  stem: 下列選項「 」中的字，何者字音前後不同？
  options:
  - label: A
    content: 「謠」言／「遙」遠
  - label: B
    content: 「揣」想／「顓」頊
  - label: C
    content: 「湧」動／「踴」躍
  - label: D
    content: 「膾」炙人口／「檜」木
- id: doc_113_高雄_翠屏_國文_g8s2e3_s1_22
  section: 1
  number: 22
  type: single
  page: 3
  stem: 「我想那雲朵像極了舞者，將藍天當成舞臺，恣意的在上頭揮灑絕佳的舞技，一會兒旋轉柔軟身體，一會兒跳躍美妙的舞姿，這一刻飛舞在山這頭，下一刻便又躍升到遙遠天際。它們還不斷變化隊形，有時獨舞，有時集體創作，有時綿密緊依，有時散落各處，整個天空都是雲朵舞動的空間，一輪隱約月白有時也來客串演出，是偌大劇目最佳陪襯。」這段文字沒有用到下列何種修辭技巧？
  options:
  - label: A
    content: 譬喻
  - label: B
    content: 轉化
  - label: C
    content: 摹寫
  - label: D
    content: 回文
  lesson_raw:
    title: 看雲的日子
    basis: 引用〈看雲的日子〉課文原句
- id: doc_113_高雄_翠屏_國文_g8s2e3_s1_23
  section: 1
  number: 23
  type: single
  page: 3
  stem: 「從有記憶以來，便極喜愛對著天空發呆，揣想浩瀚宇宙無窮無盡，充滿了各種想像與可能。」這段文字的含義與下列何者最相近？
  options:
  - label: A
    content: 張目對日，幻想群鶴舞空
  - label: B
    content: 辭官歸隱，縱情山水田園
  - label: C
    content: 放浪形骸，今朝有酒今朝醉
  - label: D
    content: 悲天憫人，記錄社會現實
  lesson_raw:
    title: 看雲的日子
    basis: 引用〈看雲的日子〉課文原句
- id: doc_113_高雄_翠屏_國文_g8s2e3_s1_24
  section: 1
  number: 24
  type: single
  page: 3
  stem: 「世間種種翻騰好比過眼雲煙，倏忽消逝，耀眼明亮時值得喝采，黯淡孤獨時，也是另種人生歷程。」這段文字的含義與下列何者最相近？
  options:
  - label: A
    content: 越是嚮往高處溫暖光明的陽光，越是要扎根在黑暗潮溼的土地
  - label: B
    content: 才美不外現，靜待來日一鳴驚人；爭氣不一時，需懂得韜光養晦
  - label: C
    content: 凡事只要竭盡全力，便可放任其順其自然
  - label: D
    content: 黑暗與光明是一對雙生子，總是一起到來
  lesson_raw:
    title: 看雲的日子
    basis: 引用〈看雲的日子〉課文原句
- id: doc_113_高雄_翠屏_國文_g8s2e3_s1_25
  section: 1
  number: 25
  type: single
  page: 3
  stem: 看雲的日子一文中，作者在文末提及：「呼嘯而過的日子，從不曾真正離去，只是換種風情繼續在天涯響遏行雲，見證一切。」根據文意，下列敘述何者錯誤？
  options:
  - label: A
    content: 過往的歲月已消逝，看雲的心情也與從前不同
  - label: B
