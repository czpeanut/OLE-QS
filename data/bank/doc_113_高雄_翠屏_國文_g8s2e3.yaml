  stem: 「它是最好的時代，也是最壞的時代。是智慧的時代，也是愚蠢的時代。是信仰的時代，也是懷疑的時代。是光明的季節，也是黑暗的季節。是充滿希望的春天，也是令人絕望的冬天。我們的前途擁有一切，我們的前途一無所有。我們正走向天堂，我們也走向地獄—總之，那個時代和現在是如此的相像，以至於最喧鬧的一些專家，不論說好說壞，都堅持只能用最高級的形容詞來描述它。」這段文字的含義與下列何者最不相近？
