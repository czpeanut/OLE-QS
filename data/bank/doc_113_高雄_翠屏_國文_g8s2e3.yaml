    content: 地下鐵及商場的營運
  group_stem: "我在京都，自然以看古寺神社為主，留心古寺中的「主要國寶」，二條城中的障壁畫、永觀堂中的金銅蓮花文磬、平等院裡的木造佛像，日本人列為國寶，這些倒不是我所關心的，我最留心的是唐朝\
    \ 宋朝，有許多日本和尚來中國，抄回去不少唐 宋詩人的詩文卷子，究竟有多少？\n  例如日本抄本的白居易詩，內容就和現今中國流傳的有出入，經過平岡武夫、花房英樹兩位教授的研究，日本抄本大有妙處，值得研究者重視。\n\
    \  京都即將要慶祝建市一千二百年，是一個將古典和現代融合得很調和的都市，當走進小巷的民宅，頗有回到民國三十九年初來臺灣時的景況，榻榻米的小房間，紙門與木格窗，極小的天井也不忘石塊花樹的裝點。但地下商場、地下鐵道極普遍，鐵道竟有三家，交通商業早就極為現代化。\n\
    \  我很佩服京都民眾的共識，大半的建築甘心守著古老的形式，而不肯翻造改建，大家能以維護古都風貌而驕傲，在咱們中國，這能做得到嗎？ 一月四日又將有古代的踢足球「蹴鞠」賽，一月十五日又有新成年女性的射箭賽，我來不及觀看了，不知其中存有多少中國古禮的影子？試想中國若能把古禮研究保存，維護幾座大城做古文化櫥窗，像京都一樣，光憑觀光收入，就遠勝商場與工廠了。（黃永武\
    \ 生活美學）"
