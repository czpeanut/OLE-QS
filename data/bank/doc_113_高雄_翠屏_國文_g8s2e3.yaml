    \  遠在美國 俄亥俄州，同樣是一對兄弟，讀到了李林塔爾的新聞。是的，就是「萊特兄弟」。他們認真研究李林塔爾的「失敗」，發現問題關鍵在於「平衡」。他們把飛機設想為「有翅膀的自行車」，研究鳥類的平衡，用上下兩片邊緣微曲的機翼達到平衡，終於使人類進入飛行時代。\n\
    \  在萊特兄弟以前，李林塔爾是飛行史上最偉大的名字。李林塔爾之所以失敗，是因為前面的「成功」，讓他忽略了關鍵問題。而他的失敗，導致萊特兄弟的成功。\n \
    \ 不要「在意」成功，要「注意」你的成功，它可能是你失敗的爸爸。不要注意別人的成功，要注意別人的失敗，它一定也是你成功的媽媽！\n  我們不能只從自己的錯誤吸取教訓，這樣可能一錯就掛，沒有機會再犯錯。聰明的人會從別人的經驗中，找到對的路！（改寫自郝廣才\
    \ 成功為失敗之父）"
