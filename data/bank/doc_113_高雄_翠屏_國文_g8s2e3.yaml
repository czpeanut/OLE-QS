- id: doc_113_高雄_翠屏_國文_g8s2e3_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 「何陋之有」一語其實是「有何陋」的倒裝句，「之」在此即為「賓語提前的語助詞」。下列選項「 」中的字，何者用法與之相同？
  options:
  - label: A
    content: 唯利「是」圖
  - label: B
    content: 顛「三」倒四
  - label: C
    content: 深「藏」不露
  - label: D
    content: 心同「此」理
  lesson_raw:
    title: 陋室銘
    basis: 引用〈陋室銘〉課文原句與語法分析
