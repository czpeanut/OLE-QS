- id: doc_113_高雄_翠屏_國文_g8s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 秉璿正在玩「我換我換我換換換」的遊戲，要把原來詞語換成另一個相同意思的詞語。下列何者替換錯誤？
  options:
  - label: A
    content: 我爺爺可是滿清時代的「鴻儒」呢→碩彥
  - label: B
    content: 與劉禹錫往來的絕對不是你說的「白丁」→商人
  - label: C
    content: 少了「絲竹」在耳邊嘈雜，四周真是清靜→音樂
  - label: D
    content: 卸下行政院院長職務後，他就沒有「案牘」來煩心了→公文
- id: doc_113_高雄_翠屏_國文_g8s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 「往來無白丁」的「白丁」是指不識字或缺乏知識的人。下列文句中的「白丁」，何者意思與之相同？
  options:
  - label: A
    content: 我只是一介「白丁」，不可能與皇親國戚有所連繫
  - label: B
    content: 這部小說是描述一位將軍率廬陵「白丁」對敵人發動奇襲的故事
  - label: C
    content: 爺爺因為小時候家境不好，學歷只到小學而已，所以總是自嘲自己是一位「白丁」
  - label: D
    content: 那位長官靠著十年寒窗苦讀，終於從「白丁」身分躍升為地方父母官
  lesson_raw:
    title: 陋室銘
    basis: 引用〈陋室銘〉課文原句與詞義
- id: doc_113_高雄_翠屏_國文_g8s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 下列「 」中的成語，何者運用恰當？
  options:
  - label: A
    content: 在下「德高望重」，怕是難以擔此大任，諸位還是另擇高明吧
  - label: B
    content: 父母望子成龍，望女成鳳，總希望孩子長大之後能成為一個「眼高手低」的人
  - label: C
    content: 人生在世，若能找到「志同道合」的知己，一齊向更高的境界探索，那真是死而無憾了
  - label: D
    content: 他總有許多想法，奈何他是個「任重道遠」的人，總做不出什麼成績
- id: doc_113_高雄_翠屏_國文_g8s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 「無絲竹之亂耳」中「絲竹」一詞所使用的修辭技巧，與下列文句「 」中的詞語，何者不同？
