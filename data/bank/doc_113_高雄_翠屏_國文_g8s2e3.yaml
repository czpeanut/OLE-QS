- id: doc_113_高雄_翠屏_國文_g8s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 有關陋室銘一文的敘述，下列何者正確？
  options:
  - label: A
    content: 「山不在高，有仙則名；水不在深，有龍則靈」寄寓自己以修養品德為重的深意
  - label: B
    content: 「苔痕上階綠，草色入簾青」點出陋室久久沒有人住
  - label: C
    content: 「往來無白丁」：「白丁」指「佣人」
  - label: D
    content: 「南陽 諸葛廬，西蜀 子雲亭」暗示作者雄才大略，不可一世
  lesson_raw:
    title: 陋室銘
    basis: 題目指明〈陋室銘〉
- id: doc_113_高雄_翠屏_國文_g8s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 陋室銘裡前四句「山不在高，有仙則名；水不在深，有龍則靈。」看似與題目陋室銘關聯甚少，實際上的寫作意涵為何？
  options:
  - label: A
    content: 聲東擊西，分散讀者注意
  - label: B
    content: 顛三倒四，失去文章主軸
  - label: C
    content: 言近旨遠，賦予豐富想像
  - label: D
    content: 借題發揮，引出主要內容
  lesson_raw:
    title: 陋室銘
    basis: 題目指明〈陋室銘〉並引用課文
- id: doc_113_高雄_翠屏_國文_g8s2e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 陋室銘一文中，作者展現了一種精神上的充實。因為精神上的充實，而能忽略物質上的不足，下列文句，何者也是如此？
  options:
  - label: A
    content: 飯疏食飲水，曲肱而枕之，樂在其中矣！不義而富且貴，於我如浮雲（論語 述而）
  - label: B
    content: 君子無終食之間違仁，造次必於是，顛沛必於是（論語 里仁）
  - label: C
    content: 死生有命，富貴在天。君子敬而無失，與人恭而有禮（論語 顏淵）
  - label: D
    content: 富而可求也，雖執鞭之士，吾亦為之。如不可求，從吾所好（論語 述而）。
  lesson_raw:
    title: 陋室銘
    basis: 題目指明〈陋室銘〉
