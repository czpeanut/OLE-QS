- id: doc_113_高雄_翠屏_國文_g8s2e3_s2_41
  section: 2
  number: 41
  type: single
  page: 6
  stem: 「（甲）李林塔爾飛行失敗，重傷而亡 （乙）造出史上第一架可飛行的滑翔機 （丙）李林塔爾開設機器工廠 （丁）鳥類飛行—飛行器駕駛技術的入門一書出版 （戊）萊特兄弟改良機翼」。以上事件發生的正確順序為何？
  options:
  - label: A
    content: 乙丁丙甲戊
  - label: B
    content: 丙乙丁戊甲
  - label: C
    content: 丙丁乙甲戊
  - label: D
    content: 丁乙丙戊甲
  group_stem: "李林塔爾出生在普魯士離海不遠的小鎮安克拉姆，從小腦子就有一個聲音：鳥能飛上天空，人也一定可以飛，而我就是那第一個飛行的人。李林塔爾從柏林技術學院畢業，開機械工廠，自己設計和製造發動機。他和弟弟深入研究鳥類的翅膀構造以及飛行的原理，連續七年，設計出八種飛行器，全部失敗。\n\
    \  一八七七年有了第一步突破，他放棄拍打機翼的飛行法，造出稍微拱起的翅膀，這比扁平的翅膀效果好很多。一八八九年他把二十多年研究的成果，寫成一本鳥類飛行—飛行器駕駛技術的入門，這本書是航空科學的奠基著作。\n\
    \  一八九一年他們兄弟造出一架滑翔機，這是史上第一架飛上天空的滑翔機。接下來五年，他滑翔了兩千多次，三度大改結構，飛行高度曾達到三百五十公尺，最遠可達一千公尺。他名滿天下，全世界都在等待他帶領人類飛上天空。\n\
    \  一八九六年八月九日，李林塔爾駕著最新的滑翔機，直飛上天。沒料到滑翔機上升的仰角太大，突然失速，機身直直從十五公尺掉下，李林塔爾脊椎斷裂，送到醫院後第二天過世。\n\
    \  遠在美國 俄亥俄州，同樣是一對兄弟，讀到了李林塔爾的新聞。是的，就是「萊特兄弟」。他們認真研究李林塔爾的「失敗」，發現問題關鍵在於「平衡」。他們把飛機設想為「有翅膀的自行車」，研究鳥類的平衡，用上下兩片邊緣微曲的機翼達到平衡，終於使人類進入飛行時代。\n\
    \  在萊特兄弟以前，李林塔爾是飛行史上最偉大的名字。李林塔爾之所以失敗，是因為前面的「成功」，讓他忽略了關鍵問題。而他的失敗，導致萊特兄弟的成功。\n \
    \ 不要「在意」成功，要「注意」你的成功，它可能是你失敗的爸爸。不要注意別人的成功，要注意別人的失敗，它一定也是你成功的媽媽！\n  我們不能只從自己的錯誤吸取教訓，這樣可能一錯就掛，沒有機會再犯錯。聰明的人會從別人的經驗中，找到對的路！（改寫自郝廣才\
    \ 成功為失敗之父）"
