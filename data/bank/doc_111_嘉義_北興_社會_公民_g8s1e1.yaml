    西元2018 年12 月18 日三讀通過修正案，將《司法院大法官審理案件法》更名為《憲法訴訟法》。新法將大法官審理案件全面司法化，由大法官組成「憲法法庭」審理釋憲案，決議也由「大法官解釋」改為「判決」，並開放人民就「個案」聲請大法官審理。新法於西元2022
    年1 月4 日起施行。'
