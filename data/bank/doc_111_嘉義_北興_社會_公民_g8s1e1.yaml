  section: 2
  number: 34
  type: single
  page: 4
  stem: 文中有關大法官「解釋憲法」的職責，下列敘述何者正確？
  options:
  - label: A
    content: 人民認為某法律或判決侵害自己的權利，隨時都可聲請釋憲
  - label: B
    content: 《憲法訴訟法》新制將大法官審理釋憲改為以會議形式進行
  - label: C
    content: 大法官作成合憲或違憲宣告的解釋經公民投票複決才具效力
  - label: D
    content: 西元2022 年1 月4 日起由大法官組成「憲法法庭」審理釋憲。
  group_stem: '（三）

    司法院大法官的職責是解釋《憲法》、統一解釋法令、違憲政黨解散審理、總統副總統彈劾案審理，其中案件最多、也最常聽到的是「解釋憲法」這項職責。以人民而言，如果覺得某法律規定侵害了自己的基本權利而違憲，須先經過法院訴訟，在窮盡所有救濟程序，得到適用該法律規定的終審判決後，才能向大法官提出聲請，指出該法律規定哪裡侵犯了自己的基本權利，有違憲的疑慮。

    我國設置15 位大法官，除了其中的司法院院長與副院長，任期保障為8 年；產生方式是總統提名、經立法院同意後任命，可以看出行政與立法的權力制衡；採取分次提命任命，而非一次整批更換，則可確保大法官的組成能包括不同總統提名的大法官。
    大法官如果認為該法律規定合憲，會作成合憲宣告；也可能會指出合憲但有改進空間；或者認為違憲。在認定法律違憲的效果上，可採不同的宣告方式，如從時間面向，有立刻失效、定期失效或要求定期修法等不同方式。大法官宣告的解釋有拘束全國各機關及人民的效力，各機關處理有關事項，都應依解釋意旨為之，因此其扮演「憲法守護者」的角色。

    西元2018 年12 月18 日三讀通過修正案，將《司法院大法官審理案件法》更名為《憲法訴訟法》。新法將大法官審理案件全面司法化，由大法官組成「憲法法庭」審理釋憲案，決議也由「大法官解釋」改為「判決」，並開放人民就「個案」聲請大法官審理。新法於西元2022
    年1 月4 日起施行。'
