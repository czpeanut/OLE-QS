  section: 2
  number: 1
  type: essay
  page: 2
  stem: 在(甲)的敘述中，印度女性哪些人權的面臨不公平狀況？
  group_stem: '「印度8月初發生一名女性實習醫師在工作醫院遭性侵殺害，引爆全國怒火。」一群人看到這則新聞，進行了一些相關討論。

    甲：印度因宗教文化、教育程度、傳統父權觀念等因素，女性被視為男性附屬品，只許在家相夫教子、聽從男性命令，不得在外拋頭露面。不管如何爭取改善女性境遇及權益，仍是相差無幾。

    乙：雖然，這幾年兩性平權法律增訂不少，但印度在2023年的統計，女性就業率只有9%，多數公司偏向雇用男性員工，可見印度須加速就業市場裡的性別平等。

    丙：政府單位也須再教育！多數警察會將婦女遭受強暴一事，怪罪在婦女「擅自離家」頭上；而且印度性侵案件「無罪釋放」高達65%，法律形同虛設，真的令人心寒！'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
