    content: 有燈無月不娛人，有月無燈不算春。春到人間人似玉，燈繞月下月如銀—中秋
  - label: D
    content: 暮雲收盡溢清寒，銀漢無聲轉玉盤。此生此夜不長好，明年明月何處看—七夕
