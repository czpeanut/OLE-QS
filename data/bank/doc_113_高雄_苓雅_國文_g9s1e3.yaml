- id: doc_113_高雄_苓雅_國文_g9s1e3_s3_36
  section: 3
  number: 36
  type: single
  page: 5
  stem: 根據本文，李清照的聲聲慢使用了原該避諱的寫法，下列敘述何者「錯誤」？
  options:
  - label: A
    content: 使用「尋覓、冷清」等在當時很白話、常見的用字
  - label: B
    content: 書寫「傷心、黑、愁」等毫無新意的字詞
  - label: C
    content: 運用了像是「將息、了得」等文雅的字詞
  - label: D
    content: 口語化的「怎」字，前後用了三次。
  group_stem: "詞源於市井文化、歌筵酒席之中，後來被文人接手，逐漸發展成較高雅的文學。而文人寫詞，多半也會比較注重藝術手法，一首詞如果太過俚俗，就常為人所詬病。可是這也不代表用了許多俗字的詞作，就一定不好，至少，著名女詞人李清照所寫的聲聲慢，就使用了許多俗字，卻一直被視為上上之作。\n\
    \  聲聲慢全詞如下：\n  尋尋覓覓，冷冷清清，悽悽慘慘戚戚。乍暖還寒時候，最難將息。三杯兩盞淡酒，怎敵他、晚來風急。雁過也，正傷心，卻是舊時相識。\n\
    滿地黃花堆積，憔悴損，如今有誰堪摘。守著窗兒，獨自怎生得黑。梧桐更兼細雨，到黃昏、點點滴滴。這次第，怎一箇愁字了得。\n  此詞中，可看見許多在當時很白話、常見的用字，例如尋覓、冷清、將息、傷心、黑、怎、愁、了得等。照理說，頻繁使用淺白俗字的作品，較難有高雅、情意深長的境界，且詞人作詞時，也會盡量不要讓詞語太過重複。可是這首聲聲慢卻把這些該避諱的寫法都用上了，還能成為佳作。主要是因為開頭的十四個疊字，用得很有技巧，既能夠有聲調的抑揚頓挫，還兼有雙聲與疊韻。下片「點點滴滴」也是，不只和開頭的十四個疊字有所呼應，又能直接呈現出冷清悽慘的情景，使讀者很容易就進入作者要表達的情緒，再進而感受到更深一層的悲苦。所以，這些字雖然又俗又重複，但卻能巧妙呈現出音律之美，兼具看似直接，卻又深長的情意。\n\
    \  而像傷心、黑、愁等字，雖然沒有重複，但也是毫無新意的字眼；將息、了得等，也是俗語或方言，都不是很雅的字詞；「怎」這個字，更是口語，還前後用了三次。但是它們都被運用得很巧妙，能夠自然地融入詞的意境之中，看不出作家故意鍛鍊、計較用字的痕跡，反而讀起來順暢自然、不做作。也因為多用俗字，作品內容很好理解，便更有親切感，所以被評論為「以俗為雅」、「以故為新」，看似平淡簡單，卻又能深刻表現出作者那歷經生離死別、國破家亡的淒苦。\n\
    \  要做出手續繁複、色香味俱全的功夫菜自然是難，可要把一盤平淡的蛋炒飯，炒得非常好吃，恐怕更難。作詞也一樣，透過修辭、用典等藝術手法把詞寫好很不簡單，但不經雕飾的使用俗字，卻能寫好詞，更是不簡單。所以，用了許多俗字的詞，只要能經過作者的巧思，還是能成為千古絕唱的。（林玉玫\
    \ 用了許多俗字的〈聲聲慢〉，為何成為李清照的千古名作？）"
