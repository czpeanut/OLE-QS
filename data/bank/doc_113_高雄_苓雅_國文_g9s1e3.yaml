- id: doc_113_高雄_苓雅_國文_g9s1e3_s3_29
  section: 3
  number: 29
  type: single
  page: 4
  stem: 下列關於小品文的說明，何者「最不恰當」？
  options:
  - label: A
    content: 寫作風格隨興自在
  - label: B
    content: 是一種篇幅短小、文字簡潔的作品
  - label: C
    content: 其主題多元、題材無所不包
  - label: D
    content: 如三國演義即是小品文的一種。
  group_stem: '歷代小品文選（一）只許州官放火，不許百姓點燈

    田登作郡，自諱其名，觸者必怒，吏卒多被榜笞①。於是舉州皆謂燈為火。上元放燈②，許人入州治游觀。吏人遂書榜揭於市曰：「本州依例放火三日。」故語云：「只許州官放火，不許百姓點燈。」本此。


    歷代小品文選（二）戴高帽

    俗以喜面諛③人者曰「戴高帽」。

    有京朝官出仕於外者，往別其師。師曰：「外官不易為，宜慎之。」其人曰：「某備有高帽一百，逢人則送其一，當不至有所齟齬④也。」師怒曰：「吾輩直道事人⑤，何須如此！」其人曰：「天下不喜戴高帽如吾師者，能有幾人歟？」師頷⑥其首曰：「汝言亦不為無見。」

    其人出，語人曰：「吾高帽一百，今止⑦存九十九矣。」


    注釋：

    ①榜笞 音ㄅㄥˋ ㄔ，以鞭子或竹板抽打。

    ②放燈 指元宵節燃點花燈供民眾觀賞的風俗。

    ③諛 音ㄩˊ，奉承。

    ④齟齬 音ㄐㄩˇ ㄩˇ，上下牙齒不齊。比喻意見不合，產生矛盾。

    ⑤直道事人 以正直之道對待別人。

    ⑥頷 音ㄏㄢˋ，微微點頭。表示認同或嘉許。

    ⑦止 僅、只。'
  tags:
