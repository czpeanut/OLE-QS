  stem: 牛僧儒到襄陽找于頔的主要目的為何？
  options:
  - label: A
    content: 瞻仰于頔奇俊風采
  - label: B
    content: 盼求知人之遇得官
  - label: C
    content: 貪圖于頔家中錢財
  - label: D
    content: 證明自己節操自持
  group_stem: '丞相牛僧孺應舉時，知于頔①奇俊，特詣②襄陽求知。住數日，兩見，以遊客遇之，牛怒而去。去後，忽召客將問曰：「累日前有牛秀才，發未？」曰：「已去。」「何以贈之？」曰：「與錢五百。」「受乎？」曰：「擲於庭而去。」于大恨，于謂賓佐曰：「某事繁，總蓋有闕遺③者。」立命小將，齎④絹五百匹，書一函，追之。曰：「未出界⑤，即領來；如已出界，即以書付。」小將界外追及，牛不折⑥書，揖回。（張固
    幽閒鼓吹）

    注釋：

    ①于頔：唐朝大臣。頔，音ㄉㄧˊ。

    ②詣：拜訪。

    ③闕遺：缺失疏忽。

    ④齎：音ㄐㄧ，贈送。

    ⑤界：城界。

    ⑥折：此作拆開。'
