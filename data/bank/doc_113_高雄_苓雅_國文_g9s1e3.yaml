  stem: 「醉翁之意不在酒」一句，本指喝酒時意不在酒，而在寄情山水，舒放心胸，後比喻別有用心。下列選項中「」內的詞語皆有本義與衍生義，何者說明「有誤」：
  options:
  - label: A
    content: 「大放厥詞」原指發表誇張的言詞。今指寫出大量優美的辭章
  - label: B
    content: 「出爾反爾」原指你怎麼對待別人，別人也會怎麼待你。今指人的言行反覆，自相矛盾
  - label: C
    content: 「亦步亦趨」原指學生跟隨老師的腳步。今用以形容事事仿傚或追隨別人
  - label: D
    content: 「天馬行空」原比喻才思奔放，文筆豪邁。後引申有灑脫自由、不著邊際之意
  tags:
