  group_stem: '一介之士，必有密友。密友不必定是刎頸之交。大率雖千百里之遙，皆可相信，而不為浮言①所動；聞有謗之者，即多方為之辯析而後已；事之宜行宜止者，代為籌畫決斷；或事當利害關頭，有所需而後濟者，即不必與聞，亦不慮其負我與否，竟為力承②其事，此皆謂密友也。（張潮
