- id: doc_113_高雄_苓雅_國文_g9s1e3_s3_44
  section: 3
  number: 44
  type: single
  page: 6
  stem: 下列敘述，何者最能看出張公子對於鴿子的愛護有加？
  options:
  - label: A
    content: 癖好之，務盡其種
  - label: B
    content: 雖戚好求之，不得也
  - label: C
    content: 齊 魯養鴿家，無如公子最
  - label: D
    content: 其養之也，如保嬰兒
  group_stem: "鴿類甚繁，名不可屈以指。鄒平 張公子幼量癖好之，務盡其種。其養之也，如保嬰兒。齊 魯養鴿家，無如公子最①，公子亦以鴿自詡②。雖戚好求之，不得也。\n\
    \  有父執某公，為貴官。一日，見公子，問：「畜鴿幾許？」公子唯唯以退。疑某意愛好之也，思所以報而割愛良難。又念長者之求，不可重拂③。且不敢以常鴿應，選二白鴿，籠送之，自以千金之贈不啻④也。他日見某公，頗有德色⑤；而其殊無一申謝語。心不能忍，問：「前禽佳否？」答云：「亦肥美。」張驚曰：「烹之乎？」曰：「然。」張大驚曰：「此非常鴿，乃俗所言『靼韃』者也！」某回思曰：「味亦殊無異處。」張嘆恨而返。（蒲松齡\
    \ 聊齋志異）\n\n注釋：\n①齊 魯養鴿家無如公子最：指齊 魯一帶養鴿子的行家，以張公子最為著稱。\n②自詡：自誇、自耀。\n③重拂：過分的違其意願。\n\
    ④不啻：不止、不僅。\n⑤德色：施恩於人，而有自得之色。"
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 國文
      code: 第七課
      title: 我們的饕餮時代
      chapter: null
