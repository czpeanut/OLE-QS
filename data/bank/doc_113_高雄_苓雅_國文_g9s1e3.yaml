  type: single
  page: 2
  stem: 「人不可以無癖」，句中運用「不可」、「無」兩個否定詞來表示肯定語意「人都要有癖好」，這種句式稱為「雙重否定句」。下列「 」中的詞語，何者也是以雙重否定來表達肯定的意思？
  options:
  - label: A
    content: 她的作品「不是不好」，只是還遇不到伯樂賞識
  - label: B
    content: 小珍做事總是「不疾不徐」、有條有理的
  - label: C
    content: 成天遊手好閒、「不學無術」，怎能成就得了大事？
  - label: D
    content: 我們倆「非親非故」，為什麼你老是跟著我？
