  group_stem: 'C. (38-41)

    Book title: Notes from the Past

    Writer: Alyssa Goldman

    Stars: 4.7

    Publication date: May 25

    Price: $8.75

    Summary: Simon does not care for writing, but his teacher is

    making everyone in class keep a diary. He cannot use a

    notebook that has already been written in, so he goes to the

    store to get a new one. Simon comes across something

    strange there. All the notebooks are gone except one. Simon

    has no choice but to buy it, so he takes it home. When he

    finally puts pen to paper, the words that appear are not his.

    Simon is a little scared, but he is also very interested in what

    the notebook has to say.


    Reading age: 15+

    Print length: 350 pages

    Language: English

    Grade level: 9 and up


    Reviews:

