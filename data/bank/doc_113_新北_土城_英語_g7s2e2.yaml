- id: doc_113_新北_土城_英語_g7s2e2_s5_35
  section: 5
  number: 35
  type: single
  page: 3
  stem: 35. (        ) How many minutes do players have to find words in the Boggle
    game?
  options:
  - label: A
    content: 1 minute.
  - label: B
    content: 2 minutes.
  - label: C
    content: 3 minutes.
  - label: D
    content: 4 minutes.
  group_stem: "B. (35-37)\nWelcome to Boggle!\nBoggle is a fun game where you find\
    \ words in a grid of\nletters.\n\nHere’s how to play:\n\n1. You will see a 4×4\
    \ or 5×5 grid of letters. Look at the\n    letters and find as many words as you\
    \ can.\n2. You can connect letters up, down, across, or corner to\n    corner.\n\
    3. Each letter can only be used once in a word.\n4. Every word must have at least\
    \ three letters.\n\nThe game starts when the timer begins. You have three\nminutes\
    \ to find words. When time is up, everyone shows\ntheir lists. If two or more\
    \ players have the same word, cross\nit off. Only words that no one else has will\
    \ get points!\n\nScoring:\nWords with 3 or 4 letters: 1 point\nWords with 5 letters:\
    \ 2 points\nWords with 6 letters: 3 points\nWords with 7 letters: 5 points\nWords\
    \ with 8 or more letters: 11 points\n\nTips to win:\nLook for longer words first—they\
    \ give more points!\nTry to find words that start or end with common letters,\
    \ like\n“-ing” or “un-.”\nAre you ready? Let’s find out who can find the most\
    \ words\nand become the best Boggle player!\n\ngrid 格子 connect 連結 scoring 得分\
    \ timer 計時器"
  shared_asset: g5_35_37
