  - label: D
    content: The plastic trapped in animals’ stomachs makes them not able to eat enough
      food.
  group_stem: "D. (42-44)\n    Plastic can be many different things. It can have color\
    \ or\nbe clear. It can be thick or thin, strong or weak. When we\nlook around,\
    \ we see plastic everywhere — in our clothes,\nbottles, phones, and cars. Plastic\
    \ is something we use every\nday. It sounds very useful, but there is a big problem.\
    \ Most\nplastic does not break down quickly. It can stay on Earth for\nhundreds\
    \ of years. Every year, people around the world\nmake 400 billion kilograms of\
    \ plastic. But less than 9% of\nused plastic is recycled.\n     The plastic waste\
    \ we leave behind hurts all animals,\nwhether they live on land or in the sea.\
    \ ★ For hungry\nanimals drawn by food in plastic bottles, they may get their\n\
    feet or heads trapped and hurt, making it difficult for them\nto take in air or\
    \ move around. They may end up dying\nbecause of that. Also, birds, fish, and\
    \ sea turtles often\nmistake plastic for food when it has broken down into\nsmaller\
    \ pieces. They can’t digest plastic so their stomachs\nbecome so full, meaning\
    \ they don’t have room for real food.\nEating less and less, they become weak\
    \ and may die in the\nend. Take, for example, the whale that washed up dead on\n\
    the beach in India; 115 cups, 27 bags, 4 boxes, 10 toys, and\n1,000 pieces of\
    \ plastic were found in its stomach. These\nserious impacts of our plastic waste\
    \ raise a question: Should\nsomething we use for only a few minutes be allowed\
    \ to kill\nso many animals?\n………\n\ndigest 消化 impact 影響 trap 困住"
