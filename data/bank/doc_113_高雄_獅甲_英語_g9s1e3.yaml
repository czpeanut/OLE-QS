  group_stem: 'Oxford English Dictionary (OED) often adds new words to the book. Some
    of these new words are created when two words are put together. One example of
    this is “voluntourism,” which is made up with “volunteer” and “tourism.” It means
    you work as a volunteer when you are on a trip. In other words, it is not just
    to have a vacation. Instead, it is a chance for volunteers to use their skills
    and interests to help others in need. Every year, many visitors from rich countries
    travel to poor countries and hope to do some good. This has been popular for almost
    half of a century, and it was finally added to the dictionary in 2014.

    On the other hand, “staycation” was added to OED in 2010 after it became widely
    popular in the late 2000s. The earliest use of the word was back in 2003 when
    a reporter combined “ A ” and “ B ” together. People or families usually stay
    home and enjoy activities or plan a day trip around their house during their staycation.
    From swimming in the backyard, visiting a museum, to going to local festivals,
    these help create the feeling of a vacation without going abroad. After COVID-19
    hit the world in 2020, people were not sure if the place they visited was safe.
    Therefore, the idea of staycation was brought back again.

