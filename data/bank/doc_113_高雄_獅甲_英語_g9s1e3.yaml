  group_stem: 'Are you comfortable talking to strangers? Have you ever chatted with
    someone you didn’t know while on the bus or MRT? In big cities, most commuters
    who are talking mass transit would rather phub people than talk to other travelers.

    American Jonathan Dunne, who has lived in London for 20 years, found it strange
    that people that have been working together for years didn’t greet each other
    when commuting on the subway, or tube as it is called in London. He came up with
    an idea to hand out “Tube Chat” badges. People who wore it showed others that
    they were happy to have a conversation. Mr. Dunne said commuters in London were
    not willing to stay for a chat. They kept silent in the train, got off the train,
    and left for where they worked. He thought the little badge could help. He hoped
    people could have more talks.

    However, he didn’t get the friendly results he thought he would. People left messages
    on Twitter, such as “Anyone comes near me with one of these, I’m heading out of
    the window” and “ The day I willingly talk to anyone on the tube will be the day
    I have to tell someone that their hat is on fire.” One person even made badges
    with “Don’t even think about talking to me!” and handed them out. Obviously, London
    commuters would rather shut up than chat.

    Although the plan hasn’t worked very well, Mr. Dunne is positive and is going
    to continue. “I’ve ordered some more badges,” he said “All I wanted to do was
    have a little bit of fun.

