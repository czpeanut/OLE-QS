  group_stem: 'Are you the type of shopper who thinks you save money when you see
    the sign “on sale”? Or do you buy more because of the “buy one, get one free”
    sign? Stores often use different ways to trick customers into thinking they are
    getting a good deal like selling half-price items as a pair. However, these ways
    may actually lead to overspending. In the end, people may form different shopping
    habits. There are two examples of shopping, compulsive shopping and impulse shopping.

    Compulsive buying is about a person who cannot resist their shopping habits because
    they think they have to buy something and they can’t stop themselves from buying
    things. For example, if someone sees a toy that they think they should have in
    a store, even though they already have lots of them at home. This could be a sign
    of compulsive buying.

    On the other hand, impulse buying is when someone buys something without really
    thinking about it first. It happens when they see something they like, and they
    decide to buy it right away without thinking twice. Or they just think that they
    “can’t miss” it. For example, when you are at the front desk where you can see
    snacks like candy or chocolate next to you, and then you take some and put it
    into your basket. This is an example of impulsive buying.

