  stem: 據報載：3 月 15 日是世界消費者日，國內外消費者保護團體均會舉辦主題活動說明消費者權利的重要性。國內也有許多團體持續為消費者權益而努力，希望民眾和生產者共同思考消費的議題，因此，消費者開始關注生產者為增加效益而做出的剝削行為，寧願選擇價格高而不會在生產過程傷害勞工、動物和環境的商品；在另一方面，鼓勵漁業生產者，配合國際及政府對海洋保護區的規畫與安排，讓魚群能有時間繁衍成長，避免同業因爭搶海洋資源，過度捕撈而最終造成枯竭。也許某些方式可以捕獲更多魚量，但只有對生態友善，才能讓人類和環境永續共存。請問：根據上文判斷，消費者寧願購買較貴的商品，原因為何？
