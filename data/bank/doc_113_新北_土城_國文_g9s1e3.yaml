- id: doc_113_新北_土城_國文_g9s1e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 「是的，我們的命運被安排定了，在這個充滿車輛與煙囪的工業城裡，我們的存在只是一種悲涼的點綴。但你們儘可以節省下你們的同情心，因為這種命運事實上也是我們自己選擇的否則我們不必在春天勤生綠葉，不必在夏日獻出濃蔭。          ，但是，也唯有這種痛苦能把深度給予我們。(張曉風〈行道樹〉)」文中畫底線處宜填入下列何者？
  options:
  - label: A
    content: 人生最偉大的成就是在超越自己
  - label: B
    content: 失敗時不可輸掉勇氣，更要贏得經驗
  - label: C
    content: 神聖的事業總是痛苦的
  - label: D
    content: 寧可力戰而死，也不要不戰而屈
- id: doc_113_新北_土城_國文_g9s1e3_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 筱文閱讀武俠小說時，讀到以下文字:「以翻雲手張嵐為代表的無影劍派，在張嵐死後，由柳青接續掌門。他的劍法，基本上並未超出旋風劍派的範圍。因為張嵐習武的寂空門，本是捲雨僧嚴峻所創立，而嚴峻為追魂客蕭玉的門徒，正是旋風劍派的正宗嫡傳。」文中所提及的人物，彼此間傳承的先後關係最可能是下列何者？
  options:
  - label: A
    content: 張嵐→柳青→蕭玉→嚴峻
  - label: B
    content: 張嵐→柳青→嚴峻→蕭玉
  - label: C
    content: 蕭玉→張嵐→嚴峻→柳青
  - label: D
    content: 蕭玉→嚴峻→張嵐→柳青
- id: doc_113_新北_土城_國文_g9s1e3_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 人的愁緒有許多種，有情人間無法相守之嘆，有親友闊別之傷，有死生新故之悲。但也有一種哀愁在人與人的分別之外，因睹時代興衰而感時傷逝。請問下列而者的感慨原因為後者？
  options:
  - label: A
    content: 音塵絕，西風殘照，漢家陵闕
  - label: B
    content: 人有悲歡離合，月有陰晴圓缺，此事古難全
  - label: C
    content: 秦樓月，年年柳色，灞陵傷別
  - label: D
    content: 十年生死兩茫茫，不思量，自難忘
- id: doc_113_新北_土城_國文_g9s1e3_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 以上這闕詞，哪一句的主詞與其他三者不同？
  options:
  - label: A
    content: 不思量，自難忘
  - label: B
    content: 塵滿面，鬢如霜
  - label: C
    content: 小軒窗，正梳妝
  - label: D
    content: 夜來幽夢忽還鄉
  group_stem: "〈江城子乙卯正月二十日夜記夢〉蘇軾\n 十年生死兩茫茫。不思量，自難忘。千里孤墳，無處話淒涼。縱使相逢應不識，塵滿面，鬢如霜。\n 夜來幽夢忽還鄉。小軒窗，正梳妝。相顧無言，惟有淚千行。料得年年腸斷處，明月夜，短松岡。"
- id: doc_113_新北_土城_國文_g9s1e3_s1_22
  section: 1
