  - label: C
    content: 土壤滋養春光好，中天映照萬物生
  - label: D
    content: 若不撇開終是苦，各能捺住即成名
  lesson_raw:
    title: 智鬥書生
    basis: 題幹提及〈智鬥書生〉
- id: doc_113_新北_土城_國文_g9s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 文學中刻畫女子美貌有許多方法，可以直接用譬喻來刻畫外貌；可以用別人的反應來呈現；可以用映襯兩相比較凸顯；也可以用使用、穿戴的用品來烘托。請問下列何者刻畫的方法和「并刀如水，吳鹽勝雪，纖手破新橙」相同？
  options:
  - label: A
    content: 手如柔荑，膚如凝脂，領如蝤蠐，齒如瓠犀，螓首蛾眉
  - label: B
    content: 北方有佳人，絕世而獨立。一顧傾人城，再顧傾人國。
  - label: C
    content: 耕者忘其犁，鋤者忘其鋤。來歸相怨怒，但坐觀羅敷。
  - label: D
    content: 足下躡絲履，頭上玳瑁光。腰若流紈素，耳著明月璫。
