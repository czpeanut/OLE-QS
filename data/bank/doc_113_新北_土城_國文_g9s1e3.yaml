- id: doc_113_新北_土城_國文_g9s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 根據你對近體詩的理解，判斷下列何者最有可能屬於近體詩?
  options:
  - label: A
    content: 「前不見古人，後不見來者。念天地之悠悠，獨愴然而涕下。」
  - label: B
    content: 「鳳凰臺上鳳凰遊，鳳去臺空江自流。吳宮花草埋幽徑，晉代衣冠成古丘。三山半落青天外，二水中分白鷺洲。總為浮雲能蔽日，長安不見使人愁。」
  - label: C
    content: 「生年不滿百，常懷千歲憂。晝短苦夜長，何不秉燭遊？為樂當及時，何能待來茲？愚者愛惜費，但為後世嗤。仙人王子喬，難可與等期。」
  - label: D
    content: 「庭中有奇樹，綠葉發華滋。攀條折其榮，將以遺所思。馨香盈懷袖，路遠莫致之。此物何足貴？但感別經時。」
