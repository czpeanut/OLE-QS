  group_stem: "柬埔寨以保護吳哥窟之名 驅逐非法居民引爭議\n    吳哥窟的寺廟群占地約400 平方公里，包含9 到15世紀高棉帝國首都遺址，被聯合國教科文組織稱為東南亞最重要的考古遺跡之一。在新冠疫情前，每年有超過220萬旅客造訪當地，今年有機會重返疫情前榮景。\n\
    \    古蹟管理機構副主任朗國紹指出，「今年一開始相當不錯，光是前3 個月就已有近50 萬人，所以我相信數字還會繼續增加。」\n    只是吳哥窟所在的周邊村落，從2023\
    \ 年開始推動搬遷計畫，許多房屋已經拆到只剩部分圍牆。政府以保護世界遺產為由，在新聚落給每個家庭1 塊600 平方公尺的土地350 美元，跟一些鐵皮屋材料。\n\
    \    倫達艾搬遷居民燕隋蘋說：「我剛到這時很艱難，我找不到工作，以前我能買點菜或挖螃蟹養媽媽，搬到這裡時我什麼都沒辦法做。」\n    不過也有居民坦承，雖然以前住的地方比較容易賺到錢，但現在這裡有更大的土地，可以蓋房子跟家人同住。國際特赦組織則質疑，不少人並非自願搬離，更多的是變相的強制驅逐。\n\
    \    國際特赦組織當地負責人法拉爾指出，「他們當時有明確收入來源，也就是旅遊業，還有吳哥窟在地相關其他收入。現在他們距離當地30 分鐘車程，無法再獲得這些收入來源。」\n\
    \   由於當地居民仍保有其他地方已經消失的祖先傳統和文化習俗，柬埔寨當局因此挑選2 個定居點來重整居住在吳哥窟的周圍社區。官員表示，是以柬埔寨整體利益做考量，也強調是針對非法居民進行驅逐。\n\
    \    古蹟管理機構副主任朗國紹表示，「這得由他們自己判斷，是留下來繼續非法居住，還是想去一個屬於自己的、柬埔寨公民所擁有的私人空間。」\n     在保護古蹟與維護人權之間，柬埔寨顯然以觀光利益做為優先考量，因為觀光相關產業收入占柬國GDP\
    \ 近2成，當地居民也只能盡快適應在新聚落的生活方式。\n－－節錄自公視新聞網"
