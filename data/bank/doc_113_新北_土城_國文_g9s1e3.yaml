    花褪殘紅青杏小，燕子來時，綠水人家繞。枝上柳綿吹又少，天涯何處無芳草。 牆裡秋千牆外道，牆外行人，牆裡佳人笑。笑漸不聞聲漸悄，多情卻被無情惱。'
