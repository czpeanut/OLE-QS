  group_stem: "一般人常抱怨自己有形的生命受到各種限制、束縛，殊不知若沒有這些限制、束縛，我們可能仍舊處於一片混沌之中。如果我們的視覺和聽覺能接受任何波長的聲光，如果我們的壽命無限，那我們可能一事無成，我這篇文章留待三千萬年後再寫即可，而你更可留待一億五千萬年後再看。羅洛梅說有一次他參加一個小型座談會，討論人類的前途問題，主席在致詞時特別強調「人類的可能性是無限的」，結果座談時，大家似乎覺得沒有什麼值得談論的問題，因為既然人類的可能性是無限的，那麼大家不妨回家睡覺，反正任何問題遲早都會由這種無限的可能性所克服、解決，何必在此多費心思？\n\
    \  人類很多深刻、有意義的經驗或成就都是來自這種有限性，因為我只有一個妻子，兩個孩子，所以能在這種有限關係中提煉出清純的愛情與親情。因為五言絕句只有二十個字，而且還必須有押韻、講究平仄、對仗等種種限制，所以才能產生那麼多美好的詩篇。「限制」使我們神通廣大的意識找到一個立足點，就像隨風或隨水飄盪的種子，看似有無限的可能性，但終需找到一塊極有限的土壤固定下來，才能生根、開花、結果。畢卡索是繪畫天才，但他的靈感必然是在一個有限的畫面上始得發揮，如果要畢卡索畫出一張無限長、無限寬的畫，我不知道他要從那裡著筆？畫什麼？怎麼畫？\n\
    \  一個會寫詩的人絕不會抱怨五言絕句只有二十個字，相反的，他歡迎這種限制，因為他知道，只有在這有形的束縛下，他的意識才會產生最璀燦的結晶。\n     \
    \                                            \n－－節選自王溢嘉〈心的束縛〉"
