  stem: 摹寫修辭可細分為「視覺、聽覺、嗅覺、觸覺、味覺」幾類。(甲)這家麵攤的牛肉麵嘗起來既新鮮又不油膩。(乙)我達達的馬蹄是美麗的錯誤。(丙)一路騎來，串串鈴鐺聲響徹街頭巷尾。(丁)五月黃梅天，到處黏糊糊的。(戊)桃樹、杏樹、梨樹，你不讓我，我不讓你，都開滿了花趕趟兒。紅的像火，粉的像霞，白的像雪。上列文句若要依視覺、觸覺、味覺之順序排列，則應選擇下列何者？
