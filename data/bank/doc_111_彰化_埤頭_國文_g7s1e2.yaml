  stem: 「過去的飯桌上，總是充滿著嘻笑熱鬧，彼此分享著一天的所見所聞，拉近彼此間的距離。現在的人們，卻急著將飯桌上的一切，分享給千里之外的他人，讓一張餐桌的距離，變得好遠。」下列說明何者最接近本文作者欲表達的旨意？
  options:
  - label: A
    content: 讚揚科技日新月異，能將訊息分享給在遠方的朋友
  - label: B
    content: 現在的人吃飯只為了拍照打卡，而不去在意食物的美味
  - label: C
    content: 作者指責過去人們較不注重餐桌禮儀，會邊吃飯邊大聲說話
  - label: D
    content: 過去人們吃飯時會熟絡感情，現在卻各自沉迷於通訊軟體上
