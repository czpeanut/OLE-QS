- id: doc_111_彰化_埤頭_國文_g7s1e2_s4_56
  section: 4
  number: 56
  type: single
  page: 3
  stem: 下列「 」中的詞性，何者有誤？
  options:
  - label: A
    content: 把自己「封錮」在一間密不通風的石室中：動詞
  - label: B
    content: 越大「越」好：副詞
  - label: C
    content: 「開朗」的歡笑：動詞
  - label: D
    content: 「畢竟」是沒有很多俠客去石室救人：副詞
  group_stem: "為自己開一扇窗子 邵 僩\n 有人覺得自己是世上深陷不幸的人，所以懶得跟人說話，懶得臉上出現笑容，懶得去關心別人；彷彿要把自己封錮在一間密不通風、黑暗的石室中。\n\
    \ 這種自囚方式是很危險的。\n 因為現代畢竟沒有很多俠客去石室救人。\n 而且我們也不是王子和公主，也不是員外和官爺，所以一個人應該及早的為自己開一扇窗子，越大越好；那時候心靈不但能自由，同時也容易和外界起共鳴。\n\
    \ 開這扇窗子的先決條件是「誠懇」，我們要把誠懇當作玻璃擦拭得乾乾淨淨，一塵不染，讓別人能把我們的裡外作一番徹底的透視，瞭解這是一處可以存在友誼的地方；沒有偽裝，沒有自私，天空溫暖的陽光都會喜歡來這裡作客。假使窗內有了友誼，我們便會有了關懷的晤談、開朗的歡笑，到時候石室的囚卒――孤獨，也會嚇得走遠了。"
