  type: single
  page: 2
  stem: 「……我會在實驗室裡去做第一萬零一次的實驗」，依上述可知愛迪生成功發明電燈的原因為何？
  options:
  - label: A
    content: 專心一意，用志不紛
  - label: B
    content: 福星高照，洪福齊天
  - label: C
    content: 時機成熟，水到渠成
  - label: D
    content: 屢仆屢起，愈挫愈勇
  group_stem: "你也可以當天才 吳淡如\n 「天才，是放對地方的人才」，我從一本娛樂雜誌上看到這句話，覺得它真有道理。很多人談到天才，總喜歡提到愛迪生，他「似乎」說過，天才是一分靈感加上九十九分努力。曾有個叫作拿破崙‧希爾的作家造訪這個天才，問這位實驗了一萬次才發明電燈的科學家：「如果你第一萬次的實驗還是失敗了，你會怎麼辦？」\n\
    \ 愛迪生回答：「那我就不會在這裡和你瞎扯，我會在實驗室裡去做第一萬零一次的實驗。」\n 愛迪生做一萬次的實驗，可不都是同一種物質，他是最後把「鎢」放對了地方，我們才有電燈；如果是錯誤的東西，放一千萬次也沒用。"
