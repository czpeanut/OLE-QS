- id: doc_113_新北_丹鳳_數學_g8s2e3_s1_25
  section: 1
  number: 25
  type: single
  page: 3
  stem: '嘉哥跟東東終於抵達寶藏所在地，黃金閃耀的寶庫之中，靜靜躺著一本泛黃的航海日誌。封面寫著幾個字：「等三角之心，重疊之秘，心之所向，方能見寶。」兩人翻開最後一頁，只見船長親筆留下一張便條，似乎是船長發明的定理。

    便條上寫著：

    「case1:給予一任意平行四邊形 $ABCD$，$P$ 為四邊形內任一點，令 $\triangle PAB$ 的面積$=a$，$\triangle PAD$
    的面積$=b$，$\triangle PCD$ 的面積$=c$，$\triangle PBC$ 的面積$=x$，請以 a,b,c 表示 $\triangle
    PBC$ 的面積。

    case2:將 $P$ 推至平行四邊形 $ABCD$ 外，記為 $P''$，令 $P''$ 在 $\overline{AD}$ 外，發現 $\triangle
    P''AB$ 的面積$=a$，$\triangle P''AD$ 的面積$=b$，$\triangle P''CD$ 的面積$=c$，$\triangle
    P''BC$ 的面積$=y$，恰與 case1 雷同，請以 a,b,c 表示 $\triangle P''BC$ 的面積。」

    已知 case1 與 case2 中的 a、b、c 數值是相同的。請問，$x$ 跟 $y$ 的關係為何？(4-2-7)'
  options:
  - label: A
    content: y 跟 x 相差 2a+2c
  - label: B
    content: y 跟 x 相差 a+b+c
  - label: C
    content: y 跟 x 相差 2b
  - label: D
    content: y 跟 x 一樣大
