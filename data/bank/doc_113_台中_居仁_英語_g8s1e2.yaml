- id: doc_113_台中_居仁_英語_g8s1e2_s2_32
  section: 2
  number: 32
  type: single
  page: 3
  stem: 32. ( ) What was the color of the tires before they were black?
  options:
  - label: A
    content: Blue.
  - label: B
    content: Gray.
  - label: C
    content: Black.
  - label: D
    content: White.
  group_stem: '(32~34)


    Do you know the color of the tires of the cars? Black, yes. But do you know why?
    Before they are black, the color of the tires was white. That is the real color
    of rubber. However, around the year of 1910, some car factories started to put
    carbon black into the rubber.


    Carbon black is helpful to tires. For example, it creates durability. Tires can
    live longer, hold onto the road better, and take more wear and tear. Second, carbon
    black fights heat well. On hot summer days, the heat on the road can hurt tires
    over time. Carbon black can move heat from the outer side of the tires and send
    it back to the road. In this way, tires can keep safe for longer trips. In short,
    carbon black is good for tires and the drivers can use the tires longer.

    📖 rubber 橡膠; carbon 碳; durability 耐用性; wear and tear 磨損; heat 高溫'
