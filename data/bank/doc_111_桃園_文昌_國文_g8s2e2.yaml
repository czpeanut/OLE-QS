- id: doc_111_桃園_文昌_國文_g8s2e2_s3_27
  section: 3
  number: 27
  type: single
  page: 5
  stem: 依據本文，下列有關「ChatGPT」的敘述，何者正確？
  options:
  - label: A
    content: 是一款能為使用者查找到正確答案的聊天機器人
  - label: B
    content: 是藉由網路上大量文本進行深度學習的人工智慧軟體
  - label: C
    content: 能專業、博學地回應各種問題，完全不需要人類的介入
  - label: D
    content: 顛覆了傳統的教學方式，並為教育現場帶來正面的助益
  group_stem: "(一)\nChatGPT 是什麼？\n    ChatGPT 是一款聊天機器人，它會生成類似人類會寫出來的文字。ChatGPT 可以自然地回答眾多問題，可以為使用者整理各種資料，查找答案，但不一定正確。\n\
    \    就技術面而言，ChatGPT 是「文本生成」的 AI 家族中，「生成式預訓練轉換器」（Generative Pre-Trained Transformer）技術的最新發展。生成式\
    \ AI 是指能夠生成新穎內容的人工智慧軟體，可以產出文章、程式碼、歌曲和藝術畫作。它採用深度學習（deep learning），根據從網路上獲取的大量文本樣本進行訓練。它借鑒現有的、人造的內容來創造自己的作品，因此目前也有較高的抄襲倫理疑慮。\n\
    ChatGPT 限制和缺點\n    目前的機器人都是透過網路上海量資訊來建立回答，所以也可能吸收垃圾資訊，再吐出更多垃圾資訊，專長 AI 和機器學習的埃默里大學教授薩格（Matthew\
    \ Sag）提醒，這樣的模型訓練人工智慧去猜測什麼聽起來合理，但不是判斷什麼是真實。可能延續或強化偏見與歧視，甚至支持仇恨言論如納粹思想。關於這點，Google\
    \ 和 Amazon 之前都承認，它們的 AI 存在「道德風險」，還是需要人類介入。\nChatGPT 如何改變教育現場？\n    ChatGPT 可以流暢地回應各式問題、求解數學方程式、寫作文章（基礎學術文章、文學文本、電影劇本等）、檢查和調整程式碼……，可以說生活中遇到「語言」與「程式語言」相關的情境，它都能處理得有模有樣，有些時候甚至比真人更專業、博學。「我們還沒有做好準備，」曾在倫敦\
    \ 國王學院教授文學的作家馬爾凱（Stephen Marche）指出：「短篇文章，尤其是大學生的課堂論文作業，一直是人文教育的核心，這是我們教孩子們如何研究、思考和寫作的教學方式，但整個傳統將徹底被顛覆。」紐約市當地公立學校電腦和網路不再開放\
    \ ChatGPT，因為擔心對學生的負面影響。\n(節錄改寫自天下雜誌〈ChatGPT 怎麼玩？ChatGPT 應用全攻略〉)"
