  section: 3
  number: 31
  type: single
  page: 6
  stem: 比較甲、乙兩篇對人魚外型的描繪，以下何者正確？
  options:
  - label: A
    content: 全為女性
  - label: B
    content: 容貌皆美
  - label: C
    content: 下半身都有尾巴
  - label: D
    content: 身高均與人相當
  group_stem: '(三)科教館舉行「安徒生童話──小美人魚特展」，展覽中介紹各地人魚傳說如下：


    甲 人魚之種族有盧亭者，新安 大魚山與南亭 竹沒老萬山多有之。其長如人，有牝牡①，毛髮焦黃而短，眼睛亦黃，面黧黑，尾長寸許。見人則驚怖入水，往往隨波飄至，人以爲怪，競逐之。有得其牝者與之婬②，不能言語，惟笑而已。久之，能著衣，食五穀。攜至大魚山，仍沒入水。蓋人魚之無害於人者。

    (屈大均《廣東新語》)

    ①牝牡：分別指動物的雌性與雄性。②婬：男女歡好。


    乙 日本傳說裡的人魚叫「磯姬」。身長約二十至三十公尺，有關於外型說法不一，有人稱上半身是長髮女子；亦有人稱其口裂至耳朵，有尖銳獠牙，頭上長著二支像鹿角的犄角。下半身外型不明，據傳像幽靈一樣模糊，或者長得像是蛇、龍尾巴似的。她會藏匿在狂風巨浪的海岸，透過呼聲誘人接近，一旦有人靠近，就乘浪襲擊，再用頭髮纏住受害者，將其身體從頭開始扭轉，然後以毛髮將其血吸至乾涸。

    （科教館〈安徒生童話──小美人魚特展〉展場海報）'
