  stem: 下列「」中的國字，何者前後讀音相同？
  options:
  - label: A
    content: 賀爺爺的葬禮上，前來「弔」唁的人很多，小川一個人躲在角落裡沉痛地哀「悼」著……。
  - label: B
    content: 來到喪禮中的賓客，都聽聞賀爺爺在死前已承「諾」要將「偌」大的家產交由小川繼承，
  - label: C
    content: 這是賀家眾多子姪們連「署」爭取來的結果，希望為命運坎坷的小川帶來人生的「曙」光。
  - label: D
    content: 喪禮結束後，小川踏出會場，「頃」刻間下起「傾」盆大雨，淅瀝瀝的雨滴又敲亂了他心情。
  answer:
  - 杯「葛」
