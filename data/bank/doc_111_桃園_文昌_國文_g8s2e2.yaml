  stem: '「『數大』便是美，碧綠的山坡前幾千隻綿羊，挨成一片的雪絨，是美； (甲) ，是美； (乙) ，是美； (丙) ，是美； (丁) ，是美；……數大便是美。(徐志摩〈西湖記〉)」

    上文省略的文句皆屬於景觀的描寫，依據文意，下列何者最不可能是本段所省略的文句？'
  options:
  - label: A
    content: 甲：一天的繁星，千萬隻閃亮的眼神，從無極的藍空中下窺大地
  - label: B
    content: 乙：泰山頂上的雲海，巨萬的雲峰在晨光裏靜定著
  - label: C
    content: 丙：大海萬頃的波浪，戴著各式的白帽，在日光裏動盪著，起落著
  - label: D
    content: 丁：七月的黃昏，遠樹凝寂，像墨潑的山形，襯出輕柔瞑色
  lesson_raw:
    title: 我所知道的康橋
    basis: 引用作者徐志摩及課文〈我所知道的康橋〉延伸之「數大便是美」
