  group_stem: '(四)久為簪組束①，幸此南夷謫。閒依農圃鄰，偶似山林客。

    曉耕翻露草，夜榜②響谿石。來往不逢人，長歌楚天碧。

    (柳宗元〈溪居〉)

    ①久為簪組束：久被官職所束縛。簪組，古代官吏的冠飾，借指「官職」。

    ②夜榜ㄅㄥˋ：夜裡撐篙搖櫓、渡船行舟。榜，音ㄅㄥˋ。'
