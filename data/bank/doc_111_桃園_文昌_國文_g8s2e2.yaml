- id: doc_111_桃園_文昌_國文_g8s2e2_s2_9
  section: 2
  number: 9
  type: single
  page: 2
  stem: '「陸放翁有一聯詩句：『傳呼快馬迎新月，卻上輕輿趁晚涼。』這是做地方官的風流。我在康橋時雖沒馬騎，沒轎子坐，卻也有我的風流：我常常在夕陽西晒時，騎了車迎著天邊扁大的日頭直追。日頭是追不到的，我沒有夸父的荒誕，但晚景的溫存卻被我這樣偷嘗了不少。」若要將上述課文段落，整理成相互比較的表格，下列表格內容何者有誤？


    | 人物 | 出遊時間 | 交通工具 | 風雅趣事 |

    | :--- | :--- | :--- | :--- |

    | 陸放翁 | (甲) | (丙) | 享受晚風清涼 |

    | 作者 | (乙) | 騎自行車 | (丁) |'
  options:
  - label: A
    content: 「甲」應填入「夜晚」
  - label: B
    content: 「乙」應填入「黃昏」
  - label: C
    content: 「丙」應填入「騎馬」
  - label: D
    content: 「丁」應填入「追逐夕陽」
  lesson_raw:
    title: 我所知道的康橋
    basis: 引用〈我所知道的康橋〉課文原句
  answer:
  - 打「盹」
