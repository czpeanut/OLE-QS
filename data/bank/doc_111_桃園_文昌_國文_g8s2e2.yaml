- id: doc_111_桃園_文昌_國文_g8s2e2_s2_5
  section: 2
  number: 5
  type: single
  page: 2
  stem: 「露水滴落在臉上，是香的。我張開嘴伸出舌頭接著深夜滴落的露水，貫穿喉道的露水是甜的。我慢慢地張開眼睛，像聽了一場完美的演奏，凝視著周圍，朝著視覺穿不過的黑夜，她的靜，好美……就如同父親所說的，當你開始熟悉黑夜後，你就會知道怎麼去貫穿黑夜的美。祖父曾說過：『自然從未啞過，只是我們一直在背離她而已，我們不敢用真實去面對她，我們脫離了與她的歸屬感，讓自己獨享一切。自然看在眼裡，她不說，但她在等，她等得很辛苦，因為我們已經遺忘了與她溝通的那個語言。』（亞榮隆．撒可努〈水神的指引〉）」關於這段文句的理解，以下何者最為正確？
  options:
  - label: A
    content: 以「味覺」經驗呈現與自然互動的美好感受
  - label: B
    content: 作者在黑夜中聆聽到一場宛若天籟的演奏會
  - label: C
    content: 因夜色影響視覺，使作者無法領受自然之美
  - label: D
    content: 引用祖父之言，感慨自然資源已被開發殆盡
  answer:
  - 奶「酪」
- id: doc_111_桃園_文昌_國文_g8s2e2_s2_6
  section: 2
