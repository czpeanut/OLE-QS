- id: doc_111_桃園_中興_國文_g8s1e1_s2_7
  section: 2
  number: 7
  type: single
  page: 3
  stem: 文中「甲」的答案，最可能是
  options:
  - label: A
    content: 園丁
  - label: B
    content: 木匠
  - label: C
    content: 虎媽
  - label: D
    content: 鐵匠。
  group_stem: '太太懷孕後，我開始讀教養的書，第一本是《園丁與木匠》。作者說父母不該是「木匠」，不要把孩子塑造成自己心目中的理想形象。我立志要當個「園丁」爸爸。

    孩子走路之前，當「園丁」比較容易。但開始走路後，爬上爬下摸這摸那，父母的考驗來了。我開始追著他跑，最常說的話是「不可以」。園丁把花圃變成溫室，歇斯底里地在四周貼上防撞泡棉。當孩子真的摔了一兩次，溫室的牆愈築愈高。我不只變成「木匠」，甚至變成「鐵匠」。迷惑之際，我拿出《園丁與木匠》，翻到當年畫紅線的一段：父母應該做的是提供一個受保護的空間，讓孩子在其中發展出我們完全意想不到的思想和行為。於是我不再阻止他把玩具放到嘴巴，只能事先把玩具都擦乾淨。也不阻止他把食物丟在地上，只能買厚一點的紙巾。然後，意想不到的事真的發生了！孩子開始會自己吃飯，還會反過來餵爸爸。

    孩子開學了，老師給我們心理建設：「送孩子到學校，他可能哭得唏哩嘩啦。你們要堅定地離開，千萬不要回頭。不然孩子看到父母猶豫的表情，不安的情緒更強了！」「不做」某件事，比「做」任何事，更難。有時，最好的教養，是放下。相信有比你更好的「甲」，能教你的孩子。

    沒人教過我們如何做父母。我們回想爸媽帶我們的方式，盤點自己的福氣與創傷，摸索出一條路。我們在「園丁」、「木匠」、「虎媽」、「水母爸」之間掙扎。在責任感、成就感、罪惡感、失落感之間擺盪。一切，只為了一個卑微，也偉大的心願：希望孩子過得比我們好。只不過，沒有人真正知道，怎樣是「好」。

    縮寫自王文華：《聯合報･我的開學日》，2022-09-05。'
