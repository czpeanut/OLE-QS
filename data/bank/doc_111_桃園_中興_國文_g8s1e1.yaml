- id: doc_111_桃園_中興_國文_g8s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 「在現代語境之下，『怕』常常被賦予負面意義，因此，也就造就了『不怕』的意識型態與文化邏輯，諸如不怕犧牲、不怕天、不怕地之類。然而，這種『不怕』精神到了極致，便成了一隻『戰無不勝』的現代怪獸，使人類文明發展的天空密佈陰霾。因此，現今社會缺少一種『怕』的精神品質，這種『怕』不是畏懼和怯懦，而是寓意著羞澀與虔敬，當面對虛無未知時，對自身渺小的反思與體認。只有懂得怕，學會過怕的生活，方能克制私慾，警醒自察，以免無知無畏。」下列選項，何者最貼近本文作者意指的「怕」？
  options:
  - label: A
    content: 暴虎馮河
  - label: B
    content: 驚弓之鳥
  - label: C
    content: 慚愧戒懼
  - label: D
    content: 戰戰兢兢。
