- id: doc_111_桃園_中興_國文_g8s1e1_s2_4
  section: 2
  number: 4
  type: single
  page: 3
  stem: 依據上文，學者於 1962 年提出的「地球村」，時至今日，其主要特徵為何？
  options:
  - label: A
    content: 地區間的交通因工業革命進入機器時代而更便利
  - label: B
    content: 不同社群的人們因具備完全理性而沒有觀念衝突
  - label: C
    content: 電子傳媒使世界各地在獲悉公共訊息上幾無落差
  - label: D
    content: 發達的交通工具與傳播媒介讓人們樂於定居鄉村。
  group_stem: '由雙腳到騎乘；自海路到航空，人們的交通時間越來越短，心理的距離也越來越近。大眾媒體普及後，有學者於 1962 年進一步提出「地球村」的概念。驗諸今日，果然訊息透過網路彈指可得，線上聊天或視訊會議無遠弗屆，人際溝通不再受空間距離所限。然而，無阻力、無成本的資訊流通，是否真能打造地球村？

    諾貝爾經濟學獎得主赫伯･塞蒙曾提出「有限理性」，意謂人的理性有其無法超越的限制。若人們具有完全的理性，必然會因資訊充分流通而減少不同社群間的誤解和衝突。但當人們以有限的理性去擁抱無限的資訊，會造成什麼結果？千百種人同住一個社區，總有許多接觸機會，時間久了，多少能彼此理解，甚至接受彼此的差異。但在網路世界裡，志同道合者可以超越空間距離，隨時串聯取暖，無須搭理跟自己唱反調的人，也就更加鞏固既有的想法。又因為網路世界具有放大遠香近臭的魔力，自然也讓越執著於偏好的人越想逃離現實，退到他覺得舒適自在的社群。

    如果雞犬相聞卻老死不相往來，我們所住的又怎會是地球村呢？不過是全球串聯、卻「不知有漢，無論魏晉」的山村罷了。

    ( 改寫自鄭志凱〈地球村，還是全球化山村？〉)

    說明 同溫層(stratosphere)：即大氣層結構中的平流層，位於對流層頂至50 公里高的上空。在平流層裡，氣流非常穩定平靜，且相當乾燥，幾乎沒有垂直方向的流動。因此，近年這個詞也用來
    借指網路世界「同類相呼」的「一言堂」 現象。'
  tags:
    textbook: 第三冊（八上）第1次段考範圍
