- id: doc_111_桃園_同德_社會_地理_g9s2e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 臺灣位於環太平洋地震帶，地質活躍，且常年受到颱風的影響，因此常發生土石流災害。土石流是指在陡峭的山坡上，由於山體滑坡、泥石流、河流侵蝕等原因導致大量的土石雜物混合著水流急速沖刷而形成的一種自然災害。臺灣山地地形複雜，河流眾多，常常發生土石流災害，給當地居民的生命財產安全帶來巨大的威脅。請問下列哪一種地名的地區，最容易產生土石流災害，對居民生命、財產產生威脅？
  options:
  - label: A
    content: 鼻
  - label: B
    content: 崎
  - label: C
    content: 崙
  - label: D
    content: 屋。
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 地理
