- id: doc_111_桃園_同德_社會_地理_g9s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 下列有關目前臺灣地方層級行政區的敘述，何者最為正確？
  options:
  - label: A
    content: 主要分為直轄市與縣市，縣市之下則有「鄉、鎮、市、區」等基層行政區
  - label: B
    content: 市和區是鄉村地區的基層行政區，鄉和鎮則是都市地區的基層行政區
  - label: C
    content: 鄉是人口密集、工商業較發達的市街，鎮則是人口少、密度低，以農業生產為主的聚落
  - label: D
    content: 隨著臺灣產業的發展，「鄉、鎮、市、區」的區隔愈來愈顯著。
