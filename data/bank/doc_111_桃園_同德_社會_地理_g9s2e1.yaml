  section: 1
  number: 1
  type: single
  page: 1
  stem: 據說「臺灣」一名源自於17 世紀時，荷蘭人進占臺灣的南部，作為東亞貿易的據點，當時主要活動範圍在目前的臺南安平一帶，被稱為台窩灣，請問：這跟哪一族群最相關？
