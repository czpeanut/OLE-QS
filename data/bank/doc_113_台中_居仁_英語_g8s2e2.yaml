    content: Experts think warning systems are not helpful to most people.
  group_stem: '(39.~41.)


    Tsunamis are big and dangerous waves. They can break houses near the sea and hurt
    many people. A tsunami usually happens after an earthquake under the sea. The
    ground moves, and it pushes the water. Then, very big waves move fast across the
    sea. These waves can go very far and very fast.

    Now, experts try to help people before a tsunami comes. After a very big tsunami
    in 2004, many countries near the Pacific Ocean made better warning systems. These
    systems have special tools in the water. They watch for big changes. If a tsunami
    is coming, people get a message, hear a loud sound, or listen to the radio.

    But these warnings don’t help everyone. Some people don’t know what to do after
    hearing them. They need to run to a high place, but not everyone learns this.
    Also, some places still don’t have warning systems.

    So, how can we help more people stay safe? Experts believe it’s very important
    to learn what to do when a tsunami comes. Students can learn in school and tell
    their families about it. The government and villages can work together to hold
    drills every year, so people can practice what to do during a tsunami. That way,
    when a tsunami really comes, everyone will know how to stay safe.

     warning system 預警系統 drill 訓練'
