- id: doc_111_桃園_石門_社會_公民_g9s2e1_s1_39
  section: 1
  number: 39
  type: single
  page: 4
  stem: 從上文內容，作者為何推斷埃及的傳統燈籠逐漸喪失競爭力、甚至可能消失？
  options:
  - label: A
    content: 中國科技化生產且價格低廉
  - label: B
    content: 埃及人力不足
  - label: C
    content: 埃及燈籠材質不佳
  - label: D
    content: 中國製燈籠手工精細。
  group_stem: '世界是平的 【節錄自湯馬斯˙佛里曼所著《世界是平的》一書，第 270-271 頁】

    從墨西哥回美國，幾天後我在華府跟一位埃及來的朋友共進早餐。她是長駐開羅做財經報導的葉哈迪迪（Lamees El-Hadidy）。自然地，我也請教她什麼時候發覺「世界是平的」。她回答，幾個星期前是穆斯林的齋戒月，她為
    CNBC 阿拉伯電視台做一則「法瓦尼斯」燈籠的報導。埃及從「法蒂瑪」王朝時代就有一種傳統，兒童在齋戒月提著法瓦尼斯燈四處唱歌，大人就賞禮賞糖，像美國的萬聖節。千百年來，燈籠一向由開羅老城區的低工資傳統手藝店生產，近年卻有了變化。

    幾年前，以燈泡取代蠟燭的中國塑膠燈籠大舉流入市場，癱瘓掉埃及的燈籠手藝業。葉哈迪迪說：「中國貨侵入我們的傳統，以創新的方式，我們卻束手無策。法瓦尼斯燈來自我們的傳統，我們的靈魂，中國貨卻比埃及貨更先進更有創意。」她問埃及人：「你曉得燈籠是哪裡做的嗎？」人們都回答不知道，把燈籠翻過來，才知道是中國貨。但許多媽媽，包括葉哈迪迪本人，都較喜歡中國燈籠，因為比較安全。埃及燈籠是玻璃做的，
    金屬邊緣尖尖的，點蠟燭。中國燈籠是塑膠做的，點燈泡，內建晶片，能播放傳統的齋戒月音樂， 還有當紅的齋戒月卡通「巴卡（Bakkar）」主題曲。

    埃及「美國商會」的《商業月刊》2001 年 12月號報導，中國貨進口商「彼此競爭，也跟數百年傳統的埃及燈籠爭。贏的一定會是中國貨。進口大商扎雅特（Taha
    Zayat）就說：『進口貨肯定有吃掉傳統燈籠的銷量。我想市面上的埃及貨已看不到5%。』產業相關人士都相信，中國以優越的科技大量生產，壓低價格，明顯占優勢。一盞埃及燈卻要用到一連串不同的工藝鋪，玻璃、畫工、銲接、鑄銅，各自負責某個階段。扎雅特說：『齋戒月永遠會有法瓦尼斯燈，但未來埃及貨會完全消失，別想跟中國貨競爭。』」'
