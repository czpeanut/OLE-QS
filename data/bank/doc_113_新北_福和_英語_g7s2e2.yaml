  stem: What makes the painting interesting?
  options:
  - label: A
    content: The painter has many stories.
  - label: B
    content: The girl’s beautiful smile.
  - label: C
    content: No one knows who the girl is.
  - label: D
    content: The girl is wearing a scarf.
  group_stem: '(43~46) The Girl with a Pearl Earring 〔挑戰題〕


    Do you know “The Girl with a Pearl Earring”? This famous painting is by Johannes
    Vermeer, a painter from the Netherlands.

    The composition of this painting is really good. In this painting, you can see
    a young girl with a blue and yellow scarf on her head. She wears a large pearl
    earring on her left ear. The background is all black, so we can only see the girl’s
    beautiful face and the earring. The girl looks at us quietly. Her lips are a little
    open; it seems that she has something to say, but she doesn’t say a word.

    Who is this girl? We are not sure. Some people think she is a servant. Others
    believe she is Vermeer’s daughter or a model. No one knows her name. This makes
    the painting more interesting.

    Many people call this painting the “Mona Lisa of the North” because they are both
    simple, quiet, and mysterious. Today, the painting is in a museum in The Hague,
    a city in the Netherlands. Each year, people from all over the world visit this
    museum to see it. Even after hundreds of years, people still love it. The girl
    says nothing, but her eyes speak to everyone.


    📖 pearl earring 珍珠耳環 scarf 頭巾 seem 似乎 servant 僕人 mysterious 神祕的'
