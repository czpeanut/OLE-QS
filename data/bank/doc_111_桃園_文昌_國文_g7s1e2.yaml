- id: doc_111_桃園_文昌_國文_g7s1e2_s5_30
  section: 5
  number: 30
  type: single
  page: 4
  stem: 根據文章所提供的資訊，判斷下列選項中的圖片何者為耬斗花？
  options:
  - label: A
    content: ''
    asset:
      key: optA
      file: doc_111_桃園_文昌_國文_g7s1e2/5_30_optA.png
  - label: B
    content: ''
    asset:
      key: optB
      file: doc_111_桃園_文昌_國文_g7s1e2/5_30_optB.png
  - label: C
    content: ''
    asset:
      key: optC
      file: doc_111_桃園_文昌_國文_g7s1e2/5_30_optC.png
  - label: D
    content: ''
    asset:
      key: optD
      file: doc_111_桃園_文昌_國文_g7s1e2/5_30_optD.png
  group_stem: '（二）《歲月靜好》 蔣勳

    在北海道旭川新開的植物園看花，這個植物園以野地草花為主，一區一區，很好的色彩搭配，很像在翻閱十九世紀英國生物科學的植物圖鑑，工筆勾勒細緻，敷彩淡雅，沒有太過藝術家的主觀誇張，安靜如宋人冊頁寫生，非常適合裝一簡單木框，掛在書房或起居間角落，跟暈黃壁燈在一起，不起眼，卻使人安心。

    不知道曾幾何時，美術館變得喧鬧躁動了，進去就想逃離，走去原野，走進林木深處，看大樹下野地的小草花。

    美是修行，少了靜定謙遜，浮躁喧譁，就離美越來越遠了吧……

    植物園微雨，葉片花瓣上都是細細晶瑩雨珠。有一區種的都是耬斗花，有白色、藍紫色、明黃色，也有紅白相間不同品種。耬斗花（columbine）也叫「夢幻草」，正式學名是（Aquilegia），屬毛茛科植物。這種花的花瓣後方有很長的飄帶一樣的「花距」（spur），看起來像浮游在海裡優雅靈動的水母，這是中文「夢幻草」的來源嗎？

    我特別喜愛白色一種，尾後花距很長，帶一點不容易覺察的極淺的淡紫，像在夢中滑翔飛行，沒有重量，使人想起秦觀的句子：「自在飛花輕似夢」。'
