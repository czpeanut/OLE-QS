  section: 4
  number: 7
  type: single
  page: 1
  stem: 「孔子，名丘，字仲尼，春秋魯國人。他自年少時就好學不倦，不僅精讀詩書典籍，還學習射箭、駕馭馬車等技術，可謂允文允武。孔子首開私人講學之風，他有教無類，誨人不倦，弟子多達三千餘人。在教學上強調主動學習和思考的重要，善用啟發的方式因材施教，對後世影響頗為深遠，被尊稱為至聖先師、萬世師表」此段有關孔子的敘述，未提及下列何者？
  options:
  - label: A
    content: 生平事蹟
  - label: B
    content: 教育方式
  - label: C
    content: 後世評價
  - label: D
    content: 政治理念。
