  - label: A
    content: 夜訪「星空草原」—由廢棄光碟打造的梵谷名畫星空，在白日陽光與夜晚燈光下，展現不同風貌
  - label: B
    content: 夜宿「海生館」—與白鯨、企鵝及深海魚群同眠，還有機會一睹珊瑚產卵，珊瑚卵飄散海中如點點星光的奇景
  - label: C
    content: 夜探「淡水老街」—於淡水河畔的咖啡館中伴著咖啡香觀賞夕照，回程途中可盡情品嚐各式小吃
  - label: D
    content: 夜登 「擎天崗」—順著古道登上擎天崗，脫去鞋襪在溫泉池泡腳，洗滌一身的疲憊，再仰躺於草原上享受彷彿觸手可及的星空。
