  group_stem: '◆賞螢需知

    1.近螢觀察時應將手電筒熄滅

    2.月圓和大雨的夜晚都不適合觀螢

    3.觀螢避免涉足水深溪谷或路陡山路或多處落石的地方

    4.山區蛇類多，小心避免蛇類攻擊

    5.夜間觀螢安全很重要，記得要結伴而行，彼此相互照應

