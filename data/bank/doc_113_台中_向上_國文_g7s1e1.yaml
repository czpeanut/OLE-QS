  group_stem: '【甲】小學二年級時，一個同學的父母離婚了。大概是出於愧疚，父母給他的零用錢格外多，祖父母也時常到校門口送錢送零食。他好像錢總是花不完，永遠揣著五香瓜子，一下課就去買冰棒。那時的我一星期也吃不上一根冰棒，很羨慕他，總盼著爸媽早日離婚。（陸慶屹
    四個春天）

    【乙】小時候買冰淇淋，在商店門口，我總是將銅板緊握在手心直到發熱，還在猶豫著「要選什麼口味呢」，當時的冰淇淋實在美味極了。長大以後，你已經沒有這種「甜蜜的煩惱」，可以把所有口味的冰淇淋爽快地放進購物籃裡了。這是個什麼東西都能輕易入手，什麼美味都吃得到，什麼體驗都能輕易獲得的年代。正因為如此，有些夢想就讓它保持在渴望的狀態不是很好嗎？還未得到滿足的渴望，就好好守護吧。（松浦彌太郎
    嶄新的理所當然）'
