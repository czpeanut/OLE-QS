  type: single
  page: 1
  stem: 一朗媽媽想在暑假安排全家旅遊，參加旅展之後拿到不少廣告單。請問下列哪一行程所規畫的主題，比較有機會讓一朗一家見證〈夏夜〉一詩中「撒了滿天的珍珠和一枚又大又亮的銀幣」的景象？
