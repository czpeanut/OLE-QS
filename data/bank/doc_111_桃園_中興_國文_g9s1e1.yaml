  stem: 下列文句「」中的字，何者意義說明正確？
  options:
  - label: A
    content: 「孰」能磨之：難道
  - label: B
    content: 朝夕相與「俱」：具備
  - label: C
    content: 「接」之以道：招待
  - label: D
    content: 主然而違者，「替」之：改變。
  group_stem: '治亂之本在君之好惡，好惡在所習。少習也正，其長也必賢；少習也不正，其長難與共為治矣。不幸而然，則將磨之。

    孰能磨之？擇人焉，朝夕相與俱，出入言動相綴接焉，是則可磨之也。主然1 而是2 者，助之；主然而違者，替之。不釋

    3，則極論之。除其蔽慾而接之以道，不使其見邪者而變焉，其志素定矣，然後可與共為治。

    （1.然：如此 2.是：正確 3.釋：了解）

    ――改寫自曾鞏〈論習〉'
