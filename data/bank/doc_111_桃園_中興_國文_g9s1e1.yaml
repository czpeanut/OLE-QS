- id: doc_111_桃園_中興_國文_g9s1e1_s2_38
  section: 2
  number: 38
  type: single
  page: 4
  stem: 上文中畫線處，應填入下列何者？
  options:
  - label: A
    content: 塞翁失馬，焉知非福
  - label: B
    content: 瓜田不納履，李下不正冠
  - label: C
    content: 吃人嘴軟，拿人手短
  - label: D
    content: 偷雞不著蝕把米。
  group_stem: '大野狼，正準備咬斷大公雞的脖子，就在這千鈞一髮的緊張時刻，外表醜陋的母雞卻從破雞舍上方的樹幹一躍而下，尖尖的雞嘴不偏不倚地用力啄在大野狼的右眼上。在瞬間失去一隻眼睛的劇痛下，大野狼放開了爪中緊掐著的大公雞，雙手撫著鮮血直流的右眼痛苦地哀嚎。

    在經過一陣劇痛及狼嚎後，憤怒的大野狼本想對已趁機飛到大樹上的大公雞與母雞，做出最嚴厲無情的報復攻擊。可是剛剛一陣大聲的哀嚎，已驚醒了貧窮農夫趕緊地拿著鋤頭外出查看，大野狼見狀只能感嘆：「今晚真是_____________。」然後，自怨自艾地夾著尾巴落荒而逃了。

    在大樹的枝幹上，大公雞與母雞並肩站著，大公雞滿臉羞愧地對母雞說：「真沒想到，平時我自以為傲的美麗外表和嘹亮的叫聲，不但沒有替我帶來好運，反而差點給我惹來殺身之禍。而且，以往我經常嘲笑妳弱小的身軀和難看的外貌，並且不斷地欺侮妳，妳不但不記仇，今晚還在最危急的時刻勇敢地出手救了我一命。我真是大錯特錯了，現在，我要鄭重地向妳說聲對不起，以後就讓我們和睦相處、禍福同當吧！」聽完了大公雞的懺悔後，母雞在一旁「咯、咯、咯…」低沉但興奮地叫著。

    （改寫自網路文章公雞與母雞）'
