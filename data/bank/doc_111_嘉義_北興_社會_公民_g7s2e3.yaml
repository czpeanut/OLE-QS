  group_stem: '社論觀點

    各政黨於大選前提出各類社會安全政策，例如：0 至 6 歲由國家扶養、銀髮族年金退休保險制度、擴大新住民就業方案等，對民眾而言，政黨與候選人提出的社會安全政策極可能影響他們投票的決定，因為與自身息息相關的社會福利制度有助於滿足生活需求，提升生活品質。

    在福利完善的國家，如北歐五國，高福利是建立在高稅制上，如何讓我國民眾理解社會福利並非免費，政見中的優惠政策都是由社會全體共同負擔，也許可以更客觀的思考各項社會福利制度制定的適切性，並減少公共資源的浪費。'
