  group_stem: "※請閱讀下列文章，回答49～50 題： \n  人類冠狀病毒最早是在1960年代被發現，外表有很多突起，看似皇冠的樣子，所以被命名為冠狀病\n\
    毒(coronavirus)。這類病毒會引起人類和脊椎動物的呼吸道疾病，從輕微的症狀如普通感冒，到嚴重者\n引起嚴重急性呼吸道症候群（SARS）。 \n中東呼吸症候群冠狀病毒（Middle\
    \ East respiratory syndrome coronavirus 簡稱MERS-CoV）於\n2012年9月首次從沙烏地阿拉伯一名嚴重肺炎病人的痰液中分離出來。為單股RNA病毒，屬於冠狀病毒科\n\
    之beta亞科。此病毒與引起嚴重急性呼吸道症候群(SARS)的冠狀病毒並不相同，其特性仍在研究中。 \nMERS-CoV目前尚不清楚感染源，有報告指出在埃及、卡達與沙烏地阿拉伯駱駝體內分離出的MERS-\n\
    CoV病毒與確診病例分離出的病毒基因高度相似；並且發現非洲與中東地區的駱駝體內有該病毒抗體。目\n前無法排除此病毒有其他傳染來源的可能性，為此曾經調查山羊、牛、羊、水牛、天鵝，及野鳥等動物\n\
