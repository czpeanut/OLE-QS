  stem: 此次大爆炸悲劇，是由於砂輪機切割未關閉的天然氣管線，導致瓦斯洩漏並引發爆炸。試推測下列何者為較合理的原因？
  options:
  - label: A
    content: 焊接產生的高溫火花，引發瓦斯燃燒爆炸
  - label: B
    content: 因環境溫度過高，引發甲烷分解後，燃燒爆炸
  - label: C
    content: 甲烷為催化劑，加速瓦斯燃燒爆炸
  - label: D
    content: 瓦斯自發分解，產生氧氣與其他氣體自燃爆炸
  group_stem: 西元2025 年2 月13 日，台中新光三越中港店12 樓美食街發生氣爆，起因疑似施工人員使用砂輪機切割未關閉的天然氣管線，導致瓦斯(主要成份為甲烷)洩漏並引發爆炸。事故造成5
    人死亡、38 人受傷，波及9 至12 樓，為台灣史上最嚴重的百貨公司公共安全事故之一。調查顯示，氣爆可能因密閉空間內瓦斯完全燃燒所致，現場未見明顯火焰。台中市政府對新光三越裁罰新台幣150
    萬元，並勒令無限期停業。新光三越提供慰問金，協助傷者與家屬，並設立臨時賣場以減少商家損失。台中地檢署持續調查，釐清事故責任。
  answer:
  - A
  answer_source: answer_key_vlm
