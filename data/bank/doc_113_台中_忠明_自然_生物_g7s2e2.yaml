  section: 1
  number: 50
  type: single
  page: 6
  stem: 關於上述文章所述，請問下列說法何者正確？
  options:
  - label: A
    content: 巧人與直立人同屬不同種
  - label: B
    content: 台灣人的學名都是 Homo habilis
  - label: C
    content: 直立人和智慧人可以產生具有生殖能力的後代
  - label: D
    content: 現代人和黑猩猩在分類階層上有 6 階層相同。
  group_stem: '素養六：

    人類的起源

    關於人類的起源，早在 250 萬年前有巧人（Homo habilis）、60 萬年前有直立人（Homo erectus），20 萬年前智慧人（Homo sapiens）的祖先和尼安德塔人曾共同生存，但從距今三萬五千年前起，地球只剩下智慧人存活，演變成現代的各式人種。也因此，目前和人類關係最近的生物，是靈長目巨猿科的黑猩猩（Pan
    troglodytes），其遺傳基因和人類有 98.4% 的相似度。'
