  type: single
  page: 5
  stem: 關於文章敘述，請問下列何者有誤？
  options:
  - label: A
    content: 人造肉是指不從動物身上取得的肉類，不用殺生
  - label: B
    content: 是直接從長毛象抽取肌肉細胞，經由細胞分裂大量繁殖
  - label: C
    content: 由非洲象基因填補長毛象的缺失 DNA 序列，表示兩者親緣關係較近
  - label: D
    content: 畜養牲畜會排放甲烷，所以人造肉相對減碳又環保。
  group_stem: '素養一：

    用長毛象 DNA 做出「史前肉丸」

    根據《每日郵報》報導，澳洲人造肉公司「Vow」從長毛象的肌肉蛋白質提取了 DNA 序列，並用非洲象的基因密碼填補缺失 DNA 序列，接著再將其放入綿羊的幹細胞中，複製生長出
    200 億個細胞，最後製出長毛象肉，不過科學家們卻不敢食用，參與製作長毛象肉丸的科學家表示，「人類已經幾千年沒有見過這種蛋白質了，所以不知道吃下後免疫系統會有什麼反應。」該公司的目標，是用細胞培養的肉作為屠宰動物肉品的替代品，因為製造人造肉比畜養牲畜使用的土地和水還要少，同時也不會產生甲烷，希望能藉此緩解大規模畜牧業所造成的全球暖化問題。(2023.03.29
    中時新聞網)'
