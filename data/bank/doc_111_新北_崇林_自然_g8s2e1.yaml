  group_stem: 某研究團隊採集臺灣各處的溫泉水樣本化驗，並依其成分或酸鹼性加以分類。依溫泉水主要成分物質：氯離子、碳酸氫根離子、硫酸根離子，可分類為氯化鹽泉、碳酸氫鹽泉、硫酸鹽泉。溫泉水依據酸鹼性的不同，又可分類為酸性、中性及鹼性溫泉。含有碳酸氫根離子的溫泉，因其含有鈉、鎂、鈣、鉀離子的不同，可形成中性或弱鹼性的溫泉。硫酸鹽泉多呈酸性且酸性比酸雨強很多倍，直接使用此種溫泉需特別注意是否出現身體不適的症狀。
