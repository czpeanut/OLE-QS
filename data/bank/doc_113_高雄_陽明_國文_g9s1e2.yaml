    content: 孟子辯才無礙，且善於冷嘲熱諷，《孟子》一書幾乎都是辯論的文章
  - label: B
    content: 和眾多的人辯論，宣揚孟子重利輕義思想，也為後世留下不朽的名篇
  - label: C
