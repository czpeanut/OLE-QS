  group_stem: "齊人有一妻一妾而處室者，其良人出，則必饜酒肉而後返。其妻問所與飲食者，則盡富貴也。其妻告其妾曰:「良人出，則必饜酒肉而後返；問其與飲食者，盡富貴也，而未嘗有顯者來，吾將瞷良人之所之也。」\n\
    \    蚤起，施從良人之所之，遍國中，無與立談者。卒之東郭墦間之祭者，乞其餘；不足，又顧而之他――此其為饜足之道也。\n    其妻歸，告其妾，曰：「良人者，所仰望而終身也，今若此!」與其妾訕其良人，而相泣於中庭，而良人未之知也，施施從外來，驕其妻妾。\n\
    \    由君子觀之，則人之所以求富貴利達者，其妻妾不羞也，而不相泣者，幾希矣!\n――摘自《孟子·離婁篇》"
