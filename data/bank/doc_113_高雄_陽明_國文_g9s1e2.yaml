    \    在這場死傷嚴重的天然災害中，全臺十萬多棟房屋全倒或半倒，超過二千四百人 死亡、一萬多人受傷，更留下一百三十四位失去雙親的失依兒，最大的已是十七歲青少年，最小的才剛出生十天，每個人面臨的困難點都不盡相同。\n\
    \  硬體重建，是相對容易的。房屋倒塌後再蓋，可能比原來的更富麗雄偉，很快就會被所有人忘記，這兒曾見證了天崩地坼的時刻。\n  然而，心靈的重建卻沒這麼容易。\n\
    \  「睡不好，就一直哭，到家自己一個人睡的時候還在哭，就覺得說，為什麼是我？為什麼你們都離開了，就丟下、剩下我一個人？就覺得很不公平。」阿倫回憶當時辦完家人告別式後的心情。\n\
