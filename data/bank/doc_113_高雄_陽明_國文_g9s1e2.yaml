  group_stem: "《孟子》最主要的文學特色，是善於辯論。孟子說:「予豈好辯哉？予不得已也。」一本《孟子》幾乎都是辯論的文章。他和梁惠王辯，和許行辯，和告子辯，都是有名的辯論。\n\
    \    他辯論的技巧靈活多變，有時開門見山、單刀直入，例如「孟子見梁惠王」章，劈頭就告訴梁惠王:「王何必曰利？亦有仁義而已矣。」然後緊扣利、義二字分析，凸出中心思想。有時虛實莫測、欲擒先縱，如「齊桓\
    \ 晉文之事」章，孟子避免正面交鋒，他首先提出以羊易牛的往事，肯定齊宣王有實行王道的思想基礎，然後啟發誘導，勸勉齊宣王「保民而王」，處處顯示出孟子的機敏和智慧。"
