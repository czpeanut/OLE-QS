- id: doc_113_高雄_陽明_國文_g9s1e2_s3_38
  section: 3
  number: 38
  type: single
  page: 7
  stem: 請問下列何者並非手語餐廳老闆的義行？
  options:
  - label: A
    content: 優先錄用聽障者為主力員工
  - label: B
    content: 將餐廳盈餘捐助給手語推廣協會
  - label: C
    content: 讓人們意識到身障者所面臨的挑戰與困難
  - label: D
    content: 藉獨特點餐方式讓人們了解聽障社會的文化。
  group_stem: "如果你從未學過手語，對手語也一竅不通，卻誤打誤闖踏入一間只能用手語與服務生溝通，而且僅可用手語點菜的餐廳時，你會如何反應呢？是不假思索的掉頭走人，或是樂於「入境隨俗」，以既來之則安之的開放態度，去體驗及享受一次別開生面的用餐方式？\n\
    \    月前，加拿大 多倫多就開了這麼一家備受矚目的餐廳，世界重要媒體無不競相報導，也引發了不少餐廳經營者與老饕們的熱烈討論。這家取名為「手語」（Signs）的餐廳，大概是怕人誤以為是手語學校什麼的，故在它極其醒目的店招下方，標明是餐館與酒吧。\n\
    \     或許，你不免好奇，客人未見得都是聽障人士，若絲毫不懂手語，又如何比手畫腳的點餐，會不會因而鬧出一堆烏龍與笑話？其實，貼心的店家早就設想及此，不懂手語的客人一落座，就可發現菜單、桌面以及四周牆壁皆有手語教學圖示，供顧客臨場現學現賣，如此幾可解決一切點餐、用餐問題，包括與服務生做簡單的交談。\n\
    \    說實在的，聽障人士不易找到穩定的工作，這並非加拿大一國如此，而是舉世皆然的普遍現象，臺灣當然亦不例外。而多倫多這家手語餐廳的老闆，宅心仁厚，他毅然決然的以實際行動服務聽障社群，不但優先錄用聽障者為主力員工，而且也以別出心裁的點餐方式，大力推廣手語，藉此讓人們更進一步了解聽障社會的文化。\n\
    可想而知，這樣一家開風氣之先的手語餐廳，能否一炮而紅，或長期經營下去，事先實難逆料，就連店家自己也無絕對把握。所幸它自開張以來，一直大受歡迎，經常一位難求，有意上門者非得早早訂位不可，而這倒不是因為其餐飲有多麼出色，而是大家都想感受一下新的生活體驗，也躍躍欲試的想看看自己能否做到「手語即時通」，順利點餐。\n\
    \    從店家的立場而言，開此餐廳的主要目的，不在於牟利。如今一開張就能夠門庭若市，固然教人喜出望外，但最令他感到欣慰的是，他的初心，獲得祝福；他的發心，獲得廣大社會的回應；他的善心，獲得聽障朋友一致的肯定！\n\
    \    換言之，這家手語餐廳之所以能像春雷啟戶般，驚動萬方，不僅在於它僱用了三、四十位聽障者，讓彼等有一安身立命之所，更在於它喚醒了人們的良知與正義感。使大家驚覺到，長期以來，聽障者普遍受到社會的歧視與不公待遇，屬於人權受到侵害的弱勢族群。\n\
    \    平心而論，一般正常人很難將心比心體會身障者所面臨的挑戰與困難，否則年幼失明又失聰的美國著名教育家海倫•凱勒，就不會在〈假如給我三天光明〉提到：「我常想，如果每一個人在其成年的早期，有幾天時間能成為瞎子與聾子，應不失為一件幸事。黑暗將使他更珍惜視力，寂靜將教他領略聲音的美妙。」\n\
    \    這位曾被美國〈時代週刊〉選為「人類十大偶像之一」，並榮獲美國「總統自由獎章」的二十世紀典範人物，一針見血的點出了人們往往把天賜的官能視為理所當然，毫不珍惜，而對聽障或視障者所受到的身心痛苦，也常常冷漠以待，遑論挺身而出，為其福祉與權益盡一己之力。\n\
    \    相形之下，多倫多手語餐廳老闆的義行，就益發顯得難能可貴，其作為不啻是聽障者的一大福音！\n    猶記，筆者年輕時讀到美國大文豪馬克•吐溫的語錄：「仁慈是一種聾子能聽見、盲人能看見的語言」，內心並無所感，如今數十寒暑已過，自己已到「倦眼看盡人間事」的年紀，再思此言，就很能體認其深意了。\n\
    \    在咱們臺灣，處處餐廳林立，種種美食不斷挑戰人們的味蕾。然而，不知在這塊以人情味著稱的土地上，究竟何時何處才會有手語餐廳的出現呢？\n――節選自王壽來〈一家手語餐廳的誕生〉"
