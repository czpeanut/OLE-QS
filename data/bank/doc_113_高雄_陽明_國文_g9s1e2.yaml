  type: single
  page: 3
  stem: 關於張岱〈湖心亭看雪〉一文的說明，下列敘述何者有誤？
  options:
  - label: A
    content: 「人鳥聲俱絕」以聽覺摹寫方式，顯現出情境的寂寥，也為下文冒寒看雪的奇 景奇遇鋪陳
  - label: B
    content: 以「痕、點、芥、粒」等量詞摹寫湖上影子，呈現天地遼闊蒼茫，人、物顯 得相對渺小
  - label: C
    content: 以舟子的話反襯出張岱與金陵客的雅興，雙方對山水的痴迷表現，非一般人 能心領神會
  - label: D
    content: 從「余強飲三大白而別」可見作者應付二客的虛情與微慍，遂匆匆告別對方 的盛情邀約。
  group_stem: "崇禎五年十二月，余住西湖。大雪三日，湖中人鳥聲俱絕。是日，更定矣，余拏一小舟，擁毳衣爐火，獨往湖心亭看雪。霧凇沆碭，天與雲、與山、與水，上下一白。湖上影子，惟長堤一痕、湖心亭一點，與余舟一芥、舟中人兩三粒而已。\n\
    \    到亭上，有兩人鋪氈對坐。一童子燒酒，爐正沸。見余大喜，曰:「湖中焉得更有此人﹗」拉余同飲，余強飲三大白而別。問其姓氏，是金陵人客此。及下船，舟子喃喃曰:「莫說相公痴，更有痴似相公者。」\n\
    ――張岱〈湖心亭看雪〉"
