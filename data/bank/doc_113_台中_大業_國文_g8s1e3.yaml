- id: doc_113_台中_大業_國文_g8s1e3_s2_38
  section: 2
  number: 38
  type: single
  page: 4
  stem: 依據上文，關於歐洲人栽種玉米的敘述，下列何者最適當？
  options:
  - label: A
    content: 法國栽種成功後才傳入西班牙
  - label: B
    content: 早年被認為較適合作為動物飼料
  - label: C
    content: 16 世紀時已成為多數地區的主食
  - label: D
    content: 羅馬尼亞由出口小麥轉為出口玉米
  group_stem: "玉米是印地安人送給世界的禮物。歐洲人初抵美洲之際，那裡已有各型玉米作物。比起舊世界農作物，玉米恰好位\n於稻米和小麥的生長帶之間，在稻米嫌太乾或小麥嫌太濕的區域，皆有良好收成。玉米田單位面積產量幾乎是小麥田兩\n\
    倍。少有作物及得上玉米，短短一個生長季就能提供大量碳水化合物和脂肪。\n    歐洲人接納玉米較晚，或許是 1550 年代至 18 世紀，歐洲進入一段相對寒冷期。也或許是多數歐洲人一向同意英\n\
    國博物學家蓋瑞德的看法，他在 1597 年寫道:「雖然印地安民族迫於所需，認為玉米是很好的食物，但我們仍可輕易判\n定:它的營養成分有限，不易甚至不利消化，比較適合當豬食而不是給人食用。」\n\
    \    16 世紀的歐洲有許多地方栽植玉米，但做為廣大地區的主食，大約已是下個世紀後期。約翰•洛克在 1670 年代提\n到:「法國南部好幾處都有玉米田，農民稱之為『西班牙小麥』，他們告訴我這是給窮人做麵包吃的。」到了18\
    \ 世紀，\n玉米已經成為法國南部飲食的基本元素。我們姑且大膽猜測:或許它曾在法國人口重新成長的過程扮演重要角色――18\n世紀前數十年，法國人口曾明顯衰減。西班牙人口曾在\
    \ 17 世紀減少，18 世紀開始回增；在波河谷地種植玉米的義大\n利，17 世紀下半期人口也曾衰減，之後又回增。這些地中海區人口的消長，應該和玉米有關。\n\
    \    今日，玉米對東南歐的重要性更勝於西南歐。隨著人口增加，玉米及其他美洲作物如馬鈴薯、美國南瓜的栽種也逐\n漸擴張。18 世紀以前，玉米在羅馬尼亞並無地位，19\
    \ 世紀後幾十年，羅馬尼亞人投注心力和倚賴玉米幾乎不亞於墨西\n哥人。他們種小麥也種玉米，前者出口，後者自用。玉米和小麥搭配輪種，成效良好，使羅馬尼亞成為歐洲一大穀倉。\n\
    \    依賴玉米為主食的程度，正隨著人口壓力降低而一起減低，但過往的影響仍在。美國人類學者郝平恩在《塞爾維亞\n一村落》提到，奧拉撒奇當地比較窮困的農民還是吃玉米而非小麥做的麵包，他們僅有的幾畝地，也是種玉米而非小\n\
    麥，因為_____________________。順便一提:奧拉撒奇農家菜園裡那一畦畦的青椒、番茄、四季豆、美國南瓜，應該會\n讓印地安老兄備感親切。\n\
    ――改寫自克羅斯比《哥倫布大交換:1492 年以後的生物影響和文化衝擊》"
