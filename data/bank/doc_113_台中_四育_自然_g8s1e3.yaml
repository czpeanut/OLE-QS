- id: doc_113_台中_四育_自然_g8s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '三百多年前，偉大的科學家牛頓，就像是一位好奇寶寶，對世界充滿了疑問。

    有一天，他看著窗外燦爛的陽光，心中突然冒出一個想法：

    「陽光看起來白白的，它真的是單純的一種光嗎？」

    為了尋找答案，牛頓做了一個有趣的實驗。他拿出一塊三角形的玻璃塊，也就是________，讓陽光穿過它。

    神奇的事情發生了！原本白色的陽光，竟然變成了一道彩虹，投射在牆壁上，就像仙女手中的彩帶一樣美麗！

    牛頓仔細觀察，發現這道彩虹是由紅、橙、黃、綠、藍、靛、紫七種顏色組成的。

    他興奮地跳了起來：「原來，太陽光是由這麼多種顏色的光混合而成的啊！」

    這個發現，讓牛頓解開了光的秘密，也為人類 understanding 光的世界打開了一扇窗。

    請問，牛頓是利用哪一項物品，發現這個驚人的秘密呢？'
  options:
  - label: A
    content: 三稜鏡
  - label: B
    content: 凸透鏡
  - label: C
    content: 平面鏡
  - label: D
    content: 凹面鏡
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 理化
      code: 4-5
      title: 色散與顏色
      chapter: 第4章 光、影像與顏色
    textbook: 八上理化 4-5 色散與顏色
    labeled_by: ai
