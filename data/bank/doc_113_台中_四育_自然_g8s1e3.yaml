  section: 1
  number: 25
  type: single
  page: 4
  stem: '放學了，肚子咕嚕咕嚕叫，你走進超商，一眼就看到熱騰騰的熱狗在向你招手！等等！你有沒有注意到，這些美味的熱狗，都是躺在一個亮晶晶的「金屬圓柱」裡滾動呢？原來，這個金屬圓柱可不是普通的容器，它可是讓熱狗快速均勻加熱的大功臣！想想看，如果用塑膠或木頭來裝熱狗，會發生什麼事呢？

    沒錯！塑膠可能會融化，木頭可能會燒焦，而且熱度傳遞得很慢，熱狗要等很久才會熟。

    所以，超商才會選擇用「金屬」材質來製作熱狗機，這是利用了金屬的哪個特性呢？'
