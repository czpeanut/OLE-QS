  page: 3
  stem: '小葵今天心情很好，打算打開媽媽珍藏的草莓果醬，準備塗在香噴噴的吐司上好好享用！沒想到，這個玻璃瓶的蓋子不知道被誰鎖得太緊了，小葵使出九牛二虎之力，臉都漲紅了，還是打不開！

    她試著用布包住瓶蓋，增加摩擦力，但依舊紋風不動；她又試著敲敲瓶蓋，希望能讓它鬆動一些，結果還是徒勞無功。小葵沮喪地坐在椅子上，看著美味的果醬卻吃不到，真是心急如焚！

    突然，她想起自然課老師教過熱脹冷縮的原理，腦中靈光一閃，想到一個好方法！請問，小葵可以用下列哪個方法，輕鬆打開這瓶頑固的果醬呢？'
