- id: doc_113_台中_四育_自然_g8s1e3_s1_27
  section: 1
  number: 27
  type: single
  page: 4
  stem: '伍茲是一位對寶石充滿熱情的工匠，他夢想著能創造出世上最璀璨的鑽石！

    他知道，鑽石和鉛筆芯裡面的石墨，雖然看起來截然不同，卻是由相同的元素「碳」組成的。

    「如果能把普通的石墨變成閃耀的鑽石，那該有多棒啊！」伍茲心想。

    於是，他開始研究如何將其他物質轉化為珍貴的鑽石。他知道，使用含有相同元素的物質作為原料，成功的機會會更大。

    現在，伍茲的實驗室裡擺放著各種材料：黑乎乎的石墨、金光閃閃的黃金、紅通通的銅塊，以及堅硬的鐵塊。

    請問，伍茲應該選擇哪一種物質，才能實現他的鑽石夢呢？'
  options:
