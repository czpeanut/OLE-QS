- id: doc_113_台中_四育_自然_g8s1e3_s2_32
  section: 2
  number: 32
  type: single
  page: 5
  stem: '寒流來襲，冷風颼颼，讓人只想躲進溫暖的被窩裡！

    這時候，如果能來一杯熱呼呼的茶，暖暖身子，那該有多好啊！

    小美拿出茶葉罐和馬克杯，準備泡一杯熱騰騰的紅茶。

    她先將 20℃、300 公克 的冷水倒入壺中，放在瓦斯爐上加熱。

    瓦斯爐的火力很旺，每分鐘可以提供 2000 卡 的熱量。

    請問，小美大約需要等幾分鐘，水才會煮沸呢？（假設熱量完全被水吸收）'
