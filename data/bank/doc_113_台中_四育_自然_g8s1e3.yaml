- id: doc_113_台中_四育_自然_g8s1e3_s1_26
  section: 1
  number: 26
  type: single
  page: 4
  stem: '大家平常量體溫的時候，看到的溫度數字後面都會跟著一個「℃」符號，這就是我們熟悉的「攝氏」溫度。

    但是，你有沒有聽過「華氏」溫度呢？其實，世界上還有一些國家，像是美國，他們習慣使用「華氏」來表示溫度。

    這兩種溫標就像兩種不同的語言，雖然說的都是溫度，但表達方式不一樣。

    例如，我們熟悉的「水沸騰」溫度是 100℃，如果用華氏溫度表示，就會變成 212℉，是不是很不一樣呢？

    現在，讓我們來挑戰看看，你能分辨哪些是攝氏溫度，哪些是華氏溫度嗎？

    以下關於溫度和溫標的配對，哪一個是 正確 的呢？'
