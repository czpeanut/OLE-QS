- id: doc_113_台中_四育_自然_g8s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: '媽媽今天晚上要煮一桌豐盛的晚餐，廚房裡傳來陣陣香味，肚子都餓了呢！

    仔細一看，媽媽用了好多不同的鍋具：

    (甲) 亮晶晶的不鏽鋼鍋，正燉煮著香噴噴的雞湯。

    (乙) 輕巧的鋁製炒鍋，快速翻炒著翠綠的青菜。

    (丙) 美麗的陶瓷湯鍋，裡面盛著熱騰騰的玉米濃湯。

    (丁) 黑色的鐵製平底鍋，煎著滋滋作響的牛排。

    這些鍋具看起來都好厲害，各有各的用途！

    你知道它們是由什麼材質做的嗎？這些材質又有什麼特性呢？

    以下關於這些鍋具材質的敘述，哪一個是 錯誤 的呢？'
  options:
  - label: A
    content: 不鏽鋼鍋、鋁製炒鍋和鐵製平底鍋都是金屬做的。
  - label: B
    content: 鋁製炒鍋導熱很快，一下子就能把菜炒熟，真方便！
  - label: C
    content: 陶瓷湯鍋好漂亮，但是要小心不要摔到地上，它很容易破掉喔！
  - label: D
    content: 鐵製平底鍋不能導電，所以不能用在電磁爐上。
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 理化
      code: 5-5
      title: 熱的傳播方式
      chapter: 第5章 溫度與熱
    textbook: 八上理化 5-5 熱的傳播方式
    labeled_by: ai
- id: doc_113_台中_四育_自然_g8s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: '你有沒有發現，有些羽絨外套摸起來特別蓬鬆，感覺裡面裝滿了空氣，穿起來就像裹著一層溫暖的棉被，一點都不怕冷！這是為什麼呢？

    原來，羽絨外套的保暖秘密就藏在這些蓬鬆的羽毛裡！

    想像一下，這些羽毛就像一座座小小的「空氣城堡」，把冷空氣阻擋在外，讓你的體溫不容易流失。

