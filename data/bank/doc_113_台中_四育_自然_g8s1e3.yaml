- id: doc_113_台中_四育_自然_g8s1e3_s2_33
  section: 2
  number: 33
  type: single
  page: 5
  stem: '想像一下，有兩個材質不同的小金屬塊，它們的質量相同，但是「吸收熱量的能力」和「溫度上升的幅度」卻不一樣！現在，這兩個小金屬塊的比熱比是 1：2，也就是說，其中一個的「熱量容器」是另一個的兩倍大。

    當它們吸收熱量的比為 3：4 時，也就是說，大的容器裝了 3 杯熱水，小的容器裝了 4 杯熱水。

    請問，這兩個小金屬塊的溫度上升的比是多少呢？'
  options:
  - label: A
    content: 3：8
  - label: B
    content: 1：1
  - label: C
    content: 6：4
  - label: D
    content: 2：3
