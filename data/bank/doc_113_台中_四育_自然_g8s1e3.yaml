  number: 10
  type: single
  page: 2
  stem: '已知某元素性質活潑，可與水實驗室裡，小艾正在進行一項有趣的實驗！

    他小心翼翼地將一小塊未知金屬放入裝有水的燒杯中，觀察接下來會發生什麼事。

    哇！金屬塊在水中激烈地反應，發出嘶嘶聲響，還冒出許多氣泡！

    小艾拿出試紙測試反應後的水溶液，發現試紙變成藍色，表示水溶液呈鹼性。

    「太神奇了！」小艾奮地記錄下實驗結果。

