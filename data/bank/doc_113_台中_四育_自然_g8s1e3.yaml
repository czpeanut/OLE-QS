  stem: '妘妘泡了一壺熱茶，正準備享受午後的悠閒時光。她拿起茶壺，倒了一杯茶，輕輕啜飲一口...

    「哎喲！」妘妘皺起了眉頭，茶水實在太燙了，根本無法入口。她心想「看來得加點冷水才行。」。

    於是，妘妘從飲水機裝了一些 20℃ 的冷水，慢慢加進茶壺裡，一邊加一邊攪拌，直到茶水的溫度降到可以入口的程度。原本茶壺裡有 90℃ 的熱水 100 mL，加了冷水後，溫度變成了
    40℃。

    假設過程中熱量損失很小可以忽略，請問妘妘加入了多少 20℃ 的冷水呢？'
  options:
  - label: A
    content: 100 mL
  - label: B
    content: 150 mL
  - label: C
    content: 200 mL
  - label: D
    content: 250 mL
  tags:
