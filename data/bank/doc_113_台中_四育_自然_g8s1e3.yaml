  type: single
  page: 4
  stem: "讓我們一起搭乘時光機，回到過去，探索物質組成的奧秘吧！\n第一站：古希臘\n早在兩千多年前，古希臘哲學家德謨克利特就提出了一個大膽的猜想：\n「如果把物質不斷地分割下去，最後會得到什麼呢？」\n\
    他認為，最終會得到一種不可分割的微粒，並將它命名為「原子」（atom），意思是「不可分割」。\n第二站：十九世紀\n時間來到十九世紀，英國科學家道爾頓提出了「原子說」，他認為：\n\
    物質是由原子組成的。\n原子是堅硬實心的小球，不能再分割。\n第三站：二十世紀初\n 二十世紀初，科學家們發現原子並非「不可分割」，而是由更小的粒子組成！\n\
    拉塞福透過實驗發現了「原子核」，它位於原子的中心，帶正電。\n第四站：二十世紀至今\n後來的科學家們陸續發現了「質子」和「中子」，它們都位於原子核內。\n\
    質子帶正電，中子不帶電。原子核外則有帶負電的「電子」繞著它運行。\n而「化合物」則是由兩種或兩種以上的原子，以固定比例結合而成的新物質。\n經過幾千年的探索，人類終於揭開了物質組成的神秘面紗！\n\
    現在，你能根據這些科學家的發現，將下列粒子由小到大排列嗎？"
  options:
  - label: A
    content: 原子核、質子、原子、化合物
  - label: B
    content: 原子、化合物、質子、原子核
  - label: C
    content: 化合物、原子、原子核、質子
  - label: D
    content: 質子、原子核、原子、化合物
