- id: doc_112_彰化_埤頭_自然_g8s2e2_s2_39
  section: 2
  number: 39
  type: single
  page: 2
  stem: 當病患吃下胃藥後，胃酸濃度與胃中pH值的變化為何？
  options:
  - label: A
    content: 能提高胃酸的濃度、提高胃部內的pH值
  - label: B
    content: 能提高胃酸的濃度、降低胃部內的pH值
  - label: C
    content: 能降低胃酸的濃度、提高胃部內的pH值
  - label: D
    content: 能降低胃酸的濃度、降低胃部內的pH值
  group_stem: '★請閱讀下列敘述後，回答39~40題

    依據健保局的統計資料，臺灣平均每年申報的制酸劑(俗稱胃藥或胃乳片)超過20億顆，也就是平均每位民眾一年使用超過一千顆胃藥，以國人平均每年就診次數14次，每次開三天份的藥量，再加上傳統觀念「西藥傷胃」的情況來看，這個數字並未被高估，也可見在臺灣制酸劑被濫用的情形。

    制酸劑依作用時間分成速效型與長效型兩種，速效型制酸劑的主要成分為碳酸氫鈉($NaHCO_{3}$)；長效型制酸劑的主要成分有氧化鎂($MgO$)、氫氧化鎂($Mg(OH)_{2}$)與氫氧化鋁($Al(OH)_{3}$)。制酸劑的原理為利用緩解釋出的氫氧根離子中和胃酸解離出的氫離子，以減輕胃酸過多引起的不適。'
