- id: doc_113_台中_向上_自然_g7s2e1_s1_49
  section: 1
  number: 49
  type: single
  page: 2
  stem: 從文章中，請問下列哪一項敘述不合理？
  options:
  - label: A
    content: 馬鈴薯皮色是性狀，紅色、黃色、白色是不同表徵
  - label: B
    content: 若皮色為紫色的馬鈴薯發芽，將其當種薯種植，其子代的馬鈴薯皮色表必定為紫色
  - label: C
    content: 常見的馬鈴薯皮色是黃色，黃色為顯性性狀
  - label: D
    content: 不同皮色的馬鈴薯是基因型式不同
  group_stem: '**馬鈴薯為草本植物，塊莖可供食用，是全球第四大重要的糧食作物，地下塊莖呈圓、卵、橢圓等形，有芽眼。薯皮有紅、黃、白或紫色。花為白、紅或紫色。漿果（馬鈴薯果實）呈球形，綠或紫褐色。

    嫁接是一種園藝繁殖技術，可將二個不同的植物體相互接合，使其合生成一個個體而繼續生長。「馬鈴茄」為番茄嫁接馬鈴薯，可以同時收成番茄(地上部)與馬鈴薯(地下部)。而「茄鈴薯」是將馬鈴薯與番茄上下對調反向嫁接，雖然兩者都沒有收成，卻能使馬鈴薯持續開花，供作不同品種雜交的材料，以創造新品種。

    (試回答 49 ~50 題)'
