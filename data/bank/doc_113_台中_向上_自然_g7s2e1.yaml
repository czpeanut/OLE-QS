    content: 花瓣顏色
  - label: B
    content: 種子顏色
  - label: C
    content: 果肉顏色
  - label: D
    content: 葉面絨毛
  group_stem: '**小巴研究某植物的性狀遺傳，已知下表性狀皆由一對遺傳因子所控制，實驗中的親代皆產生 1000 株的子代，且未發生突變，實驗數據如下，試回答
    47 ~48 題：


    | 性狀 | 特徵 | 親代配對 | 子代 |

    | :--- | :--- | :--- | :--- |

    | 花瓣顏色 | 紅色、白色 | 紅色 ╳ 紅色 | 全為白色 |

    | 葉面絨毛 | 有毛、無毛 | 有毛 ╳ 無毛 | 有毛:無毛=1:1 |

    | 果肉顏色 | 紅色、黃色 | 紅色 ╳ 黃色 | 全為紅色 |

    | 種子顏色 | 黑色、綠色 | 綠色 ╳ 綠色 | 綠色:黑色=3:1 |'
