- id: doc_111_桃園_文昌_國文_g7s1e1_s2_29
  section: 2
  number: 29
  type: single
  page: 5
  stem: 以下敘述，何者錯誤？
  options:
  - label: A
    content: 管仲曾經三戰三走，鮑叔不以管仲怯懦，知道管仲家有老母待養也
  - label: B
    content: 管仲曾為鮑叔謀事卻反而更困窘，鮑叔不以管仲愚昧，知道時機有利與不利
  - label: C
    content: 管仲曾三次做官三次遭到罷黜，鮑叔不以管仲不成材，知道管仲還未遇到好的時勢
  - label: D
    content: 管仲在一開始困頓的時候，曾經向鮑叔借貸，分利息的時候多分給自己，鮑叔不以管仲貪，因為知道他貧窮。
  group_stem: "管仲夷吾(1)者，潁上(2)人也。少時常與鮑叔牙游(3)，鮑叔知其賢。管仲貧困，常欺(4)鮑叔，鮑叔終善遇之，不以為言。已而鮑叔事(5)齊公子小白(6)，管仲事公子糾。及小白立為桓公，公子糾死，管仲囚(7)焉。鮑叔遂進(8)管仲。管仲既用，任政於齊。齊桓公以霸，九(9)合諸侯，一匡天下(10)，管仲之謀也。\n\
    \ 管仲曰：「吾始困時，嘗與鮑叔賈⑾，分財利多自與，鮑叔不以我為貪，知我貧也。吾嘗為鮑叔謀事而更窮困，鮑叔不以我為愚，知時有利不利也。吾嘗三仕三見逐於君，鮑叔不以我為不肖⑿，知我不遭⒀時也。吾嘗三戰三走，鮑叔不以我為怯，知我有老母也。公子糾敗，召忽⒁死之，吾幽囚受辱，鮑叔不以我為無恥，知我不羞小節，而恥功名不顯於天下也。生我者父母，知我者鮑子也。」鮑叔既進管仲，以身下之。子孫世祿於齊，有封邑者十餘世，常為名大夫。天下不多⒂管仲之賢而多鮑叔能知人也。\n\
    【注釋】\n⑴管仲（前723~前645）：名夷吾，字仲，春秋時的政治家。\n⑵潁：潁河，發源於河南，流入安徽。\n⑶游：交往。\n⑷欺：這裡是錢物不平均分而多占的意思。\n\
    ⑸事：侍奉。\n⑹小白：齊襄公的弟弟，姓姜，名小白。公元前685 年，齊襄公被殺，他與另一個兄弟公子糾爭奪君位。公子糾被殺，公子小白即位為齊桓公。\n⑺囚：被拘禁。\n\
    ⑻進：薦進，推舉。\n⑼九：古漢語中「三」和「九」往往指多，非實指。下文中的「三仕而三見逐」中的「三」也指「多次」\n⑽匡：糾正，扶正。\n⑾賈：做生意，經商。\n\
    ⑿不肖：不賢，無能。\n⒀遭：遇。\n⒁召忽：當初與管仲都是公子糾的手下。\n⒂多：稱讚。\n 史記 司馬遷"
