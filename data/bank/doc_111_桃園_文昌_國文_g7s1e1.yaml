  type: single
  page: 3
  stem: 從文中可以看出主角的心情十分難過，這是因為他內心有何種感傷？
  options:
  - label: A
    content: 主角即將遠行，離家前的依依不捨
  - label: B
    content: 母親無法親眼看到他領取碩士學位
  - label: C
    content: 樹欲靜而風不止，子欲養而親不待
  - label: D
    content: 身體髮膚，受之於父母，不敢毀傷
  group_stem: "閱讀測驗\n 第一次替媽挑衣服。要怎麼挑？環視牆間、床頭、縫衣機上，凌亂掛放的衣服，重讀媽凌亂的心情，他胸中一片黯然。印象中，媽一直忙個不停，晚上常挑燈處理學校的帳冊。遠自二十五年前爸離開這個家，媽就老了。「挑三件。」他謹記吩咐。打開黑褐木櫃，他一一翻揀。厚重藏青大衣、爸的老式西裝、一套日本和服、兩塊布料、舊內衣褲。……他越翻，心越沉。媽根本沒什麼新衣。\n\
    \ 大學畢業，到火車站接媽。媽穿件紫色圓點套裝，沾沾自喜：「特別做的。」碩士畢業，國父紀念館前廣場，媽滿面春風，穿花色套裝：「慶祝你拿到學位。」爾後，國軍英雄館內，他手持照相機捕捉媽奕奕神采，簇新雪白的套裝訴說媽服務滿四十年獎章的歡喜。前後十二年裡，他只記得，媽共做這三件新衣。\
    \ 找出那三件色澤已淡的套裝。想到媽讀的是女子家政學校，在撫養獨子成長的悠悠歲月裡，忘了裝扮自己；想到媽的同事說：「這件很好！買給妳兒子穿！」媽便不管價錢買下帶給他。他不禁泫然。身為人子，他根本不會照顧媽。「或許，自己是女的，會好些」撫觸套裝上的紫色圓點，他揣想。這樣，自己便可陪媽逛街，幫媽挑新衣，讓她愁苦神情因亮麗衣飾而轉為歡顏。如此，媽便不會老說：「這是女人家的事……」會跟自己談她的愛好……\n\
    \ 「媽應該會喜歡這三件。」默默自答。他將這三件收妥，放入紙袋。在北上的火車裡，注視以夜色為襯底的長窗映著他的臉。媽說：「你的鼻、嘴、下顎，長得最像我。」他仔細端詳自己的鼻、嘴、下顎。瞳孔內靜靜浮起媽媽臨終的臉。\n\
    \ 新衣 張春榮"
