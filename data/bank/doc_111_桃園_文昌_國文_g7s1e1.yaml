- id: doc_111_桃園_文昌_國文_g7s1e1_s2_30
  section: 2
  number: 30
  type: single
  page: 5
  stem: 根據貪睡的長頸鹿一文，叢林法則是指什麼？
  options:
  - label: A
    content: 永不鬆懈
  - label: B
    content: 恰如其分
  - label: C
    content: 主導時局
  - label: D
    content: 改變環境。
  group_stem: "我喜歡去非洲，特別是接近原始世界的地區，每有誤入電影侏羅紀國家公園的錯覺。有一次，還飛到尚比亞旅行。\n 天色微亮的清晨，我爬到比人高的吉普車上，往叢林去。前方的一處樹叢有窸窣聲，哇，是一個長頸鹿家族在吃「早餐」。我們慢慢靠近，熄掉車上引擎。這是奇妙的經驗，我正在陪「陸地上身長最高動物」吃早餐。我突發奇想的問嚮導：「四公尺高的大個子，怎麼睡覺？長頸鹿的睡眠時間有多長？」\n\
    \ 「只睡三分鐘！」這位幹練的黑人嚮導說，長頸鹿的每次睡眠時間非常短，而且是站著睡覺。我以為聽錯，不可置信的再問一次，嚮導解釋：「哪一隻白目的長頸鹿膽敢深睡，就準備長眠吧。」在物競天擇的萬年演化、在獅子、豹子環伺的非洲叢林裡，敢大搖大擺睡覺的長頸鹿已變成獅子的腹中物。\n\
    \ 長頸鹿的睡眠時間是所有哺乳動物中最短，一天睡眠總時間低於兩小時，進入深度睡眠狀態只有幾分鐘。牠們通常站著打瞌睡，長長的脖子往下垂或掛在樹梢，就是牠們最奢侈的休息。因為當睡夢階段醒來、並地上站起來，長頸鹿要花一分鐘，這很危險，嚴重地減低它的逃生能力。所以，當長頸鹿真想趴著睡時，它的兩條前腿和一條後腿彎曲在肚子下，另一條後腿伸展在一邊，長脖子呈弓形彎向後面伸展到那條後腿旁。這種奇特的睡姿既能縮小目標，又可在緊急情況下一躍而起。不只如此，長頸鹿還能睜著眼睛睡覺。\n\
    \ 要在非洲活下來，目前數量超過十萬隻的長頸鹿，已練就了多項本事。\n 相較之下，獅子，每天能睡十五至二十個小時，三分之二的時間都在睡覺，沒人能拿牠如何。這就是叢林法則。如果你無法成為叢林之王，就要是永不鬆懈的長頸鹿。很嚴酷，你只有三分鐘睡眠，完全沒有貪睡的權利，貪睡的下場，就是出局。在大自然，不只長頸鹿，草食性動物的平均睡眠時間都是比肉食性動物短。\n\
    \ 職場與商場上，不也是如此。生命原本就是一個選擇，當獅子未必好，當長頸鹿未必差，只要一切恰如其分。想擁有權力、想主導棋局的獅子，能力就要相當，也要願意承擔。人生最可怕的是，錯置。所謂錯置，就是搞不清楚自己是誰或想成為什麼樣的人，沒有獅子的能力、地位，卻想過獅子的生活。\n\
    \ 獅子有獅子的得失，何必羨慕牠一天可睡十五小時？有人想當叢林之王，碰到獵物（問題）卻搞不定。相對的，我也看過很多平凡但可愛的小人物，認分與踏實，當一隻長頸鹿就像長頸鹿。美國洛杉磯大學的科學家研究發現，飲食和環境決定哺乳動物的睡眠需求量。\n\
    \ 我因此好奇，後天環境如果變遷，行為能有多大改變？從非洲回來後，這問題一直在我腦海中縈繞。我好奇，台北動物園的長頸鹿，不再有獅子時時獵殺，牠們的睡眠還會只有三分鐘嗎，牠們還是維持站立睡覺的「祖訓」嗎？環境改變確實產生影響，雖然仍是只睡幾分鐘。不過，有時候會趴下來睡。\n\
    \ 貪睡的長頸鹿"
