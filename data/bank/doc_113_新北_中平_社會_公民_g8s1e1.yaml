  section: 1
  number: 1
  type: single
  page: 1
  stem: 根據上述推論，下列何者最不符合印度的政治現況？
  options:
  - label: A
    content: 印度9 億選民透過大選展現了民主政治強調的主權在民的理念
  - label: B
    content: 大選結果顯示，2024 年印度出現了政黨輪替情形
  - label: C
    content: 印度人民黨在選舉中獲勝，具有執政的合法性與正當性
  - label: D
    content: 印度人民黨在今年大選蒙受了無預期的挫敗，若因此有官員為此辭職下台，將是責任政治的展現。
  group_stem: '根據下述文章內容，回答第1~2 題：

    印度2024 年大選，9 億選民在一個半月內經七輪投票，結果揭曉。執政黨印度人民黨主導的全國民主聯盟（NDA）獲得過半數席位，贏得2024 年印度大選。現任總理莫迪如無意外將進入第三任期。但是，全國民主聯盟獲得的選票與預期的壓倒性優勢相去甚遠，未能超過穩定多數所需的272
    席，而要和其所領軍的其他地區性政黨組執政聯盟，莫迪意外受挫。相較於2019 大選時單獨取得303 席強勢過半，印度人民黨在今年大選蒙受了無預期的挫敗，在國會下院總共輸了63
    席。而其反對黨對手、領導印度獨立、有著開國總理尼赫魯，以及其女甘地夫人等名人的「印度國大黨」卻取得了99 席，較上次的52 席有著近倍數的成長，從近乎被消滅的狀態中重新崛起。'
