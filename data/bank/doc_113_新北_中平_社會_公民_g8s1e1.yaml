- id: doc_113_新北_中平_社會_公民_g8s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 根據第一段文章內容，提及到那些國家要素因氣候變遷影響，預計到本世紀末可能威脅到吐瓦魯國家存續？
  options:
  - label: A
    content: 人民、領土
  - label: B
    content: 領土、政府
  - label: C
    content: 人民、領土、主權
  - label: D
    content: 人民、政府、主權。
  group_stem: '根據下述文章內容，回答第3~6 題：

    吐瓦魯位於澳洲和夏威夷之間，由9 個島嶼組成，人口約1 萬2000，長期面臨氣候變遷和海平面上升風險。目前，該國首都周圍有高達40%面積會在漲潮時沒入海面下。澳洲去年已和吐瓦魯簽訂具里程碑意義的雙邊協定，自明年起將每年為280
    名吐瓦魯人設立特殊簽證，為移民澳洲另闢途徑。預計到本世紀末，整個國家都將被淹沒消失。

    吐瓦魯外交部長柯飛在第27 屆聯合國氣候變遷大會（COP27）上向各國領導人宣布吐瓦魯計畫「元宇宙建國」。要為國家生存尋找替代解決方案，建立一個數位版的吐瓦魯。目的是引起全世界的關注，但柯飛很清楚虛擬世界並不是解決吐瓦魯存續問題的最優解方。他明確指出，吐瓦魯需要的是通過簽訂限制化石燃料條約等舉措，專注於減少氣候變遷的影響。

    吐瓦魯海域擁有豐富鮪魚資源，每年光靠出售捕撈權就能賺取約3000 萬美元收益，是該國主要收入來源。因此，吐瓦魯總理戴斐立亦將在聯合國大會中爭取國際支持，希望藉由向國際海洋法庭提案或通過聯合國決議，來修改國際海洋法，盼各國永久承認其海洋疆界確保當局保有這片廣闊海域的主權。'
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 公民
      code: 1-1
      title: 什麼是國家？
      chapter: 第1章 國家與民主政治
    textbook: 八上公民 1-1 什麼是國家？
    labeled_by: ai
  ai_answers:
    gemini: A
    qwen: A
  answer:
  - A
  answer_status: ai_generated
  answer_source: ai:gemini+qwen
