  stem: "一、題目：慎言\n二、說明：弟子規有云：「凡出言，信為先。詐與妄，奚可焉？話說多，不如少。惟其是，勿佞巧。奸巧語、穢汙詞，市井氣，切戒之。」劉墉也說：「能不傳話，最好不要傳話；能不套話，最好不要套話。能不涉入『背後的批評』，最好不要涉入。」請仔細思考這兩段話，並回想你平常說話的習慣以及你所觀察到其他人的情形，將你的觀察及想法、體會寫出來，文長約五百字。\n\
    三、注意事項：１文中不可洩露自己的身分。２請勿使用詩歌及小說形式寫作。３使用「黑色筆」書寫，勿用鉛筆。４文章必須分段，並使用新式標點符號。\n四、評分換算標準：六級分-１０分\
