- id: doc_112_嘉義_北興_國文_g7s1e1_s3_1
  section: 3
  number: 1
  type: single
  page: 1
  stem: 有關〈夏夜〉的敘述何者正確？
  options:
  - label: A
    content: 是一首童詩，作者所寫內容是自己感受到的夏夜種種情境
  - label: B
    content: 全詩分三小節，分別描寫黃昏、夏夜來臨以及深夜的景致
  - label: C
    content: 描寫了夏夜的寧靜與溫馨，刻劃出夏夜裡的活潑生機
  - label: D
    content: 善用擬人手法，使整首詩呈現出節奏感。
  lesson_raw:
    title: 夏夜
    basis: 題目指明〈夏夜〉
