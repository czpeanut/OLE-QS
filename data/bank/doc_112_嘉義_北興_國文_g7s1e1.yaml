- id: doc_112_嘉義_北興_國文_g7s1e1_s4_25
  section: 4
  number: 25
  type: single
  page: 3
  stem: 根據本文，作者的星座是？
  options:
  - label: A
    content: 處女座
  - label: B
    content: 雙魚座
  - label: C
    content: 牡羊座
  - label: D
    content: 天蠍座。
  group_stem: "我觀察到，星座對我們判斷別人的性格，有一定的幫助。例如，我曾經跟好幾個處女座的人共事工作，他們真的比其他人重視細節，而且對於一些特定原則格外堅持，不會輕易妥協。又例如，我們身邊雙魚座的人，的確會有些自我矛盾衝突的想法與做法，而且都常常改變自己的主張，很不容易捉摸呢！\n\
    \  不過，星座對我最大的意義，倒不是在觀察了解別人，反而是在檢討和警惕自己。我們這一代的人接觸星座比較晚，我記得是到了高中，才真正搞清楚原來自己是牡羊座的。我還驚訝地在書中讀到，牡羊座最大的性格特色之一，是沒耐心，缺乏毅力，很難堅持完成長期的事業，而且脾氣暴躁，容易發怒。\n\
    \  我不得承認，這些我好像都有。可是，我又很清楚，這些正是我最討厭的，是我恨不得自己可以沒有的缺點問題。原來，這些缺點並不是因為我修養不夠，而是藉由某種神祕天象，植入在我的本性中的？那麼，我是不是就該接受星座給予我的先天條件呢？\n\
    \  困惑地想了幾天，我找到自己的答案。我還是相信：人是可以靠主觀努力讓自己變好，讓自己比較接近心目中理想的人。就算牡羊座的我，身體中帶著強烈暴躁沒耐心的元素，我還是可以問自己：「要做一個暴躁沒耐心的人嗎？」我還是可以回答：「不！我最討厭暴躁沒耐心的人了！」\n\
    節錄自 楊照〈愛與自覺修養〉"
