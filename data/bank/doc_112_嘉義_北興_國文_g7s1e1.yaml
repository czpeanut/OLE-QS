- id: doc_112_嘉義_北興_國文_g7s1e1_s4_21
  section: 4
  number: 21
  type: single
  page: 3
  stem: 關於本文說明何者正確？
  options:
  - label: A
    content: 立意、取材比審題重要
  - label: B
    content: 立意的方向有二：一個是抒發親情、友情，另一個是對社會、自然的關懷之情
  - label: C
    content: 「從我們所敘述的經驗與感受，得到體悟與想法」中的「體悟與想法」就是指「取材」
  - label: D
    content: 寫作文章的立意要陽光、正向、積極。
  group_stem: "「立意」、「取材」的重要程度與「審題」鼎足而三，若「審題」是劃定寫作範圍，「立意」就是確立寫作主旨，「取材」便是揀選材料來表現主旨；亦即從我們所敘述的經驗與感受，得到體悟與想法。\n\
    \  立意的方向有二：或抒發感情，如親情、友情，甚至對社會、自然的關懷與體察之情；或表達觀點，如團結的重要、不應以貌取人等等。但不論是抒情或說理，大方向均為「陽光、積極、正向」，以一句話來概括，便是「(讓我)成為更好的人」。\n\
    節錄自 聯合報寫作教室〈談取材與立意〉"
- id: doc_112_嘉義_北興_國文_g7s1e1_s4_22
  section: 4
  number: 22
  type: single
  page: 3
  stem: 作者認為我們真正的敵人是？
  options:
  - label: A
    content: 環境
  - label: B
    content: 對手
  - label: C
    content: 自己
  - label: D
    content: 朋友。
  group_stem: "一個病人如果求助於巫師，他的問題是：「誰害我生病？」如果求助於醫生，問題就會變成：「什麼原因使我生病？」後者使我們從事身體檢查，看看自己的身體本身有什麼毛病？前者卻把責任推到「誰」身上，然後施法求靈，終究是治不好病的。\n\
    \  現代人難得反躬自問：「或許是我自己的錯吧？」尤其，處在逆境之中，很容易怨天尤人，而絲毫不知改善自勉。這種情形就像做幾個稻草人來毆打洩憤一樣，不僅於事無補，而且常陷於偏狹的我執牢籠之中。真正的敵人，往往是自己的性格、陋習、成見與做法。\n\
    \  然而，自責卻又往往是失敗之後最便宜的藉口，自責使人關起心門，停止長進，甚至造成人格的萎縮以及深度的憂鬱，久而久之，便成了危險的訊號，像心中蔓生的雜草，掩蔽了原有的清爽面目。\n\
    \  假使你有敵人的話，請記住王爾德的一句名言：「活得快樂，就是最好的報復。」這句話對於內在的與外在的敵人同樣適用。與其光是自責，不如痛切自省，看看自己的弱點何在，努力改善，然後繼續走向人生大道，那麼最後的成功還是可以期待的。"
