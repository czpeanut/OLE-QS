    content: 愛讓人分不清楚孰輕孰重
  - label: B
    content: 只要有所求，人與人就無法互相信任
  - label: C
    content: 即便懂得手足之情，也不見得洞見愛的真理
  - label: D
    content: 愛會令人感到喜悅，忘卻痛苦。
  group_stem: "一位印度教徒，步行到喜馬拉雅山的聖廟去朝聖。路途非常遙遠，山路非常難行，空氣非常稀薄，他雖然攜帶很少\n的行李，但沿途走來，還是顯得舉步維艱，氣喘如牛。\n\
    \  他走走停停，不斷往前遙望，希望目的地趕快出現眼前。就在他的前方，他看到一個小女孩，年紀不會超過十歲，\n背著一個胖嘟嘟的小孩，也正緩慢的向前移動。她喘氣得很厲害，也一直在流汗，可是她的雙手還是緊緊呵護著背上的\n\
    小孩。\n  印度教徒經過小女孩的身邊，很同情的對小女孩說：「我的孩子，你一定很疲倦，你背得那麼重！」\n  小女孩聽了很不高興的說：「你背的是一個重量，但我背的不是一個重量，他是我弟弟。」\n\
    \  沒有錯，在磅秤上，不管是弟弟或包袱，都沒有差別，都會顯示出實際的重量，但就心而言，那小女孩說得一點沒\n錯，她背的是弟弟，不是一個重量，包袱才是一個重量。她對她的弟弟是出自內心深處的愛。\n\
    \  愛沒有重量，愛不是負擔，而是一種喜悅的關懷與無求的付出。（愛沒有重量）"
