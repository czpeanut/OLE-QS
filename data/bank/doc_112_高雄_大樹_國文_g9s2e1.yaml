  group_stem: "兩小兒辨日\n孔子東游①，見兩小兒辯鬥②。問其故。一兒曰：「我以③日始出時去人近④，而日中⑤時遠也。」一兒以日初出遠，而\n日中時近也。一兒曰：「日初出大如車蓋⑥，及⑦日中，則如盤盂⑧，此不為遠者小而近者大乎？」一兒曰：「日初出滄\n\
    滄涼涼⑨，及其日中如探湯⑩，此不為近者熱而遠者涼乎？」孔子不能決⑪也。兩小兒笑曰：「孰⑫為汝多知⑬乎？」\n\n注釋:\n① 東游：到東方遊歷。 ②辯鬥：爭辯、爭論。\
    \  ③以：以為、認為。  ④去人近：距離人比較近。去，距離。\n    ⑤日中：正午。 ⑥車蓋：古代車子上遮擋陽光和雨水的篷蓋，像雨傘一樣，有柄。  ⑦及：到。\n\
    \    ⑧盤盂：泛指器皿。盂，音ㄩˊ，盛食物或漿湯的容器。      ⑨滄滄涼涼：清涼而略帶寒意。\n  ⑩探湯：用手試於熱水之中，表示溫度很熱。   \
    \ ⑪決：判定。  ⑫孰：誰。   ⑬知：音ㄓˋ，智慧、聰明。"
  answer:
  - B
