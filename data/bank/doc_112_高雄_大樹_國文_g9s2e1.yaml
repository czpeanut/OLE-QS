  stem: 四位同學一起去看米勒的畫展後，提出自己對米勒作品的感想。哪一位的說法最能符合米勒的情況？
  options:
  - label: A
    content: 米勒的畫，喚起我們對天地久違的敬意
  - label: B
    content: 米勒繪畫技巧雖不好，但畫作質樸感人
  - label: C
    content: 米勒常一氣呵成完成畫作，故傳世百幅
  - label: D
    content: 米勒用色鮮明，表達出他的富足歡樂的生活型態。
  group_stem: "敬天禮地的巨人──米勒\n米勒始終深信《聖經》上的古訓：「你必汗流滿面才得餬口。」早在1847年，他就曾說：「藝術並不是消遣，而是戰鬥，\n\
    是會把人輾得粉身碎骨的車輪。」他相信：「痛苦是藝術家表現力的強壯劑。」\n還在當礦工的梵谷，就是被這段話激勵了。傳記作家思爾（Alfred Sensier）1881年出版《米勒的生活與作品》，梵谷不\n\
    久就借到這本書，手不釋卷連夜讀完。他激動地寫信給弟弟西奧：「米勒真了不起啊！他說藝術即戰鬥，我也必須將生命獻\n給藝術。」\n梵谷從米勒的畫中發現「寶貴的珍珠」，也就是「人類的靈魂」。米勒自己則說：「畫家先要被眼前的事物深深感動，然\n\
    後才能達到這種創作的意境。」\n米勒不愛談繪畫技巧。「對於我，描繪技巧的說明是多餘的，我從不費心思在這種事上。假如我有描繪技巧的話，那只\n有來自對畫題的取捨與人生的苦悶。」他重視繪畫的思想，認為「僅在耍手指花樣的畫家，以純熟巧技在創作上獨占鰲頭，\n\
    是件可笑的事」。米勒主張「手指是思想的謙卑佣人」。\n米勒為人，個性淳樸，終生擇善固執。由於未曾滿意自己的作品，米勒總是耗費過多時間，一再修改重畫，因此在他30\n\
    年的創作生涯，留給後人僅約80幅畫作。\n                                 （節錄自賴素鈴〈米勒──敬天禮地的巨人〉）"
  answer:
  - A
