  group_stem: 身心障礙者權益保障法公布至今已逾42年，教育部推動校園政策也有30多年，監察院調查校園無障礙設施和相關政策是否符合法令及國際公約，發現電管建置訂定的建築物無障礙設施設計規範中，無障礙廁所等無人體工學尺寸，參採成人身高，並不符合國中小學生人體工學尺寸，造成教師導學國小學生生活自主學習時的障礙，有待教育部切實檢討。此外，教育部致使學生在安全措施不足的環境中體魄操練，甚至被要求轉學、拒絕入學等嚴重影響身心障礙學生權益之情形，且未能積極提出改善優先順序及改善計畫，均難辭督管與管理失當之責。因此，監察院糾正教育部，並函請教育部會同內政部營建署，督同各地市政政府及所屬學校確實檢討改進。請問：
