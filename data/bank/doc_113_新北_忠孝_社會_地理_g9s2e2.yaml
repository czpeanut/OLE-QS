- id: doc_113_新北_忠孝_社會_地理_g9s2e2_s1_15
  section: 1
  number: 15
  type: single
  page: 1
  stem: 「2025 年1 月7 日開始，美國加州洛杉磯一帶陸續爆發多處野火，火勢在強風吹襲下迅速擴散，至少18 萬人被迫撤離、上萬棟建築被燒毀。火災的原因與每年冬季的焚風有密切的關係，當地人習稱這種焚風為「聖塔安娜風」。這種焚風很乾燥，風勢又很強，所以會導致野火一直擴散、難以撲救。聖塔安娜風起源於西部內陸沙漠的高壓，從山上吹向南加州海岸的低氣壓地區。」根據以上新聞的報導，聖塔安娜焚風主要是從哪一座山吹往哪一個海洋？
  options:
  - label: A
    content: 阿帕拉契山、大西洋
  - label: B
    content: 阿帕拉契山、太平洋
  - label: C
    content: 落磯山、大西洋
  - label: D
    content: 落磯山、太平洋
