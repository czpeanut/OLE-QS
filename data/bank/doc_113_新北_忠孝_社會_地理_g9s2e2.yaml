  stem: 十八世紀的大西洋三角貿易，歐洲的商船繞行一圈大約需要兩個月，從歐洲出發，乘著洋流，航行到西非購買黑奴，或用布匹、珠寶、槍枝換取黑奴，然後順著盛行的風與洋流到中美洲的西印度群島以黑奴換取農作和金銀礦等商品，回程時順著洋流和盛行風返回歐洲。依據歐洲、非洲、美洲的相對位置判斷，從西印度群島將農作和金銀礦等商品運回歐洲的船隻，主要是靠著下列哪一盛行風和洋流的幫助才得以返航？
