  stem: 「新疆是中國目前最大的行政區，自清末以來，獨立運動的支持者便主張，新疆與中國並無直接隸屬的關係，為維護當地居民的獨立自主，應脫離中國的統治而獨立。因此，新疆常出現武裝暴動，引起國際社會的關注。」請問：綜合考量新疆的自然與人文背景，上述兩者的衝突，下列哪一個原因的描述是有「錯誤」的？
