  section: 1
  number: 20
  type: single
  page: 1
  stem: 台灣和南韓均屬於地狹人稠的人口高密度國家，不管從經濟發展模式、產業結構，甚至是高工時、少子化等問題，都極為類似。兩國經濟發展軌跡有許多類似之處，就連經濟成長率、國民年均所得也在伯仲之間。請問：下列何者「不是」臺灣、南韓兩國的經濟發展共同點？
  options:
  - label: A
    content: 經濟發展以「出口」為主要導向
  - label: B
    content: 經濟結構均以扶植中小企業為主
  - label: C
    content: 缺乏礦產，原物料須仰賴「進口」
  - label: D
