- id: doc_113_新北_中平_社會_公民_g9s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: '15. 在資源有限的情況下，將資源做最有效率的利用，是生活中最常見的做法，但不管做任何一種有效率的分配，都有其優缺

    點，尤其是在對待弱勢者、穩定經濟方面，故落實公平正義也是資源分配上很重要的課題。請問：下列哪一項措施無法落

    實公平正義？【素養導向】'
  options:
  - label: A
    content: 當市場上出現雞蛋嚴重不足，價格不斷飆漲，民眾買不到雞蛋，政府會從各國進口雞蛋販售
  - label: B
    content: COVID-19 疫情嚴重期間，限制口罩出口和實名制購買。
  - label: C
    content: 某市政府讓公車營運回歸市場機制，裁撤近百條經費補貼10 年以上的虧損路線
  - label: D
    content: 颱風過後，蔬果產地受損嚴重，政府釋出庫藏蔬菜，增供冷凍蔬菜及民間進口供應市場需求
