  section: 1
  number: 23
  type: single
  page: 1
  stem: 民國23 年，中國共產黨發動「兩萬五千里長征」，意思是他們撤離原本的根據地，到新的據點繼續發展。何以中國共產黨需要發動這樣的「長征」？
  options:
  - label: A
    content: 因為原本的根據地氣候不宜發展，因此需要遷移他方
  - label: B
    content: 因為當時正值國民政府「先安內後攘外」政策的圍剿
  - label: C
    content: 因為國民政府另有打算，尋找其他地方讓其盤據發展
  - label: D
    content: 因為要躲避當地軍閥的攻擊，因此開啟了長征的旅途。
