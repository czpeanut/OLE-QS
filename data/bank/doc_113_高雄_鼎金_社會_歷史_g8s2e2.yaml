- id: doc_113_高雄_鼎金_社會_歷史_g8s2e2_s1_35
  section: 1
  number: 35
  type: single
  page: 1
  stem: 日本軍國主義的發展有其歷史脈絡，並且深入經濟、政治、軍事、文化思想等各領域。自十九世紀開始，日本積極發動對外侵略，到了二十世紀，一項全球性危機使得日本軍國主義更發昂揚，鄰近國家全成為擴張勢力的對象。請問：這項世界性的危機最有可能是下列何者？
  options:
  - label: A
    content: 西方要求解除鎖國
  - label: B
    content: 日俄戰爭慘敗國際地位降低
  - label: C
    content: 殖民地發動抗日
  - label: D
    content: 爆發世界性經濟問題。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 4-1
      title: 中日戰爭
      chapter: 第4章 現代國家的變局
