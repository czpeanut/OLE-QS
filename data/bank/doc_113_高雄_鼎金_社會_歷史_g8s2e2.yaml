  stem: 歷史學者們在敘寫「中日戰爭」這段歷史的時候，多半會將戰爭分成前期、後期，戰爭前期，中國節節敗退，政府遷往大後方；戰爭後期，中國終於取得奧援，獲得勝利不再是那麼遙遠的事情。依照上述，中日戰爭最可能以哪一個歷史事件作為前後期的分水嶺？
