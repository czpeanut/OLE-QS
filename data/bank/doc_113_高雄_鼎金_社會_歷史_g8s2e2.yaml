  stem: 若不是此事，中國現代史非常有可能改寫。對國民黨來說，張學良的作為足以稱為「千古罪人」，以致國民黨的剿共事業功敗垂成；對共產黨而言，張學良卻是「千古功臣」，使得共產黨絕處逢生，形勢轉危為安。此事之後，國、共兩黨採行了什麼策略？
