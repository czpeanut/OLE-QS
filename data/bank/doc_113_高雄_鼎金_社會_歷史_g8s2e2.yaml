    labeled_by: ai
- id: doc_113_高雄_鼎金_社會_歷史_g8s2e2_s1_36
  section: 1
  number: 36
  type: single
  page: 1
  stem: 中國與日本的近現代史發展，兩者關係密不可分，相互羈絆。因此，老師希望同學針對日本的發展史進行討論，下列哪一位同學的說法錯誤？
  options:
  - label: A
    content: 明明：日本取得了很多殖民地，像是臺灣、澎湖跟朝鮮等
  - label: B
    content: 美美：日本之所以能崛起，與明治維新脫不了關係
  - label: C
    content: 娜娜：日本渴望得到更多資源，造成了軍國主義的興起
  - label: D
    content: 哲哲：戰爭前的日本經濟高度發展，經濟大恐慌沒有對他們造成影響。
