  stem: 蔣中正於西元1943 年10 月的日記中寫道：「我接到羅斯福的電報，約定下個月的下旬在埃及會面。雖然並不想前往，不過如果拒絕就顯得不禮貌，所以相當猶豫，十分不安。」然而會後他卻寫道，會議的結果「中外輿情莫不稱頌為中國外交史上空前之勝利」。請問：蔣中正的態度在會前、會後出現如此轉變的原因為何？
  options:
  - label: A
    content: 會議當中確定將對日本提起國際訴訟
  - label: B
    content: 會議當中決定向日本投擲原子彈
  - label: C
    content: 會議當中聲明戰後日本應將東北、臺、澎歸還中國
  - label: D
    content: 會議當中決定爭取蘇聯對日宣戰。
