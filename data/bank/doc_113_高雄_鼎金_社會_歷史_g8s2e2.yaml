  section: 1
  number: 37
  type: single
  page: 1
  stem: 西元一九三〇年代，有一首民謠傳唱在當時的中國，內容為：「我的家在東北松花江上，那裡有森林煤礦，還有那滿山遍野的大豆高粱。九一八，九一八！從那個悲慘的時候，脫離了我的家鄉，拋棄那無盡的寶藏，流浪！流浪！哪年，哪月，才能夠回到我那可愛的故鄉？」這首歌敘述東北人民的流離失所，請問這是因為哪一個外國勢力對當地展開軍事行動所致？
  options:
  - label: A
    content: 日本
  - label: B
    content: 蘇聯
  - label: C
    content: 英國
  - label: D
    content: 法國。
