  section: 1
  number: 27
  type: single
  page: 2
  stem: 政府制定「特殊境遇家庭扶助條例」，協助遭逢特殊境遇情形的家庭，例如低收或中低收的家庭同時是家暴的受害者，配偶死亡、失蹤、因故服刑;或有家庭成員中並，導致主要生計負擔者就業受阻……，就可依特殊境遇家庭身份，向縣市政府申請緊急生活扶助、子女生活津貼、子女教育補助、傷病醫療補助、兒童托育津貼等協助。請問：根據上文判斷，政府制定「特殊境遇家庭扶助條例」，主要在解決下列哪方面的問題？
