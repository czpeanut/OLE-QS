  stem: '新冠肺炎疫情影響全球近2 年，各國都發現民眾因封城或無法外出及工作，使得家庭暴力的風險增加。根據我國衛福部的統計，2020 年家庭暴力事件通報案件被害人達11.4
    萬人，創歷史新高。下表是衛福部所做家暴通報案件類型統計。根據表中內容判斷，下列敘述何者正確？


    | 家庭暴力案件類型統計 | |

