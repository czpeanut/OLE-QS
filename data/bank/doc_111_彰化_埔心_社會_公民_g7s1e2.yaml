  stem: 承憲的爸爸去世後，目前家中只有他與媽媽及妹妹三人。媽媽認為妹妹是女生，遲早要嫁人，因此決定將爸爸的遺產全部留給承憲。請問：根據我國民法規定，下列敘述何者正確？
  options:
