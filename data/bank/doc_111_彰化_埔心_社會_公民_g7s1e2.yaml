  stem: 近年來，政府修訂『民法』，將法條中父權優先的不合理規定廢除，落實家庭平權。下列哪些符合修法後的條文規定？（甲）強制夫妻同姓制，女性結婚後必須冠夫姓（乙）未成年子女姓氏，由父母共同約定（丙）父親或母親任職滿六個月後，於子女3
    歲前，可申請育嬰假（丁）夫妻可共同協商採取何種夫妻財產制。
  options:
  - label: A
