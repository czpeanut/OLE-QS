  stem: '大S 與具俊曄結婚後，就與彼此家人形成新的親屬關係，下表是兩家人親屬關係的敘述，何者正確？


    | 項目 | 彼此間的親屬稱謂 | 親屬關係 |

    | :--- | :--- | :--- |

    | （Ａ） | 大S 稱具俊曄的母親為婆婆 | 對大Ｓ而言，婆婆屬於血親的配偶之姻親 |

    | （Ｂ） | 具俊曄稱大Ｓ的母親為岳母 | 對具俊曄而言，大Ｓ的母親屬於直系血親 |

    | （Ｃ） | 大Ｓ的母親稱具俊曄的母親為親家 | 親家屬於血親的配偶的血親之姻親 |

    | （Ｄ） | 具俊曄稱大Ｓ的妹婿為連襟 | 大Ｓ的妹婿是具俊曄的配偶的血親的配偶之姻親 |'
  options:
  - label: A
    content: 大S 稱具俊曄的母親為婆婆 / 對大Ｓ而言，婆婆屬於血親的配偶之姻親
  - label: B
    content: 具俊曄稱大Ｓ的母親為岳母 / 對具俊曄而言，大Ｓ的母親屬於直系血親
  - label: C
    content: 大Ｓ的母親稱具俊曄的母親為親家 / 親家屬於血親的配偶的血親之姻親
  - label: D
    content: 具俊曄稱大Ｓ的妹婿為連襟 / 大Ｓ的妹婿是具俊曄的配偶的血親的配偶之姻親
