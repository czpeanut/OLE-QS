  page: 3
  stem: "35.竇娥冤第三折 (正旦唱)〈滾繡球〉有日月朝暮懸，有鬼神掌着生死權，天地也，只合把清濁分辨，可怎生錯看了盜跖  顏淵？為善的受貧窮更命短，造惡的享富貴又壽延。天地也，做得個怕硬欺軟，却原來也這般順水推船。地也，你不分好歹何為地？天也，你錯勘賢愚枉做天！哎，只落得兩淚漣漣。\
