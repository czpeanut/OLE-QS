  stem: (  )評論家所謂「詩莊詞媚曲俗」頗得詩詞曲的審美意趣。請結合所學的各文學體裁的相關知識，判斷下列作品，何者為「曲」？
  options:
  - label: A
    content: 世事一場大夢，人生幾度新涼？夜來風葉已鳴廊，看取眉頭鬢上。  酒賤常愁客少，月明多被雲妨。中秋誰與共孤光，把盞淒然北望
  - label: B
    content: 層巒聳翠，上出重霄；飛閣流丹，下臨無地。鶴汀鳧渚，窮島嶼之縈迴；桂殿蘭宮，即岡巒之體勢
  - label: C
    content: 天教你富，莫太奢。無多時好天良夜。看錢兒硬將心似鐵，空辜負錦堂風月
  - label: D
    content: 落帆逗淮鎮，停舫臨孤驛。浩浩風起波，冥冥日沉夕。人歸山郭暗，雁下蘆洲白。獨夜憶秦關，聽鐘未眠客。
