  stem: (  ) 畫說湖心亭看雪：「這許多時間景物交代清楚之後，來到全文最精警處，張岱登上湖心亭，赫然發現有人先到了，正鋪氈對坐、飲酒賞景。他們非但來自金陵，而且帶了防寒的氈毯，可見多麼有備而來。所以張岱沒說他嚇一跳，反而講那飲酒的二人『大喜，曰：「湖中焉得更有此人！」』此情此時此景，能相遇，除了有緣，更驚訝彼此的雅興！……而且在結尾時不自己說，卻藉舟子之口說。又不直說、大聲說，而是小聲喃喃自語：『莫說相公痴，更有痴似相公者。』」根據這段文字，下列敘述何者正確？
