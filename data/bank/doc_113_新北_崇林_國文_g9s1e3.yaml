  stem: '【110、112 年教育會考改編】

    (  )「洞接納了所有被丟棄的東西，它抹去了都市的髒汙，讓大海與天空看起來比以前更澄淨。」這段文字主要在說明下列何者？'
  options:
  - label: A
    content: 洞的淨化功能，使得城市變得像大海和天空一樣澄淨
  - label: B
    content: 洞的存在為人們繪製了海市蜃樓一樣的美好
  - label: C
    content: 城市的生活環境過於髒亂，人們需要走向大海和飛向天空來淨化心靈
  - label: D
    content: 人們若能用接納的態度來面對生活中的種種不如意，心思才能恢復澄澈與平靜
  lesson_raw:
    title: 喂──出來！
    basis: 引用星新一〈喂──出來！〉課文
