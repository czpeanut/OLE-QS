    content: 鐵板沙連到七鯤
  - label: B
    content: 只留蔗葉餉群犀
  - label: C
    content: 牛車乘月夜中行
  - label: D
    content: 番檨何勞向客誇
  group_stem: "(四)臺灣竹枝詞二、十二  郁永河 \n二、  雪浪排空小艇橫，紅毛城勢獨崢嶸。 \n      渡頭更上牛車坐，日暮還過赤崁城。 \n\
    作者註：「渡船皆小艇也。紅毛城即今安平城，渡船往來絡繹，皆在安平、赤嵌二城之間。沙堅水淺，雖小艇不能達岸，必藉牛車挽之。赤嵌城在郡治海岸，與安平城對峙。」\
    \ \n十二、 臺灣西向俯汪洋，東望層巒千里長。 \n       一片平沙皆沃土，誰為長慮教耕桑。  \n作者註：「臺郡之西，俯臨大海，實與中國閩廣之間相對。東則層巒疊嶂，為野番巢居穴處之窟，鳥道蠶叢，人不能入；其中景物，不可得而知也。山外平壤皆肥饒沃土，惜居人少，土番又不務稼穡，當春計食而耕，都無蓄積，地力未盡，求闢土千一耳。」"
