  stem: (  )畫說湖心亭看雪：「想想，他（張岱）用的詞多巧！他不說『撐』一條船，卻用『拏』，『拏』字上面是奴，下面是手，自然顯示船夫用手撐的感覺。接著張岱說『擁毳衣、爐火』，『毳』這個字多妙！由三個『毛』組成，讓人想到毛茸茸的厚衣服，加上『爐火』，除了有溫度，顯示天氣寒冷，而且在夜裡點上爐火，在一片白山黑水之間，添一點『紅』！」關於這段劉墉對張岱〈湖心亭看雪〉一文用字的評析，下列敘述何者正確？
  options:
  - label: A
    content: 活用冷僻字，以展現自己的才華洋溢
  - label: B
    content: 不經意運用各項實物，展現自己富裕的生活
  - label: C
    content: 擅長運用字詞，讓文章更富藝術魅力
  - label: D
    content: 精準拿捏連綿詞的出現時機，讓文章表達更具象
