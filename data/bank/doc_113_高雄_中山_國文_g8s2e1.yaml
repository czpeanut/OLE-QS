    \ 500 萬美元。娜塔莉波曼、萊絲達拉斯霍華都曾公開抗議過同工不同酬，班尼迪克康伯拜區更曾表示：「若是同劇女主角未獲得相同的片酬，那麼將拒絕出演。」\n\
    \     根據 2022 年主計總處資料顯示，臺灣女性的時薪是男性的 84.2%，差距為 15.8%，女性需要多工作58 天才能獲得與男性相同的年薪。世界各國也面臨了同工不同酬問題，歷年來臺灣兩性平均薪資差距相較美、日、韓等國為小，2021\
    \ 年臺灣差距為 15.8%，低於日本 30.6%、南韓 30.2%及美國17%。\n     為喚起兩性同酬之公共意識，勞動部每年會發布「同酬日」，它是根據兩性平均時薪差距，計算自隔年\
    \ 1 月 1 日起， 女性需增加的工作日數。2022 年差距為 58 天，因此2023 年同酬日為2 月27 日。2024 年同酬日尚未公布，你覺得今年差距會放大還縮小呢？\n\
    \    「如果我們不討論家務分工，我們就無法真正討論同酬問題，也永遠不會實現性別平等。」2023 年諾貝爾經濟學獎的學者戈丁，在研究中發現，發生男女薪資差異的轉變，是在女性第一個孩子出生後，由此推論性別薪資差距很大程度，可以歸因於職業的中斷和每週工時的差異。\n\
    \                                                                            \
    \      （資料來源：女人迷）"
