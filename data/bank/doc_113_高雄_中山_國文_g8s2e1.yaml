- id: doc_113_高雄_中山_國文_g8s2e1_s4_21
  section: 4
  number: 21
  type: single
  page: 4
  stem: 「我不曉得把弗氏海豚形容為『迷途羔羊』是否恰當，從有限的資料上得知，弗氏海豚是深潛型海豚，牠們潛水深度深達五百公尺。海水裡，或許牠們擁有堅強的意識及堅定的方向。海面畢竟只是一個表象空間，我們能夠理解的範圍及深度的確相當有限。」根據這段文字，下列敘述何者正確？
  options:
  - label: A
    content: 指出人類對海洋生態的了解有限，不宜憑此對弗氏海豚下定論
  - label: B
    content: 藉海豚依賴海洋而生的道理，說明我們對賴以維生的陸地應當更加愛護
  - label: C
    content: 作者認為不應以陸生動物來形容海洋生物，因兩者的生活型態差異極大
  - label: D
    content: 過去人們常藉海上觀察來判定海豚的潛水深度，然而此作法的正確性有待商榷。
  group_stem: '(甲)

    〈迷途羔（ㄍㄠ）羊─弗氏海豚〉 廖鴻基

    一 八月底，夏末秋起，陽光裡多了微風。近午，船隻從外海切回岸緣，在石梯港港嘴北側，我們看到大片水花蠢動。這時，我們已經累積了兩個月的觀察經驗，遠遠一段距離外，就憑這些水花特徵，船上每個工作夥伴都能立即判斷，是那群緊張兮兮的迷途羔羊—弗氏海豚。

    二 船隻更接近些，幾隻鐮刀狀大背鰭出現在弗氏海豚群體四周，彷彿歷史重演，這是弗氏海豚和花紋海豚混成的大群體。我們也發現幾隻瓶鼻海豚在其中湊熱鬧。船隻靠近，花紋海豚不理不睬仍然慣常地泳動前進，弗氏海豚則顯得慌亂急躁了。

    三 牠們鐵定不喜歡船隻靠近，不像一般海豚，多少總會主動游近船邊。

    四 當船隻經過牠們，牠們唏哩嘩啦像一條激流閃躲，像林立的保齡球瓶被撞翻成七零八落。

    五 龐大的群體如秋風落葉散成小群，像一群頓失龍頭的散兵，毫無主見地分頭鼠竄。

    六 我感到不安，船隻的靠近顯然侵擾了牠們，但我們只是如靠近其他種海豚般靠近而已，是我們不當介入？還是牠們過度反應？

    七 牠們叫聲尖細、清晰，一點也不像是牠們粗壯的身體發出的聲音。一般海豚的眼睛很難看到，得在牠們刻意翻身近距離和你對望時，才能有機會看入牠的眼神。鯨豚的眼神神祕、深奧，我曾經從牠們的眼裡看到了粗野、仇惡或真摯和善的笑……那眼神往往能深入胸腔搜索靈魂。然而，弗氏海豚的眼睛非常容易看到，只要牠們跳出水面，就像每一個玩具布偶總是少不了圓睜睜的眼睛。我了解，我所看到的只是牠們的一個符號標記，那並不是牠們真正的眼睛。

    八 眼神的交融必須在安靜的感覺下互動。對於弗氏海豚，我始終無法感受牠的眼神，牠們太倉卒（ㄘㄨˋ）、太慌亂，連那剎那的安靜也捨不得給（ㄐㄧˇ）與。

    九 牠們分裂出的每一個小群體，隨時都在變化隊形，都在改變前進方向，時而匯合成一大群，時而再度分裂散去。即使遠遠一段距離外，牠們也是如此反覆操演著不安。牠們像一圈大漩（ㄒㄩㄢˊ）渦，盲目地在一定的範圍內盤轉。

    十 花紋海豚散在牠們四周，像是衛兵、管理員，可能更貼切的形容是牧者，在花紋海豚圈住的範圍裡，弗氏海豚在裡頭驚躍、衝撞、盤轉。那分明是一群驚慌無措的迷途羔羊。

    十一 扮演牧者角色的花紋海豚，引領這群羔羊的方向、控制牠們的活動範圍、約制牠們的不安情緒。

    十二 在這樣的關係裡，船隻特別顯得多餘。

    十三 兩個月計畫中，也唯有面對這群迷途羔羊時，我會強烈感覺到，船隻是一個介入者。

    十四 我不曉得把弗氏海豚形容為「迷途羔羊」是否恰當，從有限的資料上得知，弗氏海豚是深潛型海豚，牠們潛水深度深達五百公尺。海水裡，或許牠們擁有堅強的意識及堅定的方向。海面畢竟只是一個表象空間，我們能夠理解的範圍及深度的確相當有限。

    十五 海上茫茫，何況海面下的無底深邃，忽然間，我覺得迷惘。

    十六 也許，在牠們眼裡，我們才是迷途的羔羊。'
