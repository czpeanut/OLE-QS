  type: single
  page: 3
  stem: '「都市的行道樹多是秀氣優雅的細葉欖仁，春天發翠綠嫩葉也很好看。但我更喜歡鄉野海域的大葉欖仁，它們像流浪狗，生命力強韌，耐風，耐鹹，耐炎熱烈日炙曬，野生野長，不需要人類過度呵護嬌養。大葉欖仁樹長到十幾公尺高，枝莖寬闊蔓延，如傘張開，樹葉有巴掌大，風吹時嘩啦嘩啦響，層層疊疊的濃蔭，也是夏日遮陽庇護的好所在。城市裡慢慢不見大葉欖仁蹤影，不知是否因為它的枝莖蕪雜蔓延、落葉難清掃整理，沒有行道樹的規矩。
    ，它們自有在大自然中存活的生態信仰，它們原本不是要遵守人類規定的秩序。」(蔣勳)

    請問上述缺空處依文意脈絡最適合填入下列何者？'
  options:
