- id: doc_113_台中_中港_社會_g8s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 國家為避免民眾行使私刑正義，故制定何法懲罰犯罪？
  options:
  - label: A
    content: 民法
  - label: B
    content: 刑法
  - label: C
    content: 憲法
  - label: D
    content: 家庭暴力防治法
  group_stem: '甲、

    劉剀案，又稱台北保母虐童致死案，案中一歲半的男童「劉剀」（化名）因遭受寄養保母長期虐待，於2023年12月24日病重送醫後不治。此案在2024年臺灣大選完後才被殯葬業者揭露而引起臺灣社會廣泛關注與輿論譴責，並導致對兒童福利機構、社工制度及寄養監督制度的全面檢討。此案揭露後引起社會民眾的憤怒，欲追打虐死剴剴的保母，但仍有理性的民眾呼籲「<u>被告未經審判證明有罪確定前，推定其為無罪</u>」，切勿行使私刑正義。


    乙、

    近來國內出現不少民眾關切的重大刑案，但對於案情各家媒體報導內容基於媒體立場也有所差異。為避免媒體誤導讓民眾對事件有錯誤的認知，有法律人拍了影片說明刑事訴訟法相關規定，其中關於訊問被告連續錄音之正當法律程序之要求相關規定如下：

    第98條

    訊問被告應出以懇切之態度，不得用強暴、脅迫、利誘、詐欺、疲勞訊問或其他不正之方法。

    第100-1條

