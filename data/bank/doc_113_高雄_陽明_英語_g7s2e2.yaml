- id: doc_113_高雄_陽明_英語_g7s2e2_s4_32
  section: 4
  number: 32
  type: single
  page: 6
  stem: What can we know about the space from the reading?
  options:
  - label: A
    content: Space suits are only for men, and you can sleep in the black space suit
      on the wall.
  - label: B
    content: There is water on Mercury and Venus, and the sun never rises.
  - label: C
    content: It’s very cold and quiet in the space and there’s a lot of light in the
      ship.
  - label: D
    content: The footprints of the astronauts can not show on the moon.
  group_stem: '** In Venus, sun rises every 117 earth years.

    ** The footprints of the astronaut on the moon can stay there for many years.

    ** There is no air, so it is very quiet in the space. It’s -270.45 ℃ in the space.

    ** There is no water on Mercury, but maybe there is ice. It is near the sun, so
    it is very hot.

    ** A space suit is about one hundred twenty-seven Kg. It is for everyone, even
    a dog.

    Because white can reflect the sun, we use white for a space suit.

    ** The first animals to go to the space are fruit flies.

    ** Miss sandwiches or hamburgers? Sorry, you can’t eat them in the space.

    ** Sleep in the sleeping bag. You need to fix your bag to the wall or you may
    be in a different place when you wake up.

    ** You cover your eyes, for there is always light in the ship.

    ** It is convenient to use a spoon to eat.

    ** Drinks are in bags with straws. Always “close” the straw after drinking, or
    your drink may get out.

    ** Most food is ready-to-eat; you can just eat it or heat it up. Water in the
    space is like glue, and it can glue foods together.

    You must follow the rules in the space if you don’t want anything bad to happen.

    📖 earth 地球 space 太空 footprint 腳印 stay 停留 moon月球 astronaut 太空人 space suit 太空裝 even
    甚至 reflect反射 fly 蒼蠅 fix 固定 cover 覆蓋 light 燈光 ship 船 convenient 方便 straw 吸管 most
    大部分 glue 膠水 黏貼'
