  stem: What is the reading about?
  options:
  - label: A
    content: Vincent’s favorite colors.
  - label: B
    content: When do people show at the coffee shop?
  - label: C
    content: A painting by Vincent van Gogh.
  - label: D
    content: How to paint a good painting with two colors?
  group_stem: 'Café Terrance at Night

    Café Terrance at Night is a painting by Vincent van Gogh. The name shows two important
    parts of the painting, the coffee shop and the night sky.

    In the painting, some people are having drinks at the coffee shop. And on the
    street nearby, some people are walking. This part of the painting is bright yellow.
    The other part, the night sky, is dark blue. There are some houses under the sky,
    and they are in dark colors, too.

    The two parts, the bright yellow coffee shop and the dark blue night sky, are
    perfect together. They create a good balance.

    📖 painting 畫作 nearby 附近 dark 黑暗 bright 明亮 part 部分 perfect 完美 create 創造 balance
    平衡'
