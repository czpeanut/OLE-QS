    content: 我最愛的歌啊誰還大聲唱／我最愛的人啊都去哪裡呀／我最挺的兄弟誰還在身旁／剩一把吉他 陪著我繼續唱
  - label: B
    content: 熬過了分分合合／變成最適合的人／誰相信呢？我相信了／沒有什麼能把我們分割
