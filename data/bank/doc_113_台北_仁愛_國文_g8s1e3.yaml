- id: doc_113_台北_仁愛_國文_g8s1e3_s4_5
  section: 4
  number: 5
  type: single
  page: 1
  stem: 上完＜張釋之執法＞一課，同學們對史記的認識，何者正確？
  options:
  - label: A
    content: 小荊：史記是第一部正史，也是通史，記載內容起自黃帝以至於東漢武帝，善於表現人物性格，語言鮮明生動，極具文學價值，成為後代詩詞戲曲的典範
  - label: B
    content: 小廉：作者司馬遷，人稱太史公，因李陵事件入獄而受宮刑，卻能「幽愁發憤，著成信史照塵寰」，開創第一部以人物為中心的紀傳體史書
  - label: C
    content: 小羽：史記內容分為本紀、表、書、世家、列傳，共一百二十篇，本課便是從世家中節選出來，講述張釋之不卑不亢，依法斷案，漢文帝從善如流的故事
  - label: D
    content: 小邦：我還知道史記中項羽、曹操並非帝王，但破例列為本紀，孔子並非諸侯貴族，破例列為世家，主因是作者認為他們具有重大的影響力。
  lesson_raw:
    title: 張釋之執法
    basis: 題目指名＜張釋之執法＞一課與史記
