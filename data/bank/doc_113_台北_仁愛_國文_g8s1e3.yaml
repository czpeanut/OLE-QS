  stem: 謝道韞以「未若柳絮因風起」喻雪，為何比「撒鹽空中差可擬」高明？
  options:
  - label: A
    content: 鹽是常見用品，柳絮則難得一見
  - label: B
    content: 撒鹽空中是靜態描寫，而柳絮飄飛是動態呈現
  - label: C
    content: 撒鹽空中是人為動作，柳絮因風而起是自然行為
  - label: D
    content: 鹽重柳絮輕，撒鹽空中直線墜落，不如柳絮隨風飄飛。
