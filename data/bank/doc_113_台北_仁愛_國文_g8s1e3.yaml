  type: single
  page: 1
  stem: 請依文意判斷，下列對話中敬稱詞與謙稱詞的使用何者正確？
  options:
  - label: A
    content: 甲：「請問先生您的高見？」乙：「敝人的想法只是一些卓見，敬請參考。」
  - label: B
    content: 甲：「非常歡迎愚夫婦光臨寒舍。」乙：「閣下您太客氣了。」
  - label: C
    content: 甲：「令兄在哪裡高就？」乙：「家兄目前任職於竹科」
  - label: D
    content: 甲：「令尊今年貴庚？」乙：「我母親已屆耳順之年了。」
