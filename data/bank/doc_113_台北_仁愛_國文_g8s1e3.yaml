- id: doc_113_台北_仁愛_國文_g8s1e3_s4_8
  section: 4
  number: 8
  type: single
  page: 1
  stem: '話說張良被圯上老人稱為(甲)「孺子可教」後，得到一部太公兵法，藉此(乙)「運籌帷幄」，最終助劉邦成就大業，因功受封留侯。張良了解劉邦個性，為免功高震主，故退居幕後，不過問朝政。這便是懂得審情度勢，知其(丙)朽木不雕，不可共享富貴。由此可知張良因知曉(丁)明哲保身、(戊)「木強則折」的道理，(己)「行將就木」而得以善終。

    以上成語運用，共有哪幾項正確？'
  options:
  - label: A
    content: 甲乙丙丁戊
  - label: B
    content: 甲乙丙戊己
  - label: C
    content: 甲乙丁戊
  - label: D
    content: 乙丙丁己
