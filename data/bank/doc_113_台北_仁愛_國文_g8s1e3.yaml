  type: single
  page: 2
  stem: '過江諸人，每至暇日，輒相要出新亭，藉卉飲宴。周侯中坐而歎曰：「風景不殊，正自有山河之異！」皆相視流淚。唯王丞相愀然變色曰：「當共戮力王室，克復神州；何至作楚囚相對泣邪？」

    文中周侯為何而嘆？'
