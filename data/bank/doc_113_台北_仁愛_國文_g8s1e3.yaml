- id: doc_113_台北_仁愛_國文_g8s1e3_s4_15
  section: 4
  number: 15
  type: single
  page: 2
  stem: '郗太傅在京口，遣門生與王丞相書，求女婿。丞相語郗信：「君往東廂，任意選之。」門生歸，白郗曰：「王家諸郎，亦皆可嘉，聞來覓婿，咸自矜持。唯有一郎，在東床上坦腹臥，如不聞。」郗公云：「正此好！」訪之，乃是逸少，因嫁女與焉。

    由上文可知下列敘述何者錯誤？'
  options:
  - label: A
    content: 「君往東廂，任意選之。」可見王丞相對子姪信心十足
  - label: B
    content: 王家其他青年才俊沒有雀屏中選是因為學問不如王羲之
  - label: C
    content: 「遣門生與王丞相書」的「書」可用尺牘或魚雁代稱
  - label: D
    content: 逸少「在東床上坦腹臥，如不聞」展現出坦蕩瀟灑，神色自若的氣度。
  lesson_raw:
    title: 世說新語
    basis: 引用世說新語課文
