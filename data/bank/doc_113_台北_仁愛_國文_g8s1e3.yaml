  section: 4
  number: 18
  type: single
  page: 2
  stem: 王右軍聽到王藍田食雞子的事，笑著評論：「使安期有此性，猶當無一豪可論，況藍田邪？」這段話透露出什麼訊息？
  options:
  - label: A
    content: 有其父必有其子，正所謂「虎父犬子」，可知兩者皆不可取
  - label: B
    content: 王安期德高望重，即使個性暴躁，仍瑕不掩瑜
  - label: C
    content: 王藍田在品德修養上青出於藍
  - label: D
    content: 反映出當時品評人物的標準，以風度雍容為貴。
