    | --- | --- | --- |

    | (A) | 筆畫簡化到極致，適合快速書寫 | 表現狂放不羈的情感抒發 |

    | (B) | 規範中帶流暢，結合楷書與草書的特點 | 書信往來與文書記錄 |

    | (C) | 字形方正，筆畫嚴謹，不允許變化 | 書法練習初學者的入門書體 |

    | (D) | 主要用於雕刻碑文，講究端正嚴肅 | 碑文刻字和官方文件書寫 |'
