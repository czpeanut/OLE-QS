- id: doc_113_台北_仁愛_國文_g8s1e3_s4_26
  section: 4
  number: 26
  type: single
  page: 3
  stem: '書法是中華文化的重要藝術形式，隨著歷史的演進，發展出篆書、隸書、楷書和行書等多種書體。

    篆書是最早的書體之一，筆畫圓潤流暢，結構對稱，常用於印章和碑刻。隸書則由篆書演變而來，字形扁平，筆畫呈現「蠶頭燕尾」的特色，是實用書體的開端。楷書的出現讓書寫更加規範，字形方正工整，易於辨識，是初學書法的基礎。行書介於楷書與草書之間，既有楷書的規範，又具草書的流暢性，適合日常生活中書信往來或記錄文書使用。此外，歷代有許多書法家以行書聞名，其中王羲之的《蘭亭集序》被視為經典之作。

    (修改自網路文章)

