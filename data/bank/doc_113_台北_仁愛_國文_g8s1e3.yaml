  section: 4
  number: 6
  type: single
  page: 1
  stem: 下列有關＜張釋之執法＞一文的說明何者正確？
  options:
  - label: A
    content: 文帝對張釋之說：「廷尉乃當之罰金」，表示對廷尉執法判決的高度認同
  - label: B
    content: 文帝情緒由驚嚇至大怒，最終平和接納諫言，表現出念茲在茲，仁民愛物的美德
  - label: C
    content: 文帝與張釋之對此案的爭論焦點在於依法處置與加重量刑的抉擇
  - label: D
    content: 張釋之處理此案時展現出明察秋毫，善於揣測聖意的特質。
