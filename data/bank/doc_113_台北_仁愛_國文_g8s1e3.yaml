- id: doc_113_台北_仁愛_國文_g8s1e3_s5_34
  section: 5
  number: 34
  type: single
  page: 4
  stem: 根據本文，關於兒少法的說明，下列何者最恰當？
  options:
  - label: A
    content: 衝突影片中的未成年人，如果是加害者便不受法律保障
  - label: B
    content: 未成年受害者為求正義及權益，法律許可他們上傳衝突影片
  - label: C
    content: 未成年人不管是加害者或被害者，法律皆保障其接受教育的機會
  - label: D
    content: 上傳未成年人衝突事件的影片，人物可以打上馬賽克，無論個資是否被推知，仍屬合法。
  group_stem: '(三)

    近期有多起校園學生衝突的影片被上傳到社群平臺，甚至搭配傳言，扭曲影片原始事件的脈絡，成為假訊息。iWIN 網路內容防護機構執行祕書劉昱均指出，大家看到畫面的時候，應該把握「事實不等於真相」的原則。影片只有呈現片段的事實，並不是整起事件全貌，網友不應該透過影片就公開在網路上評論行為人或受害者。

    劉昱均說：「此類影片上傳之後，極易引爆網路公審，網友可能會去肉搜當事人，反而衍生出網路霸凌，網路的酸民文化也可能反過來嘲笑受害者，受害影像外傳反而讓受害者與其家屬更難平復情緒。」

    另外，從兒少保護角度來看，將未成年人影片上傳到社群，並揭露個資樣貌等，都可能觸犯兒少法。職能治療師趙崑陸提醒，「我們在社群平臺或網路看到未成年人的衝突事件，最基本的理解是依照兒少法，此類影片不應轉分享，否則會侵害到當事人和受害人權益。」劉昱均指出，衝突影片當中的行為人或受害人若是未成年人，都受到兒少法保護，此類影片被報導、網路流傳時，若揭露出個資、個人樣貌，或任何足以識別他們個人的資訊，上傳影片和分享影片的人都是違反兒少法第69條之1。

    兒少法立法的用意是希望未成年人不會因為影片或報導而被貼上標籤，能夠給予行為人更多教育的機會，協助未成年人回歸正常生活。劉昱均說，事實上，受害者實際上也無法透過「影片上傳」來得到「正義」。因此，此類衝突或暴力事件，不管是社群流傳或媒體報導都應去除未成年人個資。

    ――節錄自台灣事實查核中心因應校園衝突影片流傳社群把握三原則：不上傳、不分享、啟動情緒同理心'
