  type: single
  page: 2
  stem: 以下四位同學針對鴻門宴的接力故事，誰的用詞最精簡通順，未有多餘的贅詞？
  options:
  - label: A
    content: 小司：謀士范增力荐項羽殺掉劉邦，不僅只是大局考量，還有對項羽稱帝的殷切期望
  - label: B
    content: 小馬：鴻門宴上范增頻頻向項羽示意，卻未得回應，於是私下傳召項莊，吩咐他在席上請命舞劍，乘機刺殺劉邦
  - label: C
    content: 小遷：項伯亦隨即拔劍揮舞，以身體阻擋項莊，使其無法可以攻擊劉邦。張良見狀立刻離開酒席，與部將策畫主帥遁逃之計
  - label: D
    content: 小張：最終劉邦與部下藉口尿遁，未經辭行即離去。此次鴻門宴舞劍殺敵之計落空，可惜啊！白白枉費了范增的一番苦心。
