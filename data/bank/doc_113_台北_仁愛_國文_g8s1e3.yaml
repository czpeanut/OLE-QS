- id: doc_113_台北_仁愛_國文_g8s1e3_s4_17
  section: 4
  number: 17
  type: single
  page: 2
  stem: '王藍田性急。嘗食雞子，以筯刺之，不得，便大怒，舉以擲地。雞子於地圓轉未止，仍下地以屐齒蹍之，又不得，瞋甚，復於地取內口中，齧破即吐之。王右軍聞而大笑曰：「使安期有此性，猶當無一豪可論，況藍田邪？」

    關於王藍田食雞子一文的敘述，下列何者正確？'
  options:
  - label: A
    content: 寫王藍田吃雞蛋的過程，「性急」二字貫串全文，是一篇記事類的小品文
  - label: B
    content: 運用誇張的手法，以「刺、舉、擲、蹍、齧、吐」六個連續動作，營造出漫畫式的幽默效果
  - label: C
    content: 採「先議後敘」的寫法，文末才點出主題，有「畫龍點睛」的效果
  - label: D
    content: 王藍田的行為，可用臺灣俗諺「吃碗內，看碗外」來形容。
  lesson_raw:
    title: 世說新語
    basis: 題目指名王藍田食雞子
  tags:
    textbook: 八上 自學課一 世說新語選(一)坦腹東床(二)王藍田食雞子
