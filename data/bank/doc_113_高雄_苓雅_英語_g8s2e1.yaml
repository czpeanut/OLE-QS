    Clerk: I see. Here you are.

    Ms. Lin: What about the prices?

    Clerk: The black one is NT$990, the red one is NT$1,980, the pink one is NT$3,500,
    and the white one is NT$2,800.

    Ms. Lin: Why is the pink one so expensive?

    Clerk: It’s the newest one, and you can put two thousand songs in it. It’s also
    the lightest and the most beautiful of all.

    Ms. Lin: How about the other ones?

    Clerk: The black one was NT$1,990 last week, and it’s NT$990 this week. You can
