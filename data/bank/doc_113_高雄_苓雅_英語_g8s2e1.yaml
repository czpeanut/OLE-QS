- id: doc_113_高雄_苓雅_英語_g8s2e1_s3_38
  section: 3
  number: 38
  type: single
  page: 3
  stem: （ ）38. According to the reading, what can we know?
  options:
  - label: A
    content: A smartphone is less useful than a camera.
  - label: B
    content: Growing lab meat is better for the earth than raising animals.
  - label: C
    content: MRT is faster than THR.
  - label: D
    content: Getting around by MRT is more friendly to the environment than by HSR.
  group_stem: 'Our lives keep changing because there is new technology and science.
    We use smartphones to talk with people far away, share pictures with them, watch
    videos, play games and shop. We do almost everything with our smartphones.

    There are MRT, HSR and airplanes, so we can get around easily. We need less time
    to travel to different places than in the past. What’s more, there is lab meat.
    The number of people is growing, but how can we get more meat? Dr. Mark Post takes
    cells from animals and grows them into meat. By doing so, it’s more friendly to
    the environment and it takes shorter time than raising animals. Some changes sounded
    impossible before. What will be our lives like in the future? Let’s wait and see.

    📖 technology 科技 far 遠

    share 分享 MRT 捷運

    HSR 高鐵 lab 實驗室

    cell 細胞 raise 飼養

    impossible 不可能的'
  ai_answers:
    gemini: B
    qwen: B
  answer:
  - B
  answer_status: ai_generated
  answer_source: ai:gemini+qwen
