  section: 3
  number: 42
  type: single
  page: 4
  stem: （ ）42. According to the reading, what may Sandy or Min-min be?
  options:
  - label: A
    content: An animal with a strong body.
  - label: B
    content: A storm with heavy rains and strong winds.
  - label: C
    content: A girl with long hair.
  - label: D
    content: A toy with many colors.
  group_stem: 'Hello, everyone. I’m Min-min. Today is August eighth, and it’s also
    my birthday. I’m going to visit Taiwan in an hour and this will be my best gift.
    Also, I will give both heavy rains and strong winds to Taiwan. Don’t go out. Staying
    at home and having enough food will be the best ways for you. Some people want
    to see me and are waiting for me along the beach. It is not safe, and it may take
    away their lives. I am moving fast, and it will be up to 270 km/hr. I’ll get to
    Keelung of Taiwan first, and people there may lose their power and water. Hope
    to see you soon.

    －－－－－－－－－－－－－－－－－－－－－－－－－

    Hi! I’m Sandy, Min-min’s best friend. I am from a tropical wave and soon become
    a tropical storm. I am moving slowly and people see me as the terrible and most
    dangerous storm in the United States history. My plan is to go around the world
    and visit my friend, Min-min. But 4 states in the United States got hurt and I
    killed lots of people. Because of me, many people lost their home and their friends.
