    降低石油價格，只要油價下跌，俄羅斯與烏克蘭戰爭就會立即結束。果真從4月起，川普即宣布對等關稅，儘管經濟學家大多直呼不意外，唯獨一件事，讓專家們跌破眼鏡，那就是國際油價「不升反降」。

