  stem: 回顧歷史，美國介入西亞的政局，從維護以色列建國、波斯灣戰爭、911 事件、出兵敘利亞內戰等等，在複雜的歷史與文化背景下，群體間的矛盾很容易被激化。西亞與北非有哪些複雜的宗教問題，在動亂時容易被激化？(甲)遜尼派與什葉派的紛爭
