- id: doc_113_桃園_桃園_自然_g8s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: '牙齒酸蝕是指酸性物質會使牙齒外層的琺瑯質軟化，而容易損耗。小涵進行實驗一，探討不同pH 值與牙齒酸蝕後重量減少的關係。他選用形狀大小很相近的豬牙齒，分別浸泡不同濃度的鹽酸數日，實驗一的結果如表(三)。


    表(三)

    | 鹽酸 | X | Y | Z |

    | :--- | :--- | :--- | :--- |

    | pH值 | 2.4 | 3.7 | 3.1 |

    | 重量減少百分比(%) 1日後 | 6.82 | 4.15 | 5.95 |

    | 重量減少百分比(%) 2日後 | 7.87 | 4.92 | 6.76 |


    小涵又進行實驗二，取形狀大小很相近的豬牙齒，分別浸泡在pH值介於2～4 之間的甲、乙、丙三杯飲料中數日，發現牙齒重量減少百分比為丙＜甲＜乙。若實驗二只考慮pH
    值的影響，則依實驗一的結果，關於甲、乙、丙三杯飲料的推測，下列何者最合理？'
  options:
  - label: A
    content: 乙杯最酸，其pH 值最大
  - label: B
    content: 乙杯最酸，其pH 值最小
  - label: C
    content: 丙杯最酸，其pH 值最大
  - label: D
    content: 丙杯最酸，其pH 值最小。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 理化
      code: 3-3
      title: 酸鹼的強弱與pH值
      chapter: 第3章 電解質與酸鹼鹽
    textbook: 八下理化 3-3 酸鹼的強弱與pH值
    labeled_by: ai
