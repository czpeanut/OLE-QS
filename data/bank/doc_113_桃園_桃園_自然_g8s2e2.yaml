  stem: '把甲固體置入稀鹽酸$\mathrm{HCl_{(aq)}}$中，隨即產生大量氣泡，再將此氣體導入澄清石灰水$\mathrm{Ca(OH)_{2(aq)}}$中，石灰水變混濁，最後將其中沉澱物過濾出來，結果又得到甲固體。則下列何者最可能為甲固體？


     $\mathrm{HCl_{(aq)}}$為氯化氫水溶液，又稱為鹽酸

    $\mathrm{Ca(OH)_{2(aq)}}$為氫氧化鈣水溶液，又稱為石灰水'
  options:
