    labeled_by: ai
- id: doc_113_桃園_桃園_自然_g8s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 小蘭對食鹽水可導電，但糖水不導電現象的解釋，下列何者正確？
  options:
  - label: A
    content: 食鹽水中含鈉原子，屬於金屬，故能導電
  - label: B
    content: 糖水的濃度太低，所以不導電，但增高濃度即可導電
  - label: C
    content: 糖水的組成元素碳、氫、氧均為非金屬，所以不導電
  - label: D
    content: 食鹽在水中解離成帶電荷的鈉離子及氯離子，故可導電。
  tags:
    chapter:
