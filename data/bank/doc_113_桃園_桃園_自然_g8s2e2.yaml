- id: doc_113_桃園_桃園_自然_g8s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 電解質的定義為：「凡溶於水能導電的化合物稱為電解質」。根據此定義，有關電解質與非電解質的敘述，下列何者正確？
  options:
  - label: A
    content: 銅線可導電，故銅為電解質
  - label: B
    content: 氯化氫的水溶液可導電，故氯化氫為電解質
  - label: C
    content: 食鹽的晶體不能導電，故食鹽為非電解質
  - label: D
    content: 氨水的導電度很小，故氨為非電解質。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 理化
      code: 3-1
      title: 電解質
      chapter: 第3章 電解質與酸鹼鹽
