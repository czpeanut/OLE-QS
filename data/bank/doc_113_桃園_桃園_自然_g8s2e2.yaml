- id: doc_113_桃園_桃園_自然_g8s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: '酸鹼指示劑會在特定pH 值範圍發生顏色轉變，常用酸鹼指示劑的變色範圍和其顏色如下表所示。


    | 常用指示劑 | 酸型顏色 | 變色範圍( pH ) | 鹼型顏色 |

    | :--- | :--- | :--- | :--- |

    | 甲基紅 | 紅 | 4.2〜6.3 | 黃 |

    | 酚紅 | 黃 | 6.4〜8.2 | 紅 |

    | 酚酞 | 無 | 8.3〜10.0 | 紅 |


    下列有關酸鹼指示劑的敘述，何者正確？'
  options:
  - label: A
    content: 酸鹼指示劑會因pH 值變化而改變顏色，顯示它們本身可以跟酸或鹼反應
  - label: B
    content: 將食鹽水溶液，加入少量甲基紅，會呈現紅與黃混合的橙色
  - label: C
    content: 相同體積莫耳濃度、相同體積之鹽酸與氫氧化鈉水溶液反應後，加入少量酚酞，會呈現紅色
  - label: D
    content: 用甲基紅和酚紅的混合物當指示劑可更有效辨識強酸和強鹼。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 理化
      code: 3-3
      title: 酸鹼的強弱與pH值
      chapter: 第3章 電解質與酸鹼鹽
    textbook: 八下理化 3-3 酸鹼的強弱與pH值
    labeled_by: ai
