  group_stem: "題組七 (39～40)\n    If you're reading this, chances are that studying\
    \ English is important to you. Whether you need to study English for school or\
    \ work, for a big test or just because you want to improve your language skills,\
    \ the way you study is important. No one wants to waste time studying in the wrong\
    \ way. 39 .\n    **One: Quiz Yourself.** Make a vocabulary quiz for yourself and\
    \ make yourself take it. See if your answers are close to the dictionary definitions.\
    \ Or, use the questions at the end of an English lesson and see how well you can\
    \ answer them.\n    **Two: Study with a Partner.** Find someone to study with\
    \ because it can be more fun. If you don't know who to study with, you can ask\
