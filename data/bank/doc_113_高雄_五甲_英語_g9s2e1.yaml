    \ of the world's population. They use their left hand more often than their right\
    \ hand.\n    In 1990, Lauren Milsom started the Left-Handers Club to help people\
    \ understand more about left-handed people. It is the largest group for left-handed\
    \ people, with over 60,000 members around the world. The club has three main goals.\
    \ First, it provides training for parents and teachers of left-handed children,\
    \ helping them learn how to teach left-handed children to write more easily. Second,\
