- id: doc_113_新北_中平_數學_g8s2e1_s4_1
  section: 4
  number: 1
  type: calc
  page: 3
  stem: '銀行利息的計算有所謂的單利計算和複利計算兩種。

    設存入銀行的本金為 $P$ 元，$r\%$ 是年利率，一年記息一次，$n$ 是年數，本利和 $S$ 為本金與利息的總和，其中

    (I)單利計算：$S=P \times(1+r\% \times n)$

    (II)複利計算：$S=P \times(1+r\%)^{n}$

    【例如】某人向銀行借十萬元，年利率 4%，3 年後，總共欠銀行：

    單利計算：本利和 $S=100000 \times(1+4\% \times 3)$

    複利計算：本利和 $S=100000 \times(1+4\%)^{3}$。

    開司想跟銀行借 50 萬元低利貸款，原本銀行都是複利計算，但考量到因為新冠肺炎造成失業的情況，政府指示必須用單利的方式計算。

    設年利率都是 2%，若借款的期限都是 5 年，每年計息一次，且 5 年後一次還清，則開司借 50 萬元，用單利計算比複利計算可省下多少利息的費用？

    <素養題>

    （四捨五入到整數位，已知 $1.02^{5} \approx 1.10408$）'
