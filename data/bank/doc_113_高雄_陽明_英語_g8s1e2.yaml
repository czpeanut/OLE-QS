  group_stem: '(一) 42-43


    The Immortal Jellyfish

    There is a type of jellyfish. It is smaller than the nail on your little finger
    and is called the “immortal jellyfish” because it can regenerate again and again.
    Scientists in Spain hope to use this jellyfish to find the answer to the question
    of why humans grow old.

    Carlos Lopez-Otin and his team looked at the genes of the two kinds of jellyfish:
    the immortal jellyfish (Turritopsis dohrnii) and another similar jellyfish (Turritopsis
    rubra). But Turritopsis rubra cannot regenerate.

    According to the Natural History Museum in London, the immortal jellyfish is like
    a butterfly. It can turn back into a caterpillar and then grow into an adult butterfly
    once again.

    By comparing these two jellyfish, the scientists in Spain found the key to why
    the immortal jellyfish can regenerate- it is because its cells can grow into any
    other type of cell the jellyfish needs.

    Monty Graham, another scientist, says that we need a lot more research to learn
    how the immortal jellyfish can help humans. But he also says the scientists in
    Spain have a good idea and that it will open up a door to a new line of study
    that we should pursue.


