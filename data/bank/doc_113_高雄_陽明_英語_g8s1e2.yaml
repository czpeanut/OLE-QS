    in them.

    These are some of the most serious wildfires in the US in the last few years.
    They started as small fires in plants. Then, the really strong winds from Hurricane
    Dora made them grow fast. Some people even had to jump into the water to get away
    from the fire and the smoke. There were several reasons for the serious wildfires.
    To start with, Hawaii was dry at that time partly because it was summer, the dry
