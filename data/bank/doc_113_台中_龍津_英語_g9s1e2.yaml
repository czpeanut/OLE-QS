  group_stem: '(三)

    When you miss the garbage truck and couldn''t throw your leftovers (廚餘) away,
    what do you usually do? Some people put the leftovers in the refrigerator, and
    some keep them in a bag outside their house. But if you''re looking for a better
    way to deal with the leftovers, you must check out our new machine, Leftover Cleaner.

    Here is how the machine works. Just put all your leftovers in the machine and
    push the Start button. In three hours, your leftovers will be dried and turned
    into a kind of black soil (土). The terrible smell from the leftovers will also
    disappear.

    Leftover Cleaner costs 10000 dollars, but it''s on sale from May 20 to May 31.
