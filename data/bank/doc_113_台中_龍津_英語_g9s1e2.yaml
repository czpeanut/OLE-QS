    content: He was very popular with his classmates.
  - label: B
    content: He always kept himself clean.
  - label: C
    content: He could not talk with others well and learned slowly.
  - label: D
    content: He was tired of washing his hands.
  group_stem: '(二)

    Max sat next to me when we were in elementary school. He had serious problems
    in talking with people. One always had to guess what he was saying. Besides, most
    of my classmates did not like to be with him because he himself and his clothes
    always looked dirty. I tried to let him know how to keep himself clean by telling
    him again and again to wash his hands. But he just could not understand what I
    meant.

    One day, our teacher Ms. Lin walked up to Max. Without saying anything, she took
    Max to the restroom. Ms. Lin slowly washed his hands and told him he should keep
    himself clean. She did that every day for one month. Finally, Max understood.

    Ms. Lin''s love has given me a good example to follow when I am doing my job.
    I always remember to teach my students by showing them the right way to do things.
    And most important of all, I always remember to give them more time to learn and
    grow up.'
