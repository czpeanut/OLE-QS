    People from different places love different kinds of food. Also, they have some
    taboos (禁忌) about food. Most of the farmers in China don''t eat beef because they
    want to show their thanks. Some people don''t eat pork because of the religious
    belief (宗教信仰).

    What''s your favorite food? Is your favorite food on the top ten of the most unusual
    foods in the world? It''s hard to believe that the most popular snack in Taiwan,
    pig''s blood (豬血) cake, is the number one unusual food in the world. People in
    Taiwan like it a lot, and you can see it everywhere at the night market.

    It''s strange that snakes'' meat isn''t on the top ten. Some people feel more
    comfortable eating snakes'' meat than pig''s blood cake. What do you think?'
