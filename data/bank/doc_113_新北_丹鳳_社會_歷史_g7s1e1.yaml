  stem: 23、 鄒族傳說，女神尼弗奴下凡到人間散步，重心不穩一腳踏平一座山，成為現在阿里山特富野社，另一腳則是達邦社。排灣族將大武山視為天、地、人共通的空間，山頂是屬於天界領域，祖先就是從此處來到了人界，進而安居生活。對於這些原住民族的天地創造神說，我們可以秉持下列哪一種最佳態度看待？
