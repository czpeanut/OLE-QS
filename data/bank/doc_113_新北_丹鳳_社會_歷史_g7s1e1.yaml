  section: 1
  number: 30
  type: single
  page: 2
  stem: '30、「日治時期的戶政資料中，西拉雅人在種族註記欄位被註記「熟」字，意思是熟蕃，以區隔「內（日本人）、福（福建人）、廣（廣東人）、生（當時被視為未歸化的原住民）」等其他種族。到了中華民國統治時期，戶政資料就不再有種族註記。針對居住在山地鄉者被登記為「山胞」。後來台灣省政府通令各縣市政府補登記符合山胞身分但尚未登記者。但台南等縣市沒有收到補登記的公文。包括西拉雅族在內的各「平埔族群」，便失去了原住民身分，直至今日。平埔族群意識到自己的族群並沒有得到國家的認定，族人也沒有原住民身分，便於2001
    年，要求回歸原住民身分，開始了「平埔正名運動」，並展開各種行動。西拉雅族在2022 年經大法官釋憲正名成功，並要求原委會於3 年內另立專法規範之。」

    下列哪一標題最適合以上文章？'
  options:
  - label: A
    content: 臺灣原住民族名稱演變
  - label: B
    content: 西拉雅族正名始末
  - label: C
    content: 原住民族文化危機
  - label: D
    content: 原住民族名稱研究。
