  stem: 19、 1955 年，飛行員飛越八里鄉觀音山上空時，發現飛機的羅盤出現了磁力異常的反應。1957 年，地質學家勘查發現土法煉鐵的遺跡。命名為「十三行遺址」。1988
    年，十三行遺址被畫定為八里污水處理廠用地，即將動工。引爆了一場文化保存和工程建設的衝突事件。對於經濟開發與環境保護，如何取得平衡，做出最佳的決策，下列哪一看法較為中肯？
  options:
  - label: A
    content: 反思當代人與遺產間的關係，掌握文化資產保存的精髓
  - label: B
    content: 過去的就讓它過去，無需保存
  - label: C
    content: 古董價值無限，無需顧及現代
  - label: D
    content: 由當地人投票表決，少數服從多數 。
