- id: doc_113_台中_龍津_自然_理化_g8s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 「阿瑞尼斯的一提出來以後，立即遭到許多知名化學家的嘲笑和堅決反對。他們認為食鹽水是很穩定的水溶液，但氯是一種黃綠色有毒氣體，如果鹽水中有氯離子，為什麼鹽水是無色的，而且沒有毒？且鈉一遇到水就會發生強烈反應，如果鹽水中有鈉離子，為什麼一點反應也沒有？」以上敘述，關於原子與離子的性質不同的原因應如何解釋？
  options:
  - label: A
    content: 原子與離子的粒子大小不同，造成性質不同
  - label: B
    content: 原子與離子的電子數不同，造成性質不同
  - label: C
    content: 原子與離子的中子數不同，造成性質不同
  - label: D
    content: 原子與離子的質子數不同，造成性質不同
