  - label: A
    content: 水以霧狀方式，水溫能降更低
  - label: B
    content: 只是錯覺，其實溫度並未下降更快
  - label: C
    content: 這是遊樂園省水費的方式，與溫度無關
  - label: D
    content: 增加水與周遭環境的接觸面積
