- id: doc_113_台中_龍津_自然_理化_g8s2e2_s2_7
  section: 2
  number: 7
  type: single
  page: 3
  stem: (1)以下 4 位同學在讀完文章後，分別提出各自的想法，請問誰的想法有誤？
  options:
  - label: A
    content: 沛沛：血紅素與氧氣結合成氧合血紅素是一種可逆反應
  - label: B
    content: 小軒：肺部氧氣含量較高，有利於正反應，產生較多的氧合血紅素
  - label: C
    content: 小雯：組織細胞氧氣含量較低，有利於逆反應，氧合血紅素會釋出氧氣
  - label: D
    content: 阿康：靜脈中氧氣含量較低，因此血液中的氧合血紅素比例會變成零。
  group_stem: '血紅素

    人體吸入氧氣後，氧氣會由血液中的紅血球負責攜帶，並經由血液循環運送至組織細胞。這是因為紅血球中的血紅素能與氧氣結合，形成「氧合血紅素」，藉此攜帶氧氣；而「氧合血紅素」也能發生還原反應，形成血紅素與氧氣，藉此釋放出氧氣，以供給組織。其反應過程如下：

    暗紅色 鮮紅色

    $\text{血紅素} + \text{氧氣} \rightleftharpoons \text{氧合血紅素}$

    然而，血紅素什麼時候會與氧氣結合，氧合血紅素又是什麼時候會把氧氣釋放出去呢？科學家經研究後發現，血液中的氧合血紅素比例與周遭環境中的氧氣含量有關，當血液中的氧氣含量較高時，血紅素與氧氣的結合率也比較高，所以氧合血紅素的比例就會較高；反之則較低（圖一）。

    此外，由於高海拔地區的氧氣含量，會隨著海拔高度的上升而減少，因此人體內的氧合血紅素比例也會受海拔高度影響。例如在高度約為 3000 公尺的高山環境中，人體會為了讓組織細胞獲得足夠的氧氣，而頻頻喘氣增加呼吸頻率，使進入體內的氧氣量增加，以提高氧合血紅素的比例。'
