  section: 1
  number: 23
  type: single
  page: 2
  stem: (  )很多人覺得創業就是要進入「藍海市場」，這指的是企業應該開創尚未被開發的市場，進而提升自己的價值；但對於創業團隊來說，擠滿競爭者的「紅海市場」，尋找立足點的可能性較高，你可以在其他人遇到的問題上，快速測試新的商業模式，而不需要完全去開拓一個可能很難執行，或根本沒有足夠需求的市場。前面所論述的是在討論何種市場競爭的影響？
  options:
  - label: A
    content: 藍海市場指的是沒有任何競爭門檻的市場
  - label: B
    content: 紅海市場指的是相較之下，進入須花較高門檻的市場
  - label: C
    content: 藍海市場代表廠商開發的產品所處的市場，存在著高度競爭
  - label: D
    content: 紅海市場因競爭程度高，可提供給消費者不同的選擇機會。
