  type: single
  page: 1
  stem: （    ）畢業季來臨，各大專陸續舉辦徵才博覽會。若依「交易的對象和內容」區分，廠商舉辦徵才活動，屬於下列哪種市場？
  options:
  - label: A
    content: 商品市場
  - label: B
    content: 勞動市場
  - label: C
    content: 有形市場
  - label: D
    content: 勞務市場。
