  stem: （    ）甲商店老闆沁慶：「我喜歡開設實體店面來販賣商品，提供顧客即時的服務與真實的採購經驗。」。乙公司老闆瑩瑩：「我偏好利用網路商店來銷售商品，除了降低成本，也可以增加商品展示的品項。」。上述兩個老闆考量的課題屬於下列何者？
  options:
  - label: A
    content: 生產什麼
  - label: B
    content: 如何生產
  - label: C
    content: 生產數量
  - label: D
    content: 為何生產。
