- id: doc_113_台中_大業_社會_公民_g9s1e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: '(  )下表為印尼貨幣(印尼盾)兌新臺幣的匯率變化

    | | 新臺幣 | 印尼盾 |

    | --- | --- | --- |

    | 半年前 | 0.03 | 1 |

    | 現在 | 0.02 | 1 |


    上表的狀況對臺印兩國的交流有何影響？'
  options:
  - label: A
    content: 臺灣產品出口到印尼的數量增加
  - label: B
    content: 有利印尼的進口商進口臺灣產品
  - label: C
    content: 臺灣人會增加去印尼旅遊的意願
  - label: D
    content: 新臺幣貶值，印尼盾升值。
- id: doc_113_台中_大業_社會_公民_g9s1e3_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: (  )小鴻在美國念大學，去年因為運動不慎造成骨裂而回臺灣在家上課。今年小鴻準備回美國完成下一學期的課程，他發現去年回臺時美元兌換新臺幣的匯率為1：30，現在美元兌換新臺幣的匯率是1：28，這樣的匯率變動對他有何影響？
  options:
  - label: A
    content: 因新臺幣貶值，所以去美國較貴
  - label: B
    content: 因新臺幣升值，所以去美國較便宜
  - label: C
    content: 因美元升值，所以去美國較便宜
  - label: D
    content: 因美元貶值，所以去美國較貴
