  stem: '(  )以下是宛怡看到的一則新聞報導。根據內容判斷，下列敘述何者正確？


    近日新鮮果汁熱賣，卻讓業者叫苦連天，因為不少水果產量減少，價格狂漲，業者卻不敢漲價，就怕顧客不上門。'
  options:
  - label: A
    content: 水果持續漲價，果農會因而減少供給數量
  - label: B
    content: 水果漲價，果汁業者的利潤也會提高
  - label: C
    content: 提高果汁價格，可以增加銷售的數量
  - label: D
    content: 水果漲價，果汁業者的生產成本增加。
  assets:
  - key: s1_24_f1
    kind: figure
    file: doc_113_台中_大業_社會_公民_g9s1e3/s1_24_f1.png
