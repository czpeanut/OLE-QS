  number: 3
  type: single
  page: 1
  stem: (  )關於貨幣的敘述，下列何者正確？
  options:
  - label: A
    content: 商品貨幣相較於法定貨幣更容易儲存
  - label: B
    content: 貨幣貶值，會使能購買到的產品數量下降
  - label: C
