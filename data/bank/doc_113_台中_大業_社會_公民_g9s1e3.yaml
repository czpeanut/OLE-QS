  section: 1
  number: 5
  type: single
  page: 1
  stem: (  )廠商間的競爭可能會讓彼此進步，也會對消費者產生影響。下列相關敘述何者正確？
  options:
  - label: A
    content: 廠商競爭激烈，使消費者被迫接受較高的價格
  - label: B
    content: 廠商競爭激烈，使消費者的產品選擇性變少
  - label: C
