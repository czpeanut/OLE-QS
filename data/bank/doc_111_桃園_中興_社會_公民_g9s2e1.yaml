  section: 1
  number: 5
  type: single
  page: 1
  stem: 全球暖化日益嚴重，近年南極研究站測量出南極大陸最新高溫紀錄達 18.3℃。世界氣象組織(World Meteorological Organization)成員表示：「這是南極暖化速度比全球平均快的證據。」因此，世界許多國家積極商討如何應對
    暖化情況，甚至共同簽署協議，達成減少溫室氣體排放的共識。根據上述內容判斷，下列推論何者較為適當？
  options:
  - label: A
    content: 目前尚無任何全球暖化實際證據，故不須採取任何方式因應
  - label: B
    content: 該組織研究顯示，觀光客的激增是造成南極 冰融加快的主因
  - label: C
    content: 政治全球化無助緩解跨國氣候問題，僅能祈禱地球自行調節
  - label: D
    content: 全球面臨暖化危機，透過國 際間的合作或可延緩暖化的趨勢 (第一課習作)
