- id: doc_113_高雄_五甲_社會_g9s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 臺灣和紐西蘭分居南、北半球，產品具有高度互補性，兩國在西元 2013 年 7 月正式簽訂經濟合作協定後，實施關稅自由化，近 100% 的貨物都降到零關稅，只有稻米列為排除項目。經濟部長如此形容：「臺、紐協議對臺灣的工業受益最多，如鋼鐵製品、塑膠、自行車與機動車等，出口紐西蘭都是零關稅。臺灣的消費者也能全年吃到進口蘋果等新鮮水果。」請問：由文中可推測，紐西蘭具有何種特徵，使臺、紐簽訂協定後，臺灣的消費者可全年吃到進口蘋果？
  options:
  - label: A
    content: 位居溫帶氣候區
  - label: B
    content: 位於環太平洋火山地震帶
  - label: C
    content: 降水量西多東少
  - label: D
    content: 與北半球季節相反。
