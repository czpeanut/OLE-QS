  number: 40
  type: single
  page: 3
  stem: 根據上文，下列何者並非紅糯米對於太巴塱部落阿美族人的意義？
  options:
  - label: A
    content: 分享
  - label: B
    content: 感恩
  - label: C
    content: 傳統
  - label: D
    content: 收入。
  group_stem: "（三）\n  紅糯米是花蓮太巴塱部落阿美族人的傳統作物，也是臺灣唯一的紅糯米產地，一年僅一穫，部落的紅糯米田昨天以古早方式手工收割，收割前頭目也特別舉辦收穫祭儀式！現場還以傳統的阿美族家屋爐灶，煮成糯米飯「哈哈」，當「哈哈」開鍋倒進木臼時，米飯香氣撲鼻而來！現場也搥打成美味的紅米麻糬，族人們一起分享收穫喜悅！而在收割前頭目王成發和媽媽們一起在田間進行祈福、收穫儀式，感謝上天賜予豐盛的糧食。\n\
    \  早年從播種、收割、入倉皆有傳統祭典儀式，在西方宗教進入部落後導致傳統式微，族人必須回復這些古早的文化，讓下一代以阿美族為榮。            \
    \                                （改寫自臺灣原住民族資訊資源網）"
