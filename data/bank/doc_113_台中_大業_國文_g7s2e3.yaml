  stem: 根據這篇小說的內容或寫作手法，下列敘述何者錯誤？
  options:
  - label: A
    content: 李寄應募時已抱定死裡求生、為民除害之心
  - label: B
    content: 故事依照時間先後描述李寄誘以蜜餅，繼之放犬，從而砍蛇的除害經過
  - label: C
    content: 李寄以「徒費衣食，生無所益」的理由成功說服父母允其應募
  - label: D
    content: 以巨大的外貌與食人的習性，凸顯大蛇令人驚懼的形象。
  group_stem: "（一）\n  東越閩中有大蛇，欲得啖童女年十二三者。累年如此，已用九女。將樂縣李誕小女名寄，應募欲行。父母不聽。寄曰：「父母無德，惟生六女，無有一男，雖有如無。女無緹縈濟父母之功，既不能供養，徒費衣食，生無所益，不如早死。賣寄之身，可得少錢，以供父母，豈不善耶？」父母慈憐，終不聽去。寄自潛行，不可禁止。\n\
    \  寄乃告請好劍及咋蛇犬。至八月朝，便詣①廟中坐，懷劍攜犬。先將數石糕餅，用蜜漿灌之，以置穴口。蛇便出。頭大如穀倉，目如二尺鏡，聞餅香氣，先啖食之。寄便放犬，犬就囓咋，寄從後斫②得數創。創痛急，蛇因躍出，至庭而死。寄入視穴，得其九女骷髏，悉舉出，吒③言曰：「汝輩怯弱，為蛇所食，甚可哀憐！」於是寄緩步而歸。\
    \                                               （改寫自干寶《搜神記‧李寄》）\n【注】：①詣：到 ②斫：音ㄓㄨㄛˊ，砍\
    \ ③吒：音ㄓㄚˋ，痛惜。"
