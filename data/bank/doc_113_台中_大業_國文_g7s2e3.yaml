  group_stem: "（二）\n  楚有養狙①以為生者，楚人謂之狙公。旦日，必部分②眾狙於庭，使老狙率以之山中，求草木之實，賦③什一以自奉。或不給，則加鞭箠焉。群狙皆畏苦之，弗敢違也。\n\
    \  一日，有小狙謂眾狙曰：「山之果，公所樹與？」曰：「否也，天生也。」曰：「非公不得而取與？」曰：「否也，皆得而取也。」曰：「然則吾何假④於彼而為之役乎？」言未既，眾狙皆寤⑤。其夕，相與伺狙公之寢，破柵毀柙，取其積，相攜而入於林中，不復歸。狙公卒餒而死。\
