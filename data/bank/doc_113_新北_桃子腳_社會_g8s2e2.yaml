  stem: '以下為一部有關刑事案件的電影劇情，若按照案件處理的順序，其正確的刑事訴訟程序為何？


    | 劇情 | 劇情說明 |

    | :---: | :--- |

    | 甲 | ⋯⋯經歷多次開庭，判決結果即將出爐⋯⋯ |

    | 乙 | ⋯⋯他因為涉嫌殺人面臨刑事訴訟，接下來該如何面對⋯⋯ |

    | 丙 | ⋯⋯警方接獲自首時，他手上還血跡斑斑⋯⋯ |

    | 丁 | ⋯⋯檢察官知悉後，立即進行偵察，蒐集證據⋯⋯ |'
