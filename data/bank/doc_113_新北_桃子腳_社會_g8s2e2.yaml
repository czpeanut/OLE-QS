  group_stem: "資料一\n    根據查驗證實，這個縣的建國一社，創造了平均畝產穀三萬六千九百五十六斤的驚人紀錄。這個人們所不敢想的早稻高產紀錄，是充份發揮共產主義風格大膽革新的成果。在驗收時，人們曾選一平方尺的面積進行實測，推算平均每畝約有七百六十八萬穗。把雞蛋隨便地放在覆蓋著的稻束上面滾動，雞蛋始終不會掉到田裏去。\n\
    改寫自《天下第一田》(人民日報1958/8/13 頭版頭條)\n資料二\n    記者採訪曾參與天下第一田的老先生龔正堂老先生回憶到，「自豪」沒有維持多久，建國一社開始嘗到「畝產三萬六千斤」的苦頭。不到一年時間，三年饑荒來臨。建國一社先是按謊報的產量被徵收了大量的糧食，再接著是天災人禍餓肚皮。人們開始吃糠、吃樹皮。後來他跟著村裡的大人去修水利，可以有點飯吃，但同去的20\
    \ 多個人中還是餓死了8 個。「在家裡的，餓死的不知道有多少喲。」\n改寫自《天下第一田的前世今生》(青年報2009/12/16)"
