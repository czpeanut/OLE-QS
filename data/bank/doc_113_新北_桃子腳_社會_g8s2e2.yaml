  stem: 東南亞的中南半島和菲律賓群島為熱帶季風氣候，但各地降水量的分布不均，有些地區年水量不足1000 mm，有些地區則多達3000 mm 以上。導致降水量出現明顯地區差異的兩項因素是什麼？
