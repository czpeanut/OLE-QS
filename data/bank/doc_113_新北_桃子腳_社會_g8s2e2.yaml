  group_stem: '1940 年，有一個青年對他的母親說：「我已經十八歲了，不應該留在家裡，我要去參加抗戰。」母親非常感動，問他打算跟誰一起。他說：「我去參加八路軍，您看好不好？」母親說：「很好！很好！」動手為兒子準備行李。(註.八路軍：共產黨的軍隊)

    三年以後，這個青年的弟弟對母親說：「我也十八歲了，我要去參加抗戰。」母親非常感動，問他打算跟誰一起。他說：「我去參加中央軍，您看好不好？」母親說：「很好！很好！」動手為兒子準備行李。(註.中央軍：國民政府的軍隊)

    可憐的老百姓，可愛的青年，他們怎能預料，兩兄弟以後會用很多很多的時間互相廝殺。

    --改寫自王鼎鈞(2005)，《怒目少年》'
