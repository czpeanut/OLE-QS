  group_stem: "資料一\n    「每條大街小巷，每個人的嘴裡，見面第一句話，就是恭喜恭喜……」是我們耳熟能詳的拜年神曲，然而原唱姚莉在訪談時曾提到《恭喜恭喜》這首歌：「當年陳歌辛寫來不是唱過年的！如果仔細看完整歌詞，就會有完全不同的感受。」原版曲調也相較目前我們所知的節奏更慢、更為哀傷。\n\
    \    陳歌辛(1914-1961)，中國流行音樂人，有「歌仙」之稱，在上海的音樂學校任教。1938 年曾創作抗日歌曲，但1941 年上海租界為日軍佔領，在監獄被折磨三個月後，被迫為日軍創作宣傳歌曲。抗戰勝利後寫下《恭喜恭喜》，哀悼因戰爭逝去的生命。然而同年卻以「漢奸嫌疑」被國民政府關押七天後釋放，決定投奔中國共產黨。1950\
    \ 年代參與中華人民共和國的電影歌曲創作，最後在1961 年因為政策造成的大饑荒而逝世。\n資料二\n經過多少困難，歷盡多少磨煉\n多少心兒盼望，盼望春的消息\n\
    恭喜恭喜恭喜你呀，恭喜恭喜恭喜你\n摘錄自陳歌辛，《恭喜恭喜》(最後一段歌詞)"
