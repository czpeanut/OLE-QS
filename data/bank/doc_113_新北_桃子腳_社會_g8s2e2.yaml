- id: doc_113_新北_桃子腳_社會_g8s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 「有一天，紅衛兵在孔廟前焚燒古書，還叫一些讀書人跪在火堆前接受批鬥，作家老舍不顧自身安危衝向火堆搶救古書，卻換來無情的一陣毒打。隔天清晨，老舍獨自離家，在湖邊的長椅上，像雕像一樣坐了一天，直到夜深，這位老人慢慢走進冰冷的湖水裡，告別他熱愛的中國。」請問當時是中國的哪個時期？
  options:
  - label: A
    content: 十年建設
  - label: B
    content: 新文化運動
  - label: C
    content: 大躍進
  - label: D
    content: 文化大革命
- id: doc_113_新北_桃子腳_社會_g8s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 八年抗戰各是以哪一件事做為開始與結束？
  options:
  - label: A
    content: 南京大屠殺-美國對日投下原子彈
  - label: B
    content: 盧溝橋事變-美國對日投下原子彈
  - label: C
    content: 九一八事變-珍珠港事變
  - label: D
    content: 五四運動-珍珠港事變
- id: doc_113_新北_桃子腳_社會_g8s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 八年抗戰後國共兩黨再次決裂。內戰的結果，共產黨控制了中國大陸，而國民黨與中華民國政府則遷往台灣；國共內戰於西元哪一年分出勝負？
  options:
  - label: A
    content: '1937'
  - label: B
    content: '1945'
  - label: C
    content: '1949'
  - label: D
    content: '1958'
- id: doc_113_新北_桃子腳_社會_g8s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 日本自從哪一場西化運動以來，逐漸走向工業化，進而走向一條極端的道路，利用軍事領導政治，以武力對內加強控制，對外則是發動戰爭、肆意掠奪？
  options:
  - label: A
    content: 皇民化運動
  - label: B
    content: 以華制華
  - label: C
    content: 大化革新
  - label: D
    content: 明治維新
- id: doc_113_新北_桃子腳_社會_g8s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 自從清末簽訂了第一個不平等條約-南京條約，經過百年後才終於在什麼樣的機會下，和英美簽訂了平等新約，解除了百年來不平等條約的束縛？
  options:
  - label: A
    content: 1943，二次大戰期間
  - label: B
    content: 1919，巴黎和會時
  - label: C
    content: 1945，日本投降
  - label: D
    content: 1928，北伐完成後
- id: doc_113_新北_桃子腳_社會_g8s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 西元1941 年，日軍偷襲美國在太平洋上的海軍基地─珍珠港，並且對東南亞發動戰爭，而這些地區在新帝國主義以來早已成為西方國家的殖民地，請問日本攻擊東南亞最可能得罪哪些國家？
  options:
  - label: A
    content: 義西荷
  - label: B
    content: 英美荷
  - label: C
    content: 英法德
  - label: D
    content: 德奧義
- id: doc_113_新北_桃子腳_社會_g8s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 毛澤東題詩說：「紅軍不怕遠征難，萬水千山只等閒。五嶺逶迤騰細浪，烏蒙磅礴走泥丸。」請問造成詩中「紅軍」進行「遠征」的原因為何？
  options:
  - label: A
    content: 國軍五度圍剿共產黨
  - label: B
    content: 張學良發動西安事變
  - label: C
    content: 日軍發動九一八事變
  - label: D
    content: 蔣中正全力反攻南京
- id: doc_113_新北_桃子腳_社會_g8s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 東南亞為東、西方交通的「十字路口」，深受中國、印度、西亞文化的影響，也曾淪為歐美殖民地，故宗教和文化複雜多樣。東南亞呈現多元文化，主要受下列哪一因素影響？
  options:
  - label: A
    content: 氣候溼熱
  - label: B
    content: 地形破碎
  - label: C
    content: 地理位置
  - label: D
    content: 人口眾多
- id: doc_113_新北_桃子腳_社會_g8s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 居住在緬甸西部的羅興亞人，因信奉伊斯蘭教與信奉佛教的緬甸不同，近年遭受緬甸政府迫害，死傷慘重，引發國際關注，也導致羅興亞人大量逃離到宗教信仰相同的鄰國。根據上文判斷，羅興亞人最可能逃到哪個國家？
  options:
  - label: A
    content: 印度
  - label: B
    content: 泰國
  - label: C
    content: 孟加拉
  - label: D
    content: 巴基斯坦
