  group_stem: '2025 年3 月28 日，緬甸發生規模8.2 的強烈地震，震央位於曼德勒地區，為該國近百年來最嚴重的地震之一。地震造成至少3,645
    人喪生，數千人受傷，並導致大量建築物倒塌、基礎設施毀損，數百萬人失去家園。鄰近的泰國和中國部分地區亦感受到強烈震動，泰國首都曼谷一棟興建中的大樓倒塌，造成多人傷亡。

    地震後，緬甸政府宣布六個省份進入緊急狀態，並罕見地向國際社會請求援助。中國政府承諾提供10 億元人民幣（約1.37 億美元）的人道援助，包括食物、醫療用品、組合屋及派遣專家團隊。此外，韓國政府捐助200
    萬美元，美國也表示將提供援助。

    目前，救援行動仍在進行中，國際社會正積極協助緬甸應對這場災難。然而，由於部分災區交通中斷、通訊不良，救援工作面臨極大挑戰。聯合國呼籲各方加強協調，確保援助能迅速送達受災民眾。'
