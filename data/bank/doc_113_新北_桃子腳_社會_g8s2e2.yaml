  group_stem: '在歷史上，殖民統治對殖民地社會造成了深遠的影響，這些影響既包含正面貢獻，也有負面後果。在經濟方面，殖民列強往往建立基礎建設，如鐵路、港口與道路，有助於交通與貿易的發展。然而，這些設施多為服務殖民母國利益，殖民地資源被大量開採並外流，導致當地經濟結構失衡，長期依賴單一出口產業。

    文化層面上，殖民者推行語言與教育制度，如英國殖民下的○○普及英語教育，使當地人在全球化時代具有語言優勢。然而，殖民文化常壓抑原生文化與宗教，導致部分傳統逐漸消失，甚至引起身份認同危機。在生活習慣上，殖民制度導入西式生活方式與行政制度，改善部分衛生條件與公共服務，但同時也強化社會階級與種族隔離政策，造成長期的社會不平等。

    總結而言，殖民統治在促進部分現代化進程的同時，也造成資源掠奪與文化衝擊，對殖民地人民產生複雜且矛盾的歷史遺緒。'
