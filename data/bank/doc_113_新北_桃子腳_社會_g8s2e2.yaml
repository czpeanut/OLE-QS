  group_stem: "NHK 曾製作播出「731 部隊真相：精英醫學研究者和人體實驗」紀錄片，指出自從某歷史事件後，日本的石井四郎中將，從東京大學、京都大學網羅優秀醫學人才，這些人都被稱為「技師」，在中國東北地區秘密研發細菌武器。部隊成員先將傷寒桿菌注入西瓜、甜瓜等瓜果，讓「滿洲人」或「支那人」吃下這些水果，觀察他們感染疾病的情形。戰後石井四郎和美軍達成協議，將所有人體實驗數據交給美國，換取其免受制裁。而731\
    \ 部隊進行人體實驗的「技師」們，回到日本後獲得重用，高升至教授甚至領域權威。\n    該紀錄片在日本引起巨大的討論，一名日本網友表示「NHK 非常的勇敢，這個素材在日本不容碰觸，卻又是日本人必須要知道的歷史。」據稱製作團隊的突破性發展，是因為取得了731\
    \ 部隊的認罪錄音檔。在1945 年日本投降後，由〇〇接收東北時俘虜了該部隊成員進行了審判，並錄下了當時的口供。\n資料改寫自網路新聞「NHK 揭731 部隊真實面貌」(2018)\n\
    註：NHK(日本放送協會)，是日本的公共媒體機構，相當於我國之「公視」。"
