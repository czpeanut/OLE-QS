- id: doc_113_台北_仁愛_國文_g7s1e2_s6_32
  section: 6
  number: 32
  type: single
  page: 4
  stem: 根據本文內容，下列敘述何者正確？
  options:
  - label: A
    content: 顏淵、仲弓及子貢的家境皆貧困
  - label: B
    content: 季路與冉伯牛二人皆是因病逝世
  - label: C
    content: 子貢、冉有及子游都曾在魯國任官
  - label: D
    content: 冉有及季路雖擅長政事卻不善帶兵。
  group_stem: "(三)\n孔門四科十哲\n  孔子一生啟發了無數學子，其中有十位表現優異的學生，依其不同的品格與專長，分屬「德行」、「言語」、「政事」、「文學」四科，即所謂的「四科十哲」。\n\
    德行\n  顏  淵：是孔子的得意門生，天資聰穎，相當好學。素以德行著稱，不遷怒他人，不重複犯相同的過錯。即便生活極為貧困，依然安貧樂道。\n  閔子騫：幼時遭到繼母虐待，天寒只能穿著單薄的衣服，父親知道後想休妻，他反而為繼母求情，孝行深受鄰里讚賞。\n\
    \  冉伯牛：好學不倦，事事以仁恕為準則，據傳是染了惡疾而死。在他病危的時候，孔子特地前往探視，極為不捨。\n  仲  弓：個性篤實溫厚，總在深思熟慮後才發言。雖然出身貧賤，但孔子認為他是才德兼備的人物，擁有國君的氣度，足以治理天下。\n\
    言語\n  宰 我：好問善辯，勇於質疑，常在課堂上提出犀利的問題。曾被孔子派遣出使楚國、齊國，善用淺顯易懂的例子解釋孔子之道，令國君了解孔子的思想。\n \
    \ 子 貢：善於經商，家境富有，是春秋時代著名的富商。他長於雄辯，曾任魯國、衛國宰相，有外交才能，曾在諸國間遊說，保全了魯國。\n政事\n  冉 有：多才多藝，擅長政事。曾在魯國任官，凡有重大的政治措施，皆參與其中，如推行田賦、外交、軍政等。曾親自擔任軍隊統帥，打敗齊國。\n\
    \  季 路：生性勇敢豪爽，信守承諾。擁有政治長才，擔任過各種官職。曾治理衛國蒲邑，上任三年，百姓做事盡力而不苟且，下屬辦事認真而服從命令，讓孔子十分讚賞。\n\
    文學\n  子 游：擅長於禮，熟悉古代經典文獻。曾在魯國任官，致力推行禮樂教化，境內到處有弦歌之聲，孔子對此表示讚賞。\n  子 夏：為學時常有獨到的見解，孔子去世後，他在西河講學，傳授儒家經典，對儒家思想的發展，作出重大貢獻。\n\
    （康軒國文〈L5‧延伸探索〉）"
  lesson_raw:
    number: 第5課
    title: 論語選
    basis: 選文出處註明康軒國文〈L5‧延伸探索〉
