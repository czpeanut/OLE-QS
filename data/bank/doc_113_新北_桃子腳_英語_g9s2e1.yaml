  stem: 48. What lesson did the speaker want to give to the listeners?
  options:
  - label: A
    content: Money is not everything, but without money, you can’t do anything.
  - label: B
    content: Our mistakes don’t define our value.
  - label: C
    content: Money is not the only valuable thing in life.
  - label: D
    content: Everyone loves money because it has value.
  group_stem: '(48-50)

    Our Value

    A speaker began his speech by holding up a $20 bill. Then, he asked, “Who would
    like this $20 bill?”

    Hands started going up.

    He said, “I am going to give this $20 to one of you, but first, let me do this,”
    he said as he creased the bill.

    He then asked, “Who still wants it?”

    Still, the hands were up in the air.

    “Well, what if I do this?” And he dropped it on the ground and stepped on it with
    his shoe.

    He picked it up, and now the bill was dirty. “Now who still wants it?” Once again,
    the hands went into the air.

    “My friends, you just learned a very valuable lesson. No matter what I did to
    the money, you still wanted it because it did not

    lose its value. It was still worth $20.

    Life has its ups and downs. When we fail because of our mistakes or wrong decisions,
    we may think of ourselves as losers.

    But no matter what has happened or what will happen, you will never lose your
    value. You are special – Don’t ever forget it!

     bill 鈔票  value 價值  crease 弄皺  worth 價值  define 定義'
