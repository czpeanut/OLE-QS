  stem: 40. What does “manure” most likely mean?
  options:
  - label: A
    content: something that is very useful
  - label: B
    content: something that costs a lot
  - label: C
    content: something that is very dirty
  - label: D
    content: something that is very delicious
  group_stem: '(40-41)

    A joke about vacuum cleaner salesman

    One day, an old lady heard a knock on her door. When she opened it, she saw a
    young man in nice clothes holding a vacuum

    cleaner.

    "Good morning!" the man said. "Can I have a few minutes? I want to show you this
    new vacuum cleaner!"

    "Go away!" said the old lady. "I don’t have any money!" She started to close the
    door.

    But the young man quickly put his foot in the way and pushed the door open. "Please
    just give me one minute!" he said.

    "Just let me show you!" Then, he poured a basket of manure onto the floor.

    "If this vacuum doesn’t clean everything, I’ll eat what is left!" he said proudly.

    The old lady stepped back and smiled. "Well, I hope you’re ready to eat." she
    said. "Because my electricity was cut off this

    morning!"

     vacuum cleaner 吸塵器 pour 倒 electricity 電力'
