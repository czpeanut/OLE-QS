  group_stem: '(45-47)

    Scientists at the University of Cambridge have made a new machine called a flow
    reactor. This machine can help make

    clean fuel for cars and planes. It takes a harmful gas called carbon dioxide (CO2)
    from the air and changes it into fuel.

    The flow reactor uses sunlight to work. It does not need electricity, batteries,
    or wires. It is like plants, which use the Sun

    to make food. At night, the machine catches CO2 like a sponge. In the daytime,
    the sunlight helps turn CO2 into fuel.

    Today, most cars and planes use fossil fuels. When people burn these fuels, they
    make more CO2. This gas stays in the

    air and makes the Earth hotter. This is called the greenhouse effect. It causes
    climate change, which leads to big storms, hot

    weather, and other problems.

    Two scientists, Professor Erwin Reiser and Dr. Sayan Kar, believe the flow reactor
    can help. They say we can take CO2

    from the air and use it again as fuel. This could stop making more CO2 and help
    the Earth stay cooler.

    The team is now making a bigger flow reactor. They will test it in the spring.

     fuel 燃料 batteries 電池 wires 電線 sponge 海綿 greenhouse effect 溫室效應'
