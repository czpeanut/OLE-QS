- id: doc_113_新北_桃子腳_英語_g9s2e1_s6_42
  section: 6
  number: 42
  type: single
  page: 3
  stem: 42. What can we learn from the reading?
  options:
  - label: A
    content: Smarter kids always learn better than less smart kids.
  - label: B
    content: Hard-working kids will never win their smarter classmates.
  - label: C
    content: If kids believe they are smarter than others, they get better grades.
  - label: D
    content: Kids with grit are more likely to be successful in the writer’s study.
  group_stem: '(42-44)

    The Key to Success: Grit

    When I was 27 years old, I started teaching. I went to teach seventh graders math
    in New York City public schools.

    Like any teacher, I made quizzes and tests. I gave out homework and grades. To
    my surprise, I.Q. was not the only

    difference between my best and worst students. Some of my best students did not
    have the highest I.Q. Some of the smartest

    kids weren’t doing so well.

    This got me thinking. Seventh-grade math is hard but not impossible to learn.
    Every one of my students could learn

    the lessons if they worked hard and long enough. To better understand students
    and their learning, I left my teaching job and

    started studying psychology.

    I studied kids and adults in all kinds of challenging cases. In every study, my
    main question was, "Who is successful

    here and why?" In all these different cases, I found that grit was the most important
    key to success.

    Grit means loving your goal, staying with your goal for years, and working hard
    to make it come true.

    How can we build grit in kids? Honestly, I don’t know. However, I know that talent
    doesn’t make you gritty. In fact,

    our study showed that smarter people were less likely to be gritty. One idea to
    build grit is to teach kids about the brain and

    help them believe that the ability to learn can grow with hard work. This way,
    kids are more likely to keep trying when they

    fail because they don’t believe they will always fail.

    I believe there are more ideas to help kids become grittier, and we will continue
    to find them out with grit.

     psychology 心理學 challenging 有挑戰性的 goal 目標 brain 大腦'
