  section: 1
  number: 24
  type: single
  page: 1
  stem: 怡嘉比較中日兩國閉關自守（鎖國）的資料，發現兩國都因列強武力的威脅和侵逼而被迫開港通商。請問：關於中日這方面的歷史，下列的比較說明，何者敘述正確？
  options:
  - label: A
    content: 兩國被迫打開門戶的時間都是發生在 18 世紀中期左右
  - label: B
    content: 英國首先打開中國的門戶，而美國首先打開日本的門戶
  - label: C
    content: 兩國在外力的衝擊之後均立即展開了變法圖強的改革
  - label: D
    content: 中國第一個改革自強運動比日本明治維新的改革還要成功。
