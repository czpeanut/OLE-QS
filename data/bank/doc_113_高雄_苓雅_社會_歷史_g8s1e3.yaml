  section: 1
  number: 23
  type: single
  page: 1
  stem: 張寧看到清末的一份聲明：「此事件後，我們聽到政府與某國談判求和，不但讓朝鮮獨立，還開放更多口岸，任由外國在中國內陸設置工廠。我們要求政府立即變法圖強，持續抵抗。」關於這份聲明，下列敘述何者正確？
  options:
  - label: A
    content: 聲明者為康有為
  - label: B
    content: 此事件為鴉片戰爭
  - label: C
    content: 某國應為英國
  - label: D
    content: 聲明者後來發起立憲運動。
