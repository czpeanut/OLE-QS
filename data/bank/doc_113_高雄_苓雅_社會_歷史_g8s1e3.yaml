- id: doc_113_高雄_苓雅_社會_歷史_g8s1e3_s1_21
  section: 1
  number: 21
  type: single
  page: 1
  stem: 「纏足──三寸金蓮」是中國宋代以來就有的陋習，目的有二：一、認為女性「小腳便是美」。二、只要裹小腳，女性便不易逃跑。後來此風傳入臺灣，殘害著女性的身體與心靈，故自○起，就有「有識之士」主張「天足運動」，而臺灣也自□開始，主張廢棄纏足。請問：以上缺空處，各應填入下列何者？
  options:
  - label: A
    content: 宋元時期；清帝國統治初期
  - label: B
    content: 隋唐之際；荷治時期
  - label: C
    content: 清末；日治時期
  - label: D
    content: 明末清初、清末。
