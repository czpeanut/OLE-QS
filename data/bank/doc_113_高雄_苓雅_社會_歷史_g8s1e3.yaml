- id: doc_113_高雄_苓雅_社會_歷史_g8s1e3_s1_26
  section: 1
  number: 26
  type: single
  page: 1
  stem: '如萱分析右表關於 1823～1839 年間，中國白銀出口數及白銀兌換的錢數。請問：造成這種現象的原因為何？


    | | 白銀出口兩數 | 一兩白銀兌換的錢數 |

    | :--- | :--- | :--- |

    | 1823～1824 | 1,885,320 | 1,249 |

    | 1828～1829 | 3,386,305 | 1,337 |

    | 1833～1834 | 4,846,763 | 1,363 |

    | 1838～1839 | ─ | 1,638 |'
  options:
  - label: A
    content: 英國為平衡貿易逆差，大量輸入鴉片，造成白銀外流
  - label: B
    content: 五口通商以後，外國朝貢貿易興盛，造成銀漏於外的結果
  - label: C
    content: 鴉片合法化，造成鴉片大量輸入，銀漏於外
  - label: D
    content: 外人得在口岸設廠製造，大賺中國白銀出口，造成銀貴錢賤的現象。
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 歷史
      code: 5-1
      title: 西力對東亞世界的衝擊
      chapter: 第5章 西力衝擊下的東亞世界
    textbook: 八上歷史 5-1 西力對東亞世界的衝擊
    labeled_by: ai
