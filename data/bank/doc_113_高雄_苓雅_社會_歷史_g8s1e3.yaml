  group_stem: '建誌和竑璋看完《宋家皇朝》這部敘述宋美齡三姊妹生平的電影。發現在她們成長的過程中，父親曾自豪的說，她們可不是一般的女孩子，她們是接受新式教育的新中國女性。電影中有一幕是老二慶齡和老三美齡，為了政治理念不同，當著美齡丈夫的面用英文吵架。老大靄齡同樣用英文勸架，完全聽不懂的美齡丈夫臉色愈來愈難看，突然拍桌大喊，這裡是中國，請說中文。三姊妹才悻悻然閉嘴。

