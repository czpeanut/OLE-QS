  group_stem: "每個人都可能有環境不好，遭遇坎坷，工作辛苦的時候。說得嚴重一點，幾乎可以說，在我們每個人降生到這個世界以前，就被注定了要背負起經歷各種困難折磨的命運。\
    \ \n但這並不是說，因此就該認定人間沒有樂趣，或生命沒有價值。我們雖然被注定了要靠勞力、靠工作來維持自己的生活，雖然被注定了有七情六欲來品嘗人間各種各樣的離合悲歡；但在另一方面，我們卻有機會欣賞這有鳥語花香的世界，我們還有智慧可以體味人間苦樂的真諦，我們也還有心情來領略人間的愛心、善良和同情是何等的珍貴。總而言之，和我們所付出的代價比起來，我們的收穫是值得的。\
    \ \n我常把人生比作一次旅行，辛勞和苦難算做是我們所不能不花的旅費。而在這一趟旅程中，我們可以得到各種各樣五色繽紛的經驗。當我們痛苦的時候，可以當作那是我們在旅途中的涉水跋山、走狹路、過險橋。而當我們快樂的時候，那是我們到達了風光明媚的處所，卸下了行裝，洗去了風塵，在欣賞流連。也正如旅行一樣，不在某一處風景區永遠停留，而只能在駐足一陣之後，就又該背起行囊去尋覓另一處佳境。\
    \ \n因此，人間的苦苦樂樂，我們都該把它看作理所當然。做生意順利的時候，財源滾滾而來，取之不盡，用之不竭，那是順境。一旦遇上風險，逆境來臨，就又要過一過節衣縮食的苦日子。不夠堅強的人當逆境來臨時，就難免會匆匆結束這次旅行，提早承認自己的失敗；而假如我們夠堅強，就該明白，我們就是為經歷這些風險而來。若遇上風險逆境時，\
    \ 就 \n作為一個像樣的旅行家需要勇氣，也唯有有勇氣承擔旅途風險的人才可以到達人生的勝境，才可以領略到一般人所領略不到的「化險為夷」、「夜盡天明」、「臘盡春回」等等的樂趣。因此，逢到逆境時，我們要忍一忍、熬一熬，再多拿出一分勇氣和信心。不要只看旅途的艱苦，而要把希望的燈光點亮，去照見那你所想要去的地方。人，才可以到達人生勝境。\
    \ \n 我們每一個人都有受到環境壓力的時候，但在這時候，你與其悲傷流淚，就不如將就自己既有的條件去慢慢耕耘，等一旦機會來臨，自己也有了足夠的條件去應付了，境遇就好轉了。許多事實使我相信，一個人的生活需要可以縮小到最小限度，而一樣保持樂天達觀的心情。只要你自己不讓自己消沉灰頹，環境是不能把你怎樣的。\
    \ \n懂得旅行樂趣的人，往往對平坦好走、容易達到的地方沒有興趣，而偏偏喜歡去找那些險峻的山、未開發的林，或沒有人煙的島。他們認為旅行的樂趣在於克服那些途中的困難，在於到達別人所不易到達的地方，在於發現新的佳境。\
    \ \n懂得人生的人也是一樣，他們往往不喜歡平穩凡庸的生活，而有膽量去嘗試一些困難的、冒險的，但卻有內容、有意義的生活。因為他們知道，當困難克服了，險境過去了，他們才會嘗到一些人生的真味，他們才會真正懂得人生的苦是怎樣的苦法，樂又是怎樣的樂法，貧窮的滋味怎樣，失戀的滋味如何，而他們最大的收穫卻往往是成功的快樂。險境後\
    \ \n俗話說：「吃得苦中苦，方為人上人。」所謂「人上人」並不是一般功利的想法，而是說，他可以在生活上比一般人較為豁達開通，眼光遠大，做起事來可以得心應手。如果我們從小就安安穩穩無風無浪的，像花朵一樣生活在暖房裡，我們所見的天日就只有那一點點，所能適應的溫度也就只有那一點點，那還有什麼意思呢？\
    \ \n羅蘭〈人生逆境〉"
