    \ 所說的「IKEA 效應」。 \n  妥善運用「IKEA 效應」，能使參與者投入情感，享受過程，獲得成就感，增加凝聚力。例如在社團成果發表會前，大家花時間布置場地；在親子活動中，讓小孩親手做蛋糕；在銷售遇到瓶頸時，請員工們動腦想辦法。付出的心血能為事物加值，令我們倍加珍惜親力親為的成果。\
    \ \n  不過，「IKEA 效應」也可能導致「自我感覺良好」，誤以為別人也會肯定我們的心血結晶，因而失去檢視缺點的機會。企業經理人尤其不應有「非我所創症候群」（Not\
    \ Invented Here Syndrome）─外來的構想一概不用，獨鍾內部自行研發的方案。而對投注大量資源卻遲無進展的計畫，也不宜敝帚自珍，以免一條路走到黑。"
