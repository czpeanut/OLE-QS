  section: 1
  number: 22
  type: single
  page: 3
  stem: "評論家最好能具備這樣幾個美德：首先是言之有物，但不能是他人之物，尤其不可將西方的當令理論硬套在本土的現實上來。其次是條理井然，只要把道理說清楚就可以了，不必過分旁徵博引，穿鑿附會，甚至不厭其煩，有如解答習題一般，一路演算下來。再次是文采斐然，不是寫得花花綠綠，濫情多感，而是文筆在暢達之中時見警策，知性之中流露感性，遣詞用字，生動自然，若更佐以比喻，就更覺靈活可喜了。最後是情趣盎然，這當然也與文采有關。一篇上乘的評論文章，也是心境清明，情懷飽滿的產物，雖然旨在說理，畢竟不是科學報告，因為它探討的本是人性而非物理，犯不著臉色緊繃，口吻冷峻。\
    \ \n余光中《從徐霞客到梵谷‧自序》 \n依據上文，下列何者最符合作者理想的藝文評論？"
