  stem: "蘇東坡在落難的時候，才在岸邊寫下了「大江東去，浪淘盡」這樣完美的詞句。受到皇帝賞識時，他的書法漂亮、工整、華麗，而且得意。因為他是一個才子，才子總是很得意的。但是他從來沒有想過，他讓很多人受過傷。他得意的時候，很多人恨他恨得要死，別人沒有他的才氣，當然要恨他。但是他落難時寫的書法，這麼笨、這麼拙，歪歪倒倒無所謂，卻變成中國書法的極品。此時苦味出來了，他開始知道生命的苦味，並不是你年輕時得意忘形的樣子，而是在這麼卑屈、所有的朋友都不敢見你的時候，在江邊寫出最美的詞句。\
