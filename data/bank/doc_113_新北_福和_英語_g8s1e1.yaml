  group_stem: 'Know About Three Storms

    There are different kinds of storms. They happen in different places around the
    world. Let’s learn about them: typhoons, hurricanes, and tornadoes.


    Typhoon

    A typhoon is a big storm with strong winds and heavy rain. It happens in places
    near Asia, like Taiwan, Japan, and the Philippines. Typhoons can cause floods
    and break trees. People need to stay safe at home.


    Hurricane

    A hurricane is like a typhoon. It happens in places close to North America, like
    the United States, Mexico, and the Caribbean islands. Hurricanes can also cause
    floods and break buildings. They have strong winds and heavy rain, just like typhoons.


    Tornado

    A tornado is another kind of storm. It looks like a big spinning cone. It happens
    many times in the United States, in places like Texas and Oklahoma. Tornadoes
    are not big like typhoons and hurricanes, but they spin very fast. They can pick
    up cars, houses, and trees. Because they move so fast.


    📖 storms 風暴 floods 洪水 spin 旋轉 cone 圓錐體 pick up 捲起 North America 北美洲'
