  stem: What do line standers do?
  options:
  - label: A
    content: They sell tickets at a store.
  - label: B
    content: They wait in line for other people.
  - label: C
    content: They teach people to wait in line.
  - label: D
    content: They give food to people in line.
  group_stem: 'Line Standers: A New Kind of Job


    People need jobs. Most jobs need skills and knowledge. However, a line stander
    job does not need these. A line stander waits in long lines for others. The line
    stander waits to buy things like food, tickets, or new cell phones. These things
    are not for the line stander. They are for other people because they do not want
    to wait or don’t have time. Those people pay line standers to buy things for them.
    The job is not easy. Line standers have to wait for many hours or days to finish
    the work, so they may not be able to use the restroom. Besides, they may stand
    in bad weather and deal with rude people. But line standers can make good money.
    If you like waiting in line, this job is for you.


    📖 or 或 rude 粗魯的'
