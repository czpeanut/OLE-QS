- id: doc_113_新北_丹鳳_社會_公民_g9s1e1_s1_44
  section: 1
  number: 44
  type: single
  page: 2
  stem: 以你所學的經濟學概念判斷，在上述限額購買的行銷策略下，對於欲購買的顧客而言，烘焙坊的商品是否具有稀少性？
  options:
  - label: A
    content: 稀少性是指相對於欲望，故此商品具有稀少性
  - label: B
    content: 稀少性是指相對於欲望，故此商品不具稀少性
  - label: C
    content: 稀少性是以實際數量判斷，故此商品具有稀少性
  - label: D
    content: 稀少性是以實際數量判斷，故此商品不具稀少性
  group_stem: "題組：請依據下列圖表回答第44-47 題。\n  善於烹飪的花媽於市場裡開設「我們這一家烘焙坊」，在一週的試營運期間販售鹽可頌、日式泡芙、千層蛋塔、冰火菠蘿油，並規定每位顧客每次至多購買兩個產品。此行銷策略下，引發顧客的購買欲望，促使更多人前來消費。下表是試營運期間此四種產品的銷售概況。\n\
    \n| | 售價(元/個) | 成本(元/個) | 銷售量(個) |\n| --- | --- | --- | --- |\n| 鹽可頌 | 40 | 25\
    \ | 200 |\n| 日式泡芙 | 50 | 20 | 220 |\n| 千層蛋塔 | 70 | 35 | 150 |\n| 冰火菠蘿油 | 55 |\
    \ 30 | 250 |\n\n  一週的試營運過後，花媽根據試營運期間各產品所創造的利潤，決定將利潤最高的產品留下，正式開幕之時，烘焙坊將轉型為販售該產品的專賣店，希望將「我們這一家烘焙坊」發揚光大。"
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 公民
      code: 1-1
      title: 選擇與機會成本
      chapter: 第1章 選擇與消費
    textbook: 九上公民 1-1 選擇與機會成本
    labeled_by: ai
