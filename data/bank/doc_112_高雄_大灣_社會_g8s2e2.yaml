  section: 1
  number: 8
  type: single
  page: 1
  stem: '全世界四個人中有一位是穆斯林人口，不論你是旅遊世界各地，還是在異地念書、工作，往後在生活中

    遇見穆斯林的機會一定很大。若要和虔誠的穆斯林家人和朋友相處，有必要了解穆斯林飲食的規定

    ，下列敘述，何者正確？'
  options:
  - label: A
    content: 禁止食用已死去的動物
  - label: B
    content: 不可以到素食餐廳用餐
  - label: C
    content: 飲食不吃牛肉料理
  - label: D
    content: 食材注重有機認證。
