  stem: '西元2015 年後，阿拉伯聯合大公國的杜拜機場，每年乘客數量躍升至全球第三名，造成這個現象的原

    因很多，其中眾多的轉機旅客是重要因素之一，許多人選擇在杜拜轉機，與下列哪一因素最不相關？

    (註：阿聯酋航空是阿拉伯聯合大公國的客運航空公司，於1985 年成立，

    提供來往杜拜的民航服務)'
  options:
