- id: doc_112_高雄_大灣_社會_g8s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '蘇伊士運河位於歐、亞、非三洲交界地帶的要衝，該運河收入是埃及國家財政收入的主要來源之一。埃

    及蘇伊士運河管理局（SCA）宣布2023 年1 月上調蘇伊士運河的船舶通行費10〜15％，可預期未來國

    際運費將持續上漲，原因是蘇伊士運河占全球貨櫃運輸總量的30％，掌握連接下列哪兩個水域間航運

    的重要地位？ (甲)紅海 (乙)黑海 (丙)波斯灣 (丁)地中海。'
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 丙丁
  - label: D
    content: 甲丁。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 地理
      code: 3-1
      title: 自然環境
      chapter: 第3章 西亞與北非的自然環境與文化
