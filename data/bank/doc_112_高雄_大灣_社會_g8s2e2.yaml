  section: 1
  number: 10
  type: single
  page: 2
  stem: '受制於嚴苛的自然環境，西亞與北非地區居民的食衣住行，皆與其他地區不同，文化形式獨樹一格，

    下列有關其食衣住行等生活特色的描述，下列何者錯誤？'
