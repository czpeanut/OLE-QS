      title: 文化特色與生活方式
      chapter: 第3章 西亞與北非的自然環境與文化
    textbook: 八下地理 3-2 文化特色與生活方式
    labeled_by: ai
- id: doc_112_高雄_大灣_社會_g8s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 'Khôl 意指由「銻」製成的眼用物品，是一種眼線粉，至今依然出現在北非摩洛哥女性的化妝台上。當

    女人全身包裹，只露出一雙眼，Khôl 讓女人以「眼」展現萬種風情，傳統當地女子以Khôl 細細描繪雙

    眼，希望自己能有雙瞪羚一樣的大眼睛，以吸引心儀男子。文中所描述的北非女子是因為必須遵從某宗

    教的規定，因而特別重視眼睛的裝扮，此宗教分布地區不包括下列何者？'
  options:
  - label: A
    content: 西亞
  - label: B
    content: 北非
  - label: C
    content: 中亞
  - label: D
    content: 東北亞。
