- id: doc_112_高雄_大灣_社會_g8s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: '貝都因人是游牧民族，向來以熱情好客聞名，這也是他們的生存智慧。由於游牧生活與當地天氣所帶

    來的不便之處，使得貝都因人難以長期儲存食物，所以當一個貝都因部落殺死一隻動物，他們會邀請鄰

    居一同享用，也期望得到相同回報。也因為必須在惡劣環境中生存，自然而然懂得相互款待。貝都因人

    樂於分享的習慣，除了受生活方式與所處地區的天氣型態外，他們的好客也來自宗教，強調「客人是上

    帝的客人」，對客人慷慨即榮耀上帝，幫助他們是種榮幸。下列關於貝都因人生活環境的描述，哪一項

    正確？'
  options:
  - label: A
    content: 氣候乾旱少雨
  - label: B
    content: 地形崎嶇多山
  - label: C
    content: 綠洲農業發達
  - label: D
    content: 人民信仰基督教。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 地理
