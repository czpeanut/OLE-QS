- id: doc_112_高雄_大灣_社會_g8s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '到西亞旅遊的人，經常會購買當地的名產─椰棗。椰棗生長於炎熱而乾燥的氣候中，紅熟的椰棗可供食

    用，但保鮮不易，大部分是以乾果進行買賣，只有在產地才吃得到新鮮的椰棗。棗椰樹主要分布在西亞

    和北非，具有耐旱、耐熱的特點。椰棗果肉含糖量高，可作糧食、製糖或釀酒，籽可以榨油，是西亞和

    北非國家重要的出口特產。下列關於西亞椰棗的敘述，何者錯誤？'
  options:
  - label: A
    content: 當地居民大多信仰伊斯蘭教
  - label: B
    content: 生長在溫帶沙漠氣候
  - label: C
    content: 有「沙漠麵包」之稱
  - label: D
    content: 屬於綠洲農業類型。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
