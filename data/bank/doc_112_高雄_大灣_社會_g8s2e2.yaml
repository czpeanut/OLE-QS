  number: 14
  type: single
  page: 2
  stem: '右圖為國際非洲豬瘟的疫情狀況。非洲豬瘟African Swine

    Fever (ASF)造成家豬及野豬的急性、惡性傳染病，所有

    品種和年齡的豬均可能感染，但不會感染人。該病以

    接觸傳染為主，可經由廚餘、節肢動物、動物分泌物

    或排泄物、車輛及人員夾帶等途徑傳播。本病在台灣

    屬甲類動物傳染病，世界動物衛生組織 (簡稱WOAH)

    列為應通報疾病。右圖中，甲區與乙區不易成為傳播

    疫區的主要原因是？'
  options:
  - label: A
    content: 宗教信仰
  - label: B
    content: 商業發達
  - label: C
    content: 地形阻隔
  - label: D
    content: 氣候溼潤。
