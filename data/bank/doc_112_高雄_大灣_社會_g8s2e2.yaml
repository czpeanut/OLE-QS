    物園，驚見背槍、戴基帕帽的以色列家庭，就酸個幾句：「以防被（哈馬斯）袋鼠攻擊啦！」，然後他也

    親臨石頭大戰的現場，描寫全副武裝的以色列軍人，如何怕石頭怕到成群躲在水泥牆後的荒謬身影。軍

