    content: 航班選擇的多樣性高
  - label: B
    content: 位於歐、亞、美三洲交通要道
  - label: C
    content: 阿聯酋航空提供相對便宜的機票
  - label: D
    content: 機場內有多樣的休閒娛樂服務。
