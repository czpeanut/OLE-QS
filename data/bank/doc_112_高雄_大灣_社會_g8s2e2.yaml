- id: doc_112_高雄_大灣_社會_g8s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '朝覲是全世界穆斯林最大規模的聚會，也算是地表上最大規模的宗教活動，

    因為每年會有將近三百萬人湧入聖城。在這一百年來，朝覲的人數不斷增加，

    每年都會傳出數起踩踏事件。為了掌控群眾和安全起見，朝覲儀式不斷改變，

    像是親吻黑石改成可以用指著黑石來代替。近年來朝覲的現場總是十分擁擠，

    每個穆斯林國家的朝覲人數是由伊斯蘭合作組織決定和分配，給定各國一定

    配額，各國人民向國家提出朝覲申請，由國家統籌出團前往。請問：上述

    朝覲的聖城是位於右圖中何處？'
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
