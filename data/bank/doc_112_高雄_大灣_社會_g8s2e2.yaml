  type: single
  page: 1
  stem: '西亞和北非傳統的灌溉工程如下圖所示，居民挖掘豎井和暗渠，將雪水從高山地區導引至山麓地帶的

    蓄水池，以進行農業活動。下列關於此灌溉設施的敘述，何者正確？'
  options:
  - label: A
    content: 當地氣候多雨
  - label: B
