    labeled_by: ai
- id: doc_112_高雄_大灣_社會_g8s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: '勞動部勞動力發展署表示，在臺灣的印尼籍移工約有26 萬人，大多信仰伊斯蘭教，多數從事家庭看護

    或製造業工作，與我們生活緊密相連。穆斯林在每年的某個月，一整個月白天都不進食，待太陽落下後

    才開始進食，此期間的穆斯林可能會因此出現身體不適的情形，若身為雇主，要適時給予關心及適當的

    協助，掌握三要點：平常心、主動關懷、彈性調整工作，就能協助移工順利遵守宗教的規定，進一步拉

    近勞雇距離，轉為移工在臺安心工作的動力。請問：這種現象與伊斯蘭教的何種文化有關？'
  options:
  - label: A
    content: 念清真言
  - label: B
    content: 實施齋戒
  - label: C
    content: 捐獻濟貧
  - label: D
    content: 每日祈禱。
