- id: doc_112_高雄_大灣_社會_g8s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: '西元2020 年新聞報導：「西元2010 年底，西亞和北非文化區的國家紛紛出現反政府的示威抗議，主要

    源於北非突尼西亞爆發反獨裁政府風潮，隨後這股風潮轉向鄰近國家，使多國陷入紛亂，稱為「阿拉伯

    之春」。但如今10 年過去，這些國家不僅遭受疫情衝擊，各國賴以為生的命脈，也因市場價格持續下跌

    而使得經濟萎縮，還有外國勢力掀起對立與衝突，局勢比10 年前更糟。文中提到賴以為生的命脈，指

    的是下列何者？'
  options:
  - label: A
    content: 觀光業
  - label: B
    content: 綠洲農業
  - label: C
    content: 石化產業
  - label: D
    content: 鋼鐵工業。
