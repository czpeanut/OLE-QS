  stem: '土城國中餐廚公司進行白米分裝，已知一袋 $2\frac{5}{8}$ 公斤的白米，每 $\frac{9}{16}$ 公斤裝成一包，計算得知 $2\frac{5}{8}
    \div \frac{9}{16} = 4\frac{2}{3}$。

    甲說：「可裝成4 包，剩下 $\frac{2}{3}$ 公斤。」

    乙說：「可裝成 $4\frac{2}{3}$ 包。」

    丙說：「$\frac{9}{16} \times \frac{2}{3}$ 是未滿一包的重量。」

    丁說：「$2\frac{5}{8} \times \frac{2}{3}$ 是未滿一包的重量。」

    則哪些人說法正確？'
  options:
  - label: A
    content: 甲、丙
  - label: B
    content: 甲、丁
