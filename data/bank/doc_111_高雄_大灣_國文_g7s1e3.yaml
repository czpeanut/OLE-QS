    \ \n  根據英國特伯里基督大學最新調查顯示，英國、德國、澳洲的合唱團成員都說唱歌能提升心情與生活品質。撰稿人之一的克里夫教授表示，唱歌還能解決部分人士的身心健康問題。\
    \ \n  不久前，瑞典斯德哥爾摩大學的桑格倫博士也研究過唱歌的生理益處。初步結果顯示，唱歌時會釋放讓人產生凝聚感與安全感的荷爾蒙——催産素。桑格倫博士早期曾做過另一項研究，發現業餘歌者上完歌唱課後比較快樂。\
    \ \n憤怒影響肺功能 \n  你的性情暴躁嗎?提醒你，盡量改一改吧，否則，不單人人怕你，更糟糕的是，恐怕對你的肺功能造成損害。 \n  美國哈佛大學公共衛生學院完成一項研究，在八年內，總計三次為六百七十位男性測量肺容量，以及評定他們對人的敵視程度。結果發現，嚴重敵視他人的人，相較於較平和的人，前者的肺功能明顯較差。\
    \ \n  英國肺臟基金會會長約翰·摩爾格倫指出:「當你憤怒時，身體會產生荷爾蒙，幫助你準備戰鬥。這個過程會釋放某些化學物質，令支氣管細胞發炎，氣管因而變窄，讓你感到喘不過氣來。」雖然相較於吸菸，這種傷害比較輕微，但長遠來說，也會引發不可挽回的傷害。所以，你應盡量控制住激動的情緒，遇到不快的事，來個深呼吸，從一數到十，然後問自己:「真有那麽嚴重嗎?」\
    \  \n                                                                        \
    \           (節選自讀者文摘)"
