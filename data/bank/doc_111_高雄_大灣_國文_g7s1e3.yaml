    \ \n  康肅問曰：「汝亦知射乎？吾射不亦精乎？」翁曰：「無他，但手熟爾。」康肅忿然曰：「爾安敢輕吾射！」翁曰：「以我酌油知之。」乃取一葫蘆置於地，以錢覆其口，徐以杓酌油瀝之，自錢孔入，而錢不溼。因曰：「我亦無他，惟手熟爾。」康肅笑而遣之。\
    \ \n注：陳康肅公：北宋人，本名陳堯咨，康肅是諡號。公，對年長或有地位者的尊稱。自矜：自誇、自負。矜，自大。睨：斜著眼睛看。頷：下巴，此作動詞用，點頭。汝：你。爾：而已、罷了。瀝：滴下，指注入"
