  - label: D
    content: 夜雨的迷離淒清
  group_stem: "(三)牽著時間去散步(節錄) 簡 媜\n 六月，像個離家多年的養蟬人，在一個落雨的夜晚背著幾簍蟬回來了。把蟬簍掛在竹子、榕樹、相思樹、玉蘭樹及七里香矮籬上，他撥開叢草，穿過結實纍纍的野梅樹──雨把它們洗熟了，空氣裡有一股酸甜的香氣，彷彿就是返鄉浪子的體味。他一腳跨過自家門檻，身上的雨服一脫，太陽就出來了，成熟的梅子紛紛墜地，驚動了蟬。"
