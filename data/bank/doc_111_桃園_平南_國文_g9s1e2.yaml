  stem: 國文老師請同學利用中秋假期完成一份大明湖的學習單，關閔綠只想快快加入好友的烤肉趴，所以只憑直覺作答未加深究，請問下列敘述完全正確？
  options:
  - label: A
    content: 全文以「老殘隨手摘了幾個蓮蓬，一面吃著，一面船已到了鵲華橋畔了」作結：意在暗示老殘遊興未盡
