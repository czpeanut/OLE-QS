- id: doc_111_桃園_平南_國文_g9s1e2_s2_31
  section: 2
  number: 31
  type: single
  page: 2
  stem: 依照上下文意，本文(甲)、(乙)處依序應填入下列何者？
  options:
  - label: A
    content: (甲)名不符實，(乙)劉鶚
  - label: B
    content: (甲)名留千古，(乙)劉鶚
  - label: C
    content: (甲)名不符實，(乙)高鶚
  - label: D
    content: (甲)名留千古，(乙)高鶚
  group_stem: "(四)我看大明湖 梁容若\n 常聽見人說，讀了老殘遊記去遊大明湖，一定會感到失望或幻滅，因為百花隄沒有花，歷下亭碰不到名士，大明湖不是湖，乃是一條小河，夾岸長滿了蘆葦。還有些粗心的人，既不注意時間，也不注意地方，在歷下亭邊找千佛山的倒影，在滿天雲霧裏看鵲華秋色，找不到，看不見，就懷疑老殘撒謊，或更斷定是文人誇誕。大明湖因為老殘遊記的描繪出了名，也因為好多遊人指出它的\
    \ (甲) ，使齊 魯山水都減了聲價。\n 從 (乙) 遊濟南到現在，不過半世紀多點，大明湖真老了醜俗化了嗎？照我看，明湖也許變了，變的可並不多。「荷花世界柳絲鄉」，還是照樣，只是種荷花的人，因為老殘一類的白吃蓮蓬，亂摘蓮花的客人太多了，培植了一排一排的葦牆，把荷花一區一區的圈起來。只留下幾條深水的通路，給閑人蕩槳。花是看不見，花香可沒有關住，你也可以從蘆葦縫裡窺見芬芳鮮豔的花海的一斑。你想要認識湖的全貌嗎？請到北極閣上看，請到城頭馬路上看，「一城山色半城湖」，「滿湖荷花繞湖柳」，並沒有什麼誇張。千佛山的倒影，一定在天高氣清的秋天，在鐵公祠前的湖面寬處，才看得分明。想認識大明湖的光明如鏡，也須在秋天冬天的蘆荷枯萎後。你要到千佛山頭興國寺的敞廳遠眺，或是坐上飛機下看，黃河是一條寬而黃的長帶子，小清河是一條綠的頭繩，大明湖正是仙女放下來的一面亮晶晶的鏡臺。荷花是可以遠觀，不可以褻玩的，明湖也跟廬山一樣，要認識它的其面日，須要站的高一點兒遠一點兒。"
  tags:
