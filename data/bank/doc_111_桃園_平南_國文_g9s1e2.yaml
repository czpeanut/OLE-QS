- id: doc_111_桃園_平南_國文_g9s1e2_s3_41
  section: 3
  number: 41
  type: single
  page: 3
  stem: 「我攀登過峰巒雄偉的泰山，游覽過紅葉似火的香山，卻從沒看見過桂林這一帶的山。桂林的山真奇啊，一座座拔地而起，各不相連，像老人，像巨象，像駱駝，奇峰羅列，形態萬千；桂林的山真秀啊，像翠綠的屏障，像新生的竹筍，色彩明麗，倒映水中；桂林的山真險啊，危峰兀立，怪石嶙峋，好像一不小心就會栽倒下來。這樣的山圍繞著這樣的水，這樣的水倒映著這樣的山，再加上空中雲霧迷濛，山間綠樹紅花，江上竹筏小舟，讓你感到像是走進了連綿不斷的畫卷，真是『舟行碧波上，人在畫中遊』。」根據本文，下列敘述何者有誤？
  options:
  - label: A
    content: 作者以「奇」、「秀」、「險」三字為核心，加以摹寫桂林的山
  - label: B
    content: 「像老人，像巨象，像駱駝」所描寫的對象，是桂林群峰的外觀
  - label: C
    content: 「像翠綠的屏障，像新生的竹筍」兩句使用譬喻法，盡寫桂林山峰的「秀」
  - label: D
    content: 「舟行碧波上，人在畫中遊」是作者在遊遍泰山、香山及桂林後的讚嘆之語
