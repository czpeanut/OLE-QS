    content: 「一片白花映著帶水氣的斜陽，好似一條粉紅絨毯」：描寫蘆花在水面上映射出的瑰麗景象
  - label: C
    content: 文中「如此佳景，為何沒有什麼遊人？」的提問：意在取笑世人缺乏鑑賞能力，浪費大好時光
  - label: D
    content: 「次日清晨起來，吃點兒點心，便搖著串鈴滿街踅了一趟，虛應一應故事」：顯示老殘是愛說故事的人
