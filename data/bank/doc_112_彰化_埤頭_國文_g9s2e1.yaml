- id: doc_112_彰化_埤頭_國文_g9s2e1_s2_25
  section: 2
  number: 25
  type: single
  page: 1
  stem: 「電影呈現給觀眾的不應該是道德的是非而應是道德的困境，如此生活才能進步。高級的敘事藝術是混淆是非的，電影是視聽的敘事藝術，所以人類發明電影不是為了看明是非，而是審視自身。」（徐浩峰試打中包的世界觀）下列何者最接近本文的意旨？
  options:
  - label: A
    content: 電影提供的是道德是非觀點，對人們的品德有正面的助益
  - label: B
    content: 電影明星演員不是成功電影的必備條件，劇本與視聽效果更為重要
  - label: C
    content: 道德因困境與混淆是非，是使生活進步的主因。
  - label: D
    content: 道德因困境與混淆是非，是使生活進步的主因。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
