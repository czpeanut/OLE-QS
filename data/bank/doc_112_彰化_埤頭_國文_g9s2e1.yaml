- id: doc_112_彰化_埤頭_國文_g9s2e1_s2_51
  section: 2
  number: 51
  type: single
  page: 3
  stem: 關於上文提到的兩個小故事，下列的解讀何者正確？
  options:
  - label: A
    content: 蘇東坡被捕前，因為沒有得到妻子的贈詩而憤怒
  - label: B
    content: 楊朴並不擅寫詩，只是浪得虛名
  - label: C
    content: 楊朴妻子寫詩向真宗求情，才讓楊朴重返自由
  - label: D
    content: 真宗應該是一位通情達理的君主。
  group_stem: '蘇東坡當年獲罪在黃州，因為烏臺詩案被詔入獄，被捕當天，福禍莫測，妻子淚眼相送，一時無語。在這種凝重又悲傷的氛圍中，蘇東坡不改幽默本性，淡淡地說：「予獨不能如楊處士妻，作一詩送我乎？」妻子不但聽懂了，也聽笑了，東坡這才轉身離開。

    楊處士，本名楊朴，是宋真宗時期的一位隱士。真宗封禪後，遍尋天下有才隱者，楊朴因為擅長作詩名列其中。真宗找到楊朴後，楊朴卻說自己不會寫詩，皇帝追問之下，楊朴才吐露實情，原來是臨行前妻子寫了一首詩送他：「更休落魄耽杯酒，且莫猖狂愛詠詩。今日捉將官裡去，這回斷送老頭皮。」真宗聽完後，哈哈大笑，放回楊朴。

    這兩個小故事觸動我心許久，在家庭關係中，夫妻的相知相惜，把一齣悲劇活脫脫地轉換成人問喜劇，是多麼難能可貴的一種豁達。楊朴被皇帝所詔，福禍未定，臨別前妻子不贈眼淚卻贈詩，半是戲謔半是責怪地表達了自己滿滿的擔心。或許正是這種近乎空白的幽默感，讓真宗皇帝哈哈一笑，也讓丈夫重返自由。相對於楊朴的妻子，蘇東坡的豁達當然更上一層樓，鋃鐺入獄前，看見妻子淚眼汪汪，他既不緊張也不啁啾，反倒向妻子討詩，一是用楊朴的典故自嘲，是藉天外飛來一筆的幽默化解妻子的悲傷。蘇東坡的豁達不但可愛，而且溫暖。但我認為，更溫暖的是他妻子的貼心和知己，在一段情感中，對方聽得懂你笑中帶淚的幽默，這是一種奢侈的幸福。

    （林銳知己情人）'
