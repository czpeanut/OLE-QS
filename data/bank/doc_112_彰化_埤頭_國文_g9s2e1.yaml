  stem: 〈鹿耳門〉：「鐵板沙連到七鯤，鯤鯓激浪海天昏。」關於這段詩句的分析，下列敘述何者不正確？
  options:
  - label: A
    content: 呈現鹿耳門的地理特色，以及沙洲激起巨浪的景象
  - label: B
    content: 鯤身暗指常擱淺此地的沙洲
  - label: C
    content: 鹿耳門一帶的七座沙洲，駭浪拍打其上激起滔天巨浪，海天一片昏暗景象
  - label: D
    content: 「鯤鯓」所指為「沙洲」。
