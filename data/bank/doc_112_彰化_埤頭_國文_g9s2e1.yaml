  stem: 根據本文所述，作者想要去尋找的是什麼花？
  options:
  - label: A
    content: 菊花
  - label: B
    content: 櫻花
  - label: C
    content: 荷花
  - label: D
    content: 梅花。
  group_stem: '或說天下未有兵甲時，常多刺客。李汧（ㄑㄧㄢ）公勉為開封尉，鞫獄，獄囚有意氣者，感勉求生，勉縱而逸之。後數歲，勉罷秩，客遊河北，偶見故囚。故囚喜迎歸，厚待之，告其妻曰：「此活我者，何以報德？」妻曰：「償兼千匹可乎？」曰：「未也。」妻曰：「二千匹可乎？」亦曰：「未也。」妻曰：「若此，不如殺之。」故囚心動。其僕哀勉，密告之。勉夜衣乘馬而逸。比夜半，行百餘里，至津店。店老父曰：「此多猛獸，何敢夜行？勉因話言。言未畢，梁上有入誓下，曰：「我幾誤殺長者！」乃去。未明，攜故囚夫妻二首，以示勉。

    （李肇唐國史補故囚報李勉）'
