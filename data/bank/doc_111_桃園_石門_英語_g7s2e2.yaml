  section: 7
  number: 41
  type: single
  page: 4
  stem: Ava and her husband will try Sugar-free Diet. How many bottles of milk do
    they drink in a day?
  options:
  - label: A
    content: '2.'
  - label: B
    content: '3.'
  - label: C
    content: '4.'
  - label: D
    content: '5.'
  group_stem: 'Sugar-free Diet

    Grace: Do you know sugar-free diet?

    Ava: No. What’s that?

    Grace: You can’t eat anything with sugar, like ice cream, cookies, and chocolate.

    Ava: Then what can you eat?

    Grace: Only natural food, like eggs, fish and chicken. It’s good for our bodies.
    My husband and I want to try it next week.

    Ava: I want to try it, too. Do you have the recipe?

    Grace: Yes, it’s right here.

    One-day Sugar-free Diet for One Person

    Breakfast: 2 eggs, 1/2 tomato

    Lunch: 1 bottle of milk, 1 orange, fish

    Dinner: 100g chicken, 1 bottle of milk, 1/2 tomato

    Ava: Do you want to go to Happy Market with me?

    Grace: Sorry, I can’t. Can you buy a tomato and two bottles of milk for me?

    Ava: Sure. How about eggs and chicken?

    Grace: No, thank you. I have them at home.

    Ava: I see.

    natural 自然的, tomato 番茄, recipe 食譜

    sugar-free diet 無糖飲食'
  tags:
    textbook: 第二冊（七下）第2次段考範圍
    labeled_by: ai
