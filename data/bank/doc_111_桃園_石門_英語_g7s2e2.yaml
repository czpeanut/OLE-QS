  number: 44
  type: single
  page: 4
  stem: Which is true?
  options:
  - label: A
    content: BLACKPINK only came to Taiwan for their world tour.
  - label: B
    content: All the BLACKPINK merchandise cost NT$20,000.
  - label: C
    content: The city government give BLACKPINK a $50 coupon.
  - label: D
    content: People going to BLACKPINK’s concert get a $50 coupon.
  group_stem: 'BLACKPINK, a K-pop girl group with four people, came to Taiwan for
    their "Born Pink" world tour. Their concerts in Kaohsiung City (高雄市) were held
    at the Kaohsiung National Stadium (高雄國家體育場) on March 18 and 19. Fans were thrilled
    to buy BLACKPINK merchandise. One of the fans even paid NT$20,000 for the merchandise.

    The city government gave $50 coupons to people going to the concert. They can
    use the coupons in the night markets in Kaohsiung City before May 31.

    world tour 世界巡迴, merchandise 商品,

    city government 市政府, coupon 優惠卷'
  tags:
    textbook: 第二冊（七下）第2次段考範圍
    labeled_by: ai
