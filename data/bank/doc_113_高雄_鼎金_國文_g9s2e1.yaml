  stem: 致信給屏風的觀眾寫下：「臺上的三流劇團一直犯錯，卻一直在找方法救場，他們都沒放棄了，我幹麼放棄？」請推測其口吻及用意為何？
  options:
  - label: A
    content: 嘲諷，暗示劇團應被市場淘汰
  - label: B
    content: 鼓勵，肯定劇團一路以來的進步
  - label: C
    content: 氣憤，認為表演不如預期，愧對票價
  - label: D
    content: 感謝，從屏風身上學會堅持的勇氣。
  group_stem: "李國修被奉為喜劇泰斗，是因為他筆下的所有角色都有丑角元素穿插其中，偶爾犯錯的鮮活模樣不時逗弄觀眾哄堂大笑。丑角的啟發源於國小三年級的一個午後，那時的他還很靦腆，手中正吃著麵茶。一個嘴饞的小朋友竟用激將法與他打賭，看他敢不敢把麵茶撒在臉上？當他真把麵茶撒了一臉時，小朋友先是嚇呆，後來笑歪，李國修在編導演教室裡寫著：「原來傷害自己、嘲弄自己，可以帶給別人歡笑。而這份成就感，也埋下了我日後扮演丑角的種子。」黃致凱說，事隔三十年後，李國修才意會到這件事對他日後創作的影響。\n\
    \  藉由李國修這個幼時的經驗，黃致凱分析悲喜劇的差異：「麵粉的傷害不是很大，但能逗人笑是正面的，當你身為一名小丑，可以透過自己的悲傷帶給別人歡笑，那一刻，悲傷也就昇華了。」多年前，曾有一名研究生因論文口試沒過而差點想不開，就在看完半里長城後，他放棄輕生念頭，並寫了信給屏風，「臺上的三流劇團一直犯錯，卻一直在找方法救場，他們都沒放棄了，我幹麼放棄？」黃致凱以這個例子說明喜劇的力量，足以讓觀眾在歡笑中慢慢擺脫悲傷漩渦。\n\
    \  李國修的喜感不只在舞臺呈現，回頭面對生死，丑角依舊貫穿其中。他很早就為自己寫下墓誌銘，並在生日當天公開宣讀：「這裡躺著一個小老頭，窮盡一生，卻未能實踐他—成立全職專業劇團與興建一座專屬表演劇場的理想。如今，屏風的一班戲子伶人依舊為這個夢勇敢邁進！……在墓碑前不需放上鮮花，小老頭感謝您來看他，並請於離去前，默默地放下一張屏風表演班（已經觀賞過）的戲票。」這份墓誌銘□□□□，他不僅為自己半生想要實踐的理想下了未竟之志的結論，同時也不忘耳提面命屏風人要為這夢想繼續邁進。（陳心怡\
    \ 黃致凱：最偉大的唐吉訶德，李國修的夢沒停過）"
