  section: 2
  number: 45
  type: single
  page: 6
  stem: 根據本文，獅貓用下列何種方式擊敗大老鼠？
  options:
  - label: A
    content: 直接撲上嚙咬，以力量壓制大鼠
  - label: B
    content: 來往消耗大鼠的體力，伺機擊之
  - label: C
    content: 迂迴繞行，進入鼠穴攻其不備
  - label: D
    content: 犧牲其他同類，藉此探知大鼠底細。
  group_stem: "萬曆間，宮中有鼠，大與貓等，為害甚劇。遍求民間佳貓捕制之，輒被噉食。\n  適異國來貢獅貓，毛白如雪。抱投鼠屋，闔其扉，潛窺之。貓蹲良久，鼠逡巡自穴中出，見貓，怒奔之。貓避登几上，鼠亦登，貓則躍下。如此往復，不啻百次。眾咸謂貓怯，以為是無能為者。\n\
    \  既而鼠跳擲漸遲，碩腹似喘，蹲地上少休。貓即疾下，爪掬頂毛，口齕首領，輾轉爭持，貓聲嗚嗚，鼠聲啾啾。啟扉急視，則鼠首已嚼碎矣。然後知貓之避，非怯也，待其惰也。彼出則歸，彼歸則復，用此智耳。\n\
    \  噫！匹夫按劍，何異鼠乎！（蒲松齡 大鼠）"
