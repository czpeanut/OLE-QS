  - label: D
    content: 鑑往知來，有先見之明。
  group_stem: '峰巒如聚，波濤如怒，山河表裡（１）潼關（２）路。望西都（３），意踟躕（４）。傷心秦 漢經行處，宮闕（５）萬間都做了土。興，百姓苦；亡，百姓苦。（張養浩
    山坡羊潼關懷古）

    【注釋】（１）山河表裡：形容潼關地勢險要，外臨黃河，內據群山，古稱「山河表裡」。表裡，內外。（２）潼關：在今陝西省 潼關縣，雄踞陝西、山西、河南三省的要衝，是進入長安的門戶。（３）西都：長安，今陝西省
    西安市。東漢遷都洛陽，稱東都，故都長安則稱西都。（４）踟躕：音ㄔˊ ㄔㄨˊ，徘徊不前的樣子。（５）宮闕：天子所居的宮殿。闕，音ㄑㄩㄝˋ。'
