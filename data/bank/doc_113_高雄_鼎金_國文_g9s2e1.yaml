  section: 2
  number: 38
  type: single
  page: 5
  stem: 張果老和呂洞賓兩位神仙為何會造訪常白吃的家？
  options:
  - label: A
    content: 看見匾額上的字
  - label: B
    content: 雲遊時落腳歇息
  - label: C
    content: 聽聞有人叫陣挑釁
  - label: D
    content: 久聞常白吃的惡名。
  group_stem: "有個姓常的小氣鬼，跟人下館子從來不掏腰包，一門心思喝蹭酒占便宜，天長日久人家都叫他常白吃。\n  這傢伙嘴巴饞臉皮厚，不管人家叫得多難聽，沾邊就賴，照吃不誤。後來，人們湊錢給他送了塊大匾，上面刻著「神仙愁」三字。他不但不臉紅，還把匾高高懸掛在門楣上。\n\
    \  有一天，張果老和呂洞賓雲遊路過，一見明晃晃的大匾挺有意思，下狠心會會高人，看看他用什麼手段愁倒神仙。\n  一進門，兩老頭可憐巴巴要討口吃的，常白吃說自家已經斷糧三天，端出兩杯涼水招待。\n\
    \  張果老一看傻眼了，這傢伙還真夠摳門的。便把自己的酒葫蘆擺在桌面上：「我倒有些薄酒，咱哥仨以牌匾為題作詩暢飲。作得出的喝酒，作不出的瞅著。」\n  於是，張果老先來：「神是示加申，有酒我先斟，初次見面沒大禮，獻上鼻子表寸心。」說罷，揪下鼻子掰成三半，自己吃了一半，「咕咚咕咚」喝了一痛快。\n\
    \  呂洞賓抿嘴一樂接上了：「仙是人靠山，好酒心喜歡，天南海北逢知己，獻上耳朵也心甘。」說完，拽下耳朵撕成三片，自己扔嘴裡一片，也「咕咚咕咚」喝了一痛快。\n\
    \  兩個老頭皮笑肉不笑盯著常白吃，看他到底怎麼對付。常白吃眨了眨眼皮，搖頭晃腦對道：「愁是禾火心，美酒饞死人，山珍海味咱沒有，拔根汗毛敬來賓。」\n  接著，他從大腿上拔下一根汗毛，咬牙瞪眼掐成三截，自己有滋有味嚼了一截，又把鼻子和耳朵填進嘴裡，端起酒葫蘆「咕咚咕咚」一飲而盡。\n\
    \  兩個老頭對常白吃佩服得五體投地。呂洞賓說：「告訴你，俺倆可是正兒八經的神仙，神仙登門你就給汗毛吃，也夠損的。」\n  常白吃聽完哈哈大笑：「我就知道你們不是凡人，今天也就是二位大仙駕到，換了別人我還一毛不拔呢！」（曲殿凱\
    \ 一毛不拔）"
