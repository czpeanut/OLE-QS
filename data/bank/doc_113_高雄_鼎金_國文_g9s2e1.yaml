- id: doc_113_高雄_鼎金_國文_g9s2e1_s2_47
  section: 2
  number: 47
  type: single
  page: 6
  stem: 根據本文，下列何者是奢侈之人會有的行為？
  options:
  - label: A
    content: 古樸質實
  - label: B
    content: 量入為出
  - label: C
    content: 足以自給
  - label: D
    content: 諂求詐騙。
  group_stem: "儉，美德也，而流俗顧薄之（１）。\n  貧者見富者而羨之，富者見尤富者而羨之。一飯十金，一衣百金，一室千金，奈何不至貧且匱也？每見閭閻（２）中，其父兄古樸質實，足以自給，而其子弟羞向者（３）之為鄙陋（４），盡舉其規模而變之，於是累世之藏，盡廢於一人之手。況乎用之奢者，取之不得不貪，算及錙銖，欲深溪壑（５）。其究（６）也，諂求詐騙，寡廉鮮恥，無所不至。則何若量入為出，享恆足之利乎？\n\
    \  且吾所謂儉者，豈必一切捐（７）之？養生送死（８）之具，吉凶慶弔之需，人道之所不能廢，稱情（９）以施焉，庶乎其不至於固耳。（李文炤 儉訓）\n【注釋】（１）顧薄之：反而輕視它。（２）閭閻：鄉里。（３）向者：指過去而言。（４）鄙陋：粗俗簡陋。（５）欲深溪壑：欲望比山谷還深。（６）究：最後。（７）捐：棄。（８）養生送死：對親人的奉養與安葬。（９）稱情：酌量情形。"
