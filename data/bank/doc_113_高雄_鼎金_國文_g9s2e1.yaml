  group_stem: "詩人杜甫，生於唐睿宗 景雲三年壬子正月元日，西元七一二年，是歲，正月改元太極，五月改元延和，七月傳位太子隆基，即玄宗，八月改元先天。詩人卒於代宗\
    \ 大歷五年庚戌冬，年五十九。\n  這些乾燥的敘述無關詩人死生之宏旨，而詩人的生平疑點專家也早有定論，許多關於詩人的流言，如飫①死、驚死等，也被強有力的證據一一駁斥，但叢編裡浩瀚的資料仍留下了一小段的空白：詩人在寫完最後一篇作品風疾舟中伏枕書懷，至其肉體死亡的那段期間，沒有任何人知道他是如何度過的，他望見了怎樣的風景、留下了什麼遺言？有誰為他飄蓬的一生哭泣……。\n\
    \  詩人降生這年，歷史上最浪漫的皇帝登基，老派宮廷詩人宋之問賜死於西南荒僻的桂州驛，王維、孟浩然這兩位即將震動詩壇的才子方且二十出頭，已經寫出了好些精采的作品，「盛唐」的政治氣候與文化氛圍已經就緒，這時的詩人杜甫，在河南\
    \ 鞏縣 瑤灣一戶民宅的襁褓中，呼吸著大唐帝國凜冽的金色空氣，他的眼裡是晴空蔚藍，沒有人知道他將有坎坷的一生，以及那璀璨的、近乎神聖的詩藝成就。（徐國能 詩人死生）\n\
    【注釋】①飫：音ㄩˋ，飽食、飽足。"
