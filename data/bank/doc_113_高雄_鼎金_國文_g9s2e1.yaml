    content: 功力不足。
  group_stem: "１９８７年，一位作家在鹽湖城采風時發現一個名叫金皮克的自閉症患者，該患者記憶力超強，能一字不漏背誦至少９０００本書的內容。作家從其個性中汲取靈感，寫出了一本小說。他想把它拍成電影讓更多的人看到，於是，找到一家電影公司的老闆尋求合作。老闆看後對他說道：「小說很好，但要告訴你的是，一定要找編劇打磨好才可以。」\n\
    \  於是，作家開始找編劇，第一位看過故事梗概後立刻告訴他道：「小說主要人物太少，通篇只有兄弟兩人，即使做成後也不會有好的票房。」\n  當找到第二位編劇的時候，對方委婉的告訴他道：「寫得很好，可是感覺太單薄，只有兩個人開車跨越全美國的對話，何況其中一位心智還有問題，最好是加上一點打鬥、謀殺之類的情節啊！」他再次遭到拒絕。\n\
    \  當找到大名鼎鼎的史蒂芬．史匹柏的時候，同樣被否定。\n  作家垂頭喪氣的來到電影公司老闆面前訴苦道：「他們都說不行，看來是編不成電影了……」老闆對他說：「別灰心，相信我的看法，一定會找到識貨的編劇的。」\n\
    \  作家找到的第五位編劇是莫羅。莫羅看完小說後，感動得淚流滿面，答應並很快完成了劇本的創作。在經過三個導演的執導後，電影終於成功攝製完成。一上映便風靡全球，並先後獲得了奧斯卡金像獎等四項大獎。\n\
    \  這部電影就是雨人，這位老闆就是索尼娛樂事業公司總裁彼得．戈柏。\n  提起這部影片，戈柏就說：「拿到這部小說我就覺得有市場，有些編劇只是太急功近利，一個企求立刻能看到成功的人往往放棄得也越快。就好像一塊醜陋的石頭，膚淺的人只會不屑一顧，而只有智者才知道，經過一番雕琢打磨，璞玉終會大放異彩。」（改寫自石順江\
    \ 一部電影背後的人生）"
