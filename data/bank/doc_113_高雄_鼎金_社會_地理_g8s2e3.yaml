  number: 5
  type: single
  page: 1
  stem: 由休傑克曼成立的「微笑人基金會」（Laughing Man Fondation），多年來協助非洲貧困的咖啡農，讓這些咖啡的栽種者，可以免於大財閥的壓迫，種出真正快樂的咖啡，如圖（六）。許多衣索匹亞的咖啡農都一樣，大財閥的控制使得市場出現了不合格的價錢，抑制了他們的成長，也讓他們付出了勞力與收入不成正比，有鑑於此，休傑克曼與朋友成立的咖啡品牌「Laughing
    Man」，就是要來協助這些人解決貧窮問題，並把這些收入全部捐給「微笑人基金會」，其中從灌溉系統的設置到獎勵學金無一不包，讓當地的人漸漸脫離了極端貧窮的生活。根據上文敘述，該公司主要想表達何種理念？
