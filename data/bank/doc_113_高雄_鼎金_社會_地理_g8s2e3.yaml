  group_stem: '◎千年挑戰計畫是美國國會在2004 年設立的對外援助機構。目的是向那些落後的、不夠發達但被評估認為具有良好經濟政策與發展潛力的發展中國家提供經濟援助，利用援助資金讓受助國家實現經濟增長並擺脫貧困。但在成立21
    年、向發展中國家的基礎設施項目投資了170 億美元後，在川普政府的撤銷命令下，這一機構最終落下帷幕。

    在科特迪瓦首都阿比讓的庫馬西大型立交橋工地上，工人們仍在忙碌地施工中，這個工程是千年挑戰資助科特迪瓦的項目之一，主要針對港口大道 (Boulevard du
    Port) 的修復。美國的資助這個西非國家的總額為 5.37 億美元。美國機構負責實施科特迪瓦資助項目的主管瑪麗-維維安·阿多·戈桑-庫利巴利 (Marie-Viviane
    Ado Gossan-Coulibaly) 表示，立交橋的項目是經過多年籌備的，但正是因為有了美國的資助才使其成為可能。它是科特迪瓦經濟的一條重要通道，因為所有進出口產品都要經過這條要道。此外，這裡還聚集着許多產業，例如水泥、咖啡和可可。修復這樣一條大道將對所有這些產業的業績產生重大影響。”請回答第16~17
    題：'
