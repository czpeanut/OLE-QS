  stem: What happens to animals when they eat plastic?
  options:
  - label: A
    content: They have strong bodies.
  - label: B
    content: They may be sick or die.
  - label: C
    content: They feel happy.
  - label: D
    content: They become microplastics.
  group_stem: 'Plastic is used every day. People use it to make bags, bottles, straws,
    and many other things. Plastic is cheap and strong, but it is also a big problem.

    Plastic does not break down naturally. It stays in the ground or in the ocean
    for a long time. Many animals often mistake plastic for food. When they eat it,
    they can get sick or even die.

    Some plastic breaks into tiny pieces called microplastics. Fish and birds eat
    them. Later, people eat the fish, so plastic can get into our bodies, too.

    We can help the Earth by using less plastic. We can bring our own bags and bottles.
    We can also use metal straws or paper ones. Every small action helps.

     break down 分解 naturally 自然地 mistake 誤認 tiny 微小的 less 較少的'
