    content: 丙:傳統上男主外、女主內是一種公平的分工，現代社會也應該這樣，這是符合「責任承擔」的原則。
  - label: D
    content: 丁:偏鄉居民在教育和醫療資源上遠不如都市，從「需求滿足」來看，這是不公平的現象。
