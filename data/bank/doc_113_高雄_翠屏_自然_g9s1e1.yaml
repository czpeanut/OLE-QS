- id: doc_113_高雄_翠屏_自然_g9s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '戰場上士兵為了避免被敵軍瞄準，通常不會以直線前進，而會以之字形的路線前進。圖(一)實線表示直線的甲路線，虛線表示之字形的乙路線，由 X 點移動至
    Y 點採用甲、乙兩種不同路線的位移與路徑長關係，下列何者正確？

    | | 位移大小 | 路徑長 |

    |---|---|---|

    | (A) | 甲＝乙 | 甲＝乙 |

    | (B) | 甲＝乙 | 甲＜乙 |

    | (C) | 甲＜乙 | 甲＝乙 |

    | (D) | 甲＜乙 | 甲＜乙 |'
  options:
  - label: A
    content: 位移大小：甲＝乙，路徑長：甲＝乙
  - label: B
    content: 位移大小：甲＝乙，路徑長：甲＜乙
  - label: C
    content: 位移大小：甲＜乙，路徑長：甲＝乙
  - label: D
    content: 位移大小：甲＜乙，路徑長：甲＜乙
