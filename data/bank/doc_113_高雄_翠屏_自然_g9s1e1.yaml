- id: doc_113_高雄_翠屏_自然_g9s1e1_s1_49
  section: 1
  number: 49
  type: single
  page: 10
  stem: 開採出玫瑰鹽的鹽礦，其形成過程和下列哪一種岩石最類似？
  options:
  - label: A
    content: 花岡岩：冷卻凝固
  - label: B
    content: 片岩：變質作用
  - label: C
    content: 大理岩：變質作用
  - label: D
    content: 石灰岩：沉積作用。
  group_stem: '(題組)你有看過裝飾用的鹽燈嗎？如果你也曾看過料理用的玫瑰鹽，應該會發現鹽燈的色澤和玫瑰鹽的顏色十分接近（圖一）。玫瑰鹽和鹽燈都是由類似的礦物組成，它們都是從鹽礦中開採出來的。鹽礦是一種沉積岩，又稱為蒸發岩（註1），由封閉的鹹水水域蒸發形成，這是乾燥地區常見的沉積作用。玫瑰鹽約97％是氯化鈉，約3％是雜鹵石（註2），其紅色或粉紅色調是來自微量的雜質，例如氧化鐵、鎂、銅等。許多廣告號稱玫瑰鹽有多種微量元素，對健康極好，但目前沒有足夠的科學證據，能夠證明長期食用玫瑰鹽對人體有益。

    玫瑰鹽主要產自巴基斯坦的烏拉鹽礦（Khewra salt mine），歷史悠久，是著名的旅遊景點，每年約生產35 萬公噸的岩鹽。

    圖（一）鹽燈與玫瑰鹽

    （註1）蒸發岩：是一種沉積岩，由水溶液蒸發析出結晶的礦物組成，常見礦物有岩鹽（氯化鈉結晶）、石膏、方解石、雜鹵石等。

    （註2）雜鹵石：海水蒸發形成的礦物，是鉀、鈣和鎂的硫酸鹽類，結合水分子所組成。化學式為$K_{2}Ca_{2}Mg(SO_{4})_{4}\cdot 2H_{2}O$。

    請回答下列第49~50 題：'
