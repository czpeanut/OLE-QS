- id: doc_113_高雄_翠屏_自然_g9s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: '吉伊和小八分別對牛頓第一運動定律提出自己的見解，其敘述如下：

    吉伊：若靜止的物體不受外力作用，則此物體會一直維持靜止。

    小八：若運動中的物體所受合力為零，則此物體會一直作等速度運動。

    關於兩人的敘述下列何者正確？'
  options:
  - label: A
    content: 兩人均合理
  - label: B
    content: 兩人均不合理
  - label: C
    content: 只有吉伊合理
  - label: D
    content: 只有小八合理
  tags:
