  section: 1
  number: 38
  type: single
  page: 1
  stem: 庭恩向網路賣家晏寧下訂一款限量巧克力，收到貨當天便開心地吃下肚。隔天整理包裝垃圾時才發現巧克力早已過期。過期巧克力引發強烈腸胃炎，令庭恩需住院靜養一星期，因此向賣家晏寧要求賠償，但賣家晏寧卻置之不理，甚至避不見面。於是庭恩決定向法院提出訴訟，要求賣家晏寧負起法律上的責任。關於上述事件，下列敘述何者正確？
  options:
  - label: A
    content: 賣家晏寧隱瞞巧克力是過期品的訊息，違反誠實信用原則
  - label: B
    content: 庭恩為這場訴訟的被告
  - label: C
    content: 法官應主動介入調查與蒐證
  - label: D
    content: 律師會參酌雙方所提出的證據，審理後依法作出判決。
