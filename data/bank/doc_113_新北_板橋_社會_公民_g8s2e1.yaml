- id: doc_113_新北_板橋_社會_公民_g8s2e1_s1_37
  section: 1
  number: 37
  type: single
  page: 1
  stem: 信文與俊希因生意往來簽訂契約，若信文未履行契約，依《民法》規定，俊希應如何主張自己的權利？
  options:
  - label: A
    content: 俊希不得主張解除契約，但可依損失要求賠償
  - label: B
    content: 俊希得解除契約，並依損失要求賠償
  - label: C
    content: 俊希得解除契約，但不可要求損害賠償
  - label: D
    content: 俊希得解除契約，即使無損失仍可要求賠償。
