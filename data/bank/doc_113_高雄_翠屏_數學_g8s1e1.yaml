- id: doc_113_高雄_翠屏_數學_g8s1e1_s2_10
  section: 2
  number: 10
  type: single
  page: 2
  stem: '求$\sqrt{10}$的近似值時，已知

    $2^{2} = 4, 3^{2} = 9, 4^{2} = 16, (3.1)^{2} = 9.61, (3.2)^{2} = 10.24, (3.3)^{2}
    = 10.89, (3.4)^{2} = 11.56$

    $(3.15)^{2} = 9.9225, (3.16)^{2} = 9.9856, (3.17)^{2} = 10.0489, (3.18)^{2} =
    10.1124$,

    $(3.161)^{2} = 9.991921, (3.162)^{2} = 9.998244, (3.163)^{2} = 10.04569, (3.164)^{2}
    = 10.01896$,

    小愛的說法：$3 < \sqrt{10} < 4$ ，小川的說法：$3.1 < \sqrt{10} < 3.2$，

    小麗的說法：$3.15 < \sqrt{10} < 3.16$，小寺的說法：$3.162 < \sqrt{10} < 3.163$，

    小津的說法：$\sqrt{10} \approx 3.15$(四捨五入取近似值到小數第二位)

    以上那些人的說法是正確的?'
  options:
  - label: A
    content: 小愛、小寺、小津
  - label: B
    content: 小愛、小津
  - label: C
    content: 小愛、小川、小寺
  - label: D
    content: 小愛、小麗
  tags:
