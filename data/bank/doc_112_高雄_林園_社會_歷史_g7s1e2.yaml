  section: 1
  number: 21
  type: single
  page: 1
  stem: "小立同學在瀏覽網頁時，看到了一篇報導：\n  1871 年，琉球王國宮古島民的進貢船，因颱風漂流到臺灣東南海岸八瑤灣，54 人被牡丹社和高士佛社的排灣族人殺害，12\
    \ 人逃出。3 年後，日本因此出兵臺灣，排灣族人憑藉石門隘口天險奮勇抵抗……。\n  ……將殺害琉球人的排灣族人塑造成野蠻民族，讓當地排灣族人多年來承受歷史上的汙名。\n\
    從文中內容判斷，此一事件應是下列何者？(習作P29-1)"
