- id: doc_112_高雄_林園_社會_歷史_g7s1e2_s1_24
  section: 1
  number: 24
  type: single
  page: 1
  stem: 17 世紀，鄭成功領兵渡海擊退外人，取得臺灣統治權。但位於歷史圖二領域範圍的部落聯盟頑強抵抗鄭軍，導致鄭成功等人認為他們受到外人的煽動。由於鄭軍當時尚未攻下安帄就已缺糧，故而下令往北屯墾，就地取糧或種植，因此與該部落聯盟發生激烈衝突，使得鄭軍將領陣亡，一鎮之兵（約五百人）「無一生還者」，後來鄭軍又再度派人以埋伏之計襲殺頭目，使得該部落聯盟在鎮壓下勢力衰微。請問：上文中提到的部落聯盟，其共主應該是指何者？
  options:
  - label: A
    content: 大肚王
  - label: B
    content: 大甲王
