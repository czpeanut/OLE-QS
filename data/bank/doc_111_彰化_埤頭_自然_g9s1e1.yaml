    content: 超抽地下水時，若之後雨季來臨，可以順利補充回到原來水位，使下陷的地層再度回升
  - label: D
    content: 超抽地下水，造成地層下陷，是不可逆的結果
  assets:
  - key: s1_29_f1
    kind: figure
    file: doc_111_彰化_埤頭_自然_g9s1e1/s1_29_f1.png
- id: doc_111_彰化_埤頭_自然_g9s1e1_s1_30
  section: 1
  number: 30
  type: single
  page: 2
  stem: 關於岩石敘述，何者正確?
  options:
  - label: A
    content: 地表最常見的是火山岩
  - label: B
    content: 地殼含量最多的是沉積岩
  - label: C
    content: 變質岩不會在地表出現，因其是在地底深處高溫高壓才能形成
  - label: D
    content: 地球三大岩石種類為，火成岩、沉積岩、變質岩
- id: doc_111_彰化_埤頭_自然_g9s1e1_s1_31
  section: 1
  number: 31
  type: single
  page: 2
  stem: 關於沉積岩，何者錯誤?
  options:
  - label: A
    content: 多為河川上游侵蝕後沉積而成
  - label: B
    content: 是由岩石碎屑膠結而成
  - label: C
    content: 多為層狀構造
  - label: D
    content: 顆粒大小為：礫岩>砂岩>頁岩
- id: doc_111_彰化_埤頭_自然_g9s1e1_s1_32
  section: 1
  number: 32
  type: single
  page: 2
  stem: 關於火成岩敘述，何者正確?
  options:
  - label: A
    content: 容易發現化石
  - label: B
    content: 石灰岩屬於火成岩的一種
  - label: C
    content: 玄武岩顆粒小，安山岩顆粒大
  - label: D
    content: 火成岩可能由岩漿噴至地表產生，亦有可能在地底深處產生
- id: doc_111_彰化_埤頭_自然_g9s1e1_s1_33
  section: 1
  number: 33
  type: single
  page: 2
  stem: 關於合力，何者正確?
  options:
  - label: A
    content: 合力為多個力同時作用下，最後的結果
  - label: B
    content: 物體所受合力為零，表示此物不受任何力作用
  - label: C
    content: 合力為零時，物體加速度不一定為零
  - label: D
    content: 合力為零時，物體一定靜止，若為運動狀態，表示物體有受力的作用
