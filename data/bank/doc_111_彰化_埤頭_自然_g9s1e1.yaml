  section: 1
  number: 34
  type: single
  page: 3
  stem: 關於礦物，何者正確?
  options:
  - label: A
    content: 長石大多為白色或綠色
  - label: B
    content: 石英大多為透明或白色
  - label: C
    content: 雲母有深色及淺紅色
  - label: D
