- id: doc_113_台中_向上_自然_g8s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '在甲、乙、丙三個廣口瓶中，各裝有一種氣體，進行如下表之檢測，若氣體分別為氮氣、二氧化碳和氧氣，則甲、乙、丙三瓶中的氣體成分依次為下列哪一項？


    | 瓶號 | 加水 | 加澄清石灰水 | 助燃性 |

    | :---: | :---: | :---: | :---: |

    | 甲 | 微溶 | 混濁 | 無 |

    | 乙 | 難溶 | 無反應 | 無 |

    | 丙 | 難溶 | 無反應 | 有 |'
  options:
  - label: A
    content: 氮氣、二氧化碳、氧氣
  - label: B
    content: 氧氣、氮氣、二氧化碳
  - label: C
    content: 二氧化碳、氮氣、氧氣
  - label: D
    content: 二氧化碳、氧氣、氮氣。
