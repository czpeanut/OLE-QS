- id: doc_113_台中_向上_自然_g8s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '阿華撿到一枚金屬戒指，想起學過的密度概念，想藉由密度來判斷這枚戒指是由哪一種金屬所製成。他利用天平及排水法測得此枚戒指質量為 26.7 g，體積3
    cm$^{3}$，對照表中密度，你知道阿華撿到的是哪一種戒指嗎？


    | 金屬 | 金 | 銀 | 銅 | 鐵 |

    | :--- | :---: | :---: | :---: | :---: |

    | 密度（g/cm$^{3}$） | 19.3 | 10.5 | 8.9 | 7.9 |'
  options:
  - label: A
    content: 金戒指
  - label: B
    content: 銀戒指
  - label: C
    content: 銅戒指
  - label: D
    content: 鐵戒指。
