- id: doc_113_台中_向上_自然_g8s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: '不鏽鋼皂是一種具有肥皂外型的不鏽鋼。業者宣稱當手上沾滿大蒜、洋蔥等傳統肥皂不易去除的味道時，一邊將手與不鏽鋼皂摩擦一邊以流水沖洗，可以消除部分氣味。小芸設計實驗驗證「不鏽鋼皂能否去除異味」，如表中的組別一和組別二所示。另外她還設計了組別三的實驗，關於組別三的說明，下列何者合理？


    | 組別 | 一 | 二 | 三 |

    | :--- | :---: | :---: | :---: |

    | 實驗物品 | 傳統肥皂 | 不鏽鋼皂 | 不鏽鋼湯匙 |

    | 沾染氣味類型 | 大蒜味 | 大蒜味 | 大蒜味 |

    | 摩擦時間 | 30 秒 | 30 秒 | 30 秒 |

    | 是否以水沖洗 | 是 | 是 | 是 |'
  options:
  - label: A
    content: 組別三作為「不鏽鋼皂能否去除異味」實驗的實驗組
  - label: B
    content: 實驗想驗證縮短沖洗的時間，去除異味的功效是否相同
  - label: C
    content: 實驗想驗證其他形狀的不鏽鋼物品，是否也具有去除異味的功效
  - label: D
    content: 實驗想驗證沾染不同種類的氣味，不鏽鋼去除異味的功效是否相同。
  tags:
