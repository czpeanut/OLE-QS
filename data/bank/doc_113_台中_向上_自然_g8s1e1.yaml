- id: doc_113_台中_向上_自然_g8s1e1_s1_34
  section: 1
  number: 34
  type: single
  page: 3
  stem: '小翔參加科學競賽，桌上僅有下列藥品及器材： 50 mL 燒杯 2 個；10 mL 量筒 1 個（最小刻度＝1 mL）；無刻度滴管 1 隻；密度 1.4
    g/cm$^{3}$ 的甲藥粉 10 g；電子天平；A 液體 10 mL；B 液體 10 mL；水 10 mL。液體的相關資料如附表所示。競賽規定，只能用桌面上的藥品及器材進行實驗，不可自行添加任何器材或藥品，來幫助實驗的進行。則若要「測量」出
    5 克甲藥粉的體積，應使用下列哪種方法？（25℃，1 大氣壓下）


    | 種類 | A | B | 水 |

    | :--- | :---: | :---: | :---: |

    | 密度（g/cm$^{3}$） | 0.7 | 1.6 | 1 |

    | 對甲藥粉的溶解度（g/100 g 溶劑） | ＜0.001 | 100 | 5000 |'
  options:
  - label: A
    content: 用量筒量取 0.1 mL 的水，加入 5 g 的甲藥粉，配成飽和溶液後，再加入剩餘的甲藥粉，測量水增加的體積，即為 5 g 甲的體積
  - label: B
    content: 用量筒量取 1 mL 的 B 液體，加入 1 g 的甲藥粉，配成飽和溶液後，再加入 5 g 的甲藥粉，測量 B 液體增加的體積，即為 5
      g 甲的體積
  - label: C
    content: 用量筒量取 2 mL 的 A 液體，加入少量的甲藥粉，看到沉澱物後，再加入 5 g 的甲藥粉，測量 A 液體增加的體積，即為 5 g 甲的體積
  - label: D
    content: 用量筒量取 10 mL 的 A 液體，加入少量的甲藥粉，看到沉澱物後，再加入 5 g 的甲藥粉，測量 A 液體增加的體積，即為 5 g 甲的體積。
