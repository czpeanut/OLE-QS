  stem: '宜蘭剛滿十八歲的蕭姓男子正就讀高中三年級，他看到廣告發現有「0 元買車」方案非常心動。所謂0 元買車也就是以全額貸款購入一輛十一萬餘元的機車，分期三年、每月約繳三千元，三年總支付金額多出原本的車價近兩萬元。像「0
    元買車」這類契約，多搭配高利率，年輕人若沒有穩定工作，往往連第一期都付不出，若家庭無法支援，信用破產後將後悔莫及。蕭姓男子的家長得知後表示，目前並未與兒子同住，此前知道兒子有意買車，也打電話給車行明確告知「不同意兒子買車」，從頭到尾未曾在場，但現在他也無可奈何......。

