- id: doc_113_新北_永和_社會_g8s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '瑞士空氣品質追蹤業者IQAir 公布2023 年世界空氣品質報告，指出百大空污城市有99 個位於亞洲；空汙影響層面甚廣，其中所含懸浮微粒一旦進入人體，可能會造成許多疾病，對於危害人體健康的長期影響不容忽視，今日東北亞與東南亞皆深受霾害之苦。在東北亞，科學家分析日、韓兩國
    PM 2.5 的成因，發現日、韓的空氣汙染，其境外移入的部分不容小覷，其中從中國移入南韓的空汙佔 32%；而在東南亞，印尼政府鼓勵民間種植高價值的經濟作物，而砍伐蘇門答臘島的森林，這些砍燒森林所產生的煙霧，也因為風向飄向周遭區域，同時也嚴重影響新加坡與馬來西亞等國的空氣品質。請問：根據上文所述，東北亞與東南亞各地，導致霾害的季節與風向，分別為何？  (L1+跨冊)


    | 地區 | (A) | (B) | (C) | (D) |

    | :---: | :---: | :---: | :---: | :---: |

    | 東北亞 | 夏季:東南風 | 夏季:東南風 | 冬季:西北風 | 冬季:西北風 |

    | 東南亞 | 夏季:西南風 | 冬季:東北風 | 夏季:西南風 | 冬季:東北風 |'
  options:
  - label: A
    content: 東北亞：夏季:東南風；東南亞：夏季:西南風
  - label: B
    content: 東北亞：夏季:東南風；東南亞：冬季:東北風
  - label: C
    content: 東北亞：冬季:西北風；東南亞：夏季:西南風
  - label: D
    content: 東北亞：冬季:西北風；東南亞：冬季:東北風
