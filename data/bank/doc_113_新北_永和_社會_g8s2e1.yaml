    111 年憲判字第2 號強制道歉案

    民法第195 條第1 項後段規定：「其名譽被侵害者，並得請求回復名譽之適當處分。」

    至於何謂回復名譽之適當處分？釋字656 號解釋的結論導致後續在司法實務上發展出「強制道歉」的方式，要求侵害名譽權的加害人以自己的名義，公開表達歉意。以登報或在自己的臉書、IG
    上張貼法院要求的道歉啟事。

    道歉本該是心甘情願；但強制道歉則未必。會動用到法院判決來要求，不是心甘情願的道歉真的可以填補損害嗎？所以甲組成乙，以審理的形式做出丙，變更了656 號解釋的結論並宣告違憲。甲表示強制道歉涉及言論自由的限制，也涉及憲法保障的思想自由，皆為憲法保障最基本之人性尊嚴，應受絕對保障，不容國家機關以任何方式予以侵害。'
