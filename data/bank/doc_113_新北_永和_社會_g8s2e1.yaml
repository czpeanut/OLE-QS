  stem: '農曆春節過後，某則新聞報導指出，一名6 歲的男童瞞著父母，花費5000 元的壓歲錢購買遊戲點數，父母事後發現後希望店家退款，導致消費糾紛。根據民法規定，下列何人的行為能力與該生相同？(L2)


