  stem: 下列選項中，哪一文句的主語是陳生？
  options:
  - label: A
    content: 其鄉有陳生
  - label: B
    content: 訶責甚厲
  - label: C
    content: 夏夜袒裼睡廡下
  - label: D
    content: 彼蠢蠢如鹿豕
  group_stem: "（四）\n    南宮鮑敬之先生言：其鄉有陳生，讀書神祠。夏夜袒裼睡廡①下，夢神召至座前，訶責甚厲。陳辯曰：「殿上先有販夫數人睡，某避於廡下，何反獲愆②？」神曰：「販夫則可，汝則不可。彼蠢蠢如鹿豕，何足與較？汝讀書而不知禮乎？」蓋《春秋》責備賢者，理如是矣。故君子之于世也，可隨俗者隨，不必苟異；不可隨俗者不隨，亦不必苟同。世於違禮之事，動曰某某曾為之。夫不論事之是非，但論事之有無，自古以來，何事不曾有人為之，可一一據以藉口乎？\
    \                                                                ――《閱微草堂筆記》\n\
    ※註  ①廡：ㄨˇ，廳堂兩側的廂房      ②愆：ㄑ一ㄢ，罪過。"
