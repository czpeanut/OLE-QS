- id: doc_113_高雄_左營_國文_g9s1e3_s4_42
  section: 4
  number: 42
  type: single
  page: 6
  stem: 根據上文，下列敘述何者正確？
  options:
  - label: A
    content: 廣播剛進入台灣時，想收聽廣播的聽眾必須購買唱片和轉盤器，就能在家收聽廣播
  - label: B
    content: 廣播剛進入台灣時，每天二十四小時都有不同的廣播節目在輪番放送，任君挑選
  - label: C
    content: 一九五Ｏ年代起，地方政府致力於擴大民眾接觸音樂的機會，以促進國民身心健康
  - label: D
    content: 黑膠唱片比蟲膠唱片更堅硬更易碎，所以蟲膠唱片相較於黑膠唱片更為珍貴值得收藏
  group_stem: "（二）\n自從一九二Ｏ年底美國匹茲堡KDKA 電台正式開播開始，全世界就進入了無線通訊的廣播新時代，這項技術也快速地傳到亞洲。\n廣播剛進入台灣時，是官方在台北的總督府(今總統府)內安裝了一台小型的放送機，台灣各地則共有十六個受信機，想收聽廣播的聽眾必須先購買收音機，再辦理收音機登記並繳交月費，然後才能在家收聽廣播。也因為有設備費和「月租費」，一開始能收聽廣播的人仍以家有財產的知識份子為主。\n\
    一般人雖然無法負擔聽廣播的花費，也沒有餘錢購買唱片和轉盤器，但日常逛街時經過的店家、「街頭藝人」的表演、在稍有氣氛的餐飲店或休閒旅館內，以及咖啡店、藝女戶等等，都有機會聽到來自唱片或廣播的音樂。\n\
    除了深夜時段，每天從早到晚幾乎都有不同的廣播節目在輪番放送，有購買收音機的人可以向電信公司索取「每月節目表」，收聽想聽的節目。廣播節目的內容除了報導性的新聞和知識教育，還有娛樂性節目如日本音樂、演藝唸唱、西洋古典音樂等等，也造就了台灣流行歌的出現。\n\
    除了收聽電台廣播和買唱片回家欣賞，要是沒辦法負擔唱片或播音設備該怎麼辦呢？\n戰後一般民眾可以接觸到音樂的方式其實不少，像是在唱片行內聽歌、去咖啡店或舞廳、看歌舞團或歌技團的表演等；在軍營中當兵也有很多機會欣賞音樂，因為當年以音樂活動來勞軍可謂相當頻繁。\n\
    另外，地方政府鑒於「音樂可以薰陶身心，促進國家國民之身心健康」，自一九五Ｏ年代起，於周末在各地救國團、民眾服務處、公園、高級學校、圖書館，尤其是大型圖書館像台中圖書館，舉行「唱片欣賞會」，內容除了流行歌曲，也包括了京劇、古典音樂和美國音樂。\n\
    有趣的是，我們常以為過去是黑膠唱片的時代，實際上在黑膠唱片出現之前，還有一種由東南亞「蟲膠蟲」吐出分泌物製作而成的蟲膠唱片，比黑膠唱片更堅硬更易碎，非常不容易保存。如果家裡還有蟲膠唱片請千萬要好好收藏，那可是非常珍貴的寶貝。\n\
    \                           ――節錄自《沒有電視的年代：阿公阿嬤的生活娛樂史•就是要聽音樂》"
