  stem: 關於本文所要表達的意思，下列敘述何者正確？
  options:
  - label: A
    content: 有道之士只要能涵養自己的學識智慧，懷瑾握瑜，有朝一日必能大展長才，為世所用
  - label: B
    content: 作者的寓言故事中，「酤酒者」比喻國君，「猛狗」比喻權臣，「孺子」代表有道之士
  - label: C
    content: 國家的領導者必須具備卓越的智慧和洞察力，有識人之明，才能知人善任，安邦定國
  - label: D
    content: 一個國家只要內有才智兼備的文臣，外有忠信勇猛的武將，毋須權謀之術便可臻於強盛
  group_stem: "（三） \n    宋人有酤①酒者，升概②甚平，遇客甚謹，為酒甚美，縣③幟甚高，然不售，酒酸。怪其故，問其所知閭④長者楊倩。\n  \
    \  倩曰：「汝狗猛耶？」曰：「狗猛，則酒何故而不售？」曰：「人畏焉。或令孺子懷錢挈壺罋而往酤，而狗迓而齕之，此酒所以酸而不售也。」\n    夫國亦有狗，有道之士懷其術而欲以明萬乘之主，大臣為猛狗，迎而齕之，此人主之所以蔽脅，而有道之士所以不用也。\
    \                                                      ――節錄自《韓非子•外儲說右上》\n  ※註\
    \  ①酤：ㄍㄨ，賣酒。     ②升概：量酒。     ③縣：通「懸」     ④閭：鄉里"
