- id: doc_113_高雄_左營_國文_g9s1e3_s4_49
  section: 4
  number: 49
  type: single
  page: 7
  stem: 有關文中對於「刀魚」的敘述，下列何者最適當？
  options:
  - label: A
    content: 李漁在《閒情偶寄》中，提及刀魚之味最鮮
  - label: B
    content: 作者喜歡拿刀魚來熬湯，魚湯拌麵格格外鮮甜
  - label: C
    content: 維京人喜歡將刀魚做成魚排料理，以利於食用
  - label: D
    content: 刀魚之名，是得之於清明節後，細刺漸粗有如刀口
  group_stem: "（五）\n    我一直覺得，從會不會吃魚就可以看出一個人懂不懂吃。朋友之中，講究吃的，多懂得吃魚；不愛吃魚的，卻很少有稱得上懂美味之人。為什麼會這樣呢？也許如俗話所說：「懂得吃魚的人比較聰明。」這話從何說起？大概和吃魚比吃肉費心思有關，想想大塊吃肉，即使是啃雞鴨翅膀，難度也比吃魚時跟細刺奮鬥要容易多了。一直到如今，在飲食上較世故的民族，如東方人、拉丁人，都以善吃全魚著稱，吃全魚可是要會吐刺的；飲食文化天真的民族，如盎格魯撒克遜人、維京人等，則只會吃魚排，專選好去頭尾骨刺的魚，如鮭魚、鰈魚、鱈魚等等。\n\
    \    李漁在《閒情偶寄》的〈飲饌部〉中，大談吃魚的講究，就在一鮮字，但偏偏愈見鮮味的魚，刺愈多。我生平吃過最鮮的魚是刀魚，刀魚全身是刺，尤其在清明前，細刺密布如網，在此時蒸來吃有股獨特的沖鮮味，一吃難忘。在細針中挑細薄的魚肉吃，愈吃愈有味，鮮味繞鼻不去，吃完魚後用魚汁拌光麵，更是滋味纏綿。此魚若在清明後吃，細刺日漸粗大，最後會像刀口般扎人，因此才叫刀魚。\n\
    ――節錄自韓良露〈魚之至味在鮮〉"
