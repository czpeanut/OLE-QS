- id: doc_113_台中_居仁_自然_g8s1e2_s2_34
  section: 2
  number: 34
  type: single
  page: 4
  stem: "當光波從一種介質傳播到另一種具有不同折射率的介質時，會發生折射現象，其入射角與折射角之間的關係，可以用司乃耳定律來描述波在不同介質傳遞時，會因為速率不同而發生折射，並且與界面法線的夾角滿足如下關係：\n\
    $n_{1}\\sin\\theta_{1} = n_{2}\\sin\\theta_{2}$\n其中$n_{1}$、$n_{2}$分別是兩種介質的折射率，$\\\
    theta_{1}$、$\\theta_{2}$代表入射角和折射角。\n   在戶外教學時，為了展現聲波的司乃耳定律，隊輔拿出了一顆充滿二氧化碳的大汽球，兩個人在氣球的兩端講話，請依照圖表的數據來判斷，聲音在經過折射後，請忽略反射和氣球彈性吸收的損耗)，對面同學聽到的聲音會如何表現?\n\
    \n| 數據 | 密度 kg/m$^{3}$ | 折射率 | 速率 m/s | 分子量 |\n| :--- | :--- | :--- | :--- | :---\
    \ |\n| 空氣 | 1.225 | 1.0003 | 343 | 28.8 |\n| 二氧化碳 | 1.98 | 1.00045 | 259 | 44\
    \ |"
  options:
  - label: A
    content: 聲音更集中導致比原本沒氣球時更大聲
  - label: B
    content: 聲音更分散居然比原本沒氣球時更小聲
  - label: C
    content: 聲音變得更高音，太神奇了
  - label: D
    content: 聲音變得更低音，好好玩
