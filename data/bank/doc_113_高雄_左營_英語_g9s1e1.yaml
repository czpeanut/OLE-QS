    Claire: Have you been to this restaurant before? It’s one of my favorites.

    Patrick: Yes, I’ve eaten here before. The food is great. Nobody can make pizzas
    like they do!

    Claire: (waving to the waiter) That’s true. They’ve been one of the most successful
    pizza places in island for years.

    Waiter: Hi, have you decided on your order yet?

    Claire: Yes, we’d like to have two 5-inch Margherita pizzas.

    Waiter: Of course. Coming right up!

    (15 minutes later)

    Waiter: Here is your order. Enjoy your meal!

    Claire: Excuse me, we ordered two 5-inch Margherita pizzas, but you’ve just brought
    us a 9-inch pizza.

    Waiter: Oh, I’m so sorry about that! Let me check with the cook. I’ll be right
    back.

    (5 minutes later)

    Waiter: Our new cook has gotten two orders wrong today. Sorry about that, and
    we need to give you more pizza for ten inches.

    Claire: Ten inches?

    Waiter: Yes, we have to give you one more inch of pizza — five and five makes
    ten.

    Claire: Oh, no. You just made another mistake—this time with your pizza math!
    Although you gave us only one 9-inch pizza, it is bigger than two 5-inch pizzas!

