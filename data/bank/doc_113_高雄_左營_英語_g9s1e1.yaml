  section: 2
  number: 17
  type: single
  page: 3
  stem: Which is true?
  options:
  - label: A
    content: The owner of the cat doesn’t love it.
  - label: B
    content: The owner of the cat didn’t let it go out.
  - label: C
    content: The little white cat kept itself clean all the time.
  - label: D
    content: The little white cat came home at last.
  group_stem: '(題組17-18)

    My little white kitten’s asleep on my knee;

    As white as the snow or the lilies is she;

    She wakes up with a purr

    When I touched her soft fur:

    Was there ever another white kitten like her?


    My little white kitten now wants to go out

    And play, with no one to watch her about;

    “Little kitten,” I say,

    “Just an hour you may stay,

    And be careful in choosing your places to play.”－


    But night has come down, when I hear a loud “mew”

    I open the door, and my kitten comes through;

    My white kitten! Ah me!

    Can it really be she


    This bad-looking, beggar-like cat that I see?

    What ugly, dirty lines on her side and her back!

    Her nose, once as pink as a rosebud, is black!

    Oh, I very well know,

    Though she does not say so,

    She has been where white kittens mustn’t go.


    If little good children intend to do right,

    If little white kittens would keep themselves white,

    It is important that they

    Should this rule obey,

