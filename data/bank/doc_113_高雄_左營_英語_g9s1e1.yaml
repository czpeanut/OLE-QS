  group_stem: '(題組13-14)

    After the successful 2024 Summer Olympics, many people are much more interested
    in France. Now it is the country of beauty, fashion, food, and even sports. More
    than these, lots of things in your daily life are also from here. Where did the
    first hairdryer, paper machine, hot air balloon, and bikini come from? The French
    gave them to the world. They even gave the USA the Statue of Liberty. However,
    French fries have a different history. The earliest French fries were from Belgium
    along the Meuse River in the late 17th century. It was common for people in the
    area to catch and fry fish, but that was difficult when the river froze in the
    winter. When they could not catch fish for food, they would cut potatoes into
    long thin sticks and fry them. During World War I, American soldiers in Belgium
    tasted this delicious food for the first time. They called these fried potatoes
    “French fries”because French was the main language there. They also took the food
    back to the USA. Since then, French fries have become popular all over the world.
    Next time when you’re eating them, remember France doesn’t give them to us although
    they’re called “French” fries.

