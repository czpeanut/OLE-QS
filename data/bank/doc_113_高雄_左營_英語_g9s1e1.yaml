    stereotypes. In many movies, women are weak and helpless. They often need _____37_____(save)
    by men. Also, they are usually shown as wives, mothers, and girlfriends. Their
    value is often decided by their husbands, children, and boyfriends. What’s more,
    men are usually ____38____(see) at work. They usually work as engineers, lawyers,
    and businessmen. On the other hand, women are often ____38____(see) to do housework
    at home or chat with friends at restaurants.

    You may ask, "Haven’t we ____39_____(have) more and more powerful women on screen?"
    To be honest, modern movie roles for women are still limited to date.  ____40____(break)
    the stereotypes about women, we should present different kinds of powerful women
    on screen. That way, when young girls ____41____(see) them, they will soon follow
    suit and know it is possible _____42_____(do) something different. For example,
    they may study science, start a business, or save the planet.

    Movies are not only about helping people dream but also about changing things
    and making people _____43_____(think) about their futures.

