- id: doc_111_彰化_福興_國文_g9s1e2_s1_39
  section: 1
  number: 39
  type: single
  page: 3
  stem: 「大雪三日，湖中人鳥聲俱絕」一句，作者想藉此表達什麼？
  options:
  - label: A
    content: 西湖四周積雪多，寒冷而靜謐
  - label: B
    content: 此地氣候惡劣，難以生存
  - label: C
    content: 湖中生物受災害而暴斃
  - label: D
    content: 驚嘆西湖大雪難得一見
  group_stem: '崇禎五年①十二月，余住西湖。大雪三日，湖中人鳥聲俱絕②。

    是日，更定③矣，余拏④一小舟，擁毳衣⑤、爐火，獨往湖心亭看雪。霧淞（ㄉㄨㄥˋ）沆碭⑥，天與雲、與山、與水，上下一白。湖上影子，惟長堤⑦一痕、湖心亭一點、與余舟一芥⑧、舟中人兩三粒而已。

    到亭上，有兩人鋪氈對坐，一童子燒酒，爐正沸。見余大喜曰：「湖中焉得更有此人！」拉余同飲，余強飲三大白⑩而別。問其姓氏，是金陵⑪客此⑫。

    及下船，舟子⑬喃喃曰：「莫說相公⑭痴，更有痴似相公者。」（張岱〈湖心亭看雪〉）

    ①崇禎五年：崇禎，明思宗的年號。崇禎五年（西元一六三二），當時作者三十六歲。②絕：消失。③更定：已經是初更了。更，音ㄍㄥ。初更，指晚上七點至九點。④拏：音ㄋㄚˊ，同「拿」，牽引，這裡指乘坐。⑤毳衣：羽毛衣。毳，音ㄘㄨㄟˋ，鳥獸的細毛。▲霧淞：因冷而結成的白色結晶。⑥沆碭：音ㄏㄤˋ
    ㄉㄤˋ，白茫茫的樣子。⑦長堤：指橫亙在湖中的蘇堤。⑧芥：音ㄐㄧㄝˋ，小草，比喻細小的東西，這裡作量詞。⑨氍：音ㄓㄢ，毛毯。⑩三大白：三大杯。白，指酒杯。⑪金陵：今南京市。⑫客此：到這裡作客。客，這裡作動詞。⑬舟子：船夫。⑭相公：古時對年輕讀書人及富貴人家子弟的尊稱。'
  lesson_raw:
    title: 湖心亭看雪
    basis: 張岱〈湖心亭看雪〉課文
