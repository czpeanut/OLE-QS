- id: doc_111_彰化_福興_國文_g9s1e2_s1_38
  section: 1
  number: 38
  type: single
  page: 3
  stem: 作者認為大明湖的特徵是安靜樸素。下列何者不是文中舉出來印證的例子？
  options:
  - label: A
    content: 颳風不起洶湧的波濤，下雨沒有混濁的洪流
  - label: B
    content: 垂釣上難得見笙歌喧喧，繞湖岸多半是幽居廢寺，連暮鼓晨鐘也沒有
  - label: C
    content: 坐著小盆向遊客兜賣蓮花的小兒女，也只是拈花示意，並不少著叫著賞賣
  - label: D
    content: 大明湖裡的蝦蟆因為康熙皇帝的金口玉言，從此「守口如瓶」，停止了兩部鼓吹
  group_stem: '大明湖的特徵是安靜樸素。多少名泉的水，又新鮮，又乾淨，不分冬夏晝夜，流進流出，沒有喧聲。冬天不結冰，夏天不咆哮，颳風不起洶湧的波濤，下雨沒有混濁的洪流。垂釣上難得見生歌喧喧，繞湖岸多半是幽居廢寺，連暮鼓晨鐘也沒有，整天是靜悄悄的。水上有一隊一隊的鴦鴦花散單，玩得十分安詳自在。成群的白鷺鷥在波神養氣，誰也不叫一聲。就是坐著小盆向遊客兜賣蓮花的小兒女，也只是拈花示意，並不少著叫著賞賣。當地的諺語說：「湖裡的蝦蟆乾鼓肚②。」以晝夜聒耳，不知趣，不看風色③著名的蛙，到這裡都「守口如瓶」，停止了兩部鼓吹。雖然不一定由於什麼皇帝爺爺的金口玉言，總要算一種難解的奇蹟。在這種寂靜的環境裡，宜於畫畫，宜於寫詩，更適合於哲學家藝術家的深思。齊、魯的先哲們喜歡講「訥於言而敏於行」「吉人之詞寡」「惡夫佞者④」「多言多敗」，在我看都跟大明湖的德性有一脈相通的地方。（節選自梁容若〈我看大明湖〉）

    ②湖裡的蝦蟆乾鼓肚：指大明湖裡的蝦蟆（青蛙），只是鼓起肚子卻不會叫。③風色：情勢的變化。④惡夫佞者：討厭巧言善辯的人。惡，音ㄨˋ，厭惡。佞，音ㄋㄧㄥˋ，能言善道。'
  lesson_raw:
    title: 大明湖
    basis: 梁容若〈我看大明湖〉
