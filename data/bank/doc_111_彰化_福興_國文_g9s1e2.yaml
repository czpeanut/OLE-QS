    ㄉㄤˋ，白茫茫的樣子。⑦長堤：指橫亙在湖中的蘇堤。⑧芥：音ㄐㄧㄝˋ，小草，比喻細小的東西，這裡作量詞。⑨氍：音ㄓㄢ，毛毯。⑩三大白：三大杯。白，指酒杯。⑪金陵：今南京市。⑫客此：到這裡作客。客，這裡作動詞。⑬舟子：船夫。⑭相公：古時對年輕讀書人及富貴人家子弟的尊稱。'
