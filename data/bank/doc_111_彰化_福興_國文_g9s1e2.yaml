- id: doc_111_彰化_福興_國文_g9s1e2_s1_36
  section: 1
  number: 36
  type: single
  page: 3
  stem: 本文中，作者認為《老殘遊記》的動機，是想仿效下列何者之哭泣？(甲)杞婦(乙)湘妃(丙)屈大夫(丁)太史公
  options:
  - label: A
    content: 甲丁
  - label: B
    content: 乙丙
  - label: C
    content: 甲乙
  - label: D
    content: 丙丁
  group_stem: '靈性生感情，感情生哭泣。城崩杞婦①之哭，竹染湘妃②之淚，此有工夫之哭泣也。……有大痛之哭泣又有兩種：以哭泣為哭泣者，其力尚弱；不以哭泣為哭泣者，其力甚勁，其行乃彌遠也。〈離騷〉為屈大夫③之哭泣，〈史記〉為太史公④之哭泣。

    吾人生今之時，有身世之感情，有家國之感情，有社會之感情，有種教⑤之感情。其感情深者，其哭泣愈痛，此洪都百鍊生所以有《老殘遊記》之作也。

    棋局已殘，吾人將老，欲不哭泣也得乎？吾知海內千芳，人間萬豔，必有與吾同哭同悲者焉！（節錄自劉鶚《老殘遊記・自序》）

    ①杞婦：指杞梁之妻。相傳齊國大夫杞梁戰死，其妻於城下大哭十日，城牆為之倒塌。待其夫下葬後，投水而死。②湘妃：指娥皇、女英，相傳為堯之二女，同嫁於舜。後舜不幸身亡，二女傷痛，其淚沾於湘江畔之竹子，便仿成斑痕，「便成江自盡」。③屈大夫：戰國時楚大夫屈原。④太史公：漢司馬遷，曾任太史令，故稱「太史公」。⑤種教：種族宗教。'
