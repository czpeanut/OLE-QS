- id: doc_111_桃園_石門_國文_g8s1e2_s8_13
  section: 8
  number: 13
  type: single
  page: 2
  stem: 「通同字」是指字形不同，但意思相同，可以通用的字，如﹤張釋之執法﹥中「民安所錯其手足」的「錯」通「措」。 請問下列通同字的使用何者錯誤？
  options:
  - label: A
    content: 學而時習之，不亦「說」乎？──悅
  - label: B
    content: 「閑」靜少言，不慕榮利。──嫌
  - label: C
    content: 使騎捕，「屬」之廷尉。──囑
  - label: D
    content: 怕茶房不妥「帖」。──貼
  lesson_raw:
    title: 張釋之執法
    basis: 題幹引用〈張釋之執法〉
- id: doc_111_桃園_石門_國文_g8s1e2_s8_14
  section: 8
  number: 14
  type: single
  page: 2
  stem: 「敬詞」是指語氣恭敬的詞，用來表達對他人的敬意，或是表現說話者謙遜的品德。請問下列敬詞使用何者最為正確？
  options:
  - label: A
    content: 大雄到醫院探望生病的胖虎，真誠地說：「祝您早日康復，金身平安。」。
  - label: B
    content: 小花下班回家途中巧遇靜香，臨別前說：「改日我一定到府上拜訪。」。
  - label: C
    content: 校慶運動會即將開始，校園廣播傳來：「請與會的家長移師到操場，觀賞各項競賽。」
  - label: D
    content: 主席對開會的代表說：「各位有什麼淺見，請當場提出來。」
