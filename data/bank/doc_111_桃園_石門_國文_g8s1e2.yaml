- id: doc_111_桃園_石門_國文_g8s1e2_s8_8
  section: 8
  number: 8
  type: single
  page: 1
  stem: 胡適出版了中國第一本新詩集《嘗試集》，我們都以為提倡科學與民主的大學者胡適也寫出了這樣的情詩：「醉過方知酒濃，愛過方知情重。你不能做我的詩，正如我不能做你的夢。」請問這首詩的涵義和下列何者最相似？
  options:
  - label: A
    content: 早知今日，何必當初。
  - label: B
    content: 如人飲水，冷暖自知。
  - label: C
    content: 塞翁失馬，焉知非福。
  - label: D
    content: 寧為玉碎，不為瓦全。
- id: doc_111_桃園_石門_國文_g8s1e2_s8_9
  section: 8
  number: 9
  type: single
  page: 1
  stem: 胡適的﹤故鄉和家庭﹥中描述：「徽州在舊制時代是個府，治下一共有六個縣。我家世居的績溪縣，便是徽州府裡最北的一縣。從我縣向南去，便是歙縣和休寧縣；向西便是黟縣和祁門縣；祁門之南便是婺源縣。婺源是朱子的家鄉，朱熹原來是在福建出生的，但是婺源卻是他的祖籍。」根據這段文字，下列何者正確？
  options:
  - label: A
    content: 作者的家鄉在朱子家鄉的東方。
  - label: B
    content: 作者的家鄉在朱子家鄉的西方。
  - label: C
    content: 作者的家鄉在朱子家鄉的南方。
  - label: D
    content: 作者的家鄉在朱子家鄉的北方。
- id: doc_111_桃園_石門_國文_g8s1e2_s8_10
  section: 8
  number: 10
  type: single
  page: 2
  stem: 下列關於《史記》的說明，何者錯誤？
  options:
  - label: A
    content: 中國第一本紀傳體通史，作者是西漢的太史令司馬遷。
  - label: B
    content: 記載從傳說中的黃帝到漢武帝年間大約三千年的歷史。
  - label: C
    content: 常以人物傳記的形式來記敘歷史，人物形象鮮明，深刻動人。
  - label: D
    content: 只能以純粹史學的角度來觀賞研究，對其他方面沒有任何影響。
- id: doc_111_桃園_石門_國文_g8s1e2_s8_11
  section: 8
  number: 11
  type: single
  page: 2
  stem: 下列何者是﹤張釋之執法﹥一文所反映的主旨？
  options:
  - label: A
    content: 天子犯法，與庶民同罪，所以漢文帝也要認錯。
  - label: B
    content: 法律之前，人人平等，所以張釋之應依法斷案。
  - label: C
    content: 清官難斷家務事，皇帝的私人糾紛，不管也罷。
  - label: D
    content: 公說公有理，婆說婆有理，張釋之也辦不了此案。
  lesson_raw:
    title: 張釋之執法
    basis: 題幹提及〈張釋之執法〉
