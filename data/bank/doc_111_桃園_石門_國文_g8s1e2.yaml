  - label: C
    content: 錢鋪裡做夥計。
  - label: D
    content: 得急病找大夫。
  lesson_raw:
    title: 差不多先生傳
    basis: 題幹提及〈差不多先生傳〉
- id: doc_111_桃園_石門_國文_g8s1e2_s8_7
  section: 8
  number: 7
  type: single
  page: 1
  stem: ﹤差不多先生傳﹥：「差不多先生的相貌，和你和我都差不多。」這句話的用意最可能是下列何者？
  options:
  - label: A
