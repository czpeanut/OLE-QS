  group_stem: "（一）張釋之列傳      漢 司馬遷 \n    有人盜高廟座前玉環，捕得，文帝怒，下廷尉治。釋之案律盜宗廟服御物者為奏，奏當棄市。上大怒曰：「人之無道，乃盜先帝廟器。吾屬廷尉者，欲致之族，而君以法奏之，非吾所以共承宗廟意也。」釋之免冠頓首謝曰：「法如是足也，且罪等，然以逆順為差。今盜宗廟器而族之，假令愚民取長陵一坏土，陛下何以加其法乎？」文帝與太后言之，乃許廷尉當。\n\
    （注：高廟：祭祀漢高祖劉邦的廟；棄市：殺死後示眾； \n      族：誅殺全族；頓首：磕頭；謝：賠罪； \n      逆順為差：依情節輕重判刑；長陵：高祖的墳墓）"
