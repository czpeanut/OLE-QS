    content: 我的廚藝很厲害，所以老公天天叫外賣。
  - label: B
    content: 輸了你，贏得世界又如何。
  - label: C
    content: 天青色等煙雨，而我在等你。
  - label: D
    content: 你要為我再想一想，我決定愛你一萬年。
  lesson_raw:
    title: 差不多先生傳
    basis: 題幹提及〈差不多先生傳〉
- id: doc_111_桃園_石門_國文_g8s1e2_s8_6
  section: 8
