- id: doc_111_桃園_石門_國文_g8s1e2_s8_1
  section: 8
  number: 1
  type: single
  page: 1
  stem: 陶淵明被譽為「田園詩人之祖」，請問下那一位詩人的詩是受到他的影響而成的？
  options:
  - label: A
    content: 李白：舉杯邀明月，對影成三人。
  - label: B
    content: 杜甫：朱門酒肉臭，路有凍死骨。
  - label: C
    content: 孟浩然：開筵面場圃，把酒話桑麻。
  - label: D
    content: 王之渙：欲窮千里目，更上一層樓。
- id: doc_111_桃園_石門_國文_g8s1e2_s8_2
  section: 8
  number: 2
  type: single
  page: 1
  stem: ﹤五柳先生傳﹥中「曾不吝情去留」的「去留」是偏義複詞。請問以下何者不是偏義複詞？
  options:
  - label: A
    content: 「忘懷」得失。
  - label: B
    content: 擦拭「窗戶」。
  - label: C
    content: 「遠近」馳名。
  - label: D
    content: 一笑泯「恩仇」。
  lesson_raw:
    title: 五柳先生傳
    basis: 題幹提及〈五柳先生傳〉
- id: doc_111_桃園_石門_國文_g8s1e2_s8_3
  section: 8
  number: 3
  type: single
  page: 1
  stem: 元稹的詩：「秋叢繞舍似陶家，遍繞籬邊日漸斜。不是花中偏愛□，此花開盡更無花。」根據文意，□應該填入何字？
  options:
  - label: A
    content: 梅。
  - label: B
    content: 蘭。
  - label: C
    content: 竹。
  - label: D
    content: 菊。
- id: doc_111_桃園_石門_國文_g8s1e2_s8_4
  section: 8
  number: 4
  type: single
  page: 1
  stem: ﹤五柳先生傳﹥的寫作方式，下列敘述何者正確？
  options:
  - label: A
    content: 以自評方式評論五柳先生的德行。
  - label: B
    content: 以諷諭手法規勸世人當安貧樂道。
  - label: C
    content: 仿史傳形式記敘五柳先生的一生。
  - label: D
    content: 以倒敘的寫法記述五柳先生故事。
  lesson_raw:
    title: 五柳先生傳
    basis: 題幹提及〈五柳先生傳〉
- id: doc_111_桃園_石門_國文_g8s1e2_s8_5
  section: 8
  number: 5
  type: single
  page: 1
  stem: ﹤差不多先生傳﹥：「大家給他取個死後的法號，叫他做『圓通大師』」使用了「倒反」的修辭，下列那一句也是？
  options:
