  section: 1
  number: 9
  type: single
  page: 2
  stem: 臺灣的友邦–吐瓦魯是一個由九個環形珊瑚島群組成的島國，位於南太平洋，屬於大洋洲。由於地勢極低，最高點僅海拔四公尺，因此全球暖化造成的海平面上升對吐瓦魯造成嚴峻威脅，是全球遭受全海平面上升威脅最嚴重的國家。請問圖四中哪個島嶼的成因與吐瓦魯相同，將來也可能遭遇此一問題？
  options:
  - label: A
    content: A
  - label: B
    content: B
  - label: C
    content: C
  - label: D
    content: D。
