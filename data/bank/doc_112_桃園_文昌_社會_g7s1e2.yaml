- id: doc_112_桃園_文昌_社會_g7s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 臺灣的公路編號系統基本上由北向南、由西向東按照數字由小至大進行排列，其中單數號為「南北向」，以高速公路為例，國道1 號、國道3 號都是連接南北的「縱向」高速公路。雙數號則為「東西向」路線，主要是連接西部海線與山線的「橫向」高速公路。這樣的單雙號規範不僅僅適用國道，全臺灣各級道路都是採用相同的單雙號來區分通行方向。但是攤開地圖我們會發現，單數號公路不僅較多且里程數遠大於雙數號公路，如省道9
    號總長就超過453 公里。請問臺灣單數號公路較多且距離較長的主要原因為何？
  options:
  - label: A
    content: 山多平原少
  - label: B
    content: 位於板塊接觸帶
  - label: C
    content: 板塊擠壓方向導致
  - label: D
    content: 中央山脈位置偏東。
