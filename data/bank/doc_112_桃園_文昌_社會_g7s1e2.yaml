- id: doc_112_桃園_文昌_社會_g7s1e2_s3_42
  section: 3
  number: 42
  type: single
  page: 5
  stem: 請問資料一應是記錄哪一宗歷史事件？
  options:
  - label: A
    content: 施琅攻臺
  - label: B
    content: 麻豆社之役
  - label: C
    content: 郭懷一事件
  - label: D
    content: 朱一貴事件。
  group_stem: '資料一

    1652 年9 月7 日，漢人準備很大的宴會，所有重要的荷蘭人都被邀請參加，其目的不只要殺他們，還要趁亂佔領熱蘭遮城以成為全島的主人。這項計畫是由名叫「Fayet」的漢人主導，但是他的弟弟「Pauw」非常反對這項計畫因而向熱蘭遮城當局舉報。

    「Fayet」召集16000 人向赤崁前進，但翌日荷蘭上尉Damler 在2000 名土著教友的護衛下，率領120 位荷蘭人進攻敵人。這場動亂持續15 天，有4000
    名男人，5000 名婦女及小孩被殺或被捕。我方除了平原地帶的兩個男人被殺之外，沒死一個人。事後長官獎賞支持我們的土著每人1 尼瓜尼（niqanias）。

    資料二

    《甘治士牧師給臺灣長官努易茲的備忘錄》：福爾摩莎島（指臺灣島）上的居民沒有宗教著作可以將迷信與偶像崇拜傳給下一代，我們可以教他讀和寫，再把精確的宗教觀教給他們……公司應該派遣更多的牧師前來，牧師最好終身在此，或是至少服務10
    年以上，這樣才能精通這裡的語言。

    資料三

    Jacinto Esquivel 是西班牙旦米尼克修道會（Spanish Dominican）的傳教士兼語言學家，他曾以羅馬拼音紀錄淡水地區原住民語言並編成《淡水語辭彙》、《淡水語教理書》兩書。他對淡水、雞籠沿海原住民部落有以下描敘：『……他們都使用一種通用語——即馬賽語（Bazay）——有些地方雖然有他們自己的語言，但都是以馬賽語作為第二語言……』'
