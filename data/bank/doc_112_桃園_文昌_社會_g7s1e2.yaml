- id: doc_112_桃園_文昌_社會_g7s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 南海，越南稱東海，菲律賓稱西菲律賓海，是一個位於東南亞，被中國大陸、臺灣本島、菲律賓群島、馬來群島及中南半島所環繞的陸緣海，西太平洋的一部分。海域面積有350
    萬平方公里，其中有超過200 個無人居住的島嶼和岩礁，由北而南區分為東沙、西沙、中沙、南沙四個群島，這些群島被合稱為南海諸島。南海諸島中，臺灣控制有東沙群島的東沙島，以及南沙群島唯一有淡水的太平島，目前兩島均有機場可供運輸機起降。太平島距離高雄港1600
    公里，且面積只有0.51平方公里，但還是我國在南海發展的重要基地，是因為這些小島具有何種價值？
  options:
  - label: A
    content: 可興建商業港口
  - label: B
    content: 可開發農牧業用地
  - label: C
    content: 可進行海水淡化工程
  - label: D
    content: 可延伸經濟海域範圍。
