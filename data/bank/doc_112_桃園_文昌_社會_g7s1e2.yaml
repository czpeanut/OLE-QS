  stem: 近期由金鐘影帝吳慷仁領銜主演的台劇《有生之年》在Netflix 上播出，引發網友熱議。故事核心圍繞「家庭」，讓不少人在看劇時因「情節貼近生活」而產生共鳴，並表示戲裡對話都很日常，就像每天家裡會聽到的對話。故事由吳慷仁所飾演的大哥高嘉岳返家生活開始。家中原有感情不和睦、正猶豫離婚的老夫妻高正隆和陳麗英，以及弟弟高嘉凱。由鄭元暢所飾演的二哥高嘉揚雖是老夫妻收養來的，卻也是最聰明、最貼心、最孝順的一位。在劇中，二哥高嘉揚育有一子高丞佑，並已在外成家立業。若僅根據上文描述做判斷，高家屬於下列何種家庭？
