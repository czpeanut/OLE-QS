- id: doc_112_高雄_林園_國文_g7s2e1_s4_3
  section: 4
  number: 3
  type: single
  page: 1
  stem: '下列關於〈負荷〉詩意的說明，正確選項為何？

    (甲)「絢麗的晚霞」及「燦爛的星空」等指的是作者曾有過的理想與抱負

    (乙)「因為你們仰向阿爸的小臉／透露更多的期待」說明了作者不再逗留的原因是為了孩子們

    (丙)以「將阿爸激越的豪情／逐一轉為綿長而細密的柔情」表示孩子用柔情軟化剛強的父親

    (丁)「就像阿公和阿媽／為阿爸織就了一生／綿長而細密的呵護」此句意謂父母對子女的愛是世代相傳的'
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲乙丁
  - label: C
    content: 甲丙丁
  - label: D
    content: 乙丙丁
  lesson_raw:
