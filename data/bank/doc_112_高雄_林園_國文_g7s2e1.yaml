- id: doc_112_高雄_林園_國文_g7s2e1_s5_9
  section: 5
  number: 9
  type: single
  page: 4
  stem: 上文中，作者為何無法向母親示愛？
  options:
  - label: A
    content: 難以啟齒
  - label: B
    content: 令人不齒
  - label: C
    content: 咬牙切齒
  - label: D
    content: 不足掛齒
  group_stem: "二、\n   一日，我教完早上四節的課，又趕著下午兩點去當學生。在驅車回家的途中，我想到這些日子來，每次急慌慌踏進家門，母親總會及時端出熱騰騰的新鮮飯菜，相較於以往的潦草的微波餐，有母親在的日子，實在是太幸福了。而我儘管早就有這樣\
    \ orange 的感覺，為什麼從來未曾向母親表達內心的感受呢？我不是常常因為女兒的甜言蜜語而覺得精神百倍嗎？難道我的母親就不想聽她女兒的感謝嗎？我是不是應該學學女兒，勇敢地向母親「示愛」呢？\n\
    \  車程滿長的，我有足夠的時間來培養勇氣。在我的生命歷程中，從來沒有向長輩示愛的紀錄，開口說這樣的話的確需要時間來培養。我決定一進門就啟齒，然而，當房門一打開，母親綻開笑靨，朝我說：「回來啦！吃飯囉！……」\n\
    \  我突然一陣害羞，因之錯失了最好的時機。我教書十餘年，演講無數次，從來沒有一次像這次這般艱難。我覺得有些懊惱，決定再接再厲。我安慰自己：\n  「沒關係，第一次總是最難的，跨過了這一關，以後就簡單了。」\n\
    \  吃飯時，我一直在伺機行動，以至於顯得有些心不在焉，幾次答非所問，母親奇怪地問我：「你今天是安怎？為什麼奇奇怪怪？」\n  我開始佩服女兒了，怎麼她能把感情表達得如此自然，一點也不疙瘩，而我卻這般費力！\n\
    \  飯吃完了，我還是沒說，心裡好著急，再不把握機會，這句話恐怕就只好永遠藏在心裡了。碗一放，我低頭看著碗，勇敢地說：\n  「媽！我覺得自己好幸福！四十幾歲的人，中午還有媽媽做了熱騰騰的飯菜等我回來吃。」\n\
    \    我頭都不敢抬地很快地說完這話，也不敢去看母親的表情，便急急得奔進書房裡，取了下午要帶的書，倉卒奪門而去，心情比當年參加大專聯考還緊張。\n   那天傍晚從學校回來，母親已在廚房忙著，我悄悄打開門進屋時，發現自從父親過世後就不曾再開口唱歌的母親，居然又恢復了以前的習慣，在廚房裡邊打點著菜，邊唱著歌。"
  answer:
  - A
  answer_source: answer_key_vlm
