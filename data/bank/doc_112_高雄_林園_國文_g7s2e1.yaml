- id: doc_112_高雄_林園_國文_g7s2e1_s5_6
  section: 5
  number: 6
  type: single
  page: 3
  stem: 根據上文所述，下列說明何者錯誤？
  options:
  - label: A
    content: 透過對比的方式，呈現兒子和女兒不同的情感傳達
  - label: B
    content: 女兒時常透過言行讚美媽媽，而兒子吝於說愛
  - label: C
    content: 女兒嘴甜討人喜歡，兒子叛逆愛唱反調
  - label: D
    content: 清楚呈現女兒對母親示愛
  group_stem: "ㄧ、\n    女兒常常對我灌迷湯，我文章寫好了，念給她聽，她總是再三讚嘆：「媽！你寫得真好！你真的好棒！」\n    聽完了還不算，甚至再把稿子拿過去，自己再看一遍，一副愛不釋手的模樣，使我的虛榮心得到最大的滿足。不像她哥哥，只要我寫完一篇文章，欠起身，他一定慌慌張張的逃走，邊逃邊說：「我不想聽，千萬別念給我聽，也別教我看，我受不了了！」」\n\
    \     偶爾買了新衣，在鏡子前顧影自憐，女兒總在一旁全程參與，並不厭其煩地給我打氣：\n 「這件衣服真好看，以後你不穿了，不要送別人，就送給我好嗎？」「這件衣服真好看，以後你不穿了，不要送別人，就送給我好嗎？」\n\
    \ 「哇！媽！你的身材不錯哪！我們同學的媽媽，很多都胖得變形了！」\n     而她的哥哥可就大不相同了。非但讚美的話絕不肯出口，還在一旁潑冷水：\n  「媽！你別信妹妹的甜言蜜語，你要真信了，就是自甘墮落。」「妹，你真會諂媚欸！也不怕閃到舌頭！」他形容妹妹對媽媽是「死忠」，他說：「還不只是『愚忠』，根本是『死忠』，九死而無悔的那一種。」\n\
    \  然而，不管是否是死忠，女兒甜蜜的言語的確讓人頗為受用。我的抽屜裡，充滿了各式各樣的卡片，上面寫著：我好驕傲有一個好媽媽。」\n  「……」\n家裡的白板上，不時地會出現一些道謝或道歉的話，甚至一些示愛的文字。有時，在學校上了一天課，筋疲力竭的回家，看到女兒上學前在白板上留了這樣的話：\n\
    「親愛的爸媽：您們辛苦了！我愛您們！女兒敬上。」\n 霎時間，疲累並消，覺得人生並不全然毫無意義。"
  answer:
  - C
