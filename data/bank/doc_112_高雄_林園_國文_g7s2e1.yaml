  group_stem: "父親持續一種使命感的好習慣，把早餐吃剩的稀飯塗在報紙上，一層一層黏著\n再經過風乾，變成一張很硬的紙板，他就擺在大腿上，靠坐在牆角，藉著微弱的燈光，持續他監獄文學的創作。\n\
