- id: doc_113_台南_復興_自然_g9s1e2_s3_1
  section: 3
  number: 1
  type: single
  page: 4
  stem: 同步衛星的運行高度範圍是？
  options:
  - label: A
    content: 500至2000公里
  - label: B
    content: 2000至1.5萬公里
  - label: C
    content: 3.6萬公里
  - label: D
    content: 3.6萬公里以上。
  group_stem: '現行的人造衛星，根據運行高度，可以分為四種類型：高橢圓軌道衛星：高度在3.6萬公里以上，主要用於技術開發和觀測。同步衛星：距地表約3.6萬公里，繞行速度與地球自轉同步，適用於衛星電視和廣播，3至4顆可覆蓋整個地球。中軌道衛星：距地表2000至1.5萬公里，主要用於GPS導航和定位服務。低軌衛星：距地表500至2000公里，廣泛應用於通訊、遙測、氣象等，具備低延遲和高頻寬的特性，主要支持5G和6G通訊。這些不同種類的衛星各有其特定的用途和優勢，使得衛星通信變得更為普及和高效。


    在俄烏戰爭爆發後，太空服務公司SpaceX透過在距離地表500到600公里間運行之低軌衛星群所組成的「星鏈」(Starlink)，補足了地面網路覆蓋性、移動性不足或遭受破壞的問題，為烏克蘭提供不受地理條件限制的網路服務。星鏈(Starlink)這個巨大的衛星系統，目的在為地球上(甚至是最偏遠的地區)，提供高速互聯網服務。星鏈自2015年開始發展，截至2024年初已發射近6000顆衛星，最終計劃建造12,000顆。


    目前天空有如此多的天體，在繞行地球的軌道上失去功能後，都會成為太空垃圾，最大的包含壞掉的衛星、和大量運送衛星上太空的第二節推進火箭。雖然許多碎片受地球引力慢慢墜入大氣燒毀，但目前仍有超過百萬個的太空垃圾在各個運行軌道以超音速對地球繞行著。這些以超音速飛行的太空垃圾可能摧毀其他衛星，在衛星軌道上製造更多不可預期的致命飛彈。


    資料來源：113學年度分科測驗試題 https://www.ceec.edu.tw 泛科學 https://pansci.asia/archives

    臺灣網路資訊中心 https://blog.twnic.tw/2024/03/21/29653/ Star Walk 2https://starwalk.space/zh-Hant'
