- id: doc_113_新北_福和_國文_g8s2e1_s5_34
  section: 5
  number: 34
  type: single
  page: 5
  stem: 甲文中，劉備說出「君才十倍曹丕，必能安國，終定大事。若嗣子可輔，輔之；如其不才，君可自取」的用意最可能為何？
  options:
  - label: A
    content: 辨別諸葛亮是否具識人之明，可以選賢與能
  - label: B
    content: 揣測諸葛亮有反叛之意，以退為進出言警告
  - label: C
    content: 賞識諸葛亮的雄才大略，故劉備臨死前託孤
  - label: D
    content: 認為諸葛亮應該討伐曹魏，讓蜀漢一統天下。
  group_stem: "【甲】\n  章武①三年春，先主（劉備）於永安病篤②，召丞相亮於成都，囑以後事，謂亮曰：「君才十倍曹丕③，必能安國，終定大事。若嗣子④可輔，輔之；如其不才，君可自取。」亮涕泣曰：「臣敢竭股肱⑤之力，效忠貞之節，繼之以死！」先主又為詔敕後主（劉禪）曰：「汝與丞相從事，事之如父。」\n\
    （改寫自《三國志‧蜀書‧諸葛亮傳》）\n【乙】\n  章武三年春正月，先主召丞相亮於成都。亮省疾於永安。與尚書令李嚴並受寄託。夏四月，先主崩殂⑥於永安宮，時年六十三。\n\
    （改寫自《華陽國志‧劉先主志》）\n【注釋】\n①章武：劉備稱帝時所使用的年號。\n②病篤：病情沉重。篤，音ㄉㄨˇ。\n③曹丕：即魏文帝，曹操的兒子，漢室權臣，逼迫漢獻帝\
    \ 劉協禪位而建立曹魏。\n④嗣子：承繼王位的嫡長子，此指劉禪。\n⑤股肱：指用盡全力輔佐。肱，音ㄍㄨㄥ，胳膊。\n⑥崩殂：死亡。殂，音ㄘㄨˊ。"
