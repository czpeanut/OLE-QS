- id: doc_113_新北_福和_國文_g8s2e1_s5_32
  section: 5
  number: 32
  type: single
  page: 5
  stem: 本詩隱含杜甫沉痛的批評，請問哪一句是透過景色書寫，表達戰亂時人民慘烈的處境？
  options:
  - label: A
    content: 借問新安吏，縣小更無丁
  - label: B
    content: 白水暮東流，青山猶哭聲
  - label: C
    content: 肥男有母送，瘦男獨伶俜
  - label: D
    content: 掘壕不到水，牧馬役亦輕。
  group_stem: '客行新安道，喧呼聞點兵。借問新安吏：「縣小更無丁①？」

    「府帖昨夜下，次選中男②行。」「中男絕短小，何以守王城？」

    肥男③有母送，瘦男④獨伶俜⑤。白水暮東流，青山猶哭聲。

    「莫自使眼枯，收汝淚縱橫。眼枯即見骨，天地終無情！

    我軍取相州，日夕⑥望其平。豈意賊難料，歸軍○7 星散營。

    就糧近故壘，練卒依舊京。掘壕不到水，牧馬役亦輕。

    況乃王師順，撫養甚分明。送行勿泣血，僕射○8 如父兄。」 (杜甫〈新安吏〉)

    【注釋】

    ① 丁：男丁，指成年男子。

    ② 中男：舊時稱不到服役年紀的青少年。

    ③ 肥男：健壯的青少年。在戰亂時仍身形健壯，可推知有良好的照顧。

    ④ 瘦男：瘦弱的青少年。在戰亂時未得父母庇護的少年，可推知父母不在身邊。

    ⑤ 伶俜：飄零孤單的樣子，音ㄌㄧㄥˋ ㄆㄧㄥ。

    ⑥ 日夕：日夜。此指從早到晚。

    ⑦ 歸軍：回歸的部隊，其實是敗軍，但杜甫不忍讓將赴戰場的青少年更害怕，所以說是「歸軍」。

    ⑧ 僕射：官職名，音ㄆㄨˊ ㄧㄝˋ。秦朝時以擅長射箭的人管理事務，漢代後皆設有此官，唐代時相當於宰相的職位。本詩應指當時平亂的郭子儀。'
