- id: doc_113_新北_福和_國文_g8s2e1_s5_30
  section: 5
  number: 30
  type: single
  page: 4
  stem: 這則報導中的新規，可能是為了改善哪一項奧斯卡獎的爭議而提出 ?
  options:
  - label: A
    content: 奧斯卡越來越受市場喜好影響，而不是依靠影片的品質來贏得獎項
  - label: B
    content: 相對於其他電影獎項，奧斯卡常被批評總是充斥著白人男性的面孔
  - label: C
    content: 奧斯卡評審和觀眾的口味漸行漸遠，電影公司只為獲獎而製作電影
  - label: D
    content: 演員獲得奧斯卡獎之因：是評委為了挽回某些評審錯誤而頒發獎項。
  group_stem: "為了推動奧斯卡多元化，主辦方美國影藝學院提出多項改革措施，未來只有滿足新規的影片，才有資格報名最佳影片獎項。\n    總而言之，新規涉及了敘事主題、演員選角、幕後團隊、行銷人員等電影行業各個層面，且著重於提高女性和少數族群的從業率，給相對弱勢群體更多工作機會。例如：要求至少要有一位主角或主要配角是非裔、亞裔、印地安或拉丁等少數族裔；非重要演員中有30％是女性、少數族裔或身障人士；或是影片主題與之相關。而在幕後崗位方面，美國影藝學院也要求要充分照顧到女性、少數族裔和身障人士等，且無論是主流大片廠還是獨立電影公司，這些弱勢人群從實習、培訓開始就要受到足夠重視。這些改革措施將在2024年第96\
    \ 屆奥斯卡時全面生效─也就是說，屆時影片如果不能滿足以上「幕前演出人員多元性」、「幕後工作人員多元性」、「提供少數族裔工作人員實習與培訓的機會」以及「電影行銷與發行團隊的多元化」四類新規的其中兩項，將失去角逐奧斯卡最佳影片獎的資格。\n\
    \    對於美國影藝學院這些推動奧斯卡多元化的改革措施，英國影藝學院表示支持和歡迎。英國影藝學院主席稱：「2016 年起英國電影學院就採用相似標準，之後每年都會擴展。」但在美國社群網路上，這一系列改革引起一些白人群體反彈，曾獲得金球獎和艾美獎肯定的女星柯斯提‧艾利認為這是「政治干涉藝術」，砲轟此舉根本是在左右藝術家的思想，就像在向偉大畫家畢卡索下指導棋一樣愚蠢。\n\
    \    《紐約時報》記者凱爾‧布坎南分析，絕大多數競爭奧斯卡的影片其實都能輕易滿足新規中關於幕後創意團隊和市場行銷方面的要求。《洛杉磯時報》認為，在整個美國面臨種族歧視問題時，奧斯卡新規的意義在於至少能在爭奪最高榮譽的那些影片上，體現出多元化路線。但如果按照演員層面新標準，像戰爭片《1917》、黑幫片《愛爾蘭人》這樣優秀的電影就很難獲得提名，幸好在幕後和其他崗位上留有附加條件，且三年後才強制實行，這讓整個好萊塢有足夠的時間去適應。(改寫自網路新聞)"
