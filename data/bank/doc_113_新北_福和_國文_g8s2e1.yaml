- id: doc_113_新北_福和_國文_g8s2e1_s4_22
  section: 4
  number: 22
  type: single
  page: 3
  stem: "【現代詩文閱讀單題】\n全球創意行動挑戰（英文：Design For Change，簡稱DFC）是一個在印度發起的創意學習活動，為引導中小學孩童透過自主學習發想，尋找身邊的或是社會上的問題，並思考改善方法、解決問題的最佳情境，進而實際行動解決問題的挑戰活動。此挑戰活動2009年自印度發起，2015年已發展至近40個國家，有超過兩千萬名孩童參與過此挑戰。\
    \ （資料來源：《維基百科》）\n    木蘭可以是DFC 的代言人，在流傳已久的樂府民歌〈木蘭詩〉中，木蘭早已為世人示範了：發現問題、思考解決方案、付諸行動解決問題等DFC\
    \ 的實施步驟。\n    請對照〈木蘭詩〉的敘事內容，哪個選項符合「思考改善方法、解決問題的最佳情境」?"
  options:
  - label: A
    content: 阿爺無大兒，木蘭無長兄
  - label: B
    content: 願為市鞍馬，從此替爺征
  - label: C
    content: 旦辭黃河去，暮至黑山頭
  - label: D
    content: 萬里赴戎機，關山度若飛。
  lesson_raw:
    title: 木蘭詩
    basis: 題目引述〈木蘭詩〉
