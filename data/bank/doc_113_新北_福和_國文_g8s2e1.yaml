  stem: '樂府詩依地域性又可分為北朝樂府與南朝樂府，二者間的特色與差異性如下表：


    | | 北朝樂府 | 南朝樂府 |

    | :--- | :--- | :--- |

    | 形式 | 1. 多雜言，而以五言為主<br>2. 語言質樸率真 | 1. 多五言四句<br>2. 多運用雙關隱語 |

    | 風格 | 粗獷豪邁，雄渾遒勁 | 婉約含蓄，清新秀麗 |

    | 主題 | 1. 北朝地景風光<br>2. 征戍情況與生活<br>3.直截了當的愛情<br>4. 豪邁尚武的民族性 | 1. 男女愛戀情思<br>2. 男女離愁別恨
    |


    依據上表內容，下列樂府詩何者屬於「南朝樂府」？ 【古典詩文閱讀單題】'
