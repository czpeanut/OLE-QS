  section: 4
  number: 18
  type: single
  page: 2
  stem: '關於席慕蓉〈渡口〉內容的剖析，下列敘述何者正確？ 【現代詩文閱讀單題】

    讓我與你握別／再輕輕抽出我的手／知道思念從此生根／浮雲白日 山川莊嚴溫柔

    讓我與你握別／再輕輕抽出我的手／華年從此停頓／熱淚在心中匯成河流

    是那樣萬般無奈的凝視／渡口旁找不到一朵可以相送的花／就把祝福別在襟上吧／

    而明日／明日又隔天涯 （席慕蓉〈渡口〉）'
