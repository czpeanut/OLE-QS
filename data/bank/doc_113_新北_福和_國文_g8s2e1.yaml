  stem: "【現代詩文閱讀單題】\n    一般刻板印象常認為「電玩是男生的天下」，電玩遊戲展似乎也反映了電玩遊戲產業以男性為主的現象，會場上男性占多數，許多遊戲是由男性開發人員為男性玩家設計，雖然以女性為主角的遊戲大幅成長，但遊戲主角也仍是男多於女。若能在遊戲中加入更多元的性別角色與觀點，同時鼓勵女性參與電玩的設計，不僅能使遊戲內容更豐富，或許也會翻轉「電玩是男人的專利」的傳統結構。\
