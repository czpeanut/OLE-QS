- id: doc_113_新北_福和_國文_g8s2e1_s4_27
  section: 4
  number: 27
  type: single
  page: 3
  stem: '根據下文，志明平日的為人處事，最符合下列哪一個選項? 【古典詩文閱讀單題】

    志明看到同學考試作弊，他會勇敢地站出來制止，並告訴同學這樣做是不對的，因為做人誠實和公正才是最重要的。與人互動時，恭敬有禮，展現對他人的尊重。而在小組討論中，他會鼓勵其他人發表看法，不會強迫別人接受自己的意見，而是重視每個人的想法。如果跟同學一起做報告，他會認真負責地去做，不會隨意敷衍了事，所以能建立起良好的信譽和人際關係。'
  options:
  - label: A
    content: 君子求諸己，小人求諸人
  - label: B
    content: 其恕乎！己所不欲，勿施於人
  - label: C
    content: 群居終日，言不及義，好行小慧，難矣哉
  - label: D
    content: 義以為質，禮以行之，孫以出之，信以成之。
