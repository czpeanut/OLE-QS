  stem: "【現代詩文閱讀單題】\n    馬謖是蜀漢的智謀之士。據《三國演義》中說，他曾貢獻過兩個很有價值的意見（「攻心為上」與「反間計」），由於過去表現得不錯，所以諸葛亮委託他守街亭的重責。哪知他雖熟讀兵書卻不能活用，守街亭時提出了韓信「置之死地而後生」的戰術方針，結果確實「置之死地」了，卻不能「生」，導致軍事要地街亭失守。當時王平勸他不可在山頂紮營時，馬謖道：「某（我）隨丞相出兵多年，軍國大事，尚問於我，汝奈何相阻也！」\
    \ （改寫自金庸〈談空城〉）\n 根據上文，若你是王平，用下列哪一句話規勸他最適宜？"
  options:
  - label: A
    content: 人才雖高，不務學問，不能致勝
  - label: B
    content: 謙虛受益終不敗，滿招損來悔已遲
  - label: C
    content: 內不欺己，外不欺人，上不欺天
  - label: D
    content: 馬革裹屍當自誓，蛾眉伐性休重說。
