- id: doc_113_新北_福和_國文_g8s2e1_s4_8
  section: 4
  number: 8
  type: single
  page: 1
  stem: 「司馬懿在魏國一直未受重用，官場起起伏伏，好不容易官拜大都督，節制百萬雄兵，焉能不知其權力非來自魏明帝，而是源自諸葛亮。諸葛亮在，魏明帝有所忌憚，必須仰賴司馬懿，諸葛亮用兵越神速，朝廷就得更倚重司馬懿。而以司馬懿的睿智韜略，熟讀史書兵法，豈能不諳『         』的道理。他清楚知道：若攻進西城活捉諸葛亮，自此世間再無敵手，那魏明帝又豈能容司馬懿鼾睡於臥榻之側？」依據此段文字，畫線處最適合填入下列何者？
    【古典詩文閱讀單題】
  options:
  - label: A
    content: 狡兔死，走狗烹；飛鳥盡，良弓藏
  - label: B
    content: 眾惡之，必察焉；眾好之，必察焉
  - label: C
    content: 弓不弦，不可射；人不信，不可交
  - label: D
    content: 力勝貧，謹勝禍，慎勝害，戒勝災。
  tags:
    chapter:
      publisher: 翰林
