  section: 4
  number: 16
  type: single
  page: 2
  stem: "關於【甲】【乙】兩文的分析，下列敘述何者錯誤？ 【現代詩文閱讀單題】\n【甲】\n我願化身石橋／受那五百年風吹／\n五百年日晒／五百年雨淋／\n\
    只願她從橋上經過\n             (電影《劍雨》臺詞)\n【乙】\n如何讓你遇見我／在我最美麗的時刻 為這／\n我已在佛前 求了五百年／\n求祂讓我們結一段塵緣\n\
    \n佛於是把我化作一棵樹／長在你必經的路旁／\n陽光下慎重地開滿了花／\n朵朵都是我前世的盼望\n                   (席慕蓉〈一棵開花的樹〉)"
  options:
  - label: A
    content: 甲文以「石橋」呈現出甘願付出、不求回報的奉獻精神
  - label: B
    content: 乙文以「開花的樹」表現「女為悅己者容」的嬌羞神態
  - label: C
    content: 甲乙兩文都顯現出「我」的殷切期盼及心中的真摯情感
  - label: D
    content: 甲乙兩文都運用轉化，藉祈願來表達「我」的內心情緒。
  lesson_raw:
    title: 一棵開花的樹
