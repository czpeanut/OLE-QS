- id: doc_113_新北_福和_國文_g8s2e1_s5_28
  section: 5
  number: 28
  type: single
  page: 4
  stem: 「海洋是我的稿紙，稿紙亦是我的海洋。」下列何者最符合這段話所強調的寫作理念？
  options:
  - label: A
    content: 海洋是我成名的跳板，我用文字記錄海洋生態點滴
  - label: B
    content: 要是開始寫作，我的文思就如同海洋般浩瀚、廣闊
  - label: C
    content: 討海人的生活辛苦危險，靠書寫才能掙脫苦悶歲月
  - label: D
    content: 海洋是我寫作的靈感，我以寫作表達對海洋的深情。
  group_stem: "廖鴻基是臺灣知名的海洋文學作家，但這條作家之路卻是崎嶇而漫長。他自小在花蓮長大，為了升學因素，國中一度轉學到臺北就讀，因不能適應臺北的生活，所以就又找個藉口轉回花蓮。\n\
    \    就讀花蓮高中時，由於課業壓力沉重，心情苦悶，廖鴻基時常獨自沿著海灘走上好幾個小時，向大海一一傾訴。準備聯考時，校舍鄰近大海，從長廊的盡頭就可遠眺潔白燈塔、蔚藍海洋，他經常望著船隻從花蓮港出航，最終消失在海天交接處。「要當討海人」的念頭，在此時悄悄萌芽。\n\
    \    大學聯考失利後，他到台泥 花蓮廠擔任總務課職員，但待在辦公室的日子枯燥無趣，熬了八年，他毅然辭去水泥廠的工作，遠赴印尼，在當地養蝦場擔任監工。\n\
    \    35 歲那年，廖鴻基正式成為「討海人」─從花蓮港啟航，出海捕魚。要當討海人，先要通過幾個關卡，首先是暈船，出海捕魚常遇到險惡風浪，讓他暈眩嘔吐，膽汁都吐了出來，虛脫得癱軟顫抖，經過了半年才慢慢適應。其次是時差，漁船出發的時間大概都在凌晨時分，無論天氣多麼冷冽，都得依船長指示按時出航。\n\
    \    海上工作除了辛苦之外，更具有危險性，例如若被漁網攪到，或者船頭一偏，就得去做「大海的新郎」。因此對於他的這份工作，父母反對激烈。廖鴻基感嘆回憶，舉辦《討海人》新書發表會時，他的父親在臺下充當讀者舉手發問：「廖先生，你在海上工作這麼愉快，難道不會想到家中父母擔心你嗎？」\n\
    \    對於中年才下海的廖鴻基來說，海上有太多驚奇與震撼。他常在返航之際，靜靜地坐在甲板角落，思索老討海人所說的話，並記下航程中的感動。\n    廖鴻基在寫作的過程中，遇到瓶頸時，就向前輩作家陳列請教。陳列的回答竟是：「就寫啊，寫自己熟悉的事物。」這席話使得廖鴻基茅塞頓開，就從自身最親近的海洋取材，以質樸遒勁的文字，抒發他與大海之間的交流與共舞，揮灑出《討海人》一系列十餘篇文章，為臺灣文壇拓展了「海洋文學」這個新面向。\n\
    \    在討海的五年過程中，廖鴻基意外發現沿海有鯨豚出沒，激發他仔細觀察這群可愛精靈的念頭。此後，他不再出海捕魚，而是出海觀察、記錄鯨豚，而這些出海的「驚豔」與紀錄，便集結成第二本散文集《鯨生鯨世》。\n\
    \    廖鴻基於1998 年組成黑潮海洋文教基金會，除了觀察鯨豚，也推廣海洋生態教育，還擔任解說員。他曾說：「海洋是我的稿紙，稿紙亦是我的海洋。」海洋提供他取之不盡、用之不竭的創作素材，在十餘年內他出版了十幾本海洋題材的作品，量多而質精，向讀者傳遞海洋的豐盛與美麗。(翰林出版社編輯群撰寫)"
