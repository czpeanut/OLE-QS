  stem: 「中國飲食文化豐富多元，就主食而言可分成麵食與米食，製作過程變化多端。例如：有名的刀削麵是山西民家的主食。傳統的做法，是將麵粉加水搓成稍微「乾、硬」的麵糰，再揉成一長圓型的枕頭狀，一手托麵糰一手拿刀，將麵條削入沸騰的鍋內煮。」關於文中提及的刀削麵，下列敘述何者正確？
  options:
  - label: A
    content: 屬於南方的在地美食
  - label: B
    content: 其原料產地雨量較多，屬於水田農業
  - label: C
    content: 原料多分布750mm 等雨量線以北地區
  - label: D
    content: 受到外來移民與文化擴散影響，故傳入此一麵食習慣。
