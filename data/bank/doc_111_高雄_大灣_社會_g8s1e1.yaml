  group_stem: "※題組(二)請依文章回答第30~31 題\n    東周以來，百家爭鳴，被視為是學術思想上的黃金時代，九流十家各有自己的擁護者。各國因富國強兵的政策，延攬各國士人效力，並且加以禮遇，平民有機會透過才能獲得晉用。秦統一天下後，實施挾書律，直到漢朝建立後才廢除。不過隨後由於漢武帝尊崇儒術，並以精通儒家經典作為入仕當官的標準，毫無疑問對學術又是一次打擊。漢代的選官方式，促成東漢末的累世經學，經學世家的出現，到了魏晉之後，平民想要再透過才能當官已難如登天。\n\
    \     註：「挾書律」，規定對私自收藏違禁書籍的人滅族。"
