    content: Small Habits May Change Your Life
  group_stem: 'Do you have the experience of wanting to get better at something but
    not knowing where to start? The secret is "atomic habits"! Atomic habits are small
    changes that help us get a little better each day. How do atomic habits work?

    1. Start small. For example, if you want to get into the habit of reading, start
    with just one or two pages a day.

    2. Make it easy. Keep a book near your bed, so you can get it as soon as possible
    when you want to read it at night.

    3. Doing something every day helps it become a habit.

    4. Don’t forget to give yourself some small rewards if you can do it every day.

    Follow these steps, and you’ll find that atomic habits help us grow step by step
    and become better at school, sports, and life! They also make big goals easier
    to reach.

     secret 秘訣  as soon as possible 盡快 yourself 你自己   reward 獎勵   goal 目標'
