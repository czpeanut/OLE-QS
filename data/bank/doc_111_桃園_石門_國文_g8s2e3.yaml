- id: doc_111_桃園_石門_國文_g8s2e3_s5_47
  section: 5
  number: 47
  type: single
  page: 3
  stem: 就文章中的描述，何者敘述正確？
  options:
  - label: A
    content: 「送肉粽」為早期原住民出草後，所舉辦的活動
  - label: B
    content: 「送肉粽」是廣東移民所留下來的傳統宗教活動
  - label: C
    content: 「送肉粽」是避免上吊的冤魂，找下一個受害者
  - label: D
    content: 「送肉粽」的習俗，主要分布於宜蘭以南至屏東。
  group_stem: "（二）\n〈送肉粽可以吃嗎？生人勿近的民俗活動〉\n  「送肉粽」這項台灣民間習俗活動，多是在彰化縣西北沿海一帶舉行。從彰化市、鹿港、福星、和美、伸港、線西等鄉鎮，普遍都有著這樣的習俗。\n\
    \  「送肉粽」其實是一種喪葬習俗，至今應有四百餘年歷史。彰化一帶的沿海居民們普遍認為，選擇上吊自縊的死者怨氣最重，且傳說往生者斷氣後煞氣會殘留在吊具上，因此必須挑選時辰將相關物品送走，否則還會有人跟著步上絕路。會叫「肉粽」則是取「線綁住肉」的概念，用來形容上吊的人被繩子套住頸部。\n\
    \  會有這樣的習俗傳說是因為怕死者的怨氣太重，會再找下一個人上吊，也就是俗稱「找替身」、「抓交替」，與台灣其他地區會舉辦的燒王船活動概念差不多，皆是道教除煞方式之一。而北部多採「跳鍾馗」、中南部多以「道士驅煞」來安撫人心惶惶。\n\
    \  因此若發現有人上吊自縊身故，喪家會請法師以「金刀斷繩」，並在儀式中送走繩子、橫梁、樹枝、樓梯等任何亡者碰觸過的代表性物品，一併送到出海口或溪口火化。而這樣的儀式過程就稱為「送肉粽」，目的是藉此將亡靈送出海，避免遺留下來的怨氣影響生人。"
  tags:
