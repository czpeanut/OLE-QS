  group_stem: '王曰：「弟子操作多日，師略授小技，此來為不負也。」道士問：「何術之求？」王曰：「每見師行處，牆壁所不能隔，但得此法足矣。」道士笑而允之。乃傳以訣，令自咒，畢，呼曰：「入之!」王面牆，不敢入。又曰：「試入之。」王果從容入，及牆而阻。道士曰：「俛首驟入，勿逡巡(1)!」王果去牆數步，奔而入。及牆，虛若無物，回視，果在牆外矣。大喜，入謝。道士曰：「歸宜潔持，否則不驗。」遂助資斧(2)遣之歸。抵家，自詡遇仙，堅壁所不能阻。妻不信。王傚其作為，去牆數尺，奔而入，頭觸硬壁，驀然而踣(3)。妻扶視之，額上墳起如巨卵焉。妻揶揄之，王慚忿，罵老道士之無良而已。                                         ——蒲松齡
