- id: doc_113_桃園_桃園_國文_g7s2e3_s2_30
  section: 2
  number: 30
  type: single
  page: 4
  stem: 獅貓一開始面對老鼠時的行為，真正用意是什麼？
  options:
  - label: A
    content: 膽小畏懼，不敢出面迎戰
  - label: B
    content: 想閃避危機，尋找逃脫機會
  - label: C
    content: 故意反覆閃避，消耗對手氣力
  - label: D
    content: 在與老鼠玩耍，並不打算動手
  group_stem: "明 萬曆年間，皇宮中有老鼠，長得跟貓一樣大，為害極為嚴重。從民間找遍了好貓捕捉老鼠，都被老鼠吃掉了。恰好有外國進貢來的獅貓，渾身毛色雪白。把獅貓放進老鼠出沒的屋子，關上窗戶，偷偷觀看。貓蹲在地上很久，老鼠從洞中出來，見到貓之後跑來咬貓。貓躲老鼠跳到桌子上，老鼠也跳上桌子，貓就跳下來。這樣來來回回，不下百次。大家都認為貓膽小，認為這次又沒用了。接著，老鼠跑跳變慢了，肥大的肚皮看上去有些喘，蹲在地上稍稍休息。獅貓立即快速的跳過來，爪子抓住老鼠頭頂，口咬住老鼠脖子，輾轉爭鬥僵持，貓嗚嗚的叫，老鼠啾啾的呻吟。急忙打開窗戶看，老鼠腦袋已經嚼碎了。\n\
    \    這時，人們才明白，獅貓開始時之所以躲大老鼠，並不是膽怯，而是等待大老鼠鬥志鬆懈下來。你出來，我就躲，你回去，我又出來，獅貓用的就是計謀。啊！粗魯的人一遇事就手按寶劍，一臉怒氣，與這隻大老鼠有什麼不同呢？\
    \                                                                      ——蒲松齡 聊齋誌異\
    \ 大鼠"
  tags:
    textbook: 七下 自學課一 六朝志怪小說選
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 七下
      subject: 國文
      code: 自學課一
      title: 六朝志怪小說選
      chapter: null
