  group_stem: "潛不解音聲，而畜(1)素琴一張，無弦，每有酒適(2)，輒撫弄以寄其意。貴賤造之者，有酒輒設，潛若先醉，便語(3)客：「我醉欲眠，卿可去。」其真率如此。郡將候潛值(4)其酒熟，取頭上葛巾(5)漉酒(6)，畢，還(7)複著(8)之。\n\
    \                                                                            \
    \       ——宋書 隱逸傳\n\n(1)畜(ㄒㄩˋ)：儲存。 (2)酒適：酒後之快意。  (3)語(ㄩˋ)：告訴。     (4)值：恰好。   (5)葛巾：頭巾。\n\
    (6)漉酒：濾酒。       (7)還(ㄒㄩㄢˊ)：立即。(8)複著(ㄓㄨㄛˊ)：又戴上。"
