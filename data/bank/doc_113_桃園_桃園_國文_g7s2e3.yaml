- id: doc_113_桃園_桃園_國文_g7s2e3_s2_36
  section: 2
  number: 36
  type: single
  page: 5
  stem: 根據文章內容，下列哪一項不是青少年迷戀偶像的主要原因？
  options:
  - label: A
    content: 偶像具有吸引人的外貌和才華
  - label: B
    content: 透過追星可以建立自我認同與價值觀
  - label: C
    content: 偶像會主動與每位粉絲建立私下聯繫
  - label: D
    content: 加入粉絲團體可獲得同儕支持與歸屬感
  group_stem: "有一次，我和朋友搭乘從臺北飛往高雄的班機，同行乘客中出現了幾位為了參加偶像簽名會而搭飛機南下的國中女生。她們興奮地擠到前排，希望在第一時間見到偶像。朋友不禁抱怨：「怎麼會有父母讓孩子為了明星花錢、請假、到處跑？要是我早就罵了！」我卻忍不住笑了，因為我認為，青少年追星，其實是成長歷程中一種常見又自然的現象。\n\
    \    現代社會中，透過商業包裝誕生的偶像文化早已深植人心，無論在臺灣、日本還是歐美，戲劇、音樂與社群媒體所打造的明星形象，對青少年具有極強的吸引力。他們大量購買偶像的唱片、商品，甚至追隨偶像全臺跑透透，這些看似瘋狂的行為，其實是在表達對偶像的支持與情感依附。仔細想想，許多大人年輕時也曾為了某位老師、演員或作家心動、著迷，只是方式不同罷了。這樣的迷戀，反映的是人們在年輕時對理想人物的嚮往。\n\
    \    從心理發展的角度來看，青少年正處於自我認同與價值觀建構的重要階段。他們透過對偶像的崇拜與模仿，學習如何表達情感、建立自信，也在過程中尋找「我是誰」。偶像常具有明確、鮮明的形象，成為青少年心中的理想化象徵，他們希望自己能像偶像一樣受歡迎、有魅力，也因此更想靠近、支持他們。\n\
    \    此外，追星也是青少年與同儕建立連結的重要方式。他們組成「粉絲後援會」、「家族」，一起參與活動、討論偶像動態，甚至與支持其他偶像的粉絲互相「較勁」，這些都滿足了青少年對團體認同與歸屬感的需求。這種互動，讓他們在群體中找到存在價值與自我定位。\n\
    \     當然，這並不代表家長可以完全不關心孩子的追星行為。若孩子僅是在課餘時間關注偶像、偶爾參加活動、購買週邊商品，這其實無傷大雅。父母只需叮嚀孩子注意安全、行為得體即可。但若孩子因追星而出現翹課、逃家、說謊、沉迷網路、情緒過度波動，甚至無法專心學習或完成應盡責任時，就需提高警覺並適時介入。\n\
    \    曾經也發生過偶像自殺，粉絲跟著輕生的悲劇，因此，觀察孩子對偶像的情感投入是否過度，是家長的重要責任。若發現孩子將偶像視為唯一的情感寄託，甚至失去與現實生活的連結，那就可能不是單純的喜好，而需要專業協助。理想的情況是，孩子願意與父母分享自己喜歡的偶像與理由，這顯示親子之間的溝通是有基礎的。父母不必強迫自己也喜歡同一位偶像，但應以尊重與理解的態度陪伴孩子。像是載孩子參加簽唱會、事先約定集合時間與安全原則，既維護了孩子的自主空間，也讓父母掌握孩子的動向，是很好的做法。\n\
    \    更進一步，追星行為還可以成為鼓勵學習的動力。例如有些粉絲團設立獎學金制度，父母也可以與孩子約定：若考試進步、成績達標，就獎勵偶像週邊商品，讓偶像成為孩子努力的目標，而非逃避現實的藉口。\n\
    \    總之，追星是許多青少年都會經歷的一段成長歷程。家長不必一昧打壓，也不必過度擔心，而是應該以理解、接納的態度陪伴孩子，適時提醒、引導其行為。唯有在良好的親子互動基礎下，孩子的追星熱情才能轉化為健康的情感發展與自我成長的助力。\
    \                                 ——顏正芳醫師 我的孩子是追星族！"
