  stem: 關於「筆記小說」，下列說明何者正確？
  options:
  - label: A
    content: 筆記小說盛行於漢 魏 六朝，以篇幅長、故事淺顯易懂、隨筆雜錄為其特色
  - label: B
    content: 中國古典小說的濫觴最早可以溯源到古代的神話和先秦寓言，它們是筆記小說的源頭
  - label: C
    content: 志人小說又稱軼事小說，主要記載人物的言行和軼聞瑣事，列異傳是最有名的代表作品
  - label: D
    content: 志怪小說是記述奇人奇事、靈異事件或神鬼妖怪為主，世說新語是最有名的代表作品
