  stem: 下列關於作者對廟會的觀察與感受，哪一項最符合文章內容？
  options:
  - label: A
    content: 作者從小信仰廟宇文化，經常參與廟會活動
  - label: B
    content: 作者對廟會的熱鬧氣氛感到陌生且排斥
  - label: C
    content: 作者雖有宗教顧慮，但仍被廟會的熱鬧吸引
  - label: D
    content: 作者認為廟會只是迷信活動，應被取締
  group_stem: "「要不要一起去？大家都要去耶。」同學隔著兩排座位呼喚我，那是在小學教室裡，快要放學的最後一堂課，大家的心早就飛到了廟會廣場，喧喧鬧鬧，老師喊了好幾次：「安靜！不要講話。」卻一點用也沒有。感染了同學們的興奮，我也覺得躍躍欲試。然而，因為母親的信仰，我們一直和廟宇保持著敬而遠之的態度。當同學們邀我一起去的時候，我便顯出了遲疑。建成於清\
    \ 光緒年間的集應廟，從我幼年遷居到木柵後，就深植在成長的歲月中，像一棵枝葉茂密的大樹一樣。每天上學、放學都要經過廟口廣場，那裡並沒能形成廟街市集，也沒有著名的廟口小吃，反而聚集了踢球、練習自行車和玩紙牌的孩子。相比之下，我倒覺得距離不遠的景美集應廟有趣多了，位於夜市的廟口，有許多小吃，我還被父親帶著去喝過蛇湯。\n\
    因為體內的熱毒，我在小學時發了一頭的膿包，又癢又痛，鄰居奶奶強烈建議去景美集應廟口喝蛇湯。雖然我也賣力地哭泣，抵死不從，最終還是得去。在沒有動保意識的年代，我們繞過生剝活蛇的表演，走進店裡，在大大小小的籠子環繞，群蛇注目下，點了一盅毒蛇湯。老闆說錦蛇湯便宜點，但毒蛇湯特別有效，父親說，那就給我們毒蛇湯吧。一向節儉的父親這樣說的時候，我確實有點感動，心中暗自決定，無論多麼難以下嚥，都要乖乖地吃完。那一盅冒著熱氣的湯放在面前，濃濃的中藥味撲鼻，我用湯匙舀了一勺放進嘴裡，並不如想像中可怕，有點像是魚湯藥膳，還挺鮮美的。離開時才發現，我坐的板凳下也有一籠蛇，吐著蛇信，不知為什麼，當我意識到蛇是食物之後，就再也不覺得可怕了。\n\
    「要不要一起去？去啦去啦。」同學在校門口再度呼喚我。他們說這是大型廟會，12 年才有一次的，如果錯過這一次，我們都變成大人啦。「我去一下就要回家囉。」我弱弱地說，跑了幾步，跟上他們的腳步。\n\
    \    我們抵達廟口時，已經擠得水泄不通了，我從沒見過這麼熱鬧的景象，許多信徒手中舉著一柱香，口中唸唸有詞，圍繞著看陣頭表演，夥著一起來的同學早被人潮衝散，穿著制服的高年級男生站在我旁邊，熱心講解：「這是車鼓陣喔，剛剛還有宋江陣，比較好看啦。」他還沒有講完，已經跑去看野臺戲了，現場演奏的嗩吶鑼鼓聲實在太吸引人，觀眾裡有好多阿嬤，對著演小生和小旦的演員熱烈歡呼。我覺得小生舉手投足充滿魅力，他的眼神彷彿能勾人魂魄，相比之下，小旦的年紀似乎太大了，厚厚的脂粉也蓋不住臉上的滄桑。「她們是母女啦，阿母少年時有夠水喔。」身邊的阿嬤對她的朋友說。\n\
    母女兩人在戲臺上纏綿深情，實在是太奇幻了。更奇幻的是我參與了最後一回的豬公大賽，廟口一大早就來了一輛又一輛卡車，載著宰好除毛撐在木架上的大豬公，先過磅，標上重量，再華麗裝扮，嘴裡咬住一顆鳳梨。動輒達到一千多斤的豬公，在廟會中成為犧牲，原本是件悲慘的事，可是，每隻豬的表情看起來都那樣安詳愉悅，閉上的雙眼彎彎，嘴角翹起來，彷彿想起了幸福時刻，忍不住微笑。那樣的笑容，是在至福之中才能展現的無邪與良善。然而，我卻感到一種殺戮的恐怖，那是在消失的廟會慶典活動中，我最不想念的一樁。\n\
    \                                      ——張曼娟 奇幻的逃逸時光"
