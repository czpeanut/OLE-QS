  stem: 「我吃日本米、讀日本書長大，我是一個日本人！」這是劇中人物新海輝面對質疑時大聲喊出的話語，展現他對日本強烈的認同。請問：新海輝的話語以及他自願參軍的行動，顯示日本在臺灣推行的哪一項政策有所成效？
  options:
  - label: A
    content: 無方針主義
  - label: B
    content: 民族自決
  - label: C
    content: 皇民化運動
  - label: D
    content: 專賣政策。
  group_stem: '公視戲劇《聽海湧》，被譽為2024 年最強臺劇。1942 年，大日本帝國在婆羅洲建立了戰俘營，並大量徵召臺籍青年擔任監視員，替日軍監看戰爭中捕獲的盟軍戰俘。故事的主角「新海三兄弟」，各自因為不同的原因，接受徵召奔赴戰場。大哥新海輝，從小接受日本教育、認為自己是日本子民；二哥新海志遠，為獲得日籍愛人父親的認可而參軍；小弟新海木德，為補貼家用而謊報年齡加入軍隊。他們或聽從上級命令，以軍人方式管理戰俘；或順應內心，暗中幫助戰俘生存。懷抱不同想法的他們，卻有共同的願望：捱過戰爭，返回家鄉。

    然而，隨著戰事發展日漸不利，戰俘成為被虐殺的對象。日本戰敗後，澳洲軍隊接管戰俘營，發現營地壕溝發生屠殺，「新海三兄弟」等臺籍戰俘監視員受到指控，因此被送上軍事法庭審判。這些為戰爭遠赴他鄉的臺灣人能不能回家，由盟軍的判決決定⋯⋯。

