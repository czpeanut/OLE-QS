    | (Ｃ)累積性 | 古代書寫的隸書、楷書，逐漸演變成我們今日所使用的文字。 |

    | (Ｄ)制約性 | 我國修改交通法規，規定乘坐小客車後座的乘客應繫上安全帶。 |'
