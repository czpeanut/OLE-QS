  group_stem: 伊斯蘭教律法(沙里亞)以《古蘭經》教義為基礎，是一套指引穆斯林（伊斯蘭教徒）日常生活和行為的合法性規範系統。非親屬關係的男女共處、賭博喝酒、吃豬肉等行為都違反該律法。在嚴格執行該律法的地區，存有備受爭議的處罰方式，如對已婚通姦者實施石刑，對偷竊、婚前性行為及飲酒者鞭打，這些方式在國際上引起不少的批評。
