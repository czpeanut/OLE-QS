- id: doc_113_高雄_七賢_國文_g7s2e1_s5_21
  section: 5
  number: 21
  type: single
  page: 4
  stem: 根據文章，「要有多元思考的能力」是為了避免什麼情況？
  options:
  - label: A
    content: 讓自己對事件的理解過於單一
  - label: B
    content: 讓我們能夠更快地接受資訊
  - label: C
    content: 增加對單一觀點的依賴
  - label: D
    content: 讓我們避免陷入不必要的爭論
  group_stem: "請閱讀以下文章(甲)，並回答21～22 題：\n(甲)\n一、不要以為眼見就能為憑\n  即使看到了影像、聽到了聲音，都未必是全部的事實，甚至有可能是經過刻意篩選或變造的。我們看到的所有影像其實只是一時、一地、一角度的結果，就算是直播，也看不見鏡頭以外的所有畫面，未必能知道事件的發展脈絡。再加上媒體的版面及時段有限，難以呈現所有的內容。因此，媒體的資訊都是「選擇」與「組合」的結果，訊息的產製會經過一連串守門的程序，觀眾看到的東西早已被篩選。\n\
    二、不要只以自己的立場解讀\n  如果你問周遭的人，哪家媒體最客觀、公正且真實？你會發現，他最相信、最常看的，往往是與他在該議題立場相近的媒體。人們習慣從自己的立場與需求選擇資訊，當某些媒體立場與其價值一致，就越容易得到信賴，但這樣的信任卻是來自於個人選擇偏誤，這也遮蔽了我們對事實的認識。\n\
    三、不要隨意轉發訊息\n  傳統上，訊息的傳播可分為生產者、傳播者及接收者三種類型，但數位時代的閱聽人三種皆是。許多訊息能夠迅速擴散，是因為閱聽人的快速轉發，但有時卻因此成了傳播有害訊息的角色。閱聽人未必是故意轉發有問題的資訊，往往只是單純的分享或善意的提醒。不過在傳播之前，我們就該是稱職的守門人，若沒有確認訊息的真偽就任意轉貼，這些好意反而可能成為假訊息擴散的助力。\n\
    \  除了「三不要」，好的媒體識讀能力也要有下列的「三要」原則：\n一、要有主動探究的意願\n  若不想受到自己選擇偏好媒體的影響，我們可以主動接觸不同資訊來源，或者廣泛閱讀充實知識。有機會也能親臨事件現場探究，才不會受特定媒體的左右。\n\
    二、要有多元思考的能力\n  如果只相信與自己立場一致的媒體，不但限制了對事件的認識，也影響我們從什麼樣的觀點及角度理解事件。然而，同樣的事情也會有不同的觀點，因此，要有多元思考的能力，從多樣的角度認識世界。\n\
    三、要能自我反思批判\n  我們很容易「信我所信」，偏食的選擇自己所相信的媒體，反而框限了視野。因此，閱聽者也要能反躬自省，自己是否偏食？是否太少思考？是否自以為是？是否忽略其它的訊息來源與觀點？不斷自我反思與批判，才是成為「耳聰目明」閱聽人的重要關鍵。\n\
    管中祥 〈媒體識讀的三要與三不要〉"
