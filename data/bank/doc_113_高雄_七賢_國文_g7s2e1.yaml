  section: 4
  number: 5
  type: single
  page: 1
  stem: 關於〈紙船印象〉的寫作手法，下列敘述何者正確？
  options:
  - label: A
    content: 用譬喻句法呈現紙船下水的情景，增強畫面感。
  - label: B
    content: 用映襯法描寫對往事的印象，表達深刻情感。
  - label: C
    content: 文章脈絡由「人」而「物」而「情」，層次分明。
  - label: D
    content: 後半文章出現轉折，從記敘往事轉為抒情。
