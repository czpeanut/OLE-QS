- id: doc_113_高雄_七賢_國文_g7s2e1_s5_27
  section: 5
  number: 27
  type: single
  page: 6
  stem: 關於本文對時間認知錯覺的描述，下列何者正確？
  options:
  - label: A
    content: 科學家在研究時間認知錯覺時，經常選擇雲霄飛車作為測試工具。
  - label: B
    content: 研究發現，人在緊張的情境下，大腦處理外界訊息的速度會變慢。
  - label: C
    content: 透過現代科學的進展，人類已經完全釐清時間認知錯覺的成因。
  - label: D
    content: 伊葛門認為，時間認知錯覺主要與事件發生後大腦的運作模式有關。
  group_stem: "請閱讀以下文章(丁)，並回答27～28 題：\n(丁)\n    你是否有過這經驗？明明地震只搖了幾十秒，卻感覺搖晃時間持續了好幾分鐘。或是在坐過雲霄飛車後，不敢相信自己剛剛的刺激體驗不過是在一、二分鐘內發生的事。\n\
    \  科學家們試圖解釋這種心理上與外在的時間差現象，神經科學家大衛．伊葛門(David Eagleman)透過實驗後判斷：人們在緊急或恐懼的狀況下，當下感覺到的時間並無減慢，大腦的處理速度也沒有增加，只是因為外在刺激讓感官變得敏感，導致人體接收到的外在訊息量增加，大腦在事後回憶時發現記憶了大量資訊，造成錯誤判斷，以為過程時間比實際上更久。\n\
    \    然而，反駁伊葛門這種記憶錯判說的科學家認為，人類在緊急狀況下，大腦每秒鐘所處理的外在訊息也會增加，由於平時所需一分鐘才能解決的訊息量可能在危急情況下花費了三十秒就處理完畢，因此大腦誤認為經歷了一分鐘的處理時間，才導致時間變慢的錯覺。\n\
    \    儘管科學家們對於時間認知的錯覺還未有一套完整的說法，畢竟我們仍對大腦的運作模式所知甚少，但至少這些研究揭示了：人們對時間的認知並非無時無刻都是客觀與一致的。\n\
    改寫自〈如何習得《駭客任務》裡的絕招「子彈時間」？〉泛科學"
