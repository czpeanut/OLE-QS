  stem: 「愛玉凍」的名稱由來是什麼？
  options:
  - label: A
    content: 由某位老者命名，因其所含愛玉果而得名。
  - label: B
    content: 由官府所命名，因為其具有解暑的效果。
  - label: C
    content: 由同安人發現冰凍水後發明，並將其命名為「愛玉」。
  - label: D
    content: 由一位名叫「愛玉」的女孩售賣，因而取名為「愛玉凍」。
  group_stem: "請閱讀以下文章(丙)，並回答25～26 題：\n(丙)\n  臺灣為熱帶之地，三十年前無賣冰者，夏時僅啜仙草與愛玉凍。按《臺灣府誌》謂：「仙草高五、六尺，晒乾可作茶，能解暑毒。煮爛絞汁去渣，和粉漿再煮成凍，和①糖泡水，飲之甚涼。」而愛玉凍則府、縣各誌均未載。\n\
    \  聞諸②故老，謂道光初有同安人某，居府治媽祖樓街，每往來嘉義，辦土宜③。一日過後大埔，天熱渴甚，赴溪飲。見水面成凍。掬而啜之，冷沁心脾。自念此間暑，何得有冰？細視水上，樹子錯落，揉之有漿，以為此物化之也。拾而歸家。子細如黍，以水絞之，頃刻成凍，和糖可食。或合兒茶少許，則色如瑪瑙。某有女曰「愛玉」，年十五，長日④無事，出凍以賣，人遂呼為「愛玉凍」。\n\
    連橫 〈愛玉凍〉\n①和：攪拌、混合。②諸：「之於」的合音。③辦土宜：採買土產。④長日：夏季的白天。夏季晝長夜短，故曰長日。"
