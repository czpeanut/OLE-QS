  stem: '有關愛玉凍和仙草凍的比較，下列何者正確？

    | 選項 | 愛玉凍 | 仙草凍 |

    | --- | --- | --- |

    | (A) | 必須使用愛玉果製作 | 並不一定使用仙草果，而是以仙草草本為主要原料 |

    | (B) | 喝起來清涼，能解熱、解渴 | 具有解暑毒的效果，能夠幫助降溫並排暑 |

    | (C) | 可以通過冷凍方式製作，但也需要其他成分來成形 | 同樣需要冷卻但並不僅依賴冷凍來完成製作過程 |

    | (D) | 顏色並非一定是綠色，依製作方法可有不同顏色 | 顏色常見為黑色或深綠色，依不同方法稍有變化 |'
