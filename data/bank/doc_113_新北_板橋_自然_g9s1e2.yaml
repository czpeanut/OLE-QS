- id: doc_113_新北_板橋_自然_g9s1e2_s2_38
  section: 2
  number: 38
  type: single
  page: 4
  stem: 關於撐竿跳的敘述，何者錯誤?
  options:
  - label: A
    content: 撐竿彎曲時的能量來自於起跳時的水平速度
  - label: B
    content: 起跳時的垂直速度過高將影響豎竿位置
  - label: C
    content: 插竿起跳後到推竿過竿的過程合力矩等於零
  - label: D
    content: 過竿後到著地的過程中，重力對選手作正功。
  group_stem: '撐竿跳高

    撐竿跳高是田徑運動中技術極為複雜及富有高度挑戰性的一個項目，比賽過程中動作展現出力與美的特色，且可看性十足，運動過程中需借助撐竿的特徵，幫助身體越過高度。動作技術的流程，可區分為持竿助跑、降竿、插竿起跳、懸吊、擺體捲背、伸展轉體、推竿過竿和落地著墊。

    撐竿跳高能量的獲得是來自快的起跳速度，起跳速度也是影響成績最主要的因素。起跳速度可分為水平速度及垂直速度，兩種速度是相互關連，在起跳時必須合理的分配，水平速度能儲存能量使撐竿彎曲及向前移動，垂直速度則是有助於起跳角度的提升，所以一次有效的起跳要在最小水平速度損失下產生最佳的垂直速度，起跳時水平與垂直速度若分配不佳，將形成垂直速度過高，導致起跳後竿子彎竿向前的水平動能損失過大，無法達到良好豎竿位置，這說明起跳時的水平速度在成績的表現更是重要。'
