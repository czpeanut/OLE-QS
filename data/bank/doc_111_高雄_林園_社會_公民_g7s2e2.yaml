- id: doc_111_高雄_林園_社會_公民_g7s2e2_s1_39
  section: 1
  number: 39
  type: single
  page: 1
  stem: 墨西哥著名的亡靈節源自數千年前的南美洲民族文化，對他們來說，死亡只是生命週期的一部分，悼念死者是不敬的行為。死去的人依然活在全體的記憶和精神中，而且會在亡靈節時暫時回到人間。因此，亡靈節時墨西哥各地的人會穿上特別的服裝參加遊行和派對，載歌載舞向亡者獻上祭品，展現對生命的喜悅以及對死去親人的敬愛。根據上述，下列敘述何者正確？
  options:
  - label: A
    content: 悼念死者在墨西哥屬於倫理道德
  - label: B
    content: 在墨西哥人們去世後即不具人性尊嚴
  - label: C
    content: 在亡靈節慶祝狂歡屬於主流文化
  - label: D
    content: 墨西哥延續亡靈節的傳統屬於文化衝突
  answer:
  - C
  answer_source: answer_key_vlm
