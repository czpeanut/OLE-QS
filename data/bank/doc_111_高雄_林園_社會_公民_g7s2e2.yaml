- id: doc_111_高雄_林園_社會_公民_g7s2e2_s1_42
  section: 1
  number: 42
  type: single
  page: 1
  stem: 有許多的在地農友會在路邊設置「良心商店」，販售相關蔬果農產品，而這些商店的特色是無人看管，民眾憑良心自己投錢購買，但部分店家結算金額時還發現有民眾沒有付錢就帶走商品。警方表示良心商店都有標價，因此民眾未投錢或投不足額都構成竊盜，只要店家提告皆可偵辦追查。請問上述畫線處的社會規範與下列何者相同？
  options:
  - label: A
    content: 清明節祭祖掃墓
  - label: B
    content: 開車未禮讓行人
  - label: C
    content: 穆斯林不吃豬肉
  - label: D
    content: 讓座給老弱婦孺
  answer:
  - B
  answer_source: answer_key_vlm
