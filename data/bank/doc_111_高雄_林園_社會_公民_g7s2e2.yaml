- id: doc_111_高雄_林園_社會_公民_g7s2e2_s1_41
  section: 1
  number: 41
  type: single
  page: 1
  stem: 國民政府來臺後為了推動漢化政策，獨尊國語，禁止原住民使用母語，導致原住民語言嚴重流失。直到1994 年《憲法增修條文》，山胞才正式正名為原住民，不僅去除了帶有歧視的稱呼，更凸顯原住民族才是這塊土地真正的主人。根據上述內容判斷，過去政府的政策可能造成下列何種現象？
  options:
  - label: A
    content: 難以傳承發揚漢族文化
  - label: B
    content: 次等文化的方言逐漸消失
  - label: C
    content: 文化位階造成文化不平等
  - label: D
    content: 塑造多元並重的文化環境
  answer:
  - C
  answer_source: answer_key_vlm
  tags:
    chapter:
      publisher: 翰林
