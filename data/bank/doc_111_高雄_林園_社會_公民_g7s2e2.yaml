- id: doc_111_高雄_林園_社會_公民_g7s2e2_s1_40
  section: 1
  number: 40
  type: single
  page: 1
  stem: 原住民狩獵保育動物遭判刑的案例，引發重大爭議。狩獵是原住民族數千年來的傳統文化與生活方式，然而法律為了保護保育動物而限制狩獵行為，如何在兩者之間取得平衡，引發各界討論。上述內容最有可能是在討論下列哪一議題？
  options:
  - label: A
    content: 具強制性的法律是唯一的行為準則
  - label: B
    content: 風俗習慣與法律規範彼此間的衝突
  - label: C
    content: 風俗習慣是具有強制性的社會規範
  - label: D
    content: 社會規範僅能約束人們的外在行為
  answer:
  - B
  answer_source: answer_key_vlm
