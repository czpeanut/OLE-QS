- id: doc_111_高雄_林園_社會_公民_g7s2e2_s1_45
  section: 1
  number: 45
  type: single
  page: 1
  stem: 西元2017 年制定的《原住民族語言發展法》明確指出，原住民族語言是國家語言。2018 年修正《客家基本法》提到，客語是國家語言之一與各族語言平等。2019
    年《國家語言發展法》三讀通過，目的在促進國家語言傳承、復振與發展，同年通過的《文化基本法》也規定，各固有族群使用的自然語言與臺灣手語，國家應定為國家語言，並且促進語言的保存、復振和永續發展。下列哪一項敘述與這些法律的重要內涵有關？
  options:
  - label: A
    content: 透過政策實現多元文化精神
  - label: B
    content: 藉由文化創新延續傳統資產
  - label: C
    content: 排除文化交流下造成的歧視
  - label: D
    content: 培養具有多語言溝通的能力
  answer:
  - A
  answer_source: answer_key_vlm
