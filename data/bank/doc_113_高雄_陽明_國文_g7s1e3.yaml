  stem: 關於〈鬧元宵〉一文的內容說明，下列何者正確？
  options:
  - label: A
    content: 比起大竹篾子滾出來的元宵，作者更喜歡吃手搓湯圓，是因為覺得元宵的餡料不夠講究
  - label: B
    content: 作者聽到遠遠的鑼鼓聲，就先關燈閃人，是因為要上街欣賞活脫脫的就要騰雲駕霧沖天而去的龍
  - label: C
    content: 龍首點頭時，人要稍微迴避，是因為民間信仰中的龍身分尊貴，平民無法承受這麼重的禮
  - label: D
    content: 龍要集合在廟前被火化，是因為若未火化，舞龍將會導致邪魔竄生，造龍師傅的處境堪憂。
