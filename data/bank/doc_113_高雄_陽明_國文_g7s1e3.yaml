- id: doc_113_高雄_陽明_國文_g7s1e3_s3_36
  section: 3
  number: 36
  type: single
  page: 6
  stem: 下列何者是〈鬧元宵〉作者覺得最遜色的燈籠？
  options:
  - label: A
    content: 可伸縮的紙燈籠
  - label: B
    content: 充滿菜香的竹火把
  - label: C
    content: 克難的奶粉罐燈籠
  - label: D
    content: 龍造型的塑膠燈籠。
  group_stem: "小時候，我對元宵節有著莫名的抗拒，因為它代表著年節真的結束了，就算再熱鬧，也有種曲終人散的悲涼，但提燈籠、吃元宵還是不可免的。小時物資缺乏，燈籠都得自己做，把奶粉罐打橫了點根蠟燭，罐底用榔頭釘子敲出一個個小孔透光，上頭繫上鐵絲，撿根小竹子拎著，便是人手一個的克難燈籠。大些的男孩嫌拎這奶粉罐太憋氣，便會上山砍竹子，截成一段一段當火把，裡頭填塞浸過廚房剩油的碎布頭，一點起火來菜香四溢，倒也有趣。雖則也買得到那圓筒狀像手風琴般可伸縮的紙燈籠，但卻不太有人會做這傻事，因為一陣風過吹歪了，這燈籠便會自燃，浪費錢事小，被大夥訕笑才叫活該。\n\
    \    長大不提燈籠了，便在元宵上打轉，有人愛吃用大竹篾子滾出來的元宵，我卻覺得口感不夠滑潤，有時煮到破口了，都還沒熟透，真真是傷腦筋。所以我還是堅持吃那揉搓出來的湯圓要順口得多，唯一講究的便一定得是芝麻餡料，起鍋前放些自製的桂花釀即噴香撲鼻。但一次攜了幾盒芝麻湯圓至友人家共度元宵，不料卻是以盤子端出來，當場令我驚駭莫名。原來他們把湯圓當餃子吃，還好沒添麻油、醋當佐料。\n\
    \    還住在苗栗客家莊時，每年元宵前大街小巷不時會遇著舞龍隊伍，有時連坐在家裡都有龍來拜年。一開始挺興奮的，只要包個百元紅包就有龍為你獨舞，但後來數量實在太多，且還有小孩龍頭龍尾加打鼓，三個人就組成一個隊伍來討紅包，伸頭一看，這是龍嗎？毛毛蟲差不多吧！後來是只要聽到遠遠的鑼鼓聲，索性先關燈閃人。\n\
    \    不過大陣仗的舞龍畫面，還是能看得人熱血沸騰。幾次在人潮聚集的街頭，看著那五彩金龍向商家拜年，當那龍頭頷首時，可別傻傻的杵在那兒，要稍稍避一避，人可是擔不起這麼重的禮。若逢著兩條龍遭遇，那就精采了，遠遠的鼓聲鈸響就熱鬧了起來，隨著兩組人馬接近，那較勁的意味就愈來愈濃，這時所有車輛行人都閃到一邊，偌大的馬路就看著這兩尾活龍奔騰、盤旋，像似在較量，又像在共舞，在鞭炮的煙硝裡，那龍活脫脫的就要騰雲駕霧沖天而去了。\n\
    \    元宵是夜，這些曾穿梭在街頭巷尾的活龍，全要集合在廟前火化了，因為龍不能留在人間，怕會添亂。但我以小人之心揣度，那是造龍師傅放的話，若一條龍舞個十年二十年的，人家要靠什麼吃飯？不過那毛毛蟲小龍，應該可以躲過這場火劫，就算真會作亂，以它那規模約莫也成不了什麼氣候吧！\n\
    \                                      選自朱天衣〈鬧元宵〉"
