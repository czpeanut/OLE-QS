- id: doc_113_高雄_陽明_國文_g7s1e3_s2_11
  section: 2
  number: 11
  type: single
  page: 2
  stem: 「鬥蛛之法，古未聞有，余友龔散木創為此戲。散木少與余同館，每春和時，覓小蛛腳稍長者，人各數枚，養之窗間，較勝負為樂。」(袁宏道〈鬥蛛〉)根據以上文章，下列選項何者正確？
  options:
  - label: A
    content: 鬥蛛在古代從未聽過
  - label: B
    content: 比鬥的蜘蛛以腳較短者為佳
  - label: C
    content: 蜘蛛需養在牆角，每天照顧便能養出強壯的蜘蛛
  - label: D
    content: 鬥蜘蛛的樂趣在於有賭注，勝利者可以賺大錢。
  tags:
    chapter:
      publisher: 康軒
      book: 七上
      subject: 國文
      code: 第七課
      title: 兒時記趣
      chapter: null
    textbook: 七上 第七課 兒時記趣
    labeled_by: ai
- id: doc_113_高雄_陽明_國文_g7s1e3_s2_12
  section: 2
  number: 12
  type: single
  page: 2
  stem: 「余憶童稚時，能張目對日，明察秋毫。見藐小微物，必細察其紋理，故時有物外之趣。」關於這段文字，下列敘述何者正確？
  options:
  - label: A
    content: 作者認為張目對日能帶來樂趣，期許大家養成觀察萬物的習慣
  - label: B
    content: 以懷舊口吻說明對兒時回憶的珍惜，鼓勵讀者不忘兒時的赤子之心
  - label: C
    content: 為全文綱領，敘述作者因為喜歡細心觀察，方能體會「物外之趣」
  - label: D
    content: 將生活瑣事比喻為「物外之趣」，期勉培養恬淡自適的生活情趣。
  lesson_raw:
    title: 兒時記趣
    basis: 引用課文原句
