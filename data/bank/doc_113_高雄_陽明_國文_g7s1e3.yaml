  stem: 請依據上文內容，選擇正確的選項：
  options:
  - label: A
    content: 作家原籍是英國籍，卻以波蘭語寫作
  - label: B
    content: 作者的著作包含《阿梅爾的愚行》、《黑暗的心》、《中年與颶風》
  - label: C
    content: 作家的前身職業是船長，在波蘭商船上服務二十年
  - label: D
    content: 作家的作品中，曾記述航行到婆羅洲和西里伯島運載橡膠及甘蔗的經驗。
  group_stem: "西元一八八九年秋天，一個原籍波蘭，而在英國商船上服務十一年的船長，因為沒有船出海而暫時寄居在倫敦的客寓裡。\n    有一天早晨，吃過早餐後，無事可做，於是他在桌前攤開紙，開始寫一年前他航行到婆羅洲和西里伯島運載橡膠及甘蔗時，旅途中遇到的一個男人的故事。這部小說即是有名的《阿梅爾的愚行》，而這位船長就是後來陸續寫出《黑暗的心》、《少年與颱風》等不朽作品的康拉德。\n\
    \    康拉德後來在回憶裡說：「在寫那本小說之前，除了寫信外，我從未寫過任何東西，而信也寫得很少。」身為一名船員，一定有很多傳奇的遭遇，但他說：「我從未用筆記錄下生活裡的事件、印象或奇聞逸事。」事實上，他過去一直是個勤勞而稱職的船員，所以才有機會升任為船長。\n\
    \    他是一個熱愛海洋的人。但這個一直以海為家的人，在三十七歲的時候，卻因為無船出海，而坐在桌前搖身一變成為一個與文字為伍的作家。更令人驚訝的是，他不是用他的母語波蘭語，而是用外國語即英語來寫作。\n\
    \    康拉德的傳奇性轉變，不僅是文學史上為人所津津樂道的一個奇蹟，亦是個人生活轉變的一個奇蹟。\n    康拉德的故事告訴我們有關人類本質的一則真理：個人是可以改變的。\n\
    \    雖然並不是每一個人都能像康拉德一樣，拋棄他所熟習的生涯，忽然轉入另一種完全不同的行業，而且獲得出人意表的成功。但每一個人隨著年歲的增長、環境的變遷或社會的要求，都能做某種程度的轉變，則是不爭的事實。\n\
    \    「山窮水盡疑無路，柳暗花明又一村」，康拉德的故事也告訴我們，生命有著不可預期的種種可能性。\n                         \
    \  選自王溢嘉〈船員變成大作家〉"
