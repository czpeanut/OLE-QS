- id: doc_113_高雄_陽明_國文_g7s1e3_s2_6
  section: 2
  number: 6
  type: single
  page: 1
  stem: 「各色各樣的紙船或列隊而出，或千里單騎，或比肩齊步，或互相追逐，或者乾脆是曹操的戰艦    首尾相連。」作者用結構相似的語句，接連表現出同範圍、同性質的意念或形象，這種修辭技巧稱為「排比」。下列哪些文句沒有運用「排比」技巧？
  options:
  - label: A
    content: 燕子去了，有再來的時候；楊柳枯了，有再青的時候；桃花謝了，有再開的時候（朱自清〈匆匆〉）
  - label: B
    content: 這種樂器在我國民間很流行，剃頭店裡有之，裁縫店裡有之，江北船上有之，三家村裡有之(豐子愷〈山中避雨〉)
  - label: C
    content: 給我一瓢長江水啊長江水，酒一樣的長江水。醉酒的滋味，是鄉愁的滋味，給我一瓢長江水啊長江水(余光中〈鄉愁四韻〉)
  - label: D
    content: 在南方每年到了秋天，總要想起陶然亭的蘆花，釣魚台的柳影，西山的蟲唱，玉泉的夜月，潭柘寺的鐘聲（郁達夫〈故都的秋〉）。
  lesson_raw:
    title: 紙船印象
    basis: 引用課文原句
  tags:
    chapter:
      publisher: 康軒
      book: 七上
      subject: 國文
