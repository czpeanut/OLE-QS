- id: doc_113_高雄_陽明_國文_g7s1e3_s3_39
  section: 3
  number: 39
  type: single
  page: 7
  stem: 根據文章所述，讓曹操、張飛從媽祖廟屋頂跌落下去的原因為何？
  options:
  - label: A
    content: 發生地震
  - label: B
    content: 爆發戰爭
  - label: C
    content: 年久失修
  - label: D
    content: 強颱來襲。
  group_stem: "搖搖搖，清晨時分，一陣地動天搖。「啊ˇˇ」「曹操掉下去啦！」媽祖廟屋頂變成大號溜滑梯，曹操一路往下溜。張飛喊著：「快，快救曹操！」風太大，張飛站不穩，被風一推，他也在屋頂上溜滑梯了。張飛回過神，發現自己卡在屋簷上，還有一張大白臉黏著他，那是曹操。「張飛，走開啦！」「曹操，你才離我遠一點。」屋頂太擠，大地又搖了一下，他們真的掉下去啦！掉下去，掉下去，掉進一個小女孩的書包。大大的眼睛，小小的手掌，她是小花。小花不認識張飛和曹操，她提著書包快跑。「阿公，媽祖廟屋頂的娃娃掉下來了。」阿公看看書包，看看屋頂：「廟頂的張飛和曹操怎麼掉下來啦？」\n\
    \    一個年輕叔叔被阿公請進辦公室。他拿起張飛，東瞧、西瞧，還用放大鏡看了個仔細：「這是金龍師祖的作品，我不敢修。」「為什麼？」「金龍師祖的做工精細，人物造型栩栩如生，我可不敢修他的作品。」張飛很想問，可是他開不了口。幸好小花舉手說：「叔叔，那有誰能修好我的娃娃？」「我可以問我師公，他是金龍師的大弟子。」\n\
    \    太陽下山前，年輕叔叔扶著一位老爺爺來。「沒錯，這是我師傅做的。」老爺爺摸摸曹操，再看看張飛，「這種絕技只有他才會。」「我二十歲那年，跟著師傅全省各地做剪黏，師傅做的活，很細很難，要慢慢的磨。他做槓槌，要把瓷片剪成火柴棒大小……」小花忍不住問：「火柴棒？那不是一不小心就斷了。」老爺爺笑著點點頭：「對呀，我師傅一天最多剪出十來根。你們看，張飛身上這些盔甲，用了多少根？」小花聽了，急忙把張飛擺好，原來張飛的戰袍這麼寶貝，被她弄壞，那可糟了。\n\
    \    「那時，臺灣沒有好瓷片，村裡的人知道消息後，全都把碗盤、瓷花瓶搬出來，任憑師傅挑挑選選。」小花很好奇：「碗盤和花瓶？」「因為碗盤才有好瓷片，張飛身上的戰袍，就是用一塊青花瓷盤拼出來的。」「是這樣啊！」張飛心裡想，「原來這身戰袍，是一塊盤子。」「我師傅厲害的還是人物。曹操的大白臉、張飛的大花臉，都是師傅用灰泥捏塑塗色。別的師傅搗灰泥，一天就硬了；金龍師的灰泥，過三天再拿來用，還能上色。」「真厲害呀！」年輕叔叔好嚮往。\n\
    \    「武將身上的盔甲，一般人用碗胡亂拼一拼，但是金龍師不是，他是用鐵剪，一根一根剪，剪完還要修，光做個張飛，就要一個月。」「那做一間廟不就要三、五年？」阿公搖搖頭，「現在請人建個廟，一年都嫌長了。」老爺爺嘆口氣：「那就不美了。」「比如張飛吧，」老爺爺提到張飛，張飛連忙伸長了耳朵，「張飛喝斷長阪橋，阻止曹操百萬雄軍，你看他有多英武。師傅做他，讓張飛瞪大了眼，一副嚇退百萬雄軍的樣子，這才能嚇跑曹操啊。」張飛得意了，衝著曹操笑：「原來你是被我嚇跑的。」老爺爺指指曹操：「曹操統領百萬大軍，志得意滿，他可沒想到前頭有個黑臉胖將軍等著他。師傅就抓住兩人決戰前一刻，這樣才美啊！『美』是需要時間磨出來的。」\n\
    \    小花拉拉老爺爺的袖子問：「老爺爺，你能修好它們嗎？」「你看我年紀都幾歲了，哪還能爬高鑽低到廟頂去做剪黏？」「那怎麼辦？」小花的阿公也很著急。老爺爺對年輕叔叔說：「就你去修啊！」「我？我哪敢呀？這是師祖的作品呢！」張飛和曹操心裡也有疑問，他行嗎？年紀那麼輕？老爺爺笑一笑：「自古英雄出少年，你可以啦！」「我還沒學好。」「別怕，我教你做。」老爺爺的手掌在他肩上一拍，大家都笑了。\n\
    \                              選自王文華〈曹操掉下去了〉"
