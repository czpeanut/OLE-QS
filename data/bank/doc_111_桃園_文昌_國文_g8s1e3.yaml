  stem: 「人固有一死，或重於泰山，或輕於鴻毛。」（〈報任少卿書〉司馬遷）意思是「人本來就有一死，但有的人死得比泰山還重，有的人死得比鴻毛還輕，這是因為他們用死追求的目的不同啊！」下列何者最具有積極創造生命的意義？
