- id: doc_111_桃園_文昌_國文_g8s1e3_s2_28
  section: 2
  number: 28
  type: single
  page: 5
  stem: 此篇文章為論說文，他運用了許多的論證方式，請問以下何者並未在文章中使用？
  options:
  - label: A
    content: 例證法（使用事例）
  - label: B
    content: 引證法（使用言例）
  - label: C
    content: 比喻（設喻說理）
  - label: D
    content: 對比（正反並陳）。
  group_stem: "（一） 沒有一樣事物，比現在的按鍵電話更能具體地說明這是一個分秒必爭的世界了。\n 的確，現代人連讓電話轉盤撥轉回來的一兩秒時間都不願等待，我們還能懷疑這不是個節奏迅速、步履匆忙的時代嗎？胡適先生曾以「不做無益事，一日當三日，人活五十歲，獲活百五十」的生活哲學來自勉。雖然他每日在著書立說、從事學術研究和教育工作之外，還要親自處理諸多繁雜事務，但由於能充分掌握、支配零碎時間，因此，仍然生活得從容自如，處處流露同一個溫藹學者的修養與風範，從不覺得時間不敷使用。\n\
    \ 美國歷史上最年輕的總統甘迺迪先生，常常在他接見的第一位客人起身離去，第二位客人尚未踏進會客室之前，也必拿起手邊的書籍閱讀，絕不輕易浪費這些短暫的空檔。正因為他善用時間來充實學識，所以當有人批評他的髮型過於古板難看時，甘迺迪才能自信地回答：「我相信治國的本領，不在頭皮上面，而在頭皮下面。」\n\
    \ 撇開近人不談，在古代從容、悠閒的農業社會裡，就有許多懂得珍惜生命、善於利用瑣碎時間的哲人。陶淵明曾經說過：「盛年不重來，一日難再晨，及時當勉勵，歲月不待人。」千字文中也有「尺璧非寶，寸陰是競」的格言。而宋代大儒歐陽修，更是一個善於利用零碎時間的生活藝術家。他常利用「三上」的工夫構思文章，何謂「三上」？那便是「枕上、廁上、馬上」。生活在今天的我們，如果每天也能利用這些短暫的時間，有恆地記誦一首唐詩、宋詞、一句格言或背幾個英文單字，一年下來，該有多少的收穫啊！\n\
    \ 有一個發人深省的比喻：在一個空無一物的箱子裡，我們最初可以放進一些大石頭，等到再也放不進大石頭時，剩下的空隙，我們可放進不少小石頭；當小石頭已放滿時，還可容納許多細沙；等到細沙也把箱子裡所有的空間填實了，我們仍可再注入不少清水……。\n\
    \ 如果我們每天的二十四小時，就是這口大箱，而我們吃飯、睡覺、洗澡、上學、辦公、休閒、沉思的時間，就相當於箱裡大大小小的石頭，那麼，仍有不少零星、分散的空隙，可供我們完成許多事務。能不能掌握、利用它們，讓每天的生活更加充實，就全靠我們自己了。\n\
    \ 積沙能夠成塔，集腋可以成裘。零碎的時間，應該是生命中的碎珠、沙金、片玉，能勤於撿拾，並集合它們，那的確是一宗可觀的財富！\n陳幸蕙〈生命中的碎珠〉"
  lesson_raw:
    number: 自學（一）
    title: 生命中的碎珠
    basis: 出自自學（一）陳幸蕙〈生命中的碎珠〉
