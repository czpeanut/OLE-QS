- id: doc_111_桃園_文昌_國文_g8s1e3_s1_19
  section: 1
  number: 19
  type: single
  page: 3
  stem: '《世說新語》一書常能透過短小的篇章，凸顯當時名士的個人特質或處世的多面性。它並非記載人物事蹟的史傳，而是把歷史素材透過想像、渲染的手法加以描述，來呈現人物多元面貌的小說，寥寥幾筆就把性情急躁的王藍田在當時的言行躍然紙上。然其言行被記載於〈忿狷〉和〈賞譽〉篇中，可見一個人的優缺不能只觀看他的部份表現，孔子也曾發表對來往之人的看法「不得中行$^{※}$而與之，必也狂狷$^{※}$乎！狂者進取，狷者有所不為也。」，可見狂狷者亦有可取之處。根據上文，以下選項何者正確？

    ※中行：中庸之人，處事不會過與不及

    ※狂：狂妄的人；狷，拘謹的人'
  options:
  - label: A
    content: 脾氣急躁的人若沒有優點就不會被收錄進《世說新語》
  - label: B
    content: 王藍田符合孔子的交友標準，是因為他的個性非常急躁
  - label: C
    content: 從「必也狂狷乎」可知孔子最想要交遊的對象是狂狷者
  - label: D
    content: 孔子認為狂者積極進取、狷者謹慎拘謹，所以可以來往。
  lesson_raw:
    number: 第十課
    title: 世說新語選
    basis: 出自第十課《世說新語選》
