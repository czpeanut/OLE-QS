  stem: OPEN 醬投奔自由為何一路往東？
  options:
  - label: A
    content: 高空中的強勁西風將抵達高度的 OPEN 醬帶往東邊
  - label: B
    content: 受地球自轉的影響，東北季風的影響力趨弱
  - label: C
    content: 東北季風本該將其帶往東北方，受地形阻隔而遲滯
  - label: D
    content: 風切亂流本身就無法預測，純粹是一起事故。
  group_stem: "（二）\n【OPEN 醬投奔自由】\n 週六傍晚 5 時 40 分，夢時代大氣球遊行結束，不料瞬間一陣怪風吹來，OPEN 醬大氣球逃脫，翻身之後，高舉雙手往天空飛去。\n\
    \ 晚間 9點左右，民眾在大寮區華中南路與潮寮路口發現一團不明物體，警方證實，確實是 OPEN 醬的破碎殘骸。事發地點位於夢時代東南方，直線距離約 13 公里。\n\
    \ 你也許好奇，今日高雄在強勁東北季風影響下，氣球應該往南飛往海上，為何會飄向大寮呢？其實，在冬季東北季風影響下，高雄地面風向偏向正北風，但每年 10 月到隔年約\
    \ 5 月，1500 公尺以上的高空其實是吹強西風，冬季甚至會有高空西風噴流出現。也因此，在上下兩層間，常有風切亂流產生，大家冬季搭飛機時就特別有感受。\n\
    \ 一般材質的氫氣球，大約可以上升到 10 公里高，強化材料的氣象氣球可以到 30 公里。而當氫氣球上升，隨著高空空氣稀薄而氣壓下降、氣溫又低，氣球內外氣壓差越來越大，氣球也會逐漸膨脹，直到爆炸。因此\
    \ OPEN 醬的逃亡故事大概會是這樣的，當 OPEN 醬升空後，因為強勁北風，首先翻越了約 50 公尺高的夢時代建築往南飄，很快就飄到了港區上方。也因此，市府當時立即發布警報，請港區航商業者轉知所屬船舶注意避讓並注意航行安全。但隨著高度越來越高，升到\
    \ 1500~5500 公尺之間，受到強勁西風影響，開始往東飛，甚至往東北修正。\n OPEN 醬繼續升高，將會變得越來越大，如果剛好有飛機經過，可能會看到一個巨大化\
    \ OPEN 醬，到了 10 公里高度左右，終於不堪負荷在空中爆破。於是，殘骸就掉到了離會場很遠的大寮。如果 OPEN 醬是用強化材質製造，搞不好是有望飛越中央山脈往太平洋去的。\n\
    （節選自 FB 粉專 高雄過好日）"
