- id: doc_111_桃園_文昌_國文_g8s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 以下為《史記》體例的介紹：「它是中國史上首部紀傳體通史，共五十二萬六千餘字，有本紀十二卷、表十卷、書八卷、世家三十卷、列傳七十卷。其中本紀是按時間記載帝王的世系和國家大事，表以時間為中心，用表格譜列歷史大事件，書則記載歷代國家體制（法律、水文、禮樂、曆法）及典章制度，世家記述貴族王侯及其子孫的歷史事蹟，並留下各諸侯國興喪存亡的歷史，列傳則刻畫大臣到平民各類人物的歷史表現。」請根據上文，判斷下列選項何者錯誤？
  options:
