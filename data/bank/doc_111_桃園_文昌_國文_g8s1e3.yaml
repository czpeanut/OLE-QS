- id: doc_111_桃園_文昌_國文_g8s1e3_s1_26
  section: 1
  number: 26
  type: single
  page: 4
  stem: '一位在印尼的法官 Marzuki，帶著難過的心情審判著一宗偷竊圖案。一位老奶奶被告偷竊木薯。這位老奶奶訴說著自己的狀況，她的孩子病了，小孩子挨餓哭鬧，在不得已的情況之下才去木薯園偷木薯……可是木薯園的經理堅持要把她告上法庭，以示懲戒。

    這位法官讀了控詞，吸了一口氣，看著老奶奶說：「對不起，奶奶。我不能夠不遵守法律，法律終究是法律，所以必須要判妳有罪，妳需支付罰款 100 萬印尼盾（大約等同於台幣
    3800 元），否則妳必須得坐牢兩年半。」老奶奶沒有錢付出來，哀傷無力的低下了頭。卻擔心自己坐牢期間，生病孩子和孫子該怎麼辦。

    突然間，法官把自己的法官帽摘下，從自己錢包裡淘出了 100 萬印尼盾，放進了法官帽裡面。然後對著法庭裡所有人說：「在公正的名義之下，我也要判處這裡的所有人全部都有罪，罰款是每人
    5 萬印尼盾（大約台幣 200 元），因為在這個城市生活的你們，竟然讓一個人挨餓，以致於她必須去偷竊食物給她孫兒吃。」法官把帽子傳了出去，在場的每個人都付了
    5 萬印尼盾，包括了木薯園的經理。

    在退庭之前，已經獲得了三百五十多萬印尼盾的罰款。這些錢用來替老奶奶繳付罰款，老奶奶帶著快樂又感動的心情，把剩餘的錢帶回家。

    （節選自網路文章）


    請問法官判定老奶奶有罪的準則，和下列哪一選項不同？'
  options:
  - label: A
    content: 法律不外乎人情
  - label: B
    content: 法律之前人人平等
  - label: C
    content: 法者，天子所與天下公共也
  - label: D
    content: 凡法事者，操持不可以不正。
