- id: doc_111_桃園_文昌_國文_g8s1e3_s2_34
  section: 2
  number: 34
  type: single
  page: 7
  stem: 「寧鳴而死，不默而生。」范仲淹想要以生命捍衛的事情，同於下列何者？
  options:
  - label: A
    content: 大部份的人都扮演著其他人。他們的想法都是其他人的意見。他們過著模仿他人的生活。他們的激情只是一句引言。（懷爾德）
  - label: B
    content: 每製造一把槍、每發動一場戰爭、每發射一支火箭，這些都是從飢餓卻沒有東西吃的人、寒冷卻沒有衣服穿的人那裡偷竊來的。（艾森豪）
  - label: C
    content: 生命中最難的階段不是沒有人懂你，而是不懂你自己。（尼采）
  - label: D
    content: 如果尖銳的批評完全消失，溫和的批評將會變得刺耳。如果溫和的批評也不被允許，沉默將被認為是居心叵測。如果沉默也不再允許，讚揚不夠賣力將是一種罪行。如果只允許一種聲音存在，那麼，唯一存在的那個聲音就是謊言。（柏拉圖）。
  group_stem: "（三）「寧鳴而死，不默而生」這句話出自北宋名臣范仲淹的〈靈烏賦〉。\n 范仲淹曾擔任北宋京城開封的知府，他在京城大力整頓官僚機構，剔除弊政，僅僅幾個月，開封就「肅然稱治」，取得了相當不錯的政績。只要他不再得罪什麼朝廷的大人物，本可憑此政績逐漸獲得進一步提升，然而他卻生性耿直，不僅不會阿諛奉承，看到朝政上的過失，不管是不是在他的職責範圍之內，他都要理直氣壯的提出批評。范仲淹發現當時的宰相呂夷簡廣開後門，濫用私人，便根據自己的調查，繪製了一張「百官圖」，在景祐三年(西元\
    \ 1036 年)呈給宋仁宗。\n 他指著圖中開列的眾官調升情況，對呂夷簡提出了尖銳的批評。不僅如此，范仲淹還連上四章，論斥呂夷簡的狡詐。偏偏呂夷簡老謀深算，盡惑君主將范仲淹貶為饒州知州，後來幾乎又貶死在嶺南。饒州在鄱陽湖畔。從開封走水路到此，至少須經十幾個州。除揚州外，一路之上竟無人出門接待范仲淹，范仲淹對此毫不在意，反而作詩道：「世間榮辱何須道，塞上衰翁也自知」。不久，范仲淹的妻子李氏病死在饒州，他自己也得了重病。在附近做縣令的友人梅堯臣，寫了一首〈啄木〉詩和一篇〈靈烏賦〉給他。梅堯臣在〈啄木〉詩中勸他不要像啄木鳥一樣，啄了林中蟲，卻招來殺身之禍，面對貪官污吏不要過於耿直；〈靈烏賦〉中也是說他在朝中屢次直言，都被當作烏鴉不祥的叫聲，勸范仲淹應學報喜之鳥，如同鳳凰一來眾人欣喜，高聲啼鳴皆是喜音，而不要像烏鴉那樣報兇訊而「招唾罵於里閭」，希望他從此栓緊舌頭，鎖住嘴唇，除了隨意吃喝外，不要多事。\n\
    \ 范仲淹立即也回寫了一篇同樣題目的〈靈烏賦〉給梅堯臣，其中「憂於未形，恐於未熾」，表示烏鴉縱使因報兇而使自己折翼、被烹，也不願隱瞞兇訊而給人帶來災禍，牠要在災禍未成形時就表示憂慮，烈火未熾時就表示恐懼，他在賦中斬釘截鐵的寫道，無論如何他都要堅持正義，堅持真理，不管人們怎樣厭惡烏鴉的啞啞之聲，他始終都是「寧鳴而死，不默而生」。\n\
    （改編自《1 分鐘閱讀 香港電台第一臺》）"
