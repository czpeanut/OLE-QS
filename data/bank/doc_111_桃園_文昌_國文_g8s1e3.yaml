    \ 撇開近人不談，在古代從容、悠閒的農業社會裡，就有許多懂得珍惜生命、善於利用瑣碎時間的哲人。陶淵明曾經說過：「盛年不重來，一日難再晨，及時當勉勵，歲月不待人。」千字文中也有「尺璧非寶，寸陰是競」的格言。而宋代大儒歐陽修，更是一個善於利用零碎時間的生活藝術家。他常利用「三上」的工夫構思文章，何謂「三上」？那便是「枕上、廁上、馬上」。生活在今天的我們，如果每天也能利用這些短暫的時間，有恆地記誦一首唐詩、宋詞、一句格言或背幾個英文單字，一年下來，該有多少的收穫啊！\n\
    \ 有一個發人深省的比喻：在一個空無一物的箱子裡，我們最初可以放進一些大石頭，等到再也放不進大石頭時，剩下的空隙，我們可放進不少小石頭；當小石頭已放滿時，還可容納許多細沙；等到細沙也把箱子裡所有的空間填實了，我們仍可再注入不少清水……。\n\
    \ 如果我們每天的二十四小時，就是這口大箱，而我們吃飯、睡覺、洗澡、上學、辦公、休閒、沉思的時間，就相當於箱裡大大小小的石頭，那麼，仍有不少零星、分散的空隙，可供我們完成許多事務。能不能掌握、利用它們，讓每天的生活更加充實，就全靠我們自己了。\n\
    \ 積沙能夠成塔，集腋可以成裘。零碎的時間，應該是生命中的碎珠、沙金、片玉，能勤於撿拾，並集合它們，那的確是一宗可觀的財富！\n陳幸蕙〈生命中的碎珠〉"
