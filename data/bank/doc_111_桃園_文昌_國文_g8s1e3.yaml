  stem: 「范仲淹為了自己濟世的理想，即便賠上自己的前途也要站穩立場，絕不妥協。我們可以用成語□□□□來形容之，但我們是否也應該反思，所謂『智者千慮，必有一失。』，即便□□□□對范仲淹來說是重要的價值，但它並非唯一的價值，因為沒有所謂的絕對正確，在特定的脈絡下都有可能和其他人的正確發生衝突，所以必須時時刻刻注意這份價值，保持動態修正，以和世間取得平衡。」上文中□□□□宜填入下列何者？
