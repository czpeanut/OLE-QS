- id: doc_113_高雄_英明_自然_g9s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 有關常用電池的性質，下列敘述何者錯誤？
  options:
  - label: A
    content: 鉛蓄電池充電時，電池的負極要接外電源的負極
  - label: B
    content: 鹼性電池的電解液可使用氫氧化鉀
  - label: C
    content: 乾電池的鋅殼為負極，中間碳棒為正極
  - label: D
    content: 搭乘飛機時，可以託運鋰離子電池。
- id: doc_113_高雄_英明_自然_g9s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: '下列關於臺灣在冬季和夏季盛行的季風之敘述，哪些正確？

    甲.東北季風因為經過臺灣東北方的海面，為臺灣全島帶來豐沛的雨量；

    乙.夏季西南季風為臺灣帶來溼熱的天氣型態；

    丙.夏季季風主要源自於高氣壓，冬季季風主要源自於低氣壓；

    丁.西南沿海處於東北季風背風面，故主要在冬季晒鹽。'
  options:
  - label: A
    content: 甲丙
  - label: B
    content: 乙丁
  - label: C
    content: 甲乙丙
  - label: D
    content: 甲乙丁。
- id: doc_113_高雄_英明_自然_g9s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 下列關於臺灣常見的災變天氣敘述，何者正確？
  options:
  - label: A
    content: 五～六月，太平洋暖氣團籠罩臺灣，形成梅雨
  - label: B
    content: 颱風主要發生在七～九月，常帶來強風、豪雨，甚至暴潮而引發災害
  - label: C
    content: 冬季寒流來襲，是受到強烈太平洋冷氣團的影響
  - label: D
    content: 臺灣的年平均降雨量比世界平均值高，所以不容易發生乾旱。
- id: doc_113_高雄_英明_自然_g9s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 下列有關颱風的敘述，何者正確？
  options:
  - label: A
    content: 緊鄰颱風中心的邊緣是風雨最強的區域
  - label: B
    content: 颱風螺旋狀雲帶的外圍風速最強
  - label: C
    content: 當颱風的暴風半徑觸及陸地時，稱為颱風登陸
  - label: D
    content: 颱風是低氣壓系統，北半球的颱風是順時鐘旋轉。
