- id: doc_113_高雄_英明_自然_g9s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 帶有5 庫侖的電子通過電池時，獲得30 焦耳的電能，請問此電池的電壓為多少伏特？
  options:
  - label: A
    content: '1.5'
  - label: B
    content: '3'
  - label: C
    content: '4.5'
  - label: D
    content: 6。
- id: doc_113_高雄_英明_自然_g9s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '相同材質的導線越細，電阻越大，而在相同的電流下，電阻越大，產生的熱效應也越大。隨著3C 家電產品增加，家庭用電需求攀升，已知導線可承載的最大電流量與其線徑大小有關，如右表。若現今住家要更換新導線，會使用較粗線徑的導線以保安全，請推測其主要原因為何？


    | 導線直徑（mm） | 最大電流量（A） |

    | :---: | :---: |

    | 1.6 | 13 |

    | 2.0 | 18 |'
  options:
  - label: A
    content: 導線越粗，在裝置線路時比較不易斷裂
  - label: B
    content: 導線越粗，較不會因為線路過熱而燒毀
  - label: C
    content: 較粗的導線比較容易製造
  - label: D
    content: 越粗的導線用電量越高，電器運作效果越佳。
- id: doc_113_高雄_英明_自然_g9s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 有關家庭用電的敘述，下列何者正確？
  options:
  - label: A
    content: 使用電器時，電路中的電流大小不因時間而改變
  - label: B
    content: 各房間的電路為串聯
  - label: C
    content: 保險絲應與電路並聯，以保安全
  - label: D
    content: 同時使用的電器越多時，總開關處的電流會越大。
- id: doc_113_高雄_英明_自然_g9s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 在右圖的電路中，若以一條粗銅線連接a 點和b 點（圖中虛線），則下列敘述何者正確？
  options:
  - label: A
    content: 燈泡亮度將增加
  - label: B
    content: 流過燈泡的電流會增加
  - label: C
    content: 電流大部分會通過外接的粗銅線
  - label: D
    content: 電池的溫度維持常溫。
  assets:
