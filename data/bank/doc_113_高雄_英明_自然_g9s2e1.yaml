- id: doc_113_高雄_英明_自然_g9s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 右表為六款市售燈的電功率，白熾燈可以用同一欄中下方的任一較省電燈具來取代。阿明利用此表，計算出若將家裡原本使用的10 盞相同白熾燈更換為某種較省電燈具，一個月可節省電能90
    度（以每天使用10 小時，一個月使用30 天來計算），請推論阿明是想將何種白熾燈更換為哪一種較省電燈具？
  options:
  - label: A
    content: 將40 W 的白熾燈改為7 W 的燈具
  - label: B
    content: 將40 W 的白熾燈改為10 W 的燈具
  - label: C
    content: 將60 W 的白熾燈改為9 W 的燈具
  - label: D
    content: 將60 W 的白熾燈改為13 W 的燈具。
  assets:
