  - label: D
    content: 昇華。
  group_stem: '壬.請閱讀下列敘述後，回答下列49～50 題：

    小英家的浴室中有一面除霧鏡，如右圖所示，此除霧鏡需插電才能正常使用除霧功能，其所消耗的電功率為10 瓦特。這種鏡子能夠除霧的原因，是因為其鏡面背後有連接鎳鉻金屬薄片的電路，經通電後，鎳鉻金屬發熱使鏡子的表面溫度升高，並維持在50℃，如此可去除附在鏡面上的細小水滴，而使鏡子可以一直保持清晰明亮。'
  shared_asset: g1_49_50
