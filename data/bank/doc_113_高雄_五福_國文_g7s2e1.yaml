- id: doc_113_高雄_五福_國文_g7s2e1_s5_8
  section: 5
  number: 8
  type: single
  page: 5
  stem: 根據文章，AI 技術對未來就業市場的主要影響是什麼？
  options:
  - label: A
    content: 完全取代所有工作崗位
  - label: B
    content: 取代重複性工作並創造新的職業機會
  - label: C
    content: 降低就業人員的平均薪資
  - label: D
    content: 提升就業人員的最高學歷。
  group_stem: '(丁)

    人工智能（AI）技術的快速發展正在深刻改變全球就業市場的格局。隨著AI 在各行各業的應用日益普及，許多傳統工作崗位面臨被自動化取代的風險，同時也催生了新的職業機會。根據麥肯錫全球研究院的報告，到2030
    年，全球可能有超過8 億個工作崗位受到自動化的影響。這意味著，未來就業市場將更加注重高技能、創造力和適應能力。AI 的應用不僅改變了工作內容，還重新定義了職場競爭力，要求勞動者具備跨領域的知識和技術能力。

    AI 對就業市場的影響主要體現在兩個方面：一是自動化取代重複性工作，二是創造新的職業機會。在製造業、物流業和服務業等領域，AI 技術已經開始取代一些重複性高、技術含量低的工作。例如，自動化倉儲系統和無人駕駛技術正在減少對人工勞動的需求。然而，AI
    的發展也帶來了新的職業機會，例如數據科學家、AI 工程師、機器學習專家等。這些新興職業要求勞動者具備高度的專業知識和技術能力，並且能夠不斷學習和適應新技術。

    AI 的普及還改變了職場技能的需求結構。未來，勞動者不僅需要具備專業技術能力，還需要擁有跨學科的知識和軟技能，例如創造力、批判性思維和溝通能力。AI 可以處理大量的數據和複雜的計算任務，但在情感理解、創意設計和戰略決策等方面，人類仍然具有不可替代的優勢。因此，未來的職場競爭將更加注重綜合能力的培養。教育體系和職業培訓機構也需要相應調整，以幫助勞動者適應這一變化。

    儘管AI 技術帶來了許多挑戰，但它也為就業市場提供了新的可能性。例如，AI 可以幫助企業提高生產效率，降低成本，從而創造更多的經濟價值和就業機會。此外，AI
    技術的應用還能夠改善工作環境，減少危險性和重複性工作，提升勞動者的工作滿意度。總體而言，AI 對未來就業市場的影響是雙重的：一方面，它可能導致某些工作崗位的消失；另一方面，它也為勞動者提供了新的職業發展機會。關鍵在於如何通過教育和培訓，幫助勞動者適應這一變革，並充分利用AI
    技術帶來的機遇。

    (DeepSeek AI 對未來就業市場的影響)'
