    「好吧，就是這樣辦！」他跟自己說。他已經想出一個解決的辦法，下定決心要這樣辦，而且越快越好！一點點都不要再延誤了！即使這是件十分可怕的事！他立刻放下碗筷，急忙衝出廚房，衝進阿麗的房間。他決心下手掐死嬰兒，然後嫁禍阿麗，一口咬定是阿麗掐死的，阿麗又不會辯白，她沒辦法指明什麼。這真是天衣無縫，神不知鬼不覺，他一定要這樣做。阿麗是個瘋子，瘋子把一個嬰兒掐死，不是什麼大驚小怪的事。他一定要這樣做！黑面慶仔衝進阿麗的房間，他的雙手顫抖得更厲害。阿麗與嬰兒都還沉沉睡著，表情都很安詳，純粹與世無爭的安然自若。純粹潔白無瑕的了無遺憾。黑面慶仔的心裡不禁一陣抽搐，手抖得更是厲害。原來瘋子與嬰兒都是這樣清潔無辜一塵不染的啊！他們什麼都不知道，什麼都沒有做，什麼念頭都沒有，他們乾乾淨淨的躺在那裡，坦然的入睡，睡得香甜，呼吸勻稱，眉目開朗，怎麼可以因為自己在人世間受到困擾，就要他們的命？怎麼可以這樣？但是，他拚命告訴自己，這是不得已的，嬰仔，你不幸生在這裡，不幸這樣出生，這是命，你只好認命了！

    我如果不這樣，我就無法平靜的過日子，你要生存，我也要生存，要怪，你去怪你那不負責任的父親，你不要怪我！這都是命！他慢慢移近床邊，慢慢伸出顫抖的雙手，慢慢把手伸近嬰兒脖子。手發抖，腳發抖，身體也抖個不停，有幾次想頹然放手，但心裡一直有一個聲音在支持自己，叫自己咬緊牙關，鼓起勇氣，一定要這樣做，不可半途而廢。嬰兒的脖子短，又仰臥在木板床上，黑面慶仔必須一隻手擠進嬰兒後頸與床面之間，才能掐住嬰兒的脖子。誰知道他的雙手抖動得太過厲害，在沒握住嬰兒後頸以前，就把嬰兒吵醒了。小傢伙不分青紅皂白哇──哇──哭得厲害，使得黑面慶仔更是心慌意亂，不管三七二十一，雙手伸了過去……
    實在抖得太厲害了，使不上力，他一隻手掐住嬰仔的後腦勺，一隻手卻掐住嬰兒下巴。

    嬰兒使勁的哭。哇──哇──哭得悽慘。這時阿麗突然翻坐起來，看到黑面慶仔全身發抖的樣子，驚恐的尖叫一聲，眼裡露出十分畏懼的神色，身體不斷的往後縮，縮，縮，縮到床角──這個使黑面慶仔怦然憶起那次他毆打阿麗以後的情景：穿一身豔紅衣褲的阿麗向後縮，縮，縮，縮到牆角發抖。然後打翻他手上的鹹蘿蔔粥，然後奪門而出，然後一身寂寞的紅，奔竄於一大片無涯無際的青翠之中。阿麗出去以後，第二天黃昏才回來，卻在屋前屋後躲躲藏藏，低聲哀叫。黑面慶仔一出去，她就悸怖萬分的後退，同時做出隨時可以奔跑的姿勢，一看就知道她對於黑面慶仔，對於自己的父親，起了很大戒心，她怕他，就像小動物害怕人類摧殘牠們一樣。黑面的只好退進屋裡，從狹小的土牆窗口看她。這時她又出來，並且低聲哀叫。黑面的又出去，她又驚恐的後退。如此三、四次，黑面慶仔突然想起一件事，急急衝進廚房，盛了滿滿一大碗公中午吃剩的冷冷的地瓜湯，拿來放在門前空地上，人又退回去，躲在狹小的窗口後面看她。

    阿麗看到地瓜湯，好像一萬年沒吃過東西似的，衝出來，站在那裡，貪饞的嚥著口水。她驚慌地懷有戒心地看看四周 ，發現沒有什麼危險，立刻不要命的快速捧了起來，手嘴並用，狼吞虎嚥，像一隻饑餓的遭人遺棄的狗！黑面慶仔在狹小的窗口後面，淚如雨下。毫無疑問的，她受傷了，淨潔無瑕的心靈受到極大的傷害，這樣的傷害對她是不公平的，她什麼都不知道，什麼念頭都沒有，該打的，該殺的，是那些糟蹋她的人，怎麼可以那樣打她？怎麼可以把她關起來？人是神管的，神都可以讓她無憂無愁無煩惱的活著，我黑面的做人阿爸的，怎麼可以對她那樣？

    這之後，黑面慶仔用盡心思，極力安撫，像馴服一頭野生動物那樣，花了好幾天，才使她沒有畏懼。自此之後，他再也不敢責打阿麗，他怕看到那張驚恐面孔，那是罪惡！對神明來說，那是罪惡。現在，阿麗又出現那種驚恐的表情，黑面慶仔看了心裡不由得一陣顫慄。她們是多麼無辜啊！嬰仔既然已經被生下來了，一個生命已經開始，清清白白乾乾淨淨一無所知的開始，你又怎麼可以叫他結束？誰給了你這麼大的權利？一枝草一點露，不管是貓是狗，它們會有自己的天地！
    阿麗縮在牆角，縮成一團，畏懼的眼神劍一樣的射過來，射進黑面慶仔的心底。黑面的僵住了，他感到十分狼狽，有那樣的念頭，有那樣的行動，這些，都使他無法面對發瘋的女兒。他的手還放在嬰兒的脖子與後腦上，卻不知為什麼，那雙手已不再顫抖。孩子還是哭得厲害，他雙手往下一滑，對阿麗露出一個慈祥的微笑，把嬰兒抱了起來。「不要怕，阿麗，嬰仔哭，阿爸來抱他！」

    他抱著嬰兒，面向阿麗，上下前後輕輕搖動起來，面部自然的保持著慈祥的微笑，邊搖邊說：「惜，惜，不要哭，惜，惜惜！」搖一會兒，嬰兒不哭了，睜大一雙清澈的大眼睛，靜靜的望著他。他始終不知道，他講的話阿麗是不是聽懂，但是，很顯然的，阿麗畏懼的表情消失了，她笑起來，文文地笑，一貫的，文文地笑。他把嬰兒輕輕放在床上，伸手指指阿麗的胸前，又摸摸自己的乳部，又指指嬰兒，嘴唇尖尖的啜起來，做一個吃奶的姿勢，阿麗文文地笑，爬過去，抱起嬰兒，動手去解自己胸前的鈕釦。黑面慶仔掉頭就走，走出門外，看到一片無涯無際的翠綠田野在豔陽下亮麗的舒展開來。

    (洪醒夫 黑面慶仔)'
