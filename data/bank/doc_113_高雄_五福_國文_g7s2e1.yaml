- id: doc_113_高雄_五福_國文_g7s2e1_s5_1
  section: 5
  number: 1
  type: single
  page: 4
  stem: 四叔為什麼選擇成為刻印學徒？
  options:
  - label: A
    content: 他對刻印藝術有濃厚的興趣
  - label: B
    content: 他因身體殘疾和良好的毛筆字基礎，選擇了刻印這條路
  - label: C
    content: 他的家人強迫他學習刻印，以謀求生計
  - label: D
    content: 他偶然發現自己有天賦，決定從事刻印工作。
  group_stem: "(甲)\n    他用生命刻印、蓋印，一顆顆鮮明血紅的印章。\n    四叔是苦命的人。週歲的時候跟他孿生的弟弟一起得了肺炎，送到小鎮大街醫生處，他可憐的弟弟不幸夭折，但更可憐的是僥倖活下來的他。那昏庸的全能醫師，在治療過肺炎後，很慷慨地操刀順便為他割去腳上的爛瘡，一刀把大腿上的筋也割斷了。一直到一歲半的時候，大他九歲的我的父親奇怪別人的弟弟都會走路，唯獨他弟弟不會，才發現原來右腳整個萎縮、殘廢了。他不識字的母親──我的祖母──因為驟失兒子而墜入一種異常的心理狀態，一口咬定是那早生半個小時的孿生哥哥剋死的，從此視他為眼中釘，讓他跟著他的祖母。\n\
    \    從小四叔就扶著一張木頭椅子自己走路，一歪一歪地像印章般在地上蓋，然而卻是低賤、不為人愛的印材。光復後，跟著家人從宜蘭搬到花蓮，他才拄著一支枴杖跟小他三、四歲的孩子們一起開始讀國民小學。他的母親經常給他有別於其他兄弟姊妹的便當。有時甚至要他自己煮飯，弄菜，準備自己的三餐，彷彿他比別人多一隻手，而不是少一隻腳。但四叔卻很少抱怨，拄著枴杖，印章般一記一記地往地上蓋。\n\
    \    國小畢業四叔考上了商校，才讀兩個月，有一天我的祖母把他小學領的一些模範生獎狀、書法比賽獎狀全燒掉，要他輟學學藝。因著自己的殘缺與良好的毛筆字基礎，他選擇到街上一家刻印店當學徒。半年後，帶著一包新買的刻刀，隻身到台東謀生。過了一年，父親在家鄉市區戲院旁一家診所前幫他找到一個位子，就在騎樓下擺起自己的刻印攤。那好心的醫生不收他分文租金。這年四叔二十歲，我五歲。\n\
    \    我清楚地記得搬到我家與我們同住的四叔他秀麗工整的毛筆字。刻印前，他先在一張薄紙上用毛筆把字寫下，然後沾水把字印在塗上朱墨的印材上（有時候也用毛筆直接把字反寫在欲刻的印材上），接著用長長短短的小木塊，把印材夾緊在刻印用的小木座上。他的刻刀有四、五支，有的用來刻牛角、象牙，有的用來刻玫瑰石、玉石，大部分時候都用同一支刻木頭印章。他並沒有因木頭的平庸減少他的專注、用力。刻好以後，他總是很高級地用手沾一層薄印泥把印章印出來。他準備了一本簿子，專門收集他刻過的圖章印子。\n\
    \    有一天，他突然夢見自己會騎車。他到車店買了一部低座的腳踏車，花了一個晚上的時間用鐵絲把石塊綁在右腳踏板上，代替他萎縮的腳，第二天請父親幫他推車學騎。沒有人能告訴他怎麼用一隻腳來騎、來平衡。但他自己辦到了。他在車上做了兩個圈環掛他的枴杖，右腳踏板加上請人特製的鐵塊。好幾次我騎他的車，不小心被右邊的踏板重擊到。\n\
    \    然後他結婚了，新娘是他阿姨的女兒。他用腳踏車載著我的嬸嬸上坡下坡，四處遊玩。我的堂弟、堂妹們一個接一個出生。然而由於近親通婚，每個小孩在智力或性格上都與一般人略異，但他還是一個一個生出來，一個一個撫養長大，就像他刻的印章。沉重的生活負擔逼使他必須加倍時間工作，為了孩子，他經常面有慚色地告貸於親友間。他大概希望他的孩子有一天能出人頭地，突破他生活的模式吧。\n\
    \    他兩個大的女兒十五歲不到就嫁人了。我的最小的兩個堂弟、堂妹，今年剛從國中啟智班畢業，女的幫人做美容，男的跟他爸爸學刻印。那一天走過戲院邊，我看到他拿著掃把、抹布幫醫生掃騎樓、擦椅子，就像幾十年來他爸爸做的那樣。\n\
    \    四叔是苦命的人。他用生命刻印、蓋印，一顆顆鮮明血紅的印章。\n(陳黎 四叔)"
