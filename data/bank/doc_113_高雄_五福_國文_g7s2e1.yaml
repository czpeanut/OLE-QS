  stem: 為什麼百姓無法「負鍾而走」？
  options:
  - label: A
    content: 聲音太吵
  - label: B
    content: 體積太大
  - label: C
    content: 味道難聞
  - label: D
    content: 惡人奪之。
  group_stem: '(丙)

    範氏之亡(1)也，百姓有得鍾(2)者，欲負而走，則(3)鍾大不可負(4)；以錘(5)毀之，鍾況然(6)有聲。恐人聞之而奪己也，遽(7)掩其耳。惡(8)人聞之，可也；惡己自聞之，悖也！

    (呂不韋 掩耳盜鈴)


    注：(1)亡，逃亡。(2)鍾：古代的打擊樂器，「鍾」通「鐘」。(3)則：但是。(4)負：用背馱東西。(5)錘：槌子或棒子。(6)況然：形容鐘聲。(7)遽：立刻。(8)惡:害怕。'
