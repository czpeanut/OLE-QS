- id: doc_112_嘉義_北興_社會_歷史_g9s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 阿駿每年都很期待聖誕節時收到聖誕老公公送的禮物，後來知道這是基督教為了紀念耶穌降生的節日，為了更加了解基督教的起源，阿駿上網查了一些資料；請問他所找到資料中，下列哪些是正確的？(甲)羅馬帝國初期，耶穌在巴基斯坦宣揚平等博愛的理念(乙)新約聖經是由耶穌親自記錄傳教的過程(丙)與猶太教一樣都是信奉上帝耶和華為唯一真神(丁)因批評猶太社會的腐敗，結果被猶太人釘死於十字架
    (戊)西元紀年的由來與耶穌的誕生年有關(己)基督教創立初期受羅馬帝國迫害，原因除了與羅馬多神信仰不同外，還有信徒拒絕向羅馬皇帝的畫像膜拜
  options:
  - label: A
    content: 甲丙丁戊
  - label: B
    content: 甲乙丙戊己
  - label: C
    content: 乙丙丁戊
  - label: D
    content: 丙戊己。
- id: doc_112_嘉義_北興_社會_歷史_g9s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 有位中國唐代時期的商人經由絲路前往西域經商，他最後抵達了「拂菻國」的首都，並參觀了當地基督教信仰的中心–聖索菲亞大教堂；請問，這個「拂菻國」應該是指西方歷史上的哪一國家？
  options:
  - label: A
    content: 鄂圖曼帝國
  - label: B
    content: 阿拉伯帝國
  - label: C
    content: 塞爾柱帝國
  - label: D
    content: 拜占庭帝國。
- id: doc_112_嘉義_北興_社會_歷史_g9s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 湯姆是中世紀初期生活於西歐的農民，請問下列何種情形不會出現在他生活的年代？
  options:
  - label: A
    content: 此時期的西歐局勢動盪不安，湯姆全家已經歷過多次戰亂
  - label: B
    content: 湯姆上個月才到村莊的教會參加好友班傑明的婚禮，沒想到這個月居然在同一個地方參加好友亞瑟的喪禮，讓他感慨人生的無常
  - label: C
    content: 湯姆的大哥與好友剛成立一家貿易商行，因資金不足，所以湯姆拿出多年積蓄幫助大哥度過難關
  - label: D
    content: 湯姆聽鄰居說，國王與羅馬教宗又發生衝突，雙方關係十分緊張。
- id: doc_112_嘉義_北興_社會_歷史_g9s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 小惠喜歡透過旅行認識這個世界，每次在出發旅行之前，都會先收集許多資料，讓自己在旅行中可以更融入當地的風俗文化；以下是她今年預計要前往旅行的某城市簡介：「此城市地理位置優越，既位於歐亞兩洲交界處，又位居黑海通往地中海航道的必經之地，曾經先後作為兩個大帝國的首都長達一千六百多年之久。城內有著兩大帝國所修築的古城牆、皇宮，以及宏偉的基督教教堂與清真寺等文化遺產，展現了這座城市輝煌悠久的歷史。」根據內容判斷，小惠將前往旅行的城市最可能是下列何者？
  options:
  - label: A
    content: 佛羅倫斯
  - label: B
    content: 伊斯坦堡
  - label: C
    content: 麥加
  - label: D
    content: 耶路撒冷。
- id: doc_112_嘉義_北興_社會_歷史_g9s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 歐洲宗教改革後，基督教出現了多個新的教派，統稱為「新教」；這些教派雖然教義各有不同，但也有一些共同理念，下列何者為當時新教的共同理念？
  options:
  - label: A
    content: 肯定贖罪券的作用
  - label: B
    content: 反對君主權力高於教會
  - label: C
    content: 鼓吹成立長老教會
  - label: D
    content: 否定教宗的權威。
- id: doc_112_嘉義_北興_社會_歷史_g9s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '下列表格比較的是中世紀羅馬公教與希臘正教的差異。請問哪一項目出錯了？


    | 項目 | 希臘正教 | 羅馬公教 |

    | :--- | :--- | :--- |

    | 傳布地區 | 拜占庭帝國 | 西歐各國 |

    | 信仰中心 | 君士坦丁堡 | 羅馬 |

    | 政教關係 | 政教合一 | 政教分離 |

    | 分裂時間 | 16 世紀 | 16 世紀 |'
  options:
  - label: A
    content: 傳布地區
  - label: B
    content: 信仰中心
  - label: C
    content: 政教關係
  - label: D
    content: 分裂時間。
- id: doc_112_嘉義_北興_社會_歷史_g9s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 小傑是北興國中三年級學生，明年即將參加國中教育會考，他很後悔以前沒有認真上歷史課，覺得非常對不起歷史老師，所以決定發憤圖強，好好複習歷史科。最近複習中國史，讀到一段有關唐代對外戰爭而間接使得造紙術西傳的歷史，戰爭發生於唐玄宗在位時，唐代大將高仙芝率軍與大食軍隊在中亞怛羅斯交戰；小傑忘了「大食」是西方歷史上的哪個國家，請你幫他指出正確答案為下列何者？
  options:
  - label: A
    content: 東羅馬帝國
  - label: B
    content: 鄂圖曼帝國
  - label: C
    content: 阿拉伯帝國
  - label: D
    content: 塞爾柱帝國。
- id: doc_112_嘉義_北興_社會_歷史_g9s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 16 世紀有位作家被稱為英國文學史上最傑出的戲劇家，也是西方文藝史上最傑出的作家和文學家之一，他以英文創作了許多的作品，包括戲劇、十四行詩等；《羅密歐與茱麗葉》是其作品中相當著名的愛情悲劇故事，內容描述的是兩位青年男女相戀，卻因家族仇恨而遭不幸，最終兩家和好的故事。請問，此位作家應是下列何人？
  options:
  - label: A
    content: 佩脫拉克
  - label: B
    content: 莎士比亞
  - label: C
    content: 但丁
  - label: D
    content: 薄伽丘。
- id: doc_112_嘉義_北興_社會_歷史_g9s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 約翰是中世紀西歐的修士，他的日常作息遵循教會的規定，請問：下列何者不是他身為修士的分內工作？
  options:
  - label: A
    content: 向上帝禱告
    asset:
      key: optA
      file: doc_112_嘉義_北興_社會_歷史_g9s1e2/1_9_optA.png
  - label: B
    content: 保護莊園安全
    asset:
      key: optB
      file: doc_112_嘉義_北興_社會_歷史_g9s1e2/1_9_optB.png
  - label: C
    content: 抄寫經書
    asset:
      key: optC
      file: doc_112_嘉義_北興_社會_歷史_g9s1e2/1_9_optC.png
  - label: D
    content: 主持婚禮
    asset:
      key: optD
      file: doc_112_嘉義_北興_社會_歷史_g9s1e2/1_9_optD.png
- id: doc_112_嘉義_北興_社會_歷史_g9s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 西元 4 世紀末，有位羅馬帝國皇帝陸續發布一系列命令，內容包括：「禁止古羅馬傳統宗教的獻祭儀式，拆除羅馬元老院中的勝利女神的祭壇，將古羅馬宗教聖日改為工作日，關閉所有羅馬神廟，處罰援助異教者，最後甚至視古代奧運會為異教祭典而將之取消；另外制定極其嚴苛的刑法，如繼續異教崇拜者，其罪等同於謀反和瀆神一般的死罪。」請問，這位羅馬皇帝為何人？
  options:
  - label: A
    content: 狄奧多西
  - label: B
    content: 君士坦丁
  - label: C
    content: 查士丁尼
  - label: D
    content: 屋大維。
- id: doc_112_嘉義_北興_社會_歷史_g9s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 《天方夜譚》又稱為《一千零一夜》，是有名的故事集，其中收錄有「阿里巴巴與四十大盜」、「阿拉丁神燈」、「辛巴達歷險記」等。相傳《一千零一夜》名稱的由來與古代西亞某國王有關，國王為報復妻子的不貞，每日娶一少女，隔天早晨就殺掉；最後，負責此事的大臣之女自願嫁給國王，婚禮後每夜都講述精彩的故事，國王因愛聽故事而不忍殺她；最後講了一千零一夜的故事，國王終於被感動，與她白首偕老。請問：這部故事集收錄的內容可反映出哪一宗教的社會？
  options:
  - label: A
    content: 伊斯蘭教
  - label: B
    content: 基督教
  - label: C
    content: 佛教
  - label: D
    content: 猶太教。
- id: doc_112_嘉義_北興_社會_歷史_g9s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 拜占庭帝國衰亡後，學者為躲避戰禍西遷，對歐洲歷史產生了何種影響？
  options:
  - label: A
    content: 使原本分裂的基督教勢力度團結
  - label: B
    content: 希臘正教的勢力深入西歐
  - label: C
    content: 帶動了義大利興起一股研究古希臘、羅馬文化的風氣
  - label: D
    content: 歐洲的政治、社會因遠離戰亂再度出現大一統的帝國。
- id: doc_112_嘉義_北興_社會_歷史_g9s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 歷史上有一位國王因為想另娶他人，卻因為元配為西班牙公主，羅馬教會害怕得罪西班牙，遲遲不肯同意國王原本的婚姻無效，最後國王憤而脫離羅馬教會另立教派。請問：有關這個教派的敘述，下列何者正確？
  options:
  - label: A
    content: 由英王亨利七世所創
  - label: B
    content: 此教派隨著馬偕傳入臺灣
  - label: C
    content: 此教派屬於新教，因此在教義上與羅馬公教有極大的不同
  - label: D
    content: 為政教合一的體制。
- id: doc_112_嘉義_北興_社會_歷史_g9s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 基督教是歐洲文明的重要元素，現今歐洲大部分的國家在宗教信仰上仍深受基督教或天主教的影響，但回顧歷史發展，仍可發現有部分歐洲地區也留下了有關伊斯蘭文化的遺蹟；請問，若想參訪歐洲的伊斯蘭文化遺蹟，可以前往右圖中的哪些地區？
  options:
  - label: A
    content: 甲己
  - label: B
    content: 丙戊
  - label: C
    content: 乙庚
  - label: D
    content: 甲戊。
  assets:
  - key: s1_14_f1
    kind: figure
    file: doc_112_嘉義_北興_社會_歷史_g9s1e2/s1_14_f1.png
- id: doc_112_嘉義_北興_社會_歷史_g9s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 阿拉伯帝國的阿拔斯王朝，網羅學者有系統地將西方典籍翻譯成阿拉伯文，被稱為百年翻譯運動。除了保存在首都圖書館以外，也將複本推廣到帝國各處，使阿拉伯帝國首都成為當時學術的中心。請問：這場翻譯運動對日後歐洲造成哪一影響？
  options:
  - label: A
    content: 造紙術的西傳
  - label: B
    content: 文藝復興的出現
  - label: C
    content: 十字軍戰爭的爆發
  - label: D
    content: 拜占庭帝國的衰亡。
- id: doc_112_嘉義_北興_社會_歷史_g9s1e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 右方的畫作所描繪的內容為 13 世紀阿拉伯學者在圖書館的圖像；請依據畫作描繪的年代判斷，右圖中的學者最可能從事以下的哪些活動？(甲)翻譯古羅馬典籍(乙)討論天文學(丙)誦讀舊約聖經(丁)翻譯幾何原本(戊)研究解剖學
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙丙丁戊
  - label: C
    content: 甲乙丁戊
  - label: D
    content: 乙丁戊。
  assets:
  - key: s1_16_f1
    kind: figure
    file: doc_112_嘉義_北興_社會_歷史_g9s1e2/s1_16_f1.png
- id: doc_112_嘉義_北興_社會_歷史_g9s1e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 小茹在研究藝術史的時候發現，在 15 世紀之前找不到留存至今的肖像畫，畫作主題都是《聖經》故事，但在 15 世紀中期以後，開始出現肖像畫主題，到 16
    世紀肖像畫已變成常見題材。請問：此種轉變和下列何者最有關聯？
  options:
  - label: A
    content: 人文主義的影響
  - label: B
    content: 宗教戰爭時的破壞
  - label: C
    content: 伊斯蘭勢力的擴張
  - label: D
    content: 日耳曼人改信基督教。
- id: doc_112_嘉義_北興_社會_歷史_g9s1e2_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 「明代後期，不少耶穌會的傳教士來到中國，為了與中國士人建立關係以順利傳教，他們介紹了許多當時西方知識作為傳教手段，也因此開拓了中國士人的視野。」請問，當時這些傳教士自歐洲來華的主要背景為何？
  options:
  - label: A
    content: 為了與不斷擴張的伊斯蘭勢力對抗，擴張傳教據點
  - label: B
    content: 歐洲國家為拓展東亞貿易，利用宗教力量建立據點
  - label: C
    content: 面對新教的挑戰，為重塑威望而推動改革，並積極傳教
  - label: D
    content: 受科學革命影響，主動傳播科技。
- id: doc_112_嘉義_北興_社會_歷史_g9s1e2_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 西元 1145 年，法國教士聖伯納（St. Bernard）為激勵士氣，針對當時局勢發表了一篇演說，部分內容如下：「……真理的寶座已被異說占據了……聽我說話的人們，穿上你們那刺不透的盔甲……戰勝那些異教徒，洗清你們的罪孽，奪回聖地將是你們懺悔的獎賞。」演說中所提「異說」應是指哪一種宗教？
  options:
  - label: A
    content: 祆教
  - label: B
    content: 伊斯蘭教
  - label: C
    content: 佛教
  - label: D
    content: 印度教。
- id: doc_112_嘉義_北興_社會_歷史_g9s1e2_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 大赦指的是天主信徒在領受聖事後，雖然罪過已獲得赦免，但仍然會受制於罪過遺留下的思想或行為，被稱為「暫罰」，這時候必須透過教會頒布大赦，給信徒分施基督及歷代聖人的功勞寶藏，使自身的暫罰得以在神前獲得免除。各時代對於如何抵銷暫罰各有不同的詮釋，中世紀後期，教會為籌措資金，開始販售大赦證明書（由羊皮紙製成的「紀念證書」），至此大赦淪為教會的斂財工具。請問：上述事件造成下列何者的發生？
  options:
  - label: A
    content: 基督教分裂為天主教與東正教
  - label: B
    content: 教宗要求十字軍出征
  - label: C
    content: 開始宗教改革
  - label: D
    content: 教會禁止教徒直接閱讀《聖經》。
