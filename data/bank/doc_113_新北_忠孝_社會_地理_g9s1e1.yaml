- id: doc_113_新北_忠孝_社會_地理_g9s1e1_s1_19
  section: 1
  number: 19
  type: single
  page: 1
  stem: 「歐豬五國」也稱歐洲五豬，是對歐債危機中五個負債累累的國家的貶義稱呼。附圖為「歐豬五國」的分布圖，此五國皆有失業率上升、經濟成長緩慢的共通性，因此造成歐盟組織的經濟挑戰。由此分布圖可看出，「歐豬五國」大部分是屬於哪一地區的國家？
  options:
  - label: A
    content: 東歐
  - label: B
    content: 西歐
  - label: C
    content: 南歐
  - label: D
    content: 北歐
