- id: doc_113_新北_忠孝_社會_地理_g9s1e1_s1_22
  section: 1
  number: 22
  type: single
  page: 1
  stem: 鮭魚是全球熱銷的魚種之一，除了捕撈野生的鮭魚之外，近年來在海域進行箱網養殖的技術也日益成熟，其中挪威已成為世界鮭魚養殖的領先國家。附圖為挪威鮭魚養殖場分布區的地形示意圖，依據圖中資訊判斷，此海岸地形的成因為下列何者？
  options:
  - label: A
    content: 因板塊張裂而形成的裂谷地形
  - label: B
    content: 海底珊瑚礁因地形抬升而隆起
  - label: C
    content: 河川攜帶泥沙在沿海堆積而成
  - label: D
    content: 冰河侵蝕的U 型谷被海水淹沒
