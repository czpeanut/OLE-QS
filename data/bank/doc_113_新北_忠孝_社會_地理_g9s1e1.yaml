- id: doc_113_新北_忠孝_社會_地理_g9s1e1_s1_24
  section: 1
  number: 24
  type: single
  page: 1
  stem: 歐盟是由歐洲27 個國家所組成的區域經濟組織，影響範圍涵蓋歐洲40%以上的土地面積，以及70%以上的人口數。下列有關於歐盟合作模式的說明，何者正確？
  options:
  - label: A
    content: 所有的歐盟國家都使用共同的貨幣–歐元
  - label: B
    content: 所有的歐盟國家都簽署申根公約，開放邊境
  - label: C
    content: 歐盟各國的合作，主要只有經濟方面的合作
  - label: D
    content: 為了創造共同的市場，取消會員國之間的關稅
