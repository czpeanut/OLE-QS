- id: doc_113_新北_忠孝_社會_地理_g9s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 1
  stem: 平穩的海域及曲折多灣的海岸，為南歐提供了發展海運的絕佳條件。西班牙、葡萄牙都曾是昔日的海上霸權，希臘船隊在全球的航運業，更是保持領先的地位。請問，希臘的航運如此發達，主要是因為此區的海岸大多屬於哪一種類型？
  options:
  - label: A
    content: 沙岸
  - label: B
    content: 谷灣海岸
  - label: C
    content: 峽灣海岸
  - label: D
    content: 珊瑚礁海岸
