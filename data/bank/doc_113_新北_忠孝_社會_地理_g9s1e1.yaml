  section: 1
  number: 20
  type: single
  page: 1
  stem: 歐洲某國計畫在2030 年前，實現可再生能源佔能源供應總量42％以上的目標，其中綠能發電在電力供應中佔超過74％。其綠能發電主要靠北部的風力發電和南部的太陽能發電，預計會帶來龐大的經濟效益。根據上文，該國最有可能位在右圖的哪一個半島？
