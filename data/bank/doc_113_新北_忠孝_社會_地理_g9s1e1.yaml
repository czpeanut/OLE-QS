  section: 1
  number: 25
  type: single
  page: 1
  stem: 東歐的捷克靠著昔日共產時期奠下的工業基礎，以及多項的優越條件，成為新興工業國家，吸引全球知名企業進駐。台灣的宏碁、華碩、台達電、鴻海等科技大廠，也都有在捷克布局投資。請問捷克吸引許多企業到該國投資生產的條件「不」包括下列何者？
  options:
  - label: A
    content: 適中的地理位置
  - label: B
    content: 便利的海陸運輸
  - label: C
    content: 相對低廉的工資
  - label: D
    content: 歐盟會員國的身分
