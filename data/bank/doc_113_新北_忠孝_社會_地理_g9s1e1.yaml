  type: single
  page: 1
  stem: 呈上題，瓊斯在參加比賽的過程中，也發現山中有許多寬平的谷地，鐵、公路多沿谷地興建，成為南北交通的孔道。這些寬平谷地的形成，除與風化作用有關外，還與哪種作用較有關連性？
  options:
  - label: A
    content: 冰河侵蝕
  - label: B
    content: 斷層作用
  - label: C
    content: 溶蝕作用
  - label: D
    content: 河蝕作用
