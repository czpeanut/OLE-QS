  stem: 圖(四)是水循環示意圖，請問下列何項的敘述正確？
  options:
  - label: A
    content: 『A』是指大氣中的水氣以雨、雪、冰雹的形式向地面落下的現象，此現象稱為『降水』
  - label: B
    content: 『E』是指植物吸收土壤中的水分，經由莖、葉的氣孔向大氣擴散的現象，此現象稱為『蒸發』
  - label: C
    content: 雨水匯聚成為地表逕流的現象是指『B』
  - label: D
    content: 水循環的順序應該是：『C』→『D』→『B』→『A』。
