    content: A teenager might pay $35 for two days after June 1, 2025.
  group_stem: '(C)

    Join Us at the Sunny Festival!

    Date: June 15-17, 2025

    Place: City Square

    Get ready for the most exciting event of the year. The festival is for people
    of all ages. Whether you''re looking for some great music, tasty food, or just
    a fun day out with your family and friends, the Sunny Festival is the place to
    be! There are also lots of interesting activities for kids. Come and enjoy a wonderful
    day outdoors. Don''t miss out on this amazing event in June.

    Ticket Prices:

    • Adults (18+): $25 per day or $70 for a 3-day pass

    • Teenagers (13-17): $15 per day or $40 for a 3-day pass

    • Children (12 and under): Free

    ☆For tickets, the event schedule and more information, visit the website: https://www.sunnyfestival.com.

