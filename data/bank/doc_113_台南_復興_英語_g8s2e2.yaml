- id: doc_113_台南_復興_英語_g8s2e2_s6_4
  section: 6
  number: 4
  type: single
  page: 4
  stem: According to the reading, when you read while listening to music, what might
    happen?
  options:
  - label: A
    content: You may miss some parts of the music.
  - label: B
    content: Your brain pays full attention to both.
  - label: C
    content: It makes you a better listener.
  - label: D
    content: You can focus on two things well.
  group_stem: '(B)

    Do you read while listening to music? Do you watch TV while doing homework? If
    you have habits like these, you are a multitasker.

    Multitaskers can do different things at the same time. However, a psychologist,
    Thomas Lehman, believes people never really do more than one thing at once. For
    example, if you''re reading and listening to music, your brain is only paying
    full attention to one thing. You may miss some words in the song because you''re
    focused on the book. So even if it feels like you''re doing both things well,
    you''re actually just changing your focus from one thing to another.

    When people multitask, they often don''t notice what''s going on around them.
    For example, you may be talking to your friends, but they don''t seem to be really
    listening. Maybe they''re reading a message on their smartphone or listening to
    someone else and don''t hear what you are saying, so they might just give a response
    like "yeah" or "uh-huh." Lehman calls this "email voice". They sound like they''re
    listening, but they''re not really paying attention. It shows we may not talk
    or listen well when we''re doing more than one thing.

    Whether you''re studying, listening to music, or talking to a friend, it is better
    to pay full attention to one thing. This way, you are more likely to do a job
    well and be a good listener.

    📖 psychologist 心理學家 at once 同時 attention 注意 even if 即使 actually 實際上 multitask
    同時做多件事 notice 注意 seem 似乎 response 回應 whether 無論'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
