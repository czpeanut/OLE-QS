- id: doc_113_台南_復興_英語_g8s2e2_s6_1
  section: 6
  number: 1
  type: single
  page: 3
  stem: Which is NOT part of the "3 Rs"?
  options:
  - label: A
    content: Reduce
  - label: B
    content: Renew
  - label: C
    content: Recycle
  - label: D
    content: Reuse
  group_stem: '(A)

    Waste is a big problem for our environment. As more people live on Earth, more
    waste is produced. The waste can harm the land, air and water. It''s vital to
    reduce waste to keep our planet healthy.

    One way to make less waste is to follow the "3 Rs": Reduce, Reuse, and Recycle.
    Reducing means making less waste by choosing things with simple packaging. Reusing
    is to use items again instead of throwing them away. Recycling is turning old
    materials into new products, saving space in landfills.

    Another way to reduce waste is through composting. It is to turn food scraps and
    other organic waste into fertilizer for plants. Composting cuts down on the amount
    of waste going to landfills and keeps soil strong.

    People and governments around the world are helping by making rules about waste
    and encouraging people to join waste reduction programs. Teaching people about
    waste and how to deal with it may change how we think and act. By working together,
    we can make less waste and protect our planet for the future.

    📖 environment 環境 vital 重要的 planet 星球 packaging 包裝 space 空間 landfill 垃圾掩埋場 scrap
    廢料 organic 有機的 fertilizer 肥料 soil 土壤 government 政府 program 計劃'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
