    1. 未經甲方同意，乙方不得將房屋之全部或一部分轉租、出借或頂讓。

    2. 乙方於租賃期滿應即將房屋遷讓交還，不得向甲方要求遷移等任何費用。

    3. 房屋如有改裝之必要，乙方取得甲方同意後得自行裝設，但不得損害原有建築(不可裝訂破壞結構)

    上述條件均為雙方同意，恐口說無憑，爰立本契約貳份，各執一份存執，以昭信守。

