  group_stem: '《題組》：林美玉與方大明簽約，契約如下。


    房屋租賃契約

    立契約書人 出租人：林美玉(甲方)

    承租人：方大明(乙方)

    因房屋租賃事件，定立本契約，雙方同意之條件如下：

    第一條 房屋所在地及使用範圍：桃園市中壢區中強路 130 號

    第二條 租賃期限：自西元 2021 年 7 月 1 日至 2023 年年 6 月 30 日止，共計 24 個月。

    第三條 租金：每個月新台幣 10000 元整，乙方應於每月 5 日以前繳納。每次應繳納 1 個月份，並不得以任何理由拖延或拒繳。

    第四條 押金為 20000 元，約滿退租退還押金；租期內房東不得調漲房租；房客如果提前退租則不退押金。

