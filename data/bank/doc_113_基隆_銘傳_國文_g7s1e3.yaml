  stem: '小溪比冬天漲高了，遠遠看去，那個負薪者正慢慢地涉溪而過。啊！走在春水裡又是怎樣的滋味呢？或許那時候會恍然以為自己是一條魚吧？想來做一個樵夫真是很幸福的，肩上挑著的是松香，（或許還夾雜著些山花野草吧！）腳下踏的是碧色琉璃，（並且是最溫軟、最明媚的一種。）身上的灰布衣任山風去刺繡，腳下的破草鞋任野花去穿綴。

    《張曉風經典散文集》

    以上這段文字所使用的修辭技巧，不包括下列何者？'
