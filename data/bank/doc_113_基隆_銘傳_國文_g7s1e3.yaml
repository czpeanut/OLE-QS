  stem: '我們面對長長的一生，總有不同的比喻，有人說：「生命像一首歌，有高昂的旋律，也有低沉的旋律。如果我們只選擇高昂而捨棄低沉，就沒辦法組成美妙的樂章。」

    以上這段話的涵義與下列選項何者最接近？'
  options:
  - label: A
    content: 對於音樂的感動力，常常因為生命的高昂或低沉而有不同感受
  - label: B
    content: 音樂可以豐富人生，生命則能讓音樂更佳多彩，兩者互相輝映
  - label: C
    content: 生命的精采，來自於得意的高昂與失意的低沉彼此交錯及成長
  - label: D
    content: 人生中有很多向下的低沉力量，我們要盡力避免才能成功。
