    \ 太陽下山前，年輕叔叔扶著一位老爺爺來。「沒錯，這是我師傅做的。」老爺爺摸摸曹操，再看看張飛，「這種絕技只有他才會。」「我二十歲那年，跟著師傅全省各地做剪黏，師傅做的話，很細很難，要慢慢的磨。他做槓（ㄍㄤˋ）槌④，要把瓷片剪成火柴棒大小……」小花忍不住問：「火柴棒？那不是一不小心就斷了。」老爺爺笑著點點頭：「對呀，我師傅一天最多剪出十來根。你們看，張飛身上這些盔（ㄎㄨㄟ）甲⑤，用了多少根？」小花聽了，急忙把張飛擺好，原來張飛的戰袍這麼寶貝，被她弄壞，那可糟了。\n\
    \ 「那時，臺灣沒有好瓷片，村裡的人知道消息後，全都把碗盤、瓷花瓶搬出來，任憑師傅挑挑選選。」小花很好奇：「碗盤和花瓶？」「因為碗盤才有好瓷片，張飛身上的戰袍，就是用一塊青花瓷盤拼出來的。」「是這樣啊！」張飛心裡想，「原來這身戰袍，是一塊盤子。」「我師傅厲害的還是人物。曹操的大白臉、張飛的大花臉，都是師傅用灰泥捏塑塗色。別的師傅搗灰泥，一天就硬了；金龍師的灰泥，過三天再拿來用，還能上色。」「真厲害呀！」年輕叔叔好嚮（ㄒㄧㄤˋ）往。\n\
    \ 「武將身上的盔甲，一般人用碗胡亂拼一拼，但是金龍師不是，他是用鐵剪，一根一根剪，剪完還要修，光做個張飛，就要一個月。」「那做一間廟不就要三、五年？」阿公搖搖頭，「現在請人建個廟，一年都嫌長了。」老爺爺嘆口氣：「那就不美了。」「比如張飛吧，」老爺爺提到張飛，張飛連忙伸長了耳朵，「張飛喝（ㄏㄜˋ）斷長阪橋，阻止曹操百萬雄軍⑥，你看他有多英武。師傅做他，讓張飛瞪大了眼，一副嚇退百萬雄軍的樣子，這才能嚇跑曹操啊。」張飛得意了，衝著曹操笑：「原來你是被我嚇跑的。」老爺爺指指曹操：「曹操統領百萬大軍，志得意滿，他可沒想到前面有個黑臉胖將軍等著他。師傅就抓住兩人決戰前一刻，這樣才美啊！『美』是需要時間磨出來的。」\n\
    \ 小花拉拉老爺爺的袖子問：「老爺爺，你能修好它們嗎？」「你看我年紀都幾歲了，哪還能爬高鑽低到廟頂去做剪黏？」「那怎麼辦？」小花的阿公也很著急。老爺爺對年輕叔叔說：「就你去修啊！」「我？我哪敢呀？這是師祖的作品呢！」張飛和曹操心裡也有疑問，他行嗎？年紀那麼輕？老爺爺笑一笑：「自古英雄出少年，你可以啦！」「我還沒學好。」「別怕，我教你做。」老爺爺的手掌在他肩上一拍，大家都笑了。\n\
    \ 聽說要修廟，全村都來啦。婆婆媽媽煮飯，叔叔伯伯搭鷹架，阿公說：「現在最缺的是漂亮的碗啦，盤子啊。」大家停下手邊工作，一臉狐疑⑦：「碗和盤子？」年輕叔叔笑著說：「張飛將軍缺頭盔，曹操屁股破個洞，得找到同顏色的瓷器來補。」話才說完，大家都盯著曹操看。曹操臉紅了：「再怎麼說，我手下有百萬大軍，怎麼能讓你們看屁股呢？」小花跑回家，打開家裡的碗櫥，找出一只小碗，那是她吃飯用的碗，紅紅的，上頭還有幾隻小魚兒。媽媽問：「去哪兒？」「廟裡！」小花邁開小腿，用力的跑，她好急，很怕去晚了，叔叔不要她的碗。\n\
    \ 廟前人山人海。原來村裡每戶人家都拿碗盤來啦。有個婆婆抱著碗籃：「隨便您選，這些碗如果能黏在廟裡，是我們家的福氣。」終於輪到小花了，她踮（ㄉㄧㄢˇ）著腳，把碗捧得好高、好高。年輕叔叔看了一眼，咦了一聲：「太好了，曹操有褲子穿啦！」聽了這句話，小花和張飛都笑了。聽了這句話，曹操的臉又紅了。"
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
