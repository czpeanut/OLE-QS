  group_stem: '而作為一款者，仲夏之際，我獨鍾愛菊花茶，是因為那樣一缽漂浮著菊花的澄淨之水，似乎具有一種溫和無邊的法力，能使人自酷熱煩躁的死谷中飛昇起來，就像一朵朵圓滿小巧的菊花，在水霧氤氳①之中，自杯底飛昇至淡綠的水面一樣。那時，所有棻②亂浮囂的意緒，忙迫勞形的人事，都化作寂淡的煙塵，自心頭遠去，因此，人雖仍在火熱熱的人間，但心境安閒，無異置身茂林修竹或一方荷亭之上，悠然避暑了。

