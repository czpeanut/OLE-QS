  stem: '〈紙船印象〉與〈下雨天，真好〉的比較，下列表格中，哪一個選項有誤？


    | 篇名 | 紙船印象 | 下雨天，真好 |

    | :--- | :--- | :--- |

    | 開頭寫法 | 冒題法 | 破題法 |

    | (A)主旨 | 藉回憶兒時雨天玩紙船的快樂，感念母愛的偉大 | 藉回憶兒時雨天的人事，刻畫出溫馨美好的童年 |

    | (B)結尾 | 期勉自己繼承母愛，讓下一代有更好的物質生活 | 以西湖聽笛聲抒發綿綿不絕的思鄉愁緒 |

    | (C)特色 | 以「紙船」串聯回憶 | 以「雨」串聯回憶 |

    | (D)共同點 | 1.以第一人稱角度敘寫，融抒情於敘事中。2.採「今——昔——今」的結構，中間懷舊段落為全文重點。 |'
