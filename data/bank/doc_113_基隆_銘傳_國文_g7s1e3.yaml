- id: doc_113_基隆_銘傳_國文_g7s1e3_s3_36
  section: 3
  number: 36
  type: single
  page: 4
  stem: 根據這篇文章，作者認為學習者為什麼不喜歡多做文章？
  options:
  - label: A
    content: 因為覺得浪費時間
  - label: B
    content: 因為缺乏靈感
  - label: C
    content: 因為不懂寫作技巧
  - label: D
    content: 因為艱難費力。
  group_stem: 學人只喜多讀文章，不喜多做文章。不知多讀乃藉人之工夫，多做乃切實求己工夫，其益相去遠也。人之不樂多做者，大抵因艱難費力之故。不知艱難費力者，由於手筆不熟也。若荒疏之後，作文艱難，每日即一篇、半篇亦無不可。漸演至熟，自然易矣。又，不可因不佳而懈其心，懶於做也。文章不能一做便佳，須頻改之方入妙耳。此意學人必不可不知也。
    《唐彪·家塾教學法》
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
