- id: doc_111_彰化_福興_國文_g7s2e3_s4_32
  section: 4
  number: 32
  type: single
  page: 3
  stem: 本則故事的寓意，下列哪一項較貼近？
  options:
  - label: A
    content: 智者千慮，必有一失
  - label: B
    content: 兩害相權取其輕
  - label: C
    content: 一動不如一靜
  - label: D
    content: 寧為玉碎，不為瓦全
  group_stem: 趙國有個人深受鼠害，便去中山國要貓。中山人給了他一隻貓。這隻貓很會抓老鼠，也很會捉雞。過了一箇多月，他家的老鼠被貓吃光了，雞也沒了。他兒子便對父親說，為什麼不把貓除掉呢？父親說：「你不懂這個道理。我們的禍患在於老鼠而不在沒有雞。有老鼠，便會偷吃我們的糧食、咬壞衣服、穿鑿牆壁、破壞器物，這樣一來，我們就要挨餓受凍了，這不是比沒有雞還慘嗎？沒有雞，只不過不吃雞就是了，離挨餓受凍還遠著呢！為什麼要把貓除掉？」
