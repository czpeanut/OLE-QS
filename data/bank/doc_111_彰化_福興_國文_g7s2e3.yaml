  section: 4
  number: 30
  type: single
  page: 3
  stem: 下列哪一句話適合用來勸導這樣的「完美主義者」？
  options:
  - label: A
    content: 浪費別人的時間等於謀財害命，浪費自己的時間等於慢性自殺
  - label: B
    content: 完美的意義是，對於自己要學會苛刻，而對於別人要學會欣賞
  - label: C
    content: 當你準備好，便無所畏懼；當你不做好準備，那就準備畏懼所有
  - label: D
    content: 你不需要等到很厲害才開始，但你必須要先開始才能變得很厲害
  group_stem: 「有許多人明明知道有件該做的事，而且知道大約要花多少時間才能完成這件事，但卻要拖到最後一刻才開始執行，以致最後常常不能如期完成，我們稱這種狀況為『學生症候群』，也就是習慣性拖延。而造成學生症候群的原因之一是：完美主義卻又做不到，總認為自己還沒準備好，所以還不能開始，認為只要一出手就要拿一百分。」
