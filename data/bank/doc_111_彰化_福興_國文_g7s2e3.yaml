  - label: D
    content: 認清自己資賦秉性，莫做比較
  group_stem: '「蛛見蠶吐絲為繭，乃曰：『汝之吐絲，終日辛勞，訖自縛，何苦為？蠶婦操汝入沸湯，抽為長絲，遂喪軀。然則其巧也，適以自殺，不亦愚乎？』蠶對曰：『吾固自殺。然世人無吾，非寒凍而歿乎？爾口吐經緯，織成羅網，坐伺其間，俟蚊虻而自飽。巧則巧矣，其心何忍！』噫！世之為蠶不為蛛者寡矣夫！」

