  stem: 2016 年總統、副總統與立法委員選舉後，原執政黨落敗，失去立法院的多數優勢，因此提出在新總統尚未上任前的四個月，希望由勝選的多數黨推派行政院院長人選，以避免政局不安。而勝選的多數黨回應，將會尊重現任總統任命的行政院院長施政，並且在遵循《憲法增修條文》的規定下，行政院與立法院依分權制衡的制度各司其職，以便在政權交接過程中能維持政局穩定。請問：為避免政府獨斷，我國各機構權力的行使會受到其他機構的約束，下列對於總統與上述兩院間的制衡關係，何者敘述正確？
  options:
  - label: A
    content: 總統可對行政院院長提出不信任案
  - label: B
    content: 當覆議案通過，總統可解散行政院
  - label: C
    content: 立法院可提出對總統的彈劾案
  - label: D
    content: 總統可直接任命立法院院長
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
