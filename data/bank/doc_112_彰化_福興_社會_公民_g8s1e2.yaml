  section: 1
  number: 29
  type: single
  page: 3
  stem: 吳先生是一名時事評論家，在自己架設的網站上發表研究專題文稿，他耗費半年時間蒐集資料並親自撰寫，內容在探討全球貿易與我國扮演的角色，日後準備交予出版社集結成書上架販售，但甲媒體卻在未經過允許下，將網站內文章擅自下載、廣為流傳。吳先生認為甲媒體已對他的權益造成侵害，使他原本可因賣書獲得的金錢利益大為減少，因此決定依《著作權法》規定，向法院提告。針對上文，吳先生與甲媒體之間的糾紛，下列何項理解最為正確？
  options:
  - label: A
    content: 吳先生採取的法律行動屬於《憲法》保障的受益權
  - label: B
    content: 人民的財產權不屬於公共事務，不受《憲法》保障
  - label: C
    content: 吳先生可透過訴願要求政府以公權力維護他的權益
  - label: D
    content: 政府制定文中提及的法律是為了保障甲媒體的權利
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
  answer:
  - A
  answer_source: answer_key_vlm
