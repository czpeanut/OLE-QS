  section: 2
  number: 57
  type: single
  page: 7
  stem: 57. What can we learn from the reading?  higher 更高的
  options:
  - label: A
    content: Most of the world’s pollution comes from fast fashion.
  - label: B
    content: People don’t know how to recycle their fast fashion clothes.
  - label: C
    content: 1/3 of the people don’t care much about the problems of fast fashion.
  - label: D
    content: It’s fine for about half of the people to buy their clothes at higher
      prices.
  group_stem: 'E. (57-59)

    Fast fashion started in the 1970s and it lets people buy new clothes at the low
    prices. But now, we are getting to know the ugly truth behind the cheap beauty:
    poor workers and a lot of bad things to our earth (see Picture 1).

    (Picture 1)

    Sustainable fashion, on the other hand, makes clothes in a better way for the
    earth and people. And luckily, it’s great to know people don’t think the low price
    is everything and it’s possible for sustainable fashion to be a growing business
    now (see Picture 2). How we decide on our clothes is shaping our future. Fast
    fashion or sustainable fashion, let’s be the change!

    (Picture 2)

     gallon 加侖 pollution 汙染 better 比較好的 more 更多的 ocean microplastic 海洋微粒 possible
    可能的'
