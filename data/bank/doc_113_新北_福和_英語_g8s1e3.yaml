  group_stem: 'C. (50-52)

    Dear Lucy,

    Hi, this is Allen from Vietnam. The food and culture are so different from Taiwan,
    making every day full of fun.

    I fell in love with a special drink here---egg coffee. Vietnamese mix egg yolk,
    sugar, and milk with hot coffee. Egg in coffee sounds strange, right? But it tastes
    delicious—creamy and sweet, like a dessert. You can find it in almost every coffee
    shop here. I think you’ll love it!

    Another interesting thing is how Vietnamese nap on hammocks at noon. In Taiwan,
    we usually nap at our desks, but here, hammocks are everywhere. A hammock is like
    a hanging bed. Vietnamese tie it between two trees and they take a nap on it to
    stay away from the hot sun and feel refreshed.

    Also, Vietnamese eat meals on the ground. They don’t use tables and chairs when
    eating. At first, I was surprised, but it felt warm and friendly after I tried
    it.

    Vietnam is a beautiful country with so much to learn. I hope we can visit together
    someday!

    Take care,

    Allen

