  group_stem: 'B. (46-49)

    ( In the classroom)

    Jessi: Hi, Sherry! 46

    Sherry: It was great. I went to Australia to celebrate Christmas with my aunt
    and uncle.

    Jessi: Wow! That’s far.

    Sherry: Yes, it was a 14-hour ride. I was really tired.

    Jessi: Is Christmas different in Australia?

    Sherry: Yes! In Australia, it’s summer in December. People there enjoy sunny days
    on Christmas. It’s fun to see Santa wearing shorts and a T-shirt because of 47
    .

    Jessi: 48

    Sherry: Many people go surfing at the beach. They also like having barbecues in
    the yards. For their Christmas dinner, they eat fresh seafood. They enjoy cold
    desserts like ice cream or fruit salad, too.

    Jessi: That sounds nice! Do they decorate their house like in the U.S.?

    Sherry: Yes, but it’s different. People in Australia also put koalas and kangaroos
    on their Christmas trees.

    Jessi: That’s so cool! In America, Christmas only means snow, fireplaces, and
    hot chocolate.

    Sherry: True, but 49 of the countries celebrate it with love and family.

     yard 庭院 dessert 甜點 fresh 新鮮的 decorate 裝飾 fireplace 壁爐'
