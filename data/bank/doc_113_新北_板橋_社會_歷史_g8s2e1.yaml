  group_stem: '資料一：上海創刊的《良友畫報》，是一份大型綜合畫報，內容著重新聞性、文化性、生活化與大眾化，是通俗文化與大眾文化的代表。封面人物主要是名媛、知名女性或女學生，為女性提供展示的舞台，不僅是服飾、髮型、身體外在形象的展示，更有其生活方式的呈現，塑造出摩登女性的形象，引領風尚。

    資料二：此一時期的思想啟蒙與改革「如：打破舊禮教、婚姻自由、男女同校，以及引入西方新思潮，使中國婦女增加學習新知識的機會。她們積極參與國家、社會發展，在發展事業、從政、參與婦女解放活動等方面，建構身分認同。」'
  answer:
