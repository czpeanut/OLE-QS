- id: doc_113_高雄_楠梓_國文_g7s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 林文月臺灣肉粽：「至於年幼的我們，一邊解開香膩的竹葉，心裡便充滿著好奇與期待。一口咬下去□吃到了肉塊，再一口咬下去，又吃到了香菇或蝦米□，那種口腹之饜足與心情的興奮，便即是節慶的歡愉；而如今回想起來，則又羼雜①
    著許多人與事的記憶□流水一般逝去不回的記憶，竟又帶給我甜蜜中羼和著感傷的複雜情緒。」（註：①羼雜：攙雜錯亂。羼，音ㄔㄢˋ。）請問上述文中空格處，依序填入下列哪一組標點符號最適合？
  options:
  - label: A
    content: ，  ……  。
  - label: B
    content: ……  ──  。
  - label: C
    content: ！  ……  ？
  - label: D
    content: ，  ──  ；
- id: doc_113_高雄_楠梓_國文_g7s1e3_s1_13
