- id: doc_113_高雄_楠梓_國文_g7s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 關於暑假作業一文的寫作手法，下列敘述何者正確？
  options:
  - label: A
    content: 作者利用「對話式」的寫法來凸顯「及早規畫工作並確實執行才能夠從容不迫」的道理
  - label: B
    content: 文章用倒敘法敘述，從「深夜的驚覺」回顧到「起初的敷衍態度」，充滿感嘆
  - label: C
    content: 全文主要以角色的內心獨白，呈現主角心態從起初的驚慌到最後的悔不當初
  - label: D
    content: 全文造語詼諧幽默，並多處引用名言來強調「臨時抱佛腳」的弊病
