  type: single
  page: 1
  stem: 媽從在期末考前將課堂筆記整理了一番，下列選項中的筆記內容何者有誤？
  options:
  - label: A
    content: 作家賴西安除從事少年小說創作外，更是台灣知名的兒少文學作家、民歌作詞家
  - label: B
    content: 孔子是儒家思想的代表人物，也是中國古代傑出的教育家、思想家
  - label: C
    content: 洪醒夫期許自己能在臺灣文學界扮演「覺醒」角色，其作品以鄉土小說聞名
  - label: D
    content: 潘希珍的作品情感真摯，風格能兼具冷靜與幽默，展現了對社會現象的深刻反省
