  stem: 文中提及，文章不可能一寫便是佳作，須藉由何種方式，才可使文章達到精妙的境界？
  options:
  - label: A
    content: 抄襲之
  - label: B
    content: 頻改之
  - label: C
    content: 模仿之
  - label: D
    content: 修飾之
  group_stem: "（丙）\n    學人只喜多讀文章，不喜多作文章。不知多讀乃藉① 人之工夫，多作乃切實求己之工夫，其益相去② 遠也。人之不樂多作者，大抵因艱難費力之故。不知艱難費力者，由於手筆不熟也。若荒疏③\
    \ 之後，作文艱難，每日即一篇、半篇亦無不可。漸演至熟，自然易矣。又不可因不佳而懈其心，懶於作也。文章不能一作便佳，須頻改之方入妙耳。此意學人必不可不知也。\n\
    註：① 藉：假借。② 去：距離。③ 荒疏：因缺乏練習而生疏。\n                                             \
    \                                唐彪 家塾家學法"
