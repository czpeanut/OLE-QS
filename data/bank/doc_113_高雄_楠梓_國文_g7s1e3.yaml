- id: doc_113_高雄_楠梓_國文_g7s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 關於暑假作業一文的文句說明，下列何者有誤？
  options:
  - label: A
    content: 「廢話，現在不寫，難道你還明天拿到學校請老師幫你寫？」→運用反詰及責備語氣，凸顯哥哥此時的急躁與不耐煩
  - label: B
    content: 「懶，懶，懶，懶，懶，懶，懶……」→刻劃哥哥寫作業的畫面感，並暗喻兄妹倆暑假懶惰過日的情景
  - label: C
    content: 「暑假日記看起來除了媽媽生日，到兒童樂園去玩，幾個比較值得紀念的日子之外，整部看起來像是災難大全。」→日記中只有少部分是真實記錄，其餘大多是捏造的故事
  - label: D
    content: 「哥哥：『我們不應該貪玩的，整個暑假都在玩，沒有好好寫作業。』妹妹：『去年你也是這麼說。』」→由此可見哥哥依舊「故步自封」，未反省改過
  lesson_raw:
    title: 暑假作業
    basis: 題目指明《暑假作業》
- id: doc_113_高雄_楠梓_國文_g7s1e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 梁實秋寫字：「寫字的人有癮，癮大了就非要替人寫字不可，看著人家的白扇面，就覺得上面缺點什麼，至少也該有『精氣神』三個字。相傳有人愛寫字，尤其愛寫扇字。後來腿壞，以至無扇可寫。人問其故，原來大家見了他就跑，他追趕不上了。如果字寫到好處，當然不需腿健，但寫字的人終究是腿健者居多。」根據上述這段文字，下列何者是作者想表達的意涵？
  options:
  - label: A
    content: 暗諷字寫不好者居多，僅是喜愛寫，卻無真才實學
  - label: B
    content: 藉由寫字者暗指不務正業的人居多，且常心猿意馬
  - label: C
    content: 人怕出名，寫一手好字更是困擾，登門者令人心煩
  - label: D
    content: 讚許好學寫字的人，若多勤練定能成就一身好本領
- id: doc_113_高雄_楠梓_國文_g7s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 下列為文詠對於故鄉的桂花雨這一課中文句敘述的理解，何者有誤呢？
  options:
  - label: A
    content: 「中秋節前後，就是故鄉的桂花季節」→因中秋節的桂花觸景生情，意近「每逢佳節倍思親」
  - label: B
    content: 「啊！真像下雨，好香的雨呀！」→是作者在杭州讀書時，因得償所願所展現的興奮之情
  - label: C
    content: 「因為栗子長在桂花叢中，本身就帶有桂花香」→意近「蓬生麻中，不扶而直」
  - label: D
    content: 「杭州的桂花再香，還是比不得家鄉舊宅院子裡的金桂」→顯示出「月是故鄉圓」的思鄉情懷
  lesson_raw:
    title: 故鄉的桂花雨
    basis: 題目指明《故鄉的桂花雨》
- id: doc_113_高雄_楠梓_國文_g7s1e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 在故鄉的桂花雨一文中，桂花的細細香風，花雨繽紛，點點曼妙，無不令人想望那美好景致。下列文句所描寫的對象，何者亦是在稱詠「桂花」呢？
  options:
  - label: A
    content: 勁直忠臣節，孤高烈女心。四時同一色，霜雪不能侵
  - label: B
    content: 不是人間種，疑從月裡來。廣寒香一點，吹得滿山開
  - label: C
    content: 一片一片又一片，四片五片六七片，八片九片十來片，飛入梅花都不見
  - label: D
    content: 碧玉妝成一樹高，萬條垂下綠絲絛。不知細葉誰裁出，二月春風似剪刀
  lesson_raw:
    title: 故鄉的桂花雨
    basis: 題目提及《故鄉的桂花雨》
- id: doc_113_高雄_楠梓_國文_g7s1e3_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 孔子曰：「丘也聞有國有家者，不患寡而患不均，不患貧而患不安。蓋均無貧，和無寡，安無傾。夫如是，故遠人不服，則修文德以來之。既來之，則安之。」依據此段話的文意，下列何者是孔子認為國家不安定的原因之一呢？
  options:
  - label: A
    content: 貧富不均
  - label: B
    content: 地狹人稠
  - label: C
    content: 文化異同
  - label: D
    content: 交通不便
- id: doc_113_高雄_楠梓_國文_g7s1e3_s1_20
  section: 1
  number: 20
  type: single
  page: 2
