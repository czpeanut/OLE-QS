  stem: 「崎嶇的世路，孩子走得穩嗎？曲折的路途，孩子可曾失掉自己的方向？」文中這段文字主要在表現父母的何種情感？
  options:
  - label: A
    content: 父母心中時時皆掛心著子女
  - label: B
    content: 父母希望子女能永遠陪伴在身邊
  - label: C
    content: 顯現親子間存在著難以溝通的焦慮
  - label: D
    content: 期待孩子能勇於接受各種挫折挑戰
  group_stem: "（丁）\n    夏日的清晨，從校園圍牆邊走過，濃密的樹蔭下，一個小男孩正在學騎單車。\n  那男孩的母親扶著後座，小孩危顫顫地跨了上去，重心不太穩，晃了幾下，又跳下來。男孩的母親安慰了幾句，重新穩住車子，孩子再次跨上，左腳、右腳……車輪向前轉了，男孩的母親邊扶著後座，邊跟著慢跑。\n\
    \  孩子漸漸騎穩了，也騎快了，興奮地大叫：「我自己來，我自己來。」消失在我們的視野之外。我放緩了腳步，忍不住回頭望看那個母親，她靜定地立在那兒，臉上有一種滿足，也有些許的悵然。\n\
    \  一時之間，心中有股莫名的激動。是不是每一個父母，在讓孩子從自己的手掌中鬆開之際，都會有同樣的心情？那曾經是蹣跚的步子，曾經有著肉窩的胖胖小手，在逐漸成長之後，腳步走穩了，臂膀堅實了，掙脫掉父母的呵護，急急地要走出一條自己的路，而父母的心，是不是只能如此的叮嚀：「要小心！」\n\
    \    崎嶇的世路，孩子走得穩嗎？曲折的路途，孩子可會失掉自己的方向？迷路的孩子，是否還記得回家的路？迷路的孩子，記得沉靜你的心，澄淨你的心。每一雙關心的眼神，都是你回家的路。\n\
    \                                                                      改寫自沉星 夏日的清晨"
