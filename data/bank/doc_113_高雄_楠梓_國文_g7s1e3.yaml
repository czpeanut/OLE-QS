  group_stem: 搭配酸酸甜甜的泡菜是臺式臭豆腐的特色，有效矯正炸物的油膩感，優於香港蘸甜醬的吃法。此外，臺式臭豆腐總是淋上蒜末，吃過的嘴呵出大蒜口氣，帶著豪邁性格。臭豆腐奇臭、濃香，這種重口味最不能缺少的是大蒜和辣椒，惡馬自有惡人騎，氣味濃烈的臭豆腐必須澆以蒜泥和辣醬或辣油，才能鎮壓得住。那是一種奇正相生，香臭互相發明的對比美學。  (改編自焦桐
    談飲食文學)
