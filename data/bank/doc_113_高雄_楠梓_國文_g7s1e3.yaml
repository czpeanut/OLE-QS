  section: 1
  number: 22
  type: single
  page: 3
  stem: 詞語中的數字，有些實指數量；有些乃是用來表達「多」或「少」的含意，並非專指實際的數量。下列選項「」中的數字，何者用來指實際的數量？
  options:
  - label: A
    content: 聽君一席話，勝讀「十」年書
  - label: B
    content: 氣得「七」竅生煙，主意全無
  - label: C
    content: 「百」足之蟲，死而不僵
  - label: D
    content: 美髯公「千」里走單騎，漢壽侯過五關斬六將
- id: doc_113_高雄_楠梓_國文_g7s1e3_s1_23
  section: 1
  number: 23
  type: single
  page: 3
  stem: 關於牛背上的呀喝一文的寫作技巧，下列何者正確？
  options:
  - label: A
    content: 形式短小，並簡要敘述當日騎牛體驗的美麗與哀愁
  - label: B
