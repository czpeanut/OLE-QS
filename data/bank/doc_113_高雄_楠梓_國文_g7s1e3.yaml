- id: doc_113_高雄_楠梓_國文_g7s1e3_s2_49
  section: 2
  number: 49
  type: single
  page: 7
  stem: 根據上文文意的推敲，關於甲~丁畫雙底線處所象徵的意義，下列何者說明最不恰當？
  options:
  - label: A
    content: 甲意指貧窮的人以為幸福的來源是金錢
  - label: B
    content: 乙傳遞出另一類人「無入而不自得」的感受
  - label: C
    content: 丙意指清醒的人易有「庸人自擾」情況
  - label: D
    content: 丁表達出煩惱的範圍，除外在因素，更有內在成因
  group_stem: "（己）\n    幸福總圍繞在別人身邊，煩惱總糾纏在自己心裡。這是大多數人對於幸福和煩惱的理解。成績差的學生認為考了高分就可以沒煩惱，甲貧窮的人認為有了錢就可以得到幸福。結果，有煩惱的依舊難消煩惱，不幸福的依舊難得幸福。\n\
    \    煩惱，似乎永遠是尋找幸福的人命中的劫數。\n    尋找幸福的人，有兩類。一類人像在登山，他們以為人生最大的幸福在山頂，於是氣喘吁吁、窮盡一生去攀登。最終卻發現，他們永遠登不到頂，看不到頭。他們並不知道，幸福這座山，原本就沒有頂、沒有頭。乙另一類人也像在登山，但他們並不在意登到哪裡。一路上走走停停，看看山嵐，賞賞虹霓，吹吹清風，心靈在放鬆中得到了某種自足。儘管不得大愉悅，但這些瑣碎而細微的小自在，縈繞於心扉，一樣地芬芳身心、恬靜自我。\n\
    \    對於心靈來說，人奮鬥一輩子，如果最終能掙得個終日快樂，就已經實現了生命最大的價值。有的人是幸福的，但看起來卻很煩惱；有的人本來該煩惱，看起來卻很幸福。活得糊塗的人，容易幸福；丙活得清醒的人，容易煩惱。這是因為，清醒的人看得太真切，一較真，生活中便煩惱遍地；而糊塗的人，計較得少，雖然活得簡單粗糙，卻因此覓得了人生的大境界。所以，人生的煩惱是自找的。不是煩惱離不開你，而是你撇不下它。\n\
    \    在這個世界上，丁為什麼而煩惱的人都有：為權、為錢、為名、為利……人人行色匆匆，背上背著這個沉重的布囊，裝得越多，牽累也就越多。\n    幾乎所有的人都在追逐著人生的幸福。然而，就像卞之琳\
    \ 斷章詩中所寫的那樣，我們常常看到的風景是：一個人總在仰望和羨慕著別人的幸福，一回頭，卻發現，自己正被別人仰望和羨慕著。\n    其實，每個人都是幸福的。只是，你的幸福，常常在別人的眼裡。\n\
    \                                                                          改編自網路文章"
