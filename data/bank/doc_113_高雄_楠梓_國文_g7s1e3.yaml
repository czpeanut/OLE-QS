  group_stem: "（戊）\n    你看過一艘艘秧船在水田裡划水後退嗎？看過秧船滿載著秧苗的喜形於色嗎？看過秧船把秧苗交給水田後的驕傲嗎？烈日下，寒風中，斜雨裡，秧船任勞任怨的工作，它不企求收穫，只關心播種，無法分享成功，只能參與建設。當你仔細審視它身體上密密緻緻的皺紋時，你會知道什麼是踏實，什麼是犧牲，什麼是收穫，什麼是偉大與容忍。\n\
    \    秧船是農人許多助手中的一個，跟犁、鋤、割稻機、噴藥桶等，都占有同等重要的地位。它多半是木頭做成，像臉盆那個樣子，不過比臉盆更大些。它在插秧的過程中扮演著十分重要的角色，農人用它來裝秧苗，每個插秧的人都有一艘秧船。農人在插秧時都是倒退走的(因為避免插的秧被自己所踐踏)，所以他們要不斷地把秧船向後推，而秧船總是任勞任怨，並且以能參與播種為榮。\n\
    \    「秧船」這個名字不知是誰取的，但農人這樣叫它。這是一個很好的名字，除了可以表現勤勞的精神外，還有濃厚的詩意，我自小就喜歡它那張飽餐風霜的臉，跟老農的臉沒有什麼不同，跟破船、老牛都同樣具有神聖不可侵犯的意義，一種叫人感動的踏實的意義。每當插秧時節的黃昏，我從農田走過，在艷紅的晚霞映照之下，望著遠處幾乎變成一個黑點的插秧的農人和他的秧船，我都有莫名的感動，要是你親眼看過這些，你就會知道踏實、犧牲、收穫，偉大與容忍的真正意義。人要踏實，要活得實在，才能俯仰無愧。\n\
    \                                                                節選改編自洪醒夫 秧船印象"
