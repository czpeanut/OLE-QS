  number: 13
  type: single
  page: 2
  stem: 關於紙船印象一文的文意賞析，下列敘述何者錯誤？
  options:
  - label: A
    content: 「有些是熱鐵烙膚，記憶長存」意近於「刻骨銘心，印象深刻」
  - label: B
    content: 「在童年的無三尺浪的簷下水道航行」意指「風平浪靜、無憂無慮的童稚時光」
  - label: C
    content: 「這種美麗的感情要到年事稍長後才能體會出來」意近「手抱孩兒，才知父母疼咱時」
  - label: D
    content: 「摺出一艘艘未必漂亮但卻堅強的、禁得住風雨的船」作者只期許自己能勇敢面對挫折與苦難
