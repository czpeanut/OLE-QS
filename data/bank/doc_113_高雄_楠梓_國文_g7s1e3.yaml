  stem: 下列文句，何者用字完全正確？
  options:
  - label: A
    content: 牛仔的生活既堅苦又骯髒，通常是塵詬滿臉，戴著汗跡斑斑的牛仔帽
  - label: B
    content: 現今流行的行動支付不但便利，紅利回匱的方式也十分多元
