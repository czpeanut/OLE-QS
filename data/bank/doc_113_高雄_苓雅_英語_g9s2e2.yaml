  group_stem: 'Not All Berries Are Berries!


    Did you know that some fruits we call berries aren''t really berries? Strawberries,
    raspberries, and blackberries are actually complex fruits. This means they grow
    from flowers that have many ovaries. A true berry, however, is a simple fruit
    that grows from a flower with only one ovary.


    The ovary is the part of the flower that becomes the fruit after pollination.
    Some flowers have one ovary, and others have more. To be a real berry, a fruit
    must come from a flower with just one ovary. For example, grapes, bananas, tomatoes,
    and even watermelons are real berries. Many things we call berries are not. In
    fact, the tiny "seeds" you see on the outside of a strawberry aren''t seeds at
    all. Each one is actually an ovary from the flower, and there''s a seed inside.
    That''s too many ovaries for a true berry!


    It''s a mystery how people started calling complex fruits berries and true berries
    other things. But even if we keep making this mistake, at least now we know what
    we are really buying at the market.

