- id: doc_113_高雄_苓雅_英語_g9s2e2_s3_42
  section: 3
  number: 42
  type: single
  page: 5
  stem: What does "frog-ization" mean?
  options:
  - label: A
    content: To see someone less attractive when they like you back.
  - label: B
    content: To change a frog into a handsome prince.
  - label: C
    content: To suddenly become more attractive to someone.
  - label: D
    content: To start to like someone a lot in a short time.
  group_stem: 'Japan''s "Frog-ization"


    Young people in Japan have a new favorite word: "frog-ization." This word describes
    when someone you like suddenly looks much less attractive after they start to
    like you back. It''s like the opposite of a fairy tale!


    A survey of 950 young Japanese people found that "frog-ization" was their top
    word in early 2023. This feeling is similar to what young people in America call
    "the ick" – that moment you suddenly lose interest in someone. So, some dating
    experiences are the same everywhere!


    "Frog-ization," or "kaeru ka gensho" in Japanese, means "the phenomenon of turning
    into a frog." This comes from the story of "The Frog Prince," where a frog becomes
    a handsome prince after a princess likes him. But "frog-ization" is different.
    It''s when you start to see your crush more clearly after they like you. You realize
    they weren''t as attractive as you first thought.


    This is like “the ick,” a feeling where a small thing someone does makes you stop
    liking them. The TV show “Love Island” made the ick'' popular, and these ”icks”
    can come from small things like using the wrong emoji or being mean to people
    who work in a restaurant.


    These feelings, "frog-ization" or "the ick," are not bad. They help young people
    learn what they want in love.

     describe 描述 attractive 吸引人的 opposite 相反的 fairy tale 童話故事 survey 調查

    similar 相同的 phenomenon 現象 crush 愛慕的對象 realize 理解'
