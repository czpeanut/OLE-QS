    Always take warm clothes and a raincoat, just in case the weather gets bad.


    Second, carry a map, a compass, and a flashlight. Even experienced hikers get
    lost. Before you go, study the map to learn about the route and landmarks. A flashlight
    is very helpful if you cannot find your way before it gets dark.


    Third, bring a first-aid kit and learn how to use it. Small scrapes can be more
    serious when there is no doctor nearby.


    Finally, tell your family or friends where you are going and when you will come
    back. If something goes wrong, someone will come to help you.


