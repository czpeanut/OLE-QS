  number: 5
  type: single
  page: 1
  stem: 一八五年代，有一大批中國人受「淘金熱」的吸引來到澳洲。許多英裔澳洲人埋怨中國人的到來導致工資水準下降，也遷怒於中國人帶來的文化傳統，因此連續發生多起排華暴亂。後來，當地出現「白澳政策」，主要目的是保持種族的「純淨」，避免受到汙染和劣化。關於此政策的敘述，下列何者正確？
