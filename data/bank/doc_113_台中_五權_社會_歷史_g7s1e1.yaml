- id: doc_113_台中_五權_社會_歷史_g7s1e1_s1_23
  section: 1
  number: 23
  type: single
  page: 1
  stem: 因地震緣故花東經濟有待大家來振興，宣宣特地參加「山海花東行」旅遊，行程中參訪了一處史前時代的文化遺址，解說員在介紹時說：「這是在完成南迴鐵路，興建火車站整地時無意挖掘到的，最大的文化特徵為板岩砌成的石板棺，棺內有大量陪葬用的陶器與玉飾。石板和石板屋的板岩，都是從中央山脈採集下來的，為了取得板岩，此文化的人民必須與生活於中央山脈的黑熊與雲豹對抗，所以雲豹為其勇士的象徵，並有雲豹圖騰的玉器。埋葬時，腳的方向朝向其聖山，隱含某種宗教信仰的觀念。該址後來設立了台灣第一座國立史前博物館。」請問她所參訪的應是下圖中的何者及文化名稱？史前遺址？
  options:
  - label: A
    content: 甲：長濱文化
  - label: B
    content: 乙：大坌坑文化
  - label: C
    content: 丙：十三行文化
  - label: D
    content: 丁：卑南文化。
