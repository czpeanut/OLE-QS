- id: doc_113_高雄_龍華_自然_g8s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: '老師帶著全班觀察四種元素，小憲及同組的同學不小心把實驗記錄弄髒了，表(一)是元素在常溫常壓時的狀態紀錄。請問根據表(一)的記錄，下列何者正確？


    表(一)

    | 元素 | 常溫常壓時的狀態 | 金屬光澤 | 導電性 | 密度 | 分類 |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 碳-石墨 | ☑固態☐液態☐氣態 | ☐有☑沒有 | ☑佳☐不佳 | ☐較大☑較小 | 甲類 |

    | 弄髒處 | ☐固態☑液態☐氣態 | ☑有☐沒有 | ☑佳☐不佳 | ☑較大☐較小 | 甲類 |

    | 弄髒處 | ☑固態☐液態☐氣態 | ☐有☑沒有 | ☐佳☑不佳 | ☐較大☑較小 | 乙類 |

    | 弄髒處 | ☑固態☐液態☐氣態 | ☑有☐沒有 | ☑佳☐不佳 | ☑較大☐較小 | 甲類 |'
  options:
  - label: A
    content: 弄髒的欄位由上到下可能為「汞」、「硫」、「銀」
  - label: B
    content: 小憲把四種元素分成甲、乙兩類，他分類的依據較可能是以「常溫常壓時的狀態」來進行分類
  - label: C
    content: 可由「導電性佳」的特點判斷出其中有三種元素為金屬
  - label: D
    content: 由於石墨可導電，可將其歸類於金屬元素。
