  stem: 拿破崙，一位時代的巨人，一位法國人心中的民族英雄，從其名言「我的字典裡沒有難字」，能看出其能力超越常人，全盛時期幾乎稱霸整個歐洲。請問：有關拿破崙的相關敘述何者正確？
  options:
  - label: A
    content: 制訂拿破崙法典傳遞自由、平等、博愛的革命精神
  - label: B
    content: 入侵中南美洲激起當地民族主義
  - label: C
