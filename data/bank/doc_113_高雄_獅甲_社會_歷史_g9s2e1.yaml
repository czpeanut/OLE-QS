  stem: 某國際會議在奧國首相的主導下，讓奧國勢力在1814 年後得以延伸至歐洲各地，成為歐洲強大國家，而此會議最終也流於各國的分贓，摧毀許多革命的成果。請問：有關此會議的相關敘述何者正確？
  options:
  - label: A
    content: 此會議讓保守勢力再興
  - label: B
    content: 此會議協助德意志帝國建立
  - label: C
    content: 此會議由路易十六所主導
  - label: D
