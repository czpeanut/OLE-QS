  stem: 某國際會議對於1920 年代以後的國際局勢有著重大的影響，其發展操控在美國、英國、法國三國領袖的手中，對於會議的最終目標原是希望走向世界和平，但卻因各國的利益考量埋下第二次世界大戰的種子。請問：有關此會議的相關敘述何者正確？
