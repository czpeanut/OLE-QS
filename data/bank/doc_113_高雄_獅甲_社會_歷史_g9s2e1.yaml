- id: doc_113_高雄_獅甲_社會_歷史_g9s2e1_s1_19
  section: 1
  number: 19
  type: single
  page: 1
  stem: 會議經常是由人民代表所組成，透過會議程序往往能凝聚共識提出決議。十八世紀包括大陸會議、三級會議、國民會議都是常被學者所提及當時的重要會議。請問：有關此三個會議的相關敘述何者正確？
  options:
  - label: A
    content: 皆主張建立平等的社會制度
  - label: B
    content: 國民會議發表獨立宣言並建立新國家
  - label: C
    content: 三級會議是英國為徵收新稅所召開的會議
  - label: D
    content: 大陸會議決議脫離英國統治走向建國。
