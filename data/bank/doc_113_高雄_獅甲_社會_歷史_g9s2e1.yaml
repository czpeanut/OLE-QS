- id: doc_113_高雄_獅甲_社會_歷史_g9s2e1_s1_18
  section: 1
  number: 18
  type: single
  page: 1
  stem: 十八世紀是一個充滿變化的世代，有思潮的出現，也有革命的產生，當中美國獨立運動與法國大革命的影響深遠，常被後人相提比較。請問：有關兩者的敘述何者正確？
  options:
  - label: A
    content: 皆受啟蒙運動的影響
  - label: B
    content: 皆為民族主義的展現
  - label: C
    content: 皆被外國所支持
  - label: D
    content: 皆於事件後實施君主立憲制。
