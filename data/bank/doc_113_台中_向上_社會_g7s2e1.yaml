  stem: '附表是某作家的三部長篇小說內容簡介，時代背景是在日治時期的臺灣。請問：根據甲、乙、丙的內容描述，依序是日本治臺政策的哪三個時期？（改編112 年會考考題）

    | 著作 | 內容簡介 |

    | --- | --- |

    | 甲 | 刻畫多位臺灣青年在南洋戰場上被戰爭折磨至精神崩潰，甚至喪生的悲慘命運。 |

    | 乙 | 敘述客家族群在臺灣中部山區生產樟腦，為保衛家園參與武裝抗日的故事。 |

    | 丙 | 將日本部份法律制度沿用到臺灣來，標榜「日臺合一」。 |'
  options:
  - label: A
    content: 殖民地特殊統治時期、內地延長主義時期、皇民化運動。
  - label: B
    content: 內地延長主義時期、皇民化運動、殖民地特殊統治時期。
  - label: C
    content: 皇民化運動、殖民地特殊統治時期、內地延長主義時期。
  - label: D
    content: 皇民化運動、內地延長主義時期、殖民地特殊統治時期。
