- id: doc_113_基隆_銘傳_國文_g9s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 「沒有荊棘叢生的雜木和小草，就沒有長滿參天大樹的原始森林。沒有艱難困苦，就不是完整的人生。一輩子沒有受過挫折的人，是一個活得蒼白乏味，活得最沒意思的人。」這段文字的含義與哪個選項相近？
  options:
  - label: A
    content: 人的心是一畝田，土地沒有播下種子，也不會長出好果實。
  - label: B
    content: 千里之路必須從第一步開始，聖人的境域也是凡夫起步。
  - label: C
    content: 世界上真正有價值的事物，需要熱情和犧牲才能完成。
  - label: D
    content: 生命像一股激流，沒有岩石和暗礁，就激不起美麗的浪花。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
