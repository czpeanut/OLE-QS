  group_stem: '(甲)臨江仙 晏幾道

    夢後樓臺高鎖，酒醒簾幕低垂。去年春恨卻來時。落花人獨立，微雨燕雙飛。 記得小蘋初見，兩重心字羅衣。琵琶弦上說相思。當時明月在，曾照彩雲歸。 ①春恨：春愁 ②小蘋：歌女名

    (乙)踏莎行郴州旅舍 秦觀

    霧失樓臺，月迷津渡。桃源望斷無尋處。可堪孤館閉春寒，杜鵑聲裡斜陽暮。 驛寄梅花，魚傳尺素。砌成此恨無重數。郴江幸自繞郴山，為誰流下瀟湘去。 ①津渡：渡口 ②可堪：哪堪'
