- id: doc_113_基隆_銘傳_國文_g9s1e1_s1_30
  section: 1
  number: 30
  type: single
  page: 3
  stem: 承上題，依照王國維的評論，下列何者最可能是東坡或稼軒的詞作？
  options:
  - label: A
    content: 別後不知君遠近。觸目淒涼多少悶。漸行漸遠漸無書，水闊魚沉何處問。夜深風竹敲秋韻。萬葉千聲皆是恨。故欹單枕夢中尋，夢又不成燈又燼。〈玉樓春〉
  - label: B
    content: 醉裡挑燈看劍，夢迴吹角連營。八百里分麾下炙，五十弦翻塞外聲。沙場秋點兵。馬作的盧飛快，弓如霹靂弦驚。了卻君王天下事，贏得生前身後名。可憐白髮生。〈破陣子〉
  - label: C
    content: 蕭條庭院，又斜風細雨，重門須閉。寵柳嬌花寒食近，種種惱天天氣。險韻詩成，扶頭酒醒，別是閒滋味。徵鴻過盡，萬千心事難寄。樓上幾日春寒，簾垂四面，玉闌干慵倚。被冷香消新夢覺，不許愁人不起。清露晨流，新桐初引，多少遊春意。日高煙斂，更看今日晴未。〈念奴嬌〉
  - label: D
    content: 望處雨收雲斷，憑闌悄悄，目送秋光。晚景蕭疏，堪動宋玉悲涼。水風輕，蘋花漸老，月露冷、梧葉飄黃。遣情傷。故人何在，煙水茫茫。難忘，文期酒會，幾孤風月，屢變星霜。海闊山遙，未知何處是瀟湘。念雙燕、難憑遠信，指暮天、空識歸航。黯相望。斷鴻聲裏，立盡斜陽。〈玉蝴蝶〉。
