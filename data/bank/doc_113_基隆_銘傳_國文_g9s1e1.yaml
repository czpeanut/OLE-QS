- id: doc_113_基隆_銘傳_國文_g9s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: '請將下列作品依照「古詩→絕句→律詩→詞」的順序排列：

    (甲)嶺外音書絕，經冬復歷春。近鄉情更怯，不敢問來人

    (乙)出林杏子落金盤。齒軟怕嘗酸。可惜半殘青紫，猶有小脣丹。南陌上，落花閒。雨斑斑。不言不語，一段傷春，都在眉間。

    (丙)錦瑟無端五十弦，一弦一柱思華年。莊生曉夢迷蝴蝶，望帝春心托杜鵑。滄海月明珠有淚，藍田日暖玉生煙。此情可待成追憶，只是當時已惘然。

    (丁)前不見古人，後不見來者。念天地之悠悠，獨愴然而涕下。'
  options:
  - label: A
    content: 甲→乙→丙→丁
  - label: B
    content: 丁→甲→丙→乙
  - label: C
    content: 乙→甲→丙→丁
  - label: D
    content: 丁→丙→乙→甲
