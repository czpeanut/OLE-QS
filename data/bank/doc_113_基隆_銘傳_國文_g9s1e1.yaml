- id: doc_113_基隆_銘傳_國文_g9s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 文人常在作品中表達傷春悲秋之情，請問下列何者不是？
  options:
  - label: A
    content: 菡萏香銷翠葉殘。西風愁起綠波間。還與容光共憔悴，不堪看。細雨夢回雞塞遠，小樓吹徹玉笙寒。多少淚珠何限恨，倚闌干。〈浣溪紗．李璟〉
  - label: B
    content: 東風夜放花千樹，更吹落、星如雨。寶馬雕車香滿路。鳳簫聲動，玉壺光轉，一夜魚龍舞。蛾兒雪柳黃金縷，笑語盈盈暗香去。眾裡尋他千百度，驀然回首，那人卻在，燈火闌珊處。〈青玉案．辛棄疾〉
  - label: C
    content: 庭院深深深幾許，楊柳堆煙，簾幕無重數。玉勒雕鞍遊冶處，樓高不見章臺路。雨橫風狂三月暮，門掩黃昏，無計留春住。淚眼問花花不語，亂紅飛過鞦韆去。〈蝶戀花．歐陽脩〉
  - label: D
    content: 紅藕香殘玉簟秋。輕解羅裳，獨上蘭舟。雲中誰寄錦書來，雁字回時，月滿西樓。花自飄零水自流。一種相思，兩處閒愁。此情無計可消除，才下眉頭，卻上心頭。〈一剪梅．李清照〉
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
