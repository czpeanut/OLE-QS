  stem: 根據本文，為了實現「交通零死亡願景」，下列何者是瑞典政府在道路安全設計方面所採取的措施？
  options:
  - label: A
    content: 提高速限讓道路車流更加順暢，並架設測速照相機限制超速
  - label: B
    content: 在十字路口大量使用圓環以改變車禍衝撞的角度，降低死傷
