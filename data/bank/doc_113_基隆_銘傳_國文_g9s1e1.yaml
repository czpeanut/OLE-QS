  stem: 下列「 」中成語的使用何者正確？
  options:
  - label: A
    content: 由於受到金融風暴衝擊，近年來公司的營運狀況「江河日下」，昔日風光不再。
  - label: B
    content: 做任何事都應該三思而後行，若僅憑「過河拆橋」之勇，容易招致失敗。
  - label: C
    content: 這一帶「斷垣殘壁」，景色秀麗，被國人票選為十大旅遊景點之一。
  - label: D
