  page: 6
  stem: '測驗說明：

    這是本校國文科段考作文測驗題目卷，僅有一題，提供寫作稿紙一張，共2頁。測驗時間從15:10至15:55，共45分鐘。作答時間開始與結束以學校鐘聲為主（或依監考老師現場指示），作答時請從第1頁右邊第1行開始作答。


    題目：感受生活


    引導語：

    在〈人間好時節〉一文中，作者以自己讀詩的經驗為主軸，說明從中體悟到的智慧與哲理，讓日日都美好，時時皆自在。可見，只要能多用心感受生活，轉換角度欣賞事物，就能有一番新的領悟。現在請你就過去的生活經驗，換個角度思考，寫下你有別於以往的體會。


    測驗注意事項：

    1. 請用本國文字書寫，可不用抄題，請記得在作文卷上寫明班級、座號、姓名。

    2. 請於寫作測驗答案卷上作答，如需擬草稿，可以使用本卷空白的部分。

    3. 依據試場規則，寫作測驗答案卷中不得作任何標記。故意污損答案卷、損壞試題本，或在作文內容中顯示自己身分者，該科不予計分。

    4. 依據試場規則，寫作測驗作答時，書寫內容不得超出答案卷格線外框，且務必使用黑色墨水的筆，不得使用鉛筆或其他顏色的筆，違者扣1級分。更正時，請使用修正帶（液）。如有超出格線外框、字跡太過潦草或汙損等情事，導致閱卷老師無法判讀寫作內容者，其責任由考生自負，不得提出異議。

    5. 不可使用詩歌體裁，否則不予計分，亦不得要求增加作答用紙。'
