- id: doc_111_高雄_大灣_社會_g7s2e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 臺灣由於經濟發展差異可分為五大區域，(甲)北部區域 (乙)中部區域 (丙)南部區域 (丁)東部區域 (戊)金馬地區，下列選項內容是有關臺灣各地的觀光資源，其與所在區域的配對，何者正確？
  options:
  - label: A
    content: 甲：日月潭國家風景區景色優美，是國內外頗負盛名的景勝之一。
  - label: B
    content: 乙：太魯閣峽谷音樂節、原住民聯合豐年祭、金針花季等活動。
  - label: C
    content: 丙：石滬以玄武岩與珊瑚礁構築而成，利用潮汐漲退，將魚群困於其中，是當地具代表性的漁業文化。
  - label: D
    content: 丁：此博物館造型特殊，常吸引遊客駐足，其靈感來自頭城鎮海岸一帶常見的地形特徵。
