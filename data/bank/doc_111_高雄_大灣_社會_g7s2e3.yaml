  stem: '聚落可分成鄉村聚落和都市聚落，關於這兩種聚落的差異，下列哪個敘述內容不正確？


    | | 鄉村 | 都市 |

    |---|---|---|

    | (甲) 人口總數 | 少 | 多 |

    | (乙) 人口密度 | 低 | 高 |

    | (丙) 土地面積 | 小 | 大 |

    | (丁) 產業活動 | 第一級 | 第二、三級 |'
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
