  - label: A
    content: 乙：八里渡船頭老街改造後，悠閒的氣氛及河岸風光，景色宜人。
  - label: B
    content: 丙：市政府規畫將既有的科學園區與工業區，串聯成「大肚山科技走廊」。
  - label: C
    content: 丁：安平古堡曾是荷蘭人控制臺灣的中樞，是臺灣最早的要塞建築。
  - label: D
    content: 己：航空城規畫案，目標是成為結合物流、住宅與工業活動的新市鎮。
