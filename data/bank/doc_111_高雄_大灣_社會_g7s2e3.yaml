  group_stem: "山河之間的高雄美濃，有一位客家青年，他用音樂打動了全世界。在臺灣經濟快速發展下，科技產業掛帥的思維裡，貿易自由化與國際化的呼聲中，他用音樂訴說臺灣農民與勞工的故事。\n\
    \  以月琴、嗩吶等客家傳統八音，在一首＜好男好女反水庫＞歌裡，嘗試將美濃的拓墾過往歷史及反水庫運動的過程填入歌詞，再輔以親切的客家山歌曲調，唱出人對土地的情感，傳達保護家鄉土地的決心。\n\
    \  他是何人？他就是對自己很誠實，對生活也很真實的林生祥，用音樂唱出對家鄉的愛意，用音樂表達對鄉土的關懷，用音樂傾訴生態的危機，一個用生命在對待臺灣的音樂人。\n\
    \     \n    ＜好男好女反水庫＞歌詞\n    月光山探頭看著荖濃溪  太武山伸手攬抱南台灣\n    河流撩動我們的喉嚨  唱出我們的情歌\n\
    \    河流鑽過我們的身體  劃出割出我們的來歷\n    河流衡量山脈的方位  測出我們的地理\n    我們的山我們的河流  要怎麼來分家\n   \
    \ 我們的命水我們的土地  要怎麼來分割\n    好山好水留子孫  好男好女反水庫                              （改寫自林生祥多篇相關新聞報導）"
