- id: doc_113_新北_崇林_自然_g9s1e2_s1_25
  section: 1
  number: 25
  type: single
  page: 3
  stem: '如下圖，在無摩擦力的水平面靜置一個質量為M的木塊，今以水平外力F 推動此木塊，使其沿力的方向移動S 的距離，外力對木塊所作的功完全轉換為木塊的動能。

    小明推動質量2M 的木塊，小華推動質量1/2M 的木塊，在同樣無摩擦力的水平面上，想要讓木塊獲得的動能與原本的相同，他們分別提出以下策略：

    | 小明: | 小華: |

    | :--- | :--- |

    | 外力增為原來兩倍，移動距離不變。因為質量增加、速度會減慢，所以只要增加外力即可。 | 維持原外力大小、原移動距離即可。因為只要施力與位移不變，木塊就可以獲得相同動能。
    |

    兩人的策略是否合理？'
  options:
