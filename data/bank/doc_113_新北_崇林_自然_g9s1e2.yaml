- id: doc_113_新北_崇林_自然_g9s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '將碗置於裝有水的臉盆中，碗內有一顆彈珠，如圖所示。當碗及彈珠在水面上呈現靜止狀態時，曉雯和洛洛分別提出自己的見解，其敘述如下：

    曉雯：地球吸引彈珠的反作用力，為彈珠的重量。

    洛洛：彈珠平衡於碗中是因為彈珠施予碗的作用力與碗給彈珠的反作用力，兩者互相抵銷造成的。

    關於兩人的敘述下列何者較合理？'
  options:
  - label: A
    content: 兩人均合理
  - label: B
    content: 兩人均不合理
  - label: C
    content: 只有曉雯合理
  - label: D
    content: 只有洛洛合理。
