  stem: (甲)乙烯（$C_{2}H_{4}$）；(乙)甲苯（$C_{7}H_{8}$）；(丙)甲醇（$CH_{3}OH$）；(丁)己烷（$C_{6}H_{14}$）；(戊)乙酸（$CH_{3}COOH$），上述有機化合物屬於烴類有哪些？
  options:
  - label: A
    content: 丙戊
  - label: B
    content: 甲乙丁
  - label: C
    content: 甲乙丙丁
  - label: D
    content: 甲乙丙丁戊
- id: doc_113_台中_五權_自然_g8s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 寶特瓶是由一種聚合物加工塑形而成，此聚合物是利用乙二醇與對苯二甲酸脫水反應而成，則此聚合反應是屬於下列何種反應？
  options:
  - label: A
    content: 酯化反應
  - label: B
    content: 中和反應
  - label: C
    content: 氧化反應
  - label: D
    content: 皂化反應。
- id: doc_113_台中_五權_自然_g8s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 附圖為綵璇進行實驗的步驟示意圖。關於此實驗，下列說明何者正確？
  options:
  - label: A
    content: 步驟一蒸發皿中的乙醇作為催化劑
  - label: B
    content: 步驟二的目的可以避免反應速率過快
  - label: C
    content: 步驟四的目的是為了分離不同的生成物
  - label: D
    content: 步驟五形成的肥皂將沉在飽和食鹽水底部。
