  type: single
  page: 3
  stem: '如右圖所示，在水平桌面上靜置一個木塊，今對木塊施以向東且大小固定的水平力 F。憲朋、子宸兩人對於木塊受力後可能發生的狀態及原因解釋如下：

    憲朋：若木塊向東運動的速度越來越快，是因為木塊在運動過程中所受的摩擦力大小逐漸變小。

    子宸：若木塊保持靜止不動，是因為 F 與木塊所受的摩擦力大小相同、方向相反，恰好互相抵消。

    關於兩人的描述正確與否，下列何者正確？'
