- id: doc_113_台中_五權_自然_g8s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 以鋁箔包覆竹筷，接著以酒精燈加熱鋁箔，操作竹筷乾餾的實驗。乾餾後，將鋁箔打開，有些黏性的液體物質及殘留的固體物質。有關這些液體與固態物質的敘述，下列何者錯誤？
  options:
  - label: A
    content: 產生具有酸性的液體，可使石蕊試紙由藍色變成紅色
  - label: B
    content: 鋁箔紙上黏性大的黑褐色液體為醋酸
  - label: C
    content: 殘留下來的固體是黑色的木炭
  - label: D
    content: 產生的氣體有些具可燃性。
- id: doc_113_台中_五權_自然_g8s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 下列有關於聚合物的敘述何者錯誤？
  options:
  - label: A
    content: 蛋白質是由胺基酸聚合而成
  - label: B
    content: 澱粉是由葡萄糖分子聚合而成
  - label: C
    content: 纖維素是由葡萄糖分子聚合而成
  - label: D
    content: 油脂是一種聚合物。
- id: doc_113_台中_五權_自然_g8s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 下列關於衣料纖維的敘述，何者正確？
  options:
  - label: A
    content: 蠶絲為一種動物纖維，主要成分為纖維素
  - label: B
    content: 棉、麻為植物纖維，若再經化學藥品處理加工可製成再生纖維，，燃燒時有燃燒羽毛的臭味
  - label: C
    content: 聚酯纖維為合成纖維，為石油化學製品
  - label: D
    content: 嫘縈的原料為石化工業產品，為一種常見的合成纖維，製成的衣料吸汗又透氣。
- id: doc_113_台中_五權_自然_g8s2e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 甲醚和酒精的分子式相同，都是$C_{2}H_{6}O$，但是物理和化學性質卻是明顯不同，是因：
  options:
  - label: A
    content: 結合的元素不同
  - label: B
    content: 結合原子的數目不同
  - label: C
    content: 結合原子的排列方式不同
  - label: D
    content: 結合原子的質量不同。
- id: doc_113_台中_五權_自然_g8s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 市售防晒霜依其阻擋紫外線的原理，分為物理性和化學性兩種。物理性防晒霜的主要成分為二氧化鈦（$TiO_{2}$）或氧化鋅（$ZnO$）；化學性防晒霜的主要成分為柳酸酯（$C_{15}H_{22}O_{3}$）或肉桂酸酯（$C_{18}H_{26}O_{3}$），均為酯類。根據上述，判斷物理性和化學性防晒霜的主要成分分別屬於有機或無機化合物？
  options:
  - label: A
    content: 物理性和化學性皆屬於有機化合物
  - label: B
    content: 物理性和化學性皆屬於無機化合物
  - label: C
    content: 物理性屬於有機化合物，化學性屬於無機化合物
  - label: D
    content: 物理性屬於無機化合物，化學性屬於有機化合物。
