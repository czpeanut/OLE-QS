  stem: 『埤塘出現在臺灣的台地中，構成獨特地理景觀。它的修建主要是的河川流路短，集水區小，因此除了大雨及雨季有充足的供水灌溉外，其餘時間都是涓涓細流，甚至成為乾谷。因此為了儲存雨水，乃興建埤塘。』桃園的埤塘數量居全台之冠，被稱為『千埤之鄉』，請問：桃園台地位於？
