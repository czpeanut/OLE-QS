  section: 1
  number: 3
  type: single
  page: 1
  stem: 以下關於日治時期保甲制度的敘述，何者正確？
  options:
  - label: A
    content: 保甲制度源自於日本，總督沿用此制度控制台灣社會。
  - label: B
    content: 保正與甲長必頇配合警察，執行公共事務。
  - label: C
    content: 保甲內的男子組成壯丁團，指揮警察，進行救災、鎮壓抗日等事務。
  - label: D
    content: 保甲內的甲長，共管理一百戶，類似現今的里長。
