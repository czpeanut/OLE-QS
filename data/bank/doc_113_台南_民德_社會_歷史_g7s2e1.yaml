- id: doc_113_台南_民德_社會_歷史_g7s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 「台南市新化區第一公墓附近發現多達三千副無主骨骸，當地耆老說這是1915 年遭到屠殺的義士。」請問：下列何者是這則歷史事件對當時產生的影響？
  options:
  - label: A
    content: 未被屠殺的原住民從此順從政府，並志願加入高砂義勇隊。
  - label: B
    content: 總督府積極開展台灣的戶口調查，以建立完整的人口資料。
  - label: C
    content: 總督府展開皇民化運動。
  - label: D
    content: 漢人抗日行動轉為非武裝的政治社會運動。
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 歷史
      code: 1-3
      title: 理蕃政策與原住民的對應
      chapter: 第1章 日治時期的政治
