  group_stem: "※台灣原住民DakisNomin，在西元1921 年因新《台灣教育令》頒布，破例進入部落附近僅有日本兒童才可讀的埔里小學校就讀，後又考進台中師範學校講習科，是日本人向原住民宣揚日式教育成功的例子，後GakisNomin\
    \ 改名為花岡一郎。\n  1930 年，馬赫坡部落頭目領導六個部落獵殺參加霧社公學校運動會的日本人，此為霧社事件的開始。\n  花岡一郎在事件中留下遺言：「……此為蕃人因苦於勞役過多，終於爆發長久公憤的事情。……」後花岡一郎則以日本武士道方式切腹自殺。請問："
