- id: doc_113_台南_民德_社會_歷史_g7s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 以下是某時期日本在台灣發布的公告：「本總督府已與清國官員完成交接，從此後，台灣與澎湖列島皆屬於我國。然而被推舉為總統的前台灣巡撫竟慫恿台灣的清兵，反抗我國。在本總督掃蕩下，該巡撫已逃回福建，但潰敗的清兵仍四處逃散，嚴重威脅治安。」請問：這份公告提及的前台灣巡撫為下列何者？
  options:
  - label: A
    content: 劉銘傳
  - label: B
    content: 唐景崧
  - label: C
    content: 丘逢甲
  - label: D
    content: 劉永福。
