  type: single
  page: 2
  stem: 某份報紙刊登以下報導：「全台的寺廟神像及私人家庭的舊神主牌，皆被堆積在焚燒場，在官民的環視下，由僧侶進行焚化作業。當局的苦心及部落民眾的自覺，三百年來的陋習、祭祀的浪費與衛生狀況終得改善。即日起，民眾一律改為內地式新佛壇祭祀祖先。」請問：下列何者與該報導內容的時空背景一樣？
  options:
  - label: A
    content: 「國語家庭」門牌的頒發
  - label: B
    content: 「民族自決」風潮的流行
  - label: C
    content: 霧社事件的發生
