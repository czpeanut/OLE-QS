  type: single
  page: 1
  stem: 一位統治者說道：「面對風起雲湧的反抗活動，我們必頇採取特殊立法制度，依據台灣的狀況來調整統治方針，適度尊重台人文化，避免激起更大的反抗浪潮。」這位統治者想採行的政策為何？
  options:
  - label: A
    content: 無方針主義
  - label: B
    content: 內地延長主義
  - label: C
    content: 日台合一政策
  - label: D
    content: 皇民化運動。
