- id: doc_113_台南_民德_社會_歷史_g7s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: '以下四個人的言論分別代表不同時代：

    (甲)我是佐久間左馬太總督，我推行五年理蕃計畫，全力鎮壓台灣的原住民並掌控資源。

    (乙)我是台灣民主國大將軍，我決心死守台灣，與侵略者共生死。

    (丙)我負責日月潭水力發電所的興建，規模堪稱亞洲最大的水力發電工程

    (丁)我的名字原為「黃周」，但為了響應政府改姓名法令，將名字改為「吾黃周也」。

    請依照上述言論出現的先後順序進行排列，正確的是？'
  options:
  - label: A
    content: 甲乙丙丁
  - label: B
    content: 乙丙丁甲
  - label: C
    content: 乙甲丙丁
  - label: D
    content: 乙丁甲丙。
