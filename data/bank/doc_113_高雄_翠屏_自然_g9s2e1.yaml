  section: 1
  number: 46
  type: single
  page: 7
  stem: 關於臺灣的氣象災害，下列敘述何者正確？
  options:
  - label: A
    content: 如果梅雨、颱風帶來的雨量稀少，臺灣當年易發生乾旱的現象
  - label: B
    content: 冬季時發生寒潮來襲，是因臺灣受到太平洋暖氣團的影響
  - label: C
    content: 梅雨是因蒙古大陸冷氣團南下，形成鋒面所造成的現象
  - label: D
    content: 颱風是由太平洋冷氣團發展而來的。
