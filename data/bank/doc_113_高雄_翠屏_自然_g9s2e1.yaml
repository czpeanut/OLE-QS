- id: doc_113_高雄_翠屏_自然_g9s2e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 關於保險絲的敘述，下列何者正確？
  options:
  - label: A
    content: 保險絲需與被保護電路串聯
  - label: B
    content: 當電路中電流過大時，保險絲會因發熱而熔斷，冷卻後便可繼續使用
  - label: C
    content: 由高熔點的合金做成的
  - label: D
    content: 當保險絲熔斷時，只要將保險絲移除便可繼續使用。
- id: doc_113_高雄_翠屏_自然_g9s2e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 電池依是否可重複使用而分為一次電池及二次電池，下列電池的分類，何者正確？
  options:
  - label: A
    content: 乾電池為二次電池
  - label: B
    content: 鹼性電池為一次電池
  - label: C
    content: 鉛蓄電池為一次電池
  - label: D
    content: 鋰離子電池為一次電池。
- id: doc_113_高雄_翠屏_自然_g9s2e1_s1_17
  section: 1
  number: 17
  type: single
  page: 3
  stem: 關於家庭用電安全的敘述，下列何者錯誤？
  options:
  - label: A
    content: 電線插頭若損壞，需檢查是否有觸電之虞，若無觸電之虞則暫時不需更換
  - label: B
    content: 有接地線的電器，必須確實接地，不可拔除
  - label: C
    content: 同一插座上不可使用過多電器，以免電流超過最大安全容量
  - label: D
    content: 手、腳或身體潮溼時不可觸摸電器。
- id: doc_113_高雄_翠屏_自然_g9s2e1_s1_18
  section: 1
  number: 18
  type: single
  page: 3
  stem: 在原本形成通路的小燈泡兩端加接一銅線，如附圖所示，關於此電路的情形，下列敘述何者正確？
  options:
  - label: A
    content: 燈泡兩端發生「短路」，亮度增加
  - label: B
    content: 燈泡內鎢絲的電阻遠大於銅線的電阻，故電流幾乎全由燈泡內鎢絲通過
  - label: C
    content: 導線、電池的溫度會明顯上升，可能會將導線的絕緣外皮熔化而起火燃燒
  - label: D
    content: 此時燈泡的溫度會明顯的上升。
