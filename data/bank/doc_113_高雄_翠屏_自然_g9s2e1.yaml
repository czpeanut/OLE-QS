  - label: B
    content: 無熔絲開關應在電路中應與電器並聯
  - label: C
    content: 無熔絲開關接在甲點最能保護所有電器安全及正常運作
  - label: D
    content: 無熔絲開關跳開後，需更換才能讓電路運作並持續保護電器安全。
