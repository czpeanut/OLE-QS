- id: doc_113_高雄_翠屏_自然_g9s2e1_s1_19
  section: 1
  number: 19
  type: single
  page: 3
  stem: 如果想利用鉛蓄電池在鐵製鑰匙上鍍一層銅，則銅片應接到鉛蓄電池的哪一極板？
  options:
  - label: A
    content: 鉛
  - label: B
    content: 二氧化鉛
  - label: C
    content: 鋅
  - label: D
    content: 碳棒。
- id: doc_113_高雄_翠屏_自然_g9s2e1_s1_20
  section: 1
  number: 20
  type: single
  page: 3
  stem: 關於電池的敘述，下列何者錯誤？
  options:
  - label: A
    content: 鹼性電池外觀與乾電池相似，但電流較大，放電時間較長
  - label: B
    content: 鋰離子電池不當使用時，易引起爆炸或自燃，搭乘飛機時不能拖運以確保安全
  - label: C
    content: 電池內部的重金屬及電解液，會造成環境汙染，因此使用後一定要回收
  - label: D
    content: 碳鋅電池為鹼性電池，電壓約為1.5 伏特，放電一段時間，電壓會逐漸降低。
- id: doc_113_高雄_翠屏_自然_g9s2e1_s1_21
  section: 1
  number: 21
  type: single
  page: 3
  stem: 如欲在某物體上電鍍金屬，下列操作方法哪些是正確？
  options:
  - label: A
    content: 電鍍的廢液不具任何毒性，可任意排放
  - label: B
    content: 被鍍物應接在直流電源的負極
  - label: C
    content: 若是鍍銀，須以銀片作為負極，以硝酸銀為電解液
  - label: D
    content: 電鍍時，被鍍物可以是塑膠棒，電鍍後，被鍍物用硫酸沖洗並乾燥。
- id: doc_113_高雄_翠屏_自然_g9s2e1_s1_22
  section: 1
  number: 22
  type: single
  page: 3
  stem: 於鉛蓄電池放電時的敘述，下列何者正確？
  options:
  - label: A
    content: 鉛蓄電池放電時，電解液的濃度會逐漸增加
  - label: B
    content: 電解液一般常用為氫氧化鉀溶液
  - label: C
    content: 一個鉛蓄電池的電壓約為2 伏特，一般車用電池會以串聯方式連接增加電壓
  - label: D
    content: 正極為鉛，負極為二氧化鉛。
- id: doc_113_高雄_翠屏_自然_g9s2e1_s1_23
  section: 1
  number: 23
  type: single
  page: 3
  stem: 關於手電筒或兒童玩具所用的乾電池，其剖面圖形如下，則下列敘述何者正確？
  options:
  - label: A
    content: 中間的鋅棒b 作為正極
  - label: B
    content: d 為銅殼，作為負極
  - label: C
    content: c 中含有二氧化錳及氯化銨等物質
  - label: D
    content: 乾電池內不含水，故攜帶方便。
  assets:
