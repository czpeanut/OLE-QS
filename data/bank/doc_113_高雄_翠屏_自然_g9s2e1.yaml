questions:
- id: doc_113_高雄_翠屏_自然_g9s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 家庭中常使用烤箱烘烤麵包、地瓜、肉類等食物，利用電流的熱效應將食物加熱，讓食物除了熟透外，能帶有一些焦香味，提升美味程度。請問下列各項家電用品中，何者與烤箱的原理不同？
  options:
  - label: A
    content: 電熱水器
  - label: B
    content: 電熨斗
  - label: C
    content: 電暖爐
  - label: D
    content: 微波爐。
- id: doc_113_高雄_翠屏_自然_g9s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 在一顆電池中，5 庫侖的負電荷通過時，可獲得60 焦耳的電能，請問此電池的電壓應為多少伏特？
  options:
  - label: A
    content: '1.5'
  - label: B
    content: 1/12
  - label: C
    content: '12'
  - label: D
    content: 300。
- id: doc_113_高雄_翠屏_自然_g9s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 通常耗電量較大的電器會選用較粗的銅線作為導線，其主要原因為何？
  options:
  - label: A
    content: 可減少導線的電流的熱效應，較不會因為線路過熱而燒毀
  - label: B
    content: 導線越粗，在裝置線路時比較不易斷裂
  - label: C
    content: 越粗的導線用電量越高，電器運作效果越佳
  - label: D
    content: 銅線越粗電阻越大，可增加導線的電流的熱效應。
- id: doc_113_高雄_翠屏_自然_g9s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 試問關於此電路，哪一個敘述正確？
  options:
  - label: A
    content: 甲燈泡兩端的電壓大於乙燈泡兩端的電壓
  - label: B
    content: 甲燈泡的電阻大於乙燈泡的電阻
  - label: C
    content: 甲燈泡消耗的電能大於乙燈泡消耗的電能
  - label: D
    content: 甲燈泡的電功率等於乙燈泡的電功率。
  group_stem: 如附圖所示，將規格不同的甲、乙兩燈泡並聯，形成通路數分鐘後，如附圖所示。已知通過甲燈泡的電流比乙燈泡大，且假設通電時導線並未耗損電能，試回答下列4～5題：
  shared_asset: g1_4_5
- id: doc_113_高雄_翠屏_自然_g9s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 若電池提供的電能為E，甲、乙兩燈泡消耗的電能分別為E 甲、E 乙，則關於三者的關係，下列何者正確？
  options:
  - label: A
    content: E＝E 甲＋E 乙
  - label: B
    content: E＝E 甲－E 乙
  - label: C
    content: E＝E 甲＝E 乙
  - label: D
    content: E＜E 甲＝E 乙 。
  group_stem: 如附圖所示，將規格不同的甲、乙兩燈泡並聯，形成通路數分鐘後，如附圖所示。已知通過甲燈泡的電流比乙燈泡大，且假設通電時導線並未耗損電能，試回答下列4～5題：
  shared_asset: g1_4_5
- id: doc_113_高雄_翠屏_自然_g9s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 電器上都會標示規格，供我們選用合適的電器，若一個電燈泡規格標示為110V、60W，則關於此電燈泡的敘述，下列何者正確？
  options:
  - label: A
    content: 最小使用電壓為110V
  - label: B
    content: 當使用110 伏特的電源時，消耗的總電能為60 焦耳
  - label: C
    content: 若使用低於110 伏特的電源時，消耗的電功率大於60 瓦特
  - label: D
    content: 若使用220 伏特的電源時，每秒消耗的電能會大於60 焦耳。
- id: doc_113_高雄_翠屏_自然_g9s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 關於電費計算，何者正確？
  options:
  - label: A
    content: 電力公司於家庭配電盤之後裝設電表量測家庭用電量
  - label: B
    content: 電費帳單中以焦耳為單位計費
  - label: C
    content: 1 度電可以提供標示1 千瓦的電器正常使用1 小時
  - label: D
    content: 1 度電相當於1000 焦耳。
- id: doc_113_高雄_翠屏_自然_g9s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 有關台灣電力公司提供電力的敘述，下列何者錯誤？
  options:
  - label: A
    content: 電流大小和方向會隨時間做規律的週期性變化
  - label: B
    content: 輸電過程中，會以低電壓、高電流的傳輸減少電能消耗
  - label: C
    content: 以量測用電戶消耗的電能多寡計費
  - label: D
    content: 若電力公司所提供的交流電頻率為60 赫，表示以每秒60 次的頻率變化電流大小及方向。
- id: doc_113_高雄_翠屏_自然_g9s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 下列有關直流電及交流電的敘述，何者正確？
  options:
  - label: A
    content: 直流電簡記為AC、交流電簡記為DC
  - label: B
    content: 直流電的電流方向固定不變
  - label: C
    content: 家用電源為直流電的一種
  - label: D
    content: 鹼性電池為交流電的一種。
- id: doc_113_高雄_翠屏_自然_g9s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 欲將雞胸肉蒸煮10 分鐘，則電鍋應消耗了多少焦耳的電能？
  options:
  - label: A
    content: 600×10
  - label: B
    content: 600×60
  - label: C
    content: 600×110
  - label: D
    content: 600×10×60。
  group_stem: 「雞胸肉富含優質動物性蛋白質，可說是許多健身族群增肌時的必備聖品。雞胸肉事前一定要「醃製」，把醃漬好的雞胸肉放在稍微有深度的盤子或碗裡，外鍋加入約150
    cc 的水，再放入電鍋蒸。手邊沒有量杯的話也可以計時，蒸雞胸肉時間約10 分鐘即可。電鍋開關跳起後，不要急著打開鍋蓋，再燜 5-10 分鐘。」若有一電鍋標示如附圖，不計電線的電能損耗，試回答下列10～11
    題：
  shared_asset: g1_10_11
- id: doc_113_高雄_翠屏_自然_g9s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 若每度電費為4.5 元，則蒸煮雞胸肉之過程(不含再燜的保溫時間)，所需花費的電費為多少元？
  options:
  - label: A
    content: 0.6×(10/60)×4.5
  - label: B
    content: 600×(10/60)×4.5
  - label: C
    content: 600×10×4.5
  - label: D
    content: (10/0.6)×4.5。
  group_stem: 「雞胸肉富含優質動物性蛋白質，可說是許多健身族群增肌時的必備聖品。雞胸肉事前一定要「醃製」，把醃漬好的雞胸肉放在稍微有深度的盤子或碗裡，外鍋加入約150
    cc 的水，再放入電鍋蒸。手邊沒有量杯的話也可以計時，蒸雞胸肉時間約10 分鐘即可。電鍋開關跳起後，不要急著打開鍋蓋，再燜 5-10 分鐘。」若有一電鍋標示如附圖，不計電線的電能損耗，試回答下列10～11
    題：
  shared_asset: g1_10_11
- id: doc_113_高雄_翠屏_自然_g9s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 台灣電力公司供給家庭用電，是由三條導線配置而成，分別為兩條活線及一條中性線，下面附圖為台灣家庭中經常使用的插座樣式，共有甲、乙、丙三種，關於這三種樣式，下列敘述何者正確？
  options:
  - label: A
    content: 甲為電壓110V 使用，乙、丙為電壓220V 使用
  - label: B
    content: 乙圖的三個孔共連接兩條活線及一條中性線
  - label: C
    content: 丙插座連接兩條活線及一條接地線
  - label: D
    content: 甲插座的雙孔連接兩條活線。
