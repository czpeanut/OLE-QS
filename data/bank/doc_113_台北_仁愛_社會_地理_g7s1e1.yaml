  group_stem: "題組一\n現在我們熟知的國際標準時間是在19 世紀時制定的，當時英國是世界霸權，憑藉著壯盛的海軍在世界各地擴展殖民地，因而有「日不落國」之稱。早期，英國在發展航海事業時，時間與方位的計算並不精準，18\
    \ 世紀時曾經有一支英國艦隊因為錯算經度而失事，這起事件引起英王高度重視，為了ldap解決艦隊在航海方位測量的問題，英國在倫敦泰晤士河畔的格林威治興建天文臺，並研發一套符合科學的計時方法，經多年天文學家的努力，終於規畫出以通過格林威治的經線，作為地理經度測量和計時系統之起點。\n\
    \  英國研發出以本初經線作為計時、測量方位基礎的同時，世界其他各國也各自有一套計時方法，國際時間並未整合。為此，1884 年10 月世界各國在美國華盛頓召開一場國際天文學會議，會中決定以通過格林威治天文臺的經線作為計算經度和世界時區的起點，就這樣，格林威治國際標準時間產生了，成為通行世界各地計時的一套標準。"
  answer:
  - A
  answer_source: answer_key_vlm
