- id: doc_113_高雄_獅甲_國文_g8s2e2_s4_14
  section: 4
  number: 14
  type: single
  page: 2
  stem: 我所知道的康橋一文以「不說也罷，說來你們也是不信的」做為文章的結尾，其用意為何？
  options:
  - label: A
    content: 許多事物只可意會，不可言傳，留給讀者自行想像與感受
  - label: B
    content: 所謂真理是沒有人願意理會的，因而引發作者的感慨
  - label: C
    content: 自然之美需要具備一定能力才能了解，故作者不再述說
  - label: D
    content: 鼓勵讀者親自走訪康橋，才能領略其中美景。
  lesson_raw:
    title: 我所知道的康橋
    basis: 題幹指名課名我所知道的康橋
- id: doc_113_高雄_獅甲_國文_g8s2e2_s4_15
  section: 4
  number: 15
  type: single
  page: 2
  stem: 文學的魅力就是能使用得當的語詞來表達出想傳達的語氣。請細讀「令他馬，固不敗傷我乎？」與「唯陛下察之」這兩句話後，請判斷其語氣分別為何？
  options:
  - label: A
    content: 威脅恐嚇／軟弱膽怯
  - label: B
    content: 叮嚀指導／強硬命令
  - label: C
    content: 假設責難／殷切期望
  - label: D
    content: 好奇質問／堅定自信。
  lesson_raw:
    title: 張釋之執法
    basis: 題幹引用張釋之執法課文原句
- id: doc_113_高雄_獅甲_國文_g8s2e2_s4_16
  section: 4
  number: 16
  type: single
  page: 2
  stem: 根據張釋之執法一文，張釋之為什麼敢與皇帝據理力爭？
  options:
  - label: A
    content: 因為張釋之認為天子不能違背法律，審判應依據法律
  - label: B
    content: 因為漢文帝優柔寡斷，讓張釋之有機可乘
  - label: C
    content: 因為身為廷尉的張釋之秉性善良，不願殘害無辜
  - label: D
    content: 因為犯蹕不是什麼大罪，罪不致死。
  lesson_raw:
    title: 張釋之執法
    basis: 題幹指名課名張釋之執法
- id: doc_113_高雄_獅甲_國文_g8s2e2_s4_17
  section: 4
  number: 17
  type: single
  page: 2
  stem: 司馬遷善用對話刻畫人物形象。如「縣人來，聞蹕，匿橋下。久之，以為行已過，即出，見乘輿車騎即走耳」，即以縣人的自白，敘述事件始末，呈現人物形象。下列關於這段對話的解析，何者錯誤？
  options:
  - label: A
    content: 以急促、簡短的語氣，呈現縣人誠惶誠恐、緊張害怕的心情
  - label: B
    content: 「見乘輿車騎即走耳」最能顯出縣人的犯意，因為他看到皇帝車駕，便跑上前去
  - label: C
    content: 使縣人其情可憫的形象，躍然紙上
  - label: D
    content: 司馬遷掌握了「氣急則辭促」的原則，烘托出縣人的心理狀態。
  lesson_raw:
    title: 張釋之執法
    basis: 題幹引用張釋之執法課文原句與作者司馬遷
- id: doc_113_高雄_獅甲_國文_g8s2e2_s4_18
  section: 4
  number: 18
  type: single
  page: 2
  stem: 張釋之執法一文中，廷尉張釋之表現出什麼樣的態度？
  options:
  - label: A
    content: 克盡厥職
  - label: B
    content: 不忮不求
  - label: C
    content: 目空一切
  - label: D
    content: 唯唯諾諾。
