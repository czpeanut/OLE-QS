- id: doc_113_高雄_獅甲_國文_g8s2e2_s4_28
  section: 4
  number: 28
  type: single
  page: 3
  stem: 「夫不諫則危君，固諫則危身，與其危君，寧危身，危身而終不用，則諫亦無功矣。智者度君權時，調其緩急而處其宜。上不敢危君，下不以危身，故在國而國不危，在身而身不殆。昔陳靈公不聽泄冶之諫而殺之，曹羈三諫曹君不聽而去，《春秋》序義雖俱賢而曹羈合禮。」根據這段文字，下列何者最符合作者的觀點？
  options:
  - label: A
    content: 《春秋》序義稱道曹羈與曹君兩者俱賢
  - label: B
    content: 肯定泄冶以死進諫之舉，終於感動國君
  - label: C
    content: 進諫不被採納仍危身固諫，非明智之士
  - label: D
    content: 賢者居高位不敢危君，處下則隨遇而安。
- id: doc_113_高雄_獅甲_國文_g8s2e2_s4_29
  section: 4
  number: 29
  type: single
  page: 3
  stem: 「藥用硃砂是怎麼回事呢？汞有劇毒，能用它來治什麼病呢？綜合多家醫書的說法，硃砂主要用來治療『心神不寧，煩躁不眠，驚悸怔忡，癲癇發狂，狂言亂走，小兒驚風』等症狀。古人對疾病的生理、病理並無真正理解，所謂的診斷治療都是看症狀。就硃砂來說，大人只要心神不寧、吵吵鬧鬧、瘋言瘋語，小孩睡不安穩、哭鬧不停的話，就可以用硃砂來治療，所以用硃砂製成的此類藥品，常會取名為某某『安神丸』。它們會有效嗎？當然！汞主要攻擊目標是腦部，汞中毒會降低意識反應，讓人變遲鈍。所以不管原先是什麼病因造成了躁動與瘋狂，病人只要吃了夠多的硃砂，都有可能會暫時安靜下來。」（改寫自汪漢澄
    腦科先生說古今）」下列敘述，何者最適合用來形容硃砂治病？
  options:
  - label: A
    content: 頭痛醫頭，腳痛醫腳
  - label: B
    content: 藥到病除，一勞永逸
  - label: C
    content: 飲鴆止渴，後患無窮
  - label: D
    content: 以毒攻毒，釜底抽薪。
- id: doc_113_高雄_獅甲_國文_g8s2e2_s5_30
  section: 5
  number: 30
  type: single
  page: 4
  stem: 根據本文，下列敘述何者正確？
  options:
  - label: A
    content: 臺北在作者眼裡仍是雜亂無章、毫無改變
  - label: B
    content: 捷運的開通整束臺北，使各區域更顯整齊
  - label: C
    content: 臺北為了朝綠色城市邁進，所以種植許多花草樹木
  - label: D
    content: 舊式建築應全部整修，臺北才能國際化。
  group_stem: "年過半百，還能穿梭在兒時的小巷，摸摸童騃爬過的老樹，見到熟悉的一牆一瓦，真是難得的福氣。\n  我就有這樣的福氣。\n  雖然小巷兩邊的日式平房已經改建高樓，童年的小河已經加上蓋子，竟然還能留下幾棵百年老樹，保存幾棟百年老屋，使我走過其間，在「驚呼熱中腸」時，勾畫出童年的往事。\n\
    \  童年記憶中，是稻田、泥土地和日式的房舍，中期記憶裡是雜亂的建築、空氣的汙染和情色商場的交織。甚至十幾年前，一個冬天的雨夜，我獨自走在窄巷裡，被疾駛而過的車子濺得滿身泥水時，還自問為什麼回到這塊鬼地方。\n\
    \  但印象突然改了，而且可能是近三、五年的事。\n  不知因為年過半百，心情平靜了，於是能見舊時所不能見，抑或自從臺北的捷運完工，原本不上軌道的，漸漸各就其位，彷彿「粗服亂頭」的女子，稍微掠掠髮、整整衫，就顯出她的麗姿。\n\
    \  今天的臺北呈現出一股悠然。\n  小小的社區公園，有不同的機構「認養」，個個花團錦簇，且在每棵樹上掛牌子、標出樹名、產地和用途。大安公園初建時的塵土早不見了，當年的小樹已經蔚然成林。敦化路更是不凡，裊柔與蒼勁並濟的樟樹，竟有了參天的綠意。即使林間的草地，也因為無名芳菲的交織，另有一種天真。\n\
    \  在這還原自然的優美之間，有樹梢托出來的高樓，有隔街乾淨得不見一片紙屑的人行道，有隨意靠在路邊，不怕被偷的腳踏車，有各種世界名牌的商店。臺北人若不妄自菲薄，應該拿敦化路、仁愛路與巴黎的香榭麗舍比美。\n\
    \  我這次返臺，正是黃槐花開。去榮總探視朋友，經過延吉街和八德路交接的小公園，樹又長高了。路邊一棵白蘭花樹，令我想起十幾年前，早上才見一朵花開，中午已經被人摘走。現在則滿樹繁花，也沒人碰。\n\
    \  車過銘傳附近的公園，爬牆虎遮住整面擋土牆，所有的樹木都那麼茂密青翠。隔著巨大的姑婆芋和紫薇花，看見歷史悠久的鑲嵌壁畫，沒顯殘破，反而亮麗了。車近榮總，老醫院的舊建築仍在，旁邊又加建好多宏偉的大樓，對比著後面的青山，突然一陣暗，原來夾道的榕樹，已經隔著街，枝條交錯，搭起綠色的隧道。\n\
    \  一個婦人推著嬰兒車在樹蔭下散步，一群孩子背著書包嬉笑地跑過，一位老人拄著枴杖，在兩邊車子的等待下正徐徐穿過馬路……（劉墉 臺北．悠然）"
