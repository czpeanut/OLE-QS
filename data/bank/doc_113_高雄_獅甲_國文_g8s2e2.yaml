    \  車過銘傳附近的公園，爬牆虎遮住整面擋土牆，所有的樹木都那麼茂密青翠。隔著巨大的姑婆芋和紫薇花，看見歷史悠久的鑲嵌壁畫，沒顯殘破，反而亮麗了。車近榮總，老醫院的舊建築仍在，旁邊又加建好多宏偉的大樓，對比著後面的青山，突然一陣暗，原來夾道的榕樹，已經隔著街，枝條交錯，搭起綠色的隧道。\n\
    \  一個婦人推著嬰兒車在樹蔭下散步，一群孩子背著書包嬉笑地跑過，一位老人拄著枴杖，在兩邊車子的等待下正徐徐穿過馬路……（劉墉 臺北．悠然）"
