- id: doc_113_高雄_獅甲_國文_g8s2e2_s4_24
  section: 4
  number: 24
  type: single
  page: 3
  stem: 「來咳！用力咳！接著是一連串急促的拍背聲。砰砰砰砰，砰砰砰砰。只開床頭小燈的病房內傳出規律而響亮的鼓點，在左肺拍完之後節奏稍歇，中間插入一小段翻身時布料摩擦床單的即興演奏，然後鼓聲趕上兩步，重新搶回主旋律。」關於這段文字的寫作手法，下列分析何者錯誤？
  options:
  - label: A
    content: 透過對聽覺的描摹，寫拍痰時的聲響
  - label: B
    content: 以映襯手法，凸現拍痰聲、音樂演奏會兩者在聲音上的差異
  - label: C
    content: 運用擬人技巧，寫鼓聲「趕」上兩步、「搶」回主旋律
  - label: D
    content: 結合音樂方面的聯想，來描寫拍痰的聲音。
- id: doc_113_高雄_獅甲_國文_g8s2e2_s4_25
  section: 4
  number: 25
  type: single
  page: 3
  stem: 「        。罐頭的優點是即開即食且保存期限長，但不少人認為營養價值不高，添加防腐劑，有害健康。臺灣癌症基金會執行長吳映蓉博士表示，人們認為罐頭『不健康』的看法並不準確。事實上，罐頭不需添加防腐劑，製作過程採密封和高溫殺菌，使食物達到無菌狀態，從而避免腐敗。有消費者擔心，罐頭食品高溫製程會破壞食物營養。其實，人們平常加熱烹煮食物，營養一樣會流失。常見的蔬菜罐頭有玉米罐頭、番茄罐頭。玉米中可抗氧化的葉黃素、玉米黃素，以及維生素Ａ皆為脂溶性，都不易因罐頭加工而流失。番茄被製成番茄糊罐頭後，有助防癌的茄紅素反而會增加。據臺灣癌症基金會資訊，茄紅素經高熱烹調也不易被破壞，不加鹽的番茄罐頭，茄紅素會增加三到四倍。」這篇報導開頭畫線處點出全文要旨。根據文意，畫線處填入下列何者最恰當？
  options:
  - label: A
    content: 別傻了，你還在吃罐頭食品嗎
  - label: B
    content: 儘管吃，罐頭食品百利而無一害
  - label: C
    content: 想健康，最好還是遠離罐頭食品
  - label: D
    content: 不要怕，罐頭比你想像的還營養。
