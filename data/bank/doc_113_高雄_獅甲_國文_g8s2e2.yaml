    \  例如志豪依ＳＷＯＴ分析，列出下面一張表後，我們來幫他診斷一下。\n\n  當知道自己哪一方面比較強，哪一方面比較弱，並以正面的態度去面對他，反而是最好的策略。升學考試的成績不是看單科分數的高低，而是看所有科目考試的總和。只要總分超過理想學校或志願科系的最低錄取分數，就可以金榜題名。\n\
    \  對於競爭弱勢的科目，應該花較多的時間去準備。也許目前的成績並不理想，但這表示進步的空間還很大。\n  理解型的題目需要從基本原理與定義下手，由基礎開始練習，逐漸提高難度，以適應變化較大的題目。\n\
    \  計算型的題目要多花時間練習，熟能生巧是考高分的鐵律。\n  知道自己碰到數學就想睡覺，就必須在最好的Ｋ書時段，頭腦最清楚的時候練習數學，由淺入深，由簡入繁，逐漸掌握題型及解題技巧，往後看到數學就會越來越有勁。（呂宗昕\
    \ Ｋ書高手）"
