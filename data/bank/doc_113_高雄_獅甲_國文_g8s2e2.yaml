  stem: '「趙以數困於秦兵，趙王思復得廉頗，廉頗亦思復用於趙。趙王使使者視廉頗尚可用否。廉頗之仇郭開多與使者金，令毀之。趙使者既見廉頗，廉頗為之一飯斗米，肉十斤，被甲上馬，以示尚可用。趙使還報王曰：『廉將軍雖老，尚善飯。然與臣坐，頃之三遺矢（１）矣。』趙王以為老，遂不召。」【注釋】（１）矢：通「屎」。

    根據這段文字，廉頗不復重用的原因，最可能是下列何者？'
