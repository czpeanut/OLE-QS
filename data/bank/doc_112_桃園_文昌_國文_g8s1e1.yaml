- id: doc_112_桃園_文昌_國文_g8s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 琦君擅長描摹故事背景與人物，手法細膩而精巧。在下雨天，真好一文中，她鮮活生動呈現了母親的形象。依據文中描寫，何者詮釋錯誤？
  options:
  - label: A
    content: 「連忙盛一大碗滿滿的白米飯，請瞎子先生吃，再給他一大包的米」→ 母親具有菩薩心腸和慈悲助人的心胸
  - label: B
    content: 「母親閉著眼睛，給我講雨天的故事。在熹微的晨光中，她的額角方方正正，眉毛細細長長，眼睛瞇成一條線」→ 刻畫母親對子女的疼愛，以及慈祥悲憫的形象
  - label: C
    content: 「唱鼓兒詞的總在下雨天從我家後門摸索進來，坐在廚房的長凳上，唱一段鄭元和學丐。母親一邊做飯，一邊聽。淚水掛滿了臉頰」→ 可見父母感情失和，母親被故事影響情緒潰堤
  - label: D
    content: 下雨天長工不下田，母親不用老早起來做飯，可以在熱被窩多躺會兒→ 可推知母親平日須為家事辛苦操勞。
  lesson_raw:
