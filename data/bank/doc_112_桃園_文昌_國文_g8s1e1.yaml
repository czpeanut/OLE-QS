- id: doc_112_桃園_文昌_國文_g8s1e1_s1_33
  section: 1
  number: 33
  type: single
  page: 4
  stem: 作者認為，孩子面對家庭問題會自動地共依存直到長大，理由不包含甚麼？
  options:
  - label: A
    content: 是一種暫時的保護機制
  - label: B
    content: 自我中心的思考模式
  - label: C
    content: 自發性產出的行為模式
  - label: D
    content: 為生存而產生的行為
  group_stem: "在家庭系統理論興起，共依存被視為家庭的病態，而且十分普遍地存在於多種問題家庭的成員身上。在一個不正常的家庭裡，有一個主要的壓力來源。它可以是父親酒癮或工作狂，也可能是母親歇斯底里，或者父母給孩子肢體或語言上的暴力行為；或許是真實或臆測的疾病；父母早逝，離婚或在道德及宗教上面的過份自以為是，甚至於性虐待等等。倘若有一個人帶給他的家人極大的威脅感，這個人就成了家中的壓力來源。每個成員都試圖藉著某種方式來應對壓力，家人往往被這壓力弄得團團轉，且一直活在它的陰影下，變得和它共依存。……有時壓力已經終止了，家人卻仍保持備戰狀態中，而且習以為常。這些或輕或重的壓力往往可能在家庭中持續多年，於是孩子就發展出某一套行為模式，作為生存法則，直到長大之後，這些行為模式仍然持續存著。\n\
    \    不論是家中壓力是長期而輕度的恐懼，或是突發的強烈創傷，處於其中都必會發展出一些生存之道來。這些生存之道，在兒時一度具有保護作用，但是長大了以後，這些行為模式不但不必要，反而是有害的。\n\
    \                                                                            \
    \     節錄家庭會傷人約翰．布雷蕭"
  tags:
    textbook: 第三冊（八上）第1次段考範圍
    labeled_by: ai
    chapter:
      publisher: null
      book: 八上
      subject: 國文
