  options:
  - label: A
    content: 眼角淚水已經湧出來了，我知道一切都回不去了，向所有人揮手說再見，就讓我們把這份美好的回憶珍藏在心底
  - label: B
    content: 每一種選擇都有不同結局，就如走不同的路就會有不同的風景。所以，若想看燦爛風景，不妨沉思片刻再做選擇
  - label: C
    content: 明明滅滅的人生，我願作一盞燈，溫暖你的寒冷，關照你的一生
  - label: D
    content: 那些執念那樣的舊時光一晃就過去了。生活依舊如此，它沒有任何改變，在改變的是我們。
