- id: doc_112_桃園_文昌_國文_g8s1e1_s1_29
  section: 1
  number: 29
  type: single
  page: 3
  stem: 請你體會一下威爾斯從眼前的挫敗產生的執著，你若是他朋友可以用哪句哲理來勸諫他？
  options:
  - label: A
    content: 躬自厚而薄責於人，則遠怨矣
  - label: B
    content: 不以一眚掩大德
  - label: C
    content: 學而不思則罔，思而不學則殆
  - label: D
    content: 天行健，君子以自强不息。
  group_stem: "威爾斯注意到有個志願者吸了笑氣之後，腳脛撞到桌角，血流如注，卻一點都不覺得痛，渾然忘我到處遊走。他開始想，是不是可以用這種氣體來幫助拔牙？這個沒沒無聞的年輕人當時可能並不明白這個想法的偉大，以及它如何改變了人類醫療的歷史，當然，他更不知道，這個想法是如何注定了他一生的悲劇。\n\
    \    連施行笑氣的郎中卡登都覺得威爾斯的想法荒謬無比，但威爾斯並不氣餒。他找到自己的同行好友雷格斯來幫忙，於是人類史上第一次的麻醉手術就這樣開始了。任務分配的結果雷格斯擔任牙醫，卡登是麻醉師，最熱中的威爾斯自然責無旁貸成了實驗動物。\n\
    \    在此之前，麻醉事實上是人類最奢侈且最遙遠的夢想。拔牙手術通常在病人的尖叫與哀嚎之中完成，甚至休克、死亡也是時有所聞的事。沒有人確切地知道當笑氣吸入到麻醉昏迷的劑量，會有什麼後果。雷格斯從麻醉的威爾斯口中拔出牙齒時，他一點反應也沒有。有一度他們很擔心，萬一威爾斯死了怎麼辦？可是威爾斯畢竟還是從麻醉中恢復過來。不但如此，他高興地大叫：「偉大的發現，偉大的發現──」\n\
    \    往後的十幾次無痛拔牙的臨床經驗使得威爾斯遠近馳名，許多人紛紛前來求醫。有人勸他趕快申請專利好大撈一筆，但是威爾斯志不在此。這個虔誠基督徒認為這一切是神的啟示。他說：「讓它像空氣一樣免費吧（Let\
    \ be free as the air）！」\n    不但如此，他還將之積極推廣。不久，有人將威爾斯及他的發現介紹給哈佛大學著名的外科醫師華倫教授。德高望重的教授對這個鄉下來的開業醫師自然是半信半疑，特別是這項發明還來自江湖郎中的表演。\n\
    \    儘管如此，華倫教授還是安排了一節「特別演講」的時間給威爾斯。於是在講堂上，威爾斯身兼講師、麻醉師、牙醫師，當場示範起來。接受拔牙是大學部的學生，而台下聆聽的學生幾乎都抱著懷疑的心情……\n\
    \    如同往常一樣，病人吸了笑氣之後，漸漸昏沉，失去反應，雙眼鬆弛、雙手下垂……威爾斯顯得有些緊張，他抓緊拔牙鉗，伸進病人微張的嘴裡，台下沒有一點聲音──\n\
    \    「啊──」這時病人發出的一聲慘叫，打碎了威爾斯的夢想。學生先是愣住了，接著笑鬧成一片。幾分鐘以後，威爾斯在所有人的噓聲以及嘲笑中，落荒逃離哈佛。這一聲大叫，足足使麻醉以及外科技術的發展延後了兩年。身為一個麻醉醫師，以現代的麻醉知識，我可以很容易地發現：一、笑氣的濃度因為呼吸設備的關係，並不容易達到麻醉深度。二、在淺麻下，病人的反射動作可能比清醒時還要強烈。這些問題，其實都是很容易改正的錯誤，然而在當時卻不是簡單的事。\n\
    \    威爾斯的後半生幾乎在悔恨之中度過。他認定示範的失敗導因於吸入氣體濃度不夠，因此重複地在自己身上做同樣的實驗。「明明有效啊！」他一再地質疑。\n \
    \   大部分的病人都對他熱心推銷笑氣的瘋狂態度敬而遠之。威爾斯漸漸變得固執，不易接近。他唯一能做的事，是一再地以自己做實驗來印證最初的理念。然而，再也沒有人相信這種江湖郎中的把戲。\n\
    \    過度的笑氣腐蝕了威爾斯的身心狀態。到了最後，他幾乎瀕臨崩潰狀態。警官在紐約的街頭，發現威爾斯語無倫次地謾罵，並持硫酸瓶攻擊來往的路人，只好將他逮捕，送入牢房之中。威爾斯在牢房漸漸冷靜下來，他留下了兩封信。一封給法官，陳述自己的罪行，另一封則給自己的愛妻莉莎，為自己無法維護自己的家庭感到抱歉。他的堅持導致他的瘋狂。……\n\
    \                                                                            \
    \                   節錄夢想的代價"
