- id: doc_113_台中_龍津_國文_g9s1e2_s2_33
  section: 2
  number: 33
  type: single
  page: 3
  stem: 有關「臺北市政府 1999 手語視訊服務」的說明，下列何者正確？
  options:
  - label: A
    content: 服務對象為聽障、語障、視障之民眾
  - label: B
    content: 一定要有自己的電腦或手機，才能使用此項服務
  - label: C
    content: 不論是手語視訊或文字之服務，皆為全年無休，24 小時不打烊
  - label: D
    content: 使用 Skype 或 LINE，都須加入聯絡人名單，經服務人員確認為聽語障身分後，方能使用此項服務
  group_stem: '請在閱讀後根據文章內容，回答下列問題。

    市政服務，「手」望相助：「1999 臺北市民當家熱線」是臺北市政府與市民的重要溝通橋梁，自民國九十九年六月一日起提供「1999 手語視訊服務」，以下為相關內容摘要，請閱讀後回答各問題。

    臺北市政府 1999 手語視訊服務

    1. 服務項目：

    舉凡 1999 相關的服務，包括諮詢、陳情、派工等服務皆可以手語方式為聽語障民眾解說，另外手語服務人員還可協助聽語障民眾撥打市府各機關電話，代為詢問相關市政問題。

    2. 服務時間：

    ① 手語視訊服務：平日 09：00 至 20：00，假日 09：00至 18：00。

    ② 文字服務：全年 24 小時不打烊。

    3. 取得服務方式：

    ① 透過有網路視訊設備的個人電腦，並安裝 Skype 軟體，將 1999 手語服務帳號（taipei1999_1 及 taipei1999_2）加入聯絡人名單，經服務人員進一步確認使用者為聽語障身分後，即可提供
    1999Skype 手語視訊服務。

    ② 透過手機免費通訊軟體 LINE，將 1999 手語視訊服務 ID（taipeicity1999）加入聯絡人名單，經服務人員進一步確認使用者為聽語障身分後，即可提供
    1999 LINE 手語視訊或文字服務。

    ③ 至 1999 手語視訊公共服務據點連線：截至 110 年 1 月 31 日，在臺北市內已設置七十二個公共服務點，包含各行政區之區公所、戶政事務所、健康服務中心、市立圖書館總館及各分館、身障會館、聯合醫院等。

    （資料來源：1999 市民當家熱線服務網）

    註：聽語障：指聽障、語障。聽障，指喪失聽力的人。語障，指有語言障礙的人。'
