  group_stem: '暇日出遊，得至吼山，離城約十餘里，不通陸路。近山見一石洞，上有片石，橫裂欲墮，即從其下蕩舟入，豁然空其中，四面皆峭壁，俗名之曰水園。臨流連石閣五椽，對面石壁有「觀魚躍」三字。水深不測，相傳有巨鱗潛伏。余投餌試之，僅見不盈尺者出而食啖焉。

    閣後有道通旱園，拳石亂矗，有橫闊如掌者，有柱石平其頂而上加大石者，鑿痕猶在，一無可取。

    遊覽既畢，宴于水閣，命從者放爆竹，轟然一響，萬山齊應，如聞霹靂聲。

    此幼時快遊之始。惜乎蘭亭、禹陵未能一到，至今以為憾。

    （節錄自沈復 浮生六記）'
