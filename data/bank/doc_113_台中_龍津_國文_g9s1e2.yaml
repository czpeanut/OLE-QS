- id: doc_113_台中_龍津_國文_g9s1e2_s2_29
  section: 2
  number: 29
  type: single
  page: 2
  stem: 根據本文，下列關於「協助盲人要遵循『問、拍、引、報』原則」的說明，何者正確？
  options:
  - label: A
    content: 「問」是指幫盲人問路
  - label: B
    content: 「拍」是指幫盲人拍照
  - label: C
    content: 「引」是指牽引導正方向
  - label: D
    content: 「報」是指告訴盲人報紙內容
  group_stem: '路上看到盲人，究竟該不該伸手幫忙，又該如何提供協助？定向行動訓練師謝曼莉昨天說，協助盲人要遵循「問、拍、引、報」原則，先詢問是否需要協助，也避免匆忙拉、推盲人前進，以免造成傷害。

    學習適當的盲人引導技巧，可確保引導者與視障者達到雙贏。首先觀察或出聲發問是否需要協助，一般有受過定向訓練的盲胞，可以手杖自行前進，貿然牽引反而會打亂他的「心理地圖」，若已有導盲犬引導者，也不需再額外引導。接著，給予協助時，應先伸出手，以手背與對方互碰，建立關係，讓視障者可順手找到帶領者的位置，並抓握住上手臂處，跟著牽引方向。

    行進過程中，引導者手臂自然放鬆勿亂擺動，讓視障者站在側身後方約一步的距離，配合被帶領者的步伐調整腳步，到達樓梯上下處，或須更改方向、碰上障礙物時，可先停下腳步，再以口頭提醒前方路況，確保安全。謝曼莉也提醒，協助視障者搭電梯，或遇到道路寬度不適合並肩通過時，必須採「窄道通行」的引導方式，引導者應將被握手臂移往自己的後背，提醒視障者站到引導者的正後方，才可避免撞到，切忌拉著盲人朋友的手倉卒趕路、趕搭電梯，寧可多花時間，也不要再發生類似頭撞電梯事件。

    （自由時報記者邱紹雯／臺北報導）'
