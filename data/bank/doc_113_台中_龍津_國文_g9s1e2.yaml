- id: doc_113_台中_龍津_國文_g9s1e2_s2_37
  section: 2
  number: 37
  type: single
  page: 3
  stem: 本文第幾段指出磨難可以增益能力？（原卷有誤，已修正）
  options:
  - label: A
    content: 第一段
  - label: B
    content: 第二段
  - label: C
    content: 第三段
  - label: D
    content: 第四段
  group_stem: '磨難有如一種鍛鍊，一方面消耗大量體能，一方面卻又強身健骨。

    對待磨難有兩種態度，一種是主動迎接，一種是被動承受。

    主動迎接磨難的人，在忍受磨難的痛苦時，內心多是坦然的，磨難使他好像刀劍愈見鋒芒；被動承受磨難的人，在為磨難所煎熬時，內心多充滿惶惑，磨難使他彷彿卵石愈見圓滑。

    就人生而言，總是從平坦中獲得的教益少，從磨難中獲得的教益多；從平坦中獲得的教益淺，從磨難中獲得的教益深；……因此，若想做一個非常平凡的人，則是磨難少一些更好，若想做一個出類拔萃的人，則不妨多經歷些磨難。'
