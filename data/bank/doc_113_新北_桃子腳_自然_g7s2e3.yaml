- id: doc_113_新北_桃子腳_自然_g7s2e3_s1_49
  section: 1
  number: 49
  type: single
  page: 5
  stem: 從上文中可以知道，溫帶雨林的形成與特色應該不包括何者？
  options:
  - label: A
    content: 該生態系雨量豐富，以樹木為主要植被
  - label: B
    content: 溫帶雨林多半在中緯度的沿海地帶，受海洋性氣候調節
  - label: C
    content: 溫帶雨林高大樹木的樹幹上附著許多蘚苔類與地衣
  - label: D
    content: 溫帶雨林環境潮溼，許多植物的根系相當紮實且廣又深。
  group_stem: "我們經常聽到熱帶雨林這個名詞，但很多人卻不知道中緯度溫帶也有雨林，溫帶雨林是特殊的海洋性氣候所造成的，因為稀少且生物多樣性豐富而彌足珍貴。不過因為溫帶雨林地處沿海，交通便利，人類活動頻繁，所以更容易被破壞。世界上一半的溫帶雨林已經毀滅，現存面積最大的一片，位於\
    \ 加拿大 卑詩省沿海，佔全世界溫帶雨林的四分之一，森林中最具代表性的野生動物就是大熊，也因此得到大熊雨林的稱號。\n  大熊雨林每平方公里的生物量，比熱帶雨林還高兩倍，森林中有高達百公尺、樹齡千年的參天古木，氣勢恢弘，這些中上層的喬木樹幹附生許多的地衣和苔蘚，是溫帶雨林的一大特色。由於環境潮溼，所以這裡的植物根系通常不深，雨林中可見許多被強風吹倒的朽木。不過，這些有機的腐植質，不但提供了小生物許多躲藏處，也為其他植物提供了養分，這也是為什麼溫帶雨林充滿無限生機的祕密之一。\n\
    \  美國 國家科學院學報發表了關於世界森林碳儲量的最新研究：「溫帶雨林比熱帶雨林能儲存更多的碳」。這對通過保護森林、努力減輕氣候變化具有重要意義，請回答第49~50題。"
