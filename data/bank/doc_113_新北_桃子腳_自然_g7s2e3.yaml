- id: doc_113_新北_桃子腳_自然_g7s2e3_s1_43
  section: 1
  number: 43
  type: single
  page: 5
  stem: 從上文中可以得知豬籠草在生態系中的角色為何？
  options:
  - label: A
    content: 分解者
  - label: B
    content: 消費者
  - label: C
    content: 生產者兼分解者
  - label: D
    content: 生產者兼消費者。
  group_stem: "豬籠草雖叫草，但其實他是有花植物，一般在八月開花。果實成熟後會散播出數百粒的種子，隨風飄送，繁殖後代。\n  豬籠草以其奇特的外貌而聞名，他葉的末端吊著一個圓筒形、像豬籠的構造，此構造其實是捕蟲囊，由卷鬚增大而成，捕蟲囊的囊蓋和紅色的內壁能分泌香甜的汁液，吸引貪吃的昆蟲。香甜汁液的背後其實是陷阱，捕蟲囊的內壁平滑，使昆蟲跌進囊中被黏住，然後被消化液麻醉、毒死，最後慢慢分解。然而，豬籠草主要還是以光合作用來製造養分，捕食昆蟲只是為了補充泥土中所缺乏的氮養分。因此，豬籠草有別於一般植物，除了擔當生產者的角色，他還擔任捕食的消費者。\n\
    \  除了適應貧瘠的土壤，豬籠草也懂得如何面對氣候環境。由於他生長在溫度高且潮溼的地方，因此捕蟲囊囊蓋能因應環境開合和防雨。每當捕蟲囊積水過多，卷鬚便會傾斜，倒去多餘的水分，以保持捕蟲的功能。此外，豬籠草為攀蔓植物，卷鬚有助植物攀爬在其他植物上，以取得更高的位置來吸收陽光，請回答第43~45題。"
