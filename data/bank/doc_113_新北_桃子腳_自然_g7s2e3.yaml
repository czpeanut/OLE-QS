  group_stem: '小緒趁暑假去海生館參觀，令他印象最深的是珊瑚館的華麗，心想：「這海底植物長得可真鮮豔呀！」但幸好沒有脫口而出，否則就糗大了，因為經過導覽人員解說後，小緒才知道珊瑚是由許多珊瑚蟲所組成，和海葵一樣屬於刺絲胞動物門的一員，具有刺絲胞。

