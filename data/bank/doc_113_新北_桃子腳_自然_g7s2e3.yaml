- id: doc_113_新北_桃子腳_自然_g7s2e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: '已知DDT是一種殺蟲劑，難以被生物代謝，且容易累積於內臟與脂肪中。附表為某食物鏈中甲、乙、丙、丁四種生物體內含有的DDT濃度。已知其中一種生物為生產者，根據上述，下列推論何者錯誤？


    | 生物種類 | 甲 | 乙 | 丙 | 丁 |

    | :--- | :--- | :--- | :--- | :--- |

    | 體內DDT的含量(ppm) | 2.0 | 0.2 | 20 | 0.04 |'
  options:
  - label: A
    content: 若人類捕食此環境中各種生物，體內的DDT濃度將大於 20 ppm
  - label: B
    content: 食性關係可能為丁→丙→乙→甲
  - label: C
    content: 4種生物中，丙可能是最高級消費者
  - label: D
    content: 減少攝食內臟與脂肪可減少毒物累積。
