  - label: C
    content: 1個群集，12個族群
  - label: D
    content: 4個群集，7個族群
  group_stem: 春仔、大鵬和文雯趁週末到臺南七股賞鳥，七股位於曾文溪出海口，屬於河口生態系，其生產者有富盛名的紅樹林植物，包含了海茄苳、五梨跤、欖李三種樹。三人
    प्रतिभागियों在那兒度過了一段美好的午後時光，看見小白鷺在黑面琵鷺旁撿便宜，捕食全不費工夫；紅腳的高蹺鴴、綠腿的青足鷸在同一片泥地裡覓食，還有小環頸鴴到處跑來跑去；泥灘上有清白招潮蟹、北方招潮蟹賣力跟他們招手，還有裝石頭的和尚蟹、彈塗魚都頗為新鮮有趣，請回答第35~36題。
