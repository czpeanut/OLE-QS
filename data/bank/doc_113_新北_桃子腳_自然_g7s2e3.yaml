- id: doc_113_新北_桃子腳_自然_g7s2e3_s1_46
  section: 1
  number: 46
  type: single
  page: 5
  stem: 菌根菌與樹木之間的交互作用，與下列那兩種生物之間的關係類似？
  options:
  - label: A
    content: 螞蟻與蚜蟲
  - label: B
    content: 山貓與雪鞋兔
  - label: C
    content: 鳥巢蕨與大樹
  - label: D
    content: 人與蛔蟲。
  group_stem: "有些真菌會與樹木根系共生形成菌根，稱為菌根菌。這類真菌可擴展樹木根系養分吸收面積，且於細胞外產生酵素，以增加植物可運用的磷和氮，並促進樹木耐旱性和抵抗病原微生物，所以亦有報導指出，某些特殊棲地中植物復育的成功，與其共生真菌接種成功與否有極大的關連性。\n\
    \  而樹木行光合作用則提供真菌主要的碳源，一些資料也估計樹木年淨生產力之50％～70％被運送至根部及提供共生的菌根菌使用，菌根菌之菌絲和滲出物，則是地面生產者(綠色植物)與土壤食物網間主要的鏈環，可提供土壤中細菌、原生動物、動物和小型真菌等能量的來源。此外，與樹木共生的真菌亦包含一些著名的食用菌，例如松口蘑(松茸)、塊菇(松露菌)、雞油菌等。，請回答第46~48題，請回答第46~48題。"
