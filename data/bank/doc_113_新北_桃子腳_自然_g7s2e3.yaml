- id: doc_113_新北_桃子腳_自然_g7s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 有關生物資源的敘述，下列何者正確？
  options:
  - label: A
    content: 野生動、植物因其繁殖力強，故可取之不盡
  - label: B
    content: 海洋的資源是無限的，人類應高度發展漁業技術，捕獵大量魚類，以解決人類糧食不足的問題
  - label: C
    content: 民眾常使用犀牛角、虎骨、魚翅等作為藥材與食材的行為，會使這些生物瀕臨絕種
  - label: D
    content: 為了促進經濟活動，我們可以大量向國外購買象牙、動物毛皮。
- id: doc_113_新北_桃子腳_自然_g7s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 下列有關軟體動物的敘述，何者錯誤？
  options:
  - label: A
