  group_stem: '齊宣王好射，說人之謂己能用彊弓也。其嘗所用不過三石，以示左右，左右皆試引之，中關而止，皆曰：「此不下九石，非王其孰能用是。」宣王之情，所用不過三石，而終身自以為用九石，豈不悲哉？

    （呂氏春秋 齊王射箭）

    註：①說：通「悅」，喜歡、高興

