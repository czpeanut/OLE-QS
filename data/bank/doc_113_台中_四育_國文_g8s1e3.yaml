- id: doc_113_台中_四育_國文_g8s1e3_s3_9
  section: 3
  number: 9
  type: single
  page: 2
  stem: 「哥倫布第一次航行在沒有海圖的大西洋時，在他私人的航海日誌上寫著：『今天我們仍然繼續航行，方向西南西。』當時情況非常惡劣，因為暴風雨不斷侵襲，哥倫布感到希望逐漸渺茫，信心似乎也開始動搖。然而在無助之時，他回過神，靠著直覺與智慧，堅定地下了決心—『今天我們仍然繼續航行，方向不變！』前進，再前進，最後，他終於找到新大陸。不要以為『一分一秒』過去，沒啥大不了，事實上，『每一分鐘都是一小時的開始』；我們若能隨時把握一分鐘，開始動手找事做，許多一分鐘加起來，就可以成就許多大事啊！想想，哥倫布發現『新大陸』，而在歷史上留名；其實，我們也可以發現『心大陸』，發掘『全新面貌的自我』！只要我們肯花心思、肯自我要求，天天有期許、有希望，則我們發現『心大陸』的成就，也可以媲美哥倫布啊！」根據這段文字，哥倫布的經驗告訴我們什麼道理？
  options:
  - label: A
    content: 直覺是判斷依據
  - label: B
    content: 守時是基本態度
  - label: C
    content: 自信是成功根源
  - label: D
    content: 堅持是續航之鑰。
