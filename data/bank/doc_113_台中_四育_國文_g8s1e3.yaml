- id: doc_113_台中_四育_國文_g8s1e3_s4_2
  section: 4
  number: 2
  type: single
  page: 3
  stem: 本文中提及有心人操控社群媒體的可能方式，不包含下列何者？
  options:
  - label: A
    content: 利用假帳戶帶動輿論風向
  - label: B
    content: 使用電腦病毒竊取個人資料
  - label: C
    content: 透過扭曲的消息挑起族群對立
  - label: D
    content: 藉由收集數據分析用戶的喜好。
  group_stem: '網路社群媒體本該帶來政治啟蒙，因為正確資訊能驅逐偏見和謊言。但Facebook坦承，2016年美國大選前後，已有1.46億Facebook用戶可能在平臺上看到來自境外散播的假消息。有的社群媒體用戶會看到上千個刻意操控的影音，有的平臺則是承認有數萬個與美國大選相關的假帳戶。社群媒體並未帶來啟蒙，反倒散播毒藥：假消息、仇恨、憤怒和偏見。這些假消息與假帳戶事件只是一部分，有些國際間的政治操弄，或是國家內部族群的對立，多少也有來自社群媒體的推波助瀾。


    研究指出，富裕國家的用戶，每天按觸手機2600次。社群平臺分析用戶對訊息的反應、收集數據、設計演算法，以帶動瀏覽、按讚和分享，這讓想製造輿論者有機可乘，他們能製作數個廣告，再分析哪些廣告讓人難以抵擋。


    社會出現改善呼聲，如Facebook設立獨立部門查核事實。可是由少數公司決定哪些言論適當也很危險，必須有所權衡。


    政府想藉由讓政治廣告的金主透明化來解決問題，但許多負面影響是來自一般人亂分享根本不可信的貼文。若是反托拉斯法①拆解社群媒體巨頭，又會使平臺數量增加，反倒難以管理。最有力的方式其實是調整演算法，不過這也可能造成另一種訊息的操控，所以須由法律或監管機構進行管制。

    （改寫自天下雜誌2017年11月）

    註：①反托拉斯法：為維持公平競爭，反對企業獨占市場的法案。'
