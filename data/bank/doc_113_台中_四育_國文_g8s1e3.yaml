  stem: '某心理學家讓兩組學生看同一張人像，對第一組說：「他是罪大惡極的罪犯。」對第二組說：「他是一位科學家。」當時學生描述照片中的人時，第一組學生說：「深陷的雙眼顯現出他充滿仇恨，突出的下巴證明他在犯罪道路上頑強的決心。」第二組學生說：「深陷的雙眼顯現出他思想的深度，突出的下巴證明他在科學道路上堅強的鬥志。」

    這項實驗設計的目的，最可能是在印證下列何者？'
  options:
