  stem: 戴晨志：「一個人必須積極、用功、認真、敬業，才能『讓幸運找上你』！『破窗理論』指出，當出現第一扇破窗時，如果我們不馬上加以修補好，不久，它就會變成一間破爛可怕的房子。人，也是一樣，如果做事沒熱忱、不積極、不敬業，它就會變成一種習慣，而讓自己變得消極、懈怠、沒目標、沒衝勁，最終變得平庸，靈魂變得破舊！所以，每天一醒來，就試圖感覺自己充滿信心、熱情有勁、活力十足，來展開一天生活吧！」這段文字中所謂的「破窗理論」是一種怎樣的狀態？
  options:
  - label: A
    content: 小洞不補變成大洞
  - label: B
    content: 熱情朝著目標前進
  - label: C
    content: 舊的不去新的不來
  - label: D
    content: 投入越多越覺得開心。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
