- id: doc_113_台中_四育_國文_g8s1e3_s4_11
  section: 4
  number: 11
  type: single
  page: 5
  stem: 根據本文判斷，下列何者最可能是作者認為「不恰當」的喝湯行為？
  options:
  - label: A
    content: 參加宴會時，侍者端上湯來，淺嘗數口即止
  - label: B
    content: 到人聲鼎沸的餐廳裡點碗熱湯，出聲喝個過癮
  - label: C
    content: 獨自在家「關起門來作皇帝」，想怎麼喝就怎麼喝
  - label: D
    content: 至國外洋餐館用餐，點碗熱湯，唏哩呼嚕一飲而盡。
  group_stem: '1981年某報刊登一則怵目驚心的消息。正題是「醜陋的觀光客」，副題是「國人海外旅遊舉止失態，洋人側目，影響國家形象。」文內列舉遊歐觀光同胞幾項毛病，「喝湯時聲音特大」赫然名列其中。

    「喝湯時聲音特大。」若這是好事，就會有人說這是保持固有的傳統了。奈何這是惡習，於是就有人想來「教育」你。區區喝湯也喝了六十多年了，深深體會到規矩與享受往往勢不兩立，而入國問俗的道理，又絕對不能含糊。輾轉思維，想出了一種陽奉陰違的兩全之計。於是在洋餐館中小酌，各自點菜時，就避免點湯，不讓出聲的「禍水」有可乘之機；遇到大宴，身不由主時，侍者端上湯來，淺嘗即止，場內鴉雀無聲，顯得高雅。

    可是好湯不能不喝，而且不能不出聲地喝。夫堂堂法律，為官的尚可以陽奉陰違，況喝湯乎？小民可以陰違之事本來就不多，在喝湯這件事上，還頗有活動的餘地。一處是在「關起門來可以作皇帝」的府上，只要老伴不嫌，喝湯出聲，是不會有人來「側目」的，更用不著擔憂什麼影響國家形象。另一處的天地更大，大約北美洲諸大城市，都有中國城或唐人街；這些地方最大的特色，就是餐館林立，餐館中的特色得一「鬧」字。說話不提高嗓門，對座之人都難於聽見，喝湯之唏哩呼嚕，早被更大的聲音淹沒了。這時一大碗酸辣湯，熱氣騰騰送到閣下座前，呼哩嘩啦，一瞬之間，碗已見底，額角冒汗，閒愁種種，俱已忘懷，此情此景，實是齒頰留芳，朵頤稱快之鐵證也。

    要觀光客喝湯不准出聲，以免影響國家形象，也未免幾近苛求。觀光客之中一定也有不少人辛苦多年，傾其所有，出門逍遙一番的，這種人一定要他時刻記住幫忙建立國家形象，負起任重道遠的國民外交重責，實在有欠公平。

    二十五、六年前有位屬於「快人快語」型的朋友，將出國觀光。餞行席上有不知趣之人，曉以國民外交的大義，並尊稱之為國民大使。此時酒過數巡，主客出話更快，聽到匹夫有責的大義，聽到大使的尊稱，忽然翻臉，立刻以連珠砲的語句斥之曰：「老兄，我是辛苦了一輩子，省吃儉用了一輩子，這次是傾其所有，出去見見世面，逍遙逍遙，請你不要給我戴高帽子，我不配做什麼國民大使。匹夫有責，責在遊覽。但是，請放心，我也不會在外國丟你的臉，不會比有些真做大使的更丟你的臉。」如今已過了二十五、六年，事過境遷，而此公說話神情，還歷歷在目，可惜當時竟沒有注意到此人喝湯是否出聲。

    現在想想，他很可能是一個「喝湯出聲」的人。

    （改寫自吳魯芹「喝湯出聲」辯）'
