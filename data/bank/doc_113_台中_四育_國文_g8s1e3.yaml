  group_stem: '「天才，是放對地方的人才」，我從一本娛樂雜誌上看到這句話，覺得它真有道理。很多人談到天才，總喜歡提到愛迪生，他「似乎」說過，天才是一分靈感加上九十九分努力。曾有個叫作拿破崙·希爾的作家造訪這個天才，問這位實驗了一萬次才發明電燈的科學家：「如果你第一萬次的實驗還是失敗了，你會怎麼辦？」

    愛迪生回答：「那我就不會在這裡和你瞎扯，我會在實驗室裡去做第一萬零一次的實驗。」

