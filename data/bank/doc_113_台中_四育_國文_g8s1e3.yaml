- id: doc_113_台中_四育_國文_g8s1e3_s3_5
  section: 3
  number: 5
  type: single
  page: 1
  stem: '相較於廣大的平民百姓，政務官、事務官、民意代表、媒體記者、知識分子都是掌有權力的人。政務官負責政策的擘劃，事務官負責政策的執行，民意代表負責審查，媒體記者負責監督，知識分子用知識和筆做時代的眼光。細究之下，每一種權力都很可怕，它可以興邦，可以覆邦，影響這一代人的此刻，下一代人的未來。掌權的人對自己手中所握有的權力—權力的性質、權力的界限、權力的責任，是否深思過呢？

    作者寫作這段文字的用意，最可能是下列何者？'
  options:
  - label: A
    content: 分析權力的種類並比較其影響力
  - label: B
    content: 說明各種權力之間必須互相制衡
  - label: C
    content: 警惕掌權的人使用權力時應戒慎恐懼
  - label: D
    content: 強調知識分子應負起繼往開來的社會責任。
