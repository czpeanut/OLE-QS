- id: doc_113_新北_崇林_國文_g7s1e3_s4_44
  section: 4
  number: 44
  type: single
  page: 4
  stem: 根據文章，下列何者是父親不送作者到校門口的原因？
  options:
  - label: A
    content: 感到驕傲，自視高
  - label: B
    content: 生活忙碌，趕上班
  - label: C
    content: 不忍與作者分離
  - label: D
    content: 怕作者丟臉。
  group_stem: "博士學位讀完之後，我回臺灣教書。到大學報到第一天，父親用他那輛運送飼料的廉價小貨車長途送我。到了我才發覺，他沒開到大學正門口，而是停在側門的窄巷邊。卸下行李之後，他爬回車內，準備回去，明明啟動了引擎，卻又搖下車窗，頭伸出來說：「女兒，爸爸覺得很對不起妳，這種車子實在不是送大學教授的車子。」我看著他的小貨車小心地倒車，然後噗噗駛出巷口，留下一團黑煙。直到車子轉彎看不見了，我還站在那裡，一口皮箱旁。\n\
    \  每個禮拜到醫院去看他，是十幾年後的時光了。推著他的輪椅散步，他的頭低垂到胸口。有一次，發現排泄物淋滿了他的褲腿，我蹲下來用自己的手帕幫他擦拭，裙子也沾上了糞便，但是我必須就這樣趕回臺北上班。護士接過他的輪椅，我拎起皮包，看著輪椅的背影，在自動玻璃門前稍停，然後沒入門後。\n\
    \  我總是在暮色沉沉中奔向機場。\n    火葬場的爐門前，棺木是一只巨大而沉重的抽屜，緩緩往前滑行。沒有想到可以站得那麼近，距離爐門也不過五公尺。雨絲被風吹斜，飄進長廊內。我掠開雨溼了前額的頭髮，深深、深深地凝望，希望記得這最後一次的目送。\n\
    \  我慢慢地、慢慢地了解到，所謂父女母子一場，只不過意味著，你和他的緣分就是今生今世不斷地在目送他的背影漸行漸遠。你站立在小路的這一端，看著他逐漸消失在小路轉彎的地方，而且，他用背影默默告訴你：不必追。\n\
    （節錄自龍應台〈目送〉"
