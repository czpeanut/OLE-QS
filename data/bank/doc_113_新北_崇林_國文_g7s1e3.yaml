  stem: 「余憶童稚時，能張目對日，明察秋毫。見藐小微物，必細察其紋理，故時有物外之趣。」關於這段文字，下列說明何者正確？
  options:
  - label: A
    content: 作者認為藐小微物能帶來許多樂趣，期許大家養成留心觀察周遭事物的習慣
  - label: B
    content: 為全文綱領，作者敘述自己能時常體會到物外之趣，是因為喜歡細心觀察事物
  - label: C
    content: 以驚喜的語氣表達對藐小微物的崇敬，也鼓勵大家多探索自然
  - label: D
    content: 將生活瑣事比喻為有趣的事物，勉人多享受生活。
