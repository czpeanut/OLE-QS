  stem: 關於〈鬧元宵〉一文的說明，下列何者正確?
  options:
  - label: A
    content: 作者認為購買「圓筒狀像手風琴般可以伸縮的紙燈籠」是傻事，因為紙燈籠可自行製作，不必花錢購買
  - label: B
    content: 「後來只要聽到遠遠的鑼鼓聲，索性先關燈閃人。」因為有太多人打著拜年旗幟，組成舞龍隊來討紅包
  - label: C
    content: 「元宵是夜，這些曾穿梭在街頭巷尾的活龍，全要集合在廟前火化了。」是欲藉由火化增添元宵夜光彩
  - label: D
    content: 全文採用倒敘法，先寫現在對元宵節的感受，再回想童年過節提燈籠、看舞龍趣事。
