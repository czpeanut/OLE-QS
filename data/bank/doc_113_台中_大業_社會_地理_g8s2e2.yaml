- id: doc_113_台中_大業_社會_地理_g8s2e2_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 穆罕默德出生時，西亞的商業交易已十分繁榮，但往往是富商獲得較大利益，貧民生活則窮困不堪，貧富差距非常大。在這個背景下，穆罕默德以幫助弱勢為前提，於［
