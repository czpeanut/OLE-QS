    content: 以色列和巴勒斯坦：印度教和伊斯蘭教
  - label: C
    content: 印度和巴基斯坦：猶太教和伊斯蘭教
  - label: D
    content: 以色列和巴勒斯坦：猶太教和伊斯蘭教
  group_stem: '（三）111 年國中會考作文題目為「多做多得」，一位同學以難民議題為例，寫出讓閱卷老師驚艷不已的佳作，被評為滿分6 級分，並收錄為範文。以下節錄自此篇作文，請閱讀文章後，回答下列問題。

    國際新聞上，「難民收容」一直是棘手的問題。由於西亞和北非國家間的宗教衝突，數千萬的百姓每日飽受干戈摧殘。無數新聞頭版上，張貼著一張張震撼人心的悽慘照片。身處各地的人們無不對戰火下的難民深表同情，同時也期望臨近戰區、經濟發展平穩的歐洲國家能夠伸出援手。（完整範文見第4
    頁）'
