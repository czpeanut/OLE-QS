  section: 1
  number: 16
  type: single
  page: 2
  stem: 伊斯蘭曆的第九個月被定為「齋戒月」，在這個月分，穆斯林會在從日出到日落進行齋戒，他們希望透過自律與節制，磨練耐心、忍耐、寬容與慈悲，以提升精神境界，拉近與真主阿拉的距離。齋戒月時，穆斯林從日出到日落都禁止某項行為，待日落才能進行，上述的某項行為是指什麼？
