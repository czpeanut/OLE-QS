  group_stem: '（二）閱讀下面這篇新聞摘要，並回答問題：

    2024 年，在沙烏地阿拉伯的年度朝覲儀式中，至少有1,301 人死亡，死因是酷暑造成的中暑和脫水。在朝覲中死亡的人會直接埋葬在聖城    ，費用由沙國負擔，但家屬無法得知確切墓穴，只能知道位於哪一處墓地。

    官方統計，死者當中包含660 位埃及人，當中只有31 人擁有朝覲許可。《美聯社》統計，另有200 餘位死者來自印尼，98 位來自印度，其餘國籍包含約旦、突尼西亞、摩洛哥、阿爾及利亞、伊拉克、巴基斯坦、塞內加爾、蘇丹與馬來西亞等，還有2
    位擁有美國籍。

    少部分死者為年長者或患有慢性病者，身體狀態不佳，他們可能希望在生前把握最後機會朝覲，且認為能夠埋葬在聖城之內是種祝福，因此並不排斥在朝覲過程中離世。

