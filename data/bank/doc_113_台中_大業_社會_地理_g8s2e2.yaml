- id: doc_113_台中_大業_社會_地理_g8s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 這種樹被西亞與北非地區的人們稱為「生命之樹」，因為它能在乾旱、炎熱的沙漠中生長，對於當地生活至關重要。它的根系發達，可深入地下找尋水源，樹葉可遮蔭、枝幹可建屋、果實可食用。古代商隊穿越沙漠時，綠洲中有沒有這種樹，常被視為生存的關鍵。因此，它不只是農作物，更象徵著生機與希望。上面提到的樹，它的名稱是什麼？
  options:
  - label: A
    content: 椰棗
  - label: B
    content: 棗椰
  - label: C
    content: 棉花
  - label: D
    content: 橡膠
