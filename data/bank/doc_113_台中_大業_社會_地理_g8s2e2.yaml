  section: 1
  number: 12
  type: single
  page: 1
  stem: 在西亞與北非的山麓地帶，為了充分利用稀少的水源，當地居民使用坎井系統，將地下水從山麓匯集至綠洲。坎井由豎井、暗渠、明渠和蓄水池組成，其中暗渠是地底下的輸水渠道，一般長度可達數公里長，當地人大費周章將引水渠道修築在地面下，其主要目的是什麼？
