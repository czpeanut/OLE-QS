- id: doc_113_台中_大業_社會_地理_g8s2e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 在太陽升起前，穆斯林會洗淨手足與臉龐，鋪上小毯子，面朝麥加祈禱，展開新的一天；到了正午，無論是在課堂或戰場上，穆斯林會暫停手邊的事，安靜地完成一段固定的動作與祈詞；傍晚時，他們會再一次進行祈禱；日落時分，穆斯林回到家，全家人再次啟動這段心靈對話；而當夜幕降臨時，最後一次的祈禱帶來一天的圓滿與平靜。每一次，他們都會面朝麥加的方向，虔誠地誦念經文、祈禱和跪拜。上述內容為伊斯蘭教「五功」中的哪一項？
  options:
  - label: A
    content: 念功
  - label: B
    content: 禮功
  - label: C
    content: 課功
  - label: D
    content: 朝功
