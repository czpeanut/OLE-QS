  section: 4
  number: 16
  type: single
  page: 2
  stem: 'The earliest record of people wearing the flip-flop(人字拖) comes from Egypt.
    Other cultures had their own types of flip-flop. For Greeks, the toe strap(綁帶)
    ran between the first and second toes. For Romans, sandals(涼鞋) had the strap between
    the second and third toes. The Mesopotamians wore the strap between the third
    and fourth toes. For Indians, “toe knob” sandals had a knob between the first
    and second toes.

    Which culture most likely created the sandals shown(展示) in the picture?'
  options:
  - label: A
    content: Indian.
  - label: B
    content: Greek.
  - label: C
    content: Mesopotamian.
  - label: D
    content: Roman.
