    content: How many restaurants are in Devon.
  group_stem: '[C]

    If you are planning on having a pleasant(令人愉快的) meal with the whole family at
    a Sugar Factory for Thanksgiving, you had better pick a different restaurant chain(連鎖店).
    Cases(案例) of the deadly stomach bug have reached three new states, and it doesn’t
    look like they are going to stop anytime soon. This brings the count up from six
    states to nine.

    The first cases were reported in the northern states of Devon and Grant at the
    end of October. So far 55 people have come down with the bug(病菌), and 52 of them
    said they had eaten at a Sugar Factory a week before they got sick. That was not
    good news for the chain because it had to close 43 restaurants in those states(州)
    alone.

    The Center for Public Health says that the bug first spread(蔓延) south and then
    east. Now, seven more people in the middle states have come down with the bug
    and are in the hospital fighting for their lives. If just one of them kicks the
    bucket, that could mean the end of the line for the Sugar Factory.

    (Nora Flanagan, Daily Post)'
