- id: doc_112_桃園_文昌_英語_g9s1e1_s6_36
  section: 6
  number: 36
  type: single
  page: 4
  stem: What is the reading mostly about?
  options:
  - label: A
    content: Which Australian languages are spoken around the world.
  - label: B
    content: One of Australia’s dying languages.
  - label: C
    content: How native people in Australia have been treated.
  - label: D
    content: The history of Wik Mungkan.
  group_stem: '[A]

    In the world today, over 7,000 languages are still alive and spoken(說). 23 of
    them have at least 50 million speaker. What’s more, 4.1 billion people have one
    of those 23 languages as their first language.

    Even so, reports show that about one language died every two weeks. An example
    of this is Wik Mungkan. It is one of the languages still spoken(說) by the native
    people of Australia. There were once over 250 languages, but now only about 120
    are still used, with 13 of them spoken by all age groups. Just like with the native
    people of North America, the children of the native(土著的) people of Australia grow
    up learning and speaking only English.

    The charts below show some of the changes in the Wik Mungkan language from 2004
    to 2014. From the first one, we can see that the number of speakers dropped by
    nearly one-third. Then, in the table(表格), those speakers used the language less
    in their daily lives. If nothing is done(做) to stop this soon, we may all be seeing
    the end of another language.


    | age | 0-19 | 20-39 | 40-59 | 60+ |

    | :--- | :--- | :--- | :--- | :--- |

    | 2004 | All day, most days | All day, most days | All day, most days | All day,
    most days |

    | 2014 | Often | Often | Often | Always |'
