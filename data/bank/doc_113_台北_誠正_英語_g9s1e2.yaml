- id: doc_113_台北_誠正_英語_g9s1e2_s3_43
  section: 3
  number: 43
  type: single
  page: 4
  stem: What might the best title of this poem be? poem 詩
  options:
  - label: A
    content: Weather Report
  - label: B
    content: School Rules
  - label: C
    content: Family Love
  - label: D
    content: Voice Assistants
  group_stem: 'C.第43-45 題


    A heart so big, it fills the sky,

    It holds us close, never ask why.

    When we are sad, it dries our tears,

    And speaks softly, "For you, all ears."


    It picks us up when we are weak,

    It helps us go through the way we seek.

    With every smile, with every kiss,

    It shows us what true joy is.


    It’s the light that shines at night,

    That makes our world feel warm and _______.

    It’s the hand that pushes us high,

    And makes us feel we can fly.


    Through every storm, through every sun,

    It’s always there, it’s never done.

    No idea what, it will stay,

    A deep care that warms your day.


    tear 眼淚softly 輕輕地seek 尋找storm 暴風雨'
