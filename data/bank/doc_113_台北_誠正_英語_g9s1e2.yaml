  group_stem: "B.第39-42 題                   (All the information is on Max and Sandy’s\
    \ list.) \n① Where to stay \n★Coco Spring House \nRoom price: 3500 for one night\
    \ \nIn a room, the hot spring and ice cream in the fridge can be taken anytime.\
    \ \nPlace: 300 meters from Tiger Park. \n\n★Art Spa Hotel \nRoom price: 6000 for\
    \ one night \nLarge hot and cold spring pools inside the room and free dinner\
    \ in the best restaurant.  \nPlace: Near Milo Train Station  \n\n② What to eat\
    \ \n◍ Chili Hunter \nOpen hours:10 a.m.-10 p.m. (every day) \nFood: Different\
    \ types of spicy cookies and ice cream \n\n Ke’s Pancakes \nOpen hours: 9 a.m.-7\
    \ p.m.(Thur.-Tue.) \nFood: Pancakes with or without eggs \n\nRaku Ramen \nOpen\
    \ hours: 11 a.m.-2 p.m., 5 p.m.-8 p.m. ( Fri.-Wed.) \nFood: Hot ramen while resting\
    \ feet in hot spring water \n\n(Max and Sandy are talking about their two-day\
    \ trip.)  \nMax: What do you think of our hotel? \nSandy: I love it! We can take\
    \ a hot bath and enjoy free ice cream at the same time. By the way, what should\
    \ we have for dinner? \nMax: The pancake is famous, but it is closed today. Well,\
    \ we can go at lunch tomorrow and then try spicy ice cream at Chili. It’s not\
    \ far from here. \nSandy: Great! Tonight, how about hot ramen? It’s just like\
    \ noodle soup with some meat. There is also a hot spring pool for feet in the\
    \ store. \nMax: Sure thing!                                                  \
    \                  spicy 辣的"
