- id: doc_113_台北_誠正_英語_g9s1e2_s3_35
  section: 3
  number: 35
  type: single
  page: 3
  stem: What is a digital wallet?
  options:
  - label: A
    content: A place for people to save money.
  - label: B
    content: An app with your card information for shopping
  - label: C
    content: A leather wallet with lots of money
  - label: D
    content: An online store for doing some shopping
  group_stem: "A. 第35-38 題 Digital Wallets: The New Way to Pay\n    Digital wallets\
    \ are becoming a popular way to pay for things and services. With just a smartphone\
    \ or computer, you can save your credit card information, and even bank card in\
    \ one app. Many people enjoy using digital wallets because they are easy and safe\
    \ to use.\nToday, digital wallets are not just used for online shopping, but also\
    \ for buying things inside the store. Apps like Apple Pay, Google Pay, and PayPal\
    \ are widely used around the world. They allow users to pay by easily tapping\
    \ their phone on a machine, or scanning code. After the COVID-19 pandemic, digital\
    \ wallets become more useful than before. There is a chart showing who would use\
    \ digital wallets often.\n\nWhy Are Digital Wallets Popular?\n1. Convenient: You\
    \ don’t need to hold cash or credit cards.\nEverything is in one place, ready\
    \ to be used.\n2. Safe: Digital wallets use passwords and sometimes even face\
    \ recognition to keep your money safe.\n3. Quick: With digital wallets, you can\
    \ pay in seconds online or in a store.\n\nWhen digital wallets bring a lot of\
    \ benefits to people, they will become even more common in our daily life. Leather\
    \ wallets or real cash may not be seen anymore in the future.\n\ndigital 數位的app\
    \ 應用程式tap 輕觸scan 掃描\npandemic 傳染病chart 圖表usage 使用passwords 密碼recognition 辨認leather\
    \ 皮製的"
  shared_asset: g3_35_38
