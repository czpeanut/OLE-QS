  stem: 根據文章，下列選項敘述何者正確？
  options:
  - label: A
    content: 梨泰院踩踏事件的死亡人數女性多於男性
  - label: B
    content: 梨泰院踩踏事件是歷史上第一起人群踩踏事件
  - label: C
    content: 梨泰院踩踏事件是發生在漢彌爾頓飯店裡面
  - label: D
    content: 梨泰院踩踏事件原本是為了慶祝聖誕節活動
  group_stem: '2022 年10 月29 日晚間南韓 首爾市中心龍山區的梨泰院一帶，正值萬聖節大型慶祝活動，現場聚集大約10 萬人潮，漢彌爾頓飯店旁、地鐵梨泰院站斜對角的一條4
    公尺寬、45 公尺長的斜坡巷弄中，發生嚴重推擠踩踏意外。《韓聯社》報導，截至當地時間30 日下午5 時，官方宣布已有153 人死亡，97 人為女性，56 人為男性。

    梨泰院事件初步判斷是人群擁擠踩踏所致，歷史上其實早已有多起人群踩踏事。德國學者Dirk Oberhagemann 為德國消防安全協會製作的調查報告中，以人群密度來衡量群眾活動，點出人擠人的風險。

    Dirk 以每平方公尺涵蓋人數來衡量擁擠程度。當每平方公尺僅有2 人時，人與人完全「脫鉤（decoupled）」，亦即兩人可以免於肢體接觸地自由活動，此時受傷機率近乎零。每平方公尺有5
    人時，雖然有限但人們仍然有足夠空間活動，此為踩踏事故的臨界密度。

    當每平方公尺達到6 人時，幾乎已沒有空間活動，此時只要有人被絆倒，骨牌效應將讓這一平方公尺的6 人產生約600 至700 牛頓（N）的力量並往外傳遞，此時受傷風險開始增加。每平方公尺達到7
    人以上時，受傷與死亡風險極高，個人喪失行動能力，人群擠壓的來回波動互相衝擊。此時群眾就像是液體，無法控制自己也無法幫助旁人，這些「人浪」可以隨機往外波動至少12
    米。而群眾中部份人的死因即是被周圍人群施加的力量，導致窒息而死。

    非營利媒體《The Conversation》，根據德國人群行為研究學者Mehdi Moussaïd 著作《Fouloscopie》，整理群聚場合逃生指南如下：

    1.觀察並離開

    一旦感到不適且仍有足夠移動空間就應該離開擁擠區域，若還可移動，先往人潮稀少處走，也可以嘗試往上方看，檢視是否有高處或是其他建物或柵欄可以攀爬逃脫。

    2.保持站立

    若已經難以脫身，應保持平衡及站立，人群中若有人跌倒，便會產生骨牌效應，其他人的身體重量也將壓倒在跌倒者身上。

    3.控制呼吸

    人群擁擠狀態中，氧氣是最珍貴的資源，因此非必要切勿大叫、尖叫，並保持穩定呼吸。

    4.手環抱胸

    踩踏事件中的絕大多數死亡是由窒息引起，若以感受到推擠壓力，應將雙手折疊在胸前，並在與肋骨保持幾公分距離，讓自己有呼吸的空間。

    5.遠離障礙

    遠離牆壁、柱子、柵欄等障礙物，避免人群擠壓遭撞傷。

    6.順應人潮

    在擁擠人潮中抵抗將浪費體力，因此應保持平衡，順著人群移動方向走。

    ——改寫自公視新聞網〈梨泰院意外釀153 人死 踩踏事故怎麼發生的？擁擠場所如何自保？〉'
