- id: doc_111_高雄_林園_國文_g8s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 「好銳利的喜悅刺上我的心頭」一句將抽象的「喜悅」搭配「刺」這個動詞字眼，將它轉化為具體的尖銳物體，下列是香港歌手鄧紫棋作品的歌詞，請問哪一個選項也採用了這樣化抽象為具象的手法？
  options:
  - label: A
    content: 記憶裡快樂再真切 早已被冷空氣凝結／而此刻月亮下 只有伶仃的一個墓地／守護著死去的愛（紅薔薇白玫瑰）
  - label: B
    content: 岸一直把浪推開／海浪卻一次次回來／桑田滄海 愛是依舊無改（老人與海）
  - label: C
    content: 面對浩瀚的星海／我們微小得像塵埃／漂浮在一片無奈（光年之外）
  - label: D
    content: 他們以正義為口號 肆意地咆哮／字縫裡橫行霸道／他們的笑裡全是刀 話裡是毒藥／多少人已被吃掉（受難曲）
  lesson_raw:
    title: 鳥
    basis: 引用梁實秋〈鳥〉課文「好銳利的喜悅刺上我的心頭」
  tags:
