  stem: 關於年度代表字大選的由來與制度，下列哪一個選項是正確的？
  options:
  - label: A
    content: 首先是由台灣發想的選字競賽，後來2008 年被日本仿效
  - label: B
    content: 日本須付費投票，可用手機簡訊，每通相當台幣10 元
  - label: C
    content: 台灣請社會知名人士推薦候選字，呈現當時生活狀況
  - label: D
    content: 台灣於每年12 月的第一週截止投票，於次年正月公布
  group_stem: '台灣年度代表字大選，是聯合報自2008 年起仿效日本「今年的漢字」，每年年底對台灣民眾徵集投票選出一個代表性漢字，旨在表現該年台灣的社會面貌與心靈風景。主辦單位都會請社會知名人士寫下當年代表字，並於每年12
    月第一週後公布結果，並從歷年代表字解讀台灣的社會變遷。

    日本的「今年的漢字」投票免費，但台灣年度代表字大選為付費投票，手機簡訊每通新台幣10 元，手機直撥每秒0.2元。2010 年起主辦單位以維護公平性為由不再於票選過程中公開票數，引起部份民眾不滿

    以下節錄2012 年到2022 年的台灣年度代表字：


    | 年份 | 代表字 | 推薦人 | 票數 | 概要 |

    | --- | --- | --- | --- | --- |

    | 2012 | 憂 | 陳建仁 | 8,094 | 末日預言、歐債危機、薪資倒退、物價上揚。 |

    | 2013 | 假 | 黃光國、韓良露、陳玉峰 | 17,790 | 胖達人香精麵包及大統假油等食安事件；楊念祖抄襲事件。 |

    | 2014 | 黑 | 張上淳、楊志良、向陽 | 12,489 | 爆發主張反黑箱服貿並以黑色調為代表的太陽花學運；黑心商人製造黑心油品、黑心食品等事件。
    |

    | 2015 | 換 | 蔡英文、劉克襄 | 13,842 | 社會普遍期待汰舊換新的情況。 |

    | 2016 | 苦 | 楊丞琳 | 10,328 | 年初美濃地震引發台南維冠金龍大樓倒塌事故；多個颱風侵襲台灣；整體經濟狀況未好轉且兩岸關係急凍；勞基法一例一休及廢除七天國定假日之爭；歐美瀰漫保護主義及民粹主義、英國脫歐、唐納·川普當選美國總統。
    |

    | 2017 | 茫 | 彭啟明 | 12,445 | 全球氣候變遷；台灣未來發展茫然。 |

    | 2018 | 翻 | 張升星 | 10,929 | 國內外出現各種推翻現狀的情況。 |

    | 2019 | 亂 | 李安、李家同 | 10,323 | 華航及長榮罷工事件、國安局私菸案、南方澳大橋斷裂事故等。 |

    | 2020 | 疫 | 陳建仁、周志浩、陳雲亮、盛治仁、吳寶春、吳俊霆 | 28,441 | COVID-19 疫情席捲全球，全球共同防疫。 |

    | 2021 | 宅 | 馮寄台、鄭文燦、宣明智、王文華 | 8,402 | COVID-19 疫情持續以及全國三級警戒使人們宅在家裡的時間變長。 |

    | 2022 | 漲 | 謝繼茂 | 7,871 | 受到俄烏戰爭、能源吃緊、COVID-19 疫情未平、供應斷鏈、美國貨幣緊縮政策等多重因素影響，造成物價上漲。
    |


    ——摘選自〈維基百科〉'
