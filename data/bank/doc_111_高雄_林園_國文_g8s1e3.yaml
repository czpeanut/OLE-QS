  group_stem: '我想買春聯，只要幾個「春」字、「福」字、一張「大家恭喜」就可以了，可是該到哪兒買呢？我不要大賣場裡賣的，那些都是印刷品，我要手寫的，筆酣墨濃的書法，看得見汁液的流動、新乾的痕跡，這年頭得到哪兒買這樣的春聯呢？

    遺憾自己的字不好。其實學生時代練過字的，臨過宋徽宗的瘦金體、趙孟頫的行楷。瘦金體的書法甚至影響了我的硬筆字，懂字的人一眼就看出來。曾有朋友批評我不應該練瘦金體，他說我人太瘦，該練顏體，讓自己厚實些。當時我聽得一愣一愣的，後來想起真是胡說八道，那麼難道胖的人練了瘦金體就能減肥嗎？我在洛杉磯念書時，更聽過一位大陸同學批評趙孟頫，說他的字太媚，怪不得能事兩朝。我心想，我不過就練過這麼兩種字體，崇拜的兩位書法家，一個亡國、一個被說得行近賣國，我怎麼這麼倒楣呢？

    我的大哥卻寫一手好字，小時候他老對我說：「我左手寫的字都比你的好看！」那是真的，因為他是左撇子。根據媽媽的說法，大哥小時候似乎很愛哭，她說：「你大哥從學校回來，哭他不會寫毛筆字，我們馬上找隔壁韓伯伯教他寫字。」是因此，所以大哥的字打了好根柢嗎？韓伯伯的字寫得好，那時過年，他總要寫許多春聯分送給大家。我們家的春聯常是韓伯伯送的。

    我呢，是爸爸扶著我的手教我寫字。爸爸的字雖然沒有韓伯伯寫得好，卻是他從大陸唯一帶出來的東西了。當年他到福建 馬尾想要當海軍，年紀太小，資格不符，可是辦事員發現他的字寫得不錯，就讓他謊報年齡上了船。不知是否從此他對自己的出生年錯亂了？總是不確定到底是哪一年生的。那樣的時代就有那樣的事。

    ——節選自宇文正〈買春聯〉'
