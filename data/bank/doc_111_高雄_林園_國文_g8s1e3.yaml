- id: doc_111_高雄_林園_國文_g8s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 〈冬陽〉一文中「搶著探頭的櫻花，開始只是羞怯地冒著幾朵，很快卻像點燃成串鞭炮，劈哩啪啦肆無忌憚地開滿一樹。」以鞭炮燃燒的聲音描寫櫻花盛開的景象，即用聽覺印象表達視覺效果。下列是在新詩領域中有「詩魔」之稱——洛夫的作品，對於感官經驗的互通與轉移描寫，哪個選項的判斷是錯誤的？
  options:
  - label: A
    content: 〈西貢夜市〉：嚼口香糖的男子＼把手風琴拉成＼一條那麼長的無人巷子➔以視覺印象表達聽覺效果
  - label: B
    content: 〈華西街某巷〉：一位剛化過粧的女人站在門口＼維持一種笑＼有著新刷油漆的氣味➔以味覺印象表達視覺效果
  - label: C
    content: 〈迴響〉：怎麼也想不起你是如何瘦的＼瘦得如一句簫聲＼試以雙手握你＼你卻躲躲閃閃於七孔之間➔以聽覺印象表達視覺效果
  - label: D
    content: 〈水涯〉：而此時，有髮香蜿蜒而來＼如清泉流過唇際＼驀然反身，居然見到＼你眼中開放了＼一池那麼動人的睡蓮➔以觸覺印象表達嗅覺效果
  lesson_raw:
    title: 冬陽
    basis: 題幹提及〈冬陽〉課文
  tags:
    textbook: 八上 第一課 小詩選(一)跳水(二)風箏
