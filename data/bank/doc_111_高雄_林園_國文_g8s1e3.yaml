- id: doc_111_高雄_林園_國文_g8s1e3_s2_37
  section: 2
  number: 37
  type: single
  page: 7
  stem: 根據故事情節，蒞陽長公主與天泉山莊夫人，主要是因什麼原由到睿山山廟待產？
  options:
  - label: A
    content: 因產婆建議此處適宜安胎
  - label: B
    content: 奉皇帝命令兩夫人須軟禁
  - label: C
    content: 欲請教山廟高手下棋技藝
  - label: D
    content: 為躲避京城瘟疫疫情爆發
  group_stem: '二十四年前，甯國侯謝玉離開他懷孕的妻子——當朝皇妹蒞陽長公主出征西夏，同年，江湖世家天泉山莊的莊主卓鼎風也將身懷六甲的愛妻送到金陵委託朋友照顧，自己前往苗疆約戰魔教高手。誰知天有不測風雲，一次被民間俗稱為「鎖喉」的疫情突然暴發，為躲避瘟疫，城內的達官貴人們紛紛離開，到附近的清靜山廟避災，而謝
    卓兩家夫人巧之又巧地住到了同一座廟裏的東西兩院。

    由於山中寂寞，兩位夫人有了交往，彼此都覺得性情相投，常在一處起坐。這天，兩人正聚在一起聊天弈棋，突然同時陣痛起來。其時外面正是電閃雷鳴、風雨大作，隨行的僕從們惶惶然地忙亂到深夜，終於有嬰兒的啼哭聲響起，兩個男孩幾乎是先後腳一起落草。在一片喜笑顏開中，產婆們捧著這金尊玉貴的兩個小公子到外間準備好的一個大木桶裏給嬰兒浴身。

    就在此時，意外發生了。古廟院中一株空心柏被雷電擊中，一段粗枝轟然斷裂，砸在產房屋頂上，瞬那間瓦碎梁歪，窗櫺也被震落，狂風猛捲而入，屋內燭火俱滅，一片尖叫聲。侍衛和婢女們慌慌張張搶出兩位夫人，被嚇得向後跌坐在地上的產婆們也手忙腳亂地摸黑從木桶裏撈出嬰孩，逃了出去。好在有驚無險，無人受傷，重新擇房安頓好了產婦之後，眾人剛鬆了一口氣，就突然發現了一個大問題。摸黑被抱出的兩個男嬰，赤裸裸身無牽掛，一般樣皺皺巴巴，一般樣張著嘴大哭，重量相仿，眉目相似，哪個是謝夫人生的，哪個又是卓夫人生的？

    到了第二天，問題更加沉重，因為其中的一個男嬰死了。謝夫人既是當朝長公主，這件事就不可避免地驚動到了當今天子。大梁皇帝蕭選下旨命兩家帶著嬰孩入宮，派御醫滴血認親，誰知嬰兒的血居然跟誰的都相融，根本沒有區別，再一看兩對父母的模樣，皇帝知道事情難辦了。謝玉與卓鼎風都是長身玉立，五官明晰，兩位夫人都是柳眉杏眼，秀麗文雅；雖說不算很像，但細察其五官，輪廓特徵竟然差不多。即使等孩子長大，只怕也難單憑長相，就判定他到底是誰家之子。

    皇帝抱著嬰兒看了半天，雖無決斷，但因心中十分喜愛，便想出了一個折中之計：「既然無法確認這孩子究竟是何人之子，那他姓謝姓卓都不合適，朕就賜國姓於他，按皇子輩取名，叫景……景睿好了，他生在睿山之上嘛。一年住在謝家，下一年就住在卓家，算是兩姓之子，如何？」皇帝作了主，何況也沒有更好的辦法，大家也只能同意。就這樣，蕭景睿便有了雙重身份，即是甯國侯
    謝家的大公子，也是天泉山莊卓氏門中的二少爺。而素無往來的謝 卓兩家也由此變得有如親族一般，關係緊密。

    ——改寫自海宴《瑯琊榜》'
