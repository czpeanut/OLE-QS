  group_stem: "坐在這樣的樹下，又使我想起自己平日對人品的觀察。我常常覺得自己的浮躁和淺薄就像「夏日之日」，常使人厭惡、迴避。於是在深心之中，總不免暗暗地嚮往著一個境界――「冬日之日」。那是光明的，卻毫不刺眼。是暖熱的，卻不致灼人。什麼時候我才能那樣含蘊，那樣溫柔敦厚而又那樣深沉呢？「如果你要我成為光，求你讓我成為這樣的光。」我不禁用全心靈禱求：「不是獨步中天，造成氣焰和光芒。而是透過灰冷的天空，用一腔熱忱去溫炙一切僵坐在陰溼中的人。」\n\
    \  漸近日午，光線更明朗了，一切景物的色調開始變得濃重。記得嘗讀過段成式的作品，獨愛其中一句：「坐對當窗木，看移三面陰。」想不到我也有緣領略這種靜趣。其實我所欣賞的，前人已經欣賞了。我所感受的，前人也已經感受了。但是，為什麼這些經歷依舊是這麼深，這麼新鮮呢？\n\
    （節選自張曉風畫晴）"
  answer:
  - C
