  stem: '打開冰箱要拿冰塊時，製冰盒內的冰塊竟然長出了冰柱！

    創立Youtube 科普頻道《真理元素》的穆勒解釋：這是一種自然現象。水在結冰時，先由接觸到空氣的表面開始凍結，再來是水體邊緣。當周圍的水都結冰膨脹時，中央未結冰的水受到壓力，便會尋求洩壓管道，突破表現並隨著裂縫湧出。湧出來的水邊緣繼續結冰，形成尖柱狀，最後便會產生冰柱。不過要讓冰塊長出冰柱，水質必頇純淨，最好是蒸餾水，溫度則是攝氏負５度至負８度之間，且空氣流通要良好，才有可能產生冰柱。

    根據這篇報導，下列敘述何者正確？'
  options:
  - label: A
