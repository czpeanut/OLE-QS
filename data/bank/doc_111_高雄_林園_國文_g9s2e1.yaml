  - label: C
    content: 穆勒因為冰塊上產生冰柱，發現了水結成冰後體積會膨脹的原理
  - label: D
    content: 將蒸餾水裝入製冰盒，置於攝氏６度且空氣流通的冰箱可製造冰柱
  answer:
