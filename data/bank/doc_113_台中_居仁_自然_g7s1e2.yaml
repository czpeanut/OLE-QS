  group_stem: '脊椎動物的心臟構造

    在動物界中，相同或相近特徵的動物可被歸為同一種類，如相近習性、形態、身體內部構造、胚胎發育的特點和生活棲息地。因此，動物可首先分類成脊椎動物和無脊椎動物，再細分成不同類別，其中脊椎動物主要分為五大類：魚類、兩生類、爬蟲類、鳥類與哺乳類。

    脊椎動物循環系統的演化，主要在於心臟構造的改變。魚類的心臟主要由一個心房、一個心室所構成，在一次完整的血液循環路徑中，血液只會經過心臟一次，此種循環模式稱為「單循環系統」，由於單循環系統提供的血壓較低，流速較慢，魚類須靠游泳擺動身體，藉由肌肉收縮協助血液的流動，且其心室收縮力不足，血流速度慢，運送氧氣的效率不佳。而其他四種脊椎動物的循環模式為「雙循環系統」，此模式在一次完整的血液循環路徑中，血液會通過心臟兩次，如人體一次完整的血液循環中包含了體循環與肺循環。但此四種脊椎動物的心臟構造仍有不同，兩生類的心臟為兩心房一心室，心室只有一個，雖在心室中央有肌肉凸起稍微分隔分別來自左、右心房的充氧血與缺氧血，但仍會有部分混合，因此在氧氣的運輸效率上不如二心房二心室的動物。部分爬蟲類仍如兩生類一般，具有兩心房一心室，但其心室中央已具有不完整的分隔，因此充氧血與缺氧血混合的程度更低。鳥類、哺乳類以及少數爬蟲類如鱷魚則皆有完整分隔的兩心房兩心室，完全區分充氧血與缺氧血。'
