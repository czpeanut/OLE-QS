  number: 13
  type: single
  page: 1
  stem: 小波的家附近正在進行移植樹木的工程，他發現工人在移植前會將樹木的大部分枝葉剪除，讓樹看起來光禿禿的。小波很好奇，移植樹木前需要剪掉這麼多枝葉的目的是什麼？
