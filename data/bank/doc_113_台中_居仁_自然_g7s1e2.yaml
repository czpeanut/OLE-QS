- id: doc_113_台中_居仁_自然_g7s1e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: '右圖為人類血液組織抹片，同學討論內容如下：

    小志：甲含有血紅素，主要功能為攜帶氧氣；軒軒：丙的數量最多，成熟的丙細胞沒有細胞核；

