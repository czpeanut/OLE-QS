- id: doc_113_台中_居仁_自然_g7s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 已知蜂蜜中含有分解澱粉的酵素，現有甲、乙兩試管皆裝有等量且濃度相同的澱粉液，隨機在其中一支加入蜂蜜，另一支加入等量的水。將兩支試管充分搖勻，靜置於適宜的溫度，待足夠的反應時間後，以碘液檢測。結果顯示甲呈現藍黑色，乙呈現黃褐色。根據此結果，推測哪一支試管加入了蜂蜜及其理由，下列何者最合理？
  options:
  - label: A
    content: 甲，因有檢測出澱粉
  - label: B
    content: 乙，因有檢測出澱粉
  - label: C
    content: 甲，因未檢測出澱粉
  - label: D
    content: 乙，因未檢測出澱粉
