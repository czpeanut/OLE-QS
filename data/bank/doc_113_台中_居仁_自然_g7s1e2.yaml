  section: 1
  number: 15
  type: single
  page: 2
  stem: 小明在森林裡觀察到一些老樹的樹幹內部竟然是中空的，但這些樹木仍然生長良好，枝葉茂盛並未枯萎。這讓小明感到疑惑，樹幹中空後樹木依然能夠存活的原因為何？
  options:
  - label: A
    content: 樹皮能幫助植物運輸水分與養分，維持樹木的生命
  - label: B
    content: 木質部能夠自行增生，即使內部中空仍可運輸水分
  - label: C
    content: 中空的部分為韌皮部細胞，因此不影響水分的運輸
  - label: D
    content: 樹幹中間的細胞已無運輸功能，不會影響植物生存
