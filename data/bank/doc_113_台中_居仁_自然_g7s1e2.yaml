  stem: 農夫在菜園灑了一些肥料，希望幫助作物長得更好。當肥料融入土壤後，植物的根部便會吸收其中的養分，而這些養分需要通過特殊的運輸系統被送往植物體的各個部位，供應生長所需。請問，植物根部吸收的養分大多是透過哪種管道運輸到全株？其運輸方向為何？
