- id: doc_113_台中_居仁_自然_g7s1e2_s3_48
  section: 3
  number: 48
  type: single
  page: 5
  stem: 森林碳匯主要依賴植物的光合作用來吸收二氧化碳並將其轉化為什麼物質儲存於樹木中？
  options:
  - label: A
    content: 水分
  - label: B
    content: 葡萄糖
  - label: C
    content: 氮氣
  - label: D
    content: 氧氣
  group_stem: '碳匯與碳權

    在面對氣候變遷的挑戰中，台灣國發會提出「2050 淨零排放路徑」，其中自然碳匯為關鍵策略之一。企業除了使用再生能源等方式減少碳排外，其他無法削減的碳排可透過碳匯達到碳中和，而此過程涉及「碳權」，即碳排放權，排碳需求高的組織須購買此權利以增加許可排放量。而碳匯（carbon
    sink）可想像成是儲存二氧化碳的天然或人工的「倉庫」，像森林、海洋、土壤都能吸收並儲存二氧化碳，使我們的碳足跡達到平衡。

    碳匯：大自然的二氧化碳儲存倉庫

    目前碳匯主要分為以下三種類型：首先是「森林碳匯」，也稱「綠碳」。植物透過光合作用將空氣中的二氧化碳轉換並儲存於植物體內，一棵樹一生可吸收約900 公斤的二氧化碳，因此森林成為地表上最有效的天然二氧化碳倉庫。森林碳匯的測量技術較為成熟，因此森林碳權逐漸受到企業和研究機構的重視。其次是「海洋碳匯」，也稱「藍碳」。紅樹林、濕地、沼澤等海洋生態系統都能儲存大量二氧化碳，例如：每公頃紅樹林可儲存約1023
    噸的碳，超過許多森林的單位碳儲量。不過大部分紅樹林屬於國家所有，碳權如何私有化還有待規劃，海洋的流動性及領海歸屬問題讓碳權認定也面臨挑戰，因此，藍碳的開發與變現速度較慢。最後是「土壤碳匯」，也稱「黃碳」。土壤碳匯包括森林碳匯的樹木和海洋碳匯的濕地，還涵蓋農田、草原等土地，土壤碳匯與農業各種活動相關，然而目前研究仍不足，黃碳的碳權開發較為困難。

    生活中如何幫助自然碳匯形成和維護？

    我們可以減少紙張、木材的浪費來保護森林資源，參與植樹活動，或是種植本地植物來增加森林碳匯。此外，避免濕地、海岸的過度開發也能幫助海洋碳匯。透過這些日常行動，每個人都可以為保護碳匯和減緩氣候變遷出一份力。'
