  group_stem: 'There are many different kinds of energy. However, as we all know,
    the world is short of energy now, so saving energy is very important to us. We
    can do a lot of things to save energy and help protect the Earth.

    As a student, we can start from our home and school. For example, we can turn
    off the lights when we leave the room for more than three minutes. Also, when
    some appliances, like TVs, computers, or other things, are not in use, we can
    (35) . We should take a shower instead of taking a bath to save (36) water. When
    we wash our hands or brush our teeth, don''t keep the tap running.

    What''s more, we can invite our friends and family to save energy with us. We
    can drive less and walk or ride a bike to school or work. Taking a bus or the
    MRT is also a good way. In our lives, we can recycle things as (37) as possible.
    In this way, we can use less energy. These are very easy things for us to do in
    our lives. Let''s save energy together and make the Earth better!


