  stem: What is the most important part of “Under the Sea” plan?
  options:
  - label: A
    content: It tells people not to buy any drinks.
  - label: B
    content: People can see a lot of trash under the sea.
  - label: C
    content: People can make their own T-shirts with recycled plastic bottles.
  - label: D
    content: The plan helps people save the ocean.
  group_stem: 'Today is World Ocean Day! If you love the ocean, please give us a “Like”
    and watch the videos below. Our team spent a lot of time studying the sea, taking
    pictures, and filming. We have worked on “Under the Sea” project, for more than
    five years. From our videos, you will find out how beautiful the sea is. At the
    same time, you would also feel surprised to see how terrible the sea becomes.

    Do you know why we can see the “trash sea”? That is because people use a lot of
    plastic products. For example, they like to buy drinks in tea shops or in convenience
    stores. If you buy one bottle of milk tea, you will get a plastic bottle and a
    straw. As time goes by, these plastic products will go under the sea without breaking
    down. Then more and more “NO-BREAKING-DOWN” trash goes under the sea. Ocean lovers
    will see the “trash sea” while swimming to the depth of the ocean.

    Our “Under the Sea” plan is about stopping using the plastic products. And the
    most important part of this plan is that we make T-shirts by using these recycled
    plastic products. Now, follow up this project. You can bring your own water bottle
    and make your own special T-shirt with “NO Plastic Products” on it.


