  group_stem: '(三)

    In a marketing study, shoppers are crazy about shopping when it comes to zero.
    Everybody calls it “zero price effect.” For example, when the shop owner gives
    buyers two choices: to buy a Hershey’s Kisses, a cheap treat, for 1 cent or to
    buy a Lindt Truffle, an expensive treat, for 15 cents. Almost 3 out of four buyers
    choose the Lindt Truffle. However, if both items goes down by 1 cent—the Lindt
    Truffle’s is 14 cents and the Hershey’s Kisses is free, 90% of buyers choose the
    free Hershey’s, even if the price difference between the items is the same.


    This study shows that people like a free item more than the value of the item
    itself. That’s why Buy-One-Get-One-Free(BOGOF) works best. The idea of getting
    something for free has buyers shop crazily. What’s more, BOGOF deals usually last
    only for a short time, so people do a lot of shopping in a hurry because they
    are worried that the price will go up soon. Below is the percentage(%) for each
    of the popular BOGOF deals in the market.

     marketing行銷 effect效果'
