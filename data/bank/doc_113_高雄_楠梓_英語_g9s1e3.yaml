  group_stem: '(六)

    What is a non-fungible token?

    A fungible thing is something that has a fixed price on it. No matter who owns
    it, the price will never change. Because a non-fungible thing is hard to be seen,
    it becomes one of a kind. Non-fungible token(NFT) is a code that points to where
    the artwork lives—often online.

    How is NFT made and sold?

    Because digital photos, pictures or videos online can be easily copied, having
    an NFT is just like having one-of-a-kind artwork signed by painters themselves.
    With an NFT, it tells that you are the real owner of the digital work.

    Cases of NFT

    Tweet’s boss, Jack Dorsey, sold his very first tweet posted on March 21, 2006,
    as a non-fungible token to help people in need. When the buyer was asked why he
    paid US$2.5 million for a tweet, he said owning something with NFT can make the
    buyer and the seller closer.


    A video in which Lebron James jumps high and puts the ball through the basket
    from the website NBA Top Shot was sold to Jesse Schwarz at the price of US$208
    thousand. Another buyer, Michael Levy, also spent US$175,000 on digital NBA cards
    which have made him US$20 million.

