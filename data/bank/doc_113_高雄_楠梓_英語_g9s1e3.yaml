  group_stem: '(五)

    Taiwan’s baseball team(Team Taiwan) won an important game on November 24, 2024.
    They beat Japan 4-0 in the WBSC Premier12 Championship held in Tokyo. This is
    Taiwan’s first big win in world baseball. It also ended Japan’s 27-game winning
    run.

    In the fifth inning, Lin Chia-cheng(林家正) hit a home run, and team captain Chen
    Chieh-hsien(陳傑憲) hit a three-run homer. Taiwan’s pitchers, including 21-year-old
    Lin Yu-min(林昱珉), played very well. Japan has one of the most dangerous lineups
    in the world. Team Taiwan kept those guys off balance the whole game.

    Japanese hitters are known for being super aggressive, especially against fastballs.
    But the Taiwanese pitchers kept mixing in these off-speed pitches. And it really
    disrupted their timing. Japan could not score any points. Taiwan had eleven hits
    in the game while Japan had only four.

    Shohei Ohtani(大谷翔平), a famous Japanese baseball player, congratulated Taiwan.
    He shared a message online saying, "Congratulations! Global Champions," with a
    picture of Team Taiwan. People from Cuba and the Czech Republic also show their
    congratulations to Taiwan.

    This win is Taiwan’s best since 1992, when they won a silver medal. Chen Chieh-hsien,
    Taiwan’s captain, was very happy and cried after the game. He said, “We really
    did it.” He was also named the MVP of the game.

    Baseball fans hope this win will help the sport grow in Taiwan. Seeing their heroes
    hold that trophy, it’s the kind of moment that can inspire young people. They
    see the hope. Team Taiwan didn’t just win a game. They united a nation, brought
    everyone together and fulfilled something truly remarkable. They showed that anything
    is possible if you set your mind to it.


