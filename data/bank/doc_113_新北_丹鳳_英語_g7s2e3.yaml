  group_stem: 'Say No to Plastic Straws! Help Save Our Earth!


    Plastic straws are small, but they are BIG problems for our earth. Let’s work
    together and make our earth plastic straw-free.


    Why Are Plastic Straws Terrible?

    1⃣ Bad to Sea Animals: Turtles, fish, and other animals eat plastic straws by
    mistake. This can make them very sick or even kill them.

    2⃣ So Much Trash: People use plastic straws only once and then throw them away
    every day.


    What Can We Do?

    ✔ Don’t Use a Straw: Drink right from the cup!

    ✔ Bring Your Own Straw: Use a reusable straw.

    ✔ Say No to Plastic: Tell friends and family to stop using plastic straws.


