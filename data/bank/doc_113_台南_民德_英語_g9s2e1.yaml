  section: 4
  number: 10
  type: single
  page: 4
  stem: When did the writer find the baby bird?
  options:
  - label: A
    content: At night.
  - label: B
    content: On a winter evening.
  - label: C
    content: One Sunday morning.
  - label: D
    content: On a weekend afternoon.
  group_stem: 'It was a warm spring afternoon. My mother and I were taking a walk
    in the park near our house.

    We came to this park every Sunday. There were many trees in the park. We enjoyed
    sitting under the trees and listening to birds singing. Suddenly, I heard some
    strange noises. It sounded like something fell on the ground. I looked around
    and saw a baby bird lying on the grass. I wondered how it got there. The bird
    was too small to fly yet.

    “Oh, mom, this baby bird needs help. Can I take it home and take care of it?”
    I asked. “Well, it is very kind of you that you want to help. But let’s see where
    the little bird’s parents are,” said my mom. A few minutes later, we saw two birds
    flying nearby.

    “They must be the baby bird’s mom and dad,” I told my mom. “What should we do?”

    “Let’s pick it up, so cats or dogs won’t hurt it,” said my mom.

    “Then, where should we put it? We don’t know where the nest is.” I asked.

    “Don’t worry. Let’s just put it on the tree branch. The baby bird’s parents will
    bring it food,” my mom said.

    A few minutes later, we saw two big birds coming to the baby bird with food in
    their mouths. My mom and I felt relieved.

     nest 鳥巢 branch 樹枝 relieved 放心的'
