    content: How badminton started.
  - label: D
    content: The shuttlecock used in the game.
  group_stem: 'A long time ago in England, there was a large house called Badminton
    House. The house was owned by the Duke of Beaufort. One summer, he had a party
    and invited his friends to Badminton House.

    The guests had fun, but soon they became bored. “What can we do for fun?” someone
    asked. The Duke smiled and said, “I know a game from India! Let’s try it!” He
    showed them strange rackets and a bird-shaped object called a “shuttlecock”.

    Everyone was curious. The Duke said, “You hit the shuttlecock over a net with
    these rackets.” The guests started playing, laughing, and running to keep the
    shuttlecock in the air. The garden was full of excitement!

    After the party, the guests kept talking about the game they played. They loved
    it so much that they began playing it everywhere. But there was one problem: The
    game didn’t have a name yet. Because it became popular at Badminton House, people
    decided to call it “Badminton.”

    Today, many people enjoy playing badminton, from kids in parks to players in the
    Olympics.


     duke 公爵 racket 球拍 object 物體 curious 好奇的 excitement 興奮'
