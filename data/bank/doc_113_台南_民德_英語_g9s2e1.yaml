  group_stem: 'Lucy: Hey, Mark. You’re worried about something, right?

    Mark: You really read my mind.

    Lucy: Tell me!

    Mark: I sent messages to my new classmate, Lisa, on LINE. She read them, but she
    seldom replied, or sometimes only with stickers. I hope she can chat with me.

    Lucy: I don’t know what she really thinks, either. Maybe she was busy then. Or
    maybe she didn’t want to chat with you. Isn’t it better to ask her out and have
    a talk? You can’t know everything through technology.

    Mark: You’re right. And what are you looking for? You look anxious.

    Lucy: I’m looking for my power bank. My cellphone is running out of power. I need
    to check my Facebook page to know what my friends are doing now. Oh, no! I left
    it in my room.

    Mark: Technology also makes you blind.

     reply 回覆 sticker 貼圖 technology 科技anxious 焦慮的 power bank 行動電源'
