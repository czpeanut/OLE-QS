  group_stem: '從小我們就聽過長輩告誡說：「螃蟹和柿子不能一起吃，因為會中毒。」這種說法經過代代相傳後，似乎已經被大眾普遍接受了。然而事實真是如此嗎？

    根據衛福部食藥署指出，這其實是因為柿子裡含有單寧酸，這種成分和蛋白質容易凝結，而螃蟹中則含有蛋白質，兩者反應之下會讓人不好消化，造成腸胃不適，甚至引發腸絞痛的症狀，但並非中毒情形。不過還是建議大家分開食用，以減輕腸胃負擔。

    另外，除了柿子以外，茶、葡萄、番石榴、山楂等也富含單寧酸，因此不僅是螃蟹，只要是富含蛋白質的食物，如：海鮮、雞蛋、乳製品及豆製品等，若同時與富含單寧酸的食物一起食用，都可能導致腸胃不適。(出自新聞報導)'
