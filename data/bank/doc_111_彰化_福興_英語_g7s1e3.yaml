  stem: What were Ken and his family planning?
  options:
  - label: A
    content: to buy a horse
  - label: B
    content: to go on a trip
  - label: C
    content: to watch a play
  - label: D
    content: to move to a big city
  group_stem: 'The family vacation


    Ken was going on a trip with his family. But where should they go? They could
    go to a big city or a ranch. His parents were letting him choose where to go.
    He thought about what he could do in each place.

    In the city he could see a play. But at a ranch he could see the hills. In the
    city he could ride on the subway. But at a ranch he could ride on a horse. In
    the city he could sleep in a hotel. But at a ranch he could sleep under a blanket
    made of stars.

    Where should Ken and his family go on their trip? Where would you go?'
