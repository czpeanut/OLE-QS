  page: 2
  stem: What is the main idea of the reading?
  options:
  - label: A
    content: Swimming is dangerous and don't go there.
  - label: B
    content: Follow the swimming safety tips and you can have fun swimming.
  - label: C
    content: You can go to any beach on a hot day.
  - label: D
    content: It is fun to jump in the cold water.
  group_stem: 'Water safety


    It is fun to swim at the beach on a hot day. But remember that safety always comes
    first. In 2020, 383 people lost their lives because of drowning. Drowning happens
    mainly because swimmers are not careful while swimming at the beach or in other
    water areas.

    The following are some water safety tips for swimming at the beach. First, don''t
    go swimming alone. You can go with your family or friends. You need someone to
    save you when you are in danger. Second, it is safe to swim in the area where
    there are some other swimmers or a lifeguard. Third, don''t jump in the water
    but go into it slowly. Make sure that the water is not too cold. Fourth, don''t
    swim in a dangerous swimming area. Keeping away from that area is the best way
    to be safe.

    Follow these tips, you can have fun swimming at the beach.


    remember 記得 safety 安全 drowning 溺水 happen 發生

    tip 要訣 save 拯救 dangerous 危險的 area 地區

    lifeguard 救生員 slowly 慢慢地 best 最好的'
