- id: doc_112_高雄_林園_社會_公民_g9s1e3_s1_50
  section: 1
  number: 50
  type: single
  page: 2
  stem: '閱讀短文回答問題：

    勞動基準法第1 條規定：「為規定勞動條件最低標準，保障勞工權益，加強勞雇關係，促進社會與經濟發展，特制定本法。」因此，政府訂定「基本工資」，其目的是讓勞動者至少可獲取一定的薪資，以保障勞工及其家庭的最低生活水準。針對基本工資上漲，勞工與廠商反應不一，以下是某電臺整理的採訪結果：

    勞工團體代表：近來物價上漲，應調漲基本工資，才能維持勞工生活品質，讓勞動力充分發揮。

    傳統產業老闆代表：各項材料成本上漲，但產品售價無法完全反應，因此獲利下降；若加上人事成本增加，會讓中小企業不堪負荷，甚至造成企業裁員。

    請問：根據勞工團體代表和傳統產業代表面的說法，基本工資上漲，對「勞」、「資」雙方各會產生什麼影響？'
  options:
  - label: A
    content: 增加勞工的工作意願、降低聘雇勞工的意願
  - label: B
    content: 增加勞工的工作意願、增加聘雇勞工的意願
  - label: C
    content: 降低勞工的工作意願、降低聘雇勞工的意願
  - label: D
    content: 降低勞工的工作意願、增加聘雇勞工的意願
  answer:
  - A
  answer_source: answer_key_vlm
  tags:
    chapter:
      publisher: 翰林
