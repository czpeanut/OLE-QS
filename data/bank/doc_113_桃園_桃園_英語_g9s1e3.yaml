- id: doc_113_桃園_桃園_英語_g9s1e3_s2_51
  section: 2
  number: 51
  type: single
  page: 5
  stem: What can AI do to help fight online fraud?
  options:
  - label: A
    content: Send messages.
  - label: B
    content: Make fake websites.
  - label: C
    content: Look for fun apps.
  - label: D
    content: Clear false information.
  group_stem: 'Online fraud happens when people trick others on the Internet to steal
    money or personal information. It can appear in many forms, like fake websites
    or messages that look real but they are actually not. This is a big problem all
    over the world, and many countries, including Taiwan, are working hard to stop
    it.

    We can stop online fraud with modern technology, such as artificial intelligence
    (AI). AI can find fake information faster than people. It helps detect and remove
    fake websites or messages quickly.

    In Taiwan, the Ministry of Digital Affairs (MODA) is working on two important
    projects to fight online fraud. The first project is about a website and mobile
    app that people can use to report online scams. This app will make it easier for
    people to report fraud, and AI will help check the information and send it to
    the relevant government offices. If the website finds fraud, it will send alerts
    to websites like Google, Facebook, and Instagram to remove the fake content. The
    app will be in Chinese for now, but the ministry plans to add more languages in
    the future.

    The second project is about helping AI companies in Taiwan. The Ministry is investing
    10 billion NT dollars to support AI start-ups. This money will help develop better
    technology to fight fraud. The Ministry believes these two projects—stopping fraud
    and growing AI—are very important for the future of Taiwan.

     fraud 詐騙 include 包括 detect 察覺 remove 去除 Ministry of Digital Affairs 數位發展部 project
