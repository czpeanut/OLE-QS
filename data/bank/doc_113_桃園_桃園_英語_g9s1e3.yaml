  section: 2
  number: 53
  type: single
  page: 5
  stem: Who returned the book to the library?
  options:
  - label: A
    content: Charles Dickens’ family.
  - label: B
    content: Pip’s brother-in-law.
  - label: C
    content: Arthur’s grandson.
  - label: D
    content: Arthur Lamb himself.
  group_stem: 'Toowoomba Grammar School is the biggest school in Toowoomba, Australia.
    In 1903, a student called Arthur Lamb borrowed a book, Great Expectations, from
    the school library.

    This book was written by Charles Dickens in 1861. It tells the story of a poor
    orphan, Pip. He grows up with his sister and her husband, Joe. Later, a rich man
