  stem: 石虎是我們的龍貓一文中，為什麽作者可以由「幾隻石虎的存在」，得知「還擁有一塊上百公頃以上蓊鬱完整的山林」?
  options:
  - label: A
    content: 石虎相當凶猛，棲地山林難以開墾，石虎的存在證明山林的完整性
  - label: B
    content: 石虎是食物鍵最高層，石虎會守護森林，一如龍貓守護森林
  - label: C
    content: 石虎需要廣闊生活空間，石虎的存在可以得知山林的生態完整性
  - label: D
    content: 相關單位會為了保護石虎，事先規畫保護區，讓石虎能獲得保護
  group_stem: "◎閱讀甲、乙兩文，並回答下列問題。\n甲、\n    多年來，低海拔山區是臺灣開發破壞最嚴重的森林。不僅如此，我們對這一環境的動植物生態欠缺完整認識，很少以此作為生態保育題材，因此學童在成長過程中，對自然環境保護的重要，難以產生深層的認同。四、五年級一輩對這一區域鄉野的緬懷，更難以影響下一代，建立共同的信念和價值。\n\
    \    很高興石虎的出現，讓我們有了一個新契機，認真地看待淺山美學，嚴肅地反省郊野跟城鎮的關係。\n    石虎的行跡隱密，更引發我們的好奇。石虎以前常見，意味著過去的環境很適合牠們。現在不易記錄，緣自於環境的大面積開發，才造成牠們的大量消失。當公路上偶有一、二隻被車輛意外輾斃，那不是告訴我們還有石虎，而是流露一個警訊，我們侵犯了牠們的生存權。反過來說，幾隻石虎的存在正巧告知，我們何其幸運，那兒還擁有一塊上百公頃以上蓊鬱完整的山林。\n\
    \    發現石虎的蹤跡，真的是一種庇佑。那意味著，自然跟我們仍處於和諧的狀態。沒有石虎，山林彷彿被掏空心臟，靜寂地存在。同樣地，麝香貓和白鼻心亦然，牠們都是龍貓的家族成員，是近郊山區，可以跟我們對話的哺乳類動物。\n\
    （改寫自劉克襄〈石虎是我們的龍貓〉）\n乙、雲豹小檔案\n\n| 學名 | Neofelis nebulosa |\n| --- | --- |\n| 保育等級\
    \ | 易危 (VU, Vulnerable) |\n| 分類 | 脊索動物門＞哺乳綱＞食肉目＞貓科 |\n| 分布 | 臺灣、中國大陸南方至南亞、東南亞、海南島\
    \ |\n| 棲息 | 海拔1,000 公尺以上的原始林，自70 年代中期再無發現紀錄 |\n| 特徵 | • 顎銳利，犬齒發達<br>• 頸側及體側有大型塊雲狀黑斑<br>•\
    \ 腹部及四肢間雜有不規則褐色斑紋<br>• 尾部有11-14 個黑色環帶 |\n| 食性 | • 肉食，以鳥類、靈長類、小型哺乳動物為主 |\n| 習性\
    \ | • 夜行性，喜歡單獨活動，擅於攀樹，短肢與長尾幫助牠適應在樹上生活<br>• 為臺灣特有亞種，是臺灣大型肉食性貓科動物 |\n（節錄自台北市立動物園網站）"
  shared_asset: g7_5_7
