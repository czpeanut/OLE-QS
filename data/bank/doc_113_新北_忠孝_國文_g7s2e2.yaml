- id: doc_113_新北_忠孝_國文_g7s2e2_s5_1
  section: 5
  number: 1
  type: matching
  page: 1
  stem: （1）
  group_stem: "A. 王維\nB. 王之渙\nC. 詩仙\nD. 自由詩\nE. 孟浩然\nF. 詩史\nG. 今體詩\nH. 韓愈\n  詩是一種與「文」相對的文體。指以精粹而富節奏的語言文字來表現美感、抒發情緒的藝術性作品。《書經．舜典》：「詩言志，歌永言。」可知，從古至今，詩便佔有一定的地位，如唐代李白〈望廬山瀑布〉即是當代有名的\
    \ （1） 作品。胡適提倡的白話文運動，開創新興詩歌體裁，即是 （2） 。\n  唐代是近體詩盛行時期，此時期產出了許多馳名中外的詩人，如 （3） 杜甫、\
    \ （4） 李白。詩的主題也逐漸多元化，如以自然山水聞名的詩人 （5） 、 （6） ，又或是以邊塞風光聞名的詩人 （7） 。隨著時代的變遷，再加上安史之亂的禍害，遂使唐代走入衰敗。"
