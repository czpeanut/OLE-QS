  type: single
  page: 2
  stem: 寶可夢學院中的神獸們正在為了誰才是老大一較高下，他們決定比拚彼此的知識水準，於是他們抽了一題，題目為「唐代是近體詩的全盛時期，也因此發展出許多不同的詩派，請說明此四首詩分別為何詩派？為什麼？」下列四位同學各選一首詩進行分析，何者分析正確？
  options:
  - label: A
    content: 密勒頓：「烽火連三月，家書抵萬金」由「烽火」、「家書」、「萬金」可知，此詩乃是以描寫塞外風光與戰爭場面的邊塞派
  - label: B
    content: 固拉多：「獨坐幽篁裡，彈琴復長嘯」由「獨」、「幽篁」、「彈琴」可知，此詩可知為閒適淡遠之作，故此詩可能為山水田園派
  - label: C
    content: 洛奇亞：「秦時明月漢時關，萬里長征人未還」由「關」、「萬里」、「長征」可知，此詩應是描述戰爭帶來民生疾苦之社會寫實派
  - label: D
    content: 蓋歐卡：「日照香爐生紫煙，遙看瀑布掛前川」由「香爐」、「瀑布」、「川」可知，此詩應是以山水自然為主的山水田園派
