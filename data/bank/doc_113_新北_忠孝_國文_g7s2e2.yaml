- id: doc_113_新北_忠孝_國文_g7s2e2_s6_1
  section: 6
  number: 1
  type: single
  page: 1
  stem: 如果謝天這篇文章改編成短片，哪種情境最符合文章的核心精神？
  options:
  - label: A
    content: 一位科學家發明機器人，造成人類與機器人的戰爭
  - label: B
    content: 一群孩子在森林裡摘花，卻沒發現自己正在破壞生態
  - label: C
    content: 一名學生發現農夫的辛勞後，開始珍惜每一粒米飯
  - label: D
    content: 一位畫家畫了一幅風景畫，並向大家炫耀自己的才華
  lesson_raw:
    number: 第9課
    title: 謝天
    basis: 題目指名〈謝天〉文章核心精神
- id: doc_113_新北_忠孝_國文_g7s2e2_s6_2
  section: 6
  number: 2
  type: single
  page: 1
  stem: 謝天一文，作者在文中提到童年時不相信「老天爺」的存在，也不理解為何要謝天。根據下列同學所述，哪一項最能反映當時作者的心態轉變？
  options:
  - label: A
    content: 旭旭：從反對祖母的信仰到完全接受並模仿
  - label: B
    content: 喬喬：從謝天是迷信，到意識到背後的感恩精神
  - label: C
    content: 芳芳：從尊敬祖父母到懷疑他們的價值觀
  - label: D
    content: 吉吉：從接受傳統習俗到轉向科學理性
  lesson_raw:
    number: 第9課
    title: 謝天
    basis: 題目指名〈謝天〉作者心態轉變
- id: doc_113_新北_忠孝_國文_g7s2e2_s6_3
  section: 6
  number: 3
  type: single
  page: 1
  stem: 下列同學各自說明了關於謝天這篇文章的敘述，何者最符合文章主旨與情感脈絡？
  options:
  - label: A
