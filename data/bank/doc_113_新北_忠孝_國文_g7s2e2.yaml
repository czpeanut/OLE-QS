  section: 7
  number: 3
  type: single
  page: 3
  stem: 根據本文，關於人類對地球資源的消耗，下列敘述何者最恰當？
  options:
  - label: A
    content: 1990 年之前，人類並未透支地球資源
  - label: B
    content: 2022 年人類所耗用的地球資源是前一年的1.75 倍
  - label: C
    content: 美國的生活方式對比其他國家是更令地球超載的負擔
  - label: D
    content: 每年的地球超載日之後，全球資源就會消耗殆盡
  group_stem: "◎閱讀下文，並回答下列問題。\n    1990 年代初研究人員設計出一套評估方法，是為了計算出當年度的「地球超載日」。今年（2022\
    \ 年）的「地球超載日」在7 月28 日，代表在這一天，我們已經耗盡當年度地球的永續資源，在剩餘的時間裡，都將以透支的方式消耗地球資源。據此，養活全世界的人口要1.75\
    \ 個地球的資源才夠。每個國家帶給地球的負擔也大不同，如果每個人的生活方式都跟美國人一樣，那2022 年地球超載日會落在3 月13 日。根據這套方法往回推算1971\
    \ 年，地球超載日是12月25 日，之後就一路提前。2000 年地球超載日落在9 月，2018 年起提前到7 月。2020 年因Covid-19 疫情爆發，地球超載日曾往後延了三週，但隔年就恢復到疫情前的情況。非政府組織世界自然基金會與全球生態足跡網將矛頭指向食品生產系統及其龐大的生態足跡：整體來說，地球上超過一半的生物承載力是用來養活人類。很大一部分的糧食和原物料是用於畜牧，人們再吃掉這些動物。富裕國家應減少肉品消費，如果可以將肉品消費量減半，地球超載日就可以延後17\
    \ 天。由於全世界1/3 的食物被浪費掉，所以限制食物浪費可將超載日延後13 天。\n——改寫自「地球超載日」網站"
