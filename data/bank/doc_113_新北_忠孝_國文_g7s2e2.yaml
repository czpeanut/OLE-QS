  stem: 老師請同學們根據近體詩之格律規範舉例，請判斷下列哪一位同學的答案為近體詩？
  options:
  - label: A
    content: 凱凱：結廬在人境，而無車馬喧。問君何能爾？心遠地自偏。採菊東籬下，悠然見南山。山氣日夕佳，飛鳥相與還。此中有真意，欲辯已忘言。
  - label: B
    content: 睿睿：涉江採芙蓉，蘭澤多芳草。采之欲遺誰，所思在遠道。還顧望舊鄉，長路漫浩浩。同心而離居，憂傷以終老。
  - label: C
    content: 丹丹：八月湖水平，涵虛混太清。氣蒸雲夢澤，波撼岳陽城。欲濟無舟楫，端居恥聖明。坐觀垂釣者，徒有羨魚情。
  - label: D
    content: 玄玄：江南可採蓮，蓮葉何田田。魚戲蓮葉間。魚戲蓮葉東，魚戲蓮葉西，魚戲蓮葉南，魚戲蓮葉北。
