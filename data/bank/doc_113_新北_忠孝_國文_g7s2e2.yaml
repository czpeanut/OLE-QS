  section: 7
  number: 1
  type: single
  page: 3
  stem: 下列關於本詩的說明，何者完全正確？
  options:
  - label: A
    content: 說明「雁」是群居候鳥，呈現雁群的生活樣態團結合群，故不孤獨
  - label: B
    content: 以雁群的飛行意志，強調生命的意義在於完成世代傳承的天賦使命
  - label: C
    content: 詩中以第三人稱敘述，作者如「上帝」般注視，描述「雁群」的飛行，並自由進出「雁」之內心
  - label: D
    content: 詩中較少涉及外在環境的描述，而側重書寫「雁」的合群、團隊精神
  group_stem: '◎閱讀白萩〈雁〉，並回答下列問題。

    我們仍然活著。仍然要飛行

    在無邊際的天空

    地平線長久在遠處退縮地引逗著我們

    活著。不斷地追逐

    感覺它已接近而抬眼還是那麼遠離


    天空還是我們祖先飛過的天空

    廣大虛無如一句不變的叮嚀

    我們還是如祖先的翅膀。鼓在風上

    繼續著一個意志陷入一個不完的魘夢


    在黑色的大地與

    奧藍而沒有底部的天空之間

    前途祇是一條地平線

    逗引著我們

    我們將緩緩地在追逐中死去，死去如

    夕陽不知不覺的冷去。仍然要飛行

    繼續懸空在無際涯的中間孤獨如風中的一葉


    而冷冷的雲翳

    冷冷地注視著我們。

    （白萩〈雁〉）'
