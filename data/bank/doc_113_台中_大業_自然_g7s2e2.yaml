- id: doc_113_台中_大業_自然_g7s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 阿明找到了一種特殊真菌，可以分泌酵素來分解廢水中的有毒物質，但在自然情況下真菌產生酵素的速度很慢，阿明想利用基因轉殖來量產可以淨化水質的酵素，請問應該將哪種物質植入細菌內呢？
  options:
  - label: A
    content: 真菌的細胞核
  - label: B
    content: 真菌分泌的酵素
  - label: C
    content: 真菌分泌酵素的基因
  - label: D
    content: 細菌分泌酵素的基因
  tags:
