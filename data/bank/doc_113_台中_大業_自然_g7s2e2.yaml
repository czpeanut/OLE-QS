  group_stem: '題組三、運動公園中的小珍珠，請根據文章回答第33-36 題


    澤珍珠菜（Lysimachia candida），為一年或二年生草本植物，多為五片花瓣，生長於潮濕的環境，如平地農田或沼澤等，因花苞密集排列，有如珍珠而得名，但在2017
    年澤珍珠菜被列為台灣已滅絕的物種之一，在這之前台灣僅有一筆於1897 年的標本採集紀錄，且並無野外觀察到的紀錄，但在2020 年突然在基隆暖暖運動公園中重新被發現，震撼植物學界，農業部林試所也將其帶回復育，至今已成功使用種子繁殖，復育數量也超過百株，並規劃重新移回公園保育。'
