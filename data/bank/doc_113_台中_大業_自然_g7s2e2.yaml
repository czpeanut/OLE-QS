  section: 1
  number: 11
  type: single
  page: 1
  stem: 諾羅病毒是導致腸胃炎的病原體之一，面對病毒感染，抗生素無法直接消滅病毒，因此需靠多休息、補充水分和電解質，幫助免疫系統清除病毒。下列關於病毒的描述哪一項敘述正確？
  options:
  - label: A
    content: 病毒體內缺乏代謝作用所需的酵素
  - label: B
    content: 用複式顯微鏡可以觀察到其具有蛋白質的外殼
  - label: C
    content: 病毒具有遺傳物質，可在生物體外進行代謝及增殖
  - label: D
    content: 食用抗生素能預防病毒型腸胃炎發生
