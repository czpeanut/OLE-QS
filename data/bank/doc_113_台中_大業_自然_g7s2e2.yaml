- id: doc_113_台中_大業_自然_g7s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 中中、華華是科學史上首次成功複製的靈長類動物，主要是透過體細胞核轉移技術，移除卵內的細胞核後，從流產胎兒猴的體細胞中提取出細胞核植入，並刺激使它發展成胚胎，再移植到代理孕母體內，請問關於複製動物的敘述何者正確?
  options:
  - label: A
    content: 此技術在體外進行，屬於體外受精
  - label: B
    content: 遺傳物質會與代理孕母相同
  - label: C
    content: 胚胎在體外發育，屬於卵生動物
  - label: D
    content: 此過程中無遺傳物質重組的現象
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 生物
      code: 2-4
      title: 生物技術
      chapter: 第2章 遺傳
    textbook: 七下生物 2-4 生物技術
    labeled_by: ai
