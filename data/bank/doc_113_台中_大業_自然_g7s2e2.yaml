  type: single
  page: 1
  stem: 農民將野生大豆(Glycine max)，經過多次的授粉，選擇具有豆莢濃綠、結莢位置較高方便機械採收品種的種子進行栽植，而形成我們現在常吃的毛豆(Glycine
    max)。關於毛豆的敘述，下列何者最合理？
  options:
  - label: A
    content: 是經過基因轉殖所產生的農作物
  - label: B
    content: 大豆與毛豆是不同物種
  - label: C
    content: 其培育過程需要精與卵結合
  - label: D
    content: 是由野生大豆的營養器官培育而來
