  type: single
  page: 1
  stem: 科學家將水筆仔的耐鹽基因轉殖於落地生根中，並透過落地生根能透過葉子繁殖的特性來進行大量的栽培，產出具有與親代遺傳物質完全相同的子代，請問在此過程中沒有發生以下哪件事？
