    | (A) | 分類地位 | 植物界 | 植物界 | 植物界 |

    | (B) | 根莖葉 | 無 | 無 | 無 |

    | (C) | 種子繁殖 | 無 | 無 | 無 |

    | (D) | 舉例 | 藍綠菌 | 海帶 | 石花菜 |'
