- id: doc_113_台中_大業_自然_g7s2e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: '每年夏天，冬蟲夏草寄生在蝙蝠蛾的幼蟲體內，長出菌絲吸收幼蟲的養分，待到冬季，幼蟲體內已充滿菌絲，但外表仍如幼蟲的外型，稱之為「冬蟲」。春天來臨時，蟲的頭部長出棍棒狀的子實體，就像是發芽，此時就是「夏草」，冬蟲夏草因此而得名，而子實體會釋出孢子，繼續感染別隻幼蟲，如此循環完成其生活史。請根據以上的描述判斷冬蟲夏草應被分在哪一界?

    (A)真菌界           (B)植物界           (C)動物界            (D)原生生物界'
  options:
  - label: A
    content: 真菌界
  - label: B
    content: 植物界
  - label: C
    content: 動物界
  - label: D
    content: 原生生物界
