- id: doc_113_台中_大業_自然_g7s2e2_s1_37
  section: 1
  number: 37
  type: single
  page: 4
  stem: 哪一組的蛙類彼此親緣關係最接近?
  options:
  - label: A
    content: 海南琴蛙、長腳赤蛙
  - label: B
    content: 魚池琴蛙、腹斑蛙
  - label: C
    content: 魚池琴蛙、褐樹蛙
  - label: D
    content: 長腳赤蛙、褐樹蛙
  group_stem: '題組四、呱呱呱呱-台灣新發現，請根據文章回答第37-40 題


    過去在南投魚池鄉發現一種蛙類，被認為與分布在日本琉球的「豎琴蛙」(Nidirana okinavana)是同種，在多年前陳世煌老師已觀察到這種外型相似但較小的蛙類，並先取名為「埔里蛙」，牠們的體長約4至5
    公分，鼓膜周圍有黑色菱形斑，背部呈現深色，有一條明顯淺色細長的背中線，經研究人員比對外型、花紋、叫聲及基因序列，證實臺、日族群互有差異，確認為新種，便將臺灣的族群命名為「魚池琴蛙」，學名Nidirana
    shyhhuangi，其中「shyhhuangi」是為紀念陳世煌老師的貢獻命名。

    亞洲目前有多種「琴蛙」，如「海南琴蛙」(Nidirana hainanensis)、「重慶琴蛙」(Nidirana chongqingensis) 等，多依照地名取名，而臺灣也有許多以外型來命名的蛙類，如「長腳赤蛙」(Rana
    longicrus)、「腹斑蛙」(Nidirana adenopleura) 、「褐樹蛙」(Buergeria robusta)，而臺灣的「魚池琴蛙」此名稱則反應其棲地在魚池鄉。'
