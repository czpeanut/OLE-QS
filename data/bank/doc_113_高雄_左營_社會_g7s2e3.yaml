  group_stem: "美國首在安理會批中誤用聯大 2758 號決議 林佳龍致謝  2025/4/24  中央通訊社\n    外交部發布新聞稿指出，美國於\
    \ 23 日在聯合國安理會會議中，嚴詞批評中國為孤立臺灣而誤用聯大第 2758 號決議，並曲解他國政策，意圖限縮各國自由選擇的權利；美國並重申 2758 號決議並未排除臺灣參與聯合國體系，以及其他多邊論壇。\n\
    \    外交部強調，此為美國新政府繼今年 2 月在世界衛生組織（WHO）執行委員會會議公開發言反駁聯大第 2758 號決議遭扭曲後，再度於聯合國場域為臺灣發聲，也是美國首次在聯合國安理會針對該決議明確表達立場，深具意義。\n\
    \    外交部長林佳龍表示，感謝川普政府對臺灣爭取國際參與的堅定支持，並譴責中國持續透過惡意扭曲聯大第 2758 號決議，打壓臺灣的主權地位及國際參與空間，以及重申中華民國（臺灣）是主權獨立國家，與中華人民共和國互不隸屬，這是臺海客觀現狀，也是國際公認的事實。\n\
    註：聯大 2758 號決議是指聯合國大會第 2758 號決議，於 1971 年 10 月 25 日在第 26 屆聯合國大會上表決通過，內容是關於「恢復中華人民共和國在聯合國組織中的合法權利問題」的決議。"
