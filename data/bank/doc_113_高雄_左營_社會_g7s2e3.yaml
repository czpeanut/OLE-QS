    content: 公平正義
  group_stem: "統計數據指出今日社會嚴重不公，平均壽命懸殊，貧富差距驚人。然而太多聲音告訴我們，只要胸懷大志，加上努力不懈，自然會有所成就。美國夢從政治體系滲入人民心中，造成不良影響。很多人確實打心底認同這種看法：許多總統都出身貧寒，許多大企業家都白手起家……媒體樂於大肆報導這類故事。人家都能出人頭地，我們豈能自怨自憐？羅爾斯從不接受這看法。他當然聽過各種功成名就的故事，但從統計數字來看，成功翻身的故事堪稱鳳毛麟角，不值得政治理論家認真看待。事實上，當權者反覆強調翻身故事是一種精明的政治手段，藉此逃避改革社會的重責大任。羅爾斯高聲提醒我們，在現代美國與歐洲多處，如果你生而貧窮，則有很高機率會一路貧窮到底（甚至半路早夭），完全無庸置疑。\n\
    \        社會沒有變得比較公平的一大原因在於，既得利益者無須認真想像自己如果出身不同會怎麼樣，但如果沒有發揮想像，就擺脫不了根深柢固的偏見與歧視。他設計出政治思想史上極厲害的思考實驗，這項實驗稱為「無知之幕」。羅爾斯叫我們想像自己尚未出生，但有一顆清楚的腦袋，只是不知道會出生在何種環境，未來由無知之幕罩住。我們高高懸浮於地球之上，不知道父母會是誰，鄰居會是誰，學校會是怎樣，地方醫院會是怎樣，警察與司法制度會是怎樣，諸如此類……\n\
    \        羅爾斯請所有人思考的問題是：如果我們不知道自己會有何出身，我們想生在怎樣的社會？此時「無知之幕」派上用場：我們別再去想光鮮亮麗的成功人士，而是想到進入美國社會的驚人風險。在無知之幕後頭，一切如同樂透，你也許生在鳳凰城市中心，父母是做牙齒矯正的牙醫；也許生在底特律東邊的貧民區，由非裔單親母親一手帶大。在這國家裡，七〇％的人只有次等的健保，住在糟糕的房子，法律系統不好，教育系統出問題——哪個頭腦清楚的人想賭上一把，參加這場出身樂透？\n\
    \        這個實驗讓我們站在客觀角度，仔細思考一個公平的社會在各方面是什麼模樣。當我們思考資源分配這個重大問題，為了避免失之偏頗，有必要捫心自問：「如果我站在無知之幕後面，我會怎麼看待這個議題？」當我們思索自己在最糟狀況下需要什麼，公平的答案自會浮現。"
