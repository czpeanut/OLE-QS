  stem: 若人類的捲髮為顯性的性狀，且由顯性基因（A）所調控；直髮為隱性的性狀，且由隱性基因（a）所調控。現有一對夫婦兩人皆為捲髮，且生了四個孩子，孩子當中有捲髮也有直髮，關於這個家族髮型的遺傳，下列敘述何者正確？
