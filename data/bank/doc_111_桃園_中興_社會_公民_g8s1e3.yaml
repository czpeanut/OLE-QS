- id: doc_111_桃園_中興_社會_公民_g8s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 下列關於桃園市的層級敘述，何者正確？
  options:
  - label: A
    content: 升格後，所有的區都是地方自治團體
  - label: B
    content: 升格後，與臺中市屬於同一層級的地方自治團體
  - label: C
    content: 原鄉（鎮、市）改為「區」後，區長全由市長派任
  - label: D
    content: 落實民意政治，原「鄉（鎮、市）民代表會」保留。
  group_stem: "題組1:請閱讀以下文章，並回答01~02 問題(習作題)：\n  行政院 2013 年 1 月 3 日通過桃園縣升格直轄市案，正式升格為「桃園市」。民政局請民眾配合於升格後，再將「區」字遮蓋於門牌「鄉、鎮、市」上面，以符合升格現況。立法院在\
    \ 2014 年三讀通過公職人員選舉罷免法修法，增列直轄市山地原住民「區民代表」及「區長」選舉。新增的直轄市山地原住民區代表及區長分別是新北市烏來區、桃園市復興區、臺中市和平區、高雄市那瑪夏區、桃源區、茂林區。為落實保障原住民族政治參與的精神，並積極回應原住民社會意見，享有地方自治權限。（資料來源：改寫自甘嘉雯，桃園將升格，門牌貼紙戶所領取，中國時報，2014/12/22）"
  shared_asset: g1_1_2
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 公民
      code: 5-1
      title: 地方政府的組成
      chapter: 第5章 地方政府
    textbook: 八上公民 5-1 地方政府的組成
    labeled_by: ai
  ai_answers:
    gemini: B
    qwen: B
  answer:
  - B
