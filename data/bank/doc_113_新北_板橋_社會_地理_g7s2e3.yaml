  section: 1
  number: 9
  type: single
  page: 2
  stem: 因應近年興起的鐵道旅遊，台鐵推出了海風號與山嵐號的觀光列車以滿足不同客群，如圖二所示。請問海風號行駛於圖中哪一條鐵路線上？
  options:
  - label: A
    content: 甲⭤ 乙
  - label: B
    content: 乙⭤ 丙
  - label: C
    content: 丙⭤ 丁
  - label: D
    content: 丁⭤ 甲。
  group_stem: '海風號—適合熱愛海景、喜歡輕旅行

    • 行駛於東北角沿海路線，欣賞無邊際太平洋風光

    • 整體氛圍輕盈活潑，座椅配色柔和清新，適合喜歡拍照的人

    • 餐點以輕食與甜點為主，適合想要悠閒小酌、品味甜點的旅客

    • 沿線停靠頭城、礁溪、宜蘭等地，適合喜愛海邊小鎮風情的人


    山嵐號—適合喜愛山林靜謐、深度慢遊

    • 行駛於花東縱谷，沿途被綠意環抱、享受山野寧靜，更加適合親子旅客

    • 車廂內裝較溫暖沉穩，並有共鳴室，如銀河般的星空燈，適合沉浸式旅行的旅人

    • 提供正餐級的精緻套餐，講究在地旬味

    • 停靠的特色小鎮，適合想遠離塵囂、感受台灣鄉鎮人文風情的人'
