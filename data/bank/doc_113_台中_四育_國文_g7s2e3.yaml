  group_stem: "專門記錄臺灣味的臉書粉絲專頁甘苦人食堂發文表示，流水席常見於廟裡，在神明生日等特殊日子，會有「食福」、「食平安」或「食保佑」的餐點，供香客拜拜之後填個肚子，布置跟辦桌很像，會有大紅圓桌，但\
    \ DEFAULT不一樣的是，沒有限定入座位置、人數或開桌時間，來了就可以享用，吃完就離開，美食作家黃婉玲表示，早年敢擺「流水席」，就代表主人家銀彈充足，要大肆慶祝一番。\n\
    \  流水席大多是快速出餐、填飽肚子為主的餐點，例如炒麵、炒米粉、丸子湯、粥品等，總鋪師會一直重覆端出菜色來服務賓客，用餐時間約莫半小時，賓客來來去去川流不息，所以叫做流水席。\n\
    \  至於辦桌，通常由固定主人家或是主辦方出資舉辦，是等到主人邀請時間到以後，客人才能陸續入席，且必須受主人邀請才能前來，屬於私人聚會的性質，辦桌席間的菜色較為精緻，也會有特定的菜序模式。上菜宴客原因五花八門，包含結婚、祝壽、新居落成、尾牙、滿月酒宴或喪宴等，通常有規定宴席的日期、時間，賓客需坐在固定位置，總鋪師準備的菜色較流水席精緻，賓客則是同一時間入坐的同一群人，用餐時間至少三小時起跳。\n\
    （劉潔謙 辦桌與流水席差在哪）"
