- id: doc_113_台中_四育_國文_g7s2e3_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 「文化其實體現在一個人如何對待這世間的態度。在一個文化厚實深沉的社會裡，人懂得尊重□□—他不苟且，因為不苟且所以有品味；人懂得尊重□□—他不霸道，因為不霸道所以有道德；人懂得尊重□□—他不掠奪，因為不掠奪所以有永續的智慧。」根據這段文字的內容，空格處依序應填入下列何者最恰當？
  options:
  - label: A
    content: 自己／別人／自然
  - label: B
    content: 別人／自己／自然
  - label: C
    content: 自己／自然／別人
  - label: D
    content: 別人／自然／自己。
- id: doc_113_台中_四育_國文_g7s2e3_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: 根據上文，下列何者「並非」紅糯米對於太巴塱部落阿美族人的意義？
  options:
  - label: A
    content: 分享
  - label: B
    content: 感恩
  - label: C
    content: 傳統
  - label: D
    content: 收入。
  group_stem: "紅糯米是花蓮 太巴塱部落阿美族人的傳統作物，也是臺灣唯一的紅糯米產地，一年僅一穫，部落的紅糯米田昨天以古早方式手工收割，收割前頭目也特別舉辦收穫祭儀式！現場還以傳統的阿美族家屋爐灶，煮成糯米飯「哈哈」，當「哈哈」開鍋倒進木臼時，米飯香氣撲鼻而來！現場也搥打成美味的紅米麻糬，族人們一起分享收穫喜悅！而在收割前頭目王成發和媽媽們一起在田間進行祈福、收穫儀式，感謝上天賜予豐盛的糧食。\n\
    \  早年從播種、收割、入倉皆有傳統祭典儀式，在西方宗教進入部落後導致傳統式微，族人必須回復這些古早的文化，讓下一代以阿美族為榮。\n（臺灣原住民族資訊資源網\
    \ 太巴塱紅糯米手工收割 收穫祭謝天）"
- id: doc_113_台中_四育_國文_g7s2e3_s1_24
