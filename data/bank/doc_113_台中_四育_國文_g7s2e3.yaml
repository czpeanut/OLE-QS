  section: 3
  number: 30
  type: single
  page: 2
  stem: 小曄想要在家製作美味的鳳梨酥，上網搜尋到右側的食譜，根據食譜中關於酥皮製作的過程，下列敘述何者最恰當？
  options:
  - label: A
    content: 酥皮材料中不應包含雞蛋
  - label: B
    content: 麵粉和糖粉應揉成粗粒狀
  - label: C
    content: 麵團冷藏時間應為一小時
  - label: D
    content: 酥皮製作時不需加入糖粉。
  group_stem: '鳳梨酥

    材料

    餡料：鳳梨果肉500 克，砂糖100 克

    酥皮：低筋麵粉250 克，奶油150 克，糖粉50 克，雞蛋1 顆，鹽1 克。

    製作步驟

    1. 將鳳梨果肉切成丁狀，與砂糖一起放入鍋中用小火翻炒。待水分收乾，再放涼備用。

    2. 將低筋麵粉、糖粉和鹽混合均勻，用手揉成粗粒狀後，再加入奶油、雞蛋揉成麵團。

    3. 用保鮮膜包裹麵團，放入冰箱冷藏30 分鐘後取出。再將麵團分成每個20 克的小塊，鳳梨餡分成每個15克的小球。

    4. 將每塊麵團擀成圓片狀，包入小球鳳梨餡，再收口捏緊，放入模具中擠壓成形。

    5. 預熱烤箱至攝氏180 度，將含餡成形的麵團放入烤箱，約烤20 分鐘即可出爐。'
