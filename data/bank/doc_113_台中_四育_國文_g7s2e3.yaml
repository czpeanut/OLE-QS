  section: 1
  number: 20
  type: single
  page: 1
  stem: 愛因斯坦說：「聰明的人絞盡腦汁去解決問題，而有智慧的人則避免產生問題。」這句話的涵義在說明哪一種處理事情的態度較合宜？
