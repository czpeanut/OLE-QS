  stem: 「現代復古—或者任何復古風格—的好處在於，它帶有一種懷舊的感覺，並提供了設計與用戶之間的直接聯繫。即使沒有特定的品牌或圖標，現代復古風格也應該讓用戶說：『我記得。』大部分的設計都集中在樂趣上，這樣他們就會覺得輕鬆，容易，並且有一種接近兒童和青少年的天賦。」根據上文，何者是復古追求的精神？
  options:
  - label: A
    content: 正規符合傳統
  - label: B
    content: 青春充滿童趣
  - label: C
    content: 簡便卻又高雅
  - label: D
