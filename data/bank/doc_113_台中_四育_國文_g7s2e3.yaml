  group_stem: "孔子謂顏回曰：「回，來！家貧居卑，胡不仕乎？」顏回對曰：「不願仕。回有郭外之田五十畝，足以給飦粥；郭內之田十畝，足以為絲麻；鼓琴足以自娛；所學夫子之道者足以自樂也。回不願仕。」孔子愀然變容曰：「善哉回之意！丘聞之，『知足者不以利自累也，審自得者失之而不懼，行修於內者無位而不怍。』丘誦之久矣，今於回而後見之，是丘之得也。」\n\
    （莊子 讓王）\n\n註：①飦粥：飦，音ㄍㄢ。濃粥。\n  ②愀然：愀，音ㄑㄧㄠˇ。容色驟變貌。\n  ③怍：音ㄗㄨㄛˋ，慚愧。"
