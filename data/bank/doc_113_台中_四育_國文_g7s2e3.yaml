- id: doc_113_台中_四育_國文_g7s2e3_s1_19
  section: 1
  number: 19
  type: single
  page: 1
  stem: 「走向成功的路，是不容許好高騖遠，華而不實的，它由血汗點滴凝聚而成。只要我們的今天比昨天更努力，更有進步，每天都能有新的展望，新的挑戰，縱然只是小小的成果，也會帶來充實、愉悅的感覺。那麼，走過長長的一生，我們俯仰無愧，了無憾恨，又何嘗不也是成功呢？」（鄭頻
    成功）根據上文，作者所認定的成功為下列何者？
  options:
  - label: A
    content: 實現偉大的夢想
  - label: B
    content: 規畫出奮鬥的目標
  - label: C
    content: 超越昨日的自己
  - label: D
    content: 不辜負他人的期望。
