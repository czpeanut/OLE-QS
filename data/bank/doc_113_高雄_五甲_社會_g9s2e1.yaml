- id: doc_113_高雄_五甲_社會_g9s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 代表軍屯的「鎮」或「營」等地名，最可能分布於哪個地區？
  options:
  - label: A
    content: 台北
  - label: B
    content: 桃園
  - label: C
    content: 苗栗
  - label: D
    content: 台南。
  group_stem: 臺灣的地名與歷史產業有密切的關聯。例如：「鎮」與「營」的相關地名，是因為當地曾實施寓兵於農的「軍屯」；而「大稻埕」則是晒穀場的意思；「張犁」、「甲」代表土地的計算單位；「股」是墾戶募集資金，墾成後分配土地股份；「結」是漢人墾地「結首」制的代稱，這些地名都反映當時農業開墾的狀況。除此之外，地名含有「樟」或「腦」者多半與製造樟腦有關，而含有「茶」字者大多為產茶區域，地名若有「蔗」，則大多是製糖的聚落。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
