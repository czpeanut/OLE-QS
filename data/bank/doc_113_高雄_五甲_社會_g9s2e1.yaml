- id: doc_113_高雄_五甲_社會_g9s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 上文中的紀念車票銷售模式，最能夠呼應下列哪一個概念？
  options:
  - label: A
    content: 車站名稱與交通產業的結合
  - label: B
    content: 車站名稱與印刷產業的結合
  - label: C
    content: 車站名稱與文創產業的結合
  - label: D
    content: 車站名稱與食品產業的結合。
  group_stem: 「永保安康」是漢語中祝福對方「永遠平安」的祝福語，有趣的是，臺南市的兩座臺鐵車站的站名—「永康」、「保安」，因為共同組合成「永保安康」的意涵，使得兩站之間的「永保安康」紀念車票成為了知名的紀念品。對此，臺鐵局特別在「永保安康」紀念車票的印製紙張上保留了古早味的厚卡紙，以增添懷舊的情調。而舊的保安車站在西元
    1909 年時為了配合車路墘製糖所(今稱為仁德虎山糖廠)的運輸需求，遷移至今日的站址。
