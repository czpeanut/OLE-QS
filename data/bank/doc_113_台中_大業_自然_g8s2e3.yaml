- id: doc_113_台中_大業_自然_g8s2e3_s1_25
  section: 1
  number: 25
  type: single
  page: 4
  stem: '臉書社團中，有自稱盧比醬的⼈號稱自⼰的爺爺登陸過月球，並且說起她的爺爺跟他分享了登陸月球的故事。

    盧比醬：「還記得小時候爺爺跟我說過，在太空梭中，氣體的壓⼒和地表附近差不多，⼤概是⼀⼤氣壓。⽽且，在月球上沒有任何的空氣。我的爺爺還偷偷帶了⼀包鋁箔包裝，內有填充氮氣的乖乖上去，打算如果真的發現⽟兔，要送他當見面禮。結果⼀下太空梭後，這包乖乖直接扁掉（甲）。我爺爺還說，⾛起路來特別困難。因為在月球上沒有空氣的關係，造成在相同接觸面的狀況下，摩擦⼒比在地球上小很多（⼄）。他還在月球上成功地用吸管吸起了他最愛的飲料－英國紅茶（丙）。」

    聰明的你，根據哪些敘述，可以知道盧比醬應該是被爺爺開了⼀個⼤玩笑，跟實際狀況並不相符呢？'
  options:
  - label: A
    content: 甲⼄丙
  - label: B
    content: ⼄丙
  - label: C
    content: ⼄
  - label: D
    content: 甲丙。
