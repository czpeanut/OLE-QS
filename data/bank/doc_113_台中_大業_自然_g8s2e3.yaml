  type: single
  page: 1
  stem: 關於製作肥皂的實驗，下列敘述何者錯誤？
  options:
  - label: A
    content: 在實驗中，加⼊⼄醇是為了協助氫氧化鈉溶解於油脂中，⼄醇並非催化劑
  - label: B
    content: 鹽析時所使用的食鹽⽔不能夠是飽和食鹽⽔，以避免肥皂無法分離出來
  - label: C
    content: 檢驗肥皂時，應避免碰觸肥皂，因為此時的肥皂中可能有未完全反應的鹼性物質
  - label: D
    content: 肥皂浮在食鹽⽔上，表示肥皂的密度較食鹽⽔小。
