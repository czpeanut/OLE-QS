- id: doc_113_高雄_五福_社會_g8s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 非洲是世界古文明和古人類發源地之一，因自然環境、傳統文化與經濟發展差異，大致區分為漠南、北非兩個文化區。請問：上述南、北兩文化區大致以何處作為地理分界？
  options:
  - label: A
    content: 撒哈拉沙漠
  - label: B
    content: 尼日河流域
  - label: C
    content: 東非大裂谷
  - label: D
    content: 北回歸線。
