  stem: 圖(1)為非洲原始部落的維生活動示意圖。居民在林間以簡單農具焚林整地、闢地耕種，當地力耗盡後再遷往他處開闢新耕地。關於這種生產活動的「名稱」以及特徵，下列敘述何者正確？
