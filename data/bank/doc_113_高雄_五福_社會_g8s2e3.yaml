- id: doc_113_高雄_五福_社會_g8s2e3_s1_48
  section: 1
  number: 48
  type: single
  page: 8
  stem: '下文說明了近年東南亞的地緣政治與經濟。請問：哪一標題敘述最符合文章描述之內容？


    當舊的冷戰秩序褪去、美蘇兩強的意識形態對峙，轉換為美國與中國在經濟上的明爭暗鬥，「全球南方」的概念也逐漸興起。來自不同地區的研究者呼籲正視世界的發展失衡與資源的分配不均。乍看之下，「全球南方」意味著，我們將不再以政治系統(第一、第二、第三世界)或貧窮程度(已開發、開發中)來分類國度。取而代之的是重視過去在帝國主義與冷戰背景下，遭受傷害的民族、區域與國家。而他們的共通性，大部分都建立在地理上，相對於歐美以及東亞中、日所在位置的「南方」。

    資料來源：趙身潔《南方的社會，學》'
  options:
