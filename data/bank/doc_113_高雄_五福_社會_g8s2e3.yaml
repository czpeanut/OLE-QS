  section: 1
  number: 49
  type: single
  page: 8
  stem: 根據文章內容，請問：主角沒有經歷過哪場戰爭？
  options:
  - label: A
    content: 中日戰爭
  - label: B
    content: 韓戰
  - label: C
    content: 越戰
  - label: D
    content: 國共內戰。
  group_stem: "1937 年戰爭爆發，當時1929 年出生的曹可雲爺爺才八歲，但他至今仍記得抗戰時老家的情況。他說：「飛機來轟炸成都，把整個城市炸得亂七八糟，晚上還能看到天空中有飛彈飛過。」那時他剛上小學不久，開始學習算盤與毛筆書寫，卻因戰爭導致社會動盪，學業被迫中斷。\n\
    抗戰結束後，他以為日子總算會安定下來，沒想到內戰又接著爆發。當時共產黨要求他的父親去服勞役，並表示如果曹可雲願意參軍，就可以免除他父親的勞役。因此他選擇離開家鄉，走上軍旅之路。1950\
    \ 年，他代替父親加入了「人民志願軍」，前往朝鮮「抗美援朝」。在停戰期間，他被美軍俘虜。戰爭結束後，他選擇不返回中國，而是來到他基未踏足過的臺灣，隨後被分發至金門服役。1969\
    \ 年，他以中士階級退伍。\n           資料來源：國家文化記憶庫「移動•行動-戰後臺灣榮民與眷村生活記憶暨轉譯計畫"
