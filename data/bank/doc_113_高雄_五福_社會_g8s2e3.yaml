- id: doc_113_高雄_五福_社會_g8s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 長跑強國肯亞，培育出許多世界級運動員，馬拉松世界紀錄前100 名成績中，有90 名都是由肯亞選手創下的。科學家對此提出三項解釋：一.長跑是肯亞人的文化傳統，成為運動員較易為自己與家族得到經濟翻身的機會。二.政府有較完整的培訓及聯賽制度，能營造高競爭力的訓練環境。三.肯亞的地形，有利選手增強心肺功能。請問：關於肯亞的自然環境，下列敘述何者正確？
  options:
  - label: A
    content: 因斷層陷落而地勢低窪，全年有雨
  - label: B
    content: 因板塊運動而海拔較高，氣候涼爽
  - label: C
    content: 受副熱帶高壓籠罩影響，植被稀少
  - label: D
    content: 地形的等高線圖，如圖(4)所示
