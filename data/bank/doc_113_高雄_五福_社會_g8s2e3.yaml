- id: doc_113_高雄_五福_社會_g8s2e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 歐洲列強殖民時期為掠奪資源，長期在漠南非洲發展熱帶栽培業；當地各國獨立後，大多仍以此為主要收入來源。請問：漠南非洲目前熱帶栽培業的發展，下列敘述何者正確？
  options:
  - label: A
    content: 主要盛行於圖(3)丙戊兩氣候區的範圍
  - label: B
    content: 產量較多的作物有咖啡、可可及棗椰
  - label: C
    content: 國際市場價格因公平貿易(FAIRTRADE)的推動，已全由當地農民所控制
  - label: D
    content: 這種自給自足的農耕方式壓縮了經濟作物的種植空間。
