  - label: A
    content: 「採集」：主要分布於高山針葉林區，產量不穩
  - label: B
    content: 「狩獵」：市場導向的生產模式，附加價值高
  - label: C
    content: 「游牧」：逐水草而居，對自然環境的干擾最小
  - label: D
    content: 「游耕」：藉由遷移來維持農地的土壤肥沃度
