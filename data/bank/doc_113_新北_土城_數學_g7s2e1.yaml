  stem: '小華在研究某縣的勞動力人口統計資料，發現該縣勞動力人口共有500萬人，其中男性勞動力人口數為$x$萬人，女性勞動力人口數為$y$萬人，又男性失業率為5%，女性失業率為3%，總失業率4.25%，依題意可列式為何？

