    content: $\begin{cases}x+y=500\times\frac{4.25}{100} \\ \frac{5}{100}x+\frac{3}{100}y=500\end{cases}$
  - label: D
    content: $\begin{cases}x+y=500 \\ \frac{5}{100}x+\frac{3}{100}y=500\times\frac{4.25}{100}\end{cases}$
