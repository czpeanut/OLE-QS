  stem: '下列為兩國官員的對話內容：

    甲：「二島(琉球與臺灣)俱與我屬土，屬土之人相殺，裁次固在於我，我恤琉人，自有措置，何預貴國事，而煩為過問？」

    乙：「貴國既然已知撫卹琉球民，為何不懲辦臺番？」

    甲：「殺人者為置之化外的生番。」

    乙：「生番害人，貴國置之不理，我國有必要問罪島人，因與貴國盟好，特先來奉告。」

    甲：「生番係我化外之民，問罪與否，聽憑貴國辦理。」

