- id: doc_113_台中_大甲_社會_歷史_g8s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 歷史上有許多宣言與中華民國息息相關，其中民國初年的「越飛宣言」更使中華民國進入不同階段，其宣言擷取如下：「孫逸仙博士認為共產組織甚至蘇維埃制度，事實上均不能引用於中國，因中國並無可使此項共產主義或蘇維埃制度可以成功之情形存在之故。……且以為中國最重要最迫急之問題乃在民國的統一之成功，與完全國家的獨立之獲得。關於此項大事業，越飛君並向孫博士保證，中國當得俄國國民最真摯之同情，且可以俄國援助為依賴」。請問：依上述史料研判，此宣言應為下列哪一事件？
  options:
  - label: A
    content: 聯俄容共
  - label: B
    content: 寧漢分裂
  - label: C
    content: 鐵路國有政策
  - label: D
    content: 清黨。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
