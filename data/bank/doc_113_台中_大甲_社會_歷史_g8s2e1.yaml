  stem: 清宣統三年十二月二十五日（1912年2月12日），清朝皇帝溥儀頒布退位詔書。但在故宮博物院典藏的清代檔案中，發現進呈給溥儀的奏摺，時間卻標註為「宣統九年七月」。請問：我們應該如何解釋此現象？
  options:
  - label: A
    content: 宣統皇帝只在位三年，應該是清政府官員寫錯年代的奏摺
  - label: B
    content: 地方將領張勳擁立溥儀，重新復位
  - label: C
    content: 南北分裂時期，張作霖支持清政府而以宣統紀年進呈的奏摺
  - label: D
    content: 中華帝國成立時，其政府官員上奏給溥儀，故以宣統紀年。
