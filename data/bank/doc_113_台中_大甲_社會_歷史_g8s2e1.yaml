- id: doc_113_台中_大甲_社會_歷史_g8s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 北大教授黃侃在授課時說：「如果胡適的太太死了，他的家人電報必云：『你的太太死了！趕快回來啊！』長達十一字。而用文言僅需『妻喪速歸』四字即可，電報費就可省下不少。某天胡適上課說：「前幾天行政院有位朋友給我打來電報，邀我去做行政院秘書，我打電報拒絕，覆電若用文言書寫『才學疏淺，恐難勝任，不堪從命。』若我用白話寫，只有五個字：『幹不了，謝謝！』」。請問：依照以上這兩位學者的言論，下列說法何者正確？
