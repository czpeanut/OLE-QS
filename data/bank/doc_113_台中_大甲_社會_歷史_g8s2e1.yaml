  number: 3
  type: single
  page: 1
  stem: 竣億翻閱歷史書籍看到以下文章「痛只痛，甲午年，打下敗陣。痛只痛，庚子歲，慘遭殺傷。痛只痛，割去地，萬古不返。痛只痛，所賠款，永世難償。……雪仇恥，驅外族，復我冠裳。到那時，齊叫道，中華萬歲。」請問：竣億會在以下哪本書籍看到這篇文章？
