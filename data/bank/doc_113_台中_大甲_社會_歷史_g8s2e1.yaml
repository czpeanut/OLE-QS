  number: 6
  type: single
  page: 1
  stem: 資料一：再則調審國會之不良，由於國會組織法之不善，倘不先組織一種過渡機關，將國會組織法修改，仍用舊法選舉新國會，未有不蹈舊國會之覆轍者。…然後，制定新的國會組織法，進而舉行全國大選。資料二：夫國會解散以來，某等或奔走滬、粵，籌議護法，海軍將士同具護法決心，程前總長率艦隊南下，國會議員亦開非常會議於廣州，……公佈軍政府組織大綱。請問：由這兩份資料判斷，當時中國發生哪一變故？
