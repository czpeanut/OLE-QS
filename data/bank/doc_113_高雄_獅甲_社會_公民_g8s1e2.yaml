  section: 1
  number: 43
  type: single
  page: 1
  stem: '某大學邀請四位政治人物蒞校演講，表（一）為此四場演講的逐字稿片段。根據表中內容判斷，何者最可能曾經任職我國民選的地方政府公職人員？


