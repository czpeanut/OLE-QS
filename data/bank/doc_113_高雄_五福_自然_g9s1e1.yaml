- id: doc_113_高雄_五福_自然_g9s1e1_s1_19
  section: 1
  number: 19
  type: single
  page: 3
  stem: '將碗置於裝有水的臉盆中，碗內有一顆彈珠，並整個放在磅秤上秤得共150 公克重，如圖所示。當碗及彈珠在水面上呈現靜止狀態時，宮美村掐、寶麗達比和裁傅志由分別提出自己的見解，其敘述如下：

    宮美村掐：圖中磅秤的讀數為水、臉盆、碗、彈珠的重量總和。

    寶麗達比：彈珠施予碗底一個向下作用力，其反作用力為碗作用於彈珠的支撐力。

    裁傅志由：如果將彈珠從碗取出放到水中，因為彈珠施予碗底的作用力消失，所以碗底給彈珠的支撐力也消失了，因此磅秤讀數應該變小。

    關於三人的敘述下列何者較合理？'
