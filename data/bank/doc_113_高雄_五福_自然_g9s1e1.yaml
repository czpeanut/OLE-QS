  group_stem: '請在閱讀下列敘述後，回答下列32.~33.題

    汽車的安全系統判斷車身受到撞擊而急遽減速時，裝在方向盤裡的安全氣囊即會充氣彈出，透過內部氣體的緩衝，配合安全帶的作用，來降低駕駛人受到的衝擊力。圖為一款汽車安全氣囊的充氣壓力與充氣時間的關係圖（100
    kPa 大約為1 大氣壓）。在駕駛人撞擊到安全氣囊前，必須要有足夠的時間讓安全氣囊至少充氣達飽和壓力的一半以上，才能藉由緩衝達到保護駕駛人的效果。

