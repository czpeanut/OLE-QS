  group_stem: '請在閱讀下列敘述後，回答30.～31.題

    在義大利 佛羅倫斯的科學史博物館成立於西元1927 年，經兩年翻修後於西元2010 年6 月10 日重新開館，更名為伽利略博物館（Museo Galileo）。

    館內收藏了一座十八世紀後期的一個演示儀器，長寬高為544cm × 39cm × 124cm，作者不詳，在史上最美的十項科學實驗這本書裡，作者克里斯（Crease）將此斜面稱為Belled
    Plane（鈴鐺平面）。

    將斜面上5 個活動鈴鐺組，放置在斜面正上方，當球自高處滾下來敲響鈴鐺時，就會發出聲音，演示者排列這5 個鈴鐺，使球（此球的質量為500 公克）滾下來敲響鈴鐺聲音是等時間間隔，以此發現球自斜面高處滾下來移動距離的特性，如圖所示。'
