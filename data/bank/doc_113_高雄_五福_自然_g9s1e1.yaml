- id: doc_113_高雄_五福_自然_g9s1e1_s1_50
  section: 1
  number: 50
  type: single
  page: 8
  stem: "早期曾有一首老歌「來去臺東」，對於台東地區的特色描述得相當清楚，其中歌詞是這樣寫的：  \n你若來台東，請你斟酌看，出名鯉魚山亦有一支石雨傘 \n\
    初鹿之夜，牧場唱情歌，紅頭嶼、三仙台，美麗的海岸 \n鳳梨釋迦柴魚，好吃一大盤，洛神花紅茶，清涼透心肝 \n你若來台東，請你相邀伴，知本洗溫泉予你心快活 \n\
    \ \n上述歌詞所提到的景觀「石雨傘」，是由一塊較細長的岩石，懸空向上，托住了一塊較大的岩石，所形成的一種特殊的平衡結構。形成的原因是上下的岩石質地不同，上方屬較堅硬的珊瑚礁岩，下方則為稍軟的礫岩，經日積月累侵蝕的結果，變成下面較細、上面較粗的模樣。而其即將因風化作用破壞而消失。請參考上圖石雨傘的外觀，試判斷石雨傘的成因為何？與下列何種地質景觀最相似？"
  options:
  - label: A
    content: 岩漿冷卻形成，澎湖的柱狀節理
  - label: B
    content: 差異清蝕，野柳的女王頭
  - label: C
    content: 海水侵蝕形成，花蓮的清水斷崖
  - label: D
    content: 河流沉積形成，南投山區的土石流。
