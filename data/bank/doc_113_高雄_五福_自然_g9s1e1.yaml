- id: doc_113_高雄_五福_自然_g9s1e1_s1_37
  section: 1
  number: 37
  type: single
  page: 7
  stem: 由上可知臺灣的用水來源不包含？
  options:
  - label: A
    content: 地下水
  - label: B
    content: 湖泊
  - label: C
    content: 水庫
  - label: D
    content: 高山冰川。
  group_stem: '請閱讀以下文章，再作答37~40 題：


    台灣本島四面環海，地處於世界最大的海洋與大陸之間，橫跨熱帶與副熱帶，多元的氣候特色為台灣帶來每年約 2500 毫米的降雨量，為世界平均雨量的 3 倍之多。

    因山坡陡峭、河川較短的地形，使得雨水流入海中或蒸發流失的速度更快。台灣每年降雨量有約 80% 的雨水像是過路客般，短暫經過台灣土地，未能來得及被收集運用。

    各城市在不同季節之中降雨量差異大，每年 12 月至隔年 1 月，是全台灣雨量最少的月份，尤其位於東北季風背風面的中南部地區，平均日雨量不足一毫米。集中在夏季的降雨成為台灣水資源最重要的來源。中南部地區在枯水期時需要高度仰賴水庫的蓄存，然而水庫的容量又是另一個壓力問題。

    地下水也是台灣用水的重要來源。在彰化、雲林、嘉義等地，早年因為缺乏有效的蓄水設施，且受到工業用水排擠農業用水的效應，當地的民生、農漁業用水需求皆轉由抽取地下水來滿足用水量；因土地過度開發，缺乏妥善管理的情況下，未考慮安全出水量以及總量限制，因而出現地下水嚴重超抽而導致地層下陷速度加快導致地形高低差異，削弱了海堤防護的功能，每逢颱風、豪大雨，就會面臨海水倒灌、積水不退的災害，隨著氣候變遷、海平面上升，倒灌的可能性又更加顯著。

    解決地層下陷的主要方法包含嚴格取締與管制、進行地下水補注，還有提高路面的入滲率。一般來說，地下水的水源來自於降雨，然而隨著都市化發展，水泥和瀝青就像一層不透水罩般覆蓋住大部分的土地，使得降雨無法有效被空曠地所吸收、補注地下含水層的水量，於是建造海綿都市，提高都市保水貯存能力，以新的方法解決新的問題，是現今治水的目標。

    人們常將未經處理的汙染物，如工業廢水、農牧業廢水、家庭廢水等，直接排入河川中，造成水汙染。汙染物藉由水循環和食物鏈的累積，最終將嚴重影響人們自身的健康安全。'
