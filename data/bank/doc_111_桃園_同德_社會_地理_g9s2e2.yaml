- id: doc_111_桃園_同德_社會_地理_g9s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 因應稻米生產過剩，政府積極推動稻田轉作雜糧或其他高經濟價值的作物，並外銷其他縣市或國家。請問：下列何者並非政府鼓勵農民種植的作物？
  options:
  - label: A
    content: 毛豆
  - label: B
    content: 甘蔗
  - label: C
    content: 芒果
  - label: D
    content: 蝴蝶蘭
- id: doc_111_桃園_同德_社會_地理_g9s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 「在地生產、在地消費」這種友善環境的飲食方式，除了能拉近生產者與消費者之間的距離，讓消費者獲得更新鮮的食物，還具有下列哪一項優點？
  options:
  - label: A
    content: 節省行銷費用
  - label: B
    content: 節約勞力投入
  - label: C
    content: 降低食物里程
  - label: D
    content: 提高國際形象
- id: doc_111_桃園_同德_社會_地理_g9s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 2021年臺灣農產品出口第一名的項目為「魚類及其製品」，臺灣鯛、虱目魚、黑鮪魚等漁產在國內外皆有高度的評價。請問：造成臺灣漁業發達的原因與下列哪個自然條件關係最小？
  options:
  - label: A
    content: 四周海洋環繞
  - label: B
    content: 海岸類型多元
  - label: C
    content: 峽灣地形發達
  - label: D
    content: 寒暖洋流交會
- id: doc_111_桃園_同德_社會_地理_g9s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 「每年的九月至隔年一月，為新竹柿子盛產的季節，傳統上柿餅的製作工法是使用日曬、風乾、炭燒的方式，讓糖分濃縮，甜味變得更加濃郁。棚架上的黃澄澄的柿海美景，往往吸引了許多遊客的駐足。」請問：文中提到的「風乾」，主要是仰賴下列哪一個盛行風的吹拂？
  options:
  - label: A
    content: ↖
  - label: B
    content: ↙
  - label: C
    content: ↘
  - label: D
    content: ↗
- id: doc_111_桃園_同德_社會_地理_g9s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 位於台中科學園區的科技廠老闆想在農曆年前送禮給員工，為了守護地球，老闆特別要求採購當季且能夠減少食材運輸里程的水果禮盒。請問：下列哪個產地的水果，最能符合公司老闆的需求？
  options:
  - label: A
    content: 日本青森的蘋果
  - label: B
    content: 台南玉井的芒果
  - label: C
    content: 高雄燕巢的蜜棗
  - label: D
    content: 苗栗大湖的草莓
- id: doc_111_桃園_同德_社會_地理_g9s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 「冷鏈為一種嚴格控制溫度的供應鏈，從原物料供應、生產、儲存到配送的過程，皆維持在低溫的狀態，以確保產品不受環境影響而變質，通常用於生鮮蔬果、加工食品與醫藥產品等行業。請問：若能加強臺灣的冷鏈物流體系，對農民而言可增加下列何種效益？
  options:
  - label: A
    content: 增加種植面積
  - label: B
    content: 擴大銷售範圍
  - label: C
    content: 減少農藥使用
  - label: D
    content: 減少勞力投入
