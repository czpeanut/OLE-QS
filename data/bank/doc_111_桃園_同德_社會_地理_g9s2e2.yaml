  section: 1
  number: 15
  type: single
  page: 2
  stem: 現今在臺灣可以看到許多來自世界各地生產的生鮮蔬果、肉類及加工食品，造成此種現象的主要原因為何？
  options:
  - label: A
    content: 工業革命
  - label: B
    content: 基因改造
  - label: C
    content: 都市擴張
  - label: D
    content: 交通革新
- id: doc_111_桃園_同德_社會_地理_g9s2e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 目前臺灣並未核准基因改造作物的種植，只有開放部分飼料用或食品用的基改作物進口，且依臺灣現行法規規定，含有基改原料的食品應於包裝、菜單或是掛牌標示。請問：下列哪些臺灣產品最有可能看到「非基改」的標示？
  options:
