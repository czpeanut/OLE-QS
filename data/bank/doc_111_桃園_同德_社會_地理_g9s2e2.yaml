questions:
- id: doc_111_桃園_同德_社會_地理_g9s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 臺灣農業生產成本較高的原因和下列哪一項關係最為密切？
  options:
  - label: A
    content: 耕地面積狹小
  - label: B
    content: 土壤較為貧瘠
  - label: C
    content: 氣候過於溼熱
  - label: D
    content: 對外交通不便
- id: doc_111_桃園_同德_社會_地理_g9s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 臺灣的水果不僅種類繁多且品質優良，深受國內外消費者喜愛。請問：臺灣的水果種類多樣的主要原因為何？
  options:
  - label: A
    content: 耕地面積廣大
  - label: B
    content: 地形氣候多樣
  - label: C
    content: 生產成本低廉
  - label: D
    content: 農業集約度高
- id: doc_111_桃園_同德_社會_地理_g9s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 臺灣素有「水果王國」的美稱，但仍有部分水果的產量無法供應國內市場所需，仰賴國外進口。請問，依據臺灣的自然環境判斷，下列何者不是臺灣進口居前五名的水果？
  options:
  - label: A
    content: 葡萄
  - label: B
    content: 釋迦
  - label: C
    content: 櫻桃
  - label: D
    content: 蘋果
- id: doc_111_桃園_同德_社會_地理_g9s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 近代為使農產品更適合儲存、食用及烹調，使得食品加工更加普遍。請問：現代食品進行加工的主要目的不包括下列何者？
  options:
  - label: A
    content: 降低運輸成本
  - label: B
    content: 擴大銷售市場
  - label: C
    content: 增加營養價值
  - label: D
    content: 減少碳排放量
- id: doc_111_桃園_同德_社會_地理_g9s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 臺灣某速食業者曾推出黃金臭豆腐比薩、香菜皮蛋豬血糕比薩等將台味入菜，成功吸引大眾注意與嘗鮮，也引起一波討論風潮。這種配合當地飲食文化、使用當地食材的經營策略，可用下列哪一個名詞說明？
  options:
  - label: A
    content: 專業化
  - label: B
    content: 全球化
  - label: C
    content: 在地化
  - label: D
    content: 集約化
- id: doc_111_桃園_同德_社會_地理_g9s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 農業生產活動十分受到土地、氣候條件等自然環境的限制。請問：下列哪一種作物最適合種植在氣候類型如【圖一】所示的地區？
  options:
  - label: A
    content: 茶樹
  - label: B
    content: 蘋果
  - label: C
    content: 葡萄
  - label: D
    content: 棕櫚
  assets:
