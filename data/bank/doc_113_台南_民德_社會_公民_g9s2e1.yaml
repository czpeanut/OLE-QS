  section: 1
  number: 35
  type: single
  page: 4
  stem: 下列關於我國智慧財產權的相關法律內容，何者「錯誤」？
  options:
  - label: A
    content: 根據《著作權法》之規定，當著作完成時，就享有著作權，無須經過任何申請審查
  - label: B
    content: 根據《著作權法》之規定，著作財產權保障年限為著作人著作完成後，開始計算 50 年期間
  - label: C
    content: 根據《專利法》之規定，發明者須經申請審查通過，才能取得專利權
  - label: D
    content: 根據《商標法》之規定，商標所有人須經申請審查後，才能取得商標權。
