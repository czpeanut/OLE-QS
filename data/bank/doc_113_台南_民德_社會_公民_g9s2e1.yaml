  type: single
  page: 1
  stem: 近年來人工智慧的發展快速， AI 生成的藝術作品、 ChatGPT 撰寫的文章皆已大大顛覆民眾對於科技的想像，但也促使民眾開始思考 AI 作品的智慧財產權問題。日前，美國著作權局做出裁定，認為若作品中屬於「創作」的部分主要由
    AI 完成，則此作品就無智慧財產權，無法獲得美國法律的保護。根據上文提及的權利及我國相關法律的規定，下列敘述何者正確？
