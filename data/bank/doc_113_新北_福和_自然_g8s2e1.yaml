- id: doc_113_新北_福和_自然_g8s2e1_s1_39
  section: 1
  number: 39
  type: single
  page: 4
  stem: 在「爆手雷」的反應過程中，以下哪種離子不會出現？
  options:
  - label: A
    content: 鈉離子($\mathrm{Na^{+}}$)
  - label: B
    content: 碳酸氫根離子($\mathrm{HCO_{3}^{-}}$)
  - label: C
    content: 銨根離子($\mathrm{NH_{4}^{+}}$)
  - label: D
    content: 檸檬酸根離子($\mathrm{C_{6}H_{7}O_{7}^{-}}$)。
  group_stem: 「爆手雷」整人玩具的製作原理主要是基於快速釋放氣壓來產生聲響和震動，模擬手榴彈爆炸效果，通常使用檸檬酸($\mathrm{C_{6}H_{8}O_{7}}$)和小蘇打進行反應，反應式：
    $3\mathrm{NaHCO_{3}}＋ \mathrm{C_{6}H_{8}O_{7}} → 3\mathrm{CO_{2}}＋ 3\mathrm{H_{2}O}＋
    \mathrm{Na_{3}C_{6}H_{5}O_{7}}$，過程中解離出各種離子，反應後會生成檸檬酸鈉($\mathrm{NaC_{6}H_{7}O_{7}}$)。另外，檸檬酸也能當作天然防腐劑，日常觀察可發現切開蘋果、香蕉且暴露於空氣中時，因其含有酚類化合物造成表面氧化而有「褐變」現象。若將檸檬酸或檸檬汁塗在切開的水果表面，可有效減少氧化變色。請根據短文回答第
    39-40 題：
