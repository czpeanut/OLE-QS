  group_stem: "伊朗電影《何處是我朋友的家》故事描述小學生阿哈瑪德和內瑪扎迪的友誼。某天放學，阿哈瑪德誤將坐在隔壁的內瑪扎迪的作業簿收進自己書包。回到家之後，發現朋友的作業簿在自己的書包裡，開始擔心內瑪扎迪隔天會因沒寫作業遭到處罰。但是母親規定他必須要做完家事、寫完作業之後才可以出門，著急的阿哈瑪德趁著母親不注意時，帶著作業簿奔往隔壁村子。\n\
    \    途中，遇到同學莫魯薩德，但是他要幫忙父親提牛奶，只能指出概略方向。阿哈瑪德在村子裡繞了許久，就是找不到內瑪扎迪的家，途中聽聞某位做鐵窗的老闆似乎也叫內瑪扎迪，猜想他可能是同學的父親，於是追著騎驢的鐵窗老闆，不料他們只是剛好同姓而已。\n\
    \    阿哈瑪德最後問了一位動作緩慢的老人，老人誇口全村的任何人都認識。最後帶著小男孩繞了一大圈，把他帶到做鐵窗的老闆家。由於天色已晚，失望的小男孩決定先回家，老人好心要陪他走，但老人走太慢了，阿哈瑪德就自己跑掉了。不幸路上遇到惡犬，反而是走得慢吞吞的老人解救了他。\n\
    \    回到家之後，阿哈瑪德決定                。隔天老師檢查作業時，阿哈瑪德及時將作業簿還給了內瑪扎迪，原本沮喪到快要哭出來的内瑪扎迪，在打開作業簿之後，驚訝的破涕為笑。"
