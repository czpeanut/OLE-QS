  group_stem: "有些人一直以為生氣、發火，只要不把它表現出來便是一種成功控制脾氣的表現，其實這是大錯特錯的想法。凡「嘔氣、賭氣、發脾氣」，都是一個人情緒消極、失控的表現，對他人發脾氣是把氣出到別人身上；不向他人發火，僅僅自己內心鬱悶、不爽，只是把氣出在自己身上而已。這兩種形式，同樣都是脾氣不好的表現，差別在於對象的不同而已。\n\
    \  沒有一個人能夠一生當中永遠不生氣、不發火，聖人也不例外。\n  但是，我們可以憑藉「修練脾氣」來應付日常生活中使我們不痛快的瑣碎小事和環境，從而使我們得到快樂。\n\
    \  一個人的內心所想往往會關係到一個人的命運，因此，要想時刻都過得愉快，那就得修練自己的脾氣，讓自己隨時保持樂觀開朗陽光的心境與心態。         \
    \       （節錄自張為之 <修練脾氣>）"
