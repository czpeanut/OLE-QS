- id: doc_113_高雄_英明_國文_g7s1e1_s5_19
  section: 5
  number: 19
  type: single
  page: 6
  stem: 根據文章的內容，下列何者說明正確？
  options:
  - label: A
    content: 查爾斯．莫耳所發現的「新大陸」，是因為自然界的力量而形成的
  - label: B
    content: 他形容自己就像是航行在一大碗五顏六色的「濃湯」裡面─「濃湯」是指海洋被廢油汙染
  - label: C
    content: 新大陸形成之後，大量的海洋生物因為缺乏食物而死亡，影響海洋生態甚鉅
  - label: D
    content: 第三段提出統計數字，最主要的目的是說明塑膠新大陸能快速擴張的原因
  group_stem: "自從海洋科學研究員查爾斯．莫耳 (Charles Moore)在一九九七年乘船行經北太平洋環流後，各國媒體便紛紛報導一則驚人的新聞：二十一世紀的太平洋上，出現了第八大陸，面積有美國德州的兩倍，或稱有英國的二十倍、香港的一千倍大──然而，這片「新大陸」的形成，卻不是因為自然界的力量。\
    \  \n    那一天，查爾斯船長駕船經過北太平洋環流的無風帶，這是一片乏人問津的海域，因為缺少風力與海洋資源，幾乎沒有漁船會經過。沒想到，查爾斯船長卻因而目睹了驚悚的畫面：本該湛藍的海面上，竟然出現了一望無際的新大陸──由塑膠廢料組合而成的新大陸。「我放眼望去，全是塑膠廢料！」查爾斯船長這麼說。他形容自己就像是航行在一大碗五顏六色的「濃湯」裡面，只是這碗特大號的濃湯，是由廢棄的塑膠袋、保特瓶、瓶蓋、塑膠衣架、車輪……所組而成，無邊無際，船員們花了一週的時間才得以駛離塑膠海的範圍。這一大片塑膠濃湯，由於隨著海水飄浮，面積難以確切計算，但有科學家粗估至少超過一百萬平方公里，因而被媒體形容為就像是一片新的大陸，一片人造的污染物大陸。大量的海洋生物將這些塑膠碎片誤吞下肚，因為無法消化而死亡，影響海洋生態甚鉅。\
    \ \n    根據研究統計，塑膠在自然環境中分解的時間，要花上二十年至一千年。全世界每年使用至少一兆個塑膠袋，而每個塑膠袋被拿來使用的時間，平均不到二十分鐘。想想看，當我們從商店購物後，提著塑膠袋走回家，隨即把塑膠袋丟棄，這過程要花多少時間呢？難怪，太平洋上會形成這麼一座駭人聽聞的「塑膠新大陸」了。\
    \                                  〈查爾斯．莫耳的航海日記-第八大陸〉"
