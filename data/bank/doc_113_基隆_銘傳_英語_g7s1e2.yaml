  - label: B
    content: To help the teacher.
  - label: C
    content: To make the teacher happy.
  - label: D
    content: To help everyone can talk fairly.
  group_stem: '(2)

    SCHOOL RULES


    Our school rules help everyone be safe and happy. Please follow them every day!

    1. Be nice to your teachers and classmates.

    2. In the classroom, raise your hand before you talk, and everyone can take turns
    to talk.

    3. Don''t run in the hallways. Running there is not safe.

    4. Play fairly and take turns with your friends.

    5. Help keep our school clean. Trash goes in the trash cans and keep your desk
    clean, too.

    We can make our school a great school for studying and fun!


