  section: 6
  number: 43
  type: single
  page: 4
  stem: 43. (  ) What do players do every day to win at their sport?
  options:
  - label: A
    content: They rest all day.
  - label: B
    content: They run, lift weights, and practice.
  - label: C
    content: They only eat healthy food.
  - label: D
    content: They watch videos all day.
  group_stem: 'Sports Training

    Sports training helps players win more games or races. Coaches, like teachers
    for players, make plans to help them get strong and fast. Players run, lift weights,
    and practice every day. They also make sure to rest. A long time ago, training
    was easy. Players did few exercises and used their talent. Coaches told them to
    practice the same things over and over. Today, training is different. Players
    exercise, eat healthy food, and focus on their skills. Technology, for example,
    a camera, helps track how fast players run and how they move. They watch every
    body part in the videos in the camera, talk with coaches and doctors, and look
    for ways to do better. Sports science also keeps players staying healthy and from
    getting hurt. Coaches make special plans to help them. Players may have different
    trainings over time, but one thing is the same: players need to work hard. Both
    in 1960 and 2024, training hard was and is the only way for them to win in their
    sport.


     training 訓練 plan 計畫 lift weights 舉重 talent 天分 focus on 聚焦 skill 技巧 track 追蹤'
