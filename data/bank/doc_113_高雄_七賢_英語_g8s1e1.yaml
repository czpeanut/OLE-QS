- id: doc_113_高雄_七賢_英語_g8s1e1_s6_45
  section: 6
  number: 45
  type: single
  page: 4
  stem: 45. (  ) What made high inflation in Taiwan after World War II?
  options:
  - label: A
    content: The government helped people make money.
  - label: B
    content: People helped the country.
  - label: C
    content: The government printed too much money.
  - label: D
    content: People couldn’t buy food.
  group_stem: 'Inflation

    Money can never be enough for some people, but it is surely not enough for almost
    everyone when an inflation comes. Inflation happens when people need more money
    to buy the same things.

    In Taiwan, inflation changed from time to time because of different events. After
    World War II, Taiwan had very high inflation. This was because the government
    printed too much money to help the country. The money for buying food rose from
    $1 to $40000 in a short time, and people couldn’t live a good life. In the 1950s,
    the government started to control inflation by helping people make money. Because
    of that, Taiwan’s economy was not bad in the 1960s and 1970s.

    In 2021 and 2022, there was a small rise in inflation because of COVID-19. Buying
    things wasn’t easy at that time, so everything was expensive. Today, inflation
    in Taiwan is still rising. Next time when you buy the same things, watch how much
    money you use and how much it was before. Then you can feel the power of inflation.


     event 事件 government 政府 printed 印鈔 control 控制 economy 經濟'
