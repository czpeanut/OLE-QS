  stem: 豌豆的花色由一對等位基因所控制，紫花為顯性（R），白花為隱性（r）。以一紫花植株與一白花植株雜交，產生的第一子代為302 棵紫花植株和298 棵白花植株，在不考慮突變的情況下，下列敘述何者最合理？
  options:
  - label: A
    content: 親代的基因型皆為Rr
  - label: B
    content: 其中一個親代的基因型為RR
  - label: C
    content: 若親代紫花植株和第一子代紫花植株雜交，表現型不可能產生白花植株。
  - label: D
    content: 若親代白花植株和第一子代紫花植株雜交，可能產生表現型白花植株
