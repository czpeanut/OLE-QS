- id: doc_111_彰化_埤頭_自然_g8s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: '新北市瑞芳區的黃金博物館展出黃鐵礦和黃金兩種礦物，教導民眾分辨愚人金和黃金兩者的差別。帶有黃金色的金屬光澤，很容易使人誤認為黃金，故有「愚人金」之稱。黃鐵礦是提取硫和製備硫酸的主要礦物原料，其內的成分含有不少的鐵，但是煉鐵多採用赤鐵礦為原料，因為黃鐵礦在燃燒時，會產生大量的二氧化硫氣體，造成環境污染，其反應方程式：

    $4FeS_{2} + xO_{2} \rightarrow yFe_{2}O_{3} + 8SO_{2}$（$x$、$y$為平衡係數）

    根據本文，若以黃鐵礦為原料替代赤鐵礦進行煉鐵，過程中黃鐵礦燃燒所產生的氣體，可能使得近地區的下列何種現象更為嚴重？'
  options:
  - label: A
    content: 酸雨
  - label: B
    content: 聖嬰現象
  - label: C
    content: 溫室效應
  - label: D
    content: 臭氧層破壞
