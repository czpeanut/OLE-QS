- id: doc_113_高雄_楠梓_社會_歷史_g9s1e3_s1_30
  section: 1
  number: 30
  type: single
  page: 1
  stem: 十五世紀，歐洲人在很多因素促成之下，開始進行海外的探險活動，這樣的活動對於東西文化的交流、相互認識有著深刻的影響。然而，下列關於歐洲人於十五世紀開始進行海外探險的敘述中，何者錯誤？
  options:
  - label: A
    content: 西班牙人為當時歐洲國家中第一個向外進行海外擴張的國家
  - label: B
    content: 十五世紀以來歐洲經濟持續升溫，對於東方奢侈品需求增加，進而推動海外探險
  - label: C
    content: 除了經濟因素促使歐洲人進行海外探險活動，十五世紀歐洲航海技術進步，亦成為歐洲人進行海外探險的動力
  - label: D
    content: 十五世紀開始的海外探險，最終讓歐洲人找到通往亞洲的航道。
