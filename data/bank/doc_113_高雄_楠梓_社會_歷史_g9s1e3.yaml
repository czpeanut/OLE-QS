  type: single
  page: 1
  stem: 十九世紀歐洲詩人白朗寧曾寫過一首詩：「我們很衰弱，不能跑或跳，我們整天拖著重擔，通過黑暗的煤礦地下道，或整天駕著鐵輪，在工廠裡團團繞。」關於此詩的出現，是在下列哪一背景之下所產生？
  options:
  - label: A
    content: 描述大航海時代，探險家在中南美洲的遭遇
  - label: B
    content: 工業革命後資本家雇用童工，壓榨工人勞力的景況
  - label: C
    content: 科學革命後，科學家不斷地實驗新機器鐵輪
  - label: D
    content: 控訴大航海時代，非洲黑人被賣到南美洲當奴隸。
