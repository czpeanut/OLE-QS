  section: 1
  number: 28
  type: single
  page: 1
  stem: 承前題，因為庫克首先發現澳洲，該國也開始殖民統治澳洲。關於澳洲的殖民統治，下列敘述何者正確？
  options:
  - label: A
    content: 澳洲原住民以狩獵、採集為生，皆屬於南島語族
  - label: B
    content: 殖民母國曾流放大批的罪犯到澳洲開墾
  - label: C
    content: 十九世紀時澳洲發現白銀後，吸引更多的移民者來澳洲
  - label: D
    content: 殖民統治澳洲的是法國。
