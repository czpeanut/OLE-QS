- id: doc_113_高雄_楠梓_社會_歷史_g9s1e3_s1_29
  section: 1
  number: 29
  type: single
  page: 1
  stem: 西元1492 年歐洲人航行到中南美洲後，使中南美洲與歐洲產生物種、文化、傳染病的連結及物種大交換，近乎今日的全球化。請問這次的全球物種大交換的敘述，下列敘述何者正確？
  options:
  - label: A
    content: 美洲的玉米、番薯、馬鈴薯成為世界各地重要的食物
  - label: B
    content: 美洲原住民因為沒有梅毒抗體，很多人喪生於傳染病
  - label: C
    content: 歐洲人為開發殖民地，從亞洲捕捉大量的黃種人，運到美洲從事奴工
  - label: D
    content: 歐洲商人以黃金購買絲綢、瓷器等商品，使黃金透過國際貿易流入中國。
