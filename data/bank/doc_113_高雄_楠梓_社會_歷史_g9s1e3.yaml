  type: single
  page: 1
  stem: 小琪在筆記中抄了一段啟蒙思想家的主張，他說：「人是生而自由的，但卻無時不在枷鎖之中，政治權威在自然狀態中並不存在，所以我們需要一個社會契約。在社會契約中，每個人都放棄天然自由，而獲取契約自由。」請問：這段言論可能是下列何人的主張？
  options:
