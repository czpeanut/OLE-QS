  section: 1
  number: 33
  type: single
  page: 2
  stem: 一位學者的研究報告如下：「此波疾病幾乎侵襲了所有部落，數十年之間有一半以上的村民死於新的疾病。原來城裡的人染上天花，屍橫遍野。繼天花之後，又有麻疹、傷寒、流感，以及腮腺炎、肺炎等歐洲傳染病大流行。原本已經被天花嚴重耗損的人口，再受到這些疾病窮追猛打，對此地人口造成毀滅性打擊。十六世紀前期，從兩千五百萬人，到了十六世紀中葉，剩下六百萬人。」根據此報告內容，學者所述是何事件？
  options:
  - label: A
    content: 蒙古西征將亞洲疾病帶到歐洲各地
  - label: B
    content: 信仰不同引發的宗教戰爭造成疾病的傳播
  - label: C
    content: 美洲的原住民幾乎死於歐洲的鐵製刀槍武器下
  - label: D
    content: 西班牙將各種細菌和病毒帶入美洲。
