  section: 1
  number: 27
  type: single
  page: 1
  stem: 歐洲某國皇家海軍上校詹姆士‧庫克，曾經三度奉命出海前往太平洋，雖未找到傳說中「未知的南方大陸」，但他帶領的船員成為首批登陸澳洲東岸和夏威夷群島的歐洲人，也創下歐洲船隻首次環繞紐西蘭航行的紀錄。以往長時間的航海中，水手容易身患壞血病而身亡，但庫克船長在第一次的探索旅程中，無一人因為壞血病而喪命。這是因為庫克在旅途中給船員提供充足的新鮮食物，尤其是青檸等含豐富維生素C
    的蔬果。庫克當時先從個別船員觀察實驗狀況，之後推廣到全體船員，並且將實驗結果回報給皇家學會做大規模的推廣。請問：根據上文，庫克這種使用全面觀察進而提出結論的方法，是由下列哪一位學者提出的？
  options:
  - label: A
    content: 笛卡兒—歸納法
  - label: B
    content: 培根—演繹法
  - label: C
    content: 培根—歸納法
  - label: D
    content: 笛卡兒—演繹法 。
