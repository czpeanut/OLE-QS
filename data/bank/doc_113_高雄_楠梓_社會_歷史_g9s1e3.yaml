  stem: '西元1776 年美國的《獨立宣言》中提到：「我們認為下面這些真理是不言而喻的 : 人人生而平等，造物者賦予他們若干不可剝奪的權利，其中包括生命權、自由權和追求幸福的權利。為了保障這些權利，人類才在他們之間建立政府，……」請問：《獨立宣言》中這些觀念可能是引用下列何人的學說？'
