- id: doc_113_高雄_楠梓_社會_歷史_g9s1e3_s1_37
  section: 1
  number: 37
  type: single
  page: 2
  stem: "請閱讀資料，回答下列問題。\n        印度在十世紀前後，大小王國林立。到了西元1526 年，蒙古人的後裔巴布爾以12,000 人的部隊南下，攻進德里；在大清真寺裡加冕為「印度斯坦皇帝」，仍以德里為首都，開創了蒙兀兒王朝。\n\
    \        賈吉汗和沙賈汗時代，蒙兀兒王朝國勢日盛，每年從國外進口奇珍異寶，只供玩賞。沙賈汗大興土木，建造花園、城堡、宮殿和清真寺，並傾全國之力，為亡妻打造舉世聞名的「泰姬瑪哈陵」。他好大喜功的奢糜作風，也為帝國解體種下惡果。\n\
    \        西元1764 年，蒙兀兒皇帝沙阿拉姆二世投降★，淪為殖民者的附庸，苟延殘喘到西元1858 年正式被★併吞，西元1859 年末代皇帝被流放緬甸，客死異鄉。\n\
    文中提到「蒙兀兒皇帝沙阿拉姆二世投降★，淪為殖民者的附庸」，其中的「★」是哪一個國家？"
