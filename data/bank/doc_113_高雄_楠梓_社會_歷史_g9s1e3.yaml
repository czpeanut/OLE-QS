  section: 1
  number: 31
  type: single
  page: 1
  stem: 工業革命是影響近代世界相當重要的里程碑，新技術的研發，雖然為人類社會帶來諸多便利與進步，但也產生不少負面效應。請問：下列何者是工業革命產生的不良發展？
  options:
  - label: A
    content: 城市聚集大量人口，產生嚴重的都市問題
  - label: B
    content: 因為產品生產過快，導致海外殖民地市場萎縮
  - label: C
    content: 社會主義思想的出現，讓貧窮工人受到剝削
  - label: D
    content: 機器生產對資本家傷害甚大，導致工廠紛紛倒閉。
