    Facebook、Instagram、Threads 等平台有很多追隨者的網紅。

    知名的網紅「統神」張嘉航因為直播討論黃子佼事件而引發爭議，不只網友撻伐聲連連，各家廠商也紛紛大動作切割，沒想到統神並沒有因此悔改，還憤而發文「台灣真是可悲」，表示民眾不去關注更重要的事件，反而在網路上「一條龍式抹黑我」，只見風波越演越烈，最後
    YT 頻道還被官方移除。

    各類社群媒體平台在出現受害者或是波及無辜第三人時，常會藉稱沒有辦法禁止使用者發佈內容。但為什麼會有某社群媒體的用戶因違反社群守則而被刪除文章呢？網路社群媒體的出現，讓過往「影響力」並不大的不當行為或惡作劇提升到難以想像的地步。除了社群媒體應承擔社會責任外，身為使用者的閱聽人，也需具備思辨能力才行。
