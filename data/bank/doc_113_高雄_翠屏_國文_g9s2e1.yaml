- id: doc_113_高雄_翠屏_國文_g9s2e1_s2_41
  section: 2
  number: 41
  type: single
  page: 5
  stem: 作者認為更適合遊覽西湖的時間，不包括下列哪一項？
  options:
  - label: A
    content: 月夜時分
  - label: B
    content: 朝日始出
  - label: C
    content: 夕舂未下
  - label: D
    content: 日正當中。
  group_stem: '(三) 晚遊六橋待月記   袁宏道

    西湖最盛，為春為月。一日之盛，為朝煙，為夕嵐。

    今歲春雪甚盛，梅花為寒所勒，與杏桃相次開發，尤為奇觀。石篑數為余言：「傅金吾園中梅，張功甫玉照堂故物也，急往觀之。」余時為桃花所戀，竟不忍去湖上。

    由斷橋至蘇隄一帶，綠煙紅霧，瀰漫二十餘里。歌吹為風，粉汗為雨，羅紈之盛，多於隄畔之草。豔冶極矣！

    然杭人遊湖，止午、未、申三時；其實湖光染翠之工，山嵐設色之妙，皆在朝日始出，夕舂未下，始極其濃媚。月景尤不可言。花態柳情，山容水意，別是一種趣味。此樂留與山僧遊客受用，安可為俗士道哉！

    注：夕舂未下：指傍晚。夕舂，指夕陽，古人於日落時舂米，故稱。'
