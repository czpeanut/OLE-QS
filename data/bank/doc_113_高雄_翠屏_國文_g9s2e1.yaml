- id: doc_113_高雄_翠屏_國文_g9s2e1_s2_38
  section: 2
  number: 38
  type: single
  page: 5
  stem: 關於本文的文意說明，下列選項何者正確？
  options:
  - label: A
    content: 秋天的雨使建築腐蝕加速
  - label: B
    content: 老屋久無人居而蛛絲滿纏
  - label: C
    content: 秋天的雨為世界帶來生機
  - label: D
    content: 秋天的雨中即景更加蕭索。
  group_stem: "(二) 秋雨   張愛玲(改寫)\n  雨，像銀灰色粘溼的蛛絲，織成一片輕柔的網，網住了整個秋的世界。天也是暗沉沉的，像古老的住宅裡纏滿著蛛絲網的屋頂。那堆在天上的灰白色的雲片，就像屋頂上剝落的白粉。在這古舊的屋頂的籠罩下，一切都是異常的沉悶。草色已經轉入憂鬱的蒼黃，地下找不出一點新鮮的花朵；宿舍牆外一帶種的嬌嫩的洋水仙，垂了頭，含著滿眼的淚珠，在那裡嘆息它們的薄命，才過了兩天的晴美的好日子又遇到這樣霉氣薰蒸的雨天。\n\
    \  雨靜悄悄地下著，只有一點細細的淅瀝瀝的聲音。桔紅色的房屋，像披著鮮豔的袈裟的老僧，垂頭合目，受著雨的洗禮。那潮溼的紅磚，發出有刺激性的豬血的顏色和牆下綠油油的桂葉成為強烈的對照。灰色的癩蛤蟆，在溼爛發霉的泥地裡跳躍著；在秋雨的沉悶的網底，只有牠是唯一的充滿愉快的生氣的東西。牠背上灰黃斑駁的花紋，跟沉悶的天空遙遙相應，造成和諧的色調。牠撲通撲通的跳著，從草窠裡，跳到泥裡，濺出深綠的水花。"
