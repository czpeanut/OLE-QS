  group_stem: "(一) 故宮博物院「鎮院國寶」展覽概述\n  范寬（約950-1032 年）谿山行旅、郭熙（約1023-1087 年）早春圖、李唐（約1049-1130年）萬壑松風素有故宮「鎮院三寶」之譽，2012\
    \ 年由文化部核定公告為國寶級古物。這三件巨幅立軸，分別代表了北宋「巨碑式」山水畫的典範，雖非全然模仿真境，卻是通過對自然的靜觀與體悟，重新組織而成的理想山水典型。據畫上紀年推算，時代最近的萬壑松風，距今已經897年。因成畫年代久遠且畫作的絹本質材脆弱，為保護珍貴古物，減少被光線照射的時間，每次展覽至少須間隔三年以上，且展期不超過42\
    \ 天。2021 年故宮特別規劃推出「鎮院國寶」展覽，距離前次三寶合體展出已相隔十年。"
