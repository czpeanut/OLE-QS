  group_stem: "(四) 竇娥冤（節錄）  關漢卿\n  （卜兒蔡婆上，詩云）花有重開日，人無再少年。不須長富貴，安樂是神仙。老身蔡婆婆是也。楚州人氏，嫡親三口兒家屬。不幸夫主亡逝已過，止有一個孩兒，年長八歲。俺娘兒兩個，過其日月。家中頗有些錢財。這裡一個竇秀才，從去年問我借了二十兩銀子，如今本利該銀四十兩。我數次索取，那竇秀才只說貧難，沒得還我。他有一個女兒，今年七歲，生得可喜，長得可愛。我有心看上他，與我家做個媳婦，就准了這四十兩銀子，豈不兩得其便！他說今日好日辰，親送女兒到我家來。老身且不索錢去，專在家中等候。這早晚竇秀才敢待來也。"
