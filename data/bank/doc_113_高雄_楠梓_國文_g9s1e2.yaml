- id: doc_113_高雄_楠梓_國文_g9s1e2_s2_26
  section: 2
  number: 26
  type: single
  page: 5
  stem: 根據上文，《獵人》支持者憤怒炎上的原因最可能是下列何者？
  options:
  - label: A
    content: 支持者覺得麥當勞產品配不上《獵人》
  - label: B
    content: 整套豪華公關品網紅可以免費拿到
  - label: C
    content: 將《獵人》的動漫定義為卡通讓支持者覺得被輕視
  - label: D
    content: 《獵人》連載不定期且結局遙遙無期
  group_stem: '速食業者麥當勞聯名《HUNTER×HUNTER 獵人》，送了許多網紅整套豪華公關品，有不熟《獵人》的網紅將《獵人》的動漫說成「卡通」，引起支持者憤怒炎上。

    動漫、動畫、卡通是一樣的東西嗎？

    動畫是一種以技術透過一系列靜止圖像以一定速度連續播放，創造出一定的視覺效果。這種技術可以應用於多種風格的作品，從3D 動畫到手繪動畫，甚至包括電腦生成的視覺效果。

    動漫是「動畫漫畫」的簡稱，是華語圈才會使用的詞彙。不過，動漫絕對不是單指動起來的漫畫這麼簡單，它的來源還有輕小說、遊戲、原創。在日本，這條產業鏈相當發達，所以動畫+漫畫+遊戲又合稱ACG（Anime、Comic、Game）。動漫的內容範圍非常廣泛，可以表達各種情感和故事主題，同時也注重技術和故事深度，適合各年齡層觀看。

    動漫和卡通在概念上有一些不同。卡通指的是以非寫實風格、誇張幽默的圖畫製作成動畫影片，卡通作品的特點在於簡單的線條、鮮明的色彩和搞笑的角色設計。這類作品通常針對年幼觀眾，劇情大多淺顯易懂，劇情多以獨立短集的形式存在。而動漫更注重技術和動態呈現的方式。

    總結來說，動漫與卡通的區分標準因人而異，從畫風、年齡層、地域風格到劇情連載性，都可能成為不同的判斷依據。(引自風傳媒〈動漫、動畫、卡通是一樣的東西嗎？為何社群上會吵翻天？如何分辨一次看〉'
