    content: 以第一人稱視角寫公主和親之傷懷
  - label: B
    content: 詩中描寫公主想念故鄉食肉飲酪的生活
  - label: C
    content: 烏孫王因深愛公主，不忍公主傷心所以送她回故鄉
  - label: D
    content: 是一首七言律詩，韻腳為「方、王、牆、漿、傷、鄉」
  group_stem: '甲.悲秋歌 漢・劉細君

    吾家註嫁我兮天一方，遠託異國兮烏孫王。(註:劉細君是漢武帝的侄孫女，是具有皇家血統的宗室之女)

    穹廬爲室兮氈爲牆，以肉爲食兮酪爲漿。

    居常土思兮心內傷，願爲黃鵠兮歸故鄉。


    乙.改寫自《新唐書‧吐蕃傳》

    太宗 貞觀八年，吐蕃君長弄贊聞突厥、吐谷渾並得尚①公主，乃遣使求婚。貞觀十五年，太宗妻以江夏王之女文成公主，詔江夏王 道宗持節護送，築館於河源。吐蕃王 弄贊率兵至青海親迎，見道宗，執婿禮恭甚，見中國服飾之美，縮縮愧沮②。歸國，自以其先未有婚帝女者，乃為公主築一城以誇後世，遂立宮室以居。公主惡國人赭面③，弄贊下令國中禁之。自褫氈罽④，襲紈綃，為華風。遣諸豪子弟入國學，習《詩》、《書》，又請儒者典書疏。

    注釋

    ①尚：仰攀婚姻

    ②縮縮愧沮：羞愧瑟縮、自認不及

    ③赭面：音ㄓㄜˇ ㄇㄧㄢˋ，把臉塗成赤褐色。

    ④罽:音ㄐㄧˋ，毛織品。'
