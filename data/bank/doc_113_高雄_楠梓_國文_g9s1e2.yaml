- id: doc_113_高雄_楠梓_國文_g9s1e2_s2_32
  section: 2
  number: 32
  type: single
  page: 6
  stem: 文末寫道：「舟子喃喃曰：『莫說相公痴，更有痴似相公者。』」這裡的「痴」字含義與下列何者最為接近？
  options:
  - label: A
    content: 沉醉欲眠花月下，只愁花月笑人痴
  - label: B
    content: 愚公移山寧不智，精衛填海未必痴
  - label: C
    content: 歡樂趣，離別苦，就中更有痴兒女
  - label: D
    content: 竹嶼烟深尋得巧，茅簷月淡立成痴
  group_stem: '湖心亭看雪

    張 岱

    崇禎五年①十二月，余住西湖。大雪三日，湖中人鳥聲俱絕。

    是日，更定②矣，余拏③一小舟，擁毳衣④、爐火，獨往湖心亭看雪。霧松⑤沆碭⑥，天與雲、與山、與水，上下一白。湖上影子，惟長堤一痕、湖心亭一點，與余舟一芥介⑦、舟中人兩三粒而已。

    到亭上，有兩人鋪氈⑧對坐，一童子燒酒，爐正沸。見余大喜，曰：「湖中焉得更有此人！」拉余同飲，余強飲三大白⑨而別。問其姓氏，是金陵人客此⑩。及下船，舟子⑪喃喃曰：「莫說相公⑫痴，更有痴似相公者。」（節錄自陶庵夢憶）

    注釋

    ①崇禎五年：西元一六三二年。崇禎，明思宗的年號。

    ②更定：已經是初更了，指晚上七點至九點。

    ③拏：牽引，此指乘坐。

    ④毳衣：細毛大衣。毳，鳥獸的細毛。

    ⑤霧凇：霧氣因天寒而結成的白色結晶。

    ⑥沆碭：白茫茫的樣子。

    ⑦一芥：在此形容船像小草般微小。芥，小草。

    ⑧氈：毛毯。

    ⑨三大白：三大杯。白，指酒杯。

    ⑩客此：到這裡作客。

    ⑪舟子：船夫。

    ⑫相公：舊時對讀書人的敬稱。'
