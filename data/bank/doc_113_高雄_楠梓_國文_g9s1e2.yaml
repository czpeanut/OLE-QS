  stem: 在〈活著，只為病人而生的醫師─范鳳龍〉一文中，下列文句何者最無法幫助讀者理解范鳳龍醫師的性格特質？
  options:
  - label: A
    content: 范鳳龍在聖母醫院的第一臺刀，是為一位婦女取出重達十二公斤的巨型子宮肌瘤，人們都知道，這間「阿督仔病院」的外國醫生醫術精湛。
  - label: B
    content: 范鳳龍直到去世前一個月，仍然半夜起來為病人開急診刀。在強忍病痛開完最後一臺刀後，他向神父道歉自己再也沒辦法幫助病人了！
  - label: C
    content: 范鳳龍過世多年以後，他的墳前仍常會看到花束，還有人來這裡刷洗他墓碑上的青苔，大家都懷念與感謝他對臺灣的無私付出。
  - label: D
    content: 范鳳龍一生不追求名與利，他曾說：「病人們微笑著離開醫院，才是我最大的獎章和安慰。」
