  stem: 根據文章，下列關於燉飯製作的敘述何者正確？
  options:
  - label: A
    content: 傳統與創新作法最大的差異在於是否使用帕瑪森起士
  - label: B
    content: 創新作法省略了梅納反應的步驟以提升效率
  - label: C
    content: 傳統作法透過反覆加入高湯來控制澱粉濃度
  - label: D
    content: 米粒外層的油脂阻絕層會加速內部糊化過程
  group_stem: '《黑白大廚》的爆紅，讓許多人開始重新接觸或是認識不同經典料理。若要票選前三名經典的料理，我想拿坡里黑手黨的拋燉飯絕對能排上前三。燉飯這料理很有趣。在餐廳裡，我們經常這樣去煮燉飯:

    煮到七分熟後趕緊拿出來在鐵盤上鋪平，接著送進急速冷卻的機器裡冷卻至攝氏4 度，如此一來便可維持米粒在七分熟的狀態，出餐時只需要拿出來放進鍋子裡，與高湯再煮個幾分鐘，即可與奶油以及帕瑪森起士進行乳化反應，加點料與醬汁即可出餐。

    一直以來，煮燉飯給人一種得不斷照料與翻攪的刻板印象，我也是如此操作。直到我在英國時，親眼見到餐廳的老闆Raymond Blanc 煮燉飯。他的做法跟我很像，不過在炒香燉飯米時花了更多時間，接著最後在加高湯時，他不是一次一次慢慢加，而是一次加很多，而且還加上鍋蓋去悶煮。老闆跟我解釋後，我才明白:煮飯，就是一連串的化學反應。

    燉飯的烹煮過程，大致上可分成三個階段

    ❶梅納反應：一開始用橄欖油炒香米粒時，高溫與米粒本身的蛋白質與糖發生反應，激發出更多香氣與風味，並且讓米粒上了一層保護外殼

    ❷澱粉糊化反應：接著加入白酒與高湯等液體時，就是米粒開始進行糊化反應的時候了，不過稍早用油炒米的過程，就是先將米粒外層用油沾染上，並且煮熟一小部分，形成阻絕層，如此一來米粒在液體中烹煮時，外部維持住口感，而內部先行糊化，就能擁有好吃的顆粒分明燉飯米。

    ❸乳化反應：等到米粒吸收液體也順利糊化後，釋出的澱粉與水分，就可以與額外添加的奶油與起士進行乳化反應，讓燉飯呈現出滑順的質地與口感

    法國餐廳老闆的偷吃步，其實是個很有趣的烹飪理解。在煮燉飯時，他選了個相當寬大且相對淺的鍋子，這樣的鍋子底部接觸火源的面積很大，能讓大量的米飯在寬大的面積裡相對均勻分開，所以一次加入大量高湯去煮，能夠讓米粒在一個不過分重疊的情況下進行糊化反應。蓋上鍋蓋則是可以增加熱對流，沒蓋蓋子的烹飪方式，其實熱的都只是鍋底而已。澱粉糊化時溫度若是不穩定，會造成米粒不完全糊化。照老闆這種煮法，你只要攪拌最後一兩分鐘即可，澱粉在足量的液體裡，糊化後釋出的時間點也是一致的，此時你再稍稍提高火力，將多餘的水分揮發即可。

    (節選自廚師漢克 - Hank Cheng 臉書貼文)'
