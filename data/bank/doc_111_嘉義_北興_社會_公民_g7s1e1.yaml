  stem: '佩庭參加一項活動，聽到主持人作了以下致詞，根據內容判斷，下列敘述何者正確？

    4 月 30 日是國際不打小孩日，希望能以正面教育方式，取代對小孩的體罰。近幾年來，臺灣社會經常出現虐童、不當管教的新聞案件，有許多孩童在學校或家庭受到身心傷害，他們的權益應該獲得保障。全球不打小孩日雖然只有一天，但每一天都不體罰小孩，讓他們快樂健康長大，才是此國際活動的宗旨'
  options:
  - label: A
    content: 不打不成器，教育必須從小開始
  - label: B
    content: 為維護學校秩序，必須進行體罰
  - label: C
    content: 即使是兒童，也應享有人權保障
  - label: D
    content: 身為父母，可採用任何方式管教。
