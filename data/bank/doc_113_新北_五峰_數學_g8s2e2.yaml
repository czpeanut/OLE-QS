- id: doc_113_新北_五峰_數學_g8s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: '如圖銳角 $\triangle ABC$ 中，$\overline{BC}>\overline{AB}>\overline{AC}$，若欲找一點
    P，使得 $\angle BPC$ 與 $\angle A$ 互補，下列是小五及小峰、小中作法，何者正確?

    小五作法:

    作 $\angle C$ 的角平分線交 $\overline{AB}$ 於 P 點，則 P 即為所求

    小峰作法:

    以 C 為圓心，$\overline{AC}$ 長為半徑畫弧交 $\overline{AB}$ 於 P 點，則 P 即為所求。

    小中作法:

    作過 B 點且與 $\overline{AB}$ 垂直的直線 L，作過 C 點且與 $\overline{AC}$ 垂直的直線並交 L 於 P 點，則 P
    即為所求

    判斷下列敘述何者正確？'
  options:
  - label: A
    content: 三人作法皆正確
  - label: B
    content: 三人作法皆錯誤
  - label: C
    content: 有二個人作法正確，一個人作法錯誤
  - label: D
    content: 有一個人作法正確，二個人作法錯誤
  assets:
  - key: s1_8_f1
    kind: figure
    file: doc_113_新北_五峰_數學_g8s2e2/s1_8_f1.png
