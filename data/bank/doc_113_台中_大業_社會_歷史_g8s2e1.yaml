  stem: 請問「四年以前，由專制一變而為共和」是因為哪一場事件？
  options:
  - label: A
    content: 立憲運動
  - label: B
    content: 二次革命
  - label: C
    content: 保路運動
  - label: D
    content: 辛亥革命。
  group_stem: '……中國數千年以來，習於君主專制體制，各地學校短缺，大多數人民智識不甚高尚，人民更缺乏參與政治之能力，四年以前，由專制一變而為共和，此番變動太快，難望有良好結果者也……中國將來必因總統繼承問題「釀成禍亂」……如一時不立即撲滅禍亂，可能導致敗壞中國之獨立……中國如用君主制，較共和制為宜，此殆無可疑者也。

    （節錄自，古德諾，〈共和與君主論〉，西元1915 年。）'
