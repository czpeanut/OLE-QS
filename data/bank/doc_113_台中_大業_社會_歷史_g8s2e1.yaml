- id: doc_113_台中_大業_社會_歷史_g8s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 由作者使用的文體來看，他應該是響應當時的何種變革？
  options:
  - label: A
    content: 立憲運動
  - label: B
    content: 戊戌變法
  - label: C
    content: 新文化運動
  - label: D
    content: 庚子後新政。
  group_stem: "「喂！一手交錢，一手交貨！」一個渾身黑色的人，站在老栓面前，眼光正像兩把刀，刺得老栓縮小了一半。那人一隻大手，向他攤著；一隻手卻撮著一個鮮紅的饅頭，那紅的還是一點一點的往下滴。\n\
    \    老栓慌忙摸出洋錢，抖抖的想交給他，卻又不敢去接他的東西。那人便焦急起來，嚷道：「怕什麼？怎的不拿！」老栓還躊躇著；黑的人便搶過燈籠，一把扯下紙罩，裹了饅頭，塞與老栓；一手抓過洋錢，捏一捏，轉身去了。嘴裡哼著說，「這老東西……。」\n\
    \   「這給誰治病的呀？」老栓也似乎聽得有人問他，但他並不答應；他的精神，現在只在一個包上，彷彿抱著一個十世單傳的嬰兒，別的事情，都已置之度外了。他現在要將這包裡的新的生命，移植到他家裡，收穫許多幸福。\n\
    \                             （節錄自，魯迅〈藥〉。）"
