  group_stem: '戰爭結束前，美國總統威爾遜提出「十四點原則」，試圖建構戰後新秩序，各國國際地位平等，自由、人權和公義的價值將取代暴力和權謀。中國人原本期望歐美列強會幫助中國從日本人手中取回□□，但巴黎和會傳來的消息卻是將中國□□權益讓與日本，此舉使得中國知識分子大失所望，抨擊巴黎和會提出的理想，僅是帝國主義迷惑世人的幌子。

    俄國為取得中國的好感，發表「對華宣言」，宣布無條件廢止俄羅斯帝國時期從清朝搶來的一切權益，各地的報刊在獲知這項消息後，譽之為「世界人類從來未有之義舉」，列寧於是成了公理與正義的化身，知識分子對馬克思主義更是趨之若鶩。吳廷康（Gregory
    Voitinsky）在此背景下來到中國，會見具有聲望的馬克思主義信徒—○○○，開啟了共產黨在中國的發展之路。'
