    content: 外國人的遣詞用字值得中國人學習。
  group_stem: 清末民初，中國開始引進外國兒童讀物，但當時處在傳統向現代的過渡階段，翻譯家大多還是沿用文言文，並根據成年人的立場，隨意增刪改寫。而且在he
