- id: doc_113_台中_大業_社會_歷史_g8s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 請問這篇文章應該刊登在下列何者？
  options:
  - label: A
    content: 時事畫報
  - label: B
    content: 新民叢報
  - label: C
    content: 新青年
  - label: D
    content: 萬國公報。
  group_stem: '本誌經過三年，發行已滿三十册；所說的都是極平常的话，社會上卻大驚小怪，八面非難，……他們所非難本誌的，無非是破壞孔教，破壞禮法，破壞國粹，破壞貞節，破壞舊倫理（忠孝節），破壞舊藝術（中國戲），破壞舊宗教（鬼神），破壞舊文學，破壞舊政治（特權人治），這幾條罪案。……只因擁護那德莫克拉西（Democracy）和賽因斯（Science）兩位先生，才犯了這幾條滔天的大罪。

    （節錄自，○○，〈本誌罪案之答辯書〉，西元1919 年。）'
