- id: doc_113_台中_大業_社會_歷史_g8s2e1_s2_23
  section: 2
  number: 23
  type: single
  page: 3
  stem: 短文中提及軍隊的「清鄉」，請問最主要是在哪個時期發生的？
  options:
  - label: A
    content: 辛亥革命爆發~清帝溥儀復辟
  - label: B
    content: 中華帝國成立~二次革命失敗
  - label: C
    content: 袁世凱死後~國民政府統一
  - label: D
    content: 南北政府分裂~洪憲帝制建立。
  group_stem: '文學作家沈從文生於清末民初動盪的年代，他曾經在軍閥裡當過兵，回憶少年從軍的經歷，他所屬的部隊經常用「清鄉」的名義，在不同的村鎮換防。軍隊曾經到了一個叫做榆樹灣的地方後，司令部馬上就大咧咧的駐紮在公廟裡，接著就不停地抓人。抓來後的百姓只要承認是壞人、肯寫保證書，並且答應繳出槍枝子彈，就能夠釋放。然而這些鄉下老實人哪有什麼罪、哪有槍彈。於是按照老規矩，換成現金，叫親友送來，清點無誤就放人。至於繳不出錢的人，就隨隨便便安排一樁罪名，等到某一天就牽出去砍頭。

    另外一位作家老舍從小在北京成長，在他的文學作品中，常能看到北京的市井小民是怎麼過生活，又怎麼被動盪的時代折磨。例如他曾塑造一位生活於民國初年，年輕力壯、老實木訥的角色，名叫祥子。祥子在北京街上租了人力車，當車伕攬客。他唯一的盼望是存夠了錢，給自己買一輛車子拉。可就在他買了一輛車後，人就莫名其妙被一隊士兵捉去當苦力，車子也被奪走了。一天晚上，祥子從軍營逃了出來，順手牽走三匹駱駝，慌慌張張地只賤賣了35
    元。他對自己偷走駱駝並不後悔，因為他的車子是被無理搶去的。'
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
