- id: doc_113_高雄_英明_自然_g9s2e2_s1_26
  section: 1
  number: 26
  type: single
  page: 3
  stem: '小萱想要探討二氧化碳氣體濃度是否會影響氣溫，因此以錐形瓶裝了不同濃度的氣體後，放置在大太陽下照射一段時間，實驗紀錄如附表所示。關於此實驗的解釋，下列敘述何者合理？

    | 裝置 | 觀測時間 | 5 分 | 10 分 | 15 分 |

    | --- | --- | --- | --- | --- |

    | 甲瓶 | 100%空氣 | 30.5℃ | 33.5℃ | 36.2℃ |

    | 乙瓶 | 50%空氣+50%二氧化碳 | 35.2℃ | 40.0℃ | 43.5℃ |

    | 丙瓶 | 100%二氧化碳 | 38.5℃ | 47.3℃ | 51.7℃ |'
  options:
  - label: A
    content: 根據探討目的，好的實驗假設應為「空氣含量越少，氣溫上升越多
  - label: B
    content: 從實驗紀錄可知，錐形瓶中的氣體溫度為操作變因
  - label: C
    content: 依實驗結果分析，可知各瓶中氣體溫度都會上升，但二氧化碳的濃度不影響氣溫上升趨勢
  - label: D
    content: 丙瓶的 100%二氧化碳，可使用鹽酸與大理石反應，並利用排水齊集氣法製備。
  tags:
