  stem: 根據文章敘述，龜背芋產業具有下列哪些特徵? (甲)有機農業 (乙)風險性高 (丙)休閒農業 (丁)生產成本低 (戊)精緻農業 (己)農業商品化。
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲乙戊
  - label: C
    content: 乙戊己
  - label: D
    content: 乙丙戊。
  group_stem: '饒紘任原是一名藥廠業務，但工作十多年的他，逐漸對應酬生活厭倦，決定回到屏東萬丹老家當青農，種植用於大型廟會花籃布置的龜背芋。但是，青農返鄉說來浪漫，沒有毅力卻只是空談。起初創業時，他的龜背芋田約六分大（約1700坪左右），光是架網室、租地、買種子，饒紘任就投資了180萬，除了靠自己的積蓄，更與親友借了不少錢。而龜背芋切葉價格起伏極大，淡季時一片價格僅1至3塊，但旺季時價格可飆到一片10元以上。

    2019年，饒紘任終於苦盡甘來，扣掉農藥、地租等約四成成本，一年營收可破百萬。但疫情一來，各地廟會停辦，饒紘任的切葉頓時滯銷，只得另謀出路。他觀察到，把龜背芋當盆栽種、當觀葉植物，已逐漸成為風潮，與其被動等產銷班統一收購，他決定主動行銷，因此在臉書開設「萬丹龜背芋NG品100元」社團，專賣龜背芋植株，讓台灣各地因疫情無法出門的民眾都能擁有一株龜背芋陪伴。原本一片切葉只能賣1~3元，饒紘任卻能以一株100元的售價，改賣約有三片葉子的植株，等於價格翻了五十倍，他的收入因此大增。他也提醒仍想入行的青農，真的能靠從事農業賺到大錢的人，往往是少數幾個能掌握栽種時間點、施肥技術的人，若只是投資，而沒有技術，最後很容易血本無歸。

    文章擷取自天下雜誌2021-12-30《飆漲50倍的奇蹟藥廠業務變青農，一季進帳百萬都靠龜背芋》，請回答第13~15題：'
