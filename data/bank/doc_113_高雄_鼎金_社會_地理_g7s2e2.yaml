  stem: 澎湖著名的產業景觀「石滬」，其樣貌如圖（二）。其中位於澎湖北方的吉貝嶼更是著名的石滬群場域，也是最天然的捕魚場，石滬分佈高居全縣之冠，更有「石滬的故鄉」美譽。澎湖石滬歷史悠久，早期先民智慧利用海水漲退潮及魚群洄游的特性，在潮間帶用硓𥑮石建造石滬捕魚，是最古老的捕魚工法。根據上述，石滬是屬於哪種漁業類型？
