  type: single
  page: 1
  stem: 鳳梨、洋菇、蘆筍這三種食材它們都是臺灣罐頭史上的明星，在「某個年代」以這三種罐頭為首的罐頭產業賺取大筆外匯，占外銷總額的12.3%，達到歷史高峰。臺灣罐頭工廠更帶動相關產業的發展，為了栽培罐頭原料，種苗、肥料、農藥等農務相關環節陸續到位；從家庭用手搖式封罐機，到因應不同罐頭品項發展出的各式機械，也成了促進臺灣工業發展的原因之一。上述中的「某個年代」最可能是下面哪個時間點？
