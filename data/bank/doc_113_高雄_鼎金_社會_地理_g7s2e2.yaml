    content: 資金。
  group_stem: 台積電於2024年2月24日正式啟用熊本廠，並開始量產。《彭博社》指出，一般一座晶圓廠需要費時3年才能完工，但在人生地不熟的日本，台積電卻以驚人的速度完工，原因在於日本政府的支持、24小時輪班建設的勞工及合作夥伴索尼（Sony）協助打點所造就。日本政府投資半導體的決心，便是首要原因。光是補助的果決方面，就可窺見一二，早在2022年6月日本政府就通過台積電熊本廠補助案，給予最高4,760億日圓（約新台幣1,014億元）的設廠補助，近日甚至傳出計畫為二廠提供7,300億日圓（約新台幣1,555億元）補貼。除了日本政府的補助與支持外，當地工人的努力、索尼的幫助也都功不可沒。索尼（Sony）是台積電多年的合作夥伴，也是熊本廠的出資方之一。請回答第19~20題：
