  stem: 隨著世代交替，時下年輕人最想從事的行業為「直播網路購物」，即所謂的「網紅」，網紅們利用網路直播，邀網友競標、線上喊價販售，花招百出、業績亮眼。關於這種商業型態的特色，下列敘述何者正確？
  options:
  - label: A
    content: 網紅的工作性質應歸屬於第二級產業
  - label: B
