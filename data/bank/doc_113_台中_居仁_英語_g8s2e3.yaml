  - label: D
    content: Her brother told her to dress that way.
  group_stem: '(45-47)

    Harnaam Kaur from the UK holds a special record. She became the world’s youngest
    woman with a full beard at 24 years and 282 days old. At 11, she noticed she had
    facial hair. Many people made fun of her, but she decided not to let it hurt her.
    She wants people to understand that it is natural for women to have facial and
    body hair.“Many people have the same health problem as me. Sometimes women have
    hair on their face, and that is OK,” she said.

    It’s normal for men to have facial hair, but when a woman has it, people think
    she is strange. “Why do I have to explain my body? Women’s bodies are judged too
    much. Never let others define you,” she said. Although Harnaam feels confident
    now, it was not always this way. She used to wear her brother’s clothes to hide
    that she was a woman.

    A big change happened when she traveled to New York City. She spoke at WorldPride
    NYC in front of thousands of people. “Hearing people cheer for me was amazing.
    I knew I could share my message with the world,” she said. Harnaam wants everyone
    to know they are not alone. “If people laugh at you or you feel bad about yourself,
    you are not alone,” she said. She helps people see the beauty in themselves.

     the UK 英國 facial 臉部的 normal 正常的 used to 過去時常'
