  section: 2
  number: 40
  type: single
  page: 3
  stem: What did Bill Gates enjoy doing as a child?
  options:
  - label: A
    content: Playing video games.
  - label: B
    content: Watching TV.
  - label: C
    content: Reading and solving puzzles.
  - label: D
    content: Drawing pictures.
  group_stem: '(40-42)

    Bill Gates is a famous American businessman. He was born on October 28, 1955.
    His full name is William Henry Gates III, but most people just call him Bill Gates.
    Bill was a smart and curious child. He enjoyed reading books and solving puzzles.
    When he was 13 years old, he went to a private school and started using computers
    there. At that time, computers were very big and expensive, but Bill became very
    interested in how they worked. He spent many hours learning how to write computer
    programs.

    In 1973, Bill Gates went to Harvard University, one of the best universities in
    the United States. However, he didn’t finish his studies. In 1975, he left Harvard
    to start a company called Microsoft with his childhood friend Paul Allen. They
    wanted to make software for personal computers. Microsoft became very successful.
    The company created the Windows operating system. Today, millions of computers
    around the world use it. Thanks to Microsoft, Bill Gates became one of the richest
    people in the world. However, he didn’t keep all his money for himself.

    In 2000, Bill and his wife, Melinda, started the Bill & Melinda Gates Foundation.
    This foundation helps people in many ways. It works to improve health in poor
    countries, provide clean water, and support education. Bill believes that people
    with money should help others in need. Today, Bill Gates is no longer the boss
    of Microsoft. He spends most of his time working on problems through his foundation.
    He also writes books and gives talks about science, education, and climate change.
    Many people around the world respect him not only for his success in business,
    but also for his efforts to make the world a better place.

     software 軟體 operating system 作業系統 foundation 基金會 effort 努力'
