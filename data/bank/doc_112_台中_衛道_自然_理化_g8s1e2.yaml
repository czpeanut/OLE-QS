  section: 1
  number: 27
  type: single
  page: 3
  stem: '自然界中許多礦石含有 $\mathrm{CaCO_{3}}$的成分，小青設計一項實驗要檢驗甲、乙、丙三種礦石中是否含有 $\mathrm{CaCO_{3}}$，他將此三種塊狀的礦石稱取相同質量後，分別置入如附圖的實驗裝置中。先加入少許的水，使水面高於礦石，固定薊頭漏斗並使漏斗管末低於液面下，再將
    1 M 的鹽酸緩緩加入薊頭漏斗內，所產生的氣體導入澄清石灰水中，以檢測該氣體，實驗結果如附表所示。依據附表推論何者正確？


    | 檢驗步驟 | 礦石 甲 | 礦石 乙 | 礦石 丙 |

    | :--- | :---: | :---: | :---: |

    | 一、與鹽酸反應是否產生氣體 | 否 | 是 | 是 |

    | 二、澄清石灰水是否變混濁 | 否 | 是 | 否 |'
  options:
  - label: A
    content: 甲、乙、丙三種礦石中，可能含有 $\mathrm{CaCO_{3}}$的為乙、丙
  - label: B
    content: 若將乙、丙礦石磨成粉末後，產生氣體的速率會加快
  - label: C
    content: 若將甲礦石磨成粉末後，與鹽酸反應就會有氣體產生
  - label: D
    content: 丙礦石與鹽酸反應後產生氣體必為氫氣 。
