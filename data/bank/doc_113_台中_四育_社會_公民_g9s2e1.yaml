    \ 對孩子帶來的正面成長，而DFC 更成為聯合國全球十大推薦教育項目及永續發展項目之一，並持續5 年獲得全球100 最佳7 個項目之一。\n\n    DFC\
    \ 於2009 年開始，提倡透過 DFC 四步曲 ― 感受、想像、行動、分享，讓孩子活用所學知識，積極解決生活周遭的問題，是全球最大的孩童創意行動。超過六十五個國家的教育學者共同推動，旨在鼓勵孩童關心社會，培養孩子用愛與信心建⽴「主動改變」「我做得到」(I\
    \ CAN) 的信念，並且發揮創意和付諸行動去解決問題，讓世界變得更美好。\n\n參與DFC 體育文化藝術創意挑戰賽，不但讓孩子對各項體育文化藝術活動、音樂、繪畫、舞蹈、故事、書法等等各式比賽。參加者除可在比賽中展示其作品，獲取各個獎項及證書外，更可在DFC\
    \ 官方網站向世界各地分享其參賽作品。產生興趣，更能藉其分享祝福他人，以挑戰自己進步為目標。"
