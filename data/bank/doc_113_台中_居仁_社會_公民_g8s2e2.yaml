  group_stem: "【三】\n     去年雲林地檢署攜手更生保護會雲林分會，針對詐欺罪的受刑人進行個別輔導，輔導過程除播放受害者傾家蕩產、身心折磨的真實影片，也提醒出獄有創業貸款需求，切勿輕信來路不明訊息或輕率抵押房產，可透過更生保護會「圓夢創業貸款」計畫，獲免息貸款及創業輔導服務。此外也提醒受刑人「打詐新法」的修正與新增的法規內容，例如加重刑罰的部分，希望能從根源做起。\n\
    \    而新法上路後的懲詐原則是「騙愈多關愈久」，詐欺金額達五百萬元以上，最重可處10 年徒刑，得併科3 千萬元以下罰金；對於發起、主持、操縱或指揮犯罪組織之首腦主犯，更提高刑責為5\
