  - label: B
    content: 違反者會受到公權力處罰
  - label: C
    content: 能夠約束個人的內在思想
  - label: D
    content: 是一種非正式的社會規範。
  group_stem: '立法院會今天三讀通過《野生動物保育法》部分條文，正式宣告獵捕野生動物全面禁用獸鋏、炸藥或其他爆

    裂物。此外，原住民族可基於非營利自用獵捕野生動物，並增訂備查制，若未依法申報，除罰鍰外，不再涉

    及刑事責任。

    有鑒於前年3 月新竹縣六福村動物園一隻東非狒狒脫逃事件，六福村未主動通報動物逸失，圍捕費用由政府

    買單，引發社會質疑。三讀條文明定，保育類野生動物逸失，未通報當地直轄市、縣（市）主管機關，或未

    積極圍捕者，處新台幣3 萬元以上15 萬元以下罰鍰。此法目的是保育野生動物，維護物種多樣性、資源永

    續發展，與自然生態之平衡，並期許每個人都具有愛護動物的心態，使無辜動物不再受害。'
