  section: 1
  number: 37
  type: single
  page: 1
  stem: '隨者網際網路日漸發達，使得人們經常透過網路溝通，改變人和人之間的互動模式，也因此產生

    網路次文化。例如：較不喜歡嚴肅的事物、有許多想法或創意、偏好物質享受等現象。請問下列

    關於次文化的敘述哪些是正確的？(甲)次文化是人數較少的群體所展現的生活模式，應盡量修正

    以迎合多數人。(乙)次文化有助於形成多元文化，並非指次等的文化。(丙)傳播媒體會影響次文化。

    (丁)次文化能夠與主流文化並存。'
  options:
