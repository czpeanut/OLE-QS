- id: doc_113_新北_板橋_社會_公民_g7s2e2_s1_47
  section: 1
  number: 47
  type: single
  page: 2
  stem: 請問大多數南韓人認同並食用醃製的蔬菜，這是屬於何種文化的意涵？
  options:
  - label: A
    content: 主流文化
  - label: B
    content: 文化交流
  - label: C
    content: 文化衝突
  - label: D
    content: 次文化。
  group_stem: '世界各地有許多獨特的美食文化，這些美食的由來可能與當地的生活環境、歷史背景有關，像是南韓位於中

    高緯度，冬天太冷種不出蔬菜，因此當地人紛紛將收成的蔬菜進行醃製，再深藏在地下或甕中，讓家人在寒

    冷的冬天有蔬菜可以吃，而形成獨特的醃製文化。又像是柬埔寨早期政局動蕩不安，發生內戰與饑荒，人民

