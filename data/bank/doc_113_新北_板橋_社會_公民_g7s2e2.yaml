  group_stem: '酒駕新法2022 年上路後，各縣市政府會針對屢次酒駕或拒測違規累犯加重罰鍰、吊銷駕照及公布姓名、照片。

    臺北市為落實酒駕零容忍並遏止酒駕祭出新招，針對酒毒駕累犯3 次以上且設籍台北市者，將公布放大7 倍

