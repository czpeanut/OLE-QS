  group_stem: "Do you have difficulty coming up with solutions to problems? It may\
    \ be because there are too much thought inside your mind. “Six Thinking Hats”,\
    \ which is created by Dr. Edward De Bono, is a good skill to help people think\
    \ of the best solution to problems. Each hat has its own color and carries its\
    \ special meaning.\n    The Red Hat shows feelings only. People with this hat\
    \ share their feelings as loves, likes, dislikes, and hates. Yet The White Hat\
    \ calls for needed information and facts. The Green Hat lets people think of any\
    \ possible ideas to the problems. The Yellow Hat is used to list out the good\
    \ sides of the ideas while The Black Hat offers the bad or harmful sides of those\
    \ possible solutions. The Blue Hat, which plays the role of a judge, has the right\
    \ to make the final decision.\n    In fact, there is no fixed order of using these\
    \ hats. Yet people can only put on a hat and play one role each time. In this\
    \ way, we can find out the best solution to our problems as soon as possible.\
    \ Why not give it a try?"
