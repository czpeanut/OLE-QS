    \ started skipping afternoon classes to play computer games. They keep pressuring\
    \ me to go with them, but I don't think it's a good idea.\nWhat should I do? I\
    \  (32)  .\n\nThanks,\nSamuel\n\nReply\nHi Samuel,\n    First, let me say that\
    \ I know how difficult it can be to resist peer pressure. And it's even more difficult\
    \ to maintain a good relationship with the people who are pressuring you. But\
    \ I think you've already identified the most important thing you can do in your\
    \ situation: pay attention to how you feel. Even if your friends are fine with\
    \ skipping class, that doesn't mean it's a good choice for you. Listen to your\
    \ heart.\n    One of the best things you can do when saying \"No\" to your friends\
    \ is to offer another choice. For example, \"Nope, I'm going to class, but I'll\
    \ meet up with you in the gym after school to shoot some hoops.\"\nBy saying so,\
    \ you show your friends that some activities are bad for you, but you still care\
    \ about your friendships, and you're happy to spend time with them in other ways.\
    \ Setting healthy boundaries in friendships can help you protect your identity\
    \ and personal space.\n\nSincerely yours,\nChristine\n\npeer pressure 同儕壓力 resist\
    \ 抵抗 situation 情況 boundary 界線 identity 確認"
