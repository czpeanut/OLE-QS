  stem: 「馬的耳朵不僅是一種聽覺器官，也是反映情緒的指標。……馬的耳朵和眼睛協調得很好，眼睛一發現異樣，耳朵會跟著朝那個方向『打聽』，一聽到異聲，眼睛也會馬上進行『搜尋』。所以，用『東風吹馬耳』來比喻『充耳不聞，無動於衷』，其實是不夠了解馬。」根據此段文句，以下推論何者最合理？（自學一）
  options:
