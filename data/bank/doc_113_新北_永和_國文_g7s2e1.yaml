    \ 和Ｉ）。如果只取這個框架簡單易記的優點，可以透過MBTI 認識自己或他人的性格，例如有人說李白是ENTP。\n\n| 向度 | 類型 | 性格敘述 |\
    \ 類型 | 性格敘述 |\n| :--- | :--- | :--- | :--- | :--- |\n| 關注取向 | E | 樂於加入群體活動，大方分享看法，成為眾人的焦點。\
    \ | I | 喜歡獨處的自在，傾向保留內心的想法，少與陌生人談話。 |\n| 習慣資訊 | S | 注重實用思維，偏好具體的指引與實踐的細節。 | N |\
    \ 擅長抽象思考，用簡要的語言掌握概念與大方向。 |\n| 做決策方式 | T | 在乎原則、公理、正義、倫常，對事不對人。 | F | 重視和諧、體諒，常把人們的情緒納入處事的考量。\
    \ |\n| 生活態度 | J | 目標導向，希望一切在掌控中，按部就班照計畫實現。 | P | 保持開放的選擇，隨著現況調整，能接受意想不到的改變。 |\n\
    \n資料二\n\n| 內斂靜思的詩佛：王維 | 浪漫不羈的詩仙：李白 | 憂國憫民的詩聖：杜甫 |\n| :--- | :--- | :--- |\n| 1.\
    \ 關注取向（I）：性格內向，詩風偏向幽靜，喜愛獨處與山水。<br>2. 習慣資訊（？）：詩中多用意象與象徵，描寫超越現實的禪意境界。<br>3. 做決策方式（？）：重視情感與內在體悟，詩風溫潤深遠。<br>4.\
    \ 生活態度（J）：詩作結構嚴謹，風格含蓄，注重內心秩序。 | 1. 關注取向（E）：外向開朗，熱衷於社交，喜愛豪飲，與達官貴人交遊廣泛。<br>2. 習慣資訊（N）：詩風奔放奇幻，擅長想像與誇張，作品充滿浪漫氣息。<br>3.\
    \ 做決策方式（T）：理性思辨，批判現實。<br>4. 生活態度（P）：不受世俗拘束，隨興而為，追求即興創作與自由。 | 1. 關注取向（？）：性格內斂，詩作多表現個人憂患與社會關懷。<br>2.\
    \ 習慣資訊（S）：詩歌寫實，注重細節。<br>3. 做決策方式（T）：理性分析社會問題，對政治與現實有深刻見解。<br>4. 生活態度（？）：詩風嚴謹，講求對仗工整，作品有計畫性與使命感。\
    \ |"
