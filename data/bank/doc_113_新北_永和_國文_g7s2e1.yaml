  group_stem: '（一）造字法則判斷（語文天地ㄧ）：請根據字形與其解釋，判斷下列文字屬於哪一種造字法則（象形、指事、會意、形聲），並寫在「分類」欄位。（共5
    分）


    | 文字 | （1）且 | （2）痛 | （3）亦 | （4）哭 | （5）磊 |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 解釋 | 字形像一塊祭祀去世祖先的牌位。 | 字形的「疒」為病人依靠床上的樣子，作為形符，表示與病痛有關；「甬」表示聲符。 | 字形為一個人，特別用兩小點指明人的臂腋之所在。
    | 字形有兩個「口」，表示不斷高聲哭喊；中間是像披頭散髮的人。此字代表表示人受冤屈而高聲哭訴的意思。 | 字形從三石，表示石塊堆積。 |

    | 分類 | 請作答於答案卷 | 請作答於答案卷 | 請作答於答案卷 | 請作答於答案卷 | 請作答於答案卷 |'
