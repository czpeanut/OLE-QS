- id: doc_113_新北_永和_國文_g7s2e1_s6_28
  section: 6
  number: 28
  type: single
  page: 5
  stem: 關於《咒術迴戰》中的「兩面宿儺」，以下哪一個敘述最符合歷史記載與民俗傳說的雙重詮釋？（綜合）
  options:
  - label: A
    content: 他是一位神道教神祇，專門保護陰陽師免受詛咒侵害
  - label: B
    content: 他在鎌倉時代是佛教僧人，創立了融合咒術與禪宗的新宗派
  - label: C
    content: 他是平安時代的陰陽師，因觸犯禁忌而被流放，最終成為怨靈
  - label: D
    content: 他原本是大和政權統一過程中，反抗勢力的領袖，後來被官方史書妖魔化
  group_stem: "請閱讀下文，並回答 28 ～ 29 題：\n  《咒術迴戰》不僅是一部熱賣的動漫作品，更是一部深受日本傳統文化與宗教信仰影響的現代表達。故事的核心設定來自陰陽道、咒禁道等古代神秘學說，並巧妙地將歷史、民俗與宗教元素融合，使其角色與劇情更具文化深度。例如，五條悟的必殺技「無量空處」，其概念來自佛教的禪定境界，意指超越物質世界、進入無邊無限的空間；而反派夏油傑的黑色袈裟，則具有鎌倉時代新佛教僧人的象徵意涵，表現出脫離世俗、追求更高信仰的形象。\n\
    \  作品中的「御三家」之一——加茂家，其名稱與歷史上的賀茂一族相似。平安時代的賀茂家族掌控了朝廷的陰陽道事務，並影響了日本民間信仰的發展。而五條悟的家族，更可追溯至「日本三大怨靈」之一的菅原道真——這位歷史上著名的學者，在《咒術迴戰》的設定中，被延伸為強大的咒術師，展現了作品對歷史與傳說的獨特詮釋。\n\
    \  此外，作品中宿儺的形象亦來自日本古代史書《日本書紀》的記載。根據史書，宿儺擁有「兩個面孔、四隻手」，被描繪成異形怪物。然而，部分學者認為，宿儺可能並非妖魔，而是某個不願臣服於大和政權的地方首領，最終在歷史敘述中被刻意妖魔化。然而，在岐阜地區的地方傳說中，「兩面宿儺」卻是守護當地的英雄，甚至被視為觀音的化身，展現了日本民俗信仰中的多重詮釋。\n\
    \  《咒術迴戰》透過這些歷史與宗教元素，使咒術師的存在不僅是超自然的幻想，更是被時代遺忘、但深植於文化脈絡中的象徵。這種將民俗學與動漫結合的手法，讓作品不僅具有娛樂性，也讓觀眾得以窺探日本傳統文化的底蘊。\n\
    ——本文改寫自蔡亦竹〈無量空處：日本《咒術迴戰》融合的宗教民俗〉"
