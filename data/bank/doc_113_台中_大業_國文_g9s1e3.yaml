  type: single
  page: 4
  stem: "根據下文，饕餮紋樣主要反映了人們哪些方面的心理需求？\n  雖然饕餮紋樣的具體形式不一而同，但絕大多數的饕餮紋樣都注重眼睛部分的表達，眼睛往往被作為整個圖案的視覺中心，多用濃重的線條和較大的體量塑造成怒目圓睜的感覺，不但在形像上給人以巨大的威懾力，更有希望生活中的人們具有像猛禽一樣超凡視力的寓意；其怒張的大口和粗壯捲曲的大角也向人們傳達了對猛獸之口的殺傷力與牛羊等動物角的攻擊性的崇拜。饕餮紋樣每時每刻都在向人們傳達一種強大的威懾力，這與當時人們苦於自然界中猛獸的侵襲與部落之間戰爭的心理有著最直接的關係。\
    \              \n                                                  ──節選自〈從饕餮紋看商代社會追求〉"
