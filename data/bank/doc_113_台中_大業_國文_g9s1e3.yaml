  stem: 下列出自本文的句子，何者有力反駁第一段「以為只要把他們全都抓去住院，就會天下太平」的觀點？
  options:
  - label: A
    content: 整個安大略省的精神疾病的病床數甚至是下降的
  - label: B
    content: 大家重新思考一下重大暴力事件的本質為何
  - label: C
    content: 通常是因為他們陷入與他人的衝突情境
  - label: D
    content: MAH 的謀害對象中，陌生人受害只占了其中的9%
  group_stem: "（五）\n  臺灣社會每次發生重大謀殺案件，就陷入加害者必然為精神疾病患者的想像。甚至還有一些政治人物附和必須強力監控精神疾病患者，以為只要把他們全都抓去住院，就會天下太平。從過去的資料已知，精神疾病並非重大暴力行為之主要原因。當一個有精神疾病的人真的犯下暴力事件，通常是因為他們陷入與他人的衝突情境，而不是預先策畫一場大規模屠殺。\n\
    \  關於精神疾病患者，較不易接觸到的一般人感想可能是：外面的「壞人瘋子」很多，只要將他們與社會隔絕，暴力案件就不會發生。但實際上，這樣的結論是合理的嗎？大家重新思考一下重大暴力事件的本質為何，與精神疾病患者到底有何關係。\n\
    \  2018 年加拿大團隊發表的研究將焦點放在加拿大安大略省，仔細爬梳從1987 到2012 二十五年來精神病患發生重大暴力事件的發生率與發生型態。從結果來看，平均而言，因心智異常所導致的謀殺（以下簡稱\
    \ MAH）只占了謀殺案件的3.7%。過去二十五年來，MAH 所占的比率很穩定，都在2%至4%之間浮動，並未有顯著變化。另外，MAH 發生的比率也與精神醫療利用率無關，簡單地說，也不是說服務件數變多，MAH\
    \ 就會下降。整個安大略省的精神疾病的病床數甚至是下降的，他們不考慮將精神疾病患者一直關在醫院之中，也沒有因此就導致MAH 上升。\n  若以受害者來看，若分為家人、熟人及陌生人，MAH\
    \ 的謀害對象中，陌生人受害只占了其中的9%，主要受害者是家人，大約占了六成；但一般人謀害的對象主要是熟人，大約是49%。若以國家政策的角度而言，與其將所有精神疾病患者關入機構，還不如將社會資源投注於提供多元的抒壓管道，並且減少貧窮、物質誤用，並建立足夠的社會支持，才有可能進一步減低殺人犯罪的比率。\n\
    \                                                                            \
    \     （改寫自《泛科學》）"
