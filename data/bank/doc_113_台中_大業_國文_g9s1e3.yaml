  group_stem: "（二）\n  江浙之俗信巫鬼，相傳人死則其魄復還，以其日測之，某日當至，則盡室出避于外，名為避放。\n  命壯僕或僧守其廬，布灰於地，明日，視其跡，云受生為人為異物矣。鄱陽民韓氏嫗死，倩族人永寧寺僧宗達宿焉。達暝目誦經，中夕，聞嫗房中有聲嗚嗚然，久之漸厲，若在甕盎間，蹴蹋四壁，略不少止，達心亦懼，但益誦首《楞嚴咒》，至數十過。天將曉，韓氏子亦來，猶聞物觸戶聲不已，達告之故，偕執杖而入。\n\
    \    見一物四尺，首戴一甕，直來觸人。達擊之，甕即破，乃一犬呦然而出。蓋初閉門時，犬先在房中矣，甕有糠，伸首舐之，不能出，故戴而號呼耳。       \
    \                      （洪邁《夷堅志全集．韓氏放鬼》）\n【注釋】1.受生為人為異物：出生當人或當其他生物。 2.倩：請。 3.蹴蹋：踢、踏。\
    \ 6.楞嚴咒：佛經的一種。"
