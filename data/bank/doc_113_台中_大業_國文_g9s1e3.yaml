  type: single
  page: 4
  stem: "請根據下文所述，判斷「胸襟大了，洞庭湖小了。」其主要的原因是？\n  范仲淹確實是文章好手，他用與洞庭湖波濤差不多的節奏，把寫景的文勢張揚得滾滾滔滔。遊人仰頭讀完〈岳陽樓記〉的中堂，轉過身來，眼前就會翻卷出兩層浪濤，耳邊的轟鳴也更加響亮。范仲淹趁勢突進，猛地遞出一句「先天下之憂而憂，後天下之樂而樂」的哲言，讓人們在氣勢的卷帶中完全吞納。\n\
    \  於是，浩淼的洞庭湖，一下子成了文人騷客胸襟的替身。人們對著它，想人生，思榮辱，知使命，遊歷一次，便是一次修身養性。\n  胸襟大了，洞庭湖小了。  \
    \           \n                                                   （節錄自余秋雨《文化苦旅·洞庭一角》）"
  options:
  - label: A
    content: 因遊人到處觀覽奇山異水，見聞多了，便不把洞庭湖放在眼裡
  - label: B
    content: 因滾滾滔滔的洞庭湖水雖能壯闊遊人的心，但其日益淤積的情況也是事實
  - label: C
    content: 因「先憂後樂」的偉大胸襟令人驚嘆，此人格境界大於滾滾浪濤的洞庭湖水
  - label: D
    content: 心胸如果寬大能容，即使是小小的洞庭湖，也有滾滾滔滔的壯闊。
