- id: doc_113_台中_大業_國文_g9s1e3_s1_25
  section: 1
  number: 25
  type: single
  page: 4
  stem: "老師請同學們根據下列短文填入書名，請問哪一位同學答對？\n  章回小說是在宋元講史話本的基礎上發展而來，並在明清兩代盛行。明代的白話小說在形式和藝術上達到了極高的成就，長篇小說多以章、回分隔，形成了所謂的「章回小說」。\n\
    \  著名的長篇小說包括描寫英雄人物、政治鬥爭和軍事策略的《甲》；描寫一百零八位好漢反抗腐敗官府的鬥爭，控訴社會不公的《乙》；描寫唐僧師徒四人西天取經的冒險旅程，融入了佛教與道教思想，充滿奇幻色彩的《丙》，以及蘭陵笑笑生的《金瓶梅》，這四部作品合稱為「四大奇書」。\n\
    \  而清代則出現了揭示封建家庭的衰落及人性悲劇的《丁》；批判科舉制度與讀書人醉心功名醜態的《戊》，和揭發吏治黑暗與清官之惡的《己》，這些作品均具有高度的藝術成就。"
  options:
  - label: A
    content: 小棋──甲：三國演義；己：老殘遊記
  - label: B
    content: 安安──乙：水滸傳；丙：聊齋誌異
  - label: C
    content: 阿瀚──丁：紅樓夢；戊：老殘遊記
  - label: D
    content: 維維──甲：水滸傳；乙：儒林外史
