  section: 1
  number: 18
  type: single
  page: 1
  stem: 「臺灣茶葉之父」李春生 (西元1838∼1924 年)，出生於福建廈門，小時候為貼補家用曾與鄰家小孩一同上街賣糖果，從此立下從商的志向。他協助英商自福建引進茶葉到臺灣，隨臺灣茶葉的興盛而成為富甲一方的商人，是趁著時勢崛起的代表人物之一。關於當時的社會情形，下列敘述何者正確？
  options:
  - label: A
    content: 李春生應與洋行有經貿合作進而致富
  - label: B
