- id: doc_113_新北_福和_社會_歷史_g7s1e3_s1_22
  section: 1
  number: 22
  type: single
  page: 1
  stem: 某一時期的台灣社會，群眾常因不同祖籍或職業產生隔閡而爆發集體衝突，而北管的派別競爭也是其中之一。當時宜蘭的北管戲曲根據使用樂器不同，分成「福祿」與「西皮」兩派，在廟會時兩派互相競爭，甚至糾眾鬥毆，此對立現象後來逐漸擴大到基隆、台北、花蓮等地，成為社會治安的漏洞。關於上述現象的發生，下列敘述何者最適當？
  options:
