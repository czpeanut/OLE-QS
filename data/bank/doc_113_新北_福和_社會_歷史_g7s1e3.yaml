  stem: 林本源家族在大溪發展史上的影響深遠，當時家族是躲避漳泉械鬥遷居於大溪，林家的入住促進了當地的繁榮。他們開圳引水，奠定了農業發展的基礎；後來更藉地利之便，做起米、盬的河運生意。1860
