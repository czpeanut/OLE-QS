- id: doc_113_新北_福和_社會_歷史_g7s1e3_s1_32
  section: 1
  number: 32
  type: single
  page: 2
  stem: 桃園楊梅黃家與彰化埔心黃家，因二百多年前先祖從中國大陸搭同一艘船到臺灣開墾。基於同船情誼，兩處的黃家人每年春、秋兩季都會互相聯繫，祭拜雙方來臺開拓的祖先，彼此「不忘本」的作法成為一段溫馨佳話。從上述內容分析，桃園楊梅黃家與彰化埔心黃家的關係最可能為何？
  options:
  - label: A
    content: 兩家必有血緣關係
