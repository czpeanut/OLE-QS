- id: doc_113_高雄_五福_國文_g7s2e2_s5_9
  section: 5
  number: 9
  type: single
  page: 7
  stem: 根據本文，下列哪一項行業最可能被自動化取代？
  options:
  - label: A
    content: 行為藝術家
  - label: B
    content: 語言治療師
  - label: C
    content: 精神科醫師
  - label: D
    content: 工廠作業員
  group_stem: "人類最終會被人工智慧所取代嗎？\n現代社會科技發展日新月異，生活中不乏愈來愈多便利設計與發明。然而，科技進步，同時也帶來許多隱憂。知名物理學家史蒂芬•霍金曾經說過：「全面人工智慧的發展，可能意味著人類終結。」大量人力需求工作將逐漸被機器取代，許多工作機會面臨消失命運，而自動化趨勢對每個產業的影響也都\n\
    不盡相同。\n\n  AI 運用層面廣，舉凡交通、能源發展、農業、醫療、金融等範疇，在近幾年發展與成長突飛猛進，讓人不禁開始思考，自己工作究竟會不會被AI\
    \ 取代？2017 年1 月，麥肯錫全球研究院發表了未來工作：自動化、就業與生產力報告，分析自動化趨勢對各行各業的影響。報告中指出，雖然能被科技完全取代的職業不超過5％，但在近6\
    \ 成職業中，至少有30％工作內容將被自動化。\n  報告中也提供建議，較不易被取代的特質，可分類為以下表格中的5 個面向：\n\n| 專業程度 | 比起醫師、律師，如果工作沒有嚴格的入行門檻，也不需專業證照，被取代的機率比較高。\
    \ |\n| :--- | :--- |\n| 創意程度 | 相較於作家、設計師，如果工作不必發揮創意，只是處理固定、制式的內容，也是高危險群。 |\n|\
    \ 管理 | 和CEO、人力資源主管相比，如果職位並不涉及管理，只是依據指令作業的基層人員，被取代性大幅提高。 |\n| 溝通複雜度 | 如果工作不必像律師、心理諮商師進行複雜的溝通、辯駁，只是簡單、制式的對話，就比較容易被淘汰。\
    \ |\n| 可預測的體力勞動 | 有別於消防員需機動判斷火勢而採取行動，如果工作步驟制式、明確，則較易被愈來愈聰明、精準的機器取代。 |\n\n  在未來的世界，我們不該害怕科技帶來革新與巨變，應該勇於面對並接受挑戰。擁有積極學習動機，培養多元與創意的能力，並且持續學習與改變。在思索未來發展的同時，更應思考自己應該具備哪些能力與特質，方能不被時代的進步洪流無情沖刷與取代。\n\
    \n< 遠見雜誌>"
