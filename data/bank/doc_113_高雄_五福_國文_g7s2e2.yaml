  section: 5
  number: 7
  type: single
  page: 6
  stem: 根據本文，下列有關作者舉例的說明何者正確？
  options:
  - label: A
    content: 作者旅行的經驗 ―― 感嘆人生有許多的遺憾
  - label: B
    content: 泰姬陵的建造 ―― 呈現嚴謹工整的對稱之美
  - label: C
    content: 費雯麗的柳眉 ―― 是一種後天故意設計的缺憾美
  - label: D
    content: 日本 東照宮的建築 ―― 害怕會遭天譴，因此設計對稱美
  group_stem: "每當旅行到一處地方，往往該走該看的還沒走遍看完就得離開了。當地主人為我惋惜，我總是笑笑說：「這樣才好，留些遺憾，以後才會想再來。」\n\
    \  不完美狀態才充滿可能，有時甚至因而成為一種美 ―― 缺憾美。\n  印度「泰姬陵」故事正是個有趣例子。伊斯蘭藝術的特色之一，是華麗繁複、令人目眩神迷構圖；而伊斯蘭建築最講究就是嚴謹工整對稱之美。三個多世紀前，信奉伊斯蘭教的印度\
    \ 蒙兀兒皇帝沙加汗，決心為他難產而死愛妃蒙泰茲建造一座舉世無匹的、華美壯麗陵寢。設計時當然從外到內鉅細靡遺，無一處不是完美對稱。不料這座耗資過巨的愛之傑作弄得民窮財盡，沙加汗被篡位親生兒子囚禁起來，鬱鬱以終；原先想為自己另建一座黑色大理石陵寢，與泰姬陵遙相對應美夢也碎了。更可悲的是：他死後無處葬身，棺槨就被放置在泰姬陵內、蒙泰茲棺槨之旁――這一來，就破壞他信奉宗教和美學上講求的至高無上的對稱美了！\n\
    \  正因此，沙加汗得以與愛妃生同枕、死同墳。他若地下有知，是該喜還是憾呢？\n  其實對稱並不一定就美。就像太完好無瑕如蠟像的臉孔是乏味的，有時左右不太對稱的臉反而更有魅力。至今還覺得《亂世佳人》裡的費雯麗是她那一輩女星裡最美的，我尤其喜歡她那兩道高低長短不一的柳眉：每當她高高挑起右邊的眉毛，無論是表示挑逗或者挑釁，都顯得特別有個性而迷人，哪是庸脂俗粉整齊劃一眉毛能比的呢？\n\
    \  缺陷美多半是無意和無奈的意外結果，但還是有故意經營的例外。對比泰姬陵的例子，日本建築就另有思維。像日光東照宮，據說建造時設計者因自覺太完美了，恐怕會遭天譴，就想出一個辦法：把其中一支樑柱雕花有意顛倒，刻意造成一份缺憾美。這種故意經營出來缺陷，竟是一種哲學思維\
    \ ―― 也可說是出於宗教情操的「敬畏」之心吧。\n  原來完美狀態也是可怕的 ―― 這不一定是迷信，其實也是種生活經驗累積的智慧：因為沒有任何狀態，包括完美，是持久的；而完美狀態改變只有一個\
    \ ―― 結果變成不再完美。唯有不完美狀態，才充滿變化與發生的可能性，才具有一種持續上進生命力。中國人也深刻意識到這點，所以「月盈則虧」道理一直是深入人心的。\n\
    \  我們當然不能否定追求完美的重要 ―― 對完美要求，正是人類不斷自我提升的驅動力。然而日常生活中完美狀態終止並不一定是壞事 ―― 那往往也是緊張狀態的終止\
    \ ―― 小時候第一張不再是滿分的考卷、新衣服上的第一點汙跡，成人後新車的第一道刮痕、戀人之間的第一次爭吵……雖然都令人懊惱，卻也讓人在潛意識裡鬆一口氣：不必再成天提心吊膽地保持完美狀態了！\n\
    我覺得古今中外最美麗神話是中國的女媧補天，貼近人之常情 ―― 就算是老天也會損壞的，可是不用害怕：有位健壯又善良女神，能採煉石頭把天破洞補好。這是何等親切的大地之母啊！既然連天都曾是殘缺的，人世間缺憾遺恨就更是常態了，又何須苦苦痴想、執著求全呢？\n\
    ----<缺憾>李黎"
