- id: doc_113_高雄_五福_國文_g7s2e2_s5_2
  section: 5
  number: 2
  type: single
  page: 4
  stem: 根據個人擲準賽的規定，博涵想取得個人擲準賽的冠軍，他必須做到哪些才行？
  options:
  - label: A
    content: 要會前投、跪投、轉身投、釘投及左右開弓五種投法
  - label: B
    content: 只進行三輪比賽，擲入圓盤中心點的次數最多者獲勝
  - label: C
    content: 前投、跪投、左右開弓有兩次投擲為無效投擲的機會
  - label: D
    content: 每局比賽以十五分鐘為限，若超過時間才進則不計算
  group_stem: '陀螺爭霸賽

    ★比賽規則

    採定點擲準方式。在目標圓盤距離2.5 公尺外，不得踩線或超線，將陀螺擲進圓盤中心點（圓盤內徑4.5 公分內）或圓盤內外圈（圓盤內徑4.5 公分外至盤緣），只有釘頭接觸圓盤，在盤內或中心點內轉動時間五秒以上，方為有效投擲。

    一、個人擲準賽：參賽者依次以前投、跪投、轉身投、釘投及左右開弓等五式，將陀螺投擲入目標圓盤。每人每式各有兩次投擲機會，全數有效投擲者可進入下輪比賽，餘者淘汰。最後依投擲入中心點次數取名次，多者為勝。如不分勝負，則加賽至分出勝負為止。

    二、團體過關斬將賽：兩隊對戰，每隊出賽六人，每局依號次輪流投擲，不限次數，隊員中任一人將陀螺擲進盤內中心點為過關，六個目標圓盤依序優先完成者可進入下輪比賽。每局比賽以十五分鐘為限，如未於三局內分出勝負，得採進盤內外圈亦為過關，以此計數。若進盤數也相同，則單局加賽至分出勝負為止。新一局比賽前，得重新提出該局參賽名單，但參賽之選手需為事先已報名之八名選手。

    ★獎勵

    一、個人擲準賽前三名，頒贈獎狀。

    二、團體過關斬將賽取前三名，頒贈獎盃。'
