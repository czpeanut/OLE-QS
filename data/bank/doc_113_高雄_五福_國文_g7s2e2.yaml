  page: 1
  stem: 下列選項「  」中的注音寫成國字之後，何組兩兩相同？
  options:
  - label: A
    content: 金榜「ㄊ一ˊ」名╱「ㄊ一ˊ」名參選
  - label: B
    content: 晶「ㄧㄥˊ」剔透╱「ㄧㄥˊ」光幕下
  - label: C
    content: 設「一ㄢˋ」款待╱日清海「一ㄢˋ」
  - label: D
    content: 方興未「ㄞˋ」╱期期「ㄞˋㄞˋ」
