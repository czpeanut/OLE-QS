  group_stem: '〈種柳戲題〉柳宗元

    柳州柳刺史❶，種柳柳江❷邊。談笑為故事，推移成昔年。

    垂陰當覆地，聳幹會❸參天。好作思人樹❹，慚無惠化❺傳。

    ◎注釋:❶柳州柳刺史：柳州，今廣西省柳州市。柳刺史，即柳宗元。❷柳江：流經今柳州市。❸會：能、能夠。

    ❹思人樹：周初召公巡行各城鄉時，在樹下處理政事，後來人們不伐此樹，並做詩以為懷念。後將賢者或先人所種之樹稱為思人樹，因見樹則思其人，故稱。❺惠化：有益於民的仁政與教化。'
