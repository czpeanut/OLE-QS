  section: 4
  number: 3
  type: single
  page: 1
  stem: 下列選項「 」中的字，何組意義前後相同？
  options:
  - label: A
    content: 更「上」層樓╱登「上」電視
  - label: B
    content: 「激」起浪花╱「激」勵人心
  - label: C
    content: 正好「還」鄉╱車禍生「還」
  - label: D
    content: 「提」心吊膽╱相「提」並論
- id: doc_113_高雄_五福_國文_g7s2e2_s4_4
  section: 4
  number: 4
  type: single
  page: 1
  stem: 有關〈跳水〉一詩的寫作手法，下列敘述何者正確？
  options:
  - label: A
    content: 第一二句寫跳水前的害怕和恐懼
  - label: B
    content: 第三四句寫跳水過程中的優美姿態
  - label: C
    content: 第五六句寫跳水後眾人的懷疑嫉妒
  - label: D
    content: 末兩句以青春寫出跳水者的年華不再
  lesson_raw:
    title: 跳水
    basis: 題幹提及課名〈跳水〉
- id: doc_113_高雄_五福_國文_g7s2e2_s4_5
  section: 4
  number: 5
  type: single
  page: 1
  stem: 關於〈風箏〉一詩中的說明，下列何者正確？
  options:
  - label: A
    content: 本詩藉「放風箏的遊戲」比喻「人生無常，世事多變」
  - label: B
    content: 「小小的希望能懸得多高呢」告訴人們勿做不切實際的幻想
  - label: C
    content: 「沿著河堤，我開始拉著天空奔跑」展現「夸父追日」的自信
  - label: D
    content: 「細細一線，卻想與整座天空拔河」表現人小志氣高的壯志豪情
  lesson_raw:
    title: 風箏
    basis: 題幹提及課名〈風箏〉
- id: doc_113_高雄_五福_國文_g7s2e2_s4_6
  section: 4
  number: 6
  type: single
  page: 2
  stem: 關於中國文字的說明，下列敘述何者正確？
  options:
  - label: A
    content: 文字發明前，人們利用圖畫或符號記事，已能精準表達意思
  - label: B
    content: 據目前可靠的文獻記載，傳說發明文字的人應該是上古黃帝
  - label: C
    content: 東漢許慎撰《說文解字》，是中國最早依照部首編排的字典
  - label: D
    content: 「三國鼎立」 四字是依照象形、形聲、象形、象形順序排列。
- id: doc_113_高雄_五福_國文_g7s2e2_s4_7
  section: 4
  number: 7
  type: single
  page: 2
  stem: 下列各項「59 週年五福國中校慶園遊會」中各班販賣的美食，何者並非皆為形聲字？
  options:
  - label: A
    content: 烤香腸
  - label: B
    content: 炒泡麵
  - label: C
    content: 炸雞排
  - label: D
    content: 冰淇淋。
- id: doc_113_高雄_五福_國文_g7s2e2_s4_8
  section: 4
  number: 8
  type: single
  page: 2
  stem: 「白日依山盡，黃河入海流。欲窮千里目，更上一層樓。」一詩解讀，下列何者正確？
  options:
  - label: A
    content: 第一、二句以仰望與俯瞰角度刻畫天災人禍的景況
  - label: B
    content: 第三、四句即景生情，展現好高騖遠的雄心壯志
  - label: C
    content: 第二句為「押韻、對仗」而倒裝，原句為「黃河流入海」
  - label: D
    content: 本詩為仄起平聲的五言絕句，韻腳：盡、流、樓。
  lesson_raw:
    title: 登鸛雀樓
    basis: 引用課文〈登鸛雀樓〉全詩
- id: doc_113_高雄_五福_國文_g7s2e2_s4_9
  section: 4
  number: 9
  type: single
  page: 2
  stem: 下列關於〈聞官軍收河南河北〉一詩解讀，何者錯誤？
  options:
  - label: A
    content: 杜甫飽經戰亂、備嘗艱辛後，乍聞喜訊，驚喜萬分，寫下詩作
  - label: B
    content: 全詩以「悲」字貫穿首尾，三聯對偶，感受到作者激昂情感
  - label: C
    content: 本詩選自杜工部集，為仄起式，平聲韻的一首七言律詩
  - label: D
    content: 連用四個地名及「即從、穿、便下、向」等字表現歸程快捷，心情喜悅。
  lesson_raw:
    title: 聞官軍收河南河北
    basis: 題幹提及課名〈聞官軍收河南河北〉
- id: doc_113_高雄_五福_國文_g7s2e2_s4_10
  section: 4
  number: 10
  type: single
  page: 2
  stem: 下列有關〈聞官軍收河南河北〉的修辭與格律說明，何者正確？
  options:
  - label: A
    content: 由第一句「北」字，可知本詩押「ㄟ」韻
  - label: B
    content: 「初聞涕淚滿衣裳」作者悔恨未能共赴國難悲傷不已
  - label: C
    content: 文章首聯「點題」，還用誇飾法寫出喜極而泣之情
  - label: D
    content: 深刻表達作者急欲返家與妻子兒女相聚的渴望。
  lesson_raw:
    title: 聞官軍收河南河北
    basis: 題幹提及課名〈聞官軍收河南河北〉
- id: doc_113_高雄_五福_國文_g7s2e2_s4_11
  section: 4
  number: 11
  type: single
  page: 2
  stem: 詠物詩能細膩刻畫「物」的特色，下列選項中的詩句所描寫的對象，何者對應正確？
  options:
  - label: A
    content: 凝固童年的歡樂記憶／緩緩滾來一顆顆晶瑩的問候／在曾經青春的迴旋軌道上／縱橫臉龐的喜悅色彩再次相互碰撞——地瓜球
  - label: B
    content: 搖一搖／抹一抹／就能塗掉所有錯誤／只留下隱形的疤——橡皮擦
  - label: C
    content: 等待是冬／希望是春／結果是夏／難道秋就害羞了——紅杮
  - label: D
    content: 大喊／在記憶的山谷／冤家的名字被懸崖踢來踢去——收音機。
- id: doc_113_高雄_五福_國文_g7s2e2_s4_12
  section: 4
  number: 12
  type: single
  page: 2
  stem: 下列文句所描寫的季節，何者與「白日放歌須縱酒，青春作伴好還鄉」相同？
  options:
  - label: A
    content: 碧玉妝成一樹高，萬條垂下綠絲絛
  - label: B
    content: 六出飛花入戶時，坐看青竹變瓊枝
  - label: C
    content: 水滿有時觀下鷺，草深無處不鳴蛙
  - label: D
    content: 停車坐愛楓林晚，霜葉紅於二月花
  lesson_raw:
    title: 聞官軍收河南河北
    basis: 引用課文〈聞官軍收河南河北〉詩句
- id: doc_113_高雄_五福_國文_g7s2e2_s4_13
  section: 4
  number: 13
  type: single
  page: 2
  stem: 下列文句，何者語意最為通順，沒有冗言贅字？
  options:
  - label: A
    content: 家伶曾有過一對美麗的雙手，周遭的人都格外羨慕她
  - label: B
