    content: 天有不測風雲，人有旦夕禍福
  - label: B
    content: 人無千日好，花無百日紅
  - label: C
    content: 花開堪折直須折，莫待無花空折枝
  - label: D
    content: 有意栽花花不發，無心插柳柳成蔭
