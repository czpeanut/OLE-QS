  page: 1
  stem: 臺灣某個團體曾發電報給日本政府，抗議指出：「霧社事件是向來恣意榨取及生活上之迫害與駐在警官不正、貪戾、殘忍之處置所激發者，故因速將總督、警務局長、臺中州知事以下之責任者撤職，並立即保證番人之生活，承認其自由，不阻礙其民族發展之政策，尤其宜趁此機會，對向來保持官吏威嚴，放任非違暴亂，警察萬能之積弊，加以徹底改革。」根據電文判斷，這個團體應為下列何者？
