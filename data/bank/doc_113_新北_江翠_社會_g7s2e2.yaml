- id: doc_113_新北_江翠_社會_g7s2e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 資料一顯示政府與臺灣人民間的關係如何？
  options:
  - label: A
    content: 政府未能符合臺灣人民需求，反而施以專制統治，引發人民不滿
  - label: B
    content: 臺灣人民深受日本殖民文化的影響，一時難以接受中國政權統治
  - label: C
    content: 省主席集軍政大權於一身，臺籍菁英及知識份子未受重視
  - label: D
    content: 臺灣自始即希望獨立，反對日本或中國的統治，使政局動盪不安
  group_stem: '資料一：臺灣民眾五十年來飽受日本的殘酷殖民統治，其統治象徵便是臺灣總督府。現在的行政長官公署儼然就是新的臺灣總督府，甚至有過之而無不及。當時一首流行詩這樣說：「總督威風受不了，長官凶焰更難當。」他們認為這是日本總督制度的復活，是中央政府對臺灣同胞的歧視。

    資料二：民國35 年的經濟現象，生產力下降，失業人口激增，物價也漲得嚇人。雞蛋漲8 倍，鹽漲18 倍，糖漲20 倍，茶葉漲4.9 倍。米更恐怖，有漲了50
    倍的紀錄。平日米糖之鄉的臺灣，卻反而米糖短缺，價格比上海、廈門等地貴出很多。 根據課文內容及上述兩份資料，回答15.16 題。'
