  stem: 以下是1960 年「選舉改進座談會」一篇緊急聲明的部分內容：「我們組織新黨是基於愛國心切，不能坐視因執政黨的一黨專制，過分集中權力而誤人誤國…由於民主政治的優點，是執政黨和在野黨的相互制衡，使執政黨也不敢靠政治權力去侵犯人權，或在選舉中舞弊…組織新黨的運動已經是海內外民主反共人士一致的願望。」上文中所提之新黨，最可能是下列何者？
