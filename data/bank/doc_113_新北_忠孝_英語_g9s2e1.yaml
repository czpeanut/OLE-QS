  stem: 45.According to the reading, which is true about the Palisades Fire?
  options:
  - label: A
    content: It burns a lot of land every year.
  - label: B
    content: The dry plants made the fire spread fast.
  - label: C
    content: It lasted for eight months.
  - label: D
    content: It kills a lot of people every year.
  group_stem: 'Wildfires in California

    Every year, wildfires burn a lot of land in California. These fires start from
    lightning, or because of people. Dry weather, strong winds, and high temperatures
    make the fires spread fast. Wildfires burn homes, forests, and places where animals
    live. They also make thick smoke that is bad for people’s health.

    In January 2025, one of the biggest fires, called the Palisades Fire, started
    on January 7 and spread fast. It burned a lot of land and destroyed 6,837 homes
    and buildings. The fire spread quickly because of strong Santa Ana winds that
    blew at 100 miles every hour and a long dry time that lasted for eight months.
    The dry plants caught fire easily.

    The fires caused at least 28 deaths and made over 200,000 people leave their homes.
    More than 18,000 buildings were destroyed. Scientists say that hotter weather,
    dry air, and strong winds make wildfires happen more often. People need better
    plans to stop wildfires and keep everyone safe in the future.

