  section: 5
  number: 49
  type: single
  page: 6
  stem: 49.According to the reading, why were the Formosan landlocked salmon endangered?
  options:
  - label: A
    content: They could only live in mountain rivers because they’re landlocked.
  - label: B
    content: The rivers were too cold for them, they liked warm water.
  - label: C
    content: The rivers were not clean, and the dirty water was killing them.
  - label: D
    content: The salmon were caught and eaten by other animals.
  group_stem: 'Parks and Indigenous People Help Taiwan''s Salmon ICRT News 2/19

    Taiwan has its own salmon! You can see them on the $2,000 Taiwan dollar bill.
    The Formosan landlocked salmon are from the Ice Age! They live in mountain rivers.
    They cannot go to the ocean. That means they''re landlocked.

    They''re endangered too. Thirty years ago, there were 200 of these salmon! Their
    rivers were dirty. The dirty water was killing them! But... in 2023, there were
    18,630 salmon! What happened?

    Shei-Pa National Park helps the fish. It cleaned the water in the rivers. It took
    things out of them too. Salmon can swim far now. People help too. Many are Indigenous.
    They look for changes in the rivers.

    They keep these fish safe. They move baby salmon to higher, cooler rivers. Why?
    Climate changes are making rivers too warm for salmon.

    Taroko National Park also helps. Now salmon swim in two rivers there! National
    parks and Indigenous people are working hard. They''re saving Taiwan''s endangered
    salmon!

    selfish 自私的'
