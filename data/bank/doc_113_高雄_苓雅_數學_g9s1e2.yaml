- id: doc_113_高雄_苓雅_數學_g9s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: '小苓、小雅、阿國、阿中一起討論剛剛上數學課的心得：

    小苓：「如果直線 $L$ 和圓 $O$ 有兩個交點，則直線 $L$ 就是圓 $O$ 的割線。」

    小雅：「如果 $\vec{PA}$ 和 $\vec{PB}$ 是圓 $O$ 的切線，$A$、$B$ 為切點，則 $\overline{OP}$ 會垂直平分
    $\overline{AB}$。」

    阿國：「如果 $A$ 點是圓 $O$ 切線上的一點，則 $\overline{OA}$ 必大於或等於圓 $O$ 的半徑。」

    阿中：「圓內接四邊形的任意兩對角互補，且圓內接梯形必為等腰梯形。」

    請問以上所說的內容，正確的有幾位？'
  options:
  - label: A
    content: 1 位
  - label: B
    content: 2 位
  - label: C
    content: 3 位
  - label: D
    content: 4 位 。
