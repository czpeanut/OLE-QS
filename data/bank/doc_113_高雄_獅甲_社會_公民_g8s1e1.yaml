  section: 1
  number: 40
  type: single
  page: 1
  stem: 為了避免政府掌握過大的權力與職能而侵害到人民權利，民主國家會建立一個受到多重限制的「有限政府」。下列哪一種情況符合「有限政府」的概念？
  options:
  - label: A
    content: 所有人民都握有權力，自己行使統治國家的事務
  - label: B
    content: 政府的權力都集中在單一機關手上，以利於治理
  - label: C
    content: 政府的權力受到分割之後，彼此相互約束與制衡
  - label: D
    content: 政府的職權與運作皆規範在統治者制定的法律中
