- id: doc_113_台中_居仁_社會_公民_g7s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '| 補助項目 | 行旅人返鄉車資補助(川資)→指車資 |

    | --- | --- |

    | 補助對象 | 協助過境短缺川資之民眾返回戶籍地。 |

    | 補助金額 | 1.每一返鄉缺川資之外地人每次僅得申請一張返鄉換票證。<br>2.經常性索取川資救助或身分不明申請人，不宜核發。 |

    | 作業流程 | 外縣市民眾因故缺返鄉車資，得就近向各受理窗口申請返鄉乘車換票證，持往指定之火車站換取車票(區間車)逕返原籍地。設籍離島或無火車駛達地區居民，提供至距離目的地最近可轉搭其他交通工具之直轄市或縣(市)之火車票協助返鄉。
    |


    上表為台中市政府「行旅人返鄉車資補助」計畫的說明辦法，為意外急難時的補助，請問此屬於何種社會福利政策的實施範圍？'
