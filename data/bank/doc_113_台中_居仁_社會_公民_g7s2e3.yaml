  section: 1
  number: 10
  type: single
  page: 1
  stem: 在一次班會課中，老師請同學們討論「人的社會地位怎麼來的」。小恩說：「我的爸爸是工人，我長大想靠自己當醫生。」小偉則說：「我家的公司是爺爺傳下來的，爸爸說以後會交給我接手。」根據上面情境，下列哪一項說法最正確？
  options:
  - label: A
    content: 小恩的夢想是靠家人幫助的，是與生俱來的地位
  - label: B
    content: 小偉接手家業，是靠後天努力得來的地位
  - label: C
    content: 小恩想靠讀書當醫生，這是努力取得的社會地位
  - label: D
    content: 小偉的家族事業和收入，是靠自己工作累積的
