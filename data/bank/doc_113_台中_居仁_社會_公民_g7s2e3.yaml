  type: single
  page: 1
  stem: 校內最近舉辦「幸福午餐週」，不論是七年級、八年級或九年級的學生，大家每天中午都能吃到學校統一提供的免費營養午餐，老師也確保每個班級都能準時領到熱騰騰的便當。此外，圖書館也新增了許多適合各年級閱讀的新書，老師們也設計了各種閱讀活動，讓每位學生都能參與。根據以上情境，學校希望透過這些做法，實現哪一項社會核心價值？
