- id: doc_113_台中_居仁_社會_公民_g7s2e3_s2_36
  section: 2
  number: 36
  type: single
  page: 3
  stem: 根據上文畫線部分所述，此計畫活動是基於何種理念而設計？
  options:
  - label: A
    content: 完成志工服務時數
  - label: B
    content: 透過理解增加尊重
  - label: C
    content: 利他的宗教精神
  - label: D
    content: 學習簡樸生活
  group_stem: '芒草心慈善協會

    2011 年一群服務街友的第一線人員組成芒草心，2014 年以更實務的角度協助無家者及貧困者，除了實際規畫執行無家者自立方案。也著手舉辦流浪生活體驗營、「呷飽未」社區共食餐桌，期望透過更多體驗與交流，幫助外界了解貧困者的生活樣態。

    關於「街遊城市導覽員」計畫

    街遊 Hidden Taipei 是芒草心慈善協會專注於社會溝通的專案，自 2014 年開始帶著遊客探索臺北的另一面。導覽員是曾有流浪經驗的民眾，不僅帶著遊客一探臺北街頭，也在這過程中看見他們的人生故事。導覽員和協會規畫出和他們生命故事緊緊連結的導覽路線，透過導覽員的敘說，遊客得以從無家者的角度重新認識臺北。導覽員透過更多人際互動，更有自信及得到改善生活的機會（導覽收入改善生活）。2016
    年還開始了新企畫「真人圖書館」講座，透過無家者的親身故事分享，和說書人導讀每個無家故事背後的脈絡，閱讀另一種真實人生。2018 年街頭遊戲「艋舺走撞」正式開張，帶著大家化身為背景各異的無家者，在老城艋舺探索另一段生命旅程。透過這些活動，希望能夠創造不同群體可以自在對話的環境，才有機會化解偏見，打造一個更有包容性的社會。

    （資料來源：街遊，https://www.hiddentaipei.org/about）'
  tags:
    chapter:
      publisher: 翰林
