  group_stem: "閱讀 2\n    到了繳稅月，許多納稅人不覺得自己從政府得到好處，而是每年被政府搶劫，口袋被榨乾。雖然有讓各國欣羨的（甲）全民健保，問題是，除了健保外，中產階級對政府在做的事很無感。為什麼？\n\
    \    中正大學社會福利系教授呂建德不客氣地直指原因，就是台灣已患上『南歐病』指【南歐國家在福利國家模式下，普遍存在福利給付以現金為主，且婦女勞動參與率偏低的現象】。\n\
    第一、社會福利支出偏重老人，且以現金給付為主，不利青年世代與婦女就業。\n其次、綜合所得稅的財富重分配效果不彰，高稅率只課到高階白領工作者，課不到有錢人的海外所得和資本利得→【以低買高賣方式賺取差價取得利益】。\n\
    \    ==================================\n    柯文哲先生在擔任台北市長時，被一筆快速膨脹的預算吸引注意力。（乙）重陽敬老金的預算從\
    \ 2012 年 2.5 億，隔年暴增至 6.3 億。原因是重陽敬老金的發放不但未排富，且請領年齡從 70 歲下調至 65 歲，發放金額也加碼。而台北是六都最老的都市，將面臨每五人就有一人是老年人口。因此台北市政府限縮發放對象，只保留中低收入戶和年滿\
    \ 99 歲以上長者，預算從 7 億降至 3700 多萬，省下的 7 億，仍將原封不動地用在台北市老人身上，例如（丙）增設老人共餐據點。\n    重陽敬老金也凸顯地方政府濫發非法定社福預算的問題。但四年一次的首長選舉，候選人靠加碼福利爭取選票。光重陽敬老金，全台一年要發出\
    \ 40 億。其他像老人健保費補助、老人假牙補助、老人三節禮金等，五花八門。即使其他縣市社會局長都說廢除發放是對的，但沒人敢跟進。《以下刪減》~\n資料來源:文~盧沛樺\
    \ 天下雜誌 675 期"
