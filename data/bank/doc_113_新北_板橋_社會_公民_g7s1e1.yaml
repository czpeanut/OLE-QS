  group_stem: "題組48-50 題  \n馬拉拉是2014 年諾貝爾和平獎得主之一，，當時年僅17 歲的她出身的巴基斯坦是個有著根深蒂固性別規範的地方，。塔利班政權認為女性是男性的附屬品，主要工作是煮飯和生孩子，\
