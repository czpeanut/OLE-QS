  stem: 在古羅馬時期曾有一段歷史如下：古羅馬內部發生政爭，使得握有實力的軍事將軍獨攬大權。不過，最終在某位領袖的努力之下，擊敗群雄，收歸大權於一身，結束羅馬政治紛亂的時期，也讓羅馬進入了帝國時期，開啟長達兩世紀的和平與繁榮，史稱「羅馬和平」。請問：上述所提的某位領袖，最可能是下列何者？
