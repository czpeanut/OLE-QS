  section: 1
  number: 43
  type: single
  page: 4
  stem: 身為人類，如果有幸，被上帝分配生在北歐，你在呱呱墬地前就已開始享受照顧，母親懷孕期間免費健康檢查，每月有營養費，生產後產假一年半（帶薪），小孩出生到十八歲，每月可拿一百美元營養費，小學到大學學費全免。就業後有全民醫療保險，失業有津貼，退休後每個月可拿到最好待遇時的六成，這種從搖籃到墳墓的社福制度被稱作「北歐模式」，而關於這套模式運作的關鍵因素為何？
