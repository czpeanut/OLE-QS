  section: 1
  number: 4
  type: single
  page: 1
  stem: 古希臘文化不只有獨特的城邦政治，亦有諸多的文化特色，如宗教觀、文學與史學等方面的發展。有關古希臘宗教文化特色的敘述，下列何者正確？
