  group_stem: "In 1971, a group of teenagers in Canada started a 36-hour famine－no\
    \ food during the 36 hours－to get money or food to help the people in Ethiopia\
    \ in Africa. Today, a large number of people from all over the world have experienced\
    \ this activity. Not all the famines are the same in every country. New Zealand,\
    \ Australia, and South Africa hold a 40-hour famine; Taiwan, the United States\
    \ and Canada hold a 30-hour famine; the UK and South Korea hold a 24-hour famine;\
    \ the Philippines holds a 12-hour famine, and Hong Kong holds an 8-hour famine\
    \ for old people.\n  In 2006, the 17th year of the 30-hour famine in Taiwan, World\
    \ Vision Taiwan held the DIY Famine. From then on, you can invite a group of more\
    \ than 10 of your friends, classmates, family members, or co-workers, pick a time\
    \ and a place, and start planning your very own DIY famine.\n  If you are not\
    \ able to join a group, you are also welcome to hold a DIY famine at home. But\
    \ please note:\n◎Anyone younger than 18 must ask their parents first.\n◎During\
    \ the famine, make sure to have enough water or juice.\n◎Pregnant women or patients,\
    \ please do not join the famine.\n◎After finishing the famine, start with a light\
    \ meal.\n◎Children under twelve years old are not good for the famine. They can\
    \ give up on snacks for a day.\npregnant 懷孕的 patient 病患"
