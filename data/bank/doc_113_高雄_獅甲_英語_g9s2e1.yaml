  type: single
  page: 3
  stem: '36. “My blood type is less common than the other three types. I don’t eat
    much meat. I lose weight by eating vegetables and eggs.”

    What is this person’s blood type?'
  options:
  - label: A
    content: Type AB.
  - label: B
    content: Type O.
  - label: C
    content: Type A.
  - label: D
    content: Type B.
  group_stem: "(36 ~ 38)\nK-BOOK.COM\nEat According to Your Blood Type\nby Eric Carle\n\
    ★★★★☆ 4 out of 5 stars\nNT$250\n Dr. Carle believes that the foods people eat\
    \ react with their blood types. If people follow a diet according to their blood\
    \ types, they will get more energy, become healthier, and even lose weight.\n\
    1. Blood Type O\n People with blood type O can digest meat and vegetables well.\
    \ They should eat more beef, chicken, and fish if they want to lose weight. However,\
    \ eating rice and beans isn’t helpful at all.\n2. Blood Type A\n People with blood\
    \ type A should eat more fruit and vegetables if they want to lose weight. Meat\
    \ isn’t digested easily in their bodies, so they should eat less meat.\n3. Blood\
    \ Type B\n People with blood type B should eat fewer noodles because they make\
    \ them fat. Meat, milk, and vegetables are good for them to lose weight.\n4. Blood\
    \ Type AB\n Only 5% of the people around the world have blood type AB. The number\
    \ is much lower than types A, B, and O. It is healthier for them to eat vegetables,\
    \ fruit, and eggs to go on a diet, but they should eat less meat.\n according\
    \ to 根據 blood type 血型 react with 與……作用 diet 飲食 energy 能量"
