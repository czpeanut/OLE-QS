  - label: D
    content: A popular new fashion designer.  designer 設計師
  group_stem: "(39 ~ 41)\n Today’s lesson is going to cover something I had no interest\
    \ in until I started looking into it. Some people might already know a lot about\
    \ it, and others may have heard something about it sometimes. Still, some of you\
    \ may not know the word at all. What I’m talking about is the growing trend of\
    \ cosplay.\n Cosplay comes from the words costume and play. The people who take\
    \ part in it love it, and so do the people who are around and looking at them.\n\
    \ People who cosplay dress up as their favorite characters from movies, video\
    \ games, and comic books. Basically, they wear clothes, makeup, and other things\
    \ to make themselves look like those characters. Some people are so into it that\
    \ they walk, talk, and even act like those characters when they are in costume.\
    \ If they are really good, they can even win big prizes at cosplay events around\
    \ the world.\n What started as a hobby has now become a big part of popular culture\
    \ and the fashion world. We’ll see later on how the Internet brings cosplay to\
    \ people everywhere.\n trend 趨勢 cosplay 角色扮演 costume 服裝 take part in 參與 character\
    \ 角色 basically 基本上 makeup 化妝 culture 文化"
