    Betty：It is really exciting, __32.__? We finally get to choose who can work for
    the government. We get to pick who we want to make decisions for us and the country.

    May：It’s a big deal to me, __33.__. However, Donny doesn’t care. He just wants
    to focus on his studies and then get a good job.

    Betty：Hey, __34.__ Melanie. When I asked about it, she didn’t know what I was
    talking about.

    May：I did the same to Donny, and he didn’t, either. He had no idea that we would
    lose all our freedoms if we had a bad government.

    Betty：Yeah, and Melanie didn’t believe that her one vote was going to matter.

    May：They are so wrong! Every vote is important!

    Betty：I agree. Also, it’s our duty to make sure that the right people get chosen.
    I’m not going to pass that up.

    May：__35.__ I’m with you on that!

