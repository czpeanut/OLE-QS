- id: doc_113_基隆_銘傳_自然_g7s1e3_s2_48
  section: 2
  number: 48
  type: single
  page: 4
  stem: 上述三種學習行為應該與下列何種神經中樞最相關？
  options:
  - label: A
    content: 大腦
  - label: B
    content: 小腦
  - label: C
    content: 脊髓
  - label: D
    content: 腦幹。
  group_stem: '【閱讀題】

    鈴鈴在生物課上學到生物的行為有各種不同的樣貌，便趁著星閱讀課程到學校圖書館中查找需多跟動物行為有關係的資料。其中，有三位科學家的資料讓他印象深刻：

    (一)發現動物行為中的「制約反應」是俄國的巴夫洛夫，他發現狗經過訓練之後，能對一個原本不會產生反應的刺激產生行為反應。例如狗看到食物，會流口水，但是聽到鈴聲，卻不會流口水。若每次餵狗吃東西前都搖鈴，久而久之，當狗聽到鈴聲即使不給他食物，都會分泌唾液。顯然狗已將鈴聲與食物產生聯繫，巴夫洛夫認為行為是學習得來的，而且這樣的學習有神經系統做為基礎。

    (二)勞倫茲發現了「印痕」，指的是動物出生後的第一次學習，它會永遠留在腦海中。例如有些雁鴨從蛋殼孵出時，會把看到的第一個會動的東西當成媽媽，小鴨在發育的過程中，發展出對「媽媽」特徵的偏好，透過追隨的行為表現偏好。還有一些雁鴨會將首次聽到的聲音，當成媽媽的聲音。

    (三)丁伯亨發現海鷗雛鳥一生下來就展現「啄」的行為。雛鳥啄了母鳥喙上的紅點，鳥媽媽就會從胃裡吐些食物出來餵雛鳥吃。經過多次實驗，證明是母鳥鳥喙上的紅點引發「啄」的行為。丁伯亨把引發雛鳥「啄」的紅點稱為信號刺激。而丁伯亨也發現雛鳥飢餓時會把嘴張得很大，露出口腔內不停顫動的鮮艷舌頭，母鳥一看到這個菱形的血盆大口，便會飛出巢去尋找食物，再把找到的食物丟進菱形的口中，直到雛鳥閉嘴為止，換言之，雛鳥張大的菱形嘴巴是母鳥餵食行為的信號刺激。'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
