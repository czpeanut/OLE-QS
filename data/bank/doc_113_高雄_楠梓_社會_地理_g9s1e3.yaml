  stem: 「烏斯懷亞 」位於哪一個國家？
  options:
  - label: A
    content: 紐西蘭
  - label: B
    content: 澳洲
  - label: C
    content: 智利
  - label: D
    content: 南非共和國
  group_stem: '前往南極的幾個著名港口中，烏斯懷亞是最近的一個，距離南極只有970公里。這裏的一切都被印上〝世界盡頭〞或者〝世界最南端〞或者〝終點〞的標籤。烏斯懷亞既是世界的盡頭也是開始，因為雖然陸地上的道路終結了，前往南極的海上旅程卻是從這裏開始了。但每年只有3~4個月可以前往南極旅遊，其他時間並不適合踏上這冰封大地。

    (請參考《圖一》回答)'
