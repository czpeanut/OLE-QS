  section: 3
  number: 6
  type: single
  page: 1
  stem: 下列句子都使用了與軍事相關的「俗諺」，請依據文意判斷何者使用不正確？
  options:
  - label: A
    content: 在奧運金牌總教練的嚴格訓練下，這次比賽獲得的獎牌數超越歷年，可謂「勝敗乃兵家常事」
  - label: B
    content: 公司平時就需注重人才培育，因為「養兵千日，用在一時」，一旦有緊急狀況便能派上用場
  - label: C
    content: 在這次戰役中，我軍「攻其不備，出其不意」，痛擊敵軍，打了一次漂亮的勝仗
