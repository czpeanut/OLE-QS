  - label: D
    content: 1947 / 2019。
  group_stem: "（甲）紐西蘭是第一個擁有公民普選的國家，但直到1893 年的全民普選，才真正落實女性的投票權。至於印度，自獨立建國那年，女性就獲得投票權。然而72\
    \ 年過去了，2019 年的印度仍有2000 多萬女性無法投票。印度女權發展緩慢，印度女性卻對政治參與非常熱衷。女性投票率從1980 年的51％上升到2014\
    \ 年的67％，但由於重男輕女的文化，也有些家庭因保守的文化民情，不想將女兒的照片提供給政府公開在投票名單公告中展示，而拒絕讓女兒登記投票。 \n（乙）美國婦女參政權的追求始於19\
    \ 世紀40 年代，1848 年召開首次婦女權利大會，會中雖然通過婦女參政的決議，卻直到20 世紀才得以實踐。沙烏地阿拉伯在2015 年宣布給予女性投票權。在沙烏地阿拉伯，女性不能開車，在公眾場合必須穿著全身的罩袍，當地也是全球最晚給女性投票權的國家。但直到2017\
    \ 年才宣布女性可以不用取得家中男性監護人的同意，就能讀大學、找工作、開車。與阿富汗、阿曼以及尚吉巴島的女性一樣，沙烏地阿拉伯的女性仍受限於男性監護人的意見，無法自由做出政治選擇。\
    \ \n（丙） \n| 國別 | 建國年分 | 女性擁有投票權年分 |\n| --- | --- | --- |\n| 紐西蘭 | 1841 | 1893\
    \ |\n| 印度 | ① | ② |\n| 美國 | 1776 | 1920 |\n| 沙烏地阿拉伯 | 1932 | 2015 |"
