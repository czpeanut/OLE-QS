  section: 1
  number: 44
  type: single
  page: 5
  stem: 藉由元素 X 於週期表中所在位置判斷，關於其化學性質的敘述下列何者正確？
  options:
  - label: A
    content: 與鉀元素化學性質相似
  - label: B
    content: 應具有金屬元素的特性
  - label: C
    content: 化學性質非常穩定，又稱鈍氣
  - label: D
    content: 兼具金屬與非金屬的特性，又稱為半導體
  group_stem: '科普新知：元素週期表有沒有盡頭？

    下圖(一)是元素週期表的部分資訊，表中所列的數字為原子序，部分空格尚未填入原子序。已知某元素 X，其中性原子的原子核中含有 20 個質子、20 個中子，原子核外含有
    20 個電子。

    話說 2016 年 6 月 8 日，IUPAC 正式公布了 4 種新發現元素的名稱如下圖(二)：113 號元素 Nihonium（Nh）、115號元素 Moscovium（Mc）、117
    號元素 Tennessine（Ts）和 118 號元素 Oganesson（Og），這意味著元素週期表的第七週期將全部填滿，元素週期表總共已經有 118 個元素了。

    其中，113 號元素是首個被亞洲國家率先發現的新元素，日本理化學研究所森田浩介團隊最終使用了日本國名的日語發音來命名之「日本元素」(Nihonium，Nh)。日本是首個發現新元素的亞洲國家，日本科研界認為這一成果可比肩榮獲諾貝爾獎。如今，核物理學家已經在嘗試製造第
    119 號與 120 號元素了。而這將打開元素週期表的第八週期，也激起人們的好奇，元素週期表到底有沒有盡頭？

    參考資料：https://kknews.cc/science/lpjxk2.html'
