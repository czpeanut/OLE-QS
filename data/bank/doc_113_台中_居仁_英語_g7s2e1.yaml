  group_stem: '(6-10) (from Live ABC)

    Music is very powerful. It calms us and gives us energy. Because of this, music
    is often used to treat mind and body problems. This is called music therapy, and
    it uses different kinds of music and tools. Music therapists help people with
    special needs. These can include problems with talking, learning, or moving. They
    also help with more serious problems, like pain, stress, or cancer. Music therapists
    work with patients in different ways. One way is by having patients listen to
    music. When the music plays, the therapist might guide them in breathing or moving
    actions. Afterward, they might talk about how the music made them feel.'
  ai_answers:
