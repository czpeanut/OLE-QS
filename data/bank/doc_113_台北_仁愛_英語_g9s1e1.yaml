  - label: A
    content: Hair shines better when it is wet.
  - label: B
    content: Ladies need a hairdryer more than gentlemen.
  - label: C
    content: People sat close to a fire around 1890 to blow dry their hair.
  - label: D
    content: A hairdryer is good to warm up one’s bed on a cold day.
  group_stem: '(I)

    Can you imagine that people used to dry their hair with hot

    air from a stove?  That was what they did more than a hundred

    years ago.  Instead of staying home doing housework, more and

    more women in the1880s started to work in a business like men,

    and they had to get ready early every morning.  Not only that,

    when joining parties or having social life with friends, ladies

    needed to have nice looks with fine hairstyles.  What people had

    to do long ago, was to sit outside in the sun and brush their hair

    until it was dry.  However, the weather in big cities like Paris or

    London was often cold and humid.  With wet hair, people got

    headaches and nose problems

    easily.  That was why a French

    hairdresser, Alexandre-Ferdinand

    Godefroy, first came up with the

    idea of a hairdryer in 1888.  And

    the idea at that time was simple:

    some hot air from a stove, a tube,

    and a chair to sit on.

    Today, people use a hairdryer

    almost every day.  However, there

    might be better ways to use one.

    Say for example, you want to dry

    your scalp first and foremost so

    you do not have skin problems.

    Also, it is better not to dry all your

    hair at one time if you have long or a good head of hair.  Cool

    wind is always better if you already have split ends.  Be careful

    that going to bed with humid hair may damage it because dry hair

    rubs against with your pillow less, and your hair stay smooth

    more easily when it is dry.

    Are those what all we can do with a hairdryer?  Of course

    not.  Doctors are suggesting using a hairdryer when a person is

    feeling sick.  When having a headache or a stuffed nose, you

    might want to keep a hairdryer blowing around your back or neck

    for a while.  If the knee problem is bothering to the elders in your

    family, it is also a good idea to have some warm airflow around

    the sore area for a couple of minutes on a cold day.  In a word, a

    hairdryer is a good idea not only for beauty but also for one’s

    health.

    Picture Credit: from 1900 Encyclopedie Larousse Illustree


