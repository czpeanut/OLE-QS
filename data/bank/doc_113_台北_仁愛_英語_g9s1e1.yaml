  stem: 38. What is the first paragraph mainly about?    paragraph 段落
  options:
  - label: A
    content: Where to get donuts in Taiwan.
  - label: B
    content: Donuts are popular all over the world.
  - label: C
    content: The ways people baked and shaped donuts.
  - label: D
    content: How much people spend on donuts.
  group_stem: '(II)

    National Donut Day

    We can see donuts(doughnuts) in nearly every bakery

    around the world. In the USA alone, people eat 10 billion donuts

    every year and in Taiwan’s night markets, people line up for them.

    Besides being a popular snack, donuts have played a part in

    history and there’s even a national donut day!

    Soon after America joined World War I in 1917, the

    Salvation Army, a charitable organization, sent about 250

    volunteers to France to help the American soldiers there. The

    women volunteers at each workstation gave baked bread and

    coffee to the soldiers and repaired their clothes. Two of them

    came up with the idea of making donuts—they even fried them in

    oil inside soldiers’ metal helmets(something put on the head)

    because they didn''t have the tools they needed.  The soldiers

    loved the donuts so much that the snack was a hit at that time.

    Therefore, people called these women “Doughnut Dollies”.

    In 1938, the Salvation Army started National Donut Day

    to raise money for people in need and to honor the help of the

    “Doughnut Dollies”. Today, people celebrate it on the first Friday

    of June in the USA and some other countries. On this day, many

    bakeries and coffee shops in the USA give free donuts to

    customers.  We can say that donuts are a yummy snack with an

    interesting history!

