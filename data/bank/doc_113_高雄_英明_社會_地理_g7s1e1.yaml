  type: single
  page: 3
  stem: 領空飛越權是指允許他國班機不著陸的情況下，飛越本國領空的權限。若雙方協議後，外籍班機須繳交過境航路服務費。臺灣國土小，採取按次收費，外籍班機通過一次收一萬元。由於臺灣飛日、韓和菲律賓、越南、馬來西亞、新加坡等國平均不到4
    小時，良好的位置條件大大增加了外籍班機飛行通過的次數，過去甚至創下一年收入24 億元的紀錄。請問：上文中指的「良好的位置條件」為下列何者？
  options:
  - label: A
    content: 臺灣位於120°E 的時區範圍內
  - label: B
    content: 臺灣處於聯繫東北亞和東南亞的樞紐位置
  - label: C
    content: 臺灣位處寒、暖流交會的地點
  - label: D
    content: 臺灣地處熱帶和副熱帶氣候的交界
