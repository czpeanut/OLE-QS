- id: doc_113_台中_四育_自然_g8s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 我們用 pH 值來表示水溶液的酸鹼程度。pH 值小於 7 表示越酸（像醋或果汁），pH 值大於 7 表示越鹼（像肥皂水或小蘇打水）。pH = 7 表示是中性的（乾淨的水）。下列關於
    pH 值的說法，哪一個是正確的？
  options:
  - label: A
    content: 喝起來酸酸的果汁，pH 值一定大於 7。
  - label: B
    content: pH 值是 7 的水，摸起來一定滑滑的。
  - label: C
    content: 如果一種水溶液的 pH 值小於 7，那麼它就是酸性的。
  - label: D
    content: 家裡用的肥皂水，pH 值通常小於 7。
