- id: doc_113_台中_四育_自然_g8s2e2_s1_31
  section: 1
  number: 31
  type: single
  page: 3
  stem: '你知道在一定的溫度下，100 毫升的水最多可以溶解 36 公克的鹽。

    小明在 50 毫升的水裡加了 12 公克的鹽，發現鹽全部都溶化了。

    他又再加了 4 公克的鹽進去，並且把杯子用蓋子蓋起來。

    在加了後面這 4 公克的鹽以後，關於這杯水裡，鹽從固體溶化到水中的速度，跟鹽從水中跑出來變回固體的速度相比，下列哪一個說法是合理的？'
