- id: doc_113_台中_四育_自然_g8s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 我們家裡或生活中常常會看到一些白色的粉末或材料，它們有不同的用途和性質。下列關於這些白色物質的敘述，哪一個是正確的？
  options:
  - label: A
    content: 在家裡烤餅乾時，常常會加洗衣服用的那種蘇打粉（碳酸鈉）進去，讓餅乾膨脹變鬆軟。
  - label: B
    content: 醫生幫骨折病人打的白色石膏，主要成分是大理石磨成的粉（碳酸鈣）。
  - label: C
    content: 蓋房子時，把白色粉末狀的硫酸鈣直接拿來當水泥用。
  - label: D
    content: 小蘇打（碳酸氫鈉）和洗衣服用的那種蘇打粉（碳酸鈉），最主要的差別在於，小蘇打加熱時會產生氣體讓東西膨脹，而洗衣服那種蘇打粉則不會。
