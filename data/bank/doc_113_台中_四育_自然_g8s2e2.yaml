  stem: 做麵包或饅頭時，讓麵糰發酵是一個很重要的步驟。如果用天然酵母，在冬天溫度比較低的時候，麵糰會發酵得非常慢。這時候，很多人會用麵糰發酵機，把麵糰放在裡面，設定一個溫暖的溫度來幫助發酵。這樣一來，麵糰的發酵速度就變快很多了。請問，從影響發酵速度的角度來看，發酵機提供溫暖的溫度讓麵糰發酵得更快，這是因為溫度升高會造成下列哪一種情況？
