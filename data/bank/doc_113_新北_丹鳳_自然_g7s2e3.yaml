  group_stem: '蓋斑鬥魚常見於鄉間的稻田和池塘。雄魚體色鮮豔，在清明節前後，背、腹、尾鰭會延長至原來體長1 倍左右，身上鱗片會散發紅、藍光澤，相當美麗。雌魚體色較暗，尾鰭較短，和雄魚相差甚多。繁殖期間雄魚會固守自家領域，驅逐其他雄魚，並且在水面上不斷的吐出氣泡築成泡泡巢。等受精完成後，雄魚會將魚卵啣至泡泡巢孵化。孵化期間雄魚還會負責守護魚卵的工作，驅趕想接近泡泡巢的雌魚，免得被貪吃的雌魚把魚卵給吃了，所以幼魚的存活率約有5
    成，繁殖飼養均相當容易。

    蓋斑鬥魚的鰓上還有一種叫做「迷器」的呼吸輔助器官，因此當其他魚類必須靠近水面呼吸時，牠還能夠在氧氣濃度很低的水中生存。蓋斑鬥魚可在4℃到38℃的水溫中存活，喜歡吃昆蟲或孑孓。一尾體重約0.6
    克重的蓋斑鬥魚1 天可吞食300 隻孑孓或蛹，因此大量繁殖蓋斑鬥魚可有效防治病媒蚊。'
