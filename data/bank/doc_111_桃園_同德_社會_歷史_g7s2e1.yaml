  group_stem: 臺灣製糖株式會社（簡稱臺糖）是臺灣日治時期由三井財團所創立的製糖會社；該會社在今日的高雄興建全臺第一座新式糖廠----橋仔頭糖廠，可說是臺灣新式製糖業的始祖。新式糖廠以現代化的機械來榨糖，生產效率大幅提升。另外，總督府為配合「工業日本，農業臺灣」政策，以資金補助、指定原料採收區，以及保護市場等獎勵措施，吸引更多日本企業家來臺投資，使臺灣的糖業快速發展，但蔗農並未能享受糖業發展的成果。
