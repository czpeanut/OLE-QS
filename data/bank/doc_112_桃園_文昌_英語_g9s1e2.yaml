  stem: 29. The zoo is providing some choices for the public to name the new-born
    giraffe.  Which might NOT be on the list?
  options:
  - label: A
    content: Kipekee - Special
  - label: B
    content: Shakiri – She is the most beautiful
  - label: C
    content: Kawaida - Common
  - label: D
    content: Jamella – One of great beauty
  group_stem: "Brights Zoo in Limestone, Tennessee is celebrating the birth of a very\
    \ unusual baby giraffe.  What makes this giraffe special is that it \ndoesn’t\
    \ have any spots.  The zoo is asking for help from the public to name the animal.\
    \  \n    Tall, long-necked giraffes are famous for their spots.  A giraffe’s spots\
    \ are created when the animal is still growing inside its mother.  \nThe spots\
    \ are believed to help the animals hide from their enemies.  The skin below the\
    \ spots may also help giraffes stay at the right \ntemperature.  Just like no\
    \ two persons have the same fingerprints, each giraffe has its own special spots.\
    \   \nOn July 31, 2023, a baby giraffe was born at Brights Zoo with no spots at\
    \ all.  Instead, its hair is a light brown.  It was born \nperfectly healthy.\
    \  It just doesn’t have any spots.  The young giraffe is believed to be the only\
    \ spotless giraffe in the world.  Mr. Bright, \nthe zoo keeper, says that the\
    \ new giraffe might not have been alive if it had been born in the wild.  Brights\
    \ Zoo is hoping to use the young \nspotless giraffe to bring attention to protect\
    \ giraffes.  Mr. Bright says the zoo hopes to raise money for groups like Save\
    \ Giraffes Now and \nthe Giraffe Conservation Foundation.   \nSo far, the young\
    \ giraffe has not been given a name.  Mr. Bright says that his family has thought\
    \ up thousands of names, and has \ncome up with four possible choices.  All of\
    \ the names are in Swahili, a language spoken in parts of Africa.  The zoo will\
    \ present the \nwinning name later.  \nspot 斑點    enemy 敵人    skin 皮膚    temperature\
    \ 溫度     fingerprint 指紋    alive 活著的    wild 荒野    protect 保護"
