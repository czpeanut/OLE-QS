  group_stem: "Thor Pedersen is a Danish traveler.  He recently finished a trip around\
    \ the world.  However, this wasn’t just any trip.  He spent \nnearly ten years\
    \ visiting every country in the world - and he did it all without flying. \n \
    \   As Thor began to plan his trip, he made a few rules; no flying, no visiting\
    \ home, and spend at least 24 hours in every country.  He \nhoped that he could\
    \ live on about $20 a day, and finish his trip in about 4 years.  Actually, it\
    \ took him far longer.  \n    The first part of his trip was pretty easy.  He\
    \ traveled across Europe and North America.  But as he moved on to other parts\
    \ of the \nworld, things began to get much harder.  To cross large bodies of water,\
    \ Mr. Pedersen took boats.  Besides, he traveled by taxi, bus, train, \nand even\
    \ walking.  Sometimes he paid for a place to stay; sometimes people invited him\
    \ into their homes.  At other times, he had to sleep \noutside.  Mr. Pedersen\
    \ says he had many difficult experiences.  He was once held at gunpoint and thought\
    \ he might be killed.  On the \nother hand, he also had many good experiences.\
    \  Thor says why he didn’t give up was the help from people all over the world.\
    \  \n    Mr. Pedersen’s girlfriend visited him several times as he traveled. \
    \ When she visited him in Kenya, he asked her to marry him.  But \nbefore they\
    \ could get married, the coronavirus pandemic began.  Therefore, Mr. Pedersen\
    \ got stuck in Hong Kong for two years.  \nLuckily, after getting married online,\
    \ his wife was able to join him for part of that time.  Finally, Mr. Pedersen\
    \ arrived back in Denmark \nafter a 33-day boat ride.  He was met by about 150\
    \ people, including friends and family members.   \n    Mr. Pedersen has covered\
    \ around 260,000 miles – about 10 times the distance around the Earth.  Later,\
    \ he plans to write a book and \nshare what he learned in his travels around the\
    \ world.  \ntraveler 旅行者    gunpoint 槍口    coronavirus pandemic 冠狀病毒大流行    stuck\
    \ (stick 的過去分詞) 困住 \nincluding 包括    distance 距離"
