  stem: 31. Which was NOT the reason the publisher changed some words of Roald Dahl’s
    book?
  options:
  - label: A
    content: To limit Roald Dahl’s way to write stories.
  - label: B
    content: To let these books be enjoyed by all people.
  - label: C
    content: To make words more hurtless to people.
  - label: D
    content: To have these stories avoid covering something insulting.
  group_stem: "A book company in the United Kingdom (UK) has been criticized for changing\
    \ the words in some of Roald Dahl’s famous \nchildren’s books.  The publisher\
    \ said it wanted to make sure the books could “be enjoyed by all.”  But many people\
    \ were mad by \nthese changes. \n    Roald Dahl was a popular British writer.\
    \  He wrote many books for children.  Several of his books have been made into\
    \ \nmovies.  Mr. Dahl’s stories are often meant to be funny.  The books have unusual\
    \ characters, and subjects are common.  Many of \nMr. Dahl’s stories are about\
    \ chlidren, and the children are smarter than grownups.  Some grownups in his\
    \ books are hateful, and \nthey treat children badly.  His stories have been enjoyed\
    \ by millions of young readers.  But some people believe that some of Mr. \nDahl’s\
    \ books could also be insulting – especially how he shows some characters. \n\
    \    The book company, Puffin, changed Mr. Dahl’s books, so these books wouldn’t\
    \ cover anything insulting.  The English \nnewspaper, the Daily Telegraph, reported\
    \ that Puffin had created new of many of Mr. Dahl’s books with “hundreds of changes.”\
    \  \nFor example, the word “fat” was taken out of the books.  So were the words\
    \ “ugly” and “crazy.”  Instead of “boys and girls,” the \nnew books use the word\
    \ “children.”  Instead of “mothers” or “fathers,” the new books talk about “parents”\
    \ or “family.”  Though \nPuffin made the changes to avoid insults, the changes\
    \ in the new books have made many people angry.  They say the changes limit \n\
    the freedom of writers to tell stories in their own ways.  \nIn response, Puffin\
    \ has said that it will now also publish the old books as “The Roald Dahl Classic\
    \ Collection.”  The readers will \nbe able to choose which version of the stories\
    \ they want to buy. \ncriticize 批評     publish 出版     character 角色     insult\
    \ 侮辱     avoid 避免     response 回應    version 版本"
