  section: 1
  number: 31
  type: single
  page: 1
  stem: 行政院為處理選舉與公投合併所產生的缺失，提出《公民投票法》修正草案。此草案須先交由立法院開會討論三讀通過，總統公布後，行政機關才能依法執行。從上述內容可見民主國家政府間運作的何種概念？
    【習作】
  options:
  - label: A
    content: 以民為主
  - label: B
    content: 權力分立
  - label: C
    content: 覆議流程
  - label: D
    content: 政黨政治
  answer:
  - B
  answer_source: answer_key_vlm
- id: doc_112_高雄_林園_社會_公民_g8s1e2_s1_32
  section: 1
  number: 32
  type: single
  page: 1
  stem: '下表為幸福國近幾年的中央政府總預算、刪減預算金額及刪減比例之資料。若依表中內容及我國中央政府職權判斷，下列敘述何者正確？【習作】

    單位：幸福幣

    | 年度(西元) | (甲)提出預算金額 | (乙)刪減預算金額 | (丙)刪減比例 |

    | :--- | :--- | :--- | :--- |

    | 2017 | 1,200,000,000 | 17,790,000 | 1.5% |

    | 2018 | 1,240,000,000 | 20,000,000 | 1.6% |

    | 2019 | 1,500,000,000 | 20,000,000 | 1.3% |

    | 2020 | 1,600,000,000 | 80,000,000 | 5% |'
  options:
  - label: A
    content: (甲)資料是由司法院提出，並交由監察院審核
  - label: B
    content: (乙)是經由監察院審查後，所做出的調整結果
  - label: C
    content: 根據(丙)判斷，2020 年行政院可能提出覆議案
  - label: D
    content: 未來執行以後，應做成決算交由考試院來審查
  answer:
  - C
  answer_source: answer_key_vlm
- id: doc_112_高雄_林園_社會_公民_g8s1e2_s1_33
  section: 1
  number: 33
  type: single
  page: 1
  stem: '小禾安排寒假旅遊時，發現了下列的補助方案。請根據方案內容推論，地方政府應具有以下何種職權？【習作】

    擴大秋冬國民旅遊—交通部獎助方案

    2019/09～2020/01 最高領 2,000！

    ★自由行住宿優惠

    1.每房1,000元   2.每週6天(週日到週五適用)

    ★加碼方案〃離島多優惠1次

    1.每房1,000元    2.不分帄假日皆適用

    另外，去年暖冬旅遊補助申請由中央政府統一核銷，審核時間將近3 至4 個月，讓配合的旅宿業者苦等良久，今年則改由地方政府負責審查民宿業者參與資格及受理補助申請，期待能更有效率的刺激國內觀光，讓國人玩得開心。'
  options:
  - label: A
    content: 執行上級委辦事項
  - label: B
    content: 辦理地方自治事項
  - label: C
    content: 審議地方法規預算
  - label: D
    content: 監督行政機關施政
  answer:
  - A
  answer_source: answer_key_vlm
