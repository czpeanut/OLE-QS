    一個女兒在父親面前頻頻抱怨，這個事情做不完、那個事情又做不好。

    她的父親是一位有名的廚師。他把女兒帶進廚房，先往三把鍋裡倒入一些水，然後把它們放在旺火上燒。不久鍋裡的火燒開了。他往一隻鍋裡放些胡蘿蔔，第二隻鍋裡放入雞蛋，最後一隻鍋裡放入碾成粉狀的咖啡豆。他將它們浸入開水中煮，大約二十分鐘後，把火熄了，把胡蘿蔔撈出來，放入一個碗內，再把雞蛋撈出來放入另一個碗內，然後又把咖啡舀到一個杯子裡。父親解釋說，這三樣東西同樣面臨沸水的煎熬，但它們的反應都各不相同。

    胡蘿蔔是「由硬變軟」──入鍋前是結實的，毫不示弱；但進入開水後，變軟、變弱了。

    生雞蛋是「由軟變硬」──本來由薄薄的外殼保護液體的內臟，開水一煮，內臟變硬了。

    咖啡則是「改變水質」──粉狀咖啡豆在一進入熱水後，它們倒改變了水的外型和內容。

    於是，廚師爸爸就告訴她，不論遇到什麼難局都不要抱怨，也無需難過，不妨想一想這三樣東西。在艱難和逆境面前，妳可以當胡蘿蔔，也可以當雞蛋，更可以當咖啡豆。'
