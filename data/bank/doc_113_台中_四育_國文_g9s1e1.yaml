  stem: 文中提到「供神祭祖」和「平常吃的」紅豆糕的差別，分別為何？
  options:
  - label: A
    content: 相同，並無差別
  - label: B
    content: 以棗子蓮子擺出花造型／鑲紅棗、撒上桂圓末
  - label: C
    content: 鑲紅棗、撒上桂圓末／以棗子蓮子擺出花造型
  - label: D
    content: 加上老酒提味／為了方便給孩子吃故不加酒提味
  group_stem: "請閱讀以下短文，並回答34 ～ 35 題：\n        供菩薩和祖先的，母親就仔仔細細在糕的面上，用棗子蓮子擺出一朵花兒來。普通吃的就只在正中央鑲一粒紅棗，再撒點桂圓碎末子意思意思，我抱怨說：「這麼點兒香料，連小麻雀都瞧不上眼呢。」母親生氣地說：「走開走開，過年過節的，小孩子不准在邊上亂說話。」我有個頑皮的小叔叔，文才很好，他就吟詩隨口地讚美起來：「這叫做『_____________』。」母親聽了高興地說：「對啦，就是這一點點心意嘛。」小叔趁機攤開黑漆的髒手掌心說：「大嫂，先給我一塊嘗嘗嘛，回頭我幫您刷蒸籠。」母親笑罵道：「你幾時幫我刷過蒸籠，倒是幫我清過酒壺呢。」因為小叔時常乘母親不備，偷碗櫥裡的老酒喝。我也跟著一起品嘗。母親罵歸罵，還是用菜刀切了糕，分我們一人一塊。哦，好香軟，好好吃呢。那股香甜味兒，至今還留在齒頰間。\
    \                                                                            \
    \ （琦君 紅豆糕）"
