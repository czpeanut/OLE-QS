- id: doc_113_台中_四育_國文_g9s1e1_s2_28
  section: 2
  number: 28
  type: single
  page: 3
  stem: 關於小姜的敘述，下列何者正確？
  options:
  - label: A
    content: 經常奉獻己力，服務社會上的弱勢
  - label: B
    content: 樂觀開朗，喜歡高談闊論
  - label: C
    content: 在老人院工作，與老人一同吃飯
  - label: D
    content: 綽號來自家中的梅乾菜燒肉很有名
  group_stem: "請閱讀以下短文，並回答28 ～ 29 題：\n        我服務的公司常常捐錢給慈善機構，雖然錢捐得不多，可是老闆卻總要派人先去看一下這些慈善機構。這次老闆考慮要不要捐錢給一個老人院，我是公司的總經理，就被派去參觀一下。老人院裡全是窮人，沒有親人照顧，當然也不交任何費用。老人院的支出全靠社會熱心人士的捐款，也有很多的義工來幫忙。\n\
    \  就在我四處張望時，一位替老人餵食的中年人忽然叫我「李家同」，我感到他有點面善，可是怎麼樣也想不起來他是誰。他看到我的迷惘表情，索性自我介紹了：「你一定不認得我了，我是梅乾菜小姜」。這一下我記起來了，小姜是我大學的同學，一位成天快快樂樂的小子。他好吃，而且特別喜歡梅乾菜燒肉，我們因此給他取了一個綽號「梅乾菜小姜」。他是一位普普通通的人，也沒有什麼驚人的言論，唯一和大家不同的是他很喜歡替窮人服務。\n\
    \  小姜衣著非常的破舊，沒有襪子，一雙便宜的涼鞋。他看到我，高興得不得了，可是他一定要我等他工作完畢以後才能和我聊天。等所有的老人吃過以後，小姜也吃飯了。我注意到他吃的是老人吃剩的飯和菜，心中正在納悶，老人院的負責人過來向我解釋：「李先生，姜修士參加的修會很特別，他們好像只吃別人剩下的菜飯，姜修士飯量很大，而且我們感到他很好吃，一再給他準備好的飯菜，他都拒絕，只有除夕在吃年夜飯的那一頓，他會和我們大家一起吃，看到他一年一次的大吃大喝，平時只肯吃剩菜，我們都難過得不得了，可是一點辦法也沒有。」\n\
    \  我問他為什麼要如此刻苦？小姜說他過去常去服務窮人，總覺得和他們格格不入，有一種由上而下的感覺。虧得在印度，發現了這個修會，他們不僅要服務窮人，也要使自己變成了窮人，自從他參加了這個修會以後，他的服務工作順利多了。他說他過去替窮苦的老人洗澡的時候，常覺得不自然，現在已經完全沒有這種感覺了。\n\
    \  我和小姜殷殷道別，他要趕去替流浪漢服務，我識相的不用我的豪華轎車送他，畢竟他已非常不習慣乘坐私人汽車了。我要找汽車的鑰匙，偏偏拿出了一大堆別的鑰匙。到最後才拿出車子的鑰匙，小姜站在旁邊看到我一串一串的鑰匙拿出來，覺得好有趣，他拍了一下我的肩膀：「小李，搞什麼名堂，怎麼會有這麼多的鑰匙？」\n\
    \  小姜走了以後，我站在街上發呆。我的確擁有好多的鑰匙，這些鑰匙都代表我的社會地位。比方說，我的車鑰匙鍍了一種特別的金屬，上面還刻了我的名字；我打高爾球的俱樂部裡，特別給我一把鑰匙，表示我是他們的特級會員，可以使用他們的貴賓室；我做了總經理以後，又拿到了一把總經理專用洗手間的鑰匙。\n\
    \  小姜呢？他一把鑰匙也沒有，可是如果今夜他出了車禍，天使一定會從天降下，將一把開啓天國之門的鑰匙給他。我擁有這麼多足以讓我炫耀自己社會地位的鑰匙，可就缺了這最重要的一把。\
    \                            （改寫自李家同 鑰匙）"
