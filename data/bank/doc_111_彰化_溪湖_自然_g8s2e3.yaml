  stem: 近年來，坊間興起一股自製手工皂的風潮，手工皂標榜較為天然、溫和、不傷肌膚。手工皂製造的基本原理就是皂化反應，製作時可以選用自己喜歡的油脂、精油等，並可用反應後剩下的油脂來護膚。雖然自製手工皂比較耗時，但既能客製化，成分也相當清楚，因此仍深受許多人的喜愛。有些手工皂在製造過程中，並不加入酒精，也不使用飽和食鹽水鹽析，而是皂化後長時間放置，繼續進行更完全的皂化，這種手工皂和一般肥皂相比時，其甘油的含量如何?洗淨效果又有何差異?
