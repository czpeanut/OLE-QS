- id: doc_111_彰化_溪湖_自然_g8s2e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 為避免攝取過量咖啡因，可先降低咖啡豆中的咖啡因含量。將咖啡豆浸泡在有機溶劑中，咖啡因會溶於溶劑中，之後取出咖啡豆加熱，使溶劑揮發掉。二氯甲烷是過往常用的有機溶劑，去除咖啡因效果好又易揮發，但後來因安全疑慮而棄用，並改用乙酸乙酯。因為酯類_______，所以較無安全性疑慮，美國食品藥物管理局許可使用乙酸乙酯來去除咖啡因，且無明定殘留許可標準。依據上述資訊，畫線處最適合填入下列何者?
  options:
  - label: A
    content: 只由碳和氫兩種原子所組成
  - label: B
    content: 是香蕉、柳丁等水果就含有的物質
  - label: C
    content: 沸點比二氯甲烷高，而不易揮發去除
  - label: D
    content: 是油脂與鹼性物質進行皂化反應後的產物。
  tags:
