- id: doc_111_高雄_林園_英語_g7s2e2_s6_24
  section: 6
  number: 24
  type: single
  page: 6
  stem: How many cows with painted eyes on their butts are killed by lions in Jordan’s
    four-year study?
  options:
  - label: A
    content: '0.'
  - label: B
    content: '543.'
  - label: C
    content: '683.'
  - label: D
    content: over 2,000.
  group_stem: 'Painted Eyes Save Cows

    You are a farmer and keep hundreds of cows. But, lots of lions come and eat your
    cows. What can you do to save your cows? Many people would（可能會）hunt（獵殺）the lions.
    This is what farmers in the Okavango Delta area in Botswana used to（過去常常）do. They
    shot（射殺）the lions with guns（槍）, but “the problem” did not go away. For many years,
    cows died（死亡）because of lions, and lions died because of people. The number of
    lions in Africa（非洲）goes down from more than（多於）100, 000 in the 1990s to lower（低於）than
    30, 000 in 2020.

    Luckily, Neil Jordan, an Australian biologist（澳洲生物學家）, thinks of a smart idea
    to save both cows and lions – painting eyes on cow butts（臀部）. In his four-year
    study, he follows over 2,000 cows at 14 different farms in the Okavango area.
    There are 683 with eye-painted butts, 543 with “X” painted on their butts, and
    835 painted nothing. The study shows that no cows from the butt-painted group
    are killed（被殺）by lions. Jordan is not surprised. He knows before the study that
    lions don’t hunt if（如果）they think someone is looking at them.

    Now, farmers in Botswana don’t need to shoot（射殺）lions any more. Sometimes the
    best way to solve（解決）a problem is not to “kill” it but to understand（理解）it and
    “live” in peace with it'
