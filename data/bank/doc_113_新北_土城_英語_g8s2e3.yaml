- id: doc_113_新北_土城_英語_g8s2e3_s6_50
  section: 6
  number: 50
  type: single
  page: 4
  stem: What does the word “echolocation” mean in the reading?
  options:
  - label: A
    content: A skill to find food by using light.
  - label: B
    content: A kind of whale language(語言) to talk to each other.
  - label: C
    content: A special sound to scare other sea animals.
  - label: D
    content: A way to find things with sound.
  group_stem: '(四) Question 50-52:

    Whale Songs and Sound Science

    Background knowledge

    Have you ever thought about how whales talk to each other in the ocean? Whales
    do not have vocal cords like humans, but they can still make different kinds of
    sounds, such as clicks, whistles, and songs. These sounds help them communicate,
    find food, and even call a mate.

    In air, sound travels more than 300 meters every second (about 750 miles per hour).
    But in water, sound moves five times faster, about 1,500 meters every second.
    That’s why whales can send sounds over thousands of kilometers in the ocean and
    other whales can hear them from far away.

    Whales have a very good sense of hearing. They use a skill called echolocation
    to find out where things are. They send out sound waves, and when these waves
    hit something, they bounce back. This helps whales know what is around them, even
    in the dark.

    Science activity

    Sound travels at different speeds in different materials. Look at the table on
    the right to see how fast sound moves in each one. Use the information in the
    table to decide which of the statements below are true.


    | Material | Speed of sound (meters per second) |

    |---|---|

    | Cold air | 330 |

    | Warm air | 350 |

    | Fresh water | 1,410 |

    | Ocean water | 1,540 |

    | Steel | 5,060 |

    | Granite rock | 6,000 |


    True or False Statements:

    ☐ Whales in the ocean hear sounds more quickly than goldfish in a lake.

    ☐ It is easier to hear sounds in winter than in summer.

    ☐ Railway workers hear the horn of a coming train before they hear the vibrations
    it makes in the steel rails.

    ☐ You hear sounds more quickly in air than in water.

    ☐ It is possible to hear sounds through rocks.

    vocal cords 聲帶 / communicate 交流 / speed 速度 / materials 物質 / railway 鐵路 / horn
    號角聲 / vibrations 震動 / travel 行進'
