  group_stem: '(一) Question 41-43:

    Leo: Bob, guess what? I saw a really funny video about Neil the seal!

    Bob: Oh, Neil! The one likes to sleep on roads? He''s so cute!

    Leo: Yeah! He was taking a nap right in front of someone''s garage. The person
    couldn''t drive their car out!

    Bob: Haha, that''s just like him. He''s very big, right? How much does he weigh?

    Leo: Over 4,000 kilograms! That''s why he looks so huge when he''s lying there.

    Bob: Wow! No wonder people have to wait for him. Does he ever get angry?

    Leo: Not really. Wildlife officers say he''s just resting. They always tell people
    to stay far away and not bother him.

    Bob: That''s important. Even if he looks friendly, he''s still a wild animal.

    Leo: Right! He''s a big star in Tasmania. Many tourists want to see him, but officers
    keep them safe.

    seal 海豹 / nap 打盹 / weigh 有…重 / huge 巨大的 / tourist 遊客 / wild 野生的


    This is a post from Instagram about Neil the seal.


    Hi friends,

    Many people ask me why I come onto land. Actually, it''s normal for me and other
    seals. I''m about 3 years old. I come to land to rest and to change my skin. I
    do this about twice a year.

    When I change my skin here in Tasmania, it''s good for the environment. My seal
    friends also leave a lot of old hair behind. Sometimes it''s 70cm deep! That''s
    a lot of hair!

    So, you can see I''m not strange!

    Neil


    skin 皮膚；毛皮'
