- id: doc_113_台中_向上_自然_g7s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: 進行實驗時，必須遵守實驗室的安全守則，請問下列實驗操作何者正確？
  options:
  - label: A
    content: 量筒具有刻度可測量液體體積，但不可以直接配置藥品
  - label: B
    content: 實驗使用剩餘的藥劑，直接於水槽沖洗乾淨，以免汙染實驗環境
  - label: C
    content: 點燃的酒精燈不用時，直接以口吹熄即可
  - label: D
    content: 使用滴管吸取液體時，為防止液體滴出，應將滴管倒立。
  tags:
    chapter:
      publisher: 翰林
