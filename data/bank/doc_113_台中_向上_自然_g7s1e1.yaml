- id: doc_113_台中_向上_自然_g7s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 1
  stem: '使用複式顯微鏡觀察口腔皮膜標本，如表為四組物鏡的資料，則下列哪一個敘述正確？


    | 物鏡 | 甲 | 乙 | 丙 | 丁 |

    | :--- | :--- | :--- | :--- | :--- |

    | 成像清晰時，物鏡與蓋玻片的距離（cm） | 0.9 | 0.6 | 0.3 | 0.1 |'
  options:
  - label: A
    content: 視野細胞數量為丁＞丙＞乙＞甲
  - label: B
    content: 使用丁觀察時，應提高光源亮度
  - label: C
    content: 使用甲物鏡時，最難觀察到完整的細胞
  - label: D
    content: 使用丙物鏡觀察細胞時，若欲觀察的細胞在視野右邊，可將玻片向左推動，使其移到視野中間。
