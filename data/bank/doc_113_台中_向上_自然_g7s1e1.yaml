- id: doc_113_台中_向上_自然_g7s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 司益如果要證明「水量多會讓蛋糕口感鬆軟」，要如何驗證呢？
  options:
  - label: A
    content: 一份加1 杯水，另一份加2 杯水，用二個不同的烤箱同時烤
  - label: B
    content: 一份加1 杯水，另一份加2 杯水，用同一臺烤箱烤
  - label: C
    content: 一份加1 杯水的麵團先放在5℃的冰箱冷藏1 小時，另一份加1 杯水的麵團則放在室溫下1 小時，用同一臺烤箱烤
  - label: D
    content: 一份加1 杯糖水，另一份加一杯水，用同一臺烤箱烤。
