- id: doc_113_台中_向上_自然_g7s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: '筱廷參觀蠶絲被觀光工廠，發現工廠展示的蠶蛹，和以前自己在

    家飼養的形狀有很大的差異，令他想要研究蠶結繭的現象，列出

    了甲、乙、丙、丁四個敘述，如附表所示，有關甲、乙、丙、丁

    分別屬於科學方法哪一步驟的判斷，下列何者正確？


    | 編號 | 敘述 |

    | :--- | :--- |

    | 甲 | 蠶為何會結出不同形狀的繭 |

    | 乙 | 可能是結繭時環境的角度，影響了繭的形狀 |

    | 丙 | 讓蠶分別在45°、90°、135°、180°的夾角下結繭，觀察蠶所結繭的形狀 |

    | 丁 | 發現在不同夾角下結的繭，或有不同的形狀。 |'
  options:
  - label: A
    content: 乙為假說，丙為設計實驗
  - label: B
    content: 甲為提出問題，乙為觀察
  - label: C
    content: 甲為觀察，丙為參考文獻
  - label: D
    content: 乙為提出結論，丁為假說。
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 生物
      code: 1-2
      title: 探究自然的科學方法
      chapter: 第1章 生命世界與科學方法
    textbook: 七上生物 1-2 探究自然的科學方法
    labeled_by: ai
- id: doc_113_台中_向上_自然_g7s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: '啟昱想要自製清潔劑，他在中秋節後，將家人剝下的柚子皮蒐集起來，浸泡在酒精中，一周後，分別在酒精中加入甘油、起泡劑還有水，想要觀察不同成分與比例下，黏稠度是否有不同的差異，他將各組成分與結果紀錄於下表：


    | | 第一組 | 第二組 | 第三組 |

    | :--- | :--- | :--- | :--- |

    | 柚子皮酒精(毫升) | 250 | 250 | 250 |

    | 起泡劑(毫升) | 100 | 100 | 0 |

    | 甘油(毫升) | 0 | 100 | 100 |

    | 水(毫升) | 150 | 150 | 150 |

    | 用玻棒沾取，停留在玻棒末端至落下的時間(秒) | 3 | 16 | 15 |


    關於上述實驗數據，請問下列何者正確？'
  options:
  - label: A
    content: 第一組和第二組之間的控制變因為甘油
  - label: B
    content: 停留在玻棒的時間為各組的操作變因
  - label: C
    content: 第三組可作為第一組的對照組，討論起泡劑、甘油與黏稠度的關係
  - label: D
    content: 由上述分析可推論，添加甘油，可以增加黏稠度，不易滴落。
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 生物
      code: 1-2
      title: 探究自然的科學方法
      chapter: 第1章 生命世界與科學方法
    textbook: 七上生物 1-2 探究自然的科學方法
    labeled_by: ai
- id: doc_113_台中_向上_自然_g7s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: '實驗課時，東東因為有事先預習，搶在老師開始解說前，就開始操作顯微鏡；丁丁趁實驗開始前，吃早餐來不及吃完的飯糰；小明正拿著已點燃的酒精燈，準備幫忙各組點燃火焰；小黑發現隔壁組的酒精燈翻倒著火，趕緊拿濕抹布蓋住滅火。

    試問誰的做法符合實驗室安全守則？'
  options:
  - label: A
    content: 東東
  - label: B
    content: 丁丁
  - label: C
    content: 小明
  - label: D
    content: 小黑。
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 生物
      code: 1-3
      title: 進入實驗室
      chapter: 第1章 生命世界與科學方法
    textbook: 七上生物 1-3 進入實驗室
