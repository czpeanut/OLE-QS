  section: 1
  number: 8
  type: single
  page: 1
  stem: 肺炎鏈球菌常潛伏在人類鼻腔內，可透過飛沫傳播，侵入呼吸道或血液中引發肺炎、菌血症、腦膜炎等病症，科學家致力於開發相關的疫苗，以增加對人體的保護力。在一系列動物實驗中，有一組老鼠並未施打疫苗，僅施打生理食鹽水，試問該組在實驗中的目的為何？
  options:
  - label: A
