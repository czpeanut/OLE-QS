- id: doc_113_台中_向上_自然_g7s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 阿牧參觀百寶搜奇博物館，在館中看到了會捕食昆蟲的豬籠草、洞穴中年年加長的鐘乳石、會在深海發光的水母，還被突然從海砂鑽出的花園鰻魚嚇了一大跳。請問，關於阿牧看見的物品中，下列敘述何者正確？
  options:
  - label: A
    content: 豬籠草雖然可以捕食昆蟲，但是無法表現運動能力，不屬於生物
  - label: B
    content: 鐘乳石可以年年加長，表現了生長與發育的生命現象
  - label: C
    content: 深海水母能自行發光，完全不需要陽光就能生存
  - label: D
    content: 阿牧嚇一大跳，也是一種生命現象。
