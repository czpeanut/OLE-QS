- id: doc_113_台中_向上_自然_g7s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 1
  stem: '關於小夫使用顯微鏡時，下列敘述正確的共有幾項？

    (a)轉動辛，可使戊大幅度上升或下降；

    (b)轉動丁，使物鏡對準載物臺上圓孔；

    (c)調節丙，使亮度適中；(d)調整庚或辛，使觀察標本移動到視野正中央；(e)甲和丁的倍率相乘，即為觀察樣本的放大倍率；(f)若想要將物體放大，要選擇較長的丁來做觀察。'
  options:
  - label: A
    content: 六項
  - label: B
    content: 四項
  - label: C
    content: 兩項
  - label: D
    content: 僅一項。
  group_stem: 小夫使用如圖所示的顯微鏡觀察標本時，請回答16~18 題。
