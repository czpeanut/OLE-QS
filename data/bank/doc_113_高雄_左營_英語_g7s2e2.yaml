    your family are sure to give you a hand to get through your hard time. Of course,
    if your family are in need, you will do the same thing to them. That’s a family.

    Daisy : Yes, I love my family, and they love me, too.

    Ms. Lee : When you listen to Celine Dion, your favorite singer, do you give her
    a hand? No. You give her big hands. It means that you like her singing very much.
    Besides, if someone does something good, just like trying very hard to help others,
    you can give him big hands, too. But you must be careful about this. If someone
    fails his test, and you give him big hands, he must be very angry.

