    Many people have food allergies. Some common food allergies are to eggs, milk,
    peanuts and fish. If someone is allergic to one of these things, they can’t eat
    it. If they do, they may get sick. They may get a stomachache. Their skin may
    get itchy.

    Always respect people’s food allergies. Help them avoid getting sick. If they
    are allergic to a certain food, don’t eat it around them.

    (In the coffee shop)

    Tony : Hi, Janey. What’s up?

    Janey: My sister’s birthday is the day before Mother’s Day this year. I want to
    buy her a strawberry cake.

    Tony : That’s great. A strawberry cake would be yummy.

    Janey: I think so, too. But my sister is allergic to eggs and milk.

    Tony : What happens if she has eggs or milk?

    Janey: She gets a stomachache.

    Tony : That’s too bad. You respect her allergies. That’s good.

    Janey: But it’s not easy to find a cake without eggs.

    Tony : How about making a strawberry cake by yourself? I can help you. We can
    make one without eggs.

    Janey: Great! Thank you so much!

    (※ common 常見的 peanuts 花生 stomachache 腹痛 skin 皮膚 itchy 癢的 respect 尊重 avoid 避免 certain
    特定的 would be 會是 yourself 你自己)'
