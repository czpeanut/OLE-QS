- id: doc_113_高雄_五甲_自然_g8s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: '小翔做雙氧水製氧的實驗，他將二氧化錳與水放在錐形瓶中，再從薊頭漏斗加入雙氧水，並用碼錶記錄集滿一瓶氧氣所需的時間，實驗紀錄如表所示。下列有關此實驗的敘述何者錯誤？


    |  | $10\%$ 雙氧水水溶液濃度 (%) | 水的體積 (mL) | 二氧化錳 (g) | 收集時間 (s) |

    | :---: | :---: | :---: | :---: | :---: |

    | 甲 | 5 | 10 | 1 | 200 |

    | 乙 | 10 | 10 | 1 | 100 |

    | 丙 | 15 | 10 | 1 | 67 |

    | 丁 | 20 | 10 | 1 | 50 |'
  options:
  - label: A
    content: 二氧化錳為此實驗的反應物
  - label: B
    content: 水的體積是控制變因
  - label: C
    content: 收集的時間愈短，表示反應速率愈快
  - label: D
    content: 雙氧水的濃度愈大，氧氣的生成速率愈快。
