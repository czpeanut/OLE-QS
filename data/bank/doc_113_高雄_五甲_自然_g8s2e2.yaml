    content: 乙杯最酸，其 $\text{pH}$ 值最大
  - label: B
    content: 乙杯最酸，其 $\text{pH}$ 值最小
  - label: C
    content: 丙杯最酸，其 $\text{pH}$ 值最大
  - label: D
    content: 丙杯最酸，其 $\text{pH}$ 值最小。
