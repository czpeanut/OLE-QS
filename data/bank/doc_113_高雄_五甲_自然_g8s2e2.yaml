  section: 2
  number: 19
  type: single
  page: 5
  stem: '10. 將裝有紅棕色二氧化氮 ($\text{NO}_{2}$) 氣體的密閉玻璃瓶放入冰水中，二氧化氮會互相結合成無色的四氧化二氮 ($\text{N}_{2}\text{O}_{4}$)
    氣體，瓶內的顏色會逐漸變淡，反應式為：

    $2\ \text{NO}_{2} \underset{\text{逆反應}}{\overset{\text{正反應}}{\rightleftharpoons}}
    \text{N}_{2}\text{O}_{4}$

    當溫度下降至某溫度，且保持恆定，一段時間後玻璃瓶內的顏色便不再改變。關於顏色不再改變時反應速率的說明，下列何者正確？答：【 ⑲ 】。'
  options:
  - label: A
