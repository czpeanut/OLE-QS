- id: doc_113_高雄_五甲_自然_g8s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 根據維基百科的資料顯示如下：「(一)<u>海洋因二氧化碳等非金屬氧化物的增加而酸化，影響海洋生態</u>，比如抑制洪堡烏賊的新陳代謝和淡菜的免疫反應及加速珊瑚白化。(二)海洋酸度增加還帶來了其他化學反應，如酸性離子增加，會減緩珊瑚蟲和浮游生物等海洋生物的成鈣過程，已經形成的鈣質也更容易溶解。」關於畫底線處內容的判斷，何者正確？
  options:
  - label: A
    content: (一)合理，海洋酸化讓海水 $\text{pH}$ 值增加
  - label: B
    content: (一)不合理，海洋酸化讓海水 $\text{pH}$ 值降低
  - label: C
    content: (二)合理，海洋生物的成鈣過程會受酸性離子增加而影響
  - label: D
    content: (二)不合理，海洋生物的成鈣過程不會受酸性離子增加而影響。
