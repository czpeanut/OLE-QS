  page: 2
  stem: '在 $25^\circ\text{C}$ 下，某固定體積之密閉系統中的化學反應已達成平衡，其反應式如右所示：

    $\underset{\text{紅棕色}}{2\text{NO}_{2(\text{g})}} \rightleftharpoons \underset{\text{無色}}{\text{N}_{2}\text{O}_{4(\text{g})}}
