  group_stem: '張幼儀，是一位銀行家與企業家。11 歲，她考入江蘇省第二女子師範學校；14 歲，她遵照家中長輩旨意結婚；17 歲，丈夫徐志摩出國留學，而她則留在老家侍奉公婆，並產下一個男孩；19
    歲，張幼儀前往英國與丈夫會合，後來，丈夫在得知她再次懷孕時要求墮胎並離婚；離婚後，張幼儀開始在德國學習幼兒教育。25 歲，她應公公邀請返回中國，公公收她為義女，張幼儀奉養公婆終老；同時，她也在東吳大學教授德文。27
    歲，她在兄長協助下接管經營「上海女子商業儲蓄銀行」，並在短時間內使銀行轉虧為盈；此後，她還開辦「雲裳服裝公司」引入新潮時裝式樣，並擔任總經理職位；同時，她也進行股票交易操作，並協助兄長管理中國國家社會黨之財務。後來，前夫死於空難，她讓自己的弟弟陪著兒子去認領遺體，在公祭儀式上，她堅持以傳統禮儀舉行喪禮。53
    歲，她在日本再婚；88 歲，張幼儀逝世於紐約，並被安葬在芬克里夫墓園。

    摘自維基百科'
