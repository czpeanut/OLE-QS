  group_stem: "(二)讀完文章後，將最適當的答案填入（ ）中。\n    蘇子夜坐，有鼠方①齧②，拊③床而止之，既止復作。使童子燭之，有橐④中空。嘐嘐聱聱○5\
    \ ，聲在橐中。曰：「嘻！此鼠之見○6 閉而不得去者也。」發而視之，寂無所有，舉燭而索，中有死鼠。童子驚曰：「是方齧也，而遽○7 死耶？向○8 為何聲，豈其鬼耶？」覆○9而出之，墮地乃走，雖有敏者，莫措其手。\n\
    \    蘇子嘆曰：「異哉！是鼠之黠○10也。」\n(節選自蘇軾 黠鼠賦)\n【注釋】①方：正在。②齧ㄋ一ㄝˋ：啃、咬。③拊ㄈㄨˇ：拍擊。④橐ㄊㄨㄛˊ：可以收束的小袋子。○5\
    \ 嘐ㄒㄧㄠ嘐聱ㄠˊ聱：形容老鼠咬東西所發出的聲音。○6 見：被。○7 遽ㄐㄩˋ：突然。○8 向：剛才。○9 覆：傾倒。○10黠ㄒㄧㄚˊ：狡猾。"
