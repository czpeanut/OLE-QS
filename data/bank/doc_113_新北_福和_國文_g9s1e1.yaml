- id: doc_113_新北_福和_國文_g9s1e1_s2_39
  section: 2
  number: 39
  type: single
  page: 4
  stem: 根據本文，下列何者最適合作為本文標題？【綜合】
  options:
  - label: A
    content: 媒體如何分潤
  - label: B
    content: 我們的網紅時代
  - label: C
    content: 新聞圖表的閱讀法
  - label: D
    content: 以假亂真的合成技術。
  group_stem: "(一)讀完文章後，將最適當的答案填入（ ）中。\n    Youtube 上有一支關於美國前總統歐巴馬的瘋傳影片，點閱次數近七百五十萬。影片標題極為誘人：你一定不相信歐巴馬在這段影片說了什麼！只見歐巴馬直視鏡頭、坐在桃花心木椅上，場景就像白宮的總統辦公室。歐巴馬看起來老了些—從他髮間摻雜的白髮即可見端倪，但他的模樣依然非常輕鬆自信。而在他右肩後方可以窺見美國國旗。一如往常，歐巴馬穿著體面，平整的白襯衫搭配藍色領帶，西裝外套左領別著美國國旗。你點下了播放鍵，「我們正進入一個年代，我們的敵人可以讓任何人、在任何時間、說出任何內容……」歐巴馬在影片開場說道：「即使是那些人永遠不會說的話。舉例來說……」他加上手勢：「他們就有辦法讓我說出：『川普總統不折不扣是個笨蛋！』」他的眼神似乎帶有笑意：「現在明白了吧，我絕對不會說這種話，至少不會在公開場合說。」\n\
    \  歐巴馬從未說過這些話。這是一支假影片—亦即「深度造假」（deepfake），乃是人工智慧（Artificial Intelligence，簡稱AI）的產物。歡迎各位來到未來，在這個時代，人工智慧的力量已經能讓任何人說出他們不曾說的話、做出他們不曾做過的舉動。每個人都可能成為目標，也都可能否認一切。在失能的資訊生態系統之中，人工智慧和深度造假就是最新的威脅，而且持續不斷升級。\
    \     （妮娜．敘克 混亂的反烏托邦）"
