  group_stem: "(五)讀完文章後，將最適當的答案填入（ ）中。\n「吾母姓鍾氏，……十八歸先府君①。時府君年四十餘，任俠好客，樂施與，散數千金，囊篋蕭然②，賓從③輒滿座。吾母脫簪珥，治酒漿，盤罍間未嘗有儉色④。越二載，生銓，家益落，歷困苦窮乏，人所不能堪者，吾母怡然無愁蹙狀；戚黨人爭賢之。」\n\
