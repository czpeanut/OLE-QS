  stem: 老師請同學思考並解釋(甲)文，下列何者最合適？【綜合】
  options:
  - label: A
    content: 倫倫：從前的求學者只求獨善其身，現在的求學者則兼善天下
  - label: B
    content: 羲羲：這裡的學者指的是學術工作者，「為人」是指樂於助人
  - label: C
    content: 禹禹：古今學習者動機不同，從前求學是為了修身、充實自己
  - label: D
    content: 元元：孔子贊同今之學者，學習是為了展現自己，並求名求利。
  group_stem: '(三)讀完《論語》後，將最適當的答案填入（ ）中。

    （甲）子曰：「古之學者為己，今之學者為人。」〈憲問篇第二十五〉

    （乙）子曰：「君子恥其言而過其行。」〈憲問篇第二十九〉

    （丙）子曰：「君子上達，小人下達。」〈憲問篇第二十四〉'
