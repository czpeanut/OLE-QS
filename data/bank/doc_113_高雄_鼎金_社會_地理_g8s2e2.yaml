  stem: 2022 年，OPEC（石油輸出國家組織）宣布從 11 月起每日減產原油近 200 萬桶。歐美國家憂心此舉將增加俄羅斯外銷石油收入，使俄烏戰況惡化。下列關於
    OPEC 的敘述何者正確？
  options:
  - label: A
    content: OPEC 減產可能促使油價下跌
  - label: B
    content: OPEC 大多數會員國均位於波斯灣
  - label: C
    content: OPEC 與歐美石油公司合作
  - label: D
    content: OPEC 成立的目的為保護產油國的利益。
