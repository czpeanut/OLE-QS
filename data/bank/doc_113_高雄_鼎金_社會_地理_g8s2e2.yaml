  group_stem: ◎二次大戰後，以色列和巴勒斯坦之間數十年來衝突不斷，因為以色列的監控和限制，加薩走廊的經濟維生來源，多仰賴內需和一些「地道」經濟。農業耕作是加薩地區居民重要的維生來源，但因為缺乏水源，加上以色列監管限制了可以耕作的土地，農業無法大量發展，漁業也被迫限制在離岸3浬處。於是當地在地面下發展出的「地道經濟」──居民利用連接鄰國的通道，交易民生必需品，甚至是武器。圖（三）為巴勒斯坦地區的局勢圖，請回答第13~16題：
