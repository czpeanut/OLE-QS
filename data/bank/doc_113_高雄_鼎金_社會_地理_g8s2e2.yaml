  - label: C
    content: 西南方
  - label: D
    content: 西北方。
- id: doc_113_高雄_鼎金_社會_地理_g8s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 「根據研究，世界上17 個缺水最嚴重的國家，有12 個在阿拉伯世界。為解決此問題，突尼西亞新創公司Kumulus 設計出一款能從空氣中提取水分的機器，運作原理為空氣先經過過濾器，清除污染物，接著進入冷卻裝置，凝結成水滴。Kumulus
    期待將這項技術推廣到需要的地方，解決缺水的問題。」請問:阿拉伯世界普遍存在缺水的問題，主要受下列哪一因素影響?
  options:
  - label: A
    content: 距海遙遠，空氣中水氣含量稀少
  - label: B
    content: 位於高山高原背風坡，水氣受地形攔截
  - label: C
    content: 戰火衝突不斷，水利設施大多遭受破壞
  - label: D
    content: 受副熱帶高氣壓影響，空氣下沉不利降雨。
