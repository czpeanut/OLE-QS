- id: doc_113_高雄_鼎金_社會_地理_g8s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 承第3 題，就讀埃及Tanta(30°46′N, 31°0′E)語言中心的大雄，發現每天到了禱告時間，當地的穆斯林必須面向聖地麥加(21°25′N,
    39°49′E)的方向禱告，依據Tanta 與麥加兩地之間的相對位置判斷，當地居民禱告時應是面向哪一方向?
  options:
  - label: A
    content: 東北方
  - label: B
