  group_stem: '◎2023/4/20美聯社報導「9美元的布施，卻導致85人死於踩踏意外？」葉門首都沙那（Sanaa）19日發生大規模踩踏意外，造成至少85人死亡、322人受傷；控制該區的胡塞反抗軍（Houthis）政府表示，踩踏意外源於當地商人在沙那舊城區舉辦慈善活動，向大眾分發每人約9美元的善款，結果吸引了數百人湧入而釀禍。

    今年3月下旬至4月下旬之間是穆斯林的齋戒月，向窮人布施也是齋戒月儀式之一，4月19日晚間在沙那舉辦的這場慈善活動，就選在開齋節（4月23日）前不久，由當地商人向民眾分發小額金援，這場慈善活動分發每人9美元的善款金額並不高，為何竟吸引數百人湧入活動場地？原因或可歸於葉門因長期內戰而陷入的極端貧困狀態，葉門有超過三分之二的人口生活在貧困線以下，其中甚至包括胡塞軍的政府雇員；因經濟狀況惡劣，這些政府雇員亦在多年內戰中，未能正常領取公務員工資。請問第9~10題：'
