  stem: 近年來世界各地河川水權的爭議與衝突日益升高，如尼羅河、印度河、約旦河，造成這三條河川水權爭議與衝突的原因，與下列何者關係最密切？
  options:
  - label: A
    content: 皆流經水稻農業區，河水不敷灌溉利用
  - label: B
    content: 皆流經多個國家內，河水資源分配不均
  - label: C
    content: 皆流經地殼不穩區，河水下滲問題嚴重
  - label: D
    content: 皆流經乾燥氣候區，河水總逕流量有限。
