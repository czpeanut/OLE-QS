  group_stem: "士林官邸鬱金香 2∕9 登場 5 大展區讓您巧遇情人節浪漫\n  2023 士林官邸鬱金香展將於 2 月 9 日開幕，活動至 2 月\
    \ 19 日止。今年將以 13 萬株、20 種以上，來自日本以及荷蘭鬱金香，呈現「遇見愛」主題，透過經典邂逅場景來打造 5 個遇見愛的主題展區，期盼民眾於復甦的春季，在浪漫的鬱金香花海中遇見愛、感受愛，追求彼此的幸福。\n\
    \  鬱金香不同顏色有不同花語，白色代表純潔、純情；粉色代表浪漫、永恆的愛、戀人的愛戀；紫色代表低調、高貴、無盡的愛；紅色代表熱情的愛、我愛你；橘色代表歷久彌新、美好回憶；黃色代表開朗；雙色代表：美麗的你、喜相逢；羽狀代表情意綿綿等。\n\
    【今年鬱金香展以各式經典的邂逅場景，規畫五大主題展區】\n■荷你相遇：以荷蘭 庫肯霍夫鬱金香公園為概念發想，將荷蘭三寶鬱金香、風車、木屐呈現於大門口打造臺版庫肯霍夫！\n\
    ■幸福祈願：將日本祈願儀式搬進園區內，帶領大家體驗日式的幸福祈禱，一起將願望寫在愛心繪馬上，為親友祈願。\n■轉角遇見愛：白色鋼琴靜置於大片鬱金香花海中，映襯著紅色大型愛心氣球，浪漫氛圍飆升。\n\
    ■愛情不期而遇：以電影向左走向右走的元素，在西式庭園中搭配了腳踏車、旋轉木馬、行李箱、站牌等，以及浪漫的雨傘隧道。\n■遇上夢幻泡泡：富有情調的大型泡泡讓人對愛情充滿嚮往。\n\
    日期：2∕9(四)～02∕19（日）\n時間：8：00～18：00"
