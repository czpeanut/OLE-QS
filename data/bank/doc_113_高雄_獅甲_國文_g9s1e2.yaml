  stem: (１)文中孟母言「席不正不坐，割不正不食」，指的是什麼？
  options:
  - label: A
    content: 胎教
  - label: B
    content: 幼兒教育
  - label: C
    content: 母教
  - label: D
    content: 成人教育
  group_stem: '孟子少時，東家殺豚。孟子問其母曰：「東家殺豚何為？」母曰：「欲啖汝。」其母自悔而言曰：「吾懷妊是子，席不正不坐，割不正不食，胎教之也。今適有知而欺之，是教之不信也。」乃買東家豚肉以食之，明不欺也。詩曰：「宜爾子孫，繩繩兮。」言賢母使之賢也。

    （韓嬰 孟母教信）'
