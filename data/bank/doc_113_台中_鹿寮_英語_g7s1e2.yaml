  stem: 30. What is Gogogo?
  options:
  - label: A
    content: A game.
  - label: B
    content: A house.
  - label: C
    content: A lab.
  - label: D
    content: A museum.
  group_stem: 'Gogogo

    #1. Stand on the big rock in front of the White House.

    #2. Meet Joe there and get a pink doll.

    #3. Go to the Blue Park.

    #4. Give the doll to Miss Smith and say "You''re beautiful." You can get a magic
    box from her.

    #5. Go back to the big rock and give Joe the box.

