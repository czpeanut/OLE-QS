  group_stem: "◎閱讀下列文章，並回答第28-30 題。\n     伊朗的歷史古城雅茲德，夏天氣溫可達攝氏50 度，當地人4000 年前就懂得結合地理環境資源，創造綠能建築「風塔」。風塔屋頂四面鏤空，可將屋頂的涼風引進塔內，塔身越長，通風降溫的效果越好，當氣流往下，一路引導至地下室，接觸坎井設施(如下圖)延伸出來的水道及屋內的水池，就會產生清涼效果，成為天然空調系統。\n\
    \    坎井設施可達地下兩百至三百公尺深，除了與風塔結合，作為古老的空調系統，也可將水資源儲存起來，提供農業灌溉之用。雅茲德最當地最大的朵拉阿貝德花園便是依賴此設施作為灌溉水源。獨特的風塔建築與波斯花園景觀，帶動觀光人潮。當地居民擔心遊客湧進，若建築養護工程做得不夠徹底，在頻繁的自然災害威脅下，古蹟可能無法妥善保存。"
