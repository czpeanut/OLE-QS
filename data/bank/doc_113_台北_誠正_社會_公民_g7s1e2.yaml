  page: 4
  stem: 在看完上文後，結合學校所學，幾位同學在討論有關家庭暴力的內容，何者正確？
  options:
  - label: A
    content: 小華：家暴類型只限於肢體暴力，口語謾罵不算
  - label: B
    content: 阿彥：父母對子女如果有家暴行為，法院可以依據《民法》宣告限制或禁止父母行使親權
