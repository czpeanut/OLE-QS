  group_stem: '題組一：

    家暴防治法的誕生

    1993 年末，在台北縣板橋市(今新北市板橋區)發生了一件家庭慘案。一名長期遭受丈夫家庭暴力的女子，持刀殺死了自己的丈夫，引起社會關注。

    這件事讓當時社會認真思考過去傳統「清官難斷家務事」、「法不入家門」的觀念是否完全正確。最後終於在1998 年5 月28 日，立法院三讀通過《家庭暴力防治法》，使我國成為亞洲第一個實行家暴法的國家，努力接住每個遭受家庭暴力的受害者。(摘改自今周刊)'
