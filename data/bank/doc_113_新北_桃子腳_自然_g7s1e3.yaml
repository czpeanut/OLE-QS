- id: doc_113_新北_桃子腳_自然_g7s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 根據含氮廢物的形式判斷，下列何種生物排出的含氮廢物毒性最強？
  options:
  - label: A
    content: 獨角仙
  - label: B
    content: 眼蟲
  - label: C
    content: 人
  - label: D
    content: 熊。
  group_stem: '題組：生物排放含氮廢物的三種形式中，毒性的強弱分別是：氨＞尿素＞尿酸，毒性越大者，排放時需要越多水分來稀釋。

    生活在水中的單細胞生物主要是以氨的形式來排泄含氮廢物，氨會藉由擴散作用，從細胞擴散至水中；大部分生活在淡水的魚類也是以氨的形式來排泄含氮廢物，氨會在鰓蓋一張一合之際，隨著水流排出體外。

    大部分的哺乳類動物，包括我們人類在內，主要以尿素的形式來排放含氮廢物，氨會在肝臟經由代謝作用轉變成尿素。成人每日由尿液排出約30 公克的尿素，此外，我們的汗液中也含有少許的尿素。

    昆蟲和鳥類以尿酸的形式排泄含氮廢物，尿酸會混在糞便中排出體外，鳥糞中白色的部分（圖一），其主要成分就是尿酸。由於尿酸不需要經過大量水分稀釋，因此讓鳥類的身體更輕盈，有助於鳥類的飛行。請回答第13~14
    題'
  shared_asset: g1_13_14
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 生物
      code: 6-2
      title: 排泄與水分的恆定
      chapter: 第6章 生物體的恆定
