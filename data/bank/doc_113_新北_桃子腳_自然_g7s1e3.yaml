  - label: C
    content: 氮氣
  - label: D
    content: 水氣
  group_stem: '題組：為了維持生命與從事各種工作，人體需要攝取食物與由大氣中獲得氧氣，來提供能量並調節排除熱量的速率，以維持正常體溫。因此，人體可視為一個與周圍環境交互作用的系統，透過新陳代謝，將能量儲存與轉換，並與環境進行熱的交換。人在靜止休息時維持基本機能（
    含體溫）所需的最低代謝率，稱為基礎代謝率。

    平均說來，單位時間內每公斤人體質量的基礎代謝率約為0.8 大卡。維持人體新陳代謝所需的能量，是食物被消化後與氧作用所產生的。以碳水化合物（ 如葡萄糖）為例，每公克的葡萄糖在此反應中釋出的能量約為4
    大卡。依上文回答下列問題。'
