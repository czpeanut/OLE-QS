    \ find the word. Although\nmost people have this word-finding problem, it is believed\
    \ to be\nseen in older people more often. However, TOT doesn't really\nstand for\
    \ a bad memory. \n   In a study done by Brown and McNeill, they read the\nparticipants\
    \ the definition of an uncommon English word and\nasked them to recall and say\
    \ it out loud. When the participants\nfailed to find the word, Brown and McNeil\
    \ would ask questions\nabout the word. Most of the participants could answer all\
    \ the\nquestions although they failed to recall the word. In the study,\nwhen\
    \ we remember an English word, much other information\nabout it is stored at the\
    \ same time. So, it is possible for older\npeople to experience more TOT states\
    \ simply because there is\nmuch more imformation in their memory. To many people's\n\
