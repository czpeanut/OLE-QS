    \ in junior high schools and elementary\nschools in California are asked to take\
    \ Emotional Learning classes\ntwice a week.\n       In the classes, students are\
    \ taught to care about themselves and\ntell different emotions. If they can learn\
    \ the way to make\nthemselves happy, it will be easier for them to control their\n\
