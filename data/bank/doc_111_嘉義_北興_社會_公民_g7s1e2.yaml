- id: doc_111_嘉義_北興_社會_公民_g7s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 女老師彤彤與影視紅星翔宇結婚五年，育有一名 3 歲的兒子豆豆。翔宇私生活複雜，經常徹夜不歸，還疑似有外遇。經過慎重考慮，身心俱疲的彤彤決定與翔宇離婚，兩人近期為了爭取豆豆的撫養權對簿公堂。翔宇主張自己收入比彤彤優渥，足以給豆豆豐衣足食的生活，然而法官最終將豆豆的親權判給彤彤。請問：下列何者最可能是法官判決的考量？
  options:
  - label: A
    content: 翔宇的演藝事業並非穩定的收入來源
  - label: B
    content: 幼兒與母親同住對於身心發展較有幫助
  - label: C
    content: 評估過往紀錄，考量豆豆之最佳利益
  - label: D
    content: 彤彤身為老師，具有較高的社會地位。
- id: doc_111_嘉義_北興_社會_公民_g7s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 現今法院在判決子女親權行使的案例時，是依子女的最佳利益原則來判決。這是因為下列哪一項法律已做了適度修正？
  options:
  - label: A
    content: 《性別平等教育法》
  - label: B
    content: 《民法》
  - label: C
    content: 《性別工作平等法》
  - label: D
    content: 《中華民國憲法》。
