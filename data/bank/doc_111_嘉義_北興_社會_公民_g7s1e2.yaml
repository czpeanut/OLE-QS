- id: doc_111_嘉義_北興_社會_公民_g7s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 為培育出更多元的人才，教育部將採取鬆綁政策，對於自學政策將開放至高中階段，也就是說只要家長向地方政府提出申請計畫，高中生也可以在家自行學習，只要通過學力檢定考試後，就可以報考大學。由上述可知，政府開放學生「在家自學」的作法，讓家庭的哪一項功能更具自主性？
  options:
  - label: A
    content: 經濟功能
  - label: B
    content: 教育功能
  - label: C
    content: 生育功能
  - label: D
    content: 保護與照顧功能。
- id: doc_111_嘉義_北興_社會_公民_g7s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 張氏夫妻膝下無子，透過法定程序，收養了一個來自菲律賓的男童為自己的兒子。手續辦完以後，他們與男童之間建立了何種親屬關係？
  options:
  - label: A
    content: 旁系血親
  - label: B
    content: 自然血親
  - label: C
    content: 直系血親
  - label: D
    content: 法定血親。
- id: doc_111_嘉義_北興_社會_公民_g7s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 「新北市除了設立公立托育中心，並受理申請及發放新臺幣 2 萬元生育獎勵金。」請問：上述政府的政策應該是為了解決下列何種問題？
  options:
  - label: A
    content: 家庭暴力問題
  - label: B
    content: 老人照護問題
  - label: C
    content: 親子溝通問題
  - label: D
    content: 少子化問題。
- id: doc_111_嘉義_北興_社會_公民_g7s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 一名於醫院工作的女性職能治療師，因請育嬰假而遭到不公平對待，甚至無法請領應得的獎金。請問：該名治療師可根據何項法令要求醫院改善？
  options:
  - label: A
    content: 《性別工作平等法》
  - label: B
    content: 《民法》
  - label: C
    content: 《性別平等教育法》
  - label: D
    content: 《中華民國憲法》。
- id: doc_111_嘉義_北興_社會_公民_g7s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '以下為某位公眾人物的演講文字稿，此段內容應與下列何者的意旨最符合？

    傳統社會中，擔負養家重任的男性，家庭地位較高。現今，已婚女性外出工作分擔家計，不僅改善家庭生活，也提高了自身在家庭中的地位。'
  options:
  - label: A
    content: 雙薪家庭成為主流，導致離婚率逐年提高
  - label: B
    content: 家庭勞動力產生改變，使得女性地位提升
  - label: C
    content: 經濟活動日益複雜，男性能力已無法負荷
  - label: D
    content: 婚姻觀念轉變，現代人寧可為工作而晚婚。
- id: doc_111_嘉義_北興_社會_公民_g7s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 志鈴今年年底即將結婚，最近忙著籌備婚禮之外，也與未婚夫討論，婚後是否與公公、婆婆同住。請問：志鈴與她的公婆之間屬於何種親屬關係？
  options:
  - label: A
    content: 配偶
  - label: B
    content: 血親
  - label: C
    content: 姻親
  - label: D
    content: 法定血親。
- id: doc_111_嘉義_北興_社會_公民_g7s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 過去傳統家庭分工觀念為「男主外，女主內」，但這種觀念隨著時代變遷而有所改變。為因應現況，政府修正不合理的法律規定，如現行《民法》規定家庭在生活費用上，夫妻應依其經濟能力共同分擔，並應當一起分擔家務。下列敘述何者最符合上述內容的意旨？
  options:
  - label: A
    content: 傳統家庭較能維繫家庭和諧
  - label: B
    content: 家庭分工模式未受法律影響
  - label: C
    content: 家庭性別平權觀念日益受到重視
  - label: D
    content: 家庭經濟功能無法正常發揮。
- id: doc_111_嘉義_北興_社會_公民_g7s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 關於家庭暴力的敘述，下列何種觀念正確？
  options:
  - label: A
    content: 暴力的發生與學歷高低有關
  - label: B
    content: 被施暴的家屬都應該先自我反省
  - label: C
    content: 對家屬施以精神上的傷害，也屬於家庭暴力
  - label: D
    content: 以棍棒打傷小孩是親權的合法行使。
- id: doc_111_嘉義_北興_社會_公民_g7s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 小惠與小麗兩姊妹在今年十月一同舉辦婚禮。請問：婚禮過後，姊妹倆的新婚丈夫之間互為什麼？彼此又產生哪一種親屬關係？
  options:
  - label: A
    content: 連襟、法定血親
  - label: B
    content: 姑嫂、自然血親
  - label: C
    content: 連襟、姻親
  - label: D
    content: 婆媳、姻親。
- id: doc_111_嘉義_北興_社會_公民_g7s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 下列敘述何者無法說明家庭的保護與照顧功能？
  options:
  - label: A
    content: 在家庭中，我們可以得到安全感、歸屬感
  - label: B
    content: 家庭是心靈的避風港
  - label: C
    content: 當我們在外面受到委屈，遭遇挫折時，家是最好的療傷處
  - label: D
    content: 俗語說：「不孝有三，無後為大。」
