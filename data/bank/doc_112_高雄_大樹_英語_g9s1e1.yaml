- id: doc_112_高雄_大樹_英語_g9s1e1_s2_1
  section: 2
  number: 1
  type: single
  page: 2
  stem: According to this reading, which of the following is NOT true?
  options:
  - label: A
    content: You should decide your clothes a few minutes before your date.
  - label: B
    content: It’s better to wear a suit or a dress to a nice restaurant than to wear
      something casual.
  - label: C
    content: Jeans and a T-shirt are fine if you want to watch a ball game.
  - label: D
    content: You can’t be comfortable if you wear the wrong clothes on your date.
  group_stem: 'A.

    Imagine that you finally asked the girl or guy you like out on a date. They said
    yes, and you’re so excited to go out with them. But then, you start to get worried.
    What will you wear? First of all, comfort is the most important thing. It’s hard
    to have confidence if you’re not wearing something comfortable. Secondly, think
    about where you’re going. If you’re going to a great restaurant, of course you’ll
    want to wear a suit or a nice dress. But you would never wear those things to
    a baseball game, would you? In that case, you might wear something a lot more
    casual, like jeans and a T-shirt. No matter what you decide to wear, though, give
    yourself enough time to think everything through. You don’t want to think about
    your clothes a few minutes before your date, do you? That stress will only carry
    over into your time with your date. So, take your time, think about your dating
    place, and stay comfortable.


    imagine 想像 comfort 舒適 confidence 自信 suit 西裝 casual 休閒的 no matter 無論  carry over
    仍然影響'
  tags:
    textbook: 第五冊（九上）第1次段考範圍
    labeled_by: ai
