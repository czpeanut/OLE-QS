  stem: If Lily is ordering food through Yummy Bear, what’s the next step after she
    checks the delivery fee? （address 地址）
  options:
  - label: A
    content: She checks the picture of his meal.
  - label: B
    content: She checks the delivery time.
  - label: C
    content: She places his order.
  - label: D
    content: She keys in his address.
  group_stem: 'C.

    Haven’t you tried Yummy Bear? Please check the steps below. You will find Yummy
    Bear is the easiest way to order your favorite food.


    Browse

    Yummy Bear has hundreds of restaurants for you to choose from. When you open the
    app, you can browse through the pictures of dishes easily. When you find your
    favorite food, just add it to your basket.


    Order

    When you’re ready to check out, just key in your location. After that, you’ll
    see the delivery time, cost of your order, and delivery fee. If everything looks
    right, just tap “Place Order,” and that’s it. You can choose to pay in cash or
    by credit card later.


    Track

    You can follow your order by using the app. After the restaurant takes your order,
    they’ll start preparing it. When the order is almost ready, a Yummy Bear driver
    will pick it up. Then they will deliver it to you. You’ll be able to track them
    on the map.


    browse 瀏覽 location 位置 delivery 運送 fee 費用 cash 現金 track 追蹤'
