- id: doc_113_新北_中平_國文_g8s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: '關於下列框中文字的涵義，何者正確？

    胳膊上架著的鷹，有時頭上蒙著一塊皮子，羽翮不整地蜷伏著不動，哪裡有半點瞵視昂藏的神氣？籠子裡的鳥更不用說，常年地關在柵欄裡，飲啄倒是方便，冬天還有遮風的棉罩，十分地「優待」，但是如果想要「搏扶搖而直上」，便要撞頭碰壁。鳥到了這種地步，我想牠的苦悶，大概是僅次於黏在膠紙上的蒼蠅；牠的快樂，大概是僅優於在標本室裡住著罷？'
  options:
  - label: A
    content: 作者認為籠中鳥的苦悶大於膠紙上的蒼蠅及標本室裡的標本
  - label: B
    content: 鷹雖然羽翮不整，但依然嚮往自由，展現出瞵視昂藏的神采
  - label: C
    content: 藉由籠中鳥的撞頭碰壁，象徵人們對生命困境的抵抗與堅持
  - label: D
    content: 透過倒反的言詞，表面寫鳥籠中生活的舒適，實則失去自由
  lesson_raw:
    title: 鳥
    basis: 引文為梁實秋〈鳥〉課文原文
  tags:
    textbook: 八上 第八課 鳥
    labeled_by: ai
    chapter:
