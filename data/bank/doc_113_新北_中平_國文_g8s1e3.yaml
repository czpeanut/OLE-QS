  stem: "根據甲、乙兩段文字描述，下列選項何者有誤？ \n甲：世界上的生物，沒有比鳥更俊俏的。多少樣不知名的小鳥，在枝頭跳躍，有的曳著長長的尾巴，有的翹著尖尖的長喙，有的是胸襟上帶著一塊照眼的顏色，有的是飛起來的時候才閃露一下斑斕的花彩。幾乎沒有例外的，鳥的身軀都是玲瓏飽滿的，細瘦而不乾癟，豐腴而不臃腫，真是減一分則太瘦、增一分則太肥那樣地穠纖合度，跳盪得那樣輕靈，腳上像是有彈簧。\n\
    乙：遠遠乍看，藍鵲一身貴婦打扮，由頭頂至脖頸雙肩，圍著一條濃黑發亮的絲絨披肩。厚厚嘴喙，搽著猶似「卡門的誘惑」那般的豔紅胭脂，兩腳蹬的是佛萊明哥鮮豔熱情的舞鞋，尾巴插上幾翎比身體還長許多的翩翩長羽，宮廷味十足。一雙黃澄澄眼珠子，總是那麼炯炯發亮。總之，藍鵲渾身散發著一股難以否認的「俗麗」，但又難以抗拒的「原始野氣」。"
  options:
