  stem: 「我不要大賣場裡賣的，那些都是印刷品，我要手寫的，筆酣墨濃的書法，看得見汁液的流動、新乾的痕跡，這年頭得到哪兒買這樣的春聯呢？」根據本文，作者想要手寫的春聯，而不要印刷的春聯，其理由為何？
  options:
  - label: A
    content: 印刷春聯過於普遍容易取得，作者興趣缺缺
  - label: B
    content: 印刷字排版太工整，沒有手寫春聯的獨特感
  - label: C
