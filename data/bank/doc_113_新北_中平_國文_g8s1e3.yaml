  stem: 根據前後文判斷袁枚對飲食烹飪的要求，這篇〈        〉的題目最有可能是下列何者？
  options:
  - label: A
    content: 〈點心單〉
  - label: B
    content: 〈特牲單〉
  - label: C
    content: 〈戒暴殄〉
  - label: D
    content: 〈戒火鍋〉
  group_stem: '※請根據下面文章回答第39～40 題：

    袁枚是一位有豐富經驗的烹飪學家和美食家。他所著的《隨園食單》是清代一部系統地論述中國烹飪技術和南北菜點的重要著作。其中，在《隨園食單》中，他主張「一物有一物之味，不可混而同之。……善治菜者，須多設鍋、灶、盂、缽之類，使一物各獻一性，一碗各成一味。」因此撰寫一篇〈        〉指出：「冬日宴客，慣用此物，對客喧騰，已屬可厭；且各菜之味，有一定火候，宜文宜武，宜撤宜添，瞬息難差。今一例以火逼之，共味尚可問哉？」可知袁枚對於不同食材的火候掌控非常講究。

    火候，是指在加熱温度和時間的運用，乃烹調加工技術的重中之重。大抵而言，烹製菜餚的火力，按照煎、煮、炒、炸、蒸五大料理手法，有不同的重點：

    1.煎：厚而難熟的食物，像是去骨雞腿排、厚切豬排、魚排等，先用小火慢煎，等中心熟了之後，再轉中大火，讓外層上色，不然很容易外層焦了，裡面還沒熟。薄而易熟的食物，像是培根、荷包蛋、豆腐等，則可用中火或是中大火煎，讓食物焦香。牛排要用大火煎，待表層煎到焦脆，鎖住肉汁後，再轉中大火續煎。

    2.煮：水煮東西，像是煮水餃、麵食等，用中小火才會讓中心熟透，火太大很容易煮到皮破了結果料還沒熟。燉煮東西，像是燉湯、燉肉等，等湯滾了之後，轉成小火慢燉，湯汁才不會滾乾，成品也較不會混濁。

    3.炒：小分量的快炒，用中火最安全，因為用小火東西會炒不香，大火太容易焦。炒的過程可以自行調整為中大火或中小火，主要判斷依據是鍋中食物、水分的狀態。炒絞肉，需用中大火，才能把油脂逼出、水分炒乾，火太小的話，肉會出很多水，肉腥味會很重。帶有較多醬汁的料理，如三杯、紅燒等，待食材變熟、入味後，可於最後階段把火轉大收乾，等待醬汁水分減少，變濃稠後更能吸附在食物上面。

    4.炸：炸物通常都有一定的厚度，像是炸豬排，等油溫夠熱轉小火慢炸，確定熟了，再把火轉大，讓外層上色更酥脆。

    5.蒸：若要於鍋中放水蒸東西，基本上都是用大火，裡面才會有足夠的水蒸氣循環，讓食物快速、均勻的熟透。另外提醒，要等水滾之後，才能把要蒸的東西放入。'
