- id: doc_113_新北_中平_國文_g8s1e3_s1_26
  section: 1
  number: 26
  type: single
  page: 3
  stem: '傳統的「竹籠厝」，沒有任何鋼筋、水泥，而是用竹子搭建，屋頂是以剖半的竹片為底，蓋上茅草和幾片屋瓦，牆面則是用米糠和泥土攪和塗抹而成，不但能遮風避雨，冬暖夏涼，甚至有防震效果。這種純手工打造、最自然、會呼吸的「綠建築」，是現代居住於「水泥牢籠」的我們所難以想像的。五十多坪的竹籠厝內，隔了三個房間，中間是「公媽廳」（神明廳），兩邊為臥室，臥室旁會再搭建一間小灶腳來炊煮。住宅是與人類生活最親密的空間，從竹籠厝到鋼筋水泥，其實從住宅型態的改變，不只看出器物進步，更可以發現家庭結構及生活的變遷。

    下列關於「土籠厝」這段文字的分析，下列何者有誤？'
