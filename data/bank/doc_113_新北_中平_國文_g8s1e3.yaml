  stem: 「我開始欣賞鳥，是在四川。黎明時，窗外是一片鳥囀，不是吱吱喳喳的麻雀，不是呱呱噪啼的烏鴉。那一片聲音是清脆的，是嘹亮的。有的一聲長叫，包括著六、七個音階；有的只是一個聲音，圓潤而不覺其單調；有時是獨奏，有時是合唱，簡直是一派和諧的交響樂。不知有多少個春天的早晨，這樣的鳥聲把我從夢境喚起。等到旭日高升，市聲鼎沸，鳥就沉默了，不知到哪裡去了。一直等到夜晚，才又聽到杜鵑叫，由遠叫到近，由近叫到遠，一聲急似一聲，竟是淒絕的哀樂。客夜聞此，說不出的酸楚！」根據這段文字，下列何者正確？
