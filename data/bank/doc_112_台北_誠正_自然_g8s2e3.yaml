- id: doc_112_台北_誠正_自然_g8s2e3_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 力的種類可以分為接觸力與超距力兩種，下列敘述何者正確？
  options:
  - label: A
    content: 蘋果從樹上落下時所受的重力是超距力，塑膠髮梳摩擦後產生的靜電力是接觸力。
  - label: B
    content: 蘋果從樹上落下時所受的重力是接觸力，塑膠髮梳摩擦後產生的靜電力是超距力。
  - label: C
    content: 蘋果從樹上落下時所受的重力是超距力，塑膠髮梳摩擦後產生的靜電力也是超距力。
  - label: D
    content: 蘋果從樹上落下時所受的重力是接觸力，塑膠髮梳摩擦後產生的靜電力也是接觸力。
