questions:
- id: doc_112_台北_誠正_自然_g8s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 有關天然氣與液化石油氣的比較，下列何者正確？
  options:
  - label: A
    content: 天然氣常溫常壓時是氣體，而液化石油氣常溫常壓時是液體。
  - label: B
    content: 天然氣常溫常壓時是液體，而液化石油氣常溫常壓時是氣體。
  - label: C
    content: 天然氣和液化石油氣常溫常壓時，都是氣體。
  - label: D
    content: 天然氣和液化石油氣常溫常壓時，都是液體。
- id: doc_112_台北_誠正_自然_g8s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 關於乙酸 $CH_{3}COOH$ 和乙醇 $C_{2}H_{5}OH$ 的敘述，下列何者正確？
  options:
  - label: A
    content: 乙酸水溶液呈酸性，乙醇水溶液呈鹼性。
  - label: B
    content: 乙酸水溶液呈酸性，乙醇水溶液呈中性。
  - label: C
    content: 乙酸水溶液呈中性，乙醇水溶液呈鹼性。
  - label: D
    content: 乙酸水溶液呈中性，乙醇水溶液呈中性。
- id: doc_112_台北_誠正_自然_g8s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 日常生活中，煮菜用的沙拉油、汽機車用的汽油，都是和我們密不可分的有機物質，有關沙拉油、汽油的敘述，下列何者正確？
  options:
  - label: A
    content: 沙拉油屬於烴類的有機物質，汽油屬於酯類的有機物質。
  - label: B
    content: 沙拉油屬於酯類的有機物質，汽油屬於烴類的有機物質。
  - label: C
    content: 沙拉油和汽油都屬於烴類的有機物質。
  - label: D
    content: 沙拉油和汽油都屬於酯類的有機物質。
- id: doc_112_台北_誠正_自然_g8s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 關於有機化合物的敘述，下列何者錯誤？
  options:
  - label: A
    content: 有機化合物必定含有碳元素的存在。
  - label: B
    content: 石油可以分餾出多種的有機化合物，所以石油是混合物。
  - label: C
    content: 分子式相同的有機化合物，其物理和化學性質一定相同。
  - label: D
    content: 甲苯($C_{7}H_{8}$)，屬於烴類有機化合物。
- id: doc_112_台北_誠正_自然_g8s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 以下關於醇類的敘述，何者正確？
  options:
  - label: A
    content: 實驗室中酒精是粉紅色，原因是乙醇液體顏色是粉紅色。
  - label: B
    content: 皂化反應的產物有肥皂與甘油，根據甘油的學名，可判斷甘油應為醇類。。
  - label: C
    content: 變性酒精是加入有毒的丙醇的溶液。
  - label: D
    content: 假酒事件頻傳，常導致消費者誤食而失明或喪命，這是因為假酒中含有乙醇成分。。
- id: doc_112_台北_誠正_自然_g8s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 醇和有機酸混合加熱發生酯化的反應速率很慢，通常會加入濃硫酸當作催化劑。關於濃硫酸的敘述，何者正確？
  options:
  - label: A
    content: 濃硫酸是有機化合物，為反應物之一。
  - label: B
    content: 濃硫酸是有機化合物，不是反應物之一。
  - label: C
    content: 濃硫酸是無機化合物，為反應物之一。
  - label: D
    content: 濃硫酸是無機化合物，不是反應物之一。
- id: doc_112_台北_誠正_自然_g8s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 肥皂製作過程：在燒杯中倒入椰子油10 c.c.，再倒入酒精10 c.c.，用玻璃棒攪拌同時加熱，再慢慢加入氫氧化鈉溶液10 c.c.，一面加熱一面攪拌，直到溶液變成黏稠狀，再加水20
    c.c.，攪拌均勻並停止加熱，等冷卻後再倒入飽和食鹽水。關於實驗中加入酒精的敘述，何者正確？
  options:
  - label: A
    content: 酒精是催化劑，為反應物之一。
  - label: B
    content: 酒精是催化劑，不是反應物之一。
  - label: C
    content: 酒精不是催化劑，為反應物之一。
  - label: D
    content: 酒精不是催化劑，不是反應物之一。
- id: doc_112_台北_誠正_自然_g8s2e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 皂化反應的產物為肥皂及甘油，其化學成分分別為何？
  options:
  - label: A
    content: 肥皂：丙三醇。甘油：脂肪酸鈉。
  - label: B
    content: 肥皂：丙醇。甘油：脂肪酸鈉。
  - label: C
    content: 肥皂：脂肪酸鈉。甘油：丙醇。
  - label: D
    content: 肥皂：脂肪酸鈉。甘油：丙三醇。
- id: doc_112_台北_誠正_自然_g8s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 關於合成清潔劑與肥皂的敘述，下列何者正確？
  options:
  - label: A
    content: 合成清潔劑的製作過程與肥皂相同，都是石油提煉而得的物質，再與酸或鹼反應製成。
  - label: B
    content: 合成清潔劑的製作過程與肥皂相同，都是由動、植物的油脂與強鹼性物質反應而成。
  - label: C
    content: 合成清潔劑是石油提煉而得的物質，再與酸或鹼反應製成；肥皂是由動、植物的油脂與強鹼性物質反應而成。
  - label: D
    content: 合成清潔劑是由動、植物的油脂與強鹼性物質反應而成；肥皂為將石油提煉而得的物質，再與酸或鹼反應製成。
- id: doc_112_台北_誠正_自然_g8s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 市面上販售的手工肥皂，我們亦可以利用回鍋油再加上一些簡單的材料，做出各種有香味的肥皂。有關手工肥皂的製造，下列敘述何者正確？
  options:
  - label: A
    content: 回鍋油屬於酯類的一種，以紅、藍石蕊試紙檢測肥皂水溶液，結果為紅色石蕊試紙變藍色。
  - label: B
    content: 回鍋油屬於酯類的一種，以紅、藍石蕊試紙檢測肥皂水溶液，結果為藍色石蕊試紙變紅色。
  - label: C
    content: 回鍋油屬於醇類的一種，以紅、藍石蕊試紙檢測肥皂水溶液，結果為紅色石蕊試紙變藍色。
  - label: D
    content: 回鍋油屬於醇類的一種，以紅、藍石蕊試紙檢測肥皂水溶液，結果為藍色石蕊試紙變紅色。
- id: doc_112_台北_誠正_自然_g8s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 手工肥皂的製造，最後要倒入飽和食鹽水，目的是為了什麼？會觀察到什麼現象？
  options:
  - label: A
    content: 為了將肥皂與甘油分離，做出的肥皂會沉在飽和食鹽水下面。
  - label: B
    content: 為了將肥皂與甘油分離，做出的肥皂會浮在飽和食鹽水上面。
  - label: C
    content: 為了將肥皂與氫氧化鈉分離，做出的肥皂會沉在飽和食鹽水下面。
  - label: D
    content: 為了將肥皂與氫氧化鈉分離，做出的肥皂會浮在飽和食鹽水上面。
- id: doc_112_台北_誠正_自然_g8s2e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 有關肥皂與合成清潔劑去汙原理的敘述，下列何者正確？
  options:
  - label: A
    content: 肥皂與合成清潔劑的去汙原理相同，都含有親水端與親油端，可以使油汙與衣物分離，達到洗淨的效果。
  - label: B
    content: 肥皂與合成清潔劑的去汙原理相同，都只含親油端沒有親水端，可以溶解油汙，使油汙與衣物分離，達到洗淨的效果。。
  - label: C
    content: 肥皂與合成清潔劑的去汙原理不相同，肥皂只含有有親水端，合成清潔劑只含有親油端。
  - label: D
    content: 肥皂與合成清潔劑的去汙原理不相同，肥皂只含有有親油端，合成清潔劑只含有親水端。
- id: doc_112_台北_誠正_自然_g8s2e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 關於澱粉與纖維素的敘述，下列何者正確？
  options:
  - label: A
    content: 澱粉是天然的聚合物，纖維素是人造的聚合物。
  - label: B
    content: 澱粉是人造的聚合物，纖維素是天然的聚合物。
  - label: C
    content: 澱粉與纖維素都是人造的聚合物。
  - label: D
    content: 澱粉與纖維素都是天然的聚合物。
- id: doc_112_台北_誠正_自然_g8s2e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 聚合物是由很多小分子所連接而成的巨大分子，對於人類的生活影響甚大，其中聚乙烯是由乙烯聚合而成，請問下列有關聚乙烯與乙烯敘述，何者是正確的？
  options:
  - label: A
    content: 聚乙烯和乙烯都是天然有機聚合物。
  - label: B
    content: 聚乙烯和乙烯都是合成有機聚合物。
  - label: C
    content: 只有聚乙烯是天然有機聚合物。
  - label: D
    content: 只有聚乙烯是合成有機聚合物。。
- id: doc_112_台北_誠正_自然_g8s2e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 小芊在野炊時，不小心將裝水的寶特瓶接觸到火苗，發現寶特瓶迅速變形，由此現象可以推知，寶特瓶的成分為下列何者？
  options:
  - label: A
    content: 熱塑性聚合物，可回收重覆利用。
  - label: B
    content: 熱固性合物，可回收重覆利用。
  - label: C
    content: 熱塑性聚合物，無法回收再製。
  - label: D
    content: 熱固性合物，無法回收再製。
- id: doc_112_台北_誠正_自然_g8s2e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 下列有機物質的分子量比較，何者正確？
  options:
  - label: A
    content: 胺基酸的分子量 > 蛋白質的分子量
  - label: B
    content: 葡萄糖的分子量 > 澱粉的分子量
  - label: C
    content: 脂肪酸鈉的分子量 > 纖維素的分子量
  - label: D
    content: 纖維素的分子量 > 葡萄糖的分子量。
- id: doc_112_台北_誠正_自然_g8s2e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 有關醣類的敘述，下列何者正確？
  options:
  - label: A
    content: 纖維素是由葡萄糖聚合而成的，不屬於醣類。
  - label: B
    content: 澱粉是由葡萄糖聚合而成的，屬於醣類。
  - label: C
    content: 纖維素不是由葡萄糖聚合而成的，不屬於醣類。
  - label: D
    content: 澱粉不是由葡萄糖聚合而成的，屬於醣類。
- id: doc_112_台北_誠正_自然_g8s2e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 有關衣料纖維的敘述，下列何者正確？
  options:
  - label: A
    content: 棉花是天然纖維，由纖維素所組成的；羊毛纖維是天然纖維，由蛋白質所組成的。
  - label: B
    content: 棉花是天然纖維，由纖維素所組成的；羊毛纖維是合成纖維，由蛋白質所組成的。
  - label: C
    content: 棉花是合成纖維，由蛋白質所組成的；羊毛纖維是天然纖維，由纖維素所組成的。
  - label: D
    content: 棉花是合成纖維，由蛋白質所組成的；羊毛纖維是合成纖維，由纖維素所組成的。
- id: doc_112_台北_誠正_自然_g8s2e3_s1_19
  section: 1
  number: 19
