- id: doc_112_台北_誠正_自然_g8s2e3_s1_25
  section: 1
  number: 25
  type: single
  page: 3
  stem: 水平桌面上有一本書，有關這本書靜止時的受力關係，下列敘述何者正確？
  options:
  - label: A
