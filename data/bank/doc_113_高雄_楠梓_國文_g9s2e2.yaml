  stem: 由「臣飲食以時，使之不以暴；有險，先後之以身，是以肥也。」一句，可看出百里奚對牛的照顧。如此行為可用下列哪句話形容？
  options:
  - label: A
    content: 樂民之樂者，民亦樂其樂
  - label: B
    content: 勞心者治人，勞力者治於人
  - label: C
    content: 君子有諸己，而後求諸人
  - label: D
    content: 親親而仁民，仁民而愛物
  group_stem: "(四)\n    秦穆公使賈人載鹽，徵諸賈人，賈人買百里奚以五羖羊之皮，使將車之秦。秦穆公觀鹽，見百里奚牛肥，曰：「任重道遠以險，而牛何以肥也？」對曰：「臣飲食以時，使之不以暴；有險，先後之以身，是以肥也。」穆公知其君子也，令有司具沐浴為衣冠，與坐，公大悅。\n\
    \    異日，與公孫支論政，公孫支大不寧，曰：「君耳目聰明，思慮審察，君其得聖人乎？」公曰：「然，吾悅夫奚之言，彼類聖人也。」公孫支遂歸取雁以賀，曰：「君得社稷之聖臣，敢賀社稷之福。」公不辭，再拜而受。明日，公孫支乃致上卿以讓百里奚，曰：「秦國處僻，民陋以愚無知，危亡之本也。臣自知不足以處其上，請以讓之。」公不許。公孫支曰：「君不用賓相而得社稷之聖臣，君之祿也；臣見賢而讓之，臣之祿也。今君既得其祿矣，而使臣失祿，可乎？請終致之。」公不許。公孫支曰：「臣不肖而處上位，是君失倫也，不肖失倫，臣之過。進賢而退不肖，君之明也。今臣處位，廢君之德而逆臣之行也，臣將逃。」公乃受之。故百里奚為上卿以制之，公孫支為次卿以佐之也。\n\
    \                                                                            \
    \            《說苑．卷二．臣術》"
