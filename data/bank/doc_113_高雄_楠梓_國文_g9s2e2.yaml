  options:
  - label: A
    content: 由(甲)文中「市人相戒，無敢近其門者」所描述可知此人眾叛親離；由(乙)文中「此蟬正好跟我主人」 一句可知主人受僕人喜愛。
  - label: B
    content: 由(甲)文中「或攜沙石一塊，自念無妨，徑之」可看出路過者是準備前來理論；由(乙)文中「僕曰:『蟬食何物? 』主人曰:『吸風飲露耳。』」可知主人供給僕人的食物十分天然。
  - label: C
    content: 由(甲)文的故事結語來看，此人果然名不虛傳；由 (乙)文的故事結語來看，主人被僕人暗諷為鐵公雞。
  - label: D
    content: (甲)、(乙)二文皆以詳實的對話方式，來呈現鮮活具體的人物形象。
