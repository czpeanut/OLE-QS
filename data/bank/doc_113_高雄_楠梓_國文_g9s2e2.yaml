- id: doc_113_高雄_楠梓_國文_g9s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 「你何妨就在內心先確定一個廣泛的目標？先在家裡勾畫出完整的憧憬，布置一些可能發生的情節，以想像的陌生世界為背景，把自己血肉之軀投射進去，堅持自己所追求所要的東西，然後出門。這樣的旅行說不定會因為一切都不如理想而大失所望，但失望何嘗就不是一件莊嚴的理由？這樣的旅行是充滿目的和意志的，是學習的歷程，是考驗，是一種探險。」
    根據上文，下列哪個選項的敘述最適當？
  options:
  - label: A
    content: 事先做好完善的規劃，就可以擁有理想中完美的旅行。
  - label: B
    content: 旅行的過程可能充滿考驗，堅持到底才能算是完成挑戰。
  - label: C
    content: 旅行之前要先預設可能發生的情節，才能臨危不亂。
  - label: D
    content: 探險與學習是旅行的目的，即使失望也有其重要價值。
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 國文
      code: 自學課二
      title: 做自己情緒的主人
      chapter: null
    textbook: 九下 自學課二 做自己情緒的主人
    labeled_by: ai
- id: doc_113_高雄_楠梓_國文_g9s2e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 「有人說：『時間即生命。』也有人說：『時間即金錢。』二說均是。不過細想一下，有命斯有財，命之不存，於財何有？淮南子說：『聖人不貴尺之璧而重寸之陰，時難得而易失也。』可是誰又能趁早體會到時間之『難得而易失』？時光不斷的在流轉，任誰也不能攀住它停留片刻。我們每天撕一張日曆，日曆越來越薄，快要撕完的時候，便不免矍然以驚，驚的是又臨歲晚。」
    請問下列選項，何者最接近本文意旨？
  options:
  - label: A
    content: 切莫因蠅頭小利，而虛擲時光。
  - label: B
    content: 時光流轉，須知有捨才有得。
  - label: C
    content: 光陰寶貴而易逝，應善加珍惜。
  - label: D
    content: 時間是用生命與金錢換來的。
  tags:
    chapter:
      publisher: 南一
      book: 九下
      subject: 國文
      code: 自學課三
      title: 勤訓
      chapter: null
    textbook: 九下 自學課三 勤訓
    labeled_by: ai
