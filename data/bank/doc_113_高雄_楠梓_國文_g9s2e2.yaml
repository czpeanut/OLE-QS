- id: doc_113_高雄_楠梓_國文_g9s2e2_s2_30
  section: 2
  number: 30
  type: single
  page: 6
  stem: 根據文章內容，下列敘述何者正確？
  options:
  - label: A
    content: 2022 年有高達83%的民眾收到假消息
  - label: B
    content: 2023 年收到假訊息的民眾人數比2022 年多
  - label: C
    content: 有93%的民眾認為「媒體與資訊素養」對現代人相當重要，且參加過提升媒體素養的相關活動
  - label: D
    content: 有超過50%的民眾不認為自己有足夠能力辨識不實訊息
  group_stem: "(二) 數位世界必備防身術：如何辨別假訊息與查證？\n    您收到過假訊息嗎？或許應該這樣問：每天從不同管道接收到許多各式各樣的訊息，您知道如何分辨真偽嗎？\n\
    \    大家不妨先回想一下昨天一整天從哪些管道得到了哪些訊息。每天早上醒來，您最先開啟手機還是電視、電腦？拿起手機，您第一個打開的APP 是什麼？是LINE、Facebook，還是新聞推播？人手一「機」的時代，以上管道佔去大家每天接收資訊的前幾名，從「早安」、「平安」的「長輩圖」，到LINE\
    \ 來LINE 去的養生、健康建議；從可愛的貓狗與baby 影片，到搞笑、聳動的「抖音」、短片，您最愛看哪一類？您會按「讚」支持並分享給親朋好友嗎？\n \
    \   稍等一下！您有想過這些令人忍不住點閱、轉發的圖文，有可能是誇大、造假或「移花接木」嗎？如果一時不察，分享了假、錯資訊，會成為散布假訊息的幫兇嗎？\n\
    \    或許您會說：有那麼嚴重嗎？假訊息氾濫到「隨處可見」？讓數字來說話。臺灣事實查核教育基金會自2022 年起連年進行「假訊息現象與事實查核成效」大調查，2023\
    \ 年調查結果顯示，高達83%的民眾在最近一年內有收到假消息，比前一年的75%略微升高。Google 也曾發布調查指出，超過50%的民眾對網路新聞或訊息的真實性有疑慮，有42%的民眾不認為自己有足夠能力辨識「不實訊息」；此外，有93%的民眾認為「媒體與資訊素養」對現代人相當重要，然而，卻只有不到10%的民眾曾參加過提升媒體素養的相關活動。\n\
    \    想要安全地倘佯網路世界，又擔心資訊量大到難以招架或受騙上當，就必備數位世界的「防身術」―—對於事實查核的能力，及公民素養與識讀能力。\n    舉例來說，網路上常見以名人為主角的「投資訊息」，或是素人發財的「故事」搭配充滿像想的標題，誘使讀者點閱，緊抓住人的好奇心與致富夢想，很容易讓瀏覽者一時不察，點進不肖人士設立的假網頁，一步步落入詐騙陷阱。\n\
    \    此外，備受關注的AI（人工智慧），如chatGPT、AI 製圖等應用，生成文圖又快又擬真，臺灣事實查核教育基金會觀察到這類工具加速謠言生成、擴散的危機。像是有人利用AI\
    \ 生成「川普被逮捕」、「習近平會見普丁並親吻」等影像在社群上傳播，可預見這類不實影像將成為臺灣難以迴避的考驗，新聞從業者、社群使用者如何辨識，不為政治假訊息所愚弄，事實查核能力顯得相當重要。查核教育基金會記者以多次與AI\
    \ 影像「交手」的經驗彙整出對應心法，包括「無消息來源卻又聳動的影像應先存疑，不要急著分享」、「分享這些創作時，應加上註解或說明，避免不知道的人誤信為真」、積極主動查證、打造可信資訊生態圈等。\n\
    \    假訊息除了破壞人與人溝通最根本的真實原則，甚至傷害民主運作，因此對公共事務相關訊息做事實查核、抑制不實資訊帶來的負面影響，是臺灣事實查核教育基金會的宗旨。除了查核之外，也在事實查核的基礎上推廣媒體素養，透過與國內外相關團體攜手，深入臺灣各地社區、各年齡層，建立大眾對不實訊息、假新聞等課題的認識，進一步培力民眾判讀訊息真偽，甚至在查證後積極闢謠、成為阻斷假訊息傳播的防火牆，一步一步累積，讓臺灣的資訊環境愈來愈健康。\n\
    \                                                                            \
    \               (改寫自網路文章)"
