    \ 麾③曰：「去！」。\n\n(乙) 廣笑府 馮夢龍\n        主人待僕眾甚薄，衣食常不周。僕聞秋蟬鳴，問主人曰：「此鳴者何物？」主人曰：「秋蟬。」僕曰：「蟬食何物？」主人曰：「吸風飲露耳。」僕問：「蟬著衣否？」主人曰：「不用。」僕曰：「此蟬正好跟我主人。」\n\
    \n【注釋】：①徑之:直接前往。 ②鐾:音ㄅㄧˋ，鐾刀，即在糙石上一反一正的磨刀刃。 ③麾:同「揮」，揮手。"
