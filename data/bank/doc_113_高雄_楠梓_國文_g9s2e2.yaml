    content: 抓緊投資機會，一旦財經社群有名人分享理財致富的管道，應立刻跟進，以免錯失良機。
  - label: B
    content: 見到網路上有鄰國即將以武力鎮壓台灣的訊息，因時間緊迫，應立刻廣傳親友，提醒大家即刻備戰。
  - label: C
    content: 收到自稱金管會的手機訊息，警告帳戶已遭不肖人士盜用，趕快按照對方指示到提款機操作。
  - label: D
    content: 收到某科技公司的面試通知，開心之餘趕快先向該公司確認，不急著提供個人證件資料給對方。
