- id: doc_113_高雄_楠梓_國文_g9s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 「休息，不僅是為了恢復活力，讓我們等一下或明天工作時更有效率；從心理學的角度來看，當人們的意識長期專注於某個問題後，經常會陷入死胡同中，此時，花再多的時間可能都只是徒勞；但如果能出去散散心，讓褊窄的意識休息，則更為廣遨的潛意識即有浮現的機會，而它就是所謂的靈感。」根據上文，下列何者可作為上文所說「靈感」的例證？
  options:
  - label: A
    content: 伏特為了反駁宗教主張「電是上帝賦予」一說，反覆實驗終於發現電流的產生方式。
  - label: B
    content: 阿基米德在泡澡時突然領悟，發現如何測量皇冠體積大小的方法。
  - label: C
    content: 牛頓過於專注眼前的研究，誤將手中懷錶當作食材，順手丟入鍋中烹煮。
  - label: D
    content: 居禮夫人經過實驗，終於發現新雷射元素——鐳，開創物理學新紀元。
