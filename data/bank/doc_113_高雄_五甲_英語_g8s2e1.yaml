  group_stem: '【題組四】

    A new study says more than a billion people around the world are too fat. There
    is a big problem to worry about because obesity can lead to many health problems.

    Look at the table below. In some places, the obesity problem is worse than any
    other place in the world.

    Woman and Men with Obesity Problems In the World

    Adults (20 years old and over)


    | Women | Obesity rate | Men | Obesity rate |

    |---|---|---|---|

    | Tonga | 81% | American Samoa | 70% |

    | American Samoa | 81% | Nauru | 70% |

    | Samoa | 75% | Tokelau | 67% |

    | Tokelau | 75% | Cook Islands | 66% |

    | Tuvalu | 73% | Niue | 64% |


    In the past, obesity was a problem of the rich. But the study shows that it is
    now a problem of the world. It is time for the countries of the world to take
    action.

    ------------------------------------------------------------

    To know more......

    What is obesity?

    * Obesity means having too much body fat. It usually comes from eating too much
    and not exercising enough

    Ways to do about obesity:

    * It is important to cut down on sweet drinks and fast food and eat more fruit,
    vegetables, and other healthy foods.

    * Get more exercise, at least 150 minutes a week. Walking, biking, swimming, and
    jogging are good for your health.

