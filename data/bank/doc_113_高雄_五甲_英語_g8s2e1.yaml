  group_stem: '【題組二】

    When you need to see a doctor, you''ll surely find a good 2 . But there is one
    important thing you may never thought about: Does your doctor rest enough?

    Doctors in our country often have to work 34 hours or 3 without sleep. Most of
    them work 104 hours a week, and some even 150. (There are only 168 hours a week.)
    One report said that a doctor with long work hours cannot think more clearly than
    a drunk driver. Another one found that doctors who sleep 5.8 fewer hours than
    the week before might make 22% more serious mistakes. It''s for sure that 4 .
    So, how safe would you feel when you are under the care of a tired doctor?

