  group_stem: '【題組三】

    The Price of Fast Fashion

    Fast fashion is popular now. New clothes come out every week, so there are more
    clothes for people to choose from, and clothes are also not as expensive as they
    were in the past. For example, in 2000, fashion companies in Europe only put out
    two collections a year, but that number went up to five in 2011, and it just keeps
    growing and growing every year. As a result, people bought 60% more clothes in
    2014 than they did in 2000.

    Sadly, fast fashion is killing the Earth. The fashion industry wastes resources
    and produces a lot of water and air pollution. When people buy more clothes, fashion
    companies will make and sell more clothes. This will waste more resources and
    produce more pollution. That is a high price for the Earth to pay just for us
