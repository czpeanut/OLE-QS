- id: doc_113_高雄_五福_社會_g7s2e2_s1_32
  section: 1
  number: 32
  type: single
  page: 5
  stem: 根據報導，有關非營利組織（NPO）的說明，以下網友的留言何者正確？
  options:
  - label: A
    content: 金城舞：(甲)說明該團體有影響及監督政府施政的功能，同時具備民間性及自主性。
  - label: B
    content: 鹽埕序：NPO 的性質與以利潤為考量的企業相同，團體盈餘會公平地分給組織成員。
  - label: C
    content: 長景陸：根據(乙)(丙)部分可看出，NPO 需自籌經費，無法獲得政府及企業的資助。
  - label: D
    content: 楠梓汗：(丁)說明該組織符合志願結社的定義，依據法律所保障的集會自由而成立。
  group_stem: '◆ 烏薩奇複習段考時，看到以下報導與課本內容相關，請根據節錄之文章敘述，回答32 至33 題。

    人民組成的團體可積極處理自己與公共事務，提供民意影響政府與群眾、監督政府，使其提升效能，達成公共利益與人民期望。依《人民團體法》第4 條之規定，我國人民團體分為下列三種：職業團體(漁會、農會、工會等)、政治團體(政黨)及社會團體。

    社會團體是以推展文化、學術、醫療、衛生、宗教、慈善、體育、聯誼、社會服務或其他以公益為目的所組成之團體，依照社會學的分類，獨立於政府及企業之外，以公共服務為使命，屬於民間的非營利組織(NPO)。具公益性質的NPO
    組織，可以監督、彌補企業及政府之不足和偏差。以婦女運動組織為例，婦運團體經過一段街頭抗爭的運動期，爭取修訂了「民法親屬篇」，並催生「性別平等工作法」、「家庭暴力防治法」。(甲)

    團體運作時期，也可能因各種變故而遭遇財務困難：以勵馨基金會與台北市政府合作的「獨立生活方案」為例，此一計畫原本補助18 歲以上、結案後的孩子每個月1000
    元的基本生活費，但在財源縮減後喊停，為了不讓這些孩子斷炊輟學，勵馨只好自掏腰包繼續補助下去。(乙)

    NPO 與企業間維持合作關係，企業的幫助對NPO 來說相當重要。台灣世界展望會選擇與自己核心價值、目標一致的企業合作；去年展望會也與富邦慈善文教基金會合作，在非洲莫三比克建了兩座醫療中心，並與新光集團合作，協助南亞的愛滋病患(丙)。

    發展中的台灣NPO，仍有許多困境待克服，需要更多人的關注。希望透過具體行動，能夠鼓勵大家參與。畢竟，這是最後的淨土、社會的良心，無論如何都要好好守護，不能放棄。(丁)

    文章來源：支持社會的良心《台灣NPO 故事》 作者：張瓊方'
  answer:
  - A
