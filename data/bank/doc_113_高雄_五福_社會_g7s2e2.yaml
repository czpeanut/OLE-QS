- id: doc_113_高雄_五福_社會_g7s2e2_s1_44
  section: 1
  number: 44
  type: single
  page: 7
  stem: 依照你的歷史常識判斷，資料一文中的○○事件是指?
  options:
  - label: A
    content: 麻豆事件
  - label: B
    content: 西來庵事件
  - label: C
    content: 二二八事件
  - label: D
    content: 白色恐怖事件。
  group_stem: '※請閱讀下面的文章後，回答第44~45 題:

    資料一:高雄中學自衛隊，是1947 年在○○事件發生期間，由高雄在地學生所組成的武裝學生自治團體，成員以台灣省立高雄第一中學（雄中）的學生為首，除雄中學生之外，成員還包括高雄工業職業學校（雄工）、高雄商業職業學校（雄商）和高雄女子中學（雄女）等校學生。這群學生組成的自衛團體，巡視學校周邊的校園，以保持社會秩序，同時保護了許多受威脅的外省人。在此事件結束後，這群學生被當時政權認為是受到日本教育毒害而反對政府，這段歷史被接下來的社會肅殺氛圍中而被掩蓋了。等到政治氣氛逐漸和緩之後，經台灣史學家等人的研究，此段歷史才逐漸還原，開始受到各界重視。


    資料二:由中央政府派駐在高雄要塞司令彭孟緝，在事件後派出巡邏隊，看到聚集的民眾便開槍射殺；隔日，開始對市區展開砲擊，並向鼓山一路一帶進行掃射、封鎖。憲兵隊隨即佔領高雄車站時，位於車站鄰近的雄中自衛隊，聽到有民眾受困車站，一度對高雄車站展開進擊，但雙方實力與裝備太過懸殊。又隔日，當時高雄市長等人「和平代表團」，進入要塞司令部與彭孟緝談判，但卻傳來全部被以「暴徒和叛亂組織」的名義逮捕，並下令對高雄市政府、高雄車站及高雄中學等三個地點，展開鎮壓的消息。


    資料三:雄中自衛隊稍早接獲軍隊即將進攻雄中的消息，覺悟沒有足以堪用的武器，隨即宣佈開始解散。但彭孟緝不知道雄中內部狀況，仍然進行砲擊，其實當時校園中已經沒有武裝學生，只剩兩千多名避難的外省人。彭孟緝仍以要塞砲攻擊雄中，最後派兩營步兵接收雄中。(註:雄中校園內第二棟紅樓的牆面上，還存留著當時的彈痕，是全台校園唯一的歷史傷痕。)'
  answer:
  - C
  tags:
