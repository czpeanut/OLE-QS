  group_stem: '◆ 寬植於某書籍中看到以下文章，請根據內容所述，回答23 題。

    民眾接觸農產運銷訊息層面最廣泛的，就屬自媒體的美食、直播帶貨等頻道為最。在商業利益驅使下，直播主往往操作「農產品產地」等資訊墊高商品價值，而不顧內容是否誤導消費者。只要農產品搭上知名產地，價格自然飆高甚至翻倍。常見的例子，就是「拉拉山水蜜桃」以及「梨山蜜蘋果」。因為這兩個產地的水蜜桃、蘋果產量均不高，然而美食購物頻道，或是路邊擺攤小販，卻將「物以稀為貴」當作飢餓行銷手段，仗著消費者不會分辨產地品質，魚目混珠說得頭頭是道。還有美食購物影音頻道標榜甜點內餡來自「某知名產區的老欉果樹」，但誰說老的果樹就必然好吃呢？農產品產地被不當地連結與冒用，消費者損失的可能只是荷包，但如果錯誤的假訊息關係到食物的營養價值，最後影響的就是民眾健康問題。'
