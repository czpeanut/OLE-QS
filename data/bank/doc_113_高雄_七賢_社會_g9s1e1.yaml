  stem: 《國家地理雜誌》於2009年評選挪威峽灣為全球最美的旅遊地點。遊客可選擇自駕或搭乘火車，深入長度約為百公里的海灣，周圍環繞著壯麗的山崖和瀑布美景。請問：這壯觀的自然景觀是由什麼樣的地質作用所形成的？
