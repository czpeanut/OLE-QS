  type: single
  page: 1
  stem: 「根據國際移民組織的統計數據顯示，截止到2020年8月中旬，通過海路抵達歐洲的難民和非法移民總數已達到36,221人。這個數字反映出全球移民問題的複雜性及其日益嚴峻的現實情況。其中，抵達義大利的人數為15,338，至於西班牙則有10,468人，這顯示出這兩個國家在接納難民方面的壓力及挑戰。」根據上述，這些難民和非法移民最可能主要來自哪些地區？
