- id: doc_113_高雄_七賢_社會_g9s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 「極光的形成是由於太陽黑子受到地球磁場的影響，進而釋放出帶電粒子。當這些電子微粒進入地球後，會被南北方的磁極所吸引。這些微粒在運動過程中釋放熱能，使得大氣層發光，從而產生極光現象。此現象通常出現在南北緯約67度的環狀區域內。根據傳說，能夠觀賞到極光便能獲得永恆的幸福。因此，每年在適合觀賞極光的季節，許多旅人便會出發前往追逐這一壯麗景象。」依據上文判斷，附圖中哪一個區域是追逐極光的旅人，常前往的地區？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
