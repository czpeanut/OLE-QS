  page: 2
  stem: What is plastic pollution?
  options:
  - label: A
    content: Using plastic to make toys.
  - label: B
    content: Throwing plastic on the ground or into the water.
  - label: C
    content: Cleaning plastic from beaches.
  - label: D
    content: Making plastic at home.
  group_stem: 'Plastic Pollution


    People use plastic every day. We use it to make bags, bottles, cups, and many
    other things. Plastic is cheap and light, but it is also a big problem.


    Many people throw plastic on the ground or into the water. This is called plastic
    pollution. Plastic does not go away fast. It stays in the land and water for many
    years. It can hurt animals. Fish, turtles, and birds can eat plastic. This can
    make them very sick or even kill them.


    We can help stop plastic pollution. We can use less plastic. For example, we can
    use a cloth bag instead of a plastic one. We can drink from a metal bottle instead
    of a plastic bottle. We can also recycle plastic.


    If we all help, we can keep the Earth clean and safe. Let’s say no to plastic
    pollution!


