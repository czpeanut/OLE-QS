  group_stem: 'The Ant and the Grasshopper


    It was summer. The sun was hot, and the days were long. A little ant worked every
    day. He took food to his home. He wanted to be ready for winter.

    A grasshopper saw the ant. He laughed and said, “Why do you work so hard? Come
    and sing with me!”

    The ant said, “I am getting food for winter. You should work, too.”

    But the grasshopper laughed again. He sang and danced all summer.

    Then winter came. The grasshopper had no food. He was cold and hungry. He went
    to the ant’s house and said, “Please give me some food.”

    The ant said, “You sang in the summer. Now you must be hungry in the winter.”


