  stem: 依序完成上述步驟，如(圖一)所示，瓶內水是否會直接流出？為什麼？
  options:
  - label: A
    content: 不會流出，瓶外大氣壓大於寶特瓶口的水壓
  - label: B
    content: 直接流出，因為瓶內水壓大於外面氣壓
  - label: C
    content: 不會流出，瓶外大氣壓等於寶特瓶口的水壓
  - label: D
    content: 直接流出，因為受重力作用。
  group_stem: "現代人注重休閒生活，有時會想出遠門渡假幾天，家裡如果有飼養貓、狗等寵物，沒有人可以幫忙餵食或倒水將是一大煩惱。\n  我們可以藉由基礎的理化概念，動手\
    \ DIY 飲水機，步驟如下\n步驟一：取 1000 c.c.寶特瓶，並將寶特瓶裝滿水。\n步驟二：利用衣架或是木條組裝成 T 字型支架。\n步驟三：取一淺盤，並將淺盤裝滿\
    \ 2/3 水。\n步驟四：將裝滿水寶特瓶，瓶口浸入淺盤水中，並用支架固定。\n根據上述內容，請回答39及40題"
