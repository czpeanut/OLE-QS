  stem: '取甲、乙、丙三個體積相等的物體，其密度如附表所示。將三個物體同時放入水中(這三個物體都不和水產生反應)，則其所受的浮力$B_{\text{甲}}$、$B_{\text{乙}}$、$B_{\text{丙}}$的大小關係為何？


