- id: doc_113_新北_蘆洲_自然_g8s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 音樂會中，音樂家們演奏著大鼓、小提琴和長笛等不同音色的樂器，共同完成美妙的樂曲。根據以上樂器發聲的特性，判斷下列敘述何者錯誤？
  options:
  - label: A
    content: 打擊大鼓時，當鼓聲的振幅越大，表示響度越大
  - label: B
    content: 小提琴可以藉由改變琴弦振動頻率，呈現出不同的音調
  - label: C
    content: 一支音叉沒有固定的振動頻率，可以發出各種頻率的聲音，所以常用來調音
  - label: D
    content: 不同的樂器，因為聲音的波形不同，所以會有不同的音色
