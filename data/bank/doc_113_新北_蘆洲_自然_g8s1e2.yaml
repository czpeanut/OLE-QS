- id: doc_113_新北_蘆洲_自然_g8s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '沛沛帶狗狗散步時，狗狗不小心跑到遠方，於是使用犬笛發出哨音來呼喚狗狗回來，但沛沛卻聽不見哨音。試根據右表數據，判斷該哨音的頻率可能為多少赫？


    | 動物 | 聽覺頻率範圍 |

    | --- | --- |

    | 人 | 20～20000 Hz |

    | 狗 | 50～50000 Hz |'
  options:
  - label: A
    content: '10'
  - label: B
    content: '1000'
  - label: C
    content: '30000'
  - label: D
    content: '300000'
- id: doc_113_新北_蘆洲_自然_g8s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '一艘研究船在水深未知的海域，以聲納探測海底地形。若此研究船發出聲波後，經過0.6 秒就接收到回聲，科學家們研判應是探測到海底的位置，若當時此海域的溫度為5℃，則海底應位於海面下多少公尺深處？


    | 環境的溫度 | 在空氣環境中的聲速 (m/s) | 在海水環境中的聲速 (m/s) |

    | --- | --- | --- |

    | 5℃ | 334 | 1470 |

    | 15℃ | 340 | 1506 |

    | 25℃ | 346 | 1534 |'
  options:
  - label: A
    content: '100.2'
  - label: B
    content: '200.4'
  - label: C
    content: '441'
  - label: D
    content: '882'
