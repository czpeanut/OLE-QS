- id: doc_113_台中_四育_自然_g8s2e1_s1_47
  section: 1
  number: 47
  type: single
  page: 4
  stem: 「『氧化還原反應』是一種重要的化學反應，指的是物質之間發生『氧』的轉移，或者更廣泛地說，是物質之間成分變化的過程。簡單來說，有些物質會跟氧氣結合（氧化），有些物質則會失去氧氣（還原），或者是物質內部的組成發生了變化。這種反應在自然界和我們的日常生活中都非常常見。下列選項中，哪一個過程並非屬於這種成分變化的氧化還原反應？」
  options:
  - label: A
    content: 呼吸作用：生物體利用氧氣分解葡萄糖，釋放能量的過程，這個過程中氧氣與葡萄糖的組合發生了變化。
  - label: B
    content: 滲透作用：水分通過半透膜從低濃度區域向高濃度區域移動的過程，是一種物理現象，分子的移動，物質的成分並未發生變化。
  - label: C
    content: 光合作用：植物利用光能將二氧化碳和水轉化為葡萄糖和氧氣的過程，二氧化碳轉變為葡萄糖，水的分子式也產生了變化。
  - label: D
    content: 金屬冶煉：從礦石中提取金屬的過程，通常需要通過化學反應去除金屬氧化物中的氧，屬於失去氧氣的還原反應。
