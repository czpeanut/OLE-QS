- id: doc_113_台中_四育_自然_g8s2e1_s1_48
  section: 1
  number: 48
  type: single
  page: 4
  stem: 「我們知道，要從鐵礦石（主要成分是氧化鐵$Fe_{2}O_{3}$）中提煉出鐵，通常會在高爐中進行。在高爐裡，氧化鐵和碳（C）在高溫下發生化學反應，生成鐵和二氧化碳（$CO_{2}$）。這個過程其實是一個『氧化還原反應』，也就是說，有些物質會失去氧（還原），有些物質則會得到氧（氧化）。根據下面的化學反應方程式：$2Fe_{2}O_{3}
    + 3C \rightarrow 4Fe + 3CO_{2}$，請問在這個反應中，哪一個物質有能力幫助另一個物質失去氧，也就是『還原』另一個物質呢？」
  options:
  - label: A
    content: $Fe_{2}O_{3}$（氧化鐵）：鐵礦石的主要成分，在這個反應中失去氧。
  - label: B
    content: C（碳）：變成二氧化碳。
  - label: C
    content: Fe（鐵）：反應的產物，是氧化鐵被還原後的結果。
  - label: D
