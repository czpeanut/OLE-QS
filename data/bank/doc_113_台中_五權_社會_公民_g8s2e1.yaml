questions:
- id: doc_113_台中_五權_社會_公民_g8s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 阿華租了一間房子，並與房東簽訂租賃契約，請問雙方在契約關係中擁有哪些權利義務？
  options:
  - label: A
    content: 阿華每個月有付租金的權利住在房子裡，租約到期時有搬離的義務
  - label: B
    content: 房東在租期內有將房子鑰匙給阿華的義務，並向阿華收取租金的權利
  - label: C
    content: 房東在租期內擁有房屋的使用權利，並有按時支付租金的義務
  - label: D
    content: 阿華可以在未告知房東的情況下轉租給他人，當起二房東
- id: doc_113_台中_五權_社會_公民_g8s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 民法有「消滅時效」的規定，請問：小棻請求小昇返還13年前的借款，應該如何做才對？
  options:
  - label: A
    content: 小棻權利消滅無法再行使，小昇不用還錢
  - label: B
    content: 小棻的權利仍然有效，但需要法院核准才能向小昇要求還款
  - label: C
    content: 小棻的權利仍然有效，小昇有還錢的義務
  - label: D
    content: 需要與對方重新簽訂契約才能有效
- id: doc_113_台中_五權_社會_公民_g8s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 依據「契約自由原則」，以下哪一種契約是無效的？
  options:
  - label: A
    content: 甲、乙雙方約定從事偷竊行為並將所得財物一人一半
  - label: B
    content: 甲、乙雙方約定共同租房並平均分擔租金
  - label: C
    content: 甲、乙雙方約定未來6 個月，每週末一起去圖書館
  - label: D
    content: 甲、乙雙方約定若未做到每週一起去跑步30 分鐘，違約者需賠償對方 100 萬元，儘管該金額遠超過合理範圍
- id: doc_113_台中_五權_社會_公民_g8s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 依據民法，滿7 歲未滿 18 歲的人若自行購買高價商品，請問該行為的法律效力為何？
  options:
  - label: A
    content: 有效，因為已經付款
  - label: B
    content: 有效，屬於限制行為能力人
  - label: C
    content: 需要商店老闆的認可才有效
  - label: D
    content: 需要事先取得法定代理人允許，或事後由法定代理人承認，否則無效
- id: doc_113_台中_五權_社會_公民_g8s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 承上題，訂立此規定的用意為何？
  options:
  - label: A
    content: 保護限制行為能力人的權益
  - label: B
    content: 保護受監護宣告者的權益
  - label: C
    content: 預防未成年人的犯罪行為
  - label: D
    content: 維護無行為能力人的權益
  group_stem: （第 4 題）依據民法，滿7 歲未滿 18 歲的人若自行購買高價商品，請問該行為的法律效力為何？
- id: doc_113_台中_五權_社會_公民_g8s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 民法的主要功能是什麼？
  options:
  - label: A
    content: 規範政府機關的行政程序
  - label: B
    content: 是一部規定私人間日常生活上權利義務相關的法律
  - label: C
    content: 規範何種行為構成犯罪
  - label: D
    content: 制定國家稅收政策
- id: doc_113_台中_五權_社會_公民_g8s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 關於「契約」的成立，下列敘述何者不正確？
  options:
  - label: A
    content: 土地所有權的轉移等，除了要有書面契約外，也需要登記，才屬有效
  - label: B
    content: 當事人必須具有法律上的行為能力
  - label: C
    content: 「權利濫用禁止原則」是民法與其他法律的最高指導原則
  - label: D
    content: 內容不得違反公共秩序、善良風俗或法律的規定
- id: doc_113_台中_五權_社會_公民_g8s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 民事糾紛的解決方式中，何者不具有法院強制執行力？
  options:
  - label: A
    content: 雙方當事人私下和解
  - label: B
    content: 調解成功之後，送法院核定的調解書
  - label: C
    content: 民事訴訟法院的判決結果
  - label: D
    content: 民事訴訟的過程中，在法官面前達成和解
- id: doc_113_台中_五權_社會_公民_g8s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 下列哪一項屬於「侵權行為」？
  options:
  - label: A
    content: 小明簽訂租屋契約，卻未按時繳房租
  - label: B
    content: 小華未經同意，把朋友的照片上傳到社群媒體
  - label: C
    content: 小普跟小匯買了5 萬元的機車並約定一個月後交貨，但過了一個月後要交貨的機車卻因為火災燒毀了，小匯無法交貨給小普
  - label: D
    content: 小王與朋友借錢，並於到期後歸還
- id: doc_113_台中_五權_社會_公民_g8s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 依據鄉鎮市調解條例，調解委員會的主要作用為何？
  options:
  - label: A
    content: 提供法律諮詢服務
  - label: B
    content: 幫助當事人提出訴訟
  - label: C
    content: 提供免費服務，為聲請調解的民眾解決糾紛
  - label: D
    content: 直接裁決當事人應負的法律責任
- id: doc_113_台中_五權_社會_公民_g8s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 根據民法，契約的成立條件為何？
  options:
  - label: A
    content: 需要送法院核可
  - label: B
    content: 需要雙方書面簽名蓋章，只有口頭上的約定並不算數
  - label: C
    content: 只要雙方具有法律上的行為能力，當事人意思表示一致即可
  - label: D
    content: 需要有兩位以上的證人
- id: doc_113_台中_五權_社會_公民_g8s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 依據民法，當事人在進行民事訴訟時，下列哪一項陳述是正確的？
  options:
  - label: A
    content: 被告不需要提出證據，法官會自行調查事實，讓真相水落石出
  - label: B
    content: 小棻欠小靖5 萬元，因為法官是小靖的鄰居，知曉此事後法院會自動介入審查此事件
  - label: C
    content: 只有原告須自行提出有利證據給法官
  - label: D
    content: 民事訴訟的判決可以強制執行
- id: doc_113_台中_五權_社會_公民_g8s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 下列何者符合「誠實信用原則」？
  options:
  - label: A
    content: 賣家標示商品為「全新」，但被消費者發現實際上是展示品
  - label: B
    content: 在賣場門口標示「貨真價實，童叟無欺」
  - label: C
    content: 小紫向銀行貸款買了一部新車，繳了兩個月的車貸後，就再也不繳了
  - label: D
    content: 雇主通知求職者錄取，求職者也回應雇主願意前往任職，求職者並著手辦理現職工作的離職手續，之後雇主反悔，收回錄取通知，造成該名求職者「兩邊工作都落空」
- id: doc_113_台中_五權_社會_公民_g8s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: 下列關於民法的規定敘述何者正確？
  options:
  - label: A
    content: 當夫妻其中一方過世時，配偶對於亡者的財產享有繼承的權利，這是屬於私人間財產上的權利義務關係
  - label: B
    content: 結婚除了雙方當事人同意外，還須經過父母當証人的書面同意
  - label: C
    content: 沒有向戶政機關辦理結婚登記的婚姻，仍屬有效
  - label: D
    content: 男、女當事人均須年滿 18 歲，才能結婚
- id: doc_113_台中_五權_社會_公民_g8s2e1_s1_15
  section: 1
  number: 15
  type: single
  page: 1
  stem: 下列四位民眾，哪幾位在民法上的「行為能力」是相同的？(甲)5 歲天才兒童小青 (乙)16 歲的高中生小棻 (丙) 35 歲受監護宣告的阿良 (丁)68
    歲已退休的張爺爺
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 丙丁
  - label: D
    content: 甲丙
- id: doc_113_台中_五權_社會_公民_g8s2e1_s1_16
  section: 1
  number: 16
  type: single
  page: 1
  stem: 下列四本書籍，何者不屬於「民法」範圍的主題？
  options:
  - label: A
    content: 公寓大廈管理條例
  - label: B
    content: 如何請求車禍賠償
  - label: C
    content: 婚姻權益與離婚狀例
  - label: D
    content: 不動產契約書怎麼簽
