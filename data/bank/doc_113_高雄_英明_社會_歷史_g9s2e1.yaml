  stem: 歷史老師為了讓同學們對第一次世界大戰有更深的了解，於是讓同學們扮演參與這場戰爭的國家，藉由將這些國家擬人化，搭配戲劇的演出，來了解這場戰爭的爆發與經過。下列是同學們扮演的國家及對應這些國家的臺詞。請問：何者內容與史實不符？甲、奧國：我要塞爾維亞為殺害我國皇位繼承人付出代價
