  section: 1
  number: 21
  type: single
  page: 1
  stem: 羅賓打算以19 世紀某一影響歐洲局勢發展的會議，做為她的歷史研究專題。她在找尋資料時，看到以下這則敘述：「這場會議由奧相梅特涅召開，以正統及補償兩大原則進行討論，導致事後許多小國遭到犧牲來維持大國之間的勢力均衡，進而恢復歐洲舊有秩序。這些政治操作卻也導致日後歐洲的革命浪潮不斷。」請問：這場會議為何？
