  type: single
  page: 5
  stem: '康德曾提出「實踐理性」這個概念，那是一種處理欲求的能力，最高級的表達便是「意志」。康德所謂的「意志」是純粹意志、是絕對善的意志，也是自律的意志。道德法則對於「意志」是命令亦是強制，凡依道德法則而行者即是善。同時，康德認為所有符合道德價值的行為都必須出自義務，他不受任何愛好或利己之心的驅使，更不在對幸福的追求之上，純粹出於義務自身。善的行為之所以為善，乃因其動機為善，而不在產生的結果與預想的目的，這種出自於善意本身的行為，才具有絕對的善。　　（改寫自康德《實踐理性批判》）


    根據上文，下列何者符合康德定義「道德價值」的行為？'
  options:
  - label: A
    content: 餐廳老闆表示生意長紅的法則乃是誠實與用心，一旦顧客持續上門，再高的成本都會成為利潤
  - label: B
    content: 新冠肺炎的疫情讓醫療面臨崩盤危機，長者們紛紛呼籲把資源留給年輕人，讓犧牲更有價值
  - label: C
    content: 研究顯示，助人愈多者情緒愈正面。許多憂鬱症患者便去擔任志工，既幫了自己，也幫了別人
  - label: D
    content: 因誤判而晉級的選手要求重賽，或許會因此失去晉級資格，但選手表示誠實是他人生唯一選項
