  stem: 依據上文，關於大蒜素的敘述，下列敘述最適當的選項是？
  options:
  - label: A
    content: 服用蒜胺酸和蒜胺酸酶，難以在體內有效產生大蒜素
  - label: B
    content: 大蒜素能降低膽固醇，十多年前已獲得人體試驗證實
  - label: C
    content: 原存於大蒜的大蒜素受熱時產生誘烯醚，散發辛辣味
  - label: D
    content: 古代醫典已記載大蒜素，但至二十世紀才找到萃取法
  group_stem: '4500年前，蘇美楔形文已提到大蒜。大蒜用於醫療，與食用歷史一樣久遠。古埃及《艾伯斯手卷》、古印度《揭羅迦本集》均記載多種大蒜療病藥方。當代研究也認為大蒜對痢疾、心血管疾病、癌症等有防治功效，但這些研究多來自體外或動物實驗，尚待人體試驗證實。例如曾有研究指出大蒜能降低膽固醇，但美國國家衛生研究院2007年發表的人體試驗結果，卻不符原先的預期。

    　　大蒜的辛辣味來自大蒜素，烹煮時的香味來自大蒜素的分解產物，主要是揮發性的誘導烯醚。1944年，化學家卡瓦里托（Chester J. Cavallito）從蒜片萃取出大蒜素。但大蒜素原不存在於大蒜裡，而是大蒜破裂時，細胞釋出的蒜氨酸酶將大蒜內含的蒜氨酸分解，所形成的化合物。大蒜素含丙烯基與氧化硫基，易與蛋白質的硫醇起作用，抑制一些酵素的活性，故具殺菌效果。大蒜素屬於硫化物，吃大蒜會產生口臭，即因硫化物釋出所致。

    　　許多人認為大蒜素有益健康，且認為大蒜要生吃才有效。為了不讓胃酸破壞大蒜素，有些生技公司將蒜胺酸和蒜胺酸酶分別包進膠囊，希望在腸道形成大蒜素以獲致療效。但實驗證明達成度極低，吃太多大蒜素也會傷肝。

    　　一氧化氮、一氧化碳、硫化氫為三種氣態的神經傳遞物。由於大蒜會促進體內產生一氧化氮，易刺激興奮，影響心神，所以佛教、道教修行者皆禁食大蒜。　　（改寫自徐明達〈大蒜的化學〉）'
