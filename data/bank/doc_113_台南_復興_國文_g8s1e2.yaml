- id: doc_113_台南_復興_國文_g8s1e2_s5_10
  section: 5
  number: 10
  type: single
  page: 3
  stem: '冰山理論（Iceberg Theory）是由心理學家薩提爾提出的，它指的是我們所看到的現象只是冰山的一角，而隱藏在水面下的部分才是更重要的深層原因和本質。心理學中，這個理論常用於解釋人的行為和情感。表面上的行為只是冰山的一部分，真正驅動這些行為的深層次動機、情感和經歷則隱藏在水面下。而在文學創作中，作家常只展示行為的表面部分，而將深層的意義和情感隱藏在文字背後，讓讀者通過細節和暗示去體會和理解。


    依據上文的冰山理論，我們從〈五柳先生傳〉來推論五柳先生的冰山，下列推論何者錯誤？


    | 選項 | 表面的冰山 | 水面下的冰山 |

    | :--- | :--- | :--- |

    | (A) | 好讀書，不求甚解，每有會意，便欣然忘食 | 善思考，見解獨到，發憤讀書展長才 |

    | (B) | 造飲輒盡，期在必醉，既醉而退，曾不吝情去留 | 任真自得，隨心所欲作自己 |

    | (C) | 環堵蕭然，不蔽風日，短褐穿結，簞瓢屢空——晏如也 | 安貧樂道，無入而不自得 |

    | (D) | 常著文章自娛，頗示己志 | 追隨本心，不求功利，無所為而為 |'
  options:
  - label: A
    content: (A)
  - label: B
    content: (B)
  - label: C
    content: (C)
  - label: D
    content: (D)
