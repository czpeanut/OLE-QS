  - label: B
    content: 「我新死，不知鬼悉何所畏忌」$\rightarrow$定伯以剛死為由，伺機探問鬼禁忌，以攻其不備
  - label: C
    content: 「定伯自渡，漕漼作聲」$\rightarrow$定伯渡水時，鬼在一旁發出漕漼聲，表示對定伯的疑惑
  - label: D
    content: 「新死不習渡水耳，勿怪」$\rightarrow$定伯因胸無城府，故不擅長模仿鬼渡水，請鬼勿見怪
