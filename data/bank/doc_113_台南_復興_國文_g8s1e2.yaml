- id: doc_113_台南_復興_國文_g8s1e2_s4_1
  section: 4
  number: 1
  type: fill
  page: 1
  stem: '〈五柳先生傳〉一文先「敘事」後「評論」，請問這些評論呼應了五柳先生的哪些行跡？（填代號）


    五柳先生行跡：

    (A) 先生不知何許人也，亦不詳其姓字

    (B) 閑靜少言，不慕榮利

    (C) 性嗜酒，造飲輒盡，期在必醉，既醉而退，曾不吝情去留

    (D) 環堵蕭然，不蔽風日；短褐穿結，簞瓢屢空——晏如也

    (E) 常著文章自娛，頗示己志


    | 評論 | 所對應的行跡 |

    | :--- | :--- |

    | 不戚戚於貧賤，不汲汲於富貴。 | |

    | 酣觴賦詩，以樂其志。 | |

    | 無懷氏之民歟！葛天氏之民歟！ | |'
  lesson_raw:
    title: 五柳先生傳
    basis: 題目指明出自〈五柳先生傳〉
