- id: doc_113_台南_復興_國文_g8s1e2_s4_2
  section: 4
  number: 2
  type: fill
  page: 1
  stem: '陳太丘與友期行，期日中。過中不至，太丘舍去，去後乃至。元方時年七歲，門外戲。客問元方：「尊君在不？」答曰：「待君久不至，已去。」友人便怒曰：「非人哉！與人期行，相委而去。」元方曰：「君與家君期日中。日中不至，則是無信；對子罵父，則是無禮。」友人慚，下車引之，元方入門不顧。


    根據上文記述事件的先後次序，排列下列各個項目。

    A 陳太丘友人指斥陳太丘

    B 陳太丘外出

    C 陳元方走進家門

    D 陳元方指責陳太丘友人

    E 陳元方在家門外玩耍


    _____ $\rightarrow$ _____ $\rightarrow$ _____ $\rightarrow$ _____ $\rightarrow$
    _____'
