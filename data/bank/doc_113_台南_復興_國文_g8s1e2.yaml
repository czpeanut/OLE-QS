- id: doc_113_台南_復興_國文_g8s1e2_s8_1
  section: 8
  number: 1
  type: single
  page: 6
  stem: 根據文意，下列何者最適合填入「_______」內？
  options:
  - label: A
    content: 逝者如斯夫，不捨晝夜
  - label: B
    content: 人無遠慮，必有近憂
  - label: C
    content: 人生無根蒂，飄如陌上塵
  - label: D
    content: 歲寒，然後知松柏之後凋
  group_stem: '巴菲特上中學時，除利用課餘時間做報童外，還與夥伴一起將彈子球遊戲機出租給理髮店老闆，賺取外快。他的夫人回憶他年輕時的趣事：「大多數孩子都心滿意足地喝著從機器裡倒出來的汽水，但他們從來不去多想什麼，只有巴菲特撿起汽水機旁被人們丟棄的瓶蓋，把它們分門別類，並數一下各種瓶蓋的數量，看看哪個牌子的汽水賣得快。」

    　　他不僅對投資理財有一套獨特哲學，生活的語言也充滿睿智，有人將他給年輕人的生涯忠告整理出來，看得出，那是他自己年輕時的心得：「永遠不要放棄尋找你真正有熱情的工作，和你喜愛的人交朋友，做你喜歡做的事。」要「慎選學習典範」，從你選擇的學習對象，就可以看到你未來的發展。結交比你優秀的人，你才能往更好的方向發展。

    　　這位傳奇股神自謙地說：「我很理性。很多人比我智商更高，很多人也比我工作時間更長，更努力，但我做事更加理性。你必須能夠控制自己，不要讓情感左右你的理智。」他也說：「這麼多年，我的工作是閱讀。我閱讀我所關注的公司的年報，同時我也閱讀它的競爭對手的年報，這些是我最主要的閱讀材料。」這位長者在職場奮發工作，已經超過六十年了。

    　　年歲與財富齊飛，2017年，八十七歲的巴菲特說：「時間是精彩事業的朋友，但卻是平庸事業的敵人。」時間，對人們來說，的確是最公平的東西，每個人每天都擁有24小時。人們容易懂得馬克·吐溫所說的「黃金時代在我們的前面，而非在我們的背後」，那是對時間的珍惜與樂觀。可是，當察覺世事變化之快，深深感慨_______，多數人不免務實地對「餘命」多了焦慮感，少了安全感。在一場記者會上，記者問巴菲特，希望後人如何追念他？巴菲特回答：「這個嘛，我希望牧師說：『我的天！他真老！』」對生死的豁達與幽默，大概對那些常常在意「失去」的初老的人們，或多或少有些啟示。　　（改寫自王浩一〈初老的潛孤獨〉）'
