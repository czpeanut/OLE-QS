  stem: 根據甲文，關於泰興縣令最後對蝗災的作為，最接近的選項是？
  options:
  - label: A
    content: 不在其位，不謀其政
  - label: B
    content: 出乎爾者，反乎爾者也
  - label: C
    content: 人死，則曰：「非我也，歲也。」
  - label: D
    content: 取之以道，用之以時
  group_stem: '甲、

    　　穆甫為如皋令，歲旱蝗，而泰興令獨給郡將云：「縣界無蝗。」已而蝗大起，郡將詰之，令辭窮，乃言：「縣本無蝗，蓋自如皋飛來。」乃檄如皋請嚴捕蝗，無使侵鄰境。穆甫得檄，輒書其紙尾：報曰：「蝗本是天災，即非縣令不才，既自敝邑飛去，卻請貴縣押來。」未幾，傳至都下，無不絕倒。（郭子章《諧語》）

    乙、

    　　貞觀二年，京師旱，蝗蟲大起。太宗入苑視禾，見蝗蟲，掇數枚而咒曰：「人以穀為命，而汝食之，是害於百姓。百姓有過，在予一人，爾其有靈，但當蝕我心，無害百姓。」將吞之，左右遽諫曰：「恐成疾，不可！」太宗曰：「所冀移災朕躬，何疾之避！」遂吞之。自是蝗不復為災。（《貞觀政要·務農》）

    丙、

    　　開元初，山東大蝗。姚元崇請分遣使捕蝗埋之。玄宗曰：「蝗，天災也。誠由不德而致焉。卿請捕蝗，得無違而傷義乎？」元崇進曰：「臣聞〈大田〉詩曰『秉畀炎火①』者，捕蝗之術也。古人行之於前，陛下用之於後。古人行之，所以安農；陛下行之，所以除害。臣聞安農，非傷義也，農安則物豐，除害則人樂。興農去害，有國之大事也，幸陛下熟思之。」玄宗喜曰：「事既師古，用可救時，是朕心也。」遂行之。時中外咸以為不可，玄宗謂左右曰：「吾與賢相討論已定，捕蝗之事，敢議者死！」是歲，所司結奏，捕蝗蟲凡百餘萬石，時無饑饉，天下賴焉。　　（鄭繁〈傳信記〉）

    註解：①秉畀炎火：將蟲投入烈火燒掉。'
