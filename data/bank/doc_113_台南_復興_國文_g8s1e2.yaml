- id: doc_113_台南_復興_國文_g8s1e2_s5_21
  section: 5
  number: 21
  type: single
  page: 5
  stem: '某天清晨老王正在遛狗，突有殺手從草叢裡竄出來。砰！砰！兩槍把狗打死。老王大怒：「你殺我的狗幹什麼？」殺手：「有人花五百萬，讓我取你的狗命！」老王激動：「你的國文老師是誰？我要感謝他。」

    　　隔天殺手再竄出，拿水潑老王，殺手：「雇主出一千萬要見你全屍。」

    　　第三天殺手再竄出，搶走老王的 iphone。老王：「你搶我手機幹嘛？」殺手：「雇主再出兩千萬，讓我取你手機。」老王細想，再次感恩。

    　　第四天，老王在蹲完廁所正要沖水，殺手竟從窗戶躍進。驚覺殺手直奔家門，急喊：「我不要死！」殺手：「雇主要你屎！別沖水，三千萬。」殺手迅速撈走馬桶內的黃金。

    　　經過多次死裏逃生後，老王深怕殺手頓悟，改在晚上外出，但殺手依然竄出，綁住他的手腳，並用黑布矇住他的雙眼。老王這次顫抖著問：「你終於懂了，要……」殺手：「沒錯，要你看不到明天的太陽，四千萬，拜託你忍到太陽下山。」

    　　之後老王正常生活，殺手又出現，但只是聊天帶他到山頂。殺手：「不聊了，我要下山去領錢了！」老王不解，殺手：「當然是雇主花五千萬要我送你上山頭！」


    根據上文，下列有關殺手行為的說明何者錯誤？'
  options:
  - label: A
    content: 第一次開槍把狗打死，因為與雇主對「狗命」的詞彙認知不同，產生歧義
  - label: B
    content: 第二次拿水潑老王「見你全溼」，但雇主要求應是「見你全屍」，兩者諧音
  - label: C
    content: 第三次搶老王手機、第四次撈走黃金，分別肇因於注音符號聲符、韻母的發音差異
  - label: D
    content: 「看不到明天的太陽」、「上山頭」是字面上委婉的說法，但殺手以字面意義執行
