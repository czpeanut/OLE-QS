    \    但乞丐在等待著……他伸出的手軟弱無力地擺動著、顫抖著。我手足無措，羞愧不安，我緊緊地握住那隻骯髒的、顫抖的手。\n   「對不起，兄弟，我身上什麼東西也沒有，兄弟。」\n\
    \    乞丐用他紅腫的眼睛盯著我：他發青的嘴脣微微一笑。他也緊緊地握了握我冰冷的手指。\n   「哪兒的話，兄弟，」他含糊不清地說。\n   「就這樣也得謝謝你啦。這也是周濟啊，兄弟。」\n\
