  stem: '「每一個詩人，都活在他們的詩句中，只要有人開始誦讀，那麼詩人便從千古而來，與讀者雙手緊緊相握。所以詩人死後不會更加衰老，只會日益年輕，他們由死而得生，和大部分的由生而入死恰好相反。詩人必須死亡，唯有死亡與時間才能排除太多不必要的現實因素，還給詩一個真正的面貌與地位，他們生命的旅程這才開始。」

