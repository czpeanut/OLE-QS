  section: 1
  number: 19
  type: single
  page: 2
  stem: '「世之觀畫者，多能指摘其間形象、位置、彩色瑕疵而已，至於奧理冥造①者，罕見其人。如彥遠畫評言：「王維畫物，多不問四時，如畫花往往以桃、杏、芙蓉、蓮花同畫一景。」余家所藏王維畫袁安臥雪圖，有雪中芭蕉，此乃得心應手，意到便成，故其理入神，迥②得天意，此難可與俗人論也。」

    （註：①奧理冥造：暗合深奧的道理。②迥：深。）

    根據這段文字，王維的繪畫風格與下列何西洋畫派的畫風較接近？'
