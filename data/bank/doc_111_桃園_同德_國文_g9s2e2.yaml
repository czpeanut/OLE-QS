- id: doc_111_桃園_同德_國文_g9s2e2_s2_34
  section: 2
  number: 34
  type: single
  page: 4
  stem: 下列何者是阿里地區適合設立天文台的原因之一？
  options:
  - label: A
    content: 人口稀少
  - label: B
    content: 空氣稀薄
  - label: C
    content: 科技發達
  - label: D
    content: 資金雄厚
  group_stem: "位於臺中的國立自然科學博物館成立一個「青藏高原天文遠距觀測中心」，就是由臺灣遠距操控位於青藏高原上的天文臺。這是孫維新教授克服重重難關所建造，是目前世界上少數海拔高度超過5000\
    \ 公尺的光學天文臺之一！\n   青藏高原天文臺設立於西藏的阿里地區，平均海拔高達4500 公尺（天文臺的設置地點更高達5100 公尺），是全西藏最西邊、最荒涼的地方，且一年中有長達八個月都是乾燥晴朗的好天氣，加上人口稀少，沒有文明帶來的光害與汙染，空氣非常澄澈，因此成為天文學家夢寐以求的觀星地點。\n\
    \    只不過要看到這片世界級的星空可不容易，在此地設立天文臺的難度極高，到達天文臺設立地點的路途非常遙遠，且路況惡劣，需要克服高原上的酷寒與強風，而空氣稀薄造成的高原反應使人心悸、頭痛、噁心，加上生活條件極差，建置過程令孫維新教授的研究團隊苦不堪言。\n\
    \    2010 年10 月26 號，在阿里首都獅泉河鎮旁的高山上，建造天文臺圓頂及太陽能站的工程開始進行，在克服重重難關後，終於能夠正常遠距觀測，當拍攝到第一個清晰星雲影像的那刻，整個研究團隊都感動不已！\n\
    \    目前已經可以借助衛星傳輪，讓臺灣的科研國隊和天文愛好者連線和造控4000 公里外、海拔5100 公尺處的望遠鏡，一起觀賞和探尋西藏瑰麗的夜空。"
