  stem: '「詩是『煎』出來的，有時要用文火，有時要用武火，但最怕無物可煎。詩是『捕捉』過來的，有時會抓到小野兔，有時會碰到難纏的狗熊，但最怕『陷阱』始終是空的。然而更重要的是：『火』隨時要點著，『陷阱』要隨時安放，隨時去巡察。詩若要靠『偶然』去撞上，機會真是少啊！」

