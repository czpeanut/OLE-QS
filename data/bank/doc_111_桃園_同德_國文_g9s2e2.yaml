- id: doc_111_桃園_同德_國文_g9s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: '那條秋刀魚烤得無論在熟度或軟硬都恰到好處，海鹽抹得多一粒則太鹹，少一粒則太淡，秋刀魚靜靜地躺在長方形白塑膠盤上，無論是身體的褐色或背上的黑色都呈現亮眼的光澤，腹部尤其肥美，油油亮亮的，筷子一戳下去，發出微微的「喀滋」聲。「秋刀魚都是我一條條親手從市場挑回來的，我只把最好的選走。」她一邊說一邊為我們擠上新鮮的檸檬汁。魚腸的部分有微微的苦味，生啤酒也是，她說：「那是大人的味道。」

    關於這段文字的寫作手法，下列敘述何者不恰當？'
  options:
  - label: A
    content: 以大人的味道來類比魚腸的苦味
  - label: B
    content: 以聽覺摹寫展現秋刀魚外皮蘇脆
  - label: C
    content: 以譬喻手法來描給秋刀魚的外形
  - label: D
    content: 以誇飾法描述秋刀魚的調味適中
