  stem: '「宋河中府浮梁①，用鐵牛八繫之，一牛且數萬斤。治平中，水暴漲絕梁，牽牛沒於河。募能出之者。真定僧懷丙以二大舟實土，夾牛繫之，用大木為權衡②狀鉤牛，徐去其土，舟浮牛出。」

    （註：①浮梁：浮橋。②權衡：秤錘秤桿。）

