  group_stem: "〈乞丐〉屠格涅夫原著、許海燕譯\n    我在街上行走……\n    一個乞丐、一個衰弱不堪的老人攔住了我。紅腫的、含淚的眼睛，發青的嘴唇，粗糙的、襤褸的衣裳，齷龊的傷口……唉，貧窮把這個不幸的人啃噬成了什麼模樣啊！\n\
    \    他向我伸出一隻紅腫、骯髒的手……他呻吟著，他發出含糊不清的聲音哀求施捨。\n    我摸索身上所有的口袋……沒有錢包，沒有懷表，甚至連一塊手帕也沒有－－我什麼東西也沒帶。\n\
    \    但乞丐在等待著……他伸出的手軟弱無力地擺動著、顫抖著。我手足無措，羞愧不安，我緊緊地握住那隻骯髒的、顫抖的手。\n   「對不起，兄弟，我身上什麼東西也沒有，兄弟。」\n\
    \    乞丐用他紅腫的眼睛盯著我：他發青的嘴脣微微一笑。他也緊緊地握了握我冰冷的手指。\n   「哪兒的話，兄弟，」他含糊不清地說。\n   「就這樣也得謝謝你啦。這也是周濟啊，兄弟。」\n\
    \    我明白了，我也從我的兄弟那兒得到了周濟。"
