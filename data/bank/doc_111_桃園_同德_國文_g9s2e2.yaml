  stem: 關於這兩篇作品的內容，下列敘述何者正確？
  options:
  - label: A
    content: 甲作品以凋零春景為場景，乙作品以月下獨酌為場景
  - label: B
    content: 甲作品的重逢遙遙無期，乙作品則預告兩人即將相逢
  - label: C
    content: 兩篇作品皆抒發相思之苦，並隱含對思念之人的關懷
  - label: D
    content: 兩篇作品主角皆以登樓賞景，來排解連綿無盡的愁思。
  group_stem: '（甲）

    愁雲淡淡雨瀟瀟。暮暮復朝朝。別來應是，眉峰翠減，腕玉香銷。    小軒獨坐相思處，情緒好無聊。一叢萱草，幾竿修竹，數葉芭蕉。（石孝友〈眼兒媚〉）

    （乙）

    丁丁漏水①夜何長，漫漫輕雲露月光。

