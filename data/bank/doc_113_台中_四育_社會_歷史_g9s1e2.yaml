  - label: D
    content: 君士坦丁堡
  group_stem: '(三)

    資料一：

    伊斯蘭傳統認為天房是天堂的建築，也就是「天使崇拜真主之處」在地上的翻版，而天房的位置就直接在天堂之下。

    伊斯蘭教的「五功」中，每日五次的禮拜就是朝天房進行，一生一次的朝聖也是前往天房。

