  number: 24
  type: single
  page: 3
  stem: 針對臧克家「有的人活著，他已經死了；有的人死了，他還活著」這句話，同學紛紛發表看法。下列敘述，何者正確？
  options:
  - label: A
    content: 荷包蛋：「有的人死了，他還活著」，表示人得過且過，勉強生存，意近於「苟且偷生」
  - label: B
    content: 太陽蛋：「有的人死了，他還活著」，表示度過重重危機而倖存下來，意近於「死裡逃生」
  - label: C
    content: 炒蛋：「有的人活著，他已經死了」，表示人因驚嚇過度而心不自主，意近於「魂不附體」
  - label: D
    content: 大混蛋：「有的人活著，他已經死了」，表示人徒具形骸，庸碌無為，意近於「行屍走肉」
- id: doc_111_高雄_大灣_國文_g7s2e1_s3_25
  section: 3
  number: 25
  type: single
  page: 3
  stem: 任何一種抽象的觀念、情感與看不見的事物，不直接予以指明，而是透過某種具體形象作媒介，間接加以陳述的表達方式，稱為「象徵」。下列各敘述，何者說明正確？
  options:
  - label: A
    content: 差不多先生：「你一定見過他，一定聽過別人談起他，差不多先生的名字，天天掛在大家的口頭，因為他是中國全國人的代表」，可見胡適以「差不多先生」象徵中國人開枝散葉，在全球都能遇到中國人
  - label: B
    content: 背影：「他和我走到車上，將橘子一股腦兒放在我的皮大衣上，於是撲撲衣上的泥土，心裡很輕鬆似的」，可見朱自清十分喜愛食用橘子，「橘子」是朱自清飲食偏好的象徵
  - label: C
    content: 孟郊在「慈母手中線，遊子身上衣。臨行密密縫，意恐遲遲歸。誰言寸草心，報得三春暉」中以「寸草心」及「三春暉」象徵子女像區區小草，母愛如春天陽光
  - label: D
    content: 王維以「紅豆生南國，春來發幾枝。願君多采擷，此物最相思」傳達南國盛產紅豆，「紅豆」是地方人士殷殷期盼產季到來的象徵
- id: doc_111_高雄_大灣_國文_g7s2e1_s4_1
  section: 4
  number: 1
  type: single
  page: 3
  stem: 關於定伯賣鬼的說明，何者為非？
  options:
  - label: A
    content: 定伯臨危不亂，終能化險為夷
  - label: B
    content: 鬼最大的敗筆在於胸無城府
  - label: C
    content: 定伯與鬼鬥智，是為了謀取暴利
  - label: D
    content: 定伯以新死為由，化解對方的質疑
  group_stem: '(一) 定伯賣鬼

    [第一段] 南陽宋定伯，年少時，夜行逢鬼。


    [第二段] 問曰：「誰？」

    鬼曰：「鬼也。」

    鬼曰：「卿復誰？」

    定伯欺之，言：「我亦鬼也。」

    鬼問：「欲至何所？」

    答曰：「欲至宛市。」

    鬼言：「我亦欲至宛市。」


    [第三段] 共行數里，鬼言：「步行太極（1），可共迭相擔（2）也。」

    定伯曰：「大善。」鬼便先擔定伯數里。

    鬼言：「卿太重，將非鬼也？」

    定伯言：「我新死，故重耳。」


    [第四段] 定伯因復擔鬼，鬼略無重。如是再三。

    定伯復言：「我新死，不知鬼悉何所畏忌？」

    鬼答曰：「唯不喜人唾。」


    [第五段] 於是共行，道遇水，定伯命鬼先渡，聽之，了無聲。

    定伯自渡，漕漼（3）作聲。

    鬼復言：「何以作聲？」

    定伯曰：「新死不習渡水耳，勿怪！」


    [第六段] 行欲至宛市，定伯便擔鬼至頭上，急持之，鬼大呼，

    聲咋咋（4），索下，不復聽之。徑（5）至宛市中，著地

    化爲一羊，便賣之。恐其變化，唾之，得錢千五百，乃去。


    [第七段] 當時有言：「宗定伯賣鬼，得錢千五百。」


    [注釋] （1）極：疲累。

    （2）共迭相擔：互相輪流背負對方。

    （3）漕漼：音ㄘㄠˊㄘㄨㄟˇ，形容渡水時所發出的聲音。

    （4）咋咋：音ㄗㄜˊ，形容鬼叫的聲音。

    （5）徑：直接。'
