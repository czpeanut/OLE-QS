  - label: A
    content: 「這簡直是人間天籟，臺語的瑰寶」可見作者對鄉土的認同與驕傲
  - label: B
    content: 「碰到颳風下雨，這些鐘自然也有停擺、慢擺或亂擺的時候」顯示聲音鐘物理時間的特性
  - label: C
    content: 「這些美妙的叫賣聲，活潑、快樂地在每日生活的舞台裡翻滾跳躍」可知叫賣聲和日常生活息息相關
  - label: D
    content: 「他們像陽光、綠野、花一樣，是這有活力的城市，有活力的人間不可或缺的色彩」點出聲音鐘使生活繽紛有趣
  lesson_raw:
    title: 聲音鐘
    basis: 題幹提及《聲音鐘》並引用課文
