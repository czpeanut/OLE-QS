    丁說：「我雖知命之年，卻不認命」

    戊說：「我而立之年，已能體會餐風露宿之苦」。以上五人，依年齡大小排序，誰正好在中間？'
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丁
  - label: D
    content: 戊
- id: doc_111_高雄_大灣_國文_g7s2e1_s3_15
  section: 3
  number: 15
  type: single
  page: 2
  stem: 根據下述情境描述：「團員們純淨的嗓音讓聽眾為之驚豔，他們清澈嘹亮、婉轉悠揚的歌聲，隨著旋律時而低沉、時而高亢地在偌大的音樂廳中迴盪不已。表演結束後，意猶未盡的觀眾仍沉醉其中，屢屢用掌聲喚出指揮，讓團員們再多唱幾首安可曲」，請找出可對應的成語？
  options:
  - label: A
    content: 天籟之音／鑼鼓喧天
  - label: B
    content: 響遏行雲／震耳欲聾
  - label: C
    content: 黃鶯出谷／六馬仰秣
  - label: D
    content: 珠圓玉潤／萬籟俱寂
- id: doc_111_高雄_大灣_國文_g7s2e1_s3_16
  section: 3
  number: 16
  type: single
  page: 2
  stem: 下列選項中的「舟船」成語或俗諺，何者使用正確？
  options:
  - label: A
    content: 原本勝券在握，誰知一場意外害我們「陰溝裡翻船」，輸得很慘
  - label: B
    content: 待人處事要和顏悅色，不要一味「逆水行舟」，以免吃力不討好
