  stem: 所謂「轉化」修辭格，指描述一件事物時，轉變其原來性質，化成另一種本質截然不同的事物。轉化法大致可分成三類，即人性化 (以物擬人) ，物性化 (以人擬物)
    ，以及形象化 (擬虛為實)。請問下列何者使用了「形象化」？
  options:
  - label: A
    content: 內心裡寸草不生的人，當然所處的環境也會寸草不生
  - label: B
    content: 那就折一張闊些的荷葉，包一片月光回去，回去夾在唐詩裡
  - label: C
    content: 屋頂上的雨水滴落下來，卻理直氣壯的在屋簷下匯成一道水流
  - label: D
    content: 各色各樣的紙船或列隊而出，或千里單騎，或比肩齊步，或互相追逐
- id: doc_111_高雄_大灣_國文_g7s2e1_s3_24
