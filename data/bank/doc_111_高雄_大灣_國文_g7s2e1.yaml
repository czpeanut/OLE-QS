  stem: 紫荊樹這篇文章較適合勸勉哪一種境況、遭遇的人？
  options:
  - label: A
    content: 琴瑟不調
  - label: B
    content: 兄弟鬩牆
  - label: C
    content: 中年失業
  - label: D
    content: 親子代溝
  group_stem: '（三） 紫荊樹

    京兆田真，兄弟三人，共議分財，生資皆平均。唯堂前一株紫荊樹，共議欲破三片。明日就截之，其樹即枯死，狀如火燃。真往見之，大驚，謂諸弟曰：「樹本同株，聞將分斫（1），所以憔悴。是人不如木也。」因悲不自勝，不復解樹，樹應聲榮茂。兄弟相感，合財寶，遂為孝門。真仕至太中大夫。

    陸機詩云：「三荊歡同株。」


    [注釋] （1）斫：音ㄓㄨㄛˊ，以刀斧砍削。'
