  group_stem: "（四）\n\n據說貞德十幾歲時耳中就不斷地聽到神的指示，要她領導法國人，趕走入侵的英國人。\n    十六歲時，貞德求見查理王子，讓她能率軍完成這個神聖的使命。1429\
    \ 年，英軍包圍奧爾良城，查理王子命貞德為軍隊總指揮，率領數千人的軍隊前往解困。\n  貞德率領的援軍以僧侶為前導，邊走邊唱讚美歌。她身穿盔甲，騎著白色戰馬，腰間配戴寶劍，一手持短槍，一手高舉繪有基督肖像的旗幟，以此象徵她是神派來的救國天使。經過激烈的戰鬥，貞德軍隊終於收復奧爾良城。這次戰役使得法國人民精神大振，貞德也因此而聲名大噪，人們稱呼她為「奧爾良少女」。\n\
    \    之後，貞德又率軍北上，收復大片失土，她的威名傳遍整個法國。但在一次突襲失敗後，貞德被英國人俘虜，並冠上「女巫」、「異端」的罪名，以火刑處死。貞德雖然犧牲了，但卻喚起法國人的民族意識，奮勇抗敵，使得英軍節節敗退。1453\
    \ 年英國勢力全面退出法國，百年戰爭至此結束。後來，貞德的母親懇求教宗重審貞德的案件，1456 年終於獲得平反。此後數百年，貞德的英勇事蹟一直為法國人傳頌，到了1920\
    \ 年，教宗贈與「聖女」的名號，故世稱「聖女貞德」。\n節錄自聖女貞德奮勇抗英"
