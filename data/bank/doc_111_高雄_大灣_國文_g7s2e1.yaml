- id: doc_111_高雄_大灣_國文_g7s2e1_s4_4
  section: 4
  number: 4
  type: single
  page: 4
  stem: 請依據上述資訊，下列何者是農遊券不能購買的東西？
  options:
  - label: A
    content: 便利商店的有機沙拉
  - label: B
    content: 建國花市的多肉植物
  - label: C
    content: 茶莊的高山烏龍茶
  - label: D
    content: 農夫市集的玫瑰果醬
  group_stem: '（二）


    「農遊券」是行政院農業委員會為了振興農業旅遊產業，專為國人所推出的500 萬張250 元優惠券，希望能以此鼓勵民眾購買國產農產品、參與休閒農業旅遊，帶動農村在地商機，例如：輔導農漁會、休閒農場、亮點茶莊、農村酒莊等業者，還有花博、希望廣場、農夫市集、花市等都可以使用，使用上涵蓋範圍相當廣。以下幾點是關於「農遊券」的問與答：

    Q1. 我抽中了，怎麼沒有收到簡訊？

    第一梯次抽籤結果簡訊發送預計於109/7/15 00:00 前發送完畢，由於簡訊發送時間可能因您電信公司與當下訊號有落差，若您在7/15 00:00 後仍未收到簡訊，再請透過農委會網站【查詢抽籤結果】之【客服表單】中填寫登記資料後聯絡我們，客服小組將再與您聯繫。

    Q2. 登記抽籤規則，是採登記手機號還是身份證或居留證號？

    本活動以每位申請人之身分證號或居留證號為抽籤單位，若您於登記資料時：申請人填寫自己(A)、代申請對象1(B)、代申請對象2(C)，送出申請、登記成功後，A、B、C
    三組證號，皆獨立參與「農遊券」抽籤。

    Q3. 什麼時候可以開始申請領取農遊券？

    第一梯次：7/9 15:00 至7/13 23:59 完成登記者，於7/14 12:00 抽出250 萬張幸運得主。

    第二梯次：7/14 00:00 至7/18 23:59 完成登記者，於7/19 12:00 抽出250 萬張幸運得主。

    第一梯次未抽中之登記者，將自動轉入第二梯次抽籤，不需重複登記，惟須注意兩梯次使用期限皆至9/17 止。

    Q4. 農遊券可以找零或退換貨嗎？

    限一次抵用完畢，無法分次抵用，且不可兌換現金或找零。農遊券經合作業者掃描讀取完成消費抵用，只能換貨，無法退貨、退款。換貨商品金額倘小於原消費金額，恕不退款；換貨商品金額大於退貨金額，需補差價。

    Q5. 農遊券要跨區使用嗎？

    是的！必須跨鄉鎮市區使用！但不用跨縣市，舉例來說，登記時居住地填「台北市中正區」，可以到「台北市大同區」使用。

    Q6. 客服專線

    「農遊券小組客服專線」：(07)975-2215，服務時段：週一至週日 08:00~19:00。

    資料來源：農委會'
