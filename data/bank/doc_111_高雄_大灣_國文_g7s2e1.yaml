- id: doc_111_高雄_大灣_國文_g7s2e1_s3_17
  section: 3
  number: 17
  type: single
  page: 2
  stem: 有關下列各文句「年齡」代詞的運用，何者正確？
  options:
  - label: A
    content: 「春秋鼎盛」的黃先生只要談起大學榜首的兒子，總是兩眼閃閃發亮
  - label: B
    content: 「荳蔻年華」的阿姨全心全意照顧家人，錯過婚姻，如今仍待字閨中
  - label: C
    content: 「花甲之年」的晨姐出席哥哥的國中校慶，涎著臉央求媽媽買糖葫蘆
  - label: D
    content: 「始齔之年」的方老爺膝下猶虛，又常進出醫院，擔憂晚年無人奉養
- id: doc_111_高雄_大灣_國文_g7s2e1_s3_18
  section: 3
  number: 18
  type: single
  page: 2
  stem: 下列各文句的敘述都和某些「效應」有關，何者使用正確？
  options:
  - label: A
    content: 小事本身的破壞力有限，然而一連串小事的「破窗效應」，破壞力驚人
  - label: B
    content: 政府高層干涉新聞媒體的例子，恐怕將造成言論自由的「尼可拉斯效應」
  - label: C
    content: 未經求證之下，不宜轉發社群媒體上的任何消息，以免引發「寒蟬效應」
  - label: D
    content: 別輕忽小事所可能引起的「羊群效應」，若不及時處理，後果難以預料
- id: doc_111_高雄_大灣_國文_g7s2e1_s3_19
  section: 3
  number: 19
  type: single
  page: 2
  stem: 聲音鐘一文中「鹹—芭樂，鹹—甜—脆，甘—的喔！」此處破折號的用途是表達「聲音延續」。請問下列例句中的破折號，何者用法相同？
  options:
  - label: A
    content: 這簡直是人間天籟，臺語的瑰寶—具體而微地把整個民族 、整塊土地的生命濃縮進一句呼喊
  - label: B
    content: 處理源源而來的後事──這一切，無非是為了要把「尼可拉斯效應」無止境地推展下去
  - label: C
    content: 或者乾脆是曹操的戰艦──首尾相連
  - label: D
    content: 嗚──嗚──嗚──，警報的聲音又響起來了
  lesson_raw:
    title: 聲音鐘
    basis: 題幹引用《聲音鐘》課文原句
