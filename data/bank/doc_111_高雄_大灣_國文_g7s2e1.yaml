- id: doc_111_高雄_大灣_國文_g7s2e1_s3_12
  section: 3
  number: 12
  type: single
  page: 1
  stem: 「半音譯兼半意譯」可以避免純音譯的翻譯方式令人摸不著頭緒，便在音譯之後加上種類、分類的名稱，以明示字詞的屬性，例如：「冰淇淋」中的「冰」是ice 的意譯，「淇淋」是cream
    的音譯。下列何者全部是「半音半意譯」？
  options:
  - label: A
    content: 微波爐[microwave]、可樂[Coca-cola]
  - label: B
    content: 太空梭[space shuttle]、比特幣[bitcoin]
  - label: C
    content: 脫口秀[talk show]、漢堡[hamburger]
  - label: D
    content: 繃帶[bandage]、雷射[laser]
- id: doc_111_高雄_大灣_國文_g7s2e1_s3_13
  section: 3
  number: 13
  type: single
  page: 2
  stem: 「衍聲複詞」是指音節與音節之間存在著聲音的關聯，可細分為「雙聲複詞」和「疊韻複詞」。其中，「雙聲複詞」中的每個字都具有相同的聲母，如：榴槤、琵琶；「疊韻複詞」中的每個字都具有相同的韻尾，如：混沌、喇嗎。根據上述說明，下列何者皆是「雙聲複詞」？
  options:
  - label: A
    content: 逍遙、孑孓、追逐
  - label: B
    content: 玲瓏、輾轉、叮嚀
  - label: C
    content: 崎嶇 、躊躇、彷彿
  - label: D
    content: 蜻蜓、蝙蝠、徘徊
