- id: doc_113_屏東_中正_國文_g8s2e2_s5_4
  section: 5
  number: 4
  type: single
  page: 4
  stem: 司馬光與王安石的表現與下列何者最不相符？
  options:
  - label: A
    content: 謙卑以禮待人
  - label: B
    content: 兩個人是英雄惜英雄
  - label: C
    content: 趁機落井下石
  - label: D
    content: 兩人是和而不同。
  group_stem: '北宋司馬光和王安石性格迥異。在廟堂之上，彼此都認為對方的執政方針荒謬至極。鬥爭的結果是王安石獲勝，司馬光從宰相寶座上被趕了下來。

    皇帝詢問大權在握的王安石對司馬光的看法，王安石對司馬光卻大為讚賞，稱他為「國之棟梁」，對司馬光的人品、能力、文學造詣，王安石也給了很高的評價。因此，司馬光雖已失去皇帝的信任，仍得以從容地「退江湖之遠」，吟詩作賦，錦衣玉食。

    三十年河東，三十年河西。王安石推行改革，招致皇親、貴胄、地方官的不滿，朝野罵聲一片，逢朝必有彈劾，於是皇帝將王安石免職，重新任命司馬光為宰相。王安石被罷官後，訴狀如雪。聽信讒言欲治王安石罪的皇帝，徵求司馬光意見。司馬光懇切地告訴皇帝：「王安石為人坦蕩，忠心耿耿，有古君子之風，陛下萬萬不可聽信讒言。」

    皇帝聽完司馬光對王安石的評價，說了一句話：「卿等，皆君子也！」

    --網路文章--'
