  stem: 近日發生多起高齡者駕車肇事的事件，尤其發生在新北市三峽區，78 歲的駕駛高速衝撞行人和機車造成的車禍，釀成3 死12 傷，此事震驚全台。高齡者駕車可能因反應能力變慢、視線變差看不清楚路標、注意力及辨識力下降等情況導致事故，因此2017
    年交通部推行高齡換照制度，規定滿75 歲高齡駕駛須換發駕照，其後應每滿3 年換發一次。審查方式除「體格檢查」合格外，還需通過「認知功能測驗」或檢附「未患中度以上失智症證明」。而此次事故後交通部研擬於明年下修高齡換照年齡，從75
    歲降至70 歲，並提高換照標準、駕駛身體檢查的規定，希望悲劇不再發生。請問下列何項社會變遷的層次和上述相同？ L5
  options:
  - label: A
    content: AI 機器人的來臨未來汽車將自動駕駛
  - label: B
    content: 越來越多人用電子載具索取雲端發票
  - label: C
    content: 慶祝端午節各地舉辦划龍舟比賽活動
  - label: D
    content: 民眾使用資訊科技時要尊重他人權益
  answer:
  - C
