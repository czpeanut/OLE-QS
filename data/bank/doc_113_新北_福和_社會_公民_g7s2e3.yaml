  group_stem: "5 月23 日為福和國中44 週年校慶，學校舉辦愛心環保園遊會活動來慶祝，為落實環保觀念，學務處公告《園遊會活動實施辦法》，規定園遊會當天禁止使用一次性免洗餐具和塑膠杯、塑膠吸管，全校師生自行準備環保餐具，各班攤位於活動結束時需做資源回收和垃圾分類的處理。\n\
    \   為發揮人飢己飢、人溺己溺的精神，協助發生重大變故或緊急災害受難的弱勢學生，學校成立仁愛基金，經費來自家長、師生和校外熱心人士的自由捐款，成立至今已協助上千位學生渡過難關；此次園遊會學校鼓勵各班攤位捐贈部分盈餘贊助仁愛基金，發揮仁愛互助的精神。"
  answer:
  - A
