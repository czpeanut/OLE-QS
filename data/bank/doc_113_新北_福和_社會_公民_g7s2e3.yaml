  type: single
  page: 2
  stem: 根據上文，針對全民健保的敘述何者正確？ L6
  options:
  - label: A
    content: 全民健保屬於社會福利政策中的醫療保健
  - label: B
    content: 民眾可以自由選擇是否加入全民健康保險
  - label: C
    content: 政府改變制度以建立民眾正確的使用觀念
  - label: D
    content: 民眾只需繳納稅款就可使用全民健保就醫
  group_stem: "全民健保(全民健康保險)自1995 年實施至今已30 年，民眾得以享受高品質且價格低廉的醫療服務，台灣的全民健保更享譽國際；但健保制度下的藥品浪費已累積成鉅額，影響了健保資源的分配與財政。\n\
    \    直到2024 年中央健康保險局已經虧損了五百億元；其中一大原因是民眾的就醫習慣導致健保財務吃緊，民眾抱持著「不看白不看」、「一定要拿藥」的心態，拿藥之後並沒有珍惜藥品且未按醫囑用藥，每年丟棄大約193\
    \ 公噸的藥品。另外，許多民眾普遍認為大醫院的醫療品質較好，常常只因小感冒就到大醫院就醫，導致醫療資源浪費的問題。\n    因此，政府除了「提高健保費用」外，也取消「出國停保，回國復保」的政策，並落實「醫療院所分級」制度，和提高各大醫院的掛號費，並向民眾宣導「輕症病患優先到住家附近小型診所就醫，大病到大醫院就醫」的觀念，以改變民眾就醫的習慣，健康保險制度方能永續經營。"
  answer:
  - C
  answer_source: answer_key_vlm
