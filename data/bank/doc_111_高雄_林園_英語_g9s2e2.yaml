  group_stem: '< 27~28 >


    The Great Taoyuan Baboon Mystery: A Wild Adventure!


    Imagine seeing a baboon wandering around your town! That’s what happened in Taoyuan.
    This adventurous olive baboon, not from Taiwan, got everyone talking since March
    10. On March 27, the city’s Department of Agriculture finally caught our furry
    explorer. But sadly, the baboon’s journey ended that day because of bad injury.

    People last saw the baboon in Yangmei District at 3 p.m. It found itself trapped
    in a house, and officials caught it using a special sleep dart. Poor baboon, it
    was badly hurt, maybe because of a shotgun.

    After some help, the baboon was taken to Leofoo Village Theme Park in Hsinchu
    County for more care. But the baboon’s exciting adventure ended before reaching
    the park.

    Now, the police want to solve this wild mystery. They’re asking everyone who saw
    the baboon being caught to help.

    The baboon’s body will go to Taipei Zoo to uncover its secret past and find its
    owner. Some people think it escaped from Leofoo park because it’s close to Taoyuan.
    The Taipei Zoo will check if it was from the park or if someone kept it hidden.

    Hsinchu County told Leofoo to count its 163 baboons of three different types within
    a week. The park tried to count them with a drone, but it crashed on March 24.
    What a story!'
