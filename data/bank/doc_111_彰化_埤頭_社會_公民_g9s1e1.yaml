  stem: 冒險灣市長表示：「鬧區停車位並未收費，因而被部分民眾長期占用，導致購物、洽公的民眾常在找不到停車位的情況下，隨意違規停車，對街道景觀與交通安全造成影響，所以有必要實施停車收費政策，並對違規停車加重罰鍰。」根據上述判斷，下列何者正確？
