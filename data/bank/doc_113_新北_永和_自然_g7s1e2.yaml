- id: doc_113_新北_永和_自然_g7s1e2_s3_47
  section: 3
  number: 47
  type: single
  page: 4
  stem: 下列何者不是影響保衛細胞開閉氣孔的主要因素？
  options:
  - label: A
    content: 藍光
  - label: B
    content: 二氧化碳濃度
  - label: C
    content: 水分
  - label: D
    content: 磁場
  group_stem: '保衛細胞的開閉原理

    影響保衛細胞開閉氣孔的因素主要是光線（藍光），也包含二氧化碳濃度、風、水分、溫度等。

    當保衛細胞內的二氧化碳濃度下降，或受到藍光照射等因素的刺激時，會活化細胞膜上的鉀離子(K$^{+}$)幫浦(一種讓礦物質進出的特殊蛋白質通道)，使細胞外的鉀離子(K$^{+}$)進入細胞內。

    當鉀離子(K$^{+}$)累積，水分會經由膜上的水通道，進入保衛細胞內，使保衛細胞向兩旁撐開。

    如下圖所示，兩個保衛細胞都是靠近氣孔的內側，撐開較少；離氣孔較遠的外側，撐開較多，氣孔便張開。【2-3+3-3+4-2】


