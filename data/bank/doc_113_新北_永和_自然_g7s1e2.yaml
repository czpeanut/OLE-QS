  group_stem: '臺灣是一個盛產各式各樣水果的地方，無論是熱帶的椰子、火龍果或者是溫帶常見的葡萄及水蜜桃，在臺灣都具有相當可觀的產量。其中，臺灣的鳳梨甚至在民國70
    年代多到可以加工成大量的鳳梨罐頭出口，而讓臺灣從此有了「鳳梨王國」的美名。其中，鳳梨最為人熟知的功效成分就是鳳梨酵素，有人吃鳳梨會被鳳梨咬嘴，也就是吃完鳳梨口腔黏膜或舌頭會破的情形，其實也就是鳳梨酵素搞的怪。

    鳳梨酵素雖然是一種蛋白質但本身也是很好的蛋白酶，而且在人體胃中可維持活性6~9 個小時，所以對於胰蛋白酶分泌不足的人，補充鳳梨酵素可以幫助蛋白質的消化與分解。除此之外，近期也發現在動物實驗中，鳳梨酵素有減緩腸道發炎效果，可以降低腸道壞菌的生長，進而減少大腸癌等癌症的發生比例。

    鳳梨酵素已證實對人體非常安全，但要考慮現今鳳梨的含糖量都非常高，過量攝取容易對身體造成額外的負擔，同時，有胃潰瘍、消化不良者，要小心適量食用；而有些人對鳳梨過敏更要多留意。【3-2】'
