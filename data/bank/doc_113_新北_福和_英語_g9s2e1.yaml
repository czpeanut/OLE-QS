    and some toys. The strangest thing was that I also saw a child’s shoes and clothes,
    but I did not see the child. The woman quickly put all the things back in her
    bag and looked very angry. Suddenly, something like a child’s broken hand fell
    out of her pocket. As soon as I saw it, I cried out loud for help and run. At
    that moment, I saw a group of people with video cameras show up from behind the
    trees. They held up a big sign on which there was a big word SURPRISE. They were
    making a TV show by surprising people who camped there. Because I was scared and
    nervous, the child’s hand I saw was in fact a banana! I think I will never forget
    that day.
