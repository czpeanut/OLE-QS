- id: doc_113_台中_居仁_國文_g7s1e1_s6_5
  section: 6
  number: 5
  type: single
  page: 3
  stem: 「童話之所以是童話，並非裡面的故事多麼美好，而是所有的危機到最後都能被化解。化解的過程是十分靠運氣的。」根據這段話，下列關於童話的產生，何者最符合作者的觀點？
  options:
  - label: A
    content: 化解危機→運氣→童話
  - label: B
    content: 運氣→化解危機→童話
  - label: C
    content: 運氣→故事美好→童話
  - label: D
    content: 故事美好→運氣→童話
  group_stem: "童話之所以是童話，並非裡面的故事多麼美好，而是所有的危機到最後都能被化解。化解的過程是十分靠運氣的。被巫婆後母一次次陷害，卻一次又一次靠著運氣度過危機的白雪公主，明顯跟不上這個時代的精神。在這個需要越挫越勇的時代，不斷晉級不斷鍛鍊的人，才是人們心中暗暗點讚的對象。\n\
    \    喜歡童話，是希望自己和主人公一樣好運氣。現實給了我們教訓後才知道，必須主動，運氣是靠不住的。好萊塢電影白雪公主完成了這個口味轉型。白雪公主身披盔甲，揮舞著寶劍斬殺敵人。這部影片傳遞的訊息十分清晰：王子是靠不住的，美女穿蓬蓬裙已經無法征服世界了，這個世界是個戰場，要把劍拿在手裡才有安全感。\n\
    \    在這個越來越重口味的時代，我們還相信王子和公主最後幸福地生活在一起嗎？結局已經不重要，反正女主角們要和王子們一樣騎得了寶馬，揮得動寶劍，還要保持身材，因為蓬蓬裙也是偶爾要穿一下的。\n\
    \    當我們見過也經歷過足夠多的人生故事後，才會意識到童話原來是戴著面紗的悲劇。\n    童話是個甜蜜的承諾，承諾給平凡的現實生活一點點微渺希望。在一個童話故事裡，標準配置總有國王、王后、王子、公主。過程不重要，重要的是最後大家幸福地在一起。\n\
    \    有一次看一部好萊塢電影，男女主角在強烈的音樂和各種引導之下，開始了觀眾們期待已久的親吻。當時我就鬆了一口氣，原來童話還是活著的，人們還是相信在這樣的條件下會有真愛。對這份信念的再次確認，和電影院裡的爆米花香一樣安慰人。\n\
    \                  改寫自沈奇嵐＜童話，你還活著嗎＞"
