- id: doc_111_新北_崇林_國文_g9s2e1_s3_39
  section: 3
  number: 39
  type: single
  page: 5
  stem: 作者認為喜憨兒餐廳的喜憨兒員工之所以美麗，是因為有
  options:
  - label: A
    content: 粉嫩粉嫩的臉頰
  - label: B
    content: 溫柔的服務態度
  - label: C
    content: 濃濃的嬉戲的童心
  - label: D
    content: 樂在工作的態度
  group_stem: "丁、\n美麗的喜憨兒\n     有天中午在喜憨兒餐廳用餐時，看著十來歲的女孩，粉嫩粉嫩的臉頰上，帶著憨氣卻十足認真的神情，一板一眼地將湯端端正正擺在我們的餐墊上……我直覺她眼裡一定有一把尺，而且不斷地在丈量著。等鋪陳完畢，還很用力地說了聲「請慢用」。\n\
    \    電視上那個信用卡廣告「認真的女人最美麗」忽然浮上心頭，我只感到熱淚盈眶，那一份感動久久無法平息。我真的可以理解認真工作的人最美麗，而這個道理我還是從一個喜憨兒身上學到的。\n\
    \      想起那之前和友人去吃小火鍋，服務員的態度實在是差強人意，友人將她至喜憨兒餐廳用餐的情形拿來做比較;當時的結論是，或者那些員工應該送到喜憨兒餐廳代訓。而這天我第一次來此用餐，完全認同她的說法。\n\
    \      用餐之間，聽到店裡的指導老師諄諄叮嚀送餐的妹妹:「送第一桌，是第一桌喔，要溫柔一點喔。」我們不禁會心一笑。當然，有時候，也會看到那些弟弟妹妹們有點忘形地玩耍起來，畢竟他們還是孩子，還有那濃濃的嬉戲的童心。\n\
    \    也許我們大部分人所從事的都是單調、機械、一成不變的工作，職位也可能永遠不會提升，但是看看喜憨兒樂在工作的態度，原來，平凡的職業也可以賦予如許美麗的容顏，感動之餘，也讓我們彼此共勉吧。\n\
    （引自〈悅讀閱讀〉選文）"
