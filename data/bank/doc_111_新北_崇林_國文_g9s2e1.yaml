  stem: 有關此文的敘述，下列何者正確？
  options:
  - label: A
    content: 「無國界醫生」組織曾隸屬於國際紅十字會，是其分支機構之一
  - label: B
    content: 世人對奈及利亞的內戰保持沉默，法國醫生對此感到憤怒與挫折，於是在返國後聯同法國醫療期刊記者，於1971 年成立了「無國界醫生」
  - label: C
    content: 無國界醫生希望透過「見證」原則，提升大眾對醫生的關注，並發起討論，以減少在前線行醫的困難
  - label: D
    content: 關鍵字輸入「行動、發聲、治療、見證」，就可在網路上搜尋到無國界醫生組織的相關資訊
  group_stem: "丙、\n無國界醫生有個重要的宗旨──「見證」原則，要求組織致力提升大眾對前線的關注並發起討論，目的是為了減少苦難、維護人們的健康，及恢復對人類的尊重與其基本人權。\n\
    「見證」（témoignage）一詞來自法文，可被譯成「目擊、作證」，即願意大聲說出我們眼前發生的事。這表示無國界醫生願意為我們的受助者發聲，將惡行與令人無法容忍的情況帶到大眾眼前。\n\
    無國界醫生的創始成員曾前往內戰中的奈及利亞，為國際紅十字會工作。當時，奈國政府軍正在對抗比亞夫拉地區的反抗組織，在政府蓄意下，數十萬人死於內戰。國際紅十字會奉行「沈默外交」政策，無論在工作地目睹的暴行或犯罪的程度有多大，仍極少為此公開發聲，他們相信若不這樣做，便可能冒犯衝突中的各派系，反而降低在當地工作的機會與能力。這群法國醫生對此感到憤怒與挫折，於是在返國後聯同法國一家醫療期刊的記者，於1971\
    \ 年成立了「無國界醫生」。儘管存在風險，這群人拒絕沈默旁觀，因為他們相信沈默可以殺人，旁觀者將成為暴行的共犯。\n行動、發聲、治療、見證，是無國界醫生創立時使用的關鍵字，至今亦然\n\
    \                       （節錄自《無國界醫生》官網）"
