  section: 3
  number: 31
  type: single
  page: 4
  stem: 文中許多「之」字當代名詞使用，以下「之」字所指稱的對象，何者正確？
  options:
  - label: A
    content: 召而弔「之」：某生
  - label: B
    content: 終日睹「之」而不得其意：世之人
  - label: C
    content: 予「之」以運動知識之具：天
  - label: D
    content: 輒假「之」以陷溺其身：運動知識之具
  group_stem: '甲、

    里中有盲童，操日者①術，善鼓琴。鄰有某生，召而吊②之曰：「子年幾何？」曰：「年十五矣。」「以何時而眇③？」曰：「三歲耳。」「然則子之盲也且十二年矣！昏昏然而行，冥冥焉而趨。不知天地之大、日月之光、山川之流峙、容貌之妍美醜、宮室之宏麗，無乃甚可悲矣乎？吾方以為吊也！」

    盲者笑曰：「若子所言，是第④知盲者為盲，而不知不盲者之盡盲也。夫盲者曷嘗盲哉？吾目雖不見，而四肢百體均自若也，以目無盲動焉。其於人也，聞其音而知其姓氏；審其語而知其是非。其行也，度其平陂以為步之疾徐，而亦無顛危之患。入其所精業，而不疲其神於不急之務，不用其力於無益之為，出則售其術以飽其腹。如是者久而習之，吾無病於目之不見也。

    「今夫世之人，喜為非禮之貌，好為無用之觀。事至而不能見，見而不能遠；賢愚之品不能辨；邪正在前不能釋；利害之來不能審；治亂之故不能識；詩書之陳於前，事物之接於後，終日睹之而不得其意，倒行逆施，倀倀焉⑤躓且蹶⑥而不知悟：卒蹈於羅網、入於陷阱者往往而是。

    「夫天之愛人甚矣，予之以運動知識之具⑦，而人失其所予之之意。輒假之以陷溺其身者，豈獨目哉！吾將謂昏昏然而行，冥冥然而趨，天下其⑧誰非盲也？盲者獨余耶？余方且睥睨顧盼，謂彼等者不足辱吾之一瞬也。乃子不自悲而悲我，不自吊而吊我！吾方轉而為子悲為子吊也。」（戴名世《盲者說》）

