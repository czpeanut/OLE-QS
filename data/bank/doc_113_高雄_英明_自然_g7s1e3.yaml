  group_stem: "※※ 閱讀下列文章，並回答48-50 題：\n 新冠肺炎是西元2019 年12 月在中國出現，至今仍在持續擴散。據調查結果顯示，感染的患者除了有呼吸道相關症狀，有約三分之一的患者會出現嗅覺障礙或是味覺障礙，經過研究發現患者嗅覺神經元的細胞核結構已經被破壞，許多研究也指出部分患者在痊癒後出現”腦霧”的後遺症，會出現認知及注意力障礙，科學家推論部分原因是肺部受到新型冠狀病毒攻擊而影響到肺部的功能所導致。目前對新冠肺炎的研究仍在持續進行，希望未來能有更完整正確的理解，並且完善醫療做法。"
