  group_stem: "III.(35~38)\nFor thousands of years, people thought the role of women\
    \ was to be a housewife and a mother.  Women were\nnot able to work in jobs  \
    \   35     doctors, businesspeople, or police officers.  Also, young women were\
    \ not\nexpected or sometimes not allowed to go to school.  Take Cambridge University\
    \ as an example.  Founded in 1209,\nCambridge University is one of the oldest\
    \ universities in the English-speaking world.  However, not until the year of\n\
    1947 did it have the full degree to girl students.  Also, women were expected\
    \ to get married in their early twenties, to\nbegin a family soon, and to spend\
    \ their lives     36     at home and     36     care of their families before\
    \ 1960. \nStephanie Coontz, an American writer, once said, “A woman doesn't really\
    \ expect a lot from life.  She's here as\nsomeone's keeper--her husband's or her\
    \ children's.\"\nWith the knowledge of women's rights in the 1960s, women started\
    \ to share the same chances with men. \nNow in the twenty-first century, women\
    \ can work in all kinds of jobs.  It’s not surprising to see women working in\n\
    business or leading their countries.  Queen Margrethe II Denmark is a good example.\
    \  Women now work in many\njobs that, in the past, were only allowed for men to\
    \ work in.  The traditional roles for both men and women have\nchanged a lot.\
    \  We can see more stay-at-home dads because their wives can earn as much money\
    \ or more than\nthem.  Although there have been many changes in traditional roles\
    \ for both men and women, men's and women's\nrights are still not the same in\
    \ the workplace, which means that there is still a lot to be done before real\
    \ equality can\nhappen.                      \n expect 期待 found 成立 degree 學位\
    \ traditional 傳統的 earn 賺錢 equality 平等"
