- id: doc_113_新北_五峰_社會_g8s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '中國近代為確保糧食供應無虞，使用許多方法來提升農產。

    (甲)引進外來作物，如水稻、小麥等，種植在較難開墾地形

    (乙)河套平原位於乾燥地區，引用長江灌溉，荒地墾為良田

    (丙)東北平原以機械化耕作提升效率，藉此擴大其生產規模

    (丁)黃河流域人口快速增加，以圍湖造田的方式拓展耕地

    (戊)設置全國性商品糧基地，以種植適合各地的糧食作物

    請問：上述所提及的方法，何者正確？'
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 甲丙
  - label: C
    content: 乙丁
  - label: D
    content: 丙戊。
