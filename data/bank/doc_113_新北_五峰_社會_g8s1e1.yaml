  section: 3
  number: 29
  type: single
  page: 3
  stem: '公民課時，四位學生分別針對近來『快樂國』較為嚴重的社會問題，提出專題報告──


    | 佳茵 | 失業議題嚴重：失業人數創新高，許多家庭陷入經濟困境，有很多父母讓孩子必須要乞討維生 |

    |---|---|

    | 芷榆 | 面對衰老的勇氣~談長照：人口老化迅速，長照問題浮出檯面，不解決就可能會出現長照悲歌 |

    | 杰云 | 酒駕問題知多少~酒駕害死多個家庭，肇事者多，讓民眾人心惶惶，擔心一出門後回不了家。 |

    | 永祥 | 詐騙問題多多~詐騙手段推陳出新，集團假借是警察而趁機闖入民眾家裡行騙 |


    請問，這些問題顯示出國家應加強下列哪兩項國家成立的目的？(甲)保衛國家安全(乙)維持社會秩序(丙)落實責任政治(丁)發展社會福利'
  options:
  - label: A
