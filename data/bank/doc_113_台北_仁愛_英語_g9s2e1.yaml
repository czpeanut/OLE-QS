    Soccer is called “football” in England, where it comes from, and in many other
    countries. In America, this sport is called soccer or international football.
    Surprisingly, women started playing soccer around the same time as men did in
    England. However, in the beginning, men were the main players in the game. Women’s
    soccer started getting popular in the 1990s.


    Soccer is a game which is played by two teams, and each team has 11 players. They
    play on a grassy field, also called a pitch, with net goals at either end. The
    field must be between 100 and 130 yards long and 50-100 yards wide. The players
    of each team try to drive the soccer ball into the goal of the team they are playing
    against. The goalkeeper tries to keep the ball from entering the area between
    the goal posts. Touching other players’ body parts   (43)   a serious mistake.
    The goalkeeper is the only player that is allowed to use his or her arms and hands
    to catch, carry, throw or stop the ball. All the other players may not let the
    ball touch their arms or hands. If a player   (44)   follow this rule, the other
    team will get a “free kick.”


    Soccer fans take each game seriously. Many love their soccer team as much as they
    love their country. Some love their soccer team even more. Therefore, soccer has
    been the reason of wars over the past few hundred years.


