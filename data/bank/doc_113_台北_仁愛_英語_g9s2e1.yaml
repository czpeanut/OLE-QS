  group_stem: '第二則：


    Tomb Sweeping Holiday, also known as “Ching Ming” Day, is one of the most important
    national holidays which is celebrated to show respect for ancestors. It is one
    of the few Chinese holidays to follow the solar calendar and usually takes place
    on April 5.


    This spring festival’s Chinese name means “clear and bright” (Ching Ming) and
    is marked by most people with a trip into the countryside or back to hometown
    to clean up family tombs. This trip often turns out to be a wonderful family picnic
    everyone expects, but can also mean getting stuck on highways for those who travel
    for a long distance.


    Activities People Do on Tomb Sweeping Holiday in Taiwan

    ◎ Preparing foods and flowers to ancestors.

    ◎ Travelling to the tombs.

    ◎ Visiting the Earth God.

    ◎ Clearing and cleaning the tombs.

    ◎ Visiting relatives and friends.

    ◎ Having a family gathering.


    Tips for Travelling during the Tomb Sweeping Holiday in Taiwan

    ◎ It’ll be hard to book train tickets during the holiday.

    ◎ Hotels will be more expensive. Every day will be like a Saturday night price.

    ◎ The traffic will be heavy, such as going south on the first day or north on
    the last day.

    ◎ Famous sights may be packed with people.

    ◎ Airports will be busier than usual.

    ◎ Many roads near graveyards may be closed to cars, especially around Taipei.


     tomb/graveyard 墓地 ancestor 祖先 solar calendar 農曆 stuck 卡住'
