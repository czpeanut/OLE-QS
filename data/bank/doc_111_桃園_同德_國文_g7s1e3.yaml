- id: doc_111_桃園_同德_國文_g7s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 兒時記趣一文，關於「之」、「其」二字，何者義解有誤？
  options:
  - label: A
    content: 心「之」所向，則或千或百，果然鶴也：助詞，無義
  - label: B
    content: 果如鶴唳雲端，為「之」怡然稱快：指蚊子沖煙飛鳴這件事
  - label: C
    content: 見二蟲鬥草間，觀「之」，興正濃，忽有龐然大物，拔山倒樹而來：指癩蝦蟆
  - label: D
    content: 常於土牆凹凸處，花臺小草叢雜處，蹲「其」身，使與臺齊：代詞，指作者沈復。
  lesson_raw:
