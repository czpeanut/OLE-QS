- id: doc_111_桃園_同德_國文_g7s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 「印度電影我和我的冠軍女兒中，馬哈威亞的大女兒吉塔自幼在他一連串的魔鬼訓練下，成為傑出的女子摔角 選手，並進入印度國家體育學院深造。然而新教練忽略吉塔的強項，導致她在國際比賽中屢戰屢敗，長期陷入情緒低潮。直到父親重新介入指導，告訴她其優勢是在攻擊而非防守，並修正其盲點與錯誤，她才脫離失敗的境況，奪得國際大賽的金牌。」由這個故事可以看出什麼道理？
  options:
  - label: A
    content: 克服心理陰影是獲勝的關鍵
  - label: B
    content: 除苦練外，正確方法也是不容忽視
  - label: C
    content: 應證：才華是刀刃，辛苦是磨刀石
  - label: D
    content: 勝敗皆是命中註定，無須怨恨天責怪人。
  tags:
    textbook: 七上 第九課 音樂家與職籃巨星
