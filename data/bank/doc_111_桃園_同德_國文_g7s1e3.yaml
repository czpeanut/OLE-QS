  group_stem: "賣油翁                     歐陽脩 \n \n  陳康肅公①善射，當世無雙，公亦以此自矜②。 \n 嘗射於家圃，有賣油翁釋擔而立，睨③之，久而不去，見其發矢矢十中八九，但微頷④之。\
    \ \n 康肅問曰：「汝⑤亦知射乎？吾射不亦精乎？」翁曰：「無他，但手熟爾⑥。」康肅忿然曰：「爾安敢輕吾射！」翁曰：「以我酌油知之。」乃取一葫蘆置於地，以錢覆其口，徐以杓酌油瀝⑦之，自錢孔入，而錢不溼。因曰：「我亦無他，惟手熟爾。」康肅笑而遣之。\
    \ \n注：①陳康肅公：北宋人，本名陳堯咨，康肅是諡號。公，對年長或有地位者的尊稱。 \n  ②自矜：自誇、自負。矜，自大。  ③睨：斜著眼睛看。  ④頷：下巴，此作動詞用，點頭。\
