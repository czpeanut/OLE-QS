  type: single
  page: 1
  stem: 「螃蟹、貓頭鷹和蝙蝠去上行為矯正班。數年過後，牠們都順利畢業並獲得博士學位。不過，螃蟹仍橫 行，貓頭鷹仍白天睡覺晚上活動，蝙蝠仍倒懸。」依據內容，以上這則寓言寄託了什麼道理？
