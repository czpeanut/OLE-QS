  group_stem: "請閱讀下列文章後，回答第43、44題：\n  項王乃欲東渡烏江。烏江亭長①檥②船待，謂項王曰：「江東雖小，地方千里，眾數十萬人，亦足王也。願大王急渡。今獨臣有船，漢軍至，無以渡。」項王笑曰：「天之亡我，我何渡為！且籍與江東子弟八千人渡江而西，今無一人還，縱江東父兄憐而王我，我何面目見之？縱彼不言，籍獨不愧於心乎？」乃謂亭長曰：「吾知公長者③。吾騎此馬五歲，所當無敵，嘗一日行千里，不忍殺之，以賜公。」乃令騎皆下馬步行，持短兵接戰。獨籍所殺漢軍數百人。項王身亦被十餘創④。顧見漢騎司馬呂馬童，曰：「若非吾故人乎？」馬童面之，指王翳⑤曰：「此項王也。」項王乃曰：「吾聞漢購我頭千金，邑萬戶，吾為若德。」乃自刎而死。\n\
    ──節選自史記・項羽本紀\n\n①亭長：官吏名，負鄉里防禦、治安等責。\n②檥：音ㄧˇ，停船靠岸。\n③長者：此處指忠厚年長者。\n④被十餘創：指受傷十多處。\n\
    ⑤指王翳：向王翳指出項羽。"
- id: doc_113_新北_崇林_國文_g8s1e3_s3_45
  section: 3
  number: 45
  type: single
  page: 5
  stem: 根據本文，關於古阿明的畫作，下列何者說明最恰當?
  options:
  - label: A
    content: 畫作寫實細膩，描繪出茶園採茶的真實情景
  - label: B
    content: 畫裡人物有郭雲天、古阿明，及姊姊、弟弟
  - label: C
    content: 畫中茶蟲不僅啃咬茶葉飯、衣，甚至還生卵
  - label: D
    content: 畫風活潑可愛，符合古阿明純潔自然的心靈
  group_stem: "以下小說節錄自鍾肇政《魯冰花》，主角古阿明是來自貧困茶農家庭的小學生。請閱讀並回答第45、46題：\n  古阿明昨天在茶園裡畫的作品，郭雲天認為是近一個月以來最好的一幅，也是最使他滿意的一幅。\n\
    \  古阿明畫的是茶蟲。那真是個奇異的幻想世界。在一面圖案化的綠色畫面上，各種各樣的大小茶蟲畫得猙獰可怖。此外還有幾個人物──古阿明曾向郭雲天說那三個人是姊姊，小弟弟和他自己。茶蟲有的在拼命地啃茶葉，有的在吃畫面上的一個人物手裡捧著的飯，有的在吃另一個人物的衣服。古阿明那小小的心靈裡的憤恨與恐懼，靠著他那獨特的，大膽的筆觸，毫無遺漏地表露出來。\n\
    \  郭雲天只有暗嘆的份兒，幾乎沒有提供意見的餘地，因為古阿明一開始作畫，就好像已忘了周遭的一切，連他所尊敬的師長在身旁也都似乎渾然忘卻，手不停揮地畫下去。直到畫好後，郭雲天才得到機會提出他的修改意見。他指示他哪裡的顏色還不夠鮮明，哪一筆線條還要加強。\n\
    \  事實上，郭雲天的意見也不多。他不忍破壞掉那純潔的心靈裡所流露出來的，敏銳得就如電流一般的感覺。甚至他明知畫裡的一條蟲在生卵是錯誤的，也還是讓他保持原來的面目。他認為與其改正過來，倒毋寧這個樣子較合他的年歲。\n\
    〔仿113.會考〕"
