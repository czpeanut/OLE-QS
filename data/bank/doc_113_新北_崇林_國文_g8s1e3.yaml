  group_stem: '請閱讀下列文章後，回答第41、42題：

    秦王齋五日後，乃設九賓禮於廷，引趙使者藺相如。相如至，謂秦王曰：「秦自繆公以來二十餘君，未嘗有堅明約束者①也。臣誠恐見欺於王而負趙，故令人持璧②歸，閒③至趙矣。且秦彊④而趙弱，大王遣一介之使至趙，趙立奉璧來。今以秦之彊而先割十五都予趙，趙豈敢留璧而得罪於大王乎？臣知欺大王之罪當誅，臣請就湯鑊⑤，唯大王與群臣孰計議之。」秦王與群臣相視而嘻⑥。左右或欲引相如去，秦王因曰：「今殺相如，終不能得璧也，而絕秦
    趙之驩⑦，不如因而厚遇之，使歸趙，趙王豈以一璧之故欺秦邪！」卒廷見相如，畢禮而歸之。

    ──節選自史記．廉頗藺相如列傳


    ①堅明約束者：指堅守信約的君主。

    ②璧：指和氏璧。

    ③閒：抄小路。

    ④彊：通「強」，強大之意。

    ⑤湯鑊：指烹刑，把人放在沸水的鼎鑊中烹死。

    ⑥嘻：苦笑聲。

    ⑦驩：通「歡」，此指兩國的友好關係。'
