  - label: C
    content: 主角體悟到「景物依舊，人事已非」之理
  - label: D
    content: 主角流淚的最主要原因，是見到故鄉美景
  lesson_raw:
    title: 畫的哀傷
    basis: 節選自《畫的哀傷》
