  section: 2
  number: 11
  type: single
  page: 1
  stem: 做單擺實驗時，測得其週期為$T_{0}$。其擺錘質量及擺角不變，而增加擺長時，測得週期為$T_{1}$；如擺長及擺角不變，加重擺錘質量測得時，其週期為$T_{2}$。如擺長及擺錘不變，增大擺角時(擺角<10°)，測得週期為$T_{3}$。則下列何項敘述與事實相合？
  options:
  - label: A
    content: $T_{0}=T_{1}=T_{2}=T_{3}$
  - label: B
    content: $T_{1}>T_{0}=T_{2}=T_{3}$
  - label: C
    content: $T_{2}>T_{0}>T_{1}>T_{3}$
  - label: D
    content: $T_{3}>T_{0}>T_{1}>T_{2}$。
