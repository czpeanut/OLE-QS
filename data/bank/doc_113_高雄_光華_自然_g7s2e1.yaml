  stem: 下列哪些水果的果實為真果？
  options:
  - label: A
    content: 桃、瓜、梨
  - label: B
    content: 李、梨、瓜
  - label: C
    content: 桃、瓜、豆
  - label: D
    content: 桃、蘋果、李
  group_stem: '【題組】閱讀下列文章，回答41-43 題：

    蘋果及梨子、西洋梨等水果及亦屬肉質果的一種，但是我們所食用甜而多汁的部分是由子房壁外側及膨大的花托愈合發育而成，這樣的果實稱爲梨果(pome)。梨果真正的果皮位于中心包複著種子，較硬且略帶澀味，即我們常說的蘋果核。在自然的環境中此類果實即藉動物食用美味的假果皮，丟棄難以下咽的部分而爲其傳播種子。仔細觀察蘋果的橫切面，可看到假果皮中呈環狀排列的維管束。真果是指一般的果實，是由雌蕊發育成的，果實的果壁是由子房壁變成的，像桃、李、瓜、豆等都是真果；而假果是指主要是由雌蕊以外的地方發育成的果實，像蘋果、梨子等是假果，因爲我們吃這些果實的果肉部份是由花托部位變成的。蘋果、梨子等果實中有果心線，果心線裏面的蘋果核或梨核的部份是由子房壁形成的；果心線外面好吃的部份是花托形成的'
