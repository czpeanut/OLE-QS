- id: doc_113_高雄_光華_自然_g7s2e1_s1_42
  section: 1
  number: 42
  type: single
  page: 5
  stem: 為什麼橘貓大多為公貓？
  options:
  - label: A
    content: 因為橘色基因位於 X 染色體上，公貓只有一條 X 染色體
  - label: B
    content: 因為橘色基因位於 Y 染色體上，只存在於公貓
  - label: C
    content: 因為母貓不具備產生橘色毛髮的基因
  - label: D
    content: 因為公貓比母貓更貪吃
  group_stem: '【題組】閱讀下列文章，回答42-45 題：

    貓咪毛色由 Orange 基因（對偶基因 O/o）決定。Orange 對偶基因「O」會表現紅褐色的嗜鉻黑色素 phaeomelanin，「o」則表現黑色的真黑色素
    eumelanin。特別的是，這組對偶基因互為「共顯性」（codominance），也就是說如果一支貓為異形合子（heterozygous）Oo 時，會同時表現紅色與黑色。但是因為
    Orange 基因位在 X 性染色體長臂（q arm）上，公貓的性染色體是 XY，而 Y 染色體上不帶有毛色基因，因此只會根據 X 染色體上基因表現毛色；也就是說公貓要嘛就是
    $X^{o}Y^{-}$ 的黑色，或者 $X^{O}Y^{-}$ 的「紅色」——也就是橘子貓啦！。

    這也解釋了為什麼有多種毛色的三花貓或者玳瑁貓只可能是母貓，因為母貓的性染色體是 XX，如果一個 X 染色體上的 Orange 基因為顯性，另一個是隱性，就會同時顯色（共顯性）。只有顯性同型合子，當兩個
    X 染色體上都是「O」，才會出現母的橘子貓。

    此外，因為公貓的 Y 染色體一定來自他爸，所以決定公貓毛色的 X 染色體就是由母貓的遺傳決定的，也就是說橘子貓的母親除了是橘貓之外，也可能是三花貓或玳瑁貓。

    那麼橘子貓有多少比例是母貓呢？我們可以根據孟德爾定律，排出理想上橘子貓的公母比例，三隻橘貓裡面只有一隻是母貓！看起差很多的三花貓和玳瑁貓其實 Orange
    基因一樣，那麼是什麼基因決定她成為三花貓或者玳瑁貓呢？在體染色體上，還有一組對偶基因 white spotting (S) 。當異型合子 O/o 母貓的表現
    white spotting 顯性，她就會成為大色塊的三花貓；假如 white spotting 基因為隱性，就會成為均勻混色的玳瑁貓。這可能是因為顯性 white
    spotting 使得皮膚的黑色素母細胞（melanoblasts）數量減少，色塊能夠擴張的關係，也就出現了三花貓的樣式。三花貓的白色區域則可能是缺乏成熟的黑色素細胞（melanocyte）所致。

    ▲玳瑁貓:毛色由黑色與橘色混合組成

    ▲三花貓:毛色由黑色、橘色及白色組成

    摘自【泛科學－為什麼橘子貓大多是男生？】'
