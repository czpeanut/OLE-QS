    　　不同的是，與剛入行前相比，當初那條沒人看見的孤獨路，現在，已經綻放出滿徑的繽紛花朵。

    （節選自Cheers快樂工作人雜誌第91期——安藤忠雄：孤獨也要讓夢想開花）'
