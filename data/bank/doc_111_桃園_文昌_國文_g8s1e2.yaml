    content: 宣揚政府復育山林成效卓著。
  group_stem: '【題組三】

    　　臺灣低海拔的森林，不但優美而且極富特色，樹種繁多，林內的景色變化萬千。只是因為我們很少去接近，也沒空去留意，更無心去關懷，而忘了森林，不再重視這個島嶼最重要的森林。

    　　近一、二年來，我對臺北盆地附近，位於新店山區的一片海拔三百公尺上下的次生林，做長時間的觀察，且發現它動人的豐美。特別選出一年中，我認為這片森林最優美的一天和讀者分享，也許有點野人獻曝，但這是我的心意。這一天是西元一九九六年五月七日。

    【五月山花香】

    　　五月七日，天氣忽然放晴，我迫不及待地揹起攝影裝備，沿著走過上百次的小徑進入森林，迎面拂來的微涼山風，飽含著各種野花的甜美香氣，還帶著一股五月的陽光味道。

    　　(甲)循著香味，我找到了爬在小喬木上盛開的金銀花。它在未開花時，非常不引人注意，我也一直不曾察覺它的存在。直到此刻，嗅到這熟悉的香味，讓我頗感慚愧。因為，金銀花一向是我偏愛的野花之一，它香氣怡人，花朵樸素高雅，我童年時，常採摘賣給中藥房以換取極微薄的零用錢。每次聞到金銀花特殊的香味，或瞧到它悅目的小花，都會想起那苦中帶甘的童年，那花香總是引來我們這些村童對冰棒無限的想像。

    　　(乙)走近盛開的山黃梔，它的濃香令人嗆鼻，幸好在這片森林裡也不過兩株，而且是長在山崖上，山風總是把香味散播得很廣很遠，也變得濃淡適宜，令人舒服。

    　　(丙)隨著小路深入林中，空氣因為注入了金銀花以及山黃梔花的濃香，變得有些黏稠，讓我覺得必須用力吸氣，才能把這飽含許多野花香味的空氣吸入肺中。

    　　山黃梔的花朵也如金銀花一般，初開時是白色，快謝時轉為橙黃色。從稍遠處欣賞，好像是掛在小樹上的金星、銀星，令人著迷。

    【油桐花編織的祕徑】

    　　小徑越過山澗到對岸，然後斜升入正盛開到頂點的油桐林裡。迎面而來的是許許多多雪片一般飛落的油桐花，飄蕩著、旋轉著，好像仙女散花一般，落在姑婆芋的大葉片上，在野薑花的層層葉上，在我的帽子上，也把整條山徑鋪上了油桐花編織的白色長地毯，空氣中滿含著濃淡適宜、令人愉悅的花香。

    　　大自然今天用這麼隆重、優美又熱情的場面，回報我半年來上百次的參訪，這比歡迎國王或總統的紅地毯還要美麗、莊嚴、高貴，因為它只使用一次。我戰戰兢兢地踩著落花前進，唯恐腳印破壞了這稀世白花地毯。但令我驚奇的是，新的落花立刻修補了我踩過的地方。這是大自然完美的花設計，一條活生生的鋪花小徑。我微醉著，不由自主地、輕輕地被引向林中深處。有那麼一剎那，我認為自己已丟棄了軀殼，正輕鬆自在又滿足地走上通往更高境界的地方。也只有像我這樣深入、珍惜大自然的人，才會受到邀請，才能找到這條美麗的祕徑。在這片林子裡，我品嘗著「福爾摩沙」低海拔森林的美好與曼妙，全身浸滿了幸福。

    （徐仁修森林最優美的一天）'
