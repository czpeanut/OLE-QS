  stem: 「英國著名作家狄更斯平時很注意觀察生活、體驗生活，不管颳風下雨，每天都堅持到街頭去觀察、諦聽，記下行人的零言碎語，積累了豐富的生活資料。這樣，他才在《大衛•柯波菲爾》中寫下精彩的人物對話，在《雙城記》中留下逼真的社會背景描寫，從而成為英國一代文豪，取得了他人文學事業的巨大成功。」根據此段描述，下列何者是狄更斯與安藤忠雄之所以成功的相似處？
  options:
