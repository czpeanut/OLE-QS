  - label: C
    content: 隨著受獎等身，安藤忠雄工作合約不斷，卻也因過勞而萌生退隱之念。
  - label: D
    content: 拿到職業拳擊賽執照的安藤忠雄，藉由出國比賽的機會，實為參觀建築。
  group_stem: '【題組四】

    【從興趣中找到夢想】

    　　在日本這個學歷至上的國家，大多數人直到上大學，才有機會摸索自己的興趣是什麼？尋找可能的夢想。

    　　但是，安藤忠雄不然。

    　　一九四一年，安藤忠雄在大阪出生，從小由外公外婆養大。後來，外公過世，安藤忠雄與外婆必須獨立生活。因此，當外婆開了雜貨店，他就幫忙顧店。每當鄰家的木匠帶著設計圖出入，不僅會跟他玩，也會教他削木頭。懵懂之間，安藤忠雄覺得很喜歡用木頭做東西的感覺。

    　　13歲時，安藤忠雄與鄰家的木匠合作增建家裡的二樓。當他在幽暗的長屋開了一個天窗，第一次，他體驗到自然光線的魅力，小小心靈中，愛上建築。

    　　隔年，當鄰家有個失怙少年需要地方住，安藤忠雄自己設計施工，為少年蓋了一個7坪大的加蓋小屋。第一次，他興起自己的夢想：從事建築業。

    　　發現夢想並不容易，但是，該如何去做，努力實現夢想，卻是大的挑戰。

    　　國中畢業後，安藤忠雄遇到第一個夢想的阻礙。當他決定進木工工廠工作時，卻慘遭家人反對。

    　　於是，他轉念高工機械科，從此走上自學之路。課餘，他勤跑學校的設計教室，閒暇時就搭電車到京都、奈良等地，親身參觀日本傳統建築，從中了解何謂建築。

    　　後來，他聽說打拳擊可以拿工作簽證出國比賽，為了出國看建築，他只花了兩個多月練習就拿到職業拳擊賽執照，如願的，隻身到曼谷比賽。

    【孤獨一人，也要讓夢想開花】

    　　高工畢業了，安藤忠雄渴望進大學念建築。這一次，雖然家人並未反對，但在龐大的經濟壓力下，他必須放棄念大學建築正規管道。

    　　他清楚地知道夢想只有一個，但是，邁向夢想的道路卻有很多途徑。

    　　「所以，我決定，好！我一個人要朝這個方向努力。因此，一個人走上這條孤獨的道路。」安藤忠雄在演講中比喻，「康莊大道上綻放許多花朵，但是，我一個人卻走著這條大家都看不見的路，於是，我對自己說，我要讓這條路也能開花結果。」

    　　於是，他透過工作與讀書，繼續自學建築。

    　　他先到室內設計公司擔任助手、後來協助大阪市立大學教授進行商店街調查與開發，不工作時，他就讀書。有一次，他在一個舊書攤看到柯布作品全集（柯布即柯比意，Le
    Corbusier）時，心中震撼不已，於是，他每天都到舊書攤報到，甚至央求書店老闆暫先保存該書，等他存夠錢，就把書買下。「再怎麼沒錢吃飯，我都要讀書。」他說。

    　　後來，他終於買了書，隨後天天研究柯布的設計圖。有一整年，他甚至一早讀書直到凌晨三點鐘，就這樣，將建築系教科書研讀完畢。

    　　「一個人要成功有兩個條件：意志力和熱情。」安藤忠雄說。

    【得獎後，仍不斷參與國際競圖】

    　　35歲，安藤忠雄在大阪近郊設計「住吉的長屋」。狹窄的房屋中間有著天窗與自有的庭院，創新的設計，讓安藤忠雄終於在日本建築業界嶄露頭角。

    　　接著，安藤忠雄慢慢接下比較有規模的案子，也開始在海外成名，41歲，就首度出版作品集。5年後，連美國 耶魯大學、哥倫比亞大學與哈佛大學，都相繼邀請他擔任建築系客座教授。

    　　隨後，「光之教會」、「真言宗本福寺水御堂」與西班牙萬國博覽會日本館等名作，陸續在國際上聲名大噪。那幾年，他也受邀在美國 紐約當代藝術館，與法國 龐畢度中心舉行個展。

    　　一九九五年，安藤忠雄才54歲，終於獲得建築界最高榮譽的肯定：普立茲克獎。

    　　然而，他的夢想之路，卻不因為受獎等身而特別順遂。

    　　兩年後，東京大學邀請他擔任建築系教授，日本社會拿他高工畢業的學歷做文章，成為當時話題。儘管如此，他依然贏得日本社會的敬重、全球各界最廣大的崇拜族群，與絡繹不絕的工作合約。

    　　然而，他不因委託案多而自滿，他渴望進步，渴望對話，於是，他數度參與國際競圖。

    　　「在這條建築路上，我常常一個人不安的摸索著。」他把每一次筋疲力竭的競圖當作磨鍊思考、激發潛力、跟國際知名建築師觀摩交流的拳擊場。終於，二〇〇一年十月底，他陸續贏得法國等地的重要國際競圖。

    　　記者問他：「如果不是做建築家，你會做什麼呢？」

    　　他回答：「如果我不做建築家，我的人生就很失敗，沒什麼好說的。」

    　　現在的安藤忠雄，儘管早已晉升國際大師，仍然秉持著熱情與意志力，追尋著他的建築夢。

    　　不同的是，與剛入行前相比，當初那條沒人看見的孤獨路，現在，已經綻放出滿徑的繽紛花朵。

    （節選自Cheers快樂工作人雜誌第91期——安藤忠雄：孤獨也要讓夢想開花）'
