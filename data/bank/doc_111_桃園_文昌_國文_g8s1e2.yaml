- id: doc_111_桃園_文昌_國文_g8s1e2_s2_21
  section: 2
  number: 21
  type: single
  page: 3
  stem: 下列何者的言行表現最符合本文中所提及的「理論家」特質？
  options:
  - label: A
    content: 於引退前便熟讀籃球規則，並考取裁判證照的安東尼。
  - label: B
    content: 每日凌晨五點即起床梳洗，隨後赴球場練投的霍華德。
  - label: C
    content: 任何一場籃球賽無論勝負，賽後定自我檢視的杜蘭特。
  - label: D
    content: 制定許多精密的訓練菜單，卻疏於進場練習的詹姆斯。
  group_stem: '【題組一】

    　　相信很多人都有過這樣的經驗，自己想出了一個自認為很不錯的點子或構思，說出來與身邊的人商議，結果不單被認為是不切實際、妙想天開，甚至更斷言是「絕不可能」。於是，一盤冷水當頭倒下，滅卻了你的雄心壯志，很多機會也因此而白白流失，徒添惆悵。這不禁令我想起在莊子
    逍遙遊裡的一個故事：據說在北海有一隻大鵬鳥，牠的背部有幾千里長，當牠振翅高飛時，翅膀就像是「垂天之雲」。當牠等待到海風一起，便會直衝上九萬里的高空，飛往南海去。但是蟬與斑鳩卻譏笑這隻大鵬鳥：「我展翅而飛，若碰到榆樹和枋樹就停在樹上，若氣力不繼便落在地上，又何必要高飛九萬里往南海去呢？」

    　　莊子對他們的回應是：「小知不及大知，小年不及大年。」意謂智識淺薄的不能明白到智識廣博的，而壽命短促者亦不能了解到壽命綿長者。這話怎麼說呢？莊子舉出例子說明：朝菌見了太陽就死，所以根本不知道一天有日夜交替。蟬或春生夏死，或夏生秋死，所以不知一年有四季之分。這是指一個人的識見、智慧會限制了他的眼界，即我們俗語所說的：「夏蟲不可以語冰」之謂也。

    　　現實生活中，只有少數人能成就一番大事業，就是因為他們的志向與識見都比一般人遠大，並且對自己的能力有絕對的信心，再加上恆心與毅力，最後才達至成功。可是，大多數的人不是沒有志向、便是受到如蟬和斑鳩之流的左右，告訴他「這樣不可」、「那樣也不行」；或「這樣做太冒險了」、「安分些吧」、「沒有可能成功的」。結果自己心志不堅，便只有悵然認命了！

    　　我們固然應該接納別人的意見，但亦不應心存太多不必要的顧慮。何況智者千慮，亦必有一失。若永遠只停留在「計畫」階段，而不付諸行動，到老也沒有達至成功的一天。這種人只能是「理論家」，而永不會是「實踐家」，更遑論有成就。

    　　今天很多各行各業的翹楚，在開始的時候，都曾經被不少如蟬與斑鳩、甚至一些所謂的專家、權威的批評，或斷言其必敗。假如他們當初都心不定、志不堅，則只能徘徊於榆樹、枋樹與地面間的層次，而永遠無法如大鵬鳥般一飛沖天，得到輝煌的成就。

    （夏蟲不可語冰）'
