  type: single
  page: 2
  stem: 依據《張釋之執法》，下列各「」中的句子，何者句意說明正確？
  options:
  - label: A
    content: 「廷尉奏當：一人犯蹕，當罰金」——廷尉認為此人驚動皇帝馬隊，應處以罰金
  - label: B
    content: 「今法如此而更重之，是法不信於民也」——法律本身已經是加重處分，不能不依法執行
  - label: C
    content: 「乘輿馬驚，於是使騎捕，屬之廷尉」——皇帝的馬受驚逃逸，騎兵便將犯人送交廷尉審問
  - label: D
    content: 「且方其時，上使立誅之則已」——若皇帝當時立刻誅殺犯人，亦符合法律規定
  lesson_raw:
    title: 張釋之執法
    basis: 題目引用《張釋之執法》課文
