- id: doc_113_高雄_苓雅_國文_g8s2e2_s1_27
  section: 1
  number: 27
  type: single
  page: 4
  stem: 下列敘述何者最符合造成「倖存者偏差」的原因？
  options:
  - label: A
    content: 只關注成功者，忽略失敗案例，導致判斷偏差與誤解
  - label: B
    content: 是因樣本數量不足導致的科學實驗誤差
  - label: C
    content: 倖存的人因幸運而不具代表性，應全面排除
  - label: D
    content: 是人們因恐懼風險而高估事物成功機率的錯覺
  group_stem: '倖存者偏差（survivorship bias），是一種邏輯謬誤，屬於選擇偏差的一種。當過度關注「倖存」的人事物，從而造成忽略那些沒有倖存的（也可能因為無法觀察到），便會得出錯誤的結論。

    第二次世界大戰期間，美國哥倫比亞大學統計學亞伯拉罕·沃德教授在計算如何減少轟炸機因敵方炮火而遭受的損失時，將「倖存者偏差」納入到計算中。其研究小組檢查了執行任務返回的飛機所受到的損壞。與沒有將本概念納入計算不同的是，他建議在損壞最少的區域增加裝甲，而並非在彈孔最多的地方增加裝甲。因為返回飛機上的彈孔代表了轟炸機可能受到損傷但仍足夠安全地返回基地的區域，而那些完全沒有彈孔的地方，一旦中彈就完全沒有返回的機會，而完全不會出現在研究的樣本中。所以沃德教授建議美國海軍在返航飛機上未受傷的區域增加防護，並推斷這些地方被擊中是會導致飛機最有可能損失。他的這項研究對當時仍在發展初期的運籌學領域具有深遠的影響。

    像是說「以前的流行歌曲比較好聽」就是一個例子，因為能過了五年、十年甚至數十年後還有一定數量的人回憶的歌曲，大多是發行時最好的歌曲，因此人們在講這話時，可能過度關注過去的優良歌曲，而忽略到過去那些沒那麼好，因此現在已經沒有人聽的歌曲的；同理，「一代不如一代」的說法也會犯下這錯誤，因為講這話的人，可能過度關心過去比較好的人，或現在比較差的人，而忽略掉那些自己的世代那些比較差的人，或現在這個世代比較好的人。

    節選自維基百科'
  shared_asset: g1_27_30
