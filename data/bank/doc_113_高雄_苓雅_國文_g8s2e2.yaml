- id: doc_113_高雄_苓雅_國文_g8s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 「阿佩特為此潛心研究。他注意自己販賣的果醬、葡萄酒等食品中，有些玻璃罐密封的食品不易變質，仔細觀察、反覆試驗後，終於在一八○四年揭下榜文，向軍方提出研究心得。他的作法倒也不難：將食材裝入廣口瓶中，置於沸水鍋中加熱三十分鐘以上，趁熱用軟木塞塞緊，再用鐵線固定瓶蓋或用蠟封死，以阻絕空氣，食物便可保藏而不腐，現代罐頭雛形於焉出現。」依據文意，何者敘述正確？
  options:
  - label: A
    content: 阿佩特透過改良食材配方，成功延長食品賞味期
  - label: B
    content: 阿佩特歷經多次實驗，成功發明鐵皮罐頭
  - label: C
    content: 阿佩特與軍方合作生產大量罐頭支援前線部隊
  - label: D
    content: 阿佩特由生活經驗出發，發展出有效的保存方法
- id: doc_113_高雄_苓雅_國文_g8s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 「軍用罐頭於焉問世，但初期因飲食習慣改變不易，使用時並不方便，並非廣受歡迎。當時罐頭形制沒有規範，也尚未發展出開罐工具。罐頭一旦交到士兵手中，還得要費一番功夫，刺刀、斧頭全都用上，罐中的食物才能到口。」這段文字所要傳達的訊息不包含下列何者？
  options:
  - label: A
    content: 因為飲食文化的不同，大家對罐頭接受度不高
  - label: B
    content: 剛推出的罐頭外觀和設計沒有一致的標準
  - label: C
    content: 當時開罐頭不容易，需要花很多力氣和時間
  - label: D
    content: 因士兵受過訓練，能靈活運用各種工具輕鬆開罐
