  stem: 下列何者不是造成移工逃逸的原因？
  options:
  - label: A
    content: 仲介費過高，移工為還債只好選擇逃逸
  - label: B
    content: 因語言不通而求助無門，使移工選擇自行離開原雇主
  - label: C
    content: 通訊設備申請程序冗長，導致移工無法正常生活
  - label: D
    content: 工作環境與來台前的期待落差太大
  group_stem: '台灣移工人數已超過80 萬人，是我國重要的補充性勞動力。然而，失聯移工問題日益嚴重，截至2024 年11 月底，失聯人數突破9 萬，其中越南籍移工占最多，達5
    萬7 千多人。2024 年前11月失聯率為2.91%，雖較2022 年的5.96%下降，但整體人數仍持續攀升。失聯主因包括仲介費過高、工作環境不符、轉換雇主困難與語言隔閡等，部分移工在求助無門下，只好選擇逃逸打黑工。

    學者指出，製造業中的越南移工須支付高達4,500 至7,000 美元的仲介費，為還債只能冒險非法工作。非法薪資較高，若能短期躲避查緝，即可清償債務。再者，現行法令限制移工轉換雇主，使得遭遇不合理對待時，缺乏轉換工作選項，只能失聯。家庭看護移工更因不適用《勞基法》，待遇低、工時長、幾乎全年無休，失聯情況更為嚴重。

    對此，勞動部表示失聯率已連兩年下降，並會持續與移民署合作，加強查處與遣返，並推動改善措施。監察院也曾調查並提出10 大問題與建議，指出移工失聯反映出我國勞動政策與管理機制的不足。

    台大副教授辛炳隆認為，移工失聯成因複雜。他建議政府應強化對人蛇集團的查緝，並在法令上明確區分產業與看護移工，以利分流管理與政策設計。

    改寫自記者徐子苓、李靚慧／專題報導'
