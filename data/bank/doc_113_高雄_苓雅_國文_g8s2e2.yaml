  stem: '下表是《刑法》所規定的「侮辱罪」與「誹謗罪」的條文內容，根據條文的規定，下列何者沒有觸法？

    | 罪名 | 內容 | 處罰 |

    | --- | --- | --- |

    | 侮辱罪 | 公然侮辱人 | 拘役或9,000 元以下罰金 |

    | 毀謗罪（誹謗罪） | 意圖散布於眾，指摘或傳述足以毀損他人名譽之事 | 1 年以下有期徒刑、拘役或15,000 元以下罰金 |'
