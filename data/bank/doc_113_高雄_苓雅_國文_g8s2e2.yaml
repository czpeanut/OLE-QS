  stem: 下列句子「」中的詞性，何者不是動詞？
  options:
  - label: A
    content: 天之「亡」我
  - label: B
    content: 縱江東父兄憐而「王」我
  - label: C
    content: 項王身亦被十餘「創」
  - label: D
    content: 餘騎相「蹂踐」爭項王
  group_stem: '於是項王乃欲東渡烏江。烏江亭長檥¹船待，謂項王曰：「江東雖小，地方千里，眾數十萬人，亦足王也。願大王急渡。今獨臣有船，漢軍至，無以渡。」項王笑曰：「天之亡我，我何渡為！且籍²與江東子弟八千人渡江而西，今無一人還，縱江東父兄憐而王我，我何面目見之？縱彼不言，籍獨不愧於心乎？」乃謂亭長曰：「吾知公長者。吾騎此馬五歲，所當無敵，嘗一日行千里，不忍殺之，以賜公。」乃令騎皆下馬步行，持短兵接戰。獨籍所殺漢軍數百人。項王身亦被十餘創。顧見漢騎司馬呂馬童，曰：「若³
    非吾故人乎？」馬童面之，指王翳曰：「此項王也。」項王乃曰：「吾聞漢購我頭千金，邑萬戶，吾為若德。」乃自刎而死。王翳取其頭，餘騎相蹂踐爭項王，相殺者數十人。

    《史記‧項羽本紀》

    【注釋】檥¹：停船靠岸 籍²：項籍，項羽之名 若³：代詞，你'
