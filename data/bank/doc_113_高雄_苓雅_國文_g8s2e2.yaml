- id: doc_113_高雄_苓雅_國文_g8s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 下列關於《我所知道的康橋》的敘述，何者正確？
  options:
  - label: A
    content: 「你如愛鳥，這裡多的是巧囀的鳴禽。你如愛兒童，這鄉間到處是可親的稚子。你如愛人情，這裡多的是不嫌遠客的鄉人……」，這段文字使用三次「你如愛」，充滿熱鬧喧囂、繁華燦爛之感
  - label: B
    content: 「『春！』這勝利的晴空彷彿在你的耳邊私語。『春！』你那快活的靈魂也彷彿在那裡回響。」句中表達了尋春人好奇驚訝的心情
  - label: C
    content: 「頃刻間這田野添深了顏色，一層輕紗似的金粉糝上了這草、這樹、這通道、這莊舍。頃刻間這周遭彌漫了清晨富麗的溫柔，頃刻間你的心懷也分潤了白天誕生的光榮。」連用三個「頃刻間」，表現春曉景色瞬息萬變，令人目不暇給
  - label: D
    content: 「剎那間在我迷眩了的視覺中，這草田變成了……，不說也罷，說來你們也是不信的！」其中的「……」表示作者已經辭窮，沒有任何詞彙可以表達
  lesson_raw:
    title: 我所知道的康橋
    basis: 題目引用《我所知道的康橋》課文
