  group_stem: '太史公曰：「究天人之際，通古今之變，成一家之言。」如太史公之文，無韻而雄，能動人之情，感人之性，雖《詩》《騷》¹之作，愧而在下。

    〈韓愈‧詩說〉


    又其是非頗謬²於聖人，論大道則先《黃老》而後《六經》，序遊俠則退處士而進奸雄，述貨殖³則崇勢利而羞賤貧，此其所蔽也。然自劉向、揚雄博極群書，皆稱遷有良史之材，服其善序事理，辨而不華，質而不俚，其文直，其事核，不虛美，不隱惡，故謂之實錄。嗚呼！以遷之博物洽聞⁴，而不能以知⁵自全，既陷極刑，幽而發憤。

    《漢書·司馬遷傳贊》


    司馬遷之書，悲壯激烈，有不可犯之色。其言必信，其事必察。自成一家之言，與班固、范曄不同。

    〈蘇軾‧書司馬遷所作報任安書後〉


    【注釋】《詩》《騷》¹：《詩經》、《離騷》 謬²：差失、偏離 貨殖³：財貨經濟等事

    洽聞⁴：博學多聞 知⁵：同「智'
