  page: 2
  stem: 關於《我所知道的康橋》的寫作手法，下列敘述何者正確？
  options:
  - label: A
    content: 運用大量對仗、層遞的修辭，營造鮮明的節奏感與活潑的語調
  - label: B
    content: 以近景變化為描述重點，鉅細靡遺的敘述康橋的四季變化
  - label: C
    content: 寫印象深刻的康橋美景，敘述特定某一天的遊記，因此在題目上標明「我所知道的」
  - label: D
    content: 以第一人稱寫自己的見聞和感受，以第二人稱拉近與讀者的距離
