- id: doc_113_高雄_光華_社會_g7s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 15.資料一和資料三中將臺灣部分原住民處境差與人口銳減的責任歸咎於何者？
  options:
  - label: A
