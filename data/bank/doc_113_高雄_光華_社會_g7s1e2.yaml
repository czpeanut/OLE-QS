  - label: B
    content: 西班牙人
  - label: C
    content: 鄭氏政權
  - label: D
    content: 清帝國官員。
  group_stem: '※題組：收集以下三則有關鄭氏時期，漢人與某原住民族群互動的資料。請問：

    資料一：沙轆（今臺中市沙鹿區的舊稱）番，原有數百人，為最盛，後為劉國軒（鄭氏將領）殺戮殆盡，只餘六人，潛匿海口。

    資料二：鄭氏繼至，立法尤嚴，誅夷不遺赤子……。故至今大肚、牛罵（今臺中市清水區的舊稱）、大甲、竹塹（今新竹地區的舊稱）諸社，林莽荒穢，不見一人。

    資料三：1661 年鄭成功領兵渡海擊退外人，取得臺灣統治權，但位於某地區的部落聯盟頑強抵抗鄭軍，導致鄭成功等人認為他們受到外人的煽動。由於鄭軍當時尚未攻下安平就已缺糧，故而下令往北屯墾，就地取糧或種植，因此與該部落聯盟發生激烈衝突，使得鄭軍將領陣亡，一鎮之兵（約五百人）無一生還者，後來鄭軍又再度派人以埋伏之計襲殺頭目，使得該部落聯盟在鎮壓下勢力衰微。'
