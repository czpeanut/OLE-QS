- id: doc_113_台中_五權_自然_g7s2e2_s2_49
  section: 2
  number: 49
  type: single
  page: 4
  stem: 根據上表，下列敘述何者正確？
  options:
  - label: A
    content: 甲可能是白化症，患病者的髮色為白色
  - label: B
    content: 丙可能是唐氏症，患病者通常伴隨智能發展障礙
  - label: C
    content: 患有丁疾病的女性，口腔皮膜細胞有47 條染色體
  - label: D
    content: 戊必定為一種顯性遺傳疾病，其致病等位基因位於性染色體
  group_stem: '| 疾病代號 | 疾病說明 |

    | :--- | :--- |

    | 甲 | 與病毒的感染有關，通常透過不安全性行為傳播。在特定條件下，母親體內的病毒可能經由胎盤感染胎兒，使嬰兒一出生便患有此病。 |

    | 乙 | 若長期經由飲食將「汞」這種有害物質攝入人體，會使人體出現神經症狀，如手部顫抖、記憶力減退。若孕婦患有此病，也會造成腹中胎兒發育遲緩。 |

    | 丙 | 當受精過程出現問題，導致受精卵的第5 對染色體出現一部分缺失，便會造成此疾病。帶有此異常染色體的人，其子女患有此疾病的風險極高。 |

    | 丁 | 當親代形成配子的過程中發生錯誤，造成第21 對染色體多了一條，便會造成此疾病。 |

    | 戊 | F8 和F9 基因位於X 染色體上，若親代帶有異常的等位基因，可能會傳遞給子代，使子代凝血功能出現異常。 |'
  tags:
    chapter:
      publisher: 翰林
