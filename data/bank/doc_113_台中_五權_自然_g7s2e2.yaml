- id: doc_113_台中_五權_自然_g7s2e2_s2_46
  section: 2
  number: 46
  type: single
  page: 4
  stem: 文章中提到的「A 技術」，最有可能是下列何項技術？
  options:
  - label: A
    content: 基因轉殖技術
  - label: B
    content: 複製生物
  - label: C
    content: 育種
  - label: D
    content: 發酵
  group_stem: '對人體而言，「鳥胺酸氨甲醯基轉移酶(Ornithine transcarbamylase)」是一個很重要的酵素，負責將具有高毒性的氨轉換為低毒性的尿素。在醫學領域中，將這個酵素簡稱為「OTC」；負責調控OTC
    合成的基因，則稱為「OTC 基因」。當體內的OTC 基因發生突變，將使得患者缺乏OTC 酵素，若狀況嚴重，則會導致患者失去生命。

    近年來，科學家試圖利用「基因治療(gene therapy)」的方式來改善病人的生活品質。科學家透過「A 技術」，將人類的正常OTC 基因嵌入病毒的遺傳物質中，接著便以病毒作為「載體」，讓病毒感染細胞，由病毒將正常基因送入人體細胞中，若這個正常基因能夠順利發揮功能，病患的細胞便能獲得合成OTC
    這種酵素的能力。

    不過，此種治療方式目前仍屬於臨床實驗階段，尚未大規模正式使用。畢竟基因是無法用眼睛看到的，實驗上還存在許多盲點，人類仍需加強相關的基礎科學研究。

    （改寫自 台北榮總學訊第253 期電子報第41 期文章）'
  tags:
    chapter:
      publisher: 翰林
      book: 七下
