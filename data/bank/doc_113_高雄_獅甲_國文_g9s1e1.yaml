  group_stem: '讀書並不在多，最重要的是選得精，讀得徹底，與其讀十部無關輕重的書，不如以讀十部書的時間和精力去讀一部眞正值得讀的書；與其十部書都只能汎覽一遍，不如取一部書精讀十遍。「好書不厭百回讀，熟讀深思子自知」這兩句詩值得每個讀書人懸為座右銘。讀書原爲自己受用，多讀不能算是榮譽，少讀也不能算是羞恥。少讀如果徹底，必能養成深思熟慮的習慣，涵泳優游，以至於變化氣質；_____
    ，則 如馳騁十里洋場，雖珍奇滿目，徒惹得心花意亂，空手而歸。世問許多人讀書只為裝點門面，如暴發戶衒耀家私，以多爲貴。這在治學方面是自欺欺人，在做人方面是趣味低劣。

    （朱光潛〈談讀書〉）'
