  type: single
  page: 1
  stem: 各選項中的內容中，何者錯別字最多？
  options:
  - label: A
    content: 士兵貫於在戰場上撕殺，一但退抑歸鄉，最終一槍熱血歸於平淡
  - label: B
    content: 劉玄德立志框扶漢室，報復遠大，帥領謀士眾多
  - label: C
    content: 由於清朝受到例強入侵及內部腑敗等因素，出現了遣責小說
  - label: D
    content: 月暈朦朧，頓時神情幕然，彷彿沉浸在遙遠的曆史紅流之中
