  number: 20
  type: single
  page: 2
  stem: 關於與921 說再見：20 年的生命練習題的寫作手法，下列何者正確？
  options:
  - label: A
    content: 主要目的在敘述兒福聯盟的辛苦付出
  - label: B
    content: 分段舉出不同的案例分享，段落間沒有關聯
  - label: C
    content: 以社工的角度切入，用失依兒為受訪者呈現
  - label: D
    content: 如實紀錄受訪者的言談，讓讀者直接體會當下的心情
  lesson_raw:
    title: 與921說再見：20年的生命練習題
