- id: doc_113_高雄_獅甲_國文_g9s1e1_s1_30
  section: 1
  number: 30
  type: single
  page: 3
  stem: 「宋人杜默寫文章喜歡自創出處，後人就把自己捏造出處叫『杜撰』，這已經是個『熟語』。後人再加點工變 成『憑 空杜撰』，這就變成『成語』。古人對邊區的少數民族較鄙視，就把不可信、不合理的東西都用『胡』
    字來形容，如亂講話叫『胡說』，這也是個『熟語』，再加點工說成『胡說八道』，就可以看做『成語』。」根 據這段文字，下列敘述何者正確？
  options:
  - label: A
    content: 人們生活上使用的習慣用語，多出自憑空杜撰
  - label: B
    content: 成語形成之初多不合理，假以時日就能被接受
  - label: C
    content: 後人將熟語的形態略加變化，可以發展為成語
  - label: D
    content: 成語通常是由文人或少數民族在偶然間所創造
- id: doc_113_高雄_獅甲_國文_g9s1e1_s1_31
  section: 1
  number: 31
  type: single
  page: 3
  stem: 一般對宋詞風格的了解，大致是分為婉約派與豪放派。婉約派詩詞以「柔美」見長，側重「閨情綺怨」；而 豪放派以雄豪奔放、率真質樸為特色，多以家國、史事入題，氣勢雄偉。以下
    何者可能是辛棄疾的作品？
  options:
  - label: A
    content: 無言獨上西樓，月如鉤，寂寞梧桐 ，深院鎖清秋。剪不斷、理還亂，是 離愁。別是一般滋味在心頭。
  - label: B
    content: 醉裡挑燈看劍，夢迴吹角連營。八百里分麾下炙，五十弦翻塞外聲，沙場秋點兵。
  - label: C
    content: 無可奈何花落去，似曾相識燕歸來，小園香徑獨徘徊。
  - label: D
    content: 寒蟬淒切，對長亭晚，驟雨初歇。都門帳飲無緒，留戀處、蘭舟催發。執手相看淚眼，竟無語凝噎。
