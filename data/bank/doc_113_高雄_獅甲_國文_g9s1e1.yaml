  stem: 下列文句，何者不能看出老殘遊大明湖的季節？
  options:
  - label: A
    content: 更有一株半株的丹楓夾在裡面
  - label: B
    content: 卻有一層蘆葦，密密遮住
  - label: C
    content: 一路秋山紅葉，老圃黃花
  - label: D
    content: 梵宇僧樓，與那蒼松翠柏，高下相間
