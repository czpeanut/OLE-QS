  section: 1
  number: 22
  type: single
  page: 2
  stem: 有關「四面荷花三面柳，一城山色半城湖」這副在鐵公祠的對聯敘述，下列何者錯誤？
  options:
  - label: A
    content: 下聯寫整個山東的景觀
  - label: B
    content: 上聯寫鐵公祠呈七角形的美景
  - label: C
    content: 下聯的「山」指的是歷山
  - label: D
    content: 下聯的「湖」指的是大明湖。
  lesson_raw:
    title: 大明湖
    basis: 題目引用〈大明湖〉對聯
- id: doc_113_高雄_獅甲_國文_g9s1e1_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: 以下皆是大明湖的文句，何者說明正確？
  options:
  - label: A
    content: 「彷彿宋人趙千里的一幅大畫，做了一架數十里長的屏風」比喻湖面遼闊，風景如畫
  - label: B
    content: 「一盞寒泉薦秋菊，三更畫舫穿藕花」形容古水仙祠從早到晚祭祀，美不勝收的熱鬧景色
  - label: C
    content: 「家家泉水，戶戶垂楊」寫初至濟南城的特殊景觀
  - label: D
    content: 「一片白花映著帶水氣的斜陽，好似一條粉紅絨毯」指荷花在湖面的倒影，被夕陽染紅的景色
  lesson_raw:
    title: 大明湖
    basis: 題目引用〈大明湖〉文句
- id: doc_113_高雄_獅甲_國文_g9s1e1_s1_24
  section: 1
  number: 24
  type: single
  page: 2
  stem: 下列關於劉鶚及其老殘遊記一書之敘述，何者錯誤？
  options:
  - label: A
    content: 劉鶚以第三人稱書寫老殘遊記，並善於細節描寫書中人物性格
  - label: B
    content: 老殘遊記是一部章回小說，書中內容反映清末的腐敗政治
  - label: C
    content: 劉鶚因緣際會下，完成第一本小篆研究專書--鐵雲藏龜
  - label: D
    content: 由搖著串鈴滿街踅了一趟可知，可以送其「功同良相」之匾額
  lesson_raw:
    title: 大明湖
    basis: 題目提及作者劉鶚及其著作《老殘遊記》
- id: doc_113_高雄_獅甲_國文_g9s1e1_s1_25
  section: 1
  number: 25
  type: single
  page: 2
