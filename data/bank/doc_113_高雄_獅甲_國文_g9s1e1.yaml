  section: 1
  number: 5
  type: single
  page: 1
  stem: 下列「 」中的字詞，何組意思相同？
  options:
  - label: A
    content: 你「道」鐵公是誰／說長「道」短
  - label: B
    content: 「止」船前進／「止」一班文官
  - label: C
    content: 「丹」楓／仙「丹」妙藥
  - label: D
    content: 杜「悠悠」之口／念天地之「悠悠」
- id: doc_113_高雄_獅甲_國文_g9s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 下列詞語何者運用最適當？
  options:
  - label: A
    content: 在我的「明查暗訪」之下，考試成績終於大幅提升
  - label: B
    content: 你做了這個「天崩地坼」的玩具，誰會想碰
  - label: C
    content: 一大早面對眼前的「債台高築」，令人神清氣爽
  - label: D
    content: 這些都是小事，別再「作繭自縛」想不開了。
- id: doc_113_高雄_獅甲_國文_g9s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 關於李煜虞美人一詞，下列敘述何者正確？
  options:
  - label: A
    content: 首句「春花秋月何時了」抒發作者惜春悲秋的心情
  - label: B
    content: 末兩句以綿延無盡的江水，將內心的愁苦生動描繪出來
  - label: C
    content: 「小樓東風」表達歡喜迎接春天到來的心情
  - label: D
    content: 「只是朱顏改」，是作者渴望能回復年輕的容貌
  lesson_raw:
    title: 虞美人
    basis: 題目提及李煜虞美人
- id: doc_113_高雄_獅甲_國文_g9s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 吳晟擅長鄉土詩，是現代的「田園詩人」。下列何者的風格和吳晟接近？
  options:
  - label: A
    content: 岳飛：三十功名塵與土，八千里路雲和月
  - label: B
    content: 秦觀：兩情若是久長時，又豈在朝朝暮暮
  - label: C
    content: 陶潛：桑麻日已長，我土日已廣
  - label: D
    content: 蘇軾：十年生死兩茫 茫，不思量，自難忘。
- id: doc_113_高雄_獅甲_國文_g9s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 下列有關李煜虞美人及辛棄疾南鄉子登京口北固亭有懷的敘述，何者錯誤？
  options:
  - label: A
    content: 前者為顯現作者老驥伏櫪的雄心，後者表現內心的淒楚與惆悵
  - label: B
    content: 前者利用對比表達物是人非的感慨；後者則活用典故
  - label: C
    content: 前者流露出故國之思，後者為登高懷古之作
  - label: D
    content: 李煜被世人譽為詞中之聖、詞中之帝；辛棄疾與蘇軾並稱蘇辛。
  lesson_raw:
    title: 虞美人、南鄉子登京口北固亭有懷
    basis: 題目提及李煜虞美人及辛棄疾南鄉子登京口北固亭有懷
- id: doc_113_高雄_獅甲_國文_g9s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 吳晟〈土〉：「揮汗吟哦自己的吟哦、詠歎自己的詠歎。」句中「吟哦」、「詠歎」二詞之詞性用法前後不同。下列「」中的字，其詞性用法次序何者與之相同？
  options:
  - label: A
    content: 老吾「老」以及人之「老」
  - label: B
    content: 己欲「立」而「立」人，己欲達而達人
  - label: C
    content: 故人不獨「親」其「親」，不獨子其子
  - label: D
    content: 不「鳴」則已，一「鳴」驚人。
  lesson_raw:
    title: 土
    basis: 題目引用吳晟〈土〉
- id: doc_113_高雄_獅甲_國文_g9s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 吳晟〈土〉一詩中哪句話最足以表達詩人對土地永恆真摯的愛？
  options:
  - label: A
    content: 揮汗吟哦自己的吟哦／詠嘆自己的詠嘆
  - label: B
    content: 有一天，被迫停下來／也願躺成一大片／寬厚的土地
  - label: C
    content: 不掛刀、不佩劍／也不談經論道說賢話聖
  - label: D
    content: 滴不盡的汗漬／寫上誠誠懇懇的土地
  lesson_raw:
    title: 土
    basis: 題目引用吳晟〈土〉
- id: doc_113_高雄_獅甲_國文_g9s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 「不掛刀、不佩劍／也不談經論道說賢話聖／安安分分握鋤荷犁的行程」這段話表達何種自我期許？
  options:
  - label: A
    content: 見賢思齊，反求諸己
  - label: B
    content: 功成名就，衣錦還鄉
  - label: C
    content: 犧牲小我，完成大我
  - label: D
    content: 敬業樂業，穩健踏實。
  lesson_raw:
    title: 土
    basis: 題目引用吳晟〈土〉詩句
- id: doc_113_高雄_獅甲_國文_g9s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 關於「詞」這個文體的敘述，下列何者錯誤？
  options:
  - label: A
    content: 每一首詞皆有詞牌，但與內容多半沒有關聯
  - label: B
    content: 依照不同詞牌規定，每一首詞各有固定的句數，每一句也各有固定的字數
  - label: C
    content: 又稱「詩餘」、「曲子詞」、「長 短句」與「樂府」
  - label: D
    content: 押韻方式與近體詩相近，奇數句不可押韻，偶數句一定要押
- id: doc_113_高雄_獅甲_國文_g9s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: 關於辛棄疾〈南鄉子登京口北固亭有懷〉文句的說明，下列何者不恰當？
  options:
  - label: A
    content: 「年少萬兜鍪，坐斷東南戰未休」──形容孫權年少意氣風發，稱霸江南，展現雄才大略
  - label: B
    content: 生子當如孫仲謀」──藉曹操稱頌語，盼自己能像少年英雄孫權，再創一番豐功偉業
  - label: C
    content: 「何處望神州？滿眼風光北固樓」──意指中原已非我所有，給人風景不殊，山河改易之嘆
  - label: D
    content: 「千古興亡多少事？悠悠，不盡長江滾滾流」──意近於「滾滾長江東逝水，浪花淘盡英雄」
  lesson_raw:
    title: 南鄉子登京口北固亭有懷
    basis: 題目提及辛棄疾〈南鄉子登京口北固亭有懷〉
- id: doc_113_高雄_獅甲_國文_g9s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 1
  stem: 南唐覆亡，後主李煜被俘至北方，遠離家園，詞作中常流露對故國的思念。據此判斷，下列詞句何者最可能是李煜書寫這類主題的作品？
  options:
  - label: A
    content: 重到故鄉交舊少，淒涼，卻恐他鄉是故鄉
  - label: B
    content: 寂寞古豪華，烏衣日又斜。卻興亡，燕入誰家
  - label: C
    content: 人生愁恨何能免？銷魂獨我情何限！故國夢重歸，覺來雙淚垂
  - label: D
    content: 扁舟去作江南客，旅雁孤雲，萬里煙塵，回首中原淚滿襟
  lesson_raw:
    title: 虞美人
    basis: 題目提及李煜詞作背景
- id: doc_113_高雄_獅甲_國文_g9s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 關於吳晟〈土〉一詩中文句的說明，下列何者不恰當？
  options:
  - label: A
    content: 「不爭，不吵，沉默的等待」─傳達農夫忍氣吞聲，不喜 吵鬧的個性
  - label: B
    content: 「不悲，不願，繼續走下去」─強調農夫堅守樸實認命的生命哲學
  - label: C
    content: 「赤膊，無關乎瀟灑／赤足，無關乎詩意」─句中的「赤膊」、「赤足」描繪農夫辛苦耕作的真實面
  - label: D
    content: 「一行一行笨拙的足印／沿著寬厚的田畝，也沿著祖先／滴不盡的汗漬」─象徵農夫「克紹箕裘」的精神
  lesson_raw:
    title: 土
    basis: 題目引用吳晟〈土〉
- id: doc_113_高雄_獅甲_國文_g9s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 「有個美國友人來信說：『孩子幼小時踩在你腳尖上，長大了踩在你心尖上。』原來這種感傷，中外都是一樣的。」這段文意說明正確的是何者？
  options:
  - label: A
    content: 孩子是父母一輩子的牽掛
  - label: B
    content: 父母是孩子永遠的依靠
  - label: C
    content: 父母對孩子過度的溺愛
  - label: D
    content: 孩子只會予取予求，不知回報
- id: doc_113_高雄_獅甲_國文_g9s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 關於報導文學下列何者不正確？
  options:
  - label: A
    content: 特質在於紀實，多以散文形式呈現
  - label: B
    content: 內容包含社會狀況與社會變遷等種種議題
  - label: C
    content: 以主觀立場陳述，適時添加感性的筆觸
  - label: D
    content: 融合新聞性與文學性所形成的一種特殊文體。
- id: doc_113_高雄_獅甲_國文_g9s1e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 與921 說再見：20 年的生命練習題中提到：「路橋重建不難，但留給倖存大人小孩的，卻是一輩子的生命課題。」請問「一輩子的生命課題」指的是什麼？
  options:
  - label: A
    content: 籌措重建家園經費
  - label: B
    content: 心靈的重建
  - label: C
    content: 離開原本生活的土地
  - label: D
    content: 往後難以在社會上生存。
  lesson_raw:
    title: 與921說再見：20年的生命練習題
    basis: 題目引用課文〈與921說再見：20年的生命練習題〉
