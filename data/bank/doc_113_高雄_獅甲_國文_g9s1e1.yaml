  stem: 下列選項「 」中的字，何者詞性兩兩相同？
  options:
  - label: A
    content: 「創」傷／開「創」
  - label: B
    content: 鉅細靡「遺」／路不拾「遺」
  - label: C
    content: 嘆賞不「絕」／「絕」妙好辭
  - label: D
    content: 「春」水向東流 ／「春」花秋月。
