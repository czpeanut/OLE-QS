- id: doc_113_高雄_獅甲_國文_g9s1e1_s2_49
  section: 2
  number: 49
  type: single
  page: 4
  stem: 張詠對於蕭楚給他改了一字，表現出怎樣的態度？
  options:
  - label: A
    content: 大為憤怒
  - label: B
    content: 大為佩服
  - label: C
    content: 不痛不癢
  - label: D
    content: 不以為然
  group_stem: 張詠性剛毅，忽於小節。其所善友蕭楚見詠几案上有一絕，末二句云：「獨恨太平無一事，江南閒殺老尚書。」楚取筆改「恨」作「幸」。詠歸見之，云：「誰改吾詩？」左右以實對。楚曰：「公功高位，奸人側目，筆墨之間未可輕忽；且天下一統，而公獨恨，可乎？」詠嘆曰：「君真吾一字師也。」（
    劉宗周 一字師）
