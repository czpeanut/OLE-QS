  stem: 下列關於這闋詞文意的敘述，何者正確？
  options:
  - label: A
    content: 「才下眉頭，卻上心頭」一句，意謂心情由悲轉喜，悲愁已消逝
  - label: B
    content: 「雁字回時，月滿西樓」一句，指作者夜晚期待雁鳥傳送來的家書
  - label: C
    content: 「紅藕香殘」，作者用「殘」字主要在陳述自己已是風燭殘年，思念之情破碎
  - label: D
    content: 「輕解羅裳，獨上蘭舟」一句，謂作者藉泛輕舟轉移思念之情
  group_stem: 紅藕香殘玉簟秋。輕解羅裳，獨上蘭舟。雲中誰寄錦書來？雁字回時，月滿西樓。 花自飄零水自流。一種相思，兩處愁。此情無計可消除，才下眉頭，卻上心頭。
    (李清照一翦梅)
