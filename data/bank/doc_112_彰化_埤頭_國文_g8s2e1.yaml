  stem: 雁一文中，作者的母親說起雁的故事，下列哪一選項的敘述「錯誤」？
  options:
  - label: A
    content: 是一種無情的鳥
  - label: B
    content: 是專情的鳥
  - label: C
    content: 是飄泊的候鳥
  - label: D
    content: 是合群的鳥。
  group_stem: '3.

    雁是怎樣的一種鳥呢？在蒼藍的秋空上寫著字，寫得那麼快又那麼整齊，仰酸了頸子望著牠們飛進渺遠的雲裡。那些抖動著的、會飛的字，常引起人優異的遐想。

    每一年的秋天，風涼露冷的時候，一天之內，都會見到好幾陣雁群，有時已經入暮了，牠們還在飛著，偶爾從雲層上面，灑落下充滿寒意的啼聲，使人聽在耳中，心便像秋般的寒冷。

    雁朝哪兒飛啊？母親在橙色的燈光裡回答我的問詢，並說起雁的故事，說牠們是飄泊的候鳥，寒季從北方起程，飛到溫暖的南方去，春暖時，牠們又飛回解凍的北國。說雁是專情的鳥，牠們一旦選擇了伴侶，便相愛著，廝守終生，牠們更是合群的鳥，一群雁是一個大的家族，相互關心著，禍福與共。

    （司馬中原雁）'
