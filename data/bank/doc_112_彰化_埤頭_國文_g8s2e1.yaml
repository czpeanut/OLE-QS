  - label: C
    content: 抉擇
  - label: D
    content: 角色。
  group_stem: '4.

    每當我對自己生命的缺憾感到失望時，我就想到小詹米·史考特。詹米參加學校戲劇的演出人員選拔，他媽媽告訴我，他一心想參加演出。但她擔心詹米不一定會被選上。參演角色公布那天，我和她到學校接詹米回家，詹米衝向母親懷抱，眼中閃著得意和興奮。他大聲叫著：「媽，妳一定猜不到，我被選來鼓掌和歡呼呢！」這些話一直留在我的心中，成為生命中的鼓勵。

    （瑪莉·柯玲）'
