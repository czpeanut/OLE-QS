- id: doc_113_新北_福和_社會_公民_g8s1e1_s1_37
  section: 1
  number: 37
  type: single
  page: 1
  stem: '在公民課上，小福與小和正在討論什麼是「政黨政治」，以及執政黨和在野黨的角色。

    | 小福：老師說，在政黨政治裡，執政黨是掌握政府的政黨，那麼在野黨是做什麼的呢？ |

    | :--- |

    | 小和：我記得在野黨的主要任務是監督政府，並且提出不同的政策主張。對嗎？ |

    根據小福和小和的對話，以下哪一項最能正確說明「政黨政治」的意涵？(L1)'
  options:
  - label: A
    content: 政黨政治是多個政黨競爭，執政黨掌握政府權力，在野黨負責監督政策
  - label: B
    content: 政黨政治指的是每次選舉都一定會產生政黨輪替，和平轉移政權的方式
  - label: C
    content: 政黨政治是執政黨永久掌握著權力，在野黨則無法參與政策討論或制定
  - label: D
    content: 政黨政治是由一個政黨全權決定政策，其他政黨負責協助其推行政策。
  tags:
    chapter:
