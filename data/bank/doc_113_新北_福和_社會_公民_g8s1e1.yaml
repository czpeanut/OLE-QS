    | :--- |

    | 本所下午 13:00 至長樂村分水嶺部落撤離居民。 |

    | 避難收容所地點：墾丁小丑魚度假村。 |

    | 本所災害緊急應變中心 24 小時專線或本所總機 08-8801151、08-8801105 |

    根據上方「最新消息」的內容，請問下列敘述何者正確？(L1、L2)'
  options:
  - label: A
    content: 撤離行動的公權力已違反了人民的居住權利，人民得以拒絕
