- id: doc_111_嘉義_北興_社會_公民_g9s2e1_s2_25
  section: 2
  number: 25
  type: single
  page: 4
  stem: 從上文可知，我國是透過何種方式滿足咖啡市場的供給？
  options:
  - label: A
    content: 基因改造技術
  - label: B
    content: 仰賴國際貿易
  - label: C
    content: 強化環境保護
  - label: D
    content: 改善消費偏好。
  group_stem: "※請閱讀下列文章後，回答問題：\n  根據媒體報導，國人一年喝掉 28 億杯咖啡。在龐大的市場需求下，咖啡豆需仰賴進口，才能維持穩定價格。然而，在全球咖啡市場中，咖啡農遭到剝削已非新聞，例如：非洲衣索比亞的咖啡豆價格，每公斤不足\
    \ 10 元新臺幣。\n  為了對抗不平等的貿易，出現了公平貿易咖啡的生產。在國際公平貿易標準認可下，不僅提供咖啡農合理的收購價格，也鼓勵加入公平貿易組織的農民們採用對環境友善的生產方式。同時，消費者也可以透過這樣的商業網絡，追溯咖啡產品的來源，創造更好的自然及社會環境。然而，多數跨國咖啡企業僅有少部分產品是選用符合公平貿易的咖啡豆。\n\
    \  「每一次消費，都是改變未來的選擇。」面對咖啡農處境不利的情況，我們的消費行為與偏好也是改善的關鍵之一，唯有大家體認到公平貿易的意義與重要性，並實踐追求公平正義的理念，監督企業合理分配利潤並減少剝削，社會才能有所轉變，進而形塑一個更美好的地球村。\n\
    （資料來源：改寫自 1. 臺灣人一年能喝掉 28 億杯咖啡！業者老是推「買一送一」卻不降價有原因。民視新聞網，2021/02/22。2. 公平貿易咖啡．公平貿易咖啡豆—\
    \ Fairtrade Taiwan，2021/3/18。）"
