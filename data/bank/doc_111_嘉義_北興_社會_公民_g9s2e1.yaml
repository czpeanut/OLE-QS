  group_stem: "※2020 年中，總統蔡英文宣布自 2021 年起開放含「萊克多巴胺」的美國豬肉。政府表示：在國際互動上，強調國家間的互惠，我國若欲與美國建立更良好的關係，禁止美豬、美牛進口的貿易障礙，是不可迴避的問題，並列舉日本與南韓均已依照國際標準予以開放，臺灣若堅守禁令，恐將面臨全球孤立的處境。\n\
    \  此政策引發民眾反彈，本土豬農擔憂豬肉市場受到便宜的進口豬肉衝擊，影響銷售，而多數民眾則擔心食品安全問題。對此，農委會表示：進口豬肉因口感與新鮮度不佳，火腿、香腸、肉鬆等加工肉類業者可能採用，但一般消費者的購買意願應該不高。豬肉業者也表示願意清楚標示產地，減少消費者在購買上的疑慮。（資料來源：改寫自萊劑美豬開放吵翻天爭議點、始末一次看，聯合新聞網，2021/03/12。）"
