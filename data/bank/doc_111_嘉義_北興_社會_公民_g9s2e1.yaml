- id: doc_111_嘉義_北興_社會_公民_g9s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '雅珍參加一場讀書會時，聽到主講者講述以下的一番話，其內容闡述的概念應與下列何者最為相近？

