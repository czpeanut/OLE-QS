- id: doc_113_台南_復興_社會_公民_g8s1e2_s1_39
  section: 1
  number: 39
  type: single
  page: 1
  stem: '根據下面新聞報導，何者說明最正確？

    幾年前疫情嚴峻，有間學校進行線上教學，但高中生假冒成校長，亂入線上課程「巡堂」，甚至當場要求老師報告課程內容、跟其他學生對話，事後遭學校記大過處分，學生向教育部提起訴願，現在教育部訴願會決議撤銷大過，要求學校60天內重作處分。教育部訴願結果撤銷原來處分要求學校2個月內重作處分。因為學校校規中，有條文明確指出，學生使用校園網路傳送不實資訊可記小過處分，但校內獎懲會上都沒有針對較輕的小過做討論，行政上的確有瑕疵。'
  options:
  - label: A
    content: 學生提出訴願是屬於憲法保障的平等權
  - label: B
    content: 本案訴願撤銷理由是因為學校不能針對該行為懲處學生
  - label: C
    content: 學生提出訴願後由上級機關進行處理
  - label: D
    content: 若學生權益未受損，亦可提起訴願。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
