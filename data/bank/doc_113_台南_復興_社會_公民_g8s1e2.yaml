  section: 1
  number: 37
  type: single
  page: 1
  stem: '網友在群組討論政府欲推動的新措施，依照對話內容判斷，該政策引發民眾不滿，應是認為其措施違反憲法保障人民的何種權利？

    群組聊天

    健歆：變種病毒讓每天的確診數又提高了。

    歆苹：政府準備強制大企業員工接種疫苗和定期檢測病毒，違反者將會被罰款。

    薰誼：很多民眾認為政府的決議侵犯他們的工作權，所幸最高法院已經否決這項政策。'
  options:
