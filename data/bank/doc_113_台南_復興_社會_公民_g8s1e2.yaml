- id: doc_113_台南_復興_社會_公民_g8s1e2_s2_3
  section: 2
  number: 3
  type: essay
  page: 2
  stem: 上述的修憲若發生在我國，應是由哪一個機關負責提案？
  group_stem: 愛爾蘭在國際婦女節當天進行修憲公投，公投的兩項內容是要修改「家庭組成」和「母親的家庭職責」定義。第1項打算將家庭定義從傳統上以婚姻為基礎的家庭，擴大到包含同居伴侶、跟其子女等長期關係。第2項公投則預計修改關於「母親的家庭職責」內容，並承認家庭成員會基於彼此之間的情感聯繫提供照顧。希望刪除憲法內對於女性過時與性別歧視的用詞，但2項公投都沒有過關。不少民眾認為，公提案用詞定義含糊不清是投票失利主因。
