- id: doc_113_台南_復興_社會_公民_g8s1e2_s2_1
  section: 2
  number: 1
  type: fill
  page: 2
  stem: 請問上述文章中的「甲單位」是哪個政府單位？
  group_stem: '37名死刑犯以死刑剝奪人性尊嚴、侵害生命權、違反比例原則等理由聲請釋憲，「甲單位」在2024年4月23日言詞辯論終結後，於5月20日下午3時宣布判決。「甲單位」表示，雖然《憲法》未明文規定生命權，但生命權是每一個人與生俱來的固有權利，因此無需憲法明文規定就應受到最高保障，但保障仍有例外，非絕對不可侵犯的權利。但考量剝奪生命與公共利益，認為應慎重、節約使用死刑，當死刑是不可或缺的最小侵害手段時，才符合憲法保障人民生命權意旨。意即死刑有條件合憲。

    「甲單位」表示，故意殺人罪是侵害生命權之最嚴重犯罪類型，其中「個案犯罪情節最嚴重者」會被處以死刑，其刑事程序符合憲法最嚴密之正當法律程序要求情形，無違憲法保障人民生命權之意旨。'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
