- id: doc_111_嘉義_北興_社會_地理_g7s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 請問導致高山症的原因為何？
  options:
  - label: A
    content: 溫度過低
  - label: B
    content: 氣壓過低
  - label: C
    content: 氣壓過高
  - label: D
    content: 紫外線太強。
  group_stem: '《題組一》高山症預防對策

    若有攀登至高海拔山區的行程，專家建議除了避免上升速度過快，前一晚應先在中海拔處停留以加強適應，避免直接進入高海拔山區。此外，也可至旅遊門診進行身體狀況、病史評估，若有需要可先進行預防性服藥。預防重點如下：

    • 行前訓練：登山本身就是一項高耗氧運動，應謹慎評估自身的體力、負重能力是否能負荷。

    • 心理建設：事先預設突發狀況的應對措施。

    • 藥物預防：先至旅遊門診進行評估，若有需要時進行預防性服藥。

    • 緩慢爬升：每日上升 500 公尺，讓身體有足夠的時間去適應高度的變化，是預防高山症最重要的準則。

    • 做好保暖：保持身體溫暖，因低溫會增加肺動脈壓，提高高山症的風險。

    • 提前適應高度：提前在中海拔處停留，讓身體有足夠時間適應。

    • 避免菸酒：吸菸會減少氧氣的吸入量，增加肺動脈壓；飲酒則會抑制呼吸中樞及缺氧換氣反應。

    • 爬得高、睡得低：晚上休息的目的地避免高於白天活動時的高度。

    • 多吃高碳水化合物、優質蛋白：避免食用會產氣的食物，如大豆、碳酸飲料。'
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 地理
