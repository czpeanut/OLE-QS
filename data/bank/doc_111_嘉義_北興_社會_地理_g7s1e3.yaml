  group_stem: '《題組五》台灣本該是全球降雨量最多的地區之一——台灣北部和中部屬副熱帶季風氣候，南部屬熱帶季風氣候。夏秋兩季常有颱風，也有季風。這裏常下雨，以至於地鐵站和企業都會放置雨傘供人借用。但
    2021 年發生了一件不尋常的事：沒有颱風登陸，而且很少下雨。這使台灣陷入 56 年來最嚴重的乾旱。許多水庫的蓄水量不到 20%，有些水庫的水位甚至低於 10%。

    全球最高端的晶片約有 90%在台灣生產。這些晶片對呼吸機和智能手機等各種產品至關重要，而新冠疫情使其需求高漲，供應緊張。美國現在擔心自己過度依賴包括台灣在內的海外晶片工廠。晶片行業對台灣的整體經濟貢獻很大，但需大量的水來清洗晶圓。為確保供水，台灣政府去年停止了對
    7.4 萬多公頃農田的灌溉。台灣政府還每周兩天暫停對三個市縣居民和企業供水，這包括台灣最大的城市之一台中。

    台灣的水價為每噸 11 元新台幣（0.39 美元；0.27 英鎊），在被調查的 35 個國家和地區中排名第二，是韓國水價的一半，是美國水價的四分之一，英國的六分之一。台灣水利署表示：「出於經濟社會發展和社會資源公平性的考量，目前還在仔細評估，暫時沒有成熟的調整方案。」節錄自〈2021/04/21
    BBC NEWS 台灣缺水為何吸引了全世界關注，這次到底有多嚴重？〉'
