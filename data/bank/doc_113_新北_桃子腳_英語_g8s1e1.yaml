    Cinco de Mayo means “May 5th” and people celebrate it every year in Mexico and
    some parts of America.

    In Mexico, people enjoy great food, music, and dance. Girls wear colorful dresses
    and flowers in their hair and boys wear sombreros.

    In the U.S., schools teach children about Mexican culture. Children decorate Mexican
    flags and learn some Mexican songs and dances. They dance together, have fun,
    and learn about Mexico. Learning about other cultures is a fun experience for
    all.'
