  section: 2
  number: 41
  type: single
  page: 5
  stem: 想要清潔大腦，下列何者做法符合本文的敘述？
  options:
  - label: A
    content: 美和固定在週休時爬山
  - label: B
    content: 永仁每週固定三天晨泳30分鐘
  - label: C
    content: 小藍每週固定三天打掃清潔房間
  - label: D
    content: 小智決定每晚伏地挺身、開合跳，各做300下。
  group_stem: "大腦也有自己的排廢系統？\n    當我們感到腦霧、健忘、情緒不穩或擔心失智，可能是大腦堆積了太多代謝垃圾。醫學期刊Nature Communications\
    \ 2025 年4 月公布大型研究顯示，「運動」是大腦最關鍵的清潔工具。\n     近年神經科學重大發現指出，大腦擁有一套與身體淋巴系統類似的「膠狀淋巴系統（glymphatic\
    \ system），透過膠質細胞將神經廢物與各類發炎因子導入腦脊髓液，再經由「腦膜淋巴管（mLV）」排出。然而，長期久坐、壓力過大、熬夜、老化等因素都可能導致腦部清除通道阻塞，使廢物堆積並增加失智風險。\n\
    \     研究顯示，規律運動能提升大腦「尾狀核」的淋巴流速、擴大腦膜淋巴管直徑，同時血液中與發炎相關的S100A8、S100A9、DEFA1A3 蛋白質濃度也顯著下降。更重要的是，與免疫調節相關的J\
    \ chain 蛋白上升，意味著運動不僅幫助排毒，也強化大腦的自我防禦機制。\n     運動效果並不取決於強度或爆汗程度，而在於是否「長期穩定」。每周三次、每次30\
    \ 分鐘的快走、游泳、騎車、有氧運動，都能有效刺激腦部清潔機制。\n     臺北 榮總遺傳優生科主任張家銘建議，在傍晚時段運動，配合膠狀淋巴系統與生理晝夜節律，有助於提升夜間清除效率。同時，充足睡眠也不可或缺，因為大腦在睡眠時進行最深層的代謝與排毒。白天靠運動開啟「進水口」，晚上透過睡眠排出「毒水」，雙管齊下才能維持腦部清潔與健康。\n\
