- id: doc_113_新北_永和_國文_g9s1e3_s4_2
  section: 4
  number: 2
  type: single
  page: 1
  stem: 下列選項「 」中的字音，何者前後相同？【綜合】
  options:
  - label: A
    content: 水皆「縹」碧／「漂」洗衣物
  - label: B
    content: 昂首觀之，項為之「強」／賞賜百千「強」
  - label: C
    content: 是日，「更」定矣／湖中焉得「更」有此人
  - label: D
    content: 從流飄蕩，「任」意東西／使爾悲不「任」。
  tags:
    chapter:
      publisher: null
      book: 九上
      subject: 國文
      code: null
      title: null
      chapter: null
    textbook: 九上 第3次段考範圍
    labeled_by: ai
- id: doc_113_新北_永和_國文_g9s1e3_s4_3
  section: 4
  number: 3
  type: single
  page: 1
  stem: 下列文句「」中的字義，何組意思相同？【綜合】
  options:
  - label: A
    content: 猿則百叫無「絕」／天下獨「絕」
  - label: B
    content: 望峰「息」心／氣「息」微弱
  - label: C
    content: 是金陵人「客」此／夜半鐘聲到「客」船
  - label: D
    content: 余「強」飲三大白而別／為賦新詞「強」說愁。
  tags:
    chapter:
      publisher: 康軒
      book: 九上
      subject: 國文
      code: 第七課
      title: 與宋元思書
      chapter: null
    textbook: 九上 第七課 與宋元思書
