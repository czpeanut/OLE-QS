- id: doc_113_新北_永和_國文_g9s1e3_s4_29
  section: 4
  number: 29
  type: single
  page: 4
  stem: 三仙台南側的成功鎮，是臺東縣的重要漁港，也是東部海岸國家風景區南段最大的聚落，能為遊客提供食宿等服務。在成功鎮，清晨時分不只有日出與海景，更有雙層山的景觀可賞。晨間紅日東起，都巒山山脈東坡正在向陽的一面；從成功西望，可見遠遠高山之前，還有一排低矮山脈，兩者平行排列。遠山高聳，由於距離遠，光線散射強，山色藍黑；近山雖低，但因陽光散射少，山色蒼翠，綠意盎然。兩層山鮮明的對比，構成一幅絕佳的風景畫面。在地質上，遠山是由都巒山層的火山集塊岩所構成，近山是由砂岩、頁岩構成，差異侵蝕的結果，造成這種雙層山的景觀。節選自王鑫《福爾摩沙的故事：獨特的容顏——南臺灣》。根據內容，下列敘述說明何者正確？
  options:
  - label: A
    content: 成功鎮是東部海岸國家風景區最大的聚落及漁港，是東部旅遊的好去處
  - label: B
    content: 下午時到成功鎮旅遊，最能盡收落日、海景與雙層山的美景
  - label: C
    content: 地質上由於差異侵蝕的影響，而形成遠山較低、近山較高的雙層山景觀
  - label: D
    content: 造成雙層山山色差異的原因，在於陽光散射的程度有所不同。
