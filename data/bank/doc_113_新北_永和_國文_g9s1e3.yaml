- id: doc_113_新北_永和_國文_g9s1e3_s4_5
  section: 4
  number: 5
  type: single
  page: 1
  stem: 〈與宋元思書〉中透過寫「水聲」、「鳥聲」、「蟬聲」、「猿聲」等自然天籟，除了能相互呼應外，亦可呈現整體山水之寂靜。下列何者也有類似的效果？【L7】
  options:
  - label: A
    content: 天階夜色涼如水，坐看牽牛織女星
  - label: B
    content: 蟬噪林逾靜，鳥鳴山更幽
  - label: C
    content: 林鶯啼到無聲處，青草池塘獨聽蛙
  - label: D
    content: 綠楊煙外曉寒輕，紅杏枝頭春意鬧。
  lesson_raw:
    number: 第7課
    title: 與宋元思書
    basis: 題目提及〈與宋元思書〉
  tags:
