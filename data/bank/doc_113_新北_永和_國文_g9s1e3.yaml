    \ 日兩\n個職棒最高層級聯盟的眾多紀錄，更是因為他所養成的人品、心理和態度，讓他有超越職業球壇世俗名利地位的常規和評\n價，能把「人」的真正價值，在球場上活出來。而這一切，從他的父母親對孩子的寶貴期待、格局，和堅持的毅力所栽培\n\
    出來，值得為調教出棒球巨星的這個家庭喝采。 (節錄自沈桓寬 果子傳媒網站)"
