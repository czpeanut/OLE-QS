- id: doc_113_新北_永和_國文_g9s1e3_s5_36
  section: 5
  number: 36
  type: single
  page: 6
  stem: 小樂暑假期間在家中的哪一種行為，不符合節能減碳的精神？
  options:
  - label: A
    content: 冷氣溫度調至二十七度
  - label: B
    content: 跟哥哥一起吃西瓜消暑
  - label: C
    content: 幫忙家人清潔冷氣隔塵網
  - label: D
    content: 穿著黑色尼龍Ｔ恤。
  group_stem: "減碳小祕訣 （節錄自環境品質文教基金會網站）\n食 ● 盡量選擇當季、當地食材食用，減少因長程運送而產生的碳排放。\n   ● 自備水壺方便又解渴，如需飲用瓶裝水，也以本地生產製造為宜。\n\
    \   ● 多利用保溫瓶、悶燒鍋等不需使用電力卻可持續保溫的器具。\n   ● 自備購物袋，減少額外盛裝袋之使用。\n衣 ● 夏季時，盡量穿著輕便淺色衣物，穿襯衫可不打領帶。\n\
    \   ● 化學合成纖維的衣服，製程消耗較多的能源，可以選擇天然纖維材質的衣服，降低二氧化碳排放量。\n   ● 做好衣物回收工作，可以幫助他人也減少廢棄物的產生。\n\
    住 ● 冷氣機設定溫度控制於26～28℃，並同時搭配電風扇使用，可減少電力耗用。\n   ● 冷氣機、除溼機均應定時清潔隔塵網，以提高使用效率。\n   ●\
    \ 家電用品不使用時隨手關閉電源，長時間不使用時應拔除插頭。\n   ● 電冰箱使用時盡量減少開關次數、縮短開啟時間，可使冰箱正常保鮮，同時也能減少耗電。\n\
    \   ● 盡量於戶外晾乾衣物，減少使用乾衣機的次數。\n行 ● 汽車盡量共乘，停車超過三分鐘以上應熄火。\n   ● 洽公或外出旅遊多利用大眾運輸工具。\n\
    \   ● 相同的路程，個人開車的二氧化碳排放量比騎車高約四倍，比搭乘捷運高約七倍。\n   ● 電梯盡量共乘，如搭乘樓層小於五層樓可以改爬樓梯，既可以運動健身也可以節省能源。"
