    \   ● 盡量於戶外晾乾衣物，減少使用乾衣機的次數。\n行 ● 汽車盡量共乘，停車超過三分鐘以上應熄火。\n   ● 洽公或外出旅遊多利用大眾運輸工具。\n\
    \   ● 相同的路程，個人開車的二氧化碳排放量比騎車高約四倍，比搭乘捷運高約七倍。\n   ● 電梯盡量共乘，如搭乘樓層小於五層樓可以改爬樓梯，既可以運動健身也可以節省能源。"
