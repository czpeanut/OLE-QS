  group_stem: "自三峽七百里中，兩岸連山，略無闕處。重巖疊嶂，隱天蔽日，自非亭午夜分，不見曦月。\n    至於夏水襄陵，沿溯阻絕。或王命急宣，有時朝發白帝，暮到江陵，其間千二百里，雖乘奔御風不以疾也。\n\
    \    春冬之時，則素湍綠潭，迴清倒影。絕巘多生怪柏，懸泉瀑布，飛漱其間。清榮峻茂，良多趣味。\n   每至晴初霜旦，林寒澗肅，常有高猿長嘯，屬引淒異，空谷傳響，哀轉久絕。故漁者歌曰：「巴東\
