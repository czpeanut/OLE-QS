  stem: 從大谷翔平父母對他的教育來看，可知培養良好的品德的重要，讓他有超俗的優異表現，對照他們使用的「九宮格目標達成法」強調的重點，相似於《論語》中修養品德的要義，下列依據《論語》原文相對應的品德修養項目何者不正確？
  options:
  - label: A
    content: 「君子求諸己，小人求諸人。」――合作
  - label: B
    content: 「君子固窮，小人窮斯濫矣。」――守法
  - label: C
    content: 「見義不為，無勇也。」――勇敢
  - label: D
    content: 「人而無信，不知其可也。」――誠信。
  group_stem: "拆解天才棒球手大谷翔平！「九宮格目標達成法」塑造強大內在人格\n    大谷翔平以驚人的二刀流（註：投打兼備）成績，震驚世界水平最高的MLB\
    \ 美國職棒大聯盟，不但以全票當選2020-\n2021 球季的美聯MVP，是史上唯二獲得銀棒獎（偉大打擊獎項）的日本選手，更同時以指定打擊與先發投手的兩個身分榮\n\
    登年度最佳陣容，成為史上第一位在美職和日職同時達成這項壯舉的球員。\n    他所獲得的榮譽，還包括年度最佳指定打擊，由大聯盟球員投票產生的「年度最佳球員」以及「美聯傑出球員」，《棒\n\
    球文摘》跟《棒球美國》兩本權威棒球雜誌的年度最佳球員獎，大聯盟主席曼佛瑞頒發的「主席歷史成就獎」等，不一而\n足，說是有史以來最風光榮耀的棒球選手，應該沒有人會有異議。\n\
    \    他從日職，到美職，都以二刀流，也就是投球和打擊並行的方式參與，今年他的身體健康，可以負荷比賽的強度，\n他甚至在被換下投手丘後，還自動請纓去守外野，比賽中也不斷嘗試盜壘，他跑壘的速度在MLB\
    \ 選手中也是名列前茅的。\n    大谷總是認真，甚至超過球隊要求地參與，他全心喜愛和投入的熱情，顯然遠遠超越對身價和名利的算計追求。\n    他另一個令人津津樂道，與其他運動明星不同的特質是，他總是對人彬彬有禮，友善而nice，不管是自己隊友、球\n\
    迷、裁判，甚至敵隊的球員，對他粗魯對待，他都能以燦爛的笑容對待，讓人忍不住融化。他的生活簡單而單純，沒有名\n車豪宅，把年度MVP 得主獎金，全數捐給慈善機構「miracles\
    \ for kids」，盼能幫助更多小朋友；全壘打大賽獎金捐給隊\n上職員，與人分享。同樣令人驚訝的是，他婉拒了日本政府的「國民榮譽賞」，和家鄉岩手縣的「縣民榮譽賞」這些人生\n\
    成就獎項，理由是他還太年輕，還沒有足夠資格。這些，完全顛覆大多數人對於人生追求目標的概念。\n    這樣一位運動界明星奇葩的棒球成就、觀念、心胸和對人對事態度，在在令人驚豔，也令人對他的成長和培育過程，\n\
    感到無比好奇。有一次看到他運動員父母養育他成為傑出運動員的 「九宮格目標達成法」，發現有極寶貴的內涵，好像也\n找到一些可能的答案，與大家分享。\n| 設定明確目標\
    \ | 保持平常心 | 冷靜的腦、炙熱的心 | 感性 | 為人所愛 | 計劃性 | 打招呼 | 撿垃圾 | 打掃房間 |\n| --- | --- | ---\
    \ | --- | --- | --- | --- | --- | --- |\n| 危機應變能力 | 心理層面 | 不受時勢影響 | 為人著想 | 人品\
    \ | 感謝 | 珍惜球具 | 運氣 | 對裁判的態度 |\n| 不掀起紛爭 | 對於勝利的執著 | 體諒夥伴 | 禮貌 | 為人所信任 | 毅力 | 正面思考\
    \ | 受人支持 | 讀書 |\n圖片：果子傳媒\n    從中，驚訝地發現父母親對他全方位的目標，除了很明確的體能、打擊、投球各方面鍛鍊目標之外，更直指人品、心\n\
