- id: doc_113_新北_永和_國文_g9s1e3_s4_4
  section: 4
  number: 4
  type: single
  page: 1
  stem: 根據〈與宋元思書〉一課，下列文句的說明何者正確？【L7】
  options:
  - label: A
    content: 「從流飄蕩，任意東西」寫隨波逐流，以求安身
  - label: B
    content: 「奇山異水，天下獨絕」寫出旅遊風光的客觀感受
  - label: C
    content: 「疏條交映，有時見日」寫枝葉扶疏，濃蔭蔽天的景象
  - label: D
    content: 「夾岸高山，皆生寒樹」寫山樹高聳競出的景象。
  lesson_raw:
    number: 第7課
    title: 與宋元思書
    basis: 題目提及〈與宋元思書〉
