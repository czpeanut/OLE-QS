  group_stem: "衛人束氏，舉世之物，咸無所好，惟好畜狸狌。狸狌，捕鼠獸也。畜至百餘，家東西之鼠捕且盡。狸狌無所食，飢而\n嗥。束氏日市肉啖之。狸狌生子若孫，以啖肉故，竟不知世之有鼠。但饑輒嗥，嗥則得肉食，食已，熙熙如也。\n\
    \    南郭有士病鼠，鼠群行有墮甕者，急從束氏假狸狌以去。狸狌見鼠雙耳聳、眼突露如漆、赤鬣、又磔磔然，以為異物\n也，沿甕行不敢下。士怒，推入之。狸狌怖甚，對之大嗥。久之，鼠度其無他技，齧其足，狸狌奮擲而出。\n\
    \                                                                            \
    \       ――宋濂〈束氏狸狌〉"
