- id: doc_113_新北_永和_國文_g9s1e3_s4_6
  section: 4
  number: 6
  type: single
  page: 1
  stem: 關於〈與宋元思書〉一文的寫作手法，下列敘述何者正確？ 【L7】
  options:
  - label: A
    content: 首段點出全文綱領，再分述「奇山異水」之美，全篇寫景，技巧高超
  - label: B
    content: 使用「負、競、爭、指」四字，使景色更加活潑有生氣，凸顯山之「奇」
  - label: C
    content: 寫景著重動態的描寫，而未有靜態的描述
  - label: D
    content: 善用譬喻及摹寫將美景描繪得有聲有色。
  lesson_raw:
    number: 第7課
    title: 與宋元思書
    basis: 題目提及〈與宋元思書〉
