- id: doc_113_新北_永和_國文_g9s1e3_s4_1
  section: 4
  number: 1
  type: single
  page: 1
  stem: 下列「  」中的注音寫成國字，何者前後字形相同？【綜合】
  options:
  - label: A
    content: 橫柯上「ㄅㄧˋ」／作「ㄅㄧˋ」上觀
  - label: B
    content: 互相「ㄒㄩㄢ」邈／氣宇「ㄒㄩㄢ」昂
  - label: C
    content: 經「ㄌㄨㄣˊ」世務／ 無與「ㄌㄨㄣˊ」比
  - label: D
    content: 暗「ㄐㄧㄢˋ」難防／刻舟求「ㄐㄧㄢˋ」。
  tags:
    chapter:
      publisher: null
      book: 九上
      subject: 國文
      code: null
      title: null
      chapter: null
    textbook: 九上 第3次段考範圍
