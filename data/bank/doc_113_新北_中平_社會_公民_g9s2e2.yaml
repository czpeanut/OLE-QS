  stem: 新聞報導：近日 ChatGPT 的 AI 生圖功能得以模仿「吉卜力」畫風，進而生成各式圖片，引起各國廣大網友爭相嘗試，並在網路上分享。但也引發不少討論。有人擔憂此舉是否可能涉及侵權？儘管宮崎駿工作室尚未表態，日本議員質詢時亦提出相關議題。公民課堂上，下列四位同學針對相關議題討論，何者正確？【素養導向】
  options:
