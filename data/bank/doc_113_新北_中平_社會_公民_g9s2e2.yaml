  - label: A
    content: 政治全球化下，有許多商品都是靠外國進口，國際貿易將受影響
  - label: B
    content: 跨國企業將因關稅措施降低生產成本，擴大國際分工
  - label: C
    content: 該新聞事件可見全球化過程展現出「全球關連」的現象
  - label: D
    content: 關稅措施將加速經濟全球化，使經濟相互依存的程度提高
