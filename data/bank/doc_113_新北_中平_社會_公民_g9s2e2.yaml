- id: doc_113_新北_中平_社會_公民_g9s2e2_s1_14
  section: 1
  number: 14
  type: single
  page: 3
  stem: 由上述資料可推斷國際展覽局（BIE）性質與下列何者相同？
  options:
  - label: A
    content: 聯合國
  - label: B
    content: 國際反地雷組織
  - label: C
    content: 無國界醫生
  - label: D
    content: 國際特赦組織。
  group_stem: '《資料一》：

    大阪世博4 月13 日開幕，主題為「生命閃耀未來社會的設計」。追求創新與進步的歷程中，世界博覽會一直扮演著推動技術的舞台。參展者主要以國家為單位，向全世界展示當代的文化、科技、產業等領域上正面影響各種生活範疇的成果。今年各國新技術的展出亦成為全球焦點。

    最早世博會自1851 年英國倫敦海倫德公園舉辦萬國工業博覽會，內容以世界文化與工業科技為主軸展現英國工業成果，而展覽主會場正是水晶宮，當年的展品包含起重機、收割機、蒸汽機、織布機等，第一次紀錄社會發展與未來展望。1928
    年《國際展覽會公約》簽署後，國際展覽局（BIE）成為世界博覽會的組織及監督機構；此後，世界博覽會分為「綜合型」（World Expos）、以及規模較小的「專業型」（Specialised
    Expos）等2 種類型。

    《資料二》：

    日本共同社今天引述日本與台灣的消息人士披露，日本外務省已向台灣方面提出要求，盼明確展現2025 年世界博覽會（大阪關西世博）的台灣館是由民間企業參展。報導指出，台灣並非國際展覽局（BIE）會員國，是以「外貿協會」在日本成立「玉山數位科技株式會社」的方式取得參展資格。經濟部長郭智輝接受質詢時表示，台灣因非BIE
    會員國才以民間企業名義參展，邀台灣就是日本非常大的誠意【新聞來源：經濟日報】'
