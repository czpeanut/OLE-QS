- id: doc_113_新北_中平_社會_公民_g9s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 根據上述文章第一段內容，「……享受科技帶來便利的同時，專家也提醒，部分內容若不加篩選就輸入AI，恐對個資與企業安全帶來風險……」，呈現出下列何種概念？【素養導向】
  options:
  - label: A
    content: 機會成本
  - label: B
    content: 媒體識讀
  - label: C
    content: 正向誘因
  - label: D
    content: 國際交流。
  group_stem: '根據新聞報導:

    隨著人工智慧工具如ChatGPT 廣泛進入日常使用場景，享受科技帶來便利的同時，專家也提醒，部分內容若不加篩選就輸入AI，恐對個資與企業安全帶來風險，包括身分資料、帳號密碼、醫療紀錄等，皆可能在未經使用者掌控下被處理與保存。

    「當你把東西輸入AI，就不是你的了。」史丹佛大學人本人工智慧研究中心（HAI）研究員珍妮佛（Jennifer King）向《華爾街日報》直言，一旦資料交由聊天機器人處理，用戶即喪失對其掌控權。以下5
    類資料類型，被珍妮佛點名最不應直接交由AI 處理：涉及公司運作的內部內容、含有個資的醫療報告、各類帳密組合資訊、可識別個人的基本資料、與金融操作有關的帳戶資訊

    除OpenAI 外，Google 的AI 系統Gemini 亦在官方頁面公開提醒，使用者不應輸入任何可能被審查的機密資料。人工智慧公司Anthropic 執行長Jason
    Clinton 則建議，使用AI 後應立即清除對話記錄，並啟用高強度密碼與兩步驟驗證等安全設定。

    儘管部分平台聲稱會在30 天內自動刪除使用資料，專家認為，AI 如何使用這些輸入內容仍缺乏外部審核與技術監督。對企業與高度重視隱私的使用者而言，選擇何種內容與AI
    互動，仍須小心謹慎。【新聞來源：Newtalk 新聞】'
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 公民
      code: 1-1
      title: 科技發展的應用與影響
      chapter: 第1章 科技發展
    textbook: 九下公民 1-1 科技發展的應用與影響
    labeled_by: ai
