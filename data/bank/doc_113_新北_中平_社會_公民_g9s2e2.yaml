  stem: 新聞報導：美國總統川普對180 國宣布新的關稅措施，全球金融市場籠罩在一片愁雲慘霧，日經指數4/7 早盤重挫3000 多點，是自2024 年8 月以來，首次摜破3
    萬3000 點；而韓國綜合股價指數（KOSPI）開盤下挫逾4%，暫停程式化賣單交易5 分鐘；台股開盤即暴跌2085 點、跌停至1 萬9121 點。根據上述推論，下列敘述何者正確？【素養導向】
