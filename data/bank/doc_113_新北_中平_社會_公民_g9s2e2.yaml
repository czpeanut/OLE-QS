  - label: D
    content: 世界衛生組織。
  group_stem: '（第 10 題）《甲組織》秘書長4/9 針對關稅戰議題聲明表示：「中美貿易緊張局勢不斷升高，對雙邊貿易構成急劇萎縮的重大風險。我們初步預測，這兩大經濟體之間的貨品貿易可能下降高達80%。」並警告世界經濟有可能分裂成兩大集團，一個以美國為中心，另一個以中國為核心。同時也敦促所有《甲組織》組織成員，一起因應這項挑戰共同努力，維護國際貿易體系開放，這至關重要。」根據上述內容提及那些國際互動型態？

    （第 11 題）承上題，《甲組織》最有可能是下列何者？

    （第 12 題）承上題，有關《甲組織》的相關敘述，下列何者正確？'
