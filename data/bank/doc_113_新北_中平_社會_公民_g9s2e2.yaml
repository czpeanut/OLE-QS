    content: 芮芮：有人擔憂「吉卜力」畫風可能有違反著商標法疑慮
  - label: C
    content: 明明：引起各國廣大網友爭相嘗試「吉卜力」畫風，顯現出政治全球化的現象
  - label: D
    content: 美美：透過AI 生圖也在我國智慧財產權保障的專利法範圍內。
