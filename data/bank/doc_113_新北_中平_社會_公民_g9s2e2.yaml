  stem: 近年台灣詐騙集團日益國際化，為躲避查緝，他們不再依賴本地人擔任車手，而是將觸角伸向東南亞，透過社群平台、求職網站等管道，誘騙馬來西亞、越南、泰國等地的年輕人來台擔任詐騙車手。這些外籍人士在「包機票、包住宿、高薪兼職」的誘人條件下來台，卻可能在不知情或半知情的狀況下，捲入跨國詐騙犯罪。不少人遭到集團操控甚至脅迫，最終成為棄子，一旦被逮，不僅面臨法律責任，也難以自清。這類外籍車手案件呈現明顯上升趨勢，已成新興犯罪型態，亟需政府與社會正視。根據上述推論，下列敘述何者正確？【素養導向】
  options:
