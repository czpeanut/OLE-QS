  - label: C
    content: 一個人在不同的年齡階段聽同一首樂曲，會有不同的感受
  - label: D
    content: 不同素養的人聆聽相同的樂曲，會引發不同的理解
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
