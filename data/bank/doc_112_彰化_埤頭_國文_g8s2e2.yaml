- id: doc_112_彰化_埤頭_國文_g8s2e2_s3_48
  section: 3
  number: 48
  type: single
  page: 3
  stem: 根據本文，下列何者不是斜張橋具有的特點？
  options:
  - label: A
    content: 減少建材使用
  - label: B
    content: 橋墩數較少
  - label: C
    content: 造型單一
  - label: D
    content: 美化城市
  group_stem: '(二)

    　　莫拉克颱風沖垮了全臺四十一座橋梁，這些斷橋全屬於跨徑短、橋墩數多的「梁式橋」，只要一個橋墩被沖垮，整座橋梁就會斷裂。部分學者因此建議，未來若是興建超過數百公尺的河川橋，最好採用跨徑大、不須立太多橋墩的「斜張橋」，才能降低急速暴漲的河水沖垮橋梁的風險。斜張橋是用鋼纜將橋樑架重量，並以「斜拉」方式將橋身拉至橋塔固定。近幾年臺灣已興建多座斜張橋，像1999年通車的南投集鹿大橋、苗栗新東大橋、臺北大直橋、淡水漁人碼頭情人橋等也都屬於斜張橋。

    　　直到二次大戰後，斜張橋才受到重視，主要原因是所需的建材很少，正好能解決戰後物資缺乏的窘境。之後由於施工技術、材料力學、電腦運算速度等突飛猛進，再加上斜張橋的橋塔及鋼纜能組合出多種深具科技美感的造型，因此備受橋梁工程師的喜愛。

    　　斜張橋常見的鋼纜排列方式有輻射狀、豎形及扇形等三種。其多變造型不僅讓橋梁從單純的交通運輸，變成美化城市的重要角色，專家還表示，沖刷、地震及颱風是臺灣河川橋的三大風險因素，因此橋梁的設計新思維應朝向減少橋墩、拉大跨徑。斜張橋的製造成本雖然昂貴，但相較於傳統梁式橋，其風險評估及維護成本卻低許多，是能真正帶來美麗又長壽的橋梁。（楊嘉慧不怕洪水的斜張橋）'
