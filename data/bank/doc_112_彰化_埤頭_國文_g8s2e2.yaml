  stem: 「聆聽同一首樂曲，解讀同一份樂譜，接受者因為背景不同、性情各異，最終所獲得的理解認知有可能大相逕庭。這不僅是因為審美中存在『仁者見仁，智者見智』的可變性規律，而且也因為在音樂理解中，不同的接受者之間確實存在經驗、知識、素養訓練等方面的顯著差別。」(音樂美學)這段文字旨在傳達下列何者？
  options:
  - label: A
    content: 要選擇不同類型的音樂聆聽，才能具備全方位的音樂素養
