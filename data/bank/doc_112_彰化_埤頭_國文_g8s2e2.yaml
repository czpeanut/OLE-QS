  group_stem: '(一)

    　　年羹堯鎮西安時，廣求天下才士，厚幕養中……征青海日，營次(1)，忽傳令云：「明日進兵，人各攜板一片、草一束。」軍中不解其故。比次日，遇塌子溝(2)，令各將束草擲入，上鋪板片，師行無阻。番人方倚此險，不意大兵驟至也。遂破賊巢。又生征西藏時，一夜漏(3)三下，忽聞疾風西來，俄頃即寂。年急呼某參將，領飛騎三百，往西南密林中搜賊，果盡殲焉。人問其故，年曰：「一霎而絕，非風也，是飛鳥振掣之聲也。夜半鳥出，必有驚之者。此去西南十里，有叢林密樹，宿鳥必多，意必賊來潛伏，故鳥群驚起也。」

