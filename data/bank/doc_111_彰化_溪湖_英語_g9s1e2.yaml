  section: 7
  number: 4
  type: single
  page: 3
  stem: What does “phobia” mean in the reading?
  options:
  - label: A
    content: The effort you try to make.
  - label: B
    content: The tool you use to solve the problems.
  - label: C
    content: The ways to read people’s mind.
  - label: D
    content: The fear in people’s mind.
  group_stem: "(二)\n People are sometimes afraid of something or doing something.\
    \ However, in some cases, if people are too scared of some things or situations,\
    \ we will call it “phobia.” Phobia has a great influence on people’s lives.\n\
    \ There are different kinds of phobias making people crazy. People with “claustrophobia”\
    \ don’t feel comfortable when they are in a small room or space. But some people\
    \ are scared of being with many people or in large open space. It is so-called\
    \ “agoraphobia.” These are two common phobias.\n However, there are some famous\
    \ people with other strange phobias. A famous actor has nothing to fear in his\
    \ movies, but he has a fear of eggs. We call it “ovophobia.” Another special case\
    \ is “spectrophobia.” People with it hate to look at themselves in the mirror.\
    \ And now, “nomophobia” is more and more common. Sometimes cellphones are frozen\
    \ and can’t work well, people can’t use cellphones to go online or make calls\
    \ with others. They will get very sad or even quite angry.\n How about you? Do\
    \ you have any phobia?\n\n situation 情況; influence 影響; fear 恐懼; mirror 鏡子"
