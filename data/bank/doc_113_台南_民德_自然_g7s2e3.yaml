- id: doc_113_台南_民德_自然_g7s2e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 海拔1500~2500 公尺山區是臺灣最大的降雨帶，溼度很高，經日照後，水氣向上蒸發，常使山林變成霧茫茫的一片，稱為霧林帶。此處針葉林和闊葉林混生，以紅檜、扁柏為主要代表樹種，而且蘚苔和地衣（藻類或藍菌和真菌共生而成的生物體）很容易在森林中繁殖並裹滿整棵樹，讓樹表呈現毛毛的樣子，在死後屍體會落入土壤中，成為樹的肥料。請問下列對霧林帶的敘述何者正確？
  options:
  - label: A
    content: 針葉樹是指樹林裡的仙人掌
  - label: B
    content: 蘚苔附在樹幹表層是寄生在樹上
  - label: C
    content: 附生於樹上的地衣可行光合作用產生醣類
  - label: D
    content: 蘚苔死後要成為樹的肥料，主要需要清除者的幫忙。
