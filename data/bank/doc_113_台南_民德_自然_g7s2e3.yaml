  stem: 石虎為臺灣僅存的原生種貓科動物之一，通常以老鼠、野兔為食。由於棲地破壞、土地與道路的過度開發、農藥毒藥的濫用、商業性非法捕獵，數量岌岌可危。加上部分農民認為石虎會偷吃雞，因此石虎的保育遭到很大的阻力。試以生態永續的觀點，判斷下列何者最適當？
  options:
  - label: A
    content: 石虎的食物來源不缺，無須特地保育
  - label: B
    content: 石虎會吃雞而影響農民生計，最好圈養在動物園裡
  - label: C
    content: 石虎能夠抑制老鼠、野兔的增加，有助於自然生態平衡
  - label: D
    content: 開發土地與道路時，將石虎遷移別處棲息便可保障石虎永續生存。
