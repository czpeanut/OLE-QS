  stem: 臺南四草有水筆仔、海茄苳、欖李等紅樹林樹種茂盛地混合生長，生物有招潮蟹、彈塗魚、水鳥等，目前劃入台江國家公園來保育這塊生態寶地。由以上敘述判斷，下列何者正確？
  options:
  - label: A
    content: 此地所有生物的總和，可稱為群集
  - label: B
    content: 四草所有紅樹林植物，可稱為紅樹林族群
  - label: C
    content: 若大量引進東南亞的其他種類紅樹林植物，能增加此地的生物多樣性
  - label: D
    content: 依單一食物鏈形成的能量塔中，欖李的總能量比彈塗魚低。
- id: doc_113_台南_民德_自然_g7s2e3_s1_30
  section: 1
  number: 30
  type: single
  page: 3
  stem: 金門料羅灣海域是臺灣最大的昆布養殖區。許多魚類和海膽以昆布為食物，棲息在該處的水獺則捕食魚類和海膽。若當水獺遭到大量捕殺之後，對此生態系會造成下列何種影響？
  options:
  - label: A
    content: 魚類數量不受影響
  - label: B
    content: 海膽繁殖的數量減少
  - label: C
    content: 昆布繁殖的數量減少
  - label: D
    content: 魚類、海膽、昆布維持原有平衡
