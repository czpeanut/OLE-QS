    content: 西區在甲時期因負荷量增加，所以鹿的族群增大
  - label: B
    content: 乙時期西區鹿的出生數量必大於死亡數量
  - label: C
    content: 西區在丙時期環境不利於鹿群的因素最大
  - label: D
    content: 丁時期西區的生物出生數量加上遷入數量，與死亡數量加上遷出數量大約相同。
