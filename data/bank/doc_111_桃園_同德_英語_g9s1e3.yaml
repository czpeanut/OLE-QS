  group_stem: '( 42--44 )

    Do you hate bees flying around when you’re having a picnic? Perhaps you’ll think
    again after you hear this: Bees play an

    important part in feeding the world—without the help of bees, we might lose as
    much as 90% of our food. And now here’s

    some bad news: Our little helpers are dying. In Europe and North America, the
    number of bees has dropped sharply. The UK,

    for example, reported a worrying 54% drop over the last 20 years. It’s hard to
    tell why bees are dying. Some believe it’s because

    winters are getting too cold for them. Some think Varroa Destructor is the culprit.
    This very small kind of bug lives on bees and

    slowly kills them. Others feel we are in the wrong. When we turn more land into
    houses, more plants die. This means bees will

    not be able to find enough food. There may be a lot of guesses about it, but what’s
    more important is to find an answer soon. If

    we don’t take action, we’ll all “bee” sorry.'
