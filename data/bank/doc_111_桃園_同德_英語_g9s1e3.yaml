  group_stem: "( 45-47 )\nOld and Beautiful Woodshire\n  Get on a train that runs\
    \ along the Wald River and travel to beautiful Woodshire, an old town with a history\
    \ of three hundred\nyears. When you arrive at Woodshire, the first thing you’ll\
    \ see is Woodshire Castle. It stands by the river, and is across from the\nrailway\
    \ station. The castle garden is free for visits, or you can buy a ticket to enjoy\
    \ the beautiful castle.\n  Walk along the Wald River, and you will get to the\
    \ center of Woodshire. A nice place to stop by is Woodshire Mask Museum.\nSpend\
    \ some time in the museum and make yourself a mask. And don’t forget to have afternoon\
    \ tea in Woodshire. Woodshire’s\ntea is known all over the world, and there is\
    \ a tea house street near Woodshire Church Square. There you can have a taste\
    \ of\nthe best black tea at the Black Pot, one of the oldest tea houses in the\
    \ east end. If you want to take a good look at Woodshire\nfrom a higher place,\
    \ walk south and climb to the top of the White Gate, the oldest town gate. From\
    \ the top you can clearly see\nthe castle, the museum, the church, and many important\
    \ places in Woodshire.\n  For more information, please go to http://www.woodshire.org."
