- id: doc_113_台中_中港_英語_g8s2e3_s4_33
  section: 4
  number: 33
  type: single
  page: 3
  stem: What does <u>one</u> mean in the reading?
  options:
  - label: A
    content: A photo.
  - label: B
    content: A country.
  - label: C
    content: A good-looking person.
  - label: D
    content: A friend.
  group_stem: '(一)

    Do you want to make friends with handsome men or beautiful women? If you do, then
    you have to be <u>one</u> of them first. Go to <u>BeautifulPeople.com</u> and
    be a member first. <u>BeautifulPeople.com</u> is a friend-making website. Only
    those handsome men and beautiful women can join to date good-looking people. You
    just have to send a photo of yourself and your own profile to the website. If
    they <u>accept</u> you to be one of their members, they''ll let you know in 48
    hours.

    <u>BeautifulPeople.com</u> started in Denmark in 2002. In less than two weeks,
    2.16 million people tried to join but only 360,000 people made it in the end.
    Now, it has 540,000 members in the world. The top 3 countries with the most handsome
    men are Sweden, Brazil and Denmark. As for the most beautiful women, most of them
    come from Norway, Sweden and Iceland. If you''re interested in making friends
    with these good-looking people, get online and give it a try.

     profile 個人簡介'
