- id: doc_113_台中_中港_英語_g8s2e3_s4_38
  section: 4
  number: 38
  type: single
  page: 4
  stem: What can we learn from the reading?
  options:
  - label: A
    content: After farmers grow new trees, they find other forests to live in.
  - label: B
    content: People were not affected in the Amazon forest fire in 2019.
  - label: C
    content: Forest fires are sometimes healthy for the plants.
  - label: D
    content: We should stop setting fires in the forests.
  group_stem: '(三)

    Are forest fires disasters to the plants and animals? Not always, fires in forests
    can be helpful to nature sometimes. For example, some farmers cut down trees and
    burn them during dry seasons. The fires will leave ashes on the ground, and they
    are good for the ground to grow more plants. After a few years, when that land
    is no longer able to grow things, the farmers will move to other places and do
    the same thing again. The seeds from other forests will fly to those dying lands
    and start new lives and plants. This kind of farming is common and good for nature,
    and fires help a lot in this circle of life.

    However, the big fire in the Amazon rainforest in 2019 is not really "helpful"
    at all. The number of fires in the rainforest went up to over 40 thousand times
    in 2019, which is the most serious in recent years. It happened because there
    are so many people cutting down or burning trees for business and farming. The
    cutting down of the trees in only 2019 is three times more than the total number
    in the past three years. It is also a serious problem to the neighbors because
    the big fire will make the air really bad for our health. While some people say
    that it is just a common forest fire, they might have not seen the real problem
    in it.

     disaster 災難 ash 灰燼 Amazon 亞馬遜 recent 最近的'
