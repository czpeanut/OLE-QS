  group_stem: (二)6月8日是世界海洋日,2023年主題是「海洋星球:潮流正在改變」,呼籲大家正視轉變中的海洋環境與生態問題。海洋塑膠垃圾是近年全世界關注的重要議題,塑膠垃圾不僅會汙染環境,崩解後形成的塑膠微粒還會影響海洋生物,進而危害人類的安全與健康。2018年5月,黑潮海洋文教基金會執行「島航計畫」,從花蓮港出發開船繞行臺灣一圈,進行周邊海域海漂垃圾及塑膠微粒的調查,同時希望藉此號召民眾重視海洋環境。該基金會在整理檢測數據後公布調查報告,結果顯示海漂垃圾幾乎無所不在,其中以目視方式發現最多垃圾量的地點,位於地形主要為岬、灣相間的海岸地帶,估計數量每平方公里將近2,000件;而塑膠微粒的調查結果則顯示全部測點皆存在塑膠微粒,測得數量最多的測點位於八掌溪出海口附近,每立方公尺約存在64顆塑膠微粒。
