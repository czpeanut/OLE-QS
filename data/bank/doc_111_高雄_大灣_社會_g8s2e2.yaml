  section: 1
  number: 12
  type: single
  page: 1
  stem: '西亞與北非紛爭不斷，原因包含缺乏資源、文化複雜、石油利益與西方勢力介入。西元 2017 年底，當時的美國總統川普承認耶路撒冷為以色列首都，引起巴勒斯坦激進組織哈瑪斯民兵發射火箭攻擊，當地居民也對軍隊與過往車輛丟擲石塊洩憤。對於這個動亂的原因，下列哪些分析較為合理？

    甲.耶路撒冷天災頻繁，居民生活困頓，但美國與以色列卻冷眼旁觀

    乙.耶路撒冷為重要的石油產地，爭奪油田一直是此地紛爭的導火線

    丙.耶路撒冷為三教聖地，文化複雜，長期以來，歸屬權便爭議不斷

    丁.美國介入耶路撒冷的歸屬爭議，促使當地與西方的矛盾再度升高'
