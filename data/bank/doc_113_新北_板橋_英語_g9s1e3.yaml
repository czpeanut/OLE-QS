  group_stem: 'Music is very important in our daily life. Many people listen to music
    on the MRT, on the bus, after class, or even in the shower. There are also many
    genres in music. For example, hip-hop, rap, rock, and more. One of the most famous
    genres is “R&B.”

    R&B, also known as “rhythm and blues”, is a kind of music that started in an African-American
    people. The music genre was born in the year 1940. The term was used to explain
    music with a very strong beat. This kind of music was for the Africans to sing
    about their stories and how much they want to be free.

    Nowadays, some famous R&B singers are Ariana Grande, Beyonce, Drake and so on.
    Although the genre is no longer used to explain the pain of the Africans, this
    kind of music is still loved by different people at different times.


    📖 rhythm 節奏

    blues 藍調

