  group_stem: 'Book Fair in the Year of the Ox is coming!

    There are more than one hundred stands, and there are artists and writers from
    around the world. The book fans always enjoy their time at the book fair, and
    some even spend more than a week here. Also, you can wear the costumes we prepared
    to be the character of the comic when you are visiting the stands.


    There are four main areas of the book fair this year:

    comic books, magazines, picture books, and novels.

    This is the biggest book fair in Green Town. Don’t miss it!


    ＊Good news: This is the year of the ox. Is there a “niu” in your name? For example,
    you’re Da-Niu Chang, or Mo-Wang Niu.

    Then, show us your ID and join the book fair for free!


    • Lucky Box: Visitors of that day have chances to win free comic books, postcards,
    fans, bags and many other things that are not for sale at 10:00, 13:00, 16:00
    and 19:00. Come and put the number of your ticket in the lucky box!

    • Star Square: Line up here to meet the guest writers or artists. You may shake
    hands with them or have them sign on the books.

    • Photo Booth: After you borrow the costumes, put them on and we’ll take pictures
    for you. In the picture, you’ll become one in the comics.

    • Comic World: Are you a fan of Naruto? Do you like Crayon Shin-chan? What is
    your favorite character? Tell the teachers at Comic World, and they help you make
    a key chain or a doll of the character. It takes about thirty minutes to make
    one.

    📖 ox 牛 novel 小說'
