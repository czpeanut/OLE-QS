  group_stem: "(五)請閱讀文章後，回答44-47 題：\n  切．格瓦拉（1928～1967 年），出生於阿根廷，為\n著名的革命者。\n  他大學攻讀醫學系時，與友人騎著摩托車遊歷中南\n\
    美洲。兩人從故鄉阿根廷出發，途經智利、秘魯、哥倫\n比亞與委內瑞拉等國。他們於1951 年12 月29 日出發，\n路途的中間他們的摩托車壞掉了。切·格瓦拉還在秘魯的\n\
    一個麻風病人村作了幾個月的義工。1952 年9 月，切·格\n瓦拉乘飛機回到了阿根廷。\n  他在旅途過程中目睹各種社會不平等待遇，體會到\n中南美洲國家在世界的處境，也留下他日後發動革命的\n\
    契機。\n   他本人也成為了國際共產主義運動的英雄和世界左翼\n運動的象徵，被稱作「紅色羅賓漢」、「共產主義的唐\n吉訶德」。\n  即便是一些對切·格瓦拉共產主義理想嗤之以鼻的自由\n\
    人士也對其自我犧牲精神表達了由衷的欽佩。他之所以\n被廣大西方年青人與其他革命者區別對待，原因就在於\n他為了全世界的革命事業而毅然放棄舒適的家境。當他\n\
    在古巴大權在握時，他又為了自己的理想放棄了高官厚\n祿，重返革命戰場，並戰鬥直至犧牲。\n\n▲切．格瓦拉摩托車路線圖"
