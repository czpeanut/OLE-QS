  group_stem: '(四)請閱讀以下新聞，回答42-43 題：


    台積電在美國亞利桑納州的晶圓21 廠週三（12/7）凌晨舉

    行移機典禮，不僅美國總統拜登出席致詞，蘋果執行長庫

    克、輝達（Nvidia）執行長黃仁勳、超微半導體（AMD）董事

    長蘇姿丰等，幾位台積電主要客戶都前來站台。這場移機

    典禮貴賓冠蓋雲集，台積電重要的客戶全都參加了，十足

    的世界之光，就連政府花錢想做公關都請不到這些大咖。

    台積電到亞利桑那州投資400 億美元（約1.2 兆新台幣）

    ，台灣一年國家總預算才2 兆多台幣，而半導體廠能拿出

    400 億美元實力的也不多，能玩得起的只有三咖，一咖是台

    積電，第二是三星，另一個是英特爾。

