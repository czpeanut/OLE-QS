    （中央社紐約26 日綜合外電報導）美國紐約州水牛城（Buffalo）

    遭逢被視為該地區45 年來最嚴重暴風雪，導致水牛城及

    周邊地區交通癱瘓，駕駛人被困在車中，水牛城所在地

    伊利郡至今已知至少有25 人死亡。路透社報導，這場致

    命暴風雪於23 日成形，在耶誕節週末期間侵襲紐約州西

    部，水牛城及周邊地區是災情最嚴重的地方之一。水牛

    城為紐約州伊利郡（Erie County）首府，伊利郡行政首長

    波隆卡茲（Mark Poloncarz）表示，伊利郡至少已有25 人死

    亡。波隆卡茲指出，伊利郡昨天證實有13 人死亡，官員

    已確認新增12 死，這使得全郡因暴風雪死亡的總數來到

