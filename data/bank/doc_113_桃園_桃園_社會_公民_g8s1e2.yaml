  stem: 下列敘述，何者正確？
  options:
  - label: A
    content: 不信任案通過後，行政院院長應提出辭職，並直接解散行政院。
  - label: B
    content: 總統可提名的重要官員包括大法官、考試委員及審計長等。
  - label: C
    content: 立法院依法對行政院負責，立法院院長及各部會首長有向行政院提出施政方針與施政報告之責。
  - label: D
    content: 監察委員應運用質詢、預算和法案審查、人事同意權等，達到監督政府、制衡行政權的效果。
