- id: doc_113_桃園_桃園_社會_公民_g8s1e2_s1_43
  section: 1
  number: 43
  type: single
  page: 2
  stem: 請選出正確的內容？
  options:
  - label: A
    content: 受益權是指每個人在法律上均享有同等的權利，擔負同等的義務，不得有所歧視或享有特權。
  - label: B
    content: 監察院對於違法或失職的公務人員可以行使彈劾權及糾正權，並得對行政機關不當施政提出糾舉案。
  - label: C
    content: 行政院將法律案移請立法院覆議時，立法委員以討論方式決定是否維持原決議。
  - label: D
    content: 依據艾克頓爵士所提出的理論，西方國家將中央政府的權力分為行政、立法、司法權三種，並分別歸屬於不同的政府部門行使。
