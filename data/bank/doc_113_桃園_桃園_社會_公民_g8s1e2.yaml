  stem: 美中之間的貿易衝突，臺商表達回臺投資意願。行政院指示相關部會研擬「歡迎臺商回臺投資行動方案」，期待能重塑產業供應鏈的完整性，厚植臺灣未來產業發展實力。由上文推論，下列選項何者正確？
