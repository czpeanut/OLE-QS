  group_stem: '◎武藏整理一份戰後臺灣經濟發展的歷史筆記，請根據四段內容，回答 18~21 題：

    (甲)隨著「南向」政策的實施，投資東南亞市場已經成為許多企業發展趨勢，國際移工也扮演臺灣經濟生產的要角。

    (乙)行政院長提出「十大建設」計畫，進行基礎建設、發展重工業，其中部分建設至今仍扮演重要角色。

    (丙)政府透過提高關稅達到管制國外產品進口，利用出口農產品賺來的錢購買工業設備與原料，透過農業來扶植工業。

    (丁)政府設置加工出口區，提供完善的投資環境，吸引國內外商人投資，區內進行成衣、家電加工製造，使臺灣逐漸轉變至工業社會。'
