  group_stem: 小文爸爸因工廠裁員，收入中斷，媽媽只好取消他暑假的校外教學，小文覺得很無奈，因為好友小偉一家才剛從國外旅遊回來，兩人的生活差距讓他感受特別深。隔天上學，學校邀請企業家老陳來演講，老陳分享年輕時家境貧困，國中輟學打工但不放棄，歷經多次失敗後，終於創立知名連鎖餐飲品牌。小文的導師也在課堂上提到，他曾在偏鄉任教，那裡學生缺乏網路、電腦和書籍，學習資源遠不如都市學生。老師感嘆：「他們不是不努力，而是起跑點不同。」這句話鼓勵了小文，讓他明白只要努力，未來有翻轉人生的可能。
