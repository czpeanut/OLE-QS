  number: 47
  type: single
  page: 2
  stem: 阿明享有的社福政策是？
  options:
  - label: A
    content: 社會保險
  - label: B
    content: 社會救助
  - label: C
    content: 社會津貼
  - label: D
    content: 醫療保健。
  group_stem: 現實生活中，有許多人正面臨著各種不同的困境，像是住在山區的阿明，因為當地沒有大型醫院，讓他和鄰居生病時，就只能等待著政府安排的巡迴醫療車，就近看病；小安從小患有肌肉萎縮症，無法像其他同學一樣自由行動，每天上下學都仰賴政府的復康巴士接送，才能安全返家；小翔的家庭經濟困難，被列為低收入戶，每月可領取政府提供的生活補助，幫助他們支付食物、房租和醫療費。世上苦人多，我國社會福利制度的目的，是希望能透過各項補助與服務，減少弱勢者所面臨的不公平，實現「人人生而平等」的理念。請根據文章內容回答：
