  section: 3
  number: 61
  type: single
  page: 6
  stem: 請問國際貿易中的出、進口概念及我國現況，下列敘述何者正確？
  options:
  - label: A
    content: 我國具備豐富自然資源，故我國出口原料具競爭優勢
  - label: B
    content: 我國出口產品將形成貿易支出
  - label: C
    content: 國外商品價格高於國內價格，使生產者願意出口
  - label: D
    content: 他國出口商品至我國僅需計算關稅成本。
  group_stem: "加入 WTO 對臺灣經濟貿易發展之影響\n    WTO 成立的主要理念是「確保全球自由貿易」，透過多邊諮商建立規範，降低會員國間關稅與非關稅貿易障礙，為會員國提供穩定及可預測的貿易環境。臺灣自2002\
    \ 年加入世界貿易組織(WTO)後，讓民眾可以買到更便宜的產品，而我國由於內需市場不大，經濟體質以加工製造出口為主，「國際化」、「自由化」是我國長期以來既定之經貿政策，加入WTO\
    \ 後，我國不僅可享受更自由的經貿空間，擴展國際市場，加速經濟自由化的速度，調整經濟體質，更可藉此提升我國產業競爭力。"
