- id: doc_113_屏東_明正_社會_g9s1e2_s3_59
  section: 3
  number: 59
  type: single
  page: 6
  stem: 根據上述，政府對於企業結合案的審查考量主要為何者？
  options:
  - label: A
    content: 合併後有無明顯減損市場競爭的機能
  - label: B
    content: 合併後企業的產能是否有明顯提升
  - label: C
    content: 合併前企業有無逃稅的不良紀錄
  - label: D
    content: 合併前企業是否有進行公益活動。
  group_stem: "KTV 兩大龍頭錢櫃、好樂迪結合案四度卡關\n    KTV 兩大龍頭錢櫃、好樂迪結合案，至2019 年為止已遭公平交易委員會（以下簡稱公平會)第四度禁止，公平會提出三項理由。首先，錢櫃、好樂迪在結合前，就已是市場上主要業者，相互為重要競爭對手，結合後市占率達四成五，將顯著減損市場競爭，消費者或競爭者無法有效對抗、抑制；其次，公平會徵詢包括上游業者唱片公司、伴唱產品代理業者、音樂著作權集體管理團體，以及消費者保護團體等各界意見，都認為此案有限制競爭疑慮。最後，公平會委員認為，這項結合案整體經濟利益明顯小於限制競爭的利益，只對錢櫃、好樂迪有利，對消費者而言，即便雙方承諾結合後不漲價、不減少服務內容，但長期來看，仍無法解決競爭對手消除，而導致漲價的可能性。\n\
    \    過去國內KTV 龍頭錢櫃與好樂迪的結合案，公平會曾以對整體市場的經濟利益並無特別好處而禁止；而2016 年全聯與松青結合案中，公平會則認為：兩者結合之後，市場業者仍然眾多，且業者販售的商品種類、品項具高度替代性，因此認定兩家超市體系結合對市場競爭沒有顯著影響而予以同意結合。"
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 公民
      code: 3-2
      title: 市場競爭方式與程度
      chapter: 第3章 市場與競爭
    textbook: 九上公民 3-2 市場競爭方式與程度
    labeled_by: ai
