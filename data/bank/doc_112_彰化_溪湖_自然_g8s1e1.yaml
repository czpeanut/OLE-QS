  stem: 小弦一聽到老師要測物體質量，馬上就將物體放在上皿天平左盤上，並在右盤放置10 克的砝碼四個，2 克的砝碼兩個時，此時天平呈水平，他便很高興的把結果記錄在實驗紀錄簿上。當老師公布物體真正質量為42.0
