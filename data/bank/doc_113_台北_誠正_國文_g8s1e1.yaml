- id: doc_113_台北_誠正_國文_g8s1e1_s2_39
  section: 2
  number: 39
  type: single
  page: 4
  stem: 根據本文，下列哪一種人的身分最符合作者心目中的「鷹」？
  options:
  - label: A
    content: 擔任過許多國家使節的外交官
  - label: B
    content: 闖蕩世界各國的旅遊文學作家
  - label: C
    content: 研究各國地理情況的地理學家
  - label: D
    content: 出國巡迴遠洋撈捕漁獲的漁夫
  group_stem: '好媽媽竟都是鴿子

    親愛的孩子：

    人因為有了牽絆，視野就會不自覺地狹隘起來。直到逼近過年，不斷趕工作的我才開始想，啊，我們是否該到哪裡去度假？等我有時間打電話給旅行社時，新加坡沒機票了，澳門沒飯店了，峇里島早客滿了，臺灣本地更不用說。去醫療不發達國家，怕萬一妳生病得不到妥善照顧；去冷的地方，怕妳著涼――從有妳之後，所有的旅行變成家族旅行。看來，沒有地方可以去了。又得像去年一樣，在大城市中安全的建築物裡晃著晃著，期盼晃掉無聊，等著餵妳吃三餐，等著新的一年趕快開工。

    我什麼時候變成一隻鴿子的？我是鷹啊，本來。妳要知道，我的度假史向來精采。有一年過年，我到過南極；有一年，我在北非；有三年，我在印度的偏遠小鎮；有幾年，我在巴黎，在威尼斯，在捷克，在南太平洋潛水，在祕魯的安地斯山脈探訪印加帝國古文明，在中東最危險的國家葉門圍上面紗，在古埃及的神廟和木堆裡想像著探險故事，在耶路薩冷朝拜耶穌受難之路，在死海，在當時才剛開放的寮國、緬甸和俄羅斯……我一個人旅行，也不覺得不快樂。

    那才是我啊。

    我怎麼可能想到，有一天我滿腦子只會期待著，哇，我過年最大的夢想是帶一個小娃娃去迪士尼樂園呢！這是進步還是退化呢？說實在的，雖然我滿足於有妳的幸福，但是我也付出了好多自由當代價。有了妳之後，我變了很多，從天空任我翱翔的鷹，變成一隻只要飛出去就急著想飛回家的鴿子，從猛獸變成了家禽，從野馬變成馴鹿。我媽今年內和我吃午飯的次數，比過去二十年的總和還要多。

    有妳之前，我從來不曾提議過家族旅遊。是的，我非常喜歡孤獨，也非常我行我素，我把所有時間都用在寫作和工作上，而且樂此不疲。我屬於全世界嚴重的工作狂，而且樂在其中。這一切，好像都因妳而變。

    對於一個探險過天涯海角的媽媽來說，我的寶寶，其實妳才是我最大的冒險。我變成我年少時未曾想像過的樣子，妳提醒我，生活中有許多被我忽略的東西，從前，我覺得它們很悶很煩，如今，我發現它們的滋味並不差。

    想盡責的爸媽都是鴿子。我已被妳馴養。我在苦笑，但也感謝妳。不過，總有一天，我還是會回復本性。等妳長大一點，在我還沒太老的時候，我還是要等著妳，牽著我的手去旅行。南極的孤獨，我已經自己去享受過，北極，我就等妳一起，我們要去看阿拉斯加的熊怎麼捕鮭魚。

    這麼想時，我的心境仍如昔日作夢的少女。

    （出自 吳淡如 樂觀的孩子才好命）'
