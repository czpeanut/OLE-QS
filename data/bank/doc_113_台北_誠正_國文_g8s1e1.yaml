- id: doc_113_台北_誠正_國文_g8s1e1_s2_36
  section: 2
  number: 36
  type: single
  page: 3
  stem: 本篇文章的主題為何？
  options:
  - label: A
    content: 強調自立更生、自立自強的重要性
  - label: B
    content: 強調與人為善、廣結善緣的重要性
  - label: C
    content: 強調孝順尊長、本性良善的重要性
  - label: D
    content: 強調外在名聲、世俗眼光的重要性
  group_stem: '董 永

    漢 董永，千乘人。少偏孤➀，與父居，肆力➁田畝，鹿車➂載自隨。父亡無以葬，乃自賣為奴，以供喪事。主人知其賢，與錢一萬，遣之。永行三年喪畢，欲還主人，供其奴職。道逢一婦人曰：「願為子妻。」遂與之俱。主人謂永曰：「以錢與君矣。」永曰：「蒙君之惠，父喪收藏。永雖小人，必欲服勤致力，以報厚德。」主曰：「婦人何能？」永曰：「能織。」主曰：「必爾者，但令君婦為我織縑➃百疋➄。」於是永妻為主人家織，十日而畢。女出門，謂永曰：「我，天之織女也。緣君至孝，天帝令我助君償債耳。」語畢，淩空➅而去，不知所在。

    注釋

    ➀偏孤：年幼時母親死亡。

    ➁肆力：盡力。

    ➂鹿車：古代的一種小車。

    ➃縑：細緻的絹絲。

