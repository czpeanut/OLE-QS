- id: doc_113_台北_誠正_國文_g8s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 下列有關田園之秋選的寫作手法分析，何者正確？
  options:
  - label: A
    content: 面對不同的自然現象，人的反應也不同：滿天烏雲使人膽破魂奪、雷電交加使人氣脫委頓、在雨水的澆淋下使人漸漸蘇醒
  - label: B
    content: 西北雨的出場順序是：雷電交加→滿天烏雲→大雨滂沱→雨過天青
  - label: C
    content: 西北雨像戲劇，其序幕、主戲、結局分別為大雨滂沱、惡魔與妖巫之出世、雨過天青
  - label: D
    content: 以「人」為主角，「西北雨」為配角
  lesson_raw:
