- id: doc_113_高雄_鼎金_國文_g7s1e2_s3_8
  section: 3
  number: 8
  type: single
  page: 1
  stem: 晨讀時，老師發下一篇名為生命是一種長期而持續的累積過程的文章。如果從題目去預想文章內容，下列文句，何者最不可能出現在文章中？
  options:
  - label: A
    content: 我們唯一該關切的是自己真實的累積過程，而不是一時順逆的際遇
  - label: B
    content: 僥倖考上的人畢竟仍舊只是僥倖考上，一時失閃的人也不會因為單一的事件而前功盡棄
  - label: C
    content: 我不是沒有過困境，而是被常人當做「困境」的境遇，我都只當作一時的際遇，不曾在意過而已
  - label: D
    content: 真正的朋友，在你獲得成功的時候，為你高興。在你遇到不幸或悲傷的時候，會給你及時的支持和鼓勵。
  tags:
    chapter:
      publisher: 康軒
      book: 七上
