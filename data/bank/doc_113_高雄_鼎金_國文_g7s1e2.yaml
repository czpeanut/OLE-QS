    \  陶淵明的理想是種田養雞的農業社會，這也是他選擇的生活方式，但問題就出在他的身體實在很差：「躬耕自資，遂抱羸疾。」此外，他的農作技術也很差：「種豆南山下，草盛豆苗稀。」\n\
    \  硬要實踐沒有能力完成的夢想、硬要捨棄可以輕鬆得到的職位與薪資，不讓自己被束縛在討人厭的地方，並且近乎痴愚的抗拒生活的壓力，更不讓自己被社會局限在一種價值之中，以及頑固的守護心靈的純淨。\n\
    （改寫自厭世國文老師 厭世廢文觀止 陶淵明的理想國）"
