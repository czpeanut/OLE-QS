  group_stem: '孔子東游，見兩小兒辯鬥。問其故。一兒曰：「我以日始出時去人近，而日中時遠也。」一兒以日初出遠，而日中時近也。一兒曰：「日初出，大如車蓋（１）；及日中，則如盤盂（２）。此不為遠者小而近者大乎？」一兒曰：「日初出，滄滄涼涼；及其日中，如探湯（３），此不為近者熱而遠者涼乎？」孔子不能決也。兩小兒笑曰：「孰為汝多知乎？」（列子
