  group_stem: "陶淵明任職彭澤令時，曾經擁有公家發配的一塊田地。根據宋書 隱逸傳記載：「公田悉令吏種秫稻，妻子固請種粳，乃使二頃五十畝種秫，五十畝種粳。」\n\
    \  秫是高粱，粳是稻米，陶淵明本意是要將全部的田地拿來種可以釀酒的高粱，是在老婆的勸阻下，才勉為其難改成只用六分之五的田地種高粱就好。這等於是一個月薪三萬的男人，只願意拿出五千塊養家，剩下的全部買酒喝，更何況陶淵明原本連那五千塊都不肯拿出來作為家用。\n\
    \  一個人養活自己與家庭需要基本的開銷，但陶淵明似乎把工作視為極大的負擔，三不五時就向單位裡的長官遞辭呈。\n  如果是這樣的工作態度，再加上愛喝酒的習慣，那麼陶淵明完全是一名拒絕上班的酗酒無業男子，值得通報社會局介入關心與調查。通常學生聽到陶淵明的日常生活後，會先痛罵他是不負責任的丈夫和父親，接著才能慢慢理解：______，是一件多麼不容易的事。\n\
    \  他只不過是想逃離醜陋的政治與狡詐的社會，嚮往安穩平凡的田園生活，過著規律的農家日常。只要能夠安心種田，即使種得很爛，依舊快樂，這樣的日子就是桃花源。\n\
    \  陶淵明的理想是種田養雞的農業社會，這也是他選擇的生活方式，但問題就出在他的身體實在很差：「躬耕自資，遂抱羸疾。」此外，他的農作技術也很差：「種豆南山下，草盛豆苗稀。」\n\
    \  硬要實踐沒有能力完成的夢想、硬要捨棄可以輕鬆得到的職位與薪資，不讓自己被束縛在討人厭的地方，並且近乎痴愚的抗拒生活的壓力，更不讓自己被社會局限在一種價值之中，以及頑固的守護心靈的純淨。\n\
    （改寫自厭世國文老師 厭世廢文觀止 陶淵明的理想國）"
