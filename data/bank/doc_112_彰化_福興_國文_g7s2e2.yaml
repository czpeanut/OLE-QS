- id: doc_112_彰化_福興_國文_g7s2e2_s5_1
  section: 5
  number: 1
  type: single
  page: 4
  stem: 下列文句，何者沒有點出季節？
  options:
  - label: A
    content: 蟬叫最盛的時候
  - label: B
    content: 七月流火，確實是
  - label: C
    content: 這哪叫開花？這是燃燒
  - label: D
    content: 西風唱起，鳳凰花落了一地。
  group_stem: '不是鳳凰，是樹，是一種在炎夏時節看過一次就終生忘不了的大樹。

    蟬叫最盛的時候，嘉南平原以南的天空，全得讓給鳳凰樹。鳳凰樹不曾跟誰客氣過，它迎著火辣辣的豔陽伸展，攔也攔不住。

    七月流火，確實是。沒幾天前才見到金龜子爬在鳳凰花苞上，突然間花苞都張開一半了；沒幾天後抬頭一看，天，這哪叫開花？這是燃燒！片片點點的綠，大塊大塊的紅，一樹火紅，燒得晴空更藍更高了，燒得停雲更白更亮了，燒得人心慌慌了，怎麼辦好呢？這火海燒得如此理直氣壯！

    不講理的燃燒，整整一個七月，那是難得形容的壯烈，決然不肯妥協的壯烈，雷打不掉的雨流不去的壯烈。雨來最好，沖走灰塵之後，綠的更綠，紅的更紅，搭配水珠的晶亮，足以搶走原本落在美麗少女身上的眼光。

    西風唱起，鳳凰花落了一地，撲簌簌的掉，不必傾耳就聽得著。心疼的不是稀疏可見的枝椏，是那樹下相疊的殘英。西風緊了，落紅逐漸轉褐，與泥土一般顏色，黃葉細細密密的伴著它，繁榮在一起，凋零在一起，義士的情懷。〈阿盛
    鳳凰樹〉'
