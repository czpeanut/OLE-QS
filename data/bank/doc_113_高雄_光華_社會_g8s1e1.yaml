- id: doc_113_高雄_光華_社會_g8s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 中國農業社會與北方草原民族常有互動，隨著北方草原民族持續南遷的形式不同，胡漢關係備受挑戰。西元 311 年，北方匈奴人南下，攻陷西晉首都，爆發永嘉之禍，逼迫原來在黃河流域的漢人往南遷移，大批漢人遷往南方，此遷移對南方產生什麼影響？
  options:
  - label: A
    content: 大批人口進入南方，造成糧食缺少與饑荒
  - label: B
    content: 中國經濟重心由黃河流域逐漸往南方的長江流域
  - label: C
    content: 漢人帶來進步農耕技術，造成胡漢因爭奪土地空間發生衝突
  - label: D
