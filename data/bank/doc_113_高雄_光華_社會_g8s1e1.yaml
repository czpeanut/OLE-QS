- id: doc_113_高雄_光華_社會_g8s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 經過數百年的征戰兼併之後，秦始皇最終滅六國，統一天下，他自認「德兼三皇，功過五帝」 ，他的作為開創了有別於商周時期的政治制度，為當時及後世帶來極深刻的歷史意義。請問：下列敘述何者較符合秦始皇的描述？
  options:
  - label: A
    content: 確立中央集權的政治體制
  - label: B
    content: 為了穩固國家權力，積極分封宗族子弟
  - label: C
    content: 因興修長城、宮殿與陵墓等大型工程，促成經濟發達
  - label: D
    content: 推行統一制度，造成多數人不便，迫使群眾揭竿而起。
