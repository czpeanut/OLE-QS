- id: doc_113_台南_復興_國文_g9s1e2_s4_3
  section: 4
  number: 3
  type: single
  page: 7
  stem: 根據上文，下列有關攝影師的敘述，何者最恰當？
  options:
  - label: A
    content: 攝影師須與拍攝對象建立起彼此的信任與默契後，才能進行拍攝
  - label: B
    content: 攝影師只能在公共場所進行拍攝，以避免過度的暴露他人的隱私
  - label: C
    content: 攝影師須顧及拍攝對象的感受，並且相對客觀地呈現攝影的主題
  - label: D
    content: 攝影師的主觀成分須儘量彰顯，方能呈現攝影過程中鮮明的概念
  group_stem: '我們很容易分辨一個人是善意地欣賞美女，還是戴著有色眼鏡在眈視對方。眼神會洩露一個人的心思意圖，善意的眼光會被接納，甚至令對方愉悅；而戴著顏色的窺視，則會觸怒別人，或引起恐懼。但是當我們用相機看人時，不管你的心思意圖如何，這種透過觀景窗的觀看行為，就是一種侵犯的舉止，因為拿相機的人企圖把看到的東西，變成自己的私有物。

    攝影對人類文明所產生的諸多影響中，以這種「觀看倫理」的變革最為深遠。一個人的隱私範疇也因相機的產生而和以前截然不同。在昔日，也許一位名人的小動作或某些癖性，只有他最親近的家人、朋友會知道，而現在則成了眾所周知的特徵。

    相機不但使人與人之間的觀看方式徹底的改變了，也使每個人的生活、心理空間非得騰出一大部分變成「公共場所」不可。拍照的人不但要進入被攝者的這一個「公共場所」裡，掘起別人某一種度的隱私，而也要在自己的內裡騰出更大的空間，容納這些取諸不同對象的「私有物」。

    以這個角度來看，攝影是一種赤裸裸的交談方式，手執相機的人，只要稍微疏忽就極容易使被攝者受到傷害；攝影家的意圖不稍加約制的話，就極容易完全掩蓋了對象的意義。

    有一個比喻是十分恰當的——「攝影」要擷取的是對象的影子，攝影家同時也承擔打光源的工作，影子隨著光源的遠近和角度的不同，而顯現出不一致的形狀、大小。不管打光的手法有多少種，但有一點是絕對不能逾距的——那就是攝影家絕對不能用自己的身軀把光線完全擋住，不使它投照在對象上。換句話說，攝影是絕對無法完全主觀的，就如同它不能絕對客觀一樣。完全客觀則談不上是藝術，完全主觀則談不上是攝影。

    攝影的倫理，就是建立在「看」的道德上。我們該怎麼「看」對象，我們又在對象上「看」到多少自己的影子，「看」到多少人間的冷暖，「看」到多少世事的無常，「看」到多少不變的道理。不管怎麼「看」，我們是絕對不該在第一眼時就把對象觸怒了，也不該用偽裝的眼神欺騙對象，更不該用侵占的方式，用眼色凌辱對象。

    相機是「發明」的工具，不是「生產」的裝備，攝影家是在對象上發現使自己信服的真理，__________。

    節錄自阮義忠〈觀看的道德〉'
