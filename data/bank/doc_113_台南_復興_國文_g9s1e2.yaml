  - label: D
    content: 經過這個事件，孔子的十位弟子們辭別回家的有三人
  group_stem: '孔子行，聞哭聲甚悲。孔子曰：「驅！驅！前有賢者。」至則皋魚也。被褐擁鐮，哭於道旁。孔子辟車與之言曰：「子非有喪，何哭之悲也？」

    皋魚曰：「吾失之三矣：少而學，遊諸侯，以後吾親，失之一也；高尚吾志，閒吾事君，失之二也；與友厚而小絕之，失之三矣！樹欲靜而風不止，子欲養而親不待也。往而不可追者，年也；去而不可得見者，親也！吾請從此辭矣！」立槁而死。

    孔子曰：「弟子誡之，足以識矣！」於是，門人辭歸而養親者，十有三人。'
