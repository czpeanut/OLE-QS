  options:
  - label: A
    content: 投票年齡由年滿20歲改為年滿18歲，擴大公投參與範圍
  - label: B
    content: 通過方式由雙二一門檻改為簡單多數決，提高了投票意願
  - label: C
    content: 新法將公投的認定改由中選會審核，提高了公投的公平性
  - label: D
    content: 新法調降提案及連署人數的門檻，使公提案變得容易成案
  group_stem: '國文課教到〈孟子選讀〉，小興對孟子「民貴君輕」的主張印象深刻，連帶著，也對「公投」這項民主活動深感興趣。她從2018年的眾多公提案中，挑選5則性平相關的案件，作為課堂報告的主題。此報告提供3部分資料：甲、公投法舊與新。乙、性平公提案內容。丙、性平公提案結果。


    甲、公投法舊與新（此新法於2017.12.12通過）


    | 項目 | 舊法 | 新法 |

    | :--- | :--- | :--- |

    | 全國性公投適用項目 | 法律複決、立法原則創制、重大政策之創制或複決、憲法修正案複決 | 法律複決、立法原則創制、重大政策之創制或複決，條文新增「依憲法規定外」，及修憲、領土變更案等回歸憲法增修條文規定
    |

    | 提案門檻 | 最近一次總統副總統選舉人總數千分之5 | 最近一次總統副總統選舉人總數萬分之1 |

    | 成案門檻 | 最近一次總統副總統選舉人總數5% | 最近一次總統副總統選舉人總數1.5% |

    | 通過 | 雙二一門檻：投票人達投票權人總數1/2以上，且有效投票數超過1/2以上同意 | 簡單多數決：有效同意票多於不同意票，且同意票達投票權人總額1/4以上
    |

    | 投票年齡 | 中華民國國民年滿20歲 | 中華民國國民年滿18歲 |

    | 公投事項之認定 | 由公民投票審議委員會認定 | 廢除公投審議委員會，全國性公投由中選會審核 |

    | 不在籍投票 | 無相關規定 | 全國性公投得不在籍投票，實施方式另以法律定之 |


