  group_stem: '昔者楚丘先生，行年七十，披裘帶索①，往見孟嘗君，欲趨不能進。孟嘗君曰：「先生老矣，春秋高矣，何以教之？」楚丘先生曰：「噫！將②我而老乎？噫！將使我追車而赴馬乎？投石而超距③乎？逐麋鹿而搏豹虎乎？吾已死矣！何暇老④哉？噫！將使我出正辭而當諸侯乎？決嫌疑而定猶豫乎？吾始壯矣，何老之有？」孟嘗君逡巡⑤避席，面有愧色。《詩》曰：「老夫灌灌⑥，小子蹻蹻。」言老夫欲盡其謀，而少者驕而不受也。秦穆公所以敗其師，殷紂所以亡天下也。故《書》曰：「黃髮之言，則無所愆⑦。」

    注：①披裘帶索：形容衣著粗陋。 ②將：抑、或是、還是。表示列舉後有所選擇。 ③超距：跳躍。 ④何暇老：哪有空閒時間變老。 ⑤逡巡：古人席地而坐，表示尊敬時，會離座而起。
    ⑥灌灌：誠懇的樣子。 ⑦愆：音ㄑㄧㄢ，過錯。

    節錄自劉向《新序·雜事》'
