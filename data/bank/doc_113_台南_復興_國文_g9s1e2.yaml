- id: doc_113_台南_復興_國文_g9s1e2_s4_8
  section: 4
  number: 8
  type: single
  page: 9
  stem: 這封信的主旨為何？
  options:
  - label: A
    content: 介紹幾位作家的寫作風格
  - label: B
    content: 評論孔子與蘇軾讀書方式的不同之處
  - label: C
    content: 說明讀書時應具備的態度
  - label: D
    content: 比較《史記》與其他文學作品的差異
  group_stem: '讀書以過目誦為能，最是不濟事。

    眼中了了①，心下匆匆，方寸無多，往來應接不暇，如看場中美色，一眼即過，與我何與也。千古過目成誦，孰有如孔子者乎？讀《易》至韋編三絕，不知翻閱過幾千百遍來，微言精義，愈探愈出，愈研愈入，愈往而不知其所窮。雖生知安行②之聖，不廢困勉下學③之功也。東坡讀書不用兩遍，然其在翰林④讀〈阿房宮賦〉至四鼓，老吏苦之，坡灑然不倦。豈以一過即記，遂了其事乎！惟虞世南、張睢陽、張方平，平生書不再讀，迄無佳文。

    且過輒成誦，又有無所不誦之陋。即如《史記》百三十篇中，以〈項羽本紀〉為最，而〈項羽本紀〉中，又以巨鹿之戰、鴻門之宴、垓下之會為最。反覆誦觀，可欣可泣，在此數段耳。若一部《史記》，篇篇都讀，字字都記，豈非沒分曉的鈍漢！更有小說家言，各種傳奇惡曲，及打油詩詞，亦復寓目⑥不忘，如破爛廚櫃，臭油壞醬悉貯其中，其醯醢⑦亦耐不得。

    注：①了了：清楚、明白。 ②生知安行：不用學習而懂得道理，從容不迫地實行。 ③困勉下學：刻苦勤奮地學習人情事理的基本常識。 ④翰林：皇帝的文學侍從官。這裡指翰林院。
    ⑤灑然：暢快的樣子。 ⑥寓目：觀看、過目。 ⑦醯醢：不乾淨，這裡有品位低俗的意思。

    鄭燮〈濰縣署中寄舍弟墨第一書〉'
