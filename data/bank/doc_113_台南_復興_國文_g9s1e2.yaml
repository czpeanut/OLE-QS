  section: 3
  number: 29
  type: single
  page: 5
  stem: 依據上文，關於尋找靈感的來源，不包括下列何者？
  options:
  - label: A
    content: 先天資質
  - label: B
    content: 後天力學
  - label: C
    content: 閉門苦思
  - label: D
    content: 觀察聯想
  group_stem: '靈感也就是古人所謂的「興」（觸發）。

    一個在現實生活裡感性豐沛又敏於思考的人，靈感躍出之次數，當較常人為多而且活潑。尋找靈感，可從先天才與後天苦學兩大層面來談。本質上燃不起心靈火焰的人，不可能自平凡事物中釀出美的蜜汁；但若只憑二三機巧，不學即妄圖逕強，詩興也容易單薄、枯竭，無法突破時空限制、匯流出源源不絕的創作力。

    詩人如何誘發偉大的靈感呢？倚柱即興歷史悲情、看花則聞美人嘆息的敏銳，只能算是一個基礎。在此基礎上，平日還須強力集中意識廣泛觀察並作聯想。李賀騎弱馬、背古錦囊以及陳師道閉門擁被覓句的行徑，顯示古代詩人為了強力集中意識所下的苦功。

    節錄自陳義芝〈詩與靈感〉'
