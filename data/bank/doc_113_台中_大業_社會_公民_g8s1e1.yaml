  stem: '今年是美國的總統大選年，由共和黨川普與民主黨賀錦麗競逐總統大位，誰能當選，則該所屬政黨將成為執政黨並組織政府。右表是美國近年來總統所屬政黨的整理。請從國家與政府的關係判斷，下列何者最適合說明表中內容正確？


    | 屆數 | 總統 | 所屬政黨 |

    | --- | --- | --- |

    | 第56~57 屆 | 歐巴馬 | 民主黨 |

    | 第58 屆 | 川普 | 共和黨 |

    | 第59 屆 | 拜登 | 民主黨 |'
  options:
