- id: doc_113_台中_大業_社會_公民_g8s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '根據右列內容判斷，科索沃在受聯合國及北大西洋公約組織聯合託管期間，仍不屬於完整的國家，最主要原因是因為他缺少國家的那些構成要素？


    **科索沃獨立建國**

    科索沃名義上只是塞爾維亞的一省，自1999 年科索沃戰爭結束以來，由聯合國和大西洋公約組織聯合託管。聯合國在科索沃地區設立聯合國科索沃代表團，負責管理該地的法律與政治秩序，並協助該地逐漸轉型為民主的自治政府。直到2008
    年2 月17 日自行通過獨立宣言，宣佈脫離塞爾維亞，現已得到109 個國家的承認。'
  options:
  - label: A
    content: 領土、人民
  - label: B
    content: 人民、主權
  - label: C
    content: 政府、主權
  - label: D
    content: 政府、領土。
