  stem: 座落在加勒比海上的波多黎各，早期是西班牙的殖民地，但1898 年美國擊敗西班牙，波多黎各就成為了美國的屬地。而在1917 年，也正式承認波多黎各人具有美國公民的身份。由上文可以推論關於波多黎各人民的國籍取得，下列何者說明正確？
  options:
  - label: A
    content: 波多黎各人都以歸化方式取得美國國籍
  - label: B
    content: 因為波多黎各屬於美國領土，依據屬地主義取得國籍
  - label: C
    content: 波多黎各人出生就是美國人，無關乎屬人或屬地主義
  - label: D
    content: 因為波多黎各人的祖先是美國人，依據屬人主義取得國籍。
