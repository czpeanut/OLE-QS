  options:
  - label: A
    content: 我國以屬人主義為主，因此夏天擁有中華民國的國籍
  - label: B
    content: 我國以屬人主義為主，因此夏克立先生永遠都不可能擁有中華民國國籍
  - label: C
    content: 我國為屬地主義，夏克立先生非出生在此，不可能有中華民國國籍
  - label: D
