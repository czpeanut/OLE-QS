    content: 政府享有主權，不會因選舉結果而轉移
  - label: B
    content: 政府並非永久性整體，會因選舉而更替
  - label: C
    content: 更換執政黨代表國家滅亡並成立新國家
  - label: D
    content: 國家範圍較廣，組成要素之一包含政府。
