- id: doc_113_高雄_七賢_英語_g9s2e1_s2_23
  section: 2
  number: 23
  type: single
  page: 2
  stem: ( ) 23. What is the article mainly about?
  options:
  - label: A
    content: The sound that insects make.
  - label: B
    content: A mosquito with no smell.
  - label: C
    content: Female animals that bite.
  - label: D
    content: A bug that eats blood.
  group_stem: 'Buzz, buzz, buzz--- that’s the sound you hear when a mosquito flies
    around your ears. Mosquitoes are little bugs, and they put most people on edge.
    That’s because they don’t want the insects to bite them.

    Not all mosquitoes bite people and drink their blood, though. Only the females
    of some types do that. When those females need to feed, it’s usually when there’s
    very little light out. Then, they use their sense of smell to find their hosts.
    They look for CO2, blood, and other smells. Also, they are more likely to bite
    people with type O blood, high body heats, and lots of bacteria on their skin.

    It’s hard to avoid mosquito bites. However, if you really can’t stand them, you’ll
    have to move to Iceland or Antarctica. Those places are free from mosquitoes.

     mosquitoes 蚊子 bacteria 細菌 Antarctica 南極洲'
  shared_asset: g2_23_25
