  group_stem: 'Today, fast food restaurants are using ordering machines to take over
    the jobs of human clerks. When you go to a McDonald’s, for example, you may see
    customers using these machines to order food and pay. Some like the machines,
    but others may have a hard time using them.

    One of the best things about ordering machines is that they are always fast and
    ready to take orders. Customers can quickly order their meals, and the kitchen
    can receive the orders right away. That saves customers the trouble of waiting
    in long lines during busy hours.

    On the other hand, there are times when ordering machines are not as helpful as
    human clerks. Some people say that they had trouble when they used the machines
    for the first time. For example, they couldn’t find the items they wanted while
    they were ordering. In the end, they had to turn to a human clerk for help.

    Although ordering machines are not perfect at the moment, they are becoming more
    and more user-friendly with the help of technology. What’s more, they make fast
    food even faster. Customers wait for a shorter time, and restaurants can take
    more orders. Sounds like a win-win for both sides, doesn’t it?'
