  group_stem: 'In the past, people only had one name. It told others their identity.
    That worked when places had few people. However, when the places grew, more people
    had the same names. It was hard to keep track of everyone. So, people started
    to use last names.


    One of the earliest places to use last names was China. Over three thousand years
    ago, people took their family names. First, children took their mothers’ family
    names. Now, they take their fathers’ family names. That’s the same in other places
    around the world today.


    Last names didn’t appear in Europe until the Middle Ages. The names were quite
    simple, and they came from different areas. There were four main groups of last
    names. They were about a person’s father, job, location and nickname.


    With the first group, the last names showed the people as their fathers’ children.
    For example, Richard’s daughter was Hailey. So, her full name would become Hailey
    Richards. In almost the same way, Jack’s son was Steve. He would become Steve
    Jackson.


    Job names showed people’s jobs. Andrea baked bread in a bakery. That would make
    her last name Baker. Also, location names showed people where they live. So, Sara
    York was probably born and lived in the town of York.


    People’s nicknames often described their sizes or personality. For example, John
    Little was probably a little man, and Tom Smiley probably smiled a lot. Aren’t
    last names fun? They can tell us a lot about people.

     identity認同 keep track of… 了解… location 地點'
