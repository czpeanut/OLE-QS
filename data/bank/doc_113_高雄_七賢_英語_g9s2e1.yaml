  group_stem: 'Beitang Fish Harbor was still a small fishing village in which about
    3,100 people lived 40 years ago. When visitors found the fish at Beitang Fish
    Harbor were much cheaper and fresher, it became one of their favorite places on
    holidays. More and more people liked either getting some fish back or eating at
    Beitang. More people mean more chances to make money. Businessmen started to move
    into Beitang since 1986. The population (all the people living in Beitang) grew
    every year, and it was 4,200 at the end of 2001. Restaurants and shops were always
    filled with visitors on holidays.


    However, in 2003, some villagers found parking was not as difficult as it was
    before. Then, the business got worse and worse year by year. Villagers started
    to move out of Beitang in 2006. At the end of 2020, there were less than 3,000
    people living in Beitang. Interestingly, more and more people liked going to another
    small harbor, Hotang, which was near Beitang, on holidays. Steve and several owners
    of the restaurants in Beitang decided to go there to find the reasons.


    They had a talk with the visitors in Hotang if they had chances. The visitors
    told Steve and his friends the fishes in Hotang were cheaper and the dishes were
    more delicious. Besides, one more thing caught Steve’s eye. There were always
    some people looking around and picking up trash. That did surprise Steve and his
    friends. “Actions have to be taken for Beitang.” they said.

     Harbor 港口'
