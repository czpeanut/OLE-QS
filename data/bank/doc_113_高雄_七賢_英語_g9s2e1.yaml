- id: doc_113_高雄_七賢_英語_g9s2e1_s2_32
  section: 2
  number: 32
  type: single
  page: 5
  stem: ( ) 32. What is “trend”?
  options:
  - label: A
    content: Something that is very expensive.
  - label: B
    content: Something that you can’t live without.
  - label: C
    content: Something that is popular at the time.
  - label: D
    content: Something that you have problems with.
  group_stem: 'With the rise of social media, FOMO is becoming more and more common.
    FOMO stands for “fear of missing out.” It is a worry that others are having more
    fun, living better lives, or experiencing better things than you are. For example,
    you feel sad when your friends are chatting excitedly about a new movie you haven’t
    seen.

    FOMO can create some problems. It may lead to Internet addiction. Because you
    don’t want to miss out on things, you’ll keep checking social media. What’s more,
    FOMO can cause attention problems. When you check your phone every five minutes,
    it’s hard to focus. FOMO can also cost you money. Because you want to do what
    everyone is doing, you follow the latest trend, like eating at an Internet-famous
    restaurant or buying a video game everyone is playing. In the end, you spend more
    money on things you don’t need.

    How do you stop FOMO? One simple way is to just take a break from social media.
    Turn off your phone or computer. Also, stop focusing on what you don’t own. Live
    in the moment and enjoy life.

    FOMO happens to almost everyone. However, you have the power to stop it. Change
    a letter and go from FOMO to JOMO (joy of missing out).

     Internet addiction 網路成癮'
