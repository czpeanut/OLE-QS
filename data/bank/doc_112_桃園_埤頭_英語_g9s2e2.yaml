    content: AI might become too powerful for humans to understand.
  - label: B
    content: AI could be used as a weapon and might not be controlled by humans.
  - label: C
    content: AI can solve problems more easily than humans.
  - label: D
    content: Many people will lose their jobs because of AI.
  group_stem: "A report made for the U.S. government has warned that artificial intelligence\
    \ (AI) could be a big danger to humans. The report talks about the worst things\
    \ that could happen, including the end of human life. It says that AI could be\
    \ used as a weapon and could become too strong for people to control. This could\
    \ cause big problems for national security. The report suggests that the U.S.\
    \ government needs to act fast and take control of AI.\n    The report is 247\
    \ pages long. It was made by a company that knows a lot about AI. The company\
    \ talked to experts at AI companies like OpenAI, Google DeepMind, and Meta to\
    \ write the report. The report says that AI could make the world less safe, like\
    \ when nuclear weapons were first made. The report recommends creating a new government\
    \ agency to watch over AI companies and control how quickly AI grows. The report\
    \ also suggests that the government should put a limit on how much computing power\
    \ an AI can have. It should be illegal to share the code for very powerful AI\
    \ models. Futurism.com, a website, talked about that over half of the AI scientists\
    \ who were asked about this said there is a five percent chance that AI could\
    \ lead to human extinction or other very bad results.\n\U0001F4D6 warn: 警告 security:\
    \ 安全 recommend: 建議 nuclear weapon: 核子武器 government agency: 政府機構 illegal: 非法的 computing:\
