  group_stem: "A company in Japan has created a special booth where people can take\
    \ naps while standing. The company, Koyoju Plywood Corporation, made these booths\
    \ to help office workers and commuters get some rest without needing a bed. The\
    \ booth is called \"Giraffenap,\" and it lets you sleep in a vertical position,\
    \ just like a giraffe stands tall. The Giraffenap booth is good for people who\
    \ work long hours or travel a lot. The company says that a short nap, like 20\
    \ minutes, can make you feel less tired and help you work better. It can also\
    \ help you remember things. These nap booths will be sold for around $20,000 each.\n\
    \    There are two types of Giraffenap booths. One looks modern and is called\
    \ \"Spacia.\" The other is made of wood and is called \"Forest.\" The booth is\
