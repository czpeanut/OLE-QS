- id: doc_112_桃園_平南_英語_g9s2e1_s6_44
  section: 6
  number: 44
  type: single
  page: 4
  stem: 44. （ ）What can be inferred about what happens to humor as we grow up? 📖 infer
    推論
  options:
  - label: A
    content: The older we are, the more important humor becomes.
  - label: B
    content: We become funnier people as we grow older.
  - label: C
    content: The things we find funny as kids don’t make us laugh when we get older.
  - label: D
    content: As we grow up, we have more friends and have a better sense of humor.
  group_stem: "C.\nHaving a sense of humor is something most people think of as being\
    \ uniquely human. It is so important to us that we can already understand it when\
    \ we’re just babies. Humor makes us to laugh, and laughing helps build relationships\
    \ and brings people together.\n  A sense of humor can bring joy, help us be smarter,\
    \ healthier, and deal with difficult problems. It can also help us think outside\
    \ the box. It can teach us not to take things so seriously. It can also teach\
    \ us to laugh at ourselves. People who laugh a lot are not sad or sick very often,\
    \ neither are those who laugh with them. When the mind is healthy, so is the body.\n\
    \    Children who have a sense of humor seem happier.  Those who can appreciate\
    \ and share humor are also more sociable and usually have more friends. But most\
    \ of all, humor can make life really fun. There’s nothing quite like laughing\
    \ so hard that your stomach hurts or until tears are running down your face.\n\
    \    A sense of humor is not something we’re born with, though.  It is something\
    \ that we learn and grows with us. It also changes when we get older, much like\
    \ we do. Things that we find funny as kids become too childish to make us laugh\
    \ when we’re grown up. Babies, for example, don’t really understand humor yet.\
    \ They just laugh when something we do is funny to them. As children get older,\
    \ they turn to physical humor and doing funny things either to make themselves\
    \ or others laugh.\n   Having a sense of humor is an important part of growing\
    \ up.  Parents should show their kids early that laughing should be done a lot.\
    \  Make lots of jokes and tell funny stories. A family that laughs together has\
    \ lots of fun together!\n \n\U0001F4D6 uniquely human 專屬於人的/ relationship 人際關係/\
    \ appreciate 欣賞/ childish 幼稚的/ physical 肢體的"
