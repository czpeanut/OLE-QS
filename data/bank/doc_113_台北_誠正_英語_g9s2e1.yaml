  - label: D
    content: Life there is lonely and full of difficulties
  group_stem: 'Carl Johnson, who comes from Maryland, lives a life quite different
    from other people nearby there. For the past forty years, he has lived all by
    himself in a small hand-made boathouse by a lake. The nearest road from this boat
    is about a two-hour walk away. Because Carl’s boathouse is in a far away area,
    there’s no gas, electricity, or running water. He eats the fish he catches from
    the lake, and the vegetables he plants in the land. There is no bathroom in his
    boat, so he takes baths by swimming in the lake or washes his clothes in there.
