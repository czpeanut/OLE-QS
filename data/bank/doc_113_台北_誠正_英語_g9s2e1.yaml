  stem: What are nectar and pollen ?
  options:
  - label: A
    content: They are something in the flowers.
  - label: B
    content: They are small insects.
  - label: C
    content: They are small pets.
  - label: D
    content: They are something helpful for their flying.
  group_stem: 'Hummingbirds are tiny wonders of nature. Their wings move so fast –
    up to 80 times a second – that they can stay straight in the air, just like a
    toy drone. Their feathers shine with bright colors, turning them into little rainbows
    when the sunlight hits. They sip nectar from flowers using long, thin beaks, and
    this helps flowers make seeds by carrying pollen around. These busy birds need
    a lot of energy, eating half their weight in food each day. When night comes,
    they rest quietly after all that flying. Some hummingbirds travel over 2,000 miles
    to find warmer places in winter, a huge trip for something smaller than your hand.
    With quick moves and big energy, they’re much stronger than they look!

     tiny 微小的 wing 翅膀 feather 羽毛 sip 啜 beak 鳥嘴 huge 巨大的 tough 堅強'
