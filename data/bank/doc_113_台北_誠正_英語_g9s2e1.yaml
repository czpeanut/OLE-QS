- id: doc_113_台北_誠正_英語_g9s2e1_s3_48
  section: 3
  number: 48
  type: single
  page: 4
  stem: What can AI do in medicine ?
  options:
  - label: A
    content: Help doctors find diseases.
  - label: B
    content: Cook food for patients.
  - label: C
    content: Build hospitals.
  - label: D
    content: Teach doctors how to learn new information.
  group_stem: 'AI is helping doctors in many ways. It can find diseases, check health
    problems, and even help in surgeries. AI can look at medical pictures, like X-rays,
    faster and more correctly than humans. This helps doctors find diseases, like
    cancer, at an early time.

    One example of AI in medicine is chatbots. These are computer programs that can
    answer simple health questions, remind patients to take medicine, and tell them
    when to see a doctor. Another AI tool is robotic surgery, where AI helps doctors
    do difficult surgeries more easily and correctly. These new tools make medical
    care safer and better for everyone.

     disease 疾病 surgery 手術 medical 醫學的 X-rays X 光 cancer 癌症 patients 病患'
