- id: doc_113_台北_誠正_英語_g9s2e1_s3_44
  section: 3
  number: 44
  type: single
  page: 3
  stem: What is the passage mostly about?
  options:
  - label: A
    content: How to catch animals in Taiwan.
  - label: B
    content: Why mysterious animals are interesting.
  - label: C
    content: How to make up animal stories.
  - label: D
    content: Why scientists don’t like animals.
  group_stem: 'Have you ever heard of animals that sound too strange to be real? Around
    the world, people tell stories about mysterious creatures. Some say they’ve seen
    a giant snake longer than a bus or a bird that appears in the dark. Are these
    animals real, or just dreams?

    Long ago, people found bones of huge animals, like dinosaurs. They made up tales
    about dragons breathing fire. Today, scientists explore forests and oceans to
    find unusual creatures. In Australia, there’s a duck with a bill like a shovel—it’s
    called a platypus! In the deep sea, a fish with a light on its head tricks other
    fish to come close. These real animals sound like magic.

    In Scotland, people talk about Nessie, a long-necked monster in a lake. No one
    has caught it, but they keep looking for it. Finding these animals is hard. They
    might hide in dark places or move fast. Scientists use cameras and boats to hunt
    for signs.

    Do you feel these animals interesting, too ?

     mysterious 神秘的 creature 生物 bone 骨頭 dragon 恐龍 breathe 吐氣 shovel 鏟子'
  tags:
    textbook: 第六冊（九下）第1次段考範圍
