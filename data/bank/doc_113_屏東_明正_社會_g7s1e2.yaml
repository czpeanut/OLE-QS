  stem: '有一史料敘述如下: 「清廷攻下臺灣後，不少官員認為臺灣是未開發的彈丸荒地，對中國不但沒有價值，派員駐守還勞民傷財，只有施琅提出建言，強調臺灣物產豐富，且○○地位重要……大臣們經歷了八個月的爭論之後，康熙皇帝終於採納施琅的建議，將臺灣納入版圖」。請問：上述○○處應填入何選項最為恰當？'
