  stem: 一位基隆耆老說著當地曾發生的一段故事：「當時基隆原有居民一萬多人，不是搭船撤離，就是遁入山區協助清軍，市街頓時像是空城。不久，基隆被敵軍占領，港口遭到封鎖，茶葉、樟腦出口損失慘重，進口物資供應嚴重短缺，造成走私盛行，物價逐漸高漲，人們的生活秩序變了調，生活充滿不安與煩躁，情勢相當危急。」依照故事內容判斷，是因何事造成這種情形？
  options:
  - label: A
    content: 英法聯軍
  - label: B
    content: 日軍侵台
  - label: C
    content: 牡丹社事件
  - label: D
