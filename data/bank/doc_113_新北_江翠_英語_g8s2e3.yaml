  section: 5
  number: 31
  type: single
  page: 3
  stem: Which is NOT true?
  options:
  - label: A
    content: Some landslides move very fast.
  - label: B
    content: It’s safer to move to higher ground during a landslide.
  - label: C
    content: There is nothing we can do about landslides.
  - label: D
    content: Water is one of the causes of landslides.   cause 原因
  group_stem: 'Landslides: What You Should Know

    Landslides can be very dangerous. When they happen, they may damage houses, roads,
    rivers, and lakes. Here are some important facts about landslides.

    *What is a landslide?

    A landslide happens when a lot of earth and rocks slide down a hill or a mountain
    because of gravity. Some landslides move slowly, but others move very fast.

    *What causes landslides?

    Many things can cause landslides, like heavy rain, earthquakes, and deforestation.

    *Who should be careful?

    People who live near hills or mountains need to be careful. Dr. John Wilson, a
    landslide expert, gives some tips to stay safe:

    — Before a landslide: Think about what to do if a landslide happens.

    — During a landslide: If you are at home, move to the second floor. If possible,
    leave your house and go to a safer place.

    — After a landslide: Stay away from the area. Watch the news or check the Internet
    for updates.

    *How can we help prevent landslides?

    We cannot stop the weather, but we can still protect the land. For example, we
    should make better use of land. Also, save paper, and people will cut down fewer
    trees. Trees help hold water and stop the earth from moving during heavy rain.

     damage 損壞  gravity 地心引力  expert 專家  update 更新資訊  prevent 預防  protect 保護'
