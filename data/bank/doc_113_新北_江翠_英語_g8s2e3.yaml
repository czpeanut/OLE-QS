  group_stem: 'Stuff Yourself to Sleep

    Did you ever feel sleepy after eating a big meal? It’s called a food coma. A real
    coma is when a person does not wake up for a long time. But a food coma just means
    you feel very tired after eating.

    Why do people feel this way? When you eat a lot of food, your blood goes to the
    stomach to help with digestion. Then, less blood goes to the brain, so you feel
    sleepy.

    Foods with more fat and carbohydrates, like bread, rice, or cake, are more likely
    to cause a food coma. Fat slows down digestion. Sugar makes blood sugar go up
    fast and then drop. They both make people feel tired easily too.

    So, if you often feel sleepy after lunch or dinner, try eating less food or having
    healthier food like vegetables. That may help you stay awake and feel better during
    the day!

