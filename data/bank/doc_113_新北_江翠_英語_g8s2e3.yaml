  group_stem: "Table Manners\nDid you ever go to a formal dinner and feel unsure about\
    \ how to act at the table? Don’t worry! With a few simple tips, you can learn\
    \ good table manners and feel confident and polite.\nTABLE SETTINGS\nForks are\
    \ usually placed to the left of the plate, while knives and spoons are to the\
    \ right. Glasses are positioned above the knife, with the wine glasses to the\
    \ right of the water glass. On top of your plate, you’ll often see a small fork\
    \ and spoon. They’re only for dessert at the end of the meal. Napkins are usually\
    \ placed to the left of the plate or on top of the plate.\nWHERE DO YOU BEGIN?\n\
    The basic rule is: start from the outside and work your way in through each course.\
    \ The spoon on the far right is for soup, and the fork on the far left is for\
    \ salad. Then, as each course comes, you use the next set of tableware closer\
    \ to the plate.\nRESTING POSITIONS\nNow, here’s the cool part: tableware positions\
    \ can send messages!\n If you need to take a break, place your knife and fork\
    \ on your plate in an upside down V, like a triangle (in the European Style),\
    \ or put your knife across the top of the plate and your fork at the 4:20 position\
    \ (in the American style).\n If you finish eating, place your knife and fork\
    \ together at 12:00 or 4:20 on the plate.\nRULES FOR NAPKINS\nWhen you sit down,\
    \ place it on your lap. Never put it around your neck! If you need to leave for\
    \ a moment, politely excuse yourself and place the napkin on your chair. If you\
    \ are finished with the meal and not returning, fold the napkin loosely and place\
    \ it to the left of your plate.\nNow you know how to act at the table—just remember\
    \ these simple tips, and you’ll always make a great impression!\n manners 禮儀\
