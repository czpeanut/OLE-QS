  group_stem: 'The Secret of Geckos

    Do you ever think about walking up a glass wall like a gecko without falling off?
    Well, after studying the sticky secret of a gecko’s feet for a long time, scientists
    are now able to invent something similar to help people climb freely, and even
    stick and unstick heavy things on walls as well. This is just one example of biomimicry,
    copying from nature.

    But why are geckos able to climb up walls and to hang upside down? Do they really
    have sticky feet? No, their feet are not sticky at all. If you take a closer look
    at geckos’ skin, you can find the lines on their toes are covered with thousands
    of microscopic hairs called setae, which cannot be seen by human eyes. It is the
    structure of these setae that help scientists to understand why geckos can do
    these amazing things so easily. So, by copying the world around us, people’s lives
