- id: doc_112_彰化_福興_英語_g9s2e1_s7_5
  section: 7
  number: 5
  type: single
  page: 3
  stem: How many cows with fake eyes painted on their butts were killed by lions in
    Jordan's four-year study?
  options:
  - label: A
    content: '0'
  - label: B
    content: '14'
  - label: C
    content: '14.683'
  - label: D
    content: More than 2,000
  group_stem: '(2)

    Imagine that you are a farmer and keep hundreds of cows. However, large predators
    like lions come and eat your cows. What will you do to solve this problem?

    Many people would hunt those lions. This is what farmers in the Okavango Delta
    in Botswana used to do. They shot the lions with guns, but the problem did not
    go away. For many years, cows died because of lions, and lions died because of
    people. The number of lions in Africa has dropped from more than 100,000 in the
    1990s to lower than 30,000 in 2020.

    Luckily, an Australian biologist named Neil Jordan from the University of New
    South Wales came up with a smart idea to save both cows and lions—painting eyes
    on cow butts. In his four-year study, he followed over 2,000 cows at 14 different
    farms in the Okavango area. There were 683 with eye-painted butts, 543 with "X"
    painted on their butts, and 835 unpainted. The study showed that no cows from
    the butt-painted group were killed by lions.

    Jordan was not surprised. He knew before this study that lions usually give up
    their hunt if they think they''ve been spotted. Now, farmers in Botswana may not
    need to shoot lions ever again. Sometimes the best way to solve a problem is not
    to "kill" it but to understand it and "live" with it peacefully.


    📖 predator 肉食性動物 biologist 生物學家 spot 認出；發現 peacefully 和平地 Okavango Delta 歐卡萬哥三角洲
    Botswana 波札那'
