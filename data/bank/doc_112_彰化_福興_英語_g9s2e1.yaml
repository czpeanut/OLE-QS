  - label: C
    content: To fall in love with.
  - label: D
    content: To know better.
  group_stem: '(1.) Taboo Food

    Dear Jamie,

    I have a great time learning English in the USA with classmates who come from
    different countries.

    Today, in our English class, Mr. Wilson had us talk about what we eat or do not
    eat in our own country, and what I learned in this class was really interesting.
    Here are some examples. Teresa, who comes from India, said her family eat neither
    beef nor pork. They sometimes eat seafood or chicken. Jack, from Vietnam, used
    to eat dog meat, which he thought is a taboo food in many other countries in the
    world. Another girl from South Korea told us eating dog meat was also common in
    her country in the 1970s. But as more and more families keep dogs as pets, they
    have abandoned dog meat. Now fewer restaurants in her country serve dog meat dishes
    now.

    Jerry, who also comes from Vietnam, said rats and insects are also delicacies
    in his country. I can''t believe my ears! But then Mr. Wilson told us that one
    culture''s taboo food can be another culture''s delicacy. Though in the USA and
    other countries, Rats and insects are both taboo food, we should all try to understand
    and respect others'' culture.

    Love,

    Lucy


    📖 taboo 禁忌 serve 供應 delicacy 美食 respect 尊重'
