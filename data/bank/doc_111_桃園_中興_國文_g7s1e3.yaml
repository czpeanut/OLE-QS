- id: doc_111_桃園_中興_國文_g7s1e3_s2_29
  section: 2
  number: 29
  type: single
  page: 4
  stem: 下列何者適合做為此篇文章的標題？
  options:
  - label: A
    content: 善待陌生人，便是善待自己
  - label: B
    content: 年歲與閱歷，使我們的生命更精緻
  - label: C
    content: 停下奔忙腳步的那一刻，才是人生的開始
  - label: D
    content: 若有才華，就不怕沒機會。
  group_stem: "（四）\n    當我們小的時候，因為不瞭解自己，對於別人的看法和評價便非常在意，很怕自己不能受人喜歡，不能被人肯定。因此，我很願意多給孩子一些鼓勵，幫助他們發掘自我，肯定自我。\n\
    \    盛唐邊塞詩人高適有這樣兩句詩：「莫愁前路無知己，天下誰人不識君」，說的就是這樣一種情懷。他鼓勵真正的有才華的人，不必煩惱何時才能成名；不必煩惱自己的才華不被世人瞭解，如果是一顆夜明珠，便是身處暗室之中，也會發出璨然奪目的光采。\n\
    \    高適的仕宦之途並不順遂，在遊歷生活中，與李白、杜甫、王之渙等人結為好友，尤其是對於比他小九歳的杜甫，在詩方面的造詣，十分折服，將杜甫視為老師，常常講究詩的結構與技巧。直到五十歳之後，高適才努力學詩，而他的詩作立即呈現出純熟的風格，受到重視，中年以後，官運才漸漸亨通，受到了朝廷重用。\n\
    \    我們必須爭取每個可以充實自己的機會，因為我們要面臨的挑戰，是長長的一世人生，唯有準備好的人，在取得機會的鑰匙時，才能開啟那道成功之門。\n（人間好時節\
    \ 張曼娟）"
  tags:
    textbook: 第一冊（七上）第3次段考範圍
    labeled_by: ai
