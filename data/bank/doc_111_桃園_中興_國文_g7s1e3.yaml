- id: doc_111_桃園_中興_國文_g7s1e3_s2_32
  section: 2
  number: 32
  type: single
  page: 5
  stem: 本文作者認為人生的「每個階段都是無由規避」的原因為何？
  options:
  - label: A
    content: 人生原本就包含好幾個階段，實現夢想的人懂得面對每個階段的課題
  - label: B
    content: 人生階段的多寡和長短因人而異，這是無法選擇的宿命
  - label: C
    content: 每個人生階段的特色與任務都不一樣，選擇逃避只會對未來產生不良影響
  - label: D
    content: 人生階段的劃分毫無意義，「四」或「八」都只是一種粗略的分法。
  group_stem: "（五）\nＭ：\n  人有「系列性的自我」，也有「階段性的任務」。\n  日本的醫師作家日野原重明，著有《人生四季之美》一書，他以自然界的四季來比喻人生的四個不同階段，每個階段各有它不同的色彩、任務和美麗。精神分析學家艾力克森則將人生分成八個階段，每個階段都讓人面對一種新的情境，產生新的問題，需做出不同的抉擇。\n\
    \  其實，「四」或「八」都只是一種粗略的分法。人生，原本就含有好幾個階段，雖然多寡和長短因人而異，但每個階段都是無由規避的，一個真正想實現自己夢想的人，絕不會躁進，相反的，他們會耐心等候，樂於接受每個階段對其生命的洗禮。\n\
    \  譬如張愛玲，這位即使不是最好，也是相當傑出的中國現代小說家，很早就表現出她對寫作的興趣和才華。她在一篇徵文〈我的天才夢〉裡說，她七歲時就寫了一部刻畫家庭悲劇的小說，八歲時寫了一篇類似烏托邦的小說（快樂村）。十四歲時，更寫了一部令父親喜出望外、成名作家都要自嘆弗如的章回長篇小說《摩登紅樓夢》。\n\
    \  從事小說創作是張愛玲的「天才夢」。但張愛玲在就讀香港大學時（她原本考上倫敦大學，但因戰爭爆發，去不成英國，改到香港大學就讀），為了學好英文，她毅然割捨了對寫作的愛好，在香港大學三年，不僅沒寫小說，甚至沒用中文寫過任何東西，連給母親和姑媽的家書，都用英文寫。\n\
    \  為什麼如此決然？因為她認為在這個階段，學好英文是她最重要而且唯一的工作。三年的磨鍊，使她的英文一日千里，學業成績也名列前茅。\n  也正因為這樣，使張愛玲日後能直接用英文寫《秧歌》這部小說，讓英美人士讚嘆，也讓其他中國現代小說作家瞠乎其後。\n\
    \  在香港大學三年，雖然暫停寫作，但張愛玲對這個殖民地城市，特別是淪陷前後的人間百態，依然了了於心，只是她不急於傾吐。在經過一段時間的醞釀和反芻後，它們都成為她「下一個階段」精彩之作《傾城之戀》的素材。\n\
    \  羅馬不是一天造成的，而羅馬的雄偉和美麗，乃是來自它在每個歷史階段的遺跡積累而成。每個歷史階段的建築各有其不同的風格和功能，單獨來看，也許顯得單薄、甚至無趣，但卻都是形成羅馬最終之雄偉與美麗的基石。\n\
    \  人生的階段性亦復如是，每個階段各有它們的特色與任務。\n  夢想猶如一場豐盛的宴席，令人神往。但你不必急於赴宴，因為豐盛的宴席通常是在晚上才舉行，現在是你人生的早晨，是你為晚上豐盛的宴席準備材料的階段。\n\
    \                                                                            \
    \                       Ｗ上\n（蟲洞書簡‧階段性任務 王溢嘉）"
  tags:
    textbook: 第一冊（七上）第3次段考範圍
    labeled_by: ai
