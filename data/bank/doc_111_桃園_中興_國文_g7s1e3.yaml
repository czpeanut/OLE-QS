  section: 2
  number: 20
  type: single
  page: 3
  stem: 關於文中「涼殿」的描述，下列何者正確？
  options:
  - label: A
    content: 是唐玄宗專屬的避暑空間
  - label: B
    content: 是唐玄宗召見臣子，議論政策的地方
  - label: C
    content: 提供冰品給君臣吃飲的餐廳
  - label: D
    content: 用來治療熱衰竭病患的空間。
  group_stem: '(一)

    玄宗起①涼殿，拾遺陳知節上疏極諫，上令力士召對。時暑毒方甚，上在涼殿，座後水激扇車，風獵衣襟。知節至，賜坐石榻。陰霤②沈吟，仰不見日。四隅積水成簾飛灑，座內含凍。復賜冰屑麻節③飲。陳體生寒心慄，腹中雷鳴，再三請起方許，上猶拭汗不已。陳纔及門，遺洩狼籍，逾日復故。謂曰：「卿論事宜審，勿以己方④萬乘也。」

    （唐語林 豪爽）


    注譯

    ①起：建造。②霤：屋簷上流下的水。③冰屑麻節：用冰屑、雞蛋及冰糖製成的一種清涼飲料。④方：違背。'
  tags:
    textbook: 第一冊（七上）第3次段考範圍
    labeled_by: ai
