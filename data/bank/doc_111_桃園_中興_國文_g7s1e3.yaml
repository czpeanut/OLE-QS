- id: doc_111_桃園_中興_國文_g7s1e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 「友誼固然值得珍惜，但是不能『獨占』。我們自己固然希望有很多朋友，但是也得承認：你的朋友一樣也希望自己有很多的朋友。許多良好友誼的破壞，就是因為其中的一方想獨占。獨占的意思是：你既然是我的朋友，就不許再跟別人做朋友。這種獨占心理，不但會給自己帶來痛苦，也會給朋友帶來痛苦。我們應該培養一種開闊的心胸，很樂意看到自己所喜歡的朋友，除了你以外，還有許多朋友。」關於這段文字的分析，下列敘述何者最恰當？
  options:
  - label: A
    content: 獨占是一種自然而然的心理，在友誼上獨占鰲頭，方可成為人生的贏家
  - label: B
    content: 獨占是破壞友誼的元凶，應該樂見自己的朋友和他人也能夠成為好朋友
  - label: C
    content: 培養開闊的心胸，容易造成自己和朋友的痛苦，因為朋友不能夠被獨占
  - label: D
    content: 見到朋友交新朋友，自己也去結交更多新朋友，反正舊的不去新的不來。
  lesson_raw:
    title: 朋友相交
    basis: 引用朋友相交課文原句
  tags:
    textbook: 第一冊 朋友相交
    labeled_by: ai
