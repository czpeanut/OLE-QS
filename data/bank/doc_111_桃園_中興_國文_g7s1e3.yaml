  group_stem: "(二)\n    大腦是由上千億個神經細胞組成的，透過各種化學物質進行訊息傳遞，如血清素、正腎上腺素和多巴胺。運動能夠促進上述神經傳導物質分秘，強化神經之間的連結，增進學習效果並改善情緒。\n\
    \    現在我們了解運動還能提升大腦內號稱神奇肥料的蛋白質（ＢＮＤＦ），ＢＮＤＦ存在於掌管記憶與學習的海馬迴，可以促進神經細胞生長、增進神經細胞的功能，避免提早死亡。可以說，運動真正的目的是在讓大腦進入最佳的運作狀態，讓我們變得更聰明，心肺功能的強化與肌肉鍛鍊其實只是（\
    \    ）罷了。\n    美國伊利諾州的內帕維市最早推動「零時體育課」（第一節課前先進行有氧運動），在一萬九千名學生中，過胖人數降到百分之三，並且在ＴＩＭＳＳ（國際數學與科學教育成就趨勢調查）的測驗裡，拿下科學世界排名第一、數學世界排名第六的優異成績。\n\
    \    至於如何運動才是有效的？研究發現，每週兩到三次三十分鐘以上的慢跑，連續十二週，就能有效改善腦部的功能。此外，再結合一些需要運用協調或某些技巧的訓練或活動，例如球類運動、舞蹈、游泳或腳踏車，就更棒了！\n\
    （中學生報）"
  tags:
