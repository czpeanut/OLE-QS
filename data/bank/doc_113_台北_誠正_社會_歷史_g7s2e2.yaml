  group_stem: '題組三

    戒嚴時期的臺灣社會雖然政治氣氛嚴峻，但是仍有不少

    黨外雜誌在民間發行，傳遞自由民主的理念，比較知名

    的刊物早期有《自由中國》、《文星雜誌》；1970 年代

    以來則有《臺灣政論》、《美麗島雜誌》以及1984 年的

    《新潮流雜誌》。依據提示回答39~40 題'
