    | 區域 | 2000 年 | 2010 年 | 2020 年 | 2030 年（推估） |

    | --- | --- | --- | --- | --- |

    | 全球 | 46.7 | 51.7 | 56.2 | 60.4 |

    | 非洲 | 35 | 38.9 | 43.5 | 48.4 |

    | 亞洲 | 37.5 | 44.8 | 51.1 | 56.7 |

    | 歐洲 | 71.1 | 72.9 | 74.9 | 77.5 |

    | 中南美洲 | 75.5 | 78.6 | 81.2 | 83.6 |

    | 北美洲 | 79.1 | 80.8 | 82.6 | 84.7 |'
