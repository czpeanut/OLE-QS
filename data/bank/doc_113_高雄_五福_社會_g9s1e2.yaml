  page: 1
  stem: '表一為聯合國2020年發表的都市化資料，推估到2030年全球將有60.4%人口居住在都市地區。都市化程度越高通常代表當地工商發展程度高，經濟水準也越高。從表中資料得知，中南美洲與北美洲的都市化程度相當，甚至比歐洲的都市化程度高，但中南美洲的經濟發展程度卻不如歐、北美兩洲。造成中南美洲都市化程度高的主要原因，最可能為下列何者？


