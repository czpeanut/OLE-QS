    極細膩 猶如繡花針落地


    簾外芭蕉惹驟雨門環惹銅綠

    而我路過那江南小鎮惹了妳

    在潑墨山水畫裡 妳從墨色深處被隱去


    天青色等煙雨 而我在等妳

    炊煙裊裊昇起 隔江千萬里

    在瓶底書漢隸仿前朝的飄逸

    就當我 為遇見妳伏筆


    天青色等煙雨 而我在等妳

    月色被打撈起 暈開了結局

    如傳世的青花瓷自顧自美麗

    妳眼帶笑意

    方文山〈青花瓷〉歌詞'
