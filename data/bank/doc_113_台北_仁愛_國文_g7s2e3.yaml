  group_stem: '素胚勾勒出青花筆鋒濃轉淡

    瓶身描繪的牡丹一如妳初妝

    冉冉檀香透過窗心事我了然

    宣紙上 走筆至此擱一半

    釉色渲染仕女圖韻味被私藏

    而妳嫣然的一笑如含苞待放

