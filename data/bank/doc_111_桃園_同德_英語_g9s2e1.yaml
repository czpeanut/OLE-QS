- id: doc_111_桃園_同德_英語_g9s2e1_s2_39
  section: 2
  number: 39
  type: single
  page: 3
  stem: The reason why there are so many accidents in our home is that we are _____.
  options:
  - label: A
    content: more careful in our homes than in a car
  - label: B
    content: not so careful in a car as we are in our homes
  - label: C
    content: as careful in our homes as we are in a car
  - label: D
    content: less careful in our homes than in a car
  group_stem: "We always hear about road accidents. When we’re in a car, we try to\
    \ drive carefully, but how many of us take the same care in our homes? Any hospital\
    \ can tell us that accidents at home happen almost as often as those on the road.\
    \ We need to think about how and why these accidents happen and what we can do\
    \ to stop them.\n     One of the most common and most dangerous causes of home\
    \ accidents is improper and careless use of appliances. For example, people use\
    \ a loose plug or pull out a plug without turning off the power first. Some people\
    \ may carry an electric heater into the bathroom to make them feel warmer when\
    \ taking a bath even though it is dangerous. Sometimes one forgets to cut off\
    \ the power before fixing a lamp or something else. All of these will cause accidents.\
    \ So the rule for anything that works is: Turn off the power before you touch\
    \ anything.\n     If there are kids in the house, it’s always best to keep medicines\
    \ out of their reach. Or, they may be taken as candies or a new kind of drink.\
    \ Also, fire, is always a risk. Remember not to dry clothes in front of fires\
    \ or leave stoves in the middle of rooms where they can easily be knocked over.\
    \ And, keep the children away from fire.\n    Safety first may take a little more\
    \ time and care, but it may save you a lot of trouble.\n      improper 不適當的 \
    \       loose plug 鬆動的插頭"
