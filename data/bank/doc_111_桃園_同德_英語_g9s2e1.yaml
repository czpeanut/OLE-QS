    \ American who was born in Thailand (泰國).\n     He is just one of a growing number\
    \ of young Asian-American fashion designers who get growing famous in the fashion\
    \ world. Jason Wu, who was born in Taiwan, became well-known after the First Lady\
    \ wore his dress to Inaugural Night balls. Gap, the fast fashion clothing company,\
    \ has invited Asian-American designers such as Phillip Lim and Alexander Wang\
    \ to design clothes for years.\n     To explain the rapid growth, many Asian-American\
    \ designers say the cultural changes in their families have freed them from traditional\
    \ career expectations.\n     The Immigration Act of 1965 allowed more Asians to\
    \ move into the U.S. After arriving, they didn’t put as much pressure as earlier\
    \ immigrants did on kids to do well in more traditional fields like business or\
    \ science. The earlier immigrants had proven themselves really successful in those\
    \ fields.\n     “I was lucky. A lot of my cousins, God bless them, they are doctors,\
    \ scientists or businessmen,” says 38-year-old fashion designer Peter Som, who\
    \ was born in China.\n     Some Asian-American designers also say relatives of\
    \ their own age who weren’t born or live in American faced more traditional career\
    \ expectations. Jason Wu says that his older brother, who chose to study business,\
