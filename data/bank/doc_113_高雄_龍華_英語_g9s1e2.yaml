    content: You don’t need to pay when you buy things in the store.
  group_stem: '(32-34)

    Buy & Go

    Buy & Go is a new kind of corner store.

    Stop by to take a cup of coffee, pick up breakfast or lunch, or look through different
    kinds of snacks and bread. When you are in Buy & Go, you will have a different
    shopping experience with Just In & Out Shopping. With it, you can get in and out
    quickly without waiting in a checkout line.

    How to enjoy Just In & Out Shopping?

    Step 1: Enter the gate

    Download the Buy & Go app and use it to open the gate of the store and start your
    shopping.

    Step 2: Shop

    Pick up what you want. You can use your bag or one of ours when you shop.

    Step 3: Walk out

    When you finish shopping, walk out through the gate. You’ll only pay for what
    you take in the store.

    Questions about us.

    ■How is shopping in Buy & Go different from other stores?

    The difference is Just In & Out Shopping. You don’t have to stand in a checkout
    line to pay when you use your Buy & Go app.

    ■How do you get the receipt?

    You can get it from the Buy & Go app or look it up at http:// www. buy&go. com.

    ■Are there any Buy & Go clerks in the store?

    Yes. Our team of store clerks is an important part of the service in Buy & Go.
    You’ll see our clerks standing at the door and answering your questions.

    📖 checkout line 結帳隊伍  receipt 收據'
