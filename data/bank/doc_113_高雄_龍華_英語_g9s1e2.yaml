  group_stem: '(29-31)

    Looking for a New Place?

    Bright apartments ready for you in Kaohsiung—just NT$10,000 a month!

    APT 1 No dogs or cats are allowed, but pets like fish or other quiet animals are
    fine. Must rent for at least one year and pay one-month’s rent first. However,
    water bills are not in the rent.

    APT 2 Near Costco. Many stores and coffee shops are around. It is a three-minute
    walk from the Kaohsiung Metro Station. There are also several bike sharing stations
    nearby, along with supermarkets.

