  type: single
  page: 2
  stem: 關於酸雨的成因下列何者正確？
  options:
  - label: A
    content: 雨水的酸鹼性為中性，pH 值為 7.0
  - label: B
    content: 自然界中有許多物質，例如：$\text{CO}_{2}$、$\text{SO}_{2}$ 等，不會造成雨水酸化
  - label: C
    content: 根據環保署定義，若雨水的 pH 值低於 7.0 以下，即視為酸雨
  - label: D
    content: 人為排放過多的硫氧化物與氮氧化物，溶於雨水後增加雨水的酸性。
