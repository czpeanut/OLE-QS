- id: doc_111_高雄_大灣_自然_g8s2e2_s2_34
  section: 2
  number: 34
  type: single
  page: 4
  stem: 關於凝乳酵素的敘述，下列何者正確？
  options:
  - label: A
    content: 凝乳酵素使使乳源裡的蛋白質凝聚，此為化學變化
  - label: B
    content: 凝乳酵素可以促使乳源中的脂肪凝聚，分離出乳清
  - label: C
    content: 凝乳酵素可以幫助纖維素分解
  - label: D
    content: 凝乳酵素只能在小牛或小羊胃裡取得
  group_stem: (二).目前市售乳酪(又稱起司)製造過程大致如下：取得乳源→加溫到 $72^\text{o}\text{C}$，殺菌 15 秒→加入凝乳酵素使其凝聚→去除乳清→添加鹽分→塑形後加入熟成室。凝乳酵素是促使乳源裡的蛋白質改變結構而凝聚的酵素，經凝乳酵素凝聚後，乳源會與液態乳清分離，分離出來的乳清愈多，乳酪的口感會愈乾。凝乳酵素早期是於小牛或小羊胃裡取得，現今已有微生物凝乳酵素或植物性凝乳酵素，不用取自動物。製作乳酪時加鹽則可以讓乳酪脫水，以保存較久。(文章來源大讀家)請根據上文，回答下列
