    小型車與前車的「安全車距」$=\frac{\text{小型車時速(公里)}}{2}$ (單位：公尺)

    例如：小型車的時速 90(公里)時，「安全車距」為 $\frac{90}{2}=45$(公尺)

    大型車與前車的「安全車距」$=$ 大型車時速(公里)$-20$ (單位：公尺)

    例如：大型車的時速 90(公里)時，「安全車距」為 $90-20=70$ (公尺)


