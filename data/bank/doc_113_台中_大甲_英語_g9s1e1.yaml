  group_stem: "3.\n    Hi, everyone. Before we learn how to make this delicious snack,\
    \ let's talk about the history of croissants. My grandma used to bake croissants\
    \ for the family all the time. I always thought they were French, but they were\
    \ actually from Austria (奧地利). In 1683, Austria was at war with the Ottoman Turks\
    \ (奧圖曼土耳其人). One evening, some Austrian bakers heard the Turks digging a tunnel\
    \ under the city. They quickly told the soldiers, so they could get ready and\
    \ save the city. To celebrate their success, the bakers created a special treat—croissant.\n\
    \    Croissants are made of flour and lots of butter. They have been mostly in\
    \ the shape of a crescent since they were created. Because a crescent was a symbol\
    \ on the flags of Ottoman Turks, the bakers decided to bake croissants in this\
    \ shape.\n    I've shared my popular recipe with many people since I started teaching.\
    \ However, if you are interested in learning more about croissants and my recipe,\
    \ don't miss my upcoming baking class!\n\nSally's Baking Classroom\nTime: 12/26\
    \ (Sat.)\nPrice: $500\n(10% discount for old students!)\nLocation: No. 92, Paris\
