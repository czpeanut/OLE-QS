  group_stem: '2.

    Dear Heidi Clarkson,


    We at Fashion City School are very happy to tell you that you have got yourself
    a place at our world-famous school! We are also glad to welcome you with open
    arms. Most of our students finished their programs here and now have very successful
    careers. Also, many of them have tried hard to make names for themselves in the
    world of fashion. We think that you will shine just as brightly as them if you
    decide to join us.


    Your pieces from high school were so great. What''s more, the experience you''ve
    had with a popular young designer for the past two years has caught the eye of
    several committee members. Others thought that your designs were fresh and new.
    Your use of color was what I love the most. Everyone is excited about seeing what
    you can do if you spend your time with us.


    The new semester starts in the first week of September. To hold your place with
    us, you need to fill out the form, sign it, and send it back to us by the end
    of June.


    Best regards,

    Timothy Gunderson

    Head of the Design Department


