- id: doc_113_新北_桃子腳_英語_g9s1e1_s6_35
  section: 6
  number: 35
  type: single
  page: 3
  stem: 35. What is the main idea of the reading?
  options:
  - label: A
    content: The Korean government is building new homes for young people.
  - label: B
    content: The Korean government is teaching lonely young people in schools.
  - label: C
    content: The Korean government wants to give jobs to young people who feel lonely.
  - label: D
    content: The Korean government wants to help lonely young people join society
      again.
  group_stem: '(35-37)

    Can you imagine living a lonely life? In South Korea around 338000 people aged
    19 to 39 are living like this. They often stay in small rooms and do not go outside
    for a long time. Because of this, they have a hard time living normal lives.

    The South Korean Ministry of Gender Equality and Family says many of these young
    people start to feel alone when they are teenagers. About 40% of them begin feeling
    lonely during this time. They find it hard to talk to others and to get used to
    the things around them. Problems at home, health problems and mental illness can
    make them feel more alone.

    To help these young people, the South Korean government wants to bring them back
    to society. They will give up to 650000 Korean won (about $500) each month to
    people aged 9 to 24 who need help. The government is also working with support
    groups to create more programs for young people. These plans will help them learn
    social skills and live healthier lives.

     normal 正常的 mental 心智的'
  shared_asset: g6_35_37
