    lonely during this time. They find it hard to talk to others and to get used to
    the things around them. Problems at home, health problems and mental illness can
    make them feel more alone.

    To help these young people, the South Korean government wants to bring them back
    to society. They will give up to 650000 Korean won (about $500) each month to
    people aged 9 to 24 who need help. The government is also working with support
    groups to create more programs for young people. These plans will help them learn
    social skills and live healthier lives.

     normal 正常的 mental 心智的'
