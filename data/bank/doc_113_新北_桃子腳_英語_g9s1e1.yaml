- id: doc_113_新北_桃子腳_英語_g9s1e1_s6_31
  section: 6
  number: 31
  type: single
  page: 2
  stem: 31. What special feature does the soap from Mei Sheng Tang have?
  options:
  - label: A
    content: It smells sweet.
  - label: B
    content: It lasts forever.
  - label: C
    content: It changes color.
  - label: D
    content: It floats on water.
  group_stem: '(31-34)

    In Sanxia Old Street, a young man named Lin You-an sells soap. He carries a stick
    with soap on both sides, just as his grandfather, Lin Yi-cai, did many years ago.

    Lin Yi-cai began making soap in 1947 because he wanted to create a product that
    was safe for the skin. In 1957, he opened a factory called Mei Sheng Tang. He
    made a special kind of soap that could float on water, making it safer than regular
    soap. His soap, called "Floating Joy," became very popular, selling 100,000 bars
    every month at its best time. In the 1990s, liquid soap became popular, causing
    Mei Sheng Tang''s sales to start dropping. By 2001, the factory was close to closing,
    and the family had to find other jobs to make money.

    To help his family, Lin You-an left college. He worked four jobs, including selling
    tea. While selling tea, he noticed that many older people liked to bathe with
    tea because it helped their skin. This finding gave him an idea. He mixed tea
    with soap to make green tea soap. In 2005, he made 12,000 bars and worked with
    local farmers to sell the soap.

    In 2006, Lin You-an opened a shop called Cha Shan Fang in Sanxia Old Street. To
    this day, he continues to honor his grandfather by making soap with natural ingredients
    only. The business has grown well and brought new hope to Lin’s family.

     float 漂浮 regular 普通的 liquid soap 沐浴乳 bar 塊 ingredient 原料'
  shared_asset: g6_31_34
