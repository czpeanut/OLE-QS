- id: doc_113_高雄_獅甲_社會_公民_g7s2e3_s1_46
  section: 1
  number: 46
  type: single
  page: 2
  stem: 某則健保相關新聞採訪了幾位人士。一名食藥署的官員說：「民眾所拿的藥，有四分之一沒有服用，導致每年浪費掉約300 億臺幣的藥物。」另一名地方衛生局的人員表示：「過去本局的藥物回收量，一年下來竟以噸計。」一名民眾則感嘆：「毫無病痛的人，只因方便、便宜，就三不五時前去診所拿取藥物，認為自己繳了保費，不拿白不拿。」從新聞當中的各種說法，可看出健保實施後出現哪一項問題？
  options:
  - label: A
    content: 保費收費不公平，無法縮小貧富差距
  - label: B
    content: 民眾未建立正確觀念，資源過度浪費
  - label: C
    content: 民間力量仍有限，無法彌補政策缺失
  - label: D
    content: 政府稅收過低，無法支付健保的支出
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 公民
      code: 6-3
      title: 我國的社會福利制度
      chapter: 第6章 社會安全與國家責任
