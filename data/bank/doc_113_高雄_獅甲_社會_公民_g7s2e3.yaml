- id: doc_113_高雄_獅甲_社會_公民_g7s2e3_s1_37
  section: 1
  number: 37
  type: single
  page: 1
  stem: 「先賦地位」是指一個人是透過承襲得到他在於社會中所處的位置，或者是意指在某些社會中，一個人從出生起就被賦予無法改變的社會地位，而「成就地位」則是指透過自己的成就努力爭取回來的社會地位，或者指一個人在其一生中通過行使知識、能力、技巧、耐力所取得的結果。根據前述內容判斷，下列情境與社會地位的類別配對，何者正確？
  options:
  - label: A
    content: 單親家庭的林郁婷在拳擊項目努力奮鬥，最後得到奧運金牌——先賦地位
  - label: B
    content: 演員梅根馬克爾認識哈利王子之後嫁入皇室，成為公爵夫人——先賦地位
  - label: C
    content: 家境貧困的古又文努力不懈，最終成為世界知名服裝設計師——成就地位
  - label: D
    content: 胤稹經過與兄弟之間激烈的奪嫡鬥爭後，繼承大清帝國皇位——成就地位
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 公民
      code: 5-1
      title: 社會地位與不公平處境
      chapter: 第5章 公平正義
    textbook: 七下公民 5-1 社會地位與不公平處境
    labeled_by: ai
- id: doc_113_高雄_獅甲_社會_公民_g7s2e3_s1_38
  section: 1
  number: 38
  type: single
  page: 1
  stem: 「法律扶助基金會」是由政府捐助成立的組織，旨為提供經濟弱勢族群法律諮詢、訴訟代理、撰寫法律書狀等法律服務，適用對象除了中低收入戶之外，原住民或者特殊境遇家庭（包括獨居者、家暴受虐者、未婚懷孕婦女、單親家庭、生活遭逢重大變故家庭）等，亦可申請法律扶助。根據前述內容判斷，法律扶助的精神最接近下列何項社會福利措施？
  options:
  - label: A
    content: 社會救助
  - label: B
    content: 社會保險
  - label: C
    content: 醫療保健
  - label: D
    content: 福利服務
