- id: doc_113_高雄_獅甲_社會_公民_g7s2e3_s1_42
  section: 1
  number: 42
  type: single
  page: 1
  stem: 臺灣的醫療品質在世界上名列前茅，但在山地與離島地區的醫療資源卻遠不如都會地區。為了讓偏鄉與離島居民也能享有完善的醫療照顧，行政院核定「優化偏鄉醫療精進計畫」，搭配醫療資訊化及放寬醫療法規等措施，全面完善偏鄉醫療照護網絡。針對前述政府進行的措施，下列解讀與詮釋何者最合理？
  options:
  - label: A
    content: 政府希望在不增加醫護人力的前提下，維持醫療品質
  - label: B
    content: 政府專注在經濟發展較佳的區域，集中資源照顧弱勢
  - label: C
    content: 政府藉由推出政策與修改法律，改善城鄉的差距問題
  - label: D
    content: 政府將先進設備普及全國，以全面提升整體醫療水準
