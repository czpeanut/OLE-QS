  stem: 圖（二）呈現我國1998 至2018 年間，收入最高20%家庭與收入最低20%家庭的可支配所得成長率變化，其中網路泡沫、金融海嘯期間，經濟成長率大幅衰退。根據圖中內容判斷，上述兩個事件發生期間的數據，呈現出下列哪一現象？
  options:
