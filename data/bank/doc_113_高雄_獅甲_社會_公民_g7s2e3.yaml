  section: 1
  number: 41
  type: single
  page: 1
  stem: 高雄市政府宣布，為了照顧育兒家庭、減輕負擔，育兒相關福利政策將在中央補助的基礎之上再加碼，內容如圖（一）。圖中所列出的社會福利政策，主要是希望能達到下列哪一個目的？
  options:
  - label: A
    content: 針對特定族群提供適切服務及協助，以提升日常生活品質
  - label: B
    content: 針對特定身份的國民提供現金給付，彌補社會保險的不足
  - label: C
    content: 透過編列預算提供救助，以便協助弱勢群體能夠脫離貧窮
  - label: D
    content: 透過強制納保，在國民遭逢老、病、死等情況時提供給付
