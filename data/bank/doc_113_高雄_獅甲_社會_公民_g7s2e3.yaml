- id: doc_113_高雄_獅甲_社會_公民_g7s2e3_s1_45
  section: 1
  number: 45
  type: single
  page: 2
  stem: 社會安全的思維起源於善心人士或者宗教團體救濟老病殘窮的困頓民眾；現代社會則主要由政府規畫一套綜合且具備發展性的社會安全制度，整合所有機構、團體與個人的力量，提供適當的服務與各式資源，保障全民應有的生活權益，建構安居樂業的生活。根據前述關於社會安全不同階段的轉變，下列敘述何者最為貼切？
  options:
  - label: A
    content: 保障範圍：從保障少數轉變為全體國民
  - label: B
    content: 態度立場：從保障人權轉變為慈善施捨
  - label: C
    content: 發起組織：從政府國家轉變為民間團體
  - label: D
    content: 實踐方式：從提供服務轉變為提供物資
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 公民
      code: 6-2
      title: 社會安全的起源與發展
