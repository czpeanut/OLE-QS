  number: 36
  type: single
  page: 1
  stem: 根據法規，若某位參加職業保險的受雇者具有工作能力及繼續工作的意願卻遭到解僱，則可請領失業給付，按照申請給付人離職前的薪資60%發給，最長給付6 個月。這項措施的內容屬於哪一項社會福利措施？
