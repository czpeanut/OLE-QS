    labeled_by: ai
- id: doc_113_高雄_獅甲_社會_公民_g7s2e3_s1_47
  section: 1
  number: 47
  type: single
  page: 2
  stem: 我國的教育政策大致上可分為三大階段，第一階段的目標是「提供免費教育資源，讓不同家庭背景的學生都能接受教育」，第二階段是「不只提供教育資源，更依據不同學生的特性提供不同服務」，第三階段是「對較為弱勢的學生提供補救教學或學習扶助」。從前述內容判斷，下列說明何者最合理？
  options:
  - label: A
    content: 僅第一階段與第二階段合乎公平正義
  - label: B
    content: 第二階段的學生沒有教育均等的機會
  - label: C
    content: 第二和第三階段提供弱勢者更多照顧
  - label: D
    content: 第一階段排擠了弱勢者受教育的機會
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 公民
      code: 5-3
      title: 追求公平正義
      chapter: 第5章 公平正義
    textbook: 七下公民 5-3 追求公平正義
    labeled_by: ai
- id: doc_113_高雄_獅甲_社會_公民_g7s2e3_s1_48
  section: 1
  number: 48
  type: single
  page: 2
  stem: 某社會局網頁分享個案：「王先生因要照顧年邁的雙親而離開職場，又因長輩身體狀況改變，即便是在家全職照顧，也無法負荷，因此向政府申請長照服務。王先生表示，這一年多來感謝長期照顧管理中心幫助申請居家服務、專業服務以及喘息服務，使自己不再獨自承擔照顧壓力，在雙親生活自理能力逐漸回復後，不再需要密集的照顧，自己也可再重返職場。」由此案例分析，該社會局提供的協助最符合下列何者敘述？
  options:
  - label: A
    content: 社會局長照服務有助縮小貧富差距
  - label: B
    content: 社會局的長照服務能幫助文化傳承
  - label: C
    content: 完善的社會福利有助維護人性尊嚴
  - label: D
    content: 完善社會福利可促進民眾公共參與
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 公民
      code: 6-1
