- id: doc_113_高雄_獅甲_社會_公民_g7s2e3_s1_44
  section: 1
  number: 44
  type: single
  page: 2
  stem: 為強化傳染病通報機制和掌握即時疫情變化，疾病管制署推動「防疫雲」系統，讓醫療院所將疫情通報資料直接透過電子病歷系統上傳，簡化疫病通報流程，更能即時掌握各傳染病的發生，爭取防疫時效，落實對民眾健康與醫療的照護。前述內容與下列何項措施屬於同一種社會福利項目？
  options:
  - label: A
    content: 提供老人看護補助
  - label: B
    content: 辦理各式疫苗接種
  - label: C
    content: 辦理全民健康保險
  - label: D
    content: 緊急安置受虐兒少
