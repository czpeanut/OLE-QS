- id: doc_113_高雄_獅甲_社會_公民_g7s2e3_s1_39
  section: 1
  number: 39
  type: single
  page: 1
  stem: 每個人都可能會遭遇生活上的危機與困境，或者因為不公平的處境而無法享有基本生活水準，因此政府應規劃社會安全制度，予以協助及照顧。下列童話故事角色的遭遇，何者不是政府的社會安全制度所能協助的情況？
  options:
  - label: A
    content: 小美人魚不但不能說話也無法正常行走
  - label: B
    content: 兩姊弟被貧困父母遺棄而在森林中流浪
  - label: C
    content: 三隻小豬的房屋被暴風吹毀，流離失所
  - label: D
    content: 傑克帶著乳牛上街交易，卻只換到豌豆
