- id: doc_111_桃園_中興_國文_g7s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 「象徵」是以具體的意象表達抽象的意念或情感。下列各選項所「象徵」的意義何者正確?
  options:
  - label: A
    content: 〈背影〉：「黑布」小帽、「黑布」大馬掛、「深青布」象徵父親彼時的膽怯低調。
  - label: B
    content: 〈紙船印象〉：「只希望能為子女摺出一艘艘未必漂亮卻禁得住風雨的船」，其中「風雨」象徵波瀾四起的困境。
  - label: C
    content: 〈遊子吟〉：「誰言寸草心，報得三春暉」──以「春暉」象徵「孩子回報母愛的溫暖」。
  - label: D
    content: 〈黃鶴樓送孟浩然之廣陵〉：「孤帆遠影碧山盡，唯見長江天際流」，其中「孤帆」象徵「人各有志」的瀟灑。
