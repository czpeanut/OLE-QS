  section: 1
  number: 14
  type: single
  page: 2
  stem: 下列關於〈定伯賣鬼〉、〈談生〉、〈紫荊樹〉三則故事的敘述，何者恰當？
  options:
  - label: A
    content: 定伯的機智勇敢顛覆了以往人對鬼的既定形象，證明邪不勝正了積極意義。
  - label: B
    content: 談生夫妻仳離後，談生愛屋及烏，承擔照顧岳家父母的責任。
  - label: C
    content: 〈紫荊樹〉以超現實手法描寫兄弟莫逆之契的重要。
  - label: D
    content: 〈定伯賣鬼〉鬼的遭遇讓我們明白：「逢人且說三分話，未可全拋一片心」。
- id: doc_111_桃園_中興_國文_g7s2e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 「各色各樣的紙船或列隊而出，或千里單騎，或比肩其步，或互相追逐」以排比修辭寫紙船的型態和結構形形色色，增加文章的節奏感，鮮明地呈現文章意象。依據這個概念，下列哪一段文字也運用了同樣的作法？
  options:
  - label: A
    content: 吾十有五志於學，三十而立，四十而不惑，五十而知天命，六十而耳順/七十而從心所欲。(論語為政篇)
  - label: B
    content: 與人善言，暖於布帛；傷人之言，身於茅戟。(荀子榮辱)
  - label: C
    content: 磅空的水伊都，丟丟銅仔伊都，阿末伊都，丟仔伊都滴落來(丟丟銅)
  - label: D
    content: 我曾難自拔於世界之大，也沉溺於其中夢話，不得真假，不做掙扎，不懼笑話。(起風了)
  lesson_raw:
    title: 紙船印象
    basis: 引用〈紙船印象〉課文原句
- id: doc_111_桃園_中興_國文_g7s2e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 「陶公少時，作魚梁吏，嘗以坩鮓餉母。母封鮓付使，反書責侃曰：『汝為吏，以官物見餉，非唯不益，乃以增吾憂也！』」（劉義慶世說新語）由此段文句可知，陶母寫信的原因是什麼？(鮓，ㄓㄚˇ，用鹽、椒等醃製成的魚類食品)
  options:
  - label: A
    content: 陶公不重視公家物資，將被追究刑責
  - label: B
    content: 身為朝廷官吏，應注意健康。
  - label: C
    content: 提醒陶公做官是一陣子，做人是一輩子
  - label: D
    content: 告誡陶公收受賄賂，恐有官司纏身。
- id: doc_111_桃園_中興_國文_g7s2e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 在生活中，我們可能會聽到某種效應或現象，如「尼可拉斯效應」是指一種善行義舉所引起的熱烈迴響 。請問下列各項效應，何者配對錯誤？
  options:
  - label: A
    content: 安於現狀，終成輸家：煮蛙效應
  - label: B
    content: 人的命運極可能被自己瞬間的抉擇改變：蝴蝶效應。
  - label: C
    content: 團結力量大，群眾足以形塑未來：羊群效應
  - label: D
    content: 你的人生，通常是被一個小小習慣搞砸的：破窗效應。
