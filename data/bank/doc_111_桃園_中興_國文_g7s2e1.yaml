  stem: 「三不朽」乃指立德：樹立德行、立功：建立功業、立言：著書立說。因此「三不朽」的「三」是一個實數。下列下列「 」中的數字，何者都是實指數字？
  options:
  - label: A
    content: 「一」心一意/「萬」籟無聲
  - label: B
    content: 「四」面楚歌/「三」更半夜
  - label: C
    content: 「六」朝金粉/「五」體投地
  - label: D
    content: 「九」霄雲外/「八」拜之交。
- id: doc_111_桃園_中興_國文_g7s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 櫻木同學這學期國文課剛接觸志怪小說的內容，正陸續整理課程筆記，請協助他確認何者不正確？
  options:
  - label: A
    content: 秦漢以來神仙之說盛行，加以佛教傳入中土，使得志怪小說發展已然成熟。
  - label: B
    content: 志怪小說篇幅短小，卻饒富趣味，清代聊齋誌異亦受影響。
  - label: C
    content: 志人小說以真人真事為描寫對象，語言簡潔。
  - label: D
    content: 續齊諧記、列異傳、西遊記都屬於志怪小說 。
- id: doc_111_桃園_中興_國文_g7s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 下列有關漢字結構的知識，何者敘述正確？
  options:
  - label: A
    content: 象形字多名詞，極具直觀性，在漢字總數中比例最高。
  - label: B
    content: 指事字初看即可認得所指示的形符，進一步觀察則能領會它的意思。
  - label: C
    content: 說文解字為東漢許慎所撰，為最早將文字依四項基本造字法則所編排的字典。
  - label: D
    content: 會意字合併兩個或兩個以上的字，整合其概念用以表現新字的含義，如「泉」。
