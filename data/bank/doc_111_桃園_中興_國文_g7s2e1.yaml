- id: doc_111_桃園_中興_國文_g7s2e1_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 「漫漫人生，大部分的時候，我們都希望墜落時，能有人在下面接住。然而，開始學習去接住他人，才是成為一個大人的必經歷程。」(張曼娟)這段文字想說明的意涵是什麼？
  options:
  - label: A
    content: 依賴他人是不可能的，要學會堅強
  - label: B
    content: 拯救痛苦的靈魂，就會擁有真心的朋友
  - label: C
    content: 嘗試付出，願意承擔才會成長
  - label: D
    content: 懂得欣賞每個人，是真正的成熟
- id: doc_111_桃園_中興_國文_g7s2e1_s2_22
  section: 2
  number: 22
  type: single
  page: 3
  stem: 根據此文，下列敘述何者正確？
  options:
  - label: A
    content: 民眾可由長度辨別香蕉是否為野生種
  - label: B
    content: 發育不良的香蕉會於果皮上布滿黑點
  - label: C
    content: 臺灣芭蕉被視為所有食用香蕉的起源
  - label: D
    content: 大多數的食用香蕉是起源於中國南方。
  group_stem: "(一)\n在品嘗香蕉美味的同時，你可能會注意到，在香蕉果肉中軸附近有許多黑點，有些看起來很清楚、有些不然。這可不是果實品質不良造成的，實際上這些黑點正是種籽，不過是已退化或發育不良的種籽。\n\
    \  而這類果肉佈滿黑點的香蕉，市面上環肥燕瘦都有，形狀與果皮顏色也不盡相同，原因就在於它們是栽培種。\n  所有天然的香蕉栽培種都是從野生種演化而來，追溯源頭，大部份栽培種的原種主要是起源於東南亞及南亞等地區的尖蕉和拔蕉。\n\
    \  臺灣本島及一些離島也可找得到野生種香蕉，至今共記錄了數種臺灣原生種：臺灣芭蕉、噶瑪蘭芭蕉、泰雅芭蕉和中華芭蕉等；其中臺灣芭蕉分佈最廣，在中低海拔的山坡地都可見到。\n\
    \  當你在野外發現野生種，若正值結果期，不妨注意觀察果實。不同於我們常吃的栽培種香蕉，這些野生種儘管粗細不一，但長度通常較短，掰開一看，可以看到果肉充滿又黑又硬、大小如木瓜籽、形狀不規則的種籽。\n\
    (節錄自《科學人雜誌》)"
- id: doc_111_桃園_中興_國文_g7s2e1_s2_23
  section: 2
  number: 23
  type: single
  page: 3
  stem: 喜歡吃香蕉的小華在看完這篇文章以後，拿起從水果店買來的香蕉和從後山摘回來的香蕉仔細對照。以下是他所觀察到的特徵和心得，請問何者有誤？
  options:
  - label: A
    content: 後山的香蕉生長在中海拔山坡地→代表它是臺灣原生種——臺灣芭蕉
  - label: B
    content: 後山摘下的香蕉有既黑且硬的種籽→代表它是野生種
  - label: C
    content: 水果店購買的香蕉較長且黑點不太明顯→代表它是香蕉栽培種
  - label: D
    content: 香蕉果肉裡遍布的黑點→那其實是香蕉的種籽
  group_stem: "(一)\n在品嘗香蕉美味的同時，你可能會注意到，在香蕉果肉中軸附近有許多黑點，有些看起來很清楚、有些不然。這可不是果實品質不良造成的，實際上這些黑點正是種籽，不過是已退化或發育不良的種籽。\n\
    \  而這類果肉佈滿黑點的香蕉，市面上環肥燕瘦都有，形狀與果皮顏色也不盡相同，原因就在於它們是栽培種。\n  所有天然的香蕉栽培種都是從野生種演化而來，追溯源頭，大部份栽培種的原種主要是起源於東南亞及南亞等地區的尖蕉和拔蕉。\n\
    \  臺灣本島及一些離島也可找得到野生種香蕉，至今共記錄了數種臺灣原生種：臺灣芭蕉、噶瑪蘭芭蕉、泰雅芭蕉和中華芭蕉等；其中臺灣芭蕉分佈最廣，在中低海拔的山坡地都可見到。\n\
    \  當你在野外發現野生種，若正值結果期，不妨注意觀察果實。不同於我們常吃的栽培種香蕉，這些野生種儘管粗細不一，但長度通常較短，掰開一看，可以看到果肉充滿又黑又硬、大小如木瓜籽、形狀不規則的種籽。\n\
    (節錄自《科學人雜誌》)"
- id: doc_111_桃園_中興_國文_g7s2e1_s2_24
  section: 2
  number: 24
  type: single
  page: 3
  stem: 根據本文，中國古代的詠物散文和西方近代的自然寫作有何不同？
  options:
  - label: A
    content: 前者對大自然有深深的敬意，後者則強調人定勝天的道理
  - label: B
    content: 前者的目的在於藉自然託志遣懷，後者的目的在於提煉自然的智慧
  - label: C
    content: 前者是透過科學來認識自然，後者是用文學想像來虛擬自然
  - label: D
    content: 前者以無生物為描寫主體，後者以生物為描寫主體
  group_stem: "(二)\n   中國散文體裡有一種詠物散文，描寫山川、蟲魚和草木。是早期中國詩人或散文家，從自然特性中，尋找和個人心理情感結構相似的對應，吟詠風物以寄託心志，排遣情懷。但西方近代文學裡卻發展出另一種自然寫作，呈現人與大自然間一種關係的轉換。使人由過去用文學來虛擬自然，漸變成透過科學來重新認識自然。從過去把自然當作一種心靈依託、賦予種種浪漫憧憬，現卻轉換成讓大自然回歸自然，以自然為主題，仔細地觀察、指認、書寫，再由其中來回顧人類生命，提煉創造中的智慧，借鏡人生。\n\
    \  美國的安妮‧迪拉德花了一年時間住在頂客溪畔讀寫，創作出溪畔天問一書，獲美國 普立茲文學獎。安妮在書中，顯然對大自然有著深深的敬意，她說：「我沒辦法要光得光，我能做的頂多是讓自己站在光束射過之處。」人不再是人定勝天、不可一世地主宰著大地。對大自然只是等候，也只能等候，謙卑地向太陽借光、借風，來細細地觀看。\n\
    (節錄於網路文章〈觀看自然〉)"
