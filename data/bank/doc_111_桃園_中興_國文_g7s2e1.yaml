- id: doc_111_桃園_中興_國文_g7s2e1_s2_26
  section: 2
  number: 26
  type: single
  page: 4
  stem: 對於作者放學時沒趕上公車，接連發生的事情，我們可以用下列何句話來下注腳？
  options:
  - label: A
    content: 塞翁失馬，焉知非福
  - label: B
    content: 萬般都是命，半點不由人
  - label: C
    content: 屋漏偏逢連夜雨，船遲又遇打頭風
  - label: D
    content: 靠山山倒，靠人人老，只有自己最可靠。
  group_stem: "(三)\n    我想起小時候，父親每天檢查我們的日記，一方面是訓練我們作文，另一方面是藉此知道我們每天在做些什麼。\n    有一次，我在日記上寫道「今天諸事不順」，我雖然已經去睡了，父親還是把我叫起來問：「為什麼今天諸事不順？」我回答道：「放學時沒趕上公車，等了四十五分鐘才來第二班，因為公車脫班，所以人很擁擠，我被人踩到腳，白球鞋要重刷鞋粉，明天才能通過檢查，書包帶子被擠斷，用抱著回家。」父親問：「早上去上學時有趕上公車嗎？」我說：「有，一出巷口車就來了，到校還有十分鐘的空檔。」他又問：「今天便當有丟掉嗎？」我說：「沒有。」（早期臺灣物質缺乏，學校蒸便當常會丟掉便當，丟的人只好餓肚子）「有被老師打嗎？」我說：「沒有。」父親就正色說：「那你為什麼說諸事不順？你總是記得不好的事，不記得好的事，你這樣會使你變得尖酸刻薄，人家不喜歡你。」後來，我發現人果然總是記得不順的事，把順利的事當作理所當然，而人也真的是不喜歡總是怨天尤人的朋友。\n\
    \  很多時候，如果我們肯放開心胸，先不要懷疑別人的話是有惡意，我們會發現他的話的確沒有惡意，只是表達不當，聽起來不順耳而已。英文有句話：「give the\
    \ benefit of doubt」，當不確定時，先假設對方沒有惡意。如果能做到這點，人生的路會平坦許多。\n（節錄洪蘭〈多記好事〉"
