- id: doc_111_桃園_中興_國文_g7s2e1_s2_28
  section: 2
  number: 28
  type: single
  page: 4
  stem: 根據此文，下列何句凸顯了志怪小說的神怪特質？
  options:
  - label: A
    content: 出從左元放受九丹液仙經
  - label: B
    content: 言及變化之事
  - label: C
    content: 見作請雨土人
  - label: D
    content: 冬為客設生瓜棗
  group_stem: "(四)\n   葛玄，宅孝先，從左元放受九丹液仙經。與客對食，言及變化之事，客曰：「事畢，可作一事特戲者。」玄曰：「得無即有所見乎？」乃嗽口中飯，盡變大蜂數百，皆集客身，亦不螫人。久之，玄乃張口，蜂皆飛入，玄嚼食之，是故飯也。又指蝦蟆及諸行蟲燕雀之屬，使舞，應節如人。冬為客設生瓜棗，夏致冰雪。又以數十錢使人散投井中，玄以一器於井上呼之，錢一一飛從井出。為客設酒，無人傳杯，而徑至前，如或不盡，杯不去也。\n\
    嘗與吳主坐樓上，見作請雨土人，帝曰：「百姓思雨，寧可得乎？」玄曰：「雨易得耳！」乃書符著社中，頃刻間，天地晦冥，大雨流淹。帝曰：「水中有魚乎？」玄復書符擲水中，須臾，有大魚數百頭。使人治之。\n\
    (改自干寶《搜神記》)"
