- id: doc_113_新北_丹鳳_社會_歷史_g9s1e3_s1_28
  section: 1
  number: 28
  type: single
  page: 2
  stem: '「1991 年8 月，烏克蘭政府發布國家獨立宣言，年底獨立公投獲得高達90%以上的支持率，進而正式脫離蘇聯獨立，改國名為烏克蘭共和國。1996 年通過新憲法，確定烏克蘭為主權獨立、民主的法治國家，採取三權分立，實行共和制。」根據上文，烏克蘭共和國的新憲法，最可能運用哪些思想家的觀點？

    (甲)馬克思 (乙)孟德斯鳩 (丙)盧梭 (丁)伏爾泰。'
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 乙丙丁
  - label: D
    content: 甲乙丙丁。
