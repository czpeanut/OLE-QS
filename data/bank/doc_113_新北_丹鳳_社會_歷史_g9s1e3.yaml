- id: doc_113_新北_丹鳳_社會_歷史_g9s1e3_s1_26
  section: 1
  number: 26
  type: single
  page: 2
  stem: 笛卡兒是西元17 世紀法國人，是位傑出的數學家和哲學家，他最為有名的一句話是「我思故我在」，以下何者的論述最符合笛卡兒的主張？
  options:
  - label: A
    content: 法律之前人人平等，不能將尚未定罪的人置於死地
  - label: B
    content: 君王的權利是上帝賜與的，人民應該完全服從君主
  - label: C
    content: 地球為宇宙中心是教會說的，只要是教會說的就不可能有錯，所以地球中心說是對的
  - label: D
    content: 伽利略的「慣性原理」也不見得是完全對的，經由嚴格論證去確認知識，才是可信的。
  tags:
