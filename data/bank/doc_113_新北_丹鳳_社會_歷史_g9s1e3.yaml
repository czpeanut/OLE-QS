  section: 1
  number: 25
  type: single
  page: 1
  stem: 西元1610 年伽利略出版《星際使者》一書震撼全歐洲，當時人們宣稱：「哥倫布發現了新大陸，伽利略發現了新宇宙」，遂稱之為「天空的哥倫布」。請問：伽利略被稱為「天空的哥倫布」的原因最可能為何？
  options:
  - label: A
    content: 利用新工具觀察天體證實哥白尼的學說
  - label: B
    content: 協助編纂百科全書將知識做系統性整理
  - label: C
    content: 天文學界中首度提出太陽為宇宙中心論
  - label: D
    content: 提出三大運動定律及萬有引力的科學家。
