  section: 1
  number: 31
  type: single
  page: 2
  stem: 「某天，我與友人漫步於街道上，我向他提及令人慚愧和不衛生的貧民窟，想引起他注意這個城市的工廠工人居住地區是如何令人作嘔。我表示我生平從來沒有看過如此糟的城市。我的友人雖耐心傾聽我的訴說，但卻在我們即將分手告別的街道說了一句：『但是，這裡有錢可賺啊！』」請問，這段文字的作者最有可能身處哪個時空？
  options:
  - label: A
    content: 8 世紀的中國長安
  - label: B
    content: 14 世紀的義大利威尼斯
  - label: C
    content: 16 世紀的西班牙馬德里
  - label: D
    content: 18 世紀的英國倫敦。
