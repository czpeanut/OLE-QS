  stem: 西元2023 年以來，因為葉門地區的武裝組織對周遭海域船隻進行攻擊，使航運業出現「紅海危機」。為了避免受害，各國來往歐亞地區的船隻只能改道「甲」路線，運輸成本因此大增，影響利潤收入。但在近五百年前，此條航線卻為某些國家帶來豐厚的利益，請問率先得利的是哪一個國家？
