- id: doc_113_新北_丹鳳_社會_歷史_g9s1e3_s1_27
  section: 1
  number: 27
  type: single
  page: 2
  stem: 雕塑家羅丹(Aiguste Rodin)參觀博物館時，曾對一些人物塑像有感而發的說：「瞧！伏爾泰對面的盧梭，目光中含有無限精微的氣息，那是十八世紀諸人物的共同性格。他們都是懷疑者，他們批評從古代以來認為天經地義的『道理』，他們都有監視的目光。」其中人物所蘊含的共同性格，指的應該是下列何者？
  options:
  - label: A
    content: 尊崇人文主義，否定各種宗教迷信
  - label: B
    content: 以理性的方法思考人類社會的現象
  - label: C
    content: 提倡歸納法或演繹法，推翻各種定律與學說
  - label: D
    content: 傾向自由、平等、民主、憲政，反對君主國體。
  tags:
