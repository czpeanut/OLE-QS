- id: doc_113_新北_丹鳳_社會_歷史_g9s1e3_s1_32
  section: 1
  number: 32
  type: single
  page: 2
  stem: 呈上題，後續有許多學者欲解決這位作者所提到當時社會狀況，進而提出了許多理論，請問，下列何者是解決當時狀況的學說之一？
  options:
  - label: A
    content: 人人生而平等，上帝賦予它們若干不能出讓的權力
  - label: B
    content: 共和是最好的政治體制，國家主權應屬於全體人民
  - label: C
