  section: 1
  number: 22
  type: single
  page: 1
  stem: '下述文字為南半球的某國「Change the date(改變日期)」運動的聲明，目的是在要求政府應該要更動國慶日的日期，呼籲政府不該把紀念英國人十八世紀登陸此地的日期當做國慶日，應該重視被侵略者的心聲。

    1 月26 日對原住民來說是痛苦的，同時標誌著種族滅絕和入侵的開始。如果我們更改日期，我們就可以為這個國家的所有人創建一個包容性的全國性節日……。

