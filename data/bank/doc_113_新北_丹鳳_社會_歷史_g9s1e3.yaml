- id: doc_113_新北_丹鳳_社會_歷史_g9s1e3_s1_30
  section: 1
  number: 30
  type: single
  page: 2
  stem: 有位歷史學家曾提到：「17 世紀和18 世紀初，西方人對中國的歷史、藝術、哲學和政治完全著迷。」然而，「18世紀末，歐洲人對中國的自然資源更感興趣。」請問：導致這種變化的原因為何？
  options:
  - label: A
    content: 科學革命後，西方認為中國科學發展落後而欲使之成為糧食供應國
  - label: B
    content: 工業革命後，為確保原料與市場而投入對中國的資源搶奪
  - label: C
    content: 啟蒙運動後，西方強調理性思考而減少對中國學術的興趣
  - label: D
    content: 自由貿易理論之下，比較利益的概念使中國農業發展更具經濟上的優勢。
  tags:
