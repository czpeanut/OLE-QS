  section: 1
  number: 29
  type: single
  page: 2
  stem: 西元 2018 年法國總統馬克宏造訪一座法國大文豪伏爾泰蟄伏的避風港--弗尼城堡，因法國政府剛完成整修，使這座封閉已久的古堡煥然一新。關於這個大文豪所主張的言論，下列何者正確？
  options:
