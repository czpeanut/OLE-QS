- id: doc_113_新北_丹鳳_社會_歷史_g9s1e3_s1_23
  section: 1
  number: 23
  type: single
  page: 1
  stem: 有一本講述中國歷朝歷代經濟發展的書籍中有如此描述：「西元1600 年（明萬曆28 年）中國人口約略1 億5千萬，至西元1790 年（清乾隆55 年）增至3
    億人口。探究原因，除了清朝初年太平盛世外，更重要是從海外傳入番薯、馬鈴薯、玉米等新作物有效的解決了中國糧食不足的問題。」請問：同時期的中國經濟還發生了何種變化？
  options:
  - label: A
    content: 歐亞大陸因絲路而連接了商路，阿拉伯商人來往其中並將驛站發展成國際貿易站
  - label: B
    content: 因海上貿易興盛，為了加強管理海上貿易，中國設立市舶司並限制廣州一口通商
  - label: C
    content: 歐洲人用白銀大量購買中國的絲綢，使白銀大量流入中國改變中國貨幣使用習慣
  - label: D
    content: 中國被迫開港通商，大量的洋商進入中國建立工廠，嚴重打擊中國本土產業發展。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 歷史
      code: 4-3
      title: 美洲、亞洲、澳洲與殖民統治
      chapter: 第4章 近代歐洲與多元世界
