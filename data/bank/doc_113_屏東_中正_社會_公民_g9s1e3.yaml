- id: doc_113_屏東_中正_社會_公民_g9s1e3_s1_22
  section: 1
  number: 22
  type: single
  page: 4
  stem: "2023 年12 月立法院進行三讀通過《最低工資法》，2024 年正式上路，同年9 月行政院核定勞動部「最低工資調整」方案，訂定每月最低工資為2\
    \ 萬8590 元，每小時最低工資為190 元，於2025 年1月1 日施行。\n  依據契約自由的原則，工資原本應該由勞雇雙方議定，為保障勞工權益及其最低生活水準，勞雇雙方議定之工資，不得低於基本工資，勞工與雇主雙方議定之工資低於最低工資者，主管機關可開罰新臺幣二萬元以上一百萬元以下罰鍰。\n\
    \  基本工資的審議程序與擬訂，是由勞動部下設基本工資審議委員會，參考基本工資審議辦法所訂定的指標審議。既有法律已經規範基本工資，為何另外制定最低工資法？勞動部說明，為了建構完善的最低工資審議機制，確保勞工能在最低限度下維持生計。\n\
    根據上述，下列何者正確？"
  options:
  - label: A
    content: 雇主受主管機關開罰須負刑事責任
  - label: B
    content: 文末提及既有法律是就業保險法的規範
  - label: C
    content: 基本工資審議辦法的法律位階和最低工資法相同
  - label: D
    content: 最低工資法是為了保障人民的受益權。
