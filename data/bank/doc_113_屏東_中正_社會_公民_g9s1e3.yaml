- id: doc_113_屏東_中正_社會_公民_g9s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 3
  stem: "台灣出現工時長與中高齡勞動參與率提升的現象，如何降低工時提升工作效率，並創造友善的高齡職場，會是未來台灣勞動市場的關鍵目標。勞動部表示，若比較全時勞工，台灣全時勞工平均每週工時為41.5\
    \ 小時，相較日本42.9 小時和韓國43.8 小時，台灣比日韓還要低。專家分析未來台灣中高齡勞參率提升，將漸漸下修總工時。\n  為落實尊嚴勞動，提升中高齡者勞動參與，促進高齡者再就業，政府特制定《中高齡者及高齡者就業促進法》，維護中高齡者及高齡者就業權益。\n\
    註：中高齡者：指年滿四十五歲至六十五歲之人。高齡者：指逾六十五歲之人。有固定工作時間、地點及雇主的就業，稱為典型工作(全時正式工作)，反之則為非典型工作，例如派遣工作、定期契約工。\n\
    下列哪一個選項，最符合上文的描述？"
  options:
  - label: A
    content: 透過法律保障中高、高齡者的市場勞動
