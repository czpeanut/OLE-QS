- id: doc_113_屏東_中正_社會_公民_g9s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: "民眾持信用卡進行交易時，是先由發卡銀行代為支付費用，到了約定的繳費期限，持卡人仍須以現金支付帳單，若未能全額繳清，不僅欠下債務，發卡銀行還會收取高額的利息。\n\
    \  現代科技發展迅速，消費者可直接使用智慧型手機、手錶掃描或感應來支付消費，大大節省民眾交易時間。\n根據上述，下列何者不正確？"
  options:
  - label: A
    content: 民眾與信用卡發卡銀行之間是民法的借貸關係
  - label: B
    content: 信用卡具備交易媒介的功能，所以是法定貨幣
  - label: C
    content: 信用卡是先消費之後再付款給銀行
  - label: D
    content: 電子支付方式可簡化交易過程。
