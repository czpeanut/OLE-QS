  section: 1
  number: 21
  type: single
  page: 4
  stem: 【鑑於線上遊戲日趨蓬勃，近年來衍生的消費爭議逐漸增加，購買線上遊戲點數(卡)或加值服務等同於是預付性質，為避免預付的點數無法兌換，造成消費糾紛，經濟部制定並公告「線上遊戲點數（卡）定型化契約應記載及不得記載事項」，要求業者必須就玩家預付金額提供履約保證，同時列出八大不得記載事項。消保官提醒消費者，購買線上遊戲點數(卡)時，應詳細閱讀是否有記載履約保證責任、詳細消費資訊及處理申訴管道，亦應注意是否有使用或登錄期限等不得記載事項，若為節省時間而直接點選同意或確認購買，將可能導致自己權益受損。】根據上文，下列哪一個敘述正確？
  options:
  - label: A
    content: 線上遊戲點數(卡)是屬於一種塑膠貨幣
  - label: B
    content: 可提出行政訴訟解決線上遊戲的消費糾紛
  - label: C
    content: 購買線上遊戲點數不屬於消費者與業者簽訂的一種契約
  - label: D
    content: 線上遊戲點數(卡)和信用卡一樣有延遲支付的功能。
