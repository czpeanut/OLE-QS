  type: single
  page: 2
  stem: 【南韓的少子化、超高齡化趨勢，激發政府和民間加速使用機器人代勞！特別是製造業勞動者的高齡化，不僅會因肌肉力量減弱而受傷的問題，還會導致產業競爭力下降，穿上機器背心後省下不少力氣，背心上的裝置能夠輔助肩膀和胳膊的肌肉力量。穿戴式機器人不只用於生產線，也應用在日常生活中，京畿道教育廳明年開始，先選定一校引進4
    台負責油炸食物的烹飪機器人，設置油炸烹飪室配送食物至附近學校，目的是改善廚師的工作環境及預防工傷，有地方議員擔心校園廚師會因此失業，而且萬一機器人突然故障，學校營養午餐恐怕開天窗。】根據上文，下列敘述何者正確？
