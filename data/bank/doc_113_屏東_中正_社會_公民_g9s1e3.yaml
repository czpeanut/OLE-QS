  section: 1
  number: 10
  type: single
  page: 2
  stem: 【瑞典是邁向無現金社會非常快速的國家，該國知名家具品牌進行一項實驗，提供支付現金的顧客一份免費的熱狗，雖然只有1%的顧客用現金，但員工卻需要花費一天工作中15%的時間整理現金，凸顯使用現金額外產生的成本。瑞典全國約三分之一的人口是高齡人口，如果太快放棄現金不用，將對老人不利。另外，無現金支付的電子交易因為記錄大量消費數據，這些數據幾乎等於沒有畫面的監視器，監控所有的消費行為。還有非現金支付可能受到停電、駭客攻擊影響。】根據上文，下列哪一個選項的敘述正確？
