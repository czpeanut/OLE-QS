  group_stem: '1. 請閱讀國姓爺與荷蘭長官揆一往返的書信，並回答問題：


    資料一

    這是一封大明招討大將軍國姓爺寄給荷蘭長官揆一閣下的信，信件內容節錄說明如下：「澎湖島離漳州不遠諸島不遠，所以屬於漳州；大員因為接近澎湖島，所以此地應該屬於中國統治，我的父親一官將此地借給荷蘭人，但只是借用而已。我跟家父一樣，也用友善的態度繼續跟公司交易來往，為此，我們釋放所有的荷蘭俘虜，讓他們回家……若您想要繼續占領別人的土地(原本是我父親，現在屬於我的土地)是不應該的，這個道理閣下和貴評議會應當都清楚……如果你們及早來向我彎腰低頭，用商談的方式，將你們的城堡移交給我，我不但會讓你們這些評議員的地位升高，使婦女兒童都得保全生命……。」


    資料二

    這是一封長官揆一和福爾摩沙評議會寄給大明招討大將軍國姓爺的信，信件內容節錄說明如下：「我們同意殿下，將這城堡，以及公司的現金和貨物都交給你，但是，公司在這個地方的簿記、文件、和奴隸要除外……。」'
