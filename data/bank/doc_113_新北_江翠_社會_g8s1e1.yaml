  group_stem: '北韓領導人金正恩為了防止人民受韓劇、KPOP 等「韓流」影響，於2020 年頒布《反動思想與文化法》，基本上視「使用南韓人說話方式或用語」為非法行為，2023
    年1 月再度通過《平壤文化語言保護法》，將朝鮮語平壤方言定為標準語言，禁止使用「完全喪失朝鮮語基礎」的「（南韓）傀儡語」。根據上述法律，北韓民眾若在公共場合隨意使用南韓慣用語將被取締，還可能面臨勞改甚至死刑的罪罰。2024
    年6 月南韓的脫北者團體多次向北韓空飄裝有USB 隨身碟、1 美元紙鈔、白米的氣球，30 多名年僅10 幾歲的北韓中學生，只是看了隨身碟裡的韓劇，便慘遭當局公開槍斃。

    然而，金正恩近日視察北部洪災，難得向一般民眾發表演說，卻被發現使用多個南韓用語，明顯違反去年頒布的「平壤文化語保護法」，令不少北韓民眾大為震驚。'
