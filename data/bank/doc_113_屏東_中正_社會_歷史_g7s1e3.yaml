  group_stem: （一）十五世紀末歐洲國家進行海外探險，並且來到亞洲建立商業據點與殖民地之後，臺灣便納入世界貿易體系中，由於臺灣地理位置具優越性，加上物產豐富，不僅成為國際貿易的轉運站，也有諸多商品外銷。然而清帝國統治初期，臺灣的貿易活動大多局限在與中國大陸的互動之間。直到十九世紀中葉，清廷被迫開港通商後，臺灣再度納入世界經濟體系的一環。請問：
