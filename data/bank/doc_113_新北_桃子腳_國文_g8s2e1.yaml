  group_stem: "乙,\n很多人好奇鯨與豚到底如何分別？學術資料將牠們\n攏稱為鯨類，之下區分鬚鯨亞目及齒鯨亞目，齒鯨亞目\n下又分為許多科，許多超科。有些體型不大的被稱作\n\
    鯨，有些體型不小的硬是被叫做海豚。牠們攏是齒鯨，\n也攏屬於海豚科。很難啊，說也說不明白，這些\n「科」、「目」的分屬在學術界仍有許多無法釐清的爭\n論。\n\
    \  漁民的說法比較直接—體型大過漁船的（一船漁\n船長約十公尺）叫「海翁」，其他一律叫「海豬仔」。\n龐大又長牙齒的只叫做「海翁」，長「牙刷嘴」（鬚\n\
    板）的叫「正海翁」。\n  媽祖生，海面上真的很熱鬧，一群還沒看完接著又\n來一群，純然是巧合嗎？漁民經驗也許沒有學理根據，\n但二、三十年的海上歲月累積，可能他們已歸納出什麼\n\
    道理來。\n  中午時分，終於有點空檔，我坐在船頭上想，研究\n調查牠們到底為了什麼？為了滿足好奇？為了贏得學術\n聲譽？為了保育理想？那又為什麼海豚肉在臺灣到處都\n\
    問得到、吃得到？難道研究單位不知道每年臺灣流刺網\n誤殺海豚每年至少五○○○~一○○○○頭；難道不知\n道岸上未經處理的放流水是鯨豚保育的嚴重問題，我覺\n\
    得若是要打著「鯨豚保育」的旗幟，這些問題應該坦白\n勇敢的告訴大家。（節選自廖鴻基 媽祖生）"
  answer:
  - B
  answer_source: answer_key_vlm
