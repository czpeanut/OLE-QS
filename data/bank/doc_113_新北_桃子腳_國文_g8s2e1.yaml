- id: doc_113_新北_桃子腳_國文_g8s2e1_s3_39
  section: 3
  number: 39
  type: single
  page: 4
  stem: 由於馬謖失守街亭，孔明急忙調兵遣將，重新部署，以致魏軍來襲時，西城爆發危機。在此危急存亡之際，孔明為何不率兵撤逃？
  options:
  - label: A
    content: 孔明生性愛冒險
  - label: B
    content: 兵力不足而不能遠遁
  - label: C
    content: 想與司馬懿決一死戰
  - label: D
    content: 城中無足夠的馬匹。
  group_stem: '空城計      羅貫中

    孔明分撥已定，先引五千兵去西城縣搬運糧草。忽

    然十餘次飛馬報到，說司馬懿引大軍 十五萬，望西城

    蜂擁而來。時孔明身邊並無大將，止有一班文官，所引

    五千軍，已分一半先 運糧草去了，只剩二千五百軍在

    城中。眾官聽得這消息，盡皆失色。孔明登城望之，果

    然塵土沖天，魏兵分兩路望西城縣殺來。孔明傳令：眾

    將旌旗，盡皆藏匿。諸軍各守城鋪，如有妄行出入，及

    高聲言語者，立斬。大開四門，每一門上用二十軍士，

    扮作百姓，灑掃街道，如魏兵到時，不可擅動，吾自有

    計。孔明乃披鶴氅，戴綸巾，引二小童，攜琴一張，於

    城上敵樓前，凭欄而坐，焚香操琴。

    卻說司馬懿前軍哨到城下，見了如此模樣，皆不敢

    進，急報與司馬懿。懿笑而不信，遂 止住三軍，自飛

    馬遠遠望之，果見孔明坐於城樓之上，笑容可掬，焚香

    操琴。左有一童子， 手捧寶劍；右有一童子，手執麈

    尾。城門內外有二十餘百姓，低頭灑掃，旁若無人。懿

    看畢，大疑，便到中軍，教後軍作前軍，前軍作後軍，

    望北山路而退。次子司馬昭曰：「莫非諸葛亮無軍，故

    作此態，父親何故便退兵？」懿曰：「亮平生謹慎，不

    曾弄險。今大開城門，必有埋伏。我軍若進，中其計

    也，汝輩焉知？宜速退。」於是兩路兵盡皆退去。

    孔明見魏軍遠去，撫掌而笑。眾官無不駭然，乃問

    孔明曰：「司馬懿乃魏之名將，今統十五萬精兵到此，

    見了丞相，便速退去，何也？」孔明曰：「此人料吾平

    生謹慎，必不弄險，見如此模樣，疑有伏兵，所以退

    去。吾非行險，蓋因不得已而用之。此人必引軍投山北

    小路去也。吾已令興、苞二人在彼等候。」眾皆驚服，

    曰：「丞相玄機，神鬼莫測。若某等之見，必棄城而走

    矣。」孔明曰：「吾兵止有二千五百，若棄城而走，必

    不能遠遁。得不為司馬懿所擒乎？」 言訖，拍手大

    笑，曰：「吾若為司馬懿，必不便退也。」'
  lesson_raw:
    title: 空城計
    basis: 空城計課文內容
  answer:
  - B
  answer_source: answer_key_vlm
