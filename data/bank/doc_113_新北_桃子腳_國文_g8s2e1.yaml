  stem: 1. 請問「誰該洗碗」這個問題會引起很多人的討論是因為它凸顯出台灣社會的什麼現象依然長期存在呢？(1 分)
  group_stem: "台灣「誰該洗碗」貼文為何成網路熱點，引爆女性\n怨氣與「父權創傷」討論？家事分工如何更平等？   \n節選自BBC 中文記者劉子維\n\
    近日一則關於「丈夫不想洗碗」的貼文引發熱議。\n文中男子自述10 多年前的經歷，稱婚後多來年經常因\n為洗碗分工而與太太爭執，將自己「不願洗碗」歸咎於\n\
    「不想失去媽媽的愛」，並表達出期望太太複製原生家\n庭中，母親一手包辦廚房家事所帶給他的「被愛的感\n覺」，但太太並不想照做，作者因而感到悲傷失落。\n有關說法引來大批網友聲討「不洗碗男」，說「他\n\
    需要的伴侶是『家政婦』吧」，批評他是「媽寶男」；\n也有人對他表示不屑：「不過洗個碗，到底能跟創傷扯\n上什麼的理性與感性。」\n有學者對BBC 中文分析稱，台灣性別不平等現象依\n\
    然存在——雖然女性地位在公領域顯著提升，但在家庭\n等私領域，女性仍然要負擔更多責任。因此「誰做家\n事」多年來仍是容易引起爭執的話題。\n諮商心理師吳雅婷發文指出，洗碗事件成為「一個\n\
    公開的標的」，讓在父權體制中感到創傷的人們有情緒\n投射。\n這種性別定型也反映在教育系統裡。在1990 年代\n以前，男學生上工藝課，女學生上家政課。之後，隨著\n\
    性別平等觀念逐步推展，教育部取消男女分科，所有學\n生都必須上「家政課」以及改名為「生活科技」的工藝\n課。\n在台灣南部一所國中國中擔任家政課老師25 年的\n\
    林老師對BBC 中文說，她剛開始教書的頭幾年，偶爾遇\n到男學生表示「我爸爸說進廚房是女人的事」，但隨著\n性平教育和社會風氣轉變，現在同學們不論性別，對於\n\
    家政課縫衣服、煮菜等項目，都興致勃勃地參與，覺得\n比閱讀紙本書的正課來得有趣。\n為何職業婦女怨氣更大？\n「早期的媽媽都是心甘情願，默默的。現在都是雙\n\
    薪家庭，你有在賺錢、我也有在賺錢，家裡是大家的，\n當然就必須要分工。」育有一雙兒女的林老師說。\n美國社會學家霍希爾德（Arlie Hochschild）的\n\
    《第二輪班》於1989 年出版，她指出當代職場女性白\n天在公司處理公務、下班回到打理家務，回家持續上\n「第二輪班」。\n目前台灣雙薪家庭約佔六成，但家事的責任仍受\n\
    「男主外、女主內」的傳統價值主導。根據2019 年台\n灣主計處資料，35 至44 歲婦女每日平均從事無償家庭\n工作的時數，是同年齡男性的三倍。\n回顧台灣女性平權發展歷程，1970\
    \ 年代，經濟快\n速發展，女性就業率顯著提升，改變了傳統「女主內」\n的女性家庭角色。女性雖走出家門，但中研院調查顯\n示，1991 年仍有62%民眾贊成「男性養家、女性顧家」\n\
    的性別角色區隔。\n1990 年代，台灣社會發生多起震驚社會的性別暴\n力事件：不堪丈夫長期家暴而殺夫的鄧如雯案、為婦女\n參政權奔走期間遭殺害棄屍的彭婉如案⋯⋯等等案件，\n\
    在輿論高度關注下，保障及提升女性權益的修法陸續推\n出。\n2016 年，蔡英文當選成為台灣第一位女總統。女\n性當選立法委員的佔比，從2008 年的30.1%開始，每\n\
    屆逐漸增加，2024 年女性當選者佔41.6%。\n根據聯合國開發計畫署（UNDP）發布的性別不平等\n指數（Gender Inequality Index\
    \ ,GII) ，該數值越\n小，代表該社會的男女發展越平等，台灣排名全球第7\n名，同時是亞洲第1。緊接在後是新加坡排名第8，南\n韓16 名、日本23\
    \ 名，中國49 名。\n台大社會系碩士劉蒞關於家務分工的論文指出，雖\n然台灣在政治、經濟等公領域繳出亮眼成績，但從其他\n指標細看，在性別分工、婚姻、生育及照顧、家庭義務\n\
    等四個指標上，台灣的性別意識形態並沒有明顯比日\n本、韓國、中國平等。\n已婚者對家務事的態度，可以從中研院2020 年公\n布「家庭動態調查」進一步了解：對於「丈夫的責任是\n\
    賺錢養家，太太是照料家庭」的說法，已婚男性「同\n意」或「非常同意」的比例為20%、女性則為10%，顯\n示台灣男性對於家庭性別角色分工的看法，仍較女性傳\n\
    統。張晉芬2007 年發布並被多次引用的論文指出，洗\n衣、烹飪、育幼被認為具有女性特質，容易被歸類為\n「女人的家事」；修理壞掉的家電、居家修繕等，則被\n\
    視為「男人的家事」。由於「男人的家事」在生活中出\n現頻率較低，因此性別化的家事分工，女生註定會負擔\n更多家務。\n學者張晉芬指出，男女婚後的家務分工，是複製從\n\
    原生家庭中學習到的模式，因此改變「家務分工性別\n化」的關鍵仍在於：男性必須有意願從事洗衣、煮飯等\n被視為「女人的家事」。\n她指出，具體實踐的方式是從小培養，教育孩子有\n\
    性別平權意識，父母也要多要求小孩從事不同類型的家\n事，跳脫「家務性別化」的框架，例如讓兒子去晾衣\n服、叫女兒去換電燈泡。\n台灣行政院在2012 年成立「性別平等會」，旨在\n\
    推動破除性別刻板印象，是台灣第一個性別平等專責機\n制。2016 年該機構曾發表男性穿著圍裙洗碗的文宣\n品，傳遞「願意分擔家事的男人是重視性別平等的具體\n\
    表現」。\n在政策層面，西方國家的做法也值得參考。\n性平意識領先全球的瑞典早於1974 年將「育嬰\n假」改為不限性別的「父母育兒假」，提高父親參與意\n\
    願，現行雙方各有90 天的育兒假，就算不使用也無法\n轉讓給另一半，確保雙親都要負擔育兒責任。此外，在\n孩子滿8 歲之前，瑞典雙親也能夠依法減少的工作時\n\
    間。\n但有民間團體認為，台灣朝向國際性別平權「第一\n梯隊」邁進還有漫漫長路。\n婦女新知基金會指出，雖然從行政院公布的2024\n年台灣性別數據看到，男性使用育嬰留職停薪的比例達\n\
    到四分之一左右，但仍有高達約四分之三的育嬰留職停\n薪津貼是女性申請。\n婦女新知發文指出，「追根究底，（台灣）低薪資\n高工時的就業環境也是家務照顧分工以及職場難以落實\n\
    性別平等的重要關鍵」。也有民間團體認為，台灣在育\n嬰假法規與制度上的改革，以及立法院是否能推動降低\n工時等相關修法，都仍有改進空間。"
