  section: 2
  number: 32
  type: single
  page: 4
  stem: 32. (　)What did women fight for in the past?
  options:
  - label: A
    content: Free food and clothes.
  - label: B
    content: Cheaper schools.
  - label: C
    content: More holidays.
  - label: D
    content: The right to vote and fair work.
  group_stem: "III.                                                              \
    \                                (ICRT News 3/14)\n    International Women’s Week\
    \ \nDo you know that Universal Women’s Week is in March?               \n \nThis\
    \ week is a time to think about how women have fought for equal rights \nand what\
    \ still needs to be done to help all women.  Do you know when this \nholiday started?\n\
    The first International Women’s Day was in 1909.  Back then, women \nwanted the\
    \ right to vote, to be treated fairly at work, and to be able to become \nleaders\
    \ and politicians. \nWait — women couldn’t vote?  That’s right.  It was different\
    \ in each country.\nIn the U.S., white women didn’t get the right to vote until\
    \ 1920.  Black women had\nto wait about 50 years longer!  In Canada, white women\
    \ could vote in 1918, but \nindigenous women had to wait until 1960.  Now, in\
    \ both countries, everyone can \nvote, no matter their race or gender.\nBut even\
    \ today, women still face unfair treatment sometimes.  That’s why it’s \nimportant\
    \ to keep working for equality for all people.\n universal 全世界的  equal right\
    \ 平權  fairly 公平地  politician 政治家  indigenous 原住民  race 種族  gender 性別 \n   unfair\
    \ 不公平的  treatment 對待  equality 平等"
