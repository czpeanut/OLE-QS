  group_stem: '題組(一)：自2018 年起，政府推動「0 至6 歲國家一起養」政策，提供生育津貼、托育補助、育兒津貼等，減輕家庭育兒負擔，並於2023
    年對育兒津貼進行了重大改革，取消了排富條款，實施「普發制」育兒津貼，育有 0～未滿2 歲幼兒的家庭，無論所得高低皆可申請，讓中高收入家庭也能感受到國家對育兒的支持，這是一項具有指標性的育兒政策轉變。此外，考量到家庭租屋需求上，政府也推動租金補貼政策，希望減輕有育兒家庭的經濟負擔﹔並且為了照顧弱勢及青年族群的居住需求，並以106
