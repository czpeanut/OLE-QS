    年代後期，臺灣平均每年經濟成長率達9.2%。民國60 年代初期臺灣經濟受到產油國戰爭影響而一度蕭條，但隨後創造出經濟成長率10.2%的奇蹟。民國70 年代雖仍維持高成長，但速度已減緩。民國80
    年代經濟成長速度持續減慢，平均每年經濟成長率降為6.5%。

