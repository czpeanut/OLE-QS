- id: doc_113_高雄_五福_社會_g7s2e3_s1_43
  section: 1
  number: 43
  type: single
  page: 7
  stem: 依據資料一與相關課文內容，戰後初期（約民國40-50 年代）臺灣的社會文化現象，下列敘述何者正確？
  options:
  - label: A
    content: 鄉土文學興起，強調本土關懷與小人物的遭遇
  - label: B
    content: 政府鼓吹多元文化與族群平等的價值
  - label: C
    content: 政府推行中華文化，限制本土語言、文學的發展
  - label: D
    content: 受到嚴格的文化管制，西方流行音樂和電影都被禁止。
  group_stem: '※閱讀資料：

    資料一

    1950 年代，臺灣政治社會氣氛較為嚴整，但是當時政府對於西方文化的管制較鬆，美國流行文化如好萊塢電影、流行樂在臺灣盛行一時。此外，臺灣文學也受到西方理論的影響，抽象的現代主義理念也引進臺灣文學界。

    資料二

    此時期（民國60 年代）我國外交上的挫敗，使回歸本土的意識抬頭。年輕人開始質疑美國的流行文化，高唱「自己的歌」，開啟了校園民歌的時代。橄欖樹、捉泥鰍、龍的傳人等經典歌曲，紅遍臺灣大街小巷。

    資料三

    解嚴之後，臺灣的社會文化解放，發展趨向多元，產生了「另類音樂」及「新臺語歌運動」，林強、伍佰開啟臺式搖滾樂風。此外，流行音樂商業化顯著，偶像團體對青少年文化影響深遠⋯⋯。'
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 歷史
      code: 6-2
