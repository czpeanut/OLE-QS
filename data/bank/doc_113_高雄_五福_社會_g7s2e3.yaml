  type: single
  page: 7
  stem: 根據上述資料及歷史課本知識判斷，此時期美國提供美援的歷史背景與影響，下列說明何者有錯誤？
  options:
  - label: A
    content: 美國支援台灣推動十大建設，渡過能源危機
  - label: B
    content: 政府遷臺初期，臺灣面臨物資貧乏等經濟困境
  - label: C
    content: 美國基於全球反共圍堵政策，提供軍經援助
  - label: D
    content: 台灣納入反共體系，鞏固台灣國際地位
  group_stem: '資料一

    【美援產業分配統計圖】

    資料二

    美國給予臺灣經濟援助除了民生物資，還包含交通與工業的基礎建設。例如臺灣第一條高速公路就是美援的經費鋪成的，除此之外，石門水庫、西螺大橋、臺北民生社區、許多大學的校舍都有美援的貢獻。美援的到來就如及時雨，濟困扶危。
    戰後臺灣急需重建，當時政府並無重建基礎建設的資金，因此將美援的經費大量運用於電力、工礦、交通運輸等基礎建設。'
