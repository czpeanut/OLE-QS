  group_stem: '題組(二)：台灣城鄉發展不均的現象仍然存在，特別是在教育資源、醫療資源及交通建設等方面，城鄉差距仍然明顯。以教育資源為例，偏鄉地區的學校數量較少，學生常需長途通勤，師資流動率高且缺乏專業師資，導致學生在學習過程中面臨更多困難，教育品質也受到影響，且教學設備不足、課程內容不夠多元，也讓偏鄉學童在升學與未來發展上處於不利地位。此外，我國醫療資源分配不均，衛福部統計全國醫師普遍集中在西部地區，原住民、離島與高偏遠地區，有高達87.5%的鄉鎮區，醫師人數未達WHO
    公布的醫療基本需求標準，而在花東原住民區中，只有花蓮縣花蓮市、新城鎮、壽豐鄉、豐濱鄉等，及台東縣台東市、關山鎮、成功鎮等鄉鎮市有醫院，其餘鄉鎮僅有診所，顯示出縣（市）中城鄉醫療資源的懸殊差距。請參考以下表格，回答第31-33題：


