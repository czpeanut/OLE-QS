- id: doc_113_高雄_五福_社會_g7s2e3_s1_44
  section: 1
  number: 44
  type: single
  page: 8
  stem: 綜合資料二、資料三與相關課文內容，臺灣從民國60 年代到解嚴後的社會文化發展，呈現出何種重要變遷？
  options:
  - label: A
    content: 從對外關係挫敗激發本土意識，轉向解嚴後社會更加自由多元
  - label: B
    content: 民國60 年代文化保守，解嚴後全面複製西方文化模式
  - label: C
    content: 從強調反共愛國，轉向政府嚴格管制各類文化活動
  - label: D
    content: 經濟起飛導致傳統文化消失，社會價值觀趨於一致
  group_stem: '※閱讀資料：

    資料一

    1950 年代，臺灣政治社會氣氛較為嚴整，但是當時政府對於西方文化的管制較鬆，美國流行文化如好萊塢電影、流行樂在臺灣盛行一時。此外，臺灣文學也受到西方理論的影響，抽象的現代主義理念也引進臺灣文學界。

    資料二

    此時期（民國60 年代）我國外交上的挫敗，使回歸本土的意識抬頭。年輕人開始質疑美國的流行文化，高唱「自己的歌」，開啟了校園民歌的時代。橄欖樹、捉泥鰍、龍的傳人等經典歌曲，紅遍臺灣大街小巷。

    資料三

    解嚴之後，臺灣的社會文化解放，發展趨向多元，產生了「另類音樂」及「新臺語歌運動」，林強、伍佰開啟臺式搖滾樂風。此外，流行音樂商業化顯著，偶像團體對青少年文化影響深遠⋯⋯。'
