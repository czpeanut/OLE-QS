  stem: 資料中提到，臺灣經濟起飛發生在民國50年代後期，臺灣平均每年經濟成長率達9.2%，臺灣經濟型態逐漸由農業轉向工業。試問：有關於民國50年代的經濟政策，下列說明何者有誤？
  options:
