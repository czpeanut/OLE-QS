  stem: 公民課程中提到了，誘因影響著我們的選擇，關於誘因的說明，下列敘述中，何者錯誤？
  options:
  - label: A
    content: 誘因是指對於特定行為具有促動效果的刺激，從目的來看可分為正向誘因與負向誘因
  - label: B
    content: 不同誘因的加入會影響我們選擇，導致機會成本改變
  - label: C
    content: 提高報酬或提高懲罰稱為正向誘因，降低報酬或減少懲罰稱為負向誘因
  - label: D
    content: 民眾購買節能家電，政府最高補助現金5000元政策，屬於正向誘因。
