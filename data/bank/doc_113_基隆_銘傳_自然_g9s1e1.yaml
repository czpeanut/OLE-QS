  group_stem: '<21-23為題組>

    # 200公尺是田徑運動中的一項短跑競技，比賽方式為在400公尺跑道於彎道上起跑，最後在終點的直道結束，且選手全程需跑在各自跑道上，不可搶道或偏離。短跑加速過程占總競技的時間比例不多，根據統計，大部分選手在200公尺短跑過程中，約在第55~100公尺區間達到最高速率，之後速率會逐漸下降，因此只有少數運動員能在200公尺項目上跑出比他在100公尺競技中更快的平均速率。部分選手在衝向終點前的50公尺則又會提高速率。至西元2021年為止，200公尺短跑世界紀錄為牙買加運動員尤塞恩·博爾特所創下的19.19秒。


