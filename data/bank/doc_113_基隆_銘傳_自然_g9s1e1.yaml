- id: doc_113_基隆_銘傳_自然_g9s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '某物體作直線運動，其速度-時間關係圖（v-t 圖）如圖所示。

    小銘、小傳及小龍分別對此物體運動提出看法，其敘述如下：

    小銘：在$5\sim 10$秒與$10\sim 15$秒，這兩段時間內，物體移動距離和運動方向相同。

    小傳：在$15\sim 20$秒間，物體做等速度運動。

    小龍：在$0\sim 5$秒與$5\sim 10$秒，這兩段時間內，物體位移相同，但速度方向相反。

    請問：根據以上三人敘述，下列何選項為對？'
  options:
  - label: A
    content: 三人均合理
  - label: B
    content: 只有小銘及小傳合理
  - label: C
    content: 只有小銘合理
  - label: D
    content: 只有小傳合理。
