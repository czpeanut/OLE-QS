    大約3億年前的臺灣島還在海底時，海洋堆積厚厚的碳酸鈣珊瑚礁與海洋生物的遺骸，經千萬年累積與堆壓，沉積物進行固結、膠合與硬化，形成大理石的前身—石灰岩。石灰岩又被上層堆積物覆蓋埋入很深的地下，受地熱及上層堆積物影響，石灰岩開始變成大理岩。接著造山運動把深埋地底的大理岩推出海面，不斷向上抬升，加上豐沛雨量，形成山快速上升，數百萬年來河水持續的侵蝕切割，太魯閣這片厚厚大理石岩層在立霧溪切割下，因為大理岩結構緊密不易崩落，便形成垂直的峭壁、緊逼河道的太魯閣大理岩峽谷。


