- id: doc_113_高雄_中山_英語_g8s2e3_s2_33
  section: 2
  number: 33
  type: single
  page: 3
  stem: What does the wind do in the poem?
  options:
  - label: A
    content: It paints pictures in the sky.
  - label: B
    content: It plays with kites and birds.
  - label: C
    content: It tells stories to children.
  - label: D
    content: It hides behind the clouds.
  group_stem: 'I saw you toss the kites on high

    And blow the birds about the sky;

    And all around I heard you pass,

    Like ladies'' skirts across the grass-

    Oh, you, a-blowing all day long,

    Oh, you, that sing so loud a song!


    I saw the different things you did,

    But always you yourself you hid.

    I felt you push, I heard you call,

    I could not see yourself at all —

    Oh, you, a-blowing all day long,

    Oh, you, that sing so loud a song!


    Oh, you that are so strong and cold,

    Oh, blower, are you young or old?

    Are you a beast of field and tree,

    Or just a stronger child than me?

    Oh, you, a-blowing all day long,

    Oh, you, that sing so loud a song!

    ~adapted from the poem by Stevenson, Robert Louis (1850-1894)

     toss 拋 beast 野獸 adapted 改編'
