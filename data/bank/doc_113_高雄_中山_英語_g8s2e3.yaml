- id: doc_113_高雄_中山_英語_g8s2e3_s2_30
  section: 2
  number: 30
  type: single
  page: 2
  stem: Why do big ships hurt the sea?
  options:
  - label: A
    content: They go too fast.
  - label: B
    content: They carry people.
  - label: C
    content: They throw trash into the sea.
  - label: D
    content: They make big waves.
  group_stem: 'Why does the Earth look so blue? It''s because of the sea. The sea
    covers 70% of the Earth. The sea gives food to people, and people can do fun things
    on the sea. But the human uses may also hurt the eco-system under the sea. If
    we''re not careful, one day we may no longer be able to get anything good from
    the sea.

    First, fishing hurts the sea a lot. People fish in many parts of the ocean, and
    every year, many sea animals die because of it. Second, people playing on the
    beach hurts the sea as well. Some beaches are even turned into hotels. All of
    the human activities there hurt not only the sea but also sea animals. Finally,
    the big ships also hurt the sea. When they sail on the sea, they may throw garbage
    or waste into the sea. This pollutes the water and kills marine life.  eco-system
    生態系統 sail 航行 pollute 污染 marine life 海洋生物'
