  section: 2
  number: 39
  type: single
  page: 4
  stem: During an earthquake, where is usually the safest place to stay?
  options:
  - label: A
    content: Near windows.
  - label: B
    content: In the kitchen.
  - label: C
    content: In the corner of the room.
  - label: D
    content: Outside the building.
  group_stem: 'On December 26, 2004, a very strong earthquake hit South Asia. It was
    the strongest earthquake in the past 40 years. It was 256 times more powerful
    than the 921 earthquake in Taiwan. This earthquake caused huge tsunamis that hit
    12 countries. Many people died, and many buildings were destroyed. Over one million
    people lost their homes. It will take many years to rebuild these places.

    Sadly, scientists still don’t know exactly when or where earthquakes will happen.
    So, it is very important to know how to stay safe. When an earthquake happens,
    first open the doors and windows. Stay in the corner of the room because that
    is usually the safest place. Use your hands to protect your head. Stay away from
    windows, so you don’t get hurt by broken glass. Don’t forget to turn off the gas.

    After the earthquake stops, go to an open space. Do not use the elevator because
    the power might go out. It is important for everyone to practice earthquake drills
    at home, at school, and in public places. This way, you will know what to do when
    a real earthquake happens.

     tsunamis 海嘯 destroy 破壞 drill 演習'
