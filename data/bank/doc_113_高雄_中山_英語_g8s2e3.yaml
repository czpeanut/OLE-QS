- id: doc_113_高雄_中山_英語_g8s2e3_s3_42
  section: 3
  number: 42
  type: single
  page: 5
  stem: （克漏字第42格）
  options:
  - label: A
    content: some
  - label: B
    content: all
  - label: C
    content: both
  - label: D
    content: one
  group_stem: 'There was a man who had four sons. He wanted 42. of them to learn something
    from a pear tree far away. The first son went to look at the tree in winter, the
    second 43. in spring, the third 43. in summer, and the youngest 43. in fall. When
    they all went and came back, he called them together to tell him what they had
    seen.

    The first son said the tree was ugly and weak. The second son said it was covered
    with green buds and full of hopes. The third son said it was filled with blossoms,
    and they smelt so sweet and looked so beautiful. The 44. son said, "it was ripe
    and full of life; 45. of the pears looked so delicious; we could make a lot of
    money selling them."

    The man then said to his sons that they were all right because 46. of them had
    seen but only one season in the tree''s life. He told them that they can''t judge
    a tree by only one season. In the same way, never judge a person too quickly.
     judge 判斷'
