  group_stem: Everyone knows we only have one Earth. But many people use too much
    energy, like electricity, water, and gas every day. To keep the Earth clean and
    beautiful for the future, we should try our best to do something. For example,
    we should turn off the lights when we leave a room. We can take short showers
    instead of long baths. We should take the bus or MRT more often and drive less.
    When we go shopping, we can bring our own bags instead of using plastic ones.
    We should also recycle things like paper, plastic bottles, glass, and clothes.
    All the above are not difficult tasks for us. We just need to change our bad habits
    and try harder. That way, saving our earth isn't only a dream.  electricity 電
    tasks 任務
