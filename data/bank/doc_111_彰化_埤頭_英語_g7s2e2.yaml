  group_stem: 'How to Make a Marshmallow Sandwich?

    What do you need for one marshmallow sandwich?

    1. Two brownies

    2. Two cups of marshmallows

    3. Some apples

    4. Some strawberries

    5. Some cookies

    How do you make it?

    1. Roast marshmallows over fire.

    2. Put a marshmallow between the two brownies.

    3. Cut the apples and strawberries into small pieces.

    4. Put the small pieces of apples and strawberries in the marshmallow.

    5. Put some cookies on the top of the sandwich.

    6. Enjoy your marshmallow sandwiches.

