  group_stem: "【D】\nOnce a bird fell in love with a whale. And a whale fell in love\
    \ with a bird.  The bird loved the whale's beautiful smile. He loved the way she\
    \ swam in the sea so beautifully. The whale loved the bird's handsome white feathers.\
    \ She loved to watch him fly in the sky. And they both loved to eat lots of little\
    \ fish. All summer, the bird and the whale met at the beach. They talked about\
    \ the moon, the tides, and the ships on the sea. The bird told jokes and made\
    \ the whale laugh. The whale sang beautiful songs and made the bird cry. Everything\
    \ was perfect.\n\n      Then the cold days came, the whale needed to move to warmer\
    \ water. “Come with me to warm water,” said the whale. “It’s a wonderful place.\
    \ It's always warm, and there are so many fish to eat.” Then the whale tried to\
    \ teach the bird to live in the sea. The bird followed the whale and went down\
    \ into the water, but he soon couldn’t breathe. He came back to the beach and\
    \ felt like dying. And it was the whale’s turn to fly in the sky. She squeezed\
    \ her eyes and flapped her fins, just like the bird. She flapped and flapped,\
    \ up and down. “I'm flying! I'm a bird!”  But when she opened her eyes, she wasn't\
    \ flying in the sky. She was still in the water. She tried and tried and tried\
    \ again, but she could not fly.\n\n     “You can't fly, and I can't swim, where\
    \ can we live together?” said the bird. “You love to swim deep in the sea. That\
    \ is your favorite thing to do.” he said. “And you love to fly in the sky. That\
    \ is your favorite thing to do.” she said.  Because the bird and whale loved each\
    \ other so much, they said goodbye. But they never forgot each other. Every time\
    \ the whale saw a bird flying high in the sky, she thought of her bird. She hoped\
    \ he was enjoying the skies. And every time the bird saw a whale swimming in the\
    \ sea, he thought of his whale. He hoped she was enjoying the sea.\n\n       \
