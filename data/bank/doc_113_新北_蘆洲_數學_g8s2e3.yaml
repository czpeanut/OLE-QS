  section: 1
  number: 17
  type: single
  page: 2
  stem: 有四位同學很有想法，他們針對四邊形的面積説出自己的算法，請問誰的說法是錯誤的？
  options:
  - label: A
    content: 勇千：菱形面積是兩對角線相乘除以二。
  - label: B
    content: 言臣：梯形面積是高乘以兩腰中點連線段長。
  - label: C
    content: 駁虞：箏形面積是兩對角線乘積的一半。
  - label: D
