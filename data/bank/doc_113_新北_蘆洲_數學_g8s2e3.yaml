  type: single
  page: 3
  stem: 如圖，平行四邊形 $ABCD$ 中，$E$、$F$ 兩點分別在 $\overline{BC}$ 與 $\overline{CD}$ 上。若 $\angle
    AEB=\angle AFD=90^\circ$，$\overline{AE}=11$，$\overline{AF}=12$，以下為舒圍、冬悍、梓易與橙漢四位同學的推論，判斷他們的推論何者正確？
  options:
  - label: A
    content: 舒圍：∵$\angle AEB=\angle AFD=90^\circ$，利用等角對等邊的概念∴$\overline{AB}=\overline{AD}$。
  - label: B
    content: 冬悍：∵$\overline{AF}>\overline{AE}$，利用大邊對大角的概念，∴$\angle D>\angle B$。
  - label: C
    content: 梓易：∵$\angle C＋\angle EAF=180^\circ$，∴四邊形 $AFCE$ 為箏形。
  - label: D
    content: 橙漢：∵$ABCD$ 是平行四邊形，∴$\angle D=\angle B$ 又 $\angle D＋\angle 1=\angle B＋\angle
      2=90^\circ$，故 $\angle 1=\angle 2$。
