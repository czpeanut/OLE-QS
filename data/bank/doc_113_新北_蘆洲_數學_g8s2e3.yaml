- id: doc_113_新北_蘆洲_數學_g8s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '楊洋老師出題：下列四組數字，

    (甲)1、$\sqrt{2}$、$\sqrt{3}$，(乙)$3^{2}$、$4^{2}$、$5^{2}$，

    (丙)17、16、17，(丁)5、$\sqrt{29}$、2

    可否用來組成三角形？若可又是何種三角形？

    老師請四位同學各選一個選項來回答，以下是四位回答的結果，請問誰的說法是錯誤的？'
  options:
  - label: A
    content: 偽詳：甲可以組成三角形，是直角三角形。
  - label: B
    content: 哨童：乙可以組成三角形，是直角三角形。
  - label: C
    content: 鍇蠔：丙可以組成三角形，是等腰三角形。
  - label: D
    content: 品城：丁可以組成三角形，是直角三角形。
  tags:
