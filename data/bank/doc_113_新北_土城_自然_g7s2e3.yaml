- id: doc_113_新北_土城_自然_g7s2e3_s2_38
  section: 2
  number: 38
  type: single
  page: 3
  stem: 有關兩種造礁生物相關描述，何者錯誤？ [4-5]
  options:
  - label: A
    content: 由珊瑚蟲所造的礁岩稱為珊瑚礁
  - label: B
    content: 由珊瑚藻所造的礁岩稱為藻礁
  - label: C
    content: 珊瑚蟲是消費者而珊瑚藻是生產者
  - label: D
    content: 珊瑚藻與珊瑚蟲生長的環境皆為淺海區
  group_stem: "(二) 請閱讀下列文章，並回答問題：\n藻礁有事嗎?\n    國際海洋保育組織「Mission Blue」已於2019年將大潭藻礁列入全球「希望熱點」，證實大潭藻礁具有世界級自然遺產的價值。學者紀錄到一級保育類動物柴山多杯孔珊瑚、紅肉ㄚ髻鮫以及白海豚。一般珊瑚蟲所造的珊瑚礁每年約僅增長\
    \ 1 公分，而淡紅色的殼狀珊瑚藻所造的藻礁更是龜速，約每十年才增加 1 公分(表一)。桃園藻礁是這一片沙岸七千年來緩慢累積的珍貴產物。\n表一\n| 多孔隙礁\
    \ | 藻礁 | 珊瑚礁 |\n| --- | --- | --- |\n| 生存環境 | 沙岸 | 淺海 |\n| 造礁主角 | 殼狀珊瑚藻 | 珊瑚蟲\
    \ |\n| 礁體形成方式 | 將海水中鈣離子固定並形成碳酸鈣 | 珊瑚蟲的碳酸鈣骨骼組成 |\n\n    然而，近二十年來藻礁面臨填海造陸，然而隨著毗鄰的觀塘液化天然氣接收站竣工，更讓所處的藻礁沙岸汙染並嚴重面臨地形地貌的環境變遷。根據劉靜榆博士估計，27\
    \ 公里的桃園藻礁，75% 已遭嚴重破壞，大園跟觀音北段藻礁幾乎死亡，僅存 25% 仍在逆境中求生。大潭藻礁儼然成為台灣經濟與環保權衡之下的犧牲!"
  tags:
    chapter:
      publisher: 翰林
      book: 七下
