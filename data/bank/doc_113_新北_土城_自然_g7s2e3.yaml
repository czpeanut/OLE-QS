  stem: 綠蠵龜在國際自然保護聯盟瀕危物種紅色名錄中列為瀕危物種。受瀕臨絕種野生動植物種國際貿易公約的保護。臺灣也是綠蠵龜重要的棲地之一，主要產卵地為澎湖、蘭嶼、小琉球及南沙群島的太平島。雌龜會在沙灘產卵，並將卵埋在沙子中，利用沙子的溫度使卵孵化。特別的是，孵化的綠蠵龜性別會受到溫度的影響，較溫暖的沙灘通常會孵出雌龜。下列敘述何者正確？[5-3]
