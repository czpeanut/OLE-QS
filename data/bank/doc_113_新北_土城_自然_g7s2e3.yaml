- id: doc_113_新北_土城_自然_g7s2e3_s2_35
  section: 2
  number: 35
  type: single
  page: 3
  stem: 下列關於生物交互作用關係配對中何者與怪方蟹及浮游生物相近？[4-2]
  options:
  - label: A
    content: 蝸牛與吸蟲
  - label: B
    content: 寄居蟹與海葵
  - label: C
    content: 魚鷹與魚
  - label: D
    content: 鮣魚與海龜
  group_stem: "(一)請閱讀下列文章，並回答問題：\n奇妙的龜山島海底生態\n    龜山島是一座活火山，擁有許多熱泉噴口，一百多度的高溫，煙柱和氣泡從噴口滾滾湧出。這些淺海噴口所排放濃度極高的硫以及二氧化碳、二氧化硫和硫化氫等，讓多數生物難以存活。貧瘠環境竟住著一種特別的生物「硫磺怪方蟹」。牠們擁有對抗有毒物質的生理構造。因缺乏天敵造就了上千萬支龐大的族群，維生靠的就是被噴泉高溫及物質殺死的浮游生物—「海洋飄雪」。飄雪落下時怪方蟹就會成群結隊地在海床上瘋狂進食，景象相當壯觀。\n\
    \    值得一提的是這些透光層的浮游生物死亡後，隨之團聚成海洋飄雪而沉降，其中的有機碳和無機碳也跟著一起往深海輸送，這樣的作用稱為「生物幫浦」。雖然大部分海洋雪的有機碳在水深200～1,000\
    \ 公尺間會遭細菌分解而回歸海洋，卻使得無機碳的一部分如有孔蟲外部的碳酸鈣殼體還是能沉降至海床。"
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 生物
      code: 4-2
      title: 生物間的互動關係
      chapter: 第4章 生物與環境
    textbook: 七下生物 4-2 生物間的互動關係
    labeled_by: ai
