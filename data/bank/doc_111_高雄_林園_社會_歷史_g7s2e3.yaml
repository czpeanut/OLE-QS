  number: 35
  type: single
  page: 2
  stem: 《臺灣關係法》乃為協助維持西太平洋之和平、安全與穩定，並授權繼續維持美國人民與臺灣人民間之商業、文化及其他關係。請問：美國國會是在何種背景下通過《臺灣關係法》？
