  group_stem: '【歷史題組】請閱讀下文，並回答第15～17 題：


    拉丁美洲的甲國彙集了各種地貌，隨著海拔變化而有著各種氣候型態，豐富的地理環境為該國農業提供良好的發展條件。19 世紀末，香蕉成為乙國市場上炙手可熱的嬌客，拉丁美洲許多國家都陷入香蕉熱潮，甲國也無法置身事外。當時乙國市面上最大的兩家水果公司都瞄準甲國，在乙國政府的支持下，大肆在甲國開闢香蕉園、壟斷銷售的運輸網，乙國甚至為了確保香蕉通路，多次派兵進駐甲國。這種行為被稱為「香蕉戰爭」，甲國則成為名符其實的「香蕉共和國」。'
  answer:
