  stem: 克里奧爾人又稱為「土生白人」，指的是歐洲白人在殖民地的移民後裔。此名稱在16～18 世紀出現，主要是為了與出生歐洲的「半島人」做出區隔。雖然克里奧爾人的外表、血緣，甚至經濟能力，與殖民母國出生的半島人並無不同，但他們在殖民地卻不能與半島人享有同樣的政治權利，這樣的不平等在克里奧爾人心中埋下不滿，促使其成為19
