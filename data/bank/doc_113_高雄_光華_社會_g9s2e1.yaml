- id: doc_113_高雄_光華_社會_g9s2e1_s1_48
  section: 1
  number: 48
  type: single
  page: 6
  stem: 「地名是一地居民透過對環境的認識，選擇足以代表該地的環境元素，再將這些環境元素轉換成大家認同的文字符號，故愈是微觀尺度的地名，愈與在地人群的生活密切相關。」阿善上網查詢了光華國中附近相關的古地名，發現對於該地位置的描述，多說在清領時期是隸屬於臺灣府鳳山縣打狗地區的籬仔內舊部落。根據引號內的論述判斷，古文獻描述光華國中的哪一個舊地名最接近當時學校附近的地理景觀？
  options:
  - label: A
    content: 臺灣
  - label: B
    content: 鳳山
  - label: C
    content: 打狗
  - label: D
    content: 籬仔內。
  answer:
  - D
  answer_source: answer_key_vlm
