- id: doc_113_高雄_光華_社會_g9s2e1_s1_49
  section: 1
  number: 49
  type: single
  page: 6
  stem: 根據上文澎湖「赤崁」的地名由來判斷，命名的起源方式應與右圖哪一縣市名稱相同？
  options:
  - label: A
    content: 甲
  - label: B
    content: 丙
  - label: C
    content: 戊
  - label: D
    content: 庚。
  group_stem: '【地理題組】請閱讀以下文章後，回答49～50 題。

    澎湖白沙島東北方的赤崁村，位在一個稱為崁仔頂的山丘南側，其中「崁」字源於閩南方言，意指岩壁陡直。當地地表覆蓋的玄武岩歷經長期風化後，產生許多紅土，使海崖呈現一片赤紅顏色，而有「赤崁」之名。與澎湖的赤崁不同，臺南的赤崁與平埔族有關。在荷蘭人尚未到臺灣前，臺南是平埔族赤崁社居住的地區，大致位於今日臺南市濱海的喜樹到灣裡地區。其中，平埔族語的赤崁(SAKAN)是指魚，故靠海的赤崁應為早期平埔族的漁港。'
  shared_asset: g1_49_50
  answer:
  - B
  answer_source: answer_key_vlm
