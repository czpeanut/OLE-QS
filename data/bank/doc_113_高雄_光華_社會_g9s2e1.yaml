  stem: 國歌的歌詞中往往記錄著一個國家的歷史發展與理想追求，下列分別為四個不同國家的國歌歌詞節錄，請問哪一首最可能是義大利的國歌？
  options:
  - label: A
    content: 星光燦爛之旗，願它長久飄揚，在這自由國土，勇士的家鄉。要非戰死沙場，就是兵敗投降，星光燦爛之旗，隨著捷報飄揚。
  - label: B
    content: 起來！不願做奴隸的人們！把我們的血肉，築成我們新的長城。我們萬眾一心，冒著敵人的炮火前進！
  - label: C
    content: 羅馬城眾奴隸，把光榮帶給你。遭淩夷受嘲譏，至今已數世紀；只因為久分裂，長渙散不團結。
  - label: D
    content: 溫迪亞、喜馬拉雅、亞穆納河、恆河，潺潺流水交織著樂聲。它們為你唱起讚歌，它們只尋求你的恩澤～
  answer:
  - C
