  group_stem: 'International Women''s Day

    People celebrate International Women''s Day every year on March 8. It is a special
    day to honor the hard work of women around the world. On this day, people remember
    how women fight for equal rights to education, jobs, and laws.

    This day first began over 100 years ago. At that time, many women started to fight
    for their rights. The following shows some important events in the history of
    International Women''s Day.


    Thanks to their hard work, many countries today give women the same rights as
    men. However, in some places, women and girls still face challenges. People celebrate
    this day in many ways. Some wear purple, a color that stands for women''s power
    and courage. Others share stories about women who make their lives different.
    International Women''s Day helps us remember that everyone must have respect and
    equal chances.

