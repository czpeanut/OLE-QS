  stem: ( ) How does honey stay fresh with very little water?
  options:
  - label: A
    content: It keeps germs from growing.
  - label: B
    content: It makes honey taste sweet.
  - label: C
    content: It helps bees store honey longer.
  - label: D
    content: It makes honey less fresh.
  group_stem: 'Why Honey Never Spoils

    Honey is a sweet food made by bees, and it''s famous for never spoiling. Archaeologists
    have found 3,000-year-old honey in Egyptian tombs that''s still safe to eat! So,
    why doesn''t honey spoil like other foods? First, honey has very little water—only
    about 17%, while fruits have 80-90% water. Germs need water to grow, but honey''s
    dry environment stops them. Second, honey is naturally acidic, so it is hard for
    germs to live. When bees keep honey in honeycomb cells, it is sealed and protected.
    All these make honey a bad place for anything that causes food to spoil. However,
    honey isn''t safe for babies under one year old because it may have spores that
    might make them sick, though adults are fine.

