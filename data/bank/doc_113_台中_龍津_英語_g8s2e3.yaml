- id: doc_113_台中_龍津_英語_g8s2e3_s6_45
  section: 6
  number: 45
  type: single
  page: 3
  stem: ( ) Which is true about the stereotype of "All Asians are good at math"?
  options:
  - label: A
    content: Asians don't like math.
  - label: B
    content: No one is good at math.
  - label: C
    content: It puts too much pressure on Asian students.
  - label: D
    content: It forgets that not everyone is the same.
  group_stem: 'Gender Stereotypes

    "Men don''t cry." "Women are bad drivers." You may have heard these sayings before.
    These are examples of stereotypes — ideas that people believe about a group without
    really knowing the individuals. Stereotypes are often not true for everyone.

    Another common stereotype is: "All Asians are good at math." Although it''s true
    that some Asian students do very well in school, it''s wrong to think that every
    Asian person is a math genius. People are different even they are from the same
    places. Some may enjoy math, while others may enjoy art, music, or sports. This
    stereotype puts pressure on Asian students and ignores their talents. Stereotypes
    about gender — like saying men should be strong and never cry, or that women can''t
    drive well — can also hurt people. These ideas can make men feel like they can''t
    show their feelings. They can also make people feel that women are not careful
    enough to drive, even when they are great drivers.

    So what can we do about stereotypes? First, we should remember that everyone is
    different. We need to look at people as individuals, not just part of a group.
    Second, we can speak up when we hear someone use a stereotype. Helping others
    understand the truth can stop these harmful ideas from spreading.

    individual個人 Asians亞洲人 genius天才 pressure壓力 ignore忽視 harmful有害的 spread傳播'
