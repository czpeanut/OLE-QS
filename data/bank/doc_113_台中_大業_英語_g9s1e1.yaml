  stem: What does gullible mean in the dialogue?
  options:
  - label: A
    content: Polite.
  - label: B
    content: Angry.
  - label: C
    content: Excited.
  - label: D
    content: Easily cheated.
  group_stem: "<Part A>\n\nA Scam Call\n(Sally got a call from a woman this morning.)\n\
    Woman: Is this Sally Jones?\nSally: Speaking.\nWoman: You haven't paid your cellphone\
    \ bills for the past two months. If you don't pay them right away, your telephone\
    \ service will be suspended tomorrow.\nSally: How could it be possible? I remember\
    \ paying them.\nWoman: No, you've forgotten to do it. We still haven't gotten\
    \ your payment.\nSally: Uh-oh, I must have mixed up the bills. What should I do\
    \ now? \nWoman: Just do as I tell you. First, enter your bank account number.\
    \ \nSally: Oh, wait a minute. I'll go get my bank book.\n(Sally's husband, Mark,\
    \ just came back from shopping.)\nMark: What are you looking for, dear?\nSally:\
    \ Oh, my bank book.\nMark: Why?\nSally: A woman on the phone told me that I didn't\
    \ pay my cellphone bills.\nMark: Wait, Sally! It's a scam call!\nSally: What?!\n\
    Mark: Hang up the phone!\nSally: OK. Phew, you've saved me from a big trouble.\
    \ Thank you, dear.\nMark: No problem. There's still one more thing to do.\nSally:\
    \ What's that?\nMark: I'll call 165 and report the scam.\nSally: What for? I don't\
    \ think it's necessary. We haven't lost any money.\nMark: True, but if we don't,\
    \ a lot of people may be cheated out of their money. \nSally: Then, go ahead.\n\
    Mark: Please don't be so gullible next time, dear.\nSally: OK. I'll be more careful.\
    \ I've learned a lesson.\n\n◎scam 詐騙 ◎bill 帳單 ◎suspend 暫停 ◎payment 付款額 ◎mix up\
    \ 把...弄混了  \n◎bank account 銀行帳戶"
