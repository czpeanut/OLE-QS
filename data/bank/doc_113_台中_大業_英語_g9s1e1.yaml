  stem: What is the best title for the news?
  options:
  - label: A
    content: A Good Hospital Clown.
  - label: B
    content: The Road to Healing.
  - label: C
    content: Why People Don't Laugh Much Now.
  - label: D
    content: How Laughter Can Keep You Healthy And Happy.
  group_stem: "<Part C>\n\nTalking About Laughing\n     Do you laugh often? How many\
    \ times do you laugh a day? It is possible that you do not laugh enough. Studies\
    \ show that a 4-year-old kid usually laughs 300 times a day. However, when they\
    \ get older, they laugh less. A 40-year-old man or woman may laugh only four times\
    \ a day.\n     If you do not laugh as often as you used to, open your mouth, and\
    \ laugh out loud every day because laughter is the best medicine. Ted Smith, a\
    \ doctor in New York, said that laughing exercises the heart as well as some other\
    \ parts of our body. When you laugh, you feel better in many ways. For example,\
    \ you feel more relaxed. You also sleep better.\n     Helen Anderson, a hospital\
    \ clown in Boston, said that her job is to bring joy to children in poor health\
    \ or with special needs. When she visits these children in the hospital, she tells\
    \ them interesting stories or jokes, plays music, or does magic to make them laugh.\
    \ \"My visits make them feel less scared, lonely, or bored. Some people call me\
    \ a 'clown doctor,' and they're right about that. I do my part to help the children\
    \ to heal,\" she said.  Be happy, and laugh your way to health.\n ◎laughter 笑\
    \ ◎relaxed 放鬆的 ◎clown 小丑 ◎heal 復原"
