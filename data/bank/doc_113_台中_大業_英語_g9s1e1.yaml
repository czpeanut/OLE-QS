  group_stem: "<Part B>\n\nTaboo Food\nDear Jamie,\n     I have a great time learning\
    \ English in the USA with classmates from different countries.\nToday, in our\
    \ English class, Mr. Wilson had us talk about what we eat or do not eat in our\
    \ own country, and what I learned in this class was really interesting. Here are\
    \ some examples.\nTeresa, a student from India, said that her family stay away\
    \ from beef, and that they don't eat pork, either. Most of the time, they eat\
    \ a lot of vegetables. Sometimes they eat seafood or chicken.\nJack said that\
    \ when he grew up in Vietnam, he used to eat dog meat, which he thought is a taboo\
    \ food in many other countries in the world. Vivian, the student from South Korea,\
    \ also said something about dog meat. Eating dog meat was common in her country\
    \ in the 1970s, but things are quite different now. As more and more families\
    \ keep dogs as pets, they have abandoned dog meat. And that is why fewer restaurants\
    \ in her country serve dog meat dishes now.\nJerry, who also comes from Vietnam,\
    \ said rats and insects are also delicacies in his country. I can't believe my\
    \ ears! But then Mr. Wilson told us that one culture's taboo food can be another\
    \ culture's delicacy. Though in the USA and other countries, both rats and insects\
    \ are taboo food, we should all try to understand and respect others' culture.\n\
    \                                                                            Love,\
    \   \nLucy  \n◎taboo 禁忌 ◎serve 供應 ◎delicacy 美食 ◎culture 文化◎ respect 尊重"
