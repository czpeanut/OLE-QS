- id: doc_113_台中_大甲_社會_公民_g8s2e1_s1_39
  section: 1
  number: 39
  type: single
  page: 1
  stem: '筱雅欲了解《民法》演變，查詢到以下資料——


    | 釋字第365號 |

    | --- |

    | **公布日期**：民國83年9月23日 |

    | **爭點**：《民法》就親權行使父權優先之規定違憲？ |

    | **解釋文**：《民法》第1089條，關於父母對於未成年子女權利之行使意思不一致時，由父行使之規定部分，與《憲法》第7條人民無分男女在法律上一律平等，及《憲法增修條文》第9條第5項消除性別歧視之意旨不符，應予檢討修正，並應自本解釋公布之日起，至遲於屆滿2年時，失其效力。
    |


    上述資料呈現法律的何種特性？'
  options:
  - label: A
    content: 狹義的法律依立法程序制定
  - label: B
    content: 大法官的職責在於強化法律的位階與效力
  - label: C
    content: 低位階的法律牴觸高位階的憲法時無效
  - label: D
    content: 憲法對人民權利義務的規定簡潔扼要
