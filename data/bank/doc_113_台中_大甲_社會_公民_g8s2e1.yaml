- id: doc_113_台中_大甲_社會_公民_g8s2e1_s1_36
  section: 1
  number: 36
  type: single
  page: 1
  stem: 憲法是國家所有法律的根源，具保障人民基本權最高效力之功能，國家權力行使包含立法權、行政權及司法權皆應符合憲法意旨。法律制定必須符合憲法的精神與內容，而行政機關為執行政策所訂定的命令也必須依據法律授權，因此，法律和命令不可以牴觸憲法。根據上述內容判斷，顯示憲法具有下列何項特性？
