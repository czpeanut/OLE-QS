  stem: 學者在研究埃及文獻時發現，九世紀之前埃及人的手稿主要抄寫在「莎草紙」上，九世紀之後主要抄寫在「紙」上，顯示出「紙」逐漸取代了「莎草紙」成為寫作載體。請問：關於這個現象出現的原因，下列何者最為合理？
