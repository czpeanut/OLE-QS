  section: 1
  number: 12
  type: single
  page: 1
  stem: 學生自治就是要讓學生管理自己的事情，培養有效及正確處理公共事務的能力及態度。下列各處室在學校官網公告的事項中，何者屬於學生自治的範圍？
  options:
  - label: A
    content: 學務處：班級推選優良學生代表一名，再進行全校選拔
  - label: B
    content: 輔導處：寒假職業輔導研習營的錄取名單已經公告在附件
  - label: C
    content: 教務處：2 月 21 日是國際母語日，請全校師生這一天多用母語交談
  - label: D
    content: 總務處：各班在網上提報維修的公物，會依序修護並勾選完成，請各班查看。
