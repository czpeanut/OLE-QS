  stem: 承上題，有關這起國中校園安全事件的處理方式，下列何者處理的方式較適當？
  options:
  - label: A
    content: 為維護學生權利，可透過學生自治組織決議施暴者去留
  - label: B
    content: 為使學生能在校園安全就學，應禁止施暴學生進入校園
  - label: C
    content: 施暴者對他人造成傷害，應剝奪其學習與受教育的權利
  - label: D
    content: 霸凌發生時，目睹的學生應該立即向學校老師尋求協助。
