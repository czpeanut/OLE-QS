  type: single
  page: 1
  stem: 政府開設原住民族語言能力課程，並舉辦認證測驗。右圖為 2023 年「原住民族語言能力認證測驗」的統計圖表，根據圖表內容，下列敘述何者正確？
  options:
  - label: A
    content: 原住民族語言為原住民族專屬，非族人不得考取認證
  - label: B
    content: 文化的傳承不包含語言，學習族語無法復興傳統文化
  - label: C
    content: 舉辦能力認證測驗的目的，是希望可將族語永續流傳
  - label: D
    content: 即使非原住民族，也能學習族語，以便促進文化統一。
