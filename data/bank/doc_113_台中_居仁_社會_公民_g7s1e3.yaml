- id: doc_113_台中_居仁_社會_公民_g7s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 「原住民族日」之所以訂在 8 月 1 日，就是要紀念 1994 年 8 月 1 日，原住民族在憲法上正名的歷史時刻。這意味著原住民族該怎麼稱呼自己，不再是由他人所決定，也代表著原住民族與臺灣這片土地之間有最原初、最古老的聯繫，彰顯原住民族在臺灣的特殊地位。關於原住民族的敘述，何者錯誤？
  options:
  - label: A
    content: 目前原住民族委員會認定的原住民族有 16 族
  - label: B
    content: 政府會指派代表協助管理原住民族部落共同事務
  - label: C
    content: 原住民族召開部落會議討論和決定部落重要事務，可以凝聚共識，作為族人共同遵行的依據
  - label: D
    content: 原住民族的部落領袖，其產生方式可以為同一家族世襲，也可以由部落長老推選或部落族人選舉 。
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 公民
      code: 6-2
      title: 部落的挑戰與公民參與
      chapter: 第6章 部落與公民參與
    textbook: 七上公民 6-2 部落的挑戰與公民參與
    labeled_by: ai
