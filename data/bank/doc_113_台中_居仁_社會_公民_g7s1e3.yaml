- id: doc_113_台中_居仁_社會_公民_g7s1e3_s1_45
  section: 1
  number: 45
  type: single
  page: 4
  stem: 關於上文敘述，下列何者正確？
  options:
  - label: A
    content: 吉力吉撈．鞏冠的原名標準發音要使用英語來唸
  - label: B
    content: 由文中第二段內容可知，原住民族在命名時，常會結合部落故事，與大自然較無關連
  - label: C
    content: 原住民青年陣線的行為符合原住民族運動的精神
  - label: D
    content: 我們可以從翻譯後的中文字的意義，去理解原住民的名字。
  group_stem: "日前台灣好手吉力吉撈．鞏冠在世界棒球 12 強日本轉播時出現不同的拼音方式引發熱議。原住民青年陣線在臉書發文為他正名，希望原住民族的選手和命名文化能夠被更正確的認識，吉力吉撈．鞏冠來自屏東縣瑪家鄉的排灣族，舊漢字名字為朱立人，原名則為排灣語\
    \ Giljegiljaw Kungkuan。\n    「以我的族名呼喚我」行動小組成員表示：「日本轉播用片假名去翻譯名字，那就會是用中文的字去翻，所以會產生兩層的翻譯。那也會離原本排灣族的語音有一點落差，所以我們就告訴日本的媒體朋友說，用原住民族的拼音該怎麼念。當你用錯誤中文字的意，來去理解原住民族的名字的時候，就會產生落差與誤解。原住民族的名字有很多，幾乎來自於是花草樹木或是傳說故事。」"
