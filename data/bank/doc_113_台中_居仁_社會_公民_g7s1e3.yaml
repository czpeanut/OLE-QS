  section: 1
  number: 44
  type: single
  page: 4
  stem: 根據上文，下列對於魯凱族的敘述何者最正確？
  options:
  - label: A
    content: 頭目土地屬於傳統部落領域
  - label: B
    content: 收取貢賦餽贈為族人主要收入
  - label: C
    content: 貢賦餽贈可以帶動部落經濟發展
  - label: D
    content: 魯凱族當家頭目與阿美族部落長老的產生方式相同。
  group_stem: '魯凱族的社會階級分為頭目、貴族、士（族）、平民四種，而這些身分是世襲的。

    頭目又分為當家頭目與小頭目，當家頭目的血緣命脈必須為具備當家頭目條件者，通常以長男為原則。頭目是部落的地主，擁有土地，包括山林、獵區、河流、花木、鳥獸等，皆為頭目的私有財產。頭目將財產分租給平民，平民有必須繳納穀糧以及食物的義務；而頭目再將貢賦透過餽贈的方式，回送一部分給需要救濟的平民，以達聚落內社會財富的再分配。'
  tags:
