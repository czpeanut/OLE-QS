  section: 1
  number: 35
  type: single
  page: 3
  stem: '在學校公共事務的處理過程中，我們可以透過學生自治的途徑來形成共識，透過班會中會議的討論，讓意見充分表達。為了讓學生明瞭提案和動議兩者的差異，老師請學生寫成比較表後進行批閱，表中敘述何者正確？

    |  | 提案 | 動議 |

    | :--- | :--- | :--- |

    | 提出時機 | 在開會時進行提案 | 會議進行中提議 |

