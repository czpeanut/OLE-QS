- id: doc_113_台中_居仁_社會_公民_g7s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 布農族獵人王光祿因狩獵遭法院判刑引發社會議論，在此案發生之前，排灣族蔡忠誠因為自製獵槍，也曾引發原住民傳統文化與法律衝突的爭議。學者建議透過訂立專法方式，讓原住民定義、經營自己的傳統文化與生活習慣。原住民族的狩獵傳統，在現今常因為持有獵槍而遭法辦，使得傳統狩獵文化發展受到限制。請問：應該如何解決此一問題較佳？
  options:
  - label: A
    content: 透過學者的力量與政府溝通
  - label: B
    content: 不惜衝撞法律也要繼續維護傳統狩獵文化
  - label: C
    content: 為遵守法律，放棄原有的傳統文化
  - label: D
    content: 透過部落公民參與的方式表達意見，尋求共識。
  tags:
    chapter:
      publisher: 翰林
