  section: 2
  number: 50
  type: single
  page: 5
  stem: 能夠代表國家參加奧運比賽，無論是否得獎，都是國家的驕傲與榮耀。不過在風光的背後，選手的付出鮮少被注意到。在進入國家培訓之前，選手要自行負擔請教練的費用、場地費、設備等等。加入國家代表隊後，每個月會有3
    萬元的津貼，但未包含勞健保。我國選手奪牌後，除了獲得榮耀之外，依國光體育獎章及獎助學金頒發辦法，獲得金牌者可得2000 萬元獎金。除了給予獎金外，其他國家還提供其他福利，像南韓獎牌得主可以免當兵，德國提供終身免費啤酒，白俄羅斯提供香腸吃到飽。根據上文，下列敘述何者正確？
  options:
  - label: A
    content: 金牌得主得獎的榮耀可以抵銷機會成本
