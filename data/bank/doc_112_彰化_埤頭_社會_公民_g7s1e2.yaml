  stem: 灰姑娘媽媽過世後，其家庭型態如何轉變？
  options:
  - label: A
    content: 大家庭→小家庭
  - label: B
    content: 小家庭→重組家庭
  - label: C
    content: 大家庭→單親家庭
  - label: D
    content: 小家庭→單親家庭
  group_stem: ※灰姑娘仙杜瑞拉是出生於一個貴族家庭的獨生女，可是她的母親於她童年時去世，她的父親認為她需要一位母親的照顧，於是他另娶同是寡婦的崔梅恩夫人。崔梅恩夫人有兩名為崔西里亞和安泰西亞的女兒，但女兒們都不喜歡仙杜瑞拉，因為她非常漂亮，所以經常欺負她。當仙杜瑞拉的父親過世後，情況變本加厲，崔梅恩夫人更與兩女兒及寵物貓魯斯佛站同一陣線，仙杜瑞拉擔任僕人一角，然而她和老鼠及鳥成為好朋友。請問：
