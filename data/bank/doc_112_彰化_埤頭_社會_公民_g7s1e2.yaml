  section: 1
  number: 1
  type: single
  page: 1
  stem: 獨留 7 歲兄妹在內睡覺！車門大開鄰居急尋家長。事後終於找到孩子母親，原來對方一直在家裏，表示當時她因為要搬東西上樓，而小孩又在睡覺，無奈只好讓他繼續睡。
  options:
  - label: A
    content: 經濟功能
  - label: B
    content: 教育功能
  - label: C
    content: 生育功能
  - label: D
    content: 保護與照顧功能
  group_stem: ※家，是一種宿宿，是心冷治的港灣，它可以給任何一個人溫暖的感覺。家，絕對不單單是指一個能睡覺，能吃飯地方，有人這樣給我解釋過家的含義：有愛的地方才叫家。家有溫暖，家有馨香。家，是停靠的岸，家，是溫柔的船。家，是我們緩解壓力的場所；家，是我們傾訴心事的地方。有家，就有安全感；有家，才有歸屬感。家庭最主要的功能有(A)經濟功能
    (B)教育功能 (C)生育功能 (D)保護與照顧功能。判斷下列各題是在討論家庭的何項功能？
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
