  group_stem: 1980 年代初期，臺灣電影受到香港電影新浪潮的影響，進入「臺灣新電影」時期。「新電影」發展初期的導演與編劇，在劇本創作上融入鄉土文學的題材，拍攝風格以強調自然、寫實為主，在題材的選用上，開始有意識的挑戰官方政治禁忌，而受到相關單位的關切。例如「新電影」初期代表作《兒子的大玩偶》，在正式上映前，因電影片段中呈現臺北違建林立等有礙政府形象的畫面，遭官方施壓要求刪減，此事件後來被稱為「削蘋果事件」。
