  section: 1
  number: 14
  type: single
  page: 1
  stem: '下圖是民國 96 年達達全家到臺灣外島旅遊時，在當地港口看到之告示。


    每日往返兩岸班次：

    【地點】→福州馬尾：下午 14：00

    福州馬尾→【地點】：上午 09：15

    ◎注意事項：

    請於開船時間前 1 小時， 至各港口購票及辦理登船手續。因關係旅客上下船等各種因素，上述為預估時間，正確時間還是以當日現場狀況為準。


    請問：圖中的【地點】最不可能是下列哪一個？'
