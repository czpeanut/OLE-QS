- id: doc_111_桃園_中興_英語_g9s1e1_s4_25
  section: 4
  number: 25
  type: single
  page: 3
  stem: 'Zac wants to try 16/8 intermittent fasting. He usually has his first meal
    at 8 a.m. And then he goes to work at 9 a.m. He has to work for at least 8 hours
    every day.

    According to the guide, which of the following is TRUE?'
  options:
  - label: A
    content: He can eat dinner after work.
  - label: B
    content: He can have afternoon tea at 3 p.m.
  - label: C
    content: He can’t drink any drinks with sugar.
  - label: D
    content: He can’t eat lunch at noon.
  group_stem: 'A GUIDE TO 16/8 INTERMITTENT FASTING

    ■ What is 16/8 intermittent fasting?

    It''s an old, traditional way of diets in many regions and cultures.


    ■ How can people do 16/8 intermittent fasting?

    People can only eat balanced diets within 8 waking hours per day. For the rest
    16 hours, they eat nothing and only drink water or other no-calorie drinks.


    ■ Why should people do 16/8 intermittent fasting?

    16/8 intermittent fasting is believed to make you healthier. For example, people
    practicing this kind of fasting can lose weight, burn fat, control blood sugar,
    and even live longer.


    ◆guide 指南 ◆intermittent 間歇性的 ◆fast 斷食 ◆region 地區 ◆calorie 卡路里'
  shared_asset: g4_25_26
  ai_answers:
