    ___(23)___ If you send an e-mail without encrypting it, anyone can steal it from
    your cellphone or computer. Also, your e-mail passwords may be recorded by some
    malicious software. So, you should change your passwords and update your anti-theft
    software more often. ___(24)___ example to save you from online theft is that
    almost every online mall will send you a double-checking password after you finish
    your shopping on their websites. In this way, they can make sure whether you are
    the real “you.”

