- id: doc_112_台北_誠正_社會_公民_g7s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: '下列有關社會救助與社會保險的比較，何者正確？


    | | 社會救助 | 社會保險 |

    | :--- | :--- | :--- |

    | (A)目的 | 分散生活風險 | 維持人民基本生存 |

    | (B)對象 | 全民 | 弱勢團體 |

    | (C)實例 | 全民健康保險 | 低收入戶補助 |

    | (D)方法 | 有需要時向政府申請 | 必須先繳交固定費用 |'
  options:
  - label: A
    content: (A)目的：社會救助為分散生活風險，社會保險為維持人民基本生存
  - label: B
    content: (B)對象：社會救助為全民，社會保險為弱勢團體
  - label: C
    content: (C)實例：社會救助為全民健康保險，社會保險為低收入戶補助
  - label: D
    content: (D)方法：社會救助為有需要時向政府申請，社會保險為必須先繳交固定費用
