- id: doc_112_台北_誠正_社會_公民_g7s2e3_s3_34
  section: 3
  number: 34
  type: single
  page: 5
  stem: 從上文中電影拍攝的契機說明判斷，下列何者最適用用來說明？
  options:
  - label: A
    content: 以個人努力反映弱勢群體的困境
  - label: B
    content: 加入民間團體以監督政府的政策
  - label: C
    content: 以實際行動直接參與政策的制訂
  - label: D
    content: 透過連署活動支持所關心的議題。
  group_stem: "閱讀下列報導，並回答問題：\n顛覆傳統刻板印象！《做工的人》喚醒社會對工人的尊重\n    2020 年有一部電視劇《做工的人》，為一本書所翻拍而成，以勞工階級為題材的製作。劇中由鐵工兄弟阿祈、阿欽、板模工昌仔和怪手阿全為主軸，描述了他們的生活樣態、喜怒哀樂，也解釋了他們的外在表現是如何形成社會刻板印象。但在他們備受歧視的同時，不論是體恤超商工讀生的辛勞，或是對於彼此之間的情義相挺，卻也是現代都市社會中，少見的人性光輝。這群人面對的各種困境，一直幫人做工蓋房，自己卻只能望樓興嘆。\n\
    \    有著各種人生難題的他們，努力用堅持的方式活著。但，只是再怎麼樂觀，如果期待的希望一直事與願違，還能怎麼撐下去？\n    「這社會要求他人有尊嚴活著的，幾乎都是不需為下一餐煩憂，並且收入穩定的人。」原作者林立青在書中的這句話，或許正能總結整本書，想要傳達給自己同溫層外的訊息。他與這本作品的出現，讓我們開始看見「做工的人」，也提醒了生活在水泥叢林的我們，應該對於這群長久被忽視的「叢林培育者」，相應的尊重與疼惜。\n\
    \    「我其實是要大家關心這群工人，大家才會為他們著想。」原作者坦言，在台灣許多人的刻板印象中，工人往往是「不讀書」、「做苦工」的印象，而且工人的專業往往都不受重視，但是在國外，例如德國，工人的社會地位是很高的，薪水也非常的優渥，「這是台灣應該去顛覆的價值觀和社會現象。」\n\
    \    在過去工業化階段的台灣社會，藍領階級是社會發展的主力，工人融入大家的日常生活，而所謂的知識份子很稀少，並不像現今資本化的台灣已採取新興的產業模式，外表光鮮亮麗的服務業、商業和白領階級成為社會的主力，以至於對比之下工人的外表顯得太不精緻，與社會趨勢違背而受到歧視。而工人的薪資和權益停滯，也有許多人面臨工作不穩，讓更多人藉由菸、酒和檳榔等來紓解壓力，卻造成人際和家庭關係上的問題，更造成社會對他們的負面觀感。\n\
    \    畢竟，在鏡頭下所看見的這群小人物，都是台灣社會的縮影，無論是面對生活或工作的各種困境，他們努力地用自己的方式生存下去，她說，《做工的人》是一部喜劇基調的劇，「因為我所認識的工人朋友，更多時候是在照顧別人，並用一種樂天的方式去面對生活逆境。」"
