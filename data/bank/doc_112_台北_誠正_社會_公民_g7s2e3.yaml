  group_stem: "閱讀下列報導，並回答問題：\n社會福利制度─全民健保\n    全民健康保險於1995 年開辦，透過自助、互助制度，將全體國民納入健康保障。凡具有中華民國國籍，在臺灣地區設有戶籍滿6\
    \ 個月以上的民眾，以及在臺灣地區出生之新生兒，都必須參加全民健保。基本保險費依每月薪資按照保險費率計算，並由被保險人、雇主、政府分攤，對於弱勢族群的保險費及部分負擔則由政府補助或減免。\n\
    \    全民健保的給付範圍包含所有必要的醫療，包括門診、住院、牙醫、中醫以及處方藥品，就醫時繳交定額的部分負擔，其餘的醫療費用由全民健保支付。因此，民眾就醫無須擔心醫療費用，健保保障民眾可以獲得完整的醫療照顧，安心就醫。\n\
    \    全民健保的財源主要來自保險費收入，並以量能負擔為原則，對於部分特定弱勢族群，如低收入戶、中低收入戶、身心障礙者、無職業原住民、失業勞工及其眷屬等，則由政府給予部分或全部之應自付保險費之補助；對於未符合補助資格且繳費有困難者，亦提供無息貸款、分期繳納或轉介公益團體多項協助繳納保險費措施。\n\
    \    就醫時，保險對象可自由選擇就診之醫療院所，門診時只需自付少許的門診部分負擔。住院時則根據入住之急性或慢性病房別、住院天數長短，自付總住院醫療費用5-30%的住院部分負擔，在保險有效期間，凡發生疾病、傷害事故或生育，皆可憑健保卡至醫事服務機構接受完整醫療服務。\n\
    \    小可目前與祖父、祖母、媽媽、哥哥同住。小可的爸爸在數年前過世，只靠媽媽打工維持家庭生計；伯父具有身障身分，以販售公益彩券維生；小可因罹患先天性心臟疾病，經常進出醫院，幸好有政府的社會福利制度協助，才能勉強度過經濟上的難關，雖然小可的哥哥下課後，都會盡快完成自己的課業，幫忙做家事與照顧祖母，但他對於小可的病情與課業協助感到無力。"
