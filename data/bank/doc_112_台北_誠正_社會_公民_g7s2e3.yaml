  stem: 2022 年因全球能源危機導致各國電費飆漲，台灣也在7 月調高4 年來凍漲的電價，對無法購入節能設備、家中電線老舊的弱勢家庭而言，無疑是更沉重的負擔。臺灣世界展望會因而推動「點亮偏鄉希望」計畫，協助能源弱勢家庭更換耗能設備，並宣導節能與防災減碳。請問，上述內容主要體現何種促進公平正義的方式？
  options:
  - label: A
    content: 透過個人力量的發揮，讓能源弱勢家庭不被拋棄
  - label: B
    content: 透過公司企業的贊助，讓兒童都能學習節能知識
  - label: C
    content: 透過民間團體的投入，讓弱勢者得到更多的照顧
  - label: D
    content: 透過政府政策的落實，讓每個人得到均等的機會。
