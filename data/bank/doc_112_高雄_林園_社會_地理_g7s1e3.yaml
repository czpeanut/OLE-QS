  stem: '根據下表及(地理圖六)天氣即時預報社群發布的氣象預報顯示全台各地陰霾偶雨，下列何者最有可能代表作者所描述之降水類型？


    東亞寒潮爆發！寒流「最強時刻」即將來臨                     (2023  12/21  15:10 發佈)

    今天是寒流影響的第二天，雖然外頭的冷風已經感到很刺骨，但更冷的天氣，還在後頭。

    從衛星雲圖中，可以看到台灣周遭雲系眾多，其中包含：

    ▍雲街(Cloud street)：冷空氣與相對暖的海水相遇，形成一列列的雲系，這是冷空氣偏強的特徵。

    ▍南方水氣：鯉魚颱風(NO.15)前身，高空暖濕氣流北上。

    這兩股雲系，一個代表冷空氣極強、一個使天氣陰霾有雨，都更加深本次寒流的威力。

    由於冷空氣勢力範圍廣大，這一次寒流的特點是「冷得很久」。    節錄自＜FB 天氣即時預報＞'
