- id: doc_113_高雄_翠屏_國文_g9s1e2_s4_30
  section: 4
  number: 30
  type: single
  page: 5
  stem: 根據本文，下列關於比薩斜塔的資訊，何者正確？
  options:
  - label: A
    content: 建築師一開始就有意要把塔蓋成傾斜狀
  - label: B
    content: 傾斜的原因除了地質外，還有人為疏失
  - label: C
    content: 比薩斜塔是利用沼澤的泥土建造而成
  - label: D
    content: 塔的一、二層蓋好時，外觀尚未傾斜。
  group_stem: "最能帶給人快樂的古蹟（節錄）   張國立 \n  比薩是座小城，吸引我來的原因就是斜塔。 \n  這麼一座秀麗的大理石塔，竟然歪歪扭扭地出現在平穩莊嚴的大教堂旁，實在不搭調，可是也夠震撼的。它像是上帝故意那樣歪歪斜斜地插進地球上，好顯示上帝也熱愛喜劇似的。\
    \ \n  廣場上全是觀光客，都重複地進行三種動作。第一種是試著和斜塔站在同一條地平線上，大多是老美，於是人得向一邊傾斜，從相機的鏡頭裡看，嘿，人和塔是正的，四周的教堂反而是斜的。第二種動作是一排的日本觀光客，每個伸出雙手放在前一個的背上，最前面的一個則做出推塔的模樣。從相機的鏡頭裡看，嘿，他們正用盡氣力扶住塔，免得它倒下。第三種動作是臺胞的區區在下我，倒立在廣場的草地上，從相機鏡頭裡看，不知是塔斜、教堂歪，或本人最筆直，簡直像是丟了一地的積木。\
    \ \n  原來斜塔不僅是觀光點，更是遊戲區，而且無論來自哪一國，都樂歪牙地在草地上玩。比薩的斜塔是最能帶給人快樂的古蹟。 \n  書上說，這座可愛的塔原是附屬於主教教堂的鐘塔。1173\
    \ 年開始動工，建到第三層便傾斜，主因是比薩的地層原是沼澤，不穩固。而比薩人並未因此停工，而是邊建邊修，試圖把它上面的部分建成直的，可惜沒成功，等完成之後，它已經是斜塔了，傾斜達到1.4\
    \ 公尺。 \n  義大利人蓋教堂，會在旁邊建塔，不能有教堂而無塔，這可能是比薩人堅持將塔蓋下去，不管它斜不斜的動機。什麼時候塔會倒呢？一次大地震或大風暴就成了。各國為了搶救這座人類重要的遺產，在塔上安裝鋼纜圍住塔的腰部，再將鋼纜拉到四周，穩固住塔身。我很奇怪，花了上億美元來搶救斜塔，為什麼沒有人怪當年比薩人硬要蓋出這個塔的頑固呢？\n\
    \  坐在塔下的草地許久，愈看塔愈有趣，它像在嘲諷我們這群可憐的人，辛苦工作存錢來看它，只為了它和其他的塔不同，有夠荒謬。 \n(注：比薩：城市名，位於義大利西部，跨亞諾河兩岸，因有比薩斜塔而著稱。)"
