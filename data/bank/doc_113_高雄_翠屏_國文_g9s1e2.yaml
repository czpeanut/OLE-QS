- id: doc_113_高雄_翠屏_國文_g9s1e2_s4_32
  section: 4
  number: 32
  type: single
  page: 5
  stem: 根據本文，下列關於京都的敘述，何者正確？
  options:
  - label: A
    content: 西芳寺開放整理青苔的工作，但須事先以明信片預約申請
  - label: B
    content: 京都佛寺大多保持原木色調，不同於中國 唐 宋佛寺的風格
  - label: C
    content: 京都約有兩千間佛寺，其中有十七處佛寺被列為世界文化遺產
  - label: D
    content: 嵐山一帶的嵯峨野地區不論新舊建設或土地開墾，都需經過核可。
  group_stem: "經典佛寺的傳承藝術（改寫）   吳中傑 \n  全京都內約有兩千間的佛寺和神社，而京都內有十七處文化景觀被聯合國列入世界文化遺產，其中更高達十三處都是佛寺，要認識京都文化，無法略過佛寺不談。\
    \ \n  京都大部分的佛寺都有濃濃的唐 宋風格，完全是木造建築，而且不同於中國近代許多寺廟，修復後習慣在木頭上上紅漆或黑漆，京都的寺廟幾乎保留著原木色調，搭配素淨的黑瓦，更能感到純樸的古風。\
    \ \n  日本人對古蹟保存與修復相當用心，時常花數個月到數年的時間，封閉整座寺院，進行修復。甚至有的寺院，採預約參觀制，以維護古蹟和周邊的自然環境。例如以寺院布滿青苔，而得「苔寺」之名的西芳寺，參訪前便須以明信片預約。而且每天閉院後，會有成群工作人員，蹲伏於地爬梳、整理青苔！\
    \ \n  除此之外，京都的古蹟能保存得好，還在於不只是單一建築的保存，而是整片區域的完整保護。例如京都著名風景區  \n──嵐山一帶的嵯峨野地區，被政府列為「風致地區」，也就是保留區，凡是有建築物要新建、改建、增建，或要進行土地開墾，木竹採伐，甚至是變更建築物的色彩，都需要得到市長的許可。因此在保留區內的天龍寺、大覺寺等，便受到良好的保護。所以相對於曾發生文化大革命的中國、以及佛教後來式微的印度，日本的佛寺建築，可以說更為完整而原汁原味。"
