  group_stem: "東京夢華錄（節錄）  孟元老 \n  南通一巷，謂之「界身」，並是金銀綵帛交易之所，屋宇雄壯，門面廣闊，望之森然，每一交易，動即千萬，駭人聞見。以東街北曰潘樓酒店，其下每日自五更市合，買賣衣物書畫珍玩犀玉。至平明，羊頭、肚肺、赤白腰子、奶房、肚胘、鶉兔鳩鴿野味、螃蟹、蛤蜊之類。訖，方有諸手作人上市，買賣零碎作料。飯後飲食上市，如酥蜜食、棗䭅、澄砂團子、香糖果子、蜜煎雕花之類。向晚賣河婁頭面、冠梳領抹、珍玩動使之類。\
    \ \n(注：①森然：整肅、不可侵犯的樣子。②市合：開市。③平明：天剛亮的時候。④腰子：腎臟的俗稱。⑤胘：音ㄒㄧㄢˊ，牛胃。⑥棗䭅：一種麵食。䭅音ㄏㄨˊ。⑦河婁：指粗陋之物或贗品。亦作「何樓」。⑧領抹：領巾一類的物品。)"
