- id: doc_113_高雄_翠屏_國文_g9s1e2_s4_34
  section: 4
  number: 34
  type: single
  page: 6
  stem: 根據文章第二段內容推測，下列何項敘述最有可能接近目前韓國真實狀況？
  options:
  - label: A
    content: 韓國目前狗肉餐館只有1600間
  - label: B
    content: 韓國目前的食用狗飼養場多於1150間
  - label: C
    content: 韓國目前飼養的食用狗約57 萬隻
  - label: D
    content: 韓國肉犬協會在總統辦公室所在的龍山區放走200 萬隻狗以示抗議。
  group_stem: "南韓150 萬隻末代「食用狗」面臨安樂死威脅     改寫2024/8/20 網路新聞 \n    韓國國會於今年初以208 票贊成、2\
    \ 票棄權，通過全面禁止食用、銷售、屠宰狗隻法案，並於今年頒佈，設3 年寬限期，2027 年正式實施，違法屠宰者最高刑期3 年，飼養、銷售食用狗者最高刑期2\
    \ 年，最高罰款3000 萬韓元，吃狗肉則無罰則。 \n    韓國當地及國際動保團體對法案均表示歡迎，但動保團體同時非常憂慮這些原被人飼養來屠宰進食的狗隻未來何去何從。據韓國政府統計，至2023\
    \ 年為止韓國全國食用狗飼養場約1150 個，屠宰業者34 家，經銷商219 家，狗肉餐館大約1600 間。韓國農業部估計，至2022 年4 月為止，韓國飼養的食用狗約57\
    \ 萬隻，此數字未計非法飼養的數量；而韓國農民協會則稱，法令會影響全國3500 處養狗農場與3000 家餐廳，現時飼養狗隻的數目約為150 萬隻。韓國肉犬協會等業內人士早前就因為憂慮今後生計，揚言要在總統辦公室所在的龍山區放走200\
    \ 萬隻狗，以爭取延長寬限期及提高賠償，可見現時韓國全國食用狗數目非常龐大。 \n    有韓國動保團體指出，法案推出後未見政府有足夠的保護所來安置狗狗，這些「末代食用狗」因而面臨安樂死的威脅。韓國動物權動保KARA\
    \ 與韓國月稱寺廣論教室向南韓總統尹錫悅發出請願書《請給韓國末代食用狗隻免於死亡恐懼和痛苦的生活！》，以及共同發起聯署，希望韓國政府能提出相關配套措施保護這些末代食用狗。\
    \ \n    動保團體在聯署書內提出數項訴求，包括全面進行「食用狗」登記、頒佈補償政策，以引導飼養場不要在三年過渡期內快速宰殺狗隻；促請政府爲保護狗隻追加財政預算、增加並擴建食用狗隻庇護所，及補助慈善團體參與建立安置保護設施的運作。但目前只有1\
    \ 萬8 千人參與聯署，離聯署通過門檻5 萬人仍有極大差距，故動保團體呼籲大眾幫忙轉發聯署訊息並踴躍上網參與聯署。 \n(中文聯署網址：https://shorturl.at/fcqEB)"
