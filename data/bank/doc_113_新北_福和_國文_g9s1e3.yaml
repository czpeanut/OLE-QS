  stem: 「『喂─出來！』一個年輕人朝著洞裡大喊一聲，卻沒有任何回音傳上來。接著，他撿起一旁的小石子，打算丟進去。『這樣會有報應的，快住手！』一位老人出聲制止，但是年輕人仍使勁的將小石子丟入洞裡。然而，依舊沒有任何回音傳上來。於是村民砍了樹，綁上繩子後作成柵欄，圍住洞口，接著暫時回到村裡去。」根據這段文字，下列敘述何者正確？
    【L9】【白話詩文閱讀單題】
  options:
  - label: A
    content: 「年輕人仍使勁的將小石子丟入洞裡。」感受到年輕人愈挫愈勇的精神
  - label: B
    content: 「這樣會有報應的，快住手。」表示老人行事謹慎，對未知的事物常心存敬畏
  - label: C
    content: 年輕人豪氣干雲、躍躍欲試，與老人的槁木死灰、畏首畏尾，形成強烈的對比
  - label: D
    content: 「村民砍了樹，綁上繩子後作成柵欄，圍住洞口」是為了防止洞口逐漸擴大。
