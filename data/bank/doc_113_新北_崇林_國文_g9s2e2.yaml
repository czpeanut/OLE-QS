  group_stem: "我跟后羿的婚姻，我如何吃了靈藥而飛升到月亮上，因為實在發生了太久，所以眾說紛紜，但我有我的理由。 \n后羿是一個好人，他陽光又健康，身材一流，牙齒雪白，永遠沒有煩惱，他就算把十個太陽都射了也不妨事，我相信他整個人的動力就足以讓世界運轉。而且，他非常愛我，他從西王母那裡得到長生不老藥時，第一個就來找我，興奮得話都有點說不連貫：「從此，從此以後，我們兩人，可以永永遠遠地在一起了！這一生這一世我們永遠屬於彼此！妳永遠屬於我！永遠在一起，妳，和我！永遠！」我當時露出柔情似水的表情把頭埋在他胸前，但，當天晚上我就睡不著了。\
    \ \n在床上翻來覆去，我揮之不去的想法是，我是喜歡后羿，他的陽光開朗英雄男子氣概，哪裡不好？我喜歡跟后羿在一起的時光，但因為他是個英雄，常十天半月不回家，與自己相處我更加自在，我喜歡已婚身分，但我更喜歡老公是英雄很忙，帶來的自由時光。\
    \ \n我想通了，萬一我們都長生不老，要不是我要再聽兩千年他如何射掉九個太陽的英雄事蹟，不然就是他去找新的英雄事蹟做。不管怎樣，這事都讓我想起來就忍不住要尖叫，所有人在談戀愛的時候都說希望能永遠在一起，但我們大家心知肚明那一定是有個期限的，即使不分手也會死掉，七世夫妻至少每一世都算重新來過。同一個男人，永永遠遠長生不老？不，天啊千萬不要，從來都說危機會考驗人的感情，但我沒想到，永久喜樂的許諾，才是更大的考驗。\
    \ \n我說：「但我覺得，你知道，萬一有一天我們厭煩了彼此，這，你懂我意思吧？」他忽然臉一垮：「妳不愛我嗎？妳不想永遠跟我在一起嗎？妳是不是厭煩了我？」我忽然脫口而出：「是沒錯！」然後想都沒想一口就把手上的長生不老藥給吞了。\
    \ \n我就這樣來到了廣寒宮，宮裡有許多仙子供我差遣，吞了藥以後我不只擁有仙法和不老的容顏，而且我想下凡還是可以做到，月宮裡連寵物都有，是可愛的兔子，李商隱說嫦娥應悔偷靈藥，他錯了，老娘可一點也不後悔。\
    \ \n然後有一天他們送一個男人到了月亮上來，去砍那永遠也砍不斷的桂樹，他的名字叫作吳剛。我看著他揮汗奮力砍樹的背肌，心想，過兩天清淨的日子怎麼就這麼難呢？I\
    \ want to be alone 啊！ \n節錄自陳祺勳〈嫦娥：「過兩天清淨的日子怎麼就這麼難呢？I want to be alone 啊！」〉"
