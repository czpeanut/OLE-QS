    content: 京劇小生在演出時使用真假音結合的方式發聲
  - label: B
    content: 京劇中旦角的聲音比小生更剛勁挺拔
  - label: C
    content: 京劇小生的嗓音比武生更寬厚飽滿
  - label: D
    content: 小生一詞在京劇上的定位和日常生活的使用截然不同
  group_stem: "小生這個詞好理解，我們日常生活中一直頻繁使用，什麼英俊小生、奶油小生……這個和他在京劇的定位基本差不多。 \n京劇小生這個行當很有意思，雖然演繹的都是青年男性主人公，卻有和女性演員一樣的音高，使用獨特的真假聲結合的發聲方法。假聲，也叫「小嗓」，比較尖、細、高、亮，這樣從聲音上就和老生、武生別開來，可是小生的假聲和旦角又不同，聽起來要更寬厚、更飽滿，更寬、更亮，有一種剛勁挺拔的感覺。\
    \ \n小生角色        。比如群英會中周瑜的年齡比諸葛亮還大，可諸葛亮是老生，戴髯口，周瑜卻是小生。這是為什麼呢？在京劇舞臺上，決定某個角色應該歸屬於哪個行當的時候，不光看角色的生理年齡，更關心這個人物身上展現出的氣質特徵。諸葛亮雖然年輕，可是沉穩老練，符合老生特點，而周瑜雖然年長，卻好勝心強，神采飛揚，更像個翩翩少年，所以由小生來扮演。\
    \ \n節錄自梅若蘅〈小生〉"
