  group_stem: "一顆珍珠\n朋友自香港帶來一串珠鍊送我，珍珠顆顆光澤柔和，渾圓美麗。我不禁出神地看著，這樣圓潤可愛的珍珠真是由一粒粗糙的沙礫形成的嗎？當小小的蚌安詳地憩歇在海底，突然一個打擊臨到牠，一粒沙子嵌進肉中，痛得牠昏天黑地，牠抗拒不了，排斥不了，只有強忍著撕裂一般的痛苦，撫著傷口，一點點分泌出光滑的真珠質來層層包容這個侵入牠生命中的「苦難」。年年歲歲，漫長的忍耐，無盡的辛酸，那一粒醜陋的沙礫已變成美麗的珍珠。眼淚化作歡笑，痛苦的代價成就了榮耀的光彩。在十九世紀的初葉，法國的路易斯．勃萊爾幼年時眼睛意外受傷，被一根針刺中，不幸失明，飽受黑暗摸索的痛苦。他有強烈的求知欲，卻受不能閱讀之困，為了克服障礙，也為了造福其他和他同樣命運的盲人，他一再地試驗，忍受無數的失敗，終於在一八三四年，以針在厚紙上刺出符號，發明了盲人專用的點字法，這是一項突破性的大貢獻。同樣是一根針，曾經使他失去光明，卻也因此帶給億萬盲人光明和希望，多麼奇妙的轉變！很多時候，我們只看見不幸的表面，流血的創口，受傷的心，我們只會埋怨、訴苦、哀憐不滿。不知道通過苦難的試煉，痛苦的經歷，淚水的洗滌，神會使一個無用的生命發出不朽的光輝，粗糙的沙礫變成無價的珍寶。\n\
    手的故事\n    我曾有過一雙美麗的手。白皙柔軟，十指纖纖，許多人都羨慕、讚賞過，我也深以擁有這樣一雙手為榮。然而，曾幾何時，十指的關節一個個在病魔的侵蝕下逐漸腫大、彎曲、僵硬，變得古怪而醜陋。望著這雙不再美麗的手，我常不免黯然神傷！直到我聽到一則有關手的故事。德國的大藝術家杜瑞，從小就有天分，然因家貧，無力拜師，只有去做學徒，他和另一學徒極其友好，兩人都有志到巴黎去學雕塑，卻都限於環境，難展抱負。最後兩人商議，由其中一人做工供另一人留學進修，學成後再彼此交換。對方讓杜瑞先去，可是，幾年後當杜瑞功成名就歸來時，卻發現朋友的一雙手因長年的粗活變得粗糙笨拙，再也無法做精細的雕塑了，杜瑞為之痛心不已。但就在當天夜裡，他卻聽見好友這樣的禱告：「主啊！感謝你，當初先去的是杜瑞。」杜瑞捧著這雙為他犧牲的手，感動得流下淚來。他把這雙手畫了出來，這就是那幅名畫〈祈禱的手〉的來歷。蔣故總統經國先生也曾提到，在他小時，蔣公常常訓示他，做人不要掌心向上，向人乞憐，要隨時不忘掌心向下，給人幫助救援。\n\
    \    這兩個故事給我極深的啟示。雖然我的手不再美麗，但我希望它多學習一點付出的功課，在別人危難時及時伸出援手，但願這也是一雙懂得安慰的手，禱告的手。那麼就是它的外表再醜點有什麼關係呢？"
