  stem: 請根據上下文，推論文中最後一行「兩腳書櫥」成語的意思，與選項何者的意思最接近？
  options:
  - label: A
    content: 書呆子
  - label: B
    content: 學歷高的人
  - label: C
    content: 學以致用的人
  - label: D
    content: 目不識丁的人。
  group_stem: 人生無處不可學習，不是只有坐在教室中，正襟危坐，手放在背後，兩眼直視的聽講才是學習。孔子說：「三人行，必有我師焉。」不管這三個人是什麼人，他一定有我所不知的東西，只要「不恥下問」，縱使沒有進過學校也可以成大器，更何況在生活中學到的知識比課本中的更有用，課本的知識必預先經過內在認知的轉換才能變成生活中的知識，如果轉換不成功，這個知識就是死的知識，除了考試，沒有任何用途。這是為什麼先進國家的教育都極力生活化，因為只有生活化的知識才可實際應用，才能舉一反三達到創造發明的功效。過去我們一直偏重教室中學習的結果，造就出很多四體不勤、五穀不分、不知民間疾苦的高材生，在學士滿街跑的臺灣，2003
    年SARS 來時竟然會舉國瘋狂相信偏方，不但相信綠豆湯、鳳梨可以抗「煞」，更相信午夜子時熬的綠豆湯才有效。臺灣充斥著騙錢騙身的神棍，而受害者不一定是沒有念過書的文盲，大學生被騙的比比皆是，難道我們現在的兩腳書櫥還不夠多嗎？
