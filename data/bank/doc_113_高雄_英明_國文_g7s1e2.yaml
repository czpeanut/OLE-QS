- id: doc_113_高雄_英明_國文_g7s1e2_s6_19
  section: 6
  number: 19
  type: single
  page: 6
  stem: 請解讀以上内容，下列敘述何者正確？
  options:
  - label: A
    content: 在捲裹雞腿的鋁箔紙上刺洞，是為了讓中藥湯滲入
  - label: B
    content: 這道菜食用時，雞腿有可能以圓片形狀呈現
  - label: C
    content: 雞腿的鹹味最主要是來自醬油
  - label: D
    content: 泡雞腿的中藥湯由雞汁、蔘鬚、紅棗、當歸、鹽、水蒸煮而成。
  group_stem: '食譜

    材料：土雞腿2 支、蔥2 根、薑1 小塊，當歸、茶鬚、枸杞各少許，鋁箔纸、冰開水。

    调味料：A.鹽、雞粉少許、米酒2 大匙。   B.水1.5 杯、紹興酒2 杯、鹽1/2 大匙。

    作法：

    ① 以刀背拍蔥和薑，混合A 調味成醃料備用。

    ② 雞腿去骨洗淨瀝乾，以醃料抓拌，靜置30 分鐘後，取出2 支雞腿交錯，以鋁箔紙捲緊成圓筒狀，兩頭扭緊，並用牙籤刺些小洞，置電鍋內鍋中。

    ③ 電鍋外鍋加2.5 杯水，蒸至開關跳起，蒸出的雞汁留鍋內，取出雞腿放入冰水中泡涼後，去除鋁箔紙。

    ④ 外鍋加1 杯水，內鍋中除雞汁外，加1.5 杯水、1/2 大匙鹽及當歸、蔘鬚、枸杞，蒸好取出放涼。

    ⑤ 中藥湯冷卻後加入紹興酒，將放涼的雞腿泡入，置冰箱冷藏一天，即可取出雞腿切片排盤食用。'
- id: doc_113_高雄_英明_國文_g7s1e2_s6_20
  section: 6
  number: 20
  type: single
  page: 6
  stem: 白種元要檢查學員為這份食譜所做的筆記，哪一位學員沒有出錯？
  options:
  - label: A
    content: 權聖晙：要拿醬油醃製雞腿
  - label: B
    content: 金美玲：醃製過程要放冰水
  - label: C
    content: 尹南諾：此道菜名為冰醉雞
  - label: D
    content: 姜勝元：可在燒烤料理大全裡找到。
  group_stem: '食譜

    材料：土雞腿2 支、蔥2 根、薑1 小塊，當歸、茶鬚、枸杞各少許，鋁箔纸、冰開水。

    调味料：A.鹽、雞粉少許、米酒2 大匙。   B.水1.5 杯、紹興酒2 杯、鹽1/2 大匙。

    作法：

    ① 以刀背拍蔥和薑，混合A 調味成醃料備用。

    ② 雞腿去骨洗淨瀝乾，以醃料抓拌，靜置30 分鐘後，取出2 支雞腿交錯，以鋁箔紙捲緊成圓筒狀，兩頭扭緊，並用牙籤刺些小洞，置電鍋內鍋中。

    ③ 電鍋外鍋加2.5 杯水，蒸至開關跳起，蒸出的雞汁留鍋內，取出雞腿放入冰水中泡涼後，去除鋁箔紙。

    ④ 外鍋加1 杯水，內鍋中除雞汁外，加1.5 杯水、1/2 大匙鹽及當歸、蔘鬚、枸杞，蒸好取出放涼。

    ⑤ 中藥湯冷卻後加入紹興酒，將放涼的雞腿泡入，置冰箱冷藏一天，即可取出雞腿切片排盤食用。'
