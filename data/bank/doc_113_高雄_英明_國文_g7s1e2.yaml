- id: doc_113_高雄_英明_國文_g7s1e2_s6_2
  section: 6
  number: 2
  type: single
  page: 3
  stem: 「人為什麼要善良？這是我聽過最棒的答案。亞馬遜網路商店創辦人貝佐斯，在2010 年普林斯頓大學畢業典禮上，為全體畢業生所發表的演講中說道：『聰明是一項天賦，善良是一種選擇。』每個人都擁有他的天賦，讓天賦發光似乎相當可行，然而，選擇做一個善良的人，更是不容易。」根據文意，下列何者可以作為這段話的註解？
  options:
  - label: A
    content: 因為當善良的人太累，所以選擇獨善其身就好
  - label: B
    content: 一個人若找到屬於自己的天賦，就能趨近善良
  - label: C
    content: 每個人都可以選擇變成善良的人，只要他願意
  - label: D
    content: 世界上最難之事，無非是找到屬於自己的舞臺。
