  type: single
  page: 6
  stem: 根據本文的内容，下列標題何者比較貼切其主旨？
  options:
  - label: A
    content: 人生的幸福完全取決於自己
  - label: B
    content: 所有的煩惱來自於人際關係
  - label: C
    content: 不為了滿足他人的期望而活
  - label: D
    content: 人最終目的是認真活在當下。
  group_stem: '阿德勒是與佛洛伊德、榮格並列心理學的三巨頭，其「個體心理學」又稱「勇氣的心理學」，是探討人如何勇敢的變得幸福的哲學。以下為書中的一些重點：

    1.世界很單純，人們主觀的定義使其變複雜而自尋煩惱，同樣一件事情因定義不同，可以是好事也是壞事。

    2.主觀的想法就像墨鏡，要快樂自在，就須要有「勇氣」。

    3.人是可以改變的：過去發生的事情無法決定未來，而是取決於「目的」。簡而言之，人想做什麼都是可能的，不要歸咎於過去、環境，把自己困住。

    4.阿德勒心理學否認「心理創傷」的存在，一件事情是創傷還是經驗，會因定義不同而有不同結果。一個人決定要如何生活及看待自己的人生，都是他自己選擇的。

    5.人會捏造憤怒的情緒，有些人會為了大聲吼叫的「目的」而製造憤怒的情緒。因為情緒是隨著「目的」而完全可以控制的，情緒只是達成目的的「藉口」。

    6.阿德勒認為人可以不受「情緒」及「過去」控制，經歷過什麼事情不是重點(客觀) ，重點是我們要如何看待、解釋這件事(主觀)。人並非是受制於過去的原因而行動，而是朝向自己決定好的目的而行動。

    7.每個人都為自己認為的「善」而行動，但這個自認為的「善」是依自己的價值觀跟想法而產生，未必是普世價值認可的善，也可能會導致自己「不幸」。                            (摘錄自被討厭的勇氣)'
