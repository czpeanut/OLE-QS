    除去偏見行為？首先，人們應從現今資料顯示的偏見狀況中，意識到生活中存在許多偏見，從而促使己身反省並剔除偏見行為，才可給人工智慧乾淨不帶偏見的資料數據。」根據上述内容，下列何者最符合這段文字的觀點？
