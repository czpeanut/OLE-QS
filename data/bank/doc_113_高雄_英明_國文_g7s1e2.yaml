- id: doc_113_高雄_英明_國文_g7s1e2_s5_4
  section: 5
  number: 4
  type: single
  page: 1
  stem: 下列「 」中的字，何組詞性兩兩相同？
  options:
  - label: A
    content: 譬如「平」地／夷為「平」地
  - label: B
    content: 三「省」吾身／返鄉「省」親
  - label: C
    content: 天壤之「別」／何以「別」乎
  - label: D
    content: 登高「望」遠／德高「望」重。
- id: doc_113_高雄_英明_國文_g7s1e2_s5_5
  section: 5
  number: 5
  type: single
  page: 1
  stem: 「桃李」除了指「桃花、李花」外，也可用來指「學生」 或「姿色的美豔」之意。下列各選項的「桃李」， 何者是指 「學生」的意思？
  options:
  - label: A
    content: 南國有佳人，容華若「桃李」
  - label: B
    content: 「桃李」不言，下自成蹊
  - label: C
    content: 令公「桃李」滿天下，何用堂前更種花
  - label: D
    content: 「桃李」春風一杯酒，江湖夜雨十年燈。
- id: doc_113_高雄_英明_國文_g7s1e2_s5_6
  section: 5
  number: 6
  type: single
  page: 1
  stem: 下列「」中的詞語，何組詞義兩兩相同？
  options:
  - label: A
    content: 他「躊躇」半天，還是無法下決定／他昂首闊步，一副「躊躇」滿志的樣子
  - label: B
    content: 出門在外，幸好有朋友「料理」，省事不少／在黑白大廚的節目中，我們看到五花八門的「料理」
  - label: C
    content: 我們應盡責守分，不要想占人「便宜」／這件衣服打完折後真「便宜」
  - label: D
    content: 要有自己的想法，不要輕易被別人「左右」／我們無法「左右」天氣，但是可以調整心情。
- id: doc_113_高雄_英明_國文_g7s1e2_s5_7
  section: 5
  number: 7
  type: single
  page: 1
  stem: 「譬如平地，雖覆一簣，進，吾往也。」這句使用的修辭法，和下列何者相同？
  options:
  - label: A
    content: 天空陰沉沉的，彷彿要下雨了
  - label: B
    content: 如法炮製，無法獨樹一幟
  - label: C
    content: 鞋是雙腳最溫暖的家，有了它，雙腳不會再受寒
  - label: D
    content: 他們看似自由，卻心陷囹圄。
  lesson_raw:
    title: 論語選
    basis: 引用《論語》選句
- id: doc_113_高雄_英明_國文_g7s1e2_s5_8
  section: 5
  number: 8
  type: single
  page: 2
  stem: 在傳統習俗上，「死亡」太過沉重，許多人因此避諱直說，而改以其他說法委婉表達，比如以「大去」來表達離世。下列各文句「」 中的詞語，何者情況為尚未死亡？
  options:
  - label: A
    content: 王爺爺「日薄西山」又膝下無子，十分悲涼
  - label: B
    content: 黛玉年紀輕輕就「香消玉殞」，實在可惜
  - label: C
    content: 突如其來的疫情，使他「溘然長逝」
  - label: D
    content: 大師於清晨已「圓寂」，留給弟子無限追思。
- id: doc_113_高雄_英明_國文_g7s1e2_s5_9
  section: 5
  number: 9
  type: single
  page: 2
  stem: 語言和文字會隨著時代而演變，因此有時所指稱的事物相同，但古今用語卻不同，下列「 」中的現代用語，何者替換後意思相同？
  options:
  - label: A
    content: 擔任「里長」期間，他兩袖清風、視民如傷，大受老百姓的愛戴／百里侯
  - label: B
    content: 她計劃環遊世界已經多年，但是因「旅費」不足，一直未能成行／盤纏
  - label: C
    content: 周刊爆料，某球星因涉嫌打假球而轉隊，還祕戀大富翁的「女兒」／紅娘
  - label: D
    content: 網路交友平台儼然是現代人的「媒人」，可惜卻遭到詐騙集團濫用／千金。
- id: doc_113_高雄_英明_國文_g7s1e2_s5_10
  section: 5
  number: 10
  type: single
  page: 2
  stem: 下列關於《論語》文句的文意配對，何者錯誤？
  options:
  - label: A
    content: 己所不欲，勿施於人／推己及人
  - label: B
    content: 三人行，必有我師焉／有朋自遠方來，不亦樂乎
  - label: C
    content: 譬如平地，雖覆一簣，進，吾往也／鍥而不舍，金石可鏤
  - label: D
    content: 譬如為山，未成一簣，止，吾止也／行百里者半九十。
  lesson_raw:
    title: 論語選
    basis: 論語選
- id: doc_113_高雄_英明_國文_g7s1e2_s5_11
  section: 5
  number: 11
  type: single
  page: 2
  stem: 關於《論語》選三則的作法，下列何者有誤？
  options:
  - label: A
    content: 子游問孝一則，孔子透過「今之孝者，是謂能養」及「犬馬皆能有養」的比較，凸顯孝親的真義
  - label: B
    content: 譬如為山一則，孔子以對比手法呈現主題，強調學習要持之以恆，關鍵是「操之在己」
  - label: C
    content: 吾日三省吾身一則，曾子以連續問句反思自己在進德修業上是否盡心
  - label: D
    content: 三則皆透過師生一問一答的方式，探討道理，言簡意賅，發人深省。
  lesson_raw:
    title: 論語選
    basis: 課名《論語》選
- id: doc_113_高雄_英明_國文_g7s1e2_s5_12
  section: 5
  number: 12
  type: single
  page: 2
  stem: 在餐會中，主持人加碼，誰能正確地介紹《論語》，就可獲得獎金一千元。大家莫不摩拳擦掌，躍躍欲試。請問下列何者能上台領取獎金呢？
  options:
  - label: A
    content: 意青：《論語》各篇的篇名是取首章開頭的一、二句來作為篇名，有其特殊含意
  - label: B
    content: 建銘：是孔子講學時的教科書，由孔子及其弟子、再傳弟子記述編輯而成的
  - label: C
    content: 慶玲：就形式上來看是對話，全書二十篇，是中國最早的語錄體著作
  - label: D
    content: 長輝：內容為孔子與國君及時人談論、應答的語錄。
  lesson_raw:
    title: 論語選
    basis: 論語選作者/題解常識
- id: doc_113_高雄_英明_國文_g7s1e2_s5_13
  section: 5
  number: 13
  type: single
  page: 2
  stem: 〈背影〉一文的寫作手法分析，何者敘述完全正確？。
  options:
  - label: A
    content: 首段以「開門見山法」開頭，末段採「勸誡法」結尾，深刻表達作者的風木之思
  - label: B
    content: 作者對於父親攀爬月臺的背影著墨最深，宛若電影的特寫鏡頭
  - label: C
    content: 以「過去—現在—過去」的時間結構，描寫父親送作者搭火車的經過
  - label: D
    content: 以父親的立場敘述對兒子無微不至的關愛，字裡行間流露出為人父的喜悅與望子成龍的期待感。
  lesson_raw:
    title: 背影
    basis: 課名〈背影〉
- id: doc_113_高雄_英明_國文_g7s1e2_s5_14
  section: 5
  number: 14
  type: single
  page: 2
  stem: 〈背影〉一文中的文意解讀，下列分析何者正確？
  options:
  - label: A
    content: 「事已如此，不必難過，好在天無絕人之路」是作者用來安慰父親的話，表達孺慕之情
  - label: B
    content: 文中提及「紫毛大衣」、「朱紅的橘子」、「黑布大馬褂」、「深青布棉袍」都是象徵父愛的溫暖
  - label: C
    content: 「我心裡暗笑他的迂，他們只認得錢，託他們真是白託」說明作者對父親關愛的舉動表示不以為然
  - label: D
    content: 作者看到父親買橘子的模樣寫道：「這時我看見他的背影，我的淚很快地流下來了」是感傷父子相聚之日所剩無多。
  lesson_raw:
    title: 背影
    basis: 課名〈背影〉
- id: doc_113_高雄_英明_國文_g7s1e2_s5_15
  section: 5
  number: 15
  type: single
  page: 2
  stem: 關於〈心囚〉的文意說明，下列何者正確？
  options:
  - label: A
    content: 「比起我，到底誰更像是囚犯呢」說明作者認為「所有的人都像是囚犯」
  - label: B
    content: 「多的是行動自如，卻找不到正確人生方向的人」屬於「身囚，心不囚」
  - label: C
    content: 「有些人看似生活得繁華熱鬧，卻往往是天底下最寂寞的人」是因為他們自私自利
  - label: D
    content: 「一個人只要能突破心靈的枷鎖，這個世界就再也沒有什麼能困住他的了」代表心為一身之主。
  lesson_raw:
    title: 心囚
    basis: 課名〈心囚〉
- id: doc_113_高雄_英明_國文_g7s1e2_s5_16
  section: 5
  number: 16
  type: single
  page: 2
  stem: 關於〈心囚〉一文的寫作手法，下列選項何者有誤？
  options:
  - label: A
    content: 以古今中外的名人事例為證，極具說服力
  - label: B
    content: 主旨在強調要有樂觀積極的心態突破困境
  - label: C
    content: 以正反對比的說理方式，凸顯主旨
  - label: D
    content: 全文先敘後議，首尾呼應。
  lesson_raw:
