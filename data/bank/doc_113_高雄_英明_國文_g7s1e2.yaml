- id: doc_113_高雄_英明_國文_g7s1e2_s5_1
  section: 5
  number: 1
  type: single
  page: 1
  stem: 下列選項「 」中的字，何組讀音前後相同？
  options:
  - label: A
    content: 譬如「為」山／「為」民喉舌
  - label: B
    content: 「弦」歌不輟／語帶「玄」機
  - label: C
    content: 禁「錮」在床／水庫乾「涸」
  - label: D
    content: 千「載」難逢／「載」歌載舞。
- id: doc_113_高雄_英明_國文_g7s1e2_s5_2
  section: 5
  number: 2
  type: single
  page: 1
  stem: 下列「 」中的注音寫成國字後，何組字形相同？
  options:
  - label: A
    content: 懸梁刺「ㄍㄨˇ」／一「ㄍㄨˇ」腦兒
  - label: B
    content: 眾所「ㄓㄨˇ」目／再三「ㄓㄨˇ」咐
  - label: C
    content: 手「ㄌㄧㄠˊ」腳銬／眼花「ㄌㄧㄠˊ」亂
  - label: D
    content: 功虧一「丂ㄨㄟˋ」／不虞「丂ㄨㄟˋ」乏。
- id: doc_113_高雄_英明_國文_g7s1e2_s5_3
