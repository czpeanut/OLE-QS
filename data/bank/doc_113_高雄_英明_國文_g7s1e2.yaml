  stem: 「隨著AI 越來越夯，反省思潮也開始崛起，日前亞馬遜公司擔心『AI 招募系統』歧視女性而放棄使用一事，引起軒然大波。但是研究機器智慧的台大學者指出，人們不該把責任歸咎在AI
