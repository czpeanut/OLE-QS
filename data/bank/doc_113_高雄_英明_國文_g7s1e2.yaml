- id: doc_113_高雄_英明_國文_g7s1e2_s6_8
  section: 6
  number: 8
  type: single
  page: 4
  stem: 作者認為當一個智者，首先要具備什麼條件？
  options:
  - label: A
    content: 謠言止於智者
  - label: B
    content: 促成同溫層效應，以獲得支持
  - label: C
    content: 無確定訊息的正確性，寧可不分享
  - label: D
    content: 要擺脫這個時代的各種民粹。
  group_stem: "這個時代的訊息太多元、太零散，瞬息萬變的科技風險以及應接不暇的資訊焦慮讓人太難耐，就連沒有搶到光棍節的促銷商品，都足以讓人徒呼負負、輾轉難眠。我們總是同意謠言止於智者，但是在這個時代裡面，當一位「智者」可不容易，需要擁有的技能不少，無法像過往般的簡單。在這些智者所需要擁有的基本配備裡面，恐怕首要的就是要徹底地遵行「不確定的，不分享」這個最基本守則。如果這麼基本的守則都做不到，那麼耽誤的不僅是自己的人生，更可能是別人的美好生活。\n\
    \    蘋果公司的執行長庫克在接受美國NBC 夜間新聞採訪時也指出，社群媒體已經淪為散播不實消息和操縱輿論的工具，尤其是所促成的這種「同溫層效應」，讓每個人在自己的回音中不斷地再聽見、再強化自己的聲音，鞏固自己的偏見。\n\
    \    某些訊息在許多中年人群組中廣為傳播，但是在年輕人的群組中卻乏人問津，這種同溫層之間彼此取暖及相互輝映的現象，甚至已經足以造成國安問題，如果不加以突圍，我們實在很難以擺脫這個時代的各種民粹。如果有一天，我們新一代的年輕人可以懂得判斷這些資訊，懂得掙脫同溫層的隔絕，大家的生活才有機會更美好。"
