- id: doc_113_台中_大業_社會_歷史_g8s2e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: '以下為某文件內容，試進行分析後回答問題。

    三國領袖達成共識，在德國投降及歐洲戰爭結束後兩三個月內，蘇聯應對日作戰，條件為：

    1. 外蒙古蒙古人民共和國的現狀須予維持。

    2. 由日本1904 年背信棄義進攻所破壞的俄國以前權益應須予恢復

    3. 千島群島須交予蘇聯。

    4. 有關外蒙古及上述港口鐵路的協定，尚須徵求得中國蔣介石委員長的同意。美國總統將採取行動取得該項同意。蘇聯要求在擊敗日本後將上述要求毫無問題地予與實現。

    試問，就對上述文件的分析，下列敘述哪些正確？'
