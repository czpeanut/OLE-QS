- id: doc_113_台中_大業_社會_歷史_g8s2e2_s1_29
  section: 1
  number: 29
  type: single
  page: 4
  stem: 作者認為美國左派文化呈現的DNA 與中國文化大革命相同，下列何者不是本篇文章作者認為的原因？
  options:
  - label: A
    content: 為了重構歷史記憶而解構歷史
  - label: B
    content: 大搞個人崇拜的造神運動
  - label: C
    content: 都主張暴力：砸碎舊世界，創造新天地
  - label: D
    content: 破壞現有的政府體系：砸爛公檢法、defundpolice。
  group_stem: '29~30 為題組。試閱讀下文，並分析後以回答問題。

    〈何清漣專欄：打碎舊世界創造新天地—美國文革正在進行時〉

    中國人一直在擔心文革捲土重來，卻很少有人想到它會在美國活生生再現。作為一位經歷過中國左禍且對美國左派文化日益趨向極左有所瞭解的中國知識份子，早在歐巴馬時期就已經發現美國的左派文化呈現的DNA與中國文革相同，比如為了重構歷史記憶而解構歷史，開始拆除歷史紀念物、重新以身份（如奴隸主）標準來確定傑弗遜、李將軍的歷史地位，這與中國文革的破四舊、砸毀歷史文物完全相同…我從10
    歲開始經歷了中國文化大革命，親歷過數次抄家之痛，親眼見過破四舊、批鬥、遊街、武鬥、集體屠殺，覺得有必要比較一下中美兩國文革相同的DNA。雖然中外學者一致認為，文化大革命這種浩劫只可能發生於中國，但我卻從中美兩國的文革中看到二者有相同的DNA，共同祖宗是馬克思主義的暴力革命理論：砸碎舊世界（資本主義），創造新天地…不能依靠已經由劉少奇接管並運作的政府體系（其中最重要的當然是公安、檢察、法院），因此，文革中，紅衛兵奉旨造反，第一個政治方面的大動作就是砸爛維護現存秩序的公檢法，這樣才能讓紅衛兵抓住他痛恨的政敵遊街、批鬥、肆意羞辱與懲治。這一套，在美國佛洛德之死的抗議中，成為暗中操縱這場運動者的主要訴求：DefundPolice-美國文革的砸爛公檢法，幾乎所有的大城市抗議者都舉出defundpolice（讓員警退款）的招牌口號。...中國文革的打砸搶在美國文革中再現。'
