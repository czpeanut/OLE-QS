    「在西方驚愕「中國發瘋」 (China Went Mad)之際，『事件』卻對西方社會發生了多樣性的衝擊作用，並留下了深遠的影響。『事件』期間正值西方學生展開熾熱的反越戰運動，他們(尤其是法國學生)從「A
