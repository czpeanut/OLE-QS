    團體」挑戰權威的鬥志，和政府對抗。法國學生幾乎扳倒了一向強勢的戴高樂政府，美國學生的反戰運動使詹森和尼克森政府窮於應付，並逼迫福特政府加速從越南脫身。……費正清則於〈紐約時報〉時論廣場發表一篇文章，說中國有『事件』的『內憂』，美國則有越戰的『外患』，兩個國家應該嘗試互相幫助解除對方的困境……」

    (資料來源：林博文，〈文革對西方世界的衝擊〉《中國時報》)'
