  group_stem: "選出合適的句子代碼完成篇章，句子不會重複用到，有一個句子不會用到。\n\nIn the middle of the night, a\
    \ young girl named Ottila ran away from her town because she lost her parents.\
    \ When Ottila got lost in the dark forest, she saw a big house. 38. He gave Ottila\
    \ food, drinks, and a place to stay, and they had a great time dancing together!\n\
    However, the dead head told Ottila a terrible thing: a headless skeleton came\
    \ every night and tried to take him away. 39. In the late night, the skeleton\
    \ did show up but failed to catch the dead head because of Ottila’s help. Ottila\
    \ held the dead head and ran out of the bedroom. The skeleton ran after them until\
    \ they all reached the roof floor. The skeleton walked close to them to the edge\
    \ of the wall. 40. She let the dead head go back to the bedroom, and then went\
    \ down to check the pieces. She burned the pieces to ashes. This way, no one would\
    \ bother them anymore. Finally, they could have a sweet dream.\n   41. They enjoyed\
    \ delicious food and tea. Also, they had fun together. “May I invite you to stay\
    \ at this home with me?” the dead head asked. “Sure!” answered Ottila.\n     \
    \                           headless skeleton 無頭骷顱 edge 邊緣 ashes 灰燼 bother 打擾\
    \ invite 邀請\n\nAdapted from(改編自) The Skull: A Tyrolean Folktale by Jon Klassen\n\
    (A) Ottila pushed the skeleton over the wall, and it broke into pieces on the\
    \ ground.\n(B) After a long night, Ottila and the dead head had breakfast.\n(C)\
    \ Ottila was also afraid and she asked her friend to run away.\n(D) The dead head\
    \ was really afraid and Ottila wanted to help his new friend.\n(AB) She knocked\
    \ on the door and a dead head answered."
  shared_asset: g3_38_41
  tags:
