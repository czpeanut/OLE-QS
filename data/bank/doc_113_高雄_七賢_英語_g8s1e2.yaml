  group_stem: "Should Kids Use AI to Do Schoolwork?\nAI, Artificial intelligence,\
    \ is part of our everyday lives. It can work and think like human minds. Also,\
    \ it lets our computers and cellphones work, and you may already use AI at school.\
    \ Like ChatGPT, we ask ChatGPT a question, and it gives us all information. However,\
    \ some teachers worry AI could keep students from learning on their own. We asked\
    \ our TFK Kid Reporters to talk about both sides of the case. The following are\
    \ pros and cons.\n\n[Dylan Patel - YES]: AI can change the way students learn.\
    \ Many people are afraid of chatbots because they see chatbots as a cheating tool.\
    \ But don’t worry, we have good check systems.\n\n[Harper Carroll - NO]: AI can\
    \ be a useful tool, but kids still need to be able to do easy work on their own,\
    \ not with AI. This is why kids learn how to do practice in math, even though\
    \ we have calculators.\n\n[Rose Torrey - YES]: Using AI can help build the critical\
    \ thinking, and the world needs problem-solving kids. In my view, teaching AI\
    \ at school can make the world better.\n\n[Ninis Twumasi - NO]: We shouldn’t let\
    \ AI into schools. We students can get humanity and emotion from a teacher, but\
    \ we can’t get them from AI. It is cold and some kids are not able to tell right\
    \ from wrong.\n\n[Alexa Oh - ?]: AI can lead students through questions. They\
    \ don’t just give students answers. AI can help teachers with their teaching,\
    \ too. Nobody falls behind in class! And AI can give 24/7 help for students. Students\
    \ can learn anytime!\n\n human minds 人類心智 chatbot 聊天機器人 cheating tool 作弊工具\n\
    \  systems 系統 technology 科技 calculator 計算機 critical thinking 批判性思考 humanity 仁慈\
    \ emotion 情感"
