  stem: 以下是澤村針對《史記》所做的筆記：「①編者是司馬光，西漢人，曾任太史令。②記載從黃帝到漢武帝間的歷史，是斷代史之祖。③除史實記載外，以記錄人物對話為主，為語錄體。④其語言精煉，技巧多變，對史學與文學影響甚深。」畫雙線處的筆記內容，何者正確？
