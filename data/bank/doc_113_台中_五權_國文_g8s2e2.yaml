  - label: D
    content: 透過懸疑技巧層層遞進，細筆描摹強化讀者情緒共鳴
  group_stem: "我第一次見到罐頭，是國中二年級。那時家裡剛搬進一間老舊公寓，冰箱外頭貼滿\n補習班的傳單，廚房的餐桌總是乾乾淨淨，空無一物。那年冬天格外寒冷，媽媽煮菜的\n\
    次數變少了，取而代之的是一罐又一罐來自福利中心的罐頭。紅燒鯖魚、珍味肉醬、土\n豆麵筋、什錦醬菜……我記得每一種味道，因為它們曾填飽過我飢餓的慘綠時代，也曾\n\
    讓我一度以為，「打開罐頭」就是生活的全部。\n    那時的我總覺得，罐頭是「貧窮」的象徵。媽媽卻平淡的說：「現在沒時間煮，吃\n這個也不錯。」她邊說邊用湯匙敲開蓋子，湯汁滴在桌面上，油光閃爍。我咬著罐頭裡\n\
    過鹹的魚肉，渴望的眼神卻飄向窗外鄰居家熱騰騰的飯菜。那溫馨的香味，對我而言，\n是遙不可及的奢侈。心裡不解：為什麼別人家有色香味俱全的美饌佳餚，而我們家卻只\n\
    能吃罐頭？那份不滿與失落，悄悄埋在我的青春期記憶裡。\n    直到大學，負笈北上，開始離鄉背井的生活。某天深夜，我在便利商店裡看見一整\n排色彩鮮艷的罐頭，那熟悉的排列與金屬光澤，在燈光下閃爍，忽然就把我拉回了從前。\n\
    腦中浮現媽媽匆匆張羅晚餐的身影，她總是一邊加熱罐頭，一邊催我趕快吃飯。那時的\n我只覺得她簡單草率，如今終於明白，那不是敷衍準備，而是她在疲憊繁忙中努力為我\n\
    保留的一點溫暖。\n    我挑了一罐熟悉的紅燒鯖魚，小心翼翼地打開。一口咬下，鹹味仍在，但眼淚卻幾\n乎奪眶而出。原來，真正難以下嚥的，不是罐頭的鹹味，而是我多年來對母親的誤解與\n\
    忽略。那一瞬間，我的記憶不再只停留在味覺，而是開始看見藏在每一道罐頭料理背後\n的用心與辛勞。\n    我開始領悟，罐頭不只是食物，更是時間的容器。它封存的不僅是味道，更有當時\n\
    的媽媽——拮据卻努力，疲憊卻溫柔的忙碌模樣。罐頭，是她在有限時間裡給予我的最\n大心意，是她無法陪伴我共餐時，仍希望我能吃得飽、吃得暖的柔情表達。\n  \
    \  如今，我在自己的廚房裡，偶爾也會備幾罐罐頭。不是因為懶得做飯，而是當我打\n開它們時，總會想起那個已不在身邊的媽媽。她留給我的，不只是罐頭，更是一份被時\n\
    光封存的溫暖與牽掛，是我多年以後才真正理解的母愛。\n    罐頭裡的，不只是食物，更是一段封存的時光。那時光中有鹹香的滋味，也有一位\n母親默默的愛與付出。而今已年屆不惑，我終於明白，那一罐罐的罐頭，是媽媽用來溫\n\
    熱我慘綠時代的方式，更是她用盡心力留下的愛的記號。\n──〈封存在罐頭裡的時光〉"
