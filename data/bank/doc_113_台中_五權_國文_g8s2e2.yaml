- id: doc_113_台中_五權_國文_g8s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 描述事物時，運用聯想力，移轉感官感受，可使意象更活潑、新奇。如：徐志摩〈我所知道的康橋〉以「朝來人們的祈禱，參差地翳入天聽」的「聽覺」印象來表現「炊煙上騰」的「視覺」感受。下列文句的描摹手法，何者與之完全相同？
  options:
  - label: A
    content: 經過時，常聞落果聲此起彼落，見一地綠寶石滾躺在層層疊疊的黃色枯葉上，煞是美麗
  - label: B
    content: 海天一色的亮麗景致，每每一個浪濤拍上礁石，就自然地化作一幅帶著生命律動的畫作
  - label: C
    content: 星星是靜靜的掛在空中，卻好像帶著聲音，是早晨的幽遠之鐘，也是靜夜中雄渾的鼓聲，有著清脆的節奏與閃耀的聲息
  - label: D
    content: 那王小玉唱到極高的三四疊後，陡然一落，又極力騁其千迴百折的精神，如一條飛蛇在黃山三十六峰半中腰裡盤旋穿插
  lesson_raw:
    title: 我所知道的康橋
    basis: 題幹提及徐志摩〈我所知道的康橋〉
  tags:
    textbook: 八下 第五課 我所知道的康橋
    labeled_by: ai
    chapter:
      publisher: 康軒
      book: 八下
      subject: 國文
      code: 第五課
