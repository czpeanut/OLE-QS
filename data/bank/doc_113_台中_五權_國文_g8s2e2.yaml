- id: doc_113_台中_五權_國文_g8s2e2_s2_38
  section: 2
  number: 38
  type: single
  page: 8
  stem: 親身遭遇或耳聞目睹網路霸凌時，以下何者是你可以採取的態度或措施？
  options:
  - label: A
    content: 受害者切不可忍氣吞聲，息事寧人
  - label: B
    content: 受害者以其人之道，還治其人之身
  - label: C
    content: 旁觀者附和、按讚、分享無傷大雅
  - label: D
    content: 旁觀者為自保不可告知父母或老師
  group_stem: '張釋之依法審判，讓我們體悟遵守法律的重要。網路與今日生活息息相關，在虛擬世界中，

    每個人雖可以暢所欲言，但仍須審慎使用，以免造成對他人的傷害，甚至觸犯法律。

    ※ 小心！不要成為網路霸凌的幫凶

    「若要人不知，除非己莫為。」別以為匿名就沒人知道你是誰，網友透過種種途徑，總有辦

    法找到你，警察也可透過IP 位址找到發信者。千萬不要心存僥倖，誤觸法網！

    ※ 什麼是網路霸凌？

    網路霸凌是透過網路，而產生的暴力行為。這些行為常藉社群媒體（如：Fb）、通訊軟體（如：

    Line）、部落格等為媒介，散播不實消息、辱罵或威脅來傷害他人，讓受害者心生恐懼、憤怒而

    身心受創。


    網路霸凌現象大調查

    兒福聯盟調查發現有七成四的青少年覺得網

    路霸凌情況嚴重，更有七成六的青少年在網上目睹

    或自身有遭遇網路霸凌的經驗，更進一步分析網路

    霸凌的類型如右：


    ※ 網路霸凌該負什麼責任

    | 網路霸凌行為 | 可能須負法律責任 |

    | --- | --- |

    | 在網路上謾罵他人 | 刑法第309 條：公然侮辱罪 |

    | 散播不實言論以詆毀別人 | 1. 刑法第309 條：公然侮辱罪<br>2. 刑法第310 條：誹謗罪 |

    | 未經同意上傳別人不雅的照片或影音到網路上 | 刑法第309 條：公然侮辱罪 |

    | 以合成照片或影像，詆毀或醜化他人 | 1.刑法第309 條：公然侮辱罪<br>2.刑法第310 條：誹謗罪 |

    | 在網路上以言語警告、威脅他人 | 刑法第305 條：恐嚇危害安全罪 |


    ※ 遇到網路霸凌時怎麼辦

    | 旁觀者 | 受害者本人 |

    | --- | --- |

    | 在網路上看到惡意傷人的不當言論，不該盲從附和、按讚或分享，如此會讓自己成為加害者之一，還可能觸犯法律。此外必要時，更可以勇敢反應或檢舉，甚至報警處理，別讓這些霸凌行為繼續擴散，造成更嚴重傷害。
    | 遇到網路霸凌時，千萬不要害怕而忍氣吞聲，可先將這些資訊存證，例如下載該網頁或拍照留存，並勇於求助，及時告訴家長或老師，必要時報警處理或向法院提告。 |


    ※ 法律小叮嚀

    | 誹謗罪 | ※誹謗罪與公然侮辱罪之區別：不指摘事實而公然侮弄辱罵特定人或可得推知之人，構成公然侮辱罪；若指摘或傳述足以損害他人名譽之具體事件內容，則構成誹謗罪。
    | ※家長的監督責任<br>法律要求父母在監護職責上負有一定的責任，包括保護、教養、監督以及預防孩子的不當行為。<br>雖然少年還未成年，但在犯罪行為中，少年顯然對於自己的行為有識別能力(知道自己在做甚麼事情)，因此少年須承擔相關法律責任，而家長則需負連帶責任。
    |

    | --- | --- | --- |

    | 意圖散布於眾，而指摘或傳述足以毀損他人名譽之事者，為誹謗罪。<br>**恐嚇危害安全罪**<br>以加害生命、身體、自由、名譽、財產之事，恐嚇他人致生危害於安全者。
    | | |'
