  stem: '小瀚根據甲、乙兩文，統整表格如下，空格處應填入下列何者？

    | 錢幣名稱 | 鑄造者 | 形制文字 | 重量比較 |

    | --- | --- | --- | --- |

    | 四銖錢 | 天子 | 鑄有「半兩」字樣 | |

    | 吳錢 | 吳王 | 與四銖錢相同 | 微重於鄧通錢 |

    | 鄧通錢 | 鄧通 | 與四銖錢相同 | 與四銖錢相同 |'
  options:
  - label: A
    content: 輕於鄧通錢
  - label: B
    content: 微輕於吳錢
  - label: C
    content: 微重於吳錢
  - label: D
    content: 與吳錢相同
  group_stem: "【甲】\n    文帝時，莢錢益多，輕，乃更鑄四銖錢，\n上鑄「半兩」字樣，民亦得自鑄錢。故吳王\n就山鑄錢，富等天子，其後以此叛逆。又有\n\
    大夫鄧通者，亦以鑄錢富甲天下。故吳、鄧\n氏錢布天下，而後乃生鑄錢之禁。\n         ── 改寫自《史記‧平準書》\n【乙】\n    漢文帝時，鄧通得賜蜀銅山，聽得鑄\n\
    錢，形制文字重量，皆與天子四銖錢同。\n時吳王亦有銅山鑄錢，故有吳錢，微重，\n形制文字，與天子錢不異。\n── 改寫自《西京雜記》"
