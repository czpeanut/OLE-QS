  stem: 小越寫國文作業時，誤將「聽，那曉鐘和緩的清音」的「鐘」寫成「鍾」，這是因「音同形近」而產生的錯誤。下列文句中的錯別字，何者也屬此類？
  options:
  - label: A
    content: 暱大太陽也阻擋不了他們的熱情洋溢
  - label: B
    content: 吾馬賴柔和，令他馬，顧不敗傷我乎
  - label: C
    content: 作戰不差譴餓兵，罐頭因應軍需而生
  - label: D
    content: 他以專業的問政表現受到選民的擁待
  answer:
