- id: doc_111_高雄_大灣_社會_g8s1e2_s1_32
  section: 1
  number: 32
  type: single
  page: 4
  stem: '閱讀完上文，請問 : 為什麼「燕雲十六州」會落入胡人之手中？'
  options:
  - label: A
    content: 唐朝藩鎮割據，胡人趁虛而入
  - label: B
    content: 宋朝文人政治，被迫割地求和
  - label: C
    content: 遼助後晉建國，後晉獻地感謝
  - label: D
    content: 元世祖忽必烈征服南宋，取得長江流域。
  group_stem: "自古以來，長城被視為胡漢分界線，也是漢人防範胡人的最後一條防線，許多的國家、朝代，都是因為有長城的庇護，而能抵禦外族的入侵，由此可見長城的重要性，但如果今天胡人越過了長城，長城便不再能發揮其保衛作用，漢人受到胡人的威脅便會與日俱增。\n\
    \    燕雲十六州這塊地因為鄰近北方，自古都是胡漢交流之地，像是漢朝就曾經將降漢的南匈奴部落安置於燕雲十六州上。唐朝為了方便控制邊境，在各邊境設立「節度使」，節度使擁有兵權，可以隨時帶兵對抗進犯的外族，而燕雲十六州則由范陽節度使，負責管理。安祿山就曾經出任范陽節度使，帶兵與契丹作戰。在唐朝結束安史之亂後，因為唐朝勢力衰弱，此地形成藩鎮割據的情況，軍將們擁兵自重，不再聽命於唐朝中央政府，也因此在燕雲十六州的外族，不再受控，成半獨立狀態。\n\
    \    契丹族在耶律阿保機領導下建立遼國，當時南方政權戰亂頻繁，人民生活困苦，使得許多漢人流亡至遼國，遼國皇帝利用這契機，收撫漢人，並讓他們開墾荒田。唐朝滅亡後，燕雲十六州由後梁、後唐依序控制，與胡人契丹在此地發生過多次戰爭。\n\
    \    石敬瑭原為後唐的將領，因為遭後唐皇帝猜疑，便提前舉兵叛變。後唐軍隊與石敬瑭交鋒，石敬瑭處於弱勢，便決定向契丹求援。契丹軍舉兵南下，擊敗後唐軍，並冊封石敬瑭為大晉皇帝。因為受到契丹族的幫助，所以石敬瑭認契丹族耶律德光為父，自稱兒皇帝。石敬瑭滅後唐後，建立後晉，並將燕雲十六州割讓給契丹國，終止與契丹之間的戰爭，並每年向契丹進貢。\n\
    \    燕雲十六州被割入契丹國以後，南方農業民族失去了與北方遊牧民族之間的天然防線，契丹人也開始從遊牧民族，過渡為遊牧與農耕相交雜的民族。在契丹統治之下，燕雲十六州此地，漢族與契丹族混居。\n\
    \    宋朝後，雖想要出兵收復燕雲十六州，但屢屢失利，直到□□，才成功收復了丟失超過四百年的燕雲十六州。"
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 歷史
      code: 3-1
