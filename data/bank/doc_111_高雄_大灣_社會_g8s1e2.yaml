  group_stem: '請閱讀短文，回答下列問題

    資料(一)

    ○○原指中國內部的君臣之禮，除了規定統治者與被統治者的往來行為，也擴及談論大國(宗主國)與周圍小國(藩屬國)的歸屬關係。至明朝更成為中國外交與通商的一種制度。

    資料(二)

    唐代以來，中國海外貿易達到空前發展。然而，開啟航路的同時，如何管理對外管道，也是政府重要的課題。明代建國後，陸上外患並沒有消失，選擇控管海上貿易，實際上也是在消除海防瓜分陸地防衛的潛在危險。'
