  - label: C
    content: 關注鄉土發展的年代
  - label: D
    content: 大眾多元文化的年代
  group_stem: '（四）在臺灣史上，有一段時間流行關懷人民生活，以寫實手法寫作的作品，例如：下列這篇《兒子的大玩偶》簡介。

    《兒子的大玩偶》這部電影，改編自黃春明於民國六十年代撰寫的三篇小說。分別講述坤樹為了幫電影院宣傳，化妝成大玩偶四處宣傳。王武雄退伍後，擔任推銷員，公司派遣他跟隨林再發到沿海鄉鎮推銷日本生產的壓力鍋。最後的故事則是述說阿發在上班的路途上，不幸被美軍軍官所駕駛的汽車撞斷了雙腿，住進臺北的美國海軍醫院療養。阿發卻因為軍官的賠償，經濟得到不少改善，還吃到遠從美國進口的蘋果，讓鄉下老家北上探望他的好友們都非常羨慕。請問：'
