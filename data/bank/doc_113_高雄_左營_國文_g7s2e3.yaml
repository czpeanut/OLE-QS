  stem: 根據文意，下列哪項最能推論「惟侯有雨入井，陰氣隨雨而下」的可能原因？
  options:
  - label: A
    content: 雨水使井內空氣對流，陰氣下沉，使人能暫時進入
  - label: B
    content: 雨水重壓，將陰氣擠壓至地底，提高工人施工效率
  - label: C
    content: 雨水溫熱可以降低陰氣的濃度，驅除寒氣不致受寒
  - label: D
    content: 雨水含鹽，增強井壁結構的穩定性，讓施工更安全
  group_stem: "(四)\n    陵州①鹽井，深五百餘尺，皆石也。上下甚寬廣，獨中間稍狹，謂之「杖鼓②腰」。舊自井底用柏木為幹，上出井口，自木幹③垂綆④而下，方能至水。井側設大車⑤絞之。歲久，井幹摧敗，屢欲新之，而井中陰氣⑥襲人，入者輒死，無緣措手。惟侯有雨入井，則陰氣隨雨而下，稍可施工，雨睛復止。後有人以一木盤，滿中貯水，盤底為小竅⑦，釃水⑧一如雨點，設於井上，謂之雨盤，令水下終日不絕。如此數月，井幹為之一新，而陵井之利復舊。\
    \ ──(沈括《夢溪筆談》〈陵州鹽井〉)\n ①陵州︰地名，今四川省 仁壽縣，為當時主要井鹽產地之一。 ②杖鼓︰兩端大，中間細的長鼓\n ③幹︰支撐井壁的直立木柱\
    \ ④綆︰音ㄍㄥˇ，井上用來及水的繩子\n ⑤大車︰指提起井繩的絞盤 ⑥陰氣︰指硫化氫、二氧化碳、甲烷等令人窒息的氣體\n ⑦竅︰孔眼、洞眼 ⑧釃水︰滴水，釃，音ㄌㄧˊ"
