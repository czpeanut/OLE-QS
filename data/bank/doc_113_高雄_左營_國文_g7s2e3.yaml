  group_stem: "(二)\n    第二次大戰後，研究人員開始分析為什麼平時訓練有素的飛行員，上戰場時會犯下簡單但致命的錯誤。我們一直不知道額頭後方的腦區究竟發生了什麼事？直到近年神經造影技術出現後才開始有些頭緒。掃描大腦產生的影像中，前額葉皮質的混亂活動，顯示這個大腦調控中心有多麼脆弱。\n\
    \    前額葉皮質在大腦結構中的地位特殊，因此對壓力非常敏感。它是高度演化的腦區，佔據了大約1/3 的大腦皮質，在人腦中所佔的比例也高於其他靈長類。前額葉皮質成熟的速度比其他腦區慢，到了20\
    \ 歲後才會發育完全。它負責抽象思考，並讓我們專注於眼前的事物，同時也負責工作記憶的儲存。這個記憶暫時儲存的區域可以「記住」一些臨時資訊，像是加法時的進位運算。前額葉皮質也是心智控制中樞，能抑制不恰當的想法和行為，這個神經管理中樞透過密集的神經網絡來收發指令，而網絡則是由許多三角形神經元錐狀細胞所構成。這些神經元也可以連結到其他負責控制情緒、慾望和習慣的較遠腦區。沒有壓力時，該網絡中的迴路可以穩定運作。工作記憶會提醒我們開始著手下星期要完成的事情，其他迴路送出訊息給較原始的腦區，要我們別再喝酒。同時，也會傳訊息到腦部深處的杏仁體(恐懼反應中心)，要我們不必擔心路上朝我們移動的龐然巨物會撞過來。\n\
    \    這個網路的運作很容易受到破壞，壓力來臨時，神經系統中的化學發生任何細微改變，都可能立即削弱網路的連結。為了回應壓力，大腦分泌出大量化學物質，例如︰正腎上腺素和多巴胺，這些化學物質的來源是腦幹中的神經元，它們可以連結到大腦的許多區域。當這些物質的濃度上升，前額葉皮質的神經元會停止活動，原因之一是這些化學物質暫時使神經元之間的連結(突觸)減弱了。在這種情況下，自制力就處於崩潰的邊緣。\n\
    ──(摘自《科學人雜誌》〈壓力，讓你腦中一片空白〉"
