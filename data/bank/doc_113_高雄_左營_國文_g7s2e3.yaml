  page: 6
  stem: 根據上文，「黑天鵝事件」最主要的特徵是什麼？
  options:
  - label: A
    content: 因選擇逃避，進而引發嚴重後果的重大事件
  - label: B
    content: 發生頻率雖高，但破壞及影響力有限的事件
  - label: C
    content: 是人們早已預測到，但仍然視而不見的事件
  - label: D
    content: 出乎意料，且無法從既有經驗中預測的事件
  group_stem: "(一)\n    在發現澳洲之前，舊世界的人相信所有的天鵝都是白的 ── 這個想法其實沒有錯，因為它和實證現象完全吻合。但只要一隻黑天鵝，便足以讓一個基於白天鵝被看到千萬次所形成的認知失效。\n\
    \    出乎意料的「黑天鵝事件」，說明了人們從觀察或經驗所學到的事物往往有其侷限。人們無力預測「黑天鵝事件」，也顯示了人們無從預測歷史發展。但「黑天鵝事件」發生後，人們又會設法賦予它合理的解釋，好讓它成為是可預測的。因此，許多學說總在「黑天鵝事件」後出現。\n\
    \    雖然令人難以置信的「黑天鵝事件」經常衝擊現有的局勢，但我們如果願意反知識操作，或許可以從中僥倖獲利。事實上，在某些領域 ── 例如︰科學發現和創業投資，來自未知事件的報酬非常大。發明家和企業家往往注意雞毛蒜皮的小事，並在機會出現時認出機會。\n\
    （改寫自Nassim Nicholas Taleb《黑天鵝效應‧前言》）"
