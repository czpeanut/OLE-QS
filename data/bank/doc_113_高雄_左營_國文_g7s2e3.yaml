- id: doc_113_高雄_左營_國文_g7s2e3_s2_36
  section: 2
  number: 36
  type: single
  page: 5
  stem: '「慶曆中，有布衣①畢昇，又為活板。其法用膠泥刻字，薄如錢唇②，每字為一印，火燒令堅。先設一鐵板，其上以松脂、蠟和③紙灰之類冒④之。欲印則以一鐵範置鐵板上，密佈字印，滿鐵範為一板，持就火煬之。藥稍熔，則以一平板按其面，則字平如砥。若止印三二本，未為簡易；若印數十百千本，則極為神速。當作二鐵板，一板印刷，一板已自佈字，此印者才畢，則第二板已具，更互用之，瞬息可就。」（沈括
    《夢溪筆談》卷十八）

     ①布衣：沒有做官的平民。 ②錢唇：銅錢的邊緣。

    ③和：音ㄏㄨㄛˋ，攪拌到一起。 ④冒：覆蓋，蒙上。

