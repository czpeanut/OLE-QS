- id: doc_113_高雄_左營_國文_g7s2e3_s3_48
  section: 3
  number: 48
  type: single
  page: 9
  stem: 根據上文，有關新臺幣的匯率變動影響臺灣的出口與進口的敘述，下列何者正確？
  options:
  - label: A
    content: 新臺幣升值會使出口商品的價格上升，進口商品的價格下降
  - label: B
    content: 新臺幣升值會使出口商品的價格下降，進口商品的價格上升
  - label: C
    content: 新臺幣貶值一定有利於出口，而且進口商品的成本必然下降
  - label: D
    content: 新臺幣貶值會使出口商品的價格上升，進口商品的價格下降
  group_stem: "(五)\n    在新聞上常看到新臺幣上漲，貿易商對於出口狀況感到憂慮。而當新臺幣下跌時，股市名嘴則對出口貿易一片看好。為何新臺幣的漲跌會影響臺灣的進出口貿易呢？新臺幣下跌一定對出口有利嗎？假設如此，所有重出口的貿易大國，只要一味的讓自家貨幣下跌，不就能在國際貿易中輕易攫取利益了嗎？。\n\
    \    一般情況而言，匯率上漲有利進口，匯率下跌有利出口是合理的。以臺灣筆電廠商外銷為例，若進出口交易以美元計價，而出口筆電的售價為1000 美元。當美金︰新臺幣的匯率為1︰30\
    \ 時，對臺灣筆電廠商而言，筆電帶來的收入為新臺幣30000 元；當新臺幣下跌，匯率為1︰32 時，筆電帶來的收入為新臺幣32000 元。因此，新臺幣的下跌使筆電增加了新臺幣2000\
    \ 元的額外外匯收益。因此，新臺幣下跌有利出口，不利進口，反之亦然，若新臺幣上漲，則會不利出口，有利進口。就結果而言，如果交易是使用他國幣別計價，那麼匯率漲跌會直接造成臺灣進出口商的外匯損失與獲利，而這種影響是立即性的。\n\
    \n| 美元匯率 | 1︰30 | 1︰32 | 1︰29 |\n| --- | --- | --- | --- |\n| 筆電售價 | 1000 美元 |\
    \ 1000 美元 | 1000 美元 |\n| 筆電商收入 | 新台幣30000 元 | 新台幣32000 元 | 新台幣29000 元 |\n| 匯差\
    \ | 0 元 | +2000 元 | -1000 元 |\n表1︰美元計價之外匯兌換表\n\n   不過，如果交易是使用新臺幣計價，有利出口的方式會有些許不同。當新臺幣下跌至1:32\
    \ 時，外國買家只需以937.5 美元便可換得新臺幣30000 元的筆電，對於外國買家而言支出下降。根據供需法則，價格下降將使需求量增加，因此匯率的下跌會使外國廠商成本下降，進而提升訂單數量，因此確實會幫助到出口外銷。不過考量到製造與出貨時間，現實裡並不會立即創造直接的外匯收益，因為生產產品需要一定的流程與時間，增加的需求量可能是併在下一期的訂單當中，當期交貨的數量很可能維持不變，而出口額也不會因此增加。\n\
    \n| 美元匯率 | 1︰30 | 1︰32 | 1︰29 |\n| --- | --- | --- | --- |\n| 筆電售價 | 新台幣 30000\
    \ 元 | 新台幣 30000 元 | 新台幣 30000 元 |\n| 外國買家支出 | 1000 美元 | 937.5 美元 | 1034.5 美元 |\n\
    表2︰新臺幣計價之外匯兌換表\n\n    假使新臺幣上漲有利進口，為何我們從來不見進口產品有價格下降的現象呢？因為影響進口產品價格的因素有很多，除了匯率，還有進口產品原物料價格變動、運費、營運費用、他國物價水準、關稅、人員薪資等因素。以2020〜2021\
    \ 年狀況為例，雖然在這段期間新臺幣強勢上漲，但國際海運運價格也因疫情影響而急漲，使得進口商所承擔的運費增加不少，因此整體進口成本很可能是不減反增的狀態。總之，匯率上漲有利進口，匯率下跌有利出口是個通則，不過現實層面仍有太多因素要考量，並不能就單一因素對進出口的情況下定論，還需要了解其他因素才能得知事情的全貌。\n\
    \ (節錄自《品學堂》〈匯率知多少?〉)"
