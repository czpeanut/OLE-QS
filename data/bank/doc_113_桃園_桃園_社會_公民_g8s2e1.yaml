- id: doc_113_桃園_桃園_社會_公民_g8s2e1_s1_33
  section: 1
  number: 33
  type: single
  page: 1
  stem: 小斌將限量款高級自行車借給 17 歲的阿德騎去環島，阿德卻不慎將車撞毀，所幸沒有波及他人，事發後雙方自行簽訂高額賠償契約。不過阿德的父母得知後反對這份契約，於是阿德事後反悔不願依約賠償，小斌因此告上法院要求阿德履行契約，但法官以該契約無效為由，判決小斌敗訴。關於上述報導內容，下列哪一項推論最合理？
  options:
  - label: A
    content: 二人簽訂的契約因為違反公共秩序而無效
  - label: B
    content: 阿德因為不是故意撞毀，不用負賠償責任
  - label: C
    content: 小斌敗訴的原因是阿德為限制行為能力人
  - label: D
    content: 應修復該輛自行車，不得索取金錢為賠償
