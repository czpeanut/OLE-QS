- id: doc_113_桃園_桃園_社會_公民_g8s2e1_s1_42
  section: 1
  number: 42
  type: single
  page: 2
  stem: '老師拿出一份公民作業，主題是要寫一篇有關「調解」的報告。老師說：「這位同學寫的報告很詳細，但是有不少錯誤，如下列所示」請大家協助指出，其中有哪幾項是對的？

    (甲)和解是指雙方當事人經過溝通後，各自妥協讓步所訂定的契約，但其法律效力和調解不同。

    (乙)它可以避免訴訟的耗時及耗財

    (丙)當要調解時可到鄉鎮市區公所的調解委員會進行

    (丁)調解委員會必須由法官和律師組成

    (戊)它所做的調解書一旦簽立，其效力與法院判決相同'
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲丙丁
  - label: C
    content: 甲乙戊
  - label: D
    content: 丙丁戊。
