- id: doc_113_桃園_桃園_社會_公民_g8s2e1_s1_32
  section: 1
  number: 32
  type: single
  page: 1
  stem: 知名藝人大S 猝逝後，在前一段婚姻有兩名未成年子女，其名下遺留下來的豪宅不動產該如何分配，引發各界關注，專家表示，對於繼承不動產，通常以公同共有、均分繼承（分別共有）或是協議分割等方式辦理，如果繼承人是未成年人時，民法對於未成年人會有相關的保護措施，值得注意。有關於我國民法有關於繼承相關的法律內容，下列何者正確？
  options:
  - label: A
    content: 繼承在民法是屬於財產內容的法律關係。
  - label: B
    content: 未成年的法定繼承是限定繼承
  - label: C
    content: 雖然前夫已和大S 解除婚姻關係，但是他還是有法律上的繼承權。
  - label: D
    content: 有關於財產的糾紛，只能透過訴訟來解決。
