  stem: 為保障住宅租賃雙方的權益，政府制定「租賃住宅市場發展條例」，若承租人毀損住宅或設備不為修繕、賠償，或遲付租金達 2 個月以的租額，出租人得以書面通知承租人員提前終止契約。請問，上述作法是希望承租人負起何種法律責任？
