- id: doc_113_高雄_鼎金_社會_公民_g7s1e2_s1_48
  section: 1
  number: 48
  type: single
  page: 1
  stem: 晏茲在醫學雜誌上看到一則報導──「現代家庭多為雙薪，父母工作忙碌，下班後為了休息喘口氣，面對孩子的吵鬧或是互動需求，許多父母便將3C 產品當保姆，陪伴孩子學習各種事物，這也是不少現代家庭日常。但是，美國國家衛生研究院長期研究後發現，孩童每天盯著螢幕看的時間若超過7
    個小時，腦部就會呈現不同的紋路，而且大腦的皮質會變薄，可能會影響孩童認知、語言等能力發展。心理諮商師也建議，父母應該帶孩子多到戶外活動，增加親子相處時間及親密關係，有益於孩童的身心發展。」請問：上述研究呈現了家庭功能的何種轉變？
  options:
  - label: A
    content: 家庭的生育功能衰弱，導致少子化現象愈趨嚴重
  - label: B
    content: 現代家庭部分的教育功能轉移到大眾傳播媒體
  - label: C
    content: 家庭經濟功能增強，提供3C 產品協助孩子學習
  - label: D
    content: 3C 產品完全可以取代家庭保護與照顧的功能。
