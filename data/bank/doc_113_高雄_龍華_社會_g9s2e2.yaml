    content: 第一次世界大戰
  - label: B
    content: 第二次世界大戰
  - label: C
    content: 太平洋戰爭
  - label: D
    content: 柏林危機。
  group_stem: '逸臣在網頁看到『聯合國難民署』簡介如下，依據內容，回答33～36 題：


    1950 年成立，主要任務是幫助受戰爭影響的歐洲難民，因工作卓越，於1954 年獲頒諾貝爾和平獎。

    1956 年，隨著蘇維埃力量與匈牙利革命之間出現的衝突，湧現了大批難民，聯合國難民署的任命因而延長。

    1960 年代，非洲非殖民地化引發當地首個大規模難民潮，並需要聯合國難民署的介入。

    接著的20 年，聯合國難民署協助處理亞洲及拉丁美洲數個流徙危機。

    在2015 年，聯合國難民署慶祝成立65 周年。在這些年間，我們成功幫助超過5000 萬名難民重建生活。'
