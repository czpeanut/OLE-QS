- id: doc_113_新北_土城_英語_g9s1e2_s4_40
  section: 4
  number: 40
  type: single
  page: 4
  stem: What is phishing?
  options:
  - label: A
    content: A fake message asking for personal information or to click on a strange
      link.
  - label: B
    content: A way to update your device.
  - label: C
    content: A type of app that helps protect your data.
  - label: D
    content: A tool to locate a stolen device. 📖 locate 定位
  group_stem: 'D. (40-42)

    Technology can help us, but it also helps hackers steal information. Here are
    some ways to stay safe.

    We use phones and computers every day. If someone takes your device, they can
    see your data. To stop this, use a strong password with letters, numbers, and
    symbols. Many devices also have face or fingerprint locks. These are good, but
    turning on “Find My Device” is even better. This tool helps you find, lock, or
    delete data if your device is lost.

    Hackers also use old apps or operating systems to break in. To stay safe, always
    update your phone or computer. Download apps only from trusted stores, like Google
    Play or the App Store. Be careful with apps that ask to use your camera or location.

    The biggest danger is phishing. This is when you get a fake message asking for
    your personal details or to click a link. Don’t give your personal information
    online, and never click links you don’t trust.

    Keeping your data safe can be hard, but it’s important to protect your information.


    📖 hacker 駭客 device 裝置 operating system 作業系統 click 點擊 protect 保護'
