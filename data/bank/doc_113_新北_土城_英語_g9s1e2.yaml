  group_stem: 'C. (37-39)

    The platypus is a special animal in Australia. It lays eggs and has a mix of features:
    a bill like a duck, a tail like a beaver, and a body like an otter. They are about
    50 centimeters long and weigh around 1.5 kilograms.

    Platypuses eat meat, such as worms and insects. They hunt in rivers and wetlands
    and can spend up to 12 hours a day looking for food. They do most of their hunting
    at night. When they dive underwater, they stay underwater for just one or two
    minutes at a time. They close their eyes and ears when they’re underwater, so
    they cannot see or hear anything.

    However, platypuses use their bill to sense small electric signals from animals.
    When they find a worm or insect, they pick it up with their bill, along with mud
    and small stones. They then come back to the water surface and use the stones
    to crush the food in its mouth because they do not have teeth.

    The platypus is a very interesting example of how nature can be surprising.


