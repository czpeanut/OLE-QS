- id: doc_112_嘉義_北興_數學_g8s1e1_s2_4
  section: 2
  number: 4
  type: calc
  page: 3
  stem: '大學有傳說的必修四學分：課業、社團、愛情、打工。

    雖然離大學還有點遠，談愛情也有點早，但是基本的認識還是要有的喔！

    想談愛情，免不了要經過告白的過程，而評估告白成功的機率，可以分成兩大部分---「對方對

    自己的好感度」以及「告白指數」。

    如果將好感度和告白指數都設定為 0～100 之間的整數，且將告白成功率的公式設定如下：

    告白成功率 $= \sqrt{\text{好感度} \times \text{告白指數}}\,(\%)$

    例子 1--

    對方完全沒好感，完美的告白：

    告白成功率 $=\sqrt{0 \times 100} = 0(\%)$。對方完全沒好感，就算告白再完美也沒用。

    例子 2--

    對方非常有好感，但不告白：

    告白成功率 $=\sqrt{100 \times 0} = 0(\%)$。對方非常有好感，但是不告白也不會成功。

    試回答下列問題：

    (1)若小羅對涵涵的好感度為 36，且涵涵的告白指數為 64，試求涵涵的告白成功率為多少％？

    (2)若俊寶對老張的好感度為 20，老張的告白指數為 80；

    俊寶對仁仁的好感度為 30，仁仁的告白指數為 50；

    俊寶對阿澤的好感度為 75，阿澤的告白指數為 27；

    請問老張、仁仁、阿澤三人之中，誰對俊寶的告白成功率高於 40％？'
