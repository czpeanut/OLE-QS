    content: By bus.
  - label: B
    content: By metro.
  - label: C
    content: On foot.
  group_stem: '(六)

    (At Kevin’s home)

    Mrs. Wei: Get up, Kevin! Don’t you need to meet your friends at the metro station
    at eight thirty?

    Kevin: What time is it?

    Mrs. Wei: It’s eight o’clock now.

    Kevin: It’s still early. I can get there in ten minutes（分鐘）by bus.

    Mrs. Wei: No. You need more exercise. Why don’t you go there on foot?

    Kevin: On foot? It’s too far away（遙遠地）. Maybe（也許） I can ride my bike there.

    Mrs. Wei: Well, it’s raining, and it’s dangerous.

    Kevin: All right. I’m always late anyway（無論如何；反正）.

    (At the metro station)

    Eric: Hi, Tony. You’re early today.

    Tony: Why do you say that? I’m always on time.

    Eric: But, where’s Kevin? Is he coming by bike?

    Tony: He always rides his bike. Maybe he’s still on his way.

    Eric: How can we get to Taipei Children’s Amusement Park?

    Tony: We go to Shilin by metro first. Then we can take a bus.

    Eric: Look! It’s Kevin.

    Kevin: Hi, guys. Am I late?'
