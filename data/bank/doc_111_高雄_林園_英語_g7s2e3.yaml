  group_stem: '(二)

    Mom: Andy, it’s 7:30. You are late for school.

    Andy: Can dad give me a ride? I walk to school every day, and it’s really tiring（累人的）.

    Mom: Oh, he can’t. He is busy this morning. And the school is only two blocks
    away（遠）.

