  - label: B
    content: The ninth month of the year.
  - label: C
    content: The seventeenth century.
  - label: D
    content: The nineteenth day of February.
  group_stem: '(三)

    February 19 is the International（國際的）Tug of War Day. It is a sport game we all
    like to play. The first tug of war can go back to the 16th century（世紀）. It was
    even an Olympic（奧運）event from 1900 to 1920.

    Tug of war is a game between two teams at each end of a rope. Each team has eight
    players. One team must pull（拉）the other team across（穿過）a central（中央的）line to their
    side to win the game.

    Tug of war is a fun and easy game, but it can be dangerous（危險的）, too. Players
    can get hurt if they play it in the wrong（錯誤的）way. Athletes must get a lot of
    training before（在…之前）they play the game.'
