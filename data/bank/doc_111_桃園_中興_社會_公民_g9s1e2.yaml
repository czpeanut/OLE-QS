- id: doc_111_桃園_中興_社會_公民_g9s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 小德在大賣場購買一臺LED 電視，但卻在沒拆封前反悔想要換貨。他查詢相關規定後了解，在實體店面購買商品時，一定要在消費的當下，確認商品或服務無誤後再行購買！除非是店家有特別承諾退換貨之權利，否則在實體店面完成購買行為後是無法任意主張解約退貨的。而消費者若是在實體商店購買後不滿意，想要退換貨，可以依據消保法進行申訴或者調解。另外，若購買的商品或服務有瑕疵，可以依民法之規定，請求減少價金或解除契約，以維護自己的權益。關於小德的消費行為，下列敘述何者正確?
  options:
  - label: A
    content: 除非商品有瑕疵,否則不可要求店家換貨
  - label: B
    content: 小德可以依《消費者保護法》要求退換貨
  - label: C
    content: 不適用7 天猶豫期,但未拆封，仍可退貨
  - label: D
    content: 適用7 天猶豫期的規定，可要求店家退
  tags:
