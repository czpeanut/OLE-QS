  section: 1
  number: 3
  type: single
  page: 1
  stem: '請根據下表內容判斷，何組皆屬於非價格競爭的方式？

    | 選項 | 觀察一 | 觀察二 |

    | --- | --- | --- |

    | (A) | 書店會員日全館結帳滿千88 折。 | 進入LINE 購物官網購買享11%點數回饋。 |

    | (B) | 週三加碼免運券 $99UP 免運費。 | 速食店推出點套餐，飲料無限續杯。 |

    | (C) | 速食店與知名卡通明星合作，推出限量紀念杯。 | 超商推出來店預購口罩享指定商品99 元加購價。 |

    | (D) | 飲料店響應環保，消費滿300 元送環保吸管。 | 比薩店要挑戰消費者的味蕾，推出榴槤口味披薩。 |'
  options:
  - label: A
    content: 書店會員日全館結帳滿千88 折。進入LINE 購物官網購買享11%點數回饋。
  - label: B
    content: 週三加碼免運券 $99UP 免運費。速食店推出點套餐，飲料無限續杯。
  - label: C
    content: 速食店與知名卡通明星合作，推出限量紀念杯。超商推出來店預購口罩享指定商品99 元加購價。
  - label: D
    content: 飲料店響應環保，消費滿300 元送環保吸管。比薩店要挑戰消費者的味蕾，推出榴槤口味披薩。
