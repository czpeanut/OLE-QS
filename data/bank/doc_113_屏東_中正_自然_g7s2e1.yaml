  group_stem: "[閱讀題2] 貓咪毛色與性染色體的遺傳\n    遺傳物質有控制性狀表現的基因，貓咪的毛色與性染色體有關，特別是橘色（O）與黑色（B）這兩種毛色的遺傳。這些毛色的基因位於X\
    \ 染色體上，而貓咪的性別決定和人類相同。因此，公貓（XY）只能從母親繼承一個 X 染色體上的毛色基因，而母貓（XX）則能擁有兩個 X 染色體，可能帶有兩種不同的毛色基因。\n\
    \    三花貓（黑色、橘色與白色的混合）大多是母貓，因為她們同時擁有一個帶橘色基因的 X 染色體，另一個帶黑色基因的 X 染色體。由於 X 染色體在細胞發育時會隨機不表現其中一個等位基因，因此母貓可以表現不同程度的毛色，形成獨特的三花花紋。"
