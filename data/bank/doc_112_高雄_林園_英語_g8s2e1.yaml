  group_stem: '(四)

    ★Bigger than ducks

    ★Longer body, neck and legs

    ★Shorter bill for eating grass

    goose

    29 kinds of geese all over the world.


    Do you know…

    1.All geese and some types of ducks go to warmer places in winter.

    2.Duck and goose are good meat, and the feathers of ducks and geese are great
    for jackets.

    3.Geese don’t eat meat, but they eat ONLY grass on the farm.

    4.Duck and goose belong to the Anatidae family. They live near lakes and ponds.


    duck

    90 kinds of geese all over the world.

    ★Smaller than geese

    ★Shorter body, neck and legs

    ★Flat bill to catch fish and plants in the water.


    Color

    ▲Duck and goose have one or many colors. Most geese are gray, black, and white.

    ▲Most ducks are orange, green, black or yellow.


    Husband and Wife

    ▲Father and mother geese take care of their babies together.

    ▲Mother ducks are great moms, but father ducks don’t take care of the eggs or
    babies at all.


    bill 鳥嘴; flat 扁平的; feather(s)羽毛'
