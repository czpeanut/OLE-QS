  group_stem: '(三)

    When we go to the beach, sometimes we will see hermit crabs on the beach. And
    we all know hermit crabs have to change to bigger shells when they grow bigger.
    In fact, when they finally find a new shell, they have a special habit. They will
    tell other crabs to change shells together.


    How do they change shells together? When they start to get together, they will
    stand in line according to their body sizes. After the first one (also the biggest
    one) takes off its shells, the second one (smaller than the biggest one) puts
    on the shell of the first one. Then the third one puts on the shells of the second
    one.


    Why do they change shells this way? In fact, it is not easy to find a new shell.
    By doing this, the chance of not finding a shell will be smaller. Hermit crabs
