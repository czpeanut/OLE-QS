  stem: 'Below are the writer’s points in the reading. In what order does the writer
    talk about his points?

    a. People test medicines on guinea pigs.

    b. Guinea pigs a good choice of food in South America

    c. Guinea pigs eat a lot and live with a big family.'
  options:
  - label: A
    content: a→b→c
  - label: B
    content: b→a→c
  - label: C
    content: c→b→a
  - label: D
    content: c→a→b
  group_stem: '(二)

    Guinea Pigs

    Many people keep guinea pigs as pets. These small animals are cute, friendly and
    easy to take care of. Guinea pigs spend a lot of time eating. They need to keep
    eating things, like fruit, vegetables, and even clothes, or their teeth will become
    too big for their mouths. Guinea pigs usually live together in big families of
    10 or more. It’s better for their health.

    Besides, guinea pigs are also a kind of food in South America. They need very
    little room to grow, so they are a better choice than cows or pigs. For some people,
    guinea pig meat is delicious and tastes like chicken or rabbit meat. In some countries,
    people even give each other guinea pigs as gifts of food. What’s more, people
    use guinea pigs in animal testing. Human test medicines on them.


     guinea pig 天竺鼠; teeth 牙齒; South America 南美洲; medicine 藥品'
