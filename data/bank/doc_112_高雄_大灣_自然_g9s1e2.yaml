  group_stem: (四)水火箭如圖所示，它是以水的推送作為推動力來推動前進的一種模型火箭。用橡皮塞塞緊的瓶子，形成一個密閉空間，然後利用打氣機把氣體打入密閉的容器內，使得容器內空氣的氣壓增大，當超過橡皮塞與瓶口接合的最大靜摩擦力時，瓶口與橡皮塞自由脫離，火箭內部的水因氣壓向外噴出，火箭得到反方向的作用力飛行。在發射水火箭前會先打入氣體，當水火箭內部氣壓達一定壓力時，氣體會從高壓向低壓流去，故在噴嘴口被打開時，氣體自然向噴嘴口噴出，但由於水擋在氣體前方，故水會被氣體先推出火箭，當水噴出的同時，火箭也藉此獲得反方向的作用力飛行。試根據上述資料回答第39~40
