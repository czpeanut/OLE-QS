  number: 4
  type: single
  page: 1
  stem: '已知甲和乙兩種物質反應會生成丙和丁，其反應式為：2甲＋乙→ 2丙＋ 3丁。右表是甲和乙反應的一組實驗數據，理論上可以生成多少公克的物質丁？


