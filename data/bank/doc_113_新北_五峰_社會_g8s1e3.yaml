  section: 1
  number: 3
  type: single
  page: 1
  stem: 某地傳統的住宅設計是在燒柴煮飯時，將爐灶所產生的熱煙導入房屋地板下，透過煙道傳送熱量、暖和室內。所以，居民習慣把飯菜和餐具放在盤子上，端到房間用餐。請問：有關當地居民因應天冷的生活習俗，何者錯誤？
  options:
  - label: A
    content: 傳統日本合掌造民居大多設置「溫突」取暖
  - label: B
    content: 這樣的供暖設計與中國北部的「暖炕」類似
  - label: C
    content: 居民多席地而坐，利用此法讓室內地板增溫
  - label: D
    content: 用餐使用移動式桌子，慣用筷子扁又重才不易滑落。
