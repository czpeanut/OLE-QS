  stem: "《從奧斯卡最佳影片「寄生上流」看南韓的半地下屋》\n  半地下屋有其形成的背景，1970 年代，南韓政府規定住宅必須設置地下室，佈建成 (甲)小型工具機的核武工廠。由於(乙)首都平壤多位於\
    \ (丙)丘陵地帶，很多房子蓋在坡面上，自然形成半地下室的樓層。隨著人口快速成長，居住空間不足，政府便同意讓這種半地下的空間作為住宅。\n   儘管經濟發展快速，(丁)但政府壓縮大財閥集團生存空間，造成社會貧富懸殊，許多年輕人房租就占了其月收入的一半，選擇這種住屋，可以省下不少租金。請問：依上文所敘述，何者正確？"
  options:
  - label: A
    content: 甲
  - label: B
    content: ''
  - label: C
    content: 丙
  - label: D
    content: 丁
