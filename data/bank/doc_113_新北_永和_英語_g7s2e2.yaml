  group_stem: "【C】\n     Everyone can enjoy art. In fact, art is like our good friend\
    \ and can help us show how we feel and see life in new ways. Here are three painters\
    \ with their paintings: Matisse’s Young Woman in White, Red Background, Picasso’s\
    \ Interior with a Girl Drawing, and Van Gogh’s Café Terrace at Night.\n     Matisse\
    \ uses simple lines and strong colors, like red, blue, green, and yellow, in different\
    \ parts of the painting “Young Woman in White, Red Background”. He wants us to\
    \ feel how the painting feels, not just what it shows. It’s like when you draw\
    \ a happy sun or a sleepy cat — sometimes it’s more about the feelings instead\
    \ of the perfect lines! On the other hand, some painters like to paint things\
    \ from nature, like flowers, rivers and the sky. They help us feel like we are\
    \ there enjoying the day. Just like Van Gogh, he uses strong and thick colors\
    \ to make everything in the painting alive. Let’s take the painting “Café Terrace\
    \ at Night” for example. The two parts, the bright yellow coffee shop and the\
    \ dark blue night sky are perfect together —like the stars are dancing and the\
    \ night is slowly moving, and just like you are one of the people sitting at little\
    \ tables, talking and relaxing.\n     Picasso’s painting “Interior with a Girl\
    \ Drawing” shows a girl sitting at a table, drawing — just like what you may do.\
    \ But guess what? It doesn’t look exactly like real life. Picasso likes to paint\
    \ in a special way that uses lines, shapes and colors instead of making things\
    \ look perfectly real.\n   All three painters are different, but they have one\
    \ thing in common: They believe art can show how you feel inside — with colors,\
    \ shapes, and imagination!\n      alive 栩栩如生的   exactly 精確地   imagination 想像力"
