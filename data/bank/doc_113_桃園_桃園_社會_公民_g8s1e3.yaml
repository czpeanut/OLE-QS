- id: doc_113_桃園_桃園_社會_公民_g8s1e3_s1_32
  section: 1
  number: 32
  type: single
  page: 1
  stem: 臺灣省，簡稱「臺」，為中華民國已虛級化的省份，全省劃分為 11 縣、3 市，範圍為臺灣本島去除與省同級的直轄市以外的地區、澎湖群島，以及鄰近臺灣本島之離島。2018
    年 6 月 28 日，行政院決議將臺灣省政府去任務化，自翌年起省級機關預算歸零，所存省級行政組織及業務自同年 7 月 1 日完全移交中央政府，臺灣省政府實質上廢除。針對目前省主席與省諮議員其產生方式與下列何者相同？
  options:
  - label: A
    content: 監察委員
  - label: B
    content: 教育部部長
  - label: C
    content: 立法院院長
  - label: D
    content: 桃園市市長
