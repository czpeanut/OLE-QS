  group_stem: '【錯誤】網傳「海外國民回台恢復戶籍後，還必須在台住滿4 個月以上，才有總統大選投票權」？

    2022-11-04】

    事實查核報告#2015

    網傳「海外國民回台恢復戶籍後，還必須在台住滿 4 個月以上，才有總統大選投票權」？

    發布日期／2022 年 11 月 4 日

    經查：

    一、經查，戶籍因兩年未返台而被遷出的國人，在台重新設立戶籍滿六個月，即有總統投票權，設立戶籍後，仍可出入境。傳言提及「設立戶籍後，須實際居住超過 4 個月，才能投票選總統」為錯誤訊息。

    二、針對戶籍「被遷出」而尚未重設的海外國人，中選會及地方政府民政局指出，只要持有有效護照、曾在台灣居住六個月以上，符合選舉人資格，仍可申請總統大選投票。申請辦法是在總統選舉公告發布日到投票日前
    40 日，向原戶籍地戶政事務所申請。

    因此，傳言為「錯誤」訊息。

    中選會進一步說明，即使海外國民現在在台灣並無戶籍，但只要「曾經」在台設立戶籍滿六個月以上者，也可以持中華民國護照，申請返國行使選舉權。依照《在國外之中華民國自由地區人民申請返國行使總統副總統選舉權登記查核辦法》第
    4 條，從總統副總統選舉公告發布日到投票日前 40 天，都可以向遷出國外時戶籍地的戶政事務所申請。

    中選會強調，目前只有總統副總統選舉，才允許海外國民在戶籍被遷出時，用申請方式，持護照返國行使投票權；其他公職選舉則依《公職人員選舉罷免法》第十五條，必須在各該選舉區「設立戶籍四個月以上」，才有投票權。'
