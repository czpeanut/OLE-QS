- id: doc_113_桃園_桃園_社會_公民_g8s1e3_s1_36
  section: 1
  number: 36
  type: single
  page: 1
  stem: 桃園市、新竹市都有好孕專車，尤其桃園市補助居全台之冠，但使用範圍僅限設讀卡機的 1.6 萬輛計程車，挨批「看得到叫不到」；民代另建議，沿海偏鄉地區應提高補助，以免美意打折。桃園市婦幼局回應，將與交通局研議擴大至捷運、公車，並考慮調整補助金額。請問：上述內容分析，下列何者最為正確？
  options:
  - label: A
    content: 好孕專車政策屬於地方自治中的經濟發展項目
  - label: B
    content: 桃園市好孕專車補助金額需經過桃園市議會通過
  - label: C
    content: 桃園市婦幼局屬於地方民意機關，負責監督政府
  - label: D
    content: 依地方自法規定，桃園市與新竹市屬相同自治層級
  tags:
    chapter:
      publisher: 翰林
