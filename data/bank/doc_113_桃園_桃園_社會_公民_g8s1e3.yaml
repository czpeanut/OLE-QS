  group_stem: '【超強寒流來襲各地停班停課一次看】

    寒流發威，中央氣象署日前發布 21 縣市低溫特報，將影響至周三，台灣本島及離島多處平地氣溫在攝氏 10 度以下，由於這波溼冷寒流水氣很夠，包括馬祖、台北、宜蘭、桃園及新竹等地區皆出現下雪的情況，在低溫度及雨勢結合下，結冰的路面容易發生危險。包括台北市、桃園市、新竹縣及台中市依「天然災害停止上班及上課作業辦法」已有學校宣布停課。

    台北市

    • 陽明山國小：23 日、24 日停課兩天。

    • 湖田實小：23 日停班一天。

    桃園市

    • 復興區華陵里、三光里、高義里：停止上班課。

    • 復興區三光國小附設幼兒園：1 月 23 日、1 月 24 日停課兩天。

    • 復興區高義國小附設幼兒園：1 月 23 日、1 月 24 日停課兩天。

    新竹縣

    • 尖石鄉新光國小：23 日停課 1 天

    • 尖石鄉玉峰國小：23 日停課 1 天

    • 尖石鄉石磊國小：23 日停課 1 天

    台中市

    • 和平區：今天中午過後幼兒園放假、24 日全部學校停課 1 天'
  tags:
