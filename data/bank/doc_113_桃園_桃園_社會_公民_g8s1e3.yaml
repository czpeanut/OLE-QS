- id: doc_113_桃園_桃園_社會_公民_g8s1e3_s1_37
  section: 1
  number: 37
  type: single
  page: 1
  stem: 桃園市環保局表示，根據疾病管制署統計，桃園今年至 12 月 16 日有 22 件境外移入登革熱病例、本土病例無，相較去年同期 67 件 境外移入 27
    本土 40，減少 45 例。環保局今年仍安排兩次大規模消毒，動員 12 區中隊及環保志工隊清理及巡查，全力防堵登革熱疫情。 桃園市藉由宣導及民眾落實防疫，今年無本土疫情，很不容
    易。根據衛生局病媒蚊誘卵桶監測結果加強複查及宣導，且環境部補助採購各種防疫物資，提供 12 區中隊執行環境衛生巡檢，有效提升人員巡檢安全防護，呼籲民眾主動進行家戶孳生源清除，並以落實「巡、倒、清、刷」4
    步，共同防疫。關於下列說法何者符合上文所述？
  options:
  - label: A
    content: 中央與地方分權而治，互不干涉
  - label: B
    content: 病媒區具區域性，無須跨區合作
  - label: C
    content: 桃園市環保局需要接受市民大表會監督
  - label: D
    content: 環保志工隊清理及巡查屬於地方自治中安全衛生。
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 公民
      code: 5-2
      title: 地方政府的職權
      chapter: 第5章 地方政府
