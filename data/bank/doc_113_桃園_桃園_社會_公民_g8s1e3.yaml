    labeled_by: ai
- id: doc_113_桃園_桃園_社會_公民_g8s1e3_s1_38
  section: 1
  number: 38
  type: single
  page: 1
  stem: '桃園捷運綠線，是一條興建中的桃園捷運中運量路線，由桃園市政府捷運工程局進行規劃及施工，第一階段預計 2026 年完工通車。 桃園捷運綠線全長約 27.8
    公里，共設 21 站，其中地下段約 12.5 公里、10 座車站，高架段約 15.3 公里、11 座車站，採用鋼輪鋼軌、CBTC 通訊式列車控制系統及無人駕駛系統。

    綠線延伸中壢路段路線全長約 7.2 公里，共預估設置 1 座高架車站、 4 座地下車站及 1 座駐車機廠，總經費約 361.59 億元，由中央負擔 209.46
    億元、桃園市政府負擔 152.13 億元。未來捷運綠線延伸中壢路線將可連結桃園機場捷運線和桃園捷運綠線主線，形成一環狀路網，串接北桃交通。

    桃園市政府已接獲行政院核定，完成延伸案專案管理（PCM）招標作業，在設計檢討後送交工程會審議核定經費，最快可在 2024 年下半年辦理工程招標並在 2024
    年底前動工，力拼 2031 完工！關於文中內容，下列說明何者正確？'
  options:
  - label: A
    content: 桃園市捷運局長由行政院長提請總統任命
  - label: B
    content: 桃園市負擔 152.13 億元須由立法院通過此預算案
  - label: C
    content: 針對桃園捷運綠線的重大工程，桃園市議會扮演監督之責
  - label: D
    content: 桃園捷運綠線開通應屬於中央政府委辦地方政府進行興建的建設工程
  tags:
