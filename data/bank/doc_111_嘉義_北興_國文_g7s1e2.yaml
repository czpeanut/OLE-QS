  section: 3
  number: 26
  type: single
  page: 4
  stem: 下列哪段話表現吳寶春師傅謙卑感恩的精神？
  options:
  - label: A
    content: 吳寶春用於挑戰自己的盲點，即使遭逢練習失敗，也能不斷激勵自己去面對
  - label: B
    content: 吳寶春到飯店住三天，將飯店裡的每一個餐廳吃遍，讓腦袋與舌頭記住什麼才叫「美味」
  - label: C
    content: 吳寶春拚命奮鬥，不忘母親負擔家計的艱苦，渴望成功後能讓母親過上更優渥的生活
  - label: D
    content: 吳寶春喜歡閱讀商業、勵志書籍，使他發現未曾領略的世界，讓作品到達更高的境界。
  group_stem: '出生在屏東鄉下，吳寶春是家中八個小孩的老么，十二歲時，父親過世，家中生計全靠母親一人：打零工、採鳳梨、甘蔗，到了晚上還要到流水席幫忙端菜，想到母親常常體力不支，幾乎累垮，卻還是喝著提神飲料繼續上工，吳寶春咬著牙，堅忍獨自一人北上當學徒的所有艱辛，「跟母親比，這些練習的辛苦通通變得不算什麼。」將挫折轉化為力量，吳寶春不眠不休地奮鬥著，憑藉著強烈的驅力渴望能夠成功、出人頭地，讓母親能夠過上更優渥的生活。吳寶春曾以為不升學、當學徒就可以不必學習，因為自己雖不怕苦，但害怕讀書，沒想到，當學徒後還是得學習，而且，這種學習一點也不比讀書輕鬆。在當兵時，為了突破做麵包的瓶頸，他開始認真「讀書識字」，時常一邊看電視，一邊對著字幕認字，遇到困難時，就請益同袍；同時，他也喜歡閱讀商業、勵志書籍，於他而言，閱讀就像讓他長出一對能翱翔天際的雙翼，使他能夠飛得更高、更遠，發現未曾領略的世界。


    但僅僅如此還是不夠，「你的作品中少了一股生命力，難以讓顧客驚豔。」堂本麵包創辦人陳撫洸的一席話驚醒了吳寶春，他開始隨著陳撫洸學著「品味」，從嘗美食、品酒，甚至到臺北亞都飯店住三天，將飯店裡的每一個餐廳吃遍，讓腦袋與舌頭記住什麼才叫「美味」。而後，吳寶春開始嘗試將沒人用過的義大利青醬、肉醬、橄欖油等食材加入麵包中，讓口味及特色變得更加鮮明，也更具自己的特色。「遇到盲點，你去挑戰，去克服，會收穫很多。」每逢練習失敗，吳寶春便不斷地以此激勵自己去面對，他認為不管在什麼樣的位置，當下的努力非常重要，即便跌倒了，即便遍體鱗傷，都必須站起來繼續往前走。
    改寫親子天下〈吳寶春：世界冠軍麵包裡的故事〉'
