  group_stem: "1997 年澳洲科學家發現：當人維持清醒超過17 個小時，其行為表現相當於血液酒精濃度達0.05%，而持續清醒超過24 小時後，行為表現更相當於血液酒精濃度達0.10%。臺灣目前法規已將血液酒精濃度達0.03%視為酒醉駕駛，達0.05%則符合公共危險罪，由此可知睡眠不足對人的影響應如同酒駕一般被重視。\n\
    \n 腦波頻譜分析研究也發現睡眠不足者在注意目標刺激時，額葉區域特定腦波會變弱，但頂葉特定腦波卻增加，表示大腦補償機制嘗試補強因睡眠不足而變弱的注意力。整體而言，熬夜不睡覺可能降低腦部頂葉與額葉相關區域的活動量，進而減化高層次認知功能的表現。\n\
    \n 睡眠不足者注意目標反應時間的變異性，明顯高於正常睡眠者，顯示睡眠不足者有時注意目標刺激的反應時間雖未減緩，但整體反應時間仍較正常睡眠者緩慢，依靠補償機制或個人意志力是無法克服睡眠不足的不良後果，綜合這一系列睡眠的生理研究顯示：<u>缺乏睡眠會減弱人的注意力與錯誤監控能力</u>。\n\
