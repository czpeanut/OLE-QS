  type: single
  page: 4
  stem: 作者認為千里馬之所以無法展現其才能，最主要的原因是?
  options:
  - label: A
    content: 鳴之不通其意
  - label: B
    content: 不知馬也
  - label: C
    content: 訓練無方
  - label: D
    content: 食之不飽。
  group_stem: '世有伯樂，然後有千里馬。千里馬常有，而伯樂不常有。故雖有名馬，只辱於奴隸人之手，駢死於槽櫪之間， 不以千里稱也。

    馬之千里者，一食或盡粟一石。食馬者，不知其能千里而食也。是馬也，雖有千里之能，食不飽，力不足，才美不外見，且欲與常馬等不可得，安求其能千里也？

    策之不以其道，食之不能盡其材，鳴之而不能通其意，執策而臨之，曰：「天下無馬！」嗚呼！其真無馬邪？其真不知馬也！ （韓愈〈馬說〉）


    【注釋】1.伯樂：孫陽。春秋時人，擅長相馬。

    2.駢死：並列而死。

    3.槽櫪：馬槽。

    4.策：馬鞭，此指鞭打。

    5.其：通「豈」，難道。'
