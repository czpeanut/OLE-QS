- id: doc_111_桃園_同德_自然_g7s2e1_s1_49
  section: 1
  number: 49
  type: single
  page: 6
  stem: 試管嬰兒分別於何處受精與發育？
  options:
  - label: A
    content: 培養皿內受精，母體子宮發育
  - label: B
    content: 培養皿內受精，培養皿內發育
  - label: C
    content: 母體內受精，母體子宮發育
  - label: D
    content: 母體內受精，培養皿內發育。
  group_stem: "歷史上第一個試管嬰兒\n    「西元1978 年的夏天，一名誕生於英國的小女嬰震驚了全世界—露薏斯‧布朗，是全球第一名利用胚胎植入方式所產下的試管嬰兒。試管嬰兒並不是在試管裡長大，而是在試管（嚴格來說是培養皿）內受精，是從母體取出卵，放在培養皿後再加入精子，等受精卵分裂並發育為早期胚胎之後，再轉移至母親的子宮內繼續生長到成熟再產出。布朗太太由於輸卵管阻塞的問題，嘗試了九年始終未能懷孕，後來開始接受這個當時還屬於實驗性質的治療，才終於生下露薏斯。羅伯特‧愛德華便是當初協助布朗夫婦的醫師，而他也因為此一成就獲得西元2010\
    \ 年諾貝爾生物醫學獎。曾經有人擔心試管嬰兒會有健康上的問題，但隨著露薏斯正常的長大並結婚生子，這一切的疑問盡皆煙消雲散。四十年後的今天，全世界已有超過數百萬名的試管嬰兒，而這項技術仍持續蓬勃發展當中。針對一些試管嬰兒體外受精技術都難以成功受精的夫婦，而發展出「單一精子卵質內顯微注射」技術，是利用人工的方式，將單一精子確實注入到卵，能夠增加精卵在體外的受精成功率。不孕的夫婦想要擁有自己的小孩，過程中除了要忍受治療的身體不適，心理也會承受著極大的壓力，而試管嬰兒技術提供了他們一線希望。正如愛德華醫師的諾貝爾得獎頌詞中說：「不孕不僅是一個醫療問題，也會帶來精神創傷。」愛德華醫師治療的不只是人們的身體，也治癒了許多不孕夫婦們的心。（取自翰林課本－科學大事紀）"
