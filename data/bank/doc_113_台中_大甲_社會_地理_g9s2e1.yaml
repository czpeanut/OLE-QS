  group_stem: '◎臺灣的地名大多為漢人命名，在命名上其實有原則可循。地名的結構可分為專名與通名兩部分。專名在前，多為形容詞或名詞，用以形容該地的地理、歷史或其他特徵，通名在後，則代表地名的共通性。例如：新竹，「新」是形容新設立的地方，而「竹」則代表竹塹。不過地名的命名並非鐵則，也有例外。附表為臺灣常見的專名、通名舉列，請回答下列問題。


