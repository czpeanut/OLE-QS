- id: doc_113_高雄_龍華_國文_g7s2e3_s4_32
  section: 4
  number: 32
  type: single
  page: 5
  stem: 文中以詼諧筆法描述喪親之痛，原因最可能是下列何者？
  options:
  - label: A
    content: 作者對父親懷恨在心，喪父反倒是在心中竊喜
  - label: B
    content: 作者其實非親生子女，只是前來工作的葬儀社
  - label: C
    content: 作者對喪禮充滿不滿，刻意嘲諷各種荒謬事蹟
  - label: D
    content: 作者透過喪禮繁文縟節的荒謬凸顯家屬的悲傷
  group_stem: '第七日。送葬隊伍啟動。

    我只知道，你這一天會回來。不管三拜九叩、立委致詞、家祭公祭、扶棺護柩，（棺木抬出來，葬儀社部隊發給你爸一根棍子，要敲打棺木，斥你不孝。我看見你的老爸爸往天空比畫一下，丟掉棍子，大慟。）<u>(甲)一有機會，我就張目尋找。你在哪裡？我不禁要問。你是我多天下來張著黑傘護衛的亡靈亡魂？（長女負責撐傘。）還是現在一直在告別式場盤旋的那隻紋白蝶？或是根本就只是躺在棺材裡正一點一點腐爛屍水正一滴一滴滲入衛生紙滲入木板？</u>

    火化場，宛如各路天兵天將大會師。領了號碼牌，領了便當，便是等待。我們看著其他荒謬兵團，將他們親人的遺體和棺木送入焚化爐，然後高分貝狂喊：火來啊，緊走！火來啊，緊走！我們的道士說，那樣是不對的，那只會使你爸更慌亂更害怕。等一下要說：「爸，火來啊，你免驚惶，隨佛去。」

    我們說，爸，火來啊，你免驚惶，隨佛去。

    第八日。我們非常努力地把屋子恢復原狀，甚至風習中說要移位的床，我們都只是抽掉涼席換上床包。

    有人提議說，去你最愛去的那家牛排簡餐狂吃肉（我們已經七天沒吃肉）。有人提議去唱好樂迪。但最終，我們買了一份《蘋果日報》與一份《壹週刊》。各臥一角沙發，翻看了一日，邊看邊討論哪裡好吃好玩好腥羶。<u>(乙)我們打算更輕盈一點，便合資簽起六合彩。08。16。17。35。41。農曆8
    月16 日，17 點35 分，你斷氣。41，是送到火化場時，你排隊的號碼。（那一日有整整80 具在排。）</u>

    開獎了，17、35 中了，你斷氣的時間。賭資六百元（你的反服父、護喪妻、胞妹、孝男、兩個孝女共計六人每人出一白），彩金共計四千五百多元，平分。組頭阿叔當天就把錢用紅包袋裝好送來了。他說，台號特別號是53
    咧。大家拍大腿懊悔，怎沒想到要簽？可能，潛意識裡，53，對我們還是太難接受的數字，我們太不願意再記起，你走的時候，只是53 歲。

    我帶著我的那一份彩金，從此脫隊，回到我自己的城市。

    <u>(丙)有時候我希望它更輕更輕。不只輕盈最好是輕浮。輕浮到我和幾個好久不見的大學死黨終於在搖滾樂震天價響的酒吧相遇我就著半昏茫的酒意把頭靠在他們其中一人的肩膀上往外吐出菸圈順便好像只是想到什麼的告訴他們。</u>

    欸，忘了跟你們說，我爸掛了。

    他們之中可能有幾個人來過家裡玩，吃過你買回來的小吃名產。所以會有人彈起來又驚訝又心疼地跟我說你怎麼都不說我們都不知道？

    我會告訴他們，沒關係，我也經常忘記。

    是的。我經常忘記。

    <u>(丁)於是它又經常不知不覺地變得很重。重到父後某月某日，我坐在香港飛往東京的班機上，看著空服員推著免稅菸酒走過，下意識提醒自己，回到台灣入境前記得給你買一條黃長壽。這個半秒鐘的念頭，讓我足足哭了一個半小時。直到繫緊安全帶的燈亮起，直到機長室廣播響起，傳出的聲音，彷彿是你。</u>

    你說：「請收拾好您的情緒，我們即將降落。」

    ——節錄自劉梓潔〈父後七日〉'
