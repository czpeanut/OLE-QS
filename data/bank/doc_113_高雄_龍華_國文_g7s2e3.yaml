  type: single
  page: 2
  stem: 下列有關〈五柳先生傳〉的文意配對，何者敘述正確？
  options:
  - label: A
    content: 忘懷得失，以此自終／生不逢時，懷才不遇
  - label: B
    content: 環堵蕭然，不蔽風日；短褐穿結，簞瓢屢空—晏如也／憂道不憂貧
