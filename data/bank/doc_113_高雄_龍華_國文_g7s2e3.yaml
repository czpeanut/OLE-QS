  stem: 下列關於劉、阮二人的敘述何者錯誤?
  options:
  - label: A
    content: 為了尋找失散多年的妻子而入天台山
  - label: B
    content: 不幸迷途山中，只有桃子能暫時充飢
  - label: C
    content: 撿到有胡麻飯粒的杯子推測村落不遠
  - label: D
    content: 回到家鄉，發現滄海桑田、人事皆非
  group_stem: '漢明帝 永平五年，剡縣劉晨、阮肇共入天台山取穀皮，迷不得返，經十三日，糧食乏盡。遙望山上有一桃樹，大有子實，而無登路。攀援藤葛，乃得至上。各啖數枚，而飢止體充。復下山，持杯取水，見蕪菁葉從山腹流出，甚鮮新，復一杯流出，有胡麻飯糝，相謂曰：「此知去人徑不遠。」便共沒水，逆流二三里，得度山出一大溪，溪邊有二女子，姿質妙絕，見二人持杯出，便笑曰：「劉、阮二郎，捉向①所流杯來。」晨、肇既不識之，緣②二女便呼其姓，如似有舊，乃相見忻喜。問：「來何晚邪？」因邀還家。

    其家南壁及東壁下各有一大床，皆施絳羅帳，帳角懸鈴，金銀交錯。床頭各有十侍婢，敕③云：「劉、阮二郎，經涉山岨，向得瓊實④，猶尚虛弊⑤，可速作食。」食胡麻飯、山羊脯、牛肉，甚甘美。食畢行酒，有一群女來，各持五三桃子，笑而言：「賀汝婿來。」酒酣作樂，劉、阮忻怖交併。至暮，令各就一帳宿，女往就之，言聲清婉，令人忘憂。

    十日後，欲求還去，女云：「君已來是，宿福所牽，何復欲還邪？」遂停半年。氣候草木是春時，百鳥啼鳴，更懷悲思，求歸甚苦。女曰：「罪牽君⑥，當可如何？」遂呼前來女子，有三四十人，集會奏樂，共送劉、阮，指示還路。

    既出，親舊零落，邑屋改異，無復相識。問訊得七世孫，傳聞上世入山，迷不得歸。至晉 太元八年，忽復去，不知何所。 ——改寫自劉義慶《幽明錄．劉晨阮肇》


    📖：①向：先前。 ②緣：因為。 ③敕：吩咐。 ④瓊實：仙果的別稱。

    ⑤虛弊：虛弱疲憊。 ⑥罪牽君：塵世牽引著你們一定要回去。'
