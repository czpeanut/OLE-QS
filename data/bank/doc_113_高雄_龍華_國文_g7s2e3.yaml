- id: doc_113_高雄_龍華_國文_g7s2e3_s4_34
  section: 4
  number: 34
  type: single
  page: 6
  stem: 根據本文，下列敘述何者有誤？
  options:
  - label: A
    content: 「痠」感其實是本體感覺神經受到刺激，與痛覺神經並無太大關聯
  - label: B
    content: 包含華語及臺語的漢藏語系無異於其他語系，皆將痠與痛歸為一類
  - label: C
    content: 「Sngception」的出現，反映出語言和其使用者生活經驗息息相關
  - label: D
    content: 透過痠覺量表和止痠藥物，可以減少鉅額無效止痛的醫療資源浪費
  group_stem: '痠痛是「痠」還是「痛」?在台灣，肌肉骨骼痠痛是醫療支出的第一名，但這類慢性痠痛往往難以有效被治療。為找出痠痛的真正原因，以對症下藥，中央研究院生物醫學研究所
    陳志成特聘研究員團隊，在國科會腦科技專案計畫及中研院深耕計畫的支持下，發現「痠」和「痛」，其實是不同的感覺，誘發痠的神經並非痛覺神經，而是「本體感覺神經」；痠覺神經的過度活化，才是組織酸化、造成慢性痠痛的主因。此一系列成果，發表於國際頂尖期刊「科學前緣」(Science
    Advances)。

    研究團隊證明痠覺神經不同於痛覺神經，並發現本體感覺神經就是種痠覺神經。組織酸化主要會刺激本體感覺神經，進而誘發痠感而非痛感。這個結果顛覆過去50 年來醫學界的觀念，且創造
    Sngception (痠覺)這個名詞，Sngception 的字首 Sng 是臺語「痠」的羅馬拼音，由於語言文化的差異，「痠覺」不同於「痛覺」的概念，只有在漢藏語系才有，其他西方語系或阿爾泰語系(日、韓)都將痠、痛視為「痛」。此團隊成員包括英國、美國和德國的國際學者，一致對Sngception
    的概念表示肯定。由臺灣在國際重要學術期刊發表領域首創Sngception 名詞，往後將被沿用下去，有望讓臺灣成為這個新興神經科學研究領域的主導者，享有絕對的話語權。

    目前北醫、萬芳、雙和醫院的門診醫令系統已導入痠覺量表，未來將繼續推廣至其他醫療院所，藉由確認痠和痛為不同的感覺，有助於臨床進行痠和痛的精準診斷，並對症下藥，可避免無科學依據的無效止痛處置，也可避免止痛藥的浪費，進而推動未來止痠藥物的開發，預期可為臺灣減少鉅額無效止痛的醫療支出(臺灣健保藥物支出一年超過2000
    億，使用人數最多的就是止痛藥物)，這對臺灣的社會、經濟及生醫科技發展，都將有深遠、巨大的影響。團隊也將在近期制定「痠覺詞語」，重新建構痠覺醫學與痛覺醫學，開啟全球「痠」、「痛」精準醫學的新時代。

    ——改寫自中央研究院〈發現「痠」、「痛」大不同——神經醫學邁入精準治療新時代〉'
