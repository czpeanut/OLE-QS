  stem: 泡菜為南韓傳統食物，近年來，南韓推出專門存放泡菜的「泡菜冰箱」以供日常食用，可見南韓人對泡菜的依賴。請問：南韓盛行醃製泡菜最可能是受到下列何種環境因素的影響【習作】？
