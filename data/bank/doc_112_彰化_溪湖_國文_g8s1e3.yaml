  group_stem: "(一)\n    很少有季節是真正從日曆上所記載的那一天開始。相反的，季節是一種質感的經驗：當我們感到光線的質地、白晝的長度和皮膚所感受的空氣有一些幽微的變化，我們便察覺到，大自然正進行一些變化。\n\
    \    「小時」便是一天中的季節。它們最初的意義即帶有神祕的意味。先人並不依賴鬧鐘作息，而是把時間擬人化，視之為萬物生長、盛開和結果的永恆流轉之信差。在地球萬物生長和變化所開展的韻律中，每一小時都有一個遠比我們固定的時鐘刻度更為豐富而複雜的性格和面貌。\n\
    \    今天，即使是在忙碌的城市生活中，我們依然注意到黎明、清晨、上午與正午皆分別擁有它們獨特的性質。陰影漸長的下午和天色漸暗、華燈初上時的性格，便全然不同。\
    \           （大衛史坦德 寂靜之聲 一天中的季節）"
