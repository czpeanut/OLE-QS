  stem: "「從小就養成追求第一名的性格，是有很多副作用的。比如，會為了達到目的，不擇手段。長大之後，我不會記得自己哪次月考考幾分，但我記得很清楚的是，為了排名，我曾違背過良心。寫錯了字，老師沒改到，我猶豫了一下：該不該自首呢？結果是，我偷偷把寫錯的答案改成正確的，矇混過去，只因少了那一分，排名就會掉出三名外，回家之後必然會被責罵：『成績退步了！』追求名列前茅，可能造成『自責太深』的性格，習慣於迫害自己。有一次和羅文嘉聊天，談到他小時候記憶最深的事情。他表示，從小成績都是前三名，有一次退步到三名外，自己就心慌意亂得不得了，回家途中經過了一片竹林，就抽了一枝竹枝，拿到父親面前，要爸爸處罰自己，那時他才小學二年級，根本還沒讀過廉頗『負荊請罪』的故事，竟然就會這麼做。長大後想來哭笑不得，真是早熟得可怕！」\n\
    \  根據以上文章內容，下列何者不是追求第一名的副作用？"
