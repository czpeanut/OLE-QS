    \ 分是吃了三顆茶葉蛋的「總效應」。我們也可以算出行為中的平均效應，在此例中，每一顆茶葉蛋的平均效應就是80 除以3，等於26.67。\n    然而，在吃這三個茶葉蛋的時候，每吃一個茶葉蛋所產生的滿足感卻是各有不同，不能以平均效應來計算。因為飢餓的感覺，慢慢會因食物填滿肚子後而遞減，最後所吃進去的食物，它對人產生的滿足感最低，效應也最小。因此，每顆茶葉蛋所產生的效益也並不相同。第一顆茶葉蛋的效應是把我們的滿足感從0\
    \ 提升到50 分，第二顆則是從50 提升到70，最後一顆是從70 提升到80。也就是說，第一顆蛋的效應是50 分，第二顆是20 分，第三顆是10 分。\n\
    \    接連吃下好幾顆茶葉蛋，每多吃一顆所增加的效應，稱為「邊際效應」（marginal utility）。一個人在一定時間內對特定物品的消費過程中，總效應通常是一直增加的，但隨著消費量的不斷增加，邊際效應會逐漸減少，最後也有可能成為負數。例如吃茶葉蛋吃到膩或者吃不下甚至嘔吐的情況，茶葉蛋的邊際效應就變成負數的了。\n\
    \    以消費行為來說，因為我們的金錢有限，故會希望每次花錢都很划算，於是我們總是會考慮總效應最大化的選項，既然重複購買每個商品的邊際效應會遞減，那麼你就會有非常多樣的組合。例如吃五個茶葉蛋的邊際效應已經成為0\
    \ 時，我們就不會把錢花在買第六個茶葉蛋，讓茶葉蛋的邊際效應成為負數，而是將買第六顆茶葉蛋的錢拿來買一根香蕉。於是乎，在邊際效應的理論中，「選擇」是一個很重要的概念，消費者通常都是在有限的資源之下選擇最適合自己的商品組合。\n\
    \           （改寫自劉炯朗 用一顆茶葉蛋學「邊際效應」）"
