  section: 1
  number: 16
  type: single
  page: 1
  stem: 「想要體會『一年』有多少價值，你可以去問一個失敗重修的學生。想要體會『一月』有多少價值，你可以去問一個不幸早產的母親。想要體會『一週』有多少價值，你可以去問一個定期週刊的編輯。想要體會『一小時』有多少價值，你可以去問一對等待相聚的戀人。想要體會『一分鐘』有多少價值，你可以去問一個錯過火車的旅人。想要體會『一秒鐘』有多少價值，你可以去問一個死裡逃生的幸運兒。想要體會『一毫秒』有多少價值，你可以去問一個錯失金牌的運動員。」（吳學剛
    用對時間做對事）這段話說明的道理為何？
  options:
  - label: A
    content: 不同長度的時間，應由不同的人去使用
  - label: B
    content: 擁有時間的長度，決定人生的價值高低
  - label: C
    content: 時間不論長短，都會對某些人具有意義
  - label: D
    content: 時間長短可決定其中所代表的成敗。
