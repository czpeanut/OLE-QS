  stem: "老師請同學收集有關史記與其作者的相關資料，並要同學上台報告，報告正確者可以獲得獎勵。以下是同學的報告內容，請問有幾位同學可以獲得獎勵？\n  小彬：作者司馬遷於漢文帝時出任太史令，因李廣事件入獄\n\
    \  小燦：史記採用紀傳體，以人物傳記的形式來記敘歷史，是\n        司馬遷沿襲前人所創體制而寫成的\n  小玟：史記記載從黃帝到漢武帝年間約三千年的歷史，是通\n\
    \        史之祖\n  小城：張釋之是位大官，張釋之執法應屬「世家」中的一篇\n  小旻：史記善用具體事件與對話表現人物性格，語言鮮明生\n   \
