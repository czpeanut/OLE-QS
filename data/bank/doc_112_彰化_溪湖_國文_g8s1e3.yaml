  type: single
  page: 1
  stem: 關於「尺璧非寶，寸陰是競」這句格言，以下何者的說明錯誤？
  options:
  - label: A
    content: 以句型結構來分析，「尺璧非寶」、「寸陰是競」都屬於「判斷句」
  - label: B
    content: 此句譯為：直徑一尺長的璧玉算不上寶物，片刻的光陰卻值得去爭取
  - label: C
    content: 本句主旨和「一寸光陰一寸金，寸金難買寸光陰」的意義類似
  - label: D
    content: 「寸陰是競」是倒裝句，將其還原後為「競寸陰」，「是」為表賓語提前的助詞。
