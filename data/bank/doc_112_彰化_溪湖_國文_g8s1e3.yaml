    年以交換學生身份到耶魯大學讀碩士學位，後跟隨明、清史權威學者房兆楹做博士論文，其漢名史景遷為房兆楹所命，義為『景仰司馬遷』。史景遷在1965 年以康熙與曹寅論文獲耶魯大學史學博士學位，畢業後留在耶魯教書，直到2008
