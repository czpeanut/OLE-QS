    \ 喀拉哈里盆地的布希曼人，長期維持採集與狩獵的生活，每週只需勞動 15 個小時，就能獲取充分的營養。\n\n    生活在「甲」地區的布希曼人，仰賴稱作「曼傑提樹」的果實為重要熱量來源。該樹多分布於南部非洲，適宜高溫、少雨的環境。曼傑提樹結果實的時間始於雨季結束時，但由於此時草叢較高、野生動物出沒頻繁，因此採收通常在\
