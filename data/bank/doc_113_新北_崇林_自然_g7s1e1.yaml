- id: doc_113_新北_崇林_自然_g7s1e1_s3_47
  section: 3
  number: 47
  type: single
  page: 4
  stem: 根據文章，Peter Agre 如何證明他發現的蛋白質是水通道蛋白？
  options:
  - label: A
    content: 他利用顯微鏡觀察細胞內的變化
  - label: B
    content: 他將細胞放入水中，觀察含有水通道蛋白和不含水通道蛋白的細胞變化
  - label: C
    content: 他測試了細胞對鹽分的吸收能力
  - label: D
    content: 他在不同生物中進行實驗來驗證水通道蛋白的功能。
  group_stem: '水通道蛋白

    在19 世紀中葉，人們就知道細胞必定有一個管道能讓水與鹽類流通。在1950 年代中期，發現有一個只能讓水分子迅速進出細胞的通道。在1980 年代中期，Peter
    Agre 研究紅血球細胞膜上的蛋白質(又稱膜蛋白)，而他也在腎臟中發現一個同類型的蛋白質，並猜測這一定就是眾多學者一直在鑽研的那個蛋白質——細胞的水通道蛋白。

    Peter Agre 利用一個簡單的實驗來測試他的假設，在此實驗中，他比較「含有此膜蛋白」與「不含此膜蛋白」的細胞，當這些細胞放入水中時，含有此膜蛋白的細胞因為滲透壓之故，會吸收水分而脹大，而那些沒有此膜蛋白者脹大的程度則較不明顯。Peter
    Agre 又利用人造細胞來測試，他發現當此人造細胞的膜上有此膜蛋白時，水就可以自由進出。

    這些蛋白質在細菌與動植物中的功能正被勘測中，科學家們特別重視它們在生理上扮演的角色，例如：水通道在人體的腎臟扮演了重要的角色。

    請依據上文，回答第47～48 題：'
