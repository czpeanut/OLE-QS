- id: doc_113_新北_福和_社會_公民_g8s2e3_s1_36
  section: 1
  number: 36
  type: single
  page: 1
  stem: 根據交通部公路局2019 至2023 年的資料，警察機關平均每年取締未成年駕駛案件43,000 餘件。未被查處的黑數，則難以統計。曾有無照駕駛的少年表示，不知道初犯若於30
    日內未繳交罰鍰，則金額會像加利息一樣被提高，也不瞭解再犯的罰鍰會加倍；對於沒參加道安講習會再收到罰單、甚至被開罰禁考，也不甚瞭解。曾有少年因未在期限內參加道安講習被開罰14
    次，意味著剛滿18 歲的他，最快也要等到25 歲才能考照。根據上文所述，以及目前政府的政策，下列何者最可能為無照駕駛少年面臨的處境？(L5、L6)
  options:
