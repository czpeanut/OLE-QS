  stem: 《失控的焦慮世代》中提到，數位科技的進步與家庭教養觀念的緊縮，正導致全球「Z 世代」年輕族群陷入極為嚴重的身心健康危機。對此2024 年澳洲國會通過《社群媒體最低年齡門檻法案》，成為全球第一個立法禁止16
    歲以下青少年使用社群媒體的國家。根據新法，社群媒體平台必須採取「合理措施」以防止16 歲以下用戶使用服務，否則將面臨最高約新台幣10.6 億元的鉅額罰款。請問依照上述新聞，若我國也修定類似法律與政策，請問下列敘述何者正確？(L6)
