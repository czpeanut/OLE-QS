- id: doc_113_屏東_中正_數學_g9s2e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: '請問下列敘述有哪些正確？

    (甲)根據四分位數的定義，一組資料的$Q_{3}-Q_{2}=Q_{2}-Q_{1}$。

    (乙)設有100筆資料，則第1四分位數是由小到大排列的第25、26筆資料的平均。

    (丙)設有13筆資料，則第3四分位數是由小到大排列的第10筆資料。

    (丁)若第1四分位數是$Q_{1}$，第3四分位數是$Q_{3}$，則$Q_{3}$可能大於或等於$Q_{1}$。

    (戊)設一組資料的第1四分位數$Q_{1}=10$，第3四分位數是$Q_{3}=30$，則第2四分位數$Q_{2}$必為20。'
  options:
  - label: A
    content: 乙、丙、丁、戊
  - label: B
    content: 乙、丙、戊
  - label: C
    content: 甲、乙、戊
  - label: D
    content: 乙、丙、丁
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 數學
      code: 2-1
