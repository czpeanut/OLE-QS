  section: 1
  number: 33
  type: single
  page: 1
  stem: '臺灣是日本的第一個殖民地，所以面對臺灣人的激烈抗日，日本政府最初並沒有一套既定的統治政策，但隨著臺灣的反應、國際的局勢以及日本政府的需要，治臺政策也隨之改變。依時間先後日本治臺政策的實施順序應為何？

    (甲)武力鎮壓 (乙)內地延長 (丙)台灣人民日本化'
