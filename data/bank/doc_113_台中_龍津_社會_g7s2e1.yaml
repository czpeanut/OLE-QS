- id: doc_113_台中_龍津_社會_g7s2e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 根據上文判斷，來臺的國際移工人數逐年增加的主要原因與下列何者最相關？
  options:
  - label: A
    content: 臺灣的勞動力人口大量外流，缺工嚴重
  - label: B
    content: 臺灣多元豐富飲食文化，深受移工喜愛
  - label: C
    content: 臺灣引進清真認證標章，友善國際移工
  - label: D
    content: 臺灣人不願從事高風險工作，造成缺工
  group_stem: '※臺灣在民國80年代開放國際移工，起初約只有3,000人，隨著經濟發展，對於國際移工的需求逐漸增加，截至民國112年底，已超過75萬人；另外，受到法規限制，移工主要從事兩大工作類別，一為產業移工，包含營建業、製造業與農林漁牧業等；另為社福移工，包含家庭看護、機構看護與家庭幫傭等。由於這些產業在我國的勞動力有很大的缺口，且多具有高度職業風險，因此國際移工成為了補充性的勞動力。

    來臺的國際移工以「某國籍」最多，其次是越南籍、菲律賓籍與泰國籍。宗教信仰是生活中重要的一部分，移工們常見的宗教信仰有佛教、基督宗教與伊斯蘭教等。其中，「某國籍」的國際移工大多數信仰伊斯蘭教，對穆斯林而言，食衣住行都須符合伊斯蘭教的規範，例如：不能食用豬肉和特定動物、血液、酒類和祭拜過的食物；豬肉以外的禽畜肉類必須以清真宰殺方式處理，以減少動物在死去時的痛苦；烹調器具與生產環境都必須是清真食品專用，運輸與儲存的過程也必須與非清真食品分開等。不過，臺灣的飲食習慣會大量使用豬肉，為了友善國際移工，臺灣也引進清真認證標章之相關標準，幫助穆斯林判斷食品是否符合宗教規範。'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
