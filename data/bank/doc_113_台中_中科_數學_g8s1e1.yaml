- id: doc_113_台中_中科_數學_g8s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '如圖(一)，某計算機中有 [√]、[1/x]、[x²] 三個按鍵，以下是這三個按鍵的功能。

    [√]：將螢幕顯示的數變成它的正平方根。例如：當螢幕顯示 16 的時候，按下 [√] 後會變成 4。

    [1/x]：將螢幕顯示的數變成它的倒數。例如：當螢幕顯示 5 的時候，按下 [1/x] 後會變成 0.2。

    [x²]：將螢幕顯示的數變成它的平方。例如：當螢幕顯示 6 的時候，按下 [x²] 後會變成 36。

    若螢幕顯示的數為 100 時，小汎第一下按 [x²]，第二下按 [1/x]，第三下按 [√]，接著依據上述順序皆連按 50 下後，螢幕顯示的數字為何？'
  options:
  - label: A
    content: '0.01'
  - label: B
    content: '0.0001'
  - label: C
    content: '100'
