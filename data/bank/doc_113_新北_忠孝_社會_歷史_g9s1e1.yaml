  number: 28
  type: single
  page: 1
  stem: 金庸小說《倚天屠龍記》中的男主角張無忌，是明教教主，明教受到一個古老文化的宗教所影響，崇拜聖火，並且追求光明。請問：張無忌的明教最可能是受到下列哪個宗教的影響？
