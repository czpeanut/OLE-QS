  section: 1
  number: 29
  type: single
  page: 1
  stem: 約西元前3500 年開始，不論是東方或西方，人類歷史陸續發展出高度文明，如：西亞的蘇美、埃及古王國及中國的殷商時期，下列何者為上述古文明的共同特色？
  options:
  - label: A
    content: 為計算河流氾濫日期而發展出太陽曆
  - label: B
    content: 因洪水氾濫而發展出信奉一神的信仰
  - label: C
    content: 為鞏固統治而發展出嚴格的種姓制度
  - label: D
    content: 為記錄生活及國家要事而發展出文字。
