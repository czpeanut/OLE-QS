- id: doc_113_新北_忠孝_社會_歷史_g9s1e1_s1_34
  section: 1
  number: 34
  type: single
  page: 1
  stem: 蓉蓉在一本介紹某時代的書中看到一段敘述；「此時期作品數量豐富，以寫實風格的人體雕像為主，但已從古典的理性優美轉而表現豐沛的感性，較注重人物內心的動靜與外在的表情，甚至出現華麗裝飾、誇張線條。」請問，蓉蓉還可以在這本書中，看到下列哪位人物的簡介？
  options:
  - label: A
    content: 「吾乃太陽神之子，將代替神明統治大地」的法老王
  - label: B
    content: 「給我一個支點，我可以撐起整個地球」的阿基米德
  - label: C
    content: 「我來，我見，我征服；孤注一擲，勝」的凱撒大帝
  - label: D
    content: 「我只知道一件事，就是什麼都不知道」的蘇格拉底。
