- id: doc_113_新北_忠孝_社會_歷史_g9s1e1_s1_40
  section: 1
  number: 40
  type: single
  page: 2
  stem: 在埃及的歷史上，曾經出現一個重要的女王：克麗奧佩脫拉七世。她是托勒密王朝的最後一任統治者，她有一個更為人所知的稱號，為「埃及豔后」。不過從雕像看來，她其實相貌平平，最大特色是一個大大的鷹勾鼻，是典型的希臘人。比起美貌，她更以聰慧著稱，克麗奧佩脫拉七世為在政爭中取勝，她對羅馬統帥凱撒釋出善意，在其幫助下順利奪回王位。在凱撒被暗殺後，為鞏固權位，她與其部下安東尼結婚，因此取得部分羅馬省份。然而此事引起羅馬人的強烈不滿，給予安東尼的政敵屋大維攻打埃及的機會。最後安東尼兵敗，克麗奧佩脫拉七世用毒自盡，埃及進入羅馬統治時期。請問：根據文章敘述，文中埃及豔后所統治的「托勒密王朝」最可能是下列哪個政權的延續？
  options:
  - label: A
    content: 埃及新王國
  - label: B
    content: 波斯帝國
  - label: C
    content: 亞歷山大帝國
  - label: D
    content: 羅馬帝國。
  tags:
    chapter:
      publisher: 南一
      book: 九上
      subject: 歷史
      code: 2-2
      title: 希臘化世界
      chapter: null
    textbook: 九上歷史 2-2 希臘化世界
    labeled_by: ai
