- id: doc_113_新北_忠孝_社會_歷史_g9s1e1_s1_36
  section: 1
  number: 36
  type: single
  page: 1
  stem: 「柯因奈語」（Koine），又稱「通用希臘語」，是曾流行於地中海東半部的國際性語言。此一語言因某帝國在政治上 統一了愛琴海地區各希臘城邦，融合了該地區多種方言發展而成；其後又伴隨帝國對外武力征服，向埃及、西亞等地區擴散傳播對於往後數百年間科學、文學和宗教的發展影響深遠。上述的「某帝國」，最可能為下列何者？
  options:
