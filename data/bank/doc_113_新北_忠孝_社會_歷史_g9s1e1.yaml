- id: doc_113_新北_忠孝_社會_歷史_g9s1e1_s1_38
  section: 1
  number: 38
  type: single
  page: 2
  stem: 申請了36 年，這座位於伊拉克的古城巴比倫(Babylon)終於在2019 年被列為聯合國教科文組織新增的世界遺產之一。這座城市除了是一個古代王國的首都之外，更是擁有如巴別塔、空中花園在內的許多知名的古文明遺跡；但當地長期戰爭不斷，許多古蹟都受到戰爭的摧殘而被破壞，巴比倫也被認為是世界上受破壞最嚴重的遺跡之一，經考古挖出的歷史文物為躲避戰火，相繼被運送到歐洲各地的博物館保存。雖然目前巴比倫遺跡只開挖出18%的遺跡，但挖掘出的遺跡與眾多的泥板再再證明了這座美索不達米亞地區古城作為人類文明發展搖籃的重要地位。請問：下列何者最可能是巴比倫遺跡作為人類文明發展搖籃的證據？
  options:
  - label: A
    content: 刻有信仰耶和華為唯一真神的一神宗教的教堂遺跡
  - label: B
    content: 世界史上第一個競技場及引水道等規劃的城市遺跡
  - label: C
    content: 使用楔形文字書寫王國發展與當代法律制度的文物
  - label: D
    content: 因版圖橫跨歐亞非三洲而融合周邊地區文化之壁畫。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 歷史
      code: 1-1
      title: 西亞古文明
      chapter: 第1章 西亞與非洲的古文明
    textbook: 九上歷史 1-1 西亞古文明
    labeled_by: ai
