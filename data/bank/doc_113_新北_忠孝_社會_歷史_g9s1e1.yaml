  section: 1
  number: 32
  type: single
  page: 1
  stem: 蔡桃貴自助旅行前往英國，他參加了巴斯和巨石陣一日遊，在巴斯看到某帝國在此留下的浴場遺跡，忍不住感嘆此帝國的公共建設之厲害，帝國範圍之廣大。請問：在巴斯留下浴場遺跡的應為下列哪一個帝國？
  options:
  - label: A
    content: 波斯帝國
  - label: B
    content: 亞歷山大帝國
  - label: C
    content: 羅馬帝國
