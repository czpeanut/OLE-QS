- id: doc_113_新北_忠孝_社會_歷史_g9s1e1_s1_31
  section: 1
  number: 31
  type: single
  page: 1
  stem: 一本歷史書上記載著某位政治人物創立新制度的事蹟：「他首先撤銷四個傳統部落，以避免獨裁統治，而在基層設立139 個『自治區』，以及十個類似部落的行政區，而它們分別由城邦各地所組成。他還設立了由抽籤決定，而非基於裙帶或遺傳關係的立法機構。法庭系統亦得到重組，每天有200
    至5000 人被選出參與陪審。」請問：這位政治人物最可能是何地的政治人物？
  options:
  - label: A
    content: 希臘雅典
  - label: B
    content: 義大利羅馬
  - label: C
    content: 伊拉克巴比倫
  - label: D
    content: 印度馬德里。
