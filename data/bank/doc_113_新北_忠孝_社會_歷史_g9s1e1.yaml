  section: 1
  number: 33
  type: single
  page: 1
  stem: 澤澤在調查自然災害的相關報導時看到以下的報導：「2018 年某國的某地區遭毀滅性洪水襲擊，數千人爬到建築物高處待援，其他地方的漁民紛紛將漁船裝到卡車上運送到當地救人，有一位47
    歲的漁夫喬治（Marion George）在2 天內奮力救出 150 人，卻屢屢遭到最高種姓的羞辱，他們寧願繼續受困也不願搭低等種姓的船。即使該國法律中已明文廢除種姓制度，可是新聞中的這種現象仍然隨處可見。」請問：澤澤所找到的最可能是哪個地區的報導資料？
  options:
  - label: A
    content: 印度
  - label: B
    content: 土耳其
  - label: C
    content: 伊朗
  - label: D
    content: 埃及。
