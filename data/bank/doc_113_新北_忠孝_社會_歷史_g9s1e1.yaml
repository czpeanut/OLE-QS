    content: 書寫著需要被流放之人名字的陶片
  - label: B
    content: 以象形文字刻著名字的木乃伊棺木
  - label: C
    content: 宣揚眾生皆可修行超脫輪迴的壁畫
  - label: D
    content: 使用拉丁文所寫的眾神神話與書籍。
