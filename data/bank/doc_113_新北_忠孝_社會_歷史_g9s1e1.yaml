- id: doc_113_新北_忠孝_社會_歷史_g9s1e1_s1_35
  section: 1
  number: 35
  type: single
  page: 1
  stem: 有歷史學家曾說：「光來自東方，法律來自西方」；也有法學家認為：「羅馬曾三次征服世界，第一次是以武力，第二次是以宗教，第三次是以法律。而第三次征服也許是其中最為和平、最為持久的征服。」這兩段話可以肯定羅馬在法律上的成就請問：關於羅馬法律的成就，下列敘述何者正確？
  options:
  - label: A
    content: 羅馬的法律是世界歷史上第一部成文的法律制度，為全世界的法律之母
  - label: B
    content: 透過平民爭取所制定的法律，其無罪推定論的概念保護當時人民的權利
  - label: C
    content: 羅馬的法律中所帶有因果輪迴的概念，深深影響到被羅馬所征服的地區
  - label: D
    content: 以貴族為主要實施對象的法律制度，主張以牙還牙以眼還眼的報復原則。
