  number: 22
  type: single
  page: 1
  stem: 臺灣從舊石器時代發展至新石器時代，花了數萬年的時間；但進入金屬器時代僅花了數千年，顯示人類的進步速度有增快的趨勢。這應該與新石器時代哪項文明的發展較有關係？
  options:
  - label: A
    content: 人類掌握農業技術得以自主生產食物
  - label: B
    content: 人類創造出語言得以有效溝通
  - label: C
    content: 人類懂得使用火焰自保以增加存活率
  - label: D
    content: 人類發展出金屬技術增加效率。
