- id: doc_113_高雄_獅甲_社會_歷史_g7s1e2_s1_33
  section: 1
  number: 33
  type: single
  page: 2
  stem: 地名的由來通常與當地歷史發展有關。臺南到高雄一帶，有不少地名都有軍隊相關，例如：臺南市新營、左鎮；高雄市左營、前鎮等等，這應該是因為下列何段歷史的緣故？
  options:
  - label: A
    content: 荷蘭人招募漢人來臺開墾
