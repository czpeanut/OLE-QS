    content: 俄羅斯降水較集中冬季。
  group_stem: "(9).請閱讀下方文章回答問題：\n  瑞典國王查理十二世於1708 年11 月入侵俄國，因無法長期對抗惡劣的自然條件，軍隊由原來的4.1\
    \ 萬人變成1.7 萬人。\n  經過一百多年後，1812 年春季，法國的拿破崙帶領 60 萬軍隊，預計要在5 個星期內攻下俄羅斯。直至8月，拿破崙雖順利進入莫斯科，但俄國人棄城而走，並破壞任何可能對法國軍隊有用的東西。在法國軍隊無法取得作戰時必需的糧草、禦寒衣物下，10\
    \ 月拿破崙命令大軍撤出莫斯科。11 月俄羅斯降下初雪，馬匹倒地而死、大炮陷入雪中、士兵們染病凍死，最後剩不到10萬士兵返回法國。"
