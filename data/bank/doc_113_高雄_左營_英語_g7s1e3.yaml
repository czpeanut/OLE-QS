  section: 4
  number: 42
  type: single
  page: 5
  stem: 42. What is the main idea of this reading?
  options:
  - label: A
    content: Butterflies and moths look the same.
  - label: B
    content: There are butterflies and moths everywhere.
  - label: C
    content: Butterflies and moths are both similar and different.
  - label: D
    content: Everyone likes butterflies.
  group_stem: 'Butterflies and Moths

    We often see butterflies and moths. They look the same, but in some ways they
    are different. Butterflies and moths are similar. They both have two wings and
    three legs on each side. They also have long tongues to drink flower nectar.

    Butterflies and moths are different, too. Moths fly around at night. Butterflies
    fly around in the daytime. Moths have fur. Butterflies are bigger than moths.
    They have thin bodies and colorful wings. They don''t have fur. But moths are
    fat and furry. Their wings are usually brown or gray. Let''s go outside and look
    for butterflies and moths!


    📖 moth 蛾 similar 相似 wing 翅膀 each 每一 tongues 舌頭 nectar 花蜜 fur 皮 furry 毛茸茸'
