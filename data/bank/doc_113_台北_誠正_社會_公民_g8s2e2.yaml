  section: 1
  number: 1
  type: single
  page: 1
  stem: 為維持社會秩序，不同種類法律會約束不同行為，關於犯罪及違法的敘述何者正確?
  options:
  - label: A
    content: 《刑法》規定關於犯罪的定義與懲罰，和賠償事宜。
  - label: B
    content: 未成年抽菸是犯罪行為，需受到《刑法》約束。
  - label: C
    content: 犯罪行為是違法行為，違法行為不一定是犯罪行為。
  - label: D
    content: 《刑法》僅規範涉及影響國家、社會嚴重的行為，個人權益遭受損害需透過《民法》。
