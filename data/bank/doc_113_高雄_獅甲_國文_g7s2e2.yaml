- id: doc_113_高雄_獅甲_國文_g7s2e2_s5_34
  section: 5
  number: 34
  type: single
  page: 5
  stem: 根據詩意，下列何者說明正確？
  options:
  - label: A
    content: 吃食中不能沒有肉
  - label: B
    content: 居處旁可以沒有竹子
  - label: C
    content: 沒有肉食人會身形苗條
  - label: D
    content: 沒有竹子會讓人俗氣難當。
  group_stem: "（三）\n可使食無肉，不可居無竹。\n  無肉令人瘦，無竹令人俗。\n  人瘦尚可肥，俗士不可醫。\n  旁人笑此言，似高還似痴。\n\
    \  若對此君仍大嚼，世間哪有揚州鶴？\n（蘇軾 於潛僧綠筠軒）\n註：①此君：即是竹子。\n  ②揚州鶴：曾有客各言其志，一人想作揚州刺史，一人想增多財富，一人則想騎鶴上天。另一人說他要腰纏十萬貫，騎鶴上揚州，想兼三人所欲。後比喻欲望很多的人或如意順心的事。\n\
    \  ③於潛：縣名，在浙江省，縣南有寂照寺，寺中有綠筠軒。"
