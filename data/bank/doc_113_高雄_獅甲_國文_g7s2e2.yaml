- id: doc_113_高雄_獅甲_國文_g7s2e2_s5_32
  section: 5
  number: 32
  type: single
  page: 5
  stem: 以下何者與本詩主要表達的情感最接近？
  options:
  - label: A
    content: 清明時節雨紛紛，路上行人欲斷魂。借問酒家何處有，牧童遙指杏花村。（杜牧）
  - label: B
    content: 獨在異鄉為異客，每逢佳節倍思親。遙知兄弟登高處，遍插茱萸少一人。（王維）
  - label: C
    content: 月落烏啼霜滿天，江楓漁火對愁眠。姑蘇城外寒山寺，夜半鐘聲到客船。（張繼）
  - label: D
    content: 故人西辭黃鶴樓，煙花三月下揚州。孤帆遠影碧山盡，唯見長江天際流。（李白）
  group_stem: '（二）


    渭城朝雨浥輕塵，客舍青青柳色新。勸君更盡一杯酒，西出陽關無故人。（王維 送元二使安西）

    【注釋】1.渭城：今咸陽東北。2.浥：沾濕。3.陽關：位於敦煌西南的關隘，為出塞必經的地方。'
