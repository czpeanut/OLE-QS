- id: doc_113_高雄_獅甲_國文_g7s2e2_s4_1
  section: 4
  number: 1
  type: single
  page: 1
  stem: 「讓自己去站到一棵竹子的身邊，然後，昂起頭來向上望，看看它是以一種什麼樣子的姿勢挺拔起來的，希望能從它的身上學一點點如何才能挺拔的祕訣，如何才能昂然而立的本領。」作者的行為最接近下列何者的意涵？
  options:
  - label: A
    content: 麻雀雖小，五臟俱全
  - label: B
    content: 貧居鬧市無人問，富在深山有遠親
  - label: C
    content: 兵來將擋，水來土掩
  - label: D
    content: 萬物靜觀皆自得，處處留心皆學問。
  tags:
    chapter:
      publisher: 南一
      book: 七下
      subject: 國文
      code: 第四課
      title: 溪頭的竹子
      chapter: null
    textbook: 七下 第四課 溪頭的竹子
    labeled_by: ai
- id: doc_113_高雄_獅甲_國文_g7s2e2_s4_2
  section: 4
  number: 2
  type: single
  page: 1
  stem: 「這裡的竹子，是以占領者的姿態去盤踞著一些山頭。它們不僅是為這片山野織起了一片青翠，重要的是，它們在這裡創造了一種罕見的姿態。記得當我第一眼觸及到這裡的竹林時，我曾經為之愕然良久，難道竹子們是在這裡進行一項拔高的比賽？」根據上文推論，作者所說的「罕見的姿態」指的是下列何者？
  options:
  - label: A
    content: 滿山滿野的覆蓋
  - label: B
    content: 綠意盎然的壯觀
  - label: C
    content: 爭高直指的聳立
  - label: D
    content: 屹立不拔的雄姿。
  tags:
    chapter:
      publisher: 南一
      book: 七下
      subject: 國文
      code: 第四課
      title: 溪頭的竹子
      chapter: null
    textbook: 七下 第四課 溪頭的竹子
    labeled_by: ai
