- id: doc_113_高雄_獅甲_國文_g7s2e2_s5_30
  section: 5
  number: 30
  type: single
  page: 4
  stem: 根據本文第二段，從水與油可以觀察到什麼道理？
  options:
  - label: A
    content: 君子重義，小人重利
  - label: B
    content: 君子寬厚，小人善於妒忌
  - label: C
    content: 君子要求別人，小人要求自己
  - label: D
    content: 君子之交淡如水，小人之交甜如蜜。
  group_stem: "（一）\n\n生活裡的點點滴滴，縈繞著無限的哲思，衣食住行，日常的細節，都可以觸發靈機，就看你是否善於觀察，善於譬解。\n有人從炒菜的油鍋裡，領悟出「君子與小人」的道理，油的滑膩濃稠是小人，水的清白恬淡是君子。水可以使不潔的歸於潔，油則使潔的變成不潔。在君子群裡投進一個小人，就像滾水中滴進一滴油，水可以默默容納油，但水歸水，油歸油，仍是和而不同的；若是小人堆裡投進一個君子，就像滾油中滴進一滴水，油會激搏爆濺，絕不相容，不炸到兩敗俱傷，是不肯罷休的！所以從水與油裡，可以覺察君子小人相處的情狀。\n\
    有人從劈柴之中，領悟出讀書做事的要訣，讀書不能盡選些軟熟輕鬆的東西來讀，做事也不能畏避困難棘手的問題去做，讀書要「攻堅」，做事要克服難關，才有成就感，就像劈柴時，不遇到盤根錯節的結節硬塊，就分辨不出哪把斧頭是真正可信的利器！\n\
    人人心頭都有這一點靈犀，只要能觸事生悟，就可妙應無窮。\n                                                \
    \      (節錄自黃永武<生活的哲思>)"
