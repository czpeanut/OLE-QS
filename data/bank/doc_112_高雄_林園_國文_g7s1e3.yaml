  stem: '閱讀比較以下二者，請問哪一段文字屬於「科普文章」？科普文章的語言有何特色？

    | 臺灣欒樹 | （甲）「臺灣欒樹」是臺灣特有樹種，據說最早是由英國人 A.Henry 在恆春採集到，因此，臺灣欒樹的中文名又叫作「亨利氏欒樹」。樹幹通直，灰黑色；二回羽狀複葉；花小形，多數，黃色；果實為蒴果，由像燈籠狀粉紅色的三瓣片合成，黑褐色。分布於全島低海拔的闊葉林中，從北到南都有。<br>（乙）漫步園區，突然一陣微涼的風拂面而來，讓人忍不住舒服的閉眼享受這久違的清爽……睜眼抬
    頭一看，鮮黃色的小花序在濃綠的樹葉與蔚藍的天空襯托下，如日光裡的煙火般華麗綻放，落了一片金雨點綴著枝頭，而另一棵樹上還掛滿了紅磚色的蒴果，讓樹枝低垂的謙虛彎腰下來，眼前這一幅美景隨風輕盪搖擺，並透過充滿活力的元氣色彩繽紛展現，「臺灣欒樹」帶著我們告別炙熱的暑氣，秋天真的到了。
    |'
  options:
  - label: A
    content: （甲）是科普文／平實，準確、簡明易懂的解說，闡明科學知識給普羅大眾
  - label: B
    content: （甲）是科普文／用想像、抒情、移情等技巧為文，以增加文章豐富色彩的意象
  - label: C
    content: （乙）是科普文／平實，準確、簡明易懂的解說，闡明科學知識給普羅大眾
  - label: D
    content: （乙）是科普文／用想像、抒情、移情等技巧為文，以增加文章豐富色彩的意象。
