  stem: 關於泡茶的注意事項，下列哪一個是正確的？
  options:
  - label: A
    content: 第一泡的茶湯通常不飲用，避免雜質過多影響茶湯品質
  - label: B
    content: 茶葉沖泡的次數愈久，茶味愈濃，風味愈佳
  - label: C
    content: 比重愈重的茶，沖泡時所需的茶葉分量就愈多，沖泡一壺茶約需放入八、九分滿的茶葉
  - label: D
    content: 沖泡輕發酵茶的水溫約攝氏九十度，沖泡重發酵茶的水溫約攝氏一百度。
  group_stem: "走進茶行，林林總總的茶葉名稱，常讓許多人大惑不解 ，其實茶的分類主要有兩大原則：一是茶樹的品種，二是不同的製茶方式。\n\n品種\n\
    \    常見的茶樹品種有：軟枝烏龍 、金萱 、翠玉 、鐵觀音、武夷茶等；同一品種採用不同的製作方式，就是不一樣風味的茶，如金萱可製成烏龍茶，也能製成包種茶；但每一品種也都有最能表現其特色的製茶法，如翠玉就適合做成半發酵茶\
    \ 。至於最近流行的「高山茶」，則是指種植於海拔一千二百公尺以上地區的茶，並不專指特定品種。\n\n製茶方式\n    製茶過程中發酵程度的高低、揉捻出的不同外形，都可使茶葉有不同的風味表現；我們常聽的凍頂茶、包種茶、冷凍茶、白毫烏龍等，就是以不同方法製出的茶葉名稱。以發酵度來說，不發酵者，湯色青綠，如：龍井等，一般稱為「綠茶」；輕度發酵、中度發酵至重度發酵茶，湯色則由蜜綠轉金黃至深黃；至於全發酵茶，如：紅茶，湯色則偏紅褐。臺灣幾個重要茶產區，因為茶樹品種、製茶技術上的差異，多年來各自發展出具代表性的地方名茶，如坪林的文山包種茶、鹿谷的凍頂烏龍茶、木柵的鐵觀音、鶴岡的紅茶等。\n\
    \n泡一壺好茶\n    「工欲善其事，必先利其器 」，要泡出一壺好茶，首先必須備妥基本泡茶用具，並把握住幾項原則，多加嘗試累積心得，相信也能慢慢感受茶的甘醇滋味。\n\
    \n泡茶小秘訣：\n1.水溫：沖茶以熱水為主，但不是愈燙愈好，須視茶葉種類而定。原則上，輕發酵茶以九十度左右為宜；重發酵茶則約為一百度。\n2.溫壺：講究茶道正是泡茶前，會先以溫水沖洗茶壺、茶杯等茶具，具有清潔及溫潤的效果。另外，第一泡的茶湯通常並不飲用，浸泡的時間也很短，只稍讓茶葉濕潤、溫熱後即倒出，如此，可讓茶葉在沖泡過程中，較容易舒展開來，也使茶湯風味更佳。\n\
    3.茶葉的份量：茶葉的份量影響茶湯濃度，可視個人喜好而定。但通常比重愈輕的茶，所需份量就愈多，如包種茶的比重只有烏龍茶的三分之一，泡一壺茶約須放入七分滿的茶葉。\n\
    4.浸泡時間：沖泡次數愈多，茶湯濃度會漸淡，因此須調整沖泡時間；如前三泡為二十至三十秒，之後每泡可再略增三至五秒。沖泡時間雖因茶種、個人喜好而異，但一般茶葉均不宜久泡，以免茶味苦澀。\n\
    \                                                                            \
    \     〈茶葉的分類〉上旗文化編輯部"
