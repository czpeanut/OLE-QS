  section: 1
  number: 23
  type: single
  page: 1
  stem: 近來香港情勢備受國際關注，而「一國兩制」這個詞彙亦再度躍上新聞版面，引起討論。此政策最早出現於中華人民共和國與美國建交後對臺灣提出的策略。而在面對中華人民共和國的「一國兩制」與「和平統一」等政策，臺灣亦以一些政策回應。下列哪個不是當時政府所採取的對策？
