- id: doc_113_高雄_鼎金_社會_歷史_g7s2e3_s1_26
  section: 1
  number: 26
  type: single
  page: 1
  stem: 西元1988 年李登輝繼任總統後，開始進入「務實外交」的階段，以經貿實力打破中華人民共和國的外交封鎖，致力發展與無邦交國家之間的實質關係。此外，亦提升與友邦間的雙邊關係，增加政府重要首長互訪，且策動邦交國每年提出「參與聯合國」提案。請問：「務實外交」與之前外交政策最大的不同點為何？
  options:
  - label: A
    content: 積極鞏固與友邦的關係
  - label: B
    content: 不再堅持中華民國是唯一代表中國的合法政府
  - label: C
    content: 外交對象不限於邦交國家
  - label: D
    content: 大量投入技術、醫療與金錢。
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 歷史
      code: 5-1
      title: 臺灣的對外關係
