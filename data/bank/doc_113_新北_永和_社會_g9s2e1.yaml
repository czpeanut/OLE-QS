- id: doc_113_新北_永和_社會_g9s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 新竹縣芎林鄉地名由來始於清乾隆末年，漢人初至此地開墾，其後因見周遭九芎樹蒼蔚成林，故更名為「九芎林」。日治初期，聚落所在之行政區劃編為「九芎林庄」。大正九年，地方人士認為「九芎」與「久窮」諧音，遂去「九」字而改名為「芎林」大字。民國34
    年國民政府接管臺灣後，再改制為「芎林鄉」。請問芎林鄉的命名由來與下列何者相同？(L1+L2)
  options:
  - label: A
    content: 「桃園」因當年移民入墾後桃樹遍布而名為「桃仔園」
  - label: B
    content: 「基隆」源自於平埔族原住民凱達格蘭族的「雞籠社」
  - label: C
    content: 「高雄」舊名打狗，日治時期被改為日語發音的高雄
  - label: D
    content: 「嘉義」諸羅縣民平定林爽文事件，賜名「嘉其忠義」
- id: doc_113_新北_永和_社會_g9s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
