  number: 2
  type: single
  page: 1
  stem: 附圖為1999～2011 年臺灣稻米進出口圖。由圖一中顯示，自2002 年後稻米的進口超越出口，其主要原因與下列何者關係最密切？(L3)
  options:
  - label: A
    content: 國人的主食為稻米，須大量仰賴進口
  - label: B
    content: 稻田被改建成工廠，造成出口量下降
  - label: C
    content: 灌溉設施嚴重不足，造成可耕地減少
  - label: D
    content: 加入 WTO 後，更面臨進口農產品競爭。
