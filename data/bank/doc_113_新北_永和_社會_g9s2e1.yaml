- id: doc_113_新北_永和_社會_g9s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 臺北市七星農田水利會之灌區涵蓋區，包括石牌、北投、關渡平原、南港、內湖、汐止、士林、陽明山等灌區，目前臺北市雖已發展成為政治、經濟及商業之大型都會區，然而臺北盆地邊緣地區有許多山坡地、農地仍從事農業生產。是以結合坡地農業特性、配合都市市民需求，發展出適合都市型態之特殊農業，包含都市茶園、市民農園、觀光果園、花卉專業區及高冷蔬菜區，不僅具有休閒、綠化、觀光之功能，同時具有高經濟價值。由此可知臺北市的農業朝著哪一個方向發展？(L3)
  options:
  - label: A
    content: 因應國人需求，發展有機農業
  - label: B
    content: 因應外銷所需，實施低價策略
  - label: C
    content: 大量種植，發展商業性農業
  - label: D
    content: 結合觀光功能，發展精緻農業
- id: doc_113_新北_永和_社會_g9s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 承上題，上文所提及的灌溉範圍，包含部分的大台北地區，以下對各行政區的地名由來敘述，何者最為正確？(L2)
  options:
  - label: A
    content: 內「湖」：湖泊或盆地所在之地
  - label: B
    content: 北投：源自於排灣族「北投社」
  - label: C
    content: 「石」牌：當地發展石油產業
  - label: D
    content: 汐止：來自潮州移民的原鄉地名
  group_stem: （第 7 題）臺北市七星農田水利會之灌區涵蓋區，包括石牌、北投、關渡平原、南港、內湖、汐止、士林、陽明山等灌區，目前臺北市雖已發展成為政治、經濟及商業之大型都會區，然而臺北盆地邊緣地區有許多山坡地、農地仍從事農業生產。是以結合坡地農業特性、配合都市市民需求，發展出適合都市型態之特殊農業，包含都市茶園、市民農園、觀光果園、花卉專業區及高冷蔬菜區，不僅具有休閒、綠化、觀光之功能，同時具有高經濟價值。由此可知臺北市的農業朝著哪一個方向發展？(L3)
- id: doc_113_新北_永和_社會_g9s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 高雄市政府農業局致力推廣在地食材近期與全台最大有機農夫市集「微風市集」合作，針對不同季節及消費族群推廣永續食材理念，推出「在地食材食驗室」系列活動。該活動透過當季農產品的互動體驗及烹飪示範，讓民眾深入認識友善農業的價值，並學習支持永續食材的具體方法。上文的活動，主要目的為何？(L3)
  options:
  - label: A
    content: 政府要求農民完成「產銷履歷驗證」
  - label: B
    content: 降低基因改造作物的出現
  - label: C
    content: 響應「產地到餐桌」的飲食觀念
  - label: D
    content: 透過原產地加工使產品更符合市場需求。
- id: doc_113_新北_永和_社會_g9s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 臺灣地形多元複雜，提供地方豐富的命名素材。小白使用Google Map 查看某個縣市的沿海地區，隨手寫下幾個有趣的地名:烏岩角、東澳灣、南方澳、烏石鼻等等，請問小白最有可能查看哪個行政區的地名呢？(L1+L2)
  options:
  - label: A
    content: 南投縣
  - label: B
    content: 臺中市
  - label: C
    content: 臺南市
  - label: D
    content: 宜蘭縣。
