  stem: '隨著金融科技發展，除了現金、信用卡、儲值卡外，以網路或電子支付平台等為中介的支付服務也推陳出新。立

    法院預算中心發現，由於電子化支付普及率提升，減少現金使用，進而影響硬幣鑄造的需求。【甲機關】鑄造的

    硬幣已自2015 年的年產7.2 億枚，逐年下滑至今年的4.6 億枚。根據題文敘述，下列何者正確？'
  options:
  - label: A
    content: 信用卡與儲值卡皆屬於塑膠貨幣，具備完整貨幣功能
  - label: B
    content: 甲機關發行的硬幣屬於商品貨幣
  - label: C
    content: 一般民眾若出國須兌換外幣可至甲機關換匯
  - label: D
    content: 綁定信用卡的電子支付，消費款項由發卡銀行先代墊。(B5Ch5)
