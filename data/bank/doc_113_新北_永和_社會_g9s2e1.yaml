- id: doc_113_新北_永和_社會_g9s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '附表為臺灣聚落地名的由來，根據表中內容判斷，若按照命名時間做先後順序排列，下列何者正確？(L1+L2)


    | 時間 | 命名依據 | 舉例 |

    | :--- | :--- | :--- |

    | 甲 | 軍事屯墾 | 左營、左鎮 |

    | 乙 | 外來語言 | 高雄、玉井 |

    | 丙 | 意識型態 | 信義、復興 |

    | 丁 | 皇帝賜名 | 嘉義、彰化 |'
  options:
  - label: A
    content: 甲乙丙丁
  - label: B
    content: 甲丁乙丙
  - label: C
    content: 丁甲乙丙
  - label: D
    content: 丁丙乙甲。
- id: doc_113_新北_永和_社會_g9s2e1_s1_2
