    芋頭從成形到不成形的，樣態很多。芋頭如果擬人，大概是老好人，總是幫襯別人。它和音時多，個唱時少。完整到爛糊，化成什麼形都好吃。原形芋頭，切塊炸酥，在火鍋裡或佛跳牆裡燉出絨。我吃佛跳牆，專挑湯裡墊底的栗子、筍絲和芋頭吃，這些才吸收了所有鮮湯。

