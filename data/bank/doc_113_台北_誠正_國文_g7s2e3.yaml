- id: doc_113_台北_誠正_國文_g7s2e3_s1_34
  section: 1
  number: 34
  type: single
  page: 3
  stem: '關於名與字的關係和例子，下列表格內容，何者正確？

    | 選項 | 關係 | 姓名 | 字 |

    | :--- | :--- | :--- | :--- |

    | (Ａ) | 原名變化 | 李白 | 太白 |

    | (Ｂ) | 同義互訓 | 蘇軾 | 子瞻 |

    | (Ｃ) | 相關聯想 | 韓愈 | 退之 |

    | (Ｄ) | 反義相對 | 曾鞏 | 子固 |'
  options:
  - label: A
    content: 原名變化 李白 太白
  - label: B
    content: 同義互訓 蘇軾 子瞻
  - label: C
    content: 相關聯想 韓愈 退之
  - label: D
    content: 反義相對 曾鞏 子固
  group_stem: '現代的人介紹自己，通常是會講自己的名字。但是在古代，「名」、「字」，可是有很明顯的分際。

    「字」通常由「名」衍生而來，一般說來，名和字的關係最常見的有以下四種︰

    一、同義互訓。這是說名與字的意義相同，或者可以互相解釋。如，諸葛亮字孔明，這個「亮」與「明」，當然是同義的。

    二、反義相對。這是說名與字的意義相反。像朱熹字「元晦」，都是要人在進退、光晦之間，時時謹記其中的利弊，拿捏分際。

    三、相關聯想。有些「名」、「字」並不一定相同或相反，而是有因果關係或連屬的關係。像是白居易字「樂天」，是取「樂天」才能「居易」的意思。

    四、原名變化。這是單純把原有的名作一些簡單的變化，而這種變化是不規則的。如杜牧，字牧之。多半是加一個虛字或變易字型，就成為「字」了。

    （節錄自傳統中國文學電子報）'
