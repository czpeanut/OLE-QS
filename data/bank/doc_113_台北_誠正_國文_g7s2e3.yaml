  group_stem: '丙.

    想加油嗎？你會加油嗎？你知道怎麼揩油嗎？

    我家加油站告訴你：

    平時在市區開短程時，沒有必要將油箱加滿，以免增加車輛的負荷，造成耗油。

    但是若在油箱快見底時才加油，則會造成油箱底部所累積的雜質，容易被抽入燃油系統，造成供油不順暢的現象。

    而且油箱太空時，容易存有空氣，在日夜溫差大時會形成水氣，混雜在油中。

    所以建議您在油箱剩下四分之一時，就應該加油，並加約七或八分滿就成了。

    (加油進行曲)'
