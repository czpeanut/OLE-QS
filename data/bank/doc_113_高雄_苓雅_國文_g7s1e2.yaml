- id: doc_113_高雄_苓雅_國文_g7s1e2_s4_29
  section: 4
  number: 29
  type: single
  page: 5
  stem: 由這則新聞內容判斷，下列敘述何者正確？
  options:
  - label: A
    content: 烤肉風氣興起，主要是「一家烤肉萬家香」的烤肉醬廣告詞帶動流行
  - label: B
    content: 「露營者無不烤肉」，中秋節烤肉的由來跟露營有關，是賞月的餘興
  - label: C
    content: 新竹有多家製作烤爐、烤肉器具的工廠，採薄利多銷的方式賣到國外
  - label: D
    content: 1982 年有報導羅列 20 項賞月活動供民眾參考，其中 3 項提到了烤肉
  group_stem: "中秋烤肉由來並非烤肉醬廣告？ PTT 神人調查揭原因                2023/09/29 15:11《自由時報》 \n\
    \    中秋節原本是吃柚子與月餅的節日，但台灣家家戶戶卻以揪團烤肉的方式歡度佳節。中秋烤肉習俗許多人認為是知名烤肉醬廣告引起的風潮，不過卻有鄉民抱著存疑態度，翻閱過去報導後認為其實是「露營活動的興起」的關係，以及新竹烤肉風氣成為中秋節烤肉的濫觴。\
    \  \n    每到中秋節，中秋節為何變成「烤肉節」的相關討論就會在網路上被重新提起。一般流行的回答是知名烤肉醬廣告引起中秋烤肉的風潮，不過有網友挖出 PTT\
    \ 精華區一篇經典考古文，以及過往的報導內容探究烤肉習俗的由來。  \n    該篇精華區貼文作者以論文形式探究中秋烤肉習俗由來。他寫道，起初烤肉應是賞月的餘興，且僅限在露營地區或風景區，1978\
    \ 年就有報導羅列 20 項賞月活動供民眾參考，其中 3 項與露營有關的活動都提到烤肉。由此可知，最初的中秋節烤肉應該與露營有關，「露營者無不烤肉」，而烤肉風氣應是從此時開始。\
    \  \n    作者接著寫道，到 1982 年，有多家製作烤爐、烤肉器具的新竹工廠，因為外銷不景氣，改以大降價，薄利多銷的方式轉為內銷。當時有報導提到，當年中秋節時，新竹賞月、烤肉盛行，風景區到處烈火熊熊，不外出的人也在家門口或陽台架起烤爐。作者表示，至此已知中秋烤肉的風氣是從\
    \ 1982 年開始。"
