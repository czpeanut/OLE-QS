  section: 4
  number: 32
  type: single
  page: 7
  stem: 有關接種帶狀疱疹的注意事項何者正確?
  options:
  - label: A
    content: 女性只要不在懷孕期間接種疫苗都是安全的
  - label: B
    content: 接種後可能全身有發紅、疼痛或腫脹等
  - label: C
    content: 只要有過敏症狀或患有嚴重免疫缺失者不宜接種疫苗
  - label: D
    content: 發燒時活性減毒疫苗、非活性基因重組蛋白帶狀疱疹疫苗二種疫苗都不可接種。
  group_stem: "帶狀疱疹(皮蛇)疫苗 \n◎疾病簡介  \n1. 帶狀疱疹是水痘-帶狀疱疹病毒（varicella-zoster virus）再活化的表現，此種病毒初次感染時會引發水痘，之後此病毒會潛伏在背根神經節或腦感覺神經節中，直到再度活化引發帶狀疱疹。\
    \ \n2. 帶狀疱疹一般特徵為沿著皮節分布的單側性、疼痛性、水泡性皮疹。急性期皮疹及疼痛持續時間約數周，部分病患會併發帶狀疱疹後神經痛，此併發症疼痛可能持續數月甚至超過一年的時間。其他併發症包含眼部帶狀疱疹，嚴重可能導致失明。曾經得過帶狀疱疹者，痊癒後可能會再復發。\
    \ \n3. 危險因子：帶狀疱疹好發於50 歲以上成人、具帶狀疱疹病史者、及免疫功能低下族群，包含人類免疫缺乏病毒感染、癌症、糖尿病、慢性腎臟病、氣喘、慢性阻塞性肺病、類風溼性關節炎、使用免疫抑制劑患者等。\
    \ \n◎認識疫苗 \n接種可提高水痘-帶狀疱疹病毒特異性免疫力，預防帶狀疱疹及其併發症。目前國內核准上市的帶狀疱疹疫苗，包括活性減毒帶狀疱疹疫苗及非活性基因重組帶狀疱疹疫苗。\
    \ \n◎自費接種建議 \n如具接種需求，建議可至醫院或診所洽詢，經醫師評估後自費接種： \n1. 活性減毒帶狀疱疹疫苗：50 歲(含)以上成人，不論之前是否有水痘或帶狀疱疹病史，建議接種1\
    \ 劑活性減毒帶狀疱疹疫苗，以預防帶狀疱疹及相關併發症。 \n2. 非活性基因重組帶狀疱疹疫苗：50 歲以上成人、18 歲以上免疫不全或免疫功能低下者，不論之前是否有水痘或帶狀疱疹病史，建議接種2\
    \ 劑非活性基因重組蛋白帶狀疱疹疫苗，2 劑間隔2-6 個月，以預防帶狀疱疹及相關併發症。 \n◎接種禁忌 \n活性減毒帶狀疱疹疫苗 \n1. 先前接種本疫苗或對本疫苗任何成分曾發生嚴重過敏反應者。\
    \ \n2. 已知患有嚴重免疫缺失者（包括嚴重免疫不全的愛滋病毒陽性個案、先天性免疫缺失症與白血病、淋巴癌等惡性腫瘤病人或接受化療、免疫抑制藥物治療及高劑量類固醇者）。\
    \ \n3. 孕婦。 \n非活性基因重組帶狀疱疹疫苗：先前接種本疫苗或對本疫苗的任何成份曾發生嚴重過敏者。 \n◎注意事項 \n活性減毒疫苗 \n1. 發燒或正患有急性中重度疾病者，宜待病情穩定後再接種。\
    \ \n2. 接種前24 小時內曾接受特定抗病毒藥物者，於接種後間隔14 天以後再重新開始服用這些藥物。 \n3. 女性接種後4 週內應避免懷孕。 \n4.\
    \ 與其他活性減毒疫苗(例如MMR、活性減毒日本腦炎疫苗)如未同時接種，應間隔至少28 天以上。 \n非活性基因重組蛋白帶狀疱疹疫苗 \n1. 發燒或正患有急性中重度疾病者，宜待病情穩定後再接種。\
    \ \n2. 懷孕婦女應避免接種 \n◎接種後可能發生的反應 \n1. 接種部位可能有發紅、疼痛或腫脹等局部反應。 \n2. 可能有頭痛、四肢疼痛、發燒、疲倦等全身性反應。\
    \ \n                                                            本文出自衛生福利部疾病管制署"
