    \ \n2. 懷孕婦女應避免接種 \n◎接種後可能發生的反應 \n1. 接種部位可能有發紅、疼痛或腫脹等局部反應。 \n2. 可能有頭痛、四肢疼痛、發燒、疲倦等全身性反應。\
