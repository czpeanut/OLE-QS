  group_stem: "如果經常逛布店的話，便會發現很少有一匹布沒有人選購過。換句話說，任何質地或花色的衣料，都有人欣賞它。一位鞋店的老闊曾指著橱窗裡一雙式樣毫不漂亮的鞋子說:「無論怎麽難看的樣子，還是有人喜歡，所以不怕賣不出去。」\
    \ \n    就以「人」來說，又何嘗不是如此?也許我們看某人不順眼，但是在他的男友和女友心中，往往認為他如「天仙」或「白馬王子」般地完美無缺。 \n  人總會去尋求自己喜歡的事物，每個人的看法或觀點不同，並沒有什麼關係，重要的是──人與人之間，應該有彼此容忍和尊重對方的看法與觀點的雅量。\
    \ \n  如果他能從這扇門望見日出的美景，你又何必要求他走向那扇窗去聆聽鳥鳴呢?你聽你的烏鳴，他看他的日出，彼此都會有等量的美的感受。人與人偶有摩擦，往往都是由於缺乏那分雅量的緣故。因此，為了減少摩擦，增進和諧，我們必須努力培養雅量。"
