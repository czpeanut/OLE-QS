  group_stem: 'Is it difficult for you to fall asleep at night? Do you have trouble
    waking up for school or work in the morning? Or you often feel tired all day and
    need coffee or tea to get through a day. Then you might have sleep problems. Sleep
    is good for our health. Studies show that a good night''s sleep can also help
    us learn better or work efficiently. So do something to help you sleep well.

    Have a warm bath or shower before going to bed. It can help you relax and fall
    asleep more easily.

    Having some healthy food like milk, fish, eggs, nuts, bananas, berries, or kiwis
    is helpful. Kiwi is rich in Vitamin C. A study shows that eating two kiwis one
    hour before bedtime every night can help people fall asleep faster and stay asleep
    longer.

    Try to wake up at the same time and take some exercise at least three times a
    week. Don''t have coffee or tea late during the day. Stop playing on your smartphone
    or the computer or watching TV before bed. They all can help us sleep better.
    Now give it a try and have a nice sleep!'
