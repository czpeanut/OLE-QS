  - label: B
    content: 貧富差距
  - label: C
    content: 人性尊嚴
  - label: D
    content: 發展潛能。
  group_stem: '決定是否要結婚、何時跟誰結婚是每個人的權利。然而在全球，每天有將近 4 萬名女孩被迫步入「童婚」。

    在一些發展中國家，許多家長因為習俗、貧窮等因素，會為未成年的孩子安排婚姻，男孩和女孩都受到影響，但受害的女孩比例特別多。

    根據2019 年聯合國兒童基金會（UNICEF）調查，全球各地有超過 7 億起童婚案例，其中有超過 6 億名女性在 17 歲前成婚。童婚不僅剝奪了女孩的童年，更影響她們受教育、自主生活的權利，在她們的身體與心靈都還沒準備好之時，就被迫要為人妻、為人母。'
