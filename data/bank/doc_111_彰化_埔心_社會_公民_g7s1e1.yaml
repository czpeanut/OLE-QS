  section: 1
  number: 12
  type: single
  page: 1
  stem: 移民署統計，自 2007 年 1 月到 2020 年 7 月底，台灣移工有五萬人失聯。部分女性外籍移工擔心懷孕後會遭雇主解約，遣返回國，而選擇逃逸，結果孩子就成了沒有身份、沒有健保、無法安置的『黑戶寶寶』。監察委員呼籲：「每個兒童都有取得姓名以及國籍的權力，不應因其父母的身份而受到歧視或懲罰，政府對外籍移工子女的基本人權維護與改善刻不容緩。」請問：上述內容最能彰顯下列哪一個意涵？
  options:
  - label: A
    content: 維護人性尊嚴，給予移工子女適當協助
  - label: B
    content: 尊重文化差異，對逃逸移工不予干涉
  - label: C
    content: 落實家庭平權，平衡親子間的權利義務
  - label: D
    content: 維持社會秩序，嚴格取締非法逃逸移工。
