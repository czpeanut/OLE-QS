- id: doc_111_彰化_埔心_社會_公民_g7s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: '小喬與先生結婚多年，終於在今年生下女兒，為了照顧小孩打算申請育嬰留職停薪假，有四位朋友給他們意見，

    甲：「規定好像只有母親可以申請」

    乙：「你的小孩必須年滿三歲才能申請」

    丙：「我記得任職滿一年不管父或母都可以申請」

    丁：「父或母任職滿半年，於子女 3 歲前可以申請」

