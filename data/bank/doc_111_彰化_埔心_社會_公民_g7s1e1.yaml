- id: doc_111_彰化_埔心_社會_公民_g7s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 在過去，同性者因為家庭、社會觀點等因素無法坦誠自己的性傾向，但立法院在 108 年 5 月通過了「司法院釋字第 748 號解釋施行法」，該施行法規定：「相同性別的人可以書面為之，有二人以上證人之簽名，並由雙方當事人向戶政機關辦理結婚登記。」這項法律案的通過，讓台灣成為全亞洲第一個同性結婚合法化的國家。請問：根據上文下列敘述何者正確？
  options:
  - label: A
    content: 每個人可以自由的要求他人配合自己的性觀念
  - label: B
    content: 同性婚姻在法規通過前已享有具體的人權保障
  - label: C
    content: 同性者受到不公平對待情況可以逐漸改善
  - label: D
    content: 開放同性婚姻登記後，每個人都必須接受同性婚姻。
  tags:
    chapter:
      publisher: 康軒
      book: 七上
      subject: 公民
