  group_stem: 'Running with a Smile

    Some people run for exercise, and some people jog for health. However, people
    might get hurt from running or jogging. Now, runners don’t worry about it anymore!
    There is a simple way to run with joy. It’s called “slow jogging” or “niko niko
    running.” That is, people jog at a walking speed with a smile.

    “Niko niko” means “  ?  ” in Japanese. With niko niko running, people smile happily
    and jog slowly. They can even talk or sing with someone! One great thing about
    slow jogging is that it is not hard. Anyone, from children to old people, can
    do it in the park, on a quiet street, or inside the house. People can do it anytime
    and anywhere.

    Do you want to try slow jogging? You don’t need to wear special shoes or clothes.
    Just keep your steps short. Also, make sure to keep your back straight and shoulders
    relaxed. This helps you move arms in a natural way. Then, keep your head up and
    look at the road in front of you. Niko niko running is truly great for health.
    Why not make it a habit to run for twenty minutes a day from now on?

    📖 hurt 受傷 speed 速度 keep 保持 relaxed 放鬆的'
