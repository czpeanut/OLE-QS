  section: 3
  number: 26
  type: single
  page: 3
  stem: 下列文句，何者與「那是一把不知天高地厚的悠悠歲月」無法相呼應？
  options:
  - label: A
    content: 愛吹噓，愛冒險，愛做許多惹人生氣的事
  - label: B
    content: 拿細竹棍把小豬打得吱吱叫
  - label: C
    content: 在鴿籠裡放鞭炮，看群鴿亂飛，驚慌無措
  - label: D
    content: 無助的呆坐床上，聽祖父肝腸碎裂的哭聲。
  group_stem: "以前我們穿木屐，走路很響。那是一把不知天高地厚的悠悠歲月，愛把木屐在水泥地上喀喀喀的拖著，人未到，聲先傳，儼然一副「山人來也」的態勢。愛吹噓，愛冒險，愛做許多惹人生氣的事。雖然是鄉野毛孩，時常與貓狗同臥一處，但我們快樂得一塌糊塗。我們拿細竹棍把小豬打得吱吱叫，偷偷把老祖父的煙斗藏起來，把癩蝦蟆放在姑姑的皮包裡，在鴿籠裡放鞭炮，看群鴿亂飛，驚慌無措。\n\
    \  有一年鬧水災，風狂雨暴，狀至激烈。我們把木屐脫了，在床上打枕頭戰。半夜裡祖父進得屋來，不穿蓑衣，不戴笠帽，渾身溼透了，雨水從髮絲間流淌下來。他一語不發，倒在床上，兩隻手拚命在那裡抓、抓、抓！瘦弱的身子猛烈的顫抖起來，先是呻吟，繼之抽泣，終至嚎哭。我們不曾聽過老人那樣無助的哭泣，一時目瞪口呆。後來我們才知道，溫良賢慧的五嬸在那天夜裡病死了，死時才二十四歲。\n\
    \  我清楚的記得，那天夜裡大水沖進了房屋，水位愈來愈高，幾乎與床沿切齊，我們無助的呆坐床上，聽祖父肝腸碎裂的哭聲，兩眼愣愣的望著那幾雙木屐，它們像船一樣，被洪水無聲的漂走。\n\
    \  大水過後我就負笈他鄉，從此再也沒有穿過木屐。如今想起木屐，總有許多說不出的滋味。（洪醒夫 ﹤童年印象﹥）"
