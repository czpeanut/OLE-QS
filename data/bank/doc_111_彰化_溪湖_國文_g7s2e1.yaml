  stem: 林懷民悼念雲門舞集燈光設計師張贊桃：「你的燈光輕聲細語，除非必要，絕不大聲號叫。典雅寫意，呼吸般起落的燈光成為雲門的特色。臺灣舞評少，評舞也不提燈光。國外談雲門不讚美你的舞評極少。他們說你是大師，你一笑置之。等到有人說，你的燈光讓他想起林布蘭，你就如逢知音，開懷咧口笑了。那幾年，你吃林布蘭睡林布蘭，到了美術館，幾乎把鼻子貼到他的畫作上。」根據這段文字，下列關於張贊桃燈光設計的敘述何者正確？（註：林布蘭：巴洛克美術的代表畫家。）
