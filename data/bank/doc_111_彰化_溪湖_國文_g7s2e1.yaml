  group_stem: "一鍋米飯，放到第二天，水氣就會乾一些，放到第三天，味道恐怕就有問題，第四天，我們幾乎可以發現，它已經變壞了，再放下去，眼看就要發霉了。\n\
    \  是什麼原因，使那鍋米飯變餿變壞──是時間。\n  可是，在浙江 紹興，年輕的父母生下女兒，他們就在地窖裡，埋下一罈米做的酒，十七八年以後，女兒長大了，這些酒就成為嫁女兒、婚禮上的佳釀，它有一個美麗、而惹人遐思的名字，叫「女兒紅」。\n\
    \  是什麼使那些平凡的米，變成芬芳甘醇的酒──也是時間。\n  到底，時間是善良的，還是邪惡的魔術師呢？不是，時間只是一種簡單的乘法，它把原來的數值倍增而已。開始變壞的米飯，每一天都不斷變得更腐臭，而開始變醇的美酒，每一分鐘，都在繼續增加它的芬芳。\n\
    \  在人世間，我們也曾經看過天真的少年一旦開始墮落，便不免愈陷愈深，終於變得滿臉風塵，面目可憎。但是相反的，時間卻把溫和的笑痕，體諒的眼神、成熟的風采和智慧的神韻添加在那些追尋善良的人身上。\n\
    \  同樣是煮熟的米，壞飯與美酒的差別在那裡呢？就在那一點點酒麴。\n  同樣的父母所生的，誰墮落如禽獸，而誰又能提昇成完美的人格呢？是內心深處，緊緊環抱不放的，求真求善求美的渴望。\n\
    \  時間將怎樣對待你我呢？這就要看我們自己是以什麼態度來期許我們自己了。             ( 張曉風  ﹤光陰的故事﹥ )"
