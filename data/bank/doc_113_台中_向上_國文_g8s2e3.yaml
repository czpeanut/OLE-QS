- id: doc_113_台中_向上_國文_g8s2e3_s2_38
  section: 2
  number: 38
  type: single
  page: 3
  stem: 依據(甲)(乙)二文關於「斜槓」的敘述，下列何者正確？
  options:
  - label: A
    content: 完全不需受到公司上下班打卡、業績等種種限制，可自由規劃時間
  - label: B
    content: 是賺錢需求大過於對人生理想追求的生活模式
  - label: C
    content: 斜槓的概念與SOHO 族大致雷同，皆有工作時間彈性的特質
  - label: D
    content: 斜槓青年可以透過身分的轉換，學習多元的專業，經營多職人生。
  group_stem: "(二)\n(甲)何謂「斜槓」？\n\n  約從 2016 年開始，陸續開始有人稱自己是「斜槓青年」，而且這樣的身分認同也持續增加，有越來越多人不再滿足於專一職業的工作模式，開始選擇一種能夠利用自身專業和才藝，經營多重身分的多職人生。其實「斜槓」一詞便是英文中的「Slash」，早在\
    \ 2007 年時就由《紐約時報》的專欄作家 Marci Alboher 在專欄以及出版的暢銷書《不能只打一份工：多重壓力下的職場求生術》中提到這個概念。\n\
    \n    這些年輕人曾在自我介紹中使用「斜槓」來區分不同職業，例如「姓名，職業／職業／職業」，所以被稱作「斜槓青年」：人類已經跨入知識和創造力的時代，人才才是生產中最重要的部分，這樣的概念讓「工作」的意義正在改變，也難怪「斜槓」會開始成為年輕人熱衷的生活方式。在臺灣更是表明了「斜槓」的出現並非偶然，而是社會發展的必然現象。基本上「斜槓」的概念有別於傳統的\
    \ SOHO 族等接案工作者，許多斜槓仍有一份正職、為一個企業或組織機構工作，在下班後的時間，繼續發展其他的專業能力。而臺灣的「斜槓」更是打破了框架的限制，呈現更多元的樣貌，沒有年齡、職業與身分的限制。\n\
    \n(乙)「斜槓」在臺灣，可能遇見的關卡\n\n ● 職場文化的不友善\n  礙於整體環境景氣不佳，許多人工作只是為了糊口，無法將精力放在學習有熱情的事物上，更不用說大多數公司仍難以接受「兼職」這件事。此外，低薪、過勞、工作制度的不健全，都讓「斜槓」在尋覓工作機會時沒能獲得良好的保障，被刁難、強加業務的情形時有所聞，使得「斜槓」難以憑藉能力接到案子，還有可能因為價錢談不攏而被冠上「草莓族」的標籤。\n\
    \n ● 社會環境的不理解\n  無論是臺灣的教育或職場，都還是提倡人們應該深耕單一專業、專精於某項領域，才能追求成功之道。因此，有著多重身分的「斜槓青年」可能會被親戚長輩認為是「不務正業」，希望他們能夠找一份穩定正當的工作；也常被出資者認為是「不夠專業」，甚至頻頻干預過程，導致雙方都不滿意，在這樣惡性循環下，「斜槓生活」難以獲得支持的力量。\n\
    \                （節錄自艾力克〈臺灣斜槓世代的多職人生〉"
  tags:
    textbook: 八下 自學課二 面對假訊息，其實我可以這麼做
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 八下
      subject: 國文
      code: 自學課二
      title: 面對假訊息，其實我可以這麼做
      chapter: null
  ai_answers:
    gemini: D
    qwen: D
  answer:
  - D
  answer_status: ai_generated
  answer_source: ai:gemini+qwen
