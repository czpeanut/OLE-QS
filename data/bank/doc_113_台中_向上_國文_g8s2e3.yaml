    \n ● 社會環境的不理解\n  無論是臺灣的教育或職場，都還是提倡人們應該深耕單一專業、專精於某項領域，才能追求成功之道。因此，有著多重身分的「斜槓青年」可能會被親戚長輩認為是「不務正業」，希望他們能夠找一份穩定正當的工作；也常被出資者認為是「不夠專業」，甚至頻頻干預過程，導致雙方都不滿意，在這樣惡性循環下，「斜槓生活」難以獲得支持的力量。\n\
    \                （節錄自艾力克〈臺灣斜槓世代的多職人生〉"
