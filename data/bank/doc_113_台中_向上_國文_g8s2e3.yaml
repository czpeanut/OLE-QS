- id: doc_113_台中_向上_國文_g8s2e3_s2_36
  section: 2
  number: 36
  type: single
  page: 2
  stem: 依據上文的內容，最適合做為以下哪種活動的廣告文宣？
  options:
  - label: A
    content: 無菸好家庭宣傳
  - label: B
    content: 國際無車日
  - label: C
    content: 反核遊行
  - label: D
    content: 男女平權馬拉松路跑。
  group_stem: "(二)\n    走路是所有旅行形式中最本質的一項。沙漠駝隊，也必須不時下得坐騎，牽著而行。你即使開車，進入一個小鎮，在主街及旁街上稍繞了三、四條後，你仍要把車停好，下車來走。以步行的韻律來觀看市景。若只走二十分鐘，而又想把這小鎮的鎮中心弄清楚，你至少要能走橫的直的加起來約十條街，也就是說，每條街只有二分鐘讓你瀏覽。\n\
    \n    走路。走一陣，停下來，站定不動，抬頭看。再退後幾步，再抬頭；這時或許看得較清楚些。有時你必須走近幾步，踏上某個高臺，墊起腳，瞇起眼，如此才瞧個清楚。有時必須蹲下來，用手將某片樹葉移近來看。有時甚至必須伏倒，使你能取到你要的攝影畫面。\n\
    \n    流浪要用盡你能用盡的所有姿勢。\n\n    走路的停止，是為站立，什麼也不做，只是站著。往往最驚異獨絕、最壯闊奔騰、最幽清無倫的景況，教人只是兀立以對。這種站立是立於天地之間。太多人終其一世不曾有此立於天地間之感受，其實何曾難了？侷促市塵多致蒙蔽而已。惟在旅途迢遙、筋骨勞頓、萬念俱簡之後於空曠荒遼中恰能得之。\n\
    \n    我人今日甚少兀兀的站立街頭、站立路邊、站立城市中任何一地，乃我們深受人群車陣之慣性籠單、密不透風，致不敢孤身一人如此若無其事的站立。噫，連簡簡單單的一件站立，也竟做不到矣！此何世也，人不能站。\n\
    \n    人能在外站得住，較之居廣廈、臥高榻、坐正位、行大道豈不更飄灑快活？\n\n    古人所謂貧而樂，固好；一簞食一瓢飲，固好；然放下這些修身念頭，到外頭走走，外頭站站，或許於心念太多之人，更好。\n\
    \n    走路，是人在宇宙最不受任何情境韁鎖、最得自求多福、最是踽踽尊貴的表現情狀。因能走，你就是天王老子。古時行者道：我人能走路流浪，亦不遠矣。\n \
    \                             節錄自舒國治〈流浪的藝術〉"
