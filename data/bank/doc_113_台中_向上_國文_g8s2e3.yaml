- id: doc_113_台中_向上_國文_g8s2e3_s1_33
  section: 1
  number: 33
  type: single
  page: 2
  stem: "古人鑄鑑(1)，鑑大則平，鑑小則凸。凡鑑窪則照人面大，凸則照人面小。小鑑不能全觀人面，故令微凸，收人面令小，則鑑雖小而能全納人面。仍復量鑑之小大，增損高下，常令人面與鑑大小相若。此工之巧智，後人不能造。比(2)得古鑑，皆刮磨令平，此師曠(3)所以傷知音也。\n\
    \                                       沈括《夢溪筆談》\n注釋: (1) 鑑：鏡子。(2) 比：音ㄅㄧˋ，近來。(3)\
    \ 師曠：春秋時代晉國著名的樂師。師是樂師，曠是其名。\n    由本文可知，下列敘述說明何者正確？"
  options:
  - label: A
    content: 鏡面凹凸與鏡像大小有關
  - label: B
    content: 鏡面的厚度與製作工法有關
  - label: C
