  stem: 43.  Why is asking questions helpful when telling the truth to the other person?
  options:
  - label: A
    content: It helps to find out the reasons for the wrong actions.
  - label: B
    content: To be as honest as possible.
  - label: C
    content: To make the other person pay for what they did.
  - label: D
    content: To make the other person get mad.
  group_stem: 'Truth Bomb


    Being honest is a good thing, but being too honest is another. Sometimes people
    don’t want to hear the truth. Everyone has truths that they don’t want to face.
    These truths are sometimes called truth bombs, especially when they are told in
    a harsh way. Damage can be done if we don’t deal with telling the truth carefully.

    We may think we are helping the other person to correct mistakes. But often we
    just want to make the other person feel bad and to make them pay for what they
    did.


    Here are some tips for telling the truth without turning it into a bomb.

    1. Pay attention to timing. Do not try to give criticism when you are angry or
    in public.

    2. Ask questions. Ask if there are reasons or problems that lead to their mistakes
    that you could help with. These questions make the other person take the criticism
    more easily.

    3. Be as specific as possible about the problem. Do not use generalizations such
    as “always” and “never.”

      especially 尤其   harsh 尖銳的   criticism 批評  specific 具體明確的   generalization 籠統的說法'
