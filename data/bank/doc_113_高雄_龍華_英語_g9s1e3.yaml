  - label: C
    content: With money, people can make eco-products.
  - label: D
    content: People fight global warming by feeding cows different food.
  group_stem: 'Eco Milk

    Global warming is a big problem for our planet.  Many things lead to global warming,
    and one of them is cows.  When cows eat and digest food, they make a gas called
    methane, which makes the Earth warmer.  But now, there is a way to help.  In Australia,
    a company called Sea Forest made a special seaweed for cows.  Farmers who feed
    cows this seaweed make a new product called “Eco-Milk”.

    This new Eco-Milk is good for the Earth because it helps cows produce about 25%
    less methane.  If 15% of all cows in the world eat this seaweed, we can cut down
    methane by 3 billion tons.  This is very good for our planet.  Because of this
    great idea, Eco-Milk won a big prize called “The Earthshot Prize” in 2023.  This
    prize gave Sea Forest NT$40 million as a reward for helping the earth. Since then
    this good eco idea is being spread and more people are making eco products.

    Right now, we can only buy Eco-Milk in some parts of Australia.  It costs a little
    more, but many people think it’s worth it to help the Earth.  By choosing to pay
    a little more for eco products like this, everyone can help save the planet from
    getting worse.

