- id: doc_113_新北_忠孝_國文_g8s1e1_s6_1
  section: 6
  number: 1
  type: single
  page: 3
  stem: 下列何者是文中放風箏的方法？
  options:
  - label: A
    content: 風太強勁，風箏陡然躍起時，要將線左右搖晃。
  - label: B
    content: 風箏要栽筋斗時，便要立即往回收。
  - label: C
    content: 風箏落在樹上時，要把線拉緊，乘風勢輕輕一扯便會升起。
  - label: D
    content: 風箏下降時，便要頻頻扯抖與放線，再及時收回，這樣風箏便可維持於不墜。
  group_stem: "放風箏時，手牽著一根線，看風箏冉冉上升，然後停在高空，這時節彷彿自己也跟著風箏飛起了，俯瞰塵寰，怡然自得。我想這也許是自己想飛而不可得，一種變相的自我滿足罷了。春天的午後，看著天空飄著別人家放起的風箏，雖然也覺得好玩，終究不若自己手裡牽著線的較為親切，那風箏就好像是載著自己的一片心情上了天。就連把風箏從空中收回來的時候，心裡也會泛起一種異樣的感覺，好像是遊罷歸來，雖說不上掃興，至少也是盡興之後的那種疲憊狀態，懶洋洋的，無話可說，彷彿從天上又回到了人間，從天上翱翔又回到匍匐地上。\
    \ \n    放風箏還可以「送幡兒」(俗呼為「送飯兒」)。用鐵絲圈套在風箏線上，圈上附一長紙條，在放線的時候鐵絲圈和長紙條便被風吹著慢慢地滑上天去，紙幡在天空飛盪，直到抵達風箏腳下為止。在夜間還可以把一盞盞的小紅燈籠送上去，黑暗中不見風箏，只見紅燈朵朵在天上游來游去。\
    \ \n    放風箏有時也需要一些技巧。最重要的是在放線鬆弛之間要控制得宜。風太勁，風箏陡然向高處躍起，左右搖晃，把線拉得繃緊，這時一不小心風箏便會倒栽下去。栽下去不要慌，趕快把線一鬆，它立刻又會浮起，有時候風箏已落到視線所不能及的地方，依然可以把它挽救起來，凡事不宜操之過急，放鬆一步，往往可以化險為夷，放風箏亦一例也。技術差的人，看見風箏要栽筋斗，便急忙往回收，適足以加強其危險性，以至於不可收拾。風箏落在樹梢上也不要緊，這時也要把線放鬆，乘風勢輕輕一扯便會升起，性急的人用力拉，便愈糾纏不清，直到把風箏扯碎為止。在風力弱的時候，風箏自然要下降，線成兜形，便要頻頻扯抖，儘量放線，然後再及時收回，一鬆一緊，風箏可以維持於不墜。\
    \ \n    好鬥是人的一種本能。放風箏時也可表現出戰鬥精神。發現鄰近有風箏飄起，如果位置方向適宜，便可鬥箏。法子是設法把自己的風箏放在對方的線兜之下，然後猛然收線，風箏陡的直線上升，勢必與對方的線兜交纏在一起，兩隻風箏都搖搖欲墜，雙方都急於向回扯線，這時候就要看誰的線粗，誰的手快，誰的地勢優了。優勝的一方可以扯回自己的風箏，外加一隻俘虜，可能還有一段的線。在一季之中，我經常可以俘獲四五隻風箏，把俘獲的風箏放飛起，心裡特別得意，好像是在炫耀自己的勝利品，可是有時候戰鬥失利，自己的風箏被俘，過一兩天看著自己的風箏在天空飄蕩時，那便又是另一種滋味了。\
    \  （節選改寫自梁實秋  放風箏）"
