- id: doc_113_新北_忠孝_國文_g8s1e1_s6_5
  section: 6
  number: 5
  type: single
  page: 4
  stem: 依據【甲】文所述，下列說明何者正確？
  options:
  - label: A
    content: 王藍田不只欺善怕惡，還是個粗暴的人。
  - label: B
    content: 王藍田生性懦弱不敢面對現實。
  - label: C
    content: 當時的人認為王藍田感慨謝無奕是個粗暴無禮的人
  - label: D
    content: 王藍田有驚人的忍耐及包容力，對謝無奕 的 謾罵始終沒還嘴。
  group_stem: "【甲】謝無奕性麤彊(1)。以事不相得(2)，自往數(3)王藍田，肆言極罵。王正色面壁不敢動，半日轉頭問左右小吏曰：「去未？」答已去。」然後復坐。時人歎其性急而能有所容。\
    \ \n \n                                 《世說新語·忿狷》\n【乙】王藍田為人晚成，時人乃謂之癡。王丞相以其東海子，辟(4)為掾(5)。常集聚，王公每發言，眾人競讚之。述於末坐曰：「主非堯、舜，何得事事皆是？」王丞相甚相歎賞。\
    \ \n \n                                 《世說新語·賞譽》\n注釋：(1)麤彊：粗暴剛強。\n      (2) 以事不相得：因為事情不如己意。\n\
    \      (3) 數：數落。 \n      (4)辟：音ㄅㄧˋ，徵召 \n      (5)掾：音ㄩㄢˋ，古代官員"
