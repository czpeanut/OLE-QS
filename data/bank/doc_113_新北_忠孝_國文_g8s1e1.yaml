  stem: 王藍田食雞子描述了王藍田吃雞蛋的過程，顯現王藍田性急的特質。下列選項中的角色哪一個人也是性急的代表？
  options:
  - label: A
    content: 「劉伶恆縱酒放達，或脫衣裸形在屋中。人見譏之，伶曰：『我以天地為棟宇，屋室為褌衣，諸君何為入我褌中！』」（褌：音ㄎ ㄨㄣ，褲子）
  - label: B
    content: 「……一日，和問馮曰：『公靴新置，其值幾何？』馮舉左足示和，曰：『九百。』和性褊急，遽回顧小吏，云：『吾靴何得用一千八百？』因詬責久之，馮徐舉其右足曰：『此亦九百。』於是哄堂大笑。」
  - label: C
    content: 「魯有執長竿入城門者，初豎執之，不可入；橫執之，亦不可入。計無所出。俄有老父至，曰：『吾非聖人，但見事多矣！何不以鋸中截而入？』遂依而截之。」
  - label: D
    content: 「王夷甫雅尚玄遠，常嫉其婦貪濁，口未嘗言『錢』字。婦欲試之，令婢以錢遶牀，不得行。夷甫晨起，見錢閡行，呼婢曰：『舉卻阿堵物。』」(閡:音ㄏㄜˊ，妨礙)
