  stem: "本文的主旨為何？\n  盛傳三國時代，東吳的孫權為了鞏固基業，假稱要將妹妹許配給劉備，聰明的孔明看穿其計謀，便傳令三軍製作各式糕餅，分送給東吳的民眾和孫權的將士們，一同分享，並同時派人在東吳境內放有著「孫、劉兩姓合婚」字樣的風箏，讓眾人知道這件事，藉此使孫權假戲真做，不得反悔。\n\
    \  孔明當時的謀略，後來竟變成了婚聘時爭相模仿的習俗。從此，大家訂婚時都會送餅通知親友，讓男女雙方不得食言反悔，糕餅業為了感謝他想出的喜餅奇招，並因而創造了喜餅市場廣大的商機，故訂農曆七月二十三日，也就是孔明的誕辰為糕餅節，並奉諸葛孔明為糕餅祖師爺。"
