  stem: 若依據本文的資訊推論，杜特蒂的支持者樣態較可能落於下圖的哪一個象限中？
  options:
  - label: A
    content: 第一象限：經濟條件佳、人權意識高
  - label: B
    content: 第二象限：經濟條件差、人權意識高
  - label: C
    content: 第三象限：經濟條件差、人權意識低
  - label: D
    content: 第四象限：經濟條件佳、人權意識低
  group_stem: "杜特蒂經濟學\n  檢視世界銀行(World Bank)公布的2016 年經濟數據：總人口突破1 億，位居東協第2（第1 為印尼），國內生產總值（GDP）超過3\
    \ 千億美元，且年成長率達百分之6 點9……，菲律賓，已被預測為東協（ASEAN）未來發展最快的國家。\n  2017 年4 月，政府推出了「杜特蒂經濟學」（DuterteNomics），「Build！Build！Build！」計畫除了持續吸引外資、改善稅制，該項經濟政策最大的目標是要擴大國內基礎建設、改善交通，正如一幅畫有杜特蒂肖像的海報所預言：「Change\
    \ is Coming.」\n  但是，作風強悍且出言不遜的狂人性格卻也為他頻頻惹議，如辱罵天主教教宗伯格里奧（Jorge Mario Bergoglio）、美國前總統歐巴馬（Barack\
    \ Obama），而他誓言掃毒所發起的毒品戰爭（War on Drugs），更是引起人權組織的高度關注與撻伐。\n  「截至目前為止，已有數千人死於杜特蒂的掃毒政策，其中不乏警察的執法過當。」國際特赦組織菲律賓分會（Amnesty\
    \ International Philippines）發言人維儂（Wilnor M‧ PAPA）告訴我：「菲律賓犯罪的主因確實是毒品氾濫，但用這種鐵腕掃毒的方法是否真的能降低犯罪率，其實還有待商榷，反倒是謀殺率卻有上升的趨勢。」\n\
    \  雖然尚未有明確的證據，但疑似有不肖警察為了「拚業績」，草率地將有吸毒或販毒嫌疑的民眾法外處決。\n  在貿易公司工作的青年馬可多卻有不同的看法：「我把總統票投給杜特蒂，就是因為支持他的掃毒願景。我相信你只要不碰毒品，就不必擔心政府會對你怎樣。看看他擔任達沃市（Davao）市長的時候，當地治安多麼良好。」\n\
    \  「其實他當時只是把罪犯趕到達沃以外的地方罷了。」維儂搖頭地說：「多數的民眾還不能獨立思考，反而是看『長相』來決定要不要把票投給政治人物，這是非常危險的事。」\n\
    \  但若是撇開政治不談，似乎大多數的商人（包含外商）都很欣賞這位狂人總統，如同一位不願具名的臺商指出：「杜特蒂和商人的關係很好，許多臺商其實都很喜歡和他打交道。」\n\
    本文節選自〈經典雜誌第236 期〉"
