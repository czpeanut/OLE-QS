  stem: '「同義複詞」是由意義相同的兩個字組合而成；「反義複詞」是由意義相反的兩個字組合而成，但兩字意義皆取用；「偏義複詞」是兩個字只取一字的意義。請依據以下例句，選出敘述正確的選項：

    (甲) 希望在晚宴上，大家都能「賓主」盡歡 (乙) 教室裡鴉雀無聲，一點「動靜」也沒有 (丙) 酒後「駕駛」是危險的行為 (丁) 司法判決應公正無私，不宜「異同」
    (戊) 人生滋味如人飲水，「冷暖」自知 (己) 詐騙集團就是利用人性的「貪婪」面 (庚) 前鋒今夜潛入敵營一探對方「虛實」 (辛) 與其「詛咒」黑暗，不如找尋光亮'
