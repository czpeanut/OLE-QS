  section: 1
  number: 30
  type: single
  page: 4
  stem: "日本網友創了個詞叫「現充」，意思是「現實生活充實」，舉凡那些花樣校園核心組男女，四界走跳，每天夜衝夜唱，跑趴狂歡。步入網路時代，又相對有了個詞叫「網充」，顧名思義，即便真實生活宛如荒漠般孤單又乾涸，卻也得在社交軟體上盡所能展現琳琅美食、旅遊美照之癡幻人生。只有被旁人欽羨妒愛，被按讚的一刻，自己變成了嚮往的樣子。從這樣的定義來說，陶淵明吟詠的田居樂事，多少有點網充成份。\n\
    \  文學史所呈現的陶淵明，除了擅長詩歌，同時也兼善雜文、祭文與辭賦，但說起他的田園詩，上過中學國文課的我們大概都能默背個幾句，什麼「種豆南山下，草盛豆苗稀」，「採菊東籬下，悠然見南山」。此外陶最有名的就是具有自傳色彩的〈五柳先生傳〉，文中「閑靜少言，不慕榮利」、「性嗜酒，家貧不能常得」的關鍵詞，加上他那樁著名的「不為五斗米折腰」軼事，我們心目中與想像裡的陶淵明，就成為了一個率性任真、脫俗豪放，自由不羈的詩人形象。眾所周知在低薪少假的鬼島，養成許多罔顧勞工權益的慣老闆，但縱觀大歷史，真正敢拍桌嗆聲說「老子不幹了」的逆襲魯蛇，還真的少之又少。於是乎不為五斗米折腰的陶淵明，掛冠解纓，歸隱田園的率性抉擇，成了爾後世世代魯蛇嚮往的對象。\n\
    \ 節錄自〈讀古文撞到鄉民：走跳江湖欲練神功的國學秘笈〉\n\n關於上文提到的概念與觀點，下列何者正確？"
