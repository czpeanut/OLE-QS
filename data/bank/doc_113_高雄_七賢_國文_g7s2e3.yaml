  group_stem: "陶淵明，一個使人聯想到田園、歸隱、詩酒、豁達的名字，後世的文學評論家談到陶淵明，往往推崇之情溢於行表。南北朝的鍾嶸將他奉為「古今隱逸詩人之宗」，昭明太子蕭統說他「文章不群」、「獨超眾類」，北宋大文豪蘇軾鍾愛陶淵明，甚至作了109\
    \ 篇「和陶詩」①。陶淵明是中國文學史上一面樸實而卓越的大旗，他的詩歌、文辭、思想影響了一代又一代的文人，至今仍受到廣泛重視。\n  現在課本介紹陶淵明，總由他的〈五柳先生傳〉說起。故事中的五柳先生安貧樂道、自然率真，被認為是陶淵明的自我投射。世人歌頌陶淵明，將其形象塑造為一名超然物外的智者、一位不問世事的隱士，他的心胸開闊，不受功名拘束。在讀到他在〈飲酒〉其五中的句子──「採菊東籬下，悠然見南山」時，老師甚至會告訴我們：「此乃最高境界！」但是，現實的陶淵明，真的如我們所認識的那麼坦然放達，屏棄仕進嗎？\n\
    \  陶潛，或名淵明，字元亮，潯陽柴桑人，世稱靖節先生；其曾祖父陶侃是東晉初年的開國元勳，官至大司馬，家世顯赫，然而傳至陶淵明時家道已經衰落。年少的陶淵明並非後來我們所認識的樣子，而是和大部分青年一樣，充滿豪情壯志，擁有肩負天下為己任的使命感。他的〈雜詩〉其五寫到：「憶我少壯時，無樂自欣豫。猛志逸四海，騫翮思遠翥。」顯見他建功立業的宏願，其他描寫年少的詩也大抵表現了此番昂揚的人生態度。於是我們不禁要問，是什麼原因或遭遇，使原本「撫劍獨行遊」的熱血青年，轉變為「守拙歸田園」的滄桑大叔？\n\
    \  陶淵明一生當過幾次官，第一次是29 歲時為了謀生，出任江州祭酒，後來因為「不堪吏職」而辭官。36 歲時成為荊州刺史桓玄的幕僚，不久即又辭職。40 歲時擔任鎮軍將軍劉裕的參軍，隔年又做建威將軍、江州刺史劉敬宣的參軍，於41\
    \ 歲時還鄉。同年，他因為家貧不能釀酒，於是在親友的勸說下走馬彭澤縣令，在此人生仕途的終站，他居然也只上任83 天就離去。從這個軌跡我們不難發現，國文課本中那位淡泊名利的詩人，在他人生顛峰的壯年時期，其實也不斷的嘗試做官，為實現自己貢獻社會的抱負和成全自己高尚志節的理想，他不斷的出仕，然後不斷的辭歸。\n\
    \  魏晉南北朝以九品中正制選官，任官的標準首重家世，使得朝廷儼然成了門閥大族的同樂會，士族間因因相循，名門互相結盟，排斥了平民庶子的晉升機會。此外，官場的虛偽、昏昧，為了追名逐利而顛倒是非的文化，自為秉持「少無適俗韻」自然情懷的風骨之士所無法接受。驅使陶淵明走上仕途的，是他胸中那份「閒居執蕩志」的雄情，而逼迫他離開官場、回到田園的，則是心裡那份「但使願無違」的堅持。陶淵明的歸隱其實是妥協的，心既不甘情亦不願，在經濟蒼生和保全自己的矛盾之間，他選擇了後者。\n\
    \  辭去彭澤令的陶淵明展開為後人津津樂道的躬耕生活，他種田、喝酒，被後人描繪成熱愛自然、率性任真甚至有點逍遙不羈的樣貌，然而遠離官場的詩人是否真的如願得到平靜呢？從他的詩作中，我們仍然可以看到他在樸實平淡的隱居生活中，對自身的懷才不遇和有志難伸發出慨嘆。〈雜詩〉其二：「日月擲人去，有志不獲騁。念此懷悲淒，終曉不能靜。」深刻表現出這種對現實的無奈。〈飲酒〉其四說：「棲棲失群鳥，日暮猶獨飛。徘徊無定止，夜夜聲轉悲。」以失去群體而獨飛的孤鳥自比，傳達了個人在天地間孤獨徘徊的巨大悲哀。其實，陶淵明的抉擇是痛苦的，他的人生是矛盾的，他游移在做官和歸隱，為難於用世與超俗，這種心境，是否如同「結廬在人境，而無車馬喧」所傳達的，那麼寫意坦然、寧靜祥和呢？\n\
    \  或許陶淵明一生都在期待有人理解他的焦慮，並且有人能解救他於困境。或許那些歷來欣賞陶淵明詩作的人，他們都企圖在這些看似曠遠超然的字裡行間，找到一絲絲對於現實的安慰。或許我們救贖了陶淵明，也就救贖了自己。\n\
    注釋：\n1. 和陶詩：依次以別人的詩的韻字創作詩。古人有「唱和」風氣，常以詩相贈，被贈者以原作者之詩所用的韻字進行創作，稱為「和」，題目通常為「和某某（原作者名）詩」。蘇軾是第一位大量寫作和陶詩的詩人。\n\
    〈陶淵明的秘密〉"
