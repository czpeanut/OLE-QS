  type: single
  page: 3
  stem: 「八月宮中賞秋海棠、玉簪花。自初一日起，即有賣月餅者。加以西瓜、藕，互相餽送。西苑鹿藕。至十五日，家家供月餅瓜果，候月上焚香後，即大肆飲啖，多竟夜始散席者。如有剩月餅，仍整收於乾燥風涼之處，至歲暮合家分用之，曰『團圓餅』也。」（劉若愚《酌中志卷二十飲食好尚紀略》）根據上文，月餅之所以稱為「團圓餅」，是因為下列哪一個原因？
