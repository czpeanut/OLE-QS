  - label: D
    content: 父親的期望
  group_stem: '替老人家扣了安全帶，他沒說太緊

    我們深深潛入月光，開車沿著濱海

    我是鮭魚

    骨灰罈子裡的父親，他也是鮭魚

    我們一道遊向宜蘭老家歸去


    每遇到大轉彎就覺得父親要離我而去

    我側頭看看他

    父親的回眸是大理石罈蓋濺過來的月光

    銀色的世界風景連綿

    這是我的世界，在公雞未啼的凌晨

    更像是父親的世界


    而此刻正是我們父子共處對話

    今天父親不再咳嗽，比往常沉默

    我的話就變得多了些：

    這麼多年來，今天的月光我最深刻

    您不是說，有一次的月光叫您難忘

    八歲那一年的中秋夜。是，我在聽

    跑了二十多里路的野地去找我父親。是爺爺

    雪白的地面映著相思林的樹影濃墨烏黑

    我像跌進一幅水墨裡慌張爬行的小蟲子

    老爸，您不用再跑了，我都準備好了

    今晨卯時您就可以和爺爺、奶奶

    還有您的愛妻我的母親他們為鄰

    嘿！當心挨罵


    是啊，您說讓您的骨灰付流水遠去

    您說得輕鬆，我卻抬不動

    有時我們想您，有個墓碑

    我們抱一把鮮花也好找到您啊

    我考慮到您最後要扛的那一塊石頭

    希望它不要那麼笨重，上面有這麼幾個字

    黃長清宜蘭縣羅東人，又名阿福（一九一三～一九九九）


    （黃春明 帶父親回家）'
