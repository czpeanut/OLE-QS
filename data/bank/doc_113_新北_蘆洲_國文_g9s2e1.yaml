  group_stem: '昔有醫人，自媒①能治背駝，曰：“如弓者、如蝦者、如環者，若延吾治，可朝治而夕如矢矣。”一人信焉，使治曲駝。

    乃索板二片，以一置地下，臥駝者其上，又以一壓焉，又踐之。駝者隨直，亦隨死。其子欲訴諸官。醫人曰：「我業治駝，但管人直，不管人死！」

    嗚呼！今之爲官，但管錢糧收，不管百姓死，何異於此醫也哉！

    ①自媒：自我介紹、自我推薦。

    （江盈科 庸醫治駝）'
