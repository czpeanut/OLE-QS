    （乙）欲寄征衣君不還，不寄君衣君又寒，寄與不寄間，妾身千萬難。

    （丙）江南可採蓮，蓮葉何田田，魚戲蓮葉間。魚戲蓮葉東，魚戲蓮葉西，魚戲蓮葉南，魚戲蓮葉北。

    （丁）黃河遠上白雲間，一片孤城萬仞山。羌笛何需怨楊柳，春風不度玉門關。依序為：'
