  - label: C
    content: 不放棄任何物質財富
  - label: D
    content: 永不向他人借錢
  group_stem: '畢卡索生前在一張報紙空白處畫的速寫，居然拍賣到十幾萬美金。

    「這速寫不過草草幾筆，根本沒有什麼藝術價值。」有評論家說：「有的話，只是市場價值。」

    四十年代的中國，政經混亂、通貨膨脹，百元當十元用，千元做百元用，買個雞蛋也要上萬元。「這錢還有什麼錢的價值？」 有人罵：「它還不如紙的價值。」

    什麼是價值？

    價值是它在人們心裡的分量。大家都看好它、欣賞它、希望持有它，它就有價值。

    這世間的東西，哪樣東西能永遠不變呢？流行會退潮、股市能崩盤、幣值能狂瀉。也就因此，許多投資人突然間一無所有。

    他們錯了啊！他們忘了有一樣價值，可以由他們自己決定，那就是「生命的價值」。只要有信心、肯努力、認定自己能東山再起，生命的價值就能維持在最高點。

    當你失去所有身外的價值時，別忘了你還有生命的價值；當你費盡力量，拉抬財產的價值，卻失敗的時候，別忘了還有一樣絕對操之在你的東西──生命的價值。印度 佛教復興之父安貝卡說得好：「即使你窮得只剩下一件衣服，你也應該把它洗得乾乾淨淨，讓自己穿起來，有一種尊嚴。」

    （劉墉 什麼是價值）'
