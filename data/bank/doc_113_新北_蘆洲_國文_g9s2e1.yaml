    跑了二十多里路的野地去找我父親。是爺爺

    雪白的地面映著相思林的樹影濃墨烏黑

    我像跌進一幅水墨裡慌張爬行的小蟲子

    老爸，您不用再跑了，我都準備好了

    今晨卯時您就可以和爺爺、奶奶

    還有您的愛妻我的母親他們為鄰

    嘿！當心挨罵


    是啊，您說讓您的骨灰付流水遠去

    您說得輕鬆，我卻抬不動

    有時我們想您，有個墓碑

    我們抱一把鮮花也好找到您啊

    我考慮到您最後要扛的那一塊石頭

    希望它不要那麼笨重，上面有這麼幾個字

    黃長清宜蘭縣羅東人，又名阿福（一九一三～一九九九）


    （黃春明 帶父親回家）'
