  section: 1
  number: 1
  type: single
  page: 1
  stem: 下列何者最能解釋為何許多社會安全制度需要透過政府推動，而不能僅靠個人或團體自行處理？
  options:
  - label: A
    content: 民間資源較不穩定，政府制度可長期保障人民
  - label: B
    content: 個人或團體可以自由選擇，容易產生資源落差
  - label: C
    content: 個人或團體行動規模有限，比較難以普及全國
  - label: D
    content: 個人或團體缺乏公權力，難以確保制度公平性。
  group_stem: 某縣去年發生強震，許多房屋倒塌，許多居民無家可歸。一開始，許多民眾和宗教團體自發性捐款、送物資、提供臨時庇護所。但隨著時間拉長，物資逐漸不足，部分居民發現自己無法申請到穩定的協助。此時，政府啟動了災害救助、提供租金補助，並協調各方資源建置臨時安置中心，同時進行公共建設的重建計畫。
