- id: doc_112_高雄_大灣_自然_g7s1e2_s1_38
  section: 1
  number: 38
  type: single
  page: 3
  stem: 下列有關人體的防禦機制，何者是屬於文中所指的第一道防線？
  options:
  - label: A
    content: 氣管黏膜組織分泌黏液保護身體避免病原體侵入
  - label: B
    content: 白血球將入侵的病原體吞噬
  - label: C
    content: 淋巴球破壞被病原體感染的細胞
  - label: D
    content: 抗體攻擊外來的病原體
  group_stem: "請閱讀下列文章，並回答38-40 題\n  生物之間出現交互作用是相當正常的事，甚至是對人體所造成傷害的病原體，也是大自然機制的一部分。然而，面對侵犯人體的病原體，人體就這麼逆來順受嗎？其實不然，人體的防禦機制是相當縝密而複雜的！\n\
    \  抵抗病原體的第一道防線是表層的皮膚與黏膜組織，諸如汗腺、皮脂腺、胃腺等腺體的分泌物，能夠改變表層環境的酸鹼度以防止病原體繁殖，而像是呼吸道與泌尿系統末端等部位覆蓋著的黏膜組織，其分泌的黏液也能保護身體不被病原體侵犯。\n\
    \  當第一道防線被病原體攻破後，人體內部的免疫系統會啟動「免疫戰爭」，諸如像是單核球或巨噬細胞一類的白血球會開始吞噬病原體，若是病原體極為強悍無法完全將其制伏時，巨噬細胞就會發出訊息，此時另一群特殊的白血球—淋巴球收到訊息後就會開始活躍，淋巴球中有能夠直接破壞病原體或受到感染的細胞，有些則會生成抗體使病原體失去感染力，更厲害是，淋巴球的防禦機制具有專一性及記憶性，當人體再次受到同一類病原體入侵，由於白血球已經有專門的對付過程，再加上淋巴球的記憶性，能夠快速清除或破壞病原體以及受病原體感染的細胞，避免人體受到更大侵犯，實際上人們也利用這種防禦特性來增進健康的生活，例如：施打疫苗。\n\
    \  雖然免疫系統有可能無法防禦病原體的入侵，但這不表示免疫細胞完全放棄，通常在這種狀況之下，免疫細胞仍在體內不斷反擊，並以全身的淋巴器官為據點，這也就是為何我們常會聽到醫生說淋巴結或脾臟腫大表示有感染的現象，又或是感冒患者出現的扁桃腺發炎腫大現象。\
    \                                          摘錄自112 康軒生物大讀家-免疫戰爭"
