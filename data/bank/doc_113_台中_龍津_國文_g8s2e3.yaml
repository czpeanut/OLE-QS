- id: doc_113_台中_龍津_國文_g8s2e3_s3_36
  section: 3
  number: 36
  type: single
  page: 5
  stem: 關公與孔子的廟宇被並列,象徵什麼?
  options:
  - label: A
    content: 道教與佛教的融合
  - label: B
    content: 政府對神祇崇拜的管控
  - label: C
    content: 關公信仰的地位與儒家並重
  - label: D
    content: 商業與軍事信仰的對立。
  group_stem: '從三國時代的英勇武將,到民間信仰中備受敬仰的神明,關公的形象早已超越歷史人物,成為華人世界中最具代表性的「萬能之神」。無論是在廟宇、警局、商店,甚至一般家庭中,關公的神像時常可見。他的神格演變大致可分為三大類:武神、文神與財神。

    作為武神,關公常見的形象是一手拿著青龍偃月刀,一手撫鬚沉思,威風凜凜。這源於他在《三國演義》中的英勇形象與忠義精神。宋代以後,關羽被逐步神化,宋徽宗三次加封,最終尊為「義勇武安王」。明代更將他封為「協天大帝」,並將關帝廟列為「武廟」,與孔子的文廟齊名。

    身為文神,關公的形象則轉為手持《春秋》,神情莊重。他崇尚儒學、忠義守信,與儒家倫理精神高度契合,因此被道教與儒家共同推崇為「文衡聖帝」。清代甚至將關廟體制比照孔廟,並以「山西關夫子」之名,象徵其與「山東孔夫子」分享武與文的聖道。

    至於財神,常常能看到繪有手拿著財寶、充滿喜氣的關公春聯,或是在商店裡就經常能看到的小尊關公像。商人敬仰關公,取其忠誠不欺、守信護財之義,加上「利」字與青龍偃月刀的「鋒利」諧音,寓意生意興隆。明清時期,山西商人出門經商必帶關公像,祈求平安與財運,也讓關公成為「武財神」,進一步普及於民間。

    如今,關公信仰早已超越單一神格,成為結合忠義、智慧與福德於一身的全能守護神,深植於華人文化之中。

    ——改寫網路文章〈從「三國武將」到「萬能之神」:關公信仰如何形成?〉'
