- id: doc_113_台中_龍津_國文_g8s2e3_s3_33
  section: 3
  number: 33
  type: single
  page: 4
  stem: 關於李安導演生平的敘述,下列選項何者正確?
  options:
  - label: A
    content: 以〈綠巨人浩克〉這部電影首度獲得奧斯卡最佳導演獎,成為第一位獲此殊榮的亞洲人
  - label: B
    content: 嘗試以 3D 科技手法拍攝〈少年 Pi 的奇幻漂流〉,第二次榮獲奧斯卡最佳導演獎
  - label: C
    content: 〈臥虎藏龍〉揚名國際影壇,成為全球華語片最賣座的電影,且掀起了全球的西方熱與武俠風
  - label: D
    content: 以在美國戲院播放的高規格來製作〈分界線〉,讓他獲得伊利諾大學「學生影展」最佳導演獎及最佳影片獎。
  group_stem: '李安靠著 3D 科技手法拍攝〈少年 Pi 的奇幻漂流〉,在競爭激烈的國際影壇上,再度獲得奧斯卡最佳導演的榮耀,其中歷經了無數的波折與辛酸。

    李安高中時原就讀臺南二中,後來轉學考進第一志願的臺南一中,而他的父親李昇當時就是南一中的校長。李安對讀書沒什麼興趣,一心只想當導演,他大學聯考落榜兩次,好不容易才進入國立臺灣藝術專科學校(今國立臺灣藝術大學)影劇科就讀。

    父親一心指望兒子考上好大學,將來成為一名教授以光宗耀祖,現在竟要淪為在舞臺上取悅別人的康樂隊隊員,回家後大哭了一場。他曾要求兒子重考,最後李安答應畢業後出國留學、未來要當個學者,才勉強妥協。

    李安在服完兵役之後,於 1979 年遠赴美國就讀伊利諾大學香檳分校戲劇系,於次年取得學士學位,並在這裡認識攻讀博士學位的臺灣留學生林惠嘉,兩人於 1983
    年結婚。李安在 1981 年轉至紐約大學就讀電影製作研究所,他的畢業論文作品〈分界線〉(Fine Line)雖然只是一部 43 分鐘的劇情片,但他並不把自己的作品定位在「畢業作品」,而是一切以在美國戲院播放的高規格來製作,正因為這種嚴謹的態度,讓他獲得紐約大學「學生影展」最佳導演獎及最佳影片獎。

    李安的畢業作品引起一家經紀公司的注意,卻未能給他發揮的機會,因此他失業長達六年,靠著妻子當藥物研究員的薪水來養家。李安每天在家裡讀書、看電影、寫劇本,還包攬了所有家務,當個家庭煮夫。這期間電影夢似乎離他越來越遠了,他決定要面對現實,於是報了一門電腦課程,希望習得一技之長。他太太知道後就對他說:「安,要記得你心裡的夢想!」那一刻,李安心裡像突然起了一陣風,那些快要淹沒在庸碌生活裡的夢想,像那個早上的陽光,直射進他的心底。

    李安描述困頓紐約的六年:「那種晃晃蕩蕩,就是那種死樣子,有時候好像也沒有什麼東西……,就是要熬、熬、熬。」在「熬」的過程中,他信仰一句話:「No pain,
    no gain.」(沒有痛苦就沒有收穫)。熬了六年終於以父親三部曲——〈推手〉、〈喜宴〉、〈飲食男女〉等電影,獲得國內、外影展的肯定。接著〈臥虎藏龍〉更是揚名國際影壇,獲得奧斯卡最佳外語片獎項,成為全球華語片最賣座的電影,且掀起了全球的東方熱與武俠風。

    〈綠巨人浩克〉是一部耗資 1.6 億美金的商業片,這部影片評價兩極,票房不佳,使他身心俱疲、萌生退意,但此時父親鼓勵他,要帶著沮喪往前衝。李安說:「他這輩子只鼓勵我這一次,所以我終究拍了〈斷背山〉。」2006
    年李安以這部電影獲得奧斯卡最佳導演獎,成為第一位獲此殊榮的亞洲人,並入選美國《時代雜誌》年度百大影響人物。《時代雜誌》形容李安:「想像力豐富的完美主義者,他執導的電影很少能達到自己心目中的標準。」

    李安說:「人生其實沒有意義,是荒謬的。意義是人自己整理出來的,而最好的整理方法,就是講故事。」李安拍片,喜歡挑各種不同的故事,做各種的嘗試。

    李安曾自嘲:「我名字有個『安』字,但我其實一生都在不安當中。」又說:「『恐懼』鞭策我不斷求改進,因為沒有比『恐懼』更強烈的感受了。能夠持續不斷嘗試,動力就在於『不安全感』。一旦有安全感,做成了慣性,我就會心生恐懼,怕被定型,怕江郎才盡,怕東西陳腐,怕被人摸透而遭淘汰。」這樣的「不安」與「恐懼」,正是他創作不絕的動力來源,也是他能在眾人的懷疑中,一次又一次令人驚豔的原因。

    節選自〈李安波折起伏的電影夢〉'
