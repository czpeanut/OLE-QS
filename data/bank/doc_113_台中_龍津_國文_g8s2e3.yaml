  section: 3
  number: 31
  type: single
  page: 3
  stem: 根據本文,黃蓉提議的優點不包含下列何者?
  options:
  - label: A
    content: 減少比賽的場次
  - label: B
    content: 顧及比賽的公平性
  - label: C
    content: 毋須等待,可立刻開戰
  - label: D
    content: 不必直接對戰,不傷和氣。
  group_stem: '洪七公竹棒一擺,就要上前動手。黃藥師搖頭道:「你適才跟老毒物打了這麼久,雖然說不上筋疲力盡,卻也是大累了一場,黃某豈能撿這個便宜?咱們還是等到正午再比,你好好養力罷。」洪七公雖知他說得有理,但不耐煩再等,堅要立時比武。黃藥師坐在石上,不去睬他。

    黃蓉見兩人爭執難決,說道:「爹爹,師父,我倒有個法兒在此。你倆既可立時比武,爹爹又不占便宜。」兩人齊道:「好啊,什麼法兒?」黃蓉道:「你們兩位是多年好友,不論誰勝誰敗,總是傷了和氣。可是今日華山論劍,卻又勢須分出勝敗,比出誰為天下第一,是不是?」

    洪、黃二人本就想到此事,這時聽她言語,似乎倒有一個妙法竟可三全其美,既能立時動手,又可不讓黃藥師占便宜,而且還能使兩家不傷和氣,齊問:「你有什麼好主意?」黃蓉道:「是這樣:爹爹先跟郭靖過招,瞧在第幾招上打敗了他,然後師父再與郭靖過招。若是爹爹用九十九招取勝,而師父用了一百招,那就是爹爹勝了。倘若師父只用九十八招,那就是師父勝了。」

    洪七公笑道:「妙極,妙極!」黃蓉道:「郭靖先和爹爹比,兩人都是精力充沛,待與師父再比,兩人都是打過了一場,豈不是公平得緊麼?」黃藥師點點頭道:「這法兒不錯。」

    ——改寫自金庸《射鵰英雄傳》'
