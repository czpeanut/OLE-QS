- id: doc_113_新北_板橋_社會_公民_g7s1e2_s1_35
  section: 1
  number: 35
  type: single
  page: 1
  stem: 臺灣將於2025 年步入超高齡社會，平均5 人有1 人是老年人口。為減輕家庭照顧與經濟壓力，政府推動長期照顧制度及老人福利，請問下列何者不是政府提供的措施？
  options:
  - label: A
    content: 設置日托中心
  - label: B
    content: 申請留職停薪
  - label: C
    content: 短期喘息服務
  - label: D
    content: 到宅沐浴服務
- id: doc_113_新北_板橋_社會_公民_g7s1e2_s1_36
  section: 1
  number: 36
  type: single
  page: 1
  stem: 台灣公共電視兒少節目「青春發言人」有一集訪問15 歲的豐驛。他從嬰兒時期就是阿嬤帶大的，阿嬤是他最親的人，豐驛也很擔心阿嬤的身體，很害怕會失去最親的人。請問豐驛的家庭是屬於何種家庭型態？
  options:
  - label: A
    content: 單親家庭
  - label: B
    content: 折衷家庭
  - label: C
    content: 新住民家庭
  - label: D
    content: 隔代教養家庭
- id: doc_113_新北_板橋_社會_公民_g7s1e2_s1_37
  section: 1
  number: 37
  type: single
  page: 1
  stem: 根據111 年的衛生福利統計調查資料顯示，目前社會以雙薪家庭佔61.7%為大多數，有許多未滿3 歲的學齡前幼兒會被送到幼兒園的幼幼班就讀。請問上述幼兒園主要協助家庭發揮哪些功能？
  options:
  - label: A
    content: 教育、經濟
  - label: B
    content: 生育、經濟
  - label: C
    content: 生育、保護與照顧
  - label: D
    content: 教育、保護與照顧
- id: doc_113_新北_板橋_社會_公民_g7s1e2_s1_38
  section: 1
  number: 38
  type: single
  page: 1
  stem: 安妮亞出生在一個幸福的家庭，他想要學習不同國家的語言或是參與舞蹈社，爸爸和媽媽都會尊重他的意願，姑姑、叔叔、伯父、爺爺、奶奶等親屬更是對他疼愛有加，請問姑姑、叔叔、伯父與他的關係為何？
  options:
  - label: A
    content: 旁系血親
  - label: B
    content: 直系血親
  - label: C
    content: 姻親
  - label: D
    content: 收養。
- id: doc_113_新北_板橋_社會_公民_g7s1e2_s1_39
  section: 1
  number: 39
  type: single
  page: 1
  stem: 關於多元化家庭生活模式的解釋，何者正確？
  options:
  - label: A
    content: 祖父母與孫子女同住為重組家庭
  - label: B
    content: 不生育子女稱為頂客家庭
  - label: C
    content: 我國人與外國人結婚為兩地家庭
  - label: D
    content: 雙薪家庭又稱為核心家庭。
- id: doc_113_新北_板橋_社會_公民_g7s1e2_s1_40
  section: 1
  number: 40
  type: single
  page: 1
  stem: 根據我國法律規定，姻親分為三種，其中若以女婿的角度來看岳父母，則岳父母對這位女婿來說，是屬於哪一種姻親？
  options:
  - label: A
    content: 配偶的血親
  - label: B
    content: 血親的配偶
  - label: C
    content: 血親的配偶的血親
  - label: D
    content: 配偶的血親的配偶。
- id: doc_113_新北_板橋_社會_公民_g7s1e2_s1_41
  section: 1
  number: 41
  type: single
  page: 1
  stem: 我國為推動家庭平權，政府修訂《民法》相關條文，下列關於《民法》修訂後的家人權利義務關係何者正確？
  options:
  - label: A
    content: 妻冠夫姓
  - label: B
    content: 子女從父姓
  - label: C
    content: 婚後財產由丈夫管理
  - label: D
    content: 教養以子女最佳利益決定。
- id: doc_113_新北_板橋_社會_公民_g7s1e2_s1_42
  section: 1
  number: 42
  type: single
  page: 1
  stem: 佩佩和喬治是一對感情很好的姐弟，豬爸爸和豬媽媽想要「收養」佩佩的好朋友瑞貝卡為自己的孩子。請問關於收養的程序，下列敘述何者正確？
  options:
  - label: A
    content: 瑞貝卡口頭上同意即完成收養程序
  - label: B
    content: 在法律上的權利義務和姊弟不同
  - label: C
    content: 必須經由法定程序向法院聲請收養
  - label: D
    content: 收養後雙方互稱繼父母和繼子女。
- id: doc_113_新北_板橋_社會_公民_g7s1e2_s1_43
  section: 1
  number: 43
  type: single
  page: 1
  stem: 現代女性進入職場，追尋屬於自己的夢想，而現代爸爸也分擔照顧孩子的責任，打破「男主外、女主內」的傳統觀念。上述內容凸顯下列何種現象？
  options:
  - label: A
    content: 跨國婚姻頻繁
  - label: B
    content: 性別平權興起
  - label: C
    content: 離婚比例上升
  - label: D
    content: 生育觀念改變。
- id: doc_113_新北_板橋_社會_公民_g7s1e2_s1_44
  section: 1
  number: 44
  type: single
  page: 1
  stem: 洛伊德和約兒從學生時期就是朋友，大學畢業後因為工作關係又成為同事。後來因為彼此珍惜再次相遇的緣分而結婚，兩個家庭形成姻親關係。請問下列關係中，何者不是姻親關係？
  options:
  - label: A
    content: 洛伊德和約兒的弟弟
  - label: B
    content: 約兒和洛伊德的妹婿
  - label: C
    content: 洛伊德的父母和約兒的父母
  - label: D
    content: 約兒和洛伊德的父母
- id: doc_113_新北_板橋_社會_公民_g7s1e2_s1_45
  section: 1
  number: 45
  type: single
  page: 2
  stem: 為落實家庭平權，政府提供許多社會資源協助家庭發揮功能。請問下列何者是針對生育率下降而推行的措施？
  options:
  - label: A
    content: 制定公共托育政策
  - label: B
    content: 交通接送服務與無障礙環境改善
  - label: C
    content: 推動長期照顧政策
  - label: D
    content: 設置家庭暴力暨性侵害防治中心。
- id: doc_113_新北_板橋_社會_公民_g7s1e2_s1_46
  section: 1
  number: 46
  type: single
  page: 2
  stem: 請問文中原先的家庭型態應屬於何種型態？
  options:
  - label: A
    content: 核心家庭
  - label: B
    content: 頂客家庭
  - label: C
    content: 單親家庭
  - label: D
    content: 通勤家庭。
  group_stem: '題組46-50：

    老皮結婚後沒有穩定的工作，經常為了錢和太太凱倫爭吵或施以暴力。凱倫以經營麵攤為業，雖然非常辛苦，但凱倫的孩子非常乖巧，會主動在放學後去幫忙。太太凱倫考慮到家中兩個未成年孩子，長期容忍老皮的行為。直到孩子成年後，不忍心媽媽長期遭受暴力對待，主動向法律扶助基金會尋求協助，說服凱倫訴請離婚。沒想到老皮在法官判准離婚後，拒絕離開住處並對家人持續施以暴力，直到○○機關出面制止施暴、送醫或協助蒐證後，才逐漸遠離同住家人。'
