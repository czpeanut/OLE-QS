  stem: 伊莉莎白‧庫伯勒羅絲醫生在1969 年提出了廣為人知的「悲傷五階段」（The Five Stages of Grief），指出大部份人會在某個重要的「失去」（失戀、離別、死亡等）事件後，經歷的五個階段。請判斷下表中921
    地震倖存者經歷傷痛後的歷程，與「悲傷五階段」相符合的組合為何？
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙丁戊
  - label: C
    content: 甲丁戊
  - label: D
    content: 乙丙戊。
  group_stem: '| 悲傷五階段的具體表現 | 921地震後倖存者面對的傷痛 |

    | --- | --- |

    | 第一階段 否認（Denial）<br>    否認一切客觀的事實，拒絕接受，也不願相信，甚至出現麻木僵住的反應。 | (甲)我根本不願意去看爸媽的遺體，有很長一段時間都覺得他們還在身邊。
    |

    | 第二階段  憤怒（Anger）<br>    將內心的失落痛苦投射到外界，憤怒、指責、攻擊那個讓我這麼痛苦的人。 | (乙)很多次都想，為什麼不讓我跟他們一起離開這個世界算了？
    |

    | 第三階段  討價還價（Bargaining）<br>    透過委屈求全、交換條件來企圖改變事實和現狀，藉此減少內心的衝擊。 | (丙)為什麼你們都離開了，就丟下、剩下我一個人？就覺得很不公平。
    |

    | 第四階段  沮喪（Depression）<br>    理智和心理狀態衝突著，陷入低落情緒、失眠，或感到沒胃口、迷惘和空虛。 | (丁)孩子哭著醒來，因為他發現他不記得爸爸媽媽長什麼樣子了。
    |

    | 第五階段  接受（Acceptance）<br>    能好好面對「失去」，並且保留回憶在心中，開始轉為理性、平靜，知道生命必須繼續前進。 | (戊)與其說是和逝去的家人說再見，其實比較像是和過去的自己說再見，迎接新的自己。
    |'
  tags:
    textbook: 第五冊（九上）第1次段考範圍
    labeled_by: ai
