- id: doc_113_台北_仁愛_國文_g9s1e1_s4_7
  section: 4
  number: 7
  type: single
  page: 1
  stem: '有關韻文的敘述，下列何者正確？

    ① 近體詩與宋詞的平仄，皆有一定的規定

    ② 宋詞依句數規定可分小令、中調、長調

    ③ 可從〈聲聲慢〉、〈過故人莊〉看出作品主要內容

    ④ 由〈稼軒長短句〉、〈東坡樂府〉，可見宋詞的別稱

    ⑤ 近體詩格律較宋詞嚴格，皆一韻到底不可換韻

    ⑥ 律詩二、三聯須對仗，宋詞視詞牌而定是否對仗'
  options:
  - label: A
    content: ①、③、⑤
  - label: B
    content: ②、④、⑤
  - label: C
    content: ①、④、⑥
  - label: D
    content: ②、③、⑥。
  tags:
    textbook: 第五冊（九上）第1次段考範圍
    labeled_by: ai
- id: doc_113_台北_仁愛_國文_g9s1e1_s4_8
  section: 4
  number: 8
  type: single
  page: 1
  stem: 「水」在中國古典文學中，是經常被使用的意象，由於水流動、柔軟的特質，和綿遠流長的形式，使「水」所指的意象產生多重的審美意義。請問李煜〈虞美人〉：「問君能有幾多愁？恰似一江春水向東流。」中「水」所指的意象，與下列何者相近？
  options:
  - label: A
    content: 任憑弱水三千，我只取一瓢飲
  - label: B
    content: 風乍起，吹皺一池春水，干卿底事
  - label: C
    content: 君不見黃河之水天上來，奔流到海不復回？
  - label: D
    content: 胭脂淚，相留醉，幾時重？自是人生長恨水長東。
  lesson_raw:
    title: 虞美人
    basis: 引用李煜〈虞美人〉課文文句
  tags:
    textbook: 第五冊 虞美人
    labeled_by: ai
- id: doc_113_台北_仁愛_國文_g9s1e1_s4_9
  section: 4
  number: 9
  type: single
  page: 1
  stem: 下列有關辛棄疾〈南鄉子〉登京口北固亭有懷的敘述，何者正確？
  options:
  - label: A
    content: 「何處望神州？滿眼風光北固樓。」寫登樓遠眺，情緒激昂意氣風發，江山光復之景盡收眼底
  - label: B
    content: 「千古興亡多少事？悠悠，不盡長江滾滾流。」化用「大江東去浪淘盡，千古風流人物」，並有相同意境
  - label: C
    content: 「年少萬兜鍪，坐斷東南戰未休。」形容孫權年少有為，統領大軍稱霸江南，足智多謀、文韜武略
  - label: D
    content: 「天下英雄誰敵手？曹劉。」盛讚曹操、劉備二人雄才大略，同時反諷南宋文武百官苟且偷安的心態。
  lesson_raw:
    title: 南鄉子
    basis: 題幹提及辛棄疾〈南鄉子〉登京口北固亭有懷
  tags:
    textbook: 第五冊 南鄉子
    labeled_by: ai
- id: doc_113_台北_仁愛_國文_g9s1e1_s4_10
