- id: doc_113_台北_仁愛_國文_g9s1e1_s4_34
  section: 4
  number: 34
  type: single
  page: 4
  stem: 比較甲乙文兩篇文章的特色，下列哪一項正確？
  options:
  - label: A
    content: 甲文晏子認為景公是仁君，不應攻打仁義之國
  - label: B
    content: 乙文借管子之言，說明嚴刑峻法對治國的影響
  - label: C
    content: 兩篇文章皆透過層遞法，指出國家興亡建立在百姓是否能過上好日子
  - label: D
    content: 兩篇皆透過因果關係，闡述為政之道，使論述更有組織。
  group_stem: "（甲）\n    景公舉兵欲伐魯，問於晏子，晏子對曰：「不可。魯好義而民戴之，好義者安，見戴者和，伯禽之治存焉，故不可攻。攻義者不祥，危安者必困。且嬰聞之，伐人者德足以安其國，政足以和其民，國安民和，然後可以舉兵而征暴。今君好酒而辟，德無以安國，厚藉斂，意使令，無以和民。德無以安之則危，政無以和之則亂。未免乎危亂之理，而欲伐安和之國，不可，不若修政而待其君之亂也。其君離，上怨其下，然後伐之，則義厚而利多，義厚則敵寡，利多則民歡。」（《晏子春秋》）\n\
    \n注釋：① 藉歛：稅收。② 使令：僕人、隨從。\n（乙）\n    不生粟之國亡，粟生而死者霸，粟生而不死者王。粟也者，民之所歸也；粟也者，財之所歸也；粟也者，地之所歸也。粟多則天下之物盡至矣。故舜一徙成邑，二徙成都，參徙成國。舜非嚴刑罰重禁令，而民歸之矣，去者必害，從者必利也。先王者善為民除害興利，故天下之民歸之。所謂興利者，利農事也；所謂除害者，禁害農事也。農事勝則入粟多，入粟多則國富，國富則安鄉重家，安鄉重家則雖變俗易習、敺眾移民，至於殺之，而民不惡也。\
    \                （《管子‧治國》）\n\n注釋：① 敺眾：使群眾聽取旨意。"
  tags:
    textbook: 第五冊（九上）第1次段考範圍
    labeled_by: ai
