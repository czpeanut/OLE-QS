  stem: 依據上文，下列敘述何者正確？
  options:
  - label: A
    content: 白居易貶謫江州後，從此感覺心神不安，奉行儉省生活
  - label: B
    content: 雜物管理諮詢師是新興行業，在協助他人捨棄多餘物件
  - label: C
    content: 所有人都認為斷絕物資的依賴，就能得到解放而自在
  - label: D
    content: 極簡主義是近代新興藝術，重點在作者對作品的詮釋。
  group_stem: "(甲) 心安不移轉，身泰無牽率。所以十年來，形神閑且逸。\n況當垂老歲，所要無多物。一裘暖過冬，一飯飽終日。\n勿言舍宅小，不過寢一室。何用鞍馬多，不能騎兩匹。\n\
    \                                （白居易〈狂言示諸姪〉）\n(乙) 「斷捨離」這個詞由日本人山口英子所創，由斷行、捨行、離行三個字組成的縮寫且申請為商標註冊。她是一位「雜物管理諮詢師」，可見「斷捨離」除了是一種生活方式和哲學，亦是一門生意。她宣稱當我們斷絕對物資的依賴，捨棄多餘的物件之後，內心亦會得到解放。\n\
    (丙) 極簡主義，是二次世界大戰後興起的藝術派系，以最原始的物象或形式展示於觀者面前，意圖消彌作者藉著作品對觀者意識的壓迫性，開放作品自身在藝術概念上的意象空間，讓觀者自主參與作品的建構。文學上的極簡主義表現在文字的節約性，以平鋪直敘的方式，讓讀者主動參與內容成為文本角色。視覺方面，極簡主義採用簡單平凡的四邊形或立方消隱具體形像傳達意識的可能性，使用重複或均等分布的手法，物料方面則盡量減少加工，採用原物表裡原來質感為特點。"
  tags:
    textbook: 第五冊（九上）第1次段考範圍
    labeled_by: ai
