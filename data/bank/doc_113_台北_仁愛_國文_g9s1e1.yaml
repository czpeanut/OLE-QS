  stem: 就吳晟〈土〉一詩的內容敘述，下列說法何者正確？
  options:
  - label: A
    content: 「無關乎閒愁逸致，更無關乎走不走進歷史」，表達作者寫詩完全是為了抒懷，不在乎是否能青史留名
  - label: B
    content: 「不爭、不吵，沉默地等待」，表現農民接受一輩子耕作的宿命，不違逆命運的安排
  - label: C
    content: 「沿著寬厚的田畝，也沿著祖先滴不盡的汗漬」，象徵農人代代相傳，克紹箕裘的精神
  - label: D
    content: 「也願躺成一大片寬厚的土地」，說明農夫安土重遷，即使生命凋零也不忘落葉歸根。
