- id: doc_111_彰化_溪湖_國文_g8s2e2_s3_30
  section: 3
  number: 30
  type: single
  page: 3
  stem: 根據本文，關於罐頭塔的敘述，下列何者正確？
  options:
  - label: A
    content: 隨時代的演進，現今內容物多以飲料、餅乾為主
  - label: B
    content: 由喪家事先準備，贈送給參加喪禮的親友
  - label: C
    content: 是日治時代開始的習俗，歷史悠久
  - label: D
    content: 吃了可以去除霉運，趨吉避凶。
  group_stem: "(三)\n    以前臺灣人辦喪事，習慣用糕餅、包子、壽桃做成塔的形狀，成雙成對擺在靈堂前。只是這些糕點不耐久藏，容易變質，因此喪禮後即便送給親友，也很少人食用。最近這幾十年，逐漸流行以可以久藏的罐頭來替代。\n\
    \    罐頭塔做得愈高，代表贈送者誠意愈高，喪家面子也愈大。傳統上，罐頭塔是親家送的，因為喪家忙著處理後事，所以親家要去幫喪家「顧厝」，就會送罐頭塔。罐頭塔內的物品，照以前的傳統是以柴米油鹽醬醋茶為主，而現在已淪為形式，以飲料、餅乾居多。該禮俗的淵源，可追溯至閩、粵沿海一帶的海口禮儀。他們多半以竹為架，封上鹽米、魷魚乾、糕餅類的食物，奠於靈堂，供喪家使用，而喪家回贈壽金、炮燭、糖以示感謝。\n\
    \    罐頭塔在喪禮結束後家屬都會拆開分送給親朋好友，感謝他們的參與及協助。習俗上認為，罐頭塔有些人確實是不能吃，如八字太輕或有沖煞到的人。\n    也有一種觀點認為罐頭塔之所以作為祭品，是和臺灣早年在商場上叱吒風雲的鳳梨王葉金塗有關。從日治時代到國民政府來臺之後有一段時間，臺灣鳳梨罐頭的出口銷量是全世界第一，今天你到葉金塗家族的舊居還可以見到外牆的鳳梨裝飾。根據口述資料，有人認為第一個拿罐頭塔當作祭品widget的，就是葉金塗逝世時的喪禮，整個大稻埕滿是奠字的花牌、鳳梨罐頭塔與白布吊旗。\n\
    \    以前鳳梨的臺語發音不是旺來，而是鳳來。這名稱的典故來源是因為鳳梨葉子像鳳尾，以「有鳳來儀」這句成語為名。臺語的鳳發音為「鬨」，不是像現在發「甕」的音。有老人家會說鳳梨的臺語發音改變和鳳梨王有關係，因為臺語的「甕」和「王」發音相近，所以發音從「鳳來」變成「王來」，再轉變成「旺來」。\n\
    （改寫自彭志光、李信宏 罐頭塔禮俗）"
  tags:
    textbook: 八下 第九課 罐頭由來
