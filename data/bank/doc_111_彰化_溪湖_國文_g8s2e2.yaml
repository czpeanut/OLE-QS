- id: doc_111_彰化_溪湖_國文_g8s2e2_s3_33
  section: 3
  number: 33
  type: single
  page: 4
  stem: 根據本文，文末缺空處應填入下列何者最恰當？
  options:
  - label: A
    content: 人類是大自然演化下的產物，應投入自然懷抱，才不會迷失自我
  - label: B
    content: 接近自然是改善人們低落情緒的良方，所以必須趕緊遠離都市並移居到鄉村
  - label: C
    content: 大腦的情緒反應和自然有密切關係，人們應與自然為伍，堅持每天散步九十分鐘
  - label: D
    content: 外出親近大自然是改善城市居民情緒的一個立竿見影的方法。
  group_stem: "(四)\n    逛公園或探訪其他綠色空間可能改變人的情緒，這種可能性激起了史丹佛大學研究生格雷戈裡‧布拉特曼的興趣，他一直在研究城市生活對心理的影響。\n\
    \    先前，他和同事們發現，志願者短暫穿行於史丹佛校園內一片鬱鬱蔥蔥的綠地之後，比那些花同樣長的時間在交通繁忙處散步的志願者更專注，也更快樂，但該研究並未考察背後發揮作用的神經機制。因此，布拉特曼及其同事決定在新研究中，密切審視散步會對一個人沉溺於憂思的傾向產生什麼影響。\n\
    \    沉溺於憂思被認知科學家稱為病態的反芻思考，是我們大多數人都很熟悉的一種心理狀態，當我們陷入其中，會情不自禁地反覆琢磨自己的生活怎麼會出現問題。這種過分的焦躁是不健康，也於事無補的。有研究顯示，它可能是抑鬱的先兆，比起住在城市地區以外的人，城市居民出現這種情況的比例特別高。\n\
    \    不過，就布拉特曼及其同事的目的而言，最有趣的或許是：這種反芻思考與腦內膝下區前額葉皮層活動增加有很高的關聯性。\n    布拉特曼及其同事先是找到三十八名健康且已成年的城市居民，並讓他們完成一份問卷，以確定一般情況下他們的病態反芻思考指數。\n\
    \    研究人員還以掃描儀追蹤每名志願者腦部的血流，檢查了其膝下區前額葉皮層的活動。通常腦部哪個區域的血流量增大，就代表著那個區域的活動增多。\n   \
    \ 隨後，科學家們隨機分派半數志願者在史丹佛校園內一個綠蔭環繞、安安靜靜，彷彿公園般的地方散步九十分鐘，另外半數則被分派到帕羅奧圖的一條嘈雜、繁忙的高速公路邊，走了同樣長的時間。志願者不得結伴而行或聽音樂，但可以自行控制速度。散步一結束，志願者便返回實驗室，再一次填寫問卷，做腦部掃描。\n\
    \    不出所料，在高速公路邊散步沒有對人們的情緒起到撫慰作用。膝下區前額葉皮層的血流量仍然很高，他們的憂思指數也沒變。\n    但問卷上的分數顯示，那些沿著綠樹成蔭的靜謐小路散步的志願者，精神健康狀況出現了雖然不大但卻很有意義的改善。他們對生活消極面的關注程度比出去散步前要低。膝下區前額葉皮層的血流量也下降了。他們腦部的那一區域更為平靜。布拉特曼說，這個結果強烈暗示：\
    \      。\n（紐約時報中文網 研究稱親近大自然有助於改善情緒）"
