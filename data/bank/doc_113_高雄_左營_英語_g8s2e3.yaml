- id: doc_113_高雄_左營_英語_g8s2e3_s4_51
  section: 4
  number: 51
  type: single
  page: 6
  stem: Stereotypes, like invisible rules, may lead to many problems for girls. Which
    is wrong?
  options:
  - label: A
    content: To lose power to create.
  - label: B
    content: To feel like living in a jail.
  - label: C
    content: To lose the right to believe in oneself.
  - label: D
    content: To live lives to the full.
  group_stem: "When we have a nice meal with people, study at school, and even work\
    \ with others, we may hear someone says,” Girls should be polite” or “ Girls shouldn’t\
    \ be too loud.” In fact, these words mean stereotypes and they don’t just limit\
    \ every one of us, they also hold back all the people in the world.\n   Stereotypes\
    \ are often barriers for girls or women for the most time. They tell us who we\
    \ should be and how we should do, so we can’t become our true selves as we wish.\
    \ For girls, these stereotypes are like invisible rules telling us what we should\
    \ look like, how we can do, and what we can choose to work in the future. That\
    \ makes girls or women feel like living in a jail, we may lose our power to create\
    \ and the right to believe in ourselves.\n   If we want to get free from stereotypes,\
    \ we need to feel them first. When we challenge these stereotypes, we open our\
    \ minds to face them without fear of judgments. It means: what stereotypes do\
    \ we face, and how can we fight them for our own future and expectations?\n  \
    \ Of all stereotypes, gender stereotypes may stop girls or women fighting for\
    \ their rights to live lives to the full. The followings are some steps we can\
    \ do to challenge gender stereotypes and show our special power:\n   First, to\
    \ feel and know well about stereotypes like how girls should dress, what words\
    \ girls can’t speak, or what work girls should do. When we feel them, we can begin\
    \ to question them. Second, enjoy our interests if we like. Don’t let gender stereotypes\
    \ stop us doing science, sports, or anything else. Our interests are ours to try\
    \ as we like. Third, we need to speak up when we face stereotypes around us. We\
    \ can start a talk in a classroom; at home, or among friends, and let people know\
    \ that gender stereotypes are harmful. Fourth, get close to friends and let them\
    \ help us challenge gender stereotypes. In this way, we have more chances to feel\
    \ true selves. And finally, we should know everyone is different and that’s why\
    \ each of us is so special. Everyone’s story is unique, and that makes life rich\
    \ and powerful.\n  When we try our best to follow the steps above, gender stereotypes\
    \ won’t be problems for our better future. After all, we do things better because\
    \ of our ability, not because of our genders.\n\n limit 限制 barrier 障礙 invisible\
    \ 隱形的 jail 監獄 challenge 挑戰 expectation 期望 among 介於 harmful 有害的 powerful 強大的 ability\
    \ 能力"
  shared_asset: g4_51_55
