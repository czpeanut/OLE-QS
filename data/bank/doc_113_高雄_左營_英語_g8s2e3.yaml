  stem: According to the reading, __________ soup can help people when they catch
    a cold.
  options:
  - label: A
    content: St. John’s Wort
  - label: B
    content: Elderberry
  - label: C
    content: Ginger
  - label: D
    content: Chamomile
  group_stem: "Eurica had a class reunion with her classmates after they left school\
    \ five years ago. They had a good time at a nice restaurant. Her good friends,\
    \ Fidan and Monica, both worked in a hospital, so she asked them about some good\
    \ ways to help her family, especially for her father and mother. Monica said,”\
    \ Echinacea, Elderberry and Ginger are good for people when they have a cold during\
    \ fall or winter days. People can make tea with Echinacea and Ginger to improve\
    \ their sickness. Sometimes people can also eat soup by Elderberry to feel better\
    \ during the cold.”\n  Then Fidan told Eurica the following tips of different\
    \ medicine from nature:\n1. Ginkgo Biloba from China can help people with heart\
    \ problem. Also Valerian is good for heart care.\n2. When people suffer from stomachache,\
    \ Elderberry or Chamomile tea is good to help ease stomach problems.\n3. If you\
    \ have a sweet tooth, Echinacea or Elderberry tea can help to ease toothache when\
    \ you eat too much candies, cakes, or anything like that.\n4. Chamomile, Turmeric,\
    \ Echinacea or St. John’s Wort (SJW) can be the best way to help people when they\
    \ get hurt.\n5. People may feel headache when they face problems at work or study.\
    \ Just drink tea with Ginger, Valerian, or Elderberry can help them feel better.\n\
    \  And Dr. Jefferson also offered Eurica something good for people’s health, especially\
    \ for old people. He said,” Ginseng, Turmeric, or St. John’s Wort can make people\
    \ stronger or healthier. People can drink tea, eat pork or chicken with any of\
    \ them to become more energetic.” In the end, Eurica wanted to know some suggestions\
    \ to help improve her kids’ memory when they study. Monica said,” It’s great for\
    \ kids to drink Ginseng or Ginkgo Biloba tea to become more energetic for their\
    \ studies at school.”\n\n improve 改善 sickness 疾病 suffer 受苦 ease 舒緩 energetic\
    \ 有活力的 suggestion 建議 memory 記憶力"
