  number: 14
  type: single
  page: 2
  stem: '聯合國人權事務高級專員巴舍萊(Michelle Bachelet)在結束任期前最後十分鐘，才把壓了一年的「新疆人權報告」發布出來，指出「中國政府虐待及要求新疆的少數民族強迫勞動」這樣的指控是可信的，並提出新疆存在嚴重違反人權的狀況。其實這樣的情形在兩、三年前就已經有不少國外的政府或媒體關注，中國政府為了抹去當地的原有文化，想把維吾爾族人「同化」成漢人，使用了許多不人道的手段強迫這些少數民族改變，但時至今日，中國政府仍然否認這樣的指控。

