  stem: （克漏字第21格）
  options:
  - label: A
    content: whether ants were hard-working
  - label: B
    content: what the hard-working insects did
  - label: C
    content: why ants were called hard-working
  - label: D
    content: where the hard-working insects worked
  group_stem: 'People are often told to work as hard as ants or bees. When we take
    a look at the ant colony, we will find ants walk here and there. They always look
    busy with something. Daniel Charbonneau and his friends were curious about it
    and tried to find _____21._____.


    For study, in 2015, Daniel and his friends built 20 nests with the ants which
    were collected from a forest in Arizona. By the use of painting on each ant in
    the nests, they could clearly watch which ants were working and which ones were
    not. To their surprise, _____22._____ when the others were busy carrying food
    back, feeding or taking care of the queen and their baby ants and eggs, or cleaning
    the nest. The team members were troubled because it was quite different from what
    people thought about ants.


    Did those lazy ants just wait for food which the busy ones carried back from the
    outside? Didn’t the busy ants “say” anything about it? The team members tried
    to _____23._____. They moved the lazy ants away from their nest first. Nothing
    happened! The busy ants still worked as usual. However, when they moved the busy
    ants away from the nest, something happened. The lazy ants took over the busy
    ones’ jobs. They found the same fact in all the nests. Then they got it. Those
    lazy ants were not really lazy. They just stood by there! They would “become”
    busy when they were needed.


     colony 蟻群 nests 巢穴'
