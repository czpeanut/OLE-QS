  group_stem: 'Jane Austen was born in 1775 in a quiet English village called Steventon,
    where she grew up surrounded by her seven brothers and sisters. She loved reading
    and writing from a young age, but she never married or moved far from home. Instead,
    she stayed close to her family, quietly crafting six famous novels, like Pride
    and Prejudice and Sense and Sensibility. When she died in 1817 at age 41, few
    people knew her as a writer because her books came out without her name. It was
    only years later that her stories won huge fans.

    Austen’s novels dive into everyday life—village dances, chatty neighbors, and
    young people looking for love. But she wasn’t just telling sweet tales. She used
    her sharp wit to show how much people cared about money, social rank, and finding
    the “right” husband or wife. In Pride and Prejudice, Elizabeth Bennet argues with
    the proud Mr. Darcy, and both have to fix their wrong ideas before they fall in
    love. This story’s been remade often: a 1940 film with Greer Garson, a 1995 BBC
    miniseries with Colin Firth, and a 2005 movie starring Keira Knightley. Now, Netflix
    is planning a new series for the coming year, showing that her stories still hook
    us.

    While wars with France and new inventions shook England during her life, Austen
    kept her stories small and personal. Some say she missed the big picture; others
    argue she showed what really shaped people’s hearts. Her clever words and tangled
    feelings keep her books alive today.

