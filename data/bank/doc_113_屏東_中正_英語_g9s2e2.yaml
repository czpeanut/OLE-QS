  group_stem: '_____________________________27.__________________________________

    Wildfires have become a growing problem in recent years, affecting forests, animals,
    and people around the world. In 2020, California and Oregon in the United States
    experienced some of the largest wildfires in their history, with over 4 million
    acres burned in California alone. In 2019~2020, Australia faced its worst bushfire
    season, called the “Black Summer, ” where 18 million hectares of land burned,
    killing over 1 billion animals and destroying many forests. Just this year, in
    January 2025, massive wildfires in Los Angeles forced over 105,000 people to leave
    their homes, destroying homes and habitats in the process. Scientists say climate
    change is making wildfires worse by causing hotter temperatures and drier conditions,
    which make forests and grasslands more likely to catch fire.

    These wildfires create big challenges for protecting nature. Forests are home
    to many plants and animals, and when they burn, biodiversity is harmed. For example,
    uncommon animals in Australia’s forests, like koalas, lost their homes during
    the Black Summer fires. Wildfires also release huge amounts of carbon dioxide
    into the air, which makes climate change worse and hurts efforts to keep land
    healthy. However, some controlled fires can help forests by clearing dead plants
    and making space for new growth. To address these issues, countries need to manage
    wildfires better, protect forests, and find ways to fix harmed land.

     affect/impact 影響；acres 英畝；hectares 公頃；massive 巨大的；destroy 摧毀；habitats 棲息地；carbon
