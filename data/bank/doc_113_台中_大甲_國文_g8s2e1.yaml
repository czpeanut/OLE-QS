  group_stem: '丙、

    一九八四年，杜威被共和黨推選出來角逐總統寶座。他的競爭對手是民主黨的杜魯門。當時一般的輿論都看好杜威，咸認他可以以壓倒性的票數擊敗杜魯門，杜威本人也自認勝券在握，故在投票當天，很高興地對身旁的太太說：「今晚妳將可以和美國總統共枕一床。」

    不料，開票結果杜魯門卻反敗為勝，當選了總統。

    杜威夫人笑笑地說：「老公，今晚你要我到杜魯門家去過夜呢？還是我打電話請杜魯門到我們家過夜？」

    杜威一聽，哈哈大笑起來，然後緊緊地擁住太太。

    （簡良助 往好的地方想）'
