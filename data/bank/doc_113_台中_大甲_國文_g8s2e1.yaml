  group_stem: '「枯山水」是日本庭園形式的一種，在日本最古老的庭園典籍作庭記書中寫道：「於無池無水處立石，名為枯山水。」現在的「枯山水」指的是無水無山，主要用石頭和砂子來打造的庭園，呈現出佛教禪宗世界觀與宇宙觀，帶來令人心境平靜的空間。

    枯山水庭園會用耙子在白砂或碎石上畫出各種紋路。耐心地畫出完美的紋路對禪宗來說也是一種修行。砂紋通常用來表現水的流動，不同的紋路代表水的不同形態，在無水的環境之中呈現出水，這正是枯山水的精義。

    枯山水是一座不須漫步、只要靜心觀賞的庭園，雖然沒有真實的山水，但以自然靜止的砂石呈現動態山水，表現出簡樸的禪宗思想境界。觀賞者可透過欣賞白石與青苔之間的對比、砂紋與石組的排列鋪陳，靜靜凝視自己的內心，感悟禪意並淨化心靈。

    日本知名庭園設計師、同時是德雄山 建功寺住持的枡野俊明，曾經說過「禪就是把多餘的東西刪除到極致」，認為打造枯山水庭園的精髓在於「刪減」，不刪減的話則難以表達箇中意境，而直到再也無法刪減東西，即是庭園完成之時。

    （節錄自完美旅行旅遊情報）'
