  section: 5
  number: 7
  type: single
  page: 4
  stem: 關於文中「失敗為失敗之學生兄弟」一句的意思，下列何者說明正確？
  options:
  - label: A
    content: 強調失敗為成功之母的道理
  - label: B
    content: 人生充滿失敗的無奈
  - label: C
    content: 有兄弟協助就不怕失敗
  - label: D
    content: 失敗總是接連而來。
  group_stem: '丁、

    有時想，沒有經過挫折的人生是受挫最重的人生。

    畢竟，沒有愁雨，則沒有亮麗的彩虹，沒有山窮水盡，則沒有柳暗花明的驚奇；太平坦的道路，使人昏昏欲睡，太甜膩的果汁，使人舌蕾麻木。挫折是生命的鹽，將人生這盤菜炒得更有滋味；挫折是善於著色的畫家，將人生這本畫冊描繪得更深刻更豐美。

    大抵挫者，錯也；折者，哲也。凡受挫，自己一定有錯；凡受折，一定要能明智檢查，認清癥結所在，調整步履，重新出發。到底窮途不一定是末路，只要你有開闢的毅力，死灰仍可復燃，只要你有新生的熱力，必能走出「失敗為失敗之學生兄弟」的暗翳陰影，迎向笑容爬滿汗水的期待。

    畢竟，受挫是烏雲，不折是晴日；受挫的只是經驗，不折的卻是意志。能挫而不折，才能高處勝寒、低處勝熱，全幅展開生命的勇銳。

    （張春榮 挫折）'
