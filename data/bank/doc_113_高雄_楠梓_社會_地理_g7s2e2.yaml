  group_stem: 興麒在澳洲打工時，看到澳洲的農業都是大面積且機械化，回到台灣後，他想將在澳洲學的優點引進，所以陸續添購小型農機具、興建集貨場、租賃土地來擴大耕種面積。由於大學時選讀環境工程的影響，他想讓消費者吃得安心，堅持不噴灑農藥。此外，他也積極從事稻米食農教育，結合附近的幼稚園、小學、國中，推廣農業體驗。看到現在農業的缺工問題嚴重，他還計畫提供打工換宿，讓對農業有興趣的年輕人回鄉務農。
