  section: 1
  number: 5
  type: single
  page: 1
  stem: 民國106 年蔡英文總統委派前臺灣省長宋楚瑜擔任臺灣領袖代表參加亞太經濟合作會議。請問：針對臺灣此時期的外交政策，下列敘述何者正確？
  options:
  - label: A
    content: 委派宋楚瑜參加是因為他不是政務官員，較不易牽動中華人民共和國的敏感神經，屬於「務實外交」的展現
  - label: B
    content: 臺灣加入APEC，可與亞太地區領導人針對經濟議題溝通意見，這是「彈性外交」的展現
  - label: C
    content: 臺灣積極推動「南向政策」與東南亞國家密切互動，可謂「鞏固外交」的展現
  - label: D
    content: 臺灣此時期已重回國際舞臺，可以使用國名參加國際組織。
