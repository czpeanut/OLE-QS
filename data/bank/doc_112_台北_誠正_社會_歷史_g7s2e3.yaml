  section: 1
  number: 11
  type: single
  page: 1
  stem: 民國60 年代，臺灣的知識分子曾經掀起一股回歸鄉土、關懷社會的熱潮。這一方面是因為臺灣經濟急速發展，產生一些社會問題亟待解決，另一方面是受當時何種事件的影響，而出現的反省與回應？
  options:
  - label: A
    content: 我國退出聯合國及與美國斷交，外交面臨困境
  - label: B
    content: 總統宣布解除戒嚴，開放大陸探親，相關問題接踵而來
  - label: C
    content: 中華人民共和國炮擊金門，兩岸關係緊張
  - label: D
    content: 政府推動南向政策，強調族群融合。
