    content: 臺灣社會運動蓬勃發展
  - label: B
    content: 臺灣都市化現象明顯
  - label: C
    content: 臺灣族群關係緊張
  - label: D
    content: 臺灣社會朝向多元開放。
  tags:
    chapter:
