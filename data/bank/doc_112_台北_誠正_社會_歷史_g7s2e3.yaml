  page: 1
  stem: 民國77 年李登輝繼任總統後，開始進入「務實外交」的階段，在國際空間被中華人民共和國打壓的情況下，持續鞏固及拓展我國的國際地位。請問：「務實外交」階段與先前外交政策最大的不同點為何？
