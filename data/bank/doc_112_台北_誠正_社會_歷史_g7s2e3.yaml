  - label: A
    content: 國共內戰戰敗，中華民國政府遷臺
  - label: B
    content: 韓戰爆發，中華民國鄰近戰場，導致各國缺乏信心紛紛與我國斷交
  - label: C
    content: 中華民國與美國斷交後，其他邦交國也紛紛與我斷交
  - label: D
    content: 中華人民共和國取代中華民國，獲得聯合國的中國席位。
