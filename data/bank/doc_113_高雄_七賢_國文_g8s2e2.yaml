  group_stem: "(丙)請閱讀以下短文，並回答下列31～32 題：\n    存心冒險的人就得打算他最後的失望，但失望卻不是絕望，這分別很大。我是曾經遭受失望的打擊，我的頭是流著血，但我的脖子還是硬的；我不能讓絕望的重量壓住我的呼吸，不能讓悲觀的慢性病侵蝕我的精神，更不能讓厭世的惡質染黑我的血液。但這並不是說我不感受人生遭遇的痛創；我絕不是那童騃①性的樂觀主義者；我絕不來指著黑影說這是陽光，指著雲霧說這是青天，指著分明的惡說這是善；我並不否認黑影、雲霧與惡，我只是不懷疑陽光與青天與善的實在；暫時的掩蔽與侵蝕，不能使我們絕望，這正應得加倍的激動我們尋求光明的決心。\n\
