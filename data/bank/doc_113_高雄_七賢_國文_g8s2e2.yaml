    \  不過，就布拉特曼及其同事的目的而言，最有趣的或許是：這種反芻思考與腦內膝下區前額葉皮層活動增加有很高的關聯性。布拉特曼及其同事先是找到三十八名健康且已成年的城市居民，並讓他們完成一份問卷，以確定一般情況下他們的病態反芻思考指數。\n\
    \  研究人員還以掃描儀追蹤每名志願者腦部的血流，檢查了其膝下區前額葉皮層的活動。通常腦部哪個區域的血流量增大，就代表著那個區域的活動增多。\n  隨後，科學家們隨機分派半數志願者在史丹佛校園內一個綠蔭環繞、安安靜靜，彷彿公園般的地方散步九十分鐘，另外半數則被分派到帕羅奧圖的一條嘈雜、繁忙的高速公路邊，走了同樣長的時間。志願者不得結伴而行或聽音樂，但可以自行控制速度。散步一結束，志願者便返回實驗室，再一次填寫問卷，做腦部掃描。\n\
    \  不出所料，在高速公路邊散步沒有對人們的情緒起到撫慰作用。膝下區前額葉皮層的血流量仍然很高，他們的憂思指數也沒變。\n  但問卷上的分數顯示，那些沿著綠樹成蔭的靜謐小路散步的志願者，精神健康狀況出現了雖然不大但卻很有意義的改善。他們對生活消極面的關注程度比出去散步前要低。膝下區前額葉皮層的血流量也下降了。他們腦部的那一區域更為平靜。布拉特曼說，這個結果強烈暗示：\
    \        。\n                                                    （紐約時報中文網 研究稱親近大自然有助於改善情緒）"
