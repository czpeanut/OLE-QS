  section: 3
  number: 45
  type: single
  page: 5
  stem: 台北市文化局指出，若民眾有加價販售門票之事實，將比對被檢舉者身分資料，查核屬實將依文創法開罰。文化局開罰的作為，其性質屬於何者？（甲）人民的（乙）政府的（丙）權力（丁）權利
  options:
