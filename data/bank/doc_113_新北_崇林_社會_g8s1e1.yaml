- id: doc_113_新北_崇林_社會_g8s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 資料ㄅㄆㄇㄈㄉ五個不同時期有不同的人才選拔方式，哪一個時代以世族家世背景為主要任官依據，有「上品無寒門，下品無世族」的現象？
  options:
  - label: A
    content: ㄅ
  - label: B
    content: ㄆ
  - label: C
    content: ㄇ
  - label: D
    content: ㄈ。
  group_stem: '依照下述資料回答第7~10題

    ㄅ：成語〈完璧歸趙〉的主角藺相如，他出身微寒曾擔任趙國宦官繆賢的門客，因為協助趙國順利帶回和氏璧而受到趙王賞識，擔任上卿（宰相），那時候是布衣卿相人才輩出的時期。

    ㄆ：地方長官在轄區內考察及選拔人才，定期推舉孝子或廉吏給中央朝廷檢核，檢定後給予錄用或升遷。

    ㄇ：以考試制度選拔人才，主要有進士、明經、明法、明算等不同科目，只要有能力者都可以報考，讓平民百姓有參與政府運作的機會。

    ㄈ：侯景投奔南朝梁武帝時，曾向梁武帝請求希望能和琅琊王氏、陳郡謝氏兩家世族結親，但皇帝以王謝兩家門第太高而拒絕，後來侯景起兵叛亂，對王謝兩家兇殘報復。

    ㄉ：將土地分封給同姓和姻親為主的貴族，讓他們可以協助保衛王室，另外透過禮樂儀式、車輛、服飾、器物等不同規格來區分身分尊卑等級。'
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 歷史
      code: 1-2
      title: 政權維繫與選才制度
      chapter: 第1章 商周至隋唐時期的國家與社會
    textbook: 八上歷史 1-2 政權維繫與選才制度
    labeled_by: ai
