  - label: C
    content: 甲丁
  - label: D
    content: 乙丁
  group_stem: 歌后張惠妹大巨蛋演唱會近20萬張門票搶購一空，網路上出現加價販售的黃牛票。台北市文化局今天(29日)表示，依據文化創意產業發展法，藝文票券只要有加價販售就是違法，將按票券張數處票面金額或定價10倍至50倍的罰鍰。文化局指出，社群平台已出現大量張惠妹唱會票券販售資訊，至今累計收到27件檢舉，正確認是否有加價販售事實，並循售票系統、電信及戶政系統比對被檢舉者身分資料，查核屬實將依文創法開罰，檢舉者可領裁處金額20%、最高10萬元的獎金。【中央社2024-09-29】
