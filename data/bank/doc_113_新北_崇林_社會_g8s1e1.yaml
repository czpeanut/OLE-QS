    content: 依法行政
  - label: D
    content: 三權分立
  group_stem: 國民黨、民眾黨立委日前於立法院聯手擋下明年度中央政府總預算，行政院發言人李慧芝今於院會後記者會轉述院長卓榮泰於會中提示表示，中央政府總預算案在立法院沒有辦法實質審查，對明年度政府的政策推動有非常大的影響。總預算如果一直都無法順利推動的話，就會變成空有政策、無法執行。雖然法定支出和部分延續性業務可以支應使用，可是新興的資本支出還有新增計畫都無法進行。【TVBS新聞網2024-09-26】
