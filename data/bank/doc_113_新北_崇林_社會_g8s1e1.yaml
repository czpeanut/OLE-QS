  type: single
  page: 1
  stem: 西元前十ㄧ世紀周武王打敗商朝紂王後，勢力持續向東方擴展，由於周管轄的土地與人口在短時間內急速增加，為了因應統治東方廣土眾民的挑戰，因此周朝的統治者設計出一套統治制度，一方面安撫商朝殘餘勢力，一方面進行武裝殖民保衛王室，請問周朝設計出來的最可能是下列哪個制度？(改寫112會考)
  options:
  - label: A
    content: 戶籍制度
  - label: B
    content: 封建制度
  - label: C
    content: 郡縣制度
  - label: D
    content: 科舉制度。
