  type: single
  page: 1
  stem: 商鞅變法後，秦國可能已經全面實行戶籍制度，在商君書中提到：『全國境內，不論男女，都有名籍在官府。初生者登錄，死者消除。』但是隨著封建瓦解，中間貴族階層逐漸消失，天子直接領有萬民。為有效掌握人民及相關資源，戶籍制度提供統治者所需要的基本資料，國家對人民的賦稅或徵兵才有所依據。」從上述內容可以得知主要是探討下列哪個主題？(改寫習作L1)
  options:
