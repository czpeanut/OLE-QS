- id: doc_113_新北_崇林_社會_g8s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 請問：上述四位君王評價自己與外族關係何者「有誤」？
  options:
  - label: A
    content: 漢武帝
  - label: B
    content: 秦始皇
  - label: C
    content: 周幽王
  - label: D
    content: 唐太宗。
  group_stem: '底下四位君王，依照生平事蹟不同而在歷史上留下不同評價，請回答第11-13題

    漢武帝：對外派遣使者出使西域，共同抵抗北方匈奴，開創絲綢之路與西方大秦遙相呼應，對內首創年號、獨尊儒術，我是文韜武略的好皇帝呀。

    秦始皇：從來沒有君王像我一樣功績卓著、統一天下，還修建了萬里長城防範北方的匈奴，我「德過三皇，功過五帝」，我是千古一帝「始皇帝」。

    周幽王：使用烽火台戲弄諸侯博取美人歡心是值得的，可是最後西北方犬戎來犯時竟然沒有人願意救我，讓我變成亡國之君，真是難受呀！

    唐太宗：打敗匈奴人後我發現，自古以來君王皆以漢人為主，輕賤胡人的地位，只有我對胡人漢人一視同仁，因此所有種族也尊敬我為他們的父母並稱呼我為「天可汗」。'
