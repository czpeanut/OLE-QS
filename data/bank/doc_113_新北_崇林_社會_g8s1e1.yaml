  stem: '美國是世界知名的民主國家，其總統大選舉往往引起全世界關注。下表中關於人治國家與法治國家的比較，哪些是正確的？


    | | | 人治國家 | 法治國家 |

    | --- | --- | --- | --- |

    | 甲 | 統治者更替 | 革命或政變 | 定期選舉 |

    | 乙 | 法律約束對象 | 人民+政府 | 人民 |

    | 丙 | 法律的功能 | 保障人民的權利 | 限制人民的工具 |

    | 丁 | 政府體制原則 | 統治者大權在握 | 分權制衡 |'
