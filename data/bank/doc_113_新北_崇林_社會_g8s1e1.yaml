  section: 3
  number: 49
  type: single
  page: 6
  stem: 上文中提到的三位獨裁者治理國家的方式，與民主國家相較，以下敘述何者正確？
  options:
  - label: A
    content: 獨裁國的法律來自於民意
  - label: B
    content: 獨裁國有法律故為法治國家
  - label: C
    content: 獨裁國的法律執行標準明確
  - label: D
    content: 獨裁國的法律可隨統治者喜好隨時修改
  group_stem: '美國總統大選將於今年11月5日舉行，現任總統拜登原本想要角逐連任，但因6月底電視辯論會表現不佳，承受巨大壓力數周後宣布退選。拜登不情願地退選，改支持副總統賀錦麗出戰，這項重大局勢變化，可能讓俄國總統普亭、中國國家主席習近平、沙國王儲賓沙爾曼等專制國家元首擔心自身的權力地位。

    智庫史汀生中心（Stimson Center）首席分析師巴羅斯說，對這三位領袖來說，維持公眾秩序是終極目標，他說，拜登突然退選，看來就像是一場由自由派媒體發動的宮廷政變，這可能讓獨裁者更無法容忍開放新聞自由。獨裁者傾向嚴加控制國內媒體，以免像拜登老化這種未經審核的題材發酵。【經濟日報2024-07-24】'
