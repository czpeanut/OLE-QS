  section: 1
  number: 38
  type: single
  page: 1
  stem: 歷史課時同學分享清領時期漢人與原住民的合作與衝突，提到潘敦仔與張達京「割地換水」協議，請問關於此協議敘述何者正確？
  options:
  - label: A
    content: 漢人割讓土地，換取原住民提供水源的使用權
  - label: B
    content: 此協議成功讓原住民勢力範圍大為擴張
  - label: C
    content: 漢人建設水利設施，原住民用土地換取用水權
  - label: D
    content: 原漢共同興築水利設施，原住民向漢人承租土地
