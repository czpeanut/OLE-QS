  stem: 俗諺「泉州人，坐海口、開店鋪；漳州人，落平陽、收佃租；客家人，走山丘、曬菜脯」來形容清領時期移民分布，請推測此分布形成的主要的因素是什麼？
  options:
  - label: A
    content: 時間因素，客家人早到、泉州人晚來自然形成
  - label: B
    content: 可能與地緣及原鄉生活方式有關
  - label: C
    content: 清朝政府嚴格控制的結果
  - label: D
    content: 這是漳泉械鬥後協商的結果
