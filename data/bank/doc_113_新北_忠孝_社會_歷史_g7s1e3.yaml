  stem: 清領時期，來臺漢人因為各有不同的語言與信仰，並面對嚴苛的生存競爭，故常以同籍聚居來保障彼此的生命財產安全，當時聚居的宗族型態有「唐山祖」與「開臺祖」兩類。請問：下列何者是這兩類組織的差異？
  options:
  - label: A
    content: 居住地區
  - label: B
    content: 溝通語言
  - label: C
    content: 祭祀對象
  - label: D
    content: 人數多寡
