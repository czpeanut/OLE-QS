  stem: 平埔族人原本沒有姓氏只有名字，乾隆23 年清廷諭令：「平埔各族薙髮同時賜姓」。當時賜的姓氏包括：潘、陳、劉、戴、李、王等，實際上取用潘姓最多。請問：這項政策的用意為何？
  options:
  - label: A
    content: 鼓勵原住民對抗歐洲人
  - label: B
    content: 鼓勵信基督教
  - label: C
    content: 「開山撫番」政策
  - label: D
    content: 加速平埔族群漢化
