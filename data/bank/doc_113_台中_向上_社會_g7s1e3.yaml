  group_stem: '【題組】閱讀短文回答下列問題；(15-17題)


    臺灣西南部沿海屬於沙岸地形，適合發展鹽業和養殖漁業。曬鹽的歷史肇始於明鄭，因為具有廣大平坦的平原地形，加上氣候條件，因此非常適合曬鹽。從第一畝鹽田在明永曆19
    年，到日治時期大興鹽場，再到光復初期的鹿港、布袋、北門、七股、臺南、烏樹林為六大鹽場，直至民國91 年臺鹽才停止曬鹽。

    養殖漁業的發展歷史也已超過百年。由於此等地區地勢低窪，且位於河道末端，目前就有10 萬以上人口從事養殖漁業，然而部分地區容易發生淹水情形，亦造成漁民生命和財產遭受威脅。'
