- id: doc_113_台北_仁愛_社會_歷史_g9s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 曾有西方學者提出:「威尼斯在中世紀後期，控制了歐洲與地中海東岸的貿易而變得非常富裕。然而，從15世紀開始，伊斯蘭勢力在巴爾幹半島和東地中海的擴張，爭奪威尼斯的領地範圍，甚至威脅到歐洲傳統的貿易航線。」依你判斷此論述的歐洲接下來會發生何事?
  options:
  - label: A
    content: 伊斯蘭教徒在義大利半島建立阿拉伯帝國
  - label: B
    content: 許多學者為了避難西遷到伊比利半島
  - label: C
    content: 羅馬教會開始販售贖罪券以籌措資金抵抗穆斯林
  - label: D
    content: 歐洲人開始出現尋找前往亞洲新航路的動機。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 歷史
      code: 4-2
      title: 大航海時代的開展
      chapter: 第4章 近代歐洲與多元世界
    textbook: 九上歷史 4-2 大航海時代的開展
    labeled_by: ai
- id: doc_113_台北_仁愛_社會_歷史_g9s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 蘇伊士運河位於埃及西側、橫跨亞洲和非洲交界，是連接地中海和紅海、以及亞洲短途人工運輸路線。2021年長榮海運的一艘貨輪擱淺於蘇伊士運河，導致全世界的貨運都被延遲，堵住了全世界的交通命脈。若物換星移，蘇伊士運河阻塞的問題出現在15世紀末，你應建議當時的歐洲商人如何利用海運，儘速將大量的貨物運抵東亞地區？
  options:
  - label: A
    content: 繞過北極海
  - label: B
    content: 繞過南非
  - label: C
    content: 航向大西洋
  - label: D
    content: 改走黑海。
  tags:
