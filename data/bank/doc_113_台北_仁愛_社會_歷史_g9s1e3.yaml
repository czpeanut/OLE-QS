  stem: 馬丘比丘（Machu Piqchu) 之意為「古老的山」，是國王帕查庫特克於1440 年左右所建立，直到1532 年歐洲征服者出現時都有人居住。在海拔2350-2440公尺的山脊上，分布著140
    個建築物，包括廟宇、避難所、公園、居住區等。關於此遺蹟的敘述，下列何者正確？
