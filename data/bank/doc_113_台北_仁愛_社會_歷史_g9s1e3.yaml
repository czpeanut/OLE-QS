- id: doc_113_台北_仁愛_社會_歷史_g9s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 西元1517 年，一位西班牙富商前往右圖某地參訪，發現類似金字塔建築，對於當地的文化大感驚歎。他向原住民詢問當地的地名，在語言不通下，聽到「槍奴克坦」，富商以為這就是地名，將它記錄下來，幾經演變成為今日的猶加敦。但事實上「槍奴克坦」這句話並非地名，根據當地的語言，這句話是說:「你在講什麼，我聽不懂！」這就是猶加敦半島地名有趣的由來。請問文中西班牙富商所參訪的地區，最可能位於圖中的何處？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
