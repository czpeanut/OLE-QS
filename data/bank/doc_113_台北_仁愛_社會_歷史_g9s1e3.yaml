  - label: D
    content: 工業革命。
  group_stem: '電影：《年輕馬克思》裡有一幕對話，呈現出馬克思具有人道關懷與實踐社會主義願景的能力。

    馬克思以調查童工狀況的記者身分去見一位工廠 主，工廠主告訴他現在僱用了二十個童工及三十個成年工 人，日夜輪班工作。 馬克思問：「難道這不會太累嗎？」工廠主辯解說：「但這對健康不會有什麼影響，我們別無選擇，您也知道，不靠童工我們根本不可能有競爭力。」
    馬克思問：「那麼您必須支付他們公平的薪資吧？」工廠主：「如果我調整童工的薪資的話，我很快就會破產了，這就是這個社會運作方式。」 馬克思：「不，先生，問題是出在現有的生產關係。問題不在社會。您不代表社會。」
    工廠主：「我不知道您說的生產關係是什麼。如果勞動成本提高，就不會有利潤了，接著就不會有經濟，接著社會也會停擺。也許您想看到的是這樣？」 馬克思（笑）：「我們的語言完全不同。您說那是利潤，
    我卻稱那是剝削。」'
