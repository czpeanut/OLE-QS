  group_stem: 啟蒙運動時期的思想家大部分出身於良好的家庭而得以接受良好的教育，也因此他們思想通常流露出對人類進步的自信。但這位思想家因為出身微寒，相對於當代其他學者，他的思想流露出對人性的悲觀，他著有《論人類不平等的起源》，他認為人類雖本性善良，但因為受到社會、經濟制度的污染而開始追求名望、財富，且逐漸有了一種渴望勝過他人、奴役他人的特質。也因此，他在政治制度的主張上提倡民主政治，公民必須達成一個「彼此都能接受且不互相侵害的共識」來組成政府，藉由法律的方式防止人渴望凌駕他人的欲望，來保障個人的自由。也因為政府是由所有公民貢獻出一部分的自身權力而組成，政府的主權在於民眾本身。
