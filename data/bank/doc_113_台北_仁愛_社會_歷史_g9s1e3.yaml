  stem: 歷史老師在課堂上介紹印度著名古蹟：「這座建築建於1632 年至1653 年，見證了國王沙賈汗對皇后慕塔芝·瑪哈美麗動人的愛情。皇后在生第14 個孩子時，不幸感染產褥熱而死，國王承諾為她建造一座全世界最美麗的陵墓，且終身不再娶。」針對此古蹟你可以再查閱到下列哪些相關資料？
