  stem: 「三角航程」貿易出現於16 世紀後，是指先將販奴商船滿載著「交換」奴隸用的槍枝彈藥和廉價消費品，從（甲）港口出發，航行到（乙）海岸，在此地用貨品交換大批奴隸，然後駛往（丙），並在此用奴隸換取殖民地的原料和銀礦，運回（甲）。一次完整的三角航程需要6
    個月，奴隸販商僅需一次便可以做三筆買賣，獲得 100%到 1000%的利潤。請問：（甲）（乙）（丙）應填入何區?
  options:
  - label: A
    content: 歐洲、非洲、美洲
  - label: B
    content: 美洲、非洲、歐洲
  - label: C
    content: 美洲、歐洲、非洲
  - label: D
    content: 歐洲、美洲、非洲。
