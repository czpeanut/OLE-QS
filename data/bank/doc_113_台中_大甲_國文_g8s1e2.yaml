    第三級:收入再提升四倍,每天有 16 美元。有水龍頭,不必去打水。供電穩定,可以有冰箱保存食物,有摩托車可以去上班,可以存的錢更多了,即使生病買藥也不會落回第二級。小孩中學畢業後可以做比家長更好的工作,甚至可以出國旅行。現約
    20 億人。

    第四級:每天能賺超過 32 美元,可以接受國民教育,可以搭飛機出國度假,每月可以吃大餐,能買車,家裡有熱水。現約 10 億人。'
