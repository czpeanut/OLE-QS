  group_stem: '（甲）西湖之勝在近，湖之易窮亦在近。朝車暮舫，徒行緩步，人人可游，時時可游。而酒多於水，肉高於山。春時，肩摩趾錯，男女雜沓，以挨簇為樂。無論意不在山水，即桃容柳眼，自與東風相倚，游者何曾一著眸子也？（明張京元斷橋）

    （乙）由斷橋至蘇堤一帶，綠煙紅霧，彌漫二十餘里。歌吹為風，粉汗為雨，羅紈之盛，多於堤畔之草，艷冶極矣。

    然杭人游湖，止午、未、申三時。其實湖光染翠之工，山嵐設色之妙，皆在朝日始出，夕春未下，始極其濃媚。（明袁宏道晚遊六橋待月記）'
