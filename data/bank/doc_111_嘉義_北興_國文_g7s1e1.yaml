  stem: 「夏天的夜就輕輕地來了。來了！來了！從山坡上輕輕地爬下來了。來了！來了！從椰子樹梢上輕輕地爬下來了。」這段詩句的景色變化與下列何者最接近？
  options:
  - label: A
    content: 白雲正悠悠的變幻舒展著
  - label: B
    content: 暮色自遠至近
  - label: C
    content: 太陽掙開白雲糾纏，露出笑臉
  - label: D
    content: 陽光把大地顏色加深、加黃，終於變成金黃。
  lesson_raw:
    title: 夏夜
    basis: 引用楊喚夏夜課文原句
- id: doc_111_嘉義_北興_國文_g7s1e1_s4_2
  section: 4
  number: 2
  type: single
  page: 1
  stem: 「蝴蝶和蜜蜂們帶著花朵的蜜糖回來了，羊隊和牛群告別了田野回家了，火紅的太陽也滾著火輪子回家了」這段詩句分析，何者正確？
  options:
  - label: A
    content: 透過萬物的日落而息，對比人類早出晚歸的辛勞
  - label: B
    content: 藉由動物紛紛回家，凸顯萬物面對黑夜時的不安
  - label: C
    content: 呈現溫馨的畫面，預告夏夜的來臨
  - label: D
    content: 以活潑的動態景觀，襯托夏夜來臨前的靜謐。
  lesson_raw:
    title: 夏夜
    basis: 引用楊喚夏夜課文原句
- id: doc_111_嘉義_北興_國文_g7s1e1_s4_3
  section: 4
  number: 3
  type: single
  page: 1
  stem: 「我們以為善加利用時間，可以同時處理很多事，其實所完成的零星小事，只是創造出非常有效率的假象。」由此可知，若想完成真正重要的事，需要心無旁騖地專心精神，下列何者也是同樣的道理?
  options:
  - label: A
    content: 各人自掃門前雪，莫管他人瓦上霜
  - label: B
    content: 不怕虎生三個口，只怕人懷兩樣心
  - label: C
    content: 先憂事者後樂事，先樂事者後憂事
  - label: D
    content: 目不能兩視而明，耳不能兩聽而聰。
- id: doc_111_嘉義_北興_國文_g7s1e1_s4_4
  section: 4
  number: 4
  type: single
  page: 1
  stem: 「真正快樂唯一來源，是為了某種我們看重的意義而花費我們的時間、我們的生命」，下列何者最能詮釋這句話的含義？
  options:
  - label: A
    content: 生命的意義在於花費時間來完成快樂的事情
  - label: B
    content: 真正的快樂來自奉獻錢財，給予眾人幸福
  - label: C
    content: 人生苦短，應把握時機，及時行樂
  - label: D
    content: 將生命花費在有意義的目標上才是真正的快樂。
- id: doc_111_嘉義_北興_國文_g7s1e1_s4_5
  section: 4
  number: 5
  type: single
  page: 2
  stem: 「這些童年吃冰的記憶，如今多已消失殆盡，這一代的小孩子再也無從體會那種樂趣。」根據這句話，下列何者最接近作者的想法？
  options:
  - label: A
    content: 遺憾臺糖已不再產製冰品
  - label: B
    content: 認為火燒冰淇淋無法吸引小孩子
  - label: C
    content: 批評現代冰品種類單一，口味不如前
  - label: D
    content: 感嘆現代物質享受充裕，吃冰已不再是最大的樂趣。
  lesson_raw:
    title: 吃冰的滋味
    basis: 引用古蒙仁吃冰的滋味課文原句
