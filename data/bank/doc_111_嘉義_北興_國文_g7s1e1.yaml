  type: essay
  page: 5
  stem: '一、題目： 「OO 讓我更有力量」

    二、說明：為了順利迎接每天的生活，我們常常需要一些人事物或元素，讓自己有更充足的力量。例如:每天上學前父母為我準備的營養早餐，讓我面對整天的學業更有能量；師長對我努力過程的肯定與鼓勵，讓我面對未來更有力量；維持每天運動的習慣，讓我身體健康也讓我更有體力。請檢視自己的生活，你覺得什麼人事物或元素讓自己更有力量?為什麼?請以「OO
    讓我更有力量」為題，寫出你的經驗、感受或想法。

