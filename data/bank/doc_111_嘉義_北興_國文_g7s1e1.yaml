  group_stem: "我曾有過一雙美麗的手。白皙柔軟，十指纖纖，許多人都羨慕、讚賞過，我也深以擁有這樣一雙手為榮。然而，曾幾何時，十指的關節一個個在病魔的侵蝕下逐漸腫大、彎曲、僵硬，變得古怪而醜陋。望著這雙不再美麗的手，我常不免黯然神傷！\n\
