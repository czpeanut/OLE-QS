- id: doc_111_嘉義_北興_國文_g7s1e1_s4_22
  section: 4
  number: 22
  type: single
  page: 4
  stem: 「很多時候，我們只看見不幸的表面，流血的創口，受傷的心；我們只會埋怨、訴苦、哀憐不滿。」這段文字可知一般人遇到挫折時的反應大多是什麼？
  options:
  - label: A
    content: 淡然處之
  - label: B
    content: 不辭勞怨
  - label: C
    content: 怨天尤人
  - label: D
    content: 喜極而泣。
  group_stem: "朋友自香港帶來一串珠鍊送我，珍珠顆顆光澤柔和，渾圓美麗。我不禁出神地看著，這樣圓潤可愛的珍珠難道真是由一粒粗糙的沙礫形成的嗎？當小小的蚌安詳地憩歇在海底，突然一個打擊臨到牠，一粒沙子嵌進肉中，痛得牠昏天暗地，牠抗拒不了，排斥不了，只有強忍著撕裂一般的痛苦，撫著傷口，一點點分泌出光滑的雲母質來層層包容這個侵入牠生命中的「苦難」。年年歲歲，漫長的忍耐，無盡的辛酸，那一粒醜陋的沙礫已經變成美麗的珍珠。眼淚化作歡笑，痛苦的代價成就了榮耀的光彩。\n\
    \  在十九世紀的初葉，法國的路易斯．勃萊爾幼年時眼睛意外受傷，被一根針刺中，不幸失明，飽受黑暗摸索的苦。他有強烈的求知欲，卻受不能閱讀之困，為了克服這點障礙，也為了造福其他和他同命運的盲人，他一再的研究試驗，忍受無數的失敗挫折，終於在一八三四年，以針在厚紙上刺出符號，發明了盲人專用的點字法，這是一項突破性的大貢獻。同樣是一根針，曾經使他失去光明，卻也因此帶給億萬盲人光芒和希望，多麼奇妙的轉變！\n\
    \  很多時候，我們只看見不幸的表面，流血的創口，受傷的心；我們只會埋怨、訴苦、哀憐不滿。不知道通過苦難的試煉，痛苦的經歷，淚水的洗條，神會使一個無用的生命發出不朽的光輝，粗糙的沙礫變成無價的珍寶。"
