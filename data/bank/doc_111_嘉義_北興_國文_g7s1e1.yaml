- id: doc_111_嘉義_北興_國文_g7s1e1_s4_24
  section: 4
  number: 24
  type: single
  page: 4
  stem: 「施比受有福。」這句話的含意與文中何者相同？
  options:
  - label: A
    content: 做人不要掌心向上，向人乞憐，要隨時不忘掌心向下，給人幫助
  - label: B
    content: 德國的大藝術家杜瑞，從小就有天份，然因家貧，無力拜師，只有去做學徒
  - label: C
    content: 我也深以擁有這樣一雙手為榮
  - label: D
    content: 它的外表再醜點又有什麼關係呢？
  group_stem: "我曾有過一雙美麗的手。白皙柔軟，十指纖纖，許多人都羨慕、讚賞過，我也深以擁有這樣一雙手為榮。然而，曾幾何時，十指的關節一個個在病魔的侵蝕下逐漸腫大、彎曲、僵硬，變得古怪而醜陋。望著這雙不再美麗的手，我常不免黯然神傷！\n\
    \  直到我聽到一則有關手的故事。德國的大藝術家杜瑞，從小就有天份，然因家貧，無力拜師，只有去做學徒，他和另一學徒極其友好，兩人都到巴黎去學雕塑，卻都限於環境，難展抱負。最後兩人商議，由其中一人做工供養另一人留學進修，學成後再彼此交換。對方讓杜瑞先去，可是，幾年後當杜瑞功成名就歸來時，卻發現朋友的一雙手因長年的粗活變得粗糙笨拙，再也無法作精細的雕塑了，杜瑞為之痛心不已。但就在當天夜裡，他卻聽見好友這樣禱告：「主啊！感謝你，當初先去的是杜瑞。」杜瑞捧著這雙為他犧牲的手，感動的留下淚來。他把這雙手畫了出來，這就是那幅名畫「祈禱的手」的來歷。\n\
    \  蔣故總統經國先生也曾提到，在他小時候，蔣公常常訓示他，做人不要掌心向上，向人乞憐，要隨時不忘掌心向下，給人幫助。這兩個故事給我極深的啟示。\n  雖然我的手不再美麗，但我希望它多學習一點付出的功課，在別人危難時及時伸出援手；但願這也是一雙懂得安慰的手，禱告的手。那麼，就是它的外表再醜點又有什麼關係呢？"
