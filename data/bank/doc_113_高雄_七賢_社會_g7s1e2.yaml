  stem: 某書寫到：「1629年6月，當時我們準備渡河，但由於溪水湍急，沒有便橋，欲背槍渡河的我們幾乎束手無策。這時，麻豆社原住民協助我們背槍、背人渡河。但不料走到河道中間時，他們居然扔下我們並將我們壓進水裡，使得多人全部葬身溪底。因此我們在地圖中特別將這條溪水標寫成「謀殺者之河」，並在之後出兵攻打他們，他們不敵，最後簽訂條約接受我們的統治。」請問：書中的「我們」最可能為？
