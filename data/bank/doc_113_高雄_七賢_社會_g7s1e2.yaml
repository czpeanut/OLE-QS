  stem: 根據法規之規定，「親權」是指父母對未成年子女的權利與義務而言。對未成年子女，父母應負保護與教養之責，下列關於「親權」的敘述何者正確？
  options:
  - label: A
    content: 親權規定在《性別平等教育法》
  - label: B
    content: 父母行使親權意見不一致時，以父親的意見為主
  - label: C
    content: 當夫妻雙方離婚時，針對未成年子女，可以自行約定繼續由雙方共同行使、或由一方單獨行使親權
  - label: D
    content: 父母濫用親權，子女可請求警察局減輕或免除撫養義務。
