- id: doc_112_桃園_文昌_英語_g8s1e2_s4_40
  section: 4
  number: 40
  type: single
  page: 3
  stem: What does “strengthen” mean?
  options:
  - label: A
    content: to make something strong
  - label: B
    content: to make something strange
  - label: C
    content: to make something popular
  - label: D
    content: to make something comfortable
  group_stem: 'Studies show that sleeping helps strengthen memories. When you learn
    something new, the best way to remember it is to sleep on it. When you fall asleep,
    your brain goes back through memories and decides what to keep and what not to
    keep. During a night of sleep, you go through light sleep, deep sleep, and Rapid
    Eye Movement (REM). These stages happen about every ninety minutes. Memories become
    stable during the deep stages of sleep. After that, REM plays a role in saving
    and putting together all the memories. That is why you might come up with a plan
    to fix a problem after a full night of sleep. Next time when you don’t know how
    to work out a problem, just sleep on it.


    How to Have a Good Night’s Sleep

    1. Go to bed and get up at the same time every day.

    2. Sleep in a dark, quiet, and comfortable room.

    3. Don’t use your cellphone before bed.

    4. A warm bath or reading before bed might help.

    5. Do exercise every day, but not right before bedtime.

    6. Don’t eat a heavy meal before bed.


    brain 大腦,REM 快速動眼期,stable 穩定,problem 問題'
