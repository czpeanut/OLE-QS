  group_stem: '(三) 12%

    Khao Yai National Park was the first national park in Thailand. Today, it’s the
    country’s third largest. Many tourists visit it every year, so workers must keep
    the park beautiful. The workers have come up with a new lesson for people with
    bad manners. They’re picking up people’s trash and mailing it back to them.

    Everyone who rents a tent in the park must write down their addresses. Once their
    group leaves any litter behind, the workers know where to send it. After packing
    up empty bottles, plastic bags, and other pieces of litter, the workers send all
    to the tourists’ home addresses with notes that say, “You forgot these things.”
    The park hopes this will teach people to respect the natural world. The violators
    will also be fined, and they can’t go to the park again.


     tourist 觀光客 manners 舉止 rent 租借 tent 帳篷 address 地址 litter 垃圾；丟垃圾 empty 空的 respect
    尊重 note 字條 fined 被罰款'
