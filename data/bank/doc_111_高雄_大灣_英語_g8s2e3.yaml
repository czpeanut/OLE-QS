  group_stem: '(二) 10%

    Have you ever heard of an avalanche? People call them “White Death.” Avalanches
    are sudden natural events where a lot of snow and ice slide down a mountain. When
    they slide, the snow and ice get faster. In fact, snow from an avalanche can move
    as fast as two hundred miles every hour. That is three times faster than a car
    on a highway!

    Most avalanches hit after big storms. New snow puts added pressure on snow already
    on the mountain. That added pressure can make the old snow break loose and start
    sliding. Avalanches can be dangerous. Heavy snow moving down a mountain may pull
    other things along, like trees and rocks. A powerful avalanche can damage everything
    in its path. Avalanches are 40. .

    Many people like to ski and snowboard. They want to have fun on mountains. However,
    nobody knows when an avalanche will hit. Avalanches happen in the mountains of
    the world over 1000000 times every year. Avalanches may be the results of changes
    in temperature, a loud noise, or movements in rocks or stones around or in the
    snow. Before enjoying the exciting winter sports over snow, make sure to learn
    more about how to stay safe.


