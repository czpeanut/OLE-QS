- id: doc_112_桃園_平南_國文_g8s2e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 在描述事物時，用形象的語言移轉感官感受，將某一感覺（例如：視、聽、嗅、味、觸覺）的主觀感受移轉到另一感覺上，是所謂「移覺」，可使意象更活潑、更新奇。在〈我所知道的康橋〉一文中，「遠近的炊煙，……在靜定的朝氣裡漸漸地上騰，漸漸地不見，彷彿是朝來人們的祈禱，參差地翳入了天聽。」此段是「以聽覺印象來描寫視覺印象」。下列句子也都用了感覺移轉的摹寫方式，請判斷何者說明正確？
  options:
  - label: A
    content: 星星是靜靜的掛在空中，卻好像帶著聲音，是早晨的幽遠之鐘，也是靜夜中雄渾的鼓聲，有著清脆的節奏與閃耀的聲息：以視覺印象描寫聽覺印象
  - label: B
    content: 我低下頭去喊自己的名字，井水也大聲應和，連那回聲都彷彿有淡淡的餘香：以嗅覺印象描寫聽覺印象
  - label: C
    content: 水面無波，四周靜謐，只有閃亮的螢光是唯一的聒噪，看著看著，人都彷彿在光裡醉了：以視覺印象描寫聽覺印象
  - label: D
    content: 柚樹的葉影在緩緩的移動，移上我臉頰的是幾朵擠碎的陽光，到這裡，它成了一種柔軟的撫摸：以視覺印象描寫觸覺印象。
