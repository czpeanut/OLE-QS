- id: doc_112_桃園_平南_國文_g8s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 〈我所知道的康橋〉一文中對於景物的描繪色彩豐富，辭藻華麗運用靈活，是徐志摩的名篇佳作。下列選項關於此文的敘述，何者錯誤？
  options:
  - label: A
    content: 「你如愛花，這裡多的是錦繡似的草原。你如愛鳥，這裡多的是巧囀的鳴禽。你如愛兒童，這鄉間到處是可親的稚子。你如愛人情，這裡多的是不嫌遠客的鄉人……」，這段文字使用四次「你如愛」，傳達出作者對康橋的熱愛，以及樂於分享自身經驗的表現
  - label: B
    content: 「關心石上的苔痕，關心敗草裡的鮮花，關心這水流的緩急，關心水草的滋長，關心天上的雲霞，關心新來的鳥語」句中連用六個「關心」表達了尋春人無功而返，只能以關心安慰自己的心情
  - label: C
    content: 「頃刻間這田野添深了顏色，一層輕紗似的金粉糝上了這草、這樹、這通道、這莊舍。頃刻間這周遭彌漫了清晨富麗的溫柔，頃刻間你的心懷也分潤了白天誕生的光榮。」連用三個「頃刻間」表現春曉景色瞬息萬變，令人目不暇給
  - label: D
    content: 「剎那間在我迷眩了的視覺中，這草田變成了……，不說也罷，說來你們也是不信的！」是情溢乎辭的表現，作者無法使用文字貼切描述當下的感受，只能以刪節號留給讀者想像空間。
