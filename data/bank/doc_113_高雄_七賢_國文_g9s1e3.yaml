  stem: 蘇軾定風波三月七日，沙湖道中遇雨。雨具先去，同行皆狼狽，余獨不覺。已而遂晴，故作此：「莫聽穿林打葉聲，何妨吟嘯且徐行。竹杖芒鞋輕勝馬，誰怕？一蓑煙雨任平生。
    料峭春風吹酒醒，微冷，山頭斜照卻相迎。回首向來蕭瑟處，歸去，也無風雨也無晴。」以下關於這闋詞的敘述，何者正確？
  options:
  - label: A
    content: 從「雨具先去，同行皆狼狽，余獨不覺」和「誰怕？一簑煙雨任平生」兩處中的「余獨不覺」和「蓑」字，可知東坡具有未雨綢繆的智慧
  - label: B
    content: 與「試問嶺南應不好，卻道，此心安處是吾鄉」所呈現的心境相似
  - label: C
    content: 由「三月七日」可知，本闋詞所顯示的季節為初夏
  - label: D
    content: 依字數判斷，本闋詞共六十二字，應屬於「小令」。
