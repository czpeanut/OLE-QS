  stem: 關於此段小說節錄的情節，下列敘述何者正確？
  options:
  - label: A
    content: 令狐沖喜怒無常，田伯光因此察覺真相，進而決定不入洞內
  - label: B
    content: 令狐沖故佈疑陣成功，田伯光最終擔心中計，所以不入洞內
  - label: C
    content: 田伯光並非華山派弟子，卻想入洞內習得祕笈，令狐沖好言相勸
  - label: D
    content: 令狐沖所言屬假，但表情是真，虛實交錯，希望引開田伯光。
  group_stem: '(三)

    田伯光道：「且慢！這山洞中到底有什麼古怪，我要進去看看。洞裡是不是藏得有什麼武學秘笈？為什麼你進洞一次，出來後便多了許多古怪招式？」說著便走向山洞。令狐沖吃了一驚，心想：「倘若給他見到石壁上的圖形，那可大大不妥。」臉上卻露出喜色，隨即又將喜色隱去，假裝出一副十分擔憂的神情，雙手伸開攔住，說道：「這洞中所藏，是敝派武學祕本，田兄非我華山派弟子，可不能入內觀看。」田伯光見他臉上喜色一現即隱，其後的憂色顯得甚是誇張，多半是假裝出來的，心念一動：「他聽到我要進山洞去，為什麼登時即喜動顏色？其後又假裝憂愁，顯是要掩飾內心真情，只盼我闖進洞去。山洞之中，必有對我大大不利的物事，多半是什麼機關陷阱，或是他養馴了的毒蛇怪獸，我可不上這個當。」說道：「原來洞內有貴派武學祕笈，田某倒不便進去觀看了。」令狐沖搖了搖頭，顯得頗為失望。

    (節錄自金庸笑傲江湖)'
