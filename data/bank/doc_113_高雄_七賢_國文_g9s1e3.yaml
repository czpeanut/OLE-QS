  - label: C
    content: 懂得以欣賞的眼光來看這個世界，就能成為一位心靈富有的人
  - label: D
    content: 保持樂觀、積極向上的個性，就能憑藉聰明才智，飛黃騰達。
  group_stem: '(一)

    常常，我會情不自禁被一些美好可愛的事物吸引，或為一些意外的發現，一些奇妙的情境，一種生命顯示的現象所感動。在激賞讚美，歡喜沉醉之餘，覺得這世界實在太偉大、太豐富、太玄妙了；而自己有幸生存其間，亦就生來富有──我天生的財富不是去占有，而是去欣賞。那些閃耀著人類智慧的圖畫、音樂、詩歌、文章、雕塑鑄造、玉石珍玩、手工藝品，以及更多新發明創作……世界太美，無法讓人每分都認識它。但是，我們可以任意享受我們所能看到的每一分。能有開闊的胸襟，寧靜的心靈，事事關懷的興致，自欣賞世界萬物中獲得單純的喜悅、心靈的共鳴，該是人性中最自然也是最高的情操。懷有感恩的心情，接納自然、接納生命、接納藝術、接納喜悅，心曠神怡，自在灑脫。而任何占有，卻是很累人的。懷有欲念時，欣賞便已不單純；刻意追求，得不到時的失望；厭舊的心理，可能就遮奪了事物的光彩，失去了純欣賞的樂趣。詩人告訴地主說：「土地是屬於你的，風景卻任由我欣賞攝取。」要欣賞自然，不必擁有山林田野。這世上有許多事物不是要我們去研究，去分析，去詮釋，去占有，而只是去喜歡，去愛。而有些事物不能占有，有些事物不必占有，也還是同樣可以去欣賞。每個人與生具來都有享受「無用之物」和「欣賞美」的能力──只要能從大大小小的事物中發現喜悅和智慧、趣味與共鳴，就會不斷發現生命中新的意義。

    (節錄自艾雯生來富有)'
