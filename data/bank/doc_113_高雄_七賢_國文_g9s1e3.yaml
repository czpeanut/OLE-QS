  stem: 文中「一薰一蕕，十年有臭」、「傅者寡，而咻者眾」等例子，皆在說明下列何者對人的影響？
  options:
  - label: A
    content: 家庭教育
  - label: B
    content: 生活環境
  - label: C
    content: 學習態度
  - label: D
    content: 人際關係。
  group_stem: '(五)

    為善必慎其習，故所居必擇其地。善在我耳，人何損焉？而君子必擇所居之地者，蓋慎其習也。孔子曰：「里仁為美。」意以此與！一薰①一蕕②，十年有臭，非以其化之③之故耶？一日暴，十日寒，無復能生之物。傅者寡，而咻者眾，
    雖日撻不可為齊語，非以其害之④之故耶？善不勝惡舊矣！為善而不求善之資⑤，在我未保其全，而惡習固已亂之矣。此擇不處仁，所以謂之不智，而里仁所以為美也。

    (王安石里仁為美)

    【注釋】

    ①薰：香草。②蕕：臭草。③非以其化「之」：代詞，香草。④非以其害「之」：代詞，學齊語的人。⑤資：環境。'
