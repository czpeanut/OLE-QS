- id: doc_113_新北_江翠_社會_g8s1e2_s3_44
  section: 3
  number: 44
  type: single
  page: 5
  stem: 文中第一段提到的考試委員提好提滿，請問是哪兩個中央政府組織的分權制衡？
  options:
  - label: A
    content: 行政院、立法院
  - label: B
    content: 總統、立法院
  - label: C
    content: 立法院、考試院
  - label: D
    content: 行政院、考試院。
  group_stem: '考試院、監察院削弱了行政權及立法權、且功能不彰的質疑，以及是否該廢除的爭論，長久以來，未曾停止。近期執政黨醞釀提案廢考監，但遭在野黨批評其雖主張廢考監，最近卻將考試委員提好、提滿，再次引發廢考監的爭論。

    中山大學退休榮譽教授廖達琪認為，考監兩院還是有存在的必要，因為目前的修憲門檻太高，且監察院掌握調查權與審計權，考試院掌握考選部與銓敘部，已經有一定運作基礎下，兩院若能繼續運作，目前來說會比較穩定。

    但東吳大學法律系教授胡博硯卻表示，監察院及考試院沒有存在的必要，他認為監察權其實是把部分行政權、部分立法權及部分司法權拉出來，尤其彈劾的部分最後還是要移送司法院的懲戒法院，因此監察院的彈劾僅與起訴的功能相當，意義不大。考試權則是行政權中有關人事部分，是否有必要設院級機構處理這些事務值得討論。胡博硯指出，若廢除監察院，要考慮的是調查權及審計權應如何處理。他認為調查權放在立法院下不會有太大問題，但審計權必須獨立於行政、立法、司法三權之外，或許可以將審計權作為一個獨立的憲政機關。請回答44-46
    題：'
