  page: 1
  stem: 「我們很習慣用美蘇冷戰的架構去看越戰，卻很少去理解越南自身的處境與歷史發展脈絡。翻開越南的歷史，雖然從明朝開始作為中國的藩屬國，但始終維持著獨立的地位。然而近代以來法國的入侵，透過某場戰爭迫使中國放棄與越南的藩屬關係，開始了法國對越南長達70年的殖民統治。從越南的角度而言，北越領袖胡志明所發動的共產革命，是越南擺脫殖民走向獨立的重要事件。」
