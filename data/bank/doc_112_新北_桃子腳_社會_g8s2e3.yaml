  group_stem: '位於非洲西南端的開普敦，是影響世界歷史的重要都市，荷蘭人在1652 年來到此地，當地氣候適合種植歐洲常見的蔬果並釀製葡萄酒，用以補充船隻上的飲食，因為由荷蘭開往東非、印度及亞洲的商船都會路經此地作補給，久而久之便成為歐洲人在漠南非洲第一個長期聚居點。1679
    年，荷蘭首位派駐總督西蒙·范德斯特爾（Simon van der Stel）到達開普敦，他致力於種植葡萄和釀製葡萄酒，為這個日後的重要產業奠下了重大的基礎。其南端的好望角位處兩大洋交匯點，位置十分重要，其後歐洲人亦建立了他們的第一所軍事基地好望堡，由奴隸所建造，其中一部份的奴隸是由荷蘭在亞洲的殖民地輸出，好望堡於1679
    年落成，是現今該國最古老的建築物。

    1869 年蘇伊士運河開通後，大量從歐洲出發的船隻改走新航線而使開普敦逐漸沒落，時至今日，開普敦則以多元文化及豐富生態成為非洲熱門觀光景點。

