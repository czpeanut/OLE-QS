  stem: 韓戰在歷史上對台灣、中國、世界都有他的重要影響，請問有關韓戰的各方面影響，下列何者錯誤？
  options:
  - label: A
    content: 朝鮮:戰後南北韓仍以北緯38度線為界，至今南北韓仍處於劍拔弩張的分裂狀態
  - label: B
    content: 中國:中共在外交上向美國一面倒，韓戰時在美國指示下，派兵協助北韓對抗蘇聯
  - label: C
    content: 台灣:美國認識到台灣在反共防禦中的重要性，開始援助台灣，穩住台灣局勢
  - label: D
    content: 世界:韓戰是當時「冷戰」局勢下的一個縮影，代表著共產陣營與反共陣營的對抗
