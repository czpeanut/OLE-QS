  stem: 公民與社會課時，大家在討論「國家追訴、處罰犯罪程序」的相關規定，下列何者最為正確？
  options:
  - label: A
    content: 聰敏：「任何人知悉有犯罪嫌疑時，均可以向警察機關或檢察官告知犯罪事實。」
  - label: B
    content: 瑾瑜：「只要發現犯罪事實，檢察官或警察機關必須馬上進行偵查。」
  - label: C
    content: 瑞君：「法官確定犯罪事實後，須依法加以審理。」
  - label: D
    content: 品宏：法官判決確定後，由警察機關負責執行。」
