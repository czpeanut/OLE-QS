- id: doc_112_新北_桃子腳_社會_g8s2e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 康康在網路上看到一段話，提到權力擁有者常可能有意無意侵犯人民的基本人權，因此「愈擁有別人不懂的專業，愈須謙虛；愈掌有令人敬畏的公權力，愈須謹慎」。依據上述觀點，下面哪一位網友的回應最為適切？
  options:
  - label: A
    content: 會提起訴訟者一定是權利被侵犯，當司法機執行公權力時，必須著重在保障原告的權利
  - label: B
    content: 司法人員是替天行道，對重大的刑案要限期追溯並速審速決
  - label: C
