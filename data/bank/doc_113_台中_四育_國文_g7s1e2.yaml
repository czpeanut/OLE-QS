  stem: 子曰：「今之孝者，是謂能養。至於犬馬，皆能有養。」句中兩個「養」的讀音和解釋，何者正確？
  options:
  - label: A
    content: 前者讀四聲，指奉養父母；後者讀三聲，指陶冶教化
  - label: B
    content: 前者讀三聲，指飼養照料；後者讀四聲，指陶冶教化
  - label: C
    content: 前者讀四聲，指奉養父母；後者讀三聲，指飼養照料
  - label: D
    content: 前者讀三聲，指奉養父母；後者讀四聲，指飼養照料。
