- id: doc_113_台中_四育_國文_g7s1e2_s3_6
  section: 3
  number: 6
  type: single
  page: 1
  stem: "孩子 \n我們生命中的色彩 \n是注定要從黑色的地層下面 \n挖出來的 \n家裡飯桌上 綠色的菜 \n白色的米 \n街頭二輪的彩色電影 \n媽媽的紅拖鞋\
    \ \n姐姐的綠色香皂 \n還有你的黃色書包 \n都是需要阿爸 流汗 \n從黑色的洞裡 挖出來的 \n今後阿爸不再陪你了 \n因為阿爸要到更深 更黑的地方\
    \ \n再為你 挖出一條 \n有藍色天空的路來 \n本詩節錄自杜十三 煤—寫給一九八四年七月煤山礦災死難的六十七名礦工。關於本詩內容，下列敘述何者錯誤？"
  options:
  - label: A
    content: 本詩以父親的口吻陳述觀點
  - label: B
    content: 詩中的阿爸為了家人不計一切的付出
  - label: C
    content: 「綠色的菜／白色的米……從黑色的洞裡 挖出來的」指家中生活所需都是父親冒險工作換取的
  - label: D
    content: 「今後阿爸不再陪你了／因為阿爸要到更深 更黑的地方」指父親常工作到深夜，無法陪小孩。
  tags:
