  section: 3
  number: 10
  type: single
  page: 1
  stem: 阿德要使用按部首編排的辭典查閱「集團」的詞義，他所採取的步驟如下，何者「錯誤」？
  options:
  - label: A
    content: 步驟一：把「集」字拆成「隹」、「木」兩個部分
  - label: B
    content: 步驟二：找「木」部，查不到「集」字，故可確定「集」字的部首應是「隹」部
  - label: C
    content: 步驟三：「集」字是十二畫，放在隹部十二畫的地方可找到「集」字
  - label: D
    content: 步驟四：在「集」字收錄的詞目中，尋找「集團」的詞義。
