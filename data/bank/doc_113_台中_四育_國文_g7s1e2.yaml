  stem: 第一則論語中，孔子問「曾是以為孝乎？」這段話的目的主要是？
  options:
  - label: A
    content: 提醒子夏，物質上的供養和勞動幫助並不等於真正的孝道
  - label: B
    content: 質疑子夏對孝的理解，並強調外在行為的重要性
  - label: C
    content: 指出父母物質需求比精神需求更重要
  - label: D
    content: 表示對傳統孝道的懷疑，認為它應該被更新
  group_stem: "(一)子夏問孝。子曰：「色難。有事，弟子服其勞；有酒食，先生饌。曾是以為孝乎？」（論語 為政篇） \n(二)子曰：「父母之年，不可不知也。一則以喜，一則以懼。」（論語\
    \ 里仁篇） \n(三)子曰：「父母在，不遠遊；遊必有方。」（論語 里仁篇） \n注：①色難：孝順父母，最難得的是臉色和悅。 ②饌：食用、享用。 ③曾：難道。\
    \ ④方：方向、處所。"
