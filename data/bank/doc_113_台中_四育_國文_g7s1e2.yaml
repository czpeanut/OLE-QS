- id: doc_113_台中_四育_國文_g7s1e2_s4_1
  section: 4
  number: 1
  type: single
  page: 3
  stem: 關於文中作者所提及的自身運動的情形，下列敘述何者不正確？
  options:
  - label: A
    content: 剛開始每回做都很累，兩週後有上癮的感覺
  - label: B
    content: 第三週時運動成效不明顯，減重進入停滯期
  - label: C
    content: 運動使作者脊椎變得彎曲，頸椎也鼓出大包
  - label: D
    content: 運動時，作者腦海裡會以各種名言自我激勵
  group_stem: "人的意志力是一年生的草木（改寫）   柏邦妮 \n    持續運動將近一個月了。     \n    開始的一週多，每次做都會累死。持續兩週以後，每天到了運動的時間，居然有隱約的期盼。第三週的時候，體重居然沒有大變化。這時我的按摩師挽救了我。她給我按摩酸痛的肌肉，驚喜地說：「你的脊椎原來彎曲得厲害，現在好多了！頸椎鼓出來的大包也平復了。你得堅持！」\
    \ \n    我在運動的時候，各種名人名言都會冒出腦海。\n    比如：「他的心靈上已被脂肪包圍，久不使用的天賦終已泯滅。」、「一個人堅持做一件事，不是因為有效，而是因為它是正確的。」\
    \ \n    但是最多響起的，是這段話： \n    「人的意志力通常是一年生的草木，禁不起季節偷換，會凋謝枯萎。你得想辦法在意志力消失之前，讓它成為一種生活習慣。然而，饒是如此，也沒有什麼一治不復亂的神話，時間永遠比你陰險、有耐心，會抓住每一個縫隙攻擊你。而且時間沒有身體，永恆如新，但是你有，你會衰老，會越來越受不了疲勞。」\
    \ \n    不知為何，這一段談不上多勵志的文字反而最鼓勵我。大概是因為，它不是在羞辱你。我非常反感那種羞辱自己來激發動力的口號，因為羞辱意味著自責和內疚，在偶爾一崩潰之後，那份沉重的挫敗，會使得人再也無法重新開始。\
    \ \n    這段話裡，有一種對人性的了解和寬恕。一次兩次甚至多次的放棄都不算什麼，你不必感到羞愧；而相反，如果你戰勝了這些，你完全可以感到驕傲。 \n\
    \    汗水砸到地上的時候，我默默地念著：「人的意志力通常是一年生的草木……」 \n    讓草木慢慢地長成大樹吧。"
  tags:
    chapter:
      publisher: null
      book: 七上
      subject: 國文
      code: null
      title: null
      chapter: null
    textbook: 七上 第2次段考範圍
    labeled_by: ai
