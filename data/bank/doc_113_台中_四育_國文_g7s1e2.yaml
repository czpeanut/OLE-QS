  stem: 下列「 」中的詞語，何組意思兩兩相同？
  options:
  - label: A
    content: 我在那片山區，經常能見到不被打擾的自然「光景」／生活的「光景」變得越來越艱難，許多人都在為生計奔波
  - label: B
    content: 昨晚九時「左右」，我接到一通詐騙電話／你要有自己的想法，不要被旁人所「左右」了
  - label: C
    content: 她的「料理」工夫了得，所以餐館的生意很好／都這麼大個人了，還不會「料理」自己的生活嗎
  - label: D
    content: 待人誠懇，大家「自然」會喜歡和你做朋友／做事情一心二用，「自然」容易造成失敗的結果。
