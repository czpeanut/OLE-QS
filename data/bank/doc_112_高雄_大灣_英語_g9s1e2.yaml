  group_stem: 'What''s an allergy? It''s when you eat something or your body touches
    something, your body doesn''t like it. It can make your body sick or let your
    skin or breathing have some problems. People can have allergies to many things,
    such as plants, animals, food and more.

    Some allergies are not bad. They make you itch and sneeze. But they won''t kill
    you! However, some allergies can be very dangerous! People with serious allergies
    need to be very careful! Many people have nut allergies. That''s why many foods
    have a special stamp. It says "May Contain Nuts". It''s very easy for nuts to
    get into food. People with nut allergies need to be very careful!

    A woman was on a plane. She had a very bad nut allergy. The crew was selling snacks.
    Then she saw that the snacks were peanuts! The woman was scared. Her allergy was
    very serious. She didn''t want people on the plane to have peanuts. So, she bought
    all of them! She spent 6,000 Taiwan dollars on peanuts! But she was safe. If you
    have allergies, be careful! (The reading is partly rewritten from News Lunchbox
    2023-10-04)

     itch 發癢 sneeze 打噴嚏 contain 包含 nut 堅果 stamp 標記 crew 空勤人員'
