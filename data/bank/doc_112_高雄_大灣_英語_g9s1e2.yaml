  page: 2
  stem: 1. What is Slow Fish?
  options:
  - label: A
    content: An action to help ocean life
  - label: B
    content: The name of a seafood restaurant.
  - label: C
    content: A kind of fish.
  - label: D
    content: A fishing machine
  group_stem: 'When it comes to seafood, many people think of all-you-can-eat restaurant.
    However, they hurt our environment a lot. Because of overfishing, the number of
    fish in our oceans is becoming fewer and fewer. If we do not take any action,
    overfishing may completely empty the fish in the oceans.

    Slow Fish is a way to stop overfishing. At Slow Fish restaurants, they only buy
    local fish in season. This way, people can easily check how many fish are still
    nearby. People can stop fishing if the number of nearby fish drops too quickly.
    Slow Fish restaurant want to help ocean life stay certain numbers.

    So, the next time you want to eat seafood, you can go to Slow Fish restaurant
    to enjoy delicious and sustainable fish, the nearby fish in the ocean able to
    continue to be there for a long time. (The reading is partly rewritten from Nani
    Reading Comprehension.)

     completely 完全地 empty 使空 local 當地的 nearby 附近的 certain 某種程度的 continue 繼續'
  tags:
    textbook: 第五冊（九上）第2次段考範圍
