questions:
- id: doc_112_台北_仁愛_社會_歷史_g7s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 從前有一首在民間流行的歌曲：「消滅朱毛，殺漢奸，殺漢奸；收復大陸，解救同胞，服從領袖，完成革命；三民主義實行，中華民國復興；中華復興，民國萬歲；中華民國萬萬歲！……」此歌曲最可能流行於下列哪一個時期？
  options:
  - label: A
    content: 武力對抗時期
  - label: B
    content: 政治對峙時期
  - label: C
    content: 民間交流時期
  - label: D
    content: 皇民化運動時期
- id: doc_112_台北_仁愛_社會_歷史_g7s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 這一年，是海峽兩岸外交力量的分水嶺。因為這一年的某事件後，中華民國在許多國際組織遭到排擠，許多邦交國也轉與中華人民共和國建交，加深中華民國的孤立。請問：下列哪一事件是造成海峽兩岸關係地位轉變的關鍵？
  options:
  - label: A
    content: 民國47 年，金門八二三炮戰
  - label: B
    content: 民國60 年，中華民國退出聯合國
  - label: C
    content: 民國61 年，日本與中華民國斷交
  - label: D
    content: 民國68 年，美國與中華人民共和國建交
- id: doc_112_台北_仁愛_社會_歷史_g7s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 民國六十年代的國際能源危機，對臺灣經濟造成嚴重衝擊，政府如何處理當時的經濟困境？
  options:
  - label: A
    content: 鼓勵輕工業商品出口，拓展海外貿易
  - label: B
    content: 推動十大建設，改善國內的投資環境
  - label: C
    content: 進行土地改革，引導地主投資工商業
  - label: D
    content: 積極加入國際組織，並降低貿易限制
- id: doc_112_台北_仁愛_社會_歷史_g7s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 民國七十年代末期，客家、勞工、婦女、原住民族等群體，紛紛透過社會運動爭取權益。這些群體能夠走上街頭表達訴求，是在哪一個政策推行之後？
  options:
  - label: A
    content: 推動農山漁村轉型
  - label: B
    content: 推行土地改革
  - label: C
    content: 宣布解除戒嚴
  - label: D
    content: 推行十大建設
- id: doc_112_台北_仁愛_社會_歷史_g7s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 巧巧的阿媽回憶年輕時念書的校園裡有一大片牆面，上面畫了兩名學生，身旁寫著「保密防諜，人人有責」。若巧巧回到阿媽所說的時代，會見到什麼情形？
  options:
  - label: A
    content: 高雄設立加工出口區，引進外資，擴大出口
  - label: B
    content: 政府為了改善臺灣金融環境，建立臺灣銀行
  - label: C
    content: 臺灣加入世界貿易組織，積極拓展國際貿易
  - label: D
    content: 原住民族發動「還我土地」運動，爭取權益
- id: doc_112_台北_仁愛_社會_歷史_g7s2e3_s2_6
  section: 2
  number: 6
  type: single
  page: 1
  stem: 國共內戰後期，國民黨政權漸趨下風，導致了中華民國政府於民國38 年12 月遷臺。請問，以下哪一戰役「早於」中華民國遷臺？
  options:
  - label: A
    content: 古寧頭戰役
  - label: B
    content: 韓戰
  - label: C
    content: 八二三炮戰
  - label: D
    content: 以上皆非
- id: doc_112_台北_仁愛_社會_歷史_g7s2e3_s2_7
  section: 2
  number: 7
  type: single
  page: 1
  stem: 二戰以後，美國與兩岸政府的互動、競合牽動了東亞局勢的發展。請問，中共與美國建交對「美、中、臺」三地造成何種影響？
  options:
  - label: A
    content: 美國宣布終止《臺灣關係法》
  - label: B
    content: 兩岸進入政治對峙期
  - label: C
    content: 我國改採和平統戰策略
  - label: D
    content: 中共放棄統一臺灣
- id: doc_112_台北_仁愛_社會_歷史_g7s2e3_s2_8
  section: 2
  number: 8
  type: single
  page: 1
  stem: 回顧過去數十年的兩岸關係，我國政府曾提出「三不政策」以回應中共的統戰政策。請問，「三不政策」不包含何者？
  options:
  - label: A
    content: 不回應
  - label: B
    content: 不談判
  - label: C
    content: 不妥協
  - label: D
    content: 不接觸
- id: doc_112_台北_仁愛_社會_歷史_g7s2e3_s2_9
  section: 2
  number: 9
  type: single
  page: 1
  stem: 「某時期」，中華民國政府基於人道考量，開放民眾赴大陸探親。由於兩岸分隔日久，許多外省人前往登記，申請相當踴躍。請問，「某時期」為何？
  options:
  - label: A
    content: 李登輝繼任總統後
  - label: B
    content: 政府宣布解嚴後
  - label: C
    content: 我國首次總統直選後
  - label: D
    content: 大學生發起野百合學運後
- id: doc_112_台北_仁愛_社會_歷史_g7s2e3_s2_10
  section: 2
  number: 10
  type: single
  page: 1
  stem: 在我國的行政規劃中，與中國有關事務由哪一單位專責處理？
  options:
  - label: A
    content: 外交部
  - label: B
    content: 內政部
  - label: C
    content: 大陸委員會
  - label: D
    content: 國家發展委員會
- id: doc_112_台北_仁愛_社會_歷史_g7s2e3_s2_11
  section: 2
  number: 11
  type: single
  page: 1
  stem: 民國四十年代，兩岸軍事衝突不斷，八二三炮戰是此一期間裡相當重要的戰役。請問，八二三炮戰有何重要性？
  options:
  - label: A
    content: 炮戰橫跨政治對峙與兩岸交流兩個時期
  - label: B
    content: 炮戰結束後，兩岸不再有大規模軍事衝突
  - label: C
    content: 美國因八二三炮戰而派遣第七艦隊協防臺海
  - label: D
    content: 八二三炮戰後，我國透過陸委會向中共抗議
- id: doc_112_台北_仁愛_社會_歷史_g7s2e3_s2_12
  section: 2
  number: 12
  type: single
  page: 1
  stem: 民國82 年，辜汪會談於新加坡舉行，此會談引起兩岸人民的關注，許多新聞媒體全程跟播此會談。請問，有關「辜汪會談」的敘述何者正確？
  options:
  - label: A
    content: 辜汪會談後開始民間交流期
  - label: B
    content: 此會談是兩岸官方的交流
  - label: C
    content: 這是兩岸分治後的首次會晤
  - label: D
    content: 我國的代表是海協會會長汪道涵
- id: doc_112_台北_仁愛_社會_歷史_g7s2e3_s2_13
  section: 2
  number: 13
  type: single
  page: 2
  stem: 兩岸關係受世界局勢、區域競合等因素影響，有關兩岸關係史上的「一國兩制」方案，下列敘述何者有誤？
  options:
  - label: A
    content: 所謂「一國」是指中華民國
  - label: B
    content: 一國兩制方案實施於香港與澳門
  - label: C
    content: 中共於政治對峙期提出此構想
  - label: D
    content: 若接受此制，臺灣與大陸地區可採不同政治制度
- id: doc_112_台北_仁愛_社會_歷史_g7s2e3_s2_14
  section: 2
  number: 14
  type: single
  page: 2
  stem: 二戰後，朝鮮半島分裂成民主與共產兩個韓國，此二國的關係牽動整個東亞局勢的發展。有關韓戰，下列敘述何者正確？
  options:
  - label: A
    content: 韓戰爆發是因為北韓入侵南韓
  - label: B
    content: 美軍與聯合國聯手援助南韓作戰
  - label: C
    content: 中華人民共和國曾出兵支援北韓
  - label: D
    content: 以上皆是
- id: doc_112_台北_仁愛_社會_歷史_g7s2e3_s2_15
  section: 2
  number: 15
  type: single
  page: 2
  stem: 《中美共同防禦條約》曾是我國與美國友好關係的見證，此約簽訂、廢止於何時？
  options:
  - label: A
    content: 開始於「鞏固外交期」，結束於「務實外交期」
  - label: B
    content: 開始於「彈性外交期」，結束於「務實外交期」
  - label: C
    content: 開始於「務實外交期」，結束於「鞏固外交期」
  - label: D
    content: 開始於「鞏固外交期」，結束於「彈性外交期」
- id: doc_112_台北_仁愛_社會_歷史_g7s2e3_s2_16
  section: 2
  number: 16
  type: single
  page: 2
  stem: '表(一)

    | | 中華民國邦交國 | 中華人民共和國邦交國 |

    | --- | --- | --- |

    | 民國40 年 | 37 個 | 19 個 |

    | 民國50 年 | 54 個 | 38 個 |

    | 民國60 年 | 55 個 | 65 個 |

    | 民國67 年 | 22 個 | 116 個 |

    | 民國111 年 | 14 個 | 181 個 |

    上表(表一)是中華民國與中華人民共和國邦交國數量的變化比較表。我國的邦交國自某一時期開始明顯減少，造成此結果的關鍵因素為何？'
  options:
  - label: A
    content: 我國退出聯合國
  - label: B
    content: 我國與美國斷交
  - label: C
    content: 我國宣布解嚴
  - label: D
    content: 我國與中共開始小三通交流
- id: doc_112_台北_仁愛_社會_歷史_g7s2e3_s2_17
  section: 2
  number: 17
  type: single
  page: 2
  stem: 村里的張爺爺回憶起往事，臺灣在某一時期與美國關係緊密，美國政府派了不少技術人員來臺，進到各領域服務。更重要的是，美國政府提供臺灣很多麵粉，在那個物資短缺的年代，養活了很多人。請問，上述情形發生於哪一戰爭期間？
  options:
  - label: A
    content: 國共內戰
  - label: B
    content: 韓戰
  - label: C
    content: 第二次世界大戰
  - label: D
    content: 越戰
- id: doc_112_台北_仁愛_社會_歷史_g7s2e3_s2_18
  section: 2
  number: 18
  type: single
  page: 2
  stem: 中華民國與美國斷交後，部分美國議員不滿美國政府的決策，因而在民國六十年代制訂了哪一法律，與臺灣維持非官方的往來？
  options:
  - label: A
    content: 《臺灣觀光法》
  - label: B
    content: 《臺灣政策法》
  - label: C
    content: 《臺灣協防法》
  - label: D
    content: 《臺灣關係法》
- id: doc_112_台北_仁愛_社會_歷史_g7s2e3_s2_19
  section: 2
  number: 19
  type: single
  page: 2
  stem: 民國77 年，蔣經國總統逝世、李登輝繼任，李登輝就任後在政策上作出了若干調整。請問，以下哪項是李登輝任內的作為或施政方針？
  options:
  - label: A
    content: 與大陸地區開啟大三通交流
  - label: B
    content: 提出「三不政策」抗拒中共的統戰
  - label: C
    content: 強調兩岸是對等的政治實體
  - label: D
    content: 積極增兵以「反攻大陸」
- id: doc_112_台北_仁愛_社會_歷史_g7s2e3_s2_20
  section: 2
  number: 20
  type: single
  page: 2
  stem: 民國九十年代以後，兩岸的民間貿易與文化交流的趨頻繁，我國政府開放數個離島作為「小三通」的交流地。以下何者不在雙方政府劃定的「小三通地區」？
  options:
  - label: A
    content: 金門
  - label: B
    content: 小琉球
  - label: C
    content: 馬祖
  - label: D
    content: 澎湖
- id: doc_112_台北_仁愛_社會_歷史_g7s2e3_s2_21
  section: 2
  number: 21
  type: single
  page: 2
  stem: 在某一政策中，政府以公營事業的股票交換地主手中的土地，再將土地轉售給實際耕種者。透過此法，讓原本的地主轉往工商業發展，而原本的佃農則能獲得土地來耕種。請問，以上描述是哪一土地改革？
  options:
  - label: A
    content: 三七五減租
  - label: B
    content: 公地放領
  - label: C
    content: 耕者有其田
  - label: D
    content: 出口導向
- id: doc_112_台北_仁愛_社會_歷史_g7s2e3_s2_22
  section: 2
  number: 22
  type: single
  page: 2
  stem: 在某一戰爭中，臺灣遭到轟炸，導致許多工業設施毀損，並間接造成物資缺乏與物價飛漲的情形。請問，上述所謂「遭到轟炸」應該如何解釋？
  options:
  - label: A
    content: 臺灣在二戰末期遭到美軍轟炸
  - label: B
    content: 此情形發展在韓戰期間
  - label: C
    content: 國共內戰後共軍曾砲擊臺灣
  - label: D
    content: 日軍撤出臺灣前將基礎設施炸毀
- id: doc_112_台北_仁愛_社會_歷史_g7s2e3_s2_23
  section: 2
  number: 23
  type: single
  page: 2
  stem: 中共為統戰臺灣，曾提出「三通四流」的構想，何者不在「三通」的規劃裡？
  options:
  - label: A
    content: 通郵
  - label: B
    content: 通訊
  - label: C
    content: 通商
  - label: D
    content: 通航
- id: doc_112_台北_仁愛_社會_歷史_g7s2e3_s2_24
  section: 2
  number: 24
  type: single
  page: 2
  stem: 過去某一時期，中東地區發生戰爭，導致全球石油短缺，各類生活用品也都因運輸成本提高而調漲一波。物價上漲、金融前景不佳等因素導致全球各地經濟不振，這股浪潮亦影響臺灣，當時政府提出哪一作為以引應？
  options:
  - label: A
    content: 進口替代
  - label: B
    content: 出口導向
  - label: C
    content: 十大建設
  - label: D
    content: 產業轉型
- id: doc_112_台北_仁愛_社會_歷史_g7s2e3_s2_25
  section: 2
  number: 25
  type: single
  page: 2
  stem: 近年來，較之民國四十至五十年代，兩岸關係已和緩許多，但中共對臺仍是文攻武嚇，在國際社會壓迫我國。請問，我國以何種外交作為反制中共的打壓？
  options:
  - label: A
    content: 鞏固外交
  - label: B
    content: 金援外交
  - label: C
    content: 彈性外交
  - label: D
    content: 務實外交
- id: doc_112_台北_仁愛_社會_歷史_g7s2e3_s2_26
  section: 2
  number: 26
  type: single
  page: 2
  stem: 十大建設使我國擺脫經濟不振的陰霾，這些基礎建設更創造了許多就業機會，使臺灣有傲人的經濟成長，躋身亞洲四小龍的行列。請問，以下何者並非亞洲四小龍？
  options:
  - label: A
    content: 臺灣
  - label: B
    content: 越南
  - label: C
    content: 南韓
  - label: D
    content: 新加坡
- id: doc_112_台北_仁愛_社會_歷史_g7s2e3_s2_27
  section: 2
  number: 27
  type: single
  page: 3
  stem: APEC 全稱為「亞太經濟合作會議」，成員涵蓋了亞洲及太平洋地區的國家，該組織的貿易額佔世界貿易總額的將近一半。請問，我國於哪一時期加入APEC？
  options:
  - label: A
    content: 民國五十年代
  - label: B
    content: 民國六十年代
  - label: C
    content: 民國七十年代
  - label: D
    content: 民國八十年代
- id: doc_112_台北_仁愛_社會_歷史_g7s2e3_s2_28
  section: 2
  number: 28
  type: single
  page: 3
  stem: 近日，核電廠延役的議題延燒，臺灣人民開始反思核電在臺灣史上的重要性及其穩定能源價格等優點。請問，有關核一廠的興建何者正確？
