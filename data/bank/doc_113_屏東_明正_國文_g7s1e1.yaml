- id: doc_113_屏東_明正_國文_g7s1e1_s2_3
  section: 2
  number: 3
  type: single
  page: 3
  stem: 根據文意，篇名中的「碎珠」指的是什麼？
  options:
  - label: A
    content: 零星的成就
  - label: B
    content: 瑣碎的時間
  - label: C
    content: 難忘的時光
  - label: D
    content: 生活中的美好事物
  group_stem: '胡適先生曾以「不做無益事，一日當三日，人活五十歲，我活百五十」的生活哲學來自勉。

    有一個發人深省的比喻：在一個空無一物的箱子裡，我們最初可以放進一些大石頭，等到再也放不進大石頭時，餘下的空隙，我們可放進不少小石頭；當小石頭已放滿時，還可容納許多細沙；等到細沙也把箱子裡所有的空間都填滿了，我們仍可再注入不少清水……

    如果我們每天二十四小時，就是這大口箱，而我們吃飯、睡覺、洗澡、上學的時間，就相當於箱裡大大小小的石頭，那麼，仍有不少零碎、分散的空隙，可供我們完成許多事物。能不能掌握、利用它們，讓每天的生活更加充實，就全靠我們自己了。

    積沙能夠成塔，集腋可以成裘；零碎的時間，應該是生命中的碎珠，能勤於撿拾，並集合它們，那的確是一宗可觀的財富！（改寫自陳幸蕙 生命中的碎珠）'
  lesson_raw:
    title: 生命中的碎珠
    basis: 改寫自陳幸蕙〈生命中的碎珠〉
