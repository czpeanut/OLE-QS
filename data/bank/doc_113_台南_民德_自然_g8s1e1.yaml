  stem: 小林想利用天平測量錐形瓶裡水的質量，請問下列操作步驟中，何者錯誤？
  options:
  - label: A
    content: 使用前先調整校準螺絲， 使天平兩邊保持水平
  - label: B
    content: 當達成水平平衡時，將錐形瓶與砝碼互換位置，天平不會平衡
  - label: C
    content: 當指針左右擺幅相同時，代表兩盤上的質量相等
  - label: D
    content: 夾取砝碼時，應由大到小依序取用。
