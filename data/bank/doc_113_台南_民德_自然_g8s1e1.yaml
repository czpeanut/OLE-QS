    content: 狀況一為瓶蓋打開時，外部空氣進入，造成氣體溶解度下降
  - label: C
    content: 狀況二為汽水進入體內，溫度升高，造成氣體溶解度下降
  - label: D
    content: 狀況二為汽水進入體內，溫度升高，造成氣體從汽水中釋出。
