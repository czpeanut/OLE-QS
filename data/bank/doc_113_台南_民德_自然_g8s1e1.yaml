- id: doc_113_台南_民德_自然_g8s1e1_s2_7
  section: 2
  number: 7
  type: single
  page: 1
  stem: 如圖所示，地球地表附近乾燥空氣的組成由甲、乙、丙和丁代表。關於這四個組成成分的說明，下列何者正確？
  options:
  - label: A
    content: 甲：常填充於食品包裝，降低食物變質的機會
  - label: B
    content: 乙：將此氣體加壓溶解到糖水中，可成為汽水
  - label: C
    content: 丙：化學性質非常活潑，易與其他物質結合產生變化，因此含量比較少
  - label: D
    content: 丁：為有毒氣體。
  assets:
  - key: s2_7_f1
    kind: figure
    file: doc_113_台南_民德_自然_g8s1e1/s2_7_f1.png
