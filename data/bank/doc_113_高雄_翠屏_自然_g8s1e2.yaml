- id: doc_113_高雄_翠屏_自然_g8s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 有關波動的敘述，何者錯誤？
  options:
  - label: A
    content: 物質受到擾動，產生能量向外傳播的現象，稱為波動
  - label: B
    content: 波傳播時只傳送能量，物質本身不會傳送
  - label: C
    content: 造成物質擾動的來源，稱為波源或振源，傳遞波動的物質稱為介質
  - label: D
    content: 光波、無線電波、微波是屬於力學波
  tags:
    chapter:
      publisher: 南一
      book: 八上
      subject: 理化
      code: 3-1
      title: 波的傳播與特性
      chapter: 第3章 波動與聲音的世界
    textbook: 八上理化 3-1 波的傳播與特性
    labeled_by: ai
- id: doc_113_高雄_翠屏_自然_g8s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 有關聲音的敘述何者正確？
  options:
  - label: A
    content: 聲波的前進方向和空氣振動方向平行，所以聲波是一種橫波。
  - label: B
    content: 聲音在不同介質下的傳播速度：氣體＞液體＞固體，且在真空中最快
  - label: C
    content: 空氣溼度愈大，聲速愈快；空氣溫度愈高，聲速愈快
  - label: D
    content: 聲音撞到障礙物反射回來的聲音稱為回聲，在相同介質及狀態下，回聲的聲速會比原聲慢，但頻率不變
  tags:
