- id: doc_113_高雄_翠屏_自然_g8s1e2_s1_49
  section: 1
  number: 49
  type: single
  page: 9
  stem: 依照彩虹產生的原理，在什麼情況下不能看到完整的彩虹呢？
  options:
  - label: A
    content: 當陽光、人與彩虹的連線沒有被物體遮蔽時
  - label: B
    content: 身處在高山懸崖或空中，太陽從高角度照射
  - label: C
    content: 時間在早晨或午後
  - label: D
    content: 陽光角度大(例如正午陽光直射)
  group_stem: "【題組】下過雨的晴朗早晨或午後，常有機會看到天邊掛著一道彩虹，你看到的彩虹有幾種顏色呢？這些顏色從內圈到外圈的排列順序為何？彩虹是怎麼產生的？彩虹的位置跟太陽有什麼關係呢？\n\
    \n  下雨過後，大氣中充滿無數的小水滴，當陽光照射到這些小水滴時，會在水滴內產生折射與反射等作用。陽光照射進小水滴的射入光線與射出光線夾角在40°～42°時反射強度最大，因此一般在平地時，觀察者約可在地面上仰角42°左右觀察到彩虹的形成，這是陽光在水滴內經過一次反射及兩次折射的結果。另外，由於不同色光對水滴的折射率不同，使得紫色光偏折的角度最大，紅色光偏折的角度最小，所以彩虹的色彩排列是內紫外紅。\n\
    \n  彩虹的形成除了與光線及水滴有關之外，能不能「觀察到」彩虹取決於觀察者的位置。陽光必須由觀察者的後方以低角度照射，才有機會觀察到彩虹；如果陽光的角度太大（如正午直射），則大部分的彩虹將落於地平面以下而無法被我們觀察到，因此我們看到彩虹的時間多半在早晨或午後。完整的彩虹為正圓形，觀察者必須在高空才有機會看到，在地面上由於受到地形與角度的關係，所以我們見到的彩虹是弧形的。\n\
    \  自然環境中，彩虹也可在瀑布附近看到。透過人為操作，例如：朝空中灑水，或者在大面積的黑色布幕或牆上黏滿細碎的石英砂後，用強白光直接照射，也可以產生彩虹。"
