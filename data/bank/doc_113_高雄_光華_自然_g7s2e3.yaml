  group_stem: "續篇-自給自足生活篇：請根據以下內容，回答下列第6~24 題：\n    話說~被趕上山後的還針及幫手必必跟汐汐，三人看到整片的針葉林及天空飛的大冠鷲後，當下茫然不知如何是好…但為了生存進到林裡尋找白果、過貓及蕈類等食物、之後開始挖池塘養吳郭魚及種筊白筍、下田種高麗菜..過著結廬在溪邊，不聞車馬聲；雖然生活清苦，每天看著日出日落，森林裡的物種組成也隨著時間而有所改變，但生活也還是愜意的；可惜又好景不長，因高麗菜在種植須施灑營養鹽肥料，以至於一段時間後池塘、河川出現優養化情形，迫使還針三人離開森林，沿著河流到河口尋找食源。\n\
    \    來到河口的還針等三人，首先入眼的是眾多水鳥，例如：腳趾為黃綠色的小白鷺（Egretta garzetta）、腳趾為黑色的\n大白鷺（Ardea alba）…及紅褐色枝幹的紅樹林、招潮蟹、彈塗魚……但為了更多食物選擇，還針三人來到海邊，首先汐汐在潮間帶撿螺、方蟹；必必則潛水於珊瑚礁，採集著昆布等食物；還針則看向海面上感覺似乎有甚麼..仔細一看原來是利用蚯蚓在垂釣的水果王…而還針和水果王在朝夕相處下，相戀了，懷寶寶了，但好景又總是不長，水果王出門捕抓大王具足蟲時，卻失蹤了…"
