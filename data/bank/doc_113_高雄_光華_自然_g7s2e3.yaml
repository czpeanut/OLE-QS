    | 目名 | 科名 | 俗名 | 學名 |

    | :--- | :--- | :--- | :--- |

    | 鵜形目 | 鷺科 | 大白鷺 | Ardea alba |

    | 鵜形目 | 鷺科 | 中白鷺 | Egretta intermedia |

    | 鵜形目 | 鷺科 | 小白鷺 | Egretta garzetta |

