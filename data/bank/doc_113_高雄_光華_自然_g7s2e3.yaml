- id: doc_113_高雄_光華_自然_g7s2e3_s2_47
  section: 2
  number: 47
  type: single
  page: 5
  stem: 珊瑚與水螅的關係，與海星和下列何者的關係相同？
  options:
  - label: A
    content: 海膽
  - label: B
    content: 章魚
  - label: C
    content: 水母
  - label: D
    content: 水蛭。
  group_stem: "【光華閱讀日】第六日，澳大利亞的天然奇景『大堡礁』是由何種生物所組成？\n   『大堡礁』是由數十億隻微小的珊瑚蟲所建構成的，是生物所建造的最大物體，就算從外太空也能看到。因其造就了豐富的生物多樣性，在1981\
    \ 年被列入世界自然遺產名錄，也曾被CNN 選為世界七大自然奇觀。『大堡礁』大部份區域都在大堡礁海洋公園的保護之下，但從1985 年以來，氣候變化、污染、棘冠海星和漁業、海運事故、油外洩和熱帶氣旋等危害因素損失了超過一半的珊瑚礁；一份2016\
    \ 年三月的報告顯示，因為海洋暖化引發第三次全球白化事件，珊瑚白化是氣候變暖引發海水溫度上升，導致珊瑚及體內的共生藻死亡，僅剩下透明的珊瑚蟲或白色骨胳的現象。此可知，氣候變遷造成水溫的上升及海水深度的變化都對珊瑚的生長造成相當大的影響。\n\
    \    除了珊瑚礁受到影響，逐年升高的溫度也會使這些爬蟲類公母比例改變，造成性別比例失衡；另外南極洲的皇帝企鵝估計到 2100 年的時候會減少目前 20%的數量。一項刊登在期刊《科學》(Science)的研究指出，如果再不著手對付氣候變遷，世界上有六分之一的物種就會遭到滅絕，而最容易滅絕的就是南美洲、澳洲和紐西蘭的動植物。\n\
    \   氣候變遷的成因較複雜，但人類行為模式難辭其咎，例如：大量地燃燒化石燃料，如煤炭和石油，造成大氣中的二氧化碳濃度增加，加上大幅度開墾林地、拓展農業和工業發展，改變了自然的溫室現象，致使溫室氣體濃度越來越高；除此之外，降水模式改變和亞熱帶地區的沙漠化，助長極端天氣包括熱浪、乾旱、森林大火、暴雨、水患、暴雪等…但不僅是氣候模式受影響，更衝擊對環境極為敏感的生態，甚至引起大規模物種滅絕，植物死亡進而造成糧食危機等問題，若收成與供給不再穩定，將對於全球經濟造成動盪，更可能引發爭奪資源的政治。\n\
    \     在2013 年，以全球1,300 位獨立科學專家組成的聯合國政府間氣候變遷專門委員會（IPCC），在第五次評估報告表示：「有超過95%的機率顯示，人類行為是過去50\
    \ 年來造成暖化現象的主要原因。」大氣中的二氧化碳濃度已達六十五萬年來最高，2010-2019 年是成為有紀錄以來最熱的十年。而要控制全球升溫，首先必須降低二氧化碳的排放。2015\
    \ 年聯合國終於通過《巴黎氣候協議》（The Paris Agreement），各國首次同意「本世紀末以前，必須控制地球升溫於攝氏 2 度以內」，並且各國每五年必須檢討「國家自定減碳貢獻」（Nationally\
    \ Determined Contributions，NDCs）。隨後IPCC 在 2018 年時，發布新的研究報告，建議各國必須以 1990 年平均溫度為參考基準，更進一步將地球升溫控制在攝氏\
    \ 1.5 度之內，更指出2030 年的碳排放必須減少 45%，2050 年達到淨零碳排（碳中和），這是防止氣候變遷帶來嚴重災難的唯一方法。\n    既然人類的行為對環境與氣候造成巨大影響，也表示只要改變人類的決策和運作模式，就有機會扭轉危機，所以由現在開始由你、我開始吧！！"
  tags:
