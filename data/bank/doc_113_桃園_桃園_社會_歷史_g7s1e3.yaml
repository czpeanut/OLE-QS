  section: 1
  number: 4
  type: single
  page: 1
  stem: 阿土哥是清康熙時期的泉州人，聽人家說臺灣未開發的土地廣大、工作機會多，決定到臺灣打拚。他來到臺灣，可能有怎樣的遭遇？
