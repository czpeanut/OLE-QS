- id: doc_113_桃園_桃園_社會_歷史_g7s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: '以下是《安平縣雜記》中的記載:「番原無姓氏。至清乾隆招撫歸化，當時政府委用係潘、金、劉三姓之官，入山招撫，凡在其時，就撫之社，生番出山化熟者，如是潘官所招，一概隨同姓潘⋯⋯⋯⋯⋯。」

    上述政策的實施，主要是為了達到清帝國統治的哪項目的？'
  options:
  - label: A
    content: 開闢北中南三條路，進後山招撫原住民
  - label: B
    content: 以漢人文化同化原住民，使之歸順清帝國
  - label: C
