- id: doc_113_屏東_中正_國文_g7s2e2_s5_9
  section: 5
  number: 9
  type: single
  page: 6
  stem: 根據本文，下列與劉邦有關的說明，何者正確？
  options:
  - label: A
    content: 項羽因為不孝，所以冥冥中注定要被劉邦擊敗
  - label: B
    content: 劉邦將碎紙拋向天空，感謝老天協助他找到雙親的墳墓
  - label: C
    content: 由於連年的戰火，劉邦回鄉後找不到父母的墳墓
  - label: D
    content: 現代人掃墓時，在墳上用小土塊壓幾張紙片，表示對劉邦的感謝。
  group_stem: "清明掃墓，放風箏打陀螺 殷登國 \n    入春以後，天氣晴朗時，只要有風就可以放風箏。清明這天，兒童尤其喜歡帶著風箏隨父母上墳掃墓時放著\n\
    玩兒。兒童羨慕鳥兒在天空自由翱翔，自己沒翅膀不能飛，只好放風箏來滿足想飛的欲望。 \n  春暖花開時節，街上已有賣風箏的小販了，但兒童也可以自己動手做，只要一些竹篾片、彩紙、細繩、漿糊\n\
    和一捆長繩，就可以做一個屬於自己的風箏了。風箏可以做成菱形，也可以糊成燕子、仙女、蝴蝶、蜈蚣等形狀，\n只要左右重量相等，拖一個幾條長紙條黏成的長尾巴（用來平衡風箏，增加穩定性），多半可以飛上天。\
    \ \n  每逢清明時節，人們不僅白天放，夜間也放。夜裡在風箏下或風箏的拉線掛上一串串彩色小燈籠，像閃爍的\n明星，被稱為「神燈」。過了清明節，風向不定，不適合放風箏，陰雨的天氣也會把風箏打溼打壞，再加上農忙、\n\
    上學，所以習慣上風箏都只放到清明這天為止，清明過後就不放風箏了。蘇州謠諺說：「正月鷂，二月鷂，三月\n放個斷線鷂。」鷂就是風箏，說兒童在正月、二月玩風箏，玩到三月初三清明節，就把風箏線割斷，任風箏遠走\n\
    高飛，稱「放斷鷂」，含有把自己的壞運隨風箏一起送走的意味。江南多水鄉，人家往往坐船去上墳，兒童坐在\n船頭放風箏，快過橋時，得預先收線，免得橋把風箏線拉斷了，又是另一種放風箏的情趣。\
    \ \n  清明節前後，兒童還玩抽陀螺、抖空鐘的遊戲。陀螺的前身是捻轉，宋人又稱為「千千」、「妝域」或「撚篆\n子」，它是用象牙製成四寸直徑的圓盤，盤中有小孔，孔內插一根寸長的鐵針，用手捻鐵針，圓盤就會轉個不停，\n\
    玩法與今日大同小異。空鐘也叫「空箏」、「扯鈴」，它是兩個封死的竹盤，用一根中間微凹的木軸從圓心連接起\n來，有點像車軸和兩輪，玩時用兩根短木棍兒頂端繫一根細長繩，把繩子繞在空鐘軸上，再抖動木棍，使空鐘旋\n\
    轉飛滾。 \n  說到清明節的由來，就不得不提劉邦。相傳秦朝末年，漢高祖 劉邦經過千辛萬苦擊敗西楚霸王 項羽後，終\n於取得天下。當他榮歸故里，想要到父母親的墳墓上去祭拜，卻因為連年的戰爭，使得一座座的墳墓上長滿雜草，\n\
    墓碑東倒西歪，有的斷落，有的破裂，而無法辨認碑上的文字。 \n  劉邦很難過，雖然手下幫他找遍所有的墓碑，可是一直到黃昏還是找不到父母的墳墓。最後，劉邦從衣袖裡\n\
    拿出一張紙，撕成許多小碎片，緊緊捏在手上，然後向上蒼禱告說：「爺娘在天有靈，現在風颳得這麼大，我將\n把這些小紙片，拋向空中，如果紙片落在一個地方，風都吹不動，就是爺娘的墳墓。」說完，劉邦把紙片向空中\n\
    拋，果然有一片紙片落在一座墳墓上，不論風怎麼吹都吹不動，劉邦跑過去仔細瞧一瞧模糊的墓碑，果然看到他\n父母的名字刻在上面。 \n  劉邦高興得不得了，馬上請人重新整修父母親的墓，從此之後，每年的清明節一定到父母的墳上祭拜。後來\n\
    民間的百姓，也和劉邦一樣，每年的清明節都到祖先的墳墓祭拜，並且用小土塊壓幾張紙片在墳上，表示這座墳\n墓是有人祭掃的。 \n（改寫自《中國人的一生》世界文物出版社）"
