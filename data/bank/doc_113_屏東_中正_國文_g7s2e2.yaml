  stem: 根據本文第三段，下列敘述何者正確？
  options:
  - label: A
    content: 「放斷鷂」可以送走霉運，逐漸成為一種習俗
  - label: B
    content: 除了白天放風箏，清明時節晚上還可以放天燈
  - label: C
    content: 清明當天全家歡樂出門，每個人都充滿喜悅的心情
  - label: D
