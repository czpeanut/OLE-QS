- id: doc_113_屏東_中正_國文_g7s2e2_s5_1
  section: 5
  number: 1
  type: single
  page: 4
  stem: 下列詩句，何者最能看出屈原忠貞風骨？
  options:
  - label: A
    content: 太史公為你的投水太息，/怪你為什麼不遊宦他國？
  - label: B
    content: 但丁荷馬和魏吉的史詩，/怎撼動你那悲壯的楚辭？
  - label: C
    content: 子蘭的衣冠已化作塵土，/鄭袖的舞袖在何處飄舞？
  - label: D
    content: 可愛的三閭大夫！/灘灘的龍船在為你競渡！
  group_stem: "淡水河邊弔屈原       余光中 \n青史上你留下一片潔白，/朝朝暮暮你行吟在楚澤。 \n江魚吞食了二千多年，/吞不下你的一根傲骨！\
    \ \n \n太史公為你的投水太息①，/怪你為什麼不遊宦他國？ \n他怎知你若是做了張儀②，/你不過流為先秦一說客！ \n                \n\
    但丁③荷馬④和魏吉⑤的史詩，/怎撼動你那悲壯的楚辭⑥？ \n你的死就是你的不死：/你一直活到千秋萬世！ \n \n悲苦時高歌一節離騷，/千古的志士淚湧如潮；\
    \ \n那淺淺的一灣汨羅江水，/灌溉著天下詩人的驕傲！ \n \n子蘭⑦的衣冠已化作塵土，/鄭袖⑧的舞袖在何處飄舞？ \n聽！/急鼓！可愛的三閭大夫⑨！/灘灘的龍船在為你競渡！\
    \ \n                       \n我遙立在春晚的淡水河上，/我彷彿嗅到湘草的芬芳； \n我悵然俯吻那悠悠的碧水，/它依稀流著楚澤的寒涼。\
