  group_stem: "空軍一名上尉曾到高雄市某間有女陪侍的酒吧玩樂，部隊發現後認為上尉出入「不正當場所」記大過1 次，原本上尉想要續簽，結果卻因大過被駁回，服役期滿後只能離開部隊，他氣得打行政訴訟爭權益，高雄高等行政法院法官認為部隊審議合理，駁回他請求。\n\
    \  判決指出，這名上尉在基地擔任勤務官，2012 年8 月24 日晚間，他跟好友到高雄市區一家有女陪侍的酒吧玩樂，沒多久消息傳回部隊，空軍最後以違反規定等理由，記上尉1\
    \ 大過處分。\n  同年9 月，上尉想要續簽申請志願留營，年底留營人事評議審查會發現上尉曾因出入不正當場所被記1 大過，因不符合留營資格，決議不予留營，複審也沒過關，形同無法繼續在部隊服務。\n\
    \  上尉不服聲請☆☆也被駁回，氣得打行政訴訟爭取權益，他主張甄選規則應可採評分或量表方式進行，一律評定為不符合留營或入營資格；且依據該規則，若他離營前1\
    \ 至3 年被記過，未來5 年、10 後再申請入營，都會被剝奪從軍權益，明顯違反比例原則。\n  空軍挨告後則反駁，稱為確保國軍幹部素質，應享有高度的「評價特權」，上尉的留營條件不符合國軍人事運用規定，且他確實有出入不正當場所，綜合考量任務需求、思想、品德及工作績效等面向，裁量並無濫用之虞。\n\
    \  法官認為，上尉因出入不正當場所被記一大過，對於懲處他也曾提起行政訴訟，最終被最高行政法院裁定駁回確定，空軍依甄選規則、人事運用規定審議上尉留營規定，並未超過比例原則，判決駁回上尉請求。\n\
    ~摘改自《空軍上尉上酒吧被記1 大過 想續簽卡關...鐵飯碗飛了》"
