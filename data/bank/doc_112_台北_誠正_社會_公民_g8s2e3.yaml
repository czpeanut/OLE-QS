- id: doc_112_台北_誠正_社會_公民_g8s2e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 妘溱正在整理少年保護事件的適用對象與處理流程，請問下列何者正確？
  options:
  - label: A
    content: 年滿12 歲，未滿18 歲，經檢察官調查後得減輕其刑
  - label: B
    content: 年滿14 歲，未滿18 歲且犯罪情節重大，經少年法庭審理後處保護處分
  - label: C
    content: 年滿12 歲，未滿14 歲而犯罪情節重大者，經檢察官調查後由少年法庭處以保護處分
  - label: D
    content: 未滿18 歲而犯罪情節輕微者，經少年法庭調查後處以保護處分。
  tags:
