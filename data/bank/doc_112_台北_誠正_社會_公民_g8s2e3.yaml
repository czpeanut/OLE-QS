    labeled_by: ai
- id: doc_112_台北_誠正_社會_公民_g8s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 上課時，老師請同學針對「行政救濟的管道與流程」發表報告，請問下列同學的報告何者正確？
  options:
  - label: A
    content: 韋中：訴願的目的在要求撤銷或更改原處分
  - label: B
    content: 秉翰：訴願管轄機關為行政法院
  - label: C
    content: 君豪：任何法院皆可受理人民提出的行政訴訟案
  - label: D
    content: 暐智：行政救濟的管道包含調解，但不可和解。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 公民
      code: 5-3
      title: 行政救濟的方法
      chapter: 第5章 行政法規與行政救濟
