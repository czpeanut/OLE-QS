- id: doc_112_台北_誠正_社會_公民_g8s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 儘管「博愛座」的概念已宣導多年，但仍不時有因為「讓座」而產生衝突的新聞。對此，捷運局無奈表示，任何民眾坐博愛座其實「無法可罰」，就算捷運警察到場，也僅能柔性勸導讓坐。依上述的內容，下列敘述何者正確？
  options:
  - label: A
    content: 政府執政須依法行政
  - label: B
    content: 法律不可限制人民的行為
  - label: C
    content: 警察的勸導屬於行政處分
  - label: D
    content: 道德的強制力高於法律
  tags:
