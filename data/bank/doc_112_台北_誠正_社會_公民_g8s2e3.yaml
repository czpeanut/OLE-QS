- id: doc_112_台北_誠正_社會_公民_g8s2e3_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 我國警政機關為降低青少年誤入歧途的機會，舉辦了主題為「曝險少年」的微電影比賽，希望透過影片的傳播社會大眾的創意，預防青少年的偏差行為。請問：下列關於影片中的內容，何者不符合主題？
  options:
  - label: A
    content: 柏鈞經常攜帶蝴蝶刀展示、炫耀
  - label: B
    content: 晉宏因為好奇而吸食強力膠
  - label: C
    content: 品皓經常出入網咖、舞廳、撞球間等人流複雜的場所
  - label: D
    content: 辰宇已計畫如何趁同學不注意時偷走同學的手機。
  tags:
