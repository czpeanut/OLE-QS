- id: doc_112_台北_誠正_社會_公民_g8s2e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 柏緯升上高中後適應不良，因此沉溺於交友APP 中，並結交了大學生維晉，兩人互動頻繁並以老公、老婆互稱對方。某日維晉希望柏緯能自拍清涼不雅照以證明柏緯對維晉的真心。針對上述情況，若你是柏緯的朋友，應該給予柏緯怎樣的建議？
  options:
  - label: A
    content: 維晉的行為已經違法，涉及兒少性剝削
  - label: B
    content: 柏緯可依《刑法》聲請核發保護令
  - label: C
    content: 依《民法》契約自由原則，若柏緯自願則他人無法干涉
  - label: D
    content: 維晉違反《少年事件處理法》，將面臨刑事責任。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 公民
      code: 6-1
      title: 保護兒少權益的法律
      chapter: 第6章 兒少權益的維護
    textbook: 八下公民 6-1 保護兒少權益的法律
    labeled_by: ai
- id: doc_112_台北_誠正_社會_公民_g8s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 王先生因近期大環境不佳遭到裁員，在經濟上受到了重大打擊，因此準備去區公所並希望依照《憲法》保障生存權的精神申請中低收入戶補助。但到了區公所，區公所辦公人員告訴他在這種情形下，規範此類適用的法規是《社會救助法》並非《憲法》。請問，其原因應為下列何者？
  options:
  - label: A
    content: 《憲法》具有最高性，僅針對大方向做規範
  - label: B
    content: 此例說明憲法對行政法具體化的重要性
  - label: C
    content: 《憲法》尚待實質修憲才能確實保障人民基本權利
  - label: D
    content: 《社會救助法》的訂立為行政機關依法行政的依據。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 公民
      code: 5-1
      title: 行政法規的內涵
      chapter: 第5章 行政法規與行政救濟
    textbook: 八下公民 5-1 行政法規的內涵
    labeled_by: ai
- id: doc_112_台北_誠正_社會_公民_g8s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: '上公民課前，幾位同前學聚在一起聊上週末的生活發生了什麼事。請問：下列哪一個人的談論的內容和行政法有關？


    | 人物 | 談話內容 |

    | :--- | :--- |

    | 可欣 | 週日早上好倒楣，被機車的照後鏡撞到手臂 |

    | 芩貝 | 我看到我隔壁鄰居偷了超商的運動飲料！ |

    | 芷晴 | 唉！家裡的長輩為了遺產分配爭論不休 |

    | 安云 | 爸爸不熟路況，在巷子逆向行駛被警察抓 |'
  options:
  - label: A
    content: 可欣
  - label: B
    content: 芩貝
  - label: C
    content: 芷晴
  - label: D
    content: 安云。
