- id: doc_112_台北_誠正_社會_公民_g8s2e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 我國為了響應世界對兒童保護的呼籲，並促進兒少身心健全發展，保障兒童及少年的權益與福利，因而制定了《兒童及少年福利與權益保障法》。請問：下列關於本法的敘述何者正確？
  options:
  - label: A
    content: 本法同時保障了童工的權利
  - label: B
    content: 禁止未成年吸菸、喝酒屬於「保護措施」
  - label: C
    content: 本法所指的兒童年齡與無行為能力人的規範相同
  - label: D
    content: 各類出版品及遊戲軟體採分級制度屬「福利措施」。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 公民
      code: 6-1
