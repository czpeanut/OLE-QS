- id: doc_112_台北_誠正_社會_公民_g8s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 還記得新冠肺炎疫情流行期間中央疫情指揮中心訂定的相關規定嗎？在當時指揮中心發布一系列的規範，例如「社交距離注意事項」，要求社會大眾保持社交距離；或者是實名制與口罩配戴的規範，深遠的影響了我們這個世代的生活方式。關於上述的內容，下列何者正確？
  options:
  - label: A
    content: 相關規範屬於法律位階
  - label: B
    content: 違者須負民事責任
  - label: C
    content: 內容不得牴觸憲法和法律
  - label: D
    content: 內容不得限制人民的權利。
  tags:
