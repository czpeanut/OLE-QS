- id: doc_112_台北_誠正_社會_公民_g8s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 為保障我國人民的健康安全，依據《藥師法》第24 條規定未取得藥師資格擅自執行藥師業務者，將被衛生局處新臺幣六萬元以上三十萬元以下罰款。針對上述內容的內容，何者正確？
  options:
  - label: A
    content: 若違反此法將負起刑責
  - label: B
    content: 若不服處分可與主管機關調解
  - label: C
    content: 此法只會對人民產生不利結果
  - label: D
    content: 文中罰款一詞可用罰鍰替代。
