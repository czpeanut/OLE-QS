- id: doc_112_台北_誠正_社會_公民_g8s2e3_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 2020 年時，有三名雜貨販售人士在LINE 上散布謠言指衛生紙的部分原料與口罩相同，在口罩原料轉趨緊繃之際，恐將影響近期衛生紙的出貨。導致一時間，衛生紙成為搶購標的，全台民眾瘋搶囤衛生紙。事後三人因此依《社會秩序維護法》遭裁罰四萬元罰款。依上述，下列相關敘述何者錯誤？
  options:
  - label: A
    content: 文中可知此為觸犯行政法的行為
  - label: B
    content: 該罰款為造成社會動盪的民事損害賠償
  - label: C
    content: 此處罰款也可改為罰金
  - label: D
    content: 散布此謠言的行為屬於犯罪。
  tags:
