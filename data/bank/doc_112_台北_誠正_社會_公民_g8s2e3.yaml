  section: 1
  number: 15
  type: single
  page: 2
  stem: 家馨在寫複習講義時看到關於行政處分的敘述，發現講義裡有錯誤的內容，請問家馨所看到的是下列哪一段內容？
  options:
  - label: A
    content: 行政處分的內容對人民有利也有不利
  - label: B
    content: 行政處分是由行政機關對特定人民直接發生法律效果的行為
  - label: C
    content: 行政處分的內容包含了核發建築執照、學校頒發畢業證書、核發駕照
  - label: D
    content: 罰鍰、吊銷駕照、拘役都是行政處分的範圍。
