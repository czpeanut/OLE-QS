- id: doc_112_台北_誠正_社會_公民_g8s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 近年來因交友軟體與網路短影片炫富行為氾濫，我國警方發現未成年人性交易案的數量正在增加。犯罪集團在交友軟體或影片中釋出「輕鬆賺錢」等訊息，引誘未成年人加入，再利用暴力或毒品對未成年人進行嚴格控制，使未成年人不能也不敢向外界求援。依上述內容，下列敘述何者正確？
  options:
  - label: A
    content: 犯罪集團將負起刑事責任
  - label: B
    content: 文中的未成年將以少年刑事案件處分
  - label: C
    content: 增加的案件以《兒童及少年福利與權益保障法》處理
  - label: D
    content: 未成年人獲救後會送至少年矯正學校學習。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 公民
      code: 6-2
      title: 少年犯罪行為的處理
      chapter: 第6章 兒少權益的維護
    textbook: 八下公民 6-2 少年犯罪行為的處理
    labeled_by: ai
- id: doc_112_台北_誠正_社會_公民_g8s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 據統計，我國約有9％的國中生在一畢業後就進入工地工作，而此比例遠高於16～18 歲的年齡層，代表著此階段的少年求職容易因不諳世事落入高風險職場。關於未成年勞動問題的敘述，下列何者正確？
  options:
  - label: A
    content: 此情況已違反《兒童及少年福利與權益保障法》
  - label: B
    content: 此階段的少年已超過童工的法定年齡
  - label: C
    content: 少年將因從事危險性工作而受罰
  - label: D
    content: 少年的雇主會受行政處分甚至是刑罰制裁。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 公民
