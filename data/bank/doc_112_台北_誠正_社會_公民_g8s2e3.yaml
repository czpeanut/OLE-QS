  group_stem: "空軍一名上尉曾到高雄市某間有女陪侍的酒吧玩樂，部隊發現後認為上尉出入「不正當場所」記大過1 次，原本上尉想要續簽，結果卻因大過被駁回，服役期滿後只能離開部隊，他氣得打行政訴訟爭權益，高雄高等行政法院法官認為部隊審議合理，駁回他請求。\n\
