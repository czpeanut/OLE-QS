- id: doc_112_台北_誠正_社會_公民_g8s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 根據《道路交通管理處罰條例》，大型重機得依交通部公告的路段及時段行駛於國道，但目前卻僅有國道3 號甲線開放行駛。對此，交通部高速公路局表示，因為民調顯示反對意見居多，所以至今仍未全面開放。針對上文內容的敘述，下列何者正確？
  options:
  - label: A
    content: 文中提到的法條屬於命令位階
  - label: B
    content: 重機愛好者可至立法院提訴願要求全面開放
  - label: C
    content: 政府未全面開放是民意政治的展現
  - label: D
    content: 行政法不得限制人民權利。
  tags:
