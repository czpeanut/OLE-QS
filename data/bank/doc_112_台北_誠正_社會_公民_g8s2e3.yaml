- id: doc_112_台北_誠正_社會_公民_g8s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 凱翔在考前為本次段考整理城武老師的上課筆記，但因為凱翔迷糊，內容常常抄寫錯，請問：下列敘述何者有誤需要修正？
  options:
  - label: A
    content: 行政法是指行政權如何行使的法律，並非單一法典的名稱
  - label: B
    content: 行政法具有固定性，修改有相當的難度
  - label: C
    content: 行政處分的內容有可能為人民帶來利益
  - label: D
    content: 行政法能限制政府權力並保障人民權利。
