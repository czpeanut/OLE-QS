- id: doc_112_台北_誠正_社會_公民_g8s2e3_s3_33
  section: 3
  number: 33
  type: single
  page: 3
  stem: 請問依照內文，下列敘述何者正確？
  options:
  - label: A
    content: 文中的修法浪潮是指修正《兒童及少年福利與權益保障法》
  - label: B
    content: 兩人將依少年保護事件處理
  - label: C
    content: 兩人已確定有罪，尚待確認刑期
  - label: D
    content: 兩人之監護人須負連帶賠償責任。
  group_stem: "2023 年12 月引發台灣社會輿論高度關注的新北市土城區校園割喉案，今日有最新進展；經過近5 個月時間，新北地檢署依照「殺人」罪嫌，將行兇的郭姓少年，以及教唆動手的林姓少女提起公訴。\n\
    \  終於起訴！去年12 月25 日，新北市土城區某高中附設國中部，發生駭人聽聞的未成年行兇命案；1 名國中生慘遭另1 名國中生持刀割喉，事件引發社會高度關注，並因此展開了要求修法浪潮，避免「未成年犯罪」因保護過度，反過來變成「犯罪鼓勵法」。\n\
    \  至於行兇的郭姓少年，以及在一旁教唆動手的林姓乾妹，事後滿不在乎的態度更是引發各界不滿。網路紅人「小商人」就在紐約時代廣場刊登看板，把2 人的本名與照片直接「廣告周知」讓許多網友大呼痛快，而實質的司法程序，今日也終於有所進展。\n\
    \  新北地檢署今天證實，已經依照「殺人」罪嫌，將2 名未成年兇手提起公訴，但礙於相關法令，無法再說明更多內容。未來2 人將被移至新北地院少年法庭進行審理，目前2\
    \ 人因為有滅證、串證、逃亡之虞，仍被羈押禁見中；後續審判預估也將引發社會各界高度關注。"
