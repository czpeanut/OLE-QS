  group_stem: '(一)住在高雄的志豪在暑假時環島一周，他在部落格上發表附圖的文章。請回答下列問題：

    第一天一大早頗為晴朗，中午過後卻下起雷陣雨，不久雨就停了……到了屏東東港，便搭船到琉球嶼。第二天到了臺東，北上至花蓮，發現左右兩旁都是山。買了花蓮的特產「麻糬」繼續前進，走在高山跟深海相鄰的路上，真是驚險萬分，當晚住宿宜蘭礁溪的溫泉飯店。第三天到了基隆，此地冬日陰雨綿綿，有「雨港」之稱。第四天到了臺中，逛了逢甲夜市。第五天，回到家時，收看新聞時發現氣象局發布海上颱風警報，颱風過後常引進氣流，帶來災害，還好我已經回家，不然後果真是不堪設想。'
