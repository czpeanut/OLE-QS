  stem: 1990 年土耳其在某河的上游建造西亞最大的水壩-阿塔圖克水壩。該水壩的完工不僅每年可供應大量電能，讓鄰近平原和周邊廣大的土地從原本荒蕪的沙漠，到如今四處可見綠油油的農田。水壩也為土耳其東部帶來大量的就業機會，帶動附近經濟、農業及觀光發展，但築壩攔水的結果導致西亞地區國際局勢緊張，帶來棘手問題。請問：根據上文內容推論，某河指的是下列何者？
  options:
  - label: A
    content: 約旦河
  - label: B
    content: 尼羅河
  - label: C
    content: 幼發拉底河
  - label: D
    content: 底格里斯河。
- id: doc_113_高雄_五福_社會_g8s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 長榮海運巨型貨櫃(身長約400 米)於2021 年3 月23 日意外擱淺蘇伊士運河，造成航道阻塞影響全球交通，埃及政府派出挖土機清除船底淤泥，六天後成功脫困；推估運河受阻時造成的全球貨物貿易損失金額每小時約4
    億美元。請問：關於蘇伊士運河的敘述，下列何者正確？
  options:
  - label: A
    content: 連接地中海和紅海
  - label: B
    content: 橫跨歐洲與大洋洲的交界
  - label: C
    content: 位於埃及西奈半島東側
  - label: D
    content: 建成後使太平洋的海上國家受惠。
- id: doc_113_高雄_五福_社會_g8s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 這個城市被巴勒斯坦人稱為「三教聖城」，對猶太人而言，這裡卻是他們最早的的聖殿，後來羅馬帝國又在這裡建立基督教城市。日後，阿拉伯帝國為了紀念穆罕默德，在這裡建立了兩座清真寺，除了麥加和麥地那之外，阿拉伯人視此地為第三大聖城；為了爭奪聖城，自古以來衝突不斷。請問：文中提到被稱為三教聖城的城市應為下列何者？
  options:
  - label: A
    content: 耶路撒冷
  - label: B
    content: 巴格達
  - label: C
    content: 麥加
  - label: D
    content: 大馬士革。
- id: doc_113_高雄_五福_社會_g8s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 石油輸出國家組織（OPEC）是由伊朗、伊拉克、科威特、沙烏地阿拉伯和委內瑞拉五國，共同對抗由英美主導的跨國石油公司，並維護石油的穩定收入，於1960
    年在伊拉克巴格達成立的跨國組織。該組織的主要目標為：協調成員國的石油政策與價格，以確保石油消費國獲得有效、經濟可靠的石油供應，並為產油國提供穩定的收入。請問：附圖(三)哪一個國家雖然沒有生產石油、也不是該組織的成員國，但因油管通過的關係，仍能從中獲取相對的利益？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
  assets:
  - key: s1_9_f1
    kind: figure
    file: doc_113_高雄_五福_社會_g8s2e2/s1_9_f1.png
- id: doc_113_高雄_五福_社會_g8s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 承上題，2023 年2 月「華盛頓郵報」指出，芮氏規模7.8 強震發生於西亞當地時間6 日清晨4 時17 分，連遠在歐洲區的居民都能感受到地震威力，之後陸續發生40
    多次餘震，包括主震11 分鐘後出現規模6.7 餘震；目前災區已聚集超過2 萬4400 名緊急救難人員，但震災範圍太廣，且有近6000 棟建築物證實已倒塌。請問：圖(三)中哪兩個地區是較容易發生地震的區域？
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 甲丙
  - label: C
    content: 乙丁
  - label: D
    content: 甲丁。
  group_stem: （第 9 題）石油輸出國家組織（OPEC）是由伊朗、伊拉克、科威特、沙烏地阿拉伯和委內瑞拉五國，共同對抗由英美主導的跨國石油公司，並維護石油的穩定收入，於1960
    年在伊拉克巴格達成立的跨國組織。該組織的主要目標為：協調成員國的石油政策與價格，以確保石油消費國獲得有效、經濟可靠的石油供應，並為產油國提供穩定的收入。請問：附圖(三)哪一個國家雖然沒有生產石油、也不是該組織的成員國，但因油管通過的關係，仍能從中獲取相對的利益？
