    \    ……那時長江運兵船是首都保衛戰的命脈之一，從上游漢口最遠只能到下游的蕪湖(安徽省)。……上游下來到蕪湖的增援部隊下船後，空船即裝上中央機關撤退的人員和重要文件（故宮的文物也在內），夜晚開船駛回漢口。為了阻止日軍的陸上攻勢，十二月一日，我軍炸毀蕪湖鐵橋和公路橋樑，後來的船只能到更上游的安慶。……十二月十三日的下午，街上送報童喊著賣「號外」的聲音。舅舅衝下樓買了一張：「南京淪陷，日本軍隊由中華門開入我們的首都，開始放火搶劫，大屠殺。」……1938\
