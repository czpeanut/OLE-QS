  group_stem: '※請閱讀完下列資料後，回答第50 題：

    美國記者斯諾(Edgar Snow)，報導西元1936 年6 月左右，他在中國看到的一齣宣傳短劇：短劇名稱是「侵略」，內容以1930 年代東北某村莊為背景。

    【第一幕】日軍到達，把不抵抗的中國軍隊趕走。

    【第二幕】日本毒販在叫賣嗎啡和海洛因，強迫每一農民買一份。一個青年拒絕，就被叫出來訊問：「你不買嗎啡，你不遵守滿洲國衛生條例，你不愛你的『聖上』溥儀，你是反日的匪徒！」那個青年就馬上給處決了。

    【第三幕】農村集市中，有些小商人在叫賣貨物。兩個日本軍官正在大吃一個小販的豬肉，吃完後小販要他們付錢時，他們奇怪的看著他說：「你要我們付錢？可是蔣中正把滿洲、熱河、察哈爾都給了我們，也沒有要一個銅板！為了一點點肉，你卻要我們付錢！」他們立刻把他當作「匪徒」用刺刀殺死了。

    最後村子裡的人忍無可忍了。商販們把貨攤和遮陽的大傘推倒，農民們拿起長矛，婦女兒童拿起菜刀趕來，大家都發誓要和日本鬼子「血戰到底」。

    資料來源：埃德加．斯諾(Edgar Snow)著，董樂山譯(2002)。西行漫記。臺北：一橋出版社。'
