- id: doc_113_高雄_五福_社會_g8s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 電影《亞歷山大帝》由眾多巨星合演，講述亞歷山大大帝的一生，史詩級的歷史大作，拍攝場景位於北非地中海沿岸的摩洛哥，華麗的皇宮佇立，豐富的自然環境與人文特色，有大海、山區、富饒的平原與阿拉伯人聚集區。請問：電影迷如要到當地尋訪場景，為避免雨天減低遊興，最好選擇下列那幾個月份前往？
  options:
  - label: A
    content: 3-5
  - label: B
    content: 6-8
  - label: C
    content: 9-11
  - label: D
    content: 12-2。
- id: doc_113_高雄_五福_社會_g8s2e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 西亞和北非地區，從古至今都是世界動盪不安的地區，因位於交界地帶，在經濟、文化以及宗教方面都十分敏感，導致當地紛爭不斷，素有「火藥庫」之稱。請問：關於該地區的紛爭原因，何者正確？
  options:
  - label: A
    content: 民族不同：貝都因人與阿拉伯人的紛爭
  - label: B
    content: 戰略地位：位歐、亞、非三洲接觸地帶
  - label: C
    content: 石油礦藏：主要分布於黑海沿岸
  - label: D
    content: 宗教不同：佛教徒與伊斯蘭教徒紛爭。
- id: doc_113_高雄_五福_社會_g8s2e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 埃及的亞斯文高壩是一九六○到一九七○年代之間興建完成的。水壩建在世界上最長的□□河，然而，因為亞斯文高壩興建，使得數以萬計的努比亞人被迫遷離家園，且眾多的歷史古蹟也將沉沒湖底。另一方面，它解決了埃及電力和水源的需求，使此河流的氾濫得以控制，確保農業用水不受上游國家限制。伴隨亞斯文高壩興建的水力發電廠，除了供給埃及的穩定電力使用外，也可賣給鄰國賺取外匯。請問：亞斯文高壩主要是使用哪一條河流的水資源？
  options:
  - label: A
    content: 底格里斯河
  - label: B
    content: 幼發拉底河
  - label: C
    content: 尼羅河
  - label: D
    content: 約旦河。
- id: doc_113_高雄_五福_社會_g8s2e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: '西亞和北非雖屬於不同的陸塊，卻在自然與人文環境方面有許多相似之處，請問：下列關於兩地環境的敘述，何者正確？

    甲：以山地地形為主 乙：香蕉為主要植栽 丙：大部分為季風氣候

    丁：以小麥為主要糧食 戊：屬於伊斯蘭文化區。'
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 乙丁
  - label: D
    content: 丁戊。
- id: doc_113_高雄_五福_社會_g8s2e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 到西亞旅遊的遊客，都會購買當地名產-椰棗。棗椰樹生長於炎熱乾燥的氣候區，具有耐旱、耐熱的特點，椰棗果肉含糖量高，可當糧食或製糖釀酒的原料，又稱「沙漠麵包」，是當地重要的出口品。請問：當地適合棗椰樹生長的乾燥氣候，其形成的原因為下列何者？
  options:
  - label: A
    content: 位於西風的背風側
  - label: B
    content: 季風轉換期缺乏水氣
  - label: C
    content: 低緯度低壓帶籠罩
  - label: D
    content: 高壓下沉氣流旺盛。
- id: doc_113_高雄_五福_社會_g8s2e2_s1_18
  section: 1
  number: 18
  type: single
  page: 3
  stem: 吉伊在某一主題的研究報告上，閱讀到一段文字說明：「民國100 年修法前，刑法規定『在車站或碼頭犯竊盜罪者，加重其刑』，故若在機場犯竊盜罪，雖然性質和上述規定類似，仍不能以加重竊盜罪加以處罰。」根據上述內容，此項主題最有可能為下列何者？
  options:
  - label: A
    content: 誠實信用原則
  - label: B
    content: 罪刑法定原則
  - label: C
    content: 無罪推定原則
  - label: D
    content: 分權制衡原則。
- id: doc_113_高雄_五福_社會_g8s2e2_s1_19
  section: 1
  number: 19
  type: single
  page: 3
  stem: 刑罰設計的目的之一是要預防民眾犯罪，透過事前嚇阻的方式，使民眾不輕易觸犯《刑法》。下列哪一項最符合刑罰能嚇阻犯罪的原因？
  options:
  - label: A
    content: 刑罰具有最後手段性，制裁所有的違法行為
  - label: B
    content: 法定代理人須為未成年人之犯罪行為連帶負起刑事責任
  - label: C
    content: 在服刑期間的技能訓練是刑罰矯正的方式之一
  - label: D
    content: 犯罪者須因對被害人造成的法益侵害承擔刑罰制裁。
- id: doc_113_高雄_五福_社會_g8s2e2_s1_20
  section: 1
  number: 20
  type: single
  page: 3
  stem: 當人民彼此間之債權債務關係發生紛爭時，可以請求法院以公正第三者的地位介入，依證據認定事實、適用法律，並以裁判來解決當事人之間的紛爭，使私權得以獲得保障。請問：關於我國民事訴訟之相關敘述，下列何者正確？
  options:
  - label: A
    content: 此為針對犯罪行為向法院所提出的訴訟
  - label: B
    content: 得由檢察官進行偵查後，認為必要時向法院提起訴訟
  - label: C
