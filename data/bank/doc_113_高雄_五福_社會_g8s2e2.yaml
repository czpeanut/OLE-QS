  type: single
  page: 5
  stem: '二戰期間，日軍在亞洲各地強徵女性充當「慰安婦」，她們來自韓國、中國、台灣、菲律賓、印尼等地，遭受嚴重的身心迫害。戰後，許多倖存者站出來要求日本政府承認歷史責任，並提供正式道歉與賠償。然而，日本政府對此問題的態度反覆，導致受害國與日本之間持續發生外交爭議。此外，歷史學家根據倖存者證詞指出，許多女性是被日軍強迫帶走，甚至遭受暴力脅迫，並非自願從事這種工作。然而，日本部分政治人物仍主張這些女性是「自願」的，或質疑相關數據的真實性，造成國際社會對此問題的持續關注與討論。以下是關於慰安婦議題的統計數據：

    | 國家/地區 | 推估人數 | 日本官方道歉（年份） | 賠償措施 |

    | :--- | :--- | :--- | :--- |

    | 韓國 | 約20 萬人 | 1993（河野談話）、2015（韓日協議） | 2015 年提供部分賠償基金，但爭議仍存 |

    | 中國 | 推估10-20 萬人 | 1993（河野談話） | 無官方賠償，部分民間訴訟失敗 |

    | 台灣 | 約2 千人 | 1993（河野談話） | 無官方賠償，民間要求仍持續 |

