  section: 2
  number: 31
  type: single
  page: 5
  stem: 「非學無以廣才，非志無以成學。」由這句話可知作者認為下列何者是關鍵？
  options:
  - label: A
    content: 學習
  - label: B
    content: 才能
  - label: C
    content: 立志
  - label: D
    content: 品德。
  group_stem: '(三)

    夫君子之行，靜以修身，儉以養德，非澹泊無以明志，非寧靜無以致遠。夫學須靜也，才須學也，非學無以廣才，非志無以成學。淫慢（１）則不能勵精，險躁則不能治性。年與時馳，意與日去，遂成枯落，多不接世，悲守竅廬，將復何及。（諸葛亮
    誡子書）

    【注釋】（１）淫慢：放縱懈怠。'
