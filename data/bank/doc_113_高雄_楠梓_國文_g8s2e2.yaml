- id: doc_113_高雄_楠梓_國文_g8s2e2_s2_26
  section: 2
  number: 26
  type: single
  page: 4
  stem: 根據本文，下列敘述何者正確？
  options:
  - label: A
    content: 全文以描寫人物行誼為主，強調醫術重於醫德
  - label: B
    content: 董奉透過醫術、法術兼施，讓刺史杜燮死而復生
  - label: C
    content: 文中對於解救刺史的描述頗詳，藉以印證董奉的醫術
  - label: D
    content: 董奉使用道術，協助廬山普降甘霖，贏得百姓景仰。
  group_stem: "(一)\n  董奉在中國醫生裡面，是一位富有傳奇色彩的人物。當他在江西 廬山行醫救人的時候，訂下了一個奇特的規矩：替人看病，分文不取，但重病的人在病癒後，必須在他指定的山區，種植杏樹五株。病輕的人在病癒後，在山上種植杏樹一株，以示報答。\n\
    \  如此一來，遠近的居民輾轉相告，紛紛前來求醫。數年間，杏樹鬱然成林。董氏又於杏樹下作一草倉，訂下規矩：當杏子成熟時，欲得杏者，可用榖易之，不必通報主人，只要留下一斗穀，就自行摘一斗杏去。董奉再將所得之榖用以賑濟貧窮。後世便以「□□□□」稱譽醫術高超、醫德高尚的醫學家。\n\
    \  董奉是福建 侯官人，出生於三國時代。少年時期，除了學習古典經籍之外，也深愛歧黃之術，研究許多醫學著作。後來，他遇見一位異人，說他稟賦不同於常人，便收為徒弟，傳授道術。因此，董奉除了精通醫術，也深諳道術，能呼風喚雨，駐顏不老。\n\
    \  董奉後來行醫來到交州（今廣西），聽說刺史杜燮得了疾病，已經死了三天。董奉立即前往刺史府，要求查看刺史的屍體，自稱或許還能救治。刺史府上下人等，本來正忙著辦理喪事，一聽說神醫董奉要救刺史，自然萬分高興，急忙請他入內。董奉探了一下杜刺史的脈搏，認為可救，遂自懷中掏出一個瓷瓶，倒出三粒藥丸，塞入刺史口中，灌進少許米湯，扶起上半身，輕輕搖動頭部，使藥丸慢慢進到胃裡化解。\n\
    \  過了半個時辰，果然奇蹟出現了，杜燮的手腳有了活動，原已蒼白如蠟的臉色，也漸漸恢復了紅潤，圍觀者無不又驚又喜。半日之後，杜刺史不但睜開了眼睛，而且坐了起來，一時整個刺史府歡聲雷動，到了第四天，終於能開口說話。\n\
    \  後來董奉卜居於廬山之麓，結草為廬，過著恬淡自適的生活。這一年，久旱不雨，秧苗都乾枯了。縣令丁某憂心如焚，幾次求雨，都無結果。聽說董奉是個得道的活神仙，不但能起死活生，也有呼風喚雨的本領。\n\
    \  於是丁縣令備妥了董奉喜歡吃的肉餔和美酒，親自登山拜訪，請求設法協助普降甘霖。董奉只顧望著自家茅頂，左瞧來，右看去，然後笑著說：「日落之後，當會下雨。」夜裡，果然下了大雨，使旱象完全解除，贏得遠近百姓同聲謳歌。（改寫自楊濤、郁愚\
    \ 名醫外傳）"
  tags:
    chapter:
      publisher: null
      book: 八下
      subject: 國文
      code: null
      title: null
      chapter: null
    textbook: 八下 第2次段考範圍
    labeled_by: ai
