  group_stem: "(二)\n    諸葛亮七擒孟獲安邊固疆以後，南方的少數民族對他十分尊敬。但是這些民族中有個非常落後殘酷的風俗，就是每逢祭祀的時候，要取七七四十九顆人頭當供品，說這樣才能討鬼神喜歡。諸葛亮既想尊重人家的習俗，又要設法消除這種野蠻風俗。不巧，蠻王孟獲請他去參加祭祀活動，諸葛亮只好帶著牛羊肉、米酒等禮品，叫上幾個伙頭軍，滿腹心事的去賀節。\n\
    \    祭祀活動上燃起篝火，巫師們載歌載舞，格外熱鬧。只聽一聲喧嚷，四十九個巫師手擎明晃晃的大刀，押著四十九個小夥子走進場子當中，嘴裡念了幾句，舉起鋼刀就要動手。諸葛亮一著急，大喝一聲：「且慢！」眉頭一皺，計上心來，說道：「過去兵戎相見，現在我們親如一家，要讓子孫萬代友好下去，請換上更好的供品。你們看車上所裝的就是我所帶來的祭禮。」\n\
    \  諸葛亮叫伙頭軍把牛羊肉、米酒、麵粉帶到廚房，用米酒和麵粉揉在一起，然後把包著牛羊肉的麵糰捏成人頭的樣子，一共做了七七四十九個，然後送上蒸籠蒸熟。\n\
    \  諸葛亮把麵人頭擺在神壇上供了一會兒，又對眾人說：「神靈已經享用過了，現在大家把它們吃了一定能消災除病。」眾人一嘗，果然美味，都說這比人頭當供品好。因為是代替蠻夷兄弟的人頭做出來的，開始人們叫它「□□」。諸葛亮覺得吃□□對少數民族不尊敬，就改了稱呼，沿用至今，反而cream是指不包餡的麵團了。（改寫自鍾敬文、許鈺\
    \ 三國演義的傳說）"
