  group_stem: 'What is Earth Day?

    Earth Day is a special day celebrated every year on April 22nd. It started in
    1970 to help people care about the environment. The Earth has many problems caused
    by humans, like cutting down trees, pollution, and climate change. Earth Day helps
    people to take action to protect the planet.


    (58)___________

    In 1969, a huge oil spill off the coast of California released 3 million gallons
    of oil into the ocean. This caused a lot of damage and made Senator Gaylord Nelson
    want to do something about it. In 1970, he worked with activist Denis Hayes to
    create Earth Day. Around 20 million people joined protests and events across the
    United States. Many students helped lead the way. Over the years, Earth Day grew,
    and by 1990, it became a world event, with 200 million people in 141 countries
    taking part.


    How Earth Day is Celebrated

    People celebrate Earth Day in many ways:

    • Rallies and marches: People get together to show their support for the environment.

    • Conferences and seminars: These help people learn more about environmental problems.

    • Concerts and fundraising: Events where people raise money for environmental
    organizations.

    • Clean-up events: Volunteers clean beaches, parks, and other areas to help nature.

    In 2020, Earth Day celebrated its 50th anniversary. Because of COVID-19, the event
    went online, and millions of people joined from around the world.


    Other Facts About Earth Day

    • More than 1,000,000,000 people in 190 countries celebrate Earth Day every year.

    • Greta Thunberg, a young climate activist, supports Earth Day. She gave a talk
    online in 2020 for Earth Day Live.

    • Each year has a different theme. In 2019, the theme was “Protect Our Species,”
    which focused on saving endangered animals and plants.


