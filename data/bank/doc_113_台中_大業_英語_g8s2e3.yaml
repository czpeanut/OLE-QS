    and more teenagers nowadays. Dr. Eliot will offer everyone a chance to take a
    self-check test to find out whether you are feeling low or depressed. She’ll also
    give you helpful self-care advice to help you start feeling better. A question-and-answer
    time will follow her talk.

    1:30-3:30 p.m., July 20

    Multi-Purpose Classroom Building, Room 101

    Free to Enter, Open to All


    Dr. Eliot works to help teenage students stay healthy. She is the leader of the
    Health Promotion Program and the medical director of the Student Health and Counseling
    Section for many years. Her books include: Say Goodbye to the Blues, The Art of
    Being Happy, Positive Thinking, and Let’s Try Happiness.


