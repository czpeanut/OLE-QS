- id: doc_113_高雄_苓雅_國文_g8s1e3_s1_49
  section: 1
  number: 49
  type: single
  page: 6
  stem: 文章開頭描述淡水時，作者使用了哪個比喻來形容淡水對於臺北人的意義？
  options:
  - label: A
    content: 淡水是逃離都市喧囂的庇護所
  - label: B
    content: 淡水是連接過去和未來的橋樑
  - label: C
    content: 淡水是一扇讓人換氣的窗
  - label: D
    content: 淡水是遠離繁忙的度假村
  group_stem: "位於臺灣北端的淡水好似一扇窗，讓窒息於都市叢林的臺北人，有換氣吐納的餘地。她不遠，搭捷運不到一個小時，就可置身另一個時空。有大屯山為屏，觀音山守候，川流了整個城市的河脈，行至此變得更緩更闊，隨著潮汐，把汙穢一併還給汪洋，海水交接處因此有了難得的潔淨。\n\
    \  四周櫛比鱗次①的新興大廈，發展不到鎮上，古街老店仍維持著它的步調，緩緩彳亍②於時間的長河。充滿古意的糕餅店賣的古早喜餅，似乎讓紅底金字的婚約，在此得到更雋永的保證。擠在巷弄裡的淡江戲院，百元票價便可觀賞二輪強檔西片，戲院內斑剝老舊，揮之不去的尿騷味與蚊蟲聲，喚醒了孩提時看「梁\
    \ 祝」的記憶。清水祖師廟前的小攤販售的零嘴玩具，則完全是童年雜貨店的翻版。時光彷彿在此靜止了，淡水老街勾起的是臺北人逝去已久的夢。\n  老舊的渡船失去運輸的意義，卻仍要擔負著遊客的思古幽情。尤其滿潮時，河面寬了闊了，行駛間的波濤起伏也大，有種不危及性命的驚險，溼溼鹹鹹的海風，吹亂了髮絲，也吹亂了閉塞的心，帶來陌生又新奇的感覺，微薄的船資，便能享受放逐他鄉的悲壯。\n\
    \  渡船碼頭當然是不可錯過的，在燒酒螺的引領下，走過一攤又一攤，阿婆鐵蛋、魚丸、阿給、蝦捲及彈珠汽水，是另一種童稚的嘉年華，不過夾雜其間不起眼的糯米腸鋪子，可千萬別錯過，它的米粉湯及米腸，可是臺灣地道美食小吃。至於那些錯落在河岸邊的個性咖啡館，散發的又是另一種情調，駐足其間啜飲一杯咖啡，眺望對岸穩穩沉睡的觀音，看著淡水河波光瀲瀲③的在眼前流淌而去，那靜與動之間，予人無限的遐思，不僅讓走倦的身子得以休憩，更讓心魂暫時得到釋然。\n\
    \  傍晚真的是遊覽淡水的最好時分，河堤步道由捷運站旁可一直延伸到漁人碼頭，沿途經過渡船頭、榕樹堤岸以及視野最好的淡水指揮部，順著這個方向行進，可欣賞醉人的夕照，以及海口連天的遼闊。如果時間允許，走走停停間，也會發現這正是各種沼澤生物用餐的時候，忙碌異常的招潮蟹，看似悠哉無害的白鷺鷥，卻一樣扮演著食物鏈中不可或缺的角色。\n\
    \  榕樹堤岸適合蹲踞，夥④在老人堆裡，逗弄晒暖了的貓咪、行色匆匆的狗兒，在一寸寸老去的斜陽裡，可以提前品味一下垂老的光景。從堤岸繼續往前走，是拍婚紗照的新人最常出沒處，景觀之佳由此可見。行至此，若有些兵疲馬困，斜對面巷子裡的「黑殿飯店」可以是一種選擇，店裡現炸排骨自然是好吃的，其他滷味和大滷湯也十分味美，不過最好不要晚於七點來此，因為這裡熱賣的情況，絕對超出想像，七點以後只有閉門羹可享。\n\
    \  若從榕樹堤岸往回走上街區，溫州餛飩、「海風」海產及中正路上的廣東燒臘，都是美食榜上有名的。老街上有高檔的古玩藝品，也有誰都買得起的民俗童玩，我卻鮮少流連，唯有位在三叉路的「十八行」偶爾會去逛一逛，為的是老闆自製耐人尋味的小字條。\n\
    \  如果僅止於當個遊客，淡水滿足的是往日情懷，設若長駐在此，淡水則令人有耽溺的危險。她的詭譎複雜遠超出想像，正如她的潮汐，左右著河堤景觀，左右著賴以存活的蝦蟹魚鳥及倚水而立的各色草木，就算每天同一時刻駐足其間，總都有不同的景致吸引著你。對岸的觀音，或晴或雨或晨或暮，也總能幻化不同的身姿，供你想望。\n\
    \  即使你只是過客，一樣可沉浸在淡水的氛圍裡，只要有裕如的時間，悠閒的心情。所以，選個不是假期的日子來淡水吧！\n─節選自《記憶如此奇妙：朱天衣散文集》\n\
    【注釋】①櫛比鱗次：比喻建築物排列密集。櫛，音ㄐㄧㄝˊ，梳子。比，音ㄅㄧˋ，並列。②彳亍：音ㄔˋ ㄔㄨˋ，指緩步慢行。③瀲瀲：水波動的樣子。④夥：共同。"
