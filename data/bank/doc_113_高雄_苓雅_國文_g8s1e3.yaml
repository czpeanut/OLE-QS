  stem: 買春聯一文中，作者擔任大哥寫字時的磨墨書僮，而大哥總要趁此機會逗一逗作者，說要寫個「六畜興旺」貼她房門口，由此可知兄妹倆感情好。下列何者可用來形容兄妹情感融洽？
  options:
  - label: A
    content: 手足情深
  - label: B
    content: 煮豆燃萁
  - label: C
    content: 相敬如賓
  - label: D
    content: 琴瑟和鳴。
  group_stem: "我想買春聯，只要幾個「春」字、「福」字、一張「大家恭喜」就可以了，可是該到哪兒買呢？我不要大賣場裡賣的，那些都是印刷品，我要手寫的，筆酣墨濃的書法，看得見汁液的流動、新乾的痕跡，這年頭得到哪兒買這樣的春聯呢？\n\
    \  遺憾自己的字不好。其實學生時代練過字的，臨過宋徽宗的瘦金體、趙孟頫的行楷。瘦金體的書法甚至影響了我的硬筆字，懂字的人一眼就看出來。曾有朋友批評我不應該練瘦金體，他說我人太瘦，該練顏體，讓自己厚實些。當時我聽得一愣一愣的，後來想起真是胡說八道，那麼難道胖的人練了瘦金體就能減肥嗎？我在洛杉磯念書時，更聽過一位大陸同學批評趙孟頫，說他的字太媚，怪不得能事兩朝。我心想，我不過就練過這麼兩種字體，崇拜的兩位書法家，一個亡國、一個被說得行近賣國，我怎麼這麼倒楣呢？\n\
    \  我的大哥卻寫一手好字，小時候他老對我說：「我左手寫的字都比你的好看！」那是真的，因為他是左撇子。根據媽媽的說法，大哥小時候似乎很愛哭，她說：「你大哥從學校回來，哭他不會寫毛筆字，我們馬上找隔壁韓伯伯教他寫字。」是因此，所以大哥的字打了好根柢嗎？韓伯伯的字寫得好，那時過年，他總要寫許多春聯分送給大家。我們家的春聯常是韓伯伯送的。\n\
    \  我呢，是爸爸扶著我的手教我寫字。爸爸的字雖然沒有韓伯伯寫得好，卻是他從大陸唯一帶出來的東西了。當年他到福建 馬尾想要當海軍，年紀太小，資格不符，可是辦事員發現他的字寫得不錯，就讓他謊報年齡上了船。不知是否從此他對自己的出生年錯亂了？總是不確定到底是哪一年生的。那樣的時代就有那樣的事。\n\
    \  韓伯伯的春聯是過年才貼的，爸爸的字卻與我的生活息息相關──在那多雨的基隆 暖暖。我從小就迷糊，有時穿著拖鞋、睡衣去上學，有時把書包、便當留在學校裡忘了帶回來，最常忘的是傘。現在每聽到記憶訓練的廣告詞：「有沒有算過，你從小到大總共丟過幾把傘？」總覺得是在說我。回想起來，爸爸從不苛責⑥小孩，卻善於解決問題。他用毛筆蘸橘紅色油漆在黑雨傘上寫上我的大名，就是我自己忘了，也會有人提醒我拿傘。下雨天我一撐起傘，常引起旁邊無聊的小男生念念有詞，大聲念我的名字。\n\
    \  我心裡卻是得意的，我知道爸爸的書法是雨傘上最漂亮的標籤。\n  搬離眷村之後，過年沒有韓伯伯的春聯了，不過這裡的里長會送春聯，當然是印刷的了。春聯送來時，全巷鄰居擁到巷口，近視眼的任媽媽總要搶先挑選，每張春聯拿臉上快碰到鼻尖了才看得清楚。她什麼都要先挑，連我們這一區改路名，新門牌送來時，她也搶著說：「我來先挑一個好的！」\n\
    \  母親不喜歡把嶄新的大門貼得太複雜，總是只貼一張簡單的「大家恭喜」，不貼對聯，至於鄰居常貼的「對我生財」、「恭喜發財」，不知是不是覺得表現得太愛財，她從來不貼。\n\
    \  屋裡的「春」到、「福」到由大哥來寫，我當然是磨墨的書僮。大哥總要趁此機會逗一逗我，寫個「六畜興旺」什麼的要貼我房門口。忘了是不是因此，讓我痛下決心想要練字！\n\
    \  國小二年級的兒子，這學期老師已經要他們帶毛筆到學校教他們寫春聯了，他連鉛筆都還拿不好呢！老師在聯絡簿上寫著，「帶毛筆、墨汁、報紙、圍裙」，看了忍不住想笑，寫字要穿圍裙，真是煮字療飢啊！我到文具店給兒子選筆，四處逛逛，看見一疊疊裁好的「萬年紅」、閃著細細金粉的「灑金宣」，心底有個聲音在說：買幾張回去吧！我的字雖然不好，但我仍想要扶著兒子的手，蘸滿濃濃的墨，工工整整在紅色宣紙上寫一個「福」字，貼在他的房門口。\
    \                                                      《買春聯》"
