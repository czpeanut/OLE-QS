  stem: 根據《臺灣人最愛的麵食與泡麵調查結果出爐！》，下列資訊歸納何者正確？
  options:
  - label: A
    content: 人們在颱風來襲時，最常去小吃店吃麵
  - label: B
    content: 乾麵的口味較多元，因此較受眾人喜愛
