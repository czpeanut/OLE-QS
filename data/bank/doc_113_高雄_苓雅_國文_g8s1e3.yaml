  group_stem: 「三月十五正日,明教上下人眾個個換了新衣。拜天地的禮堂設在濠州第一大富紳的廳上，懸燈結彩,裝點得花團錦簇。張三豐那副『佳兒佳婦』四字大立。殷天正為男方主婚，常遇春為女方主婚。鐵冠道人為濠州總巡，部署教中弟子四下巡查，以防敵人混入搗亂。湯和統率義軍精兵，在城外駐紮防敵。這日上午，少林派、華山派也派人送禮道賀。申時一刻，吉時已屆，號炮連聲鳴響。眾賀客齊到大廳，贊禮生朗聲贊禮，宋遠橋和殷野王陪著張無忌出來。絲竹之聲響起，眾人眼前一亮，只見八位峨嵋派青年女俠，陪著周芷若婀婀娜娜的步出大廳。周芷若穿大紅錦袍，鳳冠霞帔，臉罩紅巾。男左女右，新郎新娘並肩而立。」      金庸
