  group_stem: "臺灣人最愛的麵食與泡麵調查結果出爐！\n  臺灣人喜歡吃麵食，除了小吃店所賣各式各樣不同的麵類之外，泡麵也是許多人喜愛的種類之一，而在琳琅滿目的泡麵品牌與口味中，也各有支持者。網路平臺分別針對臺灣人喜愛的麵食種類以及泡麵品牌與種類，進行了喜好調查，結果如下：\n\
    \n▲臺灣人最愛的麵食種類調查            ▲臺灣人最愛的泡麵品牌與種類調查\n  臺灣人對於泡麵的印象，往往與颱風來襲有關，當強風豪雨侵襲造成停水停電、無法下廚或外出覓食時，泡麵便往往成為主要的食物。因此，泡麵與颱風對於臺灣人來說，可謂一種獨特的文化記憶。\n\
    （改寫自「三立新聞網」網站2023.12.22）\n\n                      父親的鄉愁味\n韓良憶\n  開始跟著爸爸上西餐廳時，我才五、六歲吧，說不定更小。……及長才知道，我從小到大吃的西餐，包括爸爸三不五時便親自下廚熬煮的「羅宋湯」在內，都是源自上海的海派西餐，亦稱滬式西餐。我所熟悉的那些菜色，全是摻雜了中國味的法國菜、德國菜、義大利菜、英國菜和俄國菜，從來就不是道地的西菜。\n\
    \  根據舊式的身分證，父親籍貫是江蘇 東臺，但他其實是在與上海 崇明島隔江相對的南通長大，成年後在上海住過一陣子。對於像爸爸這樣從小養尊處優又生性好奇的小城富家子弟而言，上海這十里洋場是世上最摩登的所在，也是他與西洋接軌的開始，而好吃也講究吃的父親，與滬上的洋事物最直接也最切身的接觸，想來就是海派西餐了。\n\
    \  海派西餐肯定特別合他的胃口，不然，他怎麼會在來到臺灣、結婚生子後，還不時帶著他的妻子和子女，吃遍臺北有名的滬式西餐館？……\n  父親在世最後幾年，我回臺灣探父，三番兩次問他想不想去吃西菜，好比義大利菜或法國菜，他總是不置可否，意興闌珊。有一回跟他聊天，講到兒時的大華飯店，他那天談興甚高，順著我的話頭，一一數說起當年臺北有名的西餐館……。\n\
    \  就在那一刻，我彷彿明白了，父親愛吃的根本並不是「西洋菜」。對他而言，帶著中國味的滬式西餐，並不只是口腹之欲，那當中尚蘊藏著對往昔時光和故鄉的脈脈溫情。\
    \       （節選自《食光記憶：12 則鄉愁的滋味》）"
