- id: doc_111_桃園_石門_社會_地理_g8s2e2_s1_40
  section: 1
  number: 40
  type: single
  page: 4
  stem: 到西亞旅遊的人，經常會購買當地的名產─椰棗。椰棗生長於炎熱而乾燥的氣候中，紅熟的椰棗可供食用，保鮮不易，大部分是以乾果進行買賣，只有在產地才吃得到新鮮的椰棗。棗椰樹主要分布在西亞和北非，具有耐旱、耐熱的特點。椰棗果肉含糖量高，可作糧食、製糖或釀酒，籽可以榨油，堪稱「沙漠麵包」，更是西亞和北非國家重要的出口特產。請問：由文中內容推論，椰棗生長在何種氣候類型？
  options:
  - label: A
    content: 熱帶沙漠氣候
  - label: B
