  section: 1
  number: 36
  type: single
  page: 1
  stem: 桃園市、新竹市都有好孕專車，尤其桃園市補助居全台之冠，但使用範圍僅限設讀卡機的1.6 萬輛計程車，挨批「看得到叫不到」；民代另建議，沿海偏鄉地區應提高補助，以免美意打折。桃園市婦幼局回應，將與交通局研議擴大至捷運、公車，並考慮調整補助金額。請問：上述內容分析，下列何者最為正確？
  options:
