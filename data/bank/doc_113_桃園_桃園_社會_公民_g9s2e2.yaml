- id: doc_113_桃園_桃園_社會_公民_g9s2e2_s1_39
  section: 1
  number: 39
  type: single
  page: 1
  stem: 在歷史上關於人權的第一部法典──英國《大憲章》簽署 800 年的紀念活動上，英國首相表示《大憲章》制定的意義不僅只專屬於英國，更改變了全世界。當時這份文件簽署的目的在限制王權，但同時也把所有的自由人納入法律保障範圍之內，影響後代許多國家《憲法》的制定。而後，政府依法擁有權力，人民權利受到保障。請問：由上文判斷，關於《大憲章》簽署之前的英國社會描述，下列何者正確？
  options:
  - label: A
    content: 屬於法治社會
  - label: B
    content: 統治者的意思就是法律
  - label: C
    content: 法律凌駕於統治者之上
  - label: D
    content: 法律可以約束所有的人。
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 公民
      code: 3-2
      title: 我國身處的國際環境
      chapter: 第3章 國際參與
    textbook: 九下公民 3-2 我國身處的國際環境
    labeled_by: ai
  ai_answers:
    gemini: B
    qwen: B
  answer:
