  answer_status: ai_generated
  answer_source: ai:gemini+qwen
- id: doc_113_桃園_桃園_社會_公民_g9s2e2_s1_40
  section: 1
  number: 40
  type: single
  page: 2
  stem: 由上述南韓網路性虐待事件中，可知嫌犯利用兒少對網路安全與自我保護的不了解，而做出侵害行為。為此，臺灣司法人權進步協會提供兒少自我保護的方式，請問：此方式的層面與下列何者相同？
  options:
  - label: A
    content: 我國學子自主性發動募款幫助弱勢孩童
  - label: B
    content: 兒童福利聯盟推動兒童福利政策的修訂
  - label: C
    content: 馬拉拉不畏強權，為爭取兒童權利發聲
  - label: D
    content: 政府制定保障兒少福利及權益相關法規。
  group_stem: "2020 年，南韓爆發網路性虐待事件，嫌犯在網路上誘騙多名年輕女性，其中還有未成年少女。嫌犯將其受虐過程錄影，並透過網路以會員收費的方式散布，這種充滿惡意與傷害的意圖，讓人感到憤怒與不安，除了追究其法律責任，值得我們檢視的是事件背後透露的訊息，包括性教育、兒童網路使用安全、是否有完善的支援系統協助被威脅者，以預防相同事件一再發生。\n\
    \  臺灣司法人權進步協會提醒，網際網路的發達，造成資訊快速散布，保護自己的最佳方式就是「不拍攝」、「不傳送」、「不轉傳」自己或他人的私密影像。教育部也製作相關文宣，希望兒少都能做到自我保護，遇到威脅時勇敢尋求支援。\n\
    一、不管你是我的誰，偷拍、恐嚇都是犯罪\n二、散布私密照，將面臨刑法及民事求償\n三、被偷拍不是你的錯，應勇敢求助\n四、當網愛成金錢勒索，截圖保留證據\n\
    （資料來源：改寫自 1. 性侵少女！韓國 N 號房事件若在臺灣……法界：10 年重罪，ETtoday，2020/04/21。\n2. 「被關進地獄的孩子們，現在在哪裡？」N\
    \ 號房事件後，每個家長都可以開始做的事，回家吧，2020/03/25。）"
