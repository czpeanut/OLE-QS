  section: 1
  number: 38
  type: single
  page: 1
  stem: 全球化是世界觀、產品、概念及其他文化元素的交換，所帶來的國際性整合的過程。電信等基礎建設的進步，包括電報及之後網際網路的興起，都造成了全球化，以及在文化及經濟上互相影響。下列何種現象與上述發展最無相關性？
  options:
  - label: A
    content: 美國金融風暴導致各國金融危機
  - label: B
    content: 澳洲小麥歉收造成國際糧價上漲
  - label: C
    content: 亞洲出現的新型疾病迅速傳播至美洲
  - label: D
    content: 柬埔寨地震恐引發太平洋海嘯警報
