- id: doc_113_台北_仁愛_社會_歷史_g7s2e1_s2_38
  section: 2
  number: 38
  type: single
  page: 4
  stem: 從資料二內容，我們可以正確解讀出什麼訊息？
  options:
  - label: A
    content: 糖是總督府的專賣項目
  - label: B
    content: 臺灣第一座現代化糖廠由日本企業家投資設立
  - label: C
    content: 總督府保障蔗農的銷售權益
  - label: D
    content: 「原料採收區域制度」使蔗農生產意願提高
  group_stem: "★請閱讀日治時期臺灣糖業的三份相關資料，並回答問題： \n\n資料一：  \n林本源製糖會社的溪洲工廠，當時有一車甘蔗入廠過磅，紀錄上的重量與蔗農估算差了一大截，在場的三個保正不信邪，一起跳上甘蔗車再磅一次，結果，三個人的體重竟然只有八十斤而已，這個小故事立刻傳遍全島。\
    \ \n\n資料二：  \n1900 年（明治33 年）日本三井財團成立「臺灣製糖株式會社」，隔年於高雄橋仔頭設立臺灣第一座新式製糖廠。1902 年（明治35\
    \ 年）臺灣總督府頒布「糖業獎勵規則」採行「原料採收區域制度」，將全島蔗作區予以劃分，在指定區域內，蔗農不得越區出售甘蔗，只能賣給指定區域內的糖廠。 \n\n\
    資料三：  \n「臺灣新文學之父」賴和（1894∼1943 年）的小說《豐作》中，描述蔗農添福辛苦大半年，種出更好的甘蔗，但在會社秤重時，甘蔗重量卻比預期的低。大家覺得不合理，便有三個人跳到磅臺上秤量，秤量結果三人體重竟只有27\
    \ 斤。"
