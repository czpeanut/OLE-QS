  group_stem: "★國語家庭 \n「國語家庭」的認定制度是從1937 年開始實施，條件有二：一為全家人都使用國語，二為過著「皇民式」的生活、改善廳堂（廢棄傳統信仰）、改穿和服、設置自用廁所和浴室。條件符合就可向州廳的「常用國語家庭審查委員會」申請，通過審核後就成為「國語家庭」，通常會獲頒一張證書、一個獎章和一個「國語家庭」的門標，另外享有較為優厚的教育、工作機會等。"
