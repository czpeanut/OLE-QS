  group_stem: "★《南進臺灣》影片介紹： \n\n《南進臺灣》是總督府統治臺灣的政績宣傳片，本片呈現日治時代臺灣的風貌，以繞行臺灣一周的拍攝手法，展現臺灣各州的建設、產業、地理、風土，以展示統治成果，指明臺灣為南進基地的首選。\
    \ \n（影片第1 集）豐收的稻米 \n影片中，提及臺灣的稻米可一年二獲，當日本的米不足，就由臺灣供應，臺灣對母國的使命之一，在於使日本帝國的米可以自給自足。\
    \ \n（影片第４集與第５集）工業化與南進基地 \n影片拍攝□□□，說明□□□位於臺中州海拔728 公尺的山上，周圍映照綠色的山脈，周遭發電機的聲音大作，可發出十萬千瓦的電力，送電到臺灣各地方，這是臺灣工業的原動力。"
