    \ \n（影片第４集與第５集）工業化與南進基地 \n影片拍攝□□□，說明□□□位於臺中州海拔728 公尺的山上，周圍映照綠色的山脈，周遭發電機的聲音大作，可發出十萬千瓦的電力，送電到臺灣各地方，這是臺灣工業的原動力。"
