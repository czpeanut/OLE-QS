- id: doc_113_高雄_苓雅_自然_g8s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: '13. 1989 年，美國海軍在太平洋監聽到一個很奇怪的聲音，聽起來像是一頭藍鯨在唱歌，但是頻率卻很不尋常。一般藍鯨的聲音通常介於 10 到 40
    赫茲之間，長鬚鯨則約為 20 赫茲，但這隻神秘的鯨魚的頻率，卻達到 52 赫茲之高。廣袤大海裡，一隻鯨魚用沒有同伴聽得見的聲音歌唱著，這景象是如此寂寞，令人們不禁對牠生出憐憫與同理之心，很快的，這隻名為「52
    赫茲」的鯨魚，便以「世上最孤獨的鯨魚」聞名於世。

    根據文章內容，請問下列敘述何者正確?'
  options:
  - label: A
    content: 一般鯨魚可以發出人耳聽不到的聲音，也就是超聲波
  - label: B
    content: 根據文章，一般鯨魚聽不到52 赫茲鯨魚的聲音是因為太小聲
  - label: C
    content: 一般鯨魚發出人耳聽不到的聲音，其速度比一般聲音快
  - label: D
    content: 52 赫茲的聲音，人類可直接用耳朵聽
