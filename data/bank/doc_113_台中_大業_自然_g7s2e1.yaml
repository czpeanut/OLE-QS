- id: doc_113_台中_大業_自然_g7s2e1_s1_38
  section: 1
  number: 38
  type: single
  page: 4
  stem: 下列哪一個是聚花果？
  options:
  - label: A
    content: 草莓
  - label: B
    content: 鳳梨
  - label: C
    content: 葡萄
  - label: D
    content: 蘋果。
  group_stem: "★ 閱讀題組：請依下文與下圖提示回答38~40 題：\n世界之大，無奇不有，有可能你平時吃的水果是「假」的，這是怎麼回事呢？\n  \
    \  原來，科學家把果實分為「真果」和「假果」兩類，桃、杏這些果實只是由花的子房發育而來，叫真果。梨、蘋果這些果實是由子房和花被或花托等一起形成的，叫「假果」。除了蘋果和梨以外，哪些水果是「假」的，你知道嗎？\n\
    \    「假果」的類型涵蓋很多，鳳梨、部分瓜類也屬於「假果」，但並不是指這類水果沒有營養價值，它們和其他水果一樣，有水果應含的營養。除了「真假」以外，植物界還將這些水果分了類別，單果和肉果就是其中一種分類法，單果是指一朵花只有一個子房的果子，還分為聚合果和聚花果(多花果)兩類，聚合果是指一朵花有許多離生的雌蕊，每個雌蕊形成一個小果，相聚在同一個花托上，蓮、草莓、懸鉤子等都是聚合果。聚花果果實是由整個花序發育而來，也稱為復果，例如桑、鳳梨、無花果等。\n\
    \    肉果是指果肉肥厚的果子，是子房和花托共同發育而成的。例如我們平常吃的桃、李、梅、杏、椰子等，都是肉質肥厚的果子。另外還有平常所吃的南瓜、冬瓜等也都是常見的肉果。與肉果對應的，還有乾果，如大豆、角果等，都是果皮乾燥無汁的植物。\n\
    原文網址：https://kknews.cc/news/kvz4yqp.html"
  shared_asset: g1_38_40
