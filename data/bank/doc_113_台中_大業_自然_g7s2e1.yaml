  stem: 自然課時，班上同學分享了觀察到的生物現象，煉獄杏壽郎：我觀察到壁虎也會將尾巴斷裂，斷裂處會再長出新尾巴，但斷裂的尾巴不會再發育成新個體。富岡義勇：我觀察到大水螅身上長出幾個小水螅。甘露寺蜜璃：我把地瓜葉的莖插在水中後，長出根和葉。宇髓天元：我在海邊看到被切開的海星，發育成2
    隻海星。關於這些生物現象的敘述，以下何者正確？
