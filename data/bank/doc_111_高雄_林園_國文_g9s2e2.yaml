  group_stem: "跟夏曼．藍波安聊天是一件很有趣的事。\n  他來自小島蘭嶼，但是跟他聊天時，你會覺得世界特別開闊。也許是因為談來談去都是海的話題，也許是他的言談裡，那些人為的，或所謂文明造成的區別或框框特別少。\n\
    \  和夏曼．藍波安聊天，你可以增加很多知識，間雜許多文化衝擊的笑話。這些機智的對白，往往是來自那些我們無從得知的幸福與辛酸，來自一個弱勢族群和強勢文明遭遇時必然的傷害與抵抗。所以他略帶嘲弄回憶著漢人怕海，不會游泳的窘態時，我跟著大笑；當他談及常有的飢餓經驗，並歸結出人類往往是被飢餓驅趕到海上時，我會凜然傾聽。\n\
    \  臺灣的領海是它土地面積的兩倍，但是我們對它的認識好像就只是海鮮的來源。站在陸地上看海，似乎只有一成不變的海平線；從海洋看陸地，你會不停移動，不停驚喜，最重要的，你會體悟到海才是最地球的東西。\n\
    \  而海洋民族的悲傷，只有海可以療癒。\n——羅智成〈只有海可以療癒〉"
  answer:
  - D
