  stem: 根據本文，下列敘述何者正確？
  options:
  - label: A
    content: 若要挑選電影導演，可從擅於演講之人中尋覓
  - label: B
    content: 論謀篇佈局的能力，辯論高手較為擅長
  - label: C
    content: 演講高手大多數不擅長辯論，而辯論高手卻二者兼擅
  - label: D
    content: 辯論高手會於辯論時以幽默烘托氣氛，使對方放鬆警戒
  group_stem: "演講高手，大多數都不擅長辯論。因為演講的核心競爭力，是在兩小時裡謀篇佈局的能力：這裡先埋下一個「梗」，那裡呼應前面某句話，然後用幽默烘托氣氛，最後用排比句昇華感情。擅長演講的人，適合做導演，他們善於把握兩小時內的節奏。\n\
    \  但是，辯論不同。辯論是10 秒內的完整回合，當你還在謀篇佈局的時候，幾個回合已經結束了。10 秒一個來回，你無法關注對方的論點，你只能關注對方的邏輯體系。\n\
    \    一個人的論點往往由論據和論點構成，即「論據＋論證＝論點」。\n    一個優秀的辯手，總是能輕易「噎死」一個普通人，因為他根本不關心對方的論據，只關心對方的論證。\n\
    \  舉個例子。\n    你說：「我昨天吃了一頓大餐，所以今天心情好。」\n  對方可以立刻接過去：「李四，聽說你昨天也吃了大餐，怎麼這麼愁眉苦臉呢？」\n\
    \  李四插科打諢接話說：「我的餐可能不夠大吧，張三，你那餐有多大？」\n  這時，你可能就愣在那裡，不知道怎麼接了。\n  從「吃大餐」到「心情好」，這個論證並不嚴謹，只是一般人不在意而已。\n\
    ——劉潤《底層邏輯．論辯的核心競爭力》"
  answer:
  - A
  answer_source: answer_key_vlm
