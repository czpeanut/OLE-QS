  group_stem: "有一種自然法則叫作「吸引力法則」，這個概念和自我啟發領域裡「思考會成為現實」的說法非常相似。吸引力法則的意思，是自己當下的期望會吸引類似的事物。「思考會成為現實」也是指自己內心所想的事物出現在眼前、發生在現實中。\n\
    \  為什麼有些人會發生這些現象，有些人卻不會呢？原因很多，這裡我就來告訴大家最重要的一點。\n  關鍵就在於是否知道「吸引力的階段」。\n  吸引力，需要有個根基（前提）。引發吸引力的機制，是呈現階梯狀。很多人做的只有吸引力最上階的部分，所以才會一無所獲。我們無法蓋一棟沒有地基的房子，同理，沒有根基就不會產生吸引力。\n\
    \  ＊第一階段：奠定感恩體質的根基。\n  ＊第二階段：和潛意識打好關係。\n  ＊第三階段：實踐願望實現法。\n  只要擁有感謝思考，感恩體質，就會逐漸變成吸引幸運的體質。當自己有了變化，對事物的觀點和解讀也會隨之變化，最終就會覺得現實改變了。\n\
    \  我居住的石垣島，在陰天十分涼爽舒適，而在雨天欣賞大自然，會發現植物和農作物都很開心的樣子。站在人類的角度看，雨天的確是很麻煩；但是從世界的角度來看，雨也是非常重要的要素。\n\
    ——心理諮商師masa 著、陳聖怡譯《睡前3 分鐘超感謝筆記》"
