- id: doc_111_高雄_林園_國文_g9s2e2_s3_44
  section: 3
  number: 44
  type: single
  page: 6
  stem: 根據甲、乙兩文，下列有關兩文的比較，何者最為恰當？
  options:
  - label: A
    content: 甲文中孔子與使者之關係，即是乙文中所言之「馴服」
  - label: B
    content: 甲文中孔子「覆醢」的動作，與乙文中狐狸不吃麵包的意義相同
  - label: C
    content: 甲文「醢」之於孔子，與乙文「麥田」之於狐狸相同，皆產生了情感連結
  - label: D
    content: 甲文的寫作手法主要以對話為主；乙文的寫作手法以敘寫動作為主
  group_stem: "【甲】\n  孔子與子路處如友、近似家人，子曰：「道不行，乘桴浮于海。從我者，其由①與！」。後（子路死）孔子哭子路於中庭。有人吊②者，而夫子拜之。既哭，進使者而問故。使者曰：「醢③之矣。」遂命覆④醢。\n\
    ——改寫自《禮記．檀弓上》\n【乙】\n  小王子說：「我是來找朋友的。『馴服』到底是什麼意思呢？」\n  「這是大家早就遺忘的事。」狐狸說：「『馴服』的意思就是建立關係。」\n\
    \  「建立關係？」\n  「沒錯。」狐狸說：「對我來說，你就是一個小男孩，像其他千萬個普通小男孩一樣。我不需要你，你也同樣不需要我。但是，如果你馴服了我，我們就互相需要對方。對我來說，你會是世界上獨一無二的小男孩，對你來說，我也是世界上唯一的狐狸……。」\n\
    \  ……\n  「再說，看到那邊的麥田嗎？我又不吃麵包，麥子對我來說，一點用處也沒有，也談不上任何意義。而這，真有點可惜。然而，你有著金黃色的頭髮，一旦你馴服了我，這將會多美妙啊！麥田的金黃色澤，一定會讓我想起你，而且，我也會愛上那風吹麥浪的聲音……。」\n\
    ——節選自聖．修伯里《小王子》\n\n1. 由：仲由，字子路，是孔子的著名弟子，孔門十哲之一。\n2. 吊：通「弔」，弔喪。\n3. 醢：音ㄏㄞˇ，原指肉醬，此作動詞，剁成肉醬。\n\
    4. 覆：翻倒、傾倒。"
  answer:
  - C
