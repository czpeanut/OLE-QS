  group_stem: "琅琊 秦巨伯，年六十，嘗夜行飲酒，道經蓬山廟。忽見其兩孫迎之，扶持百餘步，便捉伯頸著地，罵：「老奴，汝某日捶我，我今當殺汝。」伯思維某時信捶此孫。伯乃佯死，乃置伯去。伯歸家，欲治兩孫。兩孫驚惋，叩頭言：「為子孫寧可有此。恐是鬼魅，乞更試之。」伯意悟。\n\
    \  數日，乃詐醉，行此廟間。復見兩孫來，扶持伯。伯乃急持，鬼動作不得。達家，乃是兩人偶也。伯著火炙之，腹背俱焦坼。岀著庭中，夜皆亡去。伯恨不得殺之。\n\
    \  後月餘，又佯酒醉夜行，懷刃以去。家不知也。極夜不還。其孫恐又為此鬼所困，乃俱往迎伯，伯竟刺殺之。\n——干寶《搜神記．秦巨伯鬥鬼》"
