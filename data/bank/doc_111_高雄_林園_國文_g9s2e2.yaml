  stem: 根據本文，關於文中西湖的環境狀況，下列敘述何者正確？
  options:
  - label: A
    content: 西湖染為紅色，可見其生態系豐富多樣
  - label: B
    content: 桃花已經凋謝，只能等待明年再次開花
  - label: C
    content: 地上堆滿桃花，觀覽者多為年少的遊人
  - label: D
    content: 中午過後雨停，但是遊人數量稀稀落落
  group_stem: '寒食①後雨，余曰：「此雨為西湖洗紅②，當急與桃花作別，勿滯也。」午霽，偕諸友至第三橋。落花積地寸餘，遊人少，翻以為快。忽騎者白紈③而過，光晃衣，鮮麗倍常，諸友白其內者皆去表。少倦，臥地上飲，以面受花，多者浮④，少者歌，以為樂。偶艇子出花間，呼之，乃寺僧載茶來者。各啜一杯，蕩舟浩歌而返。

    ——袁宏道〈雨後遊六橋記〉


    1. 寒食：寒食節，在清明節前一或二日。

    2. 洗紅：此指春雨將花打落。

    3. 紈：音ㄨㄢˊ，細緻而有光澤的白絹。

    4. 浮：罰酒。'
