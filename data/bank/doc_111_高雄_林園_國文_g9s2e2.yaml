  stem: 描寫情境時，分為眼前所見的「實寫」與記憶中的「虛寫」兩種。下列關於〈水神的指引〉的文句，何者屬於「虛寫」？
  options:
  - label: A
    content: 我看著周圍躺落裝滿水的寶特瓶，體會出老獵人對水的珍惜，和對自然土地那份情感的真實
  - label: B
    content: 父親用手指著回答道：「就是這裡啊！」天啊，我真的不敢相信眼前所看到的！
  - label: C
