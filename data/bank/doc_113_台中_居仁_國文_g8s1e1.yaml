  stem: "「秦檜之夫人，常入禁中。顯仁太后言近日子魚大者絕少，夫人對曰：『妾家有之，當以百尾進。』歸告檜，檜咎其失言，與其館客謀，進青魚百尾。顯仁拊掌笑曰：『我道這婆子村①，果然！』蓋青魚似子魚而非，特差大耳。」\n\
