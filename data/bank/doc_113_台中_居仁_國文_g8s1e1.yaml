  group_stem: "(一)\n                  白居易 輕肥\n意氣驕滿路，鞍馬光照塵。借問何為者，人稱是內臣。\n朱紱皆大夫，紫綬悉將軍。誇赴軍中宴，走馬去如雲。\n\
    樽罍溢九醞，水陸羅八珍。果擘洞庭橘，膾切天池鱗。\n食飽心自若，酒酣氣益振。是歲江南旱，衢州人食人。\n\n注釋：\n① 內臣：指宦官。\n② 紱：音ㄈㄨˊ，古代繫印章的絲繩。\n\
