  stem: 根據上文，請問□□□□內詞語按照文意依序宜填入：
  options:
  - label: A
    content: 欣欣向榮/轟轟烈烈
  - label: B
    content: 威風凜凜/白雲悠悠
  - label: C
    content: 料料峭峭/淅淅瀝瀝
  - label: D
    content: 瀟瀟灑灑/尋尋覓覓。
  group_stem: "(二)\n    驚蟄一過，春寒加劇。先是□□□□，繼而雨季開始，時而淋淋漓漓，時而□□□□，天潮潮地濕濕，即連在夢裏，也似乎有把傘撑着。而就憑一把傘，躲過一陣瀟瀟的冷雨，也躲不過整個雨季。連思想也都是潮潤潤的。每天回家，曲折穿過金門街到廈門街迷宮式的長巷短巷，雨裏風裏，走入霏霏令人更想入非非。想這樣子的臺北淒淒切切完全是黑白片的味道……\n\
    \    雨天的屋瓦，浮漾濕濕的流光，灰而溫柔，迎光則微明，背光則幽黯，對於視覺，是一種低沉的安慰。至於雨敲在鱗鱗千瓣的瓦上，由遠而近，輕輕重重輕輕，夾着一股股的細流沿瓦槽與屋檐潺潺瀉下，各種敲擊音與滑音密織成網，誰的千指百指在按摩耳輪。「下雨了」，溫柔的灰美人來了，她冰冰的纖手在屋頂拂弄着無數的黑鍵啊灰鍵，把晌午一下子奏成了黄昏。\n\
    \    因為雨是最最原始的敲打樂，從記憶的彼端敲起。瓦是最最低沉的樂器，灰濛濛的溫柔覆蓋著聽雨的人，瓦是音樂的雨傘撐起。但不久公寓的時代來臨，臺北你怎麼一下子長高了，瓦的音樂竟成了絕響。千片萬片的瓦翩翩，美麗的灰蝴蝶紛紛飛走，飛入歷史的記憶。現在雨下下來下在水泥的屋頂和牆上，沒有音韻的雨季。樹也砍光了，那月桂，那楓樹，柳樹和擎天的巨椰，雨來的時候不再有叢葉嘈嘈切切，閃動濕濕的綠光迎接。鳥聲減了啾啾，蛙聲沉了閣閣，秋天的蟲吟也減了唧唧。七十年代的臺北不需要這些，一個樂隊接一個樂隊便遣散盡了。要聽雞叫，只有去《詩經》的韻裡尋找。現在只剩下一張黑白片，黑白的默片。\
    \                (節選自余光中 聽聽那冷雨)"
