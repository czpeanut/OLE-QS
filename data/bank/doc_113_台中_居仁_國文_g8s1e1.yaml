  stem: '黃公紹〈青玉案〉：「年年社日① 停針線，怎忍見、雙飛燕？今日江城春已半，一身猶在，亂山深處，寂寞溪橋畔。

    春衫著破誰針線？點點行行淚痕滿。落日解鞍芳草岸，花無人戴，酒無人勸，醉也無人管。」


