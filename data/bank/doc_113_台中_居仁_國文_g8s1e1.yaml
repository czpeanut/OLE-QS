  group_stem: "(四)\n    烏於禽甚黠① ，伺人音色小異，輒去不留，非彈射所能得也。關中民狃② 烏黠，以為物無不以其黠見③ 得，則之野，設餅食楮錢④\
    \ 哭塚間，若祭者然。哭竟⑤ ，裂錢棄餅而去。烏則爭下啄，啄且⑥ 盡，哭者已立他塚，裂錢棄餅如初。烏雖黠，不疑其誘也，益鳴搏爭食。至三四，皆飛從之，益狎⑦\
    \ 。迫於網，因舉而獲焉。\n  今夫世之人，自謂智足以周身⑧ 而不知禍藏於所伏者，幾何其不見賣於哭者哉！\n                      \
