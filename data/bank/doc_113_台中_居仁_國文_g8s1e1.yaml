  group_stem: "雲南 大理縣南鄉民李士桂，家世業農。家畜水牛二隻，至夜，一牛不歸，士桂往尋。昏黑中，月色初上，見田中有獸臥焉，酣聲雷鳴，以為己牛，罵曰：「畜生，如何此刻不回家！」隨即騎上。將攀其角，角不見，但聳毛耳兩隻，\
    \ 遍身狸色斑然，方知是虎，急不敢下。\n    虎被人騎，驚醒，騰身起，咆哮叫跳。士桂私念下背必為所啖，於是竭生平之力，緊握其耳，至於穿破耳輪，手愈牢固，抵死不放。虎性猛烈，騰山躍水，為棘刺所傷，次日晨刻，力盡而斃；士桂亦僵仆虎背，氣息奄然。家人尋得，抱持歸家，竟獲重生。兩腳上為虎爪所攫，肉盡骨見。醫逾年，才得平復。\n\
    \                         節錄自《子不語．執虎耳》"
