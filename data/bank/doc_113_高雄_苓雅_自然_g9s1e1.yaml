    小靜：在步驟1中，硬幣因為紙片的摩擦力與重力抵銷，因而維持靜止。

    阿飛：在步驟2中，當用手指彈飛紙片時，紙片受到一個不為零的合力後，產生加速度後飛出。

    小安：在步驟2中，紙片飛出的同時，給予硬幣一個摩擦力，但摩擦力的作用時間很短，無法明顯改變硬幣的運動狀態。

    阿濠：在步驟2中，當紙片與硬幣分離後，硬幣處於合力為0的狀態，並且因為自身慣性而掉落。

