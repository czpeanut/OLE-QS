  stem: 圖一為人體的泌尿系統和其所連接血管的示意圖，其中乙血管中的氧氣含量比甲血管多。請問尿液排出體外的正確途徑為何？
  options:
  - label: A
    content: 甲→丙→乙
  - label: B
    content: 丙→丁→戊→己
  - label: C
    content: 乙→丙→甲
  - label: D
    content: 甲→丙→丁→戊→己。
  group_stem: '臺灣洗腎人口比例相當高，盛行率高居世界第一位。依據2022 臺灣腎病年報內容指出，臺灣洗腎盛行人數近9 萬人。每年健保在洗腎的花費高達4
    百多億元，非常驚人。

    當進入第五期腎臟病(末期腎臟病)，代表病人的腎功能受損已經是不可逆的，可能就要準備進入腎臟替代療法。然而，每週來院2 到3 次的挨針及血液透析(俗稱洗腎)會明顯影響病人的生活安排，因此還有腹膜透析的選擇可減少往返醫院的次數。另外，若順利換腎則能有機會脫離洗腎，也許可帶給腎友更好的生活品質。

    但其實臺灣每年成功配對腎臟的案例數量稀少，等待時間漫長，且腎臟移植後也非一勞永逸。南投醫院的莊宗芳主任指出，接受換腎的患者仍需長期服用免疫抑制藥物降低排斥反應，並且規律返診追蹤身體狀況、監控心血管健康、養成良好生活習慣，避免感染…

    《文章改編自：南投醫院2024-10-02 新聞稿-洗腎還是換腎？末期腎臟病患者如何選擇合適的治療模式》'
