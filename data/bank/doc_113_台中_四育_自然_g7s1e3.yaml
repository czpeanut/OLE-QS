  group_stem: '「菜瓜布肺」是特發性肺纖維化的俗稱，當肺受傷時，肺泡組織會形成疤痕並逐漸變厚，此過程稱為纖維化，屬於一種不可逆的現象，無法完全恢復。纖維化後的肺會失去彈性，且因為肺泡組織變厚而無法有效進行氣體交換，導致患者出現呼吸困難、氣喘、乾咳等症狀。

