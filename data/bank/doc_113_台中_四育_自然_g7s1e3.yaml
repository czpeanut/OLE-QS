  section: 1
  number: 37
  type: single
  page: 4
  stem: 依據本文提供的資訊，下列關於麻疹的敘述，何者錯誤？
  options:
  - label: A
    content: 只要接種過麻疹疫苗，其抗體效力可以終身有效
  - label: B
    content: 麻疹病毒可透過飛沫傳播，傳染力很強
  - label: C
    content: 臺灣曾是麻疹主要流行地區，但因為推行疫苗，已能有效控制疫情
  - label: D
    content: 麻疹確診個案可能會有高燒、柯氏斑點、甚至全身皮疹等症狀。
  group_stem: '前陣子臺中出現首位本土麻疹確診個案，引發民眾陷入恐慌而搶打疫苗，臺中許多診所的麻疹疫苗都已缺貨！麻疹是什麼樣的疾病呢？它主要由麻疹病毒引起，傳染方式是經空氣、飛沫或直接與病人鼻腔或咽喉分泌物接觸，在出疹的前後
    4 天內具傳染力。因其傳染力很強，在疫苗尚未問世前，幾乎人人都會被感染。它的症狀包括會發高燒、鼻炎、結膜炎與咳嗽外，在發燒3 至4 天後口腔黏膜上會出現柯氏斑點，接著再出現全身皮疹，這也是取名為麻疹的原因。

    翻閱過去臺灣的麻疹歷史，不難發現臺灣曾是麻疹主要流行地區。根據臺灣省衛生處的統計年報記載，1953~1961 年間，每年有700~900 個麻疹死亡病例，且佔5
    歲以下兒童十大死亡原因之一。1980 年以前出生的成人，許多都因為曾經感染麻疹病毒而有抗體。1981 年以後出生的成人，則因為當時政府開始全面推行麻疹疫苗，才讓麻疹疫情有效控制。現在的小孩在出生滿12
    個月、滿5 歲及進入國小前各會接種一劑「麻疹、腮腺炎、德國麻疹混合疫苗(MMR)」進行預防，因此近年未見麻疹再爆發大流行。值得注意的是，1981 年以後出生的成人雖然小時候有打過例行性接種，但隨著時間、抗體效力會逐漸減弱。所以，若要前往麻疹流行地區，還是建議自費再接種1
    劑疫苗。

    《文章改編自：科學月刊2018-08-01 麻疹流行後的省思》'
