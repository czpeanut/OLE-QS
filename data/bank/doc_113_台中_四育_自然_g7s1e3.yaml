- id: doc_113_台中_四育_自然_g7s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 參考本文內容，下列敘述何者錯誤？
  options:
  - label: A
    content: 紅毛猩猩、大猩猩皆為外溫動物
  - label: B
    content: 渾厚皮毛、羽毛皆能防止熱量散失
  - label: C
    content: 烏龜、蜥蜴從外界環境中吸收熱能來維持體溫
  - label: D
    content: 即便是內溫動物，也需要禦寒構造以減少養分的消耗。
  group_stem: '因應入冬之後一波波大陸冷氣團南下，臺北市立動物園早已提前為動物們準備各種禦寒措施，除了增加食物的攝取份量，加上暖氣、照燈、麻布袋、乾草等禦寒設施樣樣來，讓所有怕冷的動物，在面對寒冷時都能平安溫暖度過。

    許多動物們禦寒保暖的方式和人們相近，例如靈長類動物(屬於哺乳類)中的獼猴們會選擇相互擁抱取暖，而紅毛猩猩、大猩猩、黑猩猩們則會將保育員提供的麻布袋當作披風蓋在身上保暖，或是窩在電暖器的出風口享受陣陣熱風。

    而動物園裡最需要保溫的爬蟲動物，不論戶外溫度多低，都會儘量維持生態箱在攝氏30 度左右，並提供保溫燈、夜燈、陶瓷燈及加溫板等作為輔助熱源，讓烏龜、蜥蜴、蛇等在冬天也備感溫暖。有別於怕冷的爬蟲類，具備渾厚重疊油性皮毛的大貓熊，以及身穿防水保暖羽毛的國王企鵝，對於這種冷颼颼的天氣溫度，可是喜歡的很。

    《文章改編自：臺北市立動物園2024-11-29 新聞稿-大陸冷氣團南下 動物禦寒早有準備》'
