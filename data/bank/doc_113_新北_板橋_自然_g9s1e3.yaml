  stem: 桿秤一般都會有兩組刻度與兩組秤紐，用以測量不同重量的物品，測量範圍較大的秤紐俗稱「大提」，測量範圍較小的則稱為「小提」。根據槓桿原理，圖中的秤紐1、秤紐2，何者是大提？何者是小提？
  options:
  - label: A
    content: 秤紐1 為大提，秤紐2 為小提
  - label: B
    content: 秤紐1 是小提，秤紐2 是大提
  - label: C
    content: 秤紐1、秤紐2 都是小提
  - label: D
    content: 這個桿秤沒有大提與小提的差別
  group_stem: "桿秤是一種在中華文化流傳數千年的秤重器具，由秤桿、秤紐、秤鉤與秤錘所組成，如右圖所示，秤重時選定一個支點，將重物掛在秤鉤上，並移動秤錘的位置使其左右平衡，讀取對應秤桿上的刻度即可知道物品的重量為何。\n\
    \  古代的秤桿上有十六個刻度，如下表所示，每個刻度代表一兩，十六兩即為一斤。每一兩都是用一顆星來表示，稱為「秤星」，相傳是根據天上的星宿演化而來，前六顆秤星代表南斗六星─殉星、妖星、義星、仁星、將星、慈母星，象徵上下與四方；再往後七顆則代表北斗七星─天樞、天璇、天璣、天權、玉衡、開陽、搖光，象徵用秤者立於天地間，要像北斗七星指示方向一樣公正不偏頗；秤桿的尾端是福星、祿星、壽星，用來告誡生意人要誠實信用、不欺騙，否則，少一兩無福，短二兩少祿，缺三兩折壽。\n\
    | 南斗六星 | 南斗六星 | 南斗六星 | 南斗六星 | 南斗六星 | 南斗六星 | 北斗七星 | 北斗七星 | 北斗七星 | 北斗七星 | 北斗七星 |\
    \ 北斗七星 | 北斗七星 | 尾三星 | 尾三星 | 尾三星 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\
    \ :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| 殉星\
    \ | 妖星 | 義星 | 仁星 | 將星 | 慈母星 | 天樞 | 天璇 | 天璣 | 天權 | 玉衡 | 開陽 | 搖光 | 福星 | 祿星 | 壽星\
    \ |"
  shared_asset: g3_37_40
  uncertain_spans:
