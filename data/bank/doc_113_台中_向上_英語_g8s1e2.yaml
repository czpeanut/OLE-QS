  - label: C
    content: leave their school bags at home
  - label: D
    content: try to put as many things as possible (盡可能) in their school bags
  group_stem: '(No.7 ~ No.10)

    A high school in the US has a “No School Bag Day” every year. On this day, students     7.    .
    They have to find different ways to carry their books, pencil cases, and lunch.
    There is even a prize for the person     8.    ! So, lots of students work hard
    to think of an interesting idea.

    Last year, some students had special ideas. One student used a cookie box when
    another student brought a garbage can and pulled his pencils and sandwiches out
    of it. There were also people using a violin case, a large bowl, and a supermarket
    trolley. Last year’s big prize winner     9.    . She used her old clothes, water
    paper, and bottles to make the basket. She showed people that we could look good
    and help our planet at the same time.

    The idea for “No School Bag Day” came from students and teachers after they watched
    a movie about kids from poor families. The kids in the movie don’t have money
    for school bags. They use trash from home or the streets to carry their workbooks.
    The high school started this special day to remind students     10.     and not
    to waste things. It’s a fun way for students to be thankful for everything in
    life and be creative at the same time! Isn’t it good?

    garbage can 垃圾桶 / trolley 手推車 / winner 獲勝者 / waste 廢料 / bottle 瓶子 / planet 星球
    / trash 垃圾/ remind 提醒 / waste 浪費 / thankful 感恩的 / creative 有創造力的'
