  group_stem: '(No.11 ~ No.12)

    Welcome to the Metro Science Museum

    Opening Hours:

    | Tuesday - Friday | 9:30 – 17:30 |

    | Saturday - Sunday | 9:30 – 18:30 |

    ＊The ticket office stops selling tickets an hour before the museum closes.

    Ticket Prices:

    | Regular | NT$ 100 |

    | Student (13 years old and above) | NT$ 70 |

    | Student (6-12 years old) | NT$ 50 |

    | Child (under 6 years old) | Free |

    | Senior (over 65 years old) | Free |

    Notes:

    ＊ No smoking, loud noises, running, or climbing.

    ＊ Eating and drinking are allowed in our restaurants.

    ＊ Taking photos is welcome, but please do not use flash.

    ＊ Do not bring pets (except service animals) or dangerous items into the museum.

    ☆ Tickets are free for students on Saturdays.

    Learn more at www.metroscience.edu.tw or call us at (03)378-5560


