- id: doc_113_台中_向上_英語_g8s1e2_s4_1
  section: 4
  number: 1
  type: single
  page: 1
  stem: What is the main idea of the poem (詩)?
  options:
  - label: A
    content: Friendship is not important.
  - label: B
    content: Bullying is part of life.
  - label: C
    content: We should (應該) work together and not bully others.
  - label: D
    content: We should be strong when being bullied.
  group_stem: '(No.1 ~ No.3)

    Bullying is wrong, we all know,

    Hurting others makes us feel low.

    Respect your friends, be kind each day,

    Help each other in every way.

    Words can hurt, so choose them right,

    Let’s all be friends, and not fight.

    When someone’s down, lift them high,

    Together we’ll rise, you and I.

    A smile, a hug, a helping hand,

    That’s how we make our friendship stand.

    No more bullying, let’s be strong,

