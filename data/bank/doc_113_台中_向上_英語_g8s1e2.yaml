- id: doc_113_台中_向上_英語_g8s1e2_s4_4
  section: 4
  number: 4
  type: single
  page: 2
  stem: What do professional pushers do in Japan?
  options:
  - label: A
    content: They drive trains.
  - label: B
    content: They assist (協助) people to fit into crowded trains.
  - label: C
    content: They make sure everyone buys a ticket.
  - label: D
    content: They clean train stations.
  group_stem: '(No.4 ~ No.6)

    People around the world have many different jobs. Some jobs are unique and interesting!

    In Japan, there are professional pushers. These workers help people get on crowded
    trains during busy hours. They push people into the train carefully to make sure
    everyone can fit safely.

    In the Netherlands, some people are bicycle fishers. They clean rivers and canals
    by pulling out old bikes from the water. This job keeps the water clean and aims
    to protect fish and plants.

    In the USA, there are ice cream tasters. These workers try many different ice
    cream flavors each day to find the best ones. They also help make new flavors,
    like chocolate peanut butter or mango swirl!

    Another interesting job is a panda caretaker in China. Panda caretakers take care
    of baby pandas. They feed, wash, and play with them. This gives the pandas a great
    environment to grow strong and stay healthy.

    These special jobs help people, animals, and the environment!

     unique 獨特的 / professional 專業的 / crowded 擁擠的 / canal 運河 / aim to 旨在 / protect
    保護 / flavor 口味 / swirl 旋轉 / environment 環境'
