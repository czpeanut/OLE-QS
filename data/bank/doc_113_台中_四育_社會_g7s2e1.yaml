  group_stem: "二、請閱讀下列短文並回答問題。\n    青少年會接觸毒品通常有兩個原因：第一，親子關係溝通不良；第二，父母親疏於跟子女對話、傾聽子女心聲。\n\
    \    另外，青少年需要同儕，如果遇到年齡相近的藥頭慫恿，在好奇心驅使下可能就會嘗試看看，像小孩子學抽菸，通常第一次抽菸會覺得又苦又嗆，但心裡想著：「不抽好像跟大家不一樣。」還是要裝樣子抽，就這樣慢慢上癮了，而吸毒也是這樣。"
