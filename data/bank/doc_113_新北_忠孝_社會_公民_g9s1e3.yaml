- id: doc_113_新北_忠孝_社會_公民_g9s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 13.依據上文判斷，兌換下列何國貨幣的匯率最高？
  options:
  - label: A
    content: 美金
  - label: B
    content: 英鎊
  - label: C
    content: 澳幣
  - label: D
    content: 歐元。
  group_stem: '◎ 請閱讀以下文章，並回答以下第13-14題：

    出國前可先至銀行兌換準備前往國家的外幣。由於各家銀行給的匯率不同，在兌換前可以先查看哪家最划算。常較差。

    假如在國內沒有提供兌換該國貨幣的服務，可以先換取流通性較高的外幣，到當地再兌換。除了到時候兌換方便外，有些額外行程也可用美金來付款。而兌換時記得以大面額為主，因為到了當地銀行，面額大的匯率會比面額小的來得佳。

    假如要攜帶信用卡或是國際提款卡，一定要確認卡片已經開卡，也要確認可以在即將前往的國家消費或提款。


    | 幣別 | 現金匯率-本行買入 | 現金匯率-本行賣出 |

    | :--- | :--- | :--- |

    | 美金 | 30.31 | 30.98 |

    | 港幣 | 3.773 | 3.977 |

    | 英鎊 | 35.66 | 37.78 |

    | 澳幣 | 20.55 | 21.33 |

    | 日圓 | 0.2227 | 0.2355 |

    | 歐元 | 31.84 | 33.18 |'
