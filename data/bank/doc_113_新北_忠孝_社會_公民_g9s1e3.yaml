    假如在國內沒有提供兌換該國貨幣的服務，可以先換取流通性較高的外幣，到當地再兌換。除了到時候兌換方便外，有些額外行程也可用美金來付款。而兌換時記得以大面額為主，因為到了當地銀行，面額大的匯率會比面額小的來得佳。

    假如要攜帶信用卡或是國際提款卡，一定要確認卡片已經開卡，也要確認可以在即將前往的國家消費或提款。


