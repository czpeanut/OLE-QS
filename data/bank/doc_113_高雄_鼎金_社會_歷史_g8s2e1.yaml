questions:
- id: doc_113_高雄_鼎金_社會_歷史_g8s2e1_s1_21
  section: 1
  number: 21
  type: single
  page: 1
  stem: 宣統3 年，革命黨人趁著清廷調動軍隊前住四川時在武昌起事，是最後革命成功的重要因素。請問：當時清廷派軍隊前往四川的原因為何？
  options:
  - label: A
    content: 對抗英法聯軍
  - label: B
    content: 對抗八國聯軍
  - label: C
    content: 打擊革命運動
  - label: D
    content: 鎮壓保路運動。
- id: doc_113_高雄_鼎金_社會_歷史_g8s2e1_s1_22
  section: 1
  number: 22
  type: single
  page: 1
  stem: 滿清政府長期以來積弱不振，進行多次的改革活動亦未收到良好的效果，為此開始有人主張使用武力推翻清廷，才能救亡圖存。請問：當時主張革命最力者是誰？
  options:
  - label: A
    content: 康有為
  - label: B
    content: 林則徐
  - label: C
    content: 梁啟超
  - label: D
    content: 孫中山。
- id: doc_113_高雄_鼎金_社會_歷史_g8s2e1_s1_23
  section: 1
  number: 23
  type: single
  page: 1
  stem: 為了祝賀中華民國的生日，全國各地舉行慶祝國慶的活動。請問：中華民國國慶日，是為了紀念革命黨人士在何地起義成功？
  options:
  - label: A
    content: 武昌
  - label: B
    content: 廣州
  - label: C
    content: 上海
  - label: D
    content: 北京。
- id: doc_113_高雄_鼎金_社會_歷史_g8s2e1_s1_24
  section: 1
  number: 24
  type: single
  page: 1
  stem: 西元1911 年10 月武昌起義後，長江以南各省紛紛脫離清廷統治，西元1912 年元月1 日孫中山就任臨時大總統，宣告亞洲第一個民主共和國正式成立，此共和國的名稱為何？
  options:
  - label: A
    content: 中華民國
  - label: B
    content: 中華人民共和國
  - label: C
    content: 中華民主共和國
  - label: D
    content: 中華人民民主共和國。
- id: doc_113_高雄_鼎金_社會_歷史_g8s2e1_s1_25
  section: 1
  number: 25
  type: single
  page: 1
  stem: 武昌起義時，各省紛紛響應，並且自組臨時政府，推派臨時大總統，這反映出何種歷史意義？
  options:
  - label: A
    content: 革命思潮已成為時代趨勢
  - label: B
    content: 清廷呈現地方自治的結果
  - label: C
    content: 君主立憲的成功
  - label: D
    content: 變法改革的成效。
- id: doc_113_高雄_鼎金_社會_歷史_g8s2e1_s1_26
  section: 1
  number: 26
  type: single
  page: 1
  stem: 民國2 年，國民黨贏得國會大選的大半席次，使袁世凱深感威脅，有傳言他密謀刺殺國民黨的實際領袖。請問：當時國民黨的領袖為何人？
  options:
  - label: A
    content: 梁啟超
  - label: B
    content: 黎元洪
  - label: C
    content: 宋教仁
  - label: D
    content: 段祺瑞。
- id: doc_113_高雄_鼎金_社會_歷史_g8s2e1_s1_27
  section: 1
  number: 27
  type: single
  page: 1
  stem: 有張民國初年描繪當時政治的漫畫，一隻老猿拿著大刀，上方寫著「專制」，標題為「刀大殺人多」，諷刺北京政府主政者為鞏固權力而不擇手段，破壞得之不易的民主共和體制。請問：此幅漫畫批評的對象為何人？
  options:
  - label: A
    content: 孫中山
  - label: B
    content: 袁世凱
  - label: C
    content: 梁啟超
  - label: D
    content: 宋教仁。
- id: doc_113_高雄_鼎金_社會_歷史_g8s2e1_s1_28
  section: 1
  number: 28
  type: single
  page: 1
  stem: 中華民國立國之初，以《臨時約法》確定民主立國思維，更是後來憲法的前身，請問：針對約法的描述，何者正確？
  options:
  - label: A
    content: 民國初年，《臨時約法》替「總統制」提供了法源
  - label: B
    content: 雖然總統權力不大，但《臨時約法》仍受各路軍閥尊重
  - label: C
    content: 袁世凱稱帝後廢除《臨時約法》，故孫中山發起「護法運動」
  - label: D
    content: 孫中山為了維護《臨時約法》，號招國會議員成立廣州政府。
- id: doc_113_高雄_鼎金_社會_歷史_g8s2e1_s1_29
  section: 1
  number: 29
  type: single
  page: 1
  stem: 民國史上的軍閥割據時期，大約從何時開始？
  options:
  - label: A
    content: 廢止《臨時約法》之後
  - label: B
    content: 復辟事件之後
  - label: C
    content: 孫中山死後
  - label: D
    content: 袁世凱死後。
- id: doc_113_高雄_鼎金_社會_歷史_g8s2e1_s1_30
  section: 1
  number: 30
  type: single
  page: 1
  stem: 附圖是民國初年的《新青年》雜誌，這本雜誌是民初新知識分子發表看法與言論的重要刊物。請問：在這本刊物中不會看到何種主張？
  options:
  - label: A
    content: 鼓吹民主與科學的真諦
  - label: B
    content: 鼓吹男女平權、婚姻自由的觀念
  - label: C
    content: 褒揚儒家傳統價值文化的珍貴
  - label: D
    content: 強調個人自由的重要。
