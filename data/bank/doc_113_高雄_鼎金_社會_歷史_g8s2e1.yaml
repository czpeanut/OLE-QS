- id: doc_113_高雄_鼎金_社會_歷史_g8s2e1_s1_31
  section: 1
  number: 31
  type: single
  page: 1
  stem: 上海自清末開港通商以來，成為西方文化輸入中國的重要管道，呈現高度現代化的風貌。請問：清末到民初，上海的改變不包括哪一項？
  options:
  - label: A
    content: 街頭有電車行駛
  - label: B
    content: 晚上可以逛百貨公司
  - label: C
    content: 家裡有乾淨的自來水可以喝
  - label: D
    content: 新知識分子提倡「古文運動」。
- id: doc_113_高雄_鼎金_社會_歷史_g8s2e1_s1_32
  section: 1
  number: 32
  type: single
  page: 1
  stem: 由於下列何項改革運動的推動，使得一些中國舊社會的思想和文化遭到否定與挑戰？
  options:
  - label: A
    content: 自強運動
  - label: B
    content: 新文化運動
  - label: C
    content: 立憲運動
  - label: D
    content: 革命運動。
- id: doc_113_高雄_鼎金_社會_歷史_g8s2e1_s1_33
  section: 1
  number: 33
  type: single
  page: 1
  stem: 銘茹在網路搜尋某人資料時，出現以下的名詞：「引進西方思潮」、「白話文運動」、「新青年雜誌」。請問：銘茹應該是在搜尋何人的資料？
  options:
  - label: A
    content: 宋教仁
  - label: B
    content: 黎元洪
  - label: C
    content: 陳獨秀
  - label: D
    content: 孫中山。
- id: doc_113_高雄_鼎金_社會_歷史_g8s2e1_s1_34
  section: 1
  number: 34
  type: single
  page: 1
  stem: 北京大學的前身是「京師大學堂」，設立於戊戌變法時。民國初年，下列何人接任北京大學校長後，竭力鼓吹自由學風，並延攬各地人才入校授課，因此北大在新文化運動扮演重要角色？
  options:
  - label: A
    content: 胡適
  - label: B
    content: 陳獨秀
  - label: C
    content: 蔡元培
  - label: D
    content: 孫中山。
- id: doc_113_高雄_鼎金_社會_歷史_g8s2e1_s1_35
  section: 1
  number: 35
  type: single
  page: 1
  stem: 民初新文化運動期間，新知識分子大力倡導全面學習西方文化，大力鼓吹的觀念是何者？
  options:
  - label: A
    content: 倫理、民主
  - label: B
    content: 立憲、傳統
  - label: C
    content: 民主、科學
  - label: D
    content: 倫理、道德。
- id: doc_113_高雄_鼎金_社會_歷史_g8s2e1_s1_36
  section: 1
  number: 36
  type: single
  page: 2
  stem: 明華在《中國近代人物漫畫集》一書中，看到如附圖的漫畫，從畫中內容判斷，這個人物應是下列何者？
  options:
  - label: A
    content: 胡適
  - label: B
    content: 宋教仁
  - label: C
    content: 梁啟超
  - label: D
    content: 康有為。
