- id: doc_113_高雄_鼎金_社會_歷史_g8s2e1_s1_37
  section: 1
  number: 37
  type: single
  page: 2
  stem: 胡適提出「八不主義」：言之有物、不摹倣古人、講求文法、不作無病之呻吟、不用爛調套語、不用典、不講對仗、不避俗字俗語。請問：胡適的「八不主義」較符合新文化運動的哪一訴求？
  options:
  - label: A
    content: 引進「德先生」與「賽先生」
  - label: B
    content: 打倒孔家店
  - label: C
    content: 推行白話文運動
  - label: D
    content: 推崇共產主義。
- id: doc_113_高雄_鼎金_社會_歷史_g8s2e1_s1_38
  section: 1
  number: 38
  type: single
  page: 2
  stem: 中國傳統女性向來重視端莊婉約，身負三從四德的期待，直至清末民初受西方思潮影響，女性自主意識逐漸提升，這與下列何者的發展最有密切關係？
  options:
  - label: A
    content: 政府政策的推廣
  - label: B
    content: 學校教育的重視
  - label: C
    content: 報刊媒體的宣導
  - label: D
    content: 名人光環的影響。
- id: doc_113_高雄_鼎金_社會_歷史_g8s2e1_s1_39
  section: 1
  number: 39
  type: single
  page: 2
  stem: 民國8 年(西元1919 年)五四運動開始，陸續發生了罷工、罷市等浪潮，中國的反日民族主義達到高峰，最後中國代表拒絕簽署對德國的《凡爾賽和約》。請問：下列哪一個群體是推動五四運動的主要力量？
  options:
  - label: A
    content: 軍閥政客
  - label: B
    content: 大學學生
  - label: C
    content: 鄉村農民
  - label: D
    content: 城市工人。
- id: doc_113_高雄_鼎金_社會_歷史_g8s2e1_s1_40
  section: 1
  number: 40
  type: single
  page: 2
  stem: 「這個運動的發生，不僅是因為巴黎和會後人們由於失望而產生具大的情感落差，還因為這次的『外交失敗』引發對以往北京政府親日政策的不滿，於是各種衝突都接著愛國運動而併發出來。」請問：這段引文所提及的「這個運動」當為以下何者？
  options:
  - label: A
    content: 新文化運動
  - label: B
    content: 野百合學運
  - label: C
    content: 保路運動
  - label: D
    content: 五四運動。
