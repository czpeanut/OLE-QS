  stem: 根據上文對「雅舍」與「項脊軒」的描述，下列說明何者錯誤？
  options:
  - label: A
    content: 「一几一椅一榻，酣睡寫讀，均已有著。」由「雅舍」的簡樸可見作者淡泊樸實的性格。
  - label: B
    content: 「借書滿架，偃仰嘯歌，冥然兀坐，萬籟有聲。」可見作者在「項脊軒」中悠然自得的神態。
  - label: C
    content: 「雅舍」因地勢較高，便於賞月；「項脊軒」因坐南朝北，得賞明月半牆之景。
  - label: D
    content: 「雅舍」前梨樹在月升中天的幽絕之景，近似「項脊軒」庭中桂影珊珊可愛之狀。
  group_stem: '(二)

    甲  「雅舍」宜月夜──地勢較高，得月較先。看山頭吐月，紅盤乍涌，一霎間，清光四射，天空皎潔，四野無聲，微聞犬吠，坐客無不悄然！舍前有兩株梨樹，等到月升中天，清光從樹間篩灑而下，地上陰影斑斕，此時尤為幽絕。直到興闌人散，歸房就寢，月光仍然逼進窗來，助我凄涼。細雨蒙蒙之際，「雅舍」亦復有趣。推窗展望，儼然①米氏章法，若雲若霧，一片彌漫。但若大雨滂沱，我就又惶悚不安了，屋頂溼印到處都有，起初如碗大，俄而擴大如盆，繼則滴水乃不絕，終乃屋頂灰泥突然崩裂，如奇葩初綻，砉然一聲而泥水下注，此刻滿室狼藉，搶救無及。此種經驗，已數見不鮮。「雅舍」之陳設，只當得簡樸二字，但灑掃拂拭，不使有纖塵。……我有一几一椅一榻，酣睡寫讀，均已有著，我亦不復他求。但是陳設雖簡，我卻喜歡翻新布置。                   註：①米氏：米芾，為北宋書畫家。        (節錄自梁實秋〈雅舍〉)

    乙  項脊軒，舊南閤子也。室僅方丈，可容一人居。百年老屋，塵泥滲漉，雨澤下注，每移案，顧視無可置者。又北向，不能得日；日過午已昏。余稍為修葺，使不上漏。前闢四窗，垣牆周庭，以當南日。日影反照，室始洞然。又雜植蘭、桂、竹、木於庭，舊時欄楯，亦遂增勝。借書滿架，偃仰嘯歌，冥然兀坐，萬籟有聲。而庭階寂寂，小鳥時來啄食，人至不去。三五之夜，明月半牆，桂影斑駁，風移影動，珊珊可愛。                             (節錄自歸有光〈項脊軒志〉)'
