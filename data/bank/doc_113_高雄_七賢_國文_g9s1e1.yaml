  stem: 下列關於雲林縣「醫消聯防系統」的說明何者正確？
  options:
  - label: A
    content: 使警消人員面臨緊急傷患時，可以請求醫院的支援。
  - label: B
    content: 緊急狀況下，醫生可攜帶管制藥品外出做醫療處置。
  - label: C
    content: 為及時救治危急病人，醫生可直接執行截肢手術以穩定生命徵象。
  - label: D
    content: 病患的超音波、心電圖上傳雖能被同步判讀，卻可能面臨資料外流。
  group_stem: '（三）                               搶救病患！雲林縣展開「醫消聯防」計畫

    重大創傷受困事件發生時，受困在機具、車輛中的傷者很可能處於生命徵象不穩定的狀況，此時消防人員除了協助排除障礙、提供緊急救援外，更要請求協調醫院派人到場支援。但在事發當下一邊救援，一邊等醫生趕來的滋味並不好受，雲林縣
    消防局 緊急救護科的一位科員如此形容：「消防團隊第一次覺得如此無力。」

    不只雲林縣，全臺的消防隊執行緊急救護時都面臨相同的難題：是否需要醫生出勤？醫生到場該如何行動？依據緊急醫療救護法，緊急傷病與大量傷患救護得請求醫院出勤支援，但各縣市缺乏承辦細則，即便醫師到場，也沒有明確責任範圍。高級緊急救護技術員經過授權後能在現場執行超音波掃描、針刺減壓等措施，但若身處嚴重車禍或震災現場，需要為傷者打嗎啡麻醉全身，或立刻評估是否執行截肢，則需由醫師協助。

    為解決困境，雲林縣 消防局啟動「醫消聯防」計畫。雲林縣 衛生局長向衛福部申請函釋，讓醫師在緊急情況下可攜帶嗎啡等管制藥品外出做醫療處置；臺大醫院 雲林分院並訂定雙軌出勤緊急救護作業程序書，除了列出醫材、藥品、裝備清單與人力調度規則，更敘明現場救治重點：除非生命徵象不穩或危險狀況，否則應盡量保持病人肢體完整，同時也說明截肢手術前須取得同意資料與使用設備等。

    在送往醫院途中，救護車上的醫消聯合診斷機制也扮演著關鍵角色。救護員將病患超音波、心電圖資料去識別化後上傳Line 群組，由醫院與消防局指揮中心護理師在線上同步判讀，如果是急性心肌梗塞，救護車就必須直接前往縣內少數有能力執行心導管手術的大醫院。以送往臺大雲林分院為例，在此機制下的病患平均能提早22
    分鐘接受治療，對於心肌梗塞、急性腦中風等需要和時間賽跑的緊急病症患者而言，結局可能大不相同。另一方面，為擴大第一線急救人數，消防局也邀請民眾一起加入救援行列：當消防局接到心跳停止案件，便會透過細胞簡訊與「急救先鋒app」，召喚民眾就近前往執行CPR。在此機制下，去年雲林縣心肌梗塞病人急救成功人數提升10
    倍，到院前心跳停止病人存活率則提升了57%。

    雲林的醫院、病床數與消防人力等結構面資源，在全國幾乎都敬陪末座，但透過凝聚「提升急救韌性是首要目標」的共識，加上創意與資源的共享，劣勢也能被成功翻轉。                         (引用自
    〈來煲閱讀粥餓點靈〉 第188 期)'
