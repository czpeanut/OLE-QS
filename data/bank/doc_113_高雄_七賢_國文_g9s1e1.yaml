  group_stem: "(一)\n    嘉靖間，一士人候選京邸。有官矣，然久客①橐空，欲貸千金，與所故遊客談。數日報命，曰：「某中貴允爾五百。」士人猶恨少，客曰：「凡貸者例以厚②贄先。③內相性喜諛，苟得其歡，即請益非難也。」士人拮据，湊貸器幣，約值百金，為期人謁及門。堂軒麗巨，④蒼頭、廬兒皆曳綺縞，兩壁米袋充棟，皆有「御用」字。久之，主人出。壯橫肥，以兩童子頭抵背而行，享禮微笑，許貸八百。廬兒曰：「已晚，須明日。」主人可之。士人既出，喜不自勝，客復屬耳：「當早至，我俟於此。」及明往，寥然空宅，堂下煤土兩堆，皆袋所傾。問主宅者，曰：「昨有內相賃宅半日，知是誰何？」客亦滅跡，方悟其詐。\n\
