  group_stem: 'Jimmy sent messages to Ted yesterday.


    [Jimmy]: Hi, Ted. I’m trying to decide which streaming service to pay for. I didn’t
    use any one of them before. Do you use any?

    [Ted]: My family use one. It’s OK if you like some special TV shows, I guess.
    If you want movies, however, you have to pay more.

    [Jimmy]: How are the TV shows?

    [Ted]: Most of them are for families and kids. I think they are not so interesting.
    I think my parents might stop the service.

    [Jimmy]: I found one with movies and TV shows. Also, it says you can watch them
    on up to three devices. Perhaps we could share that one. If we get one more person
    to share it with us, it will only be about NT$116 a month! You can’t get news
    or sports on it, however.

    [Ted]: That’s OK. I don’t like news or sports so much. Anyway, let me think about
    it.


