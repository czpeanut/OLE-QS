  group_stem: 'The Festival of Lights in India

    Diwali, the festival of lights, is one of the most important festivals in India.
    People celebrate it for King Rama’s victory. King Rama was a nice king and his
    people loved him very much. One day, a bad king Ravana made the world become dark
    and he also took away Rama’s wife, Sita. Rama was very angry and decided to save
    Sita. With the help of his people and the power of light, Rama saved Sita successfully.
    People celebrated Rama’s victory together by lighting up oil lamps and candles
    to show the road back home for Sita. So, the festival of Diwali stands for a day
    of light, love, and the victory of good over evil.

    Diwali is usually in October or November, and it lasts five days. On each day
    of Diwali, people have different things to do. They pray for health on the first
    day and also buy jewelry on this day. On the second day, they clean up their houses
    and throw away old things. The third day is the important day of this festival.
    By lighting up candles and lamps, people pray for a happy life and family. The
    fourth day is the day to prepare vegetables and fruit for their gods. On the last
    day of Diwali, family get together to pray for each other by giving out gifts.
    Even now, Indian people all around the world celebrate Diwali.

