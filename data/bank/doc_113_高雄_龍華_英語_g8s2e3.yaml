  group_stem: 'Vitoria Bueno: A Dancer Without Arms

    It’s not easy to become a ballet dancer, and it’s even harder for a person without
    arms. However, Vitoria did it. She shines with her beautiful dance moves.

    Vitoria is from a small town in Brazil. She was born without arms in 2005. People
    in the town thought she was a strange girl and were curious to see her. To make
    her body stronger, her mom began to take her to ballet classes when she was five.
    This changed her life. She practiced hard and became a great dancer. The training
    of dancing also helped her to do everything with her feet, like brushing her teeth
    and combing her hair.

    Over the past few years, Vitoria shared many videos of her dancing on Instagram.
    She even went to some talent shows and became more and more famous. For her, having
    no arms didn’t stop her to follow her dreams. If you watch her beautiful dance,
    it’s hard to notice that she is different. She said, “For me, arms, they are just
    a detail. I follow with my eyes as if they were there.” She also said, “I don’t
    feel like I need them at all.” Vitoria’s story tells us that if you believe in
    yourself and never give up, anything is possible.

