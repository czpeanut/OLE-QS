- id: doc_113_新北_桃子腳_社會_g7s1e3_s2_49
  section: 2
  number: 49
  type: single
  page: 4
  stem: 下列敘述何者符合師大附中學生自治情形？
  options:
  - label: A
    content: 學生可在校務會議中選出學生代表
  - label: B
    content: 學生會的外食提案，代表家長的意見
  - label: C
    content: 師大附中的學生在校務會議中有發言權
  - label: D
    content: 校務會議是學生自治活動，教師不應參與
  group_stem: '【題組四】請閱讀下文，回答第49 題~第50 題：

    師大附中爭取午餐外食再度失敗。在校務會議上，學生會的提案在 4：90 的懸殊票數差距下被否決。師大附中學生會表示，這次的提案已經是十分完整的版本，對於外出與教室的管理皆有專員或糾察隊負責，希望師長能信任師大附中的學生們；但校務會議裡的老師卻仍對糾察隊效率、學生安全與自律性有所質疑，因而有
    4：90 的票數產生。

    雖然說午餐外食在臺灣鮮有先例，師大附中算是爭取外食的先鋒之一，校方的不信任與強硬還是在師大附中的學權面前立起高牆，學生會再次無功而返。

    在能容納百人的會議室裡，4 位穿著高中制服的學生，面對滿會議室師長的質疑與批判，仍然闡述著自己的理想與方案，只為了在學權的路上，把這所學校推得更遠一些，確實不易。

    ──王中富，〈學生自治「治」什麼（下）我從師大附中「午餐外食案」，看臺灣校風與「自由」的距離〉，《換日線》'
  answer:
  - C
