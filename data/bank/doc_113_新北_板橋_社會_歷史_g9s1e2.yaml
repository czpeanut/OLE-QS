  group_stem: 「聖索菲亞大教堂」屹立於今日的土耳其伊斯坦堡，已有 1500 年歷史。1453 年異教徒軍隊踏入此地，並更名為聖索菲亞清真寺。1934
    年土耳其共和國凱末爾總統簽署政令，將聖索菲亞清真寺改名為「博物館」——象徵著聖索菲亞並不專屬於某一個宗教，而是人類共同的文化遺產。2020 年 7 月，土耳其政府發出新聞稿，宣布因國家最高行政法院判決
