- id: doc_113_新北_板橋_社會_歷史_g9s1e2_s1_18
  section: 1
  number: 18
  type: single
  page: 1
  stem: 西元69 年羅馬帝國皇帝尼祿下令親信放火燒毀首都羅馬，導致三分之二羅馬城被燒成灰燼。放火的一刻，尼祿本人並不在羅馬，為轉移視線，直指放火集團為基督徒，由此展開羅馬史上首次大規模迫害基督徒的活動。請問下列何者最有可能是其原因?
  options:
  - label: A
    content: 羅馬帝國嚴格規定一神信仰
  - label: B
    content: 基督教士涉及宮廷政爭
  - label: C
    content: 基督徒意圖推翻羅馬帝國
  - label: D
    content: 基督徒拒絕膜拜羅馬皇帝。
- id: doc_113_新北_板橋_社會_歷史_g9s1e2_s1_19
  section: 1
  number: 19
  type: single
  page: 1
  stem: 「喬治走在街上，看著商店陳列著來自東西方的各種商品，並且聽聞執政者相當重視文化保存，延攬學者翻譯許多古希臘的文獻。」請問以上描述的應該是何時何地的場景?
  options:
  - label: A
    content: 3 世紀的羅馬城
  - label: B
    content: 6 世紀的君士坦丁堡
  - label: C
    content: 8 世紀的巴格達
  - label: D
    content: 10 世紀的威尼斯。
- id: doc_113_新北_板橋_社會_歷史_g9s1e2_s1_20
  section: 1
  number: 20
  type: single
  page: 1
  stem: 「他與士兵看到發光的十字架懸在空中，上面寫著”勝利在這個標記中”。他以這個標記做為旗幟，戰勝競爭者成為羅馬皇帝。次年，他頒布《米蘭詔書》，這是基督教在歷史上第一次取得政府的承認。」請問這位羅馬皇帝是何人?
  options:
  - label: A
    content: 戴克里先
  - label: B
    content: 君士坦丁
  - label: C
    content: 狄奧多西
  - label: D
    content: 查士丁尼。
- id: doc_113_新北_板橋_社會_歷史_g9s1e2_s1_21
  section: 1
  number: 21
  type: single
  page: 1
  stem: 伊斯蘭乃阿拉伯地區重大的宗教、社會改革，穆罕默德也被視為社會改革者。伊斯蘭教興起前的阿拉伯半島，社會貧富不均、不公不義，以及多神信仰充斥，使得阿拉人渴望有救世主的出現。請問根據以上敘述，下列哪一個答案最正確?
  options:
  - label: A
    content: 伊斯蘭教宣揚平等，反對剝削
  - label: B
    content: 穆罕默德被視為唯一真神
  - label: C
    content: 阿拉伯人並不歡迎伊斯蘭教的出現
  - label: D
    content: 伊斯蘭教為多神信仰。
- id: doc_113_新北_板橋_社會_歷史_g9s1e2_s1_22
  section: 1
  number: 22
  type: single
  page: 1
  stem: 教宗發布敕令，開除皇帝的教籍。受此影響，所有臣民將不效忠服從他。因此皇帝無法顧及自己尊貴的身分，冒著寒冬，前往羅馬赤足站在教堂門口請求教宗原諒。請問上述情景可能發生於何時何地?
  options:
  - label: A
    content: 1 世紀的耶路撒冷
  - label: B
    content: 4 世紀的羅馬
  - label: C
    content: 8 世紀的德國
  - label: D
    content: 11 世紀的君士坦丁堡。
- id: doc_113_新北_板橋_社會_歷史_g9s1e2_s1_23
  section: 1
  number: 23
  type: single
  page: 1
  stem: 資料一：甲的核心思想是上帝自動將拯救賜予信仰祂的人。資料二：乙主張一個人能否得救，是神所預定，僅憑善行或懺悔並無法改變命運。關於甲、乙兩位宗教改革家的說明，正確的是哪一項?
  options:
  - label: A
    content: 甲肯定閱讀聖經的重要性。乙則否定
  - label: B
    content: 甲反對教宗權威，乙則堅持尊崇教宗
  - label: C
    content: 甲是馬丁路德，乙是喀爾文
  - label: D
    content: 甲和乙皆認為要廢除教會組織。
- id: doc_113_新北_板橋_社會_歷史_g9s1e2_s1_24
  section: 1
  number: 24
  type: single
  page: 1
  stem: 美萱在撰寫某一時期的歷史報告：人類開始擺脫以神為中心的思維，開始用敏銳的感官觀察世界 …迎接萬物復甦的四月節本由教會舉辦，如今由民間自發舉行，人們穿著華麗的服裝載歌載舞。請問此段報告的主題，最可能是下列何者?
  options:
  - label: A
    content: 古希臘哲學的突破
  - label: B
    content: 東西貿易復甦與文藝復興
  - label: C
    content: 宗教改革與宗教的世俗化
  - label: D
    content: 理性的昂揚與科學革命。
- id: doc_113_新北_板橋_社會_歷史_g9s1e2_s1_25
  section: 1
  number: 25
  type: single
  page: 1
  stem: 義大利傳教士利瑪竇於明末來到中國，除從事傳教工作外並與士大夫徐光啟合譯《幾何原本》，對 中國影響很大。關於利瑪竇所屬的教派，下列敘述何者正確？
  options:
  - label: A
    content: 清末來台灣傳教的馬雅各也同樣屬於其教派
  - label: B
    content: 重視教士的紀律和素質，重振羅馬公教聲望
  - label: C
    content: 由西班牙人喀爾文所創立
  - label: D
    content: 成立背景是為改革希臘正教的內部問題。
- id: doc_113_新北_板橋_社會_歷史_g9s1e2_s1_26
  section: 1
  number: 26
  type: single
  page: 1
  stem: 十四世紀知名作品《神曲》，描述誤入黑暗森林的但丁，被三隻猛獸攔住去路，古羅馬詩人維吉爾的靈魂出現，帶領他去遊歷地獄、煉獄和天堂。請問：與但丁同時代的創作者們應當會有下列何種特色？
  options:
  - label: A
    content: 創作語言全為拉丁文
  - label: B
    content: 藝術創作的表現風格為神聖莊嚴
  - label: C
    content: 藝術家創作限縮於宗教主題
  - label: D
    content: 受拜占庭學者影響，許多學者對希臘羅馬文化產生研究興趣。
- id: doc_113_新北_板橋_社會_歷史_g9s1e2_s1_27
  section: 1
  number: 27
  type: single
  page: 1
  stem: 法國作家費力克斯在某書中提到：「羅馬，貪婪欺騙了你。你從綿羊身上剪走太多羊毛。你的貪念太強，甚至願意為了錢，赦免信眾的罪行。」請問作家主要是因為何事而發出感慨?
  options:
  - label: A
    content: 5 世紀西羅馬帝國的腐敗
  - label: B
    content: 11 世紀基督教分裂
  - label: C
    content: 16 世紀的教會腐敗
  - label: D
    content: 17 世紀三十年戰爭。
- id: doc_113_新北_板橋_社會_歷史_g9s1e2_s1_28
  section: 1
  number: 28
  type: single
  page: 2
  stem: 史家評論某地的歷史發展，指出：這個地方因具備良好的地理條件，當地人們繼承古代文化遺產，率先從中世紀轉變到近代，創造出新的時尚。「某地」是指
  options:
  - label: A
    content: 義大利
  - label: B
    content: 西班牙
  - label: C
    content: 日耳曼
  - label: D
    content: 希臘半島。
