  section: 1
  number: 29
  type: single
  page: 2
  stem: 「中古時期，民眾以宗教為人生的依據，故建築便以X 樣式最為發達。高聳的尖塔，強調垂直向上；另外搭配彩色玻璃，大量引進光。彷彿告誡觀者說：『望著天上，使你們的靈魂與上帝接近！』」文中的X
    應是哪種樣式的建築？
  options:
  - label: A
