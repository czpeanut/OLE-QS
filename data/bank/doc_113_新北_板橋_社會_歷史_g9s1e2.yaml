  section: 1
  number: 32
  type: single
  page: 2
  stem: 某大學歷史系期末上演戲碼：「16 世紀英格蘭國教的創立」。場景一：國王聘請律師引用舊約聖經：「如娶寡嫂為妻者，將遭受天譴」，要求教宗允許當事人離婚，但教宗藉故拖延。場景二：國王宣稱教宗侵害王權，並說服國會廢止向教宗繳納貢金的條款。請問根據上述內容，下列說法何者正確?
  options:
  - label: A
    content: 國教創立後，僅更改部分宗教規範，教宗仍為教會領袖
  - label: B
    content: 國王取代教宗，且主張信徒不須遵從聖經
  - label: C
    content: 國教創立後，國王成為教會的領袖
  - label: D
    content: 教宗同意離婚，國王承認教宗權威。
