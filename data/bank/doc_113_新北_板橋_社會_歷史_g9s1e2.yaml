- id: doc_113_新北_板橋_社會_歷史_g9s1e2_s1_30
  section: 1
  number: 30
  type: single
  page: 2
  stem: 中世紀後期西歐商業活動逐漸活絡，帶動城市興起，請問這樣的現象最可能是下列哪個因素造成?
  options:
  - label: A
    content: 君主提倡商業，有獎勵措施
  - label: B
    content: 發現新的航線，增加貿易機會
  - label: C
    content: 阿拉伯人建立長程貿易網路
  - label: D
    content: 十字軍戰爭打開東西方世界的貿易往來。
