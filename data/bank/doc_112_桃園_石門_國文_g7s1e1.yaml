  type: single
  page: 4
  stem: 文中作者的母親以騎馬為喻，提醒作者合宜的處世哲學，有關其中的對應分析，何者最為恰當？
  options:
  - label: A
    content: '| 騎馬情境／姿態 | 人的處境比喻 |

      |---|---|

      | 登向高處 | 面臨困境，挫敗 |'
  - label: B
    content: '| 騎馬情境／姿態 | 人的處境比喻 |

      |---|---|

      | 往山下走 | 迎接勝利，狂妄 |'
  - label: C
    content: '| 騎馬情境／姿態 | 人的處境比喻 |

      |---|---|

      | 騎馬者挺起背脊 | 無懼逆境，堅強 |'
  - label: D
    content: '| 騎馬情境／姿態 | 人的處境比喻 |

      |---|---|

      | 騎馬者身子前傾 | 接受無常，淡然 |'
  group_stem: "（二）\n    小時候我很喜歡畫馬，某日完成了一幅獵人騎馬登山圖，正得意時，母親過來對我說：「馬背上的人坐得太挺了，你要知道，身子要向前傾，否則人跟馬都容易翻倒。」\n\
    \    過了不久，我又畫了一幅騎馬下山的畫，母親看了還是不滿意：「這次你畫中人物的身子又過於向前傾了，騎馬下坡時，馬固然往山下走，人卻要坐得挺，如果騎手也跟著馬向前傾，就容易滑下去。」我有些懊惱：「為什麼有這麼多規矩呢？反正人騎馬，愛怎麼騎就怎麼騎！」母親說：「這就好比處世，當馬向高處爬時，彷彿是你得意的時刻，愈得意愈要謙恭，所以人要向前傾；至於下山，則彷彿失意時，固然是往坡下溜，你反而要坐得挺、撐得直。」\n\
    畫馬／劉墉"
