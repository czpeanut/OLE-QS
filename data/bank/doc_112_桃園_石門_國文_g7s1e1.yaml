- id: doc_112_桃園_石門_國文_g7s1e1_s5_28
  section: 5
  number: 28
  type: single
  page: 4
  stem: 依據文意，文中挖空處最適宜填入下列何者？
  options:
  - label: A
    content: 坐以待斃
  - label: B
    content: 相敬如賓
  - label: C
    content: 軟硬兼施
  - label: D
    content: 耳提面命。
  group_stem: "（三）\n    如果在沙漠中迷路怎麼辦？很多人都不會＿＿＿＿，而是選擇試探去尋找水源，期待最終找到綠洲或者被駱駝隊營救。但研究人員告訴我們，最好的方法是在原地找到一塊岩石，然後坐在岩石的陰影下等待。可以把鮮豔的衣服、頭巾壓在岩石顯眼的位置，這樣更可能被搜救車隊或飛機發現。如果你在不知道方向和水源的情況下行動，急於尋找出路，反而會因為運動過多，大量消耗身體水分。\n\
    \    另外，現實中大部分的救援，都會從最後推算的失蹤地點開始，沿著計畫路線進行第一輪搜救。如果你不明方向地行走，最大的可能是讓搜救隊離你越來越遠，拖延自己可能被發現的時間。在沒有明確方向和目標的情況下，你所做的努力大多是無效的。留在原地，反倒可能是最可靠的方法。\n\
    無效的努力／張璐"
