- id: doc_112_桃園_石門_國文_g7s1e1_s5_25
  section: 5
  number: 25
  type: single
  page: 4
  stem: 依據文章內容，本文並未提供螢火蟲的哪一項訊息？
  options:
  - label: A
    content: 蛻變歷程
  - label: B
    content: 銳減危機
  - label: C
    content: 發光原理
  - label: D
    content: 食性棲地。
  group_stem: "（一）\n    螢火蟲是一種會發光的肉食性甲蟲類，全世界已知的螢火蟲大約有兩千多種，大都生活在熱帶和亞熱帶地區，目前台灣的螢火蟲大約有三十幾種，最常見的是台灣窗螢。\n\
    \    螢火蟲的一生經歷了卵、幼蟲、蛹和成蟲四個時期，是完全變態的昆蟲。每年六月，雌螢火蟲會在水邊的苔癬或水草上產卵。剛產下的卵是乳白色的小粒，不久會逐漸變硬而呈現黃褐色，經過一個月後，就開始孵化成幼蟲。\n\
    \    幼蟲生活在水中或潮濕的地方，主要吃水邊的螺類和蝸牛，螢火蟲會先用唾液麻痺獵物，然後分泌消化液把肉分解為液體，再用口器吸食。到了五月，幼蟲會在地上挖洞，然後在洞裡脫皮，化成蛹。幼蟲通常要脫六次皮才會變成蛹，等到30\
    \ 天後，就可以羽化變成蟲。成蟲可活15 天左右，通常只喝露水，雄螢火蟲有兩對發光器，雌螢火蟲則只有一對發光器，但雌螢火蟲的體型比雄螢火蟲的體型大，所以發的光也會比較亮。\n\
    \    為何螢火蟲從卵到成蟲都會發光呢？原來是因為螢火蟲的尾部發光器內含有螢光素，牠們可以藉由呼吸讓發光酶產生氧化作用，因而發出亮光。螢火蟲無論雌雄都會發光，可以用來尋找配偶。雄螢火蟲飛離地面幾米後後閃動螢光，雌螢火蟲在地面上或樹梢上呼應，指引雄蟲牠們自己飛來。每種螢火蟲的螢光都有其獨特的閃爍頻率，以便牠們尋找到合適的配偶。\n\
    資料來源：教育部 教育百科 網站"
