  section: 2
  number: 33
  type: single
  page: 6
  stem: 根據本文，下列敘述何者正確？
  options:
  - label: A
    content: 「三白妝」是宋代女性的一種打亮妝容，象徵單純貞潔
  - label: B
    content: 宋代因經濟發展較佳，飾物較唐代更為華貴精緻
  - label: C
    content: 宋代女性的妝容風格相較唐代更為清新淡雅
  - label: D
    content: 「珍珠妝」是宋代上流社會女性獨有的高貴造型
  group_stem: "今年暑假，中國古裝劇《墨雨雲間》中，女演員們臉上的珍珠妝引發網友熱議。\n  在劇中常可以看見女性角色臉上的「珍珠妝」，呈現一種氣質的古典美。這種妝飾是真實存在的嗎？\n\
    \  在宋朝（960-1279 年）年間，女性的「珍珠妝」是一種高貴而華麗的化妝風格，特別是在貴族社會中受到青睞，與之前的唐代濃妝豔抹風格不同，更強調自然與優雅。這種妝容以精緻的妝面和飾物為特色，主要包括以下幾個方面：\n\
    1.面妝：臉部肌膚打底通常使用輕薄的粉質，使皮膚看起來白皙細膩。宋朝女性偏愛自然的美感，因此妝容較淡雅。\n2.眉妝：流行畫細長的柳葉眉或是月牙眉，眉型柔美，給人一種溫婉、優雅的感覺。\n\
    3.眼妝：眼妝一般較為淡雅，強調眼部的自然美，偶爾會用淡淡的眼影來增強眼部的輪廓。\n4.唇妝：唇色多為紅色或粉色，唇形以小巧、圓潤為美。常用花瓣和蜜調製的唇脂來塗抹雙唇，使其顯得鮮艷欲滴。\n\
    5.珍珠飾品：承襲自唐朝的花鈿妝，但是宋朝比較不喜歡花鈿的豔麗感，因此改用有純潔自然含義的白色珍珠取代。珍珠可以嵌在額頭、鬢角或是點綴在發髻上。這些珍珠飾品不僅增添了妝容的華麗感，也象徵著富貴和高雅。\n\
    6.髮型：髮型也非常講究，經常會搭配各種髮飾如步搖、金簪、銀釵等，再加上珍珠的點綴，使整個造型更加富麗堂皇。\n  「珍珠妝」同時搭配上「三白妝」的妝容，在女子額頭、鼻子、下巴三處塗上白色粉末進行提亮，在唐宋明時期的畫作中都可以看到「三白妝」的出現，反映了當時社會對美的獨特理解和追求。\n\
    （改寫自《ETtoday 新聞雲》、《E-Port 學習情報誌》)"
