    「同溫層效應」的發散可能造成個人認知及資訊安全危機，而面對不同的危機，應正視問題並採取適當的策略，將損失及損害降至最低。

    （一）擴大取得資訊的管道

    網路社群網站或影音平台已經成為許多民眾獲取資訊的主要管道，但由於③客製化演算法會隨著時間優化，與本身同溫層意見相左之訊息幾乎不會出現，導致個人認知越來越同化，無法融入真實社會氛圍。所以要脫離同溫層舒適圈最好的方法就是增加取得資訊之管道，尤其是與自身立場不同的意見管道。例如不要專注在單一社群媒體，除了臉書，還可以選擇各類新聞、雜誌等平台，接受多元觀點，來打破本身築起的認知高牆。

    （二）聆聽多面向的意見

    聆聽不同面向的意見可以修正扭曲的偏好認知，建構更全面的社會價值。因此不妨觀看批評你的留言、閱讀朋友貼文上的評論及養成分享前先閱讀內文等網路習慣。

    （三）培養良好網路使用習慣

    在使用社群網站平台時，先確認訊息內容的正確性，不要隨便點選置入廣告或連結，以免洩漏個資或被植入惡意軟體，並定期更新系統軟體，提高資訊安全防護力。

    ④身處網路資訊時代，多數的訊息來自於社群網站或平台，我們可以自由選擇自己想要觀看的內容，但也選擇性地忽略不同於己的意見，導致觀點過於狹隘。因此所產生的同溫層效應可能會帶來個人認知及資訊安全危機。應正視問題核心，透過擴大取得資訊管道、聆聽多元意見及培養良好網路使用習慣的策略，進而建構更全面的社會價值和包容的社會氛圍。

    (節選自吳旻純)'
