  type: single
  page: 2
  stem: '(甲)南朝的時候／我打此經過寫了幾首詩／和女子調笑他們戲稱我為／帝王／歷史要數說我亡國的罪愆／但是／我的罪／何止亡國？

    (乙)安祿山踏碎的山河／你要用格律來修補／家書無影，弟妹失蹤／飲中八仙都驚醒成難民／浣花溪不是曲江／卻靜靜地繞你而流。

    (丙)不如學仙去／你原本是一朵好看的青蓮／腳在泥中，頭頂藍天／無需潁川之水／一身紅塵已被酒精洗淨。

    (丁)一出塞無奈就天高地邈／一把慷慨的琵琶／憑她纖纖的手指／撥撥刮刮／能彈壓幾千里的飛沙。

