  stem: '文學體裁各有其特色，請將下列作品按照「古詩、樂府、近體詩、宋詞」的順序排列出來，正確的排序應為何者選項？

    (甲)涉江采芙蓉，蘭澤多芳草。采之欲遺誰？所思在遠道。還顧望舊鄉，長路漫浩浩。同心而離居，憂傷以終老。。

    (乙)林花謝了春紅，太匆匆，無奈朝來寒雨晚來風。  胭脂淚，相留醉，幾時重。自是人生長恨水長東。

    (丙)舍南舍北皆春水，但見群鷗日日來。花徑不曾緣客掃，蓬門今始為君開。盤飧市遠無兼味，樽酒家貧只舊醅。肯與鄰翁相對飲？隔離呼取盡餘杯。

    (丁)江南可採蓮，蓮葉何田田。魚戲蓮葉間，魚戲蓮葉東，魚戲蓮葉西，魚戲蓮葉南，魚戲蓮葉北。'
