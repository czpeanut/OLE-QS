- id: doc_113_新北_忠孝_國文_g9s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: '冕旒是古代最尊貴的一種禮帽，《正字通．方部》：「旒，以絲繩貫玉，垂冕前後也。」

    冕冠兩側，各有一孔，用以穿插玉笄，使冕冠與髮髻拴結。玉笄兩端各垂一顆珠玉，因其下垂及耳，故稱為「充耳」。充耳不塞入耳內，只是繫掛在耳旁，以提醒皇帝切忌聽信讒言，這就是「充耳不聞」這個詞的來歷。

    據說，置旒的目的是為了「蔽明」，意思是王者身為領袖，視事觀物，必須洞察大體而能包容細小的瑕疵。


    根據以上敘述，下列何者所戴的帽子最可能是「冕旒」？

    （圖片來源：擷芳主人《大明衣冠圖志》）'
