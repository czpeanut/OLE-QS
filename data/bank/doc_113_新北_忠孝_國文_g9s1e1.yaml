- id: doc_113_新北_忠孝_國文_g9s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 4
  stem: 張曼娟〈人間好時節〉：「我們必須有一首，或是幾首詩，要放進人生的行囊裡，足以抗禦這詭譎多變的人間。」根據這段文字，作者對於詩的看法，與下列何者最不相同？
  options:
  - label: A
    content: 詩句精華點出那意義閃亮的價值觀，閱讀後熟稔詩句、詩人、歷史、典故，更重要的是，那些亙古流傳閃閃發光的信念和價值，也一併入心。（林怡辰）
  - label: B
    content: 唐詩是多麼優美而深刻的世界。那不是過去的遺跡，而是現代的預演，因為活著總面臨了永恆的課題，生老病死，追求與幻滅，企慕與絕望，尤其是愛與缺憾，我們就在生生不息的生命之鏈上古今共鳴，祕音交響。（歐麗娟）
  - label: C
    content: 在成長過程中，背誦了許多經典唐詩。這種讀詩的習慣，自然而然，培養出長大後對語言的講究，包括日常生活與人交談，包括講電話、問路，包括演講、教學，只要用到語言，很自然總是會想，如何讓語言有韻律感，讓語言能夠有清晰的節奏。這就是童年背詩讀詩，在不知不覺中受到的薰陶訓練吧。（蔣勳）
  - label: D
    content: 人間行路，當我們走過越多，心境越是蕭索荒涼，此時讀詩最好，歷代經典詩作，常能讓我們得到很大的慰藉，原來，古詩人早已經歷過這些，而留下了字字珠璣，那些詩都是我們心靈的知己，陪著度過這孤寂的時光，跨越了時空的遙遠隔離，而能相互應和與理解。（琹涵）
