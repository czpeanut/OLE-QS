  group_stem: '2024 美國總統大選，民主黨在總統拜登放棄連任後，改推副總統賀錦麗（Kamala Harris）出馬，共和黨則由黨內初選所向披靡的前總統川普（Donald
    J. Trump）掛帥。

    有別於多數總統制國家的公民直選，美國總統大選採「選舉人團制度」的間接選舉，並非由普選票最多者勝出，而是必須在50 州拿到夠多的選舉人票（electoral
    vote）。先由各州選出州的選舉人，再由選舉人代表所屬州投票，以保障各州的自治性及權益。各州選舉人數量反映人口規模，目前全美總共538 張選舉人票，加州最多，有54
    張，人口數較少的州也有至少3 張；拿到過半數以上選舉人票者贏得總統大選。

    美國共有48 州遵循「贏者全拿制」，誰拿到比較多普選票，就拿下該州所有選舉人票；僅有內布拉斯加州和緬因州的制度稍有不同。內布拉斯加州共有5 張選舉人票，贏得全州普選的候選人可以得到其中2
    張選舉人票，另外3 張選舉人票由在內州3 個眾議員選區內獲得最高票的候選人贏得；緬因州採取相近制度，唯一差別在於緬因只有4 張選舉人票，眾議員選區也只有2
    個。

    (文章及圖片來源：中央社)'
