  group_stem: '【8~10】

    People have drunk tea for centuries. There are black tea, green tea, white tea,
    and more. East Asia might have been home to tea plants, but people in the UK know
    best about Earl Grey.

    This delicious, sweet-smelling tea has been popular in the UK and US for over
    100 years. Earl Grey was named after an earl. It uses black tea and oil from the
    bergamot, a fruit with a strong lemon smell.

    To make Earl Grey in the right way, first boil the water. Heat the water and keep
    it at 97℃, just under the boiling point. If the water is too hot, it will burn
    the tea leaves. Add a little water into the teapot, turn it around, and then pour
    it out. This warms up the teapot so the tea can taste its best. Next, put the
    tea leaves in the teapot and add the hot water. Let it sit for three to five minutes,
    and then pour it into your cup and add sugar. Enjoy your delicious Earl Grey!

     Asia 亞洲 plant 植物 earl 伯爵 lemon 檸檬

    burn 燒壞 teapot 茶壺 pour 倒 bergamot 佛手柑'
