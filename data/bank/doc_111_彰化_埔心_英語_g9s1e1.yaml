  group_stem: '【13~15】

    Mark：I can’t believe it! We have a week all to ourselves.

    Reba：I know. It has been too long since the last time. Also, my mom just called
    and gave me an update on the kids. They’re really enjoying themselves, so we don’t
    need to worry about them.

    Mark：That’s good to hear that. We need to thank her when we get back.

    Reba：Why don’t we give her some gifts? She will love it.

    Mark：That’s a great idea! Let’s do that in the middle of the week because it’s
    going to be wet and rainy.

    Reba：I agree, and that’s also the perfect time to visit the museum.

    Mark：I can live with that, but I also want to spend one whole day at the beach.

    Reba：Of course! There will be suny in the sky on the second day or on our last
    day here, so we can do that on either day.

    Mark：Earlier will be better because it will be warmer.

    Reba：OK, then on the other day, we can go flying kites. A shop between our hotel
    and the beach sells them.

    Mark：Sure! I haven’t done that for a long time, and maybe we can get the kids
    some.

