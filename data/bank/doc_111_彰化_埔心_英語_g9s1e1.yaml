  group_stem: '【6~7】

    It has been more than 30 years since one special group held the first beach cleanups
    in the USA. Some of the big cleanups were in Texas, Oregon, New Jersey, and California.
    Since then, the idea has grown into a common activity all over the world. Now,
    more than 150 countries come together to take part in beach cleanups each year,
    and Taiwan is one of them.

    People join beach cleanups because they want to take care of the world and oceans.
    However, there is a problem. To get more people to come to the cleanups, some
    organizers give out free lunches and bottled water. As a result, the bottles add
    to the trash. To fix this, people should bring their own lunches and thermoses
    to cut down on the number of used bottles. After all, where does trash come from
    if people don’t even have things to throw away?

     beach cleanup 淨灘 take part in 參與 organizer 組織者

