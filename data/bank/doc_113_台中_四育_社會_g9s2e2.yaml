  group_stem: (二) 可可豆是指可可樹長出的果實裡的種子。果實成熟期為4 到6 個月，每年成熟兩次，主要收穫期為10 月到12 月。可可豆的產地主要分布於赤道兩側，南北緯約20
    度以內的區域，因其喜歡溫暖、多雨的環境，最適合可可豆生長。現今可可豆主要的產地有東南亞、迦納非洲、中南美洲等地。可可豆是製作巧克力的最主要原料，近年發起公平貿易運動的組織，希望全球大眾將注意力放在種植可可豆的幾個主要國家，特別是迦納等非洲國家勞工常使用童工的現象，他們要求巧克力生產公司不應使用涉及奴役童工所生產的可可豆，且可可農收成可可豆後，僅獲得終端產品售價6.6%的利潤，其餘利潤被層層的中間商和加工業者拿走。
