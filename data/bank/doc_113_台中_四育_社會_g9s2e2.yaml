  stem: '以下為皓皓在某雜誌上看到的專題報導，從內容可推論南韓的何種社會狀況？

    在臺灣和南韓，人們會用「含著金湯匙出生」來形容有錢人家的小孩。南韓更進一步，把家庭收入分成「金湯匙」、「銀湯匙」、「銅湯匙」、「土湯匙」，甚至是最貧困的「屎湯匙」。

    南韓研究指出， 依據父母親所得的高低，子女的就學選項與「成功比例」，相差十分巨大。'
