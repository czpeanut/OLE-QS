    ◎英國前首相卡麥隆為避免就業歧視的行為，推動一項政策，要求政府單位徵人時，不能事先詢問對方的姓名，以免非白人姓氏的求職者無法獲得前來面試的機會。

    ◎南韓前總統文在寅為了改善就業市場的風氣，宣布一項措施，當求職者應徵公家機關，在履歷表上可以不用填入學歷、出生地等資料，希望只以個人能力高低決定是否錄取。'
