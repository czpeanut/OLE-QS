- id: doc_113_台中_四育_社會_g9s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '近年甲國媒體常報導嚴重車禍事故，讓民眾認為交通狀況變得越來越危險，甚至要求政府應加強取締並檢討交通政策。某位學生想了解這幾年間實際交通安全情況，並找到了如圖所示資料，圖中顯示甲國近年車禍死亡件數，以及用「車禍」為關鍵詞搜尋國內網路新聞的搜尋結果數量。請根據圖表內容判斷，下列何者最可能是他探究的結論？

    【改編113 年會考】灰色長條：代表甲國每年車禍死亡件數。黑色折線：代表使用「車禍」為關鍵詞的新聞搜尋結果數

    縱座標:件數；橫坐標:年代'
  options:
  - label: A
    content: 車禍案件減少代表政府交通政策完全成功
  - label: B
    content: 網路新聞搜尋量變化與實際事故數量變化一致
  - label: C
    content: 媒體報導次數增加可能會影響民眾對事件的感受
  - label: D
    content: 民眾對交通安全的關注會讓車禍數量迅速下降。
