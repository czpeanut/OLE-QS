- id: doc_113_台中_四育_社會_g9s2e2_s2_56
  section: 2
  number: 56
  type: single
  page: 8
  stem: 根據上文判斷，何場戰爭並非與故宮文物遷徙有關？
  options:
  - label: A
    content: 中日戰爭
  - label: B
    content: 國共內戰
  - label: C
    content: 甲午戰爭
  - label: D
    content: 日軍佔領東北。
  group_stem: "(一)故宮博物院院藏品源自宋、元、明、清四朝宮廷收藏，1924年10月下旬，直系將領馮玉祥（1882-1948）發動北京政變；攝政內閣總理黃郛於11月4日內閣會議中通過＜修正清室優待條件＞，要求遜帝溥儀（1906-1967）「從即日起永遠廢除皇帝尊號」、清室應「即日移出宮禁」。1925年4月12日，清室善後委員會為滿足各界一睹故宮狀況之殷望，特公布＜參觀故宮暫行規則＞。9月29日，清室善後委員會議決仿照法、德諸國皇宮博物館先例，成立故宮博物院，並於雙十國慶日下午舉行開幕大典。1925年10月10日，故宮博物院正式成立，對外開放。\n\
    \    1931年，日本關東軍發動九一八事變，侵佔東北，平津局勢岌岌可危。故宮未雨綢繆，特擇院藏文物菁華裝箱儲置，為文物播遷避難預作準備。1937年，蘆溝橋事變爆發，故宮南遷文物再分三批向後方撤退。1948年秋，國共戰爭形勢逆轉，當時集議主張擇精品運臺；另朱家驊先生建議遷運中央圖書館所藏善本圖書，傅斯年先生則提以中央研究院歷史語言研究所考古文物隨同搬遷赴臺。\n\
    \    1949年8月，行政院為肆應戰時環境，特暫將故宮博物院、中央博物院籌備處、中央圖書館等單位合併為國立中央博物圖書院館聯合管理處，由教育部統攝。1950年4月，聯管處設於臺中霧峰北溝之文物庫房完工，全部遷臺文物入庫存貯。\n\
    \    1961年5月，聯管處應邀赴美舉行「中國古藝術品展覽會（Chinese Art Treasures）」，歷時年餘，頗獲美國各界讚嘆激賞。其後政府以北溝地位偏僻，難以吸引國內外人士前往參觀，乃籌劃於臺北近郊外雙溪興建新館。1965年8月，院廈修築完成，行政院繼又將中央博物院籌備處運臺文物併入故宮博物院，並公布〈國立故宮博物院管理委員會臨時組織規程〉，將管理委員會隸屬行政院。"
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 歷史
      code: 3-2
      title: 第二次世界大戰
      chapter: 第3章 戰間期與第二次世界大戰
    textbook: 九下歷史 3-2 第二次世界大戰
    labeled_by: ai
