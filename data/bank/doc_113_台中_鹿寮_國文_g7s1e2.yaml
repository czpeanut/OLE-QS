  group_stem: "2018年流傳一段影片，片中美國前總統歐巴馬竟語出驚人地說：「川普總統完全是個笨蛋！」儘管片中歐巴馬臉部表情、肢體語言都像極了他，但卻不是本尊。影片隨後出現演員皮爾，原來這是他模仿的影片，藉由深偽技術，竟可變成歐巴馬說話的片段。美國媒體製作這段影片的目的在提醒大眾，此類影片極可能成為操縱輿論的利器。當宅潮氾濫時，散布者的罪惡感也會相對減少，最大的危機就是造成民眾對社會產生不信任感，逐步地破壞民主制度。\n\
    \    深偽技術能製作的除了影像，也包括文字與聲音。一般人說的「人工智慧」，是一個很大的架構，其中一個領域是「機器學習」。而深偽技術是屬於「機器學習」裡的「深度學習」，它是以深度神經網路為架構，對資料表徵進行學習的演算法。\n\
    \    深度學習技術在偽造影像的生成與辨識，是運用「生成對抗網路」，由「生成器」和「辨識器」兩個神經網路組成。生成器就像是演算法透過大量資料去學習狗的模樣，直到可以畫出狗。辨識器則是可以分辨畫的狗和照片的狗。這兩個模型結合後，就像是一邊有一個人畫狗，另一邊有一個老師說這跟真的狗差很多，所以畫的人要再修改。直到有一天這個人畫的狗能騙過老師，而老師在一次次判斷中也越來越厲害。<u>偽造影像的生成與辨識，就是生成器和辨識器之間的競賽</u>。\n\
    \    深偽技術是近年新興的科技，若將它運用於影視作品，可節省製作電影或遊戲的時間，有正面的效益。但也有人利用合成的假影像操弄資訊，進而詐騙牟利、毀人聲譽，製造社會的動盪，讓這項技術引發爭議。\n\
    ——改寫自〈臺灣團隊研究Deep Fake影片 深偽技術的正邪之戰開打〉"
