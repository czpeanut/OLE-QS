  group_stem: '（甲）喜歡吃甜品的人，沒有不知道黑森林蛋糕的。如果說香腸是德國菜的代表，那麼黑森林蛋糕就是德國甜品的代表。不過，如果你以為在德國任何餐廳都能吃到黑森林蛋糕，那就錯了。對嚴謹的德國人來說黑森林蛋糕的生產有著嚴格的標準和流程，而且受到保護。如果廚師並未按照標準執行，或者將其他原料製成的蛋糕命名為黑森林蛋糕，甚至會有開店風險。所以許多餐廳認為自己無法達標，就選擇不做。


    （乙）根據神戶肉流通推進協議會的定義，神戶牛肉是出產於日本兵庫縣的但馬牛肉，牛隻僅能在兵庫縣出生、飼養宰殺。但馬牛飼養方式獨特，其肉為日本料理中的珍饈，特性表現為美味、肥嫩以及外所呈現的大理石紋理。二十世紀初每年甚至有八萬頭以上的輸出紀錄。目前產量稀少，且只有10%會被出口到海外。也因為如此，神戶牛肉在海外常被仿冒，如美國就有「神戶型牛肉」，是和牛與安格斯牛雜交的產品，肉品供應商希望複製神戶牛肉的生產傳統，稱他們的牛肉與神戶牛肉只有外觀上的不同，而價格則便宜很多。

    （改寫自維基百科）'
