  section: 2
  number: 29
  type: single
  page: 4
  stem: 29. 請問小明、小英、小德說的選才辦法，分別為何？
  options:
  - label: A
    content: 舉孝廉、九品官人法、科舉制度
  - label: B
    content: 科舉制度、舉孝廉、九品官人法
  - label: C
    content: 九品官人法、舉孝廉、科舉制度
  - label: D
    content: 科舉制度、九品官人法、舉孝廉。
  group_stem: '請根據閱讀資料回答以下第29、30 題：

    小明說：「漢代的選才辦法最好，因為它具有彈性，地方上名聲良好的子弟可以被舉薦到中央。」

    小英說：「魏晉南北朝時期，被選拔的人有社會和家族背景，但是由於家世為品評重點，到最後個人能力可能未必可靠。」

    小德說：「隋唐時期的選才辦法最公平，即使出身低微，也可以考上科舉，光耀門楣。」

    小美說：「但是這種辦法在明清時期越來越僵化，反而無法找到真正的人才。」'
