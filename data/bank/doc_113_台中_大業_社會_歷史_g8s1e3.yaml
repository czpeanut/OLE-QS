  section: 1
  number: 4
  type: single
  page: 1
  stem: 4. 下列哪個措施，與李鴻章的「紙糊工作」為同一時期的改革？
  options:
  - label: A
    content: 修訂憲法，實施君主立憲
  - label: B
    content: 廢除科舉，改革教育制度
  - label: C
    content: 引進西學，批判儒家思想
  - label: D
    content: 興建鐵路，學習西方技術。
  group_stem: '請根據閱讀資料回答以下第4~6 題：

    清末大臣李鴻章晚年曾感嘆說：「我辦了一輩子的事，練兵、海軍，都是紙糊的老虎，從未能大刀闊斧地辦理。」李鴻章將衰敗的清帝國形容是一間破屋，而他不過是一個用紙片裱糊破洞的工人。如果破洞是小風、小雨所造成的，他還可隨時修補，但是突如其來的強風豪雨，則讓他措手不及，既無法事先防範也無力修補。'
