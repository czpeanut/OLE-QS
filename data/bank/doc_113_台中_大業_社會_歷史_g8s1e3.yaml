- id: doc_113_台中_大業_社會_歷史_g8s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 1. 根據上文，請問資料一是哪個國家？
  options:
  - label: A
    content: 日本
  - label: B
    content: 中國
  - label: C
    content: 朝鮮
  - label: D
    content: 琉球。
  group_stem: '請根據閱讀資料回答以下第1~3 題：

    資料一：西元1860 年提出

    1.設立總理各國事務衙門處理外交事務。

    2.於北京設立同文館、上海設立廣方言館。

    3.辦船政學堂、水師學堂等新式學校，並派遣學生到外國留學。

    4.創辦輪船招商局等，推動民生經濟發展。

    資料二：西元1867 年提出

    1.天下政權當還政於天皇，政令必須由朝廷發布。

    2.設置上下議政局，設置議員討論政務，政務必須公開決定。

    3.外交關係必須由公議決定，貿易往來要和外國制定公平的制度。

    4.設置近衛軍鞏固帝都東京、擴張海軍。

    資料三：西元1885 年提出

    1.廢止對清廷的朝貢。

    2.改革地租法，杜絕弊政，充裕國庫，保護窮民。

    3.設置禁衛隊、確立警察制度，以加強社會治安。

    4.政令由大臣商議後施行。'
