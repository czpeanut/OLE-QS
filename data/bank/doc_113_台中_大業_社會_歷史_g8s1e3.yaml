- id: doc_113_台中_大業_社會_歷史_g8s1e3_s2_11
  section: 2
  number: 11
  type: single
  page: 2
  stem: 11. 依據上述資料，清末民初以來，有許多知識分子提倡女子教育，主要原因為何？
  options:
  - label: A
    content: 挖掘女性才能，培養社會人才
  - label: B
    content: 女性多半愛美，強化美德教育
  - label: C
    content: 重視男女平等，強調女性權益
  - label: D
    content: 進行社會改革，挽救國家困境。
  group_stem: '請根據閱讀資料回答以下第11~14 題：

    清末民初，不少中國知識分子看到國家的危機，開始提倡女子教育，希望能透過教育提倡社會改革，挽救國家。在傳統中國社會中，女性不是完全沒有受教育的機會，但她們所受的教育大多是在家中進行。十九世紀末開始，則出現針對女性開辦的學校。

    早期女子學校多半由外國傳教士主辦，他們不僅開設女子中小學，更建立了女子大學，提供女性接受高等教育的機會，例如華北協和女子大學、華南女子大學與金陵女子大學。中國人自己籌辦的第一所女學校，一般認為是西元1898
    年設立於上海的經正女學，可惜只辦了三年，就因為財務問題而關門。但在經正女學後，又陸續有女學開辦，就連慈禧太后都曾經親自提倡興女學。

    受過教育的女性，在社會上逐漸取得自由與地位，這是過去中國社會前所未有之事。矛盾的是，隨著女學生增加，也引發男性知識份子的焦慮。他們認為，越來越多女性受教育，可能會衝擊傳統的性別分工，破壞原來的社會秩序。'
