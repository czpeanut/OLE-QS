- id: doc_113_台中_大業_社會_歷史_g8s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 7. 根據上述資料，請問○○派遣使節團來到中國的背後目的為何？
  options:
  - label: A
    content: 打破清朝天朝上國的現狀
  - label: B
    content: 要求中國放寬對外商貿易的限制
  - label: C
    content: 爭取茶葉、絲綢貿易量的擴大
  - label: D
    content: 提供給中國更多貿易商品與選擇。
  group_stem: '請根據閱讀資料回答以下第7~10 題：

    資料四：中國自認物產豐富，不需要對外貿易，故只開放一個港口供外商使用。而中國對外商的行動有很多限制，如外出不能坐轎子，不能向官府直接收送文書，一切買賣和交涉，都透過政府指定的「公行」來代理。

    資料五：○○派遣一支七百多人的使節團來到中國，並攜帶了天文、地理儀器和鐘錶等作為獻禮，中國以為這是朝貢行動，但使節團卻是為了□□皇帝的賀壽而來，雙方為了禮儀的不同而引發爭議，最終折衷以單膝下跪的方式緩解衝突。'
