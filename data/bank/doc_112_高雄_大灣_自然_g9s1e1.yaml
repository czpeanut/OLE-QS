    content: 石英為製造玻璃的原料
  - label: C
    content: 金門、馬祖盛產花岡岩
  - label: D
    content: 花岡岩為岩漿位於地表以下，因散熱不易，使礦物有足夠時間結晶，而形成結晶顆粒較大的火成岩 。
