  section: 1
  number: 9
  type: single
  page: 1
  stem: 花岡岩是建築上常見的石材，主要組成的礦物為石英、長石、雲母。下列敘述何者錯誤？
  options:
  - label: A
    content: 在花崗岩上滴入稀鹽酸後會產生二氧化碳氣泡
