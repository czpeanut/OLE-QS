- id: doc_111_桃園_石門_社會_地理_g9s1e2_s1_43
  section: 1
  number: 43
  type: single
  page: 4
  stem: 依據附圖與上述文字，請問：依賴俄羅斯天然氣比例很高的A 國家是
  options:
  - label: A
    content: 丹麥
  - label: B
    content: 瑞典
  - label: C
    content: 法國
  - label: D
    content: 德國。
  group_stem: '(三)附圖為歐洲的北溪天然管線位置圖，圖上代號A~F 為國家，代號甲為海域，請回答43~44 題。

    北溪天然氣管道包含1 號、2 號兩條平行管道，從俄羅斯起步，穿越甲海域一直到A 國家。二條管線每年可以向歐洲輸送1100 億立方公尺的天然氣，超過了歐盟國家每年的天然氣是用量四分之一以上。

    北溪1 號管道於2011 年使用，北溪2 號已於2021 年開始測試送氣，但因為俄烏戰爭，使A 國家中止北溪2 號的審核使用權。

    北溪2 號管道總長度約1222 公里，是目前世界上最長的海底管道。美國、英國以及波蘭、烏克蘭都強烈反對北溪2 號。他們擔心，如果管線真的開始啟用營運，將會使得俄羅斯在歐洲天然氣供應上，獲得極大的控制權，也會對歐洲各國造成壓力。

    A 國家能源供應中，嚴重依賴從俄羅斯進口的天然氣。2017 年A 國家從俄羅斯進口了530 億立方公尺天然氣，占A 國家天然氣消費總量的40%。

    2022 年9 月26 日，「北溪1 號」和「北溪2 號」天然氣管道發現共有3 個位置漏氣，分別位在丹麥和瑞典的專屬經濟區，根據丹麥最新調查結果顯示，外洩原因是受到「強烈爆炸」所造成。'
  shared_asset: g1_43_44
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 地理
      code: 2-1
      title: 歐洲區域特色
      chapter: 第2章 歐洲區域特色與俄羅斯
