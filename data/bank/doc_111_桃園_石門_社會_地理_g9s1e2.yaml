- id: doc_111_桃園_石門_社會_地理_g9s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: '附圖為施工17 年、穿越A 山脈，世界當前最長也最深的瑞士聖哥達鐵路隧道位置圖。2016 年12 月通車，隧道全長57 公里，位於地表最深處達2.3
    公里，耗資約四千億台幣興建。這條雙向隧道縮短蘇黎世到米蘭一小時車程，使荷蘭鹿特丹、比利時安特衛普連接亞得里亞海熱內亞港的貨運列車承載從二千噸倍增為四千噸，除車程縮短外，每日旅運量也能增加六成有餘，達到一萬五千人。雖然瑞士並非歐盟成員國，但聖哥達鐵路隧道的完工，仍對加強歐盟整合具有重大象徵意義。而且使得日本連結本州與北海道、53.9
    公里長的青函隧道(輕津海峽)退居第二長，世界第三長隧道為全長50.5 公里之英法海底隧道(英吉利海峽)。

    請問：上述文章中的A 山脈是'
  options:
  - label: A
    content: 阿爾卑斯山
  - label: B
    content: 烏拉爾山
  - label: C
    content: 高加索山
  - label: D
    content: 庇里牛斯山。
