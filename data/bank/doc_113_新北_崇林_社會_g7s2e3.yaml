  section: 1
  number: 1
  type: single
  page: 1
  stem: 關於偏鄉孩子的敍述，以下何者「錯誤」？
  options:
  - label: A
    content: 這種社會地位是與生俱來的，會影響個人取得資源的能力與機會
  - label: B
    content: 偏鄉在閱讀資源上遠不及都會區，是族群的不平等
  - label: C
    content: 外界資源的投入，目的是提升其社會地位
  - label: D
    content: 偏鄉學習資源上面臨不公平的處境。
  group_stem: '相較於都會區學生，偏鄉孩子因為學習資源與親子陪伴較為貧乏，無法從小培養閱讀習慣。兒童福利聯盟公布調查報告，指出偏鄉孩子三大困境：閱讀的資源少、家人難陪伴、偏鄉少圖書等。

    為了不讓偏鄉學童輸在閱讀的起跑線上，外界資源的投入十分重要，無論學校的社團、學校和社區的課後安親、長假期間的營隊活動，都可以協助師長在課程之外，為孩子安排更多元的閱讀環境，讓孩子享有基本的資源。
    (文章改編自兒童福利聯盟刊物)'
