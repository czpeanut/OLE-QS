  stem: 關於外籍移工的工作待遇，以下哪些論述較符合公平正義？ (甲)外籍移工非本國籍人士，不得享受與本國人相同的工作待遇 (乙)外籍移工對於臺灣的經濟發展與建設有其貢獻，應該獲得相對的尊重與照顧
    (丙)試著用同理心換位思考，就能給予外籍移工更公平的對待 (丁)不能因外籍移工的社會地位而歧視或排擠他們。
  options:
  - label: A
    content: 乙丙丁
  - label: B
    content: 乙丙
  - label: C
    content: 甲乙丙
  - label: D
    content: 乙丙丁。
  group_stem: '中華民國114 年的基本工資是$28590。「外籍家庭看護移工」因不符合勞動基準法的標準，月薪僅為$21000。

    「外籍家庭看護工」或「家庭幫傭」的工作型態是24 小時隨時待命，但雇主必須保障移工每天有足夠的休息時間，至少8 小時以上。(勞動部資料)'
