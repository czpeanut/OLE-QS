- id: doc_113_新北_崇林_社會_g7s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: '「房價所得比」經常被拿來當作購屋難度的指標，意思是指收入中位數家庭(夫妻)，要花幾年的工作所得，才能買得起中等價位的房子。

    2023 年台灣房價所得比為22.1，代表中位數收入家庭需要耗費22.1 年的收入，才能夠買到一間中等價位的房子。台灣房價所得比在人均2 萬美元以上國家區域排名第二高。(Mr.
    Market 市場先生)

    以下評論述何者「錯誤」？'
  options:
  - label: A
    content: 人人生而自由平等，每個人都應該享有合宜價格的住宅
  - label: B
    content: 政府必須提高基本工資，強迫資方讓利給勞方以提高所得
  - label: C
    content: 臺灣的高房價讓許多人買不起房子，政府提供社會住宅以解決這個問題
  - label: D
    content: 政府提供公益出租補助，鼓勵民眾將房子租給弱勢民眾，可以減緩高房價的衝擊。
