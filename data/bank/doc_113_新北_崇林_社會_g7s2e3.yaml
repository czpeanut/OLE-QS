  group_stem: '請閱讀下面四段史料後回答問題：


    | 一 | 美國國會同意政府，繼續維持美國人民與在臺灣人民間之商業、文化及其他關係，以促進美國外交政策的推行，並在臺灣設立美國在臺協會。……任何企圖以非和平方式解決臺灣未來的作為，破壞西太平洋地區和平及穩定，美國將會關切。
    |

    | --- | --- |

    | 二 | 恢復中華人民共和國的一切權利,承認他的政府的代表為中國在聯合國組織的唯一合法代表，並立即把蔣介石的代表從它在聯合國組織及其所屬一切機構中所非法佔據的席位上驅逐出去。
    |

    | 三 | 美國願與中華民國加強合作，為維護和平與安全而建立集體防禦力量，以保障西太平洋區域的安全。雙方以軍事為基礎，進行政治、經濟、社會各方面的合作。 |

    | 四 | 美利堅合眾國承認中華人民共和國政府是中國的唯一合法政府，並承認中國的立場，即只有一個中國，臺灣是中國的一部分。在此範圍內，美國人民將同臺灣人民繼續保持文化、商務和其他非官方關係。
    |'
