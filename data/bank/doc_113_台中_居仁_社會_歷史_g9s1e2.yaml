  stem: 一本《西洋中古史》簡介寫著：「中古時期在西方歷史的斷代中，一直有著迷人又神秘的特質。它不如上古時期那麼遙遠不可及，也不像文藝復興時期那樣富麗堂皇。許多史學家說它是黑暗時代，彷彿文明停滯不前就是這段歷史的唯一重點。但事實上，中古時期的許多『發展』直接聯繫到近代歐洲的形成…。」上文中的「發展」包括下列哪件史事？
