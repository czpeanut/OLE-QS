- id: doc_113_高雄_楠梓_英語_g9s2e1_s3_47
  section: 3
  number: 47
  type: single
  page: 4
  stem: What is the best topic for the reading?
  options:
  - label: A
    content: How to be a TikTok influencer.
  - label: B
    content: How to use hashtags to shop on TikTok
  - label: C
    content: The success of TikTok short videos
  - label: D
    content: The truth behind TikTok shopping
  group_stem: '【C】 TikTok is so popular for shopping now! People use hashtags like
    #cleantok (for cleaning items) and #fashion (for clothes) to help make it easier
    to what to buy. But is it as good as it looks?

    TikTok, Instagram, and YouTube, have changed our shopping habits because these
    platforms quickly show things. Short videos, around 30 to 60 seconds, catch our
    eye to make them quick and easy to share. And TikTok is good at this.

    Besides, experts worry we might count on TikTok influencers too much. Even if
    we don’t know them well, we still believe what they say. This makes us buy things
    we may not need. What is worse, TikTok learns what we like and shows us more videos
    through the ones we watch. This could make us buy more because it''s hard to tell
    real suggestions from ads.

    However, TikTok also did something good to help the book market. With #BookTok,
    the tag makes readers hunt for books more quickly. TikTok even gives awards for
    books. The writers are thankful to #BookTok for selling more books, especially
    the ones for teenagers and love stories.

    📖 hashtag 標籤;expert 專家;influencer 網紅;suggestion 建議;ad 廣告'
