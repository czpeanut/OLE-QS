- id: doc_113_高雄_楠梓_英語_g9s2e1_s3_41
  section: 3
  number: 41
  type: single
  page: 3
  stem: What is this reading for?
  options:
  - label: A
    content: To tell people how to get to Angkor Wat.
  - label: B
    content: To tell people what life was like in Angkor Wat.
  - label: C
    content: To tell people the story about Angkor Wat.
  - label: D
    content: To tell people about the rules when they visit Angkor Wat.
  group_stem: '【A】 Angkor Wat, one of the most popular places to visit in Cambodia(柬埔寨),
    is a great 900-year-old temple complex. Each year over 2.5 million people from
    all over the world visit it.

    Angkor Wat is not only a famous landmark but also an important place for Cambodians.
    It is even on their country''s national flag. Angkor Wat means "Temple City" because
    it has more than a thousand temple buildings, and it took more than 35 years to
    build. King Suryavarman II, who killed his uncle to become king, built Angkor
    Wat to show power over the people. Angkor Wat''s design copies the home of the
    gods in Hindu stories. For example, water can be seen all around the temples,
    like the ocean in the stories. It also has five towers that look like mountains
    in a forest. The walls are filled with writings and paintings from Hindu stories.

    Angkor Wat is an amazing place you shouldn’t miss. Visit it and imagine what life
    was like there hundreds of years ago!

    📖 complex 綜合體; landmark 地標; flag 國旗; Hindu 印度; imagine 想像'
