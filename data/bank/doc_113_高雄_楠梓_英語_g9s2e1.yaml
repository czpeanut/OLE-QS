- id: doc_113_高雄_楠梓_英語_g9s2e1_s3_44
  section: 3
  number: 44
  type: single
  page: 4
  stem: What is the trick that the mosquito uses in the rain?
  options:
  - label: A
    content: It shakes its body fast enough to get water off.
  - label: B
    content: It flies behind the raindrop and pushes it away.
  - label: C
    content: It drops with the raindrop and then rolls off it.
  - label: D
    content: It rides on the raindrop and lands on the ground.
  group_stem: '【B】Sometimes when the rain falls hard and fast on you, it might hurt
    a little. But what happens when it hits a mosquito?

    A 2012 study says when a raindrop falls on a mosquito, it’s like when a bus hits
    a person. Also, the little insect is hit by a raindrop about once every 20 seconds.
    So why don’t we see many dead mosquitoes after it rains?

    A mosquito is as big as a raindrop, but it is much lighter — 0.002 g only. This
    saves its life in raindrop attacks. Because the mosquito is light, when it’s hit
    by a raindrop, it won’t experience a force that is strong enough to kill it. The
    study also found that when a mosquito is hit by a raindrop, the insect is pushed
    by the raindrop and falls together with it. But the mosquito doesn’t get wet easily
    because it is covered with hairs which keep off water. After dropping about 6
    cm, it will roll off the raindrop and fly away.

    However, this trick isn’t always successful. If the mosquito flies too low when
    it is hit by the raindrop, it won’t have time to fly off. Then it will hit the
    ground and meet its death.

    📖mosquito 蚊子;raindrop 雨滴;force 力量'
