    content: famous for something
  group_stem: '【D】 The artwork "Everydays: The First 5,000 Days" was created by Mike
    Winkelmann. He was an ordinary artist but a stranger to the art market until last
    year. But after this artwork was sold at a record-breaking price, almost 70 million
    US dollars, Mike became one of the richest living artists in the world.

    This artwork is a collage of 5,000 photos that show different moments from people’s
    lives. It took the artist 13 years to put those together. By looking at them closely,
    people can see how both people and the country have changed over time.

    Unlike the artworks people used to see in museums, "Everydays: The First 5,000
    Days" is the first digital Non-Fungible Token (NFT) artwork, which can only be
    seen on the computer. An NFT artwork is unique and comes with the artist''s name
    on it, which saves it from being copied.

    With NFT, sellers and buyers can know they are the only ones who own the artwork.
    In fact, any videos, music, photos, or digital pictures can be turned into an
    NFT. Mike’s success has turned into a new page in art history.

