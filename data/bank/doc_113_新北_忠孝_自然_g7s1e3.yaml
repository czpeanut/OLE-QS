  group_stem: '氰化物是最惡名昭彰的毒藥之一，以其殺人於瞬間的特色出現在各大小說和電影情節中，在第二次世界大戰期間，氰化氫製作的毒氣，在奧斯威辛和馬伊達內克的集中營毒殺了數千名囚犯，也是當德國戰敗的跡象越來越明顯時，納粹高層首選的自殺方法。

    無論遭謀殺的受害者是吸入氰化物氣體，或吞下溶解在飲料中的氰化物，致死方式都完全相同。一旦進入體內，氰化物就會黏附在紅血球中的血紅素上，跟著血液迅速散播到全身，破壞細胞製造生存所需能量的能力。

    粒線體位於我們每個細胞的深處，是身體裡的迷你發電廠，會與我們吸入的氧氣作用，分解食物中的葡萄糖，產生二氧化碳和水，並產生化學能量三磷酸腺苷（ATP），這是維持人類活著的能量。

    埋在粒線體膜內襯當中的是一連串的蛋白質，它們構成電子傳遞鏈，經過一系列複雜的化學反應以產生 ATP。傳遞鏈中有一個蛋白質成分稱為「細胞色素 C」，鐵原子靜靜位於細胞色素
    C 的核心，是它發揮功能的關鍵。氰化物的致死性在於它能夠與細胞色素 C 中心的鐵原子緊密結合，使整個蛋白質死亡。一旦失去活性，細胞色素 C 就不能在傳遞鏈的最後一步利用氧氣，導致
