    儘管氰化物有明顯的致命特性，但含有氰化物的食物種類多得驚人，包括杏仁、皇帝豆、大豆、菠菜和竹筍。桃子、櫻桃、蘋果和苦杏仁等植物的種子或果核都含有氰化物。食用少量氰化物不會對健康造成風險；這是因為人體內幾乎每個細胞都含有羅丹酶這種酵素，能將氰化物轉化為硫氰酸鹽。

    硫氰酸鹽是一種無害的化學物質，可以安全地被腎臟過濾並釋放到尿液中。人體每二十四小時可以處理約一克的氰化物。只有當身體無法負荷突然間湧入的大量氰化物時——特別是以殺人為目的——才會出現問題。

    摘自2024/9/8「泛科學」-「氰化物的黑暗面」'
