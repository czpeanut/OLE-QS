  stem: '下列關於人體神經系統與內分泌系統的比較，何者錯誤？【習作習題】

    | 特色 | 神經系統 | 內分泌系統 |

    | --- | --- | --- |

    | (A) 傳遞速率 | 快 | 慢 |

    | (B) 作用範圍 | 廣 | 局部 |

    | (C) 作用時效 | 短暫 | 持久 |

    | (D) 傳遞方式 | 神經傳遞訊息 | 由血液運輸 |'
  options:
  - label: A
    content: 傳遞速率：神經系統快，內分泌系統慢
  - label: B
    content: 作用範圍：神經系統廣，內分泌系統局部
  - label: C
    content: 作用時效：神經系統短暫，內分泌系統持久
  - label: D
    content: 傳遞方式：神經系統神經傳遞訊息，內分泌系統由血液運輸
