- id: doc_113_新北_忠孝_自然_g7s1e3_s4_46
  section: 4
  number: 46
  type: single
  page: 4
  stem: 閱讀完文章後，請問氰化物能致人於死的主要原因為何？
  options:
  - label: A
    content: 破壞紅血球中的血紅素
  - label: B
    content: 與細胞色素C 的鐵原子結合
  - label: C
    content: 過度消耗血液中的氧氣，使細胞缺氧
  - label: D
    content: 被羅丹酶轉化為劇毒的硫氰酸鹽，破壞細胞活性
  group_stem: '氰化物是最惡名昭彰的毒藥之一，以其殺人於瞬間的特色出現在各大小說和電影情節中，在第二次世界大戰期間，氰化氫製作的毒氣，在奧斯威辛和馬伊達內克的集中營毒殺了數千名囚犯，也是當德國戰敗的跡象越來越明顯時，納粹高層首選的自殺方法。

    無論遭謀殺的受害者是吸入氰化物氣體，或吞下溶解在飲料中的氰化物，致死方式都完全相同。一旦進入體內，氰化物就會黏附在紅血球中的血紅素上，跟著血液迅速散播到全身，破壞細胞製造生存所需能量的能力。

    粒線體位於我們每個細胞的深處，是身體裡的迷你發電廠，會與我們吸入的氧氣作用，分解食物中的葡萄糖，產生二氧化碳和水，並產生化學能量三磷酸腺苷（ATP），這是維持人類活著的能量。

    埋在粒線體膜內襯當中的是一連串的蛋白質，它們構成電子傳遞鏈，經過一系列複雜的化學反應以產生 ATP。傳遞鏈中有一個蛋白質成分稱為「細胞色素 C」，鐵原子靜靜位於細胞色素
    C 的核心，是它發揮功能的關鍵。氰化物的致死性在於它能夠與細胞色素 C 中心的鐵原子緊密結合，使整個蛋白質死亡。一旦失去活性，細胞色素 C 就不能在傳遞鏈的最後一步利用氧氣，導致
    ATP 的整個生產過程中斷。

    因為細胞運作強烈依賴 ATP 的持續供應，所以人體一旦發生氰化物中毒，中樞神經系統和心臟的細胞都會立即受到影響。當中樞神經系統關閉，受害者會開始感到頭痛和噁心，然後失去知覺，慢慢進入深度昏迷；接著大腦會進一步失去
    ATP 能量供應，直到最終耗盡所有 ATP，不可避免地造成腦死；隨著心臟中的 ATP 逐漸減少，心跳會減慢並變得不穩定，脈搏也會微弱到無法察覺，最終使心臟完全停止跳動。

    儘管氰化物有明顯的致命特性，但含有氰化物的食物種類多得驚人，包括杏仁、皇帝豆、大豆、菠菜和竹筍。桃子、櫻桃、蘋果和苦杏仁等植物的種子或果核都含有氰化物。食用少量氰化物不會對健康造成風險；這是因為人體內幾乎每個細胞都含有羅丹酶這種酵素，能將氰化物轉化為硫氰酸鹽。

    硫氰酸鹽是一種無害的化學物質，可以安全地被腎臟過濾並釋放到尿液中。人體每二十四小時可以處理約一克的氰化物。只有當身體無法負荷突然間湧入的大量氰化物時——特別是以殺人為目的——才會出現問題。

    摘自2024/9/8「泛科學」-「氰化物的黑暗面」'
