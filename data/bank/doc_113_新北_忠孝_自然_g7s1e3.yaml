  section: 1
  number: 8
  type: single
  page: 1
  stem: 死亡目前在醫學上有三種認定方式：心臟或肺臟壞死，以及腦死。其中腦死病患由於其他內臟器官尚可執行功能，因此願意遺愛人間的親屬常會簽署「器官捐贈同意書」，將可用器官移植給有需要的患者。請問腦死，指的是腦的那個部位功能已經喪失？
  options:
