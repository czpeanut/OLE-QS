- id: doc_113_新北_忠孝_自然_g7s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 佳奈進行皮膚感覺實驗時，她將左手放在甲盆、右手放在丙盆，30 秒後，將兩隻手同時放入中間的乙盆。此時，左手覺得熱，右手覺得很燙還有點痛，若甲盆的溫度是25
    度，請推下列敘述何者合理？
  options:
  - label: A
    content: 三盆水的溫度應該是甲 > 乙 > 丙
  - label: B
    content: 甲盆到乙盆覺得熱，因此乙盆應該高於25 度
  - label: C
    content: 丙盆到乙盆覺得痛，所以丙盆溫度一定是0 度
  - label: D
    content: 丙到乙盆覺得燙，甲到乙盆卻沒有，佳奈的感覺神經出現問題，需看醫生
