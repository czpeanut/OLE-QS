  stem: 為了發現真理，人們必須做兩件事情，其一就是排除一切偏見及假象。假象分成四類：一是部落假象，即各種族通行的思想方法造成的偏見；二是洞穴假象，即個人的癖好及偏見；三是市場假象，由語言錯誤所造成；四為劇場假象，也就是人們不可靠的傳統。其二就排除這些假象以後，我們必須審查自然，必須通過無數的實驗蒐集事實，把他們整理的井然有序，再找出他們存在的規律。」上述言論最可能是何人的主張？
