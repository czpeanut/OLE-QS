- id: doc_113_高雄_五福_社會_g9s1e3_s1_42
  section: 1
  number: 42
  type: single
  page: 6
  stem: '以下是法國公布的人權與公民權宣言部分內容。


    第一條：自由與平等是人與生俱來的權利，且始終不變。

    第二條：一切政治結社的目的都在於維護人類不可剝奪的權利。這些權利是自由、財產、安全與反抗壓迫。

    第三條：一切主權均根源於人民。任何團體、個人都不得行使人民未直接授予的權力。

    第十一條：自由傳達思想和意見是人類最寶貴的權利之一；因此，各個公民都有言論、著述和出版的自由，但在法律所規定的情況下，應對濫用此項自由負擔責任。


    請問下列有關敘述，有幾項是正確的？(甲)第一條的內容最可能受到洛克學說的影響 (乙)第二條的內容最可能受到孟德斯鳩的影響(丙)第三條的內容與盧梭的主張最為相近
    (丁)第十一條的內容最符合伏爾泰的論點'
  options:
  - label: A
    content: 1 項
  - label: B
    content: 2 項
  - label: C
    content: 3 項
  - label: D
    content: 4 項
