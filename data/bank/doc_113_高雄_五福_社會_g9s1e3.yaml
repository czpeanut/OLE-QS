- id: doc_113_高雄_五福_社會_g9s1e3_s1_45
  section: 1
  number: 45
  type: single
  page: 7
  stem: 下列文獻何者最有可能為1823 年「門羅宣言」的主要內容?
  options:
  - label: A
    content: 人生而具有自由和平等的權利。政治組織的目的是確保人的自然權利，這些權利是自由、財產、安全及對壓迫的反抗，是不可剝奪的
  - label: B
    content: 如果歐洲列強企圖把其制度擴張到西半球的任何區域，我們便認為這危及我們的和平與安全。我們不會干涉『舊大陸』的事物，歐洲列強也不得干預『新大陸』的事物
  - label: C
    content: 我們認為下面這些真理是不言而喻的:人人生而平等，造物者賦予他們若干不可剝奪的權利，其中包括生命權、自由權和追求幸福的權利
  - label: D
    content: 無產階級在生產過程中替少數持有生產工具的資產階級產生了剩餘產品並成為剩餘價值，此種剝削關係進而轉化為根本性的矛盾，隨著矛盾的擴大，社會的革命必將發生。
  tags:
