- id: doc_113_高雄_五福_社會_g9s1e3_s1_49
  section: 1
  number: 49
  type: single
  page: 7
  stem: 資料一、二、三按照發展的先後，其順序是？
  options:
  - label: A
    content: 資料一二三
  - label: B
    content: 資料二一三
  - label: C
    content: 資料三一二
  - label: D
    content: 資料三二一
  group_stem: '◆請閱讀下列資料，並回答第49、50 題：

    資料一：在交通運輸史上，通常人們將史蒂芬生設計的「火箭號」蒸汽火車視為世界上第一臺真正的火車，因為它奠定了蒸汽火車的基本原型。英國的第一條鐵路正式開始營運，當時的火車因不夠安全、常發生意外，故最早承載的是貨物運輸，在五年後才開始出現定期運送旅客的業務。

    資料二：蘇格蘭大學技工瓦特把蒸汽機與工廠的工作機連接在一起,使機器獲得強大、持續、穩定的動力。由於他對社會的重大貢獻，被選為英國皇家學會的一員。他使人類掌握將熱能轉化為動能的手段，突破畜力、風力和水力等自然力的限制。人類實現了以機器動力代替人力的願望,改變了生產和生活的面貌，進入「蒸汽時代」。

    資料三：政府有效利用了人力資源和自然資源，使生產率的史無前例的增長成為可能。大不列顛首先受到這方面的影響，使其資本從 1750 年的英幣 50000 萬鎊增長到
    1800 年的150000 萬鎊、1833 年的 25000O 萬鎊和1865 年的600000 萬鎊。在19 世紀後半世紀中，紐西蘭的羊毛、加拿大的小麥、緬甸的稻米、馬來西亞的橡膠、孟加拉的黃麻以及印度的棉花產量，大大促進殖民母國的經濟實力。'
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 歷史
      code: 4-2
      title: 大航海時代的開展
      chapter: 第4章 近代歐洲與多元世界
    textbook: 九上歷史 4-2 大航海時代的開展
    labeled_by: ai
