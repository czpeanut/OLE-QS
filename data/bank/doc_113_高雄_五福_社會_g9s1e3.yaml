    大陸電動車以低價進攻歐洲車市，德國汽車廠面臨百年來最大挑戰。德國福斯汽車宣佈減薪，並且預告，可能關閉「至少三家」德國工廠，裁員數萬人。這將是福斯成立87 年來，首度在德國關廠，員工相當不滿，發起萬人大罷工，工人示威遊行高舉「準備戰鬥」。福斯汽車工人：「許多即將退休的人真的很害怕，他們現在可能會失業，我是兩個孩子的母親，我每日要花一個多小時，才能來這裡上班，我熱愛我的工作，我不想失去它。」

    對於福斯而言，還有更早更大的重傷，是9 年前的「柴油門」事件。福斯汽車前執行長「溫特柯恩」，9 月出庭受審，背負最高10 年徒刑的詐欺罪名，因為在他任內，於2015
    年福斯汽車被揭發，利用非法軟體，造假廢氣排放數據。CNN 商業頻道：「福斯汽車品牌受到來自顧客，無止境的訴訟，他們的汽車已經因為『詐欺軟體』，而失去價值。」假裝符合環保標準，實則排放的氮氧化物，超過美國標準的40
    倍，影響擴及全球1100 萬輛汽車。福斯汽車因此慘賠310 億歐元，約合超過1 兆台幣的罰金跟和解金。

    (資料來源: yahoo 新聞https://tw.news.yahoo.com/2024年12月3日)'
