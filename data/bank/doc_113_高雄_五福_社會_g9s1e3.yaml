- id: doc_113_高雄_五福_社會_g9s1e3_s1_46
  section: 1
  number: 46
  type: single
  page: 7
  stem: '文件一：不是我們不顧念在英國的弟兄們，但是他們的立法機關要把無理的管轄權加在我們頭上……，我們懇求他們念在同種同宗的份上停止這種掠奪行為，但他們對這種正義和血緣的呼聲同樣充耳不聞。因此，我們不得不宣布與他們脫離……。

    文件二：組成國民會議之代表，認為無視、遺忘或蔑視人權是公眾不幸和政府腐敗的唯一原因，所以決定把自然的、不可剝奪的和神聖的人權闡明於莊嚴的宣言之中……。

    請問：關於以上兩份歷史文件的敘述，下列哪些正確？(甲)文件一的發表是受到啟蒙思潮影響 (乙)文件二的發表是受到民族主義思潮影響 (丙)文件一的發表影響到文件二的出現
    (丁)兩份文件產生的背景皆與徵稅問題有關 (戊)兩份文件發表後皆得到外力的支持'
  options:
  - label: A
    content: 甲丙丁
  - label: B
    content: 乙丁戊
