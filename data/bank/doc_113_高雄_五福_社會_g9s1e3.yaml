  - label: D
    content: 拿破崙席捲歐洲
  group_stem: '◆請閱讀以下文章，並回答第47、48 題：

    1810 年9 月16 日凌晨，千餘名印第安人聚集在多洛雷斯廣場上，聽著講台上的伊達爾哥在演講：「孩子們，你們願意成為自由人嗎？你們願意從〇〇人手中奪回自己的土地嗎？」頓時，長期積壓在人們心中的憤怒一下子爆發了出來，大家振臂高呼：「絞死〇〇強盗
    !」「打倒壞政府！美洲萬歲 !」這便是揭開墨西哥獨立運動序幕的「多洛雷斯呼聲」。

    在墨西哥獨立後，9 月16 日被定為墨西哥獨立日，每年的這一天總統都要在國家宮露台上帶領民眾呼喊「多洛雷斯呼聲」以示紀念。'
