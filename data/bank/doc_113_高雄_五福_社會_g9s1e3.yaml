- id: doc_113_高雄_五福_社會_g9s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 地球上有袋類動物起源於美洲，目前主要分布在澳洲，另外南美洲亦有少數分布，其棲地廣闊。關於澳洲有袋類物種遷移路線之一，學界有不同觀點，有的主張：早期地球有兩塊大陸，其中之一為岡瓦納大陸(包括南美洲、非洲、南極洲、澳大利亞、印度)，有袋類在該大陸內部遷移，等到該大陸分裂成現今的數個大洲後，由於澳洲地理位置的特性，才使它成為絕大多數有袋類分布區。至於在亞洲、非洲發現的有袋類化石，則與歐洲的物種關係較為密切，與澳洲有袋類關係較遠。圖三為岡瓦納大陸復原圖，圖中哪條物種遷移路線，最符合上述學界的觀點？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
