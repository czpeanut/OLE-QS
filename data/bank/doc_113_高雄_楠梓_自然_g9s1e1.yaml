  group_stem: '【題組】莫氏硬度（英語：Mohs scale of mineral hardness）是一種利用礦物的相對刻劃硬度來劃分的礦物硬度標準，由德國礦物學家弗里德里希·莫斯（德語：Friedrich
    Mohs）於1812 年提出。莫氏硬度是一種相對標準，與絕對硬度並無正比關係。

    莫氏硬度標準將十種常見礦物的硬度由小至大分為十級。具體鑒定方法是，在未知硬度的礦物上選定一個平滑面，用已知硬度的礦物加以刻劃，如果未知礦物表面出現劃痕，則說明未知礦物的硬度小於已知礦物；若已知礦物表面出現劃痕，則說明未知礦物的硬度大於已知礦物。如此依次試驗，即可得出未知礦物的相對硬度。試回答41~42
    題：'
