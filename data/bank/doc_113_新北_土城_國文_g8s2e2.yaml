- id: doc_113_新北_土城_國文_g8s2e2_s1_31
  section: 1
  number: 31
  type: single
  page: 3
  stem: 根據文章內容，宮崎駿的藝術成就受到迪士尼推崇的關鍵原因為何？
  options:
  - label: A
    content: 持續精進數位科技的能力
  - label: B
    content: 對藝術基本功的專注與堅持
  - label: C
    content: 有效節省人力成本並增加獲利
  - label: D
    content: 擁有豐富的繪本藏書與劇本
  group_stem: "前幾天去日本參觀三鷹之森吉卜力美術館，對於喜愛的宮崎駿動畫有了更深一層的體悟。\n    館內外沒有華麗的裝潢及擺設，如同動畫一貫呈現的溫暖自然風格，其中最令我印象深刻的是宮崎駿的工作室樣貌，觀察有二大特色：一是到處都是手繪稿，另外就是堆滿了書，多數非繪本畫作，而是別人的書籍。原本以為如此精緻複雜的動畫電影，應該會大量使用電腦繪圖，但是在館內的工作室中，有的只是水彩顏料、畫筆、透光畫紙及劇本簿，卻不見3C\
    \ 及手繪板。我好奇地問工作人員：「怎麼都不見電腦及印表機？」館員親切回答：「宮崎駿堅持傳統手繪，電影動畫製作幾乎全部採用傳統的手工繪製。」 經我查詢資料得知，《魔法公主》是初次嘗試數位塗料的電影，那是為了趕上電影上映的期限，才部分採用電腦繪圖。不過，之後的《崖上的波妞》，又恢復傳統的手工繪製來製作動畫。\n\
    \    宮崎駿在選材上以傳統繪畫功力為衡量標準，不懂新科技及事務處理完全不受影響。許多人建議他使用電腦處理，在商業的角度上可以更有效率，節省人工成本，獲利更高。然而，宮崎駿認為在紙上繪畫是動畫的基本，商業金錢價值顯然不在他的考量之中，難怪宮崎駿能夠成為動畫電影世界第一的迪士尼少數推崇的亞洲動畫家。\n\
    \       改寫自胡碩勻〈在東京遇見宮崎駿的創作哲學〉"
