  group_stem: '(甲)  徐志摩的文風清麗空靈、柔情繾綣，曾被譽為「當代第一才子」、「中國的雪萊」，雖以詩歌聞名，但他許多至交好友如梁實秋、葉公超、楊振聲、溫源寧、林語堂等，卻極力稱讚他的散文，認為其成就還在新詩之上。像是〈自剖〉、〈想飛〉、〈我所知道的康橋〉、〈翡冷翠山居閒話〉等都是傳世的名篇。

    (乙)   徐志摩熱情奔放，熱愛自由和美，是一個單純的理想主義者。胡適在追悼志摩一文中曾說：「他（志摩）深信理想的人生必須有愛，必須有自由，必須有美；他深信這種三位一體的人生是可以追求的，至少是可以用純淨的心血培養出來的。」'
