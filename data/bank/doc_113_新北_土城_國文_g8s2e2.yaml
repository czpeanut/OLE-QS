- id: doc_113_新北_土城_國文_g8s2e2_s1_33
  section: 1
  number: 33
  type: single
  page: 3
  stem: 根據上文，「外語就是我這位朋友的棋譜」中「棋譜」指的是什麼？
  options:
  - label: A
    content: 增進棋藝的祕笈
  - label: B
    content: 培養語言能力的寶典
  - label: C
    content: 禁錮心靈的枷鎖
  - label: D
    content: 充實生活的憑藉
  group_stem: "一位朋友幾年前進了監獄。有一次我應邀到監獄為犯人們演講，沒有見到他，就請監獄長帶給他一張紙條，上面寫了一句話：「平日都忙，你現在終於獲得了學好一門外語的上好機會。」\n\
    \  幾年後我接到一個興高采烈的電話：「嘿，我出來了！」我一聽是他，便問：「外語學好了嗎？」他說：「我帶出來一部六十萬字的譯稿，準備出版。」\n  他是刑滿釋放的，但我相信他是為自己大大地減了刑。茨威格在《象棋的故事》裡寫一個被囚禁的人無所事事時度日如年，而獲得一本棋譜後日子過得飛快。外語就是我這位朋友的棋譜，輕鬆愉快地幾乎把他的牢獄之災全然赦免。\n\
    \  真正進監獄的人畢竟不多，但我卻由此想到，很多人正恰與我的這位朋友相反，明明沒有進監獄卻把自己關在心造的監獄裡，不肯自我減刑、自我赦免。\n    我見到過一位年輕的公共汽車售票員，一眼就可以看出他非常不喜歡這個職業，懶洋洋地招呼，愛理不理地售票，時不時擡手看著手錶，然後滿目無聊地看著窗外。我想，這輛公共汽車就是他的監獄，他卻不知刑期多久。其實他何不轉身把售票當作棋譜和外語呢，滿心歡喜地把自己釋放出來。\n\
    \  對有的人來說，一個仇人也是一座監獄，那人的一舉一動都成了層層鐵窗，天天為之而鬱悶忿恨、擔驚受怕。有人乾脆擴而大之，把自己的嫉妒對象也當作了監獄，人家的每項成果都成了自己無法忍受的刑罰，白天黑夜獨自煎熬。\n\
    \  聽說過去英國人在印度農村抓竊賊時方法十分簡單，抓到一個竊賊便在地上畫一個圈讓他呆在裡邊，抓夠了數字便把他們一個個從圓圈裡拉出來排隊押走。這真對得上「畫地為牢」這個中國成語了，而我確實相信，世界上最恐怖的監獄並沒有鐵窗和圍牆。\n\
    \  人類的智慧可以在不自由中尋找自由，也可以在自由中設置不自由。環顧四周多少匆忙的行人，眉眼帶著一座座監獄在奔走。老友長談，苦歎一聲，依稀有銀鐺之音在歎息聲中盤旋。\n\
    \  舒一舒眉，為自己減刑吧。除了自己，還有誰能讓你恢復自由？\n                       選自余秋雨〈為自己減刑〉"
