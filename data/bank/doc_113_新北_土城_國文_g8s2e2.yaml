    content: 諸葛亮勸劉備早日奪取東吳
  group_stem: "漢末，劉備三往求計於諸葛亮。亮曰：「自董卓造逆以來，天下豪傑並起，跨州連郡者不可勝數。曹操比於袁紹，則名微而眾寡，然操遂能克紹，以弱為強者，非惟天時，抑亦人謀也。今操已擁百萬之眾，挾天子而令諸侯，此誠不可與爭鋒。東吳\
