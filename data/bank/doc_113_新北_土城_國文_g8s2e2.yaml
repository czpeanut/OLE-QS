  page: 1
  stem: 關於上面這一段文字的描述，下列何者解讀正確？
  options:
  - label: A
    content: 作者三次所描述的為黎明時的美景
  - label: B
    content: 作者分別由具體細膩的景物依次寫至抽象的感受
  - label: C
    content: 第二次描寫到「神異性的壓迫」是因為感受到大自然莊嚴偉大的力量
  - label: D
    content: 作者最後寫道「不說也罷，說來你們也是不信的！」是因為作者自嘲這是虛幻不實的誇大描寫
  group_stem: 「有一次，我趕到一個地方，手把著一家村莊的籬笆，隔著一大田的麥浪，看西天的變幻。有一次，是正衝著一條寬廣的大道，過來了一大群羊，放草歸來的，偌大的太陽在牠們後背放射著萬縷的金輝，天上卻是烏青青的，只剩這不可逼視的威光中的一條大路、一群生物！我心頭頓時感著神異性的壓迫，我真的跪下了，對著這冉冉漸隱的金光。再有一次，是更不可忘的奇景，那是臨著一大片望不到頭的草原，滿開著豔紅的罌粟，在青草裡亭亭地像是萬盞的金燈，陽光從褐色雲裡斜著過來，幻成一種異樣的紫色，透明似的，不可逼視，剎那間在我迷眩了的視覺中，這草田變成了……，不說也罷，說來你們也是不信的!」
