- id: doc_111_桃園_同德_自然_g8s1e2_s1_37
  section: 1
  number: 37
  type: single
  page: 5
  stem: 以下何者並非設計回音壁和私語走廊必須注意的事情？
  options:
  - label: A
    content: 牆壁材質堅硬
  - label: B
    content: 牆邊表面光滑
  - label: C
    content: 牆壁表面平整
  - label: D
    content: 牆壁材質具有彈性
  group_stem: '北京 天壇的回音壁，是天壇中存放皇帝祭祀神牌的皇穹宇外圍牆，高3.72 公尺、厚0.9 公尺、直徑61.5 公尺、周長193.2 公尺，圍牆面光滑平整，弧度十分規則，上端覆蓋著琉璃瓦。回音壁有良好的回聲效果，如果兩個人分別站在東、西配殿的牆下，一個人面朝北牆輕聲說話，而遠在另一端的人把耳朵靠近牆，即可清楚地聽見傳來的聲音，而且說話的聲音回聲悠長，給人一種天人感應的神祕氣氛。

    英國 倫敦也有一條著名的圓環形「私語走廊」，在這直徑34 公尺的走廊任何一處牆邊說悄悄話，在走廊其他地方，包括直徑對面最遠處的人，都能聽得非常清楚，如同說話者正在身邊耳語一般，十分奇妙。

    回音壁和私語走廊的回聲原理都是一樣的，但回音壁直徑比「私語走廊」大，而且是敞頂的環道，所以回音壁在建築與聲學的契合上更高一籌。'
