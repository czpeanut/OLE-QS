- id: doc_111_桃園_同德_自然_g8s1e2_s1_39
  section: 1
  number: 39
  type: single
  page: 6
  stem: 雷奈克醫生利用中空管狀的杉木，來清楚的聽到心跳聲，請問聲音在中空的圓管中傳遞，不易向外擴散，主要是利用了聲音的何種原理？
  options:
  - label: A
    content: 聲音會被中空管壁反射
  - label: B
    content: 將聲波的縱波轉為橫波
  - label: C
    content: 聲音在中空管中傳遞時，響度會愈來愈大
  - label: D
    content: 發聲體的振動
  group_stem: '19 世紀的歐洲，當時的醫生只能緊緊貼在患者的胸部或背部，聽肺部和心臟的異常聲音。醫療用的聽診器是法國巴黎內克爾總醫院，雷奈克醫生於西元1816
    年所發明。雷奈克醫生想起，他曾經看見幾個孩子在修繕房屋的木材堆上玩耍，其中有個孩子用一顆大釘敲擊一根木料的一端，並叫其它的孩子用耳朵貼在木料的另一端來聽聲音，孩子們高興地喊說「聽見了！」。想到這裡，雷奈克醫生馬上將一張厚紙緊緊捲成圓柱體，一端靠在病人的心臟，耳朵則靠在紙捲另一端上，果然他發現能以一種獨特的方式，感知心臟更清晰的跳動聲音。

    之後雷奈克醫生找人製作了一根長約30 公分的杉木，將中間挖空成管狀，為了便於攜帶，他把這根管子分成兩截，有螺紋可以旋轉連接，並取名「聽診器」，因聽診器樣子像笛子，所以又被稱為「醫生的笛子」。後來，因為效果良好，很快的也受到其他醫生採用。'
