  group_stem: 'Let’s go hiking and clean up Sunny Beach!

    Sunny Town invites everyone to go on a hike on Sunny Beach. At the same time,
    we can clean up the beach. There is trash everywhere on the beach after the Music
    Festival. We need to clean it up.

    Date: Saturday, July 25

    Time: 9:30 a.m. ~ 11:30 a.m.

    Place: Let’s meet at Sunny Lighthouse.

    Remember to wear a hat and gloves. At the end of the hike, everyone can get a
    lunchbox (a hamburger, French fries, fruit salad, and a glass of juice).

    For more information, please call Grace at 258-3 xxx.

     invite 邀請 remember 記得 glove 手套 information 資訊'
