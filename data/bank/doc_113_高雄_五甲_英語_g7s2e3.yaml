    content: Life without plastic.
  - label: B
    content: Beautiful Glass Straws.
  - label: C
    content: Different Uses of Plastics.
  - label: D
    content: Fresh Eggs and Vegetables.
  group_stem: 'Winnie joined a Facebook group, and here are some posts from the group
    page.

    Julia Chang

    Bye, bottled water! Though it is very convenient, it is bad for Mother Earth.
    Now, I bring my own bottle every day.

    Andy Lee

    I took a pot to Best Ever tonight. The cook put a lot of noodles in it. However,
    he put the eggs and vegetables in plastic bags. Sorry, dear Earth.

    Danny Chen

    I always use my own glass straw and bottle when buying drinks from a store. My
    bottle is big enough for different sizes of drinks. If you’d like to order one,
    here is the link: www.safebottle.com.tw.

    Jovin Wang

    The bakery near my home does not use plastic bags. If you bring your own boxes,
    you can get 10% off everything in the store. I like this bakery, and I will shop
    there often.

     though 雖然 pot 鍋子 noodles 麵 post 貼文 straw 吸管 link 連結'
