  type: single
  page: 2
  stem: '幾個同學參加「生態系 VR 虛擬實境體驗」。戴上 VR 設備後，幾個同學都對虛擬的生態系感到驚奇，並說出自己看到的場景：

    爪娃諾：「我腳下有好多蕈類跟蘚苔喔，還有看到一些蠑螈跟娃娃魚，好可愛。」

    烏瑞亞：「小聲點，我看到前面有隻黑熊。是胸口有白色 V 形花紋的那種黑熊。」

    雪萊：「哪裡有熊？我只看到兩隻駱駝悠哉悠哉地晃過去。」

    奇諾：「我啥動物都沒看到，雨超大的，地上到處都是積水，我只好躲在一棵筆筒樹下躲雨。」

    依照四人對話內容判斷，哪位同學可能和其他三人處於不同的虛擬生態系？'
