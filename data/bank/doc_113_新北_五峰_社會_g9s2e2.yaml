  section: 1
  number: 4
  type: single
  page: 1
  stem: '4.《2030 年，世界經濟中心在非洲》一書將非洲視為全球經濟的重要發展區。憑藉快速人口增長、自然資源和潛力，成為全球投資焦點。非洲政府致力於創造就業，支持製造業發展，減少失業並脫離過去依賴單一農礦資源出口的經濟結構。政策推動吸引跨國企業投資，包括服裝、鞋類等，非洲工業增長僅次於亞洲，製造業附加價值超過全球平均值，促進非洲經濟增長。聯合國等國際組織也從單純援助轉向「工業化支援」。

    文中提及非洲國家政府的扶植策略，為當地創造不少工作機會，臺灣政府也曾採取過哪個類似的經濟策略吸引跨國企業投資?'
