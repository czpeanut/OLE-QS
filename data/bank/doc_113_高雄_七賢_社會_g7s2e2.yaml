  stem: 台灣旅客非常喜愛到日本旅遊，出國旅遊前不少人都會先注意當地民情習慣。有網友整理「赴日旅遊的NG 行為」，像是：好幾個人共吃一份餐、要求店家幫忙打包剩菜、搭電車時播音樂、講電話、直接對著路人或商品拍照拍不停、進入室內時，脫下來的鞋子隨便擺、邊走邊吃、找不到垃圾桶就隨便丟等…。請問下列何者最適合當作上述註解？
  options:
