- id: doc_113_高雄_七賢_社會_g7s2e2_s2_17
  section: 2
  number: 17
  type: single
  page: 3
  stem: 百八首先登入《恆樂町》，選擇1930年代新興創業家此一角色，來經營街町、開立商行，體驗當時台灣的模樣。請問：百八當時最可能進行哪項投資計畫？
  options:
  - label: A
    content: 投資三寸金蓮製鞋廠，呼應當時以小腳為美的價值觀
  - label: B
    content: 開設皮革加工廠，好好利用台灣鹿皮製作來外銷全球
  - label: C
    content: 加盟鴉片小賣所，讓每個人都有機會前來嘗鮮與購買
  - label: D
