  section: 2
  number: 19
  type: single
  page: 4
  stem: 最後百八登入《夕生》，一開始的場景便是民眾從歡迎變成憤怒，隨著某場因私菸引起的衝突使得情況一發不可收拾，夕生與弟弟為了找回竹蜻蜓卻不小心看見警察射殺民眾那一幕。請問：如果百八想在蒐集此事的相關資料，最可能借閱下列哪一本書？
