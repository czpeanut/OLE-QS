- id: doc_111_高雄_林園_數學_g8s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: '以下分別是甲、乙兩人解 $(2x+5)(x+1)=(3x-2)(x+1)$ 的過程：

    甲：

    $(2x+5)(x+1)=(3x-2)(x+1)$

    $0=(3x-2)(x+1)-(2x+5)(x+1)$

    $0=(x-7)(x+1)$

    $x=7$ 或 －1

    乙：

    $(2x+5)(x+1)=(3x-2)(x+1)$

    將等號兩邊同時除以 $x+1$

    得 $2x+5=3x-2$

    $x=7$

    關於兩人的計算過程與結果，請問下列敘述何者正確？'
  options:
  - label: A
    content: 甲、乙都正確
  - label: B
    content: 甲正確、乙錯誤
  - label: C
    content: 甲錯誤、乙正確
  - label: D
    content: 甲、乙都錯誤
  answer:
  - B
