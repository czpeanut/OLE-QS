- id: doc_111_高雄_林園_數學_g8s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: '以下分別是甲、乙兩人使用配方法解 $x^{2}-8x+20=0$ 的過程：

    甲：

    $x^{2}-8x+20=0$

    $x^{2}-8x=-20$

    $x^{2}-8x+4^{2}=-20+4^{2}$

    $(x-4)^{2}=-4$

    $x-4=\pm 2$，所以 $x=2$ 或 6

    乙：

    $x^{2}-8x+20=0$

    $x^{2}-8x=-20$

    $x^{2}-8x+4^{2}=-20+4^{2}$

    $(x-4)^{2}=-4$

    因為 $(x-4)^{2}=-4<0$，所以此方程式沒有解

    關於兩人的計算過程與結果，請問下列敘述何者正確？'
  options:
  - label: A
    content: 甲、乙都正確
  - label: B
    content: 甲正確、乙錯誤
  - label: C
    content: 甲錯誤、乙正確
  - label: D
    content: 甲、乙都錯誤
  answer:
  - C
  answer_source: answer_key_vlm
