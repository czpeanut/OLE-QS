- id: doc_111_高雄_林園_數學_g8s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: '以下分別是甲、乙兩人使用公式解 $2x^{2}+x-1=0$ 的過程：

    甲：

    令 $a=2$，$b=1$，$c=-1$

    則 $b^{2}-4ac=1^{2}-4\times 2\times(-1)=9$

    所以 $x=\frac{-1\pm\sqrt{9}}{4}=\frac{-1\pm 3}{4}=-1$ 或 $\frac{1}{2}$

    乙：

    令 $a=2$，$b=1$，$c=1$

    則 $b^{2}-4ac=1^{2}-4\times 2\times 1=-7<0$

    所以此方程式沒有解

    關於兩人的計算過程與結果，請問下列敘述何者正確？'
  options:
  - label: A
    content: 甲、乙都正確
  - label: B
    content: 甲正確、乙錯誤
  - label: C
    content: 甲錯誤、乙正確
  - label: D
    content: 甲、乙都錯誤
  answer:
  - B
  answer_source: answer_key_vlm
