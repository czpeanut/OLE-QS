  group_stem: "來自東南亞地區的新住民，大多數是透過跨國婚姻來到臺灣，新住民及新住民子女所占比例逐年增加，如今人數已超過 64 萬人，比臺灣原住民還多。從臺灣歷史來看，過去有多個族群曾經在這裡來來去去，經過一段時間的交流與融合，依然存著許多對新住民的刻板印象。雖然新住民為臺灣帶來更多元的文化風貌，但很多時候仍顯示多元文化概念還未深耕，因此，筆者試想應該還可以做一些什麼，讓多元族群間彼此認識、相互尊重，進而產生文化交流及對話。\n\
    \    我本身是越南籍新住民，來到臺灣三年多，走在外面遇到很多臺灣人都說我「不像越南人」。我不知道在臺灣人的印象中，越南人的長相如何？有不少人問我：「越南人是不是皮膚比較黑？但是妳皮膚比較白。」我回答\
    \ 他們：「其實越南人像亞洲人一樣都是黃皮膚，皮膚黑或白是受個人生活環境影響。」我常常被問：「你們越南是不是母系社會？女生辛苦去外面工作養家，男生懶散、只會吃喝玩樂？」這些問題都讓我又驚訝又難過。\n\
    \    不知道從哪裡來的訊息，臺灣人對越南好像很陌生，有時候幾乎到了不可思議的地步。有很多臺灣人以為越南的首都還是胡志明巿，但事實上是河內。我身旁的臺灣朋友對越南景點的認識大多停留在下龍灣、胡志明巿而已，其實越南從北至南有非常多漂亮、迷人的景點。越南新住民在臺灣的比例相當高，人口數位居新住民第二位(九萬多人)，在臺灣有那麼多越南人，難道沒有越南朋友介紹相關越南文化給臺灣人認識嗎？相信不是，也許臺灣在文化政策上，對於推廣多元文化措施不完整，文化交流、文化宣傳還有進步空間；也許臺灣老百姓對新住民還是有一些刻板印象存在，還離不開舊的思維及想法，覺得東南亞文化落後而不想了解。我認為加強認識各種文化特色及差異並與之交流，是成為臺灣現代公民必備的基本要素。應減少臺灣人對新住民文化的歧視，進而親近新住民族群。筆者建議文化相關部門加強「新住民文化培養力」，讓在臺新住民有機會接受培訓，成為合格的教師，讓文化課程可以遍及社區、學校等地，使得「文化種子」可以萌芽、成長茁壯。\n\
    ——改寫自阮氏玉梅新住民期待彼此認識多元族群文化"
