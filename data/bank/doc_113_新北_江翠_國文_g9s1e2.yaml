  stem: 關於〈生於憂患死於安樂〉一文中的文句說明，下列何者錯誤？
  options:
  - label: A
    content: 「人恆過，然後能改。」說明人不該沉醉於過往的豐功偉業，應力求改善精進
  - label: B
    content: 「所以動心忍性，曾益其所不能。」說明生活中的磨難是為了砥志礪行，增強能力
  - label: C
