- id: doc_113_新北_江翠_國文_g9s1e2_s1_37
  section: 1
  number: 37
  type: single
  page: 5
  stem: 根據本文，關於關山的敘述，下列何者正確？
  options:
  - label: A
    content: 關山的二月乍暖還寒
  - label: B
    content: 關山的春天人滿為患
  - label: C
    content: 關山的地形平坦寬闊
  - label: D
    content: 關山的氣候四季如春。
  group_stem: "春二月。\n    關山的這個時候，天氣正在轉暖不暖，不知是春天還是冬天的季節，是個很錯亂的時刻。那錯亂是，春草不知長芽、冬梅還含著苞、太陽不知晨起、月光提早上班、老人不知該不該脫去棉衣、婦人不知該不該晒晒棉被……\n\
    那既是驟變、也是慢緩，節奏已亂了章法，可能是地處山谷的關係，也極可能只是那麼一兩天，剛剛好的壞天氣而已。拍子是亂了，但亂得極好，分不清早晚的必要關係，忘了吃飯，忘了洗澡，忘了該是起床還是睡覺，一切只當心情好。\n\
    \    人在心情好的時候，時間點上該有的秩序，顯得不那樣緊張了。我在關山的一星期裡，經常想睡才睡，想吃才吃，連偶發性的失眠也不那麼焦慮了。雖然我大部分的時間都在騎腳踏車，或者只是看著關山大圳發呆，身體裡的細胞，行動緩慢得像住進了冰山裡，我的肚子好像光吸空氣就飽了。我慶幸著大家不知來關山玩，又慶幸著這年剛過的二月天，城市裡的人們是如此積極向上，把關山遺忘。\n\
    \    這個時候來去關山騎腳踏車，整片的秧苗稻田，由淺金黃轉綠鵝黃再轉翠綠玉的顏色，層次每天都在變著，有時風一吹，那骨牌效應帶出的層次更是美不勝收。我可以就這麼騎車到高地，終日看著稻田就心滿意足。看膩了，就再去環山的腳踏車道繞繞，這裡每隔十公尺就可以看見成雙成對的鳳蝶，我猜已不限這時節，而是整年的關山都可能是昆蟲的情人節。如果你珍惜牠們，那麼有可能從天而降的毛毛蟲，也請遊客善待牠們。\n\
    \    我從不在節奏對的時候旅行，所有年曆上的好時節，只會帶來更多的垃圾、噪音與壞心情。此刻的關山也許大雨，但我不需雨傘，不想出門淋雨就在民宿裡躺著休息……等一下就出太陽了，我瞇一下就好。\n\
    <一切只當心情好> 王彥鎧"
