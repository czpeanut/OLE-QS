  group_stem: "濮陽人呂不韋賈（１）於邯鄲，見秦質（２）子異人，歸而謂父曰：「耕田之利幾倍？」曰：「十倍。」「珠玉之贏幾倍？」曰：「百倍。」「立國家之主贏幾倍？」曰：「無數。」曰：「今力田（３）疾作，不得暖衣餘食；今建國立君，澤可以遺世。願往事之。」\n\
