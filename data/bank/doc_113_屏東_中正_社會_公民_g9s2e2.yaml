  stem: '依右表，由下列何者可以得知，原住民族與大自然和諧共存的文化，並以部落為生產與分配的單位，發展出重視共享互助與生態平衡的價值觀呢？


    （甲）位於桃園復興區的嘎色鬧（Ksunu）部落，（乙）族人透過部落會議，一個可以討論屬於自己部落內之公共事務的平台，提出營造民族環境的意見。會後決定在部落入口處繪製故事牆，由族人組成工班，自己來討論、繪製和施作，協力完成了八個故事展版，八個重要主題。（丙）其一，將蜻蜓作為部落意象，用"蜻蜓點水"比喻祖先從原居地遷移到嘎色鬧部落才定居下來的曲折歷程。（丁）其二，"換工"（sbayux），蓋房子（kbalay
    ngsal）、種稻（muhi pagay）、燒墾（mnayang）。這些樸實的展版讓訪客藉此瞭解部落，更是族人合力創造出來的過去與現在之連結。'
  options:
