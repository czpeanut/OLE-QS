  stem: （甲）臺紐經濟合作協定的緣故，紐西蘭進口鮮乳今年起零關稅。酪農為此抗爭了一年多，訴求進口液態乳不能有"鮮"字。行政院原本決定保存期14 天（含）以下才可標示為鮮乳，但是（乙）接獲來自美、日的關切，恐出現貿易障礙，於是重新召開協調會，擬規範有國產鮮乳標章才能標示鮮乳，衛福部、經濟部及農業部都需要調整（丙）食品安全衛生管理法、鮮乳保久乳調味乳乳飲品及乳粉品名及標示規定、鮮乳標章核發使用要點等規範。（丁）中華民國酪農協會對結論表示滿意。依上文，下列何者是正確的呢？
