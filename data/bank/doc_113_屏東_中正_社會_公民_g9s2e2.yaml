  stem: 7 年孝班開班會。麗蓮：「今天要討論購置電風扇一事，請大家踴躍發言。」祥太：「我提議用班費購買，這樣才公平。」枋遠：「我的座位吹不到電扇。我提議使用者付費。」麗蓮先由祥太的提議進行表決，但是欽田提出臨時動議，麗蓮趕緊針對兩個提議徵求附議。依上文，下列何者是正確的呢？
