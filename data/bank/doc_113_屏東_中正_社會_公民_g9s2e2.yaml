  stem: 地點：美國白宮。川普（揶揄的口氣）：「你今天盛裝打扮呢！」澤倫斯基（穿象徵烏克蘭的黑上衣、著軍靴）：「烏俄戰爭結束後，我會穿正式服裝。」葛倫（記者）：「你在我國的最高權力中心，卻拒絕穿西裝？你有西裝嗎？」上述對話所傳達的真正意涵為下列何者呢？
