- id: doc_113_高雄_五福_自然_g7s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '小月發現饅頭裡面有許多小洞，她想知道產生小洞的原因。請參考右表，依據科學方法的標準順序，依序列出正確的步驟。


    | 編號 | 敘述 |

    | :--- | :--- |

    | 甲 | 為什麼饅頭裡面會有這麼多小洞呢？ |

    | 乙 | 拿兩個分別為【加入酵母菌】及【未加入酵母菌】的麵團進行測試，觀察是否產生氣體。 |

    | 丙 | 剝開饅頭，發現饅頭上有許多小洞。 |

    | 丁 | 饅頭蓬鬆，中間出現小洞，可能是麵糰中的酵母菌利用麵糰中的成分後，產生氣體所造成的吧！ |

    | 戊 | 搜尋網路、圖書館，了解饅頭製作的相關資訊。 |'
  options:
  - label: A
    content: 丙→甲→乙→戊→丁
  - label: B
    content: 甲→丁→戊→丙→乙
  - label: C
    content: 丙→甲→戊→丁→乙
  - label: D
    content: 戊→甲→丁→丙→乙。
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 生物
