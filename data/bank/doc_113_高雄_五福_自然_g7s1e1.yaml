- id: doc_113_高雄_五福_自然_g7s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '為了探究【為什麼白飯在口中咀嚼數次之後會有甜味產生】，大雄設計甲、乙兩組實驗，和a、b、c 三種變因如右表。請問甲實驗設計和乙實驗設計中，為了驗證假說，唯一改變的變因是表格中的哪類變因？中文名稱是？


    | 變因種類 | 甲實驗設計 | 乙實驗設計 |

    | :--- | :--- | :--- |

    | a 變因 | 澱粉、本氏液、隔水加熱 | 澱粉、本氏液、隔水加熱 |

    | b 變因 | 加入唾液 | 未加唾液，加入自來水 |

    | c 變因 | 結果變成綠色 | 結果維持淺藍色 |'
  options:
  - label: A
    content: a 變因；控制變因
  - label: B
    content: b 變因；操作變因
  - label: C
    content: c 變因；操作變因
  - label: D
    content: b 變因、控制變因。
  tags:
