  section: 1
  number: 23
  type: single
  page: 1
  stem: 中研院研究員黃克武在其著作《胡適的頓挫》一書中，講述1950 至60 年代的胡適雖願意支持民主運動、爭取言論自由，然而為避免與政府翻臉、避免給總統感到他有顛覆政府的意圖，而與推動民主運動的□保持一定距離，左右兩難。政治的糾結與未能勇於抗爭一事，成了胡適心頭的一根刺，令他「內疚彌深」。請問，胡適的友人□是誰？
  options:
  - label: A
    content: 雷震
  - label: B
    content: 陳誠
  - label: C
    content: 陳儀
