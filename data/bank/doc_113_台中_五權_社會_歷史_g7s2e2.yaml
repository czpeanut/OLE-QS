  section: 1
  number: 20
  type: single
  page: 1
  stem: 正亮在談論日治時期的各項社會經濟發展，提到日本在臺灣的建設雖以殖民經濟為考量，但卻奠定了臺灣現代化基礎。請問：下列何者「不是」日治時期社會經濟發展的現象？
  options:
  - label: A
    content: 引進「星期制」與「標準時間制」
  - label: B
    content: 引進西方司法制度，有法院審理案件
  - label: C
    content: 公共醫療不足，衛生不佳，臺灣死亡率仍高
  - label: D
    content: 立即下令全面嚴格禁止纏足、辮髮、吸鴉片。
