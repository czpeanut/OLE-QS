  type: single
  page: 1
  stem: 台中市府團隊想拍一部跟臺灣歷史相關的短片衝高FB 點閱率，他們將故事時空背景設定在西元1910～1939 年間的台中州。為了忠於史實，片中的每個場景都十分考究，但其中某個情節卻因為不小心出錯而與史實不符。請你幫他找出錯誤在哪？
  options:
  - label: A
    content: 詩羽：「因為六年義務教育實施，所以我必須去念書了！」
  - label: B
