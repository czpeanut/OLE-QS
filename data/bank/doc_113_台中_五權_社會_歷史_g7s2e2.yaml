  stem: 右圖是臺北病院〜日治時期由總督府管轄的西式醫院，設有助產科本科（修業二年）與速成科（修業一年）來培養助產士。眾多的助產士學成後分散到全台各地，並使得孕婦與新生兒的死亡率大幅下降。從上述資料中，可以如何解讀日治時期的社會變遷？
  options:
  - label: A
    content: 現代醫藥衛生開始傳播於臺灣社會
  - label: B
    content: 對臺人教育強調實用原則，培訓臺灣需要的專業人士
  - label: C
    content: 女性可接受專業教育及外出就業
  - label: D
    content: 以上皆是。
