  section: 1
  number: 32
  type: single
  page: 2
  stem: 民國38 年，臺灣省政府頒布戒嚴令，這一戒嚴長達38 年，是全世界維持第二長的戒嚴令（僅次於敘利亞44 年）。有關戒嚴令對臺灣的影響，何者正確？
  options:
  - label: A
    content: 憲法保障人民的各項自由遭到限縮
  - label: B
    content: 總統權力大幅提高且不受憲法約束
  - label: C
    content: 臺灣人開始被動員去支援國共內戰
  - label: D
    content: 中華民國憲法的效力得到完整發揮。
