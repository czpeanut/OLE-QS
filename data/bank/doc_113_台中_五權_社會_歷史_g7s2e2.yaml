  section: 1
  number: 21
  type: single
  page: 1
  stem: 有學者認為 1920 年代臺灣的社會運動，是受到日本「大正民主」風潮的影響，當時的日本政治民主、學術自由、經濟蓬勃。然而往上追溯，我們不難發現1920
    年代臺灣與日本的政治其實共同受到全球性思想的影響。該「全球性思想」是？
  options:
  - label: A
    content: 關稅自主
  - label: B
    content: 全民均富
  - label: C
    content: 民族自決
  - label: D
    content: 環境平衡。
