  section: 1
  number: 22
  type: single
  page: 1
  stem: 魯夫正在觀賞一齣舞臺劇，旁白開場時唸到「民國 36 年，一聲槍響，引發一場震撼全臺的事件，使民眾將對政府官員的不滿和失望、快要買不起米糧的怨氣，一次性的爆發開來。政府調派軍隊實施清鄉，有許多臺籍精英在這場事件中失去性命……」請問：魯夫觀賞的舞臺劇應與哪一事件有關？
  options:
  - label: A
    content: 牡丹社事件
  - label: B
    content: 霧社事件
  - label: C
    content: 西來庵事件
  - label: D
    content: 二二八事件。
