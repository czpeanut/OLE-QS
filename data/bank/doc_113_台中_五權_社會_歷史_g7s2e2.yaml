  section: 1
  number: 17
  type: single
  page: 1
  stem: 篤行國小是距離五權最近的國小，有關該校日治時期的歷史沿革：1896 年成立「台中國語傳習所」，1898 年改制定名為「台中公學校」，1943 年改稱「昭和國民學校」。我們從以上敘述，可以如何解讀該校的發展？
  options:
  - label: A
    content: 這間學校成立之初專收台人子弟
  - label: B
    content: 中日戰爭爆發後，為配合皇民化運動而開始「日臺共學」
  - label: C
    content: 該校的學習內容以日語學習為主
  - label: D
    content: 以上皆是。
