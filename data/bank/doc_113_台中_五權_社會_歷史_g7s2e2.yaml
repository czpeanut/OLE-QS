  stem: 1946 年到1947 年，台灣米價上漲3.83 倍，麵粉4.37倍，豬肉2.21 倍，糖21.33 倍，民眾生活叫苦連天，成為社會動蕩不安的原因。請問：造成當時急遽通貨膨脹的原因是？
