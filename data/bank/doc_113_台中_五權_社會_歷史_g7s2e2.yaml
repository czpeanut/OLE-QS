  section: 1
  number: 19
  type: single
  page: 1
  stem: 臺灣的民主發展成就，是透過長久而緩慢的發展歷程逐漸堆積而成的。下列為臺灣民主發展的重要事件，請按照先後順序排列 (甲)解除戒嚴 (乙)廢除動員戡亂時期臨時條款
    (丙)野百合學運 (丁)民主進步黨成立 (戊)首次總統民選
  options:
  - label: A
    content: 甲乙丙丁戊
  - label: B
    content: 甲丁丙乙戊
  - label: C
    content: 丁丙甲乙戊
  - label: D
    content: 丁甲丙乙戊。
