  section: 1
  number: 33
  type: single
  page: 2
  stem: '我國政府會公告相關紀念日在每年的行事曆，下列三個節日，根據你所學的歷史知識，依據發生史實的先後順序作排序，分別為?


    | 甲 | 2/28 | 和平紀念日 |

    | --- | --- | --- |

    | 乙 | 10/25 | 光復節 |

    | 丙 | 12/25 | 行憲紀念日 |'
  options:
