  section: 1
  number: 25
  type: single
  page: 1
  stem: 蔣渭水在《臨床講義》中寫到：「臺灣現症︰ (臺灣)頭骨雖大，內容空虛，腦髓並不充實；問及稍微深入的哲學、數學、科學及世界大勢，便目暈頭痛。診斷︰世界文化的低能兒。處方︰正規學校教育—最大量。」為了醫治臺灣人民的「缺乏知識的營養不良症」，而不斷舉辦演講會、短期講習會、電影放映會、開辦夏季學校等，這是哪一個團體的成就？
  options:
