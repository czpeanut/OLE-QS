    content: 不肖工廠為了躲避稽查，利用夜晚偷排廢氣，製造空氣污染
  - label: B
    content: 廟寺舉辦活動，成天燃放爆竹，敲鑼打鼓，使居民不得安寧
  - label: C
    content: 缺乏公德心，隨手隨地亂丟垃圾，製造髒亂、污染公共環境
  - label: D
    content: 一遇到不如意的事就口出穢言、霸凌他人，使他人心生恐懼。
  group_stem: "帶著一張微笑的臉，面對你的生命，面對別人的生命。\n對著鏡子練習，讓自己看看這是一張多麼令人愉悅的臉。不要鎖起你的眉頭，不要把你的臉沉得有如暴風雨即將來臨的天空。\n\
    不要忘記，情緒是最容易感染別人的，任何暴躁的脾氣、乖張的行為、粗魯的言語，都是一種「公害」，汙染了別人的心田。所以，不要讓你的不快影響別人，不要把你的重擔加添在別人肩頭，人間苦難已夠多了。\n\
    盡可能帶著一張微笑的臉出門，盡可能使你四周的空氣輕鬆、活潑而愉快，你要知道，分擔的擔子是輕省的，分享的快樂是加倍的。\n有歡笑的地方，就有愛，就有溫暖。\n\
    \         （選自杏林子〈笑靨迎人〉）"
