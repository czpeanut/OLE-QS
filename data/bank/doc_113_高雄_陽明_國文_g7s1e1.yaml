- id: doc_113_高雄_陽明_國文_g7s1e1_s3_40
  section: 3
  number: 40
  type: single
  page: 7
  stem: 「小蓁為班上跑完大隊接力最後一棒，而這一棒卻是她人生中的第一棒。」根據上文內容，「人生中第一棒」是指下列何者？
  options:
  - label: A
    content: 首次獲得大隊接力賽跑的冠軍
  - label: B
    content: 首次被安排在接力賽的第一棒
  - label: C
    content: 首次出席參加學校校慶運動會
  - label: D
    content: 首次參與大隊接力的競賽活動。
  group_stem: "彰化縣 二林高級中學昨天舉辦校慶運動會，二年級視障生小蓁由同學謝廷鈺拉著，為班上跑完大隊接力最後一棒，而這一棒卻是她人生中的第一棒。今天她表示，以前被媽媽強迫在跑步機跑步，對跑步機印象很不好，昨天跑完大隊接力，對跑步機的印象改觀，希望以後還有機會跑步。\n\
    小蓁參加大隊接力的影片，昨天由父親林廷宇分享到網站上，並留言說：「謝謝體育老師宏凱的安排，也謝謝班上同學努力的從第一棒開始，就跑最前面『賺』起來讓她『花』。你們做了一般高中生做不到的決定，這不是素養，那什麼才是素養？」網友紛紛按讚，為小蓁和她的班級加油。\n\
    小蓁說，媽媽總是要求她在跑步機上練習跑步，以訓練肌肉張力，因此一直都對跑步機的印象不太好。很感謝體育老師和同學為她策畫，讓她可以參加這次的大隊接力，賽前練習了四個星期左右，昨天下場比賽，原本還一直擔心自己無法發揮正常實力。跑完全程的瞬間，雖然很累但也很開心，如果以後還有機會，她願意再參加，希望表現得更好。\n\
    二林高中特教組長張永政說，讓小蓁參加大隊接力的想法，是由體育老師黃宏凱提出的。因為小蓁從小到大，遇到學校運動會的田徑比賽時，都只能在旁邊當啦啦隊，如果高中生活再沒有機會參與，等到上了大學，屆時運動會採自由參加，就很難再有機會上場。黃宏凱要學生思考後再作決定，而小蓁的同學一致同意讓她上場，並安排她跑最後一棒，以免跟其他參賽選手碰撞，害她受傷。\n\
    昨天的校慶運動會，班級大隊接力，每隊15 人，並跑1500 公尺。比賽一開始，小蓁的同學卯足了勁向前衝，在同組的五隊中遙遙領先。跑最後一棒的小蓁，由於看不見跑道，不得不放慢速度，但她仍奮力跑完全程。當小蓁到達終點時，贏得了全場最熱烈的掌聲。\n\
    \n小蓁的同學王芸瑄、洪品葳等人表示，比起競賽名次，重要的是能讓小蓁參與這段過程，能幫小蓁跑出人生的第一棒，全班同學都很開心。\n二林高中校長黃洲海說，本來小蓁的班級大隊接力可以跑進前三名，但全班學生選擇放棄名次，轉而幫助小蓁，全班一起創造難忘的溫馨回憶，實在很令人感動，這也代表二林高中有愛無礙的融合教育已深植學生心中。\
    \      \n    （改寫自 「聯合新聞網」網站）"
