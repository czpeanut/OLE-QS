- id: doc_113_高雄_陽明_國文_g7s1e1_s2_7
  section: 2
  number: 7
  type: single
  page: 1
  stem: 「在美麗的夏夜裡愉快地旅行。」句中的「美麗的」、「愉快地」分別為「形容詞」、「副詞」。下列選項「 」中的詞語，何者詞性依序與此相同？
  options:
  - label: A
    content: 「火紅的」太陽也滾著「火輪子」回家了
  - label: B
    content: 撒了「滿天的」珍珠和一枚又大又亮的「銀幣」
  - label: C
    content: 小弟弟「夢見」他變做一條魚在「藍色的」大海裡游水
  - label: D
    content: 只有「綠色的」小河還醒著，「低聲地」歌唱著溜過彎彎的小橋。
