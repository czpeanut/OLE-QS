  stem: 魯迅：「時間就像海綿裡的水一樣，如果你願意擠，總還是有的。」這句話的含義與下列何者最接近？
  options:
  - label: A
    content: 時間和海綿裡的水性質相似，分量都是固定而且有限的
  - label: B
    content: 時間的遞進從未停止，今天過了，明日又是全新的一天
  - label: C
    content: 人們經常感到時間不夠用，是由於沒有找出瑣碎的時間
  - label: D
    content: 擠海綿所產生的水，就像人們不經意浪費掉的光陰那麼多。
  group_stem: "「時間就像海綿裡的水一樣，如果你願意擠，總還是有的。」——魯迅\n  魯迅這句經典的勵志格言，不斷被人傳誦、引用。對於時間的運用，他還曾經說過：「生命是以時間為單位的，浪費別人的時間，等於謀財害命；浪費自己的時間，等於慢性自殺。」\n\
    \  我們常說「時間管理」，其實時間不是我們所能管理的。雖然我們常說「時間就是金錢」，但是時間與金錢不同——錢可以管理，因為通常所說的「管理」是可以累積儲存，並且加以運用的，但時間不行。\n\
    \  因此，真正的問題不在於「管理時間」，而是「管理自己要做的事」，我們需要的不是「節省時間」，而是「節省工作」。我們抱怨時間不夠用，是因為我們沒有認真想清楚，究竟我們要什麼？什麼是我們生命中真正看重的？\n\
    \  當我們看清楚生活中的輕重緩急，並依此而調整優先順序，把想做的事都做了，就不會惶然，而能夠增加自己生活的滿意度。\n  設定優先順序，最重要的是決定「哪些是必須捨棄的」：分析自己一天二十四小時，一星期七天大概都是怎麼過的，挑出可以捨棄的項目——除了工作，以及為了別人不得不花費的時間之外，剩下可利用的時間，有多少是被自己習慣性的行為不知不覺消耗掉了？\n\
    \  我們以為善加利用時間，可以同時處理很多事，其實所完成的零星小事，只是創造出非常有效率的假象，當我們一整天都被這些說不清楚的雜事占據了，反而會令我們很沮喪。因為我們需要完整而集中的時間，做真正重要的事，才會覺得生活是有意義的。\n\
    \  把時間花在我們覺得重要的事情之上，這是運用時間的關鍵祕訣。詩人\n威廉．考柏也這麼說：「真正快樂的唯一來源，是為了某種我們看重的意義而花費我們的時間、我們的生命。」因此，管理時間和運用時間，重點在於：找到我們渴望的事，然後每天空出時間真切的去做。\n\
    \                                    (節錄自李偉文〈善用時間的方法〉)"
