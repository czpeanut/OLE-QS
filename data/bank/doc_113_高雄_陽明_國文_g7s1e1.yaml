- id: doc_113_高雄_陽明_國文_g7s1e1_s3_42
  section: 3
  number: 42
  type: single
  page: 8
  stem: 義大利、希臘為了搶救古蹟而陷入財政危機，其主要原因是什麼？
  options:
  - label: A
    content: 酸雨中的硫化物腐蝕古蹟中的大理石
  - label: B
    content: 紫外線長期照射下，古蹟結構遭到破壞
  - label: C
    content: 古蹟容易受空氣中的氟氯碳化合物影響而損壞變形
  - label: D
    content: 天候異常，古蹟受到極冷與極熱的交互作用而脆化崩解。
  group_stem: "許多科學家預測，由於人類對於環境肆無忌憚的破壞，不僅造成氣候、生態的改變，人類的文明也將在五十年內受到嚴重的威脅。\n 危機一：酸雨直直落\
    \  \n能源消耗會產生大量硫化物，使天上落下來的雨變成酸雨。這種酸雨不但使得北歐的湖泊大部分魚類喪失蹤影，也造成歐洲的森林大量枯死、大理石古蹟與雕像快速融解。義大利、希臘政府甚至為了搶救古蹟與雕像，而陷入財政危機。\n\
     危機二：地球暖化  \n人類毫無節制的消耗能源，使得二氧化碳濃度年年增高，造成地球氣候暖化。在過去一百年之間，地球平均氣溫不斷上升，使得南極、北極的冰山、冰河大量融解，海平面上升了有二十公分之多。海平面上升的結果，使得許多海岸國家，包括台灣沿海鄉鎮，都面臨嚴重水患的威脅，如果這種情形繼續發展下去，許多陸地將消失不見。\n\
     危機三：臭氧層大破洞  \n自一九三O 年以來，人類開始大量採用氟氯碳化合物來製造空調冷媒、噴霧劑等日常用品，嚴重破壞大氣臭氧層，使紫外線的強度增強，導致人們罹患白內障、皮膚癌的機率增加。尤其是南極臭氧層破洞持續擴大，據說破洞已達美國領土的三倍大小。\n\
     危機四：生物大量滅絕  \n人類製造的化學合成物質已被證實是誘發環境荷爾蒙錯亂的主因，它使得鳥類不會孵蛋、鼠類的行為錯亂等。此外，在過去五十年中，地球有三分之一的森林面積快速消失，有百分之七十五的原生種穀物消失不見。在未來三十年內，地球上將有四分之一的生物面臨滅絕的命運，我們的下一代，甚至會有嚴重的糧食危機。\n\
    \                         （ 林憲德〈地球面臨了哪些重大的危機？〉）"
