  section: 2
  number: 14
  type: single
  page: 2
  stem: 「蝴蝶和蜜蜂們帶著花朵的蜜糖回來了，羊隊和牛群告別了田野回家了，火紅的太陽也滾著火輪子回家了。」這段詩句描寫的時間點，與下列何者相同？
  options:
  - label: A
    content: 天邊露出魚肚白，漸漸的愈來愈明了，由魚肚白色轉為橘黃色
  - label: B
    content: 一枚銀盤嵌在深藍空中，靜靜地傾瀉下來，垂下一層朦朧的輕紗
  - label: C
    content: 熊熊燃燒的大火球噴射過量的光和熱，於是大地口乾舌燥得崩裂開來
  - label: D
    content: 那橘紅色斜陽像剛誕生的嬰兒掛在山腰，將殘暉毫無保留的撒向大地。
  lesson_raw:
    title: 夏夜
    basis: 引自楊喚《夏夜》課文原句
- id: doc_113_高雄_陽明_國文_g7s1e1_s2_15
  section: 2
  number: 15
  type: single
  page: 2
  stem: 「來了！來了！從山坡上輕輕地爬下來了。來了！來了！從椰子樹梢上輕輕地爬下來了。」這段詩句中多次使用「來了！來了」，主要產生了什麼效果？
  options:
  - label: A
    content: 語句不斷重複，提醒大家注意，街燈依序點亮帶來光明
  - label: B
    content: 強調夏夜總在不知不覺中降臨，時光悄悄流逝無可挽留
  - label: C
    content: 模仿兒童說話多用疊句，描繪工作結束闔家團聚的溫馨
  - label: D
    content: 創造出輕快且富韻律感的節奏，表現兒童對夏夜的歡迎。
  lesson_raw:
    title: 夏夜
    basis: 引自楊喚《夏夜》課文原句
- id: doc_113_高雄_陽明_國文_g7s1e1_s2_16
  section: 2
  number: 16
  type: single
  page: 2
  stem: 「撒了滿天的珍珠和一枚又大又亮的銀幣。」關於這句詩的分析，下列敘述何者正確？
  options:
  - label: A
    content: 明月當空照，繁星璀燦的蒼穹，給人夏夜富麗堂皇的視覺饗宴
  - label: B
    content: 珍珠與銀幣點綴在星空中，令人暑氣全消，在涼爽夜風裡沉睡
  - label: C
    content: 月亮和星星也走向夢鄉，營造夜幕低垂、夜闌人靜的寧靜畫面
  - label: D
    content: 用閃耀的珍珠、珍貴的銀幣，為夏夜增添蓬勃的生命力與涼意。
  lesson_raw:
    title: 夏夜
    basis: 引自楊喚《夏夜》課文原句
- id: doc_113_高雄_陽明_國文_g7s1e1_s2_17
  section: 2
  number: 17
  type: single
  page: 2
  stem: 描寫事物若能兼顧視覺與聽覺，可以讓畫面變得有聲有色。下列文句，何者具有「聲色」效果？
  options:
  - label: A
    content: 炮仗花纍纍成串，呈現討喜的大橘紅色，像小喇叭一樣蓄勢待發
  - label: B
    content: 晶亮的冰塊軋入刨冰機中，那冰屑就像雪花一般，片片飛落盤中
  - label: C
    content: 冰花瞬即融化，融入舌尖，那種冰涼暢快的感覺，足以將豔陽融化
  - label: D
    content: 轟隆巨響加上閃爍不定的亮光，大雨落下，街道上的人們開始亂竄。
- id: doc_113_高雄_陽明_國文_g7s1e1_s2_18
  section: 2
  number: 18
  type: single
  page: 2
  stem: 關於楊喚〈夏夜〉一詩的寫作手法，下列敘述何者正確？
  options:
  - label: A
    content: 在豐富的夏夜景物中，寄託深刻的人生道理
  - label: B
    content: 透過兒童口吻並發揮想像力，描繪夏夜景象
  - label: C
    content: 從科學角度，分析夏夜裡天地萬物復甦的現象
  - label: D
    content: 運用擬人化的名詞，呈現熱鬧迎接的夏夜氛圍。
  lesson_raw:
    title: 夏夜
    basis: 題目直接提到楊喚〈夏夜〉
- id: doc_113_高雄_陽明_國文_g7s1e1_s2_19
  section: 2
  number: 19
  type: single
  page: 2
  stem: 杏林子〈一顆珍珠〉一文中所述「眼淚化作歡笑，痛苦的代價成就了榮耀的光彩。」這段文句的語意與下列何者最接近？
  options:
  - label: A
    content: 誰播種道德，誰就收穫榮譽
  - label: B
    content: 被同一塊石頭絆倒兩次是一種恥辱
  - label: C
    content: 失敗是一個過程，而非一個結果；是一個階段，而非全部
  - label: D
    content: 若欠缺需要跋涉的黑谷，山頂的時光，只怕不到一半的美妙。
  lesson_raw:
    title: 一顆珍珠
    basis: 題目直接提及杏林子〈一顆珍珠〉
- id: doc_113_高雄_陽明_國文_g7s1e1_s2_20
  section: 2
  number: 20
  type: single
  page: 3
  stem: 杏林子在〈一顆珍珠〉一文中，舉法國 路易斯．勃萊爾發明點字法的故事當例證，下列文句何者可以和這則故事的含義相呼應？
  options:
  - label: A
    content: 突然一個打擊臨到牠，一粒沙子嵌進肉中，痛得牠昏天黑地
  - label: B
    content: 年年歲歲，漫長的忍耐，無盡的辛酸，那一粒醜陋的沙礫已變成美麗的珍珠
  - label: C
    content: 我不禁出神地看著，這樣圓潤可愛的珍珠難道真是由一粒粗糙的沙礫形成的嗎？
  - label: D
    content: 我們只看見不幸的表面，流血的創口，受傷的心，我們只會埋怨、訴苦、哀憐不滿。
  lesson_raw:
    title: 一顆珍珠
    basis: 題目直接提及杏林子〈一顆珍珠〉
- id: doc_113_高雄_陽明_國文_g7s1e1_s2_21
  section: 2
  number: 21
  type: single
  page: 3
  stem: 關於杏林子所著〈手的故事〉一文，下列敘述何者有誤？
  options:
  - label: A
    content: 作者認為手的外表美醜並不重要，內心的良善更有價值
  - label: B
    content: 描寫杜瑞及其友人之間真摯的友情，是一篇感人的短篇小說
  - label: C
    content: 文中引用「掌心向下」的故事為例，說明「施比受更有福」的道理
  - label: D
    content: 杜瑞發現友人為他犧牲的手變得粗糙，先是痛心不已，而後是不勝感激。
  lesson_raw:
    title: 手的故事
    basis: 題目提及杏林子〈手的故事〉
