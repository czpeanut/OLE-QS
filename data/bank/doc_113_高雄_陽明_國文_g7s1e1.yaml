- id: doc_113_高雄_陽明_國文_g7s1e1_s3_44
  section: 3
  number: 44
  type: single
  page: 8
  stem: 在「鄭人買履」這則寓言中，下列何者可能是鄭人最後的結局？
  options:
  - label: A
    content: 鄭人買完鞋子，回到家才發現鞋子尺寸不合，但市集已結束
  - label: B
    content: 鄭人試穿之後覺得尺寸合適，立刻回家拿錢到市集買到鞋子
  - label: C
    content: 鄭人太晚出門錯過市集，沒買到合適的鞋子搭配失去自信心
  - label: D
    content: 鄭人因返家取腳樣，而耽誤時間錯過市集，最後買不到鞋子。
  group_stem: "鄭人有欲買履者，先自度其足而置之其坐。至之市，而忘操之，已得履，乃曰：「吾忘持度。」反歸取之，及反，市罷，遂不得履。人曰：「何不試之以足？」曰：「寧信度，無自信也。」\
    \                  \n                                     (改編自《韓非子．外儲說左上》)\n【註解】度：先套量好。市罷：市集已經散了。"
