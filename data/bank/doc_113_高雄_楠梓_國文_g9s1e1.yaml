- id: doc_113_高雄_楠梓_國文_g9s1e1_s2_32
  section: 2
  number: 32
  type: single
  page: 6
  stem: 根據本文，下列敘述何者正確？
  options:
  - label: A
    content: 大多數統治者，往往捨棄母國原鄉之地名，主張創新地名
  - label: B
    content: 玉井、燕巢、馬公等地名，皆源自於日本部分縣市的名稱
  - label: C
    content: 臺灣各地目前所使用之地名，只受到日本殖民文化的影響
  - label: D
    content: 現今臺灣許多地名，大多在1920 年左右改訂，並沿用至今
  group_stem: "請閱讀以下文章，並回答第32～33 題：\n  不論是移民或殖民，統治者往往將母國或原鄉的地名挪用過來，例如荷蘭人在臺灣興築Zeelandia（熱蘭遮城），名稱來自母國Zeeland（西蘭省）；英國移民將Manchester（曼徹斯特）、Baltimore（巴爾的摩）等地名搬到美國；清代閩粵移民則將安溪、同安、南靖、潮州等地名帶來臺灣。臺灣過去曾被日本殖民統治，從部分被保留下來的線索中，都可窺見那段日治時期的影子。\n\
    \  1920 年，臺灣總督府調整行政區域，全臺各地名同時進行改名。改名原則包括：組合式、地名簡化、從堡或里的名稱而改、取原地名的同義字、日語轉化、創新地名等等。其中部分新名則是移植自日本部分縣市，直接從日本搬來臺灣的地名，像是大家熟悉的「板橋」來自於東京都板橋區、「高雄」則是源自日本佛教勝地京都高雄山，這些地區名稱來源皆源自於日本。另外，也有許多地名是因為臺日讀音相近，從日語漢字讀音轉換而來，例如：「玉井」原名「噍吧哖」、「燕巢」原名「援巢中」、「馬公」原名「媽宮」。臺灣各地有許多地名，都在此次行政區調整中改定，而且延續使用到現在。\n\
    ――（節錄自黃驗、黃裕元等編臺灣歷史地圖增訂版）"
