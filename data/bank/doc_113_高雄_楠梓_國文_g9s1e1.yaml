  section: 2
  number: 27
  type: single
  page: 4
  stem: 根據本文，關於動物們的敘述，下列敘述何者正確？
  options:
  - label: A
    content: 蜘蛛主動挑釁蛇
  - label: B
    content: 蜈蚣藏在洞穴中
  - label: C
    content: 蚯蚓拔光蜈蚣的腳
  - label: D
    content: 蛇最後把蜘蛛吃掉
  group_stem: "請閱讀以下文章，並回答27～28 題：\n  嘗見一蜘蛛布網壁間，離地約二三尺，一大蛇過其下，昂首欲吞蜘蛛，而勢稍不及。久之，蛇將行矣，蜘蛛忽懸絲而下，垂身半空，若將追蛇者。蛇怒，複昂首欲吞之，蜘蛛引絲疾上。久之，蛇又將行矣，蜘蛛複懸絲疾下，蛇複昂首待之，蜘蛛仍還守其網。如是者三四次。蛇意稍倦，以首俯地，蜘蛛乘其不備，奮身飆下，踞蛇之首，抵死不動，蛇狂跳顛擲，以至於死。蜘蛛乃盬❶其腦，果腹而去。又見一蜈蚣，盤旋蚓穴之上，蚓匿穴中，忽探首拔去蜈蚣一足。蜈蚣怒，欲入穴，而穴小不能容。正徬徨旋繞，蚓複乘間拔其一足，蜈蚣益怒而無如之何，守穴口不肯去，蚓遂漸拔其足。閱一時許，則蜈蚣已無一足，身雖未死，而不能轉動，橫臥於地，如殭蠶❷焉。蚓乃公然出穴，噬其腹而吸食之。\n\
    ――（節錄自薛福成物性相制）\n  ※注釋❶盬：吸食。❷殭蠶︰未吐絲而死的蠶。"
  tags:
