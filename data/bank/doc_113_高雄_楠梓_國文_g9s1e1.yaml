  section: 2
  number: 25
  type: single
  page: 4
  stem: 根據本文，下列四個人在星期五的行程規劃，何者正確？
  options:
  - label: A
    content: 芙莉蓮想要自己開汽車，直接進入崗山之眼園區
  - label: B
    content: 費倫可以直接在捷運岡山高醫站，搭接駁車入園
  - label: C
    content: 欣梅爾在崗山之眼園區，能搭到10:10 的接駁車
  - label: D
    content: 艾冉欲搭17:22 的接駁車，離開阿公店森林公園
  group_stem: '請閱讀以下文章，並回答25～26 題：

    ★崗山之眼園區「停車場及接駁站點」：

    園區自8 時至19 時管制遊客機車及小客車進入，所以騎車或開車民眾需到周邊停車場先行停車，再轉搭接駁車或共乘計程車進入。周邊現有阿公店水庫管理中心、阿公店森林公園、菜寮路停車場及大莊公園等停車空間。各停車地點都規劃有接駁車及共乘計程車，接駁車每20
    分鐘一班，並視情況機動加班次，共乘計程車則隨時可搭。

    ★崗山之眼園區「接駁車相關資訊」：

    民眾盡量利用捷運抵達岡山高醫站，搭乘紅68 公車至阿公店水庫管理中心轉乘接駁車入園，減少候車時間。


    | 接駁站 | 平日首班車 | 平日末班車 | 假日首班車 | 假日末班車 | 單價(單趟) |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 阿公店水庫管理中心 | 08:20 | 16:20 | 08:20 | 17:20 | 全票25元<br>半票13元 (7-12歲兒童及65歲以上長者)<br>六歲以下兒童免費
    |

    | 阿公店森林公園 | 08:22 | 16:22 | 08:22 | 17:22 | |

    | 大莊公園 | 08:40 | 16:20 | 08:40 | 17:20 | |

    | 崗山之眼園區 | 08:50 | 17:30 | 08:50 | 18:30 | |


    ――（整理自高雄旅遊網）'
