  group_stem: "請閱讀以下文章，並回答第29～31 題：\n  每年冬至前後十天，烏魚群集洄游臺灣西部沿海，因而被稱為「信魚」，也是漁民心目中的「烏金」。烏魚子是雌烏魚的卵巢，烏魚因子而貴，在拍賣市場，母烏價格兩、三倍於公烏。烏魚群抵達臺灣西南部沿海時，正值交配前成熟階段，母烏的卵巢與公烏的精巢都最飽滿，謂「正頭烏」，相當肥美；烏魚群順臺灣沿岸南下到屏東南方外海產卵後折返，身體瘦弱且無魚子在身，稱為「回頭烏」，瘦而味劣。鹿港民諺：「要吃烏魚不穿褲。」意謂即使貧窮，也要當掉褲子買烏魚吃，有如此追求美味的氣魄，真令人大開眼界。\n\
    \  坊間所售烏魚子分為三類：品質最佳的是野生海捕烏魚子，帶著美麗的橙紅，對著光色澤如琥珀，味道有一種盈潤感。其次是美國、巴西進口烏魚子，多冷凍後再製作，其狀偏狹長形，色澤傾向暗紅偏褐，口感亦不如野生者。至於養殖烏魚子，由於缺乏運動，油脂含量偏高，口感缺乏天然的海水鹹味，有時會出現土膻氣。\n\
    \  臺灣製作烏魚子的技術，源自日治時期日本漁夫教導，其工序為去血、鹽醃、脫鹽、板壓、整形、風乾，其間猶需考量當時的氣溫和濕度。去血是先用水洗去血跡，再逼出血管裏的血液，須消除盡淨，否則成品會因殘血氧化而變黑。自母魚腹中取下魚子，切口處用棉繩綁緊，以防製作時散開。鹿港地區在取魚子時會連著一塊肉，防止烏魚卵溢出，故不需綁綿繩，成為鹿港烏魚子的標誌。\n\
    \  魚子取出後以鹽醃約五十分鐘，即洗去鹽分，進行壓形：將魚子置於鋪了白布的木板，上面壓一塊木板，層層疊放，同層的魚子務必大小一致，以免受壓不均而壞形。最上層以石塊壓實，日曬，風乾，過程還得經常翻轉烏魚子，令其日曬均勻。接下來是檢視經過壓實的烏魚子，用腸膜修補有缺角破損處，再經過日曬、風乾一至二天，日曬時需時刻擦拭烏魚子表面，令其剔透有光澤。經過適度的反覆日曬、陰乾及逐步加壓製成，從三十公斤慢慢加壓到一百二十公斤左右，是古法製作的典型。所謂遵古法製作，美學特徵是慢，慢工細活地製作，閩南語說「照起工做」，絕不投機取巧。\n\
    \  優質的烏魚子卵粒均勻，乾濕、軟硬適度，不會死鹹，而是鹹中帶甘，那甘味在咀嚼間悄然透露出來。煎烤來吃是珍饈，送禮則給出一種珍貴感，臺灣人和日本人最歡喜收到這種年節禮物。近年來，臺灣的烏魚捕獲量銳減了百分之九十，據說主要原因是大陸漁民在烏魚洄游起點，以快速拖網、炸魚方式趕盡殺絕。所幸臺灣的養烏技術日益高明，養殖的烏魚子已不似從前油膩，也漸漸少了腥味。烏魚子是一種\
    \ ________ 的食物，那濃厚的香氣總是纏綿在口腔，只要送進嘴裡，彷彿就緊緊擁抱著牙齒，捨不得離去。那是味覺的饗宴，口腔的派對。\n——（節錄自焦桐烏魚子）"
