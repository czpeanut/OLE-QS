    content: 分為上、下兩片
  - label: B
    content: 內容為豪放詞風
  - label: C
    content: 依照字數為長調
  - label: D
    content: 通篇用韻押仄聲
  group_stem: '請閱讀以下詞作，並回答第34～35 題：

    征埃❶成陣，行客相逢，都道幻出層樓。指點簷牙❷ 高處，浪擁雲浮。今年太平萬里，罷長淮❸、千騎臨秋。憑欄望，有東南佳氣，西北神州。  千古懷嵩❹ 人去，還笑我、身在楚尾吳頭❺。看取弓刀，陌上車馬如流。從今賞心樂事，剩安排、酒令詩籌。華胥❻
    夢，願年年、人似舊遊。

    ――（辛棄疾聲聲慢 滁州旅次登樓作和李清宇韻）

    ※注釋❶征埃：行人揚起的塵埃。❷ 簷牙：沿著屋簷邊緣下垂處。❸ 罷長淮：廢除長淮的界限，恢復原來版圖。❹ 懷嵩：懷嵩樓，滁州名建築物。❺ 楚尾吳頭：滁州為古代楚
    吳交界之地。❻ 華胥：古代神話中的理想國家。'
