  stem: 在高速公路休息站、風景名勝等地，可觀察到女廁往往大排長龍。近來我國學者開始倡議設置「性別友善廁所」，提供所有性別皆可使用的廁所，讓廁所效率最大化，但這樣的設計也有一些疑慮，例如：不同性別相遇會尷尬，和可能增加性騷擾、性侵害等案件。不過也有學者指出其實很多餐廳的廁所就是不分性別使用的友善廁所，只不過沒有特別標示而已。關於「性別友善廁所」設置的好處，應為下列何者？
  options:
