  section: 1
  number: 11
  type: single
  page: 2
  stem: 「雞排配珍奶」是常見的小吃搭配，在各地夜市、商圈都能看到雞排店、飲料店，可見手搖飲料和雞排深受臺灣人民的喜愛。對此下列敘述何者錯誤？
  options:
  - label: A
    content: 店家為了吸引客人，會採取行銷策略
  - label: B
    content: 店家競爭程度很高，價格由廠商控制
  - label: C
    content: 飲料店開店成本低，進入市場較容易
  - label: D
    content: 店家自由進入市場，民眾有較多選擇
