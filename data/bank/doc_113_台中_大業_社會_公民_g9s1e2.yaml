    labeled_by: ai
- id: doc_113_台中_大業_社會_公民_g9s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 近年來由於世界電子產品普及，使錫礦需求大增，印尼一躍成為世界錫礦的出口大國，但原有的礦場已逐漸耗竭，印尼蘇門答臘邦加島的礦工便開始到海上開採錫礦。關於上文中提到印尼的相關產業，下列敘述何者正確?
  options:
  - label: A
    content: 出口錫礦，印尼需支付貿易支出
  - label: B
    content: 開採錫礦為印尼較具優勢的產業
  - label: C
    content: 錫礦出口會使印尼資金流向國外
  - label: D
    content: 印尼只需要考慮開採的成本即可
