- id: doc_113_台中_大業_社會_公民_g9s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 早餐市場的規模龐大，大約有新臺幣2,000 億元，不少知名店家的每月營業額可達到上百萬元。許多店家為了爭取更多顧客，(甲)會在口味上創新，提供其他店家沒有的餐點;有些店家則是會(乙)採取不定期的套餐優惠，例如：豬肉漢堡跟中杯奶茶的組合，原價60
    元，本週優惠價50 元;也有些店家(丙)主打健康有機食品，儘管價格比同業相近產品來得高，但銷售量比同業更好。針對上文中(甲)、(乙)的內容，下列敘述何者錯誤？
  options:
  - label: A
    content: (甲)可能會因此提高店家的生產成本
  - label: B
    content: (乙)是想透過降低生產成本，吸引顧客消費
  - label: C
    content: (甲)是以價格以外的方式，增加消費意願
  - label: D
    content: 一般來說，業者採取(乙)可以使銷售數量增加
