  type: single
  page: 1
  stem: 桃園市15 家預拌混凝土業者於2018 年11 月間間開始集會，並成立桃園市預拌混凝土商業同業公會，固定聚會討論及協調分配桃園地區預拌混凝土供料案件，私下更是相互報價，形成彼此不以更低價格爭取案件之默契。2023
    年2月間，這些業者因聯合行為而遭到政府開罰。上述業者的做法違反下列何項法律的規定?
