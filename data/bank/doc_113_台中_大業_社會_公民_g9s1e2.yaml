  section: 1
  number: 6
  type: single
  page: 1
  stem: 隨著國人對生活品質的要求提升，近年來養生保健食品相當流行，然而也充滿了陷阱，許多商品會刻意誇大效果。例如：某知名藝人代言的「XXX 口含錠」，廣告暗指吃了可以改善視力，涉及廣告不實。下列哪一部法律是專為處理廠商的不當經營手法而制定？
