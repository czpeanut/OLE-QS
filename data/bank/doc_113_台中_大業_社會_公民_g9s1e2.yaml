- id: doc_113_台中_大業_社會_公民_g9s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 某企業因面臨經營危機，找來專家提出可改善的建議，專家利用右圖來解說該企業出現的問題，哪一項說法適合放入此圖中？
  options:
  - label: A
    content: 該公司一開始投入非價格競爭市場
  - label: B
    content: 甲的危機是客製化的商品獲利不高
  - label: C
    content: 塑造商品品牌形象可列為乙的做法
  - label: D
    content: 乙可透過價格來吸引更多消費族群。
