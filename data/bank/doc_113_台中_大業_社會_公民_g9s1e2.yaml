- id: doc_113_台中_大業_社會_公民_g9s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 天王周杰倫將於12 月登上大巨蛋，成為首位在大巨蛋舉辦個人演唱會的歌手，23 日中午12 點門票線上開賣，89 萬多人搶購將近15 萬張票，短短5
    分鐘內就賣光，而且網路上出現黃牛，原價6880 元的門票竟開價超過30 萬。黃牛夫妻檔以非法程式搶票再加價賣出，成為文創法修法以來，黃牛遭羈押首例。有關上述新聞報導內容，
    下列敘述何者正確？
  options:
  - label: A
    content: 黃牛票的票價是由「市場」引導產生。
  - label: B
    content: 從官方售票系統來看，可知演唱會的門票數量多於消費者需求
  - label: C
    content: 該演唱會獲取的利潤，為官方售票系統的票價乘以售出票數
  - label: D
    content: 網路黃牛票的買賣，是由「看得見的手」所操作的。
