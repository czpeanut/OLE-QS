  section: 1
  number: 7
  type: single
  page: 1
  stem: 右圖為大業國數年來主要出口產業的相關變化，依據資料判斷，該國在產業發展上，出現什麽樣的狀況？
  options:
  - label: A
    content: 西元2000 年在半導體生產上品質效果最佳
  - label: B
    content: 西元2005 年紡織成衣品質因專業化而提升
  - label: C
    content: 西元2015 年生產紡織成衣的機會成本較小
  - label: D
    content: 西元2020 年在半導體發展的機會成本較小。
