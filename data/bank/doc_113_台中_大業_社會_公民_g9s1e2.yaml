  section: 1
  number: 12
  type: single
  page: 2
  stem: 蝦皮店到店推出2 年，目前單店每日平均包裹量約400 件，如果以年底展店目標1,400 家來計算，年處理量將會突破2 億件。首當其衝，就是便利商店的超取業務。當年因為與蝦皮合作，超商的超取業務飛快成長；也因為超商，蝦皮在台灣才能靠免運快速打下市占。但如今，互相餵養的夥伴，也創造出互相競爭的敵人。面對強勁的對手，7-11
    和全家超商也相繼推出線上開店平台「賣貨便」和「好賣+」，且為吸引賣家使用，經常提供等同一般超取服務打 6 折的低運費優惠，希望提高自己物流體系利用率，但目前營運成效似乎仍存在不少的挑戰。請問上文畫底線的敘述，是在強調業者主要用何種方式來達到目的？
  options:
  - label: A
    content: 降低成本
  - label: B
    content: 非價格競爭
  - label: C
    content: 增加成本
  - label: D
    content: 價格競爭
  tags:
