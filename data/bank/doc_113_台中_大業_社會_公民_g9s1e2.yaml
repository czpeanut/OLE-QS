- id: doc_113_台中_大業_社會_公民_g9s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 同樣的商品在便利商店的售價住住比在大賣場貴一些，還是吸引很多消費者上門。這是因為便利商店不是只出售商品，也包辦許多生活上的大小事，提供非常多元的服務，例如：沖印相片、影印文件、收取包裹、繳費服務、兌換中獎發票等。超商業者提供多元化的服務屬於何種競爭方式？
  options:
  - label: A
    content: 價格競爭
  - label: B
    content: 建立認同
  - label: C
    content: 品牌形象
  - label: D
    content: 非價格競爭
