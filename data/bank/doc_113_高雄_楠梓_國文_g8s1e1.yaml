- id: doc_113_高雄_楠梓_國文_g8s1e1_s2_30
  section: 2
  number: 30
  type: single
  page: 3
  stem: 以下關於「規則和制度」的論述，何者較符合本文的論點？
  options:
  - label: A
    content: 將「結果」和「個人責任、利益」連結在一起的制度規則，能解決很多社會問題
  - label: B
    content: 若國家或組織開始出現亂象，一定是制度太抽象，不好操作
  - label: C
    content: 立法者必須修訂更具強制性、震懾性的法律
  - label: D
    content: 用合理的制度來激發人民的天使光輝，才能威懾人性的惡魔面
  group_stem: '據說盜墓一般要兩個人，比如打一個洞，其中一人下去取珠寶玉器，另一人上面用繩子繫上來，但一開始，經常發生了拉繩人見財起異，拋棄下面同伙而去的事。於是演變為盜墓團伙以父子居多，但也發生了兒子扔下墓裡親爹的事。最後形成行規：兒子下去取貨，老子上面拉繩子，就再
    沒出現過把人落在墓坑的事。如果這算是制度建設的鼻祖，那麼不妨以賊為師。德國有習慣，前面的人喜歡幫別人扶門，有人說德國民眾天生素質就高，其實也不盡然。真正的原因是聯邦德國成立後，政府制定了一套規則，
    比如德國有法律規定，關門時不小心把人撞了，你得無條件賠償，還得幫人醫治。這些規定都很具體，操作性很強。還有遵守交通規則、按秩序排隊等等，隨著時間的推移，這些良好的行為就變成了習慣，這個社會就變得文明起來了。二戰期間，美國空軍降落傘的合格率為
    99.9%，這就意味著從概率上來說，每一千個跳傘的士兵中會有一個因為降落傘不合格而喪命。軍方要求廠家必須讓合格率達到100％才行。廠家負責人說他們竭盡全力了，99.9
    ％已是極限，除非出現奇蹟。軍方（也有人說是巴頓將軍）就改變了檢查制度，每次交貨前從降落傘中隨機挑出幾個，讓廠家負責人親自跳傘檢測。從此，奇蹟出現了，降落傘的合格率達到了百分之百。有一段時間，英國政府雇傭私人船隻運送犯人，按照裝船的人數付費，多運多賺錢。很快弊端出現了：罪犯的死亡率非常之高。政府官員絞盡腦汁想降低罪犯運輸過程中的死亡率，包括派官員上船監督，限制裝船數量等等，卻都實施不下去。最後，他們終於找到了一勞永逸的辦法，就是將付款方式變換了一下：由根據上船的人數付費改為根據下船的人數付費。船主只有將人活著送達澳洲，才能賺到運送費用。新政策一出爐，罪犯死亡率立竿見影地降到了百分之一左右。後來船主為了提高生存率還在船上配備了醫生。

    人的慾望是無限的，本性的好壞也是隨時而變的，只有在分析名分下的責任權利，再有一套組織制度去監督，這樣才能人盡其能，才會有一個和諧的環境。人性有光輝的一面，也有陰暗的一面，有句話說得好：不背叛，只是因為背叛的籌碼不夠大，這種利誘大到一定程度，人性陰暗的一面就會被誘發。無論在組織還是社會裡，好的制度，能讓壞人幹不了壞事；不好的制度，會讓好人變壞。我們沒必要非要討論人性本善還是本惡，合理的組織制度，必然是授權與監督同時存在的，既相信你的能力，又懷疑你的本性，所以用制度來激發你性格中天使的一面，還要用制度來威懾你惡魔的一面。
    摘錄自《只有規則和制度才能遏制人性的陰暗》'
