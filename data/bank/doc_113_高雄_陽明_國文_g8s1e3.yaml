  stem: 員瑛最近在準備段考，但總覺得提不起勁。根據文章判斷，下列何者「不是」她可能出現的烤吐司症狀？
  options:
  - label: A
    content: 容易因在學校發生的瑣碎事件而感到莫名煩躁
  - label: B
    content: 晚上明明累極了卻常常失眠，早上起床更加疲憊
  - label: C
    content: 彷彿活火山，經常對老師和同學發脾氣、大聲咆哮
  - label: D
    content: 消極負面，甚至對原本喜歡的科目突然失去讀書動力。
  group_stem: "外酥內軟烤吐司出爐！\n南韓職場「烤吐司症候群」(토스트아웃)成社群迷因新風潮\n─陳愷昀2024-10-11\n\n    你最近常感到疲勞、昏昏欲睡？或是工作結束後覺得精疲力盡、體力透支，對任何事失去熱情與興趣？或覺得煩躁、容易受到小事影響而造成情緒波動嗎？如果有，小心你可能變成「烤吐司」囉。\n\
    \n什麼是「烤吐司症候群」？\n    韓國近期出現一個新造詞：토스트아웃，是由英文 Toast 與 Burnout 二詞結合的音譯，通常用於職場人員，尤其在千禧世代、Z\
    \ 世代的上班族中最常見。SNS 社群媒體上出現各式各樣烤得金黃微焦的吐司圖片，再配上一段「雖然最近處於#토스트아웃，但想到明天是週五還能堅持撐下去」的文字，帶起一股曬烤吐司迷因的流行旋風。\n\
    \    什麼是토스트아웃（Toastout）呢？不是早餐店老闆問你帥哥美女吐司要不要烤，而是將吐司比喻為人們身心能量完全喪失的倦怠症候群（Burnout）前兆，就像吐司在烤到焦黑成炭之前，外表正處於金黃微焦而內軟，彷彿人們身體與精神疲勞至極的狀態。\n\
    \n烤吐司症可能有什麼症狀？\n如果符合以下的症狀，請多留意自己身心狀況，你可能成為外酥內軟的「烤吐司」了。\n• 煩躁：對小事容易感到煩躁，情緒難以控制。\n\
    • 失眠：常常難以入睡或睡眠品質差，容易醒來後無法再次入眠。\n• 精疲力盡：精神容易感到疲憊，體力透支，對各種事物都失去興趣。\n• 情緒不穩：容易出現情緒波動，對日常事物反應過度，可能在上班工作時忍耐壓抑，回到家後卻突然間情緒爆炸。\n\
    • 逃避感：出現想逃避工作或日常生活的想法，有些上班族甚至會浮現這樣的念頭——「如果通勤途中出車禍或是受傷，是不是就能休息一個月不工作了呢？」\n\n烤吐司症比倦怠症更可怕？Ｗhy？\n\
    \    倦怠症候群（Burnout）在2019 年被世界衛生組織（WHO）正式認定為一種工作相關的健康問題，因為長期、慢性的工作壓力未獲得適當管理而引發的狀態；在瑞典等部份歐洲國家，也被認為是一種允許有薪病假的疾病。\n\
    \    而處於身心崩潰前期的「烤吐司症候群」目前尚未被歸類為醫學症狀或心理疾病，但前述的症狀通常已是身心不堪負荷的警示信號。\n    會陷入烤吐司症狀態主要是因為日常生活中，反覆出現的壓力或持續性的乏味，擔心會被誤解為懶惰或不思進取，所以處於烤吐司症狀態的人即使生活失去動力，依然會不自覺地勉強自己繼續忠實履行份內角色，旁人若不仔細觀察是看不出來的。\n\
    \    雖然，相比於身心能量透支、完全無助的倦怠症候群，症狀仍相較輕；但如果「烤吐司症」狀態持續太久，就很容易轉變為甚至超越倦怠症，進而引發憂鬱、焦慮或身體疾病。\n\
    \n先別管MBTI 了，今天你是哪一種烤吐司？\n除了外酥內軟的烤吐司症，社群媒體上還衍生出其他各式各樣的變體迷因，例如：\n• 火腿烤吐司（햄 토스트）：過著帶點鹹味（心酸）的一天，迫切需要做些什麼解壓。\n\
    • 生菜烤吐司（양상추 토스트）：累到像夾在吐司裡的軟爛生菜，沒活力而無精打采。\n• 奶油烤吐司（버터 토스트）：像奶油一樣快要融化了，困倦不堪，極度需要補眠。\n\
    • 起司烤吐司（치즈 토스트）：認為日子過得單調枯燥，極度需要來點新鮮感。\n• 雞蛋烤吐司（계란 토스트）：因繁忙耗費過多體力，需要進食以補充新能量。\n\
    甚至還出現因為熬夜或過度工作，導致大腦運轉超出負荷如空心麵包一樣的「空心麵包倦怠症（공갈빵아웃）」等類型與說法。\n\n「烤焦了怎麼辦？」如何從Toastout\
    \ 狀態中恢復\n    倦怠症（Burnout）和烤吐司症（Toastout）不一定只發生在上班族身上，學生、家庭主婦、自由工作者也都會有身心疲憊的時刻，任何人都有潛在可能成為烤吐司。\n\
    \    許多人在壓力下持續工作，忽視內心的疲憊感，容易導致精神上的過度消耗。最重要的是先正確認識自己當下的身心狀態，透過充分的休息和減壓來恢復精力，找到能長期放鬆的休閒活動，或在工作區間進行簡單伸展或散步等短暫紓壓，也都是避免烤吐司症進一步發展為倦怠症（Burnout）的有效方式。\n\
    \    其次，重新評估工作的優先順序，減少不必要的工作負擔。如果工作量過於繁重，與上司或同事協商分配工作任務，避免情緒過度消耗之外，透過冥想練習讓心靈沉澱平靜，促進精神復原也是對抗情緒枯竭的好方法，才能避免陷入「烤吐司症」的狀態。"
