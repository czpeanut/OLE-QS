  stem: 根據本文，下列敘述哪一項是正確的？
  options:
  - label: A
    content: 古人種植花木，只是為供人觀賞玩樂，對於品德修養和學業進修沒有幫助
  - label: B
    content: 配戴玉佩、象牙製手環，放在座位右邊的器物要斜放，純粹為了裝飾美觀
  - label: C
    content: 竹子經歷風霜而不變，外柔內剛就像是面對重大考驗而能堅貞守節的君子
