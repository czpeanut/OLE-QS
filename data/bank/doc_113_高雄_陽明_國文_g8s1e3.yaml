    content: 黃中立懷有才能，仍未得機會施展，因此建立了尚節之亭，藉以博取美名。
  group_stem: "劉基〈尚節亭記〉(節錄)\n古人植卉木而有取義焉者，豈徒為玩好而已。故蘭取其芳，諼草① 取其忘憂，蓮取其出淤泥而不染。不特卉木也，佩以玉，環以象②\
    \ ，坐右之器以敧③ ，或以之比德而自勵，或以之懲志而自警；進德修業，於是乎有裨④ 焉。\n  會稽 黃中立，好植竹，取其節也；故為亭竹間，而名之曰「尚節之亭」，以為讀書游藝之所，澹乎無營乎外之心也⑤\
    \ 。予觀而喜之。\n  夫竹之為物，柔體而虛中，婉婉焉而不為風雨摧折者，以其有節也。至於涉寒暑，蒙霜雪，而柯⑥ 不改，葉不易，色蒼蒼而不變，有似乎臨大節而不可奪之君子。信乎！有諸中，形於外，為能踐其形也。然則以節言竹，復何以尚之哉？\n\
    \  世衰道微，能以節立身者鮮矣。中立抱材未用，而早以節立志，是誠有大過人者，吾又安得不喜之哉？\n注：① 諼草：即萱草，古人以爲可使人忘憂。故又名忘憂草。\n\
    \  ② 環以象：戴象牙製的手環。\n    ③ 坐右之器以敧：座位右側的器物要斜放。敧，傾斜、倚靠。\n    ④ 裨：益處。\n  ⑤ 澹乎無營乎外之心：心中清淡無慾，不追求外物。\n\
    \    ⑥ 「柯」不改：草木的枝莖。"
