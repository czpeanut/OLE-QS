- id: doc_113_高雄_陽明_國文_g8s1e3_s3_31
  section: 3
  number: 31
  type: single
  page: 6
  stem: 「現在，牆的西邊只剩下蓋茲，牆的東邊只剩下含月了。蓋茲依然能聞到牆東邊飄來的飯菜香，但再也聽不見有人叫『挨千刀的』了。含月依然能看見牆西邊的車出出進進，但耳邊叮叮咣咣的聲音卻沒有了」根據這段文字所述，下列敘述何者正確？
  options:
  - label: A
    content: 以「只剩下」委婉地表達絲黛娜和啟華皆已過世
  - label: B
    content: 含月在啟華過世後，茶飯不思，已無心下廚
  - label: C
    content: 蓋茲將原本給絲黛娜的飯勺全都丟光光了
  - label: D
    content: 描寫東、西兩家失去伴侶後的生活仍未改變。
  group_stem: "拆牆\n    牆不高，牆上爬著老藤，老藤緊貼著牆扭來扭去，扭著扭著就張開了一片片心形的綠葉。夏天的時候，綠葉一片挨著一片，牆就羞答答地縮在綠葉下面，好像站錯地方的壞孩子；冬天的時候，綠葉一片片退了，牆就縮縮瑟瑟地立在老藤暴起的筋絡中，好像手足無措的漢子。\n\
    \    牆的西邊住著蓋茲和絲黛娜，牆的東邊住著啟華和含月。\n    啟華活著的時候，嘲笑地告訴含月：「隔壁那個美國老頭在我的雜貨店裡買了一大把大大小小的飯勺，掛在車裡的反光鏡上。說那是給他老婆買的五十大壽的壽禮。」含月把眼睛瞪得大大的，一連幾天，一看見洋老頭的車開進開出，耳邊就響起飯勺叮叮咣咣的聲音。\n\
    \    絲黛娜活著的時候，驚恐地告訴蓋茲：「隔壁那個中國老太婆又在叫她的丈夫吃飯了，你知道她叫他什麼──『挨千刀的』。聽說，那意思就是要割她丈夫一千刀。」蓋茲的嘴巴張得大大的，每次等那個中國老頭吃完飯出來散步，蓋茲就盯住那個老頭上下看，看他有沒有受傷的樣子。\n\
    \    現在，牆的西邊只剩下蓋茲，牆的東邊只剩下含月了。蓋茲依然能聞到牆東邊飄來的飯菜香，但再也聽不見有人叫「挨千刀的」了。含月依然能看見牆西邊的車出出進進，但耳邊叮叮咣咣的聲音卻沒有了。\n\
    \    有一天蓋茲在信箱裡發現一張生日賀卡，那是寄給含月的，郵遞員不當心放錯了，蓋茲就想著要給牆東邊的鄰居送回去。又想起去年絲黛娜過生日買了一套飯勺，絲黛娜歡喜得要命，只是還沒來得及用，人就走了。牆東邊的鄰居那麼喜歡烹調，就把那套飯勺轉送給她作生日禮物吧。於是蓋茲就拿著飯勺轉到了牆東邊。牆東邊的園子裡綠油油地種了兩畦青菜和幾架長豆，長豆架下還插著空兒點了一些辣椒秧子和青蔥。蓋茲繞過菜地，去按鄰居的門鈴。門簷上掛著一串白瓷青花的小風鈴兒，風鈴兒笨笨拙拙地在晚風中微晃，發出一些細如清泉的聲音。蓋茲從來沒有想過一牆之外會是這麼一個讓他好奇的世界。\n\
    \    含月正對著自己孤獨的生日晚餐流淚，隔壁的洋老頭突然給她送來了一大把飯勺。雖然她當初對這樣的生日禮物百思不解，但這時她覺得禮物是什麼並不重要，重要的是有人想到了她。就像天下的好男人很多，她只要一個跟她廝守著就行了。蓋茲的來訪使含月很高興，她客客氣氣地邀請蓋茲和她一起就餐。蓋茲受這美好的菜香味誘惑已經多時，得此一請，也就不客氣地坐下來大嚼一頓。含月高高興興地看著這個洋老頭像小孩子一樣吃得搖頭晃腦，心裡感到：生活裡的好滋味原來不是只為了自己嘗，而是要有人來分享才有意義。\n\
    \    過了兩天，含月又做了一大盤好飯菜給牆西邊的洋老頭送去。她轉過牆西邊，看見一個盛開著玫瑰花的花壇和修剪得如同地毯一樣平整的草坪。草坪上立著幾棵筆直的柏楊樹，有一個紙板剪的黑花奶牛倚在一棵樹幹上，還有鋼琴聲從屋裡傳出來。含月覺得美國人也真夠浪漫。\n\
    \    三來兩往，牆西邊的玫瑰花越過牆到了東邊主人的花瓶裡，牆東邊的嫩青菜越過牆到了西邊主人的餐桌上。\n    一日，饕餮之後，蓋茲想起了那個「挨千刀的」的故事，就膽顫心驚地問起含月他是不是有可能哪一天也要挨上幾刀。含月羞得滿臉通紅，結結巴巴地解釋道：「中國人說話是守著『否極泰來』的意思，愛到深時，總把話兒反著說。」蓋茲不懂，他認為愛到深時就該叫「Honey（蜜人兒）」，於是蓋茲就開始叫含月「Honey」，含月發現她也喜歡被叫作「Honey」。她想：人呀，都一樣，星空月下，風鈴晃出的曲子和鋼琴奏出的音樂一樣動聽。有一天傍晚，蓋茲聽見含月站在綠油油的青菜地裡叫：「『挨千刀的』回來吃飯啦。」蓋茲就在鮮豔的玫瑰花壇邊應道：「Honey，我給你買了一套飯勺。」──這一天又是含月的生日。\n\
    \    後來，蓋茲和含月的兒女們回來把牆給拆了，東邊的菜地和西邊的花園就和和睦睦地連起來了。人們發現世界原本就該是這樣參差多樣，不能相容的不是多樣的世界，只是人造的牆。"
