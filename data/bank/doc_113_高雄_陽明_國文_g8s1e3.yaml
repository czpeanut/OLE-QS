  - label: C
    content: 以「坎特里爾階梯量表」彙整2024 這一年間全球數十萬人的生活評分作為排行依據
  - label: D
    content: 芬蘭第七度拿下榜首，北歐五國一如既往皆進入前十名，堪稱世界上最幸福的地區。
  group_stem: "「我要的幸福在不遠處？」世界幸福報告出爐：\n芬蘭奪冠、台灣亞洲第四、北美幸福倒退(節選)\n李芸 2024-03-28\n    你覺得你的生活幸福嗎？雖然每個人對幸福的定義都不太一樣，不過可從聯合國自2012\
    \ 年起製作的《世界幸福報告》（World Happiness Report）見端倪。2024 年的《世界幸福報告》於3 月20 日出爐。今年，聯合國與蓋洛普（Gallup）、牛津大學幸福研究中心（Oxford\
    \ Wellbeing Research Centre）合作，利用蓋洛普2021 至2023 年間，向各國民眾發布的民調，請民眾對自己生活的主觀評分，再依此結果綜合計算各國的幸福程度。\n\
    \    這份調查使用了「坎特里爾階梯量表」（Cantril Ladder）——引導民眾想像一個階梯，最高層代表最好的生活，可獲得10 分；最低層則為最糟糕的生活，得分為0。接著，再回答自己身處於哪一層。\n\
    \    每年，蓋洛普都會在全球143 個國家和地區，各蒐集1,000 多份調查結果。為了避免單一年度的數據不穩定，團隊綜合過去三年的數據，將2021 至2023\
    \ 年間，全球數十萬人的生活評分彙整為各國幸福排行。排行出爐後，再觀察各國的國內生產毛額（GDP）、社會支持度、健康預期壽命、自由程度、慷慨程度、貪腐程度、正面與負面情緒等指標，與國民幸福程度的關聯性，進一步分析各國處境。\n\
    \    台灣獲得6.5 分，排行全球第31 名，亞洲區第四名。綜觀所有亞洲國家，最高分的為第五名的以色列，接下來是第22 名的阿拉伯聯合大公國、第30 名的新加坡；台灣鄰近的國家中，日本為第51\
    \ 名、韓國第52 名、中國第60 名、香港則為第86 名。\n\n幸福也存在世代差異\n    有別以往，今年的《世界幸福報告》研究團隊特別以年齡分組，呈現不同年齡階段幸福感的差異。報告針對各國整體人口、30\
    \ 歲以下、30 至44 歲、45 至59 歲以及60 歲以上等5 個類別，分別進行幸福程度排名。\n    經過分類，可以發現在同個國家中，老年人與年輕人的幸福感，可能存在巨大差異。\n\
    \    上面這張圖表，則呈現近年世界各個地區，不同年齡層幸福感的變化趨勢。藍線為2006 至2010 年間的數據，橘線則為2021 至2023 年間。報告指出，從全球角度來看，千禧世代①\
    \ 的幸福感，普遍隨著年齡增長下降；相反地，嬰兒潮世代② 隨年齡增加，感到越來越幸福。\n    藉由統計結果，《世界幸福報告》團隊希望能讓政府有所參考，可採取相應的對策。\n\
    注：① 千禧世代：指1980 年代至1990 年代中期出生的人。較大比例可受高等教育、網路發展蓬勃的年代。\n  ② 嬰兒潮世代：1946 年至1964 年之間出生的一代人，二戰結束後觸發了嬰兒潮。"
