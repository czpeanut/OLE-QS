  type: single
  page: 5
  stem: "我們有時候會看到小鳥歪著頭，這是人類在「有點不清楚對方說什麼」時擺出的姿勢。但做出這個動作的鳥類，並不是覺得有什麼疑惑，也不是為了對人類裝可愛，而是因為想要看清楚周圍。\n\
    \    小鳥的眼睛基本上在兩旁，能夠清楚看見水平方向的景物。這樣的話身體結構，方便牠們經常確認周遭狀況，尋找食物與天敵。\n    鳥類與我們人類不同，無法透過轉動眼球來看清楚各個方向，所以牠們為了看見四面八方，得經常轉動頭部。換句話說，鳥類歪頭是因為想要看清楚上方的天敵。\n\
    \    此外，鳥類也有慣用眼，觀察看看每隻個體是否有習慣歪頭的方向，說不定也很有趣。\n                      ──節錄自一日一種《鳥類的機智都市生活》\n\
