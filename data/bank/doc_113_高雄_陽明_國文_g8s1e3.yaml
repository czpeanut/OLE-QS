  group_stem: "買春聯\n    我想買春聯，只要幾個「春」字、「福」字就可以了，可是該到哪兒買呢？我不要大賣場裡賣的，那些都是印刷品，我要手寫的，筆酣墨濃的書法，看得見汁液的流動、新乾的痕跡，這年頭得到哪兒買這樣的春聯呢？\n\
    \    其實在中學時代練過字，也臨過宋徽宗、趙孟頫，那修長挺拔的「瘦金體」甚至是影響了自己的硬筆字，但毛筆字就是不夠好，不免有些遺憾。\n    我的哥哥卻寫得一手好字，小時候媽媽將哥哥託給了韓伯伯，讓他教哥哥習字。韓伯伯的字是村裡公認的好，過年時韓伯伯就寫了許多春聯分送大家，家家戶戶的門楣掛上韓伯伯的字，感覺上頭的「福」，人人都分得到。後來哥哥學習有成，擔起大任，家裡的「春」、「福」就由哥哥來寫，我就只是一旁磨墨的小書僮。\n\
    \    我的毛筆字是爸爸扶著我的手教我寫的，而爸爸的字總與我的生活息息相關——我從小迷糊，不知幾回，不是忘了帶傘就是弄丟它們，不過爸爸從不苛責我的，他用毛筆沾橘紅色油漆在黑雨傘上寫上我的大名，就是我自己忘了，也會有人提醒我拿傘。下雨天我一撐起傘，常引起旁邊無聊的小男生念念有詞，他們總以為我會害羞，大聲念我的名字。我心裡卻是得意的，我知道爸爸的書法是雨傘上最漂亮的標籤。\n\
    \    如今，國小二年級的兒子，這學期老師已經要他們帶毛筆到學校教他們寫春聯了，他連鉛筆都拿不好呢！到文具店給兒子選筆，四處逛逛，不經意看見一疊疊裁好的「萬年紅」、閃著細細金粉的「灑金宣」，心底有個聲音在說：買幾張回去吧！我的字雖然不夠好，但我仍想要扶著兒子的手，蘸滿濃濃的墨，工工整整在紅色宣紙上寫一個「福」字，貼在他的房門口。\n\
    \                                    ——改編自宇文正〈買春聯〉"
