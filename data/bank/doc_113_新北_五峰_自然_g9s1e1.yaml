  type: single
  page: 1
  stem: 下列關於岩石的敘述何者正確？
  options:
  - label: A
    content: 石灰岩變質成大理岩後成分發生改變
  - label: B
    content: 臺灣北部的大屯火山群主要由安山岩構成，屬陸地火山噴發岩漿慢慢冷卻而成，礦物結晶顆粒大於花岡岩和玄武岩
  - label: C
    content: 澎湖群島主要由玄武岩構成，屬海底火山噴發岩漿迅速冷卻而成，礦物結晶顆粒小於安山岩和花岡岩
  - label: D
    content: 金門、馬祖列島主要由沉積岩構成，有可能在地層中採集到化石，有助於研究該地的地質歷史。
