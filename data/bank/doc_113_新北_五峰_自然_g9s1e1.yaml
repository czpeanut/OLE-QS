  section: 1
  number: 2
  type: single
  page: 1
  stem: 關於海水鹽度的敘述何者正確？
  options:
  - label: A
    content: 全世界海水的平均鹽度約35%
  - label: B
    content: 世界上鹽度最高的海水是死海，達到35‰
  - label: C
    content: 海水中最多的鹽類是氯化鈉，其次是氯化鎂，故海水中最多的離子是氯離子
  - label: D
    content: 赤道地區因蒸發量>降水量，故海水鹽度較高。
