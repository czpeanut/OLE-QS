  stem: 北海岸新北市瑞芳區深澳漁港的海岸地形「象鼻岩」(右圖)，狀似象鼻伸入水中的拱門造型，不幸於2023 年12 月16 日13 時左右在強浪拍打下斷裂崩塌(虛線部分)，北海岸從此少了一處知名自然景觀，令人不勝唏噓！有關「象鼻岩」的消失，下列敘述何者錯誤？
  options:
  - label: A
    content: 象鼻岩在海岸地形上稱為「海蝕洞」
  - label: B
