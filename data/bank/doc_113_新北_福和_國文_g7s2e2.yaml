- id: doc_113_新北_福和_國文_g7s2e2_s4_33
  section: 4
  number: 33
  type: single
  page: 6
  stem: 關於【甲】文中「君子勞心，小人勞力」一句的意思，下列何者說明最恰當？
  options:
  - label: A
    content: 君子在待人處事上會同理他人感受，小人則自私自利
  - label: B
    content: 君子的優點在於心思縝密，而小人的特質則是力大無窮
  - label: C
    content: 君子只能仰賴個人智慧，而小人則能集結群眾共同出力
  - label: D
    content: 君子透過智謀和心思來行事，而小人則依賴體力來完成工作
  group_stem: "(四)請閱讀以下資料，並回答 33〜35 題：【文本比較挑戰題】\n\n【甲】\n    後魏 高祖名子曰恂、愉、悅、懌。崔光名子勵、勗、勉。高祖謂光曰：「我兒名傍皆有心。卿兒名傍皆有力。」答曰：「所謂君子勞心，小人勞力。」上大嗟悅。\n\
    ——《太平廣記》\n\n【乙】\n    姓名乃標示「我是誰」之首端。「媜」字神祕莫測，《康熙字典》才找得到，讀音如「爭」非「真」。折騰到十七歲，字寫對了，會念了，但不知是什麼意思。……大學時上聲韻學，得知「媜」字念「爭」，義為「女字」，女子名字。撰聯名家張佛千先生曾以我名為題賜下一聯：「文章高詣貴在簡，女子美字古曰媜。」蘊含勉勵之意。女子美字，既云女子有個美好的名字，又可衍義為寫得一手好字，再撮要假借為博得「文章美名」的女子，誰云不宜。\n\
    \    貞，會意字，______字形似一口寶鼎加上一支神杖「卜」形，相合而為：依據鼎內火炙變化而察看神跡。遠古殷商，無事不占卜，貞人即卜人，卜者釋義需求正確、堅定，故衍生貞定、堅貞、貞節之辭，所指皆是不可動搖的精神境界。《康熙字典》收有「媜」字，自字面推想，从女从貞，寓意品德貞潔女子，然我更愛這麼想：一個善占卜的女巫。而「簡」本是遠古用來書寫的狹長竹片，既簡且媜，一個聚精會神觀察大鼎內火炙變化再將占卜結果寫在竹片上的女巫形象，躍然而出。就是她，自古而來，附臨我身。\n\
    ——改寫自簡媜〈迷霧中，呼喚我的名字〉"
