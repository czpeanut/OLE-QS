  options:
  - label: A
    content: 「從十米高臺 ∕ 陶醉於下面的湛藍」：詩人藉由「陶醉」一詞，表達對目標相當投入且樂在其中的情懷
  - label: B
    content: 「在跳板與水面之間 ∕ 描畫出從容的曲線」：詩人意在誇獎跳水者天賦異稟，能展現出肢體的力與美
  - label: C
    content: 「讓青春去激起 ∕ 一片雪白的讚嘆」：詩人發揮想像力，透露跳水者得到了觀眾漸入佳境的評價
  - label: D
    content: 全詩以「跳水前→跳水過程中→跳水後」的順序敘述，每個階段的跳水畫面描繪都極具動態感
