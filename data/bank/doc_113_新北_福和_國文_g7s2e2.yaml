  stem: '針對文中提到放天燈對平溪地區帶來的利與弊，洛哥做了表格整理，下列何者有誤？


    | | 內部 | 外部 |

    |---|---|---|

    | 利 | 優勢 Strengths<br>(A) 帶來大量觀光人潮，繁榮地方經濟 | 機會 Opportunities<br>(B) 放天燈成為國際盛事，增進臺灣的知名度
    |

    | 弊 | 劣勢 Weaknesses<br>(C) 散落各地的垃圾造成當地環境汙染 | 威脅 Threats<br>(D) 天燈殘骸破壞動植物棲地，引發外國批判
    |'
  options:
  - label: A
    content: 優勢 Strengths：帶來大量觀光人潮，繁榮地方經濟
  - label: B
    content: 機會 Opportunities：放天燈成為國際盛事，增進臺灣的知名度
  - label: C
    content: 劣勢 Weaknesses：散落各地的垃圾造成當地環境汙染
  - label: D
    content: 威脅 Threats：天燈殘骸破壞動植物棲地，引發外國批判
  group_stem: "(三)請閱讀以下資料，並回答31〜32 題： 【現代詩文閱讀題組】\n\n    在美麗的天燈施放過後，我們所看不到的，是隨之而來散落在各地的垃圾，不僅造成環境汙染，隨時可能引起的火災，也讓平溪周邊的民眾隨時處在警戒狀態。\n\
    \    有環保團體呼籲，不要再到平溪放天燈，以保護山林；別再製造擾人的垃圾，因為有些天燈甚至會落到河川內，對於棲地造成破壞。就算天燈的材質都是紙與木，可以自然被環境分解，但短期內來看，還是對於周邊居民有嚴重的影響。\n\
    \    如果把「天燈」這個要素因為保護環境之故而從平溪取消，恐怕平溪線鐵道都有可能因為漸漸減少的人潮而黯淡，不僅造成當地經濟效益的損失，連帶會影響國際觀光效益。\n\
    \    天燈，就好比平溪的命脈，它的重要性甚至被 Discovery 評為「全世界最重要節慶」第二名（僅次於巴西嘉年華）、CNN 也推荐為「世界上最值得參與的年度新鮮事」之一。\n\
    \    現在最重要的，是臺灣民眾自發性地減少、甚至不要再施放天燈，漸漸改變觀念，總有一天能讓施放天燈的垃圾愈來愈少。\n    下次來到平溪，不應該再以天燈為主，而是看看當地特殊的鐵道文化、基隆河谷壺穴美景、十分瀑布的渾然天成、菁桐煤礦的興衰過往故事、十分老街的美食傳統、日治時期的老舊宿舍環境等，平溪還有許多值得旅人挖掘的好地方。\n\
    ——節錄自魯皓平〈放天燈是傳統，還是為山林製造更多垃圾？〉"
