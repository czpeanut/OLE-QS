  section: 4
  number: 26
  type: single
  page: 4
  stem: 根據本文，無法推知下列何者？
  options:
  - label: A
    content: 芬蘭將學生在國際學習成就評估中表現優異的原因歸功於教育數位化學習
  - label: B
    content: 芬蘭學生的PISA 成績表現明顯下滑，與過度依賴數位化學習有關
  - label: C
    content: 透過問卷調查，芬蘭全國有七成家長和八成老師反對普及電子教材
  - label: D
    content: 紙本授課與數位學習如何取得平衡會影響學生的學習效果
  group_stem: "(一)請閱讀以下資料，並回答 26〜28 題： 【應用文素養題】\n\n芬蘭教育數位化 30 年後問題浮現！學生表現下滑 紙本教科書重獲青睞\n\
    \n2025-03-21 13:06 聯合新聞網／ 綜合報導\n\n    被視為「教育先進國」的芬蘭，曾積極推動數位化學習，甚至在中學普及電子教材。但根據日媒「讀賣新聞」報導，近年來隨著學生成績下滑及注意力下降等問題浮現，當地政府與學校開始重新評估政策，並逐步恢復使用紙本教科書。\n\
    \    芬蘭自 1990 年代起推行教育數位化，並在 2000 年開始的國際學習成就評估（PISA）中表現優異，在全球閱讀、數學及科學多領域曾名列前茅。但從\
    \ 2022 年開始，芬蘭學生的 PISA 成績表現明顯下滑，排名跌至閱讀第 14、數學第 20、科學第 9。教育部長坦言，教育體系無法完全適應快速數位化，必須重新檢視方向。\n\
    \    芬蘭小城里希馬基（Riihimäki）曾是教育數位化的先驅，當地中學約十年前開始推行「一人一台筆電」政策。但在 2 月下旬時，英語和數學等科目已重新採用傳統教科書與筆記方式授課。一位\
    \ 14 歲的學生表示，紙本比電子書更容易理解，學習效果較佳。該市教育長則指出，過去每週超過 20 小時的電腦學習，使學生專注力下降，情緒變得急躁，引發全國擔憂。在\
    \ 2023 年底，該市也針對中學生、家長及教職員約 2000 人進行問卷調查，有七成家長和八成老師希望恢復紙本授課。\n    在 2022 年的 PISA\
    \ 中取得三項第一的新加坡，也在 2023 年時決定不讓小學生使用電子設備，因擔心數位設備會影響孩子身心的發展。\n    芬蘭和新加坡的經驗顯示，教育數位化並非萬靈丹，過度依賴科技可能適得其反。隨著這些學校逐步恢復紙本教材，或許在數位與傳統學習方式間取得平衡，才能確保學生能獲得最佳學習效果。"
