  - label: C
    content: 前調：柏樹、大西洋雪松／中調：檀香、西伯利亞冷杉／後調：沉香、麝香
  - label: D
    content: 前調：四川胡椒、薑黃／中調：茉莉、土耳其玫瑰／後調：廣藿香、白麝香。
  group_stem: '調香是一門藝術，我們常聽到香水的前調、中調及後調，即是香氣進入鼻腔後，會先明顯感受到前調的香氣，隨著時間流逝陸續聞到中、後調的香味。前調儘管是門面，時間卻最為短暫；中調則是一支香水的重頭戲，後調則是作為存在感較低，低調安定的收尾。而麝香可用在各種香水當中，主要是用來當作定香劑，讓香氣更持續散發。一般而言，香調可以分為以下七類：

    | 香調分類 | 特色 | 推荐使用時機 |

    | --- | --- | --- |

    | 柑橘調 | 多使用佛手柑、檸檬及柳橙等，展現充滿陽光與活力的香氣 | 炎炎夏日仍想保有清爽時 |

    | 海洋調 | 可呈現出清新的海洋與沙灘氣息 | 夏季休閒、度假時刻 |

    | 綠香調 | 多使用薄荷、白松香、快樂鼠尾草等，給人愜意、舒適的放鬆享受 | 春夏季、郊遊踏青 |

    | 果香調 | 常見的有蜜桃、蘋果、草莓、莓果、櫻桃、鳳梨等，可展現甜美活力與魅力 | 日常休閒、約會 |

    | 花香調 | 以玫瑰、茉莉、晚香玉、橙花、鈴蘭等較為常見，給人氣質優雅浪漫的感受 | 日常休閒、約會 |

    | 木質調 | 常見的香材包含雪松、杉樹、檀木、沉香等，可使人散發出沉穩氣場 | 秋冬時節、日常工作、商業聚會或約會 |

    | 東方調 | 常使用香草、樹脂類等原料，香氣較為濃郁、溫暖 | 秋冬、朋友聚餐或約會 |'
