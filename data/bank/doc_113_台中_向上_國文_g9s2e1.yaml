  stem: '明 萬曆中，錢若賡守臨江，有異政。有鄉人持一鵝入市，寄店中後他往。還，索鵝，店主賴之，云：「群鵝我鵝也。」鄉人不平，訟於官。公令人取店中鵝，計四隻，各以一紙，給筆硯，分四處，令其供狀。人莫不訝之。食頃，使人問鵝供不？答曰：「未。」又頃，下堂視之，曰：「狀已供矣。」手指一鵝曰：「此鄉人鵝。」眾人怪之，守曰：「鄉人鵝食草，糞色青；店鵝食穀粟，糞色黃。」店主服罪。

