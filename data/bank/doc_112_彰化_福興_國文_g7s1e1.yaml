- id: doc_112_彰化_福興_國文_g7s1e1_s3_1
  section: 3
  number: 1
  type: single
  page: 3
  stem: 根據本文，下列說明何者正確？
  options:
  - label: A
    content: 「運動前皮質」會幫助我們轉換注意力的焦點，選擇執行的任務
  - label: B
    content: 在一天之內若不斷切換注意力，可能會減緩大腦百分之十的工作效率
  - label: C
    content: 運用番茄鐘工作法時，要在一處不被人打擾的地方，且要使用番茄鐘計時器
  - label: D
    content: 若每次工作二十五分鐘，就休息五分鐘，不斷循環四至五回合，再給自己長一點的十五分鐘休息時間，即符合此工作法的要求。
  group_stem: '研究顯示，一心多用並不會讓你比較有效率，因為我們其實並不是在同時處理好幾件事，而是不斷在幾件事中切換注意力。腦部掃描顯示，每當我們要切換注意的事項時，至少會動用到四個大腦部位：「前額葉皮質」轉移聚焦注意力並選擇要執行的任務、「後頂葉」負責切換每個任務的規則、「前扣帶迴」檢查錯誤、「運動前皮質」協調身體動作的改變。這一切都能在十分之一秒內完成，但一天下來如果不斷來回切換，可能會讓你損失百分之四十的工作效率！所以，拜託不要再一心多用了！這樣反而更容易加深拖延症。

    　　我建議你可以試試看「番茄鐘工作法」。這是義大利人弗朗切斯科·奇里洛所發明的。為什麼叫番茄鐘，不是因為義大利人愛吃番茄，而是因為他發明這個工作法的時候，用的剛好是一個番茄形狀的造型計時鐘。其實用什麼鐘都可以，手機的計時功能也行。

    　　番茄鐘工作法很簡單：首先，請先給自己設一個二十五分鐘後會響的鬧鐘。然後，就開始專心工作，一次只專注做一件事，並把所有的手機訊息、e-mail和不相關的視窗都關掉。

    　　二十五分鐘後鬧鐘響起，就站起來動一動，休息五分鐘。這個方法的重點在於：當你工作的時候，一定要專心，休息的時候，也一定要休息。你可以出去走走，找同事聊天、聽首歌，任何事情都可以，但一定要讓自己離開工作狀態。

    　　二十五分鐘工作、五分鐘休息，重複四到五個回合，然後再給自己長一點的十五分鐘休息時間，就這麼簡單！我發現這個方法實在很有效，因為當你有了很明確的時間限制，而且又有固定的休息時，能幫助你更容易集中精神，達成高效率，也比較能抵抗分心的誘惑。（節選自劉軒〈番茄鐘工作法〉）'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
