- id: doc_112_彰化_福興_國文_g7s1e1_s3_3
  section: 3
  number: 3
  type: single
  page: 3
  stem: 作者認為使米飯變餿變壞，或使平凡的米變成甘醇的酒，關鍵在於何者？
  options:
  - label: A
    content: 容器
  - label: B
    content: 時間
  - label: C
    content: 宿命
  - label: D
    content: 空間。
  group_stem: '是什麼原因，使米飯變餿變壞——是時間。

    　　是什麼使那些平凡的米，變成芬芳甘醇的酒——也是時間。

    　　到底，時間是善良的，還是邪惡的魔術師呢？不是，時間只是一種簡單的乘法，另把原來的數值倍增而已。開始變壞的米飯，每一天都不斷變得更腐臭。而開始變醇的美酒，每一分鐘，都在繼續增加它的芬芳。

    　　在人世間，我們也曾經看過天真的少年一旦開始墮落，便不免愈陷愈深，終於變得滿臉風塵，面目可憎。但是相反的，時間卻把溫和的笑痕，體諒的眼神，成熟的風采，智慧的神韻添加在那些追尋善良的人身上。

    　　同樣是煮熟的米，壞飯與美酒的差別在哪裡呢？就在那一點點酒麴。

    　　同樣是父母所生的，誰墮落如禽獸，而誰又能提升成完美的人呢？是內心深處，緊緊環抱不放的，求真求善的渴望。

    　　時間將怎樣對待你我呢？這就要看我們自己是以什麼態度來期許我們自己了。

    （節錄自張曉風 時間）'
