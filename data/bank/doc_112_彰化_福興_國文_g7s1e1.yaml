  stem: '下述四首商禽〈五官素描〉的新詩，所描繪的對象依序是何者？

    (甲)沒有碑碣／雙穴的／墓／梁山伯和祝英台／就葬在這裡

    (乙)只有翅翼／而無身軀的鳥／在哭與笑之間／不斷飛翔

    (丙)說什麼好呢／唯／吃是第一義的／歌／偶而也唱／也曾吻過／不少的／啊——酒瓶

    (丁)如果沒有雙手來幫忙／這實在是一種無可奈何的存在／然則請說吧／咒罵或者讚揚／或是有人放屁／臭／是鼻子的事'
