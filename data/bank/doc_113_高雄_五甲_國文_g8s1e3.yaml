    [巡撫] 凡自盡命案均限一月審結，倘有聳令自盡、誣告圖賴等情，即嚴究主使棍徒，一併從重治罪。則爾等縱或自拚一死，總不能貽害他人。其親屬雖欲逞刁，一經審出實情，不過自取罪戾，亦無人肯與賄和，是不但死者枉送性命，不值一錢，即生者因此又犯刑章，更屬無益有損。本欲害人，適以自害，徒為讎人所快，復何利之可圖？何忿之能洩哉？試為反覆籌思：與其枉死無償，聽他人之入室；曷若餘生自愛，冀飽煖於將來？且本部院業經嚴禁書差需索，爾等如有身受重冤，儘可瀝情控訴，並不須花費分毫，又何必自投絕路，至以性命博錙銖哉？

    訟師有話要說

    我或許算「主使棍徒」吧！但只有我教唆加「賴」嗎？官府的衙役也一樣啊！環境製造需求。經濟資源少、生存壓力大的地方，窮人就可能拿命換家庭生計，自然需要提供策略的人。

    按清朝法律，阿吉把爺爺的死賴給地主，一旦揭穿，那是「圖賴」罪，除了杖責，再加上三年徒刑。但法律另有「威逼人致死」罪，如果阿吉的爺爺確定死於地主施壓，則判地主杖責，並須賠償喪葬費。

    當一個死者的家屬指控：死者自殺是遭受威逼，一來死無對證，二來威逼很抽象，很難判斷是不是誣賴。被控威逼的人，通常會因鄰里批評而內疚，加上訟師警告：官司很難善了，所以大多無奈接受「威逼人致死」。失去親人想要錢，自認倒楣的肯給錢，能這樣結案，縣官何必明鏡高懸？再者，國家雖有上訴制度，但只要兩邊能接受判決，就不會上告省府。尤其「圖賴」、「威逼」界線模糊，萬一省府說是誤判……噢，縣官絕不想被翻案而影響仕途。

    巡撫下令「自盡命案限一月審結」，難道能解開這社會的死結？'
