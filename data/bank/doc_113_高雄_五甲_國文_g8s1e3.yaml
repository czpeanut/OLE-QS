- id: doc_113_高雄_五甲_國文_g8s1e3_s4_9
  section: 4
  number: 9
  type: single
  page: 6
  stem: 文中關於「隱形餐桌」的敘述，下列何者正確？
  options:
  - label: A
    content: 是一張只要三百元的圓形折疊桌
  - label: B
    content: 作者因搬家對於這個餐桌產生了兩難的困境
  - label: C
    content: 因方便攜帶讓讀者感到物盡其用
  - label: D
    content: 作者最後決定為七十四坪的新居再買一張隱形餐桌
  group_stem: '搬了那麼多次家，仍然留著那張隱形餐桌。所謂隱形，是指不必騰出一個叫飯廳的空間安頓它。繞完我的家，你可能覺得哪裡不對。哎，這房子，好像缺少什麼？通常一臉疑惑的人等不到答案出現，就該走了。留客吃飯？外面館子多得是，用不著我親自下廚。我只會煮幾鍋上不了檯面的湯，沒做飯的本事，也沒閒情。不開飯，那個答案就跟餐桌一起隱形。

    我其實常常在家吃飯，有時從外面帶個便當，偶爾也做那種只能打發自己胃口的菜。不過，你絕對猜不出來我在哪個角落吃飯。我家沒有一個叫飯廳的地方。嚴格說來，也沒有餐桌。

    那張被我稱為餐桌的折疊式桌子，平時躲在儲藏室，就是那種農曆初二或十六時，商家用來拜拜的長方桌，一張只要三百塊錢。此物的最大好處是，它分明存在，可就不占地方。如果突然想拜拜，它本來就適任。偶然朋友不得不在家裡吃飯，它生鏽的腳架和廉價的桌面雖然不體面，但也可以變成名正言順的餐桌。總而言之，它沒個性、沒脾氣的特性實在深得我心。慶幸上回搬家沒扔，否則我也會買回同款的桌。

    從小家裡小孩多，餐桌就是書桌。餐桌當然比書桌重要，因為書桌不能當餐桌使用。那麼厚重老實的長方形大桌，配上同色的椅子，是一般家庭的必然配備。常常晚下班的父親在桌子那頭吃飯，我在這頭寫功課。從這頭到那頭像隔山隔海，咀嚼聲咬著難堪的沉默。父親吃飯不自覺嘆氣。每嘆一聲都沉重的敲在我心裡。我猜他連搖頭都是不自覺的，我們一群只懂吃飯和唸書的小孩大概是罪源。

    在餐桌上吃飯像受刑。十分鐘解決一個便當的工夫，就是家裡的老餐桌訓練出來的。吃飯的氣氛不愉悅的時候多，我總是快速吃完分內的那碗飯，逃命也似的逃離餐桌。直到現在，我仍然只把吃飯當一件事，無關感官的滿足和享樂，可見潛意識裡還是恪守家規。我常常端飯菜，開了電視讓它自說自話，順手拿起報紙讀，就那樣坐在地上，把菜從熱吃到冷。

    上個月返家時，我詫異的發現，小妹對母親的菜有著無可救藥的依戀，「還是媽的菜對味」、「媽煮的湯天下無敵」，動不動她就下個「一流」的評語，在我，而非母親面前說，可見是真心真意。魚才上桌就被掐走了尾巴，用手。她毫無保留的衷心讚美和實際行動令我羞愧，我總是三扒兩扒就吞下飯菜，通常不辨滋味，把吃飯當成一件事，做完就算了。

    小妹成長時，家裡早「解嚴」了，彼時我也早已離家。餐桌禮儀已經式微，可是被綑綁過的靈魂就是那麼脆弱又固執，吃飯在我的生活裡成了比洗澡還次要。跟吃飯相關的產物，從餐具到餐桌，我向來漠然。那張隱形餐桌如今面臨丟或留的兩難。三百塊錢早已物盡其用，不，應該說物超所值甚多，但是我的新家仍然找不到餐桌的位置。七十四坪的空間不小，是我的心容不下它。我列出該買該丟的物品用具，空間規畫又規畫，住家附近的家具行走遍了，就剩下餐桌仍在尋覓中。其實我知道答案：就留著那張隱形餐桌，讓它成為元老好了。

    很多人需要餐桌吧！電影電視都把餐桌拍成家人歡聚的焦點。食物和親情令人精神煥發，可是在臺灣這麼多年，家族式的相聚對我已經十分陌生。擁有自己的書房和書桌後，不必在餐桌上寫功課，再不用擔心作業沾染油漬，第二天羞愧忐忑的去上課。現在除了睡覺，我幾乎都在書桌前杵著，很多時候不知道要做什麼，並沒有認真讀書。除了茶，食物一律不准進書房，即使是零食。

    這樣其實一點也沒有好處，沒有餐桌，表示我不注意飲食；太依賴書桌，我的頸椎因長期低頭而弧度不足，頸肌僵硬，影響氣血循環和睡眠品質。我把前因後果仔細一算，這些煩人的病痛最最初始，竟是肇始於餐桌。意念一轉，我拿起新房子的藍圖，低著頭，還是給餐桌找個合適的位置吧！

    （鍾怡雯〈隱形〉）'
