  stem: 「窮奇是一頭狀似老虎，長有翅膀的怪物。當牠知道有人在爭執的時候，往往會把忠直之士吃掉；知道有人為惡不善，牠就會獵取野獸贈予那人。是一頭善惡觀念完全顛倒的惡獸。肥遺，六足四翼，每當此蛇出現時，附近封國都會出現大旱災。天狗是種像狐狸而頭部白色的動物，是禦凶的吉獸，很可能是真實存在過的某種古代哺乳類動物。旋龜形狀像普通烏龜卻長著鳥一樣的頭和蛇一樣的尾巴，叫聲像劈開木頭時發出的響聲。」若依文中所述，下面四張圖片按順序排列何者正確？
