- id: doc_113_高雄_五甲_國文_g8s1e3_s4_4
  section: 4
  number: 4
  type: single
  page: 5
  stem: 有關武俠文學的敘述，下列何者是正確的？
  options:
  - label: A
    content: 唐人的劍俠小說，俠士間各不相干，劇情可找出其歷史相關性
  - label: B
    content: 武俠文學轉至清朝，俠士互有連結，劇情不僅依附歷史且有其獨立性
  - label: C
    content: 金庸將真實歷史與自創的江湖世界融合為一體，建構起宏大的武俠新世界
  - label: D
    content: 武俠文學的轉捩點，是充滿奇幻劍俠的《蜀山劍俠傳》問世
  group_stem: '武俠文學最早的形態是《史記》的〈遊俠列傳〉、〈刺客列傳〉，再變之則為唐人的劍俠小說，俠士之間互無關係，零若星火，劇情尤如天外救星。轉至清朝，出現《七俠五義》、《施公案》等武俠群像劇，各俠士之間開始有連結，但仍是依附歷史的官府（包公），沒有獨立性。

    舊派武俠祖師平江不肖生是武俠文學個轉捩點，其代表作《江湖奇俠傳》，各俠士有其門派、有師承、有獨有經歷，互有恩怨，又各有生活。還珠樓主運用其豐富想像力，在其《蜀山劍俠傳》，進一步在江湖中加入奇幻、劍仙的原素，令「江湖」的範圍不限於現世。然而，論到建立「江湖」，此二人皆不及後起的金庸。金庸繼承二人的江湖，但卻大膽重寫，建立自己的江湖系譜。平江不肖生筆下的崑崙、崆峒、丐幫，還珠樓主筆下的峨眉、青城，都成為金庸創作的材料。金庸以此為材料，加上疑似疑真的設定，再在不同作品重寫門派的來歷和交流，少林、武當、丐幫、五嶽劍派等，就成為金庸筆下的江湖。今日講崆峒，不記得平江不肖生的董祿堂，只會記得崆峒五老和七傷拳。講起峨眉，不記得還珠樓主的三英二雲，只會記得滅絕師太。也就是說，金庸的江湖「併吞」了兩位前輩的江湖。

    金庸不單只是要建構一個獨立的江湖世界，這個世界更會干預真實的歷史。金庸把歷史人物加進自己的故事，和自己的角色互動，更進一步擴大自己的江湖系譜。《射鵰英雄傳》中的鐵木真會救下郭靖；《神鵰俠侶》的楊過見到忽必烈、打死蒙哥；《倚天屠龍記》的張無忌是朱元璋、徐達上司；《天龍八部》的蕭峰會和耶律洪基結拜；《鹿鼎記》的韋小寶更是周遊列國，見盡康熙時代的名人。

    虛實夾雜，俠史互融。武俠小說的江湖由最初的「依附歷史」，變成「平行歷史」，去到金庸手上「改寫歷史」，達到高峰，成為一個氣勢磅礴的宏大虛構世界。

    （改寫自昆洛斯〈金庸的新派武俠江湖〉）'
