- id: doc_113_高雄_五甲_國文_g8s1e3_s3_9
  section: 3
  number: 9
  type: single
  page: 2
  stem: '國文老師請同學收集有關《史記》與其作者的相關資料，並請同學上台報告，報告正確者可以獲得麥當勞禮券。以下是同學的報告內容，請問哪些同學可以獲得獎勵？

    毛利小五郎:《史記》為中國紀傳體之祖，也是斷代史之祖

    小蘭: 作者司馬遷於漢文帝時擔任太史令，後因李廣事件入獄

    柯南:《史記》以人物傳記的形式來記敘歷史，開創傳記文學的先河

    平次:〈張釋之執法〉一文應屬於「世家」的其中一篇

    阿笠博士:《史記》記載從黃帝到漢武帝年間約三千年的歷史，分為本紀、表、書、世家、列傳五類'
  options:
  - label: A
    content: 毛利小五郎、阿笠博士
  - label: B
    content: 柯南、小蘭
  - label: C
    content: 小蘭、平次
  - label: D
    content: 柯南、阿笠博士
