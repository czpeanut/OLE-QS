  stem: 「烏來鄉位於台北縣南端（已改制為新北市烏來區），境內山高谷深，當地原住民族多為泰雅族人，因而設有烏來泰雅民族博物館，展覽該族相關的文物風俗。相傳三百多年前，該族族人狩獵至此，發現南勢溪冒出熱水與輕煙，齊呼『uraikirofu』，意為冒煙的熱水，這就是烏來地名的由來。近年因泡湯文化盛行，各式溫泉旅館在此林立，但有業者以低價向鄉公所承租河川地，後來卻未依照申請目的使用，反而違規建造溫泉飯店，經偵查後發現有圖利之嫌，相關單位人員已將違法者依法起訴。」文中所述「冒出熱水與輕煙」的溪流應源自下列哪一山脈？
