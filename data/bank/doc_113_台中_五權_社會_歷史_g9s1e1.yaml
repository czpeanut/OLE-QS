  group_stem: '上個月印尼宗教事務部，邀約12 個國家136 位僧團，前往中爪哇省佛寺群，包括世界最大佛寺—「婆羅浮屠寺廟群」，進行祈福儀式。

    婆羅浮屠，印尼文意指在山丘上的佛塔，是世界上最大的佛寺，整座佛寺有2,672 塊浮雕、504 尊佛像。中央圓頂周圍環繞著72 尊佛像，每尊佛像都坐落在鐘型、有許多孔洞的佛塔內。這座寺廟的風格受到印度笈多王朝藝術的影響，並加入當地的場景與元素，使得婆羅浮屠成為獨具印尼特色的寺廟。然而，婆羅浮屠不知何故在15
    世紀時被遺棄，又歷經埋藏在火山灰之下、叢林之間數個世紀，直至19 世紀英國的萊佛士爵士，才讓婆羅浮屠重現；而在1973 年聯合國教科文組織資助的大翻修之後，婆羅浮屠再次成為佛教信眾膜拜的聖地。

    20 世紀中後期，婆羅浮屠曾是印尼遊客數量最多的旅遊景點，然而當地卻因近年經歷新冠肺炎而大受打擊，如何恢復旅遊盛況是該局所亟欲處理的問題。'
