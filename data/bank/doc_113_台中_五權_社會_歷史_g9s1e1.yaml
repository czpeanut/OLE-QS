  stem: 西方古代史上某個時代的特徵：「是一橫越歐亞非三洲的帝國，藉由道路及商貿活動將各地連結在一起，貨幣可以彼此流通」、「統治者懷有世界主義的理想，在各地建立相同模式的城市」、「統治者透過鼓勵民族通婚、促進文化交流，將歐亞非的文化融合最終形成新型態的文化」。根據上述的時代特徵，判斷該時代應該是下列何者？
