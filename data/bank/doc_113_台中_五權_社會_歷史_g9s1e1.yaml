  page: 1
  stem: 「關於人生的課題，是每一個人終其一生的追尋。身而為人的目的為何？追求什麼？又要如何自立、使自我充足完備，成為理想的人？什麼是幸福？如何才能有智慧？該如何正確、有效地思考？」這些人們窮究一生不斷探索的課題，最有可能為下列哪一位歷史人物主要探討的議題？
  options:
