  section: 1
  number: 23
  type: single
  page: 1
  stem: 關於希臘神話目前發現最古老的文字記載是荷馬所寫的《伊里亞德》(Iliad)與《奧德賽》(Odyssey)，這兩部史詩形成的時間，大約為西元前8 世紀。它們記載的是希臘聯軍對抗特洛伊(Troja)人的故事，在這場長達10
    年的戰爭中，希臘諸神時常介入其中，所以它也可以說是一場人與神的戰役。希臘的神明所衍伸的故事，往往令人津津樂道。請問，關於希臘宗教的敘述下列何者為是？
  options:
  - label: A
    content: 希臘為一神信仰
  - label: B
    content: 希臘在奧林匹亞的慶典是為鼓勵運動風氣
  - label: C
    content: 希臘人相信眾神具有七情六慾並主宰世界
  - label: D
    content: 雅典人為榮耀守護神維納斯而建帕德嫩神廟
