- id: doc_113_台中_五權_社會_歷史_g9s1e1_s1_30
  section: 1
  number: 30
  type: single
  page: 2
  stem: 請問種姓制度是哪一個民族入侵印度而帶來的政治制度？
  options:
  - label: A
    content: 波斯人
  - label: B
    content: 阿利安人
  - label: C
    content: 馬其頓人
  - label: D
    content: 日耳曼人
  group_stem: 今年剛贏得第三任任期的印度總理莫迪，曾受到民眾熱烈的歡迎，因為民眾相信出身自低種姓階級的莫迪可以改變在印度社會中根深蒂固的種姓階級陋習；莫迪在勝選演講中就強調：「今後印度只會有兩種階級，就是窮人和努力消滅貧窮的人。」即使印度在1989
    年頒布了《表列種姓、表列部落（防止暴行）法》用以保護低種姓族群，但很顯然，此法並未能解決種姓制度對低種姓階級的歧視。
- id: doc_113_台中_五權_社會_歷史_g9s1e1_s1_31
  section: 1
