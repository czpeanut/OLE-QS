  stem: 「這個民族」在古代和海洋的關係相當密切，非常善於造船與航海，往往選擇海港作為他們的城市以及殖民地，這些因素使他們成為地中海貿易以及軍事的主要角色；並在航海的過程中將埃及文字傳出。他們在貿易過程中最重要的物資當屬金屬，據說第一個發展出銀器製法的便是這個民族。請問，上述的民族應是下列哪一個？
