- id: doc_113_台中_五權_社會_歷史_g9s1e1_s1_21
  section: 1
  number: 21
  type: single
  page: 1
  stem: 18 世紀著名的歷史學家愛德華·吉朋，在其著作《羅馬帝國衰亡史》中，探討為何羅馬帝國會衰亡。他認為是奧古斯都摧毀共和貴族，壓抑平民力量，去除羅馬傳統共和政治中原有的權力制衡力量。如此一來，皇帝獨攬大權，使帝國步上衰亡的開始。請問，這位改變羅馬政治體制的「奧古斯都」是指下列何人？
  options:
  - label: A
    content: 凱撒
  - label: B
    content: 屋大維
  - label: C
    content: 亞歷山大
  - label: D
    content: 查士丁尼
- id: doc_113_台中_五權_社會_歷史_g9s1e1_s1_22
  section: 1
  number: 22
  type: single
  page: 1
  stem: 近年臺灣在推動司法改革，司法改革國是會議於民國106 年做出決議：為落實無罪推論原則，偵查中案件媒體在報導時應適當加註「警語」，例如「任何人在依法被判決有罪確定前，均應推定為無罪」等，以落實偵查不公開暨無罪推定保障被告，也避免媒體「未審先判」。這看似進步的改革，其實早就出現在西方的法典之中。請問，下列哪一本書籍出現類似的法學概念？
  options:
  - label: A
    content: 歷史
  - label: B
    content: 荷馬史詩
  - label: C
    content: 十二表法
  - label: D
    content: 漢摩拉比法典
