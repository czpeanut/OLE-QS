  stem: 根據上文，有關亞太電信被裁罰事件的說明，何者錯誤？
  options:
  - label: A
    content: 國家通訊傳播委員會是此事件的主管機關
  - label: B
    content: 電信管理法與少年事件處理法是行政法規
  - label: C
    content: 國家通訊傳播委員會裁罰的行為是依法行政
  - label: D
    content: 電信管理法的制定是為了維護人民權利，避免政府濫權。
  group_stem: 國家通訊傳播委員會 (NCC) 3 月22 日表示，亞太電信經營「企業便利簡訊服務」等 3 案件，因未依核准營運計畫落實用戶身分查核，明確違反電信管理法規定，分別罰款
    150 萬元、250 萬元及 50 萬元，並應於 1 個月內提交改正報告。亞太電則回應，針對主管機關對本案之事實認定及法律適用有疑義，將提起(甲)。(鉅亨網2023/3/22)
