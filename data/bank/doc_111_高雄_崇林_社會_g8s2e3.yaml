  section: 1
  number: 34
  type: single
  page: 4
  stem: '「在西方驚愕「中國發瘋」(China Went Mad)之際，「事件」卻對西方社會發生了多樣性的衝擊作用，並留下了深遠的影響。「事件」期間正值西方學生展開熾熱的反越戰運動，他們(尤其是法國學生)從「A
    團體」身上學到了串聯和破壞的激烈手段。他們對「事件」產生了浪漫的情懷，他們認為「A 團體」和他們都是獻身於社會正義的理想主義青年，都有頂天立地的精神和抱負。他們仿效「A
    團體」挑戰權威的鬥志，和政府對抗。法國學生幾乎扳倒了一向強勢的戴高樂政府，美國學生的反戰運動使詹森和尼克森政府窮於應付，並逼迫福特政府加速從越南脫身。……費正清則於〈紐約時報〉時論廣場發表一篇文章，說中國有「事件」的『內憂』，美國則有「越戰」的『外患』，兩個國家應該嘗試互相幫助解除對方的困境……」       【資料來源：林博文，〈文革對西方世界的衝擊〉《中國時報》】

    從上文中，可以推知美國學者費正清對於「事件」的看法，最貼近下列何者？'
  options:
  - label: A
    content: 讚揚中國事件的發生，認為有助於暴政的垮臺
  - label: B
    content: 厭惡事件的爆發，認為事件直接導致政權垮臺
  - label: C
    content: 認為是重新與中國建立溝通管道的契機
  - label: D
    content: 認為事件無關緊要，選擇默默觀察中國發展
