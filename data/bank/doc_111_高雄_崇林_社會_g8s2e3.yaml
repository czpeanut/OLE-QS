    content: 學生群聚於天安門廣場，為了一份理想，為了爭取○的改革，而失去了生命。學生們所爭取的是「民主自由」
  group_stem: '西元△年，美國宣布與中華民國斷交，並自隔年1 月1 日起，與中華人民共和國建交。一夕之間，美中臺關係風雲變色。中國大陸在決定走向改革開放，讓人民初嘗到資本主義帶來的好處後，中國大陸一年比一年更加開放，改革的腳步也隨之加快。……西元1989
    年4 月，因一位聲望高，又同情民主人士的前總書記過世，北京的學生以悼念為由，聚集於天安門廣場。批評中共的施政與社會問題，要求中共進行○改革。……除了北京，上海、天津、武漢等大城市，也都出現群眾抗議的運動。起初，中共高層試圖與天安門廣場的學生代表溝通，但學生卻提出要讓□下臺的主張，雙方難以達成共識。5
