  group_stem: '資料一

    美軍向□地十分之一的土地上撒下了1,900 萬加侖的落葉劑。美軍還噴灑了其他除草劑，包括白劑、藍劑、 粉劑、綠劑和紫劑(是以運送圓桶外部的顏色條紋來命名)，目的是除去敵人藏身的叢林。

