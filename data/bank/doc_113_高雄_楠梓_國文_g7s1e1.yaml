- id: doc_113_高雄_楠梓_國文_g7s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: '閱讀比較以下（甲）和（乙），請問哪一段文字屬於「科普文章」？而科普文的語言有何特色？


    | 臺灣欒樹 | （甲）「臺灣欒樹」是臺灣特有樹種，據說最早是由英國人 A.Henry 在恆春採集到，因此，臺灣欒樹的中文名又叫作「亨利氏欒樹」。樹幹通直，灰黑色；二回羽狀複葉；花小形，多數，黃色；果實為蒴果，由像燈籠狀粉紅色的三瓣片合成，黑褐色。分布於全島低海拔的闊葉林中，從北到南都有。在民國73
    年11 月3 日，宜蘭縣政府第260 次縣務會議中，通過選定「臺灣欒樹」為宜蘭縣縣樹。 |

    |---|---|

