- id: doc_113_高雄_楠梓_國文_g7s1e1_s2_28
  section: 2
  number: 28
  type: single
  page: 4
  stem: 根據上文有關陸羽的生平，下列選項何者正確？
  options:
  - label: A
    content: 陸羽自幼寄養在竟陵 龍蓋寺
  - label: B
    content: 陸羽的姓名來自《易經》的卦辭
  - label: C
    content: 陸羽非常幽默，進軍演藝圈後，很快就成為當家主角
  - label: D
    content: 後來經人介紹，轉行當起煮茶師。
  group_stem: '公元733 年有天早晨，竟陵 龍蓋寺的和尚不斷聽到外頭傳來大雁的叫聲，智積禪師於是外出查看，在河堤邊發現有一群大雁圍著一個嬰兒不停叫著，並用身上的羽毛覆蓋在嬰兒身上，禪師連忙將嬰兒抱回寺裡。後來他把嬰兒託給李儒公收養。陸羽七、八歲時，李儒公夫婦年事漸高，決定回到家鄉，陸羽則回到龍蓋寺。禪師以《易經》占卜取名，得到漸卦：「鴻漸於陸，其羽可用為儀」（鴻雁飛到了高山，其羽毛可以用來做典禮上的裝飾品），因此為他取姓「陸」，取名「羽」，取字「鴻漸」。

    在禪師的撫育下，學文識字，習誦佛經，並為智積禪師煮茶伺湯。但陸羽從小志不在佛，而有志於儒學研究，故一直不肯削髮為僧。終於在十一、二歲時逃離寺院，到處流浪，後來到一個戲班子裡作了「優伶」。陸羽非常詼諧善辯，雖其貌不揚，而且有口吃的毛病，但他在戲劇中演的丑角幽默機智，常常受到觀眾的歡迎。

    後來巧遇貴人，帶他到書院研習儒學，使他有機會苦學七年。讀書之餘，陸羽也常為夫子煮茶烹茗。基於對茶葉的濃厚興趣，陸羽在各大茶區做觀察，對於茶葉生產的歷史、源流、現狀、生產技術以及飲茶技藝，都有獨到的見解，成了著名的茶學專家。

    結合知識與田野調查，他寫下世界第一部茶葉專著──《茶經》，這不但是ㄧ部農業專書，也是一部闡述茶文化的書，將普通茶事升格爲一種美妙的文化藝能。從此「茶學」才真正被社會公認，茶的原意「人在草木間」和茶道的本質「天人合一」才被廣為流傳。'
