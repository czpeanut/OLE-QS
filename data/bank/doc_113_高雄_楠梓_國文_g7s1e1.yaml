- id: doc_113_高雄_楠梓_國文_g7s1e1_s2_32
  section: 2
  number: 32
  type: single
  page: 5
  stem: 句話說:「頭腦都生鏽了。」根據本文說法，原因為何？
  options:
  - label: A
    content: 頭腦少動聯結更多
  - label: B
    content: 創造力的功能減少
  - label: C
    content: 記憶承載負荷加重
  - label: D
    content: 神經迴路活化降低。
  group_stem: '每個人在接受外界刺激時，都會激發一連串大腦神經迴路的活動，但是閱讀時，神經迴路活化的程度比看電視時來得深。原因之一在於:閱讀時我們會主動搜索訊息，遇到語意不明、模稜兩可的詞彙(例如：「打手」這個詞，究竟是把「打」當動詞，指的是打別人的手，還是把兩個字合而為名詞，指的是黑道的打手)，我們的眼睛會立刻回歸到前面讀過的句子，去尋找文意脈絡，來解讀這個雙義詞在文中真正的涵義。因此，閱讀時，我們的大腦其實在不斷地進行深層分析，而且閱讀是主動的訊息獲取歷程。閱讀的速度會依個人程度而有所不同。過去的動物實驗已經顯示，在主動的訊息獲取歷程中，神經活化的程度比較高。然而看電視、電影則是被動接受訊息的歷程，雖然在同一時間內，銀幕上所包含的訊息多於單純的文字，但是我們的眼睛無法主動控制畫面呈現的時間，只能被動接受。

    節錄自洪蘭〈活化大腦，激發創造力〉'
