  group_stem: "記得上高三時，我們班有一個「天才學霸」。\n    當我們為了大考，焦慮到崩潰的時候，他卻怡然自得，一臉燦爛的笑容，經常見他抱個籃球進教室，與教室裡緊張的學習氣氛格格不入，還總是能輕鬆應對每一次考試，成績在全年級的排名中一直遙遙領先。\n\
    \    我們開玩笑說他天賦異稟，他都一笑而過，從來不解釋什麼。\n    後來一次調座位，我和他剛好坐同桌，才發現我們眼中的「天才學霸」，並不是我們想像中的，不用學習就能穩居全年級前幾名，而是在我們看不到的地方，付出了比常人更多的努力罷了。\n\
    \    有一次，他向我吐露心聲：每當別人說他天賦異稟時，他都很羞愧，因為他自知沒什麼過人的學習天賦，不過是在上課期間，更加專注認真地聽講，做筆記。晚自習放學回到家裡又繼續學習，早上再早起一個小時，把該背的知識提前背會了而已，並不是天賦異稟，也不是什麼「天才學霸」。\n\
    \    聽了他的心聲，我才發現，自己一直以來對「天才」這個詞有很深的誤解。我眼中的「天才」就是生下來就有的才能，不需要刻意學習，也不需要拚命努力，靠著這點才能，就能輕鬆脫穎而出。\n\
    \    但實際上，真正的「天才」，很多時候，並非我們看到的那般輕鬆，而是用努力與汗水加持，才看起來不費吹灰之力。\n選自 小魚叔網路文"
