- id: doc_113_高雄_楠梓_國文_g7s1e1_s2_30
  section: 2
  number: 30
  type: single
  page: 5
  stem: 若銘翔看完本文後決定用 LH 矯正線矯正牙齒，其原因不包含下列何者？
  options:
  - label: A
    content: LH 矯正線的費用可依每位病患的牙齒情况而降價
  - label: B
    content: 能把矯正過程和時間縮短，並且減少病患的疼痛感
  - label: C
    content: LH 矯正線較傳統矯正牙齒所需的裝置更為方便與簡單
  - label: D
    content: LH 矯正線的材質為鈦鎳合金經過改良製成，不因溫度高低而變形。
  group_stem: '什麼是LH 矯正線？傳統牙齒矯正多半採用不鏽鋼線以及一般的鈦鎳合金線，材質較硬，當綁在牙齒表面上，感覺不舒服。但 LH 矯正線是一條改良式鈦鎳合金製成的矯正線，柔軟度比較好，對牙齒造成的疼痛也會降低，而且不會受冷熱溫度影響而變形。LH
    矯正線依靠較佳的穩定性力量，以及記憶且恆定的特性來移動牙齒，大幅降低矯正期間的疼痛與不適感，同時把傳統矯正的過程縮短簡化處理，因此可以縮短至少半年至一年的矯正時間。傳統矯正牙齒必須使用金屬套環將臼齒固定住，或是在口內裝頭套，十分不便且疼痛。但是LH
    矯正線的裝置非常簡化，不需要再用套環將後面的大臼齒套住，而是直接搭配矯正器，就可以黏在牙齒的牙側面，甚至取代骨釘，可避免造成不必要的侵入性治療。LH 矯正線有不錯的彈性，所以適用於矯正任何不整齊的牙齒，包括適用於暴牙、戽斗、虎牙、齒列不整，或者先天性缺牙導致空間過大等各種咬合不正的患者。至於LH
    矯正線真正的矯正時間與費用，需評估病患個人的全口X 光片、側顱骨X 光片和目前的牙齒情形後，才能得知。一般來說，LH 矯正費用大多比傳統矯正法貴一些，但實際的矯正費用仍決定於每位病患的牙齒情況。

    改寫自《中時電子報》'
