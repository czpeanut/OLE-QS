  stem: 「肌肉記憶，是指透過不斷重複動作以讓它進入記憶當中。當特定動作隨著時間重複進行時，它將會創建長期的肌肉記憶，最終讓動作可在幾乎無需意識的狀態下完成。這個過程可減少在進行動作時對注意力的需求，並使動作在記憶系統內實現最高的執行效率。許多日常活動中，也會發現肌肉記憶的例子，它們的共通點均是隨著大量練習而可獲得改善及自動化的動作，譬如是踩單車、以電腦輸入法打字、輸入密碼、演奏樂器、武術和跳舞等等。」關於「肌肉記憶」的相關解讀，何者正確？
