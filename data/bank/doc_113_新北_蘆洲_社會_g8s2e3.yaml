  stem: 「族人在乾季末期耕種之前，得先把森林中一小塊地面上的樹林燒掉，然後種山芋和樹薯。他們以掘棒、鍬等傳統農具耕作，並不施肥，若干年後，當土壤變得貧瘠時，農民便須移至他地，另闢田地。」請問：附圖中哪一種環境條件，最常出現上述的農耕方式？
