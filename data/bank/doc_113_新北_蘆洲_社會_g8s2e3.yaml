  stem: 西方列強15 世紀以後相繼入侵殖民非洲，在當地發展熱帶栽培業。請問當時殖民母國主要是看中非洲具有下列哪些優勢：？ (甲)廣大的市場 (乙)先進的技術
    (丙)低廉的勞力 (丁)濕熱的氣候
  options:
  - label: A
    content: 甲丙
  - label: B
    content: 甲丁
  - label: C
    content: 乙丙
  - label: D
    content: 丙丁。
- id: doc_113_新北_蘆洲_社會_g8s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 附圖是非洲未來地形演變的預測，其中東部地形變化最主要的原因為何？
  options:
  - label: A
    content: 裂谷持續擴大，東部變成島嶼
  - label: B
    content: 板塊相互擠壓，東部隆起島嶼
  - label: C
    content: 海平面持續上升，東部變成孤島
  - label: D
    content: 海平面持續下降，東部出現海埔地。
