- id: doc_113_新北_蘆洲_社會_g8s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 非洲的納米比沙漠因擁有高達300 公尺的沙丘，而成為地質學家經常拜訪、研究之地。請問：下列哪些因素是當地形成沙漠景觀的主要原因？ (甲)高山地形 (乙)鄰近撒哈拉沙漠
    (丙)本吉拉涼流流經 (丁)距海遙遠，水氣不易到達  (戊)南迴歸線經過  (己)副熱帶高氣壓壟罩  (庚)北迴歸線經過。請問下列何者正確？
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙丙丁
  - label: C
    content: 丁己庚
  - label: D
    content: 丙戊己。
- id: doc_113_新北_蘆洲_社會_g8s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 下列四位同學對於「漠南非洲」的敘述，何者完全正確？
  options:
  - label: A
    content: 素姐：指的是喀拉哈里沙漠以南的地區
  - label: B
    content: 吉哥：鄰近亞洲，受亞洲國家殖民統治
  - label: C
    content: 玲妹：除傳統崇尚自然萬物信仰外，尚有其他的宗教信仰
  - label: D
    content: 儀妞：此區是全非洲最為富庶的精華區。
