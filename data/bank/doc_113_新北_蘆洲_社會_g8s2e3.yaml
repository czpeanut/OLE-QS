- id: doc_113_新北_蘆洲_社會_g8s2e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 吉力馬札羅山應位於哪一條緯線附近？
  options:
  - label: A
    content: 北回歸線
  - label: B
    content: 南回歸線
  - label: C
    content: 赤道
  - label: D
    content: 北極圈。
  group_stem: ★吉力馬札羅山(Mt.Kilimanjaro)有「非洲屋脊」、「非洲之王」之稱，是非洲最高峰，海拔5,895 公尺，屬於「吉力馬札羅國家公園」。整個山脈綿延80
    多公里，由西拉峰(Shira Peak，H3,962m)、馬文濟峰（Mawenzi Peak，H5,149m)、基博峰（Kibo Peak，H5,895m)三座山峰組成，其中以馬文濟峰和基博峰最為著名。基博峰的火山口在頂峰南側，保存完好，直徑2,400
    公尺，深200 餘公尺，目前是休眠狀態，但火山氣孔仍不時釋放出火山氣體。吉力馬札羅山因為阻擋了海上潮溼的水氣，故水源充足。山地垂直植被明顯且豐富，包含雨林帶、常綠闊葉林帶、溫帶森林帶、高山草甸帶、積雪冰川帶和高山寒漠帶等不同的林相景觀。請根據上文內容回答下列問題。
