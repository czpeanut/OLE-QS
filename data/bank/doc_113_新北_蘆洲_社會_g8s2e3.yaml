  stem: 上文中，政府為防止疫情傳播，強制民眾必須配戴口罩的作法，符合下列何種概念？
  options:
  - label: A
    content: 行政管制
  - label: B
    content: 行政處分
  - label: C
    content: 行政責任
  - label: D
    content: 行政罰。
  group_stem: 題組：(一)中央流行疫情指揮中心於2020年1月宣導出入醫療院所需戴口罩，4月公布社交距離注意事項，12月起啟動秋冬防疫專案，要求出入醫療照護、公共運輸、生活消費、教育學習、觀展觀賽、休閒娛樂、宗教祭祀、洽公機關（構）等八大類場所強制戴口罩。2021年5月19日，疫情進入「三級警戒」，更升級為外出皆須全程戴口罩，未依規定佩戴口罩，經勸導不聽者，將依違反傳染病防治法第37條第1項第6款規定，由地方政府裁罰新臺幣3千元以上1萬5千元以下罰款。時隔二年多，指揮中心宣布將在2023年4月17日起鬆綁口罩佩戴規定，原先搭乘公共運輸交通工具須全程戴口罩，將改為建議佩戴，只剩下醫療照護機構以及救護車上須按規定全程戴口罩。
