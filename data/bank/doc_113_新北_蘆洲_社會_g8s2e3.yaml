- id: doc_113_新北_蘆洲_社會_g8s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 非洲的迦納以生產可可聞名於世。某日綜藝節目邀請四位號稱來自迦納的民眾，分別述說自己家鄉的故事。如果你是節目的特別來賓，請判斷下列哪一個人的說法，才是真正道地的迦納農民？
  options:
  - label: A
    content: 我的國家大部分位於南緯30度附近，陽光普照，最適合可可成長！
  - label: B
    content: 我們農民不只很會種可可，還掌握專業生產技術，讓巧克力更好吃！
  - label: C
    content: 自從種了可可以後，我們種糧食的範圍縮小，部落的小孩都吃不飽！
  - label: D
    content: 可可種植破壞了我們的生態環境，但是白人也回饋給我們豐厚的酬勞！
- id: doc_113_新北_蘆洲_社會_g8s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 電影《盧安達飯店》是由真人真事所改編，以 1994 年盧安達大屠殺為背景，講述盧安達宣布獨立後，胡圖族與圖西族兩部族之間矛盾重重，多次發生衝突，戰事持續不斷。胡圖族大肆屠殺圖西族人，在這種背景下，盧安達飯店經理保羅一直四面奔走，最終成功挽救了飯店裡一千多名圖西族和胡圖族難民。請問:盧安達兩大種族之間的矛盾與紛爭，其主要原因為何？
  options:
  - label: A
    content: 兩族膚色差異
  - label: B
    content: 被殖民挑撥的結果
  - label: C
    content: 語言無法溝通
  - label: D
    content: 宗教彼此對立
- id: doc_113_新北_蘆洲_社會_g8s2e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 現今漠南非洲的人口數約有11 億人，預估西元2050 年將增加到21 億。人口的快速成長，也帶動勞動人口的成長。預測西元2100 年漠南非洲的人口將增加到38
    億人，未來漠南非洲將會是全球勞動人口的主要地區，西元2100 年將成為【非洲的世紀】。若要用一張圖表來對應上文情形，下列何者最符合?
  options:
  - label: A
    content: 漠南非洲人口結構圖
  - label: B
    content: 漠南非洲人口分布圖
  - label: C
    content: 漠南非洲族群分布圖
  - label: D
    content: 漠南非洲農礦分布圖。
- id: doc_113_新北_蘆洲_社會_g8s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 據報導，西元2019 年年底非洲南部乾旱災情嚴重，4,500 萬人面臨飢餓風險，如辛巴威部分地區的降水量創下自西元1981 年以來新低，使逾550
    萬人暴露在糧食供給嚴重不足的風險之中。聯合國糧食機構甚至協助發放應急食物，援助1,100 萬人。請問：下列何者並非導致非洲發生饑荒的原因？
  options:
  - label: A
    content: 戰亂頻繁
  - label: B
    content: 嚴重乾旱
  - label: C
    content: 兒童發育遲緩
  - label: D
    content: 人口快速增加。
- id: doc_113_新北_蘆洲_社會_g8s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 南非共和國是非洲經濟最發達的國家之一，為提供穩定的電力，政府也積極建設太陽能發電設備。若已知日照時數與發電效率呈正向關係，則以該地的地理位置和氣候條件判斷，下列哪一段時間太陽能發電效率最高？
  options:
  - label: A
    content: 3～5月
  - label: B
    content: 6～8
  - label: C
    content: 9～11 月
  - label: D
    content: 12～2 月。
- id: doc_113_新北_蘆洲_社會_g8s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 「根據統計，將近六成的非洲人都沒有傳統的銀行帳戶，行動支付提升了人們使用金融服務的可近性與便利性，讓各國離『普惠金融』(Financial Inclusion，指普羅大眾均有平等機會獲得負責任、可持續的金融服務)之願景更進一步。新冠肺炎疫情期間，多國政府甚至開始大力倡導國民使用行動支付，以降低病毒傳播的機率。」根據上文推論，此段文字主要在描述非洲哪一項目的進步？
  options:
  - label: A
    content: 政治
  - label: B
    content: 通訊
  - label: C
    content: 文化
  - label: D
    content: 都市發展。
- id: doc_113_新北_蘆洲_社會_g8s2e3_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 附圖為Google 所架設的「Equiano 海底電纜」路線示意圖，從葡萄牙的里斯本至南非的開普敦，連接歐洲與非洲的網絡。其第一條分支路線將登陸西非國家多哥的首都洛美，隨後也會陸續於奈及利亞、納米比亞等地登陸。該電纜預計使用後，將可為非洲大陸數百萬人提供雙倍的網際網路速度。關於此電纜的敘述，下列何者正確？
  options:
  - label: A
    content: 此條海底電纜主要架設在印度洋
  - label: B
    content: 可提高此區的海運效能
  - label: C
    content: 可加速所經國家的經濟發展
  - label: D
    content: 將提高沿線國家數位的使用門檻。
