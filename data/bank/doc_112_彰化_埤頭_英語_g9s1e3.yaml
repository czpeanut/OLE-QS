- id: doc_112_彰化_埤頭_英語_g9s1e3_s2_41
  section: 2
  number: 41
  type: single
  page: 3
  stem: Abraham Lincoln was a ______ in 1837.
  options:
  - label: A
    content: farmer
  - label: B
    content: lawyer
  - label: C
    content: president
  - label: D
    content: soldier
  group_stem: 'Abraham Lincoln


    Abraham Lincoln was born in 1809 in northern Kentucky. His father was a rich farmer.
    However, when young Abraham was only 7, his father lost his land. The family moved
    to Indiana, where his mother died when he was 9. Then the Abrahams moved to Illinois.

    Though Abraham had little formal education, he loved to read and educated himself.
    He studied law and became a lawyer in 1837. Lincoln''s political (政治的) career
    began early. He won national attention for his speeches against slavery (奴隸制)
    during several debates (辯論). This led to his first nomination (提名) for the presidency
    (總統職位), which he won in 1860.

    President Lincoln''s election (選舉) angered (激怒) the Southern states and seven
    of them announced (宣告) they would leave the U.S. and form their own government.
    This began the Civil War in 1861. He issued (頒布) the Emancipation Proclamation
    in 1863, which signaled (示意) freedom for the slaves.

    Lincoln was re-elected in 1864. After four long years, Lincoln''s goal to reunite
    the country had come true, but he would not live to see it. Just six days after
    the end of the war, on April 15, 1865, President Lincoln was killed.

    Abraham Lincoln is considered one of the greatest American presidents. He led
    the country through the most difficult time in its history, the Civil War. He
    is remembered today for his wisdom, his compassion (惻隱之心) and his patriotism (愛國主義).'
