    content: '9.'
  - label: B
    content: '10.'
  - label: C
    content: '22.'
  - label: D
    content: '30.'
  group_stem: 'The whole scientific world is full of fantastic facts and statistics
    (統計數據). Here are 10 interesting examples:

    • A giraffe sleeps for 30 minutes a day.

    • A Koala sleeps for 22 hours a day.

    • The Earth travels through space at 67,000 miles per hour.

    • 19 out of 20 people bitten by a Black Mamba snake die.

    • Every second, 100 lightning bolts (閃電) strike the earth.

    • There are 60,000 miles of blood vessels (血管) in each human.

    • Utopia (烏托邦) exists – it''s on Mars.

    • More germs (細菌) are transferred (傳遞) by shaking hands than kissing.

    • A medium size cloud weighs the same as 80 elephants.


    Did you notice that our 10 facts above were only 9? Don''t worry if you didn''t
    because it wasn''t a test! To become a scientist you will need to learn to be
    very observant (善於觀察) and accurate (精確的). In your school science lessons you will
    have opportunities to get involved in many hands-on experiments (實驗) and you will
    find that the more you see, the more you will learn and the more you learn the
    more enjoyable it will be.'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
