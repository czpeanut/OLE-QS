  stem: 科學家從某個星球收集標本，其中分離出與細胞構造相似的實體，經觀察後具有下列重要特徵，試問何者最能支持「該實體類似地球上的生物具有生命現象」？
  options:
  - label: A
    content: 能合成多種物質來維持生理作用
  - label: B
    content: 可以吸收水分使體積變大
  - label: C
    content: 能在空間中移動
  - label: D
    content: 體積極小只能在顯微鏡下觀察。
