- id: doc_112_高雄_大灣_自然_g7s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 關於生物生存所需的要素，下列敘述何者錯誤？
  options:
  - label: A
    content: 大多數生物所需的能量來自太陽
  - label: B
    content: 由於地球和太陽的距離適當，有利於地球上液態水的保存
  - label: C
    content: 空氣中的氧氣可供植物行光合作用
  - label: D
    content: 生物體內的許多作用，必須在有水的環境中才能進行。
