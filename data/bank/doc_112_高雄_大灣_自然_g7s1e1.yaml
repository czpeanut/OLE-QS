- id: doc_112_高雄_大灣_自然_g7s1e1_s1_30
  section: 1
  number: 30
  type: single
  page: 4
  stem: 下列敘述何者不是「生命現象」的表現？
  options:
  - label: A
    content: 錦屏藤紫紅色的氣根隨微風輕揚
  - label: B
    content: 臺灣獼猴享用搶來的月餅
  - label: C
    content: 毛毛蟲羽化成蝴蝶
  - label: D
    content: 遊客被礁岩絆倒的傷口隱隱作痛。
  group_stem: "與獼猴一起探索高雄柴山         節選自與獼猴一起探索高雄柴山步道 \n高雄市與台灣海峽間有道長長的綠色屏障，清代稱打狗山，日治時期改名壽山，高雄人則習慣稱為柴山。由於地理位置特殊，以前列為軍事管制區，因此保留了完整的生態系統，2010\
    \ 年成立為壽山國家自然公園。 \n柴山孕育多達900 多種植物，包含台灣特有種的密毛魔芋、台灣魔芋、恆春厚殼樹、構樹、血桐、稜果榕。闊葉熱帶植物交織出綠色迷宮，山谷中，老榕樹盤根錯節，緊緊攀附嶙峋銳利的珊瑚礁石灰岩，張開綠色巨傘，而錦屏藤帶有金屬光澤的紫紅色氣根密如垂簾，隨微風輕揚，如夢似幻，成為網美拍照熱點，獲得「一簾幽夢」的浪漫名稱。隱藏其中的祕境中有很多石灰岩洞穴，在洞內可以看到由碳酸鈣所沉澱的鐘乳石、石筍、石柱、石壁、石廉、石藤等景觀。一路沿著步道爬上高處，東邊眺望無際市景、西邊等待日落汪洋。\
    \ \n滿山遍野的台灣獼猴是柴山最具代表性的野生動物，是柴山山大王，大剌剌躺在木棧道乘涼，並肆無忌憚地搶食，到處可見兩棲及爬蟲動物、行動緩慢的軟體動物、翠翼鳩與其他鳥種在灌叢下覓食的畫面或在枝椏上鳴唱，蝴蝶在空中翩翩起舞，昆蟲在草叢中跳來跳去，也常能遇到躲在樹叢間的害羞山羌和赤腹松鼠。\n\
    農委會林務局於107 年6 月25 日召開野生動物保育諮詢委員會，將台灣獼猴由原本保育類降為一般類，即使獼猴調降為一般類野生動物，仍受到野生動物保育法的規範及保障，不得任意獵捕、宰殺；此外，高市府訂有自治條例，在高雄市六個行政區內禁止接觸及餵食獼猴，違反者將處以罰鍰，籲請市民注意以免觸法。"
