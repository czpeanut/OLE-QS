  group_stem: "與獼猴一起探索高雄柴山         節選自與獼猴一起探索高雄柴山步道 \n高雄市與台灣海峽間有道長長的綠色屏障，清代稱打狗山，日治時期改名壽山，高雄人則習慣稱為柴山。由於地理位置特殊，以前列為軍事管制區，因此保留了完整的生態系統，2010\
    \ 年成立為壽山國家自然公園。 \n柴山孕育多達900 多種植物，包含台灣特有種的密毛魔芋、台灣魔芋、恆春厚殼樹、構樹、血桐、稜果榕。闊葉熱帶植物交織出綠色迷宮，山谷中，老榕樹盤根錯節，緊緊攀附嶙峋銳利的珊瑚礁石灰岩，張開綠色巨傘，而錦屏藤帶有金屬光澤的紫紅色氣根密如垂簾，隨微風輕揚，如夢似幻，成為網美拍照熱點，獲得「一簾幽夢」的浪漫名稱。隱藏其中的祕境中有很多石灰岩洞穴，在洞內可以看到由碳酸鈣所沉澱的鐘乳石、石筍、石柱、石壁、石廉、石藤等景觀。一路沿著步道爬上高處，東邊眺望無際市景、西邊等待日落汪洋。\
