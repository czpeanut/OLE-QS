- id: doc_112_高雄_大灣_自然_g7s1e1_s1_35
  section: 1
  number: 35
  type: single
  page: 4
  stem: 生物為了適應環境都有其特殊的生存本領，下列何者不是如文章所提類似原理，利用保護色或偽裝來躲避天敵？
  options:
  - label: A
    content: 水筆仔胎生苗猶如一枝筆
  - label: B
    content: 尺蠖靜止時像乾枯樹枝
  - label: C
    content: 木葉蝶形態酷似一片枯葉
  - label: D
    content: 莫氏樹蛙體色如同葉子顏色。
  group_stem: "動植物長得像大便 有神奇妙用      節選自民國112 年9 月11 日國語日報 \n    「像大便一樣」一般用來形容令人嫌惡的味道或東西，這也是許多動物用來保命的方法。在這類動物中外觀長得像鳥糞是最普遍的，有些蛾類幼蟲有鳥糞般的體色，但棲息時常會蜷曲身體，科學家察覺這行為可能有特殊原因，因此用不同顏色和姿態的假餌來測試鳥類的反應，結果發現：蜷曲、鳥糞般體色的假餌比伸直的假餌，受鳥類攻擊的比例大幅降低；而綠色假餌無論伸直或蜷曲，被攻擊比例皆偏高。換句話說，這類幼蟲的蜷曲行為再搭配鳥糞般的體色，可以更有效的騙過鳥類攻擊。\
    \ \n    蟹蛛是不結網的蜘蛛，白天多半停棲在葉片或花朵上，靜待獵物上門，牠們體色有的如花，有的如葉，但還有一些種類猶如鳥糞，實驗發現有一些蠅類能區分鳥糞和像鳥糞的蟹蛛，特別是會取食鳥糞中營養的潛蠅，但其他蠅類或蜂類則無法區分兩者，都會受誘而來，因而遭蟹蛛捕食。在這個例子中，鳥糞般的體色不僅讓蟹蛛騙過天敵，也騙來獵物，具有雙重功能。\
    \ \n    長得像大便一樣最驚奇的例子，其實發生在植物上，南非的銀箭草會長出圓球狀的種子，且群集掉落在地面，種子的大小和外觀猶如羚羊糞，還會散發屎味，吸引糞金龜前來，糞金龜無法分辨真正的屎或種子，於是會將種子滾走，並挖洞埋起來準備飽食一頓或用來育幼，但種子外皮堅硬，糞金龜無法利用只能徒勞離去，但這卻使得種子被散佈，甚至埋到土中獲得較高的發芽機會。"
