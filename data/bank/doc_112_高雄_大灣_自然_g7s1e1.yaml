  section: 1
  number: 5
  type: single
  page: 1
  stem: 進入實驗室，為了使實驗安全順利進行，下列何者正確？
  options:
  - label: A
    content: 室內應保持通風，且隨時可進食以確保實驗體力充足
  - label: B
    content: 酒精燈內的酒精需維持在約$1/3\sim 2/3$ 的量
  - label: C
    content: 使用溫度計測量液體溫度時，應置於液體底部
  - label: D
    content: 調配溶液應在量筒內進行，以確保能加入準確容量。
