- id: doc_113_高雄_鼎金_國文_g9s1e1_s4_28
  section: 4
  number: 28
  type: single
  page: 4
  stem: 根據本文，下列何者為「玉貴」？
  options:
  - label: A
    content: 一半香片一半龍井
  - label: B
    content: 龍井搭配藕粉
  - label: C
    content: 洞庭的君山茶
  - label: D
    content: 茉莉花熏過的茶。
  group_stem: "茶葉品種繁多，各有擅場。有友來自徽州，同學清華，徽州產茶勝地，但是他看到我用一撮茶葉放在壺裡沏茶，表示驚訝，因為他只知道茶葉是烘乾打包捆載上船沿江運到滬杭求售，剩下來的茶梗才是家人飲用之物。恰如北人所謂「賣席的睡涼園」。我平素喝茶，不是香片就是龍井，多次到大柵欄\
    \ 東鴻記或西鴻記去買茶葉，在櫃臺前面一站，徒弟搬來凳子讓坐，看伙計秤茶葉，分成若干小包，包得見稜見角，那分手藝只有藥鋪伙計可以媲美。茉莉花熏過的茶葉，臨賣的時候再抓一把鮮茉莉花放在表面上，所以叫做雙熏。於是茶店裡經常是茶香花香，郁郁菲菲。父執有名玉貴者，旗人，精於飲饌，居恆以一半香片一半龍井混合沏之，有香片之濃馥，兼龍井之苦清。吾家效而行之，無不稱善。茶以人名，乃徑呼此茶為「玉貴」，私家祕傳，外人無由得知。\
    \ \n  其實，清茶最為風雅。抗戰前造訪知堂老人於苦茶庵，主客相對總是有清茶一盂，淡淡的、澀澀的、綠綠的。我曾屢侍先君游西子湖，從不忘記品嘗當地的龍井，不需要攀登南高峰\
    \ 風篁嶺，近處平湖秋月就有上好的龍井茶，開水現沖，風味絕佳。茶後進藕粉一碗，四美具矣。正是「穿牖而來，夏日清風冬日日。卷帘相見，前山明月後山山。」有朋自六安來，貽我瓜片少許，葉大而綠，飲之有荒野的氣息撲鼻。其中西瓜茶一種，真有西瓜風味。我曾過洞庭，舟泊岳陽樓下，購得君山茶一盒。沸水沏之，每片茶葉均如針狀直立漂浮，良久始舒展下沉，味品清香不俗。\
    \ \n  初來臺灣，粗茶淡飯，頗想傾阮囊之所有在飲茶一端偶作豪華之享受。一日過某茶店，索上好龍井，店主將我上下打量，取八元一斤之茶葉以應，余原不滿，乃更以十二元者奉上，余仍不滿，店主勃然色變，厲聲曰：「買東西，看貨色，不能專以價錢定上下。提高價格，自欺欺人耳！先生奈何不察？」我愛其戇直。現在此茶店門庭若市，已成為業中之翹楚。\
    \ \n  此後我飲茶，但論品味，不問價錢。                                          （梁實秋 喝茶）"
