- id: doc_113_高雄_鼎金_國文_g9s1e1_s4_34
  section: 4
  number: 34
  type: single
  page: 6
  stem: 下列何者最符合本文作者的觀點？
  options:
  - label: A
    content: 經典作品必定能夠引發讀者反思的能力
  - label: B
    content: 經典作品應該要被奉為價值判斷的基準
  - label: C
    content: 經典作品中的觀點通常具有討論的意義
  - label: D
    content: 經典作品是各個年齡階段都適讀的作品。
  group_stem: "對我而言，經典反映一種在形式、觀點、價值上具備代表性和討論意義的作品，反映了世界的多樣性、人的多元思維和人性的複雜，成為認識世界的途徑和檢視萬象的基準，但不必然做為價值判斷的準則。\
    \ \n  經典之所成為經典，多因為它們能在不同的時代中引起共鳴，但這種「共鳴」並不僅止於對作者的理解，更具有引發讀者反思自己所處時代的能力。在文學的經典中，讀者透過故事與角色得以反思自身的生命命題；在社會人文的經典中，可以透過作者的心靈與探索的思辨歷程，反省自身時代的困境與機會；在科學的經典中，一窺自然的奧妙、反思人之渺小的同時，卻也驚見我們朝向未知前進的偉大勇氣；在宗教的經典中，得以體驗靈性的高度和人性救贖，面對新世代的經典，可以豐富我們需要更新的心靈。\
    \ \n  閱讀經典，正是與人類最具典範性的靈魂對話！若可以理解經典，我們將成為人類偉大心靈的繼承者。若不理解，提出一個自己的解讀也沒關係，因為許多經典並不是容易讀的作品，有時必須到了另一個生命階段才能夠明白其中更深刻的內涵。\
    \ \n                    （黃國珍 閱讀素養：黃國珍的閱讀理解課，從訊息到意義，帶你讀出深度思考力）"
