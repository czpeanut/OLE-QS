- id: doc_113_高雄_鼎金_國文_g9s1e1_s4_32
  section: 4
  number: 32
  type: single
  page: 5
  stem: 作者認為辛棄疾相較於周邦彥的詞作，具有什麼特色？
  options:
  - label: A
    content: 空間感較大，視野遼闊
  - label: B
    content: 描繪細膩，如工筆畫
  - label: C
    content: 抒情婉約，情意深厚
  - label: D
    content: 善用典故，詞藻華美。
  group_stem: "青玉案元夕是王國維很讚賞的一首作品，從中我們可以看到以往那個像俠士一般，非常關心政治和社會的辛棄疾，表現出他最纏綿、最深情、最婉約的一面。如果沒有這個柔軟的部分，辛棄疾真的就顯得粗魯了。\
    \ \n  「東風夜放花千樹」，元宵節點亮的盞盞花燈，如同被東風催放的繁花一般。辛棄疾和周邦彥、秦觀有很大的不同，他的視野比較遼闊。比如「花千樹」與「葉上初陽乾宿雨」相比，後者是看到一片荷葉上隔夜雨水留下的痕跡，而辛棄疾看到的是一大片花燈。\
    \ \n  人的視覺和聽覺會感受不同的東西，在美學的世界，這為我們提供了不同的經驗。我們透過周邦彥看到更為纖細的東西，他的作品很像工筆畫，像刺繡，而辛棄疾絕對是大潑墨，一上來就是「東風夜放花千樹，更吹落、星如雨」。辛棄疾和蘇軾的作品都有比較大的空間感。\
    \ \n  「寶馬雕車香滿路。鳳簫聲動，玉壺光轉，一夜魚龍舞」，很有貴族氣。元夕的慶祝盛會上，所有人都出來遊玩。辛棄疾並沒有每天都在那裡臥薪嘗膽，他其實滿富有的，日子過得很好，也很嚮往俠士的風度，他的豪邁和他的富有有很大關係。\
    \ \n  「蛾兒雪柳黃金縷」，這是講女子的飾物；「笑語盈盈暗香去」，這裡有一點像李清照。一個最好的創作者既需要男性的部分，也需要女性的部分，如果把他女性的部分拆掉，會發現他就只有粗魯，而少了深情。\
    \ \n  下面這部分非常深情，是王國維用來描摹人生境界的句子：「眾裡尋他千百度，驀然回首，那人卻在，燈火闌珊處。」到處都是煙火，也許辛棄疾在找他心愛的人、他牽掛的人，但一直找不到，幾乎放棄了，忽然一回頭，發現那個人就在繁華的夜市燈光當中。\
    \ \n  其實「驀然回首」是非常偶然的，我們沒有辦法刻意而求，必須在「千百度」當中累積，沒有「千百度」，「驀然回首」也沒有用。精采的畫面在於「那人卻在，燈火闌珊處」，生命裡面如果許諾給我們這個時刻，大概就值得了。\
    \           （「為賦新詞強說愁」到一句「天涼好個秋」：蔣勳評辛棄疾的俠士柔情）"
