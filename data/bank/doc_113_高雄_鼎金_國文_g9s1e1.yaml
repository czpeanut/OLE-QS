    content: 第十條第四則：於運輸、拍賣、繫留等過程中，使用暴力、不當電擊等方式驅趕動物，或以刀具等具傷害性方式標記
  - label: D
    content: 第十條第五則：於屠宰場內，經濟動物未經人道昏厥，予以灌水、灌食、綑綁、拋投、丟擲、切割及放血。
  group_stem: "暴者不恤人功，殄者不惜物力。雞、魚、鵝、鴨，自首至尾，俱有味存，不必少取多棄也。嘗見烹甲魚者，專取其裙①而不知味在肉中；蒸鰣魚者，專取其肚而不知鮮在背上。至賤莫如醃蛋，其佳處雖在黃不在白，然全去其白而專取其黃，則食者亦覺索然矣。且予為此言，並非俗人惜福之謂，假使暴殄②而有益於飲食，猶之可也；暴殄而反累於飲食，又何苦為之？至於烈炭以炙活鵝之掌，剸③刀以取生雞之肝，皆君子所不為也。何也？物為人用，使之死，可也；使之求死不得，不可也。\
    \ \n                                                                （袁枚 隨園食單 戒單\
