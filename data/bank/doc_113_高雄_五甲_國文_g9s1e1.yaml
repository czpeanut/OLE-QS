  group_stem: '(一) 文公之時，宰臣上炙而髮繞之，晉文公召宰人而譙之曰：「女欲寡人之哽邪？奚為以髮繞炙。」宰人頓首再拜請曰：「臣有死罪三：援礪砥刀，利猶干將也，切肉，肉斷而髮不斷，臣之罪一也；援木而貫臠而不見髮，臣之罪二也；奉熾爐，炭火盡赤紅，而炙熟而髮不燒，臣之罪三也。堂下得無微有疾臣者乎？」公曰：「善。」乃召其堂下而讓之，果然，乃誅之。——《韓非子》

