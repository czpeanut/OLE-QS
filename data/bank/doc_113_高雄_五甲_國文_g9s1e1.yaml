    　　李清照出身望族，其父李格非進士出身，是蘇軾的學生，深受賞識。其母王氏，是狀元王拱辰之孫女，精通文章。李清照自幼天資聰穎，家中藏書甚豐，少女時代，就以「知否，知否，應是綠肥紅瘦」等妙句名動汴京。

    　　趙明誠早就聽聞李清照的芳名，對其詩詞讚賞不已，此時一見，頓生愛慕。回家後便懇請父親去提親。

    　　宋徽宗 建中靖國元年(A.D. 1101)，門當戶對的趙明誠與李清照訂婚。李清照嫁給趙明誠時，李清照18歲，趙明誠21歲。

    　　李清照與趙明誠結為伉儷，時趙明誠正在太學念書，二人聚少離多，直至崇寧二年(A.D. 1103)，趙明誠結束求學生活，出仕為官，終得長久相聚。

    　　趙明誠痴迷金石學，剛做官時曾對李清照說：「寧願飯蔬衣簡，亦當窮遇方絕域，盡天下古文奇字。」李清照理解、認同丈夫的志趣，幫助他整理考證，鑑別金石。遇有名人書畫奇器，他們不惜典衣換取。朝廷館閣收藏的珍本祕籍，他們想方設法借來，「盡力傳寫，浸覺有味，不能自己」。

    　　不久，趙明誠的父親趙挺之和李清照的父親李格非因政治原因屢遭打擊。趙家開始敗落，夫妻二人只得離開汴京，回到了趙明誠的故鄉青州。雖然由顯貴變成了庶民，夫婦二人卻過上一生中最安寧、美滿的日子。

    　　對物質生活的淡泊和對精神生活的追求，使志同道合的夫妻倆夫唱婦隨，宛如神仙眷侶。李清照致力於詩詞寫作，存世的六十餘首詞中，有三分之一完成於青州。趙明誠蒐集金石文物、名人字畫，撰寫《金石錄》。平時他們各自做自己喜歡的事，偶爾在院中下棋。

    　　趙明誠寫作，每到考據拿捏不定時，滿腹經綸的李清照總能準確告訴他某句話出自某文獻，在某書某頁某行；喝茶時，夫婦倆常做這樣的遊戲：即一人說出古書上一個典故，對方則要答出此典故在哪一部書的哪一卷、哪一頁、哪一行，答對了就可以先喝茶，答錯了就得為對方奉茶，有時夫妻笑鬧不已，樂到翻天，茶倒潑了滿懷。

    　　在李清照幫助下，趙明誠完成了《金石錄》30卷，著錄所藏金石拓本，上起三代下及隋唐五代，共2000種。趙明誠對鐘鼎彝器銘文的款識及碑銘墓誌石刻的文字，加以辨證考據，這是繼歐陽修《集古錄》之後研究金石之學的專著。

    　　約於政和七年(A.D. 1117)，趙明誠再度離家，開啟另一階段的仕途生涯。李清照面臨這場離別，極不適應，重陽便作〈醉花陰〉，將秋閨的寂寞與惆悵寄給趙明誠。據《瑯嬛記》所載，「明誠嘆賞，自愧弗逮，務欲勝之。一切謝客，忘食忘寢者三日夜，得五十闋，雜易安作以示友人陸德夫。德夫玩之再三，曰只三句絕佳，明誠詰之，答曰：『莫道不消魂，簾卷西風，人比黃花瘦。』正易安作也。」趙明誠從此不得不自歎弗如，自己果然是「□□□□」啊！

    　　高宗 建炎元年(A.D. 1127)，北方金人南侵，攻陷青州，趙明誠夫婦無法安居山東，先後渡江南去。

    　　建炎三年(A.D. 1129)六月，趙明誠獨自前往湖州任知府。時局動盪之劇變接踵而來，趙明誠東奔西走，次年，感染瘧疾，一病不起，死於任上，相攜29年的恩愛夫妻，從此陰陽兩隔，這一年趙明誠49歲，而李清照46歲。

    　　趙明誠卒後，李清照祭文曰：「白日正中，嘆龐翁之機捷；堅城自墮，憐杞婦之悲深。」而後大病一場。

    　　不久金兵南侵，李清照帶著從山東輾轉過來的十五車古器、書物及珍藏的金石書畫，一路倉皇南下，顛沛流離。兵荒馬亂中，李清照遭遇過搶掠、偷盜，幾度出生入死，所藏金石珍寶在漫長的路途中也不斷散失終至殆盡。

    　　國破家亡、中年喪夫，而多年搜求積攬的珍寶俱散，使李清照孤獨無依、悲苦異常，孤寡20年抑鬱度日。

    　　1134年，李清照寫完《金石錄後序》，後將趙明誠遺作《金石錄》校勘整理，表進於朝，完成了丈夫的未竟之功。

    　　晚年倍感淒楚的李清照，詞章不再有閨閣詞句的活潑秀麗、清雋明快，轉為難以言傳的徹骨哀愁。

    　　晚年李清照隱居杭州。雖自號「易安居士」，然身世之感、國家之嘆，人生如何易安？縱是「曠世才女」，縱得佳偶天成，縱擁天下金石珍寶，這世間又有什麼能夠久長？

    　　大約在1155年，七十多歲的「千古第一才女」李清照孤寂離世。

    (資料來源:孫書香〈佳偶天成 李清照與趙明誠〉、諸葛憶兵《宋詞說宋史·李清照的婚姻與宋代婦女生活》、(元)伊世珍《瑯嬛記》)'
