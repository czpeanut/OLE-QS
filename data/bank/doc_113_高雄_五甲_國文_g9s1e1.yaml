- id: doc_113_高雄_五甲_國文_g9s1e1_s3_9
  section: 3
  number: 9
  type: single
  page: 1
  stem: 「古之治天下,朝有進善之旌,誹謗之木,所以通治道而來諦者。今法有誹謗妖言之罪,是使眾臣不敢盡情,而上無由聞過失也。將何以來遠方之賢良?其除之。」文中「其除之」的「之」字所代稱的對象為何?
    【會考考古題】
  options:
  - label: A
    content: 進善之旌
  - label: B
    content: 誹謗之木
  - label: C
    content: 誹謗妖言之罪
  - label: D
    content: 遠方之賢良。
