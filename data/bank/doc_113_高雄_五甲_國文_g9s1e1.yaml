- id: doc_113_高雄_五甲_國文_g9s1e1_s3_3
  section: 3
  number: 3
  type: single
  page: 1
  stem: 「我的記憶運作得像一面蜘蛛網。不重要的事物,比如風,就讓它們過去;但捕獲的蒼蠅就懸掛在網上加以儲存,直到我那心智的蜘蛛需要時再吃掉。」這段文字的涵義,與下列何者最接近?
    【會考考古題】
  options:
  - label: A
    content: 記憶應視事物的輕重而有所擇取
  - label: B
    content: 往事如風,既已逝去,就無須記憶
  - label: C
    content: 記憶如獵物,運用技巧才能捕獲它
  - label: D
    content: 存在腦中的記憶終將隨著時間而消散。
