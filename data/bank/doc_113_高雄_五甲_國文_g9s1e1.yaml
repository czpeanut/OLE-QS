  - label: C
    content: 第三節透過兩個「如果」句的對比,道出農民的悲喜都與農作收成息息相關
  - label: D
    content: 第四節以農人「握鋤荷犁」的形象和武將、文人對比,凸顯農夫擅大刀闊斧。
