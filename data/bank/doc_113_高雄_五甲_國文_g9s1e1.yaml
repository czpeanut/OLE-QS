- id: doc_113_高雄_五甲_國文_g9s1e1_s3_6
  section: 3
  number: 6
  type: single
  page: 1
  stem: 「若不撇開終是苦,各能捺住即成名。」關於這副對聯,下列說明何者正確?【會考考古題】
  options:
  - label: A
    content: 上聯意謂人生苦短,應及時努力
  - label: B
    content: 下聯勉人要看破功名,隨過而安
  - label: C
    content: 上、下聯的末字刻意不合平反,以擴展意境
  - label: D
    content: 由「若」「苦」、「各」「名」的字形差異發想。
