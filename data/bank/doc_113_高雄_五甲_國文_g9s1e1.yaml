- id: doc_113_高雄_五甲_國文_g9s1e1_s3_10
  section: 3
  number: 10
  type: single
  page: 1
  stem: 「某相國之孫,乞米於人,歸途無力自負,覓一市傭代之, 其行遲,曰:『吾生相門,不能肩負,固也;汝傭也,胡為亦爾?』對曰:『吾亦某尚書孫也。』此事聞之於董蒼水。貴人子孫,不可不知。」這則故事所要告誡世人的道理,與下列何者最接近?
    【會考考古題】
  options:
  - label: A
    content: 能勤小物,故無大患
  - label: B
    content: 家必自毀,而後人毀之
  - label: C
    content: 祖蔭不可圖,唯己力可恃
  - label: D
    content: 但存方寸地,留與子孫耕。
