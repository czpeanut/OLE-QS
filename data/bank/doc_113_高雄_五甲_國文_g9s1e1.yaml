- id: doc_113_高雄_五甲_國文_g9s1e1_s3_5
  section: 3
  number: 5
  type: single
  page: 1
  stem: 「春秋」一詞的意義,有時指季節,有時指年齡,有時又是書名。下列詩句中的「春秋」,何者是指「年齡」?
  options:
