    　　國破家亡、中年喪夫，而多年搜求積攬的珍寶俱散，使李清照孤獨無依、悲苦異常，孤寡20年抑鬱度日。

    　　1134年，李清照寫完《金石錄後序》，後將趙明誠遺作《金石錄》校勘整理，表進於朝，完成了丈夫的未竟之功。

    　　晚年倍感淒楚的李清照，詞章不再有閨閣詞句的活潑秀麗、清雋明快，轉為難以言傳的徹骨哀愁。

    　　晚年李清照隱居杭州。雖自號「易安居士」，然身世之感、國家之嘆，人生如何易安？縱是「曠世才女」，縱得佳偶天成，縱擁天下金石珍寶，這世間又有什麼能夠久長？

    　　大約在1155年，七十多歲的「千古第一才女」李清照孤寂離世。

    (資料來源:孫書香〈佳偶天成 李清照與趙明誠〉、諸葛憶兵《宋詞說宋史·李清照的婚姻與宋代婦女生活》、(元)伊世珍《瑯嬛記》)'
