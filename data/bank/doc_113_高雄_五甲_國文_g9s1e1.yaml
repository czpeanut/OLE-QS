  type: single
  page: 2
  stem: 「吟哦自己的吟哦」一句中前面的「吟哦」是動詞,後面的「吟哦」是名詞。請嘗試觀察下列選項「」中的字,何者詞性也依序是動詞與名詞?
  options:
  - label: A
    content: 不要把辛苦存的錢,「花費」在不必要的「花費」上
  - label: B
    content: 在關鍵「時刻」獲得眾人援助的恩情,他「時刻」不敢忘記
  - label: C
    content: 這碗湯就像「溫暖」的冬陽,「溫暖」了我的胃
  - label: D
    content: 人生有許多「煩惱」,永遠「煩惱」不完。
