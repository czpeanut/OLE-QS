- id: doc_113_高雄_五甲_國文_g9s1e1_s3_1
  section: 3
  number: 1
  type: single
  page: 1
  stem: 「每一種異常,與其說是一種『缺陷』,不如說是一種『特質』,能為自己提供一扇特別的窗。帶著笑容往外看,你將看到一個別人看不到的世界。」這段話的觀點與下列何者最接近?
    【會考考古題】
  options:
  - label: A
    content: 以不同角度看自己與他人的差異
  - label: B
    content: 所謂的正常其實也就是一種異常
  - label: C
    content: 包容他人,就可為自己打開一扇窗
  - label: D
    content: 某人的缺點,可能是他人眼中的優點。
