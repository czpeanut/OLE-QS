- id: doc_113_高雄_五甲_國文_g9s1e1_s3_2
  section: 3
  number: 2
  type: single
  page: 1
  stem: 莎士比亞曾以三流喜劇演員為業,當時觀眾可把石子丟在他身上取樂。他曾寫道:「唉!這竟是真的,我曾經走遍各地,讓自己在世人面前穿上彩衣,割裂自己的思想,廉價出賣最貴重的東西。」文中「最貴重的東西」最可能是下列何者?
    【會考考古題】
  options:
  - label: A
    content: 才華
  - label: B
    content: 見聞
  - label: C
    content: 尊嚴
  - label: D
    content: 歡笑。
