- id: doc_113_高雄_五甲_國文_g9s1e1_s3_17
  section: 3
  number: 17
  type: single
  page: 2
  stem: 〈與921 說再見:20年的生命練習題〉是一篇報導文學。主觀與客觀相依是報導文學的寫作特色之一。下列何者是作者的主觀敘述,而不是採訪的客觀事實?
  options:
  - label: A
    content: 「為什麼是我?為什麼你們都離開了?就丟下、剩下我一個人?」
  - label: B
    content: 「當然還是會感到難過,但我現在很努力的在生活,我沒有讓這場震災把我打倒。」
  - label: C
    content: 「我原本很排斥,講出自己的事,怕會讓人覺得我很可憐,會不會讓別人用異樣眼光看我?」
  - label: D
    content: 硬體重建,是相對容易的。房屋倒塌後再蓋,可能比原來的更富麗雄偉,很快就會被所有人忘記,這兒曾見證了天崩地坏的時刻。
  lesson_raw:
    title: 與921說再見：20年的生命練習題
    basis: 題目指明〈與921說再見：20年的生命練習題〉
