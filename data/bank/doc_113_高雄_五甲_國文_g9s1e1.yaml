  - label: C
    content: 「千古興亡多少事?悠悠,不盡長江滾滾流」意近「大江東去,浪淘盡,千古風流人物」
  - label: D
    content: 「天下英雄誰敵手?曹劉。生子當如孫仲謀」期許子孫能效法孫權占據東南,與金人南北抗衡。
