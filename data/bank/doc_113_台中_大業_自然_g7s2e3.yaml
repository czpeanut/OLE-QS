- id: doc_113_台中_大業_自然_g7s2e3_s1_31
  section: 1
  number: 31
  type: single
  page: 5
  stem: 根據文中線索，以下哪一個選項最能支持「藤壺屬於節肢動物門」的判斷？
  options:
  - label: A
    content: 藤壺的外形像貝類，生活方式類似牡蠣
  - label: B
    content: 藤壺會附著在鯨魚與海龜上，與牠們共生
  - label: C
    content: 藤壺的幼體可以游泳，成體具有觸手濾食，與蝦蟹有親緣關係
  - label: D
    content: 藤壺會造成船速減慢，因此人類開發防污漆
  group_stem: '當我們漫步在潮間帶岩石上，常會注意到一群外表堅硬、宛如小火山錐的生物牢牢附著在石頭、碼頭、甚至是船底上。這些不起眼的小傢伙，就是藤壺。

    藤壺的外形像貝類，但牠們其實是節肢動物門的一員，與蝦、蟹是親戚。牠們在幼體時可以游泳，成長後則會分泌膠質物質將自己固定在固體表面，終生不動。牠們用觸手過濾水中的浮游生物，是被動式的濾食者。

    藤壺與其他生物的互動非常多樣，以下列舉幾種：

    1. 藤壺與鯨魚：

    某些藤壺種類（如 Coronula 屬）會附著在大型鯨魚的皮膚上，搭便車在海洋中旅行，利用鯨魚游動時產生的水流濾食食物。對藤壺來說是極大的利多；但對鯨魚而言沒什麼影響。

    2. 藤壺與海龜：

    和鯨魚類似，藤壺也會附著在海龜背上。對海龜來說，如果藤壺過多可能造成行動不便，但少量的附著則幾乎無害，這關係可能介於片利共生與寄生之間。

    3. 藤壺與牡蠣：

    在潮間帶岩石上，藤壺與牡蠣經常搶占相同的空間。兩者都是濾食性固著生物，空間不足時會展開競爭性排擠。

    4. 藤壺與人類：

    藤壺會附著在船底或海上設施上，造成維修成本提高與船速減慢，被人類視為海洋生物污損的元兇之一。為此，人類設計出防污漆來減少其附著。

    這些互動說明：即使是不起眼的藤壺，也在生態系中扮演多重角色，與其他生物建立複雜關係。'
