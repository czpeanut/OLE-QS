  section: 1
  number: 25
  type: single
  page: 3
  stem: 根據文章資訊及課本所學，下列關於瓢蟲的敘述，何者正確？
  options:
  - label: A
    content: 各種瓢蟲皆為肉食性昆蟲
  - label: B
    content: 為節肢動物門的動物，身體分為頭胸部和腹部兩部分
  - label: C
    content: 具有三對步足，且步足分節
  - label: D
    content: 七星瓢蟲和二十八星瓢蟲在分類上是同屬不同種的關係。
  group_stem: '瓢蟲是常見的昆蟲，身體小巧，形狀圓圓的，看起來像一顆小豆子，外殼常有鮮豔的顏色與明顯的斑點。大多數人對牠們的印象是「益蟲」，但你知道嗎？不是每一種瓢蟲都會幫助農民減少害蟲！

    在自然界中，有些瓢蟲是農業上的好幫手，協助農民減少農藥的使用，這種方法就叫做「生物防治」。

    七星瓢蟲（Coccinella septempunctata）是最有名的「捕蟲高手」。牠們專門以蚜蟲為食，尤其是在農田和花園裡，可以大量減少這些吸食植物汁液的害蟲數量，因此被視為重要的生物防治昆蟲。黴斑瓢蟲（Illeis
    cincta）主要以黴菌或真菌為食，對蚜蟲完全不感興趣；而二十八星瓢蟲（Henosepilachna vigintioctopunctata）則是植物的敵人，牠們會啃食葉片，尤其偏愛瓜類作物，反而成了農民頭痛的害蟲之一。所以，下次在田裡或花園看到一隻瓢蟲時，別急著高興，先看看牠是哪一種，也許牠是幫手，也可能是搗蛋鬼！'
