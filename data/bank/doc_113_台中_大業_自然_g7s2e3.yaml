- id: doc_113_台中_大業_自然_g7s2e3_s1_28
  section: 1
  number: 28
  type: single
  page: 4
  stem: 根據文章及課本所學，下列何項敘述正確？
  options:
  - label: A
    content: 獅子魚應為硬骨魚類
  - label: B
    content: 獅子魚為初級消費者
  - label: C
    content: Pterois volitans 與 Pterois miles 兩種獅子魚可生下具有繁殖力的後代
  - label: D
    content: 獅子魚的視覺良好可辨認顏色，但不具有聽覺。
  group_stem: '獅子魚主要包括 Pterois volitans 與 Pterois miles 兩種。牠們的外型華麗，胸鰭和背鰭延展如羽毛，寬扁的大嘴，兩頰具有鰓蓋。背鰭、臀鰭與腹鰭上均具有毒棘，可對人類造成劇烈疼痛。牠是高效的掠食者，以小型魚類、甲殼類和無脊椎動物為食，捕食速度快且策略多樣。全年可產卵，一年中可產數萬顆卵，幼魚存活率高。

    原分布於印度洋及太平洋海域的獅子魚，在 1980 年代末首次在美國佛羅里達州附近的海域被發現，推測是由水族業者放生或水族館意外逸出的個體所致。自此之後，其分布迅速擴展。獅子魚入侵後大量捕食當地小型魚類和無脊椎動物，導致珊瑚礁生態系中的原生物種數量銳減，某些區域的原生魚類族群數量甚至下降達
    80% 以上。許多獅子魚獵物是維持珊瑚礁健康的重要清道夫（如吃藻類的小魚），獵物減少會使藻類過度生長，進一步威脅珊瑚生長。

    目前的控制策略主要可分為人工移除、推廣食用、技術創新三大類。請專業潛水員使用魚叉在珊瑚礁區域獵捕，或舉辦獵魚活動，以提高民眾參與度，並在短時間內大量移除個體，此種方式可精準移除、不破壞環境但需大量人力且對深海區域效益有限。獅子魚的肉質細嫩、無毒、味道佳，是營養價值高的白肉魚，可教導大眾安全處理毒棘，與餐廳、超市合作推廣菜單。目前科學家也積極研發新技術來控制獅子魚，例如水下機器人
    Guardian LF1 能在深海區域識別並電擊或吸取獅子魚。相關研究顯示獅子魚對某些顏色或聲音反應強烈具引誘性，可用於設計捕魚陷阱但需防止誤捕其他物種。'
