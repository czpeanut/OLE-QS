- id: doc_112_高雄_七賢_自然_g7s2e3_s3_48
  section: 3
  number: 48
  type: single
  page: 3
  stem: 在臺灣山區，許多原生種臺灣二葉松（Pinus taiwanensis）因感染松墨天牛傳播的松材線蟲，引起松樹變色枯萎而死亡，關於臺灣二葉松有下列哪些特徵？(甲)有毬果(乙)種子有翅(丙)具果實(丁)昆蟲傳粉
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 丙丁
  - label: C
    content: 甲丁
  - label: D
    content: 乙丙。
  group_stem: '※請閱讀以下文章後，試回答下列 48~50 題：


    在臺灣，自 1985 年以來，中低海拔的松樹林逐漸枯萎，山頭迅速變為紅褐色。專家調查後發現，這是由松材線蟲（Bursaphelenchus xylophilus）引起的，如圖（四）。受感染的松樹，針葉變成黃褐色或紅褐色，整株乾枯死亡，最終腐爛。松材線蟲原產於北美洲，在美國、加拿大、墨西哥等國均有發現。這種線蟲由美國傳入日本，再由日本在
    1980 年代陸續傳入臺灣、中國和韓國，對於松樹林造成毀滅性的打擊。因此，防治松材線蟲至今仍是森林保護的重要議題。


    松材線蟲成蟲體細長，約 1 毫米長，沒有翅膀，無法自行穿越土壤移居到另一棵松樹上。那麼，它們是如何大量感染松樹林的呢？這就要提到臺灣本土的一種昆蟲—松墨天牛（Monochamus
    alternatus），如圖（五）。這種鞘翅目昆蟲以啃食松樹嫩枝為生。雌蟲交配後會在樹皮下產卵，卵約一週後孵化。幼蟲以樹皮為食，化蛹時會在樹幹裡形成蛹室。此時，松墨天牛會散發出不飽和脂肪酸及二氧化碳，吸引大量松材線蟲集中到蛹室。當松墨天牛即將羽化時，松材線蟲迅速鑽入其身體，隨著破蛹而出的松墨天牛，如同搭乘飛機一般，被帶到健康的松樹上。松材線蟲再從松墨天牛的氣管、氣門鑽出，經由松墨天牛啃食松樹造成的傷口進入松樹體內，開啟新一輪的感染循環。


    在松材線蟲感染松樹的過程中，松墨天牛的幼蟲也在受感染的松樹中繁殖。由於松材線蟲會使松樹的樹脂分泌減少或停止，就不會阻礙松墨天牛的孵化和發育。本土的松墨天牛能與外來的松材線蟲相互作用，這讓臺灣的生物學家感到十分驚訝。為了預防松材線蟲引起的松樹萎凋病，農業部林業及自然保育署建議以下方法：（一）剷除感染源：伐倒罹病松樹，使用化學或物理方法殺死病死木內的松材線蟲和松墨天牛。（二）防止昆蟲傳播：通過空中或地面農藥噴灑預防性撲殺松材線蟲和松墨天牛，並施放寄生蜂以控制松墨天牛的幼蟲。（三）增強松樹抗病性：育種培育抗松材線蟲的松樹品種。'
