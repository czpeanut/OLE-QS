  section: 1
  number: 39
  type: single
  page: 4
  stem: 非洲西部某國家在被歐洲列強殖民以前，人民的維生方式主要有兩類：南部居民以農業維生，北部居民則以畜牧業為主。其中，畜牧維生的居民主要飼養牛隻，逐水草而居，並和北方非從事商品貿易。列強殖民以後，跨越撒哈拉沙漠的商品貿易逐漸式微，畜牧者改採更集約的方式飼養更多的牲口，以提高收入。文中提到「畜牧維生的居民主要飼養牛隻，逐水草而居」。請問：畜牧者主要的活動範圍應位在哪兩個氣候區之間？(甲)熱帶莽原氣候
