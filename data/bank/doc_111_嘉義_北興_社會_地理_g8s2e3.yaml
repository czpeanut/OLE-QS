  stem: 漠南非洲因為乾旱而引發饑荒，在馬拉威、莫三比克、賴索托等國在每年九月至隔年的二月所謂【饑月份】，每天往往只能吃一頓飯。專家表示非洲國加入WTO後，地主使用土地的方式將改變以利於生產更多出口商品，饑荒問題將更加惡化。由上文可知，為何非洲國家加入WTO後將使饑荒變的更加嚴重？
