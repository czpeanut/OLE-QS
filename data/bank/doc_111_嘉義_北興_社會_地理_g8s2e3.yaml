  stem: 巧克力擁有甜美的滋味，其背後卻是帶給非洲孩童痛苦的奴役產業鏈。全球45%的可可來自西非國家象牙海岸，然而可可農場年收入僅有約1900美元（新台幣約59000元），童工對農場老闆而言是最廉價的非法勞動力。迄今仍有數百萬貧困孩童被迫從事開墾雨林、噴灑農藥、搬運重達四十幾公斤的可可豆等粗重工作。《衛報》（The
    Guardian）12日報導，8名兒時在象牙海岸可可農場遭到奴役的年輕人，在美國非營利人權機構「國際權利倡導者」協助下，向瑪氏（Mars）、雀巢（Nestlé）、好時（Hershey）等巧克力大廠提起集體訴訟，指控它們協助與教唆供應鏈當中的可可農場非法奴役成千上萬孩童。（風傳媒2021.2.13）根據上述報導，突顯出此種熱帶栽培業具有下列哪一特性？
  options:
