  section: 1
  number: 27
  type: single
  page: 3
  stem: 第一次世界大戰期間，英、法軍隊合作，遏阻了德軍的攻勢，雙方在西線形成何種戰局？
  options:
  - label: A
    content: 殲滅戰
  - label: B
    content: 宣傳戰
  - label: C
    content: 壕溝戰
  - label: D
    content: 閃電戰。
  group_stem: "＊雷馬克作品《西線無戰事》 \n「故事的背景是設定在1917 年的德國。當時以德國為首的國家，同時面對法國與俄國的左右夾擊，原本想以迅雷不及掩耳的史里芬計劃（SchlieffenPlan\
    \ ）。在比利時到南法的西線戰場，長驅直入地將法軍擊潰，再迅速回防迎擊俄軍的來犯。只是過於迂迴的冗長戰線，讓德軍陷入死傷慘重的膠著戰情，為了前線正規軍力的嚴重不足，只好大量使用未經正規訓練的預備兵力。\
    \ \n於是德軍四處在各大校園巡迴，發表慷慨激昂的愛國演講，喚起許多熱血青年報效國家的光榮使命，紛紛投入從軍行列的前仆後繼，17 歲的德國青年保羅（費利克斯卡默勒\
    \ Felix Kammerer）與其他三位好友，就這樣興高采烈地加入軍隊，隨時蓄勢待發的鬥志高昂，要前往戰場上奮勇殺敵，只是理想總是美好，現實卻是無比殘酷，殊不知天真浪漫的他們，完全沒有預期到，前方等待他們的，不是衣錦還鄉的榮耀勝利，而是橫屍遍野的前線，熱忱抱負不再的回頭太難，只求能夠生存的徹底絕望。」\
