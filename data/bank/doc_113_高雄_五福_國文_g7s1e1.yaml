- id: doc_113_高雄_五福_國文_g7s1e1_s4_6
  section: 4
  number: 6
  type: single
  page: 6
  stem: 華華正在和小君討論這則有趣的報導，關於本文內容，下列描述何者正確？
  options:
  - label: A
    content: 將有高濃度氧氣的液體注入豬的肛門裡，可使豬吸收到氧氣
  - label: B
    content: 搞笑諾貝爾獎今年在大阪大學進行頒獎，日本獲得許多獎項
  - label: C
    content: 這項研究若臨床實驗成功，未來可造福許多腸道受損的病患
  - label: D
    content: 研究發現泥鰍幾乎不使用鰓呼吸，而是多數皆透過腸道呼吸
  group_stem: "(五) 「豬用屁股呼吸」榮獲搞笑諾貝爾獎！  \n    2024 年9 月，「搞笑諾貝爾獎」在美國麻省理工學院頒獎，在多項獲獎者當中，最引人矚目的是來自日本東京醫科齒科大學、以及大阪大學團隊的一項醫學發現；這項由武部貴則教授率領的研究指出，哺乳類動物可能具有利用「腸道」呼吸的潛在能力。\
    \ \n這項研究的靈感，來自稻田中生活的泥鰍；由於泥鰍已被確定不僅能透過鰓呼吸，而且也能透過腸道呼吸，因此武部教授的團隊猜想，哺乳類動物是否也具有同等能力？並著手展開實驗。\
    \ \n他們做的實驗，包括：替「肺功能受損」的豬隻，從肛門「灌注」含有高濃度氧氣的特製液體，結果豬隻血液中的氧氣濃度真的顯著增加。另外從肛門注射含氧液體的白老鼠，也出現了能在低氧環境中積極活動的表現，證明這兩種動物確實透過腸道攝入氧氣，打破只有「肺」才能呼吸的慣性思維。\
    \ \n這項研究的發表時間，正好是三年前、2021 年新冠肺炎大流行的黑暗時刻；當時日本全國各地的醫院，躺著許多因為肺炎導致肺部受損的患者。 \n目前武部教授已經成立一家公司，開始進行「腸道呼吸」的臨床實驗。倘若實驗成功，證明人類腸道也有同等的潛能，未來將有望成為一項全新的呼吸療法，為肺衰竭的病人提供重生的契機。\
    \ \n節錄自――林耿郁報導，民視新聞網"
