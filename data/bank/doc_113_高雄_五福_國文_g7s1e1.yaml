  group_stem: "(六) \n    你知道嗎？其實雨沒有聲音，它在雲層上方無聲地聚集、凝結，自兩千公尺的高空，以每平方秒九點八公尺的加速度筆直劃破空氣時，都是安靜的。\
    \ \n    所謂下雨的聲音，是它太放心地墜落，卻沒能被溫柔地接納，用力撞擊地面而響徹整座城市的疼痛。 \n    此生我註定是雨，承載著滿滿的熱情而降落，重重地直奔向你。你是路面，沒有察覺斗大的水珠裡盛滿了我的熱情。如果日子一天天過去，你依然能記得那場雨的聲音，記得曾經有一個人不計疼痛，只為了更接近你，那便值得了。\
    \ \n節錄自――渺渺《你已走遠，我還在練習道別》"
