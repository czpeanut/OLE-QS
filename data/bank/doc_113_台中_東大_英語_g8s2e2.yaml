  group_stem: '(B)

    Maroon 5 is a famous pop band known for their catchy songs and unique style. The
    band was formed in 1994, when the lead singer Adam Levine and his members were
    in high school. They called themselves Kara''s Flowers at that time. In the early
    days, they played a more traditional rock sound. However, as they grew older and
    gained more experience, they changed their name to Maroon 5 and began to experiment
    with different musical styles, including pop and R&B.

    Their big break came in 2002 with the release of their first album, Songs About
    Jane. The album was a huge success. Songs like "This Love" and "Sunday Morning"
    became popular around the world and helped the band reach a wider audience.

    In 2014, Maroon 5 released their hit song "Sugar" from their album V. The music
    video for "Sugar" helped boost the song''s popularity even more. In the video,
    the band surprises real couples by showing up at their weddings to perform the
    song live. The couples are moved by the band''s appearance at such an important
    event. Maroon 5 is always good at connecting with fans in unique ways, and this
    video, full of surprise and happiness, helped make the song a global hit. It is
    a key reason why Maroon 5 is popular for so long.

