  group_stem: '(51~53)

    Donald Trump was chosen as the president of the United States again. Many people
    in the US and other countries were surprised by his win.

    At 78 years old, Trump is now the oldest person elected as president in the US.
    He ran against Kamala Harris, who is the current vice president. Harris hoped
    to make history by becoming the first woman and first Black and South Asian American
    president, but she failed.

    Trump got 295 electoral votes while Harris got 226 votes. Trump gained key support
    in important states like North Carolina, Georgia, and Pennsylvania. After winning,
    Trump gave a speech. He said he wants America to be “strong and safe.” He promised
    to make some changes, such as protecting the country’s borders.

    Trump will begin his new term in January 2025. Harris, who focuses on rights for
    women, will leave her current role then. The result of this election showed that
    most Americans still support Trump, even there are some different voices about
    him.

