    Three people are giving a speech to students in Tucheng Junior High School. All
    of them graduated from this school 15 years ago, and they want to be helpful to
    these young students.

    Mr. Louis Hsieh: “From 4 to 11 a.m., I work in my breakfast store. The breakfast
    I make can light up people’s days. In the evening, I work in a famous restaurant
    as a singer. People love my voice, and I enjoy singing, too. People’s smiles are
    always my favorite.”

    Ms. Yun Chen: “I am a reporter. Every day I interview people and write news reports.
    I do a lot of work before each interview. I can’t just go there and ask useless
    and impolite questions. Good questions help my news reports be accurate and useful
    to the public. That’s what I insist on.”

    Mr. Morris Li: “I’m a psychotherapist. I listen to people telling their stories
    and problems with all my heart. I try my best to cheer them up and help them believe
    in themselves. I also teach them different ways to fight off stress.”

