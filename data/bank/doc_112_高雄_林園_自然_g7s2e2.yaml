  group_stem: 【題組4】微生物的應用範圍相當廣泛，傳統上微生物在酒類釀造、食品發酵和汙水處理等方面都扮演重要角色；隨著科技發展的腳步，許多由微生物生產的產品也被一一開發。例如：(1)微生物菌體：包括烘焙酵母、菇類、藻類、乳酸發酵用的種菌、冬蟲夏草、益生菌、改善環境的各種微生物製劑等；(2)微生物酵素：包含澱粉酶、纖維素酶、蛋白酶等；(3)微生物代謝物：包括發酵產品如酒精、乳酸、丁醇與丙酮等，生長因子如胺基酸、維生素、檸檬酸等，二級代謝產物(secondary
