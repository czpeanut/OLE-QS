    metabolites)如抗生素、生物鹼等；(4)遺傳工程蛋白質：包括人類荷爾蒙如胰島素、生長激素；免疫調節劑如干擾素、細胞間素；血液蛋白質如凝血因子、血清白蛋白、基因重組疫苗如B
    型肝炎疫苗、豬的狂犬病和下痢疫苗；單株抗體等。請依所學與上述文章內容回答下列問題：
