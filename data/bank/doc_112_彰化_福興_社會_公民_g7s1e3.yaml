  stem: 請問：溪洲部落的阿美族族人從反迫遷抗爭，到親自參與新家園的規畫、營造工作，可以用下列何者說明？
  options:
  - label: A
    content: 透過公民參與爭取部落權益
  - label: B
    content: 政府成功以迫遷促使族人離開危險之地
  - label: C
    content: 因社會變遷已使族人改變原本生活模式
  - label: D
    content: 政府的公權力無法影響原住民族的生活
  group_stem: 位於新店溪，以阿美族族人為主要成員的溪洲部落，是新北都會區都市邊緣的原住民族部落。1995年，在地方政府的輔導下，部分住戶遷入新店區的中正國宅。然而，因部落的生活型態與國宅空間差異極大，許多居民不願遷村，因此組成自救會，展開反迫遷的抗爭道路。在經過多年的努力抗爭與各方協調整得共識後，終於在2017年正式舉行家園新建工程的開工儀式。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
