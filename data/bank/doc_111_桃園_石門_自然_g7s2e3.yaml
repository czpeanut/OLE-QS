  stem: (1)冰冷的太平洋海水、高聳的巨藻林、海膽、海獺，共同組成了
  options:
  - label: A
    content: 族群
  - label: B
    content: 群集
  - label: C
    content: 生態系
  - label: D
    content: 生物圈。
  group_stem: (三)在滾滾波濤之下，冰冷的太平洋海水蘊含豐富的養分，高聳的巨藻林就像摩天大樓住了各式各樣的生物，但其中有個居民太得寸進尺了，那就是海膽。牠們毫無節制地狂吃海藻，這裡曾經是個海底森林，現在已成了荒原，牠們吃掉自己的庇護所，也吃掉了大家的家園，要是不管牠的話，這種長滿刺的素食生物就會害了大家。幸好這片巨藻林的幫手就在附近，海獺吃各式各樣的生物，但最愛的就是海膽。刺刺的硬殼難不倒牠們，牠們還學會使用工具，用石頭把獵物敲開，海獺每天得吃相當於體重1/4
    的食物來維持體溫，牠的大食量，阻止了失控的海膽，拯救了巨藻森林。請根據上文，試回答下列問題：
