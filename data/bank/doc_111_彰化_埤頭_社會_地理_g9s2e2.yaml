- id: doc_111_彰化_埤頭_社會_地理_g9s2e2_s1_29
  section: 1
  number: 29
  type: single
  page: 3
  stem: 右圖為印度簡圖，請問馬拉巴咖啡產地最有可能是位於右圖何處？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
  group_stem: "【題組】閱讀下列文章後，請回答下列問題。\n    印度的咖啡種植，據說起源於十七世紀一位宗教修行者根據教義規範，前往聖地履行一生至少朝覲聖地一次的義務時，從葉門摩卡帶回了種子，現在印度是全球咖啡第五大生產國。一種獨特且有名的豆子-季風咖啡，是在德干高原Malabar地區生產的，採收後，受季風吹拂而成的季風馬拉巴，給人的印象多是濃厚圓潤的味道，光滑口感帶有特別濃郁的香氣。\n\
    \    季風豆的產生是個意外。歐洲人在印度殖民時，將印度生產的咖啡豆以海運載回到殖民母國，咖啡豆必須花上幾個月的航行，才能從印度到達歐洲，在航行過程，高度的溼氣及海風，使得原本鮮綠的豆子加速成熟變成陳年的淡黃色，到達歐洲市場，這些淡黃色的豆子獨特成熟的風味及低酸度，在歐洲市場上造成了大流行。十九世紀後，隨著蘇伊士運河開通和新航道開通，航程大幅縮短，使得咖啡獨特的風味消失，於是咖啡業者便在鄰近產地的馬拉巴海岸闢設通風廠，在季風季節刻意讓豆子暴露在空氣中，形成和船運時期類似的效果。"
  assets:
  - key: s1_29_f1
    kind: figure
    file: doc_111_彰化_埤頭_社會_地理_g9s2e2/s1_29_f1.png
