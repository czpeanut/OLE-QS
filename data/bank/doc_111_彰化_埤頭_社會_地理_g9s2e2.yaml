- id: doc_111_彰化_埤頭_社會_地理_g9s2e2_s1_25
  section: 1
  number: 25
  type: single
  page: 3
  stem: 請問石滬是屬於何種漁業？
  options:
  - label: A
    content: 沿岸漁業
  - label: B
    content: 近海漁業
  - label: C
    content: 遠洋漁業
  - label: D
    content: 養殖漁業。
  group_stem: "【題組】閱讀文章後，請回答下列問題。\n    石滬是一種海中的陷阱，是目前保存最古老的捕魚技術。石滬利用漲退潮來捕魚，漲潮時魚群隨著潮水游至岸邊覓食，退潮時退路為石滬所阻，海水由石縫排出，而魚群則陷於「滬房」內，漁民便可利用漁網或魚叉輕易捕捉。\n\
    \    石滬的建造，必須有相關的地理條件配合：第一要有石材：黑石玄武岩覆於外，白石「咾咕石」包於內，咾咕石含碳酸鈣，遇酸雨分解成碳酸氫鈣而流至岩縫內，待碳酸氫鈣還原時便具有固結黑石的作用，以防颱風或浪頭衝落。第二要潮差大：漲潮時，潮水積著魚群入滬，退潮時，海平面低於滬高，魚群被困於滬內，因此，潮差越大，集魚效果越好。第三風浪要強：天候愈差，海浪愈猛，魚群愈容易被颶趕入滬內。第四珊瑚礁棚的面積要大，由食物鏈的連鎖效應，帶來大批的消費者。"
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
