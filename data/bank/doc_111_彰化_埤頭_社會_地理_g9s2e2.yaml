  group_stem: "【題組】閱讀文章，回答問題\n    歐洲人桌上的花卉有超過三分之一來自非洲，非洲花卉產業長久以來的霸主是肯亞，後起之秀為衣索比亞。他們皆深具氣候與地理優勢。\n\
    \    花卉是高價值經濟作物，非常嬌嫩，運輸方式需要低溫、保溼，且講求時效性，鮮花一收成就要馬上包裝、運輸，送到拍賣市場。花卉進入全世界最大規模、被譽為花卉華爾街的荷蘭「阿斯米爾鮮花拍賣市場」，再發配到各地的供應商，此方法可確保鮮嫩的花朵在兩天內，即可在歐洲各地浪漫的花店櫥窗內爭奇鬥豔。\n\
    \    鮮花的全球化產業鏈，也為環保團體所詬病，因為遠程運輸所帶來高額的_____，英國當地農場花卉協會曾計算過，同樣一束花（3枝玫瑰、3枝百合、3枝滿天星），從荷蘭、非洲進口的碳排量是英國當地產的近十倍高（31kg對比3kg二氧化碳）。因此英國花農鼓勵消費者購買當地農民出產的花卉。"
