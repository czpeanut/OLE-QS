    廣為人長，猿臂，其善射亦天性也，雖其子孫他人學者， 莫能及廣。廣訥口少言，與人居，則畫地為軍陳，射闊狹以飲。專以射為戲，竟死。廣之將兵，乏絕之處，見水，士卒不盡飲，廣不近水；士卒不盡食，廣不嘗食。寬緩不苛，士以此愛樂為用。其射，見敵急，非在數十步之內，度不中，不發；發即應弦而倒。用此，其將兵數困辱，其射猛獸亦為所傷云。

