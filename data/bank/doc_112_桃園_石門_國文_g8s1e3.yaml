    我發現我不會削蘋果。經過艱苦的努力我才學會補襪子。我怕上理髮店、怕見客、怕給裁縫試衣裳。許多人嘗試過教我織絨線，可是沒有一個成功。在一間房裡住了兩年，問我電鈴在哪兒我還茫然。我天天乘黃包車上醫院去打針，接連三個月，仍然不認識那條路。總而言之，在現實的社會裡，我等於一個廢物。我母親給我兩年的時間學習適應環境。她教我煮飯，用肥皂粉洗衣，練習行路的姿勢，看人的眼色，如果沒有幽默天才，千萬別說笑話。在待人接物的常識方面，我顯露驚人的愚笨。我的兩年計劃是一個失敗的試驗。除了使我的思想失去均衡外，我母親的沉痛警告沒有給我任何的影響。生活的藝術，有一部分我不是不能領略。我懂得怎麼看「七月巧雲」，聽蘇格蘭兵吹風笛，享受微風中的藤椅，吃鹽水花生，欣賞雨夜的霓虹燈，從雙層公共汽車上伸出手摘樹巔的綠葉。在沒有人與人交接的場合，我充滿了生命的歡悅。可是我一天不能克服這種咬嚙性的小煩惱，生命是一襲華美的袍，爬滿了蝨子。

    張愛玲〈天才夢〉'
