  stem: 「我是一個古怪的女孩，從小被目為天才，除了發展我的天才外別無生存的目標。然而，當童年的狂想逐漸褪色的時候，我發現我除了天才的夢之外一無所有——所有的只是天才的乖僻缺點。世人原諒瓦格涅的疏狂，可是他們不會原諒我。」以上這段文字作者想表達的是？
  options:
  - label: A
    content: 自小便被視為天才，但長大後才發現自己只有天才的乖僻缺點，也只會做天才夢
  - label: B
    content: 自己性情古怪，一心一意想變成天才
  - label: C
    content: 因自己從小就喜歡做天才夢，所以特意乖僻
  - label: D
    content: 自己有瓦格涅的疏狂，也同樣被大眾原諒。
  group_stem: '（五）

    我是一個古怪的女孩，從小被目為天才，除了發展我的天才外別無生存的目標。然而，當童年的狂想 逐漸褪色的時候，我發現我除了天才的夢之外一無所有——所有的只是天才的乖僻缺點。世人原諒瓦格涅
    的疏狂，可是他們不會原諒我。(瓦格涅，德國作曲家、文學家，一生致力于歌曲創作) 加上一點美國式的宣傳，也許我會被譽為神童。我三歲時能背誦唐詩。我還記得搖搖擺擺地立在一個滿清遺老的藤椅前朗吟「商女不知亡國恨，隔江猶唱後庭花」，眼看著他的淚珠滾下來。七歲時我寫了第一部小說，一個家庭悲劇。遇到筆畫複雜的字，我常常跑去問廚子怎樣寫。第二部小說是關於一個失戀自殺的女郎。我母親批評說：如果她要自殺，她決不會從上海乘火車到西湖去自溺，可是我因為西湖詩意的背景，終於固執地保存了這一點。我僅有的課外讀物是西遊記與少量的童話，但我的思想並不為它們所束縛。八歲那年，我嘗試過一篇類似烏托邦的小說，題名快樂村。快樂村人是一好戰的高原民族，因克服苗人有功，蒙中國皇帝特許，免征賦稅，並予自治權。所以快樂村是一個與外界隔絕的大家庭，自耕自織，保存著部落時代的活潑文化。九歲時，我躊躇著不知道應當選擇音樂或美術作我終身的事業。看了一張描寫窮困的畫家的影片後，我哭了一場，決定做一個鋼琴家，在富麗堂皇的音樂廳裡演奏。對於色彩、音符、字眼，我極為敏感。當我彈奏鋼琴時，我想像那八個音符有不同的個性，穿戴了鮮艷的衣帽攜手舞蹈。我學寫文章，愛用色彩濃厚、音韻鏗鏘的字眼，如「珠灰」、「黃昏」、「婉妙」、「憂鬱」，因此常犯了堆砌的毛病。直到現在，我仍然愛看聊齋誌異與俗氣的巴黎時裝報告，便是為了這種有吸引力的字眼。在學校裡我得到自由發展。我的自信心日益堅強，直到我十六歲時，我母親從法國回來，將她睽隔多年的女兒研究了一下。「我懊悔從前小心看護你的傷寒症，」她告訴我，「我寧願看你死，不願看你活著使你自己處處受痛苦。」
    我發現我不會削蘋果。經過艱苦的努力我才學會補襪子。我怕上理髮店、怕見客、怕給裁縫試衣裳。許多人嘗試過教我織絨線，可是沒有一個成功。在一間房裡住了兩年，問我電鈴在哪兒我還茫然。我天天乘黃包車上醫院去打針，接連三個月，仍然不認識那條路。總而言之，在現實的社會裡，我等於一個廢物。我母親給我兩年的時間學習適應環境。她教我煮飯，用肥皂粉洗衣，練習行路的姿勢，看人的眼色，如果沒有幽默天才，千萬別說笑話。在待人接物的常識方面，我顯露驚人的愚笨。我的兩年計劃是一個失敗的試驗。除了使我的思想失去均衡外，我母親的沉痛警告沒有給我任何的影響。生活的藝術，有一部分我不是不能領略。我懂得怎麼看「七月巧雲」，聽蘇格蘭兵吹風笛，享受微風中的藤椅，吃鹽水花生，欣賞雨夜的霓虹燈，從雙層公共汽車上伸出手摘樹巔的綠葉。在沒有人與人交接的場合，我充滿了生命的歡悅。可是我一天不能克服這種咬嚙性的小煩惱，生命是一襲華美的袍，爬滿了蝨子。

    張愛玲〈天才夢〉'
