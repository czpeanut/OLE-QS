  stem: 根據國際咖啡組織（ICO）調查，台灣人1年共喝掉約28.5億杯咖啡，平均每人每年喝掉兩百杯咖啡，市場規模高達8百億元。因此除了咖啡店和超商，就連超市、早餐店也跳進這個產業。年產值8百億元的台灣咖啡市場，堪稱咖啡的戰國時代。下列有關台灣咖啡市場的分析，何者正確？
  options:
