- id: doc_113_台南_復興_社會_公民_g9s1e2_s1_52
  section: 1
  number: 52
  type: single
  page: 2
  stem: 小璐於網路訂購5萬元可立即食用保存期限短的高檔年菜，訂購時商家並未告知不適用7日猶豫期，收到貨完全不如預期，隨即通知商家退貨卻被拒，覺得權益受損，於是上網查法律規範，結果如下：消費者保護法第19條：「通訊交易或訪問交易之消費者，得於收受商品或接受服務後七日內，以退回商品或書面通知方式解除契約，無須說明理由及負擔任何費用或對價。但通訊交易有合理例外情事者，不在此限。」又通訊交易解除權合理例外情事適用準則第2條規定，易於腐敗、保存期限較短或解約時即將逾期等通訊交易購得之商品，經業者告知消費者將排除7日解除權（猶豫期）。請問：依法小璐可以退貨嗎？原因為何？
  options:
  - label: A
    content: 可以，因為是通訊交易
  - label: B
    content: 可以，因為商家未主動告知不適用7日解除權
  - label: C
    content: 不可以，因為是保存期限短的商品
  - label: D
    content: 不可以，因為商品無瑕疵，不能因不如預期退貨
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
