- id: doc_113_台南_復興_社會_公民_g9s1e2_s1_59
  section: 1
  number: 59
  type: single
  page: 2
  stem: '有一款電玩遊戲，其遊戲設計如下：警方逮捕小花、小草兩名嫌疑犯，但沒有足夠證據指控二人有罪。於是警方分開囚禁嫌疑犯，由檢察官分別和二人見面，並向雙方提供以下三種相同的選擇情境：

    〈情境一〉：若一人認罪並作證指控對方（相關術語稱「背叛」對方），而對方保持沉默，此人將被釋放，沉默者將被求刑10年。

    〈情境二〉：若二人都保持沉默（相關術語稱互相「合作」），則二人將各被求刑半年。

    〈情境三〉：若二人都認罪並指控對方（相關術語稱互相「背叛」），則將各被求刑5年。

    請問：他們二人都有幾種選擇？若每個人都只在乎會被求刑多久，且每個人都會做對自己最有利的選擇，他們應該要如何選擇才符合自己的最佳利益？'
  options:
  - label: A
    content: 2種選擇；選擇背叛
  - label: B
    content: 2種選擇；選擇合作
  - label: C
    content: 3種選擇；選擇合作
  - label: D
    content: 3種選擇；選擇背叛
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
