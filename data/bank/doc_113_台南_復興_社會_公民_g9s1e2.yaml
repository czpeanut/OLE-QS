- id: doc_113_台南_復興_社會_公民_g9s1e2_s1_43
  section: 1
  number: 43
  type: single
  page: 1
  stem: 全聯於2022年7月併購大潤發，相關政府單位提出7大負擔要求，有條件同意兩強結合。然而全聯未履行結合承諾中的「禁止最惠客戶政策」之負擔，也就是「全聯公司不得以其他通路之商品定價，作為與供貨廠商議價之基礎，要求更為有利或同等之條件，以其市場力迫使供貨廠商吸收成本並產生『其他通路售價不低於全聯公司』之壓力，進而影響其他通路降價競爭幅度。」因此2024/4/22被依法裁罰2000萬元。請問：文中的「相關政府單位」及所依之「法」，分別為何？
  options:
  - label: A
    content: 金融監督管理委員會，公司法
  - label: B
    content: 公平交易委員會，公平交易法
  - label: C
    content: 公平交易委員會，公司法
  - label: D
    content: 消費者保護處，消費者保護法
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
