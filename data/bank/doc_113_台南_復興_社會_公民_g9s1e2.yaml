  stem: 經濟學之父亞當斯密在《國富論》提到：「我們所需要的食物不是出自屠宰業者、釀酒業者、麵包業者的恩惠，而僅僅是出自他們對自身利益的顧慮。」也就是說「個人自利心」引導著市場交易行為，以便獲得更好的商品或更高的報酬，以增進個人的利益。請問：下列哪一種行為不符合上述理論？
