  section: 3
  number: 10
  type: single
  page: 2
  stem: 聲音鐘一文，「他們像陽光、綠野、花一樣，是這有活力的城市，有活力的人間，不可或缺的色彩。」這段文字說明小販的叫賣聲具有何種特色？
  options:
  - label: A
    content: 如同陽光、空氣、水一般不可或缺
  - label: B
    content: 像是每日所需，呼吸般自然
  - label: C
    content: 是街頭巷尾揮之不去的噪音
  - label: D
    content: 是生命力的象徵，為生活增添色彩。
  lesson_raw:
    title: 聲音鐘
    basis: 題目提及課名「聲音鐘」
