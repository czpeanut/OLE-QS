  stem: 「生命像五線譜，有高昂的音符，也有低沉的音符。我們如果只選擇高昂而捨棄低沉，就不能奏出美妙的樂章。」此段文字的涵義為何？
  options:
  - label: A
    content: 音樂使生命更豐富，生命使音樂更美妙
