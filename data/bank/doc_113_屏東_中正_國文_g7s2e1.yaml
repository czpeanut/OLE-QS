- id: doc_113_屏東_中正_國文_g7s2e1_s4_7
  section: 4
  number: 7
  type: single
  page: 6
  stem: '比較周星馳的〈我最好的一場戲〉和洪醒夫〈紙船印象〉，下列敘述何者為非?


    | | 〈我最好的一場戲〉 | 〈紙船印象〉 |

    | --- | --- | --- |

    | 母親的愛 | (甲)即使忙累也要想辦法讓孩子溫飽，只願意吃兒女剩下不吃的食物 | (乙)母親即使農忙或遇到下雨，仍然耐住性子給孩子摺紙船，希望孩子高興
    |

    | 文章立場 | (丙)多年後才明白母親的愛 | (丁)為人父後，更明白母親的愛 |'
  options:
  - label: A
    content: (甲)
  - label: B
    content: (乙)
  - label: C
    content: (丙)
  - label: D
    content: (丁)。
  group_stem: '我最好的一場戲／周星馳

    母親與父親離異那一年，我才 7 歲。我和姐姐周文姬、妹妹周星霞一同判給了母親淩寶兒。

    在 1968 年的香港，母親帶著我們 3 個孩子討生活，其艱難可想而知。為了維持生活，母親一人打了兩份工。我們幾個都特別乖巧懂事，這讓母親很寬慰。

    尤其是我，由於成績十分優秀，最得母親鍾愛。那時我們 3 個孩子都正是長身體的時候，所以不管多麼困難，每個星期，母親都要稱點肉或買尾魚給我們加餐。

    每當吃這些豐盛的「大餐」時，菜一上桌，我就把菜端到自己的身邊，專挑好的吃。姐姐妹妹卻懂事得很，從不和我爭。

    但是我的飯量很小，吃了兩塊就吃不下去了。

    然後，我就開始胡鬧，總還要揀兩塊，放到嘴裡嚼兩下，再吐到碟子裡。

    我嚼過了的，姐姐妹妹哪還肯吃啊！為了不浪費，母親只好自己吃。

    為這事母親沒少批評我，但是一點作用都沒有。好在我別的方面表現都很好，日子久了，母親就隨我了。小孩子嘛，哪有不頑皮的呢？

    可是有一次，母親真的生氣了，並狠狠地教訓了我一頓。

    那一次，母親兩個月沒發工資了，好不容易從娘家弄來了一些錢，買了幾隻雞腿，燒得金黃噴香。

    菜剛上桌，我就小猴似的爬上桌，一邊用手抓起一隻雞腿啃，一邊衝著姐姐妹妹做鬼臉。一不小心，手一滑，雞腿掉地上了，沾滿了塵土，落在了一攤雞屎旁邊。

    母親又是生氣又是心疼，買這幾隻雞腿容易嗎？再想想我平時的頑皮表現，母親取過一根桑樹條，狠狠地抽了我十幾下：「讓你頑皮，讓你不知珍惜！」

    直到姐姐妹妹撲過來把我護在身體下面，母親才放下桑樹條，摟著我們 3 個抱頭痛哭。

    哭了好一會兒，才開始吃飯。母親把雞腿撿了起來，用開水沖洗一下，捨不得扔，自己吃了。

    那天晚上，母親撫著我身上的傷痕：

    「還疼嗎？」

    「不疼了。」

    「下次還調皮嗎？」

    黑暗中，我眨著亮晶晶的眼睛，並「嘻嘻」地笑著：「睡吧，媽，明天我還要上課呢！」

    2001 年，我和母親作客鳳凰衛視時，又說起了這件往事。「是的，那時他可真頑皮啊！全不知道，這飯菜來得多不容易，一點也不珍惜。」母親笑容慈祥。

    「不，媽媽，我懂得珍惜。」

    我接過話說，聲音開始哽咽：「您想想，我要不是把雞腿弄到地上，您會捨得吃嗎？那幾年裡，有什麼好吃的，您全給了我們姐弟，您成天就吃鹹菜啊！於是我們才想出這辦法，我把幾塊肉嚼得不像樣後，我們就有藉口不吃了。只有這樣，您才會吃啊！」

    聽著這話，母親情緒變得激動起來：「其實，我早該想到。你樣樣乖巧懂事，怎麼偏偏吃飯這麼頑皮呢？」

    母親哽咽著掏出手絹擦眼睛。我掛著兩行淚水滿面微笑。

    在億萬觀眾的電視面前，我們母子抱在了一起。無數的觀眾也在這一刻，流下淚來。

    雖然我演戲無數，但是我要說，我最好的戲，是在 7 歲那年，演繹的是一份血濃於水骨肉連心的摯愛親情，唯一的觀眾，是我的母親。'
  lesson_raw:
    title: 紙船印象
    basis: 題目提及篇名「我最好的一場戲」、「紙船印象」
