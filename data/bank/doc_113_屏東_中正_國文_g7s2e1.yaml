  - label: C
    content: 他們看似自由，卻身陷囹圄
  - label: D
    content: 這些美妙的叫賣聲，活潑、快樂地在每日生活的舞臺裡翻滾跳躍。
  lesson_raw:
    title: 聲音鐘
    basis: 題目提及課名「聲音鐘」
