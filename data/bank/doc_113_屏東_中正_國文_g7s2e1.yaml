- id: doc_113_屏東_中正_國文_g7s2e1_s4_5
  section: 4
  number: 5
  type: single
  page: 5
  stem: 根據本文，關於畫線處所象徵的意義，下列說明何者最不恰當？
  options:
  - label: A
    content: 甲句中「每一個坑洞」：人生不同的挑戰
  - label: B
    content: 乙句中「方正的直角」：作者獨特的個性
  - label: C
    content: 丙句中「紙」：作者自己的本質
  - label: D
    content: 丁句中「蟑螂」：卑鄙惡劣的個人特質。
  group_stem: '摺紙必須精準，切忌反覆翻弄，將紙摺磨得失去挺度。若紙起皺，邊線就會失去俐落的線條，摺出來的物件都會像失了精神般的軟癱。

    小學時認識了一位大哥哥，手極巧，曾摺了一隻立體獨角仙給我。它有著厚實而層疊的腹部，擎起的獨角末端還如鹿角分岔。我珍藏多年，直至年長搬家方不知去向。

    我從未能重現這隻獨角仙，人生也不若它的摺線一般乾淨俐落。【甲】我反覆把自己摺成不同的生物，試圖符合人生為我準備的每一個坑洞。

    【乙】一群圓滑形狀的人們聚在一起談天，我小心翼翼斂起方正的直角，化為類似的圓體，悄悄滾近。另外也會遇上有稜有角的人們，我則對摺自己，讓角度更加突出。然而時間一長便洩了底，他們看穿，他們草草應付，藉機散去，剩下我獨自揣摩下次該變成哪種樣子。【丙】幾次把紙弄得殘破不堪後，勉強找到約略符合自己形狀的角落，適應下來了。

    但當我決定把自己送往另一個城市，困惑又悄悄蔓延。以往公司宣告「我們要的是稀有動物」，因此我們的生活宗旨是特立獨行、轟轟烈烈。但向新單位報到的第一天，主管卻說：「這是一個叢林！那些需要特殊照顧與環境才能生存的稀有動物，比如說大象、孔雀，在這裡是無法生存的！【丁】我們需要的是蟑螂、是老鼠！」雖然明白他的誇飾，但還是受到了極大的震撼。

    我又慌張了，這次，我應該把自己摺成什麼呢？

    （改寫自謝子凡 摺疊人生）'
