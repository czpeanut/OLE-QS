  stem: 小文在網路上看到一則資料內容提到：斯普魯伊爾教授評論道：「總統和其他許多政界人士看到同意給予婦女投票權的州日益增多，並有最終通過憲法修正案的趨勢。於是，他們開始思考這樣一個問題：一旦婦女得到投票權，反對這個運動會對自己的政治生涯產生什麼影響？因此，很多共和黨人和民主黨人開始加入支持婦女投票權的行列。」，請問文中的現象最可能出現在何時？
