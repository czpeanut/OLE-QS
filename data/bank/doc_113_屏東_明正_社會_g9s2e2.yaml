  stem: 上文中關於美國政壇支持古巴的言論，最可能援引下列何者的概念？
  options:
  - label: A
    content: 孤立主義
  - label: B
    content: 民族自決
  - label: C
    content: 門羅宣言
  - label: D
    content: 啟蒙思想。
  group_stem: '20 世紀時，有人將萊姆酒和源於美國的可樂調成「自由古巴」，此調酒的命名，象徵美國支持 19 世紀古巴的獨立運動。

    當時美國政壇針對古巴的獨立運動曾做出評論：「關於任何歐洲國家對美洲的入侵，美國有權進行干預，使歐洲勢力撤離。西班牙政府正失去對古巴的控制，且無力保護當地美國公民的生命與財產，因此美國政府應介入使當地恢復和平，並確保古巴獲得獨立。」'
