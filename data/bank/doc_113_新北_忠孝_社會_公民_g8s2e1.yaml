questions:
- id: doc_113_新北_忠孝_社會_公民_g8s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 《民法》是一部規定私人間日常生活上權利義務相關的法律，其規範內容大致可分為身分關係與財產關係兩種領域。下列何項屬於身分上的權利義務關係？
  options:
  - label: A
    content: 繼承長輩的遺產
  - label: B
    content: 民眾向銀行借款
  - label: C
    content: 二手車的買賣
  - label: D
    content: 房客向房東租屋
- id: doc_113_新北_忠孝_社會_公民_g8s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 就讀八年級的小城開車門時，沒注意到後方來車，導致機車騎士摔車受傷，有關其行為衍生的法律責任問題，下列敘述何項正確？
  options:
  - label: A
    content: 小城非故意，因此不須負責
  - label: B
    content: 小城涉及侵權行為，但因未成年不用負責
  - label: C
    content: 小城涉及債務不履行，騎士可要求解除契約
  - label: D
    content: 小城的損害賠償責任，由法定代理人連帶負責
- id: doc_113_新北_忠孝_社會_公民_g8s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 知名蛋糕店將冷凍超過一星期的蛋糕，當成現做蛋糕販售給不知情的顧客，引發輿論撻伐。請問：上述商家的作法已經違反下列何項原則？
  options:
  - label: A
    content: 契約自由原則
  - label: B
    content: 誠實信用原則
  - label: C
    content: 消滅時效
  - label: D
    content: 權利濫用禁止原則
- id: doc_113_新北_忠孝_社會_公民_g8s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 依照附圖情境判斷，屋主的要求已違反下列何項原則？
  options:
  - label: A
    content: 契約自由原則
  - label: B
    content: 誠實信用原則
  - label: C
    content: 消滅時效
  - label: D
    content: 權利濫用禁止原則
  assets:
  - key: s1_4_f1
    kind: figure
    file: doc_113_新北_忠孝_社會_公民_g8s2e1/s1_4_f1.png
- id: doc_113_新北_忠孝_社會_公民_g8s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 契約的成立有一定條件。請問：下列關於契約的說明何項正確？
  options:
  - label: A
    content: 如果只是口頭承諾，不構成契約
  - label: B
    content: 離婚除了要有書面契約外，也需要登記才屬有效
  - label: C
    content: 簽訂書面契約時，只有蓋章才具有效力，不能以簽名替代
  - label: D
    content: 借貸關係中，只有產生銀行對民眾的權利關係，及民眾對銀行的義務關係
- id: doc_113_新北_忠孝_社會_公民_g8s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 有關訴訟上的和解，下列敘述何項正確？
  options:
  - label: A
    content: 其效力等同於私下和解
  - label: B
    content: 其效力不同於法院確定判決
  - label: C
    content: 當事人在和解委員前達成和解而終止訴訟
  - label: D
    content: 若當事人反悔，另一方可向法院聲請強制執行
- id: doc_113_新北_忠孝_社會_公民_g8s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 花媽 最近與人發生糾紛，雙方決定以調解的方式解決紛爭。請問：下列關於調解的敘述何項正確？
  options:
  - label: A
    content: 被視作是正義的最後一道防線
  - label: B
    content: 若不成立，亦不可再提出訴訟
  - label: C
    content: 成立後，效力等同於法院判決
  - label: D
    content: 雙方須自行委任律師以利進行
- id: doc_113_新北_忠孝_社會_公民_g8s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 如果私下和解與調解都無法解決糾紛，可以尋求民事訴訟來解決紛爭。請問：下列關於民事訴訟的說明何項正確？
  options:
  - label: A
    content: 雙方必須委託律師
  - label: B
    content: 是解決民事糾紛最後的手段
  - label: C
    content: 如果有一方不接受判決結果，則無效
  - label: D
    content: 檢察官可以主動提出訴訟，協助被害人
- id: doc_113_新北_忠孝_社會_公民_g8s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 小誼 的媽媽最近向法院聲請通過小誼爸爸的監護宣告，並成為小誼爸爸的監護人。請問：下列關於小誼爸爸的行為能力之說明何項正確？
  options:
  - label: A
    content: 接受他人贈與的禮物為有效之行為
  - label: B
    content: 他可以自己去買早餐且屬有效之行為
  - label: C
    content: 其行為皆需由小誼媽媽代為處理才算有效
  - label: D
    content: 只要小誼媽媽事後承認就屬有效之行為
- id: doc_113_新北_忠孝_社會_公民_g8s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 根據報導，某大學社團向餐廳訂了一桌菜，但到了訂位時間，人卻沒有出現。老闆娘將此事發表在網路上，網友紛紛為老闆娘抱不平，事後該社團社長也出面向老闆娘道歉並賠償損失。請問：下列敘述何項正確？
  options:
  - label: A
    content: 屬於負起債務不履行的責任
  - label: B
    content: 屬於負起侵權行為的責任
  - label: C
    content: 事先訂餐而未到屬道義責任，不須賠償
  - label: D
    content: 民事賠償以金錢賠償為原則
- id: doc_113_新北_忠孝_社會_公民_g8s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 下文是八年級學生惠惠的日常生活紀錄，請判斷她所做的行為，何項是需要經過父母的同意，才具法律效力？
  options:
  - label: A
    content: 買普遍級的電影票
  - label: B
    content: 購買公民科複習講義
  - label: C
    content: 收到同學送的生日禮物
  - label: D
    content: 簽訂手機上網吃到飽的契約
- id: doc_113_新北_忠孝_社會_公民_g8s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 民眾在某家知名遊樂場遊玩，遭到遊樂器材割傷，遊樂場業者表示願意負擔所有的醫療費用，之後並與受傷民眾簽訂和解契約。請問：關於該和解契約的說明，下列何項正確？
  options:
  - label: A
    content: 契約為雙方同意簽訂，效力與法院判決相同
  - label: B
    content: 受傷民眾若反悔，可再提起訴訟
  - label: C
    content: 簽訂時，應向當地鄉、鎮、市、區公所聲請
  - label: D
    content: 必須先提起訴訟，然後於法官面前達成和解
- id: doc_113_新北_忠孝_社會_公民_g8s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: '下文是某則新聞報導：

    小斌將限量款高級自行車借給17 歲的阿德騎去環島，阿德卻不慎將車撞毀，所幸沒有波及他人，事後雙方自行簽訂高額賠償契約。不過阿德的父母得知後反對這份契約，於是阿德反悔不願依約賠償，小斌因此告上法院要求阿德履行契約，但法官以該契約無效為由，判決小斌敗訴。

    請問：關於上述報導內容，下列哪一項推論最合理？'
  options:
  - label: A
    content: 二人簽訂的契約因為違反公共秩序而無效
  - label: B
    content: 阿德應負的法律責任與遭警察開罰單相同
  - label: C
    content: 小斌敗訴的原因是阿德為限制行為能力人
  - label: D
    content: 小斌不服判決可以再向調解委員會聲請調解
- id: doc_113_新北_忠孝_社會_公民_g8s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: 新聞報導：邱姓消費者在社群網站發文聲稱某楊姓男子經營黑心小吃店，因為他前往用餐時吃到小昆蟲，返家後覺得身體不適，所以公布小吃店店名，希望大家小心無良商家。此舉引發大批民眾關注，店內生意一落千丈。隨後有網友要求邱姓消費者提出證據，此時他才坦承他從未到過該小吃店用餐，他只是開個小玩笑，並向楊男致歉。請問：關於上文出現的民事糾紛，下列分析何項正確？
  options:
  - label: A
    content: 楊姓男子的權利已受到對方損害
  - label: B
    content: 兩人之間的糾紛屬於債務不履行
  - label: C
    content: 雙方當事人均有履行契約的義務
  - label: D
    content: 邱姓消費者未與對方建立契約，故不須賠償
