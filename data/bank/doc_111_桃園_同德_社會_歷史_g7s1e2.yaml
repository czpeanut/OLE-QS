  stem: 18 世紀《地方志》中有這樣的記載：「臺灣一種無宅無妻子，不士不農，不工不賣，不負載道路，俗指謂羅漢腳。嫖賭摸竊，械鬥樹旗，靡所不為。謂其單身遊食四方，隨處結黨；且衫褲不全，赤腳終生也。」當時臺灣會出現上述的情況，與下列政府實施的哪個政策最為相關？
  options:
  - label: A
    content: 海禁政策
  - label: B
    content: 劃界封山
  - label: C
    content: 化番為民
  - label: D
    content: 渡臺禁令。
