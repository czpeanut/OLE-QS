  stem: '臺灣竹枝詞是一種文類，在傳統臺灣文學當中多以風土詩的內涵呈現。形式上為七言體的韻文，內容上則以歌詠臺灣的地方風光、習俗為主，請問下列兩首竹枝詞描述的海岸分別為哪兩種？

    「鹿港風沙聞名久，冬日偷閒試一臨。十月風沙飛不入，九天霜雪動難侵。」

    「鐵板沙連到七鯤，鯤身激浪海天昏。任教巨舶難輕犯，天險生成鹿耳門。」'
