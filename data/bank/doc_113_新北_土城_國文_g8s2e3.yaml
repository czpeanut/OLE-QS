- id: doc_113_新北_土城_國文_g8s2e3_s2_31
  section: 2
  number: 31
  type: single
  page: 2
  stem: 根據本文，下列對於ADHD 者的敘述，並未提及？
  options:
  - label: A
    content: 學者把ADHD 者叫做有愛迪生基因者
  - label: B
    content: 不宜以異類眼光看待ADHD 者
  - label: C
    content: ADHD 者擁有思想跳躍、容易分心等特徵
  - label: D
    content: 缺乏打獵機會是現代ADHD 者的悲哀。
  group_stem: '有些科學家提出「獵人與農夫」的理論，認為ADHD者（注意力缺失的過動兒）其實沒有毛病，只是生錯了時空。現在所謂注意力缺失者的特徵—容易分心、衝動、冒險性強，其實是遠古打獵採集時生存必要的特徵。當人類進化到農業社會以後，這些特徵才變得格格不入。也就是說，他們是「獵人」，但是要在「農夫」的社會裡討生活，往往會被視為異類。

    這個理論認為，一萬二千年前，人類走向農業生活開始定居下來後，環境的改變使得過去的長處變成現在的短處。在遠古時代，如果不眼觀四面，耳聽八方，早就被其他動物吃掉了，不可能成為我們的祖先；如果事情發生不馬上採取行動，而是三思而後行的話，也只能變成別人的晚餐，活不到成為我們的祖先。而現在學者又把ADHD
    者叫做有愛迪生基因者，他們的特徵是：思想跳躍、容易分心、精力旺盛、沒有條理、不耐煩、易衝動、很外向、敢冒險、會發明、有創造力，而且通常還有領袖魅力。

    他們注意力很短暫，但對感興趣的事物可以專注很久，這不是和獵人要一直不停搜索四周，一旦發現獵物就馬上集中注意力然後追蹤下去相同嗎？他們組織力不強，沒有條理，很衝動，想到什麼做什麼—獵人不就是看到獵物得馬上拔腿就追嗎？他們沒有時間觀念，不知道做一件事需要花多少時間—這其實是表示有彈性，一個人的心意如果隨時可變，那就不需要知道時間。他們容易不耐煩，不能聽從老師的指示—這其實是獵人獨立行事的特性。

    上述的理論與觀點尚待可靠證據支持，但如果我們願意換一個角度來看ADHD 者，他們可能並沒有毛病，只是現在教育制度的限制，未必符合他們的天性罷了。

    （改寫自洪蘭 理應外合 獵人與農夫）106.會考修'
