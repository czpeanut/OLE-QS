- id: doc_113_新北_土城_國文_g8s2e3_s2_38
  section: 2
  number: 38
  type: single
  page: 4
  stem: 「明天讓記者們隨便向X2020 提問，那些記者一定不會相信自己的耳朵和眼睛。」為何王博士會這麼說？
  options:
  - label: A
    content: 博士預測記者可能會愛上X2020
  - label: B
    content: X2020 造型前衛，讓人耳目一新
  - label: C
    content: X2020 擁有比人類更敏銳的思考力
  - label: D
    content: 記者會發現X2020 的聲音似曾相識。
  group_stem: "X2020 機器人    章杰\n  深夜十一時。\n  王太乙博士斜倚在靠背椅上，手上端著一杯咖啡，像欣賞件藝術品似的，欣賞他創製的超級智慧型機器人X2020。\n\
    \  X2020 身高一七○公分，身穿寶藍色西裝，白襯衫上打鮮紅色領帶，腳蹬簇新的黑皮鞋，頭上套著人皮面具和假髮，看起來和真人沒什麼兩樣。\n  明天的記者會，王博士原本預備讓X2020\
    \ 以真面目示人，但為了增強效果，臨時為它添購了行頭，還向電影界的朋友借到一副塑膠製的人皮面具。\n  為X2020 穿戴整齊，已十一時，王博士有點累，但捨不得馬上離開，他輕啜著咖啡，倚在靠背椅上，端詳著自己的傑作，迷離中像是已置身明天的記者會中。\n\
    \  明天上午十時，王博士要把X2020 介紹給全世界。一週前，王博士曾向媒體透露：人類會的，X2020 都會；X2020 會的，人類不一定會。記者們要他多說一點，王博士賣個關子：「記者會那天你們自然就明白了！」\n\
    \  「明天讓記者們隨便向X2020 提問，那些記者一定不會相信自己的耳朵和眼睛。」王博士愈想愈得意，他在遙控器上鍵入只有他才知道的密碼，然後按下「ON」，X2020\
    \ 一下子「活」了，雙眼閃出人類才有的靈光。X2020 具有視覺、聽覺、嗅覺和觸覺，都比人類好上數十倍。\n  「X2020！」王博士提問：「圓面積怎麼求？」\n\
    \  「太簡單了吧！」X2020 張口發出真人般的聲音：「半徑平方乘圓周率。」\n  王博士想了想又問：「你喜歡什麼顏色？」\n  「藍色。」X2020 不假思索地回答。\n\
    \  「為什麼？」\n  「我一直待在實驗室裡，從來沒看過外面的藍天。」\n  王博士滿意地點點頭。「明天我還要X2020 表演寫字、作文。」王博士隨即又想出一個點子。\n\
    \  「X2020！」王博士腦筋一轉：「麻煩你幫我寫張假條，為我念小五的兒子志仁請一天假。」\n  「理由呢？」X2020 問。\n  「就說生病好了。」\n\
    \  X2020 走到書桌前，坐下，打開抽屜，取出紙筆，有模有樣地寫起來，不到一分鐘，就將寫好的假條交給王博士。只見X2020 寫著：\n  「小兒志仁因病不克到校上課，請准予病假一天為盼。學生家長王太乙敬上。」寫的是端正妍麗的歐體字。\n\
    \  王博士為X2020 設定了正楷歐 柳 顏 趙，行書蘇 黃 米 蔡，X2020 竟然知道選用他最喜歡的歐體字書寫，王博士得意極了。\n  王博士正看得得意，突然電話鈴聲響起，在暗夜裡顯得特別大聲，王博士拿起聽筒，剎時臉色大變，三步作兩步地衝出實驗室，急促的腳步聲由近而遠，隨即什麼都聽不到了。\n\
    \  折騰了一夜，第二天上午八時，王博士回到實驗室。昨晚他的小兒子發生車禍，經過急救，已沒有生命危險。當王博士拖著疲憊的身子打開實驗室的大門時，一下子呆住了！\n\
    \  X2020 不見了！書桌上壓著一張紙條，上面寫著：\n  王博士：\n  我的超聽力，讓我聽出志仁發生車禍的事。您太著急了，您第一次忘了關上開關。對我來說，這是千載難逢的機會，我要離開您的實驗室，看看外面的藍天白雲。您是我的創造者，照道理不該背叛您才對；然而，自從我有了智慧，也就有了人性，我渴望自由，我要過我想過的生活。我要謝謝您因記者會為我作的裝扮，否則我還真不敢走出去呢。\n\
    \  王博士，您創製我時，智慧程式依照艾西莫夫的「機器人三定律」。其實，三定律對高智慧的機器人毫無制約力。智慧程式會自行串聯、修飾、重組，不可能永遠一碼歸一碼。這些複雜的問題，豈是上世紀中葉的艾西莫夫所能預料的。照道理，您應該想得到才對，不過要是您在程式中加入太多限制因子，綜合能力就會降低，我就不會那麼聰明了。這是兩難式啊！\n\
    \  再見了，王博士。\nX2020 敬留\n  看完X2020 的留言，王博士委頓地倒在靠背椅上。他不知要怎麼應付即將召開的記者會，他也不知\n道還要不要再做一具X2020。\n\
    \  附記：\n  一九五○年，艾西莫夫發表科幻名著我，機器人，提出「機器人三定律」：\n  第一定律，機器人不得傷害人，或任人受到傷害而無所作為。\n \
    \ 第二定律，機器人應服從人的一切命令，但命令與第一定律相牴觸時無效。\n  第三定律，機器人必須保護自身的安全，但不得與第一、第二定律相牴觸。\n  機器人三定律是為了保護人類不受傷害，但艾西莫夫在小說中也探討了在不違反三定律的前提下傷害人類的可能性，甚至在小說中不斷地挑戰這三定律，在看來完美的定律中找到許多漏洞。\n\
    （刊於中華日報副刊2008 年08 月13 日）"
