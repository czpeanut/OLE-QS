- id: doc_113_新北_土城_國文_g8s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 戴爾．卡內基小時非常調皮，幾次險被學校開除。一日，父親把他介紹給他的新繼母：「他是全鎮最調皮的男孩，妳可要小心些。」意想不到的是，繼母的回話叫他眼睛溼潤，心裡感動，從此專心學習，成為世界行銷學大師。以下選項內容，何者最可能是繼母的回話？
  options:
  - label: A
    content: 他的調皮起因於缺乏母愛，我和你都有責任必須好好地管教他
  - label: B
    content: 他不調皮，而是最聰明的孩子，只是還沒找到發洩熱情的地方
  - label: C
    content: 他何止調皮，我早聽說他的失當行為，不用你說，我一定會小心
  - label: D
    content: 他不調皮，他是全鎮最乖的孩子，你沒看到學校都要開除他。
