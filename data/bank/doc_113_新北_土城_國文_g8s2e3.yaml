- id: doc_113_新北_土城_國文_g8s2e3_s1_17
  section: 1
  number: 17
  type: single
  page: 1
  stem: 根據孟子所說：「君子有三樂，而王天下不與存焉。」下列何者不是孟子所說的「三樂」之一？
  options:
  - label: A
    content: 父母雙全，兄弟平安
  - label: B
    content: 仰不愧於天，俯不怍於人
  - label: C
    content: 得天下英才而教育之
  - label: D
    content: 擁有至高的王權治理天下。
- id: doc_113_新北_土城_國文_g8s2e3_s1_18
  section: 1
  number: 18
  type: single
  page: 1
  stem: 根據孟子所說：「魚，我所欲也；熊掌，亦我所欲也……舍生而取義者也。」下列哪項最能正確說明這段話的意義？
  options:
  - label: A
    content: 人應該設法同時追求多種想要的東西
  - label: B
    content: 生命最可貴，不應輕易犧牲
  - label: C
    content: 當道德與生命不能並存時，應選擇道德
  - label: D
    content: 享受美食是人生最基本的快樂。
