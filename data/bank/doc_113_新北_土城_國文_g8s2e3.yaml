- id: doc_113_新北_土城_國文_g8s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 「飛魚是達悟族的最愛，每年二、三月便開始以船隊集體捕魚，接著再開放個體戶加入。三千戶的達悟族人，每戶約消耗一千條飛魚。隨著黑潮北上的飛魚群，年年充裕供養了不貪多的達悟人。但近年來因為漢人加入瓜分資源，用效率較高的流刺網和定置網大量捕捉飛魚，又用草蓆在外海誘使飛魚產卵以供人食用，導致飛魚數量連年遞減。所以現在達悟人每戶只能享用到一百條了。」由上述內容判斷，此文所欲探討的主題最可能為何？
  options:
  - label: A
    content: 漁源衰竭的原因
  - label: B
    content: 漁撈技術的進步
  - label: C
    content: 傳統習俗的式微
  - label: D
    content: 原住民族祭典的時程。
- id: doc_113_新北_土城_國文_g8s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 「天一樣長的霞火燒著橘色／是遠方有人在喊你／在遠方喊你的回聲嗎？／晚飯的時候了，討海人／荒涼而顛簸的水路，何處／才是你順風的回程？／一條小漁船的胸脯／要承受滿海滾滾的浪頭／向黑潮的深處去索討／一網又一網的生鮮活跳／—若是網重而魚多／滿艙的豐收該慶賀，為你／若是網輕呢，唉，也該慶幸／又逃過了一劫，為魚」（余光中討海人）關於本詩的說明，下列何者錯誤？
  options:
  - label: A
    content: 詩中傳達出討海人捕魚的艱辛以及孤獨
  - label: B
    content: 詩人對於討海人能逃過一劫也感到慶幸
  - label: C
    content: 由詩中可看出作者具有悲天憫人的胸懷
  - label: D
    content: 漁民滿載而歸，是詩人為其慶賀的原因。
