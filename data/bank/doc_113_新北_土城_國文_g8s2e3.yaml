  section: 1
  number: 8
  type: single
  page: 1
  stem: 老師請同學上臺報告有關三國演義的介紹，但竟只有一位同學的報告內容正確，請問是誰呢？
  options:
  - label: A
    content: 以真：這是一部描述東漢末年，以曹魏為正統的歷史章回小說
  - label: B
    content: 玲玲：所謂「七分事實，三分虛構」，「空城計」的故事屬前者
  - label: C
    content: 文豪：作者是羅貫中，文中重要的人物有曹操、孫權、劉邦等
  - label: D
    content: 家慶：全名三國志通俗演義，根據正史三國志改編、渲染而成。
