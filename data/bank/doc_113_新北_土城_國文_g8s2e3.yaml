  stem: '子胥出逃，邊候①得之。子胥曰：「上索我者，以我有美珠也。今我已亡之矣，我將謂子取而吞之。」

    根據這段文字，下列敘述何者正確？（註：①邊候：邊吏。）(107 會考)'
  options:
  - label: A
    content: 子胥用言語威脅邊候以求自保
  - label: B
    content: 子胥以美珠賄賂邊候換取自由
  - label: C
    content: 邊候侵吞子胥的美珠又誣陷他
  - label: D
    content: 邊候相信子胥的清白而釋放他。
- id: doc_113_新北_土城_國文_g8s2e3_s1_24
  section: 1
  number: 24
  type: single
  page: 2
  stem: 「君子不以口譽人，則民盡忠勸善。故君子問人之寒則衣之，問人之飢則食之，稱人之美則爵之。」由這段話可知，為政者對待人民的原則應是下列何者？（注：爵：予以官位。）(108
    會考)
  options:
  - label: A
    content: 循循善誘的教化
  - label: B
    content: 公平公正的賞罰
  - label: C
    content: 無微不至的關懷
  - label: D
    content: 具體實惠的行動。
- id: doc_113_新北_土城_國文_g8s2e3_s2_25
