- id: doc_113_新北_土城_國文_g8s2e3_s2_29
  section: 2
  number: 29
  type: single
  page: 2
  stem: 下列文句「 」中語詞的意義，何者說明為非？
  options:
  - label: A
    content: 吾自「結髮」，志立功名：初成年
  - label: B
    content: 「府君」不出，眾亦俱死耳：賈堅
  - label: C
    content: 今當為「卿曹」決鬥：你們
  - label: D
    content: 堅立馬橋上，「左右」射之：隨從。
  group_stem: '燕 泰山太守賈堅屯山茌，荀羨引兵擊之，堅所將才七百餘人，羨兵十倍於堅。堅將出戰，諸將皆曰：「眾少，不如固守。」堅曰：「固守亦不能免，不如戰也。」遂出戰，身先士卒，殺羨兵千餘人，復還入城。羨進攻之，堅嘆曰：「吾自結髮，志立功名，而每值窮阨，豈非命乎！與其屈辱而生，不若守節而死。」乃謂將士曰：「今危困，計無所設，卿等可去，吾將止死。」將士皆泣曰：「府君不出，眾亦俱死耳。」堅曰：「今當為卿曹決鬥，若勢不能支，卿等可去，勿復顧我也！」乃開門直出。羨兵四集，堅立馬橋上，左右射之，皆應弦而倒。羨兵眾多，從塹下斫橋，堅人馬俱陷，生擒之，遂拔山茌。

    （改寫自資治通鑑）(104.會考修)'
