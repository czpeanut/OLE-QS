  group_stem: "五、陳永興〈馬偕傳〉\n\n  馬偕，1844 年出生於加拿大，多倫多大學神學院畢業。奉派選擇來臺宣教，在淡水落腳，租屋設禮拜堂並教授經書。雖常有民眾誹謗破壞與清兵惡意攪擾情事發生，仍不以為苦，一貫以刻苦耐勞、膽識過人、博愛為懷的精神開拓臺灣北部教區。馬偕不是醫師，但略具醫療常識，在傳教之餘常為貧民治病，經居民之口耳相傳，求醫病患日眾，於是在淡水另行租屋設偕醫館，對於改善飽受瘧疾與地方病肆虐的北臺灣多有貢獻。\n\
    \  馬偕在各地傳道行醫時發現臺灣當時尚無醫科學校，行醫者多是透過自己或他人經驗，或自行研習醫理、或長期從事調配藥方者。民眾有疾病時，大多採用偏方或借助宗教。他收集並研究中醫醫術與民俗療法，對地方疾病之觀察甚深，尤其是對瘧疾的治療研究有成。更令後人稱道的是馬偕的拔牙術，早期臺灣人深信齲齒是因蛀蟲作祟，有些江湖術士以驅除蛀齒蟲為業，詐取財物；或使用暴力、不當之器具拔除齲齒，導致顎骨斷裂或大量出血，嚴重者致死。1873\
    \ 年馬偕出外傳道時巧遇一群士兵，其中一人患齲齒痛，馬偕於是以一片堅木削成拔齒器的形狀，將齲齒拔除，解除其齒痛，令士兵感激莫名。獲此經驗後即委請鐵匠製造拔齒器，利用巡迴鄉村傳道之際為病患拔牙，據馬偕自述由1873\
    \ 年起共計拔除21,000 餘齒，其拔牙成就可見一斑。\n  免費提供瘧疾藥物、拔牙、醫療服務、唱聖詩是馬偕巡迴醫療服務與傳道的方式，他的巡迴醫療觸角不僅限於平地、也深入偏遠山區，他發現山地原住民一直過著原始落後的生活，醫療均仰賴巫醫，營養不良、傳染病是原住民主要死因，於是他不定期到山區為原住民做醫療服務，藉此與純樸的原住民建立友誼，第一座的山地教會就在平埔村誕生，之後陸續在噶瑪蘭平原興建19\
    \ 座教會，醫療與傳道因而在山地鄉中生根，藉由宗教使原住民獲得較佳的醫療照顧。\n  馬偕以臺灣為家，視臺灣人為至親，更娶臺灣女子張聰明為妻，所生子女皆習臺語，至死葬於淡水他所設立的牛津學堂旁，終生為北臺灣與偏遠山區原住民醫療帶來諸多貢獻。除此還設立神學院以及北臺灣第一所女子學校，在宗教、醫療與教育方面始終以鞠躬盡瘁的精神為臺灣人打拼。在馬偕自己生病，被教會送回加拿大治療時，仍念念不忘臺灣的親友和工作，他在日記中祈禱上帝，希望讓他能早日康復回到臺灣，繼續為臺灣的人民奉獻服務，臺灣才是他希望埋骨的鄉土，熱愛台灣的精神令人感動。1901\
    \ 年，馬偕因喉癌病逝，他真的從此埋骨於臺灣 淡水這塊他熱愛的大地，與臺灣人民永遠作伴。"
