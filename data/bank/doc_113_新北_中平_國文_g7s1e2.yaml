- id: doc_113_新北_中平_國文_g7s1e2_s5_13
  section: 5
  number: 13
  type: single
  page: 8
  stem: 根據甲文中桃園女理髮師的案例，受害者可能認為加害者屬於哪一種跟蹤騷擾行為而報警？
  options:
  - label: A
    content: 通訊騷擾
  - label: B
    content: 監視觀察
  - label: C
    content: 妨害名譽
  - label: D
    content: 尾隨接近。
  group_stem: '甲文（新聞）：

    　　《跟蹤騷擾防制法》（如下圖）上路滿2 年，但警方坦言跟騷案件成案困難，甚至有不少案件是金錢糾紛濫用《跟騷法》來包裝。

    　　前清大一名女學生遭陌生男子跟蹤、搭訕、攀談，讓女學生受到不小驚嚇，但事後警方表示，男子到派出所說明只是單純問路，並未觸法，僅告誡他不要再犯，此舉引發不少家長怒火。桃園也有女理髮師，不堪男顧客常在社群動態上回覆留言，甚至傳送私密訊息稱讚其生活態度，她報警提告違反《跟騷法》，但男子宣稱只是單純欣賞女理髮師正向的生活態度，並無任何愛意等，經警方調查確實無違規用詞，因此不成立。

    　　竹警方坦言主要是成案困難，即使監視器拍到，但對方辯稱自己往同一方向，或是純粹搭訕、問路就能解套，被害人要能舉證是連續多次以上的常態跟蹤，才能證明犯意。中壢警方不諱言，成案困難的原因在於警方須了解被害人提告的主要原因、動機等，並與嫌疑人確認其騷擾目的是否符合《跟騷法》規範。

    改寫自 《中國時報》〈舉證艱難 跟騷法成案數倒退嚕--連續多次常態跟蹤 且必須與性或性別有關〉

    乙文（《跟蹤騷擾防制法》部分內容）：

    第一條 為保護個人身心安全、行動自由、生活私密領域及資訊隱私，免於受到跟蹤騷擾行為侵擾，維護個人人格尊嚴，特制定本法。

    第三條

    1.本法所稱跟蹤騷擾行為，指以人員、車輛、工具、設備、電子通訊、網際網路或其他方法，對特定人反覆或持續為違反其意願且與性或性別有關之下列行為之一，使之心生畏怖，足以影響其日常生活或社會活動：

    一、監視、觀察、跟蹤或知悉特定人行蹤。

    二、以盯梢、守候、尾隨或其他類似方式接近特定人之住所、居所、學校、工作場所、經常出入或活動之場所。

    三、對特定人為警告、威脅、嘲弄、辱罵、歧視、仇恨、貶抑或其他相類之言語或動作。

    四、以電話、傳真、電子通訊、網際網路或其他設備，對特定人進行干擾。

    五、對特定人要求約會、聯絡或為其他追求行為。

    六、對特定人寄送、留置、展示或播送文字、圖畫、聲音、影像或其他物品。

    七、向特定人告知或出示有害其名譽之訊息或物品。

    八、濫用特定人資料或未經其同意，訂購貨品或服務。

    2.對特定人之配偶、直系血親、同居親屬或與特定人社會生活關係密切之人，以前項之方法反覆或持續為違反其意願而與性或性別無關之各款行為之一，使之心生畏怖，足以影響其日常生活或社會活動，亦為本法所稱跟蹤騷擾行為。'
