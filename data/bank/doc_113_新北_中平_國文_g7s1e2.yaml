  section: 4
  number: 18
  type: single
  page: 3
  stem: '「統整與比較」是做學問時較進階的一項技巧，也是將所學知識融會貫通的過程。〈背影〉一文藉由「背影」一再出現，勾勒出父親的形象與關愛，以凸顯主題。下表是丞勳所做的統整筆記，其中有一處做錯了，最可能是下列何者？


    | | 段落 | 場景 | 出現的時間點 | 表現手法 | 對作者的意義 |

    |---|---|---|---|---|---|

    | （Ａ）第一次 | 第一段 | 回憶裡難以忘懷的父親背影 | ☑現在 ☐過去 | ☑略寫 ☐詳寫 | 象徵父愛與對父親的懷念 |

    | （Ｂ）第二次 | 第六段 | 父親買橘子攀爬月臺的背影 | ☐現在 ☑過去 | ☐略寫 ☑詳寫 | 領會到父愛而感動落淚 |

    | （Ｃ）第三次 | 第六段 | 父親離開時混入人群的背影 | ☐現在 ☑過去 | ☐略寫 ☑詳寫 | 與父親總算要分別，喜極而泣 |

    | （Ｄ）第四次 | 第七段 | 讀信後，腦海裡所浮現父親的背影 | ☑現在 ☐過去 | ☑略寫 ☐詳寫 | 掛念父親，擔心他的身體 |'
