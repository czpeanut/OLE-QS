  type: single
  page: 3
  stem: 「死亡」在許多文化中都是一種忌諱，因此大家都盡量避免提及「死」這個字眼，甚至有些醫院、大樓會跳過「四樓」避諱與「死」字諧音。〈背影〉一文中，父親來信提及「大約大去之期不遠矣！」這句話中的「大去」一詞，即是「去世」的委婉說詞。下列詞語何者也是用來指死亡？
