- id: doc_113_新北_中平_國文_g7s1e2_s5_5
  section: 5
  number: 5
  type: single
  page: 5
  stem: 根據本文文句對應的修辭，下列何者有誤？
  options:
  - label: A
    content: 他們看似自由，卻心陷囹圄——映襯
  - label: B
    content: 比起我，到底誰更像是囚犯呢？——譬喻
  - label: C
    content: 我全身的關節都受到病魔的「轄制」——轉化
  - label: D
    content: 腿不能行，肩不能舉，手不能彎，頭也不能自由轉動——排比。
  group_stem: '在許多人眼裡，我看來多麼像是一個囚犯，一個被病禁錮在床的犯人。

    　　是的，自從小學六年級時，我被一種叫做「類風溼關節炎」的怪病纏身之後，就逐漸失去活動的自由。年復一年，我全身的關節都受到病魔的「轄制」，有如戴上一道道無形的鐐銬。

    　　腿不能行，肩不能舉，手不能彎，頭也不能自由轉動。甚至，我連吃一口心愛的牛肉乾的權利也被剝奪了，因為咬不動。

    　　二十多年來，生活的天地僅限於六席大的斗室之中，屋外春去秋來，花開花謝，似乎都與我無干了。就像一個被判無期徒刑的犯人，不知何年何月才能重見「天日」。

    　　想像中，這樣的「犯人」一定是蒼白憔悴、鬱鬱寡歡的吧！剛剛相反，因為我了解真正能夠囚住我的，不是身體上的疾病，而是心理上失望、悲觀、頹喪、憤怒、憂慮，築成了一面看不見的網，隨時準備將我陷在中間。一個人只要能突破心靈的枷鎖，這個世界就再也沒有什麼能困住他的了。如今，我活得無憂無慮，也自由自在。而世上多的是身體健康，卻心理不健全的人；多的是表面歡樂，卻心中痛苦的人；多的是行動自如，卻找不到一條正確人生方向的人。

    　　有些人看似生活得繁華熱鬧，卻往往是天底下最寂寞的人，因為他們把自己的心封閉了。

    　　還有那些沉溺在罪惡中無法自拔，迷戀在情慾中無法脫身，以及為名利權勢所左右迷失了自己的人，他們看似自由，卻心陷囹圄。

    　　比起我，到底誰更像是囚犯呢？

    杏林子（心囚〉'
