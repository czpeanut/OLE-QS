  - label: D
    content: 如入鮑魚之肆，久而不聞其臭。
  group_stem: "莊子與惠子遊於濠梁之上。莊子曰：「儵魚出遊從容，是魚樂也。」惠子曰：「子非魚，安知魚之樂？」莊子曰：「子非我，安知我不知魚之樂？」惠子曰：「我非子，固不知子矣；子固非魚也，子之不知魚之樂全矣。」莊子曰：「請循其本。子曰『汝安知魚樂』云者，既已知吾知之而問我，我知之濠上也。」\n\
    《莊子‧秋水》\n注釋：濠梁：河上的橋梁。儵（ㄔㄡˊ）魚：或稱「白鯈」，產於淡水，身體狹長，背淡黑色，腹白，鱗細。\n      安知：如何知道。  固：當然。"
