  stem: 某些詞彙在不同時空背景會有不同的用法，像是〈背影〉一文中的「腳夫」相當於現代的「搬運工」。解讀文言文時，亦如此，某些字詞意思古今有所不同。以下是品婕準備段考所做的國文筆記，因熬夜苦讀，精神狀況不佳下，只寫對了其中一個。下列何者古今詞義解析，何者正確？
