- id: doc_113_新北_中平_國文_g7s1e2_s5_9
  section: 5
  number: 9
  type: single
  page: 6
  stem: 根據本詩情境，關於貫穿全詩的「落葉」的解讀，下列何者正確？
  options:
  - label: A
    content: 作者堅定的決心
  - label: B
    content: 部落遺失的文化
  - label: C
    content: 族人無聲的努力
  - label: D
    content: 異族強勢的壓迫
  group_stem: "一我的心就像一片落葉 \n在春天還沒來到之前就已經 \n腐敗了\n\n二是的，朋友\n彩虹已從山谷出走\n山谷裡的大合唱\n也離開了部落\n\
    只剩下落葉般的記憶\n那些纏繞著百步蛇般的記憶\n在憤怒的血液中飄盪　沉沒\n一吋吋地　一吋吋地沉沒\n終於把我捲進罪罰的漩渦\n\n三族人的榮耀已從遙遠的傳說\n\
    出走，傳說中的土地精靈\n也已被漢人俘虜\n只剩下落葉般的嘆息\n那些交織著梔子花影的嘆息\n在哀傷的淚水中墜毀、散落\n一滴滴的，一滴滴的散落\n終於將我化成痛苦的漣漪\n\
    \n四我終於在黑暗中看見一條路\n一條原住民的命運之路\n路上佈滿落葉般的足印\n一印印蠻橫深踩的異族足印\n沿著不可知的未來和方向\n發出惴惴不安的輕響\n\
    \n五唉！朋友\n我的心就像一片落葉\n在春天還沒來到之前就已經\n腐敗了\n莫那能〈落葉〉"
