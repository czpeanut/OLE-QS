- id: doc_113_新北_中平_國文_g7s1e2_s4_8
  section: 4
  number: 8
  type: single
  page: 2
  stem: '（甲）今年八月，眾多莘莘學子首次踏入中平國中校門，心裡充滿期待與不安。（乙）經過一個月的相處，我與同學的感情愈來愈緊密，我們更時常共同一起打籃球。（丙）班上同學都格外十分重視大家的團隊榮譽，面對即將到來的校慶造型秀，絞盡腦汁發揮創意選定主題。（丁）段考結束後，一定要加緊腳步努力趕製道具與練習，為國中生活留下璀璨回憶。

    這段文字是秉睿聯絡簿生活札記的內容，何者沒有冗言贅字？'
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
  tags:
    textbook: 第一冊（七上）第2次段考範圍
    labeled_by: ai
    chapter:
      publisher: null
      book: 七上
      subject: 國文
      code: null
      title: null
      chapter: null
- id: doc_113_新北_中平_國文_g7s1e2_s4_9
  section: 4
  number: 9
  type: single
  page: 2
  stem: 〈背影〉一文末段父親來信提到：「我身體平安，惟膀子疼痛得厲害，舉箸提筆，諸多不便，大約大去之期不遠矣！」朱自清閱讀信後，可能會因此聯想到下列哪一句話，而流下男兒淚？
  options:
  - label: A
    content: 棒頭出孝子，箸頭出忤逆
  - label: B
    content: 雙手抱孩兒，才知父母時
  - label: C
    content: 身體髮膚，受之父母，不敢毀傷，孝之始也
  - label: D
    content: 世界上有兩件事不能等：一是孝順，二是行善。
