- id: doc_113_新北_中平_國文_g7s1e2_s4_4
  section: 4
  number: 4
  type: single
  page: 1
  stem: 昀晞收看電視晚間新聞時，看到以下幾則新聞，發現有許多詞語誤用的情形。請問下列新聞標題「」的詞語，何者使用正確？
  options:
  - label: A
    content: 「斷袖」決裂！「荳蔻」少女，校園手撕假面閨密
  - label: B
    content: 全民失戀！國民男友夜會「青梅竹馬」「剪燭西窗」
  - label: C
    content: 出遊好時機！「寸草春暉」——「解語花」開滿山頭
  - label: D
    content: 「匹夫之勇」！中年男子「七擒七縱」智擒偷拍狼。
