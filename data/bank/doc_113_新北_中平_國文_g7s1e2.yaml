- id: doc_113_新北_中平_國文_g7s1e2_s4_5
  section: 4
  number: 5
  type: single
  page: 1
  stem: 「酒醉駕車肇事的人是有心殺人嗎？偶爾試一次毒品，作為體驗生活方法的人是有心犯罪嗎？考試時受不住朋友請託而傳個紙條的是惡意犯規嗎？」作者連續提出三個問句，用意是要提醒兒子的教訓為何？
  options:
  - label: A
    content: 知錯能改，善莫大焉
  - label: B
    content: 前事不忘，後事之師
  - label: C
    content: 無心之舉，後果堪虞
  - label: D
    content: 及時行樂，勿留遺憾。
  tags:
    textbook: 七上 第二課 無心的錯誤
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 七上
      subject: 國文
      code: 第二課
      title: 無心的錯誤
      chapter: null
- id: doc_113_新北_中平_國文_g7s1e2_s4_6
  section: 4
  number: 6
  type: single
  page: 2
  stem: 說話或行文時帶有諷刺意味，或內心想表達的意思和字面意思相反的修辭法，稱為「倒反」。下列四人的對話，哪一位使用了倒反法？
  options:
  - label: A
    content: 靜香：「下週末，我要來開個人小提琴演奏會了，你們一定要來欣賞我美妙的琴音喔！」
  - label: B
    content: 大雄：「太棒了，身為靜香的頭號粉絲，我一定會到場支持！當天要穿什麼好呢？」
  - label: C
    content: 胖虎：「哇嗚！靜香的小提琴演奏會，一定會造成轟動的！可不可以也讓我上台唱歌呢？」
  - label: D
    content: 小夫：「靜香的小提琴加上胖虎的歌聲，真是人間天籟！我一定會戴耳塞從頭聽到尾的。」
  tags:
    textbook: 七上 第二課 無心的錯誤
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 七上
      subject: 國文
