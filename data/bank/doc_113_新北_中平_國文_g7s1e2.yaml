      chapter: null
- id: doc_113_新北_中平_國文_g7s1e2_s4_7
  section: 4
  number: 7
  type: single
  page: 2
  stem: 下列關於〈背影〉一文中的象徵意義，何者說明正確？
  options:
  - label: A
    content: 我最不能忘記的是他的「背影」——已逝的父愛
  - label: B
    content: 我將他給我做的「紫毛大衣」鋪好座位——父愛的溫暖
  - label: C
    content: 我看見他戴著「黑布小帽」——毫無保留的父愛
  - label: D
    content: 「將橘子一股腦兒放在我的皮大衣上」——父親慘淡的心情。
