  - label: D
    content: 持之有故，言之成理。
  group_stem: "有幾次因為媒體錯誤報導或污名化弱勢群體，和媒體主管有了見面溝通的機會。不曉得是不是「見面三分情」的緣故，媒體主管的溝通態度並不像面對讀者批評時，有著慣有的自信與高傲，他們總是客氣地表達誠意，當然，高層們即使再怎麼低聲下氣，也不會承認錯誤，更不會願意道歉，最多只會偷偷的告訴你，他們不是有意而是無心的。這種回應就好像作錯事小孩面對大人責難時的慣有說詞：我不是故意的！也許，媒體真的不是故意的，畢竟媒體勞動者的工作與時間是被大量壓縮，難免因為時間壓力不小心犯了錯。其實這些都無可厚非，誰不會出錯呢？重要的是面對錯誤的態度。\n\
    \    戲劇裡不同角色登場時總會有不同稱號、配件，甚至是音樂，這些外在的命名，往往標示著人物的特質與功能，強化角色的對比與故事張力，希望讓觀眾留下深刻感受，然而這種現象在新聞中經常可見。\n\
    \    事實上，媒體的「無心之過」不僅在某種程度反應了整個社會對「他者」的觀感與價值，另一方面也反應了媒體工作者往往只站在自己的專業象牙塔裡作，再加上我們無法接觸到世界上的所有事物，因此媒體的無心顯得更可怕。\n\
    改寫 台灣媒體觀察教育基金會董事長管中祥 〈無心更可怕〉"
