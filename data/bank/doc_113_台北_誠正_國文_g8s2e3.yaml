- id: doc_113_台北_誠正_國文_g8s2e3_s2_42
  section: 2
  number: 42
  type: single
  page: 4
  stem: 首段所謂「物稀為貴」是指下列何者？
  options:
  - label: A
    content: 懂得人情世故的人很少
  - label: B
    content: 會說話的人很少
  - label: C
    content: 真正的辯士、說客、文人很少
  - label: D
    content: 說過好話的人很少
  group_stem: '說話並不是一件容易事。天天說話，不見得就會說話；許多人說了一輩子話，沒有說好過幾句話。所謂「辯士的舌鋒」、「三寸不爛之舌」等讚詞，正是「物稀為貴」的證據。文人們講究「吐屬」，也是同樣的道理。我們並不想做辯士、說客、文人，但是人生不外言、動，除了動就只有言，所謂人情世故，一半兒是在說話裡。尚書裡說：「唯口，出好、興戎。」一句話的影響，有時是你料不到的，歷史和小說上有的是例子。

    說話即使不比作文難，也絕不比作文容易。有些人會說話不會作文，但也有些人會作文不會說話。說話像行雲流水般的自然，卻絕非一般文章所及——文章有能到這樣境界的，簡直當以說話論，不再是文章了。但是這是怎樣一個不易到的境界！

    中國人對於說話的態度，最高的是忘言，但如禪宗「教」人「將嘴掛在牆上」，也還是免不了說話。其次是慎言、寡言、訥於言。這三樣又有分別：慎言是小心說話，小心說話自然就少說話，少說話也就少出錯兒。寡言是說話少，是一種深沉或貞靜的性格或品德；訥於言是說不出話，是一種渾厚誠實的性格或品德。這兩種多半是生成的。第三是修辭或辭令。至誠的君子，人格的力量照澈一切的陰暗，用不著多說話，說話也無須乎修飾。但只知講究修飾，嘴邊天花亂墜，腹中矛戟森然，那是所謂小人，他太會修飾了，倒教人不信了，他的戲法總有讓人揭穿的一日。我們是介在兩者之間的平凡的人，沒有那偉大的魄力，可也不至於忘掉自己。只是不能無視世故人情，我們看時候、看地方、看人，在禮貌與趣味兩個條件之下，修飾我們的說話。這兒沒有力，只有機智；真正的力不是修飾所可得的。我們所能希望的只是：說得少，說得好。

    （節錄自朱自清說話）'
