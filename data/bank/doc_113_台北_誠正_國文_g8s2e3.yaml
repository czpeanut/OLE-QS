    content: 司馬懿：深謀遠慮，驚險勝出
  - label: D
    content: 諸葛亮：愛君愛民，奮勇殺敵
  group_stem: '(甲)

    通往西縣的官道上，司馬懿正在加速行軍，後面的軍隊跟著小跑。張郃騎在馬上問：「司馬將軍，你不取陽平關大城，衝著西縣那彈丸之地去做什麼啊？」司馬懿回答：「諸葛亮必定捨不下三郡百姓，會親自去掩護他們入蜀。」張郃驚喜道：「怪不得你說愛民如子是他的弱點，他扶老攜幼能走幾里？
    我們正好圍而誅之！諸葛亮也不怎麼聰明嘛！明知百姓是累贅，還要帶上他們。」司馬懿正色：「明知不可為而為之，我不能及啊！不如此，就不是諸葛亮了，快！」

    (乙)

    司馬懿聽到諸葛亮的琴聲，大吃一驚，此刻萬眾無聲，他不由自主策馬緩向前。諸葛亮手下的調子柔和如訴，他心聲似乎也融入琴聲：「亮留守西城，幸與將軍一會，將軍可否聽我一言？」司馬懿漸閉上眼睛，在琴聲中感受諸葛亮的心意，不禁在內心做出應答：「你愛民如子，愛君如子，卻不懼自己陷入險境嗎？我已看出城中無兵，你若被俘，又將蜀國交給何人呢？」兩人心意在琴聲中相互傾訴，琴聲也開始激昂起來。「亮孤身在此，非向將軍示弱求饒，乃是想與將軍一論魏國形勢。少主多疑，宗親嫉才，蜀國若平，鳥盡弓藏，隨之而來。自古功高震主者身危，將軍殺亮易如反掌，然而魏宮中羅網，恐已為將軍備下，有將軍陪葬，亮無憾矣——」
    隨著琴聲更加激烈，司馬懿驟然睜眼，他驚恐望著諸葛亮，額頭汗水，淋漓而下。此時司馬師、司馬昭和張郃都詫異看著司馬懿，張郃實在忍不住，驅馬過來問：「這到底進不進城啊？」
    此時琴聲已是鏗鏘崢嶸，似千軍萬馬廝殺，如刀槍齊鳴。司馬懿用力勒馬後退，馬立嘶鳴。張郃吃驚：「怎麼了？」司馬懿焦急道：「你還聽不出？琴中殺機大作，城中必有伏兵，撤！」

    (節選自大軍師司馬懿)'
