    content: 「孔明登城望之，果然塵土沖天，魏兵分兩路望西城縣殺來。」強調敵軍的威勢，但魏兵兩路進攻可推知其為烏合之眾
  - label: B
    content: 「孔明乃披鶴氅，戴綸巾，引二小童，攜琴一張，於城上敵樓前，凭欄而坐，焚香操琴。」寫孔明在樓高處觀探敵情，而其燒香彈琴是為了緩解小童的緊張情緒
  - label: C
    content: 「吾兵止有二千五百，若棄城而走，必不能遠遁。」說明採用空城計的原因為兵力懸殊，逃亡必敗
  - label: D
