  stem: 根據本文，下列文句中的「之」字，何者解釋正確？
  options:
  - label: A
    content: 坡傾囊僅能償「之」――邵民瞻
  - label: B
    content: 坡徙倚聽「之」――老嫗的哭聲
  - label: C
    content: 徐謂「之」曰――老嫗之子
  - label: D
    content: 對嫗焚「之」――房子
  group_stem: '邵①為坡買一宅，坡②傾囊僅能償之。卜③吉入新第。夜與邵步月，偶至一村落，聞婦人哭聲極哀。坡徙倚聽之，曰：「異哉，何其悲也！豈有大難割之愛，觸於其心歟？吾將問之。」遂與邵推扉而入。則一老嫗，見坡，泣自若。坡問其故，嫗曰：「吾家有一居，相傳百年，保守不敢動，以至於我。而吾子不肖，遂舉以售諸人。吾今日遷徙來此，百年舊居，一旦訣別，寧不痛心？此吾之所以泣也。」坡亦為之愴然。問其故居所在，則坡傾囊所得者也。坡因再三慰撫，徐謂之曰：「嫗之舊居，乃吾所售也，不必深悲，今當以是屋還嫗。」即命取屋券，對嫗焚之。呼其子，命翌日迎母還舊第，竟不索其值。

    (節錄自梁溪漫志)

    註釋：①邵：蘇東坡好友，邵民瞻。 ②坡：指蘇東坡。 ③卜：選擇。'
