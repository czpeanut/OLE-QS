  stem: 海岸線的變動屬於動態平衡，不同的因素會使得海岸線前進或後退。通常在河川侵蝕沖刷與泥沙堆積的一來一往作用下，長期以來大多能夠使海岸線處於平衡的狀態。然而，近年來臺灣的海岸線嚴重後退，連較堅硬岩岸也出現海岸退縮的情況。請問：導致海岸線後退、河川變短的因素，下列何者不正確？
