- id: doc_113_台北_誠正_社會_地理_g7s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 在地質年代中，只有幾百萬年歷史的臺灣島算是一個非常年輕的島嶼，面積不大但地質構造豐富。請問：臺灣的哪一個特徵最能說明臺灣是個年輕的島嶼？
  options:
  - label: A
    content: 西部平原廣大、河川眾多
  - label: B
    content: 多新褶曲山脈，高山林立
  - label: C
    content: 山脈多呈現南北走向
  - label: D
    content: 中央山脈為主要的河川分水嶺。
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 地理
      code: 3-3
      title: 臺灣地形的特徵與分布
      chapter: 第3章 地形
