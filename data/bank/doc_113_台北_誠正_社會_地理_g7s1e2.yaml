    labeled_by: ai
- id: doc_113_台北_誠正_社會_地理_g7s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 地形是地球的外在形貌，這個形貌同時受到地球內部與外部力量的作用。內營力是指來自地球內部的力量，外營力是指作用於地表的力量。請問：下列何者的作用力與其他三者不同？
  options:
  - label: A
    content: 安平港因泥沙淤積，導致離海愈來愈遠，失去港口的優勢
  - label: B
    content: 太魯閣因上游立霧溪侵蝕而形成壯麗峽谷
  - label: C
    content: 源自中央山脈入海的河流，在下游地區沖積成一塊肥沃平原
  - label: D
    content: 花蓮玉里大橋受板塊擠壓影響，橋面每年會長高2~3 公分。
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 地理
      code: 3-1
      title: 地形如何被形塑
      chapter: 第3章 地形
    textbook: 七上地理 3-1 地形如何被形塑
    labeled_by: ai
