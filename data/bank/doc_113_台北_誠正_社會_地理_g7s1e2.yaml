    content: 山上種植高麗菜，水土流失
  - label: B
    content: 海平面上升或是沿海地層下陷
  - label: C
    content: 極端氣候導致豪大雨對海岸侵蝕的力道變強
  - label: D
    content: 上游水庫的攔砂壩減少河川泥沙含量。
