- id: doc_113_台北_誠正_社會_地理_g7s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 為了協助大家了解地形分布，有許多地形的表現方法，等高線地形圖即為其中之一。請問：下列有關等高線地形圖的描述，下列何者不正確？
  options:
  - label: A
    content: 等高線為閉合曲線
  - label: B
    content: 同一條等高線上的各點海拔高度相同
  - label: C
    content: 等高線不可以交叉，也不可以重疊
  - label: D
    content: 等高線可表示地形的起伏與高度。
