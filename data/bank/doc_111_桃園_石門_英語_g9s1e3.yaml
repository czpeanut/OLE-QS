  group_stem: 'Lately in the world of Chinese pop (C-pop) music, a name has become
    famous. If you''re a fan of C-pop songs, you may be no stranger to his works.
    His name is Namewee.

    Born in Malaysia, Namewee fell in love with music at a very young age. In middle
    school, he wrote songs and played music with his friends. From then on, (42) .
    After leaving middle school, he came to Taiwan for college and started his music
    career there. He went through many difficult years before his song "Stranger in
    The North" became one of the most viewed Chinese songs on YouTube and won top
    prizes in several music contests in 2017.

    What makes “Stranger In The North” successful? (43) It is about a Chinese worker
    who moves to Beijing for a better life, but finds himself alone and poor in the
    end. The topic is close to people''s lives and can easily touch their hearts.
    What''s more, (44) , he is good at using tempo in his songs. Because of that,
    the beat of the music is very strong. Anyone who hears the song can remember it
    easily.

    Now, Namewee is getting more and more attention from the public. Lots of people
    are waiting for his future movies. He is truly a bright star in the C-pop world.


