  section: 2
  number: 45
  type: single
  page: 3
  stem: What might the greedy woman find when she opened one of her gourds?
  options:
  - label: A
    content: only snakes and frogs came out
  - label: B
    content: there were hundreds of gourd seeds inside
  - label: C
    content: it started to move and attacked her
  - label: D
    content: she found the gourd was not delicious at all
  group_stem: 'An honest old woman and a greedy old woman lived close to each other
    in the mountains. One day, the honest old woman rescued a bird whose back was
    broken by children. It gave her a gourd seed as thanks. She planted it in her
    yard and soon it grew into a tree that produced big gourds. She hung the big ones
    below her house to dry. They suddenly became very heavy. When she tried shaking
    one of the gourds, lots of rice came out. After that, she continued to get rice
    every day and soon she became rich.

    The greedy old woman saw this happen and wanted to become rich like the honest
    woman. She could not find a bird with a broken back, so she caught a bird, broke
    its back, and cared for it before she set it free. That bird, too, brought a gourd
    seed. The greedy woman planted it, and it also grew into a tree that produced
    gourds. She hung them under her house to dry and they became heavy. “They must
    be full of rice,” she thought. However, when she opened one of the gourds, (45)
    . She was so afraid that she died when she saw them.


