- id: doc_111_桃園_石門_英語_g9s1e3_s2_48
  section: 2
  number: 48
  type: single
  page: 4
  stem: What is this reading mainly about?
  options:
  - label: A
    content: Ghibli Studio teaches fans how to draw in a video.
  - label: B
    content: Suzuki has a new product with a Ghibli character.
  - label: C
    content: There are many things to do when you stay home.
  - label: D
    content: Ghibli created its most famous character in the 1980s.
  group_stem: 'Many people felt bored to stay at home during COVID-19. It might be
    a good chance to watch some works of Japanese anime. An even better activity could
    be drawing the characters in the films.

    Toshio Suzuki was one of the leading producers of Japan''s Studio Ghibli from
    1985 to 2014. On May 1, 2020, he shared a video that tells people how to draw
    one of the company''s most popular characters, Totoro. The character is from the
    1988 film My Neighbor Totoro. In the movie, two sisters moved to the countryside
    with their father when their mother was staying at a hospital. That’s where they
    met Totoro, a big, cute flying spirit that looks like a mix of a large cat, a
    rabbit and a bird.

    Suzuki says the most important part of drawing Totoro is being able to draw his
    round, wide-set eyes. He started his one-minute lesson by drawing the body shape
    of the animal. After that, he finished drawing by adding the eyes and other parts
    of the body. Although this video was first made for children in his hometown,
    Nagoya, it soon spread to Ghibli fans far and wide. Through videos like this,
    Ghibli fans around the world could stay at home safely and learn to draw for fun
    at the same time.


    spirit 精靈

    From Newsela (May 27, 2020)'
