  group_stem: "某太守者，好立名，而文字不甚了了。會府試文童，有賄囑幕友，冀得首名者。幕友知某守不學又多疑，往往微行竊聽。一夕閱卷，偵守將至，拍案嘆息曰：「佳文，佳文，可惜！」呼一友曰：「君試觀之，童子中乃有此才。」其中一人曰:「頃吾已閱百卷，間有佳構，似此色色精到，竟罕其匹，雖擬以第一，無愧也。」某曰：「是決不可。微聞此生富於資，東人①善疑，寧少抑之，吾輩毋受惡名。其三五之間乎？」一人曰:「此說亦良是，然此生屈矣。」某曰:「衡文當否，責在東人，我輩誰知之者！」守悉聞所言而去。\n\
