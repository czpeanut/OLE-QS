- id: doc_113_高雄_五福_國文_g8s1e3_s5_10
  section: 5
  number: 10
  type: single
  page: 7
  stem: 在甲文中，對於六國局勢的看法，蘇洵的觀點為何？
  options:
  - label: A
    content: 秦國最大的成功是實施富國強兵後，使諸國視其為威脅，因而不敢正面迎戰
  - label: B
    content: 齊國裡應外合，和秦國關係密切，但因為以土地賄賂秦，最終難逃亡國命運
  - label: C
    content: 燕國起初有謀略，能謹守不賂秦的原則，但後來改採用和親之計而導致亡國
  - label: D
    content: 趙國曾有能和秦國相抗衡的軍隊，然而李牧受誣陷而被殺死後，便無力抗秦
  group_stem: "（甲）\n    秦以攻取之外，小則獲邑，大則得城。較秦之所得，與戰勝而得者，其實百倍；諸侯之所亡，與戰敗而亡者，其實亦百倍。則秦之所大欲，諸侯之所大患，固不在戰矣。思厥先祖父，暴霜露，斬荊棘，以有尺寸之地。子孫視之不甚惜，舉以予人，如棄草芥。\n\
    \    齊人未嘗賂秦，終繼五國遷滅，何哉？與嬴而不助五國也。五國既喪，齊亦不免矣。燕趙之君，始有遠略，能守其土，義不賂秦。是故燕雖小國而後亡，斯用兵之效也。至丹以荊卿爲計，始速禍焉。趙嘗五戰於秦，二敗而三勝。後秦擊趙者再，李牧連卻之。洎牧以讒誅，邯鄲爲郡，惜其用武而不終也。且燕趙處秦革滅殆盡之際，可謂智力孤危，戰敗而亡，誠不得已。\n\
    節錄蘇洵〈六國論〉\n 【說明】：〈六國論〉是一篇借古諷今的作品，作者藉着論述六國破滅的原因，諷諭北宋當權者應善用有利的條件\n         對抗外敵，避免重蹈六國滅亡的覆轍。\n\
    （乙）\n    你看過一輛小汽車正在穿越一棵大樹樹洞的照片嗎？這樣的大樹叫做加州紅杉，是目前已知世界上最高大的樹種，生長於加州臨近太平洋地帶，高度可達六十到一百公尺，壽命也長，有不少已有兩三千年高齡。\n\
    \  所謂「根深柢固」，樹要長得高大，根通常需要扎得很深，這樣才能長得牢靠，也可吸收更多養份。但加州紅杉跟台灣常見的檳榔樹一樣，屬於淺根型植物，這樣狂風暴雨一來，不是很容易被連根拔起嗎？加州紅杉卻沒有這個問題，其中蘊含了自然界的一個奧祕：原來加州紅杉通常成群結隊長成一片森林，它們的根在地底下彼此緊密相連，形成一片根網，有的可達上千公頃。除非狂風暴雨大到足以掀起整塊地皮，否則很少紅杉會孤獨地倒下。專家說，彼此相串連的淺根方便它們快速、大量吸收養分，還可將扎根的能量用來向上生長，這也是它們長得特別高大的另一個原因。\n\
    \  天上的大雁能飛得很高、飛得很遠，祕訣也在這裡：牠們都成群結隊排成人字形飛翔，不僅可以彼此照應，而且可以節省飛翔所花的能量。飛在前面的雁，雖然較吃力，但牠翅膀的左後方和右後方會形成一股上升的氣流，緊跟在牠後面的雁飛在這股上升氣流裡，就可以節省很多力氣。如此這般，第一隻幫第二隻，第二隻又幫第三隻……；過一段時間後，當帶頭的第一隻飛累了，就會退到後面，由第二隻雁遞補上來。在彼此通力合作、幫助下，使牠們比單獨飛翔時能飛得更高也更遠，而且還更輕鬆。\n\
    \  大雁這種飛行隊伍，在蔚藍的天空中看起來很像中國字裡的「人」，也因此讓中國人產生了特別的感觸。有人說中國的「人」字看起來就像靠兩條歪斜的線互相支撐、互相扶持而成，所以我們做人也要與他人互相支撐、互相扶持；而大雁成「人」字飛行，也就具有嚴肅的象徵意義。\n\
    \  在社會上，一個人如果能像紅杉和大雁，廣結善緣，與別人緊密相連，互通有無，彼此支援，那麼不僅在面臨困境時，能有支撐的力量，還可花更少的心血，長得更高、更壯，飛得更高、更遠。\n\
    王溢嘉〈紅杉與大雁〉"
