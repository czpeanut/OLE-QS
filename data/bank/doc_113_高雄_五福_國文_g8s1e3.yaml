  group_stem: "3D 列印，顧名思義是相較於傳統的紙張列印，能夠以層狀堆疊建構出三維模型的技術。客製化的優點使得3D列印在醫療上能夠針對個體進行結構的微調，替不同病患量身打造出合適的醫材。\n\
    \    在眾多3D 列印的應用中，「生物列印」是最受矚目且高速發展的一種。透過電腦精細的控制和逐層列印的特性，提升了3D 列印機的靈活性和可重複性，並於近年來高度應用在各種複雜3D\
    \ 結構的製造上。\n    近期主流的生物列印技術可以分為下列4 種。\n    噴墨式生物列印 與傳統的平面噴墨列印非常相似，把生物細胞混合於水凝膠預聚物溶液並儲存在墨盒中，然後把墨盒連接到列印頭，利用電子訊號控制列印。列印頭通過熱或壓電致動器變形並擠壓以產生可控尺寸的液滴，透過在每個方向上使用分辨率小於100\
    \ 微米的螺桿提供亞微米定位，這些噴墨式生物列印機能夠達到10 微米的定位精度和20 皮升的液滴體積。噴墨列印的優點包括：成本低，可使用與商用列印機類似的結構；高列印速度，列印頭可支持平行工作模式；具較高的細胞活性。然而，當前的列印頭無法擠出高黏度材料，且無法與具有高細胞密度的生物墨一起使用，一旦細胞密度過高，高黏度生物墨會導致列印頭部堵塞。\n\
    \    擠出式列印 適合列印黏性較高的材料，運用空氣力泵或機械螺桿柱塞來分配生物墨。通過施加連續的力，生物墨可以被不間斷地以圓柱流體印刷成型而非以單一液滴排出噴嘴。幾乎所有類型不同黏度的水凝膠預聚物溶液以及具有高細胞密度的聚集體，都可以用擠出生物列印機印刷。雖然擠出型生物列印機可以列印更廣泛的材料，但封裝細胞暴露在更大的機械應力下，因此容易降低細胞活性。\n\
    \    雷射輔助列印 與噴墨列印相比，雷射輔助列印可以避免出料口和生物墨的直接接觸，不會對細胞產生機械應力，從而擁有高細胞活性。此外，雷射輔助列印可以列印高黏度材料，且能使用比噴墨列印更多類型的生物墨水。雷射生物列印具有開創性，並提供優越的解析度，但雷射暴露對各別細胞的副作用尚未完全了解。此外，與其他基於噴嘴的列印方法相比，具有高分辨率和強度的雷射輔助列印的成本昂貴，且雷射列印系統的控制較為複雜，因此限制了這項技術的採用。\n\
    \    數位光處理 系統由數位微鏡器件、光源和圖像處理裝置組成。數位光處理系統因其強大的光分辨率和亮度的調節能力而聞名，具有更高的加工速度，更大的設計靈活性和對製造模具的低要求，不僅適用於各種材料，且在組織工程中有巨大的潛力。進一步使用光固化聚合物材料，能有效製造光固化聚合物基材。\n\
    節錄自《科學發展．積層製造的生醫應用》"
