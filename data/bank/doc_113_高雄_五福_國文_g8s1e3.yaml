  stem: 渡也：「也只有沿著堅硬的環節／向天空／步步高升／才是你不變的志向／也只有綠／才是你一生想說的／那句話／在忠臣傳裡／才能讀到／／雖然風善用所有構陷的話／攻擊你細瘦的影子／即使最冷的朝代／你仍然筆直堅持／站在雨裡／父母兄弟都是／這樣的個性／永遠硬著頭顱／不肯破裂」關於這首詩的分析，下列說明何者正確？
  options:
  - label: A
    content: 「也只有沿著堅硬的環節／向天空／步步高升／ 才是你不變的志向／也只有綠／才是你一生想說的／那句話」這段詩句中，「綠」象徵青春的活力
  - label: B
    content: 「雖然風善用所有構陷的話／攻擊你細瘦的影子／即使最冷的朝代／你仍然筆直堅持／站在雨裡 」這段詩句是在形容即使遭遇挫折，仍奮發向上，積極樂觀
  - label: C
    content: 「茹冰飲雪／終於成為你生命的全部／雖然偶爾你也喜歡化妝／穿好一襲墨衣／去鄭板橋畫裡」詩句中的「你」即使生活清苦，偶爾也要穿上黑衣尋訪鄭板橋
  - label: D
