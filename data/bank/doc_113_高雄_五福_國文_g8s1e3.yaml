    \    初學打擊者看到球朝著打擊區飛來就猛力亂揮，成為「人體電風扇」，根本打不到球。專業打擊者能盯著球，等它來到能夠擊中的位置（稱為「好球區」）就會揮棒。頂尖打擊者只有當球來到好球區中的最佳擊球點（稱為「甜蜜區」），才會全力揮擊。在棒球運動中，強打者往往未必身材魁梧，他卻能用一根細長的球棒，把球打擊至上百公尺遠的地方，其中的關鍵就是他能掌握擊球時的「甜蜜區」。為此，打擊者必須不斷的揮棒，把所有來到好球區的球都打過，一打再打，揮棒落空、三振出局都無所謂，每個打擊者都有專屬於自己的最佳擊球點，在不斷揮棒的過程中，擊球的感覺會逐漸扎實，球棒的動能有效地轉換到球上，讓球像變了心的女朋友，飛到夠遠的地方。\n\
    \    頂尖的打擊者在與投手對決的過程中憑著直覺迅速做出決定，這幾乎都是在無意識的狀況下進行，而容易被旁人視為「打擊天才」。其實，大腦要迅速地做出決策並實現行動，無法只依靠由感覺器官進入的的資訊，更需要腦中原本積蓄的資訊一起運作，才得以克服面對的狀況，能力因而不斷提升。\n\
    改寫自洪吉〈打「點」王〉"
