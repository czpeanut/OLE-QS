  group_stem: '善學者，師逸而功倍，又從而庸之；不善學者，師勤而功半，又從而怨之。善問者，如攻堅木，先其易者，後其節目，及其久也，相說以解；不善問者反此。善待問者，如撞鐘，叩之以小者則小鳴，叩之以大者則大鳴，待其從容，然後盡其聲；不善答問者反此。此皆進學之道也。

