- id: doc_113_高雄_五福_國文_g8s1e3_s5_8
  section: 5
  number: 8
  type: single
  page: 6
  stem: 依據文意，下列敘述何者正確？
  options:
  - label: A
    content: 只有頂尖的打擊者，才能看得見投手投出的快速球
  - label: B
    content: 即使是頂尖的打擊者，在投打對決的過程仍居劣勢
  - label: C
    content: 頂尖的打擊者能擴大擊球範圍，使打擊率得以提升
  - label: D
    content: 頂尖的打擊者在擊球的瞬間，總能猜對投手的球路
  group_stem: "人由感覺器官偵測到外部的環境變化之後，這份資訊傳達到腦部，大腦處理資訊到做出決定的這段時間，至少需要0.1 秒。在棒球場上，投手丘的投手板到打擊者的本壘板是\
    \ 18.44 公尺，職業棒球的投手往往能投出時速140公里的球，讓站在本壘區的打擊者只有0.45 秒的時間反應，其中包括揮棒動作就須要至少0.2 秒。打擊被視為是一項「失敗者的遊戲」，因為在投打對決的過程中，打擊者係處於一個全然被動的狀態，必須針對來球做即時的反應，包括辨識球路、啟動揮棒機制然後完成揮棒動作。一位棒球選手能有三成的打擊率（打擊率等於安打數除以打數)，就算是頂尖的打擊者。\n\
    \    初學打擊者看到球朝著打擊區飛來就猛力亂揮，成為「人體電風扇」，根本打不到球。專業打擊者能盯著球，等它來到能夠擊中的位置（稱為「好球區」）就會揮棒。頂尖打擊者只有當球來到好球區中的最佳擊球點（稱為「甜蜜區」），才會全力揮擊。在棒球運動中，強打者往往未必身材魁梧，他卻能用一根細長的球棒，把球打擊至上百公尺遠的地方，其中的關鍵就是他能掌握擊球時的「甜蜜區」。為此，打擊者必須不斷的揮棒，把所有來到好球區的球都打過，一打再打，揮棒落空、三振出局都無所謂，每個打擊者都有專屬於自己的最佳擊球點，在不斷揮棒的過程中，擊球的感覺會逐漸扎實，球棒的動能有效地轉換到球上，讓球像變了心的女朋友，飛到夠遠的地方。\n\
    \    頂尖的打擊者在與投手對決的過程中憑著直覺迅速做出決定，這幾乎都是在無意識的狀況下進行，而容易被旁人視為「打擊天才」。其實，大腦要迅速地做出決策並實現行動，無法只依靠由感覺器官進入的的資訊，更需要腦中原本積蓄的資訊一起運作，才得以克服面對的狀況，能力因而不斷提升。\n\
    改寫自洪吉〈打「點」王〉"
