  number: 33
  type: single
  page: 2
  stem: 中國歷代的選才制度各有不同，壬申是個勤奮好學，飽讀詩書，想要施展抱負，為民謀福的一介平民。請設想壬申若是身處不同時代，下列何項敘述可能是他被選拔任官的情形？
