  section: 1
  number: 24
  type: single
  page: 1
  stem: 小青最喜歡看電視古裝劇”穿越時空愛上你”，內容描述女主角書瑜愛上漢代的王姓書生，王姓書生從進入某學校就讀，研習經學，王姓書生不負期望，成績優良擔任官職，最後有情人終成眷屬。請問︰王姓書生當時的學校稱之為什麼？
  options:
  - label: A
    content: 大學
  - label: B
    content: 太學
  - label: C
    content: 私塾
  - label: D
    content: 官學。
