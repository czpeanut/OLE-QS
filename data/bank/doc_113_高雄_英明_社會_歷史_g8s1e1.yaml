  stem: 阿牛是一位家境清寒的農家子弟，雖然沒有受過良好的教育，但是卻十分孝順父母、友愛兄弟，因此博得了家鄉父老的一致讚許。當地的地方首長聽聞了他的事蹟，便在當年度向朝廷舉薦人才時，將他列入推薦的名單。請問：阿牛最有可能是生活在哪個時期？
