- id: doc_113_高雄_英明_社會_歷史_g8s1e1_s1_21
  section: 1
  number: 21
  type: single
  page: 1
  stem: 國崴是個研究中國史的學生，他正在準備歷史小論文，以下是他的小論文內容：「當時社會由上而下為貴族、平民、奴隸三個階層，君王將土地及人民授予貴族，貴族按照身分等級獲得爵位，社會階層是世襲不可隨意變動
    。」請問：國崴的小論文題目可能是下列何者？
  options:
  - label: A
    content: 西周的封建制度下的社會
  - label: B
    content: 秦代中央集權下的社會
  - label: C
    content: 中國古代的科舉制度
  - label: D
    content: 歷代政府選材制度的演變。
