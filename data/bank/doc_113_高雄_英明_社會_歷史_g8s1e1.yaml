  section: 1
  number: 28
  type: single
  page: 1
  stem: 阿明利用暑假時參觀了科工館的展覽-大秦雄風兵馬俑與秦始皇特展，為了更深入了解展覽的內容，回家後阿明上網搜尋了許多秦朝相關的資料，但網路的資料往往不一定正確。請問：下列哪個選項的資料內容不符合史實？
  options:
  - label: A
    content: 資料一:秦始皇結束了戰國時期紛亂的局面，一統天下後自創皇帝制度
  - label: B
    content: 資料二:秦代統一了文字，政府使用楷書有利於政令的下達及文化交流
  - label: C
    content: 資料三:秦人連接戰國時期的長城是為了抵禦匈奴
  - label: D
    content: 資料四:秦代因為興建阿房宮驪山陵等大型工程，因濫用民力導致人民心生不滿反秦。
