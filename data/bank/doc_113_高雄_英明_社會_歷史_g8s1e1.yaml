- id: doc_113_高雄_英明_社會_歷史_g8s1e1_s1_22
  section: 1
  number: 22
  type: single
  page: 1
  stem: 洪老師請同學分組報告東周時期的變動，因長達五百年之久，此時期的歷史變局使中國的政治、經濟、文化，軍事、社會管理方式、官制等都發生了深刻的變化。下列哪一組的同學報告有誤？
  options:
  - label: A
    content: 冠軍組:部分國家實行中央集權，統治者直接控制地方
  - label: B
    content: 勝利組:平民被國君重用，社會階層流動
  - label: C
    content: 超人組:沒落的貴族將教育帶至民間，知識不再被壟斷
  - label: D
    content: 無敵組 :王室強大，諸侯聽從天子號令。
