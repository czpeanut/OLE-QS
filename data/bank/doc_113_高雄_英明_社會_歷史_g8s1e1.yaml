- id: doc_113_高雄_英明_社會_歷史_g8s1e1_s1_23
  section: 1
  number: 23
  type: single
  page: 1
  stem: 伊安因為搬家需要遷戶籍，他發現戶籍在中國古代已有悠久歷史，追溯至商代甲骨文中也有多處「登人」、「登眾」的記載，而戰國商鞅變法時秦實行全民戶口登記制度，將全國的人民按姓名、年齡、籍貫、身份、相貌、財富等加以登記，全部編入戶籍，是為「編戶齊民」。請問：商鞅實行此政策的目的為何？
  options:
  - label: A
    content: 國家能夠按戶籍徵稅與動員人力上戰場
  - label: B
    content: 強化人民對於國家的認同感
  - label: C
    content: 訓練人民參與國家事務
  - label: D
    content: 國家能夠以此依據選拔人才。
