  section: 1
  number: 27
  type: single
  page: 1
  stem: 科舉考試制度是中國歷史上一種重要選拔官員的制度，它不問家世，不須舉薦，主要以考試成績決定取捨，平民可以憑藉自己的努力入仕，促進社會階層的流動，提高了讀書教育的風氣。請問：此種選才制度的施行，開始於哪個朝代?
  options:
  - label: A
    content: 東漢
  - label: B
    content: 曹魏
  - label: C
    content: 隋代
  - label: D
