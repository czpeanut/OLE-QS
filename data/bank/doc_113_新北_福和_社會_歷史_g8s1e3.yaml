- id: doc_113_新北_福和_社會_歷史_g8s1e3_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: 杰倫是上海一家棉紡織工廠的老闆，他發現近年來，越來越多的外國棉紡織工廠出現在上海，尤其是日本人開辦的工廠規模龐大。他們充分利用中國的廉價勞工和豐富的原材料，大量生產價格低廉的商品，搶走了本地工廠的許多訂單。他擔心這會對中國剛起步的工業造成沉重的打擊。請問，這種外國企業在中國快速發展的現象，最早是從什麼時候開始的？
  options:
  - label: A
    content: 鴉片戰爭後，開放五個港口讓外國人通商
  - label: B
    content: 自強運動時，引進西方技術與器械
  - label: C
    content: 馬關條約簽訂後，允許日本人在通商口岸設廠製造商品
  - label: D
    content: 戊戌變法時，為發展工商業引進外資企業
