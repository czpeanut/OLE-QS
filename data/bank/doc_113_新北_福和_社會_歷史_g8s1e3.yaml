  section: 2
  number: 33
  type: single
  page: 4
  stem: 根據上文，何人採用梁啟超的建議，並展開了哪一場改革？
  options:
  - label: A
    content: 康有為─立憲運動
  - label: B
    content: 光緒皇帝─百日維新
  - label: C
    content: 李鴻章─自強運動
  - label: D
    content: 慈禧太后─庚子後新政
  group_stem: 梁啟超在其《變法通議》表示：「變法的根本在於培育人才，人才要興盛必須辦學校，而學校的建立在於考試制度的更易，一切要妥善完備必須改革官制。……今天各學館為何人才不出？這是因為他們學技藝而不學政治、制度方面的學問。……考試之制不改，便缺乏才學；師範學堂不立，便無適當的教師；專門學問不加區分，便不能專精。這三者是中國的病根。」
