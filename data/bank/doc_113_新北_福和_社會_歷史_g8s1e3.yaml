    | | 外力入侵 | 條約內容 |

    | --- | --- | --- |

    | 甲 | 日本派兵進入朝鮮，清朝與日本爆發戰爭 | 承認朝鮮獨立，割讓台灣、澎湖 |

    | 乙 | 列強以保護人民為由，率領聯軍攻入北京 | 簽辛丑和約，造成財政及國防嚴重損失 |

    | 丙 | 英國因商業利益受損，出兵中國打開通商口岸 | 五口通商、割讓香港、喪失領事裁判權等 |

    | 丁 | 英國因修約被拒，聯合法國派兵東來 | 外人勢力由沿海深入內地 |'
  options:
  - label: A
    content: 甲→乙→丙→丁
