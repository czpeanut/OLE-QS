  type: single
  page: 1
  stem: 圖(一)是十九世紀前期某國與清朝的三角貿易關係。四位同學針對此圖出現的背景分別說出自己的理解，請問:哪一位同學理解是正確的?
  options:
  - label: A
    content: 禹安:甲國代表的是法國，以印度為基地生產鴉片賣進中國
  - label: B
    content: 欣恬:甲國將鴉片大量輸入中國的目的，是為了平衡與中國的貿易
  - label: C
    content: 聖傑:鴉片大量輸入中國，造成中國關稅收入增加，增進經濟發展
  - label: D
    content: 美心:清廷派林則徐查禁鴉片，甲國商人承受巨大損失最終導致英法聯軍
