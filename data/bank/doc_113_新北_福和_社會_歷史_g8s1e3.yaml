  type: single
  page: 2
  stem: '清朝在面對外國勢力的入侵和內部危機時，採取了不同的應對方式。這些【挑戰與回應】的過程，不僅影響了清朝的走向，也成為歷史研究的重要案例。表(一)列出幾個重大歷史事件整理，何者最符合事實?


    表(一)

    | | 挑戰 | 回應 |

    | --- | --- | --- |

    | 甲 | 鴉片戰爭 | 自強運動 |

    | 乙 | 英法聯軍 | 庚子後新政 |

    | 丙 | 甲午戰爭 | 戊戌變法 |

    | 丁 | 八國聯軍 | 立憲運動 |'
