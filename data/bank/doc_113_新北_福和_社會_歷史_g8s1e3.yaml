- id: doc_113_新北_福和_社會_歷史_g8s1e3_s1_22
  section: 1
  number: 22
  type: single
  page: 1
  stem: '19 世紀的中國與日本面臨相似的遭遇，兩國經歷長久的閉關自守，最終皆因外力入侵而打開大門，接著兩國各自推動改革以求國家富強，並在交戰中顯現出改革成果。下表為此段時間兩國的比較，請問何者有誤？


    | 進程 | 中國 | 日本 |

    | --- | --- | --- |

    | (A)閉關自守開始 | 雍正皇帝禁教 | 幕府實施鎖國 |

    | (B)外力入侵打開門戶 | 英國 鴉片戰爭 | 美國 脅迫開港 |

    | (C)首推改革 | 戊戌變法 | 明治維新 |

    | (D)成果展現 | 成效有限 | 變成亞洲強國 |'
  options:
  - label: A
    content: 閉關自守開始：中國 雍正皇帝禁教；日本 幕府實施鎖國
  - label: B
    content: 外力入侵打開門戶：中國 英國 鴉片戰爭；日本 美國 脅迫開港
  - label: C
    content: 首推改革：中國 戊戌變法；日本 明治維新
  - label: D
    content: 成果展現：中國 成效有限；日本 變成亞洲強國
  tags:
    chapter:
      publisher: 翰林
