  section: 1
  number: 20
  type: single
  page: 1
  stem: 在一場戰爭後不久，英國人赫德出任清朝海關總稅務司，他為中國人親自設計港口海關制度，不但在上海港口建立燈塔和氣象站，而且明正禁令不准受賄，向清廷上交的稅款大增。赫德很高瞻遠矚，他知道只令中國政府增加錢財收入是不夠的，他向慈禧太后建議，將他追回來的關稅用來開辦學校，並保送中國人去西方留學見識，學習什麼叫制度管理。赫德還建議清廷向英國購買堅船利炮，組成一支現代化艦隊，很快就獲得主政者批准。請問：赫德出任海關總稅務司是在哪場戰爭後發生？
