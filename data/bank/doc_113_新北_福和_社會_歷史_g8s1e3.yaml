  section: 1
  number: 25
  type: single
  page: 2
  stem: 惠妹是清末民初的中國時髦女性，(甲)居住在西洋樓房，常使用洋貨，洋貨的使用成為當時一種身分地位的象徵； (乙)她常穿著洋裝，挽著穿西服的男友去西餐廳吃西餐、喝咖啡；(丙)她和男友是自由戀愛而認識，也常陪著男友去遊覽西式公園；(丁)但她不能隨意出去工作、不能參與政治、不能到學校去接受教育，也還保存著纏足的習俗。請問:以上對於惠妹的敘述，何項內容並不符合當時的社會風氣？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
