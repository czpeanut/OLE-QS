  stem: 梁啟超曾在一篇文章中提到:「重視男女平權觀念，尤以美國最具代表性;透過女學的設立，使日本逐漸趨於強盛，女學的設立更能帶來國家興盛與啟迪人民思想的效果。……若能採用西方的教育制度，載明先聖先賢的遺訓，則能達到強國保種的目的。」由上述內容來看，梁啟超認為要達到強國保種的目的，應該施行何種措施?
