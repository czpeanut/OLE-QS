- id: doc_113_台中_向上_自然_g9s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 龍捲風的雲形狀為？
  options:
  - label: A
    content: 漏斗狀
  - label: B
    content: 螺旋狀
  - label: C
    content: 碎片狀
  - label: D
    content: 圓柱狀。
  group_stem: "素養題請閱讀下面文章後，回答下列10~11 題 \n \n龍捲風，又稱龍捲、捲風，是一種猛烈的天氣現象，由直立中空管狀的強烈旋轉氣球構成。龍捲風常發生於積雨雲或是積雨雲以下，並通常形成上大下小的漏斗狀，延伸至地面，並且常被塵土或碎片殘骸等包圍。極少數情況下龍捲風也可能從積雲發起。無論是陸地上的「陸龍捲」或是海面上的「水龍捲」，發生條件均基本上需要極不穩定的空氣擾動，或高溫高濕空氣與冷空氣的劇烈輻合作用。因此，龍捲風常發生於中緯度溫帶氣旋及強烈對流雷雨附近。龍捲風漏斗狀的雲稱為「漏斗雲」或「管狀雲」。通常形成於超大胞，雷雨雲被冷空氣從底部切斷。通常，龍捲風的直徑約在75\
    \ 公尺左右，風速通常在64 公里每小時到177 公里每小時之間，總移動距離約在數公里。一些大型龍捲風風速可超過480 公里每小時，直徑達1.6 公里，移動路徑超過100\
    \ 公里。"
