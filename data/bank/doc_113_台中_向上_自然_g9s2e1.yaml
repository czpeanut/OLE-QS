  stem: 有關常用電池的性質，下列敘述何者錯誤？
  options:
  - label: A
    content: 鉛蓄電池充電時，電池的負極要接外電源的負極
  - label: B
    content: 鹼性電池的電解液可使用氯化銨及二氧化錳
  - label: C
    content: 銅銀電池的銅棒為負極，銀棒為正極
  - label: D
