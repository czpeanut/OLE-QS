  section: 1
  number: 21
  type: single
  page: 4
  stem: '表為戶外有日曬的甲地與室內的乙地在中午時所測量到的各種溫度。根據上文，甲地、乙地在中午時的熱傷害風險等級分別為何？


    | | 甲地 | 乙地 |

    | :--- | :--- | :--- |

    | $T_{W}$ | 23℃ | 20℃ |

    | $T_{G}$ | 30℃ | 24℃ |

    | $T_{d}$ | 26℃ | 24℃ |'
  options:
  - label: A
    content: 注意、安全
  - label: B
    content: 注意、注意
  - label: C
    content: 警戒、安全
  - label: D
    content: 警戒、注意
  group_stem: '請閱讀下列敘述後，回答21~22 題


    為了降低中暑的機會，近年來部分國家會使用綜合溫度熱指數 WBGT（℃）作為判斷熱傷害風險的指標，而 WBGT 的計算方式如下：

    在戶外有日曬時，WBGT＝0.7$T_{W}$＋0.2$T_{G}$＋0.1$T_{d}$

    在戶外無日曬或室內時，WBGT＝0.7$T_{W}$＋0.3$T_{G}$

    $T_{W}$：自然濕球溫度（℃），用以反映水分揮發的難易度

    $T_{G}$：黑球溫度（℃），用以反映太陽輻射的效應 $T_{d}$：乾球溫度（℃），用以反映單純空氣溫度

    依 WBGT 數值大小可將熱傷害風險區分為五個等級，如表所示。


    | WBGT 數值 | ＜21 | 21～25 | 25～28 | 28～31 | $\geq 31$ |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 風險等級 | 安全 | 注意 | 警戒 | 高度警戒 | 危險 |


    ※ 21～25 代表 21 以上（含），未滿 25，其他依此類推'
