- id: doc_113_高雄_光華_數學_g9s2e2_s2_1
  section: 2
  number: 1
  type: calc
  page: 5
  stem: 'BMR(Basal Metabolic Rate)中文又稱『基礎代謝率』，簡單來說就是人體為了維持生命及生理機能所需的最低能量。即使人躺在床上一天，人的大腦、心臟、血液仍然不斷地運轉，而這些運轉仍需要消耗能量，這些最低消耗能量就是BMR，而影響BMR
    的變數有年齡、性別、體重(公斤)、身高(公分)：


    男性 BMR：(10$\times$體重)+(6.25$\times$身高)-(5$\times$年齡)+5

    女性 BMR：(10$\times$體重)+(6.25$\times$身高)-(5$\times$年齡)-160


    知道了 BMR 這個數值之後，我們可以加上運動消耗的熱量來推估每日應攝取多少熱量：

    - 幾乎沒運動=BMR$\times$1.2

    - 每週運動1~2 天=BMR$\times$1.4

    - 每週運動3~4 天=BMR$\times$1.6

    - 每週運動5~6 天=BMR$\times$1.8

    - 每天運動訓練=BMR$\times$1.9


    如果每日多攝取 275 卡，四週之後就會是 7700 卡，等同於增加 1 公斤的體重，相反地，若每日少攝取 275 卡，則四週後減少的總熱量等同減少 1 公斤的體重。請根據以上資訊回答下列回題，並詳細解釋理由。

    (1) 小高是 31 歲的男性，身高 184 公分，體重 100 公斤，平常都沒有運動習慣，請計算他每日應攝取多少熱量？

    (2) 承上題，小高每天攝取 2600 卡的熱量，但下個月要參加模特兒選拔大賽，為了選上必須減重 2 公斤，於是想安排運動但又怕不習慣，所以打算安排四週漸進增加的計畫，第一週開始運動
    2 天，之後每週再增加 1 天，請問小高四週後是否可以達成減重目標？'
