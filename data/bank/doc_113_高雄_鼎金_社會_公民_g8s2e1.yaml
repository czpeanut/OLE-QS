- id: doc_113_高雄_鼎金_社會_公民_g8s2e1_s1_59
  section: 1
  number: 59
  type: single
  page: 2
  stem: 上文中，黃男與吳女各自提出自己的主張，此程序符合下列何者？
  options:
  - label: A
    content: 委託律師提起訴訟
  - label: B
    content: 法官查證事實審理
  - label: C
    content: 對判決結果不服提出異議
  - label: D
    content: 當事人提出有利自己的證據。
  group_stem: '59-60 題組

    請閱讀下列文章後，回答問題：

    黃男被吳女開車撞傷，提出民事損害賠償訴訟，列出許多與車禍無關的醫療、生活用品、營養品支出單據，求償新臺幣近 2 千萬元。吳女認為，求償金額太高，且黃男未依規定行走於行人穿越道上，應負過失責任，賠償金額應為
    2 萬 4 千元。

    法院審理後指出，「損害賠償」並非當事人主觀上對於權利行使的一種想像，而任意主張許多與本件侵權事實沒有因果關係的請求。因此，法院判決吳女僅須賠 1 萬 6 千元，並表示損害賠償不是中樂透，不能將生活成本要求對方負責。（資料來源：改寫自損害賠償不是中樂透，男求償
    1999 萬判賠 1.6 萬，中央通訊社，2021/4/19。）'
