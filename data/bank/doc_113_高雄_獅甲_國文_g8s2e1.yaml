- id: doc_113_高雄_獅甲_國文_g8s2e1_s5_31
  section: 5
  number: 31
  type: single
  page: 5
  stem: 「清官則自以為不要錢，何所不可 ，剛愎自用，小則殺人，大則誤國 」下列何者符合老殘所說的？
  options:
  - label: A
    content: "莊耀 是無才為官者  \n    ，愛才欲渴,卻如此能辨愚賢,善用人才"
  - label: B
    content: 剛弼，被稱作是「清廉的格登登」的清官，拒絕巨額賄賂
  - label: C
    content: "玉賢、徐桐、李秉 \n       衡一班人， 由清廉得名， 後來都用他們的振作國家朝政"
  - label: D
    content: "玉賢任曹州知府不到一年的時間內，衙門前十二個站籠便站死 \n       了二千多人，其中十個倒 有九個半是良民。"
  group_stem: '(一)▲閱讀下文，回答第31-32 題

    「贓官可恨，人人知之；清官尤可恨，人多不知。蓋贓官自知有病，不敢公然為非；清官則自以為不要錢，何所不可 ，剛愎自用，小則殺人，大則誤國。吾人親目所見，不知凡幾矣。試觀徐桐、李秉衡，其顯然者也。二十四史中，指不勝屈。作者苦心願天下清官勿以不要錢便可任性妄為也。歷來小說皆揭贓官之惡，有揭清官之惡者，自老殘遊記始。」

    胡適認為這段話是老殘遊記的中心思想。劉鶚筆下的「清官」，其實是一些「急於要做大官」而不惜殺民以邀功， 用百姓鮮血染紅烏紗帽的劊子手。老殘遊記二十回只寫了兩個酷吏—前半寫一個玉賢，後半寫一個剛弼。玉賢是以「才
    能功績卓著」而補曹州知府的。在他任曹州知府不到一年的時間內，衙門前十二個站籠便站死了二千多人，其中十個倒 有九個半是良民。于朝棟一家，因和強盜結冤被栽贓，玉賢不加調查，一口咬定是強盜，父子三人就斷送在站籠裡。一
    個雜貨鋪掌櫃的年輕兒子，由於酒後隨口批評了玉賢幾句，也被抓進站籠站死。老殘一針見血地指出：「我說無才的要 做官很不要緊，正壞在有才的要做官。你想，這個玉太尊不是個有才的嗎？只為過於要做官，且急於做大官，所以傷天
    害理的，做到這樣。」（見第三、四、五回）

    小說中的剛弼，被稱作是「清廉的格登登」的清官，他曾拒絕巨額賄賂，但卻倚仗不要錢、不受賄，一味憑自己臆 測斷案，枉殺了很多好人。他在審訊賈家十三條人命的巨案時，主觀武斷，定魏氏父母是凶手，嚴刑逼供，鑄成駭人聽
    聞的冤 獄。（見第十六回）

    山東巡撫莊耀是一位愛才欲渴的封疆大吏，卻如此不辨愚賢，把玉賢、剛弼那樣的酷吏視為肱股之臣。由於這班迂 腐的官吏自信不要錢便可對上帝、質鬼神了，卻完全不講求那些搜求證據，研究事實，判斷是非的法子與手段；完全信任他們自己的意見，武斷事情，固執成見，所以「小則殺人，大則誤國」。劉鶚先生眼見玉賢、徐桐、李秉衡一班人，
    由清廉得名，後來都用他們的陋見來殺人誤國，怪不得他要感慨發憤，著作這部書，來大聲指斥清官的可恨可怕了。

    (摘自劉鶚小傳．劉德隆)'
