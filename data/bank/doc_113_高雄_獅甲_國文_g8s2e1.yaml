  stem: "「而當你終於無視地走過／在你身後落了一地的／朋友啊 那不是花瓣／是我凋零的心」下列何者可用來描述詩中女子的         \n    心情？"
  options:
  - label: A
    content: 還君明珠雙淚垂，恨不相逢未嫁時（張籍 節婦吟）
  - label: B
    content: 山有木兮木有枝，心悅君兮君不知（佚名 越人歌）
  - label: C
    content: 曾經滄海難為水，除卻巫山不是雲。( 元稹 離思)
  - label: D
    content: 相見時難別亦難，東風無力百花殘。（李商隱 無題）
