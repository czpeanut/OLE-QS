- id: doc_113_高雄_獅甲_國文_g8s2e1_s4_4
  section: 4
  number: 4
  type: single
  page: 1
  stem: "有關下引文字的敘述，正確的選項是：「又足下書云：到通州日，見江館柱間有題僕詩者，復何人哉？又昨 \n   過漢南日，適遇主人集眾樂娛他賓，諸妓見僕來，指而相顧曰：『此是〈秦中吟〉、〈長恨歌〉主\
    \ \n   耳。』自長安抵江西三、四千里，凡鄉校、佛寺、逆旅、行舟之中，往往有題僕詩者；士庶、僧徒、孀 \n   婦、處 女之口，每每有詠僕詩者。」"
  options:
  - label: A
    content: 「足下」應是指李白
  - label: B
    content: 「僕」在通州看到自己的詩被題在江管柱間
  - label: C
    content: 從這 段文字可知，「僕」的詩應是通俗易懂
  - label: D
    content: 「足下」是〈秦中吟〉、〈長恨歌〉的作者。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 國文
      code: 語文常識(一)
      title: 應用文──書信、便條
      chapter: null
    textbook: 八下 語文常識(一) 應用文──書信、便條
    labeled_by: ai
- id: doc_113_高雄_獅甲_國文_g8s2e1_s4_5
  section: 4
  number: 5
  type: single
  page: 1
  stem: 章回小說多由說書人的底本增潤而成，情節敘述往往掺雜說書人的解釋或評論。下列文句，沒有具有此一特色的選項是：
  options:
  - label: A
    content: "玄德訪孔明兩次不遇，欲再往訪之。關公曰：「兄長兩次親往拜謁，其禮太過矣。想諸葛亮有虛名而無實學，故避而不   \n   敢見。兄何惑於斯人之甚也？」"
  - label: B
    content: 八戒道：「哥哥說得有理。你去，你去。若是打敗了這老妖，還趕將這裡來，等老豬截住殺他。」好行者，一隻手提著鐵棒，一隻手拖著死虎，徑至他洞口。正是：法師有難逢妖怪，情性相和伏亂魔
  - label: C
    content: "孔明曰：「亮夜觀天象，劉表不久人世；劉璋非立業之主，久後必歸將軍。」玄德聞言，頓首拜謝。只這一席話，乃 \n    孔明未出茅廬，已知三分天下。真萬古之人不及也"
  - label: D
    content: "當時林沖扳將過來，卻認得是本管高衙內，先自手軟了。高衙內說      \n    道： 「林沖，干你甚事！你來多管！」原來高衙內不認得他是林沖的娘子，若還認得時，也沒這場事"
  tags:
    chapter:
      publisher: 康軒
      book: 八下
      subject: 國文
      code: 第四課
      title: 張釋之執法
      chapter: null
    textbook: 八下 第四課 張釋之執法
    labeled_by: ai
- id: doc_113_高雄_獅甲_國文_g8s2e1_s4_6
  section: 4
  number: 6
  type: single
  page: 2
  stem: 北朝民歌給人豪放質樸、俚俗真切的感受，下列何者可以界定為「北朝民歌」？
  options:
  - label: A
    content: "儂作北辰星，千年無轉移。歡行 \n   白日心，朝東暮複西!"
  - label: B
    content: 採蓮南塘秋，蓮花過人頭。低頭弄蓮子，蓮子清如水。
  - label: C
    content: "逆浪故相邀，菱舟不怕遙。 \n   妾家揚子住，便弄廣陵潮。"
  - label: D
    content: 男兒欲作健，結伴不須多。鷂子經天飛，群雀兩向波。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 國文
      code: 第二課
      title: 木蘭詩
      chapter: null
    textbook: 八下 第二課 木蘭詩
    labeled_by: ai
- id: doc_113_高雄_獅甲_國文_g8s2e1_s4_7
  section: 4
  number: 7
  type: single
  page: 2
  stem: 下列出自迷途羔羊—弗氏海豚的文句，何者最能體現「人們對海洋認知有限」的事實？
  options:
  - label: A
    content: "海面畢竟只是一個表象空                \n   間 ，我們能夠理解的範圍及深度的確相當有限"
  - label: B
    content: 我們也發現幾隻瓶鼻海豚在其中湊熱鬧
  - label: C
    content: "我會強烈感覺到， \n  船隻是一個介入者"
