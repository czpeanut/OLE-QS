  stem: "「新裂（１）齊紈素（２），皎潔如霜雪。裁為合歡扇，團團（３）似明月。出入君懷袖（４），動搖微風發。 \n    常恐秋節（５）至，涼飆（６）奪炎熱。棄捐（７）篋笥（８）中，恩情中道絕。」（班婕妤\
    \ 怨歌行） \n 【注釋】（１）裂：裁剪後剩餘的布帛。（２）齊紈素：齊國出產細緻光澤的白綢絹。（３）團團：形容圓的樣子。 \n         （４）懷袖：胸口和袖口，猶言身邊。（５）秋節：秋季。（６）涼飆：涼風。飆，風。（７）棄捐：棄置不用。\
    \ \n           捐，棄。（８）篋笥：竹編的箱子。關於這首詩下 \n       列何者正確？"
