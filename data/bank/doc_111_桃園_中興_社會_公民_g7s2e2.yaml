  stem: 小麥的好友們因此開始分別搜尋及討論關於志願結社的特徵。下列哪一位的說法較能看出志願結社團體與公司的差異？
  options:
  - label: A
    content: 小燕：為追求效率，採規畫性的運作過程
  - label: B
    content: 小瑞：有共同的目標，進行制度化的分工
  - label: C
    content: 小琇：成員自主決定行動，不受政府控制
  - label: D
    content: 小玟：非以營利為目的，成員不分配利潤。
