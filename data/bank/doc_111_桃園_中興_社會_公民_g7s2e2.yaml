  stem: 上面的敘述是小麥的一個朋友憤怒地說到最近在參與的團體中受到的委屈。若以小麥上網看到的資料，並以志願結社的特徵來判斷，他朋友想爭取的自由應是指下列何者？
  options:
  - label: A
    content: 民間性
  - label: B
    content: 非營利性
  - label: C
    content: 自主性
  - label: D
    content: 組織性。
  group_stem: 我加入一基督教教會，信徒都是街坊鄰居，平常都是靠大家的捐獻，支持教會活動，但政府最近突然介入，發公文要求我們必須閱讀被曲解修改過的假聖經，以及向國家領導人照片膜拜，我不想這麼做，我認為政府不該干涉教會內部運作，這是我們的自由。
