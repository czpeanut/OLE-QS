  stem: 小麥是中職樂天桃猿隊的球迷，為了蒐集與獲得更多球員的情報而想要組織一個球迷俱樂部，能與同好進行交流與交換。請問：我國人民組織或參與團體的自由，是受到何項法律保障？
  options:
  - label: A
    content: 《集會遊行法》
  - label: B
    content: 《財團法人法》
  - label: C
    content: 《組織犯罪防制條例》
  - label: D
    content: 《憲法》。
  group_stem: "中信情蒐「樂天女孩80」 球迷讚有料：沒李多慧也滿分\n    中職樂天桃猿旗下啦啦隊「樂天女孩Rakuten Girls」陣容堅強，因此經常被戲稱為「啦啦隊附屬棒球隊」，本季找來韓國洋將李多慧補強啦啦隊更引發一陣熱潮，沒想到今（28\
    \ 日）有球迷發現，中信兄弟在本週與樂天的系列戰竟對樂天女孩「情蒐」，讓球迷直呼中信情蒐太有料了，「要特別提防Yuri 和嘎琳」。\n    今日有球迷在PTT\
    \ 棒球板發文，指出昨（27 日）中信與樂天之戰，中信休息區的白板上竟寫著「Rakuten Girls 80」，情蒐樂天女孩的畫面讓球迷笑翻直呼有料，「擊敗球隊要先擊敗啦啦隊」「情蒐當然是要情蒐本體啊」「球探報告滿分80，中信給80\
    \ 足見實力之高」「看來PS 準備補強戰力，可能已經在找洋將了」「沒有多慧還能滿分」。\n                                \
    \                                2023.04.28 23:22 臺北時間   文｜謝文哲"
