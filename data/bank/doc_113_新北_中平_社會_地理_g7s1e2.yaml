  stem: 5 天4 夜的騎車環島旅程中最大的遺憾就是因今年4 月3 日的大地震，造成該國家公園內部嚴重坍崩，導致園區內部分景點與步道仍處於封閉狀態。請問：根據上表的敘述最有可能是下列哪一座國家公園？
  options:
  - label: A
    content: 台江國家公園
  - label: B
    content: 雪霸國家公園
  - label: C
    content: 玉山國家公園
  - label: D
    content: 太魯閣國家公園。
  group_stem: '中華職棒味全龍啦啦隊女神李多慧，從11 月4 日開始展開在臺灣騎車環島的夢想，一路從宜蘭、花蓮、台東順時針旅行，預計5 天4 夜，11
    月9 日下午前抵達台北。粉絲們根據官方臉書及IG 上的動態消息，大致整理出大概行程如下表，請根據下表回答第45-48 題:


    | 日期 | 行程 |

    | --- | --- |

    | 11 月4 日(一) | 從台北出發直奔宜蘭。 |

    | 11 月5 日(二) | 從宜蘭出發往武嶺，但因山區道路受颱風影響無法通行，返回宜蘭。 |

    | 11 月6 日(三) | 再次從宜蘭出發往花蓮前進，想參觀路途中的國家公園的知名景點，如立霧溪切鑿壯觀的大理石峽谷、九曲洞、砂卡噹步道，但因今年4 月3
    日的大地震，造成該國家公園內部嚴重坍崩，目前園區部分景點與步道仍是封閉狀態。 |

    | 11 月7 日(四) | 從花蓮一路往臺東沿海地區前進，並且在知名打卡景點三仙台留下美照，也品嘗臺東小吃與前來加油打氣的粉絲拍照。 |

    | 11 月8 日(五) | 穿越中央山脈尾端一路往臺中前進，晚上與台中市長一起享用當地的韓式餐酒館餐廳。 |

    | 11 月9 日(六) | 一早從臺中出發，趕往臺北信義區的活動現場。 |'
