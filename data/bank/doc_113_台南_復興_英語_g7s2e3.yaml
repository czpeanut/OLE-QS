    a big tree. Every day, other animals came to him. They asked Oliver many questions.
    "Where is the food?" or "How can we find water?" Oliver always knew the answers
    quickly. He could also find food fast when other animals could not. All the animals
    there thought Oliver was an amazing owl! He helped everyone in the forest. When
    they had problems, they always went to Oliver. He was never wrong.

    📖 lived 居住 forest 森林


    There are some meanings of the word ‘bright’ in a dictionary. Which one can Ryan
    choose?

