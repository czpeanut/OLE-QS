    The hamster and the squirrel lived in the woods. The hamster always worked hard.
    He got enough food for winter. His happy neighbor, the squirrel, did not understand
    him. He just played all day. He did not work. Then, winter came. It was cold.
    The hamster stopped working. The squirrel stopped playing.


    One day, the hamster was busy putting his food in the sun. The squirrel was starving,
    so he went to the hamster to ask for food.


    "Hello, kind neighbor," said the squirrel. "Can you give me some food? I will
    give the food back to you next year."


    "Why don''t you have food?" asked the hamster. "There was a lot of food all summer.
    What did you do?"


    "Oh, I played all day and all night. " said the squirrel.


    "Well," said the hamster. "If you played all summer, you should play all winter!"


    The hamster went back to work. He sang a song: "We hamsters never ask for food;
    we hamsters never give food away."


