    Jane: Hey Simon, did you know the Buddy Bench?

    Simon: No, what is it?

    Jane: It''s a special bench at school. If a kid feels lonely, they can sit there.
    Then someone can come and be their friend.

    Simon: Oh, that''s so nice! Who made that?

    Jane: A girl named Sammie Vance. She is from Indiana in the USA.

    Simon: What did she do?

    Jane: When Sammie was in the third grade, she wanted to help lonely kids. She
    also wanted to help the Earth.

    Simon: Wow! How did she do both?

    Jane: She used plastic bottle caps to make the bench!

    Simon: Bottle caps? Like from milk and juice?

    Jane: Yes! She collected 400 pounds of caps with her family and friends.

    Simon: That''s a lot of caps! Did she only make one bench?

    Jane: No! After the first one, more people helped. She made more benches for other
    schools and parks.

    Simon: That''s amazing. What did she call it?

    Jane: She called it the "Buddy Bench Program."

    Simon: I think we need one at our school, too.

    Jane: Yes! If we see someone sitting alone, we should go and say hi. Just like
    Sammie did.

    Simon: You can say that again! Let''s be good buddies.


