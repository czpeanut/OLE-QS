    content: He wants to play a game with her.
  - label: B
    content: He wants to give her some food.
  - label: C
    content: He wants to sing a song to her.
  - label: D
    content: He wants to tell a funny story to her.
  group_stem: '《B》

    A lion big, a lion strong,

    He wanted a happy song.

    He saw a lioness one day,

    But he was shy, no words to say.

    He asked the mouse, "Help me, please!"

    The mouse wrote words, small as peas.

    The song was funny, not so good,

    The lion said, "These words are not me!"

    He asked the monkey, "Write for me!"

    The monkey’s song was happy and free.

    But still, it was wrong, not how he felt,

    The lion wanted a better start.

    The lion learned, he smiled and sang,

    "My voice is one of a kind!"

    He sang to her, his voice was so cool,

    The lioness smiled, and loved him true.


