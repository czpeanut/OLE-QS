  group_stem: '《E》

    The Internet is a fun place! You can play games, watch videos, and talk to friends.
    But just like crossing the street, you need to be careful. Here are some easy
    ways to help you keep safe online.


    1. Keep Important Things Safe

    Don''t tell people your name, home, school, or phone number online. These things
    are only for your family and friends.

    2. Talk to an Adult

    If you see something online that makes you feel bad, tell your mom, dad, or teacher.
    They can help you.

    3. Be Nice Online

    Say nice words on the Internet. If someone is not nice to you, don''t talk back.
    Tell an adult first.

    4. Don''t Chat with the people you don''t know

    Only talk to people you know in real life. Some people online may tell things
    that are not true.

    5. Ask Before You Click

    Sometimes games or videos show pictures. Don’t click on them without asking an
    adult. They can take you to bad websites.

    6. Use Safe Passwords

    Make your password hard for other people to guess. Don’t use your name or “1234.”
    Only your parents should know your password.

    7. Rest Your Eyes

    Don''t look at the computers or phones for too long. Take breaks, go outside,
    or read a book too!


    The Internet is a fun place if you do those things. Be smart, stay safe, and always
    ask for help if you’re not sure what to do!


    📖 careful 小心的 safe 安全的 online 線上 important 重要的 adult 成人 click 點選 website 網站 password
    密碼'
