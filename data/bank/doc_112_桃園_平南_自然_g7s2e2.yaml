- id: doc_112_桃園_平南_自然_g7s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 有(甲)Pinus taiwanensis、(乙)Pinus luchuensis、(丙)Isoetes taiwanensis 等三個生物個體。悟空、克林、比克與達爾在討論此三生物之間的分類關係，請問以下誰的敘述是正確的？
  options:
  - label: A
    content: 悟空：甲、乙之關係為同屬不同種
  - label: B
    content: 克林：甲、丙之關係為同種不同屬
  - label: C
    content: 比克：甲、丙屬於同一個屬，因為同種必同屬
  - label: D
    content: 達爾：甲、乙其實是同種生物，因為同屬必同種。
