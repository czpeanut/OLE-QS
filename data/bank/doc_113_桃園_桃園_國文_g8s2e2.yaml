  group_stem: "3.老頭子\n紀文達體肥而畏暑，某日直廬①，與同僚數人方皆赤身談笑。忽高宗自內出，眾皆倉皇披衣。紀不\n及著衣，亟②伏御座下。高宗欲戲之，久坐不去，亦不言。紀以酷熱不能耐，伸首外窺，問日：\n\
    「老頭子去耶？」眾皆笑。高宗厲聲問「老頭子」三字何解，紀頓首③謝④曰：「萬壽無疆之為\n老，頂天立地之為頭。父天母地⑤之為子。」高宗乃悅。\n      \
    \                           (節錄改寫自 清〈稗類鈔・詼諧類〉)\n注釋：\n①直廬：在某處住宿值夜。\n②亟：快速。\n③頓首：磕頭。舊時禮節之一。以頭叩地而拜。\n\
    ④謝：道歉，賠罪。\n⑤父天母地：以天地為父母，故稱「天子」。天子，即帝王。"
