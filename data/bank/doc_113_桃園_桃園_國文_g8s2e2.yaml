    點彈性，試著創造「山窮水盡疑無路，柳暗花明又一村」的奇蹟。只要你保持好體力，帶著勇氣，\n換一條路走，會發現自己的潛力。\n    跌倒之後，重新站在人生的分水嶺上，究竟應該繼續原有的路途，還是換個跑道？沒有人可以\n\
