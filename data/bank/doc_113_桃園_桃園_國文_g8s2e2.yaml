- id: doc_113_桃園_桃園_國文_g8s2e2_s2_39
  section: 2
  number: 39
  type: single
  page: 6
  stem: 根據文意，文中缺空處填入下列何者最恰當？
  options:
  - label: A
    content: 春光
  - label: B
    content: 夏魂
  - label: C
    content: 秋光
  - label: D
    content: 冬魂
  group_stem: "4.驚蟄  等待甦醒                                                     蒋勳\n\
    節氣就要交驚蟄了，\n蟄伏在土裡沉睡的生命都要驚醒，\n從寒冷黑暗裡探出頭來，\n翻個身，驚奇訝異，\n笑看著大地上新新的      。\n    連續幾天都在觀看北方冬天的樹。在南方的島嶼長大，很少有機會看到樹葉全落\n\
    光的寒林景象。有樹葉的樹，樹葉濃密的樹，樹葉長得快的樹，枝幹多被遮蔽了，不\n容易觀察一棵樹的主幹如何分出眾多杈枒細枝的秩序。\n    樹葉多，濃蔭蓊鬱婆娑，北國寒林，落葉後，樹枝的線條卻簡單潔淨，好像生命\n\
    擺脫了多餘瑣碎，回到本質的單純靜定。\n    宋朝山水有「寒林」一格，像李成就以畫寒林出名，可惜李成真跡傳世不多，後\n人理解不深。\n    大自然的生命和節氣對話，春天多雨水，陽光温暖，便多發枝葉。入秋入冬，北\n\
    國氣温驟降，乾冷飄雪，一棵樹要在嚴寒冷峻的狂風暴雪中生存，必須捨離所有的葉\n片，把養分儲存到根和主幹，才能度過寒冬，用數個月的隱忍等待下一個春天的「復\n\
    活」。\n    歐洲宗教有「復活節」，北方漫長的寒林枯枝景象，使春天來的時候特別顯得喜\n悅。\n    連日來，晨跑的人都停下來，抬頭看樹梢高處一點一點剛剛發芽的閃耀的新綠，\n\
    冬天要過去了，人們臉上也流露著微笑的光。\n    寒冷使生命嚴峻、堅毅、冷静，這是在南國島嶼的温暖中長大的我，應該更謙卑\n學習的吧！\n    我應該在節氣推移間，學習聆聽更多生命的對話。"
