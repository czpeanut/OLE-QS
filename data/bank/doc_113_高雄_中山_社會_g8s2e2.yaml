- id: doc_113_高雄_中山_社會_g8s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 美國人執導的大片「珍珠港」是2001 年發行的歷史劇，又稱為:夏威夷大轟炸。場景壯觀、劇情曲折、演來有如史詩般的磅薄大氣，是值得推薦的一部強檔好片。劇中細細演繹道來日本為何要發動此一「侵略美國本土」的荒謬大戲，也呈現了雙方劍拔弩張的緊張狀態。請問:珍珠港事件扭轉了二戰的局勢，但其所帶來的影響卻不包含下列的何者？
  options:
  - label: A
    content: 開啟二戰的太平洋戰場、造成太平洋戰爭的爆發
  - label: B
    content: 美、中對日正式宣戰，中日戰爭成為第二次世界大戰的一環
  - label: C
    content: 中國也由獨自對日本的抗戰，轉變為與美英等盟國的並肩作戰
  - label: D
    content: 造成戰局的逆轉，中國、美國、英國等陣營轉勝為敗
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 4-1
      title: 中日戰爭
      chapter: 第4章 現代國家的變局
    textbook: 八下歷史 4-1 中日戰爭
    labeled_by: ai
- id: doc_113_高雄_中山_社會_g8s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 中國和外國所簽訂的不平等條約，始於清末的鴉片戰爭的南京條約(1842 年)，接下來，清末又和列強發生諸種的衝突與戰事，造成諸多主權的喪失，如:經濟、司法等主權的失去，讓中國晉身有如「次殖民地」的地位，也讓中國這個泱泱大國嚐盡了羞辱的滋味。然而，革命派人士將清朝推翻了，建立了中華民國，雖然仍有內憂(如:軍閥、中共等)外患(日本)等隱患，但是終於揚眉吐氣了。把關稅自主權收回來了，把不平等條約廢除了，解除了不平等條約的束縛，和英美等列強簽訂了平等新約，讓列強放棄了在華的特權。請問:以上的各發生於下列的那些時段？
  options:
  - label: A
    content: 北伐期間；清黨期間
  - label: B
    content: 十年建設時期；抗戰後期
  - label: C
    content: 抗戰前期；全面性的國共內戰期間
  - label: D
    content: 軍閥割據時期；十年建設時期
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 3-1
      title: 國民政府的成立與建設
      chapter: 第3章 現代國家的挑戰
    textbook: 八下歷史 3-1 國民政府的成立與建設
    labeled_by: ai
- id: doc_113_高雄_中山_社會_g8s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 中國曾經制定過許多的法律，如:民初的臨時約法，但是這個法律在民國17 年北伐完成後就不適用了。之後。中國又為了因應不同時局的需求，而頒布了不同的法律。請問:以下哪一部法律的制定&頒布與「國共內戰」沒有任何關聯、而此一法律也不是在「國共內戰」期間所制定的？
  options:
  - label: A
    content: 《動員戡亂時期臨時條款》
  - label: B
    content: 《戒嚴令》
  - label: C
    content: 《中華民國訓政時期約法》
  - label: D
    content: 《中華民國憲法》
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 4-2
      title: 從國共內戰到中華民國政府遷臺
      chapter: 第4章 現代國家的變局
    textbook: 八下歷史 4-2 從國共內戰到中華民國政府遷臺
    labeled_by: ai
- id: doc_113_高雄_中山_社會_g8s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 日本在明治維新之後，即躋身列強。1929 年爆發世界性的〇〇危機，日本社會受到嚴重的衝擊，日本欲藉著擴張侵略他國，取得資源以穩定局面，使得日本的軍國主義抬頭，鄰近的中國便成為其擴張侵略的首要目標。請問:以上的〇〇所指為何？
  options:
  - label: A
    content: 政治
  - label: B
    content: 文化
  - label: C
    content: 國防
  - label: D
    content: 經濟
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
