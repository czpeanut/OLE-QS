- id: doc_113_高雄_中山_社會_g8s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 宣智上網在搜尋引擎內輸入了一個「關鍵字」，結果出現如下的一大堆資訊。如:聯俄容共政策的施行、黃埔軍校(陸軍軍官學校)的創立、國民黨接受蘇聯的協助、廣州國民政府發起北伐大戰…..等等。請問:宣智所輸出的關鍵字最有可能是下列的何者？
  options:
  - label: A
    content: 日本軍國主義的抬頭
  - label: B
    content: 打倒軍閥以致力於中國的統一
  - label: C
    content: 掃平中共以肅清國家的內亂
  - label: D
    content: 對付袁世凱的竊國稱帝
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 1-3
      title: 軍閥統治與南北分裂
      chapter: 第1章 中華民國的建立
