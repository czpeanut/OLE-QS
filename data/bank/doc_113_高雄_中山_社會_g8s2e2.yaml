- id: doc_113_高雄_中山_社會_g8s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 《建國大業》是2009 年上映的一部中國歷史電影，是慶祝中華人民共和國成立60 周年的獻禮片，票房賣座還不錯，影片內容有刻劃蔣中正在抗戰後的人格形象，當然，大家對於蔣中正的褒貶評價不一，有待大家的檢視。請問：下列何項史事「非」蔣中正所為？
  options:
  - label: A
    content: 軍閥割據時期---採行「聯俄容共」的政策
  - label: B
    content: 十年建設時期----採行「攘外必先安內」的策略
  - label: C
    content: 對日抗戰前期----採用「以空間換取時間」的策略
  - label: D
    content: 抗戰後的國共內戰時期----宣布進入「動員戡亂」時期
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 3-2
      title: 國民政府的內憂與外患
