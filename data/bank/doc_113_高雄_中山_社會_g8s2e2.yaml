    labeled_by: ai
- id: doc_113_高雄_中山_社會_g8s2e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 在高雄的熱河一街附近出現很多「以中國大陸城市為名的街道」，如:瀋陽路、大連街、山東路、吉林街等，不勝枚舉，其實，高雄其它地方也有類似的狀況，曉春對於其中的「廣州街」特別有興趣，因為在中國現代史上，「廣州」是一個舉足輕重的城市，此地是清末民初「革命派人士的大本營」，是孫中山、蔣中正等重量級人物非常重視的地方。請問:下列的哪一項史事並不是發生於此處？
  options:
  - label: A
    content: 孫中山發起的黃花岡之役；護法運動(軍政府的所在地)
  - label: B
    content: 蔣中正發起的清黨運動；九一八事變的發生地
  - label: C
    content: 黃埔軍校(陸軍軍官學校)的創立地點
  - label: D
    content: 國民政府的創立地點；北伐的根據地
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 1-3
      title: 軍閥統治與南北分裂
      chapter: 第1章 中華民國的建立
    textbook: 八下歷史 1-3 軍閥統治與南北分裂
    labeled_by: ai
- id: doc_113_高雄_中山_社會_g8s2e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 如上所述。廣州既然是這麼重要的地方，那麼總該知道它的地理位置吧!請問:廣州在下圖中的何處？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
