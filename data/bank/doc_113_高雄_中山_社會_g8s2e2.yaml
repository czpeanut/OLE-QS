- id: doc_113_高雄_中山_社會_g8s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 中國東北地區，戰略地位重要，有許多天然的良港，盛產煤礦、鐵礦、石油、森林等資源，是兵家必爭之地。日本和俄國就因為爭奪此區而爆發了戰爭，此區也因為被異族統治過，故其建築風格充滿異國的情調。佳樺想要替中國的東北撰寫一篇「地方誌」，請問:哪一件史事可不必列入內文之中？
  options:
  - label: A
    content: 東北王張作霖&其子張學良的傳記
  - label: B
    content: 九一八事變(瀋陽事變)的經過
  - label: C
    content: 溥儀的扶植&滿洲國的成立
  - label: D
    content: 七七盧溝橋事變的前因與後果
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 3-2
      title: 國民政府的內憂與外患
      chapter: 第3章 現代國家的挑戰
