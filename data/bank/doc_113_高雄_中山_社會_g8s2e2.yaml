- id: doc_113_高雄_中山_社會_g8s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 孫中山死後埋葬在南京的中山陵，可見南京這個城市為他所獨愛。南京(古稱===建康===金陵===江寧)是中國古代 的「六朝古都」，歷史文化相當悠久而豐富，然而，其也是抗戰時期「南京大屠殺(日軍屠殺30
    萬人)」的發生地，其慘狀令人噓唏。若是從中國現代政治的角度來看:民國初建，孫中山等革命派人士設南京為===中華民國臨時政府的首都。民國17 年===蔣中正代表的國民黨執政等、也將首都設立在南京(成立----南京國民政府)。請問:以上這兩個政府的設立，跟以下的哪兩件史實相關？
  options:
  - label: A
    content: 清黨；西安事變
  - label: B
    content: 國共內戰；七七盧溝橋事變
  - label: C
    content: 辛亥革命(武昌起事)；北伐成功
  - label: D
    content: 聯俄容共；八年抗戰
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 3-1
      title: 國民政府的成立與建設
      chapter: 第3章 現代國家的挑戰
    textbook: 八下歷史 3-1 國民政府的成立與建設
    labeled_by: ai
- id: doc_113_高雄_中山_社會_g8s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 多啦A 夢坐時光機，飛越到中國的某一個時空，他看到如下的情景:國民黨政府忙著建設中國，實行訓政，教導並訓練人民行使四權；中國發行統一的法幣(由中央銀行等四家銀行發行統一的鈔票)；部分鄉村推動平民教育(當時的中國人90%以上都是文盲)、廣設中、小學；廣築鐵路、公路，發展航空運輸、設立中國最早的空軍等。這一段時期可能是中國現代史上最安定的一段黃金歲月。請問:多啦A
    夢最有可能飛越到的時空應為下列的何者？
  options:
  - label: A
    content: 民國27 年的重慶
  - label: B
    content: 民國37 年的成都
  - label: C
    content: 民國24 年的南京
  - label: D
    content: 民國60 年的台北
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 3-1
      title: 國民政府的成立與建設
      chapter: 第3章 現代國家的挑戰
    textbook: 八下歷史 3-1 國民政府的成立與建設
    labeled_by: ai
- id: doc_113_高雄_中山_社會_g8s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 孫中山的著作建國大綱裡，將國家建設分為軍政、訓政、憲政三個時期，民國17 年以前是軍政(軍人執政===包括袁世凱執政與軍閥割據時期)；民國17 年北伐成功後開始實施訓政，本來預訂民國25
    年就要實施憲政(當時還公布了憲法大綱)，但「因故」拖延了下去。請問:中國開始實施憲政(公布中華民國憲法)，準備要實施民主了，是在下列的何時？
  options:
  - label: A
    content: 北伐期間
  - label: B
    content: 十年建設期間
  - label: C
    content: 八年抗戰(二次大戰)期間
  - label: D
    content: 爆發全面性的國共內戰期間
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 3-1
      title: 國民政府的成立與建設
      chapter: 第3章 現代國家的挑戰
    textbook: 八下歷史 3-1 國民政府的成立與建設
    labeled_by: ai
- id: doc_113_高雄_中山_社會_g8s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 瑞祥想要編纂一本名為:「八年抗戰史(中日戰爭史----二次大戰史)」的書籍。請問:下列哪些事件是不宜列入其中的？
  options:
  - label: A
    content: 蔣中正的清黨；張作霖被日本人炸死
  - label: B
    content: 七七盧溝橋事變；日軍進占上海
  - label: C
    content: 國民政府遷都西南大後方的重慶；日本七三一部隊在東北執行活體實驗
  - label: D
    content: 日本人徵召人民去戰區作軍伕；開羅和雅爾達會議的舉行
  tags:
    chapter:
      publisher: 翰林
