    labeled_by: ai
- id: doc_113_高雄_中山_社會_g8s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 打開中國現代史，其實就是國共間的鬥爭史，國民黨與共產黨間的愛恨情仇，剪不斷，理還亂，彼此之間糾纏不清。然而，回顧過往的歷史，國民黨和共產黨曾經有兩次的合作事蹟(雖然之後關係仍舊破裂)。請問:這兩次的合作，各所指為何？
  options:
  - label: A
    content: 推翻清朝；推翻洪憲帝制
  - label: B
    content: 打倒段祺瑞；消滅中共
  - label: C
    content: 掃除軍閥；對抗日本
  - label: D
    content: 平定中共；對抗蘇聯
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 3-2
      title: 國民政府的內憂與外患
      chapter: 第3章 現代國家的挑戰
