      subject: 歷史
      code: 4-1
      title: 中日戰爭
      chapter: 第4章 現代國家的變局
    textbook: 八下歷史 4-1 中日戰爭
    labeled_by: ai
- id: doc_113_高雄_中山_社會_g8s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 中共的出現、日本的侵擾，是中國現代史上最困擾中國人的內憂外患，這兩者都改變了中國人的命運與遭遇。如果沒有這兩者帶來的災難與禍患，或許中國人的命運會平順一些。中共其實是利用了老天給它的時機而逐步的發展和壯大的，如下的敘述，但其發展時機卻不包含其中的哪個項目？
  options:
  - label: A
    content: 孫中山採行的「聯俄容共」政策
  - label: B
    content: 蔣中正的「清黨」行動
  - label: C
    content: 西安事變的爆發與影響
  - label: D
    content: 八年抗戰(中日戰爭)的時機
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 3-2
      title: 國民政府的內憂與外患
      chapter: 第3章 現代國家的挑戰
