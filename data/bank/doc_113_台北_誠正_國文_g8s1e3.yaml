- id: doc_113_台北_誠正_國文_g8s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 關於張釋之執法一文的文句分析，何者最正確？
  options:
  - label: A
    content: 「縣人來，聞蹕，匿橋下。久之，以為行已過，即出，見乘輿車騎即走耳。」運用簡短、急促的語氣表現縣人的蠻橫無理
  - label: B
    content: 「此人親驚吾馬，吾馬賴柔和，令他馬，固不敗傷我乎？而廷尉乃當之罰金！」言外之意為應該加重對縣人的刑罰
  - label: C
    content: 「一傾而天下用法皆為輕重，民安所錯其手足？」說明法律應與時俱進，否則人民將無所適從
  - label: D
    content: 「良久，上曰：『廷尉當是也。』」可見漢文帝在一番深思熟慮後，從反對到無奈地妥協廷尉的判決
  lesson_raw:
