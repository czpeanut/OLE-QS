- id: doc_113_台北_誠正_國文_g8s1e3_s2_44
  section: 2
  number: 44
  type: single
  page: 4
  stem: 自2025 年起有許多新規定上路，文本並未針對哪一個領域的規定進行說明？
  options:
  - label: A
    content: 旅遊
  - label: B
    content: 稅制
  - label: C
    content: 民生
  - label: D
    content: 交通
  group_stem: '2025 元旦新制重點！

    2025 年來了，與民眾息息相關的民生、旅遊、交通、醫療、稅制、投資等領域都有新規定上路！以下帶你掌握台灣2025 年新制。

    1.基本工資調漲

    時薪從183 元調漲至190 元，月薪2 萬8590 元，這次調漲預計有大約257 萬名勞工受惠。

    2.癌症擴大篩檢

    考量癌症發生年齡有下降趨勢，為降低國人癌症發生率及死亡率，自114 年起，國民健康署放寬癌症篩檢年齡補助，只要符合資格的民眾都可接受免費的定期癌症篩檢，以期早期發現、早期治療。

    114 年衛生福利部 國民健康署擴大癌症篩檢

    | 項目 | 內容說明 |

    | --- | --- |

    | 子宮頸癌 | ˙25 歲至29 歲婦女，每3 年1 次檢查。<br>˙30 歲以上婦女，建議每3 年至少做1 次子宮頸抹片檢查。<br>婦女人類乳突病毒檢測服務：35
    歲、45 歲、65 歲婦女，當年齡1 次。 |

    | 乳癌 | 40-74 歲之婦女，每2 年1 次乳房X 光攝影檢查。 |

    | 大腸癌 | ˙45-75 歲，每2 年1 次糞便潛血檢查。<br>˙40-44 歲有家族史，其父母、子女或兄弟姊妹經診斷為大腸癌者，每2 年1 次糞便潛血檢查。
    |

    | 肺癌 | ˙45-74 歲男性及40-74 歲女性有家族史其父母、子女或兄弟姊妹經診斷為肺癌之民眾。<br>˙50-74 歲重度吸菸者吸菸史達20 包一年以上，每2
    年1 次低劑量電腦斷層(LDCT)。 |

    3.公費流感疫苗1 月1 日擴大辦理

    衛福部疾管署宣布1 月1 日起，公費流感疫苗擴大提供全國超過六個月以上尚未接種的民眾接種，直到疫苗使用完畢為止。疾管署呼籲請65 歲以上長者、高風險慢性病人、學生及學齡前幼兒等盡快接種疫苗，優先獲得保護力。

    4.租金補貼政策放寬

    行政院自2022 年7 月推動「300 億元中央擴大租金補貼專案」，2025 年，除了辦理方式更加簡便，申請年齡放寬至18 歲，如租約上無房東身分證字號也可申請，租金補貼辦理期限延長至2026
    年。

    5.連鎖飯店不提供一次性備品

    永續與環保觀念抬頭，2025 年元旦起，旅宿業者就不能再主動提供一次性旅宿備品，也不可以提供容量小於180毫升的液態盥洗及保養用品，必需改採大瓶裝壁掛式沐浴用品，違者最高可罰6000
    元，有需要可跟櫃台索取或購買。

    6.TPASS 2.0 擴大常客優惠

    交通部為鼓勵更多民眾搭乘公共運輸，推出TPASS 2.0 方案，推動「中央版常客優惠」，1 月14 日起開放民眾上網登錄會員，2 月起開始累計搭乘次數，3
    月底開始有回饋金。

    7.文化幣擴大發放年齡

    文化部自113 年擴大文化禮金對象為16～22 歲，每人領取文化幣1200 點。2025 年更加碼推出13～15 歲試辦計畫，每人發給600 點，也就是從國中起就能透過文化幣進行藝文體驗，可用於看國片、看表演、買書、逛博物館、手作DIY
    或文化體驗旅程等藝文體驗及消費，使用期限至114 年12 月31 日止。 (節錄自景點+網路新聞)'
