- id: doc_113_台北_誠正_國文_g8s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 關於生命中的碎珠一文的文句分析，何者錯誤？
  options:
  - label: A
    content: 「沒有一樣事物，比現在的按鍵電話更能具體地說明這是一個分秒必爭的世界了。」言下之意為講求效率是現今社會成功者的必備條件
  - label: B
    content: 「能掌握時間――尤其是零碎時間――的人，往往也都是令人欽佩仰慕的智者、成功者。」說明點點滴滴的時間，都可能是致勝的關鍵
  - label: C
    content: 「甘迺迪先生，常常在他接見的第一位客人起身離去，第二位客人尚未踏進會客室之前，也必拿起手邊的書籍閱讀，絕不輕易浪費這些短暫的空檔」意近「謂學不暇給者，雖暇亦不能學」
  - label: D
    content: 「零碎的時間應該是生命中的碎珠、沙金、片玉，能勤於撿拾，並集合它們，那的確是一宗可觀的財富！」說明零碎時間的珍貴，並呼應主旨
  lesson_raw:
    title: 生命中的碎珠
    basis: 題目指明「生命中的碎珠一文」
