  number: 13
  type: single
  page: 1
  stem: 關於生命中的碎珠一文的寫作手法說明，下列敘述何者正確？
  options:
  - label: A
    content: 本文一開頭採取「開門見山法」，點出生命是由無數零碎的時間組合而成
  - label: B
    content: 文末設喻說理，強調善用零碎時間的重要
  - label: C
    content: 大量引用正反事例，凸顯時間的重要
  - label: D
    content: 運用先敘後議的方式，從例子推展出結論，探討生命價值
