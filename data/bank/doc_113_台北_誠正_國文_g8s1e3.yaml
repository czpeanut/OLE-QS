  - label: D
    content: 疑惑→羞愧→惱羞成怒
  group_stem: '陳太丘與友期行①，期日中。過中不至，太丘舍去②，去後乃至。

    元方時年七歲，門外戲。客問元方:「尊君在不?」答曰：「待君久不至，已去。」友人便怒曰:「非人哉!與人期行，相委③而去。」元方曰:「君與家君期日中。日中不至，則是無信;對子罵父，則是無禮。」友人慚，下車引之，元方入門不顧。
    (世說新語 方正篇)

    注釋 ①期行：相約同行。 ②去：離開。③相委：捨棄我。'
