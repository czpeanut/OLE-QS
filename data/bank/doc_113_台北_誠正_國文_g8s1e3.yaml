- id: doc_113_台北_誠正_國文_g8s1e3_s2_42
  section: 2
  number: 42
  type: single
  page: 4
  stem: 由文本可知石奢是一位什麼樣的人？
  options:
  - label: A
    content: 知法犯法，私自縱囚
  - label: B
    content: 忠孝兩全，以身殉法
  - label: C
    content: 愚忠愚孝，一無可取
  - label: D
    content: 大義滅親，捨孝求忠
  group_stem: '石奢者，楚昭王相也。堅直廉正，無所阿避①。行縣，道有殺人者，相追之，乃其父也。縱其父而還自繫焉。使人言之王曰：「殺人者，臣之父也。夫以父立政，不孝也；廢法縱罪，非忠也；臣罪當死。」王曰：「追而不及，不當伏罪，子其治事矣。」石奢曰：「不私其父，非孝子也；不奉主法，非忠臣也。王赦其罪，上惠也；伏誅而死，臣職也。」遂不受令，自刎而死。
    (史記 循吏列傳)

    注釋 ①阿避：阿諛上司，迴避過失。'
  tags:
    textbook: 八上 第七課 張釋之執法
    labeled_by: ai
