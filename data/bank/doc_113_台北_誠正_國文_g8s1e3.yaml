- id: doc_113_台北_誠正_國文_g8s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: 生命中的碎珠一文中，引用許多例子來闡述主題，請問下列哪一位同學對於例子的理解有誤？
  options:
  - label: A
    content: 亮亮→胡適藉由「不做無益事，一日當三日，人活五十歲，我活百五十。」來警惕自己不要做無益的事情，才能長壽以享受人生
  - label: B
    content: 仁哥→甘迺迪：「我相信治國的本領，不在頭皮上面，而在頭皮下面。」意指領導者擁有豐富的學識，比有俊俏的外表更重要
  - label: C
    content: 星星→陶淵明：「盛年不重來，一日難再晨，及時當勉勵，歲月不待人。」意近於「莫等閒，白了少年頭，空悲切」
  - label: D
    content: 耿帥→千字文中「尺璧非寶，寸陰是競」的格言意近於「一寸光陰一寸金，寸金難買寸光陰」
