  stem: 象徵溫泉湯煙從浴池裊裊升起的符號，最早出現在1884 年的日本，作為地圖與地形圖上表示溫泉的記號。據說溫泉標誌的三條線有著要泡三次的意思。第一次是剛抵達旅館，先泡五分鐘可暖和身體；第二次是飯後睡前之間，泡八分鐘慢慢享受溫泉；第三次則是隔天一早起床後快速的泡三分鐘可以神清氣爽。請問:下列何者最能解釋日本多溫泉及泡湯文化的原因？
