  stem: 日本四季皆有獨特的風景，如春櫻、秋楓、冬雪，而夏季最能代表日本的就是在夜晚時分點亮夜空開出朵朵煙花的花火。「隅田川花火大會」為日本東京最大型花火大會之一，每年吸引超過90
    萬人前往觀賞。日本導遊提醒觀賞時記得避免站在盛行風向下風處，而導致看變成在看煙霧而非煙火的情形發生。請問:觀賞時要盡量避免站在哪個方向？
