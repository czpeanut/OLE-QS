- id: doc_113_高雄_左營_社會_g8s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '福寶假日追歷史劇時，看到中國某個政權統治下的社會階層，出現如表(一)

    描述的現象。根據表(一)，下列敘述何者正確?


    表(一)

    | 政治 | 中央與地方長官多用「甲」人，漢人、南人通常只能擔任幕僚。 |

    | --- | --- |

    | 法律 | 「甲」人無故殺害漢人、南人，只罰錢或罰站哨兵了事。但漢人或南人打死「乙」人，除處死本人外，也會牽連親屬。 |

    | 科舉考試 | 分左右榜，「甲」人、「乙」人在右榜，題目簡單，上榜容易。漢人、南人在左榜，題目較難，上榜困難。即使上榜，授官職位也低於「甲」人、「乙」人。
    |'
  options:
  - label: A
    content: 「甲」階層的人曾滅遼、西夏、金
  - label: B
    content: 阿拉伯人應屬於「乙」階層
  - label: C
    content: 女真人可能是「甲」人階層的
  - label: D
    content: 此政策是為了維護「乙」族的地位
