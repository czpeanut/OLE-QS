    㺢㹢狓(Okapi)為非洲一特有物種，外觀和斑馬相似，但僅在腿部有環狀白色條紋，屬於瀕危物種，為了保護㺢㹢狓族群而成立了㺢㹢狓野生生物保護區(位於剛果民主共和國)，該保護區境內植物種類相當多，但由於當地存在武裝衝突，種族仇恨是當地內戰及派系分裂對抗的重要因素，加以實施游耕的農業方式，森林遭受嚴重破壞，而政府也因缺乏維護資金，導致保護區生態環境惡劣，於1997
