- id: doc_113_新北_中平_社會_地理_g8s2e3_s1_47
  section: 1
  number: 47
  type: single
  page: 2
  stem: 該國石油主要產自何處？
  options:
  - label: A
    content: 亞丁灣
  - label: B
    content: 幾內亞灣
  - label: C
    content: 撒哈拉沙漠
  - label: D
    content: 納米比沙漠。
  group_stem: '＊根據下文，回答第46~50 題。


    領土面積超過92 萬平方公里，人口超過2 億人的非洲某國，目前為漠南非洲第一大經濟體，境內礦產豐富，為OPEC 成員國。但該國近20 年來，大規模攻擊事件頻傳，該國北部遊牧民族主要信仰伊斯蘭教，約佔該國人口50%，南方農耕民族以基督教信仰為主，雙方人口差距約10%，該國石油礦產主要產自南部海灣地區，南北經濟發展逐漸拉大，隨著全球暖化造成氣候變遷，水資源缺乏及土壤退化等一連串災害不斷壓縮北部游牧民族的生存空間，使得游牧民族必須逐年向南方遷徙，農牧民族交疊的中間地帶便時常爆發衝突。該國為世界主要原油出口國，同時也是非洲最大石油生產國，但卻有近95%的精煉石油產品只能依靠進口，成為少見的主要原油出口國及主要石油產品進口國，因而國際油價上漲時不見得能為該國帶來正面經濟效益，但油價下跌恐造成更大經濟損傷，而過度仰賴石油的經濟也排擠了「甲」、橡膠、棕櫚油的競爭力。'
