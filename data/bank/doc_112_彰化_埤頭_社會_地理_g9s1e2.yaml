  section: 1
  number: 15
  type: single
  page: 1
  stem: 根據上文推論，美國將派員至哪一國家協助移民問題？
  options:
  - label: A
    content: 墨西哥
  - label: B
    content: 古巴
  - label: C
    content: 巴拿馬
  - label: D
    content: 巴西。
  group_stem: 美洲移民數量面臨失控，美國將派員協助控管！美國政府近日表示，會派遣官員前往中美洲與南美洲交界國，協助當地政府建立移民遴選機制與訓練邊境管制人力。由於疫情、治安與內戰等影響，從南美洲穿越中美洲的移民人數在近年來逐漸增加，讓美國與中美洲國家面臨龐大壓力。因為疫情、中美洲國家治安敗壞與委內瑞拉內戰等因素影響，過去三年逃往美國的移民數再創新高，拜登政府雖然與中美洲各國簽約，並加強邊境管理與取締，但還是無法將人數降低。2022年約有25萬人踏上這條世界最危險的移民路線-從南美洲出發，一路向北，穿越達連隘口（Darién
    Gap）原始叢林，抵達中美洲第一站巴拿馬。這條路線未經開發、野生動物四伏、地勢環境惡劣，同行亦有強盜與人口販子出沒，必須隨時警戒；而且全程由販毒集團掌控，自由受限、處處剝削。無國界醫生組織警告，許多移民是婦女與小孩，容易在途中面臨被強暴與喪命的威脅。請回答15-19題：
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
