  - label: D
    content: 多元文化。
  group_stem: 臺北市政府成立「臺北國際藝術村」，邀請國內外藝術家展出作品，主要呈現藝術打破國界、領域、空間限制的創作。自2008 年8 月止，藝術村已接待35
    個國家，200 多位國際藝術家來臺北做駐市藝術家，和臺灣的藝術家交流，另外也派出臺灣藝術家到各國觀摩、學習、駐市。
