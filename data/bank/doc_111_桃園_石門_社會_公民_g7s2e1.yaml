  section: 2
  number: 23
  type: single
  page: 3
  stem: 越南政府對宗教制定法律的做法，凸顯何種問題造成的影響？
  options:
  - label: A
    content: 次文化
  - label: B
    content: 文化位階
  - label: C
    content: 文化差異
  - label: D
    content: 多元文化。
  group_stem: 新聞報導：越南政府為維護傳統信仰，近年通過一項法律，明定宗教不能影響國家團結與公共秩序，而此法的制定被用來壓迫國內少數民族信仰的基督教。許多基督教徒因此失去工作，家中學童被迫休學，社會福利也遭到中止。更有信仰者因此受到暴力對待，施暴者卻受到公權力支持，導致部分基督教徒心生恐懼，考慮放棄信教。
