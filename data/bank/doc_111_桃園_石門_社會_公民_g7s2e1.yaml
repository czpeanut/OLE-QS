  stem: '報紙刊登一則社會評論如以下所示，對於該社群媒體官方的宣示。下列何項敘述可以說明此段文字？

    在發生宗教大屠殺事件後，有社群媒體官方正式宣布，將嚴厲掃蕩關於宣揚自我文化優越的言論和文章，以防止對特定種族、宗教攻擊事件的發生。'
