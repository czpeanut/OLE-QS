  stem: 為了保障民眾的健康，臺北市消保官依據《食品安全衛生管理法》的規定，抽查商家所使用的食用炸油是否符合標準，並針對未符合標準者給予罰款處分。上述做法可以用下列哪一敘述內容說明呢？
