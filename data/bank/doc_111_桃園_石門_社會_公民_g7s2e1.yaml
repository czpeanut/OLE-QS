  stem: 臺灣藝術家願意在創造自己的藝術文化時，藉由「臺北國際藝術村」的成立，也吸納各國藝術文化相互交融，顯示臺灣藝術家具備下列何種精神？
  options:
  - label: A
    content: 永續發展
  - label: B
