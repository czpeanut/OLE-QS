  group_stem: "（五）\n 【甲】水潺潺巉石間，與石皆作藍靛色。導人謂此水源出硫穴下，是沸泉也。余以一指試之，猶熱甚。\n             \
    \                                                 ──郁永河《裨海紀遊》\n 【乙】湯泉，在湯圍，廳治南四十里。遠望熱氣蒸騰，泉中若沸，附近田園多被泡傷。土人無冬夏，澡浴於此。\
