  group_stem: "（三）\n    鄭國公 魏徵，少時好道學，不信鬼神。嘗訪道至恆山，將及山下，忽大風雪，天地昏暗，不能進。忽有道士，策青竹杖，懸《黃庭經》，亦至路次①。謂徵曰：「何之？」徵曰：「訪道來此，為風雪所阻。」道士曰：「去此一二里，予家也，可一宿會語乎？」徵許之，遂同行，至一宅，外甚荒涼，內即雕刻。延徵於深閣，對燈火而坐，進以美酒嘉餚。從容論道，詞理博辨，徵不能屈。臨曙，道士言及鬼神之事，徵切言不能侵正直也。道士曰：「子之所奉者仙道也，何全誣鬼神乎？有天地來有鬼神，夫道高則鬼神妖怪必伏之；若奉道自未高，則鬼神妖怪，反可致之也。何輕之哉？」徵不答，及平旦，道士覆命酒以送徵，仍附一簡，達恆山中隱士。徵既行，尋山路，回顧宿處，乃一大塚耳。探其簡，題云：「寄上恆山神佐。」徵惡之，投於地，其簡化一鼠而走。徵自此稍信鬼神。」\n\
    \                                                                ──《太平廣記．魏徵》\n\
    \     【注】①路次：路途中。"
