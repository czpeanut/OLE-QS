- id: doc_113_高雄_五福_國文_g9s1e1_s4_12
  section: 4
  number: 12
  type: single
  page: 7
  stem: 根據本文，作者認為李清照「真正延續萬世的名譽」，其原因最可能為下列何者？
  options:
  - label: A
    content: 勇敢離婚，不委屈自我的勇氣
  - label: B
    content: 優雅的才情與卓絕的文學地位
  - label: C
    content: 對自我的深刻反省及道德要求
  - label: D
    content: 忠於自我，敢於挑戰世俗眼光
  group_stem: "（六）\n    我想舉閨秀詞人第一的李清照為例，她曾在晚年下嫁張汝舟，原來只想在晚年時讓顛沛流離中疲憊的身心得到休憩，她渴望過幾年實在的日子，擁有一個家；誰知，這個張汝舟竟然是不良之徒，他以一個奸商的目光，看上了李清照在離亂中已經所剩無幾的文物，所謂結婚只是詐騙的一個手段，等到文物到手，他立即對李清照拳腳相加，百般虐待。李清照知道生命的珍貴，知道良善高雅不應該在凶惡橫蠻前自甘滅亡，因此不顧輿論的訕笑，在結婚三個月後向官府提出解除婚姻的訴訟。\n\
    \    李清照知道宋朝法律，妻子上告丈夫，即便丈夫真的有罪，妻子也要被判兩年徒刑。但她寧肯被官府關押，寧肯審案時在大庭廣眾之下與無賴張汝舟對質，丟盡臉面，也要離婚。\n\
    \    沒有任何文字資料記載李清照出庭時的神態以及她與張汝舟的言詞交鋒，但是可以想像那都不是我們願意看到和聽到的。為了達到離婚的目的她必須訴苦，但只要訴苦就等同把自己放置到了博取人們同情的低下地位上，這是她最不肯做的，更何況即便訴苦成功，所有旁觀者的心中都會泛起「自作自受」四個字。我們只知道，這次上訴的結果，張汝舟被問罪，李清照也被關押，但離婚是成功了。李清照沒有被關押太久，由於一位朝中親戚的營救，她在九天後出獄。出獄後立即給營救她的那位親戚寫信，除了感激，更多的是擔心自己的名譽，曾寫下「清照敢不省過知慚，捫心識愧。責全責智，已難逃萬世之譏；敗德敗名，何以見中朝之士」、「雖南山之竹，豈能窮多口之談；惟智者之言，可以止無根之謗」。\n\
    \  千千萬萬不知道李清照命運悲劇的讀者，卻在心中一直供奉著一個無限優雅的李清照。這是一種虛假嗎？還是一種比表層的真實更深的真實？真希望飽學之士們不要嘲笑後代讀者對於李清照命運悲劇的無知，這種無知正體現了一種歷史的過濾和選擇。那些連李清照本人也擔心「難逃萬世之譏」的惡名並未長久延續，真正延續萬世的名譽，在當時被大家忽視了，包括李清照自己。\n\
    \                                                      \n                    \
    \                                          ──改寫自余秋雨〈關於名譽〉"
