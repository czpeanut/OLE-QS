  - label: D
    content: 利國福民
  group_stem: "（二）\n    我們讀歷史，要盡量讓自己回到那個年代，設身處地用他們的想法來看事情，不能用我們現在的價值觀任意曲解訕謗，這才是尊重歷史。我們現在不太能夠理解「復興漢室」、「忠君」這一類的想法，但在那個時代，卻是他們立身處世重要的價值。千古以來，別說民間百姓，大部分讀書人都敬重諸葛亮，原因實在很複雜。劉備自從得到他，事業才開始有了根據地，關、張、趙這些英雄才有了用武之地；蜀漢在他的治理下，民生豐饒，路不拾遺，他連經濟、水利都展現政治長才，這是他的才能。他的沉穩、灑脫，氣定神閒，融合儒、道二家士人的風度涵養，這是他的修養。堅持到底、士為知己者死，這是他的精神。整個來說，大家喜歡他的，還是他的人格！歷史考證可以掌握斷簡殘篇，告訴我們何者為真，何者為偽；然而文學掌握的是信念，是一種精神。文學家誇張情節，渲染歷史，無非要強化一分不可動搖的價值\n\
    \                                                              ──宇文正〈一家子三國〉"
