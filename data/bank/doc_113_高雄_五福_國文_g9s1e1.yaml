- id: doc_113_高雄_五福_國文_g9s1e1_s4_13
  section: 4
  number: 13
  type: single
  page: 8
  stem: 根據本文，下列敘述何者正確？
  options:
  - label: A
    content: 粥具備養生功能的紀錄，最早出現於唐代
  - label: B
    content: 引用余光中的詩，說明粥有春泥潤物功能
  - label: C
    content: 「它很隨和、很坦白、很善良」，所以粥適合身體虛弱者食用
  - label: D
    content: 因為經濟的好轉，粥的成分更為豐富，吃粥增添了一份閒適感
  group_stem: "（七）\n    童年時寄養在外婆家，早餐多吃番薯粥，總是一邊吃，一邊聽聞外婆餵養雞鴨的聲音，不知不覺天就亮了。\n    粥因所摻配料不同而變化無窮，富貴者如燕窩粥、鮑魚粥、水蟹粥；清淡者如百合粥、筍絲粥、大麥粥、荷葉粥等等。番薯粥是粥中之質樸者，一介布衣的樣子。它很隨和、很坦白、很善良，可以簡單搭配豆腐、蛋、醬菜，也可以豪華到有魚、有肉、有鮮蔬。貧困的年代喝粥，令粥顯得寒磣①；小康時吃粥，總是帶著閒適感，謙遜而健康的暗示。\n\
    \    粥的養生功能自古即知，荀子慨言：「其求物耶，養生耶，粥壽。」唐代《食醫心鑒》收粥品五十七方，宋代官修《聖濟總錄》收了一百一十三品，清代《粥譜》收錄的粥品已達二百四十七方。\n\
    \    臺灣人常吃的番薯粥，在數百種粥品中獨樹一幟，它不像廣東粥煮得細稠融化，而是稀飯般米粒分明，又入口即化，完全不勞牙齒來幫忙。粥中的番薯可絲、可丁、可塊，我較不愛刨成絲狀的番薯籤，而鍾愛飽滿的地瓜塊。鮮黃的番薯在清白的粥裡，兩者結合得非常幸福。\n\
    \    地瓜的胸襟廣闊，葷素俱佳，能稠能稀，濃淡都可。很多人吃膩大魚大肉，渴望有一碗清粥，那是絢爛之後的平淡，經歷熱鬧之後想要的寧靜；往往看盡人間的繁華，才懂得享受掌聲消失後的孤獨寂寞。\n\
    \    番薯粥有一種溫柔體貼的特質，寧靜、同情、撫慰人心，尤其適合身體孱弱、腸胃虛脫時，如春泥潤物，易吸收營養，能減輕人體的負擔，帶著療養的期待。余光中〈粥頌〉敘述稚歲時吃番薯粥：\n\
    \        安慰渴口與饑腸\n        病了，就更加苦盼\n        你來輕輕地按摩\n        舌焦，唇燥，喉乾\n      \
    \  與分外嬌懦的枯腸\n    有一段時間的週末，特地趕早回家熬一鍋番薯粥給妻吃，長期化療的人胃口差，得設法喚醒她的味蕾。番薯粥總是滾燙著熱情，熱騰騰一碗下肚最能按摩身心。我喜歡粥裡的地瓜大塊一點，地瓜削皮後用刀後端輕斫，順勢裂開成不規則塊狀，跟斫白蘿蔔一樣，儘量挽留其纖維，不令碎斷；雖然形狀凹凸不齊，但，幹嘛整齊？口感才要緊。\n\
    \    米先浸泡半小時再煮，煮開後加入番薯同煮，滾沸時轉小火，用勺稍加攪動，叫米湯穩定地沸，叫它不要滿溢，靜待它飄散清香，雲淡風輕般，飄散著一種深刻的氣味。妻重病復發一年餘，我的生活確實異常忙碌，或許這也算是修行吧，越忙碌越能練習氣定神閒的態度。我故意不用電鍋煮番薯粥；守在爐火邊，像守著珍惜的歲月、情感和記憶，那樣耐心而堅定地守著。\n\
    \                                                    ──焦桐《味道福爾摩莎‧番薯粥》節錄\n  【注】①寒磣：丟臉、不光彩。磣，音‧ㄔㄣ。"
