  type: single
  page: 1
  stem: 衛福部人員提到，部分人員對家庭暴力事件有責任依法通報，其所依據的法律應是何者？
  options:
  - label: A
    content: 性別平等教育法
  - label: B
    content: 家庭暴力防治法
  - label: C
    content: 民法
  - label: D
    content: 刑法
  group_stem: 隨着近年家暴通報數量增加，衛福部人員認為，一方面是政府努力宣導，讓大眾知道家暴可以求助；另一方面透過修法增加責任通報人員，例如：納入移民業務人員、村里幹事等，讓更多人可以介入，也是家暴通報量增加的原因之一。此外，政府呼籲民眾應該多關心身邊的人，若看到類似家暴事件，可以「雞婆」一點幫忙通報，及早制止悲劇發生。
