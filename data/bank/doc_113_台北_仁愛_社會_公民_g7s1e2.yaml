    content: 代理孕母可向委託配偶要求精神補償或身體服務等費用
  - label: D
    content: 代理孕母懷胎期間若反悔，可以隨時終止契約
  group_stem: '行政院衛福部日前提出《人工生殖法》修正草案，將以往僅限有婚姻關係的異性戀夫妻得接受人工生殖，現在擬開放同性伴侶、單身女性皆可合法人工生殖，只要一方能提供健康的生殖細胞，就能讓有生育需求的國人，能藉由代理孕母的子宮，配合生殖技術的協助，達到生育子女的目的，草案中並納入代理孕母的規範。

    代孕生殖以「互助」為原則，明定當代孕母僅能一次，並禁止商業目的，故代孕需以「無償」為之，主管機關得定一定金額，提供代理孕母營養費或營養品，以及必要的檢查、諮詢、醫療、照護、交通、委任律師、保險、工時損失、產後護理等相關費用。

    針對代理孕母資格，限制在需年滿二十歲、未滿四十歲的我國戶籍居民，避免高齡生育風險，並禁止委託配偶於代理孕母懷有代孕生殖胎兒期間終止契約，以保障代孕子女的權益。'
