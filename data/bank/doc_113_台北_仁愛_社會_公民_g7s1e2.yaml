  section: 2
  number: 13
  type: single
  page: 1
  stem: '四個朋友分享家庭近況如下所示，由對話內容判斷，哪兩人的家庭型態較相似？

    小祥：「我家的小姑姑和小叔叔每天吵個不停，我耳膜都快破了。」

    小俊：「我媽媽為了汰換舊車和奶奶冷戰了一個月，我跟我爸爸夾在這兩個女人中間好痛苦。」

    小靜：「我爸爸最怕弟弟請病假，因為他是我們家唯一的大人，請假照顧弟弟，全勤獎金就泡湯了。」

    小蓉：「我媽媽跟嬸嬸、伯母每次都為了輪到誰煮飯、誰打掃的事，相互指責，煩死了。」'
