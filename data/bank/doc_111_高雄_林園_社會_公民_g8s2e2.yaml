- id: doc_111_高雄_林園_社會_公民_g8s2e2_s1_31
  section: 1
  number: 31
  type: single
  page: 1
  stem: 新聞報導一名70 歲的老先生酒駕，被警方攔下後，不僅以言語辱罵對方，還出手攻擊臨檢的員警，事後老先生解釋當時因為喝醉酒而神智不清，所以完全沒有辨識能力，才導致行為不當，但警方仍將他移送法辦。關於老先生所應負擔刑事責任的說明，下列何者正確？                                              【習作】
  options:
  - label: A
    content: 因已經高齡70 歲，為限制責任能力人，依法得減輕其刑
  - label: B
    content: 因為當時有精神障礙，已沒有辨識能力，不需負擔刑責
  - label: C
    content: 其當時已有心智缺陷，只需負擔部分責任並可減輕刑責
  - label: D
    content: 雖酒醉但無精神障礙或心智缺陷，須承擔完全刑事責任
  answer:
  - D
  answer_source: answer_key_vlm
