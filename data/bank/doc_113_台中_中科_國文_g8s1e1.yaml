    宇宙從何而來？它為什麼、並如何開始？它有末日嗎？這些是大家都感興趣的問題，卻只有極少數的專家能掌握解釋這些問題所需的數學。不過，關於宇宙起源的基本概念，其實可以離開數學，以一種未受過科學訓練的人也能理解的方式來陳述。有人告訴我，我放在書中的每一個方程式都會讓銷售量減半，然而，我終究用了愛因斯坦著名的
    $E=MC^2$，希望這麼做沒嚇跑一半我的潛在讀者。（改寫自史蒂芬·霍金《時間簡史》書前謝辭）'
