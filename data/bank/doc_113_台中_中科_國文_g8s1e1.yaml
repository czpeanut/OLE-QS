- id: doc_113_台中_中科_國文_g8s1e1_s3_2
  section: 3
  number: 2
  type: single
  page: 1
  stem: '關於古體詩與近體詩的格律比較，下列哪一位同學的說明是正確的？

    <u>承霖</u>：無論是古體詩還是近體詩，偶數句一定要押韻，而且一韻到底

    <u>承翰</u>：近體詩成熟時期為漢代，代表作品為《古詩十九首》，《古詩十九首》最早收錄在《昭明文選》中

    <u>靖岳</u>：近體詩可分為絕句、律詩兩類，每首絕句四句，律詩八句，兩者皆講究平仄與對仗

    <u>承育</u>：古體詩的格律規定相較於近體詩來的寬鬆，句數、字數、平仄皆沒有限制'
  options:
