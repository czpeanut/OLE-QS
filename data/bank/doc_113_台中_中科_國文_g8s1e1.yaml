  group_stem: '▲閱讀下文，回答第 26 - 27 題

    一月底，跟隨無線電訊號來到溪邊的山腰，大約傍晚 6 點，濃密枝叢中傳來的「嗚呼……」透露令人驚喜的秘密——原來，我們追蹤的母黃魚鴞是有夫之婦！在人們準備迎接農曆新年的同時，黃魚鴞夫婦也為了新生命而忙碌。

    全世界逐水而居的魚鴞只有 7 種，其中 4 種住在亞洲。黃魚鴞雖是臺灣體型最大的貓頭鷹，但比起亞洲魚鴞的大哥大——毛腳魚鴞仍矮上一個頭。一個黃魚鴞家庭所需的溪段長達
    5～8 公里，且周邊要有廣大的原始林方能維生。藏身隱祕加上分布密度低，無怪乎牠們是臺灣目前最晚被發現的留鳥。

    黃魚鴞＿＿＿＿＿＿＿＿。低沉的「嗚呼……」是最常聽到的叫聲，由公鳥先鳴，母鳥隨即附和。另一種常聽到的叫聲則在巢樹邊。完成配對的母鳥約在二月底產卵，入夜後的低溫使母鳥必須寸步不離的孵卵，甚至長達
    40 個小時窩在巢中，以確保辛苦誕育的小生命不致失溫死亡。因此，當公鳥在巢位附近「嗚呼……」，母鳥便發出音頻 2000～6000Hz 的長哨音「咻……」，似乎在告訴公鳥「餓啊！」那一年，是我們首次完整觀察黃魚鴞的育雛過程，許多夜裡按牠們的習性日入而作，守在巢樹附近熄燈聽著猶如沖天炮的「咻……」，偷偷記錄牠們的一點一滴。

    黃魚鴞位在溪流食物鏈的頂層，故能反映棲地環境的健康與否。日本北海道的毛腳魚鴞被阿依努族奉為守護神，其實，臺灣的黃魚鴞也在每年春節施放沖天炮，默默為我們的生態環境祈福。

    （改寫自汪辰寧〈黃魚鴞的新年祈福〉；孫元勳、吳幸如《暗夜謎禽黃魚鴞》）'
