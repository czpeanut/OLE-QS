- id: doc_113_新北_中平_國文_g7s1e1_s4_1
  section: 4
  number: 1
  type: single
  page: 1
  stem: 以下關於夏夜一詩的敘述，何者正確？
  options:
  - label: A
    content: 「火紅的太陽也滾著火輪子回家了」此句屬於靜態的描寫，宣告夏夜的降臨
  - label: B
    content: 「撒了滿天的珍珠和一枚又大又亮的銀幣」給人富麗的感覺，呈現「月明星稀」的景象
  - label: C
    content: 「只有窗外瓜架上的南瓜還醒著，伸長了藤蔓輕輕地往屋頂上爬」凸顯夏夜萬籟俱寂
  - label: D
    content: 「只有綠色的小河還醒著，低聲地歌唱著溜過彎彎的小橋」，具有以聲音反襯環境寂靜的作用
  lesson_raw:
    title: 夏夜
    basis: 題目指名「夏夜一詩」
  tags:
    textbook: 七上 第一課 夏夜
    labeled_by: ai
    chapter:
      publisher: 翰林
