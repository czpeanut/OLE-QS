- id: doc_113_新北_中平_國文_g7s1e1_s4_2
  section: 4
  number: 2
  type: single
  page: 1
  stem: 關於夏夜一詩的寫作手法，下列敘述何者正確？
  options:
  - label: A
    content: 作者擅長運用擬人化的動詞，營造活潑的夏夜氛圍
  - label: B
    content: 第一節詩描寫出夏夜的安詳靜謐，第二節詩描繪出夏夜的熱鬧喧囂
  - label: C
    content: 運用了許多疊字詞，在誦讀時可形成沉重遲緩的效果
  - label: D
    content: 依照時間「中午而黃昏而深夜」的順敘所寫，透過兒童口吻並發揮想像力，描繪夏夜景象
  lesson_raw:
    title: 夏夜
    basis: 題目指名「夏夜一詩」
  tags:
    textbook: 七上 第一課 夏夜
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 七上
      subject: 國文
      code: 第一課
      title: 夏夜
      chapter: null
- id: doc_113_新北_中平_國文_g7s1e1_s4_3
  section: 4
  number: 3
  type: single
  page: 1
  stem: 下詩句描述的對象何者錯誤？
  options:
  - label: A
    content: 我是一群不偷懶的小工人／搬不動哥哥的故事書／拉不走姐姐的花毛線／我們來抬小妹妹吃剩下的碎餅屑／下雨了／有小菌子給我們撐起了最漂亮的傘／過河了／有花瓣兒給我們搖來了最穩當的船→小螞蟻
  - label: B
    content: 一對相戀的魚／尾巴要在四十歲以後才出現／中間隔著一道鼻梁／這輩子怕是無法相見了→眉
  - label: C
    content: 出了伊甸園╱再直的路╱也走得曲折蜿蜒╱偶爾也會停下來╱昂首╱對著無止無盡的救贖之路╱嗤嗤╱吐幾下舌頭→蛇
  - label: D
    content: 憂愁夫人的灰色的面紗／快樂王子的痛苦的眼淚／把我屋子裡的太陽輕輕網住，把我窗外的葉叮叮噹噹的敲響／哎！我再也不能入睡，再也不能入睡→雨
  tags:
    textbook: 七上 第一課 夏夜
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 七上
      subject: 國文
      code: 第一課
      title: 夏夜
      chapter: null
- id: doc_113_新北_中平_國文_g7s1e1_s4_4
  section: 4
  number: 4
  type: single
  page: 1
  stem: 下列各歌詞，何者運用「擬人」修辭技巧？
  options:
  - label: A
    content: 我住在霓虹的城市／握著飛向天堂的地址／你可以翱翔／可是我只能停滯（盧廣仲刻在我心底的名字）
  - label: B
    content: 想見你／只想見你／未來過去／我只想見你／穿越了／千個萬個／時間線裡／人海裡相依（八三夭想見你）
  - label: C
    content: 我嫉妒你的愛／氣勢如虹／像個人氣高居不下的天后／你要的不是我／而是一種虛榮／有人疼才顯得多麼出眾（陳勢安天后）
  - label: D
    content: 下過雨的夏天傍晚／我都會期待／唱歌的蟬／嘿／把星星都吵醒／月光曬了很涼快（孫燕姿第一天）
  tags:
    textbook: 七上 第一課 夏夜
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 七上
      subject: 國文
      code: 第一課
      title: 夏夜
      chapter: null
- id: doc_113_新北_中平_國文_g7s1e1_s4_5
  section: 4
  number: 5
  type: single
  page: 1
  stem: 有關胡適母親的教誨一文的分析，下列敘述何者正確？
  options:
  - label: A
    content: 主旨為母親書寫行狀事略，藉此表揚母親的偉大
  - label: B
    content: 拿歷史上有名的母親典範，與自己的母親來比較
  - label: C
    content: 善用對話與家鄉方言，使人物形象更加具體生動
  - label: D
    content: 採第三人稱的口吻回憶母親寬嚴並濟的教育方式
  lesson_raw:
    title: 母親的教誨
    basis: 題目指名胡適「母親的教誨」
