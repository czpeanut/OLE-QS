  group_stem: "你曾經見過鑄劍嗎？燒得通紅的鐵條，從爐裡箝出，至於鐵砧上用力錘打，沒入涼水，讓它冷卻，又重新放入爐中。就這樣一遍又一遍，直到它成為百鍊的精鋼，削鐵如泥的利器。\n\
    \  鋼鐵就像人，受的煉燒愈深，它的力量愈韌；受的淬浸愈冷，它的意志愈堅；受的磨礪愈細，它的鋒刃愈利。所以同樣是平凡的鐵砂，經過不同的冶鍊，有的成為生鐵，鑄造笨重的器物；有的成為鍛鐵，製造精密的儀表；有的成為鋼鐵，塑造刀刃與槍砲。\n\
    \  「再三地燃燒自己以求塑造，再三地燃燒自己以求鋒利。」能這樣的鐵砂，就能成鋼；能這樣的凡夫，就能成偉人。\n（劉墉〈鑄劍〉）"
