- id: doc_113_新北_中平_國文_g7s1e1_s4_16
  section: 4
  number: 16
  type: single
  page: 3
  stem: '陶淵明曾經說過甲「盛年不重來，一日難再晨，及時當勉勵，歲月不待人。」千字文中也有「尺璧非寶，寸陰是競」的格言。而宋代大儒歐陽脩，更是一個善於利用零碎時間的生活藝術家。他常利用「三上」的功夫構思文章，何謂「三上」乙那便是「枕上、廁上、馬上」。生活在今天的我們，如果每天也能利用這些短暫的時間，有恆地記誦一首唐詩丙宋詞、一句格言或背幾個英文單字，一年下來，該有多少的收穫啊丁

    （陳幸蕙 生命中的碎珠）

