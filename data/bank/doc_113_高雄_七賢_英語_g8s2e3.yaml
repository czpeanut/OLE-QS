  stem: What do we know about the earthquake in Myanmar(緬甸)?
  options:
  - label: A
    content: It made the weather very cold.
  - label: B
    content: It brought more visitors from other places.
  - label: C
    content: It helped the country become more famous.
  - label: D
    content: It made many buildings and roads break.
  group_stem: "Myanmar Earthquake \nOn a quiet evening in Myanmar, a strong earthquake\
    \ shook the ground. It happened near the middle of the country and surprised many\
    \ people. The earthquake was very powerful, and many buildings fell down. Roads\
    \ had big cracks, and people ran out of their homes quickly. Some schools and\
    \ houses fell down, and sadly, a few people got hurt. \n \nAfter the earthquake,\
    \ rescue workers came quickly. They worked all day and night to help people. Some\
    \ teams from other countries also came to help. Everyone tried their best to save\
    \ lives and give food and water to those in need.  \n \nMany people had to sleep\
    \ outside because they were afraid of more shaking. Some families lost their homes\
    \ and had nowhere to go. The government set up tents and gave food to help them.\
    \ Doctors and nurses also helped take care of the sick and injured.  \n \nThis\
    \ earthquake reminded everyone how important it is to be ready for natural disasters.\
    \ People should know what to do when an earthquake comes. They should not use\
    \ the elevator and should try to stay calm. It’s also a good idea to prepare an\
    \ emergency bag with water, food, and a flashlight.  \n \nIn the future, Myanmar\
    \ hopes to build stronger houses. By learning from this event, the country can\
    \ be safer for everyone. \n\n Myanmar 緬甸;  cracks 裂縫;  rescue 救援;  government\
    \ 政府;  tents 帳篷;  injured 傷者;  remind 提醒;  disasters 災難;  calm 冷靜;  emergency\
    \ 緊急;  flashlight 手電筒"
