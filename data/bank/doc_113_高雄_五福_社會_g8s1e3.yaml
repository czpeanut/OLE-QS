  group_stem: '【史料一】：康有為〈請禁婦女裹足折〉

    而衛生實有所傷（裹足對於人的衛生有傷害），血氣不流，氣息污穢，足疾易作，上傳身體，或流傳孫子，奕世（代代）體弱，是皆國民也，羸弱（病弱）流傳，何以為兵乎？試觀歐、美之人，體直氣壯，為其母不裹足，傳種易強也；回觀吾國之民，尪弱纖僂（病弱纖細，彎腰屈背），為其母裹足，故傳種易弱也。今當舉國徵兵之世（全國徵兵的時期），與萬國競，而留此弱種，尤可憂危矣。

