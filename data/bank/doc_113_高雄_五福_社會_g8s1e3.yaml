  stem: '自1953 年韓戰停戰以來，至2024 年7 月27 日已滿七十一年，南韓與北韓的人均國內生產毛額(GDP)的差距已經拉大到53 倍。期間因北韓不斷進行核武、飛彈開發，導致兩韓關係緊張，使兩國的人員往來中斷。試問：關於南、北韓兩國的敘述，下列何者正確？

    | | (A)礦產 | (B)位置 | (C)生長季 | (D)政治體制 |

    |---|---|---|---|---|

    | 北韓 | 較多 | 停戰線以南 | 較長 | 民主 |

    | 南韓 | 較少 | 停戰線以北 | 較短 | 共產 |'
  options:
  - label: A
    content: 礦產
  - label: B
    content: 位置
  - label: C
    content: 生長季
  - label: D
    content: 政治體制
