    content: 建中：認識到清廷負責對外事務從理蕃院到外務部。
  group_stem: "【閱讀素養題】資料來源：杜正勝，《中國文化史》\n    對傳統的統治者而言，朝貢制度是對藩屬國的一種恩賜。所以乾隆在給英王的敕諭中就說：「天朝物產豐盈，無所不有」，根本不需要靠「外夷」的貨物來互通有無。……因鴉片問題引起的商業戰爭，和各種不平等條約的簽訂，使得閉關自守、自給自足的大清帝國，慢慢納入國際性的政治、法律體系，進入西方條約體系。\n\
    \    當馬戛爾尼觀見乾隆時，雙方為了究竟要行「三跪九叩」之禮，或照英國習慣，屈膝親吻皇帝御手而争執不下。1815 年，英國使臣又因堅持不願跪叩，拒見嘉慶皇帝。嘉慶在盛怒之餘說：「中國為天下共主，豈能如此侮慢倨傲」。表面上看起來，雙方爭的似乎是禮節儀式，其實卻反映中國傳統天下觀，和西方現代平等國際觀的衝突。在傳統的天下觀中，中國在處理對外關係與藩屬各國的關係時，都由禮部和「理藩院」負責。1861\
    \ 年，第二次英法聯軍之役後，清廷被迫在北京成立了「總理各國事務衙門」。在西方各國的堅持，中國成為國際社會的一員，開始引進「萬國公法」（國際法），允許各國設立常駐中國的使領館，並派遣常駐各國的外交代表。\n\
    \    八國聯軍攻打北京之后，清政府又在1901 年，依照辛丑條約的規定，將「總理衙門」正式改為「外務部」。由勉勉強強的「籌辦夷務」，到慎重其事地把外交當成國家首要之務，說明了中國從一個自給自足、自尊自大的傳統帝國，到一個門戶洞開、走向世界的現代國家的深刻轉變。"
