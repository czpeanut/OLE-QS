  stem: 「K-POP」是Korea 和POP 的合成詞，代表西元2000 年後席捲亞洲、進軍歐 美的韓國流行音樂，促使韓國音樂及文化產業擴大，成為一股新浪潮，進而帶動韓國其他本土產業的發展，像是：電影、美食、美妝、電子等。韓國
    文化產業振興院(KOCCA)於2024 年2 月宣布：預計推動流行音樂產業支援方案，將投入327 億韓元。試問：南韓文化產業多藉由下列何種策略來提高自身的附加價值，並增加經濟產值？
  options:
  - label: A
    content: 大量生產降低賣價，藉此提高銷售量
  - label: B
    content: 規定國民只能購買南韓偶像的周邊商品
  - label: C
    content: 政府大力支持產業的積極態度與策略
  - label: D
    content: 禁止本國藝人出國，確保國內市場熱度
