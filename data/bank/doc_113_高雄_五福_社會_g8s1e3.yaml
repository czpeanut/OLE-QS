    慈禧的新政似較戊戌百日維新時所舉之條目為多，其實全未出光緒帝當時變法之範圍，更未出劉坤一、張之洞所建議之範圍，不過分一事為數詔，延百日為五年而已。

    【材料丙】

    倘使同治、光緒年間的改革移到道光、咸豐年間，我們的近代化就要比日本早二十年。遠東的近代史就要完全變更面目。可惜道光、咸豐年間的人沒有領受軍事失敗的教訓，戰後與戰前完全一樣，麻木不仁，妄自尊大。直到咸豐末年，有少數人覺悟了，知道非學西洋不可。所以我們說，中華民族喪失了二十年的寶貴光陰。

