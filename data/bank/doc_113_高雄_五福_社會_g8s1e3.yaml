  number: 21
  type: single
  page: 3
  stem: '隨著選舉的到來，五福黨決議徵召 35 歲以下優秀青年，代表該黨參選六都直轄市議員。此外，該政黨為提早布局，早已在各行政區設立服務處，以利民眾陳情並表達民意。根據上述畫線的部分，可以說五福黨發揮了右列表格的哪些功能？

    (甲)影響政府，以爭取黨員利益

    (乙)培育政治人才，提名候選人

    (丙)匯集與整合群眾的利益與要求

    (丁)組織利益團體，向政府遊說'
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 甲丁
  - label: D
