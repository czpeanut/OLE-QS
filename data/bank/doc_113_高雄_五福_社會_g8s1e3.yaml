- id: doc_113_高雄_五福_社會_g8s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 日本地震頻繁發生，在阪神大地震和311 大地震後，日本更重視地震預防，政府和民間積極配合，防災和救災工作成為當前最重要任務，政府提出多項防災對策，包括：防災推演、建立避難據點、強化建築物耐震度等。試問：日本地震多的原因與下列哪項特性最相關？
  options:
  - label: A
    content: 溫帶與熱帶的過渡氣候
  - label: B
    content: 板塊交界的相對位置
  - label: C
    content: 海岸線曲折且綿長
  - label: D
    content: 沿海有寒、暖流交會。
- id: doc_113_高雄_五福_社會_g8s1e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 二次世界大戰後，為了快速重建社會與經濟，南韓政府大力扶植大型財團，現今財閥幾乎等同於南韓的經濟命脈。以三星電子為例，總收入就佔國家總GDP 的18.3%，相當於南韓每5
    塊錢的產值，約有1 塊錢由三星集團貢獻；同年十大財閥營收佔南韓總GDP 的58.3%，其中前四大財團：三星、現代汽車、SK 海力士與樂金集團的比重更高達48.5%。試問：上述發展狀況最可能導致下列何種社會現況發生？
  options:
  - label: A
    content: 中小企業蓬勃發展
  - label: B
    content: 社會貧富差距擴增
  - label: C
    content: 國內產業空洞化
  - label: D
    content: 遭受國際經濟制裁。
- id: doc_113_高雄_五福_社會_g8s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 近年的南韓影視作品因能反映社會現況而大受好評，並能窺見經濟快速發展背後潛藏的負面問題。日前於12月Netflix 平臺上映的《魷魚遊戲2》引起熱議，該劇講述多名債台高築的玩家，為了贏得456
    億韓元獎金參加一系列致命的兒童遊戲，其中一名玩家是逃離北韓的「脫北者」。試問：此玩家逃離北韓的理由，下列何者可能錯誤？
  options:
  - label: A
    content: 經濟發展遲緩
  - label: B
    content: 糧食供應短缺
  - label: C
    content: 民主開放政體
  - label: D
    content: 民生物資匱乏。
- id: doc_113_高雄_五福_社會_g8s1e3_s1_18
  section: 1
  number: 18
  type: single
  page: 3
  stem: 2016 年英國民眾以公投51%的贊成比率決定脫離歐盟，時至今日，一間國際民調公司的報告顯示，有57%的英國人認為脫歐是錯誤決定，如果立即再舉辦公投，將會有55%的英國人贊成再度加入歐盟，上述內容主要彰顯公共意見的何種特性？
  options:
  - label: A
    content: 議題性
  - label: B
    content: 變動性
  - label: C
    content: 複雜性
  - label: D
    content: 影響性。
- id: doc_113_高雄_五福_社會_g8s1e3_s1_19
  section: 1
  number: 19
  type: single
  page: 3
  stem: 「公共政策網路參與平台」是由國家發展委員會建置，提供人民發表公共意見的平台，有人就在此平台上提案「國高中上課時間改為早上9 點半到下午5 點」，該提案迅速通過附議門檻，為此，教育部特別舉辦公聽會，邀請學者與民眾參與討論。贊成的民眾認為讓學生充分休息，有助於學習效果，反對的人認為延後課程時間，可能讓學生去補習的時間拖到更晚。根據上述內容，下列敘述何者正確？
  options:
  - label: A
    content: 該平台提供管道，讓民眾間接透過利益團體反映意見給政府
  - label: B
    content: 政府利用公聽會發布政策，目的要讓民眾配合政府公共政策
  - label: C
    content: 延後上課的民意經公開討論後形成決策，展現公共意見的議題性
  - label: D
    content: 民眾對此議題表達不同立場，顯示公共意見的複雜性。
- id: doc_113_高雄_五福_社會_g8s1e3_s1_20
  section: 1
  number: 20
  type: single
  page: 3
  stem: 為推動植物性飲食，多個民間團體近日舉行第二屆「植植走」大遊行，呼籲政府能儘速效法先進國家，將植物性飲食發展納入國家政策，並在淨零生活中確實推廣植物性飲食。根據上文敘述，文中向政府表達意見的方式，與下列何者類型不同？
  options:
  - label: A
    content: 辦理民意調查彙整意見
  - label: B
    content: 向相關主管機關陳情
  - label: C
    content: 利用公民投票表達立場
  - label: D
    content: 向報章雜誌投書個人觀點。
- id: doc_113_高雄_五福_社會_g8s1e3_s1_21
