  stem: 讀完上文秋瑾的故事，加上你所學的歷史知識，判斷下面哪一個說法「並不正確」？
  options:
  - label: A
    content: 秋瑾有不同於一般女子的喜好，但婚姻仍聽從父母之命
  - label: B
    content: 秋瑾逃離婚姻到日本留學，突破傳統婚姻對女性的束縛
  - label: C
    content: 秋瑾在日本留學期間，受到日本戰勝刺激，號召立憲運動
  - label: D
    content: 秋瑾回到中國辦報紙、辦女子學堂，積極鼓吹女權意識。
  group_stem: "【故事一】資料來源：康軒版歷史教材備課用書\n  秋瑾生於福建廈門，官宦家庭。秋家重視子女教育，兄妹同讀家塾，並由母親親自教授詩文。秋瑾自幼便喜歡讀書、運動，尤其喜好閱讀《劍俠傳》。秋家後來遷回故鄉浙江紹興，秋瑾在外祖家學會了騎馬擊劍、跳高和跳遠。15\
    \ 歲後，秋瑾才開始學女紅，並擅長刺繡，但並不喜歡。在詩詞中，秋瑾常流露出以天下為己任的壯志，與傳統女性截然不同。\n西元1895 年，秋父調職湖南湘潭縣，把她許配給小她2\
    \ 歲的當地富商之子王廷鈞，隔年成婚。西元1903年，秋瑾隨王廷鈞捐官北京，但她與丈夫志趣大不相同而感到寂寞無告。西元1904 年5 月，她雖未與王廷鈞辦理離婚手續，但下定決心離開。她變賣首飾籌集資金，前往日本。\n\
    \  秋瑾留日期間，秋瑾深感自己的國家被列強欺辱，但清廷腐敗無能，因此極力鼓吹男女平等，女性也應該接受教育，才能經濟獨立，不必受制於男性，進而報效國家。她也積極組織女留學生的愛國團體。西元1906\
    \ 年，她加入了孫中山創立的革命團體同盟會。\n    回國後，1907 年秋瑾在上海創辦《中國女報》，並與人合辦明道女子學堂。不久又主持大通學堂體育專修科，並任學堂督辦。西元1907\
    \ 年，主持大通學堂期間，私下與徐錫麟共組「光復軍」，聯絡會黨，以推翻滿清為目標。但革命失敗，在大通學堂被捕。提押審問時，秋瑾口供僅寫「秋風秋雨愁煞人」一詩句。7\
    \ 月15 日凌晨，秋瑾被處斬，年31 歲。"
