  stem: '【材料甲】

    中國被迫開放的口岸由5 個增加到16 個，這些通商口岸由東南沿海深入到北方和內陸。之前，列強取得的沿海貿易權也是初步的，甚至尚無明文規定。這場戰爭後，不僅有了沿海貿易的明文，制定了《沿海貿易法》，而且讓侵略者取得了內河、內地通商權及內地遊歷權、傳教權。

