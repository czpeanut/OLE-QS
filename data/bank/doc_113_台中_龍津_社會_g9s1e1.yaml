  section: 1
  number: 10
  type: single
  page: 1
  stem: '郵政巴士（Postbus）是行駛在瑞士郊區、鄉鎮與山間的黃色巴士，截至2020年共有936條路線在運營，由於瑞士地形起伏大、山路相當崎嶇狹窄，為了降低運輸成本，郵差在送信範圍內以巴士順便運載旅客，最後發展專門載客的交通工具，近年亦提供各式觀光行程供遊客遊覽瑞士美景。倩柔到歐洲自由行14天，規畫途中到瑞士搭乘郵政巴士，下列她給自己列的旅遊注意事項哪個號碼錯誤？


