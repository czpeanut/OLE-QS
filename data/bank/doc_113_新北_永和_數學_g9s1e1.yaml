  section: 1
  number: 4
  type: single
  page: 1
  stem: '下列敘何者正確？ (1-2、1-3)

    (甲)若甲、乙兩多邊形，其邊數相同則必相似

    (乙)在 $\triangle ABC$ 中，$D$ 為 $\overline{AB}$ 上的一點，若 $\overline{AC}$ 上有一點 $E$ 滿足
    $\overline{DE} : \overline{BC} = \overline{AD} : \overline{AB}$，則 $\overline{DE}
    // \overline{BC}$

    (丙)一個圖形經過縮放後，角的度數不變

    (丁)如果只知道「對應邊成比例」或「對應角相等」則這兩個多邊形不一定相似

    (戊)將一個圖形縮放 $r$ 倍時，如果縮放中心不同，所縮放出來的圖形就不全等'
