    On the second day, they took a bus to Mount Gold. Then they rode bikes through
    the forest to the KH Tower. The ride to the tower was not easy but full of fun
    of nature. They saw birds, butterflies and small animals along the road. At the
    tower, they heard stories about Blue Island and took many beautiful pictures.
    They also tried the famous ice cream in shape of the tower. The ride made them
    tired, so they had a sauna to get away from the sore muscles after they went back
    to the hotel.

    On the last day, they went to Golden Beach on foot. They rowed boats and played
    volleyball with other visitors, Ray and Eva. Gerry made friends with them and
    had a great seafood barbecue for lunch. Gerry found his new friends stayed at
    the same hotel as him, so they chatted and walked back to the hotel together.
    It was a wonderful trip for Gerry because he not only had a great time but also
    made new friends there.

