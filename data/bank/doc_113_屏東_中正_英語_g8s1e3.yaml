  section: 6
  number: 7
  type: single
  page: 4
  stem: What is the main idea of the reading?
  options:
  - label: A
    content: Useful tips to make less Carbon footprints.
  - label: B
    content: Products from other countries cost more money.
  - label: C
    content: Cookies are a good choice for snacks.
  - label: D
    content: Different foods around the world.
  group_stem: 'Take a look at your meal. Perhaps there are milk from the US, fruit
    from New Zealand, and rice from Japan. After the meal, you may have some cookies
    from Korea. While we are enjoying food around the world, we are making more carbon
    footprints at the same time. This is what makes the Earth grow warmer and warmer.

    Carbon footprints are how much CO₂ we produce in our lives. For example, we will
    make more CO₂ if we go somewhere by car than by bike. Carbon footprints also mean
    CO₂ produced during a product’s making process. If we buy cookies from another
    country, they might be packed in factories and shipped by airplanes. These two
    processes lead to the carbon footprints of this bag of cookies, and they produce
    lots of CO₂.

    Here are more ways to help cut down carbon footprints.

     Buy local food. Buy things that are made and grown in your country.

     Grow your own fruit and vegetables if possible.

     Choose the foods that are in season.

     Walk or take the bus to shops.

     Choose food with less packaging.

     Bring your own bags when you are shopping.

    By doing these things, we can help our Earth “cool down” and will have a better
    place to live in.


    produce 製造    product 產品    process 過程    pack 包裝   website 網站   local 當地的   less
    較少的'
