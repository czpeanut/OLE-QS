  stem: 在本詩中，田舍翁長嘆的原因為下列何者？
  options:
  - label: A
    content: 富貴人家競逐豪奢，社會貧富懸殊
  - label: B
    content: 花賤傷農，致使花農無法維持生計
  - label: C
    content: 有錢人家喜新厭舊，花剛買不久便汰換
  - label: D
    content: 自家田裡的作物，經濟價值沒有牡丹高
  group_stem: "(二) 請讀完詩作後，回答下列問題：\n    帝城春欲暮，喧喧① 車馬度。\n  共道牡丹時，相隨買花去。\n  貴賤無常價，酬直②\
    \ 看花數。\n  灼灼③ 百朵紅，戔戔④ 五束素⑤ 。\n  上張幄⑥ 幕庇，旁織笆籬護。\n  水灑復泥封，移來色如故。\n  家家習為俗，人人迷不悟。\n\
    \  有一田舍翁，偶來買花處。\n  低頭獨長嘆，此嘆無人喻。\n  一叢深色花，十戶中人賦。\n                            \
    \          （白居易 買花）\n【注釋】\n① 喧喧：形容車馬嘈雜、喧鬧的聲音。\n② 酬直：償付代價。\n③ 灼灼：花茂盛鮮明。\n④ 戔戔：積聚的樣子。戔，音ㄐㄧㄢ。\n\
    ⑤ 五束素：二十五匹帛（一束是五匹）。\n⑥ 幄：帳幕。"
