  section: 4
  number: 6
  type: single
  page: 1
  stem: 下列各詩所描繪的對象，何者並未出現在愛蓮說一文中？
  options:
  - label: A
    content: 落盡殘紅始吐芳，佳名喚作百花王。競誇天下無雙豔，獨占人間第一香。
  - label: B
    content: 花開不並百花叢，獨立疏籬趣未窮。寧可枝頭抱香死，何曾吹墮北風中？
  - label: C
    content: 碧玉妝成一樹高，萬條垂下綠絲絛。不知細葉誰裁出，二月春風似剪刀。
  - label: D
    content: 曲沼芙蓉映竹嘉，綠紅相倚擁雲霞。生來不得東風力，終作薰風第一花。
