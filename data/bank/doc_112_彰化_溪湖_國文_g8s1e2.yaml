- id: doc_112_彰化_溪湖_國文_g8s1e2_s5_5
  section: 5
  number: 5
  type: single
  page: 4
  stem: 雁一文中，作者的母親說起雁的故事，下列何者的敘述錯誤？
  options:
  - label: A
    content: 是飄泊的候鳥
  - label: B
    content: 是專情的鳥
  - label: C
    content: 是合群的鳥
  - label: D
    content: 是無情的鳥
  group_stem: "(三) 請閱讀下面的文章，回答下列問題：\n    雁是怎樣的一種鳥呢？在蒼藍的秋空上寫著字，寫得那麼快又那麼整齊，仰酸了頸子望著牠們飛進渺遠的雲裡。那些抖動著的、會飛的字，常引起人魔異的遐想。\n\
    \    每一年的秋天，風涼露冷的時辰，一天之內，都會見到好幾陣雁群，有時已經入暮了，牠們還在飛著，偶爾從雲層上面，灑落下充滿寒意的啼聲，使人聽在耳中，心便像秋般的寒冷。\n\
    \    雁朝哪兒飛啊？母親在橙色的燈光裡回答我的問詢，並說起雁的故事，說牠們是飄泊的候鳥，寒季從北地起程，飛到溫暖的南方去，春暖時，牠們又飛回解凍的北國。說雁是專情的鳥，牠們一旦選擇了伴侶，便相愛著，廝守終生，牠們更是合群的鳥，一群雁是一個大的家族，相互關心著，禍福與共。\n\
    \                                      （司馬中原 雁）"
  tags:
    textbook: 八上 第八課 鳥
    labeled_by: ai
    chapter:
      publisher: 康軒
      book: 八上
      subject: 國文
      code: 第八課
      title: 鳥
      chapter: null
