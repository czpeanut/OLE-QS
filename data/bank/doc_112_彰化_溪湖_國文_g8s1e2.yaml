- id: doc_112_彰化_溪湖_國文_g8s1e2_s4_9
  section: 4
  number: 9
  type: single
  page: 2
  stem: 班上的同學們玩大風吹，抽籤拿紙牌，若牌中兩個句子「 」中的詞語意義相同，需要起身找新位子，下列何者需要換位子？
  options:
  - label: A
    content: 他的「故事」振奮許多失敗的創業者／發生這樣的意外「事故」任誰也料想不到
  - label: B
    content: 當他「察覺」事有蹊蹺想要挽救，卻已回天乏術／她生性敏感，一點點風吹草動立刻能「覺察」
  - label: C
    content: 沒有考量「現實」的夢想最終可能淪為紙上談兵／為了「實現」夢想，他不斷努力嘗試各種方法
  - label: D
    content: 這道數學題他最後因「計算」錯誤而失分／他一天到晚「算計」他人，因此得不到眾人的信任
  tags:
    textbook: 第三冊（八上）第2次段考範圍
