    content: 面對失敗，唯有「明日黃花」的積極態度能扭轉局勢。
  - label: B
    content: 爺爺種的梨鮮甜多汁，靠的是高超的「花開並蒂」技術。
  - label: C
    content: 「生花妙筆」的她創作這本科幻小說，迅速風靡全球。
  - label: D
    content: 日月潭那「鏡花水月」的景色總是吸引許多遊客到訪。
