  group_stem: '(一) 請閱讀下面的資訊，並回答下列問題：

    梁實秋故居

    【參觀注意事項】

    ⚫ 地址：台北市大安區雲和街11 號

    ⚫ 捷運：搭乘至台電大樓站（松山新店線）下車，再步行前往。

    ⚫ 公車：搭乘1、74、208、236、251、252、254、278、606、644、648、藍22 台電大樓站下車，再步行前往。

    ⚫ 開放時間：週四至週日11：30 至17：00。週一至週三暨國定假日不開放。

    ⚫ 預約導覽：團體參觀如需導覽服務，最遲須於7 天前預先來電告知參觀日期、時間、人數。

