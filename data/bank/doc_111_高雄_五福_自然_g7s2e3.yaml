- id: doc_111_高雄_五福_自然_g7s2e3_s2_48
  section: 2
  number: 48
  type: single
  page: 6
  stem: 依據文中鱟的介紹，鱟應該是哪一門生物？
  options:
  - label: A
    content: 脊索動物門
  - label: B
    content: 棘皮動物門
  - label: C
    content: 甲殼動物門
  - label: D
    content: 節肢動物門。
  group_stem: '(二)、請閱讀下面這篇文章，並回答下列問題[文改編自科技人文雜誌;圖取自中央社報導]


    鱟是海中非常古老的生物，存在地球逾四億年，鱟的身體分為三部分：最大的部分是頭胸部，然後是分節的腹部，再下邊是一根長長的尖尾刺。它的頭胸部側面有一對複眼，每隻眼睛是由若干個小眼睛組成。另外還有一對感受紫外線的單眼。它們也有一對鉗子，稱為螯肢，是專門捕食蠕蟲、薄殼軟體動物用的。臺灣出沒的為三棘鱟，早期台灣西部沿海潮間帶和離島，到處都可以看到鱟的身影，然而，隨著環境污染加劇，加上棲息地受到破壞，目前除了金門和澎湖還可以看到為數不少的鱟之外，台灣西部大概只剩新竹香山、嘉義東石和布袋的潮間帶偶然零零星星可以找到鱟的蹤影。

    一隻鱟要經過長達13 至14 年、20 多次的蛻殼，才能長成性成熟的成鱟，體長30 至40 公分。 而人工繁殖鱟，除了為物種保育之外，更可做為發展生物科技的利基。而鱟血含有特殊的化合物溶素，可做為細菌和內毒素的檢測劑─鱟試劑，因靈敏度高，操作快速省錢、使用方便，已成為全世界各國檢測醫療器材、藥品、食物、飲料是否受細菌污染的標準檢定方式。鱟血液中的變形細胞（少量，離心得到沉澱白色物）甚至被帶上外太空，偵測有機體及保護太空人免於疾病傷害。而鱟試劑溶素粉末每公斤高達50
    萬元台幣，再加上鱟血液含有銅離子，血色呈現藍色，已被稱為另一種「藍金」。另者，人們發現鱟的複眼有一種側抑制現象，也就是能使物體的圖像（尤其追蹤背景中的動態圖像）更加清晰，這一原理被應用於電視和雷達系統中，提高了電視成像的清晰度和雷達的顯示靈敏度。

    台灣研究「鱟」的博士楊明哲說，鱟因大量被捕捉抽血製藥、食用、混獲、海洋污染、海岸破壞及開發等因素，造成族群長期衰退。2019 年更被列入 IUCN 紅皮書瀕危物種。鱟成瀕危物種外部因素主要是海岸開發和漁業混獲等問題。鱟誤入漁民的魚網，非死即傷。而金門是目前台灣鱟族群最多的地方，但由於當地
    20 年來持續進行水頭商港的興建計畫，使得建功嶼海岸的稚鱟族群不斷衰退中。除了上述問題之外，中國籍的抽砂船自 10 年前開始出現於金門海岸一帶盜採海砂，嚴重侵蝕古寧頭三棘鱟保育區的沙灘。在抽砂的過程中，許多細小的懸浮顆粒會淤積在海岸邊，在稚鱟的棲息地產生許多淤泥。由於鱟必須依靠腹部的「書鰓」呼吸，而顆粒太細的淤泥將可能阻塞牠們在水中的氧氣交換；此外，淤泥還會影響鱟的食物來源，造成鱟難以吃到適合的底棲生物，也增加了稚鱟的生存難度。

    本島方面則因長年以來的海岸汙染及開發，自然海岸已所剩無幾，這也代表了成鱟可產卵的沙灘，以及稚鱟可棲息的泥灘地等環境，都已被海堤、海港等設施取代，甚至有的地方還被填海造陸，嚴重影響鱟的棲息地，這也是本島的三棘鱟面臨滅絕的主因。'
