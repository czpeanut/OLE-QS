  group_stem: '◎【旅日當心！黴漿菌疫情創10 年新高「沒疫苗、易有抗藥性」】2024/10/11 馮逸華 修改自https://www.uho.com.tw/article-64834.html

    ….郭綜合醫院感染科醫師黃千芳表示，黴漿菌常聚集在呼吸道黏膜、泌尿生殖道黏膜上，而導致肺炎、生殖泌尿道感染，肺炎黴漿菌感染即是常見的非典型肺炎之一，一年四季皆有病例，好發於春夏之交及秋天，可感染各年齡層，以5～20
    歲為多，常見學校、軍隊、家庭群聚，多有感染兒童的接觸史。

    黃千芳說明，黴漿菌家族是目前發現最小且能自行繁殖的病原體，其大小介於細菌與病毒之間，它是原核生物，不具細胞壁，因此一般常見的「對抗細菌細胞壁的抗生素」，對黴漿菌治療無效。其傳染途徑為飛沫傳染、潛伏期約2
    到3 週，常出現發燒、倦怠、頭痛、喉嚨痛、咽喉發炎；少數個案出現皮膚紅疹、肝指數異常等肺外症狀，感染後有10%會併發肺炎、90%可自行痊癒，致死率約0.1%

    據各國統計顯示，肺炎黴漿菌對於巨環類抗生素（Macrolide）抗藥性日益嚴重，尤其在中國、日本、南韓等國抗藥性高達70～80%；台灣也有20～80%的抗藥性。黃千芳提醒，當一般肺炎抗生素治療效果差，尤其咳嗽明顯時，須提高警覺是否已出現抗藥性。目前沒有疫苗可預防肺炎黴漿菌，且有機會再次感染，但只要在日常生活中落實戴口罩、勤洗手，可減少黴漿菌感染機會。…'
