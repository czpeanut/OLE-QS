- id: doc_113_高雄_五福_自然_g7s2e2_s2_43
  section: 2
  number: 43
  type: single
  page: 4
  stem: '「台灣河川常見塘鱧有:棕塘鱧（Eleotris fusca）、黑塘鱧（Eleotris melanosoma），在台語稱為『鮕鮘』（koo-tai）。然而，海洋大學教授陳義雄2024
    年底發表了新種『花蓮台塘鱧』，學名為Formosaneleotris hualienensis。花蓮台塘鱧的屬名Formosaneleotris，中文譯為『台塘鱧』，可拆解為Formosan
    加eleotris（塘鱧）。陳義雄表示Formosan，既指來自台灣，也有漂亮的意思。這條魚身上既保留塘鱧的共同特徵，也存在明顯差異。塘鱧的型態都是雙背鰭、呈圓筒形；花蓮台塘鱧身型卻細細長長如蚯蚓，並且第一背鰭退化導致單背鰭、無鱗片。」


    根據上述短文，下列敘述何者錯誤？'
  options:
  - label: A
    content: 「koo-tai」為常見塘鱧的俗名
  - label: B
    content: 花蓮台塘鱧與棕塘鱧為不同屬的生物
  - label: C
    content: 花蓮台塘鱧的屬名是形容詞，代表產地
  - label: D
    content: 花蓮台塘鱧無法與棕塘鱧產生具生育能力的後代
  assets:
