  group_stem: "◎【命令螞蟻爬樹的真菌蟻蟲草】2020/12/12 文/周睿鈺 擷取自：https://www.mdnkids.com/content.asp?Link_String_=18CC00000KFVZAZ\n\
    \ 螞蟻是我們最常看見的昆蟲，通常住在一起，互相依靠找食物吃、對抗敵人，以及照顧小寶寶。但是在森林環境中，有種特別的「蟻蟲草」真菌會感染螞蟻，在螞蟻身體內不斷生長，並釋放化學物質，影響螞蟻的行為；被感染的螞蟻會離開大家庭，到外頭流浪，同時失去覓食、照顧家庭的能力。最後蟻蟲草會「命令」螞蟻爬到樹上，藏匿在葉片下方，並且用嘴巴牢牢咬住葉脈，隨後，螞蟻就維持這樣的姿勢慢慢死去。\n\
    在螞蟻死亡後一到兩個星期，真菌會從螞蟻的屍體中冒出來，形成長長一根像釣竿的構造。這個構造裡面，有許多像子彈一樣的真菌孢子，會隨風飄散到森林地面，繼續感染出來找食物吃的螞蟻。\n\
    科學家認為，真菌不像動物一樣可以自由的跑來跑去，必須靠螞蟻爬樹的能力，帶牠們往高處繁衍；等待真菌孢子成熟後，就能像發射子彈般在高空散播，讓真菌的生長範圍擴大。螞蟻爬得越高，可以幫助真菌孢子擴散得更遠；固定在葉片下方，還能抵擋雨水等環境干擾，讓真菌可以順利生長，釋放更多孢子。..."
  shared_asset: g2_49_50
