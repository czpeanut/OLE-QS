    kind: figure
    file: doc_113_高雄_五福_自然_g7s2e2/s2_43_f1.png
- id: doc_113_高雄_五福_自然_g7s2e2_s2_44
  section: 2
  number: 44
  type: single
  page: 4
  stem: '台視新聞網2024/10/15 一篇新聞：「中國小學生近期興起一股養『黏菌』的風潮。生物老師游夏解釋，黏具兼具動物與植物特性，最長可達一公尺。若生長在陰暗潮濕環境，會呈現濕潤、黏稠、具各種顏色，且不定形。若是環境溫暖乾燥，則會生長出堅硬的細胞壁和孢子囊。它屬於雜食性，燕麥、微生物通通吃，平均可存活約5
    到7年。在潮濕環境的時它是沒有細胞壁的，只有細胞膜、細胞質的多核細胞團，透過變形蟲運動，吞噬物質，所以它可以吃很大的東西。」


    依據此段敘述，關於黏菌的敘述，下列何者錯誤？'
  options:
  - label: A
    content: 有時具有細胞壁，有時候沒有
  - label: B
    content: 環境溫暖潮濕時，可呈綠色自行製造養分
  - label: C
    content: 變形蟲運動時，具有多核細胞團
  - label: D
    content: 兼具動物與植物的特徵
- id: doc_113_高雄_五福_自然_g7s2e2_s2_45
  section: 2
  number: 45
  type: single
  page: 5
  stem: 根據上述文章，下列敘述何者正確？
  options:
  - label: A
    content: 教室的冷氣機也能產生電磁波
  - label: B
    content: 只有游離輻射才會造成致癌
  - label: C
    content: 紫外線屬於游離輻射，故容易致癌
  - label: D
    content: 建議多接受X 光檢查，以確認身體是否癌變
  group_stem: '◎【基地台放出的輻射會致癌嗎？】2019/02/21 作者:盧映慈 修改自: https://heho.com.tw/archives/39974

    很多人對電磁波會有一個壞印象，但其實在物理學的研究中，只要物體的溫度大於絕對零度（約等於−273.15℃），就會有電磁波的產生。所以電磁波其實是一種物體的能量場，而地球本身就是一個大型的磁場、太陽光等可見光也是常接觸到的電磁波。

    電磁波又分成2 大類，分別是游離輻射跟非游離輻射。游離輻射能量較高，可讓細胞原本緊密結合的原子、分子，產生可以自由移動的離子，等於有了破壞細胞DNA 的能力，因此會造成癌變。這種游離輻射包含伽瑪射線、X
    光，所以比起擔心基地台，更應該擔心被核放射線污染的食物、醫療檢查時的輻射暴露。不過林口長庚紀念醫院核子醫學科醫師何宗穎表示，每人每年健檢接受低於50 毫西弗的輻射，並不會產生致癌效應，所以不要過度檢查，對身體是沒有太多危害的。

    非游離輻射因為沒有自由移動的離子，所以光子帶來的能量沒有這麼高、不會破壞細胞DNA，唯一的例外是能量強度最靠近游離輻射的紫外線，雖然不會破壞細胞DNA，但會引起細胞的化學反應，所以一樣有致癌的可能。

    如果基地台建在頂樓，下方的住戶們反而是最安全的，因為基地台輻射的發散，是往前最多、往後跟往上較少，但幾乎沒有往下的；就算有，基地台下方有建築物的屏蔽，而一台基地台的輻射能量幾乎不可能傳入

    一般來說，距離基地台正前方15 公尺遠之後，幾乎就接收不到電磁波；如果希望基地台離自己很遠，表示手機需要發送的電磁波能量越強，這種天天帶在身邊的用品，比基地台的危害更需要擔心，建議不要長期使用手機、尤其是貼著耳朵講電話。'
