  - label: C
    content: 石灰水與二氧化碳反應產生白色碳酸鈣沉澱，故常使用澄清石灰水來檢驗二氧化碳是否存在
  - label: D
    content: 早期農民於稻子收割後放火燃燒稻草，利用稻草灰燼中的鹼性鹽類來中和土壤因雨水所致的酸化現象
  group_stem: '第二題

    墾丁國家公園的觀光景點—石筍寶穴，因石鐘乳、石筍和石柱等特殊的石灰岩地形而聞名。石灰岩的主要成分為碳酸鈣（$CaCO_{3}$），若含有二氧化碳的地下水滲入石灰岩地層，會溶解其中的碳酸鈣，陸續生成可溶性的碳酸氫鈣（$Ca(HCO_{3})_{2}$），含有二氧化碳的地下水在足夠厚度的石灰岩地層中滲流，可使碳酸氫鈣水溶液達飽和，並達成平衡，表達如下式：

    $CO_{2} + H_{2}O + CaCO_{3} \rightleftharpoons Ca(HCO_{3})_{2}$

    但是，一旦周遭環境已經不是密閉系統，水分或二氧化碳減少，有利於逆反應，於是產生各式各樣的碳酸鈣沉澱物，通稱為「鐘乳石」。

