- id: doc_113_台中_五權_國文_g8s1e3_s2_36
  section: 2
  number: 36
  type: single
  page: 4
  stem: 作者說「霧，其實是最難描摹的一幅畫」，原因為何？
  options:
  - label: A
    content: )無法呈現空間距離
  - label: B
    content: 缺乏人物襯托風景
  - label: C
    content: 輪廓模糊，構圖困難
  - label: D
    content: 濃淡之間難以掌握。
  group_stem: "(三) 一滴水，攜著剔透的夢，穿過暗藍的夜。萬籟俱寂中，樹，到底是不肯安分寒冬的單調，深夜裡，猶然還做著\n春天的計劃，此一處純白，彼一處嫣紅，把一場花事安排得熙熙攘攘。一夢花香裡，樹終於忍不住，「噗哧」笑出\n\
    了聲，清凌凌的笑聲，飛出樹梢，與恰巧路過的水相撞。樹的笑，水的夢，齊齊破碎，彌散成一場霧的縹緲，細\n細密密鋪陳開來。這樣的鋪陳，真讓人錯愕。滿目之間，是接天連壤的白，白得純淨，白得朦朧，或濃或淡。\n\
    \ 城市，樹木，行人，這些司空見慣已不能稱為風景的風景，無不因這一場濃淡的鋪陳而嫵媚神祕起來。鱗次\n櫛比的大樓，只留下尖尖的頂，浮沉在這一片白色的海洋裡。路上的行人，影影綽綽，亦是白茫茫的一片。我找\n\
    出久違的畫筆，試圖把這一分縹緲的美麗描摹下來。\n 而當我落筆時，才發現，霧其實是最難描摹的一幅畫。著色太多，會失了霧的靈性和朦朧，而只用一筆淡墨\n來勾勒的話，又覺得不甘心。我只好丟了筆，走進霧中。清晨的街道是安靜的。有風吹過，霧，便輕輕柔柔地落\n\
    了下來。霧氣凝成的水滴，掉落在草地上。草地，漸漸地溼潤和柔軟起來，草們，飽吸著露珠，舒展著枯黃的身\n體。而從這些枯黃中穿過的時候，我無意中竟發現一絲嫩綠！我忽然有了莫名的驚喜。\n\
    \ 我知道，春，最早都是從草尖上趕來的。我看著那株泛起生命律動的草，才知道，那一滴水攜帶的夢裡，原\n本都藏著春的信息，一經散開，便落入了人間。忽然覺得，自己原本就是一株小草，經歷過漫長寒冬裡的蟄伏，\n\
    被霧滋潤過，便也開始了新一輪的生長。離開時，我把那一絲嫩綠銘記在了心裡。相信，在我再次遭遇寒冬的時\n候，無論風有多凜冽，我依然能在草尖上找尋到那掛在冬霧下的春天。\n\
    \ 節錄自馮輝麗〈掛在冬霧下的春天〉"
