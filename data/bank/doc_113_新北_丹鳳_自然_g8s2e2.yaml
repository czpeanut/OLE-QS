  page: 2
  stem: '在 25℃時，紅棕色的 $NO_{2}$ 在密閉系統中的化學反應達成平衡，其反應式如下($N_{2}O_{4}$ 為無色)：

    $2NO_{2}$ ⇌ $N_{2}O_{4}$ ＋ 熱量

    關於此反應的敘述，下列何者最合理？'
  options:
  - label: A
    content: 正反應為吸熱反應
  - label: B
    content: 溫度上升時，正反應速率大於逆反應速率
  - label: C
    content: 溫度下降時，顏色會變淺
  - label: D
    content: 反應達平衡後，正反應速率與逆反應速率均等於零。
