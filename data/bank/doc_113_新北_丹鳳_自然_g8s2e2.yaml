- id: doc_113_新北_丹鳳_自然_g8s2e2_s1_31
  section: 1
  number: 31
  type: single
  page: 4
  stem: '2015 年八仙樂園的塵爆案，原本是歡樂的派對現場，卻因為主辦單位的疏失變成人間煉獄。主辦單位疑似使用成本低廉可以燃燒的玉米澱粉作為彩色派對相互噴灑的粉末，再加上活動場地就是一個無水的游泳池，形成相對侷限的空間。

    揚起的粉塵累積達一定濃度，遇火源點燃大量粉塵，導致意外發生。此外現場人員使用二氧化碳鋼瓶滅火，反而導致更多粉塵揚起增加接觸面積，滅火不成反使火勢加劇。一系列的巧合導致情況更加嚴重，造成多人燒燙傷。

    根據上文，請問造成意外的原因不包含哪個因素？'
  options:
  - label: A
    content: 催化劑的有無
  - label: B
    content: 反應物的性質
  - label: C
    content: 反應物的濃度
  - label: D
    content: 反應物接觸面積
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 理化
      code: 4-1
      title: 反應速率
      chapter: 第4章 反應速率與平衡
    textbook: 八下理化 4-1 反應速率
    labeled_by: ai
- id: doc_113_新北_丹鳳_自然_g8s2e2_s1_32
  section: 1
  number: 32
  type: single
  page: 4
  stem: '鐘乳石的形成是自然界中最常見的可逆反應。鐘乳石形成於石灰岩的環境，當石灰岩的地形滲入了微酸性的地下水後，受微酸性地下水的侵蝕，逐漸形成石灰岩洞。

    如果地下水中的二氧化碳濃度減少，則使得化學反應往另一個方向進行，因而形成碳酸鈣的沉澱，如果自地面逐漸形成稱為石筍，自洞頂向下生長則稱為鐘乳石。

    下列哪個反應式，最適合用來表示石灰岩被微酸性地下水侵蝕？'
  options:
  - label: A
    content: Ca(OH)$_{2}$＋$CO_{2}$ → $CaCO_{3}$＋$H_{2}O$
  - label: B
    content: $CaCO_{3}$ → CaO＋$CO_{2}$
  - label: C
    content: $CaCO_{3}$＋$2H^{+}$ → $Ca^{2+}+CO_{2}+H_{2}O$
  - label: D
    content: $Ca^{2+}+CO_{2}+H_{2}O$ → $CaCO_{3}$＋$2H^{+}$。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 理化
      code: 4-2
      title: 可逆反應與平衡
      chapter: 第4章 反應速率與平衡
    textbook: 八下理化 4-2 可逆反應與平衡
    labeled_by: ai
- id: doc_113_新北_丹鳳_自然_g8s2e2_s1_33
  section: 1
  number: 33
  type: single
  page: 4
  stem: '在密閉的透明容器中加入等量 CO 與 $NO_{2}$ 氣體，反應時將可產生 $CO_{2}$ 與 NO 兩種氣體，再經查證此反應式為:

    $CO+NO_{2}$ ⇌ $CO_{2}+NO$

