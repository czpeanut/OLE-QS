  type: single
  page: 4
  stem: '桌上有一杯未飽和 $K_{2}CrO_{4}$ 溶液。已知 $K_{2}CrO_{4}$ 在溶液中解離的反應式為

    $2CrO_{4}^{2-}+2H^{+}$ ⇌ $Cr_{2}O_{7}^{2-}+H_{2}O$

