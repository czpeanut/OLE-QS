- id: doc_113_新北_丹鳳_自然_g8s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: '將稀鹽酸和碳酸鈣放入錐形瓶中，並將瓶塞塞緊密封，瓶內有下列平衡存在：

    甲：$CaCO_{3}$（固體）＋$2H^{+}$ ⇌ $Ca^{2+}+CO_{2}+H_{2}O$；

    乙：$CaCO_{3}$（固體） ⇌ $Ca^{2+}+CO_{3}^{2-}$；

    丙：$H_{2}O$ ⇌ $OH^{-}+H^{+}$；

    丁：水（液體） ⇌ 水（蒸氣）。現若將瓶塞打開，則上述哪些平衡會發生改變？'
  options:
  - label: A
    content: 丁
  - label: B
    content: 丙、丁
  - label: C
    content: 甲、乙、丙
  - label: D
    content: 甲、乙、丙、丁。
