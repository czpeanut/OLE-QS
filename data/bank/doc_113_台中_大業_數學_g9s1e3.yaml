- id: doc_113_台中_大業_數學_g9s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: '已知：$a$ 是任意一個奇數，$b$ 是任意一個偶數。

    求證：$ab$ 為一個偶數。

    試問下列證明的過程中，哪一個選項是錯誤的？'
  options:
  - label: A
    content: ∵$a$ 是奇數，可以假設 $a＝m＋1$ (其中 $m$ 是整數)
  - label: B
    content: ∵$b$ 是偶數，可以假設 $b＝2n$ (其中 $n$ 是整數)
  - label: C
    content: ∴$ab＝(m＋1)(2n)＝2 (m＋1) n$
  - label: D
    content: 因為 $2 (m＋1) n$ 為偶數，故 $ab$ 是偶數。
