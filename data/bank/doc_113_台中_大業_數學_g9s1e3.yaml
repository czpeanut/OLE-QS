- id: doc_113_台中_大業_數學_g9s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: '如右圖，$A$、$B$、$C$、$D$ 四點共線，且 $\overline{AB} = \overline{CD}$，$\overline{EC}
    // \overline{BF}$，$\overline{EC} = \overline{BF}$，下列是證明$\triangle ACE \cong \triangle
    DBF$ 的過程：

    $\triangle ACE$ 與$\triangle BFD$ 中，$\overline{CE} = \overline{BF}$ ∵$\overline{CE}
    // \overline{BF}$

    ∴ (甲) 又 (乙) ∴$\triangle ACE \cong \triangle DBF$

    請問(甲)、(乙)兩處應填下列哪一條件，推理過程才正確？'
  options:
  - label: A
    content: '(甲): $\angle 3 = \angle 4$，(乙): $\overline{AB} = \overline{CD}$'
  - label: B
    content: '(甲): $\angle 1 = \angle 2$，(乙): $\overline{AB} = \overline{CD}$'
  - label: C
    content: '(甲): $\angle 3 = \angle 4$，(乙): $\overline{AB} = \overline{CD}$ ∴$\overline{AB}
      + \overline{BC} = \overline{CD} + \overline{BC}$，$\overline{AC} = \overline{BD}$'
  - label: D
    content: '(甲): $\angle 1 = \angle 2$，(乙): $\overline{AB} = \overline{CD}$ ∴$\overline{AB}
      + \overline{BC} = \overline{CD} + \overline{BC}$，$\overline{AC} = \overline{BD}$'
