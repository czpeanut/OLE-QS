- id: doc_113_台中_大業_數學_g9s1e3_s1_22
  section: 1
  number: 22
  type: single
  page: 3
  stem: '有一數學命題如下：

    『已知 $a$、$b$ 為負數，且 $a＞b$，證明 $a^{2}＜b^{2}$』。

    以下為阿淮與小詩兩人對此命題的證明：

    阿淮：∵$a＞b$，又 $a＜0$

    ∴$a\cdot a＜a\cdot b \Rightarrow a^{2}＜ab$……①

    又∵$a＞b$，$b＜0$

    ∴$a\cdot b＜b\cdot b \Rightarrow ab＜b^{2}$……②

    由①、②可得 $a^{2}＜ab＜b^{2}$

    故 $a^{2}＜b^{2}$

    小詩：$a^{2}-b^{2}＝(a＋b)(a-b)$

    ∵$0＞a＞b$

    ∴$0＞(a＋b)$ 且 $(a-b)＞0$

    則 $(a＋b)(a-b)＜0$，即 $a^{2}-b^{2}＜0$

    故 $a^{2}＜b^{2}$

    對於兩人的證明，下列敘述何者正確？'
  options:
  - label: A
    content: 阿淮正確，小詩錯了
  - label: B
    content: 阿淮錯了，小詩正確
  - label: C
    content: 兩位都正確
  - label: D
    content: 兩位都錯了。
