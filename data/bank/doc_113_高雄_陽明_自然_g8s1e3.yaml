  group_stem: "【閱讀題組】手機螢幕也能超軟 Q！有機材料如何化身成多彩的OLED ？\n    從貞子可以爬出來的傳統映像管電視，變成影像流暢的輕薄液晶螢幕，許多科幻電影描繪未來顯示器甚至能變成卷軸從手錶拉出來，或直接顯影在汽車擋風玻璃上，這該如何辦到？\n\
    \    有機發光二極體（簡稱 OLED），正將色彩與光明帶往從前無法照亮的領域。「碳、氫、氧、氮、磷、硫」等有機元素，除了是構成人體的必要生命元素，經由化學家巧手設計，也能變成\
    \ OLED 有機能光電材料。OLED 材料由「碳、氫、氧、氮、磷、硫」等原子以共價鍵形式的分子所構成，手牽手連結成具有雙鍵的有機化合物，經過化學家設計分子結構，也就是誰和誰牽手、誰牽幾雙手，藉以發出不同色光，當電力供應至適當電壓時，正極電洞與陰極電子便會在發光層中結合並釋放光子，依其材料特性不同，產生三原色光，構成基本色彩。\n\
    \    有別於一般LED 用的是「無機」半導體材料，無機半導體材料是由硬梆梆的金屬、類金屬、半導體元素組成的「塊材」，整體一塊無法彎曲。OLED 材料由「有機」分子堆疊構成連續性薄膜，每層薄膜厚度不到\
    \ 0.0001 公分，柔軟可彎曲。目前OLED 已逐漸廣泛應用在各種尺寸的顯示器，包含大型電視、筆電/手機用螢幕，AR/VR 頭戴顯示裝置中的微型顯示器。OLED\
    \ 的特性是自發光，可視度和亮度均高，且無視角問題，再來是驅動電壓低且省電效率高，加上反應快、重量輕、厚度薄，構造簡單，成本低等，被視為21 世紀最具前途的產品之一。"
