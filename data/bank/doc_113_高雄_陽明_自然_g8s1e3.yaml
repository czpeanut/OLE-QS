    content: 稀土元素全部都是地殼中的天然元素
  group_stem: "【科普閱讀】稀土是什麼？稀土元素？稀土用途？\n    最近看到不少新聞在講「稀土」，在軍事、高科技產業方面都需要仰賴稀土元素。稀土顯然成為貿易戰下新一輪的導火線，但什麼是稀土？稀土元素有哪些？\
    \ 稀土元素用途是什麼？\n    稀土雖然罕見，但稀土一點都不稀少，例如鈰是地殼中第 25 豐富的元素，比鉛含量還多。而稀土元素中最少的鎦，它在地殼中的存量甚至比金還要多出\
    \ 200 倍。然而大部分的稀土金屬在地殼中廣泛分散，很少有集中的礦床能供人們進行商業開採，且開採的成本也甚高。\n     所謂「稀土元素」，在元素週期表中，「稀土元素」就是鑭系元素，再加上鈧和釔，從原子序57的「鑭」到71\
    \ 的「鏀」的15 個金屬元素，再加上「鈧」及「釔」。它們的顏色大多為銀白色，但氧化物顏色多元。稀土金屬在200 年前被發現。首先被分離出來的稀土元素是「鈰」，最後被發現的自然元素是「鎦」，而「鉕」則是美國科學家透過核反應才找到的人造元素。我們每天使用的手機，因為添加了「鑭」而能夠增加亮度；「釹」可用於製造高強度的永久磁鐵被應用在電動車、麥克風、磁鐵、震動裝置上。運動場的照明燈其實有添加「鈧」，黃色的用料水彩有「鐠」，「銪」是彩色電視機的紅色螢光體，「鋱」是彩色電視機的綠色螢光體，「鏑」使用在印表機的噴頭，「鈥」用在醫療打碎結石的雷射手術，醫美去斑也會用到「鈥」這些稀土元素的應用，與我們的生活比我們想像地還要靠近。"
