  group_stem: "【閱讀題組】國中理化告訴你：為什麼不該在派對上，將25 公斤乾冰丟泳池？\n    近期某國外網紅在慶祝生日時，為了降低游泳池水溫並炒熱派對氣氛，將預先準備好的\
    \ 25 公斤乾冰倒入泳池內。瞬間逸出的大量二氧化碳造成泳池中三人窒息身亡，另有多人受傷送醫。為什麼會發生此悲劇呢?\n    在常溫常壓下，乾冰是__○甲___，成本低廉，常用於冷卻或製造舞台效果，不過「乾冰中毒」的危害可是不容低估。乾冰致死的意外其實不是第一次發生，教育局甚至還因為某學校校慶活動中的意外，特別公告使用乾冰的注意事項，以及使用乾冰的風險性。在常溫常壓下，乾冰發生__○乙___時產生的氣體會快速填充室內，只要濃度大於\
    \ 10%，就會引發呼吸困難、噁心、嘔吐、數分鐘後精神恍惚，並在 15 分鐘內失去知覺。此氣體同時也會取代空氣中的氧氣，造成中毒昏迷的受害者缺氧而死。回到這次的意外。當大量乾冰倒入水中的時，乾冰劇烈地__○乙__，變成低溫的__○丙___。當池水快速冷卻之際，水面上也被鋪天蓋地的白霧籠罩。然而這些白霧是因為乾冰所產生的冰冷氣體使得周圍空氣中的水氣瞬間被凝結而形成的__○丁___，就像打開冰櫃時流瀉而出的霧氣一樣。\n\
    \    由於二氧化碳分子比空氣重，且冰冷的氣體密度較高，因此在沒有擾動或對流的情況下，「這些白霧和二氧化碳將留在泳池低處，相反的，燃燒或爆炸產生的煙霧會向上竄」，因此只要\
    \ 25 公斤的乾冰就能讓一般小型泳池面達到 30% 的二氧化碳濃度，造成人體立即失去意識的危險。那麼二氧化碳濃度上升得有多快呢？這取決於乾冰的形狀大小和水溫等因素，相較之下比較難估計。不過就算\
    \ 25 公斤的乾冰慢慢地__○乙___，溫度上升後均勻擴散，最後依舊足以讓整個室內泳池陷入 30% 的二氧化碳濃度。在密閉空間使用如此大量的乾冰絕對不是個好主意，在車內或實驗室等場所都要特別注意。就算是演唱會的室外舞台，在無風的情況下也會在台前累積較高濃度的二氧化碳，千萬必須當心。"
