  group_stem: '| 諺語 | 解析 |

    | :--- | :--- |

    | 天上鉤鉤雲，地上雨淋淋 | 鉤卷雲向上的一頭會有小鉤，狀似逗號，出現時通常意謂著陰雨天氣。 |

    | 天上鯉魚斑，明日晒穀不用翻 | 指透光高積雲，形狀如整齊排列的魚鱗，出現於三千公尺以上的高空。這種雲出現時表示雲層很薄，未來數日天氣穩定，故農夫可放心在屋外晒稻穀，不必擔心下雨。
    |

    | 魚鱗天，不雨也風顛 | 若雲的分布以卷積雲為主，表示將有不穩定的天氣系統影響此區域，未來可能出現陰雨、大風的天氣型態。 |

    | 天有城堡雲，地上雷雨臨 | 夏季出現底部平坦、雲體成條狀、頂部突起的高積雲，表示暖溼空氣與冷乾空氣在高空相遇，通常會在白天時產生雷陣雨。 |

    | 棉花雲，雨快臨 | 棉花雲指絮狀高積雲，出現這種雲表明中層大氣層很不穩定，若水氣充足並有上升運動，便會形成積雨雲，不久將有雷雨降臨。 |

    | 江豬過河，大雨滂沱 | 「江豬」意指雨層雲下形狀破碎、狀如成群小豬的碎雨雲。這句諺語顯示，當看見支離破碎的烏雲飄過天河，表明雨層雲中水氣很充足，大雨即將來臨。
    |'
