  group_stem: '長久以來，閃電總是讓人感到恐懼，不過人們對於閃電的好奇也從來不曾停止。18 世紀中葉富蘭克林首開先鋒探索閃電，開啟人類對閃電現象的了解，經過了數百年來不斷的研究，如今我們已漸漸了解閃電發生的機制主要是雲層中的雲粒子（通常是細微的水滴、冰晶或冰雹）碰撞，使得負電荷累積在雲層下方，並與地表形成電位差。隨著電荷累積越來越多，電位差也越來越大，當強大的電位能足以衝破雲層間或雲層與地表間的大氣隔閡時，便會以電流的形式釋放能量，並伴隨著產生光和聲音，這就是我們所見的閃電。

    孕育閃電的積雨雲

    絕大多數的閃電都發生在積雨雲（或稱為雷雨雲）中。當地表受到強烈陽光照射，會吸熱而升溫，進而加熱地表附近的空氣，使空氣受熱膨脹上升，上層冷空氣下降，形成熱對流；上升氣流把溫暖潮濕的空氣送到上空，這些暖濕空氣在高空遇到較冷的氣團，其中蘊含的水氣便凝結成積雨雲。當氣流持續上升，雲也就越積越高，直達更高更冷的高空，雲層中的水氣在此時會不斷累積，變成更大更重的水滴，有的甚至凍結成冰，等到空氣浮力無法支撐時，就會落下成為雨滴或是雪、冰雹。

    向下放電，再往上回擊

    閃電發生的形式有很多種，一般較常見的閃電是雲對地閃電，其他還有雲中閃電、雲間閃電以及通常發生在雲頂的雲對周圍空氣的放電現象。閃電發生的過程非常短暫卻十分複雜，目前科學家比較了解雲對地的閃電。雲對地閃電是先由一個先遣放電過程引發，透過光度微弱的帶電空氣做「先導」，稱為「先導閃擊」，由於它是一個個階段的前進，這個過程稱之為「階梯先導」或是「步進導閃」，每個階段的閃擊約長50
    公尺，時間間隔約為50 微秒。階梯先導是一條游離通道，形成原因是雲層底部的負電荷與地表所帶的正電荷構成一電場，該電場從雲層底部逐漸往下游離空氣，使中性空氣分子解離為正離子和負離子，最後形成一條通道，而在階梯先導接近地表，與自地表形成的向上先導會合的那一剎那，地表累積的正電荷就沿著這條通路向上，形成回擊電流，串連整個閃擊。一個前導閃擊加上一個回擊可視為一個「雷擊」，通常三、四個雷擊會組合成一個「閃光」，而多個閃光則組成一個「閃電」。

    閃電在大自然扮演的角色

    閃電伴隨震耳的巨響，常常讓人感到恐懼。儘管如此，閃電對人類生活與大自然的平衡也有不可磨滅的貢獻。舉例來說，閃電可能引發林火，有助於清除林地中多餘燃料，防止災難性的大火發生；又因為閃電總會劈斷高大的樹木，例如松樹，使得較矮的樹種如樺樹得以獲取足夠的陽光而生存下來。

    除此之外，根據研究，每打一次雷，會使空氣中的氮氣和其他元素結合成大約1~2 噸的氮化物，幾乎等於一座小型化工廠一天的產量，這些氮化物隨著雨滴飄落到地表並融入土壤中，便會形成硝酸鹽。硝酸鹽是天然的氮肥，可大幅提升土壤的肥沃度。閃電也會刺激空氣中臭氧的生成，臭氧可以有效阻隔紫外線，讓人類不至於直接受到強烈的陽光照射，減少皮膚病變的發生。

    摘錄自科學人網站文章（2009.04.03）／作者：盧衍良 ／審稿：許瑞榮（成功大學物理系教授）'
