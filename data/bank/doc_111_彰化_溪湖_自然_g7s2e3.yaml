  - label: A
    content: 二氧化碳排放過量會造成溫室效應，引起全球暖化
  - label: B
    content: 酸雨是工廠和汽機車排放廢氣中含有汙染物質溶在雨水中所致所致
  - label: C
    content: 化石燃料大量使用，使細懸浮微粒PM2.5布滿天空，造成沙塵暴
  - label: D
    content: 戴奧辛是燃燒垃圾的產物，主要會造成空氣汙染，也會造成食物鏈的生物放大作用。
