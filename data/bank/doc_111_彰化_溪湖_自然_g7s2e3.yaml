  group_stem: (六)荔枝椿象有臭屁蟲、臭椿象或荔椿等俗稱，是令臺灣農民頭痛的害蟲，其成蟲喜歡啃蝕荔枝、龍眼等農作物，造成果樹枯萎與落果；荔枝椿象受到驚嚇時所噴出的腐蝕性臭液，若碰到皮膚會刺痛，甚至造成潰爛。而近年除了果樹外，蟲害更已擴及到都市常見的臺灣欒樹等行道樹上。為了徹底防治該害蟲，研究人員嘗試釋放荔枝椿象的天敵ˇ平腹小蜂，作為生物防治的手段。平腹小蜂會在椿象的卵中產卵，幼蟲孵化後會以寄生的椿象卵為食。此方法至今已有不錯的效果，再加上更進一步的研究與改良，可望能持續降低荔枝椿象造成的困擾。試回答下列問題：
