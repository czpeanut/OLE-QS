  stem: (   )有關於引進小花蔓澤蘭所造成的現象，下列敘述何者正確？
  options:
  - label: A
    content: 這是演替的結果，應順其自然
  - label: B
    content: 不當引入外來種生物，可能破壞原本的生態平衡
  - label: C
    content: 應引入多種外來種昆蟲，以控制此植物的繁衍
  - label: D
    content: 外來種植物可增加本地的生物多樣性。
  group_stem: (七)原生於中南美洲的小花蔓澤蘭，早期因為美化、山坡地水土保持等原因引進臺灣，因其生長和繁殖擴散力非常強，在2002 年，全臺灣危害面積曾高達56,848
    公頃，在政府努力防除之下，2021 年底的危害面積已降到3,393 公頃，但仍分布在全臺19 縣市。以前引進小花蔓澤蘭作為水土保持的植被，今日這種植物已經在臺灣造成許多原生植物死亡，而有「綠色癌症」之稱。讀完本文後，試回答下列問題：
