questions:
- id: doc_112_高雄_大灣_國文_g8s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 下列選項「」中的字音，何者全部相同？
  options:
  - label: A
    content: 心驚膽「顫」／如坐針「氈」／如蟻附「羶」
  - label: B
    content: 藩「鎮」之亂／心思「縝」密／「嗔」怒不已
  - label: C
    content: 和「藹」可親／暮「靄」沉沉／「謁」見皇帝
  - label: D
    content: 不教而「誅」／「株」連九族／錙「銖」必較。
- id: doc_112_高雄_大灣_國文_g8s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列選項引號中的注音，何者前後相同？
  options:
  - label: A
    content: 用法皆「為」輕重／不足「為」外人道
  - label: B
    content: 上「行」，出中渭橋／久之，以為「行」已過
  - label: C
    content: 一人犯蹕，「當」罰金／典「當」飾品
  - label: D
    content: 「屬」之廷尉／直系親「屬」。
- id: doc_112_高雄_大灣_國文_g8s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 下列各組「」中的注音寫成國字後，何組前後相同？
  options:
  - label: A
    content: 「ㄅㄧˋ」壘分明／飛簷走「ㄅㄧˋ」
  - label: B
    content: 動作親「ㄋ一ˋ」／銷聲「ㄋ一ˋ」跡
  - label: C
    content: 獎「一ㄝˋ」後進／集「一ㄝˋ」成裘
  - label: D
    content: 四季遞「ㄕㄢˋ」／「ㄕㄢˋ」離職守。
- id: doc_112_高雄_大灣_國文_g8s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 下列選項引號中的字，何者字形前後不同？
  options:
  - label: A
    content: 個性孤「ㄆ一ˋ」／窮鄉「ㄆ一ˋ」壤
  - label: B
    content: 點燃「ㄊㄢˊ」香／享譽文「ㄊㄢˊ」
  - label: C
    content: 退「ㄅㄧˋ」三舍／趨吉「ㄅㄧˋ」凶
  - label: D
    content: 唯唯「ㄋㄨㄛˋ」ㄋㄨㄛˋ／信守「ㄋㄨㄛˋ」言。
- id: doc_112_高雄_大灣_國文_g8s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 下列選項引號中的字，何者字義相同？
  options:
  - label: A
    content: 廷尉奏「當」／廷尉「當」是也
  - label: B
    content: 寸陰「是」競／積非成「是」
  - label: C
    content: 乘「輿」馬驚 ／「輿」論譁然
  - label: D
    content: 廷尉「乃」當之罰金／勝敗「乃」兵家常事。
- id: doc_112_高雄_大灣_國文_g8s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 下列選項中的「於」字，何者與「是法不信於民也」中的「於」字意思相同？
  options:
  - label: A
    content: 孔子適周，將問禮「於」老子
  - label: B
    content: 生「於」憂患，死於安樂
  - label: C
    content: 小子識之，苛政猛「於」虎也
  - label: D
    content: 勞心者治人，勞力者治「於」人。
- id: doc_112_高雄_大灣_國文_g8s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 下列引號中的詞語，何者是指稱自己？
  options:
  - label: A
    content: 「在下」才疏學淺，不敢造次
  - label: B
    content: 感謝「足下」情義相挺
  - label: C
    content: 「閣下」見多識廣，成就非凡
  - label: D
    content: 「殿下」欺壓百姓，應予勸誡。
- id: doc_112_高雄_大灣_國文_g8s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 下列選項何者與「法者，天子所與天下公共也」觀點最相近？
  options:
  - label: A
    content: 不教而誅，則刑繁而邪不勝
  - label: B
    content: 刑過不避大臣，賞善不遺匹夫
  - label: C
    content: 賞善罰惡，剛柔並濟
  - label: D
    content: 法律不外乎人情。
  lesson_raw:
    title: 張釋之執法
    basis: 引用課文《張釋之執法》原句
- id: doc_112_高雄_大灣_國文_g8s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 桑稚在考前複習做世說新語的重點筆記時，因精神不濟，導致內容錯誤百出，請問她只寫對了下列哪一項？
  options:
  - label: A
    content: 是南宋皇族劉義慶，召集許多文士合力編纂而成
  - label: B
    content: 收錄西漢末年至東晉年間的人物事蹟
  - label: C
    content: 是志人類筆記小說，特點為文言、短篇
  - label: D
    content: 記載當代社會各階層人物，忠於史實。
  lesson_raw:
    title: 世說新語
    basis: 題幹提及《世說新語》
- id: doc_112_高雄_大灣_國文_g8s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 下列哪個選項與「民安所錯其手足」的「手足」意思相同？
  options:
  - label: A
    content: 你真的不顧念多年的「手足」之情嗎？
  - label: B
    content: 國家政策搖擺不定，讓百姓「手足」無措
  - label: C
    content: 他們「手足」情深，令人稱羨
  - label: D
    content: 每每想到失散多年的「手足」，就心痛不已。
  lesson_raw:
    title: 張釋之執法
    basis: 引用《張釋之執法》課文句子
- id: doc_112_高雄_大灣_國文_g8s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 根據畫的哀傷一文，岡本所感受到的「哀傷」與下列何者最相近？
  options:
  - label: A
    content: 桃花潭水深千尺，不及汪倫送我情
  - label: B
    content: 共看明月應垂淚，一夜鄉心五處同
  - label: C
    content: 同是天涯淪落人，相逢何必曾相識
  - label: D
    content: 君埋泉下泥銷骨，我寄人間雪滿頭。
  lesson_raw:
    title: 畫的哀傷
    basis: 題幹提及課名《畫的哀傷》
- id: doc_112_高雄_大灣_國文_g8s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 「人生萬事，總得有個變換，方覺有趣，生之於死，喜之於悲，都是如此。推及天時，又何嘗不然？無雨哪能見晴之可愛，沒有夜也將看不出晝之光明。」下列哪一個選項最符合這段文字的觀點？
  options:
  - label: A
    content: 勇於面對黑暗者最終能擁有光明未來
  - label: B
    content: 事物的不同變化能讓人從中領略趣味
  - label: C
    content: 痛苦的人生比順遂的人生更具有意義
  - label: D
    content: 大自然的美景能夠安撫人失意的情緒。
- id: doc_112_高雄_大灣_國文_g8s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 生命中的碎珠舉出許多正面事例來強調善用零碎時間的重要。下列句子皆說明「誠信」的重要，請問何者並非正面言例？
  options:
  - label: A
    content: 俗諺：「一言既出，駟馬難追。」
  - label: B
    content: 西塞羅：「世上沒有比真誠的人更可貴的。」
  - label: C
    content: 孔子：「人而無信，不知其可。」
  - label: D
    content: 巴爾札克：「遵守諾言就像保衛自己的榮譽。」。
  lesson_raw:
    title: 生命中的碎珠
    basis: 題幹提及課名《生命中的碎珠》
- id: doc_112_高雄_大灣_國文_g8s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: 下列「」中的字詞，何者不是假設語氣？
  options:
  - label: A
    content: 天「若」有情天亦老
  - label: B
    content: 「令」他馬，固不敗傷我乎
  - label: C
    content: 「使」安期有此性，猶當無一毫可論
  - label: D
    content: 「唯」陛下察之。
- id: doc_112_高雄_大灣_國文_g8s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 1
  stem: （甲）久「之」，以為行已過 （乙）而廷尉乃當「之」罰金 （丙）今法如此而更重「之」 （丁）上使立誅「之」則已 （戊）廷尉，天下「之」平也 （己）唯陛下察「之」。上列句子中的「之」字，何者完全相同？
  options:
  - label: A
    content: 甲戊
  - label: B
    content: 乙丙
  - label: C
    content: 乙丁
  - label: D
    content: 丁己。
  lesson_raw:
    title: 張釋之執法
    basis: 引用《張釋之執法》課文句子
- id: doc_112_高雄_大灣_國文_g8s1e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 下列對於史記一書的介紹，何者正確？
  options:
  - label: A
    content: 西漢司馬談為史記作者，他繼承父親司馬遷太史令的職位，花費十多年才完成此巨著
  - label: B
    content: 史記記載從黃帝到漢文帝約三千年的歷史，共一百三十篇，分為本紀、表、書、世家、列傳五類
  - label: C
    content: 史記為中國紀傳體之祖，也是斷代史之祖，正史之祖，四史之首
  - label: D
    content: 除了史學方面，史記寫作手法獨到，極具文學價值，成為後代散文的典範，也為後世小說戲曲提供豐富的題材。
  lesson_raw:
    title: 張釋之執法
    basis: 考查《史記》相關常識（張釋之執法出處）
- id: doc_112_高雄_大灣_國文_g8s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 下列對於張釋之執法的句意解說，何者正確？
  options:
  - label: A
    content: 從「久之，以為行已過，即出」可看出縣人驚動皇帝座車並非無心之過
  - label: B
    content: 「令他馬，固不敗傷我乎？而廷尉乃當之罰金！」的言外之意是漢文帝認為縣人的刑罰太重
  - label: C
    content: 「廷尉，天下之平也，一傾而天下用法皆為輕重」張釋之強調司法獨立，不受外界干擾
  - label: D
    content: 漢文帝質疑判決，而張釋之成功說服漢文帝的主要理由為「民安所錯其手足」。
  lesson_raw:
    title: 張釋之執法
    basis: 題幹提及課名《張釋之執法》
- id: doc_112_高雄_大灣_國文_g8s1e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 下列選項，何者文意不通？
  options:
  - label: A
    content: 做事講求天時地利人和，如果時機未到，就應該鳥盡弓藏，以免消耗自己的力量
  - label: B
    content: 看到子怡和阿峰如今形同陌路的樣子，誰能想像他們曾是海誓山盟的戀人呢？
  - label: C
    content: 為求當選，他不惜指鹿為馬，抹黑其他候選人，結果事跡敗露，反而敗選
  - label: D
    content: 你想要在比賽中一鳴驚人，平常得加倍努力才行。
- id: doc_112_高雄_大灣_國文_g8s1e3_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 下列詩句描寫的歷史人物，何者有誤？
  options:
  - label: A
    content: 燃一把火炬／燒死幾百萬條恐懼的書蟲／挖一個坑／儒生走向無邊的地平線──秦始皇
  - label: B
    content: 悲苦時高歌一節離騷／千古的志士淚湧如潮／那淺淺的一灣汨羅江水／灌溉著天下詩人的驕傲──屈原
  - label: C
    content: 沒有把鴻門燃成／一冊楚國歷史／卻讓隱形的蛟龍／銜著江山／遁入山間莽草／他手上捧著的／只是一雙致命的白壁──劉邦
  - label: D
    content: 他是黑夜中╱陡然╱迸發起來的╱一團天火╱從江東熊熊焚燒到阿房宮╱最後自火中提煉出╱一個霸氣磅礡的╱名字──項羽。
- id: doc_112_高雄_大灣_國文_g8s1e3_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 有關一棵開花的樹的句意解釋，下列選項何者錯誤？
  options:
  - label: A
    content: 「如何讓你遇見我／在我最美麗的時刻」的情感接近「女為悅己者容」
  - label: B
    content: 「我已在佛前 求了五百年／求祂讓我們結一段塵緣」凸顯女子對愛情的堅定
  - label: C
    content: 「陽光下慎重地開滿了花／朵朵都是我前世的盼望」強調前世今生的神祕色彩
  - label: D
    content: 「當你走近 請你細聽／那顫抖的葉是我等待的熱情」呈現女子既期待又害怕的心情。
  lesson_raw:
    title: 一棵開花的樹
    basis: 題幹提及課名《一棵開花的樹》
- id: doc_112_高雄_大灣_國文_g8s1e3_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 張釋之執法透過生動的對話，呈現出人物的心緒與鮮活的形象，以下對於人物形象的敘述，何者正確？
  options:
  - label: A
    content: 「曰：『縣人來，聞蹕，匿橋下。久之，以為行已過，即出，見乘輿車騎即走耳。』」──用反詰語氣來呈現犯人驚懼惶恐的神情
  - label: B
    content: 「令他馬，固不敗傷我乎？而廷尉乃當之罰金！」──用較長的判斷句來表達漢文帝憤怒質疑的心理
  - label: C
    content: 「法者，天子所與天下公共也。今法如此而更重之，是法不信於民也。」──多用短促語句來呈現張釋之剛正無畏、直言抗辯的形象
  - label: D
    content: 「良久，上曰：『廷尉當是也。』」──可知漢文帝接受諫言且情緒平靜下來。
  lesson_raw:
    title: 張釋之執法
    basis: 題幹提及課名《張釋之執法》
- id: doc_112_高雄_大灣_國文_g8s1e3_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 下列文句「」中的詞語，何者沒有自謙的含義？
  options:
  - label: A
    content: 雖然琴藝不高，但承蒙大家的鼓勵，我就「獻醜」彈奏一曲
  - label: B
    content: 這是我首次推出的「拙作」，還望文壇先進們不吝賜教
  - label: C
    content: 面對外界的質疑聲浪，我「捫心」自問在執行過程中是否過於草率
  - label: D
    content: 為了增進社會福祉，縱然僅能效「綿薄」之力，我也會全力以赴。
- id: doc_112_高雄_大灣_國文_g8s1e3_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: 生命中的碎珠引用陶潛詩句「盛年不重來，一日難再晨，及時當勉勵，歲月不待人。」作為論據，這首詩的主旨，與下列選項何者相去最遠？
  options:
  - label: A
    content: 少年易老學難成，一寸光陰不可輕。未覺池塘春草夢，階前梧桐已秋聲
  - label: B
    content: 生年不滿百，常懷千歲憂。晝短苦夜長，何不秉燭遊
  - label: C
    content: 天可補，海可填，南山可移。日月既往，不可復追
  - label: D
    content: 莫等閒，白了少年頭，空悲切。
  lesson_raw:
    title: 生命中的碎珠
    basis: 題幹提及課名《生命中的碎珠》
- id: doc_112_高雄_大灣_國文_g8s1e3_s1_24
  section: 1
  number: 24
  type: single
  page: 2
  stem: 下列文句「」中的成語，何者使用不當？
  options:
  - label: A
    content: 敏浩真是一表人才，在眾人間總是「自慚形穢」，顯得那麼突出
  - label: B
    content: 昌燮雖坐擁書城，卻無心學習，可說是現代版的「郝隆曬書」
  - label: C
    content: 東旭貌似潘安，風度翩翩，是許多長輩心目中的「東床快婿」
  - label: D
