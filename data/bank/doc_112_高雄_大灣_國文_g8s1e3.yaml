- id: doc_112_高雄_大灣_國文_g8s1e3_s2_46
  section: 2
  number: 46
  type: single
  page: 5
  stem: 下列個人自責成因的類型配對，何者最恰當？
  options:
  - label: A
    content: 都是因為我段考考得不理想丟爸媽的臉，他們才會吵架那麼凶──加害者心理
  - label: B
    content: 演講比賽我居然會超過時間而沒有得獎，爸媽跟老師一定很失望──英雄情結
  - label: C
    content: 同學看起來並不滿意我幫她繪製的海報，一定是我不夠用心──幸福上限假說
  - label: D
    content: 好同學想換手機，如果我拒絕借錢給他，就是不夠朋友──無期徒刑的罪人。
  group_stem: "習慣性自責有這四種成因與類型，形成一種對自我的框架與設限。\n一、加害者心理\n慣性自責者通常來自於這樣的環境：「要不是你，我早就……」，從小就容易承擔周遭人的情緒，因此覺得如果自己不存在，很多事情都會順利，很多人都會好過許多。所以，他們特別容易看見別人的付出與脆弱。要能適時釐清責任，才能卸下歉疚。\n\
    二、英雄情結\n  有些人認為自己是拯救者，是責任無限上綱的英雄，從拯救與幫助他人的過程獲得被需要與存在感，但只要有人落難或不開心，就會自責。提醒自己，你只是個凡人，唯有每個人願意負擔起自己的責任，才有可能達到你渴望的理想世界。\n\
    三、幸福上限假說\n  這類人一旦靠近幸福時，便會親手摧毀或逃跑，因為他們覺得自己的幸福是背叛。提醒自己，張開手臂好好去愛與被愛，因為愛可以讓你變得強大，當你強大，自責就不再是你的習性。\n\
    四、無期徒刑的罪人\n  當你曾一時失言或失誤而導致強烈的遺憾，便會因為罪惡感而將自己關進永恆的牢房中，不斷用自責鞭打自己。強烈的罪咎感往往來自無法言說的悲傷，當你願意去述說那份失去與遺憾，將有機會重新鬆動緊閉的枷鎖。\n\
    \                    （改寫自吳姵瑩用過度責備緩和歉疚感：習慣性自責有這四種成因與類型）"
