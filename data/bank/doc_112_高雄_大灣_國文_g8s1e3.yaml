- id: doc_112_高雄_大灣_國文_g8s1e3_s2_48
  section: 2
  number: 48
  type: single
  page: 5
  stem: 關於食腦變形蟲，下列選項何者有誤？
  options:
  - label: A
    content: 常出現於大自然的水域中
  - label: B
    content: 在含氯的池水中大量存活
  - label: C
    content: 藉由水吸入鼻腔感染人體
  - label: D
    content: 會進入人體腦部感染神經。
  group_stem: "去年暑假有民眾至室內親水設施遊憩後，被俗稱「食腦變形蟲」的福氏內格里阿米巴原蟲（Naegleria fowleri）感染，診斷出腦膜炎末期死亡的案例，發病六天後即死亡，是國內2011\
    \ 年發生首起個案以來的第二個感染案例。\n  醫師指出染病初期症狀為發高燒、嘔吐、嚴重頭痛，難以與其他腦膜炎區別，潛伏期約1～9 天，病程發展相當快速且死亡率高達97％以上，通常被診斷出來的時候病況已到末期，即便服用抗生素也無效。雖然此起國內案例僅接到非自然水體的親水設施，且尚無法確認感染源，但經過去調查研究指出食腦變形蟲通常出現在溫泉泉水、野溪等自然水體中，食腦變形蟲也確實不易存在於自來水或有含氯的泳池中。其感染途徑為經嗆水或粉塵吸入等在偶然機會下進入鼻腔，沿著嗅神經軸進入腦部，侵入中樞神經。\n\
    \  而針對戲水感染之防範，專家們提出以下幾點建議：1.選擇戶外游泳池或注意室內空氣流通；2.盡量早上游泳（通常這時剛注入新的池水）；3.入池前將身體沖洗乾淨，不宜有傷口下水；4.戴泳鏡，並於結束後沖澡；5.身體不適盡快就醫，並告知戲水接觸史；6.避免眼鼻口嗆水與浸水。尤其是有慢性病、免疫力不佳的老人、小孩都是易被感染的高危險群。疾管署呼籲，民眾應盡量避免攪動有較多微生物的池水底部或淤泥，而若只是飲水，目前全世界未有因飲用汙染水源而被感染的例子。\n\
    \  雖然國內有此起感染的案例，但其感染機率與累積案例非常少，民眾不必太過擔心就不去玩水或游泳。只要保持清潔與留意身體健康，於身體不適時立刻就醫並告知活動史，即可保障戲水兒安全。"
