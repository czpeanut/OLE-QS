- id: doc_113_基隆_銘傳_國文_g9s2e1_s4_29
  section: 4
  number: 29
  type: single
  page: 3
  stem: 根據上文，下列敘述何者正確？
  options:
  - label: A
    content: 器官捐贈一律需要本人簽署同意書
  - label: B
    content: 器官捐贈必須在生前完成意願簽署
  - label: C
    content: B型肝炎患者完全不能進行器官捐贈
  - label: D
    content: 器官捐贈手術不會明顯影響外表美觀。
  group_stem: '器官捐贈簡介

    1. 什麼是器官捐贈？

    器官捐贈指個人在被判定腦死或臨終時，基於生前意願或家屬同意，無償捐贈可用的器官或組織給需要的病人，以幫助其恢復健康、改善生活品質。

    2. 器官捐贈的種類

    • 活體捐贈：五等親內的親屬，若身體健康且經醫學、心理、社會評估適合捐贈，可捐贈肝臟或腎臟予病患進行移植。

    • 屍體捐贈：經診治醫師判定病人死亡後可進行，若為腦死者，需依中央衛生主管機關規定判定程序辦理。

    3. 可捐贈的器官與組織

    依據人體器官移植條例施行細則，可移植的器官包括：

    心臟、肝臟、腎臟、肺臟、胰臟、小腸、骨骼、眼角膜及其他經中央衛生主管機關指定的項目。

    4. 器官摘取是否影響外觀？

    手術採用外科標準技術，摘取後以替代物填充並縫合，外觀不會受到明顯影響，與一般外科手術無異。

    5. B型或C型肝炎患者能否捐贈器官？

    可以，只要器官功能良好，B型或C型肝炎患者仍可捐贈器官給具有相同病史的受贈者。

    6. 器官捐贈的年齡限制

    年齡並非最重要的考量，主要評估捐贈者的生理年齡及器官功能狀況，若器官健康，即使年齡較大仍可捐贈。

    7. 如何表達器官捐贈意願？

    • 可至醫院櫃檯、衛教室或社工單位索取「器官捐贈同意書」，填妥後寄至財團法人器官捐贈移植登錄中心，或透過官網（www.torsc.org.tw）線上簽署。

    • 簽署注意事項：

    1. 須本人親自簽名或由家屬簽署（腦死狀態時）。

    2. 未滿20歲需法定代理人共同簽署。

    3. 罹患無法控制的感染性疾病（如AIDS、CJD）者，不適用捐贈。

    8. 如何查詢是否已加註健保卡？

    • 可至醫院掛號櫃檯查詢。

    • 透過衛生福利部官網（https://hpcod.mohw.gov.tw）查詢，需使用健保IC卡或自然人憑證登入。

    9. 簽署同意書後可否更改意願？

    • 可至器官捐贈移植登錄中心網站（www.torsc.org.tw），選擇「撤銷器官捐贈同意書」，填寫資料後寄回以完成撤銷。

    • 亦可致電衛生福利部安寧療護及器官捐贈意願資料處理小組（02-23582186）辦理撤回。

    （財團法人器官捐贈移植登錄中心〈器官捐贈簡介〉）'
