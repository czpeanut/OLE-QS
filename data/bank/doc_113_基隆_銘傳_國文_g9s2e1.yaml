  stem: 元代·盧摯：「避炎君頻稱竹榻，趁新涼懶裹烏紗。柳影中，槐陰下，旋敲冰沉李浮瓜。會受用文章處士家，午夢醒披襟散髮。」此作品呈現的季節訊息，與下列何者不相同？
