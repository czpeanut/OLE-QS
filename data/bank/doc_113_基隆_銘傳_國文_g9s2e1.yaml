- id: doc_113_基隆_銘傳_國文_g9s2e1_s4_39
  section: 4
  number: 39
  type: single
  page: 5
  stem: 根據本文，試著「推論」蒲松齡的觀點，下列何者錯誤？
  options:
  - label: A
    content: 肯定那些願意無私幫助弱勢族群的人，社會大眾應該向他們學習。
  - label: B
    content: 認為財富應該合理使用，否則將導致人性的扭曲與社會價值觀的錯亂
  - label: C
    content: 富人沉迷於賭博及聲色娛樂時，卻很捨得揮霍錢財來滿足欲望，顯示出對財富的態度矛盾
  - label: D
    content: 當自己身家性命受到威脅時，不吝惜散盡家產以求保命，這是人性，無可厚非，值得原諒。
  group_stem: '《聊齋志異》書中，作者蒲松齡說完〈種梨〉的故事後，還在文末藉由「異史氏曰」發表他的觀點：

    「鄉人憤憤①，憨狀可掬，其見笑於市人，有以哉。每見鄉中稱素封②者，良朋乞米則怫然③，且計曰：『是數日之資也。』或勸濟一危難，飯一煢獨④，則又忿然計曰：『此十人、五人之食也。』甚而父子兄弟，較盡錙銖。及至淫博迷心，則傾囊不吝；刀鋸臨頸，則贖命不違⑤。諸如此類，正不勝道⑥，蠢爾鄉人，又何足怪。」

    蒲松齡透過〈種梨〉的故事，批評了富人的吝嗇與矛盾行為。藉鄉人的結局提醒人們學習傾聽、理解身處困境者的需求，並在行有餘力時展現善意。此外，更進一步揭露了人性的矛盾：富人對待金錢的雙重標準，對財富斤斤計較，卻對無謂的開銷毫不猶豫，顯示出財富管理不當會導致人性的扭曲，以及當時社會錯誤的價值觀，引人深省。

    【注釋】

    ①憤憤：糊塗。憤，音ㄈㄣˋ。

    ②素封：指無官爵封邑，而資財豐厚的富人。

    ③怫然：憤怒、生氣的樣子。怫，音ㄈㄟˋ。

    ④煢獨：此指孤獨無依的人。煢，音ㄑㄩㄥˊ。

    ⑤贖命不違：指人在生死關頭時，急於花費大量金錢來保命，甚至顧不得其他事情。

    ⑥正不勝道：實在說不完。

    （改寫自〈聊齋志異選——種梨〉課文賞析）'
