  group_stem: '孔子觀於呂梁①，縣水三十仞，流沫四十里，黿鼉②魚鱉之所不能游也。見一丈夫游之，以為有苦而欲死也，使弟子並流而拯之。數百步而出，被髮行歌而游於塘下。孔子從而問焉，曰：「吾以子為鬼，察子則人也。請問蹈水有道乎？」曰：「亡，吾無道。吾始乎故，長乎性，成乎命。與齊③俱入，與汨④偕出，從水之道而不為私焉。此吾所以蹈之也。」孔子曰：「何謂『始乎故，長乎性，成乎命』？」曰：「吾生於陵⑤而安於陵，故也；長於水而安於水，性也；不知吾所以然而然，命也。」

    【注釋】

    ①呂梁：有兩說，一說在西河（今山西 離石縣），一說在彭城（今江蘇省 銅山縣）。

