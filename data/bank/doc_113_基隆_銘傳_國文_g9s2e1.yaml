  - label: B
    content: 元代·白樸：「酷暑天，葵榴發，噴鼻香十里荷花。蘭舟斜纜垂楊下，只宜輔枕簟向涼亭披襟散髮。」
  - label: C
    content: 元代·馬致遠：「採蓮湖上畫船兒，垂釣灘頭白鷺鷥。雨中樓閣煙中寺，笑王維作畫師。蓬萊倒影參差。薰風來至，荷香淨時。清潔煞避暑的西施。」
  - label: D
    content: 金朝·元好問：「綠葉陰濃，遍池亭水閣，偏趁涼多。海榴初綻，朵朵簇紅羅。老燕攜雛弄語，有高柳鳴蟬相和。驟雨過，珍珠亂撒，打遍新荷。」
