  stem: 根據文章敘述，季風亞洲涵蓋的範圍大致為下列何者？
  options:
  - label: A
    content: 東亞、中亞、南亞、東南亞
  - label: B
    content: 東亞、東北亞、東南亞、南亞
  - label: C
    content: 東亞、東北亞、西亞、北亞
  - label: D
    content: 東亞、西亞、東北亞、東南亞。
  group_stem: '※閱讀下列文章並回答問題。

    「季風亞洲是受季風影響的亞洲地區。其界線西起印度塔爾沙漠東緣，向東經喜馬拉雅山脈、青藏高原東緣、大興安嶺一線。此線以東的地區在夏天受海洋暖濕空氣影響，獲得降水。冬季受蒙古高氣壓影響變得乾燥。季風的時間與含水多寡對本地區的農業生產至關重要，由於季風具有雨熱同期的特點，該地區水熱條件配合良好，因此水稻可在該地區大面積種植，且種植北界接近黑龍江，是世界上水稻可種植緯度最高的大地區。」請問：'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
