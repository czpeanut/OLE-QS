  stem: 「西方制裁、疫情干擾再加上俄烏戰爭助長原物料價格，使北韓面臨 1990 年代以來最嚴重糧食危機。南韓專家估計目前北韓穀物短缺 100 萬公噸，而這個缺口相當於北韓年需求量的
    20%，原因除了西方國家長期對北韓實施制裁阻礙商品進口之外，北韓私下自中國進口的穀物也受疫情影響而中斷，而北韓境內實施的防疫措施也妨礙市場銷售，讓人民更難取得糧食。」造成北韓糧產不足，常有饑荒的問題，除了政治制度的影響外，與下列何項自然因素關係最密切？
  options:
  - label: A
    content: 夏秋颱風侵襲次數多
  - label: B
    content: 緯度較高，年僅一穫
  - label: C
    content: 板塊接觸帶，平原小
  - label: D
    content: 位居內陸，雨量較少。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
