  stem: 下列關於 1840 年以前，英國在亞洲發展的敘述何者正確？ 【課 p.108、七上課 p.101】
  options:
  - label: A
    content: 15 世紀地理大發現後，英國隨著歐人東來亞洲貿易的腳步，曾與鄭成功簽訂通商協定貿易
  - label: B
    content: 清世祖時，因傳教士捲入宮廷鬥爭遂下令禁教，為方便管理僅限廣州一地為通商口岸
  - label: C
    content: 清仁宗時，派馬加爾尼華交涉，但因禮節問題不歡而散
  - label: D
    content: 18 世紀後，英國大量購買中國絲綢、瓷器、茶葉，但為補救貿易逆差，遂輸出鴉片來平衡。
