  stem: 西元 2015 年後，南韓出現一個新的網路名詞「地獄朝鮮」，意指南韓像極地獄，是個看不見希望的「七拋」世代。對於年輕人而言，不僅就業愈來愈困難，即使就業後，也要為了生存而不斷與他人競爭，地獄朝鮮一詞，即是在這樣的負面、反社會情緒下所誕生。根據上述，造成南韓現今的社會現象，可能與下列何者有關？
  options:
  - label: A
    content: 發展國防重工業，忽略民生工業
  - label: B
    content: 政府扶植中小企業，貧富差距大
  - label: C
    content: 受到國際競爭的影響，失業率高
  - label: D
    content: 大型財閥為經濟主力，掌控資源。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
