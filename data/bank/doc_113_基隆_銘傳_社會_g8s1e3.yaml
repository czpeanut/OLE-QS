  section: 1
  number: 25
  type: single
  page: 3
  stem: 胤元看到清末一段史料如下：「具呈舉人康祖詒等，為安危大計，乞下明詔，行大賞罰，遷都練兵，變通新法，以塞和款而拒外夷，保疆土而延國命，呈請代奏事：竊聞與□□議和，有割奉天沿邊及臺灣一省，補兵餉二萬萬兩，及通商蘇杭，聽機器、洋貨流行內地，免其釐稅等款，此外尚有繳械、獻俘、遷民之說。……又聞臺灣臣民不敢奉詔，思戴本朝。人心之固，斯誠列祖、列宗及我皇上深仁厚澤，涵濡煦覆，數百年而得此……。」請問：關於該事件的敘述何者正確？【課
    p.112】
  options:
  - label: A
    content: 該史料應發生於光緒 21 年，科舉應考者的聯合上書
  - label: B
    content: 由清德宗親政主導，慈禧太后協助，故又稱維新運動
  - label: C
    content: 主要內容有精簡政府機構，廢除科舉以革新教育等
  - label: D
    content: 結果參與變法者全部被判罪處死，改革措施全數被廢除。
