  options:
  - label: A
    content: 甲地喪失的導火線為該國發生外患入侵，因大清帝國與日本共同派兵平亂所導致
  - label: B
    content: 乙地為日本利用牡丹社事件之後成為宗主國，並於 1880 年兼併為其版圖
  - label: C
