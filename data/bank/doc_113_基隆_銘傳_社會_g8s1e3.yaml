- id: doc_113_基隆_銘傳_社會_g8s1e3_s1_21
  section: 1
  number: 21
  type: single
  page: 3
  stem: 西元 1861 年，法國大文豪雨果在給友人的一封信中提到：「有一天，兩個強盜走進圓明園，一個搶了東西，一個放了火，…在兩個勝利者瓜分贓款的條件下，圓明園就大規模地遭到了蹂躪。…把我們各大教堂的寶藏集攏在一起，也是抵不上東方這龐大、輝煌的博物院的。裡面不但有各式各樣的藝術傑作，並且堆積著金銀珠寶。是豐功偉業也是賊運亨通，這個勝利者把口袋裝滿，那個把箱子裝滿，他們手拉手，笑嘻嘻地回到歐洲，這就是那兩個強盜的歷史。我們歐洲人是文明人，在我們眼中，中國人是野蠻人，可是你看文明人對野蠻人做了些什麼？…」由上述這段文字，下列相關敘述正確者為何？
  options:
  - label: A
    content: 這個「文明者的暴行」發生在第二次英法聯軍時，背景是修約被拒
  - label: B
    content: 戰後簽訂的《北京條約》中，開放天津、營口、煙臺、鎮江等通商口岸
  - label: C
    content: 大清帝國在此戰事後割讓香港島，並賠款給戰勝國
  - label: D
    content: 戰後中國允許外人在條約口岸遊歷傳教，使外國勢力由沿海深入內地。【課 p.110】
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_基隆_銘傳_社會_g8s1e3_s1_22
  section: 1
  number: 22
  type: single
  page: 3
  stem: 根據課本後面的探究活動「誰的救國論述？」的三項資料，請問我們可以得到怎樣正確的認知？【課 p.110、120】
  options:
  - label: A
    content: 日本早在 1868 年由坂本龍馬的《船中八策》提出：天下政權當還與朝廷(天皇)、設置上下議政局、設置近衛軍鞏固帝都東京、擴張海軍等主張
  - label: B
    content: 大清帝國於 1860 年開始進行器物層次的改革，重要內容有設立同文館、廣方言館，興辦船政學堂、水師學堂等新式學校，創辦輪船招商局，推動民生經濟
  - label: C
    content: 朝鮮的改革與甲申政變有關，於 1885 年提出，主要內容有：廢止長久以來對日本的朝貢，改革租稅法、保護窮民，設置禁衛隊、確立警察制度
  - label: D
    content: 三個國家都有設置新式軍隊或制度，重視外交關係共同的救國理念，而且後來共同捲入了一場關鍵戰爭。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_基隆_銘傳_社會_g8s1e3_s1_23
  section: 1
  number: 23
  type: single
  page: 3
  stem: 圖二為 1894-1895 刊登在英國 Punch 雜誌的時事漫畫，請同時根據課後閱讀「改變東亞的○○戰爭」一文，找出錯誤的選項？【課 p.111、118、121】
  options:
  - label: A
    content: 朝鮮之所以會出現東學信仰的主要背景為西方列強侵略，挽救國家危亡
  - label: B
    content: ○○戰爭指的是「甲午戰爭」，又稱日清戰爭，爆發主要原因為日本拒不撤兵
  - label: C
    content: 戰後簽訂的條約中，衝擊大清帝國民生經濟最大的是割讓臺灣、澎湖
  - label: D
    content: 列強對此戰爭呈觀望態度，戰後日本成為帝國主義的強權國家，並改變東亞的國際局勢。
