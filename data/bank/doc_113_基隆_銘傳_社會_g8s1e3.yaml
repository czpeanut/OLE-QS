- id: doc_113_基隆_銘傳_社會_g8s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 「南韓堪稱全球在簽署『自由貿易協定』(FTA)上，最積極、最有企圖心的國家，其已與世界諸多國家或區域組織完成簽署。以南韓與歐盟、美國簽署的 FTA
    為例，簽署後 3～5 年內，南韓超過 95%的出口商品都將免關稅。根據評估，與歐盟的 FTA，可讓南韓的國內生產毛額(GDP)增加 3%；與美國的 FTA，能讓南韓對美國的出口增加最高
    20%，GDP 增加 5.6%。」上述可用於說明南韓經濟發展的何項特色？
  options:
  - label: A
    content: 南韓積極推動高科技產業的產業轉型
  - label: B
    content: 南韓與臺灣相同，產品以出口為導向
  - label: C
    content: 南韓以降低關稅的措施保護本國產品
  - label: D
    content: 南韓經濟以自產自銷的內需市場為主。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
