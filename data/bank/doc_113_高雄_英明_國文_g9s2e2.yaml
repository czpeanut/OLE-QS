  group_stem: "（六）\n    東番夷人不知所自始，居澎湖外洋海島中，起魍港、加老灣，歷大員、堯港、打狗嶼、小淡水、雙溪口、加哩林、沙巴里、大幫坑，皆其居也，斷續凡千餘里。種類甚蕃，別為社，社或千人，或五六百。無酋長，子女多者眾雄之，聽其號令。性好勇，喜鬥，無事晝夜習走，足蹋皮厚數分，履荊刺如平地，速不後奔馬，能終日不息，縱之，度可數百里。鄰社有隙則興兵，期而後戰，疾力相殺傷，次日即解怨，往來如初，不相讎。所斬首剔肉存骨，懸之門，其門懸骷髏多者，稱壯士。\n\
    \    地暖，冬夏不衣。婦女結草裙，微蔽下體而已。無揖讓拜跪禮。無曆日、文字，計月圓為一月，十月為一年，久則忘之，故率不紀歲，艾耆老髦，問之，弗知也。\n\
    （節選自陳第 東番記）"
