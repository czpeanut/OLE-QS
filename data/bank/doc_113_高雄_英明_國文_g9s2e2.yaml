  stem: 按照《說文解字》的定義：「集，群鳥在木上也。」觀察「集」字的四種字形演變，其中由左而右依次詮釋為：①甲骨文字形由鳥與木組成，示意鳥落在了樹上。②金文字形顯示多隻鳥在樹枝上。③小篆从隹从木。④楷書則寫成了現在通行的「集」。依上述可得知「集」的造字法則，請判斷下列選項中的字，何者和「集」的造字法則相同？
