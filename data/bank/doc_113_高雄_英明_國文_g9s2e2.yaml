  stem: 甲文中，女子癡心等待心上人且不願另嫁他人的心情與下列何者最為相近？
  options:
  - label: A
    content: 海日生殘夜，江春入舊年。鄉書何處達？歸雁洛陽邊
  - label: B
    content: 秋風吹不盡，總是玉關情。何日平胡虜，良人罷遠征
  - label: C
    content: 知君用心如日月，事夫誓擬同生死。還君明珠雙淚垂，恨不相逢未嫁時
  - label: D
    content: 劍外忽傳收薊北，初聞涕淚滿衣裳。卻看妻子愁何在，漫卷詩書喜欲狂
  group_stem: "（三）\n【甲】\n    晉武帝世，河間郡有男女私悅，許相配適。尋而男從軍，積年不歸，女家更欲適之，女不願行，父母逼之，不得已而去，尋病死。其男戍還，問女所在，其家具說之。乃至冢，欲哭之敘哀，而不勝其情，遂發冢，開棺，女即蘇活，因負還家，將養數日，平復如初。\n\
    （選自干寶 搜神記）\n【乙】\n    大家熟知的莎士比亞名劇羅密歐與茱麗葉，相戀的兩個人，卻因家族世仇的因素受到反對，但羅密歐與茱麗葉並沒有退怯，反而愛得更強烈，甚至最後雙雙殉情……。\n\
    \    心理學家們曾進行這樣的研究：找了 91 對已婚夫婦和相戀 8 個月以上的 49 對戀人，想了解他們之間的「戀愛程度」與「受父母干涉」這兩者的關係，研究結果發現呈現正相關，也就是說，父母干涉程度越強，伴侶之間的感情便越深，心理學家們將其命名為：羅密歐與茱麗葉效應（the\
    \ Romeo and Juliet effect），指的是：當伴侶間的戀情受到外在力量的阻礙越強，雙方的情感反而會更加堅定，正所謂風雨生信心的愛！\n \
    \   很多人好奇，何以會有這樣的現象？專家們認為與「維持認知平衡」有關，因為人們常常會在認知中尋找一致性，當出現不協調的情況時，我們就會透過重新建構自己的認知，來消除不和諧感，因此，當自己所選擇的伴侶，受到重要的家人反對時，這種不一致的現象，便會透過讓自己更愛對方，或相信自己很愛對方的方式，去調節心中的不適感。\n\
    \    此外，也與「維護自尊」有關，因為大多數的人會不小心將自己的選擇與自己的價值感綁在一起，所以當自己所愛、所支持的人受到批評，或自己的選擇受到了否定，便會認為自己整個人不被認同，所以形成一種反抗力，更加堅持住自己，以保護自尊。\n\
    （改寫自胡綺祐 心理學名詞小教室：羅密歐與茱麗葉效應）"
