- id: doc_113_高雄_英明_國文_g9s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: '蘇軾 乞開杭州西湖狀：「杭州之有西湖，如人之有眉目，蓋不可廢也。唐 長慶中，白居易為刺史，方是時，西湖溉田千餘頃。及錢氏有國，置撩湖兵士千人，日夜開浚。自國初以來，稍廢不治，水涸草生，漸成葑田。熙寧中，臣通判本州，則湖之葑合，蓋十二三耳。至今才十六七年之間，遂堙塞其半。父老皆言十年以來，水淺葑橫，如雲翳空，倏忽便滿，更二十年，無西湖矣。使杭州而無西湖，如人去其眉目，豈復為人乎？」（註：葑田：湖面為茭蒲等水生植物占滿，而湖泊漸趨乾涸。）

    以上蘇軾這段文字旨在強調什麼？'
  options:
  - label: A
    content: 西湖的地位重要
  - label: B
    content: 西湖的景致如畫
  - label: C
    content: 杭州人的眉目已廢
  - label: D
    content: 杭州地位不如西湖
- id: doc_113_高雄_英明_國文_g9s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: '謝道韞及遭孫恩之難，舉厝自若，既聞夫及諸子已為賊所害，方命婢肩輿抽刃出門。亂兵稍至，手殺數人，乃被虜。其外孫劉濤時年數歲，賊又欲害之，道韞曰：「事在王門，何關他族！必其如此，寧先見殺。」恩雖毒虐，為之改容，乃不害濤。（晉書
    列傳 列女傳）

    根據這則故事，下列敘述何者最恰當？'
  options:
  - label: A
    content: 劉濤因婢女謝道韞的捨生取義而存活
  - label: B
    content: 謝道韞的丈夫兒子都因孫恩作亂而亡
  - label: C
    content: 孫恩作亂時，謝道韞和婢女拿著刀逃亡
  - label: D
    content: 王家親屬都因為保護劉濤而被孫恩殺害
- id: doc_113_高雄_英明_國文_g9s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 「砒霜下毒，在古裝劇或宮廷劇都是常出現的情節。但是，砒霜急性中毒的症狀主要是胃腸方面的，例如嘔吐、腹痛、及腹瀉，最終造成死亡則是心臟衰竭的因素，而非劇情演的七孔流血。砒霜是一種無機砷，在中、西醫都有悠久的藥用史，近年來更是成為治療白血病（血癌）的良藥。它對人的致死劑量大約是
    100 毫克左右，而古裝劇常提到的『鶴頂紅』也是砒霜的別稱。」根據上文，下列何人求醫看診時的症狀有可能是誤食了砒霜？
  options:
  - label: A
    content: 明陽
  - label: B
    content: 明瑾
  - label: C
    content: 明宛
  - label: D
    content: 明瑋
