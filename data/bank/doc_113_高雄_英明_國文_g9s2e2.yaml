  stem: "題目：當AI 走進我的生活\n說明：\n          同學們，你跟上流行了嗎？前陣子的網路當紅話題――請AI 製作吉卜力畫風照片，你是不是也躍躍欲試呢？\n\
    \          近年來，AI 科技快速發展，像是ChatGPT、AI 繪圖等工具越來越常見，許多人用AI 來寫文章、畫圖，甚至做學校作業。在日常生活中，諸如人臉辨識、機器人帶位送餐、自動駕駛、醫療協助等，AI\
    \ 已然成為我們日常生活的一部分。這些科技帶來了方便，也引發了許多討論：它們會讓人變得更聰明，還是更懶惰？會幫助學習，還是妨礙思考？\n         \
    \ 請你以「當AI 走進我的生活」為題，寫一篇結構完整的文章，分享你對AI 的觀察與想法。文中可以寫自己或身邊人使用AI 的經驗，也可以思考AI 帶來的正面與負面影響，並說明你面對這些變化的看法與因應之道。\n\
    \n※注意：\n1.請勿抄寫說明中的文句作為內容。\n2.請以黑色原子筆書寫。\n3.文體除詩歌之外，其他文體不拘。\n4.要寫題目。"
