  stem: 關於祭鱷魚文一文的敘述，下列何者正確？
  options:
  - label: A
    content: 此處鱷魚傷人食人，危害甚劇
  - label: B
    content: 作者寫祭文，希望鱷魚主動離開
  - label: C
    content: 北方的大海是鱷魚的最佳歸宿
  - label: D
    content: 搬遷限期五天，超過必下殺手
  group_stem: "（五）\n    刺史受天子命，守此土，治此民，而鱷魚睅然不安溪潭，據處食民畜、熊、豕、鹿、獐，以肥其身，以種其子孫，與刺史抗拒，爭爲長雄。刺史雖駑弱，亦安肯爲鱷魚低首下心，伈伈睍睍，爲民吏羞，以偷活於此耶？且承天子命以來爲吏，固其勢不得不與鱷魚辨！\n\
    \    鱷魚有知，其聽刺史言：潮之州，大海在其南。鯨、鵬之大，蝦、蟹之細，無不容歸，以生以食，鱷魚朝發而夕至也。今與鱷魚約：盡三日，其率醜類南徙於海，以避天子之命吏；三日不能，至五日；五日不能，至七日；七日不能，是終不肯徙也。是不有刺史，聽從其言也。不然，則是鱷魚冥頑不靈，刺史雖有言，不聞不知也。夫傲天子之命吏，不聽其言，不徙以避之，與冥頑不靈而爲民物害者，皆可殺。刺史則選材技吏民，操強弓毒矢，以與鱷魚從事，必盡殺乃止。其無悔！\n\
    （節選自韓愈 祭鱷魚文）"
