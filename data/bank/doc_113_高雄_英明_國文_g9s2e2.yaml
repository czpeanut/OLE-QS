  stem: 「某位漫畫家曾經傳授學生繪畫方法，比如可以在公車裡滿不在乎的看著對面的乘客，藉此攫取觀察人類面部表情的機會。但很明顯的，                    ，而狠狠的被瞪了回來。因此，內斂而不失敏捷的眼光，正是在車上所應抱持的理想姿態。」根據文意，畫線處填入下列何者最恰當？
