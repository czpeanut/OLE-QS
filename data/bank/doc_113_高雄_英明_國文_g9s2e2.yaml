  group_stem: "（四）\n    陽羨 許彥於綏安山行，遇一書生，年十七、八，臥路側，云腳痛，求寄鵝籠中。彥以為戲言。書生便入籠，籠亦不更廣，書生亦不更小，宛然與雙鵝並坐，鵝亦不驚。彥負籠而去，都不覺重。前行息樹下，書生乃出籠，謂彥曰：「欲為君薄設。」彥曰：「善。」乃口中吐出一銅奩子，奩子中具諸饌肴，珍饈方丈。其器皿皆銅物，氣味香旨，世所罕見。（選自吳均續齊諧記）"
