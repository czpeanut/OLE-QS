  stem: 下列關於菊花、禁中九日對菊花酒憶元九這兩首詩的敘述，何者正確？
  options:
  - label: A
    content: 由「遍繞籬邊日漸斜」，可知本詩描寫清晨菊花之景
  - label: B
    content: 由「不是花中偏愛菊」，可知元稹並非真心喜愛菊花
  - label: C
    content: 由「宮花滿把獨相思」，可知白居易在皇宮思念元稹
  - label: D
    content: 由「盡日吟君詠菊詩」，可知元稹詩作中以詠菊最好
  group_stem: "（一）\n    偉大的社會寫實詩人白居易，詩歌通俗，婦孺皆知，在當時即以詩歌聞名，具有良好的名聲，受到大家的喜愛。唐人讀詩、寫詩、愛詩、吟詩成為生活的一部分，但是熱愛一個人的詩歌，到了要將詩歌刺青在身上，這樣瘋狂的舉動和行為，在歷史上絕對是「空前絕後」的事，據唐人段成式在酉陽雜俎前集卷八中，記載了這樣新奇有趣的事：\n\
    \    荊州街子葛清，勇不膚擾①，自頸以下，遍刺白居易舍人詩。成式嘗②與荊客陳至呼觀之，令其自解，背上亦能暗記。反手指其札處，至「不是此花偏愛菊」，則有一人持杯臨菊叢；又「黃夾纈林③寒有葉」，則指一樹，樹上掛纈④。凡刻三十首餘，體無完膚，陳至贊為「白舍人行詩圖」也。\n\
    \    這位荊州男子葛清，的確十分勇敢又特別，全身刺青刻上了白居易的詩句，不僅如此，還配上圖畫，真是圖文並茂，難怪陳至要稱他為「白舍人行詩圖」。若在當時葛清與白居易相遇，脫去上衣，呈現詩句、圖案，真不知白居易會作何感想，感謝他的厚愛？還是感動遇到知音？\n\
    \    筆者查證了白居易的這兩首詩，其實有一首是他的好友元稹寫的，元稹的詩題為菊花，詩如下：\n    秋叢繞舍似陶家，遍繞籬邊日漸斜。不是花中偏愛菊，此花開盡更無花。\n\
    \    而白居易的詩是禁中九日對菊花酒憶元九，其詩如下：\n    賜酒盈杯誰共持，宮花滿把獨相思。相思只傍花邊立，盡日吟君詠菊詩。\n    白居易是唱和之作，在重陽節這一天飲菊花酒，回想起他的好友元稹，整天吟詠元稹的菊花詩。所以當時這位白居易忠實的詩迷，用現代話云死忠的「粉絲」，將白居易詩刺青在身上，真是瘋狂的行為。（選自唐詩趣談\
    \ 臺灣書房出版公司）\n註：①勇不膚擾：相當勇敢，不怕皮膚受到針刺之痛。②嘗：曾經。③黃夾纈林：林木盡成黃色。纈，音ㄒㄧㄝˊ。④纈：印染花紋的絲織品。"
