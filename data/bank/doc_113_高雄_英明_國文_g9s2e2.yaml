- id: doc_113_高雄_英明_國文_g9s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 「遺物整理師經常被許多人問到：『有避免孤獨死的方法嗎？』她回答：『沒有任何人可以預知，什麼時候會在哪裡死去及怎麼死去，誰都有可能會發生孤獨死。所以孤獨死，沒有好與不好的問題。真正的問題在於死了多久才被發現？如果時間拖太久，遺體開始腐爛才被發現，是大家最不願意看到的事情。』」這段文字的含義與下列何者最接近？
  options:
  - label: A
    content: 遺物整理師提出許多避免孤獨死的方法
  - label: B
    content: 遺物整理師認為孤獨死是最慘的死亡結果
  - label: C
    content: 遺物整理師不樂見孤獨死的死者太晚被發現
  - label: D
    content: 造成孤獨死的原因，即為人們都太享受孤獨
