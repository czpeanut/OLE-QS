  group_stem: "（七）\n請閱讀以下短文,並回答47〜48 題：(請注意甲乙丙三段須重組）\n    一期稻作陸續開花吐穗了，稻田由青綠蔓延成耀眼的金黃色。在土堆上嬉戲的、樹梢上打盹休憩的、水窪邊洗澡的麻雀變少了，但稻田裡卻「鳥」滿為患，牠們伺機享用新鮮美味的稻穀，運氣好時還可以吃到飽哩。\n\
    \    農人辛苦忙碌了幾個月，當然不可能輕易讓麻雀來偷食稻穀，蒙受損失，因此想盡一切辦法阻擋及驅趕麻雀的偷竊行為。循著屋後的產業道路往前走，兩旁的稻田大都已完成防盜措施。\n\
    \   【甲】父親是少數未圍彩帶、未燃放鞭炮驅趕麻雀的農人，卻也吩咐我下班後要去田頭田尾大喊及用力拍掌，提醒那些小傢伙適可而止，不要吃得太過分了。我是到田裡了，可未做太明顯的驅趕動作，草率了事。\n\
    \   【乙】心裡總覺得牠們又吃不了多少，而且父親種菜時，麻雀也挺賣力啄食菜蟲的，雖然純粹是為了填飽肚子，可是幫了大忙是不爭的事實。這回我算是還了人情，雙方互不相欠了。\n\
    \   【丙】大部分農人不是在稻田圍起反光彩帶製造欺敵效果，就是立著維妙維肖的稻草人，或綁幾隻老鷹造型的風筝迎風飛翔嚇唬麻雀；有的則加碼在電線杆上吊掛香炷及十來枚鞭炮，香炷燃燒到哪，鞭炮便施放到哪，最好是讓麻雀嚇破膽，不敢再來。\n\
    (黃志聰 驅趕)"
