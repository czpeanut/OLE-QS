- id: doc_113_高雄_英明_國文_g9s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 「孟子以牛山之木為比喻來說明人性，牛山之木曾經長得茂盛，由於它鄰近都城郊外，常有人用刀斧砍伐，便失去了茂美的樹林。不過，在黃昏夜間，受到雨水露珠的滋潤，就有嫩芽新芽生長出來，但是這些嫩芽卻被放牧的牛羊給啃光了，因此就成為現在光禿禿的樣子了。人們看見那光禿禿的樣子，就以為牛山不曾有過茂美的大樹，這哪裡是牛山的原貌呢？那麼在人的身上，難道說會沒有仁義之心嗎？如果能夠得到正確的培養，沒有什麼東西不能生長；如果得不到正確的培養，沒有什麼東西不會消亡。」有關本文的說明，下列何者正確？
  options:
  - label: A
    content: 牛山之木因為受到砍伐而不再有生機
  - label: B
    content: 牛山失去茂盛樹林的過程是積累而成的
  - label: C
    content: 人性與物性相同，均十分注重天時之利
  - label: D
    content: 存養功夫可讓人建立原未具有的善性
- id: doc_113_高雄_英明_國文_g9s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 3
  stem: 「蟬噪林逾靜，鳥鳴山更幽。此地動歸念，長年悲倦遊。」（王籍 入若耶溪）詩中以「蟬噪」、「鳥鳴」反襯夜的寂靜，下列何者也運用相同手法？
  options:
  - label: A
    content: 千山鳥飛絕，萬徑人蹤滅。孤舟蓑笠翁，獨釣寒江雪（柳宗元 江雪）
  - label: B
    content: 移舟泊煙渚，日暮客愁新。野曠天低樹，江清月近人（孟浩然 宿建德江）
  - label: C
    content: 眾鳥高飛盡，孤雲獨去閒。相看兩不厭，唯有敬亭山（李白 獨坐敬亭山）
  - label: D
    content: 山光悅鳥性，潭影空人心。萬籟此俱寂，但餘鐘磬音（常建 題破山寺後禪院）
