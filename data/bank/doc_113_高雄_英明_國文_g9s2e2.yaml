- id: doc_113_高雄_英明_國文_g9s2e2_s2_49
  section: 2
  number: 49
  type: single
  page: 10
  stem: 根據本文，下列關於紫藤的說明，何者正確？
  options:
  - label: A
    content: 花期：三月開花，花期可延續到隔年立春
  - label: B
    content: 外形：莖條具纏繞姓，花朵成串散垂而下
  - label: C
    content: 花色：顏色多樣，紫色、白色為原生品種
  - label: D
    content: 品種：有瓔珞、銀藤，紅玉藤等各種品種
  group_stem: "（八）\n    每年一到立春，我家的紫藤花就開了，把前院點綴得淡綠淺紫，雅美無匹。加州 矽谷很適合栽植紫藤花，我先把一株紫藤樹種在日曬充足之處，三月起，只見藤花滿樹，一串串在春風中搖曳低垂，美如瓔珞，可以一直賞到五月。\n\
    \    紫藤花很早就見於《山海經》、《爾雅》，而專寫花木的古籍《花經》也曾說過：「紫藤緣木而上，條蔓糾結，與樹連理，瞻彼屈曲蜿蜒之狀，有若蛟龍出沒於波濤間；仲春著花，披垂搖曳，宛如瓔珞坐臥其下，渾可忘世。」可見紫藤的原生品種是開紫花的，但後世經過改良，才又出現了一些新的品種，色香各有千秋。如銀藤，開雪白色的花朵，香氣特別濃烈，在加州\
    \ 矽谷也可以看到。還有「多花紫藤」，花多而小，花冠淡青色；甚至還有「紅玉藤」，花大而色澤桃紅。\n    紫藤花是可食的，有迷人的香味，而且花蕊中藏有大量的花蜜，盛開時蜜蜂飛舞，嗡嗡不絕，即使做成菜肴、糕餅，仍依稀可聞。中國\
    \ 明代定王 朱橚所著的《救荒本草》一書中，曾將紫藤花稱為「藤花菜」，說它可做為乾旱時的救命恩物。其實吃紫藤花豈止可以救荒，而簡直是一種難得的人生享受。如今中國民間仍有採食紫藤花的習慣。紫藤花可清炒，可沾麵糊油炸，可做成精緻的甜點，都是甘芬沁人的風雅珍饈。\n\
    \    最近我還發現紫藤花最美味的吃法，其實就是生吃。我今晨採下一朵帶露的紫藤花，一時忍不住放入口中，只覺滿嘴芬芳，細嚼後又有絲絲的甜味，粉嫩的花瓣毫無餘渣，入口即化。我一時興起，又採了幾朵紫藤花，拌入酸奶中當早餐食用，花香伴著奶香，又是另一種風味。此外，紫藤花加油鹽清炒，可當蔬菜食用。紫藤花加麵粉、白糖蒸熟，便是一道家常的甜點。\n\
    \    總之，紫藤花不但雅麗可賞，而且香美可食，宜甜宜鹹，宜濃宜淡，是最值得珍愛的花卉之一。但餐桌上的紫藤花宜素不宜葷，宜簡不宜繁。魚肉的葷腥之氣，反會干擾它的麗質天生與甜美的幽雅香氣，這是我品味紫藤花的小小心得。（節選自周芬娜紫藤飄香的季節）"
