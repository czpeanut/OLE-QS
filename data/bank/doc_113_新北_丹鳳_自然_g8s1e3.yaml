- id: doc_113_新北_丹鳳_自然_g8s1e3_s4_41
  section: 4
  number: 41
  type: single
  page: 3
  stem: 請問熱平衡是否滿足Ｐ關係：
  options:
  - label: A
    content: 是
  - label: B
    content: 否
  group_stem: "有一種二元關係，用來討論兩物件之間的聯繫，例如：運算中的等於、大於或是幾何中的相似關係。\n\n第一種關係 與自身相關的關係\n  \
    \  例如：整數中 2 = 2 可以\n                 2 > 2 不可能\n    所以大於的關係中不存在這種關係\n第二種關係 可以交換的\n\
    \    例如： 2 × 3 = 3 × 2  可以\n           6 ＞ 3 ， 3 ＞ 6.   不可以交換\n    所以大於的關係中不存在這種關係\n\
    第三種關係. 具有遞移性\n例如兩數的大於關係\n    如果ａ＞ b 且b ＞ c ，則a ＞ c\n\n如果我們規定：\n同時滿足第一種關係與第三種關係的稱為Ｐ關係\n\
    同時滿足Ｐ關係與第二種關係的稱為Ｅ關係\n\n現在我們來看熱平衡\n一個熱系統有許多相關的變數，能量進出系統的過程中總是涉及這些變數的變化，例如壓力、體積等。\n\
    \n實驗結果一\n當一個密閉系統自身相關的熱力變數不再改變後，我們說這一個系統正處于自身的熱平衡狀態，只要不與外界交換能量，這種平衡將一直保持下去。\n\n\
    實驗結果二\n若將兩個自身都處於熱平衡狀態下的兩密閉系統接觸，兩系統只可以彼此交換能量，不能與兩系統以外的環境交換能量，則兩系統最後一定會達成平衡狀態，兩系統自身的熱力變數在平衡後均不再改變。\n\
    \n科學家從大量的實驗中發現一個定理\n在實驗結果一與實驗結果二的前提下\n若Ａ系統與Ｂ系統處於熱平衡狀態\n且\nＢ系統與Ｃ系統也處於熱平衡狀態\n則\n\
    Ａ系統與Ｃ系統也必定處於熱平衡狀態\n\n根據上述文章回答下列問題："
