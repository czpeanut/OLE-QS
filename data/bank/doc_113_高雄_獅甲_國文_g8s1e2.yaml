- id: doc_113_高雄_獅甲_國文_g8s1e2_s5_30
  section: 5
  number: 30
  type: single
  page: 4
  stem: 陶淵明面對「政治腐敗、生靈塗炭」的東晉時代，以〈桃花源記〉描繪他心中純淨和平的烏托邦世界，堪稱為中國「烏托邦文學」代表作。下列作品中，何者之創作動機、背景及主旨與〈桃花源記〉最為類似
  options:
  - label: A
    content: 日本大導演黑澤明的名作「《夢．水車村》」，反映科技文明社會下人們悖離大自然生存之道，汙染環境同時也染及人類的心靈世界。在這個如夢似境的桃花源世界中，人們和諧共處，純樸良善，以平常心看待生死，讓現代的人們體悟：只要能夠尊重自然、平和共生，理想的桃花
      源在每個人的心中
  - label: B
    content: 英國詹姆斯．希爾頓《失去的地平線》小說發表的時候，西方世界剛結束第一次大戰，可是 第二次大戰的烽煙又將燃起，使人們開始將目光轉向寧靜和平古老的東方，尋求人類精神的安身立命之所。希爾頓將中國
      西 藏描繪成永恆寧靜的香格里拉，人與自然和諧相生，生活祥和安寧，但希爾頓曾經肯定地說，他的讀者是不可能在現實中找 到香格里拉的，因為它只存在於人們心中。
  - label: C
    content: 俄薩米亞丁《我們》描述西元二十六世紀時，全世界統一，人民沒有姓名、靈魂，只有編號，身穿制服，隨時遵照作息表，過著無慾無求的生活。但是，有一天號民
      D-503 產生了愛情與嫉妒的情緒，逐漸從「我們」的集體生活中分裂出「我」的個體私心，遂被抓去動手術割去「想像力」，也去除私心
  - label: D
    content: 赫胥黎《美麗的新世界》描繪了科學主義的烏托邦。在二十五世紀的倫敦，完全中央集權，沒有家  庭制度、宗教信仰和倫理道德，人類的生殖皆由育種中心培育試管嬰兒，不允許女人懷孕，每個人一出生就決定社會階級，
      每人都有工作，社會井然有序，並用迷幻藥麻醉人生，給予人們安於現狀的快樂。
