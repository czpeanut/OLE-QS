  stem: '下列是仁欣醫院在進行手術治療前，提供給患者的麻醉風險等級表，依據表中的資訊，敘述錯誤的是：


    | 麻醉風險等級表 | | |

    | :--- | :--- | :--- |

    | 級別 | 病人狀態 | 死亡率 |

    | 1 | 健康 | 0.06～0.08% |

    | 2 | 有輕微的全身性疾病，但無功能上的障礙 | 0.27～0.4% |

    | 3 | 有中度至重度的全身性疾病，且造成部分功能障礙 | 1.8～4.3% |

    | 4 | 有重度的全身性疾病，具有相當程度的功能障礙，且時常危及生命 | 7.8～23% |

    | 5 | 瀕危，無論是否接受手術治療，預期在24 小時內死亡 | 9.4～51% |'
