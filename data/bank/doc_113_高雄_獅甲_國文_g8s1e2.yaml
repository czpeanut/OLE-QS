  stem: 依據上文，對於越巫形象的描寫，最適當的是：
  options:
  - label: A
    content: 仗恃靈力，脅制鄉里
  - label: B
    content: 無知自是，誤人害己
  - label: C
    content: 設壇召魅，作法自斃
  - label: D
    content: 惡行易改，心魔難除
  group_stem: '(二)

    越巫自詭善驅鬼物。人病，立壇場，鳴角1 振鈴。跳擲叫呼，為胡旋舞，禳2 之。病幸已，饌酒食，持其貲3 去，死則諉以它故，終不自信其術之妄。恆誇人曰：「我善治鬼，鬼莫敢我抗。」惡少年慍其誕，瞷其夜歸，分五六人棲道旁木上，相去各里所，候巫過，下砂石擊之。巫以為真鬼也，即旋其角，且角且走，心大駭，首岑岑4
    加重，行不知足所在。稍前，駭頗定，木間砂亂下如初，又旋而角；角不能成音，走愈急。復至前，復如初，手慄氣懾不能角，角墜；振其鈴，既而鈴墜，惟大叫以行。行聞履聲及葉鳴谷響，亦皆以為鬼號，求救於人甚哀。夜半抵家，大哭叩門，其妻問故，舌縮不能言，惟指床曰：「亟5
    扶我寢，我遇鬼，今死矣！」扶至床，膽裂，死，膚色如藍。巫至死不知其非鬼。

    （方孝孺〈越巫〉）

