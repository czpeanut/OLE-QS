  stem: 「書展，不只是陳列書，也傳達著策展人與設計者的理念。運用８０００個瓶蓋，結合環保的概念，以及山與海的意象，呈現出世界繽紛美好的樣貌。６０本環境好書，從減塑、氣候變遷，到我們所居住的藍色星球上的生物多樣性等等。邀你一起，讀好書救地球！」上文是一則圖書館書展的文案，此書展主題應為下列何者？
