- id: doc_113_高雄_獅甲_國文_g8s1e2_s4_5
  section: 4
  number: 5
  type: single
  page: 1
  stem: 「圖書館也可說是一間靈屋，因為收藏的都是不同年代的作者之書，而書即是作家的靈魂。」這段文字的含義與下列何者最接近？
  options:
  - label: A
    content: 書籍內容會反映出作者的人格特質與思想
  - label: B
    content: 內容活潑生動的書籍，彷彿具有靈魂
  - label: C
    content: 圖書館必定會收藏當代最具代表性的作家作品
  - label: D
    content: 圖書館會不定時邀請不同年代的知名作家來演講。
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
      code: 第九課
      title: 一棵開花的樹
      chapter: null
    textbook: 八上 第九課 一棵開花的樹
    labeled_by: ai
- id: doc_113_高雄_獅甲_國文_g8s1e2_s4_6
  section: 4
  number: 6
  type: single
  page: 2
  stem: 文中「活著的時候就心甘情願把自己埋進納骨塔」的含義，與下列何者最接近？
  options:
  - label: A
    content: 不慕榮利,甘心隱姓埋名
  - label: B
    content: 不求甚解，掌握書本精髓
  - label: C
    content: 槁木死灰,喪失生命希望
  - label: D
    content: 沉浸書堆,從中獲得精神糧食。
  group_stem: "寒假期間的圖書館，呈現一種難得的閒逸姿態。這一棟半圓形的八層樓建築，環壁皆書，中間留下跟應用坪數相等的半圓形空間。從五樓俯望，偌大的建築顯得十分空洞。陰冷盤踞了多餘的空間，恍如進入一座潔淨，但森冷的納骨塔。整齊有序的書本，宛如一個個編號的骨灰罈，罈子裡都裝載著作者的魂。也許讀書的心都冬眠去了，這些思考宇宙大道，辯解生命本質的沉重書魂，都顯得有些黯然。\n\
    \  我通過文字開啟深邃寬廣的知識世界，同時釋放囚在罈子裡的書魂。我們的交談安靜而無聲。這種滅音的交談沒有負擔，對方的想法不盡完善，就在架上搜尋互為補強的觀點，讓不同意見的寄魂去辯駁。年輕的書魂總是按捺不住脾氣，氣勢凌厲且偏激；老書魂則不動如山，總能敗部復活，在逆境裡扭轉乾坤。讀書比看戲更令人著迷，難怪有不少讀者活著的時候就心甘情願把自己埋進納骨塔，想來精采的書還真有勾魂攝魄的魅力。\n\
    —改寫自鍾怡雯〈藏魂〉"
  tags:
