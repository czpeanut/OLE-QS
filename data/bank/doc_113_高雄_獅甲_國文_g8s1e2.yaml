- id: doc_113_高雄_獅甲_國文_g8s1e2_s4_4
  section: 4
  number: 4
  type: single
  page: 1
  stem: 「坐上不同的椅子，身體即有迥異的姿勢。」下列選項何者最能呼應上述概念？
  options:
  - label: A
    content: 所有的自然也成了「書」，將閱讀風景延伸至天至地
  - label: B
    content: 坐在矩形的木椅時，因木椅硬質關係，不自覺正襟危坐地看書
  - label: C
    content: 閒散坐在戶外棧道時，冥思著下雨時分，雨從屋頂落下之美，像支綠茶廣告
  - label: D
    content: 午後的陽光被裁切成幾何圖案，讀書人此時晒書也晒心。
  tags:
