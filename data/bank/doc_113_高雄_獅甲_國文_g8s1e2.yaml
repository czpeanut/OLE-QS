- id: doc_113_高雄_獅甲_國文_g8s1e2_s4_1
  section: 4
  number: 1
  type: single
  page: 1
  stem: 陶淵明詩風質樸，有田園詩人之祖的稱號，下列選項中的詩句，何者可能是他的田園詩作？
  options:
  - label: A
    content: 春風桃李花開日，秋雨梧桐葉落時。西宮南內多秋草，落葉滿階紅不掃
  - label: B
    content: 松風吹解帶，山月照彈琴。 君問窮通理，漁歌入浦深。
  - label: C
    content: 桑竹垂餘蔭，菽稷隨時藝；春蠶收長絲，秋熟靡王稅。
  - label: D
    content: 雲想衣裳花想容，春風拂檻露華濃。若非群玉山頭見，會向瑤台月下逢。
  tags:
