- id: doc_111_桃園_同德_自然_g8s1e1_s2_35
  section: 2
  number: 35
  type: single
  page: 5
  stem: 下列何者訂定的空氣汙染標準，最不嚴格？
  options:
  - label: A
    content: 世界衛生組織
  - label: B
    content: 美國
  - label: C
    content: 歐盟
  - label: D
    content: 臺灣
  group_stem: "臺灣的空氣汙染主要來源為工廠、發電廠及汽機車排放的廢氣等，這些汙染源所產生的細懸浮微粒又以PM$_{2.5}$最多，PM$_{2.5}$代表顆粒直徑在2.5\
    \ 微米之粒子，PM$_{10}$ 的直徑則大約為頭髮直徑的六分之一。世界衛生組織訂定若空氣PM$_{2.5}$ 濃度超過10微克／立方公尺，會危害民眾身體，美國、臺灣與歐盟則將標準分別訂為12、15\
    \ 與20 微克／立方公尺。\n   位於臺中的火力發電廠是中部空氣主要的汙染源，它的二氧化碳排放量亦為世界第一。臺灣的地形也是惡化臺灣空氣汙染的重要因素，高聳連綿的中央山脈，容易在冬天的時候阻擋東北季風吹散中南部空氣中的細懸浮微粒。據統計，南部地區冬天空氣品質達到不良以上的天數，80\
    \ 天中有76 天，另有4 天是普通，沒有任何一天是良好；中部地區有37 天、北部地區則有12 天為不良。\n為了讓民眾了解當前空氣汙染的狀況，行政院環保署會發布即時空氣品質指標AQI（Air\
    \ Quality Index）。AQI 為依據當日空氣中PM$_{2.5}$、PM$_{10}$、硫氧化物、氮氧化物等空氣汙染物濃度，計算後得到的數值來分級，共分為:\n\
    \n| AQI | 0~50 | 51~100 | 101~150 | 151~200 | 201~300 | 301~500 |\n| :--- | :---\
    \ | :--- | :--- | :--- | :--- | :--- |\n| 對人體的影響 | 良好，沒有影響 | 普通 | 對敏感族群不健康 | 對所有族群不健康\
    \ | 非常不健康 | 危害 |\n\n一般新聞上所說的紫爆，是指AQI 達201～300 的非常不健康的空氣汙染狀態，一般民眾應減少戶外活動，如果有心臟及呼吸道疾病的患者應該留在室內，若要外出，應配戴口罩。\
    \  根據文章，請回答問題 35~38 題"
