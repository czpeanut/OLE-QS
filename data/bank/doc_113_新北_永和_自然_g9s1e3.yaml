    content: 銀河在宇宙組織單位的層級是屬於恆星
  - label: D
    content: 「七七」成了「乞巧節」的習俗，到了唐代已極為盛行
  group_stem: "※永和國中在暑假時舉辦了「文學與科學交會的光芒」研習營。為了配合即將到來的農曆 7 月 7 日七夕佳節，李老師特地從古詩十九首中選出「迢迢牽牛星」詩選，來深度探討牛郎和織女星宿的相關議題，並實地帶領學生們一探星空的神祕與美好。首先，李老師請各小組上網搜尋與這首詩相關的資訊，並上臺報告。以下是各組所分享…(取材自翰林版八年級國文第二課)\n\
    \n| 迢迢牽牛星 佚名 | \n| :--- |\n| 迢迢牽牛星，皎皎河漢女。<br>纖纖擢素手，札札弄機杼。<br>終日不成章，泣涕零如雨。<br>河漢清且淺，相去復幾許？<br>盈盈一水間，脈脈不得語。\
    \ |\n\n| | |\n| :--- | :--- |\n| 可莉組 牽牛星和織女星是兩顆能自己發光發熱的恆星。牽牛星的直徑約為太陽的 1.6 倍，光度約為太陽的\
    \ 10 倍，是整個夜空中亮度排名第十二的恆星。它的表面溫度可達七千度，距離地球約 16 光年（一光年約等於十萬億公里）。織女星的直徑約為太陽的 3.2 倍，光度約為太陽的\
    \ 50 倍，是整個夜空中亮度排名第五的恆星，在北半球排名第二。它的表面溫度可達八千九百度，距離地球約 26 光年。 | 宵宮組 在銀河西北邊最亮的一顆星就是織女星，在織女星的南方偏東，即銀河的東南邊，就是牽牛星（又名河鼓二）。這兩顆恆星加上另一顆恆星天津四，組成了夏季夜空中最亮也最容易看到的「夏季大三角」。\
    \ |\n| 甘雨組 牽牛星屬於「天鷹星座」，織女星屬於「天琴星座」。兩顆星中間有一條從東北向西南方向劃開的光帶，就是所謂的「銀河」。在銀河裡有許多白色粉末般的小光點，一顆白色粉末就是一顆巨大的恆星，銀河是由無數恆星構成的，其中的牽牛星與織女星相距約\
    \ 16 光年。因此，據現代天文觀測及測算結果，他們每年的「七夕相會」，是絕不可能發生的。 | 鍾離組 七夕與乞巧節傳說古人認為「七」為吉數，有圓滿之意，且「七七」之夜是月亮較近銀河的時候，更便於觀星。又因牛郎織女的故事深植人心，織女就被當成天神中巧婦的代表。婦女們七夕祭拜織女星，期盼自己有一雙能穿針引線、織布縫衣的巧手，故「七七」就成了「乞巧節」。此習俗的文字記錄最早可追溯至漢代，到了唐代已極為盛行。\
    \ |"
