  - label: D
    content: 北升南落
  group_stem: '【在南半球看月亮會上下顛倒嗎？】

    確實會。在南半球看到的月亮和北半球上下相反，單純就是方向問題。假設月球環繞地球的軌道，和赤道位於同一平面上，在北半球看來，月亮永遠都會位於南方天空中，因為赤道就在那個方向。在南半球狀況則正好相反，月亮看起來永遠都位於北方天空。從右圖(十七)中，呈現出分別站在南、北半球的兩個觀察者，從相反方向觀看同一個月亮時，看向月亮的視線，以及所看到的月貌。

