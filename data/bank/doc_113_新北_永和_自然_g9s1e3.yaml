  group_stem: '溫度固定時，某材料的電阻可由以下公式計算：

    電阻 R＝物質的電阻率 $\rho$ $\times$ 長度 L /截面積 A

    依電阻率 $\rho$ 可將物質分為導體、半導體和絕緣體：一般將電阻率小於 $10^{-3}$ 歐姆-公分之間的物質，歸類為導體；電阻率大於 $10^{8}$
    歐姆-公分的物質為絕緣體；電阻率介於兩者之間的物質則屬於半導體；金屬導體的電阻率隨溫度升高而增加，半導體則隨溫度升高而減小。圖(十八)為某些物質的電阻率，而石墨的電阻率為
    $3.5\times 10^{-3}\ \Omega\text{-cm}$。（資料來源：高中物理教材）'
