- id: doc_113_新北_永和_自然_g9s1e3_s2_35
  section: 2
  number: 35
  type: single
  page: 4
  stem: 根據上文可知2024 PT5 是屬於？
  options:
  - label: A
    content: 類地行星
  - label: B
    content: 矮行星
  - label: C
    content: 衛星
  - label: D
    content: 太陽系小天體
  group_stem: '【11 月底前會有「兩個月亮」？】

    繼日食和超級月亮之後，9 月 29 日起，天空將出現「兩個月亮」的罕見天文景象。科學家發現，小行星 2024 PT5 將暫時被地球引力捕獲，進入環地球軌道約
    56 天，但不足以讓它完整繞地球一周。

    2024 PT5 來自小行星帶「地球少女」（Arjuna），這個小行星帶的運行軌道與地球類似，其中部份天體距離地球不遠，運行速度也不快，因此有機會成為地球的臨時衛星。這顆直徑約
    10 米的天體，將成為一個「小月亮」圍繞地球運行，並在軌道上停留至 11 月 25 日，然後返回繞太陽運行的軌道。但遺憾的是，人們無法肉眼觀測到這個小月亮。因為它太小且太暗，亮度星等估計是
    22 等，大大超出人眼六等的觀測極限，須借助專業設備才能觀測到。

    地球俘獲小天體的情況，並不是第一次出現。這些臨時衛星有的能完整繞地球一年或更久，有的僅停留幾天或幾個月，主要取決於太陽引力的影響。兩個月後，2024 PT5
    也將受到太陽引力的干擾，脫離環地球軌道，回到環太陽軌道，再次成為「地球少女」小行星帶的一員。

    迄今為止，科學家只發現過兩個存在時間較長的臨時月亮，分別是 2006 RH120 和 2020 CD3。存在時間較短的臨時月亮也不過三個，分別是 1991
    VG、2022 NX1，以及這次出現的 2024 PT5。這些天體名稱的前四碼，均為發現年份。

    https://www.hk01.com/article/1059951?utm_source=01articlecopy&utm_medium=referral'
