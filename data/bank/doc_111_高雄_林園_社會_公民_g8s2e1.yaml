  - label: A
    content: 憲法的修改程序較法律繁複，主要在說明憲法的原則性
  - label: B
    content: 憲法條文通常簡明扼要，這是因為憲法具有固定性
  - label: C
    content: 法律和命令如果牴觸憲法，則法律和命令無效，因為憲法具有最高性
  - label: D
    content: 憲法是國家及人民行為的最高準則，絕對不可以修改，所以憲法具有固定性
