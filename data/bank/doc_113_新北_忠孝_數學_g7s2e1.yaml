- id: doc_113_新北_忠孝_數學_g7s2e1_s2_5
  section: 2
  number: 5
  type: single
  page: 3
  stem: '為了降低中暑的機會，近年來部分國家會使用綜合溫度熱指數WBGT(℃)作為判斷熱傷害風險的指標，而WBGT 的計算方式如下：

    在戶外有日曬時，WBGT＝0.7TW＋0.2TG＋0.1Td

    在戶外無日曬或室內時，WBGT＝0.7TW＋0.3TG

    $T_W$：自然濕球溫度(℃)，用以反映水分揮發的難易度

    $T_G$：黑球溫度(℃)，用以反映太陽輻射的效應

    $T_d$：乾球溫度(℃)，用以反映單純空氣溫度

    依 WBGT 數值大小可將熱傷害風險區分為五個等級，如表(一)所示。

    表(二)為戶外有日曬的甲地與室內的乙地在中午時所測量到的各種溫度。

    根據上文，甲地、乙地在中午時的熱傷害風險等級分別為何？【111 會考】


    表(一)

    | WBGT 數值 | ＜21 | 21～25 | 25～28 | 28～31 | $\geq$ 31 |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 風險等級 | 安全 | 注意 | 警戒 | 高度警戒 | 危險 |

    ※ 21～25 代表21 以上(含)，未滿25，其他依此類推


    表(二)

    | | 甲地 | 乙地 |

    | :--- | :--- | :--- |

    | $T_W$ | 23℃ | 20℃ |

    | $T_G$ | 30℃ | 24℃ |

    | $T_d$ | 26℃ | 24℃ |'
  options:
  - label: A
    content: 注意、安全
  - label: B
    content: 注意、注意
  - label: C
    content: 警戒、安全
  - label: D
    content: 警戒、注意
