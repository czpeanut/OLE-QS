  stem: '為了降低中暑的機會,近年來部分國家會使用綜合溫度熱指數WBGT(°C)作為判斷熱傷害風險的指標,而WBGT的計算方式如 下: 在戶外有日曬時,WBGT=0.7TW+0.2TG+0.1Td在戶外無日曬或室內時,WBGT=0.7TW+0.3TG
