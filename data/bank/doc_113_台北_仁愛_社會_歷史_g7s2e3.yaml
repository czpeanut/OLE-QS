  group_stem: '【題組四】1971 年（民60），中華民國退出某個重要國際組織之後，時任總統蔣中正曾發表聲明，向海內外國人表達國家失去此組織會籍（會員資格）的遺憾與對時局的看法。修改後節錄如下：

    段落一：「大會違反憲章規定，通過阿爾巴尼亞等附匪國家之提案，支持毛澤東『共匪幫』排除、竊取我國（中華民國）在組織中的席位；我們以漢賊不兩立之立場及維護憲章之尊嚴，在該案表決之前宣佈退出，並聲明不承認其有任何效力。」

    段落二：「當前的國際形勢雖然很險惡，但只要我們自己自強不息，反共鬥爭的行程，如在海洋中操舟前進，只要大家擁有反共的基本形勢，緊緊把握正確的方向，協力同心，必可很快到達彼岸，拯救同胞，光復大陸。」'
