  stem: 根據上文，「新電影」出現之前的戰後臺灣電影，可能會限制播映下列何種劇情？
  options:
  - label: A
    content: 中日戰爭期間，國軍堅毅的抵抗日本侵略
  - label: B
    content: 國軍將領對抗共軍時英勇犧牲陣亡
