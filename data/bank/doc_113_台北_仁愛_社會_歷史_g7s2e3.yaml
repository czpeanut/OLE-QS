  group_stem: "【題組一】下文是某人自述其生平的摘要：\n  公學校畢業後，我在家鄉苗栗做雜工，後來由於當時的統治者實施徵兵，我被徵召成為皇軍，為躲避美軍的轟炸，每天挖防空洞。\n\
    \  光復後，國軍接收臺灣，並以高薪吸引青年從軍，我馬上報名參加，之後政府派遣我們到中國大陸參與內戰。在我們部隊轉移陣地的過程中，遭到敵軍的埋伏，我被俘虜並編入敵軍，轉而對國軍作戰。\n\
    \  1949 年後，我在中國大陸落地生根，因兩岸對立，長期無法和臺灣家中聯絡，直到臺灣的政策改變，開放兩岸探親，才得以和家人重逢。"
