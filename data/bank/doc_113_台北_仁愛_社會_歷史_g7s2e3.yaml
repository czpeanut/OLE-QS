  stem: '以下為一段對於《兒子的大玩偶》的介紹：

    坤樹為求得一家生活溫飽，從事為劇院做活動廣告的工作，經常在身體前後各掛一張電影海報，打扮成小丑遊走在大街小巷，返家後，坤樹立刻卸下工作時的小丑裝扮；但年幼的兒子竟然認不出他，放聲大哭起來……

    《兒子的大玩偶》為臺灣作家黃春明第一本出版的短篇小說作品集，內容主要描寫臺灣社會中，小人物的無奈和困境，為黃春明寫實主義代表作品之一。請問上述作品的風格，被稱爲何種文學？'
