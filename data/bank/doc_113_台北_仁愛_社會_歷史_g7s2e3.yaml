  stem: 2002年，我國加入成為某組織的正式會員國，使得我國無法再對國內採取關稅保護策略，接連發生曾經轟動一時的“白米炸彈客”楊儒門事件，他認為臺灣加入此組織，實施進口稻米配額制度，每年以零關稅進口144720噸稻米，致使海外稻米傾銷臺灣，造成稻米價格下跌，農民面臨此衝擊叫苦連天，而以激進方式為臺灣農民發聲。關於題幹敘述，下列哪一選項說明正確？
