    content: 男主角與女主角談一場轟轟烈烈的戀愛
  - label: D
    content: 主角因二二八事件，最後遭到軍警處決。
  group_stem: "【題組二】民國 40 年代，臺灣電影為配合政府「反共抗俄」政策，政府所屬片廠拍攝的電影，幾乎都是配合官方意識形態的政治宣傳工具，而民間則出現以歌仔戲劇本與民俗故事為素材，並用閩南語發音的「臺語電影」。民國\
    \ 50 年代，因政府強調社會安定，臺灣電影開啟「健康寫實」風格，主張電影劇情應避免暴露社會的黑暗面，呈現人性的光輝，受到當時海內外華人市場的歡迎。在民國\
    \ 60 年代經濟成長之下，愛情、武俠、功夫、喜劇等電影類型，也進一步走入民眾的休閒娛樂之中。\n  民國 70 年代初期，臺灣電影受到香港電影新浪潮的影響，進入「臺灣新電影」時期。「新電影」發展初期的導演與編劇，在劇本創作上融入鄉土文學的題材，拍攝風格以強調自然、寫實為主，在題材的選用上，開始有意識的挑戰官方政治禁忌，而受到相關單位的關切。例如「新電影」初期代表作《兒子的大玩偶》，在正式上映前，因電影片段中呈現臺北違建林立等有礙政府形象的畫面，遭官方施壓要求刪減，此事件後來被稱為「削蘋果事件」。最後借助影視記者楊士琪等人的聲援，才使得電影逃過被刪剪的命運。"
