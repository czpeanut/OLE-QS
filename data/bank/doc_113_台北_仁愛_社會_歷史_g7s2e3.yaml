  section: 2
  number: 36
  type: single
  page: 4
  stem: 好男好女反水庫這首歌反映出臺灣面臨的哪項選擇？
  options:
  - label: A
    content: 經濟發展與環境保護
  - label: B
    content: 資方利益與勞工福利
  - label: C
    content: 再生能源與核能發電
  - label: D
    content: 都市更新與舊社區保存
  group_stem: 【題組三】山河之間的高雄美濃，有一位客家青年，他用音樂打動了全世界。在台灣經濟快速發展下，科技產業掛帥的思維裡，貿易自由化與國際化的呼聲中，他用音樂訴說臺灣農民與勞工的故事。以月琴、嗩吶等客家傳統八音，在一首《好男好女反水庫歌》裡，嘗試將美濃的拓墾過往歷史及反水庫運動的過程填入歌詞，再輔以親切的客家山歌曲調，唱出人對土地的情感，傳達保護家鄉土地的決心。《菊花夜行軍》唱出花農想藉著各式各樣的菊花，希望能在市場上殺出重圍，日以繼夜戰戰兢兢地點兵著。為什麼花農如此的擔憂呢？當時臺灣在政策的推動下，必須仰賴電子業維持外銷導向的貿易經濟，開始加速貿易自由化，所以開放市場成為政府關切的重要議題，民國91
    年，臺灣加入第一個全球性的經濟組織，對原本逐漸走向下坡的農村經濟，更是一大打擊。他是何人？他就是對自己很誠實，對生活也很真實的林生祥，用音樂唱出對家鄉的愛意，用音樂表達對鄉土的關懷，用音樂傾訴生態的危機，一個用生命在對待臺灣的音樂人。
