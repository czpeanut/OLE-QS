    段落二：「當前的國際形勢雖然很險惡，但只要我們自己自強不息，反共鬥爭的行程，如在海洋中操舟前進，只要大家擁有反共的基本形勢，緊緊把握正確的方向，協力同心，必可很快到達彼岸，拯救同胞，光復大陸。」'
