  group_stem: "潘敦仔出身臺灣中部岸裡社，為家族第三代土官。土官是清廷為治理臺灣原住民所設立的官職，由原住民社內耆老推舉，職責是約束社番、處理社務。岸裡社在清帝國時期屢次協助清軍平亂，成為中部勢力最強盛的原住民部落，尤其是他在1731\
    \ 年協助平定規模最大的原住民抗官事件後，受皇帝召見，獲賜御衣。後來還透過「割地換水」與漢人通事張達京合作，將水源引進岸裡社。\n    西元1758 年(乾隆23\
    \ 年)，清廷改變通事任用辦法，以通曉漢語的原住民取代漢人，任命潘敦仔為岸裡社總通事，為臺灣第一位非漢人通事，集土官、社主、通事等職於一身，造就他與其家族在岸裡社的權威地位，更獲賜「潘」姓。"
