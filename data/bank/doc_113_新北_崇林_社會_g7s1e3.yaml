  stem: '「陳賴章墾號」是指五位泉州人陳逢春、賴永和、陳天章、陳憲伯、戴天樞於1709 年（清康熙48 年）共同合資成立的開墾團體。他們申請開墾大佳臘（今大台北地區），在取得墾照後，隨即展開大規模的開墾行動。「陳賴章墾號」不但是18
    世紀初臺灣最大規模的漢人墾號，也造成了日後的臺北北部地區的平埔族遷移、同化與滅絕。

    根據上文選出敘述正確的選項：(甲)「陳賴章墾號」的取得應該是由淡水廳長官核發的 (乙)土地開墾後所需灌溉的水源應來自瑠公圳 (丙)造成臺北地區平埔族的遷徙與同化極有可能是指凱達格蘭族
    (丁)陳賴張墾號對於當時稻米的種植有很大的貢獻。'
