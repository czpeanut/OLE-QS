- id: doc_113_新北_崇林_社會_g7s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 阿美族須經中央原住民族主管機關核定後，才是我國所認定的原住民族。請問：何者為處理我國原住民族事務的中央主管機關？
  options:
  - label: A
    content: 內政部
  - label: B
    content: 文化部
  - label: C
    content: 原住民族委員會
  - label: D
    content: 部落管理委員會
  group_stem: '◎題組二：回答以下第08~15 題

    位在花蓮縣玉里鎮春日里的阿美族馬太林部落，其範圍內的春日寶石礦場，近期礦權即將期限屆滿，廠商有意續租礦業用地。因此11 月13 日晚間族人召開【甲】，有高達九成部落居民反對礦石業者續租，同時進行連署反對。相關決議也將送往玉里鎮公所備查。

    馬太林部落耆老Kisak Foday：「你不要小看礦場開發，現在為了眼前利益被廠商牽著鼻子，是最蠢的一件事情！所以在這方面我絕對嚴正抗議，不能開採！這是我最簡單的訴求。」高齡79
    歲的耆老激動地回憶過去緊鄰部落的呂範溪因潰堤淹沒部落的歷史，就是要大家反對礦場開發。

    【甲】主席 Kamid Lao’（陳昌生）：「收集到反對開採的意見達到99%，所以我們不允許開採！開發行為對於我們的水資源有很大的破壞，對部落族人沒有幫助，所以族人齊聚在這邊討論，大家都不希望廠商再度開採礦石，以上是我們的決議。」

    鎮公所則強調，無論同意與否，都尊重族人的決議。倘若同意的話，會要求廠商做好水土保持工作，避免土石鬆動衝擊下游地區的居住安全。【2024.11.14 原視新聞網】'
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 公民
      code: 6-2
      title: 部落的挑戰與公民參與
      chapter: 第6章 部落與公民參與
    textbook: 七上公民 6-2 部落的挑戰與公民參與
    labeled_by: ai
