questions:
- id: doc_113_台中_居仁_社會_公民_g7s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 在臺灣，隨著社會的多元化發展，家庭型態已不再僅限於傳統的一夫一妻核心家庭。根據近年來的統計數據，單親家庭、隔代家庭，以及同居家戶等非傳統家庭組成的比例呈現明顯增長。對於臺灣面臨上述的家庭型態轉變，下列敘述何者正確？
  options:
  - label: A
    content: 隔代家庭數量的成長，反映了臺灣目前的生育率正處於下降的狀態
  - label: B
    content: 家庭如果不健全，容易導致子女的偏差行為，政府應積極介入輔導
  - label: C
    content: 由家庭型態的轉變可以看出，血緣關係並不是家庭唯一的構成要件
  - label: D
    content: 為了避免單親家庭增加，政府應修法讓離婚與未婚生子變得更困難。
- id: doc_113_台中_居仁_社會_公民_g7s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下圖為阿正收到一張建商發送的房屋廣告單。內容中提及的家庭型態，下列何項說明錯誤？
  options:
  - label: A
    content: 由小家庭成員與直系血親尊親屬組成
  - label: B
    content: 家庭成員數較多，故又稱擴展家庭
  - label: C
    content: 家庭成員組成能解決孩子乏人照顧及老人安養問題
  - label: D
    content: 此種家庭型態又稱主幹家庭。
  assets:
  - key: s1_2_f1
    kind: figure
    file: doc_113_台中_居仁_社會_公民_g7s1e2/s1_2_f1.png
- id: doc_113_台中_居仁_社會_公民_g7s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 一名女網友日前在網路上發文求助，她表示自己剛年滿 18 歲。在未滿 18 歲前，父親就常用各種理由要求她幫忙在法律文件上簽名，包含車子過戶、租房簽名等。之後從媽媽那裡得知，父親已經不是第一次對家人做出這些要求，女網友便拒絕父親的要求。沒想到之後她不停接到騷擾電話，父親甚至在訊息恐嚇她，說要傷害媽媽，讓她相當害怕自己與媽媽的人身安全。請問：你會建議女網友如何保護自己？
  options:
  - label: A
    content: 依據《性別平等工作法》申請家庭看護假
  - label: B
    content: 依據《民法》請求法院限制親權
  - label: C
    content: 依據《家庭暴力防治法》向法院聲請保護令
  - label: D
    content: 依據《性別平等教育法》向學校申請性平調查。
- id: doc_113_台中_居仁_社會_公民_g7s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '子軒在政府官網上讀到一則新法修訂的消息，為了確認內容的正確性，他在網路上發文尋求解答。請問：以下哪項對該修訂內容的描述最為正確？

    親子

    法務部公告《民法》1085 條修正草案，將修改原條文中父母對子女的懲戒權部分，防止父母管教子女時施以身心暴力行為，應改為採取正面的保護教養方式。衛福部也製作親職教育方面的教材，提供正向教養的技巧。但還是有很多父母覺得疑惑，《民法》對親權行使的內容到底包含哪些？'
  options:
  - label: A
    content: 父母離婚後，子女的監護權自動歸屬於有經濟能力的一方
  - label: B
    content: 父母在合理範圍內行使親權，提供子女適當管教
  - label: C
    content: 為子女的發展，法律容許父母的家暴行為
  - label: D
    content: 未成年子女的監護權由母親單獨行使。
- id: doc_113_台中_居仁_社會_公民_g7s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 小華的父母因離婚協商撫養權問題。父親認為依傳統應由自己監護，母親不以為然，認為法律修正後是強調尊重子女的意願及最佳利益，畫底線部份這代表著我們已經開始重視何種觀念？
  options:
  - label: A
    content: 保障子女的權益
  - label: B
    content: 夫妻平權的觀念
  - label: C
    content: 傳統文化的傳承
  - label: D
    content: 天下無不是的父母的觀念。
- id: doc_113_台中_居仁_社會_公民_g7s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 我國針對離婚後子女權利義務行使有重大改革，強調性別平等。請問：下列關於父母離婚後子女權利義務行使的描述，何者錯誤？
  options:
  - label: A
    content: 相關規定制定在《民法》中
  - label: B
    content: 做親權行使判決時，也可以將子女的意願列入參考
  - label: C
    content: 對於未成年子女權利義務的行使或負擔，依協議由一方或雙方共同負責
  - label: D
    content: 如果雙方對於子女的親權行使無法達成協議時，可訴請社會局做出判決。
- id: doc_113_台中_居仁_社會_公民_g7s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 小明週末時與家人到桃園大溪出遊，回來後寫下生活札記，如下圖。根據內容判斷，札記中提到的(甲)、(乙)、(丙)、(丁)應該分別為下列何者？
  options:
  - label: A
    content: 爺爺、哥哥、奶奶、姑媽
  - label: B
    content: 爸爸、舅舅、弟弟、舅媽
  - label: C
    content: 媽媽、堂哥、奶奶、舅媽
  - label: D
    content: 女兒、姑姑、舅舅，表弟。
  assets:
  - key: s1_7_f1
    kind: figure
    file: doc_113_台中_居仁_社會_公民_g7s1e2/s1_7_f1.png
- id: doc_113_台中_居仁_社會_公民_g7s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: '社會局承辦員以摺頁說明「政府協助家庭發揮功能的措施」，並與民眾互動請民眾上臺填寫【 】處的內容，結果這位民眾寫出來的答案只有一個地方正確。你能指出那個正確的選項應是下列何者？

    | 選項 | 政府的措施 | 協助發揮哪項家庭功能 |

    | :--- | :--- | :--- |

    | (甲) | 提供失業家庭的職業訓練 | 【教育】 |

    | (乙) | 推動老人喘息服務 | 【經濟】 |

    | (丙) | 提供褓姆資源支持系統 | 【生育】 |

    | (丁) | 開設新住民「親子共讀課程」 | 【保護與照顧】 |'
  options:
  - label: A
    content: (甲)
  - label: B
    content: (乙)
  - label: C
    content: (丙)
  - label: D
    content: (丁)。
- id: doc_113_台中_居仁_社會_公民_g7s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 明慧在調查資料中，發現家庭照顧分擔的比例，影響個人職業發展的程度。她以此為主題撰寫報告，獲得好評，被認為「真實呈現家庭照顧的分擔，如何影響分擔者職業發展的情況」。以此來看，下列何者是明慧報告的內容？
  options:
  - label: A
    content: 現代社會中的雙薪家庭，女性仍被賦予負擔家務的期望，壓縮其參與社會的空間
  - label: B
    content: 現代社會中的家庭照顧由政府強制規範，限制了職場上對照顧者的支持
  - label: C
    content: 現代社會中的男性仍是主要勞動力，女性全權負責家務後，影響其參與社會的意願
  - label: D
    content: 現代社會中的男性多負責家庭照顧，限制其在職場的表現。
- id: doc_113_台中_居仁_社會_公民_g7s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 小杰在日記紀錄一天的行程：「早上和哥哥一起騎車上學，放學後到祖父、祖母家吃晚餐，飯後再去補習班上課、寫作業，上完課後，下班的爸爸媽媽開車來接我們。在車上時，小杰忍不住向媽媽抱怨一整天上課的行程很累，媽媽安慰我們，並說假日再帶我們去海邊玩。」請問：根據小杰的日記，顯示出家庭的哪一項功能式微，並由其他機構補充？
  options:
  - label: A
    content: 生育
  - label: B
    content: 教育
  - label: C
    content: 經濟
  - label: D
    content: 保護與照顧。
- id: doc_113_台中_居仁_社會_公民_g7s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 2022 年，台中市衛生局推出「居家健康照護服務」，以病患的需求為出發點，強調「自主生活能力」為核心，透過專業照護團隊設計個別化照護計畫，幫助高齡者提升生活品質，並降低家庭照顧負擔。試問：下列何者與上述政策推出動機無關？
  options:
  - label: A
    content: 家庭結構的改變，高齡者無法依賴家庭成員的照顧
  - label: B
    content: 政府正視老人照護制度建立的重要性
  - label: C
    content: 政府以公權力協助發揮家庭功能
  - label: D
    content: 免除子女的扶養責任。
- id: doc_113_台中_居仁_社會_公民_g7s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 小美是家中的長女，父母在她 5 歲時離婚，母親再婚後，帶著小美與繼父一起搬到加拿大生活。母親與繼父後來生了一個兒子小傑。當小美 11 歲時，母親將她送回台灣，由外祖父母負責照顧。根據上述情境，下列何者正確？(甲)小美和小傑是旁系血親
    (乙)小美和繼父是法定血親 (丙)小美和母親、繼父組成的家庭是大家庭 (丁)小美 11 歲時，生活在隔代教養家庭中
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 丙丁
  - label: D
    content: 甲丁。
- id: doc_113_台中_居仁_社會_公民_g7s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 合鑫電信推出「雙人 199 方案」，凡符合直系血親或配偶關係的兩人，同行新辦手機門號，可享手機月租費 199 元的優惠。若依我國《民法》有關親屬的規定，下列哪一組合符合上述優惠方案的條件？
  options:
  - label: A
    content: 志明和他的堂弟
  - label: B
    content: 小愛與他的繼父
  - label: C
    content: 王小姐與她的伯父
  - label: D
    content: 李媽媽和她的丈夫。
- id: doc_113_台中_居仁_社會_公民_g7s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: '曉華注意到某項法規的修訂訊息，如以下所示，他回想該項法規的規範內容，應為下列何者？

    政府修訂法律給予家暴受害者更完善的保護，如果在未成年時遭受家庭成員實施家庭暴力行為，可以申請註記施暴者不得調閱被害人的戶籍資料。'
  options:
  - label: A
    content: 被害人範圍包含非同居的親密伴侶
  - label: B
    content: 法院可以限制子女對父母行使親權
  - label: C
    content: 精神傷害不在該法的保護範圍之內
  - label: D
    content: 可透過法院請警察單位核發保護令。
- id: doc_113_台中_居仁_社會_公民_g7s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: '在選舉競爭激烈時，檢視候選人推出的各種政見與願景，無非力拼吸引選民支持讓自己順利當選，以下四位候選人所提出的政見都與「家庭的功能」有關。請問何者的政見核心與其他三者不一樣？

    1 號候選人：艾崔牛

    我如果當選的話，我一定會建構貼近老人需求的安養中心。請大家支持我，謝謝。

    2 號候選人：曾璦編

    我當選後會增加生育津貼，讓年輕夫妻生小孩無負擔，請投我一票。

    3 號候選人：郝慧友

    我會加強保母的訓練制度。建立保母資源系統，讓家長安心上班。

    4 號候選人：林信藕

    我會落實「長期照顧十年計劃 2.0」，使銀髮族能安心過生活。'
  options:
  - label: A
    content: 艾崔牛
  - label: B
    content: 曾璦編
  - label: C
    content: 郝慧友
  - label: D
    content: 林信藕。
- id: doc_113_台中_居仁_社會_公民_g7s1e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 衛生福利部統計顯示，截至2020 年臺灣65 歲以上人口已超過總人口的15%，進一步邁入「高齡社會」階段。由於老年人口比例增加，長期照顧成為重要議題。針對我國老人照顧及扶養義務的法律規定，下列敘述何者正確？
  options:
  - label: A
    content: 我國《民法》規定子女有扶養父母的義務，如未履行該義務，會受到處罰
  - label: B
    content: 子女對父母的照顧及扶養即為法律上的「親權」
  - label: C
    content: 我國傳統重男，因此扶養父母僅是兒子的義務
  - label: D
    content: 法律僅規定父母有照顧子女的義務，對於子女則無撫養父母的相關規定。
- id: doc_113_台中_居仁_社會_公民_g7s1e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 瑪莉亞是西班牙人，今年和她交往多年的台灣籍男友阿明登記結婚，並定居在高雄市。瑪莉亞在家庭聚會中提到：「我是在旅遊時認識阿明，當時他是導遊，我們因彼此的興趣相近，逐漸發展為穩定交往。之後我決定搬來台灣生活，也在台灣找到工作，阿明則在家族企業工作，我們一起組成了幸福的家庭。」阿明的家人熱切地問兩人是否有生小孩的打算，讓瑪莉亞感到壓力。請問：瑪莉亞現在屬於哪些家庭型態？
    (甲)單親家庭(乙)兩地家庭(丙)頂客家庭(丁)新住民家庭(戊)隔代教養家庭
  options:
  - label: A
    content: 甲戊
  - label: B
    content: 丙丁
  - label: C
    content: 甲乙
  - label: D
    content: 丙戊。
- id: doc_113_台中_居仁_社會_公民_g7s1e2_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: "美美寫下了一段札記，內容描述她和爸爸、媽媽之間的關係與家庭中的困擾。老師看到這段札記後，針對現代法律和觀念的改變，分成四部分進行澄清並鼓勵美美不要太沮喪。然而老師在澄清過程中不小心出現了口誤，請問：下列哪一句話應該要再修正呢？\n\
    113／10／13（日）心情：很糟\n  爸爸今天對我說，(甲)我們就是他的財產，他想怎麼管教就怎麼管教，(乙)就算他對我們動粗，我們以後還是得扶養他。(丙)反正法律只保障父母，不保障子女。(丁)但媽媽說她可以請法院決定怎樣做對我們最好。"
  options:
  - label: A
    content: 甲：現代社會強調子女是獨立的個體，應該重視子女權利，並尊重其意願
  - label: B
    content: 乙：根據《家庭暴力防治法》，如子女被家暴可向法院請求減輕扶養義務
  - label: C
    content: 丙：為了建立親子間的平權，法律對父母和子女皆有規定義務和保障權利
  - label: D
    content: 丁：當父母雙方對子女的意見不一致時，法院會依子女的最佳利益做決定。
- id: doc_113_台中_居仁_社會_公民_g7s1e2_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 下列對於家庭暴力的認識，何者正確？
  options:
