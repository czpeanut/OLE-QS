- id: doc_113_新北_五峰_自然_g9s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 1,野柳地質公園一直以獨特的地質景觀揚名國際，是北海岸第一座依法正名的地質公園，該地區為大屯山山脈延伸至東海之岬角，地景受造山運動、風化及海蝕等作用而呈現豐富多元的奇特形態，其中尤以「女王頭」、「燭台石」等最為著名。請問有關其地貌變化的敘述，下列敘述何者正確?
  options:
  - label: A
    content: 風化作用的主因是因為東北季風造成的。
  - label: B
    content: 燭台石的形成是因為造山運動形成岩石隆起。
  - label: C
    content: 女王頭因其頭部及頸部的岩石組成硬度有別，因此造成差異侵蝕現象。
  - label: D
    content: 野柳位於海岸邊，其岩類必為沉積岩的構造，才會造成如此豐富的地貌變化。
  tags:
