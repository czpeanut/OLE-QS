  page: 4
  stem: 31. 家電用的電磁爐，通常是根據法拉第的電磁感應原理，利用磁場使置於爐面上的鍋子出現感應電流（稱為「渦電流」），再透過電流的熱效應，使鍋子產生高溫以烹煮食物。下列有關此種電磁爐與所用鍋子的敘述，何者正確？
  options:
  - label: A
    content: 電磁爐所用的鍋子必須是電的絕緣體
  - label: B
    content: 鍋子中出現的感應電流必為直流電
  - label: C
    content: 電磁爐所用的鍋子必須是熱的絕緣體
  - label: D
    content: 電磁爐內的磁場需是隨時變化的磁場。
