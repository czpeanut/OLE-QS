  stem: 32. 噹噹在水平光滑的固定鐵軌 A、B 上方，放置甲、乙兩條可以自由滑動的輕質金屬導線，恰構成一個矩形迴路，如下圖所示。若在此迴路的正上方有一強力磁鐵，以
    N 極朝下的方式自由落下，則有關於甲、乙兩條導線在磁鐵通過矩形迴路前與通過後瞬間的受力情形，下列敘述何者正確？
  options:
  - label: A
    content: 甲、乙兩導線受力方向：皆排斥遠離；甲、乙導線移動所受作用力的主要來源：電與磁的交互作用
  - label: B
    content: 甲、乙兩導線受力方向：皆吸引靠近；甲、乙導線移動所受作用力的主要來源：只有靜電力
  - label: C
    content: 甲、乙兩導線受力方向：先吸引後排斥；甲、乙導線移動所受作用力的主要來源：只有磁力
  - label: D
    content: 甲、乙兩導線受力方向：先排斥後吸引；甲、乙導線移動所受作用力的主要來源：電與磁的交互作用
