  stem: 羅蘭夫人在 1793 年 11 月 8 日被送上斷頭台。臨刑前,她在斷頭台上向著革命廣場(la Place de la Revolution)上的自由雕像鞠躬並留下了一句為後人所廣為傳誦的名言:「自由自由,天下古今幾多之罪惡,假汝之名以行!」。請問羅蘭夫人的事蹟見證了法國大革命的哪一段發展?
