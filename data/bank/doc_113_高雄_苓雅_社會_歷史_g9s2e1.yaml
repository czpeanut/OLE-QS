- id: doc_113_高雄_苓雅_社會_歷史_g9s2e1_s1_25
  section: 1
  number: 25
  type: single
  page: 1
  stem: 節錄-雷馬克《西線無戰事》:「19 歲的保羅和同學在十星期的新兵訓練後,就被派往前線與法軍作戰,戰爭的無情讓他有如活在地獄之中,尤其是戰壕裡的惡劣環境與傳染病隨時威脅每位士兵的生命...
    他眼見戰區醫院的簡陋、藥品缺乏,厭戰的他覺得自己人生怎麼會如此?在如此殘酷的戰壕裡,恐懼、了無希望, 即使將來可以平安回家,那還會是戰前正常的自己嗎?」上述關於這本小說描繪的戰役,下列哪一項正確?
  options:
  - label: A
    content: 此戰爭最後是由協約國獲得最後勝利
  - label: B
    content: 此戰爭導火線是因為史達林進攻波蘭
  - label: C
    content: 為了突破戰壕戰的膠著局面,德國積極發展潛水艇
  - label: D
    content: 為了盡快結束戰爭美國對德國丟下原子彈。
