    小雅：「我要喚醒義大利的靈魂，大家為恢復古羅馬的光榮而努力吧!」

    小國：「我真正的光榮，並不是打了四十多次勝仗，滑鐵盧一戰就讓所有戰績一筆勾銷。但有一樣東西是不會被人忘記的，它將永垂不朽，那就是我的《法典》。」

