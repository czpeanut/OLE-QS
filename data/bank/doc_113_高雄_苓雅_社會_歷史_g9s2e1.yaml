  stem: 「當調查團到達滿洲奉天時,當地中國人都表示日軍非法佔領滿洲...即使大會否認滿洲國的合法地位,並要求日本將滿洲交還給中國,日本卻宣布退出此國際組織,中國無法收復滿洲。根據條約,此國際組織應對日本實施經濟制裁,但實際上郤無法推行。」根據上文,請問下列敘述何者錯誤?
