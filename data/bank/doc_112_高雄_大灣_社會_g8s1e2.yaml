- id: doc_112_高雄_大灣_社會_g8s1e2_s1_24
  section: 1
  number: 24
  type: single
  page: 3
  stem: '資料一：

    17世紀，英國學者培根(Francis Bacon)指出，有三種發明改變全世界的面貌：第一種是在學術方面，第二種是在戰爭方面，第三種是在航行方面，由此引起的變化不計其數。

    （資料來源:阿波羅新聞網，2011/11/14）

    資料二：

    19世紀，英國漢學家麥都思(Walter Henry Medhurst)指出：「中國人的發明天賦，很早就在許多方面展現。中國人的三大發明確實對歐洲文明的發展，提供異乎尋常的推動力。」

    （資料來源:典華網，麥都思）

    根據以上所附資料，關於宋元時期的科技發展，下列敘述何者錯誤？'
  options:
  - label: A
    content: 在學術方面的發明，是北宋畢昇所發展，為近代活字印刷術的先驅
  - label: B
    content: 在戰爭方面的發明，經由宋人、金人、蒙古人不斷交戰，後輾轉西傳
  - label: C
    content: 在航行方面的發明，經由西班牙人傳往歐洲
  - label: D
    content: 在航行方面的發明，有助於歐洲日後發現新航路。
