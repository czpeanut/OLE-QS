- id: doc_112_高雄_大灣_社會_g8s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 「首店」是指有代表性的品牌或新興潮流品牌，在某區域開設的第一家店。首店經濟，就是透過首店吸引顧客，帶動人氣，為周邊商圈以至整個區域拉動消費，增添經濟活力。近年來，中國各大城市紛紛推行「首店經濟」，也就是透過吸引品牌在當地開設第一間店，帶動和刺激消費和發展。2022
    年中國共開設了361 間「中國首店」，當中落戶上海、杭州的首店數量領跑全國。耐克全球「數碼化潮店」 Nike Style 2022 年落地上海，在這裏顧客可以自己手繪圖案並利用熱印或刺繡技術將其呈現在心儀單品上；不少首店選擇杭州湖濱銀泰in77
    落戶，這裡是年輕人時尚小眾文化聚集地。上述現象說明中國經濟發展過程的哪種現象？
  options:
  - label: A
    content: 世界物流中心
  - label: B
    content: 製造強國
  - label: C
    content: 世界工廠
  - label: D
    content: 世界市場。
