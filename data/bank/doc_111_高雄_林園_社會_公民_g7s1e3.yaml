  number: 36
  type: single
  page: 1
  stem: 近來社區治安問題頻傳，居民著手繪製社區安全檢測地圖，積極與學校單位及附近店家共同合作，標示並記錄社區內的治安死角，向相關單位申請加裝路燈與監視器，並組織守望相助巡守隊，以尋求社區治安的改善。從上述內容判斷，下列何者是解決社區問題的關鍵因素？【習作】
  options:
  - label: A
    content: 政府補助措施
  - label: B
    content: 店家積極協助
  - label: C
    content: 居民主動參與
  - label: D
    content: 警察加強巡邏。
  answer:
  - C
  answer_source: answer_key_vlm
- id: doc_111_高雄_林園_社會_公民_g7s1e3_s1_37
  section: 1
  number: 37
  type: single
  page: 1
  stem: 政府為保障學生的學習權益，明確規範校園中的學生權利，下列相關之說明何者最正確？【習作】
  options:
  - label: A
    content: 校園霸凌行為屬於偶發事件並不會觸犯法律
  - label: B
    content: 落實學生校園權利的保障只跟師生之間有關
  - label: C
    content: 老師可因干擾學習的情形暫時保管學生物品
  - label: D
    content: 任意翻動他人書包侵害到其學習方面的權利。
  answer:
  - C
  answer_source: answer_key_vlm
- id: doc_111_高雄_林園_社會_公民_g7s1e3_s1_38
  section: 1
  number: 38
  type: single
  page: 1
  stem: 從布農族人Talum Suqluman(漢人姓名為王光祿)曾持有槍械並狩獵保育類動物，違反相關法律而被判刑，許多原住民族團體憤而示威抗議，認為此判決結果即導因於未了解原住民族在傳統領域的狩獵文化與習俗，引發社會大眾爭論。根據上文判斷，原住民族面臨部落危機時採取了下列何種因應策略？【習作】
  options:
  - label: A
    content: 要求政府正名來保障原住民族的權益
  - label: B
    content: 要求政府設置專責機構處理相關事務
  - label: C
    content: 發動部落抗爭爭取原住民族群的權益
  - label: D
    content: 積極推動部落永續發展創造就業生機。
  answer:
  - C
  answer_source: answer_key_vlm
