  section: 1
  number: 45
  type: single
  page: 1
  stem: 不論是原住民的「部落」或是非原住民的「社區」，都是一群人共同生活的空間，兩者的性質雖不同，但維護眾人美好的生活環境是兩者都期望達成的目標。對此，以下何者是最關鍵的要素？
  options:
  - label: A
    content: 政府部門的經費補助
  - label: B
    content: 豐富而悠久的歷史文化背景
  - label: C
    content: 條件優異的位置區域
  - label: D
    content: 居民間共存共榮的集體意識。
  answer:
  - D
  answer_source: answer_key_vlm
- id: doc_111_高雄_林園_社會_公民_g7s1e3_s1_46
