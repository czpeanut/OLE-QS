  stem: 臺灣原住民族共有泰雅族、賽夏族、布農族、鄒族、邵族、排灣族、魯凱族、卑南族、阿美族、雅美族、噶瑪蘭族、太魯閣族、撒奇萊雅族、賽德克族、拉阿魯哇族及卡那卡那富族等16
    族。人口數大約為57 萬1,427 人，其中又以阿美族人數最多，排灣族次之，泰雅族第三，16 族中又有七百多個部落。上述原住民部落主要由下列哪一個政府機構核定？
  options:
  - label: A
    content: 文化部
  - label: B
    content: 內政部
  - label: C
    content: 原住民族委員會
  - label: D
    content: 部落會議。
  answer:
  - C
  answer_source: answer_key_vlm
