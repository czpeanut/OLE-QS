  number: 10
  type: single
  page: 1
  stem: 使用電風扇一段時間後，觸摸馬達的外殼會有溫熱的感覺，想一想，電風扇在運轉過程中，電能轉換成哪些形式的能量？電風扇是應用電流熱效應原理的家電用品嗎？
