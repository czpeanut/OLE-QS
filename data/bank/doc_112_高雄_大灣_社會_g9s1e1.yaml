- id: doc_112_高雄_大灣_社會_g9s1e1_s1_24
  section: 1
  number: 24
  type: single
  page: 3
  stem: '以下為古羅馬不同時期的政治特色，請閲讀資料，根據內容判斷，四則資料的時間先後依序為何？


    資料甲：此時國內有三種政治力量匯合一起，即貴族、王政和民主政治，每一種力量都非常平等，恰如其分，三種力量都盡力協助治理國家。執政官的權力有王權的色彩；元老院的權力有貴族政治的色彩；公民大會有民主政治的色彩。


    資料乙：國王為政權的領導中心；元老院由貴族組成，為國王的諮詢機構；公民大會由貴族與平民組成，有選舉國王和批准對外宣戰的權力。


    資料丙：政治腐敗、經濟惡化，國政日益敗壞；加上蠻族不斷入侵，羅馬邊防日趨僵化，無法有效防衛，兵源枯竭乃招募傭兵戍邊，成為邊防大患。


