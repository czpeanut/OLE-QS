  number: 9
  type: single
  page: 1
  stem: 荷蘭是歐洲地勢最低的國家之一，大部分土地都位於海平面以下，因此受海洋水位上升和洪水的影響非常大。在過去的幾百年裡，荷蘭經常受大海洪水的侵襲，為解決這個問題，荷蘭人發明風車這種古老而有效的機器。風車可以利用風力轉動葉片，帶動機器運轉，如抽水機和磨麵機等。荷蘭人利用風車抽取地下的地下水，以降低地下水位，從而防止土地淹水。請問：荷蘭所運用的風力最主要為下列何種風向？
  options:
  - label: A
    content: →
  - label: B
    content: ←
