- id: doc_113_新北_板橋_社會_歷史_g7s2e3_s2_32
  section: 2
  number: 32
  type: single
  page: 2
  stem: 請問：「聯合國大會第2758 號決議」內容對我國造成的影響，下列敘述何者正確？
  options:
  - label: A
    content: 韓戰爆發，美國派遣第七艦隊協防臺灣
  - label: B
    content: 美援終止，中華人民共和國趁機砲擊金門
  - label: C
    content: 我國失去聯合國席位，邦交國大幅減少
  - label: D
    content: 我國堅守中國代表權，採取鞏固外交政策。
  group_stem: "請閱讀以下文章後，回答第32～34 題。\n 近幾年，你可能時不時就會在國際新聞中看到一串神秘數字：2758。事實上圍繞這串數字展開的爭議，屢次成為國際間討論臺灣主權問題時的攻防焦點。\n\
    \ 2758 代表的是「聯合國大會第2758 號決議」。1971 年10 月25 日，第26 屆聯合國大會決議「恢復中華人民共和國的一切權利，承認她的政府的代表為中國在聯合國組織的唯一合法代表，並立即把蔣介石的代表從它在聯合國組織及其所屬一切機構中所非法佔據的席位上驅逐出去。」\n\
    \ 中國聲稱，通過了2758 號決議後，包括臺灣在內的全中國，已經在各方面都「乾淨徹底」地解決聯合國代表權問題，並明確表示「世界上只有一個中國，臺灣是中國的一部分，而不是一個國家」。不過許多臺灣或國際專家指出，一個聯合國大會的決議，並不能決定臺灣的國際法律地位；中國將「一中原則」納入國際法中的論點，「無論從內容，還是從程序層面來看，都站不住腳。」\n\
    \ 過去幾十年來，中國曾多次引用這項決議，阻止臺灣參與聯合國旗下的國際組織，並很少因此受到即時、公開的批評或反駁。但隨著國際政局的劇烈變化，臺灣晶片產業在全球產業鏈重要性增加，國際社會對臺灣的關注大幅提升，各國代表也就越來越常公開、直接地反對中國錯誤詮釋2758\
    \ 號決議。\n 2025 年5 月5 日，美國眾議院通過「臺灣國際團結法案」，明確指出：聯大「第2758 號決議」並未處理臺灣與臺灣人民在聯合國的代表權問題，並要求美國運用影響力及話語權，反制中國試圖扭曲該決議的行動。對此，總統府在社群平台上以英文表示感謝，指出美國國會的堅定支持傳遞一項清楚訊息：反對中國誤用2758\
    \ 號決議、限制臺灣的國際空間。\n上文節錄改寫自：地球圖輯隊｜這幾年常常出現的神秘數字2758，究竟是什麼意思？（https://dq.yam.com/post/16544）"
