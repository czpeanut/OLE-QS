  group_stem: "請閱讀以下文章後，回答第30～31 題。\n吉力吉撈．鞏冠拼音遭誤譯 原青團體籲正視命名文化 (資料來源：公視新聞網 2024.11.21\
    \ 報導)\n 世界棒球12 強如火如荼進行中，日前臺灣好手吉力吉撈．鞏冠（Giljegiljaw Kungkuan）在日本轉播時出現不同的拼音方式引發熱議。原民青年陣線為此在臉書發文說明，希望原住民族的選手和命名文化能夠被更正確的認識。而今（2024）年5\
    \ 月，立法院三讀通過《姓名條例》修正草案，增訂原住民族可使用原住民族文字、單列名字，不必侷限中文姓名。"
