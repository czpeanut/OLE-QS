- id: doc_113_台中_沙鹿_英語_g9s1e1_s4_4
  section: 4
  number: 4
  type: single
  page: 2
  stem: Which of the following is true about climate refugees?
  options:
  - label: A
    content: Climate refugees move because they want better jobs.
  - label: B
    content: Climate refugees are people forced to leave their homes due to extreme
      weather events.
  - label: C
    content: Climate refugees are people who choose to live near the sea.
  - label: D
    content: Climate refugees are those who travel for leisure.
  group_stem: 'Climate change is becoming a big issue around the world, and one of
    its most serious effects is the rise of climate refugees. Climate refugees are
    people who are forced to leave their homes because of extreme weather events,
    such as floods, droughts, and rising sea levels. These events make it difficult
    for them to live in their hometowns, as their homes may be destroyed or their
    land may become unlivable.


    For example, in some parts of Africa, people are moving away from their homes
    because droughts have made it impossible to grow food. In island nations like
    the Maldives, rising sea levels threaten to flood whole living areas. As a result,
    people in these areas are becoming climate refugees, searching for new places
    to live.


    How can people deal with the growing issue of climate refugees? One way is for
    governments to work together and create policies that help these people. Some
    countries are already building houses and offering resources for climate refugees.
    Another solution is to reduce the causes of climate change, such as by using renewable
    energy and cutting down on pollution. By addressing the root causes of climate
    change, we may be able to slow down the number of people becoming climate refugees.


     effects 影響；unlivable 無法居住的；governments 政府；climate 氣候；refugee 難民；extreme 極端的；drought
    旱災；destroy 摧毀；Maldives 馬爾地夫；threaten 威脅；addressing 處理'
