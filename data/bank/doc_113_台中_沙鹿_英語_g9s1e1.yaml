- id: doc_113_台中_沙鹿_英語_g9s1e1_s4_2
  section: 4
  number: 2
  type: single
  page: 2
  stem: What is the main goal of the passage?
  options:
  - label: A
    content: To explain(解釋) the good points of recycling in factories.
  - label: B
    content: To discuss(討論) good points of waste separation in schools.
  - label: C
    content: To describe(描述) the different types of landfills.
  - label: D
    content: To criticize(批評) students for not recycling enough.
  group_stem: 'Environmental protection is becoming more important every day, and
    students can play a big role in helping. One of the easiest ways to protect the
    environment is by practicing waste separation, which means dividing trash into
    different categories like recyclables, food waste, and general waste.


    Recyclables include items such as paper, plastic bottles, and cans. These can
    be sent to recycling centers where they are processed and made into new products.
    Food waste, like leftover food and fruit peels, can be composted to create natural
    fertilizer for plants. General waste, which includes things that cannot be recycled
    or composted, like plastic bags and broken toys, is usually sent to landfills.


    Schools that follow good waste separation practices produce much less general
    waste. This cuts down the amount of trash that ends up in landfills, which is
    beneficial for the environment. However, some students still mix up their waste,
    putting recyclables in the wrong can or failing to compost food waste properly.


    To make waste separation easier, many schools have clear guidelines and labeled
    cans. By following these rules, students can make a big difference in protecting
    our planet. Small actions like sorting trash correctly can have a big impact.


