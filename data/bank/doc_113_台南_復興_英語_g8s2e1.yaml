- id: doc_113_台南_復興_英語_g8s2e1_s6_1
  section: 6
  number: 1
  type: single
  page: 4
  stem: Ken has a sleep pattern like a bear. When is the best time for him to deal
    with his most important thing?
  options:
  - label: A
    content: At 3:00 a.m.
  - label: B
    content: At 9:00 a.m.
  - label: C
    content: At 9:00 p.m.
  - label: D
    content: At 12:00 a.m.
  group_stem: '《A》

    Early birds like to wake up early. Night owls like to go to bed late. But not
    everyone belongs to these two groups! Now, we use four different animals to talk
    about sleep patterns: lions, bears, wolves, and dolphins.


    Lions, for example, wake up very early and are the most energetic before noon.
    Bears wake up when the sun rises and go to bed when the sun sets. Wolves wake
    up later and feel their best in the evening. And finally, dolphins have trouble
    sleeping well because their minds keep thinking all the time.


    You can''t choose your sleep pattern. Your genes decide your sleep pattern. You
    can be a lion, bear, wolf, or dolphin. Your pattern might change—when you''re
    young, you might be a wolf, and when you are older, you might change into a lion.
    But you can''t change it just because you want to.


    It''s good to know your sleep pattern. This helps you plan your day better. For
    example:

    • Lions should do important work in the morning.

    • Wolves should leave the most important things for later in the day.

    • Dolphins might need short breaks during the day because they don''t sleep well
    at night.


