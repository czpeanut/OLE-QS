- id: doc_113_台南_復興_英語_g8s2e1_s6_4
  section: 6
  number: 4
  type: single
  page: 5
  stem: How was Jonathan different from the other seagulls?
  options:
  - label: A
    content: He didn’t care about or listen to his parents.
  - label: B
    content: He believed life was about more than just finding food.
  - label: C
    content: He liked staying close to the fishing boats for easy food.
  - label: D
    content: He thought fighting for food was more important than following his dream.
  group_stem: '《B》

    Jonathan was different from the other seagulls. Every morning, when the other
    birds fought over scraps of food near the fishing boats, Jonathan watched the
    eagles flying high above the clouds.


    "Why do we spend all day fighting for food?" Jonathan asked his parents. "Life
    should not be just about food. Look at the eagles—they fly so high! They can see
    more than we can."


    "Don''t be silly," his mother said. "We''re seagulls. The boats are safe for us.
    We must stay close."


    But Jonathan couldn''t stop thinking about the eagles. When the other seagulls
    were busy fighting for scraps, he practiced flying higher and faster. The other
    birds laughed at him.


    At first, his tries didn''t go well. The thin air made him feel sick, and many
    times he fell and got hurt. At night, he told himself, "Maybe I should be like
    the others." But every morning, when he watched the eagles glide through the sky,
    he felt the need to try again.


    One stormy day, when the seagulls fought for food, Jonathan flew high above the
    clouds, just like an eagle. From up there, he saw many fish in the ocean. At first,
    he only wanted to follow his dream of flying high like an eagle, but then he knew
    going after his dream could also help him live better. He didn''t have to fight
    for food anymore—he found his own way. After that, many young seagulls came to
    learn from him.


    When I grew older and my dream came true, I learned something important—life isn''t
    just about living; it''s about trying new things and choosing your best way of
    life. Being different can be scary, but it can also help you find new chances.
    Life isn''t about following other people''s dreams; it''s about being brave enough
    to find your own way.


