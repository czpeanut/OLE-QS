  stem: 58. ( )What is the topic of the poetry contest?
  options:
  - label: A
    content: Animals.
  - label: B
    content: The ocean.
  - label: C
    content: The environment.
  - label: D
    content: Friendship.
  group_stem: '(3)

    Ms. Lee: Sam, what are you doing?

    Sam: I entered a poetry contest. It aims to raise people''s awareness about the
    ocean. I need to write a poem about the ocean.

    Ms. Lee: It sounds great. Can you tell me your ideas?

    Sam: The ocean is unique; we can''t find another one. So, we should protect it.

    Ms. Lee: What does the sentence "E is for easy-going, everyone can get along with
    me." mean?

    Sam: The ocean is everyone''s friend. For example, kids can play and swim in the
    water. Fishermen can catch fish.

    Ms. Lee: Good! How about the next sentences?

    Sam: Don''t say "impossible." We have the power to help protect the ocean.

    Ms. Lee: Your ideas are good. Maybe I should get other students to write for the
    ocean, too.'
