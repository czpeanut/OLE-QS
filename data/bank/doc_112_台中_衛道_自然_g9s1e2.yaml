  stem: '某種可重複使用的熱敷袋，其內含有醋酸鈉水溶液和金屬片，使用方法的示意圖如右附圖所示。使用步驟：

    (1) 使用前按壓金屬片，引發醋酸鈉結晶析出並產生熱，用來熱敷。

    (2) 熱敷後，將已冷卻且因析出結晶而變硬的熱敷袋，放入水內加熱，即可回復原來的澄清狀態。可依此步驟重複再使用。

    關於上述步驟 2 發生的變化，以及醋酸鈉的溶解度說明，下列何者正確？'
  options:
  - label: A
    content: 步驟 2 為吸熱的變化，溫度升高溶解度會增加
