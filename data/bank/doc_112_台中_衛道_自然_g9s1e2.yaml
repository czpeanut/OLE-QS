- id: doc_112_台中_衛道_自然_g9s1e2_s3_59
  section: 3
  number: 59
  type: single
  page: 6
  stem: 在基因治療法中所使用的載體有何功能？
  options:
  - label: A
    content: 將壞掉的基因送出細胞
  - label: B
    content: 將酵素送入細胞中
  - label: C
    content: 將好的基因送入細胞中
  - label: D
    content: 將蛋白質送入細胞中。
  group_stem: '※閱讀下面文章，並回答 59~60 題：

    近年來由於生物科技的進步，科學家已發展出「基因治療法」，可以治療一些可遺傳或不可遺傳的疾病。基因治療法是將病人壞掉的基因，換上好的基因，以恢復基因功能。此種治療方式在目前仍屬於臨床實驗階段，尚未大規模正式使用。一般會使用病毒當「載體」，將正常基因準確地嵌入病毒內，再利用病毒感染細胞，此時病毒所攜帶的基因就會進入細胞中發揮功能，取代已經壞掉的基因。當然這些病毒都是經過特別處理，不會導致生病。基因治療法的實驗對象以癌症病人最多，大約占一半以上。原本大家對於基因治療法抱以相當高的期待，但從一九九○年開始的臨床實驗，成效似乎沒有預期中的好，這讓許多的科學家感到失望。也許人類仍需加強基礎科學的研究，因為畢竟基因是無法用眼睛看到的，所以實驗上還有許多盲點。'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
