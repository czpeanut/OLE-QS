  group_stem: 'Dear Debbie,

    We are Ted’s parents, and we are really worried about his future. Ted is a high
    school student who is very crazy about music, especially playing the drums. His
    dream is to become a pop star, and he had a band with his friends lately. While
    we understand what he loves, we have noticed that he has been spending a lot of
    time practicing music. It led to a decline in his studies.

    Last week, we had a serious fight with Ted because we wanted him to focus on his
    studies rather than music. We even said some terrible words that hurt his feelings.
    We know this made him very down, and he hasn’t spoken to us since then.

