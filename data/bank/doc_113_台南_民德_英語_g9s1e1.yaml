  stem: What is the "Green Line Test" on the internet?
  options:
  - label: A
    content: A way to make sure how tall people are in photos.
  - label: B
    content: A way to figure out how couples feel about each other in photos
  - label: C
    content: A new social media style where people draw green lines on their photos
  - label: D
    content: A skill to create beautiful photos
  group_stem: 'The Green Line Test: Can Photos Show How Couples Feel About Each Other?

    Have you heard of the “Green Line Test” on the internet? It’s a way to see how
    couples feel about each other by looking at their photos.

    This idea came from a user named Rivelino on X (formerly Twitter). He says you
    can tell who is in charge in a relationship by looking at their body language
    in photos.

    How to Use the Green Line Test: Look at a photo of two people. Draw a straight
    green line from their neck to their feet. If both lines are straight, the relationship
    is even. If one person is leaning, they might not feel safe. If both are leaning
    towards each other, the relationship is healthy.

    Is This Test Real? Some people think this test is stupid. When people take photos,
    they usually just try to find a comfortable pose. Tall people might lean down
    to fit in the picture, and some people just aren’t good at posing. This doesn’t
    mean anything.

    in charge:掌管 relationship:關係 even:平等 lean:傾斜 pose:姿勢'
