- id: doc_112_高雄_大灣_英語_g9s1e3_s2_49
  section: 2
  number: 49
  type: single
  page: 5
  stem: （ ）49. What is ChatGPT?
  options:
  - label: A
    content: A chatbot.
  - label: B
    content: A smartphone.
  - label: C
    content: A teacher.
  - label: D
    content: A student.
  group_stem: 'Is AI Friend or Foe?


    Many teachers have been experimenting with AI technologies, like ChatGPT, in the
    classroom. ChatGPT is a chatbot developed by OpenAI. The company’s website became
    one of the 50 most-visited in the world this year.


    People can ask the chatbot a question, and it will reply with an answer in essay
    form. Students and teachers are considering the effects of this on schools.


    Some school districts have banned ChatGPT. Some teachers see it as a tool that
    can be used to cheat. However, many educators say it’s too late to keep AI out
    of their classrooms. Some think ChatGPT is to English and writing what the calculator
    is to math. Some teachers said ChatGPT helped them come up with creative ideas
    for classes and to simplify texts for students not fluent in English.


    ChatGPT’s answers are not always right. Text generated by ChatGPT often contains
    factual errors, can be in the wrong format, or the tone can be off. What’s more,
    it may contain biases from the data it uses. For example, the views, knowledge,
    and experiences of smaller communities are less represented.


    Some say those with access to a high-speed Internet connection will be able to
    use AI consistently, but many students do not have that access. So allowing the
    use of AI for schoolwork could also lead to an unfair situation that will benefit
    some students over others.

    * foe (n.)敵人 *error (n.)錯誤 essay (n.)文章  *effect (n)影響  *district (n)區域 *ban (v)禁止
