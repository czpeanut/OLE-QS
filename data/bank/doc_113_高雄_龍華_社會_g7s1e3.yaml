  section: 1
  number: 21
  type: single
  page: 3
  stem: 清代康熙年間，清廷對於平埔族群採取「熟番保留地制度」，規定「番地」不得轉售漢人，並在各社設立「土目」管理番地租佃。然而到了乾隆年間，儘管官方仍聲稱保護「番地」，但實際上漢人已透過各種名目取得土地。十九世紀來臺的外國人郇和（Charles
    W. Le Gendre）也觀察到：「平埔族人現今已失去大部分土地，只能租用漢人土地耕作，或轉為佃農。」面對這種情況，清廷官員往往消極以對，甚至有意縱容。這種現象反映出平埔族群面臨何種主要困境？
  options:
