  type: single
  page: 3
  stem: 清朝時期的臺灣已成具高度移民色彩的社會。在地理區域的分佈上，通常同鄉會因互相照應而聚居。人數比例上閩南的泉州人約占移民總數的 45 %，漳州人約占移民總數的
    35 %，粵東客家人、潮州人約占移民總數的 16 %，閩南其他地區則約占4 %，這些移民潮形成了臺灣目前的主要族群結構，也奠定了臺灣社會文化的基礎。請問此時為什麼閩、粵地區的人移民臺灣的比例特別高?
