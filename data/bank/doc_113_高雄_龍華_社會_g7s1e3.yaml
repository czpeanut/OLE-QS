  stem: 「寒流來襲，雲林沿海地區氣溫驟降溫度剩不到10°C，造成台西鄉約有3 萬多尾養殖魚塭的虱目魚因寒害凍斃。縣府農業處則呼籲寒害災損養殖戶趕緊通報彙整，達到天然災救助標準就會馬上辦理補助。」綜上所述，寒害常使農、漁民受到嚴重損失。請問下列何處的氣壓系統何者與臺灣「寒害」的形成有關？
