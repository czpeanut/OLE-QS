  stem: 臺語「正港」就是來自正口對渡貨物往來的歷史，表示自官方許可港口「正港」進口的貨物是才正宗道地的舶來品。清代在海峽兩岸由官方設立對渡的港口，稱之「正口」，又稱「正港」，規定兩岸各種往來都必須透過正口，以利稽查及徵稅。因此相對於走私的「水貨」，從正港進口的是課過稅、有保證的「正港貨」。請問以下何者為臺灣最早的「正港」?
