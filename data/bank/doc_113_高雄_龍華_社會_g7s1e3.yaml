  stem: 為了解決乾季缺水的問題，並且將水資源妥善儲存，全臺多數河川的上游建有水庫。雖然水庫的建設使得水資源得以更有效的保存下來，但也對環境造成許多影響。請問下列何者並非水庫帶來的影響？
