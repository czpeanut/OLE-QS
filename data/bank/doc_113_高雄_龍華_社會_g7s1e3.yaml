- id: doc_113_高雄_龍華_社會_g7s1e3_s1_52
  section: 1
  number: 52
  type: single
  page: 6
  stem: '承上，原住民「Talum Suqluman」為何還有一個漢名「王光祿」呢? 這兩個名字之間究竟有什麼關係呢?

    過去殖民者強迫被殖民者放棄原有的命名方式，是常用的同化手段。國民政府來台後，強迫原住民族將名字改為「漢姓漢名」，由於作業倉促，加上有些戶政人員對原住民不尊重、許多原住民不諳中文，即使戶政人員的取名不雅，也難以馬上被原住民發現。原住民使用自己名字的權利遭到剝奪，也使原住民在面對社會大眾時倍感自卑。
    為了回復傳統姓名，保留各族命名的傳統，原住民族發起姓名權運動。一是「還我姓氏運動」，於1995 年通過姓名條例修正案，原住民可以在身分證上，以中文譯音登記自己的傳統姓名。二是「原名運動」。由於羅馬拼音比起中文譯音，更能完整拼出各族的語言。原住民運動開始推動原名運動，2001
    年再次修正法案，使原住民名字可以在中文譯音旁再加註羅馬拼音。  根據以上敘述，何者為是?'
  options:
  - label: A
    content: 尊重多元文化，促進原民文化的保存與傳承
  - label: B
    content: 社會應回歸主流文化，遵守既有之法律
  - label: C
    content: 原住民應傳承自我文化、青年宜回歸部落
  - label: D
    content: 落實部落自治，促使部落文化與法律共存。
  answer:
  - A
  answer_source: answer_key_vlm
