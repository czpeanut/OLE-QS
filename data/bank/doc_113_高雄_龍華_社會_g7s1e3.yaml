  type: single
  page: 6
  stem: '原住民Talum Suqluman:「母語沒有『獵人』這個字，這就是我們生活的一部分，翻成『獵人』，是因平地人不曉得。打獵不是買賣，家裡人想吃就去打，多的分享鄰居、獨居老人、沒男丁的族人，不是為了自己」。

    這位原住民的漢語姓名叫王光祿，11 年前(2013 年)因持槍獵捕長鬃山羊、山羌等保育動物遭判刑，引發台灣社會對於原住民狩獵傳統文化與野生動物保育的討論。全案歷經檢察長提起非常上訴、大法官釋憲等過程，終於在2021
    年獲得蔡英文總統特赦。11 年後，最高法院在2024 年3 月14 日終於改判王光祿無罪定讞。

    根據以上報導，我們得知狩獵權爭議，是原住民面臨的何種問題？'
