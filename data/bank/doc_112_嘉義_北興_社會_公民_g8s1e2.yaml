  stem: 2017 年由土耳其總統主導的修憲公投通過，總統不再只有象徵性政治權力，而是握有實質行政權，且總統可以不用經過國會批准發布法令，並有權力解散國會。憲法法院雖然可以審判總統，但15
    席最高法院大法官有12 人是由總統任命。有關土耳其修憲後的制度，下列敘述何者正確？
  options:
