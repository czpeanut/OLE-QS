- id: doc_112_嘉義_北興_社會_公民_g8s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 西方有句法諺：「有權利必有救濟。」憲法第16 條規定：「人民有請願、訴願及訴訟的權利」，即所謂的救濟權。下列救濟權的敘述，何者正確？
  options:
  - label: A
    content: 請願是人民針對政府違法或不當的處分提起救濟
  - label: B
    content: 訴願是指人民對於政策或利益，向主管機關或民意機關陳述願望
  - label: C
    content: 請願、訴願與訴訟都是經由法院尋求救濟，希望變更不當的政策或處分
  - label: D
    content: 訴訟是人民權利遭受不法侵害時，請求法院判決以排除侵害或獲得賠償。
