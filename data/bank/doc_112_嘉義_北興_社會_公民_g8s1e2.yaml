- id: doc_112_嘉義_北興_社會_公民_g8s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '位於美國的國際人權監察組織自由之家公布「2019 年世界自由度調查報告」。在報告中，我國得93 分，被評比為「自由」的國家，排名第26 名，在亞洲國家中自由度僅次於日本。相較之下，中國僅拿到11
    分，幾乎敬陪末座。人權與自由，從不是憑空而來，而是人民持續以不同形式抗爭，主政者不斷轉型下，才逐漸有今日的成果。中國歷史上，曾出現焚燬民間藏書、限制為官等事件，直至今日，仍有書籍被查禁、因政治立場不同而「被消失」的新聞。這些都反映出中國在改革開放後，經濟大幅躍進的同時，在人權與自由方面，還有很長的路要走。

    請問：在中國歷史上，商人曾受到差別對待，不僅在生活上受到限制，甚至不能參與科舉。請問：若以今日我國憲法所保障的人民基本權利來看，對商人「不能為官」的限制，違反哪項人民的基本權利？'
  options:
  - label: A
    content: 受國民教育的權利
  - label: B
    content: 選舉與罷免的權利
  - label: C
    content: 應考試服公職的權利
  - label: D
    content: 請願、訴願與訴訟的權利。
