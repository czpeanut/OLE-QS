    content: 土耳其透過分權制衡落實有限政府
  - label: B
    content: 土耳其權力運作模式符合憲政主義精神
  - label: C
    content: 總統權力集中，大法官仍可防止其濫權
  - label: D
    content: 總統權力缺乏監督，恐使人權無法受到完整保障。
