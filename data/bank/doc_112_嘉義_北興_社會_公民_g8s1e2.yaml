- id: doc_112_嘉義_北興_社會_公民_g8s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: '日前有促銷活動帶起鮭魚改名風波，現行法律可以接受改名為鮭魚，但是當原住民族想要以族語拼音系統，將身分證「單列族名」，卻遭到戶政機關以違反姓名條例駁回。
    根據姓名條例的規定，原住民回復傳統姓名時可將傳統姓名以漢字登記，或漢人姓名並列傳統名字羅馬拼音等方式。但因漢字無法明確傳達原住民名字的發音和意義，而造成誤解。
    由關心族名議題的大學生所組成的「以我的族名呼喚我」行動小組，認為現行規定有違反憲法疑慮，不僅違反憲法所保障的基本權利，也違背原住民族基本法和原住民族語言發展法的精神。因此行動小組成員向戶政事務所上級機關內政部提出訴願，要求政府開放身分證單列族名、尊重原住民族語言與文字，以及呼籲社會大眾多理解原住民命名文化。

    內政部戶政司表示，族名單列涉及姓名條例或原住民族基本法修法問題，當初因考量到姓名使用須達到社會溝通和識別，才會採取並列方式，而訴願相關文件將依照法定程序處理。（資料來源：改寫自簡惠茹，原住民身分證不能單列族名民間提訴願學者批就是歧視，自由時報，2021/5/12）

    上文中提到行動小組向戶政事務所上級機關內政部提出的訴願，是屬於人民的哪項基本權利？'
  options:
  - label: A
    content: 平等權
  - label: B
    content: 自由權
  - label: C
    content: 受益權
  - label: D
    content: 參政權。
  tags:
    chapter:
      publisher: 翰林
      book: 八上
