  stem: 下列有關文章中的敘述何者錯誤？
  options:
  - label: A
    content: 利用幹細胞進行組織培養是一種無性生殖
  - label: B
    content: 此技術未來可能發展器官移植
  - label: C
    content: 每年諾貝爾生醫獎的得主只能有一人
  - label: D
    content: 此技術屬於生物技術的一種
  group_stem: "西元2012 年，諾貝爾生醫獎得主是英國學者格登和日本教授山中伸彌，他們分別因細胞核移植和多能性幹細胞研究獲得肯定。山中盼早日將研究（如附圖）落實於新藥開發；格登則很高興細胞核的基礎科學研究，為人類的健康帶來改善。\n\
    \  兩名科學家發現，將成熟細胞以基因「重新編程」（reprogramming）後，會變為年輕細胞（多能性幹細胞），並可培養成身體各種組織細胞的技術，讓人類對細胞和器官發展有革命性了解。\n\
    \  誘導式多能性幹細胞是人造的新型萬能細胞，以人體皮膚等細胞，經人工培養而成的多功能細胞，再被誘導分化成生殖、肌肉、血液等各式細胞和組織器官，可從中取出成熟的神經、心臟和肝細胞等。由於是用患者自體細胞培養的組織，因此不會產生排斥。此技術可用於治療病患，也可供學者從新角度研究各種疾病。請根據以上文章，回答下列問題："
