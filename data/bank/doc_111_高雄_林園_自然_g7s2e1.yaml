  - label: D
    content: 血漿
  group_stem: "電影「絕地再生」(港譯：逃出克隆島)講述的是克隆人(複製人)的故事。男主林肯和女主喬丹被圈養在基因公司的『收容中心』內，據說他們是碩果僅存的人類，基因公司科學家嚴格管控他們的生活飲食與健康狀況；孕婦、身體健康、運氣好的尌可能被送去『天堂島』，成為延續人類族群的亞當和夏娃。有一天他們剛送走被選中去『天堂島』的一個壯碩黑人和一個孕婦，接著宣布喬丹成為下一個幸運兒，次日一早即將出發去『天堂島』！即將失去女友、輾轉難眠的林肯，鬼使神差的爬上一個通風口，卻意外地從醫院的地板鑽出來，撞見到孕婦臨盆之後隨即被殺、黑人被拖進手術室活取器官！才赫然發現原來『天堂島』只是一個美的謊言！於是林肯說服喬丹逃出『收容中心』，去找尋事情的真相，試圖掩蓋內幕的『收容中心』自然不會輕易放手，中間便上演了一連串險象環生的追殺狙擊。最後林肯找到本尊~一個放蕩生活的公子哥，喬丹也和本尊~不想變老的影視紅星見面了！本尊他們覬覦的是林肯和喬丹的健康器官，林肯和喬丹都是本尊用骨髓幹細胞克隆出來的複製人啦！\n\
    最後他們冒險潛回『收容中心』，解放了被欺騙的複製人同伴，也將基因公司醜陋的陰謀公諸於世。\n  請根據以上文章，回答下列問題："
  answer:
  - C
  answer_source: answer_key_vlm
