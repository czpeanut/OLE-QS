- id: doc_113_台中_順天_自然_生物_g9s2e1_s2_36
  section: 2
  number: 36
  type: single
  page: 3
  stem: 下列有關蓋斑鬥魚的推論，何者正確？
  options:
  - label: A
    content: 每年秋冬水質較佳時，是該魚的繁殖季節
  - label: B
    content: 雌魚會守護魚卵，以完成種族延續的工作
  - label: C
    content: 該魚可作為標示淡水中含氧程度的指標
  - label: D
    content: 幼魚存活率非常低，近年來數量銳減許多
  group_stem: '請在閱讀下列敘述後，回答(31)~(32)題：

    蓋斑鬥魚常見於鄉間的稻田和池塘。雄魚體色鮮豔，在清明節前後，背、腹、尾鰭會延長至原來體長一倍左右，身上鱗片會散發紅、藍光澤，相當美麗。雌魚體色較暗，尾鰭較短，和雄魚相差甚多。繁殖期間雄魚會固守自家領域，驅逐其他雄魚，並且在水面上不斷地吐出氣泡築成泡泡巢。等受精完成後，雄魚會將魚卵啣至泡泡巢孵化。孵化期間雄魚還會負責守護魚卵的工作，驅趕想接近泡泡巢的雌魚，免得被貪吃的雌魚把魚卵給吃了，所以幼魚的存活率約有五成，繁殖飼養均相當容易。

    蓋斑鬥魚的鰓上還有一種叫做「迷器」的呼吸輔助器官，因此當其他魚類必須靠近水面呼吸時，牠還能夠在氧氣濃度很低的水中生存。蓋斑鬥魚可在 $4^{\circ}\text{C}$
    到 $38^{\circ}\text{C}$ 的水溫中存活，喜歡吃昆蟲或孑孓。一尾體重約 0.6 克的蓋斑鬥魚一天可吞食 300 隻孑孓或蛹，因此大量繁殖蓋斑鬥魚可有效防治病媒蚊。'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
