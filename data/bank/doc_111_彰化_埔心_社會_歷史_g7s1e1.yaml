  stem: 清帝國時期，臺灣原住民被區分為「生番」和「熟番」，所謂「熟番」必須具備某些官方要求的條件。請問下列對於「熟番」的敘述，何者正確？
  options:
  - label: A
    content: 符合族群地域：必須為平埔族身分或遷居平地
  - label: B
    content: 全體遵守教化：應服從官府政令，全戶進私塾接受教育
  - label: C
    content: 應服勞役：須協助官府從事遞送公文、搬運、工事的工作
  - label: D
    content: 應服兵役：接受清帝國徵召擔任兵丁。
  answer:
  - C
