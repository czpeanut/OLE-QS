  options:
  - label: A
    content: 甲、乙、丙分別代表第三級、第二級與第一級產業
  - label: B
    content: 隨著經濟崛起，第三級產業產值已超越第二級產業
  - label: C
    content: 一九七○年代起第二級產業是中國經濟成長動力
  - label: D
    content: 丙持續下降的主因為收入較低。
