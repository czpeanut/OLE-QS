  section: 1
  number: 2
  type: single
  page: 1
  stem: 《地球圖擊隊》2016/06/28 報導:「根據最新研究顯示，北京每年地層下陷最高可達 11 公分，當地正一點一滴地陷落，連帶威脅地上的建築物還有大型公共建設，其中北京鐵路網首當其衝，陷2,000
    萬通勤族於危險之中。」下列哪一項中國政府的措施中最有助於減緩此一環境問題？
