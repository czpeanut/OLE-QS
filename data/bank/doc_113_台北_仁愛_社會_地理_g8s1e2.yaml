  number: 9
  type: single
  page: 1
  stem: 中國的地理特徵，在空間分布可發現特定規律，下列有幾項符合附圖分布的規律狀況？ 甲、礦產的分布 乙、人口的分布 丙、降水的分布 丁、年溫差大小
  options:
  - label: A
    content: '1'
  - label: B
    content: '2'
