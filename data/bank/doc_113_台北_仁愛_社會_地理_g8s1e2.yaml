  section: 1
  number: 20
  type: single
  page: 2
  stem: 中國的進口貿易額與出口貿易額均名列世界前茅。附圖為西元2020 年世界前五大貿易國的進出口貿易總額，甲〜戊分別代表不同國家。由圖可知，下列敘述何者正確？
  options:
  - label: A
    content: 甲國出口貿易額和進口貿易額皆最多
  - label: B
    content: 除了乙國為入超國，其他皆為出超國
  - label: C
    content: 世界前五大貿易國皆為碳排放量大國
  - label: D
    content: 甲國對乙國為貿易順差，乙國對丙國為貿易逆差。
