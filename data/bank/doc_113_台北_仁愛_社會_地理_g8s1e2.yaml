  section: 1
  number: 11
  type: single
  page: 1
  stem: 中國雖實施人口政策控制人口成長，但政策實施初期每年人口成長增加的數量依然十分龐大，其最主要的原因為何？
  options:
  - label: A
    content: 出生率仍高
  - label: B
    content: 死亡率降低
  - label: C
    content: 人口移民增加
  - label: D
    content: 人口總數眾多。
