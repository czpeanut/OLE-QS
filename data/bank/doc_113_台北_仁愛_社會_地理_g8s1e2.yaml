  group_stem: "【七】請閱讀以下短文，回答下列問題。\n新型冠狀病毒疫情帶來的經濟衝擊\n    17 年前 SARS 爆發時，中國還是「世界工廠」的見習生，GDP\
    \ 只占全球4%到5%。今天中國GDP 已占全球逾15％，不僅是第二大經濟體，還是世界上最大的新車與半導體銷售市場、最大觀光支出國。中國也是服飾紡織品的主要出口者，更是蘋果智慧型手機生產基地。如今的中國不僅是世界工廠，也是世界市場。\n\
    \    隨著新型冠狀病毒疫情的爆發，蘋果已暫時關閉中國所有分店，蘋果執行長庫克（Tim Cook）近日在財報會議上坦言，疫情為公司前景帶來「高度不確定」。電動車大廠特斯拉在上海工廠已延後開工，星巴克與麥當勞暫時關閉在中國的數百家分店。\n\
    \                  （改寫自商業周刊2020/02/05 文章）"
