  section: 1
  number: 10
  type: single
  page: 1
  stem: 「環渤海經濟圈依山面海，北連東北三省和內蒙古、南近隴海鐵路沿線工業城市，地理位置優越。環渤海經濟圈區具有諸多發展工業的有利條件：(甲)區內有豐富的鐵、煤和石油等重工業原料；以北京為中心向外輻射的(乙)鐵路、公路、航空運輸線都非常便捷，(丙)北京是沿海的重要門戶，其中更以(丁)中關村擁有雄厚的科技力量」。請問：上文畫底線處的敘述何者有誤？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
