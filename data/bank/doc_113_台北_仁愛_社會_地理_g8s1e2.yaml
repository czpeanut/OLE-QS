  section: 1
  number: 8
  type: single
  page: 1
  stem: 中國由國外輸入的原物料很多，進口額居高不下，下列何者為其主要原因？
  options:
  - label: A
    content: 和美國貿易逆差大，被迫進口
  - label: B
    content: 為世界代工基地，資源不敷使用
  - label: C
    content: 國內陸運不便，依賴外來海運輸入原料
  - label: D
    content: 國內礦源不穩，農產品加工業原料不足。
