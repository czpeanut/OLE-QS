- id: doc_113_台北_仁愛_社會_地理_g8s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 所謂商品糧基地，就是指該地所產糧食不僅可以滿足當地的消費需要，還可以作為商品向外地出售。四川盆地即是中國西南地區最大的商品糧基地。關於四川盆地商品糧基地的敘述，下列何者正確？
  options:
  - label: A
    content: 位次高階梯內，周圍群山環繞，進出不易
  - label: B
    content: 當地土地肥沃，常被開闢成梯田種植甘蔗
  - label: C
    content: 該盆地全年有雨無乾季，年、日溫差皆大
  - label: D
    content: 是長江流域人口最密集與經濟最發達的精華區。
- id: doc_113_台北_仁愛_社會_地理_g8s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '附表為中國西元2020 年三大經濟帶與產值比例，根據表中數據可推論哪一項中國經濟帶發展的狀況？


    單位:%

    | 經濟帶 | 產值 |

    | :--- | :--- |

    | 東部 | 57.7 |

    | 中部 | 25.6 |

    | 西部 | 16.7 |'
  options:
  - label: A
    content: 西部經濟帶自然資源豐富
  - label: B
    content: 中部經濟帶深具開發潛力
  - label: C
    content: 東部經濟帶環境負載力低
  - label: D
    content: 三大經濟帶區域發展不均。
- id: doc_113_台北_仁愛_社會_地理_g8s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 中國人口大量增加，使糧食的需求也與時俱增。傳統中國的農民常透過下列哪些方式，來增加糧食的生產？  甲、開發荒地擴大耕種面積  乙、製造堆肥以提高土壤肥沃度  丙、改良耕具用以提高耕作效率  丁、研發殺蟲劑以利減少病蟲害  戊、發明無人操作的農耕機械減少勞力使用
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲丙戊
  - label: C
    content: 乙丙丁
  - label: D
    content: 丙丁戊。
