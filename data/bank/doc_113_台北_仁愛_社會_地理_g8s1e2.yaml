  section: 1
  number: 17
  type: single
  page: 2
  stem: 小西瓜暑假前往中國旅行，飛機從內蒙古自治區的呼和浩特降落，欣賞美麗草原風光，之後到寧夏中衛某河川上搭乘傳統的羊皮筏子(羊皮與牛皮製成的擺渡工具)，再坐火車直奔廣西桂林，欣賞石灰岩洞的美麗，最後在廣東廣州品嘗有名的粵菜並搭機返臺。請問：下列敘述何者正確？
  options:
  - label: A
    content: 沿途經過的四個城市中，以廣東廣州人口數應該最多
  - label: B
    content: 小西瓜在中國第一長河--長江上體驗傳統的羊皮筏子
  - label: C
    content: 小西瓜的四個旅遊行程中，有經過維吾爾族的自治區
  - label: D
    content: 此時內蒙古自治區的呼和浩特是東北風帶來降水的雨季。
