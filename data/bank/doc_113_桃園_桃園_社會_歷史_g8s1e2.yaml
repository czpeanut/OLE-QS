  section: 1
  number: 14
  type: single
  page: 2
  stem: 孔廟作為國家推崇儒學的標誌，主祀孔子，並以孔門弟子和歷代儒家代表人物配享從祀，分四配、十二哲、先賢、先儒等。南宋理宗時，特別詔令將朱熹的牌位供奉於孔廟，清乾隆也將朱熹升為十二哲之一，在孔廟大成殿從祀孔子。朱熹如此受到重視足見他在中國古代學術上的地位，請問：讓他名垂千古的事蹟是哪一項重大貢獻？
  options:
  - label: A
    content: 罷黜百家思想，獨尊儒術
  - label: B
    content: 為《論語》、《中庸》、《大學》、《孟子》作注解，確立儒學的精華
  - label: C
    content: 將儒家思想融入道家和墨家思想成為新的學術，又稱理學
  - label: D
    content: 將儒學傳播到日本，改變日本的學術思想。
