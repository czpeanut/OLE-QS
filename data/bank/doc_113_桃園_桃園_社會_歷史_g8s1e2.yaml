- id: doc_113_桃園_桃園_社會_歷史_g8s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 《馬可波羅遊記》可說是遊記的始祖，西元1271年，十七歲的馬可波羅隨同父親和叔父從威尼斯出發，他們走過西亞、波斯、帕米爾高原、新疆、絲路，最後進入中國大都。他在中國生活了十七年，直到四十一歲才返回故鄉。《馬可波羅遊記》是口述的作品，他把東方的見聞向歐洲人描述，開拓了歐洲人的眼界。下列關於馬可波羅的描述，哪一項最合乎史實？
  options:
  - label: A
    content: 馬可波羅在中國當官，成為成吉思汗寵信的使臣
  - label: B
    content: 馬可波羅稱頌唐朝時代的中國繁榮鼎盛
  - label: C
    content: 在遊記中，他細說大汗重用儒生朱熹掌管科舉事務
  - label: D
    content: 在遊記中，他讚美使用寶鈔作為流通的貨幣十分方便。
