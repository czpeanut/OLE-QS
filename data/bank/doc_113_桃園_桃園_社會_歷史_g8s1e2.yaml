  type: single
  page: 1
  stem: 佳佳去參觀展覽《會動的清明上河圖》，此展將原畫放大30 倍，並讓畫中的人物活了起來。除了看到人物之間的互動外，此作品另一特色就是為原畫添加了夜景，如巡邏、夜市文化、河岸邊夜晚的酒店茶樓等。請問：佳佳能透過《會動的清明上河圖》看到當時社會的哪一項文化特色？
