- id: doc_113_桃園_桃園_社會_歷史_g8s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '下列為某個代兩位大臣對皇帝的建言。

    大臣甲：

    「國家長期對北方用兵，希望收復燕雲十六州，不僅使財貨持續消耗，也將造成大量百姓傷亡。如河南百姓聽聞陛下即將北伐，就有數萬人舉家逃亡。」

    大臣乙：

    「如今我們與契丹約為兄弟之邦，定期派遣使節，以連繫兩國的友誼，數十年來，北方的民眾也已經不知道何謂戰爭，這真是連漢、唐兩朝都比不上的盛世。」

    從大臣甲到大臣乙的轉變與下列何者最為相關?'
  options:
  - label: A
    content: 「澶淵之盟」的訂立
  - label: B
    content: 「靖康之禍」的影響
  - label: C
    content: 「聯金滅遼」的成果
  - label: D
    content: 「聯蒙滅金」的成果
  tags:
    chapter:
      publisher: 翰林
      book: 八上
