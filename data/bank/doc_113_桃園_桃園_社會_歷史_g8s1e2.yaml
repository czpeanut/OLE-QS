- id: doc_113_桃園_桃園_社會_歷史_g8s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: '老師要同學發表對「中國古代科技的發明及貢獻」的看法：

    甲生說：「蒙古西征將造紙術帶到歐洲，刺激歐洲文化的發展。」

    乙生說：「活字印刷術隨著阿拉伯人傳入歐洲，有助歐洲文藝的發展。」

    丙生說：「火藥隨著阿拉伯人傳入歐洲，導致西歐封建制度解體。」

    丁生說：「指南針透過阿拉伯人輾轉傳入西方，有助於歐洲新航路的發現。」

    以上四人所講的內容，哪一個最「符合」史實？'
  options:
  - label: A
    content: 甲生
  - label: B
    content: 乙生
  - label: C
    content: 丙生
  - label: D
    content: 丁生 。
