    labeled_by: ai
- id: doc_113_桃園_桃園_社會_歷史_g8s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 景山公園是明、清兩代的皇家御花園，公園坐落在明、清紫禁城的中軸線上，公園中心的景山，海拔45.7 米。景山中還有一處著名景點，即明思宗自縊處-萬歲山東麓的一株老槐樹。明崇禎十七年（西元1644
    年）三月十九日，叛軍攻入北京，明思宗縊死于萬歲山東麓一株老槐樹上，明朝滅亡。清軍入關後，將此槐樹稱為“罪槐”，用鐵鍊鎖住，並規定「清室皇族成員路過此地都要下馬步行」。請問：上文中的「叛軍」是指何者？
  options:
  - label: A
    content: 倭寇
  - label: B
    content: 滿清
  - label: C
    content: 李自成
  - label: D
    content: 吳三桂。
