- id: doc_113_桃園_桃園_社會_歷史_g8s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 這個民族建立的龐大帝國，領土東至日本海、西至地中海、北跨西伯利亞、南到波斯灣，國土橫跨歐亞大陸。在征服的土地上建立了統治政權，他們的戰術之強大，也引起西方的震驚與恐慌。請問：以下哪一項也是此民族的成就？
  options:
  - label: A
    content: 在各地建立驛站，有助於經貿往來與文化交流
  - label: B
    content: 最早將火藥運用在戰事上，讓領土擴張更快速
  - label: C
    content: 發明活字版印刷術，讓書籍能在民間普遍流通
  - label: D
    content: 為了管理海外貿易事宜，最先在廣州設市舶司。
