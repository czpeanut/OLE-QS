- id: doc_113_桃園_桃園_社會_歷史_g8s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 西元十五至十八世紀是人類歷史上發生重大變革的時代。歐洲人相繼進行全球性海上擴張活動，開啟了大航海時代。西歐商人的海上擴張，改變了傳統海上絲綢之路，透過海上絲綢之路，中國輸往世界各地的主要貨物，從絲綢到瓷器與茶葉，還傳播著民族工藝和儒道思想，對「海上絲路」沿線國家和地區以及對歐洲各地產生不同程度的影響，甚至掀起了「中國熱」。文中提到「中國熱」，吹起這股東方文明之風--「中國熱」的媒介主要是何者？
  options:
  - label: A
    content: 長老教會教徒
  - label: B
    content: 伊斯蘭教徒
  - label: C
    content: 學問僧和留學生
  - label: D
    content: 耶穌會傳教士。
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 歷史
      code: 4-3
      title: 東亞世界與西方的文化交流
      chapter: 第4章 明清時期東亞世界的變動
