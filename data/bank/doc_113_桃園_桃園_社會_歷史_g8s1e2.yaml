  stem: '寶寶同學的簡報如下：

    時間：十五世紀初

    路線：自劉家港出發，經泉州→中南半島→馬來半島→爪哇→蘇門答臘→斯里蘭卡→波斯灣→紅海→非洲東岸的木骨都束→麻林，返航

    影響：？


    請問：寶寶同學在簡報「影響欄」中應放入哪一答案最適合？'
