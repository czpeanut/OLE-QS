- id: doc_113_桃園_桃園_社會_歷史_g8s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 唐宋以後，南海貿易不再只是奇珍異寶的輸入，更有中國的茶葉、瓷器等商品輸出。這個變動除了反映中國生產與經濟的發展之外，也與南海形勢的「重大變化」有關。導致這個「重大變化」的原因最可能是：
  options:
  - label: A
    content: 南洋諸國開始盛行佛教
  - label: B
    content: 印度人大量移民東南亞
  - label: C
    content: 南洋諸國航海技術進步
  - label: D
    content: 阿拉伯勢力進入東南亞。
