- id: doc_113_桃園_桃園_社會_歷史_g8s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 出島是填海造陸而成的人工島。除了舶來品之外，西洋的知識也從這裡進入日本，如哲學、醫學、化學等，日本學者甚至會特地前往出島學習這些西洋知識。島上只有特定歐洲商人與官員才能開店，但不允許隨便離開出島。此外，除非獲得特定任務或業務的許可，否則日本人也不得隨意進入該島。請問：下列有關出島的敘述，何者正確？
  options:
  - label: A
    content: 出島上的商人應是指西班牙人
  - label: B
    content: 出島應位於日本的廣島
  - label: C
    content: 日本學者前往出島主要是學習天主教教義
  - label: D
    content: 日本以白銀買賣歐洲商人的舶來品。
