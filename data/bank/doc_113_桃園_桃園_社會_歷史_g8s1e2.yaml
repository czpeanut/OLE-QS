- id: doc_113_桃園_桃園_社會_歷史_g8s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 某一時期，一艘駛向中國的外國船隻在冬天航行時，遇上暴風，漂流至中國東南沿海某地，船中乘客獲救，送往官府途中，險被民眾毆殺。這位乘客懂漢字，在與中國官員筆談後，得知該地長期以來受到外國海盜侵擾，村民誤認他是海盜，所以群情激憤。這個區域除了經常有外國海盜騷擾外，且因環境條件不佳，謀生不易，導致人口常往海外移出。請問：題文中的這位乘客最可能是下列何者？
  options:
  - label: A
    content: 日本派到長安的遣唐使者
  - label: B
    content: 元代到泉州的阿拉伯商人
  - label: C
    content: 明代到中國遊歷的朝鮮士人
  - label: D
    content: 清初到北京考試的越南士人。
  tags:
