- id: doc_113_新北_江翠_國文_g7s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 「可使食無肉，不可居無竹，無肉令人瘦，無竹令人俗。人瘦尚可肥，俗士不可醫，旁人笑此言，似高還似痴，若對此君仍大嚼，世間哪有揚州鶴？」（蘇軾〈於潛僧綠筠軒〉）關於以上文句之敘述，下列選項何者正確？
  options:
  - label: A
    content: 肉和竹，是生活中缺一不可的
  - label: B
    content: 俗士要多食用竹筍，才能不庸俗
  - label: C
    content: 「此君」，指的是蘇軾
  - label: D
    content: 生活中有了竹，便不會俗不可耐。
- id: doc_113_新北_江翠_國文_g7s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 「所謂養貓千日，用貓□□，養得太久，居然不堪一用。這貓除了不抓鼠，其貪睡貪懶的程度，也是□□。除非肚裡唱空城計，被諸葛亮的男高音喚醒，否則牠是□□滯留夢鄉，了無歸意。」以上□□依序應填入何者？
  options:
  - label: A
    content: 一時/一絕/一逕
  - label: B
    content: 一時/一例/一逕
  - label: C
    content: 一刻/一絕/一晌
  - label: D
    content: 一刻/一例/一晌。
- id: doc_113_新北_江翠_國文_g7s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 下列關於〈溪頭的竹子〉文句之敘述，何者有誤？
  options:
  - label: A
    content: 「溪頭是一簇迷人的風景，而擁簇在這裡的那些茂密的竹林，乃是風景中的風景。」--溪頭的竹林是溪頭最美的風景
  - label: B
    content: 「每一棵竹子都在不顧一切地往上鑽挺，看起來就好像要去捕星星摘月亮，也好像是大家一起去搶奪那片藍藍的天空。」--以擬人法描寫竹子爭高直指的姿態
  - label: C
    content: 「該不是颱風不來南投罷，恐怕是這些茂密的竹子們不允許它進入這片山林。」--竹子有抵禦強風的團結精神
  - label: D
    content: 「它們絕對不會獨個兒走向其他林木叢裡去，也不會讓其他的林木走進它的行列裡來。」--竹子具有擇善固執的美德。
  lesson_raw:
    title: 溪頭的竹子
    basis: 題幹標明〈溪頭的竹子〉
