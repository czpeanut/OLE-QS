- id: doc_113_新北_江翠_國文_g7s2e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 「經過幾年人情冷暖的淘洗，我從不暗世事的黛玉，變成通達事故的寶釵，這段脫胎換骨的修煉，成為我人生轉淚點的重要註腳。」請判斷下列選項，何者對於錯別字的修改有誤？
  options:
  - label: A
    content: 「淘洗」應改為「掏洗」
  - label: B
    content: 「不暗世事」應改為「不諳世事」
  - label: C
    content: 「通達事故」應改為「通達世故」
  - label: D
    content: 「轉淚點」應改為「轉捩點」。
- id: doc_113_新北_江翠_國文_g7s2e2_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 〈天堂與地獄〉一文中，守門人大笑道：「它使你沒有理想、沒有創造、沒有前途，逐漸腐化，這種心靈的煎熬，要比上刀山下油鍋的皮肉之苦，更令人受不了啊！」以下何者，最貼近守門人所要表達的主要意涵？
  options:
  - label: A
    content: 追求物質享樂是生活的首要目標
  - label: B
    content: 心靈上的腐化比肉體的折磨更令人難受
  - label: C
    content: 人生無法避免痛苦，所以及時行樂
  - label: D
    content: 地獄的痛苦主要來自於身體上的折磨煎熬。
  lesson_raw:
    title: 天堂與地獄
    basis: 題幹標明〈天堂與地獄〉
- id: doc_113_新北_江翠_國文_g7s2e2_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 「蔥湯麥飯兩相宜，蔥補丹田麥補脾。莫道此中滋味少，前村還有未炊時。」從此詩的涵義，可以得知下列何種道理？
  options:
  - label: A
    content: 一葉障目，不見泰山，當明察
  - label: B
    content: 一言既出，駟馬難追，當慎言
  - label: C
    content: 比上不足，比下有餘，當知足
  - label: D
    content: 千里之行，始於足下，當積累。
- id: doc_113_新北_江翠_國文_g7s2e2_s1_20
  section: 1
  number: 20
  type: single
  page: 3
  stem: 下列關於〈天堂與地獄〉和〈隔山打牛〉兩則故事的說明，何者正確？
  options:
  - label: A
    content: 〈天堂與地獄〉明示我們若超脫於生活享樂，心靈將日漸昇華虛無，終將遁入空門
  - label: B
    content: 〈天堂與地獄〉所指的「天堂」，應是指心靈上的空虛和迷失
  - label: C
    content: 〈隔山打牛〉一文，師父要男孩自己學會強身，每日挑水，武功要等修養好心性之後再學
  - label: D
    content: 〈隔山打牛〉一文，藉師父之口，揭開男孩學有所成的原因，告誡讀者「能力」養成需要長期積累。
  lesson_raw:
    title: 天堂與地獄/隔山打牛
    basis: 題幹標明〈天堂與地獄〉和〈隔山打牛〉
- id: doc_113_新北_江翠_國文_g7s2e2_s1_21
  section: 1
  number: 21
  type: single
  page: 3
  stem: 知名文學家莫言曾說：「當你的才華還撐不起你的野心的時候，你就應該靜下心來學習；當你的能力還駕馭不了你的目標時，就應該沉下心來歷練。夢想，不是浮躁，而是沉澱和積累，只有拚出來的美麗，沒有等出來的輝煌。」下列選項，何者與上文之涵義最接近？
  options:
  - label: A
    content: 如果野心太大或目標太遠，將會無法成功
  - label: B
    content: 看清現實的殘酷，就不會對夢想抱太多期待
  - label: C
    content: 活到老學到老，夢想達成後仍需靜心學習
  - label: D
    content: 逐夢的過程，就是努力拉近現實與夢想的距離。
- id: doc_113_新北_江翠_國文_g7s2e2_s1_22
  section: 1
  number: 22
  type: single
  page: 3
  stem: 「你相信輪迴嗎？信不信都沒關係，我們都知道人是會死的。每個人都會死，有些人卻從來沒活過。有很多人活著，只是為了等待被埋而已。」(李偉文《傾聽自己的鼓聲》)下列敘述，何者最不符合本文之觀點？
  options:
  - label: A
    content: 人生是尋找生命價值的旅程
  - label: B
    content: 許多人不明白其生命的意義
  - label: C
    content: 生死輪迴，使人擺脫對死亡之恐懼
  - label: D
    content: 怠惰或庸碌的人生不算活著。
- id: doc_113_新北_江翠_國文_g7s2e2_s1_23
  section: 1
  number: 23
  type: single
  page: 3
  stem: 「在夢中，一位女士走進了一家店鋪，櫃檯後面站著的竟然是上帝。『你們這兒出售什麼？』她問。『你內心渴望的所有東西。』上帝回答。女士簡直不敢相信自己的耳朵，她決定買下一般人所有最美好的期望。『我想要愛情，還有內心的寧靜、快樂、智慧和無畏。』她說。上帝微笑著說：『親愛的，我想你理解錯了，我們這裡不賣果實，只出售種子。』」（安東尼‧德‧梅勒
