  section: 1
  number: 5
  type: single
  page: 1
  stem: 下列與「書法」有關的成語，何者運用正確？
  options:
  - label: A
    content: 小江愛好楷書，其臨摹的字帖「春蚓秋蛇」，筆力遒勁
  - label: B
    content: 王羲之的行書筆力「入木三分」，為後世所讚嘆
  - label: C
    content: 他的字帖墨跡凌亂，「力透紙背」，是幅失敗之作
  - label: D
    content: 這次參賽的書法作品多半「鐵畫銀鉤」，字體曲折，品質低落。
