- id: doc_113_新北_江翠_國文_g7s2e2_s2_40
  section: 2
  number: 40
  type: single
  page: 6
  stem: 有關〈食蔥有時〉一文的分析，下列何者錯誤？
  options:
  - label: A
    content: 以蔥為題材，描繪自己對蔥的偏愛，並在異地時烹煮出自己喜歡的創意蔥料理
  - label: B
    content: 以映襯法說明蔥在料理中雖「多半居於陪襯地位」，卻是「不可或缺」的好滋味
  - label: C
    content: 分別從蔥的地位、栽蔥經驗、蔥的料理等角度切入主題
  - label: D
    content: 文中時空轉換，有過去、現在，也有臺灣和海外，凸顯出對青蔥的喜愛始終如一。
  group_stem: '農曆正月倏忽將至，大啖青蔥的好時節又來了。

    老一輩台灣人有句琅琅上口的農諺「正月蔥，二月韭，三月莧……」一路數到十二月的大白菜，闡述出先人的智慧：萬物有定時，食亦應合時。正月收成的蔥栽種於農曆十月，成長期間逢冬，氣溫較低，因而蔥白特長，最是美味。

    記得母親還在世而我尚未出國時，有一年跟她一起上菜巿場辦年貨，攤上大捆大捆的青蔥，蔥白修長挺直，蔥葉碧綠柔嫩，看得我目不轉睛，擠過去買了一大把，須兩手才合握得住，媽媽說：「怎麼買這麼多？蔥不經擺，會枯掉。」

    「燒幾條蔥烤鯽魚，半把就用掉了。再炒個蔥爆牛肉或京醬肉絲，又是小半把。剩下來當調味料，不必等過年，兩天就吃光了。」

    「妳就是愛吃蔥，記得妳上小學以前偏食，簡直什麼都不吃，就愛從菜裡挑出蔥段來吃，還專舀漂在湯上的蔥花……」媽媽不知怎的，想起了我這個當事人幾乎快遺忘的遠年往事，天底下為人母者多半都是這樣吧，她們深知每一個子女的習慣、嗜好與不同的個性，更把有關兒女的一些瑣細小事都記得牢牢的。原來我愛吃蔥的歷史久矣，可是在那天以前，我並未覺察自己有此偏嗜──雖然直到現在我仍保有吃菜先挑蔥段、喝湯先舀蔥花的習慣。燒中國菜時加蔥，於我始終是那麼自然而然、簡直不必加以思索的事。

    喜以青蔥添味增香者何止我一人而已，蔥早已是烹調中國菜不可或缺的基本調味料。只不過它多半居於陪襯地位，充其量是舞臺上的小配角，在戲將落幕、菜臨上桌時方上陣，以蔥花或蔥絲的姿態驚鴻一瞥。然而你可別小覷這看似微不足道的青蔥，沒有它來畫龍點睛，紅燒牛肉麵、皮蛋豆腐和清蒸魚等多到不及細數的菜色，好像就失去該有的滋味。

    臺灣市面上常見的青蔥有北蔥和日蔥兩種。前者蔥白較短，質地稍粗，用來爆香還不錯，切成蔥花灑在熱湯或菜肴上亦佳，但較不宜切大段生食，有點辛辣。日蔥蔥白較長，質嫩且味較甜，身價自然也較高，宜蘭三星蔥即是日蔥的一種，用來爆炒固然好吃，即使佐烤鴨或捲大餅生食也並不很嗆。

    可惜我旅居的荷蘭只買得到北蔥，價錢貴不說，蔥白還特短，偶爾看到有蔥白長逾五吋的青蔥，簡直如獲至寶，趕緊買上三、四束。一束切除部分蔥葉，整根塗以橄欖油，炙烤到軟後，澆上更多的橄欖油、一點白酒醋，灑鹽和胡椒醃漬起來，冷透且入味後便是帶有義式風味的開胃小菜。其餘的蔥只留極少的蔥綠，切斜段，和以醬油、糖與酒醃過的牛肉片一同爆炒，佐以墨西哥烙餅，再來碗灑了蔥花的蝦皮蘿蔔湯，就是不中不西卻好吃到夫妻倆幾乎停不了嘴的家常美食。          ──節選自韓良憶〈食蔥有時〉'
  lesson_raw:
    title: 食蔥有時
    basis: 題幹標明〈食蔥有時〉
