  section: 1
  number: 4
  type: single
  page: 1
  stem: 下列文句，何者用字完全正確？
  options:
  - label: A
    content: 甲骨文主要通行於殷商時代，文字多刻寫在龜甲及獸骨上
  - label: B
    content: 金文指商周時代，雋刻在青銅器上的文字，又稱為鍾鼎文
  - label: C
    content: 小篆原是秦國的文字，是在大篆的基楚上發展、減化而成
  - label: D
    content: 草書的筆法奔騰毫放，變幻無窮，唐代的張旭是草書名家。
  lesson_raw:
    number: 語二
    title: 漢字的形體演變
    basis: 考查文字演變相關常識，出自語文常識（二）漢字的形體演變
