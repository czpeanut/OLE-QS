- id: doc_113_新北_江翠_國文_g7s2e2_s2_30
  section: 2
  number: 30
  type: single
  page: 4
  stem: 就作者看法，臺灣哪個地區能用蘇軾詩句「一年好景君須記，最是橙黃橘綠時」來描述？
  options:
  - label: A
    content: 桃竹苗山區
  - label: B
    content: 花東縱谷風景區
  - label: C
    content: 基隆河以北
  - label: D
    content: 高屏一帶。
  group_stem: "蘇東坡詩云：「一年好景君須記，最是橙黃橘綠時。」此詩雖是寫江南秋盡冬臨之景，卻可移於南臺灣。北臺灣此時因東北季風已行，天氣陰溼，反而不合。南臺灣因有中央山脈障蔽，一入舊曆十月，天高氣爽，風和日麗，好天氣一直維持到次年春末。故每當舊曆十月，橙橘陸續上市，而頭上是碧藍微笑的天空，便不由得憶起蘇軾的這首詩。\n\
    舊曆十月而後，南臺灣的住民，尤其是下淡水溪①以南的住民，便彷彿在一夜之間全數被某種奇異的幻化移入仙境一般，他們一覺醒來，睜開眼看去，便看到了檢點不盡的美：無邊的藍天彷彿在微笑，青翠的田園宛似無框的圖畫，清澄崇偉的南北太母山有如大地的雙眉，草花開滿原野，冬留鳥迤邐②自西伯利亞、華北趕來，晝則陽光明媚乃至嫵媚，夜則星月交輝，夜空澄澈得幾乎可以肉眼望見六等星，大氣輕盈彷彿有著浮力，人物走動，幾疑太空漫步，地心引力在這仙界中不由得自動減去了幾磅。\n\
    於是下淡水溪以南的住民心地變得異常良善而優美，沒有傾軋③，沒有爭鬥，人人無不盪漾著無邊的喜氣與歡悅，愚者憨，而智者慧。他們回憶起上半年的生活，恍如一場惡夢，不敢信以為真。\n\
    注釋：①下淡水溪：現在的高屏溪，下淡水溪為其舊稱。 ②迤邐：連續不斷的樣子。\n      ③傾軋：互相毀謗排擠。軋，音ㄧㄚˋ，排擠。"
