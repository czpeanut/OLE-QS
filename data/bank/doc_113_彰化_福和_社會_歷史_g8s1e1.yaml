  type: single
  page: 2
  stem: 歷史上掌權者為了削弱敵對者，往往透過改革與施行新政策，扭轉敵對者的優勢局面。魏晉以來，世家大族常與執政者相抗衡，隋代開始，為削弱九品官人之法對世族任官的保障，在官吏與人才的選用上，改推行哪個政策？
