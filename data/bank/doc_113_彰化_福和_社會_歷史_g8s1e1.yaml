  section: 1
  number: 26
  type: single
  page: 2
  stem: 某朝起在各地派任大中正官與小中正官，中正官將人才依照簿世（譜牒家世）、行狀（才幹、道德）、鄉品（中正鑑定）為標準查訪評定地方人才，整合後將官員評為以下等級：上上、上中、上下、中上、中中、中下、下上、下中、下下各等級。這些等級的人選會再依下列六條標準用於舉薦：(1)忠恪匪躬
    (2)孝敬盡禮 (3)友於兄弟 (4)潔身勞謙(5)信義可復 (6)學以為己。後朝當政者再依上述原則，另訂「清議」用於判定降級或除官，其標準包括：贓污淫盜、婚姻失類（與寒門通婚而違反世俗標準）、筆跡過鄙、家庭亂倫等。這套制度運行下來，形成怎樣的社會風氣？
  options:
  - label: A
    content: 萬般皆下品，唯有讀書高
  - label: B
    content: 上品無寒門，下品無世族
  - label: C
    content: 三十老明經，五十少進士
  - label: D
    content: 舊時王謝堂前燕，飛入尋常百姓家。
