- id: doc_113_彰化_福和_社會_歷史_g8s1e1_s1_20
  section: 1
  number: 20
  type: single
  page: 1
  stem: '秦統一天下後，秦始皇與大臣有以下的對話：

    丞相王綰和眾官：皇上，各國諸侯剛被滅，建議皇上把幾個兒子立為各地君王，好把位居偏遠燕、齊、荊等地安定下來。

    廷尉李斯提出批判：當初周文王、周武王派立很多同姓族人主掌各封國，結果後代親族逐漸疏遠，互相成了仇人而互相攻擊，連周天子都不能籲止這些紛爭。現在皇上以神力統一天下，可用國家的財力重賞皇帝的子弟和功臣，若再規劃郡縣採直接治理，天下就不會有二心，統治就可以得到安寧。皇上，封諸侯以管理地方，總之是不適宜的。

    秦始皇：你說得對。這天下會有爭鬥，就是因為各地封侯。朕剛得天下，若又規劃各處諸侯掌其封國，那就是朕自找兵禍了。要平息禍端其實是簡單的事，我贊成李斯的建議。                    譯自《史記
    秦始皇 本紀》

    依照上文判斷，李斯批評前朝哪種制度會發生弊端？'
  options:
  - label: A
    content: 部落聯盟制度
  - label: B
    content: 中央集權體制
  - label: C
    content: 宗法封建體制
  - label: D
    content: 累世當官的世家專權。
