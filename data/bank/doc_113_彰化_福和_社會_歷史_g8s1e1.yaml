  stem: 右圖【圖一】西周時期的毛公鼎是目前鼎內刻有最多敘事金文的金屬器。毛公鼎是周宣王的叔父為銘記周宣王的告誡而鑄造的。這件收藏於臺北國立故宮博物院的珍貴藏品，顯示當時西周有何時代特色？
  options:
  - label: A
    content: 當時金屬器主為青銅器，從青銅器的品質與型態可展現擁有者的身分和地位
  - label: B
    content: 政權屬於部落聯盟的型態，西周是當時最大的部落聯盟
  - label: C
    content: 內刻著金文是為替代紙類和筆墨的不耐用而留
  - label: D
    content: 天子至尊的地位已經淪喪，各方勢力問鼎中原。
