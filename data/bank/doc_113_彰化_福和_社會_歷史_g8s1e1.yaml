  section: 1
  number: 19
  type: single
  page: 1
  stem: 秦王嬴政統一天下之後，自以為能力超過以往聖王，於是自命為「始皇帝」。始皇帝原要皇帝二世、三世以至千秋萬世，結果秦帝國在第二世代時帝國便陷入動盪，秦末各方武裝勢力崛起，秦帝國最終國祚僅延續14
    年。分析秦朝大失民心而國運短暫的主要原因何在？
  options:
  - label: A
    content: 人民反對秦將多方面的制度設下統一標準
  - label: B
    content: 大封皇室宗室為諸侯，諸侯魚肉鄉民
  - label: C
    content: 人民在嚴刑峻法之下，承受過多的征戰、建設、賦稅與受迫害等苦難
  - label: D
    content: 人心對帝制神話反感，人民嚮往民主共和體制。
