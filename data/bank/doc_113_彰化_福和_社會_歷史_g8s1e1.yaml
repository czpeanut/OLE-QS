  stem: 兩岸重新開放雙向旅遊，小瑋立刻報名廉價旅遊團而欲一覽長城風光，豈知廉價旅遊團的導遊對長城知識欠缺專業，介紹的內容錯誤連篇，小瑋手持旅遊簡介比對導遊說詞，請找出導遊說詞正確的事：
