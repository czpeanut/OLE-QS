  stem: 漢代《史記》提到：「江南卑溼，丈夫早夭。」顯示早期中國政治中心常因氣候與環境因素，首都常設於黃河流域，江南則欠缺發展。但自某時期開始，江南歷經多朝在地開發，逐有「魚米之鄉」稱譽，甚至還有「人人盡說江南好，遊人只合江南老。」之說。請問，開始加速開發江南，是在哪個時期？
