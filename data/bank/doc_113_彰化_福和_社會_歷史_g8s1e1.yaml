  stem: '「歸納法」是指在羅列的事項中，探求他們共同的屬性。右表【表五】依照歸納法，※處得出的重點為何者？


    【表五】

    | ※ | 玄武門之變 |

    | --- | --- |

    | | 貞觀之治 |

    | | 被譽為「天可汗」 |

    | | 高僧玄奘至印度取經 |

    | | 聽取大臣魏徵諫言 |

    | | 文成公主至吐蕃和親 |'
