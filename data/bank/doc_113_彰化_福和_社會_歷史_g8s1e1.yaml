- id: doc_113_彰化_福和_社會_歷史_g8s1e1_s1_21
  section: 1
  number: 21
  type: single
  page: 1
  stem: 歷史上常有些制度久而久之，人們也終究從制度的缺陷中找到漏洞，制度原始的精神與原則已經不復存在，使得新的制度勢將取代舊的制度。某時代曾出現一個童謠：「舉秀才，不知書。舉孝廉，父別居。寒素清白濁如泥，高第良將怯如雞。（註譯：一個因文才出眾而可當官的人，結果那人卻沒讀甚麼書；因被認為孝順且做事公正而可當官的人，結果那個人居然沒有住在老父的家中照顧。說是出自清白的窮人家，但卻貪污像爛泥；而人稱譽來自名門的將領，結果懦弱像雞一樣。）」該童謠提到一種舉才任官的制度已經變質，推論這個童謠應是在何時流傳的？
  options:
  - label: A
    content: 東周周平王時
  - label: B
    content: 秦帝國末年
  - label: C
    content: 漢武帝時
  - label: D
    content: 東漢末年。
