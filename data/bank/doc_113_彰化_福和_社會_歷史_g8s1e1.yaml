  type: single
  page: 1
  stem: 戰國時蘇秦苦心向學，潦倒數年後受到趙國重用。同時代的張儀也曾拜與蘇秦同師，漂流楚國、趙國都未受重用，直到奔赴秦國，其能提出「連橫」的外交謀略，因而擔任秦相。蘇秦與張儀都是所謂的「布衣卿相」，該詞顯示當時人才的選用，有何現象？
