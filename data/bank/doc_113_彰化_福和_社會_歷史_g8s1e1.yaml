  section: 1
  number: 25
  type: single
  page: 1
  stem: 東晉時期自北方南渡避難的「僑姓」大族，其中的王姓、謝姓等勢力與司馬皇室攜手統治東晉疆域，當時有所謂：「王與馬，共天下」之說。與「僑姓」同為世族大姓者，尚有含朱、張、顧、陸等在舊孫吳之地的大姓，人們合稱這些姓氏為「吳姓」。而在北魏地區，從姓氏亦可判斷有些大姓是鮮卑漢化後的改姓，屬北魏執政者的宗室，人稱「國姓」，他們亦享有世族的尊貴地位。右圖【圖三】為東晉至南北朝後各世族勢力聚集地的示意圖，請選出正確對應地圖方位與史事的敘述：
