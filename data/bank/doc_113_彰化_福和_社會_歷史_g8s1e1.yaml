  - label: A
    content: 甲區為北魏國姓聚集地
  - label: B
    content: 乙區為「僑姓」大姓的原居地
  - label: C
    content: 丙區為永嘉之禍皇室遇難之地
  - label: D
    content: 丁區為五胡十六國紛紛建國之地。
