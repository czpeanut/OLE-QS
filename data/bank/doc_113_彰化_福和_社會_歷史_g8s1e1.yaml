- id: doc_113_彰化_福和_社會_歷史_g8s1e1_s2_33
  section: 2
  number: 33
  type: single
  page: 2
  stem: 從上文兩個資料，請選出合適詮釋唐代特色的詞語：
  options:
  - label: A
    content: 華夷一家，兼容並蓄
  - label: B
    content: 胡服騎射、披髮左衽
  - label: C
    content: 炎黃世胄，以華為尊
  - label: D
    content: 二元並立、雙軌運行。
  group_stem: "【資料一】\n    東周時至漢代，中國逐漸確立「禮法」，特別是以「婦不改嫁為婦德」、強調忠於丈夫的「女貞」，以及「夫為妻綱（妻以夫的原則為依循）」。但經過魏晉南北朝的民族遷徙和融合，到了唐代，離婚變得常見，唐代公主再嫁、三嫁的事已可司空見慣。而唐朝，皇室父子交互承接仍值青春年華的嬪妃為女伴等事，已少見外界議論，像是武媚娘（後人稱其「武則天」）原是唐高宗其父身邊的女嬪；常著雲衣霓裳跳胡旋舞的楊貴妃，其與唐玄宗相愛前原是唐玄宗兒子的妃子等，這些例子本都違反既有的「禮法」。推估這個現象可能是唐人沉浸於胡人風俗的影響：當草原民族人口亟需擴增時，父子兄弟要努力輪番把握喜愛的珍稀女性，除讓女性發揮最多生育力的可能，又可保有尊貴的血統。\n\
    【資料二】\n    落花踏盡遊何處，笑入胡姬酒肆中。（節錄自李白〈少年行〉）\n    胡麻餅樣學京都，麵脆油香新出爐。（節錄自白居易〈寄胡餅與楊萬州〉）\n\
    \    胡旋女，胡旋女，心應弦，手應鼓。迴雪輕飛勻兩袖，風沙颯颯飛胡舞。（節錄自白居易〈胡旋舞〉）\n    羌笛何須怨楊柳， 春風不度玉門關。（節錄自王渙之〈涼州詞〉）"
  tags:
