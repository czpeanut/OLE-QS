  stem: Who may NOT eat moon cakes like Chinese on the Moon Festival?
  options:
  - label: A
    content: Only people in Vietnam.
  - label: B
    content: People in Japan and Korea.
  - label: C
    content: People in Korea and Vietnam.
  - label: D
    content: People in Japan and Vietnam.
  group_stem: "The Moon Festival is an important holiday for Chinese.  But people\
    \ in other countries celebrate it, too.  In\nJapan, people get together and watch\
    \ the moon.  In Vietnam, people show flower lanterns on the street to celebrate\n\
    it.  In some places of Vietnam, there are shows of lion dances.  They dance from\
    \ house to house to ask for lucky\nmoney.  In Korea, the Moon Festival is a three-day\
    \ holiday for family to go back home and celebrate it together.\nDuring this time,\
    \ people give presents to family and friends, so it’s also called “Thanksgiving\
    \ Day.”\n   When it comes to the Moon Festival, moon cakes are a must-eat for\
    \ the Chinese and the people in Vietnam.\nJapanese don’t eat moon cakes.  They\
    \ eat rice dumplings “Tsukimi Dango”.  And in Korea, people eat\nsomething like\
    \ Chinese dumplings on the Moon Festival.\n celebrate 慶祝  lantern 燈  present\
    \ 禮物  dumpling 水餃"
