- id: doc_113_高雄_左營_英語_g8s1e1_s4_49
  section: 4
  number: 49
  type: single
  page: 6
  stem: Who may come from Singapore?
  options:
  - label: A
    content: 'Helena: Wow! This hamburger is really delicious.'
  - label: B
    content: 'Ellen: My mom is so careful, she always check everything twice before
      leaving work.'
  - label: C
    content: 'Mia: Don’t worry about the test. You can get good grades.'
  - label: D
    content: 'Ben: Sorry, I’m paiseh to ask you to buy me a bottle of milk.'
  group_stem: "Singapore is a place where many cultures come together. It is small,\
    \ but many different people live there, making\nit very international.\n   Because\
    \ of its history with Britain and the need for people from different races to\
    \ talk to each other, English is\nthe main language in Singapore.\n   But Singaporean\
    \ English is not the same as regular English. Most people in Singapore do not\
    \ use English as their\nfirst language, so they have different accents. Singlish\
    \ is a special way of talking English in Singapore. It mixes\nEnglish with words\
    \ from Chinese, Malay, and Tamil. Here are some common Singlish words and phrases\
    \ you might\nhear：\n1. \"Lah\" - Used at the end of a sentence to make it sound\
    \ more relaxed.\n  Example: \"Don’t worry lah, everything will be okay.\"\n2.\
    \ \"Lor\" – Used at the end of a sentence to show you are okay with something\
    \ or to finish a point.\nExample: \"Just do it lah, no need to think so much lor.\"\
    \n3. \"Kiasi\" – This means someone who is very scared or over careful.\nExample:\
    \ \"He’s so kiasi, always checking everything twice.\"\n4. \"Shiok\" – Used to\
    \ say something is very good or enjoyable, especially food.\nExample: \"This laksa\
    \ is really shiok!\"\n5. \"Chope\" – This means to save or reserve something.\n\
    Example: \"I’m going to chope a seat at the restaurant.\"\n6. \"Paiseh\" – Means\
    \ feeling embarrassed or shy.\nExample: \"Sorry, I’m paiseh to ask for help.\"\
    \n   When you visit Singapore, you can use Chinese or English, but using Singlish\
    \ would be even better! To enjoy\nyour trip, try to learn some Singlish phrases.\
    \ It can help you shop something cheap easily and make new friends\nquickly.\n\
      culture 文化  international 國際化的  Britain 英國  race 種族  main 主要的  regular 正規的\n\
    accent 口音  common 普遍的  phrase 短語  relaxed 放鬆的  reserve 保留  embarrassed 尷尬的"
