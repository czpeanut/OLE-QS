  type: single
  page: 5
  stem: What is the main idea of this reading?      main idea 主旨
  options:
  - label: A
    content: Joining the photography club will help people buy good cameras.
  - label: B
    content: Joining the photography club will help people learn how to be superstars.
  - label: C
    content: Joining the photography club will help people design lessons of photography.
  - label: D
    content: Joining the photography club will help people learn how to take great
      photos.
  group_stem: "Do you wish to take good pictures, or do you want to look great in\
    \ the pictures?  If you do, please come\nto photography club.”\nMany people think\
    \ it is too hard to take good pictures or to make themselves look nice in photos,\
    \ but in\nfact, they are not so difficult.  Some people have wrong ideas about\
    \ photography, but we will show you that\nthese two ideas are not true.  First\
    \ of all, some people think if they want to take good photos, they need\nexpensive\
    \ and good cameras.  But in our club, we will teach you to take excellent photos\
    \ with common\ncameras.  In the club, our great teachers will share a lot of tips\
    \ with you.\n\nJerry Lee\nMr. Lee is a popular teacher.  He can teach you to understand\
    \ your cameras.\nThis way, you will know how to use them more correctly and take\
    \ better pictures\nwith them.\nAnita Hsu\nMs. Hsu travels around the world and\
    \ takes many beautiful photos.  You can hear\nlots of cool stories in her class.\
    \  She also has her own photography exhibition in\nthe art museum this year.\n\
    Matt Smith\nMr. Smith is a world-famous photographer.  He is a three-time winner\
    \ of the\nWorld Photography Contest.  He is good at taking photos by using natural\n\
    lights and finding the best angle to show your face and body.\n\n   Take our lessons,\
    \ and you won’t feel that nice pictures are only for superstars.  Everyone can\
    \ look like\na superstar in the photos after they learn the tips.\n☆We offer two\
    \ kinds of lessons.\n| One-on-one lessons | You can choose your favorite teacher,\
    \ and they can design lessons for your needs. |\n| Group lessons | You can take\
    \ photos with others, learn from each other, and have more fun together. |\n\n\
    Do you want to join us now?  Just come to our first club meeting this Friday and\
    \ welcome to become\npart of us.\n        if 如果  photography 攝影  themselves 他們自己\
    \ will 將要…  tip 訣竅 correctly 正確地\nexhibition 展覽  photographer 攝影師  choose 選擇"
  shared_asset: g4_46_48
