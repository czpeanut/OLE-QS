  stem: 路透社(2024-08-15)報導，中國已制定出一份法律修正草案來簡化伴侶登記結婚的流程，同時也讓離婚申請變得更加困難，此舉引發不少網友嘲諷並登上今天的微博熱搜。此一草案發布之際，正值中國人口連年下降，當局想盡辦法要鼓勵年輕夫妻結婚生子。該草案取消了先前法律中關於結婚的地區限制，即夫妻必須在戶籍所在地辦理結婚登記。草案也提到，離婚必須經過30
    天的冷靜期，在這段期間，如果任一方不願離婚，就可撤回申請，終止離婚登記程序。請問：文中的中國政府想試圖解決下列何種人口問題？
  options:
  - label: A
    content: 人口出生率下降
  - label: B
    content: 人口老化嚴重
  - label: C
    content: 人口分布不均
  - label: D
    content: 教育素質低落。
- id: doc_113_高雄_鼎金_社會_地理_g8s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 黃河為中國第二長河，和長江並列中華文化母親河。黃河源自於青海省的巴顏喀拉山北麓，然後一路橫跨九個省，最後注入渤海。對大多數河流來說，「清澈」無疑是一大讚美，然而對黃河來說，混濁才是它最大的特色。黃河是因為中游流經圖(一)中哪一地區，因當地水土流失嚴重，才成為全世界含沙量最高的河流？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
