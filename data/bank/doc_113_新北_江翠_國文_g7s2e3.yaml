  section: 2
  number: 34
  type: single
  page: 5
  stem: 根據本文所述，作者對於「精明」與「厚道」在人際交往中的看法為何？
  options:
  - label: A
    content: 雖然「精明」能帶來短期利益，但「厚道」才能贏得長久的信任與穩固的關係
  - label: B
    content: 「精明」是年輕時學習人際關係的基礎，「厚道」則是年長後建立深厚交情的關鍵
  - label: C
    content: 判斷一個人是否值得深交，應該優先考量其「精明」的能力，其次才是「厚道」的人品
  - label: D
    content: 「精明」與「厚道」皆是人際交往的重要特質，但前者適用於商業場合，後者適用於私人關係。
