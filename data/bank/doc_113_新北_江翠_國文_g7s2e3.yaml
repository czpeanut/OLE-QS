  section: 2
  number: 33
  type: single
  page: 5
  stem: 根據上文，下列何者最不可能是飯店提供免費餐食的原因？
  options:
  - label: A
    content: 建立顧客對飯店的忠誠度，促使他們成為回頭客
  - label: B
    content: 展現飯店的體貼與周到，提升整體住宿體驗
  - label: C
    content: 避免顧客到外面消費，確保飯店內部餐飲收入
  - label: D
    content: 相信自身經營哲學能贏得顧客的包容與信任。
  group_stem: "我的上一份工作是個需要我瘋狂出差的工作，那時每年要去好幾次德國。每次去德國，我都會住同一家簡單乾淨的商務飯店，飯店大廳櫃檯的旁邊，有個小桌子擺放著檸檬冰水和一次性杯子，供顧客們免費使用。有時候早上，還會看到它們給晚起又趕著上班的客人提供的咖啡牛奶和新鮮出爐的牛角麵包。\n\
    \    這些免費供應，都是和飯店的餐廳直接有利益衝突的，換句話說，喝了免費的檸檬冰水咖啡，可能就會少買或不買飯店大廳咖啡廳的飲料；吃了免費提供的牛角麵包，可能就乾脆選擇不包早餐。\n\
    \    有一次我跟櫃台的經理聊天，想知道它們的想法是什麼。他笑著跟我說，他在英國念旅館管理，有一堂課，老師請The Ritz-Carlton Hotel\
    \ 的總經理來講課，這位總經理對他們說：「如果你走進一家好的酒店，提出一個要求，你就會被滿足。如果你走進一家極好的酒店，你甚至不需要提出要求。因為，真正飯店經營的精明，不是利潤，而是客戶的忠誠度。經商，貌似靠的是精明，其實，精明的極致，是厚道。」\n\
    \    生活中，我們遇到的暫時吃小虧卻長久贏得厚道美名的例子可以信手拈來，當然，反之亦然。年輕的時候，我們願意跟一個人深交，可能是因為有彼此需要的能力，可能是因為有互利的利益。但是，年紀大一些你才會知道，能讓你安安心心交往的，都不是一個人的能力或聰明，而是他的人品。可能是他很誠實，可能是他很正義，可能是他很善良，也可能只是他就是很堅持對你的承諾。而這些說得出來說不出來的一些信任感，其實都不是精明聰慧，而是「厚道」。想想，你認識的這麼多人當中，回想起來，什麼時候你用「這個人很精明」來表達你的稱讚？而那些你脫口說出「他真是個好人」的人，不都是厚道的人嗎？\n\
    \    回到那個飯店櫃台經理。那天他說完了The Ritz-Carlton Hotel 哲學後，微笑地對我說：「我們從來沒有因為擺放了咖啡麵包，而讓我們的餐廳受到多大的損失，我們卻因為這樣，讓我們的客人包容了我們不足的地方，他們願意相信我們做不好的地方，絕不是因為我們不上心。」還有什麼比這個更讓我們鬆一口氣的呢？\n\
    \    厚道，不是因為退縮示弱，是因為我們強大到，願意去成全。"
