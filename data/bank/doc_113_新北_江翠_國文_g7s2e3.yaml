  stem: 對於下列「之」字的說明，何者正確？
  options:
  - label: A
    content: 使匠石斲「之」：蠅的翅翼
  - label: B
    content: 宋元君聞「之」：莊子送葬之事
  - label: C
    content: 試為寡人為「之」：砍去郢人的鼻子
  - label: D
    content: 臣則嘗能斲「之」：鼻子上的灰土。
  group_stem: '莊子送葬，過惠子之墓，顧謂從者曰：「郢人堊慢①其鼻端若蠅翼，使匠石斲②之。匠石運斤成風，聽而斲之，盡堊而鼻不傷，郢人立不失容③。宋元君聞之，召匠石曰：『試為寡人為之。』匠石曰：『臣則嘗能斲之。雖然，臣之質④死久矣。』自夫子之死也，吾無以為質矣，吾無與言之矣。」

    ①堊慢：在鼻子上塗抹薄薄一層的白粉。 ②斲：音ㄓㄨㄛˊ，用斧頭削掉。

    ③不失容：神色不變，態度從容。       ④質：指可以相互對話、切磋的對象，此處引申為知音。'
