  - label: C
    content: 這家旅店價格「經濟」實惠，吸引許多客人入住／「經濟」衰退導致許多企業倒閉，失業率提高
  - label: D
    content: 隔宿露營因天候不佳而「泡湯」，讓大家很失望／他常在週末前往礁溪「泡湯」，紓解一週的壓力。
