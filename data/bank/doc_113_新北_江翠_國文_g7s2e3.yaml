    content: 作者能夠體驗到「物外之趣」的原因包括視力良好、明察秋毫，以及聚精會神地仔細觀察事物
  - label: B
    content: 以第二人稱角度記錄作者的童年往事，善用誇飾手法展現作者豐富的想像力
  - label: C
    content: 作者先釋放出蚊子在天上飛舞，接著抬頭觀賞成千上百的鶴鳥在空中飛舞
  - label: D
    content: 全文先分說童年發生的事例，然後再總結全文，驗證物外之趣。
