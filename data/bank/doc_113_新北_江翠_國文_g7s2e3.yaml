- id: doc_113_新北_江翠_國文_g7s2e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 「許多人總喜歡把登頂成功比喻為『征服』一座山，但我從沒想過要征服一座山。山又豈是人所能征服的？我排除萬難登頂，為的只是一件事：征服自己的侷限、征服自己的狹隘與怯懦。」這段文字的涵義最接近下列何者？
  options:
  - label: A
    content: 大自然的力量遠超人類，不應妄想征服
  - label: B
    content: 真正的挑戰來自於戰勝自身、超越自己
  - label: C
