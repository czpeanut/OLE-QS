  type: single
  page: 2
  stem: 「得之於人者太多，出之於己者太少，因為需要感謝的人太多了，就感謝天罷。」這段話的涵義和下列何者最相近？
  options:
  - label: A
    content: 滿足他們吧！你將是上天賜予他們的恩典，有人需要你的愛
  - label: B
    content: 豐收是自然和人類合作的大手筆，人豈可貪天之功而愚昧地自鳴得意
  - label: C
    content: 生活充滿了困惑與潛在的混亂，而宗教的力量能夠引導我們找到意義與秩序
  - label: D
    content: 當你真正地擁抱生命後，就能以寬廣的心胸看待萬事萬物，擁有海闊天空的人生觀。
  lesson_raw:
    title: 謝天
