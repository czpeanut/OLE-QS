    content: 因科技及交通運輸等因素的改善才興起的新概念
  - label: B
    content: 以多種面向流動，每種面向相互重疊、交互影響
  - label: C
    content: 可透過有形的跨國企業擴張，但不能傳導無形的文化
  - label: D
    content: 有助於經濟發展，縮短各國貧富差距，促進勞工權益。
