- id: doc_113_桃園_桃園_社會_公民_g9s2e1_s1_39
  section: 1
  number: 39
  type: single
  page: 2
  stem: 根據上文，案例一中畫底線的部分為何項法律？
  options:
  - label: A
    content: 《著作權法》
  - label: B
    content: 《專利法》
  - label: C
    content: 《商標法》
  - label: D
    content: 《個人資料保護法》。
  group_stem: '案例一:我國羽球雙打於2020 年東京奧運金牌之戰，電腦系統判定最後一球屬於界內，因此獲勝贏得金牌，這個關鍵性的圖示畫面隨即傳遍網路。許多商家立即把這張原圖開發成商品，例如：口罩、T
    恤、馬克杯…等。智財局表示，已收到多起案件申請，希望經審查通過後，取得此圖案的專屬權利。

    案例二:近年來國內各種電視機上盒充斥，以一次購買即可收看免費直播、影集等內容標榜，不僅影響國內各大電視台影視權益，更讓我國通訊傳播主權受到嚴重挑戰，侵害上下游系統業者生存權，更觸犯法律，影響我國智慧財產權保護形象甚鉅。

    案例三:食安問題頻傳造成民眾對食品安全的信任度降低，故多選擇購買有政府認證之標章食品；然而，因取得有機標章認證程序繁瑣，因此有不法業者竟自去大賣場購買其他合法業者通過驗證的有機蔬菜，將其包裝袋上之有機認證標章剪下，再重新黏貼到未通過有機驗證業者所生產蔬菜的包裝袋上，冒充為合法有機業者所生產之有機農產品，藉以牟取不法利益，影響民眾權益甚鉅。     節錄自:經濟部智財局'
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 公民
      code: 1-2
      title: 尊重智慧財產權
      chapter: 第1章 科技發展
    textbook: 九下公民 1-2 尊重智慧財產權
    labeled_by: ai
