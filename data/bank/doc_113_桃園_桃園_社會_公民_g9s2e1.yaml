  page: 1
  stem: '彤彤老師參加一個智慧財產權的有獎徵答遊戲，要將甲、《專利法》；乙、《商標法》；丙、《著作權法》，由上至下填入附表。請問：下列哪一個組合正確？

    | ？ | 鼓勵、保護、利用發明與創作，以促進產業發展 |

    | --- | --- |

    | ？ | 保障商標權及消費者利益，維護市場公平競爭 |

    | ？ | 保障著作人著作權益以及社會利益，促進國家文化發展 |'
  options:
