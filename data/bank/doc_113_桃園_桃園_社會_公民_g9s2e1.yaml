- id: doc_113_桃園_桃園_社會_公民_g9s2e1_s1_36
  section: 1
  number: 36
  type: single
  page: 1
  stem: '依照以下的內容判斷，下列敘述何者最正確？

    6 月 20 日是世界難民日，根據聯合國的報告，現今已有超過 3,530 萬人被迫離開自己的家鄉，由於各國資源有限，甚至僅能提供落腳之處，這些逃離至其他國家的難民為自謀生路，開始尋找工作機會，他們除了在經濟上面臨困境，身為一個外來者，如何理解當地文化並與之和平共存，也是一項嚴峻的考驗。'
  options:
  - label: A
    content: 難民通常是為了改善生活而形成的跨國移動人口
  - label: B
    content: 難民必須得到移入國的法令批准，才可進入該國居住
  - label: C
    content: 當地社會的勞動力可能會增加，亦可能占用原有資源，此乃機會成本概念
  - label: D
    content: 難民可能成為非法移民，對移入國帶來的皆為負面影響。
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 公民
      code: 2-2
      title: 全球化面臨的挑戰
      chapter: 第2章 全球化的影響與挑戰
    textbook: 九下公民 2-2 全球化面臨的挑戰
    labeled_by: ai
- id: doc_113_桃園_桃園_社會_公民_g9s2e1_s1_37
  section: 1
  number: 37
  type: single
  page: 2
  stem: 根據文中內容判斷，制定上述法案是為了因應下列何種現象？
  options:
  - label: A
    content: 全球化下的經濟互動擴大貧富差距
  - label: B
    content: 科技發展改變人類生活與資源分配
  - label: C
    content: 國家主權運作受到跨國企業的威脅
  - label: D
    content: 受僱者在市場上未能獲得合理報酬。
  group_stem: "近年來，由於網路科技的發展，民眾獲取新聞的習慣逐漸由閱讀紙本改為線上閱讀，而被分享在社群網路平臺上的新聞連結也成為許多民眾獲取資訊的管道，廣告業主認為瀏覽量較多的社群網路平臺能帶來更高的曝光度，轉而將廣告資金投入瀏覽量較多的社群網路平臺。\n\
    \    澳洲當地的傳統新聞媒體業者認為，社群網路平臺僅是分享新聞連結，並沒有付出成本從事新聞產製工作，卻能獲得較多的廣告收入，因此傳統新聞媒體業者主張「新聞有價」，要求社群網路平臺為這些新聞內容付費。但社群網路平臺業者認為本身只是提供新聞曝光的平臺，反而還能增加新聞的瀏覽量，要求他們付費並不合理。\n\
    \    最後在澳洲當地傳統新聞媒體業者的遊說下，澳洲政府制定《新聞媒體與數位平臺強制議價法》，要求這些分享新聞連結的社群網路平臺，應與傳統新聞媒體業者達成付費協議。"
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 公民
      code: 1-1
      title: 科技發展的應用與影響
      chapter: 第1章 科技發展
    textbook: 九下公民 1-1 科技發展的應用與影響
    labeled_by: ai
