- id: doc_113_桃園_桃園_社會_公民_g9s2e1_s1_31
  section: 1
  number: 31
  type: single
  page: 1
  stem: 我國著作權法規範的「合理使用」，是指下列何者？
  options:
  - label: A
    content: 凡使用著作權法所保護之資料，必須徵求著作權人的同意才可使用
  - label: B
    content: 使用著作權法保護之資料，須徵求著作權人的同意，且付給合理的費用
  - label: C
    content: 允許他人在一定的規範下合理使用該著作，而不需徵求著作權人的同意
  - label: D
    content: 使用著作權法所保護之資料，若未事先徵求著作權人的同意，事後需繳交2倍費用。
