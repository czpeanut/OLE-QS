- id: doc_113_桃園_桃園_社會_公民_g9s2e1_s1_41
  section: 1
  number: 41
  type: single
  page: 2
  stem: 根據上文，關於案例三的敘述，下列何者正確？
  options:
  - label: A
    content: 政府認證之有機標章並非原創，故不受《商標法》之保障
  - label: B
    content: 文中提及業者透過重新剪貼標章，再成為新的標章，故可依《專利法》申請專利權保障。
  - label: C
    content: 文中業者侵害了原標章的著作權，依法須負行政責任
  - label: D
    content: 文中業者的行為除了須負民事賠償責任之外，亦須負刑事責任。
