- id: doc_113_桃園_桃園_社會_公民_g9s2e1_s1_43
  section: 1
  number: 43
  type: single
  page: 2
  stem: 依據文中所述，下列敘述何者正確?
  options:
  - label: A
    content: 美國總統上任後的政策，皆不會對台灣造成影響
  - label: B
    content: 其中巴拿馬運河股權易主以及對加拿大與墨西哥徵收關稅，乃為經濟全球化的影響
  - label: C
    content: 我們能即時得知川普演講的內容，此乃政治全球化的概念
  - label: D
    content: 文中提及非法移民，乃為全球化貧富差距之議題。
  group_stem: '2025年3月5日，美國總統川普發表他二度進入白宮的首次國會演說。節錄重點摘錄如下:

    1.澤倫斯基來信求和

    前幾天在白宮與川普起爭執的澤倫斯基寫信給川普，希望能修補雙邊關係。信中表示，烏克蘭已經準備要上談判桌，並在川普強而有力的領導下達成和平，烏克蘭也準備好可隨時簽署美烏礦產協議。

    2.巴拿馬運河出售給美國公司

    擁有巴拿馬運河港口特許經營權的香港公司「長江和記實業」，不敵美國政府持續施壓，決定將旗下港口集團80%股份，出售給美國「貝萊德」資產管理公司，交易金額約為228億美元。形同香港企業勢力完全退出。

    3.加拿大墨西哥關稅持續

    川普重申會對加拿大、墨西哥徵收25％關稅。

    4.宣稱非法移民入境創歷史新低

    川普表示，在自己上任43天後，美國的非法移民入境數量來到歷史新低。    節錄自:關鍵評論網'
