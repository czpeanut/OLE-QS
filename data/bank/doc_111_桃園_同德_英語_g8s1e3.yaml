  group_stem: '(38-40)

    Man: Excuse me. Could you please tell me where I can find a supermarket open twenty-four
    hours a day?

    Sue : Yes, I know one. Its name is BestBuy.

    Man: How can I get there?

    Sue : You can walk there. Go along Star Street and cross Earth Road. Then go past
    a bus stop,and you will see it on your left.

    Man: OK, I see. By the way, do you know how to go to the Metro station?

    Sue : Sure. Go along Star Street for one block. Then turn right on the corner
    of Star Street and Moon Road. You will find it on your right.

    Man: There is one more thing. Can we take Bus 236 at the bus stop?

    Sue : Yes, you can.

    Man: Thanks a lot.

    Sue : You’re welcome.'
