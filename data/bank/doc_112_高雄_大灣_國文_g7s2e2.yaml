- id: doc_112_高雄_大灣_國文_g7s2e2_s4_30
  section: 4
  number: 30
  type: single
  page: 5
  stem: 對於上文的敘述，何者正確?
  options:
  - label: A
    content: 舞蹈是林懷民的妻子，寫作是他的情婦
  - label: B
    content: 林懷民雖名為舞者，但於不惑之年就有小說集問世
  - label: C
    content: 林懷民能抓住表演的形象，全源自於他特殊過敏的體質
  - label: D
    content: 縮腹要像吃西瓜裡面的肉全挖空，是林懷民對舞者的正面指導語。
  group_stem: '（二）

    「你的臀部落下來的那一剎那，要像開汽水瓶一樣，『剝』的一聲，別拖泥帶水。」「你們就像掛在屠宰場上的肥豬肉，鬆垮垮的，跳出來沒有線條！」「跳起來那麼不整齊，簡直像一鍋沸水在起泡。」「你不會縮腹？就像吃西瓜，把裡面的肉全給挖空了！」「要做這種矯健的撲躍，就像貓準備攻擊時，弓起來張爪抓地的低吟。」「你的眼睛為什麼瞪得像鈕扣一樣，呆滯無神？」他形容舞者沒舉直的手像抹布，失去重心的跳躍動作像潑到空中的蛋花湯……一般的舞蹈老師恐怕沒有這樣豐富的聯想力。事實上，雖然名為「舞者」，他仍隨時隨地攜帶著小說家駕馭語文的看家本領。他十四歲開始投稿，大學時代就出了小說集。常有人問他：「你為什麼不寫小說，跳舞去了？」他的回答是：「跳舞是我的初戀，寫作是我的妻子。結婚後，遇到老情人，舊情復發，於是舞蹈變成了我的情婦。」他答得泰然自若，問的人卻傻了眼。林懷民是幸運的。他同時擁有「妻子」與「情婦」，二者卻能相輔相成，絲毫不興醋意。作為小說家，他讀書、他觀察，對人、對事、對文字，都有股特殊的敏感；作為舞臺工作者，他運用這股特殊的敏感抓住表演的形象，無論是小家碧玉、大家閨秀、莽夫、烈士……他都能輕易刻畫出來。

    （節錄自《遠見雜誌》林懷民特寫 )'
