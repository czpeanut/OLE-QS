    (甲)隨音波上下飄搖 (乙)在渦裡左右打轉 (丙)我化作一片落花 (丁)我化作一葉小舟'
  options:
  - label: A
    content: 甲乙丙丁
  - label: B
    content: 丙乙甲丁
  - label: C
    content: 丁甲丙乙
  - label: D
    content: 丁乙丙甲。
- id: doc_112_高雄_大灣_國文_g7s2e2_s3_11
  section: 3
  number: 11
  type: single
  page: 2
  stem: 關於絕句和律詩的描述，下列何者最為正確？
  options:
  - label: A
    content: )兩者皆盛行於唐代，合稱古體詩
  - label: B
    content: 一首五言律詩總共會有四十個字，一首七言絕句則只有二十個字
  - label: C
    content: 偶數句押韻，奇數句中第一句可押可不押，其他不可押韻，皆須一韻到底
  - label: D
    content: 兩者皆有嚴格的平仄限制，且都須對仗。
- id: doc_112_高雄_大灣_國文_g7s2e2_s3_12
  section: 3
  number: 12
  type: single
  page: 2
  stem: 國文課時，老師請同學各吟誦一首詩，請問哪一個同學吟誦的是「近體詩」？
  options:
  - label: A
    content: 元太：兩個黃鸝鳴翠柳，一行白鷺上青天。窗含西嶺千秋雪，門泊東吳萬里船
  - label: B
    content: 光彥：慈母手中線，遊子身上衣。臨行密密縫，意恐遲遲歸。誰言寸草心，報得三春暉
  - label: C
    content: 布美：五花馬、千金裘。呼兒將出換美酒，與爾同消萬古愁
  - label: D
    content: 柯南：關關雎鳩，在河之洲，窈窕淑女，君子好逑。
