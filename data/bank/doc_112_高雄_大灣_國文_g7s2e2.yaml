- id: doc_112_高雄_大灣_國文_g7s2e2_s4_32
  section: 4
  number: 32
  type: single
  page: 6
  stem: 外公說的話，點出作者犯的錯誤是什麼？
  options:
  - label: A
    content: 將聰明用在計算外婆的健康狀況上
  - label: B
    content: 用直接傷人的方式展現自己的聰慧
  - label: C
    content: 未能好好發揮與生俱來的天賦異稟
  - label: D
    content: 過度地沉溺於追求自我的能力展現。
  group_stem: '（四）

    你們會以天賦為傲，還是以你的選擇為傲？在我 10 歲的時候，利用各種機會練習算術，我記得當時曾經聽過一個廣告，每吸一口菸就會減少幾分鐘壽命。我決定為抽菸的外婆算一算。我計算她大概一天抽幾根香菸、一根菸可以抽多少口，算出我覺得滿意的合理數字後，拍拍外婆的肩膀，驕傲地公布：「如果每吸一口菸會減少兩分鐘壽命，您已經少活九年了。」

    我原本期待外公外婆會稱讚我聰明、數學好，但實際情況並非如此。外婆聽完後就哭了，當時我心想：「我闖禍了嗎？」外公是非常聰明、不多話的人，他從來沒有凶過我一句，外公看著我，柔和平靜地說：「傑夫，有一天你會明白，仁慈比聰明更難。」我今天想跟大家分享的，就是天賦與選擇。聰明是天賦，仁慈是選擇。天賦與生俱來，但是選擇就難了。如果不小心，你們可能就會被聰明誘使做了傷害仁慈的選擇。你們是一群很有天分的人，頭腦聰明又能幹，這點我毫無懷疑，因為要進入普林斯頓大學是非常競爭的，不聰明是進不來的。在這充滿創新驚奇的世界，聰明是優勢。但是，你們將如何運用自己的天賦？你們會以天賦為傲，還是以你的選擇為傲？

    明天，完全由你們書寫的嶄新的人生新頁，真的要開始了。我敢說，當你們八十歲的時候，靜靜回想，在心中對自己說一生的真實故事，其中最鮮明、最有意義的將是你做的一連串選擇。人生就是由選擇所創造的。為自己創造一個偉大的人生故事。祝你們好運。

    （節錄亞馬遜創辦人對普林斯頓畢業生的 12 分鐘演講）'
