  stem: '「好雨知時節，當春乃發生。隨風潛入夜，潤物細無聲。 ， 。 ， 。」

    (甲)曉看紅溼處(乙)野徑雲俱黑(丙)花重錦官城(丁)江船火獨明。

    安妮亞寫作業的時候不小心把墨水打翻，把詩的末兩聯蓋住了，她想把詩重新排列，依照近體詩押韻、對仗規則，請問排序正確的選項為何？'
  options:
  - label: A
    content: 乙丁甲丙
  - label: B
