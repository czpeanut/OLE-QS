  stem: 以下是七年級某班同學針對艾青跳水一詩所做的詩意分析，請問何者分析的內容較為正確？
  options:
  - label: A
    content: 小丸子：詩句中的「陶醉」意味跳水選手正沉浸在觀眾的加油聲中
  - label: B
    content: 丸尾：「從容的曲線」描述跳水者擁有完美的身體曲線
  - label: C
    content: 美環：作者運用「青春」與「激起」描寫場邊觀眾對跳水比賽滿懷著熱血與衝勁
  - label: D
    content: 花輪：「雪白的讚嘆」隱含著觀眾對於追求理想者的肯定。
  lesson_raw:
    title: 跳水
    basis: 題目指明「艾青跳水一詩」
- id: doc_112_高雄_大灣_國文_g7s2e2_s3_7
  section: 3
  number: 7
  type: single
  page: 1
  stem: 有關白靈風箏一詩的敘述，下列何者正確？
  options:
  - label: A
    content: 「風箏」在詩中象徵外在的現實環境
  - label: B
    content: 「長長一生莫非這樣一場遊戲」此句說明人的一生，就像風箏遊戲般飄移不定
  - label: C
    content: 「上去，再上去，都快看不見了」顯現出即使面對不確定的未來，也要積極奮鬥的人生態度
  - label: D
    content: 「沿著河堤，我開始拉著天空奔跑」展現了螳臂擋車的自信。
  lesson_raw:
    title: 風箏
    basis: 題目指明「白靈風箏一詩」
- id: doc_112_高雄_大灣_國文_g7s2e2_s3_8
  section: 3
  number: 8
  type: single
  page: 1
  stem: 請問下列何者對生涯規劃的看法可以呼應風箏中「細細一線，卻想與整座天空拔河」的情懷？
  options:
  - label: A
    content: 小夫：我韓語學得普普通通，不敢想要去韓國當導遊，勉強可以在台灣看看韓劇
  - label: B
    content: 胖虎：雖然我現在剛加入大灣國中柔道隊，假以時日，我一定要站上奧運場上與世界菁英共同拚搏
  - label: C
    content: 靜香：雖然我在校內閱讀心得比賽得獎了，但是我想我應該沒有把握當一位作家
  - label: D
    content: 大雄：老師誇我很有正義感，我想我當班級幹部還可以，如果擔任警察或軍人的話我一定不能堅持下去。
  lesson_raw:
    title: 風箏
    basis: 題目引用風箏詩句「細細一線，卻想與整座天空拔河」
- id: doc_112_高雄_大灣_國文_g7s2e2_s3_9
  section: 3
  number: 9
  type: single
  page: 1
  stem: 下列節選的新詩，哪一首與「感謝你們／對於我／小小的存在／還報予／生命最熱烈的掌聲」一詩所歌詠的對象相同？
  options:
  - label: A
    content: 在不同的脣吻間／游移／等待的愛／終是苦釀後的回甘
  - label: B
    content: 我在每一個小老百姓的身上／都鑽到了一口／取之不盡／鮮紅的／油井
  - label: C
    content: 冷豔洗空的季節／借枝蘆葦／站個耶穌釘十字架的姿勢
  - label: D
    content: 整個夏天／你的鼓噪／很像我家悍婦／那種重複調子／令人思慮的／不知道誰抄襲誰的語言。
