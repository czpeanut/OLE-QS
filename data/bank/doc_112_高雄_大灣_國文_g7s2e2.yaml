- id: doc_112_高雄_大灣_國文_g7s2e2_s3_35
  section: 3
  number: 35
  type: single
  page: 6
  stem: 根據本文的觀點，下列何者最可能維持長期的轉變?
  options:
  - label: A
    content: 小凱為了消除緊張而在表演前反覆練習
  - label: B
    content: 小義想在半年內成功挑戰一場馬拉松
  - label: C
    content: 小資相信自己能成為一名優秀的羽球國手
  - label: D
    content: 小晴決定在暑假期間完成四十篇閱讀心得。
  group_stem: '（五）

    人很容易高估一個決定性瞬間的重要性，也很容易低估每天都做些小改善的價值。相較之下，百分之一的改善並不特別值得注意——有時甚至根本不被注意——但其意義卻可能大得多，尤其長遠來看。隨著時間去，微小改善所能造成的變化非常驚人。算起來是這樣的：如果每天都能進步百分之一，持續一年，最後你會進步三十七倍；相反的，若是每天退步百分之一，持續一年，到頭來你會弱化到趨近於零。

    習慣就是「自我改善」這件事的複利。如同錢財透過複利加倍，習慣的效果也在你重複執行的過程中加倍。要在日常生活中體會這個概念可能不容易。我們做出一些改變，成果卻似乎總是來得不夠快，於是我們回歸先前的慣例。習慣的改變造成的影響，近似於飛機路線調整區區幾度產生的結果。假設你要從洛杉磯飛到紐約，如果飛行員從洛杉磯國際機場起飛時，將飛機的航向往南調3.5
    度，飛機就不會抵達紐約，而會降落在華盛頓特區。如此細微的改變——機首偏移幾呎——在起飛時幾乎難以察覺，但經過橫越整個美國的距離放大之後，最終的降落地卻差了好幾百哩。

    同樣的，日常習慣的微小改變也能將你的人生引導到非常不同的目的地。做出好百分之一或糟百分之一的選擇，在當下似乎沒差，但是經過橫越一生的時間放大，便會決定你是怎麼樣的人，或是你能成為怎麼樣的人。造就成功的，是日常習慣，而不是千載難逢的機會。時間會放大成功與失敗之間的差距，會將你餵養給它的東西加乘。好習慣讓時間成為你的盟友，壞習慣讓時間與你為敵。

    改變的發生分成三個層次：第一層是改變結果，即改變你的成果；第二層是改變過程，即改變習慣與系統；第三層是改變身分認同，如信念、世界觀、自我形象等。結果關乎你得到什麼，過程關乎你做了什麼，身分認同則關乎你相信什麼。每一層次的改變各有其用處，問題在於改變的方向。許多人在展開改變習慣的過程時，都把重點放在想要達成什麼。這會將我們引至以結果為基礎的習慣。替代做法是建立以身分認同為基礎的習慣——在這種方式下，我們一開始就把重點放在希望成為什麼樣的人。

    真正的行為改變是身分認同的轉變。你也許會因為受激勵而開始一個習慣，但要維持下去只有一個原因：這個習慣成為你身分認同的一部分。誰都可以說服自己上健身房或選擇健康飲食一、兩次，但只要行為背後的信念不改變，就很難維持長期的轉變。在成為自我身分的一部分之前，改善都只是暫時的。

    ——改寫自詹姆斯．克利爾原子習慣'
