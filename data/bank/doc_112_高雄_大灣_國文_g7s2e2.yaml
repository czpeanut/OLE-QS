  stem: 唐代近體詩發展鼎盛，形成四大流派，請根據下列選項的詩風，依照浪漫派→社會寫實派→山水田園派→邊塞派的順序加以排列： （甲）誓掃匈奴不顧身，五千貂錦喪胡塵。可憐無定河邊骨，猶是深閨夢裡人。
