  stem: 電影《十日談》取材於喬萬尼·薄伽丘的原名小說作品，內容提到：「1348年，黑死病肆虐，死亡的氣息壟罩整個歐洲，繁華的城市佛羅倫斯也無法倖免於難。十位男女決定前往遺世獨立的湖濱別墅，期望能夠躲過死神的召喚。在這個世外桃源，一同生活、玩樂，在無法預知這場瘟疫何時能結束的情況下，他們決定發揮想像力，每人每天說一則故事打發這漫漫長日，忘卻恐怖的死亡威脅……。」請問：下列關於《十日談》的敘述，何者正確？
  options:
  - label: A
    content: 當初薄伽丘是以西班牙的方言進行創作
  - label: B
    content: 《十日談》的故事背景發生在希臘半島
  - label: C
    content: 作者以諷刺的筆法，批評腐敗的教會和社會風氣，充分表達人文主義的思想
  - label: D
    content: 故事的取材廣泛，從神話鬼怪到作者親身經歷都有不同的描述。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
