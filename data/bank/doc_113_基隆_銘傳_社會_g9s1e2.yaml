  stem: 以下為羅馬教宗烏爾班二世在法國 克萊芒舉辦一場宗教會議的演講內容：「□人已經入侵我們東方兄弟的國家，又占領了我們的聖地。我要勉勵你們，也懇求你們，督促一切有封爵等級之人，乃至所有騎士、士兵、富人與窮人，都必須迅速給予東方基督徒援助。把兇惡的民族趕出我們的領土，我告訴在座的各位，也通知不在場的人：這是上帝的旨意。……凡動身前往的人，假如在途中，不論在陸地或海上，或在反異教徒的戰爭中失去生命的，他們的罪過將在那一瞬間獲得赦免，並得到天國永不朽滅的榮耀。」請問：有關上述資料提到的內容，何者錯誤？
  options:
  - label: A
    content: □指的是塞爾柱土耳其人
  - label: B
    content: 文中的「聖地」位於右圖中的戊處
  - label: C
    content: 文中的「異教徒」指的是穆斯林
  - label: D
    content: 此舉有助於東西文化交流，使中國的火藥因此傳入歐洲。
  assets:
  - key: s1_21_f1
