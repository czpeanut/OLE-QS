  page: 1
  stem: 志願結社是具有共同興趣、目標或利益的個人基於自由意願組成團體。下列關於志願結社特徵的配對，何者正確？
  options:
  - label: A
    content: 志願性：是人民基於自願結合的非強制性團體
  - label: B
    content: 自主性：人們基於自由意願與認同而形成團體
  - label: C
    content: 組織性：由人民組成，不受任何政府組織支配
  - label: D
    content: 民間性：人民主動探究公共事務，並監督政府  【習作】
  answer:
  - A
