- id: doc_111_彰化_埤頭_英語_g8s2e3_s2_36
  section: 2
  number: 36
  type: single
  page: 2
  stem: ( ) 36. What does the word "Wonder" mean?
  options:
  - label: A
    content: A study of plants and animals.
  - label: B
    content: A feeling of great surprise.
  - label: C
    content: A kind of strange inventions.
  - label: D
    content: A group of scientists and engineers.
  group_stem: 'The Wonders of Biomimicry


    Scientists and engineers learn a lot from nature. They study plants, animals,
    and even small insects to find inspiration(靈感) for creating new inventions(發明).
    This is called biomimicry. Biomimicry means learning from nature and copying the
    amazing ideas to solve problems.


    Nature has many great designs to be imitated(模仿的). For example, did you see a
    gecko(壁虎) walk up walls and even hang upside down on the ceiling(天花板)? Scientists
    studied the gecko''s feet and invented a special tape to stick to things, just
    like a gecko''s feet! It''s called gecko tape.


    Another example of biomimicry is inspired(啟發) by the way a lotus leaf stays clean
    and dry even in muddy water. There are small bumps(凸塊) on a lotus leaf. They don''t
    let water or dirt stick to them. Scientists used this idea to create self-cleaning
    paints.


    One more amazing invention is inspired by the beak of a kingfisher bird. When
    the kingfisher dives into water to catch fish, it almost makes no splashes(潑濺聲).
    Engineers designed high-speed trains based on the kingfisher''s beak to make them
    faster and quieter.'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
