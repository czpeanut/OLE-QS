- id: doc_111_彰化_埤頭_英語_g8s2e3_s2_46
  section: 2
  number: 46
  type: single
  page: 3
  stem: ( ) 46. Why does President Joe Biden wants more electric vehicles on the road?
  options:
  - label: A
    content: To build more charging stations.
  - label: B
    content: To make driving more convenient.
  - label: C
    content: To stop all of the air pollution.
  - label: D
    content: To solve the problem of climate change.
  group_stem: 'Should All Cars Be Electric(電動的)?


    President Joe Biden would like half of all new vehicles(車輛), electric vehicles
    (EVs), to be zero-emission(零排放) by 2030. It''s a response(回應) to the climate change.
    Actually, the United States is one of the biggest emitters(排放) of greenhouse gases.
    And more than a quarter of the country''s emissions come from gasoline-burning
    vehicles.


    However, according to a 2021 survey(調查) by Pew Research Center, more than half
    of U.S. adults plan to stick with gasoline cars. They say EVs are expensive and
    charging(充電) them is a trouble. Here are the views about EVs from two of our young
    readers.


    Callaway Kershaw, 11

    Windsor, Colorado

    We should all have electric cars. This would decrease(減少) air pollution and let
    us breathe better. Cleaner air also means there will be fewer animals dying. If
    the world can be better and cleaner, it will be worth(值得的) the expense(耗費) of
    electric cars. Some electric cars are more expensive, but they need less maintenance
    保養 than gas-powered cars. Also, electric cars can travel 33 miles for about one
    dollar. You can''t say that for gas.


    Alison Lee, 9

    Los Angeles, California

    It''s still too early to go all-electric. True, electric cars help slow climate
    change, but batteries(電池) affect(影響) the environment badly. Besides, it''s not
    easy to get the materials to make batteries. There is also another problem- so
    far the charging stations aren''t enough. I''m not saying we should never go electric,
    but now is not the time.'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
