- id: doc_111_彰化_埤頭_英語_g8s2e3_s2_41
  section: 2
  number: 41
  type: single
  page: 3
  stem: ( ) 41. What do squirrels love to do in Central Park?
  options:
  - label: A
    content: Swim in the lake.
  - label: B
    content: Climb trees and play around.
  - label: C
    content: Catch butterflies.
  - label: D
    content: Dig holes in the ground.
  group_stem: 'Squirrels(松鼠) in Central Park


    Squirrels are special animals in Central Park, New York City. They love to climb
    trees and play around in the park. Many people visit the park to see these cute
    and lively creatures(生物).


    Squirrels are like the park''s little friends that make everyone happy. They collect
    nuts and sometimes forget where they buried(埋) them. This forgetfulness actually
    helps trees grow! When squirrels forget about their nuts, those nuts can turn
    into new trees. So, squirrels help make the park greener and more beautiful!


    Next time you visit Central Park, keep an eye out for squirrels. They might run
    and jump right in front of you. Just remember not to get too close or feed them,
    because they''re wild animals. Enjoy watching them from a safe distance(距離) and
    appreciate(欣賞) the wonders of nature in the city!'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
