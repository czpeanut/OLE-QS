    \ animals. This has hurt the Earth. In fact, the problem is so difficult that\
    \ it’s time for us to do something about it.\n   Therefore, what are the possible\
    \ ways to deal with the problem? To our surprise, <38.> of the answers is insects.\
    \ <39.> it sounds terrible to eat bugs, it’s actually a great way to end world\
    \ hunger. First of all, there are more than two thousand kinds of insects for\
    \ people to eat. These insects can be healthy foods. Also, they don’t <40.> diseases\
    \ on to us as farm animals do, eating them is quite safe. Lastly, keeping insects\
    \ does not cost as much as keeping cows and pigs, and it can save us lots of money.\n\
    \   Today, many countries are asking people to give insects a try and telling\
    \ people how eating insects can help fight world hunger. By changing the shape\
    \ and taste of the bugs, foods made with insects taste just like other foods.\
    \ It’s sure that telling a “Bug Mac” from a Big Mac is hard for people. If eating\
    \ insects is healthy for us and can save the Earth at the same time, then maybe\
    \ we can begin <41.> insects into our dishes.\n\n                            \
    \                                       ◆ hunger 飢餓  ◆ disease 疾病"
