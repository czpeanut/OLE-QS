- id: doc_113_高雄_楠梓_英語_g8s2e3_s4_43
  section: 4
  number: 43
  type: single
  page: 4
  stem: （  ）43. What is music therapy?
  options:
  - label: A
    content: Unlocking cancer inside the body.
  - label: B
    content: Using music to treat mind and body problems.
  - label: C
    content: Listening to music for pleasure.
  - label: D
    content: Sharing feelings about certain kinds of music.
  group_stem: "【A】Music had a lot of power. It calms us as well as gives us energy.\
    \ It brings thoughts and feelings to mind. It also makes new memories and unlocks\
    \ old ones.\n    So, it’s no surprise that people use music to treat mind and\
    \ body problems. The practice is called music therapy, and they use all kinds\
    \ of music and tools.\n    Music therapists treat people with certain needs. Thay\
    \ can be problems with speaking, learning, or moving. They can also be more serious\
    \ like dealing with pain, stress, or cancer.\n    Music therapists work with their\
    \ patients to meet their needs. One main way is getting the patients to create\
    \ music. That includes singing, playing an instrument, and writing a song.\n \
    \   Another way is having the patients listen to music. As it plays, the therapists\
    \ help the patients with breathing or moving exercises. They can also have the\
    \ patients share their feelings afterwards.\n    Music theraphy is all about making\
    \ people’s lives better. It’s a powerful tool, and it can help people of all ages."
