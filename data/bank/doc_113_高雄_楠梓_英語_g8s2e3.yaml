    content: Women needed to read the book “The Women and the Car.”
  - label: B
    content: Women shouldn’t join car races.
  - label: C
    content: Women could drive well like men.
  - label: D
    content: Women must drive the fastest.
  group_stem: '【C】 Who was the first one to have the idea of rear-view mirror? Dorothy
    Elizabeth was. She was the first woman driver in the car race. When the cars came
    out in the early 1900s, only a few men could drive. Women had even fewer chances
    of practicing driving. Even driving teachers were not willing to teach women to
    drive. However, at that time, a woman, Dorothy Elizabeth, learned about driving
    and joined car races. She tried very hard and wanted to show one thing to the
    world – women could drive as well as men could. In 1905, Dorothy Elizabeth set
    the record for the longest drive from London to Liverpool and became the fastest
    woman racing driver in the world. It was not easy for her because the car racing
    driver at that time had to know the ways to fix the car while drivers today only
    need to do the driving. Besides, Dorothy also taught Queen Alexandra and Royal
    Princesses how to drive. In 1909, she wrote a book, The Women and the Car. She
    said,“ Women should carry a little hand-mirror in a convenient place when driving,
    so they may hold the mirror sometimes in order to see behind while driving in
    traffic. ”This was the very first idea of the rear-view mirror. Two years later,
    because the champion won the Indianapolis 500-mile car race with the help of the
    rear-view mirror, many car racing games took place in Liverpool.


    ◆ rear-view mirror 後照鏡  ◆ willing 願意  ◆ royal 皇家的  ◆ in order to 為了  ◆ champion
