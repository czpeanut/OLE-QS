  type: single
  page: 2
  stem: 根據文章內容敘述，2016 年之前實施的人口政策最可能造成中國面臨下列何種問題？
  options:
  - label: A
    content: 勞動人口大幅增加
  - label: B
    content: 老年人口比例上升
  - label: C
    content: 新生兒性別比數值小於 100
  - label: D
    content: 人口愈集中於中國東半部。
  group_stem: "閱讀完以下文章後，回答第49-50 題：\n突冒出1 千萬人口，中國人口政策的殘酷真相\n  中國日前公布最新的人口統計資料，該數據顯示2000\
    \ 年至2010 年的出生人數約為1 億7,250 萬人，但2010 年時的人口數據資料卻顯示2000 年到2010 年的出生人數約為1 億6,090 萬人，可發現最新人口數據的出生人數多了1,160\
    \ 萬人。專家對此表示，這些多出的人數應與中國先前實施的一胎化政策有關。受一胎化政策影響，部分生育超過一名子女的家長為避免因違反政策而受罰，因此小孩出生時並未幫小孩辦理出生登記，直到小孩需要上小學時才去做登記，而這些多出來的人數有超過50％都是女孩，顯示出一胎化政策所造成中國人口結構失衡的問題。\n\
    \  2016 年，中國已停止實行一胎化政策，全面實施二孩政策，實施二孩政策的目的即為減輕一胎化政策所帶來的人口問題與經濟發展的挑戰。2021 年5 月，中國宣布開放三孩政策，出生率並未明確上升，也因政策相關的配套措施尚未齊全，民眾討論程度低落，專家指出，三孩政策可能無法提升出生率，但能使人口數產生差異的情況縮小。"
