  group_stem: 'Albuquerque International Balloon Fiesta

    Every October, Albuquerque, New Mexico, fills its skies with colorful hot air
    balloons!

    People from all over the world come to watch these beautiful balloons fly in the
    air.

    The Balloon Fiesta started in 1972 with just 13 balloons in a parking lot, but
    now there are

    over 700 balloons. It is the biggest balloon event in the world and a favorite
    for photographers.

    The Balloon Fiesta starts before sunrise. During the day, visitors can see balloons
    in all kinds of fun

    shapes—some look like animals, and some look like cartoon characters! At night,
    the burners light up the

    balloons and create a magical show. The most exciting part is the mass ascensions.
    All the balloons take off at

    the same time and fill the sky with bright colors. It’s a very beautiful sight!

    Visitors can take pictures of the balloons and join the photography contest. They
    can also join

    photography workshops to learn to take great photos!

    These hot air balloon rides are lots of fun and available for people to take.
    Many people love to try them,

    so it’s a good idea to book your ride early before the Fiesta starts!

