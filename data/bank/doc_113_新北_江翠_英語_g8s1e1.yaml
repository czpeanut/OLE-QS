  group_stem: 'Clean Up the World Weekend

    Clean Up the World Weekend is a special event that happens every year in September.
    People from all around the world come together to help take care of our environment.
    It started in 1993 and now they work with schools, businesses, and governments
    in 130 countries. They give advice and support to help people make less waste
    and not pollute the environment with plastic. You can sign up to do a Clean Up
    the World activity anytime during the year.

    During Clean Up the World Weekend, people join together to make our planet a better
    place. They do activities like picking up trash and planting trees. Clean Up the
    World wants everyone to understand how important it is to take care of our environment.
    They want us to use less plastic and not to make too much waste. By working together,
    we can make a big difference.

    Clean Up the World is an organization that helps people all over the world. They
    want us to protect our planet by taking care of it. They work with schools, businesses,
    and governments to teach us how to help the environment. We can all be a part
    of Clean Up the World by signing up for activities and doing our part to keep
    the Earth clean.

