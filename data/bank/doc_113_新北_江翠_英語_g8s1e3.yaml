- id: doc_113_新北_江翠_英語_g8s1e3_s5_36
  section: 5
  number: 36
  type: single
  page: 3
  stem: Why do people call ensets "false bananas"?
  options:
  - label: A
    content: Their fruit tastes like bananas.
  - label: B
    content: The leaves are as long as bananas.
  - label: C
    content: They smell like bananas.
  - label: D
    content: They look like bananas.
  group_stem: "(36~38)\nEthiopia’s False Bananas\n     It is very very tall, with\
    \ leaves as long as diving boards, looking like a banana tree, with fruit like\
    \ bananas, and it’s called “the tree against hunger”.  However, it’s NOT a tree\
    \ and it’s NOT EVEN a banana.  Besides, the fruit is the only part of the tree\
    \ that CAN’T be eaten.  This is why we also call Ethiopia's enset “false banana”.\n\
    \     The huge plants can grow up to 12 feet tall and are related to and resemble\
    \ the banana plant. Their short, thick fruits are filled with seeds and inedible.\
    \ The roots and stems of an enset plant can be pulped and used to make food like\
    \ bread or porridge.\n     Ensets have many unique qualities to make them perfect\
    \ for reducing food shortages. The rapid-growing plants can be spread from cuttings\
    \ and harvested during any season. They are resistant to disease and can survive\
    \ without water for up to seven years. And just 15 ensets can feed a person for\
    \ an entire year!\n     The herb has been feeding about 15 million people in Ethiopia\
    \ for many years but is largely unknown outside of the country. Researchers at\
    \ Ethiopia's Hawassa University and London's Royal Botanic Gardens think enset\
    \ could become a household staple in many parts of Africa.\n     The study showed\
    \ that enset supply could be increased and expanded to other African countries\
    \ which often have food shortages. They estimate that the \"tree against hunger\"\
    \ could feed a further 87 to 111 million people across the continent.\n\U0001F4D6\
    \ pulp 搗成泥 resistant 對…有抵抗能力的 disease 疾病 related 相關的 resemble 與…相似 expand 擴大 inedible\
    \ 不能食用的 estimate 估計 【SDGs 2】"
  shared_asset: g5_36_38
