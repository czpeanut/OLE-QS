  stem: 在因式分解過程中，下列何者正確？
  options:
  - label: A
    content: $-2x^{2} + 4x + 6$ 可先將各項提出-2 變成 $-2(x^{2} + 2x + 3)$ 再進行分解。
  - label: B
    content: $(x - 1)^{2} + 6(1 - x) + 9$ 可先改成 $(x - 1)^{2} - 6(x - 1) + 9$ 再進行分解。
  - label: C
    content: $\frac{1}{5} x^{2} + \frac{3}{5} x + \frac{2}{5}$ 可先將各項同乘以5 後成為 $x^{2}
      + 3x + 2$ 再進行分解。
  - label: D
    content: $3x^{2} + 3x - 5x + 5$ 可先分組成 $(3x^{2} + 3x) - (5x + 5)$ 再進行分解。
