  section: 6
  number: 46
  type: single
  page: 3
  stem: Which is NOT an example of Murphy's Law?
  options:
  - label: A
    content: You've missed the last train, then someone can give you a ride.
  - label: B
    content: You put on your new shoes and went to school, but it starts to rain.
  - label: C
    content: Your car broke down on the way to an important event, even though it
      was serviced on time.
  - label: D
    content: You never find your lost cellphone until you buy a new one.
  group_stem: 'Murphy''s Law


    Picture it''s breakfast time. You are going to take a bite of a nice, warm piece
    of toast. Then you drop it and it falls. You pray for it to land on the side without
    butter on. However, it lands butter-side down! This is a perfect example of Murphy''s
    Law.

    Have you noticed that it always rains when you least expect it? Or when you stand
    in line at a checkout, why does the line next to yours always seem to move faster?
    And why does your teacher always call on you when you don''t know the answer to
    a question? If it is possible for something to go wrong—this is Murphy''s Law.

    The lesson behind Murphy''s Law is to be prepared for the worst. So, if you aren''t
    ready for tomorrow''s test, don''t even think about cheating because you will
    get caught. Study hard!


     butter-side 有塗奶油的那面 notice 注意到 seem 似乎'
