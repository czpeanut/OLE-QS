  group_stem: 'Is Love Too Heavy?


    Pont des Arts is a famous bridge in Paris. Lots of artists go there to show their
    art. In 2008, people started to hang locks on the bridge railings.

    Hanging locks on the bridge railings is a popular way for people who want to show
    love to their loved ones. However, in June 2014, the heavy locks caused some parts
    of the railings to fall. Luckily, no one was hurt in the accident, but the public
    started to worry about the bridge. Then, in 2015, the "<u>love action</u>" was
    stopped. The city took down a million locks and replaced the railings with glass.
    From then on, it became difficult for people to put locks on the bridge.

