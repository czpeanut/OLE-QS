  section: 2
  number: 46
  type: single
  page: 5
  stem: 46. What is fair trade coffee?
  options:
  - label: A
    content: Coffee that is grown in cold climates.
  - label: B
    content: Coffee that comes from farmers who are paid a fair price for their work.
  - label: C
    content: Coffee that is sold at lower prices.
  - label: D
    content: Coffee that is grown with harmful chemicals.
  group_stem: "PART_(C) \nFair trade coffee is coffee that comes from farmers who\
    \ are paid a fair price for their hard work. Many \ncoffee farmers live in poor\
    \ countries where it can be difficult to make enough money for their family. Fair\
    \ \ntrade helps by making sure these farmers are paid fairly, so they can support\
    \ their families \nan\nmake their lives better. It also makes sure the farmers\
    \ are treated well, working in a safe \nworkplace and are not taken advantages\
    \ of by big companies. \nWhat’s more, fair trade coffee is good for the environment.\
    \ The farmers who \ngrow fair trade coffee make efforts to protect the land, like\
    \ growing coffee without \nharmful chemicals. This helps keep the land healthy\
    \ and protects nature for future \ngenerations. When you choose fair trade coffee,\
    \ you are making a choice to support both people and the \nplanet. \n fair 公平的\
    \ trade 交易   support 支持  take advantages of 利用  make efforts 努力     \nharmful\
    \ chemicals 有害化學製品     generation 世代"
