- id: doc_113_新北_蘆洲_英語_g9s1e3_s2_49
  section: 2
  number: 49
  type: single
  page: 6
  stem: 49. What does the term "brain rot" mean?
  options:
  - label: A
    content: A serious brain disease.
  - label: B
    content: Feeling mentally tired or lazy.
  - label: C
    content: A way to make your brain smarter.
  - label: D
    content: A type of online activity.
  group_stem: "PART_(D) \n\"Brain rot\" has been picked as Oxford’s Word of the Year\
    \ for 2024. It’s a simple way to say the feeling \nof your brain getting tired\
    \ or lazy. People often use it to talk about things that don’t help their minds\
    \ stay sharp. \nEven though it sounds a bit serious, it’s mostly used in a playful\
    \ or joking way.\nFor example, someone might say, “Scrolling through social media\
    \ all day is \ngiving me brain rot.” This means they feel like spending too much\
    \ time on apps \nfilled with silly or repetitive content is making their brain\
    \ feel tired or lazy. But it’s \nnot just about social media. People use “brain\
    \ rot” to describe other things too, like \nwatching too much TV, playing video\
    \ games for hours without a break, or even \ngetting stuck on unimportant information\
    \ online.\nThis word, “brain rot”, has become popular because it describes something\
    \ many people experience \ntoday. With so much information on our phones, computers,\
    \ and TVs, it’s easy to get stuck doing things that \ndon’t really help us feel\
    \ good or active. Saying “brain rot” is a fun way to notice this habit, but it’s\
    \ also a way \nto tell you to take a break and do something better for your mind.\n\
    In short, by choosing \"brain rot\" as the Word of the Year, Oxford highlights\
    \ how people are thinking \nabout the effects of technology on our brains and\
    \ mental health.\n scroll 滾動  social media 社群媒體   repetitive 重複的 content 內容 \
    \ describe 描述   stuck 困住的   \ndescribe 描述   highlight 強調   effect 影響   mental\
    \ 心理的 \ndisease 疾病"
  shared_asset: g2_49_50
