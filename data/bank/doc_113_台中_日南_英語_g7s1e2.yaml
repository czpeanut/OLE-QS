    content: She does not cook.
  group_stem: 'Joey: Lynn, have you tried(嚐試) Caldron? I''ve heard that Restaurant(餐廳)
    is good.

    Lynn: I have. I went(去過) there one time for Tom''s party.

    Joey: And?

    Lynn: Well, I never thought(想過; 認為).I would have to cook for myself when eating
    out.

    Joey: But it''s fun to cook your own (自己的)food.

    Lynn: I don''t see any fun in that. Besides (除此之外), I want nice food.

    Joey: So you didn''t like the food there?

    Lynn: Everything(每件事) tasted(嚐起來) the same. I mean(意思), they were all cooked in
    the same boiling(滾燙的) pot (鍋子). How could they taste different? I just kept(持續)
    throwing(丟) strange(奇怪的) things(東西) into the pot. I didn''t even(甚至) know what
    half (一半)the things were made (製作) of.

    Joey: Don''t worry(擔心). Everything should(應該) be safe to eat after a hot bath
    in the pot. And you didn''t get sick after that, right? Besides, you tried(嚐試)
    something different there. Still(仍然) a good experience(體驗; 經驗), I think?

    Lynn: I don''t think we share(分享) the same idea of good experiences.'
