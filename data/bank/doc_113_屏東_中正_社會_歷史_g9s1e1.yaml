  group_stem: "題組 (二) 請回答 24-25 題\n\n    祆教，即瑣羅亞斯德教，發源自伊朗高原，傳入西域後，當時西域各國都信仰祆教。西域的粟特人傳播到中原地區，，魏晉南北朝的北魏靈太后祭祀的胡天神，就是祆教主神。\n\
    \    到了唐朝，長安有四所祆祠，洛陽有二所祆祠。在這些祆祠中，商胡祈福，烹猪羊，琵琶鼓笛，酣歌醉舞。唐朝官署還設有管理祆教的祀官，主持祭祀。"
