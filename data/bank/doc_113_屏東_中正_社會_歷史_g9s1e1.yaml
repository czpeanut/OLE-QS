  stem: 大英博物館埃及展區內有一著名的「不幸的木乃伊」蓋板，這蓋板是屬於約西元前945 年一位上層社會女性木乃伊所有；上面繪有太陽圓盤與老鷹、伸展翅膀的女神努特、靈魂鳥、尼羅河神。相傳蓋板會為持有者帶來不幸，西元1912
    年鐵達尼號沉沒時它也恰巧被裝載在船上。請問：這蓋板代表埃及人對死亡特有的觀念，以下何者錯誤？
