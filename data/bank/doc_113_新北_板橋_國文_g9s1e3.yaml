    \ \n4. 告知你(報案者)的姓名和電話號碼(含分機)，找不到地址時可再次和你聯繫。 \n5. 告知傷病患的年齡。如果不清楚，說個大概。 \n6. 依個案可能會詢問更詳細情況，需要協助就近對傷患急救處置的話，請聽從119\
