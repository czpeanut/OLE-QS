  group_stem: "（三） \n  每個職場工作者都渴望達到目標，但現實中難免會碰到問題，讓我們產生迷茫和無奈，連帶地有了消極、焦慮的情緒。這些負面情緒容易讓人陷入一種「無從選擇」的心理錯覺，認為一切狀況都是因為「環境」「命運」「背景」所造成的宿命，而忽略了個人可以控制與改善的事情。《與成功有約》一書的作者史蒂芬．柯維（Stephen\
    \ Covey）提出了「關注圈／影響圈」。 \n  「關注圈」是指個人關注的範圍，比如國家經濟、新聞時事、個人健康、家庭關係、事業工作等等，這類事物通常超過個人能力範圍。消極被動的人習慣專注於「關注圈」，將不如人意的結果推給外在環境的問題，不斷抱怨他人，為自己的消極行為尋找藉口。相對地，「影響圈」指的是在「關注圈」內自己可以掌握的事，藉此讓事物發生改變，比如自己的處事原則、努力程度、學歷技能。當你試著投入在自己的「影響圈」，就會慢慢地將能改變的事加以擴大，許多意想不到的人事物或許就會出現轉機，因為「關注圈」內那些以前無法改變的事也慢慢縮小了。\
    \ \n  面對人生的每個逆境，我們未必都能有答案，甚至習慣將精力集中在根本無法控制的事情上。不過，從兩千多年前的哲學至近代的商管書籍，都不斷提醒我們將注意力放在自己能控制或影響的部分，在紛擾變動的現今社會，這個思想原則仍具有高度的實用價值與啟發。\
    \ \n  ——節選自經理人https://www.managertoday.com.tw/columns/view/57832"
