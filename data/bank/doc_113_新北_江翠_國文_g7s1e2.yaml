  group_stem: "詩仙李白、詩聖杜甫，是唐代知名且偉大的詩人，兩人之間曾有過交往，有相當深厚的交情。\n他們認識的時候，李白剛因楊貴妃作梗，只被視為一個「御用詩人」，不得一展抱負。他自知無法久留朝中，因此自請歸山。而杜甫，則因科考落第，四處遊歷，才在洛陽與李白相遇。論年齡，李白比杜甫大十一歲。論聲望，杜甫那時才剛剛出道，尚未為人所知，他真正「成名」也不在生前，而在死後，但李白當時已經詩名滿天下。對杜甫來說，可以說是見到心中的「神級」偶像了。\n\
    \    朋友之間論交，在彼此青雲得意的時候，不能作準。平時也還一般，難能可貴的是在對方失意，甚至窮途末路時的關懷。杜甫的夢李白和天末懷李白，都寫於聽說李白因罪而流放夜郎的時候，那時的李白，已成了罪犯逐臣，鬧不好，杜甫也可能被牽累。不知道李白是否讀過杜甫的這幾首詩，如果讀到，他大概會感激涕零了，在他跌落人生低谷時，還有這樣一位真心關懷他的朋友。\n\
    \                                                        改寫自樸月〈李白與杜甫的交誼〉"
