- id: doc_113_新北_江翠_國文_g7s1e2_s3_4
  section: 3
  number: 4
  type: single
  page: 1
  stem: 「現代的冰品，拜科學昌明之賜，固然色彩繽紛，花樣百出，但單就口味而言，比起臺灣早年的冰製品，恐怕就遜色了。」關於這段文字所強調的涵義為何？
  options:
  - label: A
    content: 現代冰品色彩上較傳統冰品略遜一籌，失色許多
  - label: B
    content: 現代和傳統冰品的差別在於色彩繽紛
  - label: C
    content: 科學使現代冰品較傳統冰品都色香味俱全
  - label: D
    content: 傳統冰品口味上較現代冰品略勝一籌。
  lesson_raw:
    title: 吃冰的滋味
    basis: 引用課文〈吃冰的滋味〉文句
- id: doc_113_新北_江翠_國文_g7s1e2_s3_5
  section: 3
  number: 5
  type: single
  page: 1
  stem: 國文課時，老師請同學各吟誦一首古人的作品，下列哪一位同學吟誦的是絕句？
  options:
  - label: A
    content: 克里希：五花馬，千金裘。呼兒將出換美酒，與爾同消萬古愁
  - label: B
    content: 布萊特：驚起卻回頭，有恨無人省。揀盡寒枝不肯棲，寂寞沙洲冷
  - label: C
    content: 愛麗絲：天街小雨潤如酥，草色遙看近卻無。最是一年春好處，絕勝煙柳滿皇都
  - label: D
    content: 弗洛倫：對酒當歌，人生幾何？譬如朝露，去日苦多。慨當以慷，憂思難忘。
  lesson_raw:
    title: 語文常識(二)
    basis: 考查近體詩絕句格律常識
- id: doc_113_新北_江翠_國文_g7s1e2_s3_6
  section: 3
  number: 6
  type: single
  page: 1
  stem: 「反義複詞」是由二個字義相反或相對的單字所構成的複詞，這樣的複詞都保留字義正反兩面的意涵，彼此對映，使語義明白清楚。如：「老少」咸宜。下列何項不是反義複詞？
  options:
  - label: A
    content: 你們真不識「抬舉」
  - label: B
    content: 主管要「賞罰」分明
  - label: C
    content: 權衡「利弊」得失
  - label: D
    content: 歷代興亡「盛衰」。
- id: doc_113_新北_江翠_國文_g7s1e2_s3_7
  section: 3
  number: 7
  type: single
  page: 2
  stem: 關於絕句選三首詩的寫作手法分析，何者不正確？
  options:
  - label: A
    content: 三首詩都是藉由景物的描寫寄託詩人內心的情感，達到情景交融的意境
  - label: B
    content: 登鸛雀樓先抒情，後寫景，藉由眼前壯闊山河的氣勢，興起精益求精、積極向上的感悟
  - label: C
    content: 黃鶴樓送孟浩然之廣陵表面敘述春天美景，實則反襯落寞心情；表面寫江水滔滔，實則象徵心中的離愁
  - label: D
    content: 楓橋夜泊先由景色起筆，透過月落、飛霜，構築蕭索冷清的畫面，和旅人內心的孤寂相互輝映。
  lesson_raw:
    title: 絕句選
    basis: 題目指明「絕句選三首詩」
- id: doc_113_新北_江翠_國文_g7s1e2_s3_8
  section: 3
  number: 8
  type: single
  page: 2
  stem: 關於以下詩句的詮釋，下列何者正確？
  options:
  - label: A
    content: 「黃河入海流」這句話是登樓遠眺，看見黃河出海口
  - label: B
    content: 「故人西辭黃鶴樓」這句話指出李白要動身前往東邊的揚州
  - label: C
    content: 「月落烏啼霜滿天」此句刻劃周遭環境的清冷，點明季節是冬天
  - label: D
    content: 「夜半鐘聲到客船」此句藉鐘聲來襯托半夜寂靜的氛圍。
  lesson_raw:
    title: 絕句選
    basis: 引用〈登鸛雀樓〉、〈黃鶴樓送孟浩然之廣陵〉、〈楓橋夜泊〉課文詩句
- id: doc_113_新北_江翠_國文_g7s1e2_s3_9
  section: 3
  number: 9
  type: single
  page: 2
  stem: 下列各句中，哪一位同學所舉詩句所描寫的季節和「煙花三月下揚州」相同？
  options:
  - label: A
    content: 溫迪：沾衣欲溼杏花雨，吹面不寒楊柳風
  - label: B
    content: 江離：乳鴨池塘水淺深，熟梅天氣半陰晴
  - label: C
    content: 迪盧克：清霜醉楓葉，淡月隱蘆花
  - label: D
    content: 刻晴：牆角數枝梅，凌寒獨自開。
  lesson_raw:
    title: 絕句選
    basis: 引用〈黃鶴樓送孟浩然之廣陵〉詩句
