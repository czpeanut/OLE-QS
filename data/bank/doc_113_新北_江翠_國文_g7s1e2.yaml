  group_stem: 固定型思維的人認為，他們的能力和智慧不在他們的控制範圍之內，面對失敗時往往害怕別人給他們貼上失敗者的標籤，因此他們不想嘗試不擅長的東西，這讓他們看起來並不聰明；而擁有成長型思維的人認為，智慧和能力可以通過努力和付出而發展起來，所謂的天份並非固定不變的，他們面對挫折時會思考從失敗中學習到什麼，因此他們喜歡面對挑戰，進而獲得成功。
- id: doc_113_新北_江翠_國文_g7s1e2_s3_31
  section: 3
  number: 31
  type: single
  page: 5
  stem: 根據本文，作者對於「要擁有自己的小孩」最有可能的抱持何種態度？
  options:
  - label: A
    content: 殷切期盼
  - label: B
    content: 如癡如醉
  - label: C
    content: 思慮再三
  - label: D
    content: 欣喜激昂。
  group_stem: "小孩可愛，大多數寫小孩的文字都在歌頌他們，讚美童心純真無邪。寫的人的出發點大約和歌頌星光、鮮花、青春……一樣，愛的是這些東西表相的純美可喜，至於童心裡頭真有些什麼，說時恐怕未必想到。\n\
    \  其實，所有成人可能有的東西，小孩的小小心裡必也一應俱全。因此小孩也是可怖的，他們是所有不可知的未來的決定者，純美的表相下隱藏無窮或善或惡的可能。\n\
    \    當然，小孩還別有可憎處。范德之教授說不曾為人父母的，沒資格寫小說，因為「還沒有真正經歷過人生的苦難」。他是我所熟知的人當中，對小孩的喧鬧最深惡痛絕的一位。蘇軾《東坡集》裡有一個對付小孩吵鬧的辦法：「塗巷小兒薄劣，為其家所厭苦，輒與數錢，令聚坐聽說古話。」為當時的街巷說書留下了一個難得的紀錄，也證明童心自來就是「不古」的，戲嬰圖裡那些肥嘟嘟、一團和氣的小孩，是千百年來大人們從來沒有實現過的夢。\n\
    \    文人當中特別喜歡小孩和特別厭苦小孩的都有。前者如寫《愛麗絲漫遊奇境記》的路易斯‧卡羅，後者如英國詩人拉肯。卡羅一生結交無數小朋友，其不朽之作《愛麗絲漫遊奇境記》便是他說給他最喜愛的小女孩愛麗絲聽的故事發展出來的。拉肯則正相反，「小孩無非自私、吵鬧、殘忍與粗俗」，生命對於他，只是一代代把悲慘傳遞下去。\n\
    \    巧合的是，卡羅和拉肯有許多相似之處，兩人都口吃，生性羞怯，有反社會的傾向。拉肯的飯桌前據說從來沒有過一張以上的椅子，因為深怕客人會留下來吃飯。卡羅有坐立不安的毛病，不善交際，只有面對小朋友時才諧趣自在。\n\
    \  兩人更大的相似是都終生未婚，固然也各自有他們的理由。但，也許，識得了孩子的真相──不管是最可愛的，還是最不可愛的──也就臨近了生命的真相。這，使人在面對由自己來延續生命的可能時，會悚然心驚，舉足不前吧。"
