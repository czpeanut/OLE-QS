- id: doc_112_高雄_大樹_國文_g7s2e1_s3_10
  section: 3
  number: 10
  type: single
  page: 2
  stem: 在生活中，我們可能會聽到某種效應或現象，如「尼可拉斯效應」是指一種善行義舉所引起的熱烈迴響 。請問下列各項效應，何者使用不正確？
