- id: doc_112_高雄_大樹_國文_g7s2e1_s3_7
  section: 3
  number: 7
  type: single
  page: 1
  stem: '〈聲音鐘〉一文中，出現很多的破折號（——）。破折號的功能用於語意的轉變、聲音的延續，或在行文中為補充說明某詞語之處，而此說明後文氣需要停頓。下列選項哪些是表示破折號用在聲音的延續上？

    甲、他們構築的不是物理的時間，而是人性——或者更準確地說——心情的時間

    乙、那一聲聲拉長的吟唱：「鹹——芭樂，鹹——甜——脆，甘——的哦！」

    丙、這時你就會強烈懷念起——譬如說，那推著手推車，一邊搖著鐵片罐子

    丁、一邊喊「阿——奇毛」的賣烤番薯的老頭了

    戊、今天你忽然聽到他改叫「冷豆花哦」——這一叫，又讓你驚覺春天的確來了'
  options:
  - label: A
    content: 丁戊
  - label: B
    content: 乙丙
  - label: C
    content: 乙丁
  - label: D
    content: 甲乙。
  lesson_raw:
    title: 聲音鐘
    basis: 題幹提及〈聲音鐘〉
