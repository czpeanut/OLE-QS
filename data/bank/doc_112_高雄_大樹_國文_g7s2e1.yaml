- id: doc_112_高雄_大樹_國文_g7s2e1_s4_1
  section: 4
  number: 1
  type: single
  page: 3
  stem: '〈紙船印象〉文中「而今早已年過而立」，「而立」代表「三十歲」，這是一種表達年齡的方式。下列是鄭弘泰一家人的簡介，請判斷下列人物的年齡，再回答問題。

    ▲姓名：鄭弘泰   年齡：知命之年   簡介：二十年前創立宏洋科技公司，奮鬥多年，如今事業蒸蒸日上。

    ▲姓名：鄭立明   年齡：年屆弱冠   簡介：高職畢業後，先以網路賣家為業，正在家中等待兵役通知。

    ▲姓名：何玉娟   年齡：年逾古稀   簡介：從事律師工作三十餘年後退休，日前擔任法律扶助基金會的志工。

    ▲姓名：鄭秀敏   年齡：花信之年   簡介：個性有點迷糊，喜歡看韓劇、唱歌、裁縫，是拼布社團的社長。

    ▲姓名：鄭福恩   年齡：志學之年   簡介：平日喜歡運動，尤其擅長打桌球，期許自己有朝一日能出國比賽，成為臺灣之光。

    依據上方描述，下列何者完全正確？'
  options:
  - label: A
    content: 這家人年紀最小的是鄭福恩，他今年16 歲，期許自己有朝一日能出國比賽乒乓球，成為臺灣之光
  - label: B
    content: 鄭秀敏個性有點迷糊，喜歡看韓劇、唱歌、裁縫，是拼布社團的社長，她今年20歲
  - label: C
