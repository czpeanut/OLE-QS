  stem: '防疫大作戰！一次看懂 居家隔離、居家檢疫、自主健康管理


    | | 居家隔離 | 居家檢疫 | 自主健康管理 |

    | :--- | :--- | :--- | :--- |

    | 對象 | 跟確診個案有接觸的人 | 具義大利、南韓、伊朗、歐洲、中東、北非、中亞等指定地區旅遊史者 | ＊申請赴港澳獲准者<br>＊通報個案但已檢驗陰性且符合解除隔離條件者<br>＊社區監測通報採檢個案<br>＊自「國際旅遊疫情建議等級」第一級、第二級國家返國者
    |

    | 方式 | 居家隔離 14 天<br>不得外出，也不可搭乘大眾運輸工具。 | 居家檢疫 14 天<br>不得外出，也不可搭乘大眾運輸工具。 | 自主健康管理
    14 天<br>盡量避免外出，如需外出應全程配戴外科口罩。 |

    | 監測方式 | 由地方衛生主管機關負責，每天主動監測2 次。（手機電子監控） | 由里長或里幹事負責，每天主動監測1 到2 次（手機電子監控） | 自主管理
    |

    | 注意事項 | ※ 共用家具或設備每日應以漂白水消毒三次。<br>※ 勤洗手、戴口罩、不要摸臉口鼻，最好有獨立房間。<br>※ 如有疑似症狀，需由衛生主管機關安排就醫，不可自行外出就醫
    | | ※ 若出現不適症狀，立即撥打1922，並依指示就醫。 |

    | 違反罰則 | 將依傳染病防治法第48 條及67 條，處新台幣6 萬至30 萬元不等罰鍰。 | 將依傳染病防治法進行強制安置；並可依傳染病防治法第58 及69
    條，處新台幣1 萬至15 萬元不等罰鍰。 | |

    資料來源：衛生福利部疾病管制署    109.03.15 版本


    依據上表，下列敘述何者正確？'
