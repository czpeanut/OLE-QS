    讀國小時有一次老師帶我們去花崗山開會。在高呼三民主義萬歲、蔣總統萬歲之後，忽然聽到「麻糬、麻糬哦」的聲音，大家一哄而散跑去買，連吃了兩個的阿雄興奮得直呼：「麻糬萬歲！」不是嗎，再沒有比又Ｑ又甜的麻糬更具體地讓我們感覺到生命的美好與珍貴的了。難怪去年冬天，他在寄回來的賀年卡上告訴我：「不知道你相不相信，身處雪地的異國，午夜夢迴，還常常聽到那麻糬、麻糬哦的聲音。」

