- id: doc_112_高雄_大樹_國文_g7s2e1_s5_6
  section: 5
  number: 6
  type: single
  page: 6
  stem: 文中一再強調麻糬的美味，但從下列哪一段敘述，無法得知麻糬是好吃的？
  options:
  - label: A
    content: 只有這卑微的麻糬，仍然鮮活、甜美地存在於這土地上人們的嘴裡、心裡
  - label: B
    content: 如果你問住在花蓮的人，他們一定會回答：「從小就有了！」
  - label: C
    content: 大家一哄而散跑去買，連吃了兩個的阿雄興奮得直呼：「麻糬萬歲！」
  - label: D
    content: 再沒有比又Ｑ又甜的麻糬更具體地讓我們感覺到生命的美好與珍貴的了。
  group_stem: '第三則：麻糬     陳黎

    如果你住在花蓮，你一定聽過一位歐吉桑，推著腳踏車在街上急促地叫賣：「麻──糬，麻糬、麻糬哦！」這聲音從什麼時候開始，《花蓮縣誌》上並沒有記載。如果你問住在花蓮的人，他們一定會回答：「從小就有了！」對我而言，他的麻糬已經成為整個童年與鄉土的象徵了。三十多年來，吃過多少個他做的這包著好吃的紅豆的麻糬，我已經數不清了，只記得小時候聽到聲音就趕緊從母親的錢包裡拿五毛錢跑出去。

    讀國小時有一次老師帶我們去花崗山開會。在高呼三民主義萬歲、蔣總統萬歲之後，忽然聽到「麻糬、麻糬哦」的聲音，大家一哄而散跑去買，連吃了兩個的阿雄興奮得直呼：「麻糬萬歲！」不是嗎，再沒有比又Ｑ又甜的麻糬更具體地讓我們感覺到生命的美好與珍貴的了。難怪去年冬天，他在寄回來的賀年卡上告訴我：「不知道你相不相信，身處雪地的異國，午夜夢迴，還常常聽到那麻糬、麻糬哦的聲音。」

    他的麻糬為什麼會這麼好吃，買的我們也不知道所以然。有人說是日據時代日本人傳授的祕方，而日本人，據說，又是從原住民族那兒學來的。百十年來，物換星移，許多在課本裡、在牆壁上、在升降旗典禮裡被大家高呼萬歲的大人物都萬歲、千古了，只有這卑微的麻糬，仍然鮮活、甜美地存在於這土地上人們的嘴裡、心裡。如果你來到花蓮，別忘了尋問那一聲聲好吃的「麻糬、麻糬哦」！'
