- id: doc_112_高雄_大樹_國文_g7s2e1_s5_1
  section: 5
  number: 1
  type: single
  page: 5
  stem: 「多多鳥在毛里西亞島優哉游哉」，「優哉游哉」的解釋應為下列何者？
  options:
  - label: A
    content: 善於游泳
  - label: B
    content: 從容自在
  - label: C
    content: 追逐遊樂
  - label: D
    content: 食物充足
  group_stem: '第一則：多多鳥

    多多鳥（Do Do）是印度洋上毛里西亞島土生的一種像鴿子的鳥。遠在人類誕生前，這種鳥已在島上度過悠長歲月。牠的祖先是鴿子，原是一種候鳥，而且可能遷移頻繁，從大陸上抵臨太平洋與印度洋中的島嶼。牠們看到果樹林，一定停下來飽餐一頓，有的鴿子留在島上，為適應島上特殊環境，體型隨之變化。導致後來生物學家要費盡腦筋才能尋出一個含糊的結論：「這些不同島上不同的怪異鳥類，其遠祖都可能是鴿子！」

    多多鳥在毛里西亞島優哉游哉，島上生物種類有限，草、種籽、漿果到處都是，使得多多鳥的食物充分，並且不斷擴大進食對象。在沒有天敵威脅下，多多鳥越長越大，竟長到50磅的重量！牠的翅膀退化了，不能飛了。而生物體格結構是互相影響的，多多鳥不能飛，翅膀萎縮，省掉了飛行必須耗費的能量，身體其他部分便膨脹起來，雙足變得又肥又大，以配合變重的身體。

    配合島嶼的生活環境，多多鳥從鴿子的形狀與習性，演化成多多鳥的形狀與習性，牠是毛里西亞島「僅此一家，別無分號」的特殊產品。

    1507年，葡萄牙人首次登陸毛里西亞島，發現了多多鳥，葡語「deudo」即是「蠢漢」的意思。因為多多鳥根本不懂得「避敵」，牠們毫無戒心，悠閒地在島上散步，一隻若被抓了、殺了，另一隻還傻傻地站在旁邊看。

    荷蘭人在1598年來時，也看到多多鳥，多多鳥也仍是親切地歡迎這些不速之客，絲毫沒有記取葡萄牙人給牠們的教訓。荷人也隨葡人叫牠們「Do Do」鳥，謔稱牠們是「笨鳥」。

    葡萄牙人、西班牙人、英國人、法國人登上毛里西亞島後，殺掉了為數可觀的多多鳥。當年歐洲海上探險隊，海上生活單調令他們失去理性，便在毛里西亞島上大肆捕殺多多鳥。除了捕殺外，水手們都習慣帶一些家畜在船上，一上岸，即放生一些家畜，如貓、狗、羊、豬、兔子等等，以便下回到島上有肉可吃。這些哺乳動物，外加每艘船都會有的老鼠，上了島嶼之後，把整個島嶼生態體系破壞，吃光草葉、踐踏鳥蛋，捕殺島上的動物，也傳來鳥的致命疾病──鳥天花，因為島上的鳥沒有免疫力，導致整批死亡。

    多多鳥便是在這種情況下，在1681年絕了種。現今每回有人提到鳥類滅絕史，頭一個點名的一定是多多鳥。英語有一句諺語是：「像多多鳥一樣地完蛋」，即是萬劫不復、無可挽回的意思。

    （改寫自洪素麗〈多多鳥的傳奇〉）'
