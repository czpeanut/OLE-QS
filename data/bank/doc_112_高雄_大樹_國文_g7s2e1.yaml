- id: doc_112_高雄_大樹_國文_g7s2e1_s5_4
  section: 5
  number: 4
  type: single
  page: 5
  stem: 下列何者屬於「傳統生物技術」的範疇？
  options:
  - label: A
    content: 細胞融合
  - label: B
    content: 釀造發酵
  - label: C
    content: 基因改造食品
  - label: D
    content: 生物複製技術
  group_stem: '第二則：生物技術

    如果有一棵植物，它的根部結馬鈴薯，地上部分則長出番茄，那該有多神奇！如果將白米、葡萄等釀造原料，放進玻璃容器內，不久之後，在瓶子裡就可得到香醇的酒，這樣不是很方便嗎？在過去，這些現象就像是神話一樣，遙不可及。現在，經由生物技術的協助，這個天方夜譚可以逐步實現。

    「生物技術」就是利用動、植物或微生物的特性、機能或成分來製造產品，用以改善人類生活的一種技術，舉凡釀造發酵、基因轉殖、生物複製、細胞融合等，都屬於生物技術的範疇，應用範圍非常廣大，包括醫學工業、食品工業、化學工業、汙染防治、能源、礦業及農業，甚至太空科技相關的宇宙工業，均會利用到這項科技。

    我們的祖先早就懂得利用生物技術。傳統的生物技術主要是用來釀造發酵食品，如醬油、味噌、酒、醋等。到了20 世紀初期，科學家已經可以用生物技術生產各種藥物。1970年以後，人類發展出遺傳工程及細胞融合，生物技術有了重大的變革。

    世界上已經有許多國家將生物技術列為科學研發的重要項目之一，臺灣也早在民國 73年將它列為未來國家重要科技，大力推廣。因此，生物技術的研究與開發必將進入新的紀元，多數人都認為21世紀就是「生物技術」的時代。

    （改寫自江晃榮《不可思議的生物科技》）'
