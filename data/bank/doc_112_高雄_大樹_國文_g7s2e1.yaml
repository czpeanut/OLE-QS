- id: doc_112_高雄_大樹_國文_g7s2e1_s5_9
  section: 5
  number: 9
  type: single
  page: 6
  stem: 根據上文，下列何者不是「灰姑娘」故事中可得到的啟示？
  options:
  - label: A
    content: 患難見真情，不離不棄
  - label: B
    content: 人非聖賢，孰能無過
  - label: C
    content: 人必自辱，而後人辱之
  - label: D
    content: 親親之殺，愛有等差。
  group_stem: "第四則：六個愛的箴言（節選） 盧希鵬\n  美國老師如何說「灰姑娘」的故事給小學生聽？首先，老師請一位同學講述「灰姑娘」的故事，很快就把故事講完了。不過，這位美國老師問，如果你是這位後母，你會不會阻止「灰姑娘」參加舞會？有小學生勇敢地說：「我會，因為我希望我的女兒能嫁給王子！」這真是個誠實的答案，原來後母不是壞人，只是她愛她的女兒超過愛灰姑娘。\n\
    \  接著老師繼續說，後母將「灰姑娘」關起來，如果「灰姑娘」從此自暴自棄，不積極爭取機會參加舞會，就不會遇上王子了。所以當你感覺沒有人愛你時，更要愛你自己，天底下沒有人能阻止你愛你自己，以及再給自己一個機會的。\n\
    \  「為什麼『灰姑娘』仍能參加舞會？」「因為得到了仙女的幫忙與老鼠朋友們的陪伴。」所以，朋友真的很重要。還有，守時也很重要，如果午夜十二點「灰姑娘」上不了南瓜馬車，就會很邋遢地站在王子前面。\n\
    \  最後，有學生問老師：「十二點以後不是所有東西都會變回原形，為什麼只有水晶鞋沒有變？」老師竟然回答，這個問題棒極了，連這麼偉大的作家都會出錯，所以你們出錯一點也不可恥。"
