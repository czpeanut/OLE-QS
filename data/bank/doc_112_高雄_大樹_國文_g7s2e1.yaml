  type: single
  page: 1
  stem: 下列「 」中的詞語，何組詞性相同？
  options:
  - label: A
    content: 把整個民族、整塊土地的生命濃縮進一句「呼喊」／當大水沖潰河堤時，村長大聲「呼喊」，村民因而逃向高處
  - label: B
    content: 以知識「漂亮」你的人生／這棟國家藝術館真是「漂亮」
  - label: C
    content: 在成長的過程，父母過高的期望「束縛」著他，他總是覺得自己不夠優秀／不要讓俗務的鎖鍊「束縛」了我們的心靈
  - label: D
    content: 他那「不凡」的成就讓鄉里同感榮耀／柔軟的處事態度可以成就「不凡」。
