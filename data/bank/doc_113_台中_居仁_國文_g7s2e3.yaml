- id: doc_113_台中_居仁_國文_g7s2e3_s5_52
  section: 5
  number: 52
  type: single
  page: 4
  stem: 下列何者是上文作者建議的旅行守則？
  options:
  - label: A
    content: 得瞭解旅行當地的節慶時間，並參與其中，才能盡興
  - label: B
    content: 應盡可能使用相同的交通方式，以免迷路而延誤行程
  - label: C
    content: 住宿時應選擇有當地特色的飯店，以體驗在地人生活
  - label: D
    content: 旅行前認真了解著名景點的歷史背景，以免走馬看花
  group_stem: "（三）\n（一）從不同的角度看世界\n    地球只有一個，只有想像力豐富的人，才有辦法感到滿足，比如說，去香港的時候不要老是想到蘭桂坊，想想西貢或是新界，或者至少找出十種閱讀香港的方式，否則，旅行很快就會變成一則令人厭倦的公式，與日常繁瑣沒有什麼不同。\n\
    （二）選擇不同的交通工具\n    每次旅行，即使同樣的路線，都可以選擇不同的交通方式，比如從基隆搭輪船去大阪，或者勇敢一點，在加州租輛在臺北時，一直想擁有的紅色敞篷跑車開到墨西哥度週末。特別的交通方式，有時會變得比旅行本身更值得紀念。\n\
    （三）注意別人的日曆\n    每個城市都有自己的功課表，幾點起床、幾點睡覺，禮拜幾歡度週末，幾月幾日狂歡過節。特地選星期天到新疆伊犁的人，必然大失所望，因為邊境商業都市到了週六關閉邊境，整個伊犁市區宛如無人死城。此般種種，只有同時懂得觀察自己日曆與別人日曆的旅行者，才能享受最飽足的旅行。\n\
    （四）讓住宿變成旅行的一部分\n    如果白天旅行已經智慮耗竭，挑戰連連，晚上就該善待自己，睡在舒適柔軟的房間，而不再是克難級的青年旅館。如果是一輩子沒閒錢的人，不妨到物價相對低廉的國家去經驗在豪華飯店被尊寵的滋味，比去造訪再多偉大的名勝都讓人感謝，會成為值得一輩子記憶的事。\n\
    (五)極力延伸你的味覺\n    既然旅行是一種短暫的脫離秩序狀態，就不急著在旅行中吃家常菜，也不要因為別人的麥當勞比較便宜就開懷猛吃，或者因為不小心帶太多泡麵，以致於完全不曉得當地食物口味。只要衛生條件過得去，當地人吃什麼就吃什麼，一餐都不要放過。\n\
    （節錄自褚士瑩〈旅行平安守則〉）"
