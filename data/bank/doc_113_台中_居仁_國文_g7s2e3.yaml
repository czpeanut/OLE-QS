- id: doc_113_台中_居仁_國文_g7s2e3_s5_56
  section: 5
  number: 56
  type: single
  page: 5
  stem: 依據上文內容以及8 項心理學效應說明，哪些可能是士人受騙的原因?
  options:
  - label: A
    content: '135'
  - label: B
    content: '678'
  - label: C
    content: '256'
  - label: D
    content: '248'
  group_stem: "（五）\n    嘉靖間，一士人候選京邸。有官矣，然久客①橐空，欲貸千金，與所故遊客談。數日報命，曰:「某中貴允爾五百。」士人猶恨少，客曰:「凡貸者例以厚②贄先。③內相性喜諛，苟得其歡，即請益非難也。」士人拮据，湊貸器幣，約值百金，為期入謁及門。堂軒巨麗，④蒼頭、廬兒皆曳綺縞，兩壁米袋充棟，皆有「御用」字。久之，主人出，壯橫肥，以兩童子頭抵背而行，享禮微笑，許貸八百。廬兒曰:「已晚，須明日。」主人可之。士人既出，喜不自勝，客復屬耳:「當早至，我俟於此。」及明往，寥然空宅，堂下煤土兩堆，皆袋所傾。問主宅者，曰:「昨有內相賃宅半日，知是誰何?」客亦滅跡，方悟其詐。\n\
    ①橐:ㄊㄨㄛˊ，袋子②贄:初次見面送的禮物③內相:宦官④蒼頭、廬兒:僕役\n(馮夢龍《智囊》)\n\n心理學效應\n1. 達克效應:自認為很聰明，不會上別人的當。\n\
    2. 隧道效應:因急迫而只就當下訊息做決定，思慮不周。\n3. 錨定效應:接觸新事物的第一印象，將影響後續的判斷。\n4. 需求心理:真實需求遭人利用而受騙。\n\
    5. 同情心理:同情他人遭遇而受騙。\n6. 恐懼心理:害怕政府、法律而受騙。\n7. 從眾心理:不加思索跟從眾人的意見、行動。\n8. 貪多心理:想得更多、貪小便宜而受騙。"
