- id: doc_113_台中_居仁_國文_g7s2e3_s5_50
  section: 5
  number: 50
  type: single
  page: 4
  stem: 依據作者的評析，下列何者並非〈寒食帖〉這幅書法作品的特色？
  options:
  - label: A
    content: 運筆自然流暢
  - label: B
    content: 字跡豪放有力
  - label: C
    content: 筆勢反映心境
  - label: D
    content: 風格反璞歸真
  group_stem: "（二）\n    蘇東坡年輕時，字寫得很漂亮，〈寒食帖〉是在人生摔一大跤後出來的，此時的他就不在意美，而是寫得很自然。\n    蘇軾貶黃州之後，心境有很大的變化，似乎青年時代的自負驕矜一掃而空，代之而起的是一種對生命更謙遜深沉的領悟；蘇軾最好的作品，如大家熟悉的〈赤壁賦〉、〈念奴嬌〉都創作於這段時期。〈寒食帖〉就是他在貶到黃州的第三年(1082)寒食節寫的詩稿。\n\
    \    〈寒食帖〉包括兩首詩，第一首是：「自我來黃州，已過三寒食。年年欲惜春，春去不容惜。今年又苦雨，兩月秋蕭瑟。臥聞海棠花，泥汙燕支雪。闇中偷負去，夜半真有刀。何殊病少年，病起頭已白。」蘇軾身遭大難，對人也有一種空幻虛無的感慨，因此文學的詩句平白自然，沒有任何造作，同樣的，書法的用筆也返璞歸真，一任率性自然，看來隨意自在，毫不用力，卻是中國書法最高的意境。\n\
    \    第二首在字跡上寫得更為隨意流暢：「春江欲入戶，雨勢來不已。小屋如漁舟，濛濛水雲裡。空庖煮寒菜，破灶燒溼葦。那知是寒食，但見烏銜紙。君門深九重，墳墓在萬里。也擬哭途窮，死灰吹不起。」「銜紙」二字完全懸腕中鋒，筆勢峭厲，和「破灶」的鈍拙形成對比，是蘇軾書法出神入化的表現。向君王盡忠無門，向祖先墳墓祭掃盡孝也不可行，蘇軾看到烏鴉啣著墓地中的冥紙，心情彷彿比晉代窮途而哭的阮籍更為絕望，已是一片死灰。\n\
    \    〈寒食帖〉書法的用筆返璞歸真，一任率性自然，看來隨意自在，毫不用力，卻是中國書法最高的意境。蘇軾青年時代的自負驕矜已不復見，代之而起的是一種對生命更謙遜深沉的領悟。\n\
    (改寫自蔣勳〈蒼涼的獨白書寫——寒食帖〉)"
