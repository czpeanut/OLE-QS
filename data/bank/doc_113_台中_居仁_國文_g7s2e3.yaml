- id: doc_113_台中_居仁_國文_g7s2e3_s5_48
  section: 5
  number: 48
  type: single
  page: 3
  stem: 根據上文，下列何者最符合偉大的詩人於創作時抱持的態度？
  options:
  - label: A
    content: 工欲善其事，必先利其器
  - label: B
    content: 一沙一世界，一花一天堂
  - label: C
    content: 俱懷逸興壯思飛，欲上青天攬明月
  - label: D
    content: 寶劍鋒從磨礪出，梅花香自苦寒來
  group_stem: "（一）\n    許多人以為，寫作就是要寫出一些平常不會發生的特別之事；稿紙上的內容要讓人驚詫、使人眼界一開，如果是平平淡淡的老生常談，那麼不寫也罷！但我們一般人生活固定，早出晚歸，日日同坐一張桌椅同行一條道路，與整個城市的其他人共享相同的氣候，共同聽閱一樣的新聞，除了晚上作不同的夢，大多數的經驗可能都是雷同的，所謂「太陽底下沒有新鮮事」，我們要怎麼找到使人耳目一新的東西來寫作呢？\n\
    \    所以許多人會有另一個錯覺，寫作的人必須經常去世界各地「找靈感」，或是本身擁有不同於一般人的特殊身分或經歷，如此他才能寫出一些不尋常的東西。我們不能否認增廣見聞有益於寫作，出身不凡亦可能造就特殊的才華，但是在寫作上真正重要的，其實不是遇到了什麼難得的事物而將它記錄下來，而是能在眾人皆以為的平凡中，看見其內在最不尋常之處。英語詩人奧登曾說：「一個平庸的詩人與偉大的詩人不同之處是：前者只能喚起我們對於許多事物既有的感覺；後者則能使我們如夢初醒地發現從未經驗過的感覺。」\n\
    (摘錄自徐國能〈平凡事．不凡心〉)"
  tags:
    chapter:
      publisher: null
      book: 七下
      subject: 國文
      code: null
      title: null
      chapter: null
    textbook: 七下 第3次段考範圍
    labeled_by: ai
