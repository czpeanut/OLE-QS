  stem: '下列選項，何者最符合下文的意涵？


    「若①思通楷則，少不如老；學成規矩，老不如少。思則老而愈妙，學乃少而可②勉。勉之不已，抑有三時；時然一變，③極其分矣。至如初學分佈，但求平正；既知平正，務追險絕，既能險絕，復歸平正。初謂未及，中則過之，後乃通會，通會之際，人書俱④老。」

