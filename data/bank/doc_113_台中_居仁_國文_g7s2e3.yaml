  group_stem: "（四）\n    包拯徙知端州。端土產硯，前守緣①貢，率取數十倍以②遺權貴。拯命制者才足貢數，歲滿，不持一硯歸。與人不苟合，不偽辭色悅人；平居無私書，故人、親黨皆絕之。雖貴，衣服、器用、飲食如布衣時。嘗曰︰「後世子孫仕官，有犯贓者，不得放歸本家，死不得葬③大塋中，不從吾志，非吾子若孫也。」\n\
