- id: doc_113_台中_居仁_國文_g7s2e3_s4_37
  section: 4
  number: 37
  type: single
  page: 2
  stem: '以下為課文摘述，請依照①~④之順序，排列出陳之藩的思維變化：

    ①在外國友人家吃飯時提醒自己謝飯，認為是一種不同的風俗儀式，忘或不忘也沒有太大的關係。

    ②他們(祖父母)明明知道要滴下眉毛上的汗珠，才能撿起田中的麥穗，而為什麼要謝天？

    ③我就想，如此大功而竟不居，為什麼？像愛因斯坦之於〈相對論〉，像我祖母之於我家。

    ④因為需要感謝的人太多了，就感謝天罷。'
  options:
  - label: A
    content: 敷衍塞責→感到好奇→反對傳統→昇華謝天
  - label: B
    content: 肯定謝天→反對迷信→困惑質疑→接納觀點
  - label: C
    content: 不以為意→疑惑不解→得到領悟→肯定謝天
  - label: D
    content: 不屑一顧→領悟道理→肯定想法→重新定義
  lesson_raw:
    title: 謝天
    basis: 題幹提及作者「陳之藩」，內容摘述〈謝天〉課文
  tags:
