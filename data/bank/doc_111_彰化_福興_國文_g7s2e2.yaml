- id: doc_111_彰化_福興_國文_g7s2e2_s5_1
  section: 5
  number: 1
  type: single
  page: 2
  stem: 從何處可以看出這一棵神木有厚勁的生命力？
  options:
  - label: A
    content: 茂密的枝葉
  - label: B
    content: 傲然的姿態
  - label: C
    content: 斑駁的枝幹
  - label: D
    content: 樹頭的新枝。
  group_stem: '神木，一棵兩千八百年高齡的紅檜，斑駁的枝幹上雖然鏤刻著它蒼老的歲月，但是挺拔在樹頂上的那些嫩綠的新枝卻正足以顯示著它生命的潛力。神木是以傲然的姿態兀立在眾樹之間，枝葉的搖擺乃是一種關懷的姿態，因為滿山遍野的眾樹就好像是它的子孫。

    舉首遠眺，極目處是一片青青的山巒，原始的樹棵，緊緊的簇擁著每一個峰巔。對於那些不分旱澇都一個勁兒保持旺茂的原始樹木來說，生命的意義，就是不斷的生長，不斷的成熟，一代接一代的，默默的，充實起一串綿長而豐盈的歲月。

    (魯蛟鄉景)'
