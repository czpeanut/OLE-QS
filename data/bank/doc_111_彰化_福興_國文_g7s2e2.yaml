  stem: 「野生動物會隨著環境變化而發展出新的生活方式。城市中的灰色松鼠比鄉下的較快對威脅產生反應，牠們不吱吱叫驅趕敵人，而是垂下尾巴來警示敵人。」根據這段文字，下列敘述何者最不恰當？
