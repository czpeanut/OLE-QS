  group_stem: '我急匆匆地趕往街角的那間百貨商店，心中暗自祈禱商店裡的人能少一點，好讓我快點買到給孫兒們的耶誕禮物。沒想到一踏進商店，不禁暗暗叫苦，店裡的人比貨架上的東西還多。

