  group_stem: "以下小說節錄自鍾肇政《魯冰花》，主角古阿明是來自貧困茶農家庭的小學生。\n古阿明昨天在茶園裡畫的作品，郭雲天認為是近一個月以來最好的一幅，也是最使他滿意的一幅。\n\
    \    古阿明畫的是茶蟲。那真是個奇異的幻想世界。在一面圖案化的綠色畫面上，各種各樣的大小茶蟲畫得猙獰可怖。此外還有幾個人物──古阿明曾向郭雲天說那三個人是姊姊，小弟弟和他自己。茶蟲有的在拼命地啃茶葉，有的在吃畫面上的一個人物手裡捧著的飯，有的在吃另一個人物的衣服。古阿明那小小的心靈裡的憤恨與恐懼，靠著他那獨特的，大膽的筆觸，毫無遺漏地表露出來。\n\
    \    郭雲天只有暗嘆的份兒，幾乎沒有提供意見的餘地，因為古阿明一開始作畫，就好像已忘了周遭的一切，連他所尊敬的師長在身旁也都似乎渾然忘卻，手不停揮地畫下去。直到畫好後，郭雲天才得到機會提出他的修改意見。他指示他哪裡的顏色還不夠鮮明，哪一筆線條還要加強。\n\
    \    事實上，郭雲天的意見也不多。他不忍破壞掉那純潔的心靈裡所流露出來的，敏銳得就如電流一般的感覺。甚至他明知畫裡的一條蟲在生卵是錯誤的，也還是讓他保持原來的面目。他認為與其改正過來，倒毋寧這個樣子較合他的年歲。"
