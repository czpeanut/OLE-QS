- id: doc_113_高雄_英明_國文_g7s1e3_s2_47
  section: 2
  number: 47
  type: single
  page: 6
  stem: 「更多的時候，我們看到的是，一個相貌平凡的人，因著內在的豐厚，讓人願意和他親近，甚至覺得對方愈來愈富魅力了。」這段話是在說明何種道理？
  options:
  - label: A
    content: 努力學習各種才藝，才能讓自己成為受人歡迎的人
  - label: B
    content: 以誠待人、充實自我，才能真正獲得他人肯定
  - label: C
    content: 內在比外在重要，所以外表可以全然不在乎
  - label: D
    content: 美麗需要努力經營，花錢買保養品和化妝品是必要的。
  group_stem: '我認識一個漂亮寶貝，才兩年不見，奇怪的是：她怎麼變醜了？

    是因為青春的無法久留嗎？想當年我第一次見到她時，真有「驚豔」之感；只是，美麗果真這麼不能耐久嗎？後來，我和朋友在閒談中提起她，大家原都相熟的，朋友也說，如今的她比從前失色太多了。

    怎麼會這樣呢？

    朋友說：「她只是個花瓶，她也樂於只成為一個好看的花瓶。仔細追究起來，她沒有任何才藝，也毫無學習的意願，甚至連對工作也不熱中。關心的是自己外表的打扮，時間久了，因為內涵的欠缺，也使她愈來愈言語乏味，少了引人入勝的特質。」

    朋友的話算是持平之論。只是，我還是覺得多麼可惜！上天曾給了她比別人更多的厚愛，卻使她成為一個驕縱的人，少了謙卑的心。據我所知，她待人冷漠，自視甚高，以為人人都該因著她的美麗而聽命於她的差遣，卻不知人和人的往來，所謂的漂亮也不過是在素昧平生時占了一點優勢，絕非永遠。認識以後，之所以能成為莫逆於心的好友，是在於人格特質的吸引。比如：善良、誠懇、熱心、同情、正義、關懷、敬業……卻已非關外貌了。更多的時候，我們看到的是，一個相貌平凡的人，因著內在的豐厚，讓人願意和他親近，甚至覺得對方愈來愈富魅力了。

    我依然為她感到惋惜。也許，上天是公平的吧。有誰能十全十美呢？不勞而獲的事畢竟少有，美麗也一樣需要努力經營，才能恆久煥發光采；何況，豐富的內涵比起外在的皮相深刻多了。

    原來，美和醜也存乎一心。你希望自己愈來愈美嗎？那麼，請不斷地在自己的內心注入更多善意、真摯和愛。 (琹涵 美與醜)'
