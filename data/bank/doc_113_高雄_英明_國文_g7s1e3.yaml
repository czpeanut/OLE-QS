  section: 2
  number: 41
  type: single
  page: 5
  stem: 對於「STOP 安全守則」的訊息，何者敘述正確？
  options:
  - label: A
    content: 將交友的守則簡化為一個口訣，以收宣導成效
  - label: B
    content: 「STOP」，暗指網路結交朋友都是危險的
  - label: C
    content: 「STOP」口訣僅提供交友時應避免的行徑
  - label: D
    content: 交友守則有前後優先順序，「S」先於「P」。
  group_stem: '根據新聞報導，因網路交友衍生的社會事件層出不窮，使得「網路交友」與「危險」之間似乎畫上等號。其實網路交友和現實生活中一樣，都應以「誠信」為原則。只是在網路世界裡靠著聊天的內容或是交換的照片，很難判斷對方是否真的和我們腦海中塑造出的形象一致，所以我們在網路交友時更應以「安全」為前提。以下是教育部建議的STOP
    安全守則，請閱讀並回答41-42 題。


    | S | T | O | P |

    | :--- | :--- | :--- | :--- |

    | **Secret，祕密**<br>不要在網路上留下姓名、電話、地址等可能洩露個人身分的資料。 | **Tell，告知**<br>要讓家長知道自己交網友的事實。如果聚會，也要能告知對象、時間、地點。
    | **Open，公開**<br>要交友要公開、地點要公共、時間要合理，如果有不合情理之處，就要避免。 | **Person，對象**<br>要互動過程中，應觀察對方的言談、態度，如果網友要求你提供私密的資訊或是出現不尋常的行為，就應該提高警覺。
    |


    （改寫自 教育部 全民資安素養網）'
