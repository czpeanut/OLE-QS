- id: doc_113_新北_江翠_國文_g8s2e3_s1_37
  section: 1
  number: 37
  type: single
  page: 5
  stem: 文章提到若過度依賴AI 會帶來學習後遺症，下列選項何者為非？
  options:
  - label: A
    content: 模糊作者身份，影響學術誠信
  - label: B
    content: 提升學生的就業能力與提供安全的資訊來源
  - label: C
    content: 影響批判性思考與解決問題的能力
  - label: D
    content: AI 可能提供錯誤資訊，對學習產生負面效果
  group_stem: "(乙) 「0 分？」休士頓大學學生伯瑞爾（Leigh Burrell）看著自己的作業成績感到不可思議，這項用了整整兩天精心撰寫的作業，只因被教授懷疑使用AI\
    \ 而被打了0 分。她不得不提交15 頁的PDF 截圖和93 分鐘的螢幕錄影來自證清白。\n波士頓東北大學的普爾弗斯也有同樣的擔心。他曾經對自己的寫作能力非常自豪，但現在，他在交出所有作業前，都會使用AI\
    \ 檢測工具先檢查，以確保自己不會被誤判。「這有點煩，但就是2025 年的日常。」他說。\n    然而，AI 檢測工具的準確率讓守規矩的學生陷入恐慌。美國馬里蘭大學一項最新研究顯示，上述工具平均有6.8%的誤判率。寫作輔助工具Grammarly\
    \ 的教育主管麥克斯韋爾說：「現在已經變成了一種『寫作警察狀態』。學生們不僅要寫完作業，還要證明作業真的是自己做的。」Undetectable AI 的聯合創始人萊奧斯（Devan\
    \ Leos）更指出了這種現象的荒謬之處，有時候，學生只因學習了「更正式」的寫作方式就被懷疑靠AI 寫。\n    對此，部分學校已開始停用AI 檢測工具。加州大學柏克萊分校教學中心執行主任柯恩（Jenae\
    \ Cohn）解釋：「雖然我們理解AI 檢測可能會讓部分的老師感到安心，但我們注意到過度依賴科技可能會傷害師生關係。」許多老師、專家希望學生與AI 保持距離的擔憂也是其來有自。因為過度依賴AI\
    \ 可能帶來一系列的學習後遺症。\n首先，是學術誠信的問題，AI 生成的內容模糊了作者身份的界限。\n第二，AI 聊天機器人會出現幻覺，對資訊的正確性與品質也不穩定，而這些不正確或誤導性的答案，可能會對學習成果產生負面影響。\n\
    第三，過度依賴AI 可能會阻礙學生的批判性思考和解決問題的能力，因為他們習慣性地尋求立即答案，而非真正理解內容。換句話說，當我們過度依賴AI 處理日常思考任務時，我們可能正在弱化自己最寶貴的「認知」肌肉，因為我們剝奪了自己練習判斷力和加強認知能力的寶貴機會。\n\
    \    但情況並非完全悲觀，因為要成為一名優秀的「AI 詠唱師」，也需要批判性的思考能力。例如一個化學老師在生成實驗圖解說明時，他需要基於自己的知識，發覺圖片中缺少了什麼關鍵，通過修改提示詞，獲得更好的成品。\n\
    \    研究發現，人們使用AI 工具時，批判性思考的程度，往往取決於使用者對AI 工具的信任程度和任務的重要性。當使用者認為任務次要或風險較低時，他們傾向於接受AI\
    \ 的輸出而不加質疑。例如，撰寫社交媒體貼文或會議記錄摘要時，他們本來較少運用批判性思考。\n但如果這成為常態，將可能導致一個危險的循環：批判性思考能力因缺乏日常練習而衰退，當真正需要這些能力時（如高風險決策），使用者可能已經失去了這種思考習慣。\n\
    \   面對這些挑戰，教育工作者開始探索更有效的教學和評估方式。有教師採用「口頭詢問」策略，要求學生解釋論文中使用的特定詞彙或論點；有的大學申請顧問，則要求學生在共享的Google\
    \ 文檔中撰寫文章，以便透過版本歷史查證寫作過程。\n                                     (節錄 學生習慣用ChatGPT\
    \ 寫作業的後遺症是什麼 王貞懿 編譯)"
