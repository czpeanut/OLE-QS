  group_stem: '(丙)  昔孔子欲居九夷，人以為陋。孔子曰：「君子居之，何陋之有？」守仁以罪謫龍場，龍場古夷蔡之外，於今為要綏① ，而習類尚因其故。人皆以予自上國往，將陋其地，弗能居也。而予處之旬月，安而樂之，求其所謂甚陋者而莫得。獨其結題鳥言，山棲羝服，無軒裳宮室之觀，文儀揖讓之緙②
