- id: doc_113_新北_江翠_國文_g8s2e3_s1_35
  section: 1
  number: 35
  type: single
  page: 5
  stem: 根據上文，下列敘述何者有誤？
  options:
  - label: A
    content: 德國 杜賓根大學的研究團隊，用麥塊遊戲做為實驗場，主要想了解人類到底怎麼學習最有效
  - label: B
    content: 麥塊遊戲的原始設計者吳查理，在請玩家試玩麥塊遊戲時，意外發現它可以測出誰最有適應力
  - label: C
    content: 麥塊遊戲這款人人都能當創世神的方塊世界裡，玩家可以蓋房子、打殭屍，還可測出學習力
  - label: D
    content: 普林斯頓大學的認知科學家認為，人類不完全靠獨立摸索學習，人類的學習策略具有多樣性
  group_stem: "(甲) 在麥塊（Minecraft）這款人人都能當創世神的方塊世界裡，除了蓋房子、打殭屍，竟然也能挖出人類學習的祕密？最近一群認知科學家就把這款遊戲改造了一下，發現：原來會不會變通、懂不懂得何時模仿別人，才是學習的制勝關鍵！德國\
    \ 杜賓根大學的研究團隊，用麥塊遊戲做為實驗場，找來 128 位玩家當做研究對象，測試人類到底怎麼學習最有效，這項研究發表在《自然．通訊》期刊。\n   「我們最關注的是：人類的社會學習到底有多特別？」主導這項研究的科學家吳查理說，他在杜賓根大學帶領人機認知實驗室。雖然很多動物也會互相學習，但人類似乎有更多「策略」可以運用，這也是這次實驗的核心精神。\n\
    改變策略才是高手表現\n   在這個特製版本的麥塊遊戲裡，玩家需要炸開一塊塊方塊，尋找藏在裡面的南瓜或西瓜。這些「戰利品」會發出藍色的光圈，讓其他玩家看到你在哪裡找到寶藏。遊戲分成兩種版本：一種是獎勵隨機分布，另一種則是獎勵集中，找到一顆西瓜代表附近可能還有更多。\n\
    \   玩家有時單打獨鬥，有時四人小組合作。最厲害的玩家會根據遊戲環境改變策略ˇˇ例如在獎勵集中的場景裡，他們會待在同一區域「蹲點」；獎勵分散時，則懂得轉移陣地。而在多人模式中，他們還會觀察誰挖得多，聰明的玩家會觀察成績好的隊友並加以模仿。後續的數學模型分析指出，個人學習與社會學習會互相強化，形成「雙核心智慧策略」。簡單來說，就是一邊自己摸索、一邊抄對的對象，才是最佳學習法。\n\
    聰明人不是死讀書，而是懂得切換模式\n   過去我們常以為學習方式不是「抄別人」就是「靠自己」，但研究顯示，人類其實是在這兩者之間靈活切換，而且「能切換得快」的，就是最終得分最高的玩家。吳查理說：「那些最靈活、最懂得變通的人，在這場遊戲中表現最好。」\n\
    \   普林斯頓大學的認知科學家維雷茲認為，雖然遊戲裡的資源是零和競爭（別人拿了你就沒得拿），但現實生活中，很多知識是可以「合作放大」的。研究結果也打破了過去非黑即白的觀點。維雷茲說：「我們過去常以為人們學習的方式，不是完全模仿別人，就是完全靠自己探索，好像開關一樣。」但這項研究顯示，人類的學習策略遠比想像中更複雜多元。\n\
    \   能夠靈活調整策略，無論是靠自己學習還是從他人身上學習，正是預測一個人是否會表現優異的最佳指標。吳查理認為，表現最好的人，就是那些最具適應力的玩家。透過觀察與學習他人，創造出新點子、發現新知識。這也是人類社會進步的一大關鍵。\
    \               —鄭靜琪《科學人》〈你怎麼挖南瓜，透露了你的人生策略〉"
