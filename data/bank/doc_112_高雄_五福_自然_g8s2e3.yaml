- id: doc_112_高雄_五福_自然_g8s2e3_s3_49
  section: 3
  number: 49
  type: single
  page: 8
  stem: 下列何者不是聚合物？
  options:
  - label: A
    content: 對苯二胺
  - label: B
    content: 克維拉纖維
  - label: C
    content: 纖維素
  - label: D
    content: 蛋白質
  group_stem: '克維拉（Kevlar）化學名為「聚對苯二甲醯對苯二胺」，它是美國杜邦公司於1965 年推出的一種芳香聚醯胺類合成纖維，由波蘭裔美國女化學家斯蒂芬妮·克沃勒克發明。

    克維拉（Kevlar，別名：凱芙拉、凱夫勒、凱庫勒、功夫龍…等）纖維的大分子剛性極佳，鏈纏結少，取向度、結晶度高，這種結構使纖維表現出良好的強度、模量及熱穩定性。具有極佳的抗拉性能、耐屈折、耐疲勞、耐腐蝕，膨脹係數小，其強度為同等質量鋼鐵的五倍，其密度只有鋼絲的1／5，可耐高溫。廣泛用於船體、飛機、自行車輪胎、軍用鋼盔、防彈背心等。為何一個有機物的強度能高過鋼鐵五倍？

    首先我們來看看克維拉的合成。它是由對苯二胺與對苯二甲醯氯經化學反應後所形成的「聚對苯二甲醯對苯二胺」有機物，反應式如下：


    而它之所以堅硬的原因是其中「苯環（六角形之環狀結構）」的結構剛性較強，而且是平面結構不能夠轉動，能為分子帶來一定程度的剛硬性，因此鏈纏結情況就少。並且在形成高分子化合物後，每一個「對苯二甲醯對苯二胺基本單元」的H
    會與鄰近的「對苯二甲醯對苯二胺基本單元」的O 形成連結（如右圖中圈起來的部分），更大大提升了克維拉的強度，這與自然界蛋白質結構穩定的原理相同，都是應用此連結模式來增加穩定性及結構強度。

    文章改編自『泛科學--神奇纖維克維拉』'
  shared_asset: g3_49_50
  assets:
