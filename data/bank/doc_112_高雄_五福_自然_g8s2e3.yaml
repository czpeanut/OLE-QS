  stem: '安權懋、寅水姬和金素熙三人看到質量相同且塗成相同顏色，皆為實心的銅球和軟木球（銅球密度為8.9 g/cm$^{3}$、軟木球密度為0.25 g/cm$^{3}$），兩球一起放在水中，結果一沉一浮，三人對此現象有不同的說法。

