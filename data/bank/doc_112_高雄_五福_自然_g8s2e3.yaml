    寅水姬說：銅球所受水的浮力為銅球體積乘上水的密度，所以浮力小於銅球重量，而撐不住沉於水底。

    金素熙說：雖質量相同但軟木球的密度較銅球小所以體積較銅球大，而為浮體，其浮力剛好等於球重。

