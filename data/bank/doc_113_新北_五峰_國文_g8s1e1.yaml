    content: 再次蟬聯奧運羽球雙打冠軍的臺灣之光李洋和王麒麟。
  group_stem: "奧運獎牌是無價的，但各國針對奧運奪牌祭出的獎勵金各有不同，還有些國家提供終生啤酒喝到飽、香腸吃到飽的獎勵。你知道最慷慨的是哪個國家，又有哪些先進國家完全不提供奪牌獎金嗎？\n\
    \   《FOX Sports》估計，根據Adidas 激勵獎金計畫，澳洲金牌得主只要賽後仍從事該項競技運動，可獲得2 萬澳元獎金（新臺幣48 萬元）。\n\
    \    從獎金額度來看，新加坡很慷慨。星國賞給每位金牌得主100 萬新幣，相當於新臺幣2335 萬元。銀牌得主將獲得約新臺幣1182 萬元，銅牌獎金約新臺幣588\
    \ 萬元。\n    喬治亞的慷慨程度也令人意外，政府祭出的金牌獎金多達新臺幣3778 萬元。喬治亞總理去年通過敕令，不替東京奧運增加奪牌獎金，維持既有額度。\n\
    \    有些國家不只給獎金，像南韓獎牌得主可以免當兵，德國提供終生免費的啤酒，白俄羅斯則提供香腸吃到飽等誘因。\n    運動強權美國給的獎金沒有特別高，約新臺幣79\
    \ 萬元，不過角力等運動項目會自行提供加碼獎金。至於英國、挪威、瑞典和克羅埃西亞，則不提供任何現金獎勵。\n    堂堂英國為何不提供奪牌獎金？英國奧委會發言人的說法是，獎金不會大幅刺激運動員奪牌的動力，因為促使運動員努力的不是錢，而是對運動的熱愛、投入和付出，以及在運動最高殿堂上拿出最佳表現以求不辱使命和國家尊嚴的榮譽感。\n\
    \    那臺灣呢？奧運屬於一等比賽，教育部2015 年修正《國光體育獎章及獎助學金頒發辦法》，把奧運奪金的獎助學金從1200 萬元提高為2000 萬元，銀牌和銅牌維持700\
    \ 萬元和500萬元。\n    也就是說，若挺進8 強，至少可以領到90 萬元。以第5到第8 名來說，第7、8 名獲90 萬，第5、6 名可獲150 萬。一旦拚進4\
    \ 強，第4 名拿300 萬，銅牌、銀牌、金牌分別是500萬元、700 萬元、2000 萬元。\n        （樂羽嘉 節錄自〈奧運獎金比一比 臺灣算多嗎？〉）"
