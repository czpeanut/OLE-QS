- id: doc_113_基隆_銘傳_自然_g8s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '彥勳在三個相同燒杯中，各加入質量 80 g、溫度 25℃ 的甲、乙、丙三種不同的溶液，其中甲杯是水。放在鐵架陶瓷纖維網上，用相同的


    | 加熱時間 / 溶液 | 0 分鐘 | 1 分鐘 | 2 分鐘 | 3 分鐘 | 4 分鐘 | 5 分鐘 |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 甲 | 25.0℃ | 35.0℃ | 45.0℃ | 55.0℃ | 65.0℃ | 75.0℃ |

    | 乙 | 25.0℃ | 33.0℃ | 41.0℃ | 49.0℃ | 57.0℃ | 65.0℃ |

    | 丙 | 25.0℃ | 30.0℃ | 35.0℃ | 40.0℃ | 45.0℃ | 50.0℃ |


    穩定熱源上加熱，可得到如表的資料。則下列敘述何者正確？'
  options:
  - label: A
    content: 加熱 2 分鐘後，甲杯吸熱最多
  - label: B
    content: 加熱 2 分鐘後，乙杯吸熱 1600 卡
  - label: C
    content: 丙杯的比熱隨溫度增加而增加
  - label: D
    content: 熱源傳熱方式只有熱傳導。
