  type: single
  page: 4
  stem: 已知碳和矽皆位於週期表第 14 族，請根據碳酸鈣和硫酸化學式推論下列何者最能表示矽酸。
  options:
  - label: A
    content: $\text{H}_{2}\text{SiO}_{4}$
  - label: B
    content: $\text{HSi}$
  - label: C
    content: $\text{H}_{2}\text{SiO}_{3}$
  - label: D
    content: $\text{SiO}_{2}$。
  group_stem: '[閱讀 B]

    根據科學報導，不起眼的矽砂（主要成分二氧化矽）化身成矽晶片（矽 $\text{Si}$），撐起了台積電一個人的武林。矽晶片製作流程大致如下：矽砂先經過物理化學方法提煉長晶成純度極高的單晶矽，再透過最硬的金剛石研磨、拋光、切片形成一片片的矽晶圓，再將矽晶圓經過電路設計、感光劑塗佈、曝光、微影、蝕刻和封裝測試等等多重步驟，最終製成一顆顆的矽晶片。其實，台積電主要是經營晶片代工，其他部分也需台灣半導體相關產業分工完成，這些公司是不容小覷的螺絲釘。

    矽並不是最好的材料，但由於他是很好的絕緣體，因此可以透過繁複的手續將複雜的電路一層層堆疊上去而不致於短路，使得電路可以微小化，功能最大化，在 3C 及 AI
    盛行的時代裡，扮演舉足輕重的角色。

    還有，生活中常見的水晶，也與矽砂息息相關。無色透明的水晶，就是俗稱的石英，在地底下經過高溫高壓慢慢長成純二氧化矽的結晶，紫水晶則是長晶中參雜了鐵元素的水晶，將紫水晶經過加熱之後，會變成深淺不同的黃水晶，作為祈福生財的象徵。

    除此之外，植物學家也注意到自然環境中的矽經風化作用後，會形成矽酸溶於水中，再被植物吸收，以二氧化矽沉積的形態留存在植物體內，從葉緣、表皮細胞到維管束都具有無色透明二氧化矽晶體的累積，透過這些晶體可聚光至葉綠體上半區域，增加光合作用的效率。不論是半導體、礦石還是植物，二氧化矽還真是無所不在呢！！

    請根據上文及所學的知識回答 36~40：'
