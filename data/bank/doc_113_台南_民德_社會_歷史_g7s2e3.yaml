  section: 1
  number: 34
  type: single
  page: 4
  stem: 根據資料一的說法，下列哪個文案符合「黑暗觀光」的行銷？
  options:
  - label: A
    content: 金馬離島戰地風情
  - label: B
    content: 澎湖菊島璀璨花火
