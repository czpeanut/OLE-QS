    content: 臺東史前文化巡禮。
  group_stem: "【五】請閱讀下列資料後回答問題：\n資料一：\n  「黑暗觀光」（dark tourism）一詞在民國 85 年提出，曾在歐美地區興起一段時間。「黑暗觀光」是指人們在曾發生過戰爭、災難、屠殺等黑暗事件的地點，進行旅遊活動。這種旅遊型態，因其旅行地點的「特殊」，因而成為吸引觀光客的賣點，更為觀光地區帶來可觀的收入。\n\
    （資料來源：林潤華，傷痛與觀看：淺談「黑暗觀光」）\n資料二：\n  位於金門縣古崗村古崗湖東南方的翟山坑道，全長有 101 公尺、寬約 6 公尺、高約 3.5\
    \ 公尺，裡頭的水道呈 A 字型。翟山坑道建立於民國 50 年，因應當時的兩岸情勢而建，提供登陸小艇搶攤運送補給用，全程人工開鑿而成，共耗時 5 年才完成，坑道內還有設計讓船隻停泊的碼頭。\n\
    （資料來源：金門縣政府觀光處）\n資料三：\n  馬祖南竿機場有一告示如下：\n每日往返南竿馬尾─班次：\n馬祖南竿→福州馬尾：下午 14：00\n福州馬尾→馬祖南竿：上午\
    \ 09：15\n◎注意事項：\n1.請於開船時間前 1 小時，至各港口辦理購票登船手續。\n2.因關係旅客上下船因素，上述為預估時間，正確時間當日洽旅行社較妥。\n\
    （資料來源：馬祖南竿機場）"
