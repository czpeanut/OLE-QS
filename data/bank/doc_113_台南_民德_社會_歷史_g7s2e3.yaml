  group_stem: "【三】請閱讀短文，回答下列問題：\n     看似孤島的臺灣，與外在的接觸卻不曾止息，在不同的時期，就會有著不一樣的時代表現，在文化的發展，一步步從過去緩慢的走到今日。臺灣從來就不是一成不變的地方，他充滿著文化的底蘊。\n\
