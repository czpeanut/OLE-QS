- id: doc_113_高雄_楠梓_社會_歷史_g7s2e3_s1_37
  section: 1
  number: 37
  type: single
  page: 2
  stem: '根據上文中提到的1951~1965 年，台灣更因為「共同安全法」被納入第一島鏈，而受到美國援助。

    請問「共同安全法」指的是下列何者？'
  options:
  - label: A
    content: 臺灣關係法
  - label: B
    content: 中美共同防禦條約
  - label: C
    content: 中美經濟援助協定
  - label: D
    content: 美中建交公報。
  group_stem: '二次世界大戰後，美國陸續提供中華民國政府貸款及軍事的協助，1951~1965 年，台灣更因為「共同安全法」被納入第一島鏈，而受到美國援助。當時被援助的項目非常多，如：政府的軍事、電力、通訊、交通等，同時扶植公營企業民間工業。在基礎建設工程中，甚至有
    74% 的總投資額來自美援。除了硬體的改善，美國帶來的糧食及加工技術，也讓台灣的飲食習慣，產生極大的轉變！


    麵粉 自 1950 年代起輸入台灣，後來更是直接進口小麥，帶動農產加工的成長（因此台灣也有許多本地麵粉廠喔!）除此之外，政府鼓勵「以麵代米」，將更值錢的米出口，同時大讚小麥的營養價值，推廣麵食製作。所以，台灣人的主食，漸漸從稻米變成小麥，當時許多老照片，都能看到一家人圍在餐桌前做包子、饅頭的畫面，麵包、餅乾等西式零食也開始流行起來！


    由於當時物資短缺，貧困百姓把麵粉吃完後，便將 純棉 的麵粉袋保留下來裁縫成內衣、內褲來穿，頗為通風透氣～當時，許多人身上都能看到「中美握手」的標章，被標註「淨重
    22 公斤」

