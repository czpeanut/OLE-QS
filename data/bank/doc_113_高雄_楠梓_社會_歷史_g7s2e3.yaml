- id: doc_113_高雄_楠梓_社會_歷史_g7s2e3_s1_21
  section: 1
  number: 21
  type: single
  page: 1
  stem: '流行於一九六○年代的閩南語歌曲「孤女的願望」，其中有句歌詞《阮想要來去都市,做著女工渡日子,也通來安慰自己心內的稀微》。這首歌反映了臺灣工業發展過程中,工廠與家庭代工興盛，低薪又勤奮的女工成為搶手勞力。

    請問:一九六○年代臺灣的經濟發展有何特點？'
  options:
  - label: A
    content: 美國提供經濟援助，臺灣藉此獲得充足資金，得以修復基礎建設
  - label: B
    content: 為發展重化工業，政府透過建設奠定重工業基礎，健全投資環境
  - label: C
    content: 政府展開土地改革，引導地主投資工商業發展
  - label: D
    content: 鼓勵中小企業投資，設立加工出口區以吸引外資，並導入新技術
