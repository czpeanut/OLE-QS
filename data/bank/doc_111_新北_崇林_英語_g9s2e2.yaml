- id: doc_111_新北_崇林_英語_g9s2e2_s1_32
  section: 1
  number: 32
  type: single
  page: 4
  stem: What does fret mean?
  options:
  - label: A
    content: Worry about.
  - label: B
    content: Expect.
  - label: C
    content: Excite.
  - label: D
    content: Break down.
  group_stem: 'A study following 450,000 people in the UK has found that babies born
    during the summer months of June, July, and August are heavier when they were
    born and taller after they grow up, as well as healthier.

    That sounds interesting, doesn''t it? This could be that the mothers of summer
    babies are able to enjoy more sunshine, so their babies get more Vitamin D. Winter
    babies born during the months of December, January, and February, however, are
    lighter at birth and shorter when growing up.

    The study also found some kinds of diseases like heart disease may be brought
    on by the season of birth. For example, people born in March and April are at
    higher risk of heart disease. As for people born in May and July, they have the
    lowest risk of disease.

    But do those born at the end of the year have to worry all the time? No, they
    don''t need to fret at all. Exercising, eating health food, and being happy are
    more important than what month you were born to decide your health!

    vitamin 維他命；risk 風險；disease 疾病 翰林新綱會考制霸'
