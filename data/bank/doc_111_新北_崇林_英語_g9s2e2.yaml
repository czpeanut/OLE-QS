  group_stem: 'Get more people to throw garbage into the can by making it fun!


    THE DEEPEST CAN

    A can designed to sound like

    the deepest can in the world


    Goal

    1. To solve the problem of littering by encouraging people to throw garbage into
    the can, or to pick up trash and throw it into the can.

    2. To make our environment a better place.

    Way

    A sensor was placed in the can. When you throw waste into it, the sensor will
    sense the movement, and you will hear a very long falling sound. When the can
    is full, it will send a message to garbage collectors.

    Result

    The falling sound interested people. Moreover, it made them throw trash in to
    hear the sound. The amount of trash “The Deepest Can” collected was almost twice
    as much as that in an ordinary can.

