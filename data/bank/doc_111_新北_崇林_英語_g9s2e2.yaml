- id: doc_111_新北_崇林_英語_g9s2e2_s1_27
  section: 1
  number: 27
  type: single
  page: 3
  stem: What is the good title for this story ?
  options:
  - label: A
    content: How to Keep Dogs.
  - label: B
    content: A Serious Problem.
  - label: C
    content: Our Best Friends.
  - label: D
    content: The Rules of Keeping Dogs.
  group_stem: 'Dogs are our best friends. They not only watch over our houses but
    also cheer us up whenever we are down or in trouble. If someone we don’t know
    enters our house, our dogs will bark to warn us. Besides, we cannot find better
    listeners than dogs because they always concentrate on what we say and never talk
    back to us. Above all, they seldom walk away from us even if we don’t treat them
    right. They are really nice and thoughtful.

    People, however, are not always dogs’ best friends. Some dog owners who get tired
    of taking care of their pets simply throw them out on the street. They become
    stray dogs. These stray dogs have become a serious problem. Hungry stray dogs
    may attack people, and dog bites can sometimes make people sick. So how can we
    stop the growing number of stray dogs? Perhaps we should try very hard to find
    them homes and treat them like our family. Also, we need to be responsible owners
    once we decide to have a dog as a pet . Remember, dogs are not toys. They’re not
    only living things but also our best friends.

    concentrate 專注; thoughtful 體貼的; responsible 承擔責任的

    改編自朗文全民英檢'
  tags:
    textbook: 第六冊（九下）第2次段考範圍
    labeled_by: ai
