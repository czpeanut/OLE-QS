- id: doc_111_新北_崇林_英語_g9s2e2_s1_24
  section: 1
  number: 24
  type: single
  page: 2
  stem: To pay for Susan’s university education, what did her father do?
  options:
  - label: A
    content: Sell his car.
  - label: B
    content: Sell his house.
  - label: C
    content: Change his job.
  - label: D
    content: Complain to his boss.
  group_stem: 'Good News

    When Susan Fisher left high school, she wanted to go to university. Sadly, her
    father was quite poor, and a university education cost a lot of money.

    “Take the entrance examination,” her father said,“ and we’ll think of something
    if you pass.”

    Susan took the examination. Her score wasn’t very high, but it was high enough,
    and she was offered a place at a university.

    “I’m very proud of you, Susan,“ her father said. “I must find the money for a
    university education for you somehow.“

    “But how, Dad?” Susan asked.

    “Well, I can sell my car and work a lot of overtime. I can even work two jobs
    if necessary, one during the day and one at night.”

    “You’re a very kind father,“ Susan said.

    “Your future is worth the sacrifice,” he told her.

    The next day, he sold his car and asked his boss to give him three hours of overtime
    every day. This meant walking to work and working 12 hours a day, seven days a
    week, but he did not complain. His daughter’s education was worth it.

    A year passed. Susan took her final exams.

    When the results came out, she ran home to tell her father the news.

    “Dad,” she said, “I got my examination results. You’ll be so pleased.”

    “You passed!” he shouted.

    “No! You can have your car back and stop working so hard!”

    university 大學；entrance examination 入學考試；if necessary 如果必要的；sacrifice 犧牲；result
    結果

    改編自朗文基礎閱讀'
