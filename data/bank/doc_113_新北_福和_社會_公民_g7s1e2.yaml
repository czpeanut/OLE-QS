  - label: D
    content: 因為家暴受害者並沒有明確的定義。
  group_stem: '❏ 請依照下列資料，回答43 ~ 45 題：

    公共電視所製作的影集《你的孩子不是你的孩子》，展現了各式各樣的家庭形態。其中一集《貓的孩子》講述了高中生阿衍因學業成績而在父母間承受的壓力。只要沒達到滿級分，他不僅會失去父親的疼愛，母親還可能遭到父親的暴力對待，這使得阿衍背負著沉重的壓力。此外，母親對成績的冷酷執著也讓阿衍逐漸產生心理健康問題，在多重陰影下，阿衍最終只能透過虐待貓來發洩他的憤怒，造成多重悲劇的發生。'
