    | (C)民國六十年代 | 重工業 | 推動十大建設，並以礦產豐富的原料產地為重心，發展資本和能源密集度較高的工業 | 鋼鐵、石化工業 |

    | (D)民國七十年代迄今 | 高科技工業 | 首先設立新竹科學園區，以政策扶植高附加價值、技術和低廉勞力密集的工業 | 資訊、半導體產業 |'
