- id: doc_113_高雄_陽明_社會_g7s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 鰻魚會從河川游入海中產卵，母鰻經過千里跋涉來到太平洋最深的馬里亞納海溝附近(位於11°21′N，142°12′E)產卵後死亡。在深海中孵化後的鰻苗會長成兩側扁扁的柳葉鰻樣態，這個外型讓牠可以隨著洋流進行長距離漂流，接近大陸棚時則變態成為流線型的玻璃鰻或線鰻，這也是漁民捕撈到鰻苗的真實樣態。每年11
    月到隔年2 月，漁民會聚集在花蓮溪、蘭陽溪甚至淡水河口捕撈鰻苗。根據文中所述，下列敘述何者正確？
  options:
  - label: A
    content: 鰻苗會隨著黑潮來到花蓮溪、蘭陽溪河口
  - label: B
    content: 捕撈鰻苗屬於近海漁業
  - label: C
    content: 漁民捕撈鰻苗時可能會遇到強勁的西南季風
  - label: D
    content: 因為東部海域大陸棚廣大，所以鰻苗產量豐富。
