  group_stem: "簡吉（1903-1951），男，高雄鳳山人，畢業於臺南師範學校，1921-1924 年任教於鳯山**學校（今鳳山國小）教臺灣人學生，面對漢人學生因家貧需從事農務，無法全心向學，雖任教師，他自認如「月俸竊賊」，乃放棄教職，投入逐漸興起的農民運動，1926\
    \ 年與楊逵等創設臺灣農民組合，以農村演講、抗議、等行動，啟發民智，反抗官商對農民的壓迫，結合數萬農民與日本人抗爭，因此前後被關十一年。\n    台灣光復後發生二二八事件，簡吉站在農民的立場，加入嘉南中隊，與當時的政府抗爭、交火、作戰，三年後不幸被捕而被國民政府判處死刑。臺塑集團董事長王永慶女婿、大眾電腦董事長簡明仁為簡吉之子。1993\
    \ 年8 月4 日，大眾電腦成立「財團法人簡吉陳何文教基金會」，以紀念與傳承其父母之理念。"
