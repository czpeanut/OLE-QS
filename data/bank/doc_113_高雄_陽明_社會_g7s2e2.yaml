- id: doc_113_高雄_陽明_社會_g7s2e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 臺灣藍鵲與茶存在著食物鏈的關係，臺灣藍鵲會吃茶苗上的蟲子，而蟲子吃茶葉，一連串的生態食物鏈下來環環相扣，一旦土地被施作農藥，影響的是整個翡翠水庫的生態鏈。黃柏鈞將「台灣藍鵲茶」基地設在新北縣坪林，採用「流域收復」的方式，以翡翠水庫集水區為中心，計畫以契作的方式與茶農實行友善種植，讓這個地方的動物像是山羌、穿山甲以及臺灣藍鵲可以在此繁殖復育。根據上文推論，下列敘述何者正確？
  options:
  - label: A
    content: 「台灣藍鵲茶」是茶農推動休閒農業的成果
  - label: B
    content: 若在翡翠水庫集水區內施作農藥會影響蘭陽溪的水質
  - label: C
    content: 會採用「流域收復」的方式進行契作，是因為以水文概念而言，流域涵蓋的範圍通常比集水區更大
  - label: D
    content: 茶農實行友善種植，也能保護中央山脈的生態。
  tags:
    chapter:
      publisher: 康軒
      book: 七下
      subject: 地理
      code: 3-2
      title: 臺灣的農業發展有哪些特色？
      chapter: null
    textbook: 七下地理 3-2 臺灣的農業發展有哪些特色？
    labeled_by: ai
