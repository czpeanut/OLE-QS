- id: doc_111_高雄_林園_國文_g7s2e2_s4_4
  section: 4
  number: 4
  type: single
  page: 5
  stem: 有關本文的說明，下列敘述何者正確？
  options:
  - label: A
    content: 天燈相傳是三國時代的諸葛亮為了軍事所需而設計，用以探測星象
  - label: B
    content: 天燈又名「孔明燈」、「平安燈」、「祈福燈」，其上升原理與熱氣球相同
  - label: C
    content: 放天燈源自於一種宗教儀式，也是讓臺灣躍上世界舞臺的重要文化活動之一
  - label: D
    content: 平溪天燈據傳是清朝時，山區的居民為了對抗盜匪入侵而設計的防禦武器
  group_stem: '「平溪國際天燈節」的由來

    天燈又名「孔明燈」，相傳是三國時代的諸葛亮（孔明）所創。當初為了軍事所需，遂利用熱氣上升原理讓燈盞飄浮於空中，造成錯誤的「星象」資訊，欺騙司馬懿大軍，堪稱現今熱氣球的先驅。

    平溪天燈的由來，據傳是因清朝時代居民地處偏僻山區，若遇盜匪作亂，便到山中避禍。盜匪離去後，留守村中的人就在夜間施放天燈，作為報平安的信號，並告知避難者可以返家，所以居民稱天燈為「平安燈」。待時局安定後，這項儀式被保留為地方民俗，人們藉放天燈向上天祈福，便又稱作「祈福燈」。

    民國八十八年，臺北縣（今新北市）政府將施放天燈推廣為全國性活動，在平溪國中舉行首屆「國際天燈節」，吸引了三萬人次參加，獲得熱烈迴響。此後每年元宵節，都會吸引海內外數萬人潮前來參與，放天燈遂為臺灣躍上世界舞臺的重要文化活動之一。'
  answer:
  - B
  answer_source: answer_key_vlm
