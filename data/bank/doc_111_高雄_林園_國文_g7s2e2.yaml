- id: doc_111_高雄_林園_國文_g7s2e2_s4_7
  section: 4
  number: 7
  type: single
  page: 6
  stem: 關於本詩，下列敘述何者錯誤？
  options:
  - label: A
    content: 首聯點明詩人隱居奉佛的人生歸宿和思想皈依
  - label: B
    content: 頷聯描述詩人陶醉於山中信步閒走的自在感受
  - label: C
