- id: doc_111_高雄_林園_國文_g7s2e2_s4_9
  section: 4
  number: 9
  type: single
  page: 6
  stem: 小宋一行人正在規劃去平溪線旅遊，根據旅遊內容的簡介，誰的敘述最合理？
  options:
  - label: A
    content: 小宋：若要搭火車，最順路的行程應是先去平溪，再去十分，最後去菁桐
  - label: B
    content: 小元：建議大家一起買平溪線一日周遊券，三人以上團購可享有優待票價
  - label: C
    content: 小思：身為鐵道迷，最想去十分老街好好體驗火車從身邊經過的特殊景象
  - label: D
    content: 小書：可以到平溪火車站放天燈，車站後還有平溪線最大煤坑舊址可以逛
  group_stem: "平溪線觀光簡介\n    平溪線鐵道是臺鐵北迴鐵路的支線，早期因基隆河河谷煤礦發達，為開採與運送便利所建，沿線自三貂嶺起前往大華、十分、望古、嶺腳、平溪至終點站菁桐，並於西元一九九二年成為觀光鐵道路線。\n\
    ※平溪線一日周遊券，限當日使用，可於各站自由上下站，不限次數，全票八十元，優待票(含孩童、敬老、愛心票)四十元。\n◎十分老街\n    由於十分老街中的民宅多沿鐵道而蓋，因此街道、鐵道和民宅三者完全沒有柵欄阻隔，形成人車在馬路上行走，火車就從身邊開過去的特殊景觀。\n\
    ◎十分火車站\n    平溪線上最大的火車站。十分舊名十分寮，最早因樟腦及煤礦而興盛，近年成為旅遊觀光勝地。\n◎平溪火車站\n    緊鄰平溪老街與觀音巖景點，由於天燈文化與老街的美食、古味而聲名大噪，這裡也是攝影愛好者心中的聖地，處處皆是攝影取鏡最佳景點。\n\
    ◎菁桐火車站\n    為國家三級古蹟，至今已有八十多年的歷史。車站風貌保存得相當完好，是臺灣目前僅存四個日式木造車站之一。\n◎煤礦紀念公園\n    位於菁桐火車站後方，公園內保留舊時採礦的洗煤場、洗礦場、礦工宿舍等遺跡，也是平溪線最大的煤坑舊址。"
  answer:
  - C
  answer_source: answer_key_vlm
