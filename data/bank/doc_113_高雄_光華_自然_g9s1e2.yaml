- id: doc_113_高雄_光華_自然_g9s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 地球同步衛星是一種永遠固定在地球上空某個位置的衛星，它的運行週期必須和地球自轉週期時間一樣，繞一圈地球的時間約為 24 小時，同時高度需維持在 35786
    公里左右，同步衛星只能定點在赤道上空。現有一個同步衛星運行地球一周，關於此衛星的運動情形，下列敘述何者錯誤？
