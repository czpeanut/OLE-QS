  stem: 「窗前這幾片樹葉，使我感到造物者的智慧、細心。祂以大筆寫意，為我們描出了高山長水，而又如此的心思細膩，連幾片小小的木葉，都不掉以輕心，都仔細地予以賦色、描繪，使我們在生活中處處發現美的痕跡。我進而領悟：人人皆應師法這位偉大的畫師，一筆不苟，使人生的畫布無一漏筆或是敗筆。」根據這段文字，作者由樹葉所領悟的道理，與下列何者最接近？
  options:
