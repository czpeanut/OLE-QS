- id: doc_113_台中_四育_國文_g9s1e2_s2_18
  section: 2
  number: 18
  type: single
  page: 2
  stem: 「苦味的拜訪帶來的是深沉厚重的感受，那種滋味留在喉頭最隱祕幽微的地方久久不散。」關於這段話，下列說明何者正確？
  options:
  - label: A
    content: 苦味令人難以理解，非尋常人能解釋它
  - label: B
    content: 苦味需細細品嘗，才能了解它的特別之處
  - label: C
    content: 因為苦是淺層的味覺感受，所以會在喉頭處蠢動
  - label: D
    content: 因為苦味會影響味蕾的知覺，所以才會久久不散。
  lesson_raw:
    title: 清心苦味
    basis: 引自課文〈清心苦味〉
- id: doc_113_台中_四育_國文_g9s1e2_s2_19
  section: 2
  number: 19
  type: single
  page: 2
  stem: 清心苦味一文中提到：「說苦味可清心，竟然是生命頓悟的味道。」下列詩句何者也有頓悟的感覺？
  options:
  - label: A
    content: 離離原上草，一歲一枯榮。野火燒不盡，春風吹又生
  - label: B
    content: 手把青秧插滿田，低頭便見水中天。六根清淨方為道，退步原來是向前
  - label: C
    content: 百畝庭中半是苔，桃花淨盡菜花開。種桃道士歸何處？前度劉郎今又來
  - label: D
    content: 兩人對酌山花開，一杯一杯復一杯。我醉欲眠卿且去，明朝有意抱琴來。
  lesson_raw:
    title: 清心苦味
    basis: 題幹提及課名「清心苦味」
- id: doc_113_台中_四育_國文_g9s1e2_s2_20
  section: 2
  number: 20
  type: single
  page: 2
  stem: 下列關於獵人一文的文句含義，何者說明正確？
  options:
  - label: A
    content: 濃密而深黑的樹林沉靜地霸占山頭：暗示大自然深不可測的凶險
  - label: B
    content: 山林中只剩下空寂的樹林，和樹葉的訕笑聲：形容作者獵到山豬後，山林恢復平靜
  - label: C
    content: 失去了老獵人的陪伴，我便像是在大海中猶豫的扁舟：指作者剛進入山林便迷路了
  - label: D
    content: 你只許有一把番刀，前去尋找山豬的一對利牙：老獵人擔心使用現代工具會過度獵殺動物。
  lesson_raw:
    title: 獵人
    basis: 題幹提及課名「獵人」
- id: doc_113_台中_四育_國文_g9s1e2_s2_21
  section: 2
  number: 21
  type: single
  page: 3
  stem: 「整片天空宛如張大翅膀的蒼鷹迅速撲掠而下。」這句話是形容什麼樣的景象？
  options:
  - label: A
    content: 山勢高聳，夜幕突降，讓人覺得壓迫
  - label: B
    content: 蒼鷹如此巨大，張翅似乎要遮蔽天空
  - label: C
    content: 天空烏雲密布，似要向山顛席捲而來
  - label: D
    content: 林木參天，綠葉連天，就如蒼鷹展翅。
  lesson_raw:
    title: 獵人
    basis: 引自課文〈獵人〉
- id: doc_113_台中_四育_國文_g9s1e2_s2_22
  section: 2
  number: 22
  type: single
  page: 3
  stem: 獵人一文中，透過作者最後放棄狩獵，以及老獵人「以後泰雅的小孩要獵什麼」這句話點出「永續經營」的山林保育觀念，請問下列何者可作為此一觀念的註解？
  options:
  - label: A
    content: 四時行焉，百物生焉
  - label: B
    content: 拔一毛而利天下，不為也
  - label: C
    content: 斧斤以時入山林，材木不可勝用也
  - label: D
    content: 取之無盡，用之不竭，是造物者之無盡藏也。
  lesson_raw:
    title: 獵人
    basis: 題幹提及課名「獵人」
- id: doc_113_台中_四育_國文_g9s1e2_s2_23
  section: 2
  number: 23
  type: single
  page: 3
  stem: 獵人一文中，老獵人帶領瓦歷斯．諾幹進行泰雅成年禮時，沿途作者善於運用獵人的技能，也從中學習到許多知識與禁忌，下列何組配對說明最正確？
  options:
  - label: A
    content: 狩獵後家族將以戰歌和小米酒迎接：作者已成功獵殺山豬，完成成年禮
  - label: B
    content: 泰雅的榮譽：僅用一把番刀便能取下堅實的櫸木，製作一些堅固且實用的長矛
  - label: C
    content: 篝火不能停息：老獵人認為，狐狸肉不必加任何添加物，只需沾上粗鹽調理後就非常美味
  - label: D
    content: 等待是獵人的美德：選擇埋伏在溪水邊，黃昏時山豬會前來飲水，到時便可給牠致命的一擊。
  lesson_raw:
    title: 獵人
    basis: 題幹提及課名「獵人」與作者「瓦歷斯．諾幹」
