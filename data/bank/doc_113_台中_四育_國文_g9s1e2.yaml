- id: doc_113_台中_四育_國文_g9s1e2_s3_36
  section: 3
  number: 36
  type: single
  page: 5
  stem: 依據文中的描述，雲和街的場景最有可能是下列何者？
  options:
  - label: A
    content: 街道寬敞，兩旁開滿商家
  - label: B
    content: 巷弄滿是日式風格的房舍
  - label: C
    content: 夜晚攤商眾多，人潮聚集
  - label: D
    content: 外籍人士多，富有異國風情。
  group_stem: "(二)請閱讀下文，回答第36~38 題：\n    雲和街字面與音韻皆美，不長，只從溫州街穿過泰順、龍泉、師大路直到浦城街，其窄不足以同時容納兩輛汽車擦身。我居住的這幢街角公寓，門口恰好一株高大彎曲的野火花，根處皆被柏油覆蓋，樹根生命力旺盛，反撐裂了路面。公寓另一面樓下乃師大夜市大排長龍的老夫婦車輪餅攤，他們一週開工六天，麵糊混著甜餡烘烤，那氣味，總使人寫稿、看書不能專心。\n\
    \    住在這條小街上兩個多月，已經熟悉了對門咖啡館的兩頭貓，和樓上住戶一天需得縱出遊玩多次的貓。公寓中偶爾遇到一位中年外國男子，我屢次對他微笑，但他並不理會，和這一帶外國人彼此相遇的熱烈情況大不相同。各樓層門戶日常大多緊閉，現代公寓生活本來就難以認識左鄰右舍，不知道他們的組成與職業。朋友來訪時說，至少隔壁人家門口春聯嵌有「詩書」字樣，和其他人的春聯只想添官發財納福不一樣呢，也是讀書人家吧？\n\
    \    城裡的小巷很耐走，欣賞別人的盆栽、陽臺與燈光。師大一帶本多日式老房舍，應是早年高等學校的宿舍，戰後理所當然就成為師大教員宿舍，目前大多數都已經改建了，然而也還有幾棟，安然地留存著，或者已經荒廢頹圮。五○年代，雲和街十一號便是梁實秋任教於師大時的住宅了，庭院中矗立著高大麵包樹，葉子如手掌似的合著風，梁家從此處搬走後仍對這棵樹念念難忘。同樣在五○年代，中研院近史所籌備處剛剛創立時，郭廷以先生也是借了雲和街四十七號辦公了大約半年，才搬到南港去的。十一號日式房舍仍在，外型優雅沉著，屋頂有些塌陷，麵包樹雄姿依舊，而四十七號則早已改為公寓。\n\
    \    不穩定的天氣中有時候來了陽光，我們會打開落地窗，讓暖空氣與市聲進來，或走到陽臺上，俯瞰白天的師大夜市。載貨卸貨的小卡車也只有這時候開得進來，大多數店家早晨便已開始洗菜切料，一盆盆青葉豆芽蘿蔔片，顏色樸實可喜，鍋罈中的湯水已滾滾散出熱氣了，市井就浮盪在那淡雲般的熱氣中。\n\
    ――節錄自楊佳嫻 雲和"
