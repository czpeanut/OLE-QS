  stem: 下列何者符合本文所述的養生之道？
  options:
  - label: A
    content: 腹瀉腹脹時，宜食用薑片炒油菜花來除寒氣
  - label: B
    content: 若有胃潰瘍的舊疾，可多吃豆皮以保護胃壁
  - label: C
    content: 適量食用豆皮，其纖維可促進新陳代謝
  - label: D
