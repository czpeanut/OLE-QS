  stem: 文末「即便到了一個地方，若能選擇一條街道，把自己當成繪製地圖的人，只消半個小時，你就會發現自己看到了比平時走馬看花更多的景物。」這段話主要是說明旅遊時應抱持什麼態度？
  options:
  - label: A
    content: 詳擬計畫，避免遺珠
  - label: B
    content: 心情閒適，放慢腳步
  - label: C
    content: 多加留心，深入觀察
  - label: D
    content: 入境問俗，體會差異。
  group_stem: "(三)請閱讀下文，回答第39~41 題：\n    旅行，有時可以跟蒐集品之旅畫上等號，而且有一樣東西你不能不蒐集，那就是地圖。地圖可以幫助我們快速掌握一個城市的前世今生。\n\
    \    不妨先找出一張城市的街道圖。上頭的街道線條如何？如果都是直楞楞的，這應該是個經過刻意建造，而非自然發展的城市。這些線條表現了計畫、秩序，也顯示維持秩序的權力。看看美國\
    \ 華盛頓特區的街道圖便可以了解：所有筆直的大街，最後都輻集於一個焦點――白宮。但當你看到彎彎曲曲的線條，線條匯集之處標示十字架或圓圈圈，你大概來到了歐洲的小城。因為當地小城的街道是順著市民需要而發展，日常活動的廣場或教堂自然成為城市的重心。\n\
    \    如果你拜訪一座大城市，通常還可以找到它的地鐵或電車路線圖，以及購物地圖。兩相對照之下，對當地的近期發展就有更多的了解。以馬來西亞首都吉隆坡為例，街道圖上線條最密集的地區是巴生河和莪麥河交會的沿岸，也是城市發源之處，但從購物地圖來看，全市三十幾家百貨公司有三分之二坐落在更外圍的地帶，可見這是個因經濟快速發展而不斷擴張的都市。\n\
    \    對於喜歡自己上路的人，地鐵圖配上街道圖，是最方便規畫路線的方式。背包客通常會從地鐵圖上選擇三或四個有多條路線交會的大站，再以車站為中心畫出方框，凡是落在其中的觀光點，就是旅遊行程中考慮的目標。\n\
    \    當旅途開展後，地圖也能成為個人蹤跡的寫真集。例如到了巷弄如雲的威尼斯，不妨將地圖上線條密集的地區局部放大，自己鑽進巷弄間探奇一番，將發現的趣味小店、有特色的建築、不起眼但是手藝不錯的餐館標示上去，就成為一張獨一無二的紀念地圖了。即便到了一個地方，若能選擇一條街道，把自己當成繪製地圖的人，只消半個小時，你就會發現自己看到了比平時走馬看花更多的景物。\n\
    \                                 ――改寫自孫秀惠 旅行，從地圖開始"
