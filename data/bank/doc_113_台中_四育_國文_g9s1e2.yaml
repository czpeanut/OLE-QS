  stem: 關於生於憂患死於安樂的敘述，下列何者正確？
  options:
  - label: A
    content: 本文主旨為「君子有終身之憂，無一朝之患也」
  - label: B
    content: 「困於心，衡於慮，而後作」是要我們培養「謹言慎行」的精神
  - label: C
    content: 「徵於色，發於聲，而後喻」指人需要透過別人的反應，才能夠從現狀中醒悟
  - label: D
    content: 手段列舉六位賢者的實例，主要在說明「勞心者治人， 勞力者治於人」。
  lesson_raw:
    title: 生於憂患死於安樂
    basis: 題幹提及課名「生於憂患死於安樂」
- id: doc_113_台中_四育_國文_g9s1e2_s2_13
  section: 2
  number: 13
  type: single
  page: 1
  stem: 關於生於憂患死於安樂的寫作手法，下列敘述何者正確？
  options:
  - label: A
    content: 開頭採開門見山法，先點明主旨，再舉例說明，後歸納重點
  - label: B
