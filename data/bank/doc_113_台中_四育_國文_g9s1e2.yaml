- id: doc_113_台中_四育_國文_g9s1e2_s2_14
  section: 2
  number: 14
  type: single
  page: 2
  stem: 關於生於憂患死於安樂一文所要表達的道理，與下列何者最為相近？
  options:
  - label: A
    content: 如果說我比別人看得要遠一點，那是因為我站在巨人的肩上
  - label: B
    content: 人只有獻身於社會，才能找出那短暫而有風險的生命的意義
  - label: C
    content: 衡量一個人的真正品格，是看他在知道沒人看見的時候做些什麼
  - label: D
    content: 不要引導他走上安逸舒適的道路，而要讓他遭受困難與挑戰的磨練和策勵。
  lesson_raw:
    title: 生於憂患死於安樂
    basis: 題幹提及課名「生於憂患死於安樂」
