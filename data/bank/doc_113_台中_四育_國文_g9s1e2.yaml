    content: ③
  - label: D
    content: ④。
  group_stem: "(四)請閱讀下文，回答第46~47 題：\n【甲】\n    夜飲東坡醒復醉，①歸來彷彿三更。②家童鼻息已雷鳴，敲門都不應，倚杖聽江聲。\
    \  長恨此身非我有，何時忘卻營營？夜闌風靜縠紋平，小舟從此逝，江海寄餘生。\n                                     \
    \               ―蘇軾〈臨江仙〉\n【乙】\n    山居中的恬靜最使人心生歡喜，覺得充滿了幸福。但這種感覺完全是屬於我個人私己的，難以和他人分享。當深夜沉寂，偶爾會有一部卡車從山腰轟隆急馳而過，聲音在峽谷間響應激盪，久久停留，我往往就會從安寧的心緒中驚覺過來。車上至少有一個聚精會神在奔波的人，③重山曲流外就是苦樂混合著沸騰的紅塵，那裡面也有著我的妻女和親友，而我卻一個人上山來獨自享受清靜。那麼，④我的幸福是不是純由逃避式的懶散得來的呢？山居只是自己刻意經營的一種看似空靈其實奢侈的生活？心安理得會不會是虛幻而脆弱的？\n\
    \    至少，我不希望如此，因為人間是我的根本用情處。\n――陳列 地上歲月 山中書"
