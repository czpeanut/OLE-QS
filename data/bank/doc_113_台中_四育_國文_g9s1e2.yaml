  group_stem: "(三)請閱讀下文，回答第42~43 題：\n【二十四節氣輕蔬食】雨水 (國曆二月十八日～二十日)\n 獺祭魚、鴻鴈來、草木萌動\n雨水是二十四節氣中的第二個節氣，農夫開始播種，常可見大地上綠色幼苗隨風搖曳著，是萬物生長的好時機。中醫認為，肝屬木，而五色中青色入肝經，春天飲食上宜多吃綠色食物，能有益肝氣，升發舒泄得宜，例如福山萵苣、油菜花等。雨水時節也帶來了濕氣，容易讓人覺得慵懶、全身肌肉沉重無力，多吃深綠色的蔬菜有益暢通肝經。而豆製品如豆腐、豆乾等能補益肝氣護脾胃，雨水節氣飲食宜清淡，忌油膩、生冷及刺激性食物。在季節交替的此時節將脾胃顧好，會使一整年的生活元氣滿滿。\n\
    \n\U0001F449中醫師推薦養生食材\n◆ 油菜花：性涼，味甘。含鉀量高，建議血鉀高或限鉀飲食的民眾，可汆燙後再食用，以減少鉀的攝取。\n◆ 豆類製品(\
    \ 如豆腐、豆乾等)：食用過量豆類製品較易脹氣。脾胃虛者不宜多食。\n\U0001F449油菜豆包海苔捲\n◆ 材料:① 油菜花400 克  ② 濕豆皮80\
    \ 克  ③ 海苔片-2 片 ④ 調味料：鹽1 克、香菇粉3 克  ⑤ 橄欖油5 克\n◆ 做法:① 油菜花洗淨，切長段放入鍋中加油拌炒， 加入調味料盛盤備用。\n\
    ② 平底鍋加入極少許油潤鍋，以小火加熱放入豆皮煎至金黃色。\n③ 取適量油菜花加入煎好豆皮內捲起來，最後貼上海苔絲或片，即可食用。"
