- id: doc_113_台中_四育_國文_g9s1e2_s2_16
  section: 2
  number: 16
  type: single
  page: 2
  stem: 清心苦味中提到：「阿媽說的道理，我可是花了好多好多年頭後才逐漸明白，而當我明白時，我也同時發現自己的青春已一去不復返了。」當作者明白阿媽說「苦可清心」的道理時，卻也發現自己的青春早已逝去，這裡頭抒發了什麼感受？
  options:
  - label: A
    content: 歡喜體悟老一輩的真理，令人再三回味
  - label: B
    content: 惋惜自己沒有及時行樂，讓時間匆匆流逝
  - label: C
    content: 感慨人生須經長時間的歷練才能有所成長
  - label: D
    content: 感嘆青春不等人，當下的自己仍一事無成。
  lesson_raw:
    title: 清心苦味
    basis: 題幹提及課名「清心苦味」
