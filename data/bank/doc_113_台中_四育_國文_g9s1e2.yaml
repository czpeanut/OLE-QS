  section: 2
  number: 31
  type: single
  page: 4
  stem: 「柳宗元貶放永州，日子過得孤寂而荒涼。親族朋友不來理睬，地方官員時時監視。災難使他十分狼狽，一度蓬頭垢面，喪魂落魄。但是，災難也給了他一份寧靜，使他有足夠的時間與自然相晤，與自我對話。於是，他進入了最佳的寫作狀態，也讓中國文化史擁有了永州八記。」這段文字所表達的意涵，與下列何者最接近？
  options:
  - label: A
    content: 只有經歷過許多痛苦的人，才能夠體會創作的喜悅
  - label: B
    content: 作家的使命，就是要揀選一條最艱難的路給自己走
  - label: C
    content: 以強勢的語言護衛脆弱的靈魂，才能在災難中轉危為安
  - label: D
    content: 憂患常是激發創作的力量，失意有時反而能寫出精彩作品。
