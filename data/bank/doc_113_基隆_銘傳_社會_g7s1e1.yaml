- id: doc_113_基隆_銘傳_社會_g7s1e1_s3_48
  section: 3
  number: 48
  type: single
  page: 5
  stem: 川普自稱在電視上看到這個訊息而在總統大選辯論會中脫口而出，請問這樣對於資訊未確實查證即向全世界傳播的做法，欠缺哪一種公民德行？
  options:
  - label: A
    content: 理性思考批判
  - label: B
    content: 參與公共事務
  - label: C
    content: 捍衛公平正義
  - label: D
    content: 遵守法律規範。
  group_stem: '題組:請根據下文回答下列問題

    2024年美國總統大選電視辯論會中，現任副總統賀錦麗(Kamala Harris)與前總統川普(Donald Trump)首次正面交鋒。其中兩人談到移民問題時，川普提到「俄亥俄州的海地移民會殺寵物來吃」，不過這一說法立即被主持人反駁，指出「並無事實根據」。

    追溯這個「海地移民吃寵物」傳言從何而來，大約在2024年9月6日左右開始有「春田市是俄亥俄的一個小城鎮，四年前擁有6萬居民，在賀錦麗與拜登執政下，2萬海地移民移居到此。現在鴨子與寵物都不見了!」這樣的說法貼文，出現在Facebook上的一些俄亥俄州地區社團。

    川普在總統大選辯論講出春田市的移民吃寵物謠言後，各家新聞媒體和查核機構旋即開始對這個謠言進行查核並進行闢謠，指出沒有可靠證據顯示海地移民有吃寵物的行為。由於此事引起巨大的關注，大量媒體和社會資源投入查核此事是真是假，就如春田市市長魯所言，當民眾討論集中這類的不實謠言時，真正攸關美國人生活的重要問題就容易被公眾忽視。(本文擷取自轉角國際「俄亥俄的海地移民吃寵物?川普在總統辯論脫口而出的毛孩謠言」)'
