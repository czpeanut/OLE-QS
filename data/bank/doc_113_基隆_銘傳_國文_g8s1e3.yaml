  section: 2
  number: 17
  type: single
  page: 2
  stem: 《史記》中出現很多名言警語，請根據各選項文意判斷，下列何者運用錯誤？
  options:
  - label: A
    content: 我在國外留學並工作超過十年了，如今還沒有闖出一番事業，實在是「智者千慮，必有一失」
  - label: B
    content: 范蠡深諳明哲保身之道，助越王復國之後，主動求去，逃脫「狡兔死，走狗烹」的下場
  - label: C
    content: 井蛙焉知大海之廣，「燕雀安知鴻鵠之志」，你們哪裡知道，他的理想是獲得諾貝爾文學獎
