  type: essay
  page: 5
  stem: '題目：我對設置博愛座的看法


    請閱讀以下資訊，並按題意要求完成一篇文章。以下是各國博愛座之差異：

    | 國家 | 博愛座(一般情況) | 讓座文化 | 特殊現象 |

    | --- | --- | --- | --- |

    | 韓國 | 怕惹紛爭，會空著不去坐 | 有 | 1.通常會讓位給長者<br>2.此外還設置一個專屬孕婦的粉紅色博愛座 |

    | 日本 | 不會空著博愛座不坐 | 有，但不風行 | 不會特別讓位給老人 |

    | 泰國 | 不會空著博愛座不坐 | 有 | 設有專門給和尚坐的博愛座 |

    | 美國 | 設立專屬位子給殘疾人士 | 有 | 1.歐美國家一般沒有讓座給老人的習慣，有需要可以直接說<br>2.孕婦基本上屬於一般人，不會特別被讓坐 |

    | 英國 | 任何人都可以很自然地坐在上面 | 有 | |


    引導語：

    〈張釋之執法〉中，廷尉張釋之從法律的精神、執法者的立場、判決結果的影響等角度，表達自己對「法」的見解，並成功說服皇帝。〈生命中的碎珠〉以古今中外名人言例、事例、設喻說理的方式，證明善用零碎時間，可以充實生命，邁向成功。在日常生活中我們都需要擁有清楚表達自己立場與看法的能力。

    請參考上述各國博愛座之差異，思考其中的涵意，結合你的見聞和經驗，來表達你對「設置博愛座」的立場。本次段考作文限定用「總分總」的架構，請選擇贊成或是反對，並列舉論據闡明你的論點，分述的每段須有個人觀點小結。


    測驗注意事項：

    1. 請用本國文字書寫，請抄題，請記得在作文卷上寫明班級、座號、姓名。

    2. 請於寫作測驗答案卷上作答，如需擬草稿，可以使用本卷空白的部分。

    3. 依據試場規則，寫作測驗答案卷中不得作任何標記。故意污損答案卷、損壞試題本，或在作文內容中顯示自己身分者，該科不予計分。

    4. 依據試場規則，寫作測驗作答時，書寫內容不得超出答案卷格線外框，且務必使用黑色墨水的筆，不得使用鉛筆或其他顏色的筆，違者扣 1 級分。更正時，請使用修正帶（液）。如有超出格線外框、字跡太過潦草或汙損等情事，導致閱卷老師無法判讀寫作內容者，責任由考生自負，不得提出異議。

    5. 不可使用詩歌體裁，否則不予計分，亦不得要求增加作答用紙。'
