  section: 3
  number: 39
  type: single
  page: 3
  stem: 下列何者與蘇洵將二子命名為「軾」和「轍」的涵義不符？
  options:
  - label: A
    content: 「軾」表面上沒有太大作用，但缺少軾，車子亦不完整，會缺少供人憑靠、望遠的構造，蘇洵以此期許蘇軾要能高瞻遠矚
  - label: B
    content: 「轍」是車輪輾過之跡，車皆要依循車轍而行，因此功勞最大，蘇洵以此期許蘇轍要建功立業
  - label: C
    content: 蘇洵替長子取名「軾」，似已預見其明敏過人，恐鋒芒外露，盼其多加外飾而免於禍患
  - label: D
    content: 替小兒取名「轍」，認為其較善處於禍福之間，應能免於人事上的寵辱禍患
  group_stem: '輪、輻、轂、衡，皆有職乎車，而輢、軾獨若無所為者。雖然，去軾，則吾未見其為完車也。軾乎，吾懼汝之不外飾也。

    天下之車，莫不由轍③，而言車之功，轍不與焉。雖然，車仆馬斃，而患不及轍，是轍者，善處乎禍福之間。轍乎，吾知免矣。

    ——蘇洵〈名二子說〉


