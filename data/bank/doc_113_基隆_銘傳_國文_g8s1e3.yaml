- id: doc_113_基隆_銘傳_國文_g8s1e3_s3_43
  section: 3
  number: 43
  type: single
  page: 4
  stem: 第二部分短文中作者說「我們心中自有一幅綺麗不朽的畫」指的是什麼？
  options:
  - label: A
    content: 吃著老大昌出爐的熱牛角麵包，邊在書局遨遊書中大千世界
  - label: B
    content: 在地理課堂上學到的知識，可以在小說裡印證
  - label: C
    content: 曬著暖陽賞著落花，感受生活的美好，讓想像自成一幅彩繪
  - label: D
    content: 從灌滿美食的滿足感體悟食物是絕望時的救贖，是世界最美麗的風景
  group_stem: '（一） 認識宣陽和小瀚，才知道男孩們原本都有一肚子的道理。他們縱使看了篇短短小小的雜文，都能口齒清晰的講出一番心得，洋洋灑灑的寫篇評論。我卻糟了，看了一本好書，我只能跟金聖歎一樣叫聲好，其餘則是激動得說些沒人懂得的話。


    剛認識小四那票人時感覺又不同，我忽然自卑起來，終實抱著小四借與我的《厚黑學》和小小字的新《卡拉馬佐夫兄弟們》。說著話，我也要學學些學院派的用語。假曰的時候，則翻出爸爸書櫃裡的卡夫卡、貝克特，看得頭昏腦脹。直到卡繆的《黑死病》看到一半時，忽然想到我寫文章原可以勝得過他們的呀。白先勇的小說原是我愛的，但那是高中前就已經揚棄了的。瓊瑤小說我也原也讀的，但那是小學四年級時就也揚棄了的呀。有些東西，我該狠狠的去棄。爺爺說登山，你只要知道世界上有一座最好最高的山，那麼縱使周圍都是小丘陵，也可怡性。我懂得的，如今我還不知道那大山，所以我當如此早就耽游在小丘陵中。我自有一番打算。


    （二） 高一剛開始時，我們尚不太清楚學校的「勢力範圍」有多大，成天儘揀省事的泡東方書局，看第N次的《亞森羅蘋》，《福爾摩斯》。隔壁的老大昌在兩點半時會出一爐熱牛角麵包，我們總當第一個顧客，一人吃上兩三個，邊吃邊看希列塔尼半島上的《寺巖城》。後來上地理讀法國讀到牧草豐美、盛產肉牛的布列塔尼半島，我老撐不過來，那裏該是個豐富熱鬧盛產熱熱法國麵包的地方呀！橘兒也稱是。那種日子真真永恒。


    又高一美術課上課外寫生。我和橘兒、小靜、鄧寫生到公園號、老大昌去了。四人並肩坐在暖暖多陽的新公園裡，不知什麼名目的紫色小花落得一地，人像在做夢，我們是在北京城裏，而那繽紛的紫色小花是馬蹄逢連青石路上的馬櫻花。


    那日我們四個都帶張白紙回學校，肚裏灌滿了酸梅湯牛角麵包冬風。我們心中自有一幅綺麗不朽的畫。

    節錄自朱天心《擊壤歌——北一女三年記》'
