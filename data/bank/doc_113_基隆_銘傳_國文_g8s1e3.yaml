- id: doc_113_基隆_銘傳_國文_g8s1e3_s3_44
  section: 3
  number: 44
  type: single
  page: 4
  stem: 關於此文的解讀，何者敘述錯誤？
  options:
  - label: A
    content: 「軻既取圖奏之」和「右手持匕首椹之」的「之」，兩者所指對象相同
  - label: B
    content: 「拔劍，劍長，操其室」說明荊軻刺殺秦王的時候，荊軻十分慌張
  - label: C
    content: 「群臣皆愕，卒起不意」強調事出突然，大臣們都驚慌的不知所措
  - label: D
    content: 「諸郎中執兵皆陳殿下」是因為沒有君王命令不得上殿
  group_stem: '軻①既取圖奏之，秦王發圖，圖窮而匕首見。因左手把秦王之袖，而右手持匕首椹②之。未至身，秦王驚，自引而起，袖絕。拔劍，劍長，操其室③。時惶急，劍堅，故不可立拔。荊軻逐秦王，秦王環柱而走。群臣皆愕，卒④起不意，盡失其度⑤。而秦法，群臣侍殿上者不得持尺寸之兵⑥；諸郎中⑦執兵皆陳殿下，非有詔召不得上。方急時，不及召下兵，以故荊軻逐秦王，而卒惶急，無以擊軻，而以手共搏之。是時，侍醫夏無且以其所奉藥囊提⑧軻。秦王方環柱走，卒惶急不知所為。左右乃曰：「王負⑨劍！」負劍，遂拔以擊荊軻，斷其左股。荊軻廢，乃引其匕首提秦王，不中，中柱。秦王復擊軻，被八創。軻自知事不就，倚柱而笑，箕踞⑩以罵。

    節錄自《史記卷八十六刺客□□》


    【注釋】①軻：荊軻，戰國末期衛國人，著名刺客。 ②椹：ㄓㄣˋ，刺。 ③操其室：握住劍鞘。

    ④卒：通“猝”，突然。 ⑤盡失其度：全都失去常態。 ⑥尺寸之兵：指各種兵器。 ⑦郎中：宮廷的侍衛。

    ⑧提：擲擊。 ⑨負：背著。 ⑩箕踞：兩足向前伸展，形如畚箕的坐姿。是一種不拘禮節的坐法。'
