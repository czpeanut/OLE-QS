- id: doc_113_新北_江翠_社會_g7s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: '1940 年代，日本號召臺灣原住民組織「高砂義勇隊」，前往南洋作戰。史尼育唔（Suniuo）出生於阿美族部落，青年時期配合官方政策改名「中村輝夫」，並加入高砂義勇隊。他在今日的印尼作戰時與部隊失聯，等不到援軍的史尼育唔，就在叢林中繼續躲藏，過著脫離人群的生活。直到1974年，印尼政府才找到史尼育唔，並告訴他戰爭早已結束，史尼育唔卻仍堅信日本沒有輸，並要求返回日本。後來，史尼育唔被送回臺灣與親人團聚，但卻因身分認同、語言差異等問題，難以融入社會，僅數年後就病逝了。請問:
    史尼育唔的遭遇，與下列哪一場戰爭有關？'
