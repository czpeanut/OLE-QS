- id: doc_113_新北_江翠_社會_g7s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 他畢業於東京帝國大學土木工程學系，來到臺灣後發現臺灣南部有嚴重的乾雨季不均問題，多數田地屬於「看天田」。他認為只要能廣設灌溉水渠，便能蓄水、消除鹽害，大大提升作物產量，因而有了興建大型水圳的構想。他以「半水壓土壩工法」修築烏山頭水庫，經過十年的施工期，終於在西元1930
    年完成水圳的興建。請問:下列有關此一水圳的敘述，何者正確？(甲)上文中的他指的是後藤新平 (乙)提升甘蔗、稻米的產量，有助於供應殖民母國的需求 (丙)奠定台灣工業化的基礎
    (丁)增加嘉南平原的灌溉面積
  options:
