- id: doc_113_新北_江翠_社會_g7s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 上述資料出現的先後順序為何？
  options:
  - label: A
    content: 資料一→資料二→資料三
  - label: B
    content: 資料二→資料一→資料三
  - label: C
    content: 資料三→資料一→資料二
  - label: D
    content: 資料三→資料二→資料一。
  group_stem: '資料一

    總督府要求各地望族必須配合新政策，例如：出席愛國活動，以表現對國家與天皇的忠誠。出身高雄旗山地區望族的陳家響應國家政策，把姓氏改為「吉永」；家中還在就學的孩子，也常跟隨老師前往神社參拜。


    資料二

    臺灣各地可見日式地名，然而這些地名是日人統治臺灣一段時間後才設置的。日治前期，日本政府保留清代遺留下來的街庄名，後來因為統治方針的改變，將日本國內的制度延伸至臺灣，才有州、郡、市的設置與地名的更易。如松山、萬華、板橋、關西、清水、霧峰、竹山、高雄、美濃、玉里等地名，都是在這之後才更動的。


    資料三

    1898 年，第四任總督兒玉源太郎上任，起用後藤新平擔任民政長官。後藤新平認為，治理殖民地就像替人治病，需要了解症狀，才能對症下藥，並應以「生物學原則」為準則。他舉例說：「比目魚的兩眼長在同一側，若將比目魚的眼睛，硬要像鯛魚一樣改裝在身體的兩邊，就違反了生物學原則。比目魚眼睛之所以長在同一邊，有其生物學上的必要原因。所以，我們必須先進行舊慣調查，了解臺灣人的習性，再訂出一套管理辦法，才會有效。」'
