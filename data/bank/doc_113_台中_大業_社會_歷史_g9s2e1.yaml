  stem: 請問：「半島」所指的是？
  options:
  - label: A
    content: 阿拉伯半島
  - label: B
    content: 伊比利半島
  - label: C
    content: 義大利半島
  - label: D
    content: 巴爾幹半島。
  group_stem: 十九到二十世紀以來，「半島」在歐洲列強爭霸下如同火藥庫，而位於此地的波士尼亞與赫塞哥維納在1908 年一同被奧匈帝國併吞。他們和鄰近的塞爾維亞屬同一「民族」。塞爾維亞原先計畫建立一個以該國為核心的，統一的民族國家，而奧匈帝國粗暴的侵略，激起塞爾維亞人的不滿與憤恨，因此斐迪南大公夫婦「出巡」，便成為他們剷除頭號敵人的時機。斐迪南大公夫婦試圖透過出巡行動，給塞爾維亞人留下開明親和的形象，故搭乘敞篷車進行巡視，這給普林西普等暗殺者提供了絕佳機會，七位愛國青年暗藏手槍、炸彈，靜靜埋伏尋找暗殺時機。最後，年僅17
    歲的普林西普近距離向大公夫婦開了兩槍，大公夫婦不治身亡。82 歲的奧匈帝國老皇帝聽聞王儲噩耗，悲痛欲絕，但是德皇威廉二世卻大喜過望，認為千載難逢的好機會來臨了，積極勸說奧匈帝國向塞爾維亞開戰，並表態會援助其作戰，奧匈帝國後以塞爾維亞未能全盤接受自身提出的條件為由，便向塞爾維亞開戰。請回答第31-34
