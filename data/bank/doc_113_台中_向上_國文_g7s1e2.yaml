  group_stem: '楚人擔山雉① 者，路人問：「何鳥也？」擔雉者欺之曰：「鳳凰也。」路人曰：「我聞有鳳凰。今直② 見之，汝販之乎？」曰：「然。」則十金，弗③
    與；請加倍，乃與之。將欲獻楚王，經宿④ 而鳥死，路人不遑⑤ 惜金，惟恨不得以獻楚王。國人傳之，咸⑥ 以為真鳳凰，貴，欲以獻之，遂聞楚王。感其欲獻於己，召而厚賜之，過於買鳥之金十倍。（尹文子）

    【注釋】① 雉：動物名。俗稱為「野雞」。② 直：竟然、居然。 ③ 弗：不。④ 宿：夜晚。⑤ 不遑：沒有時間。⑥ 咸：都、皆、全。'
