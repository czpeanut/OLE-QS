- id: doc_113_台中_向上_國文_g7s1e2_s3_31
  section: 3
  number: 31
  type: single
  page: 2
  stem: 根據以上研究，下列有關婦女骨質疏鬆的敘述，何者客觀且正確？
  options:
  - label: A
    content: 根據哥倫比亞大學的研究，氮氧化物是造成 60 歲以上的停經婦女骨質疏鬆的主要兇手，對尚未停經的婦女則傷害不大
  - label: B
    content: 此項研究受試者年齡均在 60 歲以上，住家必須靠近空氣汙染嚴重的區域，以利專家學者找出骨質疏鬆與空汙的相關性
  - label: C
    content: 減少骨質疏鬆最好的方式是住在郊區並使用空氣清淨機，要去採購時再使用柴油車代步，隨時補充高單位鈣片即可減少骨質疏鬆
  - label: D
    content: 停經婦女本來就容易骨質疏鬆，若住家靠近馬路車流量大的區域或發電廠附近，會讓骨頭提早老化，骨質密度減少更多。
  group_stem: "根據美國哥倫比亞大學新發表的研究，生活在空氣汙染嚴重地區的停經婦女骨質流失速度更快。在各類常見空汙中，氮氧化物是造成骨質流失的主因，它對腰椎的損害更是一般老化的兩倍。\n\
    \  新研究則進一步探討了不同類別的空汙與人體各部位骨質流失的關聯。人體骨骼的骨量約在 20 歲至 30 歲達到最高峰，之後骨量逐漸減少。當骨量流失過多，骨骼就會形成孔隙，進而變脆、變弱，這就是「骨質疏鬆症」。\n\
    \  哥倫比亞大學 梅爾曼公共衛生學院的研究團隊找了 9000 多名停經婦女作為受試者，受試者要在六年間進行三次骨質密度檢查。研究人員也根據她們的住家位置找出平時的汙染暴露量，包含懸浮微粒（PM10）、一氧化氮（NO）、二氧化氮（NO2）、二氧化硫（SO2），進而分析不同種類空汙的影響。最後，科學家發現，氮氧化物會讓腰椎骨質密度每年減少\
    \ 1.22％，是一般老化影響的兩倍。\n  美國每年約有 210 萬例骨質疏鬆症造成的骨折，共花掉 203 億美元的醫療保健成本，其中 8 成骨質疏鬆的患者為女性，停經婦女更是高危險群。根據國民健康署統計，臺灣60\
    \ 歲以上的人口中，就有 16％有骨質疏鬆症，其中 80％為女性。此外，因飲食習慣的差異，東方人鈣質攝取量普遍不足，較西方人更容易罹患骨質疏鬆症。\n  氮氧化物主要來自車輛排放與發電廠，尤其是柴油車。我們需要更多的行動來減少柴油車與化石燃料造成的空汙，以維護大眾健康。\n\
    （節錄自姜唯編譯研究：空汙加劇停經婦女骨質疏鬆 腰椎骨質流失加倍）"
