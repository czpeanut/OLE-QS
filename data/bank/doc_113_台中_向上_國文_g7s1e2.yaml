  section: 3
  number: 33
  type: single
  page: 2
  stem: 由文中可判斷季路是個怎樣的人？
  options:
  - label: A
    content: 出手闊綽
  - label: B
    content: 熱情豪爽
  - label: C
    content: 好出風頭
  - label: D
    content: 一擲千金。
  group_stem: "顏淵、季路侍①。\n  子曰：「盍各言爾志②？」\n  子路曰：「願車、馬、衣、裘③，與朋友共④，敝之而無憾⑤。」\n  顏淵曰：「願無伐善，無施勞⑥。」\n\
    \  子路曰：「願聞子之志。」\n  子曰：「老者安之，朋友信之，少者懷之⑦。」（論語 公冶長篇）\n【注釋】① 侍：侍候在尊長身邊。 ② 盍各言爾志：何不各自說說自己的志願呢？盍，何不。爾，你。③\
    \ 裘：皮衣。④ 共：分享、合用。⑤敝之而無憾：就算破舊、損壞了，也不覺得遺憾。⑥ 無伐善而施勞：不誇耀自己的才能或優點，不張揚自己的功勞。伐，誇耀。施，張揚。⑦\
    \ 「老者安之」三句：老人能得到奉養並享受安樂，朋友能以誠信交往，少年人能得到關懷愛護。"
  tags:
