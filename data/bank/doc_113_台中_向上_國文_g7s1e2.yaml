- id: doc_113_台中_向上_國文_g7s1e2_s3_32
  section: 3
  number: 32
  type: single
  page: 2
  stem: 下列何人使用空氣清淨機的方式最正確？
  options:
  - label: A
    content: 阿丹將機器放在離牆壁20 公分處
  - label: B
    content: 維尼更換濾網時，只購買原廠濾網
  - label: C
    content: 咪咪將清淨機放在浴室內除霉
  - label: D
    content: 胖丸機器買回家後未拆除濾網封套，便將插頭立刻插入插座。
  group_stem: '以下為某牌空氣清淨機的使用說明書。

    1.清淨機剛買來，別著急插電使用，記得要拆除濾網的封套，否則只是在白作工。

    2.機身周圍要淨空，至少保留30cm 以上的空間，進出風口不可以放置任何物品。

    3.避免金屬屏蔽效應，使用時，與金屬或其他家電產品至少距離50cm 以上。

    4.清淨機避免在高溫潮濕，或是溫差大的地方使用，潮濕環境可能導致濾網發霉。

    5.如有耗材需要更換，應選用原廠耗材，非原廠可能使清淨機無法發揮最佳效能。'
  tags:
