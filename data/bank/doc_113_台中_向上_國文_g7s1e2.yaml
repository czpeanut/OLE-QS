- id: doc_113_台中_向上_國文_g7s1e2_s3_39
  section: 3
  number: 39
  type: single
  page: 2
  stem: 文中鄭亮回家後，反反覆覆的說「這是不公平的」，原因是什麼？
  options:
  - label: A
    content: 受同學霸凌
  - label: B
    content: 被老師誤會
  - label: C
    content: 演練自己的臺詞
  - label: D
    content: 對劇本的不認同。
  group_stem: "深夜電話鈴響。拿起聽筒，是一個女人的聲音：「老師，我是鄭亮的媽媽，有件事想問問您：鄭亮這兩天沒出什麼事吧？」我嚇了一跳，鄭亮媽媽說：「他反反覆覆的說：『這是不公平的。』現在，他睡下了，我放心不下，給您撥了這個電話。」\n\
    \  不公平？有什麼不公平的呢？我嘴上故作輕鬆的勸慰了鄭亮媽媽一番。\n  第二天晨讀時，按照前一天分配好的角色，大家興致勃勃的朗讀新課文—雷雨第二幕。我只是思忖著晨讀後如何「提審」鄭亮。\n\
    \  突然，同學們哄笑起來。抬眼看時，見鄭亮臉紅紅的從座位上站起身—輪到他讀了。他分到的是周沖這個角色。只聽他大聲讀道：「爸爸，這是不公平的。」讀罷，帶著成功的欣悅坐下了。\n\
    \  可不是麼，周沖就只有這一句臺詞！\n  原來，這男孩領到自己的角色後，一直著了魔般的誦讀僅有的一句台詞。他要給這至短的臺詞注入無比豐沛的情感啊！\n\
    \  我用激賞的目光直視著那個只分到一句臺詞的男孩，「謝謝你，謝謝你教會了我如何傾全力去誦讀自己人生的臺詞。」（改寫自張麗鈞 留守寸土）"
