  stem: 先將擺錘拉到A 點，如上圖，接著放手，請問擺錘擺動一次的路徑是？
  options:
  - label: A
    content: A→O
  - label: B
    content: A→O→B
  - label: C
    content: A→O→B→O→A
  - label: D
    content: A→O→B→O→A→O→B。
  group_stem: '【題組】義大利科學家伽利略發現，當擺角較小（小於10 度）時，每次擺錘來回擺動所需的時間，即擺動週期，幾乎不變，稱為單擺的等時性。單擺的擺動週期，僅與擺長和重力加速度相關。週期T
    可以用以下公式表示：

    $T = 2\pi \sqrt{\frac{L}{g}}$

    T 是單擺的週期

    L 是擺長

    g 是重力加速度，會隨地點而改變

