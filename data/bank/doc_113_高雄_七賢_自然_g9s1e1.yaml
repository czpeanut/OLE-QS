- id: doc_113_高雄_七賢_自然_g9s1e1_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 用來辨別車輛有無超速行駛的計算公式為何？
  options:
  - label: A
    content: 由區間測速長度除以通過的時間
  - label: B
    content: 由進入時的速率與出口時的速率相加除以2
  - label: C
    content: 由進入時的加速度推算出口時的速率
  - label: D
    content: 由進入時的速率推算出口時的速率。
  group_stem: 【題組】過去警察取締超速，大都採用固定式超速照相機，導致不少習慣超速開車的人都是快到固定式超速照相機地點才減速。為降低超速肇事，警方參考國外做法自民國107
    年於新北市萬里隧道啟用「區間測速」，對於減少違規及降低交通事故發生有顯著成效。所謂的區間測速，是在道路設兩個監測站，用車子通過的時間判定有無超速。區間測速大都以常違規或易肇事的路段為主，實施區間測速的路段會設置警告牌面，一般道路設於起點前方100-300
    公尺(高快速公路為300-1000 公尺)，附牌文字為「前方區間測速長度○公里」。在實施測速路段內必須依速限規定行駛，若不慎超速不至於立刻構成違規，後續再注意減速即可，亦即存有補救之機會(固定式超速照相機則無)。現在有一筆直公路，限速時速60
    公里(60km/hr)，測速長度6 公里(6km)，根據以上描述回答第22~24 題：
