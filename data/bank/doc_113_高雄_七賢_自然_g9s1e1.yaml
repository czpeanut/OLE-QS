  stem: 2024 巴黎奧運定向飛靶比賽好手李孟遠為我們此次奧運獲得第一面獎牌。定向飛靶比賽是一項射擊運動，參賽者使用霰彈槍來擊中由飛靶機拋出的飛行目標（飛靶）。這些飛靶通常是圓盤形狀，經過塗色以便易於辨識。在比賽中，飛靶從不同的方向、速度和角度被拋出，射手需要在飛靶進入射程的短時間內擊中目標，不僅考驗選手的射擊技術，還要求他們具備快速反應和判斷的能力，是一項非常具挑戰性的射擊運動。請問比賽中選手霰彈槍子彈擊中飛靶的瞬間代表子彈和飛靶下列哪一個物理量相同？
  options:
  - label: A
    content: 位移
  - label: B
    content: 位置
  - label: C
    content: 路徑長
  - label: D
    content: 平均加速度。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 理化
      code: 1-1
      title: 位置、路徑長與位移
      chapter: 第1章 直線運動
    textbook: 九上理化 1-1 位置、路徑長與位移
    labeled_by: ai
