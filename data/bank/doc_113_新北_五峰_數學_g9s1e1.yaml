- id: doc_113_新北_五峰_數學_g9s1e1_s2_15
  section: 2
  number: 15
  type: fill
  page: 3
  stem: '通常我們用「坡度」來表示斜坡陡峭的程度，這個數值通常以百分比來表示，以下為斜坡角度與坡度的關係。

    坡度百分比＝$\frac{\text{鉛直上升高度}}{\text{水平移動距離}}\times 100\%$

    貓空為新北市著名的單車爬坡路線；從政大後門恆光橋出發至貓空明德宮為坡度10%的陡坡，總共爬升300 公尺，則此一路線的水平移動距離為  (15)  公尺。'
