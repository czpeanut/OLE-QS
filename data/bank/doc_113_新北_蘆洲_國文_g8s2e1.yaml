- id: doc_113_新北_蘆洲_國文_g8s2e1_s1_39
  section: 1
  number: 39
  type: single
  page: 5
  stem: 從上文來看，下列何者是印度最大的社會問題？
  options:
  - label: A
    content: 富者過於浪費奢侈
  - label: B
    content: 窮人過於樂天知命
  - label: C
    content: 嚴重的貧富差距問題
  - label: D
    content: 貧民窟成為新的觀光景點。
  group_stem: '題組丙

    一部描述印度貧民窟故事的電影《貧民百萬富翁》，不僅票房賣座，還榮獲第八十一屆奧斯卡金像獎多項獎項，也引起世人對印度現況的關注與討論。現實生活中，生長於孟買貧民窟的孩子，是否能夠靠著參加百萬有獎問答而成為富翁不得而知，但印度貧民問題十分嚴重，卻是一個不爭的事實。

    印度是一個文化古國，全國人口多達十一億，是世界人口數第二多的國家，長期以來有著嚴重的貧民問題。由於農村的貧窮落後，許多民眾紛紛前往都市找尋翻身的機會，寄居在大都市的貧民窟裡。

    所謂的貧民窟，通常是以簡單的鐵皮、塑膠板、布篷搭成的違建，沒有水電、浴廁，衛生條件十分惡劣，每個人居住空間不到一坪，每天的生活費只有新臺幣十元左右。全印度至少有四分之一的都市人口住在貧民窟裡，最大的都市孟買，更有超過七百五十萬人住在貧民窟中，形成了世界奇觀。狹窄擁擠的空間和惡臭不堪的環境，有如骯髒的牢籠般，他們就在這樣的環境中生養下一代。貧民窟的孩子，必須每天工作十幾個小時才能勉強填飽肚子，有時還要拾荒、乞討甚至偷竊以貼補生活。沒有教育、沒有知識，一無所有的他們，若是沒有奇蹟發生，一輩子可能只是重演父母的故事而已。

    印度自1990年經濟改革後，已開始高速發展，和中國、俄羅斯、巴西並列為金磚四國。2008年已成為全球第十大的經濟體，億萬富翁人數比臺灣還多，中產階級人數高達三億，則比美國總人口還多。但貧富懸殊已經到了非常嚴重的地步，是印度政府不得不正視的問題。'
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 國文
      code: 第六課
      title: 森林最優美的一天
      chapter: null
    textbook: 八下 第六課 森林最優美的一天
    labeled_by: ai
