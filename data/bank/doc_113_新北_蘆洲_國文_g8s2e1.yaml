  group_stem: "題組甲\n認識流行性感冒\n   流行性感冒不同於一般感冒，不僅症狀嚴重，對於體弱者還有致命的危險。目前流行性感冒之病毒大體上可分為A、B、C\
    \ 三型，其中A 型最容易造成全球的大流行。\n   不過近來B 型流感也有流行的趨勢。一般來說，B 型流感幾乎都會發燒、咳嗽、流鼻涕，還有百分之二十的病人有腸胃不適的症狀。至於A\
    \ 型流感與B 型流感症狀幾乎類似，但在臨床上，B 型流感患者出現腹瀉和肌肉酸痛的比例較高，症狀較明顯。\n※流感和普通感冒到底有哪裡不同呢？\n   流感通常在十一月到三月流行，與一般感冒是在秋冬兩季發生不同。每個人都有可能感染流感和一般感冒，但是流感的潛伏期比普通感冒長，一旦染上流感就會全身不舒服，不像普通感冒只是打噴涕、流鼻水、鼻塞等呼吸道症狀。感染流感後通常會高燒不退，與一般感冒的輕微發燒不同，因此染上流感，通常需要一到二個星期才能康復。\n\
    ※流感這麼危險，我們該如何預防呢？\n 1. 應考慮接受流感疫苗的接種，不過對「蛋」的蛋白質有嚴重過敏者，不建議施打。\n 2. 勤洗手，且在流感流行時，應避免出入公共場所，減少感染的機會。\n\
    \ 3. 平時保持正常作息和良好生活習慣，提升自己的免疫力。\n 〜只要做好預防流感的工作，就能維持健康〜"
