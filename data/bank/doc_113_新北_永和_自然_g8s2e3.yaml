- id: doc_113_新北_永和_自然_g8s2e3_s2_42
  section: 2
  number: 42
  type: single
  page: 5
  stem: 冰爪能夠有效防止人們在雪地中滑倒，是基於何種原理？
  options:
  - label: A
    content: 增加鞋底與地面的粗糙度以及嵌入作用
  - label: B
    content: 減少鞋底與地面的接觸面積
  - label: C
    content: 讓鞋子變得更重、增加穩定性
  - label: D
    content: 降低冰面的溫度，使其變得不滑。
  group_stem: '【冰爪的摩擦力原理】

    冰爪（crampons 或 microspikes）是用來在冰雪地面上行走時增加摩擦力的裝備。其原理主要基於增大接觸面的粗糙度與嵌入作用，以提升摩擦力，防止滑倒。

    1. 增大粗糙度：冰爪的設計中包含鋒利的尖刺，這些尖刺刺入冰面或雪地，使得接觸面不再是光滑的表面，而是多了許多細小的刺點，增加了粗糙程度。

    2. 嵌入作用：當使用者踩在冰面或雪面時，冰爪的尖齒會刺入冰層或壓實積雪，產生阻力，提升抓地力，即透過「機械嵌入」原理來提高摩擦效果。

    當我們在普通鞋底行走時，由於冰面非常光滑，最大靜摩擦力極小，因此容易滑倒。而冰爪的金屬齒能夠有效「咬住」地面，提高靜摩擦力，使我們能夠穩固站立並安全行走。'
  answer:
  - A
  answer_source: answer_key_vlm
  tags:
    chapter:
      publisher: 翰林
      book: 八下
