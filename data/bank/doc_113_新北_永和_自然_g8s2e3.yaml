- id: doc_113_新北_永和_自然_g8s2e3_s2_48
  section: 2
  number: 48
  type: single
  page: 6
  stem: 根據本文，請你判斷鐵達尼號下沉的主要原因為何？
  options:
  - label: A
    content: 船體體積突然增加
  - label: B
    content: 進水後，船的總密度超過水的密度，浮力無法支撐
  - label: C
    content: 船與冰山碰撞後失去動力導致下沉
  - label: D
    content: 冰山的浮力影響了鐵達尼號。
  group_stem: "【從浮力角度解析鐵達尼號沉沒的過程】\n    1912 年 4 月 15 日，號稱「永不沉沒」的鐵達尼號（RMS Titanic）在處女航中撞上冰山並最終沉沒，造成\
    \ 1500 多人罹難。這場災難背後除了船體設計、航行速度等因素外，還涉及了一個基本的物理概念—浮力。本文將以浮力原理來分析鐵達尼號在撞上冰山前後所經歷的變化。\n\
    一、鐵達尼號撞上冰山前的浮力分析\n   在正常情況下，鐵達尼號的總質量約為 52310 公噸，但因為其體積巨大，只要排開足夠的水量，便能產生足夠的浮力來維持漂浮。此外，鐵達尼號的設計採用\
    \ 16 個獨立的水密艙室，即使 2~4 個艙室進水，船仍能保持漂浮。\n撞擊冰山前，鐵達尼號的浮力特徵如下：\n1. 船體完整，浮力與船的重力達到平衡，因此能穩定漂浮。\n\
    2. 由於排水體積固定，浮力大小不變，船體不會下沉。\n二、撞上冰山後的浮力變化\n    當鐵達尼號撞上冰山時，冰山撕裂了船身右舷的鉚接鋼板，導致 5 個水密艙室進水，超過了設計可承受的範圍。這時，浮力開始發生劇變。\n\
    1. 進水導致船重增加\n    隨著海水不斷湧入，船體內部的空氣被水取代，由於船體主要是由密度較大的鋼鐵製成，一旦浮力無法支撐整艘船，它就會開始下沉。\n\
    2. 船首下沉，船尾上升\n    水首先淹沒了船頭，使船的重心前移，造成船首逐漸下沉，而船尾相對上升。這導致：\n• 前方水密艙室因為水壓上升，使更多水湧入，加速下沉。\n\
    • 甲板開始傾斜，增加了乘客與物品滑落的風險。\n3. 沉沒的臨界點\n    當水進入足夠多的艙室後，整艘船的平均密度超過了水的密度，浮力無法再支撐船體，導致最終沉沒。由於船體前後受力不均，當船尾抬升到一定角度後，結構無法承受壓力，最終折斷成兩截。\n\
    三、總結\n    鐵達尼號的沉沒過程展現了浮力的基本原理：當水密艙室受損進水，排水體積減少，浮力無法支撐船體時，沉沒便無可避免。這場災難促使後續船舶設計改進，如增加水密隔艙的高度與改進救生設備，以提升航海安全。"
  answer:
  - B
  answer_source: answer_key_vlm
