  group_stem: "【拯救地球是你我的責任】\n溫室效應是個自然的過程，使地球維持在生物可以生存的溫度，不然地球的平均溫度就會只有-18 °C 而已！水氣、二氧化碳、甲烷或一氧化二氮，也是大家常聽到的溫室氣體。這些氣體會吸收一部分的太陽能量，並且降低熱量的流失率，這就是溫室效應的效果！所以大氣中這些氣體的濃度越高，地球就會變得更溫暖。\n\
    \    人類的工業活動破壞了這個脆弱的平衡，排放了這類溫室氣體，特別是二氧化碳的濃度，從18 世紀後上升了47%，被認為佔了人為溫室效應的65%。這些氣體排放增加會直接造成地球暖化。法國哲學家Dominique\
    \ Bourg 提醒我們：「地球平均溫度變化跟對天氣的變化是完全無法相比」。氣溫平均值如果提升2°C，就會讓法國夏天的氣溫飆升到50°C。地球溫度上升的影響在全球都可以看到了，像是：澳大利亞和加州大火、加拿大熱浪、海洋酸化、日本沿海洪水、德國比利時大雨、脊椎動物44\
    \ 年內減少60%......\n    列出全球暖化會造成的一系列影響後，我們更了解測量人類活動對溫室氣體濃度影響的重要性，二氧化碳排放測量更是重要。這個評估讓我們計算污染最多的活動，及有機會減少這些活動。如下圖，碳足跡標籤，又稱碳標籤或碳排放標籤，是一種用以顯示公司、生產製程、產品（含服務）及個人碳排放量之標示方式，其涵義是指一個產品從原料取得，經過工廠製造、配送銷售、消費者使用到最後廢棄回收等生命週期各階段所產生的溫室氣體，經過換算成二氧化碳當量的總和。\n\
    \    要節能減碳，其實有一個很好的方法，就是做到「環保5R」。5R 包含：\n1.Refuse(拒絕)：拒絕使用不符合環保原則的產品，例如拋棄式用品、不易回收材質的產品。\n\
    2.Reduce(減量)：減少使用產品，以減少資源的消耗及廢棄物的產生。\n3.Reuse(重複使用)：重複使用容器、袋子，或是將自己不再使用的東西捐贈或出售。\n\
    4.Recycle(回收)：將不再使用的紙類、寶特瓶、塑膠、電池、光碟等送到資源回收站。\n5.Regenerate(再生)：以資源回收物為原料，製造新產品。\
    \                           參考資料：迪卡儂運動誌"
