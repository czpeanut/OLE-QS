  section: 1
  number: 1
  type: single
  page: 1
  stem: 非洲有5.89 億人口無法用電，佔全球無電人口的75%以上。長期以來的電力短缺，不僅影響經濟發展，更直接影響人民的日常生活。2025 年2 月非洲史上最大電力投資案：300
    任務啟動（Mission 300），將投入至少350 億美元，期望在六年內讓3 億人獲得電力。請問：可預期在東非大裂谷取得哪些再生能源發電，來擴大非洲的電力供應？(甲)水力發電；(乙)地熱發電；(丙)風力發電；(丁)潮汐發電。
