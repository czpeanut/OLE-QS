- id: doc_112_高雄_林園_社會_公民_g7s2e2_s1_36
  section: 1
  number: 36
  type: single
  page: 1
  stem: 下列四種團體的目的，哪個屬於滿足情感需求的目的？(習作)
  options:
  - label: A
    content: 阿雅參加教會團契，希望認識更多朋友
  - label: B
    content: 小娟參加籃球社，希望能夠增加自己籃球技巧
  - label: C
    content: 小沁參加同學組的讀書會，希望段考名次能進步
  - label: D
    content: 曉萱參加愛盲基金會有聲書錄音志工隊，希望幫助視障者
  answer:
  - A
  answer_source: answer_key_vlm
- id: doc_112_高雄_林園_社會_公民_g7s2e2_s1_37
  section: 1
  number: 37
  type: single
  page: 1
  stem: 參與學校的社團活動，成為國中學生參與團體難忘經驗與人生記憶。下列四位學生談論到參加社團對自己的影響，何者是以達成共同目標為目的？(習作)
  options:
  - label: A
    content: 雅筑：我參加國樂社發現自己越來越進步，更勇於表現自己。在那個環境，因為大家都很厲害讓我有自學動力。
  - label: B
    content: 丞傑：我國一參加攝影社、國二參加烹飪社。因為不是很喜歡唸書，所以想藉由社團活動來探索興趣，了解自己。
  - label: C
    content: 怡珍：在籃球隊裡，我們會一起為了下次能進入到全國比賽而努力
  - label: D
    content: 怡德：我因為參加管樂隊，學會與不同的人相處。曾經在社團跟學長姐起過衝突，因此學習化解矛盾的方法
  answer:
  - C
  answer_source: answer_key_vlm
