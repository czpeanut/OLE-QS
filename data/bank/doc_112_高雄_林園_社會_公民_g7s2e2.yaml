  stem: 以參與團體的目的來說，有的人想藉此滿足情感的需求，有的人則想與理念相同者，共同實現團體的工作目標。下列哪一個團體的實際運作，同時滿足上述兩種需求？
  options:
  - label: A
    content: 環保團體前往淨灘，實踐自然環境保育的工作
  - label: B
    content: 宗親會為助童基金募款，以幫助貧困學生完成學業
  - label: C
    content: 校友會舉辦烤肉活動，凝聚成員的向心力
  - label: D
    content: 伊甸基金會提供身心障礙者居家照顧服務。
  answer:
  - B
  answer_source: answer_key_vlm
