  stem: '童童從官網查到「台灣世界展望會」的介紹──

    成立於西元1964 年，致力幫助國內外貧童邁入自立，由資助兒童計畫結合眾多資助人捐助，幫助貧童獲得水、食物、教育及健康照護。

    對此童童在聯絡簿寫下他對世界展望會的看法，其中下列何者有誤？'
  options:
  - label: A
    content: 發揮對公共生活的影響力
  - label: B
    content: 與家庭皆屬於志願團體
  - label: C
    content: 為弱勢群體爭取權益
  - label: D
    content: 促進公帄正義的實現
  answer:
  - B
  answer_source: answer_key_vlm
- id: doc_112_高雄_林園_社會_公民_g7s2e2_s1_41
  section: 1
  number: 41
  type: single
  page: 1
  stem: 澤澤在早餐時間瀏覽新聞，看到下表四則報導，根據報導內容，何者顯示出該志願結社團體能夠監督政府施政？
  options:
  - label: A
    content: 第一則：疫情送暖，企業崇越電攜手臺北陽光扶輪社，贊助捐贈博幼基金會長期獎助學金，援助支持偏鄉輔導教育計畫。
  - label: B
    content: 第二則：創世基金會自己找柚農、果農合作賣柚子和水梨，受疫情影響銷售不佳，亟需各界送暖。
  - label: C
    content: 第三則：血液基金會宣布展開捐血室推廣計畫，鼓勵民眾捐血，無法到場聲援的奧運羽球雙打金牌特別錄製影片，呼籲年輕人「熱血」響應。
  - label: D
    content: 第四則：臺灣動物保護行政監督聯盟對於政府執行走私品種貓的人道銷毀做法，希望政府正視防疫和人道之間的衝突引發的沸騰民意。
  answer:
  - D
  answer_source: answer_key_vlm
- id: doc_112_高雄_林園_社會_公民_g7s2e2_s1_42
  section: 1
