  page: 6
  stem: 根據本文，「石龜目赤」是什麼原因造成的?              【閱讀素養題】
  options:
  - label: A
    content: 稚子在石龜目塗上朱色顏料
  - label: B
    content: 石龜感應城將陷而眼珠變紅
  - label: C
    content: 龍化身的老叟施展法術所致
  - label: D
    content: 老姥情急之下一時眼花看錯
  group_stem: '古巢一日江水暴漲，尋①復故道。港有巨魚，重萬斤，三日乃死。合郡皆食之，一老姥獨不食。忽有老叟曰：「此吾子也，不幸罹此禍。汝獨不食，吾厚報汝。若東門石龜目赤，城當陷。」姥日往視。有稚子訝之，姥以實告。稚子欺之，以朱傅②龜目。姥見，急出城。有青衣童子曰：「吾龍之子。」乃引姥登山，而城陷為湖。                             ――干寶
    搜神記


    【注釋】①尋：不久   ②傅：塗抹'
