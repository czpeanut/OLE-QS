- id: doc_113_新北_福和_國文_g8s1e2_s4_30
  section: 4
  number: 30
  type: single
  page: 4
  stem: 作者在網上投書的「用意」，最可能是要說明什麼？       【閱讀素養題】
  options:
  - label: A
    content: 政府推動喝鮮乳政策對學童營養的影響
  - label: B
    content: 「班班喝鮮乳」政策的推動困境與影響
  - label: C
    content: 保久乳價格的上漲來自消費者預期心理
  - label: D
    content: 「台、紐經濟合作協定」缺乏配套措施
  group_stem: "【投書】「班班喝鮮乳」政策下，學生真的喝到鮮奶了嗎？\n   「班班喝鮮乳」的政策背景，是為了因應2013 年的「台、紐經濟合作協定」，雙方協議逐年降低紐西蘭進口鮮乳關稅，並自2025\
    \ 年起降為零關稅。因為預期這項政策會對國內乳品市場造成潛在衝擊，農業部為穩定國內乳品供應，並鼓勵學生飲用國產鮮乳、增加鈣質攝取，編了4 年44 億元的預算，與教育部聯手推出「班班喝鮮乳」政策，希望自2024\
    \ 年9 月起，每週提供國小學生及附設幼兒園學童2 次國產鮮乳，一方面可提升學童營養狀況，另一方面也協助本土酪農面對進口鮮乳的競爭。\n    政府信誓旦旦：今年9\
    \ 月底前國小學童一定可以喝到鮮乳。但以新北市為例，截至2024 年10 月中旬，212 所公私立國小喝到乳品的僅51 校，不到25%。\n    此政策首當其衝的是各縣市政府。農業部雖編列44\
    \ 億經費，但執行時，各縣市仍需自掏腰包來應付鮮乳採購、冷藏設備購置、配送過程中的各項開支，財政狀態吃緊的縣市無法如期達成政策要求，因而延遲。\n    學校也面臨困境，雖然鮮乳營養價值高於保久乳，但學校普遍沒有這麼多冷藏設備足以維持鮮奶品質，以至於超過75%的學校選擇保久乳。一旦學童習慣喝保久乳後，國內鮮乳業者日後將會更難以生存，屆時國內酪農可能會有半數要關場。\n\
    \    結果，原本要推廣鮮乳救國產酪農業的目標難以達成，部分消費者發現保久乳已悄悄漲價，據媒體指出，現在3 箱保久乳價格已經上漲到1,080 元，相較原先的3箱800\
    \ 元，漲幅超過1／3。\n    筆者認為，若要實現「班班喝鮮乳」的目標，政府需進一步思考配套措施。\n        —全國教師工會總聯合會 專業發展中心執行長\
    \  葉蕙芬 2024.10.20"
