  - label: C
    content: 提醒社區圖書館藏書應符合居民需求
  - label: D
    content: 惋惜館內藏書乏人問津，借閱量不高                             【第六課】
  group_stem: "一間會呼吸的圖書館，有著會讀書的椅子。隨著椅子的空間感，我感覺身體和書有了不同的距離，坐看立看臥看閒散看……，人和書很近也很遠。\n\
    \   近的是，書隨意可得；遠的是，美麗的風景常讓我分心，因而忘書。\n   臺北市圖 北投分館，有著各種椅子，方形長形圓形、木椅皮椅石椅……，我總是在椅子與椅子間轉換我的靈魂，以攝取不同的知識。坐上不同的椅子，身體即有迥異的姿勢，而從姿態大約可嗅出我是在讀什麼樣的書了。\n\
    \   我這隻食字獸，先是爬上二樓，扭開書架上的圓形小立燈，在語文類書籍上梭巡當代小說。站著翻翻，確定可帶走的書後，我走至長條木椅讀著，後方的整片挑高窗成了我的閱讀背景。\n\
    \   讀累了小說，走至走廊，順勢就往木棧道座椅上一坐。書也不興著看，這走廊的綠樹參天，蝶影掠過眼皮下，溪流旁有蕨類、鐵樹、榕樹，再加上刻意植栽著許多誘鳥與誘蟲植物，我感覺這些誘鳥誘蟲植物是來引誘我的。四周如張綠網，網住了我心，身處此幽雅長廊，我常忘了我是來看書的。\n\
    \    這間圖書館是樓層愈高顏色愈重，光線愈沉，和藏書分類約是有關，較難讀的大都擺在高樓層，期刊書和一些大眾書有的就擺在光線亮而木頭色輕的一樓。最討喜的兒童閱讀區在地下室，擺設的是圓環形皮椅，讓小小愛書人在翻書之餘，也可爬可玩。\n\
    \    在我看來，北投圖書館比較像是社區圖書館，它是親民的，是開放性的，是結合當地人文的。前來的學生大都帶著學校的教科書來做功課，也因此圖書館美則美矣，書卻顯得寂寞。\
    \                  —節選自鍾文音 我在圖書館的一天"
