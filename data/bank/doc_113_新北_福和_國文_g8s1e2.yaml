  section: 3
  number: 6
  type: single
  page: 1
  stem: 「一場為時一小時的大西北雨，到底下了幾公釐的水，雖然沒做過實驗，只覺好像天上的水壩在洩洪似的，是整個倒下來的。每一雨粒，大概最小還有拇指大，像這樣大的雨粒，竹葉笠是要被打穿的，沒有蓑衣遮蔽，一定被打得遍體發紅。」阿雄整理大西北雨的特色，哪一項無法從文中得知?                           【第四課】
  options:
