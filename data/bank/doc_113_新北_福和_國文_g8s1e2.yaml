- id: doc_113_新北_福和_國文_g8s1e2_s4_34
  section: 4
  number: 34
  type: single
  page: 5
  stem: 關於「客家土樓」的訊息，下列何者本文並未提及?        【閱讀素養題】
  options:
  - label: A
    content: 型式
  - label: B
    content: 格局
  - label: C
    content: 歴史
  - label: D
    content: 文化
  group_stem: "甲、\n\n乙、客家土樓閉鎖型多是大型聚族住宅，以圓形土樓而言，走入唯一的出入大門，就能領會到家族傳統「集」的文化禮制。門廳是出入通道與家族聚會休閒之所，中間是天井，所有房間的形狀、大小相同，門窗都朝向天井。因為土樓外牆與房間內牆都是同心圓切成的圓弧，城外長內短，分割房間的牆都呈放射狀，當地人稱斧頭間。圓土樓無論大小，樓上樓下的房間都面積相同，底層除廳堂、樓梯間，一定是廚房和餐廳，二層是倉庫，三層以上是臥室，各層有迴廊。所有圓土樓屋頂都非常平緩，青瓦、簷長，使樓外圈形成周走廊，與閩南建築的不出簷①，反應出截然不同的文化。\n\
    ――改寫自林嘉書 土樓――凝固的音樂和立體的詩\n 【注釋】①出簷：指超出房屋外牆的屋頂，具有防雨、防晒等功能。"
