- id: doc_113_新北_福和_國文_g8s1e2_s3_7
  section: 3
  number: 7
  type: single
  page: 1
  stem: "「終於雷聲愈來愈遠，電光只在遙遙的天邊橫掃。太陽又出來了，一片清新的空氣、鮮潔的色彩，彷彿聽見了貝多芬 田園交響曲第四樂章牧羊人之歌。」作者以聽覺印象表現視覺效果，下列何者也運用相同的表現手法?\
    \  \n  (A)我聽到溪水潺潺聲，彷彿看見它在對我微笑 \n  (B)小草在晨風中搖曳，就像在跳一支無聲的舞蹈 \n  (C)山谷中雲霧繚繞，如輕柔的樂曲一般在空中飄蕩\
    \ \n  (D)花香撲鼻而來，好似在耳邊低語訴說著春天的故事                 【第四課】"
  options:
  - label: A
    content: 我聽到溪水潺潺聲，彷彿看見它在對我微笑
  - label: B
    content: 小草在晨風中搖曳，就像在跳一支無聲的舞蹈
  - label: C
    content: 山谷中雲霧繚繞，如輕柔的樂曲一般在空中飄蕩
  - label: D
