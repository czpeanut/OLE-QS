- id: doc_113_新北_福和_國文_g8s1e2_s3_5
  section: 3
  number: 5
  type: single
  page: 1
  stem: "「低著頭一心一意要把番薯蒂趕快摘完，霎時間，①天昏地暗，抬頭一看，黑壓壓的，②滿天烏雲，盤旋著，自上而下，直要捲到地面。這種情況，在荒野中遇到幾回。③只覺滿天無數黑怪，張牙舞爪，盡向地面攫來。④四顧無人，又全無遮蔽，大野中，孤伶伶的一個人，不由膽破魂奪。」\
    \                                 \n   關於這段話畫線處的寫作分析，下列何者敘述最恰當?              \
    \ 【第四課】"
  options:
  - label: A
    content: ①以動態描寫刻劃烏雲密布的景象
  - label: B
    content: ②以靜態描寫刻劃滿天烏雲的景象
  - label: C
    content: ③運用譬喻和轉化描摹烏雲密布的景象
  - label: D
    content: ④以寫實手法形容天色變換下人們的恐懼
  lesson_raw:
