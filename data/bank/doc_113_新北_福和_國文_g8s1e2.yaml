    \ 作聲。鬼復言：「何以作聲？」定伯曰：「新死不習渡水耳，勿怪！」\n   行欲至宛市，定伯便擔鬼至頭上，急持之，鬼大呼，聲咋咋，索下，不復聽之。徑至宛市中，著地化為一羊，便賣之。恐其變化，唾之，得錢千五百，乃去。\n\
    \   當時有言：「宗定伯賣鬼，得錢千五百。」        —《列異傳‧定伯賣鬼》\n【注釋】①將：可能   ②因：於是  ③ 漕漼：ㄘㄠˊ ㄘㄨㄟˇ形容渡水時發出的聲響"
