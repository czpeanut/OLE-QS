  stem: 根據本文，關於人與鬼的比較，下列說明何者錯誤？                 【自學二】
  options:
  - label: A
    content: 鬼學藝不精，反被人制服；人沉著應變，終逆轉頹勢
  - label: B
    content: 鬼心無防備，以真誠待人；人城府頗深，以謊言自保
  - label: C
    content: 鬼主動提問，卻易被說服；人戒慎寡言，卻保持警戒
  - label: D
    content: 鬼由令人畏懼變落魄無助，人由被動配合變主動出擊
  group_stem: "南陽 宗定伯，年少時，夜行逢鬼。\n    問曰：「誰？」鬼曰：「鬼也。」鬼曰：「卿復誰？」定伯欺之，言：「我亦鬼也。」鬼問：「欲至何所？」答曰：「欲至宛市。」鬼言：「我亦欲至宛市。」\n\
    \    共行數里，鬼言：「步行太極，可共迭相擔也。」定伯曰：「大善。」鬼便先擔定伯數里。鬼言：「卿太重，將① 非鬼也？」定伯言：「我新死，故重耳。」\n\
    \   定伯因② 復擔鬼，鬼略無重。如是再三。定伯復言：「我新死，不知鬼悉何所畏忌？」鬼答曰：「唯不喜人唾。」\n   於是共行，道遇水，定伯命鬼先渡，聽之，了無聲。定伯自渡，漕漼③\
    \ 作聲。鬼復言：「何以作聲？」定伯曰：「新死不習渡水耳，勿怪！」\n   行欲至宛市，定伯便擔鬼至頭上，急持之，鬼大呼，聲咋咋，索下，不復聽之。徑至宛市中，著地化為一羊，便賣之。恐其變化，唾之，得錢千五百，乃去。\n\
    \   當時有言：「宗定伯賣鬼，得錢千五百。」        —《列異傳‧定伯賣鬼》\n【注釋】①將：可能   ②因：於是  ③ 漕漼：ㄘㄠˊ ㄘㄨㄟˇ形容渡水時發出的聲響"
