- id: doc_113_新北_福和_國文_g8s1e2_s3_33
  section: 3
  number: 33
  type: single
  page: 5
  stem: 關於本文的寫作特色，下列敘述何者正確？                  【閱讀素養題】
  options:
  - label: A
    content: 運用倒敘法強調陶淵明的性格特徵
  - label: B
    content: 透過數據分析來重新詮釋詞語典故
  - label: C
    content: 採用對比方式說明古今官員薪資的差異
  - label: D
    content: 以抒情筆調描寫陶淵明辭官的心境轉折
  group_stem: "壓垮陶淵明的最後一根稻草是什麼？\n陶淵明在擔任彭澤縣令時，面對長官視察，雖然不願意迎合官場的排場，但仍不得不出面。其他官員提醒他要穿上正式的官服，以免失禮，這讓陶淵明感到憤怒，並激動地說：「吾不能為五斗米折腰，拳拳事鄉里小人邪！」他決定辭官，拒絕因為微薄的薪水對粗鄙的小人低頭。\n\
    東晉的俸祿制度是「半錢半穀制」，陶淵明的月薪為「月錢二千五百，米十五斛」。單看米的部分，每月可獲得15 斛，約相當於150 斗，換算後相當於每日5 斗米。假設2500銀兩與15\
    \ 斛米價值相等，若將銀兩全換成米，陶淵明每月可領到300 斗米，即613,500毫升的米。\n五斗米，很少嗎？\n以粳米（蓬萊米）的密度（0.85 公克／毫升）計算，陶淵明一個月的薪水約521.475公斤的米。按每公斤可煮13.5\
    \ 碗飯計算，陶淵明的月薪足以供應他六年半的米，這樣的薪水讓人難以理解他為何不考慮在官場稍微忍氣吞聲點。\n職位不低，薪水卻不及基本工資？\n若按2022\
    \ 年粳米的價格（每公斤45.46 元）估算，陶淵明的月薪相當於當今的23,706元，連基本工資都達不到。但是，跟中國古代相比，現代的農業技術更為發達進步，再加上科技的推動，讓農業收穫成本大幅降低。所以現在的米價應該比古代來得低廉許多，倘若古代米價約莫當今米價的8\
    \ 至10 倍，那麼，陶淵明的月薪或許不遜於現今縣(市）長的18 萬月薪。\n因此，陶淵明辭職的原因很簡單：老闆給的薪水配不上他的付出與價值。他才能視百萬年薪為無物，拋出一句「歸去來兮」的千古名言，從此過著只有詩跟酒的生活。\n\
    \             ――改寫自數感實驗室 陶淵明不為五斗米折腰，是因為五斗米太少？"
