  section: 3
  number: 2
  type: single
  page: 1
  stem: 下列四則新聞報導中，何者沒有錯字?                                【字形】
  options:
  - label: A
    content: 周杰倫將於12 月上旬舉辦演唱會，由於黃牛利用非法程式大量搶票，引爆歌迷怒火，警方雷力風行的展開查輯行動，破獲「全國最大販售黃牛票集團」
  - label: B
    content: 山陀兒颱風路徑鬼譎多變，重創全臺，高雄 那瑪夏區土石流災情嚴重，其中八戶的農民，處境更是急急可危
  - label: C
    content: 藝人鳳小岳從演員斜槓當歌手，八月參加綜藝節目《披荊斬棘第四季》，以吉他自彈自唱驚豔全場，大批粉絲守在螢光幕前爭睹他的風采
  - label: D
    content: 產地蛋價大跌導致部分雞場歇業，零售蛋價卻居高不下。面對立委怦擊，農業部長表示：將負起相關責任，絕不戀佔職位
