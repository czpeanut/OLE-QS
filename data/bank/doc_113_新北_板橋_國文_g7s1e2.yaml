  section: 2
  number: 26
  type: single
  page: 5
  stem: 根據本文，下列何者最能表現作者在創作時的心理變化過程？
  options:
  - label: A
    content: 起初：痛苦不堪／過程：陶醉享受／最後：心靈解放
  - label: B
    content: 起初：喧囂嘈雜／過程：專注忘我／最後：忐忑不安
  - label: C
    content: 起初：氣定神閒／過程：緊張焦慮／最後：自由翱翔
  - label: D
    content: 起初：灰心喪志／過程：戰戰兢兢／最後：自信滿滿
  group_stem: "請閱讀以下短文，並回答26～27 題：\n  我一直不能明白，為什麼我樂於從事筆耕？為什麼我願意在孤獨的燈前，字斟句酌，反覆推敲，一次又一次地煎熬自己的情感，甚至逼出自己的眼淚，引發内心深深之處的微笑？我不知道為什麼我要這樣做，就像春蠶不知道為什麼要吐絲成繭，完成它生命的任務一樣。\n\
    \  而當創作的衝動，以一種淹沒人的洶湧，排山倒海而來；當我開始沉浸在有形的紙、筆，與無形的思想、情感所架構的世界中，我便超越在所有的快樂與不快樂之上。那是一種歸真返璞、天清地寧的感覺，一切都那麼自然而順理成章，彷彿滾滾紅塵、悠悠歲月，只有此刻此境，我和自己才如此貼近，如此親密。\n\
    \  而在那樣的寧靜與孤獨中，一方碧湖清澗往往自內心深處呈現，清晰地映照出生命中的雲影天光。所有騷動的影子都靜止下來，所有浮囂的意緒也逐漸沉澱；我為寫作而存在，無需酬酢、無需應付、無需違心言笑；天地是如此廣闊，心靈如此自由，藉著寫作，我終於傾注了自己對自己、對生命、對這整個世界最真誠無偽的熱愛。\n\
    \  而當一篇作品終於完成，當我從專注忘我的世界裡，重又落實到現實生活的層面中時，懷著疲倦，我只感到一種踏實的喜悅與滿足。\n——改寫自陳幸蕙〈把愛還諸天地〉"
  answer:
  - A
  answer_source: answer_key_vlm
  tags:
