- id: doc_113_新北_忠孝_社會_地理_g8s2e2_s3_25
  section: 3
  number: 25
  type: single
  page: 2
  stem: 請問坎兒井引用的水源主要為下列何者？
  options:
  - label: A
    content: 河水
  - label: B
    content: 雪水
  - label: C
    content: 雨水
  - label: D
    content: 地下水。
  group_stem: "※ 「那年夏天，飛機還沒在伊斯法罕（伊朗第三大城市）降落，我透過飛機舷窗向外望。這到底是什麼？我獨自思忖著。窗外的景象彷彿是巨大蟻穴間的十字，或是外星人留下的神秘印記。彼時的我還是少年，對於這神秘的外衣下究竟藏著什麼，還知之甚少。\n\
    \    坎兒井是一條地下水道，將高處山地水源引向海拔較低處，用來灌溉農田。這是山地解決乾旱問題的絶佳方法。通過沖積扇（山腳的扇形堆積體）找到可能的水源，再向下挖掘\"\
    蟻穴\"似的豎井，連接到水源。有些豎井不需要挖太深，有些則深達300 多米。每隔一段就會有一個蟻穴似的豎井，數量非常多，排出土壤的同時為掏土工人提供新鮮空氣。更加困難的是，坎兒井的坡度需要經過凖確計算：坡度太大，水流會侵蝕坎兒井；太過平緩，水流又難以流動。」以上為某一電台記者針對坎兒井的旅遊解說，請根據上文回答下列問題；"
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 地理
      code: 3-1
      title: 自然環境
      chapter: 第3章 西亞與北非的自然環境與文化
    textbook: 八下地理 3-1 自然環境
    labeled_by: ai
