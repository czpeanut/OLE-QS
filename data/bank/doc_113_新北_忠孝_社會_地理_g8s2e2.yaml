  stem: 穆斯林日常生活嚴守五種功課，其中「課」成年教徒必須奉獻部分所得予清真機構，「齋」則是教徒在齋戒月須於日落後才能進食。請問「課」和「齋」的生活規範最可能反映了何種地理環境的特色？
  options:
