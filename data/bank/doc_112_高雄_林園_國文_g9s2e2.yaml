  stem: 寫景時會由不同角度描寫景物，請判斷下列文句何者是從仰視描寫?
  options:
  - label: A
    content: 屋頂上的雪，昨天融化了一些之後，有的來不及滴落而被夜裡的冷氣凍結成許多支尖削的冰柱，高高垂懸在屋簷邊。（陳列〈三月合歡雪〉）
  - label: B
    content: 吊橋似已腐朽，搖搖欲墜，晃蕩不止，透過破損的橋板看下去，橋下正是麗水溪上游那崖壁直下與叢林密布，足以讓人粉身碎骨的深處。（林銓居〈二坪：我的里山〉）
  - label: C
    content: 音樂響起，飛機準備降落，先是蜿蜒的淡水河，天氣好的時候可以看到積木一般的一○一大樓，然後飛機會稍稍傾斜，優雅華麗的轉身，飛越新竹近海，黃昏時刻可以看到帄鎮、中壢、大園一窪一窪的陂塘，琥珀色的池面倒映夕陽，波光粼粼。（曾郁雯〈起飛與降落〉）
  - label: D
    content: 湖上影子，惟長堤一痕、湖心亭一點、與余舟一芥、舟中人兩三粒而已。（張岱〈湖心亭看雪〉）
  answer:
  - A
  answer_source: answer_key_vlm
