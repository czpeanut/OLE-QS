    現代人最不可救藥的弱點，就是深亯科技和錢幣萬能。用錢幣堆積起來的鋼筋水泥結構，使大多數的人遺忘了生命本身脆弱的事實，而活在虛假和想像的安全感中。颱風過後，我們固然應該嚴肅檢討追究種種責任之歸屬，但是，怎樣恢復我們和孙宙萬物一體的敏感度？怎樣調整我們和大自然的關係？怎樣節制我們自大、貪婪的妄念、畸想⑦？恐怕才是更根本的。如果檢討中只讓我們學會指責，重建中只讓我們更忙於包工程，關懷中只讓我們懂得捐錢，那麼，我們就真的辜負了賀伯給我們帶來的教誨。

    注釋: 滿目瘡痍：形容所見到的都是殘破不堪的景象。當口：正值某個時機。負笈：出外求學。瞠目結舌：睜大眼睛說不出話來。形容吃驚、受窘的樣子。洪荒：最原始、古老的時代。肅殺：嚴厲而有摧殘的力量。畸想：不正當的想法。'
  answer:
  - D
  answer_source: answer_key_vlm
