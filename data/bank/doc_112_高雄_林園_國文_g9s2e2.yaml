  group_stem: '古代燒造陶瓷的窯爐類型

    窯爐是燒造陶瓷器的場所。中國古代窯爐類型很多，較著名的窯型如下：

     橫穴窯：流行於新石器時代，升溫較快，但不易控制燒成溫度和燒製的程度，商周時期已罕見。

     豎穴窯：常見於新石器時代遺址。建在地下，火膛（燃燒室）為小口廣底的袋形坑，其上為窯室，窯室出口開在地面。不易控制燒成溫度和燒製的程度，後逐漸被饅頭窯取代。

     饅頭窯：亦稱「圓窯」，常見於中國北方，至遲在商周時期就已出現。火膛和窯室合為一饅頭形的空間，窯頂呈半圓形，故名。容易控制燒成溫度，保溫性好。

     龍窯：亦稱「長窯」，是中國南方常見的窯爐類型，最早出現在商代。依山而建，形體狹長，當窯火點燃時，遠望似一條俯衝的火龍，故名。建築方便、裝燒量大，升溫降溫迅速，容易掌控窯內的溫度。

     階梯窯：建在坡度帄緩的山坡上，由若干相對獨立的窯串聯成整體。出現於明代，既有龍窯燒量大的長處，又有饅頭窯易控制的優點。

     葫蘆窯：窯室比饅頭窯長，腰部內折，分為前後兩室，前大後小，前室有火膛，後室設煙囪。由龍窯發展而來，至明末清初，後室比例縮小進而消失，逐漸發展成蛋形窯。

     蛋形窯：形似覆蓋在地的半個蛋，故名。窯室前部高而寬，後部低而窄。結構合理，設計科學，造價低廉，裝燒量大，為清代景德鎮地區焙燒瓷器的主要窯型。'
  answer:
  - B
  answer_source: answer_key_vlm
