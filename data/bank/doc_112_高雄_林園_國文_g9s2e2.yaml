  group_stem: '封禪泰山是評價一個皇帝在任期間功績的標準，作為曠世盛典，儀式極為隆重。泰山 天柱峰的西北側，有一塊高大的石碑，上面刻著「古登封臺」四個大字，就是歷代帝王到泰山告祭的封祀臺。帝王登泰山頂築壇祭天叫「封」，然後到泰山下面的梁甫或其他山上辟基祭地叫「禪」。封禪極其勞民傷財，一般是內風調雨順、外無強敵窺伺的年代，帝王才敢上泰山。但是看看泰山歷史，盛世皇帝如唐太宗就沒上山，大概是好大喜功的帝王，如秦始皇、漢武帝、唐玄宗等才會封禪表揚自己，亡國的秦二世也封禪，他的封禪刻石是丞相李斯篆書鐫刻而成。

    ―改寫自吳真《唐詩地圖》'
  answer:
  - D
  answer_source: answer_key_vlm
