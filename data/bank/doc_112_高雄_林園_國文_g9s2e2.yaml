    魯汶，面對西歐四季分明、色彩繽紛的氣候，颱風便成了我唯一足堪嚇唬白人娃娃的冒險故事。大樹連根拔起，十七級風，巨浪拍岸，山洪暴發，河水驟漲，道路、橋梁斷裂，房屋倒塌……，這種集中壓縮在數小時內的自然摧毀力，往往可以使我的歐洲朋友瞠目結舌④，彷徂重返洪荒⑤的神話時代。

