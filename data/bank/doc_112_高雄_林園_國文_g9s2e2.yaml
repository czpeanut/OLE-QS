  stem: 作者在文中列舉許多古今行旅之例，下列說明何者與作者舉例的用意最接近？
  options:
  - label: A
    content: 以兒時全家從臺北到日月潭旅行，天亮時出發卻近黃昏才到達為例，說明臺灣地形特殊，東西向來往不易的特色
  - label: B
    content: 以蘇軾的詩作〈和子由澠池懷舊〉中，當年蘇家兄弟旅途困厄幸得老和尚招待一事，說明社會上不乏善心人士，處處充滿溫情
  - label: C
    content: 以《西遊記》裡，唐僧與徒弟取經途中遭遇許多妖魔精怪為例，說明在求「道」的過程中，本會歷經種種挑戰與險阻
  - label: D
    content: 以〈為學一首示子姪〉中，富和尚對於窮和尚成功往返南海而面露愧色一事，說明人之所以輕視他人，往往是出自於內心深處的自卑感。
  answer:
  - C
  answer_source: answer_key_vlm
- id: doc_112_高雄_林園_國文_g9s2e2_s1_13
  section: 1
