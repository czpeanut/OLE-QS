- id: doc_112_高雄_林園_國文_g9s2e2_s2_32
  section: 2
  number: 32
  type: single
  page: 4
  stem: 「在此一大孙長宙中，人只是滄海之一粟，風雨水火甚至草木瓦石，都是我們有機孙宙的一部分。它們的活力和威力，都會在適當的時機展現出來。看那滔滔洪水，看那滾動、崩裂的巨石，看那無形的風力，颱風讓大自然的一切活力如脫韁的野馬，揮灑得淋漓盡致，其場面之浩大，只能用神話語言去加以捕捉。」關於這段文字的含義，下列敘述何者正確？
  options:
  - label: A
    content: 風雨水火的無情肆虐對人類生命造成威脅，人唯有征服自然才能免於災厄
  - label: B
    content: 大自然的威力透過颱風展現出來時，足以使人類感受到自我的渺小
  - label: C
    content: 孙宙是充滿活力的，居處其間的人們應效法其精神，自強不息
  - label: D
    content: 颱風在神話中常化身為野馬，所到之處皆山崩地裂，場面十分浩大。
  group_stem: '賀伯颱風剛過，各地滿目瘡痍①，在此當口②，說我從小便喜歡颱風，必遭人白眼，怎麼如此這般幸災樂禍？然而童年印象裡，颱風又確實曾經帶給我種種難忘的記憶。矛盾的心情，總是在每次風雨過後，徘徊胸中，揮之不去。

    現在仔細回想起來，我之所以喜歡颱風，固然有童心無忌，不知人間苦難的嫌疑。但是，每年夏季多風、多雨的東臺灣，的確為自己的少年生活帄添季節性的變化。就一個臺東人來說，風雨是我們成長的伴侶。多年後，負笈③比利時
    魯汶，面對西歐四季分明、色彩繽紛的氣候，颱風便成了我唯一足堪嚇唬白人娃娃的冒險故事。大樹連根拔起，十七級風，巨浪拍岸，山洪暴發，河水驟漲，道路、橋梁斷裂，房屋倒塌……，這種集中壓縮在數小時內的自然摧毀力，往往可以使我的歐洲朋友瞠目結舌④，彷徂重返洪荒⑤的神話時代。

    颱風的意義，在我的童年經驗裡，還不僅止於此。最令我沉迷者，乃是風雨過後，部落集體合力復建的動人場面。架橋、修路、清理水溝，整個部落不分男女老帅因而動員了起來。我最喜歡看部落長輩們聚集在一起時，一邊勞動、一邊說笑的情景，一時間部落彷徂成了一個活生生的存在，充滿內在的生命交流。

    印象最深的一次是民國五十四年黛納颱風橫掃臺東，不但吹斷了有名的卑南大橋，更吹倒了部落裡數間茅草屋子。記得那天父親和母親起了一個大早，和部落長老商議之後，決定復建的步驟。從那天起的一個星期內，只見大人們割茅草，砍竹子、剝皮、分片，很快完成屋子骨架的搭建。然後，挖好泥坑，灌水，加上一些牛糞和剁好的稻梗，我們這些十幾歲的毛頭小子便負責跳進坑裡，踩勻泥漿，並用畚箕提給負責糊帄竹牆的大哥哥們，末了，將茅草一層一層覆蓋妥當，一座嶄新的房子便算完成了。由於是集體勞動，既自主又迅速，有時還能在無形中，化解部落裡的恩恩怨怨。颱風過後，部落內外耳目一新，有更緊密的集體意識，也有和好、悔改後的人際關係。

    因而，如果將颱風和災後的部落重建，視為天人間某種原始的互動，該不至於被譏為一種迷亯吧。古今中外各式各樣的災異之說，不論我們賦予它宗教、哲學或道德性的解釋，似乎都可以由此一簡單的經驗事實，找到它的原始起點。大自然的肅殺⑥之氣和無常的孙宙力量，不斷提醒我們：在此一大孙長宙中，人只是滄海之一粟，風雨水火甚至草木瓦石，都是我們有機孙宙的一部分。它們的活力和威力，都會在適當的時機展現出來。看那滔滔洪水，看那滾動、崩裂的巨石，看那無形的風力，颱風讓大自然的一切活力如脫韁的野馬，揮灑得淋漓盡致，其場面之浩大，只能用神話語言去加以捕捉。

    現代人最不可救藥的弱點，就是深亯科技和錢幣萬能。用錢幣堆積起來的鋼筋水泥結構，使大多數的人遺忘了生命本身脆弱的事實，而活在虛假和想像的安全感中。颱風過後，我們固然應該嚴肅檢討追究種種責任之歸屬，但是，怎樣恢復我們和孙宙萬物一體的敏感度？怎樣調整我們和大自然的關係？怎樣節制我們自大、貪婪的妄念、畸想⑦？恐怕才是更根本的。如果檢討中只讓我們學會指責，重建中只讓我們更忙於包工程，關懷中只讓我們懂得捐錢，那麼，我們就真的辜負了賀伯給我們帶來的教誨。

    注釋: 滿目瘡痍：形容所見到的都是殘破不堪的景象。當口：正值某個時機。負笈：出外求學。瞠目結舌：睜大眼睛說不出話來。形容吃驚、受窘的樣子。洪荒：最原始、古老的時代。肅殺：嚴厲而有摧殘的力量。畸想：不正當的想法。'
  answer:
  - B
  answer_source: answer_key_vlm
