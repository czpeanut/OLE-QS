    \ ！因為「緊張」會加快體內循環，把「它」清空，絕對可延緩爆炸時間！另外，別碰咖啡！利尿啊！\n※考生用品要注意\n1、請依學校規定：穿著制服或運動服。\n\
    2、要帶准考證才能考試!\n3、身分證以及與准考證同式的相片最好也準備一份，萬一准考證遺失了，就能派上用場，到考場試務中心申請補發。但要分散風險，分開置放，千萬別與准考證放一起，否則一起失蹤就不好玩了！\n\
    4、文具類用品：2B鉛筆、橡皮擦、修正液（帶）、黑色原子筆（文具最好至少準備兩份）：作文、數學非選「一定」要使用黑色原子筆（請避免使用極細原子筆）、透明墊板（雖非必需，但在「數學非選」與「作文」可派上用場）。\n\
    5、手錶：一定要戴！（考場並無義務準備時鐘）但不能有特殊功能（指針表最佳），不能發出聲響。\n※考生考試要注意\n１、先審視題本：考試開始鐘響後，先核對題本、答案卡上的准考證號碼是否有誤，要確認最後一題究竟在哪！別出了考場才發現，你少寫好幾題！\n\
    ２、留心數學作答：數學選擇與非選作答都在同一張紙上，只有一張答案卡（卷）！這跟模擬考不同！千萬別手癢在答案卷隨意塗鴉，會被扣分喔！\n3、答題時間分配：通常題目排列多由易到難，最好能留下10~15分鐘檢查。\n\
    4、答題小技巧：\n（1）建議看完一題就畫一格，不要題本全寫完後才開始畫卡！若答題夠快，還可再次寫題本做雙重確認。最後3~5分鐘務必再三確認答案卡填寫狀況！跳格或空白的慘劇，應該很多人都有椎心之痛！\n\
    （2）不要在難題上浪費時間，若一時無法解出，就先跳題最後再回頭解題，以免時間不夠。\n5、檢查到最後：別睡!請乖乖檢查到下課！（後面還有很長的暑假等著你）尤其越有把握的題目越要檢查。\n\
    ※寫作測驗要注意\n1、要看清題目：千萬別把「媽媽的手」看成「媽媽的毛」！雖然會考作文並無要求抄題（仍強烈建議抄題），但半開放題目，\n如「二十年後，世界將沒有○○」，就一定要抄題。\n\
    2、要分段、架構分明、篇幅充足：歷年6級分樣卷，分5~6段的占多數！全文篇幅能寫到翻面就儘量寫！\n3、避免用特殊符號或過度新潮詞彙：各種「新時代」符號、用語能免則免。更不要有與內容無關的文字，譬如：「閱卷老師\n\
    您辛苦了」、「寫這麼多賞個面子給4分吧」、「欲知後事如何，請待下回分曉」、「老師您好帥」......等。\n4、儘量舉出特別事例：108年的「青銀共居」，不意外的出現許多同學小時候在鄉下與爺爺奶奶居住，現在回到都市中……，所以，儘量想些特殊的例子吧！\n\
    5、「我」！ 請記得：文章要有「我」！沒有「我」，文章就沒有靈魂。純粹論理或只有別人的故事，連自己的想法都沒有，是沒有血肉的文章喔！\n節錄自《宋老的人生旅行》部落格"
  answer:
  - C
  answer_source: answer_key_vlm
