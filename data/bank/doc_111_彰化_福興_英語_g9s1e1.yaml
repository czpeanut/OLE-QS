    Dear Maggie,


    I know you won''t be happy but I still have to say this again. It hurts me to
    think that you''re going to 10.. I know you''ve always wanted to be like those
    actresses with big eyes and slim legs, but in fact you are already beautiful.
    What you are born with makes you special because nobody looks the same as you.

    It worries me more that 11.. But sadly, there''s no quick fix to this, not even
    with the doctor''s help. If you don''t try to like yourself first, no one else
    will. People like you not because of your face, but because of your heart. You
    need to understand this first. Until you understand this, nothing is going to
    be different even if you have this change.

    I truly hope you think this through again.


    Love,

    Linda'
