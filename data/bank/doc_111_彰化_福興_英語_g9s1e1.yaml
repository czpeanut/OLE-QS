- id: doc_111_彰化_福興_英語_g9s1e1_s8_6
  section: 8
  number: 6
  type: single
  page: 4
  stem: What does them mean in the reading?
  options:
  - label: A
    content: Apps.
  - label: B
    content: Bosses.
  - label: C
    content: Delivery people.
  - label: D
    content: Jobs.
  group_stem: '(3)

    Food Delivery Is Not an Easy Job

    There is more and more food delivery now. We can see a lot of delivery people
    on the road. It is convenient for us. When we don''t want to go out, we can use
    an App to order the meal. However, it is not an easy job. Delivery people have
    to deliver the food on time, or the customers may get mad. If it happens, they
    will leave bad comments on the App. Then the boss would deduct delivery people''s
    money.

    Three months ago, I became one of them. One day, it was raining heavily. People
    didn''t want to go out, so we got a lot of orders. It took us more time to deliver
    the food on a rainy day. Some people got angry because we were late. However,
    there were others things making us late for the next delivery. It was not our
    fault.

    We don''t want to be late, so we ride fast. Some of us even have car accidents.
    No one wants to make people angry and get bad comments. If people can be friendlier
    to us, maybe some accidents will not happen. However, many of them don''t understand
    it is not an easy job. They care about their food.


    *delay 使耽擱; comment 評論,意見; deduct 扣除'
