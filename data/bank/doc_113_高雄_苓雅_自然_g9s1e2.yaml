  stem: 在甲、乙兩地中，岩層皆未發生倒轉與變動，其中甲地三個岩層中分別含有Ⅰ：三葉蟲化石、Ⅱ：恐龍化石與、Ⅲ：劍齒虎化石；乙地兩個岩層中分別含有Ⅳ：恐龍化石和Ⅴ：三葉蟲化石，下列推測何者正確？
