  section: 1
  number: 7
  type: single
  page: 1
  stem: 關於物質與熱量進出的敘述，下列何者正確？
  options:
  - label: A
    content: 物質在有熱量進出的情況下，必伴隨自身的溫度變化
  - label: B
    content: 皮膚塗抹酒精，會感到冰涼，是因為酒精揮發成氣體時，會吸收皮膚的熱量
  - label: C
    content: 含水的藍色硫酸銅可藉由放出熱量變成白色不含水的無水硫酸銅，使得溫度計讀數上升
  - label: D
    content: 乾冰昇華，二氧化碳由固體轉為氣體的同時，會放出熱量，並使得周圍的環境溫度上升。
