    content: 100 公克的水在放出了 2500 卡的熱量後，會從 85℃下降至 60℃
  - label: C
    content: 100 公克的水在吸收了 2500 卡的熱量後，會從 80℃上升至 105℃
  - label: D
    content: 300 公克的水由 90℃下降到 60℃的過程中，會放出 9000 卡的熱量。
