    content: 氧化汞不是純物質
  - label: B
    content: 氧化汞、汞、氧氣皆是純物質
  - label: C
    content: 此反應為化學變化
  - label: D
    content: 汞與氧氣無法再用一般化學方法分解出其他物質。
