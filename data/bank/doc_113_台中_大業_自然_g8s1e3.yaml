- id: doc_113_台中_大業_自然_g8s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: '下列為右圖五中週期表①~⑦位置的相關敘述

    ①原子量最小的元素為氫，且不屬於鹼金屬

    ②鹼金屬，質地柔軟，易與水形成氫氣與酸性物質

    ③鹼土金屬，多存在地殼的各類物質中

    ④鈍氣，化學性質不安定，易和其他物質反應

    ⑤門得列夫第一版週期表發表後，才被發現的一族

    ⑥每一縱行稱為族，同族具有相似的化學性質

    ⑦原子序由小到大，從週期表從右到左、由上到下排列，每一橫列稱為週期。

    ①~⑦位置與其相關敘述的配對，何者完全正確？'
  options:
  - label: A
    content: ①、③、⑤、⑥
  - label: B
    content: ③、④、⑤、⑥
  - label: C
    content: ②、③、⑤、⑦
  - label: D
    content: ②、④、⑥、⑦。
