- id: doc_113_台中_大業_自然_g8s1e3_s1_33
  section: 1
  number: 33
  type: single
  page: 5
  stem: 根據文中的敘述，下列哪一組不是同素異形體？
  options:
  - label: A
    content: 鑽石、巴克球
  - label: B
    content: 石墨、奈米碳管
  - label: C
    content: 氧氣、臭氧
  - label: D
    content: 一氧化碳、二氧化碳。
  group_stem: '閱讀以下文章後，請回答請回答下列 33～34 題


    許多存在於自然界的元素，不是只有一種型態，而是具有多樣的組成樣貌，例如：碳元素可組成鑽石、石墨、$C_{60}$ 以及奈米碳管。雖然彼此間的型態不同，但是組成物質都是單一相同元素，因此科學上稱之為同素異形體。


    天然鑽石來自於金剛石礦物，是自然界中已知硬度最大的物質，可以用來製造鑽探用的探頭和磨削工具。它在空氣中燃點約為 850～1000 ℃。石墨具有層狀的平面結構，因其具有導電性，故可做為導電材料。天然石墨很容易互相剝離，形成薄薄的石墨片。若把石墨片剝離到只有一個碳原子厚度的單層，即可獲得石墨烯。石墨烯是目前世上最薄、最堅硬的奈米材料，可用來發展出更薄、導電速度更快的新一代電子元件。$C_{60}$
    又稱為富勒烯或巴克球，是由六十個碳原子組成的空心足球狀分子，結構穩定，具有導電性。$C_{60}$ 特殊的結構讓它在超導體、材料科學方面的應用價值極高。奈米碳管是一種管狀的碳分子，幾萬根奈米碳管併起來也只有一根頭髮絲寬。研究發現奈米碳管未來在微機電、生物科技、醫療及電子等領域的應用極具潛力。'
