  stem: 根據文中的敘述，下列對於不同物質的敘述，下列何者錯誤？
  options:
  - label: A
    content: 天然鑽石是自然界中已知硬度最大的物質，因燃點高於 1000 ℃，常在探頭及工具上使用
  - label: B
    content: 石墨因具有層狀的平面結構，故具有導電性，石墨片可相互剝離，形成薄薄的石墨片
  - label: C
    content: 石墨烯是石墨片剝離到只有一個碳原子層的厚度，是一種最堅硬的奈米材料，可發展新一代的電子元件
  - label: D
    content: 奈米碳管因為其極細的特性，未來在微機電、生物科技、醫療等領域極具發展潛力。
