- id: doc_113_台中_大業_自然_g8s1e3_s1_28
  section: 1
  number: 28
  type: single
  page: 4
  stem: 為什麼稀土元素被稱為「稀土」？
  options:
  - label: A
    content: 在地殼中的含量相對較低，是罕見且難以找到的資源
  - label: B
    content: 在地殼中的分布非常分散，無法像其他金屬礦產集中於某個地區，因此開採和提取過程變得非常困難和昂貴
  - label: C
    content: 因技術限制和開採難度，中國是目前世界最大的稀土礦生產國和出口國，約占世界出口額總量的 37%
  - label: D
    content: 具高商業價值，應用於高科技產品，如電子材料、可再生能源設備和先進材料等，被視為重要戰略性資源。
  group_stem: '閱讀以下文章後，請回答下列第 28 題到第 29 題


    稀土元素，常見的包含第三族金屬元素鈧（21）、釔（39）、與鑭系元素（57-71）共十七種元素（括弧內的數字為原子序）。


    元素週期表的編排依據原子序，原子核外的電子以一定規則分層排列，同一族的元素因最外層的電子排列相同，而具有類似的化學性質。稀土元素因為最外層電子排列相同，具有相似的化學性質，因此很難各自獨立分離。稀土元素近年來應用於高科技產品，包含催化材料、永磁材料、螢光材料、儲氫材料、精密陶瓷等，是生產電動汽車、風力發電機、LED、手機和電腦產品的不可或缺材料。


    稀土元素在地殼中並不稀少，只是分布非常分散，且稀土金屬的開採不僅勞力密集、危險性高，而且在開採和精煉過程中對環境和人體具有高度污染性。儘管稀土元素在地殼中並不稀少，但其開採難度使其成為戰略性資源，根據
    2021 年美國地質調查局（USGS）的資料，中國是目前世界最大的稀土礦生產國和出口國，約占世界出口額總量的 37%。稀土元素中的鈰，最穩定的氧化物是二氧化鈰（$\mathrm{CeO}_{2}$
    ），常用於各式觸媒、催化劑，以降低排氣管中的氮氧化物的濃度；亦作為化學機械研磨中的拋光粉使用。'
  tags:
    chapter:
      publisher: 康軒
      book: 八上
      subject: 理化
      code: 6-2
      title: 元素週期表
      chapter: 第6章 探索物質組成
