- id: doc_113_台中_大業_自然_g8s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 熱的傳播方式可分為傳導、對流、輻射，請問下列敘述何者錯誤？
  options:
  - label: A
    content: 固體主要傳熱方式透過傳導，熱量由高溫物體傳到低溫物體
  - label: B
    content: 液體、氣體等流體主要是透過對流進行熱傳播
  - label: C
    content: 輻射不需要介質也能進行熱傳播，如太陽傳至地球
  - label: D
    content: 所有溫度的水在冷卻後，都會因為體積及密度變化而下沉。
