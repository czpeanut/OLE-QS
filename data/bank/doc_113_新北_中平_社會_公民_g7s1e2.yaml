  section: 1
  number: 10
  type: single
  page: 3
  stem: 「過曝世代」指的是一出生就與網路緊密相依、在成長中受大量社群影音影響，過度暴露於網路下成長的年輕世代。對於這些青少年而言，有研究指出其人際關係與心理健康都不容忽視，因為少子化的現象導致獨生子女增加，且孩子在缺乏手足互動的家庭成長，較容易產生社會互動能力降低的問題，又或者恐有記憶力不集中的狀況，因此家庭如何透過真實互動的陪伴，引導孩子正確的使用網路是AI
    時代家長的新課題。請問依據前述說明，家庭的哪一項功能未被提及？【素養導向】
  options:
  - label: A
    content: 保護與照顧功能
  - label: B
    content: 經濟功能
