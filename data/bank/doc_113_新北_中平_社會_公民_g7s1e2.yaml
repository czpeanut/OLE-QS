- id: doc_113_新北_中平_社會_公民_g7s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 3
  stem: '曾爺爺是一名80 歲的洗腎患者，一週需要洗腎三次且因為年紀大了有許多慢性病在身，需要定期回醫院去做檢查與拿藥，經過評估後符合使用長照的資格。請問若你是曾爺爺的家屬，下列共有幾項是可以供他們適用的長照服務與假別？

    甲：提供曾爺爺往(返)居家至洗腎中心進行洗腎的交通接送 乙：曾爺爺的兒子向公司請育嬰假來照顧他

    丙：營養師為曾爺爺提供居家營養評估以補充所需的營養 丁：曾爺爺行動不便可以申請輔具方便他行走

    戊：曾爺爺的女兒請家庭照顧假，帶他去接種流感疫苗 己：曾爺爺的兒子向政府申請托育補助'
  options:
  - label: A
    content: 2 項
  - label: B
    content: 3 項
  - label: C
    content: 4 項
  - label: D
    content: 5 項
  group_stem: '◎請閱讀以下的文章，並根據內容回答第15–16 題◎

    臺灣人口快速老化下，將於明年正式邁入超高齡社會，由於長期照顧的需求人數愈來愈多，許多家庭首先遇到的難題即是經濟問題，第二則會思考到職涯問題，如何去平衡工作卻又不失照顧者的角色，而後家屬們也會面臨到病情變化等問題，因此政府為了協助他們並期望讓更多有需求的人能獲得適切的照顧，推行了長照制度。

    自從長照2.0 正式啟動後，服務對象擴增到包含65 歲以上失能老人、55 歲以上失能原住民、50 歲以上失智症者及任何年齡的失能身心障礙者，提供了照顧及專業服務，包含了日間照顧、專業服務、輔具租借、交通接送及喘息服務等，希望讓評估符合資格者，皆可獲得所需資源外，也讓家屬得以有喘息空間並減輕負擔。【素養導向】'
