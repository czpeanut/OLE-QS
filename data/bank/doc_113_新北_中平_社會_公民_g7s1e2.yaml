  stem: 《家庭暴力防治法》是我國於1998 年制定的一部反家庭暴力的法律，而促成此部法律的原因是源自於鄧如雯的殺夫案，鄧如雯及她的家人均長期承受其丈夫林阿棋的暴力虐待，在婚後鄧如雯曾因不堪毆打而離家，但又因林阿棋到其娘家施暴及恐嚇全家導致她不得不返家，由於當時相關法令規定不足，使她遭受暴力對待時也求助無門。請問對於《家庭暴力防治法》的相關內容，下列說明何者正確？
  options:
  - label: A
    content: 被害人可以向警察機關聲請保護令
  - label: B
    content: 保護令可要求被害人遷出加害人的住所
  - label: C
    content: 家暴不包含父母對子女的不當管教
  - label: D
    content: 家暴的被害人也包含非同居的親密伴侶
