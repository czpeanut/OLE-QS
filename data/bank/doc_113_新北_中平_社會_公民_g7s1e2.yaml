  stem: 承上題，小采與阿諾正值新婚，雖然認識的時間很長但仍有諸多生活習慣與價值觀需要磨合，而在婚前兩人皆是朝九晚五的上班族，但在婚後小采成為了一名家庭主婦，她決定離職的原因是希望能夠好好操持這個家，而阿諾也理解小采的想法因此彼此達成共識，各自為了這個家而努力著。請問依據前述，下列關於配偶間的權利義務何者說明有誤？
  options:
  - label: A
    content: 《民法》規定夫妻之間互為日常家務代理人，因此阿諾可以代收小采的掛號信
  - label: B
    content: 小采雖然婚後未出外工作，但也擁有部分自由使用家庭生活費的權利
  - label: C
    content: 夫妻雙方依照經濟能力各自分擔生活上所需費用
  - label: D
    content: 小采與阿諾這對夫妻擁有相等的經濟自主權
