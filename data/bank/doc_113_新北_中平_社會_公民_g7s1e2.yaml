  stem: 承上題，小采與阿諾這對小倆口感情十分穩定，結婚後幾乎形影不離羨煞旁人，但兩人卻有一個煩惱，十分喜歡孩子的小采與阿諾一直盼不到孩子的到來，因此雙方與家人們討論後，決定要透過法定程序向【】聲請【】孩子，在【】程序結束後，城城終於來到了小采與阿諾的身邊，雖然孩子並非自己所親生，但一家三口也過得十分幸福。請問前述的【】與【】分別為何？
  options:
  - label: A
    content: ：法院；：收養
  - label: B
