- id: doc_113_新北_中平_社會_公民_g7s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '承上題，擁有孩子後的小采與阿諾由於是新手爸媽，他們對於親子間的權利義務不是很理解，請你協助他們找出共有幾項是正確的選項。

    甲：父母對成年子女也可以行使親權 乙：當父母行使親權而意見不一致時，法院會透過抽籤的方式來做決定

    丙：家庭間縱然只是小衝突的發生，也全都必須到法院進行判決來做決定 丁：對於未成年子女姓氏由父母共同約定

    戊：城城與阿諾因為是擬制血親的關係，因此不得繼承他的遺產 己：小采可於合理範圍內對城城進行懲戒、管教'
