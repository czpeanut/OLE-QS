  stem: 國發會日前公布，依據目前臺灣生育率為全球倒數第一的情形推估，我國將於2025 年正式進入「超高齡社會」，這個現象是因為【甲】的問題十分嚴重，我國的生育率與死亡率相比，早已從2019
    年就出現「生不如死」的現象，以2024 年來說，約3.6 名的青壯年要扶養1 名老年人口，但到了2070 年則很有可能1 名青壯年要扶養1 名老年人口。請問下列選項中何者與前述的【甲】最有關聯？【素養導向】
  options:
  - label: A
    content: 隔代教養家庭會大幅的增加
  - label: B
    content: 政府於必要時增加就業機會
  - label: C
    content: 提供自購住宅貸款利息補貼
  - label: D
    content: 政府提供育嬰留職停薪津貼
