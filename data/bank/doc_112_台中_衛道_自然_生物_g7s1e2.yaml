- id: doc_112_台中_衛道_自然_生物_g7s1e2_s1_46
  section: 1
  number: 46
  type: single
  page: 5
  stem: 有關維生素的敘述何者正確？
  options:
  - label: A
    content: 若缺乏維生素 A 會造成腳氣病
  - label: B
    content: 維生素 A 溶於脂肪中，一般而言較不容易有缺乏的現象
  - label: C
    content: 生物素可以協助維生素 D 的製造，存在於堅果等食物中
  - label: D
    content: 在維生素中除了維生素 D 無法自行合成，其他維生素都可以由人體合成。
  group_stem: "題組五、\n    1911 年波蘭生化學家馮克（Kazimierz Funk）發表有關維生素的理論，他指出食物中有四種微量化合物可以防治四種疾病：糙皮病、腳氣病、壞血症和佝僂病。他並稱這四種未知的化合物為維生素\
    \ A、B、C 和 D。下列以維生素 A、$B_{12}$、C 及 D 的構造式為例說明維生素為有機物，通常具有長碳鏈之化合物，約四至二十四個碳原子組成較難溶於水，為脂溶性物質，反之則為水溶性；故維生素可分為脂溶性和水溶性兩種。水溶性維生素能溶於水中，當攝取量多於身體需要時，多餘的會隨尿液排出體外。脂溶性維生素只溶於脂肪中，須靠食物中的脂肪才能被消化和吸收，較易出現攝取過量中毒的情況。\n\
    \n    維生素 D 是維生素中唯一可以由人體自行合成的，它是皮膚經由日曬後，在其中的一種膽固醇被代謝轉化成了維生素 D，每週三次僅 10 至 20 分鐘的陽光照射（臉和手），就能製造足夠的維生素\
    \ D，然而在陽光刺激下所產生的過多的維生素 D 也會被陽光破壞，因此不用擔心長期在太陽下工作會引起維生素 D 過多而中毒，但是需小心提防紫外線過多所造成的傷害。\n\
    \    生物素（biotin）又稱為維生素 H 或輔 R，是脂肪、胺基酸和碳水化合物的新陳代謝所必需，可幫助維生素 B 群的利用，有助於頭髮、汗腺、皮膚、神經和骨髓的健康。生物素缺乏的症狀除了掉頭髮禿頭外，還會引起頭皮屑、皮膚炎、舌炎、結膜炎及精神的發展阻礙等。生物素為水溶性，存在於許多常見的食物中，如堅果、啤酒酵母、牛肉、肝臟及蛋黃等，蛋白中亦富含生物素，但生蛋白中含有一種妨礙生物素吸收的蛋白質，稱為抗生物素蛋白（avidin）。"
