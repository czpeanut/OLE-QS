  group_stem: "題組六、酵素與輔因子\n    酵素的成分主要為蛋白質，有些酵素單獨即可作用，然而有些酵素另需稱為輔因子（cofactor）的化學成分，才有催化作用。輔因子的種類有無機離子(金屬離子)，例如：$Fe^{2+}$、$Mg^{2+}$\
    \ 或 $Zn^{2+}$ 等離子，或是複雜的有機小分子，如維生素 C、$NAD^{+}$，稱為輔酶（coenzyme）。輔因子可幫助酵素進行催化作用使之活性更好，且一種輔因子可與不同種類的酵素進行反應，反應完後可繼續再利用。有些酵素分子內的輔酶或金屬離子與蛋白質的結合鬆弛且是短暫性的結合；而在有些酵素分子內，則是永久性的緊密結合，此時的輔因子稱為輔基（prosthetic\
    \ group）。有些酵素的酶蛋白和輔因子單獨存在時，均無催化活性；只有二者結合成完整的分子時，才具有完整的催化作用，則此類複合體稱作全酶（holoenzyme）。前者稱為主酶（apoenzyme），受熱易變性，而金屬離子或輔酶通常對熱安定（如下圖）。"
