    \ 20 mg 以下的微量礦物質（microminerals），包括有鐵、錳、銅、碘、鈷與鋅等，這些礦物質具有更特定的功能，如鐵為製造血紅素所必需；碘則為製造甲狀腺素（thyroxin）不可缺的礦物質。血紅素分子中的血基質（heme）是由紫質環（porphyrin）及亞鐵離子（$Fe^{2+}$）組成（圖一）。紫質環的合成反應中有許多酵素參與反應，當其中一種酵素不正常時便會合成不正常的紫質環，於是無法形成有功能的血基質，有一種遺傳疾病「先天性紅血球合成性紫質症」（Congential\
    \ erythropoietic porphyria）即是此因。患者體內合成的的紫質環結構不正確，所以無法作用，而又因為其中一種合成紫質環的酵素無法被調節，所以紫質環會製造過多。此類病患會有以下症狀：\n\
    甲、紫質環製造過多，於尿中排出時會呈現紅色。\n乙、紫質環製造過多，堆積於皮下而使病患對光敏感。\n丙、牙齒有螢光，原因不明。\n丁、因為血基質不正常，所以此類病患會有貧血症狀。\n\
    \    這種病除了不能接觸紫外線外，甚至功率大於 40 瓦的日光燈也會造成皮膚的灼傷，所以患者只能生活在黑暗的環境中。由於先天性紅血球合成性紫質症為遺傳疾病，所以目前尚未有治療方法，只能症狀治療，如輸血使血紅素維持在正常範圍等。\n\
    \    植物體亦需多種礦物質，以維持其正常的發育與生長，如鎂為構成葉綠素的必要元素(圖二)。葉綠素分子的基本構造是具有以鎂原子為中心之紫質環。"
