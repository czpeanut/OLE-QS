  - label: D
    content: The bread with yellow color means to be ready.
  group_stem: '(C)

    Here’s the recipe for making PB & J (Peanut Butter & Jelly Sandwich)!

    It’s time to make your own PB & J !


    # PB & J Recipe

    - **Prepare:** 5 mins

    - **Cook:** 8 mins

    - **Total:** 13 mins


    ### Ingredients

    - 2 slices of bread

    - 1 teaspoon butter

    - 1 teaspoon peanut butter

    - 2 teaspoon strawberry jam


    ### Directions

    1. Heat pan to 175℃.

    2. Spread 1/2 teaspoon of butter on each slice of bread.

    3. Spread one slice with peanut butter

    4. Cover the other slice of bread wih strawberry jam

    5. Cook for 4 minutes on each side when it turns to be golden brown.


    📖recipe 食譜 indredient 材料 prepare 準備 directions 說明 spread 塗抹 peanut 花生'
