    content: 「共行數里，鬼言：『步行太極，可共迭相擔也。』」→一起走了數里路，鬼說：「走路實在太無聊了，我們可以互相背負。」
  - label: B
    content: 「於是共行，道遇水，定伯命鬼先渡，聽之，了無聲」→於是一起走，路途遇到淹水，定伯讓鬼先游泳，聽他游水，先不出聲
  - label: C
    content: 「定伯便擔鬼至頭上，急持之，鬼大呼，聲咋咋，索下，不復聽之」→定伯把鬼背負在頭上，急忙抓住他，鬼大聲怒號，向他索命，定伯不理會他
  - label: D
    content: 「徑至宛市中，著地化為一羊，便賣之。恐其變化，唾之」→直接把鬼背到宛市中，將鬼放下在地上，鬼變成了一隻羊，定伯就賣了他。定伯擔心他再有變化，就朝鬼身上吐口水。
