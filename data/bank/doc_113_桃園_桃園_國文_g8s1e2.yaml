- id: doc_113_桃園_桃園_國文_g8s1e2_s2_38
  section: 2
  number: 38
  type: single
  page: 6
  stem: 文中江州刺史所說：「賢者處世，如果天下無道就隱潛，如果天下有道就出來。」這句話和下列哪個選項最相似？
  options:
  - label: A
    content: 大隱隱於市，小隱隱於野
  - label: B
    content: 治則進，亂則退
  - label: C
    content: 不戚戚於貧賤，不汲汲於富貴
  - label: D
    content: 得天下有道：得其民，斯得天下矣。
  group_stem: "有一種美，可稱為安靜之美。可惜任何美學著作都沒有說明：這種安靜，是辛苦抵禦的結果。\n    西元405 年，41 歲的彭澤縣令陶淵明聽說郡裡派了一個督郵來檢查工作，命他「束帶見之」。陶淵明想，自己勉強做官，只是為了養家餬口，卻要承受如此屈辱，便決定「不為五斗米折腰」，辭職回鄉。由此，中國文學史上出現了一種名傳千古的安靜之美。可見，這種安靜之美，正是陶淵明抵禦規矩、官職的結果。\n\
    \    但是，這只是抵禦的開始。西元408 年，一場大火把陶淵明的家徹底燒毀，全家只能住在一條船上。後來雖然搭建了住所，但生計越來越艱難。他曾用詩描述道：「風來入房戶，夜中枕席冷。」「躬親未曾替，寒餒常糟糠。」「夏日長抱饑，寒夜無被眠。」……\
    \ 可見，為了持守安靜之美，還要抵禦災害、抵禦貧困、抵禦饑餓。\n    在此之前，江州一個刺史曾到陶淵明家探訪。這位刺史看到又饑又病的大詩人躺在床上，就說：「賢者處世，如果天下無道就隱潛，如果天下有道就出來。現在天下很文明，您為什麼把自己弄得那麼苦？」\n\
    \    陶淵明聽了很生氣，說：「我不是你所說的那種賢者，因此也沒有你所說的那種志向！」連刺史帶來的糧食和肉食，他都拒絕接受。\n    你看，這又要抵禦更多的東西了：抵禦「賢者」的稱呼，抵禦「文明」的說法，抵禦饑餓中的食物。\n\
    \    千古安靜之美的創建，容易嗎？\n    沒有那麼多的抵禦，就沒有那麼多的安靜。沒有大抵禦，就沒有大安靜。\n    不是大安靜，也就沒有純粹的安靜之美。\n\
    \    安靜，是很多藝術家的追求。但是，我所知道的藝術家，都安靜得非常狹隘。他們通常只是在盛大聚會結束之後才看著空桌空椅喘一口氣，說：「這下安靜了。」或者，在摩肩接踵的都市擁擠中終於來到鄉間別墅，在人來人往的交際轉盤中終於來到旅遊小島，同樣喘一口氣，說：「這下安靜了。」\n\
    \    片刻的安靜，忙裡偷閑的安靜，作為生態點綴和心態調節的安靜，在抒情散文中用驚喜的言詞描述的安靜，都不是大安靜。\n    不是大安靜，也就沒有純粹的安靜之美。\n\
    \    為了一種美，甘願進行沒有時限的大抵禦，難度很大。\n    但是，如果心中的美是至高無上的，又有足夠的決心和信心，也有可能做到。\n(節選自余秋雨\
    \ 安靜之美)"
