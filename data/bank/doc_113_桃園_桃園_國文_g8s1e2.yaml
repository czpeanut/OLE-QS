  group_stem: "2023 年北太平洋西部海域颱風之氣候分析\n    以氣候平均值而言，北太平洋西部颱風主要生成季節在7 月至10 月，佔全年颱風生成總數的70%，而颱風季前(1月至6\
    \ 月)、後(11 月至12 月)的生成比例分別是17%、13%。歷年颱風最多的年份為1964 年，共有37 個颱風生成；最少的1 年則為2010 年，只有14\
    \ 個颱風。2023 年全年西北太平洋颱風總數為17 個，明顯少於氣候值的25.4 個，與1998 年並列為歷年來颱風生成數次少紀錄。分析逐月颱風生成數，2023\
    \ 年颱風多在下半年生成，其中以8 月有6 個颱風生成為最多，次之為7 月有3 個颱風生成，秋季(9 月至11 月)僅有4 個颱風生成，創歷年來秋季颱風生成數最少紀錄。\n\
    \    侵臺颱風部分，歷年來侵臺颱風最多年份為2001 年，有7 個颱風侵臺；最少為1964 年，當年無颱風侵臺。影響臺灣的主要季節在7 月至9 月，佔全年侵臺總數的77.4%，1\
    \ 月至6 月及10 月至12 月的比例則分別占全年侵臺總數的8.4%及14.2%。\n    2023 年有5 個颱風對臺灣有較大影響。7 月25 日至28\
    \ 日、8 月29 日至31 日、9 月3 日至5 日、 10 月3 日至7日分別受杜蘇芮、蘇拉、海葵、小犬颱風及其外圍環流影響，東半部降雨顯著並達大豪雨等級，西半部為間歇雨勢且局部地區因背風沉降出現極端高溫；8\
    \ 月1 日至6 日卡努颱風由東部海域北上，降雨多在西半部，尤其是中南部山區。上述5 個颱風除蘇拉颱風外，其他4 個均為侵臺颱風，接近氣候值的3.2 個，其中海葵及小犬颱風分別登陸臺東\
    \ 東河及屏東 鵝鑾鼻。\n    分析最近10 年(2014-2023 年)平均颱風生成數和侵臺颱風數，近10 年颱風生成數為24.8 個，接近氣候平均值；侵臺颱風數為2.0\
    \ 個，略低於氣候平均值(表1)。\n\n最近10 年北太平洋西部海域全年颱風生成數及侵臺颱風數比較\n| 年分 | 2014 | 2015 | 2016\
    \ | 2017 | 2018 | 2019 | 2020 | 2021 | 2022 | 2023 | 氣候值(1991~2020) | 平均值(2014~2023)\
    \ |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :---\
    \ | :--- | :--- |\n| 颱風發生數 | 23 | 27 | 26 | 27 | 29 | 29 | 23 | 22 | 25 | 17 |\
    \ 25.4 | 24.8 |\n| 侵臺颱風數 | 2 | 2 | 3 | 2 | 1 | 3 | 1 | 1 | 1 | 4 | 3.2 | 2.0 |\n\
    表1"
