    content: 外國人常讚嘆台灣是一個熱情的「國家」，認為台灣最美的風景是人情
  - label: B
    content: C羅似乎掌控了整場局勢，不斷「左右」閃避敵隊球員，最後用一記倒掛金鉤將球射入球門
  - label: C
    content: 小五郎做事一向負責盡職，只要遇到委託案件，必定「夙夜」匪懈，全力以赴
  - label: D
    content: 小蘭和新一不僅是青梅竹馬，也一起互相扶持經歷重重難關，他們的感情「生死」不渝。
