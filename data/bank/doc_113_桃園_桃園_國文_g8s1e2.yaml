  stem: 【甲】詩中「道狹草木長，夕露沾我衣。衣沾不足惜，但使願無違。」根據文意，下列對於作者的敘述何者正確？
  options:
  - label: A
    content: 不擅務農，對於人生有其他的想法與志趣
  - label: B
    content: 面對挑戰，希望憑一己之力改善世界
  - label: C
    content: 即使躬耕不易，仍堅持過著歸隱田園的生活
  - label: D
    content: 雖然事與願違，仍為了實現理想努力不懈。
  group_stem: "【甲】種豆南山下，草盛豆苗稀。晨興理荒穢，帶月荷鋤歸。\n    道狹草木長，夕露沾我衣。衣沾不足惜，但使願無違。\n(選自陶淵明 歸園田居其三)\n\
    【乙】寒山轉蒼翠，秋水日潺湲①。倚仗柴門外，臨風聽暮蟬。\n    渡頭餘落日，墟里②上孤煙。復值接輿③醉，狂歌五柳前。\n注釋①潺湲：狀聲詞。形容水流聲。\
