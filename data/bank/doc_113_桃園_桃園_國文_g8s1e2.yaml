    content: 「造飲輒盡，期在必醉，既醉而退，曾不吝情去留」--可見五柳先生表裡如一，言行相顧
  - label: B
    content: 「好讀書，不求甚解，毎有會意，便欣然忘食」--可看出五柳先生夜以繼日苦讀，從不怠惰馬虎
  - label: C
    content: 「常著文章自娛，頗示己志。忘懷得失，以此自終」--表現出五柳先生安然自得、淡泊名利的生活態度
