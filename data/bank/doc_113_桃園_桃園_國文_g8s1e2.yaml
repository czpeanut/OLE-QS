  page: 2
  stem: 田園之秋選一文中「一片清新的空氣，鮮潔的色彩，彷彿聽見了貝多芬田園交響曲。」採用「聽覺印象表現視覺印象」，下列選項何者與此用法相同？
  options:
  - label: A
    content: 柚樹的葉影在緩緩的移動，移上我臉頰的是幾朵擠碎的陽光，到這裡，它成了一種柔軟的撫摸
  - label: B
    content: 車停處有一家低簷的人家，在籬邊種了好幾棵複瓣的梔子花，那種柔和的白色是大桶的牛奶裡勾上那麼一點子蜜
  - label: C
    content: 星星是靜靜的掛在空中，卻好像帶著聲音，是早晨的幽遠之鐘，也是靜夜中雄渾的鼓聲，有著清脆的節奏與閃耀的聲息
  - label: D
    content: 那低咽的簫聲又傳來了，幽幽的，如同一隻到處漫游的火焰微弱的螢火蟲，飛到她的心中。
