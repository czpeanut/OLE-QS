  options:
  - label: A
    content: 「接著便是閃電纏身，霹靂壓頂，在荒野中的人，此時沒有一個不是被震懾得氣脫委頓，匍匐不能起的」--以人們的驚恐表現，凸顯大自然驚人的氣勢
  - label: B
    content: 「太陽又出來了，一片清新的空氣、鮮潔的色彩，彷彿聽見了貝多芬《田園交響曲》第五樂章〈牧羊人之歌〉」--以悠揚樂聲刻劃雨過天青的平靜，呈現和諧、愉悅的心情
  - label: C
    content: 「每一雨粒，大概最小還有拇指大，像這樣大的雨粒，竹葉笠是要被打穿的，沒有蓑衣遮蔽，一定被打得遍體發紅」--呼應前文的「大雨滂沱」，具體說明雨勢凶猛
  - label: D
    content: 「抬頭一看，黑壓壓的，滿天烏雲，盤旋著，自上而下，直要捲到地面」--強調西北雨的變化多端，人類無法與之抗衡。
