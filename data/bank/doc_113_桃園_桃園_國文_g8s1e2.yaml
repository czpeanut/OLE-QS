  stem: 「一過中午，烏雲向西北角密集起來，不到二小時便堆得黑壓壓一團，雲頭沈沈地低垂著，眼看就要和下面的山峰相吻合了。雷聲不斷隆隆地響，不過它很沉，似乎在很遙遠的地方響。雲頭更低了、更惡了。天空黑得像潑上一層濃墨。忽然，雷聲停了。有份量的，大點大點的雨滴開始落下來，把稀鬆的土庭和黃土路打得一個洞一個洞的，地面到處升起一道道白煙。」請問這段話是在描寫何種天氣現象？
