  section: 1
  number: 26
  type: single
  page: 3
  stem: 「你常常在暗暗猜測別人對你的看法，並且總是以為人家對你有敵意，於是，你常常先武裝了自己。因為舉目所見到處鬼影幢幢，所以你也就不停地對著幻影比畫招式。親愛的，想想那大戰風車的唐吉軻德吧，你當然看見了他的可笑，但可曾發現自己與他相似的多心？因此何不丟棄你的盾牌與尖矛呢？當你緊握著它們，你就是在給自己製造心的戰場。當你放下了它們，才能欣賞風車在風中悠悠轉動的無爭與美麗。」關於上文的詮釋，哪一個選項是正確的？
  options:
