    content: 鬼知道秋夫是良醫，故特地從湖的北岸到秋夫家求醫
  - label: B
    content: 鬼生前因當官貪汙，上天降病而死，死後依然飽受其苦
  - label: C
    content: 秋夫最後在鬼的腰間兩處穴位扎針，成功救治了鬼
  - label: D
    content: 鬼為了答謝秋夫治癒之情，最後讓秋夫當上朝廷官員。
  group_stem: "錢塘 徐秋夫，善治病。宅在湖溝橋東。夜，聞空中呻吟，聲甚苦，秋夫起，至呻吟處，問曰：「汝是鬼邪？何為如此？饑寒須衣食邪？抱病須治療邪？」鬼曰：「我是東陽人，姓斯，名僧平。昔為樂游吏①，患腰痛死，今在湖北。雖為鬼，苦亦如生。為君善醫，故來相告。」秋夫曰：「但汝無形，何由治？」鬼曰：「但縛茅作人，按穴鍼之，訖，棄流水中，可也。」秋夫作茅人，為針腰目②二處，並復薄祭③，遣人送後湖中。及暝，夢鬼曰：「已差④。并承惠食，感君厚意。」\n\
    \    秋夫 宋 元嘉六年為奉朝請⑤。\n\n注釋①樂游吏：官員名稱。 ②腰目：腰間穴道。 ③薄祭：簡單的祭祀。 ④差：ㄔㄞˋ，通「瘥」，病除。 ⑤奉朝請：官員名稱。\n\
    (選自吳均 續齊諧記)"
