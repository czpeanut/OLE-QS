  section: 1
  number: 18
  type: single
  page: 3
  stem: 雪寶非常喜歡陶淵明，常常向艾莎介紹陶淵明的生平經歷，但在介紹時卻有一個地方說錯了，請問是哪一個地方錯誤？
  options:
  - label: A
    content: 陶淵明出身官宦之家，家世顯赫，曾祖父是鼎鼎有名的陶侃，可惜到了陶淵明出生時家道已中落
  - label: B
    content: 好在陶淵明本性崇尚自然，本來就不是很願意當官，但是迫於生活無奈，還是曾出任幾次官職
  - label: C
    content: 最後一次當官是出任彭澤令，但實在沒辦法忍受要向一副小人嘴臉的權貴卑躬屈膝，當不到三個月就辭職了
  - label: D
    content: 之後決心歸隱，躬耕於南陽，日子雖過得清苦，卻很快樂，閒暇之餘也寫一些田園詩，是田園詩派代表詩人。
