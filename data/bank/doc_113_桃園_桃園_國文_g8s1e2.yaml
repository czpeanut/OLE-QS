  stem: 「趙昺嘗臨水求渡，船人不許。昺乃張帷蓋，坐其中，長嘯呼風，亂流而濟。於是百姓敬服，從者如歸。長安令惡其惑眾，收殺之。民為立祠於永康，至今蚊蚋不能入。」關於這段話，下列敘述何者正確？
