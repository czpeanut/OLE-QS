- id: doc_113_桃園_桃園_國文_g8s1e2_s1_30
  section: 1
  number: 30
  type: single
  page: 4
  stem: 「石曼卿隱於酒，謫仙之流也，然善戲。嘗出報慈寺，馭者失控，馬驚，曼卿墮馬。從吏驚，遽扶掖升鞍，市人聚觀，意其必大詬怒。曼卿徐著鞍，謂馭者曰：「賴我石學士也，若瓦學士，則固不破碎乎？」關於上文的詮釋，哪一個選項是正確的？
