- id: doc_111_高雄_林園_社會_地理_g9s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 上文敘述是一種在漠南非洲的傳統耕種方式—游耕。根據文中判斷，游耕會有以下何者特徵？
  options:
  - label: A
    content: 因須不斷遷徙，需在人口密度高的地方才能不斷開墾
  - label: B
    content: 需要不斷遷徙的原因是因為作物種類多，需有新的耕地來種植新作物
  - label: C
    content: 因為不翻地、不施肥，單位面積產量不高
  - label: D
    content: 適合游耕的氣候類型是夏雨型暖溫帶氣候
  group_stem: '＊請閱讀短文回答第10 題


    居民在森林中選取地塊，毀林、燒荒、掘穴播種，因工具簡陋（無犁）又不養畜，不翻地，不施肥，即等待收穫。植被破壞後的土地在濕熱氣候下受侵蝕淋溶十分強烈，1～3
    年內土壤肥力即急劇耗竭，收穫量銳減，只好棄耕，另選新地塊，重複毀林—燒荒—掘穴播種過程。大約經5～12 年，燒墾地段越來越遠，只好放棄原來住所遷往新的燒墾地段。'
  answer:
  - C
  answer_source: answer_key_vlm
