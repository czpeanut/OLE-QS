- id: doc_111_高雄_林園_社會_地理_g9s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 根據上文可知，非洲最富有的國家有共同的特色是下列何者？
  options:
  - label: A
    content: 良好的自然環境
  - label: B
    content: 豐富的礦產
  - label: C
    content: 發達的熱帶栽培業
  - label: D
    content: 眾多的人口
  group_stem: '＊請閱讀短文回答第15 題


    雖然在經濟合作與發展組織（經合組織）中沒有任何非洲國家加入了已開發國家之列，但整個非洲並非完全的貧窮不堪，而在財富方面也有很大的變數。在非洲北邊的阿拉伯國家長期以來一直和歐洲及中東等已開發國家經濟緊密聯繫在一起的，而南非是目前非洲最富有的國家，無論是在國內生產總值，或在人均國內生產總值也是全非洲最高的。在它鄰近的國家也能從中分享南非的財富。一些細小但石油藏量豐富的國家如加彭和赤道幾內亞，也加入在非洲10
    個最富有的國家之列。'
  answer:
  - B
