  section: 3
  number: 6
  type: single
  page: 2
  stem: 關於論語選中三則的作法，下列何者有誤？
  options:
  - label: A
    content: 三則皆透過師生一問一答的方式，呈現進德修業的道理
  - label: B
    content: 子游問孝一則，孔子透過「今之孝者，是謂能養」及「犬馬皆能有養」的比較，凸顯孝親的真義
  - label: C
    content: 譬如為山一則，孔子以譬喻和對比闡明學貴有恆的道理
  - label: D
    content: 吾日三省吾身一則，曾子以連續問句，反思自己在進德修業上是否盡心
