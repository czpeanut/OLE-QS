- id: doc_113_台中_大業_國文_g7s1e2_s3_5
  section: 3
  number: 5
  type: single
  page: 1
  stem: '下表是崇倫的上課筆記，關於論語一書的簡介有一處寫錯了。請告訴他錯誤的項目是下列何者？

    | (Ａ) | 篇數、篇名 | 全書二十篇，各篇通常取首章開頭的二、三字作為篇名 |

    | (Ｂ) | 編輯者 | 由孔子弟子及再傳弟子紀錄編輯而成 |

    | (Ｃ) | 體裁 | 為語錄體，記述孔子和弟子及時人應答談論的內容 |

    | (Ｄ) | 價值 | 透過本書可了解孔子的思想、言行，是道家的重要經典 |'
  options:
  - label: A
    content: 篇數、篇名：全書二十篇，各篇通常取首章開頭的二、三字作為篇名
  - label: B
    content: 編輯者：由孔子弟子及再傳弟子紀錄編輯而成
  - label: C
    content: 體裁：為語錄體，記述孔子和弟子及時人應答談論的內容
  - label: D
    content: 價值：透過本書可了解孔子的思想、言行，是道家的重要經典
  lesson_raw:
    title: 論語選
    basis: 考論語國學常識
