- id: doc_113_台中_大業_國文_g7s1e2_s4_1
  section: 4
  number: 1
  type: single
  page: 4
  stem: 從第一篇短文中，可了解孔子對益友、損友的定義。下列哪種類型的人，是孔子必定會推荐大家與之結交的對象？
  options:
  - label: A
    content: 巧言令色
  - label: B
    content: 剛正不阿
  - label: C
    content: 舌粲蓮花
  - label: D
    content: 功成名就
  group_stem: '(一)

    子曰：「益者三友，損者三友：友直，友諒①，友多聞，益矣；友便辟②，友善柔③，友便佞④，損矣。」

    (論語．季氏)

    (二)

    人工智能產品陸續問世了！令人震撼的是，除了具備手機功能，還能產生實體的互動與服務，甚至透過學習與大數據分析，成為「益友」，做到「友直、友諒、友多聞」！

    智能機器人就是一個例子，知識淵博沒話說，可以告訴你即時的新聞與天氣，還可以幫你翻譯、當嚮導。至於「友直與友諒」，置入相關程式後，機器人當然是正直與誠信，還可展現鼓勵、支持、勸導與安慰的互動。

    【注釋】①諒：信實、誠信。②便辟：善於迎合他人。③善柔：善以和悅或柔媚的情態誘惑人。④便佞：巧言善辯，阿諛逢迎。'
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 國文
      code: 第四課
      title: 論語選(1)子游問孝(2)譬如為山(3)吾日三省吾身
      chapter: null
    textbook: 七上 第四課 論語選(1)子游問孝(2)譬如為山(3)吾日三省吾身
    labeled_by: ai
