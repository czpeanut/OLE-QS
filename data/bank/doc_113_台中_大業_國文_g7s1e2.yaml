  stem: 「突然聽到父親起床的聲音，我趕快藏起小說，隨便拿一本書裝樣子。」句中「我」的舉動，意味著什麼？
  options:
  - label: A
    content: 錯愕不滿
  - label: B
    content: 慚愧不安
  - label: C
    content: 視若無睹
  - label: D
    content: 泰然自若
  group_stem: "初三上的冬天吧，有一天晚上，父親已就寢。由於白天替人插秧，腰酸背痛，父親睡得很不安穩。我則點著油燈偷偷的看小說。突然聽到父親起床的聲音，我趕快藏起小說，隨便拿一本書裝樣子。父親忍著腰部的酸痛，慢慢走到書桌前，看了看說：「阿森啊！早一點睡吧，天這麼冷，怕會著涼。唉！念書，我是幫不上忙，一切都得靠你自己。你要是好好念的話，一直念上去，看你能念到什麼程度，我再辛苦……唉……也想辦法供你去念，要是念不好，以後像我這樣種田，那也只能怪你自己了！」父親說完，蹣跚的回他的房間去。\n\
    \    我望著父親，突然間一陣陣難過的感覺湧上心頭，打開後門，跑到院子裡大哭起來。從此以後，升高中、考大學、在德國、在美國，每當我念書到夜深人靜時，往往就會想起寒夜、油燈及父親傴僂（１）的背影。\n\
    （簡大森 父親）\n【注釋】（１）傴僂：ㄩˇ ㄌㄡˊ，背脊彎曲。"
  tags:
