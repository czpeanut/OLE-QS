  stem: 「我們覺得這真是個灰色的世界」句中「灰色的世界」指下列何者？
  options:
  - label: A
    content: 童話世界
  - label: B
    content: 悲觀的念頭
  - label: C
    content: 坐井觀天
  - label: D
    content: 暴雨欲來的前兆
  group_stem: "我們常常會對自己不滿意，對自己的短處特別敏感，覺得自己的智力、體力和外表都不如人，怨恨上天不公平。我們對於所處的環境和遭遇的事事物物，更是不滿意，在別人身上看到的也盡是些瘡疤。於是我們覺得這真是個灰色的世界，心中充滿空虛、失望和憎恨。其實，我們若是換了個角度來看，認清我們所擁有的，慢慢地就會用每一個機會，發揮自己的潛力了。\n\
    \    世界的美與醜，完全取決於我們自身的看法。你認清了自己，對自己有信心，就更有力量去創造一個更美好的世界了！\n（逸荃 認識自己）"
