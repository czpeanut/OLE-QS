    content: 機器人透過學習與大數據分析，可當人類的益友
  - label: D
    content: 可透過學習及大數據分析來模擬與人的情感互動
  group_stem: '(一)

    子曰：「益者三友，損者三友：友直，友諒①，友多聞，益矣；友便辟②，友善柔③，友便佞④，損矣。」

    (論語．季氏)

    (二)

    人工智能產品陸續問世了！令人震撼的是，除了具備手機功能，還能產生實體的互動與服務，甚至透過學習與大數據分析，成為「益友」，做到「友直、友諒、友多聞」！

    智能機器人就是一個例子，知識淵博沒話說，可以告訴你即時的新聞與天氣，還可以幫你翻譯、當嚮導。至於「友直與友諒」，置入相關程式後，機器人當然是正直與誠信，還可展現鼓勵、支持、勸導與安慰的互動。

    【注釋】①諒：信實、誠信。②便辟：善於迎合他人。③善柔：善以和悅或柔媚的情態誘惑人。④便佞：巧言善辯，阿諛逢迎。'
