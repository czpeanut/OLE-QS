  section: 2
  number: 17
  type: single
  page: 2
  stem: 「移覺」就是在文章摹寫中，運用聯想力，將視覺、聽覺、味覺、觸覺、嗅覺等不同印象，轉移互通，如：「太陽又出來了，一片清新的空氣、鮮潔的色彩，彷彿聽見了貝多芬《田園交響曲》第四樂章〈牧羊人之歌〉」，即是用「聽覺」印象表達「視覺」印象。所以請判斷下列句子移覺中的印象表達錯誤呢?
  options:
  - label: A
    content: 嚼口香糖的漢子／把手風琴聲拉成／一條那麼長的無人巷子。---以「聽覺」印象表現「視覺」印象
  - label: B
    content: 三粒苦松子／沿著路標一直滾到我的腳前／伸手抓起／竟是一把鳥聲。---以「聽覺」印象表現「視覺」印象
  - label: C
    content: 這個球投得很甜，可惜打擊者沒有揮棒！---以「味覺」印象表現「視覺」印象
  - label: D
    content: 骯髒的香味，我吸了太多太多。---以「視覺」印象表現「嗅覺」印象。
  tags:
    chapter:
      publisher: 康軒
      book: 八上
      subject: 國文
      code: 第五課
      title: 田園之秋選
      chapter: null
