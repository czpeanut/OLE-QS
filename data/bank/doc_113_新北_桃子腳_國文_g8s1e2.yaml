- id: doc_113_新北_桃子腳_國文_g8s1e2_s3_31
  section: 3
  number: 31
  type: single
  page: 3
  stem: 作者在文中寫出許多對作家與書籍的看法，下列配對，何者最符合作者寫作本文當下的想法？
  options:
  - label: A
    content: 皇冠老雜誌／想起其中的鬼故事而感到驚駭
  - label: B
    content: 張愛玲／張愛玲使用對話的方式重複且笨拙
  - label: C
    content: 村上春樹／和所有人一起讀，且感到十分熱愛
  - label: D
    content: 三毛／懷念並記得當時她所寫的翻譯小說。
  group_stem: "甲.\n後來我很習慣週三中午放學回家，吃過飯就去書房裡，旋轉椅的人造皮躺久了悶出汗，皮面裡塞著的化纖棉花填料有時從破綻裡窸窸窣窣地冒出來，但天涼時很舒服。我並不常想把書帶到客廳或房間看。書房的窗外是一所國小滿植老榕的後園（若有人從窗口懸繩而下能夠直接進入校園，現在想想其實不安全），晚上看出去也鬼祟可怕，然而如果是夏初一個不打雷陣雨、乾燥無雲有風的下午，新綠讓窗子滿室生光像鑲了翡翠珠母屏，蟬聲神經兮兮停了又叫叫起來又忽然停，我有時伸腳搭在鋼琴上，有時盤腿窩住讓椅子慢速旋轉。那時讀了好多一九七○年代的皇冠老雜誌，裡面有早年的三毛，登的翻譯小說也多，我第一次知道紐約\
    \ 長島 阿米提維爾凶宅的故事就在其中一期，它的配圖刊登了一張素描像，說是按照屋主記憶與描述畫出來、在屋中作祟之一的老人面容。如今我腦中還能一筆一畫重現那張臉，現在描述這件事時背上發涼。\n\
    \  讀到書架右側一排窄長開本舊版的張愛玲是再後來的事。張愛玲習慣在每句對話前都加上「誰誰誰道」，於是見到一整頁齊頭並進的「這個道」、「那個道」、「這個道」、「那個道」，我當時讀了心裡很好笑，覺得怎麼這麼笨拙。現在當然明白了好笑的笨拙的都是我，不過那時才十一、二歲，這也算理所當然。\n\
    \  有些書讓你現在就明白，有些書讓你後來才明白，都很好。有些書，你終生喜歡，這也很好。有些書你現在喜歡以後不喜歡，有些書你以後喜歡現在不喜歡，聽起來好像顯得次要，但現在我覺得它們反而更好。例如我上大學後跟所有人一樣讀了許多村上春樹，只是忽然有一天，我再也不翻開。（黃麗群\
    \ 家裡那間書房）"
  tags:
    chapter:
      publisher: 康軒
      book: 八上
      subject: 國文
      code: 第九課
      title: 我在圖書館的一天
      chapter: null
    textbook: 八上 第九課 我在圖書館的一天
    labeled_by: ai
