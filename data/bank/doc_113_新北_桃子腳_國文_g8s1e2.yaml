    登州海中，時有雲氣，如宮室、台觀、城堞、人物、車馬、冠蓋，歷歷可見，謂之「海市」。或曰：「蛟蜃①之氣所為。」疑②不然也。歐陽文忠曾出使河朔，過高唐縣，驛舍③中夜有鬼神自空中過，車馬人畜之聲一一可辨④，其說甚詳，此不具紀⑤。問本處父老，云：「二十年前嘗晝過縣，亦歷歷見人物。」土人亦謂之海市，與登州所見大略相類也。（沈括
