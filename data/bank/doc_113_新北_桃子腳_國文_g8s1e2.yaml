  section: 2
  number: 20
  type: single
  page: 2
  stem: 「幸福者退讓原則」，簡單來說，就是當一個人擁有幸福美滿的家庭時，在外面遭遇他人的挑釁，選擇不去糾纏，而是退讓。但這並非是毫無原則的懦弱退縮，而是經過深思熟慮、權衡利弊之後的一種明智且理性的抉擇。因為越幸福的人，若與他人爭執，往往會付出更大的代價。那些挑釁的人，他們本身可能就處於人生低谷之中，心中充滿負能量，他們引發爭端的成本最低，無所畏懼，但我們不能因為逞一時之勇而與他人爭執，此時我們失去的可能遠比得到的多。閱讀上述文章，判斷下列何者行為符合「幸福者退讓原則」？
  options:
  - label: A
    content: 為了上學不遲到，在公車站與人推擠的宗緯
  - label: B
    content: 在班上口角衝突後，憤而持美工刀與同學對峙的大美
  - label: C
    content: 外送員送餐遲到，怒給負評的莫那阿魯
  - label: D
    content: 在高速公路被惡意超車卻能一笑置之的貨車司機阿嘉。
