  group_stem: "乙.\n余幼好書，家貧難致。有張氏藏書甚富。往借，不與，歸而形諸夢①。其切如是②。故有所覽輒省記③。通籍④後，俸去書來，落落大滿，素蟫⑤灰絲時蒙捲軸。然後嘆借者之用心專，而少時之歲月為可惜也！\n\
    \  今黃生貧類予⑥，其借書亦類予，惟予之公⑦書與張氏之吝書若不相類。然則予固不幸而遇張乎，生固幸而遇予乎？知幸與不幸，則其讀書也必專，而其歸書也必速。（袁枚\
    \ 黃生借書說）\n\n【注釋】（１）形諸夢：形之於夢。在夢中現出那種情形。（2）切：迫切。如是：這樣。\n（3）故有所覽輒省記：所以看過的就記在心裡。省，記。（4）通籍：新官通報名籍於朝廷。朝廷中已有他的名籍。此指當官。（5）蟫：一種昆蟲。性喜陰暗，食害衣服、書本等。也稱為「白魚」。（6）類：似、像。予：同「余」。（7）公：動詞，同別人共用。"
