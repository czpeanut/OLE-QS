- id: doc_113_新北_桃子腳_國文_g8s1e2_s3_40
  section: 3
  number: 40
  type: single
  page: 5
  stem: 根據本篇演說，下列敘述何者錯誤？
  options:
  - label: A
    content: 賀錦麗將幫助川普和平的移交政權
  - label: B
    content: 賀錦麗認為人民要忠於美國的某位總統或政黨
  - label: C
    content: 賀錦麗認為無論你是誰、出身如何，都必須享有得到尊重和支持的基本權利和自由
  - label: D
    content: 賀錦麗認為人民要忠於美國憲法、良知和上帝。
  group_stem: "己.\n「讓我們成為十億顆照亮黑夜的星星」賀錦麗敗選演說全文\n    今天我內心充滿感激，感謝你們對我的信任，感謝你們充滿對國家的愛；也感謝你們決心滿滿。這次選舉的結果不是我們想要的，不是我們奮鬥的目標，也不是我們投票的結果。\n\
    但請聽我說：美國的希望之光將永遠閃耀，只要我們永不放棄，只要我們繼續奮鬥。在這一百零七天裡，我們一直致力於建立社區和聯盟，將來自各行各業、不同背景的人們聚集在一起，以對國家的愛團結起來，帶著熱情和喜悅，為美國的未來而奮鬥。我們這樣做是因為知道，我們的共同點遠比分歧多。我知道現在大家的心情很複雜，我理解。但我們必須接受這次選舉的結果。\n\
    \    剛才，我與再次當選總統的川普通話，恭喜他獲勝。我還告訴他，我們將幫助他和他的團隊走完過渡期，我們將參與和平的政權移交。美國民主的一個基本原則是，如果輸了選舉，我們會接受。這一原則與任何其他原則一樣，將民主制度，與君主制或暴政區分開來，任何尋求公眾信任的人都必須尊重它。同時，在我們的國家，我們應該忠於美國憲法、良知和上帝，而不是忠於某位總統或政黨——我對這三者的忠誠，就是我今天站在這裡的原因。雖然我承認這次選舉失敗，但我不會放棄這場競選中所展現的鬥志，我也不會放棄為自由、機會、公平以及所有人的尊嚴而戰，為我們國家核心的理想而戰，為反映美國最好一面的理想而戰。\n\
    \    這是一場我永不放棄的戰鬥：我永不放棄為一個美國人可以追求夢想、抱負和願望的未來而戰，為一個美國女性可以自由決定自己身體的未來而戰，而不是讓政府告訴她們該怎麼做。我們永遠不會放棄保護我們的學校和街道，讓他們免受槍支暴力的鬥爭。在美國，我們永遠不會放棄為我們的民主、法治、平等正義而戰，以及為了這個至高無上的理念而戰——無論你是誰、出身如何，都必須享有得到尊重和支持的基本權利和自由。\n\
    \    我們將繼續在投票間、法庭和公共廣場上奮鬥，我們也將以更平靜的方式、在我們的日常生活中努力，以善意和尊重對待彼此，陌生人也視為鄰居，並始終利用我們的力量來提升他人，為所有人應得的尊嚴而戰。為自由而戰非常困難，但就像我常說的那樣，我們喜歡困難的事情，困難的事是好的，困難的事會成為一件快樂的工作，為我們的國家而戰總是值得的，永遠值得的。\n\
    \    給正在看這場演說的年輕人，如果你感到悲傷和失望，沒關係的。請知道，一切都會好起來的。在競選中，我經常說，當我們戰鬥時，我們會贏。但事情是這樣的，有時候為了什麼而戰，需要更久的時間，這並不意味著我們不會贏。重要的是，永遠不要放棄、永遠不要放棄、永遠不要停止努力讓世界變得更美好。你們擁有力量、你們擁有力量、永遠不要聽信任何人說「某件事是不可能的」只因為從來沒有人做過——你們有能力在這個世界上做出非凡的善舉。\n\
    \    所以，給看我演說的每個人，不要絕望。現在不是放棄的時候，現在，是捲起袖子、開始努力的時候，現在是組織起來、動員起來、加入行動的時候，為了自由、正義，以及我們都知道我們可以共同建設的未來。\n\
    \    我將以這樣一句話來結束今天的演講——一位歷史學家曾經稱之為「歷史規律」，對古往今來每個社會都適用。這句格言是：「只有當夜幕足夠黑暗時，你才能看到星星。」我知道很多人覺得我們正在進入一個黑暗的時代，但為了我們所有人好，我希望情況並非如此。但事情是這樣的——美國人民們，如果我們真的正在進入一個黑暗的時代的話，讓我們用十億顆明亮星星的光芒，樂觀、信念、真理和服務之光照亮天空。願這份努力引導我們，即使面對挫折，也會拚命完成我們身為美利堅合眾國一份子的非凡承諾。"
