    content: 從丁丁的說法來看，公共意見是具有差異性的
  - label: C
    content: 丁丁年紀至少已滿18歲
  - label: D
    content: 閱聽人對於媒體資訊沒有選擇權利，所以容易被媒體影響而不自覺。
