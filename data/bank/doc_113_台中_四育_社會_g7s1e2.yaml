    content: '1950'
  - label: B
    content: '113'
  - label: C
    content: '1999'
  - label: D
    content: 1922。
  group_stem: "三、\n   「兒少虐待」多發生在家庭，鄰居應可最早感受，但衛福部統計，來自「鄰居及社會人士」通報比率不到3%；學者也發現，「老人虐待」通報個案雖與日俱增，但根據盛行率推估通報率僅0.3%，不少長者礙於顏面難以啟齒，甚至含恨殞命。「虐兒」、「虐老」都得不到社區的關注，也成為台灣現代社會殘酷冷漠現實。\n\
    \    2018 年全國家暴受害人9 萬6693 人，65 歲以上老人從2008 年的2271 人飆升到2018 年的7745 人，是十年前的三倍多。典型老人受虐包括毆打、謾罵、不給吃喝、忽略照顧、遺棄等。\n\
    【社區殘酷冷漠 虐兒、虐老得不到關注／聯合新聞網／2021.4.19】"
