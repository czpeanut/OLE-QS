  group_stem: "二、\n    人口老化已是現今社會的普遍現象，根據我國國家發展委員會(簡稱國發會)推估，到民國150年我國老年人口比例將逼近34%。這場無聲無息展開的「銀色海嘯」將對社會生活的各個層面帶來影響。例如：勞動力供給出現失衡的現象。\n\
    \    根據國發會報告指出，工作年齡人口自民國105年起即開始減少，未來亦將隨總人口高齡化趨勢影響勞動力供給的規模。青壯人口逐漸減少，高齡人口逐漸增加，也將對青壯人口造成重大負擔。但也有人看到高齡社會帶來的商機，針對高齡人口推出客製化商品，熱銷結果也讓業者賺進大把鈔票。學者指出，面對此種不可避免的趨勢，政府宜及早提出因應對策，否則真的等到那一天，「銀色海嘯」所帶來的重大衝擊將遠遠超過我們現在的想像。"
