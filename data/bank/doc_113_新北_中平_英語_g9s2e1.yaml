  group_stem: 'According to Reader’s Digest and some reliable sources, Americans who
    are over 50 years old have been scammed out of nearly 3 billion dollars. Now the
    scammers keep making money through scams. These bad guys are expected to make
    10000 billion dollars by 2025.

    Teenagers and seniors are usually to be the scam targets. Fraudsters would do
    everything in their power to get the targets’ money. For example, fraudsters send
    teenagers e-mails with “special” discounts, and teenagers who need to save money
    for things they want may fall for the trick. Another example is that some old
    people who live alone may wish to find some love on the Internet, but ended up
    losing much money to the fraudsters.

    However, the good news is that the companies and governments around the world
    have noticed this serious problem. They have invested much money in technology
    and invited experts to study scam cases to find ways to stop scams from happening.
    Not only companies, governments, technology, and experts, but also other people
    can help. When getting a phone call or an e-mail which asked you to send money,
    give information, or do something right away, follow the steps below. By working
    with the police, we could even bring these criminals to justice.


    Adapted from Reader’s Digest June 2023


