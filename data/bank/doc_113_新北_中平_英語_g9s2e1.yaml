- id: doc_113_新北_中平_英語_g9s2e1_s6_38
  section: 6
  number: 38
  type: single
  page: 4
  stem: What does a photographer do?
  options:
  - label: A
    content: Keep a diary.
  - label: B
    content: Share knowledge.
  - label: C
    content: Take pictures.
  - label: D
    content: Write reports.
  group_stem: 'Ingo Arndt remembered seeing a five-foot-tall mound in a forest near
    their house when he was a child. The mound was covered with leaves and lots of
    red wood ants. As he tried to see more clearly and closely, a strange, thick,
    and strong smell made him stop and think twice. Many years have passed, and Ingo
    has become a writer and photographer and works for National Geographic. He now
    lives in the country in German with his wife. One day while he was doing his job
    and hiking through the forest with the camera in his hand, he thought of the mound
    and decided to find out the answers to the questions he has asked when he was
    a child. How do small ants build such a giant mound? Why does the air near the
    mound have a strange, thick, and strong smell?

    With some researchers’ help, Ingo Arndt found out some surprising facts about
    the ants and mounds. First, because ants have powerful mandibles, they can carry
    things which are many times heavier than themselves. They also use mandibles to
    cut and fight. The biggest mound the ants made can reach seven feet tall and 31
    feet wide. Queen ants, baby ants, worker ants, and nurse ants live in different
    rooms in the huge mound. Second, ants spray acid to attack strangers and kill
    the pathogen which makes baby ants sick. They also use acid to check if there
    are any strangers. It is fun that some birds learn ant acid can kill the pathogen
    on their body, so they sometimes stand on the mound and let the ants attack them.
    Poor ants. It turned out that it is no use to attack birds; they are just wasting
    their acid and help the birds stay clean and healthy.

    * one meter = 3.28 feet

    Adapted from National Geographic February 2025


    | researcher 研究者 | mandible 上顎 | spray 噴灑 | acid 酸 | pathogen 病原體 |

    | :--- | :--- | :--- | :--- | :--- |'
