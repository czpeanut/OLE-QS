- id: doc_113_新北_桃子腳_國文_g8s1e1_s3_40
  section: 3
  number: 40
  type: single
  page: 6
  stem: 根據本文，下列敘述何者正確？
  options:
  - label: A
    content: 文章探討了個人的因果和劣根性
  - label: B
    content: 每個人的經驗看似不特別，卻暴露自己內在的脆弱
  - label: C
    content: 痛苦的經驗可藉由分享，讓人感同身受
  - label: D
    content: 作者認為世界以自己為中心。
  group_stem: "戊.\n       沒有出口的迷宮，是走不出來的 ◎宋尚緯\n    每次在看他人書寫自身經驗時，許多人會寫自己的經驗並不特別。但不特別的經驗之所以特別，在於每個人都有相似的經驗，卻不是每個人都會選擇將它一一陳列在他人面前。許多人會害怕，怕自己的脆弱被他人掌握、怕自己痛苦的經驗，在他人眼中是一個不怎麼樣的笑話。說起來我也沒有什麼特別的回憶，只是我們都知道的──所有特殊的痛苦經驗，再特殊也是他人的痛苦。痛苦這種事情像是火，你不自己親身去碰一次，你永遠不知道自己被灼燒的時候會有多難受。\n\
    \    我支持的價值觀有性別、性向，以及其他種種，但追根究柢，其實就是一句話──尊重他人。我們都該了解到這個世界並不只有自己存在，即使世界再荒謬，我們也該認知自己這個世界並不以己為中心。中心其實並不存在，我們能察覺到的都是某種偏移的結果。認知到這件事很難，不是嗎──畢竟我們的自私所掠奪到的、所侵占的，都是實在的好處。我們能夠確實理解這個世界做任何事情都是有代價的，只要代價足夠，就沒有無法完成的事情。但我想每個人都該回頭想想，當代價是自己，或者自身親近的人時，自己會怎麼選擇。\n\
    \   這個要求其實太抽象了，許多人無法理解自己是代價是什麼狀況，他們習慣犧牲別人，將別人當作籌碼，以為自己像個瀟灑的賭徒，在人生這個牌桌隨意地梭哈。他們站在階級的高處，掌握資源，用雍容優雅的姿態告訴大家──你們該感恩。我們該感恩什麼呢？這個世界很奇妙的地方在於，真正幫助我們的人很少向我們要求感謝，反而是造成我們痛苦的人一直在告訴我們，你們該感謝我，你們若有絲毫成就，都是我的努力。這跟父母不太一樣，我們上一代的父母，大多都不知道該如何成為父母，許多父母想要孩子好，但不知道該怎麼做，於是最後只能複製他們的父母對自己做的事。大家想要的跟實際做出來的，常常是兩個相反的極端。我們的上一代父母像是在玩一種真實版的電子雞（甚至不是美少女夢工廠），要求我們讀書、克己，將所有生活都設置成單行道，時間到了我們自己應該變態成另外一種生物──我們應該孝順、開朗、外向、健談、對世界保持希望。正常情況下，即使父母做出許多錯誤的選擇，他們的核心概念仍是希望培養我們對於生活的抗性（當然，也有許多父母不配做人父母，人說天下無不是的父母，才沒有這回事，天下當然有不是的父母），而其他人呢？其他要求我們感恩的人，大多都是一邊剝削他人，一邊要人感謝他的剝削。\n\
    \   我們這一代人對父母的感受是複雜的，許多人知道父母是為我們好，但父母常常做的事情真的說不上是好，而是一種混合著上一代的高壓風格，與這一代幻想要與孩子做朋友的理想共進的。他們會認為自己應該要和孩子做朋友，但又無法真正擺脫身為父母、長輩的認知。我們這一代的父母說起來也很可憐，我們都不像他們一樣活在那個社會氛圍下了，我們會有自己的想法，甚至會付諸行動反抗，他們逃不了上一代的傳統，也沒有辦法強逼著我們承襲那個傳統，所以他們卡在中間無法動彈。\n\
    \    人很有趣的狀況是，人對自己都有錯誤的認知，例如年齡虛長了，他們就認為自己真的成長了，於是我們常常會看到有人用年紀壓我們，他們會說自己吃的鹽比我們吃過的飯都要多，聽他們的才是對的（每次我都想，鹽巴要吃得比我吃的飯多，大概已經換了十顆腎了吧），長輩跟父母也常常會用輩分來壓我們，但現實狀況是，人這輩子都在處理自己在幼時所受到的心理創傷。人會在自己所受過的傷裡不停打轉，他會反覆糾結、拉扯，為什麼自己會有那些遭遇，憑什麼自己要受到那些痛苦、打擊。直到長大，成為父母後也仍是如此。許多時候家暴的父母也有一個家暴的父母，他們複製自己的痛苦，而他們對此並沒有任何反應，因為連他們自己都不知道在自己身上發生了什麼事情。人時常是肉體長大了，精神卻沒有，因為你內心的孩子在受到傷害的時候就永遠停在那個當下了，你沒有處理好它，你就無法繼續前進。痛苦就卡在你的世界裡，讓你無法長大。\n\
    \   如果真要問我如何解決，我也沒有解決的辦法，我只能提供自己的方法跟給自己的心理建設給你們參考而已。我只是告訴自己，遇到了就遇到了，收拾好自己的痛苦，像我沒有必要去忍受他人帶給我麻煩一樣，別人也沒有必要要處理我的創傷。我們都不想遇到不好的事情，但許多時候我們就是遇到了，整個人卡在痛苦的記憶裡也不會讓自己變得更好。人生並不是所有事情都有解答，尤其是「為什麼是我」這個問題。我也沒有辦法解答，為什麼是我被欺負，為什麼是我身體這個樣子，為什麼是我眼睛出了狀況，為什麼是我必須解決某些事情，為什麼是我遭遇到了這些事情──這些都沒有答案的，哪有為什麼，我就是遇到了啊。\n\
    \    我後來就不問沒有答案的問題了，因為沒有出口的迷宮，是走不出來的。\n\n                               ──摘自《孤島通信》"
