  group_stem: "丙.\n       運氣 ◎趙文豪\n\n日子不會突然就修好我們的心\n走在日常的路上\n日光晴朗，依舊\n疲倦的走進翠綠的田邊\n\
    當風吹進──「有什麼值得放不下心的\n有什麼不值得帶離的」\n\n有人在遠遠的島嶼上\n聽說瘟疫蔓延。幸好你們也很好\n想起一部幾年前說好\n一起去看的電影重新上映了，\n\
    我站在稻田中央\n當陽光照進\n波浪介入，深藍色的油墨\n在不著邊的岸\n輕輕撥開溢出的海\n還有遠方，盛開的藍天\n\n有鸚鵡停在一棵黃得正好的芒果樹上"
