  stem: 以本文判斷，下列敘述何者錯誤？
  options:
  - label: A
    content: 上一代的父母常不知道如何做父母
  - label: B
    content: 年齡虛長的同時，不意味著你成長了
  - label: C
    content: 痛苦常卡在你的世界裡，讓你無法長大
  - label: D
    content: 人生中所有事都有解答。
  group_stem: "戊.\n       沒有出口的迷宮，是走不出來的 ◎宋尚緯\n    每次在看他人書寫自身經驗時，許多人會寫自己的經驗並不特別。但不特別的經驗之所以特別，在於每個人都有相似的經驗，卻不是每個人都會選擇將它一一陳列在他人面前。許多人會害怕，怕自己的脆弱被他人掌握、怕自己痛苦的經驗，在他人眼中是一個不怎麼樣的笑話。說起來我也沒有什麼特別的回憶，只是我們都知道的──所有特殊的痛苦經驗，再特殊也是他人的痛苦。痛苦這種事情像是火，你不自己親身去碰一次，你永遠不知道自己被灼燒的時候會有多難受。\n\
    \    我支持的價值觀有性別、性向，以及其他種種，但追根究柢，其實就是一句話──尊重他人。我們都該了解到這個世界並不只有自己存在，即使世界再荒謬，我們也該認知自己這個世界並不以己為中心。中心其實並不存在，我們能察覺到的都是某種偏移的結果。認知到這件事很難，不是嗎──畢竟我們的自私所掠奪到的、所侵占的，都是實在的好處。我們能夠確實理解這個世界做任何事情都是有代價的，只要代價足夠，就沒有無法完成的事情。但我想每個人都該回頭想想，當代價是自己，或者自身親近的人時，自己會怎麼選擇。\n\
