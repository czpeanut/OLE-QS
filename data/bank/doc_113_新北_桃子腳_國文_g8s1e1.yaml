  stem: 下列對於朱爾玫的敘述，何者正確？
  options:
  - label: A
    content: 雍正年間，曾被京師王公稱為神仙
  - label: B
    content: 他有神通邪術，能窺探他人生活
  - label: C
    content: 鑽研讀心術有成，能知曉他人心思
  - label: D
    content: 被熊文貞斥為妖人，憤而離去。
  group_stem: "丁.\n    康熙間，朱爾玫以邪術惑人，有神仙之號，名重京師，王公皆折節下之，惟三登熊文貞公之門終不得見。一日，朱又往告司閽①云：「相公今日著何服，食何菜，坐何處地方，我一一皆知。」司閽者以其言皆中，驚白相公。公笑曰：「朱某所測我者，果件件不錯，可謂仙矣。第我心上有『不喜見妖人』五個字，渠竟茫然不知，可以謂之仙乎？」司閽以告朱，朱慚沮而退。\n\
    \    相傳朱與張真人鬥法：以所吃茶盃擲空中，若有人捧者，竟不落下。張笑而不言。朱有自矜之色，嗤張不能為此法。張曰：「我非不能也，慮破君法，故不為也。」朱固請，張不得已，亦擲一盃，則張杯停於空中，而朱盃落矣。或問真人，真人曰：「彼所倚者，妖狐也；我所役者，五雷正神也。正神騰空，則妖狐逃矣。」亡何，朱遂敗。\n\
    註釋：\n1. 司閽:守門人。\n                                  《子不語‧妖道》"
