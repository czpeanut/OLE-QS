  section: 3
  number: 43
  type: single
  page: 6
  stem: 根據上文判斷，下列敘述何者正確？
  options:
  - label: A
    content: 王童巧施妙計除掉餓虎
  - label: B
    content: 王童命大，幸運逃過一劫
  - label: C
    content: 藤斗是獵捕猛獸的機關
  - label: D
    content: 惡虎最終被捕獲而死。
  group_stem: "己.\n    樗里 王姓童子攜藤斗糴①米，時暮雨，過溪邊木橋，童子即以斗加頭上，手扶木欄過橋。有虎在橋下伺，前咬童子頭，得其斗而去。童子仆地，謂是人所推跌，捽②其斗而去也。明日，山中人見虎狂走遍山，則虎銜藤斗不可脫也。虎口合則藤斗隨合，虎口張則藤斗隨張，斗塞滿口。藤性韌，絲絲嵌入虎牙縫中。虎性躁，不可耐，走三日而伏斃於山中。頭猶仰，張其口，猶含藤斗也。\n\
    註釋：\n2. 糴，音ㄉ一ˊ，買入穀物\n3. 捽，音ㄘㄨˊ，抓的意思"
