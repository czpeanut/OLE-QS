  stem: 請寫出王藍田在失去理智後，做了那些舉動？(2%)
  group_stem: "王藍田忿食雞子\n    王藍田性急。嘗食雞子，以箸刺之，不得，便大怒，舉以擲地。雞子於地圓轉未止，仍下地以屐齒蹍之，又不得，瞋甚，復於地取內口中，齧破即吐之。王右軍聞而大笑曰：「使安期有此性，猶當無一豪可論，況藍田邪？」"
