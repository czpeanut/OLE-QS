  group_stem: "乙.\n        隱喻 ◎許玄妮\n我不會評斷詩的好壞\n以為能寫進心底\n就是我要的\n我不能分辨愛人的好壞\n你讓我痛\n\
    我以為是正確的\n\n磨一把刀\n讓你親手\n放進我的心臟\n跳動的時候\n刺出好多個小洞\n在破掉的地方\n打一個又一個結\n\n那個結是三年前的冬天\n\
    這個孔是去年八月\n還來不及癒合\n\n我的一生\n寫給一輩子不讀詩的人\n長年未清洗的被褥\n掀開來全是淚水\n\n你從來不去掀開它"
