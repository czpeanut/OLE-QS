  stem: 臺灣道孔昭慈在1859年要求外國商船「不准像之前一樣在安平附近起卸貨物」。有位英國商人分析：「這並非臺灣道刻意禁止外商在臺灣府貿易，而是因為府城當地泉州人組成的『商人團體』，跑去向福建巡撫告狀，指控外國商船收購物產，造成物價上漲，影響了本地商人的生意。」請問：上文敘述中的『商人團體』是指什麼？
