  stem: 「金廣福」墾號是一個由閩粵兩籍合股組成的開發公司，粵籍墾戶首姜秀鑾率領閩粵佃農數百人，從樹杞林（今竹東）附近突進北埔，建立據點，然後建設新隘三十六處，形成一個大防禦線，因此又稱大隘。專門抵禦外來的侵略，保護武裝拓殖番地的據點。請問：上文中提及的「大隘」，主要用來防禦的對象為何？
