- id: doc_113_高雄_楠梓_社會_歷史_g7s1e3_s1_35
  section: 1
  number: 35
  type: single
  page: 2
  stem: 「騎樓」民間俗稱「亭仔腳」，以目前現存的騎樓判斷，騎樓在臺灣出現的時間，至少有二百多年的歷史。在下【圖五】的騎樓為木竹材質，設置主要目的是為了遮陽避雨。居民通常在房子內加了夾層，這個夾層多半有個小窗，平時用以通風採光。又因為當時漢人移民大量進入臺灣，吏治不良，社會治安不好，民變、械鬥紛起，小窗可窺伺屋外動靜，必要時甚至可以置槍防禦。根據上文描述，可以推斷此類建築最常見於何時？
  options:
  - label: A
