  stem: 「潘敦仔所率領的岸裡社，在清帝國時期屢次協助清軍平亂，成為中部勢力最強盛的原住民部落，尤其他在協助平定大甲西社事件後，受皇帝召見，獲賜御衣。此外，他也透過『割地換水』與漢人通事張達京合作，將水源引進岸裡社。從現今所存的潘敦仔畫像可知，潘敦仔身著清帝國武官服，是清帝國時期原住民在漢文化影響下的呈現，符合漢人傳統祖先畫像的形式，畫中所繪的耳洞是辨别其原住民身分的唯一特徵。」潘敦仔「割地換水」將水源引進岸裡社，可能是哪一個水利設施？
