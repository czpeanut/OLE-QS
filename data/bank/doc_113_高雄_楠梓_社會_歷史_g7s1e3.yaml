  stem: 血糖衛教師三榮財，穿著「抗醣教官」的背心，為社區關懷據點長輩服務，他的姓氏引起矚目。三教官告訴記者，三姓是臺灣竹塹社特有的漢姓，為清朝乾隆皇帝賜姓平埔族群道卡斯族的七姓之一。請問：三教官的家族在當時最不可能會碰到什麼狀況？
