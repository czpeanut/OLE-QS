  stem: 「大港口事件起因於沈葆楨的『開山撫番』政策，總兵吳光亮率兵欲強行開闢水尾至大港口的道路，開路期間兵員伙食、營房建築、築路等工程，均由這一族群供應或勞役。因過度壓榨勞力和軍隊屯駐，壓縮族人的生活空間等因素，使得族人起而反抗。此事件讓當時這一族群的壯年精英死傷慘重，並離開原來的居住地。」請問：上文中的「大港口事件」發生在哪一族群？
