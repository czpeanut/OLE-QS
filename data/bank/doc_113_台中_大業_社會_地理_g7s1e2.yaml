  - label: D
    content: 南投縣
  group_stem: "（一）2019 年「寶島仲夏節」的主題曲，您有聽過嗎？這首歌是〈ICE ICE 你〉，由歌手黃小玫所創作，她希望能藉由歌曲帶領大家環遊臺灣，並認識各地的冰品。部分歌詞如下：\n\
    「大家好 歡迎光臨臺灣冰果室\n來來來 讓我來帶你邊玩臺灣邊吃冰\n炎熱的夏天有你在身邊 我們熱血的全臺跑一遍\n東西南北你來決定 甩去哪一邊\n每個地方的冰品也通通吃一遍\n\
    在臺中珍珠奶茶也能做成冰\n去集集就是要吃山蕉冰\n懷舊糖廠冰就在  8    \n道地釋迦冰在  9    的海邊\n   12   沒有沙漠但有仙人掌冰\n\
    看古蹟古蹟吃  戊   芒果冰\n來去  己   聆聽海港的聲音\n揪多一點人吃超大碗公冰\n   10    溫泉冷熱池就像燒冷冰（台語）\n東港有櫻花蝦冰淇淋\n\
    Ice Ice 你 我最愛是你」\n請根據圖【一】臺灣行政區圖，依序回答第1~5 題："
  shared_asset: g1_1_5
  tags:
    chapter:
      publisher: 翰林
