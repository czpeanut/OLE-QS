- id: doc_113_高雄_獅甲_國文_g7s1e1_s5_34
  section: 5
  number: 34
  type: single
  page: 5
  stem: 「即使是掉落到最深的井，我們也能安然地脫困。」根據本文，其脫困的方法為何？
  options:
  - label: A
    content: 等井有水就能浮升上去而逃脫
  - label: B
    content: 呼喚友伴用繩子將自己救出去
  - label: C
    content: 將泥沙轉換成墊高自己的石頭
  - label: D
    content: 靜待在原地等人經過就能獲救。
  group_stem: '（三）

    在生命的旅程中，有時候我們難免會陷入「枯井」裡，會被各式各樣的「泥沙」傾倒在我們身上，而想要從這些「枯井」脫困的祕訣就是：將「泥沙」抖落掉，然後站到上面去！事實上，我們在生活中所遭遇的種種困難挫折就是加諸在我們身上的「泥沙」；然而，換個角度看，它們也是一塊塊的墊腳石，只要我們鍥而不捨地將它們抖落掉，然後站上去，那麼即使是掉落到最深的井，我們也能安然地脫困。

    如果我們以肯定、沉著穩重的態度面對困境，助力往往就潛藏在困境中。一切都決定於我們自己，學習放下一切得失，勇往直前邁向理想。我們應該不斷地建立信心、希望和無條件的愛，這些都是幫助我們從生命中的枯井脫困並找到自己的工具。

    「化阻力為助力」這句話我們常聽到，人在成長過程中，定會遇到一連串的考驗與阻礙，有的人克服了考驗與阻礙追求到自己的目標，而有些人卻被考驗與阻礙所克服而自己放棄成功。倘若，有人聽到旁人說，你不可能成功啦，馬上就放棄了，有的人卻因這句話而不服輸，更加努力做給旁人看。相信喜歡學習、有上進心的人，都將成為克服考驗排除阻礙的成功者。換另一個角度看，人生的旅途中，誰也沒權力決定他人的生與死，成與敗，我們不喜歡人家隨便決定我們，當然我們也不可隨便決定他人，不輕易幫他人決定要與不要，一切均由自己決定。

    （節錄自晉天雜誌 你也在井裡嗎？）'
