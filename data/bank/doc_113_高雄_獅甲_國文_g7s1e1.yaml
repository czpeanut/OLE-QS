    content: 日向：我馱著我的小房子走路／我馱著我的小房子爬樹／慢慢地／慢慢地／不急也不慌――獨角仙
  - label: B
    content: 月島：昔日的圖騰／今日我是／拔去了毒牙，淨身／除膽，兼以下鍋的／羹湯一碗――蜘蛛
  - label: C
    content: 菅原：身長肚大腦袋小，會飛會跳穿綠袍，手拿兩把大剪刀，只捉害蟲不割草――蜻蜓
  - label: D
    content: 影山：感謝你們／對於我／小小的存在／還報予／生命最熱烈的掌聲――蚊子。
