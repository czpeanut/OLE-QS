- id: doc_113_高雄_獅甲_國文_g7s1e1_s5_31
  section: 5
  number: 31
  type: single
  page: 4
  stem: 讀完本詩，可知作者為何而嘆息？
  options:
  - label: A
    content: 感情不順
  - label: B
    content: 花朵凋謝
  - label: C
    content: 果實不甜
  - label: D
    content: 時光流逝。
  group_stem: '（一）

    花是無聲的音樂，

    果實是最動人的書籍，

    當它們在春天演奏，秋天出版，

    我的日子被時針的齒輪

    給無情地囓咬，絞傷

    庭中便飛散著我的心的碎片，

    階下就響起我的一片嘆息。

    （楊喚 花與果實）

    註：①囓：音ㄋㄧㄝˋ，咬。'
