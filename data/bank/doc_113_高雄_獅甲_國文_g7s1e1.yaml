- id: doc_113_高雄_獅甲_國文_g7s1e1_s5_32
  section: 5
  number: 32
  type: single
  page: 4
  stem: 「我踏過的，是不曾虛度的昨天，我去向的，永遠是比今天更好的遠方。」關於這句話的解讀，何者正確？
  options:
  - label: A
    content: 不論是昨天或明天，都不應該虛度浪費
  - label: B
    content: 因為有昨天的努力，所以有更好的未來
  - label: C
    content: 只要向前看，就不會受昨天的失敗所影響
  - label: D
    content: 所謂生活，就是昨日與明日的不斷循環。
  group_stem: '（二）

    高爾基說過這樣的一句名言：「哪怕對自己的一點小小的克制，也會使人變得強而有力。」當我越自律，便越能感受到內心的強大，便更想去深挖自己的潛力。這份約束，讓生活走入一個良性循環，我踏過的，是不曾虛度的昨天，我去向的，永遠是比今天更好的遠方。

    我們羨慕那些能夠作出傑出成就的人，但你是否知道，他們並非個個天賦異稟，他們在才華之上，更相信自律的力量。自律讓一個人通過意志力不斷地修正自我瑕疵，在日積月累的堅持中逐漸變得強大而有力，這是一個人在命運多種不公平的因素面前，能夠主動選擇擁有的唯一公平的後天競爭力。而自律的人都在用行動表達，當我自律，人生無敵。

    （楊熹文 當我自律，人生無敵）'
