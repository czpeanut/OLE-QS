    ●營業時間24H，本店使用O3 臭氧殺菌，乾淨衛生。

    ●可使用兌幣機兌換零錢，或購買儲值卡可享有更多優惠。

    ●洗衣9 公斤40 元、14 公斤60 元、20 公斤80 元、25 公斤100 元。

    ●烘乾5 分鐘10 元，普通衣物建議選擇高溫30 分鐘

    ●洗衣精10 元，柔軟精10 元，建議使用本店販售高效能洗劑。

