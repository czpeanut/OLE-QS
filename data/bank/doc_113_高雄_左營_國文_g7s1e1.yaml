  group_stem: "（三）\n 「時間就像海綿裏的水一樣，如果你願意擠，總還是有的。」魯迅是民國初年有名的文學家，他這句經典的勵志格言，不斷被人傳誦、引用。對於時間的運用，他還曾經說過：「生命是以時間為單位的，浪費別人的時間，等於謀財害命；浪費自己的時間，等於慢性自殺。」\n\
    \ 的確，與人有約時，我不願意遲到，更痛恨別人遲到。到了後來，我通常就隨身帶書，以備不時之需，或者跟人約在書店碰面，在等待時可以趁機逛書店。\n 我們常說「時間管理」，但其實時間不是我們所能管理的。雖然我們常說「時間就是金錢」，但是時間與金錢不同──錢可以管理，因為通常所說的「管理」是可以累積儲存，並且加以運用的，但時間不行。\n\
    \ 因此，真正的問題不在於「管理時間」，而是「管理自己要做的事」，我們需要的不是「節省時間」，而是「節省工作」。我們抱怨時間不夠用，是因為我們沒有認真想清楚，究竟我們要什麼？什麼是我們生命中真正看重的？\n\
    \ 當我們看清楚生活中的輕重緩急，並依此而調整優先順序，把想做的事都做了，就不會惶然，而能夠增加自己生活的滿意度。\n 設定優先順序，最重要的是決定「哪些是必須捨棄的」：分析自己一天二十四小時、一星期七天大概都是怎麼過的，挑出可以捨棄的項目──除了工作，以及為了別人不得不花費的時間之外，剩下可利用的時間，有多少是被自己習慣性的行為不知不覺消耗掉了？\n\
    \ 韓國暢銷作家金蘭都教授，很具體的建議應該從事的行為：放下線上遊戲，多閱讀；減少上網時間，多讀報紙；看電視，不如觀賞電影；別只是空想，要多思考；聊八卦，不如與人深度交談……。\n\
    \ 現代人真的花太多時間在網路上了，這些年行動通訊設備的普及，全面改變了我們的生活，有人如此形容：原本應該帶來自由的科技，卻創造了手銬，將我們的思緒綑綁在片段零碎的訊息中。\n\
    \ 我們以為善加利用時間，可以同時處理很多事，其實所完成的零星小事，只是創造出非常有效率的假象，當我們一整天都被這些說不清楚的雜事占據了，反而令我們很沮喪。因為我們需要完整而集中的時間，做真正重要的事，才會覺得生活是有意義的。\n\
    \ 把時間花在我們覺得重要的事情之上，這是運用時間的關鍵祕訣。這些事也許是我們的夢想，也許是陪伴我們深愛的人。\n 有人解釋：「什麼才是真正浪費時間？那就是沒有為你生活中有一席之位的人，騰出足夠的時間。」的確是如此，因為人的幸福感主要來自於人與人的關係，尤其是我們所看重的人。\n\
    \ 詩人威廉•考柏也這麼說：「真正快樂的唯一來源，是為了某種我們看重的意義而花費我們的時間、我們的生命。」\n 因此，管理時間和運用時間，重點在於：找到我們渴望的事，然後每天空出時間真切的去做。\n\
    \ ──選自李偉文 善用時間的方法"
