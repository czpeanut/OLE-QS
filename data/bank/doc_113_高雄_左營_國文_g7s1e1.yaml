    content: 賠了夫人又折兵
  group_stem: "（五）\n 昔有一人，于甕中盛穀。駱駝入甕食穀，首不得出，主人以為憂，無計可施。有一老人來語之，曰：「汝莫憂，吾有以教汝出。」主人亟①問：「法何？」老人曰：「汝當斬駝頭，自當出之。」主人以為妙，即依其語，以刀斬駝頭。既殺駝，而複②破甕，如此癡人，為世人所笑。\n\
    \ ──選自百喻經\n\n\n①亟：緊急、急切。\n②複：再、又。"
