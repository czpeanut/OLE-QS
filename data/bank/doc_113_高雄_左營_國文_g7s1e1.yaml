  options:
  - label: A
    content: 張敬伯是位膽大心細的人
  - label: B
    content: 這條棧道本來就容易行走
  - label: C
    content: 習慣成自然，克服恐懼感
  - label: D
    content: 棧道防護周全，令人安心
  group_stem: "（四）\n 張敬伯常經山險，謂余曰：「天下事常震①於始，而安於習。某②數過棧道，初不敢移足，今如履平地矣。」余曰：「君始以為險，是不險；近以為不險，卻是險。」\n\
    \ ──選自呂坤 呻吟語\n\n\n①震：震驚。\n②某：自己"
