  stem: 依據內容，下列敘述何者正確？
  options:
  - label: A
    content: 非破壞性水果糖度檢測技術的研發目前仍在測試階段
  - label: B
    content: 非破壞性水果糖度檢測技術是以雷射光線為測量光源
  - label: C
    content: 傳統榨汁的檢測方式較不受果皮厚或構造特殊的限制
  - label: D
    content: 傳統檢測方式目前已完全被非破壞性檢測技術所取代
  group_stem: "（二）\n 臺灣很早以前便有水果糖度檢測裝置，只是這種傳統方式需要將水果榨汁，然後再把果汁滴入屈折計中，才可以測量水果的糖度，簡言之，這種方法必須破壞水果，所以僅能作抽樣檢測，並不能得知所有水果的甜度。為了突破這樣的困境，桃園區農業改良場自2003\
    \ 年起開始研發「非破壞性水果糖度檢測技術」，發展至今這項技術已相當純熟，目前也已將技術移轉至廠商開始量產。\n 這種非破壞性水果糖度檢測技術，是以紅外光為光源，經過掃描後即能判斷每顆水果的糖度。桃園區農業改良場經過七年的研發與試驗後，目前非破壞水果糖度檢測有兩種系統，一種是線上型，一種是桌上型。線上型其實就像是輸送帶一般，將水果放置在輸送帶上一一檢測，「但要小心，不能讓兩顆水果碰在一起，否則就無法測量出來」；而桌上型的檢測裝置是需要一顆一顆的放置在儀器上測量，不能像線上型一樣全部擺上輸送帶，所以桌上型的價格也比線上型低許多。\n\
    \ 非破壞性水果糖度檢測技術有助於協助水果選別，可應用於芒果、鳳梨、蓮霧等，讓農產品得以依照品質而建立分級制度，但該檢測技術仍有其限制，例如果皮過厚的水果就不易測出糖度，或是果實構造特殊的水果也難以檢測，像是文旦柚因為果實中心有白色的柚囊，無法吸收紅外光，除非改用雷射為光源，才能穿透約五公分的果皮進而測出糖度多寡。另外，其準確度仍比不上傳統榨汁測量的方式，還是會有誤差，不過，它的優點仍然很多，不必破壞水果、能夠掌握整批水果的品質，也可以縮短人工處理分級的時間，未來有極大的潛力能夠普遍應用，讓臺灣的水果能夠因標準化的分級作業，而提升產品價值，並增加水果產業的競爭力。\n\
    \ ──改寫自臺灣農業故事館網站"
