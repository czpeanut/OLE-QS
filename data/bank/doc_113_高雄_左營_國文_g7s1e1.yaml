    content: 增加抵抗力最有效的方法，就是天天喝一杯現打的胡蘿蔔汁
  - label: B
    content: 湯中加入亞硝酸鹽能讓湯頭更加美味，不過卻有致癌的危險
  - label: C
    content: 內心快樂的人，身體抵禦外來病毒入侵能力也會變得比較好
  - label: D
    content: 病人透過食補只能改善病情，若希望身體痊癒還需配合服藥
  group_stem: "（一）\n 胡蘿蔔中含有多種維生素，有助於增加病人的抵抗力。每天喝上一杯現磨的胡蘿蔔汁，就能有不錯的療效，不過它畢竟不是藥，可不能指望它「百病必除」，而且喝太多還會造成色素沉澱，所以要適量才好。除了胡蘿蔔之外，番茄、牛蒡、大豆芽、豆腐等營養物質都可以吃，因為這些食物都富含維生素、纖維素，不管吃哪一種對身體都能起保健作用。\n\
    \ 除了食補之外，要特別注意不飲用老湯，所謂的老湯是指燉煮過久或重覆加熱的湯。雖然嘗起來美味，但含有致癌物亞硝酸鹽，要盡量少喝才好。另外，養成適度的運動習慣也很重要，尤其多親近大自然對病情的穩定更加有效，閒暇時到郊外散散步，看看花草樹木，既能吸收更多空氣中的氧氣負離子，又能使心情愉悅。一個人只要身心保持舒暢，對一切事物不加計較、執著，快樂的度過每一天，藉由人體本身的抵抗力來防禦病毒，便能對病情產生正面的效果；相反的，若成天垂頭喪氣，身體自然沒有動力，免疫力就會跟著下降。\n\
    \ 總之，健康就掌握在自己的手中，多吃有益的食物、多運動，保持心情的愉悅，再乖乖配合醫生的治療，相信病人也能享有希望的人生。\n ──改寫自網路文章"
