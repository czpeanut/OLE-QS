- id: doc_111_桃園_中興_社會_公民_g8s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: '下表為大法官做出的憲法解釋文，請依據內容判斷，下列何者說明最正確?


    | 大法官解釋字號 | 釋字第 443 號 |

    | --- | --- |

    | 解釋重點 | 以役男出境處理辦法限制役男出境違憲？ |

    | 原內政部所訂之「役男出境處理辦法」第八條第一項規定: | 應徵年次內，尚未接受徵兵處理者，不同意出境 |

    | 解釋文 | 憲法第十條規定人民有居住及遷徙之自由，旨在保障人民有任意移居或旅行各地之權利。若欲對人民之自由權利加以限制，必須符合憲法第二十三條所定必要之程度，並以法律定之或經立法機關明確授權由行政機關以命令訂定。限制役男出境係對人民居住遷徙自由之重大限制，兵役法及兵役法施行法均未設規定，亦未明確授權以命令定之。行政院發布之徵兵規則，委由內政部訂定役男出境處理辦法，欠缺法律授權之依據，該辦法第八條規定限制事由，與前開憲法意旨不符，應自本解釋公布日起至遲於屆滿六個月時，失其效力。
    |'
  options:
  - label: A
    content: 該解釋說明原內政部所訂之辦法限制應徵年次內未接受徵兵處理不同意出境牴觸憲法
  - label: B
    content: 上表畫底線之法規其位階屬於法律位階
  - label: C
    content: 此解釋宣告兵役法是無效的法律
  - label: D
    content: 此解釋做出後將擴大人民的參政權。
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 公民
      code: 2-1
      title: 法律的位階
      chapter: 第2章 憲法與權利保障
    textbook: 八上公民 2-1 法律的位階
    labeled_by: ai
- id: doc_111_桃園_中興_社會_公民_g8s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 3
  stem: '下表為憲法及刑事訴訟法之條文，請根據內容判斷，下列何者說明最正確?


    | 中華民國憲法第 8 條 | 人民身體之自由應予保障。除現行犯之逮捕由法律另定外，非經司法或警察機關依法定程序，不得逮捕拘禁。非由法院依法定程序，不得審問處罰。非依法定程序之逮捕、拘禁、審問、處罰，得拒絕之。
    |

    | --- | --- |

    | 刑事訴訟法第 88 條 | 現行犯，不問何人得逕行逮捕之。<br>1.犯罪在實施中或實施後即時發覺者，為現行犯。<br>2.有左列情形之一者，以現行犯論：<br>●
    被追呼為犯罪人者。<br>● 因持有兇器、贓物或其他物件、或於身體、衣服等處露有犯罪痕跡，顯可疑為犯罪人者。 |'
  options:
  - label: A
    content: 上述憲法條文所保障的權利為人民之受益權
  - label: B
    content: 因出國期間家中遭竊，返家以社區監視器找到某住戶行竊，社區保全可直接去其家中逮捕
  - label: C
    content: 憲法此條文說明人民的權利在任何狀況都不得侵害
  - label: D
    content: 從上述條文說明人民的基本權在必要限制時須以法定程序進行。
  tags:
    chapter:
      publisher: 翰林
      book: 八上
