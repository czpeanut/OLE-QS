  stem: '新聞報導

    監察委員因法官判決爭議約談法官引發社會關注，根據孟德斯鳩的理論，司法權依據法律獨立行使，超出黨派之外，但若對其缺乏監督的力量，對民主國家的發展其實並無好處。


    我國中央政府體制是依據五權分立原則而建立的，與歐美民主國家不同，依照上列新聞評論的內容判斷，其主旨應為下列何者？'
  options:
  - label: A
    content: 五權分立理論易產生濫用私人缺失
  - label: B
    content: 司法獨立審判機制將侵害人民權利
  - label: C
    content: 監察權與司法權的相互制衡
  - label: D
    content: 三權分立運作最為順暢。
  tags:
