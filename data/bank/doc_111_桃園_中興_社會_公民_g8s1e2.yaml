- id: doc_111_桃園_中興_社會_公民_g8s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 3
  stem: '下表為大法官作出之憲法解釋文，根據內容所述，下列何者說明最正確?


    | 大法官解釋字號 | 釋字第 649 號 |

    | --- | --- |

    | 解釋重點 | 身心障礙者保護法按摩業專由視障者從事之規定違憲？ |

    | 解釋文 | 中華民國九十年十一月二十一日修正公布之身心障礙者保護法第三十七條第一項前段規定：「非本法所稱視覺障礙者，不得從事按摩業。」（九十六年七月十一日該法名稱修正為身心障礙者權益保障法，上開規定之「非本法所稱視覺障礙者」，經修正為「非視覺功能障礙者」，並移列為第四十六條第一項前段，規定意旨相同）與憲法第七條平等權、第十五條工作權及第二十三條比例原則之規定不符，應自本解釋公布之日起至遲於屆滿三年時失其效力。<br><br>●
    九十年十一月二十一日修正公布之身心障礙者保護法第三十七條第一項前段規定：「非本法所稱視覺障礙者，不得從事按摩業。」係以保障視覺障礙者（下稱視障者）工作權為目的所採職業保留之優惠性差別待遇，亦係對非視障者工作權中之選擇職業自由所為之職業禁止。
    |'
  options:
  - label: A
    content: 上文之身心障礙者保護法對於非視覺障礙之限制已侵害人民工作權
  - label: B
    content: 上述畫底線之法律條文屬於命令位階
  - label: C
    content: 為了保障身心障礙者的工作，大法官認為本解釋並無違憲
  - label: D
    content: 上文解釋後可擴大人民的身體自由權。
