  group_stem: '2.

    Each country has her national flag, and usually there is a story behind each national
    flag. The national flag of the United Kingdom tells an interesting story, too.

    The UK has four parts. They are England, Wales, Scotland, and Northern Ireland.
    They all have their own flags. When Wales became part of England in 1542, the
    flag of England was the one used — nothing was changed. However, in 1603, when
    Scotland joined England to become a new country, the two national flags were put
    together to have a new flag. The last member, Ireland, joined the kingdom in 1801,
    and it was in that year that the modern flag we see today appeared. In 1992, however,
    parts of Ireland left the kingdom to become a new country. It also started to
    use its own flag.'
