  group_stem: 'Cindy got a good job recently, and she decided to reward herself with
    something special. After thinking about it for a while, she thought a smartwatch
    would be both useful and in fashion. However, she has no idea which one to choose.
    There are three new models available on the Answer website. All of them are beautiful,
    modern, and full of smart features, but they are not the same. For example, the
    materials of the screens are different. The screen of the Answer Watch Sport is
    glass and it is more affordable, but the screens of the other two models — the
    Classic and the Limited Edition — are crystal. They are stronger and more expensive.
    Cindy wants to make a smart choice, so she is reading the buying guide carefully
    to understand the differences in price, size, and available band colors. She hopes
    the guide will help her pick the smartwatch to fit her needs and style.


