- id: doc_113_高雄_陽明_英語_g8s2e3_s2_50
  section: 2
  number: 50
  type: single
  page: 8
  stem: Why does the author say "You might take these things for granted"?
  options:
  - label: A
    content: Because people around the world have the same rights.
  - label: B
    content: Because these things are not important.
  - label: C
    content: Because many people enjoy these things without thinking they are special.
  - label: D
    content: Because people don’t like movies or trips.
  group_stem: 'Do you enjoy watching movies or watching ball games with your friends?
    Do you often go on a trip abroad? You might take these things for granted, but
    in Saudi Arabia, women couldn’t do all these things—not until lately.

    Usually when we think of women from Saudi Arabia, a group of women with clothes
    around their heads come to mind. They need to cover their faces. Also, in Saudi
    Arabia, people think women belong to their fathers or husbands and shouldn’t go
    to public places. They couldn’t drive a car. They couldn’t go to a movie theater
    or a soccer game, either. If they wanted to go on a trip abroad, they needed their
    fathers or husbands to apply for passports for them and be with them on their
    trip.

    These changed when King Abdullah of Saudi Arabia gave women the rights to vote
    and to be elected in 2015. After the king passed away, the prince Mohammad bin
    Salman continued the king’s reforms to make Saudi Arabia a modern country, and
    improving women’s rights is one of them. In December 2017, he re-opened the movie
    theaters in Saudi Arabia and gave women the right to watch movies in theaters.
    On January 12th 2018, a photo of Arab women cheering in a soccer game caught the
    world’s eye—they can go watch soccer games from that day on. In February 2018,
    the prince gave women the right to start their own business; in June 2018, the
    right to drive a car. In 2019, women in Saudi Arabia finally have the right to
    apply for passports and go on a trip abroad on their own.

    Women in Saudi Arabia still can’t do a lot of things, but with these reforms,
    they are slowly taking their rights back.


    abroad 到國外 belong to 屬於 apply 申請 passports 護照 vote 投票 be elected 被選舉

    reform 改革'
