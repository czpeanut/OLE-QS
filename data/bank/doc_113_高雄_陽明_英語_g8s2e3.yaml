  group_stem: 'Today is Amy’s birthday. Let’s meet at her house at 6:00 tonight. Shawn,
    Kelly, and Sam are coming. We will buy something to celebrate Amy’s birthday.
    Kelly will buy some spaghetti. Shawn will buy a big strawberry chocolate cake.
    You will love it very much. Sam will buy two pizzas. I will buy three boxes of
    cookies at Teddy’s. Can you buy some drinks on your way there? Don’t buy any juice.
    Amy’s mom will make some for us.


    I will go, but I will be late for half an hour. My parents are not home today.
    I need to buy dinner for my brothers first. I will also buy some cola and milk
    tea. See you then!'
