- id: doc_113_高雄_陽明_英語_g8s2e3_s2_43
  section: 2
  number: 43
  type: single
  page: 6
  stem: What is the main idea of the reading?
  options:
  - label: A
    content: Robots are dangerous and will soon control the world.
  - label: B
    content: Experts want to make robots smarter.
  - label: C
    content: Some people worry that robots might take over in the future.
  - label: D
    content: AI is not real and only appears in science fiction movies.
  group_stem: 'Reading: Will Robots Take Over the World?

    Robots are very helpful in our lives. They can do many jobs for people. For example,
    robots can sweep the floor, help build things in factories and even bring medicine
    to sick people in hospitals. In the future, we might see robots everywhere. People
    may depend on them to do many things.

    Right now, humans need to write programs to tell robots what to do. But with the
    rise of AI (artificial intelligence), things are changing. AI allows robots to
    learn by themselves. That means they don’t always need people to tell them what
    to do. Some people think this is amazing, but others are worried. They fear that
    robots will become too smart and start to think and act like humans.

    These people worry that one day, robots might stop following human orders. If
    robots become too powerful, they might take control away from people and rule
    the world. We called it a robot uprising. Many experts are still talking about
    whether this could really happen in the future.

    Some scientists, like Stephen Hawking, believe AI could become even smarter than
    humans. However, other experts think this will not happen very soon. They believe
    we still have time to make sure robots are safe.

    Today, many scientists and engineers are working to stop robot uprisings. They
    are adding rules and laws to robot programs. These rules help robots know how
    to treat humans kindly and safely. Experts say movies like The Terminator and
    I, Robot are just science fiction. But to stay safe, they are not taking any chances.
    They want robots to always stay under human control.


     program 程式 control 控制 uprising 起義

    whether 是否 science fiction 科幻小說;科幻電影'
