  group_stem: 'Blind boxes are very popular in China. People buy a box with a toy
    inside, ____27____they don’t know what they will get until they open it. This
    idea is fun and exciting, like a small game of chance.

    PopMart is a famous company that sells blind boxes. ____28____of its customers
    are young adults, and more than 75% are women. Each toy costs less than $2 to
    make, but they sell for about $8. Some people buy many boxes to collect all the
    toys, especially the rare ones. Some fans have ____29____1,000 dolls!

    PopMart started in 2010 in a small shop in Beijing. The company became ____30____when
    it focused on selling toys. One popular toy series is Molly, made by artist Kenny
    Wong. Now, PopMart has many stores, vending machines, and an online shop. In 2020,
    it made $127 million in just six months.

    PopMart also works with artists and big companies like Disney to design more toys.
    But some people think blind boxes are like gambling, and other countries are starting
    to make rules about this. To keep ____31____, PopMart wants to make its own characters
    more interesting and famous, like Disney. If it can do that, the company might
    stay popular for a long time.


     customers 顧客 adult 成人 rare 稀有的 focus on 專注於 series 系列 vending machines 自動販賣機

    gambling 賭博 character 角色；人物'
  uncertain_spans:
