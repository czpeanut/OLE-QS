  group_stem: 'Katherine Johnson was a great American mathematician.She worked at
    NASA for over 30 years. She used her math skills to help send astronauts to the
    moon. Her work was very important, but life at NASA was not easy for her.

    At that time, many people didn’t treat others fairly because of their race or
    gender. Katherine was a Black woman, so she had to face many challenges. For example,
    when she needed to use the bathroom, she had to walk a long way to a “colored”
    bathroom because people didn’t let her use the regular one. On the NASA campus,
    men could ride bikes. However, women had to wear skirts, so they couldn’t ride
    bikes. Even in the office, someone told her to use a separate coffee pot. Because
    no one else wanted to touch it.

    Although people treated her unfairly, Katherine never gave up. She worked hard.
    She showed her talent. She became a key person in America’s space program. Later,
    people made her story into a movie. The movie shows how smart and strong she was.
    Katherine’s life teaches us to stay strong. It teaches us to believe in ourselves
    and fight for what is right.


