  group_stem: "MOLLY’S SUMMER VACATION\n    I went to New Zealand this summer vacation\
    \ to study English. The most special thing for me in New Zealand is its weather.\n\
    \    I remember the day I left Taiwan. It was 37°C. I wore a T-shirt to take the\
    \ airplane. After arriving in New Zealand, I started shaking so hard. I almost\
    \ forgot it was winter in the southern hemisphere! There are two long islands\
    \ in New Zealand, so the weather can be very different around the country and\
    \ might change quickly every day. My friends in New Zealand liked to joke that\
    \ you can experience four seasons in one day!\n    During my stay, I lived in\
    \ Wellington, the capital city of New Zealand. The average temperature was below\
    \ 10°C. I always brought an umbrella with me because July was the main rainy season\
    \ there. You never know when you might get showers! The average temperature in\
    \ New Zealand goes down when you travel south. I visited Queenstown in the South\
    \ Island in August. It was even colder than Wellington. There was heavy snow and\
    \ the wind was bone-chilling. I missed the warm weather in Taiwan so much when\
    \ I found my phone frozen in the snow.\n\n\U0001F4D6 southern hemisphere 南半球 \
    \  capital city 首都   average 平均"
