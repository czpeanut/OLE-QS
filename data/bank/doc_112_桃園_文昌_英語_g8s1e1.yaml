  section: 7
  number: 42
  type: single
  page: 6
  stem: 'Patty made a chart below about the differences between American English and
    Canadian English after the chat with Joshua. What should she fill in the space?


    | | American English | Canadian English |

    | :--- | :--- | :--- |

    | Spelling | Color | Colour |

    | | Center | Centre |

    | Everyday Items | restroom | washroom |

    | | ? | People say “sorry” very often even when they don’t need to do that. |

    | Food | Fries with gravy | Poutine |

    | | Cookie | Biscuit |'
  options:
  - label: A
    content: People don’t say “sorry” even when they need to do that.
  - label: B
    content: People don’t say “sorry” but they do when they do something wrong.
  - label: C
    content: People say “sorry” even when it’s not necessary just like Canadians do.
  - label: D
    content: People say “sorry” but not so often like Canadians do.
  group_stem: 'Patty: Joshua, I heard that you came back from Canada this summer vacation.
    I know both Americans and Canadians speak English. However, there are some differences
    between American English and Canadian English in daily usages. Could you share
    them with me a little bit?

    Joshua: Sure! There are some interesting differences between the two. Let''s start
    with the spelling. People in Canada spell "colour" with a "u" and "centre." They
    don’t spell "color" and "center." Canadians often follow British English rules
    when it comes to spelling.

    Patty: Ah, I see. It''s not common in Taiwan but it’s interesting. And what about
    words for everyday things? Do you have any special Canadian terms?

    Joshua: Yes, for example, Canadians say "washroom" when Americans say "restroom"
    or "bathroom,” and they say “biscuits” when we say “cookies.” When we ordered
    a popular sandwich with fries and gravy, Canadians call it "poutine."

    Patty: Poutine! I know that. Americans just call it "fries with gravy," but "poutine"
    sounds fun.

    Joshua: It''s a delicious treat, for sure. Last, Canadians are known for their
    politeness, so you might hear they say "sorry" very often, even when it''s not
    necessary. I once saw a closed store and there was a sign outside by the door.
    It said, “I’m sorry. We don’t open.”

    Patty: Oh, it’s a lot of fun. I''ve heard about that Canadian politeness. Americans
    say "sorry" too, but not so often.

    Joshua: Well, Patty, I hope this chat helps you get more ideas about the differences
    between American and Canadian English.

    📖 however 然而；但是 difference 差別 common 常見的  gravy 肉汁   politeness 禮貌 necessary 必要的，應該的'
