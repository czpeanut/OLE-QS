  page: 5
  stem: 承上所述，為維護兒童及少年身心健康，我國《兒童及少年福利與權益保障法》規定「父母、監護人或其他實際照顧兒童及少年之人，應禁止兒童及少年超過合理時間持續使用電子類產品」。違反者將依同法規定「父母、監護人或其他實際照顧兒童及少年之人，處新臺幣一萬元以上五萬元以下罰鍰。」請問台灣政府應是為了達到《兒童權利公約》的何項內容：
    (L1)
  options:
  - label: A
    content: 禁止歧視
  - label: B
    content: 維護最佳利益
  - label: C
    content: 免於心理恐懼
  - label: D
    content: 尊重兒少意見
  group_stem: 世界衛生組織於2018 年6 月，將「網路遊戲成癮」正式列為官方認證的精神疾病以後，愈來愈多國家開始關心此議題，也試著利用法規，來化解這流行於未成年族群之間的3C
    文明病。「走在校園裡，每個學生都在滑手機，沒有人聊天，乒乓球桌也沒人使用。」荷蘭中學校長巴克2020 年發現此一現象後，率全國之先在學校禁用手機，如今全歐洲有越來越多學校也採取類似措施。當時校方曾被批評「好像活在西元1800
    年」，現在看來卻像是開路先鋒。未禁用手機前，校園裡的社交文化幾乎消失，大家都埋首在自己的螢幕上。但開始集中管理手機後，學校教職員目睹了校園文化的轉變，「曾經消失的又回來了。學生會在一起玩耍、談天，上課時的干擾也減少了」。
