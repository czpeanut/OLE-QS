  group_stem: 'Here is a report by Judy on “Holi,” an important festival in India.

    Holiday Name

    Holi

    Also known as “the festival of colors” or “the festival of love”

    Holi is an ancient holiday and has been around for over 1,000 years. It falls
    in spring. It’s popular and people celebrate it all over the world.

    Ways to Celebrate the Festival

    On the night before Holi, people have a bonfire, watch the fire, sing and dance,
    eat and talk with family or friends. On the day of Holi, they dance, color each
    other with the colored powders “gulal” or throw water balloons at one another.

    Why the Festival Is Important

    It’s a fun festival to celebrate the end of winter and welcome the spring season.
    This festival brings people hope for a new life and good harvest.

