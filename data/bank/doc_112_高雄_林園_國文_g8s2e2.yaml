- id: doc_112_高雄_林園_國文_g8s2e2_s4_1
  section: 4
  number: 1
  type: single
  page: 1
  stem: 下列「 」中的成語，何者運用最為恰當？
  options:
  - label: A
    content: 讀書時要與「買櫝還珠」相同，不可只看表面，還必須要融會貫通
  - label: B
    content: 烏養教練的一番話有如「鑼鼓喧天」，讓因為比賽而失落的隊員們徹底醒悟
  - label: C
    content: 學習任何事物意志都要堅定，若是抱著「海枯石爛」的態度，到頭來必定一事無成
  - label: D
    content: 在失業與親人接連去世的多重噩耗影響下，萊納從此「一蹶不振」，更險些誤入歧途。
  answer:
  - D
