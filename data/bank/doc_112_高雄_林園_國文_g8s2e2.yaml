  - label: B
    content: 「在康河的柔波裡／我甘心做一條水草」是作者對康河眷戀情深的表現
  - label: C
    content: 第一節連用三次「輕輕的」，表達出作者對離別的依依不捨
  - label: D
    content: 「金柳」、「青荇」、「笙蕭」等詞彙的運用，使詩歌具有古典的韻味。
  group_stem: '輕輕的我走了／正如我輕輕的來／我輕輕的招手／作別西天的雲彩。

    那河畔的金柳／是夕陽中的新娘／波光裡的艷影／在我的心頭蕩漾。

    軟泥上的青荇／油油的在水底招搖／在康河的柔波裡／我甘心做一條水草！

    那榆蔭下的一潭／不是清泉 是天上虹／揉碎在浮藻間／沉澱著彩虹似的夢。

    尋夢？撐一支長篙／向青草更青處漫溯／滿載一船星輝／在星輝斑爛裡放歌。

    但我不能放歌／悄悄是別離的笙簫／夏蟲也為我沉默／沉默是今晚的康橋！

    悄悄的我走了／正如我悄悄的來／我揮一揮衣袖／不帶走一片雲彩。

    徐志摩〈再別康橋〉'
