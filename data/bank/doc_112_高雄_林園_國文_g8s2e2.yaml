    content: 由於擁有翡翠水庫，且使用水的成本較低，所以台北地區的居民們較浪費水。
  group_stem: "【甲】\n  聖稜線是淡水河、大安溪、大甲溪的共同發源地。\n  事實上，整個淡水河流域的水源，除了基隆河北岸的幾道小支流外，幾乎都涵蓋在雪山山脈裡，發源於大霸尖山北壁的是薩克亞金溪，由聖稜線中點品田山北壁流下去的是塔克金溪，它們共同分享淡水河最大支流大漢溪源流的光彩。\n\
    \  淡水河三大支流的另外兩個水系，新店溪與基隆河，也是把彎彎曲曲的河道，伸向雪山山脈的每一個角落，就像一張布滿格子的稿紙，橫橫豎豎都有大小溪流通過，地理學家給了一個專有名詞叫「格子狀水系」。它們的名稱也許像薩克亞金溪、馬里闊丸溪，有如外國地名一樣遙遠而拗口，也許像金瓜寮溪、阿玉溪這樣充滿鄉土味，更多的是完全沒有名字的小溪。它們有的清澈甘美，有的流經市鎮而顯得汙濁不堪，然而淡水河不辭水量大小，無論水質清濁，全部兼容並蓄，構成面積廣達二千七百多平方公里的流域。而在這流域內居住的人們，生命中最不可或缺的水，完全都仰仗淡水河。\n\
    \  能想像沒有淡水河的日子嗎？大約有500 萬人口須靠積存雨水而活，就像金門、馬祖、澎湖部分無河的小島一樣。一旦暴雨來襲，臺北盆地就像裝滿水的臉盆一樣，一切都淹沒在水面下。淡水河的廣大水域，其實是一個超大的天然水庫加水源供應網和天然排水道，如果不是它的支流日夜不斷地提供新的水資源，石門水庫和翡翠水庫能免於乾涸嗎？\n\
    ――改寫自徐如林〈源自聖稜線〉\n【乙】\n  經濟部 水利署統計，民國111 年台灣每人每日生活用水量平均為288 公升，各縣市中以台北市居冠，用水量高達333\
    \ 公升；其次為新竹市，用量為305 公升，排名第3 的是新北市，用量為296 公升。\n  台灣自來水公司更進一步分析，台北市、新北市因商業發達，人口密度高以及夜生活頻繁，再加上白天外縣市人口移入工作，因此用水量高；而新竹市則是因為科技新貴有夜生活，也會在半夜加班，所以用水量也多。此外，台北市還擁有翡翠水庫，用水、取水的成本較其他縣市低，再加上長期以來不缺水，無形中也讓居民習慣不需要省水的生活。\n\
    \  但值得注意的是，台灣年平均降雨量雖高達2500 公釐，是全球平均值的2.6 倍，但因雨勢集中在特定季節，加上地形陡峭及河川短促，70%的水都無法留住，實際用水量可能只有年降雨量的26%，所以台灣早已被聯合國列入全球排名18\
    \ 有缺水危機的國家。\n  因此水利署呼籲民眾必須居安思危，建立節水的習慣，不可因為沒有立即性的缺水危機便大肆浪費，常保「夠用就好」的用水模式。此外，綠建築、智慧建築及回收雨水系統等也將逐漸納入建築法規裡，以因應地球的極端氣候變化。\n\
    （資料引用自經濟部 水利署）"
  answer:
  - A
