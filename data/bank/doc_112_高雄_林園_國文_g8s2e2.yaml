- id: doc_112_高雄_林園_國文_g8s2e2_s4_5
  section: 4
  number: 5
  type: single
  page: 1
  stem: 「這時春光已爛縵在人間，更不須殷勤問訊」，徐志摩因細心觀察周遭的景物，所以可從某些微小細節知道春天已來臨。請問下列詩句中，何者也包含著春天的訊息？
  options:
  - label: A
    content: 綠蟻新醅酒，紅泥小火爐。晚來天欲雪，能飲一杯無
  - label: B
    content: 竹喧歸浣女，蓮動下漁舟。隨意春芳歇，王孫自可留
  - label: C
    content: 清明時節雨紛紛，路上行人欲斷魂。借問酒家何處有，牧童遙指杏花村
  - label: D
    content: 月落烏啼霜滿天，江楓漁火對愁眠。姑蘇城外寒山寺，夜半鐘聲到客船。
  lesson_raw:
    title: 我所知道的康橋
    basis: 引自〈我所知道的康橋〉作者徐志摩與課文文句
  answer:
  - C
