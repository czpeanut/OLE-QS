- id: doc_112_高雄_林園_國文_g8s2e2_s5_6
  section: 5
  number: 6
  type: single
  page: 5
  stem: 根據上文，下列敘述何者最恰當？
  options:
  - label: A
    content: 以〈陋室銘〉為例，透露自己的境遇和劉禹錫相同，並展現出惺惺相惜之情
  - label: B
    content: 作者認為人只要放下一切的虛榮欲望，甘願過苦行僧般的日子，這即是所謂的「簡樸的生活」
  - label: C
    content: 文中藉由別墅與名車來比喻人所擁有的虛榮心，說明充實精神上的生活遠比滿足物質生活重要
  - label: D
    content: 採用列點論述的手法，從多方面闡述對於「簡樸的生活」的定義，更引用〈陋室銘〉之文句加強論點。
  group_stem: '何謂「簡樸的生活」？簡樸，就是簡單樸實。生活，是人所選擇的如何活下去的方式。因為每一個人都有選擇的權利，所以人可以選擇過任何形式的生活，忙碌的、緊張的、悠閒的、充實的，各式各樣不同類型的生活。然而，簡樸的生活或許聽起來有些單調，但是，簡樸的生活卻是許多人嚮往的理想目標。


    〈陋室銘〉是一篇各位耳熟能詳的文章。他描述著作者劉禹錫悠閒樸實的生活。這一間有些簡陋的小房子，沒有豪華的傢具，只有外頭大自然美貌的青春與書中詩情畫意的文章相共鳴。作者自述：「可以調素琴，閱金經。無絲竹之亂耳，無案牘之勞形。」這種絲毫無心事煩身的生活，既樸實又簡單，不正是我們所嚮往的烏托邦嗎？文末劉禹錫還引述了至聖先師孔子的一句話：「何陋之有？」原來只要過著充實簡樸的生活，就算不擁有豪華別墅、進口名車，也一點都不窮酸簡陋。


    如果我們摸著良心自問：「我們真的需要別墅與名車來充實自己的生活嗎？」我相信我們真正需要的只是充實簡樸的生活。「簡樸」，聽起來似乎十分困難，尤其在這已被重重虛榮心污染的世界。然而，並沒有想像中那般困難。只要我們自問真心，把所有虛榮欲望放下，全心全意的充實本身精神上的生活，即使過著身外樸實的生活，一樣能達到目標。

    ――李佳衡〈簡樸的生活〉'
  answer:
  - C
  answer_source: answer_key_vlm
