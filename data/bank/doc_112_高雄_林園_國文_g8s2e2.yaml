- id: doc_112_高雄_林園_國文_g8s2e2_s4_4
  section: 4
  number: 4
  type: single
  page: 1
  stem: 〈我所知道的康橋〉中「遠近的炊煙，成絲的、成縷的、……，彷彿朝來人們的祈禱，參差地翳入了天聽」以「聽覺」印象來表現「視覺」感受。下列各選項都運用了感官交錯的手法，何者的解釋最為正確？
  options:
  - label: A
    content: 「聽了王小玉唱完這首歌，五臟六腑裡像熨斗熨過，無一處不伏貼。」以聽覺印象來表現觸覺感受
  - label: B
    content: 「呼嘯的摩托車聲劃過寧靜的黑夜，尖銳地在我耳膜上劃出一道傷口。」以聽覺印象來表現觸覺感受
  - label: C
    content: 「塘中的月色並不均勻，但光與影有著和諧的旋律，如梵婀玲上奏著的名曲。」以聽覺印象來表現視覺感受
  - label: D
    content: 「我低下頭去喊自己的名字，井水也大聲應和，連那回聲都彷彿有淡淡的餘香。」以味覺印象來表現聽覺感受。
  lesson_raw:
    title: 我所知道的康橋
    basis: 題幹提及課名〈我所知道的康橋〉
  answer:
  - C
  answer_source: answer_key_vlm
