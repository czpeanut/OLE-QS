  stem: 「終於雷聲愈來愈遠，電光只在遙遙的天邊橫掃。太陽又出來了，一片清新的空氣、鮮潔的色彩，彷彿聽見了貝多芬《田園交響曲》第四樂章〈牧羊人之歌〉。」這段文字用聽覺印象表達視覺效果，與下列何者相同？
  options:
  - label: A
    content: 昨夜的月色，至少有一瓣是甜的
  - label: B
    content: 微風過處，送來縷縷清香，彷彿遠處高樓上渺茫的歌聲似的
  - label: C
    content: 遠近的炊煙，彷彿是朝來人們的祈禱，參差的翳入了天聽
  - label: D
    content: 馬蹄聲灑落在街上，化成白色小花。
  lesson_raw:
