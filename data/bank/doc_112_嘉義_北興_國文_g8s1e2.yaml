- id: doc_112_嘉義_北興_國文_g8s1e2_s4_15
  section: 4
  number: 15
  type: single
  page: 1
  stem: 〈我在圖書館的一天〉一文大量描寫北投圖書館的建築設計和空間場景，下列文句中，何者可以看出圖書館的綠建築特色？
  options:
  - label: A
    content: 戶外的大榕樹巨大如屋，遠近有大小湯屋林立，熱氣煙嵐裊裊。
  - label: B
    content: 這圖書館屋頂有玄機，植有草坡，草坡涵養水分會自然排水至雨水回收槽，回收水可灌溉園區植栽
  - label: C
    content: 我總是在椅子與椅子間轉換我的靈魂，以攝取不同的知識
  - label: D
    content: 窗子都是推出去的，在層次前後的動線下，推開的窗戶有如波浪般延展而去。
  lesson_raw:
    title: 我在圖書館的一天
    basis: 題目明確提到課名〈我在圖書館的一天〉
