    言：「我亦鬼也。」鬼問：「欲至何所？」答曰：「欲至宛市。」鬼言:「我亦欲至宛市。」 \n    共行數里，鬼言：「步行太極，可共迭相擔也？」定伯曰：「大善。」鬼便先擔定伯數里。鬼言：「卿\n\
