  group_stem: "Have you heard about AIDS, 23 is one of the world’s worst health problems?\
    \ When AIDS was first reported in the USA in 1981, 24 was known about it. There\
    \ was not even a name for it. No one knew how people got it or how they could\
    \ fight it. People just kept dying of it. The world was so scared of AIDS that\
    \ wrong ideas about AIDS were passed around. Some believed they would catch AIDS\
    \ by just being around people with it. Some even believed AIDS would bring the\
    \ end of the world.\n However, what they were worried about did not come true.\
    \ In 1995, David Ho, a Taiwanese American, found a way to help fight AIDS. Since\
    \ then, the number of people 25 has dropped greatly because there are stronger\
    \ medicines to help them live longer. Today, there is still no easy answer to\
    \ AIDS, but at least we know more about it. Now we can fight it with experience,\
    \ not with fear.\nAIDS 愛滋病"
