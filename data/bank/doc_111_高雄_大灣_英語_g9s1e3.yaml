- id: doc_111_高雄_大灣_英語_g9s1e3_s4_38
  section: 4
  number: 38
  type: single
  page: 4
  stem: Where were steam powered trains first invented?
  options:
  - label: A
    content: Japan.
  - label: B
    content: The USA.
  - label: C
    content: The UK.
  - label: D
    content: Taiwan.
  group_stem: 'The first train that was powered by steam was invented in 1840 in the
    United Kingdom. The British built the first railway line between the cities of
    Manchester and Liverpool. People got to know that the train had great power to
    carry goods and people. Railway networks quickly came out all around England and
    Europe. Railroads and trains were quickly built around the world. In 1869, the
    Pacific railroad was the first rail network that connected the East Coast with
    the West Coast of North America.

    Trains came out in Taiwan in 1881 by the Qing Dynasty. But the Japanese built
    Taiwan''s first large rail network from 1895 to 1945. It was this rail network
    that helped Taiwan to become more modern. Goods and people could be moved easily
    around the island. These days, trains are still important in Taiwan. They are
    clean, always appeared to be on time, and the tickets are not expensive. There
    are several types of trains, and people can take them to anywhere they want to
    go.

    If you stay in the cities of Taipei or Kaohsiung, you may ride on the metro to
    get around. Thousands of people take the metro every day to go to work, go to
    school, or go shopping. If you want to go to different cities, you may want to
    take the trains of the Taiwan Railway Administration (TRA). They go to most cities
    of Taiwan, and you can take trains around the island on TRA trains. The TRA trains
    are powered by either electricity or gas. If you are in a hurry, the High Speed
    Rail (HSR) network goes to Taiwan''s major cities on the West Coast. These modern
    trains carry people up to 290 km per hour, and can get you from Taipei to Kaohsiung
    (345 km) in under two hours.

    power 運轉 steam 蒸氣 invent 發明 British 英國人 goods 商品 railway 鐵道 Qing Dynasty 清朝 electricity
    電 major 主要的'
