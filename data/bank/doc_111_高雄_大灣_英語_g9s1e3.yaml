  stem: What is NOT mentioned about animals' eyes in the reading?
  options:
  - label: A
    content: The eye movements of animals.
  - label: B
    content: Animals with good night vision.
  - label: C
    content: Animals that are color-blind.
  - label: D
    content: The visual angles of animals.
  group_stem: "How Do Animals See the World?\n Do animals see things like we do? Some\
    \ animals are born with the most amazing eyes on the planet. For example, cats\
    \ and horses have eyes that allow them to see the world very differently.\n Cats\
    \ can see things clearly with little light. They are also much better than people\
    \ at seeing fast movement. That's why they can hunt fast-moving mice at night\
    \ as easily as in the day. But cats are also red-green color-blind. They can only\
    \ see blue, yellow, and gray. Some studies show that red and green appear yellow\
    \ to them.\nHorses can see almost everything around them. This is because their\
    \ big round eyes are on the sides of their head. They have a visual angle of 350\
    \ degrees. When horses walk to the north, they can see everything to the east,\
    \ west, and even south. Horses can even see the person riding on them. However,\
    \ they cannot see things right in front of their noses and behind their tails.\n\
    The vision of every animal is special, and some can even see what people can't.\
    \ With the help of science, we can better understand how different animals see\
    \ the world.\namazing 驚人的 movement 移動 visual 視覺的 degree 度 north 北 east 東 west\
    \ 西 south 南 vision 視野"
- id: doc_111_高雄_大灣_英語_g9s1e3_s4_36
  section: 4
  number: 36
  type: single
  page: 4
  stem: Which is true about the reading?
  options:
  - label: A
    content: The son kept wasting his life after his father died.
  - label: B
    content: The old farmer actually hid seeds in the ground, not jewels.
  - label: C
    content: In fact, the old farmer remembered where he hid the treasure, but he
      wanted his son to find it himself.
  - label: D
    content: When someone "meets their maker", they die.
  group_stem: 'Treasure in the Ground

    Once upon a time, on a farm lived an old farmer and his son. The old farmer felt
    that he didn''t have much time to live, and he worried that his son would keep
    wasting his life after he died. So, he called his son to his room one day.

    "I hid some treasure on the farm for you many years ago, so you''ll be fine when
    I meet my maker," the old farmer said to his son on his bed, "I can''t remember
    where I hid it, but it must be somewhere in the ground." Then, the old farmer
    fell asleep and never woke up. His son started to dig on the farm right away.
    For several weeks, he dug day and night. However, he found nothing.

    Soon, summer came. Because the ground was well-loosened by the son, the crops
    grew far better than the neighbors''. When the son saw the crops, he suddenly
    understood what the treasure was. It was not money or something expensive, but
    the nice reward that came from his hard work.

    treasure 寶藏 waste 浪費 well-loosened 妥善鬆動的 crop 作物 reward 報償'
