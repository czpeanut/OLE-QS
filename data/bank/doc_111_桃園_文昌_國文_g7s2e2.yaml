  stem: 在分析全文寫作手法（How?）時，她不小心弄錯了一處，請幫她找出她寫錯的地方是？
  options:
  - label: A
    content: 做硯的過程：曝晒（找出裂痕）→切磨（呈現色彩紋理）→雕刻（先修底再修硯面）
