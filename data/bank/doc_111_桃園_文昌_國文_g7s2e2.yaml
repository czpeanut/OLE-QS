- id: doc_111_桃園_文昌_國文_g7s2e2_s3_28
  section: 3
  number: 28
  type: single
  page: 5
  stem: 她擬出這篇文章的核心概念（Why?的部分）應該是？
  options:
  - label: A
    content: 基礎紮根
  - label: B
    content: 力行實踐
  - label: C
    content: 追求完美
  - label: D
    content: 日新又新
  group_stem: "（二）\n  今年寒假回台灣時，我去二水拜訪了雕硯臺的師傅，雖沒買下多少硯臺，卻有了不少感悟。\n    雕硯師傅家的門口，堆了許多硯臺，都是他從溪流裡，涉水挑選回來的，那些石塊，表面看是灰色的，很難讓人相信，居然能夠刻出紫紅、暗綠和深黑色的硯臺。師傅說，石頭運回來，一定要先曝晒，因為許多石頭在溪流裡雖然漂亮，卻有難以察覺的裂縫，只有不斷地日晒雨淋之後，才能顯現，甚至自己就會崩裂。\n\
    \    師傅又說，未經琢磨的石頭，因為表面粗糙，不容易看出色彩和紋理，淋上水之後，比較會顯現，但是水一乾，又不見了。只有切磨打光之後，才能完全而持久地呈現。他還說，其實這世上的每一塊石頭都很美，即使不適合做硯臺，也各有特色，耐人賞玩。\n\
    \    我特別要求他，讓我自己試著刻一方硯。師傅掏出一把平頭的鑿刀，又遞給我一支槌子。我問如果這刀鋒鈍了怎麼辦，他說就用硯石來磨，因為好的硯石，質細而堅，也是最好的磨刀石。\n\
    \    我小心地由磨墨的硯面雕起。師傅趕緊糾正：不管什麼硯臺，都得先修底。底不平，上面不著力，根本沒有辦法雕得好。\n    回程的路上我一直想，硯臺何嘗不像人，無論表面怎麼拙陋，經過琢磨，都會顯現美麗的紋理。當然一方好硯，必須用石質細膩，觸感好像肌膚，又堅實而耐磨的石頭製作。那石塊且須經過嚴格的考驗，如同文質彬彬，外表敦和而中心耿介的君子，經過心志與肌膚的勞苦之後，才能承擔大任。\n\
    \    我也想：從工作中鍛鍊，正如同在雕硯時磨礪。好的工作，就像好的硯石，不但成就了工作，也精益的工作者。\n    當然，最重要的，是雕硯先修底。多麼細緻的花紋與藻飾，都要由那基礎的地方開始。雖然修底的工作是最枯燥的!\n\
    《劉墉‧做硯與做人》\n\n文文嘗試以黃金圈理論來分析這一篇文章:"
  shared_asset: g3_28_30
