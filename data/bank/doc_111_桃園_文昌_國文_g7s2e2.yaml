  group_stem: '（ㄧ）

    景公出獵，上山見虎，下澤見蛇。歸，召晏子而問之曰：「今日寡人出獵，上山則見虎，下澤則見蛇，殆所謂不祥也？」晏子對曰：「國有三不祥，是不與焉。夫有賢而不知，一不祥；知而不用，二不祥；用而不任，三不祥也。所謂不祥，乃若此者。今上山見虎，虎之室也；下澤見蛇，蛇之穴也。如虎之室，如蛇之穴，而見之，曷為不祥也！」

