- id: doc_111_桃園_文昌_國文_g7s2e2_s3_31
  section: 3
  number: 31
  type: single
  page: 6
  stem: 關於食蛇龜的敘述，下列何者說明正確？
  options:
  - label: A
    content: 喜歡吃蛇，因而以此特性命名
  - label: B
    content: 因甲殼色深且前後閉合似箱，故稱箱龜
  - label: C
    content: 是亞洲唯一陸棲龜，生活在淺山環境
  - label: D
    content: 牠的繁殖期短且甲殼能當中藥材。
  group_stem: "（三）\n 食蛇龜的別名是「黃緣閉殼龜」、「黃緣箱龜」、「山龜」，牠是野生動物保育法的珍貴稀有野生動物，也是瀕臨絕種野生動植物。食蛇龜的背甲顏色為深褐色，中央有條黃色稜脊；頭部顏色呈橄欖色，眼睛後方具黃色縱帶，臉頰為黃色；鷹鉤嘴；腹甲黑色，中間有條橫向韌帶，可使腹甲的前後兩半分別向上移動，與前後的背甲閉合，使外觀有如密閉的箱子，因此這類烏龜又被稱為「閉殼龜」、「箱龜」。\n\
    \  食蛇龜是臺灣唯一原生「全陸棲」的龜，生活在海拔 1000 公尺以下的淺山森林、丘陵、平原環境，與人類活動的環境重疊，是臺灣唯一的陸棲龜類。分布於中國大陸南部、臺灣、日本\
    \ 琉球群島等地區。\n  食蛇龜動、植物都吃，包含森林中掉落的果實、花、葉子，到牠嘴巴塞得下的各類動物，例如蝸牛、蚯蚓、蛞蝓，但牠就是不吃蛇。那麼為什麼要叫「食蛇」龜呢？事實上，牠們很喜歡吃蚯蚓，食蛇龜吃蚯蚓的畫面，看起來就好像在吃蛇呢！\n\
    \  食蛇龜因為人類的濫捕，數量急遽下降，牠的龜殼被視為藥材，食蛇龜行動慢很容易捕抓，加上生得少及繁殖期長，因此消失的速度很快，臺灣曾經查獲了近萬隻走私龜即將偷渡，是不是表示保住這近萬隻生命了？不見得。因為不知道盜獵者究竟從哪些地方抓來食蛇龜，無法將食蛇龜送回原棲地，不能貿然野放，否則可能造成遺傳結構改變或傳染病散播等問題。\n\
    \  除了提升大家的保育觀念以外，民眾也可以發揮力量，發現不法販賣或陷阱，立即通報相關單位，在野外如果發現原生淡水龜，不可將地點透露，更不可帶回家飼養。\n\
    \  食蛇龜的瀕臨絕種令人痛心，期待保育議題能受到重視，讓食蛇龜能安心生活。\n（改寫自網路文章《國道、石虎、平安龜保育與創作特展》）"
