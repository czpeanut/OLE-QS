- id: doc_113_台中_居仁_自然_g7s2e1_s4_4
  section: 4
  number: 4
  type: single
  page: 6
  stem: 根據文章與所學知識推斷：“惡魔植物”馬鈴薯為何會在愛爾蘭的馬鈴薯疫病中遭受如此大規模的損失？
  options:
  - label: A
    content: 馬鈴薯以塊莖繁殖，個體基因相同，缺乏抗病能力
  - label: B
    content: 愛爾蘭的氣候突然變得極端乾燥，導致病害加劇
  - label: C
    content: 馬鈴薯的葉片和果實含有毒素，加劇個體死亡
  - label: D
    content: 因為馬鈴薯發芽後更容易被真菌感染。
  group_stem: "(二)\n馬鈴薯在歐洲歷史中擁有複雜的形象。最早，馬鈴薯被視為“惡魔植物”，其原產地位於南美洲的安第斯山脈，西班牙征服印加帝國後將其引入歐洲。由於馬鈴薯的葉片和果實含有毒素，早期歐洲人對其持懷疑態度，甚至認為它是一種有害植物。\n\
    進入18 世紀後，法國國王路易十六及瑪麗安托瓦內特王后積極推動民眾種植馬鈴薯，因其耐寒且能提供穩定的食物來源。隨著這一農作物在歐洲的廣泛種植，馬鈴薯逐漸成為愛爾蘭等地的重要糧食作物，並在當地農業和經濟中佔據了重要地位。到了19\
    \ 世紀，愛爾蘭的農民幾乎依賴馬鈴薯作為主食。然而，這種對單一作物的依賴暴露了它在面對病害時的弱點。1845 年，愛爾蘭爆發了由真菌引起的馬鈴薯疫病。由於當時愛爾蘭的馬鈴薯品種極為單一，缺乏基因多樣性，所有作物對該病害毫無抵抗力，病菌迅速蔓延，造成大規模歉收。這場災難引發了愛爾蘭大饑荒，導致數百萬人死亡或移民美國，並深刻改變了愛爾蘭的社會結構與經濟。這一事件凸顯了基因多樣性對作物抗病能力的重要性，並促使現代農業更重視作物的遺傳多樣性，以提高作物的抗病能力，防止類似災難再次發生。\n\
    \                               https://www.agriharvest.tw/archives/8670?utm_source=chatgpt.com<改編自農傳媒\
    \ 古歐洲人的「惡魔植物」>"
