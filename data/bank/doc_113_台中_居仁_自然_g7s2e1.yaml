- id: doc_113_台中_居仁_自然_g7s2e1_s4_1
  section: 4
  number: 1
  type: single
  page: 6
  stem: 根據文章，為什麼線蟲雖然是孤雌生殖，卻仍需要雄性的精子？
  options:
  - label: A
    content: 因為精子提供必要的細胞結構，幫助卵子分裂
  - label: B
    content: 因為精子能改變卵子的DNA
  - label: C
    content: 因為無精子的DNA，則卵子無法發育成胚胎
  - label: D
    content: 因為精子是繁衍後代的唯一途徑。
  group_stem: "(一)\n線蟲（Mesorhabditis belari）是一種生活在土壤中的小生物，牠的生殖方式非常特殊。通常，動物需要雄性和雌性來繁衍後代，但線蟲的生殖結合了有性和無性生殖。牠的生殖方式屬於孤雌生殖，但又不完全符合孤雌生殖的定義。孤雌生殖通常不需要雄性，母體就能生下後代，如大理石紋螯蝦等動物；然而某些孤雌生殖的動物需要精子來刺激卵子發育。線蟲的雌性需要雄性的精子來激活卵子，但雄性的精子不會將自己的DNA\
    \ 傳給後代，精子只是提供結構幫助卵子分裂，此種孤雌生殖的方式稱作「假受精」或是「雌核發育」。\n線蟲的雌性可以產下兩種類型的後代：一種是雌核發育，這些後代完全複製母體基因，沒有雄性DNA，算是無性生殖；另一種是兩性融合，這些後代從母親和父親各獲得一半的基因，屬於有性生殖。線蟲的性別遺傳與人類相同，由精子中的X\
    \ 和Y 染色體決定。大部分兩性融合的後代是甲     ，因為Y 染色體的精子穿透卵子的機率較高，而無性生殖的後代則是乙     。這種特殊的生殖方式有助於線蟲在不同環境中存活與繁衍。\n\
    \      https://pansci.asia/archives/157388?utm_source=chatgpt.com <改編自泛科學 線蟲的演化賽局：既然是孤雌生殖，為何還需要精子？>"
  tags:
