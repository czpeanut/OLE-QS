  section: 1
  number: 12
  type: single
  page: 2
  stem: 中國歷史上，自周朝以來有許多朝代採取嫡長子繼承制度，家業和財產由元配所生的長子繼承，其餘的子女大多分家或到外地靠自己打拼，連皇室也也不例外。請問，下列何者產生方式和嫡長子的社會地位產生方式相同？
  options:
  - label: A
    content: 芸筠在半工半讀，努力三年後，終於獲得碩士學位
  - label: B
    content: 鎮裕透過知名主持人父親的引進，順利得到一個外景節目主持人的工作
  - label: C
    content: 何軍和妻子一起經營餐廳，經過十年的努力，獲得米其林餐廳的殊榮
  - label: D
    content: 萬金在公司裡，逢人就噓寒問暖，工作認真，終獲得老闆青睞，升職為總經理。
