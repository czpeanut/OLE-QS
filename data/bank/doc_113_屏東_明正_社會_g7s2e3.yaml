  section: 1
  number: 9
  type: single
  page: 1
  stem: 我國《憲法》將社會安全列為基本國策之一，並明列社會福利的相關條文，關於「社會安全」的概念，下列何者敘述正確？
  options:
  - label: A
    content: 就是要讓每個人能過著有尊嚴的生活
  - label: B
    content: 人生而平等、機會均等，不因人而有差別待遇
  - label: C
    content: 國家保障基本的生存權利，其他的權利政府無法提供
  - label: D
    content: 社會安全就是藉由「社會互動、單獨承擔風險」的精神，進而實現社會差別待遇。
