- id: doc_113_屏東_明正_社會_g7s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 根據《TVBS 新聞網》報導提到，我國主計總處2024 年公布的《家庭財富調查報告》數字指出，最富有的20％家庭平均財富達到5133 萬元，而最窮的20％家庭平均財富只有77
    萬，兩者差距高達67 倍。課堂上老師請同學對此新聞下註解，下列何人的說法與新聞報導內容最為相關？
  options:
  - label: A
    content: 美晴：我國社會目前存在著嚴重的貧富差距問題
  - label: B
    content: 美莉：透過社會福利可以改變社會地位
  - label: C
    content: 美伶：家庭的所得收入，會影響下一代的社會流動
  - label: D
    content: 美華：政府透過公權力協助個人改善社會不公平現象。
