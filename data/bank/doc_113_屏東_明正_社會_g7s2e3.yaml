- id: doc_113_屏東_明正_社會_g7s2e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 新聞報導：前幾年受到新冠病毒疫情衝擊，許多公司無法正常生產，為減少損失採放無薪假方式因應。勞動部順勢推出「充電再出發計畫」， 鼓勵減班休息企業可以辦理訓練，讓勞工在放無薪假期間可以學習其他技能，並領取訓練津貼減輕經濟負擔。然而，卻有不肖公司用不實照片假裝辦理訓練騙取補助金，勞動部已查獲至少三家公司有這樣的情況。從這則新聞報導，顯示我國社會福利政策可能面臨何種困境？
  options:
  - label: A
    content: 有些人會濫用社會福利資源，可能造成公共資源的浪費
  - label: B
    content: 社會福利經費充足，公司行號可以優先申請福利經費
  - label: C
    content: 申請補助的條件嚴苛，導致社會福利看的到卻吃不到
  - label: D
    content: 政府經費短缺，但民間團體可以接手補足政府不足之處。
  tags:
    chapter:
