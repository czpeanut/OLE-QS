  stem: 作家陳之華在《芬蘭教育：競爭力從何而來？》一書中曾提到：「……我所說的『一樣』，是不論在芬蘭的任何地區，學生都一樣有熱騰騰的營養午餐可吃、有一樣高水準的教科書可讀、有一樣基本素質優良的教師、有相同的教學理念被完整執行，以及充足的課外讀物鼓舞著學生的心靈。」根據這段話，芬蘭的教育理念是希望在社會中傳遞何種核心價值？
