    content: 許多人將社會福利視為免費，可能造成公共資源的浪費
  - label: B
    content: 高齡化情形，增加政府預算支出，迫使政府放棄提供老人照護資源
  - label: C
    content: 少子化兒童人口變少，福利措施並無設置太多的必要
  - label: D
    content: 國內民眾平均所得增加，相關福利措施可減少支出。
