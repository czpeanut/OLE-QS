- id: doc_113_屏東_明正_社會_g7s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 早期社會福利制度並不完善，在臺灣曾有個家庭，母親獨力扶養3 個孩子，但這3 個孩子都罹患了肌肉萎縮症，其中排行老二的兒子21 歲時發病全身癱瘓，沒多久老大跟老三也接連發病，母親沒放棄他們，就算每個月的醫療費高達十多萬元，也苦撐下來。只是兒子看到母親這麼累，一度想輕生，對母親說：「請妳給我一個塑膠袋，讓一切都結束吧。」這讓母親聽了不禁鼻酸。請問：現在政府的哪項社會福利政策可以大幅度減輕這三兄弟家庭的負擔？
  options:
  - label: A
    content: 補助低收入戶
  - label: B
    content: 發放敬老津貼
  - label: C
    content: 協助職業訓練
  - label: D
    content: 實施全民健康保險。
  tags:
