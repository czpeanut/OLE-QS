- id: doc_113_屏東_明正_社會_g7s2e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 親子天下雜誌報導：「疫情停課期間，弱勢兒少的數位學習落差持續擴大，造成數位中輟現象」。兒童福利聯盟調查指出，弱勢家庭家長為了生計或不熟悉數位設備使用方式，常無暇也無力關照孩子線上學習的狀況。而不同學科要用的教學軟體不盡相同，各式介面切換需花時間熟悉，身邊沒有大人即時協助。加劇弱勢孩子數位資源的落差。兒福盟呼籲應積極探討停課後弱勢孩子的數位學習困境，呼籲政府相關單位及民間團體需要協力幫助孩子。根據這篇報導，下列敘述何者較正確？
  options:
  - label: A
    content: 數位落差更加凸顯資源分配不公造成的困境
  - label: B
    content: 基於機會均等原則，應提供每一位學童數位設備
  - label: C
    content: 後天的社會地位，導致弱勢家庭面臨歧視
  - label: D
    content: 數位學習方式，對於弱勢學生社會流動並無顯著幫助。
