- id: doc_113_屏東_明正_社會_g7s2e3_s1_19
  section: 1
  number: 19
  type: single
  page: 3
  stem: 文中提及的「某種不公平」，是哪一種面不公平現象？
  options:
  - label: A
    content: 貧富差距
  - label: B
    content: 性別議題
  - label: C
    content: 族群議題
  - label: D
    content: 城鄉差距。
  group_stem: '【題組】

    內政部在 113 年 10 月公布房價所得比（又稱購屋痛苦指數）上升至 10.65 倍寫下新高，也就是民眾要不吃不喝超過 10 年才能買房，台北市甚至要不吃不喝超過
    17 年才買得起房。為了因應高房價帶來的「某種不公平」。屏東縣在房價負擔能力方面，雖不如六都的負擔大，但調查統計也屬於偏低等級。

    2024 年屏東縣長宣布，屏東的社會住宅將再增兩處共 348 戶，新增兩處均位在屏東市區，為「永城好室」、「鶴聲好室」。屏東縣社會住宅將從原本 3 處增為
    5 處。

    屏東社會住宅的申請資格主要有幾點：

    | 1 | 年滿 18 歲以上中華民國國民 |

    |---|---|

    | 2 | 於屏東縣設有戶籍，或未設籍但於屏東就學、就業且有居住需求 |

    | 3 | 申請人及戶籍內直系親屬於屏東縣無自有住宅<br>(申請人及戶籍內直系親屬在屏東縣不能擁有任何自有住宅，包含自用住宅、共有住宅、抵押給金融機構的住宅等)
    |

    | 4 | 家庭年所得應低於屏東縣百分之五十分位點家庭之平均所得，且所得總額按家庭成員人數平均分配，每人每月不超過最低生活費三點五 |


    另外，有一些弱勢族群，例如低收入戶、特殊境遇家庭、身心障礙者等，可以優先申請社會住宅。

    其中，「永城好室」社會住宅緊鄰勝利星村，規畫 185 戶，文教與生活機能豐富，更規畫托嬰中心，期望透過政策，還有鼓勵青年安心成家；而「鶴聲好室」鄰近屏東榮總，規畫
    163 戶，交通與醫療機能便利，並提供身心障礙友善設施和居住空間，照顧多元族群。

    【資料來源：2024 年 10 月台視新聞網、2024 年 7 月聯合新聞網】

    請依據短文內容，回答第 19 題至第 22 題：'
