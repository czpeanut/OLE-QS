  group_stem: 'The Olympics is a big event in the world of sports. They take place
    every four years, and cities around the world want to host them. Thousands of
    people and athletes come from around the world to be at the games.

    The first Summer Olympics was in Athens, Greece, in 1896, and the first Winter
    Olympics was in Chamonix, France, in 1924. London hosted the Summer Olympics three
    times—in 1908, 1948, and 2012. Innsbruck, St. Moritz, and Lake Placid each hosted
    the Winter Olympics twice.

    To get ready for the games, the athletes train hard in their sport for years.
    They don’t just train once or twice a week. They usually train for many hours
    every day. They do that because they want to win medals.


