- id: doc_112_高雄_林園_社會_歷史_g7s1e3_s1_29
  section: 1
  number: 29
  type: single
  page: 2
  stem: 文中提及的「傳統港市」，在1860 年之前所呈現的貿易樣貌最可能為下列何者？
  options:
  - label: A
    content: 新式的糖廠紛紛成立
  - label: B
    content: 茶葉為最大宗輸出品
  - label: C
    content: 貿易對象主要為歐美各國
  - label: D
    content: 廈郊、布郊等商業組織出現
  group_stem: '清帝國統治臺灣初期，鹿耳門是臺灣與中國貿易的唯一正口（合法港口)，島内沿岸各港依規定皆須透過該港口進出口商品。乾隆晚期，福建沿海一带缺米嚴重，隨著中、北部的逐漸開發，臺灣因此大量出口稻米到福建，交換紡織品、藥材和其他日用品，此時以鹿耳門為單一正口的政策，無法負荷實際貿易需求。有鑑於此，鹿港成為第二個與福建對接的正口，四年後清政府再度增開八里坌，形成北、中、南三個正口的貿易狀態，但也使原來壟斷全臺灣對外貿易的鹿耳門，貿易量大受影響。

    1860 年，安平、淡水丶打狗、雞籠成為「條約港」，原先傳統的正口雖仍持續運作，但二者逐步走向不同的貿易型態。傳統港市的臺灣商人，較少受到洋行的打擊，甚至協助洋行收購傳統港市的土產；而在條約港成立洋行的外國商人，主要經營茶、糖、樟腦的出口，以輪船為主要的貨運工具，貿易網絡擴及全世界。總之，19
    世紀中期，臺灣的港口城市同時存在著兩種貿易型態，傳統港市並未因西洋勢力的進入而沒落，大體上仍維持原本的貿易運作；而條約港則因應國際貿易形勢，不斷演變出新的貿易機制。'
  answer:
  - D
  answer_source: answer_key_vlm
