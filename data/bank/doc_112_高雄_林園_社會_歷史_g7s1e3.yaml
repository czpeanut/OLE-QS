  stem: '時人稱「番勢」的李春生，自幼家境貧困，年少時跟父親到廈門經商，在當地習得英語與漢語，使他成為漢人與西方商人溝通的橋梁，因緣際會結識來自蘇格蘭的茶商約翰‧陶德，協助他創出「臺灣烏龍茶」(Formosa
    Oolong)品牌，享譽國際，促成北部製茶事業大為興盛，茶葉成為當時最大宗的出口商品，李春生因此有了「臺灣茶葉之父」的美稱。李春生除了經營事業以外，對於傳教更是不遺餘力，他不僅是臺灣基督教長老教會的奠基者，更在臺灣建省後，協助劉銘傳建設大稻埕，使得各國商人在此處雲集。文中提及「番勢李仔春」中的「番」應該是指下列何者？

    〈習作40.2(1)〉'
  options:
  - label: A
    content: 日人
  - label: B
    content: 熟番
  - label: C
    content: 生番
  - label: D
    content: 洋商
  answer:
  - D
  answer_source: answer_key_vlm
