  stem: 根據上述新聞事件，請問：余姓老翁若未身亡可能面臨下列何種法律責任？
  options:
  - label: A
    content: 行政責任、刑事責任
  - label: B
    content: 行政責任、民事責任
  - label: C
    content: 民事責任、刑事責任
  - label: D
    content: 民事責任、刑事責任及行政責任。
  group_stem: '新北市三峽區 19 日發生 3 死 12 傷重大車禍，運安會認定屬重大公路事故，正式立案調查，指定主任調查官並成立專案調查小組進行後續調查作業。余姓男子（78
    歲）涉駕車闖紅燈高速衝撞，造成 3 死、12 輕重傷（含駕駛），死傷者大多數為學生。這起重大車禍案引發輿論高度關注，超過 10 個路權團體號召 200 多人上街，提出駕駛人全面回訓、改革高齡換照制度及交通工程改善等訴求，盼政府正視行人安全。交通部
    20 日立刻宣布研擬高齡駕駛人駕照換照年齡，從現行的 75 歲改為 70 歲，有肇事紀錄者須完成「安全駕駛實地訓練課程」、危險感知及交通安全教育課程。

    三峽警方獲悉余翁 5/31 因傷勢嚴重不幸離世，已依規定報請新北地檢署檢察官相驗。但依現行法令，因余翁已身亡，所涉及相關責任部分，最終會因當事人已死亡，只能依法處分不起訴。三人死亡
    12 人受傷，這些家庭的未來誰來賠？【素養試題】'
