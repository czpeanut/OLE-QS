  options:
  - label: A
    content: 兒福聯盟社工是屬於政府單位之社福機構
  - label: B
    content: 兩位保母所獲得的證照是行政處分
  - label: C
    content: 兒童基本的生存發展權是憲法所保障之自由權
  - label: D
    content: 兩位保母仍可上訴是民告官的權利
  group_stem: '受社會大眾矚目之保母虐童致死案，北檢在 2024 年 4 月 18 日偵查終結此案，以「凌虐兒童致死」，「成年人故意對兒童施以凌虐而妨礙自由致死」，「成年人故意傷害兒童致死」共
    3 罪名起訴。

    2024 年 7 月 16 日甲院三讀通過「《乙法》第 286 條條文修正案」，加重虐童刑責。三讀條文增訂，對於未滿 7 歲之人，施以凌虐或以他法足以妨害其身心的健全或發育者，或是因而致人於死、致重傷者等，依各項規定加重其刑至
    1/2。

    2025 年 5 月 13 日宣判，台灣台北某法院依《乙法》成年人故意對兒童犯傷害致人於死罪、《丙法》成年人故意對兒童妨害自由且施以凌虐而致死等罪，判處劉彩萱無期徒刑、劉若琳
    18 年有期徒刑，可上訴。

    2025 年 5 月，丁院之委員針對社工缺乏專業敏感度、兒福聯盟在保母管理及社工訓練等方面有多項缺失、行政院戊機關未踐行兒童最佳利益原則保全兒童生存發展與相關福利、新北市政府未落實記錄、臺北市政府的訪視輔導流於形式，因而對相關機關提出己案，並建請某法院參酌兒福聯盟社工違失情形。

    事實上，台灣虐嬰虐童案件頻繁，無論是有／無證照的保母，或是公共／準公共／私營托嬰中心，皆傳過令人心碎的案件，這些都不是偶然，也並非僅是個人化的托育人員「沒愛心、沒耐心」，更可能鑲嵌長久以來托育制度議題，像是師生比問題，托育人員薪資薄、勞動厚重，社工與保母間的互動張力，評鑑只是一時，難以全貌窺見日常等各種待解問題。'
