  - label: D
    content: 年滿14 歲至未滿20 歲
  group_stem: '十四歲的弟弟走進少年法庭，隔著防疫透明隔板，在圓桌的另一邊、法官的正對面，垂頭坐了下來。【素養試題】

    為什麼想要種大麻？有成功嗎、種了多少？因為好玩。有成功。五六顆裡面成功一顆。

    你自己有吸食嗎？什麼感覺、知道對身體不好嗎？有吸過一次。吸完就睡著了。知道。

    弟弟回答法官問題的時候雖然一直低著頭，但下意識挺直了身子。

    去哪裡學種大麻的呢？網路上。    為什麼會在網路上分享？因為好玩。

    大麻種子很貴吧，你的錢哪裡來的？零用錢，省吃儉用。

    知道自己這次行為錯在哪裡嗎？錯在我是臺灣人

    要如何避免下次自己再犯同樣的錯誤？移民。

    還有什麼想要說的？ 荷蘭、加拿大、美國都可以，連泰國也開放了。臺灣是落後國家。

    在成年人的世界，種大麻目前仍是不得易科罰金的重罪，所以也不可能純粹給予勉勵，就讓弟弟回去。開庭的後半，法官花上很多時間「講道理」，講美國大麻只有在部分的州合法，荷蘭和泰國也都不算全面合法，網路上有很多資訊是錯誤的，要懂得自己查證，人云亦云很危險⋯⋯；而你身在臺灣，沒有辦法，那就要遵守臺灣的法律。如果你不滿意，想要改變，那只能讓自己長大變得夠強，去成為能改變這些事情的人，而且等你長大說不定想的就不一樣了⋯⋯。

    本文摘錄自《你在暗中守護我》'
