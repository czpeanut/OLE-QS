  type: single
  page: 1
  stem: 小叮噹乘坐時光機回到西元1926 年，他在這個國家中看到：「所有人過著集體式的生活，財產一律為國家所有，且國家中沒有階級制度之分，由無產階級來領導政治，大家過著『各盡所能，各取所需』的生活。」請問：小叮噹所看到的是下列哪一國家？
  options:
  - label: A
    content: 中國
  - label: B
    content: 德國
  - label: C
    content: 蘇聯
  - label: D
    content: 義大利。
