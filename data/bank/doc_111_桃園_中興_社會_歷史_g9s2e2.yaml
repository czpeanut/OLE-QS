    content: 二戰結束後，蘇聯殖民勢力減弱，境內各地紛紛獨立
  - label: B
    content: 冷戰期間，烏克蘭加入北約組織，脫離蘇聯而獨立
  - label: C
    content: 1980 年代蘇聯放寬東歐的控制，烏克蘭趁此宣布獨立
  - label: D
    content: 戈巴契夫的改革導致蘇聯解體，各加盟國紛紛獨立。
