  - label: C
    content: 脂質
  - label: D
    content: 蛋白質。
  group_stem: "所謂基因就是一串DNA 密碼。基因隱含的資訊能告訴細胞何時該製造出何種蛋白質，可能是身體所需的激素、可能是皮膚結構中的膠原蛋白、也可能是細胞上的特殊孔道。若體內製造某些蛋白質的功能出了錯，疾病就隨之而來。有些遺傳性的糖尿病患者便是先天具有不正常的基因，以致不能製造正常量的胰島素來調節體內的醣類代謝。而目前針對糖尿病的治療，主要是以生物技術在體外利用細胞製造大量胰島素，經過純化後作為藥物，再注入患者體內。\n\
    \    所謂基因治療，指的是利用適當方法將一個完整的正常基因送入適當的細胞內，希望此完整基因在細胞核內，可藉由基因重組的過程，正確的嵌入染色體，將有缺陷的基因修復；或是至少可在細胞內表現，以彌補未正常表現的蛋白質。最終目標是希望修復後的基因，能長期穩定的持續表現所缺少的蛋白質。請回答下列問題："
