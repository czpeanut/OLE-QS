- id: doc_113_高雄_七賢_國文_g8s1e3_s2_35
  section: 2
  number: 35
  type: single
  page: 4
  stem: 依據本文，下列敘述何者正確？
  options:
  - label: A
    content: 作者曾經因為對狗直接張開手掌而被攻擊，最後流血送醫
  - label: B
    content: 對不熟識的狗伸手示好，必須先握緊拳頭，以便被咬時可以回擊
  - label: C
    content: 想摸狗可以先拍拍牠的頭頂，再摸摸牠的臉頰，最後搔搔下顎
  - label: D
    content: 作者學會與狗示好的方式，使狗逐漸放鬆，彼此能友善的互動。
  group_stem: "有一次我在毫無戒心的狀態下，向一隻搖著尾巴的大型犬直接伸出手掌。結果牠一躍而起，張嘴往我咬來……我縮手慢了一些，牠的尖銳犬齒撞上我的手指，刻出一顆倒三角形的齒痕。所幸沒有咬破皮，只是瘀青了好多天。\n\
    \  後來有人告訴我，想給不熟識的狗兒伸手示好的時候，應該握緊拳頭，而不是張開手掌。這樣子若牠不領情張口咬你時，還有機會硬將拳頭從牠的口中旋出。若是以手掌伸向牠，那牠的利牙極可能牢牢咬入手掌，讓你掙脫不了。\n\
    \  之後我學會了，我會握著拳頭給牠聞聞手背。若牠看來不那麼緊繃了，就將拳頭的內側轉向牠。牠如果繼續釋出善意，此時就可以慢慢地將拳頭鬆開，牠通常會好奇地聞聞我的手掌心。這時手指就會恰好在牠的下顎，可以輕輕地搔搔牠，摸牠的臉頰，最後手掌才能沿著臉頰攀到牠的頭頂，拍拍。\n\
    \  漸進式地釋出掌心，是一種必要的過程。突然直白地攤開，而對方猶豫時，張開手的人就陷入了該收手還是繼續攤開的兩難境地。（節錄自謝子凡 手的姿態）"
  tags:
