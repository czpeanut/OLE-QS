- id: doc_113_高雄_七賢_國文_g8s1e3_s1_30
  section: 1
  number: 30
  type: single
  page: 2
  stem: 「中國從很早開始就太注重表層禮儀，好好的一件事情被極度誇張的方式一鋪陳，也就變了味。早在科舉制度剛剛形成不久就被加了太多的裝飾，太重的渲染，把全國讀書人的心情擾亂得不輕。每次進士考試總有一批人考上，不管對國家對個人，慶賀一下、宣揚一番都是應該的，但不知怎麼一來，沒完沒了的繁複禮儀把這些錄取者捧得暈頭轉向。唐代的進士們先要拜謝「座主」（考官），參謁宰相，然後遊賞曲江，參加杏園宴、聞喜宴、櫻桃宴、月燈宴等等，還要在雁塔題名，在慈恩寺觀看雜耍戲場，繁忙之極，也得意之極。孟郊詩中所謂『春風得意馬啼疾，一日看遍長安花』，與張籍詩中所謂『二十八人初上第，百千萬里盡傳名』，就寫盡了此間情景。據傅璇琮先生考證，當時的讀書人一中進士，根本應付不了沒完沒了的熱鬧儀式，長安民間就興辦了一種謀利性的商業服務機構叫「進士團」，負責為進士租房子、備酒食、張羅禮儀，直至開路喝道，全線承包。「進士團」的生意一直十分興隆。（改寫自余秋雨
    十萬進士）」 根據本文，下列何者是作者的主要觀點？
