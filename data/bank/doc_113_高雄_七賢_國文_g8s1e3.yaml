    content: 文旨在提醒為政者以兇惡之嘴臉嚇人，不如以德待人。
  group_stem: "謝遷之變，宦第皆為賊窟。王學使七襄之宅，盜聚尤衆。城破兵入，掃蕩羣醜，屍填墀，血至充門而流。公入城，扛屍滌血而居。往往白晝見鬼；夜則牀下燐飛，牆角鬼哭。一日，王生皞迪，寄宿公家，聞牀底小聲連呼：「皞迪！皞迪！」已而聲漸大，曰：「我死得苦！」因哭，滿庭皆哭。公聞，仗劍而入，大言曰：「汝不識我王學院耶？」但聞百聲嗤嗤，笑之以鼻。公於是設水陸道場，命釋道懺度之。夜拋鬼飯，則見燐火營營，隨地皆出。先是，閽人①王姓者，疾篤，昏不知人者數日矣。是夕，忽欠伸若醒。婦以食進。王曰：「適主人不知何事，施飯於庭，我亦隨衆啗噉。食已方歸，故不飢耳。」由此鬼怪遂絕。豈鈸鐃鐘鼓，燄口瑜伽②，果有益耶？\n\
    \    異史氏曰：「邪怪之物，唯德可以已之。當陷城之時，王公勢正烜赫，聞聲者皆股慄；而鬼且揶揄之。想鬼物逆知其不令終耶？普告天下大人先生：出人面猶不可以嚇鬼，願無出鬼面以嚇人也！」《聊齋誌異･鬼哭》\n\
