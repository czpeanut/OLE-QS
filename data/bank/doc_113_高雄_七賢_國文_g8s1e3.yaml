  stem: 根據本文，下列有關芙蕖的敘述，何者正確？
  options:
  - label: A
    content: 芙蕖就是荷花
  - label: B
    content: 芙蕖實際上為殘荷
  - label: C
    content: 芙蕖無五穀之實且無其名，有百花之長而各無其短
  - label: D
    content: 芙蕖的霜中敗葉，無任何作用。
  group_stem: "芙蕖之可人，其事不一而足，請備述之。\n  群葩當令時，只在花開之數日，前此後此，皆屬過而不問之秋矣。芙蕖則不然。自荷錢出水之日，便為點綴綠波；及其莖葉既生，則又日高日上，日上日妍，有風既作飄搖之態，無風亦呈嬝娜之姿。是我於花之未開，先享無窮逸致矣。迨至菡萏成花，嬌姿欲滴，後先相繼，自夏徂秋；此則在花為分內之事，在人為應得之資者也。及花之既謝，似可告無罪於主人矣；乃復蒂下生蓬，蓮中結實，亭亭獨立，猶似未開之花；與翠葉並擎，不至白露為霜而能事不已。此皆言其可目者也。可鼻則有荷葉之清香，荷花之異馥，避暑而暑為之退，納涼則涼逐之生。至其可人之口者，則蓮實與藕皆並列盤餐而互芬齒頰。只有霜中敗葉，零落難堪，似成棄物矣；乃摘而藏之，又備經年裹物之用。是芙蕖也者，無一時一刻，不適耳目之觀；無一物一絲，不備家常之用者也。有五穀之實而不有其名，兼百花之長而各去其短，種植之利，有大於此者乎？\n\
    （李漁 芙蕖）\n註：①芙蕖：與「菡萏」皆指荷花。 ②嬝娜：草木長而柔弱的樣子。 ③菡萏：荷花未開叫菡萏。 ④徂：往、到。"
