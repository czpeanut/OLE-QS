    When you get together with your friends or family at a meal, there are always
    some people checking their cellphones all the time without chatting with others.
    They are called “phubbers.” The new word combines the two words, phone and snub.
    Snub means people show no interest in something or other people. They only pay
    attention to their cellphones and usually ignore people around them. When you
    are talking to them, they are always busy using their phones to send messages
    through LINE or post pictures on Instagram. They don’t listen to what you say.
    That really makes people feel upset. A study found that more than 17% of people
    phub others at least four times a day. Almost 32% of people say they are phubbed
    two or three times a day. Many studies also show that phubbing may be hurting
    your relationships with others. So that there are more people starting to have
    campaigns to stop phubbing. They hope people should have a face-to-face conversation
    with each other, instead of being phubbers all the time.


