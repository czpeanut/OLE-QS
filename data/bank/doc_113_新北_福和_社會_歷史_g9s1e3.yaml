  section: 1
  number: 19
  type: single
  page: 1
  stem: 19.呈上題，對魯尼的串文有興趣的人們，積極回覆該旅遊地的相關資訊，請問哪段文字與史實相符?
  options:
  - label: A
    content: 西方國家最初進入此地傳教時，也紛紛倡議廢除奴隸制度，以至於各國商人在亞洲殖民地招募大量華工，所以你去玩的時候才會看到那麼多華人。
  - label: B
    content: 我正在忙著修復一批博物館文物，這些文物是近期在雅加達海域打撈到的十七世紀中葉歐洲商船，其中有幾件中國與日本風格的瓷器，推知是此地殖民者透過轉口貿易所取得的物件。
  - label: C
    content: 在西班牙統治期間，建立許多西班牙式建築和石造教堂，其中最經典的首推位於馬尼拉王城區的聖奧古斯丁教堂!
  - label: D
    content: 鴉片戰爭戰敗後，中國淪為西方列強覬覦的目標，不平等條約的簽訂使英國獲得此塊土地，並大舉至中國通商傳教。
