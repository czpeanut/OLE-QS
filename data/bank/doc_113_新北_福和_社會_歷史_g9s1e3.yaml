- id: doc_113_新北_福和_社會_歷史_g9s1e3_s2_29
  section: 2
  number: 29
  type: single
  page: 2
  stem: 29.笛卡爾從通則出發，藉由邏輯推演出「上帝存在」的事實，下列何者應是他所得到的結論？
  options:
  - label: A
    content: 上帝創造了世界和人類萬物，所有的歷史進程都在祂的計畫之中，就連時間也是由祂主導的。
  - label: B
    content: 上帝以自然形式存在，讓世界按照祂所發明的律法運行，不干預或參與自然秩序和歷史秩序。
  - label: C
    content: 世界和人類萬物都是上帝創造的，但是上帝主宰了我們一半的行動，另一半則由我們自己決定。
  - label: D
    content: 人類因信仰得到正義，上帝的存在若成為我們的生活思想及透過行為活出來的模樣，便可得永生。。
  group_stem: (一)當笛卡爾知道，伽利略在羅馬受審，被迫收回他的科學主張後，笛卡爾停止了《論世界》的寫作，並不讓已寫成的部分出版發行。他在給朋友的信中說：「我只想尋求安詳、平和的心靈。然而，在這些外在的惡意下，這變成無法達成的目標。我只希望可以教導那些已從錯誤主張中得到利益，並且害怕失去利益而避免事實被揭露的人。」他選擇的突破口是方法論。他出版的第一部書是《方法導論》，他用數學的邏輯驗證方法，提倡「懷疑」這個概念，透過此態度，一步步把人引向正確的結論。笛卡爾同時也是一位天主教徒，他曾把這種論證方法用來證明上帝存在。他認為只要在理性推論中，上帝是存在的，這就足夠了。這個存在不應該打攪我們在現實世界中從事科學研究。請回答下列問題∶
