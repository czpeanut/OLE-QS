  group_stem: (二) 十七世紀後，歐洲人在中美洲的西印度群島開闢許多種植園。由於諸多原因，導致中美洲原住民幾乎滅絕，而歐洲人對蔗糖的需求卻持續增長，因此種植園的經營者會購買奴隸、農具與製糖設備，以增加殖民地的蔗糖產量。就這樣，逐漸形成了大西洋三角貿易，主要的商品是「白色貨物」和「黑色貨物」。歐洲的商船完成三角貿易大約需要兩個月，如此一趟行程獲利可觀，導致歐洲商人趨之若騖。正因為這類商人累積了大量的財富，使得工業革命的各種改良成為可能，瓦特的蒸汽機改良便得到這些商人的贊助。請回答下列問題∶
