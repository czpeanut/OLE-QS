  stem: 18.魯尼利用寒假出遊並沿途在他的Treads 上記錄當地風情，其中一段描述如下∶「原以為寒假出來玩，天氣應該很涼爽，這個國家卻天天艷陽高照，汗流浹背。走在街上感覺很親切，到處可見黃皮膚、黑皮膚的華人，到商店買東西還可以用閩南語和廣東話交談。該國天主教徒占83%，從西方傳入500
    年來一直對該國政治和社會產生巨大影響。」由此判斷，魯尼最可能去哪一個地方旅遊?
