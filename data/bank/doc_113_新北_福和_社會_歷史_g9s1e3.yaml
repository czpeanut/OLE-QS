  section: 2
  number: 33
  type: single
  page: 2
  stem: 33.根據以上兩份資料的內容，該節課程的主題最可能是何者？
  options:
  - label: A
    content: 歐洲帝國對於殖民地的經營與管理
  - label: B
    content: 歐洲東印度公司的經營與貿易手段
  - label: C
    content: 工業革命後世界貿易的轉型
  - label: D
    content: 臺灣是歐洲商船最重要的貿易目標。
  group_stem: '(三)歷史課中，老師拿出兩份資料讓學生閱讀∶

    資料一 一六五二年，耶穌會神父衛匡國因天主教會在華傳教時，發生是否容許中國教徒祭祖的爭議，必須前往梵諦岡說明。他所搭乘的船艦，在路經巽他海峽時，遭到公司船艦扣押，因而被巴達維亞總部納入帳下，交出了關於中國的第一手政情資料。衛匡國透露中國內部明亡清興的態勢，並鼓勵公司與清方接觸，利用新朝代即將建立的契機，開啟合法貿易管道。總部隨即將此事轉告臺灣長官費爾堡，交由他來找熱蘭遮市鎮的唐人居民諮詢，並要求協助……

    資料二 一六七二年，三艘歐洲船艦來到臺南，與延平王鄭經簽訂通商協議，並表明自己在亞洲沒有據點，不像其他歐洲人帶有敵意，願意與臺灣建立和平友好的關係。克利斯布（Ellis
    Crisp）向東寧國王鄭經遞呈公司班丹區經理之文書。書中說明是接到鄭經之邀請函後而來，要求調查台灣有何種商品適合於輸出入，並希望在台設立商館。鄭方則有意向公司購入火藥二百桶、火繩槍（Guns
    with match locks）二百挺、鐵……

    請回答下列問題∶'
