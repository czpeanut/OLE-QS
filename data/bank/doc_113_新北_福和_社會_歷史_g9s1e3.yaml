  stem: 24.1612 年4 月，英格蘭東印度公司船隊劫持「拉希米號」，勒索4000 英鎊贖金。蒙兀兒皇帝對東印度公司進行制裁，責令英格蘭人歸還，否則禁止其在境內蘇拉特經商。東印度公司衡量利弊，不久即屈從皇帝的要求。請問∶我們應如何詮釋蒙兀兒帝國的處置與歐洲人的反應？
  options:
  - label: A
    content: 蒙兀兒帝國排斥商業，欲藉拉希米號事件切斷歐洲商務
  - label: B
    content: 歐洲人到亞洲的目的是貿易，寧作妥協以確保商業利益
  - label: C
    content: 蒙兀兒帝國擁有軍事科技之優勢，歐洲人無法與之抗衡
  - label: D
    content: 歐洲人擁船堅砲利，但貿易重心在美洲，因而放棄對抗。
