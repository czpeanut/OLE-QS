  stem: '20.經濟史家稱十九世紀英國是史上「第一個工業國家」。表一是1801 到1921 年，英國就業結構百分比的變化。根據十九世紀英國經濟發展趨勢判斷，甲、乙、丙分別是指：


    | 表一 | 甲 | 乙 | 丙 |

    | :--- | :--- | :--- | :--- |

    | 1801 | 36% | 35% | 29% |

    | 1841 | 28% | 24% | 48% |

    | 1881 | 34% | 14% | 52% |

    | 1921 | 42% | 9% | 49% |'
  options:
  - label: A
    content: 甲、服務業；乙、農業；丙、工業
  - label: B
    content: 甲、農業；乙、工業；丙、服務業
  - label: C
    content: 甲、工業；乙、服務業；丙、農業
  - label: D
    content: 甲、農業；乙、服務業；丙、工業。
