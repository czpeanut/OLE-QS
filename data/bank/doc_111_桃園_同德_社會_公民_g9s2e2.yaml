  stem: 以往不少大型跨國企業，包含知名運動品牌，國際連鎖服飾品牌和玩具生產大廠等代工廠，都曾被點名為「血汗工廠」。美國人權團體和消費者發起「反血汗工廠」運動，避免工廠的工人權益受到侵害。為避免這類問題一再發生，可以落實哪一項行動？
  options:
  - label: A
    content: 加徵知名跨國企業的貨物稅
  - label: B
    content: 強化工廠工人的專業能力
  - label: C
    content: 立法保障公平的勞資關係
  - label: D
    content: 協助國內代工廠爭取最大利潤。
