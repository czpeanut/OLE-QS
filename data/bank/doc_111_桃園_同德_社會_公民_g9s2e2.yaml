  stem: 目前全球糧食生產總量，可供全球人口食用，但根據2022 年《世界糧食和營養狀況》報告顯示，全球飢餓人數正處於創紀錄的水平，而且這一人數還在增加。2021
    年，全世界有多達8.28 億人面臨飢餓，比前一年增加了4600 萬人，自2019 年以來增加了1.5 億人。上述凸顯出全球化帶來的何種問題？
