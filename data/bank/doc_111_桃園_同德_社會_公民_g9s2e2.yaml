  section: 1
  number: 52
  type: single
  page: 2
  stem: 在歐美國家影響之下，不少地方有「伊斯蘭恐懼症」，即是將穆斯林視為具有攻擊性的人，而我國對伊斯蘭文化相對包容，各縣市政府時常利用假日舉辦伊斯蘭文化的活動，女性穆斯林也不會因為穿戴罩袍而受到歧視。台灣對伊斯蘭文化的態度，反映下列何者？
  options:
  - label: A
    content: 強勢文化逐漸領導國際流行趨勢
  - label: B
    content: 異地工作的外籍移工人權時常被忽略
  - label: C
    content: 宗教信仰文化面臨人類文明的挑戰
  - label: D
    content: 文化全球化之下仍應尊重多元文化。
