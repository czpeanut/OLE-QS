  stem: 下圖為「公平貿易認證標章」：公平貿易認證組織（FLO-CERT）認證與督查的生產者。該產品種植與收成都符合國際公平貿易標籤組織所規範的公平貿易認證標準。供應鏈同時也受到FLO-CERT
    的督查，以確保產品的完整性。只有被授權者才可以使用這個標章。身為消費者的我們，購買此標章產品有助於解決何種全球關聯議題呢？
