  page: 1
  stem: 回憶中西文化交流，明末傳教士利瑪竇在中國傳教時認為祭拜祖先等傳統活動，可許與天主教共存，在其死後，羅馬教廷判定祭祖為偶像崇拜，最終教廷下令中國信徒禁止祭祖等行為，引發康熙的禁教，使得天主教中斷了一百年在中國的傳教活動。根據上述，下列敘述何者正確？
  options:
  - label: A
    content: 減少彼此交流才能保存文化的多樣性
  - label: B
    content: 文化交流常因差異或偏見引發衝突或對抗
  - label: C
    content: 教廷禁止祭祖是在維護在地的特有性
  - label: D
    content: 康熙實施禁教是為了避免文化單一性。
