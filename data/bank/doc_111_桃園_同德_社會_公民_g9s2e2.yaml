  section: 1
  number: 45
  type: single
  page: 1
  stem: 就讀法文系的美華是原住民，她有感於母語傳承的重要性，因此畢業後放棄高薪的翻譯機會，投入母語教學的行列。請問美華的行為具有何項世界公民素養？
  options:
  - label: A
    content: 熱愛鄉土文化
  - label: B
    content: 重視人權價值
  - label: C
    content: 關心國際事務
  - label: D
    content: 尊重多元文化。
