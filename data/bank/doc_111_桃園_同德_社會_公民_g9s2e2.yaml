  group_stem: "＊台灣世界展望會飢餓三十代言人動力火車關注全球糧食危機，籲大眾即刻救援  資料來源：臺灣照生新聞夏正翰記者撰\n    國內消費者物價上漲率已連三個月破3%，其中以食物價格漲幅最大，對收入拮据的低所得家庭來說，負擔更為沉重，台灣世界展望會服務家庭就有近3,200\
    \ 戶有物資、經濟等迫切需求。糧價上漲也造成全球危機，各國糧食供應原已因氣候變遷和新冠疫情大受影響，烏克蘭衝突使得俄烏兩國的小麥等糧食出口銳減，更加劇糧食危機，衝擊許多仰賴糧援的發展中國家人民，像是阿富汗即有近870\
    \ 萬人面臨嚴重飢餓。\n       這次兩人接受展望會邀請，獨挑飢餓三十代言大任，感到相當榮幸，「希望透過我們的影響力，讓更多人知道展望會在國內外進行的救援工作，更為需要的人群帶來盼望。」兩人齊心呼籲大眾透過飢餓體驗DIY、參與《莎瑪》實境體驗遊戲等方式，一同加入飢餓三十，讓因為氣候變遷、戰火和疫情而退步的世界，再度重啟前進！"
