  section: 2
  number: 37
  type: single
  page: 3
  stem: ( ) 37. Paul is watching this video on YouTube. What can he learn from it?
  options:
  - label: A
    content: Steps to make strawberry yogurt.
  - label: B
    content: Some fun facts about ice cream.
  - label: C
    content: The long history of ice cream.
  - label: D
    content: An easy way to make ice cream.
  group_stem: '(Philip is a YouTuber, and he is making a video.)

    Welcome to Philip''s Kitchen. I''m Philip. Today, we are going to make something
    fun and easy - Shake-It Ice Cream!

    Here''s what you need:

    | 2 cups of yogurt | Ice cubes (a lot!) |

    | 2 tablespoons of sugar | 500 grams of strawberries |

    | 1 cup of salt | A small bag and a big bag |

    Let''s start!

    1. Put the yogurt, sugar, and strawberries in the small bag. Seal it.

    2. Put ice cubes in the big bag. Add the salt on top.

    3. Put the small bag inside the big bag. Seal the big bag.

    4. Shake the bag for 5 minutes.

    5. When you''re done, open the big bag and dry the small bag.


    Then open the small bag – your ice cream is ready! This is great for kids or parties.

    Alright, go make some ice cream, and I will see you next time on Philip''s Kitchen!


