- id: doc_111_高雄_大灣_國文_g9s2e1_s2_43
  section: 2
  number: 43
  type: single
  page: 6
  stem: 從本文可知，季梁趕回來見魏王的原因為何？
  options:
  - label: A
    content: 表明自己的忠心
  - label: B
    content: 告誡魏王遠離邯鄲
  - label: C
    content: 勸魏王不要攻打邯鄲
  - label: D
    content: 協助魏王推行霸業。
  group_stem: "魏王欲攻邯鄲。季梁聞之，中道而反，衣焦①不申②，頭塵不去，往見王，曰：「今者臣來，見人於大行③，方\n北面而持其駕，告臣曰：『吾欲之楚。』臣曰：『君之楚，將奚④為北面？』曰：『吾馬良。』臣曰：『馬雖良，此\n\
    非楚之路也。』曰：『吾用⑤多。』臣曰：『用雖多，此非楚之路也。』曰：『吾御者善。』此數者愈善，而離楚愈\n遠耳。今王動欲成霸王，舉欲信於天下，恃王國之大，兵之精銳，而攻邯鄲，以廣地尊名，王之動愈數，而離王⑥愈\n\
    遠耳，猶至楚而北行也。」\n                                                               \
    \                    (節錄自戰國策)\n【注釋】：①焦：皺褶。  ②申：舒展。  ③大行：大馬路。  ④奚：為什麼。  ⑤用：錢財。\
    \  ⑥王：稱王。"
