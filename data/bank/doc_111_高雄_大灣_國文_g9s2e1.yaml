- id: doc_111_高雄_大灣_國文_g9s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 下列「 」中的成語，都和手勢或手部動作有關，何者使用錯誤？
  options:
  - label: A
    content: 本以為「唾手可得」的獎盃，卻因一時輕敵而「拱手讓人」了
  - label: B
    content: 參觀創意花展時，不可「信手拈來」，隨意攀摘
  - label: C
    content: 聚餐後，他因心肌梗塞而「撒手人寰」，讓家人、朋友悲痛不已
  - label: D
    content: 他是我的莫逆之交，如今面臨困境，我豈能「袖手旁觀」。
- id: doc_111_高雄_大灣_國文_g9s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: '「王執行長能夠在光電業中(   )，且名聲(   )，是因為他(   )，願意投入大量經費研發產品，每有新產品推出

    ，總令人(   )，因此訂單已排到一年後。」缺空處填入下列哪一組詞語最恰當？'
  options:
  - label: A
    content: 執牛耳／如雷貫耳／目光如炬／拭目以待
  - label: B
    content: 掩耳盜鈴／執牛耳／目光如豆／瞠目結舌
  - label: C
    content: 掩人耳目／ 掩耳盜鈴／執牛耳／瞠目結舌
  - label: D
    content: 目光如炬／瞠目結舌／掩耳盜鈴／執牛耳。
- id: doc_111_高雄_大灣_國文_g9s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 下列關於戰國策的介紹，何者敘述錯誤？
  options:
  - label: A
    content: 非一時一地一人之作，經漢 劉向編訂整理
  - label: B
    content: 多採司馬遷 史記之說，對後世散文影響深遠
  - label: C
    content: 語言生動，論事、說理善用比喻與寓言，透闢而具說服力
  - label: D
    content: 多記載戰國策士謀臣的談論與活動。
- id: doc_111_高雄_大灣_國文_g9s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: '「然則，冷靜須與同情相輔相成，方不偏失入冷漠。『史記』一書之恆常感人處，正在於字裡行間每每有司馬

    遷個人的生命感思湧動，它絕不只是一堆死寂刻板的文字而已！□□，我則又逐漸了悟，□□寫學術論文，□□

    不能完全抹煞情感；□□冷靜與同情之間的斂放不踰矩，又委實是此類文章的高層次標的了。」（林文月 我的三

    種文筆）上列引文，依文意推敲，選出□□中最適合填入的選項？'
  options:
  - label: A
    content: 因此／至於／其實／即使
  - label: B
    content: 而且／所以／仍然／其實
  - label: C
    content: 近來／即使／仍然／至於
  - label: D
    content: 所以／近來／因此／而且
- id: doc_111_高雄_大灣_國文_g9s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: '一家手語餐廳的誕生一文中，「他的初心，獲得祝福；他的發心，獲得廣大社會的回應；他的善心，獲得聽障

    朋友一致的肯定！」從這段文字可推知手語餐廳的老闆感到欣慰的原因為何？'
  options:
  - label: A
    content: 初衷得報，善念得償
  - label: B
    content: 別開風氣，一炮而紅
  - label: C
    content: 廣受歡迎，門庭若市
  - label: D
    content: 聽障者安，視障者喜。
  lesson_raw:
    title: 一家手語餐廳的誕生
    basis: 題幹提及《一家手語餐廳的誕生》
- id: doc_111_高雄_大灣_國文_g9s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 一家手語餐廳的誕生，下列何者說明不正確？
  options:
  - label: A
    content: 「仁慈是一種聾子能聽見、盲人能看見的語言。」說明仁慈是無聲的語言，無形的文字
  - label: B
    content: 「樂於入境隨俗」、「既來之則安之」是一種既然遇到了就只能無奈面對的消極態度
  - label: C
    content: 「有幾天時間能成為瞎子與聾子，應不失為一件幸事。」意味著短暫的失去，將讓人更珍惜所擁有的
  - label: D
    content: "「重要媒體無不競相報導，也引發了不少餐廳經營者與老饕們的熱烈討論。」手語餐廳成為熱門的話題引\n    起大家注意。"
  lesson_raw:
    title: 一家手語餐廳的誕生
    basis: 題幹提及《一家手語餐廳的誕生》
- id: doc_111_高雄_大灣_國文_g9s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 以下對於鄒忌諷齊王納諫一文中的文句分析，何者正確?
  options:
  - label: A
    content: "「暮，寢而思之曰:『吾妻之美我者，私我也；妾之美我者，畏我也；客之美我者，欲有求於我也』」—→寫\n    鄒忌身邊的人基於不同的動機恭維他，讓他心生疑懼而無法入眠"
  - label: B
    content: "「臣之妻私臣，臣之妾畏臣，臣之客欲有求於臣……宮婦左右，莫不私王；朝廷之臣，莫不畏王；四境之內\n   ，莫不有求於王」—→寫鄒忌從他與妻的關係，類推朝臣和齊王的關係；從他與妾的關係，類推宮婦左右和齊\n\
      \   王的關係；從他與客的關係，類推境內百姓和齊王的關係"
  - label: C
    content: "「群臣吏民，能面刺寡人之過者，受上賞；上書諫寡人者，受中賞；能謗議於市朝，聞寡人之耳者，受下賞\n    」—→寫齊王的採納忠言，顯現他是明智果斷、有所作為的國君"
  - label: D
    content: "「燕、趙、韓、魏聞之，皆朝於齊。此所謂戰勝於朝廷」—→道出內政清明、國力強盛後再出兵打他國，將\n    戰無不勝。"
  lesson_raw:
    title: 鄒忌諷齊王納諫
    basis: 題幹提及《鄒忌諷齊王納諫》
- id: doc_111_高雄_大灣_國文_g9s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 鄒忌諷齊王納諫一文中，下列何者說明正確？
  options:
  - label: A
    content: 「忌不自信」指鄒忌貌不如人而沒有自信
  - label: B
    content: 「熟視之，自以為不如」說明鄒忌沒有自知之明
  - label: C
    content: 「聞寡人之耳者，受下賞」代表齊王願意接受民眾的意見
  - label: D
    content: 「王曰：『善。』」顯現齊王是剛愎自用的國君。
  lesson_raw:
    title: 鄒忌諷齊王納諫
    basis: 題幹提及《鄒忌諷齊王納諫》
- id: doc_111_高雄_大灣_國文_g9s2e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 關於人不可以無癖一文中引用的句子，下列說明何者正確？
  options:
  - label: A
    content: 幽夢影：「律己宜帶秋氣，處世宜帶春氣。」義近於「如人飲水，冷暖自知」
  - label: B
    content: 柳永 蝶戀花：「衣帶漸寬終不悔，為伊消得人憔悴。」的情懷與「揀盡寒枝不肯棲，寂寞沙洲冷」相同
  - label: C
    content: 「蘭茝蓀蕙之芳眾人之所好，海畔亦有逐臭之夫。」意指結交朋友要留意「近朱者赤，近墨者黑」的情形
  - label: D
    content: 孔子曾說：「其為人也，發憤忘食，樂以忘憂，不知老之將至云爾。」意為「專注學習，樂趣無窮」。
  lesson_raw:
    title: 人不可以無癖
    basis: 題幹提及《人不可以無癖》
- id: doc_111_高雄_大灣_國文_g9s2e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: '在人不可以無癖一文中，「醉翁之意不在酒」一句，本指喝酒時意不在酒，而在寄情山水，舒放心胸，後比喻

    別有用心。下列選項請根據句意選出成語使用最適當者？'
  options:
  - label: A
    content: 產品設計要有自己的特色，不要「閉門造車」，一味模仿他人
  - label: B
    content: 為政者要了解社會的現況，「上行下效」的政策是行不通的
  - label: C
    content: 你才承諾又馬上反悔，如此「亦步亦趨」，我們怎麼合作呢
  - label: D
    content: 今天他在會中「大放厥詞」，引起許多人側目。
  lesson_raw:
    title: 人不可以無癖
    basis: 題幹提及《人不可以無癖》
- id: doc_111_高雄_大灣_國文_g9s2e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 下列各選項皆為莎士比亞劇本中的名言，何者涵義說明不正確？
  options:
  - label: A
    content: 叫狐狸看守羊欄，豈不是糊塗透頂嗎？—→不要被華麗的表象蒙蔽
  - label: B
    content: 人家說最好的好人，都是犯過錯誤的過來人—→知錯能改，善莫大焉
  - label: C
    content: 黑夜無論怎樣悠長，白晝總會到來—→冬天到了，春天還會遠嗎
  - label: D
    content: 在顛沛的命運中，最可以看出一個人的氣節—→時窮節乃現。
- id: doc_111_高雄_大灣_國文_g9s2e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 關於羅密歐與茱麗葉樓臺會一文，下列何者不能看出羅密歐對茱麗葉的真情？
  options:
  - label: A
    content: 但願我是她手上的手套，可以輕撫她的臉龐
  - label: B
    content: 妳只要稱我為愛人，我就擁有一個新的稱呼。從今以後，再也不叫羅密歐了
  - label: C
    content: 沒有受過傷的人，才會譏笑別人身上的疤痕
  - label: D
    content: 得不到妳的愛，活著也是苟延殘喘，倒不如讓他們的仇恨結束我的生命。
  lesson_raw:
    title: 羅密歐與茱麗葉樓臺會
    basis: 題幹提及《羅密歐與茱麗葉樓臺會》
- id: doc_111_高雄_大灣_國文_g9s2e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: '羅密歐與茱麗葉樓臺會一文中「羅密歐誤以為茱麗葉已經身亡，便決定殉情；而茱麗葉醒來後，悲痛欲絕，竟

    也拔其佩劍自刎而死。」請問此種情懷可用下列何者形容？'
  options:
  - label: A
    content: 春蠶到死絲方盡，蠟炬成灰淚始乾
  - label: B
    content: 身無彩鳳雙飛翼，心有靈犀一點通
  - label: C
    content: 問世間情為何物？直叫人生死相許
  - label: D
    content: 此情可待成追憶，只是當時已惘然。
  lesson_raw:
    title: 羅密歐與茱麗葉樓臺會
    basis: 題幹提及《羅密歐與茱麗葉樓臺會》
- id: doc_111_高雄_大灣_國文_g9s2e1_s1_20
  section: 1
  number: 20
  type: single
  page: 3
  stem: '「把掌聲留給自己，你的荷包不會變多一點，但你的朋友會少一個；把掌聲留給自己的伙伴，你的荷包不會變

    少，但你會多一個朋友。」這句話的主旨，與下列何者最接近？'
  options:
  - label: A
    content: 友誼的手，常伸向不吝讚美的人
  - label: B
    content: 掌聲是幸福人生不可或缺的良伴
  - label: C
    content: 朋友的多寡可決定財富與掌聲的多寡
  - label: D
    content: 能適時鼓掌的人，最懂得奉獻的道理。
- id: doc_111_高雄_大灣_國文_g9s2e1_s1_21
  section: 1
  number: 21
  type: single
  page: 3
  stem: '「我說它是我所戴的第四隻手錶，就不覺想起那第一隻手錶來。那是母親的一支男用夜光錶。 （甲）那時父親

    遠去北平，遲遲不歸。（乙）父親用舊了給母親，母親從不戴錶，（丙）夜裡醒醒來看看又看看。（丁）只把它

    放在枕頭邊， 母親夜裡看錶上的時刻，就彷彿父親第二天一早就會回來似的。」（琦君 摘手錶）請依文意選出

    畫線處正確排序的選項？'
  options:
  - label: A
    content: 丙乙甲丁
  - label: B
    content: 乙丁丙甲
  - label: C
    content: 甲丙乙丁
  - label: D
    content: 丁甲乙丙。
- id: doc_111_高雄_大灣_國文_g9s2e1_s1_22
  section: 1
  number: 22
