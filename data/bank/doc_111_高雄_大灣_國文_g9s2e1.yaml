  group_stem: "命運之神欲亟亟奪走小草的生命。祂以烈陽烤灼之，以暴風淹沒之，以風雪凌虐之，小草終至奄奄一息。命運之\n神獰笑說：「你總該投降了吧！」小草以最後的一口氣回答說：「生命給你，尊嚴留下！」次春，小草長滿原野，一\n\
    片欣欣向榮。命運之神訝然說：「你們不是已經死了嗎？」小草回答說：「你扼殺得了生命，扼殺不了生機！」\n                          \
    \                                                            （杏林子）"
