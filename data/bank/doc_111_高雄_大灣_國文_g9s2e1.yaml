  stem: 根據季文子自己的陳述，「相宣、成，無衣帛之妾，無食粟之馬」的主要原因，應是下列何者？
  options:
  - label: A
    content: 不想過度寵溺妾與馬
  - label: B
    content: 心性淡泊且不喜奢華
  - label: C
    content: 遵從父兄節儉的家訓
  - label: D
    content: 秉持苦民所苦的精神。
  group_stem: "季文子相宣、成，無衣帛之妾，無食粟之馬。 仲孫它諫曰：「子為魯上卿，相二君矣，妾不衣帛，馬不食粟，人\n其以子為愛①，且不華國乎！」文子曰：「吾亦願之。然吾觀國人，其父兄之食粗而衣惡者猶多矣，吾是以不敢。\n\
    人之父兄食粗衣惡，而我美妾與馬，無乃非相人者乎？且吾聞以德榮為國華，不聞以妾與馬。」文子以告孟獻子，\n獻子囚之七日。自是仲孫它之妾衣不過七升之布，馬餼②不過稂莠③。文子聞之，曰：「過而能改者，民之上也。\n\
    」使為上大夫。\n                                                                    \
    \          （改寫自國語 魯語）\n【注釋】①愛：吝嗇。 ②餼：飼料。 ③稂莠：雜草。"
