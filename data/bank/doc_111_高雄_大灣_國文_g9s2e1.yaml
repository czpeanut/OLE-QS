  group_stem: "造物者給人類創造了兩顆眼珠子，都是朝著前方，意思是要多看看別人，不要光看自己；另外還有兩隻胳膊，都\n是朝裡面彎，意思是要多靠自己，不要依賴別人。\n\
    \  可是聰明過頭的人類，往往違背了造物者的旨意，兩顆眼珠老是看自己，而且兩隻胳膊總是伸出去要求別人。\n                        \
    \                                                   （吳東權 自己與別人）"
