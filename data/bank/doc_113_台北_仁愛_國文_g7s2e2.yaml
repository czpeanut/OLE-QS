  stem: 地瓜葉參加字音比賽，但有一題答案不確定，請大家幫他找出前後「讀音」相同的答案：
  options:
  - label: A
    content: 拿著扁「擔」╱挑著「擔」子
  - label: B
    content: 背負家「累」╱深受連「累」
  - label: C
    content: 因事「勾」留╱不法「勾」當
  - label: D
    content: 道路要「衝」╱講話很「衝」。
- id: doc_113_台北_仁愛_國文_g7s2e2_s4_2
  section: 4
  number: 2
  type: single
  page: 1
  stem: 蛋餅迷路了，只有找出正確的答案才能走出迷宮，請大家幫他找出前後「字形」相同的選項：
  options:
  - label: A
    content: 「ㄩ」尊降貴╱思想「ㄩ」腐
  - label: B
    content: 高瞻遠「ㄓㄨˇ」╱千叮萬「ㄓㄨˇ」
  - label: C
    content: 經「ㄧㄥˊ」公司╱電腦「ㄧㄥˊ」幕
  - label: D
    content: 綠野平「ㄔㄡˊ」╱討論範「ㄔㄡˊ」。
- id: doc_113_台北_仁愛_國文_g7s2e2_s4_3
  section: 4
  number: 3
  type: single
  page: 1
  stem: 麻糬喜歡冒險，但這次要選對答案才能登頂玉山，請大家幫他找出前後「字義」相同的選項：
  options:
  - label: A
    content: 我「望」著他走出去╱「望」車外看了看
  - label: B
    content: 他對妳一見「傾」心╱老師對學生總是「傾」囊相授
  - label: C
    content: 這份工作讓你有升「斗」之祿，生活暫無溫飽之虞╱感謝您來寒舍，讓我的「斗」室生輝
  - label: D
    content: 這對好朋友遇到困難時彼此相「濡」以沫╱番薯在美國讀大學，耳「濡」目染之下，英文愈說愈好了。
