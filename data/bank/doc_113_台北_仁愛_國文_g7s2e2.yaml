  - label: D
    content: 肉排中的水溶性蛋白質從60℃開始凝固，至65℃時因為膠原蛋白收縮，肉質富有彈性。
  group_stem: "蛋白質與牛排 \n【甲】 \n煎烤牛肉時所使用的肉排，其生肉的紅色是肌紅素的\n顏色。肌紅色是由含鐵的血紅素和蛋白質組成的，存在於\n\
    肌纖維細胞內的水中。肌紅素越多，肉的顏色越紅。 \n加熱之後，因為蛋白質發生變性作用，而且血紅色中\n的鐵被氧化，所以肉的顏色會逐漸轉為灰褐色，肌紅素的\n\
    熱變性是從65℃左右開始發生，72℃左右結束。肉的溫度\n升高至60℃左右時，肉質會先軟化，其後慢慢變硬，超過\n65℃左右後則急速變硬。這種變化的起因，是由於構成肌\n\
    肉的三種蛋白質遇熱時性質不同所引起的。 \n從56℃左右起，水溶性蛋白質開始凝固，像糨糊一樣\n將這些纖維狀蛋白質黏在一起，因此肉開始變硬。到了60℃\n\
    左右，水溶性蛋白質大致上凝固了，口感逐漸轉為酥脆。超\n過65℃之後，因為膠原蛋白產生收縮，肉就會急速變硬。 \n \n【乙】 \n此為一般餐廳牛排熟度對照表，其名稱與中心溫度之標準\
    \ \n| 名稱 | 中心溫度 | 煎法 | 肉質特色 |\n| --- | --- | --- | --- |\n| 1 分熟 | 52℃ | 兩面各2.5\
    \ 分鐘 | 內部75%為紅色 |\n| 3 分熟 | 57℃ | 兩面各3~4 分鐘 | 內部50%為紅色 |\n| 5 分熟 | 63℃ | 兩面各4\
    \ 分鐘 | 內部25%為紅色 |\n| 7 分熟 | 66℃ | 兩面各5 分鐘 | 內部為粉紅色 |\n| 全 熟 | 71℃ | 兩面各6 分鐘 |\
    \ 內部為灰褐色 |\n資料來源：網路"
- id: doc_113_台北_仁愛_國文_g7s2e2_s5_34
  section: 5
  number: 34
  type: single
  page: 4
  stem: 查理於牛排館點餐時，服務生詢問他對牛排熟度的要求，他的要求是：「肉排血紅色比例不超過50%、烹調總時間至少要8 分鐘。」依照他的標準，再對照乙的熟度表，請問下列哪一個熟度的牛排最適合他？
  options:
  - label: A
    content: 一分熟
  - label: B
    content: 三分熟
  - label: C
    content: 五分熟
  - label: D
    content: 七分熟。
  group_stem: "蛋白質與牛排 \n【甲】 \n煎烤牛肉時所使用的肉排，其生肉的紅色是肌紅素的\n顏色。肌紅色是由含鐵的血紅素和蛋白質組成的，存在於\n\
    肌纖維細胞內的水中。肌紅素越多，肉的顏色越紅。 \n加熱之後，因為蛋白質發生變性作用，而且血紅色中\n的鐵被氧化，所以肉的顏色會逐漸轉為灰褐色，肌紅素的\n\
    熱變性是從65℃左右開始發生，72℃左右結束。肉的溫度\n升高至60℃左右時，肉質會先軟化，其後慢慢變硬，超過\n65℃左右後則急速變硬。這種變化的起因，是由於構成肌\n\
    肉的三種蛋白質遇熱時性質不同所引起的。 \n從56℃左右起，水溶性蛋白質開始凝固，像糨糊一樣\n將這些纖維狀蛋白質黏在一起，因此肉開始變硬。到了60℃\n\
    左右，水溶性蛋白質大致上凝固了，口感逐漸轉為酥脆。超\n過65℃之後，因為膠原蛋白產生收縮，肉就會急速變硬。 \n \n【乙】 \n此為一般餐廳牛排熟度對照表，其名稱與中心溫度之標準\
    \ \n| 名稱 | 中心溫度 | 煎法 | 肉質特色 |\n| --- | --- | --- | --- |\n| 1 分熟 | 52℃ | 兩面各2.5\
    \ 分鐘 | 內部75%為紅色 |\n| 3 分熟 | 57℃ | 兩面各3~4 分鐘 | 內部50%為紅色 |\n| 5 分熟 | 63℃ | 兩面各4\
    \ 分鐘 | 內部25%為紅色 |\n| 7 分熟 | 66℃ | 兩面各5 分鐘 | 內部為粉紅色 |\n| 全 熟 | 71℃ | 兩面各6 分鐘 |\
    \ 內部為灰褐色 |\n資料來源：網路"
