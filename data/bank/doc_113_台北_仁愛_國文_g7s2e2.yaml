  section: 4
  number: 15
  type: single
  page: 2
  stem: 根據本詩，下列敘述何者錯誤？
  options:
  - label: A
    content: 引用「囊螢」的典故
  - label: B
    content: 認為螢火蟲是腐草所化
  - label: C
    content: 感嘆微弱的螢火無法跟大環境抗衡
  - label: D
