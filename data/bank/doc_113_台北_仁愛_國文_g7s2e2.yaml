- id: doc_113_台北_仁愛_國文_g7s2e2_s4_5
  section: 4
  number: 5
  type: single
  page: 1
  stem: 下列文句何者用字遣詞完全正確且邏輯通順？
  options:
  - label: A
    content: 服刑期滿後，這些歹徒不僅不知收斂，反而變本加厲，更加猖狂
  - label: B
    content: 敘利亞的內戰干戈不休，不知造成多少家庭妻離子散，巔沛流離
  - label: C
    content: 對於這種費力不討好的差事，別人都避之不及，而他卻甘之如貽
  - label: D
    content: 羅密歐與茱麗葉盼能化解雙方家族的仇恨，在力有未逮之下終於圓滿和解。
- id: doc_113_台北_仁愛_國文_g7s2e2_s4_6
  section: 4
  number: 6
  type: single
  page: 1
  stem: 下列關於〈背影〉一文的說明，何者正確？
  options:
  - label: A
    content: 全文透過兩次倒反法，刻劃父親的守舊與作者的自以為是
  - label: B
    content: 為了客觀呈現父愛的偉大，全文以第二人稱的角度書寫，詳實地紀錄買橘子的過程
  - label: C
    content: 本文以子女的立場，描述父親含蓄平實的慈愛、自身的感受，以及事後的自責追悔
  - label: D
    content: 文中運用了「紫毛大衣」、「黑布馬褂」、「朱紅的橘子」等意象來表達父愛的溫暖。
  lesson_raw:
    title: 背影
    basis: 題目引用〈背影〉
- id: doc_113_台北_仁愛_國文_g7s2e2_s4_7
  section: 4
  number: 7
  type: single
  page: 1
  stem: 「象徵」是指以具體的事物表達抽象的情感或思想，請問下列「象徵」的詞彙，何者詮釋正確？
  options:
  - label: A
    content: 願我們都能有「松竹梅」的精神，突破各個生命中的難關：衝勁
  - label: B
    content: 願莘莘學子都能有「駱駝」的精神，去面對生活中的大小事：堅忍
  - label: C
    content: 我們總是向外尋求「青鳥」，卻忘了其實「青鳥」就在身邊：愛情
  - label: D
    content: 戴著「黑布小帽」，穿著「深青布棉袍」：看到父親時作者煩悶的心情。
- id: doc_113_台北_仁愛_國文_g7s2e2_s4_8
  section: 4
  number: 8
  type: single
  page: 1
  stem: 關於〈聲音鐘〉一文的分析，下列何者正確？
  options:
  - label: A
    content: 全篇皆以第一人稱視角寫作，富真實感及親切感
  - label: B
    content: 叫賣聲各具旋律與生命力，展現人性與心情節奏
  - label: C
    content: 細膩地觀察聲音鐘於四季的更迭，憶及童年感受
  - label: D
    content: 聲音鐘恰如其分地回應人們的心情需求，給予情緒上的支持。
  lesson_raw:
    title: 聲音鐘
    basis: 題目引用〈聲音鐘〉
- id: doc_113_台北_仁愛_國文_g7s2e2_s4_9
  section: 4
  number: 9
  type: single
  page: 1
  stem: 破折號用於語意的轉變、聲音的延續，或補充說明某個詞語。以下選項中的破折號，何者是「補充說明」的用法？
  options:
  - label: A
    content: 嘎──吱──，老舊的木門被推開，伴隨著一陣濃厚的霉味與塵土飛揚
  - label: B
    content: 她姍姍來遲，比約定時間晚了整整一個小時──但帶了我最愛的蛋糕賠罪
  - label: C
    content: 我差點忘了繳交小組報告的期限──多虧同學及時提醒，才不至於耽誤進度
  - label: D
    content: 這時你就會強烈懷念起──譬如說，那推著手推車，一邊搖著鐵片罐子，一邊喊著「阿奇毛」的賣烤番薯的老頭了。
- id: doc_113_台北_仁愛_國文_g7s2e2_s4_10
  section: 4
  number: 10
  type: single
  page: 2
  stem: 〈背影〉一文中，作者對年輕時的自以為是感到愧疚，當時他對父親的言行與孟子說的「人之患在好為人師」相同，下列何者也是「好為人師」的表現？
  options:
  - label: A
    content: 索隆一向與人為善，卻有勇無謀，過於衝動
  - label: B
    content: 魯夫孤芳自賞，閉門造車，不願向師長求教
  - label: C
    content: 騙人布一心想超越他人，拚命想凌駕老師之上
  - label: D
    content: 香吉士驕傲不遜，喜歡指導別人，責怪他人的疏失。
  lesson_raw:
    title: 背影
    basis: 題目引用〈背影〉
- id: doc_113_台北_仁愛_國文_g7s2e2_s4_11
  section: 4
  number: 11
  type: single
  page: 2
  stem: 下列選項，何者未使用倒反法修辭？
  options:
  - label: A
    content: 你的身材穠纖合度，連相撲選手都要甘拜下風
  - label: B
    content: 我在她冷冰冰的表情裡，看見一雙熱烈的眼神
  - label: C
    content: 一到會場，我們就被她絕美的妝容嚇得魂飛魄散
  - label: D
    content: 馬克．吐溫：「戒菸有什麼難？我已經戒了一百多次了。」
- id: doc_113_台北_仁愛_國文_g7s2e2_s4_12
  section: 4
  number: 12
  type: single
  page: 2
  stem: 「委婉詞」是指不直接表述本意，而用較間接且含蓄的方式來表達的詞語。下列「」中的委婉詞，何者使用正確？
  options:
  - label: A
    content: 炭治郎從小就「失恃」，所以由母親一手帶大
  - label: B
    content: 經營十年的冰店，竟然要「待業」了，真令大家惋惜
  - label: C
    content: 畢業二十年後再相聚，大學同學們都「豐腴」了不少
  - label: D
    content: 外公過世，親友贈送「駕返瑤池」的輓聯，感念他一生勞苦功高。
- id: doc_113_台北_仁愛_國文_g7s2e2_s4_13
  section: 4
  number: 13
  type: single
  page: 2
  stem: 蔬菜海賊團逃亡到古語島，此地的居民說話必須用到古語。『 』內是海賊說的古代稱謂，請問何者運用正確？
  options:
  - label: A
    content: 胡蘿蔔：「聽說昨夜島上發生命案，官府找『細作』去驗屍了。」
  - label: B
    content: 青江菜：「那我們說話得小心點，免得被衙門的『小廝』抓去盤查。」
  - label: C
    content: 馬鈴薯：「你們別太擔心啦！先去前面那家『私塾』休息，填飽肚子再說。」
  - label: D
    content: 高麗菜：「店小二，先上三斤牛肉一壺酒，再叫『庖丁』燒兩道下酒菜。」
- id: doc_113_台北_仁愛_國文_g7s2e2_s4_14
  section: 4
  number: 14
  type: single
  page: 2
  stem: 〈今夜看螢去〉一文中：「雖然只是那一小點光亮，卻讓人彷彿有了一燈相照的感覺。」上述提到的感覺是？
  options:
  - label: A
    content: 珍惜螢火蟲給予的溫暖與心靈契合
  - label: B
    content: 讚美螢火蟲弱質蕙心，應得到善待
  - label: C
    content: 跌到人生谷底，卻看見希望的歡欣
  - label: D
    content: 從一燈溫馨喚起對滿天星輝的懷念。
  lesson_raw:
    title: 今夜看螢去
    basis: 題目引用〈今夜看螢去〉
