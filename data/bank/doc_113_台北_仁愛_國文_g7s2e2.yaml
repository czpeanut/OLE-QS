  group_stem: '近幾年興起的虛擬貨幣──比特幣，引發不少討論。

    去中心化，是比特幣的重要特性，其與實體貨幣相反，沒

    有中央銀行負責貨幣的發行管道，因而能減少國家或機構

    的干預。但也因其去中心化的特性，並沒有銀行或第三方

    可以協助退款事宜，完成的交易無法進行回溯。此外，每

    個比特幣的錢包（帳戶）是由一串代碼組成，不具個人識

    別資訊，也無法調取信用紀錄、居住地址，與實體貨幣帳

    戶形成對比。'
