- id: doc_112_桃園_石門_國文_g7s1e2_s4_9
  section: 4
  number: 9
  type: single
  page: 1
  stem: '昀恩同學運用工具書檢索了「爨」字，得到以下資訊。關於資訊的解讀及應用，何者正確？

    | 字詞 | 爨 [火部-25 畫-共29 畫] |

    | --- | --- |

    | 注音 | ㄘㄨㄢˋ |

    | 釋義 | 動詞 以火燒煮食物。《左傳‧宣公十五年》：「易子而食，析骸以爨。」晉‧杜預‧注：「爨，炊也。」<br>名詞 爐灶。《周禮‧天官冢宰‧亨人》：「職外內饔之爨亨煮，辦膳羞之物。」漢‧鄭玄‧注：「爨，今之灶。」
    |'
  options:
  - label: A
    content: 爨字的部首為火，總筆畫為25 畫
  - label: B
    content: 爨字當動詞使用時，可用「灶」字替換
  - label: C
    content: 爨字當名詞與動詞使用時，讀音有別
  - label: D
    content: 「炊金爨玉」意指以珍貴的飲食待客，此處「爨」字為動詞。
  answer:
  - 吸「吮」
  tags:
    textbook: 七上 語文常識(二) 閱讀導航——策略運用與資訊檢索
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 七上
      subject: 國文
      code: 語文常識(二)
      title: 閱讀導航——策略運用與資訊檢索
      chapter: null
- id: doc_112_桃園_石門_國文_g7s1e2_s4_10
  section: 4
  number: 10
  type: single
  page: 2
  stem: '筱涵同學運用工具書檢索了成語「義憤填膺」，得到以下資訊。關於資訊的解讀，何者有誤？

    | 注音 | ㄧˋ ㄈㄣˋ ㄊㄧㄢˊ ㄧㄥ |

    | --- | --- |

    | 釋義 | 「義憤」，出於正義的憤怒。語出《後漢書‧卷八三‧逸民列傳‧序》，「漢室中微，王莽篡位，士之蘊藉，義憤甚矣。」敘述西漢末年時，王莽篡位，士人內心都充滿了正義的憤怒，卻無法表達出來。「填膺」，填滿胸中。語出唐‧高適〈餞宋八充彭中丞判官之嶺南〉詩，「睹君濟時略，使我氣填膺。」這是唐代詩人高適替朋友寫的餞別詩的其中兩句，敘述從前看到朋友有才能卻不受重用，一直為他感到委屈。後來這兩個詞語被合用成「義憤填膺」，指胸中充滿因正義而激起的憤怒。
    |

    | 例句 | 1.對於歹徒殘暴的行徑，每個人都義憤填膺，咬牙切齒。<br>2.對於法院的不公判決，被害者家屬都感到義憤填膺，決定抗爭到底。 |'
  options:
  - label: A
    content: 從例句可得知「義憤填膺」的古今意涵有明顯差異
  - label: B
    content: 「義憤」的典故與王莽篡位的史實密切相關
  - label: C
    content: 從釋義可得知「義憤」和「填膺」二詞的出處不同
  - label: D
    content: 從釋義可獲取「義憤填膺」出處的文言語句。
  answer:
  - 「躊」躇
  tags:
    textbook: 七上 語文常識(二) 閱讀導航——策略運用與資訊檢索
