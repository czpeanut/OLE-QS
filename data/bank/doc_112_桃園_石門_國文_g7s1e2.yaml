  section: 5
  number: 27
  type: single
  page: 5
  stem: 本文描寫的對象是烏龜，依序呈現了關於烏龜的哪些要點呢？
  options:
  - label: A
    content: 最喜歡的食物／曬日光浴的方式／曬日光浴的潛藏危機／解危為安後品嚐鷹肉
  - label: B
    content: 解危為安後品嚐鷹肉／最喜歡的食物／曬日光浴的潛藏危機／曬日光浴的方式
  - label: C
    content: 曬日光浴的方式／曬日光浴的潛藏危機／解危為安後品嚐鷹肉／最喜歡的食物
  - label: D
    content: 曬日光浴的潛藏危機／解危為安後品嚐鷹肉／最喜歡的食物／曬日光浴的方式。
  group_stem: '烏龜屬於雜食動物，食茶蔬，也食穀物，還食肉類。烏龜最愛吃的肉是鷹肉。嘴裡寡淡的時候，烏龜就在河邊曬太陽。鳥龜曬太陽，跟別的動物不同，別的動物是趴在地上曬後背，牠卻是四腳朝天曬肚皮。其實，烏龜這樣曬太陽是非常危險的，天敵來襲之時，且不說逃跑不容易，就是把自己翻過來也要耗費一定時間，即便全速逃遁，恐怕也來不及。

    而這個天敵，往往就是鷹。

    烏龜曬肚皮時，會反射出白亮亮的光，很容易就被空中覓食的鷹發現。鷹於是閃電一般俯衝下來，叼住烏龜的頭。瞬間，烏龜的頭就欻的一下縮進鎧甲裡。鷹嘴就被烏龜的鎧甲鉗住了，這使鷹疼痛難忍。然而，到嘴的肉是絕對不能放棄的，鷹抖動翅膀叼著烏龜起飛了。空中，鷹的翅膀下，烏龜悠悠蕩蕩。鳥龜慢慢調整自己，將藏在鎧甲裡的尾巴伸出來，捲曲著，用尾尖一下一下刺鷹的腹部，然後用尾巴的側面咔哧咔哧地鋸鷹脖子上的肉。原來，烏龜的尾巴上是有鋸齒的！

    烏龜會算好時間，在落地的那一刻把鷹脖子上的氣管鋸斷。鷹一命鳴呼了，鳥龜也在瞬間安全著陸了。鳥龜伸出頭來，眨眨眼睛，睨一眼四周，張開嘴巴便不緊不慢地開始享用美味了。

    □□／李青松'
  tags:
    textbook: 七上 自學課一 神話與寓言選(1)夸父逐日(2)濫竽充數
