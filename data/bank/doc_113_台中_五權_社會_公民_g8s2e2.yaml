questions:
- id: doc_113_台中_五權_社會_公民_g8s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 大邱騎機車上學時，因趕時間而以時速70 公里行駛於限速50 公里的市區道路。雖然他並未造成交通事故，但仍被開罰單。請問他的行為屬於以下哪一類？
  options:
  - label: A
    content: 違法且構成犯罪
  - label: B
    content: 僅屬違法行為，不構成犯罪
  - label: C
    content: 不違法也不犯罪
  - label: D
    content: 屬於民事責任，不涉及法律
- id: doc_113_台中_五權_社會_公民_g8s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 23 歲的櫻木犯下強盜罪後，小他4 歲的女朋友晴子多次幫助他躲過警察的追捕(藏匿人犯罪)。如果他們兩個被捕後，將會受到什麼制裁？
  options:
  - label: A
    content: 櫻木減輕刑責，晴子不用罰
  - label: B
    content: 櫻木要負完全的刑事責任，晴子可以減輕刑責
  - label: C
    content: 櫻木不用罰，晴子要負完全的刑責
  - label: D
    content: 兩個人都得負完全的刑事責任
- id: doc_113_台中_五權_社會_公民_g8s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 法官及檢察官皆是通過「司法官特考」後受訓產生，統稱為「司法官」，但法官、檢察官的角色不同，下列敘述何者正確？
  options:
  - label: A
    content: 兩者皆屬司法院管轄
  - label: B
    content: 法官確定犯罪事實後代表國家提起公訴
  - label: C
    content: 法官是以第三者的地位進行客觀的審判
  - label: D
    content: 法官判決確定後也要指揮執行該判決
- id: doc_113_台中_五權_社會_公民_g8s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '在刑事訴訟程序中，法定職權機關會受理相關人員所提的各種之訴，而下表哪幾項各種之訴的法定受理職權機關為司法機關？


    | 自訴 | 甲機關 |

    | :--- | :--- |

    | 告訴 | 乙機關 |

    | 告發 | 丙機關 |

    | 公訴 | 丁機關 |'
  options:
  - label: A
    content: 甲丁
  - label: B
    content: 乙丁
  - label: C
    content: 乙丙
  - label: D
    content: 甲乙丁
- id: doc_113_台中_五權_社會_公民_g8s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 我國為防範酒後駕車，曾多次修法提高酒駕罰則。根據我國憲法中「罪刑法定原則」的精神，下列哪一項敘述正確？
  options:
  - label: A
    content: 酒駕造成傷亡，即使當時法律沒有規定刑責，法院仍可依社會觀感判刑
  - label: B
    content: 為了嚇阻酒駕，警察可逕行將所有酒駕者處以徒刑，無需依法律規定
  - label: C
    content: 修法前發生的酒駕行為，應適用修法後較重的處罰，以符合正義
  - label: D
    content: 只有在法律事先明確規定該行為為犯罪並處罰者，法院才可處以刑罰
- id: doc_113_台中_五權_社會_公民_g8s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 國中公民課在課堂上討論「酒駕致死」議題，同學們意見分歧。喬治認為提高刑罰可以讓社會大眾忌憚而減少犯罪，瑪莉則認為必須要提供受刑之酒精成癮者酒癮戒斷治療，這兩人分別反映了刑罰的哪兩種目的？
  options:
  - label: A
    content: 處罰與矯正
  - label: B
    content: 矯正與獎賞
  - label: C
    content: 處罰與預防
  - label: D
    content: 預防與矯正
- id: doc_113_台中_五權_社會_公民_g8s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 法學名言：「一個人在未定罪之前，都是無辜的。」這個無罪推定原則，是維護基本人權的重要觀念。依此推斷，下列何者為法律上認定的「有罪之人」？
  options:
  - label: A
    content: 有竊盜嫌疑而被警察逮捕者
  - label: B
    content: 拒絕到案說明被法院通緝者
  - label: C
    content: 被法院判決違反《刑法》的人
  - label: D
    content: 被報紙報導為嫌疑犯的人
- id: doc_113_台中_五權_社會_公民_g8s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 以下各種處罰方式：(甲)死刑 (乙)無期徒刑 (丙)有期徒刑 (丁)拘留 (戊)拘役。哪些在性質上是屬於剝奪犯罪者自由的處罰？
  options:
  - label: A
    content: 甲戊
  - label: B
    content: 乙丙戊
  - label: C
    content: 乙丙丁
  - label: D
    content: 乙丙丁戊
- id: doc_113_台中_五權_社會_公民_g8s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 胖虎家所養的比特犬未栓好，衝出院子咬傷恰好從旁經過的大雄，大雄憤而到檢察署按鈴申告，請求依法判處胖虎刑罰。大雄的行為在刑事訴訟上稱為什麼？
  options:
  - label: A
    content: 告訴
  - label: B
    content: 自首
  - label: C
    content: 自訴
  - label: D
    content: 公訴
- id: doc_113_台中_五權_社會_公民_g8s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 下列為同學在做公民報告時蒐集的新聞素材，請問哪位同學書寫的標題完全正確？
  options:
  - label: A
    content: 13 歲少年偷同學腳踏車，不受刑罰制裁
  - label: B
    content: 法官指揮警察做大規模搜索偵查
  - label: C
    content: 警察製完筆錄直接將現行犯移送法院審理
  - label: D
    content: 冷血殺人犯，檢察官作出有罪判決
- id: doc_113_台中_五權_社會_公民_g8s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 「一名83 歲的王姓老翁，不忍80 歲的老伴罹患帕金森斯症又摔斷腿，飽受病痛折磨，竟然以榔頭重擊妻子頭部，造成妻子當場死亡，王姓老翁隨即報警自首…」關於這則新聞若依我國《刑法》規定，下列敘述何者正確？
  options:
  - label: A
    content: 該名老翁年事已高，不得用刑法處罰他
  - label: B
    content: 老翁為完全責任能力人，須負刑責
  - label: C
    content: 該名老翁犯殺人罪 ，但可能可以減輕其刑
  - label: D
    content: 該名老翁若為瘖啞人，則可免責
- id: doc_113_台中_五權_社會_公民_g8s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 《刑法》除了以「年齡」作為責任能力的區分標準外，下列何者也被用來判斷一個人是否具有是非判斷的能力？
  options:
  - label: A
    content: 工作性質
  - label: B
    content: 精神狀態
  - label: C
    content: 教育程度
  - label: D
    content: 財富多寡
- id: doc_113_台中_五權_社會_公民_g8s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 彼得在班上散播謠言，說同學帕克曾經偷錢，導致帕克被其他同學孤立。帕克根本沒有做這件事，因而感到非常委屈與憤怒。請問：依我國法律，若帕克希望彼得為此事負法律責任，下列哪一項最適合他採取的行動？
  options:
  - label: A
    content: 老師通知家長後，警察會主動介入處理
  - label: B
    content: 這屬於誹謗罪，必須由帕克或其監護人提出告訴
  - label: C
    content: 只要學校調查後認定有錯，警方可直接立案
  - label: D
    content: 這屬於非告訴乃論罪，警察會主動偵辦
- id: doc_113_台中_五權_社會_公民_g8s2e2_s2_14
  section: 2
  number: 14
  type: single
  page: 1
  stem: 請問：丁階段的執行是由何人負責指揮執行判決結果？
  options:
  - label: A
    content: 法官
  - label: B
    content: 律師
  - label: C
    content: 警察
  - label: D
    content: 檢察官
