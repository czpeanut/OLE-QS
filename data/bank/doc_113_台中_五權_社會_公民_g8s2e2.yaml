- id: doc_113_台中_五權_社會_公民_g8s2e2_s2_16
  section: 2
  number: 16
  type: single
  page: 1
  stem: 劇中的警官可能會出現下列哪一種行為？
  options:
  - label: A
    content: 接受當事人委託進行訴訟辯護
  - label: B
    content: 擔任訴訟的原告起訴犯罪行為
  - label: C
    content: 接受檢察官指揮協助搜索住宅
  - label: D
    content: 犯罪事實未被發現前先行承認
