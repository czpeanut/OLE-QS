  section: 2
  number: 15
  type: single
  page: 1
  stem: 「名偵探柯南」是知名的動畫，主角柯南等人經常被捲入重大案件中，並協助劇中的警官辦案。上述劇情發生於刑事訴訟的哪一個階段？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
  group_stem: 《刑法》可視為治安的基石，下圖是刑事訴訟的流程，請根據此圖回答以下問題：
