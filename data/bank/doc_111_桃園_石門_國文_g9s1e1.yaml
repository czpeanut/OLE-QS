- id: doc_111_桃園_石門_國文_g9s1e1_s5_28
  section: 5
  number: 28
  type: single
  page: 5
  stem: "依據文章內容，文中四個挖空處依序應填入的文句為何？\n\n甲、設法讓所有人都負擔得起永續食品          乙、如何兼顧食物的健康、營養和美味\
    \           \n丙、克服氣候與地區限制，在各地大量種植作物  丁、建立能在一年四季提供多種選擇的糧食系統"
  options:
  - label: A
    content: 甲丙丁乙
  - label: B
    content: 丁乙甲丙
  - label: C
    content: 丙乙甲丁
  - label: D
    content: 乙丁丙甲。
  group_stem: '（三）

    目前全球營養不良的人數目前已比二○一四年時增加近六千萬人，原因是農業產量的成長趨緩，且氣候變遷、生物多樣性喪失和病蟲害問題影響糧食供應。

    專家指出，全球糧食系統有待另一次大幅革新，才能趨於完美，進而打造「糧食烏托邦」，確保食物充足、永續、營養豐富且價格合理；是否能在未來三十年實現這個夢想，則取決於五大關鍵要素。

    第一項要素是環保，新一代農民放棄傳統耕作方式，轉向採用尖端生物技術的再生農業，包括使用天然溶液保持土地肥沃，並針對不同的根系和植物高度精心挑選作物，創造一種人工生態系統。這些新技術不僅環保，且不會導致產能減少。

    其次，＿＿＿＿＿＿＿＿＿，透過育種、儲存和加工，一些作物已可全年供應。此外，人們也需調整在地食材比較永續的觀念，因為食品的總碳足跡中，只有不到百分之六來自運輸；在提供恆溫、照明的溫室中種植番茄，產生的碳足跡多於進口。

    第三項要素，則是＿＿＿＿＿＿＿＿＿。例如：英國農民會把硒噴灑在土壤上，補充這種不存在於土壤中的營養成分，使食物更美味，可提高消費量；若能化解基因改造技術的爭議，培育營養素更多、風味更好的食物，將能鼓勵人們選擇原本不考慮的食物，讓營養攝取更均衡。

    第四個要素，是＿＿＿＿＿＿＿＿＿。糧食貧困已成為國際問題，甚至在新冠疫情衝擊民眾收入、打亂供應鏈之前就已日益嚴重。改善糧食系統的關鍵問題之一，是解決不平等的狀況，提升糧食的可獲取性和平等，讓食物變得更實惠，也讓較貧困的居民獲得更健康、更優質的食物。

    第五個要素，是＿＿＿＿＿＿＿＿＿。隨著農業科技的進步，許多地方已開始採用新的技術提高產量、應對氣候變遷並進行永續發展。以精準農業為例，這項技術使用無人機、衛星和全球定位（GPS）等技術來繪製田野狀況，並精確計算土地需要的養分或其他農業添加劑，幫助農民提升耕作效率，且能減少對環境的負面衝擊。

    節錄改寫自  掌握5 大元素 開創糧食烏托邦／潘楠慕（出處：人間福報2022.04.03）'
