  - label: B
    content: 【乙】：污染的數據未公開透明，污染危害如幽魂無所不在
  - label: C
    content: 【丙】：遠方有戰事，此處也將面臨戰火的威脅
  - label: D
    content: 【丁】：污染受害者屬於弱勢的一群，無力為自己發聲、爭取權益。
  group_stem: '（一）

    日照下，【甲】每一戶人家的三合院／都噤默在無聲的汙染中

    偶有摩托車緩慢穿過／在河堤邊，留下一個老農的身影／他已老去，然而他仍死守／死守這個孤寂的村莊

    濁水溪記錄下他的名姓／他的臉孔，朝向河床／隔岸三公里外。【乙】死亡／化作酸雨，化作種種不見天日的數據／悄悄然幽魂般穿梭，穿梭……／每一戶人家的三合院

    這裡是哪裡？無人聞問的街道／偶有一班午後的公路局／空洞地駛近，小廟前／數著荒涼的乘客

    這裡是哪裡？打開手機／【丙】遠方傳來加薩走廊的戰事／兒童的殘肢與鮮血／從來抵抗著侵略者的飛彈

    然而，這裡又是哪裡？／一戶一戶垮掉的磚瓦與危牆／一名又一名，因癌症而過世的長者／【丁】無聲，已經變成他們唯一的抵抗

