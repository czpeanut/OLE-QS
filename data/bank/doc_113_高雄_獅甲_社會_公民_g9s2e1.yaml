- id: doc_113_高雄_獅甲_社會_公民_g9s2e1_s1_48
  section: 1
  number: 48
  type: single
  page: 2
  stem: 二戰時，日本將廣播系統作為政府宣傳工具，連兒童節目也將愛國思想編寫進去；戰後，通過《放送法》，讓公共的廣播電視系統不受財政來源影響，確保其超然立場，因此，要求全國民眾一起投資公共媒體，也就是從人民口袋提取收視費用，正因為如此，NHK
    迄今可以製作大量優質的內容，其深度及廣度已非其他商業電視臺可以競爭。有關日本媒體的演變歷史，何項敘述正確？
  options:
  - label: A
    content: 戰後公共媒體的節目，避免出現特定立場
  - label: B
    content: 現在所有的商業電視臺，都有能力作平衡報導
  - label: C
    content: 二戰時的兒童節目，展現媒體接近使用權
  - label: D
    content: 收看NHK 時，閱聽人不須具備媒體識讀能力
- id: doc_113_高雄_獅甲_社會_公民_g9s2e1_s1_49
  section: 1
  number: 49
  type: single
  page: 2
  stem: PeoPo 公民新聞是公視成立的公民新聞平台，也是第一個公民自主影音平台新聞，透過平台公民可以分享自己的專業領域與知識，透過網路媒體發表意見，採訪製作新聞，創造社會議題，凝聚社會行動力，這一作法有助於維護人民的哪一項權利？
  options:
  - label: A
    content: 著作權
  - label: B
    content: 受益權
  - label: C
    content: 媒體接近使用權
  - label: D
    content: 隱私權
