- id: doc_113_高雄_獅甲_社會_公民_g9s2e1_s1_35
  section: 1
  number: 35
  type: single
  page: 1
  stem: 某政治人物日前赴喪禮，遵循當地習俗摔筆以示哀悼，該行為被人錄下後剪輯，註明「殉職員警的會場，你不願意就別來，拽什麼拽，簽完名字，筆還用丟的」，並在網路上瘋傳。該政治人物解釋當時並非參與殉職員警的喪禮，且摔筆亦非不尊重，因此向警察機關檢舉，處罰製作影片的當事人1,000元罰款。若從媒體識讀的角度來解釋上述新聞內容，則下列說明何者正確？
  options:
  - label: A
    content: 該新聞呈現事實與意見並存的狀況
  - label: B
    content: 該影片顯示媒體存在著隱藏性歧視
  - label: C
    content: 閱聽人應秉持懷疑精神並積極查證
  - label: D
    content: 影片接受廠商贊助而有廣告的嫌疑
- id: doc_113_高雄_獅甲_社會_公民_g9s2e1_s1_36
  section: 1
  number: 36
  type: single
  page: 1
  stem: 近年甲國新聞中常見關於殺人案件的報導，許多人因而認為治安不斷惡化，要求主管機關首長下臺負責。曉晴想探究該國社會治安情況，在網路上搜尋到的資料如圖（一），圖
    （一）中顯示甲國近年殺人案件數，以及用「殺人」為關鍵詞搜尋國內網路新聞的搜尋結果數。根據上述內容判斷，下列何者最可能是他探究的結論？
  options:
  - label: A
    content: 媒體與社群網路的報導內容會影響公共意見方向
  - label: B
    content: 閱聽大眾喜好常會影響新聞媒體產業的企業收入
  - label: C
    content: 公共意見雖經過反覆討論但形成後仍具有變動性
  - label: D
    content: 社會治安不斷惡化顯示媒體未善盡監督政府責任
  assets:
  - key: s1_36_f1
    kind: figure
    file: doc_113_高雄_獅甲_社會_公民_g9s2e1/s1_36_f1.png
- id: doc_113_高雄_獅甲_社會_公民_g9s2e1_s1_37
  section: 1
  number: 37
  type: single
  page: 1
  stem: 嘉宜喜歡透過觀看最新的電視影集來紓壓，他為了讓網友追上播出的進度，一起討論劇情發展，因此將已收看並付費的影集檔案下載至電腦，再利用分享軟體免費提供給有需要的網友觀看，近期他因為此行為收到法院的起訴書，但他認為自己的行為屬於合理使用，並未觸法。請問：嘉宜的說法是否能夠成立？
  options:
  - label: A
    content: 能成立，他已經有支付電視影集的費用了
  - label: B
    content: 不能成立，此舉將影響到影集潛在的市場
  - label: C
    content: 能成立，影集將吸引更多民眾關注並了解
  - label: D
    content: 不能成立，私人利益無法調和為公共利益
- id: doc_113_高雄_獅甲_社會_公民_g9s2e1_s1_38
  section: 1
  number: 38
  type: single
  page: 1
  stem: 在警政署的統計數據中，網購詐騙比例高。詐騙集團在網站張貼不實資訊、盜用商品頁面供買家下單，或者隨機寄送劣質、未購買的商品給買家，導致買家受騙。下列敘述，何者最能呼應上文？
  options:
  - label: A
    content: 民眾可能轉發錯誤的網路資訊，讓不實訊息流傳
  - label: B
    content: 網購詐騙問題可能導致消費者隱私權遭受到侵害
  - label: C
    content: 網路詐騙使消費者對網購的信賴度產生負面影響
  - label: D
    content: 五花八門的廣告，使得網路購物的比率大幅下降
- id: doc_113_高雄_獅甲_社會_公民_g9s2e1_s1_39
  section: 1
  number: 39
  type: single
  page: 1
  stem: 被譽為新一代「天才小畫家」的加州小男孩安德烈，年僅10 歲就無師自通，他的畫作隱藏著精湛的技巧，和深刻的哲學意義，在舉辦個人首秀時，作品因大受好評，他將畫展部分收入捐給基金會，希望幫助更多的青少年，完成他們的藝術夢想。他在舉辦畫展時，哪一項與著作權法律相關的敘述正確？
  options:
  - label: A
    content: 該創作受到商標權保障，侵權將受到法律追究
  - label: B
    content: 舉辦畫展前，需先將畫作註冊才能進行販售
  - label: C
    content: 舉辦畫展屬於合理使用範圍，因此可不經告知、不須標示，利用他人畫作辦展進行募款
  - label: D
    content: 作品完成時，著作人即可享受創作帶來的利益
