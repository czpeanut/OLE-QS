- id: doc_113_高雄_獅甲_社會_公民_g9s2e1_s1_43
  section: 1
  number: 43
  type: single
  page: 2
  stem: 某國因宗教信仰保守，女性無法在公開場合詢問他人問題，因此有一名女性用自己的社群平臺帳號，邀請其他女性把煩惱私下寄給她，她再將這些煩惱貼出，並請網友幫忙給意見，她的帳號就成了網友匿名交換意見的平臺。她表示，近期收到數量驚人的網友回覆，而且每一篇貼文都會固定有數千個讚和留言。從這位女性的做法，可看出她帶來了什麼樣的改變？
  options:
  - label: A
    content: 擔任公民記者，揭發主流媒體忽視的社會議題
  - label: B
    content: 透過網路，彌補無法親自參與社會運動的遺憾
  - label: C
    content: 建置意見交流的平臺，促成議題的關注與討論
  - label: D
    content: 自製節目，分享自己遭遇的困境與改變的歷程
- id: doc_113_高雄_獅甲_社會_公民_g9s2e1_s1_44
  section: 1
  number: 44
  type: single
  page: 2
  stem: '以下是獅甲電子新聞報的部分內容，根據判斷，這篇文章主要是在提醒我們重視何項議題？


    為改善社群媒體上充斥仇恨言論、網路霸凌和言語騷擾的問題，IG 官方宣布增設反霸凌功能，以人工智慧偵測惡意文字，自動提醒用戶留言前三思，並增加「隱藏文字」的功能，協助過濾掉私訊中用戶不想看到的詞語或是表情符號，縮小霸凌言論的傷害性。然而，要制止網路霸凌的現象，光是透過制度面的法律是不夠的，最根本的解決方法，還是需要靠使用者自律，在發言之前多思考一下，不要無意間成為網路霸凌的加害者。'
  options:
  - label: A
    content: 傳播媒體的自由
  - label: B
    content: 科技倫理的建立
  - label: C
    content: 智慧財產的保障
  - label: D
    content: 資訊科技的革新。
