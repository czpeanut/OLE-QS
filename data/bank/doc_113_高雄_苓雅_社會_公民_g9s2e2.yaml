  section: 1
  number: 58
  type: single
  page: 2
  stem: 對於文中提到的兩種法律，下列相關敘述何者正確？
  options:
  - label: A
    content: 《老年農民福利津貼暫行條例》與前者屬於相同法律位階
  - label: B
    content: 後者是行政機關授權所制定的法規命令，故須配合前者修正
  - label: C
    content: 皆須經立法院通過，前者總統公布，後者教育部發布才生效
  - label: D
    content: 後者條文內容若有牴觸前者，由立法院解釋後，後者內容無效
  group_stem: 日前立法院通過《特殊教育法》修法，五年內擬大幅增補人力、改善師生比，以解決教學現場人力不足的問題。如此一來，教育部也忙修正發布《特殊教育學生及幼兒鑑定辦法》以因應，因此各縣市都忙著招考特教老師。<u>臺南市教育局盤點後，估計全部達標要增加三百位特教老師，每人每年預算約7、80
    萬元，總共2.4 億元</u>，預算負擔重，因此希望教育部能在財政上給予地方政府補助，也希望放寬期程。教育部表示會協助，增補過程中也將確保師培的質量。教育部長表示，有這麼多老師要到位並不容易，特別是偏鄉師資延攬更為不易，會在經費上優先支持。
