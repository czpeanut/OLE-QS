- id: doc_113_高雄_苓雅_社會_公民_g9s2e2_s1_47
  section: 1
  number: 47
  type: single
  page: 1
  stem: '夏季是臺灣用電尖峰，臺電根據用電量分級制定不同的電價，2024 年每度電的價格如下表。請問：下列何者最能說明臺電策略的意涵？


    | 每月用電度數分級 | 夏月 | 非夏月 |

    | :--- | :---: | :---: | :---: |

    | 住宅用 | 120 度以下部分 每度 | 1.68 | 1.68 |

    | 住宅用 | 121～330 度部分 每度 | 2.54 | 2.16 |

    | 住宅用 | 331～500 度部分 每度 | 3.70 | 3.03 |

    | 住宅用 | 501～700 度部分 每度 | 5.04 | 4.14 |

    | 住宅用 | 701～1000 度部分 每度 | 6.24 | 5.07 |

    | 住宅用 | 1001 度以上部分 每度 | 8.46 | 6.63 |'
  options:
  - label: A
    content: 透過價格誘因，改變消費者消費行為
  - label: B
