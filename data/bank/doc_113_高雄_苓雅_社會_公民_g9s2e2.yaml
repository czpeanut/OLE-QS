- id: doc_113_高雄_苓雅_社會_公民_g9s2e2_s1_48
  section: 1
  number: 48
  type: single
  page: 1
  stem: '西元2023 年因調整連續假期導致補班日太多。人事總處表示，連續假期有助紓解工作壓力、增進內需市場，但對於部分民眾的反映，蒐集多方意見如下圖，作為日後研修參據。請問：關於上述內容判斷，下列何者最符合題意？


    ◇ 「為了連續假期，讓大家補班，其實是一個愚蠢的想法，這會形成一個特殊現象，假是放了，但補上班，恐讓大家意興闌珊，工作效率大打折扣。」

    ◇ 「應按照行事曆去走就好，經常調整休假天數，會打亂相關產業做國際市場的整體腳步，也讓很多人在連假時，外出旅遊擠成一團，出去的塞車，不出去的就躲在家裡，並沒有達到連假促進消費的目的。」'
  options:
  - label: A
    content: 公共意見形成之後會影響政府政策
  - label: B
    content: 公共意見會隨時空環境影響而改變
  - label: C
    content: 蒐集民意時，應發揮媒體專業倫理
  - label: D
    content: 訊息若未經查證，容易誤導閱聽人
  tags:
    chapter:
      publisher: 南一
      book: 九下
      subject: 公民
      code: 4-1
      title: 媒體與社群網路如何形成公共意見？
      chapter: null
    textbook: 九下公民 4-1 媒體與社群網路如何形成公共意見？
    labeled_by: ai
