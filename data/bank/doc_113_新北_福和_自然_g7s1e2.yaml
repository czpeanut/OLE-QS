  section: 1
  number: 7
  type: single
  page: 1
  stem: 光合作用的主要產物為氧氣、水和「甲物質」。關於甲物質的敘述，下列何者錯誤？
  options:
  - label: A
    content: 植物可將甲物質轉換成纖維素
  - label: B
