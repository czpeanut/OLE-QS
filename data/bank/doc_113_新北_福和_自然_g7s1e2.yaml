  - label: C
    content: 三高（高血壓、高血糖、高血脂）、吸煙與寒冷的天氣，都可能提高心絞痛或心肌梗塞的風險
  - label: D
    content: 冠狀動脈中應有瓣膜阻止血液倒流。
