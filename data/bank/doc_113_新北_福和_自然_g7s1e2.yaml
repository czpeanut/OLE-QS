- id: doc_113_新北_福和_自然_g7s1e2_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: '筱欣在甲、乙、丙三個相同的量筒內各插入一枝帶有葉片及粗細相近的芹菜，再加水至液面達到 10 mL 的刻度處，接著摘除乙量筒芹菜的所有葉片，並把甲乙兩個量筒放在室內陰暗通風處，丙量筒放在室內燈光照射通風處，每
    10 分鐘記錄一次液面的讀數，結果如表。筱欣的實驗結果可支持下列哪一敘述？


    | 經過時間（分鐘） | 0 | 10 | 20 | 30 |

    | :--- | :--- | :--- | :--- | :--- |

    | 甲量筒液面讀數（mL） | 10.0 | 8.3 | 7.1 | 6.5 |

    | 乙量筒液面讀數（mL） | 10.0 | 9.9 | 9.8 | 9.7 |

    | 丙量筒液面讀數（mL） | 10.0 | 8.1 | 6.2 | 4.3 |'
  options:
  - label: A
    content: 植物的生長需要通風
  - label: B
    content: 植物行光合作用需要光
  - label: C
    content: 植物水分散失與葉片無關
  - label: D
    content: 光照會加速植物體內水分蒸散的速率。3-1
