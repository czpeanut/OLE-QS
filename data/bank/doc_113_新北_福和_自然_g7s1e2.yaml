  type: single
  page: 1
  stem: '由下列選項中，選出與「測定光合作用產物」有關的五項實驗操作，並排出正確順序。

    (甲)葉片在熱水中漂洗；(乙)加亞甲藍液；(丙)加碘液；(丁)葉片在沸水中加熱；(戊)葉片在酒精中隔水加熱；

    (己)在本氏液中隔水加熱；(庚)利用鋁箔紙將葉片整個包覆起來；(辛)利用鋁箔紙將部分葉片包覆起來。'
