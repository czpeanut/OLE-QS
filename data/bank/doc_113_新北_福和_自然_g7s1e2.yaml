  - label: D
    content: 上消化道內視鏡切片
  group_stem: "(一)胃癌由於早期症狀不明顯，易被輕忽，臺大醫院胃腸肝膽科主治醫師李宜家表示，約80%胃癌是幽門螺旋桿菌(一種細菌)所致，其餘與吸菸、吃重鹹、醃漬食物等因素有關，建議多吃蔬果，保持運動習慣，減少共杯、共食等行為，才能有效預防罹癌。\n\
    \    李宜家指出，許多國家透過早期發現、消除危險因子、癌症治療等方法來降低癌症死亡率，但早期胃癌症狀不明顯，類似胃食道逆流、潰瘍等常見消化系統疾病，不像大腸癌的血便來得容易辨識。許多研究指出，幽門桿菌是胃癌的危險因子，藉由社區篩檢，接受抗生素除菌治療，就可降低發炎與癌變等風險。\n\
    \    李宜家指出，臺灣胃癌預防發展史分為創始期、開始期、整合期、擴展期，其中2018 年後的「擴展期」，也在國健署指導的偏鄉篩檢下於55 個原鄉建立教育與資訊系統，且衛福部今年8\
    \ 月1 日起放寬除菌治療的健保給付規定，幽門桿菌感染者不再僅由胃鏡、上消化道X 光檢查，若為呼氣碳13、糞便抗原檢查、上消化道內視鏡切片，也可接受除菌治療與用藥。\n\
    \    臺灣在幽門桿菌篩檢推廣下，胃癌發生率、死亡率較日本、韓國逐年下降，顯示出降低危險因子的重要性，反觀日本、韓國則仰賴大量的內視鏡篩檢資源，發生率相對嚴峻。(摘自網路新聞)"
- id: doc_113_新北_福和_自然_g7s1e2_s3_49
  section: 3
  number: 49
  type: single
  page: 6
  stem: 依文章內容所述，心血管疾病患者接受心臟支架手術後，為了降低血栓形成的風險，醫生通常會給予患者哪一項藥物治療計劃？
  options:
  - label: A
    content: 只需服用抗生素
  - label: B
    content: 雙重抗血小板藥物治療，包括阿斯匹靈和另一種抗血小板藥物
  - label: C
    content: 只需服用阿斯匹靈
  - label: D
    content: 服用抗凝血劑和利尿劑
  group_stem: '(二) 隨著年齡增長，人們罹患心血管疾病的風險也逐漸上升，尤其是對於有高血壓、高血糖或高血脂等危險因素的人士。王先生在五十多歲時因急性心肌梗塞進行了心臟支架手術，隨後開始每天服用阿斯匹靈和抗血小板藥物以防止血栓。然而，近期他發現自己的大便變成黑色，這讓他感到不安。經過醫師的檢查，確認是上消化道出血，這是心血管患者中常見的副作用之一。長期使用阿斯匹靈可能導致腸胃不適、潰瘍，甚至出現出血情況。因此，出現這種情況時，患者應立即告知醫師，以便進行必要的調整和處理。

    心血管疾病的發展與多種風險因素密切相關，其中最主要的包括三高（高血壓、高血糖、高血脂）和吸煙。當冠狀動脈因這些因素逐漸狹窄時，心肌缺氧的風險就會增加。特別是在寒冷的天氣中，交感神經的亢奮會引起血管收縮，這使得原本已經狹窄的冠狀動脈更加緊縮，從而加劇心絞痛或心肌梗塞的風險。此外，研究發現清晨是心肌梗塞和中風的高發時段，這提醒我們在這段時間內需特別小心。

    對於心肌梗塞的治療，醫師通常會考慮心導管手術或冠狀動脈繞道手術。心導管手術是透過氣球導管撐開狹窄的血管並放置支架，以保持血液通暢。而冠狀動脈繞道手術則是將一段血管接入冠狀動脈，以繞過狹窄部位，恢復血流。儘管現代的心導管技術已經很成熟，但患者在接受治療後仍需謹慎，因為支架有可能出現再狹窄的情況，且在未放置支架的血管部位也有可能形成新的斑塊，增加再次狹窄的風險。

    在接受心臟支架植入後，患者需要根據醫師的指示進行雙重抗血小板藥物治療。這通常包括阿斯匹靈和另一種抗血小板藥物，目的是降低血栓形成的風險。由於支架是一種外來物，可能會引起血管的發炎或過敏反應，因此必須嚴格遵循醫囑，並在醫師指導下進行藥物調整。

    在抗血小板藥物治療期間，患者需特別注意腸胃不適或出血等副作用。若出現瘀青、尿血或排便出血等情況，應立即與醫師溝通，以便進行相應的藥物調整。亞洲人在服用抗血小板藥物後出現腦出血或胃腸道出血的風險比歐美人群更高，因此更需謹慎。(改寫自
    Care Online 照護線上《溫差變化大，慎防心肌梗塞，心血管疾病治療與保養，醫師圖文解說》)'
