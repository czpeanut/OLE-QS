- id: doc_113_新北_福和_自然_g7s1e2_s1_23
  section: 1
  number: 23
  type: single
  page: 3
  stem: 強烈颱風過境後，有許多的樹木被吹折或吹倒，同學們看到被吹斷的植物樹幹上有許多深淺不一的環紋，經過老師說明後知道這些環紋就是「年輪」，請問關於「年輪」，下列敘述何者正確？
  options:
  - label: A
    content: 具有年輪的植物應該具有形成層
  - label: B
    content: 生活在四季如春的環境中，植物年輪會比較明顯
  - label: C
    content: 年輪是因為韌皮部及木質部的細胞顏色深淺不同交錯而成
  - label: D
    content: 所有植物都具有年輪。3-1
