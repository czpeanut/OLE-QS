  section: 4
  number: 5
  type: single
  page: 1
  stem: 「豔冶之貌，代有之矣；潔朗之操，則人鮮聞。故士矜才則德薄，女衒色則情私。若能如執盈，如臨深，則皆為端士淑女矣。」這段文字的觀點，與下列何者最接近？（註：衒：炫示、誇耀。）
  options:
  - label: A
    content: 端士淑女應才色兼備
  - label: B
    content: 人宜謹飭德操，莫炫耀才色
  - label: C
    content: 美貌女子與高潔端士均屬少見
  - label: D
    content: 端士不近美色，淑女不矜才德。
