  group_stem: '水調數聲持酒聽，午醉醒來愁未醒。送春春去幾時回？臨晚鏡，傷流景，往事後期空記省。 沙上並禽池上瞑，雲破月來花弄影。重重翠幕密遮燈；風不定，人初靜，明日落紅應滿徑。

