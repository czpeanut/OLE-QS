  section: 4
  number: 10
  type: single
  page: 2
  stem: 「以葡萄的纍纍／串珠的光潤／送走四月的清明／迎接五月的嬌媚／這是阿勃勒翻滾歡唱的季節／金黃的陽光／雨一般來此小集／清洗城市大街／掀開行人眼簾／這是大高雄最最燦亮的夏天」（向陽
    詠阿勃勒）這段詩點出阿勃勒的樣貌，何者說明符合詩意？
