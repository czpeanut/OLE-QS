  section: 4
  number: 7
  type: single
  page: 1
  stem: 余光中：「世界上高級的人很多，有趣的人也很多，又高級又有趣的人卻少之又少。高級的人使人尊敬，有趣的人使人喜歡，又高級又有趣的人，使人敬而不畏，親而不狎，交接愈久，芬芳愈醇。」文中作者認為怎樣的人最值得深交？
  options:
  - label: A
    content: 值得尊敬卻令人害怕的人
  - label: B
    content: 讓人喜歡卻過度親近的人
  - label: C
    content: 使人畏懼而不敢親近的人
  - label: D
    content: 令人尊重又願意親近的人。
- id: doc_111_台北_新興_國文_g9s1e1_s4_8
  section: 4
  number: 8
  type: single
  page: 2
  stem: 「目前已經歸類出一系列不同空汙來源的比例，根據環保署空氣品質保護及噪音管制處調查發現，境外傳輸『PM2.5年平均濃度』影響比率約34％，境內汙染源比率則約66％，顯示大部分空氣汙染源其實都來自境內。交通工具等移動汙染源影響最大，其中大貨車總排放量最多；工業源影響排在第二，電力業影響最劇；其他汙染源中，餐飲業排放量最多。」依據上文，下列何者說明正確？
  options:
  - label: A
    content: 大貨車排放是所有境外汙染源之最
  - label: B
    content: PM2.5是指從境外傳入的空氣汙染源
  - label: C
    content: 空氣汙染的元凶是境內的餐飲業過剩
  - label: D
    content: 將交通汙染降低可有效改善PM2.5的濃度。
- id: doc_111_台北_新興_國文_g9s1e1_s4_9
  section: 4
  number: 9
  type: single
  page: 2
  stem: 「齊柏林說，有時天候不好，海上大風一吹，混亂的氣流，搖晃的機身，讓他不禁害怕地自問：『我幹嘛在這裡？』但一回家，整理拍出來的照片，原來的疑惑都會消失無蹤，馬上又想出發，繼續用空拍說臺灣故事。他表示：每次飛上天空，抓取前所未見的畫面，回到陸地感動更多人、發揮影響力，這正是探險的意義與精神。自豪於冒險精神的他勉勵年青人不要怕困難、勇於嘗試追夢，『你的血液中一定要有冒險的因子存在！』」齊柏林先生教會我們許多道理，但「不包含」下列何者？
  options:
  - label: A
    content: 探險是迎向挑戰勇敢追求
  - label: B
    content: 認真去做就能感動更多人
  - label: C
    content: 不計代價去做應該做的事
  - label: D
    content: 不顧一切冒險是最不妥的。
