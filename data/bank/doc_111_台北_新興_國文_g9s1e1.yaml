- id: doc_111_台北_新興_國文_g9s1e1_s4_1
  section: 4
  number: 1
  type: single
  page: 1
  stem: 「將略兵機命世雄，蒼黃鐘室嘆良弓。遂令後代登壇者，每一尋思怕立功。」（劉禹錫 韓信廟）根據這首詩，作者認為後人會因韓信的際遇而有何種顧慮？（註：①命世：即「名世」，著名於世。②蒼黃：比喻事情變化翻覆。③鐘室：韓信被殺害的地方。④登壇：登壇拜將，授予軍權。）
  options:
  - label: A
    content: 勞而無功
  - label: B
    content: 鳥盡弓藏
  - label: C
    content: 功敗垂成
  - label: D
    content: 明爭暗鬥。
- id: doc_111_台北_新興_國文_g9s1e1_s4_2
  section: 4
  number: 2
  type: single
  page: 1
  stem: 「一蒙師只識一『川』字。見弟子呈書，欲尋『川』字教之，連揭數葉，無有也。忽見『三』字，乃指而罵曰：『我著處尋你不見，你倒臥在這裡！』」（馮夢龍）這則短文意在諷刺文中蒙師的何種缺失？（註：①數「葉」：同「頁」。②著處：到處。）
  options:
  - label: A
    content: 固執不知變通
  - label: B
    content: 未能因材施教
  - label: C
    content: 胸襟狹窄器量小
  - label: D
    content: 沒有真才實學。
- id: doc_111_台北_新興_國文_g9s1e1_s4_3
  section: 4
  number: 3
  type: single
  page: 1
  stem: 「世人以為：五官之中，目能見而明察。然而面有黑點，目卻不能自知，何能稱其為明也？目能見物，而不能見吾之面，須假借於鏡方能見己之容。世人卻以為鏡之貴，不如目。吾人認為：鏡不須求於目，而目須轉求於鏡。世人未嘗以鏡能助目，而歸咎目之不能全然明察。鏡有何辜負、不如於目呢？今有一客人自恃己目而厭惡求助於鏡者，曰：『此為難我也。吾自有目，何須用鏡乎？』久之，視世所稱揚為美人者，亦鮮少合其意，而不知己面之黑點，泰然謂：『未有美於己者。』左右匿笑，客終不悟，悲夫！」（改寫自錢大昕
    鏡喻）關於這篇文章的主旨最接近下列何者？
  options:
  - label: A
    content: 別人不了解我們的才學也不生氣，是君子的風度
  - label: B
    content: 工匠想要把工作做好，一定要先使工具精良
  - label: C
    content: 人們常不求事物的根本大端而只重視微末小節
  - label: D
    content: 人應善取他人意見，改正自己過失。
