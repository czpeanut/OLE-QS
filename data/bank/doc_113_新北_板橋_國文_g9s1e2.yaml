  group_stem: "(四)\n    浦陽，鄭君仲辨，其容闐然①,其色渥然②,其氣充然,未嘗有疾也。他日,左手之拇有疹焉,隆起而粟,君疑之,以示人。人大笑,以為不足患。既三日,聚而如錢,憂之滋甚,又以示人。笑者如初。又三日,拇之大盈握,近拇之指,皆為之痛,若剟③刺狀,肢體心膂④無不病者。懼而謀諸醫。\n\
    \    醫視之,驚曰:「此疾之奇者,雖病在指,其實一身病也,不速治,且能傷生。然始發之時,終日可愈;三日,越旬可愈;今疾且成,非三月不能瘳⑤。終日而愈,艾可治也;越旬而愈,藥可治也;至於既成,甚將延乎肝膈,否亦將為一臂之憂。非有以禦其內,其勢不止;非有以治其外,疾未易為也。」君從其言,口服湯劑,而傅⑥以善藥。果至二月而後瘳,三月而神色始復。\n\
    \    余因是思之:天下之事,常發於至微,而終為大患;始以為不足治,而終至於不可為。當其易也,惜旦夕之力,忽之而不顧;及其既成也,積歲月,疲思慮,而僅克之,如此指者多矣!\n\
    \                                                                         (方孝孺\
    \  指喻)\n①闐然:強壯的樣子。②渥然:形容色澤鮮紅光潤。③剟:用刀刺。④膂:脊椎骨。⑤瘳:病癒。⑥傅:通「敷」,擦抹。"
