  stem: 《孟子》中出現很多成語，請根據各選項文意判斷，下列何者運用正確？
  options:
  - label: A
    content: 想要以投機的方式得到商業利潤，這種「解民倒懸」的方式，根本達不到目的。
  - label: B
    content: 節能減碳若只有少數人去執行，無疑是「一暴十寒」，解決不了地球暖化問題。
  - label: C
    content: 印度聖雄甘地「摩頂放踵」、不辭辛勞四處演說，爭取擺脫殖民地的不平等待遇。
  - label: D
    content: 陶朱公「己飢己溺」多年，就是想要一圓多年夢想，在人生的舞台發光發熱。
