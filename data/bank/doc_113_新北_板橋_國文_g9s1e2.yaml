- id: doc_113_新北_板橋_國文_g9s1e2_s2_31
  section: 2
  number: 31
  type: single
  page: 5
  stem: 根據上文，何者是擬定「願望清單」應考量的關鍵？
  options:
  - label: A
    content: 思量如何能產生意義，把最鍾愛的家人擺在第一位。
  - label: B
    content: 考量現實面，如財力等因素，去找出能實踐的願望。
  - label: C
    content: 以自己的內心覺察為出發點，重新思索自我的需求。
  - label: D
    content: 擬定過程要深思熟慮，多方參照他人觀點修正想法。
  group_stem: "(五)\n    電影《The Bucket List》，講述兩位癌症末期的病人如何面臨死亡前的生活。Bucket List 是一個英文片語，指的是一張遺願清單，書寫下自己在有生之年想做、想看、想體驗，或取得成就的種種事情。電影中身分殊異的兩位主角，過往因環境、工作、想法的限制，並未真正開始，面臨死亡前的努力實踐，反倒豐富了看似沒有希望的病痛人生。\n\
    \    如果讓你來列出願望（遺願）清單，你會怎麼列呢？書寫願望清單的關鍵，在於回歸自己。你得珍視自己，將自己視為人生舞臺的主人，接受原有的樣子，在能負擔面對的處境，尋求你真正想做卻沒有做，或是能為世界帶來不一樣的事情。願望清單其實在提醒我們關於價值的問題。擬定清單可以不斷修正與調整，在時間移轉的過程中，持續尋找與確認什麼是自己最看重的事物。擬定清單本身不是最重要的事，回歸初衷、發覺興趣，甚至覺察自己追尋、實踐或做這件事會真的快樂，那才是「願望清單」最棒的地方。\
    \                                                ( 風傳媒    2024 線上電影推薦)"
