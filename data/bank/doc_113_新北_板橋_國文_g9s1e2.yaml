  - label: B
    content: 每個賽德克族新出生的生命，不管男女，在年幼時都會在額頭上刺上額紋。那是一種「生命」的表徵。也代表著祖靈的眷顧，用以保護他們長大。
  - label: C
    content: 父親嚴肅地對我說:「山林是布農男人奔馳和吶喊的地方，除了用腳印表示及保護我們的家園，土地及獵場之外，也要捕獲許多獵物與族親共同分享」。
