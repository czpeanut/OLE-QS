- id: doc_113_高雄_翠屏_數學_g8s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列各選項中，對於三角形邊角的敘述哪一個是錯誤的？
  options:
  - label: A
    content: 三角形中任意二邊長的和大於第三邊，任二邊長的差小於第三邊。
  - label: B
    content: 在 $\triangle ABC$ 中，若 $\angle A > \angle B$，則 $\overline{BC} > \overline{AC}$
      。
  - label: C
    content: 在 $\triangle ABC$ 中，若 $\overline{AB} > \overline{BC}$ ，則 $\angle A >
      \angle C$。
  - label: D
    content: 若三角形兩邊長的平方和等於第三邊長的平方，則這個三角形必為直角三角形。
  answer:
  - SSS 全等性質
