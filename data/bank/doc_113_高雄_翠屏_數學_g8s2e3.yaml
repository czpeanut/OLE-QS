    | :--- | :--- | :--- | :--- |

    | (1) | $\overline{OA} = \overline{OC}$ | $\overline{OD} = \overline{OB}$ | $\overline{CD}
    = \overline{AB}$ | $\overline{AD} = \overline{BC}$ |

    | (2) | SSS 全等性質 | SAS 全等性質 | ASA 全等性質 | AAS 全等性質 |

    | (3) | 同位角相等 | 內錯角相等 | 同側內角互補 | 對頂角相等 |

    | (4) | 兩對角線互相平分 | 兩組對邊平行 | 兩組對角相等 | 一組對邊平行且相等 |


