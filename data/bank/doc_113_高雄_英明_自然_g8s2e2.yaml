- id: doc_113_高雄_英明_自然_g8s2e2_s1_24
  section: 1
  number: 24
  type: single
  page: 3
  stem: 有關長期使用制酸劑（胃藥）的健康風險，下列何者正確？
  options:
  - label: A
    content: 使用制酸劑（胃藥）會造成胃酸過多，影響營養吸收
  - label: B
    content: 使用含碳酸氫鈉的制酸劑，可能會造成腹瀉
  - label: C
    content: 使用含鋁的制酸劑，可能會造成便祕
  - label: D
    content: 使用含鎂的制酸劑，可能會造成腹脹。
  group_stem: "【題組】閱讀下列敘述後，請回答第 24～28 題問題：\n  現代人生活緊張忙碌，容易因壓力過大導致胃酸過多而引起不適。\n    胃液的主要成分是鹽酸，其\
    \ pH 值達 1～2.5，正常情況下，分泌胃酸是為了消化食物，但是不當的刺激，使得胃酸分泌過多，造成胃壁強烈收縮與痙攣，甚至侵蝕胃部的黏膜而造成潰瘍。潰瘍長期浸泡在胃酸之中容易惡化，此時服用制酸劑能夠中和胃酸，並在潰瘍表面形成一層薄膜，讓潰瘍逐漸好轉。\n\
    \n| 制酸劑種類 | 主要成分 | 副作用 |\n| :--- | :--- | :--- |\n| 鋁鹽 | 氫氧化鋁 | 抑制胃腸道的蠕動，造成便祕\
    \ |\n| 鎂鹽 | 氫氧化鎂 | 使小腸蠕動增加，影響小腸吸收，造成腹瀉 |\n| 鈣鹽 | 碳酸鈣 | 脹氣、代謝性鹼中毒 |\n| 鈉鹽 | 碳酸氫鈉\
    \ | 脹氣，血壓過高 |\n\n  根據統計，臺灣人一年胃藥用量約 22 億顆，制酸劑就是俗稱「胃藥」，是屬於抗潰瘍藥物的一種。一般而言，制酸劑是安全性很高的的藥品，但是如果長期且高劑量地服用制酸劑，會造成胃酸不足，人體的消化功能就會受到影響，消化不良，營養就難以吸收，更會因其成分不同而產生不同之副作用。\n\
    \  但並不是所有的胃部不適都可以用制酸劑來治療，腸胃科醫師建議，短期的腸胃不適可服用制酸劑來減輕症狀，若長期的腸胃問題在服用制酸劑後，症狀仍未改善，則應就醫查明原因，才能對症下藥，及早恢復健康。"
