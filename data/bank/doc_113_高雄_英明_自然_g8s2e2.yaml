  group_stem: "【題組】閱讀下列敘述後，請回答第 39～41 題問題：\n    哈柏法為 20 世紀初發展出來，由大氣中氮製氨的化學方法。此法為化學上最重要的發明之一，因為它使大氣中氮的固定成為可能，還能經由將氨轉化為硝酸及生產肥料和炸藥所需的硝酸鹽。化學家哈伯（F.\
