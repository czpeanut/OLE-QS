  section: 1
  number: 20
  type: single
  page: 2
  stem: 班會課討論班遊的事情，兩位同學因為意見不同差點發生衝突，還好老師及時制止，並且向同學宣導「我不同意你的意見，但我以死捍衛你說話的權利。」這項觀念，化解了一場爭端。其實上述這兩句話，最早出現於伊夫林•碧翠思•霍爾的著作，可充分代表某位啟蒙學者的理念。請問這位啟蒙學者應是下列何者？
  options:
  - label: A
    content: 盧梭
  - label: B
    content: 培根
  - label: C
    content: 伏爾泰
  - label: D
