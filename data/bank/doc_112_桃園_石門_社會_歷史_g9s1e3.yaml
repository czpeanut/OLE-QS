  section: 1
  number: 10
  type: single
  page: 1
  stem: 科學革命時代，伽利略因證實了之前某學者的學說，與教會的觀點相衝突，使得伽利略遭到教會軟禁多年。請問伽利略所證實的學說為下列何者？
  options:
  - label: A
    content: 太陽為宇宙中心說
  - label: B
    content: 行星運行軌道定律
  - label: C
    content: 地球為宇宙中心
  - label: D
