  section: 1
  number: 16
  type: single
  page: 2
  stem: 啟蒙運動的學說與現今政治觀念息息相關，公民課老師講到《中華民國憲法》第二條明文規定：「中華民國之主權屬於國民全體。」讓小明不禁想到，這種思想最可能來自於啟蒙時期哪一位歐洲學者的主張？
