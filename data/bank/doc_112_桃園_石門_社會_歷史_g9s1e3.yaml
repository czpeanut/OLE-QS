- id: doc_112_桃園_石門_社會_歷史_g9s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 現今許多國家都設有總統（總理）、國會和各級法院，三者權力相互制衡的政治制度。孫中山先生也參考歐美三者權力分立架構，設計採取行政、立法、司法、考試、監察互相制衡分立的體制，目前中華民國便採取五權分立的制度。請問上述歐美這種政治體制，源自於哪一位學者的思想？
  options:
  - label: A
    content: 培根
  - label: B
    content: 洛克
  - label: C
    content: 馬克思
  - label: D
    content: 孟德斯鳩。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
