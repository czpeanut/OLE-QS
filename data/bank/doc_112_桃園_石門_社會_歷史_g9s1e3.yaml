  stem: 附圖是印度北部著名景點泰姬瑪哈陵，被稱為世界七大景觀之一，甚至被譽為世界最美麗的建築。它是蒙兀兒帝國君主沙賈汗為了紀念他的妻子慕塔芝•瑪哈而建。外觀色調單純，有醒目的圓形屋頂，主建築外有高聳叫拜樓（柱子）建築樣式。請問這是哪一宗教的建築特色？
