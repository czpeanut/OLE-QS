  section: 1
  number: 9
  type: single
  page: 1
  stem: 科學革命時代，學術上主張許多新的思考態度與研究方法。下列有關科學革命時期，學者和其論點的敘述，何者正確？
  options:
  - label: A
    content: 牛頓的名言「我思故我在」，強調凡事要懷疑
  - label: B
    content: 狄德羅整理此時期成就，編著有《百科全書》
  - label: C
    content: 培根提出演繹法，重視實驗
  - label: D
    content: 伽利略曾驗證哥白尼提出關於天文學的理論是正確的。
