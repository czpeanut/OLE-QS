  section: 1
  number: 21
  type: single
  page: 2
  stem: 清朝中葉後，面對與英國多次的戰爭，皆居於下風，甚至簽訂不平等條約，開啟了近代中國悲慘的命運。請問在鴉片戰爭、英法聯軍等戰役中，英國軍隊之所以能船堅炮利，和下列哪一歷史因素最相關？
  options:
  - label: A
    content: 宗教改革的影響
  - label: B
