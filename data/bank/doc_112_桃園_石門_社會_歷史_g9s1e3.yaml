- id: doc_112_桃園_石門_社會_歷史_g9s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 自英國人18世紀移入南半球某地以來，在殖民政策影響下，當地已有約130種原住民言語絕跡。附圖為2019年，當地政府發行的一款硬幣，幣面列出當地14種原住民語言，下方設計一處留白，代表其他已絕跡的130種原住民語言。政府希望藉由此硬幣的發行，提醒人民保存、維護和活化原住民語的重要性。請問造成原住民語言消失的現象，與下列何者最相關？
  options:
  - label: A
    content: 南島語族的消失
  - label: B
    content: 大航海時代的興起
  - label: C
    content: 鄭和七次下西洋
  - label: D
    content: 伊斯蘭教的擴張。
