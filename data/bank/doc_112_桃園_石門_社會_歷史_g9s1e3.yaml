- id: doc_112_桃園_石門_社會_歷史_g9s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 歷史事實與歷史解釋不同，最大的差別在於歷史事實是客觀的呈現事實本身，而歷史解釋則是史學家對史實主觀的詮釋。就歐洲的科學革命而言，下列哪一項敘述屬於歷史解釋？
  options:
  - label: A
    content: 牛頓提出三大運動定律
  - label: B
    content: 望遠鏡與溫度計等工具的發明、改良
  - label: C
    content: 法國成立法蘭西科學院做為科學研究機構
  - label: D
    content: 這個時期被稱為天才的世紀。
