  section: 1
  number: 5
  type: single
  page: 1
  stem: 英國艦隊於1788年1月26日抵達雪梨灣，在澳洲土地首次升上英國國旗，當天被視為澳洲殖民地的誕生日，也就是澳洲國慶日。近年來，澳洲國慶日卻往往出現遊行抗議，希望更改國慶日日期。請問此抗議聲浪，主要是因不認同何事？
  options:
  - label: A
    content: 英國在澳洲建立蒙兀兒帝國進行統治
  - label: B
    content: 澳洲淘金熱，吸引太多投資者到來
  - label: C
    content: 英國在此地種植棉花，提供殖民母國紡織業所需
  - label: D
    content: 殖民起始日被訂為國慶日。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
