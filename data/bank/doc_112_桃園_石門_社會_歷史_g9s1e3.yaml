  section: 1
  number: 18
  type: single
  page: 2
  stem: 小美閱讀科學家的傳記，發現除了能得到許多科學知識，也從當中學到許多人生的智慧，例如她閱讀到過去曾有一位偉大的科學家說過：「如果說我看得到比別人遠，那是因為我站在巨人的肩上。」而這位科學家所提出之理論，奠定了近代物理學的基礎。請問這位科學家最有可能是下列何者？
  options:
  - label: A
    content: 伽利略
  - label: B
    content: 牛頓
  - label: C
    content: 哥倫布
  - label: D
    content: 哥白尼。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_112_桃園_石門_社會_歷史_g9s1e3_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 公民課時，老師在講解經濟學的內容，小奇聽到很多經濟上的專有名詞和概念，覺得對日常生活很有幫助。這當中載有位學者的學說，他覺得最適合成現在的國家採用。這位學者主張自由貿易並不需要政府過多的注意與限制，競爭愈為自由與普遍，則愈有利於社會，也能使國家得到充分的發展與繁榮。請問這位學者是誰？
  options:
  - label: A
    content: 亞當斯密
  - label: B
    content: 狄德羅
  - label: C
    content: 瓦特
  - label: D
    content: 馬克思。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
