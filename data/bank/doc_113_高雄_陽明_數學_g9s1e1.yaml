- id: doc_113_高雄_陽明_數學_g9s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 三姐妹的理解能力各有不同，因此媽媽讓曉雯、曉玫、曉嵐三人分別以正常播放速度的1.2 倍速、1.5 倍速、1.6 倍速的播放速度觀看同一部土司製作的教學影片，且播放過程均不中斷。若曉玫觀看此教學影片花了24
    分鐘才看完，則關於曉雯和曉嵐看影片所花的時間，下列敘述何者正確?
  options:
  - label: A
    content: 曉嵐花了20 分鐘
  - label: B
    content: 曉嵐花了 18 分鐘
  - label: C
    content: 曉雯花了32 分鐘
  - label: D
    content: 曉雯花了 30 分鐘
  group_stem: 新冠肺炎三級警戒期間，親子相處時間增加許多，為了讓小孩在家不無聊及吃得更健康，開始流行自己動手製作土司，其基本食材有高筋麵粉、鹽、糖、奶油及酵母粉，透過網路教學影片能讓大人及小孩都能輕鬆入門、一展廚藝。已知土司的製作過程為醒麵→第1
    次揉製→第1 次發酵→第2 次揉製→第2 次發酵→烘烤。發酵的目的是讓麵糰變大而使土司口感更鬆軟、更好吃。今日下午媽媽與三姐妹曉雯、曉玫、曉嵐，透過網路教學影片學習如何製作土司。
