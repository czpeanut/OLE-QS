  group_stem: "16歲的阿牛，撞壞了朋友的機車沒錢賠償，被引誘當詐騙集團車手，想償還修車費，他先自掏腰包租機車代步犯案，前後提領共30多萬，最後卻只拿到300元酬勞還被逮，阿牛落網後懊悔不已，氣得向警方抱怨，詐騙集團太可惡！最後，阿牛被送至少年法院審理。\n\
