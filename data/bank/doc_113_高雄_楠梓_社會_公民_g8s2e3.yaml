    content: 阿牛的案件須先移送少年保護官偵查、起訴
  - label: B
    content: 阿牛的案件會被列為少年刑事案件
  - label: C
    content: 少年法院審理阿牛的案件時，須採取審理不公開原則
  - label: D
    content: 阿牛的案件須依兒童及少年福利與權益保障法審理。
