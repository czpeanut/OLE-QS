    大陸地殼的形成比海洋地殼複雜許多，約有70%的大陸地殼是在約30 億年之前形成，其餘在20~17 億年前、13~11 億年前、5~3 億年前，分數波高峰形成。

    這些約30 億年之前形成的大陸地殼稱為地盾，地盾形成的機制還未確定，但肯定包括兩個因素：1.大量熔融的岩漿上升，形成密度較小岩石和堅固的岩石圈。2.某個機制使這部分岩石圈增厚。其後數波大陸地殼形成高峰，主要是海洋板塊沉入地函時的過程造成。

    地盾處的岩石圈物質密度比別處的岩石圈小，而且也堅韌很多，厚度還是別處岩石圈

    的兩倍，所以30~25 億年前板塊運動開始後，不斷的張裂和聚合，地盾才能保持穩定存在到今天。

    地盾下方的地函是金剛石形成的良好環境，這些金剛石常被岩漿帶到地表，經過定年幾乎都超過20 或30多億年，顯示地盾至少也這麼古老。有些大陸地殼產出的金剛石包含其他礦物，特別是隱沒帶火山形成的硫化物礦物，顯示這部分大陸地殼的形成和板塊隱沒有關。

    大陸地殼保存了許多地球過往歷史，當大陸地殼被風化、侵蝕、搬運、沉積後，會將養分帶到海洋，還會移除大氣中的二氧化碳，對生命的演化至關重要。'
