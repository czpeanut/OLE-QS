  stem: What is true about Ocean Sunfish?
  options:
  - label: A
    content: Ocean Sunfish are people’s favorite fish.
  - label: B
    content: Ocean Sunfish are different from Mola Mola.
  - label: C
    content: Ocean Sunfish live in cold waters for a long time.
  - label: D
    content: There is no bigger bony fish than the Ocean Sunfish .
  group_stem: "To some people, this fish looks like a swimming head. What is this\
    \ \nstrange fish? It’s of course the ocean sunfish, or Mola mola.  \nOcean sunfish\
    \ live in cool to warm waters for as long as 20 years.  \nThey’re the largest\
    \ and heaviest bony fish on Earth. Most of them are \naround two meters long and\
    \ 1,000 kilograms. The biggest one in history \nwas more than three meters long\
    \ and 2,000 kilograms. Because of their size \nand shape, they swim very slowly.\
    \ However, they can move fast when \nthey’re eating or getting away from whales\
    \ and sharks for not being eaten.  \nIn the world of bony animals, ocean sunfish\
    \ can have more eggs than \nany of them. In fact, they can have up to 300,000,000\
    \ eggs at once. The \nbabies are really small when they’re born, but they grow\
    \ fast. Besides, \nocean sunfish aren’t dangerous to people at all. Actually,\
    \ they are more \nafraid of us than we are afraid of them. Here are some do’s\
    \ and don’ts when \nyou want to watch them in the ocean.  *1 meter = 1 m  1 kilogram\
    \ = 1 kg  \n \nDo’s   - keep 5 meters away from them  \n- swim slowly when you\
    \ get close to them  \n- report any activities that are dangerous to them \nDon’ts\
    \ - don’t use the flash when you take their pictures  \n- don’t swim under the\
    \ fish  \n- don’t block their ways - don’t touch them  \n \nbony 硬骨的 whale 鯨魚\
    \ shark 鯊魚 dangerous 危險的 flash 閃光"
