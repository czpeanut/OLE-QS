- id: doc_111_桃園_平南_國文_g7s1e1_s5_3
  section: 5
  number: 3
  type: single
  page: 3
  stem: 根據這則資料，下列說明者正確？
  options:
  - label: A
    content: 玉米的包葉容易藏有髒汙，務必全部摘除後再清洗
  - label: B
    content: 若連同外層包葉一起煮，須將玉米逐一以清潔劑洗滌
  - label: C
    content: 剝除玉米包葉前，必須先處理玉米最外層包葉的髒汙
  - label: D
    content: 在玉米清洗後，就可以將玉米軸部切除並將玉米切塊。
  group_stem: '清洗玉米有方法 吃得健康又安心


    步驟一   用刷子乾刷仍包葉的玉米，將外面的灰塵拍除。

    步驟二   將包葉層層剝除，剝除完後切記要將觸摸過包葉的雙手清洗乾淨。若要連包葉做水煮玉米，則只需留下最後一層包葉。

    步驟三   將玉米底部凸出的軸部切除。

    步驟四   利用小水流及軟毛刷，仔細刷洗玉米粒間隙後再切塊。若要連包葉做水煮玉米，則是直接連同葉子在水龍頭下反覆沖洗，或將包葉翻開刷洗玉米粒間的隙縫，再覆上包葉。

    步驟五   將玉米加熱烹煮。'
