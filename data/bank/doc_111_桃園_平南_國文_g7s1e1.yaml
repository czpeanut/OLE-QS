- id: doc_111_桃園_平南_國文_g7s1e1_s5_1
  section: 5
  number: 1
  type: single
  page: 3
  stem: 母親在作者心中的形象，下列何者不正確？
  options:
  - label: A
    content: 吃苦耐勞的
  - label: B
    content: 壯麗的
  - label: C
    content: 多病的
  - label: D
    content: 莊嚴的。
  group_stem: "為什麼呢？陳舊而又莊嚴的事物，總是和母親的生命連結在一起的。甚至壯麗的事物，在我心裡，也會成為母親的另一種形象的。記得有一年春天，我去大屯山追尋初民的痕跡，臨風而立，從山上眺望臺灣動人的北部，看到非常之壯麗的平原，那寬闊的平原，正在默默地懷孕了所有的果實、稻米、蔬菜，和可愛的嬰兒。那一刻，我特別容易想起母親來。甘願在風中雨中，熬過千萬種痛苦以便孕育了許多生命的大地，卻從不說一句抱怨的話。我想，這，就是母親最美的象徵了。\n\
    \      我總是這樣感覺，母親是上帝特派來照顧我的，並使我在她的面前，真確地感到自己的渺小的。這種感覺，在我小學時代，便已在心中生根了。直到我二十七歲的今天，在夜晚的桌燈下，凝視六十歲的母親的背影時，這種感覺仍然很強烈地活在我心底深處，似乎永遠無法拂去了。在母親的歲裡，吃藥幾乎成為一種習慣了，鎮定劑、胃腸藥、克風邪、腦新、好立肝糖衣錠、咳嗽藥，天天填滿她空虛的手提包。每一次她仰首，張口，把藥連同開水吞服下去，彷彿把她一生的苦楚辛酸，連同她子女們的病痛，全部吞嚥下去了。然而，藥錠、藥液始終沒有為她抗拒各種疾病。那麼多的痛苦，她要一個人獨自默默忍受，而，這麼多的愉悅和關懷，由我們做子女的來分享。為什麼呢？我又想起那年春天我所看見的廣闊的平原了。\n\
    \      最後一天，我年老的母親搭三點的莒光號南下，我陪她到臺北車站，如同每一次她要返回南部那樣，莒光號開動時，我孤立在空曠無邊的月臺上，含淚向巨大的玻璃車窗內的母親揮手，我一再地告訴自己，母親又要回去了，彷彿一葉在河面漂流的葉片，漂回她居住三十多年的嘉義，樸素的小城。而我仍要留在五光十色的臺北，繼續求學。什麼時候，我們才能住在一起，不必常常在月臺上忍受這份龐大無比的離情，但那是什麼時候呢？莒光號快速飛奔而去了。\n\
    \n  注釋初民：上古時代、處於原始社會的人。                                   （渡也  銀白的髮絲）"
  tags:
    textbook: 七上 第三課 母親的教誨
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 七上
      subject: 國文
      code: 第三課
      title: 母親的教誨
