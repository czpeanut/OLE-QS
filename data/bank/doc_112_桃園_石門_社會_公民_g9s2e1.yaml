- id: doc_112_桃園_石門_社會_公民_g9s2e1_s1_36
  section: 1
  number: 36
  type: single
  page: 4
  stem: 國際公平貿易認證標章(如右下圖)出現在產品的包裝上，即確保開發中國家的生產者在這個交易上，有得到比較好的待遇。公平貿易的理念在各國積極推動，無論是歐洲、美、加、紐、澳、日本、香港，都可以發現致力於落實公平貿易理念的夥伴組織。而這樣的組織最主要可以協助改善下列哪一問題？
  options:
  - label: A
    content: 恐怖活動進行
  - label: B
    content: 疾病傳播與擴散
  - label: C
    content: 國際貧富差距
  - label: D
    content: 人口販運及毒品交易。
  group_stem: "題組(一)\n    根據媒體報導，國人一年可以喝掉28億杯咖啡。在龐大的市場需求下，咖啡豆需仰賴進口，才能維持穩定價格。然而，在全球咖啡市場中，咖啡農遭到剝削已非新聞，例如：非洲衣索比亞的咖啡豆價格，每公斤不足10元新臺幣。為了對抗不平等的貿易，出現了公平貿易咖啡的生產。在國際公平貿易標準認可下，不僅提供咖啡農合理的收購價格，也鼓勵加入公平貿易組織的農民們採用對環境友善的生產方式。同時，消費者也可以透過這樣的商業網絡，追溯咖啡產品的來源，創造更好的自然及社會環境。然而，多數跨國咖啡企業也僅有少部分產品是選用符合公平貿易的咖啡豆來製作。\n\
    \  「每一次消費，都是改變未來的選擇。」面對咖啡農處境不利的情況，我們的消費行為與偏好也是改善的關鍵之一，唯有大家體認到公平貿易的意義與重要性，並實踐追求公平正義的理念、監督企業合理分配利潤並減少剝削，社會才能有所轉變，進而形塑一個更美好的地球村。\n\
    （資料來源：改寫自「臺灣人一年能喝掉28億杯咖啡！業者老是推「買一送一」卻不降價有原因」。民視新聞網，2021/02/22。）\n依據上述，請回答第36-38題:"
