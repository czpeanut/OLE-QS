  - label: B
    content: 「經濟海域」則是由「領海」再向外延伸200浬的海域範圍
  - label: C
    content: 臺灣因離島眾多且分散，「領海」已擴及至南半球海域
  - label: D
    content: 在臺灣的「經濟海域」範圍內，政府擁有資源開發利用的權力。
