  number: 18
  type: single
  page: 2
  stem: 這裡是晚清全中國最現代化的城市，無論物質或思想皆是改變中國的領頭羊，自來水、電燈、電車等設施開始出現，居住在此地的人們也受到西方文化的影響，穿西服、吃西餐、買洋貨等生活方式漸漸與其他傳統中國的鄉村有所不同。請問：這個城市應該是？
  options:
  - label: A
    content: 廣州
  - label: B
    content: 上海
