  stem: 「西元2011 年3 月，日本發生三一一東日本大地震，本州北部宮城地區的福島電廠受到嚴重損害，造成核汙染。西元2021 年4 月，日本政府拍板定案，預計兩年後將福島核電廠的廢水排入海洋，引起鄰近國家不滿，遂而提出抗議，其中也包含臺灣。抗議的原因在於，福島沿海因寒、暖洋流交會，為一重要漁場，考慮洋流流動特性，部分魚類可能透過食物鏈影響人類健康。」請問：上述報導中提及的洋流，其中的「寒流」所指為何？
  options:
  - label: A
    content: 親潮
  - label: B
    content: 中國沿岸流
  - label: C
    content: 黑潮
  - label: D
    content: 雀巢。
