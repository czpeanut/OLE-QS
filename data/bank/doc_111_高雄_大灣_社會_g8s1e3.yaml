  group_stem: '(一)下表四段資料為清末四場改革的相關敘述，請依所學判斷下列問題。


    資料甲：「爾中外臣工，須知國勢至此，斷非苟且補苴(音ㄐㄩ，縫隙)所能挽回厄運，唯有變法……為國家安危之命脈，亦即中國民生之轉機。予(同余，意指我) 與皇帝為宗廟計，為臣民計，捨此更無他策。」

    資料乙：「今將變法之意，佈告天下，使百姓咸喻朕心，共知其君之可恃，上下同心，以成新政，以強中國，朕不勝厚望焉。」

    資料丙：「中學為體，西學為用，師夷長技以求富。」

    資料丁：「均任親貴，非祖制也；複不更事，舉措乖張，全國為之解體。…朝野上下，不啻(音：ㄔˋ，不僅、不止)加離心力百倍。」'
