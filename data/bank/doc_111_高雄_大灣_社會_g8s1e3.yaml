    content: 三則資料都主張女性應該要受教育
  - label: B
    content: 提出資料一觀點的有可能是中國革新派人士
  - label: C
    content: 資料二是站在國家富強的觀點提倡女學
  - label: D
    content: 資料三提倡以基督教立國才能讓女子獲得適切發展。
  group_stem: '(二)下表三段資料為清末有關女學的觀點，請根據三段資料的立場，回答下列問題。


    資料一：「女子通文識字……便喜看曲本小說，挑動邪心，甚至舞文弄法，做出無醜事，反不如不識字，守拙安分之為愈也。女子無才便是德。可謂至言。」

    資料二：「天下積弱之本，則必自婦人不學始……西方全盛之國，莫美若；東方新興之國，莫日本若。男女平權之論，大倡於美，而漸行於日本。……女學最盛者，其國最強……女學衰，母教失，無業眾，智民少，國之所存者幸矣。」

    資料三：「凡奉基督教而立國者，必興辦女學以成就女子，使女人得以各就其所能獲得適切的發展，成為有用之材，更可能勝於男人，表明女子亦為可敬可重之人。」'
