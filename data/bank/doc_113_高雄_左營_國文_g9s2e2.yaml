    content: 學習獨立自主，在陌生環境存活。
  group_stem: "(六)\n    旅行是一種滌洗，是一種探索。我可以花一個早上坐在平整如鏡的小湖邊看高巒的倒影，飛鳥掠過半空的蹤跡；或站立參天的針葉林間，為一隻麋鹿不期然的出現，屏息長久不敢出聲驚動；或倚著欄杆注視千萬活水的瀑布，從雲煙的山頭雷轟傾瀉，濺起無窮的溼寒，又落在曠古的青苔上，注入冷澗，終於緩緩流去，切過開滿黃花的草原，向海洋的方向。\n\
    \    有時單獨旅行最能體會環境。你一個人在陌生的地方顧盼尋覓，說是看風景，其實是在看自己如何在看著風景，那時你的心思最敏銳，精神最飽滿，周圍一點聲響，一片色彩，任何細微的變化都逃不過你急切的捕捉，那麼好奇，那麼準確。我們都不是喜歡熱鬧的人，可是我們不能安於狹窄的斗室空間。有一次我千里迢迢到了巴黎進了旅館十二層高的房間，將行李放下，站在窗前看高低錯落古今多變的房子，那色調和風姿，忽然就攫獲了所有的巴黎形象，那些歷史和傳統。我心想：到了巴黎，這就是巴黎。遂坐下攤開一疊紙，振筆疾書。「到了就好了，知道我已經在巴黎就夠了」，我竟耽於這個感受，一時失去觀光街頭的心情，因為急著想表達的是這個「到了」的感受，不是去滿足那左顧右盼的心情。我一人坐在旅館窗前寫著，看到美麗的巴黎，其實我可能只是看到自己坐在巴黎的旅館窗前寫著，並因為看到自己那樣在窗前寫著而格外感動。這種經驗不知道你有過沒有？我們這樣固執地尋覓著，其實是尋覓自己。在阿姆斯特丹運河的拱橋上，在萊因河古堡的石梯前，在北美洲高寒的海岬和島嶼，我單獨旅行，或面對著故國無盡山川，古代詩人頌讚詠嘆的塔樓和城牆，覺得我正迅速地靠近著他們的世界，可以觸摩到那其中結實的詩的精魂，文學和藝術的神。\n\
    \    任何人都有出門去到一個從未去過的地方的欲望，何況去了還要回來呢，並不是自我放逐，並不是故作姿態的浪跡飄泊。我有一位朋友常說：「火車是最浪漫的交通工具。」交通工具而有浪漫和不浪漫的分別，就可見旅行是想像思考的訓練。我的朋友是詩人。我另外一個朋友覺得最愜意的旅行方式是自己開車雲遊，而且最好是在美洲大陸縱橫千里的廣袤原野上飛馳。這個朋友家住香港，更對遼闊的天地充滿期待。上個月他果然來了，帶著妻子和兩個成年的女兒，從西雅圖租了一部新車，沿太平洋海岸公路直放舊金山。這位朋友也是詩人。這樣一來，你也可能會問我今天最喜歡甚麼樣的旅行了。\n\
    \    我喜歡選擇一個沒事的週日，最好不是週末，帶著我的妻子和小兒，開車不超過兩小時到一個遊客不常涉足的地方，選定一座木屋旅棧，將被褥安頓好，然後徒步到幽靜安寧的角落去散步，或在海岸的沙灘，或登河流懸崖之上，看路旁的小生物活動，鳳尾草，蘆荻花，空中鳥飛，水中魚躍。黃昏時分在屋前生火烤肉，喝我的啤酒，看兒子在草地上奔跑，然後天就黑了。等他們上床以後，我還可以就燈前寫作，聽野外的蟲聲和激激水流，覺得一個陌生的天地正刺激著我的神經，使我的思索更生動敏捷，快速，明朗，活潑。這樣的地方也令我鬆弛，比平時早一個鐘頭就上床去睡。\n\
    \    我現在最喜歡的旅行只是如此而已。那是休閒度假，不是旅行。而我相信以你今天年輕的風采和興趣，你應該走得更遠，探得更深，你行動的速度應該更快。   \
    \                                --楊牧 壯遊"
