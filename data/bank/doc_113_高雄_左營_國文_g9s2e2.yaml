- id: doc_113_高雄_左營_國文_g9s2e2_s2_38
  section: 2
  number: 38
  type: single
  page: 5
  stem: 文中作者所描述的大自然現象，與下列詩句何者較為相似？
  options:
  - label: A
    content: 更深月色半人家，北斗闌干南斗斜。今夜偏知春氣暖，蟲聲新透綠窗紗
  - label: B
    content: 古木陰中系短篷，杖藜扶我過橋東。沾衣欲濕杏花雨，吹面不寒楊柳風
  - label: C
    content: 頭落日照平沙，潮退漁船擱岸斜。白鳥一雙臨水立，見人驚起入蘆花
  - label: D
    content: 山光全暝水光浮，數里霏霏曉霧收。露彩乍疑藏漢殿，日光不透掩秦樓。
  group_stem: "(二)\n    會不會在面對天幕一般的濃霧就猶疑不決呢？這是我在年節旅行發出的第一次疑懼。\n    思源埡口往南山的斷崖突然升起的霧陣，的確讓我在雪鐵龍的車體裡驚訝造物者的詭異。我從後視鏡的一方小小的鏡框看見它收攏著環山的好晴好日，眼前卻是一方天地所設下的陷阱般的迷霧。我放緩合器，想像族人在兩、三百年前越過白狗大山，穿越梨山、環山時的戒慎情境。環山族人稱Skajau（司卡要），充滿鹿角的美地之意。在祖居地Pins\
    \ bugan（賓斯博干）對著巨石起誓分離後的族人，來到滿山遍野充滿鹿群的美地便決定定居，另一部充滿冒險犯難精神的族人又一次次進行遷移的生死遊戲，他們來到思源埡口面對午後所遇到的捲動天地的濃霧時，會不會也在心底升起了猶疑的想像？日後我並沒有在思源埡口，見到族人遺留任何凌亂的、錯置的、猶疑的腳步，卻在口語相傳裡見證了族人終究是勇敢的越過思源埡口，沿著蘭陽溪兩側高地、遠望太平洋建立了足以生根立命的部落。\n\
    \    當我停在Pianan（南山）面對不斷包圍我的濃霧時，其實並沒有看到高地上的部落，它們當然都已經不在高地，而是在日據時期被武力驅迫或者以新闢稻田誘引，遷移到離河面更近的淺山地區。也因為短短一百年來數度的遷移，追索每一個部落真確的位置已經成為當代族人覓得歷史源頭的一門艱深功課。這源頭或許是廢棄的疊石，或許是所剩無幾的白髮老人，或許是荒山峻嶺中的一坏黃土，更多的，或許是已遭伐木時期開路闢土而掩埋在深山之中的荒野裡的部落了！\
    \                                                                     --瓦歷斯．諾幹\
    \ 迷霧之旅"
