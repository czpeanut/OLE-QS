    \ bugan（賓斯博干）對著巨石起誓分離後的族人，來到滿山遍野充滿鹿群的美地便決定定居，另一部充滿冒險犯難精神的族人又一次次進行遷移的生死遊戲，他們來到思源埡口面對午後所遇到的捲動天地的濃霧時，會不會也在心底升起了猶疑的想像？日後我並沒有在思源埡口，見到族人遺留任何凌亂的、錯置的、猶疑的腳步，卻在口語相傳裡見證了族人終究是勇敢的越過思源埡口，沿著蘭陽溪兩側高地、遠望太平洋建立了足以生根立命的部落。\n\
    \    當我停在Pianan（南山）面對不斷包圍我的濃霧時，其實並沒有看到高地上的部落，它們當然都已經不在高地，而是在日據時期被武力驅迫或者以新闢稻田誘引，遷移到離河面更近的淺山地區。也因為短短一百年來數度的遷移，追索每一個部落真確的位置已經成為當代族人覓得歷史源頭的一門艱深功課。這源頭或許是廢棄的疊石，或許是所剩無幾的白髮老人，或許是荒山峻嶺中的一坏黃土，更多的，或許是已遭伐木時期開路闢土而掩埋在深山之中的荒野裡的部落了！\
    \                                                                     --瓦歷斯．諾幹\
    \ 迷霧之旅"
