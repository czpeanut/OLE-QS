  group_stem: "(五)\n    齊宣王見顏斶曰：「斶①前！」斶亦曰：「王前！」宣王不說。左右曰：「王，人君也。斶，人臣也。王曰『斶前』，斶亦曰『王前』，可乎？」斶對曰：「夫斶前為慕勢，王前為趨士。與使斶為慕勢，不如使王為趨士。」王忿然作色曰：「王者貴乎？士貴乎？」對曰：「士貴耳，王者不貴﹗」王曰：「有說乎？」斶曰：「有。昔者秦攻齊，令曰：『有敢去柳下季壟五十步而樵采者，死不赦﹗』令曰：『有能得齊王頭者，封萬戶侯，賜金千鎰。』由是觀之，生王之頭，曾不若死士之壟②也。」\n\
    \    宣王曰：「嗟乎！君子焉可侮哉，寡人自取病耳！及今聞君子之言，乃今聞細人之行，願請受為弟子。且顏先生與寡人游，食必太牢③，出必乘車，妻子衣服麗都。」顏斶辭去曰：「夫玉生於山，制則破焉，非弗寶貴矣，然夫璞不完。士生乎鄙野，推選則祿焉，非不得尊遂也，然而形神不全。斶願得歸，晚食以當肉，安步以當車，無罪以當貴，清靜貞正④以自虞⑤。制言者王也，盡忠直言者斶也。言要道已備矣，願得賜歸，安行而反臣之邑屋。」則再拜而辭去也。\n\
    --節選戰國策．齊策四\n【注釋 】 ①斶：音ㄔㄨˋ 顏斶，戰國時齊國處士，生卒年不詳。性恬淡，不好富貴。\n          ②壟：墳墓  ③太牢：最高規格的肉食\
    \  ④貞正：堅貞正直  ⑤自虞：自娛。虞，通「娛」"
