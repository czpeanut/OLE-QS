  section: 2
  number: 11
  type: single
  page: 3
  stem: What can we know from the reading?
  options:
  - label: A
    content: To visual learners, saying things out can help them learn better.
  - label: B
    content: To auditory learners, words is more useful and they can do well on writing
      assignment.
  - label: C
    content: Kinesthetic learners learn more through activities; such as sports or
      dancing.
  - label: D
    content: Learners with reading/writing style always do well on all kinds of assignments.
  group_stem: 'Ⅳ. (參考網站https://thelearnerscollaborative.com/2022/03/21/what-is-your-learning-style/
    )

    Have you ever wondered why some people can study with music, while others can’t?
    Or why some students understand just by listening, without taking notes? That’s
    because everyone has a different learning style. If studying is hard for you,
    finding your learning style. might help.

    1 Visual Learners

    They like to learn by seeing things. They like pictures and videos to help them
    understand. They remember better when they use colors, charts, or drawings. Using
    pictures or drawing ideas can help them learn more easily.

    2 Auditory Learners

    They learn best by listening. They like to hear lessons or talks. Reading out
    loud or talking to friends about lessons helps them understand better.

    3 Reading & Writing Learners

    These learners like to read and write to learn. They remember more when they write
    things down, make lists, or read again. Writing notes helps them learn new ideas
    better.

    4 Kinesthetic Learners

    They learn by doing things. They like to move, touch, or try things out. They
    understand better when they use their hands or do activities. Learning with actions,
    like building models or acting, helps them remember more than just listening or
    reading.

     assignment 指定作業

     block 積木'
