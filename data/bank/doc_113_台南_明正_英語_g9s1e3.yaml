    stops usually have something to do with the places they sit in. They can be about
    the local famous scene, history or food. Here are a few examples:

    (1) The bus stop that looks like fruit boxes - The bus stop in front of Ligang
    Township Office looks like the fruit boxes used on farms. Farmers usually put
    fruits in these boxes and send them to customers. The idea shows the local fruits
    and farm products, giving the feeling of fresh growth all year round.

     Ligang Township Office 里港鄉公所

    (2) The bus stop with a symbol of basketball - The bus stop is in front the Pintung
    Senior High School. The school’s basketball team have won the HBL championship
    four times. The design stands for their proud moment.

    (3) The bus stop shaped like a first aid kit - This bus stop is right in front
    of Pingtung Hospital. It looks like a first aid kit, showing that it protects
    people''s health. Every family should also have their own first aid kit.

     first aid kit 急救箱

    (4) The idea of this bus stop is from local food. In this town, many people raise
    cows for milk and grow round red beans without using pesticides. You can even
