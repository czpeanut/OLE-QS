  page: 2
  stem: What does 'Bed poverty' mean in the report?
  options:
  - label: A
    content: Children who have uncomfortable beds.
  - label: B
    content: Children whose bed are broken.
  - label: C
    content: Children who have no bed of their own.
  - label: D
    content: Children who likes sleeping on the floor.
  group_stem: 'II. (改編Breaking News English: 2023-10-05)

    www.burnardos.org.uk.

    YOU CAN CHANGE A CHILD''S LIFE

    A study said more than a million children in the UK live in ''Bed poverty''. This
    means they have no bed. Around 700,000 children share beds, and 440,000 sleep
    on the floor. Bed poverty is because people are poorer because the cost of living
    has risen. Food, gas and electricity are more expensive. Even a bed is now a "luxury"
    item for poorer people. Having no bed means children are tired and cannot concentrate
    at school.

    Bed poverty was just one sign that many people there are having a hard time. They
    do not have enough money to buy things to keep their children healthy. Many families
    have to choose between heating and eating. They cannot fix a broken bed. Bed poverty
    is having something to do with children''s mental health. Now, we sincerely invite
    you to donate money to fix the problems.

    For every pound(£1) we spend :

    • 94% helps children and young people who need it the most.

    • Less than 1 % is used for managing money.

    • A little over 5% helps us raise the next £1

     poverty 貧乏

    electricity 電

    concentrate 專心

    mental 心理的

    manage 管理

    donate 捐款

     likely 很可能 afford 負擔'
