- id: doc_113_高雄_光華_國文_g9s1e2_s4_8
  section: 4
  number: 8
  type: single
  page: 7
  stem: 由本篇文章，可了解孟子認為欲王天下，必先注重何者？
  options:
  - label: A
    content: 民生
  - label: B
    content: 民權
  - label: C
    content: 民有
  - label: D
    content: 民族。
  group_stem: '4.

    孟子曰：「不違農時，穀不可勝（1）食也；數罟（2）不入洿池（3），魚鱉不可勝食也；斧斤以時（4）入山林，材木不可勝用也。穀與魚鱉不可勝食，材木不可勝用，是使民養生喪死無憾也。養生喪死無憾，王道之始也。

    五畝之宅，樹之以桑，五十者可以衣帛矣；雞豚狗彘（5）之畜，無失其時，七十者可以食肉矣；百畝之田，勿奪其時，數口之家，可以無飢矣。謹庠序之教，申之以孝悌之義，頒白（6）者不負戴於道路矣。七十者衣帛食肉，黎民不飢不寒，然而不王者，未之有也。」

    （孟子 梁惠王上）

    注釋：（1）勝 ：盡、完全。 （4）以時：按一定的季節。

    （2）數罟：音ㄘㄨˋ ㄍㄨˇ，細密的網。 （5）彘 ：音ㄓˋ，豬。

    （3）洿池：停積不流的水池。洿，音ㄨ。 （6）頒白：頭髮花白。'
