  stem: 根據本文文意，作者兩次遊歷煙霞洞，其觀感如何？
  options:
  - label: A
    content: 傭奴事先安排几席，盡興而歸
  - label: B
    content: 不滿意傭奴的安排，因而敗興而歸
  - label: C
    content: 因石屋涼沁入骨且歪斜不正，難以入內觀賞，敗興而歸
  - label: D
    content: 因遊客吵雜，因而悵然而歸。
  group_stem: '5.

    煙霞洞，亦古亦幽，涼沁入骨，乳汁涔涔下。石屋虛明開朗，如一片雲，欹 (1)側而立，又如軒榭(2)，可布几席。余凡兩過石屋，為傭奴所據，嘈雜若市，俱不得意而歸。

    （袁宏道煙霞洞小記）

    注釋（1）欹：音ㄑㄧ，不正。

    （2）軒榭：軒，長廊。榭，臺上有屋的建築物。'
