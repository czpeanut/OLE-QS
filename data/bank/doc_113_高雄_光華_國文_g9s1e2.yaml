  section: 4
  number: 3
  type: single
  page: 6
  stem: 根據本文，如果能夠心中常養一分春，就能達到何種境界？
  options:
  - label: A
    content: 君子有終身之憂
  - label: B
    content: 無入而不自得
  - label: C
    content: 不戚戚於貧賤，不汲汲於富貴
  - label: D
    content: 先天下之憂而憂，後天下之樂而樂。
  group_stem: '2.

    人的心境很奇妙，往往移情入物，終至物我兩忘，而情趣盎然。有時會受外界環境的刺激，自身情緒的波動，呈現緊張狀態。有時又浪靜風平，光風霽月，能靜觀萬物而自得其樂，出現富有彈性的快適心境。有時雖年事已高，但發憤忘食，樂以忘憂，仍然有生命的小陽春的樂趣。有時雖在青春年少，但落落寡合，鬱鬱寡歡，呈現一片春天裡的秋天。大抵心境因人而異，因情緒而變，因年齡而移。不過，變異中也有不變者在，那就是對宇宙萬物的欣賞態度，對宇宙萬物的同情了解，它超乎功利境界，超乎道德境界，而進乎自然境界。凡是有自然境界的人，猝然臨之而不驚，無故加之而不怒，心中常養一分春，無往而不適，無遇而不安，具別才別趣，有藝術家的坦蕩胸襟，到處都是生活的情趣。

    （左海倫 心中常養一分春）'
