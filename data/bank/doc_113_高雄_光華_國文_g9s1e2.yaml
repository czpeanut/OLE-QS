  section: 4
  number: 5
  type: single
  page: 7
  stem: 整篇文章中，作者皆以第二人稱「你」稱呼本文主角。請問下列何者最可能是他採用此方法寫作的原因？
  options:
  - label: A
    content: 因記錄的是其他人的故事
  - label: B
    content: 以此方法同時和自己對話
  - label: C
    content: 化身局外人公正地記述本文
  - label: D
    content: 使文章更具真實性、故事性。
  group_stem: '3.

    天色是一派陰霾，群山連綿高聳地俯視著你孤單的身影。你一悶腦就騎了三個小時，才停靠在山腰一處極佳的風景庭臺，遙望魯朗地區的古柏冷杉大片大片浮貼在高拔的山脈上。在那寧靜雄壯的視野裡，你彷彿經歷一場豪華的寂寞。

    回神以後，你注意到一位身軀佝僂的老人也正在此歇腳，你與他眼神偶有交會，可兩者似乎都並不打算招呼對方……山勢蜿蜒復蜿蜒，你勉強過了一道又一道，終於追趕上那先行離去的老人，他步行的速度竟和你騎行加推車的速度不分軒輊，你們兩人彷彿都很在意對方的存在但又裝作忽略。你與他彼此相互超越對方兩個回合，才完全擺脫他如鬼魅般的身影。

    情緒因疲憊落寞了下來，你似乎連推車的氣力都將用盡了，甚至還挺不直腰身，最後你只好把身體的重心前傾壓在車頭把上，能走多遠便算多遠。山勢仍舊不斷翻高，積雪已經覆蓋了整個路面。你努力去想些讓自己振奮精神的話，卻如何也激不起自己的心志，彷彿惶惑地掉入一場虛無，虛無到自己不知為什麼目的而走。

    心緒在搖擺搖擺，有聲音在呼喚、對抗。你開始懦弱想藉著受傷和雪勢增強的理由，說服自己去攔下過路的汽車，讓車子輕輕鬆鬆載你到下個據點。時間並不等待你遲緩的腳步，你完全無法使自己停住不動，萬一都沒有車來該怎麼辦？你仍處在半騎半推的風雪裡前行。你想至少，至少當體力全然耗盡了，你昏迷跌倒了，或許，或許你就不用再如此鞭策自己脆弱的心。

    果真就那麼難得經過兩輛卡車，司機們竟都只是放慢速度在車窗前，好奇凝視你孤落的身影一會兒便揚長而去。你曾露出渴望的表情盯著他們，可是你始終就伸不起手向他們求援。如果你高舉起手呢？是不是你求援的神色不夠真摯？你不知道那些人究竟會不會搭載你，如果會的話，這一切是否將變得完全不一樣？你將不會在這裡受苦，或，現在你已經在哪一處溫暖的地方休息了。

    你打開腰包裡的相機，放眼向喜瑪拉雅和念青唐古拉山脈交錯之處望去，那高原的脊骨上聽說傲立著一座七千七百八十二米的南伽巴瓦雪峰，西與藏東橫斷山脈對接，藏人視他為最權威的山神，說這位大神手下掌握了十八位兵雹神將，三百六十位隨從。他頭戴白盔，身披白甲，一手持鞭，一手仗劍，曾與密宗大師蓮花生竭力鬥法，阻止蓮花生入藏傳法，但最終仍遭收服，歸入藏傳佛教的護法系統，守護著西藏的北方。

    能不能從他身上得到些倚靠和慰藉？風在狂飆，視線被大雪縱橫切割，你被凍到幾乎都聽不見風的聲音，更辨識不了五指外的景象。儘管如此，你還是拆開鏡頭護蓋，立起腳架，但相機耐不過天寒，完全罷工。你本想用影像為這樣的苦行和日子做些見證，失去科技的便利後，你便只能重新索求於原始，勉強睜著眼睛把舉目所見，深深銘刻在腦海裡。

    （選自謝旺霖 轉山 行路難遠流出版公司）'
