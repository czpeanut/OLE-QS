  - label: D
    content: 纖維素；蛋白質。
  group_stem: '(七) 鳳梨為什麼「咬舌頭」？

    一般人的生活經驗中，吃鳳梨時會覺得澀澀的，或是有「咬舌頭」的感覺，那是因為鳳梨中的A 酵素在作祟。這種酵素能「溶解」肌肉組織，這也是吃了鳳梨之後，舌頭常有刺激感，吃多了甚至會讓人覺得不舒服。也因這種酵素能分解肉類，所以常作為肉類加工食品中使用的「嫩精」，
    然而，有胃潰瘍症狀（胃壁受到損傷）的人不適合吃鳳梨，並且，食用鳳梨時最好在吃完飯的不久後，若在兩餐之間或餐前食用，較易使得胃壁受損。請依上述文章，回答下列問題：'
