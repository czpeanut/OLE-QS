- id: doc_113_台中_順天_國文_g7s1e1_s3_49
  section: 3
  number: 49
  type: single
  page: 4
  stem: 下列何者與本文的主旨最接近？
  options:
  - label: A
    content: 善用時間，才是人生的贏家
  - label: B
    content: 要在車上專心閱讀
  - label: C
    content: 人要有高遠的目標，才能致富
  - label: D
    content: 早起的鳥兒有蟲吃。
  group_stem: '日本上智大學的渡部昇一教授，在他所著的知識生活的藝術裡提到他的一位朋友A君。A君把他一生的希望都寄託在每天必搭第一班車去上班這件小事上，他覺得若非如此，則將跟一般人一樣過著平凡的生活。

    A君年輕時家無恆產，住在離上班地方很遠的郊區，搭電車要一個半鐘頭的時間才能抵達公司。他每天不到五點就出門，去搭乘客稀少的第一班車。車子發動後，他在安靜、寬敞而清爽的車內專心閱讀各種對他有益的著作。抵達上班地點，門還未開，但他已事先關照過門房，所以門房也都能特別為他開門。

    在進入空無一人的辦公室後，他從保溫瓶裡倒出紅茶，吃一頓簡單的早餐。吃完早餐才七點不到，於是他攤開書本和稿紙，開始翻譯，一直翻譯到公司上班的時間——早上九點。當別人來上班的時候，他已經完成了一大堆工作。

    渡部昇一非常讚賞A君善用時間的方法。因為每天同樣要起床、搭車上班，與其晚起而和大家擠沙丁魚，不如早起搭第一班車，既輕鬆又可利用坐車的時間專心讀書，這樣日積月累下來，就會有它驚人的成果。原來別無恆產的A君，後來在大東京都內擁有四千坪的私人宅邸。

    在日常生活常規上的一個小小改變，往往能帶來巨大的收穫；當然，最重要的還是要持之以恆。A君把一生最大的希望寄託在搭第一班車上頭，這是他靠自己的力量就可以辦到的。他辦到了，結果就有了與一般人不一樣的不平凡人生。

    搭第一班車上班雖未必是為了致富，但卻是實現人生各種目標的一個可行方式。

    （王溢嘉 搭第一班車上班的人）'
