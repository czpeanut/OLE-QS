  group_stem: '先生①死,曾子與門人往弔之。其妻出戶,曾子弔之。上堂,見先生之尸在牖下,枕墊席槁②,縕袍不表③,覆以布被,首足不盡斂。覆頭則足見,覆足則頭見。曾子曰:「邪④引其被,則斂矣。」妻曰:「邪而有餘,不如正而不足也。先生以不邪之故,能至於此。生時不邪,死而邪之,非先生意也。」曾子不能應,遂哭之曰:「嗟乎,先生之終也!何以為諡?」其妻曰:「以康為諡。」曾子曰:「先生在時,食不充虛,衣不蓋形。死則首足不斂,旁無酒肉。生不得其美,死不得其榮,何樂於此而諡為康乎?」其妻曰:「昔先生君嘗欲授之政,以為國相,辭而不為,是有餘貴也。君嘗賜之粟三十鍾,先生辭而不受,是有餘富也。彼先生者,甘天下之淡味,安天下之卑位。不戚戚於貧賤,不忻忻⑤於富貴。求仁而得仁,求義而得義。其諡為康,不亦宜乎!」曾子曰:「唯斯人也而有斯婦。」

