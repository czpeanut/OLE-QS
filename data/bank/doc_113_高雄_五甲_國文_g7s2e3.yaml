  stem: 「種豆南山下,草盛豆苗稀。晨興理荒穢,帶月荷鋤歸。道狹草木長,夕露沾我衣。衣沾不足惜,但使願無違。」(陶淵明歸園田居其三)關於此詩的說明,下列何種正確?
  options:
  - label: A
    content: 這是一首五言律詩,韻腳為稀、歸、衣、違
  - label: B
