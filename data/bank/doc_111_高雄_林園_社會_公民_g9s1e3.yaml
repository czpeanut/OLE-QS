  number: 39
  type: single
  page: 1
  stem: 小浩在政府網頁上，看到我國政府發行的鈔票上特別設計了「水印」及「窗式安全線」等特徵，可用來分辨真假鈔。請問：我國的貨幣必須由政府負責發行的原因為下列何者？
  options:
  - label: A
    content: 民間缺乏財力設備
  - label: B
    content: 政府籌措建設經費
  - label: C
    content: 因應國際合作需要
  - label: D
