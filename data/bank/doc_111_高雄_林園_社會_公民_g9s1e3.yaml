- id: doc_111_高雄_林園_社會_公民_g9s1e3_s1_36
  section: 1
  number: 36
  type: single
  page: 1
  stem: 某家速食店在2018 年開放使用信用卡付款，發行儲值卡(例如：點點卡)，而後又陸續接受4 大電子票證(悠遊卡、一卡通、icash、有錢卡)與LINE
    Pay 交易，使交易方式多元、便利。請問：上述未提及下列何項交易方式？(習作)
  options:
  - label: A
    content: 塑膠貨幣
  - label: B
    content: 行動支付
  - label: C
    content: 電子支付
  - label: D
    content: 商品貨幣
  answer:
  - D
  answer_source: answer_key_vlm
- id: doc_111_高雄_林園_社會_公民_g9s1e3_s1_37
  section: 1
  number: 37
  type: single
  page: 1
  stem: 小龍發現看的報紙標題缺了一角，只能看出「無現金社會不遠！○○○○比例逐年增加，嗶經濟成市場主流」。請問○○○○最可能為下列何項內容以及判斷理由？(習作)
  options:
  - label: A
    content: 紙鈔支付，因為增加現金使用
  - label: B
    content: 行動支付，因為增加現金使用
  - label: C
    content: 行動支付，因為減少現金使用
  - label: D
    content: 錢幣支付，因為減少現金使用
  answer:
  - C
  answer_source: answer_key_vlm
- id: doc_111_高雄_林園_社會_公民_g9s1e3_s1_38
  section: 1
  number: 38
  type: single
  page: 1
  stem: 某公司員工發現，公司加班費未依法律規定給付，甚至規定遲到1 分鐘就扣100 元。儘管老闆出面澄清，加班費都有照規定給付，而會對員工遲到行為作出懲罰，是因為其出勤狀況不佳。不過，勞工局表示，遲到罰錢須按薪資比例計算，否則即屬違法。勞工局所說的法律是哪部法律？(習作)
  options:
  - label: A
    content: 憲法
  - label: B
    content: 民法
  - label: C
    content: 勞動基準法
  - label: D
    content: 性別工作平等法
  answer:
  - C
  answer_source: answer_key_vlm
