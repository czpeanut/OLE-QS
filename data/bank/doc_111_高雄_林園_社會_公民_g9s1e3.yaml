- id: doc_111_高雄_林園_社會_公民_g9s1e3_s1_44
  section: 1
  number: 44
  type: single
  page: 1
  stem: 每年農曆春節前，許多人都會前往銀行排隊領錢，而銀行也為了因應發紅包習俗，準備了大量的新鈔供應民眾，甚至還提供「舊鈔換新鈔」的服務。關於我們現在所使用的貨幣，下列何者不正確？
  options:
  - label: A
    content: 我國貨幣有紙鈔與硬幣
  - label: B
    content: 我國貨幣具有法律強制接受的特性
  - label: C
    content: 我國由中央銀行負責發行貨幣
  - label: D
    content: 儲值卡是常見的交易媒介，屬於法定貨幣
  answer:
  - D
  answer_source: answer_key_vlm
