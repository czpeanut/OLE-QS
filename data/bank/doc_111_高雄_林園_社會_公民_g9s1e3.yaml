  answer:
  - D
  answer_source: answer_key_vlm
- id: doc_111_高雄_林園_社會_公民_g9s1e3_s1_40
  section: 1
  number: 40
  type: single
  page: 1
  stem: 小真和表姊相約去電影，兩人各自(甲)花費300 元。之後他們出去逛書店，表姊本來想(乙)以現金350 元買該電影原著。小真則建議表姊(丙)以信用卡方式購買，既有利率優惠又可先享受後付款。表姊認為這樣可以(丁)省下一點錢來儲蓄，於是接受了此項建議。請問依據上述內容，下列關於貨幣功能的對應關係，何者最正確？
  options:
  - label: A
    content: 甲：具有交易媒介性質
  - label: B
    content: 乙：屬價值儲存的方式
  - label: C
    content: 丙：可以衡量商品價值
  - label: D
    content: 展現延期償債特性
  answer:
  - A
  answer_source: answer_key_vlm
