  section: 1
  number: 43
  type: single
  page: 1
  stem: 某公司員工因為懷孕期間請產假，考績因此被評為丙等，他認為此一處分不合法，反遭人資表示「去勞動局申訴、提告啊！」該市勞動局對此進行調查與審議後，認定該公司違法，依法開罰2
    萬元並限期改善。對此事件，下列敘述何者正確？
