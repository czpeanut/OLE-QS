    丙:$\sqrt{64}=\pm 8$

    丁:$\sqrt{(-5)^{2}}=-5$

    戊:若$a$為任意數，則$\sqrt{a^{2}}=|a|$

    己:$4\frac{16}{25}$的平方根為$\pm 2\frac{4}{5}$

    以上敘述有幾個正確？'
