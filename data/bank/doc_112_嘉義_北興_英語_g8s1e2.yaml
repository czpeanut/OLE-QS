  group_stem: 'Laura Metcalfe, a call handler of 999 in England, got a call from a
    four-year-old girl.

    Laura: Hello, 28. 999. How may I help you?

    Mila: It’s Mila. Mama needs help. Please. (Mila cries.)

    Laura: Don’t cry, dear. What’s going on? Is your Mama OK? Where’s she?

    Mila: She fell when she was going up the stairs.

    Laura: May I talk to her now?

    Mila: No, you can’t. She’s sleeping.

    Laura: She’s sleeping? Can you wake her up?

    Mila: No, I can’t.

    Laura: Why not? 29.

    Mila: Oh, her head is bleeding. (Mila cried again.)

    Laura: Listen, Mila. We want to help your mama. Tell me your telephone number
    now. I’ll ask the police to go over to your house.


    After Laura 30. Mila, she called the police. And the police went to Mila’s house
    right away.

    Because of Mila’s phone call, 31. . Mila’s mother is getting better now. She thinks
    her daughter is very smart. “ I’m happy. Mama’s better now. I love my mama,” Mila
    said.


