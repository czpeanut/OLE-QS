  group_stem: "做事喜歡拖拖拉拉的人和行動派之間到底哪裡不一樣？曾有心理學家指出，有人喜歡做事一拖再拖，並非時間管理出了問題，而是和情緒管理有關。\n\
    \ 德國 波鴻魯爾大學研究人員找來一群受試者，請他們做完核磁共振掃描後，再完成一份量表，評估他們控制行動和衝動的能力，據此判定受試者是拖拉派還是行動派。分析完資料後發現，拖拉派的杏仁核比行動派的要□。\n\
    \ 杏仁核負責產生情緒，也是讓我們在緊急情況下即時反應的區域。通常杏仁核會依外在刺激選擇最適當的行為反應，但當我們曾有不好的經驗，杏仁核也會抑制可能導致不良後果的舉動。擁有較□杏仁核的人容易擔心做了某項動作之後的負面結果，他們喜歡維持現狀，這讓他們更傾向猶豫或拖延事情。\n\
    \ 杏仁核較大的人可能較容易從個人過去經驗學到教訓，並廣泛應用在評估行為未來可能引發的後果。維持現狀、猶豫不決或拖延事情可讓他們避開風險，喜歡拖拖拉拉的人或許不像大家想像中那樣懶散或沒有野心。\n\
    \ 該研究團隊雖指出個體控制行動的差異和杏仁核的大小有關，但也認為還需要更進一步的探討來支持論述結果。\n （改寫自地球圖輯隊 做事拖拖拉拉，可能是情緒管理出問題）"
