  stem: 飽受失眠之苦的員瑛，除了調整日常作息之外，根據本文也可推荐她嘗試哪一項運動，最能改善此問題？
  options:
  - label: A
    content: 跳韻律操
  - label: B
    content: 練深蹲
  - label: C
    content: 打籃球
  - label: D
    content: 仰臥起坐。
  group_stem: '運動好處多

    羅家倫說：「健康的體力，是一生努力成功的基礎。」以下是運動好處多的介紹，請閱讀內容後，回答各問題。


    | 分類 | 無氧運動 | 有氧運動 |

    | --- | --- | --- |

    | 介紹 | 無氧運動的強度較高，大多是在肌肉缺氧狀態下進行的劇烈運動。過程中會感到無法講話，且難以順暢平緩地呼吸，一般只能維持較短的時間。另外它又稱「肌力運動」，能促進肌肉的生長循環而增加肌肉量。
    | 有氧運動的強度較低，持續時間也較長，過程中會大量消耗氧氣產生能量，是一種在氧氣充足供應的情況下，進行長時間有節奏的運動模式。一般而言，它是最能簡單消耗卡路里的運動方式。
    |

    | 常見項目 | 重量訓練、短跑、拔河、籃球、深蹲、伏地挺身、仰臥起坐、跳高、跳遠、舉重、跆拳道等。 | 慢跑、游泳、騎自行車、騎飛輪、韻律操、登山、跳繩、有氧舞蹈等。
    |

    | 主要優點 | 1.消耗熱量<br>2.提升肌肉量<br>3.提升代謝率 | 1.減重<br>2.提升心肺功能<br>3.緩解憂鬱<br>4.幫助睡眠<br>5.預防骨質疏鬆
    |

    | 減重效益 | 可增加肌力，同時促進身體代謝率，達成身材勻稱。 | 能直接幫助身體消耗脂肪，增加心肺能力。 |


    ＊剛開始運動的人可先從有氧運動做起，提升心肺能力、消耗脂肪。等到減重停滯期，則可加入無氧運動，增加肌力和代謝率，更能提升有氧運動的效率。運動後，要記得補充蛋白質以促進肌肉生長。'
