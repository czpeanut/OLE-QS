  type: single
  page: 7
  stem: 依據本文敘述，作者所謂「耳餐」之義為何？
  options:
  - label: A
    content: 不辨氣味，囫圇吞食
  - label: B
    content: 清淡飲食，著重健康
  - label: C
    content: 珍饈百味，食前方丈
  - label: D
    content: 以耳代口，吃的是食物的名聲。
  group_stem: "何謂耳餐？耳餐者，務名之謂也。貪貴物之名，誇敬客之意，是以耳餐非口餐也。不知豆腐得味，遠勝燕窩；海菜不佳，不如蔬筍。余嘗謂雞、豬、魚、鴨，豪傑之士也，各有本味，自成一家；海參、燕窩，庸陋之人也，全無性情，寄人籬下。嘗見某太守宴客，大碗如缸，白煮燕窩四兩，絲毫無味，人爭誇之。余笑曰：「我輩來吃燕窩，非來販燕窩也。」可販不可吃，雖多奚為？若徒誇體面，不如碗中竟放明珠百粒，則價值萬金矣，其如吃不得何！\n\
    \ （袁枚隨園食單 戒單）"
