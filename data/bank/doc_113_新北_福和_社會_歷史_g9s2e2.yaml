  section: 1
  number: 35
  type: single
  page: 2
  stem: 上文提及「1917 年，美國正式加入第一次世界大戰」，請問原因可能為下列何者？
  options:
  - label: A
    content: 日本高唱「大東亞共榮圈」，威脅美國在太平洋的勢力擴張
  - label: B
    content: 俄國退出協約國，協約國力邀美國，以提升戰力
  - label: C
    content: 墨索里尼揮軍進入衣索比亞，美國大力支援
  - label: D
    content: 德國採取「無限制潛艇政策」，造成美國人生命與財產的損失
  group_stem: '在日常生活中，許多女性熟悉的衛生用品品牌「Kotex」其實誕生於第一次世界大戰的戰場經驗，是一項因應軍事需求而意外誕生的生活發明。

    1917 年，美國正式加入第一次世界大戰。隨著前線戰況升溫，軍中對棉製繃帶的需求大增，但美國本土棉花供應不足，導致醫療單位面臨物資短缺。美國企業金百利克拉克公司（Kimberly-Clark）於是開發出一種吸收力強的新型材料「纖維棉」，大量供應軍隊作為繃帶使用。

    然而，真正促成這項產品轉向民用的，並不是戰場上的受傷士兵，而是一戰中在法國服役的美國女護士。她們發現這種纖維棉除了能包紮傷口，也能有效吸收女性生理期的經血，因此開始將其用作個人衛生用途：用繃帶加藥用棉花，製成了最早的衛生棉。衛生棉的發明，無疑是偉大且具有跨時代的意義，更被譽為「二十世紀影響人類的十大發明」之一。戰後，金百利克拉克公司根據這項實際經驗進行改良與設計，於1920
    年10 月推出全球第一款一次性商業化衛生棉品牌「Kotex」（台灣稱「Kotex 靠得住」）。'
