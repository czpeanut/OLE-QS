- id: doc_113_新北_福和_數學_g8s1e3_s2_19
  section: 2
  number: 19
  type: single
  page: 3
  stem: 根據統計顯示，2 月使用悠遊卡 40 次以上 的旅客約為占所有旅客的比例為何？
  options:
  - label: A
    content: 48%
  - label: B
    content: 52%
  - label: C
    content: 58%
  - label: D
    content: 42%
  group_stem: '(一)

    某捷運公司在1 月和2 月分別調查了旅客每月使用悠遊卡搭乘捷運的次數，並根據調查結果繪製了「累積相對次數分配折線圖」。該公司計劃針對高頻次搭乘的旅客提供回饋，以鼓勵更多旅客選擇搭乘捷運。為了制定最有效的補助及行銷策略，公司需要詳細了解1
    月與2 月的關鍵分佈情形。這項調查數據將幫助公司識別出不同搭乘頻次的旅客群體，根據每月不同搭乘次數的旅客提供不同比例的回饋金，這些回饋措施預期將有效提高旅客的搭乘次數，進一步提升公司的客運量。請根據下圖「累積相對次數分配折線圖」及右方表格，回答以下問題。


    | 當月搭乘次數 | 回饋金 |

    |---|---|

    | 10～20 | 10％ |

    | 20～30 | 15％ |

    | 30～40 | 20％ |

