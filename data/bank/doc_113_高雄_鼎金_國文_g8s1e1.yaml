    title: 我在圖書館的一天
    basis: 題目指名「我在圖書館的一天」
- id: doc_113_高雄_鼎金_國文_g8s1e1_s4_16
  section: 4
  number: 16
  type: single
  page: 2
  stem: 「對於每個人來說，最早的日子就是今天，最早的時刻就是此時此刻。沒時間去抱怨，更別問來不來得及，很多地方，走著走著，你就會發現其實也並沒有那麼難以到達。最差的結果，不過是晚一點看到路上的風景而已。況且，上天從不會辜負一個努力的人。」這段文字的涵義，與下列何者最接近？
  options:
  - label: A
    content: 天無絕人之路
  - label: B
    content: 天道酬勤，天助自助
  - label: C
    content: 謀事在人，成事在天
  - label: D
    content: 天下本無事，庸人自擾之。
- id: doc_113_高雄_鼎金_國文_g8s1e1_s4_17
  section: 4
  number: 17
  type: single
  page: 2
  stem: 「小仁經過海邊，正好目賭一艘大船被海浪打翻，船上所有乘客全掉進海裡無一倖存。小仁忿忿不平，叨念著：『天神啊！祢真是太不公平。只為了懲罰一個罪人，居然要全船的人陪葬！』在說話的當兒，一隻螞蟻爬上他的腳背咬了他一口。小仁痛得舉起腳來朝地上的螞蟻踩去，許多螞蟻都被他踩死了。天神現身，並且拿出神杖敲打小仁，說：『看看你現在的行為，有什麼資格責備別人呢？』」下列哪句話不適合規勸小仁？
  options:
  - label: A
    content: 君子求諸己，小人求諸人
  - label: B
    content: 以言責人甚易，以義持己實難
  - label: C
    content: 不寬容別人，不配接受別人的寬容
  - label: D
    content: 要刮別人的鬍子之前，先把自己的刮乾淨。
- id: doc_113_高雄_鼎金_國文_g8s1e1_s4_18
  section: 4
  number: 18
  type: single
  page: 3
  stem: 「時間，抓起了就是黃金，虛度了就是流水；書，看了就是知識，沒看就是廢紙；理想，努力了才叫夢想，放棄了只是妄想。努力，雖然未必會收穫，但放棄，就一定一無所獲。」這句話的涵義與下列何者相去甚遠？
  options:
  - label: A
    content: 細節決定命運，態度決定高度
  - label: B
    content: 一寸光陰一寸金，寸金難買寸光陰
  - label: C
    content: 如果你再不努力，一年後的你還是原來的你
  - label: D
    content: 再好的機會，要靠人把握，而努力至關重要。
- id: doc_113_高雄_鼎金_國文_g8s1e1_s4_19
  section: 4
  number: 19
  type: single
  page: 3
  stem: 「當一個人已經看清了真相，那麼他既不會悲觀，也不會樂觀，他只是靜觀。」下列何者的心態與這句話相去甚遠？
  options:
  - label: A
    content: 人生到處知何似，應似飛鴻踏雪泥
  - label: B
    content: 萬物靜觀皆自得，四時佳興人同
  - label: C
    content: 回首向來蕭瑟處，歸去，也無風雨也無晴
  - label: D
    content: 一壺濁酒喜相逢，古今多少事，都付笑談中。
- id: doc_113_高雄_鼎金_國文_g8s1e1_s4_20
  section: 4
  number: 20
  type: single
  page: 3
  stem: 「人面原不如那紙製的面具喲！你看那紅的、黑的、白的、青的、喜笑的、悲哀的、目眥怒得欲裂的面容，無論你怎樣的褒獎、怎樣嫌棄，它們一點也不改變。紅的還是紅，白的還是白，目眥欲裂的還是目眥欲裂。人面呢？顏色比那紙製的小玩意兒好而且活動，帶著生氣。可是你要褒獎他的時候，他雖然是很高興，臉上卻裝出很不願意的樣子；你指謫他的時候，他雖是懊惱，臉上偏要顯出勇於納言的顏色。人面到底是靠不住啊！我們要學面具，但不要戴它，因為面具後頭應當讓它空著才好。」根據本文，下列敘述何者錯誤？
  options:
  - label: A
    content: 作者稱讚面具，是因為面具比人面來得表裡如一
  - label: B
    content: 文中主張人面要學習面具，喜怒哀樂要誠實表現
  - label: C
    content: 戴面具的真正用意是不希望心事被別人一眼看穿
  - label: D
    content: 作者指出人臉表現出的表情常常非此人的真正心情
- id: doc_113_高雄_鼎金_國文_g8s1e1_s4_21
  section: 4
  number: 21
  type: single
  page: 3
  stem: 「我們的快樂，源於內心的真實，做最好的自己；我們的不幸，皆因浮躁著靈魂，攀比著別人。每個人都有長處，亦有軟肋，艷羨別人的風光，追尋身外的幸福，盡屬愚者之舉。世間沒有兩片相同的樹葉。你再不堪，也是獨一無二，無須自輕自賤。生命之要義，要傾聽自己心靈的聲音，做個不雷同的人。」此段文字的含意，與下列何者相似？
  options:
  - label: A
    content: 塞翁失馬，焉知非福
  - label: B
    content: 尺有所短，寸有所長
  - label: C
    content: 他山之石，可以攻錯
  - label: D
    content: 各以所長，相輕所短。
- id: doc_113_高雄_鼎金_國文_g8s1e1_s4_22
  section: 4
  number: 22
  type: single
  page: 3
  stem: 「隱瞞實情是報紙一貫的做法。在未有報紙之前，封鎖新聞可比登天還難。可是隨著報紙的問世，卻產生出了一種新的權威說法，一種印成文字的論述，被某些人用來威嚇、壓制另一種更為自然的表達方式。」這段文句所表達的意涵為何？
  options:
  - label: A
    content: 報紙以威權式手段，封鎖人們對於事情真相的探求
  - label: B
    content: 報紙以不公正的角度，導引著整體社會的價值取向
  - label: C
    content: 威嚇與壓制是現在報紙最自然的一種表達方式
  - label: D
    content: 透過報紙，我們可以更自由的表達自己的言論。
- id: doc_113_高雄_鼎金_國文_g8s1e1_s4_23
  section: 4
  number: 23
  type: single
  page: 3
  stem: 「愈來愈多的證據顯示，公司損益表是否長期健全與公司員工的健康密不可分，當我們把兩者分開時，無論是個人或整體，我們會付出慘痛的代價。有太多公司到目前仍不明白重視健康的好處，研究結果顯示，美國雇主花在曠職、病假、低生產力上的間接醫療成本，比實際的醫療保健費用高出百分之兩百至三百。」下列何者最符合作者的觀點？
  options:
  - label: A
    content: 資方與勞方往往站在對立的兩邊，職場儼然是戰場
  - label: B
    content: 雇主應強制生病的職員休假，並制定健全的請假規定
  - label: C
    content: 間接醫療成本過高的問題導致醫療保健費用大幅提升
  - label: D
    content: 健康的員工也是公司資產，雇主應該重視員工的健康狀況。
- id: doc_113_高雄_鼎金_國文_g8s1e1_s4_24
  section: 4
  number: 24
  type: single
  page: 3
  stem: 下列文句中，何者沒有語病？
  options:
  - label: A
    content: 電視台為了賺錢，不惜拍一些荒誕無稽的電視劇來喜悅觀眾
  - label: B
    content: 某記者撰寫的新聞稿，錯字連篇，程度之差真令人嘆為觀止
  - label: C
    content: 這一條旅遊路線，可以讓人飽覽大自然巧奪天工的美景
  - label: D
    content: 習慣使人安於現狀，耽於享樂，久而久之容易產生妥協的心態。
- id: doc_113_高雄_鼎金_國文_g8s1e1_s4_25
  section: 4
  number: 25
  type: single
  page: 3
  stem: 「希望金錢能帶給我們和諧，而不是我們向金錢妥協，這就是智慧。」根據這句話，作者對金錢抱持下列何種期望？
  options:
  - label: A
    content: 錢非萬能，但沒錢萬萬不能，所以平時要有存款理財的觀念
  - label: B
    content: 有錢可以買到很多東西，但卻買不到健康，別為了賺錢而賠上健康
  - label: C
    content: 平時要懂量入為出，如此金錢才能細水長流
  - label: D
    content: 「役物莫役於物」才是使用金錢的正確觀。
- id: doc_113_高雄_鼎金_國文_g8s1e1_s4_26
  section: 4
  number: 26
  type: single
  page: 3
  stem: 「一個既有的制度很難改變，如果只改制度而沒有改變制度內的人的觀念，那麼不論制度怎麼周延還是不可能成功，因為任何制度都不可能是滴水不漏，聰明的人就會去鑽制度的漏洞，改革就破功了。」這段話的涵義，與下列何者最接近？
  options:
  - label: A
    content: 人的思想觀念是影響一個制度是否推動成功的要件
  - label: B
    content: 建立了制度也要加以落實，否則最終只能淪為口號
  - label: C
    content: 制度是因人群而存在，所以應符合眾人的需要
  - label: D
    content: 改革可以改變社會風氣，進而帶動人改變舊有思維。
- id: doc_113_高雄_鼎金_國文_g8s1e1_s5_27
  section: 5
  number: 27
  type: single
  page: 4
  stem: 下列有關本文的敘述，何者正確？
  options:
  - label: A
    content: 作者認為中國沒有能與西方歷史上偉大武士政治家媲美的人物
  - label: B
    content: 蔣百里先生認為，李唐的族群特徵是屬於「漢化的胡人」一類
  - label: C
    content: 作者認為，項羽空有高超的戰鬥技藝，卻沒有足夠的政治智慧
  - label: D
    content: 太原是北方躲避戰禍的最佳避風港，故成為唐太宗的發跡之地。
  group_stem: "(一)\n    中國影視文藝作品的皇帝，通常是一副德高望重的樣子，很穩重，缺少像西方歷史上亞歷山大、凱薩、拿破崙一類的政治領袖：既是統帥和政治功業的開創者，自身又是具備崇高武德和天才戰鬥技藝的武士，項羽是大家知道擁有高超戰鬥技能的例外\
    \ 但他本身戰略思維的水準以及政治智慧的不足 卻又降低了他作為偉大武士的聲望。而他對俘虜的殘忍，更是一件敗壞武德的不名譽行為。回顧中國歷史，要說在這方面足以與世界上那些偉大武士政治家媲美的人物，非唐太宗\
    \ 李世民莫屬。\n    陳寅恪先生談李唐開創的核心力量及其族群特徵，曾用「胡化的漢人和漢化的胡人」一語，這一論斷可謂精確勾畫出唐太宗時代與地區菁英族群的文化及個性特徵。當時李家所在的太原是北方不同族群勢力交錯，戰爭為生活主要內容的地區，按民國軍事家蔣百里的說法，生活方式與戰鬥方式高度一致。這就決定了唐太宗年幼時代所受的教育，是一種武士化的貴族子弟教育，騎射、戰鬥技能以及戰略的知識，乃成為其日常的功課，而由於戰亂時期，有防衛的城市為各種躲避戰火的遊民集聚之地，而好行動與嚮往功業的性情則又使其對不同的底層人群有接觸的興趣，這些再與其得天獨厚的天才相結合，於是，一個既有天下大局觀，又有高超戰鬥技藝的少年武士就誕生了。……\n\
    \    唐太宗自16 歲正式參加戰鬥，直到29 歲通過政變成為皇帝，這種輝煌武士的青春時代對他的一生事業也有決定性的影響。漫長的戰鬥歲月使其僚屬成為政治利益一體化的團體，而長期戰鬥中形成的戰友感情也給傳統的君臣關係注入了一種難得的夥伴色彩，這也是唐初政治空氣相比其他王朝願為寬鬆的原因之一。\
    \ 更重要的是，和戰略思維的務實、嚴謹與冷靜，也給予他與眾不同的人格和個性訓練，使他的統治更富於人性與理性色彩。可以說，他統治的年代也是中國漫長帝王專制歷史上罕見的思想相對寬容、個性化和文化上開放的年代，這是他作為偉大的帝王經常被後世人們懷念的重要原因。\
    \                                                    —趙楚中國可以媲美拿破崙的皇帝"
