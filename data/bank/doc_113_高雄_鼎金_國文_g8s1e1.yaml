  type: single
  page: 1
  stem: 根據五柳先生傳的文句說明，下列何者錯誤？
  options:
  - label: A
    content: 「好讀書，不求甚解」──廣泛閱讀而強記，意近「讀書之法無他，惟是篤志虛心，反復詳玩， 為有功耳」
  - label: B
    content: 「先生不知何許人也，亦不詳其姓字。宅邊有五柳樹，因以為號焉」──對生平輕描淡寫，暗示 其隱士身分，不逐名利。
  - label: C
    content: 「既醉而退，曾不吝情去留」──突顯五柳先生 率真自得、不拘禮俗的個性
  - label: D
    content: 「常著文章自娛，頗示己志」──撰文寫詩不為 展現文才，只求抒發情志。
  lesson_raw:
    title: 五柳先生傳
    basis: 題目指名「五柳先生傳」
