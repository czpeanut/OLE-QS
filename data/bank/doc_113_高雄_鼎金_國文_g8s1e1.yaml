  stem: 下列關於五柳先生的敘述，何者不正確？
  options:
  - label: A
    content: 「短褐穿結，簞瓢屢空—晏如也。」此句意近於顏回的「一簞食，一瓢飲。在陋巷，人不堪其憂，回也不改其樂。」
  - label: B
    content: 五柳先生傳是一篇以史書傳記形式寫成的記敘文，也是作者的自況
  - label: C
    content: 贊曰：「不戚戚於貧賤，不汲汲於富貴」，是黔婁之妻評論五柳先生的話
  - label: D
    content: 稱揚五柳先生貧賤不移，任真自得的個性。
  lesson_raw:
    title: 五柳先生傳
    basis: 題目指名「五柳先生」
- id: doc_113_高雄_鼎金_國文_g8s1e1_s4_15
  section: 4
  number: 15
  type: single
  page: 2
  stem: 關於我在圖書館的一天文句說明，下列何者錯誤？
  options:
  - label: A
    content: 「北投分館卻讓所有的自然也成了『書』，將閱讀風景延伸至天至地」──意近「善讀書者，無 之而非書。山水亦書也，棋酒亦書也，花月亦書 也」
  - label: B
    content: 「我總是在椅子與椅子間轉換我的靈魂，以攝取 不同的知識。坐上不同的椅子，身體即有迥異的 姿勢，而從姿態大約可嗅出我是在讀什麼樣的書 了」──不同材質、形狀的椅子適合閱讀不同的
      書籍，看書的姿態也呈現多元的氛圍
  - label: C
    content: 「窗子都是推出去的，在層次前後的動線下，推 開的窗戶有如波浪般延展而去。午後的陽光被裁 切成幾何圖案，讀書人此時晒書也晒心」──陽 光推開鏤刻著幾何圖案的窗櫺，讀書人依循層次
      前後的動線，走在波浪般的木棧道上
  - label: D
    content: 「作家將筆挖入記憶寶盒與人性雷區，甚至進 入死亡之境，這得具有女巫之眼與靈媒之手」── 作家與女巫都具有敏銳的心思與洞察力，善於探索生命和人性。
