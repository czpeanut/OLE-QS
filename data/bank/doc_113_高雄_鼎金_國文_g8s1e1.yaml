- id: doc_113_高雄_鼎金_國文_g8s1e1_s5_30
  section: 5
  number: 30
  type: single
  page: 4
  stem: 本文歸納出酸民可能產生的原因，下列敘述何者不包含？
  options:
  - label: A
    content: 通常會對與自己不分軒輊的人做言語攻擊
  - label: B
    content: 自卑感作祟，對於自己的能力較缺乏自信
  - label: C
    content: 通常藉由發言尋求認同感，以互相取暖
  - label: D
    content: 缺乏理性的態度，容易為了反對而反對。
  group_stem: "(二)\n現在是網路迅速崛起的時代，論壇和社群媒體的興起充分提供了人們評論和發表自己意見的機會，然而也造就了「酸民」的誕生。「酸民」，字面上的意思即是「愛酸人的鄉民」，在新聞時事中，只要不合己意，就會有酸民出現。而究竟為什麼會有酸民這樣的現象產生呢？從社會心理學的角度來看，酸民的行為是「心理防衛機制」的作用，佛洛依德的文章防禦性神經精神病中列出了28\
    \ 種心理防衛機制，而酸民是相似於其中的「攻擊性防衛機制」，意指藉由轉移的方式來發洩自己的不安與憤怒，以提升自我肯定。也曾有臨床心理師對此表示，當內在的不滿和不平衡，或是對某些對象、現象或事件的情感、情緒無法直接表達時，有些人就會將這種負面情緒轉移到較為安全與方便宣洩的對象身上，藉此減輕自己心中的焦慮。\n\
    有一種說法是，酸民在現實生活中沒有太引以為傲的成就，對自己不夠有自信，所以會藉由在網路上攻擊別人，來獲得自信。我們也可以發現，酸民攻擊的，大多是那些成功人士。就拿以下所舉的例子來說，為何大型頒獎典禮表演嘉賓總是容易被批得一無是處？或許是酸民忌妒那些當紅歌手擁有的成就，只好藉由批評別人來證明自己的能力；抑或是本身就對這位人士抱持偏見，為反而反,想爭取同意票來找到存在及歸屬感，互相取暖。\n\
    或許有人會認為,為什麼不能酸?不能在網路上自由發表意見，就等於是在扼殺言論自由。然而，究竟酸民文化是在落實言論自由，還是濫用言論自由？哲學家約翰彌爾曾說:「人們確實應該要有表達言論的權利，並不是因為表達言論很爽，而是因為在社會當中，讓大家自由表達言論，最終對大家都有好處。」我認為，真正的言論自由是建立在批判辯論的同時，提出中肯而有建設性的提議，而非只是「為酸而酸，想酸就酸」，形成糟糕的社會風氣。\n\
    \                                                                            \
    \        —改寫自關鍵評論網"
