  stem: 「人和書很近也很遠。近的是，書隨意可得；遠的是，美麗的風景常讓我分心，因而忘書。」根據這段文字，下列說明何者正確？
  options:
  - label: A
    content: 圖書館內藏書唾手可得，人與書籍的距離很近
  - label: B
    content: 在圖書館可以任意翻閱各種書籍，甚至神遊其中，讓人忘卻現實煩憂
  - label: C
    content: 圖書館內的寧靜氛圍讓人全身心放鬆專心閱讀，拉近人與書的距離
  - label: D
    content: 美麗的造景容易讓人流連忘返，因此圖書館的設計應以樸實無華為佳。
