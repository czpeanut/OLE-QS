- id: doc_113_高雄_鼎金_國文_g8s1e1_s5_32
  section: 5
  number: 32
  type: single
  page: 5
  stem: 根據本文內容， 以下哪一項不符合作者所說「闕」的境界?
  options:
  - label: A
    content: 了解並欣賞事物都有不完美的一面
  - label: B
    content: 改變心態自然地與不完美和諧共存
  - label: C
    content: 完美與不完美都無損事物本身價值
  - label: D
    content: 缺是為了追求更完美的境界而存在。
  group_stem: '(三)

    「月，闕也。」闕，就是「缺」的意思。

    曾國藩把自己的住所題作「求闕齋」，求缺?為什麼?為什麼不求完美?「闕」有什麼好呢?我不再愛花好月圓了嗎?

    不是的,我只是開始了解花開是一種偶然,但 我同時學會了愛它們月不圓花不開的「常態」。

    《淮南子》寫道大地都是曾經受傷的。女媧以其柔和的慈手補綴撫平了一切殘破。當時天穿了，女媧煉五色石補

    了天。地搖了,女媧折斷了神的腳爪墊穩了四極(多像老祖母疊起報紙墊桌子腿)。

    中國一直相信天地也有其殘缺。但缺陷造成了皺折，皺折造成了奇峰幽谷之美。月亮是不能常圓的，人生不如意

    事十常八九;當我們心平氣和地承認這一切缺陷的時候，我們忽然發覺沒有什麼是不可以接受的，殘缺不但是可以接受

    的，而且是美麗的。

    而月亮，到底曾經真正圓過嗎?人生世上其實也沒有看過真正圓的東西。

    真正的存在於理念之中，而在現實的世界裡，我們只能做圓的「複製品」。月亮的圓也是「方其圓時,即其缺時」。

    此外，我們更可以換個角度看，有盈虛變化的是月光,而不是月球本身。月何嘗圓，又何嘗缺，它只不過像地球一樣不

    增不減的兀自圓著——以它那不十分圓的圓。

    或盈或缺，月總在那裡，不要做一夕的賞月人吧!人生在世哪一刻不美好完滿? 哪一剎不該頂禮膜拜感激歡欣呢?

    因為我們愛過圓月，讓我們也愛缺月吧——它們原是同一個月亮啊!

    ——節選自張曉風〈月,闕也〉'
