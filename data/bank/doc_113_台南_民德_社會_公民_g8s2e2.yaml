  stem: 以往電腦網路並不普及，《刑法》中沒有相關的犯罪與刑責規定，但近年來各種破解他人電腦、取得或刪除甚至變更他人電腦紀錄的「駭客」行為日增，因此立法院修正《刑法》，增訂了與電腦使用相關的犯罪行為，在此項法律增訂之前，相關的行為並不能視為「犯罪行為」、也無法可管，這是因為《刑法》實施應遵循哪個原則？
