- id: doc_113_台南_民德_社會_公民_g8s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 若有人為了在選舉時讓支持的候選人當選，配合動員把戶籍遷移到非實際居住的行政區，企圖影響選舉結果，此種行為可能觸犯《刑法》，檢察官將代表國家主動起訴違法者。根據上述內容判斷，關於某位違法遷移戶籍者在接受偵查、審判的過程中，下列何種情況最可能出現？
  options:
  - label: A
    content: 遭到落選者提起民事訴訟要求損害賠償
  - label: B
    content: 在遭檢察官偵查的過程中度過18 歲生日
  - label: C
    content: 被查出是在投票日的六個月前遷移戶籍
  - label: D
    content: 因為觸犯告訴乃論之罪而受到刑事處罰
- id: doc_113_台南_民德_社會_公民_g8s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 《刑事訴訟法》規範國家以公權力追訴犯罪時應遵守的相關程序。以下法律條文，何者最有可能出現在《刑事訴訟法》中？
  options:
  - label: A
    content: 未滿七歲之未成年人，無行為能力
  - label: B
    content: 行為之處罰，以行為時之法律有明文規定者為限
  - label: C
    content: 檢察官因告訴、告發、自首或其他情事知有犯罪嫌疑者，應即開始偵查
  - label: D
    content: 中華民國人民，無分男女、宗教、種族、階級、黨派，在法律上一律平等
- id: doc_113_台南_民德_社會_公民_g8s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 美國建築師和犯罪學家紐曼（OscarNewman）提出「防衛空間理論」，他認為可以經由改造與重新設計社區環境，增加對犯罪的監控能力，從而降低潛在犯罪行為出現率。上述理論可以呼應哪項刑罰功能？
  options:
  - label: A
    content: 報復犯罪
  - label: B
    content: 矯正犯罪
  - label: C
    content: 處罰犯罪
  - label: D
    content: 預防犯罪
- id: doc_113_台南_民德_社會_公民_g8s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '喜歡追劇的小莉，整理出她所喜歡的三個男性角色，如附表所示。若依據我國法律，針對這三位演員飾演的角色，以下解讀何者正確？

    | 戲劇 | 被告人 | 奇怪的搭檔 | 當你沉睡時 |

    | :--- | :--- | :--- | :--- |

    | 演員 | 池晟 | 池昌旭 | 李鐘碩 |

    | 飾演角色共通點 | ① 穿著鑲紫邊的黑袍<br>② 起訴罪嫌重大之人<br>③ 在法庭上擔任原告 | | |'
  options:
  - label: A
    content: 有權力判決被告有罪
  - label: B
    content: 負責犯罪偵查的工作
  - label: C
    content: 也在民事訴訟中出現
  - label: D
    content: 法庭上地位比被告高
