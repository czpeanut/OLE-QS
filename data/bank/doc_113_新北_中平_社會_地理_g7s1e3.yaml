- id: doc_113_新北_中平_社會_地理_g7s1e3_s1_48
  section: 1
  number: 48
  type: single
  page: 2
  stem: 請問造成上文所提及河港城市衰退最可能的原因是什麼？
  options:
  - label: A
    content: 不同族群之間的械鬥紛爭
  - label: B
    content: 泥沙淤積使河道消失
  - label: C
    content: 過度抽取地下水資源
  - label: D
    content: 人口大量外移至海外
  group_stem: '48.-50.新莊區位於臺北盆地之西緣，原稱新庄。新莊進入有史時代後，先有平埔族的生活棲息，後有漢人進入，促成新莊開拓與新莊之崛起，在農產、航運、港灣等有利條件下，加上商賈之有利可圖，薈聚此地，郊行林立，促成街肆的建立與繁榮，也就是新莊街的形成。而臺灣傳統市街多半為河港城市，新莊、艋舺以及大稻埕，自清朝以來即為某條河川河畔重要的三大河港城市，「前店後住」的傳統街屋形成住、工、商混居的鄰里，然而隨著河運衰退，河港城市先後面臨衰退的命運。

    (素養題)'
