  page: 1
  stem: '「氣溫」是指大氣中空氣的溫度，也就是空氣中熱量的多寡。以下關於氣溫的敘述哪些為正確？(甲)與高度呈現負相關 (乙)與氣壓值高低無關 (丙)與高度呈現正相關
    (丁)臺灣使用單位為攝氏。

    註：

    正相關：兩變項彼此正向變化，數值一同增加或減少。

    負相關：兩變項彼此反向變化，一者數值增加時，另一者則減少。'
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 丙丁
