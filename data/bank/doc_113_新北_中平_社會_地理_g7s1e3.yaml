  stem: 早期屏東縣林邊和佳冬的沿海地區，地層下陷問題最為嚴重。每逢颱風或豪雨過後，這些地區常出現積水不退的情況，甚至對當地居民生活和農業造成了巨大的影響。此區域目前地層下陷的累積量已經超過三公尺，至今仍是全臺地層下陷最嚴重的區域之一。這一現象引發了當地居民與政府的高度關注。請問，造成此地區地層下陷的主要原因與下列何者最為相關？
  options:
  - label: A
    content: 該地地震活動頻繁，影響地層穩定性
  - label: B
    content: 頻繁的強烈颱風和豪雨導致地下水位過度上升
  - label: C
    content: 此區內大規模的工業開發造成地下結構破壞
  - label: D
    content: 長期過度抽取地下水，超過其自然補充量
