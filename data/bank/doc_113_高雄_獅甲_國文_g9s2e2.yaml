- id: doc_113_高雄_獅甲_國文_g9s2e2_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 下列有關莎士比亞對愛情的名言，哪一句較符合羅密歐與茱麗葉樓臺會一文的情況？
  options:
  - label: A
    content: 愛情裡面要是摻雜了和它本身無關的算計，那就不是真的愛情
  - label: B
    content: 不太熱烈的愛情才會維持久遠的愛情
  - label: C
    content: 當愛情小船被浪掀翻時，讓我們友好地說聲再見
  - label: D
    content: 真實愛情的途徑並不平坦。
  lesson_raw:
    title: 羅密歐與茱麗葉樓臺會
    basis: 題目提及羅密歐與茱麗葉樓臺會一文
- id: doc_113_高雄_獅甲_國文_g9s2e2_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: '(甲)鶯鶯燕燕春春，花花柳柳真真，事事風風韻韻。嬌嬌嫩嫩，停停當當人人。<喬吉天淨沙即事>

    (乙)枯藤老樹昏鴉，小橋流水人家，古道西風瘦馬。夕陽西下， 斷腸人在天涯。<馬致遠天淨沙秋思>

    有關這兩首元曲的比較，下列何者是錯誤的?'
  options:
  - label: A
    content: 兩首都是情中有景，語帶雙關，借用典故
  - label: B
    content: 兩首曲的曲牌相同，其格律規定也相同，都是一韻到底
  - label: C
    content: 甲是用春天的美好來形容女子；乙是以「枯、老、昏、古、瘦」等字點染秋天寂寥蕭索
  - label: D
    content: 甲的特色是全部以疊字寫成；乙是前三句用九個詞語，形成「鼎足對」的形式。
- id: doc_113_高雄_獅甲_國文_g9s2e2_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 下列哪一個選項的表現接近賈伯斯「永不滿足，長保傻勁」的概念？
  options:
  - label: A
    content: 精益求精，勇敢追逐夢想
  - label: B
    content: 忍讓堅毅，活用書本知識
  - label: C
    content: 待人處事圓融，大智若愚
  - label: D
    content: 做事認真負責，積極求知。
  lesson_raw:
    title: 永不滿足，長保傻勁---賈伯斯的人生三堂課
    basis: 引用賈伯斯「永不滿足，長保傻勁」
- id: doc_113_高雄_獅甲_國文_g9s2e2_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 「得不到妳的愛，活著也是苟延殘喘，倒不如讓他們的仇恨結束我的生命。」根據這段話，羅密歐表現出何種心意？
  options:
  - label: A
    content: 沒有愛就沒有仇恨
  - label: B
    content: 擁有愛為才是生存之道
  - label: C
    content: 活著也只有仇恨
  - label: D
    content: 好死不如歹活。
  lesson_raw:
    title: 羅密歐與茱麗葉樓臺會
    basis: 引用羅密歐與茱麗葉樓臺會課文原句
- id: doc_113_高雄_獅甲_國文_g9s2e2_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 關於永不滿足，長保傻勁---賈伯斯的人生三堂課一文，下列文句的解讀，何者是正確的?
  options:
  - label: A
    content: 我確信能堅持下去的唯一理由，就是熱愛自己想做的事。因此你必須找到你的最愛—對工作與愛情都是一樣的。----擇你所愛，愛你所擇
  - label: B
    content: '每天早上我攬鏡自問: 「如果今天是生命中的最後一天，我會想做今天要做的事嗎?」---說明他每天都覺得生命將盡，無力面對明天'
  - label: C
    content: 要順著自己的直覺勇往直前，因為你內心早已明白自己未來的方向----強調未來天註定，無論做什麼都無法改變
  - label: D
    content: 不要浪費時間活在別人的陰影裡，不要受教條束縛，不要讓別人的雜音淹沒自己的心聲----鼓勵大家要能服從威權，勇於挑戰威勢。       .
  lesson_raw:
    title: 永不滿足，長保傻勁---賈伯斯的人生三堂課
    basis: 題目提及永不滿足，長保傻勁---賈伯斯的人生三堂課一文
- id: doc_113_高雄_獅甲_國文_g9s2e2_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: 下列關於羅密歐與茱麗葉樓臺會一文中文句的釋義，何者是不正確的?
  options:
  - label: A
    content: 茱麗葉就是太陽---可看出茱麗葉是羅密歐光明的希望
  - label: B
    content: 根本不必對什麼發誓，如果一定要的話，就以你的真誠地自我來發誓吧--- 點出愛情最重要的是誠心，不是花俏動人的言語
  - label: C
    content: 赴情人約會，就像學童拋開書本一樣開心；和情人離別，就像學童上學般心情沉重---表達出情人相聚是的快樂和離別時的惆悵
  - label: D
    content: 啊!千萬不要對著月亮發誓，月有陰晴圓缺，你若對著它發誓，愛情也會像它一樣無常---顯示茱麗葉對月亮的崇拜與無奈。
  lesson_raw:
    title: 羅密歐與茱麗葉樓臺會
    basis: 題目提及羅密歐與茱麗葉樓臺會一文
- id: doc_113_高雄_獅甲_國文_g9s2e2_s1_24
  section: 1
  number: 24
  type: single
  page: 2
  stem: "張姓者偶行溪谷，聞崖上有聲甚厲。尋途登觀，見巨蛇圍如碗，擺撲叢樹中，以尾擊柳，柳枝崩折。反側傾跌之狀，似有物捉制之，然審視殊無所見，大疑。漸近臨之，則一螳螂據頂上，以刺刀攫其首，顛不可去，久之，蛇竟死。視額上革肉，已破裂云。(螳螂捕蛇聊齋誌異)\n\
    \        根據本文，螳螂獲勝的關鍵在於以下何點？"
