    年）成立「大觀學社」；十年後擴建學舍，更名為「大觀義學」，提供漳泉兩族子弟就讀，以立彼此交流。當時的大臺北地區由板橋望去，從淡水河岸到大屯山一帶，主要是漳州人的地盤；而淡水河的另一岸到觀音山一帶，則多為泉州人居住。因此，「大觀」寓有「漳泉一家」之意。板橋原是充滿武鬥氣息的移墾社會，大觀義學創立後，移風易俗，開始出現科舉人才，文風日益鼎盛。除了艋舺、大稻埕與大龍峒等地，板橋也成為大臺北地區的另一個文教中心，更可以說此處就是板橋的文化發源地。    （改寫曾冠傑板橋文教發源地大觀義學）
- id: doc_113_高雄_獅甲_國文_g9s2e2_s2_38
  section: 2
  number: 38
  type: single
  page: 4
  stem: 朱英是個什麼樣的人？
  options:
  - label: A
    content: 一葉障目，不見泰山
  - label: B
    content: 危言聳聽，侃侃而談
  - label: C
    content: 恃寵而驕，阿諛奉承
  - label: D
    content: 見微知著，睹始知終。
  group_stem: 楚太子以梧桐之實養梟，而冀其鳳鳴焉。春申君曰:「是梟也，生而殊性，不可易也，食何與焉﹖」朱英聞之，謂春申君曰:「君知梟之不可以食易性而為鳳矣。而君之門下無非狗偷鼠竊亡賴之人也，而君寵榮之，食之以玉食，薦之以珠履，將望之以國士之報。以臣觀之，亦何異乎以梧桐之實養梟，而冀其鳳鳴也﹖」
    春申君不寤，卒為李園所殺，而門下之士無一人能報者。 (劉基養梟)
