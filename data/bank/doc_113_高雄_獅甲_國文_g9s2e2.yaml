  group_stem: "根據交通部觀光署最新公布的1 月至8 月數據，2024 年國際來台旅客Top10 排行榜，由香港以80.42 萬人次奪下冠軍，日本和韓國則以79.52\
    \ 萬、62.14 萬人次位居第二和第三，而第四名至第十名依序為美國（41.6 萬）、菲律賓（30.07 萬）、馬來西亞（27.6 萬）、泰國（26.19\
    \ 萬）、中國大陸（26,1 萬）、新加坡（25.8 萬5）以及越南（25.4 萬）。\n截至今年8 月為止，港人來台旅遊達到80.42 萬人次，不只在2024\
    \ 國際來台旅客排行中名列第一，更是香港第二年蟬聯「最愛來台」冠軍，同比去年同期的68.9 萬人次成長了不少！由於香港坐飛機來台灣只需要2 小時左右，加上語言、文化相當接近，就算不會說中文也能看得懂繁體字，在溝通上非常方便。而台灣擁有相對便宜的物價、多元美食和便捷交通，也吸引越來越多香港旅客來台，甚至有許多人會在週末來個兩天快閃，值得一提的是，2023\
    \ 年度來台觀光旅客唯一破百萬的地方也是香港，一共有110.45 萬人次造訪，可見香港人真的有在愛台灣！\n        日本身為來台最重要的客源市場之一，今年1\
    \ 月至8 月共有79.52 萬旅客人次來台，位居排行榜亞軍，同比去年的49.31 萬約增長6 成，不過和疫情前2018 年的122 萬相比僅達65%左右。有很大一部份是受到日圓貶值、台幣升值的影響，日人來台旅遊的消費成本提高、整體花費變貴，導致疫情後衰退的日本客市場回溫緩慢。此外，頻繁地震也影響日人來台意願，例如在0403\
    \ 花蓮強震之後，與前一個月相比日本客的42.9%減幅最多，對比今年台日觀光逆差已達300 萬人次，仍有很長的一段路要走！\n    根據統計，東南亞旅客人數比例有顯著增加，主要原因為政府積極推動簡化簽證、旅遊補助和增加航班等新南向政策，促進其旅遊需求的回升，其中泰國、新加坡和菲律賓復甦力度大，今年1月至8\
    \ 月分別以26.19 萬、25.82 萬和30.07 萬來台旅遊人次，正式超越疫情前2018 年水準，未來潛力可期！                (哪國人最愛來台灣玩？2024\
    \ 國際來台旅客排行Top10 網路新聞)"
