  stem: '閱讀「不花腦筋的書」，不用去理會這本書有沒有意義，也不必想讀了後會有什麼收穫。但是人性就像張愛玲在《紅玫瑰與白玫瑰》裡假嬌蕊之口說的:「一個人學會了一樣本事，總捨不得放著不用。」這兩天和妻子去書店看「不花腦筋的書」，忍不住又對一些篇章嚴肅地討論起來，無意間翻到一篇好友甘耀明寫的作品，說是六歲時一段幼稚園的感情。妻子認為那一定是虛構的，而我不禁又開始想，什麼是文學的虛構，為何要虛構，虛構所期待的藝術效果應該是什麼……。唉!我真是太本末倒置了。或者也可以說，世界上可能並沒有「不花腦筋」這回事吧!

