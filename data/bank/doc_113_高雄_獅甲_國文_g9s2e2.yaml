  stem: '請將下列節日詩詞，按照時間先後順序排列：

    (甲)玉漏銅壺且莫催，鐵關金鎖徹明開；誰家見月能閒坐，何處聞燈不看來。(唐·崔液)

    (乙)未會牽牛意若何？須邀織女弄金梭。年年乞與人間巧，不道人間巧已多？ (宋·魏野)

    (丙)暮雲收盡溢清寒。銀漢無聲轉玉盤。此生此夜不長好，明月明年何處看。(宋·蘇軾)

    (丁) 無花無酒過清明，興味蕭然似野僧。昨日鄰家乞新火，曉窗分與讀書燈。(宋·楊朴)'
  options:
  - label: A
    content: 甲乙丙丁
  - label: B
    content: 甲丁乙丙
  - label: C
    content: 甲丙乙丁
  - label: D
    content: 丙丁甲乙。
