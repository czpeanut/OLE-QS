- id: doc_113_高雄_獅甲_國文_g9s2e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: '戴高帽的故事中，師怒曰: 「吾輩直道事人，何須如此!」其人曰: 「天下不喜戴高帽如吾師者，能有幾人歟?」師因此氣消，由此可知，這則故事傳達的意旨為何?'
  options:
  - label: A
    content: 恭維之語無人不愛
  - label: B
    content: 無三不成禮
  - label: C
    content: 見面三分情
  - label: D
    content: 惻隱之心人皆有之。
- id: doc_113_高雄_獅甲_國文_g9s2e2_s1_17
  section: 1
  number: 17
  type: single
