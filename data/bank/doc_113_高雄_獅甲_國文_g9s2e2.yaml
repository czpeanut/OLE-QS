  stem: 根據本文，下列何者解讀最恰當?
  options:
  - label: A
    content: 板橋的林家花園改建成私塾，供泉漳兩族的子弟就讀
  - label: B
    content: 大觀義學是臺北第一個文教中心，是板橋文化發源地
  - label: C
    content: 大臺北地區常發生嚴重的械鬥，是因為婚姻關係失和而造成兩族的宿怨
  - label: D
    content: 「大觀」寓有「漳泉一家」之深意，「大觀」取名應源於「大」屯山與「觀」音山。
  group_stem: 板橋古稱「枋橋」，有一座林家花園，原本是清代大家族的私人園邸，花園旁有「大觀義學」，則是林家為了化解族群衝突、促進教育發展的社會理想的實踐。當時大臺北地區，祖籍福建的泉州人和漳州人為了爭奪土地與水權等問題，常發生嚴重的械鬥。來自漳州的板橋林本源家族，為了消弭兩族的宿怨，由共同掌管家族事業的林維讓、林維源兄弟，將親妹妹嫁給泉州舉人莊正，並與當地紳民出資捐地，於同治二年（西元1863
    年）成立「大觀學社」；十年後擴建學舍，更名為「大觀義學」，提供漳泉兩族子弟就讀，以立彼此交流。當時的大臺北地區由板橋望去，從淡水河岸到大屯山一帶，主要是漳州人的地盤；而淡水河的另一岸到觀音山一帶，則多為泉州人居住。因此，「大觀」寓有「漳泉一家」之意。板橋原是充滿武鬥氣息的移墾社會，大觀義學創立後，移風易俗，開始出現科舉人才，文風日益鼎盛。除了艋舺、大稻埕與大龍峒等地，板橋也成為大臺北地區的另一個文教中心，更可以說此處就是板橋的文化發源地。    （改寫曾冠傑板橋文教發源地大觀義學）
