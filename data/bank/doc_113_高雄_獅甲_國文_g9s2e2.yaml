  stem: 在捍衛性別平權的鬥士---金斯伯格一文中，提到莎拉葛林克的名言:「我從未要求特殊禮遇，我只要求男性同胞把腳從我們的脖子上移開。」這句話的意思是什麼呢?
  options:
  - label: A
    content: 認為「男主外，女主內」的觀念是錯誤的
  - label: B
    content: 認為女性應該比男性得到更多的特殊禮遇
  - label: C
    content: 期待整個社會能優先考慮女性的需求
  - label: D
    content: 希望可以不因為性別而有差別待遇。
