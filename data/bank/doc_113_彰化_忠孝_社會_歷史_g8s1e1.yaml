  section: 1
  number: 33
  type: single
  page: 1
  stem: '歷史老師正在解說一句成語的典故，其內容如下：

    「楚王曾親自率兵北上，攻打周天子都城附近的領地，周天子惶恐不安派使臣慰勞楚王，不料楚王卻向使臣詢問九鼎之大小及輕重，而九鼎是天子權力的象徵，由此可見楚王背後奪權的野心，此即『問鼎中原』這句成語的由來。」由此成語的典故可看出當時的政治局勢出現何種特色？'
  options:
  - label: A
    content: 楚王畏懼周天子的權威
  - label: B
    content: 周天子已經無實質權力
  - label: C
    content: 周天子更穩固封建秩序
  - label: D
    content: 楚王統一六國取代天子
