  section: 1
  number: 39
  type: single
  page: 2
  stem: 以上為大學歷史系史學研討會的三則資料，由內容可知此次研討會的主題應該為下列何者？
  options:
  - label: A
    content: 選才制度的演變
  - label: B
    content: 教育制度的改革
  - label: C
    content: 官員品德的培養
  - label: D
    content: 社會風氣的流轉
  group_stem: '資料一：政府透過開科取士的方式來選拔人才，其中包含：進士、明經、明法、明算等科別，只要有能力者都可以報考，為平民晉升開啟了一道大門。


    資料二：政府授權中正官在地方上進行人物品評，依據士人的才能、德行與家世來區分品級，但之後品評只重家世，結果造成「上品無寒門，下品無世族」的現象。


    資料三：朝廷根據政府的不同需要設立各種科目，包含：「孝子」、「廉吏」等，並指定有關的官員擔任推舉者，依照規定舉薦相應的人才，經朝廷檢定後給予錄用或陞遷。'
