- id: doc_113_彰化_忠孝_社會_歷史_g8s1e1_s1_35
  section: 1
  number: 35
  type: single
  page: 2
  stem: 『佛教在中國獲得接受，這是一種有意識的與儒家傳統和價值的決裂』鋪陳了佛教非中國本土宗教，請問佛教發源於下列何地？
  options:
  - label: A
    content: 日本
  - label: B
    content: 新羅
  - label: C
    content: 印度
  - label: D
    content: 大秦。
  group_stem: '佛教在中國獲得接受，這是一種有意識的與儒家傳統和價值的決裂。對於冷靜、入世、穩健，而且強調家族與政治責任的儒家來說，最無法接受的就是佛教這種出世且借由禁慾苦行擺脫人世紐帶關係的宗教。或許正是佛教與儒家的完全對立，才吸引中國人的注意。當漢朝逐漸失去對國家的掌握，而胡人入侵又為原本悲慘的內戰增添幾許暴力，儒家聖賢講求的節制與禮儀聽在民眾耳裡，覺得這些說法空泛無用。在亂世裡，靈魂需要效果更強的藥方，中國人找到的是佛教。

    （參考資料：威廉麥克尼爾著、黃煜文譯，《世界史》，臺北：商周出版，2013 年。）'
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 歷史
      code: 2-2
      title: 各民族文化的交流與影響
      chapter: 第2章 商周至隋唐時期的民族與文化
    textbook: 八上歷史 2-2 各民族文化的交流與影響
    labeled_by: ai
