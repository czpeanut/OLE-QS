  stem: 徐志摩曾經在西湖記中寫到「數大便是美」。在我所知道的康橋一文裡，他也寫出了「那是臨著一大片望不到頭的草原，滿開著豔紅的罌粟，在青草裏亭亭的像是萬盞的金燈」的數大之美，下列那個選項傳達的美感與此不相同？
  options:
  - label: A
    content: 碧綠的山坡前，幾千隻綿羊，挨成一片雪絨，是美；一天的繁星，千萬隻閃亮的眼神，從無極的藍空中下窺大地，是美
  - label: B
    content: 海岸山脈的雲跟隨太平洋的風，翻山越嶺，翻過山頭，好像累了，突然像瀑布一樣，往下傾瀉流竄，洶湧澎湃，形成壯觀的雲瀑
  - label: C
