- id: doc_113_高雄_光華_國文_g8s2e2_s1_17
  section: 1
  number: 17
  type: single
  page: 3
  stem: 關於我所知道的康橋一文的寫作手法，下列何者說明正確？
  options:
  - label: A
    content: 描寫初春時，康橋由清晨到黃昏的景色，運用許多類疊、排比的手法，讓文章呈現律動的美感
  - label: B
    content: 第一段中，連用三個「頃刻間」，給人急促的感覺，也呈現初春時的康橋，天氣陰晴不定，景象變化萬千
  - label: C
    content: 第二段裡，連用六個「關心」，有漸進加強語氣的作用，反應出作者對於康河風光細心的觀察，也呈現作者對於春天即將消逝的不捨
  - label: D
    content: 在第三段，連用四個「你如愛」的排比句型，用「你」拉近與讀者的距離，也傳達作者眉飛色舞、津津樂道的神情，也表現康橋的人情溫暖更甚於自然美景。
  lesson_raw:
    title: 我所知道的康橋
    basis: 題目點名「我所知道的康橋一文」
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 國文
