- id: doc_113_高雄_光華_國文_g8s2e2_s1_16
  section: 1
  number: 16
  type: single
  page: 3
  stem: 在我所知道的康橋裡的句子，下列說明何者正確？
  options:
  - label: A
    content: 靜極了，這朝來水溶溶的大道，只遠處牛奶車的鈴聲，點綴這周遭的沉默→以牛奶車的鈴聲，反襯出四周的寧靜，也顯示康橋地處偏鄉，人煙稀少
  - label: B
    content: 順著這大道走去，走到盡頭，再轉入林子裡的小徑，往煙霧濃密處走去，頭頂是交枝的榆蔭，透露著漠楞楞的曙色。再往前走去，走盡這林子，當前是平坦的原野，望見了村舍、初青的麥田，更遠三兩個饅形的小山掩住了一條通道→由近而遠，循序介紹康橋一帶地形的變化
  - label: C
    content: 康橋只是一帶茂林，擁戴幾處娉婷的尖閣。嫵媚的康河也望不見蹤跡，你只能循著那錦帶似的林木想像那一流清淺→說明康橋地處森林，並無河流流經此處，康河只是作者想像
  - label: D
    content: 村舍與樹林是這地盤上的棋子，有村舍處有佳蔭，有佳蔭處有村舍→形容康橋當地的路政管理甚佳，房屋排列井然有序，像棋盤一樣整齊。
  lesson_raw:
    title: 我所知道的康橋
    basis: 題目引用「我所知道的康橋」
