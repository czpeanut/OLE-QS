  - label: C
    content: 那低咽的簫聲又傳來了，幽幽的，如同一隻到處漫遊的螢火蟲，飛到她的心中
  - label: D
    content: 馬蹄聲，孤獨又憂鬱的自遠至近，灑落在街上成白色的小花朵。
