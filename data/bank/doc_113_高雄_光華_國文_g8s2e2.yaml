- id: doc_113_高雄_光華_國文_g8s2e2_s2_2
  section: 2
  number: 2
  type: single
  page: 5
  stem: 根據本文，下列哪個選項的說明是正確的？
  options:
  - label: A
    content: 陳之藩說的「誰知哪一句閒談在心天上映出燦爛的雲霞，又誰知哪一個故事在腦海中掀起滔天的濤浪？」含義是指跟同學一起關心燦爛的雲霞，內心也會掀起滔天的濤浪
  - label: B
    content: 文中提到學生將亨利八世塑像手中的權杖換成一條桌子腳，校長雖然對該學生予以嚴厲的處分，但還是保留了塑像的桌子腳
  - label: C
    content: 本文引用林語堂的言論，提到劍橋學生所以好，是因為導師制度，良好的師生互動啟發學生的新想法，對學生個別的發展很重要
  - label: D
    content: 劍橋大學創立於13 世紀末，孕育出多位諾貝爾獎得主，因此，劍橋大學也超越牛津大學，成為英國最負盛名的大學。
  group_stem: "（二）\n    劍橋，一個令人嚮往、著迷的古典大學城，一個環境優美，學風自由，擁有許多著名學院的書香聖地。徐志摩能夠寫出許多浪漫而多情的詩文，就是在這樣的環境中涵養出來的，二○○八年劍橋大學還在他當年就讀的國王學院為他立了一塊詩碑，碑上刻了再別康橋的詩句。\n\
    \    劍橋大學位於倫敦北方八十公里，創立於十三世紀初，已有八百多年的歷史，這裡曾孕育出八十多位諾貝爾獎得主，英國有許多傑出的人才出自於這所大學。牛頓在這裡教過課，達爾文在這裡完成了他的研究，鑽研宇宙黑洞聞名的霍金也在此任教長達四十多年。\n\
    \    曾在此留學的陳之藩，對劍橋感受最深的是它自由的學風，這正是它的特色之一。他說：「劍橋之所以為劍橋，就在各人想各人的，各人做各人的，從無一人過問你的事。找你愛找的朋友，聊你愛聊的天。看看水，看看雲，任何事不做也無所謂。在一九七○的前半年，我幾乎沒有看一本本行的書。好像壞學生放了假時的狀態。」他在劍橋常與不同學院的學生在風雨中談到深夜，話題五花八門，談述雖天馬行空，有時卻能激盪出思想的火花，因此他說：「誰知哪一句閒談在心天上映出燦爛的雲霞，又誰知哪一個故事在腦海中掀起滔天的濤浪？」\n\
    \    三一學院正門上方有個國王亨利八世的塑像，右手原來握著一枝權杖，不知何時竟被學生換成了一條桌子腳。第二天學生們以為校長會嚴厲處分，沒想到校長認為這位學生的見解、行為與眾不同，雖然放肆但不失可愛，不僅不予追究，且將這根桌子腳保留了下來，成為一段美談。校方認為在不違反學術界的規範下，學生有權利表達反對意見。無怪乎陳之藩說：「劍橋與牛津，似乎把學生當成生物，讓生物成長；別的所謂『大學』，似乎把學生當成礦物，讓礦物定型。」正因如此，劍橋成為培育優秀人才的搖籃。\n\
    \    劍橋大學另一個特色是它的導師制度，導師扮演著學生的良師益友，除了負責指導學生的品行外，同時也協助輔導學生的學習計畫。這種一對一的互動對學生個別的發展很重要，每一位學生的觀點都能被廣泛而深入地探討，並激發出他們在各個領域的新想法。誠如林語堂所說：「牛津、劍橋的學生所以好，是導師坐在那裡噴煙，噴得你天才冒火。」劍橋某些教授慣於一邊抽菸一邊與他的學生對談，學生在輕鬆的對談中得到無形的「薰陶」與啟發。\n\
    \    劍橋自由而富啟發的學風滋養了無數學子的心靈，徐志摩正是在這樣的環境下，激發出他創作詩文的靈感與意念。他曾說：「我在康橋的日子可真是享福，深怕這輩子再也得不到那樣甜蜜的機會了。我不敢說康橋給了我多少學問或是教會了我什麼。我不敢說受了康橋的洗禮，一個人就會變氣息，脫凡胎。我敢說的只是——就我個人說，我的眼是康橋教我睜的，我的求知慾是康橋給我撥動的，我的自我意識是康橋給我胚胎的。」這段話為劍橋的特色做了極佳的見證。\n\
    註：康橋是劍橋大學舊時的譯名。\n（改寫網路文章劍橋大學的特色與趣談）"
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 國文
      code: 第四課
      title: 我所知道的康橋
      chapter: null
    textbook: 八下 第四課 我所知道的康橋
    labeled_by: ai
- id: doc_113_高雄_光華_國文_g8s2e2_s2_3
  section: 2
  number: 3
  type: single
  page: 5
  stem: 關於劍橋大學和徐志摩的敘述，下列何者正確？
  options:
  - label: A
    content: 劍橋大學有自由且富啟發的學風，徐志摩創作詩文的意念與靈感，就是在這樣的氛圍激發出來的
  - label: B
    content: 徐志摩在劍橋大學接受宗教的洗禮後，變了氣息，脫了凡胎，學識涵養也因此而提升
  - label: C
    content: 徐志摩覺得自己在劍橋大學的日子非常享福，怕離開後，再也沒有這麼甜蜜的機會，因此把握在劍橋大學的時間好好享福
  - label: D
    content: 劍橋大學在徐志摩當年就讀的國王學院立了一塊刻有再別康橋詩句的詩碑，這是延續劍橋大學為得到諾貝爾獎的校友立碑的傳統。
  group_stem: "（二）\n    劍橋，一個令人嚮往、著迷的古典大學城，一個環境優美，學風自由，擁有許多著名學院的書香聖地。徐志摩能夠寫出許多浪漫而多情的詩文，就是在這樣的環境中涵養出來的，二○○八年劍橋大學還在他當年就讀的國王學院為他立了一塊詩碑，碑上刻了再別康橋的詩句。\n\
    \    劍橋大學位於倫敦北方八十公里，創立於十三世紀初，已有八百多年的歷史，這裡曾孕育出八十多位諾貝爾獎得主，英國有許多傑出的人才出自於這所大學。牛頓在這裡教過課，達爾文在這裡完成了他的研究，鑽研宇宙黑洞聞名的霍金也在此任教長達四十多年。\n\
    \    曾在此留學的陳之藩，對劍橋感受最深的是它自由的學風，這正是它的特色之一。他說：「劍橋之所以為劍橋，就在各人想各人的，各人做各人的，從無一人過問你的事。找你愛找的朋友，聊你愛聊的天。看看水，看看雲，任何事不做也無所謂。在一九七○的前半年，我幾乎沒有看一本本行的書。好像壞學生放了假時的狀態。」他在劍橋常與不同學院的學生在風雨中談到深夜，話題五花八門，談述雖天馬行空，有時卻能激盪出思想的火花，因此他說：「誰知哪一句閒談在心天上映出燦爛的雲霞，又誰知哪一個故事在腦海中掀起滔天的濤浪？」\n\
    \    三一學院正門上方有個國王亨利八世的塑像，右手原來握著一枝權杖，不知何時竟被學生換成了一條桌子腳。第二天學生們以為校長會嚴厲處分，沒想到校長認為這位學生的見解、行為與眾不同，雖然放肆但不失可愛，不僅不予追究，且將這根桌子腳保留了下來，成為一段美談。校方認為在不違反學術界的規範下，學生有權利表達反對意見。無怪乎陳之藩說：「劍橋與牛津，似乎把學生當成生物，讓生物成長；別的所謂『大學』，似乎把學生當成礦物，讓礦物定型。」正因如此，劍橋成為培育優秀人才的搖籃。\n\
    \    劍橋大學另一個特色是它的導師制度，導師扮演著學生的良師益友，除了負責指導學生的品行外，同時也協助輔導學生的學習計畫。這種一對一的互動對學生個別的發展很重要，每一位學生的觀點都能被廣泛而深入地探討，並激發出他們在各個領域的新想法。誠如林語堂所說：「牛津、劍橋的學生所以好，是導師坐在那裡噴煙，噴得你天才冒火。」劍橋某些教授慣於一邊抽菸一邊與他的學生對談，學生在輕鬆的對談中得到無形的「薰陶」與啟發。\n\
    \    劍橋自由而富啟發的學風滋養了無數學子的心靈，徐志摩正是在這樣的環境下，激發出他創作詩文的靈感與意念。他曾說：「我在康橋的日子可真是享福，深怕這輩子再也得不到那樣甜蜜的機會了。我不敢說康橋給了我多少學問或是教會了我什麼。我不敢說受了康橋的洗禮，一個人就會變氣息，脫凡胎。我敢說的只是——就我個人說，我的眼是康橋教我睜的，我的求知慾是康橋給我撥動的，我的自我意識是康橋給我胚胎的。」這段話為劍橋的特色做了極佳的見證。\n\
    註：康橋是劍橋大學舊時的譯名。\n（改寫網路文章劍橋大學的特色與趣談）"
  answer:
  - 怯怜怜
