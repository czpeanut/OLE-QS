  stem: 在張釋之執法一文，下列文句的說明，何者是正確的？
  options:
  - label: A
    content: 縣人來，聞蹕，匿橋下。久之，以為行已過，即出，見乘輿車騎即走耳→語句簡短呈現犯蹕之人神色自若，口齒清晰及其情可憫的形象
  - label: B
    content: 此人親驚吾馬，吾馬賴柔和，令他馬，固不敗傷我乎？而廷尉乃當之罰金→漢文帝語氣短促，可見相當在意車馬被驚動，但因未造成人員傷亡，因此認為判決過重，而有所不滿
  - label: C
    content: 且方其時，上使立誅之則已。今既下廷尉，廷尉，天下之平也，一傾而天下用法皆為輕重，民安所錯其手足→張釋之這段話的真正含義是若漢文帝不肯採納判決，當初就不該把犯蹕之人交給廷尉審問
  - label: D
