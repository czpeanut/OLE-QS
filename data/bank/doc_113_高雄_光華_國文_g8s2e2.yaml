- id: doc_113_高雄_光華_國文_g8s2e2_s2_1
  section: 2
  number: 1
  type: single
  page: 4
  stem: 根據本文，下列敘述何者正確？
  options:
  - label: A
    content: 發脾氣是宣洩情緒的好方法
  - label: B
    content: 發脾氣會讓自己更不快樂
  - label: C
    content: 林肯責備將軍那封嚴苛的信始終沒有寄出
  - label: D
    content: 本文告訴我們要多做快樂的事來避免發脾氣。
  group_stem: "（一）\n    發脾氣是件很不好的事情，大人都不隨便發脾氣，因為發脾氣的時候心情過分激動，對自己的身體有害，又使別人不快樂，容易留給別人惡劣的印象，使大家都不敢跟他接近，不放心跟他交往。常發脾氣的人，身邊的朋友越來越少，辦什麼事情都不容易辦好。所以大人都能注意克制自己的脾氣。\n\
    \    美國第十六屆總統林肯，最會克制自己的脾氣。在南北戰爭的時候，有一個將軍處理事情錯誤，竟使戰敗的南軍能夠保全實力，安全撤退，造成戰爭的延長，造成美國人更多的死傷。林肯憤怒得不得了，馬上寫了一封很嚴苛的信，很厲害的責備那個將軍一頓。不過，他始終沒有把那封信寄出去，這就是他克制脾氣的方法。\n\
    \    要發脾氣的時候，最好先冷靜的想一想：「難道我沒有別的辦法來處理這件事嗎？」能夠這樣想，你就會發現辦法多極了，幾乎沒有一樣不比「發脾氣」好。\n(林良快樂的敵人)"
  answer:
  - 方其時
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 國文
      code: 第一課
      title: 運動家的風度
      chapter: null
