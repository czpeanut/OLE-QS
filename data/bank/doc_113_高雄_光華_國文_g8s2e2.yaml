  section: 1
  number: 15
  type: single
  page: 3
  stem: 我所知道的康橋一文，「遠近的炊煙，成絲的、成縷的、成捲的，輕快的、遲重的，濃灰的、淡青的、慘白的，在靜定的朝氣裡漸漸地上騰，漸漸地不見，彷彿是朝來人們的祈禱，參差地翳入了天聽。」是用聽覺印象來表現視覺感受，下列何者與之相同？
  options:
  - label: A
    content: 陽光好亮，透過葉隙叮叮噹噹擲下一大把金幣
  - label: B
