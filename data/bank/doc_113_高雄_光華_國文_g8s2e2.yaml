  section: 2
  number: 6
  type: single
  page: 6
  stem: 根據本文內容，作者認為下列是最不可救藥的墮落？
  options:
  - label: A
    content: 生活的放任無拘
  - label: B
    content: 放棄靈魂的冒險
  - label: C
    content: 生命的享樂
  - label: D
    content: 性靈的頹唐。
  group_stem: "（四）\n    我是一隻沒籠頭的野馬，我從來不曾站定過。我，人是社會裡活著，卻不是這社會中的一個，像是有離魂病似的，我這軀殼的動靜是一件事，我那夢魂的去處又是一件事。我是一個傻子：我曾經妄想在這流動的「生」裡發現一些不變的價值，在這打謊的世上尋出一些不磨滅的「真」；在我，這靈魂的冒險是生命核心裡的意義，我永遠在無形的經驗的巉巖上爬著。\n\
    \    冒險——痛苦——失敗——失望，跟著來的，存心冒險的人，就得打算他最後的失望；但「失望」並不是「絕望」，這分別很大。我曾經遭受過「失望」的打擊，我的頭流著血，但我的脖子還是硬的；我不能讓「絕望」的重量壓住我的呼吸，不能讓悲觀的慢性病侵蝕我的精神，更不能讓厭世的惡質染黑我的血液。厭世觀與生命是不可並存的。我是一個生命的信徒，起初是的，今天還是的，將來——我敢說——也是的。我絕不容忍性靈的頹唐，那是最不可救藥的墮落，同時卻繼續軀殼的存在；在我，單這開口說話，提筆寫字的事實，就表示背後有一個基本的信仰，完全的沒有破綻的信仰。\n\
    （徐志摩迎上前去)"
