- id: doc_113_高雄_光華_國文_g8s2e2_s2_9
  section: 2
  number: 9
  type: single
  page: 7
  stem: 根據本文報導，故宮文物曾遭受哪兩次戰火的襲擊？
  options:
  - label: A
    content: 第一次世界大戰、九一八事變
  - label: B
    content: 日本侵華、國共內戰
  - label: C
    content: 國共內戰、八二三砲戰
  - label: D
    content: 北京事變、南京事變。
  group_stem: "（六）\n    2022 年3 月，位於利維夫的烏克蘭最大的藝術博物館，館方人員緊急打包藏品逃難，畫面歷歷在目。事實上，故宮並非沒有緊急事件因應措施，惟主要是針對地震等天災或恐怖攻擊設計。經俄烏一役後，故宮要思索的是，開戰後，館內人員如何迅速就定位，該做什麼事？在2022\
    \ 年7 月，180 名工作人員進行各項模擬演練，包括安全設施遭敵方毀損且物件遭掠奪時，如何向軍警求援。\n    故宮典藏70萬件，不可能全數遷移，若三軍統帥下令撤退，按計畫，會先救9萬件高價值、較不佔空間的歷史文物。由於事涉敏感，館方拒絕透露撤離地點，也不願說明將以何種方式運送。\n\
    \    掀開歷史的扉頁，故宮的珍寶，其實已遭遇兩次戰火。\n    1930年代日本侵華前夕，國民政府將大批文物珍寶從北京南遷至上海與南京。之後十年，許多文物陸續遷至內陸四川，火車、馬車、船隻全派上用場，途中的寺廟與洞穴都曾是藏匿地。直至1947年，日本向同盟國投降兩年後，北京故宮文物才得以在南京重聚。\n\
    \    而後國共內戰再起，戰敗的國民政府播遷來臺，將60餘萬件藝術品、書籍、地圖、官方文件等歷史文物攜至臺灣，原暫存於臺中糖廠及霧峰北溝，後在臺北外雙溪建造了故宮現址，並於1965年正式開放，奠定了其在全球的中華文化守護者地位。曾任臺北故宮院長的吳密察表示，「是戰爭讓這些文物到了臺灣。我們有責任保護人類文明的無價珍寶。」\n\
    (改寫自黃紫緹俄烏大戰臺灣再借鏡 故宮演練戰時文物撤離計畫)"
  answer:
  - 掛單
