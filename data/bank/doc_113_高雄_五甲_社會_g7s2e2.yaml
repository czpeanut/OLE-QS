- id: doc_113_高雄_五甲_社會_g7s2e2_s3_49
  section: 3
  number: 49
  type: single
  page: 6
  stem: 臺灣原住民族屬於南島語族。南島語族是世界上分布最廣的民族；西起非洲東南的馬達加斯加島，越過印度洋直抵太平洋的復活節島；北起臺灣，南到紐西蘭。臺灣原住民族可分為高山族和平埔族。高山族仍保有自己的文化，不過正面臨失傳問題；平埔族則大多已失去原有的語言和習俗。
    請問：在過去，以漢人的觀點，將居於少數的原住民族視為「番胞」，極盡醜化汗名之能事。請問：上述現象顯示何種認知的重要性？
