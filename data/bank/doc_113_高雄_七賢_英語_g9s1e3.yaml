  group_stem: "Hi! I’m Kamala, a junior high student in Taiwan. From the mails I exchanged\
    \ with Andy, my net friend from Canada, I have learned   11  . He says his school\
    \ starts around 8:30 a.m. and ends around 3 p.m. Students don’t wear uniforms,\
    \ except for sports teams or clubs, so they can show themselves through their\
    \ clothing. After school, he can hang out with friends, work on his interests,\
    \ or join clubs   12   like soccer, music, or art. The best part is that students\
    \ there don’t need to take national tests like CAP to get into a senior high.\
    \ I can’t help but envy the easy life he has! \n   envy 羨慕 \n\nBack in Taiwan,\
    \ our school days are long—I wake up around 6:30 a.m., start classes at 7:30 a.m.,\
    \ and usually don’t get home until 5:30 p.m. We wear uniforms at school, which\
    \ makes getting dressed easier, but   13  . We have subjects like math, science,\
    \ Chinese, English, and social studies, and I often have hours of homework to\
    \ do after school. The worst part is that I need to prepare for CAP   14   . However,\
    \ though my school life is hard, I am still thankful for the schooling I’m going\
    \ through. Maybe one day, I can experience that kind of school life Andy has.\
    \ Before that, I will just keep working hard."
