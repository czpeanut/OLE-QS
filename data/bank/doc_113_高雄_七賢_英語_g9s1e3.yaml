- id: doc_113_高雄_七賢_英語_g9s1e3_s2_15
  section: 2
  number: 15
  type: single
  page: 2
  stem: What does incredible mean?
  options:
  - label: A
    content: Amazing.
  - label: B
    content: Boring.
  - label: C
    content: Simple.
  - label: D
    content: Afraid.
  group_stem: 'Mike didn’t see the world as any other on his team. He couldn’t see
    the world in all its bright colors. While people saw reds, greens, and purples,
    Mike’s world was painted mostly in shades of blue and yellow. But that didn’t
    stop him from being the sharpest on his team. And that surely didn’t stop him
    from being the hero of the day. What Mike couldn’t see, he made up for with his
    super-power nose.


    One evening, a terrible earthquake hit the town. Buildings fell down, and everyone
    was running out to find safe places. But Mike was different. He hurried into a
    fallen building, where cries of a baby girl could be heard. Mike couldn’t see
    the baby, but his nose caught the human smell right away.


    With each careful step, Mike moved through the fallen walls and broken glass.
    His world was still mostly blue and yellow, but his nose knew where to go. Finally,
    under a strong desk, Mike found the baby—a tiny girl who was crying softly. He
    made some loud sounds which let his owner know the baby was found.


    Thanks to Mike’s incredible sense of smell, the baby was pulled out to safe hands.
    He couldn’t see her in all the colors that humans could, but that didn’t matter.
    Mike’s world was a little less colorful, but his heart, and his nose, never failed
    when it mattered most.                                                           shade
    層'
  tags:
    textbook: 第五冊（九上）第3次段考範圍
    labeled_by: ai
