  section: 2
  number: 19
  type: single
  page: 3
  stem: What are the hidden secrets Bonny the bee talks about?
  options:
  - label: A
    content: The different colors of flowers.
  - label: B
    content: The nectar hidden inside the flowers.
  - label: C
    content: The patterns made of UV light on flowers.
  - label: D
    content: The buzzing sounds she makes while flying.
  group_stem: "Hello, humans! I’m Bonny the bee, and let me tell you guys how different\
    \ I see the world. You might not know this, but flowers have hidden secrets just\
    \ for me! Every day, when I head out looking for food, I’m led by patterns you\
    \ can’t see. These patterns are made of ultraviolet light (UV), and they act like\
    \ a treasure map leading me straight to the nectar hidden inside the flowers.\
    \ To humans, flowers look pretty, but to me, they’re more like shining signs saying,\
    \ “Here’s the good nectar!” I stop from flower to flower, collecting nectar while\
    \ also sending pollen to help plants grow. It’s a busy job, but one I’m proud\
    \ to do.\n\nAs I buzz around down here, I often look up at the sky. Far, far above\
    \ me, there’s a bird that sees the world in ways I can only imagine—El, a large\
    \ powerful eagle. There, he doesn’t care about flowers or nectar. He doesn’t need\
    \ hidden maps like I do. On the other hand, way up in the clouds, he has some\
    \ of the sharpest eyes in the animal world which allow him to see tiny movements\
    \ on the ground, a rabbit or a fish from kilometers away! While I fly close to\
    \ the ground, following the colors and patterns of the flowers, he flies high,\
    \ watching everything below. Imagine flying like El and being able to see so far!\n\
    \nThough our lives are different, I like to think that he and I are both experts\
    \ in our own worlds. I find the best nectar by using my UV vision and help plants\
    \ grow, while he uses his sharp vision to hunt and help keep the numbers of some\
    \ small animals like mice in check. We may live in different parts of the sky,\
    \ but both of us count on our special ways of seeing the world to get through\
    \ each day. El the eagle rules the heights, and I, Bonny the bee, buzz below.\
    \ Together, in our own ways, we make the planet we live on a better place.\n \
    \  pattern 形式  treasure 寶藏  nectar 花蜜  pollen 花粉  imagine 想像"
  tags:
