  stem: What do you learn about Napoleon’s time on Elba from the passage?
  options:
  - label: A
    content: He met more people who cheered for him and backed him up.
  - label: B
    content: He felt hateful for being a loser. He would never give up.
  - label: C
    content: He had to fight for his own life and couldn’t rest at all.
  - label: D
    content: He enjoyed the beauty of nature more than ever.
  group_stem: "In 1814 in France, there was a great leader named Napoleon Bonaparte.\
    \ He was a strong and smart man who ruled over many lands. But one day, he lost\
    \ a big battle and was sent to a small island called Elba. Standing on the beach,\
    \ he looked out at the blue ocean and thought about his past. “ What if I had\
    \ won the battle,“ he thought. “Able was I ere I saw Elba,” he said quietly to\
    \ himself.\n\nNapoleon remembered the times when he was a powerful king. People\
    \ cheered for him, and he won many battles. Now, he felt sad and angry on the\
    \ tiny island. Elba was beautiful, with green hills and flowers everywhere, but\
    \ it felt like a prison to him.\n\nAs he watched the waves clap against the rocks,\
    \ he thought about how he could change his future. “I may be here now, but I can’t\
    \ give up!” he said, feeling hopeful again. He remembered how he always believed\
    \ in himself, even when things were wrong or difficult.\n\nWith a new plan in\
    \ mind, he decided to get away and get back to France. He wanted to show everyone\
    \ that he was still strong. Napoleon knew he could be a great leader again if\
    \ he tried hard enough. The island of Elba had given him a chance to think, but\
    \ it would not keep him for long. He was ready to make his comeback and show that\
    \ he could be great once more! \n battle 戰役     ere=before \nprison 監獄"
  shared_asset: g2_23_27
