  stem: Which of the following “Jean Camus” shares a common idea as the experts in
    the reading?
  options:
  - label: A
    content: Jean Camus goes on nature walks every weekend and enjoys the quiet moments
      in the forest where over 200 kinds of plants grow, few of which she knows. One
      day, she posted a photo of a pretty flower she happened to see. To her surprise,
      she was told that she found a new kind of flower.
  - label: B
    content: Jean Camus has always been the first one helping with housework, although
      things seldom go right as planned. At dinner time, she always jumps up to set
      the table and drops a few plates at the same time. Yesterday, she mixed red
      socks with white shirts, turning all of them pink.
  - label: C
    content: Many of the cases Jean Camus worked on before had no clear leads. But
      she has been good at finding hidden tips that others can’t see. Can you imagine
      once she even found a secret message from a telephone book?! No wonder she is
      called Lady Wonder.
