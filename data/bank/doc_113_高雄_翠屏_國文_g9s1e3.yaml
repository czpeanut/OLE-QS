    content: 身居高官卻利用職務之便而貪汙的陳先生，終遭革職查辦
  - label: B
    content: 慘遭六連敗並且傷兵累累僅存五名可用之兵的福營教師籃球隊，將士用命終於獲得最後勝利
  - label: C
    content: 因應政府加入WTO 後，國外稻米可以自由輸入臺灣的處境，臺東農會致力於稻米改良，最終打敗日本越光米
