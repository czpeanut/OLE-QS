  number: 16
  type: single
  page: 2
  stem: 下列文句摘自孟子一文，何者文意說明最正確？
  options:
  - label: A
    content: 「所以動心忍性，曾益其所不能」──一個人心性平穩就會擁有高成就
  - label: B
    content: 「生於憂患」──是指杞人憂天，患得患失，深思熟慮
  - label: C
    content: 「人恆過，然後能改」──先了解自己的苦處，才能發揮自己的長處
  - label: D
    content: 「徵於色，發於聲，而後喻」──從別人的不滿，體會到自己的過失。
