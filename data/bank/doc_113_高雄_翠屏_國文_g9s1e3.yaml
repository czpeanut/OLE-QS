  group_stem: "(五)\n  光緒十六年春閏二月甲子，余遊巴黎蠟人館。見所製蠟人，悉仿生人；形體、態度、髮膚、顏色、豐瘠，無不畢肖。自王公卿相以至工藝雜流，凡有名者，往往留像於館。或坐、或臥、或坐、或俯、或笑、或飲、或博，驟視之，無不驚為生人者。余亟嘆其技之奇妙。\n\
