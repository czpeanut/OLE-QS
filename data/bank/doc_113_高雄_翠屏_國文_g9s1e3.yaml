  stem: 依據文意，作者在文中以何種語氣敘述？
  options:
  - label: A
    content: 告誡
  - label: B
    content: 責罵
  - label: C
    content: 讚揚
  - label: D
    content: 憤怒。
  group_stem: '(二)

    非黃帝 堯 舜之子孫，而至於今日，其不幸為臧獲、為婢妾、為輿臺、皁隸，窘窮迫逼，無可奈何。非其數十代以前，即自臧獲、婢妾、輿臺、皁隸來也。一旦奮發有為，精勤不倦，有及身而富貴者矣，有及其子孫而富貴者矣，王侯將相豈有種乎！而一二失路名家，落魄貴冑，借祖宗以欺人，述先代而自大，輒曰：「彼何人也，反在霄漢；我何人也，反在泥途。天道不可憑，人事不可問。」嗟乎！不知此正所謂天道人事也。

    注：①臧獲：奴婢。臧，音ㄗㄤ。 ② 輿臺：指服賤役、地位低微的人。 ③皁隸：古代稱衙門中的差役。皁，音ㄗㄠˋ。 ④霄漢：天際，這裡指地位高高在上。 ⑤泥途：泥濘的道路，
    比喻地位卑下。

    雍正十年杭州韜光庵中寄舍弟墨（節錄 ）  鄭板橋'
