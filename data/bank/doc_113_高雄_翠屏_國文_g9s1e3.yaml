  - label: D
    content: 岩石周圍沒有遮蔽，賞景一覽無遺。
  group_stem: "(四)\n  位於「冰河點」的「懸空岩」可能是美國西部最常上鏡頭的小岩石。它的尺寸大如一張大型野餐桌，也曾有人將車子開到上面停放，而對愛耍特技的玩命之徒及純粹想逞勇的人而言，這兒更是具有磁石般的吸引力。\n\
    \  讓這塊尖石如此知名的，是它底下的東西：大約900 公尺的空氣，而且真的只有空氣，除非你把偶爾飄過的雨滴或雪片也算進去。這裡更是理解此地區地質生成過程的絕佳地點：可以看它如何從深海沉積物變成板塊，接著融化成花崗石，然後凝固，再度升起，在水與冰作用下溶解、深蝕並錯移。在冰河點，可以看到水與重力之偉大力量的戲劇性展現──水是鑿子，重力是錘子，至於雕刻家是誰，則存乎各人心中。\n\
    \                                 國家地理雜誌（節錄）"
