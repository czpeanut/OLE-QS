- id: doc_113_高雄_翠屏_國文_g9s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 「天將降大任於是人也，必先苦其心志，勞其筋骨，餓其體膚，空乏其身，行拂亂其所為：所以動心忍性，增益其所不能。」這段話寓意異於下列何者？
  options:
  - label: A
    content: 天鼎地爐，人居其中，接受磨鍊方能成就
  - label: B
    content: 雨後大地冒出尖尖嫩筍，如果它不奮力掙破外圍那層堅硬的籜，如何變成修長挺拔、風姿萬千的綠竹
  - label: C
    content: 如果人人都能秉持犧牲享受，兼善天下的精神，燃燒自己，照亮他人，整個社會將大放光芒
  - label: D
    content: 草木不經霜寒則生意不旺；人不經憂患則德慧不成。
  lesson_raw:
    title: 生於憂患死於安樂
