  stem: '「一人疾焉而醫者十，並使之歟？」曰：「使其尤良者一人焉爾。」「烏知其尤良而使之？」曰：「眾人之所謂尤良者，而隱之以吾心，其可也。夫材不相逮，不相為謀，又相忌也。人之愚不能者常多，而智能者常少，醫者十，愚不能者烏知其不九邪？並使之，一日而病且亡，誰者任其咎邪？」

    作者在這段文字中雖論使醫治病，但用意卻在談用人治國之理。據此，作者主張在上位者應該如何？'
