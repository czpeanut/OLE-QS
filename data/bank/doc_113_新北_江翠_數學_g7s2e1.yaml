  type: single
  page: 1
  stem: 下列敘述何者正確？ 【課本 19 頁】
  options:
  - label: A
    content: 若蘋果每個 $x$ 元、芭樂每個 $y$ 元，則小澄買 5 個蘋果與 6 個芭樂，共花了 $(6x+5y)$ 元
  - label: B
    content: 當 $x=1$、$y=2$ 時，$2x-5y+4$ 的值為 $-4$
  - label: C
    content: $4x+3y+2x+5$ 化簡的結果為 $6x+8y$
  - label: D
    content: $x=-3$、$y=9$ 為二元一次方程式 $3x+2y-7=0$ 的解。
