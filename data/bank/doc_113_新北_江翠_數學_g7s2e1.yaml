  page: 1
  stem: 有關二元一次式 $5x-2y-1$ 的敘述下列何者正確？ 【課本 9 頁】
  options:
  - label: A
    content: $x$ 項係數為 $-5$
  - label: B
    content: $y$ 項係數為 $2$
  - label: C
    content: 常數項為 $1$
  - label: D
    content: $5x-2y-1$ 可寫成 $5x+(-2y)+(-1)$。
