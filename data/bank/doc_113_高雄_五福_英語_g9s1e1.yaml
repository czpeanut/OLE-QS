  group_stem: 'A.

    Let go

    (Ideas from Brandon Shutter’s poem)

    Stop looking back

    Only look ahead

    Look forward to the future,

    And forget the past.

    Empty your mind and you will see

    With time new ones will grow

    Your mind a ship at sea.

    Love like it will last

    Dream like they will last forever

    A never ending chance.

    Look up at the stars

    For where you are right now,

    Is just another test.

    This world has zero limits,

    And nothing is stopping you.

    Be proud of who you are,

    And own those angry wounds.

    Look only to the future

    The world is your crystal ball

    Forget the past,

    And see the world in awe.


