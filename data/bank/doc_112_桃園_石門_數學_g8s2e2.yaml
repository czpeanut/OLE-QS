  stem: '太魯哥國家公園入口處矗立著一座宏偉的線對稱石碑(如圖一)，底座是一個等腰梯形，

    上底3 公尺，下底11 公尺，腰長5 公尺，高3 公尺。

    底座上方放置一塊邊長5 公尺的正方形ABCD 大理石。


    403 大地震時，大理石被震落(如圖二)，


    國家公園管理局為避免大理石持續滾落，緊急加裝一根鐵柱(如圖 $\overline{DF}$)支撐，後來因為餘震不斷，

    擔心鐵柱的支撐力不夠，於是加裝一條鋼纜(如圖 $\overline{AE}$)固定。

    若從石碑正面看去，忽略底座及大理石厚度的情況下，求：


    (1) 鐵柱 $\overline{DF}$ 的長是幾公尺？ (3 分)


