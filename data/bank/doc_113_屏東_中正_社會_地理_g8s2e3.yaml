  stem: 位於非洲西南端的開普敦，是影響世界歷史的重要都市。荷蘭人在1652 年來到此地，因當地氣候適合，可種植歐洲常見的蔬果並釀製葡萄酒，用以補充船隻上的飲食，於是逐步將其建造為海上貿易的補給站。圖(八)中的好望堡為統治者在開普敦的辦公地點，是由奴隸所建造，其中一部分的奴隸是由荷蘭在亞洲的殖民地輸出。1869
    年蘇伊士運河開通後，大量從歐洲出發的船隻改走新的通航路線而使開普敦逐漸沒落。時至今日，開普敦則以多元文化及豐富生態成為非洲熱門觀光景點。根據上文及圖(八)的資訊判斷，上述都市的氣候特色應為下列何者？
  options:
  - label: A
    content: 一月溫暖且雨量較少
  - label: B
    content: 一月寒冷且年溫差大
  - label: C
    content: 全年低溫且雨量稀少
  - label: D
    content: 終年有雨且夏雨較多
