  group_stem: '(42~46)

    Last Saturday, my friends and I decided to clean up the park near our school.
    We told ___42___ that we didn’t need any help—we could do it on our own.

    Jenny brought gloves for herself, and I packed water and snacks for ___43___.
    Alex and Maria made signs to remind people to throw trash away correctly. They
    even printed the posters ___44___!

    When we got to the park, we were surprised. The playground had cleaned ___45___
    a little because of the recent rain, but there was still a lot to do. We separated
    into groups and worked hard. Alex hurt himself a little when picking up a sharp
    can, but he was okay.

    A woman walking her dog saw us and said, “You should all be proud of ___46___!”
    That made us smile.

    At the end of the day, we looked around and felt happy. We had cleaned the whole
    park by ourselves. Even though we were tired, we had helped the community and
    each other.

    Sometimes, when you challenge yourself, you discover how strong you really are.


