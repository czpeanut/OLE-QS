  stem: 47. Where did Luna live?
  options:
  - label: A
    content: In a village.
  - label: B
    content: In a tall tower.
  - label: C
    content: In a small house.
  - label: D
    content: In the forest.
  group_stem: '(47~50)

    Luna the Cat in the Tower

    Luna was a small gray cat. She lived alone in an old stone tower. The tower was
    tall and quiet. Luna liked it that way.

    One morning, Luna woke up and smelled the rain. The air was cool and fresh. She
    walked to the window and saw the village below. The rooftops were wet and shiny.

    She stopped to watch a little bird sitting on a branch. The bird shook the water
    off its wings. Luna’s ears moved when she heard a cart rolling on the road. She
    sat quietly to listen to the soft rain on the roof.

    As Luna walked up to the tower steps, she noticed some green leaves growing through
    a broken window. She rubbed against them. The leaves were soft and cold.

    At the top of the tower, the wind blew around her. Luna sat and closed her eyes.
    She could feel the wind on her face and the stone under her paws.

    Even though the tower was old and empty, Luna loved it. It was her home. It was
    full of quiet sounds, soft touches, and little things to see.

    Luna smiled in her own cat way. She was happy.


    branch 樹枝, rub 揉搓'
