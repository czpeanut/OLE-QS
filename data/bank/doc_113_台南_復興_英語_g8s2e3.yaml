    People made glass over 5,000 years ago. It is strong, shiny, and useful. We like
    that because we can see through it. Glass keeps out wind and rain but still lets
    us see outside. But this is a big problem for birds. They don’t see the glass,
    so they fly into it and get hurt or die. This happens to millions of birds every
    year.


    A company called Arnold Glas wanted to help. They studied how spiders solved this
    problem. Spiders don’t want birds to fly into their webs, either. So they use
    special silk that shines in UV light. Birds can see UV light, so they stay away
    from the webs.


    Arnold Glas made a special glass called ORNILUX. It has a coating that reflects
    UV light. Birds can see it and fly around the glass instead of into it. This helps
    save birds.


    silk 絲線, coating 塗層, reflect 反射'
