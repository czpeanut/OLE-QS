  group_stem: '(39~41)

    The Raven and the Moonflower

    A clever raven named Corvus lived in a forest. One night, he found a glowing moonflower
    shining and blooming in the dark. It was the only one of its kind, and Corvus
    visited it every night.

    He brought it water and kept it safe. Though the flower couldn’t speak, Corvus
    felt it wanted to fly.

    So when the flower made a seedpod, Corvus waited. One night, it burst open and
    tiny silver seeds flew out like wings. Corvus took them and dropped them across
    the land.

    Soon, moonflowers began to bloom everywhere—on mountains, in valleys, and by rivers—lighting
    up the night.

    And Corvus? He still flies, watching over the flowers he helped set free.


