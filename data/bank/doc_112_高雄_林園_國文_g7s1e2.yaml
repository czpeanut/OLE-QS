  group_stem: "放自己鴿子   李 潼\n  郊遊遠足那天，過了八點半，十幾部遊覽車都走光了，校園裡空蕩蕩，美麗的操場三隻流浪狗和一群鴿子嬉戲，還有躲在操場角落，三個神情落寞的女生和一個看來更令人同情的男生。\n\
    \  他們色彩鮮豔的背包脹鼓鼓，可以想見裡面裝著正餐、水果、零食、飲料等豐富的餐點。那個男生的造型水壺，看來還是全新的，或許也是前一晚連同那些餐點一併採購的，走了大半個市鎮才依照「菜單」找齊了。\n\
    \  這幾個沒能趕上郊遊遊覽車的同學，應該有他們各自不同的遲到理由。不過情景如此孤單，他們似乎無心發表感言，愣愣的看著操場上踱步的一群鴿子，一時拿不定主意：究竟回家算了，還是乾脆在操場野餐，把精心採購的餐點吃喝完畢，省得愈背愈傷心。一個永不絕望的女生說：「也許遊覽車會回頭來載我們，說不定我們老師良心發現了。」那個男生說：「別做夢了，我們自己趕去還差不多！」他們討論的結果是：「要是我們趕去，一定會被那些多嘴婆笑死，說我們被人家放鴿子。」\n\
    \  九點過後，擴音喇叭傳來校長的廣播：「流落校園的所有鴿子，請到校門穿堂集合。」這四隻「鴿子」愣了一下，相互觀望、偷笑。他們振作精神，背起內容豐富的彩色背包，小步走、大步走，終於跨步快跑！把操場上漫遊的流浪狗嚇得逃竄，一群鴿子飛了。"
