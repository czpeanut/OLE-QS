  group_stem: "暑假作業  侯文詠\n     \n    今天早上還沒有睡醒，小討厭鬼就跑來搖我的床。\n  「哥，快起來，起來幫我撕日曆。」\n\
    \  「撕日曆？」我揉著惺忪的雙眼，「幾百年沒撕日曆了，一大早撕什麼日曆？」\n  「就是好久沒撕了，才要叫你撕。」\n  「自己不會撕？」\n  「我就是撕不到才叫你幫忙嘛。」\n\
    \  「哎喲，討厭，妳為什麼長那麼矮？」\n  「我又不是故意的。」她一臉無辜相。\n  我迷迷糊糊起了床，走到日曆前，抓抓頭。\n  「怎麼才八月二十二日？」我問。\n\
    \  「今天也不是星期三。今天是星期五。」\n  「八月二十四，」我隨手撕下兩張日曆，「很好，是星期五。」\n  「咦？可是媽媽生日是八月二十六日，早已經過去了。」\n\
    \  妹妹抗議了。\n  「對嘛，我也覺得怪怪的。」我想了想，「妳說媽媽生日是星期幾？」\n  「是上個禮拜天，我記得了。」\n  「上個禮拜天？」我們都陷入了數學計算思考，「這麼說今天是八月三十一日。」\n\
    \  「八月三十一日。」我們兩個人不約而同地尖叫了起來，「明天要開學了！」\n  天啊！明天要開學了。這是非常可怕的事實，光是想到暑假作業我就頭大。首先我有許多功課要寫，不但如此，還要交寫毛筆字一本、畫圖三張，最可怕的是要寫日記，每天一篇。我算了算，一共有五十幾篇，天啊……「哥，我們是不是現在要開始寫功課了？」小討厭問我。\n\
    \  「廢話，現在不寫，難道妳還明天拿到學校請老師幫妳寫？」\n  「哥，可是我寫不完，怎麼辦？」她哭喪著臉，眼淚已經快流出來了。\n  「我也不知道該怎麼辦！我自己的也寫不完。」\n\
    \  聽到我也寫不完，小討厭似乎又有一點開心了，她說：「哥，你快想個辦法。」\n  我靈機一動，對她說：「妳先幫我記日記，然後我幫妳寫作業。」\n  「我們的字又不一樣，我怎麼幫你記？」\n\
    \  「我又沒有要你真的寫上去，妳只要幫我想想暑假那一天都發生了什麼事，就好了。」\n  「那我的作業呢？」\n  「妳的作業都是加減乘除，太簡單了，等我們作完了，我只要一會兒就幫妳寫好了。」\n\
    \  主意既定，交易也談妥。現在才是早上十點鐘，開始寫暑假作業，應該還來得及。\n  我翻箱倒櫃，終於把丟得不知去向的作業簿找回來，先開始寫功課。\n  懶，懶，懶，懶，懶，懶，懶……一個字要寫一行，一行有十四個字，一共要寫兩百多行。\n\
    \  真的搞不懂，為什麼明明已經會寫的字，要重複寫十四遍？\n  妹妹準備了一大張紙，畫好七月和八月的日期，開始替我想暑假發生的事。"
