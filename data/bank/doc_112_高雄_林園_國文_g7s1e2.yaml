- id: doc_112_高雄_林園_國文_g7s1e2_s4_1
  section: 4
  number: 1
  type: single
  page: 3
  stem: 仙草冰帶給作者的感受，不包括下列何者？
  options:
  - label: A
    content: 使心情沉靜
  - label: B
    content: 可以消暑解渴
  - label: C
    content: 深深地懷念
  - label: D
    content: 食之無味
  group_stem: "仙草冰（節錄）   陳幸蕙\n  夏日的暑熱，總是一開始便密天匝地而來，不留餘地。挽著提籃上菜場的當兒，偶然見到仙草冰上市，就覺得那樣光潤烏沉的東西，是在為余光中的詩句「暑假剛開始，夏正年輕」做註腳。\n\
    \  儘管農業社會裡，種種古老的東西，都已經不合時宜地漸被淘汰，成為只能存在於記憶裡的古董。但即使是新奇討巧的冰淇淋捲大行其道的時刻，街頭巷尾，甚至每一個小康殷實的家裡，清淡雋永、市井風味的仙草冰還是被深深懷念著與喜愛著。\n\
    \  仙草冰說來，其實無香無味，它最大的特徵便在於它的色──墨黑，一種並不怎麼適宜在夏天出現的顏色。所有屬於夏日的色彩，似乎都應是明亮的、耀眼的、令人意興飛揚的，但仙草冰卻獨願把灼熱與煩躁都沉澱下來，凝固成那樣柔潤罕見的黑玉。\n\
    \  也許正因為那樣近乎禪定的黑，寧靜得有如初夏之際最最清涼的一塊夜空，什麼也穿透不過，因此，心浮氣躁，什麼也把握不住的夏日裡，烏亮如玉的仙草冰，就格外令人產生一種沉靜的感覺了。\n\
    \  也許，仙草冰的整個好處，便在於這樣的不費力吧？\n  ──你毫不費力地買回它、不費力地在陽臺的小几上料理它，也毫不費力地享受它停留在齒隙舌尖的感覺。那種入口之後，並無固定形狀，只是軟涼滑溜，自由激盪著脣舌的輕鬆，對任何人來說，都應是一樁特殊而有趣的飲食經驗。因此，吃仙草冰的人，絕沒有橫眉豎目或喋喋不休的；那是汗出如漿的夏日，一顆飛揚浮動的心，最近乎「止水」境界的平靜時刻。\n\
    \  長一輩的人，常喜歡說仙草冰可以「消暑祛渴」，而領略了仙草冰的好處以後，赤日炎天的盛夏，似乎就真的不那麼難以忍受了，因為走在街頭，只要看見仙草冰，我們就覺得自己徹頭徹尾地被敷上一帖清涼。"
  answer:
  - D
  answer_source: answer_key_vlm
  tags:
    textbook: 七上 第四課 吃冰的滋味
