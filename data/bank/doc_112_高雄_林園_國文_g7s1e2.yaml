  stem: 根據本文，下列句子的描述何者正確？
  options:
  - label: A
    content: 從首段可知此四人無心參加學校郊遊
  - label: B
    content: 從次段可知此四人對郊遊充滿了期待
  - label: C
    content: 從第三段可知，此四人都願意自己趕赴郊遊地點
