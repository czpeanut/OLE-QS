    目前全臺市占率最高的超市業者是全聯福利中心，有學者表示併購後雖然會對全聯產生一定的影響，但兩家的定位不太一樣，全聯以社區為核心，走大眾化、平民化，強調低價優勢；家樂福則是國際品牌，以行銷和商品的多樣性見長，兩家業者擁有不同的客群和支持度。

    （資料來源：改寫自1. 程士華，日本雅虎聯姻LINE 過關，經濟日報，2020/07/30。2. 潘姿羽，家樂福併購頂好超市案，公平會准駁面臨兩大難題，中央社，2020/06/03。）'
