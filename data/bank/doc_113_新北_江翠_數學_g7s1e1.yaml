    【特約記者林○妮報導】

    大排長龍，但不是排三倍券或口罩，而是板橋某家知名麵包店！

    據現場目擊，生意興隆時，平均 5 到 8 秒就結帳一位，每位客人平均大約買 300 元到 600 元，粗估一分鐘收入 6000 元，一小時的營業額達到 36
    萬！

    這家知名的麵包店以蛋糕及鳳梨酥聞名，提起「小○」，一股人可能不知道本來是麵包店，現在早上也還有賣麵包。「小○」的蛋糕及鳳梨酥等產品，因為好吃又便宜，幾乎成了板橋人的固定伴手禮，平日就生意興隆，每逢節日之前經常大排長龍，很多人都來光顧，買到外縣市去送人。


