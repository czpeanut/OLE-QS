  group_stem: "論藝術           豐子愷\n  我們平常生活的心與藝術生活的心，最大的差別，在於物我的關係上。平常生活中，視外物與我是對峙的；藝術生活中，視外物與我是一體的。藝術心理中有一種叫做「感情移入」，在中國畫論中，即所謂「遷想妙得」。就是把我的心移於對象中，視對象為與我同樣的人，於是禽獸、草木、山川、自然現象，皆有情感，皆有生命。這看法稱為「有情化」，畫家以此觀看世間，則他所描寫的山水花卉便會有生氣，有神韻，中國畫的最高境界「氣韻生動」，就是這樣達到的。不過畫家用形象、色彩使形象有情化，但畫其神，不畫其形，所以一般人不大容易看出來。\n\
    \  詩人用言語把物象有情化，就容易看出。例如禽獸，用日常的眼光看，只是愚蠢的動物，但用詩的眼光看，卻是有感情的。所以古人詩曰：「年豐牛亦樂，隨意過前村。」推廣一步，植物亦皆有情，所以說：「可憐墳上柳，相見也依依。」再推廣一步，山水亦皆有情，所以說：「相看兩不厭，只有敬亭山。」這是藝術上最可貴的一種心境，習慣了這種心境，並應用這態度在日常生活上，則物我對敵之勢可除去，自私自利之欲可熄滅，而平等博愛之心可增長，一視同仁之德可完成。"
