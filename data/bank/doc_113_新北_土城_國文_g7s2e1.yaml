  group_stem: "朱梁時，青州有賈客泛海遇風，飄至一處，遠望有山川城郭。海師曰：「往昔遭風，未嘗至此。吾聞鬼國在是，莫非此耶？」頃之，舟至岸，因登岸，向城而去。其廬舍田畝，不殊中國。見人皆揖之，而人皆不見己。至城，有守門者，揖之，亦不應。入城，屋室人物甚殷，遂至王宮。正值大宴，群臣侍宴者數十，其器用絲竹陳設之類，多類中國。客因升殿，俯逼王座以窺之。俄而王有疾，左右扶還，亟召巫者視之。巫至，曰：「有陽地人至此，陽氣逼人，故王病。其人偶來爾，無心為祟，以飲食車馬謝遣之，可矣。」即具酒食，設座於別室，巫及其群臣皆來祀祝，客據案而食。俄有僕夫馭馬而至，客亦乘馬而歸，至岸登舟，國人竟不見己，復遇便風得歸。時賀德儉為青州節度，與魏博節度楊師厚有親，因遣此客使魏，其為師厚言之。魏人范宣古親聞其事，為余言。\n\
    \                     ——改寫自太平廣記‧青州客"
