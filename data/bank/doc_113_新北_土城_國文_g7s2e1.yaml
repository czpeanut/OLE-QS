- id: doc_113_新北_土城_國文_g7s2e1_s1_27
  section: 1
  number: 27
  type: single
  page: 3
  stem: 本文中，鯨發出大而低頻率的聲響，目的何在？
  options:
  - label: A
    content: 通知友伴深海情報
  - label: B
    content: 警告周遭生物迴避
  - label: C
    content: 探測鯨群游息動向
  - label: D
    content: 交換食物所在訊息。
  group_stem: "鯨背月色       黛安‧艾克曼\n  藍鯨發出大而低頻率的聲響，可以越過很遠的距離。海洋以奇特和不尋常的方式傳遞聲音：有一層稱作深聲頻道的水域，因為聲波一再地折回頻道，不會喪失太多能源而使聲波可以散布到極遠的距離。在這樣的情況下，鯨的聲音可以橫越遠達五百英里，才和背景的雜音混在一起。這些日子以來，海洋被人聲汙染，但在船隻未出現的千百萬年中，鯨聲可能越過幾千英里的距離；兩隻鯨可能坐在大洋的兩端，互相溝通，內容不是複雜的會話，也未必是閒聊，只是簡單地交換可以在哪裡找到食物的訊息。鯨餓了，也許會保持沉默，吃飽了，卻可能發出聲音。飢餓的鯨，只要游向聲音最大之處，就能找到食物；如果鯨有太多可吃的東西，會跟親友分食，這對牠們也有好處，因為牠的親友可能來年就會回報牠這個人情。"
