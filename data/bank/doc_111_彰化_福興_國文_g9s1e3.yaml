- id: doc_111_彰化_福興_國文_g9s1e3_s3_38
  section: 3
  number: 38
  type: single
  page: 7
  stem: 根據本文第二段敘述，以下何者有誤？
  options:
  - label: A
    content: 墾丁森林遊樂區的前身是恆春熱帶植物殖育場
  - label: B
    content: 恆春熱帶植物殖育場的設立是因為被日本殖民而模仿他國經驗而來
  - label: C
    content: 田代安定提供財源給恆春熱帶植物殖育場發展經濟作物
  - label: D
    content: 恆春熱帶植物殖育場扮演殖民母國南進農業的基地。
  group_stem: '(四)

    造訪墾丁是多數台灣人共同的旅遊經驗，墾丁不僅吸引眾多人潮，也容納了各種不同的觀光型態，包括追尋候鳥的生態旅遊，家庭式的海濱度假，或是搖滾樂與狂歡。很多遊客也都聽過恆春三寶，也就是港口茶、瓊麻和洋蔥三個在地特產。然而比較少外人知道，卻在地方上廣為流傳的是恆春三害的說法，指的是三軍聯訓中心、核三廠以及國家公園。其中三軍聯訓中心演習造成不便甚至生命危險，核三廠帶來廢水汙染以及威脅，都比較容易理解。走進墾丁可以很輕易看見恆春居民訴求畫出國家公園甚至廢除國家公園的抗議布條。為何為地方帶來龐大觀光收益的國家公園，也被歸類為三害之一？

    墾丁森林遊樂區的前身是由植物及人類學家田代安定在 1905 年所創立的恆春熱帶植物殖育場。這個機構的設立構想主要來自於模仿其他帝國的熱帶殖民經驗。當時包括英國在阿薩姆與斐濟，以及法國在大溪地等殖民地都設立了以收集熱帶地區植物，還有提供殖民母國發展熱帶栽培業為目的的大型熱帶植物園，而在熱帶植物和熱帶栽培上取得相當的成果。作為後進帝國的植物學家，田代安定的計畫便是在氣候與前述植物園相似的恆春設置熱帶植物園，發展經濟作物進而擴充殖民地的財源，並扮演了日本帝國南進農業試驗場的角色。

    國家公園成為恆春三害，與 1970 年代兩個互相矛盾的規劃有很大的關係。1972 年墾丁海水浴場啟用，開始吸引大批國內觀光客，觀光主管單位更進一步計畫利用墾丁吸引外國人觀光以賺取外匯，一方面將墾丁規劃為台灣第一個國家風景特定區，另一方面也委託國外機構進行國際的規畫。在原始計畫包括在海濱地區建立大型旅館，以及規劃建立具中國民族風的人工設施，包括故宮分院以及古典風中式庭園等以吸引外國觀光客。雖然多數計畫都無疾而終，卻留下幾個重要遺產，包括位在小灣的凱薩、福華等大型觀光旅館，以及外在青蛙石邊由漢寶德設計，傳統閩南風格建築的救國團墾丁青年活動中心。

    然而，在觀光主管機構積極吸引外國人觀光的同時，內政部也基於生態保育的潮流，在 1982 年成立墾丁國家公園，將恆春半島大部分地區劃入禁建與限制開發範圍，使得自然活動、而非大型中國風建設成為觀光規劃的基調。然而由於海濱大型度假旅館在國家公園設立前就已確立，導致人潮湧向墾丁街上，加以近年舉辦的春吶演唱會等濱海大型活動，與國家公園所揭櫫的生態保育目標背道而馳，形成了自相矛盾的規劃，在地恆春三害的說法也因此而起。

    (節選改寫自鄭力軒〈國家公園如何成為了墾丁三害：國境之南的前世今生〉)'
