    張詠性剛毅，忽於小節。其所善友蕭楚見詠几案上有ㄧ絕，末二句云：「獨恨太平無一事，江南閒殺老尚書。」楚取筆改「恨」作「幸」。詠歸見之，云：「誰改吾詩？」左右以實對。楚曰：「公功高位，奸人側目，筆墨之間未可輕忽；且天下一統，而公獨恨，可乎？」詠嘆曰：「君真吾一字師也。」（明
    劉宗周 〈一字師〉）'
