  section: 3
  number: 29
  type: single
  page: 3
  stem: 下列關於鯊魚鱗片的敘述何者正確？
  options:
  - label: A
    content: 圖中鯊魚鱗片屬於肉眼不可見的微觀尺度
  - label: B
    content: 依據比例尺，這隻鯊魚的盾麟大小約為3mm
  - label: C
    content: 「鯊魚泳裝」因為尖刺容易受傷被國際賽事禁用
  - label: D
    content: 「鯊魚泳裝」的研發參考鯊魚皮膚的力學原理
  group_stem: '【鯊魚泳裝】

    （請閱讀本文後回答29.～30.題）

    鯊魚因為其皮膚的齒狀盾麟，具有抗阻力的能力，讓鯊魚在水中能具有高速移動並保持浮力。這樣的齒狀盾麟若用顯微鏡觀察（如下圖所示），可以發現帶有縱向凹槽，使水更靠近鯊魚的身體，從而減少表面5~10%的阻力。

    　　泳衣品牌Speedo與纖維開發廠商HeiQ根據鯊魚皮膚的流體動力學原理所設計的泳衣。大幅降低阻力的「鯊魚泳裝」，2010年推出後，讓游泳選手如虎添翼，游泳選手總計刷新了147項世界紀錄，但也因此引發爭議，沒多久就被國際賽事禁用。直到今年巴黎奧運才再度獲得世界泳總的許可，今年巴黎奧運的選手有許多就是穿著第二代的鯊魚泳衣參賽。

    【鯊魚盾麟示意圖】'
