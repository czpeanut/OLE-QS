  stem: '臺灣某大學於1955 年訪問一位出生於1885 年的原住民長老。訪問途中，研究者發現長老說話經常參雜了三種語言。

    請問：下列三種語言，長老一生中學習的順序為何？甲、日語；乙國語；丙、族語。   〈習作P29〉'
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲丙乙
  - label: C
    content: 丙甲乙
  - label: D
    content: 丙乙甲
  answer:
  - C
  answer_source: answer_key_vlm
