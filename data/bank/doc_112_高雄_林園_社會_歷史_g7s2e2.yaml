- id: doc_112_高雄_林園_社會_歷史_g7s2e2_s1_26
  section: 1
  number: 26
  type: single
  page: 1
  stem: '下表是某年國外報紙針對臺灣當時情況的專題報導摘錄，請依據內容判斷可能是下列何者發生的背景？


    | 政治社會 | 1.禁止人民參政，政府的重要職位，被首長的親信占據。<br>2.許多新任的官員，與公務上慣用日語的臺灣人無法順利溝通。<br>3.社會秩序混亂，兒童綁架案頻傳。
    |

    | :--- | :--- |

    | 民生經濟 | 1.臺灣物資大量運往中國，造成物資短缺。<br>2.臺灣的物價比第二次世界大戰期間還高出數倍，如：稻米從每斤4 元漲到每斤18～20 元、煤從每噸240
    元漲到2,000 元。政府以每擔130 元強制收購蔗糖，但民眾卻要以每擔3,000 元購買。 |'
  options:
  - label: A
    content: 雷震事件
  - label: B
    content: 西來庵事件
  - label: C
    content: 美麗島事件
  - label: D
    content: 二二八事件
  answer:
  - D
  answer_source: answer_key_vlm
