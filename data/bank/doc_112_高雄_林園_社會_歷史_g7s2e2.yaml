- id: doc_112_高雄_林園_社會_歷史_g7s2e2_s1_29
  section: 1
  number: 29
  type: single
  page: 2
  stem: 「臺灣有一位熟知各類蚊子及其傳播疾病的專家，人稱「蚊子博士」。他15 歲時便開始參與登革熱疫情的訪查，雖然因此染病，卻不減他對蚊蟲研究的熱情。國民政府接收臺灣初期，因政經情勢的變化，加上語言隔閡、文化差異，使得社會動盪不安，他只好暫停學業與研究工作。幾年後，他才又繼續投入瘧疾的防治工作，並協助臺灣成為世界第一個根除瘧疾的國家。1980
    年，他被外交部派到遙遠的南美 玻利維亞，這個內陸國家幾乎是位在從臺灣直線通過地球球心到達的另一側地表。他努力研究在當地山區蒐集到的蚊子，希望這個開發中國家也能免除瘧疾之害。」上文所述社會動盪不安的年代，主要是指下列何者？
  options:
  - label: A
    content: 1910 年代
  - label: B
    content: 1930 年代
  - label: C
    content: 1940 年代
  - label: D
    content: 1960 年代
  answer:
  - C
  answer_source: answer_key_vlm
