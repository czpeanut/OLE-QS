  stem: 「1921 年，臺灣總督在日本貴族院院會表示：帝國統治的方針，不像英國讓殖民地設置獨立議會、制定法律、議定預算的殖民地政策，而是當作正在施行帝國憲法的地方，和内地同樣自然處理，提升其文化，使之與内地相同。如果做此形容，如同内地延長主義的型態。······但本件請願··…卻希望制定將施行於臺灣的特別法律及臺灣預算的議決權賦予該議會的法律。這完全違背了帝國統治台灣的大方針·····像這種做法斷然不應容許。」上述的資料與下列哪件大事有關？                        〈習作P26〉
  options:
  - label: A
    content: 西來庵事件爆發
  - label: B
    content: 全球性民族自決風潮
  - label: C
    content: 總督府的皇民化運動
  - label: D
    content: 第一次世界大戰爆發
  answer:
  - B
  answer_source: answer_key_vlm
