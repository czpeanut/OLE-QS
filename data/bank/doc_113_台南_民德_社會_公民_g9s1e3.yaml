  stem: 我國某航空公司無預警宣布倒閉，造成大量員工立即失業，政府為避免這些員工權益受損，依法凍結該公司的剩餘資金作為資遣費之用，同時也要求該公司提出相對應的補償計畫。根據上述內容判斷，下列關於政府作為與市場勞動的敘述，何者正確？
  options:
  - label: A
    content: 政府作為是保障失業員工的職場安全衛生
  - label: B
