- id: doc_113_台南_民德_社會_公民_g9s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 根據上文內容，下列敘述何者正確？
  options:
  - label: A
    content: 比特幣是中央銀行設計出的貨幣
  - label: B
    content: 比特幣可以透過行動支付來操作
  - label: C
    content: 比特幣是由礦區的特殊礦物製成
  - label: D
    content: 比特幣和儲值卡皆利於小額支付。
  group_stem: 2010 年，一位日本人做了一個「比特幣」實驗，在電腦程式中放置固定數量的比特幣，利用虛擬帳本記錄交易。目前全球有許多協助建立帳本的人，這些人被稱為「礦工」，他們的電腦稱為「礦機」，彼此間的帳本互相流通。即不管在何處使用比特幣，只要有變動，電腦會互傳資料更新帳本。消費者只需要用手機或電腦
    APP 就可以使用比特幣來支付，只是帳本更新需要時間，會有交易速度緩慢和額外支付手續費的問題，不適合小額支付。而且比特幣不是商品貨幣，本身不具有價值，其價值取決於資料處理的速度和大眾願意花多少代價購買來做為交易的工具。請回答下列問題：
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 公民
      code: 5-2
      title: 新型態的支付工具
      chapter: 第5章 貨幣的使用
