  stem: 十三行博物館目前有超過 40 名志工，年僅 15 歲的秋萍在國中就學期間，即是「十三行文化導覽社」的小小志工，在先前的實習導覽中，啟發她對於博物館的濃厚興趣，能把專業知識傳遞給觀眾是一件很開心的事情，也讓她很有成就感。根據上述，下列何者正確？
  options:
  - label: A
    content: 學生志工適用童工的相關法律規定
  - label: B
    content: 學生從事的是無酬勞動的勞動參與
  - label: C
    content: 博物館與志工是雇主與受雇者的關係
  - label: D
    content: 博物館應符合《勞動基準法》雇用這些志工。
