- id: doc_112_彰化_溪湖_英語_g9s1e3_s6_51
  section: 6
  number: 51
  type: single
  page: 3
  stem: 51. What is the main idea of the reading?
  options:
  - label: A
    content: The role of hands in people’s lives.
  - label: B
    content: The way to order a cup of coffee.
  - label: C
    content: The meanings of a gesture in different countries.
  - label: D
    content: The differences between Germans and Brazilians.
  group_stem: 'People from different countries have different pictures of fingers.
    Even the same gesture in different countries have different meanings.

    For example, in American and European cultures, a thumbs-up sign is a symbol of
    “well-done.” In Brazil, they don’t use an “OK” gesture. Because they think it
    is not polite. So how do Brazilians say agree with a hand gesture? They will give
    you a thumbs-up sign. However, in Egypt, a thumbs-up sign has the same meaning
    as the Taiwanese middle finger standing alone. So, it would be very rude if you
    do so.

    In Germany, counting one starts with the thumb. So, if you need to order one cup
    of coffee in the German coffee shop, you need to show a thumb, not a pointer finger
    in our common knowledge.

    Next time, before you take a trip, remember the words, “When in Rome, do as the
    Romans do.” Try to know more about each country’s special gestures, or using wrong
    gestures in wrong places will lead to lots of trouble.

     gesture 手勢 European 歐洲的 thumb 大拇指

    symbol 符號 Brazil 巴西 Germany 德國

    Egypt 埃及 rude 粗俗的'
