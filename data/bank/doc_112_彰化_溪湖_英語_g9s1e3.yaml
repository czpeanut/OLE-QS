  group_stem: 'There were twin brothers named Eric and Ian. They looked the same,
    but they had different personalities. Eric always thought of the worst, but Ian
    always hoped for the best.

    One day, their parents decided to test them. They filled Eric’s room with the
    toys, while they filled Ian’s room with the horse manure.

    When they went to check on the boys, they found Eric sitting in the middle of
    his room, and crying. “What’s wrong?” they asked. “All these toys are great, but
    I know they’ll break or get old someday. Then I’ll have nothing.”

    When they went to Ian’s room, they found him digging the manure with a shovel
    excitedly. “What are you doing?” they asked. “With all the manure,” Ian replied,
    “there must be a pony somewhere in my room!”

     personality 個性 manure 糞肥 shovel 鏟子

    reply 回答 pony 小馬'
