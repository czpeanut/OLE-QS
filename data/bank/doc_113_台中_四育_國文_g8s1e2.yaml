  section: 4
  number: 29
  type: single
  page: 4
  stem: 關於與劉廷式結婚的女子，下列何者正確？
  options:
  - label: A
    content: 面貌姣好
  - label: B
    content: 身體健康
  - label: C
    content: 雙眼已瞎
  - label: D
    content: 嬌小玲瓏
  group_stem: '2.

    劉廷式本田家，鄰舍翁有一女，約與廷式為婚，後契闊數年，廷式讀書登第，歸閭訪鄰翁，而翁已死，女因病雙瞽，家極困餓。

    廷式使人申前好，而女子之家，辭以疾，仍以傭耕，不敢姻士大夫。廷式堅不可，曰：「與翁有約，豈可以翁死子疾而背之？」

    卒與為婚，其妻相攜然後行，凡生數子，閨門雍睦。其後妻死，哭之極哀。

    ~~（廷式娶妻 蘇軾 ）'
