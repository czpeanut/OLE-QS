- id: doc_113_台中_四育_國文_g8s1e2_s4_26
  section: 4
  number: 26
  type: single
  page: 3
  stem: 郄雍善視盜，其結果如何？
  options:
  - label: A
    content: 成為英雄
  - label: B
    content: 為盜賊所殺
  - label: C
    content: 成為晉國大臣
  - label: D
    content: 被趙文子害死
  group_stem: '1.

    晉國苦盜。有郄雍者，能視盜之貌，察其眉睫之間而得其情。晉侯使視盜，千百無遺一焉。晉侯大喜，告趙文子曰：「吾得一人，而一國盜為盡矣；奚用多為？」文子曰：「吾君恃伺察而得盜，盜不盡矣！且郄雍必不得其死焉！」俄而，群盜謀曰：「吾所窮者，郄雍也。」遂共盜而殘之。晉侯聞而大駭，立召文子而告之曰：「果如子言，郄雍死矣！然取盜何方？」文子曰：「周諺有言『察見淵魚者不祥，智料隱匿者有殃。』且君欲無盜，莫若舉賢而任之，使教明於上，行化於下；民有恥心，則何盜之為？」於是用隨會知政，而群盜奔秦焉。

    ~~(郄雍視盜 列禦寇)

    注釋：①郄雍：音ㄒㄧˋ ㄩㄥ。 ②奚用多為：指何必多用其他的人。 ③不得其死：指不得好死。'
