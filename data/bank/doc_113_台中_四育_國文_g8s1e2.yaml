  type: single
  page: 4
  stem: 根據本文，富蘭克林察覺到自己的自大固執後，在與他人溝通時有了什麼變化？
  options:
  - label: A
    content: 大量閱讀哲學書籍增強自己辯論技巧
  - label: B
    content: 避免使用太過肯定且給人壓力的用語
  - label: C
    content: 採用書信往返以避免當面使朋友難堪
  - label: D
    content: 避免一說話便激怒人，因此保持沉默
  group_stem: '3.

    有一個好勝心強的少年，不僅愛讀書，而且愛與人爭辯，能以口才和學識壓倒對方，成了他平淡生活中的一大樂事。

    有一次，他和一個朋友為了某個問題爭辯得面紅耳赤，但在未分勝負的狀況下就分手了，回家後他意猶未盡，又將自己的新論點寫成一封信寄給對方，而對方也寫信反駁，你來我往各寫了三、四封信，辯得不亦樂乎。但好辯的脾氣慢慢變成一種壞習慣，他發現原本愉快的交談變得劍拔弩張，一些朋友還因此反目成仇。

    後來他讀到色諾芬著的蘇格拉底回憶錄，他認真研讀，才曉得自己過去是多麼地自大、淺薄、固執而又無知。只有所知不多、閱歷有限的人才會自以為知道很多，而且對自己的正確性無所懷疑。

    於是，在和他人辯論或溝通時，他避免再用「必然的」、「無疑的」這類固執而肯定的用語，而改用「我以為」、「依我看來它似乎是」這類謙虛、不確定的用語，結果發現這種不想壓倒對方、不堅持己見的態度不僅能讓對方更加信服，而且還讓他交到更多朋友。

    他就是班傑明‧富蘭克林，後來不僅成為美國知名的政治家、科學家，也是傑出的作家與外交家。像富蘭克林這樣一個才華出眾的人，在青少年時代也許會心高氣傲、睥睨一切，其實相當可以理解。但也許因為他又多讀了一些書，及早認識到自己的少不更事，而開始以謙卑的態度來待人處事、追求知識，所以有了比其他同學更燦爛的前程。

    只有所知不多的人，才會認為自己知道很多，而且知道的那點東西很重要、很精確，逢人就說個不停。「缺少謙虛就是缺少見識」，十六歲的富蘭克林如是說。

    ~~(缺少謙虛就是缺少見識 王溢嘉)'
