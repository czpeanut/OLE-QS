- id: doc_112_彰化_福興_社會_公民_g7s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 根據文章內容，荒野保護協會成立的主要目的應為下列何者？
  options:
  - label: A
    content: 實現共同理念目標
  - label: B
    content: 完成交辦工作任務
  - label: C
    content: 營利賺取大量報酬
  - label: D
    content: 聯絡感情建立人際關係
  group_stem: ※荒野保護協會是一個期望透過自然教育、棲地保育與守護行動，推動臺灣及全球荒野保護工作的團體，自 2008 年世界地球日起，他們開始籌辦淨灘行動及進行海洋廢棄物監測，數據分析顯示塑膠垃圾一直超過海灘廢棄物數量的八成，這些廢棄物對海洋生物造成危害，不論是海龜誤食塑膠袋或是鼻孔插入吸管等事件都有有所聞，還是在臺灣附近捕獲的魚胃裡也開始發現塑膠垃圾，而海灘垃圾並未因為淨灘行動而逐年減少，「源頭減量」乃是解決塑膠垃圾問題的根本之道。有鑑於此，荒野保護協會在
    2017 年 7 月聯合眾多公民團體與行政院環保署共同籌組「海廢治理平台」，共同擬定臺灣首版海廢政策文件「臺灣海洋廢棄物治理行動方案」，督促政府重視海洋廢棄物的問題。為回應環保團體減少海洋塑膠廢棄物的訴求，行政院環保署於
    2018 年 1 月 1 日起執行「限塑」政策，公告 14 類商家不得免費提供塑膠袋，並於 2019 年 7 月 1 日起禁止連鎖飲料、餐飲店等內用飲品提供一次用塑膠吸管，違反者第
    1 次勸導，第 2 次起處新臺幣 1,200 至 6,000 元以下罰鍰。環保署表示預計 2030 年將全面禁用包含購物用提袋、免洗餐具、外帶飲料杯及塑膠吸管等一次用塑膠製品，希望透過政策的落實改變民眾的消費習慣，以達到全面「無塑生活」。荒野保護協會理事長表示：「21世紀是翻轉的世紀，從個人、企業、政府都應翻轉心態，跨領域參與生態保護。現在青年們更須學習思考，期盼留給下一代什麼樣的海洋生態環境」，別讓我們的方便成為地球的「塑便」。針對上文，回答以下問題：
