  stem: 法國飛航管制員最大工會「SNCTA」，其成立的目的最應為下列何者？
  options:
  - label: A
    content: 實踐共同環境保護理念
  - label: B
    content: 保障員工成員權益
  - label: C
    content: 建立良好人際互動關係
  - label: D
    content: 完成生產線工作任務
  group_stem: ※〔即時新聞／綜合報導〕法國飛航管制員工會目前於 4 月 25 日發動罷工，造成歐洲航班大受影響。法國民航局與飛航管制員工會的勞資紛爭仍未解決，即便當中最大工會已達成協議，仍無法阻止航班中斷。有航空公司員工表示，若相關勞工協議不盡速解決，恐將影響
    2024 巴黎奧運。據報導，飛航管制員工會群與身為雇主的法國民航局（DGAC）之間的薪資糾紛，將會引起歐洲各地的航班被迫取消、延誤。雖然飛航管制員最大工會「SNCTA」與法國民航局管理層達成工作條件的相關協議後取消罷工，但法國民航局表示，其他工會的討論尚未得出結論，因此無法避免航班被中斷。歐洲航空公司（Airlines
    for Europe, A4E）表示，歐洲去年的飛航管制員罷工導致有 1 萬 6000 架航班遭取消、8 萬 5000 架航班被延誤。該公司有員工表示，若協議無法盡快達成，飛航管制員工會罷工可能為
    2024 巴黎奧運帶來風險。根據上文，回答以下問題：
