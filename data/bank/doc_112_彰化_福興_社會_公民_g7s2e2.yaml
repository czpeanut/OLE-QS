- id: doc_112_彰化_福興_社會_公民_g7s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 文中團體對公共生活產生什麼影響？
  options:
  - label: A
    content: 監督政府施政
  - label: B
    content: 增進公共參與
  - label: C
    content: 取代政府地位
  - label: D
    content: 呼籲理性思考
  group_stem: ※有感於台灣逐漸步入高齡化社會，1995 年，時任台中光田醫院總院長王乃弘、弘道創會執行長郭東曜與老人醫院柯麗鏞院長共同發起，成立弘道老人福利基金會。在社會型態不斷改變下，從健康老化、優質照顧、經濟安全、自我實現、友善環境、人才育成六大面向，建構超過
    40 項的服務，積極回應長輩需求，長年關懷一萬多名長者，提供獨居、弱勢、失能等狀況的長輩們關懷訪視、居家服務、送物資、陪伴就醫、健康促進等服務，提供長者安心、精彩的老後生活。弘道老人福利基金會集結數家銀髮社福團體，共同設計了一款遊戲，藉由破解與積分的累積，讓不同年齡層的民眾在玩遊戲過程中，更認識與了解長輩的需求，促使其對長輩的關心與協助。此外，弘道於
    2007 年舉辦「不老騎士」摩托車環島活動、2012 年更推出紀錄片《不老騎士—歐兒兜參環台日記》與 2021 年辦理圓夢計畫「不老電競」大賽，皆受到矚目。弘道持續透過各項活動與倡議，讓社會看見「不老夢想」帶給長者生命能量，讓彼此都能更加同理，創造長者精彩的第三人生。針對上文回答以下問題：
