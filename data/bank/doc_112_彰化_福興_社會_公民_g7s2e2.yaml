  group_stem: '※『1979 年 2 月份，爆發「假酒事件」，一家設在台中縣太平洋市（現在台中市太平洋區）的合法釀酒工廠，將可造成神經中毒，甚至眼睛失明的工業用酒精（甲醇），假冒食用酒精，調製高粱酒及米酒，銷售給許多消費者，造成所謂的「假酒事件」，許多消費者同時受害，還造成交通大學一位甫自國外學成歸來的蔡姓教授，因為喝到假酒而失明。同年五月份，也在台灣中部地區，發生因食用米糠油造成「多氯聯苯中毒」事件，多達
    2,000 人因此遭受永久性的傷害，且大多屬經濟弱勢族群，尤其以設於台中縣大雅鄉（現台中市大雅區）的私立惠明學校，有全校上百位師生同時受害，無奈害廠商無力賠償，以脫產方式逃避責任，掀起社會各界對食安消費意識的高度關注與消保權益推動的迫切需求。這些消息震驚了台灣社會，原本漠不關心的民眾開始正視消費者運動，掀起社會各界對食安消費意識的高度關注與消保權益推動的迫切需求。

    當時，一群青商會友、學者專家及社會熱心人士，有感於消費者的弱勢有加以保護的必要，遂由青商會率先捐出 10 萬元，再由三商行翁肇喜先生認捐 100 萬元，借用當時李伸一律師的辦公室，以一人、一桌、一支電話，展開消費者保護工作的任務，成立消費者文教基金會，由柴松林教授擔任第一屆董事長，帶領本會全體同仁，共同肩負社會使命。嗣後，本會歷任幹部與同仁依循創會初衷，持續服務消費者，維護消費者權益，促進消保法制進步，增進產消和諧，迄今經歷
    40 餘年。』

