  stem: 根據上文，請問喜憨兒基金會當時成立的目的為下列何者？
  options:
  - label: A
    content: 協助因車禍而傷亡的受害者家屬走出傷痛
  - label: B
    content: 完成工作任務
  - label: C
    content: 實踐理念
  - label: D
    content: 營利賺取報酬
  group_stem: '※1991 年，財團法人喜憨兒社會福利基金會的創辦人蘇國禎先生，因為心臟病住院，當時他患有腦性麻痺的女兒怡佳來到他的面前，對他唱出「世界上只有爸爸好，有爸的孩子像個寶」，開啟了蘇國禎全新的人生。他從不曾預期，這位與眾不同的孩子發自內心為他所唱的一首歌，讓他看見了孩子的潛能。為了完成理念「協助喜憨兒找到自己的一片天」，蘇國禎與夥伴於
    1995 年創立了財團法人喜憨兒社會福利基金會。

    從 1997 年開始，基金會開設了喜憨兒烘焙坊，由蘇國禎帶領導師及社工協助憨兒們用工作創造社會價值，取代傳統捐款協助方式，烘焙坊的產品營利成為基金會運作的主要收入來源。目前，基金會透過專業烘焙技能訓練，塑造憨兒是「很會做麵包的天使」，成功破除了消費大眾對智障工作者的刻板印象，這種正向形象深植人心，喜憨兒烘焙坊因此受到消費者長期支持。蘇國禎說：「我們的使命，是讓憨兒活得喜悅與尊嚴；我們的願景，是讓憨兒獲得終身教育與照護。」根據上文，回答以下問題：'
