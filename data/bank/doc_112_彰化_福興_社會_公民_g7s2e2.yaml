  stem: 無國界記者組織（RSF）於 5/3 日世界新聞自由日當天發布 2024 年度「世界新聞自由指數」（World Press Freedom Index）排名，台灣由去年第
    35 名晉升至第 27 名；中國在 180 個國家和地區中排名第 172。普遍而論，台灣相當尊重媒體自由的原則，雖然遭遇假訊息和假新聞充斥的挑戰，仍持守著新聞自由模範的榜樣。根據
    RSF 公布的排名，台灣在亞太地區排名第 4，僅次於紐西蘭、東帝汶、薩摩亞，超越亞洲、南韓、日本、泰國、印尼、新加坡、菲律賓、印度等國。新聞自由指數排名第
    172 的中國，除了因禁記者人數居全球之冠，北京當局還嚴格箱制資訊管道，執行審查和監控政策以管理上傳至網路的訊息，並限制被視為敏感或違背黨路線的消息散布。今年倒數
    3 名分別是阿富汗、敘利亞與厄利垂亞，去年則是越南、中國與北韓。RSF 強調，決定世界新聞自由排名的 5 大指標中，政治指標的降幅最顯著，全球平均下降 7.6
    個百分點，皆因世界各地的新聞自由正受到執政當局的威脅，而執政當局本應是新聞自由的保障者。RSF 研判，世界各地即將舉行的大選，將給新聞工作者帶來極大的壓力。針對上文，以下說法何者有誤？
  options:
  - label: A
    content: 上文畫線部分的問題，閱聽人應該遵守專業倫理，發揮媒體自律
  - label: B
    content: 閱聽人應該分辨訊息中哪些是客觀的事實報導，哪些是媒體的特定主觀意識描述
  - label: C
    content: 閱聽人應善用工具查證訊息來源
  - label: D
    content: 媒體編輯新聞應恪守公正客觀原則進行編輯報導，發揮媒體素養能力
