  group_stem: 關於風箏的起源，眾說紛紜。宋朝陸佃認為，戰國時代的墨子已能製造可飛行三天而不會墜落的木鳶。也有人認為，首先製作木鳶的應該是工匠祖師公輸班。元朝的林坤認為風箏是楚漢相爭時韓信發明的。根據正史上的記載，一千五百年前，南朝的梁武帝被侯景亂軍包圍，正在一籌莫展時，羊侃趨前獻上計策，說：「何不模仿翱翔天上的鴟鳶，製造紙鳶向外求援？」中國歷史上記載的第一隻風箏於是誕生。據說後來有人在紙鳶上加上竹笛，風一吹就會發出像竹箏一樣的聲響，所以叫「風箏」。
