  section: 1
  number: 17
  type: single
  page: 2
  stem: 小亮手機包膜店的手機保護貼每片貼到好賣 500 元，每天可賣 30 片。今天作促銷特價優惠，所以降價賣出。若每降 5 元可多賣 1 片，且當天此手機包膜店的手機保護貼共獲得收入
    21000 元，若假設當天降價 $5x$ 元，則依題意可列出下列哪一個一元二次方程式?
  options:
  - label: A
    content: $500\times 30-(500-5x)(30-x)=21000$
  - label: B
    content: $(500-5x)(30+5x)-500\times 30=21000$
  - label: C
    content: $(30-x)(500+5x)=21000$
  - label: D
    content: $(500-5x)(30+x)=21000$。
