  group_stem: 'What’s True About Sleep?

    In a new study, researchers asked some adults some questions about teenagers’
    sleep. The researchers wanted to find out if the adults believed some sleep myths.
    One myth is that sleeping late on weekends is good. Another myth is that later
    school starting time encourages teenagers to stay up late. They surveyed the adults
    and found that two-thirds of them believed these myths.

    After getting too little sleep Monday through Friday, many teenagers sleep late
    on weekends, sometimes until noon. Catching up on sleep on weekends isn’t good
    for teenagers. They still feel tired on weekdays. In fact, short naps during the
    week are better.

    Also, when school starts later, teenagers do not necessarily stay up later. Research
    shows that when school starts later, teenagers can get more sleep, have a better
    mood, and do better in the classroom. The ideal starting time should be 8:30 a.m.
    or later according to one researcher.


    researcher 研究員 adult 成人 encourage 鼓勵 nap 小睡

    survey 調查 necessarily 必然地 mood 心情 ideal 理想的'
