  group_stem: 'We can use water to make clean energy without any smelly smoke or dirty
    pollution. The energy can give us electricity. That''s why, high in the mountains
    of Switzerland, they''ve just built the power plant, a water battery!

    It''s made of two huge lakes, one high above, and one down below. To make electricity,
    water moves super-fast from the high lake down to the low lake, through big long
    tunnels! Inside the tunnels are huge turbines. They look like the blades of a
    fan, but much, much bigger!

    The power of the water makes the turbines spin really fast. As the turbines spin,
    they make electricity! This water battery is so big. It took 14 years to build,
    and it can make enough electricity for 900,000 homes! That''s more than they need
    in Switzerland, so they want to share it with the other countries in Europe. (The
    reading is partly rewritten from News Lunchbox 2023-01-09)


