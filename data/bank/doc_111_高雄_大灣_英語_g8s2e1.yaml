- id: doc_111_高雄_大灣_英語_g8s2e1_s4_3
  section: 4
  number: 3
  type: single
  page: 3
  stem: 3. What does it in the second line mean?
  options:
  - label: A
    content: Country.
  - label: B
    content: Way.
  - label: C
    content: Death.
  - label: D
    content: Tomb Sweeping Day.
  group_stem: 'People from different countries see death in different ways. In Taiwan,
    we seldom talk about it, even on Tomb Sweeping Day, often on April 4th or 5th
    of the calendar. People in Taiwan go to graveyards to clean their family members’
    tombs and prepare lots of food for the dead to show their respect and love. In
    Mexico, people there celebrate the Day of the Dead with joy. During the festival,
    people there also sweep tombs, but they remember their dead relatives in a lively
    way.

    Two years ago, I visited my friend, Rosa, in Mexico. I was there for the Day of
    the Dead on November first and second. We invited the spirits of her departed
    ancestors back to our world. We painted our faces and dressed up in costumes,
    special clothes for the festival. Later, we danced at a street party. It was so
    fun. Back to Rosa’s house, there were flowers, candles, candy, and food on the
    table. Her family cooked a big meal for everyone, and then shared touching stories
    of their dead relatives with me. For Mexicans, the Day of the Dead is all about
    love, not a scary festival. (The reading is partly rewritten from Nani Reading
    Comprehension.)


    tomb 墳墓 respect 尊敬 relatives 親屬 spirit 靈魂

    departed 已逝的 ancestors 祖先 touching 感人的'
  tags:
