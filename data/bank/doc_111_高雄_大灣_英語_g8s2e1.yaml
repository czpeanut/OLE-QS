  group_stem: 'Chang Wan-ji and his wife, Hsu Sho-er, have a laundry business in Taiwan.
    Their customers left hundreds of clothes in their store. They didn’t want to throw
    them away, so their grandson decided to use those clothes to dress them up and
    upload their photos to the Internet. People love their new styles. Chang and Hsu
    are all happy about that. Today their Instagram page has over 650,000 fans, and
    the number keeps growing. Chang and Hsu’s story is not just about clothes, but
    also about circular fashion. By giving new life to old clothes, we will make less
    trash. So, why not learn to use old clothes in new and interesting ways? That
    way, you can be fashionable and also save the Earth. (The reading is rewritten
    from KNSH B4L1.)


