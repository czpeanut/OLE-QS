- id: doc_113_新北_福和_社會_歷史_g8s1e2_s1_24
  section: 1
  number: 24
  type: single
  page: 1
  stem: '以下是宋朝對外關係的重要文件，請問下列敘述何者正確？

    紹興和議

    1. 重劃宋、金兩國的邊界，東以淮水中流、西以大散關為界，宋割唐州、鄧州（在今河南省），又重定陝西地界，宋失去商州（在今陝西省）、秦州（在今甘肅省）兩州約一半土地予金。

    2. 宋奉表稱臣於金，金冊宋主為皇帝。

    3. 每逢金主生日及元旦，宋均須遣使稱賀。

    4. 宋每年向金繳納貢銀二十五萬兩、絹二十五萬匹。從紹興十二年（1142 年）開始，每年春季送至泗州交納。'
  options:
  - label: A
    content: 在「永嘉之禍」爆發之後簽訂
  - label: B
    content: 簽約的雙方是對等的外交關係
  - label: C
    content: 簽約後契丹族成為東亞霸主
  - label: D
    content: 此時汴京在金國的掌控之中。
