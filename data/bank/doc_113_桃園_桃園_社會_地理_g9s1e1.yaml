- id: doc_113_桃園_桃園_社會_地理_g9s1e1_s1_20
  section: 1
  number: 20
  type: single
  page: 1
  stem: 西班牙因氣候環境適宜，因此成為歐洲重要的蔬果生產地，其中位於該國東部的布尼奧爾(Bunol)每年均會舉辦番茄節活動，來自世界各地的遊客和當地居民，會以番茄為武器，相互丟番茄，在街頭展開混戰。當地政府考量舉辦時的天氣狀況能夠吸引到最多的人潮，因此選擇在降水機率低的時間舉辦。請問：下列何者是番茄節的最佳舉辦時間？
  options:
  - label: A
    content: 1 月
  - label: B
    content: 3 月
  - label: C
    content: 8 月
  - label: D
    content: 12月。
