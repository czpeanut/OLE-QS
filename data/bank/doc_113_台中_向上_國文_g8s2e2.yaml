  group_stem: '衛鞅為左庶長，卒定變法之令。令既具，未布，恐民之不信，乃立三丈之木於國都市南門，募民有能徙置北門者予十金。民怪之，莫敢徙。復曰「能徙者予五十金」。有一人徙之，輒予五十金，以明不欺。卒下令。令行於民一年，秦民之國都言初令之不便者以千數。於是太子犯法。衛鞅曰：「法之不行，自上犯之。」將法太子。太子，君嗣也，不可施刑，刑其傅公子虔，黥其師公孫賈。明日，秦人皆趨令。行之十年，秦民大悅，道不拾遺，山無盜賊，家給人足。民勇於公戰，怯於私斗，鄉邑大治。秦民初言令不便者有來言令便者，衛鞅曰「此皆亂化之民也」，盡遷之於邊城。其後民莫敢議令。


    改寫自司馬遷〈史記．商君列傳〉'
