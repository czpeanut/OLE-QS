- id: doc_113_台中_向上_國文_g8s2e2_s3_26
  section: 3
  number: 26
  type: single
  page: 2
  stem: "住在直布羅陀海峽兩側的居民，都討厭黎凡特風。這種只在西地中海才有，自荷馬史詩時代就存在的極端氣候，「不友善」是比較委婉的副詞，它會對所經過的一切拉扯、推擠，並撕裂有形與無形的事物，而意志薄弱的人，在終朝狂風的霸凌後，也可能精神崩潰。\n\
    \    直布羅陀的黎凡特風，比佛洛伊德筆下的少女朵拉更加歇斯底里，也比漢娜．鄂蘭書裡的艾希曼還要邪惡。地中海沿岸邊的砂石，被強風狠颳一空，只留下堅硬嶙峋、沉默無語、難以親近的光禿地面。看不見的蠻橫，吹翻汽車、茶水攤，打落招牌、電線，許多看起來有點年紀的樹，攔腰折斷，往返海峽的渡輪、航班停擺，旅館擠滿了心事重重的人們。家家戶戶緊閉門窗，路上行人寥寥可數，很難想像這樣瘋狂的日子，竟然是陽光普照、晴空萬里的好光景。留在街上的，只有飛舞的殘葉、垃圾、沙塵，和無處可去的我。\n\
    \    古代的西班牙水手之間，流傳著許多關於黎凡特風的諺語：『風一來，猴子的毛都颳得下來。』、『黎凡特風吹的時候，海克力斯之柱都會搖動。』、『黎凡特風一來，連丈母娘都閉上嘴。』\n\
    \    在毫無道理可言的風暴摧殘下，每個人，都成了頹廢的受詞。無論是行走在街上，或是在百無聊賴的漫長等待中，我可以感覺到自己的靈魂，正以溫柔的方式生鏽、腐朽，在憂傷裡節節敗退。\n\
    \n謝哲青《路過全世界的人》\n關於本段文字的寫作手法，下列何者正確？"
