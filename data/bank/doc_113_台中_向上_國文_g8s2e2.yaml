  stem: 根據本文，下列關於鐵氟龍的敘述何者正確？
  options:
  - label: A
    content: 鐵氟龍在被發現後，很快就被運用在航太、軍用、廚具等領域
  - label: B
    content: 鐵氟龍廚具擁有不怕熱、不怕水、不怕酸鹼亦不怕磨損的特性
  - label: C
    content: 經過燃燒反應，能完全去除鐵氟龍產品中可能致癌的全氟辛酸
  - label: D
    content: 製品觸及層面很廣，但不沾鍋因製程讓部分人士有食安的疑慮
  group_stem: "鍋具是在烹調食物上重要的角色，從鐵鍋、銅鍋、不鏽鋼鍋到不沾鍋，在使用特性上各有不同，而其中不沾鍋因不會沾黏食物的特性，而受到許多烹飪者愛用。能有「不沾」效果要歸功於在1938\
    \ 年被發現的聚四氟乙烯，也就是被稱為鐵氟龍的化學物質。\n  美國杜邦公司的化學研究員羅義・甫南克，在研究實驗時將四氟乙烯氣的儲氣罐放在乾冰裡，結果秤量儲氣罐重量時仍和原本裝滿氣體時一樣重，但裡頭產生許多白色粉末。加以分析之後發現這些粉末是四氟乙烯的聚合物，有高熔點、不怕熱、不怕水、不怕酸鹼的特性，甫南克「＿＿＿＿＿＿＿＿＿＿＿」，意外發現了這個化學物質。\n\
    \  爾後杜邦公司將這個化學物質以鐵氟龍註冊商標，被用於製造軍事設備、太空梭零件、真空設備等，1954 年有人想到可運用到鍋具上，不沾鍋便因此被製造販售。但關於不沾鍋是否安全的問題一直持續爭論著，主因在於製造鐵氟龍會使用全氟辛酸——被國際癌症研究機構列為讓人類可能致癌的物質。\n\
    \  特性上，鐵氟龍本身十分穩定，並不會與其他物質產生反應，根據美國癌症協會的公告，鐵氟龍也並無導致癌症的疑慮。美國癌症協會也指出，在製造過程中全氟辛酸會被燃燒反應，且並不會大量存在鐵氟龍製品之中，不沾鍋並非人們接觸全氟辛酸的主要來源。\n\
    \n改寫自陳韻竹〈食品史上的4 月6 日：不沾鍋材質鐵氟龍被發現〉"
