  stem: '在實驗室進行酵素作用的實驗，在甲、乙、丙、丁四支試管內加入試液的情形如附表所示（○表示加入，╳表示不加入）。若想證明唾液內酵素的活性隨溫度升高而增加，應取哪兩組做實驗組與對照組？


    | 試管 | 材料 | 加唾液 3mL | 加清水 3mL | 溫度(℃) | 步驟一 | 步驟二 |

