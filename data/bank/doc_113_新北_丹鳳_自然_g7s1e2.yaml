    | 甲 | 澱粉液 3mL | ○ | × | 先加熱到 100℃，再冷卻至 40℃ | 靜置 30 分鐘後加入本氏液 | 各試管中加入本氏液後，再隔水加熱
    5 分鐘 |

    | 乙 | 澱粉液 3mL | ○ | × | 40 | | |

    | 丙 | 澱粉液 3mL | ○ | × | 10 | | |

