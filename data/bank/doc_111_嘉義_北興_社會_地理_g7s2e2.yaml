  group_stem: 《題組》二年級隔宿露營的地點多次前往烏樹林糖廠探索園區。美麗的烏樹林糖廠建於西元1910 年(明治43 年)，曾經是遠近馳名的白糖產地，而轄屬的烏樹林車站，亦曾擔任早期臺南縣後壁、白河、東山與新營都會五分車鐵道連結的樞紐，在日治時期曾因生產的糖品質優良且風味獨特而獲得日本皇室採用，有「御用糖」之稱號。西元1983
    年基於營業考量，結束烏樹林糖廠製糖業務，鑒於無工業及空氣污染，適合蘭花及觀賞植物等生長，於西元1989 年設立□□農業發展中心，培育蝴蝶蘭。西元2001 年，就讀於台南藝術學院的研究生，源於對鐵道的熱愛，向台糖呈送一份「開往烏樹林」的計畫書，從此開啟五分車的新頁，俗稱觀光小火車時代來臨。請根據此文，回答1-4
