  stem: 每年 10 月起至翌年 4 月底，捕撈鰻魚魚苗是臺灣沿海漁民傳統產業活動之一，更是許多漁民維持生計的重要經濟來源。農委會近年訂定相關捕撈規定，其中一項是：「每年自
    3 月 1 日至 10 月 31 日，禁止於距岸三浬內海域、潮間帶及河口水域以任何方式捕撈鰻苗」。上述規定最可能是為了達成下列何種目的？
