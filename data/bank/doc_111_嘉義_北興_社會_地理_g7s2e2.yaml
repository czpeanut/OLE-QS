  stem: 臺灣有句俗諺「一午、二鯧，三鮸、四馬加、五嘉鱲」，也就是說臺灣民間好吃魚類的排行榜依次為午仔魚、白鯧、鮸魚、馬加魚（土魠魚）和嘉鱲魚。其中嘉鱲魚通常棲息在大陸棚一帶而且是沙質海床為主的海域，主要以各類底棲動物為食。右圖為臺灣附近海域的等深線分布圖，其中哪個區域最容易發現嘉鱲魚的蹤跡？
