    的距離皆為 25 公分。若 $A$ 球撞擊球檯邊 $\overline{QR}$ 上的 $B$ 點，反射後又撞擊 $\overline{SR}$ 上的 $C$
    點，再反射後恰好撞擊到 $D$ 球，且 $\angle 1＝\angle 2$，$\angle 3＝\angle 4$，則下列何者正確？
  options:
  - label: A
    content: $\angle 1＝\angle 4$
  - label: B
    content: $\angle 3＝\angle 6$
  - label: C
    content: $\angle 5＋\angle 6＝90^\circ$
  - label: D
    content: 路徑 $\overline{AB}//\overline{CD}$
  group_stem: '請閱讀下列敘述後，回答第 26～27 題

    撞球是一種有多重玩法的技巧運動，其共同點是使用撞球桿撞擊一般為白色的母球，令其在撞球桌上滾動並撞擊其他球(子球)，以達成特定目的。最常見的撞球種類為花式撞球
    Pool 和司諾克 snooker，兩者都強調技術與專注力的結合，是極具觀賞性的體育項目。大多數人打撞球完全是憑自己的感覺發揮，但你不知道的是撞球的擊球方式、運動軌跡都包含著各種物理規律，這些物理規律操控著整盤撞球的走勢。

    撞球桌用布覆蓋，球桿的邊界則是彈性保險槓。正式撞球桌的長度必須是寬度的兩倍，例如，一張 9 英尺的官方桌子寬 4.5 英尺(1.37m)，長 9 英尺(2.74m)。'
