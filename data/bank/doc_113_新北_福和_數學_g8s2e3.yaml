  group_stem: '請閱讀下列敘述後，回答第 24～25 題

    2020 東京奧運的 logo，是由擅長運用幾何圖形的設計師野老朝雄所設計，使用日本江戶時代傳統圖紋「市松紋」，以三種不同的矩形方塊組成，象徵著不同國家和文化，而這些方塊的連接點則寓意著彼此之間的連結和協調，這不僅是一個視覺設計，更是一個蘊含著深刻理念和文化意涵的作品，它展現了日本的傳統文化，也呼應了奧運所倡導的價值觀。如圖(26)所示。

    如果在每個矩形外畫出一個對應的「菱形」，完成後會發現，整個 logo 的外圍與中間的環狀圖案都是正十二邊形，如圖(27)所示。觀察圖中這三種不同矩形所畫出的對應「菱形」，會發現這三種菱形的周長均相等，且每個菱形各邊中點相連，就形成了矩形，每個矩形面積皆是其對應菱形面積的一半。'
