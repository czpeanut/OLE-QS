- id: doc_112_桃園_文昌_國文_g8s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 「近一、二年來，我對臺北盆地附近，位於新店山區的一片海拔三百公尺上下的次生林，做長時間的觀察，且發現它動人的豐美。」根據徐仁修在〈森林最優美的一天〉的景色描摹，何者與「長時間的觀察」才能發現的細膩景致相呼應？
  options:
  - label: A
    content: 天氣忽然放晴，我迫不及待地揹起攝影裝備，沿著走過上百次的小徑進入森林
  - label: B
    content: 山黃梔的花朵也如金銀花一般，初開時是白色，快謝時轉為橙黃色
  - label: C
    content: 每次聞到金銀花特殊的香味，或瞧到它悅目的小花，都會想起那苦中帶甘的童年
  - label: D
    content: 迎面而來的是許許多多雪片一般飛落的油桐花，飄蕩著、旋轉著，好像仙女散花一般。
  lesson_raw:
    number: L5
    title: 森林最優美的一天
    basis: 題目考〈森林最優美的一天〉課文內容
