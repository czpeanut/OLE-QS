    content: ''
    asset:
      key: optD
      file: doc_112_桃園_文昌_國文_g8s1e2/2_30_optD.png
  group_stem: '（二）節錄《江戶紋樣歲時手帖》 熊谷博人(著)/李璦祺(譯)

    由於牽牛花在凌晨綻放，因此日文中稱為「朝顏」。加賀千代女的俳句中敘述：「井邊朝顏，蔓攀吊桶，不忍摧花，借水他家。」綻放在長屋巷弄中的朝顏，是江戶夏天少不了的景色。栽種帶來應景夏日風情的牽牛花，是許多江戶平民的嗜好之一。

    牽牛花自中國傳入日本，最早始於奈良時代到平安時代這段期間，由遣唐使當作藥物帶回。牽牛花的種籽可入藥，中藥稱為「牽牛子」。在日本也有「牽牛花」的別名，語源來自牽牛星，因為牽牛花是在七夕前後開花。

    江戶時代社會較為穩定，人民的生活也相對安定許多，自然有餘暇追求精神層面的事物，就算是只有小庭院的人家也會種植一些花花草草，這在當時形成一股園藝熱潮。花木的栽種不分貧富貴賤，上自上流的武士階級，下自住在長屋裡的庶民，所有人都樂在其中。

    日本四季分明，花卉饒富變化，此時可以在狹窄的土地上享受園藝樂趣的「盆栽」大為流行。較易改良品種的杜鵑花、牽牛花、菊花等花卉深受歡迎。其中，牽牛花種類繁多，花色有紅白、深藍、蔥綠、黃褐、混色等不同顏色，花的種類更是超過千種，花多愈大買氣愈旺。

    珍貴品種的盆栽成了投機、獲利的對象，高價的盆栽換算成現代的價格，可賣到數十萬甚至數百萬日幣，因此江戶幕府頒布了高價盆栽的買賣禁令。然而無論在什麼時代，都有人無視法規，進行地下交易。品種改良完全變成以賺錢為目的。但似乎無損於牽牛花所帶來的園藝熱潮。

    昭和時代的作家白洲子在《花日記》中寫道，牽牛花等花卉靠著生物科技不斷推出新的品種，但在這種一股腦兒的品種改良所創造出來的，雖然是活的東西，但卻感受不到「生命」，變成單純的「物品」而已。看來科技進步與生命之間的關係，將是今後愈來愈重要的課題。'
