- id: doc_112_桃園_文昌_國文_g8s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 「我微醉著，不由自主地、輕輕地被引向林中深處。有那麼一剎那，我認為自己已丟棄了軀殼，正輕鬆自在又滿足地走上通往更高境界的地方。也只有像我這樣深入、珍惜大自然的人，才會受到邀請，才能找到這條美麗的祕徑。」有關〈森林最優美的一天〉此段敘述，下列何者正確？
  options:
  - label: A
    content: 初夏天氣微涼，作者小酌後帶著些許醉意遊走森林
  - label: B
    content: 走向森林時，就算只有一剎那，也要進入冥想境界
  - label: C
    content: 只有攻下山頂，才能拋開迷惘，通往更高階的境界
  - label: D
    content: 說明真心對待大自然，才能發掘與體會美好的景觀。
  lesson_raw:
    number: L5
    title: 森林最優美的一天
