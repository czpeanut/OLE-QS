  stem: '有關安藤忠雄追求夢想的歷程中，下列資訊何者是錯誤的？


    | 選項 | 年齡紀事 | 影響 |

    | --- | --- | --- |

    | （A） | 13 歲時，家中增建二樓 | 感受光線魅力，啟發從事建築業之夢 |

    | （B） | 24 歲時，摸索建築之旅 | 以實際體驗為師，直接感受建築之美 |

    | （C） | 35 歲時，設計住吉的長屋 | 開始在日本建築業界顯現特出的才華 |

    | （D） | 60 歲時，持續不斷的競圖 | 透過不斷地增能，獲得重要國際競圖。 |'
  options:
  - label: A
    content: 13 歲時，家中增建二樓；感受光線魅力，啟發從事建築業之夢
  - label: B
    content: 24 歲時，摸索建築之旅；以實際體驗為師，直接感受建築之美
  - label: C
