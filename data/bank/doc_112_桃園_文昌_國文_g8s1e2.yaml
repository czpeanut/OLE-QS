  stem: 《論語．為政》：「君子周而不比，小人比而不周」，何晏〈集解〉對「周」字的詮釋為「忠信」；「比」字為「結黨徇私」。根據〈愛蓮說〉中象徵君子人格之句，何者最能用以勸誡《論語》中的小人？
