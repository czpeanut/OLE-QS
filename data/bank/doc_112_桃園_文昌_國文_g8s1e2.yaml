  type: single
  page: 2
  stem: 夢丹青欲完成以菊花為詩的水墨畫屏風，而下列何者不會出現在畫屏上？
  options:
  - label: A
    content: 花開不並百花叢，獨立疏籬趣未窮。寧可枝頭抱香死，何曾吹落北風中
  - label: B
    content: 待到秋來九月八，我花開後百花殺。沖天香陣透長安，滿城盡帶黃金甲
  - label: C
    content: 冰雪林中著此身，不同桃李混芳塵。忽然一夜清香發，散作乾坤萬里春
  - label: D
    content: 淺紅淡白間深黃，簇簇新妝陣陣香。無限枝頭好顏色，可憐開不為重陽。
  answer:
  - 乾「癟」
