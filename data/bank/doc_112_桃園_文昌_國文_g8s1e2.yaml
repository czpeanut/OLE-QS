  type: single
  page: 2
  stem: '劇作家莎翁擔任劇本大綱創作的評審，其內容須包含四項慣用語的人物設定，從參賽大綱中看不出哪一種慣用語？


    【參賽大綱】

    一位不諳水性的富二代演員，為了讓勻稱的身材更趨完美，使自己更上鏡，於是花大錢聘請教練學習游泳。誰知教練只是虛張聲勢且技藝不精，致使教學發生失誤。於是富二代沉入水中，穿越至……'
