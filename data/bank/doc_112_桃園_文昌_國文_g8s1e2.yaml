- id: doc_112_桃園_文昌_國文_g8s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 「說，亦稱『雜說』，是用來解析事理，闡述己意的文體。源於先秦策士進說獻謀的『游說』之辭，為了說服人，這些說辭都注重辭采。有的「說」體文帶有雜文的性質，或寫一時所感，或記一時所見，題目可大可小，內容、寫法和風格靈活多樣，著名作品有韓愈的〈馬說〉、〈師說〉，周濂溪的〈愛蓮說〉等。而在〈馬說〉一文中，藉伯樂不常有，導致千里馬常食不飽、力不足，來寄託自己的落寞無奈，同時也揭露古代帝王多不具慧眼的現象，在說理之外，挾帶了幾分情感。」根據本文，下列有關「說」之敘述何者正確？
  options:
  - label: A
    content: 「說」是一種夾雜多人觀點而成文的一種文體
  - label: B
    content: 遊說之辭講求實事求是，重真摯情感
  - label: C
    content: 取材客觀且多元，內容多以第三人稱方式寫成
  - label: D
    content: 〈馬說〉ㄧ文藉物說理，並抒發情懷。
  answer:
  - 「鴟」梟
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
      code: 第四課
      title: 愛蓮說
      chapter: null
    textbook: 八上 第四課 愛蓮說
    labeled_by: ai
- id: doc_112_桃園_文昌_國文_g8s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 「人類所謂的荒野是人用有限的眼光，從短視的經濟角度來思量，所以它成了沒有價值的地方。荒野其實不荒，它蘊藏著無限生機，充滿著形形色色的物種，更是野生動植物的天堂。人應學習從生態的角度來看待它，那麼荒野不只有情，還藏有解開生命奧妙的智慧。」根據本文，推論出徐仁修對荒野之觀點？
  options:
  - label: A
    content: 荒野的價值須放遠眼界，摒除人類立場來觀之
  - label: B
    content: 荒野的生機，須從野生動植物的品種多寡察看
  - label: C
    content: 人類應該從生態的角度來決定荒野存滅的價值
  - label: D
    content: 荒野的有情與生命的奧妙，來自於人類的反思
  lesson_raw:
    number: L5
    title: 森林最優美的一天
    basis: 引用徐仁修觀點，為〈森林最優美的一天〉作者
  answer:
  - 山黃「梔」
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
      code: 第八課
      title: 找尋失落的水源
      chapter: null
    textbook: 八上 第八課 找尋失落的水源
    labeled_by: ai
