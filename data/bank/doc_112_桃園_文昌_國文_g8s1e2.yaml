  section: 2
  number: 27
  type: single
  page: 4
  stem: 下列何者為作者對「養心」的最佳詮釋？
  options:
  - label: A
    content: 寡欲
  - label: B
    content: 無欲
  - label: C
    content: 誠立
  - label: D
    content: 明通。
  group_stem: '（一）〈養心亭說〉 周濂溪

    孟子曰：「養心莫善於寡欲。其為人也寡欲，雖有不存焉者①，寡矣；其為人也多欲，雖有存焉者，寡矣。」予謂養心不止於寡焉而存耳，蓋寡焉以至於無。無，則誠②立明通③。誠立，賢也；明通，聖也。是聖賢非性生，必養心而至之。養心之善有大焉如此，存乎其人而已。

    張子宗範有行、有文，其居背山而面水。山之麓，構亭甚清淨，予偶至而愛之，因題曰「養心」。既謝，且求說，故書以勉。


    小字典：

    ①雖有不存焉者：省略「本性」一詞，指本性漸失無法保留

    ②誠：真誠

    ③明通：通達事理。'
  tags:
