  section: 1
  number: 15
  type: single
  page: 2
  stem: 「凜冽的北風阻擋不了前往中臺灣賞花的遊興，漫步花徑中，陣陣幽香撲鼻而來，蒼勁的枝幹綴滿朵朵小白花，讓人彷彿置身於國畫之中。」此段敘述中，未運用到何種摹寫修辭？
