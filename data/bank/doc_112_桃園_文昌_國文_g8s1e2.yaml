  stem: 根據加賀千代女的俳句中的資訊，下列選項中的江戶紋樣何者最接近文中的朝顏？
  options:
  - label: A
    content: ''
    asset:
      key: optA
      file: doc_112_桃園_文昌_國文_g8s1e2/2_30_optA.png
  - label: B
    content: ''
    asset:
