- id: doc_112_桃園_文昌_國文_g8s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 「戰國時秦、楚為兩個敵對的大國，地處兩者間的韓、趙、魏等弱小國家，為了在夾縫中求生存，立場搖擺，一下以秦國為侍奉的對象，一下又依附於楚國。當時的說客策士，也沒有尊君愛國的觀念，為了自身的利益，在各國間遊走不定。」根據「朝秦暮楚」的典故，下列選項中的對話，何者正確運用其涵義？
  options:
  - label: A
    content: 羅密歐：「每逢『朝秦暮楚』之日，妳那輕盈的腳步，在石板上翩翩起舞」
  - label: B
    content: 茱麗葉：「突然的快樂，會有突然的結局，如同『朝秦暮楚』的易碎夢境」
  - label: C
    content: 安東尼奧：「任何顯著的罪惡，皆在外表裝出一副『朝秦暮楚』正義之貌」
  - label: D
    content: 哈姆雷特：「我是正統王室血脈，豈能受利益誘惑而成『朝秦暮楚』之輩」。
  tags:
