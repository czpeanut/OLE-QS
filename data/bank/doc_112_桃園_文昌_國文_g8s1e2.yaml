  group_stem: '（三）自學選文：節錄自Cheers 快樂工作人雜誌第91 期

    「如果不是做建築家，你會做什麼呢？」

    「如果我不做建築家，我的人生就很失敗，沒什麼好說的。」

    一九四一年，安藤忠雄在大阪出生，從小由外公外婆養大。後來，外公過世，安藤忠雄與外婆必須獨立生活。因此，當外婆開了雜貨店，他就幫忙顧店。每當鄰家的木匠帶著設計圖出入，不僅會跟他玩，也會教他削木頭。懵懂之間，安藤忠雄覺得很喜歡用木頭做東西的感覺。13
    歲時，安藤忠雄與鄰家的木匠合作增建家裡的二樓。當他在幽暗的長屋開了一個天窗，第一次，他體驗到自然光線的魅力，小小心靈中，愛上建築。隔年，當鄰家有個失怙少年需要地方住，安藤忠雄自己設計施工，為少年蓋了一個
    7 坪大的加蓋小屋。第一次，他興起自己的夢想：從事建築業。發現夢想並不容易，但是，該如何去做，努力實現夢想，卻是大的挑戰。

    安藤忠雄渴望進大學念建築，但在龐大的經濟壓力下，他必須放棄念大學建築系的正規管道。他清楚地知道夢想只有一個，但是，邁向夢想的道路卻有很多途徑。安藤忠雄在演講中曾言：「康莊大道上綻放許多花朵，但是，我一個人卻走著這條大家都看不見的路，於是，我對自己說，我要讓這條路也能開花結果。」於是，他透過工作與讀書，繼續自學建築。刻苦自學只是實現夢想的初體驗，後面還有不屈不撓的奮鬥歷程。

    24 歲時，他存了微薄的旅費，從搭貨輪開始，踏上一個人對建築的摸索之路。經西伯利亞鐵路到莫斯科，然後從北歐進入中歐、南歐、直到印度。當他目睹廣大的海平面，與在西伯利亞鐵路上連續5
    天看著窗外一望無際的溼地草原，他比建築系學生更直接體驗何謂「水平」；當他在希臘仰望巴特農神殿時，他親身體會何謂「垂直」。透過旅行，全世界的建築鉅作都跳出教科書，成為他的老師。回國之後，他毅然開設自己的建築師事務所，沒想到，他周遭的人都說：「你沒受過正規的教育，怎麼能成為一個建築家？」在日本菁英主義的環境下，這些質疑的確為真，但是，安藤忠雄追尋建築夢的熱情與意志力卻更為深刻。

    「只要有一，就會有十」，是安藤忠雄深信的一句日本諺語。他曾向大阪市政府提案，希望綠化屋頂，結果市政府毫不理睬。但他仍不斷加入新的創意，持續提案三、四次，最後，大阪市政府深感困擾，並言：「安藤先生，你以後再帶這種提案來，我們要逮捕你喔！」為了將想法實踐，他的提案儘管屢戰屢敗，但就是從不放棄。後來，關注環境與綠能的京瓷公司看到他的提案，覺得很有趣而加以採用。這個成功讓安藤忠雄更堅信，「如果沒有發聲，就不會有任何機會……如果你有一個想法，你必須要一直說，一直說。因為，菁英分子不容易被說服。」

    35 歲，安藤忠雄在大阪近郊設計「住吉的長屋」，狹窄的房屋中間有著天窗與自有的庭院，創新的設計，讓安藤忠雄終於在日本建築業界嶄露頭角。接著，安藤忠雄慢慢接下較有規模的案子，也開始在海外成名，一九九五年，安藤忠雄54
    歲，終於獲得建築界最高榮譽的肯定：普立茲克獎。

    他的夢想之路，卻不因為受獎等身而特別順遂，「在這條建築路上，我常常一個人不安的摸索著。」他把每一次筋疲力竭的競圖當作磨鍊思考、激發潛力、跟國際知名建築師觀摩交流的拳擊場。終於，二○○一年十月底，他陸續贏得法國等地的重要國際競圖。

    現在的安藤忠雄，儘管早已晉升國際大師，仍然秉持著熱情與意志力，追尋著他的建築夢。不同的是，與剛入行前相比，當初那條沒人看見的孤獨路，現在，已經綻放出滿徑的繽紛花朵。'
