  section: 1
  number: 30
  type: single
  page: 1
  stem: 臺灣原住民族屬於南島語族，其由來與發展的特色為何？
  options:
  - label: A
    content: 南島語族目前是臺灣人數最多的族群
  - label: B
    content: 南島語族源自於中國大陸黃河流域附近
  - label: C
    content: 南島語族的分布範圍很廣，主要是在歐美地區
  - label: D
    content: 南島語族於數千年前陸續遷至臺灣，又擴散到其他地區
