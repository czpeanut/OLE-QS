- id: doc_113_新北_忠孝_社會_歷史_g7s1e1_s1_28
  section: 1
  number: 28
  type: single
  page: 1
  stem: "歷史學者針對史前時代的器物進行下列研究－\n   研 究 一 ： \n    在考古遺址中發現中國大陸和東南亞一帶的銅錢，還發現 \n    許多金、銀和銅製的金屬裝飾品、繩紋陶器、煉鐵爐殘渣\n\
    \    及瑪瑙珠首飾等，亦挖掘出獸骨、魚骨和碳化稻米、種\n    子，反映出當時的生態發展概況與對外交通頗為便利。\n   研 究 二 ：\n    這裡是臺灣範圍廣大、出土遺留最為豐富的考古遺址之\n\
    \    一，光是出土的石板棺便高達2,000 多具，此外，更有陶\n    器、石器、玉器等文物數以萬計，其中的人獸形玉器不但\n    數量頗多，且在東南亞地區亦能見到這些精美的玉器。\n\
    \   上述兩項研究的內容分別為下列何者？"
  options:
  - label: A
    content: 舊石器時代；新石器時代
  - label: B
    content: 舊石器時代；金屬器時代
  - label: C
    content: 金屬器時代；新石器時代
  - label: D
    content: 新石器時代；金屬器時代
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 歷史
      code: 1-1
      title: 考古發掘與史前文化
      chapter: 第1章 史前臺灣與原住民文化
    textbook: 七上歷史 1-1 考古發掘與史前文化
    labeled_by: ai
- id: doc_113_新北_忠孝_社會_歷史_g7s1e1_s1_29
  section: 1
  number: 29
  type: single
  page: 1
  stem: "天琴參加臺東史前文化之旅，聽到解說員提到：「根據學者\n   推測，這些人已有群居生活，主要的生活工具為敲打方式\n   製作的石器，並且會生火煮熟食物。」據此推斷，\n\
    \   這應是哪一時代的先民生活？"
  options:
  - label: A
    content: 舊石器時代
  - label: B
    content: 新石器時代早期
  - label: C
    content: 新石器時代晚期
  - label: D
    content: 金屬器時代晚期
