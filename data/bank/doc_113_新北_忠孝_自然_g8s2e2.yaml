  stem: 下列哪些措施，何者無法使 $\text{N}_{2}\text{O}_{4(g)}+\text{熱量} \rightleftharpoons 2\text{NO}_{2(g)}$
    建立新平衡時，[$\text{NO}_{2}$]比原平衡時大？
  options:
