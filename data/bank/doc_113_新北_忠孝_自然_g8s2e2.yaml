- id: doc_113_新北_忠孝_自然_g8s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: "下列為配製漂白劑而發生意外的一則新聞報導：\n\n游泳池發生漂白劑「氣爆」意外\n蕭惠文／金門報導\n  余姓救生員在進行消毒工作時，將水加入含次氯酸鈣的漂白劑桶子內混合並蓋上蓋子，不久整個桶子因高溫使氣體體積膨脹而爆裂開來，造成多人受傷。\n\
    \  化學系教授指出，次氯酸鈣溶於水會產生高溫，混合步驟應如同稀釋濃硫酸的過程，如此就可降低危險性。\n\n依內容判斷，將次氯酸鈣與水混合，下列何者是最適合與安全的方式？"
  options:
  - label: A
    content: 因為是放熱反應，所以應將次氯酸鈣緩緩加入大量水中
  - label: B
    content: 因為是放熱反應，所以應將大量水緩緩加入次氯酸鈣中
  - label: C
    content: 因為是吸熱反應，所以應將大量水緩緩加入次氯酸鈣中
  - label: D
    content: 因為是吸熱反應，所以應將次氯酸鈣緩緩加入大量水中。
