- id: doc_113_新北_忠孝_自然_g8s2e2_s1_39
  section: 1
  number: 39
  type: single
  page: 4
  stem: 各平衡反應受擾動因素影響後，有關平衡移動方向，何者正確？
  options:
  - label: A
    content: $\text{N}_{2}\text{O}_{4} \rightleftharpoons 2\text{NO}_{2}$，在相同的容器加入
      $\text{NO}_{2(g)}$，平衡向右
  - label: B
    content: $\text{Br}_{2}$（紅棕色）$+\text{H}_{2}\text{O} \rightleftharpoons \text{H}^{+}+\text{Br}^{-}$（無色）$+\text{HBrO}$，加入鹼，平衡向右
  - label: C
    content: $\text{Cl}_{2}+\text{H}_{2}\text{O} \rightleftharpoons \text{H}^{+}+\text{Cl}^{-}+\text{HClO}$，加入酸，平衡向右
  - label: D
    content: $\text{C}+\text{CO}_{2} \rightleftharpoons 2\text{CO}$，加入 CO，平衡不移動。
