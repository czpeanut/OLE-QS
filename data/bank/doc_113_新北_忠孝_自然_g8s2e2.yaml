- id: doc_113_新北_忠孝_自然_g8s2e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: "鎂離子為海水中含量第二多的金屬離子，從海水中提取鎂離子為工業上製造鎂的方法之一。其步驟如下：\n步驟一：在濃縮的海水中加入氫氧化鈉，會產生氫氧化鎂而沉澱析出。\n\
    \    $\\text{Mg}^{2+}+2\\text{NaOH} \\rightarrow 2\\text{Na}^{+}+\\text{Mg(OH)}_{2}$\n\
    步驟二：之後再加入鹽酸，經處理後可得到固態的氯化鎂。\n    $\\text{Mg(OH)}_{2}+2\\text{HCl} \\rightarrow\
    \ \\text{MgCl}_{2}+2\\text{H}_{2}\\text{O}$\n步驟三：電解熔融狀態的氯化鎂即可得到鎂。\n    $\\text{MgCl}_{2}\
    \ \\xrightarrow{\\text{電解}} \\text{Mg}+\\text{Cl}_{2}$\n依據上述方法，在某次製鎂的反應後，共產生鎂\
    \ 480 公克，則該次製鎂反應中，理論上會消耗重量百分率濃度為 80％的鹽酸共多少公克？（鎂的原子量為 24，氯化氫的分子量為 36.5）"
  options:
  - label: A
    content: '1825'
  - label: B
    content: '2400'
  - label: C
    content: '2920'
  - label: D
    content: 3650。
  tags:
