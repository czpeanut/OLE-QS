  page: 4
  stem: 關於含有沉澱的飽和食鹽水，下列敘述何者正確？
  options:
  - label: A
    content: 加熱飽和食鹽水時，溶解速率大於沉澱速率
  - label: B
    content: 飽和食鹽水的沉澱速率大於溶解速率
  - label: C
    content: 加入催化劑，可使飽和食鹽水再溶解
  - label: D
    content: 飽和食鹽水中的食鹽分子不能再溶於水中。
