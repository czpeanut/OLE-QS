- id: doc_111_桃園_中興_自然_g7s2e2_s1_47
  section: 1
  number: 47
  type: single
  page: 4
  stem: 根據文章推論，男性血友病患者致病的等位基因一定來自下列何者？
  options:
  - label: A
    content: 父親的 X 染色體
  - label: B
    content: 父親的 Y 染色體
  - label: C
    content: 母親的 X 染色體
  - label: D
    content: 母親的 Y 染色體。
  group_stem: '《遺傳的宿命─血友病 》

    血友病是一種遺傳性的血液疾病，健康人的體內有一種幫助血液凝固的凝血蛋白，該蛋白質可以在受傷後幫助血液凝固。而血友病患幾乎沒有凝血蛋白，其原因是單基因突變所造成。與血友病有關的基因位於性染色體中的
    X 染色體上。因為男性只有一條 X 染色體，所以只要該等位基因不正常，就會患病。而女性因為有兩條X 染色體，加上血友病為隱性等位基因，故要兩條染色體都帶有突變等位基因才能引起疾病（表
    1）。因為兒子的 X 染色體必從母親獲得，故患有血友病的父親不會透過遺傳，將疾病傳遞給兒子。而如果母親的兩條 X 染色體中只有一條帶有致病的等位基因，則稱為帶因者，本身雖然不生病，但卻可將此突變等位基因傳遞給孩子。

    例如英國的維多利亞女王，因為自然突變而成為血友病的帶因者。她將此致病因子傳遞給了其中3 位孩子：兒子利奧波德在成年後，因意外受傷後血流不止而去世；女兒愛麗絲和彼阿特麗斯則如同母親成為血友病的帶因者，繼續將致病的
    X 染色體分別傳進了西班牙和俄羅斯沙皇的歐洲皇室中，也因為如此，血友病在歐洲皇家中廣為流傳，故也被稱為「皇家疾病」。


    表 1 血友病的遺傳（$X^{h}$ 表示帶有血友病隱性等位基因的X 染色體）

    | 性別 | 性染色體 | 健康狀況 |

    | --- | --- | --- |

    | 男 | XY | 健康 |

    | 男 | $X^{h}Y$ | 血友病患者 |

    | 女 | XX | 健康 |

    | 女 | $X^{h}X$ | 血友病帶因者 |

    | 女 | $X^{h}X^{h}$ | 血友病患者 |'
