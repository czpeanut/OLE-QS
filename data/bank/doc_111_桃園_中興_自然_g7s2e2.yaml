- id: doc_111_桃園_中興_自然_g7s2e2_s1_49
  section: 1
  number: 49
  type: single
  page: 4
  stem: 下列關於錢鼠的敘述，何者錯誤？
  options:
  - label: A
    content: 錢鼠的叫聲像錢落地的聲音
  - label: B
    content: 錢鼠刀片狀的門齒不會徒長
  - label: C
    content: 具有麝香腺而又名臭鼩
  - label: D
    content: 錢鼠屬於較古老的物種。
  group_stem: '《似鼠非鼠叫錢鼠》

    錢鼠(Suncus murinus)因身體具有麝香腺，會散發出濃郁特殊的體味，故又名臭鼩，在分類上屬於哺乳綱鼩形目尖鼠科（Soricidae），普遍分布於中國及臺灣。錢鼠的視力很差，受干擾時會發出尖而短促的叫聲，類似銅錢落地的聲音，，故稱其為錢鼠。錢鼠雖然外觀近似一般囓齒動物的鼠類，但一般囓齒目動物有長不停的門齒且齒形呈刀片狀，前腳僅
    4 趾，後腳有 5 趾；而錢鼠的門齒呈尖錐狀且不會徒長，前後腳趾均有 5 趾。另外，錢鼠屬於較古老的物種，因此具較淺的眼窩和扁平的頭骨，也沒有一般哺乳類普遍具有的顴骨弓；而老鼠的眼窩則較深且有顴骨弓，眼睛和耳朵也都比錢鼠大得多，也因此錢鼠雖名為鼠，但實際上非屬一般鼠輩。'
