      想知道，為何某些人似乎一帆風順，有些人卻跌跌撞\n撞？經過一番研究之後，他發現，幸運兒的生活並沒\n有特殊之處，但他們比一般人懂得善用巧合。 \n  什麼是善用巧合？就是當你在路上碰到許久不見\n\
      的老朋友時，會停下來請他喝杯咖啡。就是當你剛好\n看到有適合的案子時，會向老闆毛遂自荐。就是當你\n原本要買的東西賣完了，也願意試試別的牌子。 \n \
      \ 除了積極應變之外，幸運兒的另一個特質就是正\n面態度。迷路了，他們剛好乘機探險。犯錯了，他們\n剛好藉機學習。 \n  保羅就是這樣，他最常掛在嘴上的字眼，就是\n\
      「剛好」。他覺得人生充滿了機會，也從實際經驗得到\n驗證。事實上，那些「剛好」的機會常常是他自己製\n造的，就像他當晚剛好在我公司附近，但重點是他拿\n\
