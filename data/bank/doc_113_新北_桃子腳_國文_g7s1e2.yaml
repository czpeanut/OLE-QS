  stem: 「世事從來不如我們想像中的那般篤定，但也不會是表面看來的那般絕望。」（大衛．馮．德雷爾 一切都會好轉的）這段文字的意思與下列何者最接近？
  options:
  - label: A
    content: 山重水複疑無路，柳暗花明又一村
  - label: B
    content: 路是人走出來的，人定勝天非浪語
  - label: C
    content: 羌笛何需怨楊柳，春風不度玉門關
  - label: D
    content: 天長地久有時盡，此恨綿綿無絕期。
