  stem: 那斯魯丁選擇較小的銅板，原因為何？
  options:
  - label: A
    content: 用來取笑別人
  - label: B
    content: 證明自己很傻
  - label: C
    content: 讓別人一再測試
  - label: D
    content: 他不好意思拿大銅板。
  group_stem: "丙、\n  那斯魯丁是市場上人人眼中的傻瓜。無論何時，只要有人拿兩個一大一小的銅板要奉獻給他時，他總是選擇那個較小的銅板。一位好心人士看了不忍，對他說：「那斯魯丁啊！你應該要拿較大的銅板，這樣你會得到較多的錢，而人家就不會再笑你是個傻瓜了。」\n\
    \  「你這麼說的確有道理。」那斯魯丁回答，「但是如果我選擇拿較大的銅板，人家就不會因為想證明我是傻瓜而再給我錢了，那我就連一塊錢也得不到了。」\n（節錄自王溢嘉\
    \ 智慧的花園）"
