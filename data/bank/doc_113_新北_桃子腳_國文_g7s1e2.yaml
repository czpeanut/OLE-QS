      \ \n \n            \n第1頁 \n評量範圍：康軒版第一冊第四課至語文天地二、自學二，成語典P51~P80，文史典L7~12   \
      \ 出題者：陳貴琬老師、傅季如老師、王若伊老師 \n                                                \
      \                                       班級：      座號：       姓名：      \n一、 單題70%，1~10\
      \ 每題3 分，11~30 每題2 分 \n(     )1. 「她們的名字不會被人知道，可是在我的心目\n中，她們是有資格被稱之為『人物』的一群。」\n\
      作者說「她們是有資格被稱之為『人物』」的原\n因是什麼？ \n  (A)平凡中見偉大 \n  (B)為善不欲人知 \n  (C)百聞不如一見 \n  (D)可望而不可即。\
      \ \n(     )2. 「聞道有先後，術業有專攻。」請問這句話的含\n義與下列何者最相近？ \n(A) 己所不欲，勿施於人 \n(B) 不患無位，患所以立\
      \ \n(C) 三人行，必有我師焉 \n   (D)君子病無能焉，不病人之不己知也。 \n(     )3. 「學而時習之，不亦說乎？有朋自遠方來，不亦\n\
      樂乎？人不知而不慍，不亦君子乎？」文中「不\n亦說乎？……不亦樂乎？……不亦君子乎？」這\n樣的語氣，流露出何種意味？ \n(A) 迫人遵循的約束力 \n\
      (B) 明辨是非的判斷力 \n(C) 敏銳深刻的觀察力 \n(D)循循善誘的親和力。 \n(     )4. 下列選項「 」中的數字，何者皆為「實數」？\
      \ \n(A) 「三」分天下／垂涎「三」尺 \n(B) 「兩」姓聯姻／「兩」袖清風 \n(C) 「七」步成詩／「七」嘴八舌 \n(D) 「八」拜之交／「八」面玲瓏。\
      \ \n(     )5. 那默默的一群一文中，從「她們總是披著一身淡\n淡的夜色便開始工作」研判，清道婦工作的時間\n最接近下列何者？ \n(A) 火紅的太陽也滾著火輪子回家了\
      \ \n(B) 小弟弟和小妹妹也闔上眼睛走向夢鄉了 \n(C)船在黑暗的包圍中向前滑行，逐漸地，遠的東方從 \n   海底衝出一股白光 \n(D)當西方最後的一抹彩霞被暮靄吞蝕時，也就是我離\n\
      開溪側歸返的時刻。 \n(     )6. 下列「 」中的形似字，何組讀音相同？ \n    (A)民窮財「匱」／功虧一「簣」 \n(B)敬「陪」末座／高溫烘「焙」\
      \ \n(C)絡「繹」不絕／毀鐘為「鐸」 \n(D)「溫」故知新／文化底「蘊」。 \n(     )7. 下列關於論語中的成語何者使用正確？ \n(A)\
      \ 小偉的個性驕傲自大，對於自己不懂的事總是「不\n恥下問」 \n(B)不要嫉妒優秀的人，應該「見賢思齊」，將他當作 \n 自己的榜樣 \n(C)阿玲表面左右逢源，卻常常在背地裡說朋友的壞\
      \ \n       話，真是「後生可畏」 \n(D)這個提案的執行難度太高，才剛提出就遭到公司\n全體同仁「舉一反三」的反對。 \n(     )8.\
      \ 下列文句「 」中的詞語經替換後，何者意思不\n變？ \n(A) 後來他在一個錢鋪裡做「夥計」／掌櫃 \n(B) 他對於氣味和口味都不很「講究」／追究\
      \ \n(C) 不上一點鐘，差不多先生就「一命嗚呼」了／撒手\n人寰 \n(D) 差不多先生死後，大家為他取了一個死後的「法\n號」／寶號。 \n( \
      \    )9. 差不多先生認為「活人同死人也差不多。」如\n果把這句話當作深具哲理、帶有批判性的語句\n看待，下列何種人與句中的描述相符？ \n(A)\
      \ 屢敗屢戰的人 \n(B) 行屍走肉的人 \n(C) 行將就木的人 \n(D) 巧言令色的人。 \n(     )10. 下列生活中常用的語句，何者沒有語病？\
      \ \n(A)在假期遠離塵囂置身於大自然中，何嘗不是一種幸 \n福 \n(B)經過老師講解後，許多百思不得其解的答案就迎刃 \n而解了 \n(C)一向懦弱的他竟挺身而出、仗義執言，真是出乎大\
      \ \n家意料之外 \n(D)為了讓大家無時無刻享受購物的方便，便利商店二 \n十四小時營業 \n(     )11. 學堂的老師教訓學生不該老是苟且隨便，應該\n\
      認真處事。下列哪一句俗諺最適合用來勸戒學\n生？ \n    (A)丁是丁，卯是卯 \n    (B)宰相肚裡能撐船 \n    (C)司馬昭之心，路人皆知\
      \ \n    (D)吃得苦中苦，方為人上人。 \n(     )12. 「冬季旅遊補助帶動觀光發展，住宿業徵才需\n求暴增」從這則新聞標題，可以得知下列哪一\n\
      項訊息？ \n(A) 因為冬季旅遊補助，旅遊人數暴增 \n(B) 因為冬季旅遊補助，住宿業業績暴增 \n(C) 由於冬季旅遊補助的關係，所以外宿人數暴增\
      \ \n(D)由於冬季旅遊補助的影響，住宿業人力需求暴增。 \n(     )13. 阿貴利用搜尋引擎查詢資料，先後分別輸入兩\n組關鍵詞語，「至聖先師、杏壇」與「白話文運\n\
      動、文學革命」，他想搜尋的人物依序為何？ \n(A)孟子、胡適 \n(B)孔子、胡適 \n(C)孟子、張騰蛟 \n(D)孔子、張騰蛟。 \n113 學年度第一學期【七】年級國文科第【二】次段考試題\
      \ \n \n            \n第2頁 \n(     )14. 「常為小事煩惱，人生苦多樂少。事實上，那\n些過得快活而安然的人會隨時倒出那些煩人的\n\
      『小沙粒』，他們心胸寬廣、心境超脫，不為雞\n毛蒜皮之事斤斤計較，如此也就得到心理上的\n平靜，境隨心轉的安然。」(伊北)由關鍵訊息\n「不為雞毛蒜皮之事斤斤計較」，可知文中的\n\
      「小沙粒」指的是什麼？ \n(A) 身邊的小人 \n(B) 狹隘的觀念 \n(C) 不當的朋友 \n(D)煩心的事情。 \n(     )15. 「英雄並不比常人勇敢，他只是比常人多勇敢\n\
      五分鐘而已！」這句話可以用來鼓勵下列哪一\n種人？ \n(A)虎頭蛇尾 \n(B)避重就輕 \n(C)師心自用 \n(D)閉門造車。 \n(     )16.\
      \ 商禽的五官素描把人臉上的五官拆解，重新詮\n釋出新面向，下面是其中之一，應該是寫五官\n的哪一部份？ \n \n如果沒有雙手來幫忙 \n這實在是一種無可奈何的存在\
      \ \n \n然則請說吧 \n咒罵或者讚揚 \n若是有人放屁 \n臭 \n是鼻子的事 \n（商禽 五官素描） \n    (A)鼻 \n(B)嘴 \n\
      (C)眼 \n(D)耳。 \n(     )17. 根據下文，下列選項哪個最不符合美拉德穿\n搭？ \n(A) 琬琬穿偏深的咖啡色牛仔褲，上身配奶白色合身版\n\
      型毛呢外套 \n(B) 如如穿淡紫色斜領設計的長袖上衣，再加上黑色皮\n褲與蝴蝶垂墜腰帶 \n(C) 珊珊身穿深棕色皮質大衣，裡頭搭配偏淺黃的棕色\n\
      針織套裝，戴亮橘色耳環 \n(D) 伊伊穿淺棕色的麂皮長裙，搭配亮眼的橘棕色皮\n靴，最後換上紅色棒球外套。 \n(     )18. 子曰：「吾十有五而志於學，三十而立，四十而\n\
      不惑，五十而知天命，六十而耳順，七十而從\n心所欲，不逾矩。」（論語 為政篇）對於孔子\n心境的解說何者正確？ \n(A) 在孔子十五歲的時候學習立志這件事\
      \ \n(B) 在四十歲的時候因為已成家立業，所以不會花心被\n迷惑 \n(C) 在六十歲的時候耳力還非常好，像順風耳一樣能聽\n到很遠的聲音 \n(D)在七十歲的時候，因為禮教規範都刻在骨子裡，所\
      \ \n 以可以隨心所欲做事，但都不會超越規矩。 \n(     )19. 根據下文，可對應到哪句論語？ \n(A) 人不知而不慍，不亦君子乎 \n(B)\
      \ 君子和而不同，小人同而不和 \n(C) 鄉人之善者好之，其不善者惡之 \n(D) 擇其善者而從之，其不善者而改之。 \n(     )20. 根據下文的解說何者錯誤？\
      \ \n(A) 曾子說每天要用三件事來提醒自己 \n(B) 和別人一起謀利，對方是否會對我不忠 \n(C) 和朋友一起交往，我自己有沒有誠信待人 \n\
      (D) 每天老師教給我的知識，我有沒有好好溫習。 \n(     )21. 根據下文，若要勸誡猴子，宜用哪一句話？ \n(A) 人必自重，而後人重之 \n\
      (B) 認真的人改變自己，執著的人改變命運 \n所有好人都喜歡他，壞人都討厭，他一定是好人 \n，但不是所有的好人都是這樣。因為有可能這個好人\n與世無爭，所以不會被壞人討厭。這只是試驗好人的\n\
      方法，特別是在做公眾事時，一個人如果對於壞人做\n的壞事，視而不見，那就稱不上好人；勇於揭發壞人\n做的壞事的人，才有資格稱作好人。 \n反之，所有壞人都喜歡他，好人都討厭，他一定\n\
      是壞人，壞人有可能變好，但小人很難，最好遠離。\n多跟好人在一起，別跟壞人在一起，你會被影響，壞\n人有心向善，自然會靠過來。 \n（改寫自網路文章）\
      \ \n曾子曰：「吾日三省吾身：為人謀而不忠乎？與朋\n友交而不信乎？傳不習乎？」 \n（論語 學而篇） \n美拉德反應（Maillard reaction）又稱為「梅納\n\
      反應」，是法國化學家偶然發現的現象。最為人所熟知\n的例子就是煎牛排，紅色的蛋白質在煎烤過程中逐漸\n轉為焦糖色或褐色。 \n在2023 年秋冬時裝週上，許多知名品牌都大量運\n\
      用卡其、駝色以及深淺不一的褐色或焦糖色打造系列\n產品，除了同色系的疊加之外，還在大面積的咖啡色\n系中加入亮綠、淺黃、紅、橘色等亮色系在其中，為\n\
      美拉德風格定調。 \n（改寫自「Marie Claire 美麗佳人時尚生活網」網站\n2023.11.10） \n一猴死，見冥王，求轉人身。 \n王曰：「既欲做人，須將毛盡拔去。」即喚夜叉拔\n\
      之。 \n方拔一根，猴不勝痛叫。 \n王笑曰：「看你一毛不拔，如何做人？」 \n（邯鄲淳 笑林） \n113 學年度第一學期【七】年級國文科第【二】次段考試題\
      \ \n \n            \n第3頁 \n(C) 大舍大得，小舍小得，有舍有得，不舍不得 \n(D) 只有先改變自己的態度，才能改變人生的高度。\
      \ \n(     )22. 右側是某書\n店開幕的廣\n告文案。根\n據內容，下\n列敘述何者\n正確？ \n(A)本書店在中秋前\n開幕 \n(B)說明終身學習的\n\
      重要 \n(C)點出書店開幕日晚上營業 \n(D)書店位在高樓看月亮視野良好。 \n(     )23. 下列文句，何者沒有使用倒反法？  \n(A)\
      \ 二哥最大方了，連這點小錢都要算得一清二楚 \n(B) 你今天的表現真是無可挑剔，幾乎達到了完美的地\n步 \n(C) 我真是佩服你的辦事能力，居然能在這麼簡單的任\n\
      務上拖延這麼久 \n(D) 你今天穿得真是太時尚了，簡直像是從二十年前的\n時尚雜誌走出來的。 \n(     )24. 人生在世，無常難測，面對死亡，人們有時會\n\
      難以直接說出口，而是用不同的語詞來代稱。\n如天子去世叫「崩」，下列哪一個與死相關的用\n語使用最恰當？  \n(A) 他小小年紀就「慈父見背」，真令人心疼\
      \ \n(B) 顏回年紀輕輕就因營養不良而「香消玉殞」 \n(C) 那位大師「蒙主寵召」時，燒出很多舍利子，目前\n供奉在佛塔中 \n(D) 方過而立之年的他就已經「壽終正寢」，留下年邁\n\
      雙親無人照料。 \n(     )25. 「世事從來不如我們想像中的那般篤定，但也\n不會是表面看來的那般絕望。」（大衛．馮．德\n雷爾 一切都會好轉的）這段文字的意思與下列\n\
      何者最接近？ \n(A)山重水複疑無路，柳暗花明又一村 \n(B)路是人走出來的，人定勝天非浪語 \n(C)羌笛何需怨楊柳，春風不度玉門關 \n(D)天長地久有時盡，此恨綿綿無絕期。\
      \ \n(     )26. 下列文句，何者含有「反詰」的語氣？ \n    (A)夜來風雨聲，花落知多少 \n(B)吹皺一池春水，干卿何事 \n(C)有一言而可以終身行之者乎\
      \ \n(D) 人生到處知何似，應是飛鴻踏雪泥。 \n(     )27. 下列成語何者意思完全相反？ \n(A)方興未艾／風起雲湧 \n(B)怨天尤人／苛求於人\
      \ \n(C)六根清淨／五體投地 \n(D)引以為戒／重蹈覆轍。 \n \n(     )28. 下列哪一組成語，用字完全正確？ \n(A)以身作則／以管窺天\
      \ \n(B)水道渠成／水屑不通 \n(C)不厭其繁／不徑而走 \n(D)出奇不意／出奇致勝。 \n(     )29. 「以巴衝突近一年後，這項停火協議，對飽經\n\
      戰火的的兩國人民來說，無疑為一大\n。」缺空處依序應填入什麼？ \n(A)摧殘、折磨 \n(B)反撲、保證 \n(C)衝擊、濫觴 \n(D)洗禮、福音。\
      \ \n(     )30. 下列「 」中的詞語，何者運用正確？  \n(A) 大家依依不捨的為遠嫁美國的堂姊「折桂」送行 \n(B) 這位「高足」經常幫我解決問題，真是個得力助手\
      \ \n(C) 許多人為了追求「孔方兄」，忽視了生活中的其他\n美好 \n(D) 我對這部電影的情節了解得非常透徹，根本「不識\n盧山真面目」。 \n\
      二、 單題30%，31~45 每題2 分 \n甲、 \n善用每一次「剛好」 \n  老友保羅在臉書上敲我：「好幾年沒回臺灣了，我\n這次只待兩個禮拜，有空咱們聚聚吧！」\
      \ \n  「怎麼這麼不巧？」我心想。最近剛接了幾個大\n案子，搞得焦頭爛額，沒時間也沒心情給保羅回電。\n雖然一開始答應得很爽快，但一個多禮拜過去了，因\n\
      為久久無法赴約，心情也從期待轉為壓力。 \n  某晚，我還在錄音室跟電腦和 MIDI 鍵盤抗戰時，\n手機響起嗶嗶聲，是保羅的簡訊：「吃飯沒？」 \n\
      \  看看手錶，七點多，這時才發覺肚子已經在咕咕\n叫。 \n  「剛好我就在你工作室附近，給我幾分鐘碰個面\n好嗎？我馬上就到！」他寫道。 \n  想想，再不約，保羅就要回美國了。雖然還陷在\n\
      工作狀態中，我還是勉強答應。 \n  走到路口，看到保羅剛下計程車，穿著潮ㄒ搭配\n休閒西裝外套，容光煥發。我呢，踩著拖鞋，鬍子沒\n刮，實在狼狽至極。他給我一個大大的擁抱，說：「這\n\
      不就是我們當年一起喝啤酒的老地方嗎？實在太巧\n了！」 \n  「是啊！附近開了間不錯的小餐廳，可以去坐\n坐。」我說。 \n  原本我只容許自己給保羅一個小時，但幾年不\n\
