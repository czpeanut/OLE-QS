  stem: '根據下文，可對應到哪句論語？


    所有好人都喜歡他，壞人都討厭，他一定是好人，但不是所有的好人都是這樣。因為有可能這個好人與世無爭，所以不會被壞人討厭。這只是試驗好人的方法，特別是在做公眾事時，一個人如果對於壞人做的壞事，視而不見，那就稱不上好人；勇於揭發壞人做的壞事的人，才有資格稱作好人。

    反之，所有壞人都喜歡他，好人都討厭，他一定是壞人，壞人有可能變好，但小人很難，最好遠離。多跟好人在一起，別跟壞人在一起，你會被影響，壞人有心向善，自然會靠過來。

    （改寫自網路文章）'
  options:
  - label: A
    content: 人不知而不慍，不亦君子乎
  - label: B
    content: 君子和而不同，小人同而不和
  - label: C
    content: 鄉人之善者好之，其不善者惡之
  - label: D
    content: 擇其善者而從之，其不善者而改之。
