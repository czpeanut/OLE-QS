  - label: C
    content: 教學相長
  - label: D
    content: 有教無類。
  group_stem: "乙、\n豪邁好勇的孔門弟子——子路\n  孔子首開私人講學之風，弟子來自四面八方，多達三千餘人，老少、貴賤、賢愚皆有，其中較知名的有七十餘人，如：出身貴族的孟懿子、家世卑微的仲弓、經商致富的子貢、安貧樂道的顏淵、反應遲鈍的樊遲、豪邁魯莽的子路與懶惰善辯的宰我等。\n\
    \  在孔門弟子中，子路個性鮮明，令人印象深刻。他來自魯國，小孔子九歲，是弟子中年紀較長的。年輕時的子路常以勇士自居，曾頭插雄雞羽、佩戴野豬牙，這樣的裝扮在當時顯得非常另類。\n\
    \  子路初見孔子時，孔子問：「你有什麼喜好？」子路說：「喜好長劍。」孔子說：「以你的才能，再加上學習能力，沒有人可以比得上你。」子路說：「南山有一種箭竹，生來堅硬挺直，砍下做箭就能射穿犀牛皮，哪裡需要學習呢？」孔子說：「若在箭尾裝上羽毛，箭頭再加以磨利，不是能射得更深嗎？」子路拜謝說：「我恭敬接受您的教導。」子路成為孔門弟子後，積極向學，每每聽到老師的教誨便立即奉行，因為擔心又聽到新的道理，怕來不及再去學習。\n\
    \  出身貧賤的子路，慷慨熱情，曾說：「願將我的車、馬、衣、裘和朋友共享，即使被用壞了也不感到遺憾。」此外，對別人的富貴奢華他也毫不羨慕，即使身穿破舊衣服，與那些穿著皮袍的人相處時也不感到自卑，孔子對此頗為讚賞。子路一聽到老師讚美，就得意地到處宣揚。孔子怕他自滿，所以藉機開導他：「這只是做人的基本道理，不應以此自滿。」\n\
    \  有一回，孔子極力讚美顏淵的才能，子路心有不服，就問：「老師如果有機會統率三軍出征，會找誰與您同行呢？」孔子說：「那些空手打老虎，徒步渡過大河，到死都不知悔悟的人，我是不會和他一起去的。我要找的是面對事情時，能戒慎恐懼、善用謀略的人。」\n\
    \  子路頗具軍事與行政才能，但生性魯莽。孔子深知每位學生的特質，曾說：「像子路這樣的個性，恐怕將來會遭遇不測！」沒想到竟一語成讖，不幸言中。子路擔任衛國的家臣時，聽聞政變，連忙趕去與對方戰鬥，卻遭殺害，被剁成肉醬，卒年六十三。孔子得知消息時，痛哭長嘆，難過得從此不再吃肉醬，深厚的師生之情，由此可見。"
