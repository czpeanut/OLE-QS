  stem: 「視其行步，竊鈇也；顏色，竊鈇也；言語，竊鈇也。動作態度，無為而不竊鈇也。」上文的描述，主要在顯現「亡鈇者」的哪一種心態？
  options:
  - label: A
    content: 見微知著
  - label: B
    content: 耳熟能詳
  - label: C
    content: 疑神疑鬼
  - label: D
    content: 目光如炬。
  group_stem: "己、\n  人有亡鈇①者，意②其③鄰之子。視其行步，竊④鈇也；顏色⑤，竊鈇也；言語，竊鈇也；動作態度，無為而不竊鈇也。\n  相⑥其谷而得其鈇。他日復見其鄰之子，動作態度，無似竊鈇者。\n\
    \  其鄰之子非變也，己則變矣。變也者無他，有所尤⑦也。\n（呂氏春秋 亡鈇意鄰）\n註：\n①鈇：斧頭。\n②意：同「臆」，懷疑、猜想。\n③其：指代鄰人之子。\n\
    ④竊：偷盜。\n⑤顏色：臉色表情。\n⑥相：察看。\n⑦尤：過失、見解有偏差。"
