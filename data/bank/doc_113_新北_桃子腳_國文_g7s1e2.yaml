  stem: 小甜甜在報紙副刊看見上述的心理測驗，但測驗主題(甲)的部分被咖啡汙損了，請你依照情境判斷(甲)是什麼？
  options:
  - label: A
    content: 推論力
  - label: B
    content: 創造力
  - label: C
    content: 溝通力
  - label: D
    content: 正向力。
  group_stem: "丁、\n【週末生活版心理測驗】\n◎測驗主題：(甲)\n◎測驗開始：某個愜意的假日午後，你看到一隻狗在路上跑，此時你心中的第一個念頭是？\n\
    \ (ㄅ)我有看錯嗎？\n (ㄆ)狗怎麼可以在路上跑？\n (ㄇ)是誰的狗跑出來了？\n (ㄈ)好可愛的小狗喔！\n\n◎解讀真心話：\n (ㄅ)我有看錯嗎？\n\
    \ (甲)指數：20％\n 「消極面對挫折，率先否定自我」。遇到問題的時候，你常常會產生負面的情緒，較無辦法直視問題、解決問題。建議你先正視情緒、處理情緒，再處理要解決的事情，會較有效率。\n\
    \ (ㄆ)狗怎麼可以在路上跑？\n (甲)指數：40％\n 「固執不知變通，需要調整心態」。你喜歡追根究底，卻常鑽牛角尖、陷入胡同走不出，並且過於在意他人看法。建議你不要太在意他人看法，也不要老往壞的方向去想。如果真的覺得太低潮，記得找朋友聊聊天，或看看書轉換思考角度。\n\
    \ (ㄇ)是誰的狗跑出來了？\n (甲)指數：70％\n 「雨過天青，著眼機會，重新出發」。你算是冷靜型的人，面對問題，並不太在意結果，反而較注重事後處理的態度，不陷入懊惱情緒，趕緊處理問題、解決問題。\n\
    \ (ㄈ)好可愛的小狗喔！\n (甲)指數：90％\n 「擁有轉念的能力，自體閃閃發光」。你是個超級陽光的人，遇到挫折能自我轉念、積極思考，能在最短時間內消化負面的情緒，然後勇往直前，挑戰自我。"
