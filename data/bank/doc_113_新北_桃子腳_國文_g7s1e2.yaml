  number: 24
  type: single
  page: 3
  stem: 人生在世，無常難測，面對死亡，人們有時會難以直接說出口，而是用不同的語詞來代稱。如天子去世叫「崩」，下列哪一個與死相關的用語使用最恰當？
  options:
  - label: A
    content: 他小小年紀就「慈父見背」，真令人心疼
  - label: B
    content: 顏回年紀輕輕就因營養不良而「香消玉殞」
  - label: C
    content: 那位大師「蒙主寵召」時，燒出很多舍利子，目前供奉在佛塔中
  - label: D
    content: 方過而立之年的他就已經「壽終正寢」，留下年邁雙親無人照料。
- id: doc_113_新北_桃子腳_國文_g7s1e2_s1_25
