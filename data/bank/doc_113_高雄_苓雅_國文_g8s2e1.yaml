  stem: '「玄德回視其人：身長八尺，豹頭環眼，燕頷虎鬚，聲若巨雷，勢如奔馬。玄德見他形貌異常，問其姓名。其人曰：『某姓張，名飛，字翼德。世居涿郡，頗有莊田，賣酒屠豬，專好結交天下豪傑。適才見公看榜而嘆，故此相問。』玄德曰：『我本漢室宗親，姓劉，名備。今聞黃巾倡亂，有志欲破賊安民；恨力不能，故長嘆耳。』飛曰：『吾頗有資財，當招募鄉勇，與公同舉大事，如何？』玄德甚喜，遂與同入村店中飲酒。」

    根據文意，下列何者說明最符合張飛的性格？'
  options:
  - label: A
    content: 為人沉穩謹慎，善於運籌帷幄
  - label: B
    content: 豪爽仗義，喜結交天下英雄豪傑
  - label: C
    content: 行事衝動，遇事猶豫不決，缺乏果斷
  - label: D
    content: 生性貪婪，注重財富，不願助人。
- id: doc_113_高雄_苓雅_國文_g8s2e1_s2_36
  section: 2
  number: 36
  type: single
  page: 5
  stem: 根據文章內容，下列何者符合「假聰明」者的行為模式？
  options:
  - label: A
    content: 以幽默化解尷尬，讓自己看起來更親和
  - label: B
    content: 使用專業術語，使自己看起來更有智慧
  - label: C
    content: 在公眾場合保持沉默，表現高深莫測的神態
  - label: D
    content: 在專業領域提出獨特觀點，挑戰現有的觀念。
  group_stem: '有的人不大聰明，甚至根本沒有任何能力，但很會裝腔作勢，正如羅馬劇作家泰倫斯說：這些徒有其表的騙子只會找藉口、耍詭計，在有見識的人看來很可笑。那些人就像奸商一樣，把平凡無奇的東西，講成有價值又稀有的寶物。他們老是神秘兮兮，只願在昏暗的光線下把貨品給人看。又總是欲言又止，因為他們心知肚明，自己什麼都不懂，卻還要裝腔作勢，好像藏了什麼大祕密。

    有些人用表情和手勢來混淆視聽，靠著誇張的動作來裝聰明。有些人以為，賣弄一些專業名詞，擺出高傲姿態，就可以蒙混過關。就算只有一知半解，只要自認是專家，就可以騙過大眾。有時他們碰到自己不能理解的事情，還會裝出瞧不起的樣子，說那些都是無足輕重、無關緊要的小事，以為這樣可以冒充專家，並掩蓋自己的無知。有些人總是唱反調，愛計較一些無關緊要的細節，外人看來很可笑，因為那些人只是在逃避關鍵問題。他們不管討論什麼事情都要唱反調，這樣看起來才像專家。等到所有提議都被否決後，那任務也結束了。反而，如果有一案通過，就要展開接下來的工作。所以在處理公務時，假聰明的人最礙事。

    總而言之，那些腦袋空空的草包，會想出更多詭計來維持他的美名。社會上總是有這些招搖撞騙的人，千萬別任用他們。我們寧可聘請偏激的人來處理公事，也好過這些「金玉其外、敗絮其內」之徒。


    改寫自《遠見雜誌--是實力還是「假會」？虛有其表的人喜歡「這樣做」》'
