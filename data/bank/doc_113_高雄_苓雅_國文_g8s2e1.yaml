  stem: 下列關於白居易生平的敘述，哪一個選項正確？
  options:
  - label: A
    content: 自幼便能讀書寫詩，五歲已能創作詩歌
  - label: B
    content: 初生時還不會說話，便能默記之無二字
  - label: C
    content: 十五歲便能熟悉詩賦韻律，成為京師名士
  - label: D
    content: 二十七歲才開始學習詩賦，最終中進士。
  group_stem: '白居易，季庚之子，始生未能言，默識①之無二字，乳媼②試之，能百指而不誤。間日③復試之，亦然。既能言，讀書勤敏，與他兒異。五六歲識聲韻，十五志詩賦，二十七舉進士。貞元十六年，中書舍人高郢掌貢闈④，居易求試，一舉擢第⑤。明年，拔萃甲科⑥。由是習性相近遠⑦。《求玄珠》、《斬白蛇》等賦，為時楷式，新進士競相傳於京師矣。會⑧憲宗新即位，始用為翰林學士。

    選自《太平廣記》


