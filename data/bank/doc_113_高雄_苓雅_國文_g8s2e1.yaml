    content: 透過哲學思考，探討愛情的本質與意義
  - label: C
    content: 運用象徵手法，借助自然景物表現內心情感
  - label: D
    content: 同時呈現具體畫面與抽象感情，形成強烈對比。
  group_stem: '如何讓你遇見我

    在我最美麗的時刻 為這

    我已在佛前 求了五百年

    求他讓我們結一段塵緣


    佛於是把我化作一棵樹

    長在你必經的路旁

    陽光下慎重地開滿了花

    朵朵都是我前世的盼望


    當你走近 請你細聽

    那顫抖的葉是我等待的熱情

    而當你終於無視地走過

    在你身後落了一地的

    朋友啊 那不是花瓣

    是我凋零的心


    席慕蓉〈一棵開花的樹〉'
- id: doc_113_高雄_苓雅_國文_g8s2e1_s2_41
  section: 2
  number: 41
  type: single
  page: 6
  stem: 根據本文，Hostel 的公用空間對旅客有什麼重要性？
  options:
  - label: A
    content: 幫助旅客處理行程問題，確保旅遊安全
  - label: B
    content: 為旅客提供隱私保護，使住宿更為安靜
  - label: C
    content: 讓旅客休息與娛樂，減少旅行的疲勞感
  - label: D
    content: 提供旅客資訊交流的場域，認識新朋友。
  group_stem: '◎什麼是 Hostel？

    Hostel 就是「青年旅館」，是一種針對旅友和年輕人的旅館型態，它沒有入住的年齡限制，且價格平易、交通方便，因此在歐、美國家已經成為背包客旅行住宿的首選。

    一般來說，Hostel 都會設置在當地熱門景點或是城市中心，周邊商店、餐廳等服務設施較多，生活便利性高，對於自助行的旅客來說相當方便。和飯店、旅館不同的是，Hostel
    是許多旅客共享一個房間，通常是4~8人住一間房，床位以上下鋪組成。

    由於室友可能來自世界各國，分屬不同種族、不同膚色或不同語言，所以住宿者往往會跟一群不認識的陌生人共處在同一個環境裡面。房問裡一般會提供存放私人物品的空間，而洗手間及淋浴間多為全旅舍一起使用，旅舍可能不提供盥洗用具、電視或者電話等。換言之，相較於其他的住宿類型，Hostel
    的服務沒那麼完整，需要倚賴自助或是旅客之間互相幫忙。

    ◎Hostel 服務不周，為何還有那麼多人選擇住？

    Hostel 最迷人的地方，在於旅客之間的文化交流與經驗分享。

    大部分的Hostel 都會規畫公用空間，如咖啡廳或小酒吧。在臺北經營青年旅館多年的林逸書表示，在Hostel 裡，公用空間常會變成最佳的交誼場所，每位旅客可以在Hostel
    所設置的咖啡廳或小酒吧，坐下來點杯咖啡或啤酒，與其他不同文化、不同國度的旅客進行交流與分享，結交新的朋友，甚至能夠一起前往新的目的地。

    除此之外，Hostel 有時會舉行各種活動，活動內容可能是當地景點導覽、語言課程、音樂欣賞、烤肉會、電影欣賞等，增進入住者之問的交流。林逸書表示，結合 Hostel
    與 Cafe & Bar 的經營模式，主要目的不在於獲利多寡，而是旅客間的交流，透過彼此的經驗分享，讓這趟旅行多添一分色彩，這才是Hostel 真正的經營價值。'
