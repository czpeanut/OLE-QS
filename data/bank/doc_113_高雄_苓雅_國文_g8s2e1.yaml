  number: 12
  type: single
  page: 1
  stem: 「將軍百戰死，壯士十年歸。」上述詩句說明戰爭的慘烈，下列何者也描述了相同的狀況？
  options:
  - label: A
    content: 白草黃沙，胡天八月即飛霜
  - label: B
    content: 黃沙百戰穿金甲，不破樓蘭終不還
  - label: C
    content: 但使龍城飛將在，不教胡馬度陰山
  - label: D
    content: 醉臥沙場君莫笑，古來征戰幾人回。
  lesson_raw:
    title: 木蘭詩
    basis: 題目引用〈木蘭詩〉課文原句
