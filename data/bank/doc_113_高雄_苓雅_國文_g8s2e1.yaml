- id: doc_113_高雄_苓雅_國文_g8s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 關於〈木蘭詩〉的詩句分析，下列敘述何者正確？
  options:
  - label: A
    content: 軍書十二卷，卷卷有爺名：表達軍情緊急，急於徵兵
  - label: B
    content: 不聞機杼聲，惟聞女嘆息：戰事激烈，憂心自己無法生還
  - label: C
    content: 朝辭爺孃去，暮宿黃河邊：道出離鄉背井，欲建功立業回報父母
  - label: D
    content: 兩兔傍地走，安能辨我是雄雌：希望戰友不要揭穿她的真實身份。
  lesson_raw:
    title: 木蘭詩
    basis: 題目引用〈木蘭詩〉
- id: doc_113_高雄_苓雅_國文_g8s2e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 〈木蘭詩〉結語以雄兔、雌兔為例，提出「兩兔傍地走，安能辨我是雄雌？」的說法，請問作者這麼寫的用意是什麼？
  options:
  - label: A
    content: 以隱喻方式，象徵木蘭回歸家庭後，社會賦予女性的新角色
  - label: B
    content: 透過對偶句式，強調戰爭摧毀自我認同，使性別界線變得模糊
  - label: C
    content: 藉由比喻手法，說明個人能力應凌駕於性別，突顯木蘭的英勇
  - label: D
    content: 透過自然現象，表達對戰爭的無奈，暗示男女皆難逃戰亂命運。
  lesson_raw:
    title: 木蘭詩
    basis: 題目引用〈木蘭詩〉
- id: doc_113_高雄_苓雅_國文_g8s2e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 下列關於〈木蘭詩〉的寫作手法，下列何者正確？
  options:
  - label: A
    content: 字數：每句字數都相同，為漢代五言詩的代表作品
  - label: B
    content: 句型：善用問答句型，鋪陳木蘭的內心想法
  - label: C
    content: 筆法：以簡筆寫木蘭出征前的準備，以繁筆敘述軍旅生活
  - label: D
    content: 特色：語言樸實自然，不避雷同，善於用典
  lesson_raw:
    title: 木蘭詩
    basis: 題目引用〈木蘭詩〉
- id: doc_113_高雄_苓雅_國文_g8s2e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 「當船隻旁過牠們，牠們唏哩嘩啦像一條激流閃躲，像林立的保齡球瓶被撞翻成七零八落。」請問這段文字的所運用修辭法與下列何者相同？
  options:
  - label: A
    content: 巨浪翻騰，掀起千丈高牆，怒吼著撕裂海岸，天與地一瞬間崩裂
  - label: B
    content: 漫天星斗眨著眼睛，在夜空中輕語，低聲向大地訴說遙遠的故事
  - label: C
    content: 雷聲滾動，像憤怒的戰鼓敲響天際，驚醒沉睡的大地與顫抖的樹梢
  - label: D
    content: 颯颯秋風吹過，滿樹黃葉翻飛，雀鳥振翅盤旋，呢喃細語在林間迴盪。
- id: doc_113_高雄_苓雅_國文_g8s2e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 「花紋海豚散在牠們四周，像是衛兵、管理員，可能更貼切的形容是牧者，在花紋海豚圈住的範圍裡，弗氏海豚在裡頭驚躍、衝撞、盤轉。那分明是一群驚慌無措的迷途羔羊。」這段文字將弗氏海豚比喻成迷途羔羊，花紋海豚比喻成牧者，請問作者要表達什麼意思？
  options:
  - label: A
    content: 花紋海豚維持群體節奏，牽引不安的浪潮，塑造無形的秩序
  - label: B
    content: 花紋海豚與弗氏海豚相互抗衡，維持海洋生態的平衡與互助關係
  - label: C
    content: 花紋海豚操控弗氏海豚，展現強弱對比，形成階層性的族群分工
  - label: D
    content: 花紋海豚擅長遷徙與覓食，肩負群體生存任務，宛如燈塔指引方向。
- id: doc_113_高雄_苓雅_國文_g8s2e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 下列哪一文句能最能顯示「人類對於海洋的無知與侷限」？
  options:
  - label: A
    content: 對於弗氏海豚，我始終無法感受牠的眼神
  - label: B
    content: 我不曉得把弗氏海豚形容為「迷途羔羊」是否恰當
  - label: C
    content: 海面畢竟只是一個表象空間，我們能夠理解的範圍及深度的確相當有限
  - label: D
    content: 我們只是如靠近其他種海豚般靠近而已，是我們不當介入？還是牠們過度反應？
- id: doc_113_高雄_苓雅_國文_g8s2e1_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 下列文句，何者沒有冗言贅字？
  options:
  - label: A
    content: 也許說不定在海豚眼中，我們才是迷途羔羊
  - label: B
    content: 弗氏海豚太慌亂，連剎那的安靜也捨不得給與
  - label: C
    content: 我感到有些不安，船隻的靠近顯然明顯侵擾了牠們
  - label: D
    content: 牠們像一圈大漩渦，盲目地在一定的範圍區域內盤轉。
- id: doc_113_高雄_苓雅_國文_g8s2e1_s1_21
  section: 1
  number: 21
  type: single
  page: 3
  stem: 「一般海豚的眼睛很難看到，得在牠們刻意翻身近距離和你對望時，才能有機會看入牠的眼神。鯨豚的眼神神祕、深奧，我曾經從牠們的眼裡看到了粗野、仇惡或真摯和善的笑……那眼神往往能深入胸腔搜索靈魂。」請問作者想藉這段話表達什麼含意？
  options:
  - label: A
    content: 鯨豚的眼神充滿威脅，使人感到不安與恐懼
  - label: B
    content: 鯨豚的眼神充滿神秘感，彷彿能與人類交流
  - label: C
    content: 不同種類的鯨豚眼神各具特色，大多溫馴友善
  - label: D
    content: 鯨豚的眼睛觀察不易，只有在特定角度才能看到。
- id: doc_113_高雄_苓雅_國文_g8s2e1_s1_22
  section: 1
  number: 22
  type: single
  page: 3
  stem: 以下「」中的意思，何者兩兩相同？
  options:
  - label: A
    content: 若棄城而「走」／兩兔傍地「走」
  - label: B
    content: 「止」有一班文官／遂「止」住三軍
  - label: C
    content: 「望」西城蜂擁而來／孔明登城「望」之
  - label: D
    content: 十餘次「飛馬」報到／自「飛馬」遠遠望之。
- id: doc_113_高雄_苓雅_國文_g8s2e1_s1_23
  section: 1
  number: 23
  type: single
  page: 3
  stem: 下列有關〈空城計〉的文意說明，何者正確？
  options:
  - label: A
    content: 「眾將旌旗，盡皆藏匿。……大開四門」── 孔明埋伏軍隊，等待魏軍進攻
  - label: B
    content: 「教後軍作前軍，前軍作後軍」── 孔明下令調換軍隊順序，製造混亂迷惑敵軍
  - label: C
    content: 「此人料吾平生謹慎，必不弄險」── 孔明利用司馬懿多疑的性格，使其不敢攻城
  - label: D
    content: 「若棄城而走，必不能遠遁」──司馬懿認為孔明撤退，會陷入埋伏。
  lesson_raw:
    title: 空城計
    basis: 題目引用〈空城計〉
- id: doc_113_高雄_苓雅_國文_g8s2e1_s1_24
  section: 1
  number: 24
  type: single
  page: 3
  stem: 下列關於〈空城計〉中人物性格的敘述，何者正確？
  options:
  - label: A
    content: 孔明膽大妄為，在危急時刻決定放手一搏
  - label: B
