- id: doc_113_高雄_苓雅_國文_g8s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 日常廣告中常出現「諧音雙關」使消費者印象深刻，以達到宣傳的效果，例如：「白日衣衫淨」(洗衣店廣告)。以此為原則，請判斷下列選項，哪一個未使用諧音雙關?
  options:
  - label: A
    content: 速食店：吃漢堡，堡你永遠幸福
  - label: B
    content: 眼鏡行：配副好眼鏡，更能睛益求精
  - label: C
    content: 壽司店：新鮮看得見，壽益無窮樂快活
  - label: D
    content: 房地產：買房找我們，安居樂業不是夢。
- id: doc_113_高雄_苓雅_國文_g8s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列選項「 」中的字，何者讀音正確？
  options:
  - label: A
    content: 「轡」頭：ㄅㄟˋ
  - label: B
    content: 「戎」機：ㄐㄧㄝˋ
  - label: C
    content: 「旌」旗：ㄐㄧㄥ
  - label: D
    content: 雄「雌」：ㄘˊ。
- id: doc_113_高雄_苓雅_國文_g8s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 下列「」中的數字，何者代表實數?
  options:
  - label: A
    content: 「千」篇一律
  - label: B
    content: 「三」國演義
  - label: C
    content: 壯士「十」年歸
  - label: D
    content: 賞賜「百千」強。
- id: doc_113_高雄_苓雅_國文_g8s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 下列「 」中的注音寫成國字後，何組字形相同？
  options:
  - label: A
    content: 撲「ㄕㄨㄛˋ」／「ㄕㄨㄛˋ」氣
  - label: B
    content: 深「ㄙㄨㄟˋ」／「ㄙㄨㄟˋ」道
  - label: C
    content: 不理不「ㄘㄞˇ」／五「ㄘㄞˇ」繽紛
  - label: D
    content: 當戶理紅「ㄓㄨㄤ」／「ㄓㄨㄤ」模作樣。
- id: doc_113_高雄_苓雅_國文_g8s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 下列文句，哪一個句子用字完全正確？
  options:
  - label: A
    content: 為了考取證照，他終日在圖書館埋手苦讀，不敢鬆卸
  - label: B
    content: 那位小說家塑造出的女主角，是可媲美木蘭的巾幗英雄
  - label: C
    content: 大選即將來臨，各政黨展開激烈撕殺，甚至影嚮媒體的報導
  - label: D
    content: 詐騙集團被檢調單位察獲，涉案者抱頭鼠竄，試圖消毀證據。
- id: doc_113_高雄_苓雅_國文_g8s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 下列「」中的成語，何者使用正確？
  options:
  - label: A
    content: 許多愛國青年在動亂時期選擇「投筆從戎」，希望能為國家貢獻一份力量
  - label: B
    content: 婆婆待人熱情，每次我們去她家做客，都會感受到「寸草春暉」般的溫暖
  - label: C
    content: 這次賽前我費盡心力，最終取得了冠軍，深刻體會到「投桃報李」的快樂
  - label: D
    content: 耶誕舞會上，女孩們穿著華麗的禮服，打扮的猶如「人面桃花」，充滿自信。
- id: doc_113_高雄_苓雅_國文_g8s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 小王剛到公司上班，對業務還不熟悉，卻在資深主管面前大談管理技巧，甚至指導別人如何提升績效，讓同事們感到好氣又好笑。請問這種情況最符合哪句歇後語？
  options:
  - label: A
    content: 劉備摔阿斗 —— 收買人心
  - label: B
    content: 張飛穿針 —— 大眼瞪小眼
  - label: C
    content: 關公面前耍大刀 —— 不自量力
  - label: D
    content: 吃雞肋——食之無味，棄之可惜。
- id: doc_113_高雄_苓雅_國文_g8s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 下列各組成語，何者為反義詞？
  options:
  - label: A
    content: 汗牛充棟/坐擁百城
  - label: B
    content: 羊質虎皮/虛有其表
  - label: C
    content: 白雲蒼狗/滄海桑田
  - label: D
    content: 心猿意馬/一心一意。
- id: doc_113_高雄_苓雅_國文_g8s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 以下是「樂府詩」與「古體詩」的比較表，哪一個選項正確？
  options:
  - label: A
    content: 來源：樂府詩多為文人創作；古體詩多為民間作品
  - label: B
    content: 內容：樂府詩多反映現實生活；古體詩多為個人情懷的抒發
  - label: C
    content: 字數：樂府詩以五、七言的整齊句型為主；古體詩以雜言居多，偶有五、七言
  - label: D
    content: 押韻：樂府詩可換韻；古體詩一韻到底
- id: doc_113_高雄_苓雅_國文_g8s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 〈木蘭詩〉中，何者最能看出「行軍快速，節節勝利」之感？
  options:
  - label: A
    content: 東市買駿馬，西市買鞍韉
  - label: B
    content: 旦辭黃河去，暮至黑山頭
  - label: C
    content: 萬里赴戎機，關山度若飛
  - label: D
    content: 可汗問所欲，木蘭不用尚書郎。
