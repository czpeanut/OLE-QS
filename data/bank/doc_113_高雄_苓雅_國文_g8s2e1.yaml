  stem: '丞相祠堂何處尋？錦官城外柏森森①。映階碧草自春色，隔葉黃鸝空好音。

    三顧頻煩天下計，兩朝開濟②老臣心。出師未捷③身先死，長使英雄淚滿襟。

    —杜甫〈蜀相〉

    注：①森森：樹木茂盛的樣子。②兩朝開濟：指輔助先主開創帝業，後又輔佐後主匡濟時政。③捷：勝利。

