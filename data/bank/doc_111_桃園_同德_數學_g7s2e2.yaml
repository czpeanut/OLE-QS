- id: doc_111_桃園_同德_數學_g7s2e2_s3_1
  section: 3
  number: 1
  type: tf
  page: 3
  stem: '是非題

    (1) 小浩到超商買牛奶，已知一瓶牛奶 $35$ 元，共買了 $x$ 瓶，總共花了 $y$ 元，則 $y$ 和 $x$ 成正比

    (2) 小恩騎自行車，平均以每分鐘 $150$ 公尺的速率前進，當騎車的時間為 $x$ 分鐘時，前進距離 $y$ 公尺，則 $y$ 和 $x$ 成反比

    (3) 容積固定，每分鐘注水 $x$ 公升，經 $y$ 分鐘注滿，則 $y$ 和 $x$ 成反比

    (4) 當 $x$ 的值變得愈大時，$y$ 的值也隨著變大，則 $y$ 和 $x$ 一定成正比

    (5) 甲是乙的 $\frac{3}{2}$ 倍，則甲：乙＝$2:3$

    (6) 坐標平面上，方程式 $x=-2$ 的圖形是一條平行 $y$ 軸的直線

    (7) 已知 $a:b=3:7$，則（$a+2$）：（$b+2$）$= 5:9$'
