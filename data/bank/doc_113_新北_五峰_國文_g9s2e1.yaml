- id: doc_113_新北_五峰_國文_g9s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: '王國維在文學評論《人間詞話》提到：「白仁甫《秋夜梧桐雨》劇，沉雄悲壯，為元曲冠冕，然所作《天籟詞》，粗淺之甚，不足為稼軒奴隸。豈創者易工，而因者難巧歟？抑人各有能有不能也？讀者觀歐、秦①之詩遠不如詞，足透此中消息。」

    (注: ①歐、秦指歐陽脩、秦觀，北宋文學家)

    有關這段評論，下列解讀何者與王國維的想法相去最遠？'
  options:
  - label: A
    content: 文學家有自己專精的領域，很難兼擅各種體裁
  - label: B
    content: 文學作品若過於淺白粗俗，很難引起共鳴
  - label: C
    content: 文體在開創階段較易出現巧作，因襲者則較難
  - label: D
    content: 縱使文學名家也未必所有的創作都深受人們喜愛
