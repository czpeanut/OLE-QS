- id: doc_113_新北_五峰_國文_g9s2e1_s2_35
  section: 2
  number: 35
  type: single
  page: 4
  stem: 根據上文，作者說「貧瘠的土地可能是富饒的鄉野」，其原因最可能為下列何者？
  options:
  - label: A
    content: 一般人只注意生活衣食所需，卻忽略大自然的壯麗
  - label: B
    content: 表面貧瘠的土地下可能有肥沃的土壤能長出多樣的植物
  - label: C
    content: 具備不凡的審美能力能從看似單調的景觀裡發現生命力
  - label: D
    content: 用心經營將歷史的經驗與現實的體會結合便可改造土地
  group_stem: "貧瘠的土地可能是富饒的鄉野。\n 【甲】例如一個我所知道的湖岸，整個白日，你會以為那只\n是供浪花拍擊的所在，那是船無法泊近的一條黑色緞帶。但是，\n\
    接近黃昏時，你會看到海鷗飛過一個岬角，岬角後一群喧鬧的\n潛鳥忽然冒出，揭示了一個隱密小灣的存在。你突然衝動地想\n要上岸，想要踩在那熊果地氈上，去採鳳仙花，去偷摘海濱的\n\
    野果，或獵一隻松雞。此時又轉念，既然有一個小灣，為何不\n能有一條游著鱒魚的溪流？於是船首對準湖岸前進，然後上岸。\n 【乙】稍後，做晚餐的煙懶洋洋地飄浮在小灣之上，火在低\n\
    垂的枝條下閃爍不定。這是一塊貧瘠、窮乏的土地，但卻是一\n片豐饒的鄉野。\n  和對歌劇或油畫的品味一樣，人們對鄉野的品味展現個人不\n同的審美能力。有些人願意和一群人如牛群般地被趕著去參觀\n\
    「風景區」，當看到山上有瀑布、峭壁和湖泊，他們便認為這些\n山十分雄偉壯麗。對這些人而言，堪薩斯平原很單調，他們只\n看到無邊無際的玉米田，但沒有看到喘著氣的牛隊在草原之海\n\
    破浪前進。他們認為歷史生長在校園裡，他們注視著低低的地\n平線，卻無法從犎牛的肚皮底下看著地平線。\n 【丙】鄉野和人一樣，樸素的外觀下常常掩藏著不凡的珍寶，\n\
    倘若你想發掘這些珍寶，必須在鄉野生活，並且和鄉野一起生\n活。長著刺柏的山麓丘陵是最為乏味無趣的，但是在一群啁啾\n的冠藍鴉突然躥出藍色的身影後，一座歷經一千個夏日、披戴\n\
    著藍色漿果的古老山丘就變得不一樣了。【丁】當一隻鳴叫的雁\n從天空向一片單調、無精打采的三月玉米田打招呼時，玉米田\n便不再單調和無精打采了。\n    \
    \ （改寫自阿爾多．李奧帕德《沙郡年記．鄉野的情趣》）"
