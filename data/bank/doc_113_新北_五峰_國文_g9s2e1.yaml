- id: doc_113_新北_五峰_國文_g9s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: '「那幼時吃過的酒席，湯湯水水，以海鮮為主，這就是潮州菜啊！粿多魚丸多愛吃豬頭皮，這也是潮州人的吃性。會煮菜的女人備受重視，姿娘小祖母就是！在閩南話中，飯即糧，煮飯叫『煮糧』，音就是『姿娘』；而男人因打獵叫打補品，或打捕人。另一說『姿娘』本為『珠娘』，任昉的述異記中記載：『越俗以珠為上寶，生女謂之珠娘。』原來      。」

    根據文意，畫線處最適合填入下列何者？'
  options:
