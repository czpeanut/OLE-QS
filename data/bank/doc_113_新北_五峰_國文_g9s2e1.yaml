- id: doc_113_新北_五峰_國文_g9s2e1_s2_33
  section: 2
  number: 33
  type: single
  page: 4
  stem: 下列對於小說〈二十年後〉人性的衝突剖析，何者有誤？
  options:
  - label: A
    content: 鮑伯真心為赴約而來，身上閃耀著西部邪惡的力量/吉米面對鮑伯，隱瞞自己的身分，假意應酬
  - label: B
    content: 作為惡徒的鮑伯，對好友吉米重情守信/吉米秉公執法，找來便衣警察逮捕好友鮑伯
  - label: C
    content: 鮑伯粗俗散漫沒有戒心，卻是性情中人/吉米沉著冷靜，不徇私情
  - label: D
    content: 情感與理智的衝突體現在吉米身上，他曾煎熬是為正義抓捕，還是為友情放過鮑伯一馬，最後選擇不親自逮捕
  group_stem: "美國短篇小說家歐·亨利筆調幽默，結構嚴謹，敘事角度多\n變，作品往往看似幽默，實則辛酸，而且小說的結尾都能做到\n「出乎意料之外而又合乎情理之內」，這就是著名的「歐·亨利\n\
    式結局」。\n   〈二十年後〉是歐·亨利的短篇小說名篇，描述兩個美國少\n年本是一對情同兄弟的朋友，鮑伯選擇到西部去冒險時，他們\n相約二十年後在紐約相會。在西部闖蕩二十年後，儘管受到芝\n\
    加哥警方通緝的鮑伯，仍然信守承諾趕到紐約赴約，而在紐約\n當上巡警的吉米，竟以出人意料的手段逮捕了鮑伯。對鮑伯來\n說，吉米是最忠實可靠的朋友；然而二十年後再見面時，命運\n\
    把他們放在法律天平的兩端。\n    鮑伯，任性率真，重情重義，他認為「待在大城市紐約，\n難免會變得庸庸碌碌」，去西部，可以拓荒奮鬥，幹一番事業，\n結果他從一個不甘平凡的人，成為一個不法之徒。吉米，人高\n\
    馬大，氣派非凡，他把紐約當成「世界上唯一的好地方」，他穩\n紮穩打，不願到西部去冒險，他是理智冷靜又深諳世故的人，\n他成為一名帶著正義光環的紐約巡警。\n\
    \    歐·亨利以反襯手法形塑出〈二十年後〉立體的善惡並存的\n人物形象，把警察與罪犯這一對最不可調和的矛盾擺到人與人\n最純潔、最親近的自然情感面前，把正面人物警察的心理活動\n\
    推向兩極，對吉米來說，究竟是保持對摯友的忠誠，還是履行\n自己作為巡警的職責？他擺盪在情感與理法之間，造成最大限\n度的感情落差，也使讀者在故事的高潮處體會警察深陷職業操\n\
    守與私人情感的抉擇中那種翻江倒海的內心掙扎，並從小說人\n物曲折多姿，跌宕多態的情感衝突中省思自己。\n   〈二十年後〉雖然簡短，情節不是很複雜，然而仔細品讀，\n\
    有很多人性的衝突反映在其中。這些衝突有真與偽的衝突，有\n善與惡的衝突，有情感與理智的衝突。在故事的展開中，歐·亨\n利對小說人物沒有直接褒貶，只是客觀、從容的陳述，留給讀\n\
    者思辨的空間。幽默的筆觸、戲劇性的情節和出人意料的結局，\n都帶給讀者一絲淡淡的哀傷和溫暖的感動。(改寫自網路文章 )"
