  type: single
  page: 1
  stem: '梭羅 湖濱散記:「世上的大道人來人往，塵土飛揚，而傳統和因循，也會留下深遠的轍痕！我不願在船艙通道內穿梭，寧可走到桅杆前，站在世界的甲板上，那裡才能看清楚山巒之間的月色。」

    根據這段文字，下列何者最接近作者的觀點？'
  options:
  - label: A
    content: 我們還有不同的人生要經歷，不能把時間耗在重複之處
  - label: B
    content: 我們應該注意人與人之間的回憶，情感才能銘記於心
  - label: C
    content: 人總會走到不順遂的時刻，這些經歷讓我們想安頓駐足
  - label: D
    content: 人總不願停留於因循之處，似乎漂泊才符合人類天性
