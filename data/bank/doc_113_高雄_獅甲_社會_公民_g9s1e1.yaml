- id: doc_113_高雄_獅甲_社會_公民_g9s1e1_s1_39
  section: 1
  number: 39
  type: single
  page: 1
  stem: '敏恩打算去日本旅遊，表(二)為她比較三家旅行社的套裝行程規畫，分別依價格、行程及旅行社口碑滿意度所做的評分。根據機會成本的概念判斷，下列敘述何者正確？


    表（二）

    | 方案 | 價格滿意度 | 行程滿意度 | 旅行社口碑滿意度 |

    | :---: | :---: | :---: | :---: |

    | 甲 | 100 | 80 | 60 |

    | 乙 | 60 | 100 | 80 |

    | 丙 | 80 | 60 | 100 |'
  options:
  - label: A
    content: 若僅考量價格因素，選擇方案甲的機會成本應為方案乙
  - label: B
    content: 若僅考量行程因素，選擇方案丙的機會成本應為方案乙
  - label: C
    content: 若僅考量旅行社口碑因素，選擇方案丙的機會成本最高
  - label: D
    content: 敏恩覺得選擇方案乙機會成本最低，他的考量應為價格
