- id: doc_113_高雄_獅甲_社會_公民_g9s1e1_s1_38
  section: 1
  number: 38
  type: single
  page: 1
  stem: 有民眾在公共政策網路參與平台提案，希望政府參考英國作法，除要求店家不可免費提供塑膠袋外，還要課徵高額的塑膠稅，以減少民眾使用塑膠袋。上述民眾的提案所應用的經濟學概念與下列何者最相似？
  options:
  - label: A
    content: 停車費費率採累進稅率，停愈久，每小時收費越高
  - label: B
    content: 物價持續地上漲，同樣的貨幣能買到的東西變少
  - label: C
    content: 高麗菜價格慘跌，直逼成本價，農民種植意願低
  - label: D
    content: 航運價格高漲，為反映成本，店家調高商品售價
