- id: doc_113_高雄_獅甲_社會_公民_g9s1e1_s1_37
  section: 1
  number: 37
  type: single
  page: 1
  stem: 高雄市有很多偏遠地區因搭乘人數少，民營公車業者不願行駛，於是市府推動小黃公車，以計程車取代公車。目前有數十條路線，由市府編列預算補貼業者，提供民眾比照公車收費搭乘，滿足偏鄉地區民眾外出、就醫的需求。上述政策最可能是基於下列何種因素的考量？
  options:
  - label: A
    content: 資源無限可以盡情使用
  - label: B
    content: 業者追求最高營業利潤
  - label: C
    content: 資源分配兼顧公平正義
  - label: D
    content: 開放廠商自由市場競爭
  tags:
