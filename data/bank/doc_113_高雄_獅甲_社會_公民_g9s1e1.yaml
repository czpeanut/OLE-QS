- id: doc_113_高雄_獅甲_社會_公民_g9s1e1_s1_36
  section: 1
  number: 36
  type: single
  page: 1
  stem: 電動機車因為沒有排放廢氣或排放廢氣量較少，對空氣汙染產生影響較小。政府為了提高民眾騎乘電動機車的意願，當民眾購買電動機車時，就會依據機車的形式，在雙方完成買賣交易後，給予民眾不同的補助費用，如表(一)所示。而機車業者也因此看準商機，積極配合政府政策，推出多款電動機車，以符合綠色運輸的趨勢。針對上述政府的剖析，下列敘述何者最合理？
  options:
  - label: A
    content: 補助政策為負向誘因，導致業者利潤降低因而減少電動機車生產
  - label: B
    content: 政府對新購電動機車的金錢補助，可使機車業者的生產成本降低
  - label: C
    content: 消費者受到補助誘因而多買電動機車，業者則因銷售數量提升而獲利
  - label: D
    content: 政府不同的補助費用，是基於增進不同的公共利益而進行的行政管制
