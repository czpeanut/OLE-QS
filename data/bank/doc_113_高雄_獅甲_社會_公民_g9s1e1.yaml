- id: doc_113_高雄_獅甲_社會_公民_g9s1e1_s1_41
  section: 1
  number: 41
  type: single
  page: 1
  stem: 因物價上漲，雞排店老闆的生產成本增加，因此將雞排的售價從45元調整為65元。從價格因素來看，若消費者的所得及其他條件不變，消費者願意購買雞排的數量最有可能產生何種變化？
  options:
  - label: A
    content: 本來3天吃一次，可能會改成每週吃一次
  - label: B
    content: 不管價格有無變動，想買的數量不會改變
  - label: C
    content: 不一定，消費者可能多買，也可能會少買
  - label: D
    content: 生產成本提高使價格變貴，應該多買一些
