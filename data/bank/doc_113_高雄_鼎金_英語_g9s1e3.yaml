  group_stem: "Do you know what a VTuber is? VTuber, stands for Virtual YouTuber,\
    \ is like a magical online character who can talk, sing, and play games on the\
    \ Internet. These special characters are not real people but animations which\
    \ are controlled by real people.\n  VTubers use technology to create their virtual\
    \ selves, and they can run a channel and talk with people all over the world.\
    \ VTubers have many different types. Some are great at singing, some tell funny\
    \ stories, and others play video games wonderfully. However, they all have something\
    \ in common: you can interact with them online in livestream rooms.\n  Not like\
    \ YouTubers who can have many kinds of topics to share, VTubers cannot go outside\
    \ and take travel videos. Vlog is not possible to VTubers. They often focus on\
    \ animations and online worlds.\n  What makes VTubers super fun is that they often\
    \ have their own distinctive worlds and stories. It’s like walking into the one\
    \ and only magical land where anything can happen! So, if you want to have a good\
    \ laugh, listen to great music, or watch exciting games, check out the surprising\
    \ worlds of VTubers online!\n\nvirtual 虛擬的, animation 動畫, control 控制\ntechnology\
    \ 科技, interact 互動, livestream 直播, focus 專注"
