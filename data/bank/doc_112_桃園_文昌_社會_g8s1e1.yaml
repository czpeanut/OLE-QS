- id: doc_112_桃園_文昌_社會_g8s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 3
  stem: 史書上曾記載南朝梁武帝時，北朝大將侯景來投降，武帝極力籠絡，但侯景想要與當時琅琊王氏、陳郡謝氏家族通婚時，梁武帝卻說：「王謝兩家門第比較高，你恐怕配不上，我看你還是退而求其次，找門第稍低的朱、張兩家吧」請問：此記載可以顯示當時何種現象？
  options:
  - label: A
    content: 國君用人唯才，布衣可以為卿相
  - label: B
    content: 重視世族門第觀念，連皇帝也無法左右
  - label: C
    content: 禁止與胡人外族通婚，維護漢族傳統文化
  - label: D
    content: 世家大族爵位世襲，不同身分的人老死不相往來。
- id: doc_112_桃園_文昌_社會_g8s1e1_s1_19
  section: 1
  number: 19
  type: single
  page: 3
  stem: 造紙術是中國四大發明之一，由漢代蔡倫改良後逐漸普及，但中國造紙術的西傳是個偶然，某朝士兵在怛羅斯之役戰敗被俘虜，被俘士兵中有人是造紙工匠，之後大食在中亞設廠造紙，造紙業漸成為大食人的新興工業，逐漸傳到歐洲。紙的出現對於西方知識的普及與歐洲文藝復興的發展有著關鍵性的影響，請問：被俘虜的是中國哪一朝代的士兵？
  options:
  - label: A
    content: 秦朝
  - label: B
    content: 漢朝
  - label: C
    content: 隋朝
  - label: D
    content: 唐朝。
- id: doc_112_桃園_文昌_社會_g8s1e1_s1_20
  section: 1
  number: 20
