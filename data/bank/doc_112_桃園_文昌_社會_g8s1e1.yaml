- id: doc_112_桃園_文昌_社會_g8s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 文昌國中本學期地理課的課後學習任務說明寫道：「請畫出北起大興安嶺，經太行山和巫山，沿雲貴高原東側，直到中國及越南的邊境，這條線恰好是中國地形的其中一條分界線。」根據這條分界線的東側判斷，主要為下列圖(一)哪兩類地形分布？
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 丙丁
  - label: D
    content: 丁戊
  assets:
  - key: s1_1_f1
    kind: figure
    file: doc_112_桃園_文昌_社會_g8s1e1/s1_1_f1.png
- id: doc_112_桃園_文昌_社會_g8s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 英國女王伊莉莎白二世辭世震撼全球，她生前的一舉一動留給世人無限懷念，世界各地掀起弔唁人潮。在中國某特別行政區的居民紛紛至當地英國總領事館對英女王進行弔念，緬懷這位曾經擔任過當地45
    年元首的英國君主。國際媒體認為，這個現象也是當地居民在懷念過去英國殖民時代的象徵，請問：上文敘述是指下列中國哪一個城市?
  options:
  - label: A
    content: 天津
  - label: B
    content: 上海
  - label: C
    content: 澳門
  - label: D
    content: 香港。
- id: doc_112_桃園_文昌_社會_g8s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 1934 年新疆樓蘭古城小河墓地，出土一具青銅時代女屍，卵圓型的臉龐、披肩栗色長髮、小巧的鼻樑，宛如熟睡般的良好保存，在國內外引起轟動，讓她得到「微笑公主」的美稱。研究團隊表示，相比古埃及精心製作的木乃伊，新疆乾屍多為自然形成，主要是因當地氣候乾燥，雨量稀少。請問：新疆塔里木盆地之所以形成乾燥少雨的沙漠氣候，利於微笑公主乾屍千年保存完好，主要受到下列哪兩項因素影響？
    (甲)緯度過高 (乙)季風吹拂 (丙)地形阻隔 (丁)距海遙遠
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 甲丙
  - label: C
    content: 丙丁
  - label: D
    content: 乙丁。
- id: doc_112_桃園_文昌_社會_g8s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 中國2021 年宣布計畫在西藏雅魯藏布江建造「超級大壩」，這座巨壩座落世界屋脊東南部，該區處於甲與乙板塊碰撞的斷層帶上，工程相當危險。科學家認為水庫積蓄數億立方米水的重量，恐將誘發地震，即使沒有地震，雨季暴雨也會引起山洪爆發，勢必威脅水壩下游居民。位於雅魯藏布江下游的南亞國家相當緊張，擔心未來超級大壩完工，這顆不定時的水炸彈，恐怕會釀成難以彌補的災禍。請問：上文所述，甲與乙分別為哪兩大板塊？
  options:
  - label: A
    content: 太平洋板塊、菲律賓海板塊
  - label: B
    content: 歐亞板塊、印澳板塊
  - label: C
    content: 歐亞板塊、太平洋板塊
  - label: D
    content: 印澳板塊、太平洋板塊
- id: doc_112_桃園_文昌_社會_g8s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 附圖(二)是喜愛研究料理的美環同學，在觀賞央視電視節目「美食中國」後，基於興趣上網搜尋有關中國飲食文化的資料，依據圖中的資料判斷，此一飲食文化的差異，與中國哪一項的地理界線最為相似一致？
  options:
  - label: A
    content: 旱田與水田的分界線
  - label: B
    content: 農業與畜牧業的分界線
  - label: C
    content: 地勢最高與次高階梯的分界線
  - label: D
    content: 熱帶季風與副熱帶帶季風的分界線
  assets:
  - key: s1_5_f1
    kind: figure
    file: doc_112_桃園_文昌_社會_g8s1e1/s1_5_f1.png
- id: doc_112_桃園_文昌_社會_g8s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 研究中國地理時發現，由東南沿海向西北內陸前進，中國氣候會呈現何種變化的趨勢圖？
  options:
  - label: A
    content: 一月月均溫、年溫差皆遞減
  - label: B
    content: 年溫差、日溫差皆遞減
  - label: C
    content: 年雨量遞減、一月月均溫遞增
  - label: D
    content: 年溫差遞增、年雨量遞減。
- id: doc_112_桃園_文昌_社會_g8s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 曾有中國人說：「若是蘇聯沒有策動外蒙古獨立，中國的國土面積將比現今還要增加150多萬平方公里，那麼中國將會超越某些國家，成為世界國土面積第二大的國家。」請問：上文所述的「某些國家」，應是指下列何者？
  options:
  - label: A
    content: 巴西、澳洲
  - label: B
    content: 美國、俄羅斯
  - label: C
    content: 美國、加拿大
  - label: D
    content: 俄羅斯、加拿大。
- id: doc_112_桃園_文昌_社會_g8s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 中國是茶樹的原產地，亦是世界上最早發現和利用茶作為飲料和藥用的國家，是名副其實茶的故鄉。小安特別前往中國茶葉生產最多的地方旅遊（位置如附圖(三)），想進一步了解茶葉的生長環境。請問：下列敘述何者最符合當地茶鄉的氣候特色？
  options:
  - label: A
    content: 最冷月均溫高於0℃
  - label: B
    content: 降水季節分布均勻
  - label: C
    content: 年降水量少於約750 毫米
  - label: D
    content: 年均溫低於10℃。
  assets:
  - key: s1_8_f1
    kind: figure
    file: doc_112_桃園_文昌_社會_g8s1e1/s1_8_f1.png
- id: doc_112_桃園_文昌_社會_g8s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 「遼闊得像一片天，神鷹飛翔在高聳的雪山間，馬背上駝著我，酥油奶茶的童年，歡笑還在我心間……朝聖的路上，聽那遠古的鐘聲響，思緒是雪山的水，溶進黃河與長江」這是描述中國某地的歌曲，關於該地區的敘述，何者「有誤」？
  options:
  - label: A
    content: 建設全球海拔最高的鐵路
  - label: B
    content: 擁有中國最大的凍土層
  - label: C
    content: 境內設立少數民族的自治區
  - label: D
    content: 日出的時間為中國地區最早。
- id: doc_112_桃園_文昌_社會_g8s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 黃河為中國第二長河，和長江並列中華文化母親河。黃河源自於青海省的巴顏喀拉山北麓，然後一路橫跨九個省，最後注入渤海。對大多數河流來說，「清澈」無疑是一大讚美，然而對黃河來說，混濁才是它最大的特色。黃河是因為中游流經圖(四)中哪一地區，因當地水土流失嚴重，才成為全世界含沙量最高的河流？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
  assets:
