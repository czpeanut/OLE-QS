  section: 1
  number: 17
  type: single
  page: 3
  stem: 承上題，圖一中的「不更」是爵位的名稱，屬於「二十等爵制」當中的第四等，享有免除輪流服勞役的權利。此爵制源自於商鞅變法的改革內容，請問：當時人民可以藉由何種方式獲得爵位？
  options:
  - label: A
    content: 因為孝順、廉能而受到地方官員的推舉
  - label: B
    content: 從父兄的爵位身分世襲而來
  - label: C
    content: 在戰場上衝鋒陷陣，取得敵人首級
  - label: D
    content: 熟讀儒家 經典，通過太學的考核。
