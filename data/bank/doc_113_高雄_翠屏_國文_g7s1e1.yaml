  group_stem: "上帝的禮物（改寫）   李淺予\n  「上帝製造了驢子，給了牠一張厚皮，這使驢子的處境比我有利。」\n    大學畢業後，他兩年多沒找到一份正式工作，只好當了一名代課老師和家庭教師。因生活所迫，他甚至想拿起小提琴沿街賣藝。面對生存的壓力，一向堅強、自信的他，也開始懷疑自己。在給一位同學的信中，他半調侃半無奈地寫下了上面那句話。\n\
    \    你猜出來了嗎？這位自嘆「不如驢」的人，就是愛因斯坦。\n    再來猜一個：她是一位窮困潦倒的單身母親，住在沒有暖氣的小公寓裡，僅靠微薄的救濟金養活自己和女兒。「我輸得一敗塗地，除了流浪漢以外，找不到比我更窮的人了。」她說：「用普通人的標準，我是我所知道的最失敗的人。」\n\
    \    或許你已經知道了，這位自嘆「最失敗」的人，就是「哈利波特之母」──J．K．羅琳。\n    或許，你就是「最失敗」的人，由不得你不感嘆，自己或許真的不如一頭可愛的小毛驢。\n\
    \    你成了雪萊小說弗蘭肯斯坦中的怪物，「不管我在哪裡看到幸福，」他說：「我都不可改變地被排除在幸福之外。」\n    你真的絕望了，就像「掉在糖鍋裡的蒼蠅」，越掙扎，越容易折斷大腿。但你還是要掙扎，你必須掙扎，因為你知道，掙扎，也就是人們常說的「拼搏」、「奮鬥」，是你唯一的希望。\n\
    \    如果當年羅琳放棄了掙扎，她還會成為一個「在空中飛翔，眩暈而快樂的巫師」嗎？至於愛因斯坦，他更是從來沒有停止過掙扎，在談到自己為什麼會取得成功時，「上帝在分送禮物時是毫不公平的，」他說，「他只給了我騾子般的頑強。」"
