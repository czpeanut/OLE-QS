- id: doc_113_高雄_翠屏_國文_g7s1e1_s3_25
  section: 3
  number: 25
  type: single
  page: 2
  stem: 「西元一九五○年，美國 威斯康辛大學的Warren Wisby 與Arthur Hasler，捕捉了三百條正在歸途的鮭魚，並將之分成兩組，其中一組用棉花球塞住鼻孔，另一組不塞。再將之送到河川下游，測驗牠們是否能正確的游回上游。結果未被塞住的一組全數游回，而被塞住的一組約有四分之一以上，無法找到被捕地點。根據這個實驗可知，魚類迴游顯然是根據牠對生育地的一些記憶。另一現象是如把河流中的鮭卵，移到另一條河流孵化，則成長後的鮭魚將回到孵化地，而不是產卵地的河流。至於在大海中的鮭魚如何判別方向，較合理的解釋是，鮭魚的判別方向，應與鮭魚能判別海洋中水團的各種特性有關。這些特性當包括水團的溫度、鹽度，及其它化學組成，如水中特殊氣體的含量等，或河流中特有的味道，鮭魚就是憑藉這些資料，準確的判定出回鄉的方向。」（節錄自「中華百科全書網站」）根據這段文字，下列推論何者正確？
  options:
  - label: A
    content: 若鮭魚的鼻孔被塞住，則必定無法正確的游回上游出生地
  - label: B
    content: 魚類洄游是根據牠對生育地的一些記憶，如水團的各種特性
  - label: C
    content: 如果將鮭卵移到另一條河流中孵化，成長後的鮭魚仍可回到產卵地
  - label: D
    content: 目前實驗的研究結果證實鮭魚可完全憑藉嗅覺準確判定回鄉的方向
