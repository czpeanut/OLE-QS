  stem: 「『入學禮物袋』是十九世紀末以來德國人極為自豪的一項傳統。德文雖稱之為『袋』，但通常是圓錐形（但最近也流行過去東德使用的六角錐形）。每個德國人都保存有一張自己小學一年級開學典禮、抱著禮物袋的照片。德國人相信，裝滿糖果、甜食的禮物袋，有助於小朋友適應新環境、新作息時間、新規則，並且增強注意力和成績。現今，不希望孩子吃太多甜食的父母，就減少糖果分量，加進文具、小本書、故事錄音帶、CD、小填充玩偶等各種小禮物。德國西部華德福學校的小學新生入學典禮更特別，每位華德福孩子的入學禮物袋裡，還會放進一個由父母、祖父母手工縫製的蠟筆袋，放置用天然蜜蠟製作的蠟筆，充分顯現華德福教育中尊重天然、手工、親子關係的傳統。」身為一個家住德國、並且又是國小一年級新生家長，華莎充滿信心的要幫孩子準備禮物袋。下列她對禮物袋的理解何者正確？
