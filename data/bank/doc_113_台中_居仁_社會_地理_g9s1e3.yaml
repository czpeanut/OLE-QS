    世紀○○人抵達墨西哥之前，阿茲提克文明的農業養活了大量的居民，並發展出極為豐富且獨特的文化，例如以「可可豆」作為人民交易的媒介(一顆番茄等值一粒可可豆)。然而，殖民者登陸後，帶來疾病的傳播。短短數年之間，導致阿茲提克人大量死亡，再加上殖民者屠殺當地住民，導致阿茲提克文明的殞落。
