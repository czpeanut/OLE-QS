- id: doc_113_高雄_光華_社會_g8s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 受甲午戰敗的刺激，使中國讀書人覺醒，因而產生了兩派不同思維的救國行動。若把國家比喻成房屋，前者主張房屋只是部分老舊漏水，並非不可住，只需要進行翻修即可，無須重蓋，也就是進行體制內的改革；但後者認為房屋破爛不堪，翻修是無用的，直接拆除舊房再建新房，所以主張建立共和，才能救中國。請問前者與後者主張分別以何人為代表？
  options:
  - label: A
    content: 曾國藩、孫中山
  - label: B
