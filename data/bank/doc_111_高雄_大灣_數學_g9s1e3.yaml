- id: doc_111_高雄_大灣_數學_g9s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: '如右圖，已知 $\triangle ABC$ 中，$\overline{BC} > \overline{AB} > \overline{AC}$，想要找一點
    $P$，使得 $\angle BPC$ 與 $\angle A$ 互補。

    依霖的作法：

    ① 過 $B$ 點作與 $\overline{AB}$ 垂直的直線 $L$。

    ② 過 $C$ 點作與 $\overline{AC}$ 垂直的直線 $M$，並與直線 $L$ 交於 $P$ 點，則 $P$ 點即為所求。

    冬秀的作法：

    ① 作 $\triangle ABC$ 的外接圓。

    ② 在圓上取一點 $P$，則 $P$ 點即為所求。

    對於兩人的作法，下列判斷何者正確？'
  options:
  - label: A
    content: 兩人皆正確
  - label: B
    content: 兩人皆錯誤
  - label: C
    content: 依霖正確，冬秀錯誤
