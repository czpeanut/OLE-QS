  group_stem: 'Eunbi: Nice to meet you. My name is Eunbi. I am from South Korea.

    Harry: Nice to meet you, too. My name is Harry. I’m English.

    Eunbi: English? Isn’t that a language? How can you be “English”?

    Harry: Haha. English is not only a language. We also call the people from England
    “English”.

    Eunbi: Oh…I see. I’m from South Korea, so I am South Koreaish, right?

    Harry: Well… no. If a country’s name ends with “-land,” we often add “-ish” to
    refer to the people and the language. If a country’s name ends with “-a,” we often
    add “-n” to refer to the people and the language. However, this isn’t always the
    rule.

    Eunbi: Let me try. I’m from South Korea, so I’m Korean.

    Harry: You can say that again!

    Eunbi: That’s interesting! My cousin’s friend is from Poland, so he is Polish,
    right?

    Harry: Bingo!

    Eunbi: Thank you so much!


