    | Day | Mon.-Sun. | Sun. – Thurs. | Mon.-Sat. | Mon.-Fri. |

    | Time | 11:00 12:30<br>14:30 16:00<br>19:00 20:30 | 09:00 13:20<br>16:00 22:40
