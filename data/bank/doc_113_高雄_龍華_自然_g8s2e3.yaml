  stem: 根據本文內容，下列哪一項描述與造成泰坦號艙體破裂失事的原因較無關？
  options:
  - label: A
    content: 潛艇內部向外擠壓的壓力過大
  - label: B
    content: 潛艇下潛至極深處
  - label: C
    content: 潛艇使用碳纖維材料且未通過高壓認證
  - label: D
    content: 以上選項皆與艙體破裂原因有關聯。
  group_stem: "閱讀下列文章，並回答39～41 題：\n  2023 年6 月18 日，一艘名為「泰坦號」的深海潛艇在執行鐵達尼號殘骸參訪任務時不幸發生悲劇。這艘由美國公司\
    \ OceanGate 所研發的小型潛艇，當時搭載五名成員，計畫潛入大西洋海底約3800 公尺深處，觀看1912 年沉沒的鐵達尼號遺骸。下潛不到兩小時後，地面控制中心便與泰坦號失聯，經過多日搜救，最終在海底發現破裂的艙體碎片。根據美方調查，這起事故是由於潛艇在深海中發生「內爆」所致，船上五人全數罹難。\n\
    \  所謂內爆，是指當外界壓力遠大於物體內部壓力時，結構無法承受而瞬間崩解。在3800 公尺的深海中的海水壓力大約等同於一台卡車壓在手掌大小的面積上。若潛艇外殼有一點微小裂縫或材料疲乏，就可能瞬間被壓扁，連逃生反應的時間都來不及。\n\
    \  本事件不只揭示了深海探索的極限與風險，也反映出商業探險對安全規範的挑戰。泰坦號的結構材料選用了碳纖維與鈦金屬，但未通過國際常用的壓力容器認證，也引發專家對其風險的警告。這次悲劇讓世人再次認識到，科學與冒險之間，從來不該忽略「壓力」二字。"
