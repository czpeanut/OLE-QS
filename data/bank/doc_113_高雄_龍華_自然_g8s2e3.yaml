    不同種類的油，是由不同的脂肪酸與甘油結合而成，因此氣味與適合的料理方式也會不同。舉例來說，芝麻油香氣濃郁，適合涼拌或快炒；橄欖油則帶有果香，常見於西式料理。\n\
    人體在攝取這些油品後，三酸甘油酯就成為身體能量的重要來源，同時也是體內運輸脂肪最重要的化合物之一，它可以在小腸被分解回甘油和脂肪酸，然後運送到身體各部位被消耗掉，或者是在脂肪細胞內再度結合成三酸甘油酯儲存起來。\n\
    不過油也不是永遠都「新鮮好吃」。當油長時間受到高溫、光照或空氣中的水氣影響，三酸甘油酯會重新變回甘油和脂肪酸。這時候油的味道會變差，香氣消失，甚至會有苦味或油耗味，這就是油「變質」了。\n\
    那我們怎麼知道油是不是壞了呢？方法就是測酸價，中和一公克油脂中所含的游離脂肪酸，所用掉氫氧化鉀的毫克數，定義為酸價。先將油、乙醚、乙醇全部混合成一杯溶液後，慢慢滴入氫氧化鉀溶液，當酚酞變色的時候，只要計算使用多少氫氧化鉀就能知道此油品的價了。政府對食用油的酸價有明確標準，必須低於0.2\
    \ mg KOH/g 以下 才算合格。\n因此，油炸店若長時間重複使用油，三酸甘油酯會不斷被分解，油的酸價也會升高，對健康不利。市面上已有快速試紙可以測酸價，幫助店家判斷是否該換油，了解油的成分與變化，有助於我們挑選更健康的飲食方式，也讓我們從日常生活中體會化學的重要。"
