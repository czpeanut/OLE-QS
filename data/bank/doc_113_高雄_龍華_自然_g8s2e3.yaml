    塑膠是現代社會不可或缺的材料，從飲料瓶、食品包裝、吸管，到日常用品、電器外殼，無一不見塑膠的蹤影。然而，這些便利的產品若未妥善處理，就可能對環境與生物造成嚴重傷害。

    為了讓塑膠能夠妥善回收與再利用，全球多數國家（包含臺灣）都制定了塑膠分類與回收標誌制度，這些標誌通常是印在塑膠製品底部的「三角回收標誌」中間的數字，共有1
    到7 號(如右圖)。

    不同種類的塑膠有不同的熔點與化學性質。如果在回收過程中混雜在一起，會影響再製品的品質，甚至導致整批塑膠無法再生利用，只能被送進焚化爐處理，造成資源浪費與污染。

    以寶特瓶為例，一個看似簡單的瓶子，實際上包含了三種不同塑膠：瓶身是1 號PET、瓶蓋是5 號PP、外包膜可能是3 號PVC。若這三部分未分開回收，後端工廠在熔化製程中可能無法有效分離，不利於再生利用。塑膠的正確分類與回收，最終是為了達到「再生」的目標，再生塑膠可以被用來製作衣物纖維、文具、建材甚至世界盃球衣。這不但減少了原料開採與碳排放，也延長了塑膠的生命週期，減少對自然環境的傷害。'
