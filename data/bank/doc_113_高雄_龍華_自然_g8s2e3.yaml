- id: doc_113_高雄_龍華_自然_g8s2e3_s1_42
  section: 1
  number: 42
  type: single
  page: 6
  stem: 何謂碳足跡？
  options:
  - label: A
    content: 商品中碳原子的數量
  - label: B
    content: 商品重量與碳比例的計算
  - label: C
    content: 商品從生產到廢棄整體過程中排放的二氧化碳量
  - label: D
    content: 用碳做成的商品的總量。
  group_stem: '閱讀下列文章，並回答42～45 題：

    認識碳足跡：看不見的環境帳單

    地球正面臨劇烈的氣候變遷。根據科學家長期觀測，自1880 年以來，全球平均地表溫度已上升近攝氏一度，而這個升溫趨勢正在加快。導致氣溫上升的主要原因之一，就是人類活動所產生的溫室氣體排放，特別是二氧化碳。

    那麼，二氧化碳從哪裡來？事實上，我們每天所使用的產品，從製造、運輸、使用到廢棄處理的每一個階段，都會排放出不同量的二氧化碳，這些總排放量，便稱為產品的碳足跡。舉例來說，一份385公克的雞排，從雞的飼養、製作、油炸到包裝、販售、回收等整個生命週期中，會產生約695
    公克的二氧化碳排放。

    碳足跡與我們的飲食、交通、用電、穿衣、購物行為息息相關，因此，了解碳足跡並積極減碳，是每個人對地球的責任。在臺灣，政府已推行「碳足跡標籤制度」，讓消費者可以清楚知道商品在生產過程中產生的碳排量（如右圖，顯示某商品碳足跡為135
    公克），透過比對同類商品的碳足跡，選擇排放較少的商品，可以為地球減壓。除此之外，我們還可以從日常生活中進行減碳行動，例如優先選擇低碳食材（如在地、當季蔬果）、使用大眾運輸或步行取代開車、減少一次性產品使用、重複利用容器與袋子、培養節能習慣等。

    塑膠分類與回收

    塑膠是現代社會不可或缺的材料，從飲料瓶、食品包裝、吸管，到日常用品、電器外殼，無一不見塑膠的蹤影。然而，這些便利的產品若未妥善處理，就可能對環境與生物造成嚴重傷害。

    為了讓塑膠能夠妥善回收與再利用，全球多數國家（包含臺灣）都制定了塑膠分類與回收標誌制度，這些標誌通常是印在塑膠製品底部的「三角回收標誌」中間的數字，共有1
    到7 號(如右圖)。

    不同種類的塑膠有不同的熔點與化學性質。如果在回收過程中混雜在一起，會影響再製品的品質，甚至導致整批塑膠無法再生利用，只能被送進焚化爐處理，造成資源浪費與污染。

    以寶特瓶為例，一個看似簡單的瓶子，實際上包含了三種不同塑膠：瓶身是1 號PET、瓶蓋是5 號PP、外包膜可能是3 號PVC。若這三部分未分開回收，後端工廠在熔化製程中可能無法有效分離，不利於再生利用。塑膠的正確分類與回收，最終是為了達到「再生」的目標，再生塑膠可以被用來製作衣物纖維、文具、建材甚至世界盃球衣。這不但減少了原料開採與碳排放，也延長了塑膠的生命週期，減少對自然環境的傷害。'
