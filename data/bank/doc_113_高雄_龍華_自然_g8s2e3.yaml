    認識碳足跡：看不見的環境帳單

    地球正面臨劇烈的氣候變遷。根據科學家長期觀測，自1880 年以來，全球平均地表溫度已上升近攝氏一度，而這個升溫趨勢正在加快。導致氣溫上升的主要原因之一，就是人類活動所產生的溫室氣體排放，特別是二氧化碳。

    那麼，二氧化碳從哪裡來？事實上，我們每天所使用的產品，從製造、運輸、使用到廢棄處理的每一個階段，都會排放出不同量的二氧化碳，這些總排放量，便稱為產品的碳足跡。舉例來說，一份385公克的雞排，從雞的飼養、製作、油炸到包裝、販售、回收等整個生命週期中，會產生約695
    公克的二氧化碳排放。

    碳足跡與我們的飲食、交通、用電、穿衣、購物行為息息相關，因此，了解碳足跡並積極減碳，是每個人對地球的責任。在臺灣，政府已推行「碳足跡標籤制度」，讓消費者可以清楚知道商品在生產過程中產生的碳排量（如右圖，顯示某商品碳足跡為135
    公克），透過比對同類商品的碳足跡，選擇排放較少的商品，可以為地球減壓。除此之外，我們還可以從日常生活中進行減碳行動，例如優先選擇低碳食材（如在地、當季蔬果）、使用大眾運輸或步行取代開車、減少一次性產品使用、重複利用容器與袋子、培養節能習慣等。

