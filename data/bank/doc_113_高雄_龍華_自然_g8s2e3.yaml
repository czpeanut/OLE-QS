- id: doc_113_高雄_龍華_自然_g8s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 用肥皂水滅蟑螂有撇步，台灣大學昆蟲學系名譽教授徐爾烈表示，用肥皂水滅蟑螂一定要對準身體，最好是噴到腹部，如果肥皂水乾了，非但不能滅蟑，反而成了牠的食物。徐爾烈分析，包括蟑螂在內的昆蟲，多數都是透過體節上的小孔呼吸，而且他們的體表覆有一層蠟與油脂，因此蟑螂即使掉入水中，仍得以逃生，然而蟑螂若掉入肥皂水中，則會在短時間內死亡。請依據上述內容推測下列何者為蟑螂最合理的致死原因？
  options:
  - label: A
    content: 肥皂水是鹼性的，具腐蝕性，讓蟑螂的外殼被腐蝕出許多洞，進而死亡
  - label: B
    content: 肥皂水溶解蠟與油脂，造成蟑螂的呼吸孔進水，窒息而死
  - label: C
    content: 肥皂水具有些微毒性，對人體無害，但足以毒死蟑螂
  - label: D
    content: 蟑螂的密度比肥皂水大，所以沉入水中而死。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 理化
      code: 5-4
      title: 食品與清潔劑
      chapter: 第5章 有機化合物
    textbook: 八下理化 5-4 食品與清潔劑
    labeled_by: ai
  ai_answers:
