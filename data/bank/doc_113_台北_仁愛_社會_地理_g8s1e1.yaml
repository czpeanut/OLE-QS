  stem: 文中提及「土質鬆軟的黃土經過長期的自然作用，在黃土高原形成了溝壑連綿的壯美景觀」，請問，是何種自然方式使得黃土高原溝壑連綿？
  options:
  - label: A
    content: 河川侵蝕
  - label: B
    content: 風力堆積
  - label: C
    content: 風力侵蝕
  - label: D
    content: 斷層陷落
  group_stem: '－以下為自「巨匠旅遊」網頁擷取關於黃土高原的敘述，請閱讀文字並依序回答下列問題：

    「土質鬆軟的黃土經過長期的自然作用，在黃土高原形成了溝壑連綿的壯美景觀。黃土土層深厚，土壤結構緊密，直立性好，適於鑿挖。黃土高原的降雨偏少對在當地挖鑿窰洞也十分有利。整個黃土高原年均氣溫是6℃—14℃，年均降水量只有200
    毫米—700 毫米。整個黃土高原的降雨量總的趨勢是從東南向西北遞減，年平均相對濕度66%—78%，非常適合建造窰洞。」'
