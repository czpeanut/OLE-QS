  group_stem: '－《最小的犛牛》及《最小的犛牛要當姊姊了》系列書籍曾獲多項獎項，以下擷取文字，並請依序回答下列問題：

    「在白雪皚皚的山頂上，住著一群大大小小的犛牛，其中一隻最小的犛牛叫作葛蒂。葛蒂其實已經是一隻很棒的小犛牛了，但葛蒂覺得自己實在太小了，站在犛牛群當中，沒有人會看到她，她想要長高長大、變得強壯，因為沒有什麼事情是大犛牛做不到的…在高聳崎嶇的山頂上，冰柱搖搖晃晃，風雪吹個不停。明亮的月光下，媽媽告訴葛蒂，她即將要當大姊姊了。葛蒂興奮極了，整個晚上都做著甜美又毛茸茸的犛牛夢。天一亮，葛蒂立刻展開了『大姊姊計畫』」。'
