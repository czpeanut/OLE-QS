  stem: 2017 年8 月《大紀元》：「人們小時候可能都好奇過，如果從地面向下挖一條直的隧道，會通到地球另一端的哪個國家？現在，有個互動式對蹠點地圖（Antipodes
    Map）可以告訴你，如果你鑽進地道裡一直向前走，而沒有被炙熱的地球核心熔化掉，最後會從哪裡冒出來。」請問，若自該地圖網站上輸入「中國北京」查詢對蹠點，搜尋出來的國家最有可能位在哪個位置？（說明：「對蹠點」為從地球上的某一地點向地心出發，穿過地心後所抵達的另一端，就是該地點的「對蹠點」。）
