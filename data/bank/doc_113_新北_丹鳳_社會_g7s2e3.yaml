- id: doc_113_新北_丹鳳_社會_g7s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '經濟部定義：「凡是透過電子化形式所進行的商業交易活動，例如 : 網路購物、外送平台等，皆屬於電子商務的範疇」。2020 年全球新冠疫情大規模爆發，進一步促使許多消費者養成使用電商的習慣。電子商務突破了時間與空間的限制，使消費者無論是選購價格高昂的珠寶飾品，還是日常所需的柴米油鹽，都能輕鬆在線上完成購買。請問：若以下四位顧客要選擇最適合的配送方式，應分別對應下圖中哪一代號？

    顧客一: 從淘寶購物平台選購國外的大型家具

    顧客二: 在小農自己架設的網路平台選購水蜜桃

    顧客三: 透過外送平台訂購附近餐廳的午餐

    顧客四: 從精品網站選購法國限量款名牌包'
  options:
