  stem: '下表為台灣房屋集團趨勢中心的調查資料。與上季相比，今年首季六都房價僅台北市季跌 5.4%，而新北市則相較上季上漲逾一成，季漲幅居六都之冠，可見在房屋買賣上的選擇，已有許多民眾將目標由台北市轉移至新北市。請問
    : 造成民眾更有意願在新北市添置房產的因素，最有可能為下列何者？

    六都 2025Q1 預售屋房價變化

    | 縣市 | 2025 年 Q1 | 2024 年 Q4 | 季漲幅(%) | 2024 年 Q1 | 年漲幅(%) |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 台北市 | 121.8 | 128.8 | -5.4% | 119.1 | 2.3% |

    | 新北市 | 72.6 | 65.0 | 11.7% | 57.4 | 26.5% |

    | 桃園市 | 38.1 | 36.2 | 5.2% | 38.9 | -2.1% |

