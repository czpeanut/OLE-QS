  stem: '＊資料一：960 年正月初一，北方守將急報，稱北漢與契丹合勢，聯兵入侵，帝命Ａ率宿衛禁軍北上迎敵。

    資料二：初三Ａ率大軍自京城東北邊出城，士卒紀律嚴明。

    資料三：初四將士將黃袍披在Ａ身上，並下拜高呼萬歲。Ａ堅拒，眾將士不聽，Ａ見勢不可免，便對諸將說：「你們貪圖富貴，立我為天子，就必須聽從我的命令，不然，我不當這個皇帝。」

    從上述三個資料內容可知，Ａ為下列何人？'
