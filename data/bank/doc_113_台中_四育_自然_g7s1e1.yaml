  group_stem: '人工海綿是我們生活中常見的清潔用品，但其實是人類模仿大自然中的海綿所製造出來的。海綿這種生物一般都依附在海底的礁石上，通常是不移動的，所以以前的人們一直認為海綿是一種海洋植物。

