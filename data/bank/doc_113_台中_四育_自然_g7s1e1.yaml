  section: 1
  number: 1
  type: single
  page: 1
  stem: 寶寶「提出疑問」這是科學方法七個步驟中的第二步驟，接下來的第三步驟應該是？
  options:
  - label: A
    content: 進行實驗
  - label: B
    content: 假設
  - label: C
    content: 參考文獻資料
  - label: D
    content: 進行結果與討論。
  group_stem: '右圖一是寶寶在地上爬行，觀察到地上有個物體，寶寶在好奇心驅使下將此物拿起來，同時，他心中有了一個疑問:「此物體能吃嗎？」寶寶假設這物體是可以食用的食物，於是做了個小實驗來驗證一下，寶寶便舔了此物體，物體味道的刺激訊號從他的舌尖開始，依靠神經細胞傳送至大腦。經過大腦分析，寶寶感覺這物體口味不佳，於是大聲地報告了他的實驗結論:
    「這個物體並非食物！」。寶寶接著邀請別人再作測試、重複實驗，來確認他的結論是否具有「可驗證性！」。

    上述這位寶寶探究的過程，可以說是實踐了「科學方法」的過程！當我們對生活充滿好奇，可以藉由「科學方法」，善用我們的觀察力，在產生疑惑時，帶領我們逐步地釐清，解決問題，找到答案，讓我們更了解身邊各種事物和現象。

    文章改編自:網路文章<科學探究就在生活中>'
  shared_asset: g1_1_6
  answer:
  - C
  answer_source: answer_key_vlm
