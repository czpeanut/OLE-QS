    當時，地球的大氣成份中並沒有臭氧，因此太陽光的紫外線便大量地照射到地表，在雲層產生頻繁閃電。這些雷電提供能量，激發環境中各種物質進行化學反應，於是，在水中醞釀出與組成細胞相關的物質，其中包含了胺基酸、核酸（遺傳物質）等，終於，第一個細胞-最初的生命於水中誕生，而這花了近六億年的時間。

    最初的生命型態與現今單細胞生物細菌較為相似，不過，當時的地球大氣中是沒有氧氣的。直到30多億年前，演化出可以行光合作用的「藍菌」。這一類的單細胞生物，能吸收光能，利用二氧化碳，製造養分和氧氣，空氣中的氧氣才逐漸累積，倚賴氧氣生存的各種生命形態開始蓬勃發展。氧氣可以轉變成臭氧，臭氧的出現，吸收了紫外線能量，減少了陸地上的紫外線照射量，生命的演化方向開始從水中發展到陸地，從單細胞生物發展到多細胞生物，地球上的生物體不再只是侷限於微觀尺度的大小了。

    文章改編自:網路文章<混沌初開-生命的起源>'
