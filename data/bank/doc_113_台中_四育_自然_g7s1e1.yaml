- id: doc_113_台中_四育_自然_g7s1e1_s1_36
  section: 1
  number: 36
  type: single
  page: 4
  stem: (甲)地球表面到處是火山，大氣中充滿從地球內部噴發出來的氣體；(乙)地球非常炎熱，佈滿滾燙的熔岩；(丙)組合細胞所需的物質出現在水中，它們的結合形成了第一個細胞；(丁)地球逐漸冷卻，大氣中水蒸氣凝結成水降落到地表，雨水累積在低漥的地表形成海洋。關於地球的演變與生命起源，依照發生先後順序，下列排列何者正確？
  options:
  - label: A
    content: 甲乙丙丁
  - label: B
    content: 甲丁乙丙
  - label: C
    content: 乙甲丙丁
  - label: D
    content: 乙甲丁丙。
  group_stem: '地球約在46億年前形成，地球的環境經歷了許多變化，才在地球上出現了第一個細胞，我們稱之為:生命的起源，如下圖十四所示。

    地球剛形成時，是一顆灼熱高溫的火球，同時有來自太空的物質不斷地撞擊地球表面，使得整顆地球完全處於熔融狀態。

    後來，地球開始慢慢地冷卻，漸漸形成了固態的地表，即是陸地。熾熱的地心透過旺盛的火山活動，不斷噴發出各種氣體，例如：氮氣、水蒸氣、二氧化碳等，改變了大氣的組成成份。伴隨冷卻而來的，是大氣層中的水蒸氣開始凝結成雲，接著下了一場持續百萬年之久的滂沱大雨，形成了海洋。

    當時，地球的大氣成份中並沒有臭氧，因此太陽光的紫外線便大量地照射到地表，在雲層產生頻繁閃電。這些雷電提供能量，激發環境中各種物質進行化學反應，於是，在水中醞釀出與組成細胞相關的物質，其中包含了胺基酸、核酸（遺傳物質）等，終於，第一個細胞-最初的生命於水中誕生，而這花了近六億年的時間。

    最初的生命型態與現今單細胞生物細菌較為相似，不過，當時的地球大氣中是沒有氧氣的。直到30多億年前，演化出可以行光合作用的「藍菌」。這一類的單細胞生物，能吸收光能，利用二氧化碳，製造養分和氧氣，空氣中的氧氣才逐漸累積，倚賴氧氣生存的各種生命形態開始蓬勃發展。氧氣可以轉變成臭氧，臭氧的出現，吸收了紫外線能量，減少了陸地上的紫外線照射量，生命的演化方向開始從水中發展到陸地，從單細胞生物發展到多細胞生物，地球上的生物體不再只是侷限於微觀尺度的大小了。

    文章改編自:網路文章<混沌初開-生命的起源>'
  shared_asset: g1_36_40
  answer:
  - D
  answer_source: answer_key_vlm
