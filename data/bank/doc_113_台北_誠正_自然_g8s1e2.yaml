- id: doc_113_台北_誠正_自然_g8s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 以下關於「聲音要素」的描述，何者錯誤？
  options:
  - label: A
    content: 以不同的力量敲擊鼓面同一位置，改變的是聲音的「響度」，即聲波的振幅大小，可用分貝(dB)為單位。
  - label: B
    content: 相同力量敲擊不同長短的中空竹筒，發出聲音的「音調」不同，即聲波的振動頻率不同，可用赫(Hz)為單位。
  - label: C
    content: 物體的振動頻率愈大，發出聲波的音調愈高。
  - label: D
    content: 「0分貝」是正常耳朵所能聽見的最小音量，分貝數愈大，代表音量愈大，而「50分貝」的強度是「20分貝」強度的30倍。
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 理化
      code: 3-3
      title: 多變的聲音
      chapter: 第3章 波動與聲音
    textbook: 八上理化 3-3 多變的聲音
    labeled_by: ai
