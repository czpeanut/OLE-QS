- id: doc_113_台北_誠正_自然_g8s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 以下關於聲波產生和傳遞的實例的說明，何者正確？
  options:
  - label: A
    content: 敲擊音叉發出聲音，再用手握緊音叉金屬部分使其停止振動後，仍然可以聽到其聲音，只是漸弱
  - label: B
    content: '波以耳將密閉玻璃罩內的空氣慢慢抽出，同時不斷敲擊罩內鈴鐺，發現聲音漸弱最後消失，表示發出聲音的條件是 : 物體振動並經由介質傳遞'
  - label: C
    content: 聲音無法從空氣傳入水中，所以潛水時無法聽到聲音
  - label: D
    content: 工人在附近使用機具施工時，耳朵會聽到噪音，但腳或身體一定不會感受到地面的振動
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 理化
      code: 3-2
      title: 聲音的形成
      chapter: 第3章 波動與聲音
