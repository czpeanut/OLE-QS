  section: 1
  number: 16
  type: single
  page: 2
  stem: 在25℃室內敲擊一音叉，示波器顯示聲波(甲)波形如圖(三)。第二天下雨、溼度大幅上升，室內氣溫仍為25℃，若用相同力量、但加快相同時間內敲擊音叉的次數，下列關於這次所測得聲波(乙)的資料何者正確？
  options:
  - label: A
    content: 測得波長仍為0.2秒
  - label: B
    content: 加快敲擊頻率可使聲速變快
  - label: C
