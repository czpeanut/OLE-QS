- id: doc_113_台北_誠正_自然_g8s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: '右表(一)為狗、貓兩種動物所能聽見聲音的頻率範圍。


    表(一)

    | 動物 | 聽覺頻率範圍(Hz) |

    | --- | --- |

    | 狗 | 15 ~ 50000 |

    | 貓 | 60 ~ 65000 |


    在聲速為340 m/s的環境下，若發出波長為1000 cm，且音量足夠大的聲波，參閱表中的資訊，有關這兩種動物是否能聽到此聲波的敘述何者最合理？'
  options:
  - label: A
    content: 兩種動物都聽得到此聲波
  - label: B
    content: 兩種動物都聽不到此聲波
  - label: C
    content: 狗聽得到此聲波，而貓聽不到
  - label: D
    content: 貓聽得到此聲波，而狗聽不到
  tags:
