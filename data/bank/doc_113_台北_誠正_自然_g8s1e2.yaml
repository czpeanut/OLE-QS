- id: doc_113_台北_誠正_自然_g8s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 關於本文的描述，以下何者正確？
  options:
  - label: A
    content: 聲音在中空圓管中傳遞，不易向外擴散，主要是利用折射原理
  - label: B
    content: 聽診器讓身體內部微弱的聲音沿著細導管傳遞到耳中，這是為了保有聲波的音色
  - label: C
    content: 聲音在中空管中傳遞時，響度會愈來愈大
  - label: D
    content: 孩子敲擊木料，其他人將耳朵貼緊另一端木料而能聽到聲音，表示聲音可以於固體介質中傳播
  group_stem: '※聽診器是19世紀法國 雷奈克醫生所發明。他曾經看見幾個孩子在修繕房屋的木材堆上玩耍，其中一位敲擊一根木料的一端，並叫其它的孩子用耳朵貼在木料的另一端來聽聲音，孩子們高興地喊說「聽見了！」。於是他試著將一張厚紙緊緊捲成圓柱體，一端靠在病人的心臟，耳朵則靠在紙捲另一端上，果然發現能以一種獨特的方式，感知心臟更清晰的跳動聲音。之後雷奈克醫生找人製作了一根長約30公分的杉木，將中間挖空成管狀，為了便於攜帶，他把這根管子分成兩截，有螺紋可以旋轉連接，並取名「聽診器」。之後經過數次逐漸改進，最終成為我們看到的樣子，到了醫療科技發達的現在，聽診器依舊被廣泛使用，能讓醫生迅速查出身體早期疾病徵兆，對於人類是一項很重要的發明。請回答以下13～14
    題 :'
