  - label: B
    content: 反射後的回聲，和原來聲音相比，振幅、頻率、波長、週期都不改變，只有波速變小、方向改變
  - label: C
    content: 在小空間的室內講話、唱歌，聲音較響亮但無法聽到兩個聲音，是因為空間太小，原聲與回聲重合
