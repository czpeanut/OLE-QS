  type: single
  page: 1
  stem: 關於生活中回聲的應用，以下何者錯誤？
  options:
  - label: A
    content: 音樂廳的布幔和交通設施兩側的吸音板，均可加強聲波的反射
  - label: B
    content: 利用地震或爆炸的震波，可分析地層結構或探測地底石油位置
  - label: C
    content: 倒車雷達發射超聲波，接收到障礙物反射的訊號後，發出嗶嗶聲來警示駕駛人。
  - label: D
    content: 船艦可利用聲納探測海底地形或測量魚群位置
