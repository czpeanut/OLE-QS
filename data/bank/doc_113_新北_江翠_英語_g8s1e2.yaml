  stem: Which of the following best describes the meaning of poverty?  best 最好地 describe
    描述
  options:
  - label: A
    content: Poverty is simply a lack of money.  simply 僅僅是
  - label: B
    content: Poverty is only an issue for poor people.  issue 議題
  - label: C
    content: Poverty is not able to buy expensive things.  able 有能力的
  - label: D
    content: Poverty is the lack of basic human needs, such as food, shelter, and
      health care.
  group_stem: 'Do you know what poverty is? Let me tell you!

    Poverty is hunger.

    Poverty is lack of shelter.

    Poverty is being sick and not being able to see a doctor.

    Poverty is not having chances to go to school and not knowing how to read.

    Poverty is not having a job in the future, living one day at a time.

    Poverty looks different in different places and times, and people talk about it
    in many ways. Most of the time, poverty is something people want to get away from.
    So, poverty is a call to action for everyone, whether rich or poor. It means we
    need to work together to make sure everyone has enough food, a safe place to live
    in. And everyone can go to school, see a doctor, stay safe from harm, and have
    a say in their community.


     poverty 貧窮 lack 缺乏 shelter 庇護所 call to action 行動呼籲 harm 傷害 have a say 發言權 community
    社群'
  shared_asset: g5_28_30
  ai_answers:
    gemini: D
    qwen: D
  answer:
  - D
  answer_status: ai_generated
