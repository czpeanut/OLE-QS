  group_stem: 'What is the normal life of a ten-year-old child? It’s always about
    doing schoolwork, being with friends, playing sports, and playing games.  A young
    boy, Safin Sabin-Ahmed, however, leads quite a different life. He goes to school
    and takes care of his sock business every day.

    How did Safin Sabin-Ahmed ever start his own business? Here is the story. When
    Safin was nine, he went shopping at Primark, a big store in England. He was surprised
    to see so many kinds of clothes, shoes, and socks there. Then, an idea came to
    his mind. "Okay, I can be like Primark," he thought. He shared his idea with his
    mother. At first, she laughed at his dream, but then she said, “Go ahead, son.
    Let’s do it.” From that day on, Safin started his sock business.

    He designs bright, eye-catching socks with motivational quotes on them to make
    people feel good about themselves. For example, “I can do anything I put my mind
    to.” or “I’m happy just the way I am.” His socks are popular with his classmates
    and their parents. His sock business is growing, and he hopes to sell his products
    in big department stores in the near future.

    Do you have a dream? No dreams are too big! Go for them!

