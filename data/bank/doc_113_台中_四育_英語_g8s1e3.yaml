- id: doc_113_台中_四育_英語_g8s1e3_s6_43
  section: 6
  number: 43
  type: single
  page: 4
  stem: 43. ( ) What does ones mean?
  options:
  - label: A
    content: Kinds.
  - label: B
    content: Clothes.
  - label: C
    content: People.
  - label: D
    content: Years.
  group_stem: 'B.

    How often do you buy clothes? How much money do you usually spend on them? And
    what kinds of clothes do you like to buy? Do you usually buy expensive clothes
    or cheap ones? Some people don''t buy clothes very often or buy a lot of clothes.
    They only buy nice and expensive clothes because they can wear such clothes for
    years. Some people like to buy cheap clothes, and they often buy clothes. When
    clothes are on sale, they will buy a lot. They may never or only wear the clothes
    for a few times, so they throw away a lot of clothes every year. This is so-called
    fast fashion.

    Many companies use cheap workers and polyester to make a lot of cheap clothes.
    Because of the low price, people may buy more clothes. When there are new clothes,
    people wouldn''t like to wear old clothes and will throw them away. Do people
    really save money to buy lots of cheap clothes? In fact, they waste money and
    hurt the environment. They throw away kilograms of oil, water, and waste every
    year, and that is killing our world. Fast fashion may give people more pretty
    clothes, but it''s bad for our environment.


    [D] kind 種類 such 如此 throw away 丟掉 so-called 所謂的 waste 浪費; 垃圾 kilogram 公斤 kill
    殺 pretty 漂亮的'
