  group_stem: 'C.

    You know what''s cool

    About going to school?

    Riding on it.


    We say hello to our friends

    When the day just starts

    And we''re riding on it.


    Some are new

    But we still say hello to them, too

    When we''re riding on it.


    Lazy birds snore

    But early birds roar

    Angry the driver

    When we''re riding on it.


    "Stop that noise!

    Or you''ll get off."

    So we try to cool down

    Because it is his.


    And what''s really cool

    About getting to school

    ——改編自 The Bus, David L. Harrison


