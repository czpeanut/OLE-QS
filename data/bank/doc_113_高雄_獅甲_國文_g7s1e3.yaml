- id: doc_113_高雄_獅甲_國文_g7s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 「學而時習之」的求知態度，與下列何項最接近？
  options:
  - label: A
    content: 日知其所亡，月無忘其所能
  - label: B
    content: 處處發生疑問，竭力探求答案
  - label: C
    content: 學問之道無窮，總以有恆為主
  - label: D
    content: 知之為知之，不知為不知
  lesson_raw:
    title: 論語選
    basis: 引用論語選課文
- id: doc_113_高雄_獅甲_國文_g7s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 以下是孔子對其弟子的評論：「宰予：朽木不可雕也。顏淵：不遷怒，不貳過。子路：好勇過我，無所取材。申棖：棖也欲，焉得剛？」由以上評語，可知孔子最欣賞何人？
  options:
  - label: A
    content: 宰予
  - label: B
    content: 子路
  - label: C
    content: 顏淵
  - label: D
    content: 申棖
  lesson_raw:
    title: 論語選
    basis: 題目考論語內容及孔子評語
- id: doc_113_高雄_獅甲_國文_g7s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 「人不知而不慍，不亦君子乎？」這句話雖然是問句，但答案在問題的反面，此種修辭稱為「激問」。請問下列文句，何者也屬於激問修辭？
  options:
  - label: A
    content: 心若知道靈犀的方向，哪怕不能夠朝夕相伴？
  - label: B
    content: 你的天空，可有懸著想的雲？
  - label: C
    content: 我們的日子為什麼一去不復返呢？
  - label: D
    content: 秋來春去紅塵中，誰在宿命裡安排？
  lesson_raw:
    title: 論語選
    basis: 引用論語選課文
