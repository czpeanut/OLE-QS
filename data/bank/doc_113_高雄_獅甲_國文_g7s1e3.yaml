- id: doc_113_高雄_獅甲_國文_g7s1e3_s2_41
  section: 2
  number: 41
  type: single
  page: 5
  stem: 根據本詩，下列何者敘述最恰當？
  options:
  - label: A
    content: 作者摺紙船是因為珍惜資源不浪費
  - label: B
    content: 作者摺的紙船既漂亮又禁得住風雨
  - label: C
    content: 作者希望紙船能傳遞對母親的思念
  - label: D
    content: 母親歡喜收到作者用愛摺放的紙船
  group_stem: '（一）

    我從不肯妄棄了一張紙，總是留著—留著，

    疊成一隻一隻很小的船兒，從舟上拋下在海裡。

    有的被天風吹捲到舟中的窗裡，有的被海浪打溼，沾在船頭上。

    我仍是不灰心的每天的疊著，總希望有一隻能流到我要它到的地方去。

    母親，倘若你夢中看見一隻很小的白船兒，

    不要驚訝它無端入夢。

    這是你至愛的女兒含著淚疊的，

    萬水千山，求它載著她的愛和悲哀歸去。（冰心 紙船──寄母親 ）

    注：①妄棄：任意捨去。'
