  section: 1
  number: 27
  type: single
  page: 3
  stem: 「細細香風淡淡煙，競收桂子慶豐年。兒童解得搖花樂，花雨繽紛入夢甜。」關於這首詩的說明，何者正確？
  options:
  - label: A
    content: 此為平起仄聲的律詩
  - label: B
    content: 「競收桂子」代表當時為秋季
  - label: C
    content: 此詩給人富貴享樂的感受
  - label: D
    content: 押韻的字是年、甜
  lesson_raw:
    title: 故鄉的桂花雨
    basis: 引用故鄉的桂花雨文中詩句
