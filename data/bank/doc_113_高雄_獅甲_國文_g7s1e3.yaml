- id: doc_113_高雄_獅甲_國文_g7s1e3_s2_43
  section: 2
  number: 43
  type: single
  page: 6
  stem: 洪醒夫筆下的小人物，大都具有何種形象與特質？
  options:
  - label: A
    content: 誠懇堅韌
  - label: B
    content: 外向親和
  - label: C
    content: 精打細算
  - label: D
    content: 剛強固執
  group_stem: '（二）

    在這本小書裡，我把近十年來斷斷續續寫下來的、自己比較喜歡的、臺灣農村裡的幾個小人物或小故事收集在一起，希望或多或少描述一般農民的生活內容，對事物的看法，以及他們刻苦耐勞奮勉②不懈的精神。我自小與他們生活在一起，印象深刻，寫作時，他們的影像清晰的浮現出來，所以特別感到溫馨與親切。故事的背景大部分在臺灣光復後的十幾二十年內，那時一般農民的物質生活都比較匱乏，知識水準也比較低，生活壓力很大，再加上那許多自古以來就輾轉相傳③，他們也固執著去維護的愚昧的觀念在那裡作祟，使他們顯得更加窮困艱難，但他們畢竟誠懇、勇敢、強韌④的生存下來，而且一代比一代活得更好，更有希望。使我非常關心。

    我用平凡的文字把它寫下來，想寫給我的妻子、兒女，以及以後的子孫看，希望他們不要忘了我們的來處，不管將來過得燦然⑤或者黯然⑥，都不要忘記。

    感謝這些年曾經照顧過我的長輩以及朋友，不管識與不識，他們的鼓勵與關愛都使我感到溫暖；同時，也要謝謝我的多年老友——如今亦是吾妻的林碧雲女士，在我最困難最不被諒解的時候，她支持我，在我不太寬裕的現實生活裡，她為我以及我們的兒子安排了一個舒適的生活環境。此外，我更衷心感激我那不識字的父母，他們身分卑微，卻活得乾淨，使我感到心安。

    【注釋】①序：常放在正文前，概說或評述作品內容的文章。②奮勉：振作勤勉。③輾轉相傳：多次轉移傳遞。④強韌：柔軟而堅固。⑤燦然：光彩明亮、耀眼。⑥黯然：陰暗、黑暗。

    （洪醒夫 黑面慶仔序① ）'
