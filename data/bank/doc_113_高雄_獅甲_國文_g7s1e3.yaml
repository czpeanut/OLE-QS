  type: single
  page: 2
  stem: 古人的年齡有時不以數字直接表示，而是用其他代稱的詞語來委婉表示。下列選項中皆為年齡代稱的詞語，何者年歲是最高齡？
  options:
  - label: A
    content: 耳順之年
  - label: B
    content: 及笄之年
  - label: C
    content: 弱冠之年
  - label: D
    content: 強仕之年
- id: doc_113_高雄_獅甲_國文_g7s1e3_s1_21
  section: 1
  number: 21
  type: single
  page: 3
  stem: 「同義複詞」是由兩個字義相同或相近的單字所構成，如：粗糙。下列「 」中的詞語，哪一個是同義複詞？
  options:
  - label: A
    content: 我對故鄉有著一份深厚的「眷戀」
  - label: B
    content: 有些是過眼「雲煙」，倏忽即逝
  - label: C
    content: 我們所「得到」的，是真正的快樂
  - label: D
    content: 但她仍然平靜「和氣」地為孩子摺紙船
- id: doc_113_高雄_獅甲_國文_g7s1e3_s1_22
  section: 1
  number: 22
  type: single
  page: 3
  stem: 紙船印象：「在童年的無三尺浪的簷下水道航行」，其中「三」這個數目字並不是實指，而是代表「多」的虛數。下列何句「 」中的數字，何者是實數而不是虛數？
  options:
  - label: A
    content: 這件不愉快的事我早已拋往「九」霄雲外
  - label: B
    content: 同學「七」嘴「八」舌地爭相提出意見
  - label: C
    content: 諸葛亮終於被劉備「三」顧茅廬的真誠打動了
  - label: D
    content: 花園裡「百」花齊放，好不美麗。
  lesson_raw:
    title: 紙船印象
    basis: 題目引用紙船印象課文
