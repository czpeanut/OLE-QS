  section: 1
  number: 7
  type: single
  page: 1
  stem: 牛背上的呀喝一文中，「騎牛難下」一句模仿成語「騎虎難下」創造出幽默的情境，下列文句，何者也是以仿擬修辭寫成？
  options:
  - label: A
    content: 喝酒不開車，開車不喝酒
  - label: B
    content: 動完心臟手術的他，開心出院
  - label: C
    content: 小明移民非洲，從此過著非人生活
  - label: D
    content: 舉頭望明月，低頭吃便當
