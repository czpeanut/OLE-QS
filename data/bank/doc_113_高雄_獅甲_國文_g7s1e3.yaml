- id: doc_113_高雄_獅甲_國文_g7s1e3_s2_45
  section: 2
  number: 45
  type: single
  page: 6
  stem: 文中陸績懷藏橘子的事會被發現，是由於下列何種原因？
  options:
  - label: A
    content: 袁術家中的僕人當場目睹，予以告發
  - label: B
    content: 胸前鼓脹，身形怪異，而被當場識破
  - label: C
    content: 拜別袁術時，不小心從懷裡掉落出來
  - label: D
    content: 袁術對他的舉動，早已看得清清楚楚
  group_stem: '（三）

    陸績，其父康與袁術交好。績年六，於九江見袁術。術令人出橘食①之。績懷②三枚，臨行拜辭術，而橘墜地。術笑曰：「陸郎③作客而懷橘，何為耶？」績跪下對曰：「是④橘甘，欲懷而遺⑤母。」術曰：「陸郎幼而知孝，大必成才。」

    注：①食：音ㄙˋ，拿食物給人或牲畜吃。同「飼」。 ②懷：懷藏。 ③郎：對男子的美稱。 ④是：此。 ⑤遺：音ㄨㄟˋ，贈送、給予。(節錄三國志))'
