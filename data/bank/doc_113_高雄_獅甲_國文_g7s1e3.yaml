  options:
  - label: A
    content: 不義而富且貴，於我如浮雲
  - label: B
    content: 發憤忘食，樂以忘憂，不知老之將至云爾
  - label: C
    content: 知之為知之，不知為不知，是知也
  - label: D
    content: 君子病無能焉，不病人之不己知也
  lesson_raw:
    title: 論語選
    basis: 引用論語選課文
