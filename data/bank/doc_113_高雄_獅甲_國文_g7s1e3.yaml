  section: 1
  number: 2
  type: single
  page: 1
  stem: 摹仿事物或動作聲音的詞稱為「狀聲詞」。下列「 」中的狀聲詞，何者運用正確？
  options:
  - label: A
    content: 他自從「嗷嗷」墜地以後，便受到家人無微不至的呵護
  - label: B
    content: 不要擔心，只要背熟了，自然就能「喃喃」上口
  - label: C
    content: 聽著「 潺潺 」流水聲，這一切足以讓人流連忘返
  - label: D
    content: 颱風夜裡，風聲呼嘯而過，「淅瀝」作響
- id: doc_113_高雄_獅甲_國文_g7s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 「多少世事看來都容易，而一旦身歷其境，親身去體驗，才發覺其中各有竅門。」下列各選項何者意思與其最相近？
  options:
  - label: A
    content: 不經一事，不長一智
  - label: B
    content: 事非經過不知難
  - label: C
    content: 白首方悔讀書遲
  - label: D
    content: 書山有路勤為徑
- id: doc_113_高雄_獅甲_國文_g7s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 「和我們那一夥神色十分曖昧的夥伴（又愛又怕的德行），一齊護送我坐上牛背」其中「又愛又怕的德行」可用下列哪一句話來形容？
  options:
  - label: A
    content: 知其不可而為之
  - label: B
    content: 愛美不怕流鼻水
  - label: C
    content: 既期待又害怕受傷害
  - label: D
    content: 明知山有虎，偏向虎山行
  lesson_raw:
    title: 牛背上的呀喝
    basis: 引用課文原句
- id: doc_113_高雄_獅甲_國文_g7s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 下列有關「牛」的成語俗諺，何者使用恰當？
  options:
  - label: A
    content: 這兩件事情根本是「風馬牛不相及」，怎麼能夠混為一談呢
  - label: B
    content: 這點小事哪需要您親自出馬呢？「牛頭不對馬嘴」，放心地交給我來辦吧
  - label: C
    content: 他竟然可以四處向人誇耀，簡直是「庖丁解牛」
  - label: D
    content: 他費盡「汗牛充棟」之力才將這件麻煩事給徹底解決了，真是不容易
- id: doc_113_高雄_獅甲_國文_g7s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 「大夥兒去體驗一種新的生活，寓工作於娛樂，何況還可以騎牛！」一句與最接近下列哪一句俗諺？
  options:
  - label: A
    content: 飼鳥鼠，咬布袋
  - label: B
    content: 一兼二顧，摸蜊仔兼洗褲
  - label: C
    content: 麻雀雖小，五臟俱全
  - label: D
    content: 牛就是牛，牽到北京也是牛
  lesson_raw:
    title: 牛背上的呀喝
    basis: 引用課文原句
