- id: doc_113_高雄_獅甲_國文_g7s1e3_s2_48
  section: 2
  number: 48
  type: single
  page: 6
  stem: 作者閱讀金聖嘆的西廂記批語而拍案，「拍案」在此表示何意？
  options:
  - label: A
    content: 叫絕
  - label: B
    content: 憤怒
  - label: C
    content: 惋惜
  - label: D
    content: 悲嘆
  group_stem: '（四）

    明末清初的才子金聖嘆，在西廂記批語中，曾寫下膾炙人口的不亦快哉三十三則，其中有一則便是這樣的：「夏日於朱紅盤中，自拔快刀，切綠沉西瓜，不亦快哉！」

    流火的七月，偶然在案頭邂逅如此豪放不羈的名士，讀到這樣讓人拍案的文字，倒真有一種精神為之一振的暢適快感。

    注：①金聖嘆：明末長洲人，本姓張，名采。明亡，絕意仕進，為人狂傲而有奇氣，著西廂記評本。

    ②西廂記：元曲雜劇名，元 王實甫作。 ③膾炙人口：形容為人讚賞的詩文，或流行一時的事物。

    ④流火：農曆七月的別稱。 ⑤邂逅：音ㄒㄧㄝˋ ㄏㄡˋ，沒有事先約定而偶然相遇。

    〈陳幸蕙 快刀切西瓜〉'
