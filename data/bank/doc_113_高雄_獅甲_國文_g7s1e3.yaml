  section: 1
  number: 26
  type: single
  page: 3
  stem: 「杭州的桂花再香，還是比不得家鄉舊宅院子裡的金桂。」此句的意涵與下列何者相近？
  options:
  - label: A
    content: 老王賣瓜，自賣自誇
  - label: B
    content: 近鄉情更怯，不敢問來人
  - label: C
    content: 月是故鄉明，水是故鄉甜
  - label: D
    content: 人外有人，天外有天。
  lesson_raw:
    title: 故鄉的桂花雨
