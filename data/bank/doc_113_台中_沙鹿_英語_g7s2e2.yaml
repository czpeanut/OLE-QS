- id: doc_113_台中_沙鹿_英語_g7s2e2_s2_42
  section: 2
  number: 42
  type: single
  page: 2
  stem: Based on (根據) the reading, what is “Fast Fashion”?
  options:
  - label: A
    content: A kind of fashion that lasts for a long time.
  - label: B
    content: A way to make clothes fast and sell them cheaply.
  - label: C
    content: Clothes that use a lot of plastic materials.
  - label: D
    content: Clothes made by popular fashion companies.
  group_stem: 'Many people like to buy new clothes, but buying too many is a problem.
    In the UK, people now buy five times more clothes than before. Each person buys
    about 27 kilograms of clothes every year and throws them away quickly. This is
    because of fast fashion—making clothes quickly and selling them at low prices.
    Companies like Zara and Shein make new styles every week. This makes people want
    to buy more and more. However, fast fashion is not good for the Earth. Making
    clothes uses a lot of water and energy. Many clothes are made from plastic. Plastic
    doesn''t last long and makes the air dirty . Also, fast fashion is bad for workers.
    Many workers get little money and work in poor and unsafe places. In 2013, a building
    in Bangladesh fell down. Over 1,100 workers died, and many were hurt. To solve
    this problem, we can do the following things: First, buy fewer clothes and choose
    ones that last longer. Second, buy second-hand clothes—clothes that were used
    by others. Third, fix old clothes. For example, turn old pants into shorts. These
    small actions can help the Earth and workers. If we all try, we can make fashion
    better for the Earth and for people.

     company 公司；last 持續；plastic 塑膠；building 建築物'
