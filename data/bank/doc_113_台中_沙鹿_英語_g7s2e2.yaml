    content: News that people share because they like it a lot.
  group_stem: 'Lily loves reading news online. One day, she finds a shocking story
    about her favorite singer. The news says, “The popular singer never sings in the
    future!” Lily feels sad and asks, “Is this true? I have never gone to his concert.”
    She is unsure if the news is real or fake. Then, she remembers what her teacher
    taught her about fake news. Fake news can look real, but it is often wrong. Some
    people make fake news to get more views or hurt others. Fake news spreads quickly
    because people share it without checking if it is true. Lily searches for the
    same news on other websites but finds nothing. Then, she uses the Taiwan Fact
    Check Center''s website to check the news. It says, “The news is FAKE!” Lily is
    happy that she checked the facts. From that day on, Lily always checks the facts
    before believing anything online. She is now more careful when reading news and
    always tries to find the truth.

     shocking 令人震驚的 if 是否 spread 蔓延 website 網站 search 搜尋'
