  - label: C
    content: 若端午節沒有應景吃到粽子，可能會受到強制性處罰
  - label: D
    content: 在傳統的華人社會中，過端午節屬於一種主流文化。
  group_stem: '❏請依照下列資料，回答48 ~ 50 題：

    端午節將至，許多民眾不惜犧牲寶貴的時間，也要排隊購買粽子，感受節慶氣氛。其實，端午節吃粽子的習慣源自古人為紀念屈原而投入江中的米食，經過長時間的演變與流傳，逐漸成為端午節的飲食文化。

    然而，隨著時代變遷，業者開始推陳出新，將冰淇淋、珍珠、麻糬、起司等多元元素融入粽子當中，推出創意口味與外型的新式粽子，吸引年輕族群的目光。除了口味上的創新，也有業者推出單顆小份量、外送包裝或環保設計等新型態的粽子，顯示出傳統文化也會隨社會變遷與需求調整與演化。'
