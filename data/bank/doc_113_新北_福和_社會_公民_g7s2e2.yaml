  section: 2
  number: 43
  type: single
  page: 2
  stem: 請問關於網友紛紛使用ChatGPT 生成圖片的現象，下列敘述何者正確？(L3)
  options:
  - label: A
    content: 民眾跟風現象體現出文化普遍性
  - label: B
    content: 圖片生成技術與文化累積性相關
  - label: C
    content: 使用者不須留意相關的法律責任
  - label: D
    content: 吉卜力生成圖片已成為主流文化。
  group_stem: '❏ 請依照下列資料，回答43 ~ 44 題：

    OpenAI 日前推出最新「吉卜力風格的生成圖像功能」，引發全球熱議，網友紛紛使用ChatGPT 來生成照片，取代過去傳統的手工繪圖，在社群平台掀起一波「吉卜力」熱潮。然而，此波熱潮也引來外界對於AI
    著作權爭議的再度關注，質疑OpenAI 是否涉及侵權，以及用來訓練AI 的圖源是否合法等等問題。

    其實，根據《著作權法》第10-1 條，法律保護的是「具體的表達」，抽象的「風格」或「概念」則不受保護。然而如果是用AI 生成「湯婆婆」或其他吉卜力角色的圖，那情況就不同了。因為這些角色是「具體創作成果」，是受到著作權保護，也屬於知名的智慧財產權，這時若未經授權使用，可能就會涉及侵權，或因違反著作權法而面臨相當的罰款處分。'
