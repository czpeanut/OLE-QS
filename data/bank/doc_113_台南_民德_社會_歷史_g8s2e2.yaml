  stem: 美國總統羅斯福曾發表一篇演說，當中提到：「西元1941 年12 月7 日，美利堅合眾國遭到了日本帝國海、空軍預謀的突然襲擊，........不論要用多長的時間才能戰勝這次預謀的侵略，美國人民興正義之師必將贏得澈底勝利。……」羅斯福發表此演說的背景為何？
