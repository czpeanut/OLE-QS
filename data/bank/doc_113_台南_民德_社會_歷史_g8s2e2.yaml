  type: single
  page: 1
  stem: 末代皇帝溥儀一生中曾經三次登基，第一次是三歲時被慈禧太后指定，第二次糊里糊塗被軍閥拱上皇位復辟，第三次根據他的自述是遭受外國人所矇騙。在第三次當皇帝的期間，溥儀自述，一開始他希望能讓祖先的故鄉成為更好的地方，沒想到自己最後成為外國人壓榨東北人的遮羞布。請問矇騙溥儀的外國人應該是下列何者？
  options:
  - label: A
    content: 日本
  - label: B
    content: 蘇聯
  - label: C
    content: 英國
  - label: D
    content: 法國。
