  stem: 孫中山先生著有《建國大綱》一書，他將中華民國的建設分為軍政、訓政、憲政三個時期，在還沒有正式制定憲法之前，先訓練人民民主政治的觀念，並實行地方自治。等制定憲法保障人民權利後，始可進入憲政時期。請問中華民國在何時才正式從訓政進入憲政？
