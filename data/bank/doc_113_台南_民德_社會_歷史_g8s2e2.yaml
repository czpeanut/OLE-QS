  type: single
  page: 1
  stem: 台北故宮博物院是外國觀光客來台必去的景點之一，一年接待超過600 多萬次的參訪旅客。關於台北故宮成立的背景，主要是中華民國政府遷台時，將北京故宮博物院帶走大量的文物與珍貴文化資產一併運抵台灣，後在台北市士林區修建故宮博物館，以展示這些珍貴的文化寶藏。請問北京故宮文物是因為哪場戰事而決定被運到台灣保存？
