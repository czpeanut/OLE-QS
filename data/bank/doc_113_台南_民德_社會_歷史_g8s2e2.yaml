- id: doc_113_台南_民德_社會_歷史_g8s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 小明在歷史書籍中看到一段話：「民國 20 年日軍自行炸毀瀋陽附近的一段鐵路，然後藉口是中國軍隊所為，立即發兵進占東北。由此可知日本對中國的侵略野心。」根據上述內容，下列敘述何者正確？
  options:
  - label: A
    content: 此一事件被稱為一二八事變
  - label: B
    content: 日本在清末甲午戰爭後將東北納入其勢力範圍
  - label: C
    content: 此事件開啟了中國全面抗日的序幕
  - label: D
    content: 當時國民政府的策略是「攘外必先安內」故未多加抵抗。
