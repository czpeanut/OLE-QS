- id: doc_113_台南_民德_社會_歷史_g8s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 二戰期間有一場會議在舉行之後，發布了一份公報，大概內容是：「三大盟國此次進行戰爭之目的，在於制止及懲罰日本侵略。三國決不為自身圖利，亦無拓展領土之意。三國之宗旨在剝奪日本自1914
    年第一次世界大戰開始以後在太平洋所奪得或占得之一切島嶼，在使日本所竊取于中國之領土，如東北、臺灣、澎湖，歸還中華民國。」根據上文，下列敘述何者正確？
  options:
  - label: A
    content: 三大盟國指的是美國、英國、蘇聯
  - label: B
    content: 此份公報是在雅爾達所簽署的
  - label: C
    content: 此會議召開的目的是為了爭取蘇聯對日宣戰
  - label: D
    content: 公報發布的時間是民國32 年。
