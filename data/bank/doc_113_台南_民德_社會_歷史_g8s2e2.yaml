  page: 2
  stem: 民國 17 年至民國 26 年之間，被二戰期間中國戰區美軍參謀長魏德邁譽為「黃金十年」，顯然這個時期的改變對於中國日後的發展具有重要的影響。請問下列提及的史事，何者是發生於此時期？
