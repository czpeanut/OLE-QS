  stem: 西元1842 年中英簽訂《南京條約》，條約部分原文：「前第二條內言明開關俾英國商民居住通商之廣州等五處，應納進口、出口貨稅、餉費，均宜秉公議定則例，由部頒發曉示，以便英商按例交納；今又議定，英國貨物自在某港按例納稅後，即准由中國商人遍運天下，而路所經過稅關不得加重稅例，只可按估價則例若干，每兩加稅不過分。」也就是說英國對中國貿易的關稅不是依照其主權，而是根據條約規定來徵收關稅。請問這個協定關稅到什麼時候結束？
