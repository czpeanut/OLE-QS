  stem: 中日戰爭初期，日本可動員的總兵力高達480 萬人，中國現役官兵號稱170 萬，但無後備兵員。就海軍言，日本為當時世界三大海軍國之一，艦艇約190 餘萬噸，中國海軍尚不及日本三十二分之一。因雙方兵力相差懸殊，所以當時雙方制定何種戰略？
