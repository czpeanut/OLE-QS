  stem: 西元 1949 年10 月1 日，中共在北京舉行開國大典，宣告中華人民共和國成立。同時這也意味著國民政府在國共內戰失敗，後來撤退來台。請問下列何者是中共贏得勝利的原因？
    (甲)依照開羅會議的決議蘇聯接收東北，戰後將所獲武器授與中共 (乙)美國轉向支持中共，提供金援，造成局勢逆轉 (丙)國民政府無法遏止通貨膨脹，以致大失民心
    (丁)中共在八年抗戰時期擴張勢力
