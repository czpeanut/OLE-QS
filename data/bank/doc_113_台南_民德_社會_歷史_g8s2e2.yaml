- id: doc_113_台南_民德_社會_歷史_g8s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 以下是中國天津某年慶祝元旦的相關報導：「政府要求各機關及各民眾團體，在元旦上午參加慶祝中華民國成立的紀念大會。當晚民眾提燈遍遊街市，高呼『勿忘國恥』、『抵制日貨』、『攘外必先安內』、『打倒燒香化紙、磕頭拜年的惡習』等口號。各街市商號張貼標語、懸燈結綵，國民黨黨旗和國旗飄揚天際，蔚為盛況。」上述內容最可能是描繪下列何時的景象？
  options:
  - label: A
    content: 1858~1860 英法聯軍期間
  - label: B
    content: 1911 年四川省保路運動期間
  - label: C
    content: 1913 年國民黨發動二次革命期間
  - label: D
    content: 1928～1937 年十年建設期間。
