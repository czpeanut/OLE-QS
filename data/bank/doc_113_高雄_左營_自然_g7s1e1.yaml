- id: doc_113_高雄_左營_自然_g7s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 小茜上課時恍神寫了一段有關”細胞”的筆記，請問下列哪一段是正確的敘述？
  options:
  - label: A
    content: 植物細胞皆有細胞壁和葉綠體，而動物細胞則缺乏此兩者
  - label: B
    content: 在洋蔥表皮細胞及鴨跖草保衛細胞中，都可觀察到綠色的顆粒
  - label: C
    content: 植物細胞的排列通常比動物細胞規則，主要因為植物細胞具有細胞壁
  - label: D
    content: 動、植物細胞皆含有粒線體，但只有植物細胞有液泡。
- id: doc_113_高雄_左營_自然_g7s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 附圖為人類的神經細胞，甲、乙、丙為細胞的構造，關於此細胞的說明，下列敘述何者正確？
  options:
  - label: A
    content: 甲為葉綠體，可以產生能量供應細胞利用
  - label: B
    content: 乙為細胞壁，可以控制物質進出細胞
  - label: C
    content: 丙為大型液泡，可以用來儲存養分或廢物
  - label: D
    content: 該細胞有很多突起構造，功用是傳遞訊息
  assets:
  - key: s1_6_f1
    kind: figure
    file: doc_113_高雄_左營_自然_g7s1e1/s1_6_f1.png
