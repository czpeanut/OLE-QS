- id: doc_113_高雄_左營_自然_g7s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 如附圖所示，晶子取了三支試管，分別加入2mL 的澱粉液和唾液，並將三支試管放入0℃、37℃和98℃的水中，靜置一小時後進行檢測。有關檢測的相關敘述，下列何者正確？
  options:
  - label: A
    content: 若利用碘液進行檢測，甲、丙管會呈淡藍色
  - label: B
    content: 若利用本氏液進行隔水加熱檢測，甲、丙管會呈紅色
  - label: C
    content: 若利用碘液進行檢測，乙管可能呈黃褐色
  - label: D
    content: 若利用本氏液進行隔水加熱檢測，乙管會呈藍黑色
  assets:
  - key: s1_1_f1
    kind: figure
    file: doc_113_高雄_左營_自然_g7s1e1/s1_1_f1.png
- id: doc_113_高雄_左營_自然_g7s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 佛來明培養細菌時，不慎在培養基上汙染了青黴菌，他發現青黴菌愈長面積愈大，而細菌的生長面積愈來愈小，他推測可能青黴菌產生某種物質，將細菌殺死。後來實驗證明他的推測是正確的，因而發現了抗生素─青黴素。佛來明的這種推測，在科學研究歷程是屬於哪個步驟？
  options:
  - label: A
    content: 觀察
  - label: B
    content: 參考文獻資料
  - label: C
    content: 提出假說
  - label: D
    content: 分析實驗結果。
- id: doc_113_高雄_左營_自然_g7s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '小哲想研究”土壤種類對豬籠草的生長有何影響”。

    則如右表的各項實驗設計中，哪一組最符合小哲的研究？


    | 組別 | 編號 | 土壤種類 | 光線 | 澆水量（mL／6hr） |

    | --- | --- | --- | --- | --- |

    | 甲 | 1 | 蛇木屑 | 照光 | 30 |

    | 甲 | 2 | 泥炭土 | 照光 | 60 |

    | 乙 | 1 | 蛇木屑 | 照光 | 30 |

    | 乙 | 2 | 蛇木屑 | 不照光 | 60 |

    | 丙 | 1 | 泥炭土 | 照光 | 60 |

    | 丙 | 2 | 蛇木屑 | 照光 | 60 |

    | 丁 | 1 | 泥炭土 | 照光 | 30 |

    | 丁 | 2 | 泥炭土 | 照光 | 60 |'
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
