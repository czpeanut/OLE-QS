  group_stem: '█請閱讀下列敘述後，回答下列問題：

    為了探討「所有花都會吸引蝴蝶來訪花吸蜜嗎？」農業部林業試驗所研究人員投入超過 10 年的時間，在恆春和六龜試驗林區累積超過 2500 多筆的調查資料，總共記錄提供蝶類蜜源的植物有
    44 科 99 種，而訪花的蝶類有 5 科 93 種。

    從調查開花植物如何吸引蝶類的結果發現：蝴蝶喜歡雙子葉植物占 97.8％，單子葉植物只占 2.2％。而蝴蝶對於花顏色的喜歡程度也不同，統計結果如表：


    | 花朵顏色 | |

    | :--- | :--- |

    | 淺色（白色、黃綠色） | 53.50％ |

    | 鮮豔色（如橘、紅色） | 22.20％ |

