  section: 1
  number: 47
  type: single
  page: 6
  stem: Anisogoniume legans 是小龍鑑定出的植物，由你認知判斷該植物與過溝菜蕨的物種關係應為？
  options:
  - label: A
    content: 同種不同屬
  - label: B
    content: 同界不同綱
  - label: C
    content: 不同屬不同種
  - label: D
    content: 同屬不同種
  group_stem: '█過溝菜蕨為蕨菜之一，屬蹄蓋蕨科過溝菜蕨屬宿根性草本植物，學名Anisogoniume sculentum，俗稱過山貓、過溝菜、過貓菜、蕨菜、蕨貓或山鳳尾等。臺灣以南投縣
    草屯、魚池、水里、國姓、信義及臺東縣、花蓮縣等地栽培最多。全年均可生產，主要在5～10 月盛夏期產量最高。過溝菜蕨一般生長於陰溼、水多的溝邊、厝邊等陰涼地點，當嫩芽尚未展開或稍展開而葉柄尚易折取時，其莖葉細嫩翠綠，纖維少，品質佳，烹調法以炒食、煮食為主，為一道健康美味鄉土野菜。

    過溝菜蕨的根莖木質呈深紫色，枝葉叢生其上，葉柄剛硬，枝達50 公分左右，葉片形態隨植株成長而改變，幼小時為一回羽狀複葉，成長期變為二回，成株則為三回羽狀複葉，小羽片長約5～15
