- id: doc_113_台南_民德_社會_公民_g7s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 安安的外公是客家人，從小到大幾乎都是以客語與人溝通，若以其他語言（如：臺語、國語）溝通則不太流利，也常出現詞不達意的現象，因此可收看的電視台節目選擇性自然也就少了許多。針對這樣的少數族群讀現象，有學者提出若沒有改善現狀，除了損及使用少數族群母語者們的權益，更可能會使其母語逐漸消失。以下的解決方式中，何者較為恰當？
  options:
  - label: A
    content: 為了保護少數族群的母語，改由少數族群來擔任製作人
  - label: B
    content: 規定少數族群電視台（如：原民臺、客語台）需全時段說母語
  - label: C
    content: 鼓勵一般電視台多製作多元語言的節目
  - label: D
    content: 政府立法規定節目參演者們都需以母語錄製節目。
