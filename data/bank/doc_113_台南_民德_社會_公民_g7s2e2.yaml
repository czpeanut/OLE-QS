  stem: 1946 年時政府設立「臺灣省國語推行委員會」來推行國語運動，並以標題「愛國說國語」、「請說國語」等大型看板宣傳，彼時臺語、客語以及原住民語甚至被污名化，許多人的母語都變成國語，而不會講自己族群的語言。直至解嚴後，隨著民主化與本土化的浪潮，國語運動才告結束；然而，屬於自己的傳統母語卻仍式微。從先前的國語運動，我們看到了什麼現象？
