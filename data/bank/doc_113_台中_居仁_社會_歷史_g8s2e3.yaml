- id: doc_113_台中_居仁_社會_歷史_g8s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '空軍上將趙知遠在回憶越戰時提到：「當時由胡志明帶領

    的越共在中共強力援助下，兵力與武器已不亞於美軍；同

    一時間，美國民間反戰情緒高漲，胡志明利用這個弱點，

    在國際間故意製造北越的弱勢形象，引發國際同情譴責美

    軍，終於達到停戰目的。」關於這段回憶錄的內容，下列

    何者正確？'
  options:
  - label: A
    content: '胡志明所帶領的越共是以西貢為中心的

      南越政權'
  - label: B
    content: '在美軍介入越戰之前，英國也曾介入南北越

      的紛爭'
  - label: C
    content: '胡志明所領導的越共是以清剿藏匿於叢林中

      的美軍的方式作戰'
  - label: D
    content: '美軍的撤退是在尼克森總統的時

      代'
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 6-1
      title: 冷戰時期的東亞
      chapter: 第6章 當代東亞的局勢
    textbook: 八下歷史 6-1 冷戰時期的東亞
    labeled_by: ai
- id: doc_113_台中_居仁_社會_歷史_g8s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '以下是幾位人物對韓戰的看法：

    甲：未料到美國海空力量也加入作戰，認為在美國不干

    涉前提下，可靠己力一統朝鮮半島。

    乙：對北韓、中共力量估算過低，不僅要收復失土，還

    要越過38 度線，解決共產勢力。

    丙：抱持脣亡齒寒觀念，只要盟軍一越過38 度線，無論

    是否到達鴨綠江(中韓邊界)，便須參與戰爭。

    甲、乙、丙、人物分別最有可能為？'
  options:
  - label: A
    content: '北韓金日成、

      美國麥克阿瑟、中國毛澤東'
  - label: B
    content: '美國麥克阿瑟、北韓金

      日成、中國毛澤東'
  - label: C
    content: '北韓金日成、美國麥克阿瑟、蘇

      聯史達林'
  - label: D
    content: 中國毛澤東、美國麥克阿瑟、蘇聯史達林
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 6-1
      title: 冷戰時期的東亞
      chapter: 第6章 當代東亞的局勢
    textbook: 八下歷史 6-1 冷戰時期的東亞
    labeled_by: ai
- id: doc_113_台中_居仁_社會_歷史_g8s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '「某個事件」震驚了世界輿論，歐美各國同聲譴責，並

    實行經濟制裁。一時之間前往該國的觀光客門口羅雀，

    富裕國家的銀行團代表或私人企業也拒絕前來，但該國

    領導人仍再三強調，我國絕對不會再退回到鎖國時期，

    要繼續改革開放。有關這段話的理解，下列何者正確？'
  options:
  - label: A
    content: 這個事件指的文化大革命
  - label: B
    content: '題幹所指的時間是

      2001 年'
  - label: C
    content: 題幹所指的領導人為鄧小平
  - label: D
    content: '此事件後

      開始在東南沿海設立經濟特區，吸引外資'
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 5-3
      title: 改革開放至今
      chapter: 第5章 共黨政權在中國
    textbook: 八下歷史 5-3 改革開放至今
    labeled_by: ai
- id: doc_113_台中_居仁_社會_歷史_g8s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '1979 年，鄧小平發表「堅持四項基本原則」的重要講

    話。請問：下列何者是鄧小平宣布後所推動的政策？'
  options:
  - label: A
    content: 奉行毛澤東的經濟政策
  - label: B
    content: 穩固共產黨領導
  - label: C
    content: '推動

      人民公社'
  - label: D
    content: 給予私營企業更多自主權
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 5-3
      title: 改革開放至今
      chapter: 第5章 共黨政權在中國
    textbook: 八下歷史 5-3 改革開放至今
    labeled_by: ai
- id: doc_113_台中_居仁_社會_歷史_g8s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '第二次世界大戰後，美國在亞洲先後參與了韓戰與越

    戰。有關這兩場戰役的比較，下列敘述何者正確？'
  options:
  - label: A
    content: 皆因抵抗中國共產黨的崛起而引起
  - label: B
    content: '韓戰時美國承認

      失敗而撤軍，越戰則成功抵禦共產勢力的擴張'
  - label: C
    content: '這兩

      次戰爭皆曾動用聯合國軍隊的力量'
  - label: D
    content: '這兩次戰爭皆與

      共產勢力的擴張有關'
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 6-1
      title: 冷戰時期的東亞
      chapter: 第6章 當代東亞的局勢
    textbook: 八下歷史 6-1 冷戰時期的東亞
    labeled_by: ai
- id: doc_113_台中_居仁_社會_歷史_g8s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: '1970 年代，一位美國總統將出訪非邦交國時，表示：

    這是一趟哲學發現之旅，充滿危險與不確定性，有如歷

    史上的那趟發現之旅。故特稱此行為「馬可‧波羅2 號」。

    這位總統是：'
  options:
  - label: A
    content: 訪問埃及的羅斯福總統
  - label: B
    content: '訪問臺灣

      的艾森豪總統'
  - label: C
    content: 訪問中國的尼克森總統
  - label: D
    content: '訪問蘇聯

      的卡特總統'
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 6-1
      title: 冷戰時期的東亞
      chapter: 第6章 當代東亞的局勢
    textbook: 八下歷史 6-1 冷戰時期的東亞
    labeled_by: ai
- id: doc_113_台中_居仁_社會_歷史_g8s2e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: '某劇中以一對喪母的小兄妹身處交戰雙方火線的鄉間起

    始，因妹妹不經意的唱出敵方充滿共產意識的歌曲，導

    致父親被活活打死；兩人也輾轉成為戰時孤兒合唱團中

    的一員，在美軍、聯合國部隊等官兵面前獻唱，屢獲好

    評，但後來哥哥仍在一次演出後為敵軍發現不幸被殺。

    下列敘述何者符合該劇背景？'
  options:
  - label: A
    content: '這場戰爭發生在1960

      年代'
  - label: B
    content: 因交戰的雙方地理位置相接壤，故為越戰
  - label: C
    content: 由於獻唱給美軍及聯合國部隊，所以是韓戰
  - label: D
    content: '交戰雙

      方應為越南民主共和國和越南共和國'
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 6-1
      title: 冷戰時期的東亞
      chapter: 第6章 當代東亞的局勢
    textbook: 八下歷史 6-1 冷戰時期的東亞
    labeled_by: ai
- id: doc_113_台中_居仁_社會_歷史_g8s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: '「……鄧小平不久前才宣布他將辭去最後一個職位——

    軍事委員會主席，完全退休。然而出乎全世界意料之

    外，他突然調動幾十萬軍隊包圍了自己統治下的首都北

    京，在圍城部隊與北京民眾對峙半個月後，他下令步兵

    與坦克於指定時刻強行行動，導致成千無辜民眾慘遭屠

    殺。」請問：學生為何聚集在北京？'
  options:
  - label: A
    content: '胡耀邦過世，

      大學生以悼念為名義，演變成要求民主、改革開放的運

      動'
  - label: B
    content: '胡耀邦因為思想較開放，被迫下臺，學生反彈，

      為胡耀邦請命'
  - label: C
    content: '民運人士「坦克人」被捕，學生抗

      議，並公開提倡民主與人權'
  - label: D
    content: '國際人權日，學生提倡

      民主與政治改革，引起政府不悅'
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 5-3
      title: 改革開放至今
      chapter: 第5章 共黨政權在中國
    textbook: 八下歷史 5-3 改革開放至今
    labeled_by: ai
- id: doc_113_台中_居仁_社會_歷史_g8s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: '1972 年，美國總統訪問中國。並聯合發表了《上海公

    報》：「美國認識到，在臺灣海峽兩岸的中國人都認為只

    有一個中國，臺灣是中國的一部分。美國政府對此一立

    場不提出異議，並重申中國人自己和平解決臺灣問題。

    在此期間，美國將隨著兩岸緊張局勢的緩和，逐步減少

    它在臺灣的武裝力量和軍事設施。」請問：下列關於此

    公報的敘述何者正確？'
  options:
  - label: A
    content: '簽署此一公報的是美國總統

      卡特，隨後他便宣布與臺灣斷絕外交關係'
  - label: B
    content: '隔年鄧小

      平便訪問美國，成為第一個訪美的中共領導人'
  - label: C
    content: '美國

      為了結束韓戰才與中國簽訂公報'
  - label: D
    content: '此公報使美國之後

      對臺灣外交政策逐漸轉變為「斷交、廢約、撤軍」'
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 6-1
      title: 冷戰時期的東亞
      chapter: 第6章 當代東亞的局勢
    textbook: 八下歷史 6-1 冷戰時期的東亞
    labeled_by: ai
- id: doc_113_台中_居仁_社會_歷史_g8s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: '中共建國初期在外交上對蘇聯採取「親蘇」政策，但自

    1950 年代後，雙方關係開始漸行漸遠，甚至惡化。關於

    中蘇雙方1940-1970 年代的關係變化，以下何者敘述有

    誤？'
  options:
  - label: A
    content: '韓戰期間，中蘇兩國在共同戰略目標下，形成

      了緊密的盟友關係'
  - label: B
    content: 兩國曾在邊界發生軍事衝突
  - label: C
    content: 1960 年代越戰的爆發讓中國與蘇聯徹底決裂
  - label: D
    content: '中

      共為了制蘇而聯美，於1979 年與美國建交'
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 6-1
      title: 冷戰時期的東亞
      chapter: 第6章 當代東亞的局勢
    textbook: 八下歷史 6-1 冷戰時期的東亞
    labeled_by: ai
- id: doc_113_台中_居仁_社會_歷史_g8s2e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: '中共非常擅長將政治路線以平易好記誦的口號表現，以

    達宣傳、動員的效果如：(甲)破四舊、立四新；(乙)超英

    趕美；(丙)抗美援朝、保衛家園；(丁)發展是硬道理。請

    問上述四個口號出現的先後順序，下列何者正確？'
  options:
  - label: A
    content: 丙乙丁甲
  - label: B
    content: 丙丁乙甲
  - label: C
    content: 丙乙甲丁
  - label: D
    content: 丙甲乙丁
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 5-2
      title: 文化大革命
      chapter: 第5章 共黨政權在中國
