    labeled_by: ai
- id: doc_113_台中_居仁_社會_歷史_g8s2e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: '1980 年，珠海還是一個普通的小縣城，至1990 年

    代，珠海發展成現代化城市，獲得聯合國「國際改善人

    居環境最佳範例獎」。請問：珠海快速發展的主要原因為

    何？'
  options:
  - label: A
    content: 瀕臨海岸
  - label: B
    content: 政策支持
  - label: C
    content: 科技進步
  - label: D
    content: '資

      源豐富'
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 5-3
      title: 改革開放至今
      chapter: 第5章 共黨政權在中國
    textbook: 八下歷史 5-3 改革開放至今
    labeled_by: ai
- id: doc_113_台中_居仁_社會_歷史_g8s2e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: '在二戰結束後，東亞與東南亞國家紛紛成為共產主義國

    家，但幾經波折，有些國家學習中國進行經濟改革開

    放、設置經濟特區，但在政治上仍以共產主義為國家主

    要意識形態；也有些國家放棄共產主義，走向民主自由

    與資本主義社會發展。請問下列哪一國家屬於前者的描

    述？'
  options:
  - label: A
    content: 寮國
  - label: B
    content: 菲律賓
  - label: C
    content: 越南
  - label: D
    content: 泰國
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 6-2
      title: 東南亞國際組織的蛻變
      chapter: 第6章 當代東亞的局勢
    textbook: 八下歷史 6-2 東南亞國際組織的蛻變
    labeled_by: ai
- id: doc_113_台中_居仁_社會_歷史_g8s2e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: '五十多年前，中國與蘇聯在邊界爆發軍事衝突，頓時兩

    國國內的輿論相互指責，關於此軍事衝突事件的起因為

    下列何者？'
  options:
  - label: A
    content: 中認為蘇企圖控制中國的內政和外交
  - label: B
    content: 中、美關係熱絡引起蘇聯不滿
  - label: C
    content: '中蘇對於越戰的想

      法不同'
  - label: D
    content: 中國因為改革開放而與蘇聯產生了分歧
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 6-1
      title: 冷戰時期的東亞
      chapter: 第6章 當代東亞的局勢
