  stem: 春秋時期的哲人孔子，曾經在回答學生的問題時說：「克己復禮為仁。一日克己復禮，天下歸仁焉。」其大意是指：只要能克制自己的私欲，使言行舉止合乎禮節，就是實踐仁道的善政。由這點來看，孔子其實是希望恢復周朝固有的何種制度？
