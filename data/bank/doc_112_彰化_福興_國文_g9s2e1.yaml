  stem: 根據上文，下列敘述何者正確？
  options:
  - label: A
    content: 信遠齋的酸梅湯，讓人含在嘴裡捨不得吞
  - label: B
    content: 信遠齋的冰塊皆自製，因此酸梅湯較乾淨
  - label: C
    content: 「冰碗」的做法，是先把食物放在冰塊下
  - label: D
    content: 信遠齋的糖葫蘆，每一串都是碩大飽滿
  group_stem: '北平的冰是從什剎海或護城河挖取藏在窖內的，冰塊裡可以看見草皮木屑，泥沙穢物更不能免，是不能放在飲料中喝的。什剎海會賢堂的名件「冰碗」，將蓮子、桃仁、杏仁、菱角、藕都放在冰塊上，食客不嫌其髒，真是不可思議。有人甚至把冰塊放在酸梅湯裡！

    　　信遠齋的冰鎮就高明多了。進門右手方有黑漆大木桶，內有一大白瓷罐，罐外周圍全是碎冰，罐裡是酸梅湯。因為桶大罐小冰多，喝起來涼沁脾胃。他的成功祕訣是冰糖多、梅汁稠、水少。上口冰涼，甜酸適度，含在嘴裡捨不得下嚥。

    　　信遠齋也賣蜜餞，但以糖葫蘆最出色。材料種類甚多，以山裡紅（山楂）為正宗，薄薄一層糖，透明雪亮。一般糖葫蘆皆用竹籤串起，街頭小販所售，多染塵沙。可信遠齋不用竹籤，每一顆均單個獨立，所用皆碩大無疵，而且乾淨，放在墊了油紙的紙盒中由客攜去。

    （改寫自梁實秋 酸梅湯與糖葫蘆）'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
