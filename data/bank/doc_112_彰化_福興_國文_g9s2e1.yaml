  - label: D
    content: 本文敘事聚焦於作者與朋友騎馬遊春之舉
  group_stem: '雨後遊六橋記　　袁宏道

    　　寒食後雨，予曰：「此雨為西湖洗紅，當急與桃花作別，勿滯也。」午霽，偕諸友至第三橋，落花積地寸餘，遊人少，翻以為快。忽騎者白紈而過，光晃衣，鮮麗倍常，諸友白其內者皆去表。少倦，臥地上飲，以面受花，多者浮，少者歌，以為樂。偶艇子出花間，呼之，乃寺僧載茶來者。各啜一杯，蕩舟浩歌而返。'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
