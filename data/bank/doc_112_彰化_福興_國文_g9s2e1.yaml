- id: doc_112_彰化_福興_國文_g9s2e1_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 下列文句中，何者是依照「由近而遠」的寫作手法來描寫景物？
  options:
  - label: A
    content: 湖邊山上，青一塊，紫一塊，綠一塊，樹枝上都像水洗過一番的，尤其綠得可愛。湖裡有十來枝荷花，苞子上清水滴滴，荷葉上水珠滾來滾去
  - label: B
    content: 夏日海邊，沙灘上充滿喧鬧的人聲笑語，遙望海面，點點小船航行在廣闊的海面上
  - label: C
    content: 於是，像一朵雲似的，我飄到密西西比河的曼城，飄到綠色如海的小的大學來。校園的四圍是綠油的大樹，校園的中央是澄明的小池，池旁有一聖母的白色石雕，池裡有個聖母的倒影
  - label: D
    content: 校園裡的烏桕樹，在紅葉落後，還有雪白的柏子著在枝頭，一點一叢，用照相機照將出來，可以亂梅花之真
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_112_彰化_福興_國文_g9s2e1_s1_22
  section: 1
  number: 22
  type: single
  page: 2
