  number: 20
  type: single
  page: 2
  stem: 「我已在佛前 求了五百年／求祂讓我們結一段塵緣」是誇飾句，與下列何者的修辭不相同？
  options:
  - label: A
    content: 午睡時，他的鼾聲如雷，連隔壁棟的同學都被吵得睡不著
  - label: B
    content: 詩是一隻能言鳥，要能唱出永遠活在人們心裡的聲音
  - label: C
    content: 每逢上游有人痛哭，眼淚落在水裡，下游的水就喧嘩
  - label: D
    content: 我做的獅子頭有時可以當棒球，扔過牆還會蹦三蹦
