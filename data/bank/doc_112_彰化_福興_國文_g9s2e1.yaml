  stem: 根據上文，下列敘述何者正確？
  options:
  - label: A
    content: 「西湖洗紅」意謂西湖雨後的花更顯嬌豔
  - label: B
    content: 本文寫景著重於對湖邊景物和光影的描寫
  - label: C
