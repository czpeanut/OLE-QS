- id: doc_112_彰化_福興_國文_g9s2e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 「忘憂草，含笑花，勸君聞早冠宜掛，那裡也能言陸賈，那裡也良謀子牙，那裡也豪氣張華。千古是非心，一夕漁樵話。」曲中所呈現「閒適自得，歸隱出世」的心境近於下列何者？
  options:
  - label: A
    content: 富貴功名，半由人事、半由天命；唯讀書做人，全憑自己
  - label: B
    content: 他們的過人之處愈多，他們愈認識到他們的不足
  - label: C
    content: 爭強與好勝之心在思想的碰撞中可以啟動智慧而集思廣益，但也偏見向真理低頭的死敵
  - label: D
    content: 人世榮華，如飄風過耳，殊不可恃，一切所有，皆如寄耳
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_112_彰化_福興_國文_g9s2e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 國中生小新經常渾噩度日，覺得所有事都可以「明天再說」。請問下列哪句話，最適合用來勉勵他？
  options:
  - label: A
    content: 莫倚兒童輕歲月，丈人曾共爾同年
  - label: B
    content: 水至清則無魚，人至察則無徒
  - label: C
    content: 寧可枝頭抱香死，何曾吹落北風中
  - label: D
    content: 若無閒事掛心頭，便是人間好時節
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_112_彰化_福興_國文_g9s2e1_s1_20
