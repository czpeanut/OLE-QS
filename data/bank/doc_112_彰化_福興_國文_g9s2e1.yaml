- id: doc_112_彰化_福興_國文_g9s2e1_s1_33
  section: 1
  number: 33
  type: single
  page: 4
  stem: 根據上文，下列何者不是呂弘暉老師所認為未來劇場的樣貌和元素？
  options:
  - label: A
    content: 滿足生活需求
  - label: B
    content: 力求精緻小眾化
  - label: C
    content: 融入在生活情境之中
  - label: D
    content: 增加人與人之間的互動交流
  group_stem: '常站在劇場圈外人角色思考的呂弘暉老師，一次元宵節在高雄旗津欣賞廟口野臺戲的機會，讓他赫然發現表演藝術完全融入生活之中的經驗就在身邊。沒有進入劇場看戲的穿著、飲食、購票門檻，老人、大人、小孩就這麼聚集在戲臺前，有的認真看戲，有的喝茶聊天，看戲之餘可以到旁邊攤販啃大蒜、嗑香腸。一整條路上好幾間廟，每間廟的野臺戲都有人青睞欣賞，臺下觀眾就這麼走過、路過，卻沒有錯過。

    　　呂老師認為，未來的劇場場館都可以加強社交娛樂功能著手，這裡說的社交指的不只是增加人與人之間的互動交流，還要提供滿足生活需求之元素火花。劇場場館可以說是一座餐廳，讓欣賞完演出的觀眾可以留下來玩味討論演出內容。將表演設定在下班後時間演出，場邊設有小酒吧，讓上班族辛苦一天之後看個表演，聚在一起說老闆壞話。或者場館開放進行野餐活動，陽光、美食、表演、相聚的時光，加乘起來就是社交元素所營造的理想效果。

    （劇場 2.0：是舞臺，也是社交生活場—專訪呂弘暉談未來小劇場）'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
