  stem: 依據上文，以下關於日本童玩「面子」的敘述，何者正確？
  options:
  - label: A
    content: 面子是一種日本傳統的玩具，起源於江戶時代
  - label: B
    content: 泥面子在明治時代被鉛面子取代後，便銷聲匿跡
  - label: C
    content: 鉛面子因大阪發生鉛中毒事件後，馬上絕跡
  - label: D
    content: 因學校禁止賭博，有些兒童以牛奶瓶蓋代替面子。
  group_stem: "※請閱讀下列文章，回答14-15 題\n 面子(日語：めんこ，發音：mennko」)，是日本的傳統玩具。面子的意思是「小的臉或面具」，也用來指稱使用該種玩具的遊戲。面子的材質有泥(陶)、鉛、紙等。其中最常見的是「紙面子」，是用厚紙板製成的方形或者圓形，通常正面印有肖像或者圖案。而面子也是一種收藏對象，在日本的兒童零食店有售，在日本\
    \ 昭和時期曾經風靡一時。紙面子的玩法與韓國的花牌、臺灣的尪仔標類似。\n 面子的起源可以上溯至平安時代，據史料所載當時有一種名為「意錢」的遊戲。這種遊戲可能是自古以來就存在的，可以江戶時代以來的泥面子使用貝殼、堅果、石子，沒有固定玩具。\n\
    江戶時代以來的泥面子\n江戶時代有一種叫做「穴一」的遊戲。穴一源自平安時代，最初是貴族的遊戲，玩法是投擲銅錢。江戶時代普及到一般的兒童群體，因為幕府禁止賭博，而改以其他道具代用。天保年間(1830-1844\
    \ 年)，「泥面」(將泥土用模具成型燒制的小面具)作為穴一的玩具流行開來，直到明治時代一直是主流。而從明治時代這種遊戲已經被稱為「面子」。泥面最初的樣式是面具，但後來也有多種圖案，例如人氣俳優的家紋、江戶各救火隊的「纏」(類似旗幟的標誌物)、相撲力士、戲劇、地口(幽默諺語)、江戶地名、英雄、文字、鳥居等。泥面子也稱作土面子，直徑約2\
    \ 至5 厘米，厚約5 毫米。明治時代泥面子被鉛面子取代，目前只在某些地區作為鄉土玩具、寺廟和神社的紀念品等存在。\n明治時代的鉛面子\n 鉛面子在明治10\
    \ 年代迅速普及開來。其尺寸大約是直徑2 到5 厘米，厚1 毫米。製法為將鉛放在鐵製模具，錘打成型。鉛面子常有鎧甲、頭盔等造型，也有彩色的紋樣，不見於泥面子。\n\
    \ 江戶時代以來有一種叫做「ガラガラ煎餅」的食玩，煎餅里有一個泥面，吃完後可取出遊玩，最初玩法如打彈子。這種煎餅裡附帶的泥面被鉛制的小面具取代。最初的玩法也是打彈子，但隨後出現了適合其金屬質地和厚度的玩法「起こし」即將對方的面子擊打使其翻轉，已經類似於後來的紙面子的玩法。1900\
    \ 年(明治33 年)大阪發生了鉛中毒事件，因而鉛面子也被冷落，據研究，大概20 年之後銷聲匿跡。\n紙面子\n 鉛面子之後被紙面子取而代之，興起於明治中期。最初是兒童將繪畫用紙摺疊做成紙面子，此後產生了商品化的紙板制面子。因其材質廉價，導致了爆發性的普及，大量從業者加入了這一產業。明治20\
    \ 年代，印刷技術革新使得廉價的印刷工藝普及，使得「面子畫」(めんこ絵)的精美程度提高。昭和30 年代學校的給食中，瓶裝牛奶代替了脫脂奶粉奶。因為兒童玩面子時常以面子做賭注，勝者取走敗者的面子，因此學校會以禁止賭博為由禁止面子，此時兒童會用牛奶瓶蓋(每天可以得到一枚)代替面子來玩。紙面子上的圖片會使用當時流行的事物。早期曾經流行相撲力士、棒球選手的面子，此後怪獸、怪人、機器人、英雄題材的面子成為主流。有的面子因為未得到版權授權，而在有名的角色上加以修改。\n\
    （改寫自維基百科）"
