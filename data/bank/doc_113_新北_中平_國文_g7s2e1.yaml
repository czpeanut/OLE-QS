  options:
  - label: A
    content: 常感激讀詩經
  - label: B
    content: 姿顏服飾，天下無雙
  - label: C
    content: 其腰以上生肉，如人
  - label: D
    content: 裂取生衣裾留之而去。
  group_stem: '※請閱讀下列文章，回答1-3 題

    漢 談生者，年四十，無婦，常感激讀詩經。夜半，有女子年可①十五、六，姿顏服飾，天下無雙，來就生，為夫婦，之言：「我與人不同，勿以火照我也。三年之後，方可照耳。」與為夫婦，生一兒。

    已二歲，不能忍，夜，伺其寢後，盜照視之。其腰已上生肉，如人，腰已下，但有枯骨。婦覺②，遂言曰：「君負我。我垂生矣，何不能忍一歲，而竟相照也？」生辭謝涕泣，不可復止。

    云：「與君雖大義永離，然顧念我兒，若貧不能自偕③活者，暫隨我去，方遺④君物。」生隨之去，入華堂，室宇器物不凡。以一珠袍與之，曰：「可以自給。」裂取生衣裾留之而去。

    後生持袍詣⑤市，睢陽王家買之，得錢千萬。王識之曰：「是我女袍，哪得在市？此必發塚！」乃取拷之。生具以實對。王猶不信，乃視女塚，塚完如故。發⑥視之，棺蓋下果得衣裾。呼其兒視，正類王女。王乃信之。即召談生，復賜遺衣，以為女婿。表其兒為郎中。

    （干寶《搜神記・談生》）

    注釋

    ①可：大約。 ②覺：醒來。 ③偕：一起。 ④遺：音ㄨㄟˋ，贈送、給予。 ⑤詣：音ㄧˋ，前往。 ⑥發：打開。'
