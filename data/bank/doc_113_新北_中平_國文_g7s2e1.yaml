  stem: 以上關於器官捐贈流程的敘述何者正確？
  options:
  - label: A
    content: 捐贈者若無意願，只要捐贈者家屬簽署同意書即可捐贈
  - label: B
    content: 捐贈者一旦宣布腦死，確保時效性，應馬上進行移植手術
  - label: C
    content: 醫療團隊摘除器官後，進行遺體護理，受贈醫院前來領取
  - label: D
    content: 器官捐贈手術後即結束流程，毋須再與捐贈者家屬有所牽連。
  group_stem: "※請閱讀下列文章，回答6-7 題\n\n◆ 器官捐贈移植是否有年齡的限制？\n 器官捐贈移植決定因素在於捐贈移植者的生理年齡，而不是實際年齡。\n\
    \ (過去器官捐贈移植的年齡標準上限是75 歲，但也有個案80 歲以上仍能捐器官。)\n 每一種器官粗略的年齡限制：心 65 歲、肝 70 歲、肺 65 歲、腎\
    \ 70 歲、胰 65 歲、眼角膜 80 歲。\n◆ 罹患哪些疾病會影響器官捐贈？\n 有B、C 型肝炎的捐贈者，只要器官功能良好，還是可以捐贈器官給有B、C\
    \ 型肝炎的移植等候者。\n 患有敗血症、愛滋病、狂牛症，以及無法控制的傳染性疾病，無法捐贈器官。\n 患有惡性腫瘤者，經檢查若無敗血症、傳染性疾病或轉移性惡性腫瘤者，仍然可以捐贈眼角膜或皮膚。\n\
    ◆ 器官捐贈的分類有哪些？\n1. 活體器官捐贈移植\n是一個健康的成年人，願意在不影響自身的健康及生理功能的原則下，捐出自己的一部分器官或組織，提供親屬或配偶作為器官移植。\n\
    2. 屍體器官捐贈移植\n就是當一個人不幸腦死時，把自己身上良好的器官或組織，以無償的方式，捐贈移植給器官衰竭急需器官移植的患者，讓他們能夠延續生命，改善未來的生活品質，並且能繼續貢獻社會。\n\
    ◆ 摘取器官的過程會痛嗎？\n 被醫生判定腦死的人已沒有疼痛感覺，但摘取器官過程，比照嚴謹的外科手術標準，一定會施打全身麻醉。\n◆ 如何判定腦死？\n 腦死是指有「生命中樞」之稱的腦幹完全失去功能，導致無法維持基本生命徵象，即使運用藥物與醫療，仍無法長期維持生命。\n\
    \ 器官捐贈的兩次腦死判定，由2 位具有判定資格的醫師同時進行，兩次判定間隔4 小時，確定病人在完全沒有藥物的控制下，對於刺激和反射的測試已完全沒反應，且無法自行呼吸，才能判定是腦死。\n\
    （節選自中華民國器官捐贈協會網站）"
