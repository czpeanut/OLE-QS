  section: 1
  number: 7
  type: single
  page: 1
  stem: 水結冰過程中，體積會如何變化？
  options:
  - label: A
    content: 冰的密度比水小，即水結冰時，體積會變大
  - label: B
    content: 因為密度是物質的特性之一，不會改變，所以水結冰時，體積不變
  - label: C
    content: 因為熱脹冷縮，所以水結冰時，體積會變小
  - label: D
    content: 因為結冰前後質量相等，所以水結冰時，體積不變。
