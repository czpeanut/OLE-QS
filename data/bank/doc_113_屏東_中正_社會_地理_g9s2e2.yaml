- id: doc_113_屏東_中正_社會_地理_g9s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '根據勞動部的統計(如表二)，2024 年台灣的外籍勞工人數已超過75 萬人，這些外籍勞工大致可分為參與製造業、農業、漁業等產業移工，及家事服務以及照顧工作等社服移工。在台灣，外籍勞工享有一系列基本的勞動權益，旨在確保外籍勞工在台灣的工作環境中獲得公平對待和合理保障。然而，外籍勞工在台灣也面臨一些挑戰。首先，語言障礙影響了他們的工作效率和社交生活；文化差異也可能導致外籍勞工在台灣適應困難，需要時間來適應新的環境和價值觀。右圖為台灣產業移工及社服移工的的最大來源國別及性別人數比較，下列敘述何者正確？


    表(二)

    | 項目 | 產業移工 | 社服移工 |

    |---|---|---|

    | 最大來源國 | 越南 | 印尼 |

    | 男性 | 32000 人 | 130000 人 |

    | 女性 | 1800 人 | 260000 人 |'
  options:
  - label: A
    content: 移工多來自南亞地區
  - label: B
    content: 社服移工的性別比＜100
  - label: C
    content: 印尼籍移工較能理解中國文化
  - label: D
    content: 越南籍移工更易產生宗教適應的困難
