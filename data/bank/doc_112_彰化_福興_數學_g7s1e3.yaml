  stem: '小晴解方程式 $\frac{-3}{2}(3x+2)=2x+3$ 的步驟如下：

    步驟一：將兩邊同乘以 $2$，

    得 $-3(3x+2)=2(2x+3)$

    步驟二：將兩邊去括號，得 $-9x+6=4x+6$

    步驟三：將兩邊同減 $6$，得 $-9x=4x$

    步驟四：將兩邊同除以 $x$，得 $-9=4$

    小晴的做法得到錯誤的結論，請問小晴是從哪一個步驟開始發生錯誤？'
