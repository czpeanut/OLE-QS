  stem: '二十二年前的今天，我們憲法增修條文裡的「山胞」正式正名為「原住民」。…站在這個基礎上，今天我們要更往前踏出一步。我要代表政府，向全體原住民族，致上我們最深的歉意。…在我們生活周遭裡，還是有一些人認為不需要道歉。而這個，就是今天我需要代表政府道歉的最重要原因。把過去的種種不公平視為理所當然，或者把過去其他族群的苦痛，視為是人類發展的必然結果，這是我們今天站在這裡企圖要改變和扭轉的第一個觀念。


