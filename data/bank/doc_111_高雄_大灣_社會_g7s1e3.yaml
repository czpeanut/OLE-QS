  stem: 有資料顯示，乾隆時期臺灣的移民分布如下：「按全臺大勢，漳泉居民十分之六七，廣民在三四之間。以南北論，則北淡水、南鳳山多廣民，諸、彰兩邑多閩戶；以內外論，則近海屬漳泉之土著，近山多廣來之客莊。」關於這段文字的解讀，下列敘述何者正確？
  options:
  - label: A
    content: 清帝國時期臺灣的移民中，來自廣東省的人民多於來自福建省人民
  - label: B
    content: 閩南人多居住於近海平地一帶，客家人多居住於近山丘陵一帶
  - label: C
    content: 臺灣南、北部以福建移民為主，中部以廣東移民居多
  - label: D
    content: 因漢人移民往近山地區開墾，導致民變頻繁發生
