  stem: 文中「山因雲晦明，雲共山高下」，下列敘述何者正確？
  options:
  - label: A
    content: 描述作者自身跟雲、山的相互關係
  - label: B
    content: 指作者在山下仰望藍天萬里無雲之美
  - label: C
    content: 山因雲的來去時暗時明，雲隨山勢忽上忽下
  - label: D
    content: 寫物我相融，人愛山、山也愛人的生動情景。
  group_stem: "雲來山更佳，雲去山如畫，山因雲晦①明，雲共山高下②。 倚杖立雲沙③，回首見山家④。野鹿眠山草，山猿戲野花。雲霞，我愛山無價。看時⑤行踏⑥，雲山也愛咱⑦。\n\
    （張養浩 雁兒落兼得勝令 ）\n\n【注釋】①晦：昏暗。②雲共山高下：雲隨著山勢的高低而或上或下。③雲沙：像平坦沙地一樣的茫茫雲海。④山家：山野人家。⑤看時：指看雲山的時候。\
    \ \n⑥行踏：往來、走動。⑦咱：我。"
