    ( 孫作 座右銘 )\n\n【注解】：①蔽：毛病。 ②篤：堅持、堅定。 \n③徇：音ㄒㄩㄣˋ，依從。 ④極：窮盡、達到最高點。\n⑤太上：遠古、上古，指三皇五帝之世。"
