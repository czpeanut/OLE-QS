  section: 1
  number: 26
  type: single
  page: 1
  stem: 日治初期，臺灣的民政長官後藤新平曾說：「治理臺灣的方式絕對不是把成功的日本經驗套在臺灣人民身上。……我們必須先了解臺灣人的習性，依據其習性定出一套管理辦法才有效。」請問：根據上述的理論，後藤新平曾進行下列哪一措施？
  options:
  - label: A
    content: 用武力鎮壓臺灣的抗日分子與原住民
  - label: B
    content: 將日本國內的法制延用到臺灣
  - label: C
    content: 對臺灣進行舊有風俗習慣、地籍和人籍等調查
  - label: D
    content: 開始在臺灣各地推行皇民化運動
