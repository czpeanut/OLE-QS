- id: doc_113_台中_五權_社會_歷史_g7s2e1_s1_19
  section: 1
  number: 19
  type: single
  page: 1
  stem: 日本殖民臺灣時期被稱為「典型的警察政治」時代，當時孩童若哭鬧，長輩們只須恫嚇：「大人來了，再哭就會被抓去。」孩童立即安靜。上文敘述中，「孩童立即安靜」是因為下列何事？
  options:
  - label: A
    content: 孩童的哭鬧，若引來警察，會使長輩們被鞭打
  - label: B
    content: 警察的社會地位崇高，會鞭打哭鬧的孩童
  - label: C
    content: 警察強而有力的控制社會，孩童懾於警察的威權
  - label: D
    content: 警察為臺灣總督的眼線，有權處罰哭鬧的孩童
