  section: 1
  number: 14
  type: single
  page: 2
  stem: 在印度街頭，汽車、人力車、單車、牛和行人橫衝直撞，按喇叭就成了每個印度駕駛的生存技能。印度俗諺提到若想在印度好好開車，你需要「好車、好眼力、好運氣和好喇叭！」但這也讓街頭充滿喇叭噪音，讓人無法忍受，因此，印度孟買警察想出一個「你愈叭，紅燈愈長」的計畫：在幾個交通特別繁忙的路口，立起印有「你愈叭就等愈久」的警語，此一計畫也引起印度其他城市官員的響應。根據上述，下列看法何者最為貼切？
  options:
  - label: A
    content: 俗諺呈現該社會長時間累積而成的非正式規範
  - label: B
    content: 警察的計畫顯示規範受到外來文化影響而改變
  - label: C
    content: 官員想藉由正式規範來凸顯社會輿論的強制力
  - label: D
    content: 俗諺內容是印度警察與城市官員強制力下的產物。
