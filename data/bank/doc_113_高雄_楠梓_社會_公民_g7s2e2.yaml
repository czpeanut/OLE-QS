  section: 1
  number: 12
  type: single
  page: 1
  stem: 臺灣有「死貓吊樹頭」的俗諺，是因為過去人們相信，若將貓屍埋於土壤，經過雨水浸潤、陽光曝晒後，會變成貓妖騷擾人類，因此要吊在樹頭將其風乾。然而，隨著動物保護的觀念普及，將寵物視為家人的想法深植人心，相關法律也規定，若隨意棄置動物屍體，將會被處以罰款，希望能減少上述行為。請問，下列何者可用來說明上述狀況？
  options:
  - label: A
    content: 非正式規範是正式規範的基礎
  - label: B
    content: 政府會透過正式規範改變不合時宜的非正式規範
  - label: C
    content: 社會規範會隨著時間逐漸增加
  - label: D
    content: 社會規範是文化的一環。
