- id: doc_113_高雄_楠梓_社會_公民_g7s2e2_s2_17
  section: 2
  number: 17
  type: single
  page: 2
  stem: 《國家語言發展法》的通過，期能解決過去「國語運動」政策所造成的問題，關於「國語運動」的敘述，下列何者最為正確？
  options:
  - label: A
    content: 為避免中文成為弱勢語言，而有了該運動的推行
  - label: B
    content: 文化位階是無法避免的現象，國家不該介入
  - label: C
    content: 各族群的語言受到限制，與文化位階的形成並無關係
  - label: D
    content: 該運動的出現，是強勢文化者透過政策來鞏固自身優勢。
  group_stem: (甲) 立法院通過《國家語言發展法》，將臺灣固有族群使用的自然語言及臺灣手語認定為「國家語言」，強調各種國家語言一律平等，要求政府營造國家語言的生活環境，提升各族群語言使用機會，解決語言流逝問題。為了達到以上目標，政府應獎勵和設立各種國家語言的傳播媒體。此外，政府應定期召開會議、提出研究報告、建置資料庫，確保學生國家語言的學習與使用，且政府的各項程序應提供語言翻譯服務，讓國民權益的行使不因語言差異而受限。
