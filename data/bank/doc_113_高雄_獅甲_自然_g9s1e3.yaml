- id: doc_113_高雄_獅甲_自然_g9s1e3_s2_43
  section: 2
  number: 43
  type: single
  page: 3
  stem: 雷電現象發生的過程，不包含下列哪一項？
  options:
  - label: A
    content: 摩擦起電
  - label: B
    content: 靜電感應
  - label: C
    content: 接觸起電
  - label: D
    content: 電荷中和
  group_stem: '雷電現象的發生，是由於旺盛的空氣對流作用所形成。熱空氣上升、冷空氣下降，在上升氣流中的水滴與冰晶，因為摩擦而使正負電荷分離帶電。不同雲塊間分別帶著正電與負電，並且相互吸引，但為中間的空氣所阻隔。帶電的雲層接近電地面時，地表因靜電感應，而帶異性電荷，與雲層的電荷相互吸引。

    當電壓升高，雲層與地表間的靜電力夠大時，就會發生正、負電荷劇烈中和大規模放電的現象，形成閃電，並發出隆隆的雷聲。雷電現象發生時，應盡快離開空曠地區，避免逗留在高聳突出物的附近；在室內不要靠近窗戶，並遠離室外天線的引線等；潮溼的身體導電性較好，如正在游泳，應立即離開游泳池，同時盡量避免於室外使用手機通話，以免遭受雷擊。請依文章內容，回答下列問題：'
