- id: doc_113_高雄_英明_自然_g7s2e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: '2005 年 6 月，臺灣衛生署發現彰化縣某鄉鎮內養殖的鴨蛋含過量戴奧辛。戴奧辛是無色、無味而且毒性相當強的脂溶性化學物質，容易累積在生物體的脂肪組織中。周家三兄弟在不知情的情況下，吃了這產區的毒鴨蛋：周老大不吃蛋黃，周老二只吃蛋黃，周老三吃整顆蛋。請參考右表的蛋成分比較，若每餐吃一顆蛋，一個月後體內戴奧辛含量誰最少？

    | 每 100 g | 熱量（kcal） | 水分（g） | 蛋白質（g） | 脂肪（g） | 碳水化合物（g） |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 蛋 | 137 | 76 | 13 | 9 | 1.6 |

    | 蛋白 | 48 | 89 | 11 | 0 | 0 |

    | 蛋黃 | 330 | 52 | 16 | 29 | 1.6 |'
  options:
  - label: A
    content: 周老大
  - label: B
    content: 周老二
  - label: C
    content: 周老三
  - label: D
    content: 三人皆相同。
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 生物
      code: 4-3
      title: 生態系
      chapter: 第4章 生物與環境
    textbook: 七下生物 4-3 生態系
    labeled_by: ai
- id: doc_113_高雄_英明_自然_g7s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 小花蔓澤蘭原產於中南美洲，有人在 1950 年代將它引入東南亞來綠化環境。但其繁殖力過於驚人，今日這種植物在臺灣中南部地區造成許多原生植物死亡，甚至危害農作物，且已往北部蔓延，因此也有「綠色癌症」之稱。關於前述現象，下列選項何者正確？
  options:
  - label: A
    content: 這是自然的結果，應讓其不受限制的生長、發育
  - label: B
    content: 不當引入外來生物，會破壞原本的生態平衡
  - label: C
    content: 應引入小花蔓澤蘭的天敵，以控制此植物的範圍
  - label: D
    content: 外來物種植物可增加本地的生物種類，增加生物多樣性。
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 生物
      code: 5-1
      title: 生物多樣性
      chapter: 第5章 生物多樣性與保育
    textbook: 七下生物 5-1 生物多樣性
    labeled_by: ai
