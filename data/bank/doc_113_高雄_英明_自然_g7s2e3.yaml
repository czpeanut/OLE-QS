  group_stem: 'Ⅷ、碳元素是構成生物體的主要物質，舉凡醣類、蛋白質與脂質均需要碳元素才能形成，由此可見碳元素的重要性。碳元素會在自然界與生物間循環，此過程稱為「碳循環」。碳循環主要分為兩大作用：

    一、碳元素的固定（固碳作用）

    (1)具有葉綠素、可行光合作用的生物（綠色植物、藻類與藍綠菌）藉由光合作用的過程，將二氧化碳轉變成醣類或其他養分儲存於體內。

    (2)大氣中的二氧化碳會自然地溶解於水中。

    (3)古代生物的遺體經長時間高溫高壓作用下，慢慢形成化石燃料（煤炭、石油）。

    二、碳元素的釋放（脫碳作用）

    (1)只要是生物，無論是生產者、一般消費者及分解者，都必須進行呼吸作用，將養分分解產生能量供細胞使用，並同時釋放出二氧化碳。

    (2)燃燒化石燃料，產生熱能，並釋放出二氧化碳。

    (3)分解者對生物遺體進行分解作用，同時也會釋放出二氧化碳。

    請根據以上敘述，回答下列 48～50 題：'
