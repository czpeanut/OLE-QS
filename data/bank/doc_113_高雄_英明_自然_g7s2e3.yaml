    labeled_by: ai
- id: doc_113_高雄_英明_自然_g7s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 小明參加畢業旅行時參觀了許多地方，也看到了許多平常在生物課本中提到的生物。請問下列哪個選項可以稱為一個「族群」？
  options:
  - label: A
    content: 七股溼地上的海鳥
  - label: B
    content: 淡水河中的魚
  - label: C
    content: 關渡溼地上的水筆仔
  - label: D
    content: 陽明山上的植物。
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 生物
      code: 4-1
      title: 族群、群集與演替
