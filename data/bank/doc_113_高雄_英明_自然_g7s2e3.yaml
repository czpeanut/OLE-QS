- id: doc_113_高雄_英明_自然_g7s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '右表為生物與其生存環境的配對表，下列有關甲、乙、丙環境的敘述，何者正確？

    | 生物 | 生存環境 |

    | :--- | :--- |

    | 長頸鹿、獅子 | 甲 |

    | 蘭花、蕨類 | 乙 |

    | 長耳跳鼠、蠍子 | 丙 |'
  options:
  - label: A
    content: 甲—森林，乙—草原，丙—沙漠
  - label: B
    content: 甲—沙漠，乙—草原，丙—森林
  - label: C
    content: 甲—草原，乙—森林，丙—沙漠
  - label: D
    content: 甲—草原，乙—沙漠，丙—森林。
