- id: doc_113_高雄_英明_自然_g7s2e3_s1_32
  section: 1
  number: 32
  type: single
  page: 3
  stem: 關於深海熱泉生態系的敘述，下列何者有誤？
  options:
  - label: A
    content: 是一個不需要能量即可自己自足的生態系
  - label: B
    content: 有生產者的參與
  - label: C
    content: 有能量的流動
  - label: D
    content: 有消費者參與。
  group_stem: 'Ⅱ、請閱讀下列文章，並回答 32～34 題：

    在板塊活動頻繁的海底火山附近容易有深海熱泉生態系形成。深海熱泉生態系常出現於水深超過 200 公尺的深海層，熱泉附近的水溫在 2～400℃ 之間變化劇烈，因為陽光無法照射到水深
    200 公尺以下的深海，故生物無法進行光合作用。熱泉中會冒出一種名為硫化氫的化學物質，可以被一種硫化菌合成有機物，其他生物便能以這些有機物為食，而形成一個以硫化菌作為生產者、以化學反應為能量來源的生態系統。'
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 生物
      code: 4-3
      title: 生態系
      chapter: 第4章 生物與環境
    textbook: 七下生物 4-3 生態系
    labeled_by: ai
