- id: doc_113_高雄_英明_自然_g7s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 荔枝椿象原產於福建、廣東等地。2010 年在高雄發現後，已擴散到北部。荔枝椿象會吸食荔枝的汁液，使其落花落果，甚至整株枯死，造成本地農業的損失。而研究人員發現平腹小蜂可以將卵產於荔枝椿象的卵中，以減緩荔枝椿象的擴散速度。下列敘述何者有誤？
  options:
  - label: A
    content: 荔枝椿象為外來種
  - label: B
    content: 荔枝椿象為次級消費者
  - label: C
    content: 利用平腹小蜂減緩荔枝椿象的擴散速度是一種生物防治
  - label: D
    content: 平腹小蜂與荔枝椿象之間的生物關係屬於寄生關係。
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 生物
      code: 4-2
      title: 生物間的互動關係
      chapter: 第4章 生物與環境
    textbook: 七下生物 4-2 生物間的互動關係
    labeled_by: ai
