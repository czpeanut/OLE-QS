- id: doc_113_高雄_英明_自然_g7s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 某地區發生了森林大火，其植物群集樣貌過程改變如下：森林火災→地衣蘚苔→草本植物→灌木→森林，下列關於此過程的敘述何者錯誤？
  options:
  - label: A
    content: 此過程稱為演替
  - label: B
    content: 所有大火過的生態系，環境最終都會變成森林
  - label: C
    content: 蘚苔時期的食物網比森林時期的食物網簡單
  - label: D
    content: 群集樣貌改變的過程需要時間，並非一蹴可幾。
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 生物
      code: 4-1
      title: 族群、群集與演替
      chapter: 第4章 生物與環境
