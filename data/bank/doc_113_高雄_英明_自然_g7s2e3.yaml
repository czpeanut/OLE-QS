- id: doc_113_高雄_英明_自然_g7s2e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 關於「生物多樣性」，以下敘述何者正確？
  options:
  - label: A
    content: 食物網愈複雜、生態愈穩定：這是「生態系多樣性」
  - label: B
    content: 個體差異愈大、該物種愈不易被淘汰：這是「遺傳多樣性」
  - label: C
    content: 環境愈多元、可以提供更多種生物所需的棲地：這是「物種多樣性」
  - label: D
    content: 以上皆正確。
