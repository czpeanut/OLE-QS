- id: doc_113_高雄_英明_自然_g7s2e3_s1_35
  section: 1
  number: 35
  type: single
  page: 4
  stem: 關於道路的開發，下列敘述何者有誤？
  options:
  - label: A
    content: 會使野生動物的棲地變小
  - label: B
    content: 會使生物多樣性下降
  - label: C
    content: 會加速生物滅絕速度
  - label: D
    content: 會導致棲地集中化。
  group_stem: 'Ⅲ、請閱讀下列文章，並回答 35～37 題：

    「路殺」指的是野生動物不小心移動到人類的道路上，被車輛撞擊而死亡的現象。依照臺灣過往的路殺相關研究文獻估計，臺灣每年至少有 40 萬～400 萬的野生動物慘死輪下。當我們開發的道路愈來愈多條，道路系統形成網狀時，便會將大面積的棲地切割成許多小面積的棲地，稱為「棲地破碎化」，破碎的棲地會導致野生動物與人類接觸的機會增加，使野生動物受到更大的干擾，物種滅絕的風險隨之增加。因此人類在開發前都必須經過審慎的環境評估。'
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 生物
      code: 5-3
      title: 保育的落實
      chapter: 第5章 生物多樣性與保育
    textbook: 七下生物 5-3 保育的落實
    labeled_by: ai
