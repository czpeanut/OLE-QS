    content: 駕駛人行經有野生動物出沒的道路，應加速盡快通過
  - label: B
    content: 可將道路加高，讓野生動物可以從道路下層通過
  - label: C
    content: 可增設野生動物防護欄，避免野生動物誤闖道路
  - label: D
    content: 開發新道路前須經過審慎的評估。
  group_stem: 'Ⅲ、請閱讀下列文章，並回答 35～37 題：

    「路殺」指的是野生動物不小心移動到人類的道路上，被車輛撞擊而死亡的現象。依照臺灣過往的路殺相關研究文獻估計，臺灣每年至少有 40 萬～400 萬的野生動物慘死輪下。當我們開發的道路愈來愈多條，道路系統形成網狀時，便會將大面積的棲地切割成許多小面積的棲地，稱為「棲地破碎化」，破碎的棲地會導致野生動物與人類接觸的機會增加，使野生動物受到更大的干擾，物種滅絕的風險隨之增加。因此人類在開發前都必須經過審慎的環境評估。'
