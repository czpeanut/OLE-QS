  section: 1
  number: 21
  type: single
  page: 2
  stem: 臺灣堡圖是日治時1898 年開始，歷經六年調製，1904 年（明治37 年）完成的臺灣地形圖，比例尺為2 萬分之1。繪製範圍涵蓋原住民主要居住地（蕃地）以外的平原、丘陵地帶，共計466
    張地圖（內含1 張一覽圖）。1920 年（大正九年）臺灣行政區劃大改革，將原有的十二廳改制為五州二廳，將所屬的舊制街／庄改制為大字，其下的自然村（土名）則稱為小字。同時將原本臺灣地名常用字「藔」、「仔」改為「寮」、「子」，並更改部分地名。1921
    年（大正十年），《臺灣堡圖》發行新版（大正版），以1904 年之版本（明治版）為底稿，僅將異動地名及行政區界以紅字標示，故又稱為「紅字版」。請問：在台灣堡圖中的1
    公分，實際上相當於幾公里？
