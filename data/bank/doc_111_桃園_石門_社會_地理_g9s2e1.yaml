  stem: 慶修院舊名「真言宗吉野布教所」，布教所內供奉主神弘法大師空海、不動明王與毘沙門天王，所內直立高約2 米的「光明真言百萬遍」石碑，以及請自日本四國的八十八尊神像。布教所建於1917
    年（大正6 年），日本政府選定台灣較晚開發區域，如花蓮，以解決農村人口過剩、耕地與糧食不足的問題，在今日的鄉成立吉野村（吉野移民村）。移居生活貧困的日人，吉野布教所就是當時在地移居日人的宗教信仰中心之一。1945
    年國民政府接管台灣，日人遣回故里，布教所更名為慶修院，慶修院一詞沿用至今，院內建築與陳設皆維持日式庭院風格，目前為花東地區唯一日式佛寺的文化資產。請問：文中的應填入哪一地名？
