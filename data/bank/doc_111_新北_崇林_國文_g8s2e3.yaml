  section: 2
  number: 35
  type: single
  page: 5
  stem: 「兩人本來是抱著實驗的心態，看能不能將公司的策略『橫向開發強大內容IP』具體實現，結果第一役就告捷。」根據這段文字，他們的成功可以用下列哪個選項解釋？
  options:
  - label: A
    content: 無心插柳
  - label: B
    content: 有意栽花
  - label: C
    content: 用盡心機
  - label: D
    content: 三思而行
  group_stem: '「小說故事音樂化」，是指小說經過作詞家反覆咀嚼、仔細感受，最終打造成一首融入故事精華的動人歌曲，讓聽眾有如傾聽小說女主角溫柔訴說自己發生的故事。

    2019 年，YOASOBI 成立，第一首歌就是將monogatary 上一篇得獎小說《桑納托斯的誘惑》改編成名為《向夜晚奔去》的歌曲，將小說劇情、台詞都融入僅4
    分鐘的歌曲，並聘請插畫師繪製呈現小說內容的MV動畫。

    沒想到，2019 年底該歌曲一發布就大爆紅，成為2020 年日本播放次數最多的歌曲。不僅帶動原著小說賣破10 萬冊成為暢銷作品，屋代陽平和山本秀哉也順勢推出衍生廣播劇。

    其實，兩人本來是抱著實驗的心態，看能不能將公司的策略「橫向開發強大內容IP」具體實現，結果第一役就告捷。

    如何將小說成功音樂化？他們發現關鍵是打造「★」的歌曲。

    「肥肉偶爾吃一次很好吃，但我不會想一次又一次的吃。」、「我有意識的創作能讓我的身體動起來、讓我想唱歌的歌曲。」山本秀哉這樣說

    原因在於，現在是音樂串流時代，收聽次數比專輯銷量重要，人們越常反覆聆聽，也更有可能去消費其他IP 衍生作品。再來，他們不以自己的音樂品味為準，而是去研究年輕人喜歡聽什麼。

    --節錄商業週刊「最會創作爆紅歌曲的日本團體，目的竟是幫 Sony『賣小說』？YOASOBI 是誰」'
