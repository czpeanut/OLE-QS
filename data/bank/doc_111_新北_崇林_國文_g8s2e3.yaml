- id: doc_111_新北_崇林_國文_g8s2e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 歇後語就是「歇」去「後」半段之「語」，就是說要把真正想表達的意旨藏起來，不直接明說，改以幽默的方式來呈現一段話語的前半段，然後，再讓聽者或讀者就意義的關聯性，或是語音相近似者，去揣測其真正的意思。而在經歷了精采的三國週之後，芸芸想要將三國歇後語學以致用，便簡單的自創了幾個句子方便記憶，可以幫她找看看哪邊寫錯了嗎？
  options:
  - label: A
    content: 每當做錯事時，惠惠總是裝得如關雲長刮骨下棋，讓人對她無可奈何
  - label: B
    content: 他竟然敢大放厥詞，批評學者專家，真是在關公面前耍大刀
  - label: C
    content: 阿克婭那麼喜歡足球，你讓他加入文藝社，真是劉備見孔明
  - label: D
    content: 克莉絲又沒叫他去，是他自願的，反正是周瑜打黃蓋，還有什麼話說
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 國文
      code: 第八課
      title: 空城計
      chapter: null
    textbook: 八下 第八課 空城計
    labeled_by: ai
