  section: 2
  number: 32
  type: single
  page: 4
  stem: 依據本文所述，下列何者最有可能是崇林國中的畢業旅行行程？
  options:
  - label: A
    content: 七天六夜的環島列車之旅
  - label: B
    content: 五天四夜的台灣西部之旅
  - label: C
    content: 六福村一日遊
  - label: D
    content: 三天兩夜的知性之旅
  group_stem: '畢業旅行的意義，其實就是「★」。

    在旅程中，和同學們一起分享歡笑和淚水、一起面對挑戰和驚喜、一起及時行樂和放鬆心情。大家盡情沈浸在各種體驗，無論是刺激的遊樂設施、美麗的風景、豐富的美食、還是精彩的表演，只要有同學們一起，總是很好玩。

    每年十一月到一月都是畢業旅行的旺季，即將離開校園的學生，無不希望把握最後相聚的機會，然而不當的行程設計，留下的往往不是美好的回憶，而是旅途勞頓後的疲憊。近幾年來畢業旅行的型態與早年已稍有不同，以前的學生較刻苦，住團體房，旅遊方式總是蜻蜓點水。最近定點旅遊加上知性之旅流行之後，開始有學生提出定點畢業旅行的要求；目前國高中生的畢業旅行為三天兩夜，旅遊地點以花東、墾丁、日月潭、溪頭、廬山及九族文化村最多。

    改寫自《報時光》'
