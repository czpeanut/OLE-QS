  group_stem: 'The day after Thanksgiving is Black Friday. On that Friday, people
    usually look for big discounts and buy gifts for friends and family at lower prices.
    It’s the busiest shopping day of the year in the USA. Lots of people shop online
    and in physical stores.

    😁 Interesting facts:

    👛 Top 3 things you must buy:

    1. The latest iPads and iPhones ➔ sometimes up to US$150 off

    2. Appliances: dishwashers, washing machines, clothes dryers

    3. Sports shoes, especially those that aren''t hot or trendy.


    62% of people think Black Friday is a scam to get them to spend more money. They
    buy some things they don’t really need.

    80% of buyers plan to shop on this day.

    77% of shoppers like to book an appointment for in-store shopping. In this way,
    they don’t have to wait in long lines and shopping will be more comfortable.

    65% of people tend to shop online this season.

