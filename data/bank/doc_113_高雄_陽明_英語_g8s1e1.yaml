    worrying about putting on weight. Next, this delicious fruit is fat-free. This
    is why so many people love pineapple cakes or jam. Also, the pineapple skin drink
    can help with a cough. So ____30____. Just boil them in some hot water, wait until
    the water turns cool, and then you can enjoy the pineapple drink.

    In Taiwan, you can buy pineapples in four seasons. Although pineapples are cheap
    and yummy, ____31____ because the enzyme in pineapples may make you feel like
    your mouth is burning. So be careful next time you are going to eat pineapples.

