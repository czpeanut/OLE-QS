  group_stem: 'When there’s a storm, you always see lightning. Some people think it’s
    beautiful and love to take pictures of it. But in fact, it’s dangerous. Some people
    even died from lightning.

    ☆How do you know how far away the lightning is?

    Count the number of seconds between the flash of lightning and the sound of thunder,
    and then divide by 5, you''ll get the distance in miles to the lightning:

    5 seconds = 1 mile,

    15 seconds = 3 miles,

    0 seconds = very close


    ☆When you find the lightning is coming, you should know…

    ☠ Don’ts

    1. Stand under a big tree.

    2. Get near the water.

    3. Stay in open spaces,like parks, playgrounds, ponds, lakes, swimming pools,
    and beaches.

    👌 Dos

    1. Run inside the building or get into a car quickly.

    2. Turn off your cellphone.

    3. Stay indoors for 30 minutes after you hear the last clap of thunder.

    4. Stay low.

    📖 storm 暴風雨；lightning 閃電；how far away 多遠；count 數；second 秒；flash 閃光；thunder 打雷；divide
