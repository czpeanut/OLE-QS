  options:
  - label: A
    content: 乙生，因為使用的鋼尺最小刻度為0.5mm比較精確。
  - label: B
    content: 乙生，因為多次測量可有效減少誤差，甲生僅側量一次。
  - label: C
    content: 甲生，使用正確的測量工具來測量可避免誤差累積。
  - label: D
    content: 乙生，因為鋼尺是硬的，測量跑道用硬的測量工具比較精確。
