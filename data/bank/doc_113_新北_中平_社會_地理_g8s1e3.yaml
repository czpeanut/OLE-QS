  stem: 韓式泡菜又稱韓國泡菜、朝鮮泡菜，是朝鮮民族的一種傳統醃漬食品，韓國官方於2013 年11 月正式將該食品中文標準譯名為辛奇（取自辛辣的「辛」與新奇的「奇」），2014
