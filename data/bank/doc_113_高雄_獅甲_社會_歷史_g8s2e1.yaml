- id: doc_113_高雄_獅甲_社會_歷史_g8s2e1_s1_18
  section: 1
  number: 18
  type: single
  page: 1
  stem: 「君主立憲」與「共和體制」是晚清兩大救國方向，各有自己的擁護者，當時引起諸多討論，許多學者也曾為此爭執不休，兩者在實施方式、影響層面差異甚大，最終的發展結果也不一樣。請問：有關當時兩者的相關比較下列選項何者正確？
  options:
  - label: A
    content: 支持君主立憲的人希望透過憲法廢除君主制度
  - label: B
    content: 孫中山推翻清朝是為了建立中國的共和體制
  - label: C
    content: 君主立憲運動最後因成功限縮君主權力獲得人民支持
  - label: D
    content: 共和體制是保留原本政權推動新政策。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 1-1
      title: 帝國崩解與民國的建立
      chapter: 第1章 中華民國的建立
    textbook: 八下歷史 1-1 帝國崩解與民國的建立
    labeled_by: ai
- id: doc_113_高雄_獅甲_社會_歷史_g8s2e1_s1_19
  section: 1
  number: 19
  type: single
  page: 1
  stem: 獅甲國中圖書館舉辦辛亥革命特展，老師要同學收集相關史料，並上台完成報告。請問：下列哪一位同學對於辛亥革命的介紹完全正確？
  options:
  - label: A
    content: 大衛：辛亥革命發生地點在四川
  - label: B
    content: 小美：保路運動讓辛亥革命有機會成功
  - label: C
    content: 大鯊：辛亥革命起義成功清朝立即被完全推翻
  - label: D
    content: 小蝦：中華民國臨時政府最早成立於北京。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 1-1
      title: 帝國崩解與民國的建立
      chapter: 第1章 中華民國的建立
    textbook: 八下歷史 1-1 帝國崩解與民國的建立
    labeled_by: ai
- id: doc_113_高雄_獅甲_社會_歷史_g8s2e1_s1_20
  section: 1
  number: 20
  type: single
  page: 1
  stem: 孫中山一手創建中華民國，被尊稱為中華民國國父，至今百元鈔票上的圖像仍以孫中山為主體，可見歷史對於孫中山貢獻的肯定。請問：有關孫中山的相關敘述何者正確？
  options:
  - label: A
    content: 被選為中華民國第一位正式大總統
  - label: B
    content: 成立國民政府討伐軍閥
  - label: C
    content: 獲俄國協助成立黃埔軍校
  - label: D
    content: 於日俄戰爭後成立興中會正式採取革命行動。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 1-1
      title: 帝國崩解與民國的建立
      chapter: 第1章 中華民國的建立
    textbook: 八下歷史 1-1 帝國崩解與民國的建立
    labeled_by: ai
- id: doc_113_高雄_獅甲_社會_歷史_g8s2e1_s1_21
  section: 1
  number: 21
  type: single
  page: 1
  stem: 中華民國建立後，結束存在千年的君主制度，中國的政治進入另一不同的發展階段，但建國初期，曾經有兩人試圖稱帝，結果最後都宣告失敗，見證中國人民已無法再接受君主制度。請問：有關民初試圖稱帝的兩位人物，其相關敘述何者正確？
  options:
  - label: A
    content: 溥儀在民國五年將年號由民國改回宣統
  - label: B
    content: 袁世凱以洪憲為其皇帝年號
  - label: C
    content: 兩者稱帝皆獲得外國支持
  - label: D
    content: 兩者稱帝皆在軍閥亂政時期發生。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 1-2
      title: 袁世凱與洪憲帝制
      chapter: 第1章 中華民國的建立
    textbook: 八下歷史 1-2 袁世凱與洪憲帝制
    labeled_by: ai
- id: doc_113_高雄_獅甲_社會_歷史_g8s2e1_s1_22
  section: 1
  number: 22
  type: single
  page: 1
  stem: 孫中山一生憂國憂民，就連晚年重病在床，仍心繫當時危害社會的問題還未去除，最後民國14 年病逝北京，在其遺囑中留下：「革命尚未成功，同志仍須努力。」。請問：對於上文所提及的「革命」尚未成功，其相關敘述何者正確？
  options:
  - label: A
    content: 所指對象為袁世凱的危害
  - label: B
    content: 當時最主要要討伐對象為溥儀
  - label: C
    content: 因共產黨的協助最後才能解決此問題
  - label: D
    content: 最後在張學良投降後完成此革命。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 1-3
      title: 軍閥統治與南北分裂
      chapter: 第1章 中華民國的建立
    textbook: 八下歷史 1-3 軍閥統治與南北分裂
    labeled_by: ai
- id: doc_113_高雄_獅甲_社會_歷史_g8s2e1_s1_23
  section: 1
  number: 23
  type: single
  page: 1
  stem: 日本鄰近中國，過去長年受中國文化影響，但在明治維新後，日本向西方國家學習進步的制度與思想，改變了日本在國際上的地位，並多次向周邊國家與地區發動侵略。請問：下列對於日本的相關敘述何者正確？
  options:
  - label: A
    content: 第一次世界大戰對德宣戰派兵到中國天津
  - label: B
    content: 逼迫段祺瑞政府接受二十一條要求
  - label: C
    content: 在中國發動濟南事件阻止北伐
  - label: D
    content: 要求段祺瑞恢復臨時約法。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 1-3
      title: 軍閥統治與南北分裂
      chapter: 第1章 中華民國的建立
    textbook: 八下歷史 1-3 軍閥統治與南北分裂
    labeled_by: ai
- id: doc_113_高雄_獅甲_社會_歷史_g8s2e1_s1_24
  section: 1
  number: 24
  type: single
  page: 1
  stem: 國民黨與共產黨在國共內戰前有兩次國共合作，雖最終都是不歡而散，但都影響當時中國的政治、社會甚大。請問：有關第一次國共合作的相關敘述何者正確？
  options:
  - label: A
    content: 起於聯俄容共政策
  - label: B
    content: 終於北伐完成
  - label: C
    content: 合作共同對抗日本的入侵
  - label: D
    content: 造成寧漢分裂後南京國民政府的親共。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 3-1
      title: 國民政府的成立與建設
      chapter: 第3章 現代國家的挑戰
