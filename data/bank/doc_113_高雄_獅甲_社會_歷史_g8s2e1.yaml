- id: doc_113_高雄_獅甲_社會_歷史_g8s2e1_s1_32
  section: 1
  number: 32
  type: single
  page: 2
  stem: 民國初年某外交事件的挫敗引起更多不同社會階層對於國家政治、外交的關心，更引發對以往北京政府親日政策的不滿。請問：有關此外交事件的相關敘述何者正確？
  options:
  - label: A
    content: 此事件是列強將廣州權利轉移給日本
  - label: B
    content: 此事件引發新文化運動
  - label: C
    content: 此事件所引發的抗議最早由學生所發起
  - label: D
    content: 此事件中人民喊出扶清滅洋的口號。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
