    labeled_by: ai
- id: doc_113_高雄_獅甲_社會_歷史_g8s2e1_s1_26
  section: 1
  number: 26
  type: single
  page: 1
  stem: 民國初年政治不穩，有諸多事件發生，當中二次革命與護法運動對於當時政局有許多衝擊，經常被拿來相提並論。請問：有關兩者的相關敘述何者正確？
  options:
  - label: A
    content: 兩者皆由國民黨孫中山所發起
  - label: B
    content: 兩者皆討伐袁世凱
  - label: C
    content: 兩者都由孫中山獲得最後勝利
  - label: D
    content: 兩者都發生在民國2 年。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 1-3
      title: 軍閥統治與南北分裂
      chapter: 第1章 中華民國的建立
