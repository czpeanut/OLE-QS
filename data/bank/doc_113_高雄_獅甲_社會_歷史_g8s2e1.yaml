- id: doc_113_高雄_獅甲_社會_歷史_g8s2e1_s1_27
  section: 1
  number: 27
  type: single
  page: 2
  stem: 中國共產黨是目前中國大陸的實際統治者，以共產思想治國，實施共產黨一黨專政。請問：有關共產主義在中國發展的敘述下列選項何者正確？
  options:
  - label: A
    content: 在法國指導下成立中國共產黨
  - label: B
    content: 在北伐完成後成立中國共產黨
  - label: C
    content: 在蔣中正的支持下進入國民黨
  - label: D
    content: 新文化運動時引進中國。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 2-1
      title: 新文化運動
      chapter: 第2章 舊傳統與新思潮
