- id: doc_113_高雄_獅甲_社會_歷史_g8s2e1_s1_28
  section: 1
  number: 28
  type: single
  page: 2
  stem: 北京大學是今日中國首屈一指的重要學術研究機構，曾有學者以「橫空出世非一般，繼往開來濟世觀。奮舞德賽自由劍，撥雲現日整乾坤。」來稱頌北京大學。請問：有關北京大學的相關敘述何者正確？
  options:
  - label: A
    content: 因只能教授新知識所以成為新文化運動重鎮
  - label: B
    content: 蔡元培當任校長奠定自由研究學風
  - label: C
    content: 是推動庚子後新政所設立的教育機構
  - label: D
    content: 其設立時間可以追溯到同治皇帝在位之時。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 2-1
      title: 新文化運動
      chapter: 第2章 舊傳統與新思潮
