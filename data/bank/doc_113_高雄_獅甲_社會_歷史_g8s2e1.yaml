    labeled_by: ai
- id: doc_113_高雄_獅甲_社會_歷史_g8s2e1_s1_33
  section: 1
  number: 33
  type: single
  page: 2
  stem: 西元1926 年《良友》雜誌在上海創辦。曾一度以當時的女明星、名媛、歌舞表演者的照片，作為畫報的封面人物，迅速成為風靡全球華人世界的雜誌。請問：此種以女性亮麗外型作為封面吸引大眾的做法，說明女性社會角色在當時有何轉變？
  options:
  - label: A
    content: 女性走出家庭不用處理家務
  - label: B
    content: 女性以家庭為重不為自己設想
  - label: C
    content: 女性以外型凸顯家庭社會地位尊貴
  - label: D
    content: 女性自主的觀念逐漸被接受。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 2-3
      title: 社會變遷
      chapter: 第2章 舊傳統與新思潮
