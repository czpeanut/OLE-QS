  section: 1
  number: 30
  type: single
  page: 2
  stem: 胡適對於人生各種問題研究主張要「大膽假設、小心求證」，不隨便在缺乏證據的情況下將任何理論奉為真理。請問：這種有幾分證據說幾分話的態度與新文化運動哪一思想最為接近？
  options:
  - label: A
    content: 共產主義
  - label: B
    content: 德先生
  - label: C
    content: 賽先生
  - label: D
    content: 重視禮教。
  tags:
