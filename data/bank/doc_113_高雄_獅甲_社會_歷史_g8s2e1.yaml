    labeled_by: ai
- id: doc_113_高雄_獅甲_社會_歷史_g8s2e1_s1_25
  section: 1
  number: 25
  type: single
  page: 1
  stem: 國民政府在中國近代史上具有相當大的影響，其位置曾經多次遷移，最後改名中華民國政府遷移至台北。請問：有關國民政府的相關敘述何者正確？
  options:
  - label: A
    content: 是北伐期間中華民國在國際上合法代表的政府
  - label: B
    content: 最早設立於上海
  - label: C
    content: 武漢國民政府是由蔣中正於清黨後所設立
  - label: D
    content: 寧漢合一合於南京國民政府。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 3-1
      title: 國民政府的成立與建設
      chapter: 第3章 現代國家的挑戰
