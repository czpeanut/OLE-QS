    labeled_by: ai
- id: doc_113_高雄_獅甲_社會_歷史_g8s2e1_s1_29
  section: 1
  number: 29
  type: single
  page: 2
  stem: 某篇報導介紹當時流行的德先生與賽先生時提及：「國家進步須有德先生與賽先生的參與，但要擁護那德先生，便不得不反對孔教、禮法；要擁護那賽先生，便不得不反對舊藝術、舊宗教。」請問：有關此報導的相關敘述何者正確？
  options:
  - label: A
    content: 此報導的內容與陳獨秀主張相符合
  - label: B
    content: 此報導內容鼓勵大家學習儒家思想
  - label: C
    content: 此報導鼓勵大家改信基督教
  - label: D
    content: 此報導認同中國固有文化的重要性。
  tags:
    chapter:
      publisher: 翰林
