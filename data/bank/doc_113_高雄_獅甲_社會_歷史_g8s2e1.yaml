- id: doc_113_高雄_獅甲_社會_歷史_g8s2e1_s1_31
  section: 1
  number: 31
  type: single
  page: 2
  stem: 胡適的〈文學改良芻議〉強調新文學必須走向大眾化，不能像過去太過強調格式的獨特、用詞的雕琢。請問：下列哪一選項最符合胡適新文學所強調的特徵？
  options:
  - label: A
    content: 白話文的寫作內容
  - label: B
    content: 強調內在情感的流露
  - label: C
    content: 引用聖賢者的名言佳句
  - label: D
    content: 要求對仗與平仄。
  tags:
