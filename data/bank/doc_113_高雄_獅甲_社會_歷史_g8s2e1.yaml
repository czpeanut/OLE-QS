    labeled_by: ai
- id: doc_113_高雄_獅甲_社會_歷史_g8s2e1_s1_34
  section: 1
  number: 34
  type: single
  page: 2
  stem: 中國現代兒童文學的發展在五四運動之後形成，強調文學內容應以兒童為中心，滿足兒童所需興趣。請問：以下哪一選項最符合當時現代兒童文學所強調的特點？
  options:
  - label: A
    content: 要求兒童學習唐詩三百首
  - label: B
    content: 以兒童繪畫研究兒童心理
  - label: C
    content: 教導兒童出社會應具備的技能
  - label: D
    content: 要求兒童行為禮貌。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 2-3
      title: 社會變遷
      chapter: 第2章 舊傳統與新思潮
