- id: doc_111_彰化_福興_國文_g8s1e3_s4_26
  section: 4
  number: 26
  type: single
  page: 2
  stem: 文中，歐陽脩認為小人無朋的原因為何？
  options:
  - label: A
    content: 有利則朋，無利則賊
  - label: B
    content: 國君猜忌，從中作梗
  - label: C
    content: 孤芳自賞，桀驁不群
  - label: D
    content: 宵衣旰食，戮力國事
  group_stem: '然臣謂小人無朋，惟君子有之。其故何哉？小人所好者利祿也，所貪者財貨也；當其同利之時，暫相黨引以為朋者，偽也。及其見利而爭先，或利盡而交疏，則反相賊害，雖其兄弟親戚，不能相保。故臣謂小人無朋，其暫為朋者，偽也。君子則不然。所守者道義，所行者忠義，所惜者名節；以之修身，則同道而相益，以之事國，則同心而共濟，終始如一。此君子之朋也。故為人君者，但當退小人之偽朋，用君子之真朋，則天下治矣。

    歐陽脩〈朋黨論〉


    　　臣聞朋黨之說，自古有之，惟幸人君辨其君子小人而已。大凡君子與君子，以同道為朋；小人與小人，以同利為朋；此自然之理也。'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
  answer:
  - A
  answer_source: answer_key_vlm
