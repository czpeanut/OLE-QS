  group_stem: '帝城春欲暮，喧喧車馬度。共道牡丹時，相隨買花去。

    貴賤無常價，酬直看花數。灼灼百朵紅，戔戔五束素。

    上張幄幕庇，旁織巴籬護。水灑復泥封，移來色如故。

    家家習為俗，人人迷不悟。有一田舍翁，偶來買花處。

    低頭獨長嘆，此嘆無人喻。一叢深色花，十戶中人賦。

    白居易〈買花〉'
