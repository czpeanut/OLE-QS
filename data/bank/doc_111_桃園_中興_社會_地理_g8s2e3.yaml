  section: 1
  number: 26
  type: single
  page: 3
  stem: 盧安達兩大種族之間的矛盾與紛爭，其主要原因為何﹖
  options:
  - label: A
    content: 兩族膚色迥異
  - label: B
    content: 宗族彼此對立
  - label: C
    content: 殖民歷史淵源
  - label: D
    content: 文化差異甚大。
  group_stem: '盧安達地理位置靠近赤道，為東非高原上的內陸小國，在近兩個世紀中，長期受到西方殖民統治。為了便於控制當地人民，西方人長期授權人數較少的圖西族統治人數較多的胡圖族，即使兩族之間外貌、語言、文化皆差異不大，卻仍導致族群之間矛盾日深。二十世紀後半，盧安達獨立建國後，長期受打壓的胡圖族取得政權，使得兩方的仇恨不斷加深。一九九○年代，由於盧安達兩大經濟作物價格走跌，導致經濟受到極大衝擊，加上西元1994
    年盧安達總統座機遭炸毀，導致兩族之間的矛盾升到最高點，也演變成日後的「百日大屠殺」，在各國的漠視下，有近百萬人死於內戰之中。

    請問：'
