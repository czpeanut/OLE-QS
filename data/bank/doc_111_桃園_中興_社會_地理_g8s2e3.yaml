- id: doc_111_桃園_中興_社會_地理_g8s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '下列框框內為小玉在研究2017 年非洲貿易現況時所發現的某些現象。

    非洲各國採取下列何項措施，最有可能有助於改善非洲這些現象？


    ＊肯亞是世界主要的花卉生產國，但在奈及利亞的花卉有八成來自荷蘭

    奈及利亞生產大量棕櫚油，但肯亞的棕櫚油主要進口自馬來西亞。

    ＊以洲內貿易的比例而言，非洲僅有15％，亞洲是58％，歐洲高達67％。

    ＊目前非洲大部分國家的貿易對象主要為歐盟國家、中國及美國。'
  options:
  - label: A
    content: 限定與非洲其他國家的進口配額，以保護本國產業
  - label: B
    content: 改善與其他洲的交通運輸，降低貨物的運輸成本
  - label: C
    content: 強化邊境的管制措施，防止鄰國非法貿易地進行
  - label: D
    content: 簽署非洲自由貿易協定，降低非洲國家間的關稅。
