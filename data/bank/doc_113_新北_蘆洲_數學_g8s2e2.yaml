- id: doc_113_新北_蘆洲_數學_g8s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '已知一線段其長為$\ell$，依下列步驟作圖：

    ❶作一線段$\overline{BC}$，使其長等於$\ell$。

    ❷以$B$ 點為圓心，$\ell$為半徑，在$\overline{BC}$上方畫弧。

    ❸以$C$ 點為圓心，$\ell$為半徑，在$\overline{BC}$上方畫弧。

    ❹步驟❷與步驟❸所畫的弧交於$A$ 點。

    ❺連接$\overline{AB}$、$\overline{AC}$。


    試問作圖完成後的$\triangle ABC$ 是甚麼三角形？'
  options:
  - label: A
    content: 鈍角三角形
  - label: B
    content: 直角三角形
  - label: C
    content: 正三角形
