- id: doc_113_新北_蘆洲_數學_g8s2e2_s2_9
  section: 2
  number: 9
  type: fill
  page: 3
  stem: '以下是”過圓外一點作垂線”的尺規作圖步驟：

    ❶已知直線$L$ 與線外一點$P$，先以$P$ 點為圓心，適當長為半徑畫弧，弧與直線$L$ 交於$A$、$B$ 兩點。

    ❷分別以$A$、$B$ 為圓心，大於 $\frac{1}{2}\overline{AB}$ 的相同長度為半徑，分別畫出兩弧交於$Q$ 點。

    ❸連接$\overline{PQ}$。


    以下是四位同學發表他們的高見：

    狄傲： 若連接$\overline{PA}$、$\overline{PB}$、$\overline{QA}$、$\overline{QB}$，那麼$\overline{PA}=\overline{PB}=\overline{QA}=\overline{QB}$

    衣吉： $L$ 一定是的中垂線。

    城太郎： $\overline{PQ}$ 與 $\overline{AB}$ 互相垂直。

    花晶艷： $\overline{PA}$ 與 $\overline{PB}$ 相等

    試問正確的有_____位。'
