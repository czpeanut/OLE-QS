- id: doc_113_新北_蘆洲_數學_g8s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: '以下是依照步驟所完成的圖形：

    ❶任意畫一個$\angle A$。

    ❷以$A$ 點為圓心，適當長為半徑畫弧，交$\angle A$ 兩邊於$B$、$C$ 兩點。

    ❸分別以$B$、$C$ 為圓心，大於$\frac{1}{2}\overline{BC}$的相同長度為半徑畫弧，設兩弧相交於$P$ 點。

    ❹連接$\overline{AP}$。


    根據作圖步驟所畫出來的圖，以下是四位同學的高見，請問敘述正確的有幾位？

    碗妹：$\overline{AB}=\overline{AC}$。

    吉弟：$\overline{BP}=\overline{PC}$。

    獄姊：$\angle BAP=\angle CAP$。

    蛋哥：$\triangle BAP$ 和$\triangle CAP$ 全等。'
  options:
  - label: A
    content: 一位
  - label: B
    content: 二位
  - label: C
    content: 三位
