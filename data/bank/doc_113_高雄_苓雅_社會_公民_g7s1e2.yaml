  - label: A
    content: 由一對夫妻及其未婚子女所組成
  - label: B
    content: 小家庭成員及其直系尊親屬同住
  - label: C
    content: 由數個具血緣關係的小家庭組成
  - label: D
    content: 家庭成員包含了姻親與旁系血親。
