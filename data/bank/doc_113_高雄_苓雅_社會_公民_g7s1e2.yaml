- id: doc_113_高雄_苓雅_社會_公民_g7s1e2_s1_44
  section: 1
  number: 44
  type: single
  page: 1
  stem: 為因應少子化現象，政府除了發給生育補助、托育費補助外，現行公務員與勞工在子女3 歲前，父母各可申請2 年育嬰假，總計不能超過2 年。另外父母各可申請半年有六成投保薪資的育嬰留職停薪津貼，但不可同時申請，希望能提高生育率。請問：政府推動育嬰假這項措施，是希望讓職業父母能有時間充分照顧孩子、陪伴孩子成長，且不需要辭職。因此較有可能申請育嬰留職停薪假的父母，其家庭型態多為下列何者？
