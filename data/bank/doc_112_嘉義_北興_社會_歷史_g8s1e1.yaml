  section: 1
  number: 4
  type: single
  page: 1
  stem: 唐朝王翰的〈涼州詞〉：「葡萄美酒夜光杯，欲飲琵琶馬上催。醉臥沙場君莫笑，古來征戰幾人回。」這首七言絕句中提到了葡萄、琵琶，關於這兩種物品的敘述何者正確？
  options:
  - label: A
    content: 約西元八世紀時由中國向外傳出
  - label: B
    content: 從長安－大秦這條路線傳入中國
  - label: C
    content: 從日本由海路傳入中國
  - label: D
    content: 最早從新羅走海路傳入中國。
- id: doc_112_嘉義_北興_社會_歷史_g8s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 漢武帝召見大臣，商討國家方針大政。曾作《天人三策》、讓漢武帝相見恨晚的董仲舒亦在其中。董仲舒提出「罷黜百家，獨尊□」，提出以各郡人口多寡定舉人之數以及「四科」之制，並建議成立太學培養人才。太學裡培養的人才，即教授□經典。請問□應最適合填上下列何者？
  options:
  - label: A
    content: 厲行法治
  - label: B
    content: 禮樂制度
  - label: C
    content: 佛學相關
  - label: D
    content: 儒家思想。
- id: doc_112_嘉義_北興_社會_歷史_g8s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 在中國紀念發起「一帶一路」全球基礎設施項目10 周年之際，最新數據顯示，中國向非洲提供的貸款跌落至近20 年來的最低水準。「一帶一路」是中共國家主席習近平於
    2014 年提出，全名為「絲綢之路經濟帶和 21 世紀海上絲綢之路」政策，其中陸路「絲綢之路」在中國歷史上，早於□已經開通，目的就是為了◎。請問□、◎應該分別填上何者？
  options:
  - label: A
    content: 漢朝；企圖與大月氏貿易，籌措攻打匈奴的經費
  - label: B
    content: 漢朝；聯絡西域各國，抵制匈奴
  - label: C
    content: 秦朝；因國力不敵匈奴，而開貿易路線
  - label: D
    content: 秦朝；為修長城，而開通購買國外材料的通道。
- id: doc_112_嘉義_北興_社會_歷史_g8s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 中央集權的國家除了仰賴賦稅制度維持帝國運作之外，還依靠著環環相扣的官僚集團協助帝國運作。但官員如何選拔一直困擾著歷代統治者，隨著時間的演進，我們可以從過去各朝官員選拔制度中看出何種變化？
  options:
  - label: A
    content: 階級愈來愈不流動，世族體系難以改變
  - label: B
    content: 貴族子弟較有機會入仕
  - label: C
    content: 愈來愈看重孝、廉等道德標準
  - label: D
    content: 隨著歷史發展，平民入仕的機會增加，透過自身努力改變身分地位的機率提高。
- id: doc_112_嘉義_北興_社會_歷史_g8s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 中國人大多是無神論、無宗教、中國民間信仰或這三者的混合，他們並不會專一的相信某個宗教或神明，而是根據自己的物質需求去隨時改信，此類人佔據中國人口的大多數，為73.56%；其餘虔誠的宗教信徒中，佛教徒佔15.87%，道教徒、巫薩以及各種神秘主義信仰共佔7.6%，基督新教徒佔2.19%，伊斯蘭教徒佔1.45%，天主教徒佔0.34%。佛教是中國主要信奉宗教之一，請問中國的佛教何時「廣為流傳」，成為中國民眾的精神寄託？
  options:
  - label: A
    content: 西漢
  - label: B
    content: 隋唐
  - label: C
    content: 東漢
  - label: D
    content: 魏晉南北朝。
