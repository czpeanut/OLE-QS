  stem: 每年的祭孔大典各地都認真籌畫，今年2023 年嘉義市祭孔大典依然由北興國中學生擔任佾生，北興國中早在二月份就開始密集訓練，就是希望典禮能順利進行。因為孔子有諸多貢獻所以備受尊敬，相關的祭典也都審慎辦理，請問下列關於孔子的敘述，何者最相關？
  options:
