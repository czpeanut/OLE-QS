  - label: A
    content: 秦朝
  - label: B
    content: 唐朝
  - label: C
    content: 三國
  - label: D
    content: 周朝。
  group_stem: 2022/09/28 10:37〔記者王善嬿／嘉義報導〕嘉義市各界紀念大成至聖先師2572 週年誕辰釋奠典禮，2022 年上午7 點在嘉義公園孔廟循古禮舉行，2021
    年因應武漢肺炎影響，縮小規模辦理並取消六佾舞，2022 年六六佾舞重新恢復，由北興國中學生進行六佾舞展演，另有港坪國小擔任樂生、東吳高職學生擔任禮生。市府教育處表示，9
    月28 日是至聖先師孔子誕辰，至聖先師一直是教育界效法、學習的對象，孔子曾經說過，三人行必有我師焉，希望透過這樣的紀念活動，可以讓嘉義市各界、孩子們對於孔子有更深一層的認識，緬懷至聖先師，為嘉義市的教育力奠定良好的基礎。
  shared_asset: g1_1_2
