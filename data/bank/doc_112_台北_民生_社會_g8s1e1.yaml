- id: doc_112_台北_民生_社會_g8s1e1_s1_19
  section: 1
  number: 19
  type: single
  page: 3
  stem: 中菲雙方在爭議南海的問題各執一詞，並各自尋求其他國家的支持，強化對爭議範圍的擁有權。請問:兩國主要是在何種國家要素有歧義?
  options:
  - label: A
    content: 人民、領土
  - label: B
    content: 領土、主權
  - label: C
    content: 政府、主權
  - label: D
    content: 人民、主權。
  group_stem: '※題組:請依題目內容回答 19~21。

    今年(2023 年)8 月 5 日，菲律賓海岸防衛隊正在護送數艘包租船，這些船為駐紮在仁愛暗沙的菲律賓軍事人員運送糧食、水、燃料和其他物資。菲律賓軍方和海岸防衛隊指控中國海警在補給任務中進行攔截、發射水砲，並向菲國海巡船發射高壓水柱的危險行為違反國際法，導致其中一艘包租船無法抵達仁愛暗沙進行補給。

    中國海警局聲稱，中方在仁愛礁問題上的立場是明確的。菲方「不顧中方警告」向仁愛礁擱淺軍艦運送「維修加固的建築物資」，中方才使用水炮警示。中方將繼續採取必要措施堅定維護，同時再次呼籲菲方接受中方建議，通過商談，探討管控仁愛礁局勢的具體措施。

    馬尼拉當局則表示將「永遠不會放棄」菲國在爭議南海地區控制的愛尤銀礁（即仁愛暗沙）

    (節取自中央社 2023.8.7.報導)

    爭議南海地區包含南沙群島與西沙群島，大部分為無人島，這兩個群島除了完整的島嶼，還包括數十個岩礁、環礁、沙洲與珊瑚礁，甚少開發，但從鄰近區域礦物資源觀察，周邊可能蘊藏天然資源。南海海域也是重要航道和漁場，維繫往來各方的生計。多國(如下圖)宣稱擁有西沙與南沙全部或部分，因此爭議不斷。'
  shared_asset: g1_19_21
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
