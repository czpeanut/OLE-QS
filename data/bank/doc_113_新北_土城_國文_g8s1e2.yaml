- id: doc_113_新北_土城_國文_g8s1e2_s2_25
  section: 2
  number: 25
  type: single
  page: 2
  stem: 根據本文，下列敘述何者正確？
  options:
  - label: A
    content: 先天腳趾有殘缺的鸚鵡大多是不影響健康的
  - label: B
    content: 通常吃種子的鸚鵡糞便為深綠色且水狀不成形
  - label: C
    content: 新手主人建議從成鳥開始飼養，心性穩定較好照顧
  - label: D
    content: 體型大的鸚鵡有較高的智商跟學習力，情緒比較穩定。
  group_stem: "第一次養鸚鵡就上手！作者：呂軍逸 \n挑選鸚鵡的入門指標與建議 \n    鸚鵡隸屬在鸚形目（Psittaciformes） ，世界約350\
    \ 多個種類，每種鸚鵡的個性都不同，甚至公母個性也有點差異。養鸚鵡並不一定要直接飼養成鳥或是從幼鳥開始養起比較理想，情況因人而異。無論如何，要挑選一隻適合自己的鸚鵡，除了要投眼緣、做足功課外，適合自己性格也很重要，這裡建議大家可以從以下幾個指標先觀察起：\
    \ \n1.眼睛：眼睛有神，不要一直閉著眼睛，並且沒有過多的分泌物。 \n2.精神：健康的鸚鵡精神狀況良好，可以嘗試用你的手指當成目標物，看他是否為好奇注視甚至想要追。\
    \ \n3.羽毛：盡量選擇顏色有光澤的個體，髒髒的羽毛或是有啄羽毛的個體要格外注意。也順便檢查排泄孔周遭羽毛狀況，是否有拉肚子的現象。 \n4.爪子：健康鸚鵡的腳有力，足夠抓握樹枝或是站架，也沒有軟腳的情況；爪子上面的小齒結構也會完整，但若是先天腳趾有殘缺或是後天物理性的受傷，其實很多個體是不影響健康的。\
    \ \n5.叫聲：因為鸚鵡常常利用鳴叫互相溝通，健康的鸚鵡叫聲會十分響亮乾淨，反之則低沉甚至不愛鳴叫；也可以順便觀察嘴部正常是完整閉合的，沒有明顯張嘴喘氣的現象。\
    \ \n6.糞便：健康的鸚鵡糞便會分成三個部分，固體糞便、白色尿酸跟透明液體，若糞便為水狀不成形，可能為腹瀉狀況，通常吃種子的鸚鵡為深綠色的糞便；除了觀察顏色跟形狀外，定期做寄生蟲的糞便篩檢，也是很重要的一環。\
    \ \n認識自己才能找到適合的鸚鵡 \n    選擇鸚鵡除了自己喜歡的個體外型外，還必須注意每隻鸚鵡的個性、大小、壽命⋯⋯等其他因素，筆者認為，選鸚鵡不是選一隻你喜歡的鸚鵡，而是認識自己的狀況等條件進而去選擇一隻適合陪伴你的鸚鵡。筆者整理一些飼養鸚鵡前，除了外觀挑選以外，需要考量的注意事項給大家一些參考和建議：\
    \ \n第一類：居家狀況 \n    首先，還是希望大家要先評估自己的狀況，像是有些鸚鵡品種會額外產生一些羽毛的碎屑跟粉塵，像是鳳頭鸚鵡、玄鳳鸚鵡以及非洲灰鸚鵡；空間問題也是很重要考量，一般會建議還是要能讓鸚鵡常出來活動，所以考量居家有多少空間可以擺放鳥籠或是站架，才接著去思考大概適合哪一個類型的鸚鵡；再來就是花費，小鸚鵡從幾百塊到數萬不等，相關周邊跟定期檢查所要花的費用也會有所不同，要衡量自己的經濟能力去做選擇。\
    \ \n第二類：體型大小 \n    我們大致把鸚鵡分成小、中、大型，如果是第一次養鸚鵡，可以選擇小型的虎皮鸚鵡、愛情鸚鵡或玄鳳鸚鵡，都是入門款且顏色多變的種類；若是希望稍微會講話互動的，中小型的乖巧的小太陽鸚鵡以及長相憨厚的和尚鸚鵡也是一個不錯的選擇；中大型則可以考慮最聰明的非洲灰鸚鵡或是較為安靜的折衷鸚鵡。另外，體型大小也跟他們的啃咬能力、破壞力以及居住空間相關，小型鸚鵡壽命約5～10\
    \ 年、中大型鸚鵡至少10 年以上甚至4～50 年，建議飼主要根據自己的需求購買，不要盲目花錢。 \n第三類：個性與習性 \n    鸚鵡的個性在不同物種間也有很大的不同，體型大的鸚鵡有較高的智商跟學習力，但也代表他們更需要陪伴跟容易產生情緒的問題，如果飼主住在公寓大樓內，可選擇比較安靜或是聲音不大聲的鸚鵡，像是虎皮鸚鵡、塞內加爾鸚鵡或賈丁氏等。美麗的金太陽椎尾鸚鵡，甚至一些中大型鸚鵡叫聲宏亮，會清晨鳴叫，是重點評估項目；吸蜜鸚鵡家族除了擁有豐富的顏色外，活潑的個性也是非常討人喜歡，但由於飲食為花粉關係，他們的糞便較稀，清理起來也比較麻煩。每隻鳥寶都有自己的個性跟生活習慣，建議飼主在養鸚鵡前應該多了解他們習性和個性，減少飼養後的習慣衝突。\
    \ \n鸚鵡種類繁多，時常讓人眼花撩亂，建議第一次養鳥寶的飼主，從幼鳥期開始飼養，先養一隻就好，如此也能累積經驗並跟自己的鸚鵡建立好深厚的情感，避免爭寵甚至生氣咬主人的問題產生。無論如何，鸚鵡的壽命不算太短，加上智商高，需要更多的照顧跟陪伴，請大家飼養前務必多做功課或是多向店家討論詢問，祝大家都能找到一隻合適又健康的鸚鵡寵伴。\
    \ \n（節錄自哈寵誌TW  2022/12/05 \nhttps://today.line.me/hk/v2/article/kEGaVPJ）"
  tags:
    chapter:
      publisher: null
      book: 八上
      subject: 國文
      code: null
      title: null
      chapter: null
    textbook: 八上 第2次段考範圍
