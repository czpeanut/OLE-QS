  section: 1
  number: 16
  type: single
  page: 1
  stem: 愛因斯坦說：「凡是對人類生活提高有大貢獻者，應當是最受愛戴的人，這一點在原則上是對的。但是如果要求別人承認自己比同伴或者同學更高更強，或者更有才智，那就容易在心理上產生唯我獨尊的態度，這無論對個人或對社會都是有害的。」這段話所表達的意涵，與下列何者最接近？
  options:
  - label: A
    content: 有能力的人一旦自大狂妄更容易造成危險
  - label: B
    content: 越有能力的人越會表現出唯我獨尊的態度
  - label: C
    content: 人們應該愛戴對人類生活提高有大貢獻的人
  - label: D
    content: 承認別人比自己更高更強更有才智是有害的。
  tags:
