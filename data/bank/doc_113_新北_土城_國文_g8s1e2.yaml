  section: 1
  number: 17
  type: single
  page: 1
  stem: 陶宗儀南村輟耕錄：「五臺山有鳥，名寒號蟲。四足，肉翅，不能飛，其糞即五靈脂。當盛暑時，文采絢爛，乃自鳴曰：『鳳凰不如我。』」比至深冬嚴寒之際，毛羽脫落，索然如鷇雛，遂自鳴曰：『得過且過。』」本文主要是在諷刺哪一種人？
  options:
  - label: A
    content: 言行不一，卻自吹自擂的人
  - label: B
    content: 明哲保身，卻不顧他人的人
  - label: C
    content: 學藝不精，卻自以為是的人
  - label: D
    content: 自鳴得意，卻不思上進的人。
