- id: doc_113_高雄_獅甲_社會_歷史_g8s2e2_s1_24
  section: 1
  number: 24
  type: single
  page: 1
  stem: 大雄在首都參加慶祝中華民國成立的紀念大會，見到街道上國民黨黨旗飄揚天際，民眾一邊高呼『勿忘國恥』、『抵制日貨』等口號，一邊用著法幣購買肉包。請問：有關大雄當時生活的相關敘述何者正確？
  options:
  - label: A
    content: 大雄可以參加新軍對抗八國聯軍
  - label: B
    content: 大雄可以看見溥儀巡視各地
  - label: C
    content: 大雄可以用中央銀行鈔票購買肉包
  - label: D
    content: 大雄可以參加全民煉鋼為國家盡一分貢獻。
