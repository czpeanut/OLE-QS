  stem: 獅甲國中在穿堂展出特展，為求學生感受真實，學校特別製造兩個土高爐，並邀請中鋼人員示範如何操作，藉此認識1950 年代中國的獨特政策。請問：下列口號何者與此特展主題相關度最高？
