  section: 1
  number: 19
  type: single
  page: 1
  stem: 國父孫中山先生主張國家建設的歷程會歷經軍政、訓政、憲政三階段。請問：有關這三階段的敘述何者正確？
  options:
  - label: A
    content: 北伐結束後進入訓政
  - label: B
    content: 十年建設屬於憲政時期
  - label: C
    content: 中日戰爭爆發進入憲政時期
  - label: D
    content: 軍政時期爆發國共內戰。
