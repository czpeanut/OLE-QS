  section: 1
  number: 32
  type: single
  page: 2
  stem: 部分美國人將西元1941 年視為世界大戰開始，因為這一年是美國正式參加世界大戰的第一年，此觀點與中國將1937 年視為世界大戰第一年有很大差異。請問：西元1941
