  section: 1
  number: 26
  type: single
  page: 1
  stem: 右圖是近代中國1960 年代國內的一場重要運動，當時造成中國政治、經濟、社會各方面都產稱極大動盪。請問：有關此一運動的相關敘述何者正確？
  options:
  - label: A
    content: 此運動被稱為黃金十年
  - label: B
    content: 此運動是鄧小平所發起
  - label: C
    content: 此運動主張破四舊立四新
  - label: D
