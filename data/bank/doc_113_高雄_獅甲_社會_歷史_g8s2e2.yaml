  section: 1
  number: 22
  type: single
  page: 1
  stem: 某『戰爭』改變了一切，原列強在晚清所拿到的中國特權，如領事裁判權、片面最惠國等，皆因重新簽訂平等新約，這些權利將一去不復返。請問：有關此戰爭的相關敘述何者正確？
  options:
  - label: A
    content: 此戰爭是指甲午戰爭
  - label: B
    content: 此戰爭最後中國獲勝
  - label: C
    content: 此戰爭中國與美國為敵對國家
  - label: D
    content: 此戰爭最後簽訂新丑和約。
