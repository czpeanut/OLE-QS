  number: 31
  type: single
  page: 2
  stem: 附圖是中國國民黨與中國共產黨的分合示意圖，兩黨的發展影響著現代中國的歷史走向。圖中的甲事件使得中共勢力縮減，直到西安事變才轉危為安。有關甲事件的出現與下列何人關係最為密切？
