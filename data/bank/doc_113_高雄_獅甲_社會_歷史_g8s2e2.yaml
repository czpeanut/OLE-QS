  type: single
  page: 2
  stem: 『外交教父』沈昌煥，蔣中正相當倚重的外交人才，從西元1946 年開始直到1988 年解除職務為止，曾出任外交部長與駐外大使，長年主導外交政策。請問：下列何者最有可能為沈昌煥經歷過的重大事件？
  options:
  - label: A
    content: 推動聯俄容共政策
  - label: B
    content: 解除西安事變危機
  - label: C
    content: 參與開羅會議
  - label: D
    content: 中華民國政府遷移來台。
