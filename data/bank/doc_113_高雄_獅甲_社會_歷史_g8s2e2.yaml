- id: doc_113_高雄_獅甲_社會_歷史_g8s2e2_s1_21
  section: 1
  number: 21
  type: single
  page: 1
  stem: 民國初年共產主義傳入中國，其在中國發展的時間並不長，但中國共產黨卻是現今中國大陸的主要統治者，影響中國政治、社會甚大。請問：有關中國共產黨的相關敘述何者正確？
  options:
  - label: A
    content: 國共內戰後與國民黨共同抗日
  - label: B
    content: 從江西瑞金展開長征
  - label: C
    content: 民國二十年與國民黨攜手北伐
  - label: D
    content: 曾獲得美國支持打贏國共內戰。
