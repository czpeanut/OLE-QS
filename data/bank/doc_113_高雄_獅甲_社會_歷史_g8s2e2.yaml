  section: 1
  number: 27
  type: single
  page: 2
  stem: 小瑋響應政府當時所推行的「四萬換一塊」政策，排隊等著拿到新台幣，雖是為了減緩戰爭帶來的通貨膨脹問題，但卻也引發人民對於政府的怨恨。請問：以下選項何者最有可能出現在小瑋所生存的年代？
  options:
  - label: A
    content: 因憲法保障，小瑋可以上街頭示威抗議
  - label: B
    content: 因憲法保障，總統不能無限制連任
  - label: C
    content: 戰爭還沒結束憲法就頒布了
  - label: D
    content: 最終因美國調停結束戰爭。
