- id: doc_113_高雄_獅甲_社會_歷史_g8s2e2_s1_18
  section: 1
  number: 18
  type: single
  page: 1
  stem: 歷史老師上課時提到中國某一時期有以下的評論：「這十年中國完成了許多重要建設，對中國來說相當的寶貴，如果沒有這十年，絕對不可能有對日作戰的成功。」。請問：有關此一時期的相關敘述何者正確？
  options:
  - label: A
    content: 這十年是指民國17 到27 年
  - label: B
    content: 此一時期改關稅自主為關稅協定
  - label: C
    content: 此一時期中國共產黨一黨獨大
  - label: D
    content: 此一時期的交通建設奠定對日作戰勝利基礎。
