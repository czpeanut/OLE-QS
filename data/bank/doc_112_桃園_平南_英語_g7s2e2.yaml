    Follow the steps, and you can make yummy mashed potatoes. It’s very easy.

    What do you do?

    First, take the skin off the potatoes.

    Second, cut the potatoes into slices.

    Third, put the potatoes and some salt into a big pot of water, and then cook for
    15 minutes.

    Fourth, take the potatoes out of water. Mash them in the bowl.

    Last, put one cup of milk and some butter into the bowl. Mix them together.


    What do you get?

    Enjoy your yummy mashed potatoes!

