- id: doc_111_嘉義_北興_社會_地理_g9s2e1_s1_39
  section: 1
  number: 39
  type: single
  page: 4
  stem: 關於那瑪夏區由「蚊仔只」、「瑪雅」、「三民」到「那瑪夏」的變化，下列哪個說法最為恰當？
  options:
  - label: A
    content: 地名會隨著當地族群、政權等因素而改變
  - label: B
    content: 那瑪夏區的原住民族群一直少於漢人人口
  - label: C
    content: 這些名稱皆能顯示當地的原住民族的文化
  - label: D
    content: 「蚊仔只」帶有漢人對當地原住民族的貶意
  group_stem: "◎請閱讀下文，並回答相關問題(39-40 題)：\n\n    高雄縣 那瑪夏鄉（今高雄市 那瑪夏區），早年稱為蚊仔只（Báng-á-tsí），源自閩南語對當地原住民族語「Mangacun」的譯寫。民國37\
    \ 年，政府依據這個拼音設立「瑪雅鄉」。民國47 年，鄉內的三個村分別被更名為「民族」、「民權」、「民生」，鄉名也被改稱政治意涵濃厚的「三民鄉」。\n  \
    \  那瑪夏鄉大多數居民為卡那卡那富族、布農族。正名過程中，鄉內不同族群經多次折衝討論，民國96 年鄉民代表會正式通過採用「那瑪夏鄉」，並於民國97 年元旦正名。「那瑪夏」在卡那卡那富族語有「楠梓仙溪」的意思，在布農族語則代表著「愈來愈好」。"
