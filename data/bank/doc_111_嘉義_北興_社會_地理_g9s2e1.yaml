- id: doc_111_嘉義_北興_社會_地理_g9s2e1_s1_36
  section: 1
  number: 36
  type: single
  page: 4
  stem: 根據文章，土虱灣的命名原則，與下列何者相同？
  options:
  - label: A
    content: 六腳
  - label: B
    content: 五峰
  - label: C
    content: 東石
  - label: D
    content: 延平
  group_stem: "◎請閱讀下文，並回答相關問題(36-38 題)：\n\n    位於南投縣信義鄉地利村的土虱灣，因形似土虱而得名，有「最完美曲流」之稱。濁水溪在此地大幅度地迴旋300\
    \ 度，因其群峰環繞、景色優美，且人們只要在臺 16 線省道旁即可拍攝到完整的土虱灣景觀，使得土虱灣成為當地著名的景點。\n    臺灣俗稱的「土虱」為原產於東南亞的一種魚類，「土虱灣」即是因曲流走向近似土虱而獲名。南投縣信義鄉為布農族為主的山地原住民鄉，居民們在推廣觀光時，規劃一系列與部落相關的景點與體驗活動，發現「土虱」的名稱與在地文化較無關聯，顯得格格不入。當地居民開始研擬投票改名的活動，希望能與在地更有連結。"
