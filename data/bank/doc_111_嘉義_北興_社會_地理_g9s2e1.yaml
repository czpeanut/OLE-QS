- id: doc_111_嘉義_北興_社會_地理_g9s2e1_s1_34
  section: 1
  number: 34
  type: single
  page: 3
  stem: 根據上文內容與附表，請判斷下列敘述何者正確？
  options:
  - label: A
    content: 有些與「鹿」有關的地名，跟獵鹿活動有關
  - label: B
    content: 東部地區並沒有梅花鹿的分布
  - label: C
    content: 和「鹿」有關的地名多在山地附近
  - label: D
    content: 「尖子鹿」是原住民對當地的稱呼，而音譯為漢字
  group_stem: "◎請閱讀下文，並回答相關問題(34-35 題)：\n\n    15 世紀末，歐洲發現通往亞洲的新航路後，帝國主義也隨之擴張到亞洲，臺灣的荷蘭時代就是由此而來。荷蘭人將臺灣作為轉口貿易的據點，而臺灣出產的稻米、蔗糖、鹿皮，也成為轉口貿易下的商品。\n\
    \    鹿皮成為重要的貿易商品後，荷蘭人便致力於鹿皮的收集與獨占，並以日常用品或奢侈品與原住民交換鹿皮。荷蘭人也僱用漢人獵鹿，漢人引進更有效率的獵捕方式，使得鹿群快速減少。1969\
    \ 年，臺灣梅花鹿在野外絕跡。直至1984 年，政府才開啟梅花鹿的復育工作。\n    目前各地仍留下許多與鹿有關的地名，例如：鹿寮、鹿坑（鹿窟）、鹿埔、鹿鳴坑、打鹿埔等，都與鹿群棲息或與獵鹿有關。此外，還有形容鹿的形狀的地名，例如：尖仔鹿。由這些地名，可以遙想早期梅花鹿遍布全臺的盛況。\n\
    \n表 臺灣與鹿相關的聚落名數目\n| 地區 | 數目 |\n| :--- | :--- |\n| 北部地區 | 38 個 |\n| 中部地區 | 51 個\
    \ |\n| 南部地區 | 43 個 |\n| 東部地區 | 23 個 |"
