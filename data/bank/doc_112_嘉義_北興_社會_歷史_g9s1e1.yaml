  section: 1
  number: 14
  type: single
  page: 1
  stem: 「這個地區小山多、海岸曲折、島嶼眾多，各地往來交通不便，因此形成獨立的城邦政治」。根據上文內容，它指的是下列何地？
  options:
  - label: A
    content: 印度
  - label: B
    content: 希臘
  - label: C
    content: 波斯
  - label: D
    content: 埃及。
