- id: doc_112_嘉義_北興_社會_歷史_g9s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 「雅典」和「斯巴達」這兩個古希臘城邦，在希臘歷史上的發展特色為何？
  options:
  - label: A
    content: 斯巴達曾領導希臘各城邦在波希戰爭中擊敗波斯
  - label: B
    content: 斯巴達的文化藝術發達，號稱是「全希臘的學校」
  - label: C
    content: 雅典政治為軍事統治，斯巴達則宣揚民主的精神
  - label: D
    content: 雅典採取抽籤任官制；斯巴達相當注重軍事訓練。
- id: doc_112_嘉義_北興_社會_歷史_g9s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 天神宙斯好色多情，常常誘騙美少女；天后赫拉狠毒善嫉，忙著報復小三…這些神話人物如同連續劇一樣，投射出人生百態，請問這樣的神話故事源自於哪個文明？
  options:
  - label: A
    content: 羅馬
  - label: B
    content: 希臘
  - label: C
    content: 印度
  - label: D
    content: 西亞。
