  section: 1
  number: 15
  type: single
  page: 2
  stem: 有關羅馬帝國的衰弱與滅亡，請選出正確敘述：
  options:
  - label: A
    content: 遭受亞歷山大的征服而分裂
  - label: B
    content: 西羅馬帝國亡於匈奴人
  - label: C
    content: 大型公共工程負擔過重，導致人民反抗
  - label: D
    content: 東羅馬帝國亡於鄂圖曼土耳其人。
