- id: doc_112_嘉義_北興_社會_歷史_g9s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 約自西元前3500年開始上古時代，分散在不同地區的人類陸續發展出高度文明，例如：西亞的蘇美、非洲古埃及。請問：蘇美和埃及文明，下列哪項敘述有誤？
  options:
  - label: A
    content: 都出現文字
  - label: B
    content: 都創造曆法
  - label: C
    content: 都是一神信仰
  - label: D
    content: 都具有數學成就。
- id: doc_112_嘉義_北興_社會_歷史_g9s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 現今的印度人口，已經超過 14 億人。但是平均識字率，只有約 63％。如果只看「最低種姓」階層的識字率，更是只有 55％。這種社會階層的差距，來自哪一種宗教觀念？
  options:
  - label: A
    content: 眾生平等，可以靠努力修行獲得解脫
  - label: B
    content: 上帝唯一，虔誠信仰者可以升入天國
  - label: C
    content: 善惡二元，光明與正義一定戰勝邪惡
  - label: D
    content: 輪迴轉世，前生的惡業造成今生的苦果。
