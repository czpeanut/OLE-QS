  section: 1
  number: 16
  type: single
  page: 2
  stem: 「木馬屠城記」的前提有金蘋果神話鋪陳，這場特洛伊戰爭以史學家的觀點而言大致認為是可信度頗高的歷史。請問相關史料應出自何人之手？
  options:
  - label: A
