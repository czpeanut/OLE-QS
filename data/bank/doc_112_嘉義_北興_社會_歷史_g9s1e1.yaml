  section: 1
  number: 5
  type: single
  page: 1
  stem: 倫敦博物館現存一顆歷史悠久的石碑，被命名為「倫敦銘文」，以拉丁文記錄西元二世紀的倫敦地區政局…，請問此石碑見證了哪一政權？
  options:
  - label: A
    content: 亞歷山大帝國
  - label: B
    content: 羅馬帝國
  - label: C
    content: 波斯帝國
  - label: D
    content: 鄂圖曼土耳其帝國。
- id: doc_112_嘉義_北興_社會_歷史_g9s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 有關佛教在印度創立時的背景，下列敘述何者正確？
  options:
  - label: A
    content: 相信巴勒斯坦是上帝賜給他們的土地
  - label: B
    content: 不滿階級森嚴的種姓制度，主張眾生平等
  - label: C
    content: 不滿多神信仰的婆羅門教，堅持一神信仰主張
  - label: D
    content: 相信善神與惡神對立，善神必勝。
- id: doc_112_嘉義_北興_社會_歷史_g9s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 故宮博物院在2007A.D.舉辦大英博物館收藏展，其「不幸的木乃伊」木棺蓋（如下圖）最引人注目。請問埃及人製作木乃伊的動機是？
  options:
  - label: A
    content: 為了輪迴所需而製作
  - label: B
    content: 為了遵守社會階級而製作
  - label: C
    content: 為保存身體完整以便來生所用
  - label: D
    content: 為成為上帝選民必要的程序。
  assets:
