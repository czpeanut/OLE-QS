  section: 1
  number: 12
  type: single
  page: 1
  stem: 大英博物館收藏一尊姿態動感同時又具有威嚇形象的濕婆雕像，可說是該館的明星展件，其破壞與再生法力總令人敬畏不已。請問濕婆是哪一宗教的重要神祇
  options:
  - label: A
    content: 猶太教
  - label: B
    content: 婆羅門教
