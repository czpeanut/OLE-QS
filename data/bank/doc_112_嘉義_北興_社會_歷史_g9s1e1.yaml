  section: 1
  number: 18
  type: single
  page: 2
  stem: 震宇在歷史課聽到一首歌，歌詞如下：「古巴比倫王頒布了《漢摩拉比法典》，刻在黑色的玄武岩，距今已經三千七百多年，……用楔形文字刻下了永遠，那已風化千年的誓言，一切又重演……」這首歌詞的創作靈感是來自下列哪一古文明？
  options:
