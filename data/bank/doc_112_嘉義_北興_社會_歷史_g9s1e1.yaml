  - label: A
    content: 漢帝國
  - label: B
    content: 馬其頓王國
  - label: C
    content: 羅馬帝國
  - label: D
    content: 波斯帝國。
- id: doc_112_嘉義_北興_社會_歷史_g9s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 金庸小說《倚天屠龍記》男主角張無忌，信仰拜火教，其特色是崇拜光明、以火為尊，並講究善惡的對立。請問這個宗教可能是？
  options:
  - label: A
    content: 婆羅門教
  - label: B
    content: 猶太教
  - label: C
    content: 祆教
  - label: D
    content: 基督教。
- id: doc_112_嘉義_北興_社會_歷史_g9s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 印度是一個文化多元的國度，不但有傳統的婆羅門教、佛教、印度教，也有外來的伊斯蘭教與基督教信仰。請問目前印度信奉人口最多的宗教？
  options:
  - label: A
    content: 婆羅門教
  - label: B
    content: 佛教
  - label: C
    content: 印度教
  - label: D
    content: 伊斯蘭教。
