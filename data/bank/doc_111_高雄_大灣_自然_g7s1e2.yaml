  stem: 小妤跟父母親一同到美國 優勝美地公園玩，看到有一棵樹的樹幹直徑達十一公尺，汽車可由樹根底部中央的裂洞通過，這棵樹木雖然中空了，但是植物還是枝葉茂盛。請問為什麼這樣子樹木還有辦法活下去？
