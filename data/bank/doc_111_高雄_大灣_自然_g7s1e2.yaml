  type: single
  page: 1
  stem: 下列關於人體血液循環的敘述何者正確？
  options:
  - label: A
    content: 人體若受到病原體的侵襲，會產生各種免疫反應。因此可以藉由檢查血液中紅血球的數量，來判斷人體是否受到感染
  - label: B
    content: 體循環由左心房出發，充氧血由主動脈運送至全身
  - label: C
    content: 去醫院做血液檢查時，護士會由人體的動脈抽取血液
  - label: D
    content: 肺循環中，二氧化碳由微血管擴散進入肺泡。
