- id: doc_113_屏東_明正_英語_g8s2e3_s5_1
  section: 5
  number: 1
  type: single
  page: 2
  stem: Why does a company use “planned obsolescence” in their product?
  options:
  - label: A
    content: To save money on making products.
  - label: B
    content: To make more money.
  - label: C
    content: To get the products’ price higher.
  - label: D
    content: To trick people into using their products.
  group_stem: 'The Lies in the Products

    You might have experienced this: Right after the warranty ended, your earphones
    were out of order. You took them back to the store, and the shopkeeper told you,
    “It’s cheaper to get new ones.” You didn’t think too much and got a new pair.
    But did you know this might be a trick by big companies?

    Some companies’ products will not last for a long time. This way, their old customers
    have to keep buying new ones. This action is called planned obsolescence. One
    of the most famous examples happened in 1925. A few light bulb companies had a
    meeting and decided to join forces. They all agreed to cut down the life of their
    light bulbs from 2,500 hours to 1,000 hours, so people had to buy them more often.

    Planned obsolescence is still happening today. Although there are laws against
    it, most companies can just find ways and get around these laws. In the end, more
    of our money goes into their pockets, and we don’t even know it.

    📖 warranty 保固 earphones 耳機 product 產品 light bulb 燈泡'
  ai_answers:
    gemini: B
    qwen: B
  answer:
  - B
