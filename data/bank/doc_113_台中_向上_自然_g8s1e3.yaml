  section: 1
  number: 1
  type: single
  page: 1
  stem: 關於「熱平衡」的敘述，何者正確？
  options:
  - label: A
    content: 兩個物體接觸時，熱量產生流動，最後兩者熱量相等
  - label: B
    content: 兩物接觸時，熱量從溫度高者流向溫度低者，最後兩者溫度一致
  - label: C
    content: 兩物接觸時，熱量從熱量高者流向熱量低者，最後兩者溫度一致
  - label: D
    content: 溫度不同的兩物接觸，熱量低者的會吸收熱量，熱量高者的會放出熱量。
