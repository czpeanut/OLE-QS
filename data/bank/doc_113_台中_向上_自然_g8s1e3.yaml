    content: 油的溫度上升比水快，是因為油比熱較大
  - label: B
    content: 水的溫度上升比油慢，是因為水吸熱較少
  - label: C
    content: 兩者加熱時間相同時，溫度的變化也相同
  - label: D
    content: 若升高相同的溫度，水吸收的熱量比油多。
