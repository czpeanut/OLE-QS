  - label: A
    content: 吸收相同的熱量，比熱愈大的物質，溫度的變化愈大
  - label: B
    content: 比熱是物質的特性之一，不同的物質有不同的比熱
  - label: C
    content: 烈日下，沙灘比海水溫度更易上升，這是因為沙灘的比熱比海水大
  - label: D
    content: 水的比熱較小，一般自助餐業者將熱水置於盤下，用來維持餐點溫度
