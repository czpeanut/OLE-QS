- id: doc_113_新北_丹鳳_社會_g7s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 臺灣是個四周臨海的海島，有著多樣的海岸景觀，可以欣賞墾丁珊瑚礁、 清水斷崖、野柳女王頭、七股沙岸風景，適合觀光。文中敘述的『清水斷崖』，多為高聳的懸崖峭壁，甲、形成○○的海岸線，因是乙、○○○○逼近太平洋，造成此海岸類型的成因主要是由丙、○○○○作用力造成的，且丁、不利發展
    ○○。請問：甲、乙、丙、丁的 2 個○○ 或4 個○○○○ 所代表的答案，下列哪一項是錯誤的？
  options:
  - label: A
    content: 甲、平直
  - label: B
    content: 乙、海岸山脈
  - label: C
    content: 丙、板塊擠壓
  - label: D
    content: 丁、航運
