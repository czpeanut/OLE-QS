- id: doc_113_新北_丹鳳_社會_g7s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 台灣地形景觀多樣化，這些景觀的形成由何種原因所造成？ 甲、颱風過後大量土石流從山上沖刷下來，農田與房屋被土石覆蓋，是由內營力造成的；  乙、太魯閣峽谷是河川下切作用造成的；
    丙、位台灣海峽西側的大屯火山群是由火山活動形成的； 丁、地球板塊運動發生時，會伴隨火山爆發或地震發生。以上敘述何者是正確的答案：
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 甲丙
  - label: C
    content: 乙丙
  - label: D
    content: 乙丁
