  type: single
  page: 3
  stem: '下列是一場戰事結束後，參戰雙方協議之後所訂立條款的部分內容：

    一、雙方都要把戰爭所造成的一切仇恨遺忘。

    二、熱蘭遮城及其城外的工事、大炮與其他武器，糧食、商品、貨幣及所有其他物品，凡屬於公司的都要交給國姓爺。

    三、米、麵包、葡萄酒、燒酒、肉、鹹肉、油、醋、繩子、帆布、瀝青、柏油、錨、火藥、子彈、火繩及其他屬於公司的物品，其中所有被包圍者從此地到巴達維亞航程中的必需品，長官及議員們得自行裝進在泊船處及海邊的公司船隻。

    四、現居於福爾摩沙的漢人中，若還有人向公司負債，其負債金額和原因，都將從公司的簿記中抄錄出來，交給國姓爺

    五、屬於公司的所有官方文件，都得以帶回巴達維亞。

    上述協議成立後，造成了下列哪種影響？'
  options:
