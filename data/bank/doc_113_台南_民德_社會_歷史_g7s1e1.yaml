  stem: '下列為16、17 世紀時西方某公司的大事記，依內容研判，該公司隸屬於哪一個國家？

    一、第一個可以自組傭兵、發行貨幣的公司。

    二、被獲准與其他國家訂立正式條約，並對該地實行殖民與統治的權力。

    三、在爪哇的巴達維亞建立亞洲總部，其他的據點設立在東印度群島、香料群島上。

    四、17 世紀初曾企圖占領澎湖，以建立城堡作為貿易據點。

    五、1624 年統治當時未有實質政府統治的福爾摩沙島。'
