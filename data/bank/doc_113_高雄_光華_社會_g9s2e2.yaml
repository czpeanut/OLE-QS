  stem: 「法西斯」之名源於古代某一橫跨歐亞非的大帝國，為執政官的侍衛官所執的前導儀仗，象徵全國最高的權力。以「法西斯」命名的政黨，西元1922 年在領導者的號召下，黨徒向首都出發，隨後取得政權。請問：關於此黨的敘述何者正確？
