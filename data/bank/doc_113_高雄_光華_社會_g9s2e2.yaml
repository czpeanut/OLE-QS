  group_stem: '國際刑警組織(INTERPOL)成立於西元1923 年，是目前僅次於聯合國的第二大國際組織。該組織旨在保障並促進世界上不同的警察機構間互相幫助，在犯罪國際化日趨嚴重的情勢下，國際社會的每個成員都應該要努力維護世界的安全。南韓國會議員在西元2021
    年11 月公開表示，臺灣曾在西元2018 年與南韓合作，成功破獲從泰國走私的112 公斤冰毒案例，但自西元1984 年中國加入國際刑警組織之後，臺灣已經被排除在外長達37
    年。議員更強調，排除臺灣參與國際刑警組織，對恐怖主義、非法毒品、電話詐騙、網路詐騙等全球化犯罪毫無幫助，因此呼籲為了韓國國民的生命安全、預防世界犯罪，請支持讓臺灣獲得國際刑警組織的觀察員資格。

