- id: doc_113_新北_忠孝_社會_公民_g9s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 快時尚是指可以在很短的時間將時裝周中展出的潮流服飾推出的商業模式。快速方便、款式多樣性、便宜、流行是快時尚的優點，以平價路線吸引消費大眾，其代表有
    H&M、Zara、Forever 21、無印良品與 UNIQLO 等品牌。但兼顧「快速、優質、低價」的快時尚，上新速度和價格方面的優勢不再，2019 年9
    月 Forever 21 宣布破產，「轉型」成了快時尚品牌眼前最迫切的的課題，如 H&M、GAP 宣布推出服裝租賃服務，消費者可以在店內試穿，也可以在網路上提前預訂，店內設計師還會提供穿搭建議。請問：要在激烈的市場競爭中生存下去，「轉型」是重要的課題，其所謂的「轉型」是指下列何者？
