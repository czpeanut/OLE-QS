  stem: 描述一件事物時，轉變其原來性質，使它成為另一種本質完全不同的事物，再加以形容的修辭法稱為「轉化」。如詩中所述：「我以軟弱的喙向外敲擊緊蓋的殼」，請問下列何者亦使用相同修辭？
