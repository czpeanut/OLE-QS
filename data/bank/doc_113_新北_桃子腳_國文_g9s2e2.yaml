  stem: '《天工開物》:「凡種荻甘蔗，冬初霜將至，將甘蔗斫伐，去杪①與根，埋藏土內。雨水②前五六日，天色清明即開出，去外殼，斫斷約五六吋長，以兩個節為率。密佈地上，微以土掩之，頭尾相枕，若魚鱗然。芽自節出，兩芽平放，不得一上一下，致芽向土難發。」依據上文，關於種甘蔗的方法，下列說明何者正確?

