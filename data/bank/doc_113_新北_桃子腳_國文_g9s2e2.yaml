- id: doc_113_新北_桃子腳_國文_g9s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: '石崇與王愷爭豪，並窮綺麗，以飾輿服。晉武帝，愷之甥也，每助愷，嘗以一珊瑚樹高二尺許賜愷。枝柯扶疏，世罕其比。愷以示崇。崇視訖，以鐵如意擊之，應手而碎。愷既惋惜，又以為嫉己之寶，聲色甚厲。崇曰：「不足恨，今還卿。」乃命左右悉取珊瑚樹，有三尺四尺，條幹絕世，光彩溢目者六七枚，如愷許比甚眾。愷惘然自失。──《世說新語》

    下列文句（ ）中所應填入的主語，何者正確？'
  options:
  - label: A
    content: （ ）嘗以一珊瑚樹，高二尺許賜愷──石崇
  - label: B
