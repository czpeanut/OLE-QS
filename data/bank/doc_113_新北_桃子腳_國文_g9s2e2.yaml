    content: 若膳食準備不足，慈禧太后會讓皇后、妃嬪先用膳
  - label: D
    content: 慈禧太后常邀集皇后、妃嬪前來，分享自己的點心
  group_stem: "請閱讀以下文章，並回答31~32 題：\n    孝欽① 喜食燒烤與醬及麥類，餅為炕餅、蒸餅、椒鹽餅、甜餅，亦有以肉為餡者，其式為龍形、蝶形、花形，又有大米小米粥、綠豆糕、花生糕帶甜湯，凡此種種，皆常膳所必備者也。米飯以玉田稻米為之，長及寸，有胭脂、碧粳諸名。常膳必備粥，至五十餘種之多，稻粱菽麥無所不有，故每餐所耗輒需百金。\n\
    \    御廚供膳，小菜俱盛以碟，如醃西瓜皮之類，亦燦然大備，其味精絕，聞別有泡製之方。大梨切為塊，以蜜漬之，尤為雋味，諸王大臣時蒙撤賜。孝欽晚年，時患咳，故以此代滋潤之品焉。水皆於玉泉山汲之，清洌異常，非泥沙俱下者所能比也。\n\
    \    太后用膳畢，輒命皇后、宮妃等食之，然不得坐，惟立而餐之，且不敢言語。──節錄自徐珂《清稗類鈔》\n【注釋】①孝欽：清慈禧太后的諡號"
