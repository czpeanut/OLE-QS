  - label: D
    content: 汗牛充棟。
  group_stem: "請閱讀以下短文，並回答35~36 題：\n    讀書以過目成誦為能，最是不濟事。眼中了了① ，心下匆匆，方寸無多，往來應接不暇，如看場中美色，一眼即過，與我何與也②\
    \ 。千古過目成誦，孰有如孔子者乎？讀《易》至韋編三絕，不知翻閱過幾千百遍來，微言精義，愈探愈出，愈研愈入，愈往而不知其所窮。雖生知安行之聖，不廢困勉下學③\
    \ 之功也。東坡讀書不用兩遍，然其在翰林讀〈阿房宮賦〉至四鼓④ ，老吏苦之，坡洒然⑤ 不倦，豈以一過即記，遂了其事乎！\n──節錄自鄭板橋〈濰縣署中寄舍弟墨第一書〉\n\
    【注釋】\n①了了：草率。\n②與我何與也：對於我能得到什麼呢？\n③下學：向地位低的人學習。\n④四鼓：四更，半夜一時至三時。\n⑤洒然：音ㄒㄧㄢˇ，吃驚的樣子。"
