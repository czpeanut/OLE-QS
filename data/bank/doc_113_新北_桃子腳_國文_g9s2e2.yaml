    備考的開始從媽在後腦勺給我一掌

    她讓我舉曬衣桿罰站

    我拿菜盆蓋頭，搬來電扇

    腳邊小鴨搔癢、搖晃撞上腳踝

    我向媽告狀，牠屁顛跑走

    想過的窄門過於擁擠

    我循著小鴨呱叫，終於找到媽

    搖下車窗招手，前座裝滿菜肉魚

    當著小鴨的面：「今天吃鴨仔蛋。」

    腳邊小鴨也湊咖啄咬，我哇──地張嘴

    倒數的日子緊繃，這都能笑半天

    明天應試衣服她放在床腳

    垂下髮尾搖晃，像臍帶纏繞

    「一定要好好。」

    准考證放桌角，雙手放膝蓋

    監考老師發下答案卡，黑板登錄實到不應到小鴨

    我的視線搖晃，手掌彷彿長出蹼

    白牆在教室卻是黝黑

    我以軟弱的喙向外敲擊緊蓋的殼

    攪動，教室的熱是青春醃製的腥

    高舉長桿作為天平，測量素養與填鴨孰重

    菜盆下空的靈魂，電扇也搖頭

    他們說：「鴨仔蛋不腥，習慣就好。」

    ──節錄自萬芳羽〈鴨仔蛋〉'
