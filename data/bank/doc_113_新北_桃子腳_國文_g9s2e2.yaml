- id: doc_113_新北_桃子腳_國文_g9s2e2_s3_37
  section: 3
  number: 37
  type: single
  page: 6
  stem: 請問下列何者不是國際壯年運動總會創辦的理念？
  options:
  - label: A
    content: 鼓勵中老年人參與國際綜合型運動會
  - label: B
    content: 積極培養各個運動專項的年輕菁英選手
  - label: C
    content: 不限制參賽者身體條件，帕拉選手亦可參加
  - label: D
    content: 以多元共融精神，推廣終身運動的健康理念。
  group_stem: "請閱讀以下文章，並回答37~38 題：\n    2025 雙北世壯運(簡稱世壯運)將於5 月17 日在臺北大巨蛋舉行開幕典禮，5 月30\
    \ 日則在新北美術館舉辦閉幕典禮，這是臺灣第一次也是亞洲第一次舉辦的世界壯年運動會。\n一、世界壯年運動會的由來\n    國際壯年運動總會（International\
    \ Masters Games Association,簡稱 IMGA）是為了推廣壯年運動及舉辦世界壯年運動會的國際組織。世界壯年運動會（World Masters\
    \ Games，簡稱世壯運）是 IMGA 規模最大的重點賽事，每四年舉行一次，通常各種運動項目的巔峰運動員年齡較輕，而壯年運動會為了要鼓勵中老年人參與，故設有最低參賽年齡，今年的世壯運就限制要年滿30\
    \ 歲才能參加。\n二、呼應奧運精神的標誌象徵\n    奧林匹克五環和 IMGA 會徽顏色自左至右皆為藍、黃、黑、綠、紅，代表全世界運動員以公正比賽和友好精神相見。而雙北壯年運動會標誌也延續藍、黃、黑、綠、紅的顏色線條，交錯出美麗的「北」字繩結，強調運動將世界不同文化凝聚在一起的團結精神。\n\
    三、帕拉選手也可以參賽\n    帕拉選手是指移動障礙、截肢、失明、腦性麻痺等帶有身心障礙的運動員，為了讓這些運動員也可以參加本次盛會，每位帕拉選手可以有一位帕拉助理員協助。\n\
    四、努力追求 SDGs 的世壯運\n（一）環境行動：世壯運執行委員會透過發起綠色採購、低碳服務，以及水資源管理等共同承諾，邁向淨零轉型，盡力將溫室氣體排放量降至零，其餘排放量亦能讓大氣、海洋和森林重新吸收。\n\
    （二）健康福祉：期望透過本賽會影響力，宣揚全民運動與終身運動的理念，將運動融入民眾的生活。\n（三）社會倡議：來自不同國家、文化、經濟程度、年齡等不同背景之參賽者，都可以在運動場上互相交流，在平等與人權基礎下共融發展。\n\
    （四）產業經濟：民間企業資源投入為成功舉辦國際綜合性運動賽會的重要因素之一，因應多樣化的賽會服務需求與永續趨勢，激發產業創新能量。\n    2025 雙北世壯運活動精彩可期，以「We\
    \ share the same sky」為主題，匯集雙北豐富文化資源，讓全世界看見台灣的魅力。\n──節錄自2025 雙北世界壯年運動會官方網站"
