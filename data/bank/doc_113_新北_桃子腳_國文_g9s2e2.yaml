  stem: 根據本文，下列敘述何者正確？
  options:
  - label: A
    content: 楚惠王擔心旁人看到自己吃下蛭蟲，要其迴避
  - label: B
    content: 楚惠王最後聽從了令尹的建議，不懲處廚師們
  - label: C
    content: 作者認為楚惠王可選擇不吃有蟲的菜，並寬恕廚師
  - label: D
    content: 可用諱疾忌醫，避重就輕來形容楚惠王的處理態度。
  group_stem: "請閱讀以下文章，並回答39~40 題：\n    楚惠王食寒菹① 而得蛭，因遂吞之，腹有疾而不能食。令尹問：「王安得此疾也？」王曰：「我食寒菹而得蛭，念譴之而不行其罪乎？是廢法而威不立也，非所以使國人聞之也。譴而行誅乎？則庖廚監食者法皆當死，心又不忍也。吾恐左右見之也，因遂吞之。」令尹避席再拜而賀曰：「臣聞天道無親，唯德是輔。王有仁德，天之所奉也，病不為傷。」是夕也，惠王之後而蛭出，及久患心腹之積皆愈。故天之親德也，可謂不察②\
    \ 乎！曰：此虛言也。\n    案惠王之吞蛭，不肖之主也。有不肖之行，天不佑也。何則？惠王不忍譴蛭，恐庖廚監食法皆誅也。一國之君，專擅賞罰；而赦，人君所為也。惠王通譴菹中何故有蛭，庖廚監食皆當伏法。然能終不以飲食行誅於人，赦而不罪，惠莫大焉。庖廚罪覺而不誅，自新而改後。惠王赦細而活微，身安不病。今則不然，強食害己之物，使監食之臣不聞其過，失禦下之威③\
    \ ，無禦非④ 之心，不肖一也。\n──節錄自王充〈論衡•福虛篇〉\n【注釋】\n①菹：酸菜。\n②察：清楚。\n③禦下之威：統治臣民的威信。\n④禦非：糾正錯誤。"
