- id: doc_113_新北_桃子腳_國文_g9s2e2_s2_20
  section: 2
  number: 20
  type: single
  page: 3
  stem: '宋人有善為不龜手之藥者，世世以洴澼絖①為事。客聞之，請買其方百金。聚族而謀曰：「我世世為洴澼絖，不過數金；今一朝而鬻②技百金，請與之。」客得之，以說吳王。越有難，吳王使之將。冬與越人水戰，大敗越人，裂地而封之。能不龜手一也，或以封，或不免於洴澼絖，則所用之異也。──《莊子》

    【注釋】

    ①洴澼絖：音ㄆㄧㄥˊㄆ一ˋㄎㄨㄤˋ，在水中漂洗棉絮。

    ②鬻：音ㄩˋ，賣。

