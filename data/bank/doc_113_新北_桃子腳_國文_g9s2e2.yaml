  - label: C
    content: 攪動，教室的熱是青春醃製的腥
  - label: D
    content: 想過的窄門過於擁擠，我循著小鴨呱叫。
  group_stem: '請閱讀以下短文，並回答29~30 題：

    熱是一種腥味，瀰漫總複習夏日

    我踩進沙泥、手抓一隻黃鴨

