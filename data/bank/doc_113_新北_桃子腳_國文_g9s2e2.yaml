  stem: 「新割青草的清香，其實是小草在受傷後發出的信號，叫做『綠葉揮發物』。綠葉揮發物中的化學物質會吸引螞蟻、寄生蜂、瓢蟲、捕食蟎等捕食性昆蟲，牠們是地面植食性昆蟲的天敵。捕食性昆蟲會通過綠葉揮發物來決定自己的狩獵場所，這些天敵的到來，會顯著減少區域內植食性昆蟲的數量，植物們就可以肆意生長了。」根據這段文字，「綠葉揮發物」的功能為何？
