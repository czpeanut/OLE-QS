  section: 3
  number: 33
  type: single
  page: 5
  stem: 根據本文內容，下列敘述何者正確？
  options:
  - label: A
    content: 「任土貢，寧若斯？」所表達的語氣為贊同
  - label: B
    content: 陽城因終止進貢矮奴陋習，深受道州百姓感念
  - label: C
    content: 皇帝拒絕陽城的諍言直諫，處以刑責發派邊疆
  - label: D
    content: 道州人民被當作貢品進獻，是因為要征戰沙場。
  group_stem: '請閱讀以下短文，並回答33~34 題：

    道州民，多侏儒，長者不過三尺餘。

    市作矮奴年進送，號爲道州任土貢。

    任土貢，寧若斯？

    不聞使人生別離，老翁哭孫母哭兒。

    一自陽城① 來守郡，不進矮奴頻詔問。

    城云臣按六典書② ，任土貢有不貢無。

    道州水土所生者，只有矮民無矮奴。

    吾君感悟璽書③ 下，歲貢矮奴宜悉罷④ 。

    道州民，老者幼者何欣欣。

    父兄子弟始相保，從此得作良人⑤ 身。

    道州民，民到於今受其賜，欲說使君先下淚。

    仍恐兒孫忘使君，生男多以陽爲字。

    ──白居易〈道州民〉

    【注釋】

    ①陽城：家貧好學，被貶為道州刺史。

    ②六典書：周代輔佐帝王治理的六種法典。

    ③璽書：皇帝所下的命令詔書。

    ④罷：停止。

    ⑤良人：一般百姓。'
