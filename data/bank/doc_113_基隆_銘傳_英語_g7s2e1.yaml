    content: '2013'
  - label: D
    content: '2023'
  group_stem: "(2.)\nThe World Baseball Classic\n    The World Baseball Classic (WBC)\
    \ is an international baseball tournament. It started in 2006 and takes place\
    \ every four years. Many countries, like the USA, Japan, and Taiwan, send their\
    \ best players to join the competition.\n    The WBC is different from other baseball\
    \ games because national teams play against each other. The players feel proud\
    \ to wear their country’s uniform. Fans from around the world watch the games\
    \ and cheer for their teams.\n    Taiwan has joined the WBC many times. In 2013,\
    \ the team played very well and won some important games. Many Taiwanese baseball\
    \ stars, like Wang Chien-Ming and Lin Chih-Sheng, have played in the WBC. People\
    \ in Taiwan love baseball, so they are always excited to watch their team play.\n\
