  section: 1
  number: 41
  type: single
  page: 2
  stem: 41. 依照上文畫雙線處所述，此種生產模式與下列何者最相近？
  options:
  - label: A
    content: 臺灣本土的農產品外銷至日本
  - label: B
    content: 美國業者於越南設立紡織工廠
  - label: C
    content: 阿拉伯石油公司僱用當地居民
  - label: D
    content: 我國晶圓廠新建國內無人產線。
  group_stem: "●請閱讀下文並回答問題:\n    日本知名的電子產品集團宣布將在泰國設置新的半導體廠，生產用於汽車駕駛及其相關功能的電子晶片，這樣的決定對經營階層而言，有其成本考量。雖然目前部分半導體產業的需求受各類因素影響而減少，但對於車用半導體的需求仍十分穩定，因此獲利可期，該集團期待藉由國際分工建立一個具彈性、能因應各種情況的生產模式。未來將先於日本負責具較高技術要求的生產製程後，再將剩餘步驟交由勞力成本較低廉的泰國工廠完成，最終統一輸出商品至各國的汽車製造商。請問："
