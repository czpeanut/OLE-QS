  section: 1
  number: 40
  type: single
  page: 2
  stem: '40. 為促進彼此的經貿合作關係，追求更大的利潤，甲國與乙國準備簽訂貿易協議，甲國將從乙國進口大量車用零件，附表為甲國自產零件現今的市場價格以及進口商品未來的售價，依其內容判斷，下列推論何者正確？

    | 甲國自產車用零件市場價格（每單位） | 來自乙國車用零件預計售價（每單位） |

    | :--- | :--- |

    | 200 元 | 120 元 |'
  options:
