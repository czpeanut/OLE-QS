  stem: '33. 金鐘在上完公民課後，對於生活中廠商間的競爭方式感到很有興趣，因此將觀察到的現象整理如下表。根據表中內容判斷，何組觀察皆屬非價格競爭的方式？

    | 選項 | 觀察一 | 觀察二 |

    | :--- | :--- | :--- |

    | A | 火鍋店推出消費滿10鍋送1鍋的活動 | 大賣場推出冰品折扣活動 |

    | B | 超市祭出限時搶購，晚上8～10點全館商品9折 | 早餐店推出漢堡配飲料折5元的活動 |

    | C | 航空公司與知名卡通明星合作，推出相關周邊商品與彩繪機身 | 超商推出咖啡買一送一優惠 |

    | D | 手飲店為響應環保，推出消費滿300元送環保杯的活動 | 披薩店要挑戰消費者的味蕾，推出香菜口味披薩 |'
