  type: single
  page: 1
  stem: '38. 小清參與研討會時，主講人分享以下的資訊，依其內容判斷，下列關於小麥貿易的分析何者正確？


    > 去年度全球貿易數據統計出爐，小麥的主要出口國家依序為俄羅斯、美國、加拿大、烏克蘭；主要進口國家則為埃及、印尼、巴西、菲律賓、阿爾及利亞。'
