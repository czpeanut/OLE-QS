  section: 1
  number: 32
  type: single
  page: 1
  stem: '32. 以下為蘇小姐看到的一則消費新知，她計算自行開車的停車費用後，決定選擇使用訊息中的服務。根據內容判斷，下列敘述何者正確？


    > 隨著疫情趨緩，各國觀光禁令的解除，國人出國旅遊意願大增，機場車輛接送服務業者搶攻商機，有需求的消費者可透過線上預約，購買機場接送防疫服務。'
  options:
  - label: A
    content: 蘇小姐與業者雙方透過有形市場進行交易
  - label: B
    content: 由交易內容可知，此交易市場為勞動市場
  - label: C
    content: 交易雙方考量自身狀況後，做出理性選擇
  - label: D
    content: 自行開車的費用低於購買接送服務的費用。
