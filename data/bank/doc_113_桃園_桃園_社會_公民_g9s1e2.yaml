  stem: '36. 某機關希望縮短使用者的停車時間，提高停車場車位的流動率，使車位能讓更多洽公民眾使用，因此設計新的停車費率，如附表所示。該機關設定表中停車費率所運用的經濟學概念，與下列何者最相似？

