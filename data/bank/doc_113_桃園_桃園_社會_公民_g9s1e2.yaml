- id: doc_113_桃園_桃園_社會_公民_g9s1e2_s1_39
  section: 1
  number: 39
  type: single
  page: 1
  stem: 39. 為達成非核家園願景，能源轉型是政府重點政策之一。為此，行政院推動離岸風電設置和發電。位於歐洲全球機電系統供應商KK Wind Solutions在臺灣設立工廠。該廠設置在鄰近臺中港的彰濱地區，生產組裝具高附加價值的功率轉換模組（將風能轉換成電力的關鍵電力電子系統），目前離岸風電已分別於臺北港、臺中港、興達港形成產業聚落，也吸引國際風力機系統商在臺灣設廠，除了大幅降低業者的運輸風險及時間成本，更帶動周邊各項零組件製造商機。根據上述，歐洲風電廠商願意來臺灣設廠，最主要的理由為何？
  options:
  - label: A
    content: 在臺生產機會成本較低
  - label: B
    content: 我國是主要消費市場
  - label: C
    content: 因我國能源較為豐富
  - label: D
    content: 在我國生產不具優勢。
  tags:
