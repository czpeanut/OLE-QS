- id: doc_113_台北_誠正_社會_公民_g9s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 「卡奴」是指在使用信用卡消費時，因支出超過了其收入，導致只能繳交部分信用卡債務，未繳出的債務衍伸出循環利息，因此背負高額的卡債，甚至可能導致個人的信用破產。若未來妳身邊有這樣的朋友，下列哪一建議較為適切？
  options:
  - label: A
    content: 必須按時在期限內將款項繳納給政府
  - label: B
    content: 可多使用以衡量物品價值，避免過度消費
  - label: C
    content: 仍須使用法定貨幣繳費，不要以為可無限期延遲支付
  - label: D
    content: 為避免過消費導致信用不佳，應預先將錢存入此卡中。
