  number: 4
  type: single
  page: 1
  stem: 我國因對工程安全的不重視，容易造成對作業現場危害及風險認知的警覺性較低，致使發生災害。因此勞動部舉辦了講座，宣導雇主應確實做好指揮、監督及協調之工作，也加強勞工辨識與評估危害的能力。根據前文所述，此講座最主要應在落實下列何項目的？
  options:
  - label: A
    content: 提升勞資雙方的職業安全意識
  - label: B
    content: 尊重勞資雙方的工作契約內容
  - label: C
    content: 強化職場中的性別平等措施
  - label: D
    content: 透過公共意見影響政府決策。
