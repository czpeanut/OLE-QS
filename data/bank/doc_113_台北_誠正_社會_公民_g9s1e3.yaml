- id: doc_113_台北_誠正_社會_公民_g9s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 琬昕經過多次的面試後，成功獲得了幾個工作機會。其中一份工作是前往客戶家中照顧年邁的長輩，雖然工作辛苦，但琬昕仍然自願從事這樣的勞動。請問：上述琬昕的工作應屬於何種勞動型態？
  options:
  - label: A
    content: 家務勞動：因為琬昕必須無酬協助客戶打理家務
  - label: B
    content: 無酬勞動：因為勞動契約並無固定上班時間
  - label: C
    content: 市場勞動：凡勞心勞力換取工資者皆屬之
  - label: D
    content: 有酬勞動：因為琬昕的這份工作是志工服務。
