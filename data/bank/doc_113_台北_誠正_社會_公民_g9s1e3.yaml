  section: 1
  number: 6
  type: single
  page: 1
  stem: 暐智是一位便利商店老闆，近期在招募店員時，因擔心錄取的員工販賣菸品給未成年而遭罰，因此在與員工簽訂工作契約上，要求員工簽下條款，要求若有員工受罰則所有人當月薪資都用來繳違法時的罰鍰。暐智的做法是否恰當？
