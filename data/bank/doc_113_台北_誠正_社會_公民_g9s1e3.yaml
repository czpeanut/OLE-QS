  stem: 要趕上班的凱翔因為闖紅燈被警察攔下開了一張罰單。凱翔為了舒緩心裡的不甘，決定拿1 元、5 元硬幣繳交罰款。請問：即使櫃檯感到不滿，卻不能拒收零錢的原因為何？
