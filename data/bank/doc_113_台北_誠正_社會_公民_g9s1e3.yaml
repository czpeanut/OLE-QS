- id: doc_113_台北_誠正_社會_公民_g9s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 韋中在美國念書，去年因為照顧家人不得不休學。今年韋中準備回去完成新的課程，卻發現美元兌換新臺幣的匯率從去年的1：30 變成現在的1：28，這樣的匯率變動對他有何影響？
  options:
  - label: A
    content: 因新臺幣貶值，所以去美國較貴
  - label: B
    content: 因新臺幣升值，所以去美國較便宜
  - label: C
    content: 因美元升值，所以去美國較便宜
  - label: D
    content: 因美元貶值，所以去美國較貴。
