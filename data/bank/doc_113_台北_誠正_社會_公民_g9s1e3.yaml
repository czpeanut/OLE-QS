  stem: 此文強調的是下列何項內容？
  options:
  - label: A
    content: 說明勞動人口的數據
  - label: B
    content: 比較不同工作的類型
  - label: C
    content: 分析勞動力調查方式
  - label: D
    content: 介紹社會另類的族群。
  group_stem: '27 歲的吳東燁（音譯，Oh Dong-yeop）過去7 年都是在獨居中度過。其實，他曾是個勤奮的學生，獲得了大學電腦科學的獎學金，但家人無力金援下，他只能靠打工謀生。到了大三，兼顧工作與學業使他負擔過重，最後竟失去了獎學金。後來，他決定搬到首爾，靠著在建築工地工作支持他的學業。但是長期處於貧困窘境，最終讓他放棄自己，開始繭居。每天只靠飲酒與玩線上遊戲度日。

    韓國估繭居族50 萬至100 萬

    鄰近日本的韓國，近年來繭居族問題也漸漸成為社會重大現象，根據韓國健康和社會事務研究所的數據，在19 至39 的年齡區間有近3%（約34 萬人）為繭居族，而全國可能有50
    至100 萬人正在繭居。為何最初源於日本的繭居族，現在亞洲不少國家也出現？他們究竟是什麼樣的一群人？

    繭居族如何定義？最初起源？

    繭居族（hikikomori）是指呈現持續性社交退縮的族群。繭居族的現象最早在日本1980 年代後期發現，《維基百科》將其定義為不進入社會進行社交行為、不上學、不工作，長期隱居在家中6
    個月以上的一群人，此族群多數為青少年、男性。一開始，多數人認為日本傳統的社會規範以及行為模式，是導致繭居族產生的因素。不過時至今日繭居族已漸漸出現在台灣、韓國、香港等國家，遠至歐洲、美洲也有這類現象。

    根據研究，繭居族與高度都市化的社會有關。多數人在繭居之前都曾經歷生活上的變動或刺激，進而改變了自己原先的生活模式。而涵蓋的層面從個人、家庭、社會等面向都有。像是人際關係問題是常見的原因之一，不管是在學校被同儕排擠，或是在職場上深受人際問題所苦，都有可能導致人們繭居。

    繭居族成因，與亞洲羞恥文化有關

    但是亞洲國家往往比起西方國家更為重視社會眼光，「羞恥文化」盛行，也是造成繭居族壓力的來源之一。這讓亞洲的繭居族，似乎比起歐美更常見。不過，據《NPR》報導揭露，韓國長期研究年輕人孤立問題的KIHASA
    副研究員金成雅（音譯，Kim Seonga）指出，韓國年輕繭居族，除了人際問題，有挺高比例是「覺得自己在這個社會沒有角色可扮演，無處可去」，因此決定繭居。似乎更接近於中國人的「躺平」現象。

    《BBC》報導也透露，韓國年輕繭居族普遍認為，他們沒有達到社會或家庭的成功標準。有些人覺得自己格格不入，因為他們沒有追求傳統的職業道路，而有些人可能因學業成績不佳而受到批評。也因此決定不出門也不上班，減少被批判的機會。

    ~摘改自《除日本，韓國也有繭居族！專家憂「80 歲養50 歲」是未來》'
