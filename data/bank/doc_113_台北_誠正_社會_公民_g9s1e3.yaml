- id: doc_113_台北_誠正_社會_公民_g9s1e3_s3_31
  section: 3
  number: 31
  type: single
  page: 3
  stem: 根據上文所討論的議題，《甲》法應為下列何者？
  options:
  - label: A
    content: 性別平等工作法
  - label: B
    content: 勞動基準法
  - label: C
    content: 兒童及少年福利與權益保障法
  - label: D
    content: 性騷擾防治法。
  group_stem: '大法官釋憲認為限制女性勞工夜間工作違反憲法保障性別平等，判定違憲。勞動部表示，該項自宣布日起已失效力，但女性若因健康因素或是妊娠、哺乳期，仍不得執行夜間勤務。

    大法官日前做出釋字第807 號解釋，《甲》法第49 條第1 項規定限制女性勞工夜間工作形成差別待遇，淪於性別角色窠臼，違反憲法第7 條保障性別平等意旨，自解釋公布之日起失效。勞動部今天已通函各地方主管機關，依大法官釋憲第49
    條第1 項規定違憲，自該日起失其效力。

    然而，勞動部說，同條第3 項未受影響，仍屬有效。《甲》法第49 條第3 項規定「女工因健康或其他正當理由，不能於午後10 時至翌晨6 時之時間內工作者，雇主不得強制其工作」。

    此外，第49 條第5 項有關「禁止妊娠或哺乳期間之女工於夜間工作之規定」，基於大法官解釋並未否認保護母性，且母性保護為國際重視普世價值，也是憲法第156 條所明定，因此仍有其效。

    勞動部勞動條件及就業平等司長黃維琛表示，已於3 日舉辦專家學者會議討論，由於第3 項涉及刑責，因此會以個案認定，主要視勞工是否有健康或正當理由、且具正當理由後雇主仍強迫執勤，才會符合要件。至於孕婦的部分，黃維琛說，多數學者專家的見解一致，也引用憲法關於母性保護，因此具有共識。

    勞動部表示，若違反第49 條第3 項規定者，可處6 個月以下有期徒刑、拘役或科或併科新台幣30 萬元以下罰金，違反同條第5 項規定者，可處9 萬元以上45
    萬元以下罰鍰。

    此外，依法並將公布其事業單位或事業主名稱、負責人姓名、處分期日、違反條文及罰鍰金額，並限期令其改善；屆期未改善者，應按次處罰。~摘改自中央通訊社《限制女性夜間工作違憲
    勞動部：健康因素或孕婦例外》'
