- id: doc_113_新北_五峰_國文_g7s2e1_s5_27
  section: 5
  number: 27
  type: single
  page: 4
  stem: 根據本文，下列敘述何者正確？
  options:
  - label: A
    content: 臺灣的都市地區42%設有完善的道路系統
  - label: B
    content: 臺灣的交通法規執行未能落實，導致行人難以建立正確的用路觀念
  - label: C
    content: 行人常為了搶快，而不願遵守交通規則，與車輛駕駛爭奪路權
  - label: D
    content: 二○二一年臺灣死於交通事故的人數比日本高
  group_stem: "成立於二○二一年十二月的粉絲專頁「臺灣是個行人地獄」，建立者楊先生說：「臺灣的城市都有一個嚴重問題，就是缺乏人行道與供行人通行的連貫通道。」\n\
    \    根據政府統計數據，都市地區有42%的道路設有人行道。但這些道路可能很狹窄、停滿汽機車，或被路燈與變電箱擋住，店家還會在門口擺上盆栽或招牌。楊先生說，行人通常會「被迫」走在車道上。有些人行道是由騎樓構成，地面高低不平，影響行人步行順暢性。帶著嬰幼兒出門的家長走上人行道時，有時必須用手扛起嬰兒車；坐輪椅的人因為通行道路受阻，必須在車道與步道上左右穿梭。行人過馬路或走在人行道上時，常常得和車輛駕駛爭權。\n\
    \    二○二一年，臺灣每十萬人就有12.67 人死於交通意外，大約是日本的六倍、英國的五倍。臺灣交通安全協會副理事長林志學說，臺灣的道路對行人不友善，癥結點在於缺乏更新的道路工程與設計專業，道路設計的指導方針「模糊不清」、只「存在紙上」，是「有選擇性的實施」，且「以車為本」的規畫將私人車輛的重要性擺在公共交通運輸、自行車騎士與行人之前。\n\
    ─改寫自中央社〈臺灣馬路如虎口！CNN：對觀光業構成問題〉"
