- id: doc_113_新北_五峰_國文_g7s2e1_s5_29
  section: 5
  number: 29
  type: single
  page: 4
  stem: 根據本文關於四川黑熊庇護所的黑熊，下列何者的推論錯誤？
  options:
  - label: A
    content: 黑熊從小在庇護所訓練，所以能服從指示進出欄舍
  - label: B
    content: 黑熊過去可能曾遭受人類活體取膽汁的對待
  - label: C
    content: 黑熊從養殖場中救回，免於死後可能被分食的命運
  - label: D
    content: 黑熊和大象相比，受過創傷的大象記憶力比較持久
  group_stem: "在四川有一個黑熊庇護所，收容了數十頭從大大小小的養殖場贖回的黑熊。\n    我想，沒有一個人會真的想成為被活體取膽汁的熊，然而，這卻是人們對待牠們的方式。我那一次前往四川，其實是為了研究大熊貓，才順道走訪黑熊庇護所。同為熊科動物，大熊貓受到舉世追捧，黑熊卻從小被訓練表演，長大被活體取膽，老死後多半被人分食。人們對不同動物的態度實在相差太遠，如果有一種存在生來就是要受苦的，我想那就是亞洲黑熊了。動物的地獄正是人間。\n\
    \    「懷有同情的想像沒有界線」，諾貝爾文學獎得主柯慈在小說《動物的生命》中寫道。直到這時，我方才知道了流淚可能出自高尚的情懷，為動物的苦難而悲傷難過不必感到害羞。牠們的處境永遠值得人去關心、值得我們投身於此，讓人為牠們遭受的悲慘命運而哭泣，也為牠們終能從痛苦中解脫而感到歡欣。\n\
    \    我知道大象的記憶可以維持很久，曾經受過創傷的象，可能在數十年後才向人類報復。那麼，黑熊呢？庇護所中的黑熊在悠閒的生活中似乎已然忘卻往日的痛苦。牠們配合工作人員的指示進出室內外的欄舍，見到生人也沒有恐懼和憤怒的樣子。如果我是熊，也許做不到這樣，而是整天想著如何對人類進行最恐怖的復仇吧！身為人類，動物能夠教導我們的事，實在太多了。面對位於庇護所一角的黑熊墓園，我致上心中不知從何處而來，只因為我也是人類的一員而感到的悲傷與歉意。\n\
    ── 改寫自龍緣之〈致命的(可)愛：從活熊取膽到動物奇觀〉"
