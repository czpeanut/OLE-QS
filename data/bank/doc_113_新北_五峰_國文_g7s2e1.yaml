  stem: 「製造謠言實在很容易，不必像文學批評，必須啃下硬梆梆的理論，也不需要什麼精密的科學分析，只要幾張愛嚼舌根的嘴，一點點茶餘飯後的閒裕，這種屬於集體創作的話本就可以開始。所以，謠言總是無所不在，它十足就像空氣中活躍的細菌，積極尋找適宜繁殖的好地方。」關於這段文字的含意，下列何者最接近？
  options:
