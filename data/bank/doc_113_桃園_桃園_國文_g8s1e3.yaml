  group_stem: '天下有一人知己，可以不恨。不獨人也，物亦有之。如菊以淵明為知己，梅以和靖為知己，竹以子猷為知己，蓮以濂溪為知己，桃以避秦人①為知己，杏以董奉②為知己，石以米顛為知己，荔枝以太真③為知己，茶以盧仝、陸羽為知己，香草以靈均④為知己，蓴鱸以季鷹⑤為知己，蕉以懷為知己，瓜以邵平為知己，雞以處宗為知己，鵝以右軍為知己，鼓以禰衡為知己，琵琶以明妃⑥為知己。一與之訂，千秋不移。若松之於秦始⑦，鶴之於衛懿⑧，正所謂不可與作緣者也。

