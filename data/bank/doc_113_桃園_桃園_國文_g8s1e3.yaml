    \  可是好湯不能不喝，而且不能不出聲地喝。夫堂堂法律，為官的尚可以陽奉陰違，況喝湯乎？小民可以陰違之事本來就不多，在喝湯這件事上，還頗有活動的餘地。一處是在「關起門來可以作皇帝」的府上，只要老伴不嫌，喝湯出聲，是不會有人來「側目」的，更用不著擔憂什麼影響國家形象。另一處的天地更大，大約北美洲諸大城市，都有中國城或唐人街；這些地方最大的特色，就是餐館林立，餐館中的特色得一「鬧」字。說話不提高嗓門，對座之人都難於聽見，喝湯之唏哩呼嚕，早被更大的聲音淹沒了。這時一大碗酸辣湯，熱氣騰騰送到閣下座前，呼哩嘩啦，一瞬之間，碗已見底，額角冒汗，閒愁種種，俱已忘懷，此情此景，實是齒頰留芳，朵頤稱快之鐵證也。\n\
    \  要觀光客喝湯不准出聲，以免影響國家形象，也未免幾近苛求。觀光客之中一定也有不少人辛苦多年，傾其所有，出門逍遙一番的，這種人一定要他時刻記住幫忙建立國家形象，負起任重道遠的國民外交重責，實在有欠公平。\n\
    \  二十五、六年前有位屬於「快人快語」型的朋友，將出國觀光。餞行席上有不知趣之人，曉以國民外交的大義，並尊稱之為國民大使。此時酒過數巡，主客出語更快，聽到匹夫有責的大義，聽到大使的尊稱，忽然翻臉，立刻以連珠砲的語句斥之曰：「老兄，我是辛苦了一輩子，省吃儉用了一輩子，這次是傾其所有，出去見見世面，逍遙逍遙，請你不要給我戴高帽子，我不配做什麼國民大使。匹夫有責，責在遊覽。但是，請放心，我也不會在外國丟你的臉，不會比有些真做大使的更丟你的臉。」如今已過了二十五、六年，事過境遷，而此公說話神情，還歷歷在目，可惜當時竟沒有注意到此人喝湯是否出聲。\n\
    \  現在想想，他很可能是一個「喝湯出聲」的人。\n（改寫自吳魯芹 「喝湯出聲」辯）\n〔99.第一次基測〕"
