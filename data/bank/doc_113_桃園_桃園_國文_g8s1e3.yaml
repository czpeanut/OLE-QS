  stem: 請根據〈鳥〉一課之內容敘述判斷下列說明何者錯誤？
  options:
  - label: A
    content: 「簡直是一派和諧的交響樂」用摹寫手法，寫出百鳥齊飛的壯闊之景，同時營造出喜悅和樂的氣氛。
  - label: B
    content: 「像虹似地一下就消逝了」一句藉虹「美麗多彩ヽ瞬間消逝ヽ無聲無息」的意象寫鳥離去的迅速。
