  stem: '若某技藝團的人拿著一杯水走動,如圖所示。則以下那些情形會呈現和圖杯水中相同的情形?

    a. 向左等速度運動

    b. 向右等速度運動

    c. 由靜止突然向左運動

    d. 由靜止突然向左運動

    e. 原向右運動突然減速

    f. 原向右運動突然加速

    g. 原向左運動突然減速

    h. 原向左運動突然加速'
  options:
  - label: A
