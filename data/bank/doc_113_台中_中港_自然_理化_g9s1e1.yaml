  section: 2
  number: 28
  type: single
  page: 4
  stem: 如圖,甲、丙兩斜面與乙平面皆視為完全平滑當球自離地 15 公分處的 a 點靜止釋放後,在移動至 d 點過程中,若空氣阻力可忽略不計,則下列敘述何者正確?
  options:
  - label: A
    content: 當丙斜面角度增加時,其斜面長度必須減少,球才會移動到相同高度的 d 點處。
  - label: B
    content: 若將丙斜面改為平面,則球最終會停止運動
  - label: C
    content: 當球自 b 點移動到 c 點時,作等加速度運動
  - label: D
    content: 球從甲斜面 a 點滾落至乙平面時,作等速度直線運動
