  group_stem: '《帶著手機去修仙》

    楊小翔,一個喜歡上課哈拉聊天,國三的學生。某天逛街時,經過一個大門很舊,帶著以前的裝飾賣古玩的店。好奇的他,進入裡面東看西看,走過一個銅製雕刻精細的鏡子時,突然看到一陣白光,阿.........的一聲,被吸了進去,到了一個陌生的古世界。

    小翔掉到了河邊,聽到了有人在洗澡的聲音,暗自竊喜,以為遇到古代美女在河邊洗澡,高興地抬頭,原來只是一個老漢........。猛地驚醒,摸摸身上的手機,竟然有訊號,但是只剩10%的電力了。此時,出現一段訊息:「手機若想充電必須解開出現的問題;當問題都解決了,才能開啟時光之門回家。」

    肚子開始咕嚕咕嚕的叫,好餓阿@@!突然手機裡走出了一個小精靈,說到:先解答一個問題,就給你一套基礎功法和十兩銀子.............


    在客棧吃飽喝足後,問問店小二附近的情況,原來附近有個崑崙仙派,何不去學學御劍術,這樣就方便多了......。小翔心裡這樣想著。往西走了5公里,終於到了崑崙山下。頓時手機裡出現幾個任務問題.........


    觀看了師兄們的御劍術後,手機出現了新技能下載包,下載完後小翔就學會了御劍術。不過也消耗了電量,必須繼續回答問題充電。


    小翔暫別了崑崙山,回到了西寧城,城裡有個煉丹協會。平常看動漫,裡面常有著煉丹師煉丹的劇情,自己也想來煉丹看看。於是來到了煉丹協會拜見會長,看了會長整個煉丹過程,岳霖自己想來煉丹看看,可是卻一直爆丹,無法成功。會長說:你是在煮粥喔!失誤連連.....。原來從手機學會方法還是得多練習才行。只好作罷,從會長手中拿了兩顆丹藥,神火彈和驚雷彈。


    心情不好的小翔,回到西寧城散步逛逛。下圖為同一街道一直線上的小地圖。


    騎馬後心情好多了,回到城裡觀看技藝團表演......


    小翔跟技藝團的人聊聊後,談及技藝團表演的一些東西和魯班機關術有關,心理產生莫大興趣,從小就對稀奇古怪的東西好奇,尤其是機關術的奧秘,因此決定買了一隻汗血寶馬,前往魯班的故鄉—山東省魯山城。此時,手機呈現了從青海省到山東省的google地圖。


    騎馬經過臺兒莊古城,古城旁狩獵場正在舉辦打獵比賽...


    小翔在途中突然看到一個酷似心中女神李多慧的女子,於是快馬追去......


    到了魯山城,打聽了魯班機關門派的地點後,就直接衝了過去,剛好看到魯班門人在試飛木鳶,於是小翔自告奮勇要坐上去,操作著它往上快速飛行,同時手機出現魯班機關術秘笈,打開第一頁,看到上面寫著“欲練神功,必先自宮”,大驚失色,不小心被木翅尾割傷,血滴到了木鳶,因此失去了動力,掉了下去........


    疑,我沒死!小翔心裡想著,原來他掉在樹上。大難不死必有後福。於是再去魯門看看其他的東西,剛好又在製作降落傘,於是再當個自願者,練習跳傘...


    已經在魯山城待了二個月了,該是回崑崙仙派學學其他功夫了,出了城門竟遇到了同學呂阿睿,問他怎麼出現在這裡,只說睡著了做夢就.....。算了不管了,小翔先教他御劍術基礎,打算和他一起用御劍術回仙門.........


    《故事未完待續.........》'
