- id: doc_113_基隆_銘傳_國文_g7s1e1_s3_32
  section: 3
  number: 32
  type: single
  page: 3
  stem: 對於母親的「鐵沙掌」，最讓作者感念的是什麼？
  options:
  - label: A
    content: 俐落地處理雜事，展現高度效率
  - label: B
    content: 任勞任怨，堅強地支撐整個家庭
  - label: C
    content: 嚴格管教，讓孩子有較高的成就
  - label: D
    content: 抱作者上輪椅，並帶她四處遊玩。
  group_stem: "丁、\n〈鐵沙掌〉 杏林子\n\n 母親有一雙大手。年輕時，母親是三鐵健將，練就了她孔武有力的手勁。結婚後，她用這雙手做飯洗衣，抹地擦窗子，真是乾淨俐落，又快又好。但在孩子眼中，對這雙手又怕又敬。它代表權威，代表家法。哪個不聽話，根本不必費神找棍子，一巴掌下去，屁股上馬上暴起五條指痕，夠你繞著屋子跳半天呢！\n\
    \ 母親的手有一點很奇特，那就是掌心呈現赤紅色。有位懂得手相的朋友說：「這是硃砂掌，主貴的。」我們在背後不服氣地嘀咕著：「什麼硃砂掌？簡直是鐵沙掌。」母親也確實是主「饋」的，她給我們煮了一輩子飯。\n\
    \ 但是就是這樣的一雙手，在我病了二十多年後的今天，她照顧我，扶持我。近幾年不能走路後，也只有母親抱得動我，她也了解怎樣抱才不會觸痛我的關節。有一次，我們去教堂聚會，但那天母親腰痛的老毛病發作，父親有意代勞，想試著抱我上輪椅。母親說：「不行，弄痛了她，比我痛還難過！」\n\
    \ 我常想：多虧上帝給了母親這雙「鐵沙掌」，堅強地支撐起這重重苦難的家庭。\n（選自〈杏林小記〉）"
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
