    \ 的神杖。 Hermes 是旅人、牧人、小偷、詩人和貿易商的守護神，過去雙蛇杖是商業貿易的象徵，而現在一些醫療機構以雙蛇杖作為表徵，《The Lancet》醫療期刊認為這是把單蛇杖混為一談的結果。\n\
    \    希臘神話中有兩位神明擁有蛇杖，一是Hermes 所用的雙蛇杖，另一則是Asclepius 的單蛇杖，單蛇杖沒有翅膀，且只有一隻蛇纏繞。Asclepius\
    \ 是希臘神話醫術高明的醫療之神，其蛇杖由來，是有一天Asclepius 遇到無法醫治的病患，因得到一隻睿智的蛇指點，而順利把病患治癒，於是Asclepius\
    \ 就把這隻蛇帶在身邊，為了方便面對面溝通，就讓牠攀附在杖上。\n    《The Lancet》醫療期刊表示，Asclepius 依其典故代表醫療當之無愧。而將貿易、旅人守護神Hermes\
    \ 雙蛇杖做為醫療機構象徵，據說是因為1902 年美國陸軍軍醫團採用後，逐漸於北美地區醫療機構採納。\n    談到Asclepius 的單蛇杖，台灣_____________上可看見它的蹤影。\n\
