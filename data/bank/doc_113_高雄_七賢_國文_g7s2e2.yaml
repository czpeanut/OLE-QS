  group_stem: "（四）請閱讀以下文章，並回答33～35 題：\n    燕王好烏，庭有木皆巢鳥，人無敢觸之者，為其能知吉凶而司①禍福也。故凡國有事，惟烏鳴之聽。烏得寵而矜，客至則群呀之，百鳥皆不敢集也。於是大夫、國人咸事烏②。烏攫腐以食，腥於庭，王厭之。左右曰：「先王之所好也。」\n\
