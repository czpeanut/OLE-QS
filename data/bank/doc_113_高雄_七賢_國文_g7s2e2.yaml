  stem: "請閱讀下面文章，回答下列問題：\n    齊奄家畜一貓，自奇之，號於人曰「虎貓」。客說之曰：「虎誠猛，不如龍之神也，請更名曰『龍貓』。」又客說之曰：「龍固神於虎也，龍升天須浮雲，雲其尚①於龍乎？不如名曰『雲』。」又客說之曰：「雲靄蔽天，風倏散之，雲故不敵風也，請更名曰『風』。」又客說之曰：「大風飆起，維②屏以牆，斯③足蔽矣，風其如牆何！名之曰『牆貓』可。」又客說之曰：「維牆雖固，維鼠穴之，牆斯圮④矣，牆又如鼠何！即名曰『鼠貓』可也。」東里丈人嗤之曰：「噫嘻！捕鼠者固貓也，貓即貓耳，胡為⑤自失其本真哉？\
