  stem: "請閱讀下面文章，回答下列問題：\n    博物館雖然是向大眾開放的空間，但多數人去參觀時，會認為不能穿著太沒「文化」的服裝，以符合場所的調性。博物館也會制定一套規則來約制參觀者的行動，如入館前須經歷像宗教淨化的程序——特定物品或過大的背包不能攜入、隨身背包通過安檢、驗票；入館後更須遵守與文物間的安全距離，不能跨越禁止區域，不能拍照。而展場的布置與建議參觀路線，也提供了一個有秩序的、不會引起騷亂的世界。博物館的展示讓參觀者以為身在「現場」，卻也決定了參觀者可以看什麼、看不到什麼。博物館做為知識集合場，自然成為特定領域的權威，它一方面闡釋作品，對參觀者進行教育，一方面也讓觀眾意識到自己是知識的主體。\n\
    \                        (改寫自廖世璋〈博物館的社會不平等〉、徐夢可〈博物館觀眾身分的雙重屬性〉)\n博物館不只是展示文物的地方，通常也會設計特定的參觀路線與展廳安排。根據這段文章的意思，這樣的安排，主要的目的次第是什麼？"
  options:
  - label: A
