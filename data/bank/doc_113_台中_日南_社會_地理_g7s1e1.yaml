    content: 0°
  - label: B
    content: 120°E
  - label: C
    content: 150°W
  - label: D
    content: 180°
  group_stem: '住在臺灣的阿忠欣賞畫家高更的作品，高更曾居住在大溪地，作品深刻描繪出當地居民的日常生活。阿忠深受吸引，於是進一步查詢資料，發現大溪地為法國的海外領地，坐落於大洋之中，擁有火山、珊瑚礁等自然風景，是許多人心中一生必去的仙境，所以決定利用暑假規畫一趟朝聖之旅。

