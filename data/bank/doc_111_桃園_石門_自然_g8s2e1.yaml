    | 電氣火災（Ｃ類） | 指電氣配線、馬達、引擎、變壓器、配電盤等通電中之電氣機械器具及電氣設備引起之火災。 |

    | 金屬火災（Ｄ類） | 指鈉、鉀、鎂、鋰與鋯等可燃性金屬物質及禁水性物質引起之火災。 |


    當我們了解火災的分類後，就能更安全有效率的滅火，更重要的是平常就要有好的用火及用電觀念，才能減少火災的發生。請閱讀以上敘述，請回答問題30 至問題32：'
