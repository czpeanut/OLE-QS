    4\mathrm{Fe}_{3}\mathrm{O}_{4}（\text{黑色}）＋\mathrm{O}_{2} &\rightarrow 6\mathrm{Fe}_{2}\mathrm{O}_{3}（\text{棕色}）\\

    2\mathrm{Fe}_{2}\mathrm{O}_{3}（\text{棕色}）&\rightarrow 4\mathrm{FeO}（\text{藍黑色}）＋\mathrm{O}_{2}\\

