- id: doc_111_桃園_石門_自然_g8s2e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: '柴油引擎排放的廢氣含有較多的氮氧化物($\mathrm{NO}_{X}$)，若能加入氨氣與柴油引擎產生的氮氧化物反應，則可減少排放廢氣造成的空氣汙染。氨氣與氮氧化物的反應中，速率最快的反應為：

    $\mathrm{NO}＋\mathrm{NO}_{2}＋2\mathrm{NH}_{3} \rightarrow 2\mathrm{N}_{2}＋3\mathrm{H}_{2}\mathrm{O}$

    已知柴油引擎排放的廢氣中，NO 所占比例約為$\mathrm{NO}_{2}$的9 倍。若欲藉由上述反應消耗大部分的氮氧化物，需使用觸媒轉化器調整反應前氮氧化物的比例，下列何種觸媒轉化器的設計最合理？'
  options:
  - label: A
    content: 將$\mathrm{NO}_{2}$氧化成NO，以提高NO 的比例
  - label: B
    content: 將NO 氧化成$\mathrm{NO}_{2}$，以提高$\mathrm{NO}_{2}$的比例
