- id: doc_111_桃園_石門_自然_g8s2e1_s2_30
  section: 2
  number: 30
  type: single
  page: 3
  stem: 火災是常見的燃燒反應，普通火災的助燃物是下列何者？
  options:
  - label: A
    content: 金屬
  - label: B
    content: 氫氣
  - label: C
    content: 氧氣
  - label: D
    content: 碳。
  group_stem: '(五)、提到火災一般人都直覺想利用水滅火，但是並非所有火災都可以用水滅火。火災依燃燒物質之不同可區分如下表，而且滅火器也有不同的適用類別呢！


    | 名稱類別 | 說明 |

    | :--- | :--- |

    | 普通火災（Ａ類） | 指木材、紙張、纖維、棉毛、塑膠、橡膠等可燃性固體引起之火災。 |

    | 油類火災（Ｂ類） | 指石油類、有機溶劑、油漆類、油脂類等可燃性液體及可燃性固體引起之火災。 |

    | 電氣火災（Ｃ類） | 指電氣配線、馬達、引擎、變壓器、配電盤等通電中之電氣機械器具及電氣設備引起之火災。 |

    | 金屬火災（Ｄ類） | 指鈉、鉀、鎂、鋰與鋯等可燃性金屬物質及禁水性物質引起之火災。 |


    當我們了解火災的分類後，就能更安全有效率的滅火，更重要的是平常就要有好的用火及用電觀念，才能減少火災的發生。請閱讀以上敘述，請回答問題30 至問題32：'
