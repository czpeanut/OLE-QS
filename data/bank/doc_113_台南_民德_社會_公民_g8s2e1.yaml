  section: 1
  number: 5
  type: single
  page: 1
  stem: '下列是某則新聞報導的內容。根據報導中畫雙底線部分以及我國相關的法規來判斷，下列敘述何者正確？


    【甲】18 歲已婚的瑜瑜向阿漢承租房子，半年過後【乙】瑜瑜已連續幾個月未繳納房租，阿漢幾次催討無果，最終選擇報警。

    後來，阿漢在警方的陪同下進到租屋處查看，卻發現瑜瑜將原本完好的房子破壞殆盡，屋內滿是垃圾；阿漢認為瑜瑜【丙】惡意拖欠房租，且蓄意破壞房屋，除報警處理外，也準備【丁】向瑜瑜提起民事訴訟。'
  options:
  - label: A
    content: 【甲】屬於限制行為能力人，因此該租賃契約無效
  - label: B
    content: 【乙】該行為屬於民法上的債務不履行，房東可要求損害賠償
  - label: C
    content: 【丙】只能透過訴訟的方式進行權利救濟
  - label: D
    content: 【丁】瑜瑜可適用《少年事件處理法》
