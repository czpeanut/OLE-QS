  stem: 香港旺角有一家專售潮流公仔的玩具店，在店門口擺放了一座巨型天線寶寶公仔，相當吸睛。一名5 歲男童在與家人逛街時，不慎撞倒店家擺放的公仔，遭到店家指責，家長以為是小孩的疏失，依店家的要求賠償新台幣11
