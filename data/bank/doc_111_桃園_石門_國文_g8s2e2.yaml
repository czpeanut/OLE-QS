- id: doc_111_桃園_石門_國文_g8s2e2_s7_18
  section: 7
  number: 18
  type: single
  page: 2
  stem: 根據本文的文意，教宗對科技的看法是？
  options:
  - label: A
    content: 科技日新月異，是上帝賜予人類的恩典。
  - label: B
    content: 透過科技的宣傳，達到人人信教的結果。
  - label: C
    content: 科技發展太過迅速，無人確保能合理明智地使用。
  - label: D
    content: 科技將帶來邪惡思想，汙染下一代的心靈。
  group_stem: "（二）2017 年麻省理工學院畢業演講    庫克 \n \n    去年，我有幸和教宗參與一場會議，他很關注科技發\n展的潛在風險和道德問題。他以深層的思考看待科技：科\n\
    技的力量從未如現在這般龐大，但無人能 確保科技會被\n合理明智地使用。  \n \n    今日科技已滲透我們的生活，改善我們的生活，但也\n存在隱憂。它對安全隱私和社交活動的威脅將不利於社會\n\
    發展。科技可以帶來便利，但也可能影響我們的價值、尊\n嚴和信念。我不擔心人工智慧讓電腦像人類一樣思考，我\n擔憂的是人類像電腦那樣思考 ―― 摒棄同理心和價值\n\
    觀，且不計後果。 \n \n    當科技在黑暗中摸索時，人性的光輝讓我們看清自己\n的處境與面臨的危 險。史蒂夫．賈伯斯曾說過，光有科\n技是不夠的，科技要與人文、人性結合，才能產生令人欣\n\
    喜的結果。當你真的投入，你會發現所做的事情可能改變\n社會。這意味著，智慧型手機可讓盲人參加馬拉松比賽，\n智慧型手錶可以在患者心臟病發作前捕捉到異常情況，平\n\
    板電腦可幫助自閉症兒童重新建立與世界的聯繫。賈伯斯\n的意思就是：科技應該服務全人類。"
  tags:
