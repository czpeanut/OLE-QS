  group_stem: "我們的一生總在歉疚。對不完美的自己歉疚，為了逃避歉疚，我們不斷努力，卻換來更大的歉疚，只因感覺不夠，無論做得再多，仍然不夠。我們始終認為可以更好一些，為了更好的自己，數度耗盡了自己。歉疚是一個祕密的洞，我們都曾長久生活在罪疚的深淵裡。\n\
