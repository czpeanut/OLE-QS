  group_stem: "和微生物打招呼\n    來跟地球上最小的生物說聲「哈囉」吧！這裡是六種最常見的微生物，它們到處都是，但是你通常沒辦法以肉眼看到它們。\n\
    ■ 細菌：每一隻細菌都是由單一細胞構成的，是地球上最簡單的細胞。細菌的數量比地球上任何其他生命形式都還要多。\n■ 病毒：病毒是最小的微生物，小到生活在其他生物的細胞裡。許多科學家認為病毒既不進食也無法生長，因此不能算是活的生物。\n\
    ■ 藻類：許多藻類也是由單一細胞構成的，但是它們通常比細菌大。藻類跟植物一樣，也利用叫做葉綠素的綠色化學物質把陽光轉化為可以利用的能量。\n■真菌：黴菌等真菌會把死去的動植物分解後作為食物。真菌可以由一個或多個細胞組成。\n\
    ■原生動物：原生動物只由一個細胞組成，但行為有點像動物——會到處移動並吃其他的生物。\n■古細菌：古細菌的外表看起來很像細菌，但是習性很不同。它們可以在極端環境裡生存，例如高溫或強酸。\n\
    (史蒂夫·莫爾德〈小心，這本書有細菌！：認識細菌、病毒和真菌的強大微生物王國〉)"
