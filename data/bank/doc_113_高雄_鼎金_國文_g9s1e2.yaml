- id: doc_113_高雄_鼎金_國文_g9s1e2_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 「垃圾是人類的『傳記』。」這句話表達的含義，下列詮釋何者最恰當？
  options:
  - label: A
    content: 風景區遺留的垃圾，是人們「到此一遊」的最佳寫照與證明
  - label: B
    content: 垃圾是生活中留下的痕跡，可從中窺知人類生活的點點滴滴
  - label: C
    content: 透過人們對於垃圾的處理方式，可了解人類文明發展的概況
  - label: D
    content: 各式各樣的廢棄物，反映出人類對事物的好.惡與價值的取捨。
- id: doc_113_高雄_鼎金_國文_g9s1e2_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: 喂—出來！一文中，下列敘述，何者帶有反諷的意味？
  options:
  - label: A
    content: 學者聯絡研究所，請人帶來高性能的擴音器，試圖調查來自底部的回音
  - label: B
    content: 商人讓夥伴們在都市裡四處奔走，對外宣傳他們公司有個無底洞
  - label: C
    content: 大家都認為這個洞若非深不可測，那就是底部相當寬廣
  - label: D
    content: 這個洞讓都市居民感到相當安心。
- id: doc_113_高雄_鼎金_國文_g9s1e2_s1_24
  section: 1
  number: 24
  type: single
  page: 2
  stem: 喂—出來！一文中，洞剛出現時，引發許多人不同的作為：年輕人「朝著洞裡大喊一聲」、「撿起一旁的小石子，打算丟進去」；老人出聲制止年輕人：「這樣會有報應的，快住手」；學者一臉「天底下沒有我不知道的事」的表情看著洞；拿著相機的記者將粗繩綁在腰間。針對上述各種身分的人的心態分析，下列何者正確？
  options:
  - label: A
    content: 年輕人保守固執
  - label: B
    content: 老人一意孤行
  - label: C
    content: 學者自以為是
  - label: D
    content: 記者唯利是圖。
