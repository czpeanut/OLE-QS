  group_stem: '吳 富陽 董昭之，嘗乘船過錢塘江，中央見有一蟻，著一短蘆，蘆長二三尺，走一頭迴，復向一頭，甚遑遽（１）。昭之曰：「此畏死也。」欲取著舡（２），舡中人罵：「此是毒螫物，不可長，我當蹋殺之。」昭意甚憐此蟻，因以繩系蘆著船。船至岸，蟻得出。中夜夢一人，烏衣，從百許人來謝云：「僕不慎墮江，慚（３）君濟活。僕是蟲王，君若有急難之日，當見告語。」後昭之遇事繫獄，蟻領群蟻穴獄（４），昭遂得免。

    【注釋】（１）遑遽：既惶恐又驚慌。（２）舡：船。（３）慚：感激。（４）穴獄：在監獄裡挖洞。'
