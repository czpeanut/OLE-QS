  page: 1
  stem: 「（甲）長大後才明白，母親的□□□□中隱含著最深沉的愛。／（乙）他做事向來□□□□，會搞出這些烏龍一點也不意外。／（丙）空谷裡傳來陣陣伐木聲，□□□□地迴響在每個角落。」上述缺空處依序應填入下列何者最恰當？
  options:
  - label: A
    content: 支支吾吾／迷迷糊糊／孜孜不倦
  - label: B
    content: 絮絮叨叨／唯唯諾諾／孜孜不倦
  - label: C
    content: 支支吾吾／唯唯諾諾／綿綿不止
  - label: D
    content: 絮絮叨叨／迷迷糊糊／綿綿不止。
