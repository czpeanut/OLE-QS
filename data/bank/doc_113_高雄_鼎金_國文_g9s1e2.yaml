    虞（３）之腹，與崇尚古玩同一致也。所怪於世者，棄美名不居，而故異端其說，謂佛法如是，是則謬矣。吾輯飲饌一卷，後肉食而首蔬菜，一以崇儉，一以復古；至重宰割而惜生命，又其念茲在茲，而不忍或忘者矣。」根據本文，下列敘述何者正確？【注釋】（１）踏破：踐踏。（２）羲皇：伏羲氏，三皇之一。（３）唐虞：唐堯、虞舜二帝，為傳說中的「五帝」。
