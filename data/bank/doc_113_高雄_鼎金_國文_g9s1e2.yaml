  group_stem: "我們的一生總在歉疚。對不完美的自己歉疚，為了逃避歉疚，我們不斷努力，卻換來更大的歉疚，只因感覺不夠，無論做得再多，仍然不夠。我們始終認為可以更好一些，為了更好的自己，數度耗盡了自己。歉疚是一個祕密的洞，我們都曾長久生活在罪疚的深淵裡。\n\
    \  感到歉疚，是否是因為沒人告訴我們，日常的柔軟亦可以承接我們，我們不必挖掘祕密的洞，讓自己墜落下去？沒人告訴我們，傷痕、痛苦、失敗、挫折並非人生的汙點，而是使我們獨特於他者的可能？更或許是沒人告訴我們，生命所遭遇的苦痛艱難，其所留下的傷痕是辨認自己的方式，而非反覆鞭笞自我的刑具？若能沿著這些痕跡，撫摸其紋理，理解並寬容自己，最後即能從傷痕裡映照出自己真實的模樣。\n\
    \  於身體裡藏著無數痛苦祕密的洞，我們最終不必以墜落的姿態，跌進深淵裡。盛載痛苦祕密的洞，也能是條路徑，當我們變得柔軟而微小，真正踏進洞裡，沿著藏在洞裡的傷痕記號，緩緩前行，終能逐步走出傷痛。\n\
    \  閱讀過度努力時，讀見與我們生命相似的他者，讀見我們對不完美與瑕疵的自我感到歉疚的時刻，讀見讓我們感到罪疚與苦痛的人事物，同時述說著，我們不必選擇反覆刨掘內在傷口來拯救自己。我們可以輕撫傷痕，從傷痕了解並寬容自己，不必與他者為敵，亦不必再透過他者來定義自己，而是學習描繪自己真實的樣貌，並學會接納他者真實的模樣。\n\
    \  除此之外，亦領著傷痕累累的我們，走入洞裡的傷痕之路，以雙手撫摸那些記號，觸摸其紋理，緩緩前行，最後的最後，得以走到傷痛之外。於傷痛的外邊，又以溫柔的目光與細膩話語描繪洞外的世界。原來在歷經血液與眼淚之後，於祕密與傷痕的深淵之外，存在一整片晴朗而澄澈的藍天。\
    \     （節選自陳曉唯 過度努力．推薦序．後來的藍天）"
