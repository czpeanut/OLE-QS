  stem: 「夫山之異於眾者，尚能待人而自見，而況人之異於眾者哉！天於詭奇之地不多設，人於登臨之樂不常遇。有其地而非其人，有其人而非其地，皆不足以盡夫遊觀之樂也。今靈巖為名山，諸公為名士，蓋必相須而適相值，夫豈偶然哉！宜其目領而心解，景會而理得也。」下列敘述何者與這段文字中的觀點最接近？
  options:
  - label: A
    content: 若能保持心靈的澄淨，所到之處都會是美景
  - label: B
    content: 徜徉於大自然中，可洗滌世俗的汙濁與煩憂
  - label: C
    content: 只要有名士登臨，無論怎樣的山水都可成為名勝
  - label: D
    content: 要盡遊觀之樂，須有特別的景致與懂得欣賞的人。(110 會考)
