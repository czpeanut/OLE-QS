  stem: 「我們終於來到一個時代：膚色不再能夠指涉國籍，語言不足以涵蓋區域，服裝無以表達任何身分。」根據這段文字，下列何者最適合用來描述這個時代？
  options:
  - label: A
    content: 物質化的時代
  - label: B
    content: 國際化的時代
  - label: C
    content: 娛樂化的時代
  - label: D
    content: 電子化的時代。
  group_stem: "我坐在新加坡的一家法國餐廳裡；兩天後，又坐進另一家倫敦的印度餐廳。一個星期後；我來到巴黎的一間飯館，看了菜單，才知道他們供應泰國菜。\n\
    \  所以，一天下午，當我在香港 中環的一處咖啡店，目睹一位婦人點了一杯熱咖啡和一盤又脆又香的中式炸豆腐，旁邊擺一小碟紅豔豔的辣椒沾醬，當作她的下午茶，我明瞭，自己一點也不應該大驚小怪。\n\
    \  當工業革命開始建造第一條鐵路的時候，信息開始流竄，區域開始互相模仿，人類開始移動，界限開始模糊；飛機緊跟著增快了移動的流通速度，加雜了族群的混合；而電話電報讓整個世界零時差的活在一起。網路，給了最後的臨門一腳。\n\
    \  我們終於來到一個時代：膚色不再能夠指涉國籍，語言不足以涵蓋區域，服裝無以表達任何身分。食物，成為最後一種辨識文化的方法。\n   你沒辦法指著一個黝黑膚色的人類，宣稱他或她是象牙海岸人，你卻可以指著檸檬魚，肯定那是一道泰國菜，不用擔憂有人會在你的電子郵箱塞滿抗議信件。\n\
    \  每一個號稱國際大都會的城市，都必須提供一連串不同文化的餐廳名單，泰國菜、巴西窯烤、法國料理、印度口味、中國料理、日本菜 … … ，以證明自己的確是個大熔爐，證明自己擁有豐富「文化」。\n\
    \  在這個逐漸人工化、幻象化、電子化的超現實環境裡，幾乎所有的有機物或無機物都可以複製、移植、概念化。食物依舊牢牢連接著原始的物質環境，成為唯一真實的現實。\n\
    \  與物質環境緊緊相連接的臍帶，讓食物成為少數仍擁有地區限制的東西。你可以在美國 紐約生產製造跟印度 加爾各答一模一樣的建築物或瓷器或梳子或釘書機，可是你就是無法種植一模一樣的香料；即使你從印度進口或移植，你還是無法判斷在那種天氣下一個印度廚師究竟會灑下多少種香料，去刺激你的味蕾，讓你開懷大吃。你只能模擬，只能猜測，只能回憶。同理，你能在臺北做出全世界最好吃的日本壽司，卻不見得是最道地的口味。因為，最道地，不一定是最好吃。\n\
    \  透過電子圖像語言，你已經可以和Ｏｔａ Ｂｅｎｇａ（１）直接作朋友，往舊金山觀賞大橋的落日，到米蘭名店購買一條褲子，不必使用你的身體也能經歷一切。但是，要吃一枝北京糖葫蘆，活在電子世界的人們依然要返回物質世界，使用自己那碳水化合物做成的肉身，親身咬下一口。\n\
    \  我們的身體就是文化的記憶。我們就是我們吃下去的食物。今後，廚師不叫廚師了。請稱他們作「文化工作者」。\n        （節選自胡晴舫 旅人．文化菜色）\
    \ 【注釋】（１）Ｏｔａ Ｂｅｎｇａ：二十世紀初，被美國人帶回紐約展示的非洲土著。"
