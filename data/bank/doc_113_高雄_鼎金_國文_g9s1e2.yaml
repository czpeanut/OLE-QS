  stem: 蔣勳在甜酸中提到：「在不同的文字語言中，『糖』、『甜』都有引申為『親密』、『愛』或『幸福』的意思。把自己親密的愛人叫做『甜心』，是用生理口腔中糖的甜味記憶，比喻心裡充滿愛意的幸福感吧。」可知糖或甜的字詞大致上都有正面意義，下面何者並非如此？
  options:
  - label: A
    content: 甜言蜜語
  - label: B
    content: 甜甜蜜蜜
  - label: C
    content: 人義水甜
  - label: D
    content: 嘴甜心苦。
