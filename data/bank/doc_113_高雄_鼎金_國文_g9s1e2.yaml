- id: doc_113_高雄_鼎金_國文_g9s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: 與宋元思書一文寫景技巧高超，將一百許里的富春江山水，濃縮在字裡行間。請問下列文句的寫景描述，何者正確？
  options:
  - label: A
    content: 「風煙俱淨，天山共色」描寫天和山同時被雨水洗淨
  - label: B
    content: 「游魚細石，直視無礙」描寫江水之淺
  - label: C
    content: 「負勢競上，互相軒邈」描寫江水之急
  - label: D
    content: 「橫柯上蔽，在晝猶昏」描寫樹木之茂密。
- id: doc_113_高雄_鼎金_國文_g9s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 1
  stem: 「鳶飛戾天者，望峰息心；經綸世務者，窺谷忘返。」這段文字的弦外之音是什麼？
  options:
  - label: A
    content: 名利難以盡求，自然之趣更堪珍惜
  - label: B
    content: 秀麗迷人之風景，常在人跡罕至處
  - label: C
    content: 不敢冒險者，永遠見不了奇山異水
  - label: D
    content: 以自然為師，可激發努力進取之心。
- id: doc_113_高雄_鼎金_國文_g9s1e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 列文句中的「苦」字，何者詞性與其他三者不同？
  options:
  - label: A
    content: 她總是待在圖書館裡埋頭「苦」讀，從來不參加學校的社團活動
  - label: B
    content: 火氣大時，最好來杯「苦」茶，飲用過後，可讓體內的熱氣散去
  - label: C
    content: 年少時所經歷的「苦」日子和磨練造就了他如今非凡的成就
  - label: D
    content: 請別再愁眉「苦」臉，看到你如此喪志，我真是為你感到擔憂。
- id: doc_113_高雄_鼎金_國文_g9s1e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 下列選項「 」中的詞語，何者意思前後相同？
  options:
  - label: A
    content: 學生「時代」就讀過這篇文章，當時不覺得怎樣／一味守舊，不肯學習新的事物，恐怕會跟不上「時代」
  - label: B
    content: 拏字上面是奴，下面是手，自然顯示船夫用手撐的「感覺」／我「感覺」他對我心懷不滿，卻不知緣故
  - label: C
    content: 霧凇是水氣，當氣溫接近「冰點」，霧氣逐漸有雪意／得知援軍無法及時到達，他的情緒瞬間絕望到了「冰點」
  - label: D
    content: 湖心亭內兩人正「相對」飲酒，一童子蹲在爐前煮酒／久別重逢的他們，「相對」無言，只是激動的看著對方。
- id: doc_113_高雄_鼎金_國文_g9s1e2_s1_18
