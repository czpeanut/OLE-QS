  stem: 王老師非常欣賞一位古人，在課堂中曾用「一對二表三分鼎／六出七縱八陣圖」來形容他。王老師欣賞的古人和下列哪一副對聯形容的對象相同？
  options:
  - label: A
    content: 三顧頻繁天下計／一番晤對古今情
  - label: B
    content: 一騎紅塵妃子笑／無人知是荔枝來
  - label: C
    content: 江東子弟多才俊／捲土重來未可知
  - label: D
    content: 讀書破萬卷／下筆如有神。
