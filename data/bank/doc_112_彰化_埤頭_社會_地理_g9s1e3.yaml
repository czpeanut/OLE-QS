  group_stem: 1511 年，當歐洲人第一次來到這座島嶼時，由於當地居民的膚色偏黑，與非洲國家赤道幾內亞相似，因而將此島命名為「新幾內亞島」，其位置即印尼的巴布亞省，東邊及南邊則與索羅門群島、澳洲隔海相望。新幾內亞島上多為群山隆起的高地，樹木繁生長成森林，導致部落之間交流不易，各部落至今仍保留自己的語言、文化及傳統儀式。在新幾內亞島上如此多種、相異的文化中，卻有一個相當普及的物件，那就是就地取材編織而成的「畢倫包
    Bilum」，畢倫包除了用它來背負傳統自給式的農作物、木材等各式物品，或是獵捕到的豬隻、魚獲，不過最特別的是，畢倫包竟然還是一個育嬰袋，無論是陪著母親出門在外務農，或是在家裡午覺休息，只要將嬰兒放在畢倫包之中，就能讓他們安詳地睡去，是當地婦女重要的育兒方式。請問
