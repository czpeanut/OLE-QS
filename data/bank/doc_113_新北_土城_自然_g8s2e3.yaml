  stem: 每年端午節，人們會在正午時挑戰「立蛋」這項有趣的民俗活動。然而由於雞蛋底端為圓弧形，接觸面光滑，故往往不易使蛋立起來。有些人也會偷偷在蛋的下方抹一點鹽，這樣不只成功率提高，也更容易讓雞蛋穩穩地站好。關於在蛋底部抹鹽能夠提高立蛋的成功率，以下推論何者較為合理？[6-2]
