- id: doc_113_新北_土城_自然_g8s2e3_s2_38
  section: 2
  number: 38
  type: single
  page: 4
  stem: 關於文中所提到的PLA，下列敘述何者正確？[5-3]
  options:
  - label: A
    content: PLA 主要從石油提煉而來，不屬於再生資源
  - label: B
    content: 與澱粉、纖維素同為天然聚合物
  - label: C
    content: 屬於耐高溫的網狀聚合物
  - label: D
    content: 由數千個以上的原子所組成。
  group_stem: "綠色塑膠的希望與挑戰\n  全球對永續發展的追求，促使人們尋找傳統塑膠的替代品，其中聚乳酸 (Polylactic acid, PLA)\
    \ 是一種可被生物降解的材料，被譽為「綠色塑膠」。在臺灣，自2002 年實施限塑政策之後逐漸被業者所採用，但在2023 年8 月卻又將被政府修法禁用。\n\
    \  聚乳酸的小分子為乳酸，這是一種從玉米、甘蔗等植物發酵而來的有機酸。乳酸分子具有-COOH 原子團和-OH 原子團，透過酯化反應形成重複的-COOC-結構，進而構成聚乳酸。\n\
    \  PLA 之所以能被生物降解，是由於其分子鏈在特定條件下容易發生水解反應，降解過程分為兩階段：\n1.水解作用：在高溫環境下，水分子會切斷聚合物鏈，使分子量降低。\n\
    2.微生物降解：當PLA 的分子量降低後，小分子會透過微生物的呼吸作用，進一步將乳酸分解為二氧化碳、水、甲烷，最終實現完全的生物降解。\n  然而，PLA\
    \ 的生物降解需要特定的環境條件，通常需要較高的溫度與足夠的濕度，且需要存在能夠分泌降解PLA 的微生物群。\n  在普通垃圾掩埋場或自然環境中，PLA 的降解速度極慢，甚至可能需要數百年，反而因為對於「生物可降解塑膠」的誤解造成環境問題。同時由於PLA\
    \ 的熔點與傳統塑膠不同，不能與傳統塑膠混合回收，否則會污染回收鏈。要求嚴格的分類系統，也增加了回收的複雜性。\n  儘管有這些限制，PLA 仍因其可再生性和可降解性，在包裝、3D\
    \ 列印、醫療等領域展現出廣泛應用。作為一種可再生、可生物降解的材料，PLA 無疑為塑膠產業帶來希望，因此要充分發揮PLA 的潛力，就必須建立更完善的工業堆肥基礎設施和分類回收系統，同時持續研發，以改善其材料性能並降低成本，才能真正讓PLA\
    \ 在實現「循環經濟」中扮演更關鍵的角色。"
  shared_asset: g2_38_40
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 理化
      code: 5-3
      title: 聚合物與衣料纖維
      chapter: 第5章 有機化合物
