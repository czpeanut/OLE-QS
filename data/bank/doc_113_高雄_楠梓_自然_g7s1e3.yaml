  section: 2
  number: 35
  type: single
  page: 4
  stem: 本文中的新藥「腺在好勢」的作用機轉和(圖四)中的哪一個腺體較相似？
  options:
  - label: A
    content: 甲
  - label: B
    content: 丙
  - label: C
    content: 丁
  - label: D
    content: 戊
  group_stem: '◎在一個平靜的小鎮裡，住著一對夫妻—凌內(男)和葉羨(女)。他們是一對熱愛研究內分泌系統的「瘋狂科學家」。一天，他們突發奇想，要研發兩種新藥：一種名為「腺在好勢」，可以直接影響全身的內分泌腺，如果睡不著、月經不順、新陳代謝低下等等內分泌失調，只要服用一顆「腺在好勢」，包準通體舒暢。另一種是針對幼童及青少年的生長發育，名為「青春不打折」。

    夫妻倆分工合作，葉羨沒日沒夜在研發「青春不打折」，結果月經週期亂七八糟；而凌內在研發「腺在好勢」的過程中，為了提神，一個晚上喝下太多咖啡，導致情緒高漲，過度興奮。

    根據加拿大圭爾夫(Guelph)大學人類健康與營養科學系的研究人員進行的研究，咖啡引起的血糖變化主要和荷爾蒙有關，咖啡因會促使 (X) 分泌，這是一種壓力荷爾蒙，讓人們亢奮、處於應戰的狀態，因此更需要能量，血糖也會短暫發生變化，相對來說，
    (Y) 敏感度就會下降，血糖自然偏高。但這種效應是暫時性的，時間再久一點，整個內分泌的運作都會回歸正常。(本文部份參考康健雜誌《飯後喝咖啡血糖卻飆高？專家：「正確飲用」長期有助控血糖》)(註：(圖三)為一天中某個時段血糖變化示意圖；(圖四)為男性與女性內分泌系統示意圖)依據本文敘述回答35～42題(※圖片在第五頁)：'
