- id: doc_113_高雄_楠梓_自然_g7s1e3_s2_48
  section: 2
  number: 48
  type: single
  page: 6
  stem: 文中提及「人體在酒精濃度增加時，會降低體內保護腦部的化學物質分泌」，關於此敘述，下列推論何者最合理？
  options:
  - label: A
    content: 酒精會與保護腦部的化學物質產生化學反應，降低其濃度
  - label: B
    content: 酒精會加速保護腦部的化學物質分解，使其無法有效作用
  - label: C
    content: 酒精會抑制保護腦部的化學物質生成，導致其分泌量減少
  - label: D
    content: 酒精會阻斷保護腦部的化學物質傳遞路徑，影響其保護功能
  group_stem: "◎閱讀下列文章回答48～50題\n我們常形容愛喝酒的人「喝酒喝到腦袋透逗」，根據統計，台灣100個人中有2~3個人有酒癮問題；加上不得不飲酒的應酬族群，受酒精傷腦的人口眾多。如何逆轉飲酒帶來的腦部損傷？專家研究發表，「健走」能幫助身體修復飲酒帶來的腦部損傷。\n\
    腦部原本就會隨著年齡增長，而自然退化萎縮；通常約從30歲，腦部老化就逐漸展開，主因是神經纖維聚集的區域細胞自然死亡，造成腦部變小。除了老化，酒精也是腦部退化萎縮的另一主因，酒精會加快腦部退化萎縮的速度。研究證實，喝酒損傷腦部的神經，就像人老後的腦部功能衰退萎縮一樣。神經專科醫師表示，不論男女，人體在酒精濃度增加時，會降低體內保護腦部的化學物質分泌，且腦組織的細胞也會減少。\n\
    \ 一旦腦內的神經細胞死亡，就回不去了。腦部退化萎縮的症狀，輕者出現記憶力下降、思考力退化，重者產生失智症。根據統計，經常大量飲酒的熟男，罹患失智症的風險是不飲酒的4.6倍。\n\
    \ 德國海德堡大學附設醫院的醫學專家指出，約2杯酒或3杯啤酒入喉後，經過6分鐘就會改變腦細胞組織。就算只有在應酬時才喝酒，長期下來也會使思考力下降。一項研究發現，一生喝的酒量越多，腦的萎縮程度越嚴重；且飲酒歷史越長，大腦萎縮發生的時間會提早。\n\
    健走是有氧運動，能活化腦神經功能，且緩解老化引起的神經及認知功能退化。人體中最耗費氧的部位就是腦神經細胞，若是健走時搭配呼吸調整，可以讓腦部循環順暢，修復受損的血管，進而預防健忘、失智症的發生。因此，可以逆轉或預防喝酒對大腦造成的損傷。多走樓梯少搭電梯、辦公時走到同事桌前當面討論事情，少用電子郵件和手機、搭公車或捷運時提前一站下車等等，都可以增加健走的機會，一掃酒精對腦部的傷害。\n\
    (節錄自《啟新診所電子報》)"
