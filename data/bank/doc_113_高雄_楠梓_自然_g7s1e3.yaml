- id: doc_113_高雄_楠梓_自然_g7s1e3_s2_45
  section: 2
  number: 45
  type: single
  page: 6
  stem: 文中提到植物釋放化學物質的目的，不包含以下哪一項？
  options:
  - label: A
    content: 吸引授粉者
  - label: B
    content: 警告周圍植物
  - label: C
    content: 賄賂草食動物
  - label: D
    content: 保護自身安全
  group_stem: '◎閱讀下列文章回答45～47題

    任何在窗臺上種過盆栽的人都知道，植物會感知光線並且向著光生長，向日葵之所以叫向日葵，就是因為它具有追蹤太陽的習性。在北半球，生長在空地上的樹木會有明顯朝向南方傾斜的向日性，幾百年來一直被用來做為辨識方向的自然幫手；在南半球則是向北傾斜。

    植物對於空氣、土壤及水中各式各樣的化學物質都相當敏感，寄生植物菟絲子的芽甚至可以分辨嫩嫩的番茄株與老老的小麥梗，它們總是會朝著偏好的宿主植物方向生長，以便寄生在宿主上。

    豌豆及牽牛花等爬藤植物有捲鬚或莖，能在碰觸到合適的支撐物時捲曲起來。有些植物甚至能感知比用指頭摘花的力道還要輕微的觸摸。西印度胡瓜能感知大於0.25公克的重量，而大部分的人若閉起眼睛，由其他人幫忙在手指上放東西，通常要超過2公克才會有感覺。

    植物在遭受寄生、病害或者遭草食性動物襲擊時，會釋放化學物質來警告周邊其他植物，這些化學物質能引發其他植物釋出具有防禦效果的化學物質，例如味道苦澀的丹寧，讓這些吃草的動物知難而退。植物也會盡其所能的試著吸引能幫忙授粉或散播種子的動物，花與果實的外觀與香氣就是用來招攬的廣告，花蜜的甜味及果實的糖分則是賄賂品。

    下一次當你在除草、靠在一棵樹上、讚美一朵盛開的花、津津有味的嚼著蘋果、薯條或蘿蔔時，不妨停下來想一想：植物雖然沒有大腦，但它們也是有感覺的喔！

    (節錄及改編自《酷自然：給孩子的神奇自然知識》遠流出版)'
