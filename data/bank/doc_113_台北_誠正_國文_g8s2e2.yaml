- id: doc_113_台北_誠正_國文_g8s2e2_s2_38
  section: 2
  number: 38
  type: single
  page: 5
  stem: 關於<甲>和<乙>的寫法，下列選項何者敘述正確？
  options:
  - label: A
    content: 兩篇韻腳相同
  - label: B
    content: 兩篇都有對句
  - label: C
    content: 兩篇皆非韻文
  - label: D
    content: 兩篇都是樂府詩
  group_stem: '(二)


    <甲>

    無道人之短，無說己之長。

    施人慎勿念，受施慎勿忘。

    世譽不足慕，惟仁為紀綱¹。

    隱²心而後動，謗議庸³何傷？

    無使名過實，守愚聖所臧⁴。

    在涅⁵貴不緇⁶，曖曖⁷內含光。

    柔弱生之徒，老氏誡剛強。

    行行⁸鄙夫志，悠悠故難量。

    慎言節飲食，知足勝⁹不祥。

    行之茍¹⁰有恆，久久自芬芳¹¹。──崔瑗座右銘

    【注釋】

    1. 綱：法則。

    2. 隱：安穩的意思。

    3. 庸：豈。

    4. 臧：音ㄗㄤ，動詞，讚賞。

    5. 涅：音ㄋ一ㄝˋ，污濁的環境。

    6. 緇：音ㄗ，動詞，被污染。

    7. 曖曖：指光輝暗藏的樣子。

    8. 行行：音ㄏㄤˋ，剛強的樣子。

    9. 勝：克制、制止。

    10. 茍：如果。

    11. 芬芳：在此比喻才德的發揚。


    <乙>

    事父盡孝敬，事君端忠貞。

    兄弟敦和睦，朋友篤信誠。

    從官重公慎，立身貴廉明。

    待士慕謙讓，蒞民¹²尚寬平。

    理訟惟正直，察獄必審情¹³。

    謗議不足怨，寵辱詎¹⁴須驚？

    處滿常憚盈，居高本慮傾。

    詩禮固可學，鄭衛¹⁵不足聽。

    幸能修實操，何俟¹⁶釣虛聲？

    白珪¹⁷玷¹⁸可滅，黃金諾不輕。

    秦穆飲盜馬¹⁹，楚客報絕纓²⁰，

    言行既無擇，存歿自揚名。──陳子昂座右銘

    【注釋】

    12. 蒞民：對待百姓。

    13. 審情：查明真情。

    14. 詎：豈、怎。

    15. 鄭衛：靡靡之音。

    16. 俟：音ㄙˋ，等待。

    17. 珪：音ㄍㄨㄟ，貴重的玉器。

    18. 玷：音ㄉ一ㄢˋ，玉上的斑點。

    19. 秦穆飲盜馬：秦穆公不僅不罰偷他馬的人，反而給他們酒喝，後來穆公被晉所困，盜馬的人前去解救穆公。

    20. 楚客報絕纓：楚莊王宴請群臣，酒酣燭熄，有人拉皇后衣服，皇后拉斷他的帽帶。楚莊王命令朝臣把帽帶全部拉掉，不加追究。後來吳國攻楚，有一人義無反顧，終於退敵，後來一問，才知是昔日「絕纓者」。'
  tags:
    textbook: 八下 自學課一 軼事瑣聞大觀園──唐宋筆記選
