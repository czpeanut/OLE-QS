  stem: 以下選項對於陋室銘一文的說明哪一項正確？
  options:
  - label: A
    content: 文章隔句押韻，音韻和諧，讀來琅琅上口，符合「銘文」的文體特色
  - label: B
    content: 作者寫這篇文章主要在於戒勉自己居家或交友要多注意環境及品質
