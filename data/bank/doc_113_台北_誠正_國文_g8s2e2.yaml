  section: 1
  number: 9
  type: single
  page: 1
  stem: 徐志摩說：「數量大，似乎按照著一種自然律，自然的會有一種特別的排列，一種特別的節奏，一種特殊的式樣，激動我們審美的本能，激發我們審美的情緒。」請問下列何者不屬於「數大之美」？
  options:
  - label: A
    content: 整個太平洋洶湧的波浪，一萬匹飄著白鬣的藍馬，呼嘯著，疾奔過我的腳下
  - label: B
    content: 新的小雀榕自枯樹裡長出橢圓、淺黃的優雅嫩葉，象徵新生命的孳生不息
  - label: C
    content: 放眼望去，盛開的金針花如波浪般，與豪氣的縱谷山脈交織成色彩斑斕的黃金海浪
  - label: D
    content: 那是臨著一大片望不到頭的草原，滿開著豔紅的罌粟，在青草裡亭亭地像是萬盞的金燈，陽光從褐色雲裡斜著過來，幻成一種異樣的紫色
  lesson_raw:
    title: 我所知道的康橋
