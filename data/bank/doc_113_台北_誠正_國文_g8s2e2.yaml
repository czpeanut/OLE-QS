  stem: 有關我所知道的康橋一文的說明，下列敘述何者正確？
  options:
  - label: A
    content: 全文以「空間」為主軸，以康河為中心延伸，搭配「時間」的轉移，寫盡康橋四季之美
  - label: B
    content: 文中連用三個「頃刻間」，其用意在強調康橋清晨的天候多變，令人難以捉摸
  - label: C
    content: 文中用了好幾次「你如愛……」，津津樂道的口吻透露對康橋美景與人情的熱愛
  - label: D
    content: 文末說：「我心頭頓時感著神異性的壓迫，我真的跪下了，對著這冉冉漸隱的金光。」作者跪下的原因是突然體悟到時光易逝，內心充滿感慨
  lesson_raw:
    title: 我所知道的康橋
    basis: 題目指涉課文我所知道的康橋
