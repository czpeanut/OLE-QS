  stem: 有關陋室銘一文中的文意分析，下列敘述何者正確？
  options:
  - label: A
    content: 「山不在高，有仙則名；水不在深，有龍則靈」這四句在強調陋室的風水絕佳
  - label: B
    content: 「苔痕上階綠，草色入簾青」描述作者的居家環境的雜草叢生，荒蕪一片
