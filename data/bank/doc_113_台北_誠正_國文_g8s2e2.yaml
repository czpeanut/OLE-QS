    content: 「兒子，如果用你的方法在賣水，那只能叫滿足，永遠得不到被自然、大地擁抱的那個親情」表達父親贊同兒子的想法，覺得賣「獵人喝的水」可以讓眾人喝完水感受到貼近自然、真正體會自然的美好
