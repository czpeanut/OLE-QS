  stem: 有關我所知道的康橋一文的寫作手法，下列敘述何者錯誤？
  options:
  - label: A
    content: 以擬人手法描寫康河河畔的百花盛開，顯得春意盎然
  - label: B
    content: 善用排比，如六個「關心」句、四個「你如愛」，營造明快的節奏感
  - label: C
    content: 寫作人稱靈活地切換，使用許多的「你」，使文章活潑熱情
  - label: D
    content: 「晚景的溫存卻被我這樣偷嘗了不少」以誇飾的手法寫出欣賞晚景的得意
