- id: doc_113_台北_誠正_國文_g8s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 行文時，透過感官交錯表現的手法，可引領讀者去聯想和體會文中意境。例如：「遠近的炊煙……彷彿朝來人們的祈禱，參差地翳入了天聽」是以「聽覺」印象來表現「視覺」感受。請判斷下列選項，何者也是以「聽覺」印象來表現「視覺」感受?
  options:
  - label: A
    content: 荷塘中的月色並不均勻，但光與影有著和諧的旋律，如小提琴上奏著的名曲
  - label: B
    content: 馬蹄聲，孤獨又憂鬱的自遠至近，灑落在沉默的街上成白色的小花朵
  - label: C
