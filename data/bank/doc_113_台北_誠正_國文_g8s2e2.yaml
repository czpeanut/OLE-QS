  section: 2
  number: 36
  type: single
  page: 4
  stem: 根據本文，下列何者比較貼近作者的想法？
  options:
  - label: A
    content: 對自然萬物發自內心的傾聽與欣賞，勝於強記分類與學名
  - label: B
    content: 記錄風聲、鳥聲、蟲鳴的變化，是每個人日常應做的功課
  - label: C
    content: 聽覺感官相當重要，它是唯一能夠引領我們走入自然的媒介
  - label: D
    content: 傾聽自然是私密的行為，那份心靈的悸動無法與旁人分享
  group_stem: "（一）\n\n遊戲開始──\n  走進一片樹林之中，我開始告訴你：閉起眼睛，練習使用心靈深處的聽覺。\n  聽見風聲了嗎？風吹拂樹林的聲音，樹葉沙沙作響的韻律記錄在你的心靈了嗎？你能夠閉著眼睛「聽」出風吹來的方向嗎？試著判斷風流動的大小，用你自己的標準。\n\
    \  聽見鳥聲了嗎？如果你聽見了，不必急於知道牠的名字，牠的樣子。也許你可以企圖從鳥聲中分辨出不同，包括同一種鳥發出的各種婉轉變化的聲音，以及不同鳥種一起混雜的聲音。注意聲音的來源，判斷它的方向，它將會帶領你得知那隻鳥的藏匿處。\n\
    \  聽見任何昆蟲的聲音了嗎？也許我們毋須知道牠的名字，名字只是人類使用的一種符號。聽得見蟋蟀的叫聲並且欣賞它，遠勝於知道牠的學名。\n  如果這片樹林中的聲音，因為你的專注投入而愈來愈豐富，你的遊戲便成功了。\n\
    \  每日花幾分鐘「傾聽自然」，是一件愉悅的事，並且把你的快樂遊戲分享予朋友，導引他尊重自然！\n                            \
    \         ──節選自王家祥遊戲開始"
