  group_stem: '【A】

    Every year, hundreds of thousands of people join the Mazu Pilgrimage in Taiwan
    to show their respect to Mazu, the goddess of the sea. After every Chinese New
    Year, Mazu of Gongtian Temple is carried to visit another Mazu Temple－Chaotian
    Temple, which is to the south. Then it returns to Gongtian Temple to end the trip.
    The trip is around 400 kilometers in total.

    What makes this pilgrimage special is that the course changes every year. It’s
    said that Mazu’s carriers can feel Mazu’s will, by which they move to decide the
    course when they are walking. People must follow closely and be ready for surprises.
    Like last year, when Mazu’s carriers just passed a bus station, they suddenly
    headed to the east to a school nearby. After staying for a while, they went back
    to the next temple.

    During the trip, Mazu’s carriers go only on foot. As for the followers, they would
    travel by walking, scooter, car, or bike. Besides that, no one can be sure how
    long the trip will take. For example, it lasted for 6 days in 2009 but 12 days
    in 2017.

    Many people believe that joining the pilgrimage will bring good luck and blessings.
    That’s why more and more followers will join this special trip with Mazu.

    📖 Mazu Pilgrimage 媽祖遶境'
