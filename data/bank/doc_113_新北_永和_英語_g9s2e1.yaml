  stem: 'Below are three important points in the reading.

    a. How the fact about the bee dance was found.

    b. The one who changed people’s thoughts about bees.

    c. How the bees shared the place of food with others.

    In what order does the writer put the points in the reading?'
  options:
  - label: A
    content: a→b→c
  - label: B
    content: a→c→b
  - label: C
    content: b→a→c
  - label: D
    content: b→c→a
  group_stem: '【C】

    Busy Bees

    For thousands of years, people thought of bees as something like stupid robots,
    working all day to collect food. They believed that bees just simply moved from
    flower to flower and danced in the shape of eight for nothing. However, this idea
    changed when a scientist named Karl von Frisch appeared.

    Before Frisch, no one ever asked why bees moved in a special dance like number
    “8.” In the study, Frisch placed a plate of sugar water, which was non-scented,
    for a bee. By doing so, bees couldn’t count on their sense of smell to find food.
    When the bee was feeding on sugar water, he put red marks on it. Then, the marked
    bee flew back to the hive and danced to other bees. However, other bees came to
    the sugar water without the marked one. This meant it shared the place of food
    with others by dancing to them.

    So, how do bees always know the correct place to get their food? The study shows
    that the little dancers map out where the food is with the location of the sun,
    the hive, and their heads. If the bees fly straight up to the sun, it means the
    food is in the same direction as the sun. If the bees fly at an angle, it means
    the food is in the direction of that angle. In this way, bees can always find
    food in the right place at any time.

    📖 non-scented 沒味道的 location 地點 direction 方向 at an angle 傾斜'
