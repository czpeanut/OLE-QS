    content: With the idea of saving money
  - label: B
    content: For eating healthy food is important
  - label: C
    content: With many places closed for eating inside
  - label: D
    content: Knowing that COVID-19 will end soon
  group_stem: '【B】

    The year 2020 was difficult for many businesses due to COVID-19. However, one
    industry that grew a great deal in that year was food delivery. ___(50) , people
    turned to food delivery apps to get meals sent to their homes. Even in Taiwan,
    where restaurants stayed open during 2020, food delivery services still grew a
    lot. Many people preferred using these apps to avoid large gatherings and reduce
    their risk of getting COVID-19. Having food delivered became a convenient and
    safer choice during that time.

    Food delivery will face many challenges in the future. Costs are rising, including
    gas, food, and worker pay, making it harder for companies to keep prices low.
    ___(51) , there are too many competitors, and customers often change apps for
    discounts, making it difficult to build loyalty. ___(52) food delivery companies
    must find new ways to improve and keep customers happy.

    📖 prefer 較喜歡 competitor 競爭者 loyalty 忠誠'
