  stem: Why does the writer mention about Gloria Mark’s study?
  options:
  - label: A
    content: To invite the readers to take action.
  - label: B
    content: To draw the readers’ attention.
  - label: C
    content: To teach the readers something interesting.
  - label: D
    content: To tell the readers how to stay focused.
  group_stem: '【D】

    Chloë Hamilton

    Fri 18 Oct 2024 11.00 BST

    Share

    47 seconds－that was how long we could focus on a webpage in 2021. But in 2004,
    that number was 150, said Gloria Mark. Our attention span has become shorter.
    A short attention span may cause troubles in our lives. But don’t worry. Here
    are some tips for you to deal with the problem.

    ▶ If you can’t focus for a two-hour study time, what you need is:

    ☑ Music can help you stay focused

    Some people find they can focus better with music playing while studying. Notice
    that the choice of music is the key to how well you can focus. Soft music is better
    than rock music.

    ☑ Clean up your desk

    Things like dolls, photos of your favorite idols, and cellphones must draw your
    attention more easily than your workbooks. You don’t really need them to study.
    If your desk is full of things like those, tidy it up first.

    ▶ If the problem has lasted for over one month, it means you may have some health
    problems. All you need is to check your daily life. Bad habits like using cellphones
    for a long time or staying up late make it worse.

    ☑ Do exercise and eat healthy food

    ☑ Ask for advice from doctors'
