- id: doc_113_台中_清水_數學_g8s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '如圖，$P$ 點在直線 $L$ 外(上方)，尺規作圖作法如下：

    ① 以 $P$ 點為圓心，適當長為半徑畫弧，交直線 $L$ 於 $A$、$B$ 兩點。

    ② 分別以 $A$、$B$ 兩點為圓心，大於 $\frac{1}{2}\overline{AB}$ 長為半徑畫弧，設兩弧交直線 $L$ 下方於 $Q$ 點。

    ③ 連接 $\overline{PQ}$，設 $\overline{PQ}$ 交 $L$ 於 $O$ 點。

    ④ 連接 $\overline{AP}$、$\overline{BP}$、$\overline{AQ}$、$\overline{BQ}$，得四邊形 $PAQB$。

    試判斷下列敘述何者<u>錯誤</u>？'
  options:
  - label: A
    content: $O$ 點為 $\overline{AB}$ 的中點
  - label: B
    content: $\angle AOP=90^{\circ}$
  - label: C
    content: $\angle AQO=\angle BPO$
  - label: D
    content: $\overline{PQ}$ 為四邊形 $PAQB$ 的對稱軸
