questions:
- id: doc_113_新北_忠孝_社會_公民_g7s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 社會變遷便利了我們的日常生活，但許多設施卻未能考量身心障礙者的使用需求。例如：許多人行道上有變電箱、電線杆等設施，不僅妨礙行人通行，對身障者更是挑戰。請問：這呈現何種角度的不公平現象？
  options:
  - label: A
    content: 責任承擔
  - label: B
    content: 貢獻肯定
  - label: C
    content: 利益分配
  - label: D
    content: 需求滿足
- id: doc_113_新北_忠孝_社會_公民_g7s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 在一項針對民眾對女性科學家認知的調查中，研究者請受試者提出十位女性科學家的名字。其中，只有百分之一的人完成了任務，而有近三分之一的人只說得出居禮夫人(瑪麗亞．斯克沃多夫斯卡・居禮)的名字。請問：上述顯示女性科學家面臨何種角度的不公平現象？
  options:
  - label: A
    content: 責任承擔
  - label: B
    content: 貢獻肯定
  - label: C
    content: 利益分配
  - label: D
    content: 需求滿足
- id: doc_113_新北_忠孝_社會_公民_g7s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 政府規畫福利服務滿足民眾因為差異性而產生的需求，以促進其身心健全發展，讓生活更有尊嚴。請問：下列何項屬於上述的範圍？
  options:
  - label: A
    content: 家裡突遭遇火災的小王，申請災害救助金補助
  - label: B
    content: 已年滿六十五歲的老陳，每月領取退休給付金
  - label: C
    content: 患有肌肉萎縮症的小倫，搭乘復康巴士上下學
  - label: D
    content: 一直有居住需求的琪琪，開心的入住社會住宅
- id: doc_113_新北_忠孝_社會_公民_g7s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 過去臺灣傳統社會觀念認為工作是生活的重心，隨著經濟的發展，人們開始思考如何提升生活品質，也愈來愈重視休閒生活。請問：上述屬於哪個層次的社會變遷
  options:
  - label: A
    content: 器物
  - label: B
    content: 制度
  - label: C
    content: 理念
  - label: D
    content: 風俗習慣
- id: doc_113_新北_忠孝_社會_公民_g7s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 小穎看到一則關於「4/30 國際不打小孩日」的說明如下：「邀請你，試試看不要打小孩。至少在這一天不要打，也許你會發現將來的每一天你都不需要打」。根據該說明下列敘述何項最適當？
  options:
  - label: A
    content: 藉由改變家長價值觀來帶動社會變遷
  - label: B
    content: 主張對實施體罰者提起訴訟加以處罰
  - label: C
    content: 上街請願要求國家立法保障兒童福利
  - label: D
    content: 推廣法治教育教導兒童保護自身權益
- id: doc_113_新北_忠孝_社會_公民_g7s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 小美在閱讀某雜誌時看到一則報導：「在臺灣城鄉醫療資源分配不均，資源大多集中於都會區，而偏鄉交通往返相對困難，醫師到偏鄉現場診療意願低，導致偏鄉民眾無法獲得較完善的醫療資源。然而，隨著醫學科技快速發展，透過遠端親臨醫療系統，偏遠地區民眾也能獲得較完善的醫療資源，進而創造另一種科技診療方式。」根據上文，下列何項說明最能表達該報導主旨？
  options:
  - label: A
    content: 科技改善社會中的不公平處境
  - label: B
    content: 科技發展有助理念層次變遷
  - label: C
    content: 政府制訂政策促進公平正義
  - label: D
    content: 個人透過行動維護弱勢權益
- id: doc_113_新北_忠孝_社會_公民_g7s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 高雄市發生「城中城」大樓火災，造成46 人死亡。政府在進行災後相關事件調查時，赫然發覺有5 名罹難者生前未參加勞保、農保或國民年金保險等相關制度，導致家屬可能無法申請理賠。請問：由上述情形可以知道何項社會福利的重要性？
  options:
  - label: A
    content: 社會保險
  - label: B
    content: 社會津貼
  - label: C
    content: 福利服務
  - label: D
    content: 社會住宅
- id: doc_113_新北_忠孝_社會_公民_g7s2e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 政府對低收入戶、中低收入戶提供生活補助金，是下列哪項社會福利政策的落實？
  options:
  - label: A
    content: 社會保險
  - label: B
    content: 社會救助
  - label: C
    content: 福利服務
  - label: D
    content: 醫療保健
- id: doc_113_新北_忠孝_社會_公民_g7s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 「少子化」現象可能造成未來臺灣社會勞動力不足，與年輕人扶養負擔加重等問題，為了解決相關的問題，政府提供一定金額的現金給付鼓勵生育。請問：上述政府的做法屬於下列何項社會福利的內容？
  options:
  - label: A
    content: 社會救助
  - label: B
    content: 社會保險
  - label: C
    content: 社會住宅
  - label: D
    content: 社會津貼
- id: doc_113_新北_忠孝_社會_公民_g7s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 公民課時老師提到：「政府整合國家與民間的資源，推動滿足全體人民生活基本需求的相關措施，除了給予弱勢群體特別保障外，也強調逐步提升社會整體的福祉。」請問：老師應該是在講解哪一個概念？
  options:
  - label: A
    content: 社會變遷
  - label: B
    content: 社會福利
  - label: C
    content: 社會保險
  - label: D
    content: 社會秩序
- id: doc_113_新北_忠孝_社會_公民_g7s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 早期制定的民法部分條文受到「父權優先」的傳統觀念影響，如子女監護權的歸屬等，形成對女性的不公平待遇。有鑑於此，在婦女團體的努力下，立法院已完成相關條文的修訂工作。請問：上述現象是屬於何種層次的社會變遷？
  options:
  - label: A
    content: 器物、制度
  - label: B
    content: 器物、理念
  - label: C
    content: 制度、理念
  - label: D
    content: 理念、科技發明
- id: doc_113_新北_忠孝_社會_公民_g7s2e3_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: '臺灣少子化、高齡化的趨勢難以逆轉，國發會預估在西元2025 年臺灣就會進入超高齡社會。金門縣政府積極布建長照資源，與民間單位合作成立了社區整合型服務中心、複合型服務中心，滿足當地民眾各種長照服務需求。請問：上述服務與下列何項社會福利措施較相近

    ※註：行人專用時相指為了保護行人的安全，在交叉路口設置的行人穿越號誌系統。'
  options:
  - label: A
    content: 推動首次自購住宅貸款利息補貼
  - label: B
    content: 推動行人專用時相，保障行人用路安全
  - label: C
    content: 辦理中低收入戶學生助學金
  - label: D
    content: 開辦新住民家庭親子教養班，教導新住民家庭親子溝通與教養的方法
- id: doc_113_新北_忠孝_社會_公民_g7s2e3_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 《芒草心慈善協會》協助一群具裝修技術的無家者成立裝修團隊，提供專業的油漆粉刷、家居清潔、水電工程及搬運服務，讓無家者有機會賺取生活所需，脫離貧困無家者在完成裝修工作後，除了能建立自信，也重建其與社會的連結。請問：上文呈現出何種意義？
  options:
  - label: A
    content: 個人無法改變不公平現象
  - label: B
    content: 民間團體積極促進公平正義
  - label: C
    content: 社會中的貧富差距無法改變
  - label: D
    content: 只有政府能改善不公平現象
- id: doc_113_新北_忠孝_社會_公民_g7s2e3_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: 隨著新冠病毒變異株肆虐，資料顯示疫苗保護力在下降部分國家曾討論是否要追打第三劑疫苗的加強針。甲國認為，應該要讓所有完整接種過疫苗的民眾都追加第三劑，提升全體國人的保護力。乙國認為，應讓易感染重症的群體優先施打第三劑，維持保護力。針對兩國追打第三劑疫苗的分析，下列何項較為正確？
  options:
  - label: A
    content: 甲國政策偏向關注弱勢群體
  - label: B
    content: 乙國政策較重視每個人均等的機會
  - label: C
    content: 甲國政策能做到責任承擔的公平
  - label: D
    content: 乙國政策納入公平正義的考量
