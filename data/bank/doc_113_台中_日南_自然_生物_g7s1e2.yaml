- id: doc_113_台中_日南_自然_生物_g7s1e2_s1_42
  section: 1
  number: 42
  type: single
  page: 4
  stem: 根據本文推論，為什麼草食性哺乳動物能利用纖維素的養分？
  options:
  - label: A
    content: 草食性哺乳動物本身就具有能分解纖維素的酶
  - label: B
    content: 草食性哺乳動物在二次咀嚼時，會藉由牙齒將纖維素分解
  - label: C
    content: 草食性哺乳動物胃中的微生物含有可以分解纖維素的酶
  - label: D
    content: 草食性哺乳動物胃中的微生物會幫忙將纖維素分解成胺基酸。
  group_stem: '【題組三】

    人類消化液中沒有可分解植物纖維素的酵素，所以我們吃進體內的纖維素不能被消化吸收。

    那麼草食性哺乳動物如何從所吃的植物中獲得養分呢？牛、羊等草食動物的反芻現象有助於消化，他們先吃進大量的草到胃中，而胃內含有微生物可幫助分解纖維素，一段時間後，他們會將胃內的食物反芻到口中咀嚼，然後再重新吞入胃中。反芻現象可讓微生物所產生的酵素和食物有更長的接觸，使消化作用更完全。

    比較肉食性哺乳動物與草食性哺乳動物的消化道就可以發現，草食性的消化道通常較肉食性的長，尤其是盲腸和大腸，例如無尾熊的盲腸長度可達 2 公尺，約占整個消化道長度的五分之一。草食性哺乳動物的盲腸中共生著大量微生物，這些微生物所製造的酵素可將植物纖維素分解成草食性哺乳動物可吸收利用的物質。'
