- id: doc_113_台中_日南_自然_生物_g7s1e2_s1_49
  section: 1
  number: 49
  type: single
  page: 4
  stem: 由文中所述，楓糖漿具有相當不錯的營養價值，請依據楓糖漿的營養成份推測，在人體的消化系統中，主要吸收楓糖的部位為下列何者？
  options:
  - label: A
    content: 口腔
  - label: B
    content: 胃
  - label: C
    content: 小腸
  - label: D
    content: 大腸。
  group_stem: '【題組五】

    楓糖是從楓樹樹液中提煉而成的天然糖漿，糖量極高。除此之外，楓糖也含有許多天然營養成分，例如礦物質、寡醣、胺基酸、有機酸和酚類化合物等等。

    楓糖是加拿大最有名的特產之一，每年 3、4 月當春季來臨時，正是製作楓糖的季節。楓樹的樹幹和根部會將已儲藏的澱粉，轉化為豐富的蔗糖，形成楓樹的樹液。這時製糖人會在樹幹上鑽孔，插入小管道（俗稱「樹液釘」），引導樹液滴入收集容器中。這些樹液經過長時間熬煮，水分蒸發，樹液濃縮成糖漿。這一過程中，樹液中的糖分轉化，才會是我們熟知的楓糖漿。'
