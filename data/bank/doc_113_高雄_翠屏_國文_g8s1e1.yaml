- id: doc_113_高雄_翠屏_國文_g8s1e1_s3_4
  section: 3
  number: 4
  type: single
  page: 1
  stem: 閱讀以下選項的敘述，判讀當中成語運用正確者為何？
  options:
  - label: A
    content: 農作物大豐收，一起到「瓜田李下」採收吧
  - label: B
    content: 「南橘北枳」，國外的教育制度再好，也不可完全挪用
  - label: C
    content: 這件事實在簡單，執行起來有如「水中撈月」
  - label: D
    content: 局勢已是「背水一戰」，輕鬆應對即可。
- id: doc_113_高雄_翠屏_國文_g8s1e1_s3_5
  section: 3
  number: 5
  type: single
  page: 1
  stem: 〈跳水〉一詩中結尾描述到「讓青春去激起/一片雪白的讚嘆」，請問「雪白」的意涵指下列何者？
  options:
  - label: A
    content: 跳水選手的泳衣花紋
  - label: B
    content: 跳水選手的獎牌光芒
  - label: C
    content: 跳水選手的勝利手勢
  - label: D
    content: 跳水選手濺起的水花。
  lesson_raw:
    number: 第1課
    title: 跳水
    basis: 題目指名〈跳水〉並引用詩句
- id: doc_113_高雄_翠屏_國文_g8s1e1_s3_6
  section: 3
  number: 6
  type: single
  page: 2
  stem: 以下是八年級某班同學，針對艾青〈跳水〉一詩所做的詩意分析，請問何者分析的內容較為正確？
  options:
  - label: A
    content: 大美：詩句中的「陶醉」意味跳水選手正沉浸在觀眾的加油聲中
  - label: B
    content: 小花：「雪白的讚嘆」可看出場邊觀眾相當肯定跳水選手努力實踐理想的表現
  - label: C
    content: 大寶：作者運用「青春」與「激起」描寫場邊觀眾對跳水比賽滿懷著熱血與衝勁
  - label: D
    content: 小帥：「從容的曲線」顯示跳水選手內心對比賽感到勝券在握。
  lesson_raw:
    number: 第1課
    title: 跳水
    basis: 題目指名艾青〈跳水〉
- id: doc_113_高雄_翠屏_國文_g8s1e1_s3_7
  section: 3
  number: 7
  type: single
  page: 2
  stem: 〈風箏〉一詩中，哪句最能表現出「人定勝天」、「人小志氣高」的抱負與勇氣？
  options:
  - label: A
    content: 扶搖直上，小小的希望能懸得多高呢
  - label: B
    content: 長長一生莫非這樣一場遊戲吧
  - label: C
    content: 上去，再上去，都快看不見了
  - label: D
    content: 沿著河堤，我開始拉著天空奔跑。
  lesson_raw:
    number: 第1課
    title: 風箏
    basis: 題目指名〈風箏〉
- id: doc_113_高雄_翠屏_國文_g8s1e1_s3_8
  section: 3
  number: 8
  type: single
  page: 2
  stem: 「親手設定之後/往往，在最銷魂的當兒/準時引爆/支離破碎醒來/慌亂拼湊/每個/新的一天」(沈志方) 請問題目這首小詩的主題，最有可能是下列何者?
  options:
  - label: A
    content: 瓦斯罐
  - label: B
    content: 手機
  - label: C
    content: 鬧鐘
  - label: D
    content: 鞭炮。
- id: doc_113_高雄_翠屏_國文_g8s1e1_s3_9
  section: 3
  number: 9
  type: single
  page: 2
  stem: 下面兩首李瘦蝶所作的現代詩，各吟詠哪些昆蟲？ 甲、「直到疲倦也喊出了/ 生命的沙啞/ 在羽翼生銹的/ 夢裡，夏天/ 最遠我曾抵達/ 一個充滿謠言而又陌生的城市」
    乙、「感謝你們/ 對於我/ 小小的存在/ 還報予/ 生命最熱烈的掌聲」
  options:
  - label: A
    content: 甲詩寫蚊子，乙詩寫飛蛾
  - label: B
    content: 甲詩寫知了(蟬)，乙詩寫蚊子
  - label: C
    content: 甲詩寫蒼蠅，乙詩寫蜜蜂
  - label: D
    content: 甲詩寫紡織娘，乙詩寫蒼蠅。
- id: doc_113_高雄_翠屏_國文_g8s1e1_s3_10
  section: 3
  number: 10
  type: single
  page: 2
  stem: 古詩十九首被評為五言古詩早期的代表作。請自以下的評價內容，選出內容有誤的選項？
  options:
  - label: A
    content: 情感真摯動人外，使用的文句典故，華美而有內涵
  - label: B
    content: 反映當時動盪時代下，對於離情別愁及生命無常的哀傷
  - label: C
    content: 詩中的敘事者，多是逐臣棄婦、死生相隔的人們、流浪他鄉的遊子
  - label: D
    content: 古詩十九首最早收錄在昭明文選中。
  lesson_raw:
    number: 第3課
    title: 庭中有奇樹
    basis: 課文〈庭中有奇樹〉相關文學常識（古詩十九首）
- id: doc_113_高雄_翠屏_國文_g8s1e1_s3_11
  section: 3
  number: 11
  type: single
  page: 2
  stem: '請審視以下表格，比較「古體詩」與「近體詩」的創作時代與格式，選出欄位有錯誤者？


    | 文體 | (A)興起時代 | (B)句數、字數 | (C)平仄 | (D)押韻 | 對仗 |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 古體詩 | 起於兩漢，發展於魏、晉 | 沒有限制(但為偶數)，有五言、七言與雜言體 | 不限 | 一韻到底 | 不限 |

    | 近體詩 | 唐代 | 絕句四句、律詩八句，各有五言、七言之分 | 講究平仄，有一定規則 | 一韻到底 | 絕句不要求，律詩頷聯、頸聯要對仗 |'
  options:
  - label: A
    content: 興起時代
  - label: B
    content: 句數、字數
  - label: C
    content: 平仄
  - label: D
    content: 押韻
  lesson_raw:
    number: 語文常識一
    basis: 語文常識一 古體詩與近體詩比較
- id: doc_113_高雄_翠屏_國文_g8s1e1_s3_12
  section: 3
  number: 12
  type: single
  page: 2
  stem: 在〈庭中有奇樹〉這首古詩中，關於詩句的解釋與賞析，何者完全正確？
  options:
  - label: A
    content: 「綠葉花華滋」是觸發心中思念的那幅奇景
  - label: B
    content: 「攀條折其榮」顯示出作者想珍藏這份心中的秘密
  - label: C
    content: 「路遠莫致之」下，對於路途遙遠的阻隔，產生了怒氣
  - label: D
    content: 以「但感別經時」作結，讓讀者了解到送別時的不捨。
  lesson_raw:
    number: 第3課
    title: 庭中有奇樹
    basis: 題目指名〈庭中有奇樹〉
- id: doc_113_高雄_翠屏_國文_g8s1e1_s3_13
  section: 3
  number: 13
  type: single
  page: 2
  stem: 「樹欲靜而風不止，子欲養而親不待」用以比喻父母去世後，無法奉養的悲痛。請問下列哪一個成語的意義與之相同？
  options:
  - label: A
    content: 西河之痛
  - label: B
    content: 話冷雞窗
  - label: C
    content: 風木含悲
  - label: D
    content: 雁行失序。
- id: doc_113_高雄_翠屏_國文_g8s1e1_s3_14
  section: 3
  number: 14
  type: single
  page: 3
  stem: 近來社會上偶會發生獨居老人去世數日，才因鄰居或有人上門，方知已往生的悲劇。而姍姍來遲的子女，有些態度冷漠，令人髮指；有些則哭天搶地，但也後悔莫及，「兩者」皆應未盡奉養之責。若使用〈慈烏夜啼〉中的詩句來形容，何者最足以形容「他們」的作為？
  options:
  - label: A
    content: 應是母慈重，使爾悲不任
  - label: B
    content: 聲中如告訴，未盡反哺心
  - label: C
    content: 昔有吳起者，母歿喪不臨
  - label: D
    content: 嗟哉斯徒輩，其心不如禽。
  lesson_raw:
    number: 第3課
    title: 慈烏夜啼
    basis: 題目指名〈慈烏夜啼〉
