  type: single
  page: 6
  stem: 下列有關定伯賣鬼的描述何者正確？
  options:
  - label: A
    content: 出現的諸多對話中「宗定伯賣鬼，得錢千五百」是全文的重大轉折點
  - label: B
    content: 以人兩次質疑鬼增加懸疑性
  - label: C
    content: 「定伯自渡，漕漼作聲。」意指定伯渡水時，鬼就在一旁發出怪異聲
  - label: D
    content: 運用第三人稱的觀點敘述故事。
  group_stem: "（四）\n   南陽 宗定伯，年少時，夜行逢鬼。問曰：「誰？」鬼曰：「鬼也。」鬼曰：「卿復誰？」定伯欺之，言： 「我亦鬼也。」鬼問：「欲至何所？」答曰：「欲至宛市。」鬼言：「我亦欲至宛市。」共行數里，鬼言：\
    \ 「步行太極，可共迭相擔也。」定伯曰：「大善。」鬼便先擔定伯數里。鬼言：「卿太重，將非鬼也？」定伯言：「我新死，故重耳。」定伯因復擔鬼，鬼略無重。如是再三。定伯復言：「我新死，不知鬼悉何所畏\
    \ 忌？」鬼答曰：「唯不喜人唾。」於是共行，道遇水，定伯命鬼先渡，聽之，了無聲。定伯自渡，漕漼作聲。 鬼復言：「何以作聲？」定伯曰：「新死不習渡水耳，勿怪！」行欲至宛市，定伯便擔鬼至頭上，急持之，\
    \ 鬼大呼，聲咋咋，索下，不復聽之。徑至宛市中，著地化為一羊，便賣之。恐其變化，唾之，得錢千五百，乃去。當時有言：「宗定伯賣鬼，得錢千五百。」      \
    \                                              《列異傳》"
