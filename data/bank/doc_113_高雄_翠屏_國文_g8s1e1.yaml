- id: doc_113_高雄_翠屏_國文_g8s1e1_s3_16
  section: 3
  number: 16
  type: single
  page: 3
  stem: 「但年紀老大了，再吃到這種童年貧窮時充飢的小水果，智慧難免略有增長，因而竟然有了『牛頓在蘋果樹下，被掉落的蘋果打到頭』後的那種頓悟。」下列何者最適合用來形容這種情況？
  options:
  - label: A
    content: 如夢初醒，人生如寄
  - label: B
    content: 昨是今非，白雲蒼狗
  - label: C
    content: 閱歷增長，豁然開朗
  - label: D
    content: 幡然悔悟，痛改前非。
  lesson_raw:
    number: 第2課
    title: 土芭樂的生存之道
    basis: 引用〈土芭樂的生存之道〉課文原句
