- id: doc_113_高雄_翠屏_國文_g8s1e1_s4_34
  section: 4
  number: 34
  type: single
  page: 8
  stem: 讀完這篇文章後，請自以下選項，為本文下一個最佳標題 ( 文意涵蓋最完整 )？
  options:
  - label: A
    content: 該怎麼看待網路酸民的言論
  - label: B
    content: 阿滴來分享:如何成功經營線上英語教學頻道
  - label: C
    content: 開放式教育將是未來趨勢
  - label: D
    content: 阿滴現身說法:經營頻道的所需的能力及素養。
  group_stem: "（六）\n本名都省瑞，戴著黑框眼鏡的阿滴，於2015 年1 月11 日，以生活化、逗趣的英文教學風格，與妹妹(滴妹)創立了「阿滴英文」YouTube\
    \ 頻道。秉持每週上傳影片的堅持，5 年過去，總共生產超過440 支影片，累積瀏覽量高達2 億人次，頻道訂閱更由幾百人、幾千人，最後衝破240 萬人大關，成為台灣目前訂閱數最高的知識型YouTube\
    \ 頻道。除了經營頻道外，阿滴也和滴妹在2017 年一同推出英文學習月刊，提供有志學英文的粉絲另一種管道接觸英文。阿滴也相當不藏私，樂於透過演講、課程來與外界分享他經營頻道與個人品牌的經驗與心得。\n\
    \n阿滴解釋:對觀眾而言，每一支影片看似簡單，但背後卻需蘊藏非常多的細節。包含我的頻道名稱叫做什麼？我想做什麼內容？呈現出來的個性的感覺是什麼？以及每支影片的主題、標題、縮圖要怎麼設定？大方向要確定之後，才能夠進入到每一支影片的製作流程。平均下來，約10\
    \ 分鐘影片最少需花費6 個小時，才能完成。而且作為全職 YouTube 意味著它不再是興趣，而必須考量到種種經濟與現實難題，例如影片不對粉絲口味、觀眾漸漸流失、訂閱數未反應在影片觀看次數上等等問題。後續為了頻道為了轉型，因此加入不少以娛樂題材為主的影片，也曾遭到不少網友質疑「阿滴英文變了」，失去教英文的初衷\n\
    \  另外，這份工作的壓力很大，因為所有的數據都攤開在網路上，你的影片表現得好或不好，訂閱數高還是低，全部都是透明的，」阿滴說。紅不紅、是否具備話題、是否過氣、有多少觀眾，這些問題彷彿成為緊箍咒，每當想起就令人頭痛。又「人紅是非多」，當愈來愈多人關注他，也就代表著有更多人正拿著放大鏡一一檢視他。會遇到很多陌生人對你品頭論足，或是對影片有意見，或者是被人誤會。阿滴坦言這對他的生活帶來極大的心理壓力。\n\
    \n   面對愈來愈多的年輕學子，想將 YouTuber 視為未來志願之一。阿滴卻不鼓勵學生優先將它當作職業考量。他認為，學生的本業還是應專注學習，只有學生時期，才有大量的時間不斷「吸收」新知，當你出了社會之後，你會發現你能學習的時間是大大降低的。與學生相反，YouTuber\
    \ 是創作者，創作的本質是「釋放」，製造內容，內容則取決於你過往的知識，「當你空空如也的時候，你沒有什麼內涵、知識，沒有什麼對人生的態度，沒有什麼經歷的時候，你要創造什麼東西呢？」\n\
    \   此外，阿滴認為大多數人都忽視了「YouTuber 起點為零」這件事：「YouTube 的收益是跟流量綁在一起的，你有流量才會有廣告收益，剛開始訂閱的人數一定很少，所以你必須花很久時間，才會有基本薪資的收入。」阿滴直言，如果做\
    \ YouTuber 的目標是想賺錢的話，一定會大失所望：「你沒賺到錢，就不可能堅持不斷的做內容；沒有創造內容出來，就更難被觀眾看到。」\n   阿滴比較鼓勵學生先將其當作興趣。兩者差別在於興趣的心態是「學習」，學習知識轉譯的過程、拍片剪輯的技巧……等等，雖然你仍然有在製作內容，但你更多時候是在學習，就算你沒有賺到錢，你還是樂在其中。阿滴所認識的一線\
    \ YouTuber，幾乎都是他們很喜歡做影片，同時也很喜歡某個領域，才可以堅持創作到現在，「就算你不給我錢，我還是會每個禮拜上傳影片。」這也難怪阿滴笑說若當初能重新選擇，還是會毫不猶豫的做\
    \ YouTuber。\n  最後，阿滴強調，面對不斷變遷的時代，最好的教育應該是開放式的教育，「現在的學習就是不要設限，引發孩子的各種興趣，讓他嘗試各式各樣的東西，並從中逐漸找到自己很擅長、喜歡的事情，再不斷往下執行，」阿滴認為這便是最好的學習方式。\n\
    改寫自 黃文菁 《親子天下雜誌》2022.03.22"
