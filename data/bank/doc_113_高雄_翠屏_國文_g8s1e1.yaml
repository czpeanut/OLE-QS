- id: doc_113_高雄_翠屏_國文_g8s1e1_s4_32
  section: 4
  number: 32
  type: single
  page: 7
  stem: 根據這篇文章的描述，在英國植物學家的實驗過程中，什麼是影響菸草生長形態最主要的變因？
  options:
  - label: A
    content: 人的觸摸
  - label: B
    content: 溫室環境
  - label: C
    content: 水母基因
  - label: D
    content: 風的吹拂。
  group_stem: "（五）美國史丹佛大學的研究人員曾發表一篇論文，發現輕觸草木的枝幹會激發某些特殊基因，使含鈣的蛋白質產量增加，改變植物的生長形態。這個發現引起英國愛丁堡大學一群植物學家的興趣，他們把剛長出新芽的菸草分成兩組，都栽培在溫室中以便觀察，並控制其他變因。不同的是，一組持續不斷受到風的吹拂，另一組任它們自然生長。\n\
    \ 研究人員將水母的基因，分別注射到兩組菸草身上。假如菸草體內增加鈣的含量，則水母的基因就會使它們發出藍色的光。實驗的結果，在風中搖曳的菸草形成一片藍。\n\
    \ 那麼，鈣的作用是什麼呢？愛丁堡的研究者認為鈣雖非植物本身所需的養分，但鈣質的增加可能使植物體內的生長細胞之細胞壁加厚，因而使整株植物的結構定位，就不會萎萎縮縮地長不大了。\n\
    改寫自曾志朗《用心動腦話科學》"
