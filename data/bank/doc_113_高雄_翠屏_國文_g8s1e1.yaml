  stem: 「『冷笑話』所帶動的流行跟話題族繁不及備載」，句中「族繁不及備載」通常用於訃文中，在此為戲謔用法。這個詞語的含意與下列何者最接近？
  options:
  - label: A
    content: 車載斗量
  - label: B
    content: 鳳毛麟角
  - label: C
    content: 杯水車薪
  - label: D
    content: 屈指可數。
  group_stem: '（三）

    「冷笑話」所帶動的流行跟話題族繁不及備載，有人說它起源於「白痴造句」，像是「白痴：小白/痴痴地/等小花。」之後又演變成「白痴解釋」，例如「可愛：可憐沒人愛。」兩者都具有顛覆傳統思維的創意，演變至最近的冷笑話，更是改變了傳統笑話的面貌。冷笑話或許無法催人狂笑，但卻能放鬆心情。像是「某天0
    遇到了8，0就對8 說：『喂！你幹嘛繫皮帶？』」冷笑話拓展了產生笑話的新方式，成為年輕世代爭相模仿與流傳的文化。

    通常聽完冷笑話的人都會說：「喔！你好冷哦！」雖然嘴巴抱怨不好笑，卻又佩服說笑話的人的勇氣與創意。說冷笑話的風氣從網路上蔓延到日常生活中，連電視節目也常以冷笑話來炒熱氣氛。「阿里巴巴會芝麻開門，那誰會關門呢？答案是『卜派』，因為水手（隨手）關門。」這種腦筋急轉彎的冷笑話甚至被當作社交工具，在眾人面前秀幾個冷笑話，可讓人印象深刻。

    冷笑話還成了學術研究的對象，相關論文為這股冷旋風寫下紀錄。其實只要不戲謔他人，何妨發揮想像力，創造個冷笑話博君一笑呢？

    〈話說冷笑話風潮〉'
