  section: 3
  number: 59
  type: single
  page: 7
  stem: 依「國家與政府」的概念判斷，香港不是一個國家，最主要是欠缺哪項國家組成要素？
  options:
  - label: A
    content: 人民
  - label: B
    content: 領土
  - label: C
    content: 政府
  - label: D
    content: 主權
  group_stem: '⚫ 題組（59-60 題）


    1984 年「中英聯合聲明」簽訂後，香港人對於回歸中國充滿疑慮。當時中國領導人鄧小平強調，香港回歸後會按「基本法」體現「一國兩制」，表示香港在1997 年回歸後，50
    年政策不變，香港的地位和對香港的政策不變。

    但香港回歸未滿50 年，香港特別行政區政府修訂媒體俗稱的「逃犯條例」，只要是有涉嫌犯案疑慮的人士，都可能面對無條件被逮補、移交中國處理的風險，因此香港爆發大規模的抗議行動。然而，北京當局應該思考的是，香港街頭許多年輕的抗爭者，都是在1997
    年香港回歸後才出生的。何以這些成長於「中國香港」的年輕人，如今卻手舉英國、美國的國旗，踐踏他們本應認同的五星旗。

    （資料來源：改寫自林則宏，香港…一去不返的東方之珠，經濟日報，2019/10/05）'
