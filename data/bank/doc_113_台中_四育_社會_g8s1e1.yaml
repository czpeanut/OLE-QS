  type: single
  page: 2
  stem: 根據上面文章內容，何者不是漢武帝所採行的政策？
  options:
  - label: A
    content: 更改曆法，以正月為歲首
  - label: B
    content: 崇尚黃老清靜無為的治理方式
  - label: C
    content: 地方推薦孝子、廉吏到中央任官
  - label: D
    content: 設立太學、推廣教育。
  group_stem: '閱讀素養題：(第19-20 題)

    漢武帝的學術政策

    漢武帝劉徹繼景帝之後即位，進行多方面的改革，奠定漢帝國長期的繁榮與和平的基礎，他在學術上的重要措施有：

    1.改易曆法：漢代初年沿用秦朝的曆法，到了武帝接受朝臣的建議，改易曆法，廢除秦制而改用夏代的曆法；秦曆原以十月為歲首，武帝改為以正月為歲首。這就是沿用至今的陰曆。

    2.罷黜百家，獨尊儒術：漢初的執政者崇尚黃老清靜無為的治術。到了武帝，他頗愛好儒術，但此時武帝的祖母竇太后仍堅持遵循黃老治術，須至竇太后死後，武帝才開始大力提倡儒術。建元6
    年（西元前135 年），他採用董仲舒的建議，「罷黜百家，獨尊儒術」，儒學從此取得中國文化的正統地位。

    3.振興文教與為國舉才：在京城設立太學，置五經博士（五經：詩、書、易、禮、春秋），並設博士弟子員，又在郡縣廣設學校，推廣教育。另外，武帝又下令，各郡國每年須推薦孝子、廉吏各一人到中央，以擔任政府官職。'
