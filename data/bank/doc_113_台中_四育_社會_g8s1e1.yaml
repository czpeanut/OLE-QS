- id: doc_113_台中_四育_社會_g8s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 在唐代的文學作品中，常可見到時人的生活中所受到周邊民族的影響。例如：白居易的時世妝提到：「圓鬟無鬢堆髻樣，斜紅不暈赭面狀」，其中的「赭面」，為吐蕃習俗，意指以紅顏料塗面，反映出漢藏的交流互動下所受到的影響。請問：這樣的影響，可能是下列何者所造成？
  options:
  - label: A
    content: 怛羅斯之役中，吐蕃大敗，開始派遣留學生前往唐帝國留學
  - label: B
    content: 為聯絡周遭民族夾擊東突厥，唐帝國交好吐蕃，打通絲路
  - label: C
    content: 為籠絡吐蕃，唐帝國以文成公主和親
  - label: D
    content: 吐蕃占領唐帝國首都長安。
