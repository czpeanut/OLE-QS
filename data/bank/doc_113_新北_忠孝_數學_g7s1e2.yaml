  stem: 下列敘述何者正確?
  options:
  - label: A
    content: 1 到 100 的整數中，扣除 25 個質數後，剩下的數皆為合數。
  - label: B
    content: 2 是最小的質數，也是質數中唯一的偶數。
  - label: C
    content: 因為 5 與 13 皆是質數，所以 5×13 的乘積 65 也是質數。
  - label: D
    content: 將 n 個邊長為 1 的小正方形緊密排列拼成矩形，且不會剩下，則 n＝97 比 n＝81 可以拼出較多不同形狀的矩形。
