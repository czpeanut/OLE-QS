- id: doc_113_新北_江翠_英語_g8s2e2_s5_30
  section: 5
  number: 30
  type: single
  page: 3
  stem: Why did Emma and her friends go to the forest?
  options:
  - label: A
    content: To have a picnic by the lake.
  - label: B
    content: To clean up the forest.
  - label: C
    content: To explore nature and enjoy a hike.
  - label: D
    content: To go swimming in the stream.
  group_stem: '(30-32)

    On a sunny Saturday morning, Emma and her friends decided to hike in the nearby
    forest. The forest was close to their town, where they often explored nature.
    Emma packed something she needed: water, snacks, and a first aid kit. Her friends
    did the same, wearing comfortable clothes and shoes. They met at the forest entrance
    around 10 a.m., excited for the day ahead.


    As they hiked, they saw colorful flowers along the path and heard birds singing.
    The sound of a stream came with them. Walking in the forest made them feel peaceful
    as sunlight came through the trees and made shapes on the ground. After about
    an hour, they reached an open space and took a break on a rock, enjoying snacks
    and chatting. The beautiful view with tall trees under a wide sky pleased them.


    When the afternoon sun lowered, they decided to head back. On the way home, they
    talked about their next trip and thought about riding bikes or having a picnic
    by the lake. Spending time outdoors filled them with happiness and memories. They
    felt lucky to have such beautiful places nearby and promised to protect nature.
    Emma and her friends believed each trip made their friendship stronger and their
    lives better.


     forest 森林；explore 探險； first aid kit 急救箱；entrance 入口；stream 溪流；peaceful 平靜的；promise
    承諾'
  ai_answers:
    gemini: C
    qwen: C
  answer:
  - C
  answer_status: ai_generated
