  page: 1
  stem: 『…開齋節這天,穆斯林一般很早起床,祈禱後就可以吃一些東西,象徵齋戒月結束。這一天穆斯林還會拜訪親友,互相擁抱問候,恢復朋友和親友之間的聯繫。穆斯林在這一天都穿節日衣服,喜氣洋洋,開齋節不僅是齋月的結束,而且是感謝阿拉使他們信仰更加堅定,是和平歡樂的節日…』關於此描述,以下敘述何者正確?
  options:
  - label: A
    content: 開齋節在台灣是屬於主流文化
  - label: B
    content: 以文化等級來說,農曆新年更優於開齋節
  - label: C
    content: 在台灣,伊斯蘭教文化無法與其他文化並存
  - label: D
    content: 在台灣多處地方可以看見開齋節的相關活動舉辦,逐步塑造台灣文化的多元色彩
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
