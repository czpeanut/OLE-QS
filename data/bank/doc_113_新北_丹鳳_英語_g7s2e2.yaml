  number: 36
  type: single
  page: 3
  stem: What do the monkeys eat?
  options:
  - label: A
    content: Coffee berries.
  - label: B
    content: Coffee trees.
  - label: C
    content: Coffee fields.
  - label: D
    content: Coffee beans.
  group_stem: "(一)\n   Some monkeys like coffee berries.  This is bad for coffee farmers.\
    \  The monkeys eat red coffee berries and they are soft and sweet.  The monkeys\
    \ eat green coffee berries, too.  However, they are hard.  The monkeys leave those\
    \ berries on the ground. Coffee beans are in those berries.  It is difficult for\
    \ farmers to get the beans. The monkeys also go to other farms.  They eat vegetables\
    \ and fruit, like bananas and strawberries.  Farmers find safe ways to keep the\
    \ monkeys away.  For example, they use loud sound and use nets.  But sometimes,\
    \ the monkeys come again.  One farmer has an idea.  He puts toy monkeys in his\
    \ coffee field.  Their heads are down.  The real monkeys see those upside-down\
    \ toy monkeys and they are scared.  They don’t want to be caught, like those toy\
    \ monkeys. They don’t come again.\nberries 莓果 leave 留下 scared 害怕  be caught 被抓"
