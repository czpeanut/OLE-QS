- id: doc_113_新北_丹鳳_英語_g7s2e2_s6_39
  section: 6
  number: 39
  type: single
  page: 3
  stem: Where is the bakery now?
  options:
  - label: A
    content: Online.
  - label: B
    content: On a new train.
  - label: C
    content: Outside the train.
  - label: D
    content: In Hamasen Railway Cultural Park.
  group_stem: "(二)\n  In Kaohsiung, one person sells bread online. Her bread is very\
    \ popular and many people like it. She wants to do something different and let\
    \ more people eat her bread. Now she has a bakery on an old train. This train\
    \ is in Hamasen Railway Cultural Park. There are many cool old trains in it. \
    \ Lots of people go there to see them. Now they can eat delicious bread in the\
    \ bakery, too.  The bakery is very long.  One part is for selling bread and coffee.\
    \ One part has table and chairs.  People can sit down and eat their food there.\
    \ This train carried things before, but now it is a place for snacks and relaxing.\
    \  Everyone loves the new bakery.  It is fun and different.  Other trains are\
    \ different, too.  People can see the outside and inside of trains.  There are\
    \ a lot of fun things about them.  People can have a great day there.\n   sell\
    \ 賣  bakery 麵包店 carried 載運"
