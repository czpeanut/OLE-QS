- id: doc_113_新北_丹鳳_國文_g7s1e1_s4_30
  section: 4
  number: 30
  type: single
  page: 4
  stem: 根據甲、乙兩文，下列敘述何者不正確？
  options:
  - label: A
    content: "甲文藉捨棄廚房大桌賴在小桌，寫出幼時對母親的 \n  眷戀"
  - label: B
    content: 乙文透過相簿中的照片，寫對已逝的母親的懷念
  - label: C
    content: "甲文寫作者親自體會到母愛；乙文闡述對母親角色 \n  的陌生感"
  - label: D
    content: "乙文透露出幼時與母親較為疏遠，如同遠房親戚般 \n  陌生"
  group_stem: "【甲】這個廚房是家中之家。除流理臺，另有小方桌一張。童年時我和弟弟每天在小方桌上吃早餐和點心，夏季喝洛神花茶，冬季有花生湯或熱米漿點心。家中飯廳有一張可坐十個人的紅木大圓桌，但我們不愛，時常賴在廚房裡的小桌上，總之，賴在我媽身邊。\n\
    \                      （洪愛珠 老派少女購物路線）\n\n【乙】假若沒有相簿中那些照片，我不會相信我的童年是在母親身邊度過的。我的記憶中沒有她。後來才發現她只在夜間出現，天一亮又消失了。我甚至從不知道她的名字。直到上學後，常常要填各種表格，每次問，才慢慢記住了名字，也覺得這是個陌生人。至於「媽媽」一詞，知道是生自己的人，但感受上覺得是個人人都有的遠房親戚。「母親」一詞就更不知所指了。看了太多回憶母親的文章，以為凡是母親都是死了很多年的老保母。\n\
    \                              （王朔 看上去很美）"
