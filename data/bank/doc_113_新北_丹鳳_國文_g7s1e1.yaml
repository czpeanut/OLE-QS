  group_stem: 吳王夫差小女，名曰紫玉，年十八，才貌俱美。童子韓重，年十九，有道術，女悅之，私交信問，許之為妻。重欲學於齊、魯之間，臨去，囑其父母，使求婚。王怒，不與女。玉結氣死，葬閶門之外。三年，重歸，詰其父母。父母曰：「王大怒，玉結氣死，已葬矣。」重哭泣哀慟，具牲幣，往弔於墓前。玉魂從墓出，見重流涕。
    （干寶搜神記）
