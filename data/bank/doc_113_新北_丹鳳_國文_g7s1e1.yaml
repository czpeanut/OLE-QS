  group_stem: "充滿整個夏天的是一個緊張、急促的旋律。好像爐子上的一鍋冷水在逐漸泛泡、冒氣而終於沸騰了一樣。山坡上的芊芊細草漸漸滋成一片密密的厚髮，林帶上的淡淡綠煙也凝成一堵黛色長牆。輕飛曼舞的蜂蝶不多見了，卻換來煩人的蟬兒，潛在樹葉間一聲聲地長鳴。\n\
    \    火紅的太陽烘烤著一片金黃的大地，麥浪翻滾著，撲打著遠處的山。熱風浮動著，飄過田野，吹送著已熟透了的麥香。\n    夏天的色彩是金黃的。春之色為冷的綠，如碧波，如嫩竹；秋之色為熱的赤，如夕陽，如紅葉。夏天當春華秋實之間，自然應了這中性的黃色，正是一個承前啟後、生命交替的旺季。\n\
    \    你看，麥子剛剛割過，田間那挑著七八片綠葉的棉苗，那朝天舉著喇叭筒的高粱、玉米，那在地上匍匐前進的瓜秧，無不迸發出旺盛的活力。這時他們已不是在春風微雨中細滋慢長，而是在暑氣的蒸騰下，蓬蓬勃發，向秋的終點作著最後衝刺。\n\
    \    夏天的旋律是緊張的，人們的每一根神經都被繃緊。你看田間那些揮鐮的農民，彎著腰，流著汗，只是想著快割，快割；麥子上場了，又想著快打，快打。半夜醒來還要聽聽窗紙，可是起風了；看看窗外，天空可是遮上了雲。麥子打完了，該鬆一口氣了，又得趕快去給秋苗追肥、澆水。他們的肩上挑著夏秋兩季。\n\
    \    遺憾的是，歷代文人不知寫了多少春花秋月，卻極少有夏的影子。大概，春日溶溶，秋波澹澹，而夏呢，總是浸在苦澀的汗水裡。有閒情逸致的人，自然不喜歡這種緊張的旋律。我卻想大聲讚美這個春與秋之間的黃金的夏季。\n\
    \             （節錄自夏天是緊張的梁衡）"
