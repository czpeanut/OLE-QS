- id: doc_113_桃園_桃園_國文_g7s2e1_s2_37
  section: 2
  number: 37
  type: single
  page: 6
  stem: 根據本文，下列關於喜鵲的敘述何者錯誤？
  options:
  - label: A
    content: 有些人會以購買、飼養或放生喜鵲的方式來討個吉利
  - label: B
    content: 政府目前對於喜鵲仍沒有制定任何相關的移除計畫
  - label: C
    content: 屬雜食性鳥類，適應力強，而且擅長與人類共存
  - label: D
    content: 原為臺灣物種，外型討喜，被刻意繁殖為觀賞鳥。
  group_stem: '在中國傳統文化裡，喜鵲常被視為吉祥的象徵，宅邸出現喜鵲，代表有好事發生，因此被認為是報喜鳥。加上牠的外型亮眼，叫聲嘹亮，還獲苗栗縣民票選為苗栗縣鳥。其實喜鵲在臺灣是外來入侵種。喜鵲原來分布於中國、韓國、緬甸及越南等地。但是牠的原始分布地並不包含臺灣本島，頂多只到金門、馬祖。根據史料記載，喜鵲是在十八世紀後期清朝乾隆時期，被引入臺灣作為觀賞鳥類。受到傳統文化影響，許多人藉購買、飼養或放生喜鵲來討個吉利。從一八六O
    年代起，喜鵲開始從人為管理空間擴散到臺灣本島的野外環境。起初，喜鵲被引入臺南，接著牠的分布逐步由南往北，由西往東擴散。過去，臺灣北部沒有喜鵲的紀錄，而現今臺灣各地已隨處可見。

    喜鵲是鴉科喜鵲屬的物種，牠們是雜食性的鳥類，會取食果實、種子、昆蟲、小型鳥類、鳥蛋、爬蟲類等，適應能力較強，而且擅長與人類共存，因此在許多高度開發地區常能夠見到喜鵲。牠們喜歡在農田覓食，因為夏季田間有豐富的昆蟲及蛙類、蜥蜴等，農作物如玉米、小麥，也是喜鵲喜愛的食物。

    喜鵲生性喜歡成群結隊，常會結伴飛行。在繁殖期間則會成對活動。喜鵲會取食各種植物的種子，也會捕食各種農業害蟲，因此許多人將其視為益鳥。然而喜鵲也會捕食原生的小型鳥類，甚至盜食鳥蛋，對本土生態也造成不小的衝擊。

    現在，政府對於喜鵲並沒有制定任何相關的移除計畫，已經相當氾濫的喜鵲族群，仍持續影響臺灣的生態。

    ──節選自國語日報·來者客不客專欄'
