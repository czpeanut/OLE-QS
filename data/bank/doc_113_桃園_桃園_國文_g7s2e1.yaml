- id: doc_113_桃園_桃園_國文_g7s2e1_s2_39
  section: 2
  number: 39
  type: single
  page: 6
  stem: 文中作者提到：「二十六歲的我，突然熱淚盈眶，眼淚就簌簌滴進咖啡裡。」下列何者最能說明這種情感？
  options:
  - label: A
    content: 孺慕之思
  - label: B
    content: 思鄉之情
  - label: C
    content: 舐犢情深
  - label: D
    content: 離別之愁。
  group_stem: '我是個窮學生，一杯咖啡都有點負擔不起，但是大雪初落的紐約街道實在太冷了。看見這家咖啡館，迫不及待就踏進來，暖氣像貓一樣熱融融地撲進懷裡，咖啡香氣繚繞在人們愉快的喧譁上。我選窗邊的位子坐了下來。雙手捧著熱熱的咖啡，看著窗邊不斷流過去的行人。

    突然有一對母女，手挽手停了下來，就在我的玻璃窗前，往咖啡館裡頭探看。媽媽的銀白頭髮挽成一個髮髻，女兒大概二十多歲，留著披肩長髮，黑呢大衣很厚，更顯得她們的緊緊依偎。女兒別過臉去，似乎在問媽媽：這家怎麼樣？滿臉皺紋的媽媽笑得開懷，伸出手把女兒頭髮上幾絲雪片撥開。

    二十六歲的我，突然熱淚盈眶，眼淚就簌簌滴進咖啡裡。

    在我們的文化裡，向來談的都是我們要給孩子相處的「品質時間」，陪伴孩子長大，什麼人談過我們要給父母「品質時間」，陪伴他們老去？

    我在紐約咖啡館裡坐著的時候，美君你正在高雄路竹的鄉下養豬。女兒出國深造，兩個弟弟大學還沒畢業，你們仍然在勞動，為了下一代的教育。

    離開紐約咖啡館，路上積雪已經到了腳踝，溼淋淋的雪如同冰沙稀泥，沾了整個皮靴。我跋涉的是雪泥，你在路竹的冬天，涉入冰涼的溪水採割牧草，一綑一綑地，準備背回去餵豬。

    那是我第一次發現，兩代之間的「品質時間」，並不僅止於給予下一代的孩子，還在於回首上一代的父母，這將是一輩子要堅守的幸福儀式。

    ──節錄自龍應台 天長地久：給美君的信'
