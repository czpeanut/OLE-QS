- id: doc_113_新北_板橋_國文_g8s1e2_s4_5
  section: 4
  number: 5
  type: single
  page: 2
  stem: 運用聯想力將某種感官的感覺轉移互通到另一種感官上的方式，即是摹寫的「通感」。例如：「太陽又出來了，一片清新的空氣、鮮潔的色彩，彷彿聽見了貝多芬田園交響曲第四樂章牧羊人之歌」，即是用「彷彿聽見了貝多芬田園交響曲第四樂章牧羊人之歌」的聽覺印象來表達雨過天青「太陽又出來了，一片清新的空氣、鮮潔的色彩」的視覺感受。下列選項所運用的感官摹寫修辭，何者說明正確？
  options:
  - label: A
    content: 這個球投得很甜，可惜打擊者沒有揮棒——以視覺印象表達味覺感受
  - label: B
    content: 馬蹄聲，孤獨又憂鬱地自遠至近，灑落在沈默的街上如白色的小花朵——以聽覺印象表達視覺感受
  - label: C
    content: 有遠有近的炊煙，在靜定的朝氣中漸漸地上升，彷彿早晨人們的祈禱，緩緩地傳到天上——以聽覺印象表達觸覺感受
  - label: D
    content: 山色山形逐漸變得柔嫩柔和，很有一伸手就可以觸摸到凝脂似的感覺——以觸覺印象表達視覺感受。
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
      code: 第一課
