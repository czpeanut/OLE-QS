- id: doc_113_新北_板橋_國文_g8s1e2_s5_30
  section: 5
  number: 30
  type: single
  page: 5
  stem: 別人把梵谷看成怪人的原因是什麼？
  options:
  - label: A
    content: 狂妄自大，以藝術家自居
  - label: B
    content: 個性孤僻，不善與人溝通
  - label: C
    content: 疑心病重，喜歡猜忌他人
  - label: D
    content: 態度輕佻，穿著標新立異。
  group_stem: '人們總把我看成是一個不可理喻的怪人，我要申明的是，我不是個怪人。

    的確，我常常衣冠不整，外表寒酸，不能保持莊重的樣子。因為我長期沒有收入，衣服是拿弟弟提奧的舊衣修改的，加上作畫時常濺染到顏料，讓我無法成為一個受歡迎的人。

    有人認為我的性格壞透了，常無端地猜疑我，懷疑我做了什麼見不得人的事，讓我不知該如何是好。我要說的是，我不追求名利，也不會為世俗改變我的性格。我熱愛生活，相信只要牢牢抓住生活，我的作品就會得到人們的認同。

    我承認，我是個有明顯缺點且脾氣古怪的人，急躁的性格常使我做出一些愚蠢的事，讓我事後感到後悔。我從來沒想過去搶別人的朋友和工作，更不會謀害他人性命。雖然我有時也與人爭吵，但我並不想傷害任何人。

    我常常處在可怕的憂鬱和不安中，每當渴望同情又得不到時，我就會態度冷漠，對人無故地發火，說出刺耳的話。我喜歡獨處，不善交友，要我經常和人們聚會交流是件痛苦的事。我也不知道為什麼會這樣，在肉體和精神上，我都是極端敏感的人，這是造成我脾氣古怪的原因，它讓我意志消沉，也損害到我的健康。

    我說「我是一個藝術家」，有人因此攻擊我，但我堅信我說的話。在我的理解中，藝術家就是要努力地奮鬥，不斷地探索，無條件地獻身於藝術事業。做一個藝術家，要能永無止境地探索，即使不斷遭遇挫折，也不灰心；即使身心疲憊，處於崩潰邊緣，也要正視人生。因為偉大的事業不是一蹴可就，也不是憑一時衝動就會成功。它是不斷奮鬥的結果，我相信我會有出頭的一天。

    （選自梵谷書信選）'
  uncertain_spans:
  - 內容與原卷文字層不符（吻合 76%）
