  - label: D
    content: 江山代有才人出，各領風騷數百年。
  group_stem: '在英國有名的西敏寺旁，矗立著一塊墓碑，上面刻著一段很有名的話：「當我二十歲的時候，我的理想是改變這個世界；當我三十歲以後，我發現我不能改變這個世界，我將理想變小一點，決定只改變我的國家；當我到了六十歲以後，我發現我不能改變我們的國家，我最後的願望僅僅是改變我的家庭生活，但是，這也不可能。當我現在躺在床上，風燭殘年時，我突然意識到：如果在二十歲的時候，我僅僅改變我自己，然後，我可能改變我的家庭；在家人的幫助和鼓勵下，我可能為國家做一些事；然後，誰知道呢？我甚至可能改變這個世界。」

    人人都有夢想，但並不是人人都能實現自己的夢想。只要不傷害國家、社會和其他人的利益，有什麼夢想都不是錯。但是如果沒有適合自己實現的夢想，沒有實現夢想正確的行動和步驟，輕者耽誤青春，重者將讓自己得不償失。

    （節錄自張禮文 逆向分割夢想）'
