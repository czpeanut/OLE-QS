  section: 1
  number: 23
  type: single
  page: 1
  stem: 右圖是某位航海家遠航的路線圖，此航海家到達星星標誌(印度)所在，買回大量物品，為其代表國家賺進大量財富。請問：有關此航海家的相關敘述何者正確？
  options:
  - label: A
    content: 其遠航發現好望角
  - label: B
    content: 其遠航時間為十七世紀
  - label: C
    content: 其代表西班牙遠航
  - label: D
    content: 買回歐洲的物品主要是香料
