  section: 1
  number: 24
  type: single
  page: 1
  stem: 東印度公司是大航海時代，歐洲國家對於處理遠東貿易主要負責的商業組織，具有壟斷該國在亞洲貿易的特質。請問：下列有關英屬東印度公司及荷蘭聯合東印度公司的敘述何者正確？
  options:
  - label: A
    content: 兩者皆與鄭氏政權有貿易往來
  - label: B
    content: 英屬東印度以巴達維亞為亞洲貿易中心
  - label: C
    content: 荷屬東印度公司以VOC為標誌
  - label: D
    content: 荷屬東印度公司曾殖民印度。
