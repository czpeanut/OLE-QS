  section: 1
  number: 18
  type: single
  page: 1
  stem: 基督教的發展影響歐洲歷史甚大，從創立至今的兩次分裂，更讓東、西歐至今仍有不同的教義與規範。請問：下列有關基督教發展的敘述何者正確？
  options:
  - label: A
    content: 君士坦丁宣布基督教成為國教
  - label: B
    content: 第一次基督教分裂起因贖罪劵
  - label: C
    content: 第二次基督教分裂是東正教本身腐敗
  - label: D
    content: 利瑪竇是天主教耶穌會海外傳教士。
