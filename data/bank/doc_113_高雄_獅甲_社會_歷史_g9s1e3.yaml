  type: single
  page: 2
  stem: 文學家夏目漱石在旅英期間的日記中寫道：「十九世紀倫敦的街上散步時吐了口痰，當我看到自己吐出一團全黑的物體時真是吃驚。幾百萬市民每天都吸著煤煙和塵埃，汙染著他們的肺。」當時人們以煤作為驅動蒸汽機以及家中暖爐、廚具的燃料，加上西歐地區盛行風的吹拂，使空氣汙染物不斷飄向城市的下風處。請問：上述場景最有可能是因為以下哪一選項所導致？
  options:
  - label: A
    content: 工業革命
  - label: B
    content: 交通革命
