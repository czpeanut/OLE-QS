  section: 1
  number: 20
  type: single
  page: 1
  stem: 羅馬曾三次征服世界，第一次是以武力，第二次是以宗教，第三次是以法律。而第三次征服也許是其中最為和平、最為持久的征服。請問：有關羅馬的敘述何者正確？
  options:
  - label: A
    content: 屋大維開啟共和時期
  - label: B
    content: 凱撒為共和時期的君主
  - label: C
    content: 十二表法於共和時期制定
  - label: D
    content: 君士坦丁時帝正式分裂為東、西羅馬。
