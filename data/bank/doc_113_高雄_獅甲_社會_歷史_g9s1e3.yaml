- id: doc_113_高雄_獅甲_社會_歷史_g9s1e3_s1_31
  section: 1
  number: 31
  type: single
  page: 2
  stem: 以下是某歷史人物在其著作中的相關內容：「社會形成以前，所有人都是平等的。然而人們為了解決集體生活所產生的問題，透過公眾的協商形成公意，且將全部的權力，託付由公意組成的政府，同意該政府的存在，因為能夠代表公意的政府，是不受私念限制、必然公正的。政府依循公意制定法律、建立秩序，人們只要守法、服從公意，就能得到真正的自由。」請問：上述內容最有可能與下列何者有關？
  options:
  - label: A
    content: 伏爾泰-言論自由
  - label: B
    content: 盧梭-社會契約論
  - label: C
    content: 馬克思共產思想
  - label: D
    content: 亞當斯密-國富論。
