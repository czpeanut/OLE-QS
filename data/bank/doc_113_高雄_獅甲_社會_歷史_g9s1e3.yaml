  number: 28
  type: single
  page: 2
  stem: 小瑋生活在十九世紀的英國，祖父告訴小瑋，現在的生活跟一起比差異很大，人類世界變化太快，快到讓人很難適應。請問：下列何者可能是小瑋生活會出現的場景？
