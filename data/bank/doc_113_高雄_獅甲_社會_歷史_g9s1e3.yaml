  section: 1
  number: 19
  type: single
  page: 1
  stem: 一篇文章中提及：「自此宗教出現起到今天的兩千五百多年來，其教義一直在不斷的發展和變革中，更透過向外傳播成為今日的普世宗教之一，其向北傳入中亞、中國蒙古、朝鮮、日本等地；向南傳到錫蘭、緬甸、暹羅、中南半島等地……」此篇文章的主題與何者有關？
  options:
  - label: A
    content: 佛教
  - label: B
    content: 祆教
  - label: C
    content: 猶太教
  - label: D
    content: 伊斯蘭教。
