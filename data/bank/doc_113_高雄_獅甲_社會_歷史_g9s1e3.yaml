- id: doc_113_高雄_獅甲_社會_歷史_g9s1e3_s1_26
  section: 1
  number: 26
  type: single
  page: 1
  stem: 從文藝復興以來，歷經宗教改革，科學革命到啟蒙運動，天主教教會的地位不再如此屹立不搖，人們對於教會有了更多的質疑，許多新知識逐漸被探索出來，改變過往普遍的認知。請問：下列對於近代歐洲的改變趨勢其論述何者正確？
  options:
  - label: A
    content: 從地球是圓的走向地球是方正有限
  - label: B
    content: 從理性思考走向教會至上
  - label: C
    content: 從以人為主走向以神為主
  - label: D
    content: 從地心說走向日心說。
