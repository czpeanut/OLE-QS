  type: single
  page: 2
  stem: 十九世紀出現許多為工業革命帶來社會問題解決的學說主張，我們統稱為社會主義學說。請問：與日後共產主義相似，強調打倒資本階級，由國家分配生產工具，是何人提出的主張？
