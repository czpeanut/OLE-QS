  group_stem: '(五)

    元代出現了許多傑出的劇作家，也創作了許多膾炙人口的劇目，元曲四大家之首，關漢卿，博學能文，風流倜儻，善察人情，身擅眾藝，既是導演，又是演員，還能劇本創作，其雜劇題材和形式廣泛。在〈不伏老〉中自述：「我是箇蒸不爛、煮不熟、搥不扁、炒不爆、響璫璫一粒銅豌豆」也因此被譽「曲家聖人」。

    他的雜劇作品有六十多種，大多反映現實，揭示社會弊端，筆下人物性格擁有悲劇英雄式的不撓意志。《竇娥冤》這部代表作，真切實在反映了人民對政府腐敗與社會正義的不滿與無力感，引發生活窮困求助無門又無法脫離淒苦生活的百姓，昂首盼天有朝一日能翻身的共鳴，成為戲劇史上的經典之作。

    《竇娥冤》女主角竇端雲自幼死了母親，其父竇天章進京趕考，缺少盤纏，將年僅七歲的端雲賣給蔡家做童養媳，改名竇娥，十年後竇娥長大正式嫁過門，但婚後不到兩年，丈夫去世，竇娥與蔡婆相依為命。蔡婆向欠十兩銀子的賽盧醫討債，卻差點被勒死，被張驢兒父子所救。不料張驢兒父子是地痞無賴，趁機搬進蔡家，威迫婆媳與他們父子成親，蔡婆為保命勉強答應，但竇娥堅決不從。某日，蔡婆生病，想吃羊肚湯，張驢兒便以告發賽盧醫企圖勒死蔡婆一事威脅，向賽盧醫討來毒藥，放入竇娥做的羊肚湯，準備毒死蔡婆好霸佔竇娥。豈知蔡婆突然人不適，不想喝，張父覺著可惜便奪碗喝下，不久毒發身亡。張驢兒誣告竇娥殺人，並賄賂太守，太守嚴刑逼供，竇娥寧死不招，於是改打蔡婆，竇娥心疼婆婆，含冤屈招。

    竇娥被判死，押赴刑場，竇娥指天地大聲斥責：「地也，你不分好歹何為地？天也，你錯勘賢愚枉做天！」為表明自己冤屈，當劊子手揚起明晃大刀將斬首之際，竇娥向天發出三願：其一，死後將血濺白練而不沾地；其二，六月降雪三尺掩其屍；其三，楚州大旱三年，結果血濺白練和六月降雪當場應驗。三年後，擔任廉訪使的竇天章奉旨到楚州探察民隱，發現此處竟三年無雨，心想定有奇冤。當夜，竇娥的冤魂現身細說冤情，求父親主持公道。竇天章細審此案，為冤死的竇娥平反，將賽盧醫發配充軍，太守革職、永不敍用，張驢兒被凌遲處死，宣判畢，大雨自天而降。

    從《竇娥冤》可見關漢卿善於以洗練的筆觸交代戲劇情境與人物關係，把觀眾的目光聚焦到戲劇矛盾上，從而迅速引起看戲的興趣，注重戲劇的節奏，設置懸念引人入勝，且塑造人物形象栩栩如生。王國維評《竇娥冤》：「劇中雖有惡人交構其間，而其赴湯蹈火者，仍出於其主人翁之意志，即列之於世界大悲劇中，亦無愧色也。」賦予關漢卿世界級戲劇大師的崇高地位。'
