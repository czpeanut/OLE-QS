  stem: 關於這篇極短篇小說的文意理解，下列何者敘述完全正確？
  options:
  - label: A
    content: 母親的來信是故事的轉折，若沒有母親的來信就不會發生意外，生命無常讓男主角茫然不知所措
  - label: B
    content: 蝴蝶美麗而脆弱的意象形容櫻子，「飛起」表示遭遇車禍事故，「輕輕」對比主角「沉重」的悲痛
  - label: C
    content: ｢沒有人知道那躺在街面的，就是我的，蝴蝶。」暗示戀情尚未曝光，這段地下戀情終不為人知
  - label: D
    content: 櫻子知道男主角即將向她求婚，因而心情雀躍，開心地幫忙寄信，與最後的悲劇形成強烈的對比
  group_stem: '(二)

    那時候剛好下著雨，柏油路面濕冷冷的，還閃爍著青、黃、紅顏色的燈火，我們就在騎樓下躲雨，看綠色的郵筒孤獨地站在街的對面。我白色風衣的大口袋裏有一封要寄給在南部的母親的信。

    櫻子說她可以撐傘過去幫我寄信。我默默點頭，把信交給她。「誰教我們只帶來一把小傘哪！」她微笑著說，一面撐起傘，準備過馬路去幫我寄信。從她傘骨滲下來的小雨點濺在我眼鏡玻璃上。

    隨著一聲拔尖的剎車聲，櫻子的一生輕輕地飛了起來，緩緩地，飄落在濕冷的街面，好像一只夜晚的蝴蝶。

    雖然是春天，好像已是深秋了。

    她只是過馬路去幫我寄信。這樣簡單的動作，卻要教我終身難忘了。我緩緩睜開眼，茫然站在騎樓下，眼裡藏著滾燙的淚水。世上所有的車子都停了下來，人潮湧向馬路中央。沒有人知道那躺在街面的，就是我的，蝴蝶。這時她只離我五公尺，竟是那麼遙遠。更大的雨點濺在我的眼睛上，濺到我的生命裡來。

    為什麼呢？只帶一把雨傘？

    然而我又看到了櫻子穿著白色的風衣，撐著傘，靜靜地過馬路了。她是要幫我寄信的，那是一封寫給在南部母親的信，我茫然站在騎樓下，我又看到永遠的櫻子走到街心，回頭望我。其實雨下得並不很大，卻是我們一生一世中最大的一場雨。而那封信是這樣寫的，年輕的櫻子知不知道呢？

    媽﹕我打算在下個月初和櫻子結婚。                                (渡也 〈永遠的蝴蝶〉)'
