    content: 臣請以彫玉為棺，文梓為槨，楩楓豫章為題湊→凸顯優孟機智，知楚莊王吝嗇，不會厚葬馬
  - label: D
    content: 於是王乃使以馬屬太官，無令天下久聞也→描寫楚莊王怯懦無擔當，惱羞成怒後想掩蓋過錯
  group_stem: "(三)\n    楚莊王之時，有所愛馬，衣以文繡，置之華屋之下，席以露床，啖以棗脯。馬病肥死，使群臣喪之，欲以棺槨大夫禮葬之。左右爭之，以為不可。王下令曰：「有敢以馬諫者，罪至死。」優孟聞之，入殿門，仰天大哭。王驚而問其故。優孟曰：「馬者王之所愛也，以楚國堂堂之大，何求不得，而以大夫禮葬之，薄，請以人君禮葬之。」王曰：「何如？」對曰：「臣請以彫玉為棺，文梓為槨①，楩楓豫章為題湊②，發甲卒為穿壙③，老弱負土，齊、趙陪位於前，韓、魏翼衛④其後，廟食太牢，奉以萬戶之邑。諸侯聞之，皆知大王賤人而貴馬也。」王曰：「寡人之過，一至此乎！為之奈何？」優孟曰：「請為大王六畜葬之。以壟灶為槨，銅歷⑤為棺，齎⑥以薑棗，薦以木蘭，祭以粳稻，衣以火光，葬之於人腹腸。」於是王乃使以馬屬太官，無令天下久聞也。\n\
    註：①棺材外面套的大棺材。 ②下葬時用名貴木材來護棺。 ③挖掘墓穴。 ④護衛 ⑤大銅鍋。 ⑥調配\n(節錄自 司馬遷《史記·滑稽列傳》)"
