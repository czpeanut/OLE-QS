- id: doc_113_高雄_五福_國文_g9s1e3_s5_8
  section: 5
  number: 8
  type: single
  page: 6
  stem: 下列描寫成吉思汗言行舉止的文句中，何者最能凸顯他的自負？
  options:
  - label: A
    content: 難道我一生就沒做過什麼好事？
  - label: B
    content: 數十年來，今日第一次射鵰不中，想來確是死期到了
  - label: C
    content: 我左右之人，沒一個如你這般大膽，敢跟我說幾句真心話
  - label: D
    content: 我一生縱橫天下，依你說竟算不得英雄？嘿，真是孩子話
  group_stem: "(四)\n    黃昏時分，成吉思汗命郭靖單獨陪同，在草原上閒逛。猛聽得頭頂鵰唳數聲，抬起頭來，只見那對白鵰在半空中盤旋翱翔。成吉思汗取下畫弓，扣上長箭，對著雌鵰射去。郭靖素知他膂力過人，箭無虛發，豈知那雌鵰側過身子，左翼橫掃，竟將長箭拍落。成吉思汗神色黯然，將弓箭拋在地下，說道：「數十年來，今日第一次射鵰不中，想來確是死期到了。」郭靖待要勸慰，卻不知說什麼好。\n\
    成吉思汗忽道：「靖兒，我所建大國，歷代莫可與比。你說古今英雄，有誰及得上我？」郭靖沉吟片刻，說道：「大汗武功之盛，古來無人能及。只是大汗一人威風赫赫，天下卻不知積了多少白骨，流了多少孤兒寡婦之淚。」成吉思汗雙眉豎起，舉起馬鞭就要往郭靖頭頂劈將下去，但見他凜然不懼地望著自己，馬鞭揚在半空卻不落下，喝道：「你說什麼？」郭靖心想：「縱然惹他惱怒，心中言語終須說個明白。」昂然說道：「大汗，人死之後葬在地下，占得多少土地？」成吉思汗一怔，馬鞭打個圈兒，道：「那也不過這般大小。」郭靖道：「是啊，那你殺這麼多人，流這麼多血，占了這麼多國土，到頭來又有何用？」成吉思汗默然不語。郭靖又道：「自來英雄而為當世欽仰、後人追慕，必是為民造福、愛護百姓之人。以我之見，殺得人多卻未必算是英雄。」成吉思汗道：「難道我一生就沒做過什麼好事？」郭靖道：「好事自然是有，只是你南征西伐，積屍如山，那功罪是非，可就難說得很了。」他生性憨直，心中想到什麼就說什麼。成吉思汗一生自負，此際給他這麼一頓說，竟難以辯駁，哇的一聲，一大口鮮血噴在地下。\n\
    郭靖嚇了一跳，才知自己把話說重了，忙伸手扶住，說道：「大汗，你回去歇歇。我言語多有冒犯，請你恕罪。」成吉思汗淡淡一笑，一張臉全成蠟黃，嘆道：「我左右之人，沒一個如你這般大膽，敢跟我說幾句真心話。」隨即眉毛一揚，臉現傲色，朗聲道：「我一生縱橫天下，滅國無數，依你說竟算不得英雄？嘿，真是孩子話！」在馬臀上猛抽一鞭，急馳而回。當晚成吉思汗崩於金帳之中，臨死之際，口裡喃喃念著：「英雄，英雄……」想是心中一直琢磨著郭靖的那番言語。\
    \ (節自金庸《射鵰英雄傳》華山論劍)"
