  stem: '下列為關漢卿《竇娥冤》的雜劇內容，根據上面文章所述的故事情節發展，依照順序排列以下雜劇內容，何者排序正確?

    (甲)我今日官居臺省，職掌刑名，來此兩淮審囚刷卷，體察濫官污吏，你是我親生之女，老夫將你治不的，怎治他人？我當初將你嫁與他家呵，要你三從四德，今三從四德全無，犯了十惡大罪。我竇家三輩無犯法之男，五世無再婚之女，到今日被你辱沒祖宗世德，又連累我的清名。你快與其我細吐真情，不要虛言支對，若說的有半厘差錯，牒發你城隍祠內，著你永世不得人身，罰在陰山，永為餓鬼。

    (乙)你說的豈不是？但是我的性命全虧他這爺兒兩個救的，我也曾說道：待我到家，多將些錢物酬謝你救命之恩。不知他怎生知道我家裡有個媳婦兒，道我婆媳婦又沒老公，他爺兒兩個又沒老婆，正是天緣天對。若不隨順他，依舊要勒死我。那時節我就慌張了，莫說自己許了他，連你也許了他。

    (丙)兀那婆子靠後，時辰到了也。（正旦跪科）（劊子開枷科），正旦云：「竇娥告監斬大人，有一事肯依竇娥，便死而無怨」。監斬官云：「你有甚麼事？你說。」正旦云：「要一領淨席，等我竇娥站立，又要丈二白練，掛在旗鎗上，若是我竇娥委實冤枉，刀過處頭落，一腔熱血休半點兒沾在地下，都飛在白練上者。」監斬官云：「這個就依你，打甚麼不緊？」

    (丁)妾身竇娥是也。有俺婆婆不快，想羊肚湯吃，我親自安排了與婆婆吃去。婆婆也，我這寡婦人家，凡事要避些嫌疑，怎好收留那張驢兒父子兩個？非親非眷的，一家兒同住，豈不惹外人談議？婆婆也，你莫要背地里許了他親事，連我也累做不清不潔的。我想這婦人心好難保也呵。'
