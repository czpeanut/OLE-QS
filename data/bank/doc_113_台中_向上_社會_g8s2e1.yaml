  stem: 有著悠久歷史的棕櫚油，是一種來自油棕植物的果實，它原產於西非，果肉與核仁都可榨取、提煉出豐富的油脂，雖然原生種在非洲，但其實全球棕櫚油出產國，集中在印尼和馬來西亞，這兩國每年可生產6,600
