  group_stem: '◎新北市金山區的磺火捕魚是百年傳統漁法，每年6月到9月期間為青鱗魚的盛產期，由於青鱗魚有趨光性，故點燃以磺石加水產生的可燃氣體乙炔，利用火光吸引成千上萬的青鱗魚飛躍海面，再利用三叉網捕撈，乙炔被點燃的瞬間會發出「蹦」的巨響，因此將這種捕魚方法又稱為「蹦火仔」。目前此種捕魚人才凋零，全台唯一蹦火船的年輕火長與在地漁民，於2022年成立「新北市蹦火漁業發展運銷合作社」，規畫多樣海、陸體驗行程，積極推動蹦火漁業轉型。交通部觀光署北海岸及觀音山國家風景區管理處也與多家旅行社合作，推出蹦火行程，民眾可以來趟金山，搭乘船隻觀賞蹦火船捕魚過程、捕捉海上電光火石的絢爛場面。還能結合鄰近的「魚路古道」健行，體驗昔日金山漁民挑擔運送漁貨，到士林、大稻埕等地販售的艱辛路程。

