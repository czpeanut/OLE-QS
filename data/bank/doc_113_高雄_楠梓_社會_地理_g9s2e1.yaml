  section: 1
  number: 46
  type: single
  page: 1
  stem: 臺北巿總統府前的道路原名東門街，國民政府時期更名為介壽路，1996 年時任臺北市市長陳水扁又改其名為凱達格蘭大道，旁邊的廣場改名為凱達格蘭廣場。此道路見證中華民國政府遷臺至今歷次國家儀式及慶典，也成為民眾常集會遊行抗議的聖地，代表了臺灣的言論自由。凱達格蘭大道改名的意義與下列何者相似？
