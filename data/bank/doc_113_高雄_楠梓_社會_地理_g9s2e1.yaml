  section: 1
  number: 48
  type: single
  page: 1
  stem: 嘉義東石是臺灣傳統的漁村，放眼望去魚塭相接、蚵架林立，到處可見堆積如山的蚵殼。本地的祖先於清朝自中國大陸渡海來臺，為表不忘故土便沿用故鄉「東石」之名。嘉義東石五步一宮、十步一廟，供奉神明均是先民從故鄉“分靈”而來。嘉義東石民眾和故鄉的宗教或家族祭拜等互動往來，應前往中國何處？
