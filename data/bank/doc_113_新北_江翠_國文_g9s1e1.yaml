- id: doc_113_新北_江翠_國文_g9s1e1_s1_23
  section: 1
  number: 23
  type: single
  page: 3
  stem: '辛棄疾一生作詞數量為唐 宋詞家之最，《全宋詞》中收錄629 篇，其詞風廣泛，人稱「詞中之龍」。他是年少抗金的奮勇俠客，有「 甲 」的豪情壯志。然而仕途坎坷，不禁悲嘆「
    乙 」的壯志難酬。閑居期間，寫過一些清新而極富農村氣息的小詞，「 丙 」令人耳目一新。又有「 丁 」的繁華璀璨。試問上述空格應依序填入下列何詞？

    ➀ 連雲松竹，萬事從今足。拄杖東家分社肉，白酒床頭初熟。西風梨棗山園，兒童偷把長竿。莫遣旁人驚去，老夫靜處閑看。

    ➁ 可堪回首，佛狸祠下，一片神鴉社鼓。憑誰問：廉頗老矣，尚能飯否？

