  group_stem: '卡爾斯巴德洞窟國家公園

    1天·

    我們位於美國新墨西哥州東南部，以石灰岩地形聞名，並擁有北美最大的石灰岩洞穴。整個國家公園包含超過 117 個洞穴，有壯觀的鐘乳石景緻。

    日前有旅客到訪，留下一包餅乾。從人的視角來看，掉落的零食袋可能毫不起眼，但對洞窟的生命來說，這可是足以改變世界。

    經過洞穴濕度軟化的一片玉米餅乾，形成了適合微生物和真菌生長的完美環境。蟋蟀、蟎蟲、蜘蛛和蒼蠅很快組成了一個臨時的食物網，將營養分散到周圍的洞窟和地層中。接著霉菌向上蔓延，在更高的石壁上繁衍、凋亡並發出臭味，這個循環持續進行。

    洞穴生存條件極為嚴苛，沒有光、水資源有限、營養供應也極其稀少，原本在此處生活的生物已適應這種環境。這種狀況下，任何形式外來食物加入，都可能打破生態系統平衡。

    為了阻止洞窟生態被破壞，工作人員花了 20 分鐘，小心翼翼地從洞窟表面清除霉菌和外來碎屑，避免這個「臨時生態系」所造成的影響。'
