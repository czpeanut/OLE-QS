- id: doc_113_新北_江翠_國文_g9s1e1_s1_39
  section: 1
  number: 39
  type: single
  page: 6
  stem: 請閱讀上述文章，試問下列何者適合本篇文章標題？
  options:
  - label: A
    content: 壓力型肥胖怎麼辦
  - label: B
    content: 皮質醇與慢性疲勞
  - label: C
    content: 皮質醇調節與健康
  - label: D
    content: 皮質醇一日變化
  group_stem: '人體的腎上腺在遇到特殊的情況或刺激時，會大量分泌皮質醇，讓身體可以應付一些緊急需要，故皮質醇又屬於「壓力性荷爾蒙」的一種。隨著壓力的消失，皮質醇便會漸漸回落至正常水平。

    正常情況下，體內皮質醇有著固定的日夜節律，因此通常早上開始上升，晚上 10、11 點降到最低以安穩睡眠。由此可知，身體會根據白天與夜晚，進行皮質醇晝夜濃度調整。適量的皮質醇分泌有助人們處理壓力，是必要且健康的。

    然而，皮質醇持續過高或過低，對身體都不好。分泌過量容易導致心情緊張、失眠、壓力型肥胖、落髮、不孕等問題，體內血糖上升、脂肪堆積、骨質密度減少、蛋白質流失、水份淤積、男性及女性荷爾蒙下降、免疫力下降、皮脂腺發炎、眼壓升高、情緒緊繃、失眠，進而增加糖尿病、心血管疾病、骨質疏鬆、肌肉萎縮、不孕、感染、冒痘痘、青光眼或精神狀況異常的風險。

    皮質醇過高的人，外觀上看起來腫腫胖胖，特別是臉頰及下巴、脖子後緣及肚子，常常會有月亮臉、水牛肩、中廣型肥胖的表現；而在皮膚皺褶處如腋下、女性乳房下緣或是腹部及大腿內側，則可能會出現紫羅蘭色的長型條紋，這種條紋長得跟肥胖紋或妊娠紋很像，不同的地方在於肥胖紋或妊娠紋是白色的，而皮質醇過高產生的條紋是紫色的。

    皮質醇不足的人，看起來精神不濟、總是很疲憊；胃口與食慾減低，也有可能出現身體疼痛或腹痛的情形；有明顯認知能力與記憶力減退的狀況；血壓不高，甚至嚴重一點會有低血壓的發生。

    此外，若體內皮質醇缺乏日夜節律，容易造成睡眠障礙、半夜容易驚醒又無法入睡、早醒、憂鬱、慢性疲倦、焦慮等健康問題。根據研究發現，皮質醇節律失衡也會提高轉移性乳癌或肺癌病患的死亡率；對一般大眾而言，也會增加死亡及心血管疾病死亡率。

    想要維持皮質醇的正常節律，除了要調節正常生活作息及正確的健康飲食，也要使身心保持放鬆。此外也可向專業人員諮詢，或進行失眠壓力荷爾蒙相關檢測，以找出問題所在。'
