    content: 紀昀參加殿試，頗有奪魁的厚望。遇見一徐氏測字，於是提筆寫了「墨」字。徐氏訝然道：「紀兄無法獨占鰲頭」。徐氏解釋：「墨字的上半，形似里字，里字拆開則是『二甲』兩字，所以一甲恐已無望，而是二甲進士了」。榜單揭曉那日，果如徐氏所言，紀昀是二甲進士。
