  group_stem: '東坡初不識朱司農，後與司農公結為知己。

    公偶一日謁➀至東坡，典謁已通名，而東坡移時不出。久之，東坡始出，愧謝➁云：「適了些日課，失於探知。」坐定，東坡語畢，公請曰：「適來先生所謂日課者何？」東坡云：「抄《漢書》。」公曰：「以先生天才，開卷一覽，可終身不忘，何用手抄邪？」東坡曰：「不然，某讀《漢書》，至此凡三經手抄矣。初則一段事抄三字為題，次則兩字，今則一字。」公離席複請曰：「不知先生所抄之書，肯幸教否？」東坡乃命老兵就書几上取一冊至，公視之，皆不解其義。東坡云：「足下試舉題一字。」公如其言。東坡應聲輒誦數百言，無一字差缺，凡數挑皆然。公降嘆良久，曰：「先生真謫仙才也！」

    他日，以語其子曰：「東坡尚如此，中人之性，豈可不勤讀書邪！」

    注釋：➀謁：拜訪。➁謝：道歉。'
