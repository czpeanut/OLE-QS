- id: doc_113_新北_土城_國文_g8s1e1_s1_33
  section: 1
  number: 33
  type: single
  page: 3
  stem: 根據本文，下列敘述何者最恰當？
  options:
  - label: A
    content: 蜂后的主要工作就是照顧新生兒
  - label: B
    content: 夏天出生的工蜂生命周期大約是兩週
  - label: C
    content: 冬天出生的工蜂因環境惡劣存活不易
  - label: D
    content: 參與育兒工作的工蜂老化速度比較快。
  group_stem: '照顧子女是一個不輕鬆的工作，相信當過父母的人都有同感。最近發表在實驗生物學期刊上的研究告訴我們，對蜜蜂也是這樣。

    蜂后只在夏季產卵，因此，在夏天出生的工蜂要花幾個星期去照顧新生的幼蟲，接著這些工蜂轉而去採蜜，約兩週後死亡，並於死前呈現出腦功能下降的症狀。若以為工蜂就是這麼短命，那就錯了。科學家觀察到，冬天出生的工蜂可以活一年，而夏天出生的工蜂與冬天出生的工蜂，最大的差別是冬天出生的工蜂不需要育幼。

    為了了解育幼是否為影響工蜂生命的關鍵因素，科學家把冬天出生的工蜂移到夏季的狀況下觀察，其中一組提供幼蟲讓牠們育幼，另一組則沒有提供幼蟲。結果發現，育幼組的工蜂們在育幼後幾週轉為採蜜，並於兩週後死亡，而沒有育幼的另一組工蜂們則活了十週，並且沒有發現任何腦功能下降的狀況。科學家們發現，lipofuscin
    這個衰老的色素在育幼組的工蜂中大量地出現，而不參與育幼的工蜂體內 lipofuscin 的量則很低很多。

    （改寫自葉綠舒 嗡嗡父母，育我劬勞）'
