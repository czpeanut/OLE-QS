- id: doc_111_新北_崇林_國文_g7s2e2_s5_3
  section: 5
  number: 3
  type: single
  page: 3
  stem: 根據上文，作者小時候荒廢學業最主要的原因為何？
  options:
  - label: A
    content: 父母無力栽培，怠忽學習
  - label: B
    content: 自恃天資聰穎，不知檢束
  - label: C
    content: 學業壓力沉重，逃避現實
  - label: D
    content: 年少識人不清，誤交損友。
  group_stem: "予少時讀書，一見輒能誦。暗疏①之，亦不甚失。然負此自放，喜從滑稽飲酒者遊。旬朔②之間，把卷無幾日，故雖有強記之力，而常廢於不勤。此數年來，頗發憤自懲艾③，悔前所為；而聰明衰耗，殆不如曩時④十一二。每閱一事，必尋繹⑤數終，掩卷茫然，輒復不省。故雖有勤苦之勞，而常廢於善忘。嗟夫！敗吾業者，常此二物也。\n\
    \                                       (節選自秦觀〈精騎集序〉)\n注釋：①暗疏：默寫。②旬朔：十天或一個月。③懲艾：從失敗中記取教訓。④曩時：以前。⑤尋繹：反覆推究。"
  tags:
    textbook: 七下 第三課 四種讀書的方法
