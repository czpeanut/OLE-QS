  stem: 根據上文，屈原自稱「舉世皆濁我獨清，眾人皆醉我獨醒。」意謂他被放逐是因為：
  options:
  - label: A
    content: 自視甚高，鄙夷楚國君臣
  - label: B
    content: 遺世獨立，想隱居山林不仕
  - label: C
    content: 潔身自愛，不願同流合污
  - label: D
    content: 喝酒適可而止，不肯與眾人同歡。
  group_stem: "圖1.漁父見而問之曰：「子非三閭大夫與？何故至於斯？」\n圖2.屈原曰：「舉世皆濁我獨清，眾人皆醉我獨醒，是以見放。」\n圖3.漁父曰：「世人皆濁，何不淈其泥而揚其波？眾人皆醉，何不餔其糟而歠其醨？」\n\
    圖4.屈原曰：「吾聞之，新沐者必彈冠，新浴者必振衣。安能以皓皓之白，而蒙世俗之塵埃乎？寧赴湘流，葬於江魚之腹中！」\n圖5.漁父莞爾而笑，鼓枻而去，乃歌曰：「滄浪之水清兮，可以濯吾纓；滄浪之水濁兮，可以濯吾足。」\n\
    改寫屈原〈漁父〉、〈趣味學古文〉\n  公元前二百七十八年初夏，洞庭湖畔，風和日暖，林木蓊鬱，一派生機。屈原行走於湖邊，披頭散髮，步伐沉重，身心憔悴，滿面愁容。他一邊走，一邊低吟詩句，洞庭湖的美好景色，絲毫引不起他的興趣。這時，遇見一名漁父，漁父問說：「您不就是那三閭大夫屈原嗎？為什麼到湖畔來？」\n\
    \  屈原深深嘆了一口氣說：「舉世混濁我獨清，眾人皆醉我獨醒，所以我被流放出來了。」漁父回答說:「常言道：『識時務者為俊傑。』聰明的人處世之道，該是善於順應時變。舉世混濁，您為何不隨波逐流，為什麼要堅持清醒，使自己遭受流放之難呢？」漁父不解的問道。屈原盯著漁父看了好一會，慢慢說到：「剛剛洗過頭的人總要把帽子彈彈才戴上，新洗過澡的人不免要抖抖衣服才穿上。誰願意將自己乾淨的身軀弄髒呢？我堂堂清白之人，寧願在流放中葬身魚腹，豈能讓世俗的塵垢玷汙呢？」屈原說完，拖著沉重的腳步，繼續朝前走去。漁父微微一笑，搖著船槳離去，一邊唱著：「如果這水波清澈，就可以用來洗我的帽帶；如果這水混濁，就可以清洗我的腳。」\n\
    \  這年農曆五月五日，屈原漂泊到湘江支流汨羅江邊，聽說秦國派大將已攻克楚國郢都，頃襄王已棄城而逃，不堪悲痛欲絕。他不願看到自己的楚國慘遭淪亡，感嘆世事，滿懷悲憤，抱起一塊大石頭，縱身跳入汨羅江中。\n\
    \                                   改寫自錢念孫〈中國文學史演義〉"
