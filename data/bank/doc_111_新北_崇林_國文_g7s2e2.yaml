  section: 5
  number: 5
  type: single
  page: 4
  stem: 本文主要旨意為何？
  options:
  - label: A
    content: 行百里者半於九十
  - label: B
    content: 九層之臺，起於累土；千里之行，始於足下
  - label: C
    content: 時過然後學，則勤苦而難成
  - label: D
    content: 人一能之，己百之；人十能之，己千之。
  group_stem: "予少時讀書，一見輒能誦。暗疏①之，亦不甚失。然負此自放，喜從滑稽飲酒者遊。旬朔②之間，把卷無幾日，故雖有強記之力，而常廢於不勤。此數年來，頗發憤自懲艾③，悔前所為；而聰明衰耗，殆不如曩時④十一二。每閱一事，必尋繹⑤數終，掩卷茫然，輒復不省。故雖有勤苦之勞，而常廢於善忘。嗟夫！敗吾業者，常此二物也。\n\
    \                                       (節選自秦觀〈精騎集序〉)\n注釋：①暗疏：默寫。②旬朔：十天或一個月。③懲艾：從失敗中記取教訓。④曩時：以前。⑤尋繹：反覆推究。"
