- id: doc_113_高雄_翠屏_自然_g7s2e1_s1_46
  section: 1
  number: 46
  type: single
  page: 5
  stem: 根據文章內容描述，玉米的授粉屬於哪一種方式？
  options:
  - label: A
    content: 人工授粉
  - label: B
    content: 風力授粉
  - label: C
    content: 昆蟲授粉
  - label: D
    content: 無法判斷
  group_stem: '玉米是開花植物，必須靠授粉、受精、結果的過程繁殖下一代，雄花無法製造花蜜來吸引蜂蝶幫忙傳粉，只好產生大量花粉，散播在空氣中，讓它們有更高的機率能到達雌蕊的柱頭上。雌蕊如鬚狀，雌穗即是玉米本身，生長於植株中間的葉腋內，雄蕊花粉散出與雌蕊受精後，就可長出滿滿玉米果粒。

    為了捕捉雄花散播的細小花粉，雌花借助的利器就是毛毛的玉米鬚。每一根玉米鬚其實是一朵雌花的雌蕊柱頭和花柱，在顯微鏡下觀察，它有細微的分岔，也許這樣比較 容易「卡住」花粉吧。

    所以，每根玉米鬚都連接著一顆玉米粒，玉米鬚越多，表示這條玉米穗裡的玉米粒越多，你如果有耐心數數看，也許會有三、四百條玉米鬚呢！而且，授粉和 受精的成功率越高，玉米粒就越飽滿，玉米的收成與賣相也會越好。因此，農夫種植玉米時，會讓植株密集的排排站，讓雄花花粉一飄下來就立刻被玉米鬚接收。'
