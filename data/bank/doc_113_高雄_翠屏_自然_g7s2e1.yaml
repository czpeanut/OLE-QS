- id: doc_113_高雄_翠屏_自然_g7s2e1_s1_48
  section: 1
  number: 48
  type: single
  page: 6
  stem: 斑馬魚的「無合成分裂」有什麼特別之處？
  options:
  - label: A
    content: 細胞在分裂時不會進行DNA 複製
  - label: B
    content: 細胞不會分裂，只會變大
  - label: C
    content: 分裂出的細胞比母細胞更大
  - label: D
    content: 這種分裂方式可產生完整的DNA。
  group_stem: '顛覆過去發現！中研院團隊首揭細胞「無合成分裂」登上《Nature》期刊


    中研院陳振輝研究團隊以斑馬魚為研究對象，長期深入探索生物再生過程的細胞和分子機制，追蹤斑馬魚體表所有皮膚細胞的動態行為。團隊意外發現，當斑馬魚在個體發育的特定階段，最表層的皮膚細胞──原被認為是不會分裂增生的體細胞，其單一母細胞竟然可以分裂2
    次，共產生4 個子細胞，其分裂過程不需要進行遺傳物質（DNA）複製，因此命名為「無合成分裂」，且這些子細胞皆不具有完整的母細胞DNA。然而，陳振輝一開始也百思不得其解，為什麼斑馬魚的皮膚細胞需要這樣分裂？而且分裂後的子細胞形狀變小也變扁？多年來與斑馬魚為伍的他，認為答案可能與個體發育成長所遇到的特殊挑戰有關。

    研究團隊利用一個數學幾何模型作為基礎，與本院化學研究所研究員許昭萍、顏清哲博士跨領域合作，進行細胞體積變化的定量分析，他們發現斑馬魚單一表皮細胞經過兩次「無合成分裂」之後，整體的表面積可增加
    6 成。由於斑馬魚幼魚在特定的發育階段長得很快，體表面積需要快速增加。為了維持一個穩定的皮膚雙層結構，下層的表皮幹細胞以正常的「有絲分裂」來增生，但是上層已分化的表皮細胞恐已失去此選項，轉而進行「無合成分裂」。這種分裂方式能讓表皮細胞在資源有限的情況下，能有彈性的快速延展，使生物個體有效率地增加體表局部面積，以維持表皮細胞穩定的覆蓋率。此為斑馬魚幼魚在特定發育階段所利用的應急策略。

    陳振輝回憶，此篇論文的投稿時間已經是2020年底的事，由於顛覆大家過去對於細胞分裂的認識，初期就收到很多審查意見，「但不只審稿人有意見，我們自己也想知道是否還有其它可能的解釋。」一開始，陳振輝團隊原本只想觀察表皮細胞如何移動或脫落，沒想到卻看到此獨特現象，還以為會不會是研究工具出了錯，「怎麼跟教科書教的完全不同！」重複做了多次對照實驗。'
