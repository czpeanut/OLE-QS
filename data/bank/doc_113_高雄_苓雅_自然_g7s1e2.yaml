  - label: A
    content: 消化作用，胺基酸
  - label: B
    content: 消化作用，葡萄糖
  - label: C
    content: 分解作用，葡萄糖
  - label: D
    content: 合成作用，胺基酸。
- id: doc_113_高雄_苓雅_自然_g7s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 光合作用可用以下反應式表示：甲┼乙→丙┼丁┼戊。若甲和丁為同物質，戊是氣體，下列何者正確？
