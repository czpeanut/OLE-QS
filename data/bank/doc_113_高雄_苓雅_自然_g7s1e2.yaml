- id: doc_113_高雄_苓雅_自然_g7s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 小玲和四位朋友去一座森林遊樂區旅遊，發現有一棵樹的樹幹中間破了一個大洞，內部早已呈現中空，可是整棵樹看起來綠葉茂密，生命旺盛。小玲問道:「為何樹幹中空的大樹，仍可繼續生長呢？」下列四位朋友的回答，何者最為合理？
  options:
  - label: A
    content: 小正：形成層可以取代中空的木質部的功能
  - label: B
    content: 小德：樹幹仍具有新分裂的運輸細胞，可繼續執行運輸的功能
  - label: C
    content: 小美：樹幹的下半部已經死亡，可是樹幹的上半部仍可繼續由空氣中吸取水分
  - label: D
    content: 小莉：韌皮部可以取代中空的木質部的功能
- id: doc_113_高雄_苓雅_自然_g7s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: '小婷與小雅發現路邊有一顆榕樹的樹皮被環狀剔除，幾週後此棵榕樹逐漸因根部無法獲得養分而死亡，以下為兩人對此株植物死因的推論：

    小婷：剔除的部分包含木質部，故植物死亡。

    小雅：剔除的部分包含韌皮部，故植物死亡。

    下列對兩人推論的敘述何者正確？'
  options:
  - label: A
    content: 兩人均合理
  - label: B
    content: 兩人均不合理
  - label: C
    content: 只有小婷合理
  - label: D
    content: 只有小雅合理
