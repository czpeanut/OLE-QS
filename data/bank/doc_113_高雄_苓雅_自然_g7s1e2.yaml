  group_stem: "【題組八】請閱讀下面文章，回答第36~38 題：\n        你看過卡通「藍色小精靈」嗎?這一群可愛又勇敢的藍色人形小生物運用機智擊敗邪惡的賈不妙，展開一段又一段有趣的故事。但在現實的世界中，若嬰兒的皮膚、嘴唇或四肢呈現藍紫色，那可是真的很不妙的情況。因為這代表這些部位面臨缺氧的情況，最嚴重時可導致嬰兒死亡。有些人把這樣的孩子稱為藍寶寶（Blue\
    \ Baby），或者稱為「藍嬰症」。\n        導致「藍嬰症」的原因之一為嬰兒心臟的心室中膈(區隔左右心室的膈層)破損時，就會發生充氧血和缺氧血混流的情形，此病症的主要治療方式為透過手術修補心室中膈的缺損。一般手術須待寶寶滿3\
    \ 個月後才可進行，目前手術成功率高。病童在接受手術後大部分都能活到成年，也能從事各類運動與工作。然而，部分接受過手術的病患，可能於數十年後出現右心室出口的血管閉鎖不全、右心室衰竭、心律不整等症狀。"
