  group_stem: 可可樹種植是艱鉅的任務，農民需要保護它免受日曬、蟲害等侵害，①也因為可可是在樹幹或主枝上開花及結果，農民需要時常摘除部分果實做「疏果」(把果樹上的部份果實移除)，以免果實營養不良。可可果收成後，加工處理成可可豆也需要手工完成。因此在市場需求不斷增長、又要考量人力成本的情況下，位於赤道南北緯20
    度以內、常年在20~30℃，每年降雨量不少於1000mm、可開發土地廣闊、且容易找到工人的發展中國家一一成為可可種植國。②非洲國家雖然供應了全球近3 分之2
    的可可，但2015 年的《Cocoa Barometer》指出扣除掉中間商、加工商、零售商等利潤後，最底層的農民僅能分得最終產品售價的6.6%。請配合文章回答15-17
