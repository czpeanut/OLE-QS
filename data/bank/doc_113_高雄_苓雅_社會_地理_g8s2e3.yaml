  section: 1
  number: 18
  type: single
  page: 2
  stem: 據美國地質調查局2015 年統計，剛果民主共和國的鈷儲量達到340 萬噸，全球居首。請問該國鈷礦產豐富應與下列哪一因素最相關？
  options:
  - label: A
    content: 位於板塊運動張裂帶
  - label: B
    content: 黑暗大陸開發歷史晚
  - label: C
    content: 地質年代久遠古陸塊
  - label: D
    content: 氣候分布呈南北對稱。
  group_stem: '近年來，國際上以「衝突礦產」名詞來描述因為是手機等電子產品原料，而成為非洲各國內戰割據、各方爭奪的鉭、錫、鎢、金、鈷等5 種稀有金屬。為了爭奪這些稀有金屬作為購置軍火的資金來源，非洲國內常引發激烈流血衝突；除了流血衝突外，非洲礦工們被迫在惡劣的環境下工作，許多幼童被強制徵召為礦工或童兵。

    稀有金屬「鈷」是製造鋰電池的關鍵材料，全球鈷礦蘊藏量有超過2/3 都在非洲。有鑑於非洲「衝突礦產」引發的人權問題，特斯拉汽車計畫將電池原料的生產線移往加拿大。但由於現今鈷的使用量僅有2%是直接開採而來，其餘98%都僅是開採鎳和銅的副產品；且有別於鋰等其他電池原物料金屬，鈷產量十分稀少，品質也以非洲生產最佳。所以特斯拉為首的各大鋰電池生產商，均在產品的正常供應和人權議題之間拉扯不定。請配合文章回答18-20
