  group_stem: "(一)\n 金谿民方仲永，世隸耕①。仲永生五年，未嘗識書具，忽啼求之。父異焉，借旁近與之，即書詩四句，並自為其名。其詩以養父母、收族②為意，傳一鄉秀才觀之。自是指物作詩立就③，其文理皆有可觀者。邑人奇之，稍稍賓客其父，或以錢幣乞之。父利其然也，日扳④仲永環謁⑤於邑人，不使學。\n\
    \ 予聞之也久，明道中，從先人還家，於舅家見之，十二三矣。令作詩，不能稱前時之聞。又七年，還自揚州，復到舅家，問焉。曰：「泯然眾人矣。」\n 王子曰：仲永之通悟，受之天⑥也。其受之天也，賢於材人⑦遠矣。卒之⑧為眾人，則其受於人⑨者不至也。彼其受之天也，如此其賢也，不受之人，且為眾人。今夫不受之天，固⑩眾，又不受之人，得為眾人而已邪？\
