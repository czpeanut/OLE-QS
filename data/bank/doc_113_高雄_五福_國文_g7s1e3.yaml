- id: doc_113_高雄_五福_國文_g7s1e3_s5_8
  section: 5
  number: 8
  type: single
  page: 6
  stem: 依據文意，文中畫底線處應填入下列何者，最符合文意脈絡？
  options:
  - label: A
    content: 鮮豔的紅色會使距離看起來較近
  - label: B
    content: 高彩度容易打亂觀者對現實的判斷
  - label: C
    content: 色彩影響的不是被攝體的大或小
  - label: D
    content: 轉換成黑白色調，依舊會像縮尺模型
  group_stem: "(四)\n 我第一次看到本城直季的作品是在報紙上。那是一張報紙上的小小照片（圖一）。我原本以為拍攝的是巨大的圓環狀游泳池，但看起來又像是泳池的迷你縮尺模型。但誰會製作這麼多的模型小人，又如此隨機擺放呢？這果然還是人們在游泳池玩的照片，只不過人群在畫面上像蟻群一樣，看起來缺乏現實感。本城直季的攝影作品雖然是實際的風景照，看起來卻像是以微距拍攝縮尺模型，原因是本城直季使用了移軸相機，所以除了有對焦的地方，畫面其他地方都變得模糊，此外，這張照片色彩鮮豔，__________________。這樣看來，擴大柔焦範圍、使色彩鮮豔，就能讓照片看起來有模型感。\n\
    \ 我們的眼睛或許會根據模糊的有無來判斷是縮尺模型還是實景。通常在微距的狀況時，對焦之外的畫面都會模糊，有柔焦的效果；而景色或遠景基本上以廣角拍攝，因此無論在哪個位置，都是對焦清晰。因此我們會依據看相片的舊經驗，判斷相片如果包含模糊部分，就是微距拍攝，而沒有模糊的是實景照片，因此只要反向調整，即使是微距拍攝，也能拍出如實景相片一般的效果。就像圖二的相片，栗林慧這位攝影師的照片就與本城直季相反，明明是微距拍攝，卻採用大範圍對焦，使作品呈現出與縮尺模型照片相反的效果，昆蟲看起來就像巨大雕像。\
    \ ──三浦佳世〈本城直季的虛擬都市〉"
