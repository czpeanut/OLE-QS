- id: doc_113_高雄_五福_國文_g7s1e3_s5_11
  section: 5
  number: 11
  type: single
  page: 7
  stem: 《小塊》的故事內容與現實生活中一個人在人際關係中的狀態，能有所對應。下列關於《小塊》故事情節的闡發，何者有誤？
  options:
  - label: A
    content: 故事情節：小塊總認為自己是別人身上的一塊；人際關係狀態：人會希望能找到認同、接納自己的人
  - label: B
    content: 故事情節：小塊在高大的世界裡只是個小方塊；人際關係狀態：人有時會因為與大眾比較而沒有自信
  - label: C
    content: 故事情節：小塊到了空無一物的荒島探尋解答；人際關係狀態：人其實不需要與人互動也能過得很好
  - label: D
    content: 故事情節：小塊回家後開心的說「我是我自己」；人際關係狀態：一旦認識與接納自我後，會更有自信
  group_stem: "(五)\n 李歐．李奧尼繪本新作《小塊》描述一個由色塊組成的世界，裡頭的生物都又高又大的、喜愛冒險，並且做一些很棒的事。但主角「小塊」只是一個橘色小色塊，在這樣的世界裡，更顯得小得可憐。他心想，自己一定是某個傢伙身上的一小塊。於是，當他遇見了會跑步的、強壯的、游水的、爬山的夥伴們時，他都會問對方：「我是你身上的一小塊嗎？」然而，大家聽了他的問題後，都覺得自己並沒有少了一小塊。直到小塊接受一位「點子王」的建議，去荒島尋找答案，他的疑惑才慢慢有了解答。\n\
    \ 「小塊」在李歐．李奧尼的故事裡，不單單是小孩，其實是你，也是我。那個沒有自信，目光總在別人身上，也沒有好好認識和了解自己，以至於困惑和迷失的你和我。李歐．李奧尼曾說：「我相信，好的圖畫書的訴求對象，是所有那些尚未失去對生命懷抱最初喜悅和好奇的人。事實上，我不只為小孩創作，我也為自己、為朋友，為每一個心中仍住著小孩，而且有不變童心的人創作。」於是，儘管只是一個橘色的小方塊，卻完全成為我們追尋與認同自我的投影。我們一路跟著它探問，尋找歸屬，都鎩羽而歸，最後來到那座空無一物、了無生機的荒島。當身邊不再有任何可以認同的對象，目光才會漸漸移轉到自己身上。然後從破碎到重組，好好看清自己的樣貌和獨特性，深刻了解自己，肯定自己，欣賞自己，明白你就是你，你不屬於任何人，也不必像他們一樣。\n\
    \ 「小塊」的這趟旅程，是尋找自我認同的旅程。這也正是李歐．李奧尼傾一生近四十部作品，所關切的主題。他擅長以小孩童稚單純的眼光看待世界和人生，從複雜繁瑣的事物表象，去深掘其中最精萃的本質，然後利用淺顯、簡潔又饒富詩意的文字，搭配充滿象徵和隱喻，並且趣味十足的圖像呈現出來，透過故事向讀者提問，也引領他們思考：我是誰？我能做什麼？我和別人有什麼不同？我需要和大家一樣嗎？我要如何和團體成員相處並建立關係？\n\
    \ 他認為每個人在成長過程中都必須凝視自己，誠實快樂的活出自我，表現出自己的獨特性和才能，同時也必須學習加入群體和他人相處，建立和諧的關係。因為只有尊重個體的獨特性和差異性，又能彼此接納，相互融合，大家才能一起創造最美好的生活。\n\
    \ 這也正是為什麼故事中的小塊，在經歷從他人身上尋找歸屬卻頻頻受挫，獨自漂流荒島又滿載自信回到朋友身邊時，可以開心的大叫：「我是我自己！」，而那些朋友儘管聽不太懂它在說什麼，卻還是能和小塊一起同歡喜的原因。\n\
    \ 因為，只有在你先認同自己以後，別人才會認同和接納你。"
