  section: 4
  number: 22
  type: single
  page: 4
  stem: '「《恆毅力》作者安琪拉·達克沃斯在TED 的演講提到：『恆毅力是對特定領域能有持續專注的熱情，且在遇到問題時能夠有堅持到底的毅力。』安琪拉·達克沃斯在她書中提到一組恆毅力的公式：天份×努力＝技能，以及技能×努力＝成就。鈴木一朗就是展現恆毅力最好的典範，他的傳奇，印證了努力在成就上的重要性。鈴木一朗並非天生棒球好手，陪伴他成就不凡的，是那根染著血跡的球棒。他進入世界少棒聯盟後，積極練習揮棒，因球棒與手掌不斷摩擦，球棒握把的部分，盡染上了他暗紅色的血跡。也因為這樣的努力，他成為頂尖的職棒選手。」

