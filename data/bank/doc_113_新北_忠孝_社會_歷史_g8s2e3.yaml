  stem: '電影光陰的故事中，一幕1960 年代臺灣家庭裡的客廳場景。播報消息卻是美軍B-52 針對敵軍進行轟炸的影像。轟炸機從沖繩基地起飛，中途停靠了臺中清泉崗基地，緊接著開往戰區實施高密度的空襲。當時臺美聯合擴建而成的清泉崗基地，往北連結沖繩基地，往南連結菲律賓基地，使美國在東亞有了完整的空防體系….

    請問：上文中「空防體系」的目的與下列何者最相關？'
