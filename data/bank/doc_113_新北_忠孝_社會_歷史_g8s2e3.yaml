- id: doc_113_新北_忠孝_社會_歷史_g8s2e3_s1_30
  section: 1
  number: 30
  type: single
  page: 1
  stem: '國共內戰期間，鄔滄萍在美國拿了兩個碩士學位。1951 年，他響應中共的號召，返國參加建設。可是他在美國辛苦學到的東西，在「新中國」根本派不上用場。他回憶說：「那時候中國在政治上是完全的『一邊倒』，連英文都認為沒用。回來以後我們因國家的政治傾向，都學了新語文，學得很快，能隨便看書。」

    請問：上文中，第一順位的外國語應是下列何者？'
  options:
  - label: A
    content: 日語
  - label: B
    content: 俄語
  - label: C
    content: 英語
  - label: D
    content: 法語
