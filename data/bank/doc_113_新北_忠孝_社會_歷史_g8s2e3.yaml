  group_stem: 鋼鐵—這種堅硬閃亮的金屬被視為社會主義的象徵，代表著工業化、現代化和工人階級。為了完成鋼鐵生產的任務，各地開始建造小高爐。這些小高爐用沙子、石頭、耐火磚或者普通的磚頭堆砌而成，結構相對簡單。煉鋼需要廢鐵，人們家裡的鐵器便交了出去，哪怕生活必需品，像門上的鐵環，做飯的鐵鍋鐵鏟，婦女頭上的鐵髮夾，寶貴的農具也填進了怎麼也填不滿的土高爐。當時有這樣的口號：「交一把鋤頭就是消滅一個帝國主義，藏一個鐵釘就是藏一個反革命。」為了大煉鋼鐵需要的燃料，長滿森林的山被砍禿，農民的草房被扒掉。人們一天24
    小時圍著土高爐轉，收穫季節到了，收莊稼只剩下婦女和兒童，大片莊稼爛在地裡….
