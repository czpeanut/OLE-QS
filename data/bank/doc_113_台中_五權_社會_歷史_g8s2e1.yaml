  stem: 清軍自西元1644 年入關建立帝國後，維持近300 年的國祚，然而在19 世紀面臨內憂外患之際時，曾有知識分子主張實施君主立憲進行改革，但也有其他主張透過以體制外的運動來救中國的方式，例如孫文等人。孫文等知識分子，認為清政府「政治不修，綱紀敗壞，朝廷則鬻爵賣官，公行賄賂，官府則剝民刮地，暴過虎狼」，加上面對外侮危機「強隣環列，虎視鷹瞵」，甚至已達「蠶食鯨吞，瓜分豆剖」的境地，令人無法忍受。請問，究竟是在哪一個事件的衝擊下，讓孫文等人最終主張透過從體制內走向體制外，建立民主共和國？
