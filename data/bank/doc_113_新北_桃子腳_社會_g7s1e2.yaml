  section: 2
  number: 47
  type: single
  page: 5
  stem: 關於亞當・斯密的家庭狀況，依臺灣現行法律規定，下列敘述何者正確？
  options:
  - label: A
    content: 亞當・斯密的家庭家務分工平等
  - label: B
    content: 亞當・斯密的母親享有經濟自主權
  - label: C
    content: 亞當・斯密須負擔扶養母親的義務
  - label: D
    content: 母親得對成年的亞當・斯密行使親權
  group_stem: "【題組五】請閱讀下文，回答47-50題\n    1776年，政治經濟學之父亞當・斯密寫下了一段話，形塑現代人對於經濟學的理解：「我們有指望吃上一頓晚餐，並不是因為肉販、釀酒師或麵包師傅大發慈悲，而是因為他們關心自己的利益。」當亞當・斯密享用晚餐時，他認為有這頓飯並不是因為肉販和麵包師傅喜愛他而款待他，而是因為他們透過交易可以滿足自己的利益。把晚餐擺上亞當・斯密飯桌的，是自利動機。這套理論被稱為「看不見的手」。\n\
    \    但，真是如此嗎？真正替他煎牛排的人是誰呢？關於經濟學的基本問題，亞當・斯密只成功回答了一半。他能享用晚餐，不只是因為各行各業的人能透過交易滿足自己的利益。亞當・斯密能吃到晚餐，是因為他的母親想方設法確保每天晚上都會把食物端上桌。亞當・斯密終身未婚，這位經濟學之父大半的人生都單獨和母親住在一起。她負責打理家裡，一生都在照料兒子；關於「我們如何吃到晚餐」這個問題，亞當・斯密的母親正是他忽略的答案其中一部分。\n\
    \    我們通常不認為無報酬的工作和經濟有什麼關係。家務事也被排除在經濟學分析之外。它被隱形了，被認為是用之不盡的自然資源，因此沒有價值。但是如果有一天，全世界的女人都放下她們的雞毛撢子呢？如果我們必須為所有原本免費的家事和育嬰付錢呢？加拿大主計處其實有想過了：那些無償工作佔了30.6~41.4%的GDP。在亞當・斯密寫作的時代，時至今日，我們該點出經濟體的基礎並不只是那隻「看不見的手」，還有一顆「看不見的心」。\
    \     ─《誰替亞當斯密做晚飯：從女性觀點出發，找到全球經濟困境的解答》Katrine Marçal"
  answer:
  - C
