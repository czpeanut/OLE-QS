  group_stem: "【題組四】請參考下列資料回答31~32題\n資料一：\n    以下是知名歷史小說某章節的內容：「六年後的冬天一個晚上，新港社人竟然甘心幫忙歐洲人，突襲麻豆社。那一年，烏瑪九歲。她還記得那恐怖的一夜，一群歐洲兵士騎馬闖入村落，槍聲劃破寧靜的夜空，狗群在馬後狂吠，步兵擊鼓跟進，新港社人則吆喝著，放火燃燒房屋。」\n\
    ─擷取自「福爾摩沙三族記」\n資料二：\n    提到「麻豆」，許多人會想到好吃的文旦柚。然而最先居住在當地的「麻豆社」，甚至曾被稱為「最強大的部落」。早在14世紀起，麻豆社人開始與漢人進行貿易；到了17世紀，西方勢力來到了東亞，改變了麻豆社的命運。1635年歐洲人征服了麻豆社，將麻豆社納入其體系中。\n\
    ─改寫自「用一顆文旦，帶你窺見「柚鄉」部落史」"
  answer:
  - B
