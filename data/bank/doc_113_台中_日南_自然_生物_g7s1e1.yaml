  section: 2
  number: 38
  type: single
  page: 3
  stem: 根據本文，居住在馬里亞納海溝中的生物，較缺少何種生物生存需要的資源？
  options:
  - label: A
    content: 陽光
  - label: B
    content: 空氣
  - label: C
    content: 水
  - label: D
    content: 養分。
  group_stem: '請在閱讀下列敘述後，回答 38~39：

    馬里亞納海溝是世界最深的海溝，位於菲律賓東北、馬里亞納群島附近的太平洋底，全長 2,550 公里，平均寬 70 公里，大部分水深在 8,000 公尺以上，最深處為
    11,034 公尺，是地球表面最深的地方。

    在馬里亞納海溝中居住著一種深海生物：角高體金眼鯛（Anoplogaster cornuta），因為口中具有尖長的大牙，因此有「尖牙」的稱號。牠們最常棲息的地方是水深
    500～2,000 公尺處，但最深到 5,000 公尺的海底深淵仍可見到其蹤跡。深海區仍溶有氧氣，但由於陽光無法照射到海底，導致環境漆黑、溫度接近零度，且水壓很大，能生存的生物種類不多，因此「尖牙」主要的食物為從海洋上層所掉落的生物碎屑。'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
