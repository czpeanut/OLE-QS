  type: single
  page: 1
  stem: 上公民課時，老師帶領同學在討論分工與貿易的內涵，請問：下列哪項說法錯誤？
  options:
  - label: A
    content: 凱翔：專業分工可有效提升產量但無法兼顧品質
  - label: B
    content: 韋中：選擇機會成本低的項目分工製造才有效率
  - label: C
    content: 秉翰：藉由機會成本可以找出最有利的分工模式
  - label: D
    content: 暐智：專業分工後可以藉由大規模生產提升產量。
