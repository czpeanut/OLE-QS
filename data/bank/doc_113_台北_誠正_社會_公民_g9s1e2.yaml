  section: 1
  number: 6
  type: single
  page: 1
  stem: 我國開放紡織品進出口後，因低價紡織品大量銷往我國，國內紡織產業受到嚴重衝擊，業者也開始轉型以維持生存，例如：轉型為「觀光工廠」，讓遊客透過體驗活動購買商品，達到行銷功能。根據題文判斷，下列對於紡織產業的敘述何者錯誤？
  options:
  - label: A
    content: 我國的紡織產業具有較低的機會成本
  - label: B
    content: 國外製作紡織品的機會成本較我國低
  - label: C
    content: 轉型是我國廠商創造利潤的方式之一
  - label: D
    content: 我國的紡織產業必須從提高商品附加價值著手。
