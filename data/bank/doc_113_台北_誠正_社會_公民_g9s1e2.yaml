  group_stem: "回顧近幾年的金融風暴，不難歸納，世界銀行一貫的「改革政策」是：我現在借你一大筆錢，但是你要聽我的話，平衡政府預算、降低關稅、開放資本自由進出與勞動市場、國營企業要民營化……。並且事先預言：短期內你會很痛苦；但是長期而言，你就會跟我們這些西方經濟體一樣，有一個自由開放的系統，經濟成長隨之而來。\n\
    \  但事實真的如此嗎？《經濟學人》雜誌報導「中南美洲的悲劇」，指出阿根廷的無奈：二、三十年前，阿根廷首都布宜諾斯艾利斯郊區的拉瑪坦薩（La Matanza）是阿根廷經濟的希望。汽車、鋼鐵、紡織等工廠櫛次鱗比，阿根廷內陸的民眾不斷移居至此淘金。雖然經濟尚未開放，但工廠享有國家的關稅保護與補貼，國內的產業發展整體而言欣欣向榮，好日子似乎就在不遠處。\n\
    \  但就在八零年代阿根廷爆發債務危機後，為求還債，阿根廷接受世界銀行的緊急貸款，以及「改革計劃」，開放該國市場。\n  市場開放後，這些廠商不敵國際競爭，紛紛倒閉。現在，拉瑪坦薩的一百三十萬人口中，有十萬人失業，三六％的人落入貧窮線下，整個城市充滿販賣廉價品、髒亂的小店，建築物矮小、破亂、傾頹。\n\
    \  「世界銀行會議是通往災難的宴會，」哈佛大學經濟學家薩克斯在演講中諷刺。\n  誠然，國際貧富差距擴大是不爭的事實。根據聯合國人類發展報告，在最近七年，世界上前二○％最富有跟前二○％最貧窮的國家，收入差距從六十倍擴大到七四倍。「如果不快擴大全球體系中的『贏家俱樂部』，全球經濟會愈來愈不穩定，」《紐約時報》專欄作家傅利曼警告。\n\
    \  當然眾多國際機構也絕非視若罔聞。近一年來，這些機構的會議重點，多半在於如何消除國際貧富差距、降低貧國負債。甚至，在會議場外，世界銀行還做了「我們的夢想就是消除貧窮」的標誌，與抗議隊伍相互輝映。只是，降低國際貧富差距並不只是「經濟」問題。最新一期世界銀行的《世界發展報告》指出，貧窮是「多層面」的問題，它還包含了政經體系無能、在國際社會缺乏發言權、脆弱與恐懼。解決之道包括消除歧視與不平等、協助政府作決策、開拓國際對話機制等。\n\
    \  但是，這些工程繁複而浩大，曠日費時無論是即將在蒙特婁登場的Ｇ２０會議、或是一些在辛辛那堤、考加利等地舉行的小型貿易展覽會，都已經有團體蓄勢待發，準備繼續在場外舉行「會外會」。甚至四月份將在魁北克進行的美洲高峰會，也已經被抗議人士編上編號，屆時將在場同時舉行「全球五月大遊行」。\n\
