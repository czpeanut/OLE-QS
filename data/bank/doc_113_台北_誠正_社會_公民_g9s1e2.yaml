  - label: A
    content: 只要是購買的商品未開封，皆可以享有7 天的猶豫期
  - label: B
    content: 這是消費者的權益，若店家不願意退貨，可直接報警
  - label: C
    content: 除非是瑕疵品問題，否則實體店面可不受理退貨要求
  - label: D
    content: 當事人可依《公平交易法》，爭取應處理的消費爭議。。
