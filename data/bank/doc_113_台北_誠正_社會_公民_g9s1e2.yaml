  options:
  - label: A
    content: 追求利潤是企業經營的目的
  - label: B
    content: 擴大投資可以來增加生產規模
  - label: C
    content: 提供消費者更多樣的商品選擇
  - label: D
    content: 善盡企業的社會責任。
