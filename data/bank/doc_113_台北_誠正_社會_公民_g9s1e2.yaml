  stem: 請問依照內文，下列敘述何者正確？
  options:
  - label: A
    content: 相關法規是指《民法》
  - label: B
    content: 廠商因與消費者產生糾紛而遭懲處
  - label: C
    content: 若廠商不服處分可提出調解申請
  - label: D
    content: 文中對業者的提醒也是在要求業者盡社會責任。
  group_stem: "機車騎士的安全帽在未使用時不易放在背包裡，但有業者廣告宣稱「全球首創！放得下安全帽的後背包，日前遭（甲）處罰。\n  該會日前委員會議通過，業者於群眾募資平臺銷售商品，廣告宣稱「全球首創！放的下安全帽的後背包」、「市售唯一裝得下安全帽的後背包」，但其他網站也有銷售同類商品，故該業者在廣告上宣稱「全球首創」、「市售唯一」，就足以影響交易決定之商品品質有虛偽不實及引人錯誤之表示，違反相關法第21\
    \ 條第1 項規定，處業者新台幣20 萬元（乙）。\n  （甲）表示，前述廣告宣稱讓人認為市場上僅有此公司所銷售的後背包具有寬敞設計功能，其容量空間足以裝得下安全帽。但經調查後發現，市面上尚有同類商品亦具有大容量空間可供放置安全帽。所以，該公司在廣告上宣稱「全球首創」、「市售唯一」並非事實，此將使一般人產生錯誤的認知或決定，對其他競爭同業形成不公平競爭，已屬廣告不實。\n\
    \  （甲）提醒，業者若在廣告上強調「首創」、「唯一」此種最高級用語連結客觀陳述，應該有具體客觀資料來佐證，如果只是說明自身商品款式、LOGO 圖案等特色，則應說清楚、講明白，避免造成消費者誤認。\n\
    摘改自聯合報《後背包放得下安全帽「市售唯一」？廣告不實遭罰20 萬》"
