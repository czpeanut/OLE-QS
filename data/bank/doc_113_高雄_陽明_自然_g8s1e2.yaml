- id: doc_113_高雄_陽明_自然_g8s1e2_s1_46
  section: 1
  number: 46
  type: single
  page: 9
  stem: 單面鏡的應用原理是下列何者？
  options:
  - label: A
    content: 雙方都可以同時互相看見對方
  - label: B
    content: 雙方都無法看見對方，也看不見自已的影像
  - label: C
    content: 亮的一方可以看見另一面，暗的一方只能看到自己的影像
  - label: D
    content: 暗的一方可以看見另一面，亮的一方只能看到自己的影像
  group_stem: '電視影集裡，常常會有證人辨認嫌疑犯的場面，證人和犯人會被分開在兩個不同的房間內，證人可以透過單面鏡看見犯人，但由犯人這邊看過去，只是一面普通的鏡子，無法看見證人。其實，有時候我們在百貨公司、
    銀行、甚至路邊的汽車車門上也可以見到這一類的單面鏡。為什麼這種單面鏡只有其中

    的人可以看到另一邊的人呢？

    事實上，單面鏡前、後兩面的光學性質根本沒有分別。它之所以能產生單面反光的效果，完全是因為鏡子的兩面處於不同的亮度的環境所造成的。若比較普通的鏡子與單面鏡的結構，會發現普通鏡子是把銀鍍在玻璃上
    製成的；單面鏡也是一樣有鍍銀，但是在鍍銀的時候只鍍了「一半」，亦即鍍上去的銀層十分的薄，使一半的光線仍可以透過去，而另一半的光線就會被反射回去了。

    在實際使用時，犯人會面向鏡面，而且身處在有強光的房間，因為光線充足，鏡面反射的光線較多，犯人便會在鏡中看見自已的影像。此時證人站在鏡子的另一邊一個光線微弱的房間裡。雖然證人所在的房間內的部分
    的光線也可以穿過單面鏡，但由於光度很低，所以犯人便看不見證人，只能看到自己的影像。這種情形就好像在街燈的強光下，我們不能看見螢火蟲發出來的微弱光一樣，這是因為螢火蟲發出來的微弱光線被街燈的強光所蓋過了。因此所謂單面反光的現象，其實只是視覺上的錯覺罷了。'
