- id: doc_113_新北_板橋_社會_公民_g7s2e3_s1_49
  section: 1
  number: 49
  type: single
  page: 2
  stem: 根據畫線處判斷，社工遇到的問題是屬於下列何種不公平？
  options:
  - label: A
    content: 責任承擔過於沉重
  - label: B
    content: 付出貢獻不受尊重
  - label: C
    content: 利益分配不合理
  - label: D
    content: 所有需求未被滿足。
  group_stem: '對於「社會安全網」的期盼是——家庭、校園教育、社福、心理健康與精神衛生、警政、司法、少輔、獄政等各個系統，都可以擁有充分的資源，並且進行跨網絡的合作，共同鋪建出一張全面、深入、綿密的支持網絡，承接住每個可能墜落的人。

    2018 年政府推出「強化社會安全網計畫」，遺憾的是，計畫過度聚焦在「增加社工人力」、「強化社福服務」，導致社安網的重擔全壓在社工身上。這也是為什麼 2020
    年我多次對社會安全網計畫提出質疑，要求政府正視精神衛生資源不足、社工人員壓力過重，以及非常重要的，跨部會合作嚴重不足的問題。

    2022 年政府接續進行的第 2 期社會安全網計畫，大幅增加精神衛生資源，並將原本的計畫擴張到教育、校園心理輔導、少年輔導等面向。強調要強化社政、衛生、教育、勞政、警政、法務等各體系間的服務連結。

    這就是所謂的「社會安全網 2.0」。但是，社會安全網就此完整了嗎？

    我衷心盼望，我們能用充分的資源與支持，減少遺憾與傷痛。我更希望，臺灣社會能夠停止從一次又一次的悲劇中學會教訓，而是從預防做起，真正成為一個更安全、更適合每個人生存的土地。

    資料來源：王婉諭(2024.01.09)。為預防悲劇而生的社會安全網，進步了嗎？再次從校園攻擊看見漏洞。多多益善'
  answer:
  - A
