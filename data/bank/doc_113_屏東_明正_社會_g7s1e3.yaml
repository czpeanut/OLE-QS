- id: doc_113_屏東_明正_社會_g7s1e3_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 根據上文敘述，若學校內未設置性別友善廁所，恐造成下列何種危害？
  options:
  - label: A
    content: 學生自治未落實
  - label: B
    content: 學生生存權受到侵害
  - label: C
    content: 學生學習權被剝奪
  - label: D
    content: 學生的人性尊嚴未受重視。
  group_stem: '【題組二】

    2015 年起，教育部逐步補助高中以下學校增設性別友善廁所。所謂「性別友善廁所」，就是在設計上，推開廁所每間獨立隔間的門，內部都兼具站立式小便斗、坐式馬桶等多個符合不同需求的便器。

    教育部強調：「性別友善廁所」應備四項條件，包括：1、各種便器都有完整隔間；2、廁所外須有完整概念說明；3、比以往更明亮、安全、友善與彈性的整體設計；4、要架設安全設備，來提升隱私性與安全性。專家指出「站立式小便斗的普及，制約生理男性上廁所的方式」，讓男生坐著小便、不被旁人偷瞄，可以尊重使用者如廁品質和感受，所以歐美愈來愈多國家減少站立式小便斗。而在台灣，男孩小時候在家，大多用坐式馬桶，出門在外，卻被迫要站著小便，因此，性別友善廁所的增加，有助男生自由選擇「方便」的姿態。

    然而，根據新竹市築心生命教育協會的兒少報告中，就有青少年提到，他們覺得學校設有性別友善廁所，男生、女生都可以進入，讓他們覺得沒安全感，出現抵制的現象。

    學者專家直說有些學生觀念還沒跟上，反而對去上性別友善廁所的人貼標籤，質疑他們的性別認同和多數人不一樣。友善校園文化若沒建置好，再前衛的硬體也是枉然。

    資料來源：改編自翻轉教育專題'
