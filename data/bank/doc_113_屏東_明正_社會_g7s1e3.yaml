- id: doc_113_屏東_明正_社會_g7s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 關於法國總統對於學生禁用手機的發言，下列敘述何者正確？
  options:
  - label: A
    content: 法國總統的論述，是覺得手機很可能助長網路霸凌的發生
  - label: B
    content: 該政策的主要目的，是透過法律來限制學生的人格發展權
  - label: C
    content: 法國的規定是希望透過學生自主管理，來控制使用手機的時機
  - label: D
    content: 同學在網路上不能做出校園霸凌的行為，這樣的禁止規定是多此一舉，沒有必要。
  group_stem: '【題組一】

    校園安全一直是各國政府很重視的問題，為了減少校園霸凌、色情、暴力等不良事件擴散。

    法國在2018 年全國實施學生在校園內禁止使用手機的規定，法國總統曾說「為了防止校園霸凌、暴力、色情等不良行為擴散，且來學校是為了學習，故適當的限制將有助於學生學習。」；美國佛羅里達州也通過了一項法律，要求全州公立學校禁止學生在課堂間使用手機，一些學校已經延伸至全天不能使用。

    聯合國教科文組織有一份報告指出，過度使用手機會導致教育成績下滑，而且過多的螢幕使用時間，會造成嚴重分心，並對學生的情緒穩定性產生負面影響。此外，因為手機而衍生的社群網路霸凌問題，近年來也益發困擾學校。

    所以越來越多的歐美國家開始重視學生在學校使用手機的禁令規定。

