  stem: '從小學習手語的宜勤，進入大學就讀後，見學校沒有手語相關的社團，她想讓更多人學習手語、喜歡手語，在學校的公共平台上提出以下的問題，有熱心的同學提供她答案，請問下列何者所回答的是正確的解答？

