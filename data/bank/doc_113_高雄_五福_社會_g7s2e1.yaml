- id: doc_113_高雄_五福_社會_g7s2e1_s1_48
  section: 1
  number: 48
  type: single
  page: 7
  stem: 關於這兩個研究，下面哪一個的人的瞭解才是「正確的」？
  options:
  - label: A
    content: 小五：兩個研究的背景都是總督府採用武力鎮壓手段
  - label: B
    content: 阿福：研究一是五年理蕃計畫的執行；研究二是採用防堵政策
  - label: C
    content: 愛國：研究一的山區原住民幾乎淨空是在霧社事件後
  - label: D
    content: 建中：研究二的鐵條網設置是在日本平定漢人武裝抗日後。
  group_stem: "【研究一】資料來源：詹素娟著作\n    「集團移住」的構想，在1919 年先小規模，1925 年正式實施，但當時主要以個別村落為主。到了1934\
    \ 年，總督府擬定「蕃人移住十個年計劃書」，預計自該年起，以10 年時間完成4649 户、30052 人的移住計畫；實施移住的「蕃社」，全台「蕃地」都有，但以海拔高度在900\
    \ 公尺以上者，估絕大多數。而實際上，迄1941 年止，遷移總數已超過預期，達7318 戶、43112 人之多。\n    經過1930 年代的移動，今日花蓮縣秀林鄉、卓溪鄉，台東縣延平鄉，以及南投縣信義鄉的原住民山區，幾乎全面淨空。族人被移到山腳地帶，合併出許多大型部落，進而形成領域重疊、人群交錯的現象，如賽德克族嵌入布農族領域，布農族移入原屬鄒族的陳有蘭溪流域、原屬卡那卡那富族的楠梓仙溪流域，人數上反客為主。\n\
    【研究二】資料來源：林一宏研究\n    自明治39 至昭和元年（1906-1926）21 年之間，鐵條網共造成原住民及平民52 死16 傷，總計68 人，平均每年3.2\
    \ 人被害。其中，分析原住民等觸電事故的原因及比例如下表：\n\n| 原因 | 穿越誤觸 | 試電（試驗有無電流） | 交戰時觸電 | 自殺 | 其他及不明\
    \ |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 比例 | 44.1% | 16.2% | 8.8%\
    \ | 5.9% | 25% |\n| 受害人數 | 30人被害（25死5傷） | 11人被害（6死5傷） | 6人死亡 | 共發生4起 | 17名被害（11死6傷）\
    \ |\n\n【材料一】\n今年乙卯五月，倭賊（日本政權）到臺二十有年已滿。氣數為終，天地不容，神人共怒。我朝大明國運初興，本帥奉天，舉義討賊。興兵罰罪，大會四海英雄。攻滅倭賊，安良鋤暴。解萬民之倒懸（處境極為艱苦），救群生之性命。天兵到處，望風歸順，倒戈投降，本帥仁慈待人，憐恤性命，准人歸順。倘若控拒，沉迷不悟；王師降臨，不分玉石，勿貽後悔。\n\
    【材料二】\n全臺士民不勝悲憤，當此無天可籲，無主可依，臺民公議自立為民主之國，以為事關軍國，必須有人主持，於四月二十二日，士民公集本衙遞呈，請余暫統政事，經余再三推讓，復於二月二十七日相率環顧，五月初二日公同刊刻印信文曰：「臺灣民主國總統之印」，換用國旗，藍地黃虎，捧送前來。……。特此曉諭全臺知之，永清元年五月〇日。"
