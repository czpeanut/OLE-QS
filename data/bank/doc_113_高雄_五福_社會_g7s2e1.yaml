  section: 1
  number: 47
  type: single
  page: 7
  stem: 紐約先驅論壇報記者James W. Davidson 目睹台北城在總統及政府首腦相繼逃亡後，台北城的狀況，他寫道：「知道民主國總統已逃亡的士兵縱火焚燒總統衙門。在一片燃燒聲中，轟響著暴徒的叫喊聲與被害人的哭喊聲，來福槍的槍聲震耳欲聾。清兵襲擊司庫，貪婪的士兵用布頭兒包著銀幣，能拿走多少就拿走多少，沿途撒滿銀幤，士兵爲搶劫留存於布政使司庫的銀幤，互相殘殺的結果，死者竟高達四百多人」。看完關於James
    W. Davidson所目睹的這起事件，加上你所學的歷史知識，請你判斷下列哪一個說法「才是正確的」？
  options:
  - label: A
