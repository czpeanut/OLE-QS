- id: doc_113_高雄_五福_社會_g7s2e1_s1_50
  section: 1
  number: 50
  type: single
  page: 8
  stem: 上面的文章在介紹川中島33 名青年的故事，請你依照文章的旨意及所學的歷史知識，回答下面哪一個說法「並不正確」？
  options:
  - label: A
    content: 川中島是霧社事件倖存者居住的地方
  - label: B
    content: 川中島青年和先祖都投入抗日的行動
  - label: C
    content: 這個故事的人物是原住民賽德克族人
  - label: D
    content: 這個故事涵蓋了霧社事件和皇民化運動。
  group_stem: "【閱讀素養題】資料來源：《風之緋櫻》\n    為了實現「大東亞共榮圈」的崇高理想，為了建立全亞洲人的「亞洲新秩序」，在日人的慫恿下，「仰望太陽旗，吾將含笑赴死！」、「高砂義勇隊」的隊員在前線抛頭顱、灑熱血，爲天皇陛下赴湯蹈火。\n\
    \    在川中島的「霧社事件」的抗日遺生者有33 個青年人寫下血書：「為皇國而戰，為陛下而死！」、「願為聖戰之完遂而獻身！」、「上戰場殺敵，是報答聖恩的唯一途徑！」於是他們紛紛向台灣軍司令官請膺，志願加入「高砂義勇隊」，去為「皇國」效命。\n\
    這33 名「高砂挺身隊」成員中包括了初子弟弟和妹婿，這些被日人鼓舞與煽動的抗日遺生青年，别離了川中島故鄉，訣别了親人，踏上了征途。這33 名「霧社事件」的遺生者，他們大多在童稚之年時，便遭受「霧社事件」戰事的蹂躪，他們的親人大多死在日人的討伐戰役中，可以說從小經了顛沛流離的際遇，有的人是由寡母養大的，有的人是由姊姊帶大的，有的人是孤苦伶仃自己長大的，甚至於也有祖先三代死在日人的魔掌下。\n\
    「霧社事件」的抗日遺生者，洗刷了「反抗蕃」的恥辱，族中青年熱血沸騰地報效「皇國」，可以說高砂族和日本人完全平等了，這33 名川中島的抗日遺生者中，有20 名被派遣到南洋，13\
    \ 名派遣到花蓮港，被日人編入「特警備隊」中，其任務是防衛台灣東部岸，這13 名戰士未遭到戰爭的蹂躪，最後全部平安歸來，算是不幸中之大幸，而派遣到南洋去為皇國效命的20\
    \ 名「高砂義勇隊」中，有12 名為「大日本帝國」捐軀，戰死在沙場中，最後僅有8 名回到川中島的家鄉。"
