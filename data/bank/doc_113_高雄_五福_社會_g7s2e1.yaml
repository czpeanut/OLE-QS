  section: 1
  number: 40
  type: single
  page: 5
  stem: '承上題，下文是1898 年後藤新平提出的「匪徒刑罰令」，是後藤新平為達消滅「匪徒」而制定，由總督兒玉源太郎以「緊急律令」方式發布並立即生效實施。請問，臺灣總督可以頒佈法令是因為？


    「匪徒刑罰令」全文七條，主要如下：

    第一條：不問目的如何，凡為達目的而以暴行或脅迫，結合人眾者，以匪徒論罪，依左列區別處斷之。

    1.首魁及教唆者處死刑。

    2.參與謀議或指揮者處死刑。

    3.隨從或雜役者，處有期徒刑或處重懲役。'
