  group_stem: "【故事一】\n    佐久間佐馬太生於1844 年，山口縣人。而他與台灣的淵源，肇始於1874 年日本第一次出兵台灣時，當時滿三十歲的他，以「台灣蕃地事務都督參謀」加入遠征軍行列，雖然年輕，卻因為殺死牡丹社頭目父子而獲得「生蕃剋星」的稱號。\n\
    \    而他任內最後一次披掛上陣，則是1914 年5 月擔任「太魯閣討伐軍司令官」，以軍隊編制，部隊配有機關槍，另有警員加入，總計動員達一萬一千多名，比起蕃社的總人口數還要多，足見其規模之大。這次出征後，當地各蕃社紛告「歸順」，然而，在這次「最後」的討伐行動中，佐久間總督卻於6\
    \ 月26 日，為巡視前進路線，不慎從斷崖墜落重傷，雖然後來以凱旋歸來的姿態，於8 月在台北舉行盛大的祝賀會，但負傷在身的他，仍在隔年5 月辭去總督職位，回日療養，8\
    \ 月即告過世。"
