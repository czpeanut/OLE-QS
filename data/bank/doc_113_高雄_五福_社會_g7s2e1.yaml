- id: doc_113_高雄_五福_社會_g7s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 台灣的學齡人口逐年遞減主要原因為何？
  options:
  - label: A
    content: 出生率低
  - label: B
    content: 死亡率高
  - label: C
    content: 人口外移
  - label: D
    content: 新生兒性別比低。
  group_stem: '題組二：根據文章回答第12~13 題。

    根據國家發展委員會於2022 年8 月的統計與推估，2022～2033 學年度，台灣的國小、國中及大學平均入學人數，預估將分別降低至17 萬人、19 萬人及20
    萬人，較2010～2021 學年度，減少約1～3 成的學生數。

    國小學生人數預估於2023 學年度達到127 萬人後開始減少，國／高中及大學學生人數則將持續減少。長期而言，各級學校學生人數均呈下降趨勢，預估2070 學年度將較2018
    學年度減少約5～6 成的學生數。

    （資料來源：國家發展委員會「中華民國人口推估（2022至2070 年）」，2022 年8 月。）'
  shared_asset: g1_12_13
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 地理
      code: 1-1
      title: 人口成長
      chapter: 第1章 人口成長與分布
