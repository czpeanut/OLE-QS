  group_stem: '(二)

    Did you see a panda before? If not, visit our zoo, and you can see ★ there.

    Pandas are from China .They love bamboo. In fact, about 95% of their food is bamboo!
    They can eat bamboo all day long. Sometimes they may also eat other foods like
    grass, fruit, and eggs. Baby pandas are about 15 cm – that’s about the size of
    a pencil! They are also born blind and open their eyes six to eight weeks after
    birth.

    Pandas were once in danger because their bamboo forests were cut down and used
    for building and farming. Without enough forest to live in, the pandas couldn’t
    live. In the 1970s, there were only 1,000 pandas living in the wild. Luckily,
    many people worked hard to save and protect them. From 1980 to 2016, the number
    of pandas went up and were no longer in danger. Next time you see a panda, remember
    how lovely they are and why it’s important to take care of them!

     if 如果  bamboo 竹子  grass 草  born 出生  blind 盲的  birth 出生  danger 危險 were
