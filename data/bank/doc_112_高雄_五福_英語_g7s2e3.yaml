  group_stem: '(四)

    It’s Potluck Time!

    Saturday, June 28th

    From 12:00 p.m. to 3:00 p.m. at Amy’s house

    Please bring a dish to share!


    Amy: Hey guys! It’s time for our potluck! Please tell me what you’re bringing.
    Thanks!

    Sara: I have dance class on Saturday morning, so I may get there at about 12:30.
    I’m bringing Paella. Is anyone allergic to seafood?

    Kim: Cool! I can bring salad, one green and one potato. My husband wants to join
    us, too. He can make chocolate cookies.

    Jeff: Tacos are coming with me because they’re Teresa’s favorite. Also, she plans
    on baking a fruit cake for everyone.

    Amy: Wow! My mouth is starting to water. Speaking of water, the drink list includes
    soda, iced tea and lemonade. If you want something else, please let me know.


    To-Do List

    1. Ask guests about their dishes.

    2. Count the number of guests.

    3. Prepare enough cups, plates, knives, and forks.

    4. Buy drinks two days before the potluck.


