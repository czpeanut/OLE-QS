  group_stem: '(三)

    Ice cream, gelato, and sorbets are popular desserts. Sorbets are made with only
    fruit juice. Their texture is like ice because they have no cream. That’s why
    they have less fat. They are great if you’re watching your weight. Cream makes
    up a large part of gelato and ice cream. Gelato has 4% to 9%, and ice cream has
    10% to 25%. They also have nuts and other flavors besides fruit.

    People use different speeds to mix these desserts. That adds air into them. Can
    you guess which one uses high speeds? Ice cream is mixed fast and hard so that
    it has more air and has a light and fluffy texture. Gelato is mixed at a much
    slower speed, so its texture is rich and creamy.


