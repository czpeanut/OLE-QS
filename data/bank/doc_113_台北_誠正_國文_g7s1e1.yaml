  type: single
  page: 2
  stem: 「火紅的太陽也滾著火輪子回家了」，下列「 」中的字，何者詞性與「火輪子」的「火」同樣為名詞轉成形容詞？
  options:
  - label: A
    content: 「火」樹銀花照亮了淡水河的夜空
  - label: B
    content: 他為了朋友赴湯蹈「火」，在所不辭
  - label: C
    content: 他一「火」起來，任何人的勸告都聽不進去
  - label: D
