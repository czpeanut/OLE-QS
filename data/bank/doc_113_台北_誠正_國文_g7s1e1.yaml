  group_stem: '冬天，北風呼呼的吹著，小河的水面上結起一層薄冰。薄冰望著自己變得堅硬、透明的身子，便自以為是一塊光潔的玻璃。他向身下的流水誇耀：「看見了吧？我已經變成了一塊非常有用的玻璃，遲早人們會把我安在窗子上。」

    流水笑笑的說：「朋友，別胡思亂想了，儘管你的外形一時變了，你我還是一樣的。」薄冰很不高興的說：「呸！誰同你是一樣的？我現在就是比你高貴，比你有用。」這時，有人向小河走來，薄冰大喜，以為來人是要拿他回去做為窗戶，誰知來人用桶底把薄冰打破，挑起兩擔水走了。

    (薄冰的錯覺)'
