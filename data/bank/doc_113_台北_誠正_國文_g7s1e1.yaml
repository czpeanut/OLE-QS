  group_stem: '有一天，一群動物聚在一起開會，討論學校的課程。兔子說賽跑重要，一定要列入課程。鳥兒說飛翔重要，一定要列入課程。老鼠說挖地洞重要，一定要列入課程。

    最後，他們把各種重要的技能都列入課程，強制他們的孩子學習。

    結果鳥兒的飛翔本來應該考甲等的，後來，為了學習用翅膀挖地洞，把羽毛弄壞了。他既沒有學會挖地洞，連飛翔也考個丙等，兔子為了學飛翔，從樹上跌落而骨折，他不但飛不成，連他專長的賽跑也出了問題……。

