  - label: D
    content: 一「抹」斜陽、一「道」曙光、一「條」樓房。
- id: doc_113_台北_誠正_國文_g7s1e1_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 「母親十分感慨」的「十分」是「很、非常」之意，因此，「十」是虛數而非實數。下列選項「 」中的數字，何者用法也同為虛數？
  options:
  - label: A
    content: 「三」思而後行
  - label: B
    content: 家徒「四」壁
  - label: C
    content: 「三」顧茅廬
  - label: D
    content: 「三」更半夜。
