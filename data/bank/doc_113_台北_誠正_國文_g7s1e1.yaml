- id: doc_113_台北_誠正_國文_g7s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 下列選項皆為知名樂團五月天的歌詞，請問何者與「羊隊和牛群告別了田野回家了」使用的寫作手法相同？
  options:
  - label: A
    content: 我們，那麼甜那麼美那麼相信，那麼瘋那麼熱烈的曾經
  - label: B
    content: 天上的星星，笑地上的人，總是不能懂，不能覺得足夠
  - label: C
    content: 青春是挽不回的水，轉眼消失在指尖
  - label: D
    content: 陪你熬夜聊天到爆肝也沒關係，陪你逛街逛成扁平足也沒關係。
  lesson_raw:
    title: 夏夜
    basis: 引用楊喚《夏夜》課文原句
- id: doc_113_台北_誠正_國文_g7s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 下列文句，何者沒有冗言贅字？
  options:
  - label: A
    content: 酒醉駕車肇事者的人是有心殺人嗎
  - label: B
    content: 夏日裡我最喜歡待在冷氣房，一邊吃冰，一邊看電視
  - label: C
    content: 驕陽如炙，在百貨公司逛街也是不錯最佳的選擇
  - label: D
    content: 這些沒有壞動機的行為，卻可能在生命中保存留下汙點。
- id: doc_113_台北_誠正_國文_g7s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 八十歲的張老先生為人偏心，為了把財產全部留給兒子而立下了遺囑：「八十老翁親生一子所有財產完全給予女婿外人不得爭奪。」這段文字要如何標點，才能達到張老先生的心願？
  options:
  - label: A
    content: 八十老翁親生一子，所有財產完全給予女婿、外人，不得爭奪。
  - label: B
    content: 八十老翁親生一子；所有財產完全給予女、婿，外人不得爭奪。
  - label: C
    content: 八十老翁親生一子。所有財產，完全給予女，婿外人不得爭奪。
  - label: D
    content: 八十老翁親生一子，所有財產完全給予。女婿外人，不得爭奪。
- id: doc_113_台北_誠正_國文_g7s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 「如果我學得了一點點待人接物的和氣，如果我能寬恕人，體諒人—我都得感謝我的慈母。」可見胡適的母親影響他最大的是何者？
  options:
  - label: A
    content: 仕途
  - label: B
    content: 交友
  - label: C
    content: 品德
  - label: D
    content: 學問。
  lesson_raw:
    title: 母親的教誨
    basis: 題目引自胡適《母親的教誨》課文原句
- id: doc_113_台北_誠正_國文_g7s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 「靜謐」之於「喧譁」的兩者關係是意義相反，下列何者也是意義兩兩相反？
  options:
  - label: A
    content: 愉快／欣然
  - label: B
    content: 朦朧／明亮
  - label: C
    content: 滿月／望月
  - label: D
    content: 蓬勃／旺盛。
- id: doc_113_台北_誠正_國文_g7s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 關於夏夜一詩的說明，下列敘述何者有誤？
  options:
  - label: A
    content: 作者使用擬人手法，讓夏夜景物更顯具體親切
  - label: B
    content: 作者使用銀幣和珍珠譬喻月亮與星星，凸顯夏夜的寂寥與空虛
  - label: C
    content: 作者以南瓜、小河、夜風、螢火蟲還醒著，呈現夏夜的動態感和生機
  - label: D
    content: 作者透過兒童的視角和口吻來敘寫。
  lesson_raw:
    title: 夏夜
    basis: 題目明確提及《夏夜》一詩
- id: doc_113_台北_誠正_國文_g7s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 「熠熠與娟娟，池塘竹樹邊。亂飛同曳火，成聚卻無煙。微雨灑不滅，輕風吹欲燃。舊曾書案上，頻把作囊懸。」請問這首唐詩所歌詠的對象為何？（註：①熠熠：閃亮光耀的樣子。②娟娟：明媚美好的樣子。）
  options:
  - label: A
    content: 青蛙
  - label: B
    content: 螢火蟲
  - label: C
    content: 輕風
  - label: D
    content: 舊書案。
- id: doc_113_台北_誠正_國文_g7s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 下列「 」中的詞語，何者運用不適當？
  options:
  - label: A
    content: 他在「待人接物」方面十分圓熟
  - label: B
    content: 父母親辛苦養育我們長大，「寸草春暉」，何以回報
  - label: C
    content: 這段「生書」艱澀難懂，不好記誦
  - label: D
    content: 他平常為人謙遜，是人人「說嘴」的對象。
- id: doc_113_台北_誠正_國文_g7s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 「你沒有老子，是多麼得意的事！好用來說嘴！」這句話裡的「得意」，其實是指母親對作者的指責。言辭表面的意義和作者內心真意相反的修辭法叫「倒反」，下列敘述何者不屬於倒反法？
  options:
  - label: A
    content: 你可真會說話，客人都給你氣跑了
  - label: B
    content: 固執也有好處：明天的思想，今天就知道了
  - label: C
    content: 別灰心喪志，失敗是成功最好的養分
  - label: D
    content: 姐姐，你真有料理天份！我看我們還是去巷口那家館子吃吧！
  lesson_raw:
    title: 母親的教誨
    basis: 引述胡適《母親的教誨》課文原句與賞析
- id: doc_113_台北_誠正_國文_g7s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: 「年輕人最怕無心之過，（ ），總在鑄下大錯之後後悔莫及，實在是不得不謹慎啊！」以上括弧空格適合填入下列何者？
  options:
  - label: A
    content: 風水輪流轉
  - label: B
    content: 一失足成千古恨
  - label: C
    content: 十年河東，十年河西
  - label: D
    content: 沒有三兩三，怎敢上梁山。
- id: doc_113_台北_誠正_國文_g7s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 1
  stem: 「為人處世，如果以嚴厲的態度□倨傲的性格對待別人，就會招致別人的怨恨，引來不滿。如此，於人於己都不利，何必呢□正所謂□利人就是利己，虧人就是虧己，容人就是容己，害人就是害己。所以說：君子以容人為上策。」根據文意脈絡，文中缺空處，依序應填入下列何組標點符號？
  options:
  - label: A
    content: ：；？
  - label: B
    content: 、？：
  - label: C
    content: ，；；
  - label: D
    content: ；、：
- id: doc_113_台北_誠正_國文_g7s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 1
  stem: 下列哪一個節日的夜晚，依琳比較可能在天空看到像「一枚又大又亮的銀幣」般的景象？
  options:
  - label: A
    content: 清明
  - label: B
    content: 端午
  - label: C
    content: 七夕
  - label: D
    content: 中秋。
  lesson_raw:
    title: 夏夜
    basis: 引用楊喚《夏夜》譬喻詩句
- id: doc_113_台北_誠正_國文_g7s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 1
  stem: 「只有綠色的小河還醒著，低聲地歌唱著溜過彎彎的小橋。」句中以小河的「動」來襯托夜的「靜」，這種意境的展現與下列何者最相近？
  options:
  - label: A
    content: 床前明月光，疑是地上霜
  - label: B
    content: 星垂平野闊，月湧大江流
  - label: C
    content: 眾鳥高飛盡，孤雲獨去閒
  - label: D
    content: 蟬噪林逾靜，鳥鳴山更幽。
  lesson_raw:
    title: 夏夜
    basis: 引用楊喚《夏夜》課文原句
- id: doc_113_台北_誠正_國文_g7s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 「娘（涼）什麼」是利用「涼」與「娘」的諧音形成的雙關修辭，下列哪一選項未運用這種技巧？
  options:
  - label: A
    content: 老闆只要在公司吹冷氣，就能坐以待幣
  - label: B
    content: 上班族薪事重重，憂鬱症患者激增
  - label: C
    content: 該向左走還是向右走，我實在為難
  - label: D
    content: 新鮮葡萄柚汁，充滿柚惑。
  lesson_raw:
    title: 母親的教誨
