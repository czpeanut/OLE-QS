- id: doc_111_彰化_福興_自然_g8s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: '鎂離子為海水中含量第二多的金屬離子，從海水中提取鎂離子為工業上製造鎂的方法之一。其步驟如下：

    步驟一：在濃縮的海水中加入氫氧化鈉，會產生氫氧化鎂而沉澱析出。

    $$\mathrm{Mg}^{2+} + 2\,\mathrm{NaOH} \longrightarrow 2\,\mathrm{Na}^{+} + \mathrm{Mg(OH)}_{2}$$

    步驟二：之後再加入鹽酸，經處理後可得到固態的氯化鎂。

    $$\mathrm{Mg(OH)}_{2} + 2\,\mathrm{HCl} \longrightarrow \mathrm{MgCl}_{2} + 2\,\mathrm{H}_{2}\mathrm{O}$$

    步驟三：電解熔融狀態的氯化鎂即可得到鎂。

    $$\mathrm{MgCl}_{2} \xrightarrow{\text{電解}} \mathrm{Mg} + \mathrm{Cl}_{2}$$

    依據上述方法，在某次製鎂的反應後，共產生鎂960公克，則該次製鎂反應中，理論上會消耗重量百分濃度為80%的鹽酸共多少公克？（鎂的原子量為24，氯化氫的分子量為36.5）'
  options:
  - label: A
    content: '1825'
  - label: B
    content: '2400'
  - label: C
    content: '2920'
  - label: D
    content: '3650'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
