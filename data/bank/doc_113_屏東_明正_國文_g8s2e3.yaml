- id: doc_113_屏東_明正_國文_g8s2e3_s3_4
  section: 3
  number: 4
  type: single
  page: 1
  stem: 【甲】懿曰：「亮平生謹慎，不曾弄險。」【乙】孔明曰：「此人料吾平生謹慎，必不弄險。」關於甲、乙兩段說法的分析，下列敘述何者正確？
  options:
  - label: A
    content: 作者以甲段為伏筆，暫時抑制眾人的疑問
  - label: B
    content: 以甲乙相同觀點， 使情節頓時又緊張起來，掀起另一波高潮
  - label: C
    content: 藉雙方觀點不謀而合，進一步說明孔明知己知彼
  - label: D
    content: 兩方說法互相呼應，呈現戰事一觸即發前的寧靜。
  lesson_raw:
    title: 空城計
    basis: 題幹引用〈空城計〉課文
- id: doc_113_屏東_明正_國文_g8s2e3_s3_5
  section: 3
  number: 5
  type: single
  page: 1
  stem: 〈管好舌頭〉一文中採用正面論述，說明管好舌頭的諸多好處，亦採反面論說，說明舌頭具有殺傷力。下列文句，何者屬於正面論述？
  options:
  - label: A
    content: 許多人倒在劍刃下，更多人則倒在舌頭下
  - label: B
    content: 舌頭有時像樊籠，一旦放語言的猛獸出柙，想捉拿回來極不容易
  - label: C
    content: 蘇秦、張儀、范雎，這些叱吒風雲、縱橫捭闔的人，全靠三寸不爛之舌
  - label: D
    content: 只有傻瓜才覺得說話最容易不過，自以為巧舌如簧，大逞辯才，滔滔不絕。
  lesson_raw:
    title: 管好舌頭
    basis: 題幹提及篇名〈管好舌頭〉
- id: doc_113_屏東_明正_國文_g8s2e3_s3_6
  section: 3
  number: 6
  type: single
  page: 1
  stem: 「舌頭常常是表現自己最赤裸的履歷表」，有關此句的理解，下列何者正確？
  options:
  - label: A
    content: 口才的好壞影響到一個人升遷的機運
  - label: B
    content: 從一個人的談吐可顯現其品格與教養
  - label: C
    content: 勇於展現口才的人，能為自己爭取好機會
  - label: D
    content: 從說話的內容最能看出一個人學歷的高低。
  lesson_raw:
    title: 管好舌頭
    basis: 題幹引用〈管好舌頭〉課文
