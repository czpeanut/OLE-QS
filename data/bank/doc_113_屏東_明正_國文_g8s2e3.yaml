  section: 3
  number: 9
  type: single
  page: 1
  stem: 科幻小說是以現有的科技資料為根據，對未來世界或過去情景作幻想式的描述。以下何者符合「科幻小說」的特性？
  options:
  - label: A
    content: 好多犯人都說自己是清白無辜的，法庭上的任何人誰也沒有把他的話聽進去
  - label: B
    content: 王達成的腦部也挨了一刀，經過改造整治，換了另一種完全是慈善家的性格
  - label: C
    content: 「你可以變得更聰明，你可以打敗深藍唷！」他悄悄在我耳邊說了幾句話
  - label: D
    content: 全世界的媒體和科學家多少年前就發出驚人的警告和疑問，難道即將成為事實。
