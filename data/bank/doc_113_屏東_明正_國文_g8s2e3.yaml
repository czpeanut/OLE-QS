- id: doc_113_屏東_明正_國文_g8s2e3_s4_3
  section: 4
  number: 3
  type: single
  page: 4
  stem: 下列對甲乙兩文寫作手法的敘述，何者正確？
  options:
  - label: A
    content: 兩文皆採第一人稱立場敘寫
  - label: B
    content: 甲文善用象徵與譬喻，乙文則採用對比與擬人
  - label: C
    content: 甲乙兩文皆大量引用成語與古典詩詞，增添典雅氛圍
  - label: D
    content: 甲文著重漁村景物的摹寫，乙文則採用擬人化描寫漁村的變遷。
  group_stem: '【甲】

    不久前曾經和一位老船長聊天，談到漁獲現況種種。老船長嘆了口氣回答說：「現在的魚仔，連談戀愛的機會都沒有。」……

    老船長沿海浪濤裡打滾四、五十年，他見證了臺灣沿岸海域數十年來海洋生命的枯榮過程，我能感受他幽默背後的沉重和沉痛。

    臺灣沿岸海域曾經是漁產富饒之鄉，為何短短才幾十年，我們已經走到了無魚可捕的枯竭窘境？相當貼切的形容，老船長說出了魚源枯竭的主要原因之一……我們是吃了太多的魩仔魚。……

    根據一份研究報告指出，魩仔魚是兩百多種魚類幼苗的統稱，牠們是海洋魚種數量及海洋食物鏈的基礎。我們的海域若是失去了這個基礎，研究報告中已清楚的指出後果——這樣的捕撈情況若是不加以管理和改善的話，最後，可能導致整個沿岸漁業的滅亡。

    照理說，魩仔魚除了是多種魚類的數量基礎，同時牠們也是多種魚類願意靠岸覓食的主要原因。魩仔魚的確是種重要的食物，是許多種魚類賴以生存的重要食物，但絕不是我們賴以生存的重要食物。

    我們曉得，沒有小魚就沒有大魚的簡單道理。而我們吃魩仔魚竟然吃了一百多年，那樣無骨、無刺，糊裡糊塗的吃掉了我們的海洋生機。

    日本人發明魩仔魚雙拖網漁具後，很快的，日本漁業當局了解這是一種嚴重破壞沿岸魚類資源的不當作業，因此，日本早已停止使用魩仔魚雙拖網作業。臺灣在一九七七年間大量從日本引進他們已經禁止使用的漁網漁具及捕撈技術，並在我們的沿岸海域如火如荼地展開魩仔魚捕撈；並且，還將魩仔魚大量外銷到日本。

    從沿岸漁撈統計資料不難分析解讀出，自一九七七年後，我們的沿岸漁獲量直線下墜。從此，臺灣沿海再也沒有春天。

    魩仔魚雙拖網作業效率高，撈獲量大，網袋網目僅 1.4 mm，也就是我們家裡紗窗網目的大小。研究報告清楚指出，自一九七七年後，臺灣沿岸漁村已經起了生態性的變化：一、沿岸漁場消失，二、沿岸漁村經濟衰退，三、漁民間因資源掠奪性漁法的介入而糾紛不斷。捕不到魚，漁民無以為生，終至鋌而走險走私違禁品戕害臺灣社會。(廖鴻基〈拒吃魩仔魚〉)

    【乙】

    鬼頭刀是少數兩性表徵明顯的魚類，公魚額頭高聳如崖壁，就像頭上頂著一把劈水的刀斧，像公牛隆起的肩或雄獅威風的鬃鬣及吼叫。母魚全身體型修長圓潤，連眼神都帶著幾許溫柔。「鬼頭刀」這樣的名稱似乎是來自公魚的威容，漁人又稱牠為「飛魚虎」，從「鬼」、「刀」、「虎」這三個字就足以形容鬼頭刀在漁人眼中是如此神祕、銳利及凶猛。

    同樣時間、同樣地點、同樣場景，船尾的魚線再度被拉成筆直。大約在船後一百米處中鉤的鬼頭刀不斷的翻躍到空中，重重的摔滾在水面上。我用興奮得幾乎顫抖的聲音，呼喊海湧伯放慢船速，多日來等待的抑鬱都在中魚的瞬間明朗起來。如同長久沉浸的幻影中那般熟練的姿態，我雙膝頂住船尾板，手中緊緊的握住魚線。心裡充滿自信的告訴自己：「決戰的時刻終於來了。」

    ……

    並沒有放鬆我收線的手，再拉進了將近三十米線。兩隻鬼頭刀一起躍起，一起摔下，一起游在水裡。這樣的距離已經可以確定，中鉤的只有一隻，而另一隻是自由的。為什麼會這樣呢？第二個問號重重的打進我的意志中。

    再拉近十多米，這場鬥爭似乎已接近尾聲。現在，我可以清楚看到，看到中鉤的是一隻母魚，而陪她一起摔滾的是一隻公魚。母魚游向左方，公魚也貼著身游向左邊，那親密的距離彷彿是在耳邊叮嚀，在耳邊安慰。尤其當我看到那公魚的眼神，不再是記憶中的倨傲從容，而是無限的悲傷、痛苦或者柔情。那眼神說話了：「讓我來分擔妳的痛苦，我願意與妳同生共死陪伴妳到永遠。」牠們背上的藍色光點一起躍進我的眼裡，竟然是那般的刺眼、光亮。

    海湧伯似乎察覺到了我逐漸鬆垮的臂膀，不知什麼時候已站立在我的身旁。我感覺到他在我的耳邊說：「眼睛閉起來吧！如果當做是一場戰爭，就該忘掉眼淚……。」

    高傲美麗而且多情的鬼頭刀啊！如果是岸上的鬥爭我絕不遲疑，因為在岸上的世界，溫情就是懦弱就是包袱。但，我心裡的這片海原本多情，為這美麗的魚和這美麗的情意，這場景畢竟人間少見，我捨不得閉眼。

    (廖鴻基〈鬼頭刀〉)'
