- id: doc_113_屏東_明正_國文_g8s2e3_s4_11
  section: 4
  number: 11
  type: single
  page: 5
  stem: 關於甲、乙兩文的內容，下列說明何者最不恰當？
  options:
  - label: A
    content: 甲文比較柳開、張景才華的高下
  - label: B
    content: 乙文敘述張景投靠柳開後的際遇
  - label: C
    content: 兩文皆凸顯柳開自大的形象
  - label: D
    content: 兩文皆肯定張景不凡的文才。
  group_stem: '【甲】

    柳開少好任氣，大言凌物①。應舉時，以文章投於主考簾前，凡千軸，載以獨輪車。引試②日，自擁車入，欲以此駭眾取名。其時張景能文有名，唯袖一書簾前獻之。主考大稱賞，擢景優等。時人為之語曰：「柳開千軸，不如張景一書。」
    (改寫自沈括《夢溪筆談》)

    【乙】

    張景，字晦之，江陵 公安人。幼能長言，嗜學尤力。貧不治產，往從柳開。開以文自名，而薦寵士類，一見歡甚，悉出家書予之，由是屬辭益有法度。開每曰：「今朝中之士，誰踰晦之者！」即厚饋，使如京師。後中進士。
    (改寫自宋祁〈故大理評事張公③墓誌銘④〉)

