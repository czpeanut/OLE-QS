  type: single
  page: 1
  stem: '下列對於弦心距的敘述：

    (甲) 一弦的弦心距必平分此弦

    (乙) 弦的垂直平分線必經過圓心

    (丙) 同一圓中，較長的弦其弦心距較大

    (丁) 連接圓心與弦的中點之線段必垂直此弦

    則正確的敘述有多少個？'
