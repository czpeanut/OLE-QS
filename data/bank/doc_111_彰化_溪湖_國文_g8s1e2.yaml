- id: doc_111_彰化_溪湖_國文_g8s1e2_s4_34
  section: 4
  number: 34
  type: single
  page: 4
  stem: 關於這則網路新聞查核案件，下列何者是攝影師貝亞特澄清的事實？
  options:
  - label: A
    content: 海豹為拯救海龜而咬斷釣魚線
  - label: B
    content: 海豹對海龜的擁抱是一種騷擾
  - label: C
    content: 海龜救援海豹的舉動吸引了攝影師
  - label: D
    content: 海龜為了躲避海豹而被釣魚線纏繞
  group_stem: '| 網路新聞查核案件 |

    | :--- |

    | **海龜被魚線纏繞 海豹抱著牠助脫困**<br>一隻海龜在夏威夷海岸被魚線纏住，幸好一隻海豹發現，牠從後面抱著海龜，試著用嘴巴協助海龜解開束縛，這溫馨的過程被攝影師貝亞特即時捕捉。
    |

    | **查核結果**<br>以上報導引起廣泛的關注，然而，攝影師貝亞特出面澄清：剪斷海龜頭部釣魚線的並非是海豹，而是攝影師團隊。海龜遭到釣魚線纏繞掙脫的動作吸引了海豹，而海豹不是為了救援，才抱著海龜。再從翻譯的內容來看，貝亞特的部落格原文描述海豹的「擁抱」是「騷擾」的不當行為，但是，臺灣新聞媒體卻忽略及美化了該行為，也捏造原文並未描述的事實。
    |


    媒體新聞查核分類表

