  page: 1
  stem: 日常用語中，我們常藉動物、昆蟲的特性來表達某種特殊涵義，如「鷹派」形容主張採取強勢手段的人士、團體，「鴿派」則是形容主張採取柔性溫和手段的人士或團體。下列各句「
