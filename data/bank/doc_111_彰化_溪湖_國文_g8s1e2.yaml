  section: 3
  number: 5
  type: single
  page: 1
  stem: 鳥全文主要表達對鳥的憐愛之情，下列何者無法呈現此旨意？
  options:
  - label: A
    content: 鳶鷹啾啾地叫著，在天空盤旋，也有令人喜悅的一種雄姿
  - label: B
    content: 鳥囀清脆嘹亮，有時是獨奏，有時是合唱，簡直是一派和諧的交響樂
  - label: C
    content: 鳥的身軀玲瓏飽滿，細瘦而不乾癟，豐腴而不臃腫，真是減一分則太瘦，增一分則太肥那樣地穠纖合度
  - label: D
    content: 黃昏時偶爾還聽見寒鴉在古木上鼓噪，入夜也還能聽見鴟梟的怪叫。
