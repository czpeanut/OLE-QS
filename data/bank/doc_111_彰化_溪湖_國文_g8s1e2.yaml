- id: doc_111_彰化_溪湖_國文_g8s1e2_s3_4
  section: 3
  number: 4
  type: single
  page: 1
  stem: 森林最優美的一天：「只有像我這樣深入、珍惜大自然的人，才會受到邀請，才能找到這條美麗的祕徑。」此段話的寓意為何？
  options:
  - label: A
    content: 自然界蘊藏治療一切疾病的祕訣
  - label: B
    content: 大自然充滿使人心平氣和的能量
  - label: C
    content: 入山次數多，受自然歡迎的程度也加倍
  - label: D
    content: 有心探索自然，才能獲得特殊的美感體驗。
  lesson_raw:
    title: 森林最優美的一天
    basis: 引用徐仁修〈森林最優美的一天〉課文原句
