  stem: 「空中沒有一絲風，海面平靜得連一道□□都沒有。時間一小時一小時過去，你窮極無聊，竟陷入近似昏迷的冷漠狀態。緊接著海洋波濤起伏，你像挨了一鞭，感官紛紛□□，各種情緒奔騰翻攪。但這兩種感受之間並不涇渭分明。」根據文意脈絡，空格處依序填入下列何者最恰當？
