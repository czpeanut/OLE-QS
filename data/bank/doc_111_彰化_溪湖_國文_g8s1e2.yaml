- id: doc_111_彰化_溪湖_國文_g8s1e2_s4_32
  section: 4
  number: 32
  type: single
  page: 4
  stem: 下列何者是兩文都直接描寫的內容？
  options:
  - label: A
    content: 鳥聲的啁啾
  - label: B
    content: 鳥羽的斑斕
  - label: C
    content: 鳥在籠中的苦狀
  - label: D
    content: 作者養鳥的方法
  group_stem: '【甲】平生不喜籠中養鳥，而予又未嘗不愛鳥，但養之有道耳。欲養鳥莫如多種樹，使繞屋數百株，扶疏茂密，為鳥國鳥家。將旦時，睡夢初醒，尚輾轉在被，聽一片啁啾，如雲門、咸池①之奏。及披衣而起，頮面②、漱口、啜茗，見其揚翬振彩③，倏往倏來，目不暇給，固非一籠一羽之樂而已。大率平生樂處，欲以天地為囿，江漢為池，各適其天，斯為大快。比之盆魚籠鳥，其鉅細仁忍何如也！（改寫自鄭燮
    濰縣署中與舍弟墨第二書信後又附一紙）

    註：①雲門、咸池：黃帝以下六代的古樂。 ②頮面：洗臉。頮，音ㄏㄨㄟˋ。

    ③揚翬振彩：張開五彩繽紛的翅膀飛行。翬，音ㄏㄨㄟ。


    【乙】我愛鳥。

    從前我常見提籠架鳥的人，清早在街上蹓躂。我感覺興味的不是那人的悠閒，卻是那鳥的苦悶。胳膊上架著的鷹，有時頭上蒙著一塊皮子，羽翮不整地蜷伏著不動，哪裡有半點瞵視昂藏的神氣？籠子裡的鳥更不用說，常年的關在柵欄裡，飲啄倒是方便，冬天還有遮風的棉罩，十分地「優待」，但是如果想要「搏扶搖而直上」，便要撞頭碰壁。鳥到了這種地步，我想牠的苦悶，大概是僅次於黏在膠紙上的蒼蠅；牠的快樂，大概是僅優於在標本室裡住著罷？

    我開始欣賞鳥，是在四川。黎明時，窗外是一片鳥囀，不是吱吱喳喳的麻雀，不是呱呱噪啼的烏鴉，那一片聲音是清脆的，是嘹亮的。有的一聲長叫，包括著六七個音階；有的只是一個聲音，圓潤而不覺其單調；有時是獨奏，有時是合唱，簡直是一派和諧的交響樂。（梁實秋
    鳥）'
  tags:
    textbook: 八上 第六課 鳥
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 八上
