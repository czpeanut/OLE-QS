  group_stem: '(7~9)

    Heman Bekele was a curious boy. When he was 7, he liked to mix soap and water.
    He called them "potions". He wanted to see what would happen.One Christmas, he
    got a science set. He learned some powders can get hot. He thought, “Maybe I can
    help people!”


    Now, Heman is 15. He makes a special soap. It helps people with skin cancer. Skin
    cancer hurts your skin from too much sun. Heman puts medicine in the soap, but
    the water washes it away! So, he uses tiny balls to keep the medicine on the skin.Vito,
    a scientist, lets him work in his lab. Now, they are testing the soap on mice.
    Heman says, “Keep thinking of new ideas to help the world!”


    That is why Heman was TIME Magazine’s Kid of the Year in 2024.


