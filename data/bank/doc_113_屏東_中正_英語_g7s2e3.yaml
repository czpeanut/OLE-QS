  group_stem: '(4~6)

    Many plants have roots. Some roots are food. Carrots and potatoes are root vegetables.
    Yams are big root vegetables!


    In India, some indigenous women are helping yams. A long time ago, people ate
    yams every day. They cooked them in many ways. Now, they eat more rice and bread.
    They don’t eat yams much.


    The women wanted people to love yams again. They found 180 kinds of root vegetables
    and grew them. It was not easy. The women dug the ground all day. They used tools
    and their hands. Some yams were giant, even taller than the women! Monkeys and
    elephants ate the plants. Too much rain or sun were bad for the plants too. But
    the women didn’t stop.


    Every year, there is a big festival. It is about local vegetables.The women show
    people their yams. They are saving yams for the future!


