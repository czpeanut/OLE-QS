- id: doc_113_高雄_光華_社會_g9s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 請問，關於此地區的白銀流往中國的敘述，哪些是正確的？(甲)明帝國以白銀取代因濫發而嚴重貶值的紙幣 (乙)因此地白銀大量流往中國，使中國政府開始在泉州、廣州等地設市舶司管理
    (丙)此地白銀大量流入中國後，19 世紀又因英商積極銷售鴉片，使中國白銀大量外流 (丁)鄭和下西洋，成功宣揚國威，與此地白銀流往中國有直接關係。
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙丙
  - label: C
    content: 甲丙
  - label: D
