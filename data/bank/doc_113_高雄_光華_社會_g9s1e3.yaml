    content: 小懿：「政府的行政權、立法權和司法權應該分立，發揮彼此制衡的功能，以避免專制獨裁的發生。」
  - label: B
    content: 小華：「質疑教會的權威，抨擊教會的腐敗與迷信，主張信仰與言論自由。」
  - label: C
    content: 小天：「人生而自由，人民是國家的主體，政府必須替大眾謀福利，以『公共意志』作為立法的依據。」
  - label: D
    content: 小雨：「人生而平等，生命、自由、財產是不可被剝奪的權利，如果政府非法破壞人民權利，人民可以起而反抗。」
