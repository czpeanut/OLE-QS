    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 己
  group_stem: 你知道「漢堡美味優化工程」嗎？某速食店透過牛肉、麵包、生菜、起司片、醬汁比例等細節調整，推出升級版的牛肉漢堡帶給民眾全新的體驗。標榜麵包採用來自北美洲的麵團原料、配方與製程，帶來蓬鬆軟彈的口感；生菜則是選用進口的有機蔬菜—萵苣、洋蔥、牛番茄；還有來自美國進口的乳酪起司片，經講究的發酵、凝乳、乳清排除等製程，完美的在夾入漢堡後能呈現微融化的最佳狀態；此外牛絞肉排的製成也不能馬虎，按照不同產季時間分別從北美、南美進口肉品，在特定的黃金比例下揉攪漢堡排，讓肉與脂肪完美揉合，並經特定的煎板間距設計，讓牛肉排的煎烤過程保有呼吸空間，釋放天然油脂、鮮度風味，完成後大口咬下時就會品嚐到有
    彈性的牛肉美味……
