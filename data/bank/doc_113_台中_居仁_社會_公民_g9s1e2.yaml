    \    此外特別的是，荷蘭的農業有部分是利用中介貿易，亦即並非直接種植和出口農產品，而是從其他國家進口農產品之後，進行分類和加工，再出口給需要的國家。其中代表性例子是「可可豆」。荷蘭是世界第二大的「可可豆加工」出口國，然而實際上荷蘭甚至連1\
    \ 噸都沒有自產，完全仰賴向其他國家購買。數據顯示，2019 年荷蘭成為全球「可可豆」的最大購買國家，其中有四分之三的可可豆會加工製成可可粉和可可脂再販售到其他國家。"
