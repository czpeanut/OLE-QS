    \ 萬位的付費訂閱者，訂閱總數增加至 2.7 億。同時Netflix 近期在美國推出「低價有廣告版」的方案，月費比其他「無廣告版」的訂閱方案更加優惠，但會員在收看時必須強迫收看廣告。報導指出廣告版方案推出後，此方案的訂戶也出現爆炸性成長。\n\
    \    此外Netflix 近日宣布調漲台灣的會員訂閱價格，漲幅最高達18%。面對網友的質疑及退訂的負面聲浪，Netflix 強調：「將持續提供精彩的新節目和新電影，證明Netflix\
    \ 仍是值得用戶訂閱的平台。」不過Netflix 無預警的漲價決策，確實讓部分消費者開始思考其他的選擇。\n    現今台灣串流影音市場熱鬧非凡，美系、陸系、本土影音平台百花齊放，甚至美國的華納兄弟探索集團旗下的Max\
    \ 更將在11 月19 日登台。關於Max 定價的完整細節還未公開，通常該價格會隨著國家、地區及供應商而異。不過有媒體分析指出：『影音平台的決戰關鍵還是在於影音的品質與內容的獨家性。』"
