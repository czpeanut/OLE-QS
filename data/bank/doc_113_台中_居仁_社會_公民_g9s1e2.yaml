  stem: 35. 某日A 外送公司宣布有意收購B、C 的外送公司，假若此併購案成功，A 外送公司的市佔率將高達近八成，引起各界的擔憂。請問若此情況發生在我國，下列哪一項說明最為正確？
  options:
  - label: A
    content: 併購後，更能確保消費者的權益
  - label: B
    content: 併購後，可望增加消費者的購買意願
  - label: C
    content: 併購後，會削弱A 外送公司在價格上的主導權
  - label: D
    content: 併購前，須先交付公平交易委員會審查。
  group_stem: "【五】\n  近幾年「餐飲外送平台」替消費者整合各式店家，提供外送服務，消費者可以直接在 App 中瀏覽餐廳、選擇餐點，如此便利的服務在全球開枝展葉，擴張到世界各個城市，路上隨處可見各家的外送員在送餐。附表是網路整理的四個外送平台的優點比較。\n\
    \n| 外送平台 | 優點 |\n| :--- | :--- |\n| A 平台 | 平日選購生鮮商品享9 折優惠 |\n| B 平台 | 與更多的高級餐廳合作\
    \ |\n| C 平台 | 提供代買代排的服務 |\n| D 平台 | 經常贈送各類餐點的折價券 |"
