  stem: 36. 「楓糖鬆餅漢堡」於早餐時段販賣，網友早起排隊搶購，請問關於這種資源分配方式的敘述何者正確？
  options:
  - label: A
    content: 只要願意付出時間成本，就有機會取得資源
  - label: B
    content: 讓資源有效率的使用
  - label: C
    content: 讓所有民眾都有相同的取得機會
  - label: D
    content: 輪到者不一定有需求，導致資源未被充分利用。
  group_stem: "【六】\n    麥當勞「楓糖鬆餅漢堡」在台灣開賣，販賣日期自11/13 至12/17，獨特新穎的口味吸引許多民眾早起前去搶購，幾乎每間麥當勞都光速售完，讓不少人排隊卻撲空。\n\
    \   不過有網友計算，麥當勞稱從日本一次進口70 萬顆厚鬆餅堡，等於一間店僅配額1750 顆，依照需求量來算，約3.5 天就會售罄，根本不可能賣到35 天，質疑麥當勞是故意在飢餓行銷。但也有網友認為，麥當勞訂定厚鬆餅堡的進貨數量，是為了在不確定消費者對新商品的反應下，避免產品出現過剩的狀況。\n\
    ※「飢餓行銷」：指生產者刻意營造產品的稀有性，來刺激消費者的購買欲望，以增加獲利。"
