  page: 1
  stem: 1. 公民老師上課時，在探討某兩項因素之間的關係，強調在其他條件不變的情形下，這兩項因素互相呈現「反向變動」的關係，請問由此推斷，公民老師最有可能在說明哪兩項因素？
  options:
  - label: A
    content: 廠商數量與廠商控制價格的能力
  - label: B
    content: 市場競爭程度與廠商數量
  - label: C
    content: 商品價格與供給量
  - label: D
    content: 所得與消費者的購買意願。
- id: doc_113_台中_居仁_社會_公民_g9s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '2. 小能與小耐都在威猛清潔公司工作，兩人為一組，一起為同一位客戶提供居家清潔的服務。右表為兩人在擁有相同資源與投入相同時間下，分別能完成的工作量。請問身為威猛清潔公司的主管，應如何分配兩人的工作以提升服務效率？


    | 項目 | 小能 | 小耐 |

    | :--- | :---: | :---: |

    | 清潔窗戶(扇/時) | 3 | 6 |

    | 清潔地板(坪/時) | 10 | 14 |'
  options:
  - label: A
    content: 小能與小耐一起清潔窗戶與地板
  - label: B
    content: 將小能調至別組，由小耐獨立完成即可
  - label: C
    content: 小耐在旁指導小能，訓練小能的清潔能力
  - label: D
    content: 小耐專責清潔窗戶，小能專責清潔地板。
- id: doc_113_台中_居仁_社會_公民_g9s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 3. 新竹市的城隍廟埕內有17 家小吃攤商，為了因應成本調漲，在去年貼出聯合漲價的公告：「所有品項全面漲價5 元」，此行為遭民眾投訴。政府機關調查後指出，17
    家攤商的行為已違反《甲法》對聯合漲價行為的禁止規定，但考量攤商經營不易且已撤除公告，故僅予以警示並未開罰。根據上文內容，下列敘述何者正確？
  options:
  - label: A
    content: 攤商無法基於自家成本調漲各自的訂價
  - label: B
    content: 《甲法》應為消費者保護法
  - label: C
    content: 政府機關應為新竹市設的公平交易委員會
  - label: D
    content: 《甲法》主要針對廠商之間的競爭關係。
- id: doc_113_台中_居仁_社會_公民_g9s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '4. 大紅想開一間雞蛋糕專賣店，他評估三種生產策略的收支情況，如下表所示。若僅考量銷貨收入：

    大紅採行「A 策略」的機會成本是「B 策略」的方案；而若採行「B 策略」的機會成本是「維持現狀」的方案，根據上述內容判斷，表中「★」處的數值，最可能為下列何者？


    | 營運策略 | 商品價格(元/個) | 銷售數量(個/月) |

    | :--- | :---: | :---: |

    | A 策略 | 100 | 150 |

    | B 策略 | 120 | 130 |

    | 維持現狀 | 110 | ★ |'
  options:
  - label: A
    content: '140'
  - label: B
    content: '130'
  - label: C
    content: '120'
  - label: D
    content: 150。
- id: doc_113_台中_居仁_社會_公民_g9s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 5. 報導指出：近幾年在中國竄紅的「手鏟提拉米蘇」，因為成本低廉且製作快速，被大批攤商選作出攤商品，小紅書上也出現多部第一視角的「手鏟影片」，美觀又口味豐富的提拉米蘇，與老闆重複一致的切割動作，吸引許多網友觀看，並激起民眾的購買欲望。不少攤販表示每天的業績都相當不錯，攤位前也總是排滿人潮。請問根據上文的內容，下列敘述何者最正確？
  options:
  - label: A
    content: 文中的攤位是屬於無形市場
  - label: B
    content: 愈多攤商看準商機販賣「手鏟提拉米蘇」，此符合供給法則的概念
  - label: C
    content: 提拉米蘇攤位為商品市場，攤販則為生產者
  - label: D
    content: 攤商主要以價格競爭的方式來增加銷售量。
- id: doc_113_台中_居仁_社會_公民_g9s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 6. 「小雞上工」APP 是現在全台最大的打工兼職媒合平台，目前每月上架的職缺超過 6000 筆，主打能成功媒合8 成的短期職缺，甚至能讓職缺僅開1
    天就徵到人。由此可知，若依交易的對象與內容來區分，「小雞上工」應為下列何種市場？
  options:
  - label: A
    content: 商品市場
  - label: B
    content: 勞動市場
  - label: C
    content: 無形市場
  - label: D
    content: 有形市場。
- id: doc_113_台中_居仁_社會_公民_g9s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 7. 根據我國法律規定，消費者網購商品具有七天猶豫期的保障。然而這規範並非適用所有的商品或服務，請問下列何種商品不適用七天猶豫期的保障？
  options:
  - label: A
    content: 奶油蛋糕
  - label: B
    content: 精品皮包
  - label: C
