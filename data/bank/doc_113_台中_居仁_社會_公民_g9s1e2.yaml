- id: doc_113_台中_居仁_社會_公民_g9s1e2_s2_21
  section: 2
  number: 21
  type: single
  page: 3
  stem: 21. 依據文章第一段的內容判斷，下列針對荷蘭與德國在生產農產品上的分析，何者敘述最適當？
  options:
  - label: A
    content: 德國對荷蘭農產品的貿易支出大於貿易收入
  - label: B
    content: 德國的農業在全球市場上不具有競爭優勢
  - label: C
    content: 德國在生產農產品的機會成本較荷蘭低
  - label: D
    content: 德國的農產品都仰賴於進口。
  group_stem: "【三】\n    荷蘭的土地面積僅比台灣大些，人口僅有1700 多萬人，卻是僅次於美國的世界第二大農產品出口國，以及全球最大的花卉出口國。多年來荷蘭農產品出口總額一直高於進口總額，其中荷蘭是全球第一大洋蔥出口國，與第二大番茄出口國。而德國則是荷蘭農產品的第一大出口國，佔荷蘭總出口的四分之一。\n\
    \    而荷蘭站穩農產品的〔甲〕市場，憑藉的是將科技與創新引入農業生產，追求產量極大化、〔乙〕極小化，靠低價取勝。不過也有德國人打趣說，荷蘭番茄最適合的用法是拿去當網球打，因為其口感與粗糙的品質也是「另類的口碑」。\n\
    \    此外特別的是，荷蘭的農業有部分是利用中介貿易，亦即並非直接種植和出口農產品，而是從其他國家進口農產品之後，進行分類和加工，再出口給需要的國家。其中代表性例子是「可可豆」。荷蘭是世界第二大的「可可豆加工」出口國，然而實際上荷蘭甚至連1\
    \ 噸都沒有自產，完全仰賴向其他國家購買。數據顯示，2019 年荷蘭成為全球「可可豆」的最大購買國家，其中有四分之三的可可豆會加工製成可可粉和可可脂再販售到其他國家。"
