- id: doc_113_台中_居仁_社會_公民_g9s1e2_s2_10
  section: 2
  number: 10
  type: single
  page: 2
  stem: '10. 國內對牡蠣的供需關係，與生產牡蠣的機會成本狀況如右表所示。根據文中我國牡蠣在市場上的現況來判斷，對應右表我國的牡蠣產業最有可能是在哪個位置？


    | 牡蠣產業 | 國內需求量較大 | 國內供給量較大 |

    | :--- | :---: | :---: |

    | 生產成本較高 | 甲 | 丙 |

    | 生產成本較低 | 乙 | 丁 |'
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
  group_stem: "【一】\n    我國市場對牡蠣需求逐年增加，但受到氣候限制、養殖業缺工，進口牡蠣搶市等因素，我國牡蠣的年產量從2017 年至今，已減少約4\
    \ 分之1。越南則因人力工資比台灣低廉，海水溫度也適合牡蠣生長，以及天災受損頻率較低，故在產量、品質與價格上都具有競爭力，近年我國進口牡蠣就以越南為最大宗，且數量持續增加。面對進口牡蠣的威脅，以及國產牡蠣滯銷的問題，蚵農也向政府陳情，希望政府重視並提供協助。"
