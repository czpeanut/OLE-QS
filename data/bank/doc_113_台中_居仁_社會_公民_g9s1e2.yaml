  stem: '26. 請問Disney+與迪士尼主題樂園的市場類型，對應右表內容，這兩者的市場類型分別為何？


    | 類型 | 有形市場 | 無形市場 |

    | :--- | :---: | :---: |

    | 商品市場 | 甲 | 乙 |

    | 勞動市場 | 丙 | 丁 |'
  options:
  - label: A
    content: Disney+：乙、主題樂園：甲
  - label: B
    content: Disney+：甲、主題樂園：乙
  - label: C
    content: Disney+：丙、主題樂園：丁
  - label: D
    content: Disney+：乙、主題樂園：丙
  group_stem: "【四】\n    自從迪士尼將重心擺在Disney+影音串流平台的服務後，迪士尼電視頻道與旗下包含衛視中文台、衛視電影台、國家地理頻道等11\
    \ 個頻道於去年底正式退出台灣，有產業人士示警：「迪士尼的離開，意味傳統電視台正在消逝，而串流平台Netflix、Disney+都是投資節目居多，很少自己培養影視團隊，如果頻道一家一家關閉、退出台灣市場，不只是現有員工面臨裁員的危機，未來念傳播科系的學生也將找不到工作。」\n\
    \    今年8 月迪士尼公布財報，Disney+等旗下的線上影音串流媒體於今年創造4700 萬美元的季度運營收入，且利潤首次達「轉虧為盈」；然而一向是迪士尼金雞母的迪士尼主題樂園卻表現的不夠亮眼，美國國內的迪士尼主題樂園營運收入下滑6%；國際主題樂園(如上海、日本迪士尼樂園)僅成長2%。迪士尼高層指出：『樂園新設施和新技術投入也壓縮了利潤』。"
