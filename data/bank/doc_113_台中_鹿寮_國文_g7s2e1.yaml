  group_stem: '讀了學生的文章才知道，他們這個世代流行大帳號、小帳號的切換，不同帳號呈現的溝通狀態多有不同。可以刻意讓人知道，也可以不讓其他任何人知道。大帳、小帳甚至小小帳的使用者，一定會意識到讀者的存在（可能讀者只有自己），並且區分每一種書寫的意圖。每一次登入，每一個帳號的選擇以及使用，都具有強烈的暗示作用：觀看的視角、沉默或發聲、說話的方式，都是由我自己決定的。對我來說，網路世界是一層一層迷霧，其中有一些遮蔽，也有一些事實的顯影。

