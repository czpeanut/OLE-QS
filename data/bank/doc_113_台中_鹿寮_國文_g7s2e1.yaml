  stem: 根據本文，下列關於非洲草原上的獅子與長頸鹿的描述，何者最正確？
  options:
  - label: A
    content: 長頸鹿平均睡眠時間比肉食性動物獅子更短。
  - label: B
    content: 獅、豹等天敵環伺，造成長頸鹿面臨絕種危機。
  - label: C
    content: 獅子天生耐餓而且懶得獵食，故能陷入長眠。
  - label: D
    content: 長頸鹿因為覓食容易，養成長時間貪睡習性。
  group_stem: '「只睡三分鐘！」這位幹練的黑人嚮導說，長頸鹿的每次睡眠時間非常短，而且是站著睡覺。我以為聽錯，不可置信地再問一次，嚮導解釋：「哪一隻白目的長頸鹿膽敢深睡，就算備長眠吧。」在物競天擇的萬年演化，在獅子、豹子環伺的非洲叢林裡，敢大搖大擺睡覺的長頸鹿已變成獅子的腹中物。

    　　要在非洲活下來，目前數量超過十萬隻的長頸鹿，已練就了多項本事。

    　　相較之下，獅子每天能睡十五至二十個小時，三分之二的時間都在睡覺，沒人能拿牠如何。這就是叢林法則。如果你無法成為叢林之王，就是要永不鬆懈的長頸鹿。很嚴酷，你只有三分鐘睡眠，完全沒有貪睡的權利，貪睡的下場，就是出局。在大自然，不只長頸鹿，草食性動物的平均睡眠時間都比肉食性動物短。

    　　職場與商場上，不也是如此。生命原本就是一個選擇，當獅子未必好，當長頸鹿未必差，只要一切恰如其分。想擁有權力、想主導棋局的獅子，能力就要相當，也要願意承擔。人生最可怕的是，錯置。所謂錯置，就是搞不清楚自己是誰或想成為什麼樣的人，沒有獅子的能力、地位，卻想過獅子的生活。

    　　獅子有獅子的得失，何必羨慕牠一天可睡十五小時？有人想當叢林之王，碰到獵物（問題）卻搞不定。相對的，我也看過很多平凡但可愛的小人物，認分與踏實，當一隻長頸鹿就像長頸鹿。

    節選自王文靜 沒有大學文憑的日子，我說故事'
