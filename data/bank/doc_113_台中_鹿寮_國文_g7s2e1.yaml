  group_stem: '國際臉部平權聯盟在二〇一八年十一月五日由英國、臺灣陽光基金會等團體共同發起，邀請世界各地的顏面損傷服務機構，共同推動「臉部平權」運動。

    　　根據陽光基金會的調查顯示：1.每八個人就了一個人曾因外貌遭受不友善的對待。2.有身體特徵困擾者遭受不友善對待的比例，明顯高於無身體特徵困擾者。3.國高中時期最常因為外貌被取綽號，且有二分之一產生自信心受損等負面影響。4.社會大眾對於顏損者持較偏向負面的刻板印象，如自卑、缺陷、孤僻、墮落；對非顏損者則是持較偏向正面的評價，如自信、吸引人、隨和、成功。

    　　外表長相的差異，可能影響人生的際遇，如長相漂亮的往往受歡迎，外貌與人不同或弱小者卻常常受到霸凌或暴力。當我們尊重多元、包容不同、不以貌取人，這些憾事與傷害都將不復存在。只要多一點關心、多一點行動，你會看見改變的力量。我們都一樣，都需要友善的對待，都不希望因外貌被取笑；都需要公平的機會，都不希望因為外貌被歧視。

