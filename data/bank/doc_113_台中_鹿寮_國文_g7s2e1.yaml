- id: doc_113_台中_鹿寮_國文_g7s2e1_s2_36
  section: 2
  number: 36
  type: single
  page: 4
  stem: 根據本文，下列何者<u>並非</u>文中可得知的訊息？
  options:
  - label: A
    content: 扯鈴的文獻記載。
  - label: B
    content: 扯鈴的外型與材質。
  - label: C
    content: 扯鈴在各地的別稱。
  - label: D
    content: 扯鈴的發明的年代。
  group_stem: '扯鈴，是長期流傳於民間的一種民俗技藝，其基本形狀由兩個有孔的圓形竹盒或木盒，連結著一個短軸，以繩線纏繞後使其轉動。因兩側有孔，旋轉時空氣進入造成聲響，因扯鈴大小而有高低音頻，故過去被稱為「空竹」、「空鐘」，皆因其聲而得名。明代劉侗、于奕正同撰的《帝京景物略》裡記載：「兒手空鐘不暫停，空鐘空鐘，舒而遠聽，如蜻蜓起未觸於屏。蕭壺笛橫，蛛絃合併……」說明空鐘之聲，清越而悠揚，好似小蟲撲向屏風前之飛聲，又似管弦絲竹合奏一首動人的協奏曲。因此「空鐘」之名，很可能即是由於其轉動時所發出的聲音。

    　　另外，扯鈴還有許多地域性的名稱，如在北京稱為「空葫蘆」、「風葫蘆」、「響葫蘆」；在東北地區因其抖起來有嗡嗡的聲響，稱它為「抖哨子」或「抖哨」；河南因竹盒發出之聲如老牛之叫聲，故當地人稱之為「抖老牛」；江蘇如皋人稱作「扯鰾兒」。還有人認為「單頭鈴」還可以軸心著地旋轉，而稱它為「地鈴」、「地龍」、「地黃牛」等。

    　　扯鈴何時出現，目前已經不可考，但的確是舊時孩子們經常進行的遊戲種類，關於扯鈴的記載也散見在文人的筆記當中，如明代劉侗、于奕正同撰的《帝京景物略》一書記載著：「楊柳兒活，抽陀螺；楊柳兒青，放空鐘；楊柳兒死，踢毽子。」裡面一次提及了三種常見的童玩，並且因為季節不同，而進行不同的遊戲；清代王錫棋《小方壺齋叢鈔》所提「京師兒童，有抖空鐘之戲」亦有清楚記載。另外清代魏之琇還創作了抖空鐘詩，生動地描寫出其樣式、玩法與韻味：「截竹成形腰鼓如，兩端繩索弄徐徐。當風急轉如流水，山寺聞鐘韻有餘。」

    　　扯鈴除了在中國風行外，18世紀時更傳入歐洲，被命名為「diaballo」，此名乃由希臘字根 dia（橫越、交叉）與ballo（拋、丟）而來；現今則稱為「diabolo」，或以其外型長得像溜溜球而稱為「Chinese-Yo-Yo」。

    　　1810年，法國巴黎有扯鈴的俱樂部和比賽，扯鈴變成一種時髦的運動，在拿破崙的宮廷中出現了第一個木製扯鈴；後來英國人也迷上了此神奇的小玩意兒，他們稱之為「兩根棍子上的精靈」；1960年，法國人做出由兩個金屬杯合成的扯鈴，周圍用舊輪胎皮包裹保護著，則為西式扯鈴的由來。

    選自網路文章扯鈴'
