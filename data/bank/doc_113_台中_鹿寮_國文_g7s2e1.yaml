- id: doc_113_台中_鹿寮_國文_g7s2e1_s2_39
  section: 2
  number: 39
  type: single
  page: 4
  stem: 根據文中對「AI 主播的優勢」所述，下列敘述何者有誤？
  options:
  - label: A
    content: 能擁有完美聲音表情。
  - label: B
    content: 能即時與人互動。
  - label: C
    content: 能輕易切換多國語言。
  - label: D
    content: 其口條非常流暢。
  group_stem: '科技日新月異，AI 人工智慧逐漸充斥在生活應用中，不僅能修圖、翻譯語言，還能自動撰寫文章，也讓不少專家認為恐會重創媒體行業，甚至取代真人主播。為此「中天新聞」主播張若妤則點出
    AI 和人類的三大差異，直言：「依舊難取代真人！」

    　　張若妤在臉書上分享，有學生媒體問過她，「AI 主播會不會取代真人主播？有了 AI 還需要新聞工作團隊嗎？」讓她不禁回想在學時，課堂上就很常討論「紙媒會不會消失？」如今議題卻演變成「AI
    的崛起，是否改變全世界媒體業的未來？」

    　　張若妤接著點出 AI 主播的優勢，包含口條流暢、用字精準、擁有完美聲音表情、能輕易切換多國語言，幾乎不可能犯「吃螺絲」這種人類才會發生的錯誤。但她也指出「洞察力」、「互動性」、「溫度」依舊難取代真人。

    　　從事新聞近十年的張若妤，透過自身經歷分享，「一篇調查報導之所以好看，是因為記者深度走訪現場，與消息來源互動互信，靠文字的力量打動人心；一節新聞報導之所以精彩，是因為播報者的敘事風格，對議題的掌握能力，搭配幕後團隊的編排呈現方式。」

    　　雖然 AI 的出現，確實提升工作效率，人類也可以培養與 AI 協作的能力。不過，張若妤也反問大家：「比較好奇的是，如果哪天真人主播的 AI 版本出包了，一本正經胡說八道，NCC
    究竟該罰『本尊』還是『替身』呢？」

    改寫自新聞主播會被 AI 淘汰'
