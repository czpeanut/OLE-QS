- id: doc_113_新北_福和_國文_g7s1e1_s3_10
  section: 3
  number: 10
  type: single
  page: 2
  stem: '「曉銘放學後急著去探望生重病的奶奶，卻發現自己的腳踏車不見了，剛好旁邊的那輛車沒有上鎖，他就把車子騎走趕往醫院。後來被警方查獲，讓他後悔不已……。」

    關於曉銘的行為，若你在事發之初想勸誡他，下列選項何者最不適合？'
  options:
  - label: A
    content: 事不三思終有悔，人能百忍自無憂
  - label: B
    content: 世事洞明皆學問，人情練達即文章
  - label: C
