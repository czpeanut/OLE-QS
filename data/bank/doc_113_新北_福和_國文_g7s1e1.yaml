- id: doc_113_新北_福和_國文_g7s1e1_s3_25
  section: 3
  number: 25
  type: single
  page: 3
  stem: '媽媽生前曾經重複對著我說她的人生態度，那就是不要輕易看輕別人。她說，因為看輕別人，也就等於是看輕自己。一個自愛自重的人，是不會帶著太多偏見和成見，隨便看不起別人的。

    在我記憶中，媽媽很少抱怨某人，或對某人表達不滿。當有人正罵著某人時，她也只是淡淡地丟出一句話說：「也許，人家也有難處啊？」 或是：「也許，事情不是像你說的這樣啊。」

    但是媽媽也不容許別人看輕她，如果有人看輕她，她會喃喃自語說：「真是狗眼看人低！」所以她把看不起她的人都當成「狗」。她對她的孩子們說：「我們要當人，不要當狗。狗都是看到人的腳，就以為那是人的全部。」                                     ─小野
    生命中不能承受的看輕

    根據上文，可看出作者母親的個性及人生態度，下列何者最不適合用來形容她的為人?'
