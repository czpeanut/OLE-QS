  group_stem: "(甲)、請閱讀以下內容，並回答26〜27 題\n\n趙使魏加見楚 春申君① ：「君有將乎？」曰：「有矣，僕② 欲將臨武君③ 。」魏加曰：「臣少之時好射，臣願以射譬之，可乎？」春申君曰：「可。」加曰：「異日者，更羸④\
    \ 與魏王處京臺⑤ 之下，仰見飛鳥。更羸謂魏王曰：『臣為王引弓虛發⑥ 而下⑦ 鳥。』魏王曰：『然則射可至此乎？』更羸曰：『可。』有間⑧ ，雁從東方來，更羸以虛發而下之。魏王曰：『然則射可至此乎？』更羸曰：『此孽⑨\
    \ 也。』王曰：『先生何以知之？』 對曰：『其飛徐⑩而鳴悲。飛徐者，故瘡⑪痛也；鳴悲者，久失群也，故瘡未息⑫，而驚心未至也。聞弦音，引而高飛，故瘡隕也。』今臨武君，嘗為秦孽⑬，不可為拒秦之將也。」\n\
    ──戰國策‧楚策四\n【注釋】① 春申君：戰國時代楚國宰相，封為春申君，門下食客有三千多人。\n        ② 僕：自稱的謙詞。\n        ③\
    \ 欲將臨武君：想要以臨武君為將。\n        ④ 更羸：戰國時代魏國人，擅長射箭。\n        ⑤ 京臺：指高臺。\n        ⑥ 虛發∶空拉弓弦而不放箭。\n\
    \        ⑦ 下：使牠落下來。\n        ⑧ 有間：有一會兒。\n        ⑨ 孽：此指受傷的鳥。\n        ⑩徐：緩慢。\n\
    \        ⑪故瘡∶舊傷口。\n        ⑫息：此指痊癒。\n        ⑬秦孽∶秦國的敗將。"
