- id: doc_113_新北_福和_國文_g7s1e1_s3_4
  section: 3
  number: 4
  type: single
  page: 1
  stem: 在詩文中常以動態來反襯靜態，以聲音來反襯寧靜，例如「只有綠色的小河還醒著，低聲地歌唱著溜過彎彎的小橋。」也是用這樣的表達方式。下列何者沒有運用這樣的手法？
  options:
  - label: A
    content: 蟬噪林逾靜，鳥鳴山更幽
  - label: B
    content: 夜來風雨聲，花落知多少
  - label: C
    content: 靜極了，連一根針掉地上的聲音都聽得見
  - label: D
    content: 隨著老師的一聲怒吼，全班同學都噤聲不語，只有風將書頁翻得嘩嘩作響
  lesson_raw:
