    content: 遇到的車禍傷患，應先進行CPR 再協助報警
  - label: B
    content: 為了避免糾紛，「作壁上觀」才是明智的處理方式
  - label: C
    content: 車禍現場「熱心」幫忙的民眾犯了無心的錯誤
  - label: D
    content: 文中李姓女子癱瘓的原因是車禍時遭到劇烈撞擊
