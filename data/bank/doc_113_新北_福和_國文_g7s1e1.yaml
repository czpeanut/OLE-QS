- id: doc_113_新北_福和_國文_g7s1e1_s4_34
  section: 4
  number: 34
  type: single
  page: 6
  stem: 以上兩首新詩所描繪的主題依序是什麼？
  options:
  - label: A
    content: 摩天大樓╱高粱酒
  - label: B
    content: 甘蔗╱咖啡
  - label: C
    content: 梅花╱人蔘
  - label: D
    content: 竹╱茶葉
  group_stem: '(戊)、請閱讀以下兩首新詩內容，並回答34〜35 題

    〈一〉

    也只有沿著堅硬的環節

    向天空

    步步高升

    才是你不變的志向

    也只有綠

    才是你一生想說的

    那句話

    在忠臣傳裏

    才能讀到


    茹冰飲雪

    終於成為你生命的全部

    雖然偶爾你也喜歡化妝

    穿好一襲墨衣

    去鄭板橋畫裏


    雖然風善用所有構陷的話

    攻擊你細瘦的影子

    即使最冷的朝代

    你仍然筆直堅持

    站在雨裏

    父母兄弟都是

    這樣的個性

    永遠硬著頭顱而

    不肯破裂                                                  ─渡也


    〈二〉

    縐成一團，不一定是我的本意

    回復三月東風陣陣的翠綠

    或者秋末寒雨

    又，何嘗是……


    從火裡來，再到水中去

    也不過熬來一身苦澀

    沖出一身苦澀

    苦澀，無論如何也說不完

    山中晦暗的心情

    一切都淡了

    我還是沉下去又浮上來

    浮上來找尋自己的臉

    在淚水酸澀中

    唯知出神  凝視


    凝視你，身在杯外的風暴裡

    擔著什麼樣的淒楚                                        ─蕭蕭'
