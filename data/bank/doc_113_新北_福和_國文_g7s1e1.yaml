- id: doc_113_新北_福和_國文_g7s1e1_s3_16
  section: 3
  number: 16
  type: single
  page: 2
  stem: "脊髓損傷基金會舉辦「救命不能移」記者會，呼籲民眾，目擊車禍，千萬不要隨便搬動傷者，否則很容易造成「二度傷害」。最好是協助報警、給予及時安慰，然後幫忙指揮引導現場交通，指揮後方汽車駛離，避免再度發生車禍。\n\
    \    三十六歲的李珈妮，國中時期因車禍造成頸椎高度脊髓損傷，造成項椎以下機能喪失，肩膀以下癱瘓，只能靠輪椅行動。她回憶二十多年前，她騎機車撞上停在路邊轎車後，半臥在地上。當時她覺得脖子又痠又麻，一位好心的鄰居，馬上幫她按揉、做頸部按摩。在救護車到場後，她在未套上頸圈固定頸部，也未將頭、頸和身體呈一直線且固定在擔架或搬運板上的狀態下，幾乎毫無知覺地，「被一群民眾七手八腳的抬上高高擔架」，結果造成頸椎三、四、五節骨頭碎裂，壓迫到中樞神經，導致肩膀以下全部癱瘓。\n\
    \    車禍現場往往有許多「熱心」民眾，會把傷者趕快扶坐起來，北市消防局提醒，「把傷者趕快扶坐起來」其實很危險，不懂急救要領的民眾隨便扶起傷者是錯誤行為，反而會壓迫傷者的神經或氣管，導致終身癱瘓甚至危及生命。\n\
    \                                               ─改寫自2015.07.24 人間福報\n從以上新聞得知的訊息中，下列何者是正確的?"
  options:
