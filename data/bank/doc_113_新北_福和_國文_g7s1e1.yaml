- id: doc_113_新北_福和_國文_g7s1e1_s4_31
  section: 4
  number: 31
  type: single
  page: 5
  stem: 下列哪一種情況，不符合使用pyt 按鈕的情境？
  options:
  - label: A
    content: 大隊接力比賽時原本遙遙領先其他班級，卻因小華不小心跌倒，一路落後
  - label: B
    content: 從商店買了飲料出來，被匆忙趕路的人不小心撞翻
  - label: C
    content: 為了完成作業，熬夜打報告，快完成時，電腦竟然當機
  - label: D
    content: 小明每天沉迷手遊，導致每學期成績都不及格，無法取得畢業證書
  group_stem: "(丙)、請閱讀以下內容，並回答30〜31 題\n\n提到丹麥，我們會想到什麼？聯合國人類發展報告中曾數次將丹麥評比為最快樂的國家，丹麥人的生活已與幸福劃上等號，「hygge」便是他們最廣為人知的生活態度。\n\
    Hygge 讀音為「hooga」，對丹麥人來說 hygge 指的是放鬆、享受朋友與家人的陪伴、一種舒適的感覺，例如丹麥人喜歡點上蠟燭，營造一種放鬆的hygge\
    \ 氛圍。\n美國人認為hygge 類似於感恩節與親朋好友相聚的同樂時光，但在丹麥，hygge是實踐於生活中的每一件事，並非指特定節日。\n    然而，人生不可能時時順遂，充滿快樂。丹麥人面對壓力與挫折時，也有一套應對的方式──pyt！\n\
    依據The Communication 獨立媒體的調查，丹麥的流行語pyt 已逐漸取代hygge。pyt 念作「pit」，且發音更短促，有人將它翻譯成「沒關係」、「讓它去吧」、「別在意」，但其實這個字可以表達的涵義相當深廣──表達接受不在自己控制中的狀況，縱使煩悶、沮喪，但決定不要浪費精力在這些事情上，接受它，並且往前行。丹麥人也會用這個字來安慰別人。\n\
    但pyt 並不是逃避現實的藉口，而是要人們認清現況，減少抱怨與責備，例如遇到塞車，可能我們會抱怨前面的車子太慢，但 pyt 的態度就是：別人的行為，我們本來就沒辦法控制，所以別讓這件事困擾你！別把寶貴的生命浪費在上面。\n\
    以心理學來說，pyt 的生活態度可以協助人們擺脫完美主義的心態，許多研究也顯示憂鬱與完美主義有絕對的正相關，因此學會放下、接納，對心理健康有十足的幫助。\n\
