  stem: '根據以上文字說明及兩項表格，請判斷以下誰的會考分數最高？

    甲∶ 國文A、數學A+、英文B++、社會C、自然C、作文1 級

    乙∶ 國文B+、數學B++、英文B++、社會B+、自然B+、作文4 級

    丙∶ 國文C、數學A++、英文C、社會C、自然A++、作文3 級

    丁∶ 國文B、數學B、英文B+、社會B+、自然B+、作文6 級'
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
  group_stem: '(丁)、請閱讀以下內容，並回答32〜33 題


    說明∶    國中會考成績依照答對題數可分成A（精熟）、B（基礎）、C（待加強）三種等級，A 等級又可再細分為A++、A+、A；B 等級也再細分為B++、B+、B；C
    等級沒有再進行細分。國中會考積分是由會考各個科目的積分加總而成，包含五項會考科目（國文、數學、英文、社會、自然），每科積分滿分為7 分，再加上作文1 分，總共滿分是36
    分。


    【國中會考各科成績等級與積分對照表】

    | 等級標示 | A++ | A+ | A | B++ | B+ | B | C |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 積分 | 7 | 6 | 5 | 4 | 3 | 2 | 1 |


    【作文成績等級與積分對照表】

    | 作文等級 | 6 | 5 | 4 | 3 | 2 | 1 |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 積分 | 1 | 0.8 | 0.6 | 0.4 | 0.2 | 0.1 |'
