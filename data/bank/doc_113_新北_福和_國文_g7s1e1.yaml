    \ pyt 的生活哲學。\n現代自我心理學之父阿德勒也說過，人必須擁有接受不完美的勇氣，十全十美是人們的理想，既然是理想，也就表示這世界很難有完美的東西，因此學習接受不完美的生活，會讓我們對一切更加寬容。\n\
    \      ─改寫自鄭閔文 快樂的國家如何面對不快樂?丹麥人不順遂時會說的神奇單字:pyt!"
