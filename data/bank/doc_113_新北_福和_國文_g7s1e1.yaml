- id: doc_113_新北_福和_國文_g7s1e1_s4_28
  section: 4
  number: 28
  type: single
  page: 4
  stem: 以上為教育部發布的新聞內容，請問主要在傳達什麼訊息？
  options:
  - label: A
    content: 學生體適能落後的原因
  - label: B
    content: 改善校園運動場地的政策
  - label: C
    content: 學生體適能檢測變革
  - label: D
    content: 各種運動傷害的影響
  group_stem: "(乙)、請閱讀以下內容，並回答28〜29 題\n\n    為增進學生體適能檢測之彈性與安全，教育部 體育署於去(112)年11 月20\
    \ 日公告修正「國民體適能檢測實施辦法」，針對學生體適能的心肺耐力、肌力及肌耐力2 項，將「仰臥起坐」改為「仰臥捲腹」及新增「漸速耐力折返跑」呼應國際趨勢更新檢測方式，並將於今(113)年8\
    \ 月1 日起正式實施。\n    本次學生體適能檢測方法重要變革之一，是肌力及肌耐力檢測的「仰臥起坐」改為「仰臥捲腹」，過往「仰臥起坐」的檢測中，較容易發生因學生姿勢不正確，引發下背痛的風險，而造成運動傷害，改為「仰臥捲腹」之後，將能更安全地評估學生的肌力及肌耐力。其次是心肺耐力檢測項目中，過去僅施測「跑走」，以學生完成800\
    \ 或1600 公尺的時間為檢測方式，較容易受限於場地及天候因素，故新增「漸速耐力折返跑」作為該檢測項目選項之一，期透過更靈活、多樣化與安全性的檢測方式，同時參考國際趨勢，以因應不同教學現場的需求，維護學生體適能檢測的安全。\n\
    \    檢測成績部分，可透過持續練習及重複檢測，再擇優上傳檢測結果，以因應學生對於檢測項目不熟悉，可能影響測驗成績的疑慮。說明會中也讓師長們藉由現場實作練習，熟悉新檢測項目的實施流程，並在「教育部體育署體適能網站」提供影音檔下載使用。此外，也鼓勵各縣市政府辦理縣市說明會，協助推薦講師至各縣市講授，讓師長們可以更便利的在地熟悉相關操作。\n\
    \    此外，體育署於8 月1 日也將併同推出改版的「教育部體育署體適能網站」，將提供更便於操作的網頁介面。新版網頁增列「仰臥捲腹」及「漸速耐力折返跑」2\
    \ 項檢測方式的實施方法及檢測器材介紹，同時製作影音檔及體適能檢測常模數據，提供學生及有需要的民眾瞭解自身的體適能狀態，進而增進體適能知識，以落實學生多元學習及均衡發展的理念。\n\
    \    體育署表示，本次學生體適能檢測變革，主要在於精進檢測方式，並提供常模數據給學生瞭解自己的體適能狀態。透過體適能檢測項目的改革，培養學生多元且規律的運動習慣，增進身體健康，在未來的學習與生活中展現更全面的優勢。\n\
    \                            ─教育部全球資訊網"
