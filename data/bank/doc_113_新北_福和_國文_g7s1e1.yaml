  stem: 胡適在母親的教誨一文中提到自己的母親是「慈母兼任嚴父」，下列哪一段描述能具體呈現「慈母」的形象？
  options:
  - label: A
    content: 每天，天剛亮時，我母親便把我喊醒，叫我披衣坐起。我從不知道她醒來坐了多久了。她看我清醒了，便對我說昨天我做錯了什麼事，說錯了什麼話，要我認錯，要我用功讀書。
  - label: B
    content: 犯的事小，她等到第二天早晨我睡醒時才教訓我。犯的事大，她等到晚上人靜時，關了房門，先責備我，然後行罰，或罰跪，或擰我的肉。
  - label: C
    content: 我剛說了這句話，一抬頭，看見母親從家裡走出，我趕快把小衫穿上，但她已聽見這句輕薄的話了。晚上人靜後，她罰我跪下，重重地責罰了一頓。她說：「你沒有老子，是多麼得意的事！好用來說嘴！」她氣得坐著發抖，也不許我上床去睡。
  - label: D
    content: 我跪著哭，用手擦眼淚，不知擦進了什麼黴菌，後來足足害了一年多的眼翳病，醫來醫去，總醫不好。我母親心裡又悔又急，聽說眼翳可以用舌頭舔去，有一夜她把我叫醒，真用舌頭舔我的病眼。
