- id: doc_113_高雄_鼎金_社會_公民_g8s1e2_s1_56
  section: 1
  number: 56
  type: single
  page: 2
  stem: 上文中，美國總統大量撤換聯邦政府官員，是屬於何種政府權力的行使？
  options:
  - label: A
    content: 行政權
  - label: B
    content: 立法權
  - label: C
    content: 考試權
  - label: D
    content: 監察權。
  group_stem: "56-57 題組\n請閱讀下列文章後，回答問題：\n  孫中山為何會把監察權、考試權分別提升位階至「院級」？根據孫中山的說法，外界解讀是因為中國向來重視家族、族人，若是一人得道，可能雞犬升天。\n\
    \  有些學者也認為美國「三權」不夠完備，其中最著名「濫用私人」的例子，是美國第 7 任總統傑克遜當選後，大量撤換聯邦政府官員，取而代之是自己的支持者與友人，被稱為「傑克遜民主的分贓」。這個情況直到\
    \ 1883 年才被「彭德爾頓法案」終結，這項法案確認了美國聯邦政府的制度原則，即「競爭考試、職務常任、政治中立」。\n  孫中山當年認為，立法機關擁有監察權，會出現「國會專制」的流弊。例如：美國監察權由議院掌握，往往使行政機關不得不俯首聽命，因此常常成為議院專制。現在的美國依舊出現議員權力過大，導致難以制衡的案例。例如：前美國西維吉尼亞州聯邦參議員勃德，他在任時，不斷把中央預算轉到自己的家鄉，其中在內陸的西維吉尼亞州，竟然成立了海巡署的國家海洋中心。\n\
    \  最近我國修憲議題中，有讓「五院變三院」的主張。回顧孫中山之前的主張，與美國曾出現的弊端，癥結在「五院」或「三院」，以及能否避免「家天下」、「黨天下」，可能值得繼續深究。（資料來源：改寫自五權憲法怎來的？三權分立也常讓美國頭疼，今日新聞，2020/7/15）"
  tags:
