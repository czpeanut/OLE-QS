    content: 現代鏡的製作過程繁瑣複雜，需要工匠反覆量度
  - label: B
    content: 古人所鑄的銅鏡大部分屬於凹面鏡，現代則皆生產
  - label: C
    content: 凹面鏡會使人臉看起來比較小，所以要製作的更大
  - label: D
    content: 凸面鏡會使人臉看起來比較小，此工藝運用於古代。
  group_stem: '古人鑄鑒，鑒大則平，鑒小則凸。凡鑒凹則照人面大，凸則照人面小。小鑒不能全視人面，故令微凸，收人面令小，則鑒雖小而能全納人面，仍復量鑒之小大，增損高下，常令人面與鑒大小相若。此工之巧智，後人不能造。比得古鑒，皆刮磨令平，此師曠所以傷知音也。

    ──沈括《夢溪筆談》'
