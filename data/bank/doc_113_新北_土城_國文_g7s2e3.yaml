  - label: D
    content: 對「老病死」視而不見，採取船到橋頭自然直。
  group_stem: '我們的一生花很長的時間與心力處理「生」的問題，卻只有很短的時間處理「老病死」，甚至，也有人抵死不願意面對這無人能免的終極課題。然而，不管願不願意，無論如何掙扎、號叫，「老病死」聯合帳單終會找上門──先找上我們的父母，再找我們。大約從四、五十歲開始，我們得先承接父母的帳單，一把鼻涕一把眼淚和著肝腸寸斷、甚至滿腹怒火付完了帳單，接著，輪到自己的了。

    ──節選自簡媜《誰在銀閃閃的地方，等你：老年書寫與凋零幻想》'
