  section: 2
  number: 38
  type: single
  page: 4
  stem: 根據上文，「後生科舉之士」對書籍的態度，可用下列何者形容？
  options:
  - label: A
    content: 好學力行，敦品勵學
  - label: B
    content: 束之高閣，漠然置之
  - label: C
    content: 未雨綢繆，防患未然
  - label: D
    content: 揮金如土，一擲千金。
  group_stem: '余猶及見老儒先生，自言其少時，欲求《史記》、《漢書》而不可得，幸而得之，皆手自書，日夜誦讀，惟恐不及。近歲巿人轉相摹刻諸子百家之書，日傳萬紙，學者之於書，多且易致如此，其文詞學術，當倍蓰①於昔人，而後生科舉之士，皆束書不觀，遊談無根，此又何也？

    ──蘇軾〈李氏山房藏書記〉

    【注釋】

    ①蓰：音ㄒㄧˇ，五倍。'
