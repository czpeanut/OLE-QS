- id: doc_113_新北_土城_國文_g7s2e3_s2_35
  section: 2
  number: 35
  type: single
  page: 3
  stem: 根據(甲)文，問者由什麼線索確認仕於南方的北人「生而不識菱」？
  options:
  - label: A
    content: 北土亦有此物否
  - label: B
    content: 席上啖菱，並殼入口
  - label: C
    content: 我非不知，欲以去熱
  - label: D
    content: 前山後山，何地不有。
  group_stem: '甲、

    北人生而不識菱者，仕於南方，席上啖菱，並殼入口。或曰：「食菱須去殼。」其人自護所短，曰：「我非不知，並殼者，欲以去熱也。」問者曰：「北土亦有此物否？」答曰：「前山後山，何地不有？」夫菱生於水而非土產，此坐①強不知以為知也。

    ──江盈科〈北人食菱〉

    乙、

    南方多沒人，日與水居也。七歲而能涉，十歲而能浮，十五而能沒矣。夫沒者豈苟然哉！必將有得於水之道者。日與水居，則十五而得其道；生不識水，則雖壯，見舟而畏之。

    故北方之勇者，問於沒人，而求其所以沒，以其言試之河，未有不溺者也。

    ──蘇軾〈北人學沒〉

    【注釋】

    ①此坐：這是因為。'
