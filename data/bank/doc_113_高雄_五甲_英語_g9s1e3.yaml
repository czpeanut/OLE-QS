  stem: What does refrain from mean in the reading?
  options:
  - label: A
    content: To be bored with doing something.
  - label: B
    content: To take an interest in doing something.
  - label: C
    content: To keep oneself from doing something.
  - label: D
    content: To learn to do something.
  group_stem: 'What do you usually do with coupons? Throw them away? Or make good
    use of them to save money?

    Studies show that if a shopper is in the habit of using coupons, he or she can
    save about US$30 to US$50 a week. However, many people refrain from using coupons
    because they are afraid that the practice will make them look cheap or that other
    people might think they are poor.

    Helen Smith, a smart shopper, says that by using coupons, she can save up to 30%
    to 35% on her grocery bill every time she goes shopping. The following are some
    useful tips she shares.


    Tips for using coupons

    1. Look for coupons everywhere, in the newspaper or on the Internet. Your hard
    work often pays off.

    2. Only collect coupons that give the items you really need. If you clip every
    coupon, your house will be filled with all kinds of items. What''s more, you will
    spend more money than is needed.

    3. It is a smart idea to use coupons when items in a store are on sale. For example,
    it usually saves $1 on a $4.38 family pack of ice cream by using a coupon, but
    when the ice cream is on sale for $3.99, you can save a lot more with a coupon.


    What do you think of Helen''s tips for using coupons? Why not give it a try? Start
    small and save big money in the long run.


    grocery 食品雜貨 bill 帳單 clip 剪下

    Source: 英語 ASK 素養閱讀'
  shared_asset: g7_7_9
