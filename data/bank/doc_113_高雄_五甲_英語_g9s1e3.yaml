- id: doc_113_高雄_五甲_英語_g9s1e3_s7_5
  section: 7
  number: 5
  type: single
  page: 4
  stem: Which word ISN'T a compound word?
  options:
  - label: A
    content: Postcard.
  - label: B
    content: Background.
  - label: C
    content: Taiwanese.
  - label: D
    content: Underwater.
  group_stem: 'Everyone knows numbers can be added. One plus one equals two. But you
    may not notice that words can also be added together. Let''s try this: "home"
    plus "work" equals "homework!" Words like "homework" are called compound words.
    Just put two or more words together, and you get a compound word, such as "notebook"
    (note and book), "basketball" (basket and ball), and "doorbell" (door and bell).

    Compound words are too easy for you? Try blend words! A blend word is usually
    formed by the first part of a word and the last part of another word. For example,
    we take "br" from "breakfast" and "unch" from "lunch," put them together, and
    we have "brunch". Blend words are getting popular these days, especially on the
    Internet. Interesting words like "spork" (from "spoon" and "fork") are created
    all the time. Some blend words may not be seen as real words, but some of them
    have even made it into the dictionaries. If that happens to a word you''ve created,
    wouldn''t that be fantabulous?

    plus 加 equal 等於'
