- id: doc_113_高雄_五甲_英語_g9s1e3_s7_3
  section: 7
  number: 3
  type: single
  page: 4
  stem: What does "journalist" mean?
  options:
  - label: A
    content: Someone who asks others for their opinions.
  - label: B
    content: Someone who runs a hotel.
  - label: C
    content: Someone who makes afternoon tea for others.
  - label: D
    content: Someone who has a sweet tooth.
  group_stem: 'The New Season Hotel has just added afternoon tea to its menu. Local
    journalist Nancy Snyder went out to ask some locals what they think about it.


    Nancy: Have you heard that the New Season Hotel has started doing afternoon tea?
    What do you think of the idea?


    Erica: I love it! I love the little cakes and scones because I have a sweet tooth.
    And I can never have enough Oolong tea. I can''t wait to go with some of my friends.


    Jack: Personally, I don''t see the point of afternoon tea. The sandwiches and
    cakes are so small, and they never fill you up. You''ll be hungry again half an
    hour later. The New Season should keep to breakfast, lunch, and dinner.


    Mabel: I''m so happy that the hotel is offering afternoon tea. Being served all
    that delicate food makes you feel very special. I''m not sure I will be able to
    go because it''s expensive. But maybe my granddaughter will take me there one
    day.


    journalist 記者 offer 提供 serve 提供(服務) delicate 精緻的

    Source: Read to Learn: Improve Your English Reading'
