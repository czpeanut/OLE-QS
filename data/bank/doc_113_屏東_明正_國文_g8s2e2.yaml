- id: doc_113_屏東_明正_國文_g8s2e2_s6_1
  section: 6
  number: 1
  type: single
  page: 3
  stem: 「聲音可以影響心情，而大自然的聲音有療癒的作用。PNAS 的研究，分析大自然三種白噪音對人的影響，分別是鳥鳴聲、水聲和混合聲。結果發現，這些白噪音對心理健康有幫助，當中雨點落下及溪流等水聲對於促進情緒和健康最有效。研究人員建議大家空閒時可閉上眼睛，並專注在大自然的聲音，尤其是承受壓力時，親近大自然及聆聽四周的聲音，能讓身心放鬆，從而得到治癒。研究人員希望社會好好保護環境，以免大自然的白噪音因環境汙染而受到破壞，令人類失去放鬆精神的好地方。」依據本文，下列何者說明有誤？
  options:
  - label: A
    content: 自然界的白噪音都有治癒精神的功能
  - label: B
    content: 水聲較其他白噪音更具撫慰心靈之效
  - label: C
    content: 想要釋放壓力可以多聽自然界的聲音
  - label: D
    content: 保護環境完善最終對人類的幫助很大。
  tags:
    chapter:
      publisher: null
      book: 八下
      subject: 國文
      code: null
      title: null
      chapter: null
    textbook: 八下 第2次段考範圍
    labeled_by: ai
- id: doc_113_屏東_明正_國文_g8s2e2_s6_2
  section: 6
  number: 2
  type: single
  page: 3
  stem: Pyt 很受丹麥人喜愛，沒法直接翻譯。有些人說是「別介意」、「別擔心」或者「算了吧」，但都沒有表達出它積極的一面。Pyt 是說：你接受了自己無能為力的事實，就算生氣或者沮喪，也決定不再浪費不必要的精力去多想，轉而開始新篇章。Pyt
    也可以用來安慰別人，舒緩不如意的境況。Pyt 的核心在於接受並重置。它是種提醒，要我們退一步、重新聚焦，不要過度反應。它不是怪罪，而是種放下的方式。值得注意的是：犯下嚴重錯誤的時候，不該用Pyt
    來回應。應當承擔責任之時，也不該用這個來卸責。下列哪一種狀況不適合使用「Pyt」？
