- id: doc_113_屏東_明正_國文_g8s2e2_s6_4
  section: 6
  number: 4
  type: single
  page: 3
  stem: '假訊息影響孩子思考直覺化、無法獨立判斷。很多父母認為，孩子太小不碰新聞，假訊息就跟孩子無關。但認知心理學研究顯示，長期滑手機、只接收破碎資訊的孩子，無法養成思考的習慣，更易淪為被假訊息左右的人。臺大
    心理學系副教授連韻文分析，大腦的思考力不是天生，需要特別訓練，才能把資料重組、整理、歸納，去找出其他可能性。若只是滑手機，接收過多片段的訊息，尤其許多引發負面、驚悚情緒的假訊息，會變得只有反應，沒有思考。若只是被動接收訊息，你就是被賺錢、被控制、被操弄的那個人。

    若要為這段文字下一個標題，下列何者最合適？'
  options:
