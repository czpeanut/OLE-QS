  stem: 藉用具體形象化的方法，將某種感官的感覺移植到另一種感官上，此種寫法叫做「移覺」。例如：「（炊煙）在靜定的朝氣裡漸漸地上騰，漸漸地不見，彷彿是朝來人們的祈禱，參差地翳入了天聽。」句中便使用了「聽覺表達視覺」的移覺技巧。下列哪個文句，也使用了相同的移覺手法？
  options:
  - label: A
    content: 那低咽的簫聲又傳來了，幽幽的，如同一隻到處漫遊的光焰微弱的螢火蟲，飛到她的心中
