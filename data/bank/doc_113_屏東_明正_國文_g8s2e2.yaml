- id: doc_113_屏東_明正_國文_g8s2e2_s5_3
  section: 5
  number: 3
  type: single
  page: 1
  stem: 〈我所知道的康橋〉一文，勾勒出康橋的種種美景。請同學分析作者在文中隱含的巧思，下列何者的說明是正確的？
  options:
  - label: A
    content: 文中連用三個「頃刻間」，強調初春清晨朝霧接連變化，予人目不暇給之感
  - label: B
    content: 引用陸游詩句「傳呼快馬迎新月，卻上輕輿趁晚涼」，表達騎車夜遊比白天追日更為涼爽愜意
  - label: C
    content: 「剎那間在我迷眩了的視覺中，這草田變成了……，不說也罷，說來你們也是不信的！」作者無法貼切描述當下的感受，只能以刪節號留給讀者想像空間
  - label: D
    content: 「關心石上的苔痕……關心新來的鳥語」，連用六句「關心」表達暮春河上的熱鬧生機。
  lesson_raw:
    title: 我所知道的康橋
    basis: 課名〈我所知道的康橋〉
