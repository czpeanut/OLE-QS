- id: doc_113_屏東_明正_國文_g8s2e2_s6_8
  section: 6
  number: 8
  type: single
  page: 4
  stem: 根據本文，以下何者敘述有誤？
  options:
  - label: A
    content: 從20 萬年前人類物種出沒在東非後到現今，有智慧手機、網路的世界佔了人類演化史的二十分之一
  - label: B
    content: 使用手機可能造成失眠、憂鬱、過動、降低延遲享樂的能力、考試成績下滑等問題
  - label: C
    content: 人類演化過程幾乎都不是為了現代生活而演變，相反的，是為了幫助我們在野外活下去
  - label: D
    content: 比爾蓋茲和賈伯斯都不給小孩用手機，是因這些科技巨頭都明白科技成癮的可怕性。
  group_stem: '你是不是曾經也有這個感覺，原本正在思考一件事情，結果手機突然跳出一則通知就打斷了你的思緒。或是在社群發了一篇文章後，不自覺的就會想關注現在有多少人按讚，或是只要準備要專心做事情時就會想拿手機出來，點開FB、IG、Youtube
    東看西看，結果最後才又突然意識到花了太多時間在上面，正事都沒做……

    根據統計，人們一天平均碰手機2,600 次，花費在上面的時間平均超過4 小時。人類的行為模式在手機普及後的變化是史上最快速的，快到你的腦袋完全來不及適應它，反而完全被牽著鼻子走。手機影響睡眠、專注甚至是精神健康的結果已經是個不爭的事實了！甚至是發明的重大推手比爾蓋茲和賈伯斯都不給小孩用手機和iPad，你就能大概了解這些科技巨頭都完全明白科技成癮的可怕性。

    從20 萬年前人類物種出沒在東非後到今天，如果將每20 年分成一個部分，你猜有幾個部分是生活在有智慧手機、網路的世界？答案是1 個，等於是人類演化過程的99.9%都不是為了現在的時代在演變的，我們人身上的各種激素、器官反應等等都是為了幫助我們在野外更好的活下去，例如吃更多的食物儲存體脂肪、對危險感到更加不安，或是不斷被周遭動靜吸引，這些過去對生存有幫助的特質，在如今卻可能變成肥胖、憂鬱、過動等問題。

    而科技產品也正是抓住了我們體內的某項激素來牢牢綁住我們，那就是「多巴胺」。多巴胺常被稱為犒賞物質，他的任務除了要提振我們的精神外，也要讓我們選擇專注在哪件事情上，簡單來說，他就是人類的原動力。肚子餓看到餐桌上的食物，這個過程就會讓你增加多巴胺的分泌量，並不是在吃下去時才分泌，而是當你看到食物時，大腦就會提高多巴胺的量，藉此促使你行動去吃下那些食物。

    而手機正是利用了這一點，當有新通知，或是新的訊息跳出時，你的大腦都會提高多巴胺的分泌，因為你「可能」可以從中獲得一些什麼。也因為大腦在演化的過程中，「好奇心」是可以幫助生存下去的關鍵因素，那個方向可能會有水源、可能有食物等，因此對於「可能會有吸引人的結果」這件事情一直被很多方面的利用著，不只是網路社群、遊戲抽獎等，甚至賭博也是這樣去設計，讓大家會有想去互動參與的吸引力與動機。

    那如果說手機裡面的程式會讓人感到分心想要花時間在上面的話，那手機本體是否就比較無害了呢？根據了各國的測驗統計都發現，只要是手機出現在視線範圍，或是你放在口袋可以感覺的到他時，他都會吸引到你的注意力，降低你的專注力。你可能也有注意到過，當你和朋友一起用餐時，只要你將手機放在桌上，你就需要偶爾克制住自己去滑手機的衝動。而當你去分神抑制住這個想法時，相對地就也影響到做其他事情的腦容量了。

    除了專注力下滑之外，最近也有很多調查發現，使用手機的頻率愈高，心理壓力和罹患憂鬱症的比例就愈高。另外，使用手機的時間愈長尤其是在睡前，對於睡眠的品質影響就愈大。除了科技產品散發出來的藍光外，各式各樣搶奪你注意力的資訊會讓你心情波動較大，焦慮感上升，進而影響到睡眠。

    最後就是社群軟體容易引起沮喪感，怎麼說呢？針對10 幾歲年輕人的研究調查中，有超過半數的人回答因為社群讓自己對自己不滿意，最大的原因就是來自於人與人之間本來就會有的「競爭性」，但這件事情被社群媒體給無限的放大，從外表、美食、大餐、旅遊、精品……無數數不清的美好照片會讓人不自覺的與自己做比較，讓自己陷入了沮喪不自信的循環。比較有趣的是，也有研究指出，因為我們減少了人與人實際的接觸後，少了所謂有「溫度」的交談，我們不再能夠反覆觀察到別人的表情、舉止、情緒，因此也觀察到年輕世代對於「共感」設身處地的能力也在持續下降中。其他像是「降低延遲享樂的能力」、「考試成績下滑」、「精神失調」等問題也都已慢慢浮現在那些從出生就活在網路世代的學童身上。因此，我們更應該要重視手機這個產品對人類的負面影響該如何從中找到脫身之道，當我們意識到所有的科技軟硬體都是為了吸引我們注意度而設計的時候，我們就能更有行動力的去慢慢的「數位排毒」。
    （節選自安德斯‧韓森 拯救手機腦）'
