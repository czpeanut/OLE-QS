  page: 3
  stem: '英國 倫敦 大衛蓋姆學院，開設第一堂由人工智慧，取代真人教師授課的課程，AI 平臺了解每個學生的優缺點，依據人工智慧演算法生成內容並決定課程的節奏，量身訂做課程，學生反應普遍滿意。

    「真正教育行動」主席麥克戈文：「學生們將從AI 的學習中損失很多，需要額外學習與老師和其他學生們的互動。AI 是一臺機器，它是惰性的，學生將失去了學習過程的人性化。」

    （改寫自林芳穎 英國大學新嘗試 AI 取代真人教師授課）

    根據上文，關於AI 教學與真人教師教學的利弊分析，下列何者敘述正確？'
  options:
