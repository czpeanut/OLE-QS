  - label: B
    content: 移工長期在台灣生活可以帶動文化全球化
  - label: C
    content: 台灣有為數眾多的移工是由於基層勞動力有缺口
  - label: D
    content: 在台移工多來自印尼、菲律賓、越南等東南亞國家，與台灣的語言、宗教信仰、風俗習慣等文化相近
  group_stem: 國定假日怎麼放，一直以來都是行政機關說了算，有鑑於今年補班亂象引起民怨，朝野立委因此各自提案，不只希望將「實施辦法」提高到「法律」位階，也藉機加碼各種「國定假日」，光是體現多元文化價值的假日就五花八門，從原住民族正名紀念日、全國客家日到國際移民日都有人提出，甚至有立委主張通通都列為國假。多年來，民間也曾提出不同版本的「自選多元文化假日」構想，希望鬆動獨尊漢人文化傳統節日的既定思維。群眾服務協會公關主任表示，根據協會長年服務移工的觀察，印尼籍移工對自選多元文化假日的需求較為迫切，因為開齋節對穆斯林而言，重要性相當於華人的舊曆新年。【2023-03-01
