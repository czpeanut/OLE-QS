  stem: 歐美知名品牌，逐漸轉向與非中國生產的供應商合作，中國本地製造商只好開始在地化，發展國產品牌、開發國內的作業系統，因應中國本地市場的需求調整生產的產品。請問：我國可能受到的影響有哪些？（甲）國際貿易的困難度減少（乙）自國外進口至台灣的商品價格可望降低（丙）台灣在中美貿易戰之間必須選邊靠攏（丁）原先在中國投資設廠的台商因應中國內需，必須改變生產產品的品項
  options:
