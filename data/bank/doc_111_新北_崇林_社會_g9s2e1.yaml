  section: 3
  number: 35
  type: single
  page: 5
  stem: 許多歐美知名品牌，其原料與零件均來自其他國家的供應商，請問：這是何種面向的全球化？
  options:
  - label: A
    content: 經濟全球化
  - label: B
    content: 政治全球化
  - label: C
    content: 文化全球化
  - label: D
    content: 生產全球化
  group_stem: 自從美國對中國發動貿易戰以來，全球化已逐漸成為兩極化的發展趨勢，猶如冷戰時期的美蘇對抗局面，以台積電來說，在美中晶片戰被迫選邊靠攏美國，未來在國際貿易舞台上，將逐漸形成美國領軍的自由世界集團對抗中國為首的專制體制集團，兩個集團搶奪全球化的話語權，直到一方認輸為止。一位消費性電子產品台廠公司，在受訪時就道出他的無奈：「很多歐美知名品牌客戶，已慢慢轉向非中國生產的供應商（合作），中國本地的供應商只好開始在地化。」
    他以美國蘋果公司為例指出，一台iPhone 的記憶體採取兩種規格製造，在中國國內市場銷售的，使用長江儲存製造的晶片，在非中國市場銷售的商品，便使用台灣或南韓製造的晶片。」可以見得，中美對峙影響所及，不只是政治、軍事上的對壘，對於全球的企業、每一個員工，甚至每一個地球村村民，都產生了或多或少的衝擊。【2023-02-23
    遠見雜誌】
