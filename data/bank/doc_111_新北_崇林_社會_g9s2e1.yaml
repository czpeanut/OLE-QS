- id: doc_111_新北_崇林_社會_g9s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 在他統治的區域頒行法典，推動政治、教育的改革，也將自由、平等、博愛的精神傳播至歐洲各地，並喚起 各地的民族意識。請問上述人物應是何人？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 戊。
  group_stem: '人物：(ㄅ)馬志尼 (ㄆ)俾斯麥 (ㄇ)華盛頓 (ㄈ)加富爾 (ㄉ)拿破崙 (ㄊ)玻利瓦

    語錄：

    (甲) 說：「如果人生途程上沒有障礙，人還有甚麼可做的呢？」當代的重大問題不是通過演說與多數議決所能解決的——這正是1848 年和1849 年所犯的錯誤——，所以是要用鐵血來解決國家統一問問題吧。

    (乙) 說：「青年人啊，熱愛理想吧，崇敬理想吧。理想是上帝的語言。高於一切國家和全人類的，是精神的王國，是靈魂的故鄉。」所以他曾創青年義大利黨並立志輝復古羅馬光榮

    (丙) 說：「人生的光榮，不在於永不言敗，而在於能夠屢撲屢起」可惜他在滑鐵盧之役後卻難以再起，但他留下的那道光卻永遠照亮法國。

    (丁) 「努力讓你心中那多被稱之為良心的火花永不熄滅。」所以他在帶領國家獨立後為建國後第一任大總統，不論聲望多高，都沒有貪戀權力遵守憲法規定，塑立了總統任期不能超過兩屆的先例。

    (戊) 「為了上帝，為了我的祖國，為了我的尊嚴。我發誓，只要西班牙政權的殖民枷鎖還套在我們身上，我就要不停地戰鬥」

    (己) 「我雖拙於言辭，不善演講，但我能創造一個義大利。」在他的努力和外交斡旋下義大利這破碎的靴子可以拼湊起來。'
  tags:
