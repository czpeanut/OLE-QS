  section: 1
  number: 9
  type: single
  page: 2
  stem: '將一彈簧懸掛 20gw 砝碼時，彈簧伸長量為 L cm，如圖一。今將該彈簧以分別以圖二至圖四方式操作，其中圖二以手對彈簧施力 20gw；圖三將彈簧一端固定，另一端細繩跨過滑輪懸吊
    20gw 砝碼；圖四將彈簧兩端以細繩各跨過滑輪懸掛 20gw 砝碼。 (彈簧及細繩重量極輕皆可忽略不計，且操作完畢後彈簧皆恢復原狀)。對於下列操作比較其伸長量，下列三人提出自己的說法：


