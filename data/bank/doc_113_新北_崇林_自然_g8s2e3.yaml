  stem: '一塊質量為 100gw 的木塊分別在甲、乙兩水平桌面上所測量的最大靜摩擦力如附表所示。將此木塊靜置於桌面甲上，施予大小為 5.0gw 的水平力，另將此木塊靜置於桌面乙上，施予大小為
