  type: single
  page: 2
  stem: 阿一想要用色紙剪出一個面積為36平方公分的三角形，若底為$x$公分，高為$y$公分，則下列敘述何者正確？
  options:
  - label: A
    content: $x$與$y$的關係式：$xy=36$
  - label: B
    content: $y$與$x$成正比
  - label: C
    content: 當三角形的底為6公分時，高為6公分
  - label: D
    content: 當三角形的底為8公分時，高為9公分
- id: doc_113_高雄_翠屏_數學_g7s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 下列敘述何者正確？
  options:
  - label: A
    content: 當$x$ 的值愈大，$y$ 的值隨著減少，則表示$y$ 與$x$ 成反比
  - label: B
    content: 若$-xy=1$ 成立，表示$x$ 與$y$ 成反比
  - label: C
    content: 若$xy=-\frac{1}{3}$ 成立，表示$x$ 與$y$ 成正比
  - label: D
    content: 若$xy=5$ 成立，表示$x$ 與$y$ 都是分數，且$x$ 與$y$ 成反比
