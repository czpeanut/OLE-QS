- id: doc_113_高雄_翠屏_數學_g7s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 在坐標平面上，直線$L$的方程式為$y=5x+a$。若$a>0$，則$L$不通過第幾象限？
  options:
  - label: A
    content: 一
  - label: B
    content: 二
  - label: C
    content: 三
  - label: D
    content: 四
- id: doc_113_高雄_翠屏_數學_g7s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 在坐標平面上，下列敘述何者正確？
  options:
  - label: A
    content: $x=c$ 表示一條直線
  - label: B
    content: $y=c$ 表示一個點
  - label: C
    content: $x=0$ 表示$x$ 軸
  - label: D
    content: $y=c(c\neq 0)$表示垂直$x$ 軸的直線
- id: doc_113_高雄_翠屏_數學_g7s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 下列哪個方程式的圖形會通過原點？
  options:
  - label: A
    content: $3x+y=1$
  - label: B
    content: $2x-3=0$
  - label: C
    content: $x=-2y$
  - label: D
    content: $x+y-1=0$
- id: doc_113_高雄_翠屏_數學_g7s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 某次籃球比賽，阿光投10球進6球，阿亮投5球進3球，下列哪一個敘述錯誤？
  options:
  - label: A
    content: 阿光命中數與投籃數的比為$6:10$
  - label: B
    content: 阿亮命中數與投籃數的比值為$\frac{3}{5}$
  - label: C
    content: 後來阿光又多投了 10 球，如果要將命中率提高為 8 成，則他必須在這 10 球中投進 10 球
  - label: D
    content: 因為阿光投進 6 球，而阿亮只投進 3 球，所以阿光的命中率比較高
- id: doc_113_高雄_翠屏_數學_g7s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 下列四個敘述甲與乙關係的選項中，哪一個與其他三個不同？
  options:
  - label: A
    content: 甲的$a$ 倍等於乙的$b$ 倍
  - label: B
    content: 甲：乙$=a:b$
  - label: C
    content: 甲是乙的$\frac{a}{b}$倍
  - label: D
    content: 甲：乙的比值為$\frac{a}{b}$
