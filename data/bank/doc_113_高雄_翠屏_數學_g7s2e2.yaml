  section: 1
  number: 8
  type: single
  page: 1
  stem: 下列敘述中，哪一個選項的 $y$ 與 $x$ 成反比？
  options:
  - label: A
    content: 時速 $80$km，行駛 $x$ 小時，共走了 $y$ km
  - label: B
    content: 小寶有 $1000$ 元，剛好可以買 $x$ 元的書 $y$ 本
  - label: C
    content: 已知一內角為 $50^\circ$ 的三角形，另兩個內角分別為 $x^\circ$、$y^\circ$
  - label: D
    content: 三角形的高為 $5$ 公分，三角形的面積 $y$ 平方公分與底 $x$ 公分
