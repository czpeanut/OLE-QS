  stem: 「台積電於2024年2月24日正式啟用熊本廠，並在今年內開始量產。《彭博社》指出，一般一座晶圓廠需要費時3年才能完工，台積電卻繳出極為驚人的速度，台積電熊本廠從2022年宣布動土至今，短短兩年時間已經即將啟動生產，原因在於日本政府的支持、24小時輪班建設的勞工及合作夥伴索尼（Sony）協助打點所造就。日本政府投資半導體的決心，便是首要原因，光是補助的果決方面，就可窺見一二，早在2022年6月日本政府就通過台積電熊本廠補助案，給予最高4,760億日圓（約新台幣1,014億元）的設廠補助，近日甚至傳出計畫為二廠提供7,300億日圓（約新台幣1,555億元）補貼。索尼（Sony）是台積電多年的合作夥伴，也是熊本廠的出資方之一。」根據上文，台積電在日本順利設廠，有賴三大要素的取得與配合，其中<u>未包括</u>下列哪一項？
