  stem: 下列關於近體詩格律的敘述何者正確？
  options:
  - label: A
    content: 絕句須一韻到底，不可換韻；律詩因句數多，可彈性換韻
  - label: B
    content: 用字有平仄限制，平聲包含古音聲調的平、上，仄聲包含去、入二聲調
  - label: C
    content: 絕句無對仗限制，律詩的頷聯、頸聯須對仗
  - label: D
    content: 包含絕句與律詩，為唐代獨有的詩歌體裁。
