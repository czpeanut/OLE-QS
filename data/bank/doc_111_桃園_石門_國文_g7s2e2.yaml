- id: doc_111_桃園_石門_國文_g7s2e2_s5_10
  section: 5
  number: 10
  type: single
  page: 1
  stem: 下列關於〈石虎是我們的龍貓〉的文句詮釋，何者正確？
  options:
  - label: A
    content: 「沒有石虎，山林彷彿被掏空心臟，靜寂地存在。」石虎的存亡與淺山生態環境息息相關
  - label: B
    content: 「石虎便是──牠像現實世界裡的龍貓，幫我們為淺山鑲嵌了一顆璀璨的寶石。」石虎是淺山最具商業價值的動物
  - label: C
    content: 「桃竹苗到處都是桐花，有些鄉鎮可以強調自己的特色，委實不缺它們來點綴，三義便是。」三義應以桐花作為觀光特色
  - label: D
    content: 「很高興石虎的出現，讓我們有了一個新契機，認真地看待淺山美學，嚴肅地反省郊野跟城鎮的關係。」強調山林潛在的經濟價值。
  lesson_raw:
    title: 石虎是我們的龍貓
    basis: 題目引用課名〈石虎是我們的龍貓〉
- id: doc_111_桃園_石門_國文_g7s2e2_s5_11
  section: 5
  number: 11
  type: single
  page: 2
  stem: 下列關於中國書法名家和作品的敘述，何者正確？
  options:
  - label: A
    content: 張旭以隸書聞名，代表作有〈肚痛帖〉、〈古詩四帖〉
  - label: B
    content: 顏真卿以楷書聞名，字體瘦勁，遒健嚴謹，被稱為「顏體」
  - label: C
    content: 柳公權長於楷書，字體雄強渾厚，筋肉飽滿，展現盛唐氣象
  - label: D
    content: 王羲之長於行書，被尊稱為「書聖」，代表作品有〈快雪時晴帖〉。
- id: doc_111_桃園_石門_國文_g7s2e2_s5_12
  section: 5
  number: 12
  type: single
  page: 2
  stem: 下列〈放天燈是傳統，還是為山林製造更多垃圾〉的文句，何者解釋放天燈習俗的由來？
  options:
  - label: A
    content: 放天燈很浪漫，人們可以在七彩的天燈表面上寫下自己的心願，再點燃火種，藉由熱空氣上升的原理，將願望上達天聽
  - label: B
    content: 早年先民來臺開墾十分寮地區時，年節時分常受到外敵侵辱，因此老弱婦孺會到外地避難，等待作為信號的天燈施放後歸來，並逐漸演變為十分地區的特有文化
  - label: C
    content: 新北市政府所舉辦的「平溪天燈節」，今年也邁入第二十一個年頭，不論在傳統文化意義與觀光經濟效益上，天燈都有不可或缺的重要性與代表性
  - label: D
    content: 現在最重要的，是臺灣民眾自發性地減少、甚至不要再施放天燈，漸漸改變觀念，總有一天能讓施放天燈的垃圾愈來愈少。
  lesson_raw:
    title: 放天燈是傳統，還是為山林製造更多垃圾
    basis: 題目引用課名〈放天燈是傳統，還是為山林製造更多垃圾〉
