- id: doc_111_桃園_石門_國文_g7s2e2_s6_34
  section: 6
  number: 34
  type: single
  page: 4
  stem: 根據本文，下列敘述何者錯誤？
  options:
  - label: A
    content: ChatGPT 無法判斷內容的道德程度，因此依然可能產出偏見、歧視或仇恨的言論
  - label: B
    content: 生成式AI 採用既有的內容創造作品，存在侵犯智慧財產權的問題
  - label: C
    content: ChatGPT 能根據網路的大量資料進行整理與學習，提供正確答案
  - label: D
    content: 最有可能被ChatGPT 取代的工作以辦公室靜態工作為主。
  group_stem: '（四）

    ChatGPT 怎麼玩？ChatGPT 應用攻略

    網路上一則則與ChatGPT 的對話，過去傳說中的人工智慧，不再是與電腦下棋的高智商，更可以是協助使用者日常的談話對象，喊了許久的AI 狂潮瞬間引爆，推動這波狂潮的ChatGPT
    是什麼？使用什麼樣的技術？我們的工作會怎麼改變？

    ChatGPT 是什麼？


    ChatGPT 是一款聊天機器人，它會生成類似人類會寫出來的文字。ChatGPT 可以自然地回答眾多問題，可以為使用者整理各種資料，查找答案，但不一定正確。就技術面而言，ChatGPT
    是「文本生成」的AI 家族中，「生成式預訓練轉換器」（Generative Pre-Trained Transformer）技術的最新發展。它採用深度學習，根據從網路上獲取的大量文本樣本進行訓練。

    ChatGPT 應用的生成式AI（Generative AI）是什麼？


    生成式AI 是指能夠生成新穎內容的人工智慧軟體，可以產出文章、程式碼、歌曲和藝術畫作。它借鑒現有的、人造的內容來創造自己的作品，因此目前也有較高的倫理疑慮。OpenAI
    的聊天機器人ChatGPT、製作圖像的DALL-E 和Google的語言模型LaMDA 都是生成式AI 的代表。

    ChatGPT 限制和缺點


    目前的機器人都是透過網路上海量資訊來建立回答，所以也可能吸收垃圾資訊，再吐出更多垃圾資訊，專長AI 和機器學習的埃默里大學教授薩格提醒，這樣的模型訓練人工智慧去猜測什麼聽起來合理，但不是判斷什麼是真實。可能延續或強化偏見與歧視，甚至擁護仇恨言論如納粹思想。關於這點，Google
    和Amazon 之前都承認，它們的AI 存在「道德風險」，還是需要人類介入。

    AI 會取代什麼工作？


    人工智慧的進步，或許不只代表會把任務自動處理掉並替人類節省時間，也可能取代部分工作。美國卡內基梅倫大學電腦科學教授克尼策認為風險最高的4 類白領工作：

    1.科技工作（程式設計師、軟體工程師、數據分析師）

    2.金融工作（金融分析師、個人理專）

    3.法律工作（法律助理）

    4. 媒體工作（行銷、內容創造、技術寫作、新聞）

    （節錄自網站《天下雜誌》）'
