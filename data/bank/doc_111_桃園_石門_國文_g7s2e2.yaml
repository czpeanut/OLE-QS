- id: doc_111_桃園_石門_國文_g7s2e2_s6_31
  section: 6
  number: 31
  type: single
  page: 3
  stem: 根據本文，蔣渭水因何事入獄？
  options:
  - label: A
    content: 殺人罪
  - label: B
    content: 詐欺罪
  - label: C
    content: 竊盜罪
  - label: D
    content: 政治罪。
  group_stem: '（三）

    監獄和病院可看作一種的精神病院。法院是診療室，監獄是病室，所入的患者是要隔離的傳染性精神病患，所以也可看作一種精神的避病院。但是病類卻不像普通的精神病，如果東京巢鴨那種的精神病院所入的是惡性精神病如誇大妄想狂（葦原將軍）、燥鬱狂等，監獄的患者是良性的，如情病、盜竊病、詐欺病乃至如我們的政治病。法院的判官、檢察官可看作醫長、醫員。在臺灣這個地方要對內地①吸收人才很是困難，像北醫院，論設備可算是東洋第一，論醫員卻很缺乏高手，多的是庸醫，且要盲從上峰方針，不得照學術的良心自由發揮手腕，很是束縛。所以時或有一二硬官醫士也不願久留，致使該院有其名沒有其實，大辜負了市民的期待。今這個法的病院的狀況怎樣呢？如市上私立醫院的醫士，有可免入院的也診斷是要入院，沒有服藥以得其不當利得的錢，算是學術的詐欺罪，應加倍處罰。而我們的法的病院不知道有這個學術的詐欺沒有呢？

    注 ①內地：本國。指日本當地。

    （節錄自蔣渭水〈入獄感想〉）'
