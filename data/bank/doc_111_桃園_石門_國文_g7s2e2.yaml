  page: 1
  stem: 下列關於〈跳水〉的詩句詮釋何者正確？
  options:
  - label: A
    content: 「湛藍」既是跳水者專注的水池，亦象徵他美好的憧憬
  - label: B
    content: 「從容的曲線」形容跳水者毫無贅肉的健美身軀
  - label: C
    content: 「青春」一詞指出喜愛跳水的觀眾以年輕族群為主
  - label: D
    content: 「雪白」形容跳水者表現不佳，觀眾的反應冷淡。
  lesson_raw:
    title: 跳水
    basis: 題目引用課名〈跳水〉
