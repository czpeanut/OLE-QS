  number: 14
  type: single
  page: 3
  stem: '新冠狀病毒疫情情勢嚴峻，學校要求每位同學每日做好自主健康管理，以班級為單位確實登記當天學生測量的體溫。如發現有不適、感冒症狀、咳嗽或體溫超過37.5°C
    者，請立即佩戴口罩就醫，並在家休養。下圖為某一天小恩記錄班上每位同學體溫後，老師所製作的累積次數分配表：


    | 體溫(度) | 累積次數(人) |

    | :--- | :--- |

    | 35～35.5 | 6 |

    | 35.5～36 | 18 |

    | 36～36.5 | 25 |

    | 36.5～37 | 28 |

    | 37～37.5 | 30 |


    根據累積次數分配表，以下哪句可能是當天老師回報給學校班上體溫狀況的說法？'
