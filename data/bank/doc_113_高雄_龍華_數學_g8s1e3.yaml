- id: doc_113_高雄_龍華_數學_g8s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '判別下列有幾個是一元二次方程式？

    (甲) $2x-5=0$

    (乙) $(2x-1)(x+7)$

    (丙) $-3x^{2}+15x=-2$

    (丁) $6x^{2}+5x=6x^{2}+25$

    (戊) $2x^{2}+5x-2=(2x+1)(x-2)$

    (己) $(x+2)(x-5)=(x-5)$'
  options:
  - label: A
    content: '1'
  - label: B
    content: '2'
  - label: C
    content: '3'
  - label: D
    content: '4'
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 數學
      code: 4-1
      title: 因式分解法解一元二次方程式
      chapter: 第4章 一元二次方程式
    textbook: 八上 4-1 因式分解法解一元二次方程式
    labeled_by: ai
- id: doc_113_高雄_龍華_數學_g8s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 依下列步驟解方程式：$3x^{2}+x-2=2x^{2}+5x+3$，則哪一個步驟開始出現錯誤？
  options:
  - label: A
    content: 因式分解得$(3x-2)(x+1)=(2x+3)(x+1)$
  - label: B
    content: 消去$(x+1)$得$3x-2=2x+3$
  - label: C
    content: 化簡得$x=5$
  - label: D
    content: 以上皆無出現錯誤
  tags:
