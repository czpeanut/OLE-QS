  group_stem: '(二)

    晉武帝親祀南郊，禮畢，喟然問司隸校尉劉毅曰：「朕可方漢之何帝也？」對「可方桓、靈。」帝曰：「吾雖德不及人，猶克己為政。又平吳會，混一天下。方之桓、靈，其已甚乎！」對曰：「桓、靈賣官，錢入官庫；陛下賣官，錢入私門。以此言之，殆不如也。」帝大笑曰：「桓、靈之世，不聞此言。今朕有直臣，固為勝之。」

