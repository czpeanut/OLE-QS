  - label: C
    content: 活著不一定平安，平安不一定快樂
  - label: D
    content: 艷艷紅花隨雨落，落雨隨花紅艷艷。
- id: doc_113_高雄_鼎金_國文_g8s2e1_s4_7
  section: 4
  number: 7
  type: single
  page: 2
  stem: 下列各組對聯與題辭，何者運用的情境相同？
  options:
  - label: A
    content: 百年恩愛雙心結／千里姻緣一線牽—美輪美奐
  - label: B
    content: 當年幸立程門雪／此日空懷馬帳風—桃李興悲
  - label: C
    content: 青山巍巍英名不朽／流水淙淙精神長存—秦晉之好
  - label: D
    content: 德如膏雨都潤澤／壽比松柏是長春—弄瓦徵祥。
- id: doc_113_高雄_鼎金_國文_g8s2e1_s4_8
  section: 4
  number: 8
  type: single
  page: 2
  stem: 法治教育漫畫比賽徵稿，喜歡歷史的小遷想以張釋之執法的內容做為主題參賽，請問他對這篇文章的重點掌握何者錯了？
  options:
  - label: A
    content: 詳盡敘述案發經過，法治思想發人深思
  - label: B
    content: 以第三人稱的角度記述事件，保持史家的客觀性
  - label: C
    content: 全文運用順序法寫案發、審案的過程，條理清楚
  - label: D
    content: 透過對話描寫事件過程，人物形象鮮活。
  lesson_raw:
    title: 張釋之執法
    basis: 題幹提及〈張釋之執法〉
- id: doc_113_高雄_鼎金_國文_g8s2e1_s4_9
  section: 4
  number: 9
  type: single
  page: 2
  stem: 「遠近的炊煙，成絲的、成縷的、成捲的，輕快的、遲重的、濃灰的、淡輕的、慘白的，在靜定的朝氣裡漸漸地上騰，漸漸地不見，彷彿是朝來人們的祈禱，參差地翳入了天聽。」在這句話徐志摩是如何描述炊煙，讓文句有了創新的意味，也更能打動人心？
  options:
  - label: A
    content: 用觸覺印象表現視覺印象
  - label: B
    content: 用聽覺印象表現視覺印象
  - label: C
    content: 用視覺印象表現聽覺印象
  - label: D
    content: 用聽覺印象表現觸覺印象。
- id: doc_113_高雄_鼎金_國文_g8s2e1_s4_10
  section: 4
  number: 10
  type: single
  page: 2
  stem: 關於〈空城計〉一文的理解，下列何者正確？
  options:
  - label: A
    content: 「莫非諸葛亮無軍，故作此態」→此為司馬懿決定退兵的關鍵因素
  - label: B
    content: 「吾兵止有二千五百，若棄城而走，必不能遠遁。得不為司馬懿所擒乎？」→說明孔明使用空城計的原因
  - label: C
    content: 「孔明登城望之，果然塵土沖天」→孔明調兵有方，安排大批援軍前來相救
  - label: D
    content: 「懿看畢，大疑，便到中軍，叫後軍作前軍，前軍作後軍」→司馬懿下令大舉進攻。
  lesson_raw:
    title: 空城計
    basis: 題幹提及〈空城計〉
- id: doc_113_高雄_鼎金_國文_g8s2e1_s4_11
  section: 4
  number: 11
  type: single
  page: 2
  stem: 關於〈拍痰〉此文的閱讀理解，何者錯誤？
  options:
  - label: A
    content: 以「與同鄉用流暢的母語談笑」與「在病房時的那種緊張羞怯」對比出外籍看護工作與休憩時的不同面貌。
  - label: B
    content: 用「拖出來晾的冬天厚棉被」、「陽台上安靜曬太陽的盆栽」來譬喻被推至戶外曬太陽的病人因久病而失去活力的狀態。
  - label: C
    content: 「她們遠渡異國，含著那塊濃痰」、「卻沒有人想要幫她們化痰」所描述的痰是暗指看護們內心積鬱的情感。
  - label: D
    content: 「只會拍痰的她們懂得最少」意指是外籍看護們較不懂人情世故；「卻懂得最多」意指外籍看護們經驗老道，照顧病人技巧嫻熟。
  lesson_raw:
    title: 拍痰
    basis: 題幹提及〈拍痰〉
