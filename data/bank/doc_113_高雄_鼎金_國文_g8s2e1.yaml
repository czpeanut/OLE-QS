- id: doc_113_高雄_鼎金_國文_g8s2e1_s5_33
  section: 5
  number: 33
  type: single
  page: 5
  stem: 依據內容，為什麼知伯要「鑄大鐘遺仇由之君」？
  options:
  - label: A
    content: 表現大國的休休大度
  - label: B
    content: 打算設計誘敵開路
  - label: C
    content: 欲直接生擒仇由之君
  - label: D
    content: 遵照先禮後兵的傳統。
  group_stem: '（四）

    知伯將伐仇由，而道難不通，乃鑄大鐘遺仇由之君。仇由之君大說，除道將內之。赤章曼枝曰：「不可。此小①之

    所以事大②也，而今也大以來，卒必隨之，不可內也。」仇由之君不聽，遂內之。赤章曼枝因斷轂③而驅，至於齊。

    七月，而仇由亡矣。 —韓非子

    注釋：①小：小國 ②大：大國 ③轂：車輪中心的圓木。'
