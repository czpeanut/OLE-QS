- id: doc_113_高雄_鼎金_國文_g8s2e1_s5_35
  section: 5
  number: 35
  type: single
  page: 5
  stem: 下列何者不是在皮膚深層和肌腱裡的「成纖維細胞」的功用？
  options:
  - label: A
    content: 增加骨骼或骨組織等的堅韌度
  - label: B
    content: 不斷產生膠原蛋白，使皮膚組織變得更健康
  - label: C
    content: 分泌膠原蛋白，把斷裂的肌腱重新連接起來
  - label: D
    content: 用來支撐與提供身體的細胞和器官的能量與營養。
  group_stem: '（五）

    身體中大多數的蛋白質是用來支撐細胞器官的，而骨骼、皮膚、肌腱，以至於軟骨組織等的堅韌度，都是由韌性強而呈纖維狀的「膠原蛋白」所提供的。在皮膚深層和肌腱裡的「成纖維細胞」，能不斷地產生膠原蛋白，使皮膚受到燙傷或肌腱受到外傷時，「成纖維細胞」會大量分泌膠原蛋白，把受到破壞和斷裂的部分重新連接起來，是身體自癒力的一種機制。

    身體受到外來病原體入侵時，受到感染的部分首先會引起發炎反應，這是身體因入侵者所發出的警訊，受到感染的細胞會釋放出發炎反應物質，如組織胺、前列腺素、白三烯酸等。發炎反應物質會增加局部血管的通透性，因而產生紅腫和疼痛的現象，讓血液能大量注入受感染的地方。此外，發炎反應物質可通報中樞神經系統，使白血球能迅速派遣到受感染的部位以消滅入侵者，而嗜中性白血球、巨噬細胞及活化的淋巴球是主要防禦細胞、病毒入侵的免疫細胞。

    一旦病原體被清除後，發炎反應的訊息隨即消除，跟著取而代之的是收拾因病原體入侵所造成的破壞，這就是所謂的「抗發炎」反應。這時候，脂肪細胞會適時釋放出「抗發炎」的二十碳脂肪酸以修補戰場。嚴格來說，發炎反應扮演著敵前偵察部隊和善後工作的角色，也是身體自然治癒力呈現的一種機制。

    由於內在基因變異和外在癌症誘導物的因素，使得人體中不斷地產生癌細胞，可幸的是，人體中的免疫系統可識別癌細胞並把它消滅。可是，當人體免疫力下降時，癌細胞便有機可乘，繼續增生而成癌細胞腫瘤。在抵抗內生性的癌細胞時，免疫系統中的輔助型T
    細胞扮演非常關鍵性的角色。當輔助性T 細胞偵察到癌細胞時，會釋放出不同的細胞因子來激活巨噬細胞、自然殺手細胞和殺手T 細胞，以圍攻並殲滅癌細胞。'
