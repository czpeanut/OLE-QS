  - label: C
    content: 人們常以為犯小錯無傷大雅，哪知更大的失敗常是由小過導引而來的(雪萊)
  - label: D
    content: 千萬人的失敗，都是失敗在做事不澈底，往往做到離成功還差一步就終止不做了(莎士比亞)
