  - label: D
    content: 作者認為失敗不可怕，關鍵是自己要能調整心態，將失敗拋諸腦後。
  group_stem: '（三）

    心理學家曾做過一個有趣的實驗：讓人在小小的繡花針上穿線，這時，你越是全神貫注，你的手就抖得越厲害，線就越不容易穿入。在醫學界，這種現象被稱作「目的顫抖」，即目的性越強越不容易成功。

    其實，每個人對於所做的很多事，都不能保證百分之百的成功。這是正常的事。那麼，為什麼不給自己一個失敗的心理準備呢？為什麼不能用正常的心態正視失敗呢？要知道，失敗是痛苦的，但失敗並不可怕，也並不是所有的失敗都是災難。世事難料，不是每個人都能走到人生最輝煌的頂點。第二次世界大戰結束之後，名揚四海的大政治家邱吉爾參加首相競選，當秘書告訴他「落選了」時，他卻爽朗一笑說：「民主勝利了，我追求的是民主。」他雖然競選失敗，但同樣輝煌。他的失敗，標誌著他曾經擁有過。他能正視失敗，說明他的內心足夠強大。

    失敗了，關鍵是要找到失敗的原因。失敗後的思考比成功後的歡樂更有價值。也許你的努力還不夠，也許客觀條件不允許，也許有意外的因素在作祟。然後，就像為自己的人生這場考試交了一次學費一樣，用明智的眼光去審視自己的失敗。如果是因驕狂而失敗，就要學會謙遜內斂；如果是因輕敵而失敗，就要學會審慎行事；如果是因自不量力而失敗，就要學會尊重客觀實際；如果是因能力不夠而失敗，就要告誡自己加倍努力。總之，只要失敗不失志，把成功當作成功的種子，堅持不懈地去耕耘，總有一天這顆種子會長成參天大樹。

    每個人在人生道路上都會遇到挫折和失敗。弱者在挫折和失敗面前嘆息，絕望。只有強者，會越挫越勇，不達目的誓不罷休。一個人要有所成就，就必須要接受失敗，忍受失敗的折磨，在失敗中磨礪自己、豐富自己、完善自己，使自己更有力量，使自己的內心更加強大。

    如果做到了這一切，失敗的背面就是成功。 —曾祥伍 失敗的背面'
