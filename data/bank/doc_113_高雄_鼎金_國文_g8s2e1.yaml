  stem: 下列何項最適合作為本篇標題？
  options:
  - label: A
    content: 方向比速度更重要
  - label: B
    content: 最優秀的人往往是「懶人」
  - label: C
    content: 壓力有損健康也降低工作效率
  - label: D
    content: 把注意力集中到結果上
  group_stem: '(ㄧ)

    對待壓力有兩個方面的途徑：一個是身體方面的，一個是心理方面的。

    首先，在身體方面，我們可以持之以恆地運動，特別是做「有氧運動」。例如：游泳、跳繩、踩自行車、慢跑、急步行走與爬山等。這些運動不僅能夠讓血液循環系統運作得更有效率，還能夠強化我們的心臟與肺功能，直接地增強腎上腺素的分泌，讓整個身體的免疫系統強大起來，進而有更強的「體質」去應付生活中隨時可能出現的各種壓力。

    許多超級富翁都酷愛運動。事實上，身體肌肉的勞動，能夠讓全身心得到鬆馳，並讓我們的大腦有一個適當的休息機會。只有強健的身體，才是十足的成功的能源。此外還可以利用其他有效的自助法來排除壓力，例如循序式肌肉放鬆法、靜坐、自我催眠和練習吐納（呼吸）等。

    在心理方面，心理學家視個人的情況而給予的個別指導和心理治療，仍然是個人學習應付壓力的最佳方法。

    世上所謂的道德家、宗教家等，一味地大力鼓吹「嚴以律己」的思想，使人們把壓力生活視為正常。這往往造成身心的緊張。想要踏上成功的人生，首先要消除這種緊張感，達到身心的放鬆。即使緊張是天生的，也要靠人為的努力舒緩緊張。（吉爾步雷思
    勤奮的人未必成功）'
