  stem: 根據本文，下列說明何者正確？
  options:
  - label: A
    content: 「烏龍」一詞常在生活中出現
  - label: B
    content: 「烏龍」一詞是從英國傳進來的
  - label: C
    content: 「烏龍」在傳說中指為黑色的龍，跟傳說中的青龍一樣能降下甘霖
  - label: D
    content: 「烏龍」可指事情是在意料之中的發展。
  group_stem: "（一） 經常看球的朋友，常聽說「烏龍球」；痴迷炒股的朋友，也經歷過「烏龍指」事件；在平時生活中「鬧笑話、弄錯事」，我們常說「擺烏龍」；看過影視電影裡的烏龍院，也喝過香氣濃郁的烏龍茶。不禁要問，何為「烏龍」？它源自哪裡？是傳說中的龍嗎？\n\
    \  從語言的角度說，現代烏龍來歷大約是這樣的：英語「own goal」（自己打進本方球門的球）與粵語的「烏龍」一詞發音相近，而粵語「烏龍」有「搞錯」意思，大約在上個世紀六、七十年代，香港記者便在報導中以「烏龍」來翻譯「own\
    \ goal」。\n  那麼「烏龍」一詞有什麼典故呢？烏龍本意就是黑色的龍，是傳說中的神獸，通體黑色，是一種降臨災難的瘟神。烏龍之所以現在演變成搞錯、做糊塗事的代名詞，是源自一個「擺烏龍」的廣東民間傳說：說的是久旱之時，人們祈求青龍降下甘露，以滋潤萬物，可不曾想，青龍沒盼來，卻把黑龍等來了，暴雨越下越大，導致洪水泛濫成災，反而給人們帶來了巨大的災難。所以到現在，就有做出了與本意相違背，或者適得其反的意思。\n\
    （每日頭條）\n註：烏龍指：指股票交易員、操盤手等在交易的時候，不小心按錯了價格、數量等事件的統稱。"
