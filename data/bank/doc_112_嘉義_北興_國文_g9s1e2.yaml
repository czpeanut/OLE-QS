  stem: 根據本文，關於 168 斷食法，下列說明何者正確？
  options:
  - label: A
    content: 執行168 斷食法，是指不食的時間8 小時，進食的時間16 小時，適當採取低醣飲食達到減重效果
  - label: B
    content: 需要依照自己的身體狀況執行，慢性病患者、高齡長者應該詢問醫生後再執行
  - label: C
    content: 168 斷食法是想利用不食的時間 讓吃進食物的熱量完全消耗完畢，所以不須再運動
  - label: D
    content: 168 斷食法，最簡單且最容易達成，即使初次嘗試斷食減肥的人也可以輕鬆執行不影響健康。
  group_stem: "（二）168 間歇性斷食法\n減重飲食 3 大原則\n  想要達到高效減重成果，除了維持穩定運動量，還必須搭配飲食才能見效。「飲食時間」「總熱量」與「飲食內容」都會影響減肥成效，例如「168\
    \ 斷食法」就是選擇在固定的時間裡，適當採取低醣飲食達到減重效果。\n\n斷食法為什麼有效？\n  斷食法最重要的是斷食「時間」要足夠，才能進入「燃脂」！在這段期間內，葡萄糖和肝醣皆被身體消耗完畢後，才會啟動燃燒脂肪作為身體能量來源，此時作適當的運動可以消耗囤積脂肪有助減重。\n\
    \n我適合哪種斷食法？\n  對一般健康成人而言，禁食時間愈長、效果就愈好，但也不是每個人都適合間歇性斷食法。52 輕斷食、168 斷食、甚至 1212 斷食法，我到底適合哪一種？\n\
    \n| | 如何實行 | 適合族群 |\n| --- | --- | --- |\n| 52輕斷食 | 一週挑2天只吃500卡/天 | 初次嘗試斷食減肥的人\
    \ |\n| 168斷食 | 1日8小時進食，其餘16小時斷食，可攝取水、茶等無熱量之飲料 | 生活作息規律，如上班族等 |\n| 隔日斷食 | 1天正常吃，隔日斷食或只吃500卡/天\
    \ | 對於減重、減脂動機較強的人，或已執行過較寬鬆斷食而想挑戰自我的人 |\n\n問與答：\nQ：糖尿病、高血脂、高血壓患者也可以斷食嗎？\nA：高血脂、高血壓患者進行斷食相對安全。肥胖專科醫師宋晏仁醫師指出，在有經驗的專家指導下，任何人都可以嘗試斷食，但是孕婦、發育中青少年與幼兒，因為要供給自已或胎兒在成長發育中更多的營養與熱量，因此不建議斷食。另外，糖尿病患者由於血糖控制不容易，進行斷食期間也需格外注意。\n\
    Q：高齡長者想進行間歇性斷食，合適嗎？\nA：原力復健科診所主治醫師王思恆指出，國外也有許多高齡者執行案例，高齡長者想嘗試間歇性斷食，若身體狀況可以接受，其實沒有問題。\n\
    （康健雜誌）"
