    乙：李天祿大師回憶道：「演布袋戲時必須講日語，木偶必須穿上日本服，拿著武士刀在臺上砍來砍去，臺下還有巡察天天監看，以免有中國文化的影子出現在劇中。」

    丙：某總督回憶道：「在臺灣施政有一大堆令人厭煩的事，臺灣動盪不安未曾停歇，……好像乞討到馬匹（比喻日本獲得臺灣），既養不起，又不會騎，只有被踢、咬……。」

