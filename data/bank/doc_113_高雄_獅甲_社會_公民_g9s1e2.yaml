- id: doc_113_高雄_獅甲_社會_公民_g9s1e2_s1_49
  section: 1
  number: 49
  type: single
  page: 2
  stem: 根據文章內容，在2019 年之前快時尚吸引消費者的競爭優勢在於下列哪一方面？
  options:
  - label: A
    content: 企業形象
  - label: B
    content: 多元化服務
  - label: C
    content: 產品品質
  - label: D
    content: 價格。
  group_stem: '【題組三】

    快時尚是指可以用很短的時間推出時裝周當中展出的潮流服飾的商業模式。快速方便、款式多樣、便宜、流行是快時尚的優點，品牌大多以平價路線吸引消費大眾，例如H&M、Zara、Forever21、無印良品與UNIQLO
    等。但2019 年9 月Forever21 宣布破產，顯示快時尚在價格方面的優勢不再，「轉型」成了快時尚品牌眼前最迫切的的課題，如H&M、GAP 宣布推出服裝租賃服務，消費者可以在店內試穿，也可以在網路上提前預訂，店內設計師還會提供穿搭建議。請回答49-50
    題：'
