- id: doc_113_高雄_獅甲_社會_公民_g9s1e2_s1_47
  section: 1
  number: 47
  type: single
  page: 2
  stem: 有關併購的敘述，下列何者正確？
  options:
  - label: A
    content: 公平會傾向通過能良性競爭的併購案
  - label: B
    content: 併購案不需要遵守《公平交易法》的規定
  - label: C
    content: 市占率愈高則愈有利新進業者參與競爭
  - label: D
    content: 頂好超市和全聯福利中心是合作關係。
  group_stem: '【題組二】

    2019 年，日本軟銀集團宣布將與南韓Naver 合作，將日本雅虎和LINE 等部門併入雙方新成立的合資公司，併購案於2020 年完成。儘管是國外的案子，但我國公平交易委員會(下列簡稱為公平會)仍會審議這件日韓二大外商集團結合案，宣布該案件不會有害國內的市場競爭。

    另外，量販龍頭家樂福在2020 年宣布，將收購頂好超市及JASONS Market Place，目標是成為我國超市市占率第二。公平會表示此併購案的審議重點是評估市占率的大小，如市占率過高，將不利於其他廠商加入競爭；但此併購若能激起廠商間的正向競爭，將使市場更具競爭力，消費者能夠享受更好的服務，則讓此併購案通過。

    目前全臺市占率最高的超市業者是全聯福利中心，有學者表示併購後雖然會對全聯產生一定的影響，但兩家的定位不太一樣，全聯以社區為核心，走大眾化、平民化，強調低價優勢；家樂福則是國際品牌，以行銷和商品的多樣性見長，兩家業者擁有不同的客群和支持度。請回答47-48
    題：'
