- id: doc_113_高雄_獅甲_社會_公民_g9s1e2_s1_39
  section: 1
  number: 39
  type: single
  page: 1
  stem: 傳統社會民眾的生活方式通常是自給自足，現代社會的人們則是透過交易來滿足生活所需為主。關於上述兩者的差異與演變，下列敘述何者較為正確？
  options:
  - label: A
    content: 現代社會的物質需求較單純，故只需交易即可滿足
  - label: B
    content: 傳統社會的民眾並不會透過交易滿足日常生活所需
  - label: C
    content: 民眾自行生產所有生活物品的相對支付成本比較低
  - label: D
    content: 民眾之間進行交易的主要原因是可以藉此降低成本。
