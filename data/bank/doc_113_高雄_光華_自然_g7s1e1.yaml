  - label: A
    content: 右側乳房:實驗組、左側乳房:對照組
  - label: B
    content: 切除交感神經:操縱變因
  - label: C
    content: 使用擠奶器對牛的兩邊乳房同時擠奶:控制變因
  - label: D
    content: 兩邊乳房排奶速度:應變變因。
  group_stem: "◎閱讀測驗I：2024 年搞笑諾貝爾生物學獎                   \n本文同步發表於「東海大學應用物理系」、「熱血科學家的閒話加長」、「量子熊」專頁。\
