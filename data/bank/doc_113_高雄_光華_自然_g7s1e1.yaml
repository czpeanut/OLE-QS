  stem: 根據上文，下列敘述何者正確？
  options:
  - label: A
    content: 牛背上的貓能顯著增加乳牛乳汁的排放量
  - label: B
    content: 給牛注射生理食鹽水，稍候又能擠出更多的乳汁
  - label: C
    content: 當乳牛受到驚嚇時會抑制排奶
  - label: D
    content: 「注射」這個動作可讓乳牛擠出比平常多出3 到5 磅的乳汁。
