- id: doc_113_高雄_光華_自然_g7s1e1_s1_48
  section: 1
  number: 48
  type: single
  page: 6
  stem: 根據上文，下列敘述何者正確？
  options:
  - label: A
    content: 乳汁經由乳頭排出與催產素的作用有關
  - label: B
    content: 乳牛在哺乳或是被擠奶時，腦垂體前葉會分泌催產素至血液中
  - label: C
    content: 實驗顯示驚嚇引起的變化來自於神經系統直接的調控
  - label: D
    content: 給牛注射腎上腺素對乳汁排放的影響跟驚嚇實驗的結果完全不同。
  group_stem: "◎閱讀測驗I：2024 年搞笑諾貝爾生物學獎                   \n本文同步發表於「東海大學應用物理系」、「熱血科學家的閒話加長」、「量子熊」專頁。\
    \ \n  \n2024 年搞笑諾貝爾生物學獎，頒給美國農業實驗站的科學家Fordyce Ely 與W.E. Petersen，得獎理由是：「在一隻站在牛背上的貓旁邊打爆一個紙袋，看看乳牛如何以及何時噴奶」這個研究。這篇論文發表於1939\
    \ 年，兩位作者早已作古，由Ely 的女兒以及孫子出席領獎。 \n話說關於乳牛的牛奶產量，物理學家之間經常講一個笑話：「牧場的主人希望提高牛奶的產量，找來一群頂尖的科學家幫忙想辦法。工程專家設計了超高效率的擠奶器；營養學家分析了飼料與水的成分，設計了給牛的新食譜；音樂家研究哪一位作曲家的音樂能夠讓牛心大悅；最後物理學家拿出紙筆算了半天，說：「我知道了！讓我們先假設真空中有一頭長得像完美圓球的乳牛，牠的乳汁均勻的向四面八方放射出去…」然後物理學家就被農場主人趕走了。\
    \ \n這是理論物理學家經常在演講中拿來自嘲的橋段，因為我們經常會把問題進行簡化，先丟掉複雜難解的部分，建立一個可以解決的模型，之後再將更複雜的東西放進來，以處理真實世界的事物。（不過到了這個階段，通常理論物理學家就對這個問題失去興趣了…）\
    \ \n對於酪農業來說，牛奶的產量可說是性命交關的大事，農家當然都希望能夠提高產量。而這與多種可能的因素有關：神經控制、內分泌調解，以及外界環境。 \n當牛在哺乳或是被擠奶，乳頭受到刺激時，腦垂體後葉分泌的催產素至血液中，促使乳腺內的肌肉細胞收縮，將乳汁經由乳頭排出。這是激素的作用，那神經系統在排乳過程中，又扮演了什麼角色呢？\
    \ \n科學家用3 頭乳牛進行了實驗，將牠們的左側乳房切除控制乳腺收縮的交感神經。手術後使用擠奶器對牛的兩邊乳房同時擠奶，並分開測量兩側之排奶速度。結果顯示，兩邊的排奶速度上幾乎沒有差異，這個結果顯示乳腺排奶並不受神經系統的直接控制。接著，科學家們對乳牛注射了催產素及腦垂體後葉提取物（不含催產素的胜肽）。結果發現，無論有沒有切除交感神經，催產素的注射都能顯著增加乳汁的排放量，使乳腺徹底排空。這些結果顯示，看起來排奶的主要驅動力還是來自於內分泌系統，尤其是催產素。\
    \ \n外界的刺激會有什麼影響呢？研究者製造強烈的聲音刺激進行測試：在牛背上放一隻貓，然後打爆紙袋，來讓牛（還有貓）嚇一跳。當牛一受到驚嚇，本來源源流出的乳汁會立刻停止排放，顯示驚嚇很明顯的會抑制排奶。不過30\
    \ 分鐘後再去擠奶，可以擠出比平常多出3 到5 磅的乳汁。意思是說，以後都要先開始擠奶，然後故意嚇牛一大跳，過30 分鐘再去擠，就可以拿到更多。各位酪農們，這一招要學起來！因為聽到紙袋爆破的聲音嚇了一跳而影響了乳汁的排放，正難道跟神經系統無關嗎？事實上兩邊乳腺的表現並無不同，可見切除交感神經對這個驚嚇實驗也沒有影響。\
    \ \n進一步的實驗顯示，驚嚇引起的變化來自於腎上腺素而不是神經系統直接的調控，直接注射腎上腺素也會導致類似驚嚇的效果。當牛受到驚嚇時，腎上腺素會被釋放到血液中。研究者給牛注射腎上腺素，發現這會導致乳汁排放停止，但在稍候又能擠出更多的乳汁，跟驚嚇實驗的結果雷同。但這會不會是因為打針的時候驚嚇到牛所以才會得到這樣的結果？這很容易證明，給牛注射生理食鹽水，完全不會造成任何影響，可見重要的是腎上腺素而不是「注射」這個動作。\
    \ \n這個研究，發表於1939/12/01 的「乳品科學期刊」（Journal of the Dairy Science）。 \n等等，牛背上的那隻貓呢？後續的實驗顯示，有沒有放那隻貓完全不會影響實驗結果，所以後來貓就去旁邊納涼了。欸不是，一般我們設計實驗不是都會從簡單的版本開始嗎？你沒事一開始就放隻貓在那邊幹嘛？我們高度懷疑，這完全是研究者個人的興趣…最後這個驚嚇實驗（特別是有貓的版本）光想像就覺得充滿了喜感，拿到搞笑諾貝爾獎，真是實至名歸啊！\n\
    \n◎備註：搞笑諾貝爾獎，雖有其戲謔成份，但得主中不乏有創意的科學實驗設計。主辦方科學幽默雜誌約於每年九月授予「乍一看好笑，後又引人深思」的十大成就，評委中有些是真正的諾貝爾獎得主。該獎項意欲表揚不尋常、推崇想像，並激起人們對科學、醫學與科技的興趣。"
