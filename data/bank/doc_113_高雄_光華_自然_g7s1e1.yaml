    \ 分鐘後再去擠奶，可以擠出比平常多出3 到5 磅的乳汁。意思是說，以後都要先開始擠奶，然後故意嚇牛一大跳，過30 分鐘再去擠，就可以拿到更多。各位酪農們，這一招要學起來！因為聽到紙袋爆破的聲音嚇了一跳而影響了乳汁的排放，正難道跟神經系統無關嗎？事實上兩邊乳腺的表現並無不同，可見切除交感神經對這個驚嚇實驗也沒有影響。\
