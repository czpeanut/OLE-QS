- id: doc_112_彰化_福興_社會_公民_g9s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 臺北市自 2000 年開始，實施垃圾費隨袋徵收的政策。依政府統計結果，2000 年臺北市的垃圾清運量是 974,016 公噸，資源回收量 48,992
    公噸；2002 年，垃圾清運量減為 741,890 公噸，資源回收量增為 221,391 公噸。請問：臺北市政府推動「垃圾費隨袋徵收」的政策是希望達到何種經濟效果？
  options:
  - label: A
    content: 透過政策提供非金錢誘因，引導市民減少垃圾量
  - label: B
    content: 透過政策提供金錢的誘因，鼓勵市民減少垃圾量
  - label: C
    content: 透過降低價格的方式，鼓勵市民自發性配合政策
  - label: D
    content: 透過增加價格的方式，降低市民資源回收的意願（習作）
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_112_彰化_福興_社會_公民_g9s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: 110 年國民健康署針對青少年吸菸行為調查結果顯示，青少年電子煙使用率由 107 年 2.7%上升至 6.6%，對青少年健康影響極大，於是政府此次修訂「菸害防制法」，主要是強化電子煙及加熱菸等新型類產品的管制法源，包括製造或輸入業者若有製造、輸入、廣告行為，處新臺幣
    1 千萬元至 5 千萬元罰鍰；使用該類菸品者，則處新臺幣 2 千元至 1 萬元罰鍰。請問：對於上述該法對違規者的處罰，與下列何種政府的行政行為相同？
  options:
  - label: A
    content: 政府提供路燈照明
  - label: B
    content: 發放中低收入補助
  - label: C
    content: 警察實施路邊臨檢
  - label: D
    content: 政府提供中小學營養午餐的補助
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
