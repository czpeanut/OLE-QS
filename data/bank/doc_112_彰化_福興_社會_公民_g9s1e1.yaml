  type: single
  page: 1
  stem: '周小瑩一家正在為四天國慶連假規劃出遊行程，以下是幾個他們考慮地點的喜好程度(星星數越多表示越喜歡)，若不考量其他因素，單純以機會成本作考慮，請問周小瑩選擇哪兩個地點的機會成本是一樣的？


    | 出遊地點 | 喜好程度 |

