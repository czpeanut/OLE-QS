- id: doc_112_彰化_福興_社會_公民_g9s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 因應國際趨勢以落實減塑，台中市環保局宣布自今年10月起實施飲料店禁一次用塑膠杯，預估此政策實施後，1年可減少 1.06 億個塑膠杯使用。針對違反規定的業者，將依「廢棄物清理法」規定，可處
    1200 元以上、6000 元以下罰鍰，呼籲業者配合政策執行，以免違規受罰，更期望能藉由此政策上路，有效減緩塑料污染對環境的危害。關於上文敘述，下列何者正確？
  options:
  - label: A
    content: 此種誘因類型與政府推動全民健保一樣
  - label: B
    content: 屬於於金錢誘因
  - label: C
    content: 屬於於非金錢誘因
  - label: D
    content: 對於所有消費者的購買行為一定有影響
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
