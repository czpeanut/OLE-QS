  number: 10
  type: single
  page: 1
  stem: '關於經濟學上的概念，下列敘述有幾項是正確的？

    (甲)王先生拿自己的退休金跨行投入餐館的經營，自己成為所謂的生產者 (乙)開店時，只有實際支付購買設備的費用才需計算機會成本 (丙)平時在旁協助的王太太，因是自己人，所以不會有成本支出
    (丁)消費者的需求行為只會受到商品價格影響'
