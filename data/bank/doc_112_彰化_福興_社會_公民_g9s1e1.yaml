  stem: 為保障行人通行安全，政府單位已修訂相關法規並於今年6月開始實施，除了提高未停讓行人罰鍰，並擴大未停讓罰責適用範圍，期望能擺脫行人地獄惡名。根據上述內容可知，政府修法的部分是修改了何種誘因？
