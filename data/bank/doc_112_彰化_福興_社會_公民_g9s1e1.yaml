  section: 1
  number: 3
  type: single
  page: 1
  stem: 誘因是能誘使人們改變原有行為的因素，依誘因的施行方式，可以分為「金錢誘因」與「非金錢誘因」兩大類。以下案例解釋誘因分類，正確的選項為何？
  options:
  - label: A
    content: 非金錢誘因：參加校園競賽優勝獲得獎金
  - label: B
    content: 非金錢誘因：政府提出國旅補助款申請，鼓勵民眾在國內旅遊
  - label: C
    content: 金錢誘因：校長在朝會時公開表揚為學校獲獎爭光的學生
  - label: D
    content: 金錢誘因：增加電動車的充電地點鼓勵購買電動車
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
