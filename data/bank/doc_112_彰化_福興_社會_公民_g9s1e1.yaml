  stem: 外送平台的崛起，雖然商品價格需要加上平台費及運費，會提高消費成本，但仍有民眾會基於個人因素而選擇外送服務，這也使得外送員成為業績與異軍突起的行業。根據內容，有關消費者分配資源，下列說明何者正確？
