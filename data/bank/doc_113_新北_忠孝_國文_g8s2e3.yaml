  group_stem: "蜀賈三人，皆賣藥於市。其一人專取良，計入以為出，不虛價亦不過取贏。一人良不良皆取焉，其價之賤貴，惟買者之欲，而隨以其良不良應之。一人不取良，惟其多賣，則賤其價，請益則益之不較，於是爭趨之，其門之限月一易，歲餘而大富。其兼取者趨稍緩，再期亦富。其專取良者，肆日中如宵，旦食而昏不足。\n\
    \    郁離子見而歎曰：「今之為士者亦若是夫！昔楚鄙三縣之尹三，其一廉而不獲於上官，其去也無以僦舟，人皆笑以為癡。其一擇可而取之，人不尤其取而稱其能賢。其一無所不取以交於上官，子吏卒，而賓富民，則不待三年，舉而任諸綱紀之司，雖百姓亦稱其善，不亦怪哉！」《郁離子．蜀賈》\n\
    \ ★注釋：僦舟：雇船"
