  group_stem: "【丙】\n    管仲 夷吾者，潁上人也。少時常與鮑叔牙游，鮑叔知其賢。管仲貧困，常欺鮑叔，鮑叔終善遇之，不以為言。已而鮑叔事齊公子小白，管仲事公子糾。及小白立為桓公，公子糾死,管仲囚焉。鮑叔遂進管仲。管仲既用，任政於齊，齊桓公以霸，九合諸侯，一匡天下，管仲之謀也。《史記‧管晏列傳》\n\
    【丁】\n    管仲有病，桓公問之，曰：「仲父之病病矣，可不諱云，至於大病，則寡人惡乎屬國而可？」管仲曰:「公誰欲與？」公曰:「鮑叔牙。」曰：「不可。其為人絜廉善士也，其於不己若者，不比於人；又一聞人之過，終身不忘。使之治國，上且鉤乎君，下且逆乎民。其得罪於君也，將弗久矣。」公曰：「然則孰可？」對曰：「勿已，則隰朋可。其為人也，上忘而下畔，愧不若黄帝而哀不己若者。以德分人謂之聖；以財分人謂之賢。以賢臨人，未有得人者也；以賢下人，未有不得人者也。其於國有不聞也，其於家有不見也。勿已，則隰朋可。」《莊子‧徐無鬼》\n\
    ★注釋：\n上忘而下畔：對上忘卻私慾，對下則親和、關愛。\n其於國有不聞也：對於不該知道的國家大事從不去打聽。\n其於家有不見也：對家裡的小事不追究、苛求。"
