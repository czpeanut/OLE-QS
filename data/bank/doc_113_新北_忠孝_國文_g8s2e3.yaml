- id: doc_113_新北_忠孝_國文_g8s2e3_s4_31
  section: 4
  number: 31
  type: single
  page: 4
  stem: 根據【甲】文，關於創面皮膚發黑的機制，下列敘述何者正確？
  options:
  - label: A
    content: 表皮細胞分泌出胺基酸，引起皮膚發黑機制。
  - label: B
    content: 紫外線照射皮膚，皮膚啟動自我防衛的機制。
  - label: C
    content: 活化酪氨酸，以酪氨酸酶為基礎轉化成黑色素。
  - label: D
    content: 新生肌膚需要大量紫外線，才能加強傷口癒合。
  group_stem: "【甲】吃深色食物會使傷疤變黑嗎？\n    在種種「忌口」的傳統說法中，燒燙傷患者不能吃深色食物，尤其是黑色食物，這大概和淺度燒傷患者創面癒合後，容易有色素沉澱有關。\n\
    \    深色食物會不會導致癒合的創面顏色發黑呢？我們來看看創面皮膚發黑的機制，引起皮膚發黑的物質叫做黑色素，黑色素是由存在表皮中的黑色細胞分泌的。當紫外線照射到皮膚上，肌膚就會處於自我防護的狀態，而啟動酪氨酸酶的活性，酪氨酸就會先被合成多巴(DOPA)，再被轉換成黑色素。\n\
    \    淺表燒燙傷患者創面癒合後的黑色素沉澱，主要是皮膚的黑色素細胞受刺激所導致，多見於暴露的部位。這種黑色素的沉積，某種程度上是一種機體的自我防護機制，因為新生皮膚比較嬌嫩，而大量的黑色素有助於對抗紫外線的損傷，其防禦措施，主要是避免日曬。如果皮膚損傷嚴重，黑色素細胞缺失，不僅不會有黑色素沉澱，反而可能因為色素脫失而形成白斑。\n\
    \   那麼深色食物能否影響黑色素合成的兩個環節：想想作為合成材料的酪氨酸和作為合成工具的酪氨酸酶，便可知答案是否定的。很多深色食物中確實富含酪氨酸，但在很多非深色食物裡，酪氨酸的含量同樣豐富，而且酪氨酸是一種可以自體合成的胺基酸。因此透過食物的控制來抑制黑色素的合成幾乎是不可能的。而酪氨酸酶就更不用考慮了，酶是一種蛋白質，它在腸胃道裡會被分解，無法透過口服的途徑進入人體皮膚。\n\
    \    因此，無論是燒傷還是其他外傷，無論手術前還是手術後，無論健康還是疾病，都無需因為食物的顏色而特別忌口，燒燙傷患者要避免癒合後的皮膚色素沉澱，只要避免日曬就可以了。\n\
    【乙】燒燙傷後的疤痕處理\n1.美白淡化色素藥膏\n  針對皮膚受傷後黑色素沉澱的問題，可使用美白淡化色素藥膏加以改善。\n2.物理性加壓\n  皮膚若有小範圍的凸出傷口，可使用矽膠片、矽膠帶來加壓改善，但至少需加壓六個月以上。\n\
    3.穿戴彈性衣或壓力衣\n  當燒傷面積較大時，視受傷部位不同而選擇穿戴不同形式的壓力衣。\n  燒傷後除疤是一種漫長的過程，須積極配合醫師或復健師指示，才能降低疤痕的出現，讓受傷的肢體功能逐漸恢復。"
