questions:
- id: doc_113_新北_忠孝_國文_g8s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 小禹在作文比賽中效法陋室銘寫出一篇情感豐富、文辭優美的文章，評審老師大為讚賞。以下哪一個成語最適合用來形容小禹的表現？
  options:
  - label: A
    content: 夢筆生花
  - label: B
    content: 有腳書櫥
  - label: C
    content: 齒德俱尊
  - label: D
    content: 拾人涕唾
- id: doc_113_新北_忠孝_國文_g8s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 小禹因為很崇拜陋室銘的作者，希望能和他一樣學識淵博、才華洋溢，請問下面成語，何者最適合用來形容小禹的偶像？
  options:
  - label: A
    content: 沽名釣譽
  - label: B
    content: 西窗剪燭
  - label: C
    content: 錙銖必較
  - label: D
    content: 腹笥甚廣
- id: doc_113_新北_忠孝_國文_g8s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 下列各句中，哪一個的成語使用是正確無語病的？
  options:
  - label: A
    content: 這些「數見不鮮」的奇觀在這裡矗立千年，讓人嘆為觀止
  - label: B
    content: 他花了好幾個禮拜準備期末考試，才在「彈指之間」完成了所有的複習
  - label: C
    content: 他雖然身居高位，但一身正氣，「兩袖清風」，生活極為清貧
  - label: D
    content: 她慢工出細活的嚴謹態度，真可謂「流星趕月」，令人佩服不已
- id: doc_113_新北_忠孝_國文_g8s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 「學校舉辦科學競賽的原意是：培養學生的創意與實作能力。但部分參賽同學誤解科學競賽的目的，於是運用小聰明，試圖從網路抄襲資料，甚至（　）地引用文章，導致參賽作品良莠不齊，錯誤百出，簡直是（　）。校方為避免重蹈覆轍，決定（　），重新調整評選機制與指導流程，避免這種情況再度發生，否則只會（　），讓外界質疑學校的教學品質。」請判斷上述文字中的括弧內依序應放入什麼成語，才是正確答案？
  options:
  - label: A
    content: 觸目驚心、旗鼓相當、 成人之美、 杯盤狼藉
  - label: B
    content: 斷章取義、濫竽充數、 改弦易轍、 貽笑大方
  - label: C
    content: 東施效顰、徇私舞弊、 坐以待斃、 怨聲載道
  - label: D
    content: 對牛彈琴、撲朔迷離、 撥雲見日、 憂心忡忡
- id: doc_113_新北_忠孝_國文_g8s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 「漏網之□、輕裘肥□、□□填海、雞□不寧、□視眈眈、□尾續貂、蜀□吠日、噤若寒□、跖□吠堯」，請問上述成語空格中，所應填入的動物名稱中，有幾個是同一種動物?
  options:
  - label: A
    content: 三個
  - label: B
    content: 四個
  - label: C
    content: 五個
  - label: D
    content: 六個
- id: doc_113_新北_忠孝_國文_g8s2e3_s2_6
  section: 2
  number: 6
  type: single
  page: 1
  stem: 下列「  」中的注音寫成國字後，何者兩兩相同？
  options:
  - label: A
    content: 銀貨兩「ㄑ一ˋ」／「ㄑ一ˋ」今
  - label: B
    content: 氣溫「ㄉㄡˇ」降／山勢「ㄉㄡˇ」峻
  - label: C
    content: 賦「ㄌ一ㄢˋ」無度／水光「ㄌ一ㄢˋ」灩
  - label: D
    content: 「ㄋ一ˋ」名／「ㄋ一ˋ」稱
- id: doc_113_新北_忠孝_國文_g8s2e3_s2_7
  section: 2
  number: 7
  type: single
  page: 1
  stem: 下列「  」中的讀音，何者兩兩相同？
  options:
  - label: A
    content: 「蠕」動／「儒」學
  - label: B
    content: 妊「娠」紋／時「辰」
  - label: C
    content: 土「阜」／商「埠」
  - label: D
    content: 「鞠」躬盡瘁／ 黃「麴」毒素
- id: doc_113_新北_忠孝_國文_g8s2e3_s2_8
  section: 2
  number: 8
  type: single
  page: 1
  stem: 下列「  」中的字，何者字音前後相同？
  options:
  - label: A
    content: 「膾」炙人口／「燴」羊肉
  - label: B
    content: 「熾」熱／獨樹一「幟」
  - label: C
    content: 「頃」刻間／「傾」斜
  - label: D
    content: 簽「署」／「曙」光
- id: doc_113_新北_忠孝_國文_g8s2e3_s2_9
  section: 2
  number: 9
  type: single
  page: 1
  stem: 下列各選項「  」中的字，何者字義前後相同？
  options:
  - label: A
    content: 而廷尉「乃」當之罰金／眾官「乃」問孔明
  - label: B
    content: 「蓋」一癩蛤蟆也／「蓋」因不得已而用之
  - label: C
    content: 廷尉「當」是也／而廷尉乃「當」之罰金
  - label: D
    content: 得不「為」司馬懿所擒乎／二蟲盡「為」所吞
- id: doc_113_新北_忠孝_國文_g8s2e3_s2_10
  section: 2
  number: 10
  type: single
  page: 1
  stem: 下列何者用字完全正確？
  options:
  - label: A
    content: 為了觀賞動物大遷徙來到東非肯亞，下塌在樹頂特色旅館，儘管它無法與其他知名旅館相媲美，但會有更多機會與野生動物近距離接觸
  - label: B
    content: 古代君王若是窮兵瀆武，造成天下生靈塗炭，最後必導致民眾抗暴而被推翻
  - label: C
    content: 這家位於北投市場旁的肉羹湯遠近馳名，肉質彈牙，在勾芡的羹湯中裡糝上特製胡椒粉，味道更加鮮美
  - label: D
    content: 這座城市自古以來文風鼎盛，是個人文匯萃的好地方，因此吸引了許多文化藝術人才在此發展
- id: doc_113_新北_忠孝_國文_g8s2e3_s2_11
  section: 2
  number: 11
  type: single
  page: 1
  stem: 下列各選項「  」中的詞性，何者與「案牘勞形」的「勞」字相同？
  options:
  - label: A
    content: 何「陋」之有
  - label: B
    content: 惟吾德「馨」
  - label: C
    content: 窮「奢」極侈
  - label: D
    content: 汝輩「焉」知
  lesson_raw:
    title: 陋室銘
    basis: 引用課文「案牘勞形」
- id: doc_113_新北_忠孝_國文_g8s2e3_s2_12
  section: 2
  number: 12
  type: single
  page: 1
  stem: 若以現代角度詮釋〈陋室銘〉所倡導的生活態度，以下哪一種人最符合作者理想中的「德馨之人」？
  options:
  - label: A
    content: 住豪宅、開名車，但喜歡閱讀與旅行的魏劭
  - label: B
    content: 追求卓越，凡事講究效能與功利的魏梁
  - label: C
    content: 雖處偏鄉，卻樂享於教書育人、著書立言的魏渠
  - label: D
    content: 一心投資理財，追求財富自由為人生目標的魏朵
  lesson_raw:
    title: 陋室銘
    basis: 題目指明〈陋室銘〉
- id: doc_113_新北_忠孝_國文_g8s2e3_s2_13
  section: 2
  number: 13
  type: single
  page: 1
  stem: 〈陋室銘〉最後引用孔子所說：「何陋之有」作結，引出此句前文「君子居之」，說明因為有君子居住，而使陋室不陋。也展現出環境不影響君子的品行。由此可知，〈陋室銘〉展現了君子的哪一種品格？
  options:
  - label: A
    content: 君子疾沒世而名不稱焉
  - label: B
    content: 君子欲訥於言而敏於行
  - label: C
    content: 君子以文會友，以友輔仁
  - label: D
    content: 君子憂道不憂貧
  lesson_raw:
    title: 陋室銘
    basis: 題目指明〈陋室銘〉
- id: doc_113_新北_忠孝_國文_g8s2e3_s2_14
  section: 2
  number: 14
  type: single
  page: 2
  stem: 下列有關〈陋室銘〉一文的說明，何者正確？
  options:
  - label: A
    content: 「斯是陋室，惟吾德馨」強調簡樸自然的生活，不受塵俗物慾所惑，有助於修養自身品格
  - label: B
    content: 「苔痕上階綠，草色入簾青」藉描寫陋室的景色蒼翠，生機盎然，可惜乏人問津，表達自己懷才不遇，孤芳自賞
  - label: C
    content: 「談笑有鴻儒，往來無白丁」藉寫平日的交遊情況，來襯托作者才德兼備，高雅脫俗
  - label: D
    content: 「孔子云：『何陋之有？』」藉孔子對諸葛亮、揚雄的評價，來表達作者以君子自期的心志
  lesson_raw:
    title: 陋室銘
    basis: 題目指明〈陋室銘〉
- id: doc_113_新北_忠孝_國文_g8s2e3_s2_15
  section: 2
  number: 15
  type: single
  page: 2
  stem: 詩文中的語句，有時因為顧及押韻、語言習慣、語氣關係等，使語序上有所變化。下列的「倒裝句」在維持語意不變的情況下，老師請同學試著將其還原，下列何者還原正確？
  options:
  - label: A
    content: 桑延：欲窮千里目→目欲窮千里
  - label: B
    content: 以凡：萬里赴戎機→萬里戎機赴
  - label: C
    content: 浩安：吾馬賴柔和→柔和賴吾馬
  - label: D
    content: 思喬：好鳥枝頭亦朋友→好鳥朋友亦枝頭。
- id: doc_113_新北_忠孝_國文_g8s2e3_s2_16
  section: 2
  number: 16
  type: single
  page: 2
  stem: 〈看雲的日子〉一文中，作者最後說：「呼嘯而過的日子，從不曾真正離去，只是換種風情繼續在天涯響遏行雲，見證一切。」請判讀文意，下列敘述何者不正確？
  options:
  - label: A
    content: 往日光景雖已遠颺，但因為有過去種種，才成就了現在的人生
  - label: B
    content: 走過的時光未曾消失，經歷過的片段已深藏心底，靜靜發酵成記憶的底蘊
  - label: C
    content: 以憂傷悵惘的筆調做結，輕輕勾勒出一種難以言說的惆悵之美
  - label: D
    content: 在雲朵的見證之下，作者將以達觀歡喜之心，繼續走向更遼闊的天涯
  lesson_raw:
    title: 看雲的日子
    basis: 題目指明〈看雲的日子〉
- id: doc_113_新北_忠孝_國文_g8s2e3_s2_17
  section: 2
  number: 17
  type: single
  page: 2
  stem: 「天地自然體現了無常的道理，無需執著擁有或失去，沒有什麼是永恆不變，也許不斷的變動才是唯一不變的真理。」下列選項中，哪一項與上面文句想要傳達的意涵相距最遠？
  options:
  - label: A
    content: 前一秒鐘雲層湧動形成厚實一片雲海，覆蓋整座山谷，過一會兒已煙消雲散，恢復青山翠綠風采
  - label: B
    content: 夏天的雲，綿密細緻，經常是一大朵一大朵獨自飄動，有時候真的像極了可口清涼的霜淇淋，讓人忍不住想飛上天咬一口
  - label: C
    content: 人生際遇變化無常，不就如天際雲彩，瞬息萬變，難以掌控捉摸，世間種種翻騰好比過眼雲煙，倏忽消逝
  - label: D
    content: 我是天空裡的一片雲，偶爾投影在你的波心，你不必訝異，更無需歡喜，在轉瞬間消滅了蹤影
- id: doc_113_新北_忠孝_國文_g8s2e3_s2_18
  section: 2
  number: 18
  type: single
  page: 2
  stem: 「世間種種翻騰好比過眼雲煙，倏忽消逝，耀眼明亮時值得喝采，黯淡孤獨時，也是另種人生歷程。」這段文字的涵義與下列何者最相近？
  options:
  - label: A
    content: 順風是歌，逆風是詩。走過的每一寸旅途，都將成為生命的養分
  - label: B
    content: 才美不外現，靜待來日一鳴驚人；爭氣不一時，需懂得韜光養晦
  - label: C
    content: 凡事只求盡其在我，竭盡全力之後，結果便可放任順其自然
  - label: D
    content: 越是嚮往高處溫暖光明的陽光，越是要扎根在黑暗潮濕的土地
- id: doc_113_新北_忠孝_國文_g8s2e3_s2_19
  section: 2
  number: 19
  type: single
  page: 2
  stem: 下列有關〈空城計〉一文的說明，何者正確？
  options:
  - label: A
    content: 「孔明傳令：『眾將旌旗，盡皆藏匿。諸軍各守城鋪，如有妄行出入及高聲言語者，立斬。』」→孔明詳述計謀，以安撫眾人，加強眾將官的信心
  - label: B
    content: 「此人料吾平生謹慎，必不弄險，見如此模樣，疑有伏兵，所以退去。」→說明孔明必須冒險使用空城計的原因
  - label: C
    content: 「丞相玄機，神鬼莫測。」→是眾官對孔明快速審度情勢與高明奧妙的計謀感到敬佩
  - label: D
    content: 「吾兵止有二千五百，若棄城而走，必不能遠遁。得不為司馬懿所擒？」→說明孔明知己知彼，是空城計成功之因
  lesson_raw:
    title: 空城計
    basis: 題目指明〈空城計〉
- id: doc_113_新北_忠孝_國文_g8s2e3_s2_20
  section: 2
  number: 20
  type: single
  page: 2
  stem: 小說中為了增加情節的戲劇效果，經常會運用對比手法呈現，請問關於〈空城計〉中下列哪個選項的分析錯誤？
  options:
  - label: A
    content: 以眾官的「駭然失色」和孔明的「撫掌而笑」作對比，反襯孔明慎謀能斷的應變能力
  - label: B
    content: 以司馬懿所領的十五萬大軍和孔明所餘的二千五百軍作對比，明確指出這場對峙的致勝關鍵無法依靠兵力
  - label: C
    content: 面對危機，作者寫出司馬懿心境上的變化，卻安排孔明的不動聲色讓人猜不透心思，形成鮮明的對比
  - label: D
    content: 司馬昭較缺乏經驗卻反倒猜透孔明的計謀，藉此與經驗豐富卻中計的司馬懿作對比，呈現司馬昭對孔明的知己知彼
  lesson_raw:
    title: 空城計
    basis: 題目指明〈空城計〉
- id: doc_113_新北_忠孝_國文_g8s2e3_s2_21
  section: 2
  number: 21
  type: single
  page: 2
  stem: 丸尾當選市議員，他今天的行程如下：九點參加忠孝國中校慶，十一點趕赴外婆壽宴，十三點參加美環的新專輯發表會，十六點和花輪一起去小丸子家慶祝她新居落成」。請問丸尾依序應該會看到那些題辭？
  options:
  - label: A
    content: 造福桑梓、懿範長存、餘音繞樑、美輪美奐
  - label: B
    content: 百年樹人、瑤池春永、玉潤珠圓、堂構更新
  - label: C
    content: 桃李芬芳、北堂萱茂、新鶯出谷、宜室宜家
  - label: D
    content: 為國育才、福壽全歸、舌燦蓮花、里仁為美
- id: doc_113_新北_忠孝_國文_g8s2e3_s2_22
  section: 2
  number: 22
  type: single
  page: 3
  stem: 根據喜帖內容，下列推論何者最為合理？
  options:
  - label: A
    content: 俊男與美麗家中可能有哥哥和姊姊
  - label: B
    content: 新郎的姓名為王俊男，新娘的姓名為江美麗
  - label: C
    content: 婚後，美麗要稱張雲蓉為婆婆
  - label: D
    content: 此宴席是由男方主辦
