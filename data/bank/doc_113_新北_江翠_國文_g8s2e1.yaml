    【七】牠們叫聲尖細、清晰，一點也不像牠們粗壯的身體發出的聲音。一般海豚的眼睛很難看到，得到牠們刻意翻身近距離和你對望時，才能有機會看入牠的眼神。鯨豚的眼神神祕、深奧，我曾經從牠們的眼裡看到了粗野、仇惡或真摯和善的笑……那眼神往往能深入胸腔搜索靈魂。然而，弗氏海豚的眼睛非常容易看到，只要牠們跳出江面，就像每一個玩具布偶總是少不了圓睜睜的眼睛。我了解，我所看到的只是牠們的一個符號標記，那並不是牠們真正的眼睛。

