- id: doc_113_新北_江翠_國文_g8s2e1_s4_1
  section: 4
  number: 1
  type: single
  page: 4
  stem: 根據文章內容，弗氏海豚對於船隻靠近的反應是什麼？
  options:
  - label: A
    content: 好奇地主動靠近船隻
  - label: B
    content: 冷漠地繼續游動，不受影響
  - label: C
    content: 顯得慌亂急躁，迅速逃離
  - label: D
    content: 發出低沉的鳴叫聲警告人類。
  group_stem: '(一)

    【二】船隻更靠近些，幾隻鐮刀狀大背鰭出現在弗氏海豚群體四周，彷彿歷史重演，這是弗氏海豚和花紋海豚混成的大群體。我們也發現幾隻瓶鼻海豚在其中湊熱鬧。船隻靠近，花紋海豚不理不睬仍然慣常地泳動前進，弗氏海豚則顯得慌亂急躁了。

    【三】牠們鐵定不喜歡船隻靠近，不像一般海豚，多少總會主動游近船邊。

    【四】當船隻經過牠們，牠們唏哩嘩啦像一條激流閃躲，像林立的保齡球瓶被撞翻成七零八落。

    【五】龐大的群體和秋風落葉散成小群，像一群頓失龍頭的散兵，毫無主見地分頭鼠竄。

    【六】我感到不安，船隻的靠近顯然侵擾了牠們，但我們只是如靠近其他種海豚般靠近而己，是我們不當介入？還是牠們過度反應？

    【七】牠們叫聲尖細、清晰，一點也不像牠們粗壯的身體發出的聲音。一般海豚的眼睛很難看到，得到牠們刻意翻身近距離和你對望時，才能有機會看入牠的眼神。鯨豚的眼神神祕、深奧，我曾經從牠們的眼裡看到了粗野、仇惡或真摯和善的笑……那眼神往往能深入胸腔搜索靈魂。然而，弗氏海豚的眼睛非常容易看到，只要牠們跳出江面，就像每一個玩具布偶總是少不了圓睜睜的眼睛。我了解，我所看到的只是牠們的一個符號標記，那並不是牠們真正的眼睛。

    【八】眼神的交融必須在安靜的感覺下互動。對於弗氏海豚，我始終無法感受牠的眼神，牠們太倉卒、太慌亂，連那剎那的安靜也捨不得給與。

    【九】牠們分裂出的每一個小群體，隨時都在變化隊形，都在改變前進方向，時而匯合成一大群，時而再度分裂散去。即使遠遠一段距離外，牠們也是如此反覆操演著不安。牠們像一圈大漩渦，盲目地在一定的範圍內盤轉。

    【十】花紋海豚散在牠們四周，像是衛兵、管理員，可能更貼切的形容是牧者，在花紋海豚圈住的範圍裡，弗氏海豚在裡頭驚躍、衝撞、盤轉。那分明是一群驚慌無措的迷途羔羊。(節錄自廖鴻基迷途羔羊――弗氏海豚)'
