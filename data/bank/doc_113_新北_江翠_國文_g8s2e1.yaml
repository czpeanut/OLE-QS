- id: doc_113_新北_江翠_國文_g8s2e1_s4_6
  section: 4
  number: 6
  type: single
  page: 6
  stem: 有關本文的情節，下列敘述何者正確？
  options:
  - label: A
    content: 馬謖因採用王平的建議而招致禍端
  - label: B
    content: 以孫武的軍法不正為借鑒而下令處死馬謖
  - label: C
    content: 蔣琬最後未能成功說服孔明收回成命
  - label: D
    content: 馬謖的家人受到牽連，生活無以為繼。
  group_stem: '(三)

    孔明又喚馬謖入帳，謖自縛跪於帳前。孔明變色曰：「汝自幼飽讀兵書，熟諳戰法。吾累次叮嚀告戒街亭是吾根本，汝以全家之命，領此重任。汝若早聽王平之言，豈有此禍？今敗軍折將，失地陷城，皆汝之過也！若不明正軍律，何以服眾？汝今犯法，休得怨吾。汝死之後，汝之家小，吾按月給與祿米，汝不必掛心。」叱左右推出斬之，……。左右推出馬謖於轅門之外，將斬。參軍蔣琬自成都至，見武士欲斬馬謖，大驚，高叫留人，入見孔明曰：「昔楚殺得臣而文公喜。今天下未定，而戮智謀之士，豈不可惜乎？」孔明流涕而答曰：「昔孫武所以能制勝於天下者，用法明也。今四方分爭，兵交方始，若須廢法，何以討賊耶？合當斬之。」
    須臾，武士獻馬謖首級於階下。孔明大哭不已。蔣琬問曰：「今幼常得罪，既正軍法，丞相何故哭耶？」孔明曰：「吾非為馬謖哭。吾思先帝在白帝城臨危之時曾囑吾曰：『馬謖言過其實，不可大用。』
    今果應此言，乃深恨己之不明，追思先帝之明，因此痛哭耳！」

    （節錄自三國演義九十六回）

    【注釋】楚殺得臣：晉、楚爭霸時，楚國大將得臣率軍與晉軍交戰，後來失敗，結果楚成王逼得臣自殺。但得臣死後，楚國沒有可以與晉國抗爭的大將了，所以晉文公大喜。'
