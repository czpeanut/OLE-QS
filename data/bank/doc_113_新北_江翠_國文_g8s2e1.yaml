    content: 菊丸：這幾天得流感渾身痠痛，昨天發高燒，心跳也跳很快了呢。
  group_stem: '(二)

    【甲】

    「噪音令人痛苦」可不是隨便說說的，根據德國 美茵茲大學的研究團隊研究報告指出，噪音會引發壓力荷爾蒙上升、活化交感神經、增加血壓和血管的收縮，而這些都有可能會傷害心臟及體內血管的健康，提高心血管代謝疾病的風險。臺灣
    陽明大學公共衛生學院的研究團隊也曾在2003 年至2015 年間持續收集並研究噪音對民眾的影響性，最後透過四萬兩千多筆的分析資料得知，長期暴露於中度噪音(60~70
    分貝)，罹患代謝症候群的風險將增加13%，長期暴露於高度噪音(70 分貝以上)，風險更顯著增加24%。

    事實上，有關噪音對人體影響的探討由來已久，最初大多關注在職業環境的噪音問題，而後逐漸擴及生活中的噪音汙染對民眾身心的傷害。世界衛生組織研究報告顯示：「噪音不但會損害聽力，還會導致憂鬱焦慮、睡眠障礙、注意力下降，提高內分泌系統及心血管疾病的發生率，甚至因聽覺刺激降低而增加罹患失智症的風險，影響不容小覻。」(改寫自羅真噪音可能致胖？住家附近噪音大，增加代謝症候群風險)

    【乙】'
