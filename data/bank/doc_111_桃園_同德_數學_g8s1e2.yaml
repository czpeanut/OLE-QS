  page: 4
  stem: '紹宇想要寄一些玩具給在南部的堂弟，於是他去研究黑貓宅急便的配送方法及價位，如下表。紹宇思考後決定購買黑貓宅急便的紙箱來送件，但紹宇眾多的玩具中有一根長39cm
    的長笛玩具且玩具總重量為3.7kg，紹宇寄件時所有的玩具都必須可以安全地放在箱內。請回答下列問題：

    (1)紙箱B 的包裹尺寸為多少?(2 分)

    (2)哪些紙箱可以讓紹宇的玩具都安全的放在箱內?(2 分)

    (3)如果在只買一個紙箱且花費最少的情況下寄送，紹宇選擇哪一種紙箱比較好?總費用為多少錢?(4 分)

    (好用的資訊：$21^{2} = 441$、$23^{2} = 529$、$24^{2} = 576$、$25^{2} = 625$、$27^{2} = 729$、$39^{2}
    = 1521$)

    ※提示：長方體內最大的對角線長度＝$\sqrt{長^{2} + 寬^{2} + 高^{2}}$


    | 類型 | 紙箱A | 紙箱B | 紙箱C |

    | :--- | :--- | :--- | :--- |

    | 規格<br>(長x 寬x 高) | 24cm x 20cm x 16cm | 25cm x 24cm x 21cm | 30cm x 27cm x 23cm
    |

    | 原價 | 20 元 | 40 元 | 60 元 |

    | 重量上限 | 1kg | 2kg | 4kg |

    | 運費 | 130 元 | 170 元 | 210 元 |


    注意事項：

    1、若超過該尺寸對應之重量上限，則每超過 1kg 加收 50 元，不足1kg 以1kg 計。

    2、包裹尺寸上限不得超過90cm、重量上限不得超過8kg。

    3、「包裹尺寸」指的是物品的長寬高三邊合計，正確測量方式為：

    長○A 、寬○B 、高○C 相加之總和，所以○A ＋○B ＋○C ＝包裹尺寸(cm)'
