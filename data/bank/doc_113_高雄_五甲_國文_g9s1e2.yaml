- id: doc_113_高雄_五甲_國文_g9s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 以下是一則論文摘要：「本文旨在說明臺灣國民小學至大學學生閱讀興趣與閱讀素養的關係，以及不同學齡階段的讀寫素養表現。不論年級，閱讀興趣與閱讀素養有正相關聯，然由一般學生投資於閱讀的時間反映出閱讀興趣有加強之必要。」若要以這段文字的核心概念標示一組關鍵詞，下列何者最恰當？【會考考古題】
  options:
  - label: A
    content: 臺灣、學齡階段
  - label: B
    content: 國民小學、大學
  - label: C
    content: 正相關聯、閱讀時間
  - label: D
    content: 閱讀興趣、閱讀素養
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_高雄_五甲_國文_g9s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 「商代人只在上、下午各吃一餐，因為農業社會耕作頗費體力，早上剛好補充精力，下午太陽將西下，無法再工作，不如早睡早起，故不必吃得多。春秋晚期以來，隨著牛耕鐵器的廣泛使用，尤其是戰國時代鐵器的普及，生產力大大提高。社會的面貌起了很大的變化，人們的生活內容漸漸豐富起來，許多人開始在夜間從事非生產性的工作，富人娛樂活動增加，便多一餐以補充體力。」根據這段文字，古人從兩餐變成三餐的原因，與下列何者最不相關？【會考考古題】
  options:
  - label: A
    content: 社會形態改變
  - label: B
    content: 夜間活動增加
  - label: C
    content: 耕作時間延長
  - label: D
    content: 鐵器廣泛使用
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_高雄_五甲_國文_g9s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 蘇軾〈西江月〉：「世事一場大夢，人生幾度新涼？夜來風葉已鳴廊，看取眉頭鬢上。 酒賤常愁客少，月明多被雲妨。中秋誰與共孤光，把盞凄然北望。」下列關於詞句的說明，何者最不恰當？【會考考古題】
  options:
  - label: A
    content: 「看取眉頭鬢上」表達自己年華老去
  - label: B
    content: 「酒賤常愁客少」意調難以維持生計
  - label: C
    content: 「月明多被雲妨」比喻美好的事物不可能長久
  - label: D
    content: 「中秋誰與共孤光」流露想與親友團聚的心願
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_高雄_五甲_國文_g9s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 「漢朝刺史巡視的要點有六：一看地方豪強是否倚勢強凌弱，二看郡守、公侯是否損公肥私，三看高官辦案是否草菅人命，四看官員是否任人唯親，五看高官子弟是否仗勢欺人，六看官員是否勾結地方豪強、牟取不法利益。」根據這段文字，漢朝刺史的職責最可能是下列何者？【會考考古題】
  options:
  - label: A
    content: 訪察並薦舉優秀人才
  - label: B
    content: 宣揚朝廷政策與命令
  - label: C
    content: 反映地方民情與百姓疾苦
  - label: D
    content: 督察各級高官與地方豪強
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
