- id: doc_113_高雄_五甲_國文_g9s1e2_s2_3
  section: 2
  number: 3
  type: single
  page: 3
  stem: 「莫說相公痴，更有痴似相公者！」請問此句的「痴」所指為何？
  options:
  - label: A
    content: 作者對金陵人事的分痴愛
  - label: B
    content: 作者他鄉遇故知的吃驚
  - label: C
    content: 作者貪戀杯中物的痴狂
  - label: D
    content: 作者鍾情於山水的痴迷
  group_stem: '（二）崇禎五年十二月，余住西湖。大雪三日，湖中人鳥聲俱絕。是日，更定矣，余拏①一小舟，擁毳衣②、爐火，獨往湖心亭看雪。霧凇③沆碭④，天與雲與山與水，上下一白。湖上影子，惟長堤一痕，湖心亭一點，與余舟一芥，舟中人兩三粒而已。到亭上，有兩人鋪氈對坐，一童子燒酒，爐正沸。見余，大喜，曰：「湖中焉得更有此人！」拉余同飲，余強飲三大白而別。問其姓氏，是金陵人客此。及下船，舟子喃喃曰：「莫說相公痴，更有痴似相公者！」

    【注釋】①拏：音ㄋㄚˊ，撐(船) ②毳衣：細毛皮衣。毳，音ㄘㄨㄟˋ ③凇：音ㄙㄨㄥ，從湖面蒸發的水氣 ④沆碭：音ㄏㄤˋ ㄉㄤˋ，白氣瀰漫的樣子。

    （張岱湖心亭看雪）'
  lesson_raw:
    title: 湖心亭看雪
    basis: 來自《湖心亭看雪》課文內容與題組素材。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
