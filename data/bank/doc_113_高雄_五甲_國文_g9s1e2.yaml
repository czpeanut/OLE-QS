- id: doc_113_高雄_五甲_國文_g9s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 關於與宋元思書的文意敘述，下列何者正確？
  options:
  - label: A
    content: 水皆縹碧，千丈見底，游魚細石，直視無礙。急湍甚箭，猛浪若奔：寫出富春江綠水澄澈，波瀾不興
  - label: B
    content: 夾岸高山，皆生寒樹。負勢競上，互相軒邈，爭高直指，千百成峰：寫山路蜿蜒崎嶇，山樹耐寒常綠
  - label: C
    content: 鳶飛戾天者，望峰息心；經綸世務者，窺谷忘返：表達山水美景可以止息功利之心，且吸引沉醉其中並潛心向學
  - label: D
    content: 橫柯上蔽，在晝猶昏；疏條交映，有時見日：表達作者在舟中仰觀枝葉扶疏，濃蔭蔽天之景，亦呼應前文「皆生寒樹」
  lesson_raw:
    title: 與宋元思書
    basis: 題目提到「與宋元思書」及其課文文句與文意解析。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
