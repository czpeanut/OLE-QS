- id: doc_113_高雄_五甲_國文_g9s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 「我們的情緒狀態很大一部分是取決於我們在注意什麼，一般是聚焦於目前在做的事情上。例如想從吃得到快樂，必須注意到自己正在吃。否則，花同樣時間在吃東西，但是把吃和別的活動綜合在一起，吃的快樂就被稀釋了。」下列何者與這段文字的涵義最接近？【會考考古題】
  options:
  - label: A
    content: 人的好惡常因外在事物改變
  - label: B
    content: 專注於情緒的控制就能得到快樂
  - label: C
    content: 主觀感受與關注的事情密切相關
  - label: D
    content: 追求物質享受無法得到真正的快樂
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
