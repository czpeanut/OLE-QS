  stem: 「鳶飛戾天者，望峰息心；經綸世務者，窺谷忘返」一句可與西方哲學家何人所言互為對應？
  options:
  - label: A
    content: 依比鳩魯：幸福就是肉體無痛苦，靈魂無紛擾
  - label: B
    content: 歌德：人生的價值以及他的快樂，都在於他有能力看重自己的生存
  - label: C
    content: 盧梭：我們之所以有許多痛苦，是由於我們毫無節制地追逐我們的欲念
  - label: D
    content: 亞里斯多德：放縱自己的欲望是最大的禍害，談論別人的隱私是最大的罪惡
  lesson_raw:
