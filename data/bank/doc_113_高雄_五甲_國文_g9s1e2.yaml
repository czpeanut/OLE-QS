- id: doc_113_高雄_五甲_國文_g9s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 王國維評白石詞：「古今詞人格調之高，無如白石。惜不於意境上用力，故覺無言外之味、弦外之響。終不能與於第一流之作者也。」下列何者最符合這段文字的觀點？【會考考古題】
  options:
  - label: A
    content: 白石非第一流之作者
  - label: B
    content: 白石之詞善於經營意境
  - label: C
    content: 有弦外之響者必是一流詞作
  - label: D
    content: 詞有言外之意方顯作者格調之高
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_高雄_五甲_國文_g9s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 「夫山之異於眾者，尚能待人而自見，而況人之異於眾者哉！天於詭奇之地不多設，人於登臨之樂不常遇。有其地而非其人，有其人而非其地，皆不足以盡夫遊觀之樂也。今靈巖為名山，諸公為名士，蓋必相須而適相值，夫豈偶然哉！宜其目領而心解，景會而理得也。」下列敘述何者與這段文字中的觀點最接近？【會考考古題】
  options:
  - label: A
    content: 若能保持心靈的澄淨，所到之處都會是美景
  - label: B
    content: 倘祥於大自然中，可洗滌世俗的汙濁與煩憂
  - label: C
    content: 只要有名士登臨，無論怎樣的山水都可成為名勝
  - label: D
    content: 要盡遊觀之樂，須有特別的景致與懂得欣賞的人
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_高雄_五甲_國文_g9s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 「遺忘就像舞臺燈光後的暗處，漆黑越大片，就越能凸顯光照的明亮。遺忘幫我們揀選人生最值得珍惜的過往片段。因此，遺忘是無須哀悼的，忘的越多，就越應該把眼光投向光照的所在，那才是值得留戀的人事代謝。」下列何者最接近本文作者的觀點？【會考考古題】
  options:
  - label: A
    content: 生命中的人事代謝無須遺忘
  - label: B
    content: 遺忘如同舞臺上光照的所在
  - label: C
    content: 不被遺忘的事物才值得珍惜
  - label: D
    content: 遺忘越多越能看見人生光明面
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_高雄_五甲_國文_g9s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 下列選項中的文字，旨在強調求學必須先立定志向。依據文意判斷，何者斷句最恰當？【會考考古題】
  options:
  - label: A
    content: 夫學者之欲至於聖賢猶射者，之求中夫正鵠也。不以聖賢為準的的而學者是，不立正鵠而射者也。
  - label: B
    content: 夫學者之欲至於聖賢，猶射者之求中夫正鵠也。不以聖賢為準的的而學者是，不立正鵠而射者也。
  - label: C
    content: 夫學者之欲，至於聖賢猶射者之求中。夫正鵠也，不以聖賢為準的，而學者是不立正鵠而射者也。
  - label: D
    content: 夫學者之欲至，於聖賢猶射者之求。中夫正鵠也不以聖賢為準，的而學者是不，立正鵠而射者也。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
