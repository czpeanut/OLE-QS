- id: doc_113_高雄_五甲_國文_g9s1e2_s2_5
  section: 2
  number: 5
  type: single
  page: 4
  stem: 文中提及波特萊爾筆下的「信天翁」，意在凸顯詩人的哪種處境？
  options:
  - label: A
    content: 空有鴻鵠之志，言不踐行
  - label: B
    content: 不由分說，蒙受訕笑
  - label: C
    content: 時乖命蹇，蹇強不繼
  - label: D
    content: 闐於自見，大言不慚
  group_stem: '（三）做詩人要有巨大的勇氣。詩集是票房毒藥，路人皆知，堆滿倉庫的滯銷詩集，不斷要支付租金、耗蝕成本，最經濟的辦法竟是，送進碎紙機當做廢紙處理掉。票房使出版商在出版詩集時有著從事慈善事業的光環，使詩人有被救濟的幸福感。缺乏知名度的青年詩人，期待出版詩集，無異期待一記耳光。我雖不乏出版界的朋友，卻覺得開口請對方出版詩集，簡直是謀害。在富裕的社會，要求人安貧樂道實在不近人情，但「詩窮而後工」，抑鬱固然有礙健康，貧困孤獨卻常常成就一個詩人。歷史上像王梵志這樣活潑快樂的詩人十分罕見，憂鬱孤寂似乎才是他們共通的氣質。詩人是適合寂寞的。詩人最缺乏的，恐怕也是寂寞。在臺灣社會，詩人所組成的社團自成一個擬國度，彼此之間，紛爭不斷，情況很像金庸的武俠世界。各個詩社如同各大門派，大家各據山頭，壁壘分明，頗有爭奪「武林盟主」的態勢。雖然一切的是非只能是「茶杯裡的風波」。可能很多人覺得，這世界少了詩人會安靜些。現實世界中，詩人的窘狀略如波特萊爾筆下的信天翁，這種大海鳥原本是雲霄的君王，「來往於暴風雨中且嗤笑弓手」，一旦流落在充滿叫罵的地上，那巨大羽翼不但妨礙行動，也使他顯得滑稽萎弱，被水手們玩弄取樂。詩人最難堪的不是遭遇商品市場遺棄，而是被蠢人嘲弄。蠢人加上樺勢，剛好可以形成烏雲，烏雲流行，總是遮掩星空。然則烏雲雲得到暫時的演出，卻無損星空的燦爛。高瞻遠遠矚的詩人不會汲汲於登臺表演，他可以在烏雲的幕後保持寂寞，在黑暗而高遠的蒼穹發光發亮。詩人應該減少做人情和打知名度，應酬只會傷害創作生命，他應該增加孤獨的時間，平靜面對自己，聆聽在熱鬧中聽不見的聲音，那來自心靈與智慧深處的迴響。詩人最大的美德是做好詩，不必急著當理論家，吹捧自己的作品；也不必當編年史家，趕緊把自己編進文學史裡。

    （焦桐論詩人）'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
