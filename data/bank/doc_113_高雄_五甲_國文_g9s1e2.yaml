- id: doc_113_高雄_五甲_國文_g9s1e2_s2_9
  section: 2
  number: 9
  type: single
  page: 4
  stem: 關於文中作者所觀察到台灣今日經濟的寫照，何者正確？
  options:
  - label: A
    content: 在台移工的薪資，比不上其原國家的薪資水準
  - label: B
    content: 作者出國工作所領取的薪資，比在台灣低
  - label: C
    content: 「比上不足比下有餘」是目前台灣的經濟寫照
  - label: D
    content: 東南亞國家的工作薪資，普遍都高於台灣
  group_stem: '（五）我是一名在海外漂流三年多的「台勞」。至今在澳洲有兩年、在東南亞有一年多的工作經驗。我的工作如果說得難聽一點，就是許多台灣人口中的「低階外勞」。簡單來說，就是做當地人通常不樂意做的工作。國外，有所謂「3D工作」的說法：意指危險（Dangerous）、辛苦（Difficult）和骯髒（Dirty）的工作。我從事的，就是具有上述特性的工作。正是這些經歷，讓我有機會與當地社會底層的人接觸、相處，也真實見識了所謂的「人情冷暖」。比方說，在台灣外籍移工爭權的新聞下方，總會出現的一堆「酸言酸語」留言，都是我親耳聽過、親身遇過的，也就像是又在對我說著：少來搶飯碗、賺得比自己國家多巨還嫌、不高興滾回去……。大學畢業後兩年，我申請了澳洲打工度假簽證，當起新聞所說的「台勞」。但在澳洲當地我所經歷的職場文化，並未讓我覺得自己很卑微、可憐，反而感受到台灣人在「口頭上」說的：職業不分貴賤的對待。之後在某個機緣下，澳洲打工結束後，我來到東南亞的某國工作。薪水和待遇相較之下更好，但我也是在這裡，開始體驗到所謂「酸言酸語」對待：在當地的地方新聞上，看到了「搶飯碗」的字眼——報導指出，當地人認為我所從事的這份工作，怎能落入外人手中，卻不思考為何這份工作會請外人來做？答案很簡單，所謂的「搶飯碗」，其實是因為當地人不願意屈就這類3D工作，所以請願意為了比本國薪水更高待遇而外地人做而已。「正在停滯，但比上不足比下有餘」可以說是台灣今日經濟的寫照。我知道目前在台移工們領取的薪水，換算回該國家的幣值，可能已經比該國平均薪資相對高上許多——正如我自己在地澳洲和東南亞某國領取的薪資，遠比我在台灣時要好一樣。然而工作條件惡劣、生活環境差，甚至有受虐的可能，這樣的「國際形象」是我們要的嗎？

    節選自〈我是大家口中的「低階台勞」：台灣人對移工們的酸言酸語，我在海外親身經歷〉'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
