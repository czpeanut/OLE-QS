- id: doc_113_高雄_五甲_國文_g9s1e2_s2_7
  section: 2
  number: 7
  type: single
  page: 4
  stem: 關於本文的敘述，何者正確？
  options:
  - label: A
    content: 主人、廚師、服務生的涵養與氣質是作者挑選餐廳的最高原則
  - label: B
    content: 作者愛吃鵝肉，不惜千里迢迢跑到老店飽餐一頓
  - label: C
    content: 中高檔餐廳的服務生總是過於小心翼翼，讓作者看不順眼
  - label: D
    content: 作者決定不再光臨鵝肉店的原因是因氣氛不佳
  group_stem: '（四） 此篇不直接談吃，而談飲食環境的氣場氛圍，更精確地說，是主人、廚師、服務生的涵養與氣質。例如，有位朋友挑餐廳，美味、名氣、潔淨都在其次，他最在意老板收錢找錢，是不是用兩隻手。這也變成我評比餐廳時的一點小眉角，仔細去觀察，雙手收錢，隻手找零的飲食店，大概東西都不會太難吃。住永和時，經常去一家鵝肉攤吃切仔麵、鵝肉青菜，店面乾淨、物美價廉、老闆夫妻和善熱絡，看來已齊備所有好店條件。但有次老闆親切送上的麵之後，轉身，變臉成凶暴父親，對在角落小桌寫功課的國中生兒子動手動腳，只因兒子考試沒考好。唉，沒法再來了。我低頭對著那碗香噴噴的切仔麵告別。而我最受不了的，是到了中高檔餐廳，訓練有素、男帥女靚、穿著白襯衫打著領結的服務生過來倒水時，卻要說著：「現在幫您做倒水的動作。」用餐完，「現在幫您做打包的動作」，排隊等位時，「抱歉我們現在仍是客滿的狀態」。佳餚美釀，燈光氣氛，就毀在被電視媒體茶毒的贅語繁詞。不使用味精與添加物的餐廳越來越多了，期待有朝一日，也有堅持不使用「的動作」及「的狀態」的餐廳出現。

    （劉梓潔飲食課）'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
