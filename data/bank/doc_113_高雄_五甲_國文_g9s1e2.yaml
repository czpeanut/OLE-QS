- id: doc_113_高雄_五甲_國文_g9s1e2_s2_1
  section: 2
  number: 1
  type: single
  page: 3
  stem: 根據本文，下列敘述何者錯誤？
  options:
  - label: A
    content: 「望之不似人君，就之不見所畏焉」意謂梁襄王平易近人
  - label: B
    content: 「不嗜殺人人能一之」涵義近似於「仁者無敵」
  - label: C
    content: 「引領而望」表達人民的期盼之情
  - label: D
    content: 「民歸之，猶水之就下」是指天下之民歸附不嗜殺人之君，好像水向低窪處匯流一樣
  group_stem: '（一）孟子見梁襄王。出，語人曰：「望之不似人君，就之不見所畏焉。卒然①問曰：『天下惡乎定②？』吾對曰：『定於一③。』『孰能一之？』對曰：『不嗜殺人人能一之。』『孰能與④之？』對曰：『天下莫不與也。王知夫苗乎？七八月之間旱，則苗槁矣。天油然作雲，沛然下雨，則苗浡然興之矣。其如是，孰能禦⑤之？今夫天下之人牧⑥，未有不嗜殺人人者也；如有不嗜殺人人者，則天下之民，皆引領而望之矣。誠如是也。民歸之，猶水之就下。沛然誰能禦之？』」

    【注釋】①卒（ᄎㄨㄛˋ）然：突然 ②惡（ㄨㄛ）乎定：天下如何才能安定 ③定於「一」：統一 ④「與」之：歸附 ⑤「禦」之：阻擋 ⑥人牧：治理人民的國君。

    （孟子梁惠王上）'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
