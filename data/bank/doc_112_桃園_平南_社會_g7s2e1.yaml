  stem: 浩瑋到外籍友人家作客，看到小朋友很可愛，想要撫摸他們的頭表示親切，但被友人阻止，因為在他們的觀念裡，孩童頭上有神靈護佑，摸頭的舉動可能給小孩帶來厄運。對於上述的文化差異，浩瑋應抱持何種心態？
