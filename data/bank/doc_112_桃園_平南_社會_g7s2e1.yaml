    主 題：次文化

    (甲)次文化是指被社會上大多數人認同的價值、信仰和規範等，(乙)次文化的「次」是代表次等的意思，(丙)與主流文化有高低優劣的分別。(丁)青少年次文化是指這個年齡層獨具的文化，例如嘻哈街舞、塗鴉等。'
