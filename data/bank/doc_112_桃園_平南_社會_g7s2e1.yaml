- id: doc_112_桃園_平南_社會_g7s2e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 世界各國的語言之間，存在文化位階的現象，尤以英語最明顯。請問：英語為何在全球取得強勢的地位？
  options:
  - label: A
    content: 英語是最好聽的語言
  - label: B
    content: 英語是最簡單的語言
  - label: C
    content: 英語國家的政經勢力強大
  - label: D
    content: 以英語為母語的人口最多。
  group_stem: "英美文化在國際間產生主導的作用，不只在臺灣，其他各國也可以感受到這樣的力量。同時，沒有人能夠忽視或否定挾帶強勢文化的語言力量，美國承襲昔日大英帝國的地位，成為全球的超級強權，它的語言當然也就取得強勢的地位；由此可見，當英語團體的政治、經濟勢力強大時，語言也會脫穎而出；即使就目前的國際現勢來看，美國雖不再居於世界領先地位的絕對優勢，但是它仍然是政治和文化上的強權，而它的語言勢力仍持續在世界各地蔓延。\n\
    臺灣人民對於英語強大勢力的回應不一。由於目前英語學習正是一股熱潮，對於熱中英語學習者來說，此一現象並非壞事；而對於另一群人而言，語言霸權感受便十分明顯，國內有些非英語教師無奈地表示，在這樣的語言霸權，自己成為一種弱勢。雖然他們急欲在這種語言權力關係中，掙得一席之地，但終究不敵社會文化對英語學習的渴望。\n\
    （資料來源：改寫自陳鈺璽，語言＝權力？探討英語學習中的語言權拉鋸戰，2019/5/1。）\n     請根據上文，回答下列問題："
