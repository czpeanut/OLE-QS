- id: doc_113_台南_民德_國文_g7s2e3_s4_8
  section: 4
  number: 8
  type: single
  page: 5
  stem: 根據國民健康署的調查，學齡兒童若不吃早餐，最有可能會導致下列何種結果？
  options:
  - label: A
    content: 增進感覺統合
  - label: B
    content: 減少上課遲到的情況
  - label: C
    content: 體力與智力下降
  - label: D
    content: 提高肥胖與罹患慢性病的風險。
  group_stem: "(四)〈早餐吃什麼〉 \n根據國民健康署調查，國內約17％學齡兒童沒有天天吃早餐，研究顯示，不吃早餐會增加兒童及青少年肥胖風險及罹患慢性病機率。\
    \ \n日本北大學川島隆太教授以核磁共振分析早餐吃米飯和吃麵包的兒童，腦中灰白質比例，發現早餐以米飯為主食的孩子，智力與感覺統合的指標更好，米飯中的碳水化合物可提供腦部生長所需能量，穩定神經元，米食早餐整體脂肪含量低於麵包類早餐，對腦部發育有正相關。\
    \ \n韓國研究也發現，以米為基礎的早餐可提升青少年的學習力、學業表現及身心健康。台灣大學食品科技研究所教授陳時欣分析市售早餐與米食早餐營養組成，發現米製早餐脂肪及鈉含量明顯較低，另搭配蔬菜、水果、雞蛋等食材，可提供孩子完整均衡的營養。\
    \ \n學者建議，家長們想快速準備營養均衡的早餐，可以在前一天洗好米、按下電鍋定時烹煮鍵，搭配事先切好的小黃瓜絲、胡蘿蔔絲、生菜、煮熟的雞蛋或雞胸肉等配料，可輕鬆捏製飯糰，也可以先買米漢堡、米麵條、米披蕯、糙米脆果等，搭配水果及奶類或豆腐，增加早餐的變化性。\
    \ \n（選自好讀週報圖擊隊795 期2024/11/4）"
