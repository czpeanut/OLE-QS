- id: doc_113_台南_民德_國文_g7s2e3_s4_3
  section: 4
  number: 3
  type: single
  page: 4
  stem: 根據本文，請你選出以下最符合主旨的描述？
  options:
  - label: A
    content: 曼谷消防系統的嚴重失靈與官僚腐敗
  - label: B
    content: 一場大火後城市貧民自力重建的過程與生命力
  - label: C
    content: 曼谷貧民窟的犯罪問題與社會治安惡化
  - label: D
    content: 當地居民對外來援助的依賴與反抗。
  group_stem: "(二) 〈貧窮與失去〉褚士瑩     \n    一場曼谷貧民窟的大火發生在二零零三年四月底，由於附近有幾個外國大使館、移民局、五星飯店，還有警察宿舍，所以警方出動了一百輛消防車，還有幾百名警力救援，但是所有的木造房屋仍然付之一炬，而且沒有人知道起火的真正原因。\
    \     \n    火災過後幾天，原本以為會有許多人來翻撿燒剩餘的家當，但是除了幾條野狗在不時復燃的餘燼中蹭著鼻頭外，幾乎沒有人來，但是我們公寓還是在廢墟之中搭了一個臨時的收容所，發放民生用品和熱湯菜。貧民窟的居民大都是臨時工，就算房屋燒光了也得繼續工作，所以要到下個周末來到，才會有空回來探視災情。\
    \ \n    這場大火，有人謠傳是官商勾結，為了剷平貧民窟蓋大樓，才蓄意放火燒掉的。巧合的是，一九九八年，泰國本地的英文出版社出過一本《不尋常的財富》(Unusual\
    \ Wealth)，作者Gregory Bracken就是講述一個建設公司為了蓋大樓，涉嫌放火將Klong Toey貧民窟燒掉的故事。 \n    那個周末人們果然開始回來了，燒焦的木麻黃在陽光下散發出一種好聞的氣味，掩飾了原本應該有的悲傷，然後有幾個帳篷小心翼翼沿著想像的界線，在原本木屋的位置一一搭了起來。晚上有些冷，每天都有人撿燒剩的門板屋樑，堆成一堆，生火取暖。殘存的一點點悲傷，終於在有人搬回一台卡拉OK伴唱機後結束。回來的鄰居們不分日夜地輪流唱著流行歌曲，雜貨店老闆沒有店面，決定把所有貨物一字排開在地上賣，彷彿只要有啤酒喝，日子就可以繼續下去。\
    \ \n    然後雨季來了，廢墟積滿水，過幾天就開始長出綠色的浮萍，變成一個池塘，在我還來不及想登革熱的問題以前，已經有人帶了小船來划，不單如此，還養了一群鴨，每天快樂地在綠水間徜徉，老人們圍著一張沒有燒掉的石頭桌子，聚會下棋；池塘裡有人洗澡，還有婦女圍著水邊洗衣服，一幅恬靜的田園生活，我幾乎不敢相信這是六百萬人的大城市市中心，但是在遺憾著圖書館燒掉的同時，對於這個城市的韌性，也有了完全不同的見解。"
  tags:
