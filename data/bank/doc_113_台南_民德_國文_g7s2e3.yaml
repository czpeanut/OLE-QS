  group_stem: "(一) 〈清稗類鈔〉\n\n 林琴南 清 光緒舉人，致力古文，擅譯西書，名重一時。琴南早年甚貧，授徒奉母，時苦不給。一日，有賣菜傭弛擔，息其門首。出見，與語，菜傭自言家止一母，負販所得，以供甘旨外，無他求，林嘆曰：「若然，我儕之友也。」菜傭謝弗敢當，林曰：「若無然，我儕操業不同，能孝母一也，我今友汝也。」遂相為友。\n\
