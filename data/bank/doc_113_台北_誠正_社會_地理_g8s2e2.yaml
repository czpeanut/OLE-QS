- id: doc_113_台北_誠正_社會_地理_g8s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 誠正旅行社推出「兩洋、五海、三洲」之旅，帶領人們一窺世界文明發祥地、世界宗教發源地，行程遍及西亞與北非等地。此一行程的區域範圍內有何共同特色？
  options:
  - label: A
    content: 位於亞洲、非洲、美洲三洲的交界處
  - label: B
    content: 人民多為阿拉伯民族且主要信仰基督教
  - label: C
    content: 擁有可以溝通太平洋與印度洋的運河景觀
  - label: D
    content: 氣候乾燥卻能發展綠洲農業和駱駝商隊
