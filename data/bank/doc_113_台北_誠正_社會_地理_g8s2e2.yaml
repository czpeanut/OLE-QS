  type: single
  page: 1
  stem: 為了完成「西亞與北非」單元的社會科報告，阿邦蒐集了相當多的資料，其中他閱讀了一本書籍《耶路撒冷小日子》，書中將作者一家人在以色列的日常生活，以幽默的插畫描繪出來。請問：阿邦在閱讀此書籍的內容時，最不可能提及下列哪一個宗教？
