  number: 2
  type: single
  page: 1
  stem: 世界各地依其文化特色分為不同的文化區，而西亞與北非普遍被畫分在同一個文化區內。請問：其主要因素最可能為下列何者？
  options:
  - label: A
    content: 多屬於已開發國家
  - label: B
    content: 多位於兩河流域內
  - label: C
    content: 多信奉伊斯蘭教
  - label: D
    content: 多為聯合國的會員國
