  number: 1
  type: single
  page: 1
  stem: 西亞乾燥氣候地區居民會利用河川與地下水發展綠洲農業，因耕地有限，農民不得不從事集約耕作，農作呈現層狀分布。請問：下列由高至低層的分布，何者正確？
  options:
  - label: A
    content: 棗椰樹→果樹→稻米、小麥
  - label: B
    content: 棗椰樹→小麥、瓜果→果樹
  - label: C
    content: 果樹→小麥、瓜果→棗椰樹
  - label: D
    content: 果樹→棗椰樹→稻米、瓜果
