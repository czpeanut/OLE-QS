  stem: 「1、2、3、4、5、6、7、8、9、0」是我們熟悉的阿拉伯數字，世界上目前所使用的阿拉伯數字雖是發源於印度，但卻是由阿拉伯人所傳播開來，請問：上述可能是因為當時哪一種時空背景所導致？
