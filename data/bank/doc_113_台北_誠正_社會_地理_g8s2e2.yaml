- id: doc_113_台北_誠正_社會_地理_g8s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 「西亞因先天環境因素，有個東西比石油更珍貴，那就是『水』。以色列在西元1959 年建國之初立即頒布《水法》，明訂全國水資源為國家所有，並實施了定量及差異化的分級水價，以管控水資源。」請問：上文提及的「先天環境因素」是指下列何者？
  options:
  - label: A
    content: 高聳山脈阻擋，位於西風帶背風坡
  - label: B
    content: 副熱帶高氣壓籠罩，導致乾燥少雨
  - label: C
    content: 距海遙遠，水氣難以深入
  - label: D
    content: 涼流經過，不易成雲致雨
