  section: 1
  number: 11
  type: single
  page: 1
  stem: 西元2012 年3 月以色列對加薩走廊進行了五波空襲，造成10 人死亡。其起因是因為巴勒斯坦人對以色列南部發射數十枚火箭砲和迫擊砲，造成4 人受傷之後，以色列才展開這項空襲行動。請問：以色列和巴勒斯坦自二戰後衝突不斷，主要與下列何者有關？
