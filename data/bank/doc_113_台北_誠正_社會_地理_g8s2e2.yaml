  section: 1
  number: 6
  type: single
  page: 1
  stem: 尼羅河過去每年夏季固定氾濫，帶來肥沃土壤與水源，提供農業發展，但現今其下游土地逐漸失去昔日的肥沃特質。請問：造成此現象的主因為何？
  options:
  - label: A
    content: 戰爭導致破壞
  - label: B
    content: 上游水壩興建
  - label: C
    content: 降水分布不均
  - label: D
    content: 工業用水需求增加
