    content: 演藝圈競爭激烈，去年紅極一時的廣告明星，如今已成「人面桃花」，被更年輕、更具特色的新人所取代。。
  - label: D
    content: 這個案子情節有如羅生門一般「撲朔迷離」，警方至今弄不清凶手是如何進入密室作案的。
