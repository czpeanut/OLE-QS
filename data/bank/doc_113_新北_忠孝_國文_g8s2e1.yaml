  stem: '根據本文，下列哪些比賽紀錄符合排球規則？


    | | 第1 局 | 第2 局 | 第3 局 | 第4 局 | 第5 局 |

    | --- | --- | --- | --- | --- | --- |

    | A | 18:25 | 23:25 | 24:25 | Ⅹ | Ⅹ |

    | B | 25:24 | 25:10 | 18:25 | 25:18 | Ⅹ |

    | C | 25:16 | 23:25 | 33:31 | 21:25 | 15:9 |

    | D | 25:23 | 17:25 | 19:25 | 16:14 | 17:15 |'
  options:
  - label: A
    content: A
  - label: B
    content: B
  - label: C
    content: C
  - label: D
    content: D
  group_stem: "對於許多排球的初學者來說，無論是觀看一場球賽，或是實際上場參與，「輪轉」這項規則總令人困擾。究竟，「輪轉」指的是什麼呢 ?\n   \
    \ 現在的正式排球賽採用5 局3 勝制，若有一方率先拿 下3 局，比賽就會提早結束。5 局裡，前4 局各局由先拿 到25 分的一方獲勝，第5 局則是先拿到15\
    \ 分者得勝。\n其中，若一局比賽進行到最後是24：24 或14：14 的情形 此時會被稱為Deuce，其中一方需要比對手再多得2 分才能獲勝。在球赛中，若是讓球在自己這半場的界内落地或者是己方有人犯規就會讓對手得分。犯規的情形非常多，其中幾項與「輪轉」有著十分密切的關係。\n\
    \   「輪轉」指的是，場上的人必須按照順序換位置。排球比賽從裁判吹哨開始，哨聲響起後，發球的人要在8 秒內將球發出 。\n    輪轉的順序，與球員在球場上的位置相關。想像自己\
    \ 正俯瞰球場，上圖代表球場的其中一個半場，若依此把場地劃分6 個位置，每個位置站有1 名球員，2、3、4 號位稱為前排，1、5、6 號位則是後排。輪到1\
    \ 號位的人負責發球時，他可走到底線後任一位置，並將球擊出到對面半場。當發球方失分時，原本發球的人會先保持在1 號位。直到再次取得發球權時，1 號位的球員便會往6\
    \ 號位移動，其他人也會依此按順時針方向換位置。取得發球權的一方，無論之前是否發過球，都需要輪轉 。\n    排球比賽因為有輪轉規定，使其規則的複雜度提升，比賽也因此更加精采。此外，輪轉也影響球隊賽前的戰術。下次有機會看到排球賽事轉播的話，不妨停下來細心觀賞，或許你也能發現箇中樂趣！\n\
    \     (〈發球的人怎麼又換了？〉《閱讀理解雜誌34 期》)"
