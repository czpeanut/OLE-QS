    content: "小賢：聽說你們畢業後就搬家了，「貴府」現在何處？\n   小甯：「府上」現在在板橋，歡迎有空來坐坐啊！"
  - label: B
    content: "小賢：好啊！當年去你家叨擾時，「令堂」都會準備手工餅乾招待我們，那香氣令人念念不忘。\n   小甯：「舍母」後來又研發了許多新口味，你有口福了。"
  - label: C
