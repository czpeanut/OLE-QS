  stem: '麻 醉 風 險 等 級 表


    | 級別 | 病人狀態 | 死亡率 |

    | --- | --- | --- |

    | 1 | 健康 | 0.06～0.08% |

    | 2 | 有輕微的全身性疾病，但無功能上的障礙 | 0.27～0.4% |

    | 3 | 有中度至重度的全身性疾病，且造成部分功能障礙 | 1.8～4.3% |

    | 4 | 有重度的全身性疾病，具有相當程度的 功能障礙，且時常危及生命 | 7.8～23% |

    | 5 | 瀕危，無論是否接受手術治療，預期在24 小時內死亡 | 9.4～51% |


    上表是忠孝醫院在進行手術治療前，提供給患者的麻醉風險等級表，依據表中的資訊，敘述錯誤的是：」'
  options:
  - label: A
    content: 第1、2 級死亡率約為0.06%至0.4%，可見麻醉雖有風險但危險程度低
  - label: B
    content: 第3、4 級風險程度增高，乃因病人患有全身性疾病，且伴隨功能障礙
  - label: C
    content: 第5 級死亡率可高達1/2，但在不開刀的情形下，可能一天內結束生命
  - label: D
    content: 麻醉風險與患者的健康狀況密切相關，死亡率由高至低依序為1 至5 級
