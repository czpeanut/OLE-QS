  stem: 根據這兩篇短文，可明確得之下列何者？
  options:
  - label: A
    content: 孟嘗君、王鳳與王鎮惡皆遭雙親棄養
  - label: B
    content: 王鳳與王鎮惡皆以孟嘗君為學習榜
  - label: C
    content: 王猛以孟嘗君的名字為孫子王鎮惡命名
  - label: D
    content: 王鳳的叔父舉孟嘗君之例說明自身觀點
  group_stem: "【甲】\n    王鳳以五月五日生，其父欲不舉①，曰：「俗諺：『舉五日子。長及戶則自害，不則害父母。』」其叔父曰：「昔田文以此日生，其父嬰敕其母曰：『勿舉。』其母竊舉之。後為孟嘗君，號其母為薛公大家②。以古事推之，非不祥也。」遂舉之。\n\
    \                                   (《西京雜記》)\n【乙】\n    王鎮惡，北海人也。祖猛，為將相，有文武才。鎮惡於五月五日生，家人以俗忌，欲令出繼疏宗③。猛見奇之，曰：「此非常兒，昔孟嘗君惡月生而相齊，是兒亦將興吾門矣。」故名之為鎮惡。\n\
    \                                   (改寫自《宋書》)\n註解：①不舉：不撫養 ②大家(ㄍㄨ)：對女子的尊稱。\n  \
    \    ③出繼疏宗：過繼給遠方宗族。"
