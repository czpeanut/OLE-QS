  section: 2
  number: 30
  type: single
  page: 4
  stem: 根據「台少盟」的調查，臺灣社會對降低投票年齡的支持率變化最可能是以下列哪一種折線圖呈現？
  options:
  - label: A
    content: ''
    asset:
      key: optA
      file: doc_111_嘉義_北興_社會_公民_g7s2e2/2_30_optA.png
  - label: B
    content: ''
    asset:
      key: optB
      file: doc_111_嘉義_北興_社會_公民_g7s2e2/2_30_optB.png
  - label: C
    content: ''
    asset:
      key: optC
      file: doc_111_嘉義_北興_社會_公民_g7s2e2/2_30_optC.png
  - label: D
    content: ''
  group_stem: '（二）

    民間團體籌組的「十八歲公民權推動聯盟」和立法院跨黨派委員合作組成的「關注世代正義連線」，公布「18 歲公民權支持度調查」民調結果，近9 成民眾同意投票年齡下修。另針對被選舉權年齡下修，該調查指出，約3
    成反對下修、3 成支持下修到20 歲、3 成支持下修到18 歲等分歧態度。

    根據美國西元2018 年統計，目前全世界235 個國家及地區中，僅剩新加坡等11 個國家或區域和臺灣一樣沒有18 歲投票權；我國也是民主國家中唯一18 歲還不能投票的國家。依據「台灣少年權益與福利促進聯盟」(以下簡稱「台少盟」)調查，臺灣社會對於支持投票年齡下修的比例，早已從西元2005
    年起8 成以上高度反對，到近十年來逐漸成長為超過5 成的支持率；以西元2019 年「台少盟」及「台灣青年民主協會」(簡稱「青民協」)與國教署合作辦理的「投投是道」選民教育活動為例，全臺有近7
    成的學生透過模擬投票表達支持「下修選舉投票年齡至18 歲」。

