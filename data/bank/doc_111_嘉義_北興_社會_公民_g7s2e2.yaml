  - label: A
    content: 呈現出該團體的分工與組織性
  - label: B
    content: 主要在說明團體的志願性特徵
  - label: C
    content: 團體活動內容不受法律的規範限制
  - label: D
    content: 右圖可看出團體活動有助於團體監督政府施政
