  stem: 王老師任教於濱海小鎮，發現常有不肖業者傾倒廢土，破壞生態環境，導致潮間帶紅樹林逐年萎縮，因而集結在地人士組織社團，宣揚保育理念，避免紅樹林進一步流失。關於王老師透過結社參與公共事務的行動，下列敘述何者為正確？
  options:
  - label: A
    content: 成立社團後，應儘速向政府立案，否則會成為非法組織
