- id: doc_111_嘉義_北興_社會_公民_g7s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '小芯針對我國農產品農藥超標的議題，搜集了相關團體或組織的新聞，如下表。


    | 團體或組織 | 新聞報導內容 |

    | :--- | :--- |

    | （甲）<br>消費者文教基金會 | 消費者文教基金會主動送檢市售的國產草莓，部分草莓驗出多達17 種農藥，因此建議我國政府應輔導農民不要重複用藥。 |

    | （乙）<br>行政院農委會 | 行政院農委會指出，抽查殘留多達21 項農藥超標的青蔥，倘若溯源結果為農民未合格用藥，會依法罰款1.5 萬元至15 萬元。
    |


    請根據志願結社的特徵與對公共生活的影響判斷，下列分析何者正確？'
  options:
  - label: A
    content: 甲團體可針對不當或違法的事件行使公權力
  - label: B
    content: 乙團體具獨立於政府外與監督施政的民間性
  - label: C
    content: 這兩則報導皆說明團體其具有組織性的特徵
  - label: D
    content: 甲乙兩團體互相配合可促進社會的公共利益。
  tags:
    chapter:
      publisher: 翰林
      book: 七下
