- id: doc_111_嘉義_北興_社會_公民_g7s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '下列是老師以近日修正的法案始末，說明公共意見的特性—

    ● 民眾認為檢舉魔人造成人民財產會莫名減少，且警察業務量暴增，故於公共政策網路參與平台提案「廢除道路交通管理處罰條例第七條之1 規定」，交通部回應，部分民眾檢舉造成社會紛擾一律，有檢討精進該制度之必要。

    ● 立法院近日三讀通過了「道路交通管理處罰條例」部分條文修正案，以往街頭常見的交通違規：紅黃線違停、任意駛出邊線、不依規定減速慢行，修法後若是「沒有嚴重影響交通安全秩序」，便不再開放民眾檢舉。

    依內容判斷，老師闡述的特性最可能是下列何者？'
  options:
  - label: A
    content: 私密性
  - label: B
    content: 差異性
  - label: C
    content: 不穩定性
  - label: D
    content: 影響性。
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 公民
      code: 4-1
      title: 公共意見與其特性
      chapter: 第4章 公共意見
    textbook: 七下公民 4-1 公共意見與其特性
    labeled_by: ai
- id: doc_111_嘉義_北興_社會_公民_g7s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 參與學校的社團活動，成為國中學生參與團體的難忘經驗與人生記憶。下列四位學生談論到參加社團對自己的影響，何者是以達成共同目標為目的？
  options:
  - label: A
    content: 雅筑：「我參加國樂社，發現自己愈來愈進步，更勇於表現自己。在那個環境裡，因為大家都很厲害，讓我有自學的動力。」
  - label: B
    content: 丞傑：「我國一參加攝影社、國二參加烹飪社。因為我不是很喜歡念書， 所以想藉由社團活動來探索興趣，了解自己。」
  - label: C
    content: 怡甄：「在籃球隊裡，我們會一起為了下次能進入到全國比賽而努力。」
  - label: D
    content: 宜德:「我因為參加管樂團，學會與不同的人相處。曾經在社團跟學長姊起過衝突，因此學習到化解矛盾的方法。」
  tags:
    chapter:
