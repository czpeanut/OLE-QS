  stem: 近年房屋買賣糾紛層出不窮，「中華民國消費者文教基金會」指出政府的實價登錄制度1.0 版有諸多漏洞：資訊不夠透明、無法遏止「虛價登錄」實情、消費資訊完全不對等。該基金會為伸張居住正義，除了呼籲主管機關應堅持正確政策外，也搜集消費者受害經驗，以相關案例繼續推動修法。從「中華民國消費者文教基金會」的行動，可看出它的積極作為展現哪一項志願結社的特徵？
