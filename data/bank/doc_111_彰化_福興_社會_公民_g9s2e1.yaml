  stem: 在警政署的統計數據中，網購詐騙比例高。詐騙集團在網站張貼不實資訊、盜用的商品頁面供買家下單，或者隨機寄送劣質、未購買的商品給買家，導致買家受騙。下列敘述，何者最能呼應上文？
