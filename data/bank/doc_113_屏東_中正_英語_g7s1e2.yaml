- id: doc_113_屏東_中正_英語_g7s1e2_s7_1
  section: 7
  number: 1
  type: single
  page: 2
  stem: What do pilots do to make sure everyone is safe?
  options:
  - label: A
    content: They fly airplanes.
  - label: B
    content: They make sure the packages get to the right place.
  - label: C
    content: They know how to fly and land the airplane.
  - label: D
    content: They know how to talk to people on the ground.
  group_stem: 'Pilots fly airplanes. They are very important. They make sure everyone
    is safe. Pilots know how to fly the airplane. They know how to land the airplane.
    They also know how to talk to people on the ground.

    Pilots can fly people to different places. They can fly people to other countries
    for trips. They can also fly cargo. Cargo is like packages. Pilots make sure the
    packages get to the right place.

    Pilots have to learn a lot. They have to know how to fly the airplane. They also
    have to know how to fix the airplane if something goes wrong. They have to know
    the weather. They have to know the rules. Pilots have to be very smart and very
    careful.

    ＊pilot 飛行員 make sure確保 weather天氣 package 包裹'
