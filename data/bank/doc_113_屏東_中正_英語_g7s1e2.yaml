  - label: B
    content: Billy, drink some juice.
  - label: C
    content: Candy, talk with your friends.
  - label: D
    content: Brian, put your bag on the front table.
  group_stem: 'The Museum Rules

    You can do:

    1. Have fun.

    2. Follow your tour guide.

    3. Take your bag with you.

    4. Turn off your phone.

    You can’t do:

    1. Eat or drink.

    2. Run around.

    3. Talk.

    4. Touch the art works.

    ＊follow 跟隨 tour guide 導遊 turn off 關閉touch 碰觸 art works 藝術品'
