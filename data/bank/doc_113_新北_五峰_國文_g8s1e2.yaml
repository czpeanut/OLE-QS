- id: doc_113_新北_五峰_國文_g8s1e2_s2_34
  section: 2
  number: 34
  type: single
  page: 3
  stem: 下列文句，何者主語是文中的還魂者？
  options:
  - label: A
    content: 襤褸荷校
  - label: B
    content: 不覺握手太息曰
  - label: C
    content: 至此何嘗不富貴耶
  - label: D
    content: 早作帶來計可也。
  group_stem: '有疫死還魂者，在冥司遇其故人，襤褸荷校。相見悲喜，不覺握手太息曰：「君一生富貴，竟不能帶至此耶？」其人蹙然曰：「富貴皆可帶至此，但人不肯帶耳。生前有功德者，至此何嘗不富貴耶？寄語世人，早作帶來計可也。」李南澗曰：「善哉斯言，勝於謂富貴皆空也。」

    (紀昀〈閱微草堂筆記．陰陽富貴〉)'
