- id: doc_113_新北_五峰_國文_g8s1e2_s2_31
  section: 2
  number: 31
  type: single
  page: 3
  stem: 根據本文，「驛馬站命格」應是在說明下列何者？
  options:
  - label: A
    content: 大城市的交通四通八達，造就繁榮的經濟活動
  - label: B
    content: 大城市裡的人往往來去不定，很難在城市長久定居
  - label: C
    content: 大城市裡的人喜歡當背包客，四處旅行結交朋友
  - label: D
    content: 大城市的居民精力充沛，喜歡接觸新奇的事物。
  group_stem: "流經新北雙和區的瓦窯溝，是南勢角溪的主要支流。自身的南北兩支流匯聚東支流，原被當作運貨水道，設有小碼頭，通過抽水站後注入新店溪。「將就居」距溝邊兩百六十八步。\n\
    \    將就居，取意將就住下，我無法把雙北地區完全等比新營，光是看到北部式的粽子、米糕、碗粿、糯米大腸等等都淋上番茄醬，就會覺得「水土不服」。當然，反之，或許別人視我與我鄉亦如是。此乃人性之常，各自表達，合理合情。台灣鄉鎮區市宜居排名，新營第一，中和第二。這是我說的。\n\
    \    為什麼中和排第二？我在此安身十八年了，再怎麼樣都得特別感謝這一方讓我立足多時的土地。新營則是我衣胞埋處，幾代人生於斯死於斯，永恆的故鄉，永恆的榜首。\n\
    \    或云人生到處即故鄉，我坦承做不到。投胎前抽到「都會籤」的人也許做得到，他們若無故鄉概念，我等應該理解之；生在現代大城，衣胞不太可能埋在土裡，因此沒有埋根的感覺。而台北、新北、高雄、台中等等，要讓所有居住者認定為故鄉，也很不可能，因為天定是「流動城市」，此乃大城宿命，屬驛馬站命格。\n\
    \    與我同年出生的台灣「小老虎」約三十二萬隻；我臨世之際，新營人口約四萬，現在六萬多。由於長期是縣治，基本公共設施完備，少了些百貨公司、速食店、咖啡廳、高樓、汽車，反而省錢又健康。我在急水溪畔單純快樂地長大，到台北後立即變得複雜憂鬱。雖畢業後數十年來無大成就，只會讀書寫字，但也沒有太過辜負老母的辛苦與期盼。\n\
    \    老母生前來中和幾次，她常陪我讀書寫字，彼時正在寫「三少四壯」專欄，她問：寫字敢是有錢，寫一篇趁若濟①？我哄曰：一字五塊呢。唉呀，她那欣慰笑容，我至今忘不了。有道是老人若小孩，果其然；為人子戲言博一粲，常應然。\n\
    【注釋】①趁若濟：閩南語音譯，指賺多少錢。\n（節選自阿盛〈急水溪瓦窯溝〉）"
