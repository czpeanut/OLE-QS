  stem: 為落實《憲法》保障身心障礙者權益，我國制定《身心障礙者權益保障法》，並引進「定額進用」的概念，規定公、民營機構僱用身心障礙者人數需達一定比例。右表為我國歷年身心障礙者法定應進用與實際進用人數的數據，請問由本政策及右表數據，最可以彰顯《憲法》所扮演的何種角色？
