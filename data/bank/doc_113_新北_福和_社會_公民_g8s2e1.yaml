  section: 1
  number: 37
  type: single
  page: 1
  stem: 為減輕租屋族的負擔，行政院核定「300 億元中央擴大租金補貼計畫」，但有民眾擔憂，若在未告知房東的情況下申請補貼，而導致房東須依法多繳稅的話，可能會造成房東不悅，進而增加房租或不續租。不過內政部過去即有規定，房東不得禁止承租人申請租金補貼，若甚至因此調漲租金，最高可處以50
    萬元罰鍰。關於民眾所擔憂的情況，以下誰的說法最為正確？(L2)
  options:
