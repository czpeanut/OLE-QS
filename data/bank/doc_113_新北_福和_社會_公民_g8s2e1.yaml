  type: single
  page: 2
  stem: '我國於今年度開始徵收「碳稅」，關心環境的小八上全國法規資料庫，查到右列《氣候變遷因應法》的相關條文。下列關於該法及其條文的敘述，何者正確？(L1)


    《氣候變遷因應法》

    第 1 條：為因應全球氣候變遷，制定氣候變遷調適策略，降低與管理溫室氣體排放，落實世代正義、環境正義及公正轉型，善盡共同保護地球環境之責任，並確保國家永續發展，特制定本法。

    第62 條：本法施行細則，由中央主管機關定之。'
