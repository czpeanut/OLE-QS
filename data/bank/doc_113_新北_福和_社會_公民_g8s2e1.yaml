  section: 2
  number: 47
  type: single
  page: 2
  stem: 根據題文，請問（丙）、（丁）所提及的權利，依序應為下列何種？(L1)
  options:
  - label: A
    content: 受益權；自由權
  - label: B
    content: 平等權；受益權
  - label: C
    content: 參政權；平等權
  - label: D
    content: 自由權；參政權。
  group_stem: "❏請依照下列資料，回答 47 ~ 48 題：\n2024/5/31 中央社〈女性未滿160 公分當不成消防員 憲法法庭判違憲〉\n \
    \ 一名女子通過公務人員消防警察特考，在受訓複檢時，因為身高158.9 公分，不符《公務人員特種考試一般警察人員考試規則》當中160 公分身高標準，廢止他的消防警察的受訓資格。女子提起訴訟確定敗訴後，認為相關規定侵害《憲法》賦予的（丙）權利，而向憲法法庭聲請釋憲。\n\
    \  憲法法庭做出113 年憲判字第6 號判決，判決指出《公務人員特種考試一般警察人員考試規則》中，男性最低身高為165 公分，女性為160 公分。但根據衛生福利部國民健康署的數據，國人男性和女性的平均身高分別為172\
    \ 公分和 159.5公分。憲法法庭認為，消防考試限制，導致約10 %的男性和55 %的女性無法參加考試，明顯對女性造成了不利影響，實質上排除更多女性參與消防工作，與《憲法》保障（丁）權之精神不符，因此原條文應於判決日起1\
    \ 年內失效。"
