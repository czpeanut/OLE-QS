  type: single
  page: 2
  stem: 根據題文，該早餐店店員與客人所行使的法律行為，與下列何者在《民法》上屬於相同的關係？(L2)
  options:
  - label: A
    content: 與配偶結婚
  - label: B
    content: 租單車通勤
  - label: C
    content: 家人過世繼承遺產
  - label: D
    content: 兄弟的妻子稱妯娌。
  group_stem: "❏請依照下列資料，回答 49 ~ 50 題：\n  一名早餐店店員在網路抱怨，日前遇到一名客人急忙進店點餐，店員複誦餐點時，客人頻頻點頭確認，店員便按照菜單製作。不料結帳時，客人卻指責店家做錯，稱自己點的是培根蛋吐司，非火腿蛋吐司。店員拿出菜單證明確實是客人自己勾選錯誤，但客人仍要求更換。店員表示餐點已製作完成，且該名客人已經觸摸過餐點，無法更換。客人卻不滿反駁：「這份留給下位客人就好！」店員聽後回應：「菜單是你自己劃的，對餐時也點頭確認，現在為什麼反悔？」讓客人惱羞成怒，詛咒店家倒閉，隨後便不付錢拂袖而去，過程中不小心將店家的招財貓摔到地上碎掉，讓店家傻眼。"
  tags:
