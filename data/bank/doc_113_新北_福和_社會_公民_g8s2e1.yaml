- id: doc_113_新北_福和_社會_公民_g8s2e1_s1_35
  section: 1
  number: 35
  type: single
  page: 1
  stem: 《憲法訴訟法》經歷朝野及民間團體爭論不斷，於2024 年底通過修正案，除要求總統應在2 個月內補足缺少的大法官人數外，也對參與評議、作成裁定的大法官人數做出明確規定，該法於2025
    年初生效。請問題文當中所提及的修正案，其經歷的修法程序應該為何？(L1)
  options:
  - label: A
    content: 立法院提案、審查修正案 → 立法院三讀通過 → 總統公布
  - label: B
    content: 立法院提案、審查修正案 → 立法院三讀通過→司法院公布
  - label: C
    content: 立法院決議提出修正案 → 公告半年 → 公民投票複決通過
  - label: D
    content: 立法院決議提出修正案 → 公告半年 → 憲法法庭判決公布。
