- id: doc_113_新北_五峰_自然_g7s2e2_s3_38
  section: 3
  number: 38
  type: single
  page: 3
  stem: 有關幹細胞的敘述何者正確？
  options:
  - label: A
    content: 可用來治療唐氏症
  - label: B
    content: 是許多細胞的製造來源
  - label: C
    content: 只能在母體血液中發現
  - label: D
    content: 不容易取得
  group_stem: "請閱讀以下文章，回答38-40題：\n    「臍帶血」就是嬰兒出生時，臍帶和胎盤中的血液。臍帶血富含「幹細胞」，它是一群在胚胎發育早期的未分化細胞，具有自我更新和增殖分化的潛力，是形成各種組織器官的起源細胞。\n\
    \  幹細胞也是血液及免疫系統的主要製造來源，如紅血球、白血球、淋巴球等，可以治療血液、免疫系統引起的疾病，像熟知的白血病、海洋性貧血症、淋巴瘤、紅斑性狼瘡等，都有良好的療效，甚至可以取代骨髓移植，可做為基因療法及複製療法之用。\n\
    \  幹細胞目前在應用上有幾項優點：１.來源容易、２.含有較多的造血幹細胞、３.採集容易、４.帶有傳染病原和病毒的可能性低、５.移植後不容易發生排斥現象、６.兄弟姊妹間的臍帶血移植，適合機率高達50％。因此目前正積極發展這項技術。"
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 生物
      code: 2-4
      title: 生物技術
      chapter: 第2章 遺傳
    textbook: 七下生物 2-4 生物技術
    labeled_by: ai
