  group_stem: '請閱讀以下文章，回答36-37題：

    新北市一名30多歲女子到室內親水設施玩水後，出現感染「福氏內格里原蟲」（Naegleria fowleri）的症狀，導致腦炎死亡。這種疾病號稱寄生蟲界的死神，感染後的死亡率高達99%，如果非常不幸地在游泳或落水時，剛好福氏內格里原蟲嗆進鼻腔中，在福氏內格里原蟲找不到食物的情況下，很可能沿著嗅覺神經進入到腦部，引發福氏內格里腦膜腦炎。'
