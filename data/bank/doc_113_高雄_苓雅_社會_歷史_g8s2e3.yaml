  - label: C
    content: 顯示大陸各社群平台不受官方控制
  - label: D
    content: 顯示大陸部分年輕人對六四事件不了解。
  group_stem: "六四事件35 週年 北京天安門城樓全天關閉\n    今日是中國六四天安門事件的35 週年，中國政府也有多項政策。點開天安門城樓參觀預約網站，就會跳出6\
    \ 月4 日天安門全面關閉、禁止參觀的提醒。北京地鐵也宣布，6 月2 日的首班車至5 日末班車，1 號線八通線天安門東站D 口實施臨時封閉。除了天安門封閉外，美國之音也報導稱，近2\
    \ 年中國為避免民眾利用社群媒體哀悼、紀念六四事件，包含微博、微信及小紅書等媒體都關閉更改頭貼與暱稱的服務。除此之外，熱門線上遊戲「戰車世界」、「三國殺Online」也跟進類似措施。\n\
    \    2022 年，中國數字時代曾發布審查指令，明定「封網時段」。禁止社群媒體與熱門線上遊戲用戶更改頭貼、個人簡介等資訊，並加強言論監控，帶有「蠟燭」、「坦克」、「六四」等關鍵字都將會禁用。經美國之音測試，今（2024）年包含「35」與「35\
    \ 週年」也成為微博嚴格審查的關鍵字，搜尋結果只顯示官方貼文。中國官方6 月初這波限制行動，年輕網友卻不知為何，部分人認為這與6 月7 日將到來的高考有關。\
