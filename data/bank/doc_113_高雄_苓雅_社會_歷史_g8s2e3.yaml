  group_stem: "西元1971 年時代雜誌刊載了4 月26 日美國桌球運動員在長城的合影，當年美國派遣桌球隊訪問中華人民共和國，成為自1949 年以來第一批獲准進入中國境内的美國人。中華人民共和國主動把體育政治化，號稱「小球轉大球」，藉助桌球為緊繃的兩國外交關係破冰，此事使得中華民國與美國關係大幅降溫。\n\
    \    西元2021 年4 月24 日，紀念中美「桌球外交」50 周年活動在北京舉行。中國桌球協會主席劉國梁、中國籃球協會主席姚明、CBA 北京紫禁勇士隊主教練馬布里\
    \ 、「桌球外交」親歷者梁戈亮等嘉賓出席活動。同年11 月21 日，國際乒聯聯合中美兩國桌球協會紀念「桌球外交50 周年」晚宴在休斯敦舉行。"
