- id: doc_113_高雄_苓雅_社會_歷史_g8s2e3_s1_35
  section: 1
  number: 35
  type: single
  page: 2
  stem: '1955 年在某地爆發的一場戰爭戰爭，將近20 年的纏鬥，死傷超過百萬；當中堪稱最慘無人道的，便是美軍的「橙劑計劃」。美軍下令噴灑這種含有世紀劇毒的戴奧辛，讓林區寸草不生，逼出身材矮小、擅長叢林野戰的北越兵。

    令人遺憾的是，隨著落葉劑的噴灑，還是無法挽回美軍在戰場上的劣勢，加上另一股聲浪的影響，美軍於是決定退出此戰役。文章中所說到的另一股聲浪指的是什麼？'
  options:
  - label: A
    content: 中共以斷交威脅美國退出
  - label: B
    content: 蘇聯以導彈威脅美國退出戰場
  - label: C
    content: 戰爭過於慘忍，國內反戰情緒高漲
  - label: D
    content: 美國境內受到恐怖攻擊，無力參與其他戰爭。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
