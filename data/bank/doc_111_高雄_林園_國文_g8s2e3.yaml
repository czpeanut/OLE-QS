- id: doc_111_高雄_林園_國文_g8s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 「禍福互為倚伏，成敗轉眼易位，由失敗而成功或許累計了二十年，由成功而失敗，有時驟生於旦夕之間。」這段文字的主要含義為何？
  options:
  - label: A
    content: 家境富裕的人未必能成功，出身低微的人也未必會失敗
  - label: B
    content: 成功或許需要經歷千辛萬苦，失敗卻可能在一瞬間發生
  - label: C
    content: 禍福相生相滅，成功與失敗必然會同時發生
  - label: D
    content: 若沒有二十年的磨練，便無法取得成功。
  tags:
    textbook: 八下 第八課 成功是失敗之母
    labeled_by: ai
    chapter:
      publisher: 康軒
      book: 八下
      subject: 國文
      code: 第八課
      title: 成功是失敗之母
      chapter: null
