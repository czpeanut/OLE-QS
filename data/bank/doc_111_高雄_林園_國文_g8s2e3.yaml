  number: 19
  type: single
  page: 2
  stem: 下列文句皆出自看雲的日子一文，何者屬於靜態描寫？
  options:
  - label: A
    content: 仰頭欣賞著那無盡的虛空，那層層藍色便如海水般盈滿所有視線
  - label: B
    content: 我想那雲朵像極了舞者，將藍天當成舞臺，恣意的在上頭揮灑絕佳的舞技
  - label: C
    content: 它們還不斷變化隊形，有時獨舞，有時集體創作，有時綿密緊依，有時散落各處
  - label: D
    content: 它們就像是具有昂揚生命力的精靈，蹦蹦跳跳喳喳呼呼的不斷舞動身姿。
  lesson_raw:
    title: 看雲的日子
