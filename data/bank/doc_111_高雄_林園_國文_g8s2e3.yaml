  - label: A
    content: 成功固然值得追求，輸得起卻能贏得更多掌聲
  - label: B
    content: 行動時全力以赴，不論成敗都能獲得他人尊重
  - label: C
    content: 不被虛榮所迷惑者，才有可能取得更大的成功
  - label: D
    content: 人生就像一場競賽，一旦鬆懈就會被他人超越
