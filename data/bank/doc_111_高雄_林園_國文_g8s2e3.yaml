  section: 1
  number: 12
  type: single
  page: 2
  stem: "「秦始皇統一六國以後，金城千里，鞭笞天下，以為可以長享子孫帝王萬世之業。」\n        這句話運用了誇飾修辭技巧，下列何者與之相同？"
  options:
  - label: A
    content: 一根冰棒含在嘴裡，總要舔上半天，才捨得吃完
  - label: B
    content: 撒了滿天的珍珠和一枚又大又亮的銀幣
  - label: C
    content: 我的日子滴在時間的流裡，沒有聲音，也沒有影子
  - label: D
    content: 我們的日子為什麼一去不復返呢。
  tags:
