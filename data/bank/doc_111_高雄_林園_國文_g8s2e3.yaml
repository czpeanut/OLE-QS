  type: single
  page: 4
  stem: '曾經蟬聯世界羽球球后，並獲得奧運銀牌的羽球好手戴資穎曾說過：「輸，也要讓對手贏得很辛苦。」

    她說的這句話正是羅家倫所倡導的「運動家的風度」當中的哪一個？'
  options:
  - label: A
