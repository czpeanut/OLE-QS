- id: doc_111_高雄_林園_國文_g8s2e3_s2_9
  section: 2
  number: 9
  type: single
  page: 7
  stem: 根據本文，拉佩太太為什麼要嚇彭當老太太？
  options:
  - label: A
    content: 她想要讓彭當老太太早點去世
  - label: B
    content: 她跟彭當老太太早些年有恩怨未了
  - label: C
    content: 她想跟彭當老太太開玩笑
  - label: D
    content: 她認為適時的驚嚇對彭當老太太的身體有幫助。
  group_stem: "看護婦拉佩太太問：「您見過魔鬼嗎？」\n  彭當老太太低聲說：「沒有呀。」\n  於是看護婦就打開話匣子，給她講了一些故事，故意嚇唬垂死者那已經十分脆弱的心靈。\n\
    \  她說：「人咽氣以前幾分鐘，魔鬼就會出現在將死者的眼前，他手拿一把掃帚，頭上套著一口鍋，高聲喊叫。人只要見到魔鬼，那就完了，馬上就會死。」她還舉出當年所有見過魔鬼現身而且都是當著她的面見過魔鬼現身的人的名字：約瑟凡・洛瓦塞爾、歐拉莉・拉季埃、索菲・帕達紐、塞拉芬娜・格洛斯皮埃。\n\
    \  彭當老太太終於緊張起來，驚慌萬狀，兩手顫抖，試圖扭過頭去看看房間深處。\n  拉佩太太突然在床腳消失了。她從衣櫃裡拿出一條被單，把自己裹起來；她將一口鍋套在頭上，鍋的三個短而彎曲的腿像三隻角一樣豎著；她右手抓起一把掃帚，左手抄起一個白鐵罐，把鐵罐猛地高高拋起，好讓它落地有聲。\n\
    \  白鐵罐摔到地上，果然發出巨大的響聲。看護婦連忙爬到一把椅子上，掀起掛在床腳的帳子，現身了。她張牙舞爪，用白鐵罐遮住臉，向罐子裡尖聲嘶喊，像布袋木偶戲裡的魔鬼一樣揮動掃帚，嚇唬奄奄一息的老農婦。\n\
    \  垂死的病人失魂喪膽，滿眼驚恐，使出超人的力氣，想起身逃跑。她的肩膀和胸部甚至已經鑽出被窩，不過緊接著她就噓了一口長氣，倒了下去。完了。\n  拉佩太太不慌不忙地把道具都物歸原處：掃帚放在大衣櫃旁的一個角落裡，被單放進大衣櫃，鍋擱到灶臺上，鐵罐放到架板上，椅子靠著牆。諸事停當，她用十分專業的動作合上死者瞪得老大的眼睛，把一個盤子放在床頭，往裡面倒些聖水，又把釘在五斗櫃上的楊木聖枝取下浸在聖水裡，然後她便跪下來，滿懷虔誠地念誦起追思亡人的經文來。由於職業的需要，這些經文她能倒背如流。（莫泊桑\
    \ 魔鬼）"
