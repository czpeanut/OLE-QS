  section: 1
  number: 16
  type: single
  page: 2
  stem: 「無論何時，都要保持低調和謙遜的態度，因為在這世界上，你不是最優秀的那一個。不要總是認為只有自己的風景獨幽，在你的世界之外，有很多真正的雋永風景都是靜水深流。」關於這段文字的含義，下列敘述何者正確？
  options:
  - label: A
    content: 一箭易斷，十箭難折
  - label: B
    content: 前事不忘，後事之師
  - label: C
    content: 人有失手，馬有亂蹄
  - label: D
    content: 人外有人，天外有天
