- id: doc_111_高雄_林園_國文_g8s2e3_s2_5
  section: 2
  number: 5
  type: single
  page: 6
  stem: 「少年分日作遨遊，不用清明兼上巳。」這句詩的含義為何？
  options:
  - label: A
    content: 年輕男女任何日子都可遊玩，並不限於清明、上巳節
  - label: B
    content: 年輕男女平常都在白日出遊，只有清明、上巳節可以例外
  - label: C
    content: 年輕男女在清明、上巳節規畫遊玩的日程
  - label: D
    content: 年輕男女玩到忘記日子，不知清明、上巳早已過了。
  group_stem: "唐代人喜歡運動，屬於軍事體育的以馬球（打毬）為主，屬於軍事體育兼娛樂的以足球為主。古人將足球運動稱為「蹴鞠」。蹴，即踢；鞠，即球。有時也稱為「打鞠」，這裡的「鞠」字，專指足球。\n\
    \  足球源自中國，至遲春秋 戰國就出現了。起初使用填充獸毛的皮球，彈性不足，技巧上受到限制。到了唐代，開始使用充氣的動物膀胱，再用八塊皮縫合，這種球彈性良好，可以施展各種技巧。唐代的球門用兩根竹竿架起球網，分成兩隊比賽，已和現今的足球相似。\n\
    \  唐代時，清明前後人們熱衷兩種娛樂：男子踢足球，女子盪秋千。盛唐詩人王維的寒食城東即事，描繪寒食蹴鞠的習俗，詩中後四句：「蹴鞠屢過飛鳥上，秋千競出垂楊裡。少年分日作遨遊，不用清明兼上巳。」\n\
    \  「蹴鞠屢過飛鳥上」，形容球踢得很高。「秋千競出垂楊裡」，描寫女孩子在柳蔭下盪秋千的情景。「上巳」，指上巳節，即陰曆三月初三。寒食、清明、上巳相距不遠。\n\
    \  民間喜歡足球，軍中也喜歡，中唐詩人韋應物的寒食後北樓作：「園林過新節，風花亂高閣。遙聞擊鼓聲，蹴鞠軍中樂。」可見清明前後軍中也熱衷踢足球。（張之傑 詩說歷史）"
