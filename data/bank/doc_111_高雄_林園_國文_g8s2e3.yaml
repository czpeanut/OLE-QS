- id: doc_111_高雄_林園_國文_g8s2e3_s1_20
  section: 1
  number: 20
  type: single
  page: 3
  stem: 「像喜愛在天上跳舞的秋雲就是屬於卷雲，它的高度在一萬公尺以上，是君臨在上睥睨天下的雲種，它的質地細緻而分散，像羽毛、頭髮、亂絲或馬尾，姿態千變萬化，在清晨日出或黃昏日落時，因為位置極高便會印染上橘紅色柔和的太陽光線。」根據文意，下列敘述何者正確？
  options:
  - label: A
    content: 卷雲只有在日出或日落才會出現
  - label: B
    content: 秋雲的種類屬高雲族
  - label: C
    content: 秋雲只有固定一種呈現方式，讓人一眼便能看出
  - label: D
    content: 卷雲因空氣汙染，而呈現橘紅色。
