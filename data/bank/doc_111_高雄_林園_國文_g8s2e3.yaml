- id: doc_111_高雄_林園_國文_g8s2e3_s1_37
  section: 1
  number: 37
  type: single
  page: 4
  stem: 「提倡運動的人，以為運動可以增加個人和民族體力的健康。是的，健康的體力，是一生努力成功的基礎，大家體力不發展，民族的生命力也就衰落下去。」關於這段文字的理解，下列何者正確？
  options:
  - label: A
    content: 運動可以增加個人的健康，所以生病的人是因為沒有運動
  - label: B
    content: 人的一生必須先努力打下成功的基礎，再來發展健康的體力
  - label: C
    content: 提倡運動的人，認為運動與個人健康、民族強盛息息相關
  - label: D
    content: 運動的好處，便是能解決人生與民族問題。
