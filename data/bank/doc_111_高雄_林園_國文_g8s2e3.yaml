- id: doc_111_高雄_林園_國文_g8s2e3_s2_7
  section: 2
  number: 7
  type: single
  page: 6
  stem: 根據本文，胡旋舞未能在漢人社會流傳的原因為下列何者？
  options:
  - label: A
    content: 因為漢人全面排斥胡人的妝扮、服飾
  - label: B
    content: 因楊貴妃不跳胡旋舞而不受民間歡迎
  - label: C
    content: 許多士人抨擊胡旋舞是胡人侵略用的煙霧彈
  - label: D
    content: 漢民族難以接受胡族樂舞，其中也包含胡旋舞。
  group_stem: "具史料記述安祿山也有其多才多藝、滑稽可笑的一面。他體態肥胖，「重三百三十斤」，然而又極善舞蹈，曾在皇家宴會上表演，「至玄宗前，作胡旋舞，疾如風焉」。據考證，安祿山跳的這種「胡旋舞」就是維吾爾舞蹈的早期形式。唐代胡旋舞在中國境內廣為流傳，以鼓、弦為主要樂器，擊打節拍明顯，因而節奏明快、氣勢奔放，尤以旋轉蹬踏動作為主要特徵，故得名「胡旋舞」。\n\
    \  那麼，為什麼胡旋舞未能在漢人社會裡流傳下來呢？從歷史資料看當胡旋舞流傳中原的時候，它在讓人耳目一新的同時也暴露出不能為漢人所接受的東西。首先，這些胡旋舞女身著胡服，裝束奇特，其中緊袖直領的胡衫、方便活動的褲子乃至賞心悅目的胡帽革靴都為漢人所吸收，但也有某些在漢人看來非常怪異的妝扮違背了漢民族的審美觀，如烏脣、赭面、拋家髻之類。於是許多人加以排斥，白居易甚至還提醒世人不要盲從，因為「椎髻赭面非華風」。其次，胡族樂舞本有不少被漢人社會所吸收，但由於胡旋舞過於受人歡迎，甚至到了可以蠱惑君主、影響政治的程度，結果引起一些士人的警惕與擔憂。元稹認為胡旋舞跟胡旋女都是胡人用來迷惑漢人以達到侵略目的的煙霧彈而已，白居易認為胡旋舞被胡人拿來作煙霧彈，而漢人學會了則貽害更深，楊貴妃罪有應得在馬嵬坡被處置，但她死了卻讓玄宗皇帝更加刻骨銘心的思念。儘管把一種藝術形式當作引起國難的禍因不見得正確，但是他們作為漢文化的衛道人士抨擊胡旋舞，則反映了異質文明相互排斥的正常現象。（改寫自劉永連等\
    \ 老師來不及教的101個唐朝趣史）"
