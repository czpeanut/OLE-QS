- id: doc_113_高雄_五福_數學_g7s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '(1)以下是小芳化簡 $\frac{3x+2}{4}-\frac{-3x+1}{2}$ 的過程：

    步驟一：將式子同乘以4，得$3x+2-2(-3x+1)$

    步驟二：去括號得$3x+2+6x-2$

    步驟三：化簡得$9x$


    (2)以下是圓圓解方程式 $2(3x+2)=2x+4$ 的步驟如下：

    $2(3x+2)=2x+4 \xrightarrow{\text{步驟①}} 6x+4=2x+4 \xrightarrow{\text{步驟②}} 6x=2x
    \xrightarrow{\text{步驟③}} 6=2$

    對於兩人的計算過程，下列判斷何者正確？'
  options:
  - label: A
    content: 小芳、圓圓都正確
  - label: B
