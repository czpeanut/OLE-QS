  answer_source: ai:majority
  group_stem: '(二)

    　　最冷的記載是一八九二年冬天，<u>恆春縣志</u>：「光緒壬辰冬十月丙子初更，始而微風細雨，繼聞有鋪落之聲，視之則雪子也。……設縣幾二十年，始得一見。」

    　　<u>鳳山縣采訪冊</u>也是清楚的寫著：「首先阿猴疾，次及萬丹；繼而東港矣，終及港里（今阿里港四處……）。麻衣被體，剛達雨雪霏霏（足冬嚴寒，下雨如雪，逃雖貧民有以麻布袋為衣者）。」

    　　連濁水溪以南平原地區的崙背和新港，甚至屏東 萬丹、東港都冷成這種程度，說是臺灣史上最冷的一天，也不為過。尤其在北部的桃、竹、苗一帶更是連降三天暴雪，山區林木遭到冰雪重壓枯折，新竹市區街道大雪難行，鐵路在桃園市
    龜山區的龜崙嶺段更因積雪過深而中斷。這一波的東亞寒潮，更被學術界稱為「世紀寒潮」。

    　　介於副熱帶與熱帶之間的臺灣，仍然受到全球變遷的影響而降雪；無論是太陽活動，或是火山噴發，都會改變臺灣的氣候。由地方史與詩作中詳細比對，不管是清領之初的明
    清小冰期，清領中期的無夏之年，還是清領末期的世紀寒潮都一一顯現出來，為全球變遷的紀錄添上一筆證據。有興趣的讀者，不妨以「明 清小冰期」、「無夏之年」、「世紀寒潮」、「霸王級寒流」為關鍵字，你將會對臺灣的降雪紀錄有更深一層的了解。（林明星
    <u>臺灣清領時期的降雪紀錄</u>）'
