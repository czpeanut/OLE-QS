  type: single
  page: 1
  stem: 袁宏道與友人書云：「人情必有所寄，然後能樂。故有以弈為寄，有以色為寄，有以技為寄，有以文為寄，古之達人，高人一層，只是他情有所寄，不肯浮虛度光景。」這段文字的主要涵義，與下列何者最接近？
  options:
  - label: A
    content: 以物為寄應該有所節制，不可浮濫
  - label: B
    content: 古之達人寄懷於民，不求一己之樂
  - label: C
    content: 情感有所依託，生命方能愉悅自適
  - label: D
    content: 習得多種才藝，方能晉身達人之列。
