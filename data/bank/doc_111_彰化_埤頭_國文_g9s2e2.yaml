  group_stem: '(三)

    　　山仰行而上，有亭焉，居其半，蓋以節行者之力。至此而得少休也。出亭而稍上，有穴窈然（1），曰西施之洞；有泉泓然（2），曰浣花之池，皆吳王 夫差宴遊之遺處也。又其上則有草堂，可以容棲遲；有閣，可以周眺覽；有軒，以直（3）洞庭之峰，曰抱翠；有閣，以瞰具區（4）之波，曰涵空，虛明動蕩，用（5）號奇觀。蓋專此郡之美者，山；而專此山之美者，閣也。（高啟
    遊靈岩記）

    【注釋】（1）窈然：深遠的樣子。（2）泓然：水深廣的樣子。（3）直：對著。（4）具區：太湖的古稱。（5）用：因。表示原因、結果。相當於「因此」。'
