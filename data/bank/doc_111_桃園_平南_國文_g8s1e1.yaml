  stem: '有一個人問禪師：「和尚修道，是否用功」 禪師回答：「用功。」 那個人又問「怎麼用功呢？」 禪師回答：「餓了就吃飯，睏了就睡覺。」 那個人很疑惑：「世上的人都是這樣，難道他們也是像師父您那樣修行？」
    禪師回答：「他們和我不同。」 那個人又問：「如何不同？」 禪師回答：「它們吃飯時不肯吃飯，忙碌來忙碌去；他們睡覺時不肯睡覺，計較來計較去。」

    上述這段對話的主要涵義，與下列何者最接近？'
  options:
