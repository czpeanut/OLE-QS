  - label: C
    content: 修行即是好好地活在當下
  - label: D
    content: 世俗之人總被名利羈絆著
- id: doc_111_桃園_平南_國文_g8s1e1_s3_31
  section: 3
  number: 31
  type: single
  page: 4
  stem: '齊有善相狗者，其鄰假（甲）以買取鼠之狗。期年乃得之，曰：「是良狗也。」其鄰畜之數年，而不取鼠，以告相者。相者曰：「此良狗也。其志在獐麋豕鹿，不在鼠。欲其取鼠也則桎之。」其鄰桎其後足，狗乃取鼠。（呂氏春秋士容論）

    【注釋】（甲）假：通「借」，請的意思。（乙）桎：古代拘繫犯人兩腳的刑具，有束縛之意。

    由這段文字可知，「相狗者之鄰」是一個怎樣的人？'
  options:
  - label: A
    content: 隨遇而安
  - label: B
    content: 扼殺人才
  - label: C
    content: 懷才不遇
  - label: D
    content: 知人善任
