  group_stem: '天上下著小雨時你正在街上，你把雨傘打開就夠了，犯不著去說：「真見鬼，又下雨了！」你這樣說，對於雨滴、對於雲和風都不起作用。你倒不如說：「多好的一場雨啊！」我同意你說的，這句話對雨滴同樣不起作用，但是它對你自己有好處，你於是抖一下身子，從而使全身發熱。因為最微小的愉快動作也會產生這種效果。這樣，你就不必擔心自己會因為淋雨而感冒。

    對待別人也可以像對待雨一樣。你說這可不容易，我說不然，這比對待下雨容易。因為你的微笑對待雨水不起作用，對於別人卻能起到很大作用。僅僅由於他們效法你的微笑，這就使他們變得不那麼憂鬱，不那麼討厭。此外，如果你設身處地為他們想，你就不難原諒他們。（節錄自阿蘭
    雨下）'
