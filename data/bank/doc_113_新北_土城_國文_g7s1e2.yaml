  group_stem: '陳亢問於伯魚①曰：「子亦有異聞乎？」對曰：「未也。嘗獨立，鯉趨②而過庭。曰：『學詩乎？』對曰：『未也。』『不學詩，無以言！』鯉退而學詩。他日，又獨立，鯉趨而過庭。曰：『學禮乎？』對曰：『未也。』『不學禮，無以立！』鯉退而學禮。聞斯二者。」

