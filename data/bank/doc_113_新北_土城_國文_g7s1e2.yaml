- id: doc_113_新北_土城_國文_g7s1e2_s1_33
  section: 1
  number: 33
  type: single
  page: 3
  stem: 下列說明何者無法從文章中推論出來？
  options:
  - label: A
    content: 為了防止蚊蟲進入鼻子，非洲象睡覺時會將鼻子捲曲起來
  - label: B
    content: 河馬平時就愛泡水，連睡覺也會待在河裡
  - label: C
    content: 長頸鹿的睡眠時間很短，是所有動物中最少的
  - label: D
    content: 大象多半會選擇站著睡覺，而小象則會側躺著休息
  group_stem: '睡到自然醒有多幸福？看看野生動物就知道！


    在氣溫涼爽舒適的季節裡，大家是不是都有睡到不想起床的經驗呢？大部分的野生動物跟人類一樣，需要透過睡眠機制來恢復體能，今天就來看看長頸鹿、非洲象和河馬是怎麼睡覺的吧？

    長頸鹿是陸地上身高最高的動物，但所需要的睡眠時間，卻是哺乳類動物中最少的。生活在野外的長頸鹿，必須時刻保持警覺，因此每次入睡的時間通常只有幾分鐘，斷斷續續的。相較之下，生活在動物園裡的長頸鹿們，因為不用隨時擔心被掠食者攻擊，讓牠們得以逐漸放鬆警戒，睡眠的時間比起野外個體多出許多，平均一天可以睡上4
    至6 小時。長頸鹿熟睡時呈現坐臥的姿勢，並且會將脖子蜷曲在軀幹上，想要觀察牠們熟睡的模樣，通常要等到夜深人靜之後。

    非洲象身為陸地上體型最龐大的霸主，平均體重達4 公噸，因此牠們如果躺下來，不僅容易壓迫到器官，也要花費很多的力氣才能夠站起來，所以只有幼象才會側躺著休息。另外大象的鼻子非常敏感，有時候要睡覺時，會習慣將長長的鼻子捲曲起來，以防止蚊蟲進入。

    棲息於非洲大草原的河馬，平日裡總是愛泡在溪流、水池當中，因為藉由水的浮力，可以讓四肢免於長時間承受龐大體重的壓力，也能使皮膚常保濕潤，所以河馬連睡覺時也是待在水裡的唷！河馬一次換氣就可以潛水長達5
    分鐘以上，睡著時河馬的身體會下沈，等到該換氣的時候再浮上來，如果水池周邊有可以固定身體不會亂漂動的地方，或是水深剛好足夠讓頭部露出水面的位置，河馬們都會善加利用，讓自己可以好好的睡上一覺！

    【節選自台北市立動物園網頁】'
