  group_stem: "糕餅是中華文化漢餅的代表，就好像是日本的「和菓子」一樣，已經是飲食文化的一部分。台灣雖然很小，但是存在著非常多種糕餅，台灣的糕餅不是只有鳳梨酥、綠豆椪或蛋黃酥！\n\
    \    台灣人吃糕餅的食俗，發展於過去閩、粵移民時帶入原鄉的舊習慣跟飲食文化。然而經過百年文化的洗禮，台灣本地的環境、物產的原地取材，已呈現出不同於原鄉的飲食特色。在歷史上，台灣的糕餅共經歷過四個時期：\n\
    第一時期：日治時期（1895 年）以前，當時台灣糕餅原料單純、口味簡單，散發麵粉與糖的香氣，雲林縣北港的發酵餅、台南香餅就是這一時期產生。\n第二時期：日治時期（1895～1945\
    \ 年），此時糕餅開始加入日本的飲食特色如紅豆、地瓜等內陷或運用「和菓子」的做法。苗栗知名的肚臍餅、豐原紅燒餅等皆是在此時期出現。\n第三時期：發展與成熟期（1945～1980\
    \ 年），這個時期國民政府遷台，再加上1960 年代中美聯防，大量西方人湧入台灣的影響，使得餅食做法更加多元豐富。\n第四時期：衰退與轉型期（1980～今），受到全球化影響，傳統糕餅受到飲食西化的衝擊。1990\
    \ 年以後，由於周休二日的影響以及人們開始重視地方文化，糕餅店開始售賣伴手禮，讓產業開始蓬勃發展。\n    早期人們都吃糕為主，餅為有錢人才吃得起的點心。但是現在，我們想吃隨時都能吃到。從餅的內餡也可以看出時代變遷以及經濟的富裕，以前內餡只有豆沙或者地瓜，大環境變好後出現了魯肉豆沙餅，進一步受到日本帝國文化的影響後，咖哩的內餡也開始出現。\n\
    「喜餅」是糕餅文化中演變最大的。1960 年以前只有大餅，但到了1960～1980 年期間，台灣的社會轉向工業化，家庭人口數變少，大餅吃不完於是出現了「對餅」與「盒仔餅」。1980\
    \ 年，西式喜餅的引進讓台灣傳統喜餅受到很大的衝擊，一直到1990 年重視地方文化的意識抬頭，才演變成今天常看見的中西合併式喜餅。\n    在糕餅上，常常可以看見不同的圖騰花紋。其實常見的花紋類型有「花草紋」，如牡丹、菊花、松針、藤蔓等等；「瓜果紋」，如石榴、桃、荔枝、佛手、鳳梨等等；另外還有彎錠紋、人物紋、龍鳳紋、文字紋、魚形紋、龜紋、桃紋、連錢紋也都是常見的類型。多以圓模製成，以表圓滿，其中每一個花紋都有屬於自己的象徴意義，如龜因為台語與「久」音近，祭龜代表祈求長壽，在「粿」類糕餅上最容易看見。\n\
    \    昔日，糕餅用於祭神或者敬祖。但到了今日，它不再是限定於特定節日吃的，糕餅成為人際關係的橋樑。中秋節、農曆春節時，糕餅更成為送禮的代表。\n，台灣糕餅有六大滋味，分別是「地方味、歲時味、時代味、人情味、吉祥味與虔誠味」，它絕不只是食品，而是珍貴的文化資產，是一門與生活禮俗息息相關的活藝術。\n\
    （改寫自黃敬翔〈台灣不只有鳳梨酥！台味糕餅百百種，一口餅就是一口文化！〉"
