  section: 2
  number: 36
  type: single
  page: 6
  stem: 關於本文所述的「知縣」一職，下列說明何者正確？
  options:
  - label: A
    content: 每年享有一個半月的年假
  - label: B
    content: 無故曠職須扣薪，退休無給俸
  - label: C
    content: 每日實際工作十小時，另有兩小時午休
  - label: D
    content: 除了司法審判外，兼負彈劾百官的職責ˉ
  group_stem: '徵台灣府屬諸羅縣知縣一名

    【求才內容】

    職務說明：負責該縣境內司法審判、賦稅徵收、考試選才、治安維護、教化百姓、公共建設等工作。

    上班地點：台灣府屬諸羅縣衙門。

    工作待遇：月薪為四十五兩白銀；住宿、膳食、醫藥費用全免，並提供專屬車轎；無退休俸祿。

    上班時段：工作時間為辰時至申時，午時可自由活動。無故曠職或遲到，依天數與情節輕重，減俸以示處罰。

    休假制度：每年十二月十九日至次年正月十八日為年假。皇帝、太后或皇后壽辰，以及清明、端午、中秋、重陽等節日，雖不審理司法案件，仍須至衙門處理公務。

    【工作條件】

    年齡限制：二十歲以上，七十歲以下。

    籍貫限制：依據「不得於籍貫所在地任官」的迴避制度，設籍台灣府者不得應徵。

    任用資格：須進士及第。

    工作經驗：須有數年仕宦經驗，始可投遞履歷。

    【應徵方式】

    請至吏部填寫相關資料，並檢附履歷，等候通知。'
