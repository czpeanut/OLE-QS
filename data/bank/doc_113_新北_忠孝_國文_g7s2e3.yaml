- id: doc_113_新北_忠孝_國文_g7s2e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: '在課堂上，老師分享了一篇文章，提到：「隨著政治經濟氛圍的轉變，在後現代消費文化與全球文化經濟帶動下，鳳梨的符號意義從作為感謝、慶賀、表現心意的吉祥意象，逐漸演變成具備臺灣意涵與在地『土』象徵，記錄了不同時代社會文化需求。不同時期的鳳梨商品演變，展現出歷史發展中鳳梨不同的意涵，流變轉換成不同的消費符碼的現象，同時也說明市場偏好與消費者意識如何影響農產商品產銷治理。」

    根據上述內容，影響鳳梨的符號意義的原因眾多，但「不包含」下列何者？'
  options:
  - label: A
    content: 生長環境
  - label: B
    content: 經濟氛圍
  - label: C
    content: 市場情況
  - label: D
    content: 政治現況
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 國文
      code: 第八課
      title: 摩登土產鳳梨酥
      chapter: null
    textbook: 七下 第八課 摩登土產鳳梨酥
    labeled_by: ai
