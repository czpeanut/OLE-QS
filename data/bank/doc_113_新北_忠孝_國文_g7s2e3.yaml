  type: single
  page: 2
  stem: 在一場國學講座中，主講人提到陶淵明的〈五柳先生傳〉的開頭寫道：「先生不知何許人也」，結尾則提到「無懷氏之民歟！葛天氏之民歟！」請問這兩句話之間的關聯性為何？
  options:
  - label: A
    content: 說明五柳先生其實是上古社會的人
  - label: B
    content: 故弄玄虛，文末再揭曉答案
  - label: C
    content: 五柳先生和無懷氏、葛天氏都是安貧樂道的人物
  - label: D
    content: 因五柳先生為虛構的人物，所以不知其出生地，正與上古時代無懷氏、葛天氏等人一樣
