  page: 3
  stem: "依據下文，何者符合龔自珍對陶潛的看法？\n    陶醉於田園的陶潛，是否曾為他決定隱居後悔過？是否\n有時候也想過另外一種生活？清代以降的批評家已開始質疑\n\
    陶潛作為一個隱士的「單純性」─詩人龔自珍就把陶潛當成有\n經世抱負的豪傑之士，可與三國時代的諸葛亮相比 擬：「陶潛\n酷似臥龍①豪，萬古潯陽松菊高。莫信詩人竟平淡，二分梁甫\n\
    ②一分騷。」很顯然，龔自珍並沒有把陶潛當作一個平淡的\n人。對龔氏及其同時代的人而言，陶潛代表一個典型的知識分\n子，有出仕的凌雲之志卻扼腕而棄之─因為生不逢時。\n\
    【注釋】① 臥龍：諸葛亮年輕時自比管仲、樂毅，人稱「臥龍」。\n②梁甫：即梁甫吟，史載諸葛亮好為此詩。騷：屈原的文章\n離騷。"
  options:
  - label: A
    content: 陶潛才德堪比諸葛亮，竟自甘於平淡，令人惋惜
  - label: B
    content: 陶詩風格平淡，實受梁甫吟、離騷兩篇作品的影響
  - label: C
    content: 陶潛與屈原、諸葛亮相同，均懷有匡時濟世之志
  - label: D
    content: 陶潛放棄當官的志向，是為了固守田園、安貧樂道
