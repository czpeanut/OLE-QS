  type: single
  page: 3
  stem: '雲林被網友選為台灣最無聊的城市之一，如今卻有醬油廠三代讓許多外地人搶著到雲林吃飯，開辦3 年多的「飛雀餐桌行動」至今接待超過3500 名食客。雲林西螺「御鼎興純手工黑豆柴燒醬油」第三代製醬人，成立了「飛雀餐桌行動」，集結雲林物產與自身的黑豆醬油產業為出發，主廚現場以不加工的烹調技巧、用心的擺盤和花藝的佈置，創造以「全醬油」的蔬食餐宴來拉近生產者與消費者之間的距離。雖以飛雀餐桌為名，賣的卻是一段結合歷史、文化和食材的旅程，專為喜愛在地食材的客人提供完整的「雲林體驗」。

