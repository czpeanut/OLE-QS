  group_stem: '閱讀下列文章，並回答問題：

    近年來日本連鎖迴轉壽司紛紛在臺展店，不約而同的使用贈送「扭蛋」的方式，來增加消費者的用餐次數或提高消費總額。「藏壽司」是每消費5 盤，就能獲得1 次轉扭蛋的機會，因此，消費者的消費數量大多都是5
    盤的倍數。「壽司郎」則是每次消費滿300 元可獲得1 點，集滿3點，即可獲得1 枚扭蛋代幣，因此，消費者的消費次數，大多都是3 次以上。而扭蛋的獎品，每個時期皆不相同，也會額外吸引對贈品有興趣的消費者消費。吃壽司、轉扭蛋的風潮，逐漸深植在臺灣人的心中，也拉抬了迴轉壽司店的銷售業續。'
