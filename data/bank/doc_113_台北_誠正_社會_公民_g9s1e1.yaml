  type: single
  page: 3
  stem: 2023 年初，全臺雞蛋供應短缺，引發蛋荒。根據本文，在其他條件不變的情況下，雞蛋價格應呈現何種現象。
  options:
  - label: A
    content: 雞蛋價格上漲，生產者生產意願降低
  - label: B
    content: 雞蛋價格下跌，生產者生產意願增加
  - label: C
    content: 雞蛋價格上漲，消費者消費意願降低
  - label: D
    content: 雞蛋價格下跌，消費者消費意願增加
  group_stem: '閱讀下列文章，並回答問題：

    「你買不買得到雞蛋？」——在2023 年年初是台灣人的民生話題，受禽流感、氣候低溫、飼料價格上漲等影響，雞蛋產量銳減、蛋價飆漲，民眾買到就上載至社交媒體炫耀自己是「雞蛋富翁」。

    各大連鎖超市都實施雞蛋限購令，每人每次限購兩盒，並呼籲消費者不要囤蛋。當時有網友拍到知名超市全聯福利中心的收銀員，在背上貼著公告指「今天雞蛋已售完，只剩健達奇趣蛋」。

    據官方統計，台灣每年每人要吃355 顆蛋，每日雞蛋需求量為12 萬箱（每箱200 顆），但2022 年底開始產蛋母雞減少400 萬隻，目前雞蛋每日產量降至11.2
    萬箱，每日雞蛋缺口約在50 萬至80 萬顆。

    國產雞蛋有一半銷售到市場、雜貨店、餐飲和烘焙業等「業務通路」，只有兩成多銷往超市和賣場等「零售通路」，蛋商往往優先供應給前者，變相令一般消費者更難買到雞蛋，當中又以產量最少、需求量最大的北部地區最為嚴重。

    至於台灣雞蛋定價，是由蛋商、蛋農與工商部門等循「中華民國養雞協會台灣蛋雞事業產銷督導委員會」協商後，決定收蛋的「產地價」和售出的「批發價」。在缺蛋危機下，蛋價曾經三周調漲二次，均創下歷史新高。'
