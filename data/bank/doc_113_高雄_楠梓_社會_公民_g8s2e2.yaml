  section: 1
  number: 11
  type: single
  page: 2
  stem: 依據《刑法》規定，刑罰可以分為主刑與從刑。請問：下列關於刑罰的敘述，何者錯誤?
  options:
  - label: A
    content: 刑罰可達到懲罰犯罪、嚇阻犯罪、矯正犯罪的目的
  - label: B
    content: 主刑是可以獨立科處的刑罰，例如:死刑、無期徒刑
  - label: C
    content: 拘役和罰金是屬於主刑
  - label: D
    content: 從刑是附隨於主刑才能科處的刑罰，例如：褫奪公權、沒收
