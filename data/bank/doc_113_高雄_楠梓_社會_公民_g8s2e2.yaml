- id: doc_113_高雄_楠梓_社會_公民_g8s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 當犯罪行為發生，追訴及處罰犯罪的過程，稱為刑事訴訟。請問：下列關於刑事訴訟的敘述，何者正確?
  options:
  - label: A
    content: 刑事訴訟分為偵查→審判→起訴→執行等階段
  - label: B
    content: 檢察官接受警察指揮，協助蒐集證據並製作報告
  - label: C
    content: 法官收到檢察官公訴或被害人自訴後，才能進入審判階段
  - label: D
    content: 判決確定後，由法官負責執行刑罰
