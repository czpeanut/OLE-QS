  section: 1
  number: 12
  type: single
  page: 2
  stem: 當發生法律糾紛時，可以利用權利救濟來確保自己的權利。請問：下列相關敘述，何項錯誤?
  options:
  - label: A
    content: 民事事件與告訴乃論的刑事案件可以採訴訟外的和解來解決
  - label: B
    content: 進行訴訟中的民事案件，仍可以進行和解
  - label: C
    content: 調解可以用來解決民事事件與非告訴乃論的刑事案件
  - label: D
    content: 訴訟因為花錢又費時費力，通常是解決紛爭的最後手段
