- id: doc_113_高雄_楠梓_社會_公民_g8s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 在搭乘電扶梯或在外上廁所時，時有耳聞會有色狼出沒偷拍別人內褲、如廁的畫面，在過往可能成立妨害秘密罪。而刑法新增訂了「妨害性隱私及不實性影像罪」，在
    112 年 2 月 10 日施行上路，使得偷拍別人內褲的罪刑加重了不少，不僅處罰未遂犯，也處罰後續傳播偷拍照片的行為。請問：我國政府修法加重刑責，但對修法前違規，不能依新法加重處分，這是依據刑法的何項原則?
  options:
  - label: A
    content: 時效消滅原則
  - label: B
    content: 誠實信用原則
  - label: C
    content: 權利濫用禁止原則
  - label: D
    content: 罪刑法定原則
