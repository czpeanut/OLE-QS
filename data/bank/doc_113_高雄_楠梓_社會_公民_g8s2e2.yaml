- id: doc_113_高雄_楠梓_社會_公民_g8s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 台中市各調解委員會為了宣導調解，親自下各里、各社區宣導調解機制，也結合廟宇、學校、商家及活動中心等場域進行宣導，並運用機智問答、案例分享、行動劇等方式，使調解概念更加貼近日常生活，期許能持續深化調解至各地，提升調解服務的可及性。請問：下列關於調解的敘述，哪一項錯誤?
  options:
  - label: A
    content: 調解主要是用於解決民事事件或告訴乃論的刑事案件
  - label: B
    content: 調解是依據《鄉鎮市調解條例》來解決紛爭的方式
  - label: C
    content: 調解委員是由法官指定具有法律相關背景的人士擔任
  - label: D
    content: 調解書經法院核定後，和法院判決具有相同效力
