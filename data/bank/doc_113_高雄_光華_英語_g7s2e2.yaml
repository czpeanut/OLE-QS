  - label: D
    content: Valentine’s Day is a new holiday.
  group_stem: 'Valentine’s Day


    Valentine’s Day is on February 14. It is a special day to show love and friendship.
    People give cards, flowers, and chocolates to their loved ones. Some people also
    write love letters or say kind words.


    Red hearts and roses are symbols of Valentine’s Day. Many people wear red or pink
    clothes. Shops sell special gifts, and restaurants are busy with couples.


    This day is not only for boyfriends and girlfriends. Friends and family can also
    celebrate! In some schools, students give small cards to their classmates and
    teachers.


    The history of Valentine’s Day is very old. It comes from a man named Saint Valentine.
    He was kind and helped people. Now, people in many countries enjoy this day.


    Do you celebrate Valentine’s Day? How do people in your country enjoy it?


