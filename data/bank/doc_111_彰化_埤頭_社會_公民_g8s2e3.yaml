- id: doc_111_彰化_埤頭_社會_公民_g8s2e3_s2_11
  section: 2
  number: 11
  type: single
  page: 1
  stem: 兒少是國家未來的希望，預防兒少犯罪是社會大眾共同的責任，以免一失足成千古恨。下列的作法，何者不恰當？
  options:
  - label: A
    content: 民間公團體推動兒少政策與法規修訂
  - label: B
    content: 政府修法加重刑罰，嚇阻兒少以身試法
  - label: C
    content: 重視親職教育有助家庭功能的發揮
  - label: D
    content: 兒少應自我建立正確價值觀，保護自己。
  group_stem: '※韓劇《少年法庭》透過4個態度不同的法官，來探討與分析青少年犯罪。劇情以憎恨少年犯的女法官來到地方法院任職為出發，帶出各種青少年犯罪，劇中揭露了《少年法》對青少年的作用及限制，卻帶出現實的無奈，「年紀小」並不是為所欲為的藉口，而且犯罪背後原因也不能忽略必須徹查到底。

    在韓國其實有不少人都質疑《少年法》必要性，因為許多少年犯真是明知故犯，因為他們知道即使犯了錯，也可以免於刑責，就因為他們是未成年。'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
