    content: 政府限制人民改名的次數屬於濫權的行為。
  group_stem: '某知名迴轉壽司連鎖店推出優惠活動，姓名含有「鮭魚」兩字者可免費用餐，活動消息暴得後陸續有民眾至戶政機關辦理改名，至活動結束為止，有超過300人以「鮭魚」兩字改名。部分民眾、媒體將響應活動改名的行為稱為「鮭魚之亂」。

