  stem: 根據以下報導內容判斷，下列敘述何者正確？
  options:
  - label: A
    content: 戶政人員可因字義粗俗不雅拒絕民眾以「鮭魚」兩字改名
  - label: B
    content: 造成鮭魚之亂的主因為政府不當執行公權力
  - label: C
    content: 《姓名條例》與《噪音管制法》皆屬行政法
