  stem: 史書記載：「凡進貢員役……每次不得過百人，入京員役止許二十人，餘皆留邊聽賞。其進貢船，不得過三隻。每船不得過百人。又定，凡外國進貢，除定例船只外，其接貢、探貢等船，一概阻回，不許放入。」關於文中的貿易模式，下列敘述何者與史實相符？
  options:
  - label: A
    content: 這是盛行於宋元明清的朝貢貿易，是一種以中國作為天朝主導的貿易模式
  - label: B
    content: 康熙時期為了宣揚國威，曾派遣鄭和下西洋，吸引周邊國家朝貢中國
  - label: C
    content: 海商、倭寇及周邊國家可「進貢」中國，以換取經濟利益或政治保護
  - label: D
    content: 進行貿易前中國會先進行「冊封」，中國為宗主國，被冊封國為藩屬國。
