    年）三月十九日，「叛軍」攻入北京，明思宗縊死於萬歲山東麓一株老槐樹上。清軍入關後，將此槐樹稱為「罪槐」，用鐵鍊鎖住，並規定「清室皇族成員路過此地都要下馬步行」。請問：上文中的「叛軍」是指何者？
