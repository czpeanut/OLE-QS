- id: doc_113_新北_崇林_英語_g7s2e2_s4_3
  section: 4
  number: 3
  type: single
  page: 4
  stem: 'Who may be happy to see this reading?

    Chris: I like cooking, but I don’t like to make sweet food. I’m not a fan of sweets.

    Emma: My friend likes to eat chocolate. I want to make some for her.

    Yuri: I’m so hungry! I want to eat a lot of chocolate cake right now!

    Greg: I am a lazy person. I only eat and sleep in my free time.'
  options:
  - label: A
    content: Chris
  - label: B
    content: Emma
  - label: C
    content: Yuri
  - label: D
    content: Greg
  group_stem: '②

    Now I''m going to show you how to work with chocolate.

    I''ll do it in a "bain-marie," or, well, some people call it "water bath."

    To make a "bain-marie," you need two pots(鍋子), one bigger than the other.

    First, break(拆、破砕) the chocolate into small pieces and put them in the smaller
    pot.

    Usually you''ll also need to mix chocolate with butter and sugar.

    Now, half fill(半滿) the bigger pot with warm water, and put the smaller pot in
    the bigger one.

    Then you can start to slowly mix the chocolate, the butter(奶油), and the sugar
    together.

    Keep the water under 50°C, or the chocolate may lose(失去) its shine(光澤).

    And make sure that no water goes in the smaller pot, or the chocolate will become
    hard.

    In that case, you cannot use these chocolate.

    After keep mixing it for about five to ten minutes, the job is done(完成)! Easy,
    right?


    （改寫自109會考）'
