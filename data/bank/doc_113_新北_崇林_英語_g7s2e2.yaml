    Now I''m going to show you how to work with chocolate.

    I''ll do it in a "bain-marie," or, well, some people call it "water bath."

    To make a "bain-marie," you need two pots(鍋子), one bigger than the other.

    First, break(拆、破砕) the chocolate into small pieces and put them in the smaller
    pot.

    Usually you''ll also need to mix chocolate with butter and sugar.

    Now, half fill(半滿) the bigger pot with warm water, and put the smaller pot in
    the bigger one.

