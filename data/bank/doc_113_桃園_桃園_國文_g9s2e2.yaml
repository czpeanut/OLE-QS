    \ 吋相片1 張，至考場試務中心申請補發。\n（二）考生不得攜帶非應試用品進入試場。非應試用品舉例如下：\n（1）妨害考試公平之用品：如教科書、參考書、補習班文宣品、計算紙等。\n\
    （2）具有傳輸、通訊、錄影、照相、計算功能或發出聲響之用品\n（四）隨身用品之規範\n1.考生僅能攜帶手錶為計時工具，惟電子錶應解除響鈴功能。\n2.考生若因生病等特殊原因，迫切需要在考試時飲水或服用藥物，須於考前持相關證明經監試委員同意後，在監試委員協助下飲用或服用。\n\
    （六）冷氣試場開放原則\n1.冷氣開放係屬服務措施，若考試進行當中臨時發生跳電、冷氣故障，將開啟門窗及風扇，繼續考試，考生不得要求更換試場；且無論能否修復，考生均不得要求加分或延長考試時間等。\n\
    二、入場及考試期間規則\n（一）入場之規範\n1.考生若不慎將非應試用品攜入試場，應於考試開始前放置於試場前後方，且電子產品須先關機或拔除電池，不得於.考試期間發出聲響或影響試場秩序。\n\
    2.入場坐定後，考生應將准考證置於桌面，以配合監試委員查驗。\n3.於入場後發現准考證未帶或遺失，考生應立即告知監試委員；經監試委員查核為考生本人無誤者，先准予應試，但考生應於當節考試結束後至考場試務中心申請補發。\n\
    （二）考試說明時段內之規範\n1.考試說明開始後，考生即不准離場。\n2.考試說明時段內，考生不得提前翻開試題本，亦不得提前書寫、畫記、作答。\n（三）截止入場時間之規範\n\
    1.國文、英語（閱讀）、數學、社會、自然、寫作測驗：考試正式開始後，考生遲到逾20 分鐘不得入場。\n2.英語（聽力）：試題開始播放後，考生即不得入場。\n\
    3.考生若英語（閱讀）缺考，英語（聽力）仍可入場應試。\n（四）英語（聽力）試題播放說明\n1.試題重播期間，視同英語（聽力）考試時間，考生不得提前離場。\n\
    （五）考生若因病、因故（如廁等）須暫時離開座位，須經監試委員同意及陪同下，始准離座。考生經治療或處理後，如該節考試尚未結束時，仍可繼續考試，但不得請求延長時間或補考。\n\
    三、作答規則\n（一）考試正式開始鐘聲響起，考生應於試題本封面▢▢處填入准考證末兩碼，並可開始動筆作答。\n（二）開始作答前，考生應檢查准考證、答案卡（卷）、桌角貼條之准考證號碼是否相符，以及答案卡（卷）之科別是否正確。\n\
    （三）未依作答規定畫記或書寫，致使無法正確判讀或無法清晰呈現作答結果，後果由考生自行負責，不得提出異議。\n（五）試題本及答案卡（卷）如有印刷不清、缺頁、漏印或汙損等情形，考生應立即舉手告知監試委員。\n\
    （六）考試期間，考生不得抄錄試題或答案並攜出試場。\n四、離場規則\n（一）提早離場時間之規範\n國文、英語（閱讀）、數學、社會、自然、寫作測驗：考試正式開始後30\
    \ 分鐘內，不得提早離場。\n英語（聽力）：（1）考試結束前，不得提早離場。\n            （2）試題重播期間，視同英語（聽力）考試時間，不得提早離場。\n\
    （二）考試結束鐘聲響起，考生不論答畢與否應立即停止作答，靜候監試委員收取試題本及答案卡（卷）。\n（三）考生不得將試題本或答案卡（卷）攜出試場。\n五、其他\n\
    （一）如因故停電導致照明設備無法使用時，考生應繼續作答；無論復電與否，均以受影響時間延長考試時間，但至多以20 分鐘為限。                \
    \         節錄自〈國中教育會考 試場規則〉"
