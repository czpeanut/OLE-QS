  stem: 原住民選民在立委選舉時要具有投票權，除具有國籍以及原住民身分外，還要有哪些資格？（甲）年滿18歲（乙）年滿20 歲（丙）戶籍設在選舉區滿4 個月以上（丁）戶籍設在選舉區滿6
    個月以上（戊）未受監護宣告
  options:
  - label: A
    content: 乙丙
  - label: B
    content: 乙丙戊
  - label: C
    content: 甲丁
  - label: D
    content: 甲丁戊
  group_stem: 由於設籍在都市的原住民相當分散，根據中選會在2020 年的統計，全國山地原住民立委選舉共有1,653 間投票所只有1 張原民選票、平地原住民立委選舉則有1,623
    間投票所只有1 張原民選票。也就是說，這些投票所的1位原住民選舉人只要有去投票，外界就會知道他投給了哪位原住民立委候選人，就如同公開亮票一樣。【報導者2023-08-21】
- id: doc_113_新北_崇林_社會_g8s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 上文中設籍於都市的山地及平地原住民選民，因選舉制度設計導致必須選舉原住民立委候選人，不能投票給戶籍所在地的區域立委，而原住民立委往往關注焦點都在原鄉及部落，很少針對住在都市的原住民提出他們所需要的政策，導致設籍在都市的原住民投票意願低落。請問：本題題幹敘述的內容，較符合對人的選舉可以產生的何種功能之探討？
  options:
  - label: A
    content: 定期選舉可使勝選的政黨具有組織政府的合法性
  - label: B
    content: 人民可以以選票決定執政者或執政黨的去留
  - label: C
    content: 選民會以候選人提出的政見做為投票考量的依據
  - label: D
    content: 人民可以透過投票罷免不適任公職人員
  group_stem: 由於設籍在都市的原住民相當分散，根據中選會在2020 年的統計，全國山地原住民立委選舉共有1,653 間投票所只有1 張原民選票、平地原住民立委選舉則有1,623
    間投票所只有1 張原民選票。也就是說，這些投票所的1位原住民選舉人只要有去投票，外界就會知道他投給了哪位原住民立委候選人，就如同公開亮票一樣。【報導者2023-08-21】
