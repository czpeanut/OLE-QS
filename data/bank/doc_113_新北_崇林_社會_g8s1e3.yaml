  page: 2
  stem: 各界人士對於紀念日及節日實施條例的立法樂見其成，立法院內政委員會也針對立法內容召開公聽會邀請政府官員、民意代表、學者專家、利益團體代表等進行座談，儘管朝野對於增加國定假日都有共識，但對於該選擇哪些節日放假，卻仍有截然不同的主張。請問：各界人士積極參與公聽會表達意見，是由於紀念日及節日實施條例的立法，具有公共意見的何種特性？
