- id: doc_113_新北_崇林_社會_g8s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 西元1872 年的11 月5 日，美國女權運動家安東尼（Susan B. Anthony）在當時法律規定女性無投票權的情況下，悍然違法投下神聖的一票．開創女性選舉權抗爭之路。直到1920
    年，美國最高法院終於通過「憲法第十九修正案」，禁止以性別來剝奪選舉權。請問：女性和男性同樣都具有選舉權，符合何項投票公平原則？
  options:
  - label: A
    content: 普通原則
  - label: B
    content: 平等原則
  - label: C
    content: 直接原則
  - label: D
    content: 無記名原則
- id: doc_113_新北_崇林_社會_g8s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 下列何者與公聽會同屬於民眾直接向政府表達意見的管道？
  options:
  - label: A
    content: 參與冬季青鳥行動集會，表達對立法院三讀通過選罷法、憲法訴訟法、財政收支劃分法的看法
  - label: B
    content: 參加政黨及利益團體
  - label: C
    content: 在購物平台辦的民意調查填寫線上問卷
  - label: D
    content: 在有87 萬追蹤者的知名律師Fb 留言，說明自己對於立法院欲修改老人福利法，讓低所得老人免繳健保費的看法
  group_stem: 立法院內政委員會今天舉行「紀念日及節日實施條例草案」公聽會，學者贊成將實施辦法提升到法律層級，建議勞動節、教師節應全國統一放假；中華民國全國工業總會盼衡平考量所有因素，讓企業界能有更好發展。現行「紀念日及節日實施辦法」僅屬行政命令層級，包含台灣民眾黨立院黨團、國民黨立委、民進黨立委與無黨籍立委等朝野立委，都提案將實施辦法提升為法律。與會學者表示表示，全國一致性假日應以社會共同紀念日、民俗假日為基本範圍，不宜針對特定行業、群體；法制化的重點在於規範假日的決定程序，建立各方可依循的遊戲規則，並確保各方能落實執行。【中央社2024-10-23】
