  group_stem: '下述四份資料分別是清末時期不同人士提出的看法，請依題目敘述回答32~34 題

    資料一：此人於1874 年奏請皇帝的《籌議海防摺》中提到「臣查各國條約已定，斷難更改，江海各口，門戶洞開，已為我與敵人公共之地。……至本年日本興兵臺灣一事，經總理衙門王大臣與該使多方開諭，幾於管禿脣焦，猶賴聖明主持於上，屢飭各疆臣嚴密籌防，調兵集船，購利器、築砲臺……」他認為應該讓天下有志之士，都明白洋務、練兵、製器、造船各事，也支持改革運動並代表清朝於20
    年後與日本的戰爭簽訂條約割讓臺灣、澎湖。

    資料二：此人於《變法通議》提到「自強於今日，以開民智為第一義。…科舉之制不改，便缺乏才學；師範學堂不立，便無適當的教師；專門學問不加歐分，便不能專精。這三者是中國的病根。」《詩》曰：「周雖舊邦，其命維新。」言治舊國必用新法也……。另外還提出應該要解纏足、興女學，以達到保國強種的看法。

    資料三：此人曾上書皇帝：「迨流毒於天下，則為害甚巨，法當從嚴。若猶泄泄視之，是使數十年后，中原幾無可以御敵之兵，且無可以充餉之銀。」現在不好好處理此事，未來清朝將面臨無錢無人的困境。

    資料四：代表英國出訪清朝並在其著作《英使謁見乾隆紀實》寫到「英王陛下抱著最崇高的敬意派遣使節覲見中國皇帝陛下。……本使準備在下述條件下這樣做：貴國皇帝欽派一位同本使地位身分相同的大員，穿著朝服在英王陛下御像前行本使在貴國皇帝面前所行的同樣禮節……。」'
