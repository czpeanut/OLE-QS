    \ 多家知名品牌合作，推出《魷魚遊戲》相關商品和客製化廣告，被譽為「行銷教科書」。\n    Netflix 近日在全球推出別出心裁的大型行銷活動，包括讓「英熙」大娃娃現身首爾光化門廣場、泰國曼谷昭披耶河、澳洲雪梨歌劇院、義大利威尼斯、台灣高雄愛河等知名地標。美國洛杉磯舉辦了一場4.56\
    \ 公里的路跑活動，吸引1600 多人參加，爭取試映會門票。法國巴黎香榭麗舍大道上，也有456 名穿著綠色運動服的粉絲參與「123 木頭人」遊戲。"
