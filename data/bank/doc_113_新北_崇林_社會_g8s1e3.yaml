- id: doc_113_新北_崇林_社會_g8s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 因原住民在立委選舉時要投票給原住民立委，但卻由於設籍在都市的原住民相當分散，導致有很多投票所只有1 張原住民選票，只要該位選舉人有去投票，外界就可知道他投給哪位原住民立委候選人，此種狀況可能有違憲法的何項投票公平原則？
  options:
  - label: A
    content: 普通原則
  - label: B
    content: 平等原則
  - label: C
    content: 直接原則
  - label: D
    content: 無記名原則
  group_stem: 由於設籍在都市的原住民相當分散，根據中選會在2020 年的統計，全國山地原住民立委選舉共有1,653 間投票所只有1 張原民選票、平地原住民立委選舉則有1,623
    間投票所只有1 張原民選票。也就是說，這些投票所的1位原住民選舉人只要有去投票，外界就會知道他投給了哪位原住民立委候選人，就如同公開亮票一樣。【報導者2023-08-21】
