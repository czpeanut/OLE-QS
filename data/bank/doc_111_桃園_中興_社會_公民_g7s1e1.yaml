- id: doc_111_桃園_中興_社會_公民_g7s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 人權的核心價值在於保護人性尊嚴，希望能夠讓每個人獲得平等發展的機會，因此有時候會給社會中的弱勢團體比較多的資源分配，捍衛社會中的公平正義；請問以下敘述何者不符合上述捍衛公平正義的精神?
  options:
  - label: A
    content: 原住民在台灣族群上的少數，若採政治上的多數決，也會成為政治上的弱勢，因此設立原住民立委保障名額
  - label: B
    content: 為保護原住民族語與文化，在升學制度上開放外加名額給原住民學生，並將其所學專業回饋到部落發展
  - label: C
    content: 以法令強制規定雇主必須僱用一定比率身心障礙者，該定額進用制度是為了保障及促進身心障礙者就業機會
  - label: D
    content: 憲法保障每位國民必須接受義務教育，這是身為國民的權利也是義務。
  tags:
    chapter:
