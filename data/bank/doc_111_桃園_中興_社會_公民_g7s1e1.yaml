- id: doc_111_桃園_中興_社會_公民_g7s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: '將在 2022 年底大選登場的「18 歲公民權」投票，希望能夠將選舉權年齡調整至 18 歲，是我國首度進到公投階段的修憲案，台灣若要跟上世界民主潮流、保障青年參政權，得先跨越
    965 萬同意票的修憲複決高門檻，通過之後，18-19 歲年齡階段的成年人除了擁有公民投票的權利，還會同時擁有對候選人的選舉與罷免權。


    依據上面文章，判斷下列何者錯誤?'
  options:
  - label: A
    content: 該項公投通過以後，只要年滿 18 歲就能擁有投票選出候選人的權利
  - label: B
    content: 這次公投只要年滿 20 歲以上就能參與
  - label: C
    content: 修憲案必須通過公投 965 萬票的同意門檻
  - label: D
    content: 公投的目的是希望讓民眾直接表達對於重大議題的贊成或反對態度
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 公民
      code: 1-1
      title: 什麼是公民？
      chapter: 第1章 公民與公民德性
    textbook: 七上公民 1-1 什麼是公民？
    labeled_by: ai
