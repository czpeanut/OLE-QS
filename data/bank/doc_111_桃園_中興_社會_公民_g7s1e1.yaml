- id: doc_111_桃園_中興_社會_公民_g7s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: '國際特赦組織因為移工在卡達世界盃場地興建的勞動環境嚴苛，並未給予移工足夠薪水或是公平待遇，而且移工被禁止參加工會，無法為自己爭取更好的勞動條件，因此呼籲加入連署向國際足球總會要求揭發卡達虐待移工的行為。


    根據上文卡達移工的處境，下列敘述何者正確?'
  options:
  - label: A
    content: 卡達移工參加工會的權利不可以被剝奪，違反人權平等、不可剝奪的本質
  - label: B
    content: 卡達移工必須要與雇傭公司共體時艱，少領薪水也沒關係
  - label: C
    content: 國際足球總會對於卡達移工的權利受損並未有任何影響力
  - label: D
    content: 移工未受到良好待遇是移工在求職前並未做好評估，因此必須自負風險責任，不需要加入特赦組織的聯署
  tags:
