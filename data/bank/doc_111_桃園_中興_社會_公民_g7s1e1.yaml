  section: 2
  number: 20
  type: single
  page: 4
  stem: 從龍昇村鄉親對於反對坤輿掩埋場的抗爭行動，我們可以得知龍昇村鄉親具備下列何項公民德行?
  options:
  - label: A
    content: 參與公共事務
  - label: B
    content: 遵守法律規範
  - label: C
    content: 理性思考批判
  - label: D
    content: 和平尊重包容
  group_stem: "「苗栗龍昇村鄉親打死不退的精神，與各路貴人的幫助，獲得抗爭勝利！」苗栗坤輿事業廢棄物掩埋場「同意設置文件」已在 9/13 到期，兩天後正式失效。反坤輿掩埋場自救會今（14）天在坤輿科技公司門口宣告抗爭勝利。立委邱顯智也在石塊上噴漆寫字「關門大吉」，他說本次抗爭勝利要感謝龍昇村居民自己，為台灣示範「不畏強權、不畏黑金勢力」\n\
    \  坤輿掩埋場設置地距離不到 300 公尺就是灌溉周遭 500 甲農田的「龍昇湖」，尤其當地土層透水性佳，在地鄉親為保護龍昇湖水源不被污染，自 2021\
    \ 年重啟抗爭。\n  自救會會長陳清鑫表示，鄉親的抗爭主要有兩個策略：「阻擋傾倒廢棄物」及「行政訴訟」。居民在坤輿公司門口埋鍋造飯長達 1 年 9 個月，鄉親們輪三班駐守阻擋坤輿「試運轉」、不讓載送廢棄物的卡車進入掩埋場傾倒，同時由律師協助，針對坤輿公司設置程序瑕疵，向苗栗縣府提出行政訴訟。\n\
    \  抗爭期間自救會除多次北上各部會陳情，甚至歷經多次坤輿公司為了突破門口抗爭防線，派多名黑衣人與鄉親暴力對峙、流血衝突，連前來聲援的立委、議員都被辣椒水、石塊、鐵椅攻擊。\n\
    \  立委陳椒華提到本案難得有各黨反對，台灣各地仍有許多廢棄物濫倒情況，期望本案的勝利能夠喚醒政府的無作為，修訂更嚴格的廢棄物管理辦法。立委洪申翰期望未來各黨能夠持續努力合作監督廢棄物政策。\n\
    改自苗栗反坤輿掩埋場宣告抗爭成功，續關注全臺濫倒廢棄物問題\n2022/9/14  文/公庫記者楊鵑如"
