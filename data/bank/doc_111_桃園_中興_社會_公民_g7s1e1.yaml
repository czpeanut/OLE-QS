- id: doc_111_桃園_中興_社會_公民_g7s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '請依照下文，判斷下列觀念何者符合保障人性尊嚴的精神?


    印度種姓制度將人分為四個階級，嚴格規定每個階級的身分與地位，位居最下層的賤民階級，地位最低，階級世代相傳，不被允許與其他階級接觸，只被允許從事卑賤的工作，其他階級的人可以隨意處置賤民階級。，該傳統直到現在仍有地方繼續保持。'
  options:
  - label: A
    content: 人有高低優劣之分，制定階級有利社會進步
  - label: B
    content: 為了使社會這部大機器運作，階級就像是零件一樣，維持社會穩定
  - label: C
    content: 傳統習俗為社會根本，必須盡力維護
  - label: D
    content: 任何人都應受到平等對待，不得侵害人性尊嚴。
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 公民
