  group_stem: "今日（9/16）台灣與日本籍跨國同性伴侶阿樹與有吉英三郎，在台灣伴侶權益推動聯盟、日本明治大學鈴木賢教授、以及多位跨國同性伴侶的陪同下，於台北市大安戶政事務所正式登記結婚，阿樹的父親透過網路直播全程陪同，給予當事人祝福。\n\
    \n  此案是在伴盟義務律師團的協助下，於今年 7 月 21 日獲得台北高等行政法院勝訴判決，本件法院以「涉外民事法律適用法」第 8 條公序良俗條款為由，認定台北市大安戶政事務所拒絕兩人登記結婚違背我國憲法基本權，判准兩人登記結婚。大安戶政事務所並未上訴，本案判決已確定。\n\
    \n  伴盟秘書長簡至潔說明，本件已是伴盟義務代理跨國同婚的第三件全面勝訴判決，被告都是台北市戶政機關，台北市均未上訴，顯然台北市府民政局折服法院判決結果。日前台北市民政局長藍世聰在答詢議員王鴻薇質詢時，已當場允諾法律應該一體適用，台北市傾向通案處理，唯仍需詢問內政部意見。簡至潔表示，既然連地方政府都認為持續拒絕跨國同性伴侶登記結婚沒有道理，伴盟接下來會代表更多跨國同婚當事人前往戶政要求登記結婚，希望內政部從善如流，勿再阻擋，成為跨國同婚的最大絆腳石！\n\
    改自 台灣伴侶權益推動聯盟新聞稿 2022/9/16"
