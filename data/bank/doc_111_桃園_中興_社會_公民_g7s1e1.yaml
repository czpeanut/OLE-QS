  section: 1
  number: 8
  type: single
  page: 2
  stem: 要成為一個成熟的公民必須具備基本的公民德性，才能理性參與民主社會的公共事務，建立自由平等的社會，請問下列關於公民德性的展現，何者為非?
  options:
  - label: A
    content: 民眾上網登錄政府網站平台表達對於公共政策的意見並且連署
  - label: B
    content: 不須維護少數族群的權利，適者生存，無法適應社會就必須被淘汰
  - label: C
    content: 面對龐大的資訊量，需要小心謹慎地求證資料的真實性
  - label: D
    content: 社會上有著多元意見，彼此應該要理性討論，尋求最大共識
