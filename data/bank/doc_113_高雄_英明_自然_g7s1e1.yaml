- id: doc_113_高雄_英明_自然_g7s1e1_s2_31
  section: 2
  number: 31
  type: single
  page: 3
  stem: '阿花和阿草將寫有字母「pbq」的玻片分別放在解剖和複式顯微鏡下觀察，請問觀察結果何者正確？


    | 選項 | 解剖顯微鏡 | 複式顯微鏡 |

    | :--- | :--- | :--- |

    | 甲 | pbq | bqd |

