- id: doc_113_高雄_英明_自然_g7s1e1_s1_1
  section: 1
  number: 1
  type: tf
  page: 1
  stem: 使用複式顯微鏡的高倍物鏡觀察細胞時，也要先調粗調節輪再調細調節輪使影像清晰。
- id: doc_113_高雄_英明_自然_g7s1e1_s1_2
  section: 1
  number: 2
  type: tf
  page: 1
  stem: 虎克是第一個發現細胞的學者，並進一步提出了細胞學說。
- id: doc_113_高雄_英明_自然_g7s1e1_s1_3
  section: 1
  number: 3
  type: tf
  page: 1
  stem: 草履蟲一個細胞所表現出來的功能，比鯊魚一個細胞所表現出來的功能還要多。
- id: doc_113_高雄_英明_自然_g7s1e1_s1_4
  section: 1
  number: 4
  type: tf
  page: 1
  stem: 葡萄糖是細胞生存所需要的營養成份，但是葡萄糖無法經由擴散作用自由通過細胞膜。
- id: doc_113_高雄_英明_自然_g7s1e1_s1_5
  section: 1
  number: 5
  type: tf
  page: 1
  stem: 許多開花植物的果實跟種子中都儲存了很多養份，所以植物的果實應該歸類為營養器官。
- id: doc_113_高雄_英明_自然_g7s1e1_s1_6
  section: 1
  number: 6
  type: tf
  page: 1
  stem: 生物圈的範圍主要分布在地表的陸域、淺層水域和低層大氣等區域，約為10000 公尺的範圍，而這個 生物圈的範圍將來是有可能被改變的。
- id: doc_113_高雄_英明_自然_g7s1e1_s1_7
  section: 1
  number: 7
  type: tf
  page: 1
  stem: 在進行實驗驗證假設時，如果要探討影響實驗結果的變因有兩項，則可以在實驗組和對照組中設置 兩個操縱變因來同時進行實驗。
- id: doc_113_高雄_英明_自然_g7s1e1_s1_8
  section: 1
  number: 8
  type: tf
  page: 1
  stem: 一般而言具有葉綠體的植物細胞通常會是綠色的，但是綠色葉片上的所有細胞並非都有葉綠體可以 進行光合作用。
- id: doc_113_高雄_英明_自然_g7s1e1_s1_9
  section: 1
  number: 9
  type: tf
  page: 1
  stem: 觀察人類口腔皮膜細胞在未染色的狀況下，於複式顯微鏡中可以清楚觀察到細胞核、細胞膜、粒 線體、液胞等構造。
- id: doc_113_高雄_英明_自然_g7s1e1_s1_10
  section: 1
  number: 10
  type: tf
  page: 1
  stem: 當我們把一片薄薄的葉子放在複式顯微鏡上並沒有辦法直接觀察到葉子的表皮細胞和保衛細胞，主 要原因是因為葉子的厚度無法讓光線穿透。
- id: doc_113_高雄_英明_自然_g7s1e1_s2_11
  section: 2
  number: 11
  type: single
  page: 1
  stem: 有一具複式顯微鏡其目鏡有 5 X、10 X、15 X，物鏡有 10 X、20 X、40 X，則此顯微鏡共有幾種 不同的放大倍率？
  options:
  - label: A
    content: '6'
  - label: B
    content: '7'
  - label: C
    content: '8'
  - label: D
    content: '9'
- id: doc_113_高雄_英明_自然_g7s1e1_s2_12
  section: 2
  number: 12
  type: single
  page: 1
  stem: 小東觀察標本時，所使用的物鏡倍率為 10X、目鏡倍率為 15X，若以標準尺測得此生物在顯微鏡視 野下的長度為0.60mm，請問此生物體的實際長度為何？
  options:
  - label: A
    content: 4 mm
  - label: B
    content: 0.04 mm
  - label: C
    content: 0.004 mm
  - label: D
    content: 0.0004 mm
- id: doc_113_高雄_英明_自然_g7s1e1_s2_13
  section: 2
  number: 13
  type: single
  page: 1
  stem: 小明在實驗室進行生物組織的切片觀察，他在顯微鏡下觀察後認為是動物的組織，你認為他是以下 列哪一項觀察結果作為判斷依據？
  options:
  - label: A
    content: 細胞中沒有發現葉綠體
  - label: B
    content: 細胞中沒有發現液胞
  - label: C
    content: 細胞中沒有發現細胞壁
  - label: D
    content: 細胞中有發現粒線體
- id: doc_113_高雄_英明_自然_g7s1e1_s2_14
  section: 2
  number: 14
  type: single
  page: 1
  stem: "(甲) 將量筒放在酒精燈上直接加熱   (乙) 把小蘇打粉和水加入量筒中混合攪拌成溶液     \n(丙) 在量筒中測量不溶於水物質的體積； 以上關於量筒的使用方法哪幾種方法不恰當？"
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲乙
  - label: C
    content: 甲
  - label: D
    content: 都無不當。
- id: doc_113_高雄_英明_自然_g7s1e1_s2_15
  section: 2
  number: 15
  type: single
  page: 1
  stem: 使用複式顯微鏡觀察玻片標本時，如果視野的上方較暗，下方比較亮，則應該調整哪一個部位？
  options:
  - label: A
    content: 反光鏡
  - label: B
    content: 目鏡
  - label: C
    content: 光圈
  - label: D
    content: 旋轉盤  。
- id: doc_113_高雄_英明_自然_g7s1e1_s2_16
  section: 2
  number: 16
  type: single
  page: 1
  stem: 捕蠅草可以迅速捕捉昆蟲並且將蟲體分解成養份並吸收，這整個過程包含了哪些生命現象的表現？
  options:
  - label: A
    content: 生長和代謝
  - label: B
    content: 運動與生殖
  - label: C
    content: 運動和生長
  - label: D
    content: 感應與代謝
- id: doc_113_高雄_英明_自然_g7s1e1_s2_17
  section: 2
  number: 17
  type: single
  page: 1
  stem: 小度利用解剖顯微鏡觀察蚯蚓的細部構造，在觀察時，載物板上的蟲體不斷地往左上角移動，則 在視野下觀察到蟲體的移動方向應為下列何者？而小度應該將載物板如何移動，蟲體影像才不會
    在視野中消失？
  options:
  - label: A
    content: 影像往右上角移動 要將載物板往左下方拉
  - label: B
    content: 影像往左上角移動 要將載物板往右下方拉
  - label: C
    content: 影像往右下角移動 要將載物板往左上方拉
  - label: D
    content: 影像往左上角移動 要將載物板往左上方拉
- id: doc_113_高雄_英明_自然_g7s1e1_s2_18
  section: 2
  number: 18
  type: single
  page: 1
  stem: 如果將人體的白血球以及植物的保衛細胞分別放置於兩杯蒸餾水中一段時間，則關於哪一種細胞 不會破裂以及其原因，下列何者最合理？
  options:
  - label: A
    content: 白血球不會破裂因為有粒線體
  - label: B
    content: 白血球不會破裂因為有細胞膜
  - label: C
    content: 保衛細胞不會破裂因為有液胞
  - label: D
    content: 保衛細胞不會破裂因為有細胞壁。
- id: doc_113_高雄_英明_自然_g7s1e1_s2_19
  section: 2
  number: 19
  type: single
  page: 2
  stem: 如右圖所示，甲和乙為一台複式顯微鏡上兩種不同倍率的物鏡， 小明使用此顯微鏡觀察口腔皮膜細胞，他按照使用顯微鏡的標準 步驟依序開始操作，則有關物鏡的轉換及視野的變化下列敘述何者
