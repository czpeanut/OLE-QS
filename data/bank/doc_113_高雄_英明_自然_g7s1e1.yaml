  stem: 頑皮的小胖把一隻死青蛙放入濃度為0.6%的食鹽水中，發現青蛙的身體膨脹了，由此可知該青 蛙的細胞生理鹽水的濃度應該為多少比較合理？ (已知海水約為30%的鹽水濃度)
