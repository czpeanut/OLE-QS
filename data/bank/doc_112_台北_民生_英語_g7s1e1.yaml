  group_stem: 'A.

    Nick: Hi, Stella. What are you doing here?

    Stella: Peter and I are talking about the Chinese zodiac animal sign. By the way,
    this is Peter, my friend.

    Peter: Nice to meet you.

    Nick: Nice to meet you, too. I''m Nick. Stella is my cousin.

    Nick: So, what is your animal sign, Stella?

    Stella: My birth year is 1993. I''m a rooster.

    Nick: What about Peter?

    Stella: His birth year is 1995. He''s a pig.

    Nick: What about me?

    Stella: How can you not know your animal sign?

    Nick: Haha. I just remembered(記起) that I''m a rat.

    Stella: Yes, you are 3 years younger than me. Wait, my dad calls me. Hello...we
    are near home...yes...

    Nick: Is this Andy? I want to talk to him, too. I miss him.

    Stella: Dad, Nick wants to talk with you.'
