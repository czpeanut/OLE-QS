- id: doc_113_台中_居仁_社會_歷史_g8s1e1_s2_38
  section: 2
  number: 38
  type: single
  page: 4
  stem: 請問根據毛公鼎上的記載，可作為何種制度曾經存在過的歷史證據？
  options:
  - label: A
    content: 世襲
  - label: B
    content: 禮樂
  - label: C
    content: 封建
  - label: D
    content: 郡縣
  group_stem: '(三)以下是小耀到某處看到的古代文物紀念品展，請根據以下四個文物簡介，回答下列問題:

    | 文物代號 | 名稱 | 簡介 |

    | --- | --- | --- |

    | 文物甲 | 毛公鼎 | 這件青銅器上記載西周宣王年間冊封其叔父毛公時的叮嚀，文中提到：「希望你在掌理政務，要好好治理領地，對王室要忠心，時時刻刻與我合作，使我們國家的各項政令，都能和諧的、順利的進行。」
    |

    | 文物乙 | 何尊 | (子)早期青銅酒器，是一位名叫「何」的宗室貴族祭祀所用的尊，作於成王五年，是(子)已知最早的有明確紀年的青銅器，內有記述成王繼承武王遺志，營建東都成周之事……成王將貝幣30
    朋賞賜給何，何因此作尊以紀念 |

    | 文物丙 | 三彩馬球仕女俑 | 整件作品為灰黃陶胎，施白色陶衣，三彩釉黃、綠、白、褐色相間，色彩淋漓鮮豔。該朝代婦女以健康為美，喜愛穿著翻領窄袖軟靴的胡衫，裝束輕便地從事多種馬上活動。波斯的馬球，就很受該朝代上層社會的歡迎
    |

    | 文物丁 | 兵馬俑 | 兵馬俑，位於(丑)陵墓的外圍，有戍衛陵寢的含義。在人們初次見到兵俑時，兵俑衣著、武器的顏色還十分鮮艷，非常好看，歷經兩千年威武不減；但是在考古學家挖出土時，受空氣氧化影響，數分鐘內即漸漸剝落消失，只剩下一般大眾印象中的陶土色。
    |'
