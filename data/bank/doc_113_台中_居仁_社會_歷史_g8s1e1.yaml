  group_stem: '(二)請閱讀完以下兩則資料回答下列問題:

    資料一:絲綢之路是指從都城(子)出發，經甘肅、新疆，到中亞、西亞、歐洲，並聯結地中海各國的陸上通道，最遠到達西亞諸國的陸上貿易通道，後來班超再次出使西域打通了荒廢已久的絲綢之路，將東端延伸到京師洛陽，西端延伸到歐洲。這條道路也被稱為「陸上絲綢之路」

    資料二:中國最早在《詩經》裡就有野葡萄的記載，可知古人已知道採集並食用各種野葡萄了。但直到(丑)時期，著名的大探險家(寅)出使西域時，從大宛帶來了歐亞種葡萄與釀酒師，中國人才開始對葡萄酒有進一步的認識。葡萄酒在中國古代被叫作『蒲陶酒』，詞源即可能為古希臘語發音的轉譯。'
