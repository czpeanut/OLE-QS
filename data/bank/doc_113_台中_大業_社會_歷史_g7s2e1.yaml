- id: doc_113_台中_大業_社會_歷史_g7s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 臺灣總督府曾公告：「全島蔗作區劃分為數個區域，在劃分指定區域內，非經許可，不得設立糖廠或糖廍，蔗農不得跨區出售甘蔗，只能賣給政府指定區域內的糖廠，亦不得把甘蔗用作製造砂糖以外的用途，且甘蔗收購價格由糖廠自行決定。」試問：按日治時期的糖業發展特色，本政策主要目的可能為何？
  options:
  - label: A
    content: 使甘蔗有固定買主，保障蔗農利益
  - label: B
    content: 確保砂糖供給以滿足日本國內需求
  - label: C
    content: 確保糖廠之原料供給及價格，保障資本家利益
  - label: D
    content: 免除價格協商過程摩擦，簡化貿易流程的進行。
