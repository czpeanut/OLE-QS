- id: doc_113_台中_大業_社會_歷史_g7s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 學者對日本統治時期臺灣學生的校外旅行有以下敘述：「臺北是政治中心，常是外地學校旅行的首選，當時參訪景點包含臺灣神社、臺北市街、總督府等，讓學童藉此感受臺北的文明進步。隨著此一史事的發生，日本展開對外作戰，之後的旅遊行程則以到臺灣神社參拜、為國祈福，並前往醫院慰問戰爭中受傷士兵為主。」試問：文中的「史事」應為下列何者？
  options:
  - label: A
    content: 甲午戰爭
  - label: B
    content: 噍吧哖事件
  - label: C
    content: 中日戰爭
  - label: D
    content: 第一次世界大戰。
