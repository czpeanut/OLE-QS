- id: doc_113_台中_大業_社會_歷史_g7s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 根據上述兩項資料，當年完工的水利建設促使圖(一)中哪個平原農產量大增？
  options:
  - label: A
    content: ㄅ
  - label: B
    content: ㄆ
  - label: C
    content: ㄉ
  - label: D
    content: ㄈ。
  group_stem: '以下係兩則有關臺灣農業發展的資料，試閱讀後進行分析以回答問題。

    資料一：臺灣某處平原擁有廣大的平坦地形及溫暖的氣候，具備農業發展的條件，惟此區域降雨量分配不平均、年平均溫度高、蒸發量大，在缺乏穩定的灌溉水源情況下，農業生產效率不佳。

    資料二：八田與一探勘後發現此區流域上游有建造大型貯水池的潛能，於是推動「官佃溪埤圳計畫」，歷經10 年完工。而這個水利建設完工後，讓當地灌溉面積增加1倍，4
    年後水稻收穫增加4 倍。'
  shared_asset: g1_6_7
  tags:
    chapter:
      publisher: 康軒
      book: 七下
      subject: 歷史
      code: 2-1
      title: 基礎建設
      chapter: null
    textbook: 七下歷史 2-1 基礎建設
    labeled_by: ai
