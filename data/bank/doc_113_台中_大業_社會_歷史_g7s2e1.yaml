  stem: '在課堂中，旻浩看到了社會課本中出現了表（一）的表格，驚覺日本配置在臺灣與朝鮮的警察比例竟有將近三倍之差，對此感到十分訝異。試問，柔柔該如何向旻浩解釋這張表格的意涵？


    | 地區 | 警察比例（警察／當地人口數） |

    | --- | --- |

    | 日本 | 1 : 1105 |

    | 朝鮮 | 1 : 1040 |

    | 臺灣 | 1 : 386 |'
  options:
  - label: A
    content: 臺灣治安良好，派駐警察人數最低
  - label: B
    content: 日本內地因每個警察管轄人數最少，因而有良好治安
  - label: C
    content: 日本透過警察嚴密控制臺灣
  - label: D
    content: 臺灣土地面積狹小，故每個警察管轄的人數遠多於朝鮮。
  group_stem: '12~15 為題組

