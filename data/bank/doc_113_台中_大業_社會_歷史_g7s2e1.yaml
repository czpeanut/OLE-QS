  stem: 接著，兩人在假日時，搭乘臺鐵的阿里山線前往阿里山。在乘車過程中，旻浩對於阿里山線的「之」字型鐵路感到嘖嘖稱奇，在柔柔的細心解說下才知道，原來係因地形陡峭、迴轉空間不足，火車無法直接轉彎而有此種設計。為此，旻浩詢問：「日本大費周章建造此種鐵路的目的是甚麼呢？」試問，柔柔該如何回答？
  options:
  - label: A
    content: 強化原住民部落聯繫
  - label: B
    content: 方便壓制原住民
  - label: C
    content: 讓南北交通更便利
  - label: D
    content: 配合林野調查與開發森林資源。
  group_stem: '12~15 為題組

