- id: doc_113_台中_大業_社會_歷史_g7s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 兩人接著前往高雄，觀賞時下最夯的「吉伊卡哇」主題燈會。燈會的展出地位於高雄市的鹽埕區，經過熱心的宏銘大師解說，兩人方知鹽埕的原意係「曝曬鹽的地方」，原先該地鹽田滿布，是日治時期為配合高雄港的興建，經過大規模的填海造陸，才成為現今的海埔新生地。為此，旻浩詢問：「為何日本會選定高雄作為興建港口的地方呢？」試問，柔柔該如何回答？
  options:
  - label: A
    content: 高雄地區是岬灣式海岸，海岸線曲折，水深可停泊大船，為天然良港
  - label: B
    content: 高雄離日本距離近，可強化殖民地與母國聯繫
  - label: C
    content: 高雄農業發達，可加速茶、樟腦出口
  - label: D
    content: 高雄有西部縱貫鐵路通過，可加速島內資源運輸，使貨品迅速北運。
  group_stem: '12~15 為題組

