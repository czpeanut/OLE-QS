- id: doc_113_台中_大業_社會_歷史_g7s2e1_s1_21
  section: 1
  number: 21
  type: single
  page: 3
  stem: 綜合上述三份資料，請問這是從哪一層面來分析噍吧哖事件？
  options:
  - label: A
    content: 政治
  - label: B
    content: 經濟
  - label: C
    content: 文化
  - label: D
    content: 社會。
  group_stem: '21~22 為題組。以下是二則對於西來庵事件之相關資料，試閱讀後進行分析以回答問題。

    資料一：對經營舊式糖廍的者而言，新式糖廠與法規的限制，使原料難以取得，面臨倒閉危機。據研究指出，1902 年全臺仍有舊式糖廍1,117 家，1913 年驟減至191
    家。西來庵事件參與者之一的蘇有志，家族自清朝以來即以經營糖業為主，蘇有志在日治初期任臺南廳參事、鴉片煙及糖商臺南製糖會社監查役，然而面臨政府經濟政策變革，仍不敵新式糖廠的競爭，糖廍面臨破產危機。如蘇有志這類傳統地方仕紳陸續被淘汰或漸失去地方領導地位，經濟與政治的雙面封殺，使得反殖民政府的情緒延燒到地方仕紳階層。

    資料二：噍吧哖事件中領導人物之一的游榮，曾於甲仙地區開採樟腦，然因某政策的實施致使游榮憤而投身抗日後，進而號召同樣開採樟腦的李火見與李火生一同反日，再聚眾加入以江定為首的抗日活動。

    資料三：在○○後臺南廳的ＯＯ地持有概況。由1913 年臺南地區公告的查定結果略見，官有林地高達99.6％，私有地僅占0.4％，其中沿山地區的噍吧哖(玉井)、楠西、南化、大目降(新化)等地，山林地幾乎全被劃為官有地。對山林原野依存度相當高的噍吧哖人民來說，大批林野被收奪的不滿，極易與余清芳的宗教迷信、易世革命思想結合。'
  tags:
    chapter:
      publisher: 康軒
      book: 七下
      subject: 歷史
      code: 2-2
      title: 工業日本，農業臺灣
      chapter: null
    textbook: 七下歷史 2-2 工業日本，農業臺灣
    labeled_by: ai
