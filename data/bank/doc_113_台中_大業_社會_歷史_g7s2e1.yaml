- id: doc_113_台中_大業_社會_歷史_g7s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 一位作家寫道：「內地人徹底地擁抱本島人，而本島人喜悅地投入內地人的懷裡，這種親和性不是一時的現象，可能在永久性的意義上有著要創造一個民族的骨骼之性質吧！現在，臺灣人非打開眼睛不可。正是時候了，臺灣人不單只是日本國籍，而且從內心深處完全變成日本人。如果失去這次時機，以後我們不能再遇到這種機會了。」這位作家寫作的背景與目的是下列何者？
  options:
  - label: A
    content: 反對臺人武裝抗日運動
  - label: B
