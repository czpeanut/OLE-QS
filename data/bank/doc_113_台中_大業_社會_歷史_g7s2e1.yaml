- id: doc_113_台中_大業_社會_歷史_g7s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 曾任臺灣民政長官的後藤新平主張:「對於殖民地的治理，必須根據生物學原則，正如同比目魚的兩眼是長在身體同一側，如果硬把比目魚的眼睛像鯛魚一般裝在身體的兩側，就是違反生物學原則。在政治上也是如此，我們必須充分蒐集資訊徹底了解，再因地制宜規劃農業、工業、衛生、教育、交通、警察等各方面的管理辦法，才能統治順利。」請問，臺灣當時應該是實施哪一個殖民政策？
  options:
  - label: A
    content: 內地延長主義
  - label: B
    content: 漸進同化政策
  - label: C
    content: 皇民化運動
  - label: D
    content: 無方針主義。
