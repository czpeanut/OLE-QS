- id: doc_113_台中_大業_社會_歷史_g7s2e1_s1_27
  section: 1
  number: 27
  type: single
  page: 4
  stem: 據資料三內容判斷，當時日本總督府曾派出高砂義勇隊前往海外作戰，這顯示了原住民在被教化及高壓掃蕩後有何改變？
  options:
  - label: A
    content: 調適心態轉而與日本配合
  - label: B
    content: 加入軍隊增強自身武力
  - label: C
    content: 前往海外作戰爭取族人認同
  - label: D
    content: 參加世界大戰以逃離臺灣。
  group_stem: '27~28 為題組。以下三則資料是臺灣某時期與原住民相關的歷史資料，請依文中判斷回答相關問題

    資料一：最讓族人憤慨的是，這群人入侵獵場，肆意砍伐森林，又逼迫族人做苦力，導致大家心生不滿，後來聽說隔壁部落的頭目率領六部族人一起叛變，最後在山林裡壯烈犧牲，事情愈演愈烈，還鬧上國際新聞，使日本政府受到輿論譴責。

    資料二：雖然總督府剛開始派人進入山區時，只是調查、盤問，跟交辦事務。但隨著佐久間左馬太總督訂定理蕃政策，以「掃蕩生蕃」促進「蕃地」開發後，每逢建設我們必定被強迫從事砍伐森林等苦工，工資比其他地方低很多，還時常領不到錢，強迫工作的日子有增無減。

    資料三：在川中島(今南投縣仁愛鄉清流部落)，優秀的青年都爭先恐後赴海外出征。我們都在志願制度下血書報效國家，這是在告訴日本人，我們也是男子漢，不要對我們有差別待遇。'
  tags:
