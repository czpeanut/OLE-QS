- id: doc_113_台中_大業_社會_歷史_g7s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: '臺灣水泥高雄廠前身為日本淺野水泥株式會社的高雄工廠，為臺灣首座現代化的大型水泥工廠。在該廠成立之前，臺灣各項工程所需的水泥均從日本本土進口。而本廠建立的最初目的即為供應臺灣本地水泥之需求，而後也配合日本的南進政策，以滿足中國華南及南洋之水泥需求。

    試問：關於上文的敘述哪些正確？'
  options:
  - label: A
    content: 在推行南進政策時，臺灣的產業發展模式應為「工業臺灣，農業南洋」
  - label: B
    content: 選擇此處設立水泥廠的原因，就交通因素來看，係因有縱貫鐵路經過可強化與日本資源的運輸
  - label: C
    content: 嘉南大圳所係配合文中的南進政策興建以提供發展產業所需之電力
  - label: D
    content: 日本當時正在參與第一次世界大戰。
  tags:
