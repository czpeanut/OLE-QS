- id: doc_113_台中_大業_社會_歷史_g7s2e1_s1_29
  section: 1
  number: 29
  type: single
  page: 4
  stem: 該篇影評作者藉由電影來討論霧社事件，認為霧社事件悲劇的發生不只是經濟剝削統治壓榨的問題而已，還包括原住民傳統文化被消滅所帶來尊嚴失落與生命茫然。試問：下列四種敘述何者較接近作者對霧社事件的看法？
  options:
  - label: A
    content: 兩種世界觀的衝突：現代文化與傳統文化的衝突
  - label: B
    content: 制度的抉擇：民主自由與專制獨裁
  - label: C
    content: 優勝劣敗的演化：進步文明淘汰落後文明的必然
  - label: D
    content: 救國途徑的選擇：改革或革命。
  group_stem: '29~30 為題組。以下為《賽德克巴萊》之影評節錄，試閱讀後回答問題。

    日本人對原住民施行「恩威並施」的統治政策，除了強迫原住民從事多項勞役，掠奪山林資源，亦試圖透過教育、生活的改善，使原住民脫離「野蠻」，進入「文明」。但對於賽德克族人來說，異族強迫推行的文明與價值，消滅族人的傳統文化，隨之而來的是尊嚴的失落與生命的茫然。在片中，莫那魯道起事前曾有一番內心掙扎，他明知此役必定帶來死亡，甚至全族滅絕，卻仍選擇起事，除了不滿沉重的勞役、日本人掠奪山林資源外，莫那魯道更想要守住屬於族人和傳統文化的驕傲，故而發動壯烈的抗日行動。'
