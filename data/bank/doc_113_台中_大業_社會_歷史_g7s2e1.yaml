  type: single
  page: 1
  stem: 矢內原忠雄在《日本帝國主義下之臺灣》提及：臺灣受限於自然條件，西部沿海各港口在清代均單獨與中國大陸對渡，形成各自獨立之經濟圈，臺灣島內市場被切割成若干區塊。日本領臺後積極推動「資本主義的基礎工事」，強化臺灣對外聯繫能力和統一島內資源。試問：文中「資本主義的基礎工事」應係指何者？
  options:
