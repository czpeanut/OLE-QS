- id: doc_113_台中_大業_社會_歷史_g7s2e1_s1_25
  section: 1
  number: 25
  type: single
  page: 4
  stem: 上述資料陳述了不同時期高雄港的興建或擴建的背景，對於高雄港的優勢下列說明何者有誤？
  options:
  - label: A
    content: 港灣條件比安平港良好
  - label: B
    content: 南部農產品出口港的需求
  - label: C
    content: 縱貫鐵路通車擴大高雄港腹地
  - label: D
    content: 靠近發電廠的地理條件有益於發展工業。
  group_stem: '25~26 為題組，試閱讀下文後回答問題。

    1860 年，大清與英法聯軍交戰落敗，臺灣被迫開港，高雄港也被列為開港港口之一。當時遠不如臺南繁華的高雄，為何會雀屏中選？除了糖的吸引力外，當時高雄港灣狀態也比臺南的外港安平好，而且高雄港旁的哨船頭，因面港灣靠山，旁人難以進入，也被外商看上，成為倉庫集中地，在此不僅可交易高雄的糖，也可將運來臺灣的鴉片安全置於倉庫中，這使得高雄開始受到重視。

    1895 年，日人來到臺灣，對於這塊新治理的地方，他們有不同的思考。經過調查與討論，他們決定以糖業為臺灣的發展重點，1901 年在橋仔頭蓋了新式糖廠，不同於以往用牛為動力的糖廍，用機器生產的糖廠效率高、品質又好。但此時碰到另一個問題，這些糖廠所製成的原料，要送回日本去製造各式成品，這該如何運輸？於是日本開始建設鐵路，要用鐵路經由港口，送回日本。但此時臺灣最好的港口是在基隆，南部的糖，要送到基隆去，未免不符效益，最好的方式，當然就是在南部找到一個良港，高雄的命運就此扭轉。

    1907 年打狗、三塊厝、鳳山、九曲堂間的鐵路開通，來自屏東、鳳山、旗山、大樹等地區的米、糖、香蕉等物產，經鐵路運至打狗港，銷售至日本、中國等地。1908
    年臺灣西部縱貫鐵路全線通車，南臺灣成為打狗港的腹地，其中米、糖及阿里山木材等大量貨品集中於打狗急待輸出。打狗港的貿易量大增，迫使臺灣總督府加速正視該港擴建的需求與必要。

    1937 年爆發戰爭，日本逐漸感到南方物資的重要性，決定進軍南方，執行南進政策，將以往的「農業臺灣，工業日本」轉型為「工業臺灣，農業南洋」，於是在臺灣積極推動工業發展。1934
    年臺灣電力公司的日月潭第一水力發電廠的完成，讓許多需要大量電力的工業，如鋁業、化學工業能夠進入臺灣，這在當中，以高雄的地位最為重要，因為高雄港的地理條件，來自東南亞的原料，可快速運至高雄，再藉由港邊的工業區，加工成為半成品，再運往日本做為最後成品。'
