  section: 1
  number: 2
  type: single
  page: 1
  stem: 最初日本統治臺灣之時，曾因嚴重財政虧損而欲將臺灣以一億日元賣給法國，後來透過各種調查及建設平衡財政收支，治理臺灣終轉虧為盈。試問：下列哪些是總督府於臺灣開拓財源之手段？(甲)將鴉片、樟腦實施專賣(乙)進行土地調查
    (丙)建設新式糖廠，提高蔗糖產量
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲乙
  - label: C
