  stem: (     )55. Why do capybaras live in groups?
  options:
  - label: A
    content: To hunt for food together.
  - label: B
    content: To feel safe and protect each other.
  - label: C
    content: To find water sources more easily.
  - label: D
    content: To avoid getting lost.
  group_stem: '55-58


    The Capybara: The World''s Largest Rodent


    The capybara is an interesting animal and it has caught the eye of people around
    the world, including here in Taiwan. Known for its gentle nature and friendly
    appearance, the capybara is the largest rodent in the world. It is close to other
    rodents like guinea pigs and chinchillas. A fully grown capybara can weigh up
    to 65 kilograms, which is about as heavy as a medium-sized dog.


    Capybaras have a special appearance. They have a round body, short legs, and a
    big nose. Their fur is usually brown or brown and it helps them hide in their
    natural habitat. These animals have webbed feet, making them excellent swimmers.
    In fact, capybaras are semi-aquatic, meaning they spend a lot of time in the water.
    They often live near rivers, ponds, or lakes, where they can swim to find food
    and stay away from dangerous animals.


    One of the most lovely things about capybaras is their social behavior. They are
    very social animals and live in groups, often including 10 to 20 capybaras. These
    groups help them feel safe, as they can watch out for each other. Capybaras are
    also known for their calm and friendly nature, not only with each other but also
    with other animals. You might see pictures of capybaras with birds sitting on
    their backs or other animals resting beside them. They are gentle and peaceful,
    and it makes them popular in zoos and pet farms.


    In Taiwan, capybaras have become very popular lately. Many people enjoy seeing
    them at zoos, and some pet farms even allow visitors to feed and touch them. Capybaras
    are famous on social media for their cute expressions. This has made them a favorite
    among animal lovers, especially younger people. Their calm and friendly nature
    helps people feel easy and happy, and it is why they are loved by so many in Taiwan.

    ＜rodent 齧齒類 nature 本質 chinchilla 絨鼠 habitat 棲息地 webbed 有蹼的   social behavior 社交活動
    expression 表情＞'
  shared_asset: g4_55_58
