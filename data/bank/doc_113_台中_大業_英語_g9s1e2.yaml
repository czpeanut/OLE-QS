    Do you like cookies? They taste great, don’t they? However, not all cookies can
    be eaten. Take sea cookies for example. Probably(大概地) no one would like to have
    a bite of them because they are far from delicious. What do sea cookies look like?
    Look at the picture below.


    Sea cookies, also known as sand dollars, live on the sea bottom. Here are some
    interesting facts about this interesting animals.


    | 1. It has a round-shaped body that is usually 3 inches wide. It is brown, gray,
    purple, or red. When it is dead, it turns white. | 3. It eats a lot of different
    things. |

    | 2. To stay away from water is hazardous for it. It will die in fifteen minutes.
