  - label: D
    content: 丙。
  group_stem: "看到針，我也是暈了\n    新冠肺炎疫苗在學生族群採校園接種，醫師指出過往校園接種疫苗容易出現「集體暈針」，尤其是國中生、高中生族群。\n\
    \    暈針又稱打針恐懼症，是一種心理因素所引起的生理反應，常見症狀包括頭暈、噁心、嘔吐、臉色蒼白、手腳發冷、血壓下降、昏迷、暈眩等，通常會在打針後3至5分鐘發生。\n\
    \    怕看到針、怕太痛、曾有不好的打針經驗經驗甚至遺傳因素，都可能造成暈針，曾經暈針的人很容易再次發生暈針，且目睹正在打針者的旁觀者也可能暈針。有暈針經驗應主動告知醫護人員，而避免過飽、過餓、疲勞，並轉移注意力，皆有助於避免暈針。\n\
    \    暈針大都只需緩和情緒至恢復意識即可，但或是過敏性休克則通常叫不醒，甚至需要立刻注射腎上腺素急救。一般民眾較難分辨暈針與過敏性休克，所以接種疫苗後至少觀察15分鐘後再離開，如此有任何不適都較能獲得立即的處理。"
