  stem: 阿明在打針前先深呼吸緩和緊張的情緒。當阿明吸氣時，體內胸腔和肺臟的變化為何？甲. 肋骨上升；乙. 橫膈上升；丙. 胸腔體積擴大。
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙
