- id: doc_113_台南_民德_社會_公民_g9s1e2_s1_35
  section: 1
  number: 35
  type: single
  page: 4
  stem: 相較於大型產業，手搖飲料店加入門檻較低，且顧客群廣大，容易吸引其他業者加入競爭，使手搖飲產業呈現高度競爭狀態。近年來，業者儘管面對基本工資調漲、原物料的進口支出增加，部分手搖飲料店業者仍是不敢輕易調整飲品價格。在激烈競爭下，店家們選擇持續加強自身品牌形象，例如：強調茶葉品質、主打新鮮水果的茶品、與其他行業共同推出聯名商品等，有些店家會將部分利潤投入廣告宣傳上，像是找名人代言，以求能在眾多手搖飲料店中，爭取顧客青睞。請問：根據上述內容，手搖飲料店家多會採取何種競爭方式？
  options:
  - label: A
    content: 將飲料品項價格調降，進而帶動其銷售量
  - label: B
    content: 在不調整飲料價格下，提升民眾購買意願
  - label: C
    content: 增加廣告支出，來降低生產成本並提升利潤
  - label: D
    content: 採取削價競爭，逼迫其他競爭者退出該市場
