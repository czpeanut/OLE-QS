  group_stem: '台灣手搖飲客製太多！外國人點餐如考試好緊張!


    網友分享買手搖杯時，前面外國人用很蹩腳的中文努力嘗試點餐。先試點了一杯冬瓜露，卻被告知明天才開賣。改成一杯鮮奶茶後，店員馬上拋出「選擇題」，詢問茶種要紅玉、紅烏龍、阿薩姆還是伯爵。選了伯爵茶以後又被問了最基本的甜度冰塊和尺寸。結束以後店員還問要不要加珍珠，好不容易連珍珠大小都選完，網友表示外國人因為猝不及防被一連串提問已經有點被擊潰，以為終於結束點餐，店員又緩緩開口「（珍珠）黑的還白的？」，已經崩潰的他們忍不住笑出聲。'
