  stem: What is the reading mainly about?
  options:
  - label: A
    content: The history of jeans.
  - label: B
    content: Who wore jeans first?
  - label: C
    content: How strong the jeans are!
  - label: D
    content: Famous fashion designers.
  group_stem: "(1) In the 1500s, tailors in Genoa, Italy, made really strong pants\
    \ for sailors to wear. They used a special cloth, so the sailors could wear the\
    \ pants in bad weather. They were the first jeans. Around the same time, tailors\
    \ in France made jeans with denim. The cloth was as strong as the one from Genoa.\n\
    \    In the 1850s, Levi Strauss brought denim to the USA. Around 20 years later,\
    \ Jacob Davis, a tailor, bought denim from Strauss and used it to make pants.\
    \ Many workers bought them because they were stronger than any cloth out there.\n\
    \    Jeans were expensive in the 1980s. Fashion designers like Gloria Vanderbilt\
    \ made special jeans with their names on them. Many people wore them because they\
    \ wanted to be fashionable. Now, people, both young and old, love to have a pair\
    \ of fashionable jeans. They wear them to be in fashion.\n tailor 裁縫師 sailor\
    \ 水手 cloth 布料 denim 牛仔布 designer 設計師"
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
