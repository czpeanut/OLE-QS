  stem: What is the best title for the poem?
  options:
  - label: A
    content: A New Hope in a Big City.
  - label: B
    content: Julian and His Poor Family.
  - label: C
    content: Looking for a Missing Father.
  - label: D
    content: A Boy Who Was Caught in Trouble.
  group_stem: '(2) A story about Julian

    Julian and his family had to leave their hometown,

    Because they could no longer live

    on their farm,

    Which was burned down in a terrible fire.

    They walked a long way to look for Uncle George,

    Who lived in a big city.

    The trip was full of trouble,

    But it gave them a hope of getting a better life

    In the future.


    Halfway to the city,

    Julian''s father headed for Uncle George''s by himself.

    However,

    When Julian got to his uncle''s house,

    His dear father was nowhere to be seen,

    Which broke his family''s heart.


    Julian, the eldest child of his family,

    Decided to find a job to help raise his brothers and sisters,

    Then one day in the street,

    He was lucky to be given a job by a man called Fred

    To work in a factory,

    So he followed him to his future working place.

    When he finally arrived there with the man,

    He was then locked with four other boys

    In a very old, small house,

    Where they spent long hours a day making masks.

    With little to eat,

    And little time to rest or sleep,

    Julian had no idea

    Whether he could live to get back home safe and sound

    Crying

    In the deep night,

    Julian was not sure where his future would lie.'
