    was always full of people. But __2.__.

    Kelly : You can say that again. __3.__ A lot of stores closed these days.

    Nina : What''s wrong with this district?

    Kelly : The rent is getting higher and higher. More and more shopkeepers are not
    able to afford it.

    Also, __4.__. They don''t shop but do window shopping only.

    Nina : I see. We don''t make much more money, but the cost of living is much higher
    than before.

    Kelly : I hope this won''t last long. Oh, by the way, I''m a little hungry and
    thirsty. __5.__

