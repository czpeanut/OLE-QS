    \ to understand human speech, take part in strategic games like chess, and drive.\
    \ In factories, people use machines to do many jobs. People believe that AI will\
    \ take over 40% of our work in the future. Millions of workers will be reporting\
    \ to their \"Robot Boss.\" However, it may be dangerous if we fully rely on AI.\
    \ AI only follows the very beginning order until it gets another new order. Because\
    \ of this, some terrible results may happen. The following are two examples.\n\
    1. Imagine a self-driving car is programmed to take you to the airport as fast\
    \ as possible. In the end, you might arrive at the airport on time, but the high\
    \ speed may take you travel-sick and get you a traffic ticket.\n2. People can\
    \ also use AI to control the weapons like guns or bombs at a far distance. However,\
    \ if the bad guys use it to kill people, the situation will be out of control.\n\
