  stem: '縮時攝影是一種攝影技術，靠著調整「每幾秒拍攝一張照片」以及「製作影片時以每秒播放幾張照片的速度」這兩個變數，使得長度為數分鐘的影片能呈現出數小時、數天，甚至數年的景象變化。例如，對一個變動中的景象以每
    3 秒拍攝一張照片的方式連續拍攝 15 小時，共會得到 18000 張照片，將這些照片以每秒播放 30 張的速度製作影片，可產生 600 秒的縮時影片。有一個影片比賽，規定參賽影片的長度須為
    12 分鐘。小宇打算利用縮時攝影將某風景區的景象變化製作成縮時影片參賽。

    請根據上述資訊回答下列問題，完整寫出你的解題過程並詳細解釋：

    (1) 若小宇連續拍攝該風景區 24 小時的景象變化，並製作成 12 分鐘的縮時影片，則影片中的 1 秒呈現出拍攝當時幾秒的景象變化？(4分)

    (2) 由於小宇想將 24 小時的景象變化製作成 12 分鐘的縮時影片，所以當他將相機設定為每 $x$ 秒拍攝一張照片時，便須以每秒播放 $y$ 張的速度製作影片。請判斷
    $x$ 與 $y$ 是否成反比？(4分)'
