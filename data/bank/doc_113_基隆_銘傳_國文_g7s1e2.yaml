  stem: '自訂題目：我的偶像——○○先生(小姐)


    引導語：

    「偶像」比喻崇拜的對象。在你生命中是否有欣賞、崇拜並且想要「見賢思齊」的人物？請從你日常生活中，選擇一位你喜愛且崇拜，或是對你有特殊意義的人物，這個人可能是你的家人、師長、同學，或是電視上的名人……。請仔細描繪這個人的特徵：外在相貌、口頭禪或個性等，並且舉出具體事例來凸顯這位人物的獨特之處，以符合他○○先生(小姐)的稱號。此外，請說明自己對這位人物的感受及崇拜的原因。'
