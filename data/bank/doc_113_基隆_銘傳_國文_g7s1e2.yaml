- id: doc_113_基隆_銘傳_國文_g7s1e2_s2_33
  section: 2
  number: 33
  type: single
  page: 5
  stem: 本文敘述何者有誤？
  options:
  - label: A
    content: 記敘了凱薩琳幫助非洲小孩的原因及過程
  - label: B
    content: 凱薩琳的家人及鄰居都很支持她
  - label: C
    content: 去跳蚤市場擺攤但生意不好，批判了社會的漠不關心
  - label: D
    content: 比爾蓋茲收到凱薩琳的獎狀後決定捐款
  group_stem: '凱瑟琳（Katherine Commale）看到美國公共電視播的非洲紀錄片，片中說非洲平均每三十秒，就有一個小孩因為瘧疾而死亡。才五歲大的她，蜷縮在沙發扳著手指數數，一、二、三……三十，當她數到三十，一臉驚恐說：「媽媽，一個非洲小孩死掉了，我們一定要做點什麼！」媽媽上網查資料，告訴凱瑟琳：「瘧疾很可怕，小孩得到瘧疾很容易沒命。」

    凱瑟琳：「那小孩為什麼會得瘧疾？」媽媽：「瘧疾是靠蚊子傳染的，非洲蚊子太多。」

    凱瑟琳：「那怎麼辦？」媽媽：「現在有一種泡過殺蟲劑的蚊帳，有它就可以保護人不被蚊子咬。」凱瑟琳：「那他們為什麼不用蚊帳？」媽媽：「因為這種蚊帳對他們來說，太貴了，他們買不起。」凱瑟琳：「不行，我們必須要做點什麼！」

    過了幾天後，媽媽接到幼稚園老師的電話，老師說凱瑟琳沒有交點心費。媽媽問她錢呢？凱瑟琳說：「媽媽，如果我在學校不吃點心，平常不吃零食，也不再買芭比娃娃，這樣夠不夠買一頂蚊帳呢？」媽媽帶她去超市，花了十塊美金，買了一頂大蚊帳，可以給四個小孩用。然後打電話問在非洲做慈善的組織，看看如何把蚊帳送過去。巧的是，給她找到一個「只要蚊帳」Nothing
    But Nets 的組織，他們專門送蚊帳去給非洲的孩子。凱瑟琳親手把蚊帳寄過去，一個禮拜後，她收到「只要蚊帳」協會的感謝信，信裡說她是年紀最小的捐贈人，還告訴她如果捐十頂蚊帳，可以獲得獎狀。凱瑟琳要求媽媽和她去跳蚤市場擺攤，把她的舊書、舊玩具、舊衣服拿來賣，賣了錢好捐蚊帳。可是賣了一天，生意不好。凱瑟琳想：「我捐錢買蚊帳，『只要蚊帳』協會就會給我獎狀。那別人買我的東西，給我錢，他們也應該得到獎狀才對啊！」於是，她開始自己做獎狀，媽媽幫她買材料、爸爸幫她整理工作間，弟弟幫她畫愛心。每張獎狀都有凱瑟琳親筆寫的「以你的名義，我們買下一頂蚊帳，送到非洲」，當然還有她的親筆簽名認證。只要你捐十元美金，買一頂蚊帳，就可以得到一張獎狀。鄰居看到她的獎狀，覺得又天真又感動，獎狀很快就賣掉十張。凱瑟琳把錢寄出，收到「只要蚊帳」協會寄來為她特製的「榮譽證書」，他們封她為「蚊帳大使」。協會的人還告訴凱瑟琳，她捐的蚊帳是送到一個在加納叫「斯蒂卡」的村子，那裡有五百五十戶人家。天啊，只有十頂蚊帳，怎麼夠用？

    凱瑟琳的鄰居不只跟她買蚊帳，他們的小孩也都加入，幫凱瑟琳做獎狀，成為一支「凱瑟琳的隊員」。社區的牧師也請她去教堂演講，她只講了短短三分鐘，就收到 800 元美金的捐款。這下她士氣大振，開始跑到別的教堂去演講，當她滿六歲時，已經募了
    6316 美元。「只要蚊帳」協會把凱瑟琳的事蹟貼在網路上，引起許多人迴響。有一天，凱瑟琳看見電視上播出英國足球明星貝克漢，替「只要蚊帳」協會做的公益廣告。她立刻寫一封信給貝克漢，感謝他，當然也發給他一張獎狀。貝克漢把獎狀貼上個人網站，事情就像雪球一樣傳開。……

    2007 年 11 月 5 日，比爾蓋茲基金會宣布：捐三百萬美金給「只要蚊帳」協會。比爾蓋茲說他收到一張獎狀，而且收到一封信，信上說為非洲小孩買蚊帳的錢都在他那裡，看來他不把錢拿出來，是不行的。

    2008 年，比爾蓋茲基金會出錢拍一部《孩子救孩子》的公益紀錄片，凱瑟琳因此踏上非洲大地。她看到當地的孩子用筆在蚊帳上寫著「凱瑟琳」，他們都把這個救命的蚊帳叫做「凱瑟琳蚊帳」。這個愛心蚊帳，會好好守護他們的每一晚。斯蒂卡村現在叫「凱瑟琳蚊帳村」！七歲的凱瑟琳，已經救了超過百萬個非洲小孩的生命。

    善良的力量，可以像滾雪球一樣，越滾越大。因為每個人心中，都住著一個善良的孩子。

    節選自《今天：366 天，每天打開一道門》'
