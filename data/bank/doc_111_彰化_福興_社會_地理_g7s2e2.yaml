- id: doc_111_彰化_福興_社會_地理_g7s2e2_s1_33
  section: 1
  number: 33
  type: single
  page: 4
  stem: '某報導：『…台灣與東亞鄰居，例如日本和韓國，經濟都高度以出口為導向。2021 年，由於台灣本土控制疫情有效，加上全球半導體短缺，台灣經濟成長了 6.6%，首次超越中國大陸經濟成長。然而，2022
    年由於俄烏戰爭、全球通膨預期，全球市場低迷，歐洲更進一步衰退，對於高度依賴出口的台灣經濟造成了影響，經濟預測不斷下修。

    從整體經濟基礎來看，因總生育率極低以及無法吸引高技術工作者移民的情況下，台灣的人口在 2020 年首度出現衰退，政府預估這衰退將會持續，人口逐年降低，對消費市場以及勞工環境造成進一步影響。再者，中國對外交上的封鎖和壓制，將進一步阻礙台灣與區域其他經濟體的貿易，進一步降低台灣經濟的成長潛力。儘管台灣在半導體領域具有一定的競爭力，但食品、化學、生化和設備等產品，因缺乏區域市場而無法加速其發展。台灣未來經濟發展的潛力，將取決於與中國大陸和美國的關係。在最佳情況的預測中，期許台灣不僅可與美國建立自由貿易關係，獲得進入全球最大消費市場的機會，還能與中國大陸加強貿易和投資往來，獲得更多產業發展空間，並在區域貿易和投資中參與更多活動…』根據報導內容，以下敘述何者有誤？'
  options:
  - label: A
    content: 台灣的國際貿易在經濟發展政策上仍是非常重要的一大關鍵，不可輕忽
  - label: B
    content: 台灣人口出現負成長，對消費市場以及勞工需求造成一定程度的影響
  - label: C
    content: 台灣應更積極發展與他國之間的貿易合作，以獲得更多經濟成長的機會
  - label: D
    content: 從文中可知台灣未來經濟發展的潛力取決於與中國及美國之間的貿易合作關係，因此更需加強與中國之間的貿易投資往來，無需與其他國家發展貿易合作。
