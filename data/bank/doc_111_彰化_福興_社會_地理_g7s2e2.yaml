    10 年 GDP 平均成長 3.2%，使其成高收入國家中成長最快的國家之一。民國 50 年代至 60 年代期間，台灣經歷經濟與產業改革以及快速社會發展，在美國國際開發署的援助下建設龐大工業基礎設施、通訊及教育系統，稱為十大建設與經濟奇蹟，使台灣成為亞洲四小龍之一，並進入發達經濟體行列。出口導向工業化成長模式下，隨著經濟成長與薪資提高，許多勞動力密集度較高的產業在國際市場失去競爭力，台灣往後的二十多年間，也逐漸將勞工密集度較高的產能移往中國大陸。隨著中國大陸的經濟迅速成長，對台灣所出口的產品需求也大大增加。在這樣的背景下，台灣的資訊與通訊技術產業、農林漁、甚至其他民生活消費品，輸往中國的出口也在這期間迅速增加。儘管中國和台灣在這期間政治矛盾仍然存在，但台灣的經濟成長主要來自於與中國之間日益密切的經貿往來。即使是台灣的領先產業，面對中國本土龐大的勞動力市場、資本投入和不斷增強的創新能力，也使台灣面臨壓力。同時，在中美競爭的背景下，台灣失去了出口許多先進產品到中國的機會，而國內較小的消費市場也難以填補這一缺口。因此，隨著全球經濟在
