  group_stem: '請閱讀下列敘述後，回答第30~31題：

    大志想選用適當的材料製作化學電池，探討步驟如下：

    1. 在甲、乙兩金屬電極中間放入浸有電解質溶液的介質，成為一個單元。

    2. 將十個相同的單元依序堆疊後，以兩條導線分別從最上方的甲金屬電極和最下方的乙金屬電極接出，測量產生的電壓和電流。

    3. 進行多次實驗，從數種候選材料中，依序找出合適的電解質溶液、介質和甲、乙兩金屬電極的材料，即完成化學電池。

