  stem: 從這則新聞，判斷下列敘述何者正確？
  options:
  - label: A
    content: 專家認為澳洲溫室氣體排放量，到 2030 年為止應當完成比 2005 年的基礎排放量降低 2 億噸
  - label: B
    content: 全球暖化可能造成的天然災害包括電力中斷
  - label: C
    content: 若澳洲 2030 排放 3.5 億噸溫室氣體，稱得上在範圍內達成目標
  - label: D
    content: 全球暖化可能造成的天然災害包括沙塵暴
  group_stem: '★閱讀短文，回答第 44 題：

    西元 2019 年 9 月以來，全球暖化使澳洲各地出現了可怕的森林大火，總共造成 33 人死亡，估計有 10 億隻動物死亡，摧毀超過 2500 間房舍，燒毀
    1170 萬公頃土地。然而在大火趨緩之際，澳洲新南威爾斯州卻連日降下暴雨，造成各地陸續傳出淹水災情，道路中斷，大約 10 萬戶家庭斷電，估計約有數千人被迫離開家園。墨爾本、坎培拉更下起了直徑超過
    5 公分的冰雹，同時新南威爾斯州也遭逢高達 10 層樓高的沙塵暴肆虐，簡直像是世界末日的場景在真實世界上演。

    資料顯示澳洲 2005 年溫室氣體的排放量為 5 億 6 千萬噸。氣象問題專家威爾·施特芬表示，以燃燒煤炭、石油及天然氣為主的能源模式，是導致極端天氣在澳洲頻發的首要原因。專家認為，要緩解極端天氣，減少碳排放是當務之急。政府應採取減少燃煤發電廠等措施，來減少溫室氣體排放。政府應當完成比巴黎協定更高的目標：到西元
    2030 年為止，澳洲的溫室氣體排放量要比西元 2005 年的基礎排放量降低 40%至 60%。'
