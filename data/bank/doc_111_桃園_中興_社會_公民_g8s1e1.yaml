  type: single
  page: 3
  stem: 以國家組成要素理解上文，下列敘述何者正確？
  options:
  - label: A
    content: 兩國間爆發戰爭，起因是烏克蘭進占俄羅斯領土
  - label: B
    content: 俄羅斯在對內統治上，缺乏執行政策的權力
  - label: C
    content: 烏克蘭在國際上行使主權不受任何國家干涉
  - label: D
    content: 選舉使烏克蘭政府產生權力轉移，恐喪失主權。
  group_stem: '《題組二》

    小琪看到數月前，俄羅斯尚未攻擊烏克蘭時的一則報導：「俄羅斯在烏克蘭邊境集結軍隊、增派武力，兩國對峙，衝突危機升高，引發國際高度關注。歐美國家增援烏克蘭，同時呼籲俄羅斯政府勿入侵烏克蘭國土，以免引發戰爭衝突。俄羅斯此舉在國內遭到部分民眾反對，認為開戰將導致經濟受創、民生受到影響，但這些反對聲浪對政府一意孤行的決策卻也無能為力。烏克蘭總統則表示，烏克蘭不會因俄羅斯的挑釁行為而躁進，但政府會堅定保護人民家園，抵禦外來勢力的進逼。'
