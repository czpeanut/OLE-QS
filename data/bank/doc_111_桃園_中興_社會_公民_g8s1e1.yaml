  number: 1
  type: single
  page: 1
  stem: 中國大陸無人機最近頻繁擾台灣外島，無人機偏離中線駛入我國領土時，我國國軍適時採取強力措施反制中國大陸無人機侵擾，示警驅離無效後即防衛射擊。有關於國家的「領土」的敘述何者正確？
  options:
  - label: A
    content: 我國領土面積只限於台灣本島
  - label: B
    content: 領陸海基線向外延伸 200 浬為我國經濟海域，屬於我國領土範圍
  - label: C
    content: 領陸向上延伸至大氣層之範圍為領空
  - label: D
    content: 由國家領陸的海基線向外延伸 12 浬為領海，與領陸、領空皆為我國領土範圍。
