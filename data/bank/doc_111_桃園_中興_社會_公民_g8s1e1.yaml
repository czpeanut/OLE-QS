- id: doc_111_桃園_中興_社會_公民_g8s1e1_s1_23
  section: 1
  number: 23
  type: single
  page: 3
  stem: 依據上文，立法院提出的疑慮，主要是從何種角度來探討走私動物遭到撲殺的爭議？
  options:
  - label: A
    content: 人性尊嚴
  - label: B
    content: 法律位階
  - label: C
    content: 基本權利
  - label: D
    content: 人治精神。
  group_stem: '《題組一》

    2021 年海巡單位查獲 100 多隻走私貓，2 天後全被安樂死，引發討論。事實上，海關緝私條例與動物傳染病防治條例等法規，均無動物必須立即被銷毀的規定。查獲走私動物一律撲殺的慣例，是依據行政院農業委員會為處理「走私農產品」而自行訂定的法規——走私沒入動物及其產品處理作業程序。立法院先前曾針對該法規可能有疑慮，希望相關單位針對有關銷毀走私動物的程序及方式再進行研議。

    許多民眾不知道被走私的活體動物依慣例會被安樂死，也因為這個事件，正視走私沒入動物及其產品處理作業程序已不合時宜。但無論是過去曾被銷毀的兔子、寵物鼠或是爬蟲動物，都一樣是被賦予生存權利的生命，不是人類附屬的產品，不應該因過時、有待修正的法規而無辜喪命。（資料來源：改寫自別讓
    154 隻貓咪慘劇造成的對立，模糊我們捍衛動物權利的初衷，風傳媒，2021/8/31）'
  tags:
    chapter:
      publisher: 翰林
      book: 八上
