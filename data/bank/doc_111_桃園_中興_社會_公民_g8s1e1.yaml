    content: 政黨政治
  group_stem: 《題組三》我國是一個民主國家，主權在民。由人民當頭家選出總統，依《總統副總統選舉罷免法》的規定，各政黨推派總統、副總統候選人，公平競爭。選舉獲勝的政黨成為執政黨，組織政府；其餘的政黨成為在野黨，監督政府。2020
    年總統大選，由民進黨的候選人選舉獲勝，成為執政黨，組織政府推行政策，我國民主更邁前一步。
