    content: 統治者不受法律約束，法律只用來限制人民
  - label: B
    content: 在人治社會，法律是所有人唯一的依循標準
  - label: C
    content: 不論在何種社會，法律地位永遠高於統治者
  - label: D
    content: 必須依賴法律約束，才能促進社會安定和諧。
