  type: single
  page: 3
  stem: '小芸從新聞中擷取兩個不同國家的社會狀況（如附圖所示），她能分辨兩者分屬人治與法治社會，是根據下列哪一項原則？


    | 新聞一 | 新聞二 |

    | :--- | :--- |

    | 法律不僅約束人民的行為，政府施政同樣受到法律規範，行政機關必須依法執行。法律沒有明文規定，政府就不能做，即使小如一張罰單，執法人員也不能隨意開罰。 |
    政府開始無預警接管多家民營公司，經營者在一夕之間被迫退休，長年的心血無故被收歸國有。面對這些蠻橫無理的作法，當事者卻無法為自己的權益討公道，只能自認倒楣。
    |'
  options:
