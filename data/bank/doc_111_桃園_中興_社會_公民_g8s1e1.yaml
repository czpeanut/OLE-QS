  section: 1
  number: 16
  type: single
  page: 2
  stem: '小吳參加一場演講，聆聽一位逃離北韓的民眾分享自身經歷，摘要如右圖，其講述內容的意涵，應與下列何者最接近？


    | 民眾被政府嚴密控制，連居住處所也無法自由選擇，違反法律會受到嚴重處罰。我們辛苦的付出勞力，但常常得抓昆蟲充饑，而領導人卻像從沒挨餓過似的身材壯碩，他除了享受人民貢獻的豐碩成果，而且擁有特權，法律根本無法規範他的行為。
    |'
