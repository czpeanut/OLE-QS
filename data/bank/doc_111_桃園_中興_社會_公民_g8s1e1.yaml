- id: doc_111_桃園_中興_社會_公民_g8s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 今年 8 月底台南發生震驚社會的殺警案，造成兩名刑警殉職，舉國哀悼。根據《警察勤務條例》第 11 條規定：「臨檢：於公共場所或指定處所、路段，由服勤人員擔任臨場檢查或路檢，執行取締、盤查及有關法令賦予之勤務。」但警察執法時亦不能逾越必要程度，以免侵害《憲法》保障人民的人身自由權。因此警察執行勤務及使用槍械多有限制。為避免悲劇再次上演，目前《警械使用條例》草案已在立法院協商，會加速推動修法。由上述判斷，下列說明何者最為正確？
  options:
  - label: A
