  group_stem: 'Fact vs. Opinion


    A fact is something true. It can be proven with evidence. For example, “The sun
    rises in the east.” is a fact. Everyone can see it happen. Facts do not change
    from person to person because they aren’t based on people’s feelings.


    On the other hand, people have opinions when they think of or feel something.
    It cannot be proven true. For example, “Ice cream is yummy.” is an opinion. Not
    everyone agrees because people like to eat different food.


    Facts and opinions are, of course, very different. Facts tell us everything about
    the world, and opinions show feelings or ideas. Here are some examples.


    | | fact | opinion |

    | :--- | :---: | :---: |

    | Dogs are animals. | V | |

    | Parents love their kids. | | V |

    | There are 12 months in a year. | V | |

    | Taiwan is a beautiful place. | | V |


     be proven 被證實    evidence 證據     based on 根據     feeling 感受     agree 同意'
