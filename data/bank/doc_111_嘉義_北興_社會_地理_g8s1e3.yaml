    級(日本分級為6 強)，深度60 公里，福島縣和宮城縣預測恐有一公尺海嘯，當局發布警報呼籲民眾立即避難。地震發生後，關東地區逾209 萬戶停電，羽田機場暫時關閉跑道檢查，東海道新幹線部分停駛。請問：
