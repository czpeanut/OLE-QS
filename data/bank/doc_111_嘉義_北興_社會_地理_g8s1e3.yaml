  group_stem: ※今年的漢字（日語：今年の漢字）是日本漢字能力檢定協會從1995 年起，每年向日本全國徵集的一個代表性漢字，用以表現該年世態及人們的感受。投票選出的代表性漢字會在12
    月12 日（漢字日）於最大島京都市清水寺公佈，日本2022 年度漢字正式公布，由森清範貫主在清水寺國寶「清水舞台」上，揮毫寫下「戰」一字，象徵2022 年的俄烏戰爭、「甲」國頻射飛彈等國際大事。『戰』是繼恐怖攻擊頻傳的2001
    年以來，兩度獲選日本年度漢字。請問：
