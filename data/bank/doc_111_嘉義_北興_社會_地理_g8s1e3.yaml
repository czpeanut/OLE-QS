  stem: 氣象預報顯示日本大部份地區正受到今冬最強等級寒流影響，氣象廳呼籲人們留意天氣對交通的影響，尤其是12 月19 日 (甲)面向太平洋一側的交通問題。此外當局也呼籲人們
    (乙)警惕強風、海嘯和雪崩等狀況。氣象廳表示，冷空氣正在流入日本，主要為 (丙)北海道和四國島東側的地區帶來大雪。 (丁)關東地區一側將放晴，但天氣會變冷。請問：上述畫線部分何項敘述正確？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
