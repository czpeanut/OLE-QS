  group_stem: "※韓國的新冠肺炎(COVID-19)疫情在西元2020 年8 月中再度上升，且以人口稠密的都市區域為中心迅速擴散，為了挽救疫情造成的經濟停滯與衝擊，總統文在寅提出推動數位與綠色新政，重新思考能源、基礎建設與產業發展的機會，也同步回應氣候變遷的危機，南韓的「綠色新政」宣示要在2050\
