  stem: 日本人喜歡在櫻花樹下賞櫻，氣象廳每年都會針對各地櫻花開放的時間進行預測，如右圖所示，請問：四大島中最早可以看到櫻花綻放的地區為何？
  options:
  - label: A
    content: 九州
  - label: B
    content: 本州
  - label: C
    content: 四國
  - label: D
    content: 北海道
  group_stem: "※天氣變化多端，我們時常仰賴氣象預報來安排行程、選擇服裝穿搭，洗衣服、洗車等日常生活瑣事，也和氣象預報息息相關；降雪、賞櫻、楓紅的季節有日期預測出遊攻略，颱風、地震等天災也少不了氣象局提供的情報。但是，你知道除了基本的氣溫和降雨量，日本氣象協會還貼心列出「睡眠指數」、「服裝指數」、「火鍋指數」、「啤酒指數」、「喉糖指數」，甚至是「冷熱溫差造成皮膚乾裂指數」嗎？\n\
    \ 「睡眠指數」是透過入睡時的溫度和起床時的氣溫做為評斷數據，提供「必須整夜開暖氣；早晚開暖氣；睡前開暖氣；早上稍冷，不開暖氣也能睡得好」的參考指數。\n\
    \ 「冷熱溫差造成皮膚乾裂指數」更是相當貼心。溫差驟降時容易造成皮膚乾燥甚至裂傷，日本氣象協會也會參考前一天的溫差、當日的日夜溫差、和屋內屋外的平均溫差等數據，分為五種程度的危機提醒，像是位於本州島的★市在冬季時就常被列為危機程度最高的城市，時常做足保濕準備是相當重要的。請問："
  shared_asset: g1_1_6
