  options:
  - label: A
    content: 本詩的四句全採用譬喻手法，尤其一、二兩句，破空而來，暗喻手法絕高
  - label: B
    content: 「曾經滄海難為水」是從孟子「觀於海者難為水」化用而來。詩意是說，曾經觀看過茫茫的大海，對那小小的細流，是不會看在眼裡的
  - label: C
    content: 這裏的「修道」，也可以理解為專心於品德學問的修養，不論是尊佛奉道也好，修身治學也好，對作者元稹來說，都不過是心失所愛、悲傷無法解脫的一種感情上的寄託
  - label: D
    content: 本詩曲折地表達對曾經相愛的女伴的深情，前三句緊扣主題，層層遞進，最後一句才用畫龍點睛之筆，揭示主題。
