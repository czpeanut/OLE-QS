  section: 5
  number: 9
  type: single
  page: 6
  stem: （ ）根據上文對詩人羅門的描述，請問下列何者不正確？
  options:
  - label: A
    content: 羅門是一個真誠的人，對人不太會虛情假意，不會刻意說好聽的話
  - label: B
    content: 羅門是台灣當代重量級詩人，也是享譽盛名的藝術家
  - label: C
    content: 羅門在空間藝術上，聲名最為卓著的是他一手締造的家「燈屋」，其所有的「裝潢」都是羅門利用日常用品（例如︰蒸籠）及更多撿來的廢棄物親手打造而成
  - label: D
    content: 羅門對山月村這個地方並不滿意，他指出山月村自己雕刻製作的一百多張原木桌椅跟整個大廳材質並不協調。
  group_stem: "羅門、蓉子一向享有「台灣詩壇伯朗寧夫婦」的美譽。不過，兩人個性及興趣卻有些不同。蓉子喜歡旅遊，過去經常只能「千山我獨行」，因為羅門不喜參與。\
    \ \n    這一次，我發憤要把他們兩人同時邀到山月村，本意非常單純：請蓉子到好山好水的地方，她一定很開心。但近年她因骨質疏鬆被關節疼痛所苦，這三天兩夜，實在需要專人陪同，我就堅邀羅門同行。\
    \ \n    蓉子嫻靜高雅的氣質，溫柔馨美的行止，就像「一朵青蓮」（蓉子的代表作之一）入境山月村，她的蓊鬱她的青翠她的妍婉，儼然「從澹澹的寒波擎起」，與山月村的氛圍真是相得益彰。她使山月村更加婉約秀麗、清新優美，此情此景，讓我動容。但這並不令我意外，蓉子本來就是讓日月增輝的人。\
    \ \n    但我萬萬沒有想到的是：被我連騙帶哄來到山月村的羅門，竟然對山月村一見鍾情！這位台灣當代重量級詩人─與其說他是詩人，不如說他是藝術家。當代台灣重要的抽象藝術家的畫展幾乎都邀請羅門發表演講、出版創作畫冊都邀請他撰寫畫評。\
    \ \n    在空間藝術上，聲名最為卓著的是他一手締造的家「燈屋」，那壓根兒就是一座私人藝術館，裡面除了「展覽」當代許多藝術家珍貴的畫作，更可貴的是整個燈屋是一個具有詩質的現代裝置藝術的空間架構。\
    \ \n    而所有的「裝潢」都是羅門利用日常用品（例如︰蒸籠）及更多撿來的廢棄物親手打造而成，他應該是台灣第一個環保專家，這個極具創造性的生活美感空間，曾經兩度上電視、台灣所有的報紙都報導過，超過三十家雜誌做過專訪報導，且多次以燈屋為封面。\
    \ \n    毫無疑問，羅門是一位空間造型藝術家。但我萬萬沒想到，他一走進山月村的大廳，就驚呼：「唉啊！這個空間造型與大自然搭配得真好！」他尤其讚美山月村自己雕刻製作的一百多張原木桌椅跟整個大廳材質的統一、氣氛的協調，他說：「真正呈現出創作者的品味。」\
    \ \n    第三天早餐時，羅門宣布山月村之行，打破他人生三大記錄：第一，他第一次在一天之內行走如此長遠的路程；第二，他第一次吃過這麼美味的原住民餐飲；第三，在晚上的表演節目中，他第一次聽到這麼優美的原音天籟，第一次見到（閃亮三姐妹）如此渾樸天趣的舞蹈。他說：「這些極為純粹精妙的素人藝術，是順應著大自然的呼吸與脈博躍動而出，絕對不是教育或者訓練所能達到的境界。」\
    \ \n    羅門不是個會虛情假意的人，他對山月村最不滿意的是大廳竟然擺放了十張一般會議用的椅子，那是因週末客滿，大廳的原木椅子不夠，只好把會議室的椅子挪過來使用。羅門近乎仇視這些椅子，再三叮嚀快快把它們免費贈送給別人。\
    \ \n    由於蓉子形象太好，肯定是賢妻良友，所以朋友間都篤定認為蓉子跟羅門相處會「吃虧」。這次跟他們夫妻同行，我竟然有一大發現：羅門其實是個好丈夫，一路真心照顧蓉子。我細細的想：所謂一世「夫妻」，就是一生互相「扶持」之意，羅門、蓉子不就是這種鶼鰈的典範嗎？\
    \ \n    羅門來到山月村，不僅他自己覺得滿載而歸，我心裡更是充滿無限的感發，我們都沒有空入寶山（月村）。 \n─鄭明俐〈羅門來到山月村〉"
