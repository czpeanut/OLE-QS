- id: doc_111_新北_崇林_國文_g7s2e1_s4_2
  section: 4
  number: 2
  type: single
  page: 1
  stem: （  ）關於〈傘〉一詩的詩句文意分析，下列敘述何者錯誤？
  options:
  - label: A
    content: 「鳥翅初撲／幅幅相連 以蝙蝠弧形的雙翼／連成一個無懈可擊的圓」生動地將傘開啟過程中的各種樣貌，一氣呵成的呈現在我們眼前
  - label: B
    content: 「一把綠色小傘是一頂荷蓋／紅色朝暾 黑色晚雲／各種顏色的傘是載花的樹」運用了想力，將傘比喻成各種自然景物
  - label: C
    content: 「頂著豔陽 頂著雨／頂著單純兒歌的透明音符／自在自適的小小世界」這是將傘想像成通透明亮的音符，亦呈現出傘下之人悠然自得的情懷
  - label: D
    content: 「一傘在握 開闔自如／闔則為竿為杖 開則為花為亭／亭中藏一個寧靜的我」表達出人生操之在己，應培養寧靜自在的心境，進而從容處世的意涵。
  lesson_raw:
    title: 傘
    basis: 題目指明〈傘〉一詩
