    content: 緊張地將藤織提袋抱在胸前：老太太因為出國的經驗不多，此行又沒有同伴，所以顯得緊張
  - label: B
    content: 她發現我在注意，怯生生地向我打了招呼：描寫老太太害羞的個性
  - label: C
