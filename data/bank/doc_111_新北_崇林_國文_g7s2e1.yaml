  stem: （  ）歐陽脩在〈醉翁亭記〉中用「日出而林霏開，雲歸而巖穴暝。」來形容甚麼景象？
  options:
  - label: A
    content: 山中氣候之變化多端
  - label: B
    content: 山林蟲鳥之靜噪不同
  - label: C
    content: 山間朝暮之晦明變化
  - label: D
    content: 山嵐開合之雲霧繚繞。
  group_stem: "環①滁皆山也。其西南諸峰，林壑尤②美，望之蔚然而深秀③者，琅琊也。山行六七里，漸聞水聲潺潺而瀉出於兩峰之間者，釀泉也。峰迴路轉，有亭翼然④臨於泉上者，醉翁亭也。作亭者誰？山之僧智仙也。名之者誰？太守自謂也。太守與客來飲於此，飲少輒醉，而年又最高，故自號曰醉翁也。醉翁之意不在酒，在乎山水之間也。山水之樂，得之心而寓之酒也。\
    \ \n若夫⑤日出而林霏○6 開，雲歸○7 而岩穴暝，晦明○8 變化者，山間之朝暮也。野芳○9 發○10而幽香，佳木秀而繁陰○11，風霜高潔，水落而石出○12者，山間之四時也。朝而往，暮而歸，四時之景不同，而樂亦無窮也。\
    \ \n~節錄自歐陽脩〈醉翁亭記〉 \n注釋：①環：環繞。②尤：特別。③蔚然而深秀：樹木茂盛又幽深又秀麗。④翼然：像鳥張開翅膀一樣。⑤夫：語氣助詞，無實意，多用於句首。○6\
    \ 林霏：樹林中的霧氣。○7 歸：聚攏。○8 晦明：指天氣陰晴明暗。○9 芳：香花。○10 發：開放。○11佳木秀而繁陰：好的樹木枝繁葉茂，形成一片濃密的綠蔭。○12風霜高潔，水落而石出：秋風高爽，霜色潔白，溪水滴落，山石顯露。"
