  stem: '（  ）唐代詩人依其作品風格，可分為下幾個派別，根據各詩派的風格，請問下列各派別的詩句哪些是正確的？

    （甲）浪漫詩派：「舉杯邀明月，對影成三人。」「飛流直下三千丈，疑是銀河落九天。」

    （乙）社會寫實詩派：「朱門酒肉臭，路有凍死骨。」「烽火連三月，家書抵萬金。」

    （丙）山水田園詩派：「空山不見人，但聞人語響。」「行到水窮處，坐看雲起時。」

    （丁）邊塞詩派：「羌笛何須怨楊柳，春風不度玉門關。」「但使龍城飛將在，不教胡馬度陰山。」'
