  stem: （  ）「象形」與「指事」都是字形不能再加以分析的「獨體」，稱為「文」。「象形」的特色在於用線條畫出物體具體的形狀，而「指事」則是用簡單的線條或符號來表示抽象的概念。下列各組文字的造字法則，何者包含了象形與指事？
  options:
  - label: A
    content: 日、冊
  - label: B
    content: 旦、甘
  - label: C
    content: 泉、八
  - label: D
    content: 入、上。
