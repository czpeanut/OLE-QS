  stem: （  ）〈賣油翁〉：「翁曰：『以我酌油知之。』乃取一葫蘆置於地，以錢覆其口，徐以杓酌油瀝之，自錢孔入，而錢不溼。因曰：『我亦無他，惟手熟爾。』」根據這段文字，下列敘述何者錯誤？
