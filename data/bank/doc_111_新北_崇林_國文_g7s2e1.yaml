- id: doc_111_新北_崇林_國文_g7s2e1_s3_1
  section: 3
  number: 1
  type: single
  page: 1
  stem: 一個人若是講話常( 1 )、不守信用
  group_stem: "A 功敗垂成  B 白雲蒼狗  C 半信半疑  D 包羅萬象  E 四面八方  F 功成名就  G 平步青雲  H 功成不居   \n\
    I 可歌可泣  J 出爾反爾 \n1~6 題 請利用上面方格中的成語，選出最適當的成語並填入代號於下面的文章裡： \n一個人若是講話常( 1 )、不守信用，會讓大家對其失去信任感，有時候規畫事情時，即使自己信心滿滿將會獲得勝利，但最終還是會(\
    \ 2 )，面對失敗的結果。相反的，一個人若是說話一言九鼎，個性又謙虛能夠( 3 )，那麼在他想達成目標的過程中，有時便常能收到來自( 4 )的協助，一路(\
    \ 5 )、步步高升，最後( 6 )，也是因其自身良好的品德及態度所致。"
