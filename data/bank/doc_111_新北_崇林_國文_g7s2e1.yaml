  stem: （  ）關於〈傘〉一詩的寫作手法，下列敘述何者錯誤？
  options:
  - label: A
    content: 運用譬喻手法描述傘開啟的過程，依序展現傘從初開到全開的形狀
  - label: B
    content: 開頭先平鋪直敘眼前所見之實景，再以抒情筆法寫人與傘的關係
  - label: C
    content: 全詩藉物抒情，藉由描寫日常使用的傘，抒發寧靜自適的胸懷
  - label: D
    content: 作者在本詩中巧用短句，並選用重複出現的字營造輕快的節奏感。
