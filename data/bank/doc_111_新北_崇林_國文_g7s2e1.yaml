  type: single
  page: 3
  stem: （  ）「會意」為合併兩個或兩個以上獨體的「文」，將它們的意思結合起來，用以表現出新字含義的造字法則。「形聲」是由表示事物類別的「形符」和表示字音的「聲符」組合而成的字。據這些原則判斷，下列何者不是兼有會意和形聲字？
