- id: doc_113_高雄_左營_自然_g8s2e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: '小軒要測試一些常見的物質的性質，他依下列步驟進行：

    步驟一：剪出 10×10 平方公分的鋁箔紙 4 張，都折成小圓盤狀，標示為甲、乙、丙、丁。

    步驟二：各秤取 1 克的白糖粉、小蘇打粉、糯米粉、麵粉依次倒入甲、乙、丙、丁鋁箔紙盤上。

    步驟三：以酒精燈依次加熱每個鋁箔紙盤幾分鐘。

    步驟四：觀察加熱後的外觀。

    小軒將看到哪一個鋁箔紙盤內沒有黑色物質？'
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
