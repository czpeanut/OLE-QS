  options:
  - label: A
    content: 有機化合物一定含碳元素，但含碳元素不一定是有機化合物
  - label: B
    content: 有機化合物一定要靠有生命的細胞才能產生
  - label: C
    content: 有機化合物不可由人工合成製造
  - label: D
    content: 大多的有機化合物可溶於水，且水溶液可導電
