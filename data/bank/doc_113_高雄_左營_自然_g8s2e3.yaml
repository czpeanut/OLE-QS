  - label: A
    content: 只由碳和氫所組成的化合物
  - label: B
    content: 烴類易溶於水，在氧氣不足的情況下燃燒，會產生一氧化碳，有一氧化碳中毒的危險
  - label: C
    content: 天然氣主要成分為丙烷和丁烷，液化石油氣主要成分為甲烷
  - label: D
    content: 烴類在常溫常壓下，碳數愈多，愈易形成氣態
