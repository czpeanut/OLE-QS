  section: 1
  number: 20
  type: single
  page: 2
  stem: '購買高濃度的酒精,可自行稀釋及分裝成消毒用酒精,但並非所有的塑膠容器都適合盛裝高濃度酒精,有些會被乙醇溶解或腐蝕而使容器變輕。下列研究將三種為熱塑性聚合物材質的容器,分別在50°C
    和70°C 的溫度下,浸入高濃度的酒精中,容器的質量變化率如圖:


    僅依據上述資訊,下列說明何者最合理?'
  options:
  - label: A
    content: 三種材質中,PET 最適合盛裝高濃度酒精
  - label: B
    content: 在兩種溫度下,PP 都是最不適合盛裝高濃度酒精
  - label: C
    content: 鏈狀聚合物的材質比網狀聚合物更適合盛裝高濃度酒精
  - label: D
    content: 與50°C 相比,三種材質皆是在70°C 的條件下容器耗損率較高
  assets:
  - key: s1_20_f1
    kind: figure
    file: doc_113_新北_忠孝_自然_g8s2e3/s1_20_f1.png
