  section: 1
  number: 15
  type: single
  page: 2
  stem: 中國外交官顧維鈞曾在一場國際會議上發言：「山東人民自古為中國民族，用中國語言，信中國宗教，山東是中國文化發祥地之一，為中國北部門戶，山東經濟發展，人口稠密，不容殖民。將山東交還中國符合本和會『承認民族領土完整』原則。日本將德國逐出山東，英國助力，中國竭誠申謝，但割讓中國天賦之權利為報酬，而播將來紛爭之種子，中國必將竭力反對。」關於以上顧維鈞發言的國際會議，下列敘述何者最正確？
  options:
  - label: A
    content: 此事件開啟了新文化運動的序幕
  - label: B
    content: 這場會議是以民族自決為號召的巴黎和會
  - label: C
    content: 日本將德國逐出山東是指第二次世界大戰
  - label: D
    content: 最終中國仍簽署該會議的和平條約
