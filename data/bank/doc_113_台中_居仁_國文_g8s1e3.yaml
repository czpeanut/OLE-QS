  group_stem: "【甲】請根據下文，回答47~49 題\n\n    吏部尚書唐儉與太宗棋，爭道。上大怒，出為潭州。蓄怒未泄，謂尉遲敬德曰：「唐儉輕我，我欲殺之，卿我證驗有怨言指斥。」敬德唯唯。明日上朝，敬德頓首①曰：「臣實不聞。」頻問，確定不移。上怒，碎玉珽②於地，奮衣入。\n\
