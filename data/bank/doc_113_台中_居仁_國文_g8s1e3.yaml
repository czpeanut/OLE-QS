  group_stem: "【丙】請根據下文，回答52~54 題\n\n    如果司馬遷是班級的導師，他一定會很在意學生上課的座位。〈鴻門宴〉中項羽、劉邦、范增、張良以及項伯五人，司馬遷很清楚地指出他們坐在什麼方位：「項王、項伯東向坐，亞父南向坐。亞父者，范增也。沛公北向坐，張良西向侍。」整場〈鴻門宴〉就由這五個人的座位展開，然後再穿插項莊和樊噲的亂入。\n\
    \n    鴻門宴是由項伯牽線而成，他剛與劉邦結為姻親，又是項羽的叔父，不僅身兼宴會場地規劃、主持人，也扮演著促使楚漢一家親的腳色，將自己放在掌握主導權的核心人物身邊是比較好的選擇，隨時可以控制全場氣氛，甚至幫劉邦偷偷說幾句好話。所以，項伯與項羽面東而坐。再來，宴會是在楚軍之中舉辦，而范增在楚軍之中的地位僅次項羽，從此一視角來看，司馬遷當然將其置於次尊的座位。\n\
    \n    鴻門宴上，項羽處於絕對的優勢，劉邦則在絕對的劣勢。司馬遷寫到此段落的時候，一定在事前蒐集不少相關資料，然後反覆思考各人的相對位置是否重要，對於接下來的發展會有甚麼樣的影響，最後他決定保留。與其說座位是展現尊卑的高低，不如說是為了描寫人物的需要。司馬遷創造了一個空間，讓人物可以在其中互動，再隨著時間的流動，故事逐漸開展。人形成故事，故事成為歷史。\n\
    \n    回頭過來看，司馬遷在〈鴻門宴〉讓每個人各就各位，接下來發生的事情就會形成具體的畫面，增加讀者的臨場感與想像力。當項莊舞劍的時候，項伯也拔劍同舞，可以想像局勢之緊張，一旁的張良應該感同身受，才會急忙去找樊噲試圖破壞這個被范增刻意製造的危險場面。而當樊噲衝入帳門，坐在門口的張良當然不以為意，而面對門口而坐的項羽則是立即反應：「按劍而跽。」項羽已經準備拔劍斬殺衝入帳內的不速之客，酒酣耳熟的時候還能有如此迅速的動作。換作是我，看見一個可能長的像是成吉思汗館長的壯漢衝進班上，我應該會「按地而跪」吧！\n\
    \n    再當項羽對樊噲問：「客何為者？」張良馬上解釋：「沛公之參乘樊噲者也。」可以從一開始的座位安排，知道項羽是面向樊噲、張良二人，所以明明是質問樊噲，卻由張良接替回答，乍看就像是項羽詢問張良意見一樣，同時又讓全場焦點放在樊噲身上。瞬間化解當下兩處的劍拔弩張：項莊與項伯、項羽與樊噲。\n\
    \n    之後，樊噲與項羽對答完畢，退至張良旁，也是靠近門口的位置，這樣才能讓後來「沛公起如廁，因招樊噲出」的發展具有合理性，就是樊噲坐在門口才讓劉邦有機會打個暗號要他出來，張良隨後也才能偷跑到外面跟兩人商討如何逃跑比較不會被發現。如果司馬遷是班級導師，他一定很在意學生上課的座位，而這也是在意學生之間的互動和發展。\n\
    節錄自厭世哲學家x 厭世國文老師\n《下輩子別當國文老師‧司馬老師排座位》"
