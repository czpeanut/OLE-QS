  group_stem: "【乙】請根據下文，回答50~51 題\n\n    1986年車諾比核電事故後釋放出大量帶著輻射的銫137到附近的歐洲大陸，因此周圍畫定了一個保護區禁止人類進入，三十多年過去了，動物仍在裡面持續繁衍，甚至讓我們親眼看到了達爾文無法目擊的演化。\n\
    \n    根據烏普薩拉大學的學者Burraco的研究論文中可知，車諾比周邊的一種Eastern tree frog, Hyla orientalis為了適應這種輻射，讓外皮的顏色由綠色變為全黑。根據研究顯示：這種青蛙透過使自己的皮膚產生大量的黑色素(麥拉寧)，故膚色變黑，可以提高抵禦輻射造成的DNA損傷的生存機率。人類也有黑色素，就是皮膚在日曬時變黑的原理，黑色素可以保護陽光中紫外線產生的自由基對DNA或是細胞的傷害，也可以中和輻射的傷害。\n\
    \n    作者指出，黑色的顏色與青蛙目前所經歷的輻射污染量無關。相反的，這種深色的膚色是事故發生時在最受污染區域內或附近的青蛙的典型特徵。所以，這種深色的顏色可能不是由輻射污染引起的基因突變的結果，而是因為在事故發生的時候，擁有較深色皮膚的青蛙(這在它們的族群中通常是少數)，會因為黑色素的保護作用而存活得更久。\n\
    \n    自事故以來的三十多年時間，已經有超過十代青蛙繁衍，這表明一個非常快速的天擇——輻射殺死綠青蛙，而黑皮青蛙活下來。因此可以觀察到，越接近保護區，黑皮樹蛙數量越多。\n\
    摘自韋恩的食農生活粉專文章"
