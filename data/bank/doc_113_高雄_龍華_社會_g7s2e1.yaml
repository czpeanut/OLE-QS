  section: 1
  number: 47
  type: single
  page: 6
  stem: 請問印度種姓制度的由來，與何種社會規範最相關?
  options:
  - label: A
    content: 風俗習慣
  - label: B
    content: 倫理道德
  - label: C
    content: 宗教信仰
  - label: D
    content: 法律
  group_stem: "種姓制度下的榮譽處決\n    印度的種姓制度是外族征服的產物，入侵印度的阿利安人為了鞏固自己的特權地位，後來依印度教義將社會階層劃分成四個等級，除了四大種姓外，還有一種最卑下的賤民階級。這種賤民階級多由罪犯、戰俘後代身分世代相襲，不能受教育、不可穿鞋，只被允許從事非常卑賤的工作，例如清潔穢物或喪葬。正因為卑賤與不潔，他們被視為不潔的象徵，他們走在路上被規定佩帶鈴鐺，以發出聲音讓別人避開，走路時還要自帶掃帚，邊走邊打掃自己的腳印。\n\
    \    「榮譽處決」是印度教當中，對「逆婚者」的私刑處罰。「逆婚」是指高種姓女子嫁給低種姓男子，因違反印度教的傳統價值觀，使家族聲望受到傷害，其結果往往是男女雙方受到女方家人殺害，並稱這種行為，是為了捍衛種姓制度。\n\
    \    雖然印度已在憲法中明定不得因種姓歧視他人，且制定防止「榮譽處決」、不得干涉婚姻之法條，但歷史悠久的種姓觀念仍然深深影響印度的權力關係與人際互動，跨越階級的婚姻至今仍困難重重，最大的問題在於「民眾不認為這是一種社會惡習」。"
  answer:
  - C
