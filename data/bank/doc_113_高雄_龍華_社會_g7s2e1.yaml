  group_stem: "積極同意權與性侵害\n    最高法院發布了一份針對妨害性自主相當白話的判決書。在 110 年度台上字第 1781 號刑事判決中強調「積極同意」的重要性——性行為主動方有責任確認對方完全清醒與取得同意。判決書摘要內容如下:\n\
    \    對方沉默不是同意，對方不確定或猶豫也不是同意，在對方未同意前之任何單獨與你同行回家，只能視為一般人際互動，不是性暗示 ! 同意擁抱或接吻，也不表示想要性交；無所謂「沒有說不行，就等於願意」或有「半推半就」的模糊空間。\n\
    \    刑法第 16 章妨害性自主罪章所保護的法益為個人性自主決定權。「性自主決定權」即「性同意權」，指任何性相關行為都應建立在相互尊重，彼此同意的基礎上。意即，在從事與性相關活動時，都需徵得對方同意，「沒有得到清楚明瞭的同意，就是不同意！」絕對是「Only\
    \ Yes means Yes」，「他說願意才是願意」。\n    有時來自社會的「檢討、譴責被害人」氛圍，卻造成這些被害人的二次、三次甚至是無限次一輩子的傷害。其中很常見的說法是「你為什麼不反抗」、「你為什麼不求救」、「還是你也很喜歡」，這些缺乏同理心的評論，往往使被害者鼓起勇氣求助後會再次被貼上標籤。有些說不出口的拒絕，是來自被害人對於情感不安全或是暴力、權勢的各種恐懼，雖然嘴巴沒有拒絕，但心裡有千百萬分的不願意，這些細微的差異常常被大家忽略。因此，任何行為、就算是情侶之間，更要重視「積極同意」才是。"
  answer:
  - B
