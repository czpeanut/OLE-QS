  - label: B
    content: 秋天／最容易受傷的記憶／霜齒一咬／噢／那樣輕輕／就咬出一掌血來→聖誕紅
  - label: C
    content: 我要翻身／看看一直躲在我背後輕唱的溪水／最近是否消瘦→吊橋
  - label: D
    content: 不必妃子在驪山苦等／一匹汗馬踢踏著紅塵／奪來南方帶露的新鮮／裸露的雪膚一入口／你想，該化作怎樣消暑的清甜→柚子。
