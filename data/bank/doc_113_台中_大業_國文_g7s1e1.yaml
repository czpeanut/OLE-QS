  - label: C
    content: 要兒子深思：無心也會造成不好的後果
  - label: D
    content: 勸勉兒子：知過能改，善莫大焉。
  lesson_raw:
    title: 無心的錯誤
    basis: 題目指明劉墉〈無心的錯誤〉
- id: doc_113_台中_大業_國文_g7s1e1_s3_17
  section: 3
  number: 17
  type: single
  page: 2
  stem: 曉銘放學後急著去探望生重病的奶奶，卻發現自己的腳踏車不見了，剛好旁邊的那輛車沒有上鎖，他就把車子騎走趕往醫院。後來被警方查獲，讓他後悔不已……。若你在事發之初想勸誡他，下列選項何者不適合？
  options:
  - label: A
    content: 事不三思終有悔，人能百忍自無憂
  - label: B
    content: 思考可以構成一座橋，讓我們通向新知識
  - label: C
    content: 慎重對待問題，就是智慧的一半
  - label: D
    content: 一盎司的小心值一磅的學問。
- id: doc_113_台中_大業_國文_g7s1e1_s3_18
  section: 3
  number: 18
  type: single
  page: 2
  stem: 下列選項裡成語的使用，何者使用錯誤？
  options:
  - label: A
    content: 媽媽要他打掃房間，他「一板一眼」，隨便應付，當然會挨罵
