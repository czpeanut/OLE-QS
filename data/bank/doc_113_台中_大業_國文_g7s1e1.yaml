  stem: 關於胡適〈母親的教誨〉的作法，下列敘述何者錯誤？
  options:
  - label: A
    content: 採第三人稱的口吻回憶母親寬嚴並濟的教育方式
  - label: B
    content: 藉具體實例的敘述，凸顯母親慈母兼嚴父的形象
  - label: C
    content: 善用對話與家鄉方言，使人物形象更加具體生動
  - label: D
    content: 結尾用感性的筆調，將自己的好品行歸功於母教。
  lesson_raw:
    title: 母親的教誨
