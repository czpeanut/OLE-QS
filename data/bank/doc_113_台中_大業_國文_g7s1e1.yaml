- id: doc_113_台中_大業_國文_g7s1e1_s3_21
  section: 3
  number: 21
  type: single
  page: 2
  stem: 下列選項中兩兩相對的句子，何者的關係與其他三者不同？
  options:
  - label: A
    content: 寧鳴而死，不默而生／有幾分證據說幾分話，有七分證據不能說八分話
  - label: B
    content: 盡信書不如無書／做學問要在不疑處有疑
  - label: C
    content: 地不耕種，再肥沃也長不出果實；人不學習，再聰明也目不識丁／要怎麼收穫，先那麼栽
  - label: D
    content: 沒有大量的錯誤作臺階，也就登不上最後正確的高座／失敗為成功之母。
- id: doc_113_台中_大業_國文_g7s1e1_s3_22
  section: 3
  number: 22
  type: single
  page: 2
  stem: 「你沒有老子，是多麼得意的事！好用來說嘴！」這種文辭表面之意與內心相反的修辭稱做「倒反」，下列何者沒有使用相同的修辭法？
  options:
  - label: A
    content: 這下可好，都要上場了才發現沒有帶比賽用具
  - label: B
    content: 你真是有愛心，連一毛錢都不願意捐獻
  - label: C
    content: 別再吃了，你已經胖到塞不進褲子裡了
  - label: D
    content: 這個小壞蛋，居然把家裡打掃得這麼乾淨。
  lesson_raw:
    title: 母親的教誨
    basis: 引用胡適〈母親的教誨〉課文
- id: doc_113_台中_大業_國文_g7s1e1_s3_23
  section: 3
  number: 23
  type: single
  page: 2
  stem: 「學生對師長的勸導『一言九頂』，在校園中時有所聞」，此處「一言九頂」是借用「諧音雙關」來表達特別的用意。下列選項中何者沒有使用此手法？
  options:
  - label: A
    content: 老闆只要在公司吹冷氣，就能「坐以待幣」，令人羨慕
  - label: B
    content: 謝謝你「開金口」的祝福，這期大樂透的號碼我一個也沒中
  - label: C
    content: 他們愛情長跑十年終成眷屬，但結婚一年就「相敬如冰」
  - label: D
    content: 長輩們苦口婆心的勸告，在他耳裡竟然都成了「廢腐之言」。
- id: doc_113_台中_大業_國文_g7s1e1_s3_24
  section: 3
  number: 24
  type: single
  page: 2
  stem: 「記住！年輕人，『無心』往往就是一種錯誤！」這句話使用的語氣與下列何者相同？
  options:
  - label: A
    content: 如果我學會了一絲一毫的好脾氣，我都得感謝我的慈母
  - label: B
    content: 我這一生只曉得這一個完全的人，你要學他，不要跌他的股
  - label: C
    content: 來了！來了！從椰子樹梢上輕輕地爬下來了
  - label: D
    content: 這個年輕人多可憐哪！如果是我們的兒子，他也可能會做。
  lesson_raw:
    title: 無心的錯誤
    basis: 引用劉墉〈無心的錯誤〉課文
- id: doc_113_台中_大業_國文_g7s1e1_s3_25
  section: 3
  number: 25
  type: single
  page: 2
  stem: 「娘什麼！老子都不老子呀」一句中，第二個「老子」轉品成為動詞，指的是管教的意思。下列詩句「」中的字，何者也改變詞性，當動詞使用？
  options:
  - label: A
    content: 今天的天空很「希臘」
  - label: B
    content: 他早已不「菸」不「酒」
  - label: C
    content: 火紅的太陽滾著「火」輪子回家了
  - label: D
    content: 我在母親的「教訓」之下住了九年。
  lesson_raw:
    title: 母親的教誨
    basis: 引用胡適〈母親的教誨〉課文
- id: doc_113_台中_大業_國文_g7s1e1_s3_26
  section: 3
  number: 26
  type: single
  page: 2
  stem: 下列「」中與孝親有關的成語，何者使用有誤？
  options:
  - label: A
    content: 父母發自內心疼愛子女的「孺慕之情」令人動容
  - label: B
    content: 他這篇思親的文章，充滿了「寸草春暉」之情
  - label: C
    content: 林老伯日夜不休的守在兒子的病榻前，「舐犢情深」的模樣，令人感動
  - label: D
    content: 教練在選手即將進場比賽前，仍不忘「耳提面命」一番。
- id: doc_113_台中_大業_國文_g7s1e1_s3_27
  section: 3
  number: 27
  type: single
  page: 3
  stem: 「摘不到的星星，總是最閃亮的。溜掉的小魚，總是最美麗的。錯過的電影，總是最好看的。失去的情人，總是最懂我的。我始終不明白，這究竟是什麼道理。」根據本詩內容，下列說明何者正確？
  options:
  - label: A
    content: 喜歡挑三揀四，結果與最好的事物擦身而過
  - label: B
    content: 人的能力實在有限，總在失敗中悔恨
  - label: C
    content: 對人生的各種際遇說不出理由的懊惱
  - label: D
    content: 把握不了的人事物，總有最寬廣的想像空間。
- id: doc_113_台中_大業_國文_g7s1e1_s3_28
  section: 3
  number: 28
  type: single
  page: 3
  stem: 「愛不要抓得太緊，有時需要放鬆。但放鬆並不是放棄，而是適度地扶著他，走向他應該走也願意走的路。」依文意，「愛」的適當表現為何？
  options:
  - label: A
    content: 寬嚴並濟
  - label: B
    content: 先軟後硬
  - label: C
    content: 亦步亦趨
  - label: D
    content: 重罰輕賞。
- id: doc_113_台中_大業_國文_g7s1e1_s3_29
  section: 3
  number: 29
  type: single
  page: 3
  stem: 劉墉：「每個人的生命中都可能遇到貴人，這些貴人不一定真的尊貴，他可能是陌生人，也可能是你的敵人！」關於這段話，下列何者說明正確？
  options:
  - label: A
    content: 面對提拔我們的陌生人須知恩圖報
  - label: B
    content: 打擊過我們的人也可能是貴人
  - label: C
    content: 細心觀察，可以預知貴人出現時機
  - label: D
    content: 貴人表現出特定的形象。
- id: doc_113_台中_大業_國文_g7s1e1_s3_30
  section: 3
  number: 30
  type: single
  page: 3
  stem: 「史丹佛大學有一個代表性的實驗。這個實驗把小孩子留在房間裡面，給他們一人一塊棉花糖，讓他們選擇是要馬上吃掉棉花糖，還是願意等十五分鐘，再多一塊棉花糖當獎賞。研究人員發現：能夠等待獎賞的小孩，長大以後，全都比那些馬上吃掉棉花糖的小孩成功。」從以上「棉花糖實驗」的結果，可以推論出「成功與失敗」最重要的關鍵為何？
  options:
  - label: A
    content: 擁有「延遲享樂」的耐心
  - label: B
    content: 知道「分秒必爭」的道理
  - label: C
    content: 遇見「賞識自己」的伯樂
  - label: D
    content: 具備「天賦異稟」的聰敏。
- id: doc_113_台中_大業_國文_g7s1e1_s3_31
  section: 3
  number: 31
  type: single
  page: 3
  stem: 「如果錯過了太陽時你流了淚，那麼你也要錯過群星了。」依文意，這句話的含意與下列何者最相近？
  options:
  - label: A
    content: 失敗並不可恥，最怕是放棄自己
  - label: B
    content: 忍一時風平浪靜，退一步海闊天空
  - label: C
    content: 魚與熊掌不可兼得
  - label: D
    content: 逝者已矣，明天就是新的一天。
- id: doc_113_台中_大業_國文_g7s1e1_s3_32
  section: 3
  number: 32
  type: single
  page: 3
  stem: 有一個會看手相的朋友說：「在生命中，每個人都有一顆星星指引他的方向，大部分的人，星星都在天上，他必須跟著星星走，讓星星決定他的命運，而小部分的人，手掌上有一個星星的紋，那星星就掌握在他的手中，由他自己去支配。」朋友的這段話主要是說明什麼？
  options:
  - label: A
    content: 人必須靠星星指引方向
  - label: B
    content: 人的命運都在天上
  - label: C
    content: 只有少數的人能掌握自己的命運
  - label: D
    content: 星星對人的重要性。
- id: doc_113_台中_大業_國文_g7s1e1_s3_33
  section: 3
  number: 33
  type: single
  page: 3
  stem: 「孩子！當你還很小的時候，我花了很多時間，教你慢慢用湯匙、用筷子吃東西；教你繫鞋帶、扣扣子、溜滑梯；教你穿衣服、梳頭髮、擤鼻涕……這些和你在一起的點點滴滴，多麼令我懷念不已。孩子，現在我常忘了扣扣子、繫鞋帶；吃飯時，會弄髒衣服；梳頭髮時手還會不停的抖，不要催促我，多給我一點耐心和溫柔。當我想不起來，接不上話時，請給我一點時間，等我一下，讓我再想一想。只要有你在一起，就會有很多的溫暖湧上心頭。孩子！如今，我的腳站也站不穩，走也走不動。所以，請你緊緊的握著我的手，陪著我，慢慢的。就像當年一樣，我帶著你一步一步地走。」以上為老人安養院牆上的一篇文章，請問下列何者為老人的心聲？
  options:
  - label: A
    content: 希望時光能夠倒流，重溫舊夢
  - label: B
    content: 祈求自己身體健康，樂享天倫
  - label: C
    content: 渴盼子女成龍成鳳，光宗耀祖
  - label: D
    content: 希望孩子放慢腳步，耐心陪伴。
- id: doc_113_台中_大業_國文_g7s1e1_s3_34
  section: 3
  number: 34
  type: single
  page: 3
  stem: 本文的主旨是什麼？
  options:
  - label: A
    content: 母親不甘於平淡度日，卻又只能藉著回憶來安慰自己
  - label: B
    content: 母親為了家庭和子女，甘願遠離青春與夢想
  - label: C
    content: 母親嚮往著豪華舒適的生活
  - label: D
    content: 母親希望孩子能了解自己過去的點點滴滴。
  group_stem: "母親似乎有好些東西，完全不是拿來用的，只為放在箱底，按時年年在三伏天取出來曝晒。\n  不能忘記的是母親打開箱子時那份欣悅自足的表情，她慢慢的看著那幅湘繡，那時我覺得她忽然不屬於周遭的世界，那時候她會忘記晚飯，忘記我紮辮子的紅絨繩。她的姿勢細想起來，實在是仙女依戀的輕撫著羽衣的姿勢，那裡有一個前世的記憶，她又快樂又悲哀的將之一一拾起，但是她也知道，唯其不會重拾，所以回顧的一剎那更特別的深情凝重……\n\
    \  而母親口裡的外公，上海、南京、湯包、肴肉全是仙境裡的東西，母親每講起那些事，總有無限的溫柔，她既不感傷，也不怨嘆，只是那樣平靜的說著。她並不要把那個世界拉回來，我一直都知道這一點，我很安心，我知道下一頓飯她仍然會坐在老地方，吃那盤我們大家都不愛吃的剩菜。而到夜晚，她會照例一個門一個窗的去檢點去上閂。她一直都負責把自己牢鎖在這個家裡。\n\
    \  哪一個母親不曾是穿著羽衣的仙女呢？只是她藏好了那件衣服，然後用最黯淡的一件粗布把自己掩藏了，我們有時以為她一直就是那樣的。             \
    \                                               （張曉風 母親的羽衣）"
- id: doc_113_台中_大業_國文_g7s1e1_s3_35
  section: 3
  number: 35
  type: single
  page: 3
  stem: 為什麼作者聽了母親的往事，仍然覺得很安心？
  options:
  - label: A
    content: 她希望母親去追求更美好的生活
  - label: B
    content: 她已經習慣了母親的呵護
  - label: C
    content: 她並不在乎母親的過往
  - label: D
    content: 她知道母親的愛不會改變。
