  section: 1
  number: 27
  type: single
  page: 2
  stem: "「上課時，老師說泰緬鐵路旁立了一個碑，上面寫著:\n   『原諒，但是不可以忘記。』是對於二次世界大戰日本\n   軍事侵略後的省思。並問同學從這個碑可以學到什麼道理。」下列回答何者相去最遠﹖"
  options:
  - label: A
    content: 小明:歷史像過時的日曆，撕掉丟棄即可
  - label: B
    content: 曉華:漠視歷史者終將成為下一次的受害者
  - label: C
    content: 阿惠:歷史是存在的事實，絕不可被扭曲
  - label: D
    content: 志杰:前事不忘，後事之師
- id: doc_113_新北_五峰_國文_g9s1e2_s1_28
  section: 1
  number: 28
  type: single
  page: 2
  stem: 「你是砍柴的，他是放羊的，你和他聊了一天，如是你學會了放羊技巧，原來羊是這麼放的，他學會了砍柴技能，原來柴要這樣砍。」這段文字可與論語中的哪一句話相呼應﹖
  options:
  - label: A
    content: 君子恥其言而過其行
  - label: B
    content: 德不孤，必有鄰
  - label: C
    content: 三人行，必有我師焉
