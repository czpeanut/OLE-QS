  stem: 根據(甲) (乙)兩文，下列文句□中所應填入的主語，何者錯誤﹖
  options:
  - label: A
    content: □見其閉戶研鐵屑:有人
  - label: B
    content: □為暴雷震死:賣油者
  - label: C
    content: '□願知其故: 賣油者'
  - label: D
    content: '□震死宜矣: 靈仙'
  group_stem: "(甲)\n河間有遊僧，賣藥於市。以一銅佛置案上，而盤貯藥丸，佛作引手取物狀。有買者，先禱於佛，而捧盤進之。病可治者，則丸躍入佛手；其難治者，則丸不躍。舉國信之。後有人於所寓寺內，見其閉戶研鐵屑，乃悟其盤中之丸，必半有鐵屑，半無鐵屑；其佛手必磁石為之，而裝金於外。驗之信然，其術乃敗。\n\
    \             ——節錄自清 紀曉嵐 閱微草堂筆記\n\n(乙)\n廬山賣油者，養其母甚孝謹，為暴雷震死。其母自以為無罪，日號泣於九天使者之祠，願知其故。一夕，夢朱衣人告曰:\
    \ 「汝子恆以魚膏雜油中，以圖厚利。且廟中齋醮，恆用此油。腥氣薰蒸，靈仙不降。震死宜矣。」母知此事，遂止。\n                      \
    \  ——節錄自徐鉉 稽神錄"
