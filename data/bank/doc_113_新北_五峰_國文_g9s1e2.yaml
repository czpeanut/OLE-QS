  group_stem: "飯後，那雪越發下得大了。站在房門口朝外一看，只見大小樹枝，彷彿都用簇新的棉花裹著似的。樹上有幾隻老鴉，縮著頸項避寒，不住地抖擻翎毛，怕雪堆在身上。又見許多麻雀兒，躲在屋簷下，也把頭縮著，怕冷。其飢寒之狀殊覺可憫。因想:\
    \ 「這些鳥雀，無非靠著草木上結的實，並靠些小蟲蟻兒充飢度命，現在各樣蟲蟻自然是都入蟄，見不著的了。就是那草木之實，經這雪一蓋，哪裡還有呢﹖倘若明天晴了，雪略為化一化，西北風一吹，雪又變做了冰，仍然是找不著，豈不要餓到明春嗎﹖」想到這裡，覺得替這些鳥雀愁苦得受不得。轉念又想:\
    \ 「這些鳥雀雖然凍餓，卻沒有人放槍傷害牠，又沒有什麼羅網來捉牠，不過暫時飢寒，撐到明年開春，便快活不盡了。若像這曹州府的百姓呢，近幾年的年歲，也就很不好。又有這麼一個酷虐的父母官，動不動就捉了去當強盜看待，用戰籠站殺，嚇得連一句話也說不出來，於飢寒之外，又多一層懼怕，豈不比這鳥雀還要苦嗎﹖」想到這裡，不覺落下淚來。又見那老鴉有一陣刮刮地叫了幾聲，彷彿牠不是號寒啼飢，卻是為有言論自由的樂趣，來驕這曹州府百姓似的。\n\
    \                       ——節錄自劉鶚 老殘遊記"
