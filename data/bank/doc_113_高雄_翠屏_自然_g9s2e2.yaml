  section: 1
  number: 1
  type: single
  page: 1
  stem: 當磁鐵靠近或遠離線圈時，線圈會產生感應電流。下列敘述何者正確？
  options:
  - label: A
    content: 不用電池也能產生電流，表示能量可以無中生有
  - label: B
    content: 磁鐵移動的愈緩慢，感應電流愈大
  - label: C
    content: 增加線圈的圈數並不能使感應電流加大
  - label: D
    content: 發電機是利用電磁感應原理產生電流的裝置
