- id: doc_113_高雄_翠屏_自然_g9s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 家電用的電磁爐，通常是根據法拉第的電磁感應原理，利用磁場使置於爐面上的鍋子出現感應電流（稱為「渦電流」），再透過電流的熱效應，使鍋子產生高溫以烹煮食物。下列有關此種電磁爐與所用鍋子的敘述，何者正確？
  options:
  - label: A
    content: 電磁爐所用的鍋子必須是電的絕緣體
  - label: B
    content: 電磁爐內的磁場是隨時變化的磁場
  - label: C
    content: 電磁爐所用的鍋子必須是熱的絕緣體
  - label: D
    content: 鍋子中出現的感應電流必為直流電
