  stem: '目前大眾對綠色能源的議題愈來愈重視，因此吉伊想利用家裡的屋頂裝設太陽能板發電自給自足。已知在臺北每一坪的太陽能板平均每天可以發電 0.75 度（仟瓦小時）。吉伊房間每天平均使用電器情形如附表所示，如果太陽能板所發的電只供應吉伊房間使用，根據上述資料，吉伊家屋頂至少要裝多少坪的太陽能板？


