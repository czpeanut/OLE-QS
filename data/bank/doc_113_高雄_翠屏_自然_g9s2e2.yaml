- id: doc_113_高雄_翠屏_自然_g9s2e2_s1_18
  section: 1
  number: 18
  type: single
  page: 4
  stem: 將軟鐵棒、導線、直流電源、開關 K 連接如圖，軟鐵棒的右端有一個磁鐵因磁力作用而吸附在軟鐵棒上。按下開關 K 接通電路後，發現磁鐵因為與軟鐵棒相互排斥而掉落，下列有關磁鐵掉落的敘述，何者最合理？
  options:
  - label: A
