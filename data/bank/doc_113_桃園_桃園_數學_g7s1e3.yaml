- id: doc_113_桃園_桃園_數學_g7s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '以下是甲、乙兩人化簡 $\frac{2x+1}{3}-\frac{-3x+2}{2}$ 的過程：


    甲：① 將式子乘以 6，得 $2(2x+1)-3(-3x+2)$

    ② 去括號，得 $4x+2+9x-6$

    ③ 化簡得 $13x-4$


    乙：① 通分，得 $\frac{4x+2}{6}-\frac{-9x+6}{6}$

    ② 兩個式子合併，得 $\frac{4x+2+9x-6}{6}$

    ③ 化簡得 $\frac{13x-4}{6}$


    對於兩人的化簡過程，下列判斷何者正確？'
  options:
  - label: A
    content: 甲、乙都正確
  - label: B
    content: 甲、乙都錯誤
  - label: C
    content: 甲正確，乙錯誤
  - label: D
    content: 甲錯誤，乙正確
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 數學
