- id: doc_113_高雄_五甲_國文_g9s2e1_s2_3
  section: 2
  number: 3
  type: single
  page: 6
  stem: 根據文意，請問下列選項的敘述，何者使用了《原子習慣》一書提到「創造明顯的視覺提示」？
  options:
  - label: A
    content: 教務處外公告欄張貼閱讀推廣活動同學們優秀的學習單
  - label: B
    content: 模擬考分數30分以上或成功減C的同學，每人獲得一張獎狀
  - label: C
    content: 男廁小便斗附近張貼「向前一步靠，點滴不外漏」的標語
  - label: D
    content: 教室前方懸掛會考倒數日曆，提醒同學把握時間讀書。
  group_stem: '(二)《原子習慣》一書提到「創造明顯的視覺提示」一事，我對這段下的註腳是：足以成大事。

    男生應該都看過許多廁所小便斗有類似這樣的標語:「向前一步靠，點滴不外漏」，或者是「珍惜打掃人的辛苦」。與其試圖喚起大眾慈悲心，不如「放隻蒼蠅」!

    三個月內我三度出國，分別走訪日本、英國、馬來西亞，穿梭各地機場的時候，我發現許多地方的小便斗裡，都有一張蒼蠅圖樣的貼紙。

    《原子習慣》一書亦提及，早年研究顯示:「這些貼紙每年為機場省下八%的廁所清潔費用」，因為蒼蠅圖樣會引導男性將小便「瞄準」，因而減少尿花四濺。

    DOMI綠然是個以推動節能聞名的B型企業，其中一個強項是幫辦公室規畫如何節電，除了節電設施的更換外，初聞共同創辦人Corey(連庭凱)分享連監測用電量、視覺化用電數據、電表安排在顯眼處(譬如監測一天當中
    每個小時的耗電數據)也可以幫助節電時，我幾乎不敢置信。

    Corey說的道理，原子習慣一書亦提及。在1970年代的石油危機中，荷蘭研究人員曾發現在阿姆斯特丹的郊區，某些住戶房子大小相仿，能源竟比鄰居少消耗三成，唯一的差別很可能只在於電表位置不同，有些安排在地下室(你不容易看到)，有些在樓上的走廊(你比較容易看到)。

    書中解釋:「把電表裝設在走廊的住家，用的電比較少。當能源的使用顯而易見且便於追蹤，人們就會改變自己的行為。」

    綜合上述，我想到國內有幾個政黨，長年標榜自己重視節能。如果他們願意和綠然合作，從自己的政黨黨部環境改變起，讓員工上班就能輕易看到電表，這應該對於強化他們自我認同為「節能者」的身分有幫助，「節能者」應該有更強大動機進行更多關於節能的討論，推動相關政策，持續推動之後，就更朝向節能的總目標前進。——楊斯棓
    〈嘗試喚起良心，不如「放隻蒼蠅」!〉'
