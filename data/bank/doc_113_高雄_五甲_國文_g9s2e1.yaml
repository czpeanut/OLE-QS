  section: 2
  number: 1
  type: single
  page: 5
  stem: 根據文意，我們可將一般知識、專業知識、經驗知識和融合知識這四種知識的關係轉為下列何圖？
  options:
  - label: A
    content: ''
    asset:
      key: optA
      file: doc_113_高雄_五甲_國文_g9s2e1/2_1_optA.png
  - label: B
    content: ''
    asset:
      key: optB
      file: doc_113_高雄_五甲_國文_g9s2e1/2_1_optB.png
  - label: C
    content: ''
    asset:
      key: optC
      file: doc_113_高雄_五甲_國文_g9s2e1/2_1_optC.png
  - label: D
    content: ''
    asset:
      key: optD
      file: doc_113_高雄_五甲_國文_g9s2e1/2_1_optD.png
  group_stem: '(一) 知識分為一般知識、專業知識、經驗知識和融合知識。位於金字塔底端的一般知識包括事實和資訊，例如「秋天的橘子很黃」、「果皮的厚度依據品種不同而有所差異」等。這種知識可以透過Google搜尋輕易查到，因為這種資訊容易掌握，水準不高，所以學會了一般知識並不等於成為該領域的專家，當然也不能創造財富。

    位於金字塔中間的專業知識是針對特定領域具有豐富的深度知識，可以透過終身教育機構或大學學習獲得，此外，專業知識還涉及學習新知及有效利用所掌握資訊的能力。

    金字塔頂端的融合知識是指綜合大學或研究所可以學習到的知識，融合了第四次工業革命時代的代表產業，包括大數據、自動駕駛、互聯網、3D列印和元宇宙等領域所需要的技術，為人類提供便利的新知識。

    融合知識追求的是解決以人類為中心的技術、適用技術、消除社會矛盾、環境問題等我們社會面臨的重要問題，這些議題匯集了全球的關注和資金，因此可以創造巨大的財富。

    涵蓋金字塔所有領域的經驗知識不是透過理論或書面學習獲得的，而是透過實際使用或現場經驗獲得的知識，屬於一種隱性知識。如果最大程度的利用經驗知識，就可以透過與競爭對手、產品或服務的差異化來創造一定的財富。

    以餐飲業為例，一般來說餐飲業即使不讀研究所，只要掌握一般知識，再加上一定程度的專業知識，也可以創業。如果在這裡發揮只屬於自己的經驗知識，就能透過創造與其他餐廳的差異來創造利益。

    很重要的一點是，知識水準越低，經驗知識就越重要。1886年成立的可口可樂保守了一百三十六年製作可樂的商業機密，就是出於這個原因。任何人都可以輕易獲得的一般知識與專業知識無法維持競爭力，如果這種情況反覆出現，專業知識就會變為通用知識。通用知識是指前所未有的新技術和訣竅長期被適用於各種領域，因而被廣泛接受的知識。也就是說，雖然專業知識一開始也具有自己的競爭力，但隨著知識的通用化，逐漸轉變為一般知識。

    2022年《哈佛商業評論》提到了MBA學位競爭力日益下降的原因。MIT商學院以通用汽車前執行長艾弗雷德·史隆(Alfred P. Sloan)的名字命名。商學院教育課程至今仍由經營策略、財務、會計、生產品質管理、營銷和人事等組成。

    這種結構原封不動地模仿了二十世紀工業、汽車領域企業的結構，然而在今日的數位商業中，這種結構已經行不通了。就算是在昂貴的MBA課程，如果不能根據持續改變的企業需求，不斷推陳出新，就只能停留在通用知識階段。美國金融科技公司直覺(Intuit)的創辦人史考特·庫克(Scott
    D. Cook)如此指出MBA課程的無用論:「就算MBA畢業，也要從基礎開始重新訓練。」——鄭寅鎬 〈就算拿到MBA學位也學不到的經驗知識〉'
