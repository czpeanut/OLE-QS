    蓋元劇之作者,其人均非有名位學問也。其作劇也,非有藏之名山,傳之其人之意也。彼以意興之所至為之,以自娛娛人。關目之拙劣,所不問也;思想之卑陋,所不諱也;人物之矛盾,所不顧也。彼但摹寫其胸中之感想與時代之情狀,而真摯之理與秀傑之氣,時流露於其間。故謂元曲為中國最自然之文學,無不可也。'
  options:
  - label: A
    content: 元劇不避粗陋、兼具雅俗,比較能恣意傳遞作者的情感思想
  - label: B
    content: 分述元劇特色,認為元劇作品是自出胸臆,能反映時代氛圍
  - label: C
    content: 雖列舉元劇缺失,但也正向評價元曲具有自然不造作的優點
  - label: D
    content: 元曲常有親近山水、歸隱山林的思想,因此是最自然的文學。
