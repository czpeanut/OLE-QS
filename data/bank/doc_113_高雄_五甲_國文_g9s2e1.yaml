    在日內瓦的老城中漫步,你可以權當一回歷史家,那裡的建築向你訴說著歷史:爭取獨立和自由的歷史,充滿著血雨腥風的歷史,專制和寬容互相鬥爭的歷史,演化著世事變遷的歷史。你可以權當一回建築學家,那裡匯集了從中世紀到近代的各種風格的建築,或敦實,或輕靈,或雄偉,或挺拔,在其演變中都向你訴說著人類文明的進步或改善。你可以權當一回詩人,那暗紅色的屋頂,灰白色的牆壁,古意斑駁的門廊,光滑的鵝卵石路面,在落日的餘暉中響起的隱隱鐘聲,都會引發你的思古幽情,讓你回到如流水般逝去的過去……'
