- id: doc_113_高雄_五甲_國文_g9s2e1_s2_5
  section: 2
  number: 5
  type: single
  page: 6
  stem: 關於兩篇作品的形式，何者敘述正確？
  options:
  - label: A
    content: 甲篇題目為「紅繡鞋」，乙篇題目為「歸隱」，皆說明主題
  - label: B
    content: 甲篇從形式上可判斷為散曲，字體較小的部分稱為「襯字」
  - label: C
    content: 乙篇從形式上可判斷為仄起式七言律詩，一韻到底
  - label: D
    content: 我們可知甲篇作品體裁所盛行的朝代先於乙篇作品。
  group_stem: '(三)

    【甲】才上馬齊聲兒喝道，只這的便是那送了人的根苗，直到深坑裡恰①心焦。禍來也何處躲?天怒也怎生饒?把著來時威風不見了。 正膠漆當思勇退，到參商②才說歸期，只恐范蠡
    張良笑人痴。拱著膀登要路，睜著眼履危機，直到那其間誰救你?

    ——張養浩 〈紅繡鞋 警世〉

