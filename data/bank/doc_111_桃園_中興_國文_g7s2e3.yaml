  group_stem: "小環頸鴴（Charadrius dubius）是鴴類中體型最小的一種，體長約十七公分，腹部呈白色，背部呈褐色，頭部有一條黑帶，頸部有項鍊般的黑環。小環頸鴴一般在多礫的河岸築巢。牠們的巢雖然簡陋，但都具備極佳的排水及護卵功能。而且，它們完全融入周圍的環境，不易被人發現。雌鳥通常產四粒卵，雌、雄鳥輪流照護，不分晝夜地抱卵，經過約二十五天雛鳥孵化出來。數小時後，羽毛不再潮濕，雛鳥便開始走動，並在親鳥的帶領下到食物較多的河邊自己覓食。從此雛鳥不再回巢，夜間棲息在水邊的凹陷地或大石頭旁。\n\
    \    小環頸鴴親鳥不餵飼雛鳥，但牠們對雛鳥仍極盡保護之能事。鴴類有不少害敵，當這些害敵接近雛鳥時，親鳥便跳到害敵面前，以假裝受傷的翅膀拍打地面，露出一副掙扎受苦的模樣。害敵每接近牠一步，牠就配合害敵挪移一步，裝作很痛苦的樣子，讓害敵把焦點放在牠身上，專注追趕牠，如此一步一步地將害敵引誘到離雛鳥較遠的地方。當親鳥認為已誘騙到完全安全距離時，就振翅飛走了，這就是所謂的「擬傷行為」。\n\
    \    雲雀也以擬傷行為保護後代而有名。牠通常在草叢中築巢，親鳥離巢起飛時，會先爬行一段距離才起飛，回巢時也一樣，先降落在離巢一段距離的地方。這樣害敵就無法從牠起飛、降落的地點，推算牠築巢的位置，也就找不到巢中的卵及雛鳥。萬一害敵僥倖發現鳥巢，親鳥便降落在朝牠接近的害敵面前，和小環頸鴴一樣擺出哀兵姿態，假裝受傷、行動不便，讓對方輕敵，以為面前受傷的鳥容易得手。當害敵見獵心喜地跳向親鳥時，親鳥順勢逃開幾步，再掙扎一下，如此反覆數次，便能順利地把害敵引誘到離巢三、四十公尺遠的地方，接著忽然起飛，而害敵只能眼睜睜地看著親鳥遠走高飛，再也想不起鳥巢的位置。\n\
    \    當然這種擬傷行為並非萬無一失，對親鳥而言還是要冒生命危險的，一有閃失就壯烈成仁了。自然界中的生物們面對危機的生存之道，和人類有異曲同工之妙，□□□□和鳥類的擬傷行為不就是最好的例子嗎？\n\
    （改寫自《成語動物學【鳥獸篇】：閱讀成語背後的故事》）"
