  group_stem: '(甲)

    昔有餽魚於鄭相者，鄭相不受，或謂鄭相曰：「子嗜魚，何故不受？」對曰：「吾以嗜魚，故不受魚。受魚失祿，無以食魚。不受得祿，終身食魚。」

    (乙)

