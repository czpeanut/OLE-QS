  group_stem: "出生於1980 年代的我，在求學時期已經不若過去的女性被迫犧牲或阻止，但一進入職場，我就感受到性別差異，那應該是我和同樣學歷、經歷的男同事一起打開薪資條的剎那吧？過了十多年，這個問題沒有改善太多。依據勞動部日前公布的「同酬日」為2\
    \ 月21 日，因男、女性2019 年平均薪資差距14.2%，所以臺灣女性勞工必須多工作52 天，才能拿到男性去年總薪資。當然這其中有多重因素，很難在此快速說明。\n\
    \      2019 年，臺灣女性勞動力參與率為51.1%，若從女性各年齡勞參率來看，25 至34 歲都有超過85%的漂亮數字，比美、日、韓同年齡層女性還高呢！（韓國65.2%，日本76.9%。）但50\
    \ 歲之後，臺灣50 至54 歲勞參率驟降到61.0%，韓國卻有68.3%，日本更高達79.2%，臺灣55 至59 歲女性勞參率剩四成，其他國家還在六成以上。\n\
    \  35 歲及55 歲的女性，發生了什麼事？以我自己的親身經驗，即便我這代30 多歲的女性，教育與職業發展程度與男性相當，但當了媽媽後，必須面臨不足也不夠好的托育資源，較好的幼兒園師資環境，兩個孩子的學費可能就吃掉大半薪水。而缺乏彈性工時的勞動環境，又會讓小學生必須在安親班、補習班待到六、七點，而自己的薪水又比伴侶低，幾經思量，不如留在家帶孩子，或是選擇收入低的兼職。再不然，就改換到避免需要加班、出差的工作。\n\
    \  不知不覺，當年同班的男生都在職場小有成果了，自己還在計算準時打卡後，要如何在捷運月臺衝刺轉車，才能剛好接到放學的孩子。\n  而50 歲以上的婦女，早期社會環境導致教育程度受限，年輕時無完善托育政策，中年後又成為照顧家族長輩的主要人力。就這樣，結婚、育兒及照顧家庭，竟成了女性逐漸失去自己模樣的主要因素。當然，還是有許多女性花費比男性更多心力積極尋求平衡，或設法走出一段育兒也能實現自我的全新道路，我還是希望，正在父母懷中備受呵護的女孩們、坐在教室裡的女學生、在體育場上揮汗的女運動員，未來不再需要________________，能有更多元實踐自我的選擇與機會！\n\
    （節選自 <不管男孩女孩，都應該成為你想成為的人>）"
