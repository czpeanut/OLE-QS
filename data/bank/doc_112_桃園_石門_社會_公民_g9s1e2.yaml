- id: doc_112_桃園_石門_社會_公民_g9s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 一國保有國際上可以接受的外幣數量，即是該國的外匯存底。外匯存底主要是靠進出口收支結餘、外國資金匯入或利息收入來累積，其中又以進出口的收支最為重要。若A國與B國只與對方相互貿易，一整年下來發現A國外匯存底增加了，但是B國的外匯存底卻減少。請問，下列敘述何者較符合上述兩國的貿易現象？
  options:
  - label: A
    content: A國對B國有貿易逆差
  - label: B
    content: A國對B國有貿易順差
  - label: C
    content: B國對A國貿易平衡
  - label: D
    content: B國對A國有貿易出超。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 公民
      code: 4-2
      title: 保障市場勞動參與
      chapter: 第4章 勞動參與
    textbook: 九上公民 4-2 保障市場勞動參與
    labeled_by: ai
