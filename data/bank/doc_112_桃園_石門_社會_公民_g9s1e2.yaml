    content: 只要能熱賣，有無利潤不重要
  - label: B
    content: 壓低售價才有價格競爭力
  - label: C
    content: 只有提高價格才能創造高利潤
  - label: D
    content: 消費者對高價位產品有無法抗拒的吸引力。
