  section: 1
  number: 5
  type: single
  page: 1
  stem: 臺北市首創「消保官上前線、商展 GO GO GO」計畫，是由消保官與衛生局人員進駐商展現場，替民眾把關，提供現場民眾消費爭議諮詢，受理消費爭議申訴。請問：我國政府為保護消費者權益，在地方上設置的消費者保護機構應為下列何者？
  options:
  - label: A
    content: 消費者文教基金會
  - label: B
    content: 消費者服務中心
  - label: C
    content: 消費者權益促進會
  - label: D
    content: 行政院消費者保護處。
