- id: doc_112_桃園_石門_社會_公民_g9s1e2_s1_37
  section: 1
  number: 37
  type: single
  page: 4
  stem: 文中提及農委會祭出補貼及獎勵生產的措施，是屬於哪一種性質的誘因？
  options:
  - label: A
    content: 正向、金錢誘因
  - label: B
    content: 負向、金錢誘因
  - label: C
    content: 正向、非金錢誘因
  - label: D
    content: 負向、非金錢誘因。
  group_stem: '※2022年春節前後開始，臺灣雞蛋傳出供應量不足的消息，超市雞蛋區的貨架上空無一物，一旦補貨馬上就被搶購一空，全臺陷入一「蛋」難求的空前雞蛋荒。為什麼雞蛋產量會供應不足呢？農委會指出，入冬以後，氣候嚴寒與早晚溫差大，使雞蛋產能減少；部分蛋農指出，雞蛋生產成本提高，飼料價格上漲，但蛋價卻不斷下跌，許多蛋農紛紛減產，且2021年因確診禽流感而遭到撲殺的雞隻高達數十萬隻，再加上時逢農曆春節前後，雞蛋消費需求量增加，最終引發蛋荒危機；蛋荒使全臺各地出現「恐慌性搶購潮」，也加劇了缺蛋的狀況。

    缺蛋的嚴重性也反映在價格上。過去大型連鎖超市一盒雞蛋最便宜約莫40～50 元，如今卻漲到60 元，甚至接近百元以上，連帶影響許多大量使用雞蛋的餐飲業者。除此之外，許多非銷售雞蛋的商家看中了這波風潮，也開始賣起雞蛋，造成荒「蛋」亂象。

    面對上漲的蛋價，農委會雖然在第一時間宣布凍漲，卻反而使蛋農權益受損，飼養意願更是低迷，使缺蛋風暴愈演愈烈，而後農委會祭出補貼成本與獎勵生產政策與解除凍漲，短時間內的確緩解了蛋農的困境，供應量也在春節過後逐步上升，但市場上仍然無法遏止民眾搶購心態，致使蛋價仍扶搖直上，目前進口國外雞蛋應急，但卻沒有完全解決缺蛋危機，反而因為國外進口蛋日期標示及進口商相關問題，造成民眾人心惶惶，對進口蛋拒之千里，國產雞蛋仍然供不應求，最後官員還因此辭職下台。請依上文回答第37-40
    題:'
