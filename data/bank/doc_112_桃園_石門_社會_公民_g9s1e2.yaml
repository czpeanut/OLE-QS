  stem: 時常聽聞有業者在網路上發生商品標錯價格事件，事後又不願意「依約出貨」或提出其他改善方案，嚴重侵害消費者權益，因此地方政府依法予以裁罰業者。請問：上述政府裁罰業者是依據下列何項法律？
  options:
  - label: A
    content: 公平交易法
  - label: B
    content: 刑法
  - label: C
    content: 民法
  - label: D
