- id: doc_112_桃園_石門_社會_公民_g9s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: COVID-19疫情嚴重期間，曾經民眾為搶口罩及酒精不惜漏夜排隊，一堆網友更是在網路上哀號說：買不到啊買不到！～也有一堆人在狂問，到底除了藥局以外，還有哪裡可以買得到口罩或酒精？請問：根據上述內容判斷，何者較正確？
  options:
  - label: A
    content: 藥局與網路購物同樣為無形的交易市場
  - label: B
    content: 狂搶口罩及酒精是因為廠商壟斷市場交易所造成的影響
  - label: C
    content: 消費者狂搶防疫物資是受到所得高低的影響
  - label: D
    content: 如果廠商故意囤積口罩、酒精不鋪貨，會受到政府的行政處罰。
