  stem: 電子商務蓬勃發展，網路購物已成了大家日常生活的一部分，尤其是「雙11 購物節」在中國大力宣傳下，已成了世界皆知的購物節，連台灣的網路購物平台公司也怕錯過這一波商業效益，紛紛推出優惠方案。請問：上文提到的「網路購物平台公司」是屬於下列哪一種市場類型？
