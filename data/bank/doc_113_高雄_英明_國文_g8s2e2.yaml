- id: doc_113_高雄_英明_國文_g8s2e2_s5_13
  section: 5
  number: 13
  type: single
  page: 6
  stem: 請問文中的「老者」應是何人？
  options:
  - label: A
    content: 杜甫
  - label: B
    content: 王維
  - label: C
    content: 李白
  - label: D
    content: 蘇軾。
  group_stem: "唐 寶應元年，當塗縣。\n深夜，秋雨飄搖，門窗俱閉。一位老者頹然臥在床榻上，閉目不動，衣襟上滿是酒氣。以往光芒四射的生命力即將消散殆盡，如今的他只剩一具蒼老軀殼橫在現世，如殘燭星火。\n\
    「生者爲過客，死者為歸人。天地一逆旅，同悲萬古塵……」老者艱難地嚅動嘴唇輕吟，聲音雖然嘶啞，卻透著豁達，似乎全不把這當回事。他吟到興頭，右手徒勞地去抓枕邊酒壺，卻發現裡面已經滴酒不剩。\n\
    「古來聖賢皆寂寞，無酒寂寞，寂寞無酒哪……」老者望著天花板喃喃自語。倏然屋內似乎有些動靜，他費力地擰了擰脖子，偏過頭去看，但只看到臨窗桌上自己的詩囊和毛筆。屋內沉寂依然。\n\
    「或許是大限將至，眼花耳鳴了吧。」老者暗想，心中不無欷歔。這件詩囊和毛筆伴隨他多年，不知自己是否還有機會暢飲美酒，提筆賦詩。所幸自己歷年來積攢的詩稿已經託付給了叔叔李陽冰，倒也沒什麼遺憾。\n\
    老者輕拍空壺，心中只是感懷，卻無甚悲傷。\n一陣雷聲滾過，老者再看，發現桌旁赫然多出來一個人。這人身形頎長，一身烏黑色的長袍，頭戴峨冠，看打扮似是個讀書人，但面色枯槁卻有說不出的詭異。\n\
    「青蓮居士嗎？」\n聲音低沉，帶著森森陰氣。老者借著窗外的閃電，看到來人背後揹著一個奇特的木筒，這木筒兩側狹窄，卻不甚長，造型古樸，看紋理和顏色當是紫檀所製。\n\
    「尊駕是？」\n來人雙手抱拳，略施一禮：「在下乃是筆塚主人，特來找先生煉筆。」「筆塚主人……煉筆……」老者喃喃自語，反復咀嚼這六個字，不解其意。\n「人有元神，詩有精魄。先生詩才豐沛，寄寓魂魄之間，如今若隨身而死，豈非可惜？在下欲將先生元神煉就成筆，收入筆塚永世留存。」筆塚主人淡淡說道，聲無起伏，似是在說一件平常之事。\n\
    老者聽罷歎道：「人死如燈滅，若能留得吉光片羽，卻也是美事。只是在下燈盡油枯，心有餘而力不足啊！」\n筆塚主人道：「才自心放，詩隨神抒，心不死，則詩才不滅。」老者聞之，不禁呵呵大笑，騰的一聲竟從床上坐起來，大聲道：「說得好，說得好，拿酒來！」\
    \                       \n～摘錄自馬伯庸《筆靈》"
