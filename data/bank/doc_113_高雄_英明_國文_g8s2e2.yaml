- id: doc_113_高雄_英明_國文_g8s2e2_s4_20
  section: 4
  number: 20
  type: single
  page: 2
  stem: 徐志摩在描寫康橋黃昏的美景時，不論是一大片金黃的麥浪，或是放草歸來的一大群羊，筆觸中皆呈現出一種數量眾多而壯闊的「數大之美」，試判讀下列選項中何者未使用相同的寫景手法？
  options:
  - label: A
    content: 太陽如一枚金幣，懸在很藍的空中，田園裡一朵燦黃如圓盤的向日葵，以極端崇拜讚美的神情仰望著它
  - label: B
    content: 成千上萬的椋鳥成群結隊地在天空中翱翔，彷彿變幻莫測的黑雲，不斷地成組成不同的隊形，此時只見「羽化」的大空，只聞萬鳥齊鳴的大聲
  - label: C
    content: 碧綠的山坡前幾千隻綿羊，挨成一片的雪絨，是美；一天的繁星，千萬隻閃亮的眼神，從無極的藍空中下窺大地，是美
  - label: D
    content: 海岸山脈的雲跟隨太平洋的風，翻山越嶺，翻過山頭，好像累了，突然像瀑布一樣，往下傾瀉流竄，洶湧澎湃，形成壯觀的雲瀑。
