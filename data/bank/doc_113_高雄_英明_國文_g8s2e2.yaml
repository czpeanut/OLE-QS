  group_stem: "【甲】\n    娶則視女子可室者，遣人遺瑪瑙珠雙，女子不受則已；受，夜造其家，不呼門，彈口琴挑之。女聞，納宿，未明徑去，不見女父母。迨產子女，婦始往婿家迎婿，如親迎，婿始見女父母。遂家其家，養女父母終身。故生女喜倍男，為女可繼嗣，男不足著代故也。\n\
