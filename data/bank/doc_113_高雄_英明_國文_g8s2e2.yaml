  stem: 文中的「玄祐」與王宙、倩娘等人的關係是什麼 ?
  options:
  - label: A
    content: 不認識，只是從王宙與倩娘的親戚口中聽聞故事的細節
  - label: B
    content: 不認識，但他和王宙與倩娘的兒子相識，曾經一起共事
  - label: C
    content: 認識，玄祐與他們是遠房親戚關係，知道他們曾經私奔
  - label: D
    content: 認識萊蕪縣令張仲規，介紹王宙與倩娘兩人給玄祐認識。
  group_stem: '天授三年，清河 張鎰，因官家於衡州。性簡靜，寡知友。無子，有女二人。其長早亡；幼女倩娘，端妍絕倫。鎰外甥太原 王宙，幼聰悟，美容範。

    鎰常器重，每曰：「他時當以倩娘妻(1)之。」後各長成。宙與倩娘常私感想于寤寐(2)，家人莫知其狀。後有賓僚(3)之選者求之，鎰許焉。女聞而鬱抑；宙亦深恚恨(4)。托以當調，請赴京，止之不可，遂厚遣之。宙陰恨悲慟，決別上船。

    日暮，至山郭數裏。夜方半，宙不寐，忽聞岸上有一人，行聲甚速，須臾至船。問之，乃倩娘徒行跣足(5)而至。宙驚喜發狂，執手問其從來。泣曰：「君厚意如此，寢食相感。今將奪我此志，又知君深情不易，思將殺身奉報，是以亡命來奔。」宙非意所望，欣躍特甚。遂匿倩娘于船，連夜遁去。

    倍道兼行(6)，數月至蜀。凡五年，生兩子，與鎰絕信。其妻常思父母，涕泣言曰：「吾曩日(7)不能相負，棄大義而來奔君。向今五年，恩慈間阻。覆載之下，胡顏獨存也？」宙哀之，曰：「將歸，無苦。」遂俱歸衡州。

    既至，宙獨身先鎰家，首謝(8)其事。鎰曰：「倩娘病在閨中數年，何其詭說也！」宙曰：「見在舟中！」鎰大驚，促使人驗之。果見倩娘在船中，顏色怡暢，訊使者曰：「大人安否？」家人異之，疾走報鎰。室中女聞，喜而起，飾妝更衣，笑而不語，出與相迎，翕然(9)而合為一體，其衣裳皆重。其家以事不正，秘之。惟親戚間有潛知之者。後四十年間，夫妻皆喪。二男並孝廉擢第，至丞、尉。

    玄祐少常聞此說，而多異同，或謂其虛。大曆末，遇萊蕪縣令張仲規，因備述其本末。鎰則仲規堂叔祖，而說極備悉，故記之。

    ～陳玄祐〈離魂記〉

    注釋：

    (1)妻：許配為妻，動詞。

    (2)寤寐：醒時睡時，指時時刻刻。

    (3)賓僚：賓客幕僚。

    (4)恚恨：憤恨、怨恨。恚，音ㄏㄨㄟˋ。

    (5)跣足：赤腳。跣，音ㄒㄧㄢˇ。

    (6)倍道兼行：加快速度，用一天的時間趕兩天的路程。

    (7)曩日：從前。曩，音ㄋㄤˇ。

    (8)謝：謝罪。

    (9)翕然：忽然。翕，音ㄒㄧˋ。'
