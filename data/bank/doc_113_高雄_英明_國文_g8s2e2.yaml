  section: 4
  number: 25
  type: single
  page: 3
  stem: "國文老師根據課本中的修辭，而設計了密室逃脫遊戲，只要學生解開密碼即可獲得寶藏。若依照謎題順序分析，寶藏的密碼應該是什麼？\n◆ 密碼代號：(1)譬喻\
    \  (2)回文  (3)轉化 \n◆ 尋寶謎題 \n➢ 晚景的溫存卻被我這樣偷嘗了不少。 \n➢ 有村舍處有佳蔭，有佳蔭處有村舍。 \n➢ 當樹根和土地戀愛後，需要水的灌溉和滋潤。\
