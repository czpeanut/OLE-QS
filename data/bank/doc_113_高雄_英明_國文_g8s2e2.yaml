  group_stem: "輕輕的我走了，正如我輕輕的來；\n我輕輕的招手，作別西天的雲彩。\n那河畔的金柳，是夕陽中的新娘；\n波光裡的豔影，在我的心頭蕩漾。\n\
    輭泥上的青荇，油油的在水底招搖：\n在康河的柔波裏，我甘心做一條水草！\n那榆蔭下的一潭，不是清泉，是天上虹\n揉碎在浮藻間，沉澱着彩虹似的夢。\n尋夢？撐一支長篙，向青草更青處漫溯，\n\
    滿載一船星輝，在星輝斑斕裏放歌。\n但我不能放歌，悄悄是別離的笙簫；\n夏蟲也為我沉默，沉默是今晚的康橋！\n悄悄的我走了，正如我悄悄的來；\n我揮一揮衣袖，不帶走一片雲彩。\n\
    \      ～徐志摩〈再別康橋〉"
