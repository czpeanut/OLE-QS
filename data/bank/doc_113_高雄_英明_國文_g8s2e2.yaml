- id: doc_113_高雄_英明_國文_g8s2e2_s5_11
  section: 5
  number: 11
  type: single
  page: 6
  stem: 依據文中科學家的觀點，哪項因素是影響身高的主要原因？
  options:
  - label: A
    content: 先天基因
  - label: B
    content: 維生素D
  - label: C
    content: 鈣質攝取
  - label: D
    content: 睡眠時間。
  group_stem: "主宰人類身高的關鍵因素是什麼？科學家研究認為影響身高的原因，有80%來自基因。至今已經辨識出700 多個基因和身高有關，其中一部分是影響骨骼中的生長板，另一部分則影響身體荷爾蒙的分泌，這些基因一起合力，最終決定了我們的身高表現。\n\
    \  關於長高，飲食是關鍵，因為長高需要足夠的營養素，充足的蛋白質、鈣質與維生素能幫助骨骼發育。發育中的孩童建議每天至少一小時的運動，包括阻力訓練、有氧運動等，能讓肌肉與骨骼的發育更加結實，並且維持正常體重，促進生長激素分泌。此外，研究顯示生長激素的分泌高峰在23\
    \ 點至凌晨1 點，以及清晨5 點至7 點。因此，足夠的睡眠時間可以顯著提升骨骼生長效率。\n  一篇跨國研究顯示，增加乳製品攝取能降低發育遲緩比例，喝牛奶的確可能對長高有幫助，但牛奶只是眾多因素之一。根據國民營養健康狀況變遷調查，除了1-3\
    \ 歲的幼兒外，其他年齡層的乳品攝取量都遠低於建議標準。然而，學童缺的不僅是牛奶當中的鈣，還有維生素 D。根據2008 年一篇回顧性的研究，維生素D 對身高發育與鈣質同等重要。如果鈣和維生素D\
    \ 攝取不足，會影響骨骼發育。不過，根據國民健康署的調查，7-18 歲的學童，鈣的攝取量平均不到建議量的一半，維生素D 的攝取量甚至只有四成多。這樣的營養狀況，怎麼能夠提供足夠骨骼發育的營養環境？\n\
    \  值得關注的是，這些營養缺口與乳品攝取不足有直接關聯。每份乳品大約含有240 毫升牛奶，其中含有240 毫克的鈣質及3 微克的維生素D。根據國民健康署採用的推薦膳食攝取量，每天需要的鈣質約為1000毫克，維生素D\
    \ 則是15 微克，如果每人每天攝取2 份乳品類，加上其他的飲食攝取，就有機會補足鈣與維生素D 的缺口。此外，牛奶中的鈣質容易被人體吸收，因為牛奶有三分之一的鈣是以游離態存在的，能夠直接被吸收，剩餘的鈣與酪蛋白結合，當人體消化酪蛋白時，這些鈣質也會被釋放，然後被人體吸收。事實上，人體對牛奶鈣質的吸收率遠高於其他食物。因此，想要補充鈣質，牛奶無疑是最佳選擇。\n\
    ～摘自南一出版〈來煲閱讀粥〉第223 期〈輸入長高密碼 想高人一等的你必須知道的幾件事〉"
