  page: 1
  stem: 下列文句中的詞語運用，何者不正確？
  options:
  - label: A
    content: 他因為音樂比賽失利，從此再也提不起勁練琴，猶如「伯牙絕弦」般任由琴藝生疏，自廢武功
  - label: B
    content: 雖然長輩的忠告聽起來太過嚴厲，但「信言不美」，我們應該虛心接受
  - label: C
    content: 動人的樂章自黑與白的琴鍵中流瀉而出，那旋律如「高山流水」，令人嘆為觀止
  - label: D
    content: 公司主管在選拔幹部時，一向秉持「疑人不用，用人不疑」的原則，以確保團隊的信任與效率。
