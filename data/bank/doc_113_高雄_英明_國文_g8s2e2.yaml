    「生者爲過客，死者為歸人。天地一逆旅，同悲萬古塵……」老者艱難地嚅動嘴唇輕吟，聲音雖然嘶啞，卻透著豁達，似乎全不把這當回事。他吟到興頭，右手徒勞地去抓枕邊酒壺，卻發現裡面已經滴酒不剩。\n\
    「古來聖賢皆寂寞，無酒寂寞，寂寞無酒哪……」老者望著天花板喃喃自語。倏然屋內似乎有些動靜，他費力地擰了擰脖子，偏過頭去看，但只看到臨窗桌上自己的詩囊和毛筆。屋內沉寂依然。\n\
    「或許是大限將至，眼花耳鳴了吧。」老者暗想，心中不無欷歔。這件詩囊和毛筆伴隨他多年，不知自己是否還有機會暢飲美酒，提筆賦詩。所幸自己歷年來積攢的詩稿已經託付給了叔叔李陽冰，倒也沒什麼遺憾。\n\
    老者輕拍空壺，心中只是感懷，卻無甚悲傷。\n一陣雷聲滾過，老者再看，發現桌旁赫然多出來一個人。這人身形頎長，一身烏黑色的長袍，頭戴峨冠，看打扮似是個讀書人，但面色枯槁卻有說不出的詭異。\n\
