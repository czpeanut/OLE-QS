  type: single
  page: 2
  stem: 徐志摩在我所知道的康橋一文中描寫「遠近的炊煙，成絲的、成縷的、成捲的……，彷彿是朝來人們的祈禱，參差地翳入了天聽。」這句話是以聽覺來描寫視覺印象，下列何者的寫作手法與之相同？
  options:
  - label: A
    content: 微風過處，送來縷縷清香，彷彿遠處高樓上渺茫的歌聲似的
  - label: B
    content: 我低下頭去喊自己的名字，井水也大聲應和，連那回聲都彷彿有淡淡的餘香
  - label: C
    content: 陽光好亮，透過葉隙叮叮噹噹擲下一大把金幣
  - label: D
    content: 那低咽的簫聲又傳來了，幽幽的，如同一隻到處漫遊的光焰微弱的螢火蟲，飛到她的心中。
