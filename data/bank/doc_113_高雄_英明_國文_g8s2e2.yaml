  type: single
  page: 1
  stem: 下列「」中的注音寫成國字後，何者字形前後相同？
  options:
  - label: A
    content: 歲月流轉，昔日繁華的城鎮如今已成一片灰「ㄘㄤ ㄘㄤ」的廢墟，令人不由得生發「ㄘㄤ」海桑田的慨嘆
  - label: B
    content: 舞臺上的燈光耀眼生輝，讓人感到迷「ㄒㄩㄢˋ」，而他正高舉雙手，「ㄒㄩㄢˋ」耀手中那座閃閃發光的獎盃
  - label: C
    content: 那位官員的種種決策就像買「ㄉㄨˊ」還珠般，本末倒置，最終因為「ㄉㄨˊ」職而遭到調查
  - label: D
    content: 這封充滿親情與回憶的手寫信對我而言「ㄇ一ˊ」足珍貴，多少「ㄇ一ˊ」補了我這異鄉遊子的思鄉情切。
