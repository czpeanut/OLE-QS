- id: doc_113_高雄_五福_自然_g8s1e2_s2_41
  section: 2
  number: 41
  type: calc
  page: 5
  stem: 請依照第一段文章中『反射者，光遇鏡而回，入角等出角也』所述內容作圖，須清楚標出入射角、反射角，以及以上兩個角度大小關係。(3 分) 注意:光線必須以箭頭標出前進方向，法線須以虛線表示。
  group_stem: '題組五: 為了增進學生的閱讀素養，體會古代文字美學，理化老師節錄了古籍中有關聲波與光學文章，請閱讀後依照題意作答。


    第一段:

    夫光者，世間萬物所依之明也。光行於直，遇物則返，遇水則曲。其返者，謂之反射；其曲者，謂之折射。反射者，光遇鏡而回，入角等出角也。折射者，光入水而折，水密故緩，故而曲焉。

    第二段:

    昔人試水盆置銅錢，少許退步，錢忽不見；若傾水入之，則錢現焉。此蓋折射之理，水令光改道，故現隱可見。由是觀之，光雖無形，然性有跡可循。水中之魚，因折光而見其淺，非魚之實在。水中之物，皆淺於實。今若竹竿入水，視之便短。池中之魚，淺水則見，深水則不可見。

    第三段:

    夫聲者，氣之激也。凡物相擊，則動於空，氣隨而振，乃生聲焉。聲之傳遠，依風順逆而異；天冷則清，天熱則昏。聲遇堅壁，則返其音，謂之回聲。聲遇水而緩，故傳不逾於岸。若遇空隙，則漸減其響，久而不聞矣。昔人立山谷間，呼而試之，聲如迴響。蓋山谷逼窄，聲無處散，故往返於耳際。由是觀之，聲之傳播，因空氣而振，遇物則返，遇水則阻，其理可循也。

    第四段:

    予友人家有一琵琶，置之虛室，以管色奏雙調，琵琶弦輒有聲應之，奏他調則不應，寶之以為異物。殊不知此乃常理。二十八調，但有聲同者即應；若遍二十八調而不應，則是逸調聲也


    註:

    兩頻率相同的發音體，其一發音體振動所發出的聲音，傳播至另一發音體時，此發音體亦隨之振動而發出聲音的現象，稱為共鳴或共振。'
