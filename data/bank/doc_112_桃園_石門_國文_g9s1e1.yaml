- id: doc_112_桃園_石門_國文_g9s1e1_s5_28
  section: 5
  number: 28
  type: single
  page: 5
  stem: 依照上文的敘述，下列何者最可能確診登革熱？
  options:
  - label: A
    content: 連續發燒10 天，且頭痛、咳嗽的依依
  - label: B
    content: 發高燒、頭痛、流鼻涕、咳嗽的玟玟
  - label: C
    content: 高燒、肌肉痠痛、眼窩疼痛、起紅疹的佑佑
  - label: D
    content: 發燒、流鼻涕，上個月才從南部畢旅回來的祥祥
  group_stem: '登革熱（英文 Dengue fever）是一種病毒引起的疾病，是由蚊子叮咬傳染給人類。

    登革熱症狀很多而且很容易跟許多疾病混淆。根據美國梅約診所的資料，常見的症狀有：頭痛、高燒、肌肉骨頭痠痛、噁心嘔吐、眼窩疼痛、起紅疹、躁動不安、嗜睡、肝臟或腺體腫大等。嚴重的登革熱會造成血管破裂、出血，血小板下降，可能造成休克、內出血、器官衰竭甚至死亡，死亡率高達20％。

    警示症狀通常在感染登革熱退燒後、約3～7 天，如果出現以下症狀就要注意：嚴重胃痛、持續嘔吐、牙齦出血或鼻子出血、血尿、血便或嘔吐物中帶血、皮下出血或容易瘀青、呼吸困難。

    登革熱跟許多感冒症狀雷同，根據資料顯示，有一些初步的分辨方式：

    1.居住在疫區或是從國外疫區回國，需觀察14 天。

    2.如果發燒另有流鼻涕、咳嗽，就可能不是登革熱。

    3.登革熱發燒一般會持續3～7 天，超過7 天就不太可能是登革熱。

    目前市面上共有5 款快篩試劑，由於NS1 抗原和抗原抗體測試片，具有高度的專一性，所以準確度高達9 成，一般建議可以在出現疑似症狀1～5 天內使用效果較準確。
    (改編自康健網站文章)'
