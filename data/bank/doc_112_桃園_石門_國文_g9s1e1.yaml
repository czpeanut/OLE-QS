- id: doc_112_桃園_石門_國文_g9s1e1_s4_17
  section: 4
  number: 17
  type: single
  page: 3
  stem: 黑與白――虎鯨一課中，作者在一開始的計畫遲滯，到出海後發現虎鯨、看到虎鯨與船互動時，皆有著不同的心情變化。下一列文句與作者心情的配對何者正確？
  options:
  - label: A
    content: 已經四十歲的年紀似乎越來越不堪任何的遲滯與延宕，不能再躑躅了：懷想思念
  - label: B
    content: 那是摻揉著興奮、惶恐……如山峰谷底樣的失控情緒─我們終於遇見大型鯨：喜出望外
  - label: C
    content: 即使牠們遠遠離去我也感覺和牠們之間已經絲線牽連，終生不渝：焦慮擔憂
  - label: D
    content: 牠們印在心底，無法抹滅的清明與黑白：感動不捨
  lesson_raw:
    title: 黑與白——虎鯨
    basis: 題目指明黑與白——虎鯨
- id: doc_112_桃園_石門_國文_g9s1e1_s4_18
  section: 4
  number: 18
  type: single
  page: 3
  stem: '「印第安人則在春天時卸下馬的蹄鐵，也不駕馬車出門，以免影響大地的胎氣。印第安人相信，春天是大

    地懷孕的季節，要避免馬的堅硬蹄鐵劇烈踩踏大地。」王家祥寫這段話的用意，最可能是下列何者？'
  options:
  - label: A
    content: 提醒印第安人駕馬車要小心
  - label: B
    content: 強調印地安人對春天生命的尊重
  - label: C
    content: 說明孕婦不應該駕馬車出門
  - label: D
    content: 指出堅硬蹄鐵會刺傷馬兒的腳掌
  lesson_raw:
    title: 春天的聲音
    basis: 引用春天的聲音課文（作者王家祥）
- id: doc_112_桃園_石門_國文_g9s1e1_s4_19
  section: 4
  number: 19
  type: single
  page: 3
  stem: 春天的聲音中作者提及泰國的禪坐大師阿姜查，教導弟子要學習「靜止的流水」的心境，根據本文內容所述，下列對於此種心境的描述，何者說明最正確？
  options:
  - label: A
    content: 停止思考，沉浸在心靈靜止的狀態
  - label: B
    content: 思考仍持續進行，但心靈靜止的狀態
  - label: C
    content: 使自己與外界斷絕聯繫，維持心靈清明
  - label: D
    content: 由旁人指引，得出對於生命的體悟與智慧
  lesson_raw:
    title: 春天的聲音
    basis: 題目指明春天的聲音
- id: doc_112_桃園_石門_國文_g9s1e1_s4_20
  section: 4
  number: 20
  type: single
  page: 3
  stem: 「生命發生的聲音有些是聽不見，卻看得見的。」根據本文，下列何者屬於看得見的聲音？
  options:
  - label: A
    content: 鳥叫蟲鳴
  - label: B
    content: 潺潺流水聲
  - label: C
    content: 植物的生長
  - label: D
    content: 馬蹄的聲音
  lesson_raw:
    title: 春天的聲音
    basis: 引用春天的聲音課文原句
