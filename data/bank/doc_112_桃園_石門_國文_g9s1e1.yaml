  section: 4
  number: 11
  type: single
  page: 2
  stem: 下列關於武陵春與南鄉子的內容比較，何者說明最正確？
  options:
  - label: A
    content: 武陵春、南鄉子是詞牌，用來說明詞的內容
  - label: B
    content: 兩首詞作都使用大量的典故來描寫自身情感
  - label: C
