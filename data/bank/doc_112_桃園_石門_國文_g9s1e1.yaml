    content: 男女之間的感情
  - label: B
    content: 想要隱居的心情
  - label: C
    content: 遊子在外的鄉愁
  - label: D
    content: 思念故國的心境
  group_stem: '(一)無言獨上西樓，月如鉤。寂寞梧桐深院鎖清秋。 剪不斷，理還亂，是離愁。別是一般滋味在心頭。(相見歡 李煜)

