- id: doc_112_桃園_石門_國文_g9s1e1_s4_8
  section: 4
  number: 8
  type: single
  page: 2
  stem: 關於「詞」的敘述，下列何者正確？
  options:
  - label: A
    content: 平仄、句數、字數等格律限制嚴格，依詞牌而定
  - label: B
    content: 承襲樂府詩的遺風，因此詞又可以叫做「詩餘」
  - label: C
    content: 按整首詞的字數的多寡可分小令、中調、大調
  - label: D
    content: 詞的內容要依詞牌名而作，因此不必有「題目」
