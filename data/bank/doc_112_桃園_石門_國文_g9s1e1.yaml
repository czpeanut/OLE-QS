  - label: C
    content: 描述出航在海上看到已復育鯨豚的感受到喜悅
  - label: D
    content: 描寫虎鯨與船隻的互動及其黑與白對作者的影響
  lesson_raw:
    title: 黑與白——虎鯨
    basis: 題目指明黑與白——虎鯨
