- id: doc_112_桃園_石門_國文_g9s1e1_s5_26
  section: 5
  number: 26
  type: single
  page: 4
  stem: 有關鬼頭刀一文敘述，下列何者正確？
  options:
  - label: A
    content: 作者自認運氣極佳，竟然同時釣到公魚、母魚
  - label: B
    content: 作者知道新的捕魚技術，能同時捕捉多條鬼頭刀
  - label: C
    content: 公魚見母魚被捕而一路跟隨，遲遲不忍離去
  - label: D
    content: 一次捕到兩條魚是稀鬆平常的事
  group_stem: '船長喚我，去將船尾上鉤的魚給拉上來。

    舷尾板就定位後，拉繩在手，我看見是兩條魚一起躍出海面，而且，兩條魚頭貼著頭、身體貼著身體，無比親密地幾乎二合一，一起在水面上摔打。

    我揉了揉眼睛，以為閃光看走了眼，不然，會不會是一個鉤子同時鉤住了兩條魚？

    拉靠近點，確定是兩條魚沒錯，而且我發現，上鉤的只是其中一條，另一條完全自由，只是陪著上鉤的魚一路騰躍。

    再拉靠近些，看得更清楚了，上鉤的是條母魚，而一路陪著的是一條公魚。

    如老船長說的：「這種魚有感情，公魚會照顧母魚，看見食物的時候，公魚會禮讓給母魚。」

    當下，我心底響著一句話：「啊，萬物皆有情。」 廖鴻基 鬼頭刀（節錄）'
