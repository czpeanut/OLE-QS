- id: doc_112_桃園_石門_國文_g9s1e1_s4_12
  section: 4
  number: 12
  type: single
  page: 2
  stem: 詞在風格上大致可分為「婉約派」與「豪放派」，請根據下列詞句的內容判斷，何者的風格與其他三者不同？
  options:
  - label: A
    content: 醉裡挑燈看劍，夢回吹角連營。八百里分麾下炙，五十弦翻塞外聲，沙場秋點兵
  - label: B
    content: 大江東去，浪淘盡，千古風流人物。……亂石崩雲，驚濤裂岸，捲起千堆雪
  - label: C
    content: 莫聽穿林打葉聲，何妨吟嘯且徐行。竹杖芒鞋輕勝馬，誰怕？一蓑煙雨任平生
  - label: D
    content: 花自飄零水自流。一種相思，兩處閒愁。此情無計可消除，才下眉頭，卻上心頭
- id: doc_112_桃園_石門_國文_g9s1e1_s4_13
  section: 4
  number: 13
  type: single
  page: 2
  stem: 「過去遭遇的其他種鯨豚，總要歷經試探、確認的過程後才肯以這樣近切的距離和我們接觸。虎鯨豪爽地省略了觀望的過程，不計後果地、直剌剌地和我們相擁相會。」根據前文，廖鴻基過去在海上所遇其他鯨豚與虎鯨的經驗，下列何者說明正確？
  options:
  - label: A
    content: 前者單觀望不敢親近；後者先試探再親近
  - label: B
    content: 前者觀望後才接近；後者大方直接的接觸
  - label: C
    content: 前者直接的親近人類；後者觀望不敢向前
  - label: D
    content: 前者可以近距離接觸；後者的警戒心較重
  lesson_raw:
    title: 黑與白——虎鯨
    basis: 引用廖鴻基黑與白——虎鯨課文
- id: doc_112_桃園_石門_國文_g9s1e1_s4_14
