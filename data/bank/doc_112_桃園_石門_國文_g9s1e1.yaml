- id: doc_112_桃園_石門_國文_g9s1e1_s4_24
  section: 4
  number: 24
  type: single
  page: 4
  stem: '那夜，我夢見母親。母親立於原野。背了落日、古道、竹裡人家、炊烟、遠 山和大江，仰望與原野同樣遼闊的天極，

    甲、古道隱迹，遠山墜入蒼茫

    乙、線繞子纏繞的是她白髮絲絲啊

    丙、母親手中緊握住那線繞子

    丁、頃刻大風起兮，炊烟散逝，落日沒地

    戊、碧海青空中，有一只風箏如鯨，載浮載沉

    而江聲也淹過了母親的話語……母親的形象漸退了。（莊因 母親的手）依據文意，甲、乙、丙、丁、戊排列順序最適當的是：'
  options:
