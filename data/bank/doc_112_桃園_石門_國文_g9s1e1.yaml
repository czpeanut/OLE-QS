  - label: D
    content: 用道理說服嫌犯，使嫌犯自首
  group_stem: '張舉，吳人也，為句章令。邑有妻殺夫者，因放火燒舍，稱火燒夫死。夫家疑之，訟於官。妻不服。舉乃取豬二口：一殺之，一活之，而積薪焚之，活者口中有灰，殺者口中無灰。因驗屍，口果無灰也。鞠①之服罪。

