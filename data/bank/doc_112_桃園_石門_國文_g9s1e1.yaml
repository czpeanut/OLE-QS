  section: 4
  number: 1
  type: single
  page: 1
  stem: 下列「」中的詞語，何者詞義前後相同？
  options:
  - label: A
    content: 他風度「翩翩」／蝴蝶「翩翩」起舞
  - label: B
    content: 聞說雙溪春「尚」好／你們「尚」未畢業
  - label: C
    content: 一個黑白「分明」的答案／他「分明」還是個學生
  - label: D
    content: 很難吐露胸腔內「橫」溢的感觸／天上飛來「橫」禍
- id: doc_112_桃園_石門_國文_g9s1e1_s4_2
  section: 4
  number: 2
  type: single
  page: 1
  stem: 請問下列文句，何者用字完全正確？
  options:
  - label: A
    content: 瀑布的水傾洩而出，如千軍萬馬奔騰
  - label: B
    content: 辛棄疾的詞風豪邁，流漏出濃濃的愛國情操
  - label: C
    content: 他的性格大剌剌的，做事完全不故忌別人的感受
  - label: D
    content: 在喧嘩的大城市裡，難得有這樣靜謐的空間可供人休憩
- id: doc_112_桃園_石門_國文_g9s1e1_s4_3
  section: 4
  number: 3
  type: single
  page: 1
  stem: 「森森青翠的深處，是誰／私藏了這一泓明媚／只讓童話來投影／不許世界偷窺」關於此段詩句的說明，下列何者敘述正確？
  options:
  - label: A
    content: 「私藏」暗指水庫的地點隱密無法和外人說
  - label: B
    content: 「童話來投影」描述水庫如夢似幻的原始美
  - label: C
    content: 「不許世界偷窺」可以知道水庫擁有者很霸道
  - label: D
    content: 「森森青翠的深處」可見水庫景觀充滿了童趣
  lesson_raw:
    title: 苗栗明德水庫
    basis: 引用苗栗明德水庫詩句
- id: doc_112_桃園_石門_國文_g9s1e1_s4_4
  section: 4
  number: 4
  type: single
  page: 1
  stem: 關於苗栗明德水庫一詩的說明，何者正確？
  options:
  - label: A
    content: 透過單字成行，具象地表現白鷺鷥橫渡水面的情景
  - label: B
    content: 用吊橋象徵人為的破壞，抨擊世人環保意識的低落
  - label: C
    content: 全文使用譬喻的手法，描述出水庫環境的靜謐與美好
  - label: D
    content: 表現出森林安靜的氛圍及作者反對在此建水庫的想法
  lesson_raw:
    title: 苗栗明德水庫
    basis: 題目指明苗栗明德水庫
