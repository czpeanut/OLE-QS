    當肥皂分子溶於水時，它們會排列成微胞，由肥皂分子組成的球形團塊。肥皂分子親水端的頭部在外側；親油端的尾部在內側，可溶解脂質。當肥皂微胞遇到冠狀病毒時，肥皂分子的親油端的尾部會被病毒的脂質外鞘吸引使之插入病毒外鞘，導致病毒瓦解。


    酒精之所以能殺病毒，主要是因為酒精有使病毒蛋白質凝固變性的能力。當病毒接觸到高濃度(90~95%)酒精時，表層蛋白質會迅速變質凝固，使病毒內部與外界完全隔絕。但酒精無法深入病毒內部發揮作用，因此一段時間後，病毒會再生成新的蛋白恢復機能，再度復活，因此
    95%酒精殺病毒的效率較差。75%酒精不會導致上述隔絕作用。75%酒精能順利進入病毒內部，並作用於內部的蛋白質使其凝固，完全喪失新陳代謝功能，達到殺死病毒的目的。但是當酒精濃度低於
