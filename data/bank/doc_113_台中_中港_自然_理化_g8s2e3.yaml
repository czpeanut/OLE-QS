- id: doc_113_台中_中港_自然_理化_g8s2e3_s1_33
  section: 1
  number: 33
  type: single
  page: 5
  stem: 水井深度超過 10 公尺左右，手動抽水機就無法抽出水，主要為何種因素影響造成？
  options:
  - label: A
    content: 大氣壓力太小
  - label: B
    content: 10 公尺水的下方形成了真空
  - label: C
    content: 水井內的液體體積太小
  - label: D
    content: 液體在抽水機中的摩擦力太大。
  group_stem: '【33-35 為題組】 第一個製造出的「真空」


    16 世紀時，普遍使用手動抽水機來處理挖礦的排水或抽取地下水，當時抽水機內的空氣抽出後，外部的空氣就能將水往上推進抽水機，但若是井深地面超過 10 公尺左右就無法抽水（圖
    1）


    西元 1643 年，托里切利為了解決這個問題，進行了一個實驗，他製造一支約一公尺長的玻璃管，將一端管口密封後，用密度約為 $13.6\text{ g/cm}^{3}$
    的水銀裝滿玻璃管，再將管子垂直插入一個裝滿水銀的盆子，此時水銀柱降到約高 76 公分處，留下水銀上方的真空就稱為托里切利真空。


    後來人們發現水銀柱的高度會隨天氣變化改變，可測得當時氣壓的高低，所以托里切利的裝置又稱為氣壓計，現今使用的氣壓單位之一「托（Torr）」就是為了紀念他而命名。


    註：1 Torr 近似於 1 mmHg'
