  group_stem: "※以色列1948 年建國的國歌歌詞唱道：「回到錫安和耶路撒冷的土地，在我們自己的土地上成為自由的民族」，耶路撒冷一直是以色列信仰的中心和最神聖的城市。不過同時，拋去宗教色彩的話，該城本身就具有軍事要塞的戰略意義，大衛王當年選擇定都於此就有此考量。在聯合國最初的以巴分治方案中，以色列所分到的多為沿海平原和南方沙漠，巴勒斯坦則擁有制高點的中央山脈以及肥沃的約旦河谷，一旦巴勒斯坦居高臨下發射火箭，就可以輕易擊中特拉維夫機場等重要資產，缺乏戰略縱深、三面被穆斯林包圍的以色列則很難建立防禦體系。\n\
    \  基督徒也相當重視耶路撒冷，因為根據《聖經》記載，耶穌在這裡受難、埋葬、復活、升天。伊斯蘭教亦將耶路撒冷列為麥加、麥地那之後的第三聖地，以紀念穆罕默德的夜行登霄。\n\
    今天的耶路撒冷，是一個對比強烈的城市。不同文化、不同宗教、不同民族、社會不同階層，同處一城；城市的東西兩部分截然不同，發展水平懸殊，請問8~13 題："
