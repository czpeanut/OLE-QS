- id: doc_111_嘉義_北興_社會_地理_g8s2e2_s1_42
  section: 1
  number: 42
  type: single
  page: 4
  stem: 西亞為右圖三大宗教發源地，但內部教派的差異也是武裝衝突的原因之一，在政府和氣候都一團糟的國家，更容易有宗教極端主義與犯罪孳生。請問：「丙」宗教應為下列哪一種？
  options:
  - label: A
    content: 伊斯蘭教
  - label: B
    content: 基督教
  - label: C
    content: 印度教
  - label: D
    content: 猶太教。
  group_stem: '※《經濟學人》（The Economist）分析， 近3 年全球需要緊急援助的人數翻了一倍，達到3.4 億，據非政府組織「國際救援委員會」（IRC）估計，約80％是由衝突導致。此外，同時遭受多場戰爭或軍事衝突的國家近年也變多了，2001
    年到2010 年平均每年5 個國家陷入此境地，現在卻有多達15 個國家飽受衝突摧殘。相較於俄羅斯企圖征服烏克蘭，大多數現代武裝衝突都更加複雜難解，這些衝突通常是內戰、有外國勢力干涉，主要發生在貧窮又面臨氣候危機的國家，例如北非近日再度爆發血腥內戰的蘇丹。

    芝加哥大學經濟學專家布拉特曼（Christopher Blattman）在《我們為何而戰》（Why We Fight）一書中估計，一場典型的5 年內戰會使國家人民的平均收入減少20％。戰爭使國家陷入貧窮、犯罪、飢餓、疾病的惡性循環，讓更多人民流離失所，據聯合國難民署3
    月底估計，全球難民人數已突破1 億大關。

    《經濟學人》指出，現代軍事衝突變得更難調解有幾個原因。首先，國際法規範逐漸被破壞。聯合國安理會常任理事國俄羅斯公然違反聯合國憲章，入侵烏克蘭、殺害平民和綁架兒童；另一常任理事國中國仍稱被控犯有戰爭罪的普京為「親愛的朋友」──這證實了對某些世界大國來說，「強權就是正義」，也讓地區惡霸更敢為所欲為。例如在蘇丹，幾乎沒有人就戰爭大規模屠殺、奴役，向獨裁者追究責任。獨攬大權近30
    年的獨裁者巴希爾（Omar al-Bashir）2019 年被推翻下台，換來的不是民主，而是軍頭掌權和軍閥內鬥。蘇丹政府軍總司令布爾漢（Abdel Fattah
    al-Burhan）、準軍事武裝團體「快速支援部隊」（RSF）指揮官達加洛（Mohamed Hamdan Daglo）互相爭奪權力數週後，15 日清晨開始暴力相向，在首都喀土穆（Khartoum）等多個城市展開激烈武裝衝突。請問40~45
    題：'
