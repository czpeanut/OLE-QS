- id: doc_113_新北_江翠_社會_g9s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 根據你所學判斷，我們該如何解釋法語、波蘭語、俄語、希伯來語等，稱呼火雞為「來自印度的雞」較為合理？
  options:
  - label: A
    content: 鄂圖曼土耳其商人自印度引進該異獸，作為王公貴族觀賞之用
  - label: B
    content: 達伽馬開通新航路成功抵達印度，帶回新物種
  - label: C
    content: 當年哥倫布宣稱從印度歸來，並引進此種珍禽
  - label: D
    content: 麥哲倫船隊繞行地球一圈後，自菲律賓引進。
  group_stem: "火雞跟土耳其到底是什麼關係？英文裡，「火雞」叫做「turkey」，跟「土耳其」的國名一樣，目前常見的說法認為：15世紀時土耳其販子把一種漠南非洲的原生種「珠雞」賣到歐洲，歐洲人就稱「珠雞」為「turkey」，意指「來自土耳其的雞」。然後到了16世紀大西洋交易逐漸發展起來，歐洲人又將引進歐洲的「北美火雞」與「珠雞」搞混，於是誤稱「北美火雞」為「turkey」。\n\
    \    可是究竟是因為歐洲人搞混，或是其他原因，各家說法不一。更有趣的，土耳其語的「火雞」竟然叫做「hindi」，就是「來自印度」的意思！而且不只土耳其語如此，還有很多其他語言，像法語：dinde；波蘭語：indyk；俄語：indejka；希伯來語：indik，稱呼火雞為「來自印度的雞」。\n\
    \    另外還有葡萄牙語火雞叫做「peru (秘魯)」，荷蘭語火雞叫「kalkoen(意為卡利卡特的雞，卡利卡特為印度當時的商業中心)」等其他不同稱呼。有關火雞和其名稱的由來，眾說紛紜，不容易理清，可是有一點可以確定的是：「火雞」的原生地怎麼樣也不是土耳其，也不是印度，而是北美洲！"
  tags:
