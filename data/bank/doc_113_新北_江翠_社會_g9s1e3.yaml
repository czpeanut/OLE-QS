  stem: 文中的外國征服者因大量開採美洲白銀，最終成為16 世紀歐洲的富強國家。請問是指哪個國家？
  options:
  - label: A
    content: 西班牙
  - label: B
    content: 英國
  - label: C
    content: 荷蘭
  - label: D
    content: 法國。
  group_stem: "外國征服者的到來，破壞了舊有的一切。美洲原住民從原本的七千萬人以上，一個半世紀後便剩下約三百五十萬人。除了傳染病外，征服者將這些原住民遷徙去做各種苦工。觀察者曾寫道：「挖掘銀礦的礦坑，裡面用汞來提煉白銀，產生的毒氣讓他們頭髮、牙齒脫落，控制不住的發抖，最後只能在地上匍匐乞討，一般撐不了四年就會死亡。」這些原住民最終成為奴隸，被拋到礦井中從事粗重、累垮人的挖掘勞動而死。\n\
    \    除了銀礦之外，美洲熱帶地區的蔗糖也加速累積英國、法國、荷蘭等地發展工業所需要的資金。由於美洲原住民的大量死亡，歐洲各國紛紛至非洲買賣黑奴，運送至美洲，提供美洲生產蔗糖所需人力。由於從歐洲出發去美洲的貿易商船都是帆船，帆船須乘風而航，往往先南下至北緯30度的非洲副熱帶高壓地區，買賣完黑奴後，再藉著「貿易風(Trade\
    \ wind)」遠洋航行到接近赤道的南美洲。回程時，滿載蔗糖的船則先駛向北美洲，再乘著更高緯度的風返回歐洲。這些銷售至歐洲的蔗糖替商人賺進了巨額的財富，使得工業革命的各種改良成為可能，瓦特的蒸汽機改良便得到這些商人的贊助。\n\
    \    有人說：拉丁美洲的血液就在血管被切斷下，不斷的外流，這些血液的養分讓今日發達的國家發展起來，但血液外流的拉丁美洲也就此變得更落魄。"
