  group_stem: "南韓近期出現一個新造詞：토스트아웃，是由英文 Toast 與 Burnout 二詞結合的音譯，通常用於職場人員，尤其在千禧世代、Z 世代的上班族中最常見。社群媒體上出現各式各樣烤得金黃微焦的吐司圖片，再配上一段「雖然最近處於#토스트아웃，但想到明天是週五還能堅持撐下去」的文字，帶起一股曬烤吐司迷因的流行旋風。什麼是토스트아웃（Toastout）呢？不是早餐店老闆問你帥哥美女吐司要不要烤，而是將吐司比喻為人們身心能量完全喪失的倦怠症候群（Burnout）前兆，就像吐司在烤到焦黑成炭之前，外表正處於金黃微焦而內軟，彷彿人們身體與精神疲勞至極的狀態\n\
    \    倦怠症候群（Burnout）在 2019 年被世界衛生組織（WHO）正式認定為一種工作相關的健康問題，因為長期、慢性的工作壓力未獲得適當管理而引發的狀態；在瑞典等部份歐洲國家，也被認為是一種允許有薪病假的疾病……\n\
    \n                                               (2024/10/11 地球圖輯隊)"
