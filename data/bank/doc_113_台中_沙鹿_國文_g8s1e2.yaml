- id: doc_113_台中_沙鹿_國文_g8s1e2_s4_12
  section: 4
  number: 12
  type: single
  page: 1
  stem: 關於我在圖書館的一天一文，下列敘述何者<u>有誤</u>？
  options:
  - label: A
    content: 「一座開會呼吸的圖書館，有著會讀書的椅子」，以譬喻手法揭示此圖書館的不平凡之處，透露出該館是一座「綠建築」的訊息
  - label: B
    content: 「圖書館本來『書』最大，但北投分館卻讓所有的自然也成了『書』，將閱讀風景延伸至天地。」這句話意近「枝頭好鳥亦朋友，落花水面皆文章。」
  - label: C
    content: 「北投分館就像是三位一體的圖書館：具有『女巫、樹屋與靈屋』之綜合體。」寫出北投圖書館兼融自然與人文的特色
  - label: D
    content: 「前來的學生大都帶著學校的教科書來做功課，也因此圖書館美則美矣，書卻顯得寂寞。」此句表達出館內藏書乏人問津的惋惜，有「入寶山而空手回」的感慨。
