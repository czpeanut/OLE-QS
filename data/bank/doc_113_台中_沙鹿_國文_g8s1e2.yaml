  - label: A
    content: 參加的人有志摩和雙親，及叔薇兩兄弟
  - label: B
    content: 這是他們一次稱意的活動
  - label: C
    content: 作者曾買菱吃
  - label: D
    content: 作者揀過紅葉。
  group_stem: '這一時生活的態度驟然改變了，雖則不能說是從憂愁變到快樂，至少卻也是從沉悶轉成活潑。最初是父親自己也悶慌了，有一天居然把那隻遊船收拾乾淨，找了叔薇兄弟等一群人，一直開到東山背後，過榆橋轉到橫頭景橋，末了還看了電燈廠才回家。那天很快樂！塔影河的兩岸，居然被我尋出了一兩片經霜的楓葉。我從水面上撈到了兩片，不曾紅透的，但著色明淨得可愛。尋紅葉是一件韻事，去菱塘買菱吃，又是一件趣事。那鉢盂峰的下面，都是菱塘，我們船過時，見鮮翠的菱塘裡，有人坐著圓圓的菱桶在採摘。我們就嚷著買菱。買了一桌子的菱，青的紅的，滿滿的一桌子。「樹頭鮮」真是好吃，怪不得人家這麼說。我選了幾隻嫩青的，帶回家給媽吃，她也說好了。

    （徐志摩志摩日記）'
