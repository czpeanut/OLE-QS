- id: doc_113_台中_沙鹿_國文_g8s1e2_s4_14
  section: 4
  number: 14
  type: single
  page: 1
  stem: 「人和書很近也很遠。近的是，書隨意可得；遠的是，美麗的風景常讓我分心，因而忘書。」根據這段文字，下列敘述何者正確？
  options:
  - label: A
    content: 人和書的距離遙遠，是因為被風景吸引而分心，忘了讀書
