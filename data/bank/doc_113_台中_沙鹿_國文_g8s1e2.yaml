  - label: C
    content: 蘇迪勒颱風近中心最大風速每小時 183 公里，屬強烈颱風
  - label: D
    content: 根據右列圖表，在母親節發生颱風的機率大於父親節。
  group_stem: "●颱風是臺灣常見的天候現象，以下是有關颱風的詩作與相關資訊，請閱讀後回答問題。\n威力十足的颱風\n把六百公里的風雨摟成一球，海要遠征狂飆的中心\n\
    藏著慈祥透明的眼睛要耍孔武有力，總是摟著恨，\n不憚千里狠狠一擊，大海對大陸，流動對不流動\n靈對肉，千軍萬馬地咆哮、踐踏……\n（白靈颱風）\n 颱風與颶風都是海面上的熱帶氣旋，為熱帶海洋上的低氣壓所產生的一種非常猛烈的風暴。形成於北太平洋西部及南海者稱為「颱風」，而在大西洋西部、北太平洋東部發生的就稱為「颶風」。\n\
    \ 每年夏、秋兩季，常會有「颱風」來臺灣報到，狂風暴雨帶來可怕的災害，讓人聞「颱」色變。強風會吹倒房舍、吹斷電線，甚至將路樹連根拔起，如民國 104 年颱風蘇迪勒，風力強勁，近中心最大風速每秒\
    \ 58 公尺，相當於 17 級風，吹倒全臺數萬棵路樹，還因此壓損電桿、電線等電力設施，導致逾 400 萬戶停電，換句話說，全臺將近三分之一的民眾都曾感受到風災帶來的黑暗。\n\
    \ 颱風挾帶的強大雨勢，更會造成毀滅性的災害，如民國 98 年中度颱風莫拉克帶來豪大雨，兩日降雨量多達兩千多毫米，幾乎等於全年的降雨量，不僅使臺東知名的金帥溫泉大飯店地基被淘空，倒入知本溪中；高雄小林村更因土石流而造成全村\
    \ 474 人被活埋的慘劇。\n 面對來勢洶洶的颱風，我們不能掉以輕心，氣象局發布警報前後，要注意電視、廣播、網路或利用「166」、「167」氣象錄音電話，掌握颱風最新動向。在颱風登陸前，可先做好儲水、存糧的準備，此時千萬不要貿然登山或到海邊觀浪，並要記得把房屋內外的懸吊物取下或固定，避免到時被颱風吹落，成了傷人利器。唯有做好防颱準備，才能將造成的傷害降到最低。\n\
    颱風眼\n 它是颱風的中心區域，平均直徑約 45 公里，小的為 10～20 公里，大的可達 100～200 公里。因為其外圍空氣旋轉得太厲害，使外面的空氣不易進到颱風眼中，所以它就好像一根孤立的空心大管子，裡面不流動、不旋轉，也就沒有風了。\n\
    暴風半徑\n 颱風眼到暴風圈外圍的距離。暴風圈的半徑平均約 200～300 公里，大者可達 400～500 公里。\n暴風圈\n 越靠近颱風眼，風力就越強，往外風力逐漸遞減，達到平均風力七級的圓周範圍即稱為暴風圈。"
