  - label: D
    content: 蛋白質、脂質、維生素、礦物質、水。
  group_stem: "★題組2─請閱讀下列文章敘述後，回答43-46 題\n    雞蛋是優良飲食蛋白質來源，所謂「優良」是指構成雞蛋蛋白質中的必需胺基酸佔比，與人體蛋白質結構中必需胺基酸佔比相當接近，由於人體無法自行合成這些胺基酸，所以必須由食物提供其來源，而雞蛋的蛋白質是最佳選擇之一。雞蛋中除了蛋白和卵黃都富含的蛋白質之外，蛋白還是維生素B$_{2}$、B$_{3}$和礦物質鉀、鎂、銅的豐富來源。卵黃則含有較多脂肪和必需脂肪酸，也是膽固醇、卵磷脂、脂溶性維生素A、D\
    \ 和E 的來源，還含有豐富的水溶性維生素B 群及礦物質鉀、鈣、鎂、鐵、鋅和磷。\n    根據衛福部食藥署分析市面上雞蛋營養成分，一顆雞蛋在去除蛋殼並混合卵黃與蛋白後平均淨重約55\
    \ 克。混合的蛋白和卵黃經分析，每100 公克平均含有水分75 公克，碳水化合物1.3 公克（主要在卵黃），脂肪8.6 公克（主要在卵黃）及蛋白質12.5\
    \ 公克（蛋白和卵黃均含有）。\n    市面上販售的雞蛋種類包括：白殼蛋、紅殼蛋、土雞蛋、初卵蛋、特殊營養強化蛋（例：高葉黃素、高維生素A和E）。另外，還有強調有機、自然放牧的生鮮蛋品。卵黃的顏色從淺黃色到深橘色都有，農委會指出，造成卵黃差異的原因除受遺傳（品種）影響外，主要與飼料中所含色素成分多寡有關。從營養價值的角度而言，除了透過飼料提升特定脂肪酸或脂溶性維生素等營養素含量的雞蛋之外，只要是雞隻健康狀態良好，各種名目的雞蛋，其營養價值，特別是蛋白質和脂肪含量其實大同小異。"
