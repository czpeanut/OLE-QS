  stem: 小諾中秋節與家人參加台南市某區觀光行程，過程中享受當地特產-柚子，導遊介紹該地區歷史提到：十七世紀前期，這個地區的部落不滿荷蘭人，趁機殺害荷蘭士兵，導致荷蘭人率兵攻打，迫使該部落兵敗而接受荷蘭人統治。請問該部落為下列何者？
  options:
  - label: A
    content: 新港社
  - label: B
    content: 麻豆社
  - label: C
    content: 阿美族
  - label: D
    content: 卑南族。
