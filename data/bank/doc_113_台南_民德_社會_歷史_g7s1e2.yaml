- id: doc_113_台南_民德_社會_歷史_g7s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 重修台灣縣志記載：「客頭夥同不肖船家，用濕漏小船載運數百人，並讓他們全擠入艙中，將艙蓋封釘，不讓這些人出來。船隻趁著黑夜出洋，若遇到大風浪，可能會船翻人亡。快到岸時，擔心被人發現，因此靠近沙岸時，就會將人群趕下船，稱為「放生」」。這段紀載描述哪一歷史情景？
  options:
  - label: A
    content: 外國屢次侵擾，使台灣社會動盪不安。
  - label: B
    content: 移民來台普遍出現拋妻棄子的情形。
  - label: C
    content: 因為海禁政策，導致走私貿易興盛。
  - label: D
    content: 移民偷渡過程困難且危險重重。
