  section: 1
  number: 3
  type: single
  page: 1
  stem: 小逸參加話劇社，要寫一部十六世紀台灣原住民生活的歷史劇本，請問：下列哪項資料會出現在劇本內？
  options:
  - label: A
    content: 原住民以文字記錄族群歷史，讓族人了解族群文化。
  - label: B
    content: 鹿皮為重要出口物資，大量捕殺野生鹿，導致野生鹿絕跡。
  - label: C
    content: 採取游耕方式，種植小米、芋頭等作物。
  - label: D
    content: 建立高山國，向日本進貢，抵抗中國入侵。
