- id: doc_113_台南_民德_社會_歷史_g7s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '荷人來臺前，就有漢人到臺灣，與原住民進行買賣。但荷人來台後，企圖獨佔貿易，引發漢人不滿，煽動原住民抵抗。因此荷蘭人設計贌社制度，允許漢人繳納稅金，即可到部落貿易。

    請問：漢人以日用品，換取部落的哪項物資，再轉賣給荷蘭聯合東印度公司？'
  options:
  - label: A
    content: 鐵器
  - label: B
    content: 鹿皮
  - label: C
    content: 茶葉
  - label: D
    content: 樟腦。
