  section: 1
  number: 4
  type: single
  page: 1
  stem: '以下是十七世紀台灣部落青年的對話：

    尤哈尼：聽說趕走荷蘭人的漢人很厲害，希望不會影響我們的生活。

    打赫史：這些士兵四處拓墾，快要逼近我們的統轄範圍了。

    請問：趕走荷蘭人的漢人為下列何者？'
  options:
  - label: A
    content: 顏思齊
  - label: B
    content: 鄭芝龍
  - label: C
    content: 鄭成功
  - label: D
    content: 鄭經。
