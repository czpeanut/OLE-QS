  stem: 承風參觀六堆客家園區時，向導覽員詢問「六堆」的由來，導覽員說：「『六堆』是屏東地區客家人組成的義勇軍，抵抗發生於康熙六十年的○○之亂，此人原在※※縣(今日高雄市內門區)養鴨為生，故被稱為『鴨母王』，因當地知縣對百姓橫征暴歛，百姓不堪長期欺壓，故眾人推此人為盟主，起兵反清，此人姓氏與明朝國姓相同，更能號召民心。而『六堆』的出堆除保衛家園外，並協助清朝平定亂事」。請問：文中○○、※※為下列何組答案？
