  group_stem: "This is Ken’s writing for his English writing class:\n  Do you collect\
    \ something as a hobby? All my family do. My father collects coins. He always\
    \ says that it is a good way to learn history from coins because they usually\
    \ have important people or buildings of that country on them. And this is why\
    \ he has loved and been good at history since he was in elementary school. Some\
    \ of Dad’s collections are from Grandfather. They are ancient and special, bigger\
    \ and with square holes in them. Some of his collections come from the countries\
    \ he has been to, and some are from his friends. My mother collects stamps. In\
    \ her eyes, each stamp is like a piece of artwork. She always wears gloves when\
    \ touching them. Like Dad, she has got her stamps from her trips abroad or her\
    \ friends. As for me, I collect toy cars. I have been crazy about cars since I\
    \ was three. To satisfy my great interest in cars, Dad and Mom keep buying me\
    \ toy cars. All my relatives that know about my interest never fail to give me\
    \ toy cars as birthday presents. So far, I have collected more than 300 toy cars,\
    \ all of which are kept in the cupboard in my room.\n coin 硬幣 collection 收集品\n\
