  group_stem: "十二、中國從 2000 年初開始積極引導國內的剩餘資金向外投資，並於 2013 年提出一帶一路政策，期望藉由\n陸路及海路兩線，參與沿線國家的基礎建設，以取得穩定能源供給，消化國內過剩工業產能，同時擴大貿易\n\
    市場。 \n起初相當順利，然而受到全球疫情肆虐，中國經濟成長放緩，於此同時，部分參與一帶一路的國家，原\n本就經濟落後，而過高的開發金額，加上疫情影響經濟，瀕臨破產邊緣，只好租或出售產權予中國還債，例\n\
    ：希臘將皮雷夫斯港過半所有權售給中國、斯里蘭卡將漢班托塔租給中國99 年，這都引起當地人民的反彈。 \n面對一帶一路在開發中與已開發國家已開始受阻，因此，中國轉而前往東協，並於2022\
    \ 年1 月加入「區\n域全面經濟夥伴協定」，期待透過技術合作、貿易關稅減免、降低市場進入門檻，建立廣大的自由貿易區，\n並為一帶一路找新出路。"
