  stem: 關於本文的敘述，下列何者正確？
  options:
  - label: A
    content: 老翁施展高明法術，令秀才感到十分佩服
  - label: B
    content: 法術令錢如雨注，但最後連一枚都沒剩下
  - label: C
    content: 秀才清廉自持，不被百萬錢財所迷惑
  - label: D
    content: 從對話推斷可知，梁上君應是指盜賊
  group_stem: "濱州一秀才，讀書齋中。有款門者，啟視，則皤然一翁，形貌甚古。延之入，通姓氏，翁自言：「養真，姓胡，實乃狐仙。慕君高雅，願共晨夕。」秀才故曠達，亦不為怪。相與評駁今古翁殊博洽，鏤花雕繪，粲於牙齒，時抽經義，則名理湛深，尤覺非意所及。秀才驚服，留之甚久。\n\
    \  一日，密祈翁曰：「君愛我良厚。顧我貧若此，君但一舉手，金錢自可立致，何不小周給？」翁嘿然，少間笑曰：「此大易事。但須得十數錢作母①。」秀才如其請。翁乃與共入密室中，禹步作咒。俄頃，錢有數十百萬從梁間鏘鏘而下，勢如驟雨，轉瞬沒膝，拔足而立，又沒踝。廣丈之舍，約深三四尺餘。乃顧語秀才：「頗厭君意否？」曰：「足矣。」翁一揮，錢即劃然而止，乃相與扃②\
    \ 戶出。秀才竊喜，自謂暴富。\n  頃之入室取用，則阿堵物③ 皆化為烏有，惟母錢十餘枚尚在。秀才大失望，盛氣向翁，頗懟其誑。翁怒曰：「我本與君文字交，不謀與君作賊！便如秀才意，只合尋梁上君交好得，老夫不能承命！」遂拂衣去。\n\
    \                                  (蒲松齡＜雨錢＞)\n【注釋】\n①母：本錢。\n②扃：音ㄐㄩㄥ，關閉。\n③阿堵物：指金錢。"
