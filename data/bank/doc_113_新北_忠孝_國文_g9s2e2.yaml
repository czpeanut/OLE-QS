  section: 1
  number: 19
  type: single
  page: 2
  stem: 「高畑勳九歲時正好遇上美軍空襲，彈如雨下的恐怖記憶，終身難忘。電影中美軍的落彈劃破天際時，只聞絲絲聲響，悶重落地，靜默片刻後，才轟隆爆裂，火苗竄飛。三個層次的炸彈音所完成的戰爭交響曲，就是戰火孤雛才懂的聲音烙印，相對於多數好萊塢電影都是從投彈者觀點出發，他的聲音雕刻從受害者觀點出發，更添了悲情色彩。」關於這段文字的詮釋，下列何者最不恰當？
  options:
  - label: A
    content: 炸彈音呈現的獨特角度顯示出高畑勳的獨到之處
  - label: B
    content: 兒時難忘的經驗影響高畑勳對於電影題材的處理
  - label: C
    content: 這段文字描寫的是高畑勳戰爭悲愴三部曲第一部
  - label: D
    content: 高畑勳藉電影的拍攝抒解兒時對戰爭的恐怖記憶
