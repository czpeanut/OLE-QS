  - label: B
    content: 刻劃秀才的心理變化，從竊喜→失望→怨懟，前後形成非常強烈對比
  - label: C
    content: 此篇是一則諷諭小說，藉「雨錢」一幕，淋漓盡致呈現人性貪婪形象
  - label: D
    content: 狐仙的性格始終如一，他寧可和梁上君結交朋友，也不願同秀才為友
