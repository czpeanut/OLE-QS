- id: doc_113_新北_忠孝_國文_g9s2e2_s2_26
  section: 2
  number: 26
  type: single
  page: 3
  stem: 作者將自己比喻為盛開的夏荷，表達何種心情？
  options:
  - label: A
    content: 對於命運捉弄的無奈
  - label: B
    content: 對於青春流逝的感傷
  - label: C
    content: 對於愛情來遲的遺憾
  - label: D
    content: 對於自我價值的肯定
  group_stem: '蓮的心事 席慕蓉


    我

    是一朵盛開的夏荷

    多希望

    你能看見現在的我


    風霜還不曾來侵蝕

    秋雨還未滴落

    青澀的季節又已離我遠去

    我已亭亭 不憂 亦不懼


    現在 正是

    最美麗的時刻

    重門卻已深鎖

    在芬芳的笑靨之後

    誰人知我蓮的心事


    無緣的你啊

    不是來得太早 就是

    太遲'
