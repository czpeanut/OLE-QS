- id: doc_113_新北_忠孝_國文_g9s2e2_s2_32
  section: 2
  number: 32
  type: single
  page: 4
  stem: 研究團隊在彰濱海域調查海底垃圾時發現海水呈現黑色且有腥臭味，造成水質污染的主要原因為下列何者？
  options:
  - label: A
    content: 違法的工業廢水排放造成汙染
  - label: B
    content: 海底火山活動所釋放的硫化物
  - label: C
    content: 赤潮現象導致藻類大量的繁殖
  - label: D
    content: 漁民投放的餌料及生物排泄物
  group_stem: "國立臺灣海洋大學團隊執行海保署潔淨海洋計畫，研究發現西南沿岸流夾帶大陸浙江海岸的垃圾，是危害臺灣西海岸環境的主要禍首。\n\n夏、秋交替的時節，基隆海域會出現「垃圾廊帶」，原因是黑潮從臺灣東海岸，由南往北移動時，會夾帶花東海面的垃圾往北送，黑潮通過東北角的海脊時會往左邊流，由北往南的親潮通過海脊時，海流也會往右湧向基隆，海面上出就出現一條又一條的垃圾。等到東北季風加強時，這些垃圾就會被打上岸際。\n\
    \n海底垃圾調查過程中，研究人員另外察覺海水汙染危機，因為前往彰濱海域調查海底垃圾時，發現幾乎「看不到」，原因是水幾乎是黑的，而且有腥臭味。研究人員分析，臺灣西海岸從彰化到臺南是養殖區，要讓養殖的生物長大，漁民會投放大量的餌料。用蝦粉、魚肉做成的粉餌料，一定不會全部吃完，在海中溶解後自然會產生腥味。加上魚的黏液、排泄物組合在一起，海水就會變得黏稠，像是唾液一般，水質明顯惡化。\n\
    \n微塑膠對漁業食安的威脅也應防患未然，海大研究團隊判斷塑膠碎片來源，多數來自陸地的生活用品、人為活動產生的塑膠製品或與產業園區有關，建議由河川源頭至下游加強管理，降低海域微塑膠量。可朝上游產業形態進行分析，透過微塑膠搜集器過濾原理，更具體掌握微塑膠來源。\n\
    \n養殖漁業的蚵架也是微塑膠的來源，因為提供蚵架浮力的保麗龍，如果被颱風打壞了，漁民沒有回收，在海上漂流。保麗龍脆化了，散落在水中，魚隻可能會誤認是水母，一口吃下，威脅到海洋生態鏈，有賴更多漁民越來越有保育、永續的理念，配合蚵架實名制等政策，減輕問題的嚴重性。\n\
    \n (改寫自2025/3/4 公視新聞網報導)"
