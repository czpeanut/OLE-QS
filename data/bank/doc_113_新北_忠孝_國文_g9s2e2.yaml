- id: doc_113_新北_忠孝_國文_g9s2e2_s2_38
  section: 2
  number: 38
  type: single
  page: 5
  stem: 文中提到「穗花棋盤腳」的哪一種特性，最能展現生命的短暫與燦爛？
  options:
  - label: A
    content: 花朵在黑夜中爆開
  - label: B
    content: 花朵在晨曦前落盡
  - label: C
    content: 花朵色彩絢麗繽紛
  - label: D
    content: 花朵一串串如煙霧
  group_stem: "春天讓人忙不過來，因為除了聲音的全面發動之外，顏色的年度博覽上場。每一棵樹都在「出事」：芽在抽、苞在長、花在開，藍的，紫的、紅的、黃的，同時爆發。\n\
    \    紅蜻蜓撞進屋裡來，大黃蜂一頭栽進黃蟬花心裡，紫斑蝶在粉紅色的月見花叢裡翩翩。\n    桃花木把葉子落盡，抽出嫩紅的新葉，遠看一片紅雲，而白流蘇每天早晨就爆出嶄新的一簇白雪，東一簇、西一簇，蔓延開來，一片煙雲。最令人朝夕不安的是穗花棋盤腳，從春末夏初開始，一串串繽紛遠看如桃色煙霧浮動，它在萬籟俱寂的黑夜中一一爆開，又趕在晨曦露水還沒消融之前，撲簌簌落盡，若起得晚，就只看見空枝晃蕩、一地粉紅。\n\
    \    春天在山中，是一種顏色「暴動」，我眼花撩亂，無法進入室內讀書……\n    在這樣的崢嶸、躁動中，我卻知道，秋天一到，無邊落木蕭蕭下，這流動的一切，走向沉寂。\n\
    \    進入冬天，蛇去睡了，蟬進入地下，蝴蝶消失，蛹在成形，七里香夏天落進土裡的種子，沉默中蓄勢待發，蜂后，在逐漸死去，曾經熱烈的蜂巢，空了。\n   \
    \ 一切都是流動的，躁動歸於沉靜，而沉靜，只是醞釀和等待。所有的種子，所有的卵和蛹，所有生命的衝動和慾望，只是在等候自己的時辰。\n           \
    \               (節選自龍應台《注視》)"
