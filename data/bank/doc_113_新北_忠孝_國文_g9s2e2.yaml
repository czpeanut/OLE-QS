  stem: 根據本文，下列有關國立故宮博物院所藏翠玉白菜的說明，何者正確？
  options:
  - label: A
    content: 翠玉材質象徵吉祥，向來極受民間歡迎
  - label: B
    content: 以翠玉雕刻白菜造型始風行於元至明初
  - label: C
    content: 傳說是瑾妃的嫁妝，造型隱喻命運乖舛
  - label: D
    content: 菜葉上刻有螽斯和蝗蟲，寓意多子多孫
  group_stem: "這件與真實白菜相似度幾乎百分百的作品，是由翡翠琢碾而成，如單就材質而言，並非完美，但創作者利用其天然的顏色，化翠綠為葉；斑白為梗，裂璺（音：ㄨㄣˋ，器物上的裂紋）、斑塊更巧妙地成為白菜的質感，加上綠葉上生動的螽斯和蝗蟲，觀之宛如蟲鳴在耳，更顯生意盎然。全作精雕細琢，匠心獨運，化缺陷為真實與美好，成為故宮最具人氣的文物。\n\
    \    翠玉白菜原陳設於紫禁城的永和宮，被推測為光緒皇帝瑾妃的嫁妝，象徵其清白，並企求多子多孫，更增添其傳奇色彩。雖說翡翠材質與白菜造型始風行於清中晚期，白菜與草蟲的題材在元到明初的職業草蟲畫中，屢見不鮮，一直是受到民間歡迎的吉祥題材。\n\
    \              (改寫自國立故宮博物院翠玉白菜簡介)"
