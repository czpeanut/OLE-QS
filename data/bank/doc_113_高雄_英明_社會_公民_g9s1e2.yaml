    labeled_by: ai
- id: doc_113_高雄_英明_社會_公民_g9s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 右圖顯示台灣各地區發展其特有的農牧業和農產品生產，例如南投的茶園、梨山的蘋果和嘉南平原的稻作。若要發揮各地區的優勢，農業生產者應如何選擇最適合的產品生產，以確保競爭力？
  options:
  - label: A
    content: 生產成本較低，符合當地的自然條件需求
  - label: B
    content: 人力資源充足，適合大量勞動的農業生產
  - label: C
    content: 機會成本較高，提高生產效益與市場利潤
  - label: D
    content: 社會變遷快速，引進資訊科技來協助生產。
