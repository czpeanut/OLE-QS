- id: doc_113_高雄_英明_社會_公民_g9s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 台灣的早餐文化豐富多樣，從傳統的燒餅油條、豆漿店，到街頭巷尾的連鎖早餐店，甚至超商提供的速食早餐，各式各樣的選擇滿足了不同人的需求。這些早餐店透過多種管道提供便捷的餐飲服務，反映出台灣獨特的飲食文化。上述內容是透過哪一種方式來滿足人們的早餐需求？
  options:
  - label: A
    content: 自給自足
  - label: B
    content: 市場交易
  - label: C
    content: 政府配給
  - label: D
    content: 私下交換。
