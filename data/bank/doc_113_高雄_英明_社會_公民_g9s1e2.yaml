- id: doc_113_高雄_英明_社會_公民_g9s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 小新擔任國中班長，每天早晨要到辦公室拿取考卷、分發給同學們測驗，還要幫忙完成老師交辦的各項任務，並定期參加學校集會和活動。這些工作任務需要不斷投入時間和勞力。請問，小新的這類工作屬於以下哪一種商品或服務類型的特徵？
  options:
  - label: A
    content: 農夫種植的農作物
  - label: B
    content: 便利商店裡的鮮乳
  - label: C
    content: 理髮師的剪髮服務
  - label: D
    content: 早餐店裡的三明治。
  tags:
