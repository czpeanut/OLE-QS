- id: doc_113_高雄_英明_社會_公民_g9s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 自從台灣加入WTO（世界貿易組織）後，許多進口農產品湧入市場，導致本地農牧業者面臨更大的競爭壓力。例如，進口的低價牛奶、稻米等產品使本地農民在市場上失去價格優勢。面對這些挑戰，農業業者應該採取什麼策略來提升自身的競爭力，並在全球市場中站穩腳步？
  options:
  - label: A
    content: 重新調整產業結構，並致力於技術創新與升級
  - label: B
    content: 政府提高進口農產品的關稅，以保護國內市場
  - label: C
    content: 政府強制要求消費者必須優先購買本地農產品
  - label: D
    content: 持續削價競爭，藉此吸引顧客增加市場佔有率。
