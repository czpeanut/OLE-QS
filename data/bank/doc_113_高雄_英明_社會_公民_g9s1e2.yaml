- id: doc_113_高雄_英明_社會_公民_g9s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 小華的雞排店生意很好，常常需要排隊，於是他決定將雞排價格調漲20元。沒想到漲價後，顧客都跑去買隔壁的炸雞，銷售量大幅下降，小華只好推出「買雞排送飲料」的優惠，等於變相恢復原價。請問下列何項敘述最能反應此一現象？
  options:
  - label: A
    content: 顯示市場自由競爭有利於消費者
  - label: B
    content: 市場的價格並無法引導資源分配
  - label: C
    content: 消費者絕對無法接受店家的漲價
  - label: D
    content: 單一店家漲價帶動其他店家跟進。
