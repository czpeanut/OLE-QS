- id: doc_113_高雄_英明_社會_公民_g9s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 報導指出：「在台北市的熱門商圈，走幾步路就能看到一家便利商店，這些商店提供即時咖啡、熱食和多樣化的生活用品。如果其中一家店因顧客太多而排隊過長，消費者只需轉身便能輕鬆找到另一家便利商店購物。」由此現象可見，台灣便利商店的市場型態呈現何種情形？
  options:
  - label: A
    content: 經營成本較低，市場競爭不大
  - label: B
    content: 商家眾多，市場競爭程度激烈
  - label: C
    content: 對手較少，市場競爭程度偏低
  - label: D
    content: 利潤豐厚，市場競爭程度不高。
