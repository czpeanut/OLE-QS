- id: doc_113_高雄_英明_社會_公民_g9s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 隨著電子商務的快速發展，網路購物已成為人們日常生活的一部分，特別是在「雙11 購物節」期間，台灣的網路購物平台也紛紛推出折扣活動，以吸引更多消費者參與搶購。這些平台希望在競爭激烈的市場中搶得商機。請問，上述提到的「網路購物平台」屬於哪種類型的市場？
  options:
  - label: A
    content: 有形市場，商品市場
  - label: B
    content: 無形市場，勞動市場
  - label: C
    content: 無形市場，商品市場
  - label: D
    content: 有形市場，勞動市場。
