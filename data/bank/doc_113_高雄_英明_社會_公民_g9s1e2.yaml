    labeled_by: ai
- id: doc_113_高雄_英明_社會_公民_g9s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 甲國與乙國在國際貿易中有激烈競爭。假設甲國即將加入某關稅同盟，而乙國未被納入其中，導致乙國商品進入同盟市場時需支付高額關稅，這將對乙國商品的競爭力產生不利影響。根據此情境，以下何者最有可能是乙國商品競爭力降低的原因？
  options:
  - label: A
    content: 生產技術不足，導致產品品質無法提升
  - label: B
    content: 生產成本偏高，難以降低市場商品價格
  - label: C
    content: 商品售價過高，無法吸引更多顧客購買
  - label: D
    content: 區域協定提升門檻，進入市場困難增加。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 公民
      code: 4-2
      title: 保障市場勞動參與
      chapter: 第4章 勞動參與
    textbook: 九上公民 4-2 保障市場勞動參與
    labeled_by: ai
- id: doc_113_高雄_英明_社會_公民_g9s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 隨著全球化發展，各國越來越依賴國際貿易來獲取所需的資源與產品。例如，台灣出口電子零件，進口能源與農產品，以彌補國內生產的不足。各國通常會根據自身的比較優勢選擇出口商品，以提升經濟效益。針對國際貿易的運作，下列敘述何者有誤？【外匯存底：一國所擁有國際上可以接受的外國貨幣數量】
  options:
  - label: A
    content: 國際貿易強調各國發揮生產優勢以促進分工交易
  - label: B
    content: 進口商品可以幫助國內獲得更多消費選擇與便利
  - label: C
    content: 若一國長期保持貿易順差，將有效累積外匯存底
  - label: D
    content: 各國會優先出口機會成本較高的商品來提升利潤。
  tags:
    chapter:
      publisher: 翰林
