- id: doc_113_高雄_英明_社會_公民_g9s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 由於疫情影響，小文改用網購方式採買日常所需的物資與食材。近日有報導指出物流車輛管理不嚴謹，導致部分食材可能存在衛生隱患，主管機關提醒消費者，在發現問題時應立即申訴，以保障自身權益。文中提到的「主管機關」應為下列何者？
  options:
  - label: A
    content: 消費者權益促進會，提供消費者諮詢與服務
  - label: B
    content: 消費者文教基金會，推廣消費者教育與安全
  - label: C
    content: 行政院消費者保護處，協助消費者維護權益
  - label: D
    content: 公平交易委員會，處理市場競爭及不公平交易。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 公民
      code: 3-3
      title: 消費者權益的保障
      chapter: 第3章 市場與競爭
    textbook: 九上公民 3-3 消費者權益的保障
    labeled_by: ai
- id: doc_113_高雄_英明_社會_公民_g9s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 小庭在進行公民課的專題報告時，討論了「一日之所需，百工斯為備」的概念。她舉例說明，從早餐的麵包到每天使用的手機，這些物品都依賴各行各業的分工與合作才能生產出來。針對小庭的說明，下列敘述何者正確？
  options:
  - label: A
    content: 所有人自給自足，為市場帶來最高效益
  - label: B
    content: 市場交易過程，人們不一定會理性思考
  - label: C
    content: 依賴他人生產會使交易成本大幅度增加
  - label: D
    content: 日常所需物品需眾人分工合作生產而成。
  tags:
