- id: doc_113_高雄_英明_社會_公民_g9s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 公民課堂上，老師播放了一段關於國際貿易的影片，影片中介紹了許多國家透過自由貿易互通有無，例如：來自法國的紅酒、來自日本的精密儀器，以及台灣出口的優質水果等等。看完影片後，老師請同學們發表對於自由貿易好處的想法，請問下列哪位同學的說法需要修正？
  options:
  - label: A
    content: 炭治郎：我們可以買到世界各地的東西，選擇變多了！
  - label: B
    content: 善逸：廠商把產品賣到國外，國內生產規模就會縮小。
  - label: C
    content: 禰豆子：我們可以用更便宜的價格買到各種國外商品。
  - label: D
    content: 伊之助：廠商把產品賣到國外，就能更提高獲利機會。
