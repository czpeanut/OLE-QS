- id: doc_113_高雄_英明_社會_公民_g9s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 小萱在網路上購買了一件洋裝，收到貨後發現實物與賣家網站上的照片顏色差異明顯。她聯絡賣家要求退貨，但賣家表示已發出的貨物恕不退還，僅能同意換購其他商品。針對這種情況，下列哪一種處理方式最能保障小萱的消費權益？
  options:
  - label: A
    content: 向消保會或相關單位投訴，要求協助退貨處理
  - label: B
    content: 默默接受顏色不同的商品，應避免與賣家爭執
  - label: C
    content: 依據消費者保護法，直接提出廣告不實的申訴
  - label: D
    content: 接受賣家建議，可換購其他顏色或款式的商品。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 公民
      code: 3-3
      title: 消費者權益的保障
      chapter: 第3章 市場與競爭
