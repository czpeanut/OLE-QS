  section: 1
  number: 13
  type: single
  page: 2
  stem: 立法院通過《菸害防制法》修正案，決定對菸品課徵更高的附加稅，導致市面上的菸品價格調漲。某菸品供應商得知消息後，聯合其他業者囤積現有庫存，準備等到價格正式上漲後再重新上架銷售，以圖獲取更高利潤。此類業者的行為違反了哪一項法律規定？
