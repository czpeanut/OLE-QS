- id: doc_113_高雄_英明_社會_公民_g9s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 在市場經濟中，商品和服務的價格主要由市場供需力量決定，而非由政府控制。以下哪一種情境最能反映市場經濟的運作？
  options:
  - label: A
    content: 小葳開車經過高速公路，按照政府收費標準繳交過路費
  - label: B
    content: 阿美參加古董拍賣會，透過現場競價方式拍得心儀商品
  - label: C
    content: 政府根據國際油價變動，來公告全國統一調整油價標準
  - label: D
    content: 學校營養午餐供應，由政府根據補助標準設定固定價格。
