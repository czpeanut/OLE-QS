  stem: 2017 年由土耳其總統主導的修憲公投通過，總統不再只有象徵性政治權力，而是握有實質行政權，且總統可以不用經過國會批准發布法令，並有權力解散國會。憲法法院雖然可以審判總統，但15
    席最高法院大法官有12 人是由總統任命。有關土耳其修憲後的制度，下列敘述何者正確？
  options:
  - label: A
    content: 土耳其透過分權制衡的方式落實有限政府
  - label: B
    content: 土耳其權力運作模式，符合憲政主義精神
  - label: C
    content: 總統雖然權力集中，大法官仍可防止其濫權
  - label: D
    content: 總統權力缺乏監督，恐使人權無法受到完整保障。
