  section: 1
  number: 10
  type: single
  page: 2
  stem: 為強化兩岸政治協商的民主監督機制，防止特定政黨逕與中國洽簽「兩岸和平協議」，立法院三讀通過臺灣地區與大陸地區人民關係條例部分條文修正案。我國與中國簽署政治協議，經國會審議，協商過程須向立法院報告；完成協商後，經行政院決議並送總統核定，再送立法院審議，並進行全國公民投票，通過後呈請總統簽署公布生效。由上文推論，下列選項何者正確？
  options:
  - label: A
    content: 兩岸政策為總統職權，所以此法案是總統提案
  - label: B
    content: 「兩岸和平協議」的談判過程須受立法院監督
  - label: C
    content: 若此法案行政院不接受，可以直接退回立法院
  - label: D
    content: 若此法律違反憲法，立法院可以提憲法修正案。
