- id: doc_113_台南_復興_國文_g7s1e1_s6_6
  section: 6
  number: 6
  type: single
  page: 6
  stem: 根據本文，下列關於「網路成癮」的敘述，何者最恰當？
  options:
  - label: A
    content: 容易讓家長們恐慌，深具負面的影響
  - label: B
    content: 讓孩子與現實互動，可解決根本問題
  - label: C
    content: 僅影響到生活作息，不列為精神疾病
  - label: D
    content: 青少年每日網路上，遊戲超過半小時
  group_stem: "(三) 世界衛生組織(WHO)在 2018 年正式宣布將「網路成癮」納入精神疾病，有 3 個判斷標準，包括失去控制、日常生活受影響、持續一年\
    \ 的狀態，主要是孩子對網路遊戲「失控造成生活失能」的現象，而不是一般認為的「花太多時間在遊戲上」。\n 網路成癮在青少年族群相當常見，共病包含下列幾種精神疾病，如注意力不足過動症、憂鬱症、社交畏懼症、其他物質濫用、強迫症及其他心理危險因子的組合，例如低自尊、課業或工作壓力、家庭關係不佳、人際關係不佳等。\n\
    \ 網路成癮這個現象其實有積極的預警功能，可幫助家長及時介入處理上述的危險因子或疾病。每個孩子的情況各不相同，可能有不同心理危險因子的組合，需要謹慎完整的評估。\n\
    \ 除了帶孩子就醫請教專家外，家長其實可以謹記一個大方向，網路成癮最大的問題在於「與人失去連結」，這個人不僅是同儕、老師，更是家人，先有良好的親子關係，才有辦法協助孩子釐清，無論是討論生活目標、建立人際關係、加強溝通技巧等，有良好的現實人際關係連結與實體社會活動參與，才是最佳解方。\n\
    \ ――節錄自陳夢茹〈長時間上網就是網路成癮?精神科醫師:有 3 個判斷標準〉"
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
