  stem: 有關〈無心的錯誤〉一文中「你明知在紐約放炮是違法的，也知道這種處處朽葉、天乾物燥的冬天容易失火，卻答應朋友用我們鄰接樹林的院子作掩護。可曾想想如果引起火災，不論是燒了自己、別人或是後面的森林，我們所要承受的損失與法律責任會有多大！」作者想藉著這段話，告訴兒子何種道理？
