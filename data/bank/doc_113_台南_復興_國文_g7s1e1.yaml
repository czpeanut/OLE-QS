    \ 我聽了好訝異，印象中，「鹽」不但是民生必需品，也是每個朝代和國家的經濟大動脈，鹽場怎會淪落到關門的地步?不過，我也因而體會阿水伯為什麼會有那麼沉重的心事。鹽場一旦關閉，不只他個人失去工作，而且連他一輩子――不，應該說，他和他祖先們歷代來所辛苦從事的事業，也一併消失了，這種將自己生命經驗與祖先傳統價值幾乎完全掏空的滋味，確實很不好受!\n\
    \ 我不禁又回頭看看阿水伯居住的房舍，守著成排灰舊的老房舍，正說明他們安土重遷的純樸個性，將來如果鹽田真的關閉，那阿水伯和那些鹽農們，不就只能望著空蕩蕩的鹽田，追憶自己和祖先的種種?\n\
    \ ――改寫自林金郎〈潟湖晚陽〉"
