  group_stem: "(四)\n 夜裡，我和仔仔總會坐在潟湖堤岸前，討論一天的觀察，「我覺得阿水伯好像心事重重。」我說。\n 「應該吧。因為有消息說，鹽場要關了!到時阿水伯就沒頭路了。」仔仔說。\n\
