  stem: 根據上文，關於臺灣鹽業的敘述，下列何者正確？
  options:
  - label: A
    content: 臺灣所產製的鹽，九成為食用鹽，一成為工業用粗鹽
  - label: B
    content: 每年的六、七月，艷陽高照，是臺灣晒鹽的最佳時間
  - label: C
    content: 人們所食用的鹽，是苗栗通霄鹽場以日晒法所製成的
  - label: D
    content: 在時代的變遷下，鹽農因而被迫放棄傳承自祖先的事業
  group_stem: "(四)\n 夜裡，我和仔仔總會坐在潟湖堤岸前，討論一天的觀察，「我覺得阿水伯好像心事重重。」我說。\n 「應該吧。因為有消息說，鹽場要關了!到時阿水伯就沒頭路了。」仔仔說。\n\
    \ 「鹽場要關門?不會吧!」我大聲叫道，「我們每天都要吃鹽，鹽場關門不就沒鹽吃了。」\n 「大哥!」仔仔拍拍我的肩膀，「臺灣才多少人，能吃多少鹽啊!其實百分之九十的鹽都是工業用的粗鹽，七股鹽場的鹽也是工業用的。」\n\
    \ 「那我們吃的鹽哪裡來的?」我不解地問。\n 「我們現在吃的是苗栗通霄鹽廠的鹽，但不是晒鹽，而是從海面十公尺下抽取乾淨的海水，用電透析製法製成的精鹽。」\n\
    \ 因為仔仔的「教育」，我才知道，臺灣從三月飄起細雨，飄到清明時分，接著又有六月梅雨及七月颱風，所以一直到了八、九月，鹽民才能開始整理鹽田，準備至明年一、二月止的晒鹽季節。七股鹽農稱每年的九月到明年一月是採收的「小汛季」，二月到五月則是「大汛季」，大汛季收成可達年產量的一半。其他有雨的季節，幾乎就是晒鹽休工的時期，因為雨季不算短，所以臺灣不是理想的晒鹽地區。而且近年從澳洲進口的鹽，價格才臺灣土產的一半，在成本考量下，進口鹽慢慢取代本土鹽。\n\
    \ 仔仔說:「去年底，布袋鹽場關閉，臺灣只剩下七股這個鹽場，但七股鹽場其實也只剩下半個，大半都堆放澳洲的鹽，說不定今年也會關閉，到時，晒鹽就從臺灣歷史中消失了!」\n\
    \ 我聽了好訝異，印象中，「鹽」不但是民生必需品，也是每個朝代和國家的經濟大動脈，鹽場怎會淪落到關門的地步?不過，我也因而體會阿水伯為什麼會有那麼沉重的心事。鹽場一旦關閉，不只他個人失去工作，而且連他一輩子――不，應該說，他和他祖先們歷代來所辛苦從事的事業，也一併消失了，這種將自己生命經驗與祖先傳統價值幾乎完全掏空的滋味，確實很不好受!\n\
    \ 我不禁又回頭看看阿水伯居住的房舍，守著成排灰舊的老房舍，正說明他們安土重遷的純樸個性，將來如果鹽田真的關閉，那阿水伯和那些鹽農們，不就只能望著空蕩蕩的鹽田，追憶自己和祖先的種種?\n\
    \ ――改寫自林金郎〈潟湖晚陽〉"
