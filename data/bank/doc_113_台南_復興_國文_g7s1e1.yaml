  stem: 「問題是，什麼是無心呢？酒醉駕車肇事的人是有心殺人嗎？偶爾試一次毒品，作為體驗生活方法的人是有心犯罪嗎？考試時受不住朋友請託而傳個紙條的是惡意犯規嗎？」依據文意，作者在此連用問句，是希望兒子能明白什麼道理？
