- id: doc_113_台南_復興_國文_g7s1e1_s6_4
  section: 6
  number: 4
  type: single
  page: 6
  stem: 依據本文，下列敘述何者正確？
  options:
  - label: A
    content: 雨聲只有在車陣的喇叭聲中才會變小
  - label: B
    content: 雨夜的電台大樓除了作者外空無一人
  - label: C
    content: 作者仍記得高中時代生活在台北的回憶
  - label: D
    content: 作者曾祈願的廟宇因靈驗而在雨夜仍燈火通明
  group_stem: "(二) 週一傍晚，台北下了場傾盆大雨。理應是不值一提，亦無需大驚小怪的，畢竟在此生活 20 餘載，早慣於這蠻不講理的春季天氣，我卻反常的對其印象深刻，決定寫進週記裡。\n\
    \ 那晚因電台邀訪，我逆行於下班時分歸心似箭的人群，雖說方向迎異，我們手裡都打著一把成效不彰的傘，敵不過雨刁鑽的角度。儘管褲腳衣袖悉數浸濕，人還是能走的，車道就難過了。本就足夠壅塞的十字路口，被夜雨擾亂了節奏。震天鳴響的喇叭聲，既像趁亂宣洩，也像嚴正抗議，可老天爺才不管呢，烏雲密布的天幕裡，雨愈下愈起勁。\n\
    \ 這般情勢下，對街燈火通明的廟宇，更像難得的一方寧靜，於是我出於念舊地瞅了幾眼。十幾年前仍是高中的年紀，通學路上總要經過此地。彼時的祈願，多半沒有成真；彼時的同行，多半亦已分離，但總會有些回憶駐留在城市一隅，那是任憑滂沱大雨也沖不散的過去。\n\
    \ 抵達電台時，前檔節目仍在播音。我熟練地坐在大廳等待，望著電梯上下來回，可除了我之外，再沒誰抵達這站。我聽著頭頂音響裡悲觀的天氣預報，心有所想，這城市大概會淹成一片海吧。我們終究只是漂流瓶，掏心掏肺地說著自己或許擁有共同的頻率，卻沒有交集的軌跡。\n\
    \ 隔天醒來，窗外竟像開了個說笑般的風和日麗。昨夜狂亂，已在不覺間，成為路過的風景。我將濡濕的衣物掛起，將晾乾的雨傘收起，帶著急不可待的家犬到巷口蹓躂了一圈。事過境遷的早晨裡，能感受到陽光的溫暖。能感覺到日子的平淡，可在沒有一絲潮濕的空氣裡，雨怎麼又嘩啦啦的落下來？\n\
    \ 聯合文學【手寫週記｜三月】――陳浪"
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
  tags:
    textbook: 第一冊（七上）第1次段考範圍
