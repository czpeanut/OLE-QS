  stem: 根據文章所述，下列何者正確？
  options:
  - label: A
    content: 本文敘寫千年狐精為拜訪張華，罔顧千年老樹性命及勸說
  - label: B
    content: 張華言行暗指當朝重視門第觀念，若地位懸殊，易遭誅殺
  - label: C
    content: 採角色對話與旁白交錯方式進行主觀敘寫，強化角色形象
  - label: D
    content: 張華囚禁書生，是以其為餌，引華表出現，一併剷除異己
  group_stem: '(五)請問閱讀以下文章，並回答48~50題：

    　　張華字茂先，晉惠帝時為司空。于時燕昭王墓前，有一斑狸，積年能為幻化，乃變作一書生，欲詣①張公，過問墓前華表②曰：「以我才貌，可得見張司空否？」華表曰：「子之妙解，為無不可，但張司空智度③，恐難籠絡。出必遇辱，殆不得返，非但喪子千歲之質，亦當深誤老表。」書生不從，遂詣華。

    　　華見其總角風流，潔白如玉，舉動容止，顧盼生姿，雅重之。於是論及文章，辨校聲實，華未嘗聞此，乃歎曰：「天下豈有此年少。若非鬼怪，則是狐狸。」書生乃曰：「明公當尊賢容眾。嘉善而矜不能，奈何憎人學問？」言卒，便請退。華已使人防門，不得出，既而又謂華曰，華不應，而使人禦防甚嚴。豐城令雷煥，博物士也，謂華曰：「聞魎魅忌狗，所別者數百年物耳。千年老精，不復能別，唯有千年枯木，照之則形見。」燕昭王墓前華表，已當千年。乃遣人伐之。使人既至，華表歎曰：「老狸自不知知，果誤我事。」


     ①詣：拜訪。 ②華表：燕昭王墓前的千年樹木。 ③智度：才智超群。

    （改寫自干寶《搜神記》）'
