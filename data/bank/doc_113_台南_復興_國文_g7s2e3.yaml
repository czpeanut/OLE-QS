  group_stem: '(二)請問閱讀以下文章，並回答41~43題：

    　　豬頭飯是鹽水才有的小吃，這名字乍聽之下有幾分莞爾，絕對與豬頭有關，然而，飯端上桌卻未見豬頭肉。豬頭之名從何而來？根據地方的說法，日治時期，因為物資缺乏，鄉下地方只有逢年過節或喜慶才能殺豬，富裕人家吃得起豬肉，一般農戶便只能物盡其用，吃豬頭煮出來的飯，此說法幾乎已成鹽水地區眾所周知的「公版」。

    　　據地方耆老說，過去沒有太多食物可吃，加上當時節儉，得了食材得物盡其用，便想方設法變成美食，豬頭混米煮成飯，帶點肉味葷腥與油香，總勝過米飯加鹽吧！聽起來有點淡淡哀愁，想來也是，在物資不充裕的年代，想盡辦法拼拼湊湊才能變出一道菜，就如同許多食物的源頭大抵也是□□□□下而衍生，如早年民間辦桌後的「菜尾湯」將宴席剩餘的菜混合再次加熱煮成，用來分送親朋鄰居，也隱含著濃厚的人情與謝意，時過境遷，今日的菜尾早已演變成廚師特製烹煮的客製佳餚。再如客家人的小炒，也是將祭祀過後煮剩的零碎食材再拼湊料理成一盤，變成客家小炒，惜物節儉下將原本可能不吃的透過烹調變得可口，翻天覆地的變成了華麗名菜！

    　　原本豬頭飯是生活不富裕的平民百姓吃食，結合了相對廉價的豬頭與秈米，因為便宜而常被食用，不過，最初只見於一般人家的餐桌，後來也走出家庭，帶來商機，在生活逐漸穩定稍有餘裕後，豬頭變成相對便宜的食材，因為經濟實惠口味又好，在地方上頗受歡迎，還打出響噹噹的名號，後來更傳到新營去，成了新營人的日常飯食。

    　　豬頭飯最大特色在於使用「秈米」，也就是俗稱的「在來米」，相較於日本人來臺後引進改良育種的粳米（蓬萊米），在來米因為口感不佳，價格相對便宜，成為農業時代一般家庭主要的米食，而煮熟後蓬鬆不黏韌、粒粒分明，看起來份量多且足，也是豬頭飯選用米的主因之一，「以前老一輩人都說是『銃子飯』（tshìng-tsí，子彈）！」在鹽水從事餐飲業超過五十年的陳進明說，現代人吃慣了Q黏的蓬萊米，在來米黏性差，口感偏乾硬，尤其不討年輕人喜愛，所以後來有營業店家改良或混雜蓬萊米。

    　　傳統豬頭飯是以整顆豬頭熬煮至少兩小時成高湯，濾油後，再以豬頭高湯炊煮在來米，過程中加的水、鹽、蔥頭等調味比例，是各家獨到之祕，也有創新作法添加蝦米煮過的湯汁提味。待米飯炊熟後，或直接吃或拌入豬油、香腸油等增加油潤與香氣。豬頭飯的表現在於豬頭豐富的膠質以及油脂與在來米的融合，米飯色澤溫潤微黃，豬頭湯汁滲入米粒中再透出的淡淡肉香，是最完美的結合。豬頭便宜且有熱量，在來米好消化，對早年務農與從事勞力工作的鹽水人而言，是道地的早餐代表，一碗飽足，一整天也氣力十足。

    　　說豬頭飯是鹽水指標性的食物，真的名符其實，說也奇怪，出了鹽水、新營以外，便十分少見。「原本來就是家裡自己吃的，出了鹽水、新營大概很難生存。」陳進明說。

    　　豬頭飯提供的就是一種家庭式的飲食，以人人都能消費得起的平價與口腹滿足，陪著在地人走過吃飯時光。

    （張耘書《臺南好食》）'
