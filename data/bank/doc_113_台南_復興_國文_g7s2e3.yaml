    　　道狹草木長，夕露沾我衣。衣沾不足惜，但使願無違。（陶淵明〈歸園田居·其三〉）


    乙、寒山轉蒼翠，秋水日潺湲。倚杖柴門外，臨風聽暮蟬。

    　　渡頭餘落日，墟里上孤煙。復值接輿③醉，狂歌五柳前。（王維〈輞川①閑居贈裴秀才迪②〉）

     ①輞川：水名，在今陝西省藍田縣終南山下。

    ②裴秀才迪：詩人，王維的好友，與王維唱和多。

    ③接輿：是春秋楚國人，好養性，假裝瘋狂，不去作官。'
