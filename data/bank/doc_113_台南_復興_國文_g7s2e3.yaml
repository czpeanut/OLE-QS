  stem: 根據上文，韓職NC恐龍隊選擇來臺南春訓的原因並不包含下列哪一項？
  options:
  - label: A
    content: 臺南春季時溫暖少雨
  - label: B
    content: 政府提供高額補助金
  - label: C
    content: 成棒主球場設施完善
  - label: D
    content: 臺南市市民熱情好客
  group_stem: '(四)請問閱讀以下文章，並回答46~47題：

    　　棒球運動受到大眾愛戴，場上球員的一舉一動都緊緊繫觀戰民眾的心，跟著戰局善怒哀樂。熱愛棒球的臺南長年關注人才培育、積極建設場地，隨著亞太國際棒球訓練中心成棒主球場（以下稱成棒主球場）的落成，除了有助於棒球在地發展，更讓臺南躍升為亞洲新焦點。

    　　爽朗有風的午後，成棒主球場迎來啟用後首波比賽，來自韓國職棒KBO聯盟的NC恐龍隊一軍，與臺灣職棒6隊進行春訓練習賽，同時首次對外開放部分座位，讓市民與球迷進場參賽。場內響起陣陣的吶喊聲，為場上奮戰的球員們加油打氣，場邊還有韓國職棒啦啦隊帶來韓式應援，氣氛活潑熱鬧，令民眾大呼過癮，紛紛在社群媒體上發文打卡，分享愉快的新球場開箱體驗。

    　　韓職NC恐龍隊入駐新落成的成棒主球場，在2月24日起與臺灣職棒6隊進行8場交流賽，透過實戰經驗進行熱身。NC恐龍隊球團表示：「早就聽聞臺南春天溫暖少雨，適合戶外訓練，去年主球場尚未完成時來臺南，就對場地設施感到滿意，因此對於主球場的建成更加期待。再加上臺南市民的熱情與基礎設施等因素，讓我們最終決定今年落腳臺南春訓。經過這次美好經驗，期盼未來能有更深入的合作。」

    　　成棒主球場擁有室內戶外牛棚與寬敞的室內打擊練習室，更有臨近比賽場地的內野練習場，可以有效利用時間分批練習。球場內鋪設天然草皮，美觀且較能保護球員的膝蓋與腳踝，減緩身體負擔。規劃完善的球員休息室，置物櫃、沙發區等俱全，還擁有2座共24間淋浴室，讓球員在練習或比賽後能舒適盥洗。

    　　符合國際標準的成棒主球場，場內視野遼闊，內外野共設置25000個座席，是目前臺灣容納最多球迷的戶外棒球場。採用綠建築設計施工，引入西南季風吹拂觀眾席，減少酷熱達到降溫效果。2樓進門前的長廊將設有小型棒球名人堂展覽區，在比賽尚未開打前，民眾還能參觀，了解臺灣棒球名人事蹟戰功。寬敞流暢的無障礙設施空間，讓喜愛棒球的身障者也能愉快進場。

    　　臺南是放大版的棒球學校，建構基層、地方到職業的完整棒球之路，擁有少棒、青少棒、青棒、成棒、社會組、城市球隊還有職棒元老級隊伍——統一7-ELEVEn獅隊等各級球隊。隨著亞太國際棒球訓練中心全面完工啟用，躍為全臺灣最完善三級棒球園區的城市，更能吸引外國球隊進駐，達成跨國交流。

    　　亞太國際棒球訓練中心與鄰近的臺灣歷史博物館形成文化與運動兼具的特殊場域，展現獨樹一格的城市人文風采。棒球讓世界看見臺南，也使臺南成為友善開放的友誼之都，躋身亞洲新焦點。

    （《悠活臺南》第55期，2025年）'
