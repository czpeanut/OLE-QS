  group_stem: '(三)請問閱讀以下短文，並回答44~45題：

    　　人在少年，神情未定，所與款狎①，熏漬陶染②，言笑舉動，無心於學，潛移暗化，自然似之；何況操履③藝能④，較明易習者也？是以與善人居，如入芝蘭之室，久而自芳也；與惡人居，如入鮑魚之肆⑤，久而自臭也。墨翟悲於染絲，是之謂矣。君子必慎交遊焉。孔子曰：「無友⑥不如己者。」顏、閔之徒，何可世得？但優於我，便足貴之。


     ①款狎：親近交往。 ②熏漬陶染：受其薰陶、影響。熏，通「薰」。 ③操履：操守德行。 ④藝能：本領技能。 ⑤肆：店鋪。 ⑥友：結交。

    （顏之推《顏氏家訓》）'
