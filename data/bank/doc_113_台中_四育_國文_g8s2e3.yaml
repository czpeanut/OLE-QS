- id: doc_113_台中_四育_國文_g8s2e3_s3_19
  section: 3
  number: 19
  type: single
  page: 3
  stem: '從女性主義文論的觀點來看，武俠小說是「男性沙文主義」的心理滿足。因為①<u>小說裡面的男俠，幾乎是所有女性的追求對象</u>。此外，②<u>心狠手辣的邪魔也不時以尤物姿態出現，遙相呼應傳統的「紅顏禍水」觀</u>。因此，③<u>武俠小說是「男權」的文化「幫凶」</u>。也許有人會說，④<u>女俠或女魔頭走出了閨房和廚房，是否可視為「女權」的伸張？表面上如此，但實際上，女俠終究要成為男俠的附庸，因此不能被視之為對「男權」的挑戰</u>。

    這段論述中畫線的文字，何者屬於作者意圖陳述的論點，而非立論的證據？？'
  options:
  - label: A
    content: ①
  - label: B
    content: ②
  - label: C
    content: ③
  - label: D
    content: ④
  uncertain_spans:
  - 內容與原卷文字層不符（吻合 69%）
