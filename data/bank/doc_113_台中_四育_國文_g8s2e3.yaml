  stem: '一群畢業二十年的小學同學聚會，他們送了一方「眾望所歸」的匾額至花輪的辦公室。丸尾：「恭喜老兄，你當年的理想終於如願以償了。」花輪：「上個月小玉弄璋之喜，我未能親臨祝賀，真是過意不去。」小玉：「沒關係，小丸子下個月喬遷之喜，到時候我們可得大肆慶賀一番！」小丸子：「丸尾如今廣栽桃李，享譽杏壇，也算是可喜可賀呢！」

    根據這段文字，下列敘述何者最恰當？'
  options:
  - label: A
    content: 花輪投身政壇
  - label: B
    content: 小玉喜獲千金
  - label: C
    content: 小丸子即將于歸
  - label: D
    content: 丸尾行醫仁心仁術
