  group_stem: '余聽柳敬亭說景陽崗武松打虎，白文與本傳大異。其描寫刻畫，微入毫髮；然又戢截乾淨，並不嘮叨。聲如巨鐘，說至筋節處，叱吒叫喊，洶洶崩屋。武松到店沽酒，店內無人，驀地一吼，店中空缸空甖皆甕甕有聲。閑中著色，細微至此。

    （改寫自張岱柳敬亭說書）


    註：①戢截乾淨：該補敘或該停止之處都很恰當。

