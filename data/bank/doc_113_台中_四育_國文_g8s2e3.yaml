- id: doc_113_台中_四育_國文_g8s2e3_s3_8
  section: 3
  number: 8
  type: single
  page: 2
  stem: 「丞相玄機，神鬼莫測。若某等之見，必棄城而走矣。」這段文句的語氣，與下列何者最相近？
  options:
  - label: A
    content: 雲藩道：「伯母別傷心了，身體禁不住。也要勉強吃點什麼才好。」（張愛玲 花凋）
  - label: B
    content: 「喵子果然聰明，三言兩語便道破了我三十年解不開的疑惑，真不愧每天長時間的沉思和自省。」（流氓阿德 雨天裡的喵子）
  - label: C
    content: 胡屠戶道：「我自倒運，把女兒嫁與你這個現世寶，窮鬼，歷年以來，不知累了我多少。」（儒林外史）
  - label: D
    content: 花鼠說：「你一下要我挑水，一下又要我去拿衣服，到底依那？」（宋澤萊 花鼠仔立志的故事）
  lesson_raw:
    title: 空城計
    basis: 課文原句「丞相玄機，神鬼莫測」出自空城計
