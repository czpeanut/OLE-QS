- id: doc_113_台中_四育_國文_g8s2e3_s4_7
  section: 4
  number: 7
  type: single
  page: 4
  stem: 關於本文，下列何者說明正確？
  options:
  - label: A
    content: 劉伶妻因家貧而勸他戒酒
  - label: B
    content: 「婦捐酒毀器」一句顯示妻子極力阻止劉伶飲酒
  - label: C
    content: 劉伶以攝生為由縱情飲酒
  - label: D
    content: 劉伶在祝示時表示此一醉後將戒酒
  group_stem: '劉伶病酒，渴甚，從婦求酒。婦捐酒毀器，涕泣諫曰：「君飲太過，非攝生之道，必宜斷之！」伶曰：「甚善。我不能自禁，唯當祝鬼神自誓斷之耳！便可具酒肉。」婦曰：「敬聞命。」供酒肉於神前，請伶祝示。伶跪而祝曰：「天生劉伶，以酒為命，一飲一斛，五斗解酲。婦人之言，慎不可聽！」便引酒進肉，隗然已醉矣。

    （世說新語）


    註：①病酒：發酒癮。

    ②捐：放棄。

    ③攝生：養生。

    ④祝：以言詞告神祈福。

    ⑤具：準備。

    ⑥斛：十斗。

    ⑦酲：音ㄔㄥˊ，酒醒後的不適症狀。

    ⑧隗然：酒醉欲倒的樣子。隗，音ㄨㄟˇ。'
