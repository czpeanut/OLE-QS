  group_stem: '【E】

    ### Sharing Housework


    Look at this picture. What do you see? A happy family doing housework together?
    Does your family also help each other at home?


    A study shows that in many families, mothers do more housework than fathers. <u>This</u>
    can make husbands and wives unhappy and even fight about housework. So, sharing
    housework is a must. It helps everyone in the family have a good life.


    What are the <u>advantages</u> of sharing housework? Here are some points from
    Dr. Anderson Sue''s study.


    ■ Many hands make light work. Every person does some housework. No one in the
    family is too tired and can have time for other things.

    ■ Doing housework shows love. A family needs to help each other.

    ■ Children learn a lot from housework. They can know how to cook, clean, and look
    after pets. These are good for the future. Doing housework helps children to be
    more responsible.

    ■ Sharing housework is good for parents'' marriages. Husbands help more at home,
    and their wives are happy. There are few fights between them, too.

    ■ By working together, a family can have a clean and good home to live. It is
    good for body and mind.


