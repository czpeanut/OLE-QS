  group_stem: 'Come and Play Korfball!

    Hi! My name is Leo, and I play Korfball for KN Junior High. Do you know this sport?

    Korfball is a fun game. It’s like basketball but with different rules. For example,
    in Korfball, there are two teams, and each team has eight players: four men and
    four women. The goal is to throw the ball into a korf. The korf is a basket high
    on a pole. Korfball is a fast game. You can’t dribble or run with the ball. Instead,
    you pass the ball to your teammates.

    People in many countries play Korfball, like the Netherlands, Belgium, and Taiwan.
    Everyone can play Korfball. It’s a fun way to get exercise and meet new people.
    So, come and play Korfball! Join our team and have fun!

    🕮 each 每個 goal 目標 throw 丟 pole 杆 dribble 連續運（球） instead 相反的 pass 傳（球） country
    國家'
