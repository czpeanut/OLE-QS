- id: doc_113_高雄_楠梓_英語_g9s2e2_s2_39
  section: 2
  number: 39
  type: single
  page: 4
  stem: ( )39. What do music therapists NOT have their patients do?
  options:
  - label: A
    content: Create moving exercises.
  - label: B
    content: Make their own music.
  - label: C
    content: Talk about their feelings after a song.
  - label: D
    content: Breathe in different ways with the music.
  group_stem: "(B) Music has a lot of power. It calms us as well as gives energy.\
    \ It brings thoughts and feelings to mind. It also makes new memories and unlocks\
    \ old ones. So, it’s no surprise that people use music to treat mind and body\
    \ problems. The practice is called music therapy, and they use all kinds of music\
    \ and tools.\n Music therapists treat people with certain needs. They can be problems\
    \ with speaking, learning, or moving. They can also be more serious like dealing\
    \ with pain, stress, or cancer. Anyone can be treated with music therapy; people\
    \ don’t need a background in music to experience its helpful effects.\n Music\
    \ therapists work with their patients to meet the needs. One main way is getting\
    \ the patients to create music. That includes singing, playing an instrument,\
    \ and writing a song. Another way is having the patients listen to music. As it\
    \ plays, the therapists help patients with breathing or moving exercises. They\
    \ can also have the patients share their feelings afterwards.\n Music therapy\
    \ is all about making people live better. It’s a powerful tool, and it can help\
    \ people of all ages.\n  unlock 打開；therapy 治療；stress 壓力；therapist 治療師；breathe\
    \ 呼吸；effect 效果"
