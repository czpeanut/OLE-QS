- id: doc_113_高雄_楠梓_英語_g9s2e2_s2_36
  section: 2
  number: 36
  type: single
  page: 3
  stem: 'II. 題組：40%(每題2 分)

    ( )36. What is the purpose of the reading?'
  options:
  - label: A
    content: To show readers how the seeds are collected and planted.
  - label: B
    content: To give readers information about the vault.
  - label: C
    content: To tell readers where the vault is and how to get there.
  - label: D
    content: To ask readers to save as many seeds as possible.
  group_stem: "(A) Seeds are found in almost every plant on Earth from flowers to\
    \ fruits and vegetables. They come in lots of different sizes. They are important\
    \ for humans because they allow us to plant them into the ground and grow new\
    \ plants from them. One place near the North Pole(北極圈) thinks that seeds are so\
    \ important that it had a special building built just to hold them all.\n The\
    \ island of Svalbard(斯瓦巴) is mostly snow, ice, and polar bears. It is as far North\
    \ as someone can fly to on an airplane. From a snow-covered mountain, a rectangular,\
    \ gray building called the Svalbard Global Seed Vault can be seen. This building\
    \ is the only one of its kind and is home to over 1,000,000 kinds of seeds but\
    \ can actually hold up to 2.5 billion. The Vault is said to be the safest place\
    \ on Earth for a seed (or a human) to be when the end of the world arrives. It\
    \ is above sea level, which protects it from any ocean flooding. It is also protected\
    \ from earthquakes. The room where the seeds are kept is 100 meters into the mountain,\
    \ and well-protected. The frozen ground keeps the building at -18℃ naturally,\
    \ easily freezing the seed samples, so they don’t need much power to run it.\n\
    \ The idea behind The Vault is to have a backup for all the foods and crops that\
    \ are important to humans. If something really bad happens to the Earth one day\
    \ and all the plants are destroyed, the seeds from the vault can be used to grow\
    \ them again. The seeds are kept in special packages that will keep them safe.\
    \ Packages are then put into black boxes, and those black boxes are put on shelves.\
    \ The seeds will “sleep” for a long time and stay ready to grow at any time. \
    \ rectangular 長方形的；vault 保險庫；billion 十億；flooding 洪水；frozen 冰凍的；backup 備份；crop\
    \ 作物；destroy 毀滅"
