  group_stem: "(E) Dear Editor,\n I’m a big fan of your newspaper, and so are many\
    \ of my friends. We enjoy all the information in your articles.\n On Monday, you\
    \ ran one about some of the best and worst paying jobs in the USA. However, I\
    \ was surprised it didn’t talk about the pay gap. Men get paid a lot for work,\
    \ and women should, too. It’s too bad that they don’t.\n Women make up almost\
    \ half of the workforce. Sadly, women with full-time jobs in the USA only get\
    \ 79 cents for every dollar men make. Because of that, women earn US$10,763 less\
    \ than men every year. Women with university degrees face a higher pay gap, and\
    \ so do women of color. In fact, they have it worse. African American women aren’t\
    \ paid that much, and neither are Latin American women. The first gets 60 cents\
    \ for every dollar paid to white men, and the second gets 55 cents. The truth\
    \ is that working women would make enough money for about 83 more weeks of food\
    \ for their families if they were paid the same as men.\n This pay gap hurts women,\
    \ their families, and businesses. More has to be done to stop it.\n\nSincerely,\n\
    Ruth Bader  editor 編輯；article 文章；pay gap 薪資差異；workforce 勞動人力"
