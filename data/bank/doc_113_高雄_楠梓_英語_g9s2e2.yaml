    \ food. (53) Most mothers in Sweden work, so there’s seldom a housewife at home\
    \ preparing dinner and taking care of their kids. But they still want to do something\
    \ special and hope their kids can join them to make dinner. Tacos, which are easy\
    \ to make and everyone can put what they like in them, (54) . Before dinner, everyone\
    \ is busy preparing their favorite salad, fruits, or meat they will put inside\
    \ their tacos, and it is the time with family on cozy Friday nights.\n\nHere are\
    \ some rules about (55) :\n1. Fredagsmys must happen on Friday.\n2. On Friday,\
    \ you eat tacos.\n3. There must be chips with dips on the table.\n4. There are\
    \ lots of kinds of sweet finger foods in the big bowl.\n5. Never worry about eating\
    \ too much at fredagsmys.\n6. Watching TV is needed.\n7. Done right, fredagsmys\
    \ will leave you asleep on the sofa.\n8. It’s OK to eat the leftover which is\
    \ left on Friday night from the bottom of the bowl for Saturday morning snack.\n\
    \ What a wonderful cozy Friday night!  cozy 溫馨的； dip 調味醬"
