  group_stem: "(C) Ronald Mallett was a scientist. His father died when he was only\
    \ ten years old. He missed his father a lot. One year later after his father died,\
    \ he read H.G. Wells’ The Time Machine, and made up his mind to take a trip back\
    \ in time to save his father. This idea became a lifelong obsession and the basis\
    \ of his research into time travel. After he grew up, he wrote a lot of papers\
    \ about black holes. He believed that people would be able to travel in time.\n\
    \ Ronald Mallett was not the only one who wanted to make time machines. There\
    \ are many scientists who work hard on time travel. However, some people worry\
    \ about one thing: if we could travel back in time and change the history, what\
    \ will happen to the future? Will the future be changed, too?\n In fact, time\
    \ traveling is not the thing we should worry about. Take grandfather paradox as\
    \ an example. If a time traveler goes back to the time when his grandfather is\
    \ young and kills his grandfather, the grandfather will die. Therefore, he won’t\
    \ have any children or even grandchildren. If so, who would kill the grandfather?\n\
    \ Although scientists like Ronald Mallett’s idea to make time machines might sound\
    \ crazy, time traveling can help people know more about the past. When we try\
    \ to stop all kinds of time machines, we should think what we are asking scientists\
    \ to give up and whether this is the best answer to know more about the world.\n\
    \  obsession 念念不忘的事；basis 基礎；research 研究；grandfather paradox 祖父悖論"
