  group_stem: "(D) Cheese is a delicious food that goes great on burgers and pizzas.\
    \ It is tasty on its own too. It’s common pretty much everywhere, and most people\
    \ wouldn’t think twice before tasting a slice of cheddar or a piece of Brie(布里起司).\
    \ However, there is one cheese that should set alarm bells ringing: casu marzu.\n\
    \ Casu marzu is a Sardinian(薩丁尼亞的) cheese made from sheep’s milk. It has been\
    \ produced on the Italian island for hundreds of years. However, it is now illegal\
    \ to sell both in Italy and across the European Union(歐盟). But why? Well, it gets\
    \ its flavor from maggots that live inside it. Casu marzu is traditionally eaten\
    \ while these maggots are still alive. They can cause consumers to experience\
    \ health problems, including vomiting and stomach pains. When eating the cheese,\
    \ a diner will often wear glasses or hold their nose to avoid a maggot jumping\
    \ into their eyes or nostrils. For these reasons, the Guinness World Records listed\
    \ casu marzu as “the most dangerous cheese” in 2009.\n Although it’s illegal to\
    \ sell, many Sardinians still produce casu marzu for their own use. They see the\
    \ cheese as a very important part of their identity and believe the taste is well\
    \ worth the (45) .\n  illegal 違法的；maggot 蛆；traditionally 傳統上；consumer 消費者；vomit\
    \ 嘔吐；nostril 鼻孔；identity 身分"
