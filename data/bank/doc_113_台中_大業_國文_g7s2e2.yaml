  section: 4
  number: 3
  type: single
  page: 4
  stem: 根據本文，作者認為建立良好個人形象的第一步應如何？
  options:
  - label: A
    content: 時常保持笑容，待人和善，廣結善緣
  - label: B
    content: 每天在鏡子前告訴自己：「我可以的！」
  - label: C
    content: 先改善別人對自己的印象
  - label: D
    content: 衣著整齊，打扮光鮮亮麗
  group_stem: '個人形象跟國家形象一樣重要，要建立良好的個人形象，必須先從改善別人對自己的印象，也就是改善「自我形象」做起。

    一個人先要看得起自己，別人才看得起你。這是一個很簡單卻真實的道理，口口聲聲說「我不是讀書的料」的學生，在別人眼光裡一定愈來愈像一個自暴自棄的孩子。

    每逢談到自己的時候，要使用樂觀、進取、肯定和積極的語言，這樣不但能提高自尊心，改善自我形象，也能使別人刮目相看。心理學家說：「一個人對自己天賦的態度，比天賦本身更重要」

    常常想像自己是一個有前途的學生，前途一定大放光明。

    （黃驤<建立個人形象>）'
