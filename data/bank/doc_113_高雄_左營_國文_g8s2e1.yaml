- id: doc_113_高雄_左營_國文_g8s2e1_s2_28
  section: 2
  number: 28
  type: single
  page: 5
  stem: 關於這首樂府詩，下列解釋何者正確？
  options:
  - label: A
    content: 「野死諒不葬，腐肉安能去子逃」：即使客死異鄉，也不願埋葬於荒野，變成殭屍也要逃離此處
  - label: B
    content: 「梟騎戰鬥死，駑馬徘徊鳴」：勇猛的騎兵在戰鬥中犧牲，疲憊不堪的馬兒仍在戰士旁來回悲鳴
  - label: C
    content: 「禾黍不穫君何食？願為忠臣安可得」：忠臣戰死沙場，只剩不事生產的農民，徒增國君的煩憂
  - label: D
    content: 「朝行出攻，暮不夜歸」：忠臣早晨外出征戰，因公事繁多，需要連夜處理，所以無法及時回國。
  group_stem: "戰城南，死郭北，野死➀不葬烏可食。\n為我謂烏：「且➁為客➂豪➃。野死諒➄不葬，腐肉安能去子逃？」\n水深激激➅，蒲葦冥冥➆，梟騎➇戰鬥死，駑馬徘徊鳴。\n\
    梁➈築室➉，何以南？何以北？禾黍不穫君何食？願為忠臣安可得？\n思子良臣，良臣誠可思，朝行出攻，暮不夜歸。\n                      \
    \               佚 名〈戰城南〉\n註：➀野死：戰死荒野。➁且：姑且。➂客：指戰死者，死者多爲外鄉人故稱爲「客」。➃豪：通「嚎」，號哭。➄諒：想必。\n\
    ➅激激：清澈的樣子。➆冥冥：深暗的樣子。➇梟騎：勇武的騎兵。➈梁：橋樑。➉築室：建築軍營堡壘等工事。"
