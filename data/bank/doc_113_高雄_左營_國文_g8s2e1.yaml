  stem: 根據以上文章，可知「地面師」有什麼特色？
  options:
  - label: A
    content: 只進行百億日圓以上的案子
  - label: B
    content: 多為高社經地位的白領階級
  - label: C
    content: 多因受經濟所迫而走上險路
  - label: D
    content: 多以團體行動而且分工精細。
  group_stem: "《地面師》劇情以「地面師」為主軸。「地面」指的是土地，「師」則為專家，這群人自視為土地交易的專家，但實則為進行土地相關詐欺的犯罪分子，利用複雜的土地所有權關係鑽法律漏洞，透過偽造證件、文件，以假冒土地所有人或其代理人，再出售給不知情的買家，因為涉及土地交易，一次騙局往往牽扯到動輒千百萬的金錢交易。地面師往往是一個集團，包括負責主導的「領袖」、安排計畫的「交涉人」、消息靈通的「情報員」、精通法律的「法律專家」、有偽造技術的「文件偽造師」，以及尋找合適冒充者的「選角人」等成員，分工精細以確保計畫順利實施。\n\
    \    而這些地面師不是劇情設定，而是真實存在的。《地面師》改編自日本小說家新庄耕的同名犯罪小說，其故事的原型則是一起在2017年6月發生的「積水房屋地面師詐欺事件」。時逢東京奧運前夕，東京寸土寸金，而位於品川區\
    \ 西五反田的「海喜館」旅館，交通位置優越、腹地600坪，一直是開發商覬覦的對象。而一群地面師則看準時機，冒充土地所有者，與積水房屋簽訂了70億日圓的土地購買合約。積水房屋陸續支付了以億為單位的訂金與費用，直到被通知所有權轉移登記遭到駁回，才意識到問題的嚴重性並報警。後來，有10名詐欺犯遭到逮捕，但據說集團中的「領導」未落網，損失的55億日圓也未能全數討回。\n\
    \    「積水房屋」為日本最大的住宅建造商之一，他們在這起案件中被騙取了55億日圓，也因此暴露出日本不動產交易體系的疏漏與盲點，亦引發了社會對房地產市場安全性的熱議。事後，相關人員被指出許多房屋土地買賣失誤與盲點：比如不動產公司為了防止地面師詐欺，會向周遭鄰居確認地主的真實身份，但實際上卻未執行；為了快速推動交易，事業部成員在正式審批前便先帶社長實地考察，以獲取社長的特別批准，跳過公司的正常審批機制，後來也在公司內部被稱為「社長案件」。這些元素也都被轉化為故事的一部分。至於「海喜館」後來因為年久失修，最後真正的地主把土地賣給不動產公司「旭化成」，爾後被打造了一棟名為「Atlas\
    \ Tower 五反田」的高級住宅大樓，於2024年3月開始交屋。\n                                         陳怡秀(節選自「劇夠DRAMAGO」網站2024.08.01)"
