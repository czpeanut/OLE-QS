- id: doc_113_高雄_左營_國文_g8s2e1_s2_26
  section: 2
  number: 26
  type: single
  page: 5
  stem: 「把晌午一下子奏成了黃昏」，這句話所要表達的意思較為接近何者？
  options:
  - label: A
    content: 大雨滂沱，使得天色昏暗
  - label: B
    content: 作者情緒低落，意志消沉
  - label: C
    content: 形容時光飛逝，夕陽西下
  - label: D
    content: 雨聲大得使人們氣脫委頓。
  group_stem: "雨天的屋瓦，浮漾溼溼的流光，灰而溫柔，迎光則微明，背光則幽黯，對於視覺，是一種低沉的安慰。至於雨敲在鱗鱗千瓣的瓦上，由遠而近，輕輕重重輕輕，夾著一股股的細流沿瓦漕與屋簷潺潺瀉下，各種敲擊音與滑音密織成網，誰的千指百指在按摩耳輪。「下雨了」，溫柔的灰美人來了，她冰冰的纖手在屋頂拂弄著無數的黑鍵啊灰鍵，把晌午一下子奏成了黃昏。\n\
    \    在古老的大陸上，千屋萬戶是如此。二十多年前，初來這島上，日式的瓦屋亦是如此。先是天黯了下來，城市像罩在一塊巨幅的毛玻璃裡，陰影在戶內延長復加深。然後涼涼的水意瀰漫在空間，風自每一個角落裡旋起，感覺得到，每一個屋頂上呼吸沉重都覆著灰雲。雨來了，最輕的敲打樂敲打這城市，蒼茫的屋頂，遠遠近近，一張張敲過去，古老的琴，那細細密密的節奏，單調裡自有一種柔婉與親切，滴滴點點滴滴，似幻似真，若孩時在搖籃裡，一曲耳熟的童謠搖搖欲睡，母親吟哦鼻音與喉音。或是在江南的澤國水鄉，一大筐綠油油的桑葉被嚙於千百頭蠶，細細瑣瑣屑屑，口器與口器咀咀嚼嚼。雨來了，雨來的時候瓦這麼說，一片瓦說千億片瓦說，說輕輕地奏吧沉沉地彈，徐徐地叩吧撻撻地打，間間歇歇敲一個雨季，即興演奏驚蟄到清明，在零落的墳上冷冷奏輓歌，一片瓦吟千億片瓦吟。\n\
    \                                      余光中〈聽聽那冷雨〉"
