  group_stem: "鄭 子產有疾。謂子太叔曰：「我死，子必為政。唯有德者能以寬服民，其次莫如猛。夫火烈，民望而畏之，故鮮死焉；水懦弱，民狎➀而翫➁之，則多死焉。故寬難。」疾數月而卒。太叔為政，不忍猛而寬。鄭國多盜，取➂人於萑符➃之澤。太叔悔之，曰：「吾早從夫子，不及此。」興徒兵以攻萑符之盜，盡殺之，盜少止。\n\
    仲尼曰：「善哉！政寬則民慢，慢則糾之以猛。猛則民殘，殘則施之以寬。寬以濟猛，猛以濟寬，政是以和。」\n                          \
    \                                      《左傳．子產論政寬猛》\n註：➀狎：輕忽。➁翫：通「玩」，玩弄。➂取：同「聚」。➃萑符：ㄏㄨㄢˊ\
