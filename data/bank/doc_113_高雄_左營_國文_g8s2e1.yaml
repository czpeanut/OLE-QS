- id: doc_113_高雄_左營_國文_g8s2e1_s2_32
  section: 2
  number: 32
  type: single
  page: 6
  stem: 根據本文，下列敘述何者正確？
  options:
  - label: A
    content: 「燕雀安知鴻鵠之志」指的是「庸俗者無法理解志向遠大者的抱負」
  - label: B
    content: 陳勝起義是因為天雨以至於延遲抵達目的地，被判死刑因而起身反抗
  - label: C
    content: 宮殿門口的官吏要綁陳勝的友人來治罪，是因為陳勝的友人企圖行刺
  - label: D
    content: 陳勝不滿友人四處洩露軍機，便下令殺了友人，才終究完成抗秦大業。
  group_stem: "陳勝年輕時幫人種田，有一天做累了在田埂上休息，說：「將來如果我富貴了，可不能忘掉這段困苦的日子！」同伴笑他說：「你只不過是個幫人種田的雇工，怎麼可能富貴騰達呢？」陳勝說：「燕雀安知鴻鵠之志？」\n\
    後來陳勝和吳廣擔任戍卒（徵調民兵赴邊塞）小隊長，道路因為天雨而阻絕，眼看無法在期限內到達報到地點，依秦朝律法，那是死罪。陳勝對吳廣說：「超過期限是死，逃亡被捉是死，起義失敗也不過一死，何不痛痛快快幹一場？」\n\
    九百戍卒於是揭竿起義，敲響了秦朝滅亡的第一聲喪鐘，陳勝自立為「陳王」。陳勝的舊日夥伴到陳王的宮殿，敲著宮門說要找陳勝，宮門官吏要綁他來治罪，恰巧陳王外出，那人就大喊陳王的名字，陳勝停車召見，將老朋友載回宮中。進了王宮，客人驚嘆：「你這個王的宮殿可真大呀！」可是這位客人舉止隨便，常跟人談起陳王卑微時的舊事（少不了糗事），於是有人向陳王進言：「你這位客人口沒遮攔，會破壞你的威嚴。」於是陳勝下令殺了這位貧賤之交。陳勝最終失敗身亡。\n\
    一個農夫的「鴻鵠之志」能夠掀起改朝換代的狂濤巨浪，實予後人「將相本無種，男兒當自強」的無窮信心；然而他非但忘了過去說過的「不忘貧賤之日」，甚至「鴻鵠」還殺了「燕雀」，說明了空有大志卻無大量，終究成不了大事。\n\
    \                                                    《公孫策說名句故事》"
