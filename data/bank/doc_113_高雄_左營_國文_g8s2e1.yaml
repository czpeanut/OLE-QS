- id: doc_113_高雄_左營_國文_g8s2e1_s2_34
  section: 2
  number: 34
  type: single
  page: 7
  stem: 關於本文的分析，下列敘述何者正確？
  options:
  - label: A
    content: 文章使用第二人稱，描寫自己的内心想法，頗能引起共鳴
  - label: B
    content: 以自身求學過程中所遭遇的困難，說明想要成功絕非易事
  - label: C
    content: 在追求夢想的過程中，作者從學校所學的專業派上了用場
  - label: D
    content: 作者嘗試過許多戶外運動，但仍未找到自己真正想做的事。
  group_stem: "在社會價值的制約下，在長輩父母的期望下，我老老實實地在升學體制中，一步一步地走向璀璨的人生，這個過程中，雖然我衣食無缺，也曾經帶活動、搞社團，發展讀書外的興趣。整體上來說，我過得快樂，心底卻知道我離小時候志願的快樂的境界，還差了一大截。拿到博士學位之後，我告訴自己，再不給自己機會，我就只是浪費更多時間罷了。我必須知道什麼是我想做的事。\n\
    我開始往戶外追尋，只因為山野溪流間似乎有和我心靈共鳴的聲音。剛開始的時候，相當困難。我很會讀書，但是我從小跑不快也跳不高。為了打足體力的基礎，我給自己定下鍛鍊計畫，並且嚴格遵守，終於日積月累之下，也有小成。跨過那門檻之後，也驚喜的發現，戶外運動中，很多技術和危機判斷部分，需要縝密的頭腦，我本身是資訊科學出身，倒是在分析和學習技術上，占了很多便宜。幾年下來，嘗試過滑雪、激流泛舟、登山、攀岩等運動，終於找到命定的最愛：攀岩。而在攀岩這一塊，我最熱愛的還是高山攀岩：可以在山野無人之境，利用攀岩技術，攀上聳立的山峰，享受清風浮雲和絕佳視野。過程中有無比的自由，也充分挑戰自己，這滿足難以言喻。\n\
    撇下了累積經年的資訊工程訓練，走上了全無基礎的戶外探索的道路，憑著的是一分直覺的嚮往，一路上走得艱辛。有趣的是，母親身教堅持、不放棄、對自己要求嚴苛的原則，全在這時候成為我咬牙撐下去的動力，而這一撐下去，在與山、雪、冰、岩的互動中找到強大的自信、自由和成長。我終於蜕變成完整的人。與大自然對話的過程中，我常常反思母女關係，也許母親像陡峭、美麗、誘惑人的岩壁，剛開始我不知道怎麽爬，岩壁的難度讓我連地表都離不了。也許我可以用工具敲敲打打，把岩壁打鑿出一個個坑坑洞洞，讓手腳有著力處，但是岩壁也不像以往那麼漂亮了。我只好暫時離開到別處去修練，把對這道岩壁深厚的眷戀放在心底。\n\
    周遊四方長見識之後，再回到這道岩壁，眼界不同的我看出一些斷斷續續的可攀登片段，只是還不能一氣呵成，只好反躬自省琢磨可再加強的技巧與力量。最後脱胎換骨回來，一定可以看出一條完整的路線，展開攀登嘗試。\n\
    \                                                             易思婷〈睡在懸崖上的人〉"
