questions:
- id: doc_113_高雄_左營_國文_g8s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 下列「 」中的讀音，何組讀音完全相同？
  options:
  - label: A
    content: 樹「薯」澱粉／簽「署」文書
  - label: B
    content: 肆無忌「憚」／「殫」精竭慮
  - label: C
    content: 不「溯」既往／形「塑」意象
  - label: D
    content: 「挾」帶毒品／汗流「浹」背。
- id: doc_113_高雄_左營_國文_g8s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列「 」中的注音寫成國字後，何組字形完全相同？
  options:
  - label: A
    content: 通「ㄒㄧㄠ」達旦／九「ㄒㄧㄠ」雲外
  - label: B
    content: 兵「ㄖㄨㄥˊ」相見／投筆從「ㄖㄨㄥˊ」
  - label: C
    content: 「ㄑㄧㄤˇ」人所難／趁火「ㄑㄧㄤˇ」劫
  - label: D
    content: 不避「ㄌ一ˇ」俗／有條有「ㄌ一ˇ」。
- id: doc_113_高雄_左營_國文_g8s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 下列「 」中的疊字詞，何組皆為狀聲詞？
  options:
  - label: A
    content: 「涓涓」細流，別增風韻／明月夜照聲「琅琅」
  - label: B
    content: 飢腸「轆轆」如熬煎／疾病侵襲，他已「奄奄」一息
  - label: C
    content: 「盈盈」一水間，脈脈不得語／磨刀「霍霍」向豬羊
  - label: D
    content: 亭亭山上松，「瑟瑟」谷中風／揮手自茲去，「蕭蕭」班馬鳴。
- id: doc_113_高雄_左營_國文_g8s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 關於〈讓春天從高雄出發〉一詩的理解，下列何者正確？
  options:
  - label: A
    content: 「春天回來了」：以歡欣的心情，透過熱情的筆調，期許高雄文藝如春天般生機勃勃，甚至引領風潮
  - label: B
    content: 「讓木棉花的火把／用越野賽跑的速度／一路向北方傳達」：強調花開花落的速度極快，像賽跑一般
  - label: C
    content: 前六句以「海峽」、「潮水」、「堤岸」，由近而遠引領讀者的目光，展現出對高雄工業蓬勃發展的讚賞
  - label: D
    content: 末句畫龍點睛，將胸中氣勢傾注於一個短句，全力祈願，把握時機返回高雄家鄉，追尋自己的理想。
  lesson_raw:
    title: 讓春天從高雄出發
    basis: 題目指名〈讓春天從高雄出發〉
- id: doc_113_高雄_左營_國文_g8s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 關於〈控訴一枝煙囪〉一詩的詩意說明，何者正確？
  options:
  - label: A
    content: 以「不堪的髒話」指出不法分子囂張的行徑，破壞社會的善良風氣
  - label: B
    content: 以「一只煙灰碟」指高雄地形使空汙難以散去，呼籲市民戒除抽菸的習慣
  - label: C
    content: 「黑懨懨的蝴蝶」指蝴蝶被黑煙薰得無法呼吸，代表汙染影響大，連動物也無法倖免
  - label: D
    content: 以「裝出戒煙的樣子」來比喻工廠為了私利，躲避空汙檢測，絲毫不顧及他人健康及感受。
  lesson_raw:
    title: 控訴一枝煙囪
    basis: 題目指名〈控訴一枝煙囪〉
- id: doc_113_高雄_左營_國文_g8s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 〈木蘭詩〉中詩句，與其意旨說明的配對，下列何者正確？
  options:
  - label: A
    content: 「爺孃聞女來，出郭相扶將。」──描寫木蘭返家時，家人驚訝錯愕、忐忑不安的心情
  - label: B
    content: 「朝辭爺孃去，暮宿黃河邊。」──形容木蘭離鄉漸遠、行軍快速，呈現出時空的推移
  - label: C
    content: 「朔氣傳金柝，寒光照鐵衣。」──透露出征戰頻繁、死傷慘烈，暗示木蘭心中的孤寂
  - label: D
    content: 「策勳十二轉，賞賜百千強。」──點出木蘭代父從軍的原因，凸顯其忠勇聰慧的形象。
  lesson_raw:
    title: 木蘭詩
    basis: 題目指名〈木蘭詩〉
- id: doc_113_高雄_左營_國文_g8s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 關於〈木蘭詩〉的作法，下列敘述何者正確？
  options:
  - label: A
    content: 是一首歌頌人物為題材的敘事詩，採用順敘的手法，呈現人物鮮明形象
  - label: B
    content: 透過繁筆強調戰爭過程，描寫奔赴戰場、深入敵境，及凱旋歸來的狀況
  - label: C
    content: 詩中出現許多迴環疊沓、整齊重複之字句，由此可以懷疑為後人所潤飾
  - label: D
    content: 全詩採用寫實的筆法，藉由木蘭驍勇善戰的事蹟，反省性別歧視的觀念。
  lesson_raw:
    title: 木蘭詩
    basis: 題目指名〈木蘭詩〉
- id: doc_113_高雄_左營_國文_g8s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 有關「樂府詩」的說明，下列何者正確？
  options:
  - label: A
    content: 魏、晉以後，詩人模仿樂府詩，要入樂，才能稱為樂府
  - label: B
    content: 字數不限，多士大夫所作，以五、七言為主，也有雜言
  - label: C
    content: 詩句多反覆吟詠，不避雷同，語言純樸自然，形象生動
  - label: D
    content: 樂府詩的格律不要求對仗，但偶數句須押韻，一韻到底。
- id: doc_113_高雄_左營_國文_g8s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 南北朝因地域與風俗的差異，在情感表達上亦各有不同，大體而言，北朝民歌大多直率豪放、質樸自然；南朝民歌則多清麗纏綿、委婉含蓄。請依此特點判斷，下列何者是「北朝民歌」？
  options:
  - label: A
    content: 始欲識郎時，兩心望如一。理絲入殘機，何悟不成匹
  - label: B
    content: 淒淒復淒淒，嫁娶不須啼。願得一心人，白頭不相離
  - label: C
    content: 攬枕北窗臥，郎來就儂嬉，小喜多唐突，相憐能幾時
  - label: D
    content: 男兒欲作健，結伴不須多。鷂子經天飛，群雀兩向波。
- id: doc_113_高雄_左營_國文_g8s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 下列「 」內的字，何組字義相同？
  options:
  - label: A
    content: 任重「道」遠／老 莊之「道」
  - label: B
    content: 「怨」天尤人／任勞任「怨」
  - label: C
    content: 勝「固」欣然／鞏「固」國防
  - label: D
    content: 雙喜「臨」門／「臨」陣脫逃。
- id: doc_113_高雄_左營_國文_g8s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 有關〈運動家的風度〉一文的寫作方法，下列何者正確？
  options:
  - label: A
    content: 首段採用破題法接點明題旨，以說明運動對身體健康的重要性帶入正文
  - label: B
    content: 以自身的運動經驗來著筆，將運動從體育的範疇延伸至品德修養的層面
  - label: C
    content: 引用古今中外的名言與事例強化論點，進而增加文章的說服力與可讀性
  - label: D
    content: 結尾以譬喻法總結全文，要積極培養運動家精神，展現莊嚴公正的風範。
  lesson_raw:
    title: 運動家的風度
    basis: 題目指名〈運動家的風度〉
- id: doc_113_高雄_左營_國文_g8s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 請判斷下列文句，何者用字完全正確？
  options:
  - label: A
    content: 這篇文章雖然篇幅不長，卻能把複雜的問題講解得清晰透澈，真正做到了言簡意賅
  - label: B
    content: 用寫匿名信的方式無中生有，栽贓誣陷，這種暗劍傷人的行為，是要負法律責任的
  - label: C
    content: 他能在短時間內獲得升遷，是因為擅長巧言令色，逢迎拍馬，這行為實在令人不恥
  - label: D
    content: 這場比賽十分驚險，多虧所有選手發揮了同舟共濟的團隊精神，最後才能羸得勝利。
- id: doc_113_高雄_左營_國文_g8s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 關於〈運動家的風度〉一文，下列敘述何者有誤？
  options:
  - label: A
    content: 「勝固欣然，敗亦可喜」，這句話正是做到了所謂「勝不驕，敗不餒」
  - label: B
    content: 「言必信，行必果」是指說話做事堅定信實，要秉持貫徹始終的精神
  - label: C
    content: 「健全的心靈，寓於健全的身體」意即健全的心靈是身體健康的基礎
  - label: D
    content: 「君子不怨天，不尤人」是服輸精神的展現，也呈現自我反省的態度。
  lesson_raw:
    title: 運動家的風度
    basis: 題目指名〈運動家的風度〉
- id: doc_113_高雄_左營_國文_g8s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 「抽打自己的鞭子要掌握在自己的手裡，在漫長的人生道路的每一步上，都要經常鞭策自警，萬不可以為有過一兩次抽打就可以沿途平安了。」這段話的旨意，與下列何者最為接近？
  options:
  - label: A
    content: 在漫長的人生道路中，最幸福的並不是事業有成就，而是健康平安
  - label: B
    content: 在我們的人生中出現的每一個人，都值得我們學習效法與引以為戒
  - label: C
    content: 縱使人生道路上荊棘遍布，但是只要懷抱正向信念，終能柳暗花明
  - label: D
    content: 人生無時無刻都不能夠鬆懈，以免一不小心就會失足或是誤入歧途。
- id: doc_113_高雄_左營_國文_g8s2e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: '（李靖夫人新生一子，有一道人欲收為徒弟。)道人曰：「將軍有幾位公子？」李靖答曰：「不才有三子：長曰金吒，拜五龍山雲霄洞 文殊廣法天尊為師；次曰木吒，拜九宮山
    白鶴洞 普賢真人為師。老師既要此子為門下，但憑起一名字，便拜道長為師。」道人曰：「此子第三，取名叫做哪吒。」     《封神演義》

    根據文中人物的關係，下列說明何者正確？'
  options:
  - label: A
    content: 金吒對他人稱哪吒為「家弟」
  - label: B
    content: 李靖對他人稱哪吒為「小犬」
  - label: C
    content: 木吒對他人稱李夫人為「令堂」
  - label: D
    content: 道人稱木吒與哪吒為「賢喬梓」。
- id: doc_113_高雄_左營_國文_g8s2e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 郝順利同學想要寫一封信給甄仁慈老師，下列有關書信格式的敘述，何者正確？
  options:
  - label: A
    content: 書信開頭的提稱語可使用「仁慈 吾師膝前」
  - label: B
    content: 書信裡的問候語則可以使用「敬請  大安」
  - label: C
    content: 若使用直式信封，應於右邊書寫自己的住址
  - label: D
    content: 信封的收啟字樣可寫上「甄仁慈 老師 道啟」。
- id: doc_113_高雄_左營_國文_g8s2e1_s1_17
  section: 1
  number: 17
  type: single
  page: 3
  stem: 下列有關書信與便條的敘述，何者說明有誤？
  options:
  - label: A
    content: 便條書寫要把握「精簡達意」的原則，應酬語、客套話可以省略
  - label: B
    content: 對於尊長和剛結交的朋友盡量避免使用便條，以免顯得不夠莊重
  - label: C
    content: 書信中提到尊親屬時，可使用在原行空一格的「平抬」表示尊敬
  - label: D
    content: 書寫信封時，信封上「收信人」的稱謂是送信人對收信人的稱呼。
- id: doc_113_高雄_左營_國文_g8s2e1_s1_18
  section: 1
  number: 18
  type: single
  page: 3
  stem: 《戰國策》:「韓子盧者，天下之疾犬也；東郭逡者，海内之狡兔也。韓子盧逐東郭逡，環山者三，騰山者五，兔極於前，犬廢於後，犬兔俱罷，各死其處。田父見之，無勞倦之苦，而擅其功。」根據這段文字，下列敘述何者正確？
  options:
  - label: A
    content: 韓子盧是一隻病弱的犬隻，而東郭逡是敏捷的兔子
  - label: B
    content: 韓子盧與東郭逡的追逐，雙方勢均力敵，互有領先
  - label: C
    content: 韓子盧與東郭逡意識到兔死狗烹之理而停止了追逐
  - label: D
    content: 田父所代表的是鷸蚌相持，最後坐收漁翁之利的人。
- id: doc_113_高雄_左營_國文_g8s2e1_s1_19
  section: 1
  number: 19
  type: single
  page: 3
  stem: 「詩是『煎』出來的，有時要用文火，有時要用武火，但最怕無物可煎。詩是『捕捉』過來的，有時會抓到小野兔，有時會碰到難纏的狗熊，但最怕『陷阱』始終是空的。然而更重要的是：『火』隨時要點著，『陷阱』要隨時安放，隨時去巡察。詩若要靠『偶然』去撞上，機會真是少啊！」這段文字的主要含義，與下列何者最接近?
  options:
  - label: A
    content: 作品的產生是得之於長期的鍛鍊與醞釀
  - label: B
    content: 寫詩的素材必定要精挑細選，去蕪存菁
  - label: C
    content: 好詩暗藏文學陷阱，引誘讀者細細品味
  - label: D
    content: 靈感不必向外尋求，順其自然即有所得。
- id: doc_113_高雄_左營_國文_g8s2e1_s1_20
  section: 1
  number: 20
  type: single
  page: 3
  stem: 「我們拚命地學習如何成功衝刺一百米，但是没有人教過我：你跌倒時，怎麼跌得有尊嚴；你痛得無法忍受時，用什麼樣的表情去面對别人；心像玻璃碎了一地時，怎麼收拾？」這段話的主旨，最接近下列哪一個說法？
  options:
  - label: A
    content: 歷經失敗才能夠領會成功的訣竅
  - label: B
    content: 人必須培養面對失敗挫折的能力
  - label: C
    content: 失敗的經驗總是比成功更為可貴
  - label: D
    content: 承受困頓是追求卓越必經的過程。
- id: doc_113_高雄_左營_國文_g8s2e1_s1_21
  section: 1
  number: 21
  type: single
  page: 3
  stem: "青青河邊草，綿綿思遠道。遠道不可思，夙昔夢見之。\n夢見在我傍，忽覺在他鄉。他鄉各異縣，輾轉不可見。\n枯桑知天風，海水知天寒。入門各自媚，誰肯相爲言？\n\
    客從遠方來，遺我雙鯉魚。呼兒烹鯉魚，中有尺素書。\n長跪讀素書，書中竟何如？上有加餐食，下有長相憶。\n                         \
    \   佚名〈飲馬長城窟行〉\n關於本詩內容，下列何者正確？"
  options:
  - label: A
    content: 本詩運用了類疊、設問等修辭技巧
  - label: B
    content: 本詩以第一人稱男子視角，敘述事情的經過
  - label: C
    content: 詩末描寫妻子以長跪之姿讀素書，內心悲痛欲絕
  - label: D
    content: 客人從遠方來團聚，帶來鯉魚，呼兒烹調，稍解相思之苦。
- id: doc_113_高雄_左營_國文_g8s2e1_s1_22
  section: 1
  number: 22
