  section: 4
  number: 46
  type: single
  page: 7
  stem: 根據上文，請問阿Q 的處世態度最接近下列何者？
  options:
  - label: A
    content: 言多必失，不與人爭
  - label: B
    content: 豁達樂觀，不受環境影響
  - label: C
    content: 堅強自信，雖千萬人吾往矣
  - label: D
    content: 自欺欺人，追求心理上的勝利
  group_stem: "（四）\n    阿Q「先前闊」，見識高，而且「真能做」，本來幾乎是一個「完人」了，但可惜他體質上還有一些缺點。最惱人的是在他頭皮上，頗有幾處不知起於何時的癩瘡疤。這雖然也在他身上，而看阿Q\
    \ 的意思，倒也似乎以為不足貴的，因為他諱說「癩」以及一切近於「賴」的音，後來推而廣之，「光」也諱，「亮」也諱，再後來，連「燈」「燭」都諱了。一犯諱，不問有心與無心，阿Q\
    \ 便全疤通紅的發起怒來，估量了對手，口訥的他便罵，氣力小的他便打；然而不知怎麼一回事，總還是阿Q 吃虧的時候多。於是他漸漸的變換了方針，大抵改為怒目而視了。\n\
    \    誰知道阿Q 採用怒目主義之後，未莊的閒人們便愈喜歡玩笑他。一見面，他們便假作吃驚的說：「噲，亮起來了。」\n    阿Q 照例的發了怒，他怒目而視了。\n\
    \   「原來有保險燈在這裏！」他們並不怕。\n    阿Q 沒有法，只得另外想出報復的話來：「你還不配……」這時候，又彷彿在他頭上的是一種高尚的光榮的癩頭瘡，並非平常的癩頭瘡了；但上文說過，阿Q\
    \ 是有見識的，他立刻知道和「犯忌」有點牴觸，便不再往底下說。\n    閒人還不完，只撩他，於是終而至於打。阿Q 在形式上打敗了，被人揪住黃辮子，在壁上碰了四五個響頭，閒人這才心滿意足的得勝地走了。阿Q\
    \ 站了一刻，心裏想，「我總算被兒子打了，現在的世界真不像樣……」於是也心滿意足的得勝地走了。\n    阿Q 想在心裏的，後來每每說出口來，所以凡是和阿Q\
    \ 玩笑的人們，幾乎全知道他有這一種精神上的勝利法，此後每逢揪住他黃辮子的時候，人就先一著對他說：「阿Q，這不是兒子打老子，是人打畜生。自己說：人打畜生！」\n\
    \    阿Q 兩隻手都捏住了自己的辮根，歪著頭，說道：「打蟲豸，好不好？我是蟲豸—還不放麽？」\n    但雖然是蟲豸，閒人也並不放，仍舊在就近什麼地方給他碰了五六個響頭，這才心滿意足的得勝地走了，他以為阿Q\
    \ 這回可遭了瘟。然而不到十秒鐘，阿Q 也心滿意足的得勝地走了，他覺得他是第一個能夠自輕自賤的人，除了「自輕自賤」不算外，餘下的就是「第一個」。狀元不也是「第一個」麽？「你算是什麼東西」呢？\n\
    \n――節錄自魯迅 阿Q 正傳"
