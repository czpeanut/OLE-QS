- id: doc_113_高雄_左營_國文_g8s2e3_s4_49
  section: 4
  number: 49
  type: single
  page: 8
  stem: 上文中，作者提到：「於是我想，或許時機已經成熟了……」請問作者指的應該是下列何事？
  options:
  - label: A
    content: 將台灣山區原始林列入世界遺產保護區
  - label: B
    content: 舉辦植物界的台灣大使選拔活動
  - label: C
    content: 著手進行對台灣林木拍攝等身照的計畫
  - label: D
    content: 將台灣杉正名為「撞到月亮的樹」
  group_stem: "（五）\n    在台灣森林從事樹冠層生態研究多年，我深知台灣山區原始林的美麗與狂野，絕不輸這些聯合國公告的世界遺產等級保護區，因此我一直夢想著進行對台灣山區原始林的等身照拍攝計畫。\n\
    \    就在2016 年8 月，我在倫敦的國際樹冠層研討會中偶然接觸到珍•桑格博士，聽了她分享的簡報，介紹他們在紐西蘭北島與當地的樹冠層研究者合作，拍攝了一株樹高約45\
    \ 公尺的當地特有針葉樹—紐西蘭陸均松的等身照片。拜現代繩索攀樹技巧的進步及當代數位影像的技術所賜，他們花費的預算比數年前《國家地理》雜誌團隊還少，卻完成了足以比擬2009\
    \ 年的紅杉等身照。於是我想，或許時機已經成熟了，我在研討會中詢問珍•桑格博士，她的團隊有沒有意願來台灣拍攝東亞最高的樹種：台灣杉？\n    若要在植物界徵選一位台灣大使的話，我必定會推選台灣杉。\n\
    \    台灣杉的學名Taiwania cryptomerioides 是1906 年由日本學者早田文藏正式發表，以Taiwan 的拉丁語轉化為屬名，模式標本採集於南投的烏松坑，是唯一以台灣作為拉丁屬名的物種，與紅檜、台灣扁柏、香杉、台灣肖楠合稱為台灣針葉樹五木，常一枝獨秀聳立在稜線上，被譽為台灣針葉樹的帝王。事實上，若以高度而言，台灣杉的確是東亞最高的樹種，過去的伐木史上偶有樹高超過90\
    \ 公尺的傳言，不過目前我們還未見過如此巨大的生立木或木材的正式紀錄。\n    台灣杉是上一紀冰河時期的孑遺物種，被國際自然保護聯盟列入易危物種，除了台灣以外，只有少量族群零星分布於中國西南、緬甸以及越南，台灣山區的族群可以說是全球最為豐富的，尤其是位於高雄、屏東與台東交界的雙鬼湖地區，其大面積純林是相當難得的世界遺產，被魯凱族稱為「撞到月亮的樹」。\n\
    \         \n改寫自徐嘉君 國家地理•專題報導—撞到月亮的樹：台灣杉三姐妹"
