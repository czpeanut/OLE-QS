- id: doc_113_高雄_左營_國文_g8s2e3_s4_41
  section: 4
  number: 41
  type: single
  page: 5
  stem: 根據甲文與乙文，依序填入標題中的「□□□□」，請問下列何者最為恰當？
  options:
  - label: A
    content: 甲：過度觀光／乙：都市發展、觀光公害
  - label: B
    content: 甲：觀光公害／乙：振興地方、過度觀光
  - label: C
    content: 甲：旅遊需求／乙：熱門景點、觀光經濟
  - label: D
    content: 甲：城市壓力／乙：地區特色、文化刺激
  group_stem: '（甲）

    2024 年4 月起，義大利的威尼斯將在假日旅遊旺季的特定時間，徵收5 歐元的「入城費」，徵費對象為不過夜的外地旅客；當地居民、通勤族及學生等則不需徵費。


    由於威尼斯每年迎來大量遊客，它是最容易遭受觀光壓力的城市之一。聯合國 教科文組織甚至建議將威尼斯列入「瀕危世界遺產」名單。當地政府推行入城費政策，目的是提高當地旅遊產業的可持續性。


    根據當地統計，一日遊訪客是威尼斯總遊客數的一半，但為當地創造的經濟效益卻只有兩成左右。因此若能減少一日遊訪客人數，轉而吸引更多願意長時間停留、消費的旅客，自然也會增加觀光收益。


    儘管部分居民贊同徵費，主張費用可協助解決遊客過多的問題，然而，也有團體擔憂威尼斯會因此喪失原有的城市形象。該團體負責人表示：「幾乎整個城市都不贊成對這個城市徵收入城費，威尼斯不是一座大型遊樂園。」


    ――改寫自威尼斯4 月將收5 歐元入城費！應對「□□□□」還有哪些旅遊條例？）

    （乙）

    日本2024 年新版觀光白皮書的內容指出，訪日遊客人數已恢復到疫情前2019 年的80%水準。然而，大多數觀光客仍集中在東京、大阪和京都等熱門觀光都市，因此，如何將遊客的旅遊需求擴展到偏遠地區，成為當前重要挑戰。


    為此，當地政府致力於發掘各地區獨有的特色旅遊體驗，並提升工作人員的語言能力，同時增加直飛地方機場的航班。此外，根據調查，訪日遊客除了對美食、購物和著名景點有興趣外，對體驗「歷史與日常生活」的遊客比例也有所提升。


    因此，推展現場體驗生活方式和文化的「體驗式服務」，將成為吸引遊客的關鍵策略。然而，隨著觀光人數的增加，部分地區也出現過度旅遊的現象，影響當地居民的日常生活。為此，觀光廳已選定二十個地區作為先行示範區，商議如何解決當地的垃圾、交通堵塞等問題。


    ――改寫自日本公布新版觀光白皮書：強調「□□□□」與應對「□□□□」'
