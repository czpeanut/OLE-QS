  group_stem: "（三）\n古人云：「千載一聖，猶旦暮也；五百年一賢，猶比①膊也。」言聖賢之難得，疏闊如此。儻②遭不世③明達君子，安可不攀附景仰之乎？\n\
    \n    吾生於亂世，長於戎馬，流離播越，聞見已多；所值名賢，未嘗不心醉魂迷向慕之也。人在少年，神情未定，所與款狎④，熏漬陶染，言笑舉動，無心於學，潛移暗化，自然似之，何況操履⑤藝能⑥，較明易習者也？\n\
    \n    是以與善人居，如入芝蘭之室，久而自芳也；與惡人居，如入鮑魚之肆，久而自臭也。墨翟悲於染絲，是之謂矣，君子必慎交遊焉。孔子曰：「無友不如己者。」顏、閔⑦之徒，何可世得！但優於我，便足貴之。\n\
    \n    世人多蔽，貴耳賤目，重遙親近，少長周旋，如有賢哲，每相狎侮，不加禮敬。他鄉異縣，微藉風聲，延頸企踵，甚於饑渴。校其長短，核其精粗，或彼不能如此矣，所以魯人謂孔子為「東家丘⑧」。昔虞國\
    \ 宮之奇，少長於君，君狎之，不納其諫，以至亡國；不可不留心也。\n※註解：\n① 比：音ㄅㄧˋ，緊靠② 儻：同「倘」，如果、倘若③ 不世：世間所罕有\n\
    ④ 款狎：親近、親附⑤ 操履：素行，平日所遵守及履行的事⑥ 藝能：技藝才能。\n⑦ 顏、閔：指顏回和閔子騫。他們都是孔門的模範人物\n⑧ 東家丘：孔丘的西鄰不知其才能，輕蔑地稱呼他為「東家丘」\n\
    ――顏之推 顏氏家訓•慕賢篇"
