    \ 是有見識的，他立刻知道和「犯忌」有點牴觸，便不再往底下說。\n    閒人還不完，只撩他，於是終而至於打。阿Q 在形式上打敗了，被人揪住黃辮子，在壁上碰了四五個響頭，閒人這才心滿意足的得勝地走了。阿Q\
    \ 站了一刻，心裏想，「我總算被兒子打了，現在的世界真不像樣……」於是也心滿意足的得勝地走了。\n    阿Q 想在心裏的，後來每每說出口來，所以凡是和阿Q\
    \ 玩笑的人們，幾乎全知道他有這一種精神上的勝利法，此後每逢揪住他黃辮子的時候，人就先一著對他說：「阿Q，這不是兒子打老子，是人打畜生。自己說：人打畜生！」\n\
    \    阿Q 兩隻手都捏住了自己的辮根，歪著頭，說道：「打蟲豸，好不好？我是蟲豸—還不放麽？」\n    但雖然是蟲豸，閒人也並不放，仍舊在就近什麼地方給他碰了五六個響頭，這才心滿意足的得勝地走了，他以為阿Q\
    \ 這回可遭了瘟。然而不到十秒鐘，阿Q 也心滿意足的得勝地走了，他覺得他是第一個能夠自輕自賤的人，除了「自輕自賤」不算外，餘下的就是「第一個」。狀元不也是「第一個」麽？「你算是什麼東西」呢？\n\
    \n――節錄自魯迅 阿Q 正傳"
