  section: 1
  number: 45
  type: single
  page: 2
  stem: 新聞報導指出，有名女子因自小身心障礙而遭到母親棄養，在她歷經艱辛的成長過程後，終於建立較為穩定且能自理的生活，結果三十年來行蹤不明的母親竟突然出現，還向這名女子討要「孝親費」、盡扶養義務。按照我國現行法律規定，對於這名女子對於扶養母親的義務之敘述，何者最合理？
