- id: doc_113_高雄_獅甲_社會_公民_g7s1e2_s1_46
  section: 1
  number: 46
  type: single
  page: 2
  stem: 即使雙薪家庭已經是現代社會的主流家庭型態，家庭成員下班回家之後還是得處理大量無償的家務，彷彿在上第二個班，因此有學者稱這種情形為「第二輪班」。進一步進行跨國比較研究之後發現，大部分已開發國家的第二輪班，幾乎都是由女性家庭成員承擔。根據前述，可以作出下列何種推論？
  options:
  - label: A
    content: 已開發國家呈現家務分工的性別不平等現象
  - label: B
    content: 女性比男性更喜歡從事無償的家務勞動工作
  - label: C
    content: 女性因為不想承擔第二輪班，所以投入職場
  - label: D
    content: 男性每日投入家務勞動的平均時間比女性高
