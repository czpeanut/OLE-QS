  section: 1
  number: 47
  type: single
  page: 2
  stem: 《家庭暴力防治法》施行的早期，家暴通報的施暴者以配偶佔最多，隨著法規不斷修改、擴大保護範圍，2016 年起，通報「其他家庭成員」為施暴者的比例，已多過配偶施暴。以2023
    年家庭暴力通報為例，當年將近十七萬件通報案件當中，配偶及前配偶施暴約有五萬七千件，「其他家庭成員」施暴則大約有十一萬兩千件，其中又以直系親屬之間的施暴佔最多，約六萬一千件。根據前述資料判斷，下列推論何者最合理？
  options:
  - label: A
    content: 2016 年，對配偶之外的家人施暴的情況比2023 年還嚴重
  - label: B
    content: 2023 年的六萬一千件直系親屬間施暴，皆為父母對小孩施暴
  - label: C
    content: 2023 年的五萬七千件配偶及前配偶施暴，皆為男性對女性施暴
  - label: D
    content: 2023 年的十一萬兩千件其他家庭成員施暴，包括已分手的情侶間施暴
