  section: 1
  number: 42
  type: single
  page: 1
  stem: 「我的爸媽在我小學時離婚，當時我和媽媽一起住。後來因為媽媽在外商公司的工作太忙，我被送到外婆家住，媽媽只有在假日才會來看我。不過我很喜歡和外婆住在一起，因為外婆做的菜非常好吃。在我升上高中時，媽媽和她一位來自南韓的同事結婚，我因此多了一個韓國爸爸。」以上是一則網路社群上的貼文，從文中敘述的情節判斷，該名貼文者的家庭型態經歷怎麼樣的變化？
