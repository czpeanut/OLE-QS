  group_stem: '2019 年立法的《司法院釋字第七四八號解釋施行法》（簡稱「七四八施行法」）是根據司法院大法官解釋所訂定的一部法律，用以保障同性之間得以締結「具有親密性與排他性的永久結合關係」。因為這條關係寫在該法第二條，因此在該法當中一律以「第二條關係」來稱呼同性之間締結的親密關係。

    該法在2023 年修法之後，成立「第二條關係」的同性伴侶，無論其生理性別為何，在姓氏、住所、財產、收養子女、子女權益方面，也都與《民法》的「配偶」相同，但細節上仍有所差異，例如成立《民法》裡的配偶關係之後會衍生相關的親屬關係，但是成立「第二條關係」的同性伴侶卻沒有這樣的法律效果。'
