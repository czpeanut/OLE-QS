  group_stem: "Why Are Movie Theater Seats Red?\n       Ask anyone for the color of\
    \ a movie theater seat and you will probably hear, red.  Theater seats are usually\
    \ red for a few reasons.  First, red is a bright color.  It makes people feel\
    \ happy and excited.  When you go to the theater, you want to enjoy the movie\
    \ and have a great time.  The red seats help people feel more comfortable and\
    \ relaxed in a colorful environment.\n       Second, red seats can hide stains\
    \ very well.  In a theater, many people eat snacks like popcorn and drink soda.\
    \  Sometimes, drinks and popcorn can fall on the floor or seats.  If the seats\
    \ were a light color, it would be easy to see all the stains, and that would not\
    \ be nice for anyone.  Red helps to keep the theater looking clean.   This way,\
    \ the seats look nice and do not seem dirty, even after many people sit in them.\n\
    \       Last but not least, red has a special meaning in theaters and cinemas.\
    \  It is a traditional color for many old theaters.  In the past, they used red\
    \ curtains and other items to bring exciting feelings.  The use of red makes the\
