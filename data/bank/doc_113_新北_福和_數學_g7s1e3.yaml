- id: doc_113_新北_福和_數學_g7s1e3_s1_27
  section: 1
  number: 27
  type: single
  page: 4
  stem: 某計程車行旗下有 150 輛排氣量 1600 c.c.的計程車，且每一輛車平均每一個月行駛 8820 公里，耗油量為 630 公升。請問車行預計汰換一部份車輛，使得每一輛新車平均每一個月的耗油量為
    490 公升，則依照能源效率等級，舊車與新車分別為幾級？
  options:
  - label: A
    content: 5 級、1 級
  - label: B
    content: 5 級、2 級
  - label: C
    content: 4 級、2 級
  - label: D
    content: 4 級、1 級
  group_stem: '【生活素養題】

    很多需要「耗能」的產品，經濟部能源局都有公布「能源效率標示，圖(一)」讓民眾選購時參考，除了一般常見的家電或衛浴用品外，使用到「燃油」的汽、機車一樣也有能源效率的標示。

    而代表能源效率等級的溫度計圖示，如圖(一)，象徵地球暖化溫升程度，溫度計刻度轉變成能源效率，由低至高區分為 5 個等級。根據經濟部能源局規範的【汽車耗能證明核發與核章管理系統】，排氣量落在
    1600 c.c. 的小客車能源效率等級如表(一)。

    *第 5 級代表造成地球暖化程度高，即該等級車輛為耗油最高的產品。


    表(一)

    | 等級 | 能源效率值 (單位：公里/公升) |

    |---|---|

    | 5級 | 12.6 以下 |

    | 4級 | 12.7～14.6 |

    | 3級 | 14.7～16.6 |

    | 2級 | 16.7～18.7 |

    | 1級 | 18.8 以上 |'
