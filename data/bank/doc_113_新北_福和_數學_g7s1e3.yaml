  section: 1
  number: 19
  type: single
  page: 2
  stem: '以下是甲和乙兩人化簡式子的過程，對於二人的化簡過程，下列判斷何者正確?

    | 甲化簡：$\frac{4x-5}{6}+\frac{5x-7}{4}$ | 乙化簡：$\frac{2x-3}{5}-\frac{-3x+4}{2}=0$
    |

    |---|---|

    | ①將式子乘以24，得$4(4x-5)+6(5x-7)$<br>②去括號得 $16x-20+30x-42$<br>③合併同類項，得化簡結果為$46x-62$
    | ①將式子乘以10，得$2(2x-3)-5(-3x+4)=0$<br>②去括號得 $4x-6+15x+20=0$<br>③合併同類項得化簡結果$19x+14=0$
    |'
  options:
  - label: A
    content: 甲、乙都正確
  - label: B
    content: 甲、乙都錯誤
  - label: C
    content: 甲正確、乙錯誤
  - label: D
    content: 甲錯誤、乙正確
