  stem: '九月風樂團終於要在台北小巨蛋開唱了，演唱會門票分為搖滾區和看台區，且搖滾區票價為 2500 元，看台區票價為 1000 元，其購票方式如下，試回答下列問題：

    | 購票方式 | 取票方式 | 票價 |

    |---|---|---|

    | 現場購票 | 現場取票，不需另外收取手續費。 | 原價 |

    | 便利商店售票系統 | 便利商店取票，單筆交易另外收取手續費 30元 | 原價 |

    | 網路購票 | 郵寄取票，單筆交易另外收取手續費 50元<br>便利商店取票，單筆交易另外收取手續費 30元 | 九折 |

