  stem: '甲、乙、丙、丁、戊五人各拿了一張上面印有不同數字的卡片。 【挑戰題】

    甲說：「乙和丁的總和就是我的兩倍。」 乙說：「有兩個人的數字比我大。」

    丙說：「我的數字是最小的。」 丁說：「我們五人的數字由小到大排列會形成連續奇數。」

    戊說：「我的 3 倍比丁的 2 倍多 7。」

