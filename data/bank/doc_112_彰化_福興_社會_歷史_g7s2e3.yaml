  group_stem: '(二)兩岸外交關係發展史有許多變化，請針對下列四段文字回答問題：

    (甲)恢復中華人民共和國的一切權利，承認他的政府之代表為中國在聯合國組織的唯一合法代表，並立即把中華民國的代表......驅逐出去。

    (乙)不再堅持中華民國是代表中國的唯一合法政府，強調兩岸是分裂分治的對等政治實體。

    (丙)美國為防堵共產勢力擴張，派遣第七艦隊巡防臺灣海峽，確保臺海安全。

    (丁)臺灣人民拿著卡特無恥的抗議標語，群聚在臺北松山機場外，朝著來訪的美國代表團車輛，激憤的丟擲雞蛋......，四周不斷的傳出民眾憤怒的抗議聲......。'
