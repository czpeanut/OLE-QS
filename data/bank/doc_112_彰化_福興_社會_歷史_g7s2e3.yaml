  stem: 請問發生八二三炮戰的時期，臺灣內部不會遇上下列哪個狀況？
  options:
  - label: A
    content: 實施進口替代政策
  - label: B
    content: 白色恐怖時期雷震案發生
  - label: C
    content: 推動十大建設，帶動景氣復甦
  - label: D
    content: 台灣首次民選總統
  group_stem: (三)八二三砲戰，中國人民解放軍與中華民國國軍以隔海砲擊為主要戰術行動，中國人民解放軍首先發起砲戰，中華民國國軍隨即反擊。砲戰初期，解放軍攻擊島上軍事目標，後期著重封鎖海運線。砲戰期間，......。10月初，改為「單打雙不打」，逐漸減少攻勢。至此，中華民國成功守衛前線地區。中共維持單打雙不打，直到1979年1月1日，通過《告臺灣同胞書》正式宣布停止砲擊。此次戰役是國共雙方陸海空軍至今最後一次大型軍事衝突，期間雙方的軍事衝突侷限於海上，並逐漸停止。
