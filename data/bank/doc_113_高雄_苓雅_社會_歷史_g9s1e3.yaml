- id: doc_113_高雄_苓雅_社會_歷史_g9s1e3_s1_30
  section: 1
  number: 30
  type: single
  page: 1
  stem: 隨著大航海時代的展開，世界各地的交流日益密切，相互帶來許多影響。在此時代背景下，關於下圖的標示，下列敘述何者正確？
  options:
