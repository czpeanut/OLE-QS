- id: doc_113_高雄_苓雅_社會_歷史_g9s1e3_s1_37
  section: 1
  number: 37
  type: single
  page: 2
  stem: 中南美洲的阿茲提克帝國、印加帝國，曾經是獨具特色的古文明，這些古文明呈現的文化風貌與生活型態與歐亞地區全然不同。然而現在我們只能從留存下來的文物、遺跡，概略認識這些古文明，主要是因為許多珍貴的美洲文化曾因「外力」入侵幾乎遭到毀滅性的破壞。上述的「外力」最有可能是指下列哪一群人?
  options:
  - label: A
    content: 英國人
  - label: B
    content: 葡萄牙人
  - label: C
    content: 荷蘭人
  - label: D
    content: 西班牙人
- id: doc_113_高雄_苓雅_社會_歷史_g9s1e3_s1_38
  section: 1
  number: 38
  type: single
  page: 2
  stem: 在科學革命期間，人類用了與過去全然不同的態度試圖研究自然，並找出自然世界的「通則」有位科學家提出「物體若不受外力作用或所受外力的合力為零時，則物體的運動狀態保持不變，即靜者恆靜，動者恆作等速度運動。若物體運動的速度大小改變或方向改變時，則物體必受外力（或合力不為零）的作用。」請問這位科學家是？
  options:
  - label: A
    content: 笛卡兒
  - label: B
    content: 哥白尼
  - label: C
    content: 牛頓
  - label: D
    content: 培根。
- id: doc_113_高雄_苓雅_社會_歷史_g9s1e3_s1_39
  section: 1
  number: 39
  type: single
  page: 2
  stem: 曾有一位社會學家對某一個現象提出了他的想法「隨著生產工具的自動化，工作對於勞工本身已經沒有意義可言，勞工工作並非以自由意識所決定，而是藉由制度性的安排。勞動者喪失其對勞動過程中的勞動力之控制力與掌握力，從而失去對生活及自我的控制，工人變得不是自主、自我實現的人類存在，他只能以資產階級欲其所是的模式而存在。」下列有關於這段文字的描述何者正確?
  options:
  - label: A
    content: 這位學者認為，工人會透過制度從工作獲得價值
  - label: B
    content: 生產工具能夠自動化是因為人類依靠自然力生產
  - label: C
    content: 這位思想家是傾向用革命手段改造社會的馬克思
  - label: D
    content: 這個工人的工作模式最早大約出現在17世紀
- id: doc_113_高雄_苓雅_社會_歷史_g9s1e3_s1_40
  section: 1
  number: 40
  type: single
  page: 2
  stem: 有關於科學革命的描述何者敘述正確？
  options:
  - label: A
    content: 由荷蘭、西班牙最先成立科學研究機構
  - label: B
    content: 羅盤、指南針等新工具的加速科學發展
  - label: C
    content: 狄德羅大力批判宗教不該干預科學研究
  - label: D
    content: 笛卡兒認為知識可透過思考和推理獲得
