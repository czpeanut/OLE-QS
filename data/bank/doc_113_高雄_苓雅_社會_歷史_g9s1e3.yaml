- id: doc_113_高雄_苓雅_社會_歷史_g9s1e3_s1_32
  section: 1
  number: 32
  type: single
  page: 1
  stem: 「一個人人追求私利的君主國中，任何政治團體其實都有演變為暴政的可能，所以個人自由的維護，有賴於我們透過對政治機構的技巧性設計，特別是透過立法、行政與司法權威的相互區隔，以均衡社會內部的利益糾葛。」關於上文所述內容的分析，何者有誤？
  options:
  - label: A
    content: 此理論應該出現於 18 世紀
  - label: B
    content: 為啟蒙思想家盧梭的著作
  - label: C
    content: 於《法意》一書有相關論述
  - label: D
    content: 影響日後美國政府的運作
- id: doc_113_高雄_苓雅_社會_歷史_g9s1e3_s1_33
  section: 1
  number: 33
  type: single
  page: 2
  stem: 黃同學整理關於工業革命的筆記，其內容哪一項有誤？
  options:
  - label: A
    content: 開端：最先從紡織業的改良開始
  - label: B
    content: 起源國：為最早進行海外擴張的國家
  - label: C
    content: 時間：約為 18 世紀中葉開始
  - label: D
    content: 影響：引發各工業強國開始爭奪海外殖民地。
- id: doc_113_高雄_苓雅_社會_歷史_g9s1e3_s1_34
  section: 1
  number: 34
  type: single
  page: 2
  stem: 《印度憲法》是世界各國篇幅最長的成文憲法，因《印度憲法》有諸多細碎的明文規範。例如 〈平等權〉 中即寫，不得限制人民使用以下地點，包括：商店、餐館、旅館或公共娛樂場所、水井、貯水池、沐浴用的河邊階梯、道路及公共場所等地。《印度憲法》之所以有如此規範，
    與下列何者最為相關？
  options:
  - label: A
    content: 蒙兀兒帝國宗教迫害頻繁，穆斯林往往禁止印度教徒前往上述各式場所
  - label: B
    content: 英國殖民時期有著嚴重的種族歧視，僅有英國殖民者得以進入上述場所
  - label: C
    content: 佛教講求眾生平等，印度九成以上民眾信仰佛教，因此憲法中有此規範
  - label: D
    content: 種姓沿用千年，高種姓歧視低種姓淪為慣習，因此憲法需特別講求平等
- id: doc_113_高雄_苓雅_社會_歷史_g9s1e3_s1_35
  section: 1
  number: 35
  type: single
  page: 2
  stem: 「1633 年，這位已經 70 歲的學者帶病前往羅馬受審，因為教會表示：「主張太陽為宇宙中心與聖經所示相違背」但是，這位學者辯駁到:「上帝在聖經中所欲啟示人類的，是如何上天堂，不是天體如何運行」這個說法不但捍衛了科學研究的合理性，但也同時顯示神學與科學並非完全衝突的兩個概念，請問下列何者是這位學者探究世界的研究成果？
  options:
  - label: A
    content: 主張進行城市空間重新規劃
  - label: B
    content: 提出「地平說」鼓勵出外探險
  - label: C
    content: 發明顯微鏡，觀察到微生物
  - label: D
    content: 使用望遠鏡發現到月球的坑洞
- id: doc_113_高雄_苓雅_社會_歷史_g9s1e3_s1_36
  section: 1
  number: 36
  type: single
  page: 2
  stem: 下圖為一張大航海時代具有代表性的航線圖，請問有關於這張航線圖的說明何者正確？
  options:
  - label: A
    content: 這趟航行是歐洲人首次橫渡太平洋
  - label: B
    content: 荷蘭王室贊助此趟航行的全部費用
  - label: C
    content: 航行的船長是葡萄牙傳教士麥哲倫
  - label: D
    content: 航線橫渡大西洋並首次發現美洲
  assets:
  - key: s1_36_f1
