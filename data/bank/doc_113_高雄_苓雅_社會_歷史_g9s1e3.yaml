  stem: 《天體運行論》該書的序言寫道，「我常常在想，一旦我將這本關於宇宙天體運動的書公諸于世，有多少人會因我對地球運行軌跡的解釋而氣急敗壞，畢竟這是從未有人提出過的看法……，您大概想聽我談談，我怎麼會完全否定過去的論點，甚至違背常識，假設地球正在它預定的軌道上漫步呢？」請問該書的作者為何人？
