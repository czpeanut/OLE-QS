  section: 1
  number: 29
  type: single
  page: 1
  stem: 雪梨歌劇院是澳洲的著名地標，(甲)澳洲原住民是屬於南島語族(乙)歐洲人抵達以前，澳洲原住民建立過國家組織(丙)大航海時代後成為殖民母國流放囚犯的地方(丁)殖民者帶來的傳染病導致原住民人口銳減(戊)受殖民母國影響今日澳洲人普遍能說英文，以上關於澳洲的說明，符合史實的是：
