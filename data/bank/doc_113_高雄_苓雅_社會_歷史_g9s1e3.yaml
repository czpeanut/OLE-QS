    content: 歐洲人從「甲」捕捉黑人，運往乙從事奴工
  - label: B
    content: 殖民者在「乙」開採銀礦，獲得大量財富
  - label: C
    content: 「丙」原生的農作物，如玉米、馬鈴薯成為世界各地重要的食物來源
  - label: D
    content: 「丁」為英國的殖民地，眾多原住民死於殖民者帶來的傳染病。
