  group_stem: "The world celebrate New Year in different ways. In India, for example,\
    \ people throw colorful powders at each other. How do other countries celebrate\
    \ it?\n   In Thailand, people call their New Year’s Day Songkran. It is on April\
    \ 13. Songkran is a water festival. People have big water fights. For them, water\
    \ can wash away bad luck.\n   On January 1, people in Brazil wear white clothes\
    \ for peace and colorful underwear for different wishes. Pink is for love, green\
    \ is for health, and yellow is for money.\n   For people in Japan, they go to\
    \ temples, pray to gods and make wishes for good luck on New Year. They have a\
    \ special way of doing so－ throw coins into the money box, ring the temple bells,\
    \ bow twice, clap twice, and bow again.\n   New Year celebrations are different\
    \ from country to country, but they have one thing in common. They mark a new\
