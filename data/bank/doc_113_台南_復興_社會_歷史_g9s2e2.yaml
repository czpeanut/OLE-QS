  section: 1
  number: 30
  type: single
  page: 2
  stem: 臺北市的陽明山與天母曾有美軍眷舍，然而隨著臺美關係生變、美軍撤臺，這些建築物因而逐漸荒廢。近年在當地人士的奔走下，將這些見證了美軍駐臺歷史的建築物活化再利用，現在更成為網美打卡勝地。請問：導致美軍眷舍逐漸荒廢的背景，應與下列何者有關？
  options:
  - label: A
    content: 中華民國退出聯合國後，國際地位受到重大挫折，美國重新評估對臺的政策
  - label: B
    content: 美國因越戰陷入泥淖，反戰聲浪高漲，開始調整亞洲戰略，減少對外軍事承諾
  - label: C
    content: 中華民國實施白色恐怖，引發美國國內對其民主體制的質疑，影響雙方互信
  - label: D
    content: 美國與中華人民共和國發表公報，確立「一個中國」原則，為建交奠定基礎。
