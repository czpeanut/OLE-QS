  stem: 以下是一份關於台灣經濟發展歷程文章的部分內容:「經歷1973 年與1979 年的石油危機後，政府以加速經濟升級，積極發展策略性產業為當時工業發展的主要目標，並致力推動市場潛力大、附加價值大、汙染程度低的產業。經多年努力，這些產業已經成為台灣經濟產業的主要支撐。」文中政府所進行的具體措施應該為何?
