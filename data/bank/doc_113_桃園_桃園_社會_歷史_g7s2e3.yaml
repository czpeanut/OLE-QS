- id: doc_113_桃園_桃園_社會_歷史_g7s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 「1980年代初期，臺灣電影受到香港電影新浪潮的影響，進入『臺灣新電影』時期。『新電影』發展初期的導演與編劇，在劇本創作上融入鄉土文學的題材，拍攝風格以強調自然、寫實為主，在題材的選用上，開始有意識的挑戰官方政治禁忌，而受到相關單位的關切。例如『新電影』初期代表作《兒子的大玩偶》，在正式上映前，因電影片段中呈現臺北違建林立等有礙政府形象的畫面，遭官方施壓要求刪減，此事件後來被稱為『削蘋果事件』。最後借助影視記者楊士琪等人的聲援，才使得電影逃過被刪剪的命運。」根據上文，「新電影」發展之初，最可能以下列何者作為電影題材？
  options:
  - label: A
    content: 宣揚中華文化、清除日本統治影響，培養人民的國家認同感
  - label: B
    content: 受到美援影響，將美國流行文化作為劇情主軸
  - label: C
    content: 關注一般農民、勞工等小人物生活中的困頓
  - label: D
    content: 重視原住民文化，發揚原住民族音樂與神話傳說
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 歷史
      code: 6-2
      title: 社會與文化的變遷
      chapter: 第6章 戰後臺灣的經濟與社會
    textbook: 七下歷史 6-2 社會與文化的變遷
    labeled_by: ai
