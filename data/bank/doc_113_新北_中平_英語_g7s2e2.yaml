- id: doc_113_新北_中平_英語_g7s2e2_s2_29
  section: 2
  number: 29
  type: single
  page: 4
  stem: Why is affogato special?
  options:
  - label: A
    content: It is always cold.
  - label: B
    content: It is very hard to make.
  - label: C
    content: It mixes hot and cold.
  - label: D
    content: It comes in many colors.
  group_stem: '【B】

    Affogato

    What is affogato? It comes from Italy. An affogato is a simple but delicious Italian
    dessert. The word "affogato" means "drowned" in Italian. But don’t worry — it’s
    not about water!

    An affogato consists of a scoop of vanilla ice cream in a cup and a small cup
    of hot coffee, called espresso. Before you have affogato, pour the espresso on
    the top of the ice cream. The hot coffee melts some of the cold ice cream. The
    name "affogato" refers to how the espresso "drowns" the ice cream. It''s a mix
    of hot and cold, bitter and sweet — super satisfying and perfect for coffee lovers.

    Some people also add chocolate or cookies. But even plain affogato tastes great!


    dessert : 甜點 drown: 淹沒；溺水 consist: 由…組成 scoop: 一勺(球) vanilla: 香草 called: 稱為

