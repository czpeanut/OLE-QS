- id: doc_113_台中_四育_社會_公民_g9s1e1_s1_34
  section: 1
  number: 34
  type: single
  page: 5
  stem: 根據文章，台灣製鞋業在80 年代末期面臨的主要挑戰是什麼？這個挑戰對生產取捨的影響如何？？
  options:
  - label: A
    content: 全球鞋類需求面臨急劇下降，迫使企業尋找新的市場
  - label: B
    content: 新型鞋材的發展，使得企業需更新生產設備投入資金
  - label: C
    content: 勞動力成本上升，迫使企業尋找成本更低的生產地點
  - label: D
    content: 生產技術落後，直接影響台灣鞋廠滿足國際市場需求
  group_stem: "鞋子屬民生消費品，市場龐大，全球鞋類市場是一個價值數十億美元的多元產業，鞋類產品通常由皮革、紡織品和各種合成材料製成，包括鞋子、運動鞋、奢侈鞋類、運動鞋以及其他相關商品。\n\
    \n       1960 年代中期，臺灣、香港、韓國和日本是亞洲市場四大鞋類出口地區， 於1971 年在臺灣發起了第一屆國際橡膠鞋製造商會議， 成立國際製鞋聯盟（Confederation\
    \ of International Footwear Association，簡稱CIFA），而臺灣製鞋工業同業公會即為4 個創始成員鞋業協會之一。\n\n\
    \       根據市場研究機構Statista 的數據，2023 年全球鞋類市場的消費達到了4,450 億美元，比上一年增長了約10%。預計到2027 年，市場年均增長率將會是3.38%。隨著電商的崛起，鞋類的網上銷售也在迅速增長，預計到2027\
    \ 年，網絡銷售年均增長率將達到8.3%。\n\n        在生產方面，2022 年全球鞋類生產達到239 億雙，恢復到疫情前的水平。亞洲地區依然是鞋類製造的主要基地，占全球生產量的87%以上。其中，中國大陸以54.6%的比例領先全球，印度、越南和印尼也是主要的生產國。\n\
    \n        鞋類的出口也在逐漸回升，2022 年全球鞋類出口增長了9%，總數達到152 億雙。亞洲不僅是主要的鞋類生產地，也是消費最大的市場。2022\
    \ 年，亞洲的鞋類消費占全球的53.2%，而北美和歐洲分別占15.9%和14.9%。不同地區的人，消費也具有差異顯著，例如，非洲每人平均消費1.4 雙鞋，而北美每人則達到5.9\
    \ 雙。\n\n       台灣曾是全球著名的製鞋王國，1980 年代年產量曾超過8 億雙。但由於勞動力成本上升，台灣的製鞋業競爭力減弱，許多鞋廠開始轉移到勞動力成本更低的地區，如中國大陸和東南亞，這導致了台灣外銷的衰退。\n\
    (以上文章參考來源摘自:台灣經貿2024-3-18 /以上文摘引用《產業趨勢篇》陳思雅)"
