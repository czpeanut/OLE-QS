  - label: B
    content: 台灣的鞋類生產技術先進，因此台灣具有優勢能以更高的成本生產鞋類，並將資源投入到高科技領域。
  - label: C
    content: 台灣在80 年代曾經是鞋業製造的全球領先者，因此即使勞動力成本上升，台灣仍然保持了高度生產量。
  - label: D
    content: 北美地區的人民相較於非洲地區消費力較高，因此將製鞋的產業設置在北美地區形成機會成本相對低。
