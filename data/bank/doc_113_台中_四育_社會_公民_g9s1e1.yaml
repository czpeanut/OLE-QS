  stem: (改編習作題) 演講時講者對臺下的學生說：「時間很寶貴，過去的講者會讓你覺得在浪費時間，你只好去做對你來說比較有價值的事情，例如：滑手機或睡覺。」請問：下列何者最符合講者這段話的意涵？
  options:
  - label: A
    content: 學生選擇聽演講的機會成本是滑手機加上睡覺得到的快樂
  - label: B
    content: 稀少性是指資源總數的多寡，因此聽演講的時間具稀少性
  - label: C
    content: 時間是有限的，但可以在同一時間，聽演講或滑手機或睡覺，因此不具有取捨問題
  - label: D
    content: 學生不願意放掉滑手機，因此學生若選擇了聽演講，則在他們心中的機會成本相較高
