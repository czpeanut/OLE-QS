    | 名稱 | 美洲黑熊 | 棕熊 |

    | :--- | :--- | :--- |

    | 學名 | Ursus americanus | Ursus actos |'
  options:
  - label: A
    content: 大貓熊和棕熊是不同屬且不同科
  - label: B
    content: 亞洲黑熊和美洲黑熊是同屬但不同目
  - label: C
    content: 亞洲黑熊和棕熊是同屬且都是哺乳綱
  - label: D
    content: 大貓熊和美洲黑熊是同屬且都是熊科。
