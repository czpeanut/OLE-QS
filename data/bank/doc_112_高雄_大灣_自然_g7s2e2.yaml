    二、蕨類植物簡介

    蕨類植物是植物中比較原始的類群，也稱羊齒植物。蕨類植物，沒有花、果實和種子，以孢子繁殖，成熟的葉多呈羽狀複葉。古生代蕨類植物中的鱗木、蘆木都很高大，死亡後埋在地層中有機會形成煤炭，而現存的蕨類植物，只有筆筒樹、桫欏等少數蕨類擁有直立且高大的莖，其餘幾乎都缺乏此特徵。

    蕨類的用途很廣，很多種類可供食用，如鳥巢蕨（又稱山蘇花）的嫩芽可作蔬菜，觀音座蓮重達 20～30 公斤的地下根莖也可供食用，石松可作為藥材，滿江紅、槐葉萍等則為飼料及肥料。'
