  stem: 圖(七)為中央氣象署所製作的凱米颱風路徑圖。依照上述文字與圖上所標記的時間點為參考，以下四位同學對於凱米颱風的路徑分析何者較為合理？
  options:
  - label: A
    content: 浩偉：「凱米颱風生成的位置約位於日本東方海面上。」
  - label: B
    content: 子婷：「7 月 21 日、22 日颱風最接近的國家為越南。」
  - label: C
    content: 國辰：「7 月 24 日時，颱風最接近的縣市為彰化縣。」
  - label: D
    content: 子恩：「颱風在 7 月 25 日經過臺灣海峽後登陸中國。」
  group_stem: '第16-17 題為題組


    ◎凱米颱風在7 月20 日14 時於太平洋海面上生成，向西北轉北北西朝臺灣東方海面接近。臺灣於7 月22 日、23 日分別發布海上與陸上警報，颱風已對新北市以及東半部縣市構成威脅。7
    月25 日午夜，颱風中心登陸宜蘭，清晨4 時於桃園出海，最終登陸中國福建。臺灣也在26 日8 時30 時解除颱風警報。」(擷取自全球災害事件簿)'
  shared_asset: g1_16_17
