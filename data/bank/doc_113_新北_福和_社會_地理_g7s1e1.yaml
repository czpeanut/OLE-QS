  page: 1
  stem: 圖(三)為世界地圖，灰色粗線是主角環遊世界的路線圖。福格主僕兩人向東穿越了許多大洲與海域，乘坐過火車、輪船、馬車甚至騎乘大象。根據福格旅行的路線圖，他並沒有路經以下哪個大洲或海域？
  options:
  - label: A
    content: 亞洲
  - label: B
    content: 太平洋
  - label: C
    content: 南美洲
  - label: D
    content: 大西洋
  group_stem: '第8-10 題為題組


    ◎東澤正在利用下課時間閱讀一本世界著名小說──環遊世界八十天，這是一本由法國作家儒勒·凡爾納所撰寫的古典冒險小說。故事主角是一位富有的英國人菲利斯·福格，因為一場高達兩萬英鎊的賭局(福格誇口能在八十天內環遊世界)，讓福格與他的僕人萬事通從家鄉英國倫敦出發，開啟了一場驚心動魄的環球之旅。'
