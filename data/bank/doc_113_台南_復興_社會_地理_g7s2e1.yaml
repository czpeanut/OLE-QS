  stem: 若以圖(一)中的水量增減表示一地的人口變化，甲、丙為社會增加，乙、丁為自然增加，則下列敘述何者正確？
  options:
  - label: A
    content: 若乙-丁=甲-丙，則此地區人口增加數為0，即表示人口總數不變
  - label: B
    content: 若乙<丁，則該地區的人口為負成長
  - label: C
    content: 若乙>丁，則自然增加率為正值
  - label: D
    content: 若甲>丙，則社會增加率為正值，該區人口總數一定增加。
