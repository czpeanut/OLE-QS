  group_stem: '（六）十九世紀中葉，日本自放棄鎖國政策後，開始積極擴張勢力，從一個閉關自守的國家轉而成為海洋霸權國家。光緒年間的戰爭，已經證明其明治維新現化代的成功，成為亞洲大國。此後，面對俄羅斯的挑戰，日本也是毫不畏懼，連戰連勝。此後日本處心積慮的阻饒中國的統一，接連對中國發動侵略。


