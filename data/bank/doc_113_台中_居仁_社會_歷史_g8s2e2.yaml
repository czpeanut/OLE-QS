- id: doc_113_台中_居仁_社會_歷史_g8s2e2_s2_12
  section: 2
  number: 12
  type: single
  page: 2
  stem: 故宮文物最早開始籌畫搬遷，應與下列哪個事件有關？
  options:
  - label: A
    content: 七七事變
  - label: B
    content: 日俄戰爭
  - label: C
    content: 珍珠港事變
  - label: D
    content: 九一八事變。
  group_stem: "（一）請閱讀下列文章後回答問題：\n    紫禁城是中國著名的皇城，西元1925 年成立故宮博物院來管理前朝皇城的文物。然而受到政局動盪影響，為了保護國寶的安全，開啟遷運避難的計畫。故宮文物搬遷始於西元1931\
    \ 年下半年當時入侵敵軍壓迫中國東北，北平、天津岌岌可危，故宮未雨綢繆，特別挑選院藏文物精品裝箱儲置，為文物播遷避難預作準備。西元1933 年山海關失守，國民政府決定將文物南遷上海與南京。之後，敵軍進逼上海，才又分批從上海、南京轉運至長沙、貴陽、四川等地。\n\
    \    抗戰勝利後，政府打算將文物運回北平，但因平漢鐵路沿線受軍事影響而中斷，文物於重慶集中後走水路到南京，全部文物直到西元1947 年底才運送完畢。到了隔年，戰況急轉直下，文物來不及重新規畫安置方式，中華民國政府決定將部分文物裝船運至臺灣。抵臺後先寄放在臺中糖廠，其後在霧峰建置庫房與防空洞，到西元1965\
    \ 年臺北外雙溪新建成臺北故宮博物院落成，文化國寶歷經數十年輾轉數萬公里後，終於獲得安置。"
