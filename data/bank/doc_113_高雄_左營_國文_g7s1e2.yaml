- id: doc_113_高雄_左營_國文_g7s1e2_s5_29
  section: 5
  number: 29
  type: single
  page: 5
  stem: 依據本文所述，下列敘述何者符合夾娃娃機產業的發展脈絡？
  options:
  - label: A
    content: 日本SEGA 研發二爪機型 ⇨ 新增保夾取物模式 ⇨ 臺灣研發三爪機型
  - label: B
    content: 臺灣研發三爪機型 ⇨ 日本SEGA 研發二爪機型 ⇨ 新增保夾取物模式
  - label: C
    content: 夜市 ⇨ 巷弄 ⇨ 小店面 ⇨ 大店面
  - label: D
    content: 巷弄 ⇨ 小店面 ⇨ 夜市 ⇨ 大店面
  group_stem: "你相信嗎？休假日時湧入滿滿人潮的，竟然是一間夾娃娃機店！愛吃零食的大人、小孩，都來到店裡試試身手，夾取自己最喜歡的零食回家吃。而這樣的零食機臺，甚至不用大老遠跑到外縣市，在自家附近或許就可以找到這樣新型營運的夾娃娃機店。截至今日全臺的夾娃娃機店家總數已超越連鎖超商，並持續在全臺各縣市展店。\n\
    \    夾娃娃機的發展歷史，最早可以從 1990 年由日本 SEGA 公司發明的 UFO 機型開始，當時的夾娃娃機臺的爪子只有兩爪，也是現在日本最常見的機型。1991\
    \ 年由電子遊戲業者引進臺灣後，由冠興企業改為三爪機型，成為臺灣主流的夾娃娃機臺類型。接著在 2000 年起娃娃機加入了保夾取物的模式設定，當玩家累計投入一定的金額後即可獲取物品。2001\
    \ 年開始至今，夾娃娃機產業於夜市流行起來，接著轉往租金便宜的巷弄中擺放，再發展為完整的店面擺放機臺的無人經營、出租機台的模式。近年流行的新型經營模式則是擴展為直營連鎖的超大店面，有工作人員能調整夾取物位置與補貨的親子遊戲場所。\n\
    \    夾娃娃機臺在臺灣深耕的這些年，除了從夜市經營漸漸發展成店面、由小坪數轉為大坪數外，經營模式上也有些不同。以往舊式娃娃機的客群多鎖定成人，會擺放公仔與\
    \ 3C 產品吸引高技術的專業夾客遊玩，或是擺放娃娃給路過民眾遊玩。而現在新一代機臺則以簡單易夾的生活用品與食物為主，主打小孩子也能夾到物品獲得成就感，吸引家長帶著小朋友來到店鋪夾東西、放放電，有時候還會有抽獎或累點換好禮等行銷活動。\n\
    \    娃娃機低門檻、高機動性的經營特性，也讓這個產業迅速替沒落的商圈補位。如今的臺中逢甲商圈、高雄新堀江商圈……等過去繁華的商圈中，林立了許多夾娃娃機店，承租了那些被服飾業者們退租的店面。而娃娃機的「銅板經濟」，讓民眾在付出幾個十元硬幣的過程中，就能滿足男女老幼的娛樂需求，這些營運方針的轉變，讓臺灣又掀起了娃娃機熱潮。\n\
    \                                                                  ――改寫自〈時事非讀BOOK〉"
