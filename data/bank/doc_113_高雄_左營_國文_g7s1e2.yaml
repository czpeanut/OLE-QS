  page: 5
  stem: '小丸子依據本文內容，將舊型與新型夾娃娃機臺營運狀況做了一張比較表，可惜錯誤百出，只有一項是正確的。請問下列哪項才是正確的？


    | 項 目 | 舊 型 | 新 型 |

    | :--- | :--- | :--- |

    | (A)主要內容物 | 零食、公仔、3C | 娃娃、泡麵、生活用品 |

    | (B)夾物難度 | 較低 | 較高 |

    | (C)現場工作人員 | 有 | 無 |

    | (D)經營型態 | 出租機臺 | 直營連鎖 |'
  options:
  - label: A
    content: (A)主要內容物
  - label: B
    content: (B)夾物難度
  - label: C
    content: (C)現場工作人員
  - label: D
    content: (D)經營型態
