    \ | 工業風從歐美開始流行，是一種刻意在室內空間保留舊工廠樣貌的設計風格。 | 古典風格起源於歐洲，用精緻華麗的家飾展現出傳統歐洲皇室的貴族氣息。 |\n\
    | 設計重點 | 1. 開放式空間設計<br>2. 大量的木質元素<br>3. 充沛的自然採光<br>4. 淺色系的主色調<br>5. 簡約且多功能的家具\
    \ | 1. 目的在於呈現西方傳統農家質樸的生活型態<br>2. 以大地色系為主基調<br>3. 重視自然採光<br>4. 會出現大量歐式鄉村的裝飾配件。<br>5.\
    \ 會利用花草圖騰裝飾空間 | 1. 強調粗獷、原始、復古<br>2. 採用深冷色調為主<br>3. 空間以原始樣貌為主<br>4. 家具裝飾採用大量的金屬物件<br>5.\
    \ 採用復古家具 | 1. 強調典雅、華麗<br>2. 採用多樣的色彩搭配，展現貴族氣息<br>3. 家具與家飾以大體積、造型華麗為主<br>4. 空間裝飾同樣以華麗、精緻為主\
    \ |\n\n――〈翰林出版月閱讀時事〉"
