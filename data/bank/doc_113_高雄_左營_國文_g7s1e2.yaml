  type: single
  page: 4
  stem: 關於四者風格的比較，何者錯誤？
  options:
  - label: A
    content: 北歐風和鄉村風都強調自然採光
  - label: B
    content: 鄉村風和工業風都使用復古元素
  - label: C
    content: 北歐風和工業風都採用明亮色調
  - label: D
    content: 四種風格的起源都與歐洲有關係
  group_stem: "裝潢風格\n  對店家、餐廳、個人住家來說，屋內空間的裝潢、佈置就是給人的第一印象，而如何營造舒適合宜的空間氛圍更是一門學問，近年流行的裝潢風格超過十種，讓人眼花撩亂，以下表格將簡介四種流行的裝潢風格。\n\
    \n| 裝潢風格 | 自然明亮的北歐風 | 舒適恬逸的鄉村風 | 粗獷未加工的工業風 | 華麗典雅的古典風 |\n| :--- | :--- | :---\
    \ | :--- | :--- |\n| 設計起源 | 北歐風為源自北歐國家，受到當地「氣溫低、光照弱、冬季漫長」的影響，較注重採光及自然元素。 | 鄉村風為源於歐美的裝潢設計風格，目的在於呈現西方傳統農家的生活型態。\
    \ | 工業風從歐美開始流行，是一種刻意在室內空間保留舊工廠樣貌的設計風格。 | 古典風格起源於歐洲，用精緻華麗的家飾展現出傳統歐洲皇室的貴族氣息。 |\n\
    | 設計重點 | 1. 開放式空間設計<br>2. 大量的木質元素<br>3. 充沛的自然採光<br>4. 淺色系的主色調<br>5. 簡約且多功能的家具\
    \ | 1. 目的在於呈現西方傳統農家質樸的生活型態<br>2. 以大地色系為主基調<br>3. 重視自然採光<br>4. 會出現大量歐式鄉村的裝飾配件。<br>5.\
    \ 會利用花草圖騰裝飾空間 | 1. 強調粗獷、原始、復古<br>2. 採用深冷色調為主<br>3. 空間以原始樣貌為主<br>4. 家具裝飾採用大量的金屬物件<br>5.\
    \ 採用復古家具 | 1. 強調典雅、華麗<br>2. 採用多樣的色彩搭配，展現貴族氣息<br>3. 家具與家飾以大體積、造型華麗為主<br>4. 空間裝飾同樣以華麗、精緻為主\
    \ |\n\n――〈翰林出版月閱讀時事〉"
