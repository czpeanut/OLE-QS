- id: doc_111_桃園_石門_國文_g7s1e1_s4_3
  section: 4
  number: 3
  type: single
  page: 3
  stem: 作者以為微笑像一朵美麗的花，從不枯萎，其主要原因是微笑的何種特質？
  options:
  - label: A
    content: 窈窕多姿
  - label: B
    content: 綻放在美麗的春天
  - label: C
    content: 芬芳燦爛
  - label: D
    content: 正是我們心中的愛。
  group_stem: "（二）\n 微笑，像一朵美麗的花。當微笑永遠停留，溫馨也就無處不在了。\n 冷漠是一堵一堵的高牆，阻隔在人和人之間。它讓人彼此觀望，互相猜忌，自然也吝惜於付出關懷，牆增厚了，溝通更形困難，人人自掃門前雪，只做自己分內的事，其他的，誰耐煩多管閒事呢？人人在自己的城堡中，自私地過著日子。堡壘森嚴，我是孤獨的王。\n\
    \ 只有當微笑綻放，像和煦的陽光，融化了彼此間的冰霜和風寒。微笑是深具感染力的，當更多的微笑閃現，有一股清溪，潺潺地流過乾涸的心田；有一股暖流，在寂寞的心靈中升起，守望相助成了義不容辭，人人因諒解而寬容，因信賴而相愛，深溝高壘不見了，原有的高牆也消失了。人間也許不是天堂，但由於共同的努力，必走向更大的繁榮，帶來更多的和諧。在這裡，人即使平凡，卻是快樂的。\n\
    \ 原來，微笑裡有無數個美麗的春天，當春天佇足，人間一片繁花似錦。\n 有一種花，永遠芬芳燦爛，從不枯萎，它正是我們心中的愛，發而為脣邊的微笑。\n（琹涵\
    \ 永遠的微笑）"
