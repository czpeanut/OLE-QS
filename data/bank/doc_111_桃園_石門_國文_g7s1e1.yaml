  - label: C
    content: 能夠收放自如
  - label: D
    content: 能使用不同音量。
  group_stem: "（三）\n 好的演講家，是收放自如的，壯闊處，如率兵千萬；親切處，如促膝長談；激昂處，如雷貫耳；低迴處，如春風駘蕩。他使每一個聽眾都覺得是在對自己說話，說出自己的心聲。\n\
    \ 好的演講家，也是最懂得控制場面的，他知道面對廣大群眾和少數人，要使用不同的音量，也曉得如何說出適合聽眾層次的話。他可能沒有極豐富的辭彙和標準的發音，卻能成為最具吸引力的演說家。\
    \ （劉墉 演講的藝術）\n註：駘蕩：景色舒放。駘，音ㄊㄞˊ"
