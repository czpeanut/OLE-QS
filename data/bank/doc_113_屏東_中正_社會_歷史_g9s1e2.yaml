  stem: 這個城邦以政治制度聞名，且被視為是世界民主制度的源頭。此城邦應該是下列何者？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
  group_stem: '（一）下列資料中的甲、乙、丙、丁是與某個城邦或國家相關的敘述，請閱讀後回答問題：

    甲:官員多經由抽籤產生，成年的男性公民有權參與政治事務，議決城邦大事。

    乙:重視人民的道德與紀律，健壯的男性從小就接受嚴格的軍事訓練。

    丙:曾經入侵希臘，但被希臘城邦聯合起來打敗，歐洲第一本史學名著就是在記錄丙與希臘的戰爭。

    丁:某位統治者在繼承王位後一路東征，建立橫跨歐亞非三洲的帝國。這位統治者也鼓勵民族通婚，

    促進文化交流。'
