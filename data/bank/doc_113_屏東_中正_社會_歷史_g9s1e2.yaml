  page: 1
  stem: 下列關於古羅馬政體的敘述，何者正確？
  options:
  - label: A
    content: 古羅馬的政體起初採行共和制度，再來走向王政，之後則走向帝國型態
  - label: B
    content: 在羅馬共和時期，元老院掌握大權，重要的政策由元老院決議之後再由執政官來執行
  - label: C
    content: 古羅馬的統治疆域範圍並未擴及到亞洲地區
  - label: D
    content: 羅馬在帝國時期分為東西兩部分，其中東羅馬帝國早於西羅馬帝國而被日耳曼民族所滅亡。
  group_stem: '（二）請閲讀短文，回答下列問題：

    古羅馬為西元前八世紀，由拉丁人在義大利中部地區所建立的政權，而這個政權曾歷經許多政治的波折與變化，最終建立一個橫跨歐、亞、非三洲的帝國。除了政治上的成就之外，古羅馬在文化貢獻上也帶給後世深遠的影響。'
