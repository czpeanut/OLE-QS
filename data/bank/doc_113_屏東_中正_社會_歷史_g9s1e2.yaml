  stem: 中古時期的阿拉伯人雖然到處征戰，擴張領土範圍，但同時他們也重視學術與教育，發展出璀璨的文化。下列關於中古時期阿拉伯人文化成就的敘述，何者錯誤？
  options:
  - label: A
    content: 阿拉伯人發明了造紙術與指南針，並將這些技術傳到西方世界
  - label: B
    content: 阿拉伯人除了將自身的文化傳到各地之外，也翻譯了許多古希臘、古羅馬的典籍，並建立學校與圖書館保存文獻書籍
  - label: C
    content: 阿拉伯有許多著名的文學作品，其中《天方夜譚》就是阿拉伯重要的文學成就，這本書反映巴格達繁榮的城市風貌，描寫這座城市工商業發達的情況
  - label: D
    content: 阿拉伯人在天文學、曆法、幾何學與醫學上也有不少成就。
