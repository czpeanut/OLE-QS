  stem: 希臘文化被視為一種城邦政治，為何希臘地區會產生城邦政治的型態？
  options:
  - label: A
    content: 因為希臘地區內部爭鬥不斷，而難以形成一個完整的統一政權
  - label: B
    content: 因為希臘地區多山且地形崎嶇，易形成許多獨立的城邦
  - label: C
    content: 因為希臘地區內部信仰並不相同，容易發展出以獨立城邦為主的政權
  - label: D
    content: 因為希臘地區的天氣因素，造成城邦政治型態的發展。
