  stem: 古希臘與古羅馬文化是歐洲文化的源頭。有關古希臘與古羅馬文化的敘述，下列何者正確？
  options:
  - label: A
    content: 希臘式建築大多採用圓頂，並廣設公眾設施
  - label: B
    content: 羅馬在文學方面成果豐碩，荷馬史詩即為重要的成果之一
  - label: C
    content: 希臘人曾將傳統的法律及各地風俗彙編成「十二銅表法」
  - label: D
    content: 羅馬人主要使用拉丁文，並在他們的統治區域推行拉丁文。
