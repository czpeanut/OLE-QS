- id: doc_112_桃園_文昌_社會_g7s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 臺灣中部地區有許多原住民部落都有一個關於白晝之王的故事：傳說白晝之王的箭矢所及之處，將是千里沃野，作物豐饒且不被鹿豬所毀；凡是他的箭矢沒有抵達的地方，作物必當或殘或枯，衰敗餘年。所有部落見到他必然謹小慎微地敬禮，……，並感激他的帶領和庇佑。」有學者認為，此一故事可能與後來外來者記錄中的部落聯邦有關。請問：關於此段內容，下列選項何者正確？
  options:
  - label: A
    content: 此段內容自古即以文字記錄流傳在這些部落中
  - label: B
    content: 此白晝之王真的具有神力，讓作物豐收與枯萎
  - label: C
    content: 關於此白晝之王的故事完全不可信
  - label: D
    content: 此故事可能代表當時存在有能力的領袖成為各部落的共主。
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 歷史
      code: 1-2
      title: 臺灣原住民的遷徙與傳說
      chapter: 第1章 史前臺灣與原住民文化
    textbook: 七上歷史 1-2 臺灣原住民的遷徙與傳說
    labeled_by: ai
