- id: doc_112_桃園_文昌_社會_g7s1e1_s1_45
  section: 1
  number: 45
  type: single
  page: 5
  stem: 文昌國中擁有豐富的外師資源，辛苦的外師們都是離鄉背井來到台灣謀生，一邊努力適應相差甚遠的環境，同時用心設計課程，想在自己的能力所及的範圍內，帶給同學們最好的。然而，部分「非美國籍」的外師因為帶有台灣人較不熟悉的口音，進而成為部分同學模仿甚至訕笑的對象。這些非美籍外師在得知自己成為學生訕笑的對象後，也感到非常受傷。根據上述真實存在的問題，下列何者說明正確？
  options:
  - label: A
    content: 外師僅是來台工作，不具備我國國籍，因此外師的人權與尊嚴並不受到我國法律保護，我們可以任意踐踏
  - label: B
    content: 只要外師沒意識到自己被學生模仿與嘲笑，不因此感到傷心，那麼這些行為舉止就不構成違法事實，不須限制
  - label: C
    content: 法律保障人人均有言論自由，因此面對文中同學的行徑不應過度干涉，才能實踐和平、尊重、包容之公民基本德性
  - label: D
    content: 文中畫線處的行徑，說明這些學生不只對種族及語言文化存有刻板印象和偏見，也早已構成公然歧視的事實。
