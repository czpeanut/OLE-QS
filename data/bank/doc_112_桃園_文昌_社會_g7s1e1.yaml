- id: doc_112_桃園_文昌_社會_g7s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 資料一中提到的大員商館，起初以轉運商品為主，後來也在當地開始生產商品，以增加獲利。請問：下列選項中的商品，何者即是在當地生產的商品？
  options:
  - label: A
    content: 蔗糖
  - label: B
    content: 白銀
  - label: C
    content: 絲綢
  - label: D
    content: 瓷器。
  group_stem: '資料一

    公司在大員的商館已經沒有辦法賺到錢。最主要的原因是中國的內戰，滿洲人與Koxinga 之間持續的交戰。謠傳，Koxinga 在戰事漸趨不利，很可能他會率領部下轉來福爾摩沙。

    資料二

    Koxinga 告知公司總部，對於有關將進攻福爾摩沙的謠言感到非常遺憾，Koxinga 強調他一直都致力於推動雙方友好的貿易關係。實際上，根據福爾摩沙所說迫在眉睫的入侵，到現在也還沒發生。總部認為這種事情在這邊是不會發生的。自從很多年前就已經流傳著這類的謠言，卻從未看到任何事實。

    資料三

    曾經擔任公司翻譯的漢人何斌，曾勸說Koxinga 攻打臺灣，他主張臺灣物產豐富，沃野千里，適合發展。然而，在攻打臺灣之後，Koxinga 的軍隊卻一度發生斷糧的危機。迫使在驅逐荷蘭人之後，Koxinga
    必須命令軍隊至各地駐紮，並展開拓墾，以解決糧食不足的問題。'
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 歷史
      code: 2-2
      title: 各方勢力在臺灣的競逐
