- id: doc_112_桃園_文昌_社會_g7s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 1670 年，歐洲某國與臺灣王簽訂通商條協議如下：「雙方保證對方人民的安全：臺灣允許某國人民來臺從事貿易，並可在臺設立商館；某國交換的代價，即是必須留一鐵匠在臺灣協助生產槍砲，且未來每艘來臺貿易的船隻，皆必須載有火藥、火器等軍事用品。」請問：關於上述通商協議的相關發展，下列選項中的敘述何者正確？
  options:
  - label: A
    content: 此臺灣王以雲林、嘉義為行政中心
  - label: B
    content: 此臺灣王即為顏思齊
  - label: C
    content: 協議中的火藥、槍砲，是為了對抗大清帝國
  - label: D
    content: 此處簽定協議的某國即為荷蘭。
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 歷史
      code: 3-2
      title: 鄭氏政權與原住民
      chapter: 第3章 大航海時代臺灣原住民與外來者
    textbook: 七上歷史 3-2 鄭氏政權與原住民
    labeled_by: ai
