- id: doc_112_桃園_文昌_社會_g7s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 近年在國際運動賽事中，成為一大焦點的紐西蘭毛利人HAKA 戰舞，竟在臺灣也看得到。在2018 年時，紐西蘭的毛利人來台展開一段尋根之旅。訪問團一抵達台灣花東地區的阿美族部落，即感動落淚的說，這裡是Hawaiki(祖先起源之地)。活動中，訪問團也以HAKA
    戰舞與接待的阿美族進行文化交流。據學者的研究，紐西蘭的毛利人與臺灣原住民族的連結，是有嚴謹的科學研究基礎。在分類上，他們與其他南太平洋諸多島嶼的原住民一樣，皆隸屬於一個廣大的族群，其分布地區如右圖一。請問：下列選項何者並不屬於此一族群？
  options:
  - label: A
    content: 日本的阿依努族
  - label: B
    content: 菲律賓的伊富高族
  - label: C
    content: 印尼的爪哇族
  - label: D
    content: 蘭嶼的達悟族。
