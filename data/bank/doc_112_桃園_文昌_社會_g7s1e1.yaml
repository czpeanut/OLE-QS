- id: doc_112_桃園_文昌_社會_g7s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 學者在菲律賓的大學圖書館中，發現了17 世紀的閩南語辭典手稿。學者推測此手稿應該是殖民菲律賓的某國，在佔領臺灣北部後，為了方便統治臺灣，與在臺的漢人共同編撰而成。此手稿的重要性，不僅在於有助於我們理解閩南語發展，更是見證大航海時代時，臺灣與歐洲交流的重要資產。請問：下列何處最不可能找到文中某國留下的遺跡？
  options:
  - label: A
    content: 淡水
  - label: B
    content: 宜蘭
  - label: C
    content: 基隆
  - label: D
    content: 安平。
