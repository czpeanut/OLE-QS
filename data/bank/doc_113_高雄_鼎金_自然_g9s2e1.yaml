- id: doc_113_高雄_鼎金_自然_g9s2e1_s2_39
  section: 2
  number: 39
  type: single
  page: 4
  stem: 根據文章內容，鎂離子電池的優點不包含下列何者?
  options:
  - label: A
    content: 能儲存更多能量
  - label: B
    content: 低成本
  - label: C
    content: 不易爆炸
  - label: D
    content: 容易製造
  group_stem: "下一代的充電電池?\n  雖然鋰離子電池為當今儲能主力，但目前仍有許多研究團體與廠商試圖找出比鋰電池更穩定與有效的儲能技術，美國能源部國家再生能源實驗室（NREL）近日便成功研發出鎂固態電池，且該電池原型能量密度與材料成本皆比鋰離子電池佳。\n\
    \  鎂地球蘊含量比鋰礦更豐富、成本更低，電量也標榜為鋰電池的兩倍，但仍有諸多障礙待跨越。\n照理來說電池離子可透過電解質在正負極之間流動，藉由電化學反應為電池供電，且該反應必須是可逆的，不然無法為電池充電，但鎂電池中的碳酸鹽（carbonate）電解質在充放電循環中容易在鎂表面形成阻擋層，阻礙電池充電。\n\
    \  雖然鎂也可以透過高腐蝕性液態電解質充放電，但假如採用腐蝕性電解質，鎂電池將無法在高電壓下運作，也有安全疑慮。鎂在地球的含量相當豐富，蘊藏量排名第八，且鎂為鹼土金屬，價電子數為\
    \ 2，與價電子數為 1 的鋰相比，可提供近兩倍電量，再加上鎂不會生成枝晶，電池不會有爆炸風險。假如鎂電池成功推行並商業化，對需求量快速攀升的電池市場大有裨益。(摘錄自再生能源網https://www.re.org.tw/news/more.aspx?cid=200&id=1451)"
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 理化
      code: 1-3
      title: 電池
      chapter: 第1章 電與生活
    textbook: 九下理化 1-3 電池
    labeled_by: ai
