  - label: D
    content: 多聞闕疑且謙卑自牧。
  group_stem: '昔有一僧人，與一士子同宿夜航船。士子高談闊論，僧畏懾，拳足而寢。僧人聽其語有破綻，乃曰：「請問相公，澹臺滅明是一個人、兩個人？」士子曰：「是兩個人。」僧曰：「這等堯舜是一個人、兩個人？」士子曰：「自然是一個人！」僧乃笑曰：「這等說起來，且待小僧伸伸縮腳。」

    余所記載，皆眼前極膚淺之事，吾輩聊且記取，但勿使僧人伸縮腳則亦已矣。故即命其名曰夜航船。

    ——選自張岱夜航船序'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
