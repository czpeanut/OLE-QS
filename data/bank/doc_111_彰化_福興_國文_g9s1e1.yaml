  group_stem: '佟中丞鳳彩巡撫河南，年已老，每日五鼓，燃燭治文書，或坐倦假寐，少頃，輒矍然起，自呼其名曰：「佟某，汝為朝廷大臣，封疆之重，皆汝肩之，奈何不任事若此！」輒以手批頰數四。侍者為之悚慄。

