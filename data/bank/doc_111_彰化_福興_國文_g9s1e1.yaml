  group_stem: '話說德州有三個大城名列全美十大城，但最熱門的德州城市是首府奧斯汀。處於德州這個保守的州，奧斯汀是一個自由的島嶼，有各種文化及生活型態。購物區充斥著時髦咖啡店、異國料理餐廳以及稀奇古怪的獨立商店。當和嬉皮、宅男、龐克和藝術家擦肩而過，就會了解為何奧斯汀市的口號是：讓奧斯汀永保怪異。

    奧斯汀人自誇奧斯汀是「現場音樂表演的世界之都」，有超過二百個表演場地，表演的音樂從龐克到鄉村樂、爵士到獨立搖滾都有，吸引了大批來自世界各地的音樂愛好者。一年到頭都有音樂盛會，但最盛大的活動是南西南音樂電影節，在三月舉行，有兩千多個樂團在九十幾個場地表演，還有電影和一些電腦活動。所以下次想找個時髦又好玩的城市渡假，就是奧斯汀！'
