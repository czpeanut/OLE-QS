  - label: C
    content: 紅色
  - label: D
    content: 白色
  group_stem: "京劇又稱平劇或國劇，是傳統的戲劇表演。京劇中的角色有生、旦、淨、末、丑等，表演的方式則有念(念白)、做(身段)、唱(唱腔)、打(武打)等幾種。\n\
    \   「生」是戲中的男角，有鬚生、小生、和武生等。鬚生扮演的是中年以上男子，要戴髯口(假鬍鬚)，種在唱功；小生是青年男子，唱腔以小嗓(假聲)為主；武生則以表演武打為主，不重唱功。\n\
    \   「旦」為戲中的女角，主要有老旦、正旦、花旦和刀馬旦等。老旦扮演的是年老的婦人；正旦是年輕端莊的女性，戲服多為青色或黑色，所以又稱為「青衣」；花旦是身分地位比較低下的年輕女性；刀馬旦則是武功高強的女性，又稱為「武旦」。京劇的旦角常由男生來扮演，那是清代禁止女性從事歌舞演藝的緣故。這些由男性扮演的旦角，身段的細膩、唱腔的優美，比女人更像女人，許多戲迷都為之瘋狂傾倒，清末民初的梅蘭芳就是大家熟知的京劇名旦。旦隨著時代的演變，越來越少男生扮演旦角，反而有些女生可以反串老生。\n\
    \    「淨」是勾畫臉譜的男角，因此又稱為「花臉」。京劇的臉譜代表人物的性格，使用的顏色各有用意：紅色代表勇敢耿直，黑色代表粗獷但心地善良，白色代表有心機的人，不同的人物畫上不同的臉譜，讓觀眾能一目了然。\n\
    \    「末」在傳統戲劇上扮演的男性的配角，大多和「生」合併，成為鬚生一類的角色。「丑」通常是插科打諢(1)的角色，其口語化的念白與滑稽的動作，使觀眾聽懂，已引發笑果。\n\
    \    「臺上一分鐘，台下十年功」，不管事生、旦、淨、末、丑哪一個角色，要扮演得成功，都要不斷地琢磨，下工夫苦練,才能得到觀眾的掌聲。\n注釋：(1)插科打諢：戲劇表演時，以滑稽的動作或言語引人發笑。諢，音ㄏㄨㄣˋ"
