  stem: 政府大力推廣箱網養殖，主要是為了解決下列哪個問題？
  options:
  - label: A
    content: 淡水魚貨短缺
  - label: B
    content: 地層下陷的困擾
  - label: C
    content: 休閒漁場的缺乏
  - label: D
    content: 漁業勞動力不足
  group_stem: "請閱讀以下文章，並回答問題19~20(節錄【漁業人物誌】臺灣海上箱網養殖第一人──陳怡甲)\n    如今，箱網養殖在全臺蓬勃發展，農委會漁業署也輔導成立全國箱網養殖協會，陳怡甲也在眾人推舉下，擔任起當時的理事長一職，配合漁業署政策，全力推動食品安全，確保水產品品質安全又安心。\n\
    \    現年已67 歲的陳怡甲，每日與海為生、與魚共處，身旁多了2 位得力助手，他的大小兒子也放下原先的工作，回鄉一起打拼，傳承他的精神與技術。陳怡甲也表示：「別人的興趣是玩千萬跑車，但我想買一台自己喜歡的漁船，然後每天到大海中釣魚，優遊在海洋。」身為海之子的他笑說：「我沒有退休的計畫，一輩子都要與海為伍。」雖然他現今的箱網養殖場規模並非全國最大，但他細心照料箱網中的每尾魚，秉持著對食安的堅持，要求最高品質。面對箱網產業的未來，他也深具信心：「箱網有多強，國家就有多強!」從這位全臺箱網領航員的口中，我們可以感受箱網養殖的潛力，未來必為推升臺灣漁業挹注豐沛能量。"
  answer:
  - B
  answer_source: answer_key_vlm
