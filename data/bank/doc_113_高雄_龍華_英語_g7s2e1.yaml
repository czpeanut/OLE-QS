- id: doc_113_高雄_龍華_英語_g7s2e1_s5_35
  section: 5
  number: 35
  type: single
  page: 5
  stem: What can we learn from the reading?
  options:
  - label: A
    content: Whales are big fish in the sea.
  - label: B
    content: Whales can always stay in the water.
  - label: C
    content: There is no hair on old whales’ bodies.
  - label: D
    content: The baby whales don’t drink milk.
  group_stem: 'Do you ever see whales? Aren’t they big? Here are some things about
    whales.

    1. Whales can be very big. A blue whale can be about 29 meters long.

    2. Whales are like fish, swim like fish, but they are not fish. They can’t stay
    in the water all the time.

    3. Whales do not lay eggs. The baby whales drink much milk from their mothers.

    4. Whales have some hair. But when they get old, there is no hair on their bodies.

    5. Some whales can sing under the water. They sometimes sing for a long time.

    6. Whales eat many things in the sea. They open their mouth and are ready to eat
    a lot.


     ever 曾經      whales 鯨魚      thing 事情      meter 公尺       stay 停留      lay 下(蛋)      when
