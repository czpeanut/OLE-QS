  stem: What does stay in shape mean?
  options:
  - label: A
    content: Be fat.
  - label: B
    content: Be cute.
  - label: C
    content: Be careful.
  - label: D
    content: Be healthy and thin.
  group_stem: 'What do you usually do on weekends? Do you like watching TV or going
    to the movies? These are all indoor activities. Get out of your house, and do
    some outdoor activities. One of the popular outdoor activities is to ride a bike.
    You don’t do it with a lot of money, and it can help you stay in shape: you don’t
    worry about getting fat. It’s healthy and great. There are a lot of bike paths
    in Taiwan. Take Fengyuan for example, there are many bike trails with tall green
    trees. Many people feel good and happy about riding a bike there. Do you want
    to go to  the beautiful place? Come to Fengyuan and ride a bike with us!


     indoor 室內的     activity 活動    outdoor 戶外的    worry 擔心     get 變得     path 路徑     trail
    小徑'
