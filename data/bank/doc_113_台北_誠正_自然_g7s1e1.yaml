  - label: C
    content: 一鍋加1 滴沙拉油的米先放在5℃的冰箱冷藏1 小時，另一鍋加1 滴沙拉油的米則放在室溫下1 小時，用同一臺電鍋煮
  - label: D
    content: 其中一鍋不加沙拉油，另一鍋則加2 滴沙拉油，用同一臺電鍋煮。
