  stem: 煮飯的時候如果在洗好的米中滴上一兩滴沙拉油，不但可以使煮出來的米飯充滿油光還會粒粒分明。摳男如果想要證明這件事，要如何驗證呢？
  options:
  - label: A
    content: 一鍋加1 滴沙拉油，另一鍋加2 滴沙拉油，用二個不同的電鍋同時煮
