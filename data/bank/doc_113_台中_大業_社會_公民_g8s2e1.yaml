- id: doc_113_台中_大業_社會_公民_g8s2e1_s1_45
  section: 1
  number: 45
  type: single
  page: 4
  stem: "以下內容節錄自「高雄市公共自行車租賃系統 YouBike 會員定型化契約條款」，請問：關於會員與 YouBike 公司的租賃契約條件，下列敘述何者不正確？\n\
    \n```\n第三條 電子票證及電子支付使用…… \n (三)於還車將公共自行車停回本服務系統之停車柱，並完成扣款繳費。 \n \n第五條 騎乘注意事項……\
    \ \n (三)本服務所提供之自行車，僅適於身高140 公分至190 公分間之人使用，超出或未達於此身高限制之人不得租車使用，如因此致生損害者，本公司不負任何賠償責任。\
    \ \n (四)會員不得以……任何非法方式使用本服務，應遵守中華民國相關法規及道路騎乘之慣例…… 3.遵守道路交通標誌、標線、號誌之指示，並服從執行交通勤務警察之指揮。……\
    \ \n (五)會員於租借期間不慎將自行車遺失者，……應盡速就近向警察機關完成報案程序，……及支付自租車起至遺失 時間（依報案證明所載）之租借費用，租賃關係始即終止。……該自行車自遺失日起逾三個月未尋回者，會員應賠償本公司新台幣9,000\
    \ 元整。…… \n (十一)自行車發生擦撞或毀損致會員或第三人身體傷亡或財物損失時，……會員應立即報案並通知本公司後，租賃關係即為終止。事故原因可歸責於會員時，會員應負擔法律及賠償責任。……\
    \ \n (十三)會員使用本自行車應盡善良管理人注意義務保管之責，禁止出賣、質押、典當或自行修護等行為。\n```"
  options:
