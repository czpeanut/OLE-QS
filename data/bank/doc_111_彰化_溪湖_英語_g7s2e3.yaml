- id: doc_111_彰化_溪湖_英語_g7s2e3_s10_1
  section: 10
  number: 1
  type: single
  page: 3
  stem: How did Justin and his parents go to Nantou last Saturday?
  options:
  - label: A
    content: By train.
  - label: B
    content: By bus.
  - label: C
    content: By plane.
  - label: D
    content: By car.
  group_stem: 'Andy: What did you do last Saturday?

    Justin: My dad drove my mom and me to my grandpa’s house. He lives in a small
    town in Nantou. But my dad’s car broke down on a country road.

    Andy: Too bad. Then how did you get to your grandpa’s place?

    Justin: Luckily, it’s not too far, so we walked to my grandpa’s place.

    Andy: Cool! What did you do there?

    Justin: We visited fruit farm and made some fruit cakes. They were so yummy. We
    also rode our bikes along the country roads. In the afternoon, we went to Sun
    Moon Lake by bus and jogged around the lake.

    Andy: That was fun. Where did you have dinner that day?

    Justin: At a night market.

    Andy: What did you eat there?

    Justin: We ate a lot of yummy food, like stinky tofu and pig blood cake.

    Andy: What a great Saturday!

    Justin: Well, maybe you can go to Nantou with me next time.

    Andy: That’s so nice of you.


