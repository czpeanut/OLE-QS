  group_stem: 蘇祿國在南洋小呂宋群島西南，因中國多次派遣使節來訪，所以蘇祿國王決定回訪，親自到中國晉見皇帝，雖然蘇祿國離中國不遠，但為了迎上西南季風，船隻必先往西行途經爪哇、蘇門答臘、馬六甲，再從越南折返至廣州，最後到達泉州港，再一路北上到達北京，受到中國皇帝的盛情款待，但是這位國王在回國的途中病逝於山東，中國皇帝便以親王之禮就地葬之，並修建了陵墓，即「蘇祿國東王墓」，成為中國國土上唯一的外國國王陵墓。
