  page: 1
  stem: '西元十三世紀，歐洲人馬可波羅到中國經商，受到當時元朝皇帝重用，之後將所見所聞寫成《馬可波羅遊記》。下列哪些情況是他當時可能會遇見的？

    (甲) 中國商人已開始使用紙幣進行交易

    (乙) 在首都可見清真寺等宗教聖地，代表當時穆斯林商人前來中國人數眾多

    (丙) 在首都的街道上隨處可見耶穌會傳教士向百姓傳教

    (丁) 如果要買伴手禮，景德鎮的青花瓷會是個好選擇。'
