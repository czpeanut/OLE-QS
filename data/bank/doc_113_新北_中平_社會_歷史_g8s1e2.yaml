- id: doc_113_新北_中平_社會_歷史_g8s1e2_s1_17
  section: 1
  number: 17
  type: single
  page: 1
  stem: 宋朝自建國以來，不斷遭受外族威脅。在「某場戰爭」中，北宋皇帝親臨前線，結果「諸軍皆呼萬歲，聲聞數十里，氣勢百倍」。最後交戰雙方簽訂盟約，維持將近百年和平。關於這段歷史的敘述，下列何者錯誤？
  options:
  - label: A
    content: 文中交戰雙方是北宋與契丹
  - label: B
    content: 雙方最終簽訂澶淵之盟，維持百年和平
  - label: C
    content: 依照盟約，宋每年需支付鉅額歲幣
  - label: D
    content: 戰後，宋遼之間仍舊維持不平等的君臣關係。
