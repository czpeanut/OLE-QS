  section: 1
  number: 20
  type: single
  page: 1
  stem: 家誠是北宋時代汴京人，請問他的生活可能會出現下列哪些情形？
  options:
  - label: A
    content: 由於國際貿易興盛，汴京城中廣設休息站提供給外來使節及商賈，稱為「驛站」
  - label: B
    content: 當時「坊市制度」已廢除，商家到處林立，營業時間不受限制
  - label: C
    content: 在夜市裡可以買到好吃的烤番薯，也有許多遊樂攤販提供玩樂
  - label: D
    content: 為了考上科舉成為官員，努力把整部《四書集注》背起來。
