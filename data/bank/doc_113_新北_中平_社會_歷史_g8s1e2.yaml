  stem: 明初與清初的統治者，都面臨來自東南沿海的威脅。明朝東南沿海有海盜作亂；而清朝則有鄭氏政權抗清行動。兩者面對的問題雖有差異，但明朝與清朝都選擇了相同的處理方式。此一「處理方式」應為下列何者？〔改寫自98.第一次基測〕
