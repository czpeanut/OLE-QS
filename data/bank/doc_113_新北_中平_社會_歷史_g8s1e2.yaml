- id: doc_113_新北_中平_社會_歷史_g8s1e2_s1_18
  section: 1
  number: 18
  type: single
  page: 1
  stem: 南宋將軍岳飛在「滿江紅」中曾寫道:「靖康恥，猶未雪，臣子恨，何時滅」。靖康之禍最終導致宋朝皇帝被擄往北方，而西晉末年的永嘉之禍也發生過類似情形。針對這兩場禍事，下列敘述何者正確？
  options:
  - label: A
    content: 這兩場禍事最終導致西晉與北宋滅亡
  - label: B
    content: 兩場禍事皆因當時外交政策失當，導致外族入侵
  - label: C
    content: 引發靖康之禍的外族是蒙古，永嘉之禍當時的外患是匈奴
  - label: D
    content: 兩朝皆有將領想搶回北方失土，最終只有岳飛成功。
