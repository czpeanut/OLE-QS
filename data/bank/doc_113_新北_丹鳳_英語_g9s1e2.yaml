  group_stem: "(B)  45 ~ 46 ,  每題 3 分 ; 共6 分\n\n    There are thousands of earthquakes\
    \ in the world every year. About 17 of them are very serious. Before a serious\
    \ earthquake hits, there is a loud, rumbling noise. You might think there’s a\
    \ large truck or train going by. Then, before you know what’s happening, dishes\
    \ and glasses crash onto the floor. Windows and TV screens pop out.  \n    The\
    \ strongest earthquake in history happened in Chile on May 22, 1960. It killed\
    \ about 1,655 people and left about 2 million people homeless. Earlier, there\
    \ was a famous earthquake hitting San Francisco on the early morning of April\
    \ 18, 1906. About 28,000 wooden buildings were destroyed, and some even fell.\
    \ Close to 3,000 people died then.  \n    In fact, most of the people aren’t killed\
    \ by earthquakes themselves but by falling buildings. To make the numbers of dead\
    \ people smaller, rescuers must save those people in danger during hours after\
    \ the earthquake happened.\n    Many scientists have been working hard to find\
    \ a better way to make the damage less. Perhaps in the future, we won’t feel scared\
    \ when earthquakes happen to us.\n\n ＊rumbling 隆隆聲  ＊crash 碰撞  ＊homeless 無家的 \n\
    \ ＊wooden 木製的  ＊destroy 破壞  ＊rescuer 救援者"
