  page: 1
  stem: 關於地方政府的職權，以下描述何者有誤？
  options:
  - label: A
    content: 地方政府的水平分權僅有行政權與立法權，司法權、考試權和監察權仍屬於中央
  - label: B
    content: 地方自治團體當中，屬於地方行政機關包括省（市）政府、縣（市）政府、鄉（鎮、市）公所，以及直轄市山地原住民區公所，負責推動地方自治工作，並執行上級政府委辦的事項
  - label: C
    content: 地方立法機關包括直轄市議會、縣（市）議會、鄉（鎮、市）民代表會，以及直轄市山地原住民區民代表會等。地方民意代表負責議決地方自治條例與預算
  - label: D
    content: 近年來，公共事務龐雜，往往需投入大量的人力、物力和財力，並非單一地方政府所能獨立應付。而隨著都會區的發展，許多複雜性地方事務橫跨不同區域，執行權責就分散由不同的機關負責
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
