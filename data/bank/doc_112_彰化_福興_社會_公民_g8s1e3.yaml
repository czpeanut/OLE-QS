  section: 1
  number: 3
  type: single
  page: 1
  stem: 關於我國的地方政府層級，以下敘述何者正確？
  options:
  - label: A
    content: 我國的地方政府層級，依地方制度法規定，包括直轄市、縣（與縣同級的基隆市、新竹市、嘉義市）、縣所管轄的鄉（與鄉同級的鎮、市）、直轄市山地原住民區總共四個層級
  - label: B
    content: 我國地方政府對轄內部分公共事務享有自治權限，也是我國的地方自治團體
  - label: C
    content: 我國地方自治團體當中，新北市與新竹市屬於相同層級的地方自治團體；彰化縣與基隆市屬於相同層級的地方自治團體
  - label: D
    content: 我國地方自治團體當中，台中市與台南市屬於相同層級的地方自治團體；彰化縣與員林市屬於相同層級的地方自治團體
