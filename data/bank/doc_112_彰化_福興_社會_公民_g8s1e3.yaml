    content: 醫療及長照政策受到候選人的重視
  group_stem: ※日本年輕人以政治冷感聞名，統計數據顯示，過去10年，二、三十歲年輕人投票率在35%左右，比六、七十歲長者整整少了大约一半，就連今年參議院選舉前爆發前首相安倍晉三遇刺的大事，也難讓他們走進投票所投票。專家擔心，若對投票持續冷感，年輕人將遭政治人物忽視，社會也難以進步，令日本陷入「銀髮民主」的危機。「銀髮民主」是指隨著少子化與高齡化，高齡選民比率上升，擁有愈來愈大的政治影響力。為獲得較多數選民的支持，候選人會積極推出有利於高齡者的政見，而忽略中年人和年輕人的需求。一般而言，高齡者希望政府解決醫療、養老、年金等與自己晚年生活相關的問題；年輕族群則希望政府解決教育、稅制，以及社會保障制度等相關問題。若政策明顯傾向某一方，不同年齡之間的生活水平、幸福指數等差距便會拉大，引起社會不安。請回答下列問題
