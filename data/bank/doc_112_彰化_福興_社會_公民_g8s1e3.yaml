- id: doc_112_彰化_福興_社會_公民_g8s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 關於地方政府的組成，以下描述何者正確？
  options:
  - label: A
    content: 「權力分立」是民主國家政府組成的基本原則，又分為垂直與水平的分立。「水平分權」是指同一層級的政府權力應分配給行政、立法等不同部門，彼此互相制衡
  - label: B
    content: 我國中央與地方政府的分權方式採平權制度，依據事務的性質畫分職權。凡事務有全國一致之性質者，屬於中央權限
  - label: C
    content: 事務有因地制宜之性質者，則屬於地方權限，例如：天然災害宣布停班停課事宜、國防事務等。如果中央與地方的權限發生爭議，由立法院解決
  - label: D
    content: 「垂直分權」是指政府權力分屬中央與地方等不同層級的組織分別行使，例如：中央政府主管全國事務，而地方政府則是主管地方事務，就是一種水平分權
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
  answer:
  - A
  answer_source: answer_key_vlm
