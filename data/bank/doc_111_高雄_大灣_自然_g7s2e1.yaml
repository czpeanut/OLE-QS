- id: doc_111_高雄_大灣_自然_g7s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: '人類的 ABO 血型是由一對遺傳因子（等位基因）控制，而控制此血型的遺傳因子有 $I^{A}$、$I^{B}$ 和 i 三種型式，其中 $I^{A}$
    和 $I^{B}$ 是顯性，i 是隱性，血型和基因型的關係如表(一)所示。表(二)為甲～丁四組父母的血型配對，在不考慮突變的情況下，則表(二)中的何種組別不可能生下
    O 型血型的子女？

    表(一)

    | 血型 | 基因型 |

    | --- | --- |

    | A | $I^{A}I^{A}$ 或 $I^{A}i$ |

    | B | $I^{B}I^{B}$ 或 $I^{B}i$ |

    | AB | $I^{A}I^{B}$ |

    | O | ii |


    表(二)

    | 雙親組別 | 父 | 母 |

    | --- | --- | --- |

    | 甲 | A | A |

    | 乙 | A | B |

    | 丙 | O | AB |

    | 丁 | O | O |'
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
