  stem: 日月潭水庫之水位高低落差達三百公尺以上，很適合作為「抽蓄水力發電廠」之用地。所謂抽蓄式水力發電，主要是利用夜間離峰時段的剩餘電力，將「下池」水庫的水抽回「上池」蓄存，待白天尖峰時段，再將上池水放下，推動水輪機發電，使離峰時段剩餘之低成本電力，轉化為尖峰時間高價值之電力。台電於1987年及1996年完成兩座抽蓄水力發電廠（明湖及明潭），均以日月潭水庫為上池，在位於下游的水里溪河谷興建下池，利用上下池間約380公尺之落差作抽蓄水力發電。依據上述，下列何者為抽蓄式水力發電的能量轉換主要過程？
