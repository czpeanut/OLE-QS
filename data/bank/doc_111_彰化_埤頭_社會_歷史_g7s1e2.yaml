- id: doc_111_彰化_埤頭_社會_歷史_g7s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 《裨海紀遊》的作者郁永河是清代人士，在康熙36 年來到臺灣，負責開採今臺北北投一帶的硫礦，並將在臺灣的遊歷、見聞寫成此書，成為後人研究臺灣地理、人文十分珍貴的資料。關於郁永河在臺灣期間的描述，下列何者正確？
  options:
  - label: A
    content: 當時西班牙人掌控臺灣北部的貿易
  - label: B
    content: 開採硫礦的北投地區在當時屬於彰化縣
  - label: C
    content: 他經由八通關古道可到東部遊歷
  - label: D
    content: 全臺灣當時隸屬於福建省管轄。
- id: doc_111_彰化_埤頭_社會_歷史_g7s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 16 世紀中葉的臺灣，有一群人被認為是凱達格蘭族支系的原住民，他們除了語言能力好，並擅長漁獵、操舟和外人接觸頻繁。請問：上文中提到的原住民，應該是下列何者？
  options:
  - label: A
    content: 泰雅族
  - label: B
    content: 馬賽人
  - label: C
    content: 噶瑪蘭族
  - label: D
    content: 賽夏族。
- id: doc_111_彰化_埤頭_社會_歷史_g7s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 荷蘭人來台時，向當地帄埔族購買赤崁一帶的土地來建立市街，又在此處興建城堡。請問：當地帄埔族應屬於下列哪個族群？
  options:
  - label: A
    content: 馬賽族
  - label: B
    content: 凱達格蘭族
  - label: C
    content: 噶瑪蘭族
  - label: D
    content: 西拉雅族。
- id: doc_111_彰化_埤頭_社會_歷史_g7s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 荷蘭政權來台，採取強力鎮壓迫使原住民部落降服，更利用歸順的部落來攻擊其他部落。下列敘述符合荷蘭與原住民的史實？
  options:
  - label: A
    content: 利用麻豆社攻打大肚社
  - label: B
    content: 利用大肚社攻打牡丹社
  - label: C
    content: 利用牡丹社攻打新港社
  - label: D
    content: 利用新港社攻打麻豆社。
- id: doc_111_彰化_埤頭_社會_歷史_g7s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 外來政權來台統治期間，會利用宗教、文化等方面教化「原住民」，下列各時期的統治方式何者正確？
  options:
  - label: A
    content: 荷蘭 設教堂、學校來宣揚天主教
  - label: B
    content: 西班牙建立教堂宣揚基督教
  - label: C
    content: 鄭氏設立學校推廣儒家文化
  - label: D
    content: 清帝國設立電報學堂推動現代化。
- id: doc_111_彰化_埤頭_社會_歷史_g7s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 荷蘭治臺時期，荷蘭聯合東印度公司會將權杖授予原住民部落中有地位的人士，這些人每年集會一次，在會中宣誓效忠荷蘭，並報告各轄區內的情形。請問：上述「有地位的人士」應是指下列何者？
  options:
  - label: A
    content: 來台的傳教士
  - label: B
    content: 各社長老
  - label: C
    content: 漢人承包商
  - label: D
    content: 各部落的巫師。
- id: doc_111_彰化_埤頭_社會_歷史_g7s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 政諺是清領時期的臺灣人，家住臺北。有天他想搭火車到某地拜訪朋友，請問：下列何處可能是政諺要到的目的地？
  options:
  - label: A
    content: 新竹
  - label: B
    content: 台中
  - label: C
    content: 彰化
  - label: D
    content: 台南。
