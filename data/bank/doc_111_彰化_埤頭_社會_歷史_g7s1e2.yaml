  section: 1
  number: 13
  type: single
  page: 1
  stem: 茂伯老師帶學生畢業旅行，車子行經「蘇花公路」時，老師說：「當年為了開發後山，清朝在臺灣開闢三條公路，其中一條就是蘇花公路前身，大家知道是誰開鑿的嗎？及其開鑿此道路的目的為何？」
  options:
  - label: A
    content: 劉銘傳、實施開山撫番政策
  - label: B
    content: 劉銘傳、防範盜匪
  - label: C
    content: 沈葆楨、防止反清事件
  - label: D
    content: 沈葆楨、開發後山。
