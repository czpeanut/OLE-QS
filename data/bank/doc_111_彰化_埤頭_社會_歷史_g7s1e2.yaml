  section: 1
  number: 22
  type: single
  page: 2
  stem: 在臺灣歷史上，三百多年來臺南一直都是臺灣發展的重要文化據點，擁有豐富的文化遺跡。請問：今日臺南赤崁樓旁保存九座「御龜碑」，是乾隆年間平定哪一次民變後所樹立的？
  options:
  - label: A
    content: 林爽文事件
  - label: B
    content: 戴潮春事件
  - label: C
    content: 朱一貴事件
  - label: D
    content: 郭懷一事件。
