  section: 1
  number: 3
  type: single
  page: 1
  stem: 「大肚王國奇遇記」歌舞劇2017 年在大肚國小首演。劇中主角穿越時空回到400年前，被巴布拉族人發現，繼而和他們一起冒險，抵禦荷蘭人的不合理要求，最後為了解救部落的危難
    ，頭目壯烈犧牲，而主角也回到現實世界。請問：上文中提到的原住民，應該在分布在右上附圖中的何處？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
