  section: 1
  number: 28
  type: single
  page: 2
  stem: 旻皓暑假到墾丁旅遊，發現屏東海生館附近有一座「大日本琉球藩民五十四名墓」的墓碑遺跡，這是日治時期日人為罹難琉球人所設立的墓碑。下列有關此一歷史事件的敘述何者正確？
  options:
