  section: 1
  number: 24
  type: single
  page: 2
  stem: 耀宇做了有關臺灣清帝國後期的研究，發現此時的臺灣出現了許多前所未有的事物，他對此加以整理，但其中一項卻出錯，請你幫他找出來。
  options:
  - label: A
    content: 第一座西式炮臺在台南
  - label: B
