  section: 1
  number: 16
  type: single
  page: 1
  stem: 許如歸正在整理歷史筆記，記錄了因:越南問題。人:劉銘傳。時:西元1884 年。地:基隆、水、澎湖。影響:宣布台灣建省。請問筆記是在描述哪場戰爭?
  options:
  - label: A
    content: 甲午戰爭
  - label: B
