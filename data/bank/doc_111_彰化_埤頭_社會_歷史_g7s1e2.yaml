  section: 1
  number: 17
  type: single
  page: 1
  stem: 「有一個歷史人物是臺南赤崁一帶移墾漢人的領袖，由於漢人難以承擔荷蘭統治者的苛徵重稅，於是 在 1652 年發動對荷蘭人的反抗。」請問：這段文字應該是在敘述何人？
  options:
  - label: A
