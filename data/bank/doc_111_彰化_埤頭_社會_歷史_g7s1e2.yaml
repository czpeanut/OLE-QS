- id: doc_111_彰化_埤頭_社會_歷史_g7s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 有關清廷頒布的「渡臺禁令」，下列敘述何者符合史實？
  options:
  - label: A
    content: 除配偶外，規定禁止攜帶男眷
  - label: B
    content: 禁令執行常時寬時嚴，移民偷渡情形仍普遍
  - label: C
    content: 渡臺證照嚴格規定沒結婚才能來臺
  - label: D
    content: 女子不需要申請渡臺證照，就可移民來臺。
- id: doc_111_彰化_埤頭_社會_歷史_g7s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 清嘉慶11 年(西元 1806 年)，福州將軍賽沖阿來臺帄定海盜蔡牽，他擔憂「該地」若無設官治理，將遭到海盜侵占，於是向皇帝報告「該處膏腴為蔡逆(即蔡牽)窺伺。」嘉慶14
    年，閩浙總督方維甸奏請將「該地」納入版圖，至嘉慶17 年正式核定設廳。請問：以上敘述應是臺灣哪個行政區劃設立的過程？
  options:
  - label: A
    content: 淡水廳
  - label: B
    content: 澎湖廳
  - label: C
    content: 卑南廳
  - label: D
    content: 噶瑪蘭廳。
