  section: 1
  number: 23
  type: single
  page: 2
  stem: 十九世紀後期，臺灣成為國際貿易的熱區，也勾起列強野心，當時哪些國家曾武力進犯台灣?
  options:
  - label: A
    content: 英、法
  - label: B
    content: 美、日
  - label: C
    content: 英、美
  - label: D
    content: 日、法。
