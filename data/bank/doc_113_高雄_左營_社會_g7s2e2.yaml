  group_stem: ◎《戰浪》是由公共電視製作的紀錄片，片中記錄臺東縣成功鎮的一群漁民，堅持使用傳統鏢旗魚漁法，藉著膽識和多年經驗，站在窄小的鏢臺上，舉起鏢竿與大海奮戰。從新港外海向北，到花蓮縣豐濱鄉外海1~3
    浬的暖流（烏流），與返流沿岸水（白流）交會的接觸帶，黑白兩水交會稱之為「潮境」，漁民俗稱「相疊流」或「流痕」，每年10 月至隔年1 月，白皮旗魚容易出現在此，季風吹拂海面，使旗魚漂浮到海面上層，當旗魚現身，鏢槍手抓準時機「下鏢」捕魚，那是驚險又刺激的一刻！請根據上文回答下列問題：
