- id: doc_113_高雄_左營_社會_g7s2e2_s4_29
  section: 4
  number: 29
  type: single
  page: 4
  stem: 根據第二段的敘述，在台灣，「外籍新娘」、「越南新娘」、「大陸新娘」等稱呼，可以用來說明以下哪一個概念？
  options:
  - label: A
    content: 文化位階
  - label: B
    content: 多元文化
  - label: C
    content: 文化差異
  - label: D
    content: 文化傳承
  group_stem: "在台灣，跨國婚姻移民有各種稱呼，他們早期被稱為「外籍配偶」、「外籍新娘」，如今大家都叫他們「新住民」。關於「新住民」定義，目前各界都因為業務或服務範疇不同，而有所差異。根據內政部《新住民發展基金收支保管及運用辦法》，新住民的定義為：「臺灣地區人民之配偶為外國人、無國籍人、大陸地區人民及香港、澳門居民」。「外籍配偶」泛指和本國籍人士結婚的外籍人士。許多台灣民眾認為「外籍配偶就是嫁來台灣的越南女性或中國大陸女性」，這是錯誤的。其實他們來自各個國家，也不分男女，只因越南和中國大陸女性佔外籍配偶大多數，才成為大家眼中的「外配代表」。\
    \ \n    其中，「外籍新娘」這個稱呼，容易標籤化該群體，也透露台灣對第三世界女性的歧視，無論來台多久、是否是新人，她們總被稱呼「外籍新娘」、「越南新娘」、「大陸新娘」。不少新住民嘲諷：「我都是老娘了，還叫我新娘！」民間團體不斷發起正名運動，在2003\
    \ 年發起的一場投票活動中，顯示這群新住民女性更喜歡自稱「新移民女性」。而如今官方和社會大眾則逐漸使用統一的「新住民」這個稱呼。"
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 公民
      code: 1-2
      title: 文化位階與不平等
      chapter: 第1章 多元文化
    textbook: 七下公民 1-2 文化位階與不平等
    labeled_by: ai
