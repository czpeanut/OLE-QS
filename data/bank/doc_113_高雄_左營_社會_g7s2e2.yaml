  group_stem: "◎為減緩農村人口高齡化的速度，政府過去十餘年積極推動青年返鄉計畫，祭出許多補助、訓練計畫鼓勵青年回鄉從農，以下為四位傑出青農，背負著種種現實的壓力，各自在不同的地方為了自己的「青農夢」而努力著。\
    \ \n小豪：「仙履蘭的外型與花色千變萬化，被列入瀕危野生植物，經過農委會種苗場的多年努力，讓人工栽培的仙履蘭種苗與切花外銷產業蓬勃發展，看重此商機的我返回臺南後壁投入生產行列。」\
    \ \n阿教：「我在花蓮玉里從事有機水稻種植，除了耕種自家20 幾公頃的有機稻田，還串起30 位農民共120 公頃有機稻田，擴大有機耕種面積，用機械提升生產效率。」\
    \ \n小佩：「我將位於南投鹿谷的自家茶園規劃成體驗區，讓遊客可以體驗採茶、觀察茶葉生態，並且設計規劃許多茶品DIY 活動，讓來到這裡的人都能沈浸在迷人茶香中。」\
    \ \n真真：「我在雲林東勢跟隨祖父的腳步種植大蒜，不斷思考更友善環境的農法，種出風味醇厚的大蒜，建立自家品牌且申請產銷履歷認證，為的就是提升產品形象，讓消費者買得更安心。」"
