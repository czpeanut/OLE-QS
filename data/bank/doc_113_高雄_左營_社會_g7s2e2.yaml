  - label: C
    content: 《臺灣日日新報》
  - label: D
    content: 《美麗島》。
  group_stem: "(一) 請根據以下短文回答第10~11 題 \n〈沒有名字的黨〉 \n過去臺灣社會在戒嚴時期，還沒有自由組黨的權利，但仍然有一群非國民黨、同時進行反對國民黨獨裁統治、爭取民主自由的人，形成了所謂的「黨外」。而在那個還沒有網路的時代，黨外人士主要透過興辦雜誌的方式，來宣傳自己的理念和主張。民國68\
    \ 年6 月，黨外人士申請創辦了一個「新的雜誌」，以「形成沒有黨名的政黨，主張實行國會全面改選與地方首長改選」作為其創辦雜誌的目的，並網羅各派黨外人士，作為雜誌社的重要成員。"
  tags:
