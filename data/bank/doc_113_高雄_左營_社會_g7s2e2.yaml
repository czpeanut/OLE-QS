  stem: "同學參觀美術館看到以下作品與解說。請問：下列敘述何者正確？ \n「朱鳴岡《迫害》作品簡介：由於作者曾閱讀禁書，受到情治部門警告，他以這個經驗創作此畫。本幅刻畫臺大教授許壽裳突遭綁架的情景。兩個特務，一左一右，一個緊揪教授上衣，一個以手槍頂在教授腰間；書籍驟然墜地，教授目瞪口呆，不知犯了何罪。」"
