  stem: 「國會擴權」法案於今年六月已就覆議案進行表決，當時民團連續3 天在立法院外舉行「反對國會濫權、拒絕民主倒退」重返立院集結行動，卻遭北市警局故意刁難，要求每晚須將舞台拆掉，隔天再搭一次，消息曝光後市警局被民眾抗議電話灌爆，後續才告知民團取消此一要求…根據新聞提及現代國家功能，下列敘述何者最正確？(L1)
  options:
  - label: A
    content: 國家應制定法律，保障人民有集會、遊行並表達意見的自由—保障基本人權
  - label: B
    content: 警察職權之一為依據法律維持社會治安，不可任意侵害人權—保衛國家安全
  - label: C
    content: 社會大眾撥打抗議電話，並且要求警方須依照法律行使職權—發展教育文化
  - label: D
    content: 新聞媒體以公正角度播放新聞，望能喚起社會重視人權議題—發展社會福利。
- id: doc_113_新北_永和_社會_g8s1e1_s3_57
  section: 3
  number: 57
  type: single
  page: 6
  stem: 對於民主國家中「權利」和「權力」之間的關聯，下列何者用詞和敘述完全正確？(L2)
  options:
  - label: A
    content: 人民有投票權，選出政府賦予其對內最高、對外獨立的主權
  - label: B
    content: 若政府違法行使公權利，人民可以向司法機關尋求協助
  - label: C
    content: 若警察未依照程序進行臨檢，是對於人民權力的侵害
  - label: D
    content: 人民有權利罷免違反民意的行政首長或民意代表
- id: doc_113_新北_永和_社會_g8s1e1_s3_58
  section: 3
  number: 58
  type: single
  page: 6
  stem: 艾克頓爵士指出：「權力使人腐化，絕對的權力使人絕對腐化。」為避免政府濫用權力而影響到人民，民主國家以「分權制衡」作為建構政府體制的原則，關於分權制衡的敘述，何者正確？(L2)
  options:
  - label: A
    content: 孟德斯鳩主張將政府權力分成行政、立法、監察三權，避免權力集中
  - label: B
    content: 孫中山提出的五權分立是多數的西方國家所採用的政府體制
  - label: C
    content: 只要政府的權力有分立，各權力間沒有互相牽制也符合分權制衡的精神
  - label: D
    content: 以分權制衡為原則建構的政府是會受到人民監督、約束的有限政府
- id: doc_113_新北_永和_社會_g8s1e1_s3_59
  section: 3
  number: 59
  type: single
  page: 6
  stem: 根據上文，請問甲權和乙權應分別填入下列何者？(L2)
  options:
  - label: A
    content: 行政；考試
  - label: B
    content: 司法；考試
  - label: C
    content: 立法；監察
  - label: D
    content: 行政；監察
  group_stem: '請閱讀短文，並回答第59-60 題

    孫中山先生在《五權憲法》演講中說：「五權憲法是我所創造，古今中外各國從來沒有的。」他認為，傳統憲法在政府機關採取的三權分立制度中，甲權擁有乙權將可能濫用私人，丙權擁有丁權則將有國會專制的流弊。孫中山認為，西方代議民主中的國會相對於行政機關權力太大，常常形成國會獨裁或議會專制；因此認為應該將此兩者分離，另設乙權和丁權，此乃五權分立之由來。他說，這是「破天荒的政體」。'
