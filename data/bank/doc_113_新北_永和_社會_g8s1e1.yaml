  stem: 知名YouTuber 九妹計畫利用元旦連續假期前往中國東北搭乘直通黑龍江省與海南省的列車，該班次連結中國最北與最南省分，全長共計4276 公里，單趟車程約47
    小時，故有「天南海北第一車」之稱。火車一路從嚴寒的冰天雪地前往溫暖的熱帶島嶼過冬，行李箱裡必須帶著由冬季到夏季的衣物，親身感受「一車過四季」的旅遊經驗，也打算將整個旅遊行程拍成視頻與觀眾們分享。請問：在這段列車行駛的路線中，下列哪項氣候資料的數值呈現逐漸遞減的趨勢？
