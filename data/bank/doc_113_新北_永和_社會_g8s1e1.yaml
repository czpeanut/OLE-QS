  group_stem: '請閱讀短文，並回答第41-43 題

    2015 年是被譽為憲政鼻祖的英國《大憲章》生效800 週年。英國、美國、加拿大等許多國家都舉行盛大的紀念活動。《大憲章》的簽署起源於一群英國貴族對於當時國王至高無上的「權力」、高稅收的制度極為不滿，於是起身極力反抗，並要求當時的約翰王簽署《大憲章》。而後《大憲章》終於確立，也第一次公開限制了絕對的王權，奠定了國王也不能凌駕於法律之上的原則。'
