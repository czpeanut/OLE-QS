- id: doc_113_新北_永和_社會_g8s1e1_s2_37
  section: 2
  number: 37
  type: single
  page: 4
  stem: 丙時期顯示世族的勢力逐漸趨於衰微，無法長期掌握政治權力，此變化應與哪則資料的內容有關？為什麼？(L1)
  options:
  - label: A
    content: 資料一與資料三，品評只重家世與背景
  - label: B
    content: 資料二與資料四，有能力者皆可以報考
  - label: C
    content: 資料三與資料四，設立孝子、廉吏科目
  - label: D
    content: 資料二與資料四，依照規定來舉薦人才。
  group_stem: "◎題組三:  \n資料一: 朝廷原定中正制因漢末戶籍散逸，舉孝廉不易，故定九品，以中正官尋訪品評各地人才以充官吏之不足。而今中正官評定高低隨意，愛憎和虛實全在於己，對公不負考核之責，對私不怕告發……上品無寒門、下品無世族，廉潔風氣喪失。\n\
    資料二:政府透過開科取士的方式來選拔人才，其中包含：進士、明經、明法、明算等科別，只要有能力者都可以報考，為平民晉升開啟了一道大門。\n資料三:某制度弊端之一，首先是薦舉依託於權勢，導致選才不公、名不符實。故有民謠諷刺道：「舉秀才，不知書；舉孝廉，父別居。寒素清白濁如泥；高帝良將怯如雞。」\n\
    資料四:朕欲改變前代選官制度，選官應不問門第，只問才能，讓寒門子弟有機會一展長才。可開科取士，規定學子參加秀才、明經等各科的考試，若考試合格者即錄用為官。\n\
    資料五:世族興衰趨勢示意圖"
  shared_asset: g2_37_40
