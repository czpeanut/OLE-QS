  stem: 根據本文的敘述，下列分析何者正確？
  options:
  - label: A
    content: 作者的母親也是北方人，很會料理北方菜肴
  - label: B
    content: 香港朋友使作者「怵然一驚」的原因是，自己隨時可以吃到母親做的餡餅，卻很少去感受母愛
