- id: doc_113_高雄_獅甲_國文_g7s2e3_s2_43
  section: 2
  number: 43
  type: single
  page: 4
  stem: 作者面對「自己的欠缺」抱持何種態度？
  options:
  - label: A
    content: 由忿恨轉為接受
  - label: B
    content: 始終樂觀以對
  - label: C
    content: 並無明確主張
  - label: D
    content: 感嘆造化弄人，只能無奈接受
  group_stem: 在一個講究包裝的社會裡，我們常禁不住羨慕別人光鮮華麗的外表，而對自己的欠缺耿耿於懷。但就我多年觀察，我發現沒有一個人的生命是完整無缺的，每個人多少少了一些東西。有人夫妻恩愛、月入數十萬，卻是有嚴重的不孕症；有人才貌雙全、能幹多財，情字路上卻是坎坷難行；有人家財萬貫，卻是子孫不孝；有人看似好命，卻是一輩子腦袋空空。每個人的生命，都被上蒼劃上了一道缺口，你不想擁有它，它卻如影隨形。以前我也痛恨我人生中的缺失，但現在我卻能寬心接受，因為我體認到生命中的缺口，彷若我們背上的一根刺，時時提醒我們謙卑，要懂得憐恤。若沒有苦難，我們會驕傲，沒有滄桑，我們不會以同理心去安慰不幸的人。我也相信，人生不要太圓滿，有個缺口讓福氣流向別人是很美的一件事，你不需擁有全部的東西，若你樣樣俱全，管別人吃什麼呢？也體認到每個生命都有欠缺，我也不會再與人作無謂的比較，反而更能珍惜自己所擁有的一切。（節錄自張忠謀
    給有福氣的人看）
