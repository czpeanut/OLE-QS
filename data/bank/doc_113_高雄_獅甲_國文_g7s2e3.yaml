  type: single
  page: 2
  stem: 張拓蕪 紡車：「紡車是母親生活的一部分，也是她生命的一部分。從少女時代就一隻手牽著，一隻手搖著，把少女搖成白髮的老嫗，把挺直的腰桿搖成佝僂。然後再教十六歲的女兒搖，再過幾十年，十六歲的女兒也會搖成六十歲的白髮婆婆，叮嚀一聲聲地傳下去。」文中傳達的意旨為何？
