  section: 1
  number: 7
  type: single
  page: 1
  stem: 「人們總是讚美自石縫中鑽生出的小草，卻遺忘了日日溫煦照耀小草的陽光。」這句話的含義與下列何者相同？
  options:
  - label: A
    content: 與其錦上添花，不如雪中送炭
  - label: B
    content: 成功需要旁人的支持與合作
  - label: C
    content: 渺小平凡的人，一樣有偉大的貢獻
  - label: D
    content: 生命，就該浪費在美好的事物上
