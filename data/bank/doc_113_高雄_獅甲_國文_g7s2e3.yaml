- id: doc_113_高雄_獅甲_國文_g7s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 「很多人沒有準備好自己的眼睛，就算去到羅浮宮，也裝不進任何東西到自己的生命裡。很多人沒有準備好自己的耳朵，在音樂廳一樣聽音樂會，他就不會有感動，不會有愉悅，不會有音樂衝擊出來的體驗。很多人沒有準備好自己的心，他就無法感染別人的痛苦、別人的興奮、別人的快樂。」（楊照
    我想遇見妳的人生）下列何者與這段文章的涵義最為相近？
  options:
  - label: A
    content: 人要開放自己，讓世界的豐富，透過感官與想像，都變成生命中的豐富
  - label: B
    content: 不要為成功而努力，要為作一個有價值的人而努力
  - label: C
    content: 最勇敢的水手也必須有自己的目的地才能航行
  - label: D
    content: 人生最大的快樂不在於占有什麼，而在於追求什麼的過程
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 國文
      code: 第九課
      title: 謝天
      chapter: null
    textbook: 七下 第九課 謝天
    labeled_by: ai
