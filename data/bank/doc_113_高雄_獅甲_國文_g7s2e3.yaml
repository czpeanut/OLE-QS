- id: doc_113_高雄_獅甲_國文_g7s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 「日日，從日出到日落╱不知道疲倦的母親，這樣講──╱清涼的風，是最好的電扇╱稻田，是最好看的風景╱水聲和鳥聲，是最好聽的歌╱不在意遠方城市的文明╱怎樣嘲笑，母親╱在我家這片田地上╱用一生的汗水灌溉她的夢」（吳晟
    泥土）關於這首詩的評論，下列敘述何者最不恰當？
  options:
  - label: A
    content: 作者藉由「不知道疲倦」來襯托出母親的刻苦勤勉與憨直性格
  - label: B
    content: 文中作者的母親認為涼風、稻田、水聲與鳥聲有療癒內心的作用
  - label: C
    content: 作者的母親從不在意遠方城市的奢華，也不在意別人倨傲的嘲笑
  - label: D
    content: 本詩藉由作者母親的卑微處境，諷刺當時社會男女地位的不平等
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 國文
      code: 第九課
      title: 謝天
      chapter: null
