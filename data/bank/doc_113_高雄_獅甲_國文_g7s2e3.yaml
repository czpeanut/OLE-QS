  - label: D
    content: 官吏只知逢迎，不知勸諫國君
  group_stem: "雲清小說‧催科   江盈科 \n  昔有醫人，自媒能治背駝，曰：「如弓者，如蝦者，如曲環者，延吾治，可朝治而夕如矢。」一人信焉，而使治駝。乃索版二片，以一置地下，臥駝者其上，又以一壓焉。又即躧焉。駝隨直，亦復隨死。其子欲鳴諸官。醫人曰：「我業治駝。但管人直，哪管人死！」\
    \ \n  嗚呼！世之為令，但管錢糧完，不管百姓死，何以異於此醫也哉！雖然，非仗明君躬節損之政，下寬恤之詔，即欲有司不為駝醫，可得耶？注：躧：音ㄒㄧˇ，踏。"
