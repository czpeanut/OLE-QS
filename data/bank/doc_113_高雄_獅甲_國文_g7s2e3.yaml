- id: doc_113_高雄_獅甲_國文_g7s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 「慢養是什麼？慢養是不要緊張、不要急。慢養是要幫助父母了解，決定孩子一生的是性格（不是考試成績）。我們怎麼樣才能幫助孩子更有自信，態度積極正向，怎樣幫助他們充滿熱忱，個性開朗，常常面帶笑容。」（黑幼龍
    慢養）下列選項，何者符合黑幼龍的教育理念？
  options:
  - label: A
    content: 不讓孩子輸在起跑點，盡早學習各項才藝
  - label: B
    content: 把最好的留給孩子，生活不虞匱乏
  - label: C
    content: 尊重孩子的特質，循循善誘，培養自我管理的能力
  - label: D
    content: 不打不成器，嚴格督促孩子上進
