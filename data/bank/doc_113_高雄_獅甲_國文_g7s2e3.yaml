  section: 1
  number: 3
  type: single
  page: 1
  stem: 「每當女兒們回來，做父母的總會到菜園摘回自己種的蔬菜與水果，一條絲瓜、幾顆番茄……。或許，對拙於言辭的老一輩的人來說，食物是他們對子女表露情感的另一種方式吧！」上文旨在說明什麼涵義？
  options:
  - label: A
    content: 父母接受孩子的予取予求
  - label: B
    content: 父母對孩子的感情含蓄內斂
  - label: C
    content: 給予物品不是最好的關愛方式
  - label: D
    content: 就算禮物再簡陋，孩子都願意接受
