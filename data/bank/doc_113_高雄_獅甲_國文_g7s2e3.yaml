  section: 1
  number: 8
  type: single
  page: 1
  stem: 「偶爾也望一望絢麗的晚霞／卻不再逗留／因為你們仰向阿爸的小臉／透露更多的期待」，琳尼特對這段詩句深受感動，他想找意涵相近的名言，請問下列何者適合？
  options:
  - label: A
    content: 父親，應該是一個氣度寬大的朋友（狄更斯）
  - label: B
    content: 父親們最根本的缺點在於想要自己的孩子為自己爭光（羅素）
  - label: C
    content: 家庭是父親的王國，母親的世界，兒童的樂園（愛默生）
  - label: D
    content: 父愛可以犧牲自己的一切，包括自己的的生命（達文西）
