  section: 1
  number: 1
  type: single
  page: 1
  stem: 臺灣藝術團隊遠征英國的「2016 愛丁堡藝穗節」，以五金器材與臺灣在地生活用品現場創作，帶給觀眾無限想像空間。這樣的空間藝術和沈復兒時記趣的文中旨趣相似，下列何者無法用來詮釋？
  options:
  - label: A
    content: 萬物靜觀皆自得，四時佳興與人同（程顥）
  - label: B
    content: 欲要看究竟，處處細留心（宋帆）
  - label: C
    content: 這個世界不是缺少美，而是缺少發現（羅丹）
  - label: D
    content: 書山有路勤為徑，學海無涯苦作舟（韓愈）
  lesson_raw:
    title: 兒時記趣
    basis: 題目引用兒時記趣
