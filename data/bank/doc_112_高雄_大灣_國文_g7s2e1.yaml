  type: single
  page: 6
  stem: 本文運用的寫作題材，不包含下列何者？
  options:
  - label: A
    content: 他人的評論
  - label: B
    content: 城市的新移民
  - label: C
    content: 自身的生活經驗
  - label: D
    content: 外國的事例
  group_stem: "（三）我是城市裡的異鄉人，租了個房間，過著上班下班吃飯遊樂的普通生活。我在這個城市生活了十多年之久，遠超過我過去居住的城鎮，成為我最熟悉的故鄉。在這個城市的故鄉，時而有些意外的發現，例如租屋處樓下新開了一家小店，上午賣早餐，中午賣越南河粉，老闆、店員清一色都是越南人。從我好奇這家小店的故事開始，竟慢慢發覺這周遭的許多小吃店，不論賣素食或是滷味的，老闆娘都是外籍配偶，我才發覺，她們也成了這個城市的風景。\n\
    \  有時候我還是會想起自己在那深夜火車車廂中，有口難言，難以辯解的委屈，或者想起獨自在異地旅行中，遇到的許多無助時刻。因此，有時候看著我的城市裡的異鄉人，我也會好奇他們能不能說話，有沒有聲音？\n\
    \  被視為越南現代意象的河粉、國服，其實都不是越南原有的物品，而是來自於柬埔寨。法國人來的時候，看到攤子上賣的河粉，便以為那是越南原有的食品。我的國家，我的城市，不也如此？如果食物的意象都曾如此多元混雜淬鍊出新，更何況人？當外籍配偶或者移工，漸漸嵌入了這個城市、這塊土地，我們這個原就屬於移民社會的國家，也就更繽紛。屆時，不是他們沉默，而是我們一起發聲。\
    \  （改寫自阿潑 越南：日久他鄉是故鄉）"
