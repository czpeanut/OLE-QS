- id: doc_112_高雄_大灣_國文_g7s2e1_s4_30
  section: 4
  number: 30
  type: single
  page: 6
  stem: 根據上文內容，下列敘述何者正確？
  options:
  - label: A
    content: 在古代稱呼對方的名比稱呼對方的字，更具敬意
  - label: B
    content: 古代人先有名後有字，名與字之間多具有關聯性
  - label: C
    content: 現代人的名字多為自取，風雅程度自然不如古人
  - label: D
    content: 男子雖已二十歲，但若未與女子婚配仍不可取字。
  group_stem: '（二）  現代漢語中雖然仍有「名字」一詞，可實際上，現代人只有「名」卻無「字」。然在古代，「名」與「字」，可是有明顯的分際。古人取名，是在出生三個月後由父親命名的，往往寄託著父輩對兒女的希望。《禮記》：「男子二十歲，冠而字」；「女子許嫁，笄而字」，就是說，當男女成年時，就要在「名」之後，再加「字」。為什麼要這麼做呢？在《儀禮》中說：「冠而字之，敬其名也。」意思是一個人成年之後，由長輩所命和多年來被長輩所呼的「名」，就不便在社交場合呼來喊去，所以，就得另取一個供平輩或晚輩可以稱呼的「字」。這也是古人為何稱尚未許配嫁人的女子為「待字閨中」。

    先有名而後有字，古人取字一般都遵循「名字相應」的原則，即名與字之間一定有聯繫。其相應方式，主要有以下幾種：

    同義互訓：是說名與字的意義相同，或者可以相互解釋。如孔子的學生宰予，字子我，「予」與「我」同義。以此類推，諸葛亮，字孔明，「亮」與「明」同義；班固字孟堅，「固」與「堅」同義。

    反義相對：是說名與字的意義相反。如唐代文學家韓愈，字退之，「愈」與「退」反義；南宋理學家朱熹，字晦庵，「熹」與「晦」反義。

    近義聯想：是說名與字有承接的意涵。如三國名將張飛，字翼德，由翼而飛；趙雲，字子龍，取雲從龍之意。

    同類相及：是說名與字屬於同類相關。如孔聖人的兒子孔鯉，字伯魚，鯉是魚類；宋末元初的大學者鄭樵，字漁仲，樵夫常與漁翁為侶。

    原名變化：是說字來自名稍做變化，如「詩仙」李白，字太白；晚唐詩人杜牧，字牧之。

    追慕古人：如南北朝的顏之推，字介，是追慕春秋時晉國名士介之推；明末清初的史學家顧祖禹，字景范，當是景仰北宋史學家范祖禹。                                         改寫王東峰〈古人的名字〉'
