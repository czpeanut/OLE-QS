  group_stem: '（二）  現代漢語中雖然仍有「名字」一詞，可實際上，現代人只有「名」卻無「字」。然在古代，「名」與「字」，可是有明顯的分際。古人取名，是在出生三個月後由父親命名的，往往寄託著父輩對兒女的希望。《禮記》：「男子二十歲，冠而字」；「女子許嫁，笄而字」，就是說，當男女成年時，就要在「名」之後，再加「字」。為什麼要這麼做呢？在《儀禮》中說：「冠而字之，敬其名也。」意思是一個人成年之後，由長輩所命和多年來被長輩所呼的「名」，就不便在社交場合呼來喊去，所以，就得另取一個供平輩或晚輩可以稱呼的「字」。這也是古人為何稱尚未許配嫁人的女子為「待字閨中」。

