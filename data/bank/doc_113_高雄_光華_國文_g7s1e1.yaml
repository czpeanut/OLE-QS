  group_stem: "七月流火，確實是。沒幾天前才見到金龜子爬在鳳凰花苞上，突然間花苞都張開一半了；沒幾天後抬頭一看，天，這哪叫開花？這是燃燒！片片點點的綠，大塊大塊的紅，一樹火紅，燒得晴空更藍更高了，燒得停雲更白更亮了，燒得人心慌惶了，怎麼辦好呢，這火海燒得如此理直氣壯！\n\
    \    不講理的燃燒，整整一個七月，那是難得形容的壯烈，決然不肯妥協的壯烈，雷打不掉的雨洗不去的壯烈。雨來最好，沖走灰塵之後，綠的更綠，紅的更紅，搭配水珠的晶亮，足以搶走原本落在美麗少女身上的眼光。\n\
    \    西風唱起，鳳凰花落了一地，撲簌簌的掉，不必傾耳就聽得著。心疼的不是稀疏可見的枝枒，是那樹下相疊的殘英。西風緊了，落紅逐漸轉褐，與泥土一般顏色，黃葉細細密密的伴著它，繁榮在一起，凋零也在一起，義士的情懷。\n\
    ──阿盛鳳凰樹"
