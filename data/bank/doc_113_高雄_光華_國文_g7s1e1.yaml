    content: 作者用「落盡了葉的樹」來形容自己
  - label: D
    content: 以「不停地，不停地」強調內心的渴望。
  group_stem: "當風和雨在暗夜裡突然來訪，\n    這小樓乃如一株落盡了葉子的樹；\n    那憂鬱的夢啊！是枚白色的殼，\n    我呀，就是馱著那白色的殼的蝸牛。\n\
    \    我，有一對耽於沉思的眼睛；\n    樓，有很多扇開向藍天的窗口。\n    但陽光的啄木鳥是許久也沒有飛來了，\n    不停地，不停地，我揮動著招引的手。\n\
    ──楊喚小樓"
