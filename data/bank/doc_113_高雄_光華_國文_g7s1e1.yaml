  group_stem: "獨立成功的美國，為讓自己變得更強，第一步便前往西部發展，進行一連串的動作：趕走印地安原住民、向法國買下路易斯安那、向西班牙買下佛羅里達，接著趁墨西哥與西班牙打仗時，拉攏德克薩斯共和國，成為美國德州。\n\
    \    甲：「你怎麼可以趁人之危？把德州吐出來！」\n    乙：「德州才不想跟你在一起，你不要逼他。」\n    於是發生乙甲戰爭，乙大獲全勝，一舉拿下俄勒岡、加利福尼亞跟一部分的墨西哥領土，成為一個橫跨大西洋跟太平洋的超級大國。\n\
    ──改寫自黑貓老師昭昭天命與□□戰爭"
