  stem: 「忙碌上班族，又有一種新的料理方式可以節省烹調和備料的時間！此料理方式來自日本，概念類似大鍋菜、一鍋食，特色是水分少、無油煙、營養保留完整且製作簡單，它是「□□料理」。□□料理的烹調原理是利用鍋子密閉、保溫的功能，用食物本身滲出的水分將食物蒸熟，因此，所有會出水的食材都能用來做成□□料理，最常見的如紅蘿蔔、洋蔥、番茄、菇類等。」根據內容，空格中應填入下列何者最恰當？
  options:
  - label: A
    content: 蔬食
  - label: B
    content: 分子
  - label: C
    content: 無水
  - label: D
    content: 創意。
