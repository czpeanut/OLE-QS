- id: doc_113_高雄_光華_國文_g7s1e1_s2_7
  section: 2
  number: 7
  type: single
  page: 4
  stem: 根據本文，孩子不花錢的原因最有可能是下列何者？
  options:
  - label: A
    content: 自己身上沒有帶錢
  - label: B
    content: 家中經濟困窘
  - label: C
    content: 沒有購物欲望
  - label: D
    content: 校長已經請客。
  group_stem: "我心裡面納悶著：一個八歲的小朋友身上帶了錢，一整天看同學買這、吃那，她居然說她沒花錢，這怎麼可能！我問孩子：「你今天帶的錢是誰給你的？」「是阿媽給我的。」「那你的錢呢？」她一聲不響，卸下她的小背包，伸手到背包最底下拿出那七十塊錢。我以吃驚又難以置信的口吻誇獎她說：「哇！你真乖，你真的都沒花錢。」小女孩低著頭，小聲的告訴我：「阿媽說不能花……」\n\
    \    當這句話聽進我的耳朵的同時，我不僅眼紅、鼻酸，心裡真是難過極了。\n    我牽著她的小手：「來，和校長到那邊，校長口好渴，我想去買杯飲料。」一路上，雖然沒幾步路，心裡卻是那麼沉重。孩子那句「阿媽說不能花」一直迴盪著、觸動著我的心。一個八歲大的小孩，謹記著出發前阿媽的叮嚀，她真的那麼懂事。而阿媽那麼有心，拿了零用錢給孫女，為的是不讓孩子看到同學有錢，而她沒有。阿媽的用心是那樣令人感動，只是對這孩子來說也實在太難為了！不知不覺已走到了賣冷飲的攤位。我停下腳步，拿出五十元鈔票遞給孩子，我說：「校長不渴，妳自己想喝什麼，去買一杯飲料。」孩子說：「一杯？」「是一杯，校長不渴。」看著她買飲料高興的模樣，我內心吶喊著：「孩子的媽，這個時候你在哪？」她買了一杯可樂，手上握著找回的三十元，舉得高高的說：「校長，找的錢。」我收下了錢，孩子深深的向我一鞠躬：「校長，謝謝。」看著她既不好意思又雀躍的表情，當時的我已淚成行。\n\
    ──陳鴻松阿媽說不能花"
