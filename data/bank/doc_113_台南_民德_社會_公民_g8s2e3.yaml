  section: 1
  number: 24
  type: single
  page: 2
  stem: '根據我國法律規定，電影片、電影片的廣告片非經中央主管機關審議區分影片級別並核准者，不得映演，其中部分規定如下：

    電影片、電影片之廣告片有下列情形之一，列為限制級。未滿十八歲之人不得觀賞。

    一、描述吸毒、販毒、搶劫、綁架、殺人或其他犯罪行為情節細密，有誘發模仿之虞者。

    二、有恐怖、血腥、暴力、變態等情節且表現方式強烈，十八歲以上之人尚可接受者。

    三、以動作、影像、語言、文字、對白、聲音表現出強烈之性表現或性暗示，且不致引起十八歲以上之人羞恥或厭惡者。


    上述規定與下列我國何項規定的立法精神最類似？'
