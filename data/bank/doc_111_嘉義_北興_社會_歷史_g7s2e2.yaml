  stem: 目前正在台北藝術大學就讀劇場設計學系的阿惠，得知這次台灣設計展就在自己的家鄉嘉義市舉行，感到相當的振奮，她決定邀請同學們來嘉義看展，並且盡地主之誼。當天阿惠的阿公親自到火車站接待，同學們看到微改造的火車站，呈現出1933
    年日式風格的設計，讚嘆不已。阿公也補充說明:我們的嘉義驛站在1902 年早就是三鐵共構的車站呢…。請問:阿惠阿公所說的三鐵共構，應該是哪三鐵？
  options:
