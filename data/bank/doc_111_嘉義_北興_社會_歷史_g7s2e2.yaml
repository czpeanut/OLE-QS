- id: doc_111_嘉義_北興_社會_歷史_g7s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '下表為日治時期台灣學齡兒童就學率簡表，由表列的數字我們對於日治時期總督府的政策，哪一項解讀是正確的？


    | 西元年 | 臺灣人 | 在臺日人 |

    | :--- | :--- | :--- |

    | 1917 | 13.1% | 95.1% |

    | 1920 | 25.1% | 98.0% |

    | 1925 | 29.5% | 98.3% |

    | 1930 | 33.1% | 98.8% |

    | 1935 | 41.5% | 99.3% |

    | 1940 | 57.6% | 99.5% |

    | 1945 | 71.3% | 99.6% |


    ※日治時期台灣學齡兒童就學率簡表'
  options:
  - label: A
    content: 對台灣進行最早的人口普查，台人學童就學率快速提升
  - label: B
    content: 內地延長主義使日台合一，台人日人公平對待
  - label: C
    content: 對台灣進行最早的義務教育，有助台灣學齡兒童就學率
  - label: D
    content: 日治前期盛行武裝抗日，台灣學齡兒童不願入學。
