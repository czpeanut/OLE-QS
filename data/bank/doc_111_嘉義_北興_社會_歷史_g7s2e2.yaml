  stem: 對宗教藝術文化最熱血的子悅，直奔九華山地藏庵以及嘉邑城隍廟感受傳統廟宇和現代藝術的交融，特別是在城隍廟裡發現日本和歌對聯的交趾陶作品，感到不可思議，廟祝熱心地告訴他，當初日本官府差點拆了城隍廟，還好地方商紳努力奔走，才得以保存下來，這件日文交趾陶作品成為最好的歷史見證。請問日方打算拆除城隍廟的原因是？
