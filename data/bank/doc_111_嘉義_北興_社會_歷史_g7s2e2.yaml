  - label: D
    content: 戰後經濟蕭條，社會問題嚴重。
  group_stem: '（三）每年2 月28 日是台灣官方確定的「228和平紀念日」，紀念1947 年2 月28 日台灣發生的政治暴力事件，以及之後數十年「白色恐怖」下威權統治的受害者及家庭。

    根據台媒報導，台灣前任威權統治者蔣介石後人，現任台北市長蔣萬安今日（2 月28 日）在出席市政府舉辦的「台北市二二八事件76 週年紀念系列活動」時，突然有數名民眾衝上致詞台，並高喊「殺人兇手、兇手下跪道歉」，導致活動短暫中斷。

    在保安人員介入後，蔣萬安繼續致詞並表示，身為台北市長，為76 年前自台北市爆發並引爆全台的「二二八事件」致上誠摯歉意。

    身貼蔣家後代標籤的蔣萬安，在從政路上，開始面對個人家庭的功過爭議。228 事件及後來長達數十年的白色恐怖歷史，正在考驗蔣萬安作為民選市長的政治智慧。他面對的命題還包括台灣政府如何明確推動轉型正義，台灣社會如何對話及和解。(資料來源:2023/2/28
    BBC NEWS )'
