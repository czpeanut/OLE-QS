  group_stem: '（五）中選會拍板！2024 總統立委選舉日期出爐

    中央選舉委員會通過第16 任總統、副總統與第11 屆立法委員的選舉時程，備受國內外矚目的總統選舉，將在今年9 月12 日起受理正副總統選舉返國行使選舉權選舉人登記，12
    月15 日公告總統、副總統候選人名單，明年1 月13 日舉行投票，立法委員選舉也將在同日辦理投票。

    (資料來源:中央社2023/3/10 新聞報導)

    ※選舉制度可當作國家民主化的重要指標，四年一度的總統大選即將來臨，屆時嘉義市的中央噴水必定成為兵家必爭之地以及全國媒體聚焦所在…..請以台灣選舉制度以及民主發展歷程回答下列問題：'
