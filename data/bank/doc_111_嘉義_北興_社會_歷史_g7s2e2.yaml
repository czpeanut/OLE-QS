  group_stem: '（四）2021 台灣設計展在嘉義市

    「家意 ‧ 以城為家 City as Home」，一座城市，三種家的概念，13 處家的所在，18 種家的表現，全城帶你回家。

    邁入第19 年的台灣設計展，已成為城市美學的展現，而2021 台灣設計展在嘉義，並以「家意．以城為家City as Home 」為主題，盼藉此重塑嘉義市「家」的意象。此次展覽集結9
    位策展顧問、超過20 組策展團隊，其中更有12 人為嘉義出身，或是因熱愛嘉義而移居於此，要以在地的眼光來打造今年的台灣設計展。'
