questions:
- id: doc_113_新北_忠孝_社會_歷史_g8s2e1_s1_28
  section: 1
  number: 28
  type: single
  page: 1
  stem: 西元1919 年巴黎和會期間，北京爆發大規模的學生示威遊行。造成此次學生運動的主因為何？
  options:
  - label: A
    content: 中國與列強訂定條約，被迫租借港灣
  - label: B
    content: 戰爭失利，中國須賠償各國龐大費用
  - label: C
    content: 和會贊成袁世凱稱帝，恢復君主專制
  - label: D
    content: 和會同意日本繼承德國在中國特權。
- id: doc_113_新北_忠孝_社會_歷史_g8s2e1_s1_29
  section: 1
  number: 29
  type: single
  page: 1
  stem: 一篇文章中提到：「他是民國初年組建國民黨的實際負責人，因國民黨在首屆國會選舉中獲得絕對多數，當他從上海赴北京準備依法組織責任內閣時，在上海火車站遭槍手暗殺。」文中被暗殺的應該是下列何人？
  options:
  - label: A
    content: 袁世凱
  - label: B
    content: 孫中山
  - label: C
    content: 宋教仁
  - label: D
    content: 段祺瑞
- id: doc_113_新北_忠孝_社會_歷史_g8s2e1_s1_30
  section: 1
  number: 30
  type: single
  page: 1
  stem: 老師用附圖講述中國現代史，就圖片內容判斷，老師講解的主題最可能是下列何者？
  options:
  - label: A
    content: 民國初年的學生愛國運動
  - label: B
    content: 民國初年的贊成帝制遊行
  - label: C
    content: 清朝末年的革命示威運動
  - label: D
    content: 民國初年的軍閥割據亂象。
