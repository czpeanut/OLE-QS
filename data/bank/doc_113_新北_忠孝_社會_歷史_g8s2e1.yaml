- id: doc_113_新北_忠孝_社會_歷史_g8s2e1_s1_31
  section: 1
  number: 31
  type: single
  page: 1
  stem: '「推翻滿清專制政府，鞏固中華民國，謀取民生幸福，是國民整體的意志，我將遵從該意志，忠於國家、為民服務。直到專制政府遭推翻、國內和平，中華民國獨立自主於世界，並受各國承認之時，我將卸下臨時大總統的職位。在此向國民發誓。」（白話意譯）

    請問：以上誓詞與下列何人最為相關？'
  options:
  - label: A
    content: 袁世凱
  - label: B
    content: 孫中山
  - label: C
    content: 宋教仁
  - label: D
    content: 陳獨秀
- id: doc_113_新北_忠孝_社會_歷史_g8s2e1_s1_32
  section: 1
  number: 32
  type: single
  page: 1
  stem: 民國初年的新知識分子推動新文化運動的主要原因，與下列何者最為相關？
  options:
  - label: A
    content: 希望中國能徹底學習西方文化後，擺脫弱國邁向強盛
  - label: B
    content: 希望透過通俗易懂的白話文，推廣中國傳統儒家文化
  - label: C
    content: 認為西方國家強盛的主要原因是在船堅砲利的器物層面
  - label: D
    content: 認為中國不夠強盛的主因是沒有將中西文化融合貫通
- id: doc_113_新北_忠孝_社會_歷史_g8s2e1_s1_33
  section: 1
  number: 33
  type: single
  page: 1
  stem: '「……中國數千年來，習於君主專制體制……人民普遍缺乏參與政治的能力。四年以前，中國由專制一變而為共和，由於變動劇烈，不能期望有良好結果。……中國將來必因總統繼承問題釀成禍亂……甚至破壞中國獨立。……中國推行君主制，較共和制更合適，這點是不需要懷疑的。」

    此篇文章發表後有利於何種政治情勢的出現？'
  options:
  - label: A
    content: 五四運動
  - label: B
    content: 二次革命
  - label: C
    content: 洪憲帝制
  - label: D
    content: 南北分裂
- id: doc_113_新北_忠孝_社會_歷史_g8s2e1_s1_34
  section: 1
  number: 34
  type: single
  page: 1
  stem: '儒家提到的「三綱」指的是「君為臣綱、夫為妻綱、父為子綱」，其意思是君為臣的表率，而人民為君主的附屬品，故無獨立自主的人格；父親為兒子的表率，則兒子是父親的附屬品，故無獨立自主的人格；丈夫為妻子的表率，則妻子為丈夫的附屬品，故無獨立自主的人格。中國人之所以缺乏獨立的人格，都是導因於「三綱」的說法。傳統上提到的盡忠盡孝、守節，皆非讓人擁有獨立人格的道德規範。

    由文章中論述的觀點來加以判斷，與下列何者最為相關？'
  options:
  - label: A
    content: 新文化運動
  - label: B
    content: 南北分裂
  - label: C
    content: 保路運動
  - label: D
    content: 洪憲帝制
- id: doc_113_新北_忠孝_社會_歷史_g8s2e1_s1_35
  section: 1
  number: 35
  type: single
  page: 2
  stem: '下列是兩國代表在一場會議中所發表的言論內容：

    甲國：日軍占領膠州灣及膠濟鐵路後，凡從前德國享有之權利，自是悉為日本占有。

    乙國：膠州灣與膠濟鐵路，以及其他一切權利，應直接交還中國。青島完全為中國領土，當不容有絲毫損失。

    由兩國代表的發言內容來判斷，此會議召開的背景應該為何？'
  options:
  - label: A
    content: 甲午戰爭結束
  - label: B
    content: 辛亥革命成功
  - label: C
    content: 二次革命結束後
  - label: D
    content: 第一次世界大戰結束
- id: doc_113_新北_忠孝_社會_歷史_g8s2e1_s1_36
  section: 1
  number: 36
  type: single
  page: 2
  stem: 中國近代某一文章提到：「政府假借預備立憲的美名卻實行中央集權，假借推行新政卻搜刮民間錢財，對外則割讓土地，並出賣採礦權與鐵路經營權。人民反對政策，可能會被處死；如果人民自己出錢出力興修鐵路，又會被官方沒收政府應該要保護人民，結果人民反而受到政府的傷害，如此不顧人民生命、財產的政府，誰還能忍受呢！」上文的主要訴求最可能直接導致下列何種行動？
  options:
  - label: A
    content: 五四運動
  - label: B
    content: 二次革命
  - label: C
    content: 辛亥革命
  - label: D
    content: 南北分裂
- id: doc_113_新北_忠孝_社會_歷史_g8s2e1_s1_37
  section: 1
  number: 37
  type: single
  page: 2
  stem: '中國古代傳下來的心理，以為⋯⋯「男子治外，女子主內」；婦人稱丈夫為「外子」，丈夫稱妻子為「內助」；這種區別是現代美國婦女所絕對不承認的。他們以為男女同是「人類」，都該做一個自由獨立的「人」，沒有什麼內外的區別的。⋯⋯我們中國的姐妹們，若能把這種「自立」的精神，來補助我們的「倚賴」性質⋯⋯定可使中國女界有一點「新鮮空氣」，定可使中國產出一些真能「自立」的女子。⋯⋯

    由文章中論述的觀點來加以判斷，與下列何者最為相關？'
  options:
  - label: A
    content: 袁世凱
  - label: B
    content: 胡適
  - label: C
    content: 宋教仁
  - label: D
    content: 康有為
- id: doc_113_新北_忠孝_社會_歷史_g8s2e1_s1_38
  section: 1
  number: 38
  type: single
  page: 2
  stem: '某資料提到：袁世凱讓中國人深深記得的是，他在1898 年背叛變法派，辛亥革命中背叛清廷，當了民國總統又背叛民國，追求個人權力，侍奉外國帝國主義。簡單說，他幾乎就是20世紀中國一切道德卑鄙、政治落後的化身。……（但）雖說袁世凱對中國政體的走向很有自己的野心，但他當總統時，不斷在為一個更強大的中央政府而奮鬥，不能算是一個自大狂，不要求人們對他極盡奴顏卑膝之能事。

    上文提到提到很多中國人認為袁世凱「背叛清廷」，指的最可能是：'
  options:
  - label: A
    content: 策劃辛亥革命
  - label: B
    content: 發動二次革命
  - label: C
    content: 逼迫溥儀退位
  - label: D
    content: 響應五四運動
- id: doc_113_新北_忠孝_社會_歷史_g8s2e1_s1_39
  section: 1
  number: 39
  type: single
  page: 2
  stem: 請問：下列哪項最可能是當時人民面臨的處境？
  options:
  - label: A
    content: 保甲嚴密控制生活
  - label: B
    content: 軍人隨意掠取財物
  - label: C
    content: 法院保障人民財產
  - label: D
    content: 承認是壞人就能安全
  group_stem: 文學作家沈從文回憶起民國初年時，自身少年從軍的經歷，他所屬的部隊常用「清鄉」的名義，在不同的村鎮換防。曾經，軍隊到了一個叫做榆樹灣的地方後，司令部馬上就大咧咧的駐紮在天后宮裡。接著，就不停的捉人。捉來後，只要百姓承認是壞人、肯寫保證書並且答應繳出槍支子彈，就能釋放。然而這些鄉下老實人哪有什麼罪、哪有槍彈。於是照老規矩，換成現金：槍每支折合180
    元，子彈每排1 元5 角。叫親友挑來現金，清點無誤就放人。至於繳不出錢的人，就隨隨便便安排一樁罪名，等到某一天就牽出去砍頭……
