  group_stem: "請在閱讀下列敘述後，回答31-32 題：\n  琳琳今年參加科展比賽，研究主題為臺灣一年的氣候與四季主要的天氣現象。她由中央氣象署收集了一整年的地面天氣圖，整理、分析之後，發現臺灣冬季主要受到蒙古大陸冷氣團影響，夏季則受到太平洋暖氣團影響，甚至會出現寒流、梅雨和颱風等災害天氣，大致可用以下四張天氣簡圖呈現。"
