  section: 1
  number: 20
  type: single
  page: 2
  stem: 小華有一個磁浮玩具，其原理是利用電磁鐵產生磁性，讓具有磁性的玩偶穩定地飄浮起來，其構造如右圖所示。若圖中之電源的電壓固定，可變電阻為一可以隨意改變電阻大小之裝置，則下列敘述何者最適當？(2-3)
