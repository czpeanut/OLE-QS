  section: 1
  number: 31
  type: single
  page: 3
  stem: '下圖是已創校百年的臺南市立安順國小的學校沿革。該校曾舉辦踏溯臺江建庄二百年文化路徑，並重回到當年稱為「安順公學校」的舊校址上課。關於安順公學校改稱為「安順國民學校」，究其原因最可能與下列何者有關？

    【學校沿革】

    1. 1916 年設立「安順公學校」。

    2. 1941 年改稱為「安順國民學校」。

    3. 1946 年改稱為「臺南市安南區第一國民學校」。

    4. 1947 年又改稱為「臺南市安南區安順國民學校」。

    今日則稱為「臺南市安南區安順國民小學」。'
  options:
  - label: A
    content: 為提升臺人民智由臺灣文化協會倡導
  - label: B
    content: 因應臺灣史上第一個漢人政權的建立
