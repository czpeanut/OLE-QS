- id: doc_113_台中_居仁_社會_歷史_g7s2e2_s2_39
  section: 2
  number: 39
  type: single
  page: 4
  stem: 蔡孝乾曾參加「某個社會組織」，在思想上也逐漸產生左傾，依照上文判斷，這個組織最可能是下列何者？
  options:
  - label: A
    content: 臺灣民眾黨
  - label: B
    content: 臺灣文化協會
  - label: C
    content: 臺灣議會設置請願運動
  - label: D
    content: 臺灣地方自治聯盟
  group_stem: "(二) 閱讀下列文字，回答問題:\n       蔡孝乾出生於今彰化縣花壇鄉，1918 年他於彰化公學校畢業，並於彰化第二公學校（今南郭國小）任教，後來又轉往姜崙公學校任教（今明正國小）。1921\
    \ 年，他參加「某個社會組織」，此組織設置讀報社、舉辦文化演講與夏季學校等宣傳活動。此時他接受許多國外思想而產生左傾，於是他又進入上海大學社會學系就讀，此時深受社會主義薰陶，並被中國共產黨吸收成為黨員，返臺後他與王敏川等人合作將上述組織左傾，並使之成為臺灣共產黨的外圍組織，並積極宣揚共產主義。\n\
    \    戰後初期，臺灣發生一起嚴重的軍民衝突事件，此事件後，大量知識分子左傾，蔡孝乾滲透回臺發展共產勢力；不過在當時極力防衛共產勢力的時代，政府經常不依法律程序逮捕異議分子。1950\
    \ 年他被中華民國國防部保密局逮捕入獄，隨後於獄中「自首」，並供出共產組織人員，導致中國共產黨在臺工作組織曝光。蔡孝乾之後加入中國國民黨，任中華民國國防部保密局調查委員會委員，後升任國防部情報局暨情報研究室少將副主任兼中華民國司法行政調查局（今法務部調查局）副局長，蔡孝乾長期被嚴加監視，深居簡出，1982\
    \ 年 10 月在臺灣病逝。"
