  group_stem: "◎腎結石不痛就好了？淺談腎結石\n   腎結石是腎臟病中最常見的疾病之一。腎結石經常是沒症狀的，因此也常被人忽略。但是當結石掉落到輸尿管時，會引起劇痛併發嘔吐、噁心、流冷汗的症狀。此種疼痛又被形容是比生孩子還痛的疼痛，發作之前又常無徵兆，故常使人措手不及，而往急診求助。腎結石引起的腰痛除了前述症狀外，疼痛經常由腰痛到下腹，而且漫延到陰部。有時候結石卡在輸尿管進入膀胱處，則病人經常會有解尿困難，頻尿等類似泌尿道感染的情形出現。尿液檢查時，經常會發現異常的紅血球。但是血尿與腰痛一樣，不一定與腎結石成必然的關係。\n\
    \   雖然疼痛會使人急速前往就醫，但是往往不痛了，卻容易使病人誤以為結石好了而延誤就醫。在門診中，許多因結石阻塞致使腎臟完全損壞，甚至最後變成尿毒症者，常是因為誤以為腎結石不痛就好了所致。加上國人喜歡吃\"\
    化石草\"治療結石，往往不痛了就以為是化石草有效，把石頭化掉了。因此使得更多的悲劇一再發生。事實上結石阻塞住輸尿管初期，可能使輸尿管肌肉強烈收縮而引起劇烈疼痛。但隨著阻塞的延長，輸尿管因積水而擴張，疼痛即會逐漸的緩解。因此如證實有腎結石發生，切記一定要定期複檢及治療，確保沒有結石併發症發生，一直到結石消失為止。\n\
    \   腎結石中，約有75%的腎結石為草酸鈣組成的；約有10～20%為磷酸性結石，此類結石主要是因為細菌感染所引起的結石；有5%為純粹尿酸性結石，為尿酸太高所致；剩餘約5%為其他類的結石。\n\
    \   如何預防結石的再發，最重要在於少吃鹽及多喝水，每天至少有七次排尿，蛋白質攝取適量。可做24 小時集尿分析檢查以進一步做預防性治療。記得千萬不要有諱疾忌醫的心理，一有腎結石發生，即應就醫治療或定期追蹤直到石頭完全消失為止。\
    \ 【摘錄自綠十字健康網】"
