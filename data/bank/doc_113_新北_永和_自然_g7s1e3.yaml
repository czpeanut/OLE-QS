- id: doc_113_新北_永和_自然_g7s1e3_s2_49
  section: 2
  number: 49
  type: single
  page: 4
  stem: 根據上文，下列關於一氧化碳的敘述，何者錯誤？
  options:
  - label: A
    content: 一氧化碳無色無味，所以吸入時通常無法察覺
  - label: B
    content: 一氧化碳可阻止血紅素將所攜帶的氧氣釋放給組織利用，造成組織缺氧
  - label: C
    content: 一般空氣呼吸時，排除患者體內所有的一氧化碳所需的時間約為5 小時
  - label: D
    content: 一氧化碳中毒的症狀包括噁心、嘔吐、視力改變、意識混亂甚至死亡
  group_stem: "◎   高壓氧治療於一氧化碳中毒之運用 \n \n一氧化碳(CO)是最常見引起中毒傷害或死亡的氣體；因為一氧化碳無色無味及無刺激性，故常讓人無法察覺已經暴露其中而吸入大量氣體。一氧化碳在體內會造成多重的毒性作用，因為(1)一氧化碳和血紅素的結合力是氧氣的\
    \ 200-250 倍。(2)一氧化碳可阻止血紅素將所攜帶的氧氣釋放給組織利用，造成另一層次的組織缺氧。(3)一氧化碳也會嚴重阻斷細胞的能量製造機制，造成身體重要器官組織嚴重能量缺乏而受損。引起身體組織細胞缺氧，尤以腦部和心肌最易受影響，而造成心跳、血壓、呼吸及神智的變化。\
    \ \n       一氧化碳中毒的嚴重性決定三個因素(1)暴露環境中一氧化碳濃度；(2)暴露期間活動程度；(3)暴露時間的長短。暴露時間越長，一氧化碳中毒也越嚴重。而且一氧化碳中毒的神經後遺症與暴露時間有關。一氧化碳中毒的症狀有：頭痛、頭暈、噁心、嘔吐、心跳和呼吸急促、胸痛及腹痛，\
    \ 較嚴重者常有身體虛弱、視力改變、意識混亂、抽筋甚至昏迷或死亡。 \n高壓氧治療作用: \n       臨床上高壓氧治療對此類病人有極大助益，體內一氧化碳的排除與病患所呼吸的氧氣狀態有密切關係。\
    \ 一般空氣呼吸時，排除體內一半的一氧化碳所需的時間約為 5 小時；純氧氣呼吸則可縮短時間至約 80-90 分鐘。 若給予高壓氧治療，則可更加速一氧化碳之排除，將時間縮短至\
    \ 20 分鐘，高壓使血液中的溶氧量增加，而增加組織細胞的氧分壓，可加速急性症狀緩解。但約有 10%~20%病人在1 個月內後會產生”延遲性神經精神症後群”，症狀不一由頭痛、噁心、躁動、性格改變、巴金森氏症候群、大小便失禁、退化癡呆症與精神病均有，故需告知患者返家後若有上述情形，需到神經內科門診追蹤檢查，或聯絡有高壓氧治療的醫院以進行評估及治療。\
    \ \n高壓氧治療方式: \n      急診一氧化碳中毒的傳統治療方式，是讓病人利用氧氣面罩吸入100%氧氣，目前高壓氧治療是讓病人在高壓氧艙內，加壓到3\
    \ 大氣壓的情形下，吸入100% 純氧治療約90~180 分，以加速一氧化碳排除，避免組織缺氧及血管收縮，以改善腦部血流以減少神經後遺症。能盡早接受高壓氧治療的患者,可降低延遲性神經精神症後群的發生，一氧化碳中毒病人應嚴格禁煙一個月，以避免缺氧組織受損而加重病情。【摘錄自馬偕綜合醫院—高壓氧治療中心】"
