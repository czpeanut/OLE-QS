    \ 較嚴重者常有身體虛弱、視力改變、意識混亂、抽筋甚至昏迷或死亡。 \n高壓氧治療作用: \n       臨床上高壓氧治療對此類病人有極大助益，體內一氧化碳的排除與病患所呼吸的氧氣狀態有密切關係。\
    \ 一般空氣呼吸時，排除體內一半的一氧化碳所需的時間約為 5 小時；純氧氣呼吸則可縮短時間至約 80-90 分鐘。 若給予高壓氧治療，則可更加速一氧化碳之排除，將時間縮短至\
    \ 20 分鐘，高壓使血液中的溶氧量增加，而增加組織細胞的氧分壓，可加速急性症狀緩解。但約有 10%~20%病人在1 個月內後會產生”延遲性神經精神症後群”，症狀不一由頭痛、噁心、躁動、性格改變、巴金森氏症候群、大小便失禁、退化癡呆症與精神病均有，故需告知患者返家後若有上述情形，需到神經內科門診追蹤檢查，或聯絡有高壓氧治療的醫院以進行評估及治療。\
    \ \n高壓氧治療方式: \n      急診一氧化碳中毒的傳統治療方式，是讓病人利用氧氣面罩吸入100%氧氣，目前高壓氧治療是讓病人在高壓氧艙內，加壓到3\
    \ 大氣壓的情形下，吸入100% 純氧治療約90~180 分，以加速一氧化碳排除，避免組織缺氧及血管收縮，以改善腦部血流以減少神經後遺症。能盡早接受高壓氧治療的患者,可降低延遲性神經精神症後群的發生，一氧化碳中毒病人應嚴格禁煙一個月，以避免缺氧組織受損而加重病情。【摘錄自馬偕綜合醫院—高壓氧治療中心】"
