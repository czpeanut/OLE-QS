    \    此政策引起大多數蒙古人抗爭。其中39 歲育有兩子的達古拉表示：「如果我們接受用中文教學，我們的蒙古語真的會消失不見。」一位學者多哥喬則表示：「我們已經失去了政治上的自決權，傳統的生活方式也被都市化消滅得差不多了，我們只剩下蒙古語。」\n\
