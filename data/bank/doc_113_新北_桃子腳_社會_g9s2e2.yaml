- id: doc_113_新北_桃子腳_社會_g9s2e2_s2_49
  section: 2
  number: 49
  type: single
  page: 6
  stem: 關於華盛頓公約的國際社會互動型態，下列敘述何者正確？
  options:
  - label: A
    content: 透過民間力量，進行國際交流
  - label: B
    content: 採取外交談判，解決國際衝突
  - label: C
    content: 基於人道關懷，提供國際援助
  - label: D
    content: 藉由國際合作，解決保育問題
  group_stem: "華盛頓公約(以下簡稱華約)，全名是瀕臨絕種野生動植物國際貿易公約。該公約係於1973 年在美國首府華盛頓所簽署，1975 年7 月1\
    \ 日正式生效。至1995 年2 月底共計有128 個締約國。華約的成立始於國際保育社會有鑑於蓬勃的野生物國際貿易對部分野生動植物族群已造成直接或或間接的威脅，而為能永續使用此項資源，遂由世界最具規模與影響力的國際自然保育聯盟領銜，在1963\
    \ 年公開呼籲各國政府正視此一問題，著手野生物國際貿易管制的工作。歷經十年的光景，終於催生出華約。\n  華約的精神在於管制而非完全禁止野生物的國際貿易，其用物種分級與許可證的方式，以達成野生物市場的永續利用性。華約管制國際貿易的物種，可歸類成三項附錄，附錄一的物種為若再進行國際貿易會導致滅絕的動植物，明白規定禁止其國際性的交易；附錄二的物種則為目前無滅絕危機，管制其國際貿易的物種，若仍面臨貿易壓力，族群量繼續降低，則將其升級入附錄一。附錄三是各國視其國內需要，區域性管制國際貿易的物種。\n\
    \  華約的附錄物種名錄由締約國大會投票決定，締約國大會每二年至二年半召開一次。在大會中只有締約國有權投票，一國一票。"
  tags:
    chapter:
      publisher: 翰林
      book: 九下
