- id: doc_111_桃園_中興_國文_g9s2e1_s2_33
  section: 2
  number: 33
  type: single
  page: 4
  stem: 若將文中各國水價畫成下圖，從此圖表可以得知哪項訊息？
  options:
  - label: A
    content: 在亞洲鄰近國家中，台灣的水價算是最低廉
  - label: B
    content: 台灣的水價遠遠超過歐美各國家
  - label: C
    content: 日本、香港、新加坡水價都高於台灣
  - label: D
    content: 德國、英國以高水價來因應缺水問題
  group_stem: "台灣用水最主要的來源就是雨水，據中央研究院環境變遷研究中心研究，過去40 年，台灣年均雨量改變不大，大約都在2500 毫米上下，降雨時數卻明顯減少，每十年降低百分之3.01%\
    \ ;平均降雨強度每十年也增加3.16%。也就是雨一樣多，但下雨時間短、來得快、下的大，更難把水留下來。\n    因為全球氣候變遷的影響，水荒問題愈來愈嚴重，有鑒於旱季中南部缺水問題日趨嚴重，加上為提升產業用水效率，經濟部內部規劃，擬對用水太浪費的產業附加耗水費。未來，若產業超額用水，除收取每度基本水價外，擬附加一倍價格；以目前每度（立方公尺）水價約11\
    \ 元計算，超額用水量每度22 元。\n     經濟部部長表示，「耗水費」主要是要檢視業者用水量是否超過合理範圍，一般民生用水則不受此規範，並指出台灣旱季時中南部缺水相當嚴重，凸顯政府現行鼓勵節約效能欠佳，而且現在要蓋水庫非常困難；再加上極端氣候嚴重的影響，如果現在沒有好好處理，問題會越來越嚴重。每個行業都有一定合理的用水量，若發現業者有特別浪費、不合理用水量時，就不應該按照現在這麼便宜的水費來徵收。\n\
    \    事實上，歐洲許多國家已實施水費附加費，丹麥附加比例為水價的一倍；大陸的北京市、天津市因水資源匱乏，附加費用最高是水價的15 倍，又依超量級距，收取不同價格。自來水公司主管表示，台灣水價已20\
    \ 年未動，每度水價平均成本近11 元，但售價不及成本，每賣一度就虧四角。\n    台灣的年平均雨量多達2500 毫米，是世界平均值的2.6 倍，但因台灣地文條件很特別，陡峭地形使得河水湍急，快速奔流入海，停留在陸地的時間很短，實際上可利用的水資源只佔總雨量兩成；再加上人口密度高，每人每年可分得的雨量，僅為世界平均值的1/7~1/5，成為名列全球第18\
    \ 位缺水國家。\n台灣地區水資源非常有限，可是台灣的自來水水價不但不昂貴，而且非常低廉。\n\n| 國家 | 德國 | 英國 | 日本 | 芬蘭 | 新加坡\
    \ | 美國 | 香港 | 台灣 | 韓國 |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :---\
    \ | :--- | :--- |\n| 平均單位水價(新台幣/m³) | 98.85 | 77.83 | 49.1 │ 115.4 | 41.77 | 33.8\
    \ │ 45.1 | 24.33 | 17 │ 36 | 10.84 | 8.7 |\n\n台灣地區之平均單位水價為10.84 元/m³ ，從研究統計資料（上表）可見台灣水價之便宜。\n\
    學水利工程出身的成功大學校長黃煌煇也曾表示，台灣水不夠用的原因是水價太便宜，而百姓不知節約用水，更是根本問題。台灣每戶每年平均水費約2891 元，每戶水費占所得0.2%\
    \ ，即可滿足基本民生需求。再看看工業用水大戶，以台南科學園區為例， 2018 年統計資料：用水量是41872113 度，水費455149868 元。2018\
    \ 年園區生產總額5475 億元，園區用水費僅佔生產總值0.083%！他更表示政府應以價制量，提升節水觀念「不要水少求媽祖，水多無人管」，這樣民眾才不會隨意浪費，避免台灣缺水問題一再發生。\n\
    \    台灣除了水環境的先天不良，用水量成長也讓水源更加吃緊，如何做好水資源的管理與維護，已成台灣刻不容緩的議題。\n                --\
    \ 改寫自The News Lens 關鍵評論網台灣水費超便宜"
