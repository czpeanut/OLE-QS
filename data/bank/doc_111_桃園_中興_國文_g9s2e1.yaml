  type: single
  page: 3
  stem: 下列「之」字皆為代詞，請根據內容判斷，何者指的是盜鴨賊？
  options:
  - label: A
    content: 盜鄰鴨烹「之」
  - label: B
    content: 茸生鴨毛，觸「之」則痛
  - label: C
    content: 夜夢一人告「之」
  - label: D
    content: 罵「之」亦可警將來
  group_stem: "邑西白家莊居民某，盜鄰鴨烹之。至夜，覺膚癢。天明視之，茸生①鴨毛，觸之則痛。大懼，無術可醫。夜夢一人告之曰：「汝病乃天罰。須得失者罵，毛乃可落。」而鄰翁素雅量，生平失物，未嘗徵②於聲色。某詭③告翁曰：「鴨乃某甲所盜。彼深畏罵焉，罵之亦可警將來。」翁笑曰：「誰有閒氣罵惡人。」卒不罵。某益窘，因實告鄰翁。翁乃罵，其病良已④\n\
    \                                                                          ─蒲松齡《聊齋志異·罵鴨》\n\
    【注釋】① 茸生：細毛柔密叢生   ② 徵：顯現  ③ 詭：欺詐  ④ 已：痊癒"
