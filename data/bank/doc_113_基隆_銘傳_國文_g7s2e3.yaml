  page: 4
  stem: 清代紀昀評蘇軾〈和子由澠池懷舊〉：「前三句尚是常語，第四句『鴻飛那復計東西』一轉，方見東坡本色。」若從宋代「以文為詩」（「語言平實，思想深刻，情感真實」）的革新角度，此「本色」最可能指什麼？
  options:
  - label: A
    content: 以散文章法入詩，打破傳統起承轉合，如「人生到處知何似」的散文式發問，直指哲思核心。
  - label: B
    content: 刻意營造時空錯置的幻境，如「鴻飛那復計東西」打破線性邏輯，近於李白〈靜夜思〉的朦朧詩境
  - label: C
    content: 將人生哲思凝練於日常意象，透過「雪泥鴻爪」的比喻，在尋常景物中提煉出生命無常的哲理。
  - label: D
    content: 以「不計東西」的消極態度，呼應孔子「己立立人」的處世哲學，體現儒家仁民愛物的思想。
