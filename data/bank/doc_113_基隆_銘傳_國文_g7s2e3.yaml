  - label: C
    content: 「出師未捷身先死，長使英雄淚滿襟」（杜甫〈蜀相〉）——對歷史悲劇的慨嘆
  - label: D
    content: 「昔人已乘黃鶴去，此地空餘黃鶴樓」（崔顥〈黃鶴樓〉）——物是人非的蒼茫感
  group_stem: '※請閱讀以下甲、乙二首詩，並回答 36、37、38 題：

