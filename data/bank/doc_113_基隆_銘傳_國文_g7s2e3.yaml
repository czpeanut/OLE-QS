  stem: 文章中愛因斯坦與普林斯頓主任商量報酬的例子，主要想說明什麼？
  options:
  - label: A
    content: 外國學者的薪資待遇遠高於傳統文人。
  - label: B
    content: 愛因斯坦與介之推同樣具有謙遜不居功的精神。
  - label: C
    content: 大學畢業生的起薪應根據能力而非學歷。
  - label: D
    content: 學術領域中，科學家比文學家更值得高額報酬。
  group_stem: '※請閱讀以下文章，並回答 31、32、33 題：


    　　介之推不言祿，祿亦弗及。這是歷史上的一個最完美的人格所構成的一個最完美的故事。介之推為什麼不言祿，因為他覺得貪天之功以為己力，是君子所不屑為，也是君子所不應為的。

    　　愛因斯坦剛到普林斯頓時，主任與他商量報酬問題，他說五千。主任說：「給你五千，如何給一個大學畢業生呢？還是算一萬五千元罷！」這不是外國的介之推嗎？

    　　為什麼介之推與愛因斯坦專幹這類傻事？立過大功，而不居功若此。他們知道作事與立功，得之於眾人合作者多，得之於自己逞能者少。於是就很自然的產生一種感謝眾人、感謝上天的感覺。

    　　我們回頭想一想，五六十年來的中華比我七八歲時的思想能強幾何！史家如果寫這五六十年來的我國歷史時，一定命名為狂妄而幼稚，無法與無天的時代。

    　　無論哪一行、哪一界，多是自吹自擂，自欺自騙。日子長了，連自己也信以為真了，而大禍至矣。因為沒有做任何真正的事，沒有建任何真正的功，自然而然不會有謝天的感覺。哲學家們知道這個症候最為可怕，所以造出許多知好知歹的人物與故事來。

    　　有一個人問一位文學家，我記得是雨果罷，「如果世界上的書全需要燒掉，而只許留一本，應留什麼？」雨果毫不猶豫的說：「只留〈約伯記〉。」約伯是《聖經》裏面的介之推，富亦謝天，貧亦謝天，病亦謝天，苦亦謝天。

    　　我們的思想界尚在混沌幼稚時期，需要約伯的精神，需要介之推的覺悟。這個覺悟即是：一粥一飯，半絲半縷，都是多少年、多少人的血汗結晶。感謝之情，無由表達，還是謝天罷。　　（摘錄自陳之藩《在春風裡·謝天》）'
