  stem: 比較兩詩結句：「無方馳馬但鳴嘶」（蘇轍〈懷澠池寄子瞻兄〉）與「路長人困蹇驢嘶」（蘇軾〈和子由澠池懷舊〉），關於「馬/驢」意象的運用，下列分析何者正確？
  options:
  - label: A
    content: 蘇轍以「馳馬」呼應自身政治失意、懷才不遇；蘇軾「蹇驢」則自嘲詩才有限、江郎才盡。
  - label: B
    content: 蘇轍的「馬鳴」象徵對功名的企求，蘇軾的「驢嘶」則批判宋代官場文化及科舉制度對士人的壓迫。
  - label: C
    content: 兩者皆以動物嘶鳴暗示行旅艱難，但蘇轍的「無方」凸顯迷茫，蘇軾的「記否」將困頓轉化為兄弟共同記憶。
  - label: D
    content: 「馳馬」屬貴族坐騎，反映蘇轍對仕宦身分的留戀；「蹇驢」為平民交通工具，體現蘇軾的庶民情懷。
