    相攜話別鄭原上，共道長途怕雪泥。歸騎還尋大梁陌，行人已度古崤西①。曾為縣吏民知否？舊宿僧房壁共題②。遙想獨遊佳味少，無方馳馬但鳴嘶。　　（蘇轍〈懷澠池寄子瞻兄〉）

