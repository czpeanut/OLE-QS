  stem: 上文中劉凝之和沈麟士對於「被誤認鞋子」的處理方式，最大的不同在於？
  options:
  - label: A
    content: 劉凝之要求賠償，沈麟士直接贈送鞋子。
  - label: B
    content: 劉凝之堅持不收回鞋子，沈麟士則笑而接受歸還。
  - label: C
    content: 劉凝之控告鄰人，沈麟士選擇原諒對方。
  - label: D
    content: 劉凝之主動詢問確認，沈麟士拒絕與人溝通。
  group_stem: '※請閱讀以下文章，並回答 39、40 題：

    　　劉凝之為人認所著履①，即與②之，此人後得所失履，送還，不肯復取。又沈麟士亦為鄰人認所著履，麟士笑曰：「是卿履耶？」即與之。鄰人得所失履，送還，麟士曰：「非卿履耶？」笑而受之。此雖小事，然處事當如麟士，不當如凝之也。　　（蘇軾《東坡志林·劉凝之、沈麟士》）

    ※註解—①履：鞋子。②與：給。'
