  group_stem: '◎題組二：閱讀以下短文，回答32-34 題。

    國內上市公司美德醫集團董事長楊克誠是新南向的先驅。西元1990 年代在臺商爭相西進時，他眼光獨具，選擇到菲律賓設廠，之後又成功在柬埔寨翻轉總理洪森（Hun
    Sen）的故鄉，他接受洪森的邀請，模仿中國深圳的模式，打造柬埔寨最大的經濟特區。曼哈頓經濟特區位於柬埔寨臨接越南邊界的柴楨省境內，佔地400 公頃，36000
    名員工，每月出口超3000 個貨櫃，佔比柬埔寨國家總出口額的6%，至2016 年止，全區出口總額約五億美元，是所有工業區出口額榜首。楊克誠表示，想把當地打造成臺商進入東盟的共同平臺，未來也歡迎中國的產業，變成雙方友好、共同合作的經濟特區，而不是搏鬥和政治對立，希望是一個和諧的關係。'
