    | :--- | :--- |

    | 小八 | 面試時對於自己曾經參與公民投票的經驗侃侃而談，給人十分健談的感覺 |

    | 烏啦 | 過去曾在網路上觸犯公然侮辱罪而遭到檢察官起訴，但其實工作能力很強 |

    | 吉伊 | 今年在父母的同意之下買了新型的手機，故面談時表示想早點開始工作，以還清債務 |

    | 小桃 | 因為之前曾在加油站合法上大夜班，習慣晚睡，面談時給人的感覺較沉默木訥 |'
  options:
  - label: A
    content: 依照勞動基準法，小八不可上大夜班
  - label: B
