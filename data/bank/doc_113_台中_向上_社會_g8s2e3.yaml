  stem: 柬埔寨總理洪森模仿中國深圳模式，其打造的曼哈頓經濟特區有何特色？
  options:
  - label: A
    content: 採用土法煉鋼，提高鋼鐵產量
  - label: B
    content: 增加國營企業，確保政府收入
