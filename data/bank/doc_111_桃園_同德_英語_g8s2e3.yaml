  group_stem: 'Do you hear of Taiwan? It is home of one of the world’s tallest buildings,
    the Taipei 101. Opened in 2004, the building has 101 floors and five underground
    levels. Earthquakes are dangerous for tall buildings. In fact, Taiwan had a serious
    earthquake in 1999. On September 21, 1999, an earthquake in Taiwan killed more
    than 2,400 people, destroyed thousands of buildings and left 100,000 people homeless.
    It was the worst earthquake to hit Taiwan though quakes are common here.

    At 1:47 a.m. on September 21, 1999, the island of Taiwan, located off the southeastern
    coast of mainland China, was shaking. Its epicenter was located in Nantou County
    in central Taiwan, but serious damage occurred across the island. More than 2,400
    people died, more than 11,000 others were hurt and thousands of buildings were
    destroyed. Roads blocked and bridges collapsed. Overall, it caused billions of
    dollars in economic losses. In 2001, the 921 Earthquake Museum of Taiwan opened
    in the city of Taichung. The building is to memorize this terrible disaster in
    Taiwan.

