  stem: 49. According to the reading, which is TRUE about “ 921 Earthquake” ?
  options:
  - label: A
    content: 921 Earthquake Museum is in Nantou City.
  - label: B
    content: 921 Earthquake’s epicenter was in central Taiwan.
