  section: 5
  number: 45
  type: single
  page: 6
  stem: 45. Before you decide to bring stray dogs home, what SHOULDN’T you do?
  options:
  - label: A
    content: To make sure they are healthy.
  - label: B
    content: To make sure they are friendly.
  - label: C
    content: To make sure they have no family.
  - label: D
    content: To make sure they wouldn’t break your heart.
  group_stem: 'Take a Stray Pet Home ?

    Dogs are cute. Do you like dogs, the hairy animals with bright eyes? Did you see
    stray dogs in the park or on the corner of streets? They looked poor, helpless
    and cute. To take them home or leave them there must be a difficult decision.
    However, before you make up your mind to take them home, think about something:

    First, is it healthy? Some animals carry diseases, especially on their skins.
    Please take them to a doctor before bringing them home.

    Second, is it friendly? Some of them could be afraid of people or aggressive.
    That means they might bite you or hurt other people.

    Third, is it really homeless？ Some people would take animals home mistakenly,
    and it would make the owners very worried.

    And finally, are you ready to keep it and love it forever? The last but not the
    least thing you want to do is not to break its heart again.


    stray 流浪 disease 疾病'
