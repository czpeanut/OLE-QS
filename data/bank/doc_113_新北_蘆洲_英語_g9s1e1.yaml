  group_stem: "Have you ever lain on your bed and felt as if nothing in the world\
    \ was going right for you? When that happens, \nit's time to do something to feel\
    \ better. Running, one of the most popular and cheapest kinds of exercise can\
    \ help \npeople of all ages feel better about themselves at school or at work.\
    \ But how much running would do one good? A \nstudy says that running for 15-30\
    \ minutes twice a week is a good starting point. In other words, one should run\
    \ eight \nkilometers a week. \n    If you find it hard to take the first step,\
    \ look at yourself in the mirror. Now that you are worrying you are \nbecoming\
    \ heavier and afraid you may get sick from heavy work and no exercise, then it’s\
    \ time to make up your mind \nand do something. \n    Running is good for you.\
    \ It can keep you from being tired. Here is the science fact in its simplest form:\
    \ exercise \nlets out things like endorphins that make your body feel good. What's\
    \ more, running doesn't cost much. So just put on \nyour running shoes and go\
    \ out for a run. It doesn't matter if you jog or walk or do the two together.\
    \ If you want to \nprepare for a race, then run for more than 8-9 kilometers each\
    \ week; if not, keep running twice a week and take it \neasy while running, as\
    \ many doctors tell us."
  ai_answers:
    gemini: C
    qwen: C
  answer:
