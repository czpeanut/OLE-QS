- id: doc_113_新北_蘆洲_英語_g9s1e1_s6_48
  section: 6
  number: 48
  type: single
  page: 5
  stem: From the reading, what does the word “considerate ” mean ?
  options:
  - label: A
    content: Saving a lot of money.
  - label: B
    content: Being good at sports.
  - label: C
    content: Doing everything by yourself.
  - label: D
    content: Being careful not to harm others.
  group_stem: "We meet all kinds of people in our daily life. Some are really kind\
    \ and considerate, and we can become friends with \nthem soon. Others are mean\
    \ and impolite, so we don’t enjoy being around them. Although we might not like\
    \ those people, \nwe still have to deal with them. That means we must learn how\
    \ to get along with(與…相處) them, no matter(無論) who \nthey are. It’s not an easy\
    \ task(任務). In fact, it takes much time and energy. However, if we want happy\
    \ lives, we must \ndevelop(發展) this important skill . Here are some tips for getting\
    \ along.\n●Understand Each Other  When someone talks to you, don’t just listen.\
    \ Try to show interest in their opinions. More \nimportantly, try to understand\
    \ their thoughts.\n●Talk about Everything Wisely  If you agree with them, say\
    \ something good. If you don’t agree with their ideas, try \nnot to say bad or\
    \ angry words. Also, discuss in a calm(冷靜的) way. That way, you don’t make a meaningless\
    \ fight.\n●Keeping Quiet Means a Lot  If you have nothing nice to say, just keep\
    \ quiet. Remember, we are all different, but that \ndoesn’t mean we can’t get\
    \ along with each other. Sometimes not saying anything is better than saying too\
    \ much.\nHaving friends plays an important role in our lives, but that doesn’t\
    \ mean we have to hide our real thoughts. Besides, \nif we want others to understand\
    \ us, then we need to understand others first. Remember to give thanks or say\
    \ good words to \nothers. Even if you disagree with them, being silent(沉默) helps\
    \ a lot."
  ai_answers:
    gemini: D
    qwen: D
  answer:
  - D
  answer_status: ai_generated
  answer_source: ai:gemini+qwen
