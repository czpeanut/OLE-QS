- id: doc_113_高雄_龍華_英語_g9s1e1_s2_30
  section: 2
  number: 30
  type: single
  page: 4
  stem: 30. What is the reading mainly about?      mainly 主要地
  options:
  - label: A
    content: The most interesting place on Earth.
  - label: B
    content: Many special animals in the deep sea.
  - label: C
    content: One of the strangest animals in the sea.
  - label: D
    content: Different kinds of food for fish.
  group_stem: 'The sea is one of the most interesting places on Earth. It is home
    to many strange animals, and one of the strangest is the anglerfish. These animals
    usually live at the bottom of the sea, and they’re very ugly. They have very big
    heads, very big mouths and very sharp teeth. Many people are surprised at their
    way of catching food.

    The anglerfish can use parts of their bodies to make a light. Because animals
    in the deep sea usually spend all their time in the dark, they are curious about
    these lights. They often move closer to the lights to get a better look at them,
    but when they get too close, the anglerfish attack them.

    Sometimes, anglerfish eat their food in one bite, but that’s not always possible
    with bigger animals. That doesn’t mean they stay away from big animals. These
    fish aren’t scared of anything, and they will even attack something twice as big
    as them. Because they are able to change the shape of their bodies, they are able
    to eat very big fish. The anglerfish really is an amazing animal!


     bottom 底部   curious 好奇的   attack 攻擊   amazing 令人驚奇的'
