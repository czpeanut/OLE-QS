  group_stem: 'People    36   . Some go jogging or join a dance class. Others ride
    bicycles or play a team sport. However, one of the best ways to exercise is also
    the simplest: walking. Studies show that walking helps to lose weight, makes the
    heart stronger, and makes you less likely to become sick. It is also easy to do
    because most of us already do it every day.

    The best thing about walking is that it burns fat without making your body work
    too hard. Running or playing sports also burns fat, but you    37   . For example,
    running and jumping sports can cause trouble for your legs.

    Another good thing about walking is that it makes your heart stronger. With a
    strong heart, you are less likely to have heart problems. One study shows that
    walking for thirty minutes a day can make you 30% less likely to have heart problems.

    Any amount of walking is good for your health. However, the best is to walk for
    thirty minutes a day, every day. You should    38   . If it feels too easy, walk
    faster; if you get out of breath, slow down.

    The important point is that you don’t have to join a gym or spend money to be
    healthy. Any exercise is good for you, and walking is the easiest way. Why not
    make it a bigger part of your life?


