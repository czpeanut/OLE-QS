  - label: C
    content: He was sitting under the tree.
  - label: D
    content: He was writing a book.
  group_stem: 'Isaac Newton is one of the world’s most famous scientists. He was born
    in Britain in 1642, and he died in 1726. He did many different things during his
    life. He studied science, math, and history. He taught math at a university, he
    helped other scientists with their work, and he even helped make Britain’s money.
    However, most people know about him because of the following story.

    One day, Isaac Newton was visiting his mother and was walking around in her garden.
    He sat down under an apple tree and started thinking. Newton was always thinking
    about something. So, he was sitting and thinking when an apple fell out of the
    tree and hit him on the head. Then Newton started thinking about why things fall
    down. He wrote that giant things like the Earth and the Moon pull other things
    near them, and he called this “gravity.” Gravity makes apples fall from trees.
    It also keeps people on the ground and stops the Moon from flying off into space.
    This sounds like a very simple idea now, but when Newton wrote about it in 1687,
    it changed the world.


     scientist 科學家   university 大學   gravity 重力   space 太空'
