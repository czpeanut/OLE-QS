- id: doc_113_新北_土城_數學_g9s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 若圓 $O$ 半徑為 5，且 $\overline{OA} = 5$，$\overline{OB} = 7$，$\overline{AC} = 11$，$\overline{AD}
    = 9$，則 $A$、$B$、$C$、$D$ 四點中，必定在圓 $O$ 外部的有幾個？
  options:
  - label: A
    content: '1'
  - label: B
    content: '2'
  - label: C
    content: '3'
  - label: D
    content: 無法確定。
  answer:
  - '陳寶家附近有一家新開的飲料店,開幕活動期間,

    一杯珍珠奶茶特價 40 元。已知杯子為圓

    柱狀,底面直徑長 8 公分,杯子的高度

    15 公分,如圖所示。若吸管一端抵到底

    面斜放,另一端靠在杯緣,吸管會超出

    杯子外 5 公分,試回答下列問題:(吸管

    的體積不計)

    (1)吸管的總長度為多少公分?

    (2)若陳寶將滿滿一杯的飲料喝掉一些後,飲料

    液面下降 3 公分,則液面下的吸管長度還剩多少公

    分?

    (3)因今日生意太好,導致賣到最後一杯時奶茶

    不夠,全部裝入杯子後,還差 3 公分才會裝滿。老

    闆說這杯賣 30 元就好,如果你是客人,你覺得有

    比較便宜嗎?試說明理由。'
  tags:
    chapter:
      publisher: 翰林
      book: 九上
