  answer:
  - '如圖,圓弧上有四個點 A、B、P、Q。試回答下列

    問題:

    (1) 請利用尺規作圖找出圓心O,並將圓O補

    滿。(須保留完整尺規作圖痕跡才給分)

    (2)若∠PAQ=100°,則∠PBQ 為多少度?

    (須使用黑色原子筆作答才給分)

    A

    B

    Q

    P'
