  stem: 清末某位知識分子提出下述主張：「本世紀女權的問題，關鍵在於政治參與。我認為女子能成為議員，也期望中國在海陸軍、財政部門、外交部門有女性任職，更希望女子能被選舉為總統。我們必須以塑造尊重男女平權的新國民為起點，並追求組織新政權為終極目標。」根據上文，此人認為應採取下列何種作法，最可能創造理想中的女性政治參與環境？【113教育會考】
