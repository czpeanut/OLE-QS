    content: 恩心：花開不並百花叢，獨立疏籬趣未窮。寧可枝頭抱香死，何曾吹墮北風中--菊
  - label: D
    content: 姿妘：曲沼芙蓉映竹嘉，綠紅相倚擁雲霞。生來不得東風力，終作薰風第一花--桃花
