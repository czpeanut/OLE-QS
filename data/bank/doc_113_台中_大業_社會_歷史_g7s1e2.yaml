- id: doc_113_台中_大業_社會_歷史_g7s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 根據上文，請問清法戰爭發生於西元幾年？
  options:
  - label: A
    content: '1894'
  - label: B
    content: '1984'
  - label: C
    content: '1884'
  - label: D
    content: 1874。
  group_stem: "基隆市正砂社區發展協會今天在清法戰爭紀念園區舉行中元普度儀式，悼念清法戰爭犧牲的法國軍人。法國在臺協會副主任陸明莉（Cléa Le Cardeur）說，這份友誼，她會牢記在心。\n\
    \    2024 甲辰鷄籠中元祭輪值主普的張廖簡姓宗親會主任委員張通榮、基隆市副市長邱佩琳、陸明莉等人出席這場中元普度，儀式在莊嚴肅穆中展開，包括悼祭儀式、音樂演奏、獻香祭拜、法師誦經等，不僅紀念法國軍人，也悼念清法戰爭中犧牲的清軍。\n\
    \    陸明莉說，法國公墓對法國和臺灣來說具有特殊意義，今天的儀式要紀念在140 年前清法戰爭中犧牲的700 名海軍軍官，當時基隆居民也受到這場戰役的摧殘，但基於人性和同情之心，居民安葬在臺灣去世的法國英靈，提供安息之地。陸明莉說，這座公墓見證歷史上對法國和臺灣來說黑暗的一頁，是具有象徵意義的地點。140\
    \ 年後的今天，懷著感動和感恩的心情聚集於此，並尊重臺灣和法國的傳統，一起在農曆7 月舉行悼念儀式。\n（節錄自，中央通訊社「悼念清法戰爭亡靈 法國在台協會副主任：牢記友誼」，2024/08/11。）"
