    content: 鄭氏一取得臺灣，便大肆屠殺島上原住民，搶奪原住民土地，避免日後原住民反抗鄭氏。
  - label: C
    content: 鄭氏規定在拓墾過程中，不可侵奪原住民土地，所以原住民生活均未受到影響。
