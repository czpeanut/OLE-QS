  options:
  - label: A
    content: 吸食鴉片與聚賭風氣盛行
  - label: B
    content: 男女比例出現嚴重失衡
  - label: C
    content: 官員不作為且貪贓枉法
  - label: D
    content: 漢人移民與原住民衝突不斷。
  group_stem: "以下為清帝國官員奏摺：\n    經調查得知，臺灣府所屬四縣中，諸羅、鳳山、彰化三縣，都是新住的百姓，全沒有妻子，這一類的人不但心裡沒有掛念，還敢於為非作歹。農忙時還有耕耘的事可做，只要稍微有錢就隨便亂花，加上整天沒事，只有聚在一起喝酒賭博，喝醉了、賭輸了，就共謀偷竊搶奪之事。如果他們有妻子，就會各自顧著養活妻子，那麼賭錢喝酒、花錢的事自然就會減少；為了保護家人，搶奪偷竊的想法自然就會消除了。"
