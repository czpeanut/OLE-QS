- id: doc_113_台中_大業_社會_歷史_g7s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 根據資料一，請問牡丹社事件發生於現今何地？
  options:
  - label: A
    content: 臺東
  - label: B
    content: 高雄
  - label: C
    content: 臺南
  - label: D
    content: 屏東。
  group_stem: "資料一：\n    150 年前的今天，日本陸軍中佐佐久間左馬太率領150 人的部隊進攻屏東牡丹的石門，與當地排灣族牡丹社部落發生激烈戰爭，最終不敵日軍，牡丹社頭目阿祿古（Aruqu）父子戰死，即是牡丹社事件關鍵的「石門之役」。屏東縣政府選在150\
    \ 年後的今天，將揭開「macacukes 石門古戰場」縣定史蹟碑，排灣族的代表也透過傳統儀式與歌謠祈福，盼不同民族之間都能相互理解與包容，共同守護愛與和平。\n\
    \    牡丹社事件關鍵一役「石門之役」發生地石門古戰場，是牡丹社及高士佛社人當年抵禦日軍之處，見證台灣原住民族捍衛家園的決心。（節錄自，講客電台新聞「牡丹社事件滿150\
    \ 年 排灣儀式祈福盼族群彼此理解與包容」，2024/05/22。）\n資料二：\n    日本出兵攻打台灣原住民部落的牡丹社事件，俄羅斯曾派軍官抵台觀戰、蒐集戰鬥史料與民情，凸顯俄羅斯意識福爾摩沙的戰略重要。學者說，在150\
    \ 年前文史資料中，可顯示台灣人純樸善良。\n    展覽總策劃、國立台北教育大學兼任教授楊孟哲告訴中央社記者，日軍舉兵進攻台灣南端牡丹社原住民部落，俄羅斯派軍官捷廉季耶夫（V.\
    \ A. Terent'ev）參與，並抵台觀戰。當時俄羅斯已察覺福爾摩沙戰略位置的重要性；後來再派海軍軍官保羅‧伊比斯（Pavel Ibis）抵台田野調查。\n\
    \    楊孟哲說，150 年前這2 名軍官的台俄雙邊關係重要文件，目前存放在俄羅斯聖彼得堡海軍公文書館。這次首度展出，體現伊比斯的研究成果與價值，呈現當年西方眼中牡丹社事件獨特的外國史觀。（節錄自，中央通訊社「牡丹社事件俄羅斯觀戰與田調\
    \ 文史凸顯台灣善良」，2024/10/30。）"
