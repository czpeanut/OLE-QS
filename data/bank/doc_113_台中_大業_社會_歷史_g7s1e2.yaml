  stem: 紀錄片《看不見的臺灣》帶領觀眾深入臺灣特有的通靈現場，記錄了一場特殊的法事──臺南的鎮門宮因為受到主祀神國姓爺的託夢，於宮門前舉行了三天的法會，目的是向當年在鄭氏統治下被屠殺的西拉雅族人道歉、超渡亡靈，希望可以藉此表達國姓爺的歉意，化解彼此三百多年來的恩怨。請問，關於鄭氏政權與原住民的互動，何者正確？
  options:
