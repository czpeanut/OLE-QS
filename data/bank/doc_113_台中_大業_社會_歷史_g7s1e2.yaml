  section: 2
  number: 19
  type: single
  page: 3
  stem: 某份條約內容寫著：「一、日本國此次所辦，原為保民義舉起見，中國不指以為不是。二、前次所有遇害難民之家，中國定給撫卹銀兩，日本所有在該處修道、建房等件，中國願留自用，先行議定籌補銀兩，另有議辦之據。三、所有此事兩國一切來往公文，彼此撤回註銷，永為罷論。至於該處生番，中國自宜設法妥為約束，不能再受兇害。」請問這份條約中的「遇害難民之家」，為下列何者？
  options:
