- id: doc_112_彰化_埤頭_數學_g9s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 如附圖，在四邊形 $ABCD$ 中，已知 $\overline{AD} \parallel \overline{BC}$，$\angle A = \angle
    C$，則在證明 $\overline{AB} \parallel \overline{CD}$ 之過程中，下列哪一個選項中所引用的性質是錯誤的？
  options:
  - label: A
    content: $\because \overline{AD} \parallel \overline{BC} \quad \therefore \angle
      1 = \angle 4$（同位角相等）
  - label: B
    content: $\because \overline{AD} \parallel \overline{BC} \quad \therefore \angle
      A + \angle 3 + \angle 4 = 180^\circ$，$\angle 1 + \angle 2 + \angle C = 180^\circ$（同側內角互補）
  - label: C
    content: $\because \angle A = \angle C$ (已知)，$\angle 1 = \angle 4 \quad \therefore
      \angle 3 = \angle 2$
  - label: D
    content: $\because \angle 3 = \angle 2 \quad \therefore \overline{AB} \parallel
