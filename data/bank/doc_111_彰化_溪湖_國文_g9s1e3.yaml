- id: doc_111_彰化_溪湖_國文_g9s1e3_s2_38
  section: 2
  number: 38
  type: single
  page: 3
  stem: 孟母生氣地把布割斷，是為了什麼原因？
  options:
  - label: A
    content: 停止紡織，教導孟子課業
  - label: B
    content: 工作告一段落，暫時休息
  - label: C
    content: 紡織品品質不佳，剪斷重織
  - label: D
    content: 藉此來告誡孟子不可怠惰廢學
  group_stem: '(乙)孟子之少也，既學而歸。孟母方績①，問曰：「學何所至矣？」孟子曰：「自若也②。」孟母以刀斷其織。孟子懼而問其故，孟母曰：「子之廢學，若吾斷斯織也。夫君子學以立名，問則廣知。是以居則安寧，動則遠害。今而廢之，是不免於廝役，而無以離於禍患也。何以異於織績而食，中道廢而不為，寧能衣其夫子，而長不乏糧食哉？女則廢其所食，男則墮於修德，不為竊盜，則為虜役矣！」孟子懼，旦夕勤勞不息，師事子思，遂成天下之名儒。君子謂孟母知為人母之道矣。

    (節錄自劉向列女傳母儀鄒孟軻母)

    注：①績：將麻或其他纖維搓成細線，引申為紡織的意思。②自若也：和以前一樣。'
