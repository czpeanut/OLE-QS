- id: doc_111_彰化_溪湖_國文_g9s1e3_s2_36
  section: 2
  number: 36
  type: single
  page: 3
  stem: 誡子書融匯了諸葛亮的心血與智慧，全文僅僅八十餘字，却成為了中華文化最著名的家訓之一，下列何者是文中沒有提到的？
  options:
  - label: A
    content: 節省樸實
  - label: B
    content: 恬靜寡欲
  - label: C
    content: 志向高遠
  - label: D
    content: 勇猛果敢
  group_stem: '(甲)夫君子之行，靜以修身，儉以養德，非澹泊①無以明志，非寧靜無以致遠。夫學欲靜也，才須學也。非學無以廣才，非靜無以成學。慆慢②則不能勵精，險躁則不能治性。年與時馳，意與日去，遂成枯落，多不接世，悲守窮廬，將復何及！

    (節錄自諸葛亮誡子書)

    注：①澹泊：恬靜而不慕名利。也作「淡泊」。②慆慢：怠慢。慆，音ㄊ幺。'
