- id: doc_113_台中_清水_英語_g9s2e1_s3_36
  section: 3
  number: 36
  type: single
  page: 3
  stem: What is the reading mostly about?
  options:
  - label: A
    content: Why people have synesthesia.
  - label: B
    content: What it is like to have synesthesia.
  - label: C
    content: What kinds of synesthesia there are.
  - label: D
    content: How to help people with synesthesia.
  group_stem: 'When you first meet Meggie, you may think she''s strange. She often
    tells people which word "tastes" good and who has a "delicious" name. But she''s
    not crazy. She has synesthesia, something only one in 2,000 people has.


    People who have synesthesia experience the world differently. For some people,
    different words "taste" differently, for some, numbers or letters have colors,
    and for some, music "touches" parts of their bodies. Many of them experience more
    than one kind of synesthesia, while some have just one, like Meggie.


    Each of them has their individual experience—two people with synesthesia may both
    "feel" music, but they almost never feel the music in the same way. For example,
    one may feel the music of the violin lightly brushing his face; the other may
    feel it on her ankle. And one''s experience of synesthesia is always the same.
    If they see the number 5 in the color blue, then 5 is blue every time they see
    it.


    There''s one thing about synesthesia: it can''t be "turned off." If you have synesthesia,
    you''ll experience it all the time. Meggie once met a guy and his name made her
    think of the taste of bad eggs. He was a fun guy, but after thinking about his
    name all night, she felt too sick to be friends with him. Even so, she still likes
    this "gift" because that''s what makes her different.'
