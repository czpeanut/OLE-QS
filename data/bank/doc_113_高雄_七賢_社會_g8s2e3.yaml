  group_stem: "※請閱讀以下短文，並回答21-23題：\n    1949年，中華人民共和國成立。10年之後，毛澤東冒進的產業革命造成自然環境的破壞，原本脆弱不堪的經濟與社會結構，幾乎被完全打碎，堪稱人類史上少有的人為浩劫。毛澤東為挽救自身領導地位，又發動一場思想革命，讓中國的傳統文化遭受重大打擊。\n\
