  stem: 「『動物大遷徙』是安排非洲旅遊的重點項目，也可能是旅人一生當中最靠近野生動物的時刻！每到7月底，東非的坦尚尼亞會迎來旱季，於是數以百萬計的斑馬、羚羊等食草野生動物，會形成一支遷徙大軍，從坦尚尼亞，往北邊的肯亞馬賽馬拉國家自然保護區前去，遷徙距離總長約3,000公里，只為尋找足夠的水源及食物。(如右圖遷徙路線)」根據上文的描述及右圖所示，造成動物大遷徙的原因與下列何者有關？
