- id: doc_113_高雄_七賢_社會_g8s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 殖民時期列強勢力進入非洲後，常依照自身的利益在非洲分出國土疆界，未考量族群與宗教的分布，為非洲帶來許多災難，例如：同一個部落被迫分散在各地，相互仇視的部落卻被強迫融合在同一區域，引發衝突。而蘇丹有部分的國界劃分的相當平直，當時的列強很有可能是依據哪一項因素來劃分?
  options:
  - label: A
    content: 地形
  - label: B
    content: 氣候
  - label: C
    content: 經緯線
  - label: D
    content: 礦產分布。
  group_stem: ※「蘇丹位於非洲尼羅河的上游附近，因為有連接紅海，所以近海地區常與西亞地區接觸往來，讓許多人接觸到了伊斯蘭教文化或基督教文化。然而較為內陸的南部，則是維持較為原始的泛靈宗教信仰與文化習慣，也因此種下內戰不斷的種子。蘇丹南部公民投票委員會在2011年1月9日至15日舉行的蘇丹南部獨立公投中，有98.83%的選民支持南部地區從蘇丹脫離，只有1.17%的選民支持國家統一。」請回答9~10題：
