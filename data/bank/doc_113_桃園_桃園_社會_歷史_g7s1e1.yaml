  stem: '「歷史事實」與「歷史解釋」的區別，在於歷史事實是客觀呈現過去發生的事件；而歷史解釋則是後人運用歷史資料，對相關歷史事件進行的詮釋與評價。下列畫底線的敘述中，何者最適合歸類為「歷史解釋」？

