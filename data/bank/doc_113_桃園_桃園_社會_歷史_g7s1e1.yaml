  stem: '小軒對大航海時代來到東亞的歐洲勢力十分感興趣，因此利用課餘時間到圖書館查找相關的資料，並將查閱的資料整理如下。

    資料一：1626 年，為了更接近日本，總督命人率領大船隊及士兵300 人進取臺灣。我們船隊沿臺灣東海岸北上，11 日到達北緯25 度-島嶼東北角的外海，命名Santiago(三貂角)隔年我們開始蓋聖多明哥城。

    資料二：1624 年，我們的船隊抵達大員，以大員為基地，與中國、日本與東南亞進行貿易，建立國際貿易的轉運站，獲利甚大。

    資料三：我們是歐洲各國中最早透過海路抵達亞洲的國家，1582 年，我們從亞洲根據地出發前往日本貿易，途中遭遇颱風船在臺灣北部海岸觸礁沉沒。

    這三份資料是當時歐洲勢力在各自的根據地留下的紀錄，根據資料內容來看，此三則記錄依序應該分別出現在右圖中何地？'
