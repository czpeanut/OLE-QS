  stem: 請問本篇文章主要在說明什麼？
  options:
  - label: A
    content: 部徽設計的概念說明
  - label: B
    content: 部徽設計發展演變
  - label: C
    content: 部徽設計的中西差異
  - label: D
    content: 部徽設計者的背景知識
  group_stem: "衛字的「韋」是以一根蛇纏繞的權杖，此蛇杖源於希臘神話，相傳醫神雅斯拉比斯（Aesculapius），傳承父親有醫治疾病的能力。而雅斯拉比斯的權杖上頭則纏繞著脫了皮的蛇，意味青春再生、妙手回春，即權杖代表醫神的力量，為全球衛生機關之間最顯著的辨識符號，蛇杖兩旁，有左右對稱的線條包圍，即是中文的「衛」字。\
    \ \n  下方之英文 W（Welfare）字樣為社會福利意象，並以敞開雙臂、彼此交會的人型，呈現西漢 劉向著新序中，三人成眾、眾志成城概念，也代表衛生福利的涵蓋範圍為全體國人，不分年齡、性別，彼此合作、共同追求和諧與大同的理念。\
    \ \n  衛字之色彩運用，以專業、理性冷靜的藍冷色系，呈現衛生醫療的專業技術，並以專業判斷為核心理念；W 字樣及部徽外圈，以熱忱、活力的橘暖色系表現，並代表社會福利的光芒涵蓋全國，不分你我。\
    \ \n（資料來源：衛生福利部綜合規畫司網站）"
  tags:
    textbook: 九上 第六課 一家手語餐廳的誕生
