- id: doc_112_彰化_溪湖_國文_g9s1e1_s2_39
  section: 2
  number: 39
  type: single
  page: 4
  stem: 依據甲、乙二文，「先生媽」與「助產婦」的區別主要為何？
  options:
  - label: A
    content: 前者無誕子經驗，後者需為妊婦
  - label: B
    content: 前者年齡在30歲以上，後者年齡在30歲以下
  - label: C
    content: 前者未在學校受過教育，後者則依規定修業完成
  - label: D
    content: 二者皆受過助產教育，前者為台灣籍，後者為日本籍。
  group_stem: "【甲】 \n  臺地亦有產婆，家有妊婦則聘之。婆隔日來而診之，及分娩，洗兒護母，懇篤盡仁術。其謝金大抵自一圓至五、六圓，雖富豪者，不過二十餘金。唯貧家不能聘婆者，近鄰老婦有經歷者往而舉之，曰：「先生媽」，年齒大抵三十歲以上，妙齡者殆稀。今也泰西產婆術大開，立學校，養生徒，不得卒業證書者不許之，是以妙齡產婆續續輩出，「婆」之一字殆不相適合。（改寫自佐倉孫三\
    \ 臺風雜記，1903 年出版） \n \n【乙】 \n  1906 年，臺北醫院院長長野純藏致函臺灣總督府：「本島經營助產工作被稱為先生媽之人，從未受過一定教育，往往處置失當，使產婦和嬰兒陷於重症。然以（日本）內地助產婦充任，因語言、風俗迥異，難以適應，故本島人助產婦之訓練，刻不容緩。」1907\
    \ 年，總督府制定〈臺灣總督府助產婦講習生規程〉，招募資格為：學歷為公學校三年級以上，年齡 16 歲以上 40 歲以下品行端正、身體強健之本島人女子，且須在規定年限內修業完成。"
  tags:
    textbook: 九上 第六課 一家手語餐廳的誕生
    labeled_by: ai
