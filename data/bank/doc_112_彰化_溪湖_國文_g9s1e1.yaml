  stem: "依據下文，母親所需要做的應該是：\n          世界上固然有不知道怎麼照顧我們的母親，但也有另外一種母親，時時刻刻都關注著我們，或者，老是在我們耳邊囉唆地問：「餓了嗎？冷了嗎？工作完成了嗎？」「開心嗎？難過嗎？來，都告訴媽媽。」對於過分嘮叨的母親來說，她們眼裡的孩子，是長不大的。或者該說，她們在心理上，寧願我們還是小時候的樣子，她們才能感受到子女在她們身邊不曾離去。所以用「過分嘮叨」來讓子女覺得自己「低等、無能」，但事實上，母親才是真正無法離開我們的人，才是真正缺乏安全感、怕被我們「丟棄」或怕我們「不見」的人。對於這樣的母親，我們不能只是「順從」而已，因為順從，並無法解決一個人的不安全感。不安的母親需要的是放鬆，是重新敞開心扉感受愛，並且學習把關注力從別人身上拉回到自己身上。（節錄自許皓宜\
    \ 與父母和解，療癒每段關係裡的不完美 ）"
