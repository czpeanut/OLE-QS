    content: 詩中屢用「飛揚」，乃藉以營造風狂雨驟的氛圍，強調環境的艱困
  group_stem: "假如我是一朵雪花，╱翩翩的在半空裡瀟灑，╱我一定認清我的方向╱—飛揚，飛揚，飛揚， \n  ╱—這地面上有我的方向。 \n  不去那冷寞的幽谷，╱不去那淒清的山麓，╱也不上荒街去惆悵╱—飛揚，飛揚，飛揚，\
    \ \n ╱—你看，我有我的方向！ \n  在半空裡娟娟的飛舞，╱認明了那清幽的住處，╱等著她來花園裡探望╱—飛揚，飛揚，飛揚， \n ╱—啊，她身上有朱砂梅的清香！╱\
    \ \n  那時我憑借我的身輕，╱盈盈的，沾住了她的衣襟，╱貼近她柔波似的心胸╱—消溶，消溶，消溶， \n  ╱ —溶入了她柔波似的心胸！        \
