  stem: 委內瑞拉是全球石油蘊藏量最大的國家，卻淪為今日地表上惡性通膨最嚴重的國家。過去十年國民經濟衰退七成，2019年通貨膨脹率一度高達400000％、2023
    年降至300％，且從2008 年後，已進行三次「新幣換舊幣」，最近一次是一百萬舊幣換一元新幣；劇烈變化的背後，凸顯出經濟與民生的崩潰。曾經，在委內瑞拉一千萬玻利瓦（委內瑞拉貨幣）才能買到一斤豬肉、八百萬玻利瓦買一包紙尿片⋯⋯；請問：此時委內瑞拉會出現何種現象？
  options:
