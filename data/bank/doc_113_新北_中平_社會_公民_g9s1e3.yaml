  stem: 2024/5/7 阿根廷央行表示，為了對抗通貨膨脹且貨幣嚴重貶值，預計下個月推出幣值一萬元披索的紙鈔。目前阿根廷發行的紙鈔最高為兩千元披索，自從總統米雷伊去年下重手救經濟，阿根廷通膨率居高不下，三月分甚至是全球之冠。2017年發行一千元披索紙鈔時，在黑市兌換美金為五十八元，現在僅剩一美元。請問：下列敘述何者錯誤？
  options:
  - label: A
    content: 披索的價值是以能夠買東西的數量來決定
  - label: B
    content: 可見披索目前處於貶值狀況
  - label: C
    content: 貨幣的價值會受到物價漲跌及貨幣發行量影響
  - label: D
    content: 披索兌換美元的匯率由兩國中央銀行共同決定。
  tags:
