- id: doc_113_屏東_中正_社會_公民_g8s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 甲、乙、丙三人在2022 年先後將戶籍由新北市板橋區遷入屏東縣屏東市，但到了當年11 月進行地方選舉投票時，依法三人中卻只有甲乙二人具有投票資格。若考慮選舉原則對投票資格的影響，下述哪一個選項的描述最有可能是事實？
  options:
  - label: A
    content: 甲剛滿20 歲生日
  - label: B
    content: 乙趕在2024 年10 月遷入屏東市
  - label: C
    content: 丙被褫奪公權，尚未復權不能投票
  - label: D
    content: 丙因受到監護宣告而無法投票。
- id: doc_113_屏東_中正_社會_公民_g8s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '在美國波士頓猶太人屠殺紀念碑上，銘刻馬丁．尼莫拉Martin Niemoller 牧師留下一段發人深省的短詩(如下)，呼籲世人不要忘記這段慘痛的歷史。請問：這段呼籲最有可能在告訴世人什麼？

    起初他們追殺共產主義者，

    我不是共產主義者，我不說話；

    接著他們追殺猶太人，

    我不是猶太人，我不說話；

    後來他們追殺工會成員，

    我不是工會成員，我繼續不說話；

    此後他們追殺天主教徒，

    我不是天主教徒，我還是不說話；

    最後，他們奔向我來，

    再也沒有人站起來為我說話了。——馬丁‧尼莫拉'
  options:
  - label: A
    content: 建立選舉制度的重要
  - label: B
    content: 我們不要對政治冷漠
  - label: C
    content: 人死不能復生，不要太傷心
  - label: D
    content: 階級、黨派代表性的重要。
- id: doc_113_屏東_中正_社會_公民_g8s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 地方政府所處理的事務，與人民的生活密切相關。政府為降低新型冠狀病毒感染風險，屏東縣政府除了在校園也在多處設置疫苗接種站，提供接種服務。這是屬於哪一類自治事項？
  options:
  - label: A
    content: 社會福利
  - label: B
    content: 教育文化
  - label: C
    content: 安全衛生
  - label: D
    content: 經濟發展。
