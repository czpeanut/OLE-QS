- id: doc_113_屏東_中正_社會_公民_g8s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 3
  stem: 2004 修憲案將立委席次減半並採取特殊選制。關於立委選制的敘述請選出正確的答案？
  options:
  - label: A
    content: 可選出區域立委與全國不分區立委，區域立委為地方民意代表
  - label: B
    content: 政黨票可直接分配不分區立委席次
  - label: C
    content: 在立委的選區中最高票者當選為該區域立委
  - label: D
    content: 我國區域立委共113 人，全國不分區立委有34 席。
- id: doc_113_屏東_中正_社會_公民_g8s1e3_s1_18
  section: 1
  number: 18
  type: single
  page: 3
  stem: 對於從國外來到台灣結婚、移民而定居的人稱為新住民，依我國法律規定，新住民如持有中華民國身分證、年滿 20歲且有台灣戶籍即擁有投票權。請問這是對於何種投票原則的保障？
  options:
  - label: A
    content: 普通
  - label: B
    content: 平等
  - label: C
    content: 直接
  - label: D
    content: 無記名 原則。
- id: doc_113_屏東_中正_社會_公民_g8s1e3_s1_19
  section: 1
  number: 19
  type: single
  page: 3
  stem: 在公民課上，老師請同學複習我國各項投票原則與相關規定，下列何者的說法有誤？
  options:
  - label: A
    content: 小花：普通原則就是不論公民的出身背景，只要符合法定資格，就有投票權
  - label: B
    content: 阿開：我國國民不論出身族群、階級、種族，都是一人一票、票票等值，平等原則就是這麼簡單
  - label: C
    content: 小富：為了讓投票流程簡單又直接，可以交由一個人代表，讓他帶著全家人的身份證去代為投票
  - label: D
    content: 阿貴：無記名原則又稱為秘密原則，不只禁止偷看別人的選票，自己也不可以主動亮票
- id: doc_113_屏東_中正_社會_公民_g8s1e3_s1_20
  section: 1
  number: 20
  type: single
  page: 3
  stem: 下列關於 2019 年北韓舉行的第 14 屆「最高人民會議」代議員選舉的討論，請選出正確的答案？
  options:
  - label: A
    content: 在投票結束後幾天，北韓政府才會公布選舉結果，但通常毫無意外，中選會會先宣布全國投票率接近 100%，如此高標的投票率反映出北韓高度的民主化成就。
  - label: B
    content: 年滿 17 歲的北韓公民，都可以參與投票選舉代議員，這相當於投票的平等原則。
  - label: C
    content: 選舉是民主國家非常重要的政治參與方式，在獨裁國家中也有選舉活動，因此獨裁國家可以算是民主國家。
  - label: D
    content: 理論上，選民可以投下反對票，但是祕密警察會找上投下反對票的人，有許多逃離北韓的人表示，投下反對票會被丟進勞改營，顯示北韓政府並未履行投票的秘密原則。
