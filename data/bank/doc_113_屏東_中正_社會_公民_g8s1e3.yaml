- id: doc_113_屏東_中正_社會_公民_g8s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 回不去的全球人口老化現象，高齡者的需求不只是健康照顧。屏東縣政府打造長照新家園，去年四月啟用的｢海豐多層級樂活園區｣除了以色彩鮮明的設計打造環境，更以失能照護為主軸，提供家屬和教研學員住宿。一樓有休閒運動中心、日照中心、居家服務和共食餐廳。行政院長說：屏東在長照工作上的認真與努力是一個參考典範，屏東經驗，全國都會看到。關於上述請選出最正確答案：
  options:
  - label: A
    content: 行政院是第一級地方政府、屏東縣政府是第二級地方政府
  - label: B
    content: 由屏東縣議會通過｢海豐多層級樂活園區｣執行預算
  - label: C
    content: 上述屏東經驗指的是教育文化的項目
  - label: D
    content: 由選民選出的縣議員負責執行與監督上述相關行政工作。
- id: doc_113_屏東_中正_社會_公民_g8s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 世界上最難聞的｢水果｣是咖啡？但是咖啡已成為現代人生活不可或缺的提神品與生活情趣，甚至有政治人物以沖咖啡的形象來親近與服務選民，可見咖啡在人們生活中的重要性。屏東的咖啡種植面積超過300
    公頃、咖啡農逾340 戶是台灣最大宗的產地。早在日治時期屏東大武山的獨特土壤、水質和海拔能醞釀出亞熱帶的特殊果酸香，屏東可以締造｢黑金｣競爭力。縣府承諾未來要將屏東咖啡朝向產業化、精緻化和莊園化的三個精準方向，讓全世界都喜歡屏東咖啡。請同學根據上文選出正確的答案：
  options:
  - label: A
    content: 縣府承諾要將屏東咖啡產業化與高雄市發展輕軌是同一類的自治項目
  - label: B
    content: 將咖啡推廣到全世界是屏東縣政府在社會福利這項努力做承諾
  - label: C
    content: 屏東縣與高雄市是同一層級的地方政府
  - label: D
    content: 位於屏東大武山所及的原住民鄉鎮，都有自治選舉區長與區民代表。
- id: doc_113_屏東_中正_社會_公民_g8s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 亮亮說我大學畢業23 歲了，要回去選鄉長！；浩浩Howard 說最想當立委，可惜他拿的是美國國籍；駿駿熱心助人，雖然20 歲沒有念大學但出來選里長就有希望；老師說他退休後要選縣議員。請問以上何人最有可能美夢成真？
  options:
  - label: A
    content: 亮亮
  - label: B
    content: 浩浩Howard
  - label: C
    content: 駿駿
  - label: D
    content: 老師。
- id: doc_113_屏東_中正_社會_公民_g8s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: '以下是第491 期｢屏東市政｣的相關報導，請問關於｢社會福利｣的政策有幾項？

    #點亮希望照亮未來—路燈認養計畫

    #屏東市重陽節—敬老津貼開始發放

    #90 風華—屏東國際走讀日

    #打造快樂fun 城市—縣民公園體驗星空電影欣賞'
  options:
  - label: A
    content: 一項
  - label: B
    content: 兩項
  - label: C
    content: 三項
  - label: D
    content: 四項。
- id: doc_113_屏東_中正_社會_公民_g8s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 民｢益｣之所在，即施政之所向。在一份施政報告中哪一項最有可能需要跨縣市合作？
  options:
  - label: A
    content: 打造多元休閒場域，社區活動中心進行耐震補強和設施翻新
  - label: B
    content: 排水工程改善計畫，重構溝渠、擴大河川排水系統
  - label: C
    content: 保障市民生命安全，新增多處AED 自動體外心臟去顫器
  - label: D
    content: 道路品質升級，提供學區通學步道更舒適安全的步行。
- id: doc_113_屏東_中正_社會_公民_g8s1e3_s1_16
  section: 1
  number: 16
  type: single
  page: 3
  stem: 附圖為我國選舉的其中一種選票，關於此種選票的敘述下列何項說明最正確？
  options:
  - label: A
