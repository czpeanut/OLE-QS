    \ 微米，大至肉眼可見，而一般病毒顆粒直徑約為0.1 微米。因此於密閉空間應配戴口罩，不但保護自己也能保護他人。\n    口罩過濾層的孔徑只要小於飛沫的尺寸，就能有效降低感染風險。一般市售的平面口罩依照大小，可分為兒童用與成人用口罩，常見尺寸分別為11.1cm\
    \ × 8 cm 與17.5 cm × 9cm；而依口罩過濾孔徑大小與用途分類，亦可分為以下幾種：\n\n| 種類 | 功能 |\n| :--- | :---\
    \ |\n| N95 口罩 | 可阻擋95%以上（$0.1\\mu\\text{m}$）顆粒，但呼吸阻抗性高，不適合一般民眾長時間配戴。 |\n| 醫療口罩\
    \ | 可阻擋80%（$0.1\\mu\\text{m}$）顆粒，原則上每天更換，但如果破損或沾上汗漬、口水應立即更換，感冒、發燒、咳嗽者適用。 |\n|\
    \ 活性碳口罩 | 可吸附有機氣體及毒性粉塵，適用於噴漆或噴灑農藥時 |\n| 棉布口罩 | 用來過濾較大顆粒，適合清潔工作時 |\n\n專家指出，配戴口罩並沒有所謂的100%零風險，但是正確選用與配戴口罩、配合相關防疫措施，同時保持健康生活習慣，將可有效降低病毒感染風險。根據本文請回答以下問46~50\
    \ 題："
