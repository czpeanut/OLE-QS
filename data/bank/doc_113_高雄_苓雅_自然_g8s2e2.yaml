  type: single
  page: 3
  stem: '「氣喘」是因為氣道發炎而造成氣道阻塞，和遺傳體質與環境因素有關。氣喘發作時，症狀從咳嗽、喘鳴聲、胸悶、到呼吸困難都有可能，一般需要使用藥物來緩解。會誘發氣喘發作的原因，包含過敏原(例如塵蟎、藥物、花粉、空汙)、病毒感染、冷空氣、運動或強烈的情緒變化。

    「過度換氣」則是因為急性焦慮(情緒、壓力、或茶、酒精及咖啡等刺激性飲料)所引起。發作的時候，病人會自覺吸不到空氣，而不自主地加快呼吸，導致過多的二氧化碳被「清出」體外，而造成低二氧化碳血症(引起呼吸性鹼中毒)。病人會出現四肢肌肉僵硬、嘴巴周圍及手指發麻、頭暈、頭痛、胸悶、胸痛、心跳加快、臉色蒼白、手腳冰冷等情況。

