- id: doc_113_高雄_苓雅_自然_g8s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '在 25 ℃下，某固定體積之密閉系統中的化學反應已達成平衡，其反應式如下所示：

    $\mathrm{\underset{紅棕色}{2NO_{2(g)}} \rightleftharpoons \underset{無色}{N_{2}O_{4(g)}}
    + 熱量}$

    則下列敘述何者正確？'
  options:
  - label: A
    content: 系統溫度下降時，氣體總分子數減少
  - label: B
    content: 系統溫度下降時，氣體顏色變深
  - label: C
    content: 當系統溫度上升時，$\mathrm{N_{2}O_{4}}$ 分子數增加
  - label: D
    content: 系統溫度上升時，反應向右進行。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 理化
      code: 4-2
      title: 可逆反應與平衡
      chapter: 第4章 反應速率與平衡
    textbook: 八下理化 4-2 可逆反應與平衡
    labeled_by: ai
  ai_answers:
