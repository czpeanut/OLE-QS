- id: doc_113_新北_江翠_數學_g8s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 下列有關平方根的敘述，何者正確？
  options:
  - label: A
    content: 因為沒有任何整數的平方等於 2，所以 2 沒有平方根
  - label: B
    content: 因為 $a=2^{2}$，所以 $a$ 是 2 的平方根
  - label: C
    content: 若 $a$ 是 2 的平方根，則 $-a$ 也是 2 的平方根
  - label: D
    content: 因為 $-2^{2}=-4$，所以 $-2$ 是 $-4$ 的平方根
