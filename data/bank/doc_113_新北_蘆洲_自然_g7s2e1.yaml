- id: doc_113_新北_蘆洲_自然_g7s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: '小倩上網查詢了蚯蚓的相關資料如下：

    蚯蚓是雌雄同體、異體受精的動物，即每隻蚯蚓同時具有雌雄兩性生殖器官。它們通常在春季或夏季進行交配（彼此交換精子），交配完成後，雙方各自產卵繭。蚯蚓的卵繭在土壤中孵化，幼蚯蚓經過幾個發育階段後成為成年蚯蚓。

    請問上述蚯蚓的生殖方式及其特色為何？'
  options:
  - label: A
    content: 無性生殖，子代與親代有遺傳變異
  - label: B
    content: 無性生殖，子代與親代無遺傳變異
  - label: C
    content: 有性生殖，子代與親代有遺傳變異
  - label: D
    content: 有性生殖，子代與親代無遺傳變異
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 生物
      code: 1-3
      title: 有性生殖
      chapter: 第1章 生殖
    textbook: 七下生物 1-3 有性生殖
    labeled_by: ai
