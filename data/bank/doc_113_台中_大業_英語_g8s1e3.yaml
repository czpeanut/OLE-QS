  group_stem: "[B]\nOne day, a poor man, who had only one piece of bread to eat, was\
    \ walking past a restaurant. There was a large pot of soup on the table. The poor\
    \ man held his bread over the soup, so the steam from the soup went into the bread,\
    \ and gave it a good smell. Then he ate the bread.\n     The restaurant owner\
    \ was very angry at this, and he asked the man for money, in exchange for the\
    \ steam from the soup. The poor man had no money, so the restaurant owner took\
    \ him to Nasreddin, who was a judge at that time. Nasreddin thought about the\
    \ case for a little while.\n     Then he took some money from his pocket. He held\
    \ the coins next to the restaurant owner's ear, and shook them, so that they made\
    \ a jingling noise.\n\"What was that?\" asked the restaurant owner.\n\"That was\
    \ payment for you,\" answered Nasreddin.\n\"What do you mean? That was just the\
    \ sound of coins!\" protested the restaurant owner.\n\"The sound of the coins\
    \ is payment for the smell of the soup,\" answered Nasreddin. \"Now go back to\
    \ your restaurant.\"\n\n steam 蒸氣; exchange 交換; judge 法官; case 案件；while 一會兒；jingle\
