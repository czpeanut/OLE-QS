  group_stem: '臺灣肉圓大抵南蒸北炸，北部以彰化為代表，餡料以豬肉為主，外皮彈牙。南部以臺南為代表，多以蝦仁為主角，新鮮的火燒蝦仁、肉臊、紅蔥頭所組合調製的內餡，加上細嫩的外皮。

    　　肉圓的地緣性格強烈，我最常吃的是臺北南機場社區的肉圓攤，下午才短暫出沒，旋即不見蹤影。當肉圓攤重現江湖，攤前立刻排出長長的人龍，我多次搭計程車去排隊，大概有一半的機率向隅。還有這攤令我追憶：焦妻大學畢業時賃居臺北東區頂好市場後面，附近土地公廟前有一肉圓攤，我們常常站在路邊吃肉圓，那氣味芬芳了周圍的空氣。這樣一粒肉圓，值得燒香拜佛。

    　　肉圓美味與否繫乎三條件：外皮須厚薄適中，又要柔軟而富彈性，外表須呈半透明，有剔透感，咬下去透露米香；內餡須飽滿，且配料和諧，調味佳；淋醬的優劣亦是成敗關鍵。

    　　彰化堪稱「肉圓的故鄉」，發展出多樣風格的「好圓」，在全臺各地開枝散葉。我習慣了吃滾燙的肉圓，邊吃邊吹氣，覺得肉圓就是要燙嘴。林家彰化涼圓糾正了我的偏見，原來涼的肉圓也可以這麼好吃，並透露一種清涼感。

    　　彰化肉圓的炸油多以花生油混合豬油，肉圓蒸熟後備用，待顧客點食才入油鍋加熱。由於剛從油鍋中撈起，從皮到餡都非常燙，在急嘗美味和燙傷嘴的邊緣，忽然領悟爽快和危險住得這麼近，喔，人生有許多時候真的像在吃肉圓，躁進不得。

    （焦桐 味道福爾摩莎）


    表一：各地肉圓比一比

    | | 彰化化圓 | 北斗肉圓 | 臺南肉圓 |

    | :--- | :--- | :--- | :--- |

    | 大小顆 | 較大 | 較小 | 較小 |

    | 形狀 | 圓形 | 三角形 | 圓形 |

    | 內餡 | 竹筍與豬肉(內含香菇干貝) | 竹筍與豬肉 | 蝦仁與豬肉 |

    | 外皮 | 太白粉、地瓜粉及在來米的粉(各店家調配比例是袐訣) | 太白粉、地瓜粉及在來米的粉(各店家調配比例是袐訣) | 太白粉、地瓜粉及在來米的粉(各店家調配比例是袐訣)
    |

    | 作法 | 先蒸再炸酥 | 先蒸再炸酥 | 清蒸 |

    | 淋醬 | 鹹中帶甜 | 中藥清香 | 偏甜 |


