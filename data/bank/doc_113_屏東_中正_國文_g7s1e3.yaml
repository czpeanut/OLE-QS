  group_stem: '健康的必需品！你不能不知道的維生素 B 群

    　　維生素B 群（維他命B 群）是不同水溶性維生素的總稱，指的是 B1、B2、B6、B12、菸鹼酸（B3）、泛酸（B5）、葉酸（B9）、生物素（B7）共八種。維生素B
    群也被稱為「能量維生素」，能幫助細胞代謝、合成紅血球，並參與體內新陳代謝過程，協助人體更有效率的利用三大營養素：蛋白質、醣類、脂質，讓身體保持健康。若長期缺乏維生素B
    群，健康容易出現警訊。

    　　人體無法自行合成維生素 B 群，且維生素B 群是水溶性維生素，易溶於水，會隨著排尿或排汗流失，並不會在人體中儲存，因此需要每天透過食物或保健品進行適量補充，才能維持身體機能的正常運作。

    　　雖然攝取維生素B 群聽起來好處多多，但過量攝取還是可能出現副作用，例如神經系統障礙、失眠、腹瀉、頭痛、噁心等症狀，因此仍要注意攝取量，不可因為身體會自動排出過量的維生素
    B 群便肆無忌憚地攝取。

    （許維宇）'
