  group_stem: 'Breaking News "Millions Travel Home for Lunar New Year in China" 27th
    January 2025

    The Lunar New Year is important in China. Hundreds of millions of people go back
    to their hometowns for it. This year is no different! Airports, train stations,
    and bus stops are packed with travelers making their yearly trip home. This year
    is the Year of the Snake, which comes every 12 years in Chinese culture. The celebrations
    begin on the 29th of January and last for up to 16 days. The first seven days
    are even national holidays, so people get to take a break from work or school.

    This year, lots of people are traveling to other countries for the holiday. One
    travel company said that the number of people booking trips outside of China is
