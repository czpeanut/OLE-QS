  group_stem: 'Get ready for fun at the 2025 Kaohsiung Lantern Festival! Have you
    heard of Chiikawa? It''s a lovely character from Japan that’s become super popular
    in Taiwan too! Now, Chiikawa is the star of the 2025 Kaohsiung Lantern Festival!
    This year, the festival is turning Love River Bay into a winter wonderland, with
    exciting activities, games and rides for everyone. The festival is designed to
    bring joy to everyone who visits, just like the cute Chiikawa does.


