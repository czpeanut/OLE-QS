  group_stem: 'Yesterday I watched Jurassic Park, a popular movie in 1993, again.
    It is about a park full of kinds of dinosaurs on an island. But where were those
    dinosaurs from? Well, some crazy men created them with the science of “cloning”
    (copying living things). Cloning animals has happened in real life. A frog was
    cloned successfully in 1952, and over 20 kinds of animals have been cloned since
    then. Of them, the most famous one was the sheep, Dolly.


    Dolly was born in 1996, and she gave birth to six lambs (young sheep) in total.
    Unluckily, her life was cut short at just 6.5 years old although the average lifespan
    of a sheep is around 11 to 12 years. She began getting sick very often because
    of taking a lot of medicine. Finally, she died in 2003. Cloning appeared to be
    not very successful. However, Dolly still gave scientists hope to clone ancient
    animals, like mammoths, a type of giant elephants, or even dinosaurs. They say
    mammoths are helpful for iced land. Some even try to clone humans. Are they crazy?
    They’re trying to break the rule of nature, which may lead to lots of problems
    we have never thought of. Do they forget the fact Dolly showed us that cloned
    animals have shorter lives? Would we be happy when we live on the planet that
    is full of copied people? Besides, how scary it would be when dinosaurs are running
    after us like those in Jurassic Park!


    📖 dinosaur 恐龍 average lifespan 平均壽命

    ancient 古代的 mammoth 猛獁象'
