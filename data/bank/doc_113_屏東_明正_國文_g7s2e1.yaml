- id: doc_113_屏東_明正_國文_g7s2e1_s6_6
  section: 6
  number: 6
  type: single
  page: 3
  stem: 根據文章內容，作者認為沉船礁每次都給了他遠超過期待的回報，原因為何？
  options:
  - label: A
    content: 沉船礁深邃充滿神秘感的故事，讓他有許多幻想
  - label: B
    content: 沉船礁豐富的魚類資源，滿足作者的探險好奇心
  - label: C
    content: 沉船礁深厚的歷史價值能拓展作者的眼界與心胸
  - label: D
    content: 沉船礁的無窮寶藏，讓作者能重溫年少時的夢想。
  group_stem: '近年一次潛水調查一條水深超過百呎，用沉船做的人工魚礁，那種幽暗、深邃、神祕又略帶一些危險的感覺，讓我重溫了疏離多年的少年夢。

    民國六十五年，我在中研院 張崑雄博士實驗室時學了水肺潛水，之後連著兩年，每個月都有十五天泡在臺灣四周及離島的海洋中，從事魚類生態的調查研究。水晶天地中的花花世界，看得頗有曾經滄海難為水的感覺，不過在那些不計其數的潛水機會中，每當要前往外海的沉船礁調查時，心中興奮，略有些緊張、但又充滿期待的滋味，迄今猶難以忘懷。

    為什麼呢？因為在外洋的潛水不像珊瑚礁區，四周一片茫茫大海，看不到一丁點陸地，下面又是深不可測的海洋，但是為了工作，說要往下跳就得往下跳，那個當兒，還真需要點決心；入了水，開始下潛，心理上的穩定度要更強，在沉向海底的過程中，上下左右都是無邊無際的深藍，沒有任何的參考點，你也不知道下面在等你的是些什麼樣的東西，大鯊魚？大海鰻？或是強勁的海流？無依無靠又無所恃的心境，對沒有經歷過的人，實在很難講得貼切。或許你會說，電視上不是都播過了嗎？錯！幾十年前完全沒有這些資訊與畫面，有的只是簡陋的設備，滿腦子鯊魚、怪物和神祕的海洋童話，以及一顆探索未知世界好奇的心。但是沉船礁每次都給了我遠超過期待的回報。

    朦朧中，海底首先會出現一條船的輪廓，距離雖然還有十幾公尺，卻常常已看得出是一條三、五十噸的遠洋漁船，而這時身旁也開始有魚群陪伴了；在南部通常是圓翅燕魚，在北部通常是紅魽鯵，而在澎湖則以金梭及鯖、鰺魚居多，牠們都是礁區較外圍的居民，所以最先碰到。當海水混濁、看不到礁體，我有時也靠跟著這些魚，找到那在「水」深不知處的沉船。

    游近船礁以後，魚兒的種類和數量就愈來愈多了。在外面巡游的通常是體長一、兩公尺的大石鱸、在船橋上方水域匆匆忙忙穿梭的是烏尾冬魚群，白吻雙帶立鰭鯛或角鰈有時會聚個三、四十隻漂浮在船舷外側，蝴蝶魚、寒鯛、隆頭魚、蓋刺棘蝶魚則在船上長滿密密麻麻的附著生物中覓食，大群的笛鯛沿著船舷上下游動，天竺鲷和金鱗魚常害羞地在船艙暗處躲藏，船下面總有幾條石斑守株待兔，裸胸鯙不時從裂縫中露出齜牙咧嘴的頭，有時更有龍蝦在船的空隙間露出兩根長鬚，或甚至不知死活地出來散步。不過，能在船礁生活的龍蝦通常都很大了，有的大到一、二十斤，長到這麼大都沒有被吃掉，耀武揚威，情有可原。

    從船礁回海面這一段過程，通常會覺得很漫長，一方面是因為在較深的海域中潛水，上浮時要很注意减壓，另一方面就像自鄉村中充滿野趣的外婆家度完假回到城市一般，又捨不得，又非得往前走。但只要想到又有一條曾在人類操縱下張牙舞爪、肆意獵殺海洋生物的漁船，在它廢棄後反而成了生機滿眼、洋洋大觀的魚族樂園時，就覺得天道循環，終還個公道，心中歡愉之情，又溢滿而出了。

    （方力行〈人魚――我的水裡人生〉）'
