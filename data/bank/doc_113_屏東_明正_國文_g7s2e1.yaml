  stem: 「除了書本，我們已越來越不懂得向生存本身，向自然萬物學習了。接近生存在這個時代變成了一件十分困難的事。人類的書籍已經泛濫到比自然界的樹葉還要多了。真實的生存大地被書頁層層掩蓋，一代人從另一代人的書本文化上認識和感知生存，活生生的真實生活淹沒了。思想變成一場又一場形成於高空而沒落到地上的大風，只掀動雲層，卻吹不走大地上的一粒塵埃。」（劉亮程〈風中的院門〉）這段文字中關於現代人的狀態，下列敘述何者正確？
