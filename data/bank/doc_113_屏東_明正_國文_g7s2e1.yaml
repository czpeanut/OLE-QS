  group_stem: '曾國藩對人生之樂，曾經說過這樣一句話：「人生有三樂，讀書聲出金石，一樂也；弘獎人才，助人日進，二樂也；勤勞而後憩息，三樂也。」大概是這位清代名臣大儒體驗有得之言，相信是有它的道理的。

    也許，讀書聲出金石，和弘獎人才之樂，不是人人能夠辦到。但是勤勞而後憩息之樂，則是每個人都能實行的；同時，事實上 也必定會獲得樂在其中的感受。（吳友詩〈人生座右銘〉）'
