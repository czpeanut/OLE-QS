    content: 不計其數／端倪
  - label: C
    content: 不由自主／濫觴
  - label: D
    content: 不卑不亢／線索。
  group_stem: "整個求學階段，我得過的獎狀不計其數。\n  尤其是國小期間，因農鄉普遍窮困，一般家庭沒有能力顧及子女學業，而我父母特別重視教育，在少有競爭的情況下，六年之中，我不只功課一直保持全年級第一名，其他如作文、演講等競賽，也都名列前茅。\n\
    \  因此我得過的獎狀，可說    。\n  據我所知所見，多數家庭都將子女的獎狀貼滿牆上，或者妥為收藏。但我從不保存、一張也未留下。\n  那時獎狀很大張，紙質又厚又韌，我通常拿來摺飛機、摺紙船，或摺成紙牌，效果特別好。\n\
    \  是因父親認為我的優秀成績乃理所當然，並不在意我的獎狀；我自己也因得來太多太容易，不覺得有什麼稀奇吧！或是我果真年幼就「看透」這些無實際價值的獎勵呢？不得而知。\n\
    \  然則我對社會上許多獎項，常抱持更深層意義去思考，雖然不強烈排斥或輕蔑，至少並不熱中追求，正是從小「淡泊獎狀」的個性，已透露了  ，而一直延續，乃至隨年齡而強化吧！\n\
    （吳晟 詩獎）"
