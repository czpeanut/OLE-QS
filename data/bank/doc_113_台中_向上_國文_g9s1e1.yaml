  stem: 禮記 聘義中說︰「君子比德於玉焉，溫潤而澤仁也。」真正的君子是以謙卑的態度待人處事，修養自己，表現出高尚品德，就如玉般堅韌、溫和、細膩。孔子總結謙德，送給學生：「情深者不壽，強極者得辱。謙謙君子，溫潤如玉。」下列金庸作品中的人物，何者最能符合孔子所言的「謙謙君子，溫潤如玉」？
  options:
  - label: A
    content: 鹿鼎記中的韋小寶不學無術、毫無功夫，從皇帝到反賊，都與他稱兄道弟
  - label: B
    content: 射鵰英雄傳中郭靖生性忠厚，曾說：「越是練武，越是知道自己不行」，畢生為國為民，是典型的「俠之大者」
  - label: C
    content: 書劍恩仇錄中的陳家洛，認為男子漢大丈夫當以家國為重，為了完成所謂的「大業」，甚至犧牲自己珍貴的事物
  - label: D
