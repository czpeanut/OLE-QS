  stem: '昔人有美戎菽① ，甘枲② 莖、芹③ 、萍子④ 者，對鄉豪稱之。鄉豪取而嘗之，蜇於口，慘於腹。眾哂而怨之，其人大慚。（列子 楊朱）

    【注釋】① 戎菽：山戎所種植的一種豆科植物，即大豆。一說為胡豆（蠶豆）。② 枲：音ㄒㄧˇ，不結子實的大麻。③ 芹：即水芹，又稱「小芹菜」。④ 萍子：即蒿子，分為青蒿、白蒿數種。

