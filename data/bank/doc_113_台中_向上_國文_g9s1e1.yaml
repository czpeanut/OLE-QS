  stem: 甲生讀完此文，將文中用作代名詞的「之」字整理如下圖，並列出該「之」字所指代的對象。下列「之」字解釋何者正確？
  options:
  - label: A
    content: ➊
  - label: B
    content: ➋
  - label: C
    content: ➌
  - label: D
    content: ➍
  group_stem: "※閱讀測驗(二)\n里中有盲童，操日者○1 術，善鼓琴。鄰有某生，召而弔○2 之曰：「子年幾何矣？」曰：「年十五矣。」「以何時而眇○3\
    \ ？」曰：「三歲耳。」「然則子之盲也且十二年矣！昏昏然而行，冥冥焉而趨。不知天地之大，日月之光，山川之流峙，容貌之妍醜，宮室之宏麗，無乃甚可悲矣乎？吾方以為弔也！」\n\
    \  盲者笑曰：「若子所言，是第○4 知盲者為盲，而不知不盲者之盡盲也。今夫世之人，喜為非禮之貌，好為無用之觀。事至而不能見，見而不能遠；賢愚之品不能辨，邪正在前不能釋，利害之來不能審，治亂之故不能識；詩書之陳於前，事物之接於後，終日睹之而不得其意，倒行逆施，倀倀焉○5\
    \ 躓且蹶○6 而不之悟，卒蹈於羅網，入於陷阱者往往而是。夫天之愛人甚矣，予之以運動知識之具○7 ，而人失其所以予之之意，輒假之以陷溺其身者，豈獨目哉！吾將謂昏昏然而行，冥冥然而趨，天下○8\
    \ 誰非盲也？」\n（節錄自戴名世 盲者說）\n【注釋】\n○1 日者：占卜。\n○2 弔：安慰。\n○3 眇：音ㄇㄧㄠˇ，瞎了一隻眼。亦指全盲。\n○4\
    \ 第：僅、只。\n○5 倀倀焉：無所適從的樣子。倀，音ㄔㄤ。\n○6 躓且蹶：摔倒。躓，音ㄓˋ。蹶，音ㄐㄩㄝˊ。\n○7 具：器官。\n○8 其：通「豈」，難道。"
