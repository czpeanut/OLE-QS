- id: doc_113_台中_向上_國文_g9s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 1
  stem: 詞有「婉約派」與「豪放派」之別，「婉約派」以柔美靡麗見長，側重閨情綺怨；而「豪放派」以雄豪奔放、率真質樸為特色，多以家國、史事入題，氣勢雄渾壯偉。下列詞句，何者屬於「豪放派」之作品？
  options:
  - label: A
    content: 斜陽草樹，尋常巷陌，人道寄奴曾住。想當年，金戈鐵馬，氣吞萬里如虎
  - label: B
    content: 擬把疏狂圖一醉，對酒當歌，強樂還無味。衣帶漸寬終不悔，為伊消得人憔悴
  - label: C
    content: 寒山碧，江上何人吹玉笛？扁舟遠送瀟湘客。蘆花千里霜月白，傷行色，來朝便是關山隔
  - label: D
    content: 昨夜雨疏風驟，濃睡不消殘酒。試問捲簾人，卻道海棠依舊。知否？知否？應是綠肥紅瘦。
