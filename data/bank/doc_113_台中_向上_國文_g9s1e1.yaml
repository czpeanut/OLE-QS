- id: doc_113_台中_向上_國文_g9s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 「『有天大的困難，當你說出來的那一刻，世界就不一樣了。』阿騫在多次表達之後，愈來愈感受到，從周遭人身上得到滿滿的愛，應該要盡量分享出去，幫助更多人面對傷痛。」依據此段文字，「說出來的那一刻，世界就不一樣了」的涵義為何？
  options:
  - label: A
    content: 因為情緒和傷痛獲得釋放，心境改變了
  - label: B
    content: 把困難交代給別人解決，自己就輕鬆了
  - label: C
    content: 用語言治療傷痛，絕對是最有效的方法
  - label: D
    content: 只要能說出口的困難，通常就不難解決。
  tags:
    textbook: 九上 第三課 與921說再見：20年的生命練習題
