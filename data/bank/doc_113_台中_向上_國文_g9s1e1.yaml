- id: doc_113_台中_向上_國文_g9s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 與921說再見：20年的生命練習題：「全臺十萬多棟房屋全倒或半倒，超過二千四百人死亡、一萬多人受傷，更留下一百三十四位失去雙親的失依兒。」關於這段文字的寫作手法，下列說明何者正確？
  options:
  - label: A
    content: 舉例說明將抽象的概念具體化、形象化
  - label: B
    content: 使用條列的方式說明，讓文章條理更清晰
  - label: C
