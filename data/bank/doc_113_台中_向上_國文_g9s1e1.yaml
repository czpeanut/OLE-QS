- id: doc_113_台中_向上_國文_g9s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 「其實時間是會掩蓋事實，但是愈大的創傷，愈不容易結痂的，所以如果只是把創傷掩蔽起來，難保不會在你最脆弱的時候，再來一記回馬槍。」此段文字主要想表達何種要旨？
  options:
  - label: A
    content: 不管盡多大的力量，心靈的創傷永遠無法被治癒
  - label: B
    content: 時間是最好的良藥，久了自然就沖淡內心的傷痛
  - label: C
    content: 面對傷痛，不是當它不存在，而是不停面對
  - label: D
    content: 不再回憶過往，將悲傷掩藏起來，心靈總有一天會復原。
  tags:
    textbook: 九上 第三課 與921說再見：20年的生命練習題
