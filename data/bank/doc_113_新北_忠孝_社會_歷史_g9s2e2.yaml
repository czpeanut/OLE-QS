  stem: 有位學者對某個選官制度做出了以下的評論：「為防止地方大族左右人才的評議或推薦，政府在各郡、州設立『中正官』，中正官主要的職責就是依據家世、品德、才能三個標準將天下才俊將以品評，但比起個人的才華，官員們似乎更看重的是出身背景與權勢。」請問：此位學者所評論的選官制度對當時的社會造成了什麼樣的影響？
  options:
  - label: A
    content: 封建制度下重視血緣關係，貴族掌握選官權力
  - label: B
    content: 萬事惟有讀書高，儒家思想成為中國主流學問
  - label: C
    content: 政府訂定嚴格法規制度，全國依法令規定行事
  - label: D
    content: 上品無寒門下品無世族，當代政權由世族掌握。
