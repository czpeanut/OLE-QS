- id: doc_113_新北_忠孝_社會_歷史_g9s2e2_s1_35
  section: 1
  number: 35
  type: single
  page: 2
  stem: 許多戲劇、漫畫、動畫作品雖稱是架空的創作，但細看他們的內容設定，其實都不難看出他們所參考的歷史背景。例如最近風靡台灣和日本兩地的漫畫「SPY×FAMILY
    間諜家家酒」，其中西國（Westalis）和東國（Ostania）的對峙，以及世界各國都在暗地裡進行激烈情報戰的背景設定，皆是參考自某個歷史時代。請問：若該漫畫的作者參考當時的歷史情境進行創作，則該漫畫中最可能出現下列哪一個畫面？
  options:
  - label: A
    content: 東國與西國因故擦槍走火，後為人民著想決定簽訂合約，結為兄弟國，東國給予西國歲幣以換取和平
  - label: B
    content: 東國與西國政府在安尼亞與學校好友努力之下，放下成見與仇恨，簽訂互不侵犯條約，兩國回歸和平
  - label: C
    content: 兩國政府為加強管控各自國家人民的言論與思想，各自發布戒嚴令，派出祕密警察監控人民所有活動
  - label: D
    content: 東國一夜間於邊境築起圍牆，阻止兩國人民往來，特務黃昏冒險深入東國拯救被困於東國的西國人民。
