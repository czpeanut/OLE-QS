- id: doc_113_新北_忠孝_社會_歷史_g9s2e2_s1_34
  section: 1
  number: 34
  type: single
  page: 1
  stem: 英國泰晤士河畔停泊著一艘帆船─卡蒂薩克號，它是現存最古老的帆船，也見證了19、20 世紀英國遠洋貿易的歷史。卡蒂薩克號建於1869 年，在當時可是英國與中國間貿易最重要的船隻；然而，由於英國經濟及產業上的變化，自1883
    年起，速度更快的船隻取代了卡蒂薩克號從中國運送貨品的任務，卡蒂薩克號成為往來英國與澳洲的羊毛運送船；最後，在1954 年時，卡蒂薩克號卸下了出航任務。現在，這艘具有百餘年歷史的帆船成為博物館的展覽船，展覽著他在輝煌的航海過程中所經歷的歷史。請問：下列何者最可能是卡蒂薩克號博物館上所展示的物品？
  options:
  - label: A
    content: 載滿白銀至上海與商家購買茶葉的照片
  - label: B
    content: 至殖民地越南招募基層船員的招募文書
  - label: C
    content: 與原住民交易時所寫下的新港文書契約
  - label: D
    content: 被法國無限制潛艇政策轟炸的修復痕跡。
