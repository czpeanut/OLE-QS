- id: doc_113_新北_忠孝_社會_歷史_g9s2e2_s1_30
  section: 1
  number: 30
  type: single
  page: 1
  stem: 2025 年4 月，大阪關西世界博覽會盛大開幕，吸引了許多人前去觀賞各國的先進技術。世博會的構想最早可追溯至中世紀歐洲商人「定期的市集」，起初只牽涉到商業行為，但到了19
    世紀，開始慢慢演變成向全世界展示國家力量的場合。1851 年的「萬國工業博覽會」被視為現代的第一屆世界博覽會，當時主辦國計畫透過一個大型的展覽會來展示其國力及工業生產力，他們自豪地把這次稱為「偉大的博覽會」（Great
    Exhibition），現場除了展示該國如蒸汽機、農業機械、織布機等先進工業產品外，也以鋼鐵和玻璃建成巨大的「水晶宮」來展現主辦國在工業發展的領先地位及輝煌時代，成功打造其「世界工廠」的形象。請問：第一屆的「萬國工業博覽會」的主辦國最可能是下列哪個國家？
  options:
  - label: A
    content: 法國
  - label: B
    content: 中國
  - label: C
    content: 美國
  - label: D
    content: 英國。
