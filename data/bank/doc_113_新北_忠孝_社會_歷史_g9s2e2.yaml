- id: doc_113_新北_忠孝_社會_歷史_g9s2e2_s1_37
  section: 1
  number: 37
  type: single
  page: 2
  stem: 小說《走過》改編自一位台東原住民屈納詩的真實故事。在太平洋戰爭逐漸升溫進入的決戰期，為充實兵員，當時政府積極在台灣各地徵兵，招募青年投入軍隊，屈納詩也加入了這批軍隊當中。但隨著政權的轉換，這批軍隊並未踏上東南亞的土地，反而被帶至中國大陸，投入徐州、魯西、徐蚌等地戰爭，多數人戰死他鄉，屈納詩與其他倖存者被俘後加入解放軍，也以解放軍的身分參加多場戰役，後來帶著傷殘的身軀在中國大陸生活並娶妻生子，也親眼見證那段時間中國數十年腥風血雨的社會運動，最終，在47
    年後的1992 年，踏上魂牽夢縈的歸鄉路，回到台灣，這幾年流轉征戰的歲月，他已經不知道為何而戰，為誰而戰。請問：在屈納詩的過往經歷當中，最有可能經歷下列哪件事？
  options:
  - label: A
    content: 跟著朋友一起上街，抗議日本即將取得山東青島權益
  - label: B
    content: 加入高砂義勇軍，以日軍的身分參加第一次世界大戰
  - label: C
    content: 看著街上打著革命口號到處批鬥的紅衛兵，感到害怕
  - label: D
    content: 回台後，因被認為宣傳共黨言論違反戒嚴令被捕入獄。
