  stem: China 一字，一般指的是西方國家對中國的稱呼，而China 為何代表中國，有一種說法是China 來自於中國古代「秦」的發音，為周邊民族與中國貿易時所留下來的稱呼；也有一說是China
    一字來自於「昌南」(景德鎮古名)，由於昌南生產出絕美的青花瓷，風靡整個歐洲，因此生產出青花瓷的「昌南」就成了中國的代名詞。但不管是哪一種說法，大概比較可以肯定的是，China
    作為中國的代名詞，應該是葡萄牙等歐洲國家先後來到亞洲貿易的時候開始在拉丁語系國家中流傳下來的。請問：依照上述說法，西方國家開始主要將China 指稱中國，最可能是從中國哪個朝代開始的？
  options:
  - label: A
    content: 唐朝
  - label: B
    content: 宋朝
  - label: C
    content: 明朝
  - label: D
    content: 清朝。
