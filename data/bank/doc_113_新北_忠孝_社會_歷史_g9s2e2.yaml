  section: 1
  number: 39
  type: single
  page: 2
  stem: 啟蒙運動(Enlightenment)一詞始用於十八世紀法國的思想界，它強調「理性」，以科學掃除愚昧，以理性思維取代宗教信仰，以天賦人權及主權在民等思想挑戰封建社會的統治權威。中國從某時期開始也開始強調這種以這種「理性」的模式思考，甚至被稱為「中國的啟蒙運動」。請問：這個「中國的啟蒙運動」最可能與下列何事有關？
  options:
  - label: A
    content: 自強運動
  - label: B
    content: 新文化運動
  - label: C
    content: 五四運動
  - label: D
    content: 戊戌變法。
