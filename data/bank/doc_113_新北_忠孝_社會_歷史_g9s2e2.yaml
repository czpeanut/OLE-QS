  section: 1
  number: 33
  type: single
  page: 1
  stem: 為了擴大殖民地的獲利，他們採取一系列的徵稅措施，壟斷對原住民鹿產品的外銷並課徵稅金。他們還發執照給中國漁民來開發沿岸漁業，最重要的是他們招徠漢人種植稻米和甘蔗。這些政策使臺灣成為一個歐洲人、漢人、原住民的複合社會，如巴達維亞及菲律賓一般。一旦藉由軍事行動完成控制，便進一步利用漢人農民和部落商人剝削臺灣的資源。請問：上述資料最可能是描述哪一政權統治時期的臺灣？
  options:
  - label: A
    content: 荷蘭治台時期
  - label: B
    content: 日治時期
  - label: C
    content: 鄭氏治台時期
  - label: D
    content: 清帝國時期。
