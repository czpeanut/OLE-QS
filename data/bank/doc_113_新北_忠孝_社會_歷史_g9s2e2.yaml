  section: 1
  number: 36
  type: single
  page: 2
  stem: 小蓉到台灣某地旅行時，看到了一間古老的倉庫─殼牌倉庫，殼牌倉庫是殼牌(Shell)公司的儲油倉庫和儲油槽所在地，當地人也因該倉庫長年飄散油臭味而稱它為「臭油棧」，在倉庫園區內還鋪設鐵路以方便運送油品。殼牌倉庫的前身是嘉士洋行倉庫，當時著名的茶葉外銷洋行嘉士洋行透過中間人以永久出租的名義承租了一塊土地，並興建倉庫用以經營茶葉貿易，後來殼牌公司看中了此地交通運輸的方便性，便向嘉士洋行購買了這個倉庫作為遠東地區貿易的一環。最後，因土地產權的爭議，使得這個百年的倉庫因而留了下來，成為該地唯一留下來的洋行建築，也成為當地重要的歷史古蹟之一。請問：小蓉在該地旅行時還可以見到哪一個歷史古蹟？
  options:
  - label: A
    content: 億載金城
  - label: B
    content: 紅毛城
  - label: C
    content: 鹿港天后宮
  - label: D
    content: 打狗英國領事館。
