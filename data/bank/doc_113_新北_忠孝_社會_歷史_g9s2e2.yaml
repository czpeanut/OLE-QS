  stem: MLD 台鋁生活商場是高雄市一間結合餐飲、影城、文創等大型商場，是由舊台鋁(台灣鋁業公司)廠房改建而成。台灣鋁業公司的前身是在1930 年代，為因應國家政策而成立的鋁業株式會社，其生產量曾是當時全世界規模第二大的製鋁工廠，為台灣重工業的發展打下了基礎。請問：台灣製鋁工業有如此發展，最可能與當時的哪項國家政策有關？
  options:
  - label: A
    content: 國家往東南亞前進，讓台灣成為補給的基地
  - label: B
    content: 為吸引各國來台投資工業，發展加工出口區
  - label: C
    content: 增加國家財政收入，積極籌備各項基礎建設
  - label: D
    content: 為解決國際能源危機影響，發展本土重工業。
