  section: 1
  number: 32
  type: single
  page: 1
  stem: 聯合果品公司是20 世紀一個專門運營熱帶水果產業的商業公司，它擁有廣大的土地、數家鐵路公司、船運公司，壟斷了加勒比海、中美洲、巴拿馬、哥倫比亞等國的香蕉貿易，不僅對當地的經濟發展有著極大的影響力，甚至是當地許多國家政權的實際控制者，因此也被稱為「國家中的國家」。請問：這間聯合果品公司最可能是下列哪國的企業？
