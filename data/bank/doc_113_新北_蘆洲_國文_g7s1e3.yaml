  group_stem: '有屠人貨肉歸，日已暮。忽一狼來，瞰①擔上肉，似甚垂涎，隨屠尾行數里。屠懼，示之以刃，則稍卻，既走，又從之。屠無計，默念狼所欲者肉耳，不如姑②懸諸樹而早取之。遂鉤肉，翹足掛樹間，示以空擔。狼乃止。屠即逕③歸。晨往取肉，遙望樹上懸巨物，似人縊④死狀，大駭，逡巡⑤近之，則死狼也。仰首審視，見口中含肉，肉鉤刺狼齶，如魚吞餌。時狼革價昂，值十餘金，屠小裕焉。

    （蒲松齡 聊齋志異）


