    \n  這個鄉下人感到驚訝和不安，一口喝完了他那一小杯酒，站起身來，腰比早上彎得厲害，因為每次休息以後，邁頭幾步特別困難。他一邊走，一邊重複說道：「我在這裡，我在這裡。」\n\
