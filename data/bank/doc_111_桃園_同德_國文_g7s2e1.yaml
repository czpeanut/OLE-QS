- id: doc_111_桃園_同德_國文_g7s2e1_s3_5
  section: 3
  number: 5
  type: single
  page: 1
  stem: 〈聲音鐘〉作者以有情的眼光，從平凡中發現不平凡，使生活更有樂趣。此種心境「無法」用下列何者來詮釋？
  options:
  - label: A
    content: 萬物靜觀皆自得
  - label: B
    content: 一枝草，一點露
  - label: C
    content: 一沙一世界，一花一天堂
  - label: D
    content: 好鳥枝頭亦朋友，落花水面皆文章
