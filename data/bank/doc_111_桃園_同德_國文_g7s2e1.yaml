- id: doc_111_桃園_同德_國文_g7s2e1_s3_8
  section: 3
  number: 8
  type: single
  page: 2
  stem: 〈聲音鐘〉的作者認為聲音鐘構築的「不是」物理的時間，而是心情的時間，原因何在？
  options:
  - label: A
    content: 小販們的出現時機均十分規律，能讓消費者感到安心
  - label: B
    content: 叫賣聲具有療癒效果，能為心情低落的人們帶來希望
  - label: C
    content: 叫賣聲的報時方式和出現時機，是充滿趣味與變化的
  - label: D
    content: 由叫賣聲的抑揚頓挫，能忠實反映出小販當時的心情
  lesson_raw:
    title: 聲音鐘
