    | | 故事結構 | 摘要內容 |

    | :--- | :--- | :--- |

    | (A) | 背景 | 主要角色：歐斯科爾、瑪蘭丹、鎮長<br>地點：哥第維爾<br>物：一根繩子 |

    | (B) | 情節 | 歐斯科爾撿拾了一根繩子，被誤認為偷拿錢包，無論他如何辯解依然不得眾人信任，一直到錢包被找到，大家才願意還他公道。 |

    | (C) | 結局 | 歐斯科爾被謠言及偏見擊垮，精神徹底崩潰，最後走向死亡。 |

    | (D) | 主旨 | 表面上是寫因繩子引起的一則誤會，實則在訴說種族與謠言往往形成根深柢固的偏見，且偏見難以消弭，甚至殺人於無形。 |'
