- id: doc_111_桃園_同德_國文_g7s2e1_s4_28
  section: 4
  number: 28
  type: single
  page: 5
  stem: 根據本文，豬八戒為什麼要去尋菩薩？
  options:
  - label: A
    content: 準備與師兄等尋上紅孩兒，與他交戰
  - label: B
    content: 請菩薩出面，向紅孩兒道歉
  - label: C
    content: 請菩薩幫助悟空恢復行動
  - label: D
    content: 紅孩兒把師父攝了去，請菩薩救助
  group_stem: "(三)\n    那獃子正縱雲行處，忽然望見菩薩。他那裡識得真假？這才是見像作佛。獃子停雲下拜道：「菩薩，弟子豬悟能叩頭。」菩薩道：「你不保唐僧去取經，卻見我有何事？」八戒道：「弟子因與師父行至中途，遇著號山枯松澗火雲洞有個紅孩兒妖精，他把我師父攝了去。是弟子與師兄等尋上他門，與他交戰。他原來會放火，頭一陣，不曾得贏。第二陣，請龍王助雨，也不能滅火。師兄被他燒壞了，不能行動，著弟子來請菩薩。萬望垂慈，救我師父一難。」菩薩道：「那火雲洞洞主，不是個傷生的，一定是你們衝撞了他也。」八戒道：「我不曾衝撞他，是師兄悟空衝撞他的。他變作一個小孩兒，吊在樹上，試我師父。師父甚有善心，教我解下來，著師兄馱他一程。是師兄摜了他一摜，他就弄風兒，把師父攝去了。」菩薩道：「你起來，跟我進那洞裡見洞主，與你說個人情，你陪一個禮，把你師父討出來罷。」八戒道：「菩薩呀，若肯還我師父，就磕他一個頭也罷。」菩薩道：「你跟來。」那獃子不知好歹，就跟著他，徑回舊路，卻不向南洋海，隨赴火雲門，頃刻間到了門首。菩薩進去道：「你休疑忌。他是我的故人，你進來。」獃子只得舉步入門。\n\
    \                                                             ──節錄自 吳承恩《西遊記》第四十一回"
