  section: 3
  number: 7
  type: single
  page: 2
  stem: 下列成語之中，何者的「用字」完全正確？
  options:
  - label: A
    content: 毛利小五郎的推理能力，和柯南比較起來「相形見拙」，完全比不上他
  - label: B
    content: 胖虎對於登山非常有興趣，假日和朋友「翻山越嶺」，挑戰體能的極限
  - label: C
    content: 媽媽對於孩子的照顧「無微不致」，在下雨天的時候，願意平心靜氣幫孩子摺紙船
  - label: D
    content: 大雄做事認真，但是「人微言清」，他提出的意見並沒有受到重視
  tags:
