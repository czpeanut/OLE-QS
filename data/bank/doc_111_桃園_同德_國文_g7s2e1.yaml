    content: 「象形、指事、會意、形聲」是造字基本法則，「轉注、假借」是造字補充法則
  - label: B
    content: 「象形」、「指事」都是字形不能再加以分析的「獨體」，稱為「字」；「會意」、「形聲」都是字形可以分析的「合體」，稱為「文」。
  - label: C
    content: 中國文字中，以形聲字所佔比例最多。
