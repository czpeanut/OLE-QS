  stem: 「預測」指讀者閱讀時會根據文章線索及相關的背景知識去推測文章內容的發展，包括作者或主角的情感、想法和行動。請問以下四個讀者誰「並未」根據文章線索及背景知識進行合理預測？
  options:
  - label: A
    content: 毛利小五郎：作者莫泊桑是短篇小說巨匠，擅長從平凡事物中刻劃人情世態，從題目〈一根繩子〉可預測此篇應該是個由繩子引發而起且蘊含人性的故事。
  - label: B
    content: 工藤新一：瑪蘭丹老爹與主角有過爭執，加上主角撿繩子時的鬼祟行為，可預測主角接下來會受到瑪蘭丹先生的不實指控。
  - label: C
    content: 小蘭：主角科爾是個老實勤懇的農民，雖然自己村裡的人願意信任他，但他無法承受哥第維爾人投來的懷疑眼光，可預測最後他會抑鬱而死。
  - label: D
    content: 柯南：作者不斷強調主角殘弱的身體，如「彎著風濕病痛的身體」、「腰比早上彎得厲害」、「邁頭幾步特別困難」，可預測一根繩子事件應該會是壓垮主角身體的最後一根稻草。
  group_stem: "〈一根繩子〉   莫泊桑\n\n  布萊奧第村的歐斯科爾剛剛來到哥第維爾，正向廣場哪裡走去，忽然發現路上有一截短短的繩子。這個道道地地的諾曼第人節儉成性，他認為凡是有用的東西都必須撿起來。他有風濕病，費盡力氣，好不容易才把腰彎了下去。當他從地上撿起那截細繩子，正要仔細捲纏起來時，發現馬具店的瑪蘭丹老爹站在門口，目不轉睛的看著這邊。這兩個人前陣子曾經為了馬龍頭起過爭端，彼此記恨在心，現在成了見面就要眼紅的仇敵。\n\
    \n  歐斯科爾老爹覺得在爛泥地上撿一截繩子，偏偏被仇敵看到了，簡直丟臉到了極點。於是他連忙把撿到的東西藏在工作服下，立刻又塞到褲子的口袋裡。然後又裝出好像在找什麼東西似的，在地上看來看去，過後就腦袋衝向前方，彎著風濕病痛的身體，往市場裡的客棧走去。\n\
    \n  客棧裡的每個人都在談自己的工作、賣的東西和買的東西，地裡的收穫也是主要的話題。忽然，前院裡的大鼓敲響了，除了兩、三個遲鈍的傢伙之外，所有的客人立刻都站了起來，嘴裡塞滿了食物，手裡抓著餐巾，向門口和窗口跑去。\n\
    \  敲鼓的人停住了手，就斷斷續續地宣讀起不成文句的共告：「茲通知哥第維爾的父老兄弟，以及所有今天前來趕集的人。今天早上，九點到十點之間，有人在布茲維爾的街上掉了一個裝有五百法朗和證件的黑色皮包。請立刻到鎮公所，或者轉交給維爾布雷格先生，他將當面致謝二十法郎。」\n\
    \n  說完後，每個人都開始議論紛紛了起來，大家都在猜測維爾布雷格老爹是否能找到錢包。\n  午餐吃完了。大家正喝最後一口咖啡，門前出現了憲兵班長。\n \
    \ 他問道：「布萊奧第的歐斯科爾先生在這裡嗎？」\n  坐在桌子那一頭的歐斯科爾先生應道：「我在這裡。」\n  憲兵繼續說道說：「歐斯柯爾先生，請您跟我到鎮政府去一趟，鎮長有話要跟您談談。」\n\
    \n  這個鄉下人感到驚訝和不安，一口喝完了他那一小杯酒，站起身來，腰比早上彎得厲害，因為每次休息以後，邁頭幾步特別困難。他一邊走，一邊重複說道：「我在這裡，我在這裡。」\n\
    \  他跟在憲兵後面走了。鎮長坐在靠背椅裡等他，他是這地區的公證人，一臉正經卻很矯揉做作，身體肥胖。\n  「歐斯柯爾老爹，有人看見你今天早晨在布茲維爾的大路上，撿到維爾布雷格先生遺失的皮夾。」\n\
    \  老爹大吃一驚，目不轉睛地看著鎮長，他似乎被這個莫名其妙的嫌疑嚇住了。\n\n  「我，我撿到了這個皮夾？」\n  「是的，就是你。」\n  「我可以用我的腦袋打賭，那東西我看都沒有看過。」\n\
    \  「有人看到了。」\n  「有人看到了？到底是誰？」\n  「賣馬具的瑪蘭丹先生。」\n  老人聽了，心想果然不錯，氣得滿臉通紅。\n  「原來是那傢伙看到的……鎮長先生，那傢伙看到的是這個，這截繩子。」\n\
    \  說著，他掏著口袋，把那截繩子拿出來。\n\n  但是鎮長搖搖頭，不予置信。\n\n  「歐斯科爾老爹，這很難叫人相信。瑪蘭丹先生是個很可靠有信用的人，他不會把這樣的繩子看成錢包的。」\n\
    \  這個農民氣極了，舉起了手，向旁邊吐了一口唾沫，表示以他的人格起誓，他又說了一遍：「這可是千真萬確，鎮長先生，一點不假呀。我可以拿我的靈魂和我的下輩子起誓，要我說幾遍也可以。」\n\
    \n  鎮長又說道：「在撿起以後，你甚至還在爛泥裡尋找了好久，看看還有沒有掉出來的錢。」\n  這個老頭又是生氣又是害怕，氣都快喘不過來了。\n  「竟然敢這麼說！……竟然敢那樣……冤枉好人，竟然那樣撒謊！竟然敢這麼說……」再怎麼說也也沒有用，對方根本不聽他的。\n\
    \n  於是把瑪蘭丹老爹叫來對質，瑪蘭丹老爹依然再一次堅持剛才所說過的證詞。兩個人對罵了有一個鐘頭。歐斯科爾老爹為了證明自己的清白，要求搜查自己的身體，搜了一遍，什麼也沒有搜出來。\n\
    \  鎮長也沒有辦法，說這案子要報告檢察院，聽候指示，就讓老人走了。\n\n消息早就傳開了。老人一走出鎮公所，那些看熱鬧的人立刻包圍了他，有的人好奇地問他，也有人半帶嘲弄地對他問長問短，但是沒有一個人替他抱不平。他把繩子的故事講了一遍。誰也不信，大家只是覺得好笑而已。\n\
    \  第二天下午一點鐘左右，在農民布爾登先生家打雜的波梅爾把那個錢包送還給維爾布雷格先生手中，錢包裡的東西一個也沒有少。\n\n  據這個長工說，他確實是在大路上撿到的，因為不識字，他就帶回去交給了主人。\n\
    \  這個消息在附近一帶傳開了，歐斯科爾老爹也聽到了，立刻在村子四處打轉，又說起了這個有偉大結局的故事。他非常得意。\n\n   「使我難過的，倒不是事情的來龍去脈。明白嗎？最叫人痛心的受到謊言的汙衊，再也沒有比謊言更害人的了。」\n\
    \  這一整天，他都談論他這件意外遭遇，他在大路上講給來往的行人聽，他在酒館裡講給喝酒的人聽；到了星期日，他還到教堂出口不厭其煩地說著。最後連不認識的人他也不放過，說個沒完。這樣一來，他總算放下心了。但是不知道為什麼，有什麼地方讓他覺得很彆扭。每個人在聽他說的時候，好像覺得很好玩，看起來似乎不相信他所說的話。他覺得背後好像總有人在對他指指點點。\n\
    \n  下個禮拜二，他對一個農園主人說了起來，可是這個人不等他說完，就在他的心口打了一拳，對著他的臉吼了一句：「這個老狐狸！」就頭也不回地走了。\n  歐斯科爾老爹嚇呆了，隨後愈來愈不安。別人為什麼說他是「老狐狸」呢？後來他總算弄明白了，原來大家在說他指使同謀共犯把錢包送回去。\n\
    \n  他又氣又急，又羞又惱地回到了家裡。使他特別感到苦惱的是，他具有諾曼第人的血統，諾曼第人一向狡猾，人家指責他的事，諾曼第人是做得出來的，諾曼第人的狡猾又人盡皆知，他已經無法洗清這個不白之冤。但是受到這莫須有的嫌疑，使他有如胸口被刺了一刀般地難受。\n\
    \n  老人依然繼續訴說他的災難。故事一天比一天長，每次都加進去新的理由、更激烈的抗議和更莊嚴的宣誓，這些都是他一個人的時候想出來準備好的。他的心裡只有繩子這件事情，他的辯解愈是複雜，理由愈是巧妙，別人就愈是不相信他。\n\
    \  「那些都是捏造出來的理由。」大家在背後這樣說。\n  老人也知道這個，他心裡受煎熬，依然在做徒勞無功的努力。\n\n  老人明顯的瘦削憔悴了。\n\n\
    \  這樣一來，愛惡作劇的人就半帶好玩地逗他說出「繩子」的故事，就像要求出征的軍人說戰爭的故事一樣。他的精神受到徹底的打擊，整個垮了。\n\n  十二月底，他病倒在床上。\n\
    \  他死在正月初，臨終的時候，他依然一再為自己的不白之冤辯白。\n\n  「是一截繩子……只是一截繩子……你看，就是這個，鎮長先生。」\n\n     \
    \                           節選自莫泊桑〈一根繩子〉"
