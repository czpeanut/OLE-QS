  section: 3
  number: 6
  type: single
  page: 2
  stem: 下列常見的成語，請找出使用「不正確」的用法：
  options:
  - label: A
    content: 別笑我「敝帚自珍」，這本論文是我畢生的心血
  - label: B
    content: 團隊之中，各人有自己的職責，分工明確，要善盡自己的責任，處理好自己的事情，這樣的行為可以稱為「越俎代庖」
  - label: C
    content: 土耳其的地震過後，當地許多地區「滿目瘡痍」，需要重建，也需要各國的經濟援助
  - label: D
    content: 為了研究動物的生態，他長年累月「櫛風沐雨」在熱帶雨林地區工作
  tags:
