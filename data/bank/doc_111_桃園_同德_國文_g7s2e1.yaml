- id: doc_111_桃園_同德_國文_g7s2e1_s3_1
  section: 3
  number: 1
  type: single
  page: 1
  stem: 受到外來文化的影響，日常用語中，經常出現許多「外來語」，請問：下列選項何者沒有使用「外來語」?
  options:
  - label: A
    content: 大多數人不喜歡說話「膨風」的人，因為腳踏實地最重要
  - label: B
    content: 最近鐵路局販賣懷舊臺鐵「便當」，引發消費者搶購熱潮
  - label: C
    content: 遇到緊急情況或是重要物品遺失，可以到「派出所」請求協助
  - label: D
    content: 手中拿著相機，小明能夠捕捉到「剎那」的美景，我們可以稱呼小明是一位攝影大師
  tags:
    textbook: 第二冊（七下）第1次段考範圍
    labeled_by: ai
    chapter:
      publisher: null
      book: 七下
      subject: 國文
      code: null
      title: null
      chapter: null
- id: doc_111_桃園_同德_國文_g7s2e1_s3_2
  section: 3
  number: 2
  type: single
  page: 1
  stem: 下列成語的運用，何者的用法「不正確」：
  options:
  - label: A
    content: 張璨豪在偏鄉從事教育工作廿年，培育出許多優秀的學生：「春風化雨」
  - label: B
    content: 爺爺和奶奶結婚五十年，相互扶持，走過風雨，令人稱羨：「鶼鰈情深」
  - label: C
    content: 宬浩和俊豪從國小到高中都是同班同學，感情像是兄弟姊妹：「手足情深」
  - label: D
    content: 王先生對於子女的教育非常重視，而且無微不至的照顧他們：「舐犢情深」
  tags:
    textbook: 第二冊（七下）第1次段考範圍
    labeled_by: ai
    chapter:
      publisher: null
      book: 七下
      subject: 國文
      code: null
      title: null
      chapter: null
- id: doc_111_桃園_同德_國文_g7s2e1_s3_3
  section: 3
  number: 3
  type: single
  page: 1
  stem: 下列「效應」是用來說明「某種現象」，請找出使用「不正確」的用法：
  options:
  - label: A
    content: 春節期間停收垃圾，有人將垃圾放在電線桿旁邊，其他人也這樣做，造成垃圾堆積，環境髒亂：「蝴蝶效應」
  - label: B
    content: 年輕人模仿明星的打扮，花錢購買明星代言產品，卻未曾思考是否適合自己的風格，反而失去自我：「羊群效應」
  - label: C
    content: '有人在網路散布不實謠言，造成在南部有多家加盟店的食品公司名譽受損，食品公司準備要提出告訴，嚇得網友立即

      刪除留言，其他人也不敢發表意見：「寒蟬效應」'
  - label: D
    content: '小華身為公司的領導人物，卻安於現狀，沒有跟著大環境而改變，只是隨波逐流，不思進取，導致公司的競爭力逐漸

      下滑，也造成公司的總體營收大為減少：「煮蛙效應」'
  tags:
    textbook: 第二冊（七下）第1次段考範圍
    labeled_by: ai
    chapter:
      publisher: null
      book: 七下
      subject: 國文
      code: null
      title: null
      chapter: null
- id: doc_111_桃園_同德_國文_g7s2e1_s3_4
  section: 3
  number: 4
  type: single
  page: 1
  stem: '下列詩句，按「甲乙丙丁」排序，分別是描寫什麼季節？

    甲、接天蓮葉無窮碧，映日荷花別樣紅      乙、月落烏啼霜滿天，江楓漁火對愁眠

    丙、沾衣欲溼杏花雨，吹面不寒楊柳風      丁、一年好景君須記，最是橙黃橘綠時'
  options:
  - label: A
    content: 夏春冬秋
  - label: B
    content: 春夏秋冬
  - label: C
    content: 秋夏春冬
  - label: D
    content: 夏秋春冬
