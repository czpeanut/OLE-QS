- id: doc_111_桃園_同德_國文_g7s2e1_s4_29
  section: 4
  number: 29
  type: single
  page: 5
  stem: 關於「蘭芷蓀蕙之芳，眾之所共好，而海畔有逐臭之夫。」這段話是說：「像蘭、芷、蓀、蕙這些香草的芬芳迷人，都是眾人喜歡聞的，但是在海邊卻也有喜歡追著臭味跑的人。」請問：這段話的意義與下列何者
    「不相同」？
  options:
  - label: A
    content: 泰山不讓土壤，故能成其大；海水不擇細流，故能就其深
  - label: B
    content: 每個人的觀點不同，有的人欣賞悠揚的古典音樂，有的人卻認為搖滾樂才是真正的音樂
  - label: C
    content: 如果他能從這扇門望見日出的美景，你又何必要求他走向那扇窗去聆聽鳥鳴呢？
  - label: D
    content: 情人眼裡出西施，人各有所好，每個人的審美觀不盡相同
  group_stem: "(四)\n    巷口的小小夜市，有個賣臭豆腐的老人。入夜之後，他總把那輛手推車停靠在固定的位置上，然後，就著昏黃的風燈，一言不發地開始油炸起臭豆腐來。\n\
    \    幾隻陳舊的塑膠扁碟，十來雙長短不齊的竹筷，三兩把簡陋長條木凳，還有一箱白裡泛青的方形臭豆腐，這便是老人招攬顧客的所有裝備了。\n    他們對於老人親手調理的臭豆腐，似乎讚賞不已往往愛不忍釋地叫了一碟又一碟。但也有附近攤子上的食客，對於隨風飄至的濃烈氣味，掩鼻皺眉，微微露出奇臭難當的抗議表情；並且以一種不能置信的驚異，目睹吃臭豆腐的人大快朵頤。\n\
    \    對於這一切，老人都保持沉默的態度。他從不說什麼，只在盛滿沸油的黑鍋左側，豎起一個牌子，以還算蒼勁的書法，在上面寫著「不食臭豆腐，怎知豆腐臭」幾個大字。\n\
    \    隨著老人油鍋裡，臭豆腐的由白變黃、由扁平而逐漸鼓脹，我的思緒也常隨之飛揚起來；不知為什麼，我總聯想起一種叫榴槤的南洋水果來。據說，厭惡榴槤氣味的人，對於這種水果避之唯恐不及，而喜歡榴槤的人，卻往往嗜之如命，非一口氣連吃幾個不過癮。想來人和人之間的差異，有時畢竟還是很大的。\n\
    \    曹植在〈與楊德祖書〉中曾說：「蘭芷蓀蕙之芳，眾之所共好，而海畔有逐臭之夫。」也許，對許多還未曾實際接觸、深入其中的事物，我們都曾犯過主觀的毛病；而就在這些不成熟的偏見和自以為是的想像中，更可愛的人生、更美好的體驗都被我們一一錯過了。對於我們無法想像或不能接受的事物，只要無傷大雅，也許我們可以新鮮有趣的眼光去看它們，而不必敏感地排斥或責難。其實，也正因為有各式各樣不同的人和物存在，所以才成就了這個世界的豐富性。\n\
    \    不食臭豆腐，怎知豆腐臭？那樣溫和而無言的答辯，或許，就是老人的哲學吧！\n                                   \
    \                          ──節選、整理自 陳幸蕙《把愛還諸天地》"
