  group_stem: "(二)\n    有避仇竄匿深山者，時月白風清，見一鬼徙倚白楊下，伏不敢起。鬼忽見之，曰：「君何不出？」慄而答曰： 「吾畏君。」鬼曰：「至可畏者，莫若人，鬼何畏焉？使君顛沛至此者，人耶？鬼耶？」一笑而隱。\n\
    \                                                                  ──節錄自 紀曉嵐《閱微草堂筆記》"
