- id: doc_111_桃園_同德_國文_g7s2e1_s4_31
  section: 4
  number: 31
  type: single
  page: 6
  stem: 文章中提到「停止懷疑自己」是歐巴馬總統希望女兒在遇到問題時，能以何種態度面對?
  options:
  - label: A
    content: 積極樂觀
  - label: B
    content: 敷衍塞責
  - label: C
    content: 坐懷不亂
  - label: D
    content: 步步為營
  group_stem: "(五)\n    生命如此短暫。我們有時候覺得生命怎麼也走不完，實際上，你現在活著，過不了多久，就會死去。人生真是轉眼一瞬間的事情，很多人到臨死前才意識到這一生已經結束。\n\
    \n停止懷疑自己   如果你自己都不相信自己，那沒人會相信你。成功源於你的頭腦，如果你所做的是不斷地看扁自己，預言著未來的失敗，這就真的會成為現實。與其懷疑自己，不如積極的考慮問題。不僅會讓自己更加開心和成功，你還能夠感染到周圍的人。\n\
    \n停止拖延   我現在不想做，還是留到明天吧。一旦開始拖延，其實你已經停滯不前了。你拖延的事情不會自行解決。解決問題，繼續前行吧。從長遠角度來說你會更加快樂。\n\
    \n不要那麼刻薄   無意踩到別人的情況真的有可能會發生---常常會發生。但沒必要去處心積慮地做一些不好的事情，所以要有意識地讓自己不要那麼刻薄。如果有人對你無理地對待，隨他們去好了。沒必要去報復，除非你也想成為那一類的人。\n\
    \n別再那麼自私   如果你只考慮你自己，那麼很快你會發現身邊只剩下你自己。停一分鐘想想你的行為會給別人帶來什麼影響吧---你是不是從休息室拿了最後一杯咖啡？再倒滿呀!你是不是和別人合租？不要喝光所有的牛奶，這個世界是一個完全由大家分享的世界，你所做的每件事都會影響到別人。\n\
    \n別再浪費時間   雖然之前說過了，但我還想再說一遍：時間是我們擁有的最寶貴的資源。不要把時間浪費在沒有意義的事情上面。\n\n別把每件事太往心裡去  人們會因為一些奇怪的事情感到被侵犯。就拿\
    \ Kendrick Lamar 這個夏天備受爭議的歌曲《Control》為例：他在歌詞中挑釁了一些他認為比他弱的說唱歌手(的確是這樣)，一石激起千層浪，整個說唱界的歌手都蜂擁錄歌作為回擊。重點在於，所有的人都認為自己是最好的說唱者，每個人都更看重自己，這就是他的目的所在。這件事教給我們的無非就是不是所有的事都要圍著你轉，如果你是玻璃心，有人會利用這一點。\n\
    \n不要再說話了  有時候沉默是金。我都記不清到底多少次因為說錯話而引發了本可以避免的爭端。即使你想說的非常重要，那也閉嘴，自行消化。你可以用行動證明一切，畢竟你自己說話的時候是聽不見的。\n\
    \n停一下，深呼吸吧   無論你現在在幹什麼，這一天過得怎麼樣，你都需要好好停一下深呼吸。不如現在就歇一歇，犒賞自己總算挺過了一些錯事。\n\n    雖然這些事要全部做到很難，但至少應該為更優秀的自己努力一把。\n\
    \                                                          ──節錄自〈歐巴馬總統寫給女兒的一封信〉"
