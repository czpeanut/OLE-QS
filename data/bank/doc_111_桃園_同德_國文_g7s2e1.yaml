  stem: 以下四人對於閱讀策略的詮釋何者「錯誤」？
  options:
  - label: A
    content: 黑桃Ａ：閱讀時要「知所目標」，要根據閱讀目標進行有意識的閱讀，不能漫無目的。
  - label: B
    content: 紅心Ａ：閱讀時要「知所限制」，如知道時間的限制進行閱讀策略的靈活轉換。
