  section: 1
  number: 1
  type: single
  page: 1
  stem: 《天方夜譚》一書以巴格達為背景，反映中古時期阿拉伯地區繁榮的城市風貌，以及興盛的商業貿易。巴格達位於廣大的平原上，且有大河流經，因此取水便利，農業發達，人口聚集。根據上文中的訊息判斷，巴格達應位於地圖(一)哪一個地區？
