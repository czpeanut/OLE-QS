  stem: '資料一：□基地建在中國東北哈爾濱附近的平房區，他們在活體試驗者身上研究淋巴腺鼠疫、霍亂、炭疽病、傷寒、肺結核。他們研究生物武器在戰場上的使用，特別是在傳播細菌和寄生蟲的設備研究方面並生產各種生物戰劑。

