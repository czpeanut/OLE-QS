  stem: 民國32 年1 月，中國與美國在美國首府華盛頓簽訂一項條約，規定「美利堅合眾國人民，在中華民國領土內，應依照國際公法之原則及國際慣例，受中華民國政府之管轄。」請問：民國三十二年中、美兩國訂立這項條約的背景為何？
