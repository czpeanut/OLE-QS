- id: doc_113_高雄_龍華_社會_g8s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 伊斯蘭教於七世紀由穆罕默德創立，之後透過征戰和貿易等方式向外擴張，逐漸成為世界第二大宗教；由於宗教教義的規範，有些地區因此生活方式和社會規範近似，進而形成所謂的伊斯蘭世界。以下關於伊斯蘭教的敘述，何者正確？
  options:
  - label: A
    content: 最早發源自兩河流域
  - label: B
    content: 在北非及中亞皆有廣大的信徒
  - label: C
    content: 日常生活皆以聖經教義為依歸
  - label: D
    content: 經文須用拉丁文念誦才有意義。
- id: doc_113_高雄_龍華_社會_g8s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 西亞與北非受氣候限制，需使用灌溉方式發展農業，某地利用鑿井技術抽取地下水層，並使用軸心噴灌系統灌溉，請問這種灌溉方式出現在地圖(三)中的何處？
  options:
  - label: A
    content: A
  - label: B
    content: B
  - label: C
    content: D
  - label: D
    content: E。
