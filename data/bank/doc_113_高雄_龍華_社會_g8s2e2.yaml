- id: doc_113_高雄_龍華_社會_g8s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 請問文章中所提及的       海是下列哪一個海域？
  options:
  - label: A
    content: 黑海
  - label: B
    content: 裏海
  - label: C
    content: 紅海
  - label: D
    content: 阿拉伯海。
  group_stem: '◎「蘇伊士運河作為全球貿易的關鍵樞紐，每年處理約12%至15%的國際貿易量，尤其是連接歐亞航程的重要一環，因此，任何對該運河的封鎖或中斷，對全球供應鏈都會造成嚴重影響。隨著葉門叛軍在      海持續發動襲擊，讓西方國家的船隻難以靠近      海南部海域和亞丁灣，也因此無法使用連接地中海與      海的蘇伊士運河。蘇伊士運河作為東西貿易的重要航道，附近海域受到攻擊影響後迫使船隻避開該區域，改為繞行非洲南端的好望角，導致運輸成本和時間增加。這些變動導致蘇伊士運河營收急劇下降，對某國家造成了沉重打擊，該國家經濟高度依賴蘇伊士運河，船隻無法經過已經讓該國貨幣在過去一個月跌至歷史新低。」，請根據上文回答第8~9
    題:'
