  group_stem: '◎「2023 年2 月6 日，        南部接近敘利亞邊境發生芮氏規模7.8 的強烈地震，這次地震的震源位於安那托利亞板塊、阿拉伯板塊和非洲板塊這三塊板塊的交匯處附近，是近百年來襲擊這個國家的最強震。因地震發生時間為當地清晨4
    點，大部分民眾在睡夢中來不及逃生遭掩埋，多數房屋全倒或半倒，人們則是無家可歸或不敢回家，然而當時氣溫接近零度，大家只能冒著雨雪露宿街頭。地震災區在過去近12
    年間，已接納大量敘利亞難民及境內流離失所者。由於曠日持久的戰爭，光是敘利亞就有約4 百多萬人依靠人道救援維生，其中大多數是容易遭受傷害的婦女與兒童。地震對這些婦孺造成第一波傷害後，後續要如何在殘破、冰冷的災區維生是更大的挑戰。」。請根據上文回答下列第15~17
