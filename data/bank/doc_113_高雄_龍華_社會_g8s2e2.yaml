- id: doc_113_高雄_龍華_社會_g8s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 近年來西亞由於石油開採而快速累積財富，使得西亞地區的經濟和社會發生許多改變，請問石油為西亞地區帶來哪些影響？
  options:
  - label: A
    content: 因石油致富而成為大量人口移出區
  - label: B
    content: 不產油國家因無法從中獲利而貧困
  - label: C
    content: 波斯灣戰爭是為了石油利益而爆發
  - label: D
    content: 高度依賴石油而限制工商業的發展。
- id: doc_113_高雄_龍華_社會_g8s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 地圖(六)是風塔的結構概念圖，風塔屋頂四面鏤空，可將屋頂的涼風引進塔內，當氣流往下，一路導引到地下室，它下方有一座小水池，接觸屋內的水池，就會產生降溫效果，結合熱對流原理和活水利用，風塔內部形成一個天然空調系統。此種建築屬於為西亞、北非地區的特色建築，請問此種建築所在地區的人文景觀有何特色？
  options:
  - label: A
    content: 窗戶開大以利採光
  - label: B
    content: 房屋屋頂平坦
  - label: C
    content: 盛產椰子和葡萄
  - label: D
    content: 以短袖涼爽服飾為主。
