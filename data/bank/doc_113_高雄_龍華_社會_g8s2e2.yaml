  type: single
  page: 2
  stem: 西亞地區由於族群和宗教的差異，造成該地紛爭衝突不斷。在阿拉伯人為主的西亞地區，有的族群成功建立國家但自此紛爭不斷，也有的族群為了爭取獨立而不斷受到殘酷打壓。以下哪一個族群的主要分布不在西亞?
