- id: doc_113_高雄_龍華_社會_g8s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 西亞與北非地區沙漠廣布，為了適應當地的氣候，人民過去多以游牧為主，農業需要灌溉，而傳統的交通方式也多仰賴駱駝。請問造成西亞與北非地區乾燥少雨的主要原因為何？
  options:
  - label: A
    content: 沿海有涼流經過
  - label: B
    content: 四周有高山阻擋
  - label: C
    content: 副熱帶高氣壓籠罩
  - label: D
    content: 位居內陸，距海遙遠。
- id: doc_113_高雄_龍華_社會_g8s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 滴灌技術是乾燥地區為了不浪費水資源，以精確給水設施來發展農業，是以色列重要的農業系統。此技術目前已被證實是十分有效的節水灌溉技術，可比一般灌溉方式省下50-85%的用水量，還可以有效避免乾燥地區土壤鹽鹼化的問題。請問此種灌溉方式分布在地圖(四)中的哪一個地區?
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
