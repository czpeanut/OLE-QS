  section: 1
  number: 34
  type: single
  page: 4
  stem: '宣蔚整理了三份中華民國國家建設的資料，請幫他依照軍政、訓政、憲政的順序排列。

    甲、胡適對當時的局勢提出質疑說:「我們不信無憲法可以訓政；無憲法的訓政只是專政。我們深信只有實施憲政的政府才配訓政。」

