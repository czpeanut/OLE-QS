- id: doc_113_高雄_龍華_社會_g8s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 隨著人口及產業的快速成長，許多國家致力於水資源的開發，但是在開發的過程中，若是所開發的水資源是來自流經多國的河川，往往造成國際糾紛。以下哪些國家或地區因為位於河川上下游的關係可能面臨此類的矛盾？
  options:
  - label: A
    content: 中國橫斷山脈及中南半島
  - label: B
    content: 土耳其及伊朗
  - label: C
    content: 衣索比亞及利比亞
  - label: D
    content: 以色列及伊拉克。
- id: doc_113_高雄_龍華_社會_g8s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 坎井可說是一古老工程奇觀，利用坎井在乾燥惡劣的環境中找到純淨水並創造出良田綠洲，它的構造原理是一條地下水道，將高處山地水源引向海拔較低處，用來灌溉農田，由豎井、暗渠、明渠和蓄水池等部分所組成如地圖(二)。若想要看到此種灌溉方式，可以在以下哪些地方尋見？    (甲)伊朗高原    (乙)安納托力亞高原   (丙)阿富汗高原    (丁)高加索山  (戊)亞特拉斯山
  options:
  - label: A
    content: 甲丁
  - label: B
    content: 乙戊
  - label: C
    content: 丙丁
  - label: D
    content: 甲戊。
