  type: single
  page: 5
  stem: Why did the newspapers in the past report more trustful news compared to many
    modern online sources?
  options:
  - label: A
    content: They only reported local news stories.
  - label: B
    content: They didn’t have to write interesting stories to get readers’ attention.
  - label: C
    content: They paid experienced journalists and cared about their reputation.
  - label: D
    content: They were on tight budget and could only focus on accurate reporting.
  group_stem: "A long time ago, getting news was simple. People bought newspapers\
    \ to find out what was happening in the world. There weren’t many choices—maybe\
    \ two or three newspapers to pick from. These newspapers paid professional journalists\
    \ to go out, find stories, and write the truth. If they wrote lies, they could\
    \ lose their jobs.\n     Now the Internet has changed everything. There are thousands\
    \ of news websites, social media posts, and videos. Many of them are free, which\
    \ might seem great. Because they are free, many websites can’t afford to pay real\
    \ journalists. So, how do they get their news? Some take information from newspapers\
    \ or other websites without checking if it’s true. Others simply make up stories\
    \ to get more clicks and attention.\n     This has created a problem called “fake\
    \ news.” Fake news means stories that are not true. Sometimes people write fake\
