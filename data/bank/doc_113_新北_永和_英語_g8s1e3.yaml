  stem: Why did Jack decide to talk to the woman in the garden?
  options:
  - label: A
    content: He wanted to make new friends.
  - label: B
    content: He needed directions to the bookstore.
  - label: C
    content: He was curious about her garden.
  - label: D
    content: He wanted to know about the bakery.
  group_stem: 'Jack’s Adventure to the Bookstore

    Jack and his family just moved to Sunnyville, a small town known for its friendly
    neighbors and charming streets. Jack loved drawing and painting, so he was eager
    to buy some new art supplies. However, he had no idea where the bookstore was.
    One sunny afternoon, Jack decided to explore the town. As he walked down the street,
    he saw a woman gardening outside her house. With his courage, he asked her for
    help.

    “Excuse me,” Jack said politely. “I’m new in town. Could you tell me where the
    bookstore is?” The woman smiled warmly. “Of course! The bookstore is called Sunnyville
    Reads, and it’s in the town square. Walk straight down this street for about two
    blocks, and then turn left. You’ll see the square ahead, and the bookstore is
    next to the bakery.” “Thank you so much!” Jack said, feeling a bit more confident.

    As he kept walking, Jack noticed a bus stop. A man in a blue jacket was sitting
    on the bench. Jack decided to ask if taking the bus might be a quicker way to
    get to the bookstore. “Excuse me, sir,” Jack said. “Do you know if the bus goes
    to the town square?” The man nodded. “Yes, it does. You can take the Number 3
    bus, and it’ll drop you off right at the square. The bookstore is just a short
    walk from the bus stop.” “Thanks! That’s really helpful,” Jack replied.

    Jack thought about his options. He could walk and enjoy the fresh air, or he could
    save time by taking the bus. He decided to take the bus, as he was excited to
    reach the bookstore quickly. When the bus arrived, Jack paid the fare and found
    a seat by the window. He watched as the town passed by. In just a few minutes,
    the bus stopped at the town square. Jack got off the bus and followed the woman’s
    earlier directions. Soon, he spotted the bakery with its delicious-looking pastries
    in the window, and right next to it was Sunnyville Reads.

    Inside the bookstore, Jack found a wide selection of art supplies. He picked up
    sketchpads, colored pencils, and a few paints.

    On his way home, Jack decided to walk, feeling grateful for the kind people who
    helped him. He couldn’t wait to get home and start creating with his new supplies.
    He already began feeling at home in this friendly town.

