- id: doc_113_新北_蘆洲_社會_g7s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 位在盆地內，是台灣的政治、經濟中心。目前全市總人口約246 萬人，是台灣重要的都會區域。由於地理位置優越，加上擁有完善的交通、資通訊、醫療、教育等軟硬基礎建設，吸引許多跨國企業、國際金融機構進駐在此，也是各國在台領事館、商務組織駐台所在地，輝達執行長黃仁勳在2025
    年5 月19 日宣布，輝達台灣總部將設在此區。上述地區為台灣哪個縣市？
  options:
  - label: A
    content: 台北市
  - label: B
    content: 新北市
  - label: C
    content: 台中市
  - label: D
    content: 台南市
