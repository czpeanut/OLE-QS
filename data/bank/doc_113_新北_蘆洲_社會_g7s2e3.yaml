  number: 16
  type: single
  page: 2
  stem: 傑瑞是彰化縣田尾鄉的蝴蝶蘭花農，他想將研發的新品種蘭花運往台灣各地有合作的花店販售，依據各項交通工具的特性，下列哪一項運輸工具最為適當？
  options:
  - label: A
    content: 高鐵
  - label: B
