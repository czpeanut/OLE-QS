- id: doc_113_新北_蘆洲_社會_g7s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 桃園市於2025 年1~3 月的遷入人口數達到8065 人，位居北部之冠 。因受惠於大眾運輸系統的發展以及相對可負擔的房價，成功吸引大量外縣市人口移入。而台北市的高房價形成強烈的「外推」效應，迫使許多市民選擇離開，2025
    年1~3月的平均房價高達每坪123.3 萬元，為北部都會區之首，淨遷出人口也達到20949 人，同樣是北部最高，不少台北人選擇遷居桃園市，每日通勤往返兩地。上述現象對於北部區域最可能造成何種影響？
  options:
  - label: A
    content: 台北市提供就業機會快速減少
  - label: B
    content: 桃園機場的國內航班班次數量增加
  - label: C
    content: 北部都會區範圍由台北市向外擴張
  - label: D
    content: 北宜高速公路的上下班車流量將大增
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 地理
      code: 5-3
      title: 都市化與都市擴張
      chapter: 第5章 聚落體系與都市發展
    textbook: 七下地理 5-3 都市化與都市擴張
    labeled_by: ai
- id: doc_113_新北_蘆洲_社會_g7s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 住在台灣某地的傑瑞，偶爾會看到直升機從醫院載運病患到其他大醫院就診的畫面。學校老師說，因為這裡面積小沒有大醫院，如果有重大傷病患者，在急迫性上不能靠船運，就需透過直升機載往可以處理的大醫院。造成上述地區出現此現象的原因最可能為下列何者？
  options:
  - label: A
    content: 北部都市人口過多，大型醫院量能不足
  - label: B
    content: 東部山脈阻隔，陸上交通往來方便性不足
  - label: C
    content: 南部重工業發達，土地利用壓縮到醫院建設
  - label: D
    content: 離島偏僻，人口少與經費有限，醫療資源缺
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 地理
      code: 5-2
      title: 交通與聚落發展
      chapter: 第5章 聚落體系與都市發展
    textbook: 七下地理 5-2 交通與聚落發展
    labeled_by: ai
