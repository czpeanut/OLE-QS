- id: doc_113_台中_居仁_自然_g7s2e3_s2_43
  section: 2
  number: 43
  type: single
  page: 5
  stem: 模里西斯島上的渡渡鳥滅絕的最直接原因是什麼？(5-2)
  options:
  - label: A
    content: 該島發生劇烈氣候變遷，導致渡渡鳥無法適應新環境
  - label: B
    content: 人類引入外來物種破壞渡渡鳥棲地，或與其競爭資源
  - label: C
    content: 渡渡鳥的飛行能力退化，所以難以藉飛行躲避天敵
  - label: D
    content: 大顱欖樹突然消失，導致其缺乏食物來源而大量死亡。
  group_stem: "【題組6】\n    15 世紀時，歐洲人相繼來到南印度洋的模里西斯島，將這座島作為航海的中繼站；他們引入的綿羊、猴與豬等動物，使當地的8種爬蟲類、19種鳥類先後滅絕，其中包含渡渡鳥(Raphus\
    \ cucullatus)這種鳥類（如圖）。\n    渡渡鳥是僅產於模里西斯島上一種不會飛的鳥，也是人類歷史上第一個被記錄下來，因為人類活動而滅絕的生物，該島上的大顱欖樹(Sideroxylon\
    \ grandiflorum)，也瀕臨滅絕。這可能是因渡渡鳥吃下其種子，消化、磨薄種子外的硬殼後，排出的大顱欖樹種子才能順利發芽生長之故；但近期的研究指出大顱欖樹的減少最可能還是與人類引入的物種有關。"
  shared_asset: g2_43_45
  tags:
    chapter:
      publisher: 南一
      book: 七下
      subject: 生物
      code: 5-1
      title: 人類與環境的關係
