    labeled_by: ai
- id: doc_113_台中_居仁_自然_g7s2e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 非洲的白蟻塚內有數以百萬計的白蟻，牠們在草原上收集乾草等植物碎屑，將這些碎屑攜入蟻塚儲存，這些碎屑可用來培養真菌類，真菌長出的菌絲是白蟻的食物，可用來養活整個家族。白蟻排泄的物質滲入地底後，又讓蟻塚周圍的植物長得更好，這些植物養活了更多草食性有蹄動物，而豐富的草食動物資源又供應獅子足夠食物，維持了獅子的族群量。假設現在有一種殺蟲劑，只會殺死白蟻，但對植物、其他動物都沒有任何影響，持續使用這種殺蟲劑，試推論對該地生態會造成何種影響？(4-2)
  options:
  - label: A
    content: 獅子的數量減少
  - label: B
    content: 植物的生長變快
  - label: C
    content: 草食動物數量增加
  - label: D
    content: 碎屑的分解速度變快。
  tags:
    chapter:
      publisher: 南一
      book: 七下
      subject: 生物
      code: 4-2
      title: 生物間的交互作用
      chapter: 第4章 生物與環境的交互作用
    textbook: 七下生物 4-2 生物間的交互作用
