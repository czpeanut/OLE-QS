  stem: '小明忘了將「石斑」根據「是否建議食用」的類型在名稱前做記號了。已知「石斑」的基本資訊如下：

    1.屬於食物鏈高層生物，成長較緩慢，族群數量較不易回復；

    2.若為養殖者，養殖餌料來自野外捕撈之小魚製作成的魚粉或人工餌料，較能減少對野生魚類的依賴，但仍需要適度管理。根據上述資訊及相關概念，針對此食物網「最合理」的敘述為何？(3-6、4-3、5-3)'
  options:
  - label: A
    content: 整體而言，七星鱸、烏賊與石斑在「是否建議食用類型」最可能做相同記號
  - label: B
    content: 在這個食物網中，體型最大及所含總能量最多的生物類別應為石斑
  - label: C
    content: 此食物網中七星鱸的食物來源比烏賊多樣，故七星鱸的數量必會比烏賊多
  - label: D
    content: 烏賊、透抽、櫻花蝦都有在水中可快速擺動的運動構造，屬於同一動物門。
