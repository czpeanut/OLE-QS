- id: doc_113_台中_居仁_自然_g7s2e3_s2_50
  section: 2
  number: 50
  type: single
  page: 6
  stem: 民國108 年行政院農業委員會（現稱農業部）修正保育類野生動物名錄，將原列為保育類的「白鼻心」這種哺乳動物改列為一般類野生動物，但依《野生動物保育法》規定，一般類野生動物非經主管機關同意仍不得任意捕捉、飼養。根據上述資訊及生物概念，推斷下列選項何者最不合理？(3-6、5-3)
  options:
  - label: A
    content: 《野生動物保育法》跟《森林法》、《文化資產保存法》一樣，都旨在管理、促進當地生態永續經營
  - label: B
    content: 白鼻心被改列為一般類野生動物可能與其族群數量、分布範圍增加，及對人類生活環境具適應力相關
  - label: C
    content: 假設你在臺中市內撿拾到白鼻心寶寶，在未經主管機關同意的情況下不能擅自將其作為寵物飼養
  - label: D
    content: 白鼻心是生活在陸域生態系的動物，分類上和生活在水域生態系的鯨魚、鴨嘴獸不屬於同類動物。
