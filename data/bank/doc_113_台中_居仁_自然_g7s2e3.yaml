- id: doc_113_台中_居仁_自然_g7s2e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 赤眼卵蜂會將卵產在秋行軍蟲的卵內，孵化後幼蜂在卵內取食，使秋行軍蟲的幼蟲無法孵化，進而減少其數量。花蓮農改場及文化大學森林暨自然保育學系教授謝佳宏團隊開發紙漿做的「蜂球」(內含赤眼卵蜂卵)及「GPS
    定位投放蜂球技術」，讓農民能透過遠端遙控無人機，快速投放蜂球於田間。請參考上述資訊判斷何者最不合理？(4-2)
  options:
  - label: A
    content: 赤眼卵蜂與秋行軍蟲間的互動關係，跟吸蟲與蝸牛間的互動情形相似
  - label: B
    content: 投放蜂球於田間的技術能保證完全不使用農藥，藥劑不殘留於作物上
  - label: C
    content: 赤眼卵蜂對非目標生物可能造成的影響，仍需要進一步進行研究與評估
  - label: D
    content: 在水缸中養殖會捕食孑孓的蓋斑鬥魚，也是一種生物防治技術的應用。
  tags:
    chapter:
      publisher: 南一
      book: 七下
      subject: 生物
      code: 4-2
      title: 生物間的交互作用
      chapter: 第4章 生物與環境的交互作用
