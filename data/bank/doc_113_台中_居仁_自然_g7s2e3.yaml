- id: doc_113_台中_居仁_自然_g7s2e3_s2_49
  section: 2
  number: 49
  type: single
  page: 6
  stem: 根據文章及圖表資訊，請判斷下列選項何者錯誤？(5-2、5-3)
  options:
  - label: A
    content: 臺灣本島的各縣市都有白鼻心分布
  - label: B
    content: 白鼻心死因首位跟棲地破碎化有關
  - label: C
    content: 臺中市都會區有觀察到白鼻心記錄
  - label: D
    content: 一般大眾都可以協助提供路殺資料。
  group_stem: "【題組8】\n    由科學家跟業餘愛好者共同合作完成的科學研究，稱為「公民科學」，通常是科學家規劃研究目標、調查方法，業餘愛好者（一般民眾）收集資料，全球在天文學、大氣科學、生態學都有相關的網頁計畫，臺灣亦然。農業部生物多樣性研究所維護之「臺灣動物路死觀察網（路殺社）」的目標，在於關注臺灣野生動物在道路上被交通工具撞擊致死的狀況，並希望透過適當的保育措施跟設備減少交通對動物造成的威脅。\n\
    \  右圖是臺灣「白鼻心」(Paguma larvata taivana)這種動物在「路殺社」的空間分布紀錄，臺灣大學昆蟲系曾惠芸副教授與臺灣師範大學生命科學系教授林思民團隊2023\
    \ 年的研究發現遊蕩犬造成的「犬殺」在白鼻心死因排行首位，成年白鼻心因犬隻攻擊和行走道路上致車禍死亡的發生率，都是其他原因如陷阱、電擊的4 倍以上，且白鼻心在地面行動較緩慢，即使有醫療救助，犬殺和路殺後的死亡率仍為100%。不僅如此，白鼻心生活環境已離都市越來越近，根據臺中市野生動物保育協會連續10\
    \ 年的通報紀錄，2010 年起白鼻心在臺中都會區綠地出沒的比例大幅上升，以夏季為高峰；若以半徑1 公里為區域為白鼻心的1個巢位，至少有45 個巢位在周圍90%有建物的人口稠密區。"
