- id: doc_113_台中_居仁_自然_g7s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 「人工溼地」是一種應用於汙水處理的生態工法，會以人工開挖窪地，窪地內保持淺層積水，將汙水引入「人工溼地」內，當中的泥沙可以過濾雜質，水中微生物可以代謝汙染物，水生植物吸收水中的氮、磷，最後將淨化過的水經排水道排入水中（如右圖）。小明在《新北巿高灘地人工溼地經營管理與功能效益分析計畫》研究報告中，發現其中記載了新北市許多人工溼地內各種生物的消長、水中有機物質含量、溶氧量與酸鹼值等數據，這份研究報告最可能屬於下列哪一層次的研究呢？(4-1)
  options:
