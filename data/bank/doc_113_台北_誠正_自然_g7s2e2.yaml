- id: doc_113_台北_誠正_自然_g7s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 在學習「突變」的單元時，幾個同學在討論：「發生在體細胞的突變，是否有機會傳給子代？」下列哪個同學的說法較不正確？
  options:
  - label: A
    content: 緗雲：若變形蟲發生突變，當這隻變形蟲行分裂生殖時，就可能產生突變的子代
  - label: B
    content: 譿昀：若植物選擇突變的體細胞進行營養器官繁殖，也是有可能產生突變的子代
  - label: C
    content: 玫倩：若製造生殖細胞的體細胞突變，就可能藉由有性生殖將突變傳給子代
  - label: D
    content: 函婷：若馬鈴薯的根細胞發生突變，取它的塊莖繁殖長出的子代也會突變
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 生物
      code: 2-3
      title: 突變與遺傳疾病
      chapter: 第2章 遺傳
