  stem: What is the closest meaning to the word “diverse” in this reading?
  options:
  - label: A
    content: successful because of good playing
  - label: B
    content: different from each other
  - label: C
    content: famous for her movies
  - label: D
    content: wonderful because of the story
  group_stem: 'Reading 2 : A Bright Actress: Cate Blanchett


    An actress of many faces, Cate Blanchett has played diverse roles in her career.
    She’s been a queen, a teacher, a spy, and even a fairy. She brought life to every
    role she played.

    When Blanchett was six years old, she saw a magic show at a friend’s birthday
    party. She started to have a dream of being on the stage at that time. At the
    age of ten, however, she had a hard time when her father died of heart attack.
    She learned a lot from his father’s death. She said, “I know that life is very
    short.” Maybe losing her father when she was so young inspired Cate to live life
    to the fullest.

    At 18, she traveled the world and ended up in Cairo, Egypt. There, she played
    a small role in a movie. This experience wasn’t that good but made her study at
    an art school after she went back home. Just a few years later, she excited the
    world with the role, Queen Elizabeth in the 1998 film, Elizabeth.

    Her diverse acting gifts made her win two Oscars. In 2004, Blanchett won her first
    Oscar for her supporting role in the Aviator. In this movie, she played the famous
    actress Katherine Hepburn. Then, in 2013, she took home the Academy Awards for
    Best Actress for her role in Blue Jasmine. In this movie, we can see a very different
    side of Blanchett. She is a troubled woman, living a chaotic life.

    As Cate Blanchett keeps working in the arts, she is a portrait of acting success.
    Her talent and range let her take on complex and challenging roles, making her
    one of the most respected actresses in contemporary cinema.


    📖

    role 角色 career 職業 spy 間諜 fairy 小精靈 heart attack 心臟病 inspire 啟發 supporting role
    配角 the Aviator 神鬼玩家 chaotic 混亂的 portrait 肖像 complex 複雜的 respected 受人尊敬的 contemporary
    cinema 當代電影界'
  tags:
    textbook: 第五冊（九上）第1次段考範圍
    labeled_by: ai
