  group_stem: 'Reading 1: Birthday Cakes


    Enjoying cakes for someone’s birthday has become a common tradition among cultures
    all over the world. But where did the tradition come from? Why do people eat cakes?
    The answer may surprise you.

    Celebrations with cakes and candles started in ancient Greece. They held such
    celebrations to honor their moon goddess. Their cakes were round like the moon
    and decorated with candles. The candles made the cakes light like the moon. Soon,
    there were birthday cakes with candles for the common men. People had parties
    and burned candles on birthdays to protect against evil spirits.

    Birthday cakes took a long time to become popular. One reason for this is those
    cakes were expensive. Only rich people could afford this cost. In the nineteenth
    century, they became common because people could make them easier and cheaper.


    📖 tradition 傳統 culture 文化 ancient Greece 古希臘 honor 向…致敬 goddess 女神 protect against
    防範 evil spirits 邪靈'
