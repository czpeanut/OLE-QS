    上發佈付費網絡廣告「呼籲大家投給木村一票」。日本《公選法》規定可以在報紙、電視上打廣告，卻不可以在網路上打廣告，雖然這條法律有很大的爭議，有人認為在網路的時代已經不合時宜，但是法律畢竟是法律。東京地方檢察廳特搜部接獲檢舉後，開始對木村展開調查。迫於壓力，木村宣布辭職，她在辭職記者會上，哽咽地向江東區的區民道歉，說「自己因為沒有法律知識，做了對不起區民的事情」。沒多久又爆出建議木村在網路上打廣告的，是現任內閣法務副大臣的柿澤未途，柿澤副大臣召開記者會，承認有此事，同時也宣布辭去法務副大臣一職。根據上述案例，下列說明的相關概念，何者有誤？
