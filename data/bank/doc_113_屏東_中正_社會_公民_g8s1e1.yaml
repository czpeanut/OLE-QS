- id: doc_113_屏東_中正_社會_公民_g8s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '下表是至廷在網路上看到有關北韓的介紹。根據文中所述，下列何種說法最正確？

    朝鮮民主主義人民共和國（北韓）政治以中央集權政體為基礎運行。即便《朝鮮民主主義人民共和國社會主義憲法》明文保障人民的自由權利，但事實上政府嚴厲限制民眾的言論自由，並密切監控國民的生活。北韓憲法將朝鮮民主主義人民共和國定義為一「由朝鮮勞動黨完全領導的人民民主專政國家」，而該黨亦被憲法賦予唯一合法的領導地位。此外，雖然北韓憲法定有民主制度的保障規範，但在實際運作上，最高領導人（現為金正恩）握有對北韓政府與國家的絕對控制權，人民幾乎無法參與政治。'
  options:
  - label: A
    content: 北韓有《憲法》，可歸類為法治國家
  - label: B
    content: 北韓雖有《憲法》，但人民的權力無法受到保障
  - label: C
    content: 北韓有政黨，符合政黨政治的特徵
  - label: D
    content: 北韓有《憲法》，但統治者並未遵守，因此為人治國家
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 公民
      code: 3-1
      title: 人治與法治
      chapter: 第3章 法治與權力分立
    textbook: 八上公民 3-1 人治與法治
    labeled_by: ai
