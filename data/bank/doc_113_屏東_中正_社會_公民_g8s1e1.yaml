  - label: C
    content: 《道路交通管理處罰條例》
  - label: D
    content: 《原住民族教育法施行細則》
  group_stem: "朝野針對「18 歲公民權」紛紛喊出下修選舉權的主張，立法院於2020 年完成協商，共組「修憲委員會」；院會並於2022 年3 月25\
    \ 日通過18 歲公民權修憲案提案，此修憲案經過選舉人複決後，決定選舉權年齡維持20 歲。\n    我國最近一次修憲是2005 年，當時一舉提高修憲門檻。依據憲法增修條文的修憲流程，提出修憲案後的投票複決門檻，依照2020\
    \ 年臺灣有效選舉人數計算，至少要有965 萬人以上同意，修憲案才會通過。\n    過去，中國國民黨與民主進步黨兩黨都曾想推動修憲，但因為共識不足、議題敏感且門檻太高，導致修憲進度緩慢。比照前總統蔡英文2020\
