  group_stem: "智利是南美洲的國家，國土面積75.67 萬平方公里，南北距離4,300 多公里，是全世界國土最狹長的國家之一，有「絲帶國」的稱號。\n\
    \    2010 年，皮涅拉當選智利總統，2014 年任期屆滿後，依憲法規定不得連任。他於2017 年再次競選總統並順利當選，於2018 年就任，但在其第二任內，國內貧富不均，首都聖地牙哥生活費高昂，重挫人心，民眾呼籲政府進行稅制、勞動法規、退休金體制等改革。\n\
    \    2019 年初聖地牙哥地鐵漲價，引發民怨，當地學生在車站公然逃票，遭到警方強硬取締，因而引爆衝突與示威。這場由政府政策與社會問題引發的動亂，甚至出現大規模的反政府遊行，儘管總統為此開除多數重要官員，但仍難以撫平民怨。2021\
    \ 年11 月智利舉辦總統與國會大選，年僅35 歲的波里克勝出，形成政權轉移，他也是智利史上最年輕的總統。在勝選隔天，波里克和將卸任的總統皮涅拉會面，商討疫情等棘手問題，並承諾「我們以乾淨的雙手，一顆溫暖的心和冷靜的頭腦進入政界。」"
