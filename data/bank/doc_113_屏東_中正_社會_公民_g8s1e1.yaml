  section: 1
  number: 12
  type: single
  page: 2
  stem: '根據下列新聞延伸的法治社會概念，何者有誤？

    《國家公園法》於1972 年公布後，大部分條文都未修正，相關的保護措施落後時代太久，甚至罰款以現在來看根本是不痛不癢的程度！例如在國家公園亂丟垃圾還比不上在市區街道亂丟垃圾的罰款重，明顯出現法律輕重失衡的問題。為保護台灣重要生態系統、國家自然遺產及文化資產史蹟，彰顯國家公園保護的必要性，有立委提案修正《國家公園法》部分條文，在國家公園內任意拋棄果皮、採折花木、在樹木、岩石及標示牌加刻文字或圖形的罰則，從現行1000
    元以下罰鍰，提升至3000 元以上30 萬元以下罰鍰；如果在國家公園內獵捕、污染水質空氣，罰則提升為1000 元以上10 萬元以下罰鍰。'
  options:
  - label: A
    content: 法律讓政府執法有明確依據，也使人民可以預期法律的效果而約束自身行為
  - label: B
    content: 立法機關透過調高罰則來鞏固公權力，以維持社會運作
  - label: C
    content: 法律應與時俱進，隨社會變遷而改變以符合時宜
  - label: D
    content: 法律除了可維護社會秩序，也具備增進公共利益的功能
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 公民
      code: 3-1
      title: 人治與法治
      chapter: 第3章 法治與權力分立
    textbook: 八上公民 3-1 人治與法治
    labeled_by: ai
