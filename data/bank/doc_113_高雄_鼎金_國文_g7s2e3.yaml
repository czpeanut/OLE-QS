  type: single
  page: 3
  stem: 「有兩虎爭人而鬥者，管莊子將刺之。管與止之曰：『虎者，戾蟲；人者，甘餌也。今兩虎爭人而鬥，小者必死，大者必傷。子待傷虎而刺之，則是一舉而兼兩虎也。無刺一虎之勞，而有刺兩虎之名。』」根據本文，下列分析何者正確？
  options:
  - label: A
    content: 管莊子與管與即是文中的「兩虎」
  - label: B
    content: 管與認為管莊子應一次刺死兩虎，才是真正的立功
  - label: C
    content: 沽名釣譽的人，終究會被世人揭穿假面具
  - label: D
    content: 運用謀略的人不必費力，便可得到很大的收穫。
