  stem: '資料一

    「當平埔族被逐／當背後的番刀不見／你就悲壯地裹著一抹斜陽／任星移物換，隨其改朝換代／你便默默地站成一座墓碑」                                                                      （羊子喬
    飛番墓）

    資料二

    「平埔族群是分布在蘭陽平原、東北角、北海岸、臺北盆地、西部海岸平原到臺南、高雄、屏東一帶，南島語族的一支。由於地緣上濱海的因素，平埔族群與亞洲其他地區的南島語族，一直以舟船互有來往；卻也同樣因地緣關係，當臺灣浮現於世界歷史的舞臺後，不得不首當大量來臺之外來人群政治、經濟、語言、文化等力量的衝擊。因此，自十七世紀始，平埔族就面臨族群文化認同與抗爭、消失與保存的危機。」  （原住民族委員會網站）

    根據資料一、資料二，下列對資料一的詮釋何者正確？'
  options:
  - label: A
    content: 「當平埔族被逐」可見作者憂心平埔族從東北角遷離後無法適應生活
  - label: B
    content: 「當背後的番刀不見」可見作者認為平埔族積極漢化
  - label: C
    content: 「你就悲壯地裹著一抹斜陽」寫出平埔族曾經抗爭、奮戰的感嘆
  - label: D
    content: 「你便默默地站成一座墓碑」寫著平埔族在居住地留下石碑，作為紀念。
