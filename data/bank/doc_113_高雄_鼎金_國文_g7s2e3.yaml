- id: doc_113_高雄_鼎金_國文_g7s2e3_s4_29
  section: 4
  number: 29
  type: single
  page: 5
  stem: 根據本文，束氏養的狸牲為何會喪失捕鼠的本能？
  options:
  - label: A
    content: 覺得其他的肉比鼠肉美味
  - label: B
    content: 長期模仿人類的行為
  - label: C
    content: 過慣養尊處優的日子
  - label: D
    content: 把老鼠當成朋友。
  group_stem: "衛人束氏，舉世之物咸無所好，唯好畜狸狌（１）。狸狌，捕鼠獸也。畜至百餘，家東西之鼠捕且盡，狸狌無所食，飢而嗥。束氏日市肉啖之。狸狌生子若孫，以啖肉故，竟不知世之有鼠。但（２）飢輒嗥，嗥則得肉食，食已，與與如（３）也，熙熙如（４）也。\n\
    \  南郭有士病（５）鼠，鼠群行有墮甕者，急從束氏假（６）狸狌以去。狸狌見鼠雙耳聳，眼突露如漆，赤鬢，又磔磔然（７），意為異物也，沿鼠行不敢下。士怒，推入之。狸狌怖甚，對之大嗥。久之，鼠度（８）其無他技，齧其足，狸狌奮擲而出。\
    \                                                      （宋濂 束氏狸狌）\n\n【注釋】（１）狸狌：野貓。（２）但：只要。（３）與與如：和順的樣子。（４）熙熙如：和樂的樣子。\n\
    \        （５）病：為其所苦。（６）假：借。（７）磔磔然：形容老鼠的叫聲。（８）度：考慮、推測。"
