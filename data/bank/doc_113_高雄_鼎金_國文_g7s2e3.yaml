- id: doc_113_高雄_鼎金_國文_g7s2e3_s4_32
  section: 4
  number: 32
  type: single
  page: 5
  stem: 曾老爺對木蘭連問了四個問題，最可能是因為下列何者？
  options:
  - label: A
    content: 要嚴格的測試木蘭學問
  - label: B
    content: 讓木蘭轉移怕生的心理
  - label: C
    content: 對木蘭的身分將信將疑
  - label: D
    content: 欲在家人面前立下威嚴。
  group_stem: "木蘭又害羞，又害怕，渾身顫抖之下，上了那隻大船。那個女人伸出了手。她好像很和善，有教養，看樣子蠻慈愛。木蘭不由得心中對她有一片敬愛的感覺。\n\
    \  曾太太把她拉到懷裡說：「好孩子，你一定受了不少罪。」木蘭哇的一聲哭了。她知道自己是依偎到一位心腸仁慈的女人的懷中了，就像她的生身之母一個樣。\n  現在一件怪事發生了，一個態度嚴厲的中年紳士走向前來。生得額頭高，戴眼鏡，微微有點兒鬍子，穿著小褂兒長褲，上身外面套著灰藍的緞子坎肩兒，一手端著水煙袋。他腳上穿著白布襪子，因為這種運糧河的船上，雖然女人穿著鞋，男人卻脫了鞋，這樣不至於弄髒船艙裡洗刷得乾乾淨淨的油漆過的地板。\n\
    \  這位紳士走向木蘭，看清楚木蘭，覺得安了心，微微的笑了一下。曾太太說：「這是曾老爺。他不知道你認得他不認得他。他還納悶兒呢。」\n  木蘭覺得很難為情，不知道說是，還是說不是，就照普通規矩，以顫抖的聲音說：「曾老爺萬福！給您請安。」\n\
    \  曾老爺說：「你是姚家的小姐？」\n  木蘭覺得好像在什麼地方聽見過他的口音，趕緊回答說：「是，老爺。」\n  他問：「你們在北京住什麼地方兒？」\n\
    \  「東四牌樓馬大人胡同。」\n  「你叫木蘭呢，還是你妹妹叫木蘭？」\n  木蘭回答道：「我叫木蘭，我妹妹叫莫愁。」\n  曾老爺慢慢從袖子裡掏出手絹兒包的一個小包兒，臉上帶著一種奇妙的微笑把手絹兒打開。展開的手絹兒的正中正好在他的手心，手心裡托著兩小塊兒發霉狀的骨頭，每一塊大約有十寸寬，八寸到十寸長，看見就像普通微不足道的陳舊的獸骨頭，似乎隨便誰都可以從古老的花園兒裡的地上，或是古宅廢墟上找得到的。\n\
    \  曾老爺問：「這是什麼？」\n  木蘭的眼睛一閃亮，說道：「那不是甲骨嗎？」曾老爺大聲叫道：「對了！對了！她就是木蘭，天下只有她一個小姑娘兒認得這種甲骨！」他那興奮的喊聲不但使木蘭震驚，也驚動他太太和兒子。\n\
    \  木蘭一時給弄糊塗了，覺得局促不安。可是，忽然她想起來。他不是別人，正是她跟父親有一天在隆福寺廟會上碰見的那個人，那時候他們正在物色幾件甲骨。    \
    \                                  （林語堂 京華煙雲）"
