- id: doc_113_高雄_鼎金_國文_g7s2e3_s3_1
  section: 3
  number: 1
  type: single
  page: 1
  stem: 下列選項「 」中的注音寫成國字後，何組字形前後相同？
  options:
  - label: A
    content: 宿夜匪「ㄒㄧㄝˋ」/「ㄒㄧㄝˋ」逅
  - label: B
    content: 披荊「ㄓㄢˇ」棘／過關「ㄓㄢˇ」將
  - label: C
    content: 心無旁「ㄨˋ」/趨之若「ㄨˋ」
  - label: D
    content: 朝「ㄊㄧㄥˊ」／門「ㄊㄧㄥˊ」若市。
- id: doc_113_高雄_鼎金_國文_g7s2e3_s3_2
  section: 3
  number: 2
  type: single
  page: 1
  stem: 下列選項「 」中的字，何組讀音兩兩相同？
  options:
  - label: A
    content: 押「解」犯人／寬衣「解」帶
  - label: B
    content: 探「勘」／「勘」誤
  - label: C
    content: 「掙」錢養家／「掙」脫束縛
  - label: D
    content: 臉泛紅「暈」／「暈」倒。
- id: doc_113_高雄_鼎金_國文_g7s2e3_s3_3
  section: 3
  number: 3
  type: single
  page: 1
  stem: 下列「」的字義，何組字義前後不同？
  options:
  - label: A
    content: 「蓋」竹柏影也／「蓋」一癩蝦蟆也
  - label: B
    content: 步「於」中庭／留蚊「於」素帳中
  - label: C
    content: 「以」崇拜的口吻對他說／徐噴「以」煙
  - label: D
    content: 「為」此飲泣／「為」善最樂。
- id: doc_113_高雄_鼎金_國文_g7s2e3_s3_4
  section: 3
  number: 4
  type: single
  page: 1
  stem: 下列選項「 」中的成語，何者運用錯誤？
  options:
  - label: A
    content: 如何應付這次考試，他早就「胸有成竹」
  - label: B
    content: 他做事常常「急公好義」，忽略長遠的目標
  - label: C
    content: 做任何事情，與其「臨渴掘井」，不如未雨綢繆
  - label: D
    content: 他多年沒回家，一看到老家，竟有些「近鄉情怯」。
- id: doc_113_高雄_鼎金_國文_g7s2e3_s3_5
  section: 3
  number: 5
  type: single
  page: 1
  stem: 下列各文句，何者的修辭技巧與其他三者不同？
  options:
  - label: A
    content: 捕捉到的最美麗的一幅風景
  - label: B
    content: 庭下如積水空明，水中藻荇交橫
  - label: C
    content: 即使你資質再好，若沒有經過琢磨，也是一塊沒有什麼價值的璞玉
  - label: D
    content: 我突然覺得我平靜如水的情感翻起滔天巨浪來。
- id: doc_113_高雄_鼎金_國文_g7s2e3_s3_6
  section: 3
  number: 6
  type: single
  page: 1
  stem: 下列有關蘇軾的敘述，何者錯誤？
  options:
  - label: A
    content: 與父蘇洵、弟蘇轍，合稱「三蘇」，同列唐宋古文八大家
  - label: B
    content: 年少考中進士，從此仕途順遂
  - label: C
    content: 為唐宋古文八大家之一
  - label: D
    content: 其詩詞、散文、書法、繪畫都有極高的造詣。
- id: doc_113_高雄_鼎金_國文_g7s2e3_s3_7
  section: 3
  number: 7
  type: single
  page: 1
  stem: 下列文句，何者用字完全正確？
  options:
  - label: A
    content: 他努力學習，想要瀰補先天上的不足
  - label: B
    content: 比賽開始，各項兢技活動紛紛展開
  - label: C
    content: 他托著肥胖的身軀，氣喘吁吁的爬上山頂
  - label: D
    content: 連日來陰霾的天氣，讓我的心情也沉了下來。
- id: doc_113_高雄_鼎金_國文_g7s2e3_s3_8
  section: 3
  number: 8
  type: single
  page: 1
  stem: 《春望》：「感時花濺淚，恨別鳥驚心。」、《月夜憶舍弟》：「戍鼓斷人行，邊秋一雁聲。」根據兩詩擷取之詩句，請分析兩詩的共同特色，何者最適切？
  options:
  - label: A
    content: 皆借景抒情，透過環境描寫社會動盪的不安
  - label: B
    content: 皆寫自然之景，用以表現懷才不遇的情緒
  - label: C
    content: 皆藉軍旅生活，表現詩人建功立業的抱負
  - label: D
    content: 貼回顧往昔榮耀，感嘆人生變化無常。
- id: doc_113_高雄_鼎金_國文_g7s2e3_s3_9
  section: 3
  number: 9
  type: single
  page: 2
  stem: 「庭下如積水空明，水中藻荇交橫，蓋竹柏影也。何夜無月？何處無竹柏？但少閑人如吾兩人耳！」作者所呈現的心境與下列何者最接近？
  options:
  - label: A
    content: 忙人無是非，閒人是非多
  - label: B
    content: 人閒桂花落，夜靜春山空
  - label: C
    content: 人有悲歡離合，月有陰晴圓缺
  - label: D
    content: 江山風月，本無常主，閒者便是主人。
  lesson_raw:
    title: 記承天夜遊
    basis: 引用課文《記承天夜遊》文句
- id: doc_113_高雄_鼎金_國文_g7s2e3_s3_10
  section: 3
  number: 10
  type: single
  page: 2
  stem: 關於記承天夜遊一文，下列敘述何者錯誤？
  options:
  - label: A
    content: 蘇軾看見「月色入戶」，引發夜遊動機
  - label: B
    content: 篇幅短小，但道理、感情、景象兼具，其結構依序為「論說抒情寫景」
  - label: C
    content: 蘇軾透過「欣然起行、念無與樂者、但少閑人如吾兩人耳」傳達夜遊美好歡快的感受
  - label: D
    content: 「何夜無月？何處無竹柏」是感嘆月色、竹柏常有，只是一般人忙於世俗雜務而無心欣賞。
  lesson_raw:
    title: 記承天夜遊
    basis: 題幹提及《記承天夜遊》
- id: doc_113_高雄_鼎金_國文_g7s2e3_s3_11
  section: 3
  number: 11
  type: single
  page: 2
  stem: '某文人因罪被貶後，寫道：「得罪以來，深自閉塞，扁舟草屨（１），放浪山水間，與漁樵雜處，往往為醉人所推罵，則自喜漸不為人識。」根據這段文字，下列對於此文人境況的描述，何者正確？

    【注釋】（１）草屨：草鞋。'
  options:
  - label: A
    content: 因罪人身分為人所不齒，屢受責罵
  - label: B
    content: 擺脫聲名之累，心情趨向適意豁達
  - label: C
    content: 獲罪之後，心情憂懼，經常閉門不出
  - label: D
    content: 對仕途絕望，決意漁樵於江湖，隱逸終老。
- id: doc_113_高雄_鼎金_國文_g7s2e3_s3_12
  section: 3
  number: 12
  type: single
  page: 2
  stem: 「喬丹雖為此暗自飲泣，不過他並不氣餒，反而更賣力地磨練自己的球技。」這段話啟示我們什麼道理？
  options:
  - label: A
    content: 不要漠視別人的軟弱，那也可能是自己的缺點
  - label: B
    content: 奮鬥過程往往有波折，但堅毅的心志往往能克服這些挫折
  - label: C
    content: 人只有獻身於社會，才能找出那短暫而有風險的生命意義
  - label: D
    content: 生命的多少用時間計算，生命的價值用貢獻計算。
  lesson_raw:
    title: 音樂家與職籃巨星
    basis: 引用《音樂家與職籃巨星》文句
- id: doc_113_高雄_鼎金_國文_g7s2e3_s3_13
  section: 3
  number: 13
  type: single
  page: 2
  stem: 蟲洞書簡是王溢嘉見青春期的兒女不安徬徨，因而想起自己年少時期也是如此，故寫信給年少的自己。在文章中，他以「Ｍ」代表年少的自己，「Ｗ」代表為人父的自己。而在中華文化中，對於不同年齡也有不同的代稱。下列選項中的年齡代稱，由小至大排列正確者為何者？
  options:
  - label: A
    content: 志學、不惑、而立
  - label: B
    content: 弱冠、耳順、志學
  - label: C
    content: 弱冠、而立、知命
  - label: D
    content: 古稀、耳順、知命。
  lesson_raw:
    title: 蟲洞書簡
    basis: 題幹提及課文《蟲洞書簡》
- id: doc_113_高雄_鼎金_國文_g7s2e3_s3_14
  section: 3
  number: 14
  type: single
  page: 2
  stem: 音樂家與職籃巨星一文的主旨，與下列何者最接近？
  options:
  - label: A
    content: 青春，一旦和它緊緊的握手，就能獲得開拓新途徑的動力
  - label: B
    content: 不要問別人為你做了什麼，而要問你為別人做了什麼
  - label: C
    content: 爭強與好勝之心在思想的碰撞中，可以啟動智慧而集思廣益
  - label: D
    content: 所謂天才人物，是指具有毅力的、勤奮的、入迷的和忘我的人
  lesson_raw:
    title: 音樂家與職籃巨星
    basis: 題幹提及《音樂家與職籃巨星》
- id: doc_113_高雄_鼎金_國文_g7s2e3_s3_15
  section: 3
  number: 15
  type: single
  page: 2
  stem: 「愛因斯坦想盡量給聽眾一個印象：即他的貢獻不是源於甲，就是由於乙，而與愛因斯坦本人不太相干似的。」這種態度與下列何者相同？
  options:
  - label: A
    content: 李安以少年Ｐｉ的奇幻漂流獲得奧斯卡最佳導演獎，他上臺領獎時，感謝所有一起工作的人，包括演員與幕後工作者
  - label: B
    content: 德蕾莎修女收容印度垂死病人，讓他們有尊嚴的走完最後一刻
  - label: C
    content: 一出生就沒有雙腿的少年，坐著輪椅打籃球
  - label: D
    content: 七十歲的老奶奶和孫子一起從國中畢業。
  lesson_raw:
    title: 謝天
    basis: 引用課文《謝天》文句
- id: doc_113_高雄_鼎金_國文_g7s2e3_s3_16
  section: 3
  number: 16
  type: single
  page: 2
  stem: 讀完謝天一文，同學們紛紛發表自己的讀後心得。下列哪一位同學的心得最切合本課主旨？
  options:
  - label: A
    content: 秧秧：「一日之所需，百工斯為備」，生活中便利、成功的果實，都來自於眾人的協助與合作
  - label: B
    content: 天闊：「鋤禾日當午，汗滴禾下土」，農人辛勤耕作，在各種行業裡最受人尊敬
  - label: C
    content: 士豪：入境應當隨俗，否則當眾出糗是十分尷尬的事
  - label: D
    content: 克柔：「人非聖賢，孰能無過」，混吃混玩的人若懂得知恩惜福，進而回饋奉獻，是難能可貴的事。
  lesson_raw:
    title: 謝天
    basis: 題幹提及《謝天》
- id: doc_113_高雄_鼎金_國文_g7s2e3_s3_17
  section: 3
  number: 17
  type: single
  page: 2
  stem: 謝天一文的精神與下列何者相同？
  options:
  - label: A
    content: 孟子的「舍我其誰」
  - label: B
    content: 老子的「絕聖棄智」
  - label: C
    content: 顏淵的「無伐善、無施勞」
  - label: D
    content: 孔子的「不義而富且貴，於我如浮雲」。
  lesson_raw:
    title: 謝天
    basis: 題幹提及《謝天》
- id: doc_113_高雄_鼎金_國文_g7s2e3_s3_18
  section: 3
  number: 18
  type: single
  page: 2
  stem: 另一個春天一文末段，為何作者說「那頭銀髮是我春天在希臘旅行，捕捉到的最美麗的一幅風景」？
  options:
  - label: A
    content: 因為有老太太同遊，讓作者更加體會到自己正值壯年，處於人生之春的美好
  - label: B
    content: 老太太對生命的熱情、積極與活力讓作者獲得啟發，是令人難忘的人間美景
  - label: C
    content: 老太太獨特的造型、豐富的肢體動作和樂觀開朗的性格，使她成為目光焦點
  - label: D
    content: 老太太的智慧與言談不同流俗，顛覆了作者對旅行的看法，是此行最大收穫
  lesson_raw:
    title: 另一個春天
    basis: 題幹提及《另一個春天》
- id: doc_113_高雄_鼎金_國文_g7s2e3_s3_19
  section: 3
  number: 19
  type: single
  page: 2
  stem: 下列文句，何者說明正確？
  options:
  - label: A
    content: 「在那個舊袋子裡翻了半天，找到薄荷軟糖給我」暗指老太太生活習慣不佳
  - label: B
    content: 「我拿出一捲中文音樂卡帶送她，不可抑遏的淚水從她的老花眼鏡背後潸潸流下」老太太因卡帶失而復得而落淚
  - label: C
    content: 「我沒有時間流淚，也沒有時間悲傷，這就是我的哲學」意思是要珍惜時間，樂觀面對人生
  - label: D
