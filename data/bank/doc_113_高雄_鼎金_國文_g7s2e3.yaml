  - label: D
    content: 專心：我能夠專注，摒除所有的干擾。
  group_stem: "只要能讓困難的習慣與正面感受產生連結，它們就會變得更有吸引力。有時候，你需要的只是小小的轉念。舉例來說，我們常常提到一天當中必須做的每件事：你必須早起上班，你必須為了生意打一通業務拜訪電話，你必須為家人準備晚餐。\n\
    \  現在，把兩個字改掉看看：不是「必須」，而是「可以」。你可以早起上班，你可以為了生意打一通業務拜訪電話，你可以為家人準備晚餐。只是改變兩個字，就讓你用不同方式看待每件事；原本被你視為負擔的行為，如今成了機會。\n\
    \  重點是，兩個版本的現實都是真的。你必須做這些事，但你也可以做這些事。無論選擇哪一種心態，我們都能找到支持的證據。\n  重新思考你的習慣，把重點放在益處，而非壞處。這是一個快速而輕鬆的方式，使你重新設定大腦，讓習慣顯得比較有吸引力。\n\
    \  假設你想要提升整體的快樂程度，那麼就尋找一件讓你真正快樂的事。例如撫摸你的狗或洗泡泡浴，然後創造一個簡短的儀式，在每一次做這件你喜愛的事情之前執行。也許是深呼吸三次，然後微笑。\n\
    \  深呼吸三次，微笑，摸狗狗。重複。\n  最後，你會開始把這個深呼吸與微笑的儀式跟好心情聯想在一起，它成了一個意味著覺得快樂的提示。一旦設定好，以後每次需要改變情緒狀態時都能拿出來用。工作有壓力？深呼吸三次，然後微笑。生活讓你傷心？深呼吸三次，然後微笑。習慣一旦確立，提示就能觸發渴望，即使它與原本的情境沒有什麼關係。\n\
    \  想要找出並解決壞習慣的成因，關鍵就是重新架構你對它們的聯想。這並不容易，但如果可以重新設定你的預測，就可以把困難的習慣轉變為有吸引力的習慣。    \
    \                    （節選自詹姆斯．克利爾 原子習慣）"
