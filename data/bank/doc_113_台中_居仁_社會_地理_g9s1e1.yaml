  section: 2
  number: 23
  type: single
  page: 3
  stem: '歐洲兩大河流藉由某一運河相互連結，以提升河流的航運價值。甲港口為該運河上重要的轉運樞紐，表二為2016 年兩條河流流域內各國與甲港口之間的船舶貨運量。由表中資訊判斷，可推論出其中一條河流的貨運量較大，該河流應是注入哪個海域？


    | 國家 | 船舶貨運量(公噸) |

    | :--- | :--- |

    | 荷蘭 | 100,488 |

    | 德國 | 68,520 |

    | 比利時 | 50,813 |

    | 奧地利 | 34,498 |

    | 匈牙利 | 8,891 |

    | 法國 | 5,552 |

