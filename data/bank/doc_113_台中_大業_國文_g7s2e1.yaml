  section: 4
  number: 1
  type: single
  page: 4
  stem: 根據本文，下列明祥提供給失眠朋友的建議，何項與本文內容最相符？
  options:
  - label: A
    content: 睡前想像讓自己放鬆的場景，如：天空、海洋可幫助入睡
  - label: B
    content: 睡前拿手機呼朋引伴連線玩遊戲，大戰一場後可幫助入睡
  - label: C
    content: 睡前做些重量訓練活動筋骨，讓身體感到疲累就容易入睡
  - label: D
    content: 睡前大量喝牛奶、熱可可，讓身體暖和起來就容易入睡
  group_stem: "愈樂觀睡愈好，不易嗜睡\n    一份國外的研究顯示，樂觀與好的睡眠有顯著正相關，且樂觀者白天嗜睡情況較低。精神醫師指出，樂觀除有助睡眠，也有益健康；心理衛生專家則提醒，樂觀和正向思考可以練習。\n\
    \    董氏基金會日前發布新聞稿指出，一篇今年刊載於科學日報的研究顯示，樂觀與更好的睡眠有顯著正相關，愈樂觀的人睡眠品質越好、睡眠時間也愈長。此研究以年齡介於32歲至51歲、共3500名成人為對象，針對整體睡眠品質和時間進行評估，包括失眠症狀、入睡困難以及每晚的實際睡眠時數。研究發現，愈樂觀的人愈覺得自己有充足的睡眠（每晚睡6至9小時），其中有74%自認沒有失眠症狀且白天嗜睡情況也較低。且每增加一個標準差的樂觀分數，擁有良好睡眠品質的機率就會增加78%。\n\
    \    林口長庚醫院一般精神科主治醫師劉嘉逸表示，好的睡眠有益穩定情緒、維持良好身心狀態，該研究團隊先前的研究也發現，樂觀的人心血管較健康，證實樂觀不僅有益於心理健康，也對身體健康有所幫助。\n\
    \    董氏心理衛生中心主任葉雅馨則說，樂觀與悲觀往往是個性所造成，但樂觀可以練習，如遇到事情的當下感到悲觀無望，不妨自問：「有這麼糟糕嗎？」「換個想法會如何呢？」都是很好的自我提醒及練習正向思考的方法，平常多練習可幫助擁有好的睡眠品質。通常愈睡不著愈會想到煩心、不好的事，當發現自己陷入負向情緒，應提醒自己多想愉快的事情；若因為擔心事情做不完而影響睡眠，不如起身用筆記下，避免一直掛心。也可營造睡眠環境與氣氛，如：避免因燈光、電視聲響或睡前攝取過多水分起床如廁而影響睡眠。若翻來覆去都睡不著，可透過冥想，想像令人放鬆的景象。但切忌起身運動，以免產生令人提神的正腎上腺素更無法入眠。\n\
    \                          節錄自中央通訊社愈樂觀睡愈好，不易嗜睡 專家：正向思考可練習"
