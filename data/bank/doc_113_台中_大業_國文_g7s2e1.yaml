  group_stem: "廚房的聲音   鄭麗卿\n    □□，我也渴望自廚房出走。那時下班衝回家總是心急，在廚房裡更是分秒必爭，每個動作都要快快快，洗菜像要溺死毒素菜蟲般凶狠，切菜如斬亂草，然後唰一聲下鍋，鐵鏟鏘鏘鏘與鐵鍋短兵相接，聲如馬蹄狂奔，抽油煙機轟轟然戰車般輾過粗礫的心情，快火熱炒三兩回合便熄火起鍋。□□我厭倦了把廚房當沙場的日子，放慢腳步之後才開始喜歡廚房，喜歡自己的切菜聲，左手指頭也不再帶刀傷。菜刀俐落滑過蔬菜瓜果總帶著痛快又涼快的感覺，鐵鍋油滋滋歡炒著，電鍋啵啵送出陣陣米飯香。與小女低低切切的私語，就像蔥頭蒜苗，隱身在一道道菜餚裡。□□，我在這一方天地裡是純粹而平靜的。"
