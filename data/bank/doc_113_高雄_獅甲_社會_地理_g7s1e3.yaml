- id: doc_113_高雄_獅甲_社會_地理_g7s1e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 臺灣自來水公司開發洪水監測平臺系統，可分析供水量，面臨旱象時可藉此靈活調度減緩用水危機，也可檢測管線以降低漏水量，讓臺灣有限的水資源得以被充分利用。請問：由於臺灣的哪一地理特徵而必須設置上述系統？
  options:
  - label: A
    content: 複雜而多樣的生態環境
  - label: B
    content: 河川大多東西分流
  - label: C
    content: 緯度位置較低
  - label: D
    content: 降水季節分布不均
  group_stem: "臺灣的水文特色為降水時空分布不均、河川短小且坡陡、流急、泥沙淤積嚴重等。事實上，臺灣的缺水問題除了本身的自然條件外，人為因素也占很大部分，關鍵正是在你腳下的自來水管。2018\
    \ 年，臺灣自來水公司的漏水率約為 15 ％，換算起來一年約漏掉 2 座多石門水庫的水量。自來水公司抓漏目前以基隆、臺中與高雄 3 縣市優先；其中，基隆因位於山區，水壓變動大，漏水率將近\
    \ 25 ％，是全臺最高。另外，臺中因 921 大地震影響，自來水管線多有損壞，漏水率約 20 ％，也列為優先目標；高雄則是管線老舊，漏水率約 12 ％。\n\
    \        日本東京平均漏水率約 3 ％，是世界最低，但花了 30 年、將近 6,000 億新臺幣才達到。臺灣管線有 6 萬多公里，要降低漏水率需改用不鏽鋼波浪管，但更換管線經費龐大，加上水價長期偏低，財源籌措困難。據臺灣自來水公司\
    \ 2017 年調查（如上表(三)），臺灣每度平均水價僅 9.2 元，只高於伊朗、模里西斯兩個國家，在亞洲主要國家堪稱不合理的便宜，臺灣水價即便漲價 2 倍，還是遠低於世界各國。廉價的水費使國人用水不思珍惜，也缺乏修繕管線的經費。\n\
    \        另外，修建水庫比起整修老舊自來水管線，更能達到立竿見影的效果，且屬於「看得到」的政績，政府機關選擇不斷在臺灣建造水庫，然而水庫可能破壞自然與人文生態，更有淤積、加速海岸退縮、水庫優養化等問題，臺灣的水資源僅做「開源」而沒有「節流」，無法解決水資源缺乏的問題。"
