  group_stem: "Forever Always by Octavio Ocampo\nOctavio Ocampo is a famous Mexican\
    \ painter.  There are always two special parts of designs in his paintings.  One\
    \ of these paintings is Forever Always.\n  This painting is very interesting because\
    \ it looks different when you look closer!  At first, you see two older people\
    \ with gray hair looking at each other.  But when you look closer, you will see\
    \ a big cup in the middle, and there are two young people sitting together.  One\
    \ person is playing the guitar, and the other is listening to music and some plates\
    \ on her head.  They enjoy the music and they are happy.  From the painting, we\
    \ can see that the two people stay together when they are young and old.  Also,\
    \ a woman is standing at the door and listening to music.  Who is she?  Maybe\
    \ she is their daughter.  What do you think?\n forever 永遠   Mexican 墨西哥的   interesting\
    \ 有趣的   closer 更近點\ndesign 設計    middle 中間    plate 盤子 stay 待著"
