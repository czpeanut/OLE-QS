    content: '80'
  - label: B
    content: '100'
  - label: C
    content: '230'
  - label: D
    content: '250'
  group_stem: "Do you like waffles?  Do you know waffles are very easy to make?  With\
    \ only six kinds of food, you can make a yummy snack at home.\n  \n★What do you\
    \ need?\n        Wet Foods→ 2 eggs；230 grams milk；100 grams oil\nDry Foods→ 250\
    \ grams flour；80 grams sugar；5 grams salt\n      ★What do you do?\n        1.\
    \ Get two big bowls.\n        2. Mix all the dry foods in one big bowl.\n    \
    \    3. In the other big bowl, mix all the wet foods together.\n        4. Pour\
    \ the wet ones into the bowl of dry ones.  Mix them together for three minutes.\
    \  Now you have batter.\n          It’s usually for desserts.\n        5. Turn\
    \ on your waffle iron, and make sure that it is very hot.  Once the waffle iron\
    \ is hot, put oil on it.\n          This way, the batter won’t stick to it later.\n\
    \        6. Put batter onto the waffle iron.\n        7. Close the waffle iron\
    \ and cook until the waffles are brown.  Wait for about 4 to 5 minutes.\n    \
    \    8. Take out the waffle and make more!\n        9. Eat the waffles with your\
    \ favorite sweet toppings.  Enjoy your yummy waffles!\n           waffle 鬆餅 \
    \ gram 公克  wet 溼的  dry 乾燥的  oil 油  pour 倒  dessert 甜點  waffle iron 鬆餅模具\n    \
    \         once 一旦  won’t stick 將不會黏住  until 直到  more 更多  topping 配料"
