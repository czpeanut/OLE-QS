  section: 1
  number: 19
  type: single
  page: 3
  stem: 將蕨類植物的葉片撕下一小片，與原來葉片相似，數學家曼德布洛特(Benoit Mandelbrot)將這種圖形稱為碎形(fractal)，它具有自我相似性（self-similar），可以不斷地產生重複。如果將圖形持續放大，似乎沒有盡頭，而且放大的部份與原圖形的某部份相似，原來碎形就是由自我相似不斷產生所造成的。附圖稱為科赫Koch
    曲線，它就是碎形，將一線段3 等分，刪除中間那一段再加上2 條等長的小線段，形成【圖2】。再將【圖2】中的4 條線段，各自等分成3 段，刪除中間的線段再加上2
    條等長的更小線段，形成【圖3】。按此規律請問【圖6】中總共會有幾條小線段？
  options:
  - label: A
    content: '600'
  - label: B
    content: '840'
