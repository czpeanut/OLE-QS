  stem: 西元1983 年英國哥倫比亞大學物理學家洛恩．懷海德(Lorne Whitehead)曾經製作一組13 張的骨牌，第一張高約1 公分，之後的每一張骨牌都是前一張的$\sqrt{2}$倍高，只要推倒第一張，就可輕易推倒高約64
    公分的第13 張骨牌。2001 年，舊金山探索博物館(Explaratorium)的一位物理學家重新執行懷海德的實驗，但是他只用了8 張骨牌，第一張高約2
    英吋，第8 張則高約3 英呎。如果按照他的設計繼續下去，則第18 張高已接近比薩斜塔，而第31 張高則超越聖母峰。子棋對此感到興趣，於是仿照懷海德的設計，使第一張骨牌仍然高約1
    公分，但他最後一張高度大約是2.56 公尺，請問子棋設計的這組骨牌共有幾張？
  options:
  - label: A
    content: 15 張
  - label: B
    content: 17 張
  - label: C
    content: 18 張
  - label: D
    content: 19 張
