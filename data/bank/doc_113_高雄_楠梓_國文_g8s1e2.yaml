- id: doc_113_高雄_楠梓_國文_g8s1e2_s2_26
  section: 2
  number: 26
  type: single
  page: 3
  stem: 根據本文，下列敘述何者正確？
  options:
  - label: A
    content: 電子煙主要的成分是甲醇、乙烯及丙烷
  - label: B
    content: 人們最大的誤解是傳統香煙比電子煙安全
  - label: C
    content: 電子煙添加尼古丁是煙草公司為了讓新客戶上癮
  - label: D
    content: 青少年要謹慎選擇不含尼古丁的電子煙。
  group_stem: '電子霧化器通常被稱為「電子煙」，是一種將汽化的煙液送入肺部的電子裝置。電子煙有許多不同的樣式，有的甚至難以辨認出是電子煙。電子煙主要成分是丙二醇、植物甘油或甘油，通常還含有尼古丁、香料和其他化學物質。人們對電子煙最大的誤解是，比起香煙，電子煙安全無害。大錯特錯！電子煙並不安全。

    電子煙豐富多樣的口味，如西瓜、葡萄、焦糖、泡泡糖、香草和薄荷，和五顏六色的包裝尤其吸引青少年。許多電子煙含有尼古丁，讓青少年很快上癮。煙草公司一直在挖掘新客戶，而電子煙正是讓青少年對尼古丁上癮的一種新手段，而尼古丁通常很難戒掉。

    尼古丁是一種電子煙中常見的毒性物質，對青少年的大腦而言具有高度成癮性。它會對大腦發育造成長期的負面影響。尼古丁會改變青少年大腦突觸形成的方式。影響可能包括損害注意力、學習能力、記憶力，以及情緒改變。電子煙會使青少年的抑鬱和焦慮風險增加。吸電子煙也與嚴重的肺病有關。重要的是，電子煙的許多長期危害仍然是未知的。電子煙中的液體和蒸汽不是水。吸煙者可能會使青少年接觸到：

    • 與清潔劑、洗甲水、除草劑和殺蟲劑成分相同的有害化學物質。

    • 甲醛和重金屬等有毒物質。

    • 可被吸入肺部深處的超細微粒。

    • 調味增香的化學劑，如雙乙醯（與嚴重肺病有關）。

    電子煙甚至會爆炸，造成嚴重燒傷。

    節選網路文章'
