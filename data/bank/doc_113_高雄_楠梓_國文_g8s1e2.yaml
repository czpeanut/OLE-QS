  group_stem: '嘉興 徐泰，幼喪父母，叔父隗養之，甚於所生。隗病，泰營侍甚勒。是夜三更中，夢二人乘船持箱，上泰床頭，發箱，出簿書示曰：「汝叔應死。」泰即於夢中叩頭祈請。良久，二人曰：「汝縣有同姓名人否？」泰思得，語二人云：「有張隗，不姓徐。」二人云：「亦可強逼。念汝能事叔父，當為汝活之。」遂不復見。泰覺，叔病乃差。

