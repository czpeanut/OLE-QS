- id: doc_113_高雄_楠梓_國文_g8s1e2_s2_31
  section: 2
  number: 31
  type: single
  page: 4
  stem: 故事中僧人情緒的轉變，依序為何？
  options:
  - label: A
    content: 傷心→恐懼→苦惱→大喜
  - label: B
    content: 恐懼→不信→好奇→大喜
  - label: C
    content: 恐懼→感謝→痛苦→頓悟
  - label: D
    content: 恐懼→大怒→苦笑→感謝。
  group_stem: '洛陽有一僧人，他房中有一罄①，每天時常自己發出聲音。僧人感到怪異，因此恐懼成疾。遍求術士，千方百計的想使罄禁聲，始終未能達到目的。

    曹紹夔與這位僧人一向友好，聽說僧人病了，就前來探望。問起患病的緣由，僧人如實相告。曹紹夔聽了僧人的講述後，就去敲齋鐘，隨後磬就自鳴。曹紹夔笑著對僧人說：「明天你可擺一桌盛宴，我一定為你止住它。」

    僧人雖不信曹紹夔的話，但還是希望他能治住這只罄，所以第二天擺了酒席招待他。曹紹夔吃罷酒宴，從懷中取出一把銼，將僧人室中的罄銼了幾處。自此之後，罄再也不自鳴了。

    僧人苦苦問詢曹紹夔為什麼他一銼，罄就不自鳴了？曹紹夔告訴他：「罄的鳴聲跟齋鐘的音律相合，你敲鐘，罄就發聲相和。」僧人聽後大喜，很快，他的病也就痊癒了。

    ① 罄：寺觀禮佛時所敲奏的樂器。僧人於誦經、法會等活動時敲擊。

    翻譯《唐語林 曹绍夔捉怪》'
