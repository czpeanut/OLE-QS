- id: doc_113_高雄_楠梓_國文_g8s1e2_s1_17
  section: 1
  number: 17
  type: single
  page: 1
  stem: 「有赴飲夜歸者，值大雨，持蓋自蔽。見一人立簷下溜，即投傘下同行。久之，不語，疑為鬼也，以足撩之，偶不相值，愈益恐，因奮力擠之橋下而趨。值炊糕者晨起，亟奔入其門，告以遇鬼。俄頃，復見一人，遍體沾溼，踉蹌而至，號呼有鬼，亦投其家。二人相視愕然，不覺大笑。」關於這個故事，下列何者正確？
