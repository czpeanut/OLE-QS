  group_stem: '(七)閱讀下文，回答第38～40 題

    【甲】

    古之傳者有言：「成王以桐葉與小弱弟①，戲曰：『以封汝』。」周公入賀。王曰：『戲也。』周公曰：『天子不可戲。』乃封小弱弟於唐。」

    吾意不然。王之弟當封耶？周公宜以時言於王，不待其戲，而賀以成之也。不當封耶，周公乃成其不中②之戲，以地以人與小弱者為之主，其得為聖乎？且周公以王之言不可苟焉而已，必從而成之耶？設有不幸，王以桐葉戲婦寺③，亦將舉而從之乎？
    (柳宗元〈桐葉封弟辨〉)


    注釋①小弱弟：年幼的弟弟。②不中：不恰當。③婦寺：婦人與宦官


    【乙】

    梧桐為植物中清品，而形家①獨忌之甚，且謂「梧桐大如斗，主人往外走」，若竟視為不祥之物也者。夫剪桐封弟，其為宮中之桐可知。而卜世②最久者莫過於周。俗言之不足據，類如此夫。
    (張潮《幽夢影》)


    注釋①形家：看陰陽風水的人。②卜世：占卜預測國運。'
