  section: 1
  number: 34
  type: single
  page: 6
  stem: 依據上文，下列敘述何者正確？
  options:
  - label: A
    content: 受到「矮盤灌叢」層層糾纏和扭曲，造成玉山圓柏無法順利長高
  - label: B
    content: 圓柏的生長範圍與環境密切相關，但個體間的遺傳差異尚未明朗
  - label: C
    content: 關於半邊發展的玉山圓柏其形成的原因在於比杜鵑的枝椏軟且韌
  - label: D
    content: 非恆定性風向的強風，是造成玉山杜鵑呈現螺旋枝椏的主要原因。
  group_stem: '(五)閱讀下文，回答第34～35 題：

    〈玉山圓柏的故事〉 陳玉峰

    在玉山圓柏的基因池中，原本具有可以長成數丈高巨木的潛力，卻因位居山顛絕嶺的艱困惡地，復因風暴、霜急、雪重，夥同乾旱、低溫、土壤化育不良等環境壓力，時時刻刻地折磨與鞭笞圓柏的身軀，終而雕鑿出盤虬曲張的枝幹，駢體相連且緊臨地表而匍匐綿亙，形成生態術語裡所謂的「矮盤灌叢」。

    就這樣，由於生長受到強制性扭曲，使得圓柏糾纏絞結的變體軀幹，充滿頑強抗爭的無比氣勢，在絕地裡硬生地迸發出生命無窮的張力，順沿螺旋的枝椏望去，彷彿悲壯撕裂的吶喊，在天地交戰中響起，震撼山谷，活現了綠色生命的尊嚴。

    事實上，玉山圓柏除卻自身的成長之外，體形的修飾，端視立地條件繁富變化的環境因子而定，因而外形善變非常。

    在風強且非恆定性風向地區，隨著各季節風向變動，其枝椏可以螺旋轉向來適應。這一方面，生長環境近似的玉山杜鵑，其行為表現則截然有別。此或因圓柏的枝椏較軟且韌，杜鵑的枝椏較硬且乏足夠彈性之所致。如果圓柏植株生長於具有風力強勁，如風口、稜線等地域，則體形會有半邊發展的傾向，而非上述的盤旋曲張。

    目前研究指出，某些地點之風力、土壤厚度及溼度，可以決定圓柏在該地點所能生長的臨界範圍。此外，圓柏個體間的遺傳差異究竟如何，尚待進一步研究。

    無論如何，體形變異依隨環境梯度起伏的圓柏族群，就造成藝術的角度衡量，在臺灣四千餘種植物之中，無有出其右者；其所建構出的微地景，更是精彩絕倫。'
