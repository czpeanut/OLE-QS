- id: doc_113_新北_中平_國文_g9s1e3_s1_28
  section: 1
  number: 28
  type: single
  page: 5
  stem: 有關〈活著，只為病人而生的醫師〉一文，以下哪一項敘述正確？
  options:
  - label: A
    content: 羅東聖母醫院是全臺唯一不先向病人收保證金的醫院，目的是希望所有的病人都可以放心接受最好的醫療。
  - label: B
    content: 范鳳龍醫師到去世前一個月，仍半夜為病人開急診刀，因他是傳教士，需用一生的力量，以傳達天主之愛。
  - label: C
    content: 范鳳龍和幾位神父創立聖母醫院，讓窮苦人家可寫借據看病，沒錢歸還不追討，每隔幾年還會燒借據免債。
  - label: D
    content: 范鳳龍因醫術精湛獲得「臺灣醫療奉獻獎」，但因母親去世，須趕回家奔喪，而成為該屆唯一缺席的得主。
  group_stem: '(二)閱讀下文，回答第28～29 題：

    〈活著，只為病人而生的醫師〉

    臺灣人大多知道史懷哲，卻很少人知道在臺灣這塊土地上，有很多默默付出的「臺灣史懷哲」，范鳳龍醫生就是其中之一。他出生在巴爾幹半島的斯洛維尼亞，原名叫做若望（JanezJanež），他的一生都奉獻給臺灣的病人和窮人，人們都叫他「O-ki」、「大醫師」。

    他成長於一個虔誠的天主教家庭，二十五歲那年從醫學院畢業，進入白色巨塔，卻也開啟顛沛流離的生活。在戰火頻仍的二次大戰，他被徵召入伍，還差點遭到南斯拉夫共產黨軍隊活埋，危難之際只好離開故鄉，就此展開一生的奉獻行腳，曾到義大利、阿根廷與中國雲南。在雲南，他的醫術受到民眾的肯定，卻因共產黨將天主教會驅逐出境而被迫離開中國。三十九歲的范鳳龍只好和幾位神父跨海來臺，在當時醫療還很落後的宜蘭羅東創立「聖母醫院」。

    范鳳龍是位外科醫師，他在聖母醫院的第一臺刀，是為一位婦女取出重達十二公斤的巨型子宮肌瘤，聖母醫院的名號因此打開，人們都知道，這間「阿督仔病院」的外國醫生醫術精湛。

    聖母醫院不只醫師醫術好，還特別照顧貧窮的民眾。窮苦人家寫下借據就可以看病，日後有錢再還，沒錢歸還不僅不追討，借據每隔幾年還會燒掉，目的是讓他們可以放心接受最好的醫療。范鳳龍曾在病人沒依約來開刀時，怒氣沖沖地跑到會計室詢問：「我們是不是向病人收保證金，害病人不敢上門來開刀？」從此大家都知道，先救病人要緊，不能先收錢。

    范鳳龍幾乎什麼刀都會開，他一生完成八萬多件外科手術，涵蓋一般外科、泌尿外科、骨科和婦產科，創下臺灣紀錄。他能完成這麼多手術，是因為他幾乎把所有時間都留給病人，在聖母醫院執業近四十年，他每天除了看診、查房，其他的時間都在開刀房，一天安排十多臺手術，常常開刀到深夜，有時甚至到天亮。此外，他的休息室就在急診室旁邊，如果夜裡有急診病患，他也提供二十四小時的急診服務，一個晚上曾被叫起來二十多次，隔天早上還是準時到病房，開始忙碌的一天。

    他在早年寫給親友的信裡提到：「這裡有太多工作，是我在別的地方未曾經歷的。有時一天要開十多次刀……有天下午，我遇到一宗困難的手術，在縫合最後一道傷口時感到頭暈，跌倒在地上，醒過來之後，又連續開刀三小時。」

    范鳳龍不只幫病人開刀，也是病人的「血庫」，他常常挽起袖子，自己捐血給病人，及時拯救他們的生命。直到聖母醫院建立血庫後，有人跟他說，不要再自己捐血了，他說：「有什麼辦法，我不捐血，病人會死掉，這樣做才能救他一命，讓他回家。我不在意他是否感謝我，我只要能工作就心滿意足了。」大家都很感佩有這麼好的一位醫師，無怨無悔地守護病人，因此大家都叫他「O-ki」，就是日語「大」的意思，用來表達對這位大醫師的感謝。

    范鳳龍不是神職人員，但是他終身都沒有結婚。我們現在常常提到「視病如親」，范鳳龍真的把病人當作家人。他說：「在醫院裡我只是個工人，我不能想望假期。」有一次他終於請假了，說要到外面走走，結果不到半小時就回到醫院，同事好奇地問他：「你今天不是休假嗎？」這才知道，他的休假竟然只是在羅東逛了一圈，就回到工作崗位，繼續服務病人。

    范鳳龍來到臺灣之後，就不曾離開，母親重病時也沒有回去，大家問他為什麼，他默默地轉過身去，堅強的背影有著勇敢的溫柔，話裡帶著淚說：「回去，也來不及救她了……這裡還有很多要救的人。」不久之後，母親過世的消息傳來，那時范鳳龍正在為一位有四個孩子的母親開甲狀腺手術，他強忍著悲傷，冷靜完成手術，術後傷心地趴在桌上不能自已。

    「我的生命是獻給在這的病人。將來我只有一個願望，走那一大步到永恆去時，我還在工作。」他真的做到了！范鳳龍到去世前一個月，仍然半夜起來為病人開急診刀，在強忍著身體的病痛，開完人生最後一臺刀後，他到神父面前，向神父道歉：「對不起，我再也沒辦法幫助病人了！」

    民國七十九年十月十一日，范鳳龍放下手術刀，結束了一輩子的勞碌，回到天主的懷抱。葬禮那天，由七十八位護士捧著七十八束鮮花，向他七十八歲的人生致敬。全臺各地有好幾千人來參加他的葬禮，大家很不捨，都來送他最後一程，感謝這位用手術刀守護臺灣人的「O-ki」醫生。

    他不是傳教士，卻用盡一生的力量，傳達天主之愛。他就是這麼一個，做了遠超過上帝要他所做的人。

    范鳳龍曾寫信給剛從醫學院畢業的姪女，說：「你要學著去愛病人，不要失望，勇往直前、善待病人，不要為了追求自己的身分地位而工作，反而要設法常常用愛心去幫助病人。」

