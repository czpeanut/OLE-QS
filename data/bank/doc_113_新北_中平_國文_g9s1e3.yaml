- id: doc_113_新北_中平_國文_g9s1e3_s1_36
  section: 1
  number: 36
  type: single
  page: 6
  stem: 依據上文，何者符合作者對收藏書籍的看法？
  options:
  - label: A
    content: 屬於生活舒適優渥者的享樂
  - label: B
    content: 如把玩骨董古玩般偏重實體
  - label: C
    content: 能熟悉版本裝幀已算是入門
  - label: D
    content: 了解背景掌故堪稱登堂入室。
  group_stem: '(六)閱讀下文，回答第36～37 題：

    我已記不起，從哪天開始才明白，書其實永遠買不完，也讀不完。也忘了又是從哪一朝一夕起，不單單渾不思改弦更轍，反而從之前的「漸悟」翻然「頓悟」：事已如此，何妨繼續任著性子，把書買回家，當它是最特別的「室友」，朝夕相對，而不試圖徹底「消化」那一落落、一排排，往往只讀了梗概，或幾頁幾行不等，即使再花幾輩子也不可能讀完的藏書？

    同屬收藏，然以骨董古玩等可把玩的「實物」看待「書之實體」，怕還僅見其表層。書迷們若只從版本到作者題簽，從紙墨到設計裝幀下手，美則美矣，畢竟只停留在愛書人藉以演奏「書之實體」的第一樂章，形同門外漢窺夫子門牆，「尚不得其門而入」，第二樂章始可言「入室登堂」，得見「宗廟之美，百官之富」。歷史是第二樂章的莊嚴動機，掌故則是它輕快、不乏詼諧及奇想的副動機，這也是書友最愛徜徉的「舒適圈」，舉凡時代思潮、文人風尚、大小文史掌故，林林總總，盡入囊中。但第二樂章寓重於輕，除了引領讀者發發思古幽情，自有其冷肅厚重的一面，不管是「悲憤著書」或「怨毒著書」，不管是司馬遷或魯迅，所謂藏之名山，「俟後世聖人君子」，追究起來，豈不正是為了蕭條異代不同時，那少數心有戚戚焉的讀書人。此時接踵而至的第三樂章，格局豪邁，氣象萬千，合該是千古文化傷心人的一番滄桑與感慨矣。
    (改寫自楊澤〈古書比包包耐人玩味〉)'
