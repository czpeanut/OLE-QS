  group_stem: '(二)

    Enzo, the baby animal, is always happy until one day a bird flies above him. From
    that day on, his eyes follow every bird.

    " (4) , Enzo?"

    "I''m watching those birds, Mom. They can fly, but I can''t. "

    "You don''t have wings, but birds do. "

    "Can I make wings with the tree leaves? I can tie the wings to my arms, and maybe
    after that I can fly."

    "That can''t change you into a bird, Enzo. But you fly every day. Don''t you know?"

    "Really? "

    "Yes! You can jump and fly from tree to tree."

    "You are right, Mom. "

    Enzo is happy again. He practices his jumps, and he puts his all into every jump.
    He doesn''t have wings, but now he can "fly."


