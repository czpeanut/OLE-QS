    Opening Time: Tuesday-Friday: 9 a.m. ~ 12 p.m. ; 1 p.m. ~ 5 p.m.

    Saturday - Sunday: 9 a.m. ~ 12 p.m. ; 1 p.m. ~ 6 p.m.


    Price:

    *NT$100 for one person.

