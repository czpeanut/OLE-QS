  group_stem: '(37~39)

    Some people love wildlife tourism. They like to visit places such as zoos and
    aquariums. The animals there are mostly still wild. Sometimes, these places have
    special experiences for guests. Visitors might get to pet, feed, or even hold
    the animals. Wildlife tourists also enjoy going to places where animals live in
    the wild. For example, many people enjoy going to Africa. They can go on a safari
    there and see animals in their natural environment. Wildlife tourists might also
    take a boat out to sea. They''ll be on the watch for whales and other sea animals.
    However, they might not always be lucky enough to see them.'
