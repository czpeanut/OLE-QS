  group_stem: '(43~45)

    Take a look at the two photos, and you can see the big transformations in cellphones.


    Cellphones were first out in 1973. These old cellphones were big and heavy. The
    first cellphones, Motorola DynaTAC 8000X, were over one kilogram. Another name
    for them was "brick phones" because they were like bricks. There was no camera,
    no Facebook on them. People only used them to make calls. They were very expensive,
    and only few people could buy them.

    Now, cellphones are very different. People call them smartphones because they
    can do a lot of things with their phones. Smartphones are like small computers.
    You can use them to check emails, look at Instagram, play games, watch videos,
    and even work. Smartphones are thin and light. They have good cameras, so you
    can take and share photos and videos. Smartphones help us a lot and they make
    our life convenient . It’s hard to picture a life without them.

    📖 another 另一個 convenient 方便的'
