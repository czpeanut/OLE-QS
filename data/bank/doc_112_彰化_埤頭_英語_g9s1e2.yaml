  section: 3
  number: 41
  type: single
  page: 2
  stem: What is the reading mainly about?
  options:
  - label: A
    content: When to get good luck.
  - label: B
    content: Where to be lucky.
  - label: C
    content: How to become lucky.
  - label: D
    content: Why to get good luck.
  group_stem: "I.\n    People around the world want to be lucky. They try different\
    \ ways to get good luck and to drive bad luck away.\n    In some cultures, a rabbit's\
    \ foot is believed to bring good luck. Therefore, people often carry a man-made\
    \ one with them in order to get good luck.\n    In the US, when people don't want\
    \ to lose their good luck, they will say \"knock the wood\" and do that at the\
    \ same time. They believe the wood spirits will keep them safe.\n    In Taiwan,\
    \ the number 4 sounds similar to the word death. This is why some people don't\
    \ want to live on the fourth floor of an apartment building. What's more, most\
    \ Taiwanese think it's important to clean up their houses before the Chinese New\
    \ Year. By doing so, people believe they can keep bad luck away all year around."
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
