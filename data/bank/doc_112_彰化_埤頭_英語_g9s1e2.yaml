  stem: What does it mean in the dialogue?
  options:
  - label: A
    content: Take care of Alice.
  - label: B
    content: The tickets were all sold out.
  - label: C
    content: Take a trip to Japan.
  - label: D
    content: Have a big dinner.
  group_stem: 'II.

    Sara: I''ve got one ticket for a basketball game. The Bears vs. the Tigers, the
    first-row seat, this Saturday. Interested?

    Ann: Impossible! The tickets were all sold out weeks ago! How could you get the
    ticket?!

    Sara: And a table at Rose.

    Ann: Rose?! But they said they were all booked for the month!

    Sara: Now it is yours. You can enjoy a big dinner after the game.

    Ann: Wait a moment. This is just not like you. What''s the matter?

    Sara: Well, you know this Thursday I will take a trip to Japan, and...

    Ann: And what?

    Sara: And I was wondering if you could take care of Alice next week.

    Ann: The whole week?!

    Sara: Please! I can''t just leave her in my house.

    Ann: You know I hate that stupid bird! And she doesn''t like me, either.

    Sara: You''re my last hope! Please help me.

    Ann: I need to think about it.

    Sara: OK, but not too long.'
