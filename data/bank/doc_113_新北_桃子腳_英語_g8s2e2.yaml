- id: doc_113_新北_桃子腳_英語_g8s2e2_s6_36
  section: 6
  number: 36
  type: single
  page: 3
  stem: What does Lisa mean when she says “They look cooler”?
  options:
  - label: A
    content: She thinks the shoes will help her run faster.
  - label: B
    content: She likes how the red shoes look.
  - label: C
    content: She wants to feel cool in the summer.
  - label: D
    content: She doesn’t like any of the shoes.
  group_stem: '(At a shoe store)

    Lisa: Mom, my sneakers are too old. Can I get a new pair?

    Mom: Sure. Let’s look around and see what we can find.

    (A few minutes later)

    Mom: These black sneakers look nice and are on sale.

    Lisa: Hmm… I like the red ones better. They look cooler.

    Mom: Yes, but the red ones are more expensive.

    Lisa: But I really like them!

    Mom: What about these gray ones? They’re a little cheaper and also look good.

    Lisa: They’re okay… but I still like the red ones more.

    Mom: Well, if you really want them, we can get the red ones.'
