- id: doc_113_新北_五峰_國文_g9s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: '「宮崎駿強調，創意的東西最不應該全球化，他也不希望在自己的作品談國際化。外國觀眾是從異文化中尋找身為『人』的共通點，而不是相異點。因此，在發想創意的時候，無須刻意迎合國際市場，那樣反而失去自己的在地特色。因此，無須一味追求國際化，人性中共同的情感，自然就能跨越國界，感動不同國家的人。」

    下列何者最貼近宮崎駿的主張？'
  options:
  - label: A
    content: 創意必須來自於人性
  - label: B
    content: 創意是力求與眾不同
  - label: C
    content: 創意須結合流行元素
  - label: D
    content: 創意須超越國際水準
