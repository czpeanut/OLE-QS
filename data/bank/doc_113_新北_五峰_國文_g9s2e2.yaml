- id: doc_113_新北_五峰_國文_g9s2e2_s2_30
  section: 2
  number: 30
  type: single
  page: 3
  stem: 根據本文，作者認為人出名後很快變得萎縮的原因為何？
  options:
  - label: A
    content: 一味迎合眾人期望勢難保有自我
  - label: B
    content: 沉迷喝彩而缺乏持續創作的動力
  - label: C
    content: 過度譁眾取寵反而招致批評聲浪
  - label: D
    content: 無法承受名聲帶來的孤獨與疏離
  group_stem: '常聽人說，名人太囂張，但據我觀察，出名後很快萎縮的名人更多。

    萎縮不完全是害怕，大多是應順和期待――應順著眾人炯炯逼視的眼，期待著眾人欲說未說的嘴。貝多芬在一篇書簡中說：「獲得名聲的藝術家常受名聲之苦，使得他們的處女作往往是最高峰。」這就說明了成名之後萎縮的普遍性。

    不管是萎縮還是囂張，都是病態。要克服這種「名人症候」，唯一的辦法是平平穩穩地找回自己。

    我們原本是尋常之人，周圍突然響起了喝彩聲，抬頭一看居然是針對自己的，不免有點驚慌，那就定定神，點頭表示感謝，然後繼續低頭做自己的事吧。如果覺得要為喝彩聲負責，那麼今後的勞作也就成了表演。萬萬不可為延續喝彩而表演，因為譁眾取寵從來就沒有好結果。

    按一般規律，喝彩聲剛剛過去，往往又會傳來起鬨聲和叫罵聲。面對這種情況，仍然要神定氣閒地把持住自己。但是，儘管你不加理會，一陣陣聲浪仍會使你漸漸孤獨。即便是喝彩聲，也會成為一道影影綽綽的圍牆，一種若有若無的距離，使你難於像以前那樣融入四周。

    一個人，如果能夠領悟名譽和寂寞之間的關係，兩相淡然，他也就走出了病態，既不會萎縮，也不會囂張了。

    ――節錄自余秋雨 名譽高處'
