  stem: 根據本文，江國賈人主要是因觀察到何種現象才得以免患？
  options:
  - label: A
    content: 江湖間唯畏大風度
  - label: B
    content: 冬月風作有漸
  - label: C
    content: 唯盛夏風起於顧盼間
  - label: D
    content: 大凡夏月風景，須作於午後
  group_stem: '江湖間唯畏大風度。冬月風作有漸，船行可以為備；唯盛夏風起於顧盼間，往往罹難。曾聞江國賈人有一術，可免此患。大凡夏月風景，須作於午後。欲行船者，五鼓初起，視星月明潔，四際至地，皆無雲氣，便可行，至於巳時即止。如此，無復與暴風遇矣。

    ――沈括 夢溪筆談'
