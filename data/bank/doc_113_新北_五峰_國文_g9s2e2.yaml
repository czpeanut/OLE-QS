  group_stem: '虎丘，中秋遊者尤盛。士女傾城而往，笙歌笑語，填山沸林，終夜不絕。遂使丘壑化爲酒場，穢雜可恨。

    予初十日到郡，連夜遊虎丘。月色甚美，遊人尚稀，風亭月榭間，以紅粉笙歌一兩隊點綴，亦復不惡。然終不若山空人靜，獨往會心。嘗秋夜坐釣月磯，昏黑無往來，時聞風鐸及佛燈隱現林梢而已。

    又今年春中，與無際偕訪仲和於此。夜半月出無人，相與趺坐石臺，不復飲酒，亦不復談，以靜意對之，覺悠然欲與清景俱往也。

    生平過虎丘才兩度見虎丘本色耳。友人徐聲遠詩云：「獨有歲寒好，偏宜夜半遊。」眞知言哉！

    ――李流芳 遊虎丘小記'
