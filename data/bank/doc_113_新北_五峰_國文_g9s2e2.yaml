- id: doc_113_新北_五峰_國文_g9s2e2_s2_32
  section: 2
  number: 32
  type: single
  page: 4
  stem: 根據文意，文中＿＿＿＿＿＿＿處最適宜填入下列何者？
  options:
  - label: A
    content: 有一種矛盾，一種對於清廷立場與歷史認知之間的拉扯
  - label: B
    content: 有一種肯定，一種超然於政治之上，人格的理解與尊敬
  - label: C
    content: 有一種期許，期許鄭成功驅逐荷人的顯赫功績流傳後世
  - label: D
    content: 有一種歷史情懷，一種對於文化根源的深刻反思與珍視
  group_stem: '臺灣的歷史不長，漢字書寫在建築物上銘刻的記憶並不多，但是不乏動人的圖像記憶。

    在清末動盪之時，治理臺灣的沈葆禎努力建設軍防，聘任歐洲建築師設計砲台關防要塞，建成之後，題了「億載金城」四字。

    每當經過那座建築之下，文字書寫的祝願，文字書寫觸動的歷史記憶，使人猛然一醒。建築成為古蹟，更是因為借漢字書寫留下了人的心事。

    沈葆禎在臺灣漢字書寫裡有不能磨滅的意義。在臺南赤崁樓他書寫悼祭延平郡王 鄭成功的碑石――

    開萬古得未曾有之奇，洪荒留此山川，作遺民世界。

    極一生無可如何之遇，缺憾還諸天地，是創格完人。

    作為清代臣子，沈葆禎不會不知道清代史家稱鄭成功為「偽鄭」。清朝政權是不承認鄭氏在臺灣的經營歷史的，但是沈葆禎的書寫裡＿＿＿＿＿＿＿。

    臺灣的漢字書寫裡我常常感謝沈葆禎，使我從幼年開始，心中就有了可以銘刻成碑石的句子，是用大氣又溫厚的書體寫成的漢字，絕沒有職業書匠自以為是的矯情造作。

    建築完成了，想講一兩句話，如果只想到自己是書法家，那麼書法可能就少了「億載金城」的厚重開闊大器與深沉的歷史感吧！

    每次去臺南，都想看寺廟裡的匾額對聯，走進堂廡不很寬大的關聖武廟，抬頭看到掛在高處的「大丈夫」三個字的立匾，武廟空間氣象上的寬闊陽剛氣勢一下子就被這三個字帶出。

    從基隆河谷地貢寮，翻閱草嶺到蘭陽平原的大里，一路上山，有清代總兵劉明燈立的「雄鎮蠻煙」巨石刻字。到了山頂，海風從蘭陽平原長長吹來，風吹草偃，氣勢萬千，風口處一塊巨石，上面狂草大書一「虎」字，氣力萬鈞。一個字，可以鎮住風景，如一夫當關，也是漢字書寫美學在臺灣的一絕。

    ――節錄自蔣勳 漢字書法之美'
