  stem: 1.近年來，每到颱風季常會帶來超大豪雨，有些低窪地方時常發生水患。我國中央政府提供各項治水經費給予地方政府使用，希望能從根本解決水患問題。若依我國相關法令，針對此筆經費的預算與決算審查機關，下列何人的說明是正確的？
  options:
  - label: A
    content: 司法院、行政院
  - label: B
    content: 行政院、立法院
  - label: C
    content: 立法院、監察院
  - label: D
    content: 監察院、司法院
- id: doc_113_台北_仁愛_社會_公民_g8s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '2.下表為幸福國近幾年的中央政府總預算、刪減預算金額及刪減比例之資料。若依表中內容及我國中央政府職權判斷，下列敘述何者正確？

    單位：幸福幣


    | 年度(西元) | (甲)提出預算金額 | (乙)刪減預算金額 | (丙)刪減比例 |

    | :--- | :--- | :--- | :--- |

    | 2017 | 1,200,000,000 | 17,790,000 | 1.5% |

    | 2018 | 1,240,000,000 | 20,000,000 | 1.6% |

    | 2019 | 1,500,000,000 | 20,000,000 | 1.3% |

    | 2020 | 1,600,000,000 | 80,000,000 | 5% |'
  options:
  - label: A
    content: (甲)資料是由司法院提出，並交由監察院審核
  - label: B
    content: (乙)是經由監察院審查後，所做出的調整結果
  - label: C
    content: 根據(丙)判斷，2020 年行政院可能提出覆議案
  - label: D
    content: 未來執行以後，應做成決算交由考試院來審查。
