  stem: 24.法國的雙首長制，總統與總理皆有行政權，且總理與政府閣員須出席國民議會接受質詢，與我國政治制度極為相似。2022 年10 月20 日，法國總理在行政與立法陷入僵局時，宣布動用《憲法》賦予的權力，在國民議會「未決議」的情況下，通過還在審議中的2023
    年度社會保險資金法案，而除非國民議會在24 小時內，對總理的作為表達不滿,通過(甲)要求下台反制否則該項法案即被視為通過。反觀我國，則有《憲法增修條文》規定的(乙)制度來處理僵局，即行政院如果無法接受立法院「已決議」的法律案、預算案、條約案，得經總統核可送回立法院再作決議，若立法院維持原決議,行政院院長必須接受。上文中的甲乙應分別填入下列何者?
