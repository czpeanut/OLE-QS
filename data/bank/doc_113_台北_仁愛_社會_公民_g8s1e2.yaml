  section: 1
  number: 7
  type: single
  page: 1
  stem: '7.請參閱附圖所示的新聞資料，判斷文中所說的某機關，應為下列何者？


    自治條例過關

    基隆拆違建要收費


    為維護市民生活品質、守護城市景觀，某機關於西元2020 年1 月通過《基隆市違章建築強制拆除收費自治條例》，規定在西元2012 年4 月2 日以後的違建，民眾必須自行拆除或由政府強制拆除後收費。「基隆都市發展處」也表示此條例應能遏止新違建增加，期待基隆市門面得以愈來愈美麗。'
  options:
  - label: A
    content: 立法院
  - label: B
    content: 基隆市議會
  - label: C
    content: 基隆市政府
  - label: D
    content: 基隆都市發展處。
