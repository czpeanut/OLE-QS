    公里處的達拉維貧民窟； 那些跳車廂的『旅人』，多數是來自高原區的偏鄉，他們沒錢購買車票，為了謀生只能趁列車速度減緩的時刻下車，留在達拉維的染布廠、曬衣場、洗衣場、資源回收場打工，或若有機會被星探相中、躍上大銀幕，又是另一種成就。達拉維依附著孟買而發展，也成為了孟買廉價勞力與幫傭的供應地…」
    （資料來源：改寫自《走在夢想的路上》，謝哲青，2014）'
