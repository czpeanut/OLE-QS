- id: doc_113_新北_蘆洲_英語_g9s1e2_s5_41
  section: 5
  number: 41
  type: single
  page: 4
  stem: What can you learn about the Navajo and their language?
  options:
  - label: A
    content: They have given up their chance to live in the US.
  - label: B
    content: Navajo has only ever been a spoken language.
  - label: C
    content: Their language has been spoken in Japan since World War II.
  - label: D
    content: Navajo is among the most used Native American languages.
  group_stem: "Ⅰ.\n    Do you know what language the Navajo speak? They speak Navajo!\
    \ It is one of the most spoken languages among all the many Native American languages.\
    \ There are now around 200,000 speakers in the US.\n    In the past, Navajo was\
    \ still not a written language, so it was not known by many people outside of\
    \ the Navajo Nation. That made it the perfect choice to be used as a code during\
    \ World War II. Besides, there was a special group of Navajos called code talkers.\
    \ They created and sent coded messages of important plans for the US. The Japanese\
    \ couldn’t decipher what the messages were about. In fact, they were never able\
    \ to break the code.\n    In 2002, a story about these Navajos hit the big screen.\
    \ The movie was called Windtalkers, and it showed how two Navajo code talkers\
    \ helped the US successfully defeat Japan. (L4)\n※ The Navajo ([(nQvə)ho]) are\
    \ a group of Native American people. Most of them live in the southwestern United\
    \ States. They are one of the largest tribes in the US.\n* Native American 美洲原住民\n\
    Nation 保護區；保留地 World War II 第二次世界大戰\ncode 密碼 coded 用密碼書寫的 defeat 擊敗\nsouthwestern\
    \ 西南的 tribe 部落"
