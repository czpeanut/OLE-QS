- id: doc_112_彰化_埤頭_國文_g7s2e2_s4_48
  section: 4
  number: 48
  type: single
  page: 3
  stem: 根據本文，「即使土狼距離別的角馬比距離小角馬還近些，牠也不改變目標。」其中原因為何？
  options:
  - label: A
    content: 小角馬的反應較慢
  - label: B
    content: 土狼的食量就是一隻小角馬
  - label: C
    content: 土狼經過觀察後，認定小角馬是唯一的獵物
  - label: D
    content: 小角馬較其他角馬肥美。
  group_stem: '(四)

    每次遇到好玩又不專心的孩子，我都要說個故事。那是我在教育臺的非洲影片裡見到的——

    一群小角馬在嬉戲，其中一隻特別活潑，忽左忽右地又蹦又跳，還一下子飛快地衝到遠處，再突然停住，頭一扭，跑回同伴的身邊。

    遠處有一隻土狼，蹲在那兒，靜靜地看；牠不動，直到小角馬跑累了，停下來，土狼才突然衝過去。

    在那紀錄影片裡，鏡頭拉開，成為大遠景，只見草原上成千上百隻角馬。但是土狼只追那一隻小角馬，牠認準目標，好像面對仇人一般：「就是牠！」即使土狼從其他角馬身邊跑過，距離別的角馬比距離小角馬還近些，牠也不改變目標，追到底。

    小角馬確實快，快得平常土狼絕對追不上。只怪牠先前又蹦又跳，消耗了太多體力，土狼又窮追不捨。小角馬終於不支，被土狼一口咬死。

    你可以愛玩，但是要由小角馬的教訓中知道，玩要得看時候、場合，不要因為貪玩而耗費體力、失去戒心。

    你想成功，就要學習土狼的專心，牠不急不躁、靜靜觀察，等待最佳的時機才出手，而且既然認定目標，就鍥而不捨、奮鬥到底。

    (劉墉 土狼與角馬)'
