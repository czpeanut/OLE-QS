- id: doc_112_彰化_埤頭_國文_g7s2e2_s4_42
  section: 4
  number: 42
  type: single
  page: 2
  stem: 根據圖文，下列關於跳水比賽的敘述，何者最恰當？
  options:
  - label: A
    content: 史上第一場跳水比賽是在室內舉行
  - label: B
    content: 入水時水花的大小會影響分數高低
  - label: C
    content: 奧運比賽的單人賽必須配置11名評審
  - label: D
    content: 使用跳板起跳就可以獲得比較高的分數。
  group_stem: '(二)

    挑戰勇氣的跳水，是世上最吸睛的運動比賽之一。跳水選手必須體態優美且靈活。他們會從數公尺高的跳臺躍入水中，同時做出大膽的動作。首先，選手必須站上跳臺，以直立或倒立的姿勢起跳。而有些比賽採用跳板起跳，可以輔助跳水者跳得更高、騰空的時間更久。跳水選手會在身體開始下降時，表演一系列抱膝、旋轉、隱翻、轉體與其他大膽精巧的動作，最後盡可能順暢入水。歷史上有紀錄的第一場跳水比賽是在1871年舉行，當時的選手要從倫敦橋跳下泰晤士河。現今的跳水有個人比賽，也有雙人比賽。


    起跳：

    選手由跳臺躍入水中，起跳動作可以是向前、向後或者倒立。


    騰空：

    起跳後到入水前，選手處於騰空的狀態，此時會開始表演旋轉與轉體一系列的動作。


    跳水比賽規則：

    ●每位評審各自針對選手的每一次跳水評分，分數的範圍為0分(失敗)到10分(極好)。

    ●滿分為10分，針對起跳、騰空、入水動作，各部分最高可以給3分，剩下的1分則評定整體動作執行的完善程度。

    ●比賽前，選手必須先繳交跳水動作表，設定每一跳的動作難度，比賽時只能依照動作表完成跳水，否則以0分計算。

    ●奧運個人賽計分時，2個最高分與2個最低分不予採計，僅採計中間3名評審的分數後，再乘以動作的難度係數，最後算出該次跳水的得分。

    ●每一跳的得分皆須採計。


    評分：

    評審團針對選手每一次的跳水評分。評審的數量會因比賽的規模而有所差異，以奧運比賽為例，個人賽配置7名評審，雙人跳水則配置11名評審。


    入水：

    當選手入水的時候，濺起水花能緩和衝擊，但評審想看到的是簡潔流暢的入水，激起太大的水花會遭到扣分。'
