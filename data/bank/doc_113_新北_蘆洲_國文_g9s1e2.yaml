  group_stem: '天鏡園 浴鳧堂，高槐深竹，樾①暗千層，坐對蘭蕩，一泓②漾之，水木明瑟③，魚鳥藻荇，類若乘空④。余讀書其中，撲面臨頭，受用一綠⑤，幽窗開卷，字俱碧鮮。

    每歲春老，破塘筍必道此⑥。輕舠飛出，牙人⑦擇頂大筍一株擲水面，呼園中人曰：「撈筍！」鼓枻⑧飛去。園丁划小舟拾之，形如象牙，白如雪，嫩如花藕，甜如蔗霜。煮食之，無可名言，但有慚愧。

    （張岱 天鏡園）

