  group_stem: "2014 年誕生的《勝利廚房》隸屬勝利基金會，勝利基金會20 多年來專注做一件事情：促進多元障別的身心障礙朋友就業。\n    勝利廚房目前身心障礙工作團隊有17\
    \ 位左右，因為多元障別在工作崗位上反而可以截長補短。這裡是社會企業，他們給的薪水完全比照勞基法標準，想提供給客人的是真實力的安心美味好食，而不是客人的愛心施捨幫幫忙的同情。\n\
    \    優質環境帶動身障者的職涯成長，但也伴隨著挑戰。勝利廚房張湘蓉經理分享了團隊中身障同仁經驗，娓娓道來芊芊的故事。這位簡單、善良，喜歡烘焙的女孩，在可信任的環境裡被支持而不斷成長。湘蓉說「她的內驅力很強，內心有股想把一件事做好的強烈意願。老師在教導時，她會很主動幫忙，成為老師的得力小幫手」。後來有機會她應徵到外面更好的職場去工作，提出辭呈後同仁們都不捨，然而上班前居然又有其他轉折，因為疫情那家新公司不缺人手了。失望的芊芊嚎啕大哭，「我們陪著她懷抱希望、失望，到平撫自己情緒的心路歷程。」然而這也是一個學習成長的機會，她強調「我們希望身障同仁在這環境也要學會同理團隊夥伴，懂得包容與合作；也要有平常心，不要認為身障就是要有特殊待遇，要透過勞務付出自己的心力，來獲得報酬。」\n\
    \    今年(2022)三月勝廚和台灣海洋保育與漁業永續基金會合作，舉辦海洋教育系列課程──海漁食堂，半年多來中午推出幸福餐盒鯖魚便當。湘蓉希望勝利廚房可以讓更多人正確地認識到，大家願意進來坐坐，看見身障朋友的努力與亮點，在你消費的同時，也成就一些更有社會價值的事情。\n\
    （節錄自 張惠娟 身心障礙者職涯夢想啓飛的基地──勝利廚房）"
