    content: 自然美景勝過虛假的文章。
  group_stem: '夫天地者萬物之逆旅①；光陰者百代之過客。而浮生若夢，為歡幾何？古人秉燭夜遊，良有以也。況陽春召我以煙景，大塊假我以文章。會桃李之芳園，序天倫之樂事。群季②俊秀，皆為惠連③；吾人詠歌，獨慚康樂④。幽賞未已，高談轉清⑤。開瓊筵以坐花，飛羽觴而醉月。不有佳詠，何伸雅懷⑥？如詩不成，罰依金谷酒數⑦。

    （李白 春夜宴桃李園序）

    註解：

    ①逆旅：客舍

    ②群季：諸位堂弟

    ③惠連 ：謝惠連，南朝詩人，早慧

    ④康樂 ：南朝劉宋時山水詩人謝靈運，襲封康樂公，世稱謝康樂

    ⑤「幽賞」二句：一邊欣賞著幽靜的美景，一邊談論著清雅的話題

    ⑥何伸雅懷：怎能抒發高雅的情懷

    ⑦金谷 酒數：金谷，園名，晉石崇於金谷澗(在今河南洛陽西北)中所築，他常在這裏宴請賓客。其《金谷詩序》：「遂各賦詩，以敘中懷，或不能者，罰酒三斗。」後泛指宴會上罰酒三杯的常例'
