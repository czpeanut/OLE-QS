  type: single
  page: 1
  stem: 下列有關孟子的說明，何者錯誤？
  options:
  - label: A
    content: 是孔子學生，主張性善論、民貴君輕
  - label: B
    content: 是戰國時期著名的思想家與教育家
  - label: C
    content: 曾經周遊列國，畢生闡揚孔子思想
  - label: D
    content: 與弟子萬章、公孫丑等編著孟子一書。
- id: doc_113_新北_蘆洲_國文_g9s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 關於孟子一書的說明，下列何者敘述正確？
  options:
  - label: A
    content: 散文善用譬喻與寓言說理，氣勢雄健
  - label: B
    content: 篇名取自篇首開頭幾個字，有特定的涵義
  - label: C
    content: 與論語同為紀傳體，可從書中了解孟子思想
  - label: D
    content: 與論語、老子、莊子合稱「四書」。
- id: doc_113_新北_蘆洲_國文_g9s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 海倫．凱勒說：「我常想，如果每一個人在其成年的早期，有幾天時間能成為瞎子與聾子，應不失為一件幸事。黑暗將使他更珍惜視力，寂靜將教他領略聲音的美妙。」根據這段話，下列何者解讀正確？
  options:
  - label: A
    content: 把活著的每一天看作生命的最後一天
  - label: B
    content: 最值得高度珍惜的莫過於每一天的價值
  - label: C
    content: 無法擁有不是一種罪過
  - label: D
    content: 人往往因擁有而不珍惜。
- id: doc_113_新北_蘆洲_國文_g9s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 閱讀詩詞可以感受到作者的特殊情懷，下列何者說明正確？
  options:
  - label: A
    content: 孤帆遠影碧山盡，惟見長江天際流：歡樂愉悅
  - label: B
    content: 春風又綠江南岸，明月何時照我還：愛戀情愁
  - label: C
    content: 胡未滅，鬢先秋，淚空流：壯志未酬
  - label: D
    content: 春風得意馬蹄疾，一日看盡長安花：遊子思鄉。
- id: doc_113_新北_蘆洲_國文_g9s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 下列典故出自孟子的成語，何者用法錯誤？
  options:
  - label: A
    content: 學習要循序漸進，不能揠苗助長
  - label: B
    content: 想考好學校就要勤學苦讀，若單靠求神拜佛無疑是緣木求魚
  - label: C
    content: 憑他在商場的人脈，做起生意來總是左右逢源，一帆風順
  - label: D
    content: 舉辦防災演練，就是要大家具有始作俑者的警覺心，真正遇到災禍才能臨危不亂。
- id: doc_113_新北_蘆洲_國文_g9s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 「一個從來不入廚房的人，留學在外，居然燒得一手好菜，因環境逼。一個登山者，跳過一條他平時絕不敢跳的深溝，因為有隻野獸逼。所幸世界上有『逼』這件事，我們才能超越自己，完成超出自己能力的事。」這個故事是要告訴我們何種道理？
  options:
  - label: A
    content: 有為者譬若掘井，掘井九仞而不及泉，猶為棄井也
  - label: B
    content: 行拂亂其所為，所以動心忍性，曾益其所不能
  - label: C
    content: 恥之於人大矣。為機變之巧者，無所用恥焉
  - label: D
    content: 養心莫善於寡欲。其為人也寡欲，雖有不存焉者，寡矣。
- id: doc_113_新北_蘆洲_國文_g9s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 一家手語餐廳的誕生一文中所使用的修辭，下列何者說明有誤？
  options:
  - label: A
    content: 不知在這塊以人情味著稱的土地上，究竟何時何處才會有手語餐廳、黑暗餐廳的出現呢─設問
  - label: B
    content: 在咱們臺灣，處處餐廳林立，種種美食不斷挑戰人們的味蕾─轉化
  - label: C
    content: 馬克‧吐溫的語錄提到：「仁慈是一種聾子能聽見、盲人能看見的語言」─引用
  - label: D
    content: 他的初心，獲得祝福；他的發心，獲得廣大社會的回應；他的善心，獲得聽障朋友一致的肯定─層遞。
  lesson_raw:
    title: 一家手語餐廳的誕生
    basis: 題目提及課名「一家手語餐廳的誕生」
- id: doc_113_新北_蘆洲_國文_g9s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 關於與宋元思書一文的寫作手法，下列敘述何者錯誤？
  options:
  - label: A
    content: 第一段總述遊江背景，點出全文綱領
  - label: B
    content: 二、三段運用視覺摹寫分述異水與奇山
  - label: C
    content: 用映襯法描寫寒樹，藉此烘托山勢的高遠連綿
  - label: D
    content: 末段則補述濃蔭蔽天的景象。
  lesson_raw:
    title: 與宋元思書
    basis: 題目提及課名「與宋元思書」
- id: doc_113_新北_蘆洲_國文_g9s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 馬克．吐溫：「仁慈是一種聾子能聽見、盲人能看見的語言。」關於這句話，下列何者敘述最恰當？
  options:
  - label: A
    content: 助人的雙手比祈禱的雙唇更神聖
  - label: B
    content: 仁慈在平凡日常中無須外求
  - label: C
    content: 就算是仁慈，也無法達到真正的心靈溝通
  - label: D
    content: 仁慈是不問族群、不分彼此的關懷之心與體貼之心。
- id: doc_113_新北_蘆洲_國文_g9s1e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 關於生於憂患死於安樂一文的寫作手法，下列敘述何者正確？
  options:
  - label: A
    content: 先舉例後論證，藉言例說理，旁徵博引，信而有徵
  - label: B
    content: 作者以六位歷史人物為例，說明「數典忘祖」的道理
  - label: C
    content: 善用排比、類疊等修辭手法，營造文章磅礡的氣勢
  - label: D
    content: 「生於憂患，而死於安樂」以層遞作結，主旨明確。
  lesson_raw:
    title: 生於憂患死於安樂
    basis: 題目提及課名「生於憂患死於安樂」
- id: doc_113_新北_蘆洲_國文_g9s1e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 「困於心，衡於慮，而後作」以上三句都省略主語，其主語分別是指誰？
  options:
  - label: A
    content: 三句都是指別人
  - label: B
    content: 三句都是指自己
  - label: C
    content: 前兩句是指別人，後一句是指自己
  - label: D
    content: 前兩句是指自己，後一句是指別人。
- id: doc_113_新北_蘆洲_國文_g9s1e2_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 下列是月芽與班上同學討論「駢文」的對話內容，何人的說明錯誤？
  options:
  - label: A
    content: 月芽：注重用典，力求文辭華美
  - label: B
    content: 霏華：大量對偶句法，偶數句必須押韻
  - label: C
    content: 禹書：盛行於南北朝，又稱四六文
  - label: D
    content: 君澤：講究音律和諧，平仄相從。
- id: doc_113_新北_蘆洲_國文_g9s1e2_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 「入則無法家拂士，出則無敵國外患者，國恆亡。」這段話的道理為何？
  options:
  - label: A
    content: 有默默諛臣者，其國亡
  - label: B
    content: 不經一番寒徹骨，焉得梅花撲鼻香
  - label: C
    content: 得之於人者太多，出之於己者太少
  - label: D
    content: 忍一時風平浪靜，退一步海闊天空。
- id: doc_113_新北_蘆洲_國文_g9s1e2_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 下列關於各文句的詮釋，何者說明正確？
  options:
  - label: A
    content: 「從流飄蕩，任意東西」指作者的心情悠閒自適
  - label: B
    content: 「游魚細石，直視無礙」指富春江水深浪大，屬於動態描寫
  - label: C
    content: 「泉水激石，泠泠作響」藉天籟盈耳，書寫山谷的生機蓬勃
  - label: D
    content: 「疏條交映，有時見日」指枝葉稀疏，很容易看到陽光。
- id: doc_113_新北_蘆洲_國文_g9s1e2_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 若要題字贈送友人，希望藉此鼓勵他滌盡俗慮，忘卻官場紛擾，樂享逍遙寫意的生活。下列選項何者最不適合？
  options:
  - label: A
    content: 採菊東籬下，悠然見南山
  - label: B
    content: 身無半畝，心憂天下；讀破萬卷，神交古人
  - label: C
    content: 鳶飛戾天者，望峰息心；經綸世務者，窺谷忘返
  - label: D
    content: 久在樊籠裡，復得返自然。
- id: doc_113_新北_蘆洲_國文_g9s1e2_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 托爾斯泰：「人都會有缺陷，就像被上帝咬過的蘋果，有的人缺陷比較大，正是因為上帝特別喜歡他的芬芳。」下列何者最接近這句話的主旨？
  options:
  - label: A
    content: 人生必須活得充滿上進心，不要背對著生活
  - label: B
    content: 處身不妨薄，待人不妨厚
  - label: C
    content: 人的不完美，是等待被發現的祝福
  - label: D
    content: 施仁慎勿念，受施慎勿忘
- id: doc_113_新北_蘆洲_國文_g9s1e2_s1_23
  section: 1
  number: 23
  type: single
  page: 3
  stem: 下列「　」中的量詞，何者使用不當？
  options:
  - label: A
    content: 一「堂」學問
  - label: B
    content: 一「節」車廂
  - label: C
    content: 一「方」匾額
  - label: D
    content: 一「番」心意。
- id: doc_113_新北_蘆洲_國文_g9s1e2_s1_24
  section: 1
  number: 24
  type: single
  page: 3
  stem: 「天下之事，常發於至微，而終為大患；始以為不足治，而終至不可為。」這段敘述，最可能是在印證下列何者？
  options:
  - label: A
    content: 人生需勇敢迎向挑戰，積極進取
  - label: B
    content: 即使災禍加身，也要捍衛真相絕不苟且偷安
  - label: C
    content: 行事當知未雨綢繆，不可掉以輕心
  - label: D
    content: 君子獨處暗室，亦居心端正坦誠磊落。
- id: doc_113_新北_蘆洲_國文_g9s1e2_s1_25
  section: 1
  number: 25
  type: single
  page: 3
  stem: 下列文句，何者沒有語病？
  options:
  - label: A
    content: 我寧可早點出門，還不如匆匆忙忙地趕公車
  - label: B
    content: 除非你洗心革面，否則無法邁向新的人生
  - label: C
    content: 與其下雨天出門逛街，或者在家好好看書
  - label: D
    content: 儘管他對講演稿早已爛熟於心，站上舞台總是緊張的手心冒汗。
- id: doc_113_新北_蘆洲_國文_g9s1e2_s1_26
  section: 1
  number: 26
  type: single
  page: 3
  stem: 「人生最不幸處，是偶一失言而禍不及，偶一失謀而事倖成，偶一恣行而獲小利，後乃視為故常，而恬不為意。則莫大之患，由此生矣。」這段話的涵義，與下列何者最接近」？
  options:
  - label: A
    content: 不要因為小惡無害而作惡，否則大禍將至
  - label: B
    content: 做人要從根本做起，建立正確的價值觀
  - label: C
    content: 人非聖賢，有過則勿憚改
  - label: D
    content: 為人處事要光明磊落，不欺暗室。
- id: doc_113_新北_蘆洲_國文_g9s1e2_s1_27
  section: 1
  number: 27
  type: single
  page: 3
  stem: 荀子 勸學篇：「行衢道者不至，事兩君者不容。」這句話在強調為學首重為何？
  options:
  - label: A
    content: 溫故知新
  - label: B
    content: 學思並重
  - label: C
    content: 知行合一
  - label: D
    content: 專心致志。
- id: doc_113_新北_蘆洲_國文_g9s1e2_s1_28
  section: 1
  number: 28
