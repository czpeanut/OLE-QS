- id: doc_112_彰化_福興_社會_歷史_g8s2e1_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 根據資料一『在清朝的藩屬國○○發生兵變時，駐守○○，並協助○○訓練軍隊控制局勢……』文中○○是指何地？
  options:
  - label: A
    content: 台灣
  - label: B
    content: 朝鮮
  - label: C
    content: 越南
  - label: D
    content: 緬甸
  group_stem: '六、下列三則資料，是民初政治局勢與某位政治人物相關資料。

    資料一：「甲」出身清末的地方軍隊，在清朝的藩屬國○○發生兵變時，駐守○○，並協助○○訓練軍隊控制局勢。兩年後，○○因內亂，而後清朝與日本出兵介入，輾轉演變成清朝與日本打仗的甲午戰爭。期間「甲」的表現突出，因此被派往督練「新軍」，此兵力後來成為清末陸軍的主力。

    資料二：「甲」廢除《乙》，頒布新憲法，將內閣制改為總統制，包括外交大權歸諸總統，宣戰、締約不必經參議院；總統宣布戒嚴，不必經參議院，憲法起草權歸諸總統及參議院。此外，公布《大總統選舉法》，規定總統任期
    10 年，可以連選連任。

    資料三： 1916 年後，北洋集團分裂很多派系和，各據一方的人士與各地的將領，紛紛擴張勢力，國家紛亂，居民流離失所。'
