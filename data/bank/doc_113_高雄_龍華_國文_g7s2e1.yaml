- id: doc_113_高雄_龍華_國文_g7s2e1_s3_7
  section: 3
  number: 7
  type: single
  page: 2
  stem: 「這些聲音鐘不但告訴你時刻，也告訴你星期、季節。慢條斯理，喊著『修理沙發哦』的車子經過時，你知道又是週末了。賣麥芽糖、鹹橄欖粉的，照例在星期三出現；賣衛生紙與賣豆腐乳的，都是在星期天下午到達。昨天晚上你也許還吃著燒仙草，今天你忽然聽到他改叫『冷豆花哦』――這一叫，又讓你驚覺春天的確來了。」根據此段，下列何者最符合聲音鐘的功能？
  options:
  - label: A
    content: 聲音鐘只能準確報時，無法反映季節變化
  - label: B
    content: 聲音鐘只有在晴天時才會出現，雨天則完全聽不到
  - label: C
    content: 聲音鐘主要用於提醒人們購買日常用品，與時間無關
  - label: D
    content: 聲音鐘不僅能報時，還能讓人感受到星期與季節變化
  lesson_raw:
    title: 聲音鐘
    basis: 引用陳冠學〈聲音鐘〉課文原文
