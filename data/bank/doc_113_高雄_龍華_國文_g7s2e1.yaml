    \    回到屏東，(Ｂ)春節的爆竹在冷過頭的冬天，有一下沒一下，涼涼的，彷彿浸在水缸裡的酸菜。\n    陪母親臥床，她卻終夜不眠。窗簾拉上，滅了大燈，她的兩眼晶亮，瞪著空濛濛的黑夜，好像瞪著一個黑色的可以觸摸的實體。(Ｃ)她伸出手，在空中捏取我看不見的東西。她呼喚我的小名，要我快起床去趕校車，不要遲到了，便當已經準備好。她說隔壁的張某某「不是個東西」，欠了錢怎麼也不還。她問，「怎麼你爸爸還沒回家，不是說理了髮就馬上回來嗎？」\n\
    \    我到廚房拿熱牛奶給她喝，她不喝。我撫摸她的手，拍她的肩膀，像哄一個嬰兒，但是她安靜了一會兒又開始躁動。我不斷地把她冰冷的手臂放回被窩裡，她又固執地將我推開。我把大燈打開，她的幻覺消失。燈一滅，她又回到四十年前既近又遠、且真且假的彷徨迷亂世界。\n\
    \    大年初三，二○○八年的深夜，若是從外宇宙看過來，這間房裡的燈亮了又暗，暗了又亮，一整夜。\n    清晨四時，我下了床，光腳踩在冰冷的地板上，說：「媽，既然這樣，我們乾脆出去散步吧。」幫她穿上最暖的衣服，圍上圍巾，然後牽著她的手，出了門。\n\
    \    (Ｄ)冬天的街，很黑，犬吠聲自遠處幽幽傳來，聽起來像低聲嗚咽，在解釋一個說不清的痛楚。\n    路底有一家燈火通明的永和豆漿店，我對她說：「走吧，我帶妳去吃妳家鄉浙江\
    \ 淳安的豆漿。」她從夢魘中醒來，乖順地點頭，任我牽著她的手，慢慢走。\n    空蕩蕩的街，只有我，和那生了我的女人。                 \
    \            ――節錄自龍應台《目送•散步》"
