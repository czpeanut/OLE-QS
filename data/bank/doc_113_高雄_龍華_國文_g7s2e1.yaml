  section: 4
  number: 32
  type: single
  page: 6
  stem: 根據上文，請問下列敘述何者正確？
  options:
  - label: A
    content: 整理內容可知，採摘工具的演變為「徒手→蚌殼→石刀→銅」
  - label: B
    content: 過去，只有稻穗因可食而有價值，稻稈會因毫無用途而被丟棄
  - label: C
    content: 「差」引申為不好，是因農耕器具不鋒利，致使穀物收成欠佳
  - label: D
    content: 「利」字簡單字形上下的小點，代表的是成熟豐盈的稻穗粒子
  group_stem: "「差」字的字形，最先應該是    ，就是以手摘取或拔起整株稻禾的樣子。\n  穀類最原始的採收方式．是用手摘取穀穗部分。到了新石器時代，農業較為發展，農作採摘量大，不能一直用手操作，就用蚌殼當工具去割取。後來因為氣候因素，人們北移華北，蚌殼材料不好取得，改為使用内彎的石刀摘取穀穗。後來又覺得只摘取穀穗部分，浪費了其他可以利用的部分很可惜，便進一步使用銳利的銅工具，連莖帶穗一起割下。相形之下，以手摘取穀穗或拔起整株禾莖，是沒有效率的錯誤方式，所以差字就引申有不好的意思。\n\
    \  與差字意義相反的是「利」字。利字在過去字形多樣，最繁的字形   是一隻手握住一株稻禾，以一把刀在根部把禾切割成兩段的樣子。較簡單的字形，有時是有成熟而下垂的稻穗的樣子\
    \    ，有時在刀子的上下還有幾個小點，表現切割的時候產生的細碎雜物。\n  利字包含「銳利」與「利益」兩層意義，前者來自於割刀的銳利，後者來自於提高收割速度的利益。把莖稈子連帶稻穗一起收割，要有相富銳利的刀才辦得到，同時禾稈也可以充作其他用途，例如餵食牛羊或當做薪柴使用。\n\
    \                                                       ――節錄自許進雄《字字有來頭．日常生活篇Ⅱ》"
