  section: 3
  number: 6
  type: single
  page: 1
  stem: 某天小捷一群人去玩密室逃脫，費盡千辛萬苦來到最後一關，出去的線索為「只能以年齡代稱的方式交流」、「須由年齡總和最大的兩人一同解鎖，方能離開」。請問下列組合中，誰才能幫助小捷一行人平安逃出密室？
  options:
  - label: A
    content: 古稀之年的小李和始齔之年的阿昀
  - label: B
    content: 弱冠之年的小捷和不惑之年的阿冠
  - label: C
    content: 知命之年的小定和志學之年的宥宥
  - label: D
    content: 而立之年的靜靜和荳蔻年華的小玲
