  section: 3
  number: 25
  type: single
  page: 4
  stem: "下列「  」的語詞，何者使用完全正確？\n     慧慧在啦啦隊練習結束後，開心的準備回家。卻遇到一位隱身在夜色中突襲的「登徒子」，嚇得她花容失色，還好「孔方兄」即時出手相救，還幫忙把散落一地的東西撿起來，免得「掉書袋」。沒想到隔天消息曝光，兩人卻被「亂點鴛鴦譜」，其實「八字還沒一撇」，怎會有這種「中三元」的消息呢？真是「破天荒」！一定要找出那位製造不實傳言的「捉刀人」！"
  options:
  - label: A
