- id: doc_113_高雄_龍華_國文_g7s2e1_s4_28
  section: 4
  number: 28
  type: single
  page: 4
  stem: 根據上文，歐洲的火車之旅會令人聯想到童話，其中原因為何？
  options:
  - label: A
    content: 火車特意經過童話裡的景點
  - label: B
    content: 窗外的風景如同書冊裡的圖畫
  - label: C
    content: 火車之旅讓人感到童心未泯
  - label: D
    content: 坐火車可欣賞太平洋海濱美景
  group_stem: "在美國住了許多年，卻極少有乘坐長途火車的經驗。美國東北部鐵路網的那些火車，業務通勤的功能遠遠大過旅行觀光。十九世紀修建得那樣辛苦壯觀的北美洲橫貫鐵路，基本上是用來運貨，還不曾聽到哪個人是搭乘火車橫跨北美的。即便是景色最美的那段南加州沿太平洋海濱的鐵路線，也無法吸引到多少乘客。\n\
    \  歐洲火車適合載著好奇的心靈到遠方旅行，那會令人聯想到童話，是因為鐵路經過的那些城堡、草原、丘陵、風車、吊橋，就像是書冊裡放大的圖畫。我曾經從瑞典乘火車到挪威，峽灣的冰河壯麗寂靜，緩緩地卷軸般在車窗外舒展，只有從火車眺望才不會干擾那分莊嚴肅穆的美。\n\
    \  青藏高原的火車之旅，讓我見識了山岳的威猛。夜裡一片朦朧，只能隱約覺知火車速度在減緩，越來越緩，想來是在進行艱難的爬山。掀開窗帘一角向外窺視，全是一片漆黑，只遠處有極稀疏的燈火，還有移動的小光點，那是莽莽天地間與我們火車線平行的青藏公路上的夜行貨車。星空似乎很近，燦爛無比的繁星像瀑布般，一路灑落到人間。\
    \                                                               ――改寫自李黎〈海、大地與山〉"
  tags:
