- id: doc_113_高雄_龍華_國文_g7s2e1_s3_5
  section: 3
  number: 5
  type: single
  page: 1
  stem: 一名國文老師日前在上課時，問底下學生：「林黛玉是絳珠仙草轉世，那麼仙草的量詞是什麼？」當時臺下有人立刻回答「一碗」。「量詞」若不慎誤用容易貽笑大方。下列量詞的使用，何者最不適當？
  options:
  - label: A
    content: 他珍藏著一「幀」郵票，圖案精美，極具收藏價值
  - label: B
    content: 這是一「樁」令人震驚的新聞事件，引起廣泛討論
  - label: C
    content: 這篇文章缺乏任何實證依據，完全是一「派」胡言
  - label: D
    content: 她小心地收藏著一「綹」青絲，寄託對故人的思念
  tags:
