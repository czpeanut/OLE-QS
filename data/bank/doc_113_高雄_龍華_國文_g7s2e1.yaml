- id: doc_113_高雄_龍華_國文_g7s2e1_s4_30
  section: 4
  number: 30
  type: single
  page: 5
  stem: 關於上文畫線處文句的說明，下列何者詮釋有誤？
  options:
  - label: A
    content: 作者仔細描寫捲收大字報的細膩動作，強調對母親的深情與母親已經無法辨識字的現實
  - label: B
    content: 報竹聲原本象徵節慶的歡樂，對於作者來說卻宛如水缸中的酸菜，傳達難以言喻的酸楚
  - label: C
    content: 使用戲劇化的語言，誇大失智的母親困在回憶的迷亂世界中，與清醒時的冷靜強烈對比
  - label: D
    content: 藉「冬夜的街」與「犬吠聲」烘托散步的氛圍，流露不捨母親逐漸走向衰老的親情羈絆
  group_stem: "回屏東看母親之前，家萱過邊境來訪。細緻的她照例帶了禮物。一個盒子上寫著「極品燕窩」。\n    我打開看一下，黑溜溜的一片，看不懂。只認得盛在瓷碗裡頭加了冰糖的白糊糊又香又甜的燕窩；這黑溜溜的原始燕窩――是液體加了羽毛、樹枝嗎？還真不認識。不過，家萱當然是送給母親吃的，我不需操心。\n\
    \  她又拿出一個圓筒，像是藏畫的。一捲紙拿出來，然後一張一張攤開，她說：「我印得多了，想想也許你媽可以用。」海報大小的白紙，印著體積很大、油墨很濃的毛筆字，每一張都是兩三行，內容大同小異：\n\
    最親愛的媽媽：\n我們深愛您。您的房子、看護、醫藥費，我們全都付了。我們承諾，一定竭盡所能照料您。請您放心。\n                     \
    \                                       您的孩子：家萱、家齊、家仁\n    我看著家萱，忍不住笑。上一回，我們在交換「媽媽筆記」時，她說到八十歲的母親在養老院裡如何如何地焦慮自己沒錢，懷疑自己被兒女遺棄，而且，一轉身就忘記兒女剛剛來探視過而老是抱怨孩子們不記得她。我則拿出自己「製造」的各種銀行證明、撫養保證書，每一個證明都有拳頭大的字，紅糊糊、威風凜凜的印章，每一張都有一時的「安心」作用。沒想到家萱進步神速，已經有了獨家的「大字報」。\n\
    \    「是啊，」她笑著說，「我用海報把她房間的牆壁貼得滿滿的。她在房間走來走去，可以一張一張讀，每一張我們姐弟都給簽了名。」\n    「有效嗎？」 \
    \  她點頭，「還真有效，她讀了就安心。」   「你拿回屏東，貼在你媽房裡吧。」\n    她的笑容，怎麼看都是苦的。我也發現，她的白髮不知何時也多了。\n\
    \    (Ａ)我把大字報一張一張拾起，一張一張疊好，捲起，然後小心地塞回圓筒。搖搖頭，「媽媽又過了那個階段了。她已經忘了字了。我寫的銀行證明，現在她也看不懂了。」\n\
    \    回到屏東，(Ｂ)春節的爆竹在冷過頭的冬天，有一下沒一下，涼涼的，彷彿浸在水缸裡的酸菜。\n    陪母親臥床，她卻終夜不眠。窗簾拉上，滅了大燈，她的兩眼晶亮，瞪著空濛濛的黑夜，好像瞪著一個黑色的可以觸摸的實體。(Ｃ)她伸出手，在空中捏取我看不見的東西。她呼喚我的小名，要我快起床去趕校車，不要遲到了，便當已經準備好。她說隔壁的張某某「不是個東西」，欠了錢怎麼也不還。她問，「怎麼你爸爸還沒回家，不是說理了髮就馬上回來嗎？」\n\
    \    我到廚房拿熱牛奶給她喝，她不喝。我撫摸她的手，拍她的肩膀，像哄一個嬰兒，但是她安靜了一會兒又開始躁動。我不斷地把她冰冷的手臂放回被窩裡，她又固執地將我推開。我把大燈打開，她的幻覺消失。燈一滅，她又回到四十年前既近又遠、且真且假的彷徨迷亂世界。\n\
    \    大年初三，二○○八年的深夜，若是從外宇宙看過來，這間房裡的燈亮了又暗，暗了又亮，一整夜。\n    清晨四時，我下了床，光腳踩在冰冷的地板上，說：「媽，既然這樣，我們乾脆出去散步吧。」幫她穿上最暖的衣服，圍上圍巾，然後牽著她的手，出了門。\n\
    \    (Ｄ)冬天的街，很黑，犬吠聲自遠處幽幽傳來，聽起來像低聲嗚咽，在解釋一個說不清的痛楚。\n    路底有一家燈火通明的永和豆漿店，我對她說：「走吧，我帶妳去吃妳家鄉浙江\
    \ 淳安的豆漿。」她從夢魘中醒來，乖順地點頭，任我牽著她的手，慢慢走。\n    空蕩蕩的街，只有我，和那生了我的女人。                 \
    \            ――節錄自龍應台《目送•散步》"
