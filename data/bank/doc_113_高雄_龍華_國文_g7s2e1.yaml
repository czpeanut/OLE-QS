    content: 摸「之」則無聲
  - label: B
    content: 使人迎置後閣祠「之」
  - label: C
    content: 引囚逐一以手入帷摸「之」
  - label: D
    content: 訊「之」，遂承為盜，蓋恐鐘有聲，不敢摸也
  group_stem: '陳述古 密直，嘗知①建州浦城縣。富民失物，捕得數人，莫知的為②盜者。述古紿③曰：「某寺有一鐘，至靈，能辨盜。」使人迎置後閣④祠之。引囚立鐘前，自陳：「不為盜者，摸之則無聲，為盜者摸之則有聲。」述古自率同職⑤，禱鐘甚肅。祭訖，以帷⑥圍之，乃陰使人以墨塗鐘。良久，引囚逐一以手入帷摸之。出而驗其手，皆有墨，唯有一囚無墨，訊之，遂承為盜，蓋恐鐘有聲，不敢摸也。                    ――沈括《夢溪筆談•辨盜鐘》

    ：①知：主持、管理。           ②莫知的為：不知道哪個是真的。    ③紿：欺騙。音ㄉㄞˋ。

    ④後閣：官署後院的側門。     ⑤同職：同僚、同事。              ⑥帷：圍幕。'
