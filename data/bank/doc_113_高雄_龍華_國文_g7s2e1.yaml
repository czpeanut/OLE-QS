  page: 2
  stem: 關於〈孩子的鐘塔〉一文的寫作手法與篇章結構，下列何者正確？
  options:
  - label: A
    content: 文章主要以第一人稱敘述尼可拉斯的故事，使讀者能直接感受作者的情感
  - label: B
    content: 作者在文章開頭運用破題法，直接點出「孩子的鐘塔」的外觀與地理位置
  - label: C
    content: 文章全篇依時間順序敘述，從尼可拉斯捐贈器官開始，到鐘塔建成，再到作者的感悟
  - label: D
    content: 作者在文末以客觀的語調敘述尼可拉斯的影響，避免摻雜個人情感，使內容更加理性
