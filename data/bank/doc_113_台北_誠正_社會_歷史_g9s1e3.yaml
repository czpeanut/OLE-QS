  stem: 中世紀的教會宣稱地球是宇宙的中心，而地球則是平的，一旦航行到世界的盡頭，就會掉入無盡的深淵，但是在十五世紀，開啟了「大航海時代」。請問當時驅動歐洲人前撲後繼前往「東方」的動機除了拓展貿易之外，還帶有什麼目的？
