  section: 1
  number: 40
  type: single
  page: 3
  stem: 當時大學內的討論問題的方式，通常藉由從宗教經典之中找尋相似的案例並進行邏輯上的推論進而得出答案。但這位學者卻十分反對這種求知的方式，因為這樣的討論使得知識終究走不出經典之外。反之他主張要解決問題應該透過對事物具體的觀察，進而分析歸納。他的主張對後世影響甚大，西歐的學者慢慢脫離宗教研究走向了自然科學研究。提出該主張的學者應該是?
