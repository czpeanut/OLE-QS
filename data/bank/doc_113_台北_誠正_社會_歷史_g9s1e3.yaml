  stem: 小英讀到一篇文章：「1511 年，一艘由歐洲人駕駛的帆船在加勒比海遇難，十餘名倖存者在猶加敦半島著陸，…………。」請問，文中提及歐洲人在加勒比海駕駛帆船的航線，與哪件事情最為相關﹖
