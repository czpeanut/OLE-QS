  section: 1
  number: 9
  type: single
  page: 1
  stem: 一篇研究指出：位於美洲的伊斯帕尼奧拉島(今海地島)，在1492 年的人口為25 萬，到了1548 年卻僅剩500 人。請問：導致這個島嶼人口銳減的主要原因為下列何者﹖
  options:
  - label: A
    content: 西班牙人將大量印地安人販賣至美洲當奴隸
  - label: B
    content: 西班牙囚犯大量移民美洲時，與原住民發生衝突
  - label: C
    content: 中南美洲進行獨立戰爭，遭歐洲人血腥鎮壓
  - label: D
    content: 歐洲人帶來傳染疾病，並且屠殺當地的原住民。
