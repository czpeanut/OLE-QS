- id: doc_113_台北_誠正_社會_歷史_g9s1e3_s1_36
  section: 1
  number: 36
  type: single
  page: 3
  stem: 〈美國獨立宣言〉中寫道：「我們堅信所有人生而平等，上帝賦予所有人某些不可剝奪的權利，而其中便包括生命、自由，與謀求幸福的權利。為了保障這些權利，人民乃約定產生政府，政府所具有的正當權力是來自於被統治者的同意。當政府-不論其形式為何-違背了這些職責，人民便有權更改或廢除這樣的政府，而另立新政府，將其體制改造，以求更能保障人民的安全與幸福。」其中關於革命的概念主要引用自哪位啟蒙思想家？
  options:
  - label: A
    content: 孟德斯鳩
