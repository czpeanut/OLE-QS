- id: doc_113_台北_誠正_社會_歷史_g9s1e3_s1_38
  section: 1
  number: 38
  type: single
  page: 3
  stem: '約 1830 年代，法國里昂紡織工人傳唱下列的歌曲歌詞：「想要做官掌權，總得披大氅、掛綬帶。我們為你們大人物紡紗織布，死後卻不包裹屍布就草草掩埋。我們是織布工，卻赤身裸體，無遮無蓋。你們的統治行將結束，我們掌權的日子就要到來。我們為舊世界織好了裹屍布，造反的吼聲已響徹天外，我們是織工，從此衣冠整齊，有穿有戴。」

    歌詞中有提到這群工人想要「掌權」與「造反」，是受到當時何種學派的影響？'
  options:
