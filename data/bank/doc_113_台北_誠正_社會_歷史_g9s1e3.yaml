- id: doc_113_台北_誠正_社會_歷史_g9s1e3_s1_39
  section: 1
  number: 39
  type: single
  page: 3
  stem: '小艾閱讀一位科學家生平的介紹如下：

    活躍於十六至十七世紀，對於自然科學有重要貢獻。他的其中兩重要著作：《星際信使》是使用自製望遠鏡觀察月球、木星及銀河等星體的整理﹔《論兩種新科學及其數學演化》，則討論到速度、加速度及拋射等物體運動，是他畢生對於物理學的探討總結。科學家霍金曾說：「對於現代科學的誕生，他比其他人都貢獻良多」。

    請問，該科學家的貢獻最有可能是下列何者﹖'
  options:
  - label: A
    content: 天文學界中首度提出太陽為宇宙中心論
  - label: B
    content: 提出三大運動定律及萬有引力的科學家
  - label: C
    content: 協助編纂百科全書將知識作系統性的整理
  - label: D
    content: 利用新工具觀察天體證實哥白尼的說法。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 歷史
      code: 5-2
      title: 科學革命
      chapter: 第5章 近代歐洲的變革
