- id: doc_113_台北_誠正_社會_歷史_g9s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 哥白尼建立了人類新宇宙觀，他是近代科學革命極其運動推展的靈魂人物。後事凡屬對人類文化發展所締造的輝煌成就，不論數學、音樂、建築、教育、財經等，如有哥白尼般的突破與創新，便稱為「哥白尼式的革命」。哥白尼對近代科學產生如此大的影響原因為何﹖
  options:
  - label: A
    content: 提出地圓說，證明地球是圓的
  - label: B
    content: 提出地心說，證實教會說法
  - label: C
    content: 提出日心說，動搖教會權威
  - label: D
    content: 提出進化論，否定上帝造物論。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 歷史
      code: 5-2
      title: 科學革命
      chapter: 第5章 近代歐洲的變革
    textbook: 九上歷史 5-2 科學革命
    labeled_by: ai
