  section: 1
  number: 12
  type: single
  page: 1
  stem: 小柏在分析旅遊業起源時，提出以下觀點：「在□□之前，歐洲只有少數地主與貴族有財力與時間參加旅遊活動。在□□之後，隨著生產力的迅速發展與社會財富的增加，工人階級積極向資本家爭取增加工資與休假。再加上交通工具的革新，旅遊業朝向多元發展。」上文中的□□應填入下列何者最適當﹖
  options:
  - label: A
    content: 發現新航路
  - label: B
    content: 文藝復興
  - label: C
    content: 工業革命
  - label: D
