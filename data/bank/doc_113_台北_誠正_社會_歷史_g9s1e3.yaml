  section: 1
  number: 11
  type: single
  page: 1
  stem: 這位18 世紀的學者對於經濟方面的主張，有以下看法：「反對政府對於經濟事務的介入或干預。政府對於經濟事務，例如資金流向的管制，不僅沒有必要介入或插手，而且也不必做任何的限制。政府在經濟領域任何的作為，不但會扼殺個人積極主動的工作動機，而且會阻礙國家整體經濟的成長。」請問，這位學者最有可能為下列何者﹖
  options:
  - label: A
    content: 亞當斯密
  - label: B
    content: 孟德斯鳩
  - label: C
    content: 狄德羅
  - label: D
    content: 喀爾文。
