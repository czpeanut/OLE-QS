  type: single
  page: 3
  stem: '1851 年，英國與倫敦的海德公園舉辦了人類歷史上第一場世界博覽會，展期是5 月1 日至10 月15 日，長達近半年。展覽品包括精美的工藝品、軌道蒸汽牽引機、起重機等等。估計有超過13000
    件的展出品，多達620 萬的參觀人次，這場博覽會使英國的國際地位大為提升。

