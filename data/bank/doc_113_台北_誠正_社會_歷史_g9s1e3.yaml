    content: 政府為何不應過度干預市場供需。
  group_stem: '(一)請閱讀以下文章，回答問題：

    英國人早期稱咖啡館為「一便士大學」，支付一便士，便可以進入咖啡館享受一杯咖啡，聽到各種政治八卦與知識，並可與學者、政客分享討論，於是自覺增長見聞，猶如上了大學一般。英格蘭首間咖啡館在1650
    年代的牛津誕生，當時以具備高等教育的大學生為消費者，在咖啡館談論學術思想、針貶時事。'
