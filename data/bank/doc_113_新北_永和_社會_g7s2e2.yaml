- id: doc_113_新北_永和_社會_g7s2e2_s2_33
  section: 2
  number: 33
  type: single
  page: 4
  stem: 臺灣人旅行習慣的養成，與下列哪一項「觀念的改變」最密切相關？(L3)
  options:
  - label: A
    content: 農曆節慶的推廣
  - label: B
    content: 天文觀測技術的發展
  - label: C
    content: 傳統宗族活動的消失
  - label: D
    content: 時間制度的西化與星期制的引入
  group_stem: "【題組】請閱讀以下文字，回答第33~35 題：\n  臺人旅行逐漸成為習慣，主因為時間觀念的改變：以往日出而作，日落而息的生活模式，轉而以一天二十四小時的概念進行；另外，星期制的出現，使臺人逐漸出現休假的概念，休假日最好的休閒活動便是旅行。旅行活動的熱絡，除了上述條件的配合，更需要基礎建設的升級，例如：鐵路、公路、港口等建設與整合。\n\
    此外，總督府為避免傳染病的蔓延，透過保甲制度，強化臺人的衛生觀念，因而養成臺人定期洗手、使用肥皂、注意飲食衛生等習慣。且總督府在推動衛生政策時，常利用當時的報紙和日記等媒介，記錄並宣傳衛生改革的成果，這些史料成為今日研究日治時期臺灣衛生發展的重要依據。\n\
    最後，書中提及日治時期的臺灣社會中，打麻雀（為今日「打麻將」）是一項熱門的娛樂活動。然而，總督府認為賭博行為有礙社會風氣，因而加強對賭博活動的管制，藉此希望改善臺人的壞習慣。\n\
    \                                                 （資料來源：蔣竹山，《島嶼浮世繪：日治臺灣的大眾生活》）"
