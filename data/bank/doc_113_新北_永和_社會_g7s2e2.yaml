    許多表演活動的門票常被黃牛(指在合法銷售途徑以外壟斷或銷售商品以圖利的仲介人)購買，再轉賣一般民眾，導致嚴重影響交易秩序以及消費者權益，有立委提案修正《社會秩序維護法》第64
