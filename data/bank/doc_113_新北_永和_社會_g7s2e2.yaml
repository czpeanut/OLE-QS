    In Taiwan」。然而，隨著產業環境不斷改變，全球製造業開始轉移，目前芭比娃娃的生產重心已從遷移至印尼、馬來西亞、墨西哥、泰國…等國。2021 年，歐盟制定了嚴格的法規，對於芭比娃娃的主要成分
    PVC（聚氯乙烯）進行限制（PVC 在焚燒時會產生鹽酸，而鹽酸與酸雨有關）。對此美泰兒（Mattel）公司已重新考慮芭比娃娃的製作材料以符合法規，也承諾使用更多的再生材料。
