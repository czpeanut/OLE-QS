  section: 2
  number: 38
  type: single
  page: 4
  stem: 根據甲、乙二文，下列何者敘述不恰當？
  options:
  - label: A
    content: 甲文認為每個人對於自己的性別認同在「性別光譜」裡都有自己的位置
  - label: B
    content: 乙文認為少年的「控訴」只為該事件帶來心靈紀念
  - label: C
    content: 甲、乙二文都傳遞了「呼籲大家尊重不同性別認同」的訊息
  - label: D
    content: 甲、乙二文都是立基於葉永鋕事件，分別用文章與歌詞表達對該事件的紀念
  group_stem: "（甲）節錄《親子天下》\n葉永鋕與性別平等教育：願每個人都能在性別光譜中找到自己獨特的位置\n    生理性別是男或女，是我們與生俱來的身體特徵，但是誰說男生一定要強壯、理性、愛玩汽車或機器人、喜歡藍色、擅長運動，女生一定要順從、感性、愛幫芭比娃娃打扮、喜歡粉紅色、擅長烹飪？為什麼不能有玫瑰般柔美的少年？\n\
    \    其實一個人的性別氣質，傾向陽剛、或是陰柔，和生理性別不一定有直接的關聯，我們也可以說，我們每一個人都兼有陽剛和陰柔特質，而且從陽剛到陰柔之間，性別氣質就像一道光譜，每個人都能在上面找到屬於自己的位置。\n\
    \    而在葉永鋕離世後第4 年，台灣通過了《性別平等教育法》，規範「學校應提供性別平等之學習環境，尊重及考量學生與教職員工之不同性別、性別氣質、性別認同或性傾向，並建立安全之校園空間」。\n\
    \n（乙）蔡依林〈玫瑰少年〉\n  哦 哪朵玫瑰沒有荊棘？（沒有荊棘）       最好的報復是美麗 最美的盛開是反擊\n  哦 別讓誰去 改變了你（改變了你）\
    \        你是你或是妳都行 會有人全心的愛你\n\n  玫瑰少年 在我心裡（在我心裡）           綻放著鮮豔的傳奇 我們都從來沒忘記\n\
    \  你的控訴 沒有聲音（你的控訴沒有聲音！） 卻傾訴更多的真理 卻喚醒無數的真心"
