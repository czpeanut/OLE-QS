  stem: 改革開放由中國共產黨第二代中央領導集體核心鄧小平提出和創立改革，鄧小平著名的貓論(不管黑貓白貓，能捉到老鼠就是好貓)。 說明無論計劃經濟還是市場經濟，都只是一種資源配置手段，與政治制度無關；資本主義可以有計劃，社會主義也可以有市場。開放是中國歷史上的重大決策和轉折過程使中國經濟高速發展。1990
