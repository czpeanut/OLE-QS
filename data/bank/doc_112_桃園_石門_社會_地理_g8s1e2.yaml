  stem: 「客家人」，在西方人類學上簡稱「Hakka」。先世居黃河流域；西晉末年（4 世紀初）、唐代後期（9 世紀末）因戰亂大批南下。1270 年代南宋滅亡後又遷至贛、閩、粵等地。客家人的根源，傳統的觀點認為是在「河洛」，所謂「河洛」，指的是黃河、洛水。早期中國文化重心在北方，因飢荒或戰亂等因素部份人民向南遷移，例如：台灣第二大族群--客家人。請問：上述遷移的原因主要是
