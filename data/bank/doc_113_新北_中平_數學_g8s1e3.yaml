- id: doc_113_新北_中平_數學_g8s1e3_s1_24
  section: 1
  number: 24
  type: single
  page: 4
  stem: 若每輛自行車定價為a美元，且成本只考慮設備、廣告費與自行車的製造費，該公司每年預計生產依上述關係推算的年銷售自行車數，則以a表示當年所需要的成本為多少美元？
  options:
  - label: A
    content: 78000+80(4800-20a)
  - label: B
    content: 80(4800-20a)-78000
  - label: C
    content: 78000×80+(4800-20a)
  - label: D
    content: (4800-20a)-78000×80
  group_stem: '題組題：

    中平自行車公司打算推出一款新型自行車。為了能大量生產且獲利，公司市調後發現「年銷售量」與「定價」的關係：

    若每輛自行車定價a 美元，則年銷售量為(4800-20a)輛。

    舉例來說，若每輛自行車為100 美元，則年銷售量為4800-20×100=2800 輛

    已知一年的設備、廣告費用共計78000 美元，且每輛自行車的製造費為80 美元。

    請根據上述資訊回答第24、25 題'
