  type: single
  page: 6
  stem: 由本文可知，此次地震發生時間最可能為何？
  options:
  - label: A
    content: 早上七點
  - label: B
    content: 下午五點
  - label: C
    content: 晚上八點
  - label: D
    content: 凌晨兩點
  group_stem: "康熙七年六月十七日戌刻，地大震。余適①客稷下，方與表兄李篤之對燭飲。\n    忽聞有聲如雷，自東南來，向西北去。眾駭異，不解其故。俄而几案擺簸，酒杯傾覆，屋梁椽②柱，錯折有聲。相顧失色。久之，方知地震，各疾趨出。見樓閣房舍，仆而復起；牆傾屋塌之聲，與兒啼女號，喧如鼎沸。人眩暈不能立，坐地上，隨地轉側。河水傾潑丈餘，鴨鳴犬吠滿城中。逾一時許，始稍定。視街上，則男女裸聚，競相告語，並忘其未衣也。後聞某處井傾仄③，不可汲；某家樓臺南北易向；棲霞④山裂，沂水⑤陷穴，廣數畝。此真非常之奇變也。\n\
    (蒲松齡)\n注釋\n①余「適」客稷下：恰巧。②「椽」柱：ㄔㄨㄢˊ，架在桁上用以承接木條及屋頂的木材。\n③傾「仄」：傾斜，通「側」。④棲霞：縣名。今屬山東省。⑤沂水：縣名。今屬山東省。"
