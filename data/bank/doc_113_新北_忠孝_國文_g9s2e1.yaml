  stem: '「淺焙咖啡豆的外觀接近肉桂色，加工程序最少，保留最多的咖啡原始風味。其中淺焙豆的酵素作用較為明顯，會產生花果香，且酸度普遍較明顯。中焙豆的顏色略深於淺焙豆，呈現栗子色。是大多數人都能接受的烘焙程度，酸味逐漸被中和，有時豆子能被帶出堅果、杏仁、巧克力等風味；過程中咖啡豆的油脂也開始分泌，帶出咖啡較為醇厚的香氣。深焙豆的顏色轉為褐色，是三種焙度中顏色最深的一種。咖啡豆的原始特性逐漸消失，香氣變更濃，苦味被凸顯。」

