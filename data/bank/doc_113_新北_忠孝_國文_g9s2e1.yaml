  stem: 根據本文，關於流感的敘述，下列何者正確？
  options:
  - label: A
    content: 流感的併發症可能導致肺癌，不可輕忽
  - label: B
    content: 傳統抗生素不一定可以有效治療流感病毒併發的肺炎
  - label: C
    content: 日本與臺灣因關係地緣關係流行的流感病毒株一致
  - label: D
    content: 臺灣春節前毋須擔憂流感的肆虐
  group_stem: "前台大醫院感染科醫師、知名旅遊部落客林氏璧表示，流行性感冒病毒絕對不能輕忽，不僅傳染力高能造成大流行，且可能發生併發症，造成肺炎、腦炎、心肌炎等重症。相較之下，普通的感冒病毒幾乎不會有併發症。\n\
    \    林氏璧解釋，流感病毒併發的肺炎有2 種，一種是病毒直接侵犯造成病毒性肺炎，病程較快且通常來勢洶洶，致死率較高，偶爾會發生在年輕族群。第二種是續發性的細菌性肺炎，流感破壞身體防衛機制後細菌趁機入侵，傳統抗生素可以有效治療。總體而言流感致死率約千分之一。\n\
    \    林氏璧建議，65 歲以上長者、嬰幼兒、孕婦以及慢性病患者（糖尿病、心血管疾病、免疫力低下等）是流感併發重症的高風險族群，應施打流感疫苗。\n  \
    \  至於日本流感病毒株是否比較毒？林氏璧表示，其實沒有，日本這次和臺灣主要流行的都是同個病毒株：A 型流H1N1，且日本這波流感大流行已確認過了高峰，反而是臺灣依往年情形都是在春節後會有一波流感流行期，呼籲國人不要掉以輕心；長者、嬰幼兒、孕婦和慢性病患等高風險族群應施打疫苗。\n\
    (節錄自2025.2.3 中央通訊社)"
