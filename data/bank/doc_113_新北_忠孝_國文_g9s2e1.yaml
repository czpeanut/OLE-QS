- id: doc_113_新北_忠孝_國文_g9s2e1_s2_35
  section: 2
  number: 35
  type: single
  page: 6
  stem: 根據本文文意，下列敘述何者不適當？
  options:
  - label: A
    content: 「 甲 」可填入「刎頸之交」
  - label: B
    content: 「 乙 」可填入「無友不如己者」
  - label: C
    content: 「 丙 」可填入「忘年之交」
  - label: D
    content: 「 丁 」可填入「人不知而不慍，不亦君子乎」
  group_stem: "古之所謂「 甲 」，陳義過高，非常人所能企及。就是把友誼的標准降低一些，真正能稱得起朋友的還是很難得。\n    孔子說「 乙 」。我想一來只是指品學而言，二來只是說不要結交比自己壞的，並沒有說一定要我們去高攀。友誼需要兩造，假如雙方都想結交比自己好的，那就永遠交不起來。\n\
    \    「 丙 」倒是可能的。彌衡年未二十，孔融年已五十，便相交友，這樣的例子史不絕書，但似乎以同性為限。\n    並且以我所知，「 丙 」之形成固有賴於興趣之相近與互相之器賞，但年長的一方面多少需要保持一點童心，年幼的一方面多少需要顯著幾分老成。\n\
    \    規勸乃是朋友中間應有之義，但是談何容易。名利場中，沆瀣一氣，自己都難以明辨是非，哪有餘力規勸別人？\n    而在對方則又良藥苦口忠言逆耳，誰又願意別人批他的逆鱗？規勸不可當著第三者的面前行之，以免傷他的顏面，不可在他情緒不寧時行之，以免逢彼之怒。\n\
    \    孔子說：「 丁 」我總以為勸善規過是友誼的消極的作用。友誼之樂是積極的。只有神仙和野獸才喜歡孤獨，人是要朋友的。\n    「假如一個人獨自升天，看見宇宙的大觀，群星的美麗，他並不能感到快樂，他必要找到一個人向他述說他所見的奇景，他才能快樂。」\n\
    \    共享快樂，比共受患難，應該是更正常的友誼中的趣味。\n——節選自梁實秋〈談友誼〉"
