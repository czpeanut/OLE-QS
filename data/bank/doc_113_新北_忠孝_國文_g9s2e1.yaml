  - label: D
    content: 異史氏批評僧人因不敬神佛而招惹殺身之禍
  group_stem: "某道士，雲游日暮，投止野寺。見僧房扃①閉，遂藉蒲團，趺②坐廊下。夜既靜，聞啟闔聲，旋見一僧來，渾身血污，目中若不見道士，道士亦若不見之。僧直入殿，登佛座，抱佛頭而笑，久之乃去。及明，視室，門扃如故。怪之，入村道所見。眾如寺，發扃驗之，則僧殺死在地，室中席篋③掀騰，知為盜劫。疑鬼笑有因；共驗佛首，見腦後有微痕，刓④之，內藏三十餘金。遂用以葬之。\n\
    \    異史氏曰：「諺有之：『財連於命』。不虛哉！夫人儉嗇封殖⑤，以予所不知誰何之人，亦已癡矣；況僧並不知誰何之人而無之哉！生不肯享，死猶顧而笑之，財奴之可歎如此。佛云：『一文將不去，惟有業隨身。』其僧之謂夫！」\n\
    蒲松齡《聊齋志異・死僧》\n注釋①扃：音ㄐㄩㄥ，門。②趺：音ㄈㄨ，盤腿而坐。③篋：音ㄑ一ㄝˋ，放東西的箱子。\n④刓：音ㄨㄢˊ，削挖。⑤封殖：聚斂財物。"
