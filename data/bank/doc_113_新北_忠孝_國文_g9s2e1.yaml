  section: 1
  number: 16
  type: single
  page: 3
  stem: '鄭人有愛惜魚者，計無從得魚，或汕，或網，或設餌鉤之，列三盆庭中，且實水焉。人曰：「魚以江為命，今處一勺之水，日玩弄之，而曰：『我愛魚，我愛魚』，魚不腐者，寡矣！」不聽，未三日，魚皆鱗敗以死。鄭人始悔不用或人之言。
    【注】汕：用竹編的器具抓魚


    這則故事所說明的道理，與下列何者最接近？'
  options:
  - label: A
    content: 失之東隅，收之桑榆
  - label: B
    content: 水能載舟，亦能覆舟
  - label: C
    content: 無為而治，順應自然
  - label: D
    content: 蓬生麻中，不扶而直
