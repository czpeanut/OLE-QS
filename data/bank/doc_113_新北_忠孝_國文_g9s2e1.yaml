  stem: '根據文意判斷，選出正確的排列順序：

    常熟孫君壽，性獰惡，好慢神虐鬼。與人游山，脹如廁，戲取荒冢骷髏，蹲踞之，令吞其糞，曰：「汝食佳乎？」

    【甲】日遺矢，輒手取吞之，自呼曰：「汝食佳乎？」

    【乙】君壽至橋，骷髏不得上。君壽登高望之，骷髏仍滾歸原處。

    【丙】君壽至家，面如死灰，遂病。

    【丁】骷髏張口曰：「佳。」君壽大駭，急走。骷髏隨之滾地，如車輪然。

    食畢更遺，遺必更食，三日而死。'
