    Italy

    When in Italy, do as the Romans do, and never put cheese on seafood.

    Portugal

    Don’t ask the waiter for salt if it is already on the table, Asking for salt would
    be an offense to the chef’s skill.

    Now , you should know what to do after you learn these tips. Don’t forget to enjoy
    your meal.

