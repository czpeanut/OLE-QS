  options:
  - label: A
    content: American traditions.(傳統)
  - label: B
    content: Knives and shoes in America.
  - label: C
    content: American superstitions（迷信） .
  - label: D
    content: Sending gifts in merica.
  group_stem: 'Do you believe that breaking a mirror will bring seven years of bad
    luck? Lots of Americans do. They also believe that if a man sings before 7:00
    a.m., he will cry at eleven, which means the morning is too early to be happy.
    Everyone has to try hard every day to get his or her luck. What’s more, there’s
    a taboo about shoes. That is to say, don’t put shoes on the table, or it would
    bring very bad luck to the family.

    About sending gifts, in America, if someone gives you a knife as a gift, you have
    to pay one dollar for it, or the gift will bring you bad luck. And if someone
    gives you a beautiful box of hand-made cookies, don’t give the box back with nothing
    inside. That is also believed to be unlucky and will bring hunger to the family.

    One funny thing is that Americans will say “break a leg” to wish someone good
    luck if he or she is going to perform in public. It is interesting, isn’t it?

    mirror 鏡子

    hunger 飢餓

    perform 表演'
