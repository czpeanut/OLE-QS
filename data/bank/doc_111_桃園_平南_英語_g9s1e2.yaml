  stem: 45.( )What is the best title for the poem? poem 詩
  options:
  - label: A
    content: Manson and His Family
  - label: B
    content: A New Hope in a Big City
  - label: C
    content: A Boy Was Caught in Trouble
  - label: D
    content: Looking for a Missing Father
  group_stem: 'A Story about Manson

    Manson and his family had to leave their

    hometown,

    Because they could no longer live on their farm,

    Which was burned down in a terrible fire.

    They walked a long way to look for Uncle Sam,

    Who lived in a big city.

    The trip was full of trouble,

    But it gives them the hope of getting a better life

    In the future.


    Halfway to the city,

    Manson’s father headed for Uncle Sam by himself.

    However,

    When Manson got to his uncle’s house,

    His dear father was nowhere to be seen,

    Which broke his family’s heart.


    Manson , the eldest child of his family,

    Decided to find a job to help his brothers and

    sisters.

    Then one day in the street,

    He was lucky to be given a job by a man called Tom

    To work in a factory,

    So he followed him to his future working place.


    When he finally arrived there with the man,

    He saw no factory.

    He was then locked with five other boys

    In a very old, small house,

    Where they spent long hours a day making toys.

    With little to eat,

    And little time to rest or sleep,


    Manson had no idea

    Whether he could live to get back home safe and

    sound.

    Crying

    In the deep night,

    Manson was not sure where his future would lie.


    burn 燒毀 nowhere 無處

