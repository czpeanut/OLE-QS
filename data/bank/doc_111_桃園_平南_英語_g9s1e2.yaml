  stem: 39.( )What is the reading mainly about?
  options:
  - label: A
    content: DOs and DON’Ts about table manners around the world.
  - label: B
    content: DOs and DON’Ts about taking trips abroad.
  - label: C
    content: How to find great restaurants around the world.
  - label: D
    content: How to use forks to eat bread with good table manners.
  group_stem: 'Dining abroad can be stressful because you want to show good table
    manners.That is why it is a good idea to learn some table manners before you go
    abroad. Here are a few DOs and DON’Ts about dining in different countries.

    France

    There will likely be bread on the dining table, but don’t eat all the bread before
    your meal arrives. Bread should be eaten with the meal, and it is used to push
    food onto the fork. To eat the bread, tear a piece off. Don’t bite right on it.
    When you are not using the bread, leave it on the table, not on your plate.

    Thailand

    People use forks only to push food into a spoon. It is not a habit here to eat
    with a fork.

    Mexico

    The fork and knife should not be used to eat food.You should eat it with your
    hands.

    Chile

    Interestingly, touching food with one’s hands is bad manners in Chile. People
    there use forks even for French fries.

    Italy

    When in Italy, do as the Romans do, and never put cheese on seafood.

    Portugal

    Don’t ask the waiter for salt if it is already on the table, Asking for salt would
    be an offense to the chef’s skill.

    Now , you should know what to do after you learn these tips. Don’t forget to enjoy
    your meal.

    manner 禮儀

    tear 撕

    offense 冒犯'
