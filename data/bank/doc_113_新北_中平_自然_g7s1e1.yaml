- id: doc_113_新北_中平_自然_g7s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: '探討生活中的現象時，常可依「觀察→提出問題→假設→實驗」，等步驟來得到結論。風間想要研究孔雀的行為，列出了甲乙丙丁－四個敘述，如表所示。若以科學方法的步驟排列，下列何者正確？    ＜素養題＞


    | 編號 | 敘述 |

    |---|---|

    | 甲 | 紀錄孔雀於動物園發生開屏的時間與頻率，並且記錄孔雀開屏的周遭人、事、物情形。 |

    | 乙 | 孔雀開屏的原因為何？牠是為了求偶還是有其他因素造成這樣的行為。 |

    | 丙 | 動物園的孔雀時常開屏，但有1000多隻野生孔雀的金門，當地人反而少有機會觀賞到孔雀開屏。 |

    | 丁 | 如果是為了求偶，那金門當地人應該更容易觀察到遍地開屏的現象。所以可能是因為動物園的遊客量過於密集，使得孔雀驚嚇或警戒防衛吧。 |'
  options:
  - label: A
    content: 甲→丙→乙→丁
  - label: B
    content: 丙→丁→乙→甲
  - label: C
    content: 丙→乙→丁→甲
  - label: D
    content: 甲→丁→乙→丙
  uncertain_spans:
  - 內容與原卷文字層不符（吻合 78%）
