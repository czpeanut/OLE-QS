- id: doc_113_新北_中平_自然_g7s1e1_s1_37
  section: 1
  number: 37
  type: single
  page: 4
  stem: '甲～己是Ｙ顯微鏡的操作步驟，若眼焦調整器位於右眼位置，且使用者兩眼視力不同。請排出正確的操作順序？

    甲、 單獨以右眼觀察，並調整眼焦調整器至清楚

    乙、 單獨以左眼觀察，並調整眼焦調整器至清楚

    丙、將待觀察物品放置在載物板中央，並以固定夾固定

    丁、閉左眼，先以右眼觀察，並調整調節輪至清楚

    戊、閉右眼，先以左眼觀察，並調整調節輪至清楚

    己、調整適當亮度並調整眼距調整器，使兩眼視野重合'
