- id: doc_113_新北_中平_自然_g7s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: '韓國人在製作泡菜時，會在每一片大白菜的葉片上灑上鹽跟糖。右圖為正常的大白菜葉片細胞示意圖。

    下表中的圖為妮妮與正男預測大白菜藉由醃漬後，其葉片細胞可能的示意圖。請推論醃漬後的示意圖與造成葉片細胞變化的原因，選出較正確的敘述？   ＜素養題＞'
  options:
  - label: A
    content: 妮妮的圖正確，鹽跟糖由外界流至葉片細胞內
  - label: B
