- id: doc_113_新北_中平_自然_g7s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: '生物的組成層次包含細胞、組織、器官、器官系統和個體。約兒去傳統市場買了一包黃豆、一塊牛排、一顆雞蛋和一盆金桔樹。已知一般市售雞蛋無法孵出小雞。

    請問下列敘述，何者正確？       ＜素養題＞'
  options:
  - label: A
    content: 雞蛋為個體，是最複雜的組成層次
  - label: B
    content: 黃豆屬於營養器官，喝豆漿是為了得到黃豆儲存的養分
  - label: C
    content: 金桔樹因具有多個植物器官，屬於器官系統層次，
  - label: D
    content: 由簡至繁依序為雞蛋→牛排→黃豆→金桔樹
