  stem: 「舜發於畎畝之中，傅說舉於版築之間，膠鬲舉於魚鹽之中，管夷吾舉於士，孫叔敖舉於海，百里奚舉於市。」孟子在〈生於憂患，死於安樂〉一文中舉六位聖賢為例，意欲論述何種道理？
    【古典詩文單題】
