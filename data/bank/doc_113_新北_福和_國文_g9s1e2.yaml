    content: 書本必須反覆閱讀、仔細鑽研
  - label: D
    content: 訓練出看一眼就能記憶的能力。
  group_stem: "(五) 【古典詩文閱讀題組】\n 讀書以過目成誦為能，最是不濟事。眼中了了，心下匆匆，方寸無多，往來應接不暇，如看場中美色，一眼即過，與我何與也？千古過目成誦，孰有如孔子者乎？讀《易》至韋編三絕，不知翻閱過幾千百遍來，微言精義，愈探愈出，愈研愈入，愈往而不知其所窮。雖生知安行之聖，不廢困勉下學之功也。東坡讀書不用兩遍，然其在翰林讀《阿房宮賦》至四鼓，老吏苦之，坡灑然不倦。豈以一過即記，遂了其事乎！惟虞世南、張睢陽、張方平，平生書不再讀，迄無佳文。\n\
    —鄭燮〈濰縣署中寄舍弟墨第一書〉"
