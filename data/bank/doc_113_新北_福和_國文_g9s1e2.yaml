- id: doc_113_新北_福和_國文_g9s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 「故天將降大任於是人也，必先苦其心志，勞其筋骨，餓其體膚，空乏其身，行拂亂其所為：所以動心忍性，曾益其所不能。」依據這段文字，上天賜予一個人磨難，主要是為了什麼？
    【古典詩文單題】
  options:
  - label: A
    content: 教人鍛鍊體魄，以促進身心健康
  - label: B
    content: 讓人增長能力，以擔負重責大任
  - label: C
    content: 令人忍受苦辛，以企盼苦盡甘來
  - label: D
    content: 使人先苦後甘，以珍惜豐美收穫。
  lesson_raw:
    title: 生於憂患，死於安樂
    basis: 引用〈生於憂患，死於安樂〉課文原句
