- id: doc_113_新北_福和_國文_g9s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 「大明湖的西岸、北岸有明、清兩代的城牆遺址，至今尚保存雄偉的城門。湖的南岸有紀念南宋愛國詞人辛棄疾而建立的稼軒紀念祠，在古水仙祠裡也供奉著南宋女詞人李清照。」這段文字最適合用下列何者來形容？
    【古典詩文單題】
  options:
  - label: A
    content: 四面荷花三面柳，一城山色半城湖
  - label: B
    content: 歷下此亭古，濟南名士多
  - label: C
    content: 一盞寒泉薦秋菊，三更畫舫穿藕花
  - label: D
    content: 春光不負志士，才學常偕勤人。
  lesson_raw:
    title: 大明湖
    basis: 大明湖相關內容
