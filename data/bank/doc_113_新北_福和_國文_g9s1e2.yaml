- id: doc_113_新北_福和_國文_g9s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 胡適說：「《老殘遊記》最擅長的是描寫的技術，無論寫人寫景，作者都不肯用套語濫調，總想鎔鑄新詞，做實地的描畫。」可見作者劉鶚善於實地描畫景物，使文意鮮活生動。下列敘述之景何者錯誤？
    【古典詩文單題】
  options:
  - label: A
    content: 以「梵宇僧樓，與那蒼松翠柏，高下相間，紅的火紅，白的雪白，青的靛青，綠的碧綠」細膩描繪千佛山上色彩繽紛
  - label: B
    content: 以「忽聽一聲漁唱」牽引老殘的視線至湖面，使他看見千佛山的倒影，發現倒影更賞心悅目
  - label: C
    content: 以「粉紅色絨毯」形容鐵公祠被四面荷花圍繞的壯觀之景，讓老殘驚嘆連連
  - label: D
    content: 以「那明湖業已澄淨得同鏡子一般」比喻明媚秋色中，大明湖的湖面清澈明淨可鑑人。
  lesson_raw:
    title: 大明湖
    basis: 大明湖選自《老殘遊記》
