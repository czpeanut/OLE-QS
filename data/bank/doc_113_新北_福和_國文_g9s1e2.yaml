  stem: '今夫弈之為數，小數也，不專心致志，則不得也。弈秋，通國之善弈者也。使弈秋誨二人弈，其一人專心致志，惟弈秋之為聽；一人雖聽之，一心以為有鴻鵠將至，思援弓繳而射之，雖與之俱學，弗若之矣。為是其智弗若與？曰：「非然也。」


    「一人雖聽之，一心以為有鴻鵠將至，思援弓繳而射之。」上述文字所敘之學習情況，用下列何者形容最恰當？ 【古典詩文閱讀單題】'
  options:
