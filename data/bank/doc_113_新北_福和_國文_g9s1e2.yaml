- id: doc_113_新北_福和_國文_g9s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 下列有關<大明湖>一文的敘述，何者正確？ 【古典詩文單題】
  options:
  - label: A
    content: 「一盞寒泉薦秋菊，三更畫舫穿藕花」描寫鐵公祠祭祀情況與周遭清幽的環境
  - label: B
    content: 「家家泉水，戶戶垂楊」乃指濟南城內泉水充沛，有近似江南水鄉、垂柳的佳致，甚至比江南風光更為有趣
  - label: C
    content: 「彷彿宋人趙千里的一幅大畫，做了一架數十里長的屏風」描寫大明湖波瀾遼闊之美。
  - label: D
    content: 文末以「船已到了鵲華橋畔了」一句作結，暗示老殘歸心似箭。
  lesson_raw:
    title: 大明湖
    basis: 題目指名〈大明湖〉一文
