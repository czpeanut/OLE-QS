- id: doc_113_新北_福和_國文_g9s1e2_s2_38
  section: 2
  number: 38
  type: single
  page: 5
  stem: 依據食譜內容，這道菜餚的名稱應為下列何者？
  options:
  - label: A
    content: 冰醉雞
  - label: B
    content: 叫化雞
  - label: C
    content: 椒麻雞
  - label: D
    content: 甕仔雞。
  group_stem: '(二)請閱讀以下食譜後回答問題： 【現代詩文閱讀題組】【素養題】

    材料：

    仿土雞腿2 支、蔥2 根、薑1 小塊，當歸、蔘鬚、枸杞各少許，鋁箔紙、冰開水。

    調味料：

    A.鹽、雞粉少許、米酒2 大匙。 B.水1.5 杯、紹興酒2 杯、鹽1/2 大匙。

    作法：

    (1)以刀背拍蔥和薑，混合A 調味成醃料備用。

    (2)雞腿去骨洗淨瀝乾，以醃料抓拌，靜置30 分鐘後，取出2 支雞腿交錯，以鋁箔紙捲緊成圓筒狀，兩頭扭緊，並用牙籤刺些小洞，置電鍋內鍋中。

    (3)電鍋外鍋加2.5 杯水，蒸至開關跳起，蒸出的雞汁留鍋內，取出雞腿放入冰水中泡涼後，去除鋁箔紙。

    (4)外鍋加1 杯水，內鍋中除雞汁外，加1.5 杯水、1/2 大匙鹽及當歸、蔘鬚、枸杞，蒸至開關跳起，取出放涼。

    (5)中藥湯冷卻後加入紹興酒，將放涼的雞腿泡入，置冰箱冷藏一天，即可取出雞腿切片排盤食用。'
