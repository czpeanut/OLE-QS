  stem: 作者說初聽王小玉的說書聲感覺「五臟六腑裡，像熨斗熨過，無一處不伏貼」，作者所要表達的感受為下列何者？
  options:
  - label: A
    content: 愉悅舒適
  - label: B
    content: 難以忍受
  - label: C
    content: 充耳不聞
  - label: D
    content: 吵鬧喧譁。
  group_stem: "(四) 【古典詩文閱讀題組】\n 王小玉便啟朱脣，發皓齒，唱了幾句書兒。聲音初不甚大，只覺入耳有說不出來的妙境，五臟六腑裡像熨斗熨過，無一處不伏貼，三萬六千個毛孔，像吃了人參果，無一個毛孔不暢快。唱了十數句之後，漸漸地越唱越高，忽然拔了一個尖兒，像一線鋼絲拋入天際，不禁暗暗叫絕。哪知她於那極高的地方，尚能迴環轉折，幾囀之後，又高一層，接連有三四疊，節節高起。恍如由傲來峰西面，攀登泰山景象：初看傲來峰削壁千仞，以為上與天通；及至翻到傲來峰頂，才見扇子崖更在傲來峰上；及至翻到扇子崖，又見南天門更在扇子崖上；愈翻愈險，愈險愈奇。\n\
    \ 那王小玉唱到極高的三四疊後，陡然一落，又極力騁其千迴百折的精神，如一條飛蛇在黃山三十六峰半中腰裡盤旋穿插，頃刻之間，周匝數遍。從此以後，愈唱愈低，愈低愈細，那聲音漸漸的就聽不見了。滿園子的人都屏氣凝神，不敢少動。約有兩三分鐘之久，彷彿有一點聲音從地底下發出。這一出之後，忽又揚起，像放那東洋煙火，一個彈子上天，隨化作千百道五色火光，縱橫散亂。這一聲飛起，即有無限聲音俱來並發。那彈弦子的亦全用輪指，忽大忽小，同他那聲音相和相合，有如花塢春曉，好鳥亂鳴。耳朵忙不過來，不曉得聽哪一聲的為是。正在撩亂之際，忽聽霍然一聲，人弦俱寂。這時臺下叫好之聲，轟然雷動。\n\
    —劉鶚〈王小玉說書〉"
