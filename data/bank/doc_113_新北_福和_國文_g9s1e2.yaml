- id: doc_113_新北_福和_國文_g9s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 「一物有一物之味，不可混而同之。猶如聖人設教，因才樂育，不拘一律。所謂君子成人之美也。今見俗廚，動以雞、鴨、豬、鵝，一湯同滾，遂令千手雷同，味同嚼蠟。吾恐雞、豬、鵝、鴨有靈，必到枉死城中告狀矣。善治菜者，須多設鍋、灶、盂（ㄩˊ）、缽之類，使一物各獻一性，一碗各成一味。嗜者舌本應接不暇，自覺心花頓開。」（袁枚《隨園食單》）依據這段文字，下列敘述何者正確？
    【古典詩文素養題】
  options:
  - label: A
    content: 食材各有各的滋味，當能混合調配出多重的口感
  - label: B
    content: 俗廚拙於分辨食材的味道，故其料理常欠缺特色
  - label: C
    content: 藉由「因材施教」來比喻食材應適性而個別處理
  - label: D
    content: 精美食器令人愉悅，往往可以引起老百姓的食欲。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 國文
      code: 第七課
      title: 我們的饕餮時代
      chapter: null
