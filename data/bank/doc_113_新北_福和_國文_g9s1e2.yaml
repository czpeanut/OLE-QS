- id: doc_113_新北_福和_國文_g9s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 「人之有德、慧、術、知者，恆存乎疢疾①。獨孤臣孽子②，其操心也危，其慮患也深，故達。」孟子這段話強調的是何種精神？(註：①疢疾：災患。②孤臣孽子：被疏遠、孤立的臣子與失寵的庶子。)
    【古典詩文單題】
  options:
  - label: A
    content: 固執己見
  - label: B
    content: 及時行樂
  - label: C
    content: 捨己為人
  - label: D
    content: 砥志礪行。
