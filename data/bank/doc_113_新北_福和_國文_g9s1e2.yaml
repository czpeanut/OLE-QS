- id: doc_113_新北_福和_國文_g9s1e2_s2_36
  section: 2
  number: 36
  type: single
  page: 4
  stem: 依據(乙)文，關於作者蔣勳誦讀《金剛經》的目的，下列敘述何者正確？
  options:
  - label: A
    content: 作者認為無論何人若想要安心，就得勤讀《金剛經》
  - label: B
    content: 作者已達到經中境界，可誦經《金剛經》協助友人安心
  - label: C
    content: 透過反覆誦讀《金剛經》，提醒自我時刻於生活中落實
  - label: D
    content: 藉由《金剛經》的力量，讓自己真正成為能夠捨得之人。
  group_stem: "(一)捨不得 【現代詩文閱讀題組】\n(甲) 有一年深秋，我漫步森林裡，那天微雨，眼前的大山被裊裊的山嵐給圍繞著。我停下腳步，怔怔看著眼前朦朧的青山，而此刻我的人生跟這座山一樣。\n\
    我停在那裡，等待雲霧散去，我想看清楚這座大山。其實，我更想看清楚自己的人生。冷冷的雨絲打在我的臉上，涼風吹過我的臉龐，我逐漸清醒。\n人生每個階段，要做的事情都不一樣。這件事我早就知道了，只是當生活的各種挑戰來臨時，總停不下來。其實，人只要安靜下來、停下腳步，誠實面對自己，生命裡轉彎難題的答案一清二楚。\n\
    我終於捨得放下經年經營的事業，投身旅行與寫作中。今年春天，我再度前往京都賞櫻，在雪白的櫻花樹底下，我擁有了最純靜美好的高峰經驗，度過了今生最美好的春天。\n\
    五十歲以前，我生命的大部分都在累積，累積學歷、資歷、名利；但五十歲以後，我覺得夠了，我終於捨得停下來，不再往前衝。\n就在五十歲生日那天，吹熄蛋糕上蠟燭的那個剎那，我意識到：其實我早已豐盛不再匱乏。\n\
    \ 摘錄、改寫自《今周刊》\n\n(乙) 一位朋友喪偶，傷痛不能自持，我抄經給他，希望有一點安慰，他看到引首「捨得」一方印，搖著頭，淚眼婆娑，萬般無奈，哀痛叫道：「就是捨不得啊！」我才知道自己其實對人的幫助這麼小，每個人「捨不得」的時候，我究竟能做什麼呢？\n\
    \ 後來養成了一個習慣──每天晨起必盤坐讀一遍《金剛經》，只因此書能讓我安心而已，而每個人安心的方法不同，不一定只能讀《金剛經》。\n經文說的「不驚、不怖、不畏」文字簡單，讀來容易，但回歸於生活中落實，原是如此困難：我喪偶的朋友如是，看著朋友捨不得的我也一樣驚慌害怕。他做不到，我也做不到。後來我才知道，反覆讀誦不是為了理解，而是為了時時提醒自己。\n\
    可生活中總還有那麼多的驚嚇慌張，有那麼多的「捨不得」，害怕得不到、害怕失去、害怕分離……。這因為如此，每當我讀到「不驚、不怖、不畏」，每一次看見人因為「捨不得」受苦，就熱淚盈眶。\n\
    \ 摘錄、改寫自蔣勳〈捨不得〉"
