  type: single
  page: 5
  stem: 下列關於以上四則《論語》之敘述，何者正確？
  options:
  - label: A
    content: (甲)文勉勵吾輩應積極充實自我，毋庸貪慕浮名虛利
  - label: B
    content: (乙)文強調對於他人不可過於仁厚，該計較處要計較
  - label: C
    content: (丙)文提及先攘外後安內即是成為君子之不二法門
  - label: D
    content: (丁)文說明行孔子之道要因地制宜，不可拘泥一格。
  group_stem: '(三) 【古典詩文閱讀題組】

    (甲)子曰：「不患人之不己知，患其不能也」。《論語‧憲問》

    (乙)或曰：「以德報怨，何如？」子曰：「何以報德？以直報怨，以德報德。」《論語‧憲問》

    (丙)子路問君子。子曰：「修己以敬。」曰：「如斯而已乎？」曰：「脩己以安人。」曰：「如斯而已乎？」曰：「脩己以安百姓。脩己以安百姓，堯 舜其猶病諸！」《論語‧憲問》

    (丁)子張問行。子曰：「言忠信，行篤敬，雖蠻貊之邦行矣；言不忠信，行不篤敬，雖州里行乎哉？立，則見其參於前也；在輿，則見其倚於衡也。夫然後行。」子張書諸紳。《論語‧衛靈公》'
