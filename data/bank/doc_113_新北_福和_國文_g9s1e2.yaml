  stem: 有關本文文句之解說，下列何者正確？？
  options:
  - label: A
    content: 「以為無益而舍之者，不耘苗者也」指不想耕耘的人總會找到訣竅
  - label: B
    content: 「天下之不助苗長者寡矣」一句顯見天底下揠苗助長之人比比皆是
  - label: C
    content: 「其子趨而往視之」指宋人之子遵循父親指令，不情不願前往察看
  - label: D
    content: 「芒芒然歸」可知宋人常常邊耕田邊飲酒，而後帶著滿身醉意回家。
  group_stem: "(六) 【古典詩文閱讀題組】\n 宋人有閔①其苗之不長而揠②之者，芒芒然③歸，謂其人④曰：「今日病⑤矣！予助苗長矣！」其子趨⑥而往視之，苗則槁⑦矣！天下之不助苗長者寡矣。以為無益而舍之者，不耘苗者也。助之長者，揠苗者也，非徒⑧無益，而又害之。\n\
    \ ──節選自《孟子．公孫丑上》\n注釋：①閔：擔心、憂心。②揠：拔。③芒芒然：疲憊的樣子。④其人：他的家人。⑤病：疲憊。⑥趨：快步走、趕著向前走。⑦槁：乾癟枯瘦的。⑧徒：但、僅。"
