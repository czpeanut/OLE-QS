- id: doc_112_桃園_石門_國文_g9s2e2_s2_48
  section: 2
  number: 48
  type: single
  page: 3
  stem: 清人查容認為蘇東坡築長堤的目的是為了：
  options:
  - label: A
    content: 人民疾苦
  - label: B
    content: 遊樂方便
  - label: C
    content: 方便徵稅
  - label: D
    content: 吟詠風月
  group_stem: "（七） 西 湖 夢 余秋雨 \n 西湖勝蹟中最能讓中國文人揚眉吐氣的，是白堤和蘇\n堤。兩位大詩人、大文豪，不是為了風雅，甚至不是為了\n\
    文化上的目的，純粹為了解除當地人民的疾苦，興修水\n利，浚湖築堤，終於在西湖中留下了兩條長長的生命堤壩。 \n 清人查容詠蘇堤詩云：：「蘇公當日曾築此，不為遊\n\
    觀為民耳。」恰恰是最懂遊觀的藝術家不願意把自己的文\n化形象雕琢成遊觀物，於是，這樣的堤岸便成了西湖間特\n別顯得自然的景物。不知旁人如何，就我而論，遊西湖最\n\
    暢心意的，乃是在微雨的日子，獨個兒漫步於蘇堤。也沒\n有什麼名句逼我吟誦，也沒有後人的感慨來強加於我，也\n沒有一尊莊嚴的塑像壓抑我的鬆快，它始終只是一條自然\n\
    功能上的長堤，樹木也生得平適，鳥鳴也聽得自如。這一\n切都不是東坡學士特意安排的，只是他到這裡做了太守，\n辦了一件盡職的好事。就這樣，才讓我看到一個在美的領\n\
    域真正卓越到了從容的蘇東坡。"
