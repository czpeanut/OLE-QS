- id: doc_113_高雄_光華_數學_g7s1e3_s3_1
  section: 3
  number: 1
  type: calc
  page: 3
  stem: '1.「追雪旅行團」到了度假中心，右表為兩種參觀方式與所需的纜車費用。已知旅行團的每個人皆從這兩種方式中選擇一種，且去程有14 人搭乘纜車，回程有12
    人搭乘纜車。若他們纜車費用的總花費為9600，則此旅行團共有多少人？


    | 參觀方式 | 纜車費用 |

    | :--- | :--- |

    | 去程及回程均搭乘纜車 | 700 元 |

    | 單程搭乘纜車，單程步行 | 400 元 |'
  group_stem: '位在北海道富良野南側的星野 TOMAMU 度假村，是許多旅人在去過之後都會想回訪的地方。度假村在每個季節都各有看頭，夏季時節的清晨，能搭乘纜車到山頂上看雲海；冬季時，這兒則幻化成滑雪場，而冬季限定的霧冰平台也是來到這兒非看不可的絕景。只要搭乘纜車上山，就能看到冰雪與大自然交織而成的美麗畫面,
    這是專屬於 TOMAMU 的冬季絕景。

    從飯店 (THE TOWER / RISONARE) 搭乘度假村內的接駁車即可來到度假中心 (Resort Center)，在此除了能購買滑雪用的雪票之外，也能在此購入前往霧冰平台的雲海纜車
    (Unkai Gondola) 票。隨著纜車慢慢爬升，心情也越來越亢奮，乘坐纜車約 13 分鐘即可到達海拔 1,088 米山頂站的霧冰平台，眺望美麗又壯觀的樹冰。'
