  group_stem: 'Mary’s Dream Kitchen

    Hey! I’m Mary. I love making snacks and I have a sweet tooth. I like to have cakes,
    pies, and cookies. Now tell me your name and your phone number. Share this information
    with your friends on Facebook. You can also come to Mary’s Dream Kitchen. Make
    a yummy cake for free, and you can enjoy it at home!

    －What do we need for a yummy cake?

    ‧Two bags of flour

    ‧Five cups of sugar

    ‧Five eggs

    ‧Two glasses of milk

    ‧Some butter

    ‧Some apples and bananas

    －Mary’s Dream Kitchen: Let’s cook, make snacks and have fun!

    ‧4F, No. 95, Banana Road.

