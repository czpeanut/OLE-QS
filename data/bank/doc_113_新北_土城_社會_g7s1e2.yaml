- id: doc_113_新北_土城_社會_g7s1e2_s2_61
  section: 2
  number: 61
  type: single
  page: 7
  stem: 臺灣八景中的「安平晚渡、沙鯤漁火、鹿耳春潮、斐亭聽濤、澄臺觀海」等五處勝景，現今對應的地理位置是？
  options:
  - label: A
    content: 嘉義
  - label: B
    content: 臺南
  - label: C
    content: 高雄
  - label: D
    content: 屏東
  group_stem: '「地方志」記載一地的地理環境、自然氣候、產物、史蹟與人文現象，是研究地方史的重要資料。而中國地方志書籍，經常收線該地文人或官史擇定的風景優美處為「八景」，清帝國將臺灣納入版圖後，曾多次編修記載臺灣歷史的官方地方志，並自臺灣景點選出八處為「臺灣八景」，以確定疆界範圍、宣示主權。八景的景點隨著時代變遷而有所不同，許多文人也曾為這些地標景點撰寫詩歌。首次收錄臺灣八景的地方志【臺灣府志】，該書八景景點分布位置如附表：


    | 景點名稱 | 安平晚渡 沙鯤漁火 | 鹿耳春潮 西嶼落霞 | 雞籠積雪 東溟曉日 | 斐亭聽濤 澄臺觀海 |

    | --- | --- | --- | --- | --- |

    | 昔日位置 | 鳳山縣 | 臺灣縣 | 諸羅縣 | 臺灣府城 |


    這八景呈現當時臺灣歷史發展，也見證了地形與氣候變遷。其中「鹿耳春潮」描繪春夏之際台江內海與臺灣海峽波浪在鹿耳門撞機形成的聲響與浪花，是來臺官員的最初印象。然而被譽為全臺交通咽喉的水道，在台江內海不斷淤積後不復存在，這些景點或許失去了當時文人歌詠的景色的確也留下盛名讓後人追念。'
  tags:
