  group_stem: "鐘乳石泛指石灰石(碳酸鹽岩)地區洞穴內，在漫長地質歷史中與特定地質條件下形成的鐘乳石、石筍、石柱等不同形態的碳酸鈣沉澱物。\n   \
    \ 石灰石是一種碳酸鈣岩石，地表上的石灰石被含有二氧化碳的水分解後，生成碳酸氫鈣溶液。水溶液順岩石縫隙而下。如果岩石下方有洞穴，則碳酸氫鈣溶液滲透至洞穴頂部後將滴下。當溶液和洞穴中的空氣接觸，產生逆向的化學反應，此時碳酸鈣被沉澱出來，經長期堆積形成鐘乳石。\n\
    \    石灰岩(鐘乳石)地形的形成，其可逆反應如下：\n$CaCO_{3}+H_{2}O+CO_{2} \\rightleftharpoons Ca(HCO_{3})_{2}$\n\
