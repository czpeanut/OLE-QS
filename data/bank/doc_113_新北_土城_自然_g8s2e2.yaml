  stem: 有關鐘乳石的形成過程，下列敘述何者正確？
  options:
  - label: A
    content: 石灰岩的成分為碳酸氫鈣
  - label: B
    content: $Ca(HCO_{3})_{2} \rightarrow CaCO_{3} + H_{2}O + CO_{2}$ 即是形成石筍、鐘乳石的主要原因
  - label: C
    content: 溶有碳酸鈣的水溶液向下流入洞穴中形成鐘乳石
  - label: D
