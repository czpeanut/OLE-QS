- id: doc_113_新北_土城_自然_g8s2e2_s1_34
  section: 1
  number: 34
  type: single
  page: 3
  stem: 下列何者不是過碳酸鈉的性質與用途？
  options:
  - label: A
    content: 溶於水可分解出 $H_{2}O_{2}$
  - label: B
    content: 同時兼具漂白、去汙、殺菌、除異味等功能
  - label: C
    content: 水溶液的 PH 值大於 7
  - label: D
    content: 清潔效果強，但可惜易汙染環境
  group_stem: '過碳酸鈉(俗稱固體雙氧水)是過氧化氫與碳酸鈉的加成化合物。當過碳酸鈉溶於水時，分解生成過氧化氫和碳酸鈉。

    其反應式如下：

    $2Na_{2}CO_{3}\cdot 3H_{2}O_{2} \rightarrow 2Na_{2}CO_{3}+ 3H_{2}O_{2}$

    溶解後溶液的pH 值呈鹼性，有利於過氧化氫發生進一步的化學反應生成活性氧，因而發揮了其漂白去汙的功能。其有效活性氧含量更相當於30%的雙氧水。

    過碳酸鈉不僅具有液體雙氧水的功能，且與水結合後迅速分解釋放出氧氣，從而實現漂白、去汙、殺菌、除異味等功能，而且它也同時分解生成碳酸鈉。碳酸鈉能提高水中的PH
    值，有效降低硬水中鈣、鎂離子，使水軟化。

    另外的作用是使汙垢和纖維在pH 值增加時，帶有更多的負電荷，從而增加汙垢與纖維之間的排斥性，提高了漂白和洗滌效果。

    過碳酸鈉的分解物：氧氣、水和碳酸鈉是天然存在的物質，對環境不具任何負面影響，因而過碳酸鈉是一種非常環保的高性能低溫氧系漂白劑。

    《文章取自冠傑手工皂網頁》

