    資料二：在文字被創造之前，當地的神話通過口耳相傳的形式傳播。目前發現的最早傳說是吉爾伽美什史詩，該作品就是記錄於泥石板上的，文字最早只是用於保存文件，直到王朝末期宗教文本才大規模出現，主要是神殿、頌歌和符咒。承載文字的原材料除了粘土，還有石頭，而書寫工具往往是小蘆葦杆。


    資料三：摩亨佐達羅，亦有「死亡之丘」之稱，是印度河流域文明的重要城市。摩亨約達羅是人類文明發展史上主要的早期古代城市，相當於古印度河流域文明的大都會。學者多認為它是在oo
    人入侵之前由古印度的達羅毗荼人所締造的都市文明。'
