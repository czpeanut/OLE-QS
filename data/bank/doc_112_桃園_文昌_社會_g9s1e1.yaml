- id: doc_112_桃園_文昌_社會_g9s1e1_s1_29
  section: 1
  number: 29
  type: single
  page: 5
  stem: 荷蘭之所以著手設計漂浮屋，是為了因應下列哪一項變遷？
  options:
  - label: A
    content: 人口增加
  - label: B
    content: 用水短缺
  - label: C
    content: 海洋汙染
  - label: D
    content: 冰山消融。
  group_stem: '過去荷蘭政府因為過剩的人口填海造陸，因為需要不斷的抽取海水，耗費了許多能源以及排放大量溫室氣體，對環境造成不小衝擊，引起環衛人士的反彈，也因此逐漸有建築師開始研究水上住宅的可能性，發展至今荷蘭已經有數十個水上漂浮社區。

    漂浮住宅的室內使用空間分為兩層，一層面積約20 至30 坪不等，下層通常設置一至兩個臥室，上層則為客廳、餐廳以及頂樓。就荷蘭大部分的浮動住宅而言，下層會有三分之二位於水面下，暴露於水面上的另外三分之一用來設置窗戶，利用私有船往返陸地與住家之間。

    從永續發展的觀點而言，荷蘭在漂浮建築的技術是相當好的教科書，而這股風潮也帶動像是美國西雅圖、泰國曼谷等地效法荷蘭發展水上建築，因此相信在未來幾十年會有更多國家導入這項技術，在不破壞生態環境的前提下去規劃新的住宅區。'
