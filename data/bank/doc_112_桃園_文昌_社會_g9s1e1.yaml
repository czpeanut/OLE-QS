- id: doc_112_桃園_文昌_社會_g9s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 請問根據資料一所提供的素材判斷，他有可能是下列哪一個文明的特色？
  options:
  - label: A
    content: 北非的埃及古文明
  - label: B
    content: 兩河流域的巴比倫帝國
  - label: C
    content: 伊朗高原上的波斯帝國
  - label: D
    content: 愛琴海文明
  group_stem: '資料一：距今六千多年前，此地區的人們觀察到，大約每隔365 天，天狼星在拂曉的時候，和太陽同時位於東方的地平線上。因此他們定365 天為一年，每年分為12
    個月，每月30 天，年末加上5 天。這種遵循太陽週期的曆法，依自然現象將一年分為『阿赫特』、『佩雷特』、『夏矛』三個季節，有別於同時期兩河流域的月亮週期曆法。


    資料二：在文字被創造之前，當地的神話通過口耳相傳的形式傳播。目前發現的最早傳說是吉爾伽美什史詩，該作品就是記錄於泥石板上的，文字最早只是用於保存文件，直到王朝末期宗教文本才大規模出現，主要是神殿、頌歌和符咒。承載文字的原材料除了粘土，還有石頭，而書寫工具往往是小蘆葦杆。


    資料三：摩亨佐達羅，亦有「死亡之丘」之稱，是印度河流域文明的重要城市。摩亨約達羅是人類文明發展史上主要的早期古代城市，相當於古印度河流域文明的大都會。學者多認為它是在oo
    人入侵之前由古印度的達羅毗荼人所締造的都市文明。'
  tags:
