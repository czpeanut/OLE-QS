- id: doc_112_桃園_文昌_社會_g9s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: '上文關於木乃伊與金字塔的描述，我們可推估埃及在哪一些學術上有高度的成就？

    甲.建築學  乙.解剖學  丙.哲學  丁.史詩  戊.幾何學'
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 丙丁戊
  - label: C
    content: 乙丙丁
  - label: D
    content: 甲乙戊
  group_stem: '圖坦卡門是古埃及新王國時期第十八王朝的一位法老，九歲登基，十九歲便駕崩。圖坦卡門為現代人熟知是因為他位於國王谷的墳墓在三千年的時間內從未被盜，直到1922
    年才由英國人霍華德·卡特發現，挖掘出近五千件珍貴陪葬品，震驚了西方世界。由於有幾個最早進入墳墓的人早死，被媒體大肆渲染成「法老的詛咒」，圖坦卡門的名字在西方更為家喻戶曉。對於這種「詛咒」，有一解釋是陵墓長期密封，滋生了不少細菌，致使最初進入的人員因此患病。

    根據近期研究，圖坦卡門死時年僅19 歲，由於圖坦卡門突然逝世，未能有充足時間建立金字塔，年輕法老王最後的安息地點就位於埃及的帝王谷裡。墓室極為隱秘，多年未受到盜賊的侵襲，因此
    1922 年考古學家發現時，法老王的木乃伊以及陪葬品皆保存的十分完整。'
  tags:
