- id: doc_112_桃園_文昌_社會_g9s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 圖一文昌國中晨讀計畫推廣的一本書籍：《國家地理希臘神話故事》，書中的眾神包括天神宙斯、太陽神阿波羅、智慧女神雅典娜、戰神阿瑞斯等。請問關於希臘古典文化的敘述何者正確？
  options:
  - label: A
    content: 相信冥界之神將審判死者的靈魂，並宣判死者是否重生，通過審判即可復活
  - label: B
    content: 古希臘人在建築藝術上重視均衡、實用，例如公共澡堂和佛塔
  - label: C
    content: 希臘神話中強調因果報應和靈魂輪迴，人們對眾神皆有神聖不可侵犯之感
  - label: D
    content: 古希臘人信仰多神，每四年在奧林匹亞舉行一次敬神祭典
