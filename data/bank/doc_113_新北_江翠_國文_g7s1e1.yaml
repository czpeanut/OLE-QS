  section: 3
  number: 18
  type: single
  page: 2
  stem: 「美國作家歐．亨利創作了著名的麥琪的禮物。在聖誕節來臨之際，妻子為了給丈夫買錶鍊而賣掉美麗的長髮，丈夫則賣掉祖傳的金錶給妻子買了梳子。結果是，他們彼此的禮物都失去了使用價值，但他們都得到了對方的真情。現在看來，當言語的表達變得蒼白，驗證情意的存在需要漫長的歲月時，物質的表達似乎成為最有效的替代，並被多數人接受。」（何子維
    重寫一個節日禮物的公式）下列關於「禮物」的敘述，何者最接近作者的觀點？
