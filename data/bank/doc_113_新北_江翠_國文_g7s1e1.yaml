  section: 3
  number: 19
  type: single
  page: 2
  stem: 「『寧願是荒野上飢餓的鷹，也不願做肥碩的井蛙！』執是之故，我學會綑綁行李。總是獨自走上生命的每個階段，從全然陌生的環境開始安頓自己。小學畢業，明明附近有所國中，我卻跑到離家四十分鐘車程的國中就讀。好不容易與他們熟了，成為一份子；明明附近有幾所高中可供選擇，卻大膽地跟導師講：『我要去臺北考高中！』」（簡媜
