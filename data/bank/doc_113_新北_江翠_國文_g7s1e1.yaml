- id: doc_113_新北_江翠_國文_g7s1e1_s4_3
  section: 4
  number: 3
  type: single
  page: 4
  stem: 關於暑假作業開頭兄妹之間的這段對話，何者敘述正確？
  options:
  - label: A
    content: 揭示本文依照時間先後敘述，是順序法
  - label: B
    content: 主角二人之間的感情不睦
  - label: C
    content: 兩人有每天撕日曆的習慣
  - label: D
    content: 直接切入暑假作業的主題。
  group_stem: "(二) 今天早上還沒有睡醒，小討厭鬼就跑來搖我的床。\n  「哥，快起來，起來幫我撕日曆。」「撕日曆？」我揉著惺松的雙眼，「幾百年沒撕日曆了，一大早撕什麼日曆﹖」\n\
    \  「就是好久沒撕了，才要叫你撕。」「自己不會撕﹖」「我就是撕不到才叫你幫忙嘛。」「哎喲，討厭，妳為什麼長那麼矮﹖」\n  「我又不是故意的。」她一臉無辜相。\n\
    \  我迷迷糊糊起了床，走到日曆前，抓抓頭。「怎麼才八月二十二日？」我問。「今天也不是星期三。今天是星期五。」\n  「八月二十四，」我隨手撕下雨張日曆，「很好，是星期五。」\n\
    \  「咦？可是媽媽生日是八月二十六日，早已經過去了。」妹妹抗議了。\n  「對嘛，我也覺得怪怪的。」我想了想，「妳說媽媽生日是星期幾﹖」\n   「是上個禮拜天，我記得了。」「上個禮拜天﹖」我們都陷入了數學計算思考，\n\
    「這麼說今天是八月三十一日。」「八月三十一日。」我們兩個人不約而同地尖叫了起來，「明天要開學了﹗」\n  天啊﹗明天要開學了。這是非常可怕的事實，光是想到暑假作業我就頭大。首先我有許多功課要寫，不但如此，還要交寫毛筆字一本、畫圖三張，最可怕的是要寫日記，每天一篇。我算了算，一共有五十幾篇，天啊……「哥，我們是不是現在要開始寫功課了﹖」小討厭問我。\n\
    \  「廢話，現在不寫，難道妳還明天拿到學校請老師幫妳寫﹖」「哥，可是我寫不完，怎麼辦？」她哭喪著臉，眼淚已經快流出來了。「我也不知道該怎麼辦？我自己的也寫不完。」聽到我也寫不完，小討厭似乎又有一點開心了，她說：「哥，你快想個辦法。」\n\
    \  我靈機一動，對她說：「妳先幫我記日記，然後我幫妳寫作業。」「我們的字又不一樣，我怎麼幫你記﹖」\n  「我又沒有要你真的寫上去，妳只要幫我想想暑假那一天都發生了什麼事，就好了。」\n\
    \  「那我的作業呢﹖」「妳的作業都是加減乘除，很簡單了，等我們作完了，我只要一會兒就幫妳寫好了。」\n  主意既定，交易也談妥。現在才是早上十點鐘﹐開始寫暑假作業，應該還來得及。我翻箱倒櫃，終於把丟得不知去向的作業簿找回來，先開始寫功課。\n\
    \  懶，懶﹐懶，懶，懶，懶，懶……\n一個字要寫一行，一行有十四個字，一共要寫兩百多行。真的搞不懂，為什麼明明已經會寫的字，要重複寫十四遍？\n  妹妹準備了一大張紙，畫好七月和八月的日期，開始替我想暑假發生的事。\n\
    \  「哥，有些日子發生了什麼事想不起來怎麼辦﹖」「妳就幫我隨便編。」\n  惰，惰，晴，惰，惰，惰，惰…\n一邊寫，小討厭得意地唱了起來：「嘻嘻，星期一猴子穿新衣。星期二猴子肚子餓。星期三猴子去爬山。星期四猴子去爬樹。星期五猴子去跳舞……」「星期六猴子去斗六。星期七猴子坐飛機。星期八猴子摔得軟趴趴。」我也跟著得意地亂編。\n\
    \  「我很討厭表姊。」妹妹表示。「我也很討厭。」「我可不可以編她撞到電線桿，被送到醫院去。」「反正老師也不認識她。」我欣然同意。\n  有了仇人之後，我們編日記的速度就快了，差不多在吃完中餐後不久，我們就把暑假的日記都編好了。不但如此，有幾個壞人都還排不上去。結果我的暑假日記看起來除了媽媽生日，到兒童樂園去玩，幾個比較值得紀念的日子之外，整部看起來像是災難大全。我們討厭的人不是走在馬路上被小狗咬到，再不然就是踩到大便。我有些擔心，老師會不會懷疑為什麼我認識的人都這麼倒楣？\
    \     \n節錄 侯文詠 暑假作業"
