  stem: 根據上文及圖表，以下說明何者正確？
  options:
  - label: A
    content: 2020 年台灣的總新生兒數是14 萬2391 人
  - label: B
    content: 從2013 年至2021 年，台灣的新生兒人數連年遞減
  - label: C
    content: 少子化的浪潮之下，台灣的新生兒人數不斷創下歷史新低
  - label: D
    content: 日本為了鼓勵生育，大學錄取名額增加，讓報考大學的考生可以人人有學校。
  group_stem: '(一)內政部公布2021 年台灣最新人口統計數字，總新生兒數僅15 萬3,820 人，相較2020 年減少1 萬1,429 名新生兒。2021
    年台灣地區死亡人數為18 萬3,732 人，已連續兩年「生不如死」，人口自然增加率為-1.27%，持續負成長。

    少子化敲響的國安警鐘離我們還有多遠？截至2021 年11 月底前，台灣的新生兒累計不到14 萬，長期研究我國人口趨勢變化的台灣大學社會學系退休教授薛承泰預測，2021
    年總新生兒數恐跌破16 萬，再度創新低。「歷年最低」這四字，在一年不如一年的新生兒數面前，似乎已成老生常談，去年台灣也正式迎來「生不如死」的時代，出生人數首次低於死亡人數，而這樣生死交叉的現況，不僅是現在式，也恐成為未來式。

    少子化的浪潮不只台灣，全球都有類似的問題。鄰近的日本預計，隨著18 歲人口逐年下滑，最快在明年度日本大學入學考試中，各大學的報考人數總數將少於總招生名額。這意味著，若考生不挑學校，人人都能進大學。日本將此現象稱為，大學「全入時代」正式到來。'
