  section: 3
  number: 4
  type: single
  page: 1
  stem: 夏夜一詩中，「朦朧地，田野靜靜地睡了！／只有窗外瓜架上的南瓜還醒著，／伸長了藤蔓輕輕地往屋頂上爬」，用未睡的事物襯托出夏夜的寧靜，請問下列文句「以動態事物襯托靜態景象」的手法，何者為非？
  options:
  - label: A
    content: 在班上一支粉筆掉在了地上，似乎天崩地裂一般劃破了班上的寧靜
  - label: B
    content: 深綠色的葉子經過兩番冷雨洗濯，更顯出翡翠一般鮮豔的色彩來
  - label: C
    content: 夜裡，冬天的山村，萬籟俱寂，只聽到那大雪不斷降落的沙沙聲和樹木的枯枝被積雪壓斷的咯吱聲
  - label: D
    content: 夏夜，涼風習習。獨自倚窗，看滿月掛在枝頭，今夜的窗前，除了時不時傳來幾聲蛐蛐的叫喚，別無其他。
