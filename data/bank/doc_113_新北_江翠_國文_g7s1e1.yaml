- id: doc_113_新北_江翠_國文_g7s1e1_s4_5
  section: 4
  number: 5
  type: single
  page: 4
  stem: 根據本文，下列何者不是螢火蟲的閃光所能發揮的作用？
  options:
  - label: A
    content: 求偶
  - label: B
    content: 誤導
  - label: C
    content: 誘食
  - label: D
    content: 求救。
  group_stem: "(三)  螢火蟲的美麗閃光在求偶中有著重要作用。不同種類的螢火蟲閃光的明暗、顏色、間隔等不同，因此不會交尾，保證了種群的穩定延續。\n\
    \    一般來說，雄性螢火蟲較為活躍，四處飛舞並通過閃光來吸引異性，而雌性則停在草叢中羞澀地發出信號，然後耐心等待。\n    有一種螢火蟲的雌蟲沒有翅，為了勾引雄蟲，會爬到醒目的枝葉上，扭動屁股來巧妙地調情。雄蟲發現閃光後，會迫降到不遠的草葉上，然後慢慢逼近，發出短促有力的閃光。如果雌蟲有意接受，就朝雄蟲羞澀地回應一次閃光，雄蟲一見便美滋滋地靠過去，當一回「新郎」。如果郎有情妹無意，雄蟲會知趣地飛走，另覓新歡。\n\
    \    還有一種螢火蟲，雌蟲會按精確的時間間隔，發出「亮―滅、亮―滅」的信號，雄蟲收到信號後，則以「亮――滅、亮――滅」的信號回答。一旦建立感情就飛到一起，迅速將閃光減弱，進入草叢裡共度洞房花燭夜。\n\
    \    最有趣的是，有一種螢火蟲求偶的時間很短，因此，雄蟲間競爭激烈，常勾心鬥角。有的雄蟲模仿雌蟲的閃光，使競爭對手誤入歧途，而自己則趁機溜走以便與雌蟲幽會。有的雌蟲則在別的雄蟲與雌蟲進行甜言蜜語的閃光對話中插話進去，發出閃光，打斷對話，甚至接過話頭。\n\
    \    螢火蟲的閃光語言一般是用來傳達愛的信息的，但有一種狡猾的螢火蟲卻將它發展為一種誘食方法。這種螢火蟲的雌蟲會模擬另一種螢火蟲的閃光，騙得雄蟲飛來。如果經不起色誘，當雄蟲興致勃勃作著當新郎的美夢時，雌蟲就會毫不客氣地將其捕捉，飽餐一頓。\
    \                                                         秦自民 螢火蟲的「閃光語言」（改寫）"
