  stem: 汪小道居住在水邊，十分懂得利用水中資源。部落裡有人在刺魚，有人坐小木舟網魚，有人在淺水灘撈貝，岸上的人在煮貝、吃貝，他們經年累月丟棄吃完的貝殼，堆成貝塚。請問：上文的敘述，最有可能是哪一個臺灣史前文化的生活方式？
  options:
  - label: A
    content: 大坌坑文化
  - label: B
    content: 長濱文化
  - label: C
    content: 圓山文化
  - label: D
    content: 十三行文化。
- id: doc_113_高雄_龍華_社會_g7s1e1_s1_20
  section: 1
  number: 20
  type: single
  page: 3
  stem: 李小瑩看到英國史學家卡爾曾在書裡說過：「歷史是現在與過去永無止境的對話」，為了方便研究，學者將歷史分為「史前時代」與「歷史時代」。請問：史前時代與歷史時代是以何作為分界？
  options:
  - label: A
    content: 文字的發明
  - label: B
    content: 農業的出現
  - label: C
    content: 陶器的製作
  - label: D
    content: 傳說的流傳。
- id: doc_113_高雄_龍華_社會_g7s1e1_s1_21
  section: 1
  number: 21
  type: single
  page: 3
  stem: 黃小翔在暑假期間到紐西蘭觀光，導遊介紹：「在太平洋的眾多島嶼上，有許多使用不同語言的民族，其中也發現當地的原住民毛利人與臺灣的原住民可能有所關連，因為對於魚類的稱呼很類似。」請問：這種說法的根據為何？
  options:
  - label: A
    content: 有相同的神話傳說
  - label: B
    content: 歷史文獻的紀錄
  - label: C
    content: 有相似的語言結構
  - label: D
    content: 族譜的流傳。
