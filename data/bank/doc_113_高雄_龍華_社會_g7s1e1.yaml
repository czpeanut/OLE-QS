  section: 1
  number: 25
  type: single
  page: 3
  stem: 李小平想了解歷史事實與歷史解釋不同，因而上網查詢資料。歷史事實是呈現客觀的事實本身，而歷史解釋則是後人對史實的詮釋。就以下四個選項而言，何者最接近「歷史解釋」？
