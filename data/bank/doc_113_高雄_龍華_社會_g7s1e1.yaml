  section: 1
  number: 23
  type: single
  page: 3
  stem: 趙小惠閱讀臺灣原住民傳說：「邵族的祖先原來住在其他地方，某次發現一隻肥碩的大白鹿，一路翻山越嶺追逐好幾天，正當精疲力盡時，眼前出現一片美麗山水，湖中有取不盡的魚蝦，此處就是南投日月潭。」請問：依據內容判斷，這是屬於哪一種類型的原住民傳說？
  options:
  - label: A
