  stem: 特有種（英語：endemic species，指特有性之現象或性質，英文為endemism）是指「因歷史、生態或生理因素等原因，造成其分布僅侷限於某一特定的地理區域或大陸，而未在其他地方中出現」的物種。請問：臺灣的生物中，特有種的櫻花鉤吻鮭，其主要形成的原因為何？
  options:
  - label: A
    content: 地勢高低起伏大，丘陵及山地面積廣大
  - label: B
    content: 曾與亞洲大陸相連，後來又被海洋隔離
  - label: C
    content: 曾歷經長期乾冷的氣候，導致生物變異
  - label: D
    content: 科技發達，人為特意製造基因重組
