  stem: '新冠肺炎疫情期間，我國政府兩度發放振興券，以期促進我國經濟發展。任何符合法定資格者皆可領取振興券，而其中一種資格即須為我國「國民」。某天，朱青、郭軫、王剛、汪影四位網友正在討論是否有資格領取我國政府所發放之消費券時有了以下對話：

    朱青：「來臺灣讀書、工作也15 年了，我準備在下個月去內政部申請歸化。」

    郭軫：「我父母都只有日本國籍，但我在臺灣出生、長大。」

    王剛：「我的父母都有中華民國國籍，可是我是在韓國出生的。」

    汪影：「我的父母都是美國國民，我也在美國出生，他們預計會在臺灣工作三年，所以我會在臺灣完成我的高中學業。」

    請問：若僅考量國籍因素以及上述對話內容，下列何人在討論當下最有可能有資格領取我國政府所發放之振興券？'
