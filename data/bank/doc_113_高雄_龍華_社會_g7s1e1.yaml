  group_stem: '◆我國社會中，基於對不同生理性別者所抱期待的不同，以至於社會上許多人會認為護士、幼稚園老師等較需關懷性特質的職業，應由生理女性來擔任；而認為醫師、高階主管、工程師等較需工具性特質的職業，應由生理男性來擔任。而也因為相關的想法，在我國街道上時常可以看到張貼在路邊的徵才廣告寫著：徵求洗碗阿姨、尋找車長先生、急需廚房歐巴桑等。

