- id: doc_113_高雄_鼎金_自然_g9s1e1_s2_38
  section: 2
  number: 38
  type: single
  page: 4
  stem: 文章中提到用多少質量的足球當成計算條件?
  options:
  - label: A
    content: 410g
  - label: B
    content: 450g
  - label: C
    content: 0.41kg
  - label: D
    content: 0.43kg
  group_stem: "閱讀下列文章回答38~40 題\n\n星爺一腳帶你飛！從物理學角度解析「大力金剛腿」有多致命？——《少林足球》從基礎開始檢驗：足球射門有可能將人擊飛嗎？\n\
    在少林足球中，最最最常看到的景象當屬主角阿星（周星馳飾）踢出足球，球速之快會讓被足球擊中的人向後飛走。有幾個足球相關的參數我們這篇文章一定會用到的先蒐集起來，根據世界足總\
    \ FIFA 的規定，足球共分 5 種不同的 大小，而成人職業比賽所用的足球都屬 Size 5 的大小，周長介於68~70 公分之間（原本為英制單位27~28\
    \ 英 吋），也就是直徑大約22 公分，而在比賽開始前的足球剛打完氣重量應該要介於 410~450 公克之間（原本為英制單 位14~16 盎司，我們以下取平均值430\
    \ 克來計算）。我們先別管踢的過程，只考慮一位70 公斤的人應該要被一顆多 快的足球擊中，才能向後飛大概2 公尺吧！我們假設力100%傳導（雖然不太可能，這已經是答案最不會太誇張的假設\
    \ 了），並且足球接觸人的時間為 0.1 秒\n用簡單的F=M 足球 x A 足球=M 人x A 人來運算一下。\n ➔  0.43 x (0-V）/0.1\
    \ = 70  x a\n    （M 足球）    （A 足球）    （M 人）（A 人）\n其中V 就是我們「未知的球」的速度，人的加速度a 我們使用位移\
    \ (s)之於加速度的關係公式 $s = V_{0}t + 0.5at^{2}$ 來代 入取得，假設人向後飛的時間為0.5 秒，我得到$2=0.5a(0.5)^{2}$，也就是說a\
    \ =16m/$s^{2}$，我們把這些假設代回上面的等 式運算一下，可以知道球的速度大概要是……秒速Z 公尺/秒，大約時速Y 公里/小時（正負號僅代表方向）。\n\
    太驚人了！只不過是個把人擊飛，球就需要這麼誇張的速度，而且不要忘記這可是球命中人的速度，也就是說前面球 踢出去、整個飛行過程可能會失去的速度還沒考慮到，就已經比一般商用客機的巡航速度還快了。但是我們談的是足\
    \ 球，這樣比可能沒啥感覺，所以筆者特別幫大家查了一下：世界上最快射門的記錄！這項紀錄的保持人是前巴西足球 員羅尼賀伯森（Ronny Heberson）。當時根據場邊的記錄，這記射門最高時速為每小時221\
    \ 公里，差不多是秒速 58.6 公尺，為目前為止記錄過最快的射門。\n摘錄自泛科學網站https://pansci.asia/archives/328883"
