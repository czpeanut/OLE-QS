  page: 5
  stem: 對於詩中這艘小紙船，下列說明何者正確？
  options:
  - label: A
    content: 五彩的紙船，上面坐著一個小水手
  - label: B
    content: 白色的紙船，上面畫著蟋蟀和螞蟻
  - label: C
    content: 五彩的紙船，上面載有一隻小蟋蟀
  - label: D
    content: 白色的紙船，上面畫有水手的圖樣。
  group_stem: '（一）

    你就快點摺起一個小紙船罷，

    別捨不得一張白色的勞作紙呀，

    再用你五彩的蠟筆

    畫上一個歪戴著白帽子的小水手。


    小蟋蟀是去參加一個音樂會，

    要過河去唱歌；

    小螞蟻忙了一天想媽媽，

    要過河趕回家。

    你看，你看他們都等急啦！


    當那太陽先生向白天告別的時候，

    當那雲彩小姐被吻的羞紅的臉，

    當那蝌蚪孩子要躲在河床下休息，

    就讓你的小紙船揚帆罷！


    讓它浮過小橋，

    讓它輕輕浮過小橋，

    可別驚醒了睡在小河上的晚霞。（節錄自楊喚 小紙船）'
