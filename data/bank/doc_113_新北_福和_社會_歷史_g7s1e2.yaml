  stem: 下列何者最有可能是氏史久龍在臺灣的經歷？(甲)來臺需先申請渡臺許可證(乙)可到郵政總局發電報回對岸(丙)從基隆搭乘火車到淡水(丁)與外國商人洽商(戊)看到漢人越界開墾。L4
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙丙丁
  - label: C
    content: 丙丁戊
  - label: D
