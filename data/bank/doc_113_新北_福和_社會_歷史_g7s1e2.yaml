  group_stem: '(一)閱讀下列敘述，並回答問題：

    西元1892 年，一位文人史久龍自廈門搭乘輪船爹利士號來臺探親，行船一日到達安平。來臺後，應聘於臺灣府辦公，處理臺灣南路收支錢糧、兵餉等文案。期間因職務所需，曾遊歷臺灣各地，如臺南、嘉義、臺北、彰化等地。每到一處新地方，史久龍就會觀察當地的民情、建築與布局他也曾因為負責監督樟腦業而深入埔里設廳等山區地帶，親自見聞臺灣原住民生活與習俗。

    直至西元1895，因為局勢動盪，史久龍到臺南拜會劉永福後，便與家人搭乘輪船返回中國。史久龍著有《憶臺雜記》一書，紀錄在臺兩年七個月又十天的這段經歷，成為見證清末臺灣發展的重要史料。'
