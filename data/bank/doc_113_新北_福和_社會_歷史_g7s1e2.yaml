- id: doc_113_新北_福和_社會_歷史_g7s1e2_s1_26
  section: 1
  number: 26
  type: single
  page: 1
  stem: '下列為十七世紀對漢番互動的記載：

    山內「生番」，野性難馴，常有商人燒屋的情形；但挑起衝突與爭端的，常是漢人。漢人拓墾者為了開墾，不論「生番」、「熟番」的生活區域，都會加以侵占；或是結黨入山搭建房屋，一旦看到「番人」獵取鹿皮，往往竊為己有。

    上述內容應與下列何者有關？4-1'
  options:
  - label: A
    content: 清朝政府推動開山撫番
  - label: B
    content: 鄭氏施行軍屯制度
  - label: C
    content: 清政府實施劃界封山
  - label: D
    content: 荷蘭東印度公司採取間接統治。
- id: doc_113_新北_福和_社會_歷史_g7s1e2_s1_27
  section: 1
  number: 27
  type: single
  page: 2
  stem: '古蹟是歷史的見證，下表為臺灣古蹟解說，根據表中所述判斷，這些古蹟所處的時代先後順序應為下列何者？L4

    | 代號 | 古蹟名稱 | 介紹 |

    |---|---|---|

    | 甲 | 八通關古道 | 清代所建第一批連通臺灣本島前後山的北、中、南三條開山道路中的中路，也是目前僅存的一條。 |

    | 乙 | 土牛碑 | 知縣張世珍所立，詳載土牛堆和土牛溝尺寸，「永禁民人逾越私墾」限制越界開墾。 |

    | 丙 | 獅球嶺隧道 | 臺灣第一座鐵路隧道，亦是僅存的清代鐵路隧道。 |

    | 丁 | 臺南孔廟 | 全台最早的孔廟，由陳永華所創建。 |'
  options:
  - label: A
    content: 甲→乙→丁→丙
  - label: B
    content: 乙→丁→丙→甲
  - label: C
    content: 丙→乙→丁→甲
  - label: D
    content: 丁→乙→甲→丙。
- id: doc_113_新北_福和_社會_歷史_g7s1e2_s1_28
  section: 1
  number: 28
  type: single
  page: 2
  stem: 諺語言簡意胲，常反映當時廣大人民的生活與想法。請問下列哪個諺語與「有唐山公，無唐山媽」，所反映的清初社會現象是類似？4-1
  options:
  - label: A
    content: 唐山過臺灣，心肝結歸丸
  - label: B
    content: 過番剩一半，過臺灣沒得看
  - label: C
    content: 一個某，較好三個天公祖
  - label: D
    content: 六死三留一回頭。
- id: doc_113_新北_福和_社會_歷史_g7s1e2_s2_29
  section: 2
  number: 29
  type: single
  page: 2
  stem: 上文提到，史久龍自廈門搭乘輪船來臺。請問：臺灣開始有輪船等現代化建設與下列哪一個背景有關？4-3
  options:
  - label: A
    content: 外力侵犯臺灣
  - label: B
    content: 清法戰爭割台
  - label: C
    content: 島內民變四起
  - label: D
    content: 臺灣納入版圖
  group_stem: '(一)閱讀下列敘述，並回答問題：

    西元1892 年，一位文人史久龍自廈門搭乘輪船爹利士號來臺探親，行船一日到達安平。來臺後，應聘於臺灣府辦公，處理臺灣南路收支錢糧、兵餉等文案。期間因職務所需，曾遊歷臺灣各地，如臺南、嘉義、臺北、彰化等地。每到一處新地方，史久龍就會觀察當地的民情、建築與布局他也曾因為負責監督樟腦業而深入埔里設廳等山區地帶，親自見聞臺灣原住民生活與習俗。

    直至西元1895，因為局勢動盪，史久龍到臺南拜會劉永福後，便與家人搭乘輪船返回中國。史久龍著有《憶臺雜記》一書，紀錄在臺兩年七個月又十天的這段經歷，成為見證清末臺灣發展的重要史料。'
