- id: doc_113_台中_居仁_國文_g7s2e2_s5_1
  section: 5
  number: 1
  type: single
  page: 4
  stem: 依據上文，關於「52 赫茲鯨魚」，下列敘述何者正確？
  options:
  - label: A
    content: 「52 赫茲鯨魚」的名稱來自於它的游泳速度，而 非它的鳴叫頻率
  - label: B
    content: 「52 赫茲鯨魚」的鳴叫聲與其他鯨魚相似，因此 很容易找到同伴
  - label: C
    content: 「52 赫茲鯨魚」的聲音是透過錄音設備模擬出來 的，實際上並不存在
  - label: D
    content: 「52 赫茲鯨魚」的鳴叫頻率異於其他鯨魚，因此 可能無法順利與同類溝通
  group_stem: "（一）\n    你聽說過「世界上最孤獨的鯨魚」嗎？\n\n   「52 赫茲」是一隻鯨魚的名字。牠的歌聲比同伴鳴唱的頻率都來得高、不被同伴們聽見，因此被稱做「世界上最孤獨的鯨魚」。雖然真面目仍然深藏在藍海之下，牠的故事卻令人動容而廣為流傳，甚至成為了歌曲和電影的題材。在美國，人們發動群募計畫資助紀錄片的拍攝，希望導演和海洋學家能讓人們能夠再次見到牠，知道牠過得好不好。然而經歷二十幾年的追尋，科學家們卻認為這隻鯨魚可能並不如人們想像的如此孤單，所謂\
    \ 52 赫茲鯨魚的孤獨，可能只是我們內心渴望愛與陪伴的情感投射。\n\n   「52 赫茲」首次在太平洋被捕捉到的鳴唱紀錄，距今已有二十年餘。你一定也很好奇：牠究竟是否真的像我們所想的那般孤單寂寞？或者，更進一步的問一些生物學的問題：牠是男、還是女？牠是隻齒鯨還是鬚鯨，是藍鯨、抹香鯨、長鬚鯨還是大翅鯨？然而，不管是有什麼樣的猜測，如果能夠再次聽見這隻獨特鯨魚的聲音、甚至看見牠的容貌，不僅是能夠讓人們的感情獲得救贖，科學家更能從中得知更多關於鯨魚的知識和他們歌聲的秘密。\n\
    \n    關於「52 赫茲」的故事起源於1989 年，美國海軍建立了名為「SOSUS」（Sound surveillance system）的水下聲音監測系統，是一套以陣列式的水下麥克風來偵測敵軍潛艦的設備。有一天，它收到了一些奇怪的訊號，聽起來像是藍鯨的歌聲，但有個重大的差別：它的頻率為52\
    \ 赫茲，相較於藍鯨經常鳴唱的10～40 赫茲，它的頻率是太高了些；聽起來也不像長鬚鯨，長鬚鯨鳴唱的頻率通常是 50 赫茲。\n\n    最早察覺到這段錄音獨特之處的人，是麻省的伍茲霍爾海洋研究所海洋哺乳類學家瓦特金斯，他持續追尋這隻以52\
    \ 赫茲鳴唱的鯨魚，直到2004 年辭世，享齡七十八歲。在告別人世的前幾個月，他與研究夥伴把他們在北太平洋中部及東部海域追尋「52 赫茲」的研究成果正式發表在學術期刊上，其成果主要指出聲音綿延的範圍很小，軌跡主要都由西向東、由北向南。「即使仔細地年復一年又無所不包的監聽，有這樣特色的聲音卻只有一個，而且每季都只有一個來源。」瓦特金斯等人的研究如此寫道。\n\
    \n    於是，這項發現——或者說是它所造就的更多謎團——集結了各種引人入勝的元素：全心投入的卓越科學家，與軍方好幾年的合作研究，加密的聲音檔案，以及這些秘密資料，終於以研究出版的形式在世人眼前解密。\n\
    \n    主流媒體稱它為「一隻孤單動物的故事」。2013 年，英國的小報《快報》（the Express）聲稱這隻鯨魚不尋常的鳴唱「使牠難以找到愛情。」於是牠的故事開始被反覆傳頌，逐漸感動了全世界，成了動物界最神秘的明星之一。\n\
    \n改寫自科普報導「世界上最孤獨的鯨魚52 赫茲」"
