  group_stem: "（三）\n漢武帝天漢三年，帝巡東海，祠①恆山，王母遣使獻靈膠四兩，吉光毛裘。武帝以付外庫，不知膠裘二物之妙也。以為西國雖遠，而貢者不奇，使者未遣之。\n\
    \n    帝幸華林苑，射虎兕②，弩絃斷。使者時隨駕，因上言：「請以膠一分，以口濡其膠，以續弩絃。」帝驚曰：「此異物也。」乃使武士數人，對牽引③之，終日不脫，勝未續時也。膠青色，如碧玉。吉光毛裘黃白，蓋神馬之類。裘入水終日不沈。入火不焦。\n\
    \n    帝悟，厚賂使者而遣去。集絃膠出自鳳驎洲，洲在西海中，地面正方，皆一千五百里，四面皆弱水遶之。上多鳳驎。數萬為群。煮鳳喙及驎角，合煎作膠。名之集絃膠。一名連金泥。弓弩已斷之絃。刀劍已斷之鐵。以膠連續，終不脫也。\n\
    \     \n李昉〈太平廣記 王母使者〉\n\n注 ①祠：祭祀。②兕ㄙˋ：犀牛。③牽引：拉。"
