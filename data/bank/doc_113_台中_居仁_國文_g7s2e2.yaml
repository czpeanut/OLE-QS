  stem: 在文中，母親曬箱子的情景表達了什麼情感或意義？
  options:
  - label: A
    content: 母親對生活的疲憊，表現出她在日常瑣事中感到的 無力與厭倦，對未來的迷茫與不安
  - label: B
    content: 母親對過去的懷念和珍惜，象徵著她對青春和記憶 的珍藏，顯示她仍然在心中保留著美好的回憶
  - label: C
    content: 母親對孩子的期望，暗示她希望將自己的夢想和願 望傳遞給下一代，希望孩子能夠實現她未竟的理想
  - label: D
    content: 母親的日常工作，強調她在家庭中所需承擔的角 色，顯示出她生活的繁忙與忙碌
  group_stem: "（五）\n    我是不是仙女變的？哪一個母親不是仙女變的？\n\n    像故事中的小織女，每一個女孩都曾住在星河之畔，她們織虹紡霓，藏雲捉月，她們幾曾煩心掛慮？她們是天神最偏憐的小女兒，她們終日臨水自照，驚訝於自己美麗的羽衣和美麗的肌膚，她們久久凝注著自己的青春，被那份光華弄得癡然如醉。\n\
    \n    而有一天，她的羽衣不見了，她換上了人間的粗布，她已經決定做一個母親。有人說她的羽衣被鎖在箱子裡，她再也不能飛翔了。人們還說，是她丈夫鎖上的，鑰匙藏在極秘密的地方。\n\
    \n    可是，所有的母親都明白那仙女根本就知道箱子在那裡，她也知道藏鑰匙的所在，在某個無人的時候，她甚至會惆悵地開啟箱子，用憂傷的目光撫摸那些柔軟的羽毛，她知道，只要羽衣一著身，她就會重新回到雲端，可是她把柔軟白亮的羽毛拍了又拍，仍然無聲無息地關上箱子，藏好鑰匙。\n\
    \n    是她自己鎖住那身昔日的羽衣的。她不能飛了，因為她已不忍飛去。而狡黠的小女兒總是偷窺到那藏在母親眼中的秘密。許多年前，那時我自己還是小女孩，我總是驚奇地窺伺著母親。\n\
    \n    她在口琴背上刻了小小的兩個字—「靜鷗」，那裡面有什麼故事嗎？那不是母親的名字，卻是母親名字的諧音，她也曾夢想過自己是一隻靜棲的海鷗嗎？她不怎麼會吹口琴，我甚至想不起她吹過什麼好聽的歌，但那名字對我而言是母親神秘的羽衣，她輕輕寫那兩個字的時候，她可以立刻變了一個人，她在那名字裡是另外一個我所不認識的有翅的什麼。\n\
    \n    母親曬箱子的時候是她另外一種異常的時刻，母親似乎有些東西，完全不是拿來用的，只為放在箱底，按時年年在三伏天取出來暴曬。記憶中母親曬箱子的時候就是我興奮欲狂的時候。母親曬些什麼？我已不記得，記得的是樟木箱子又深又沉，像一個渾沌黝黑初生的宇宙，還記得的是陽光下竹竿上富麗奪人的顏色，以及怪異卻又嚴肅的樟腦味，以及我在母親喝禁聲中東摸摸西探探的快樂。\n\
    \n改寫自張曉風 母親的羽衣"
