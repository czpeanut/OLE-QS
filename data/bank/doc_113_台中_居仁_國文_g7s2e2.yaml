  stem: 「木製活字印刷是王禎所發明。每個活字的規格都相 同，排在木字盤裡，用木楔楔牢。他還設計製造出一種 旋轉活字架，以便排字工人很快地用小鑷子鉗出所需要
    的活字。由於漢字很多，活字架相當龐大，直徑約2.5 公尺。為了提高揀字效率，王禎還編了漢字記憶口訣， 幫助排字工人更快找到所需的字。活字架的分隔盤是有 索引的，每格字盤裡相同的字的數量是根據字的使用頻
    率來決定。從此排字工人可以坐著揀字，印刷過後也很 容易將活字放回原處再使用。」根據這段文字，下列何 者最不可能是王禎對印刷術的貢獻？
  options:
  - label: A
    content: 設計製造了旋轉活字架
  - label: B
    content: 發明木製活字並將其規格化
