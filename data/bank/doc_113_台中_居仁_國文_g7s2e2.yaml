  group_stem: "（二）\n（甲）\n舍南舍北皆春水，但見群鷗日日來。\n花徑不曾緣客掃，蓬門①今始為君開。\n盤飧②市遠無兼味，樽③酒家貧只舊醅④。\n\
    肯與鄰翁相對飲，隔籬呼取盡餘杯⑤。\n       唐・杜甫〈客至〉\n注 ①蓬門：用蓬草編成的門（形容居室簡陋）。\n②盤飧：盤中的菜肴。③樽：酒杯。④醅：沒過濾的酒。\n\
    ⑤杯：酒杯，這裡借代酒。\n________________________________________________\n（乙）\n     杜甫的客至詩題後原有注解「喜崔明府相過」六字，「明府」乃唐人對縣令的尊稱，這位「崔明府」正是杜甫的舅舅，他在當年春天拜訪杜甫，親人的到訪，使詩人熱烈相迎，心情也隨之開懷。\n\
    \n  詩中「舍南舍北」的所在處，為杜甫位於四川成都浣花溪畔築蓋的一間茅屋，史稱「浣花草堂」。安史之亂後，杜甫在這裡度過人生中最為安定的一段田園生活。\n\n\
    \    當親舅「崔明府」拜訪浣花草堂，杜甫在此已居住一年餘，詩中前兩句描寫家門前後春水圍繞，詩人終日徜徉①山水鷗鳥之間，生活清寒卻也恬淡自適；其中「花徑不曾緣客掃，蓬門今始為君開」，說明杜甫居住此地往來人客之稀少，故一見親人到訪，興奮地趕緊清理庭院，打掃門前花草繁茂的小路。盛情的杜甫，雖極力想端出好酒好菜，招待這位至親稀客，但因草堂距離市集遙遠，未能多備菜肴，連既有的酒都是口感不好的舊時濁酒。最後，這頓粗糙簡單的筵席尚未結束，杜甫詢問客人，可願和隔壁老翁相飲一番，展現其敦厚親鄰的率真性情。全詩以第一人稱書寫，與杜甫其他憂國憫民、漂泊不定的時代史詩相比，客至呈現的是如話家常的田園風情，充滿淳樸的鄉居樂趣。\n\
    注①徜徉：安閒自在的四處走動。\n\n   改寫自文心工作室花徑不曾緣客掃，蓬門今始為君開"
