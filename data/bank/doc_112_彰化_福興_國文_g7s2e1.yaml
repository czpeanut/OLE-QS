- id: doc_112_彰化_福興_國文_g7s2e1_s3_4
  section: 3
  number: 4
  type: single
  page: 6
  stem: 就本詩的意境與主旨來看，這是一首什麼性質的詩？
  options:
  - label: A
    content: 邊塞懷鄉
  - label: B
    content: 山水田園
  - label: C
    content: 社會寫實
  - label: D
    content: 閨怨思念。
  group_stem: '故人具雞黍，邀我至田家。

    綠樹村邊合，青山郭外斜。

    開筵面場圃，把酒話桑麻。

    待到重陽日，還來就菊花。（孟浩然 過故人莊）


    【注釋】(1)具：準備。(2)雞黍：指招待賓客的家常菜肴。(3)合：圍繞。(4)郭：外城。

    (5)斜：斜臥。(6)筵：酒席。(7)桑麻：借指農作物生長等事。

    (8)就：親近。'
