  group_stem: '臺北 泰順街是一條尋常百姓居住的小街，但其間的一座寓所在兩岸三地詩人學者中享有不凡聲譽——它的名字叫「燈屋」，是臺灣著名老詩人羅門和蓉子伉儷的居所。

    　　年近八旬的羅門朗聲笑迎記者，蓉子則輕聲柔語邀引記者入屋。

    　　「我做三件作品分送三位母親。」羅門從地上抱起一本有桌面大小的散頁集子，攤開向記者介紹。「臺灣是我的『養母』，她養我近一甲子，我在臺北創造一個被評論界稱為臺灣現代裝置藝術始祖的『燈屋』給她。大陸是我的『生母』，她生出我『美好幸福的童年』，我在海南島也造一個美麗的『圖象燈屋』給她，那裡存藏我與蓉子一生創作的心路歷程與成果，及寶貴的歷史回憶。」在羅門心裡，地球是他也是全人類的「祖母」。進入二十一世紀，於二〇〇〇年，他構想創造一個「美」的「詩國」給「祖母」她。近年，他邀請一位著名華裔設計師為「詩國」作建築設計，希望有力人士資助能在臺灣或中國某個景點落成，將詩的美具象的留給地球上的後人。

    　　羅門滔滔傾言，蓉子在旁忙碌著為記者準備茶點，並不時提醒羅門簡約些。

    　　思路稍頓的羅門一轉身指著屋角的一盞落地木質兼藤質組合的頂燈說：「她叫『燈塔』，和『燈屋』同時誕生於一九五五年四月四日，是我和蓉子結婚見證，她一直照耀著我和蓉子的生命航道。」五十二年來的每一個四月四日，蓉子都會收到羅門的一封長長的結婚紀念信。

    中國新聞網 臺灣詩壇伉儷：羅門與蓉子'
