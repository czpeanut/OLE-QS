  stem: 「哥倫布交換」（Columbian Exchange）是一場東半球與西半球之間，生物、農作物、人種、文化、傳染病，甚至思想觀念的突發性交流。它是人類歷史上的跨越種族、地域的一件重要事件。這場「交換」為世界帶來何種影響？
