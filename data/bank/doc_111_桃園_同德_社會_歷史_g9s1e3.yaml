  stem: 「每個人都在力圖運用自己的資本，來使其產品獲得最大的價值。一般來說，他並不企圖增進公共福利，也不知道他所增進的公共福利是多少。他所追求的東西僅僅是他個人的利益、自己的安樂。但在這樣做時，有一隻『看不見的手』引導他去促進一種目標，而這種目標絕不是他所追求的東西他在追逐自己利益的同時，也促進了社會利益。」這段話出現的歷史背景為何？
