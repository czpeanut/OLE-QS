  group_stem: '*說起弗蘭夫人在聖奧諾雷大街的房子，在巴黎真是無人不 them、無人不曉。大家都知道，能出入這裡的客人不憑出身、財富、權位，而只憑才智。哲學家達朗貝、孟德斯鳩、伏爾泰、愛爾維修……這幾位都是此處的常客。孟德斯鳩的《波斯人信札》曾在此處興起熱烈的討論，該書描寫東方國家盛行的後宮文化，妻妾爭寵、太監主事，為女性受男性支配打抱不平，並由此導引出一個符合道德的社會應考慮法律的制定。在這裡，人們不僅僅討論文學，他們對社會政治也有很大的影響力，甚至對政府人選都有發言權。'
