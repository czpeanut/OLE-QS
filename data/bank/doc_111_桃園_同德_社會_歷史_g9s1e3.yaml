    content: 美洲的傳染病因而傳至歐洲，造成大量人口死亡，許多文化因此消失。
  - label: C
    content: 為了開採美洲礦產，歐洲人將非洲黑奴移往美洲，使美洲出現新的人種。
  - label: D
    content: 歐洲人將美洲白銀銷往中國，當時中國正處於元朝，絲瓷貿易達於巔峰。
