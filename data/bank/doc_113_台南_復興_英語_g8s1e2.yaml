  stem: Which is true according to the reading?
  options:
  - label: A
    content: People have sleep paralysis because they do something bad.
  - label: B
    content: If your grandma has sleep paralysis, you may also have it.
  - label: C
    content: Sleep paralysis may happen when you sleep on your side.
  - label: D
    content: There are no ways to stop sleep paralysis. Many people die from it.
  group_stem: "D.\n    Some people have an experience like this: They wake up during\
    \ their sleep but can't move at all for a few minutes. Chinese people call it\
    \ \"Ghost on you.\" Sounds terrible, doesn't it? In fact, doctors have different\
    \ viewpoints toward \"Ghost on you.\" They call this sleep paralysis. It happens\
    \ when your brain wakes up but your body doesn't. But why do people have sleep\
    \ paralysis and what can we do with it? Read on and learn more about it.\n\n|\
    \ When does it happen? | How can you prevent it? |\n| :--- | :--- |\n| Sleep paralysis\
    \ usually happens when you are waking up. However, it could also happen when you\
    \ are falling asleep, too. | 1. Get enough sleep, about six to eight hours a day.<br>2.\
    \ Get up and go to bed at the same time.<br>3. Exercise often and eat healthy\
    \ food. |\n\n| Why does it happen? | What can you do when sleep paralysis happens?\
    \ |\n| :--- | :--- |\n| 1. You don't get enough sleep.<br>2. You have bad sleeping\
    \ habits.<br>3. You have a family history of sleep paralysis.<br>4. You didn't\
    \ go to bed or get up at a regular time. | 1. When it happens, go back to sleep\
    \ if you can.<br>2. Try to relax your body.<br>3. Think of something good. |\n\
    \n\U0001F4D6viewpoint 觀點 brain 大腦 prevent 預防 regular 固定的"
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
