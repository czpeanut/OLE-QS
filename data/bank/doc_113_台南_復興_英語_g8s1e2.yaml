    \ you talking about, Dad?\" Jeremy says.\n    \"We are tired of each other. And\
    \ we don't talk any more. We can't see the point of staying married. We decide\
    \ to leave each other. It has nothing to do with you. You and your sister are\
    \ why we are together for this long.\"\n    Jeremy hung up the phone and called\
