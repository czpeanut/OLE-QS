- id: doc_113_台中_居仁_數學_g8s2e3_s1_13
  section: 1
  number: 13
  type: fill
  page: 2
  stem: '以下敘述哪些正確？________。

    (A) 在一平面上，若有相異兩條直線同時垂直於另一條直線，則這兩條直線一定互相平行。

    (B) 四邊形 $ABCD$ 中，若 $\angle A=\angle B$ 且 $\overline{AB}=\overline{CD}$，則四邊形 $ABCD$
    一定是平行四邊形。

    (C) 四邊形 $ABCD$ 中，若 $\angle A$ 和 $\angle B$ 互補，且 $\angle B=\angle D$，則四邊形 $ABCD$
    一定是平行四邊形。

    (D) 平行四邊形的兩條對角線將平行四邊形分成四個全等的三角形。

    (E) 平行四邊形的對角相等，鄰角也相等。

    (F) 如果有一個四邊形的一組對邊互相平行，另一組對邊等長，則這個四邊形必為平行四邊形。'
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 數學
      code: 4-2
      title: 平行四邊形
      chapter: 第4章 平行與四邊形
