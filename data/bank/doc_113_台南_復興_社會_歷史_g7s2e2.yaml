  stem: 楊逵出生於 1906 年的臺南，是臺灣著名小說家。1927 年後，因參與社會運動觸怒日本當局，出入牢獄前後十次。1947 年，因某一事件，和妻子葉陶雙雙被捕、判處死刑，槍決前一天幸因「非軍人改由司法審判」的命令，三個月後獲釋。1948
