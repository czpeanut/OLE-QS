  section: 1
  number: 35
  type: single
  page: 2
  stem: 一些老人家回憶道：「經由日本統治，為臺灣帶來一些好處，像是很多人都接受了教育。」但是，有學者提到：「單從某一教育層面來看，日本人並不是以教育臺灣人民具有獨立思考的能力作為目標。」請問：關於老人家和學者所說的話，下列何者最適連合舉例說明？
  options:
  - label: A
    content: 日本統治初期，便對臺灣人推動義務教育
  - label: B
    content: 日本為拉攏人心，開辦大量漢文的課程
  - label: C
    content: 日本強調日臺合一，合併小學校與公學校
  - label: D
    content: 日本鼓勵臺灣人，就讀具實用性的知識
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
