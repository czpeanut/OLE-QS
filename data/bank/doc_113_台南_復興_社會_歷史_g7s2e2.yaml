  stem: 那一年 47 歲的林獻堂從基隆出發，展開一年多的環球之旅，從埃及到歐洲，最後再前往美國，他把旅行中所見所聞寫成日記，以連載的方式發表在報紙上，他用他的腳步與視野，帶著全臺灣的人們去旅行。請問：下列哪一項敘述與林獻堂無關？
