  stem: 臺灣民眾黨曾向總督府提出嚴正抗議，甚至連絡上了日本中央官員，希望能改善鴉片相關政策。在得不到官方任何回應後，認為必須訴諸國際組織，透過外國向總督府施加壓力。請問：當時引起知識份子不滿的鴉片政策為何？
  options:
  - label: A
    content: 政府採漸禁手段，蓄意准許臺灣人吸食鴉片
  - label: B
    content: 政府准許日本民眾，不用申請便可販售鴉片
  - label: C
    content: 政府嚴禁鴉片販售，無視鴉片成癮者的痛苦
  - label: D
    content: 政府放任臺灣人購買鴉片，上癮者大幅增加
