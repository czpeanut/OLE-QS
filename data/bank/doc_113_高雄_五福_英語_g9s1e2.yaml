  page: 4
  stem: Below are four students with their own problems. Who is more likely to face
    peer pressure?
  options:
  - label: A
    content: 'Sean: I am a slow learner. I do everything very slowly, and I usually
      need more time to finish things than my classmates. That’s why my parents get
      angry with me. I really want them to be happy with me, but I guess I am just
      never quick enough.'
  - label: B
    content: 'Kira: Martha, Mina and May were my best friends, and we did everything
      together. But one day, they started to wear pink clothes only, and used pink
      schoolbags, pink lunch boxes and pink notebooks. I asked Mom to buy me pink
      clothes, but she said no. Now my friends stopped playing with me because I am
      not “pink” enough like them.'
  - label: C
    content: 'John: My best friend Allen was a good student before. But months ago,
      he made another new friend, Frank, and they started to spend more and more time
      together. At first I thought it was ok and felt happy for Allen. But one day
      I found Allen smoking at the playground, and he started to use dirty words.
      What’s worse, his grades are becoming worse and worse. Now I am really worried
      about him and don’t know what to do.'
  - label: D
    content: 'Kaden: I am on the school basketball team, and I love my team very much.
      But this year, after we have a new leader, I start to have a lot of problems.
      He always says that I am late for practice, so he makes me practice more. He
      doesn''t think I am strong enough or let me join the game. Now I am thinking
      about giving up basketball.'
  group_stem: '“Oh, come on! It’s just a cigarette! That’s not a big deal!” says the
    coolest kid in your class. You stand there, feel worried, and don’t know what
    to do and say. The other classmates look at you and start laughing at you… In
    your life, you may sometimes experience ”peer pressure.” It’s a moment when you
    feel that you MUST do something just because your friends and classmates are doing
    it.

    When facing peer pressure, most people simply act as others do because they don’t
    want to look “different.” They don’t want their classmates or friends to make
    fun of them, so they choose to follow other people to show that they are part
    of the big group. But the problem is, when they act as others do, they sometimes
    lose the ability to tell right from wrong. That is, even though they know doing
    something is not right, they still choose to do that.

    In fact, you still can do something to fight peer pressure. Giving your friends
    a serious look and saying “No, thanks” in a polite way may be the best to help
    you get out of peer pressure. Also, you need to choose your friends carefully
    because real friends will not ask you to do bad things. With real friends, you
    don’t have to worry about peer pressure at all. You should always remember that
    you will never become a bad person or a loser because you don’t follow other people.
    It’s always up to you to choose the right things for yourself.

     cigarette 香菸 simply 僅僅 ability 能力'
