  group_stem: "Monica didn’t live a good life. She prayed to the god that she could\
    \ be rich. One day, a goose flew to her. It shone brightly and it could speak!\
    \ It said, “I am not a common goose. In fact, I was born with golden feathers.\
    \ You can get three of my golden feathers and sell them at the market. Believe\
    \ me, you can get a lot of money. I can’t stay here for too long, but I will come\
    \ and visit you every two months.” Monica was very excited. She followed the goose’s\
    \ words and made a lot of money. The goose kept its word. But after a while, she\
    \ told herself, “I can only get three golden feathers every two months. Why don’t\
    \ I catch the goose and keep it in a cage? Then I can get as many feathers as\
    \ possible.” Then Monica caught the goose. When she tried to put the goose into\
    \ the cage, it died. All its feathers became gray.\nLeo was a businessman, but\
    \ he was never happy about what he had. He prayed to the god all the time, “I\
    \ hope that I can become the richest man in the world.” One day, the god talked\
    \ to him, “All right. I can give you all the land that you pass by before the\
    \ sun sets tomorrow.” Leo was very happy and he began to run. He wanted to run\
    \ as fast as he could. He didn’t stop to take a rest or drink any water. Sadly,\
    \ he died because he was too tired and too thirsty.\n                        \
    \                         golden 黃金的 feather 羽毛 cage 籠子"
