  stem: "行政院 農業委員會（以下簡稱農委會）推動農產品初級加工政策，串聯初級加工至高值化產業，協助農民開創農業多元商機，促進農業升級成功。這個整合服務體系，是由農糧署、漁業署、林務局、水保局、輔導處、國際處、科技處、農委會所屬試驗機構、農科院及設有農學院之大學共同合作，提供農民從諮詢輔導、加值打樣、品牌包裝到產品行銷之完整服務。\n\
