- id: doc_112_基隆_中山_國文_g9s1e1_s2_34
  section: 2
  number: 34
  type: single
  page: 4
  stem: 依據本文六項謠言的正確觀念說明，下列何者解讀正確？
  options:
  - label: A
    content: 不論身處何地都應立即檢查家中水管、瓦斯管線、電線、房屋是否受損
  - label: B
    content: 不論如何立即採「趴下、掩護、穩住」確保自身安全的做法最為重要
  - label: C
    content: 地震時依身處地形特意往上或向下移動，以降低自身在地震中承受的風險
  - label: D
    content: 應選擇有水源水管之處，例如迅速往廁所或冰箱移動，以期受困時不至於有脫水危險。
  group_stem: "謠言一、地震發生時要先打開大門？\n  正確觀念：如果發生會讓家中大門變形的地震，這時為了要去開門，反而可能會因劇烈搖晃而讓自己容易受傷。因此，地震時立即採取「趴下、掩護、穩住」的動作，躲在桌下或是牆角，形成防護屏障，以免被掉落的物品砸傷，等地震搖晃停止後，再來檢查家中水管、瓦斯管線、電線、房屋是否受損。\n\
    \  謠言二、地震發生時關閉火源及瓦斯？\n  正確觀念：地震時，除非是恰好在爐火旁亨煮食物，可隨手關閉爐火。否則是不建議在地震當下，前往關閉火源和瓦斯。地震時，立即採「趴下、掩護、穩住」的動作，躲在桌下或是牆角，形成防護屏障，以免被掉落的物品砸傷，待地震過後，再行前往關閉爐火及瓦斯。\n\
    \  謠言三、地震發生時，注意頭頂上方有無掉落物可能，環顧所處空間牆壁、天花板、梁柱，檢查有無龜裂？\n  正確觀念：日本建築學會 阪神淡路大震災—住宅內部被害調查報告書指出，阪神\
    \ 淡路大地震受傷人數中，有 46％的人受到家具翻倒、掉落或移動而受傷。故地震當下，應立即採「趴下、掩護、穩住」的動作，躲在桌下或是牆角，形成防護屏障，以免被掉落物品砸傷。平時也應和家人一起檢查居家空間是否安全，家具是否妥適固定，等地震來時，才能有效減少受傷機會。\n\
    \  謠言四、地震發生時，千萬別往外跑（除非你身處一樓），如果你所處位置在透天住家，請往頂樓跑？\n  正確觀念：在地震發生搖晃時，無論在任何樓層，都不建議往外奔跑之避難行為，因為有可能因劇烈晃動而跌倒、或遭掉落物品擊中而受傷。地震發生當下即是要確保自身安全，立即採「趴下、掩護、穩住」的動作，躲在桌下或是牆角，形成防護屏障，以免被掉落的物品砸傷。\n\
    \  謠言五、地震時，因為廁所空間較小，四周有牆壁，可承受較大壓力，而且廁所有水源、水管，應迅速往廁所或冰箱移動？\n  正確觀念：地震發生時，執意衝往廁所，反容易滑倒、跌倒而受傷。另冰箱如未妥適固定，在地震搖晃時，反可能翻倒、掉落或移動，造成傷害。因此，建議於地震發生前，平時可觀察住家內的堅固處或穩固家具下方空間（非在玻璃底下），確認地震避難時，可躲避位置，若發生地震可立即採「趴下、掩護、穩住」確保自身安全，防止掉落物砸傷；若周遭無桌子，則可選取相對安全、上方無可掉落物之處所，採取保護自己的動作。\n\
    \  謠言六、地震時，切記「不要」往外跑，要往上移動？\n  正確觀念：地震時切勿胡亂奔跑，也不須特意往上或向下移動，增加自身在移動過程中的風險。應立即採「趴下、掩護、穩住」的動作，躲在桌下或是牆角，形成防護屏障，以免被掉落的物品砸傷，待地震搖晃結束後，再行評估建築物是否安全，並判斷是否須避難到空曠處或避難收容所。\n\
    \  謠言七、開車遇到地震，要趕快離開車子，躲在 2 車之間？\n  正確觀念：行駛中的車輛，如察覺到車輛異常晃動或觀察到四周建築物、號誌或燈桿等有搖晃情形時，此時的作法應是緩慢地靠邊停車，拉上手剎車，按下警示燈，盡可能停於在空曠處，避開高架道路、橋梁、電線桿、交通號誌等設施。同時，留在車內，等到地震搖晃停止。\n\
    （消防防災館 地震時，先打開大門？關閉火源及瓦斯？這些是正確的嗎？）"
