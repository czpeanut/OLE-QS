    content: 雲一緺，玉一梭。淡淡衫兒薄薄羅，輕顰雙黛螺。  秋風多，雨如和。簾外芭蕉三兩窠，夜長人奈何
  - label: B
    content: 林花謝了春紅，太匆匆，無奈朝來寒雨晚來風。  胭脂淚，相留醉，幾時重？自是人生長恨水長東
  - label: C
    content: 無言獨上西樓，月如鉤。寂寞梧桐深院鎖清秋。  翦不斷，理還亂，是離愁。別是一般滋味在心頭
  - label: D
    content: 簾外雨潺潺，春意闌珊。羅衾不耐五更寒。夢裡不知身是客，一晌貪歡。  獨自莫憑欄，無限江山，別時容易見時難。流水落花春去也，天上人間。
