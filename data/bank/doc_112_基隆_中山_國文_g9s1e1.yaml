- id: doc_112_基隆_中山_國文_g9s1e1_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 「如何處理傷痛？原來不是要忘記，而是陪伴與聆聽。陪伴就是讓當事人切身感受到『我在這裡』，願意在當下花時間聆聽他／她的故事，也願意一同面對當中的感受。聆聽需要先拋開對錯好壞的分析評論，放下對事實真偽的執著，更要按捺一切地提點建議。只要將心思全盤專注於當事人的經歷當中，看見對方所看見的，感受對方所感受的，共同感受當中的甜酸苦辣，這就是最實在的陪伴與聆聽。」（陳文鏢
    突破輔導中心）關於這段話的理解，何者正確？
  options:
  - label: A
    content: 聆聽與陪伴之外，更要提出具體的建議
  - label: B
    content: 拋開評判對錯與是非，只聽感受與心聲
  - label: C
    content: 想辦法讓傷痛者遺忘傷痛才是首要之務
  - label: D
    content: 聆聽之前先做好分析才能提供適當解方。
