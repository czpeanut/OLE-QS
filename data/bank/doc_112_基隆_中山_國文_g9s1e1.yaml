    content: 從小我就常打斥膊，和家人在田裡耕種，擁有強壯的身驅
  - label: D
    content: 我深知要用汗債才能換取飽穗的道理；若有機會進入貴公司服務，必定腳踏實地，全力以赴，不負所託。
