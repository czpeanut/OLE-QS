  stem: 關於本詩第三段的說明，下列何者正確？
  options:
  - label: A
    content: 寫出作者願意為子女辛勤工作，努力付出的心情
  - label: B
    content: 強調作者每天忙得暈頭轉向，生活已失去方向感
  - label: C
    content: 流露出作者的豪情壯志逐漸被現實生活消磨殆盡
  - label: D
    content: 表達作者甘願當孩子的玩伴，陪孩子一起玩陀螺。
  group_stem: "下班之後，便是黃昏了\n  偶爾也望一望絢麗的晚霞\n  卻不再逗留\n  因為你們仰向阿爸的小臉\n  透露更多的期待\n\n  加班之後，便是深夜了\n\
    \  偶爾也望一望燦爛的星空\n  卻不再沉\n  因為你們熟睡時的小臉\n  比星空更迷人\n\n  阿爸每日每日的上下班\n  有如自你們手中使勁拋出的陀螺\n\
    \  繞著你們轉呀轉\n  將阿爸激越的豪情\n  逐一轉為綿長而細密的柔情\n\n  就像阿公和阿媽\n  為阿爸織就了一生\n  綿長而細密的呵護\n\
    \  孩子呀！阿爸也沒有任何怨言\n  只因這是生命中\n  最沉重\n  也是最甜蜜的負荷\n（吳晟 負荷）"
