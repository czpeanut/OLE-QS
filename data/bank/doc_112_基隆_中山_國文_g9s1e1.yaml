- id: doc_112_基隆_中山_國文_g9s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 1
  stem: "由於地球內有一種推動岩層的應力，當應力大於岩層所能承受的強度時，岩層會發生錯動，而這種錯動會突然釋放巨大的能量，並產生地震波，當它到達地表時，引起大地的震盪，這就是地震。\n\
    地震可分為自然地震與人工地震（例如：核爆）。一般所稱之地震為自然地震，依其發生之原因又可分為：(一)構造性地震、(二)火山性地震、(三)衝擊性地震。\n \
    \ 臺灣因歐亞大陸板塊與菲律賓海板塊碰撞擠壓所形成，交界處在花東縱谷，以西是歐亞大陸板塊，以東是菲律賓海板塊，由於兩板塊仍不時碰撞，因此臺灣多地震。\n（節錄自中央氣象局\
    \ 數位科普網 天搖地動！為什麼臺灣這麼多地震）\n依據上文所述，關於這張圖表中的(１)與(２)板塊，何者說明正確？"
  options:
  - label: A
    content: (１)與(２)皆為歐亞大陸板塊
  - label: B
    content: (１)與(２)皆為菲律賓海板塊
  - label: C
    content: (１)是指歐亞大陸板塊
  - label: D
    content: (２)是指歐亞大陸板塊。
