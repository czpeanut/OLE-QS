    content: 即將出國留學的洛詩安慰男友：「『別時容易見時難』，又何必在乎一時的分離？何況我們隨時可以透過視訊連繫，你不必太擔心。」
  - label: B
    content: S 君向出版社自荐小說卻遭退稿，推究原因，是他閱歷不夠、體悟不深，寫作常常「吹皺一池春水」，以致作品無法獲得主編青睞。
  - label: C
    content: 這次你們舉家移民巴西，「一江春水向東流」，不知我們何時才能再相聚啊！
  - label: D
    content: 阮清秋孤身在異鄉工作，下班時望見天邊懸著一輪明月，憶起故鄉親友，此刻「千里共蟬娟」，心中默想；但願家人一切安好。
