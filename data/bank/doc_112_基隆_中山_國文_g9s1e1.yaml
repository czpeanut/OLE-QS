- id: doc_112_基隆_中山_國文_g9s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 吳晟自述鄉土詩創作理念：「我的創作動力乃是來自生活的感動，大多依賴自我充電、自我鞭策，而無關乎有沒有掌聲。最該關心的是如何力求作品本身的完美。」又說：「我寫的詩，莫不是植根於踏實的生活土壤中，歷經長時期的體會醞釀，才緩慢發芽、成形，而以鮮活熱烈的血液記錄下來。」關於上面這些敘述，下列何者說明正確？
  options:
  - label: A
    content: 完美的作品是吳晟創作的動機
  - label: B
    content: 得獎讓吳晟更有動力繼續創作
  - label: C
    content: 吳晟作品多，靈感來一揮即就
  - label: D
    content: 詩中可看出吳晟濃厚鄉土情懷。
