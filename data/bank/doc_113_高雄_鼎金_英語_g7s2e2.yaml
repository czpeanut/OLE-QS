  group_stem: 'Japanese Use AI to Learn Languages

    Many people in Japan want to learn new languages. Some people learn English, and
    some learn Chinese or Korean. Now, they use AI tools to help them. AI can listen,
    speak, and check grammar. It helps people practice every day.

    Many students use AI apps on their phones. Some workers use AI on computers or
    ipads. AI can also be a teacher. It can ask questions and give answers. People
    like AI because it is fast and easy to use.

