- id: doc_113_高雄_鼎金_英語_g7s2e2_s3_29
  section: 3
  number: 29
  type: single
  page: 4
  stem: Kelly is watching this video on YouTube. What can she learn from it?
  options:
  - label: A
    content: An easy way to make ice cream.
  - label: B
    content: Some facts about ice cream.
  - label: C
    content: Steps to make strawberry yogurt.
  - label: D
    content: Ice cream from around the world.
  group_stem: '(Andy is a YouTuber, and he is making a video.)

    Welcome to Yummy in Minutes.

    I’m Andy. Today, we are going to make something fun and easy—Shake-It Ice Cream!

    Here’s what you need:

    • 2 cups of yogurt • Ice cubes (a lot!)

    • 2 tablespoons of sugar • 500 grams of strawberries

    • 1 cup of salt • A small bag and a big bag

    Let’s start!

    1. Put the yogurt, sugar, and strawberries in the small bag. Seal it.

    2. Put ice cubes in the big bag. Add the salt on top.

    3. Put the small bag inside the big bag. Seal the big bag.

    Now, shake the bags! Just keep shaking for 5 minutes. The small bag will get cold.
    You can see what’s happening here, guys, right? When you’re done, open the big
    bag. Dry the small bag, so no saltwater gets in it. Then open the small bag—your
    ice cream is ready!

    This is great for kids or parties. Alright, go make some ice cream, and I will
    see you next time on Yummy in Minutes!

    * tablespoon 一大匙的量

     shake 搖晃 yogurt 優格 ice cube 冰塊 seal 密封 top 頂部 will 將會 done 完成的 dry（使）變乾'
