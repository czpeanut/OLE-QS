  group_stem: 智利中南部的瓦爾迪維亞省(Valdivia)位於首都聖地牙哥南方，在1960 年5 月22 日發生目前全球記載上最大地震，規模高逹9.5，震度逹到毀滅性的12
    級。本次地震之後，除了智利到秘魯的沿海發生高達25 公尺的海嘯，甚至波及到遠方的夏威夷、澳洲、阿拉斯加、日本、菲律賓和臺灣，基隆也因為海嘯造成兩座橋的毀損。一個月內還有兩百多的餘震，其中有三次規模還高達七級以上。一個毀滅性的地震，罹難人數估計至少5000
    人以上，但這數字已經是比外界估計少許多，有以下兩個原因。第一，智利和鄰近的其他國家一樣人口分布不均，都市化程度高逹88％，並集中在少數城市之中，所以除了首都人口有超過600
    萬，占該國40％的人口；其他城鎮總人口數並不高，該次主震的瓦爾迪維亞省，總人口大約十萬人左右。第二，仍然有大多數居民可以幸存生還，都要歸功平日地震頻繁的逃生訓練有素，且建築大都有一定的抗震能力；現在的智利更是要求新的建築都要具備9
    級以上的抗震能力，對近年的大地震起了很大的保護作用。
