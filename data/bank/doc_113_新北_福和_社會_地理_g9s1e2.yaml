  stem: 中美地峽是連接南、北美洲的狹長地塊，哥倫比亞與有建造運河成功的法國曾在當中最窄處，企圖建造大西洋與太平洋的海上捷徑。但是因為地形、氣候條件與法國原前興建的運河完全不同，終告失敗，改由美國接手建造。美國為此運河特意扶持該地居民從哥倫比亞獨立出來，獲得運河經營權，到1999
