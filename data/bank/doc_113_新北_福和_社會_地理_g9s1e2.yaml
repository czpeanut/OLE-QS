  section: 1
  number: 9
  type: single
  page: 1
  stem: 『美國夢』一詞最早源於美國作家詹姆斯亞當斯在1931 年的歷史著作《美國史讀》裡，美國夢就是對這樣一個國度的憧憬，在那裡每個人都可以生活得更好、更富足、更充實，每個人都有依照自己的能力實現目標的機會。但是在多元民族匯聚的美國，種族歧視卻仍充斥在當代的社會中。下列各項美國近年發生的重大議題，何者與美國的種族問題最不相關？
  options:
  - label: A
    content: 西元2008 年11 月4 日，歐巴馬當選總統，為美國史上第一位非裔總統，媒體視其為美國人權發展史上重要的里程碑
  - label: B
    content: 西元2013 年6 月26 日，美國聯邦最高法院宣告憲法要求各州必須承認同性婚姻，結婚是兩人間親密結合的基本自由
  - label: C
    content: 自新冠肺炎(Covid-19)疫情爆發以來，美國發生近四千起亞裔歧視事件，可見美國對於「有色種族」仍有諸多歧異
  - label: D
    content: 美國總統川普上任後就把白宮網站的西班牙語網頁給撤下，在公眾場合中對西班牙語的人言語暴力與騷擾急遽增加。
