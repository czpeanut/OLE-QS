  group_stem: '(三)Night markets are exciting to visit when you take a trip to Curlew.
    You can enjoy lots of delicious food and buy something interesting and cheap.
    Check out the four wonderful night markets by Best Travling.com.

    1.King Night Market: King is very close to Main Metro Station, and it is the most
    popular and famous night market in Curlew. Thousands of visitors from other countries
    visit it every year. You should try the big fried chicken.

    2. Rainfall Night Market: Since Rainfall is an important fishing port in the south
    of Curlew, you can get a lot of delicious seafood here. Fish soup and fried shrimp
    are also good. Be sure that you try the fish ball noodles.

    3.Oldtown Night Market: As the capital city of Curlew, Oldtown has the biggest
    night market in the country. You can find almost everything you like in the 2-square-kilometer
    market. Surrounded by three high schools, the night market is a good place for
    students to have dinner.

    4. Catstone Night Market: The history of the north city goes back 700 years, the
    same time as its night market. However, Catstone Night Market is not as “old”
    as you might think. You can find the latest cellphones and accessories here. By
    the way, don’t be surprised to see a newly opened theater in the night market.
    Buy a ticket and enjoy a movie.

