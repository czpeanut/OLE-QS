    \ small shoe box of Mrs. King. She put it on the top of the closet and told her\
    \ husband never to open or ask about it. Many years went by, Mr. King already\
    \ forgot about the box.\n    One day, Mrs. King got sick, and the doctor said\
    \ she might not get well. She told her husband to take it from the top of the\
    \ closet. She knew that it was the time to let him know what was in the box. When\
    \ he opened it, he saw two dolls and a bag of money totally $92,880. He was surprised.\
    \ “Before we got married, my grandmother told me the secret of a happy marriage\
    \ was to never fight. She told me that if I was angry with you, I should just\
    \ keep quiet and crochet a doll.” she said. Mr. King was so moved. Only TWO crochet\
    \ dolls are in the box! She was angry with me only TWO times in so many years\
    \ of living and loving. He almost cried with happiness but still didn’t understand\
    \ one thing. “Honey, now I know about the dolls, but what about all this money?\
    \ Where did the money come from?” “Well,” she smiled, “that’s the money from selling\
    \ the dolls.”\nmarried 結婚 except 除了 totally 總共 secret 秘密 marriage 婚姻 if 如果 crochet\
    \ 編織 moved 感動 order 順序 dying 死"
