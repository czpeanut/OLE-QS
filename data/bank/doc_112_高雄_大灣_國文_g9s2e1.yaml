- id: doc_112_高雄_大灣_國文_g9s2e1_s2_40
  section: 2
  number: 40
  type: single
  page: 5
  stem: '根據甲、乙二篇文章，能否支持下列①、② 兩項推論？試分析之。

    ①：齊桓公頗器重鮑叔牙，故聽其言重用管仲，之後也想選鮑叔牙繼管仲為相。

    ②：鮑叔牙和管仲過去關係很好，但是在成為官員後，他們逐漸疏遠了。


    | | ①的推論能否成立？ | ②的推論能否成立？ |

    | :--- | :--- | :--- |

    | (A) | 不支持 | 支持 |

    | (B) | 不支持 | 不支持 |

    | (C) | 支持 | 支持 |

    | (D) | 支持 | 不支持 |'
  options:
  - label: A
    content: ①不支持；②支持
  - label: B
    content: ①不支持；②不支持
  - label: C
    content: ①支持；②支持
  - label: D
    content: ①支持；②不支持
  group_stem: '【甲】管仲 夷吾者，潁上人也。少時常與鮑叔牙游，鮑叔知其賢。管仲貧困，常欺鮑叔，鮑叔終善遇之，不以為言。已而鮑叔事齊公子小白，管仲事公子糾。及小白立為桓公，公子糾死，管仲囚焉。鮑叔遂進管仲。（《史記‧管晏列傳》）


    【乙】管仲有病，桓公問之，曰：「仲父之病病矣，可不諱云，至於大病，則寡人惡乎屬國而可？」管仲曰：「公誰欲與？」公曰：「鮑叔牙。」曰：「不可。其為人絜廉善士也，其於不己若者不比(1)之，又一聞人之過，終身不忘。使之治國，上且鉤(2)乎君，下且逆乎民。其得罪於君也，將弗久矣。」
    ——《莊子‧徐無鬼》

    (1)比：親近。 (2)鉤：約束。'
