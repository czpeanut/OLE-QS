- id: doc_112_高雄_大灣_國文_g9s2e1_s2_34
  section: 2
  number: 34
  type: single
  page: 4
  stem: 若使用不當，何種顏色的帽子可能會使討論失去焦點？
  options:
  - label: A
    content: 白帽
  - label: B
    content: 紅帽
  - label: C
    content: 黃帽
  - label: D
    content: 綠帽
  group_stem: '六頂思考帽是由英國心理學家 Edward de Bono(1992 年)所提出的一種水平思考模式。簡單說，就是設定六種不同思考方式的帽子，以顏色來區分思考方式。在思考、討論事情時，我們必須假設自己正戴上某種顏色的帽子，只能扮演那頂帽子所代表的角色。

    白色代表客觀、中立。戴上白帽，我們只能說出客觀的事實、數據，在搜尋資料以汲取資訊時，必須戴上白帽。

    紅色代表情緒、直覺。允許情緒性的渲洩、批評或無法以邏輯解釋的直覺。紅帽的目的是為了讓隱藏在每個人觀看事物背後的情緒及價值觀有合理表達的機會，避免情緒因缺乏合理出口，在討論的過程中出來攪局。

    黑帽代表負面、否定。但並非情緒性，而是針對事實，提出理性的批判質疑及評估風險。

    黃帽代表樂觀、願景。以正面角度看待、評估事物，找出可行性及機會，即使是投機的想法，只要有可行性，都可以提出，但樂觀、願景背後必須有一定的邏輯，若成功的機率不大，必須註明是樂觀建議，否則會掉入黃帽盲目樂觀的情緒陷阱。

    綠帽是創意思考。我們跳脫慣常思考方式，試圖找出新的替代方案，試著思考若不按照目前的模式，是否還有其他的可能性。但特別注意，綠帽提出的方案強調轉移、創意，黃帽則是找尋方案的建設性和可行性。

    藍帽代表控制、冷靜、統整。討論開始時用藍帽來制定步驟、界定問題、指派思考任務；討論過程中，藍帽負責監督思考是否集中在焦點；結束時用藍帽來統整前面的看法。'
  tags:
