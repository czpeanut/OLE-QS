  stem: 根據上述文章說法，下列敘述何者最恰當？
  options:
  - label: A
    content: 111 年臺東縣的平均壽命比新竹市的平均壽命少於5 歲
  - label: B
    content: 111 年桃園市男女平均壽命高於新北市男女平均壽命
  - label: C
    content: 高雄市男女平均壽命比花蓮市男女平均壽命多2.26 歲
  - label: D
    content: 臺東、花蓮兩縣在101 年的平均壽命差距不到2 歲
  group_stem: 根據「近10 年國人平均壽命趨勢表」，台灣國人的平均壽命為79.84 歲。男性的平均壽命為76.63 歲，女性則為83.28 歲。如果我們從直轄市的角度來看，111
    年的國人平均壽命呈現自北向南逐漸遞減的趨勢。臺北市的平均壽命最高，達到83.75 歲，其餘依序為新北市、桃園市、臺中市、臺南市和高雄市。男性和女性的平均壽命也都以臺北市為最高。而在各縣市的平均壽命方面，111
    年的最高平均壽命出現在新竹市，達到81.72 歲，而臺東縣的平均壽命最低，僅有76.46 歲。內政部補充說，東部縣市的平均壽命較西部縣市低，臺東縣、花蓮縣和全體國民的平均壽命之間的差距分別為3.38
    歲和2.26 歲，但已分別較101 年縮小了1.72 歲和1.14 歲。
