  number: 35
  type: single
  page: 3
  stem: 35. What is the effect of buying things without planning?
  options:
  - label: A
    content: People give the things they buy lots of good reviews.
  - label: B
    content: People spend a lot of money on things they never use.
  - label: C
    content: People work harder to make more money.
  - label: D
    content: People ask themselves questions while shopping.
  group_stem: "(一) You are doing some shopping online and suddenly a message appears\
    \ next to the picture of a coffee machine, \"Only 1 left!\" it says, Wow, you\
    \ think, \"It must be good if it is so popular. \" Should you buy it? You don't\
    \ really drink much coffee.... While you are thinking, another message pops up,\
    \ \"Twenty other people are currently looking at this item,\" You'd better buy\
    \ it fast before someone else does! Quickly, you click the \"Buy Now!\" button.\n\
    Buying something without planning is called \"impulse buying,\" It is a real problem\
    \ for a lot of shoppers. People spend a lot of money on things they never use.\
    \ Shopping websites use many tricks to encourage impulse buying. These include\
    \ sales, bestseller tags, star ratings and reviews, and timers.\n To stop yourself\
    \ from being pushed into impulse buying, ask yourself a few questions before you\
    \ click \"Buy.\" Do I really need this item? What would I use it for? What else\
    \ could I buy for this amount of money? Remember, online stores want your money,\
    \ and they will try anything to get you to spend it!\npop up 跳出 click 按一下（滑鼠）\
    \ encourage 鼓勵"
  tags:
    textbook: 第六冊（九下）第1次段考範圍
    labeled_by: ai
  ai_answers:
    gemini: B
    qwen: B
  answer:
  - B
  answer_status: ai_generated
