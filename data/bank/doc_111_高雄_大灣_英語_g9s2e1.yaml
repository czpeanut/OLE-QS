    Jimmy : No, Sir. I always follow the traffic rules.

    Alice : Oh, Jimmy. You were going 130 km per hour.

    (Jimmy gave Alice a dirty look.)

    Officer : Got you! And I''m going to give you a ticket for your broken left-side
    mirror.

    Jimmy : Broken left-side mirror? It still worked well when I drove to work this
    morning.

    Alice : Come on, Jimmy. It has been out of work for weeks.

    (Jimmy gave Alice another dirty look angrily.)

    Officer : I noticed that you didn’t wear your seat belt.

    Jimmy : That''s not true! I just took it off 30 you stopped me and walked up to
