- id: doc_111_高雄_大灣_英語_g9s2e1_s5_41
  section: 5
  number: 41
  type: single
  page: 5
  stem: 41. In the English class, Mr. Lin asks his students to make a sentence in
    the blank(X). Which sentence can be put in it?
  options:
  - label: A
    content: It's the break time. Let's buy some drinks.
  - label: B
    content: We could see the moon through a break in the clouds.
  - label: C
    content: Annie was not careful. She just broke the vase.
  - label: D
    content: Give her a break. She’s only a child.
  group_stem: "(三)\nDo you know what the word \"polysemy\" means? When we learn English\
    \ words, it happens at all times. A word can have several meanings, so the same\
    \ word with different meanings can make sentences have different ones. Here are\
    \ a few examples. Having a better understanding of those words can help you read\
    \ English articles easily and clearly.\n＊bear 1. (n.) There are many cute polar\
    \ bears in the cage.\n 2. (v.) I can't bear the hot weather. I want to go swimming.\n\
    \ 3. (v.) My aunt is old. She can't bear children shouting or running around.\n\
    \n＊free 1. (adj.) I want to be as free as a bird.\n2. (adj.) Marie reads comic\
    \ books in her free time.\n3. (adj.) Buy one, get one free.\n\n＊ break 1. (n.)\
    \ They practiced soccer so hard. They need a break.\n 2. (v.) Don't break the\
    \ rule. Mom will be very angry.\n 3. (v.) ( X )\n\n＊last 1. (adv.) When did you\
    \ last meet your elementary school classmate?\n 2. (Y) Abby is the last person\
    \ to get the news.\n 3.(v.) The concert will last for about two hours tomorrow.\n\
    article 文章 (n.)名詞 (v.)動詞 (adj.)形容詞"
