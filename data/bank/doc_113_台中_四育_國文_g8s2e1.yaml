  stem: 寫作論說文時，引事例為證，可以使說理更為具體有力。下列文句何者未引用事例？
  options:
  - label: A
    content: 健康的體力，是一生努力成功的基礎，大家體力不發展，民族的生命力也就衰落下去
  - label: B
    content: 梵谷執著的繪畫夢想，雖然很遺憾在他生前，他的作品沒有受到世人的欣賞，但在那種世人漠視、窮困潦倒的環境下，仍堅持著自己的夢想
  - label: C
    content: 蘇軾遭貶黃州，生活困頓，卻成就他文學創作的輝煌期。艱困的環境造就心靈的強度與生命的韌度
  - label: D
    content: 貝多芬雙耳失聰，卻不妨礙他創做出震撼人心的作品。挫折從來不是來自挫折本身，而是來自「輸給挫折」的心靈。
