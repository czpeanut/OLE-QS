  stem: 「楚有養由基者，善射，去柳葉者百步而射之，百發百中。左右皆曰善。有一人過曰：『善射，可教射也矣』。養由基曰：『人皆善，子乃曰可教射，子何不代我射之也？』客曰：『我不能教子支左屈右。夫射柳葉者，百發百中，而不已善息，少焉，氣力倦，一發不中，前功盡矣。」（戰國策）依據本文，此人對養由基的諫言為何？
  options:
  - label: A
    content: 力求技能進步再進步
  - label: B
    content: 不怨天，不尤人
  - label: C
    content: 貫徹始終
  - label: D
    content: 保留體力。
