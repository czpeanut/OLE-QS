  group_stem: 'It’s Sunday morning. Cody and Yuki are at Kids Fun Park. It’s big and
    beautiful. They’re having a good time.

    Kids Fun Park is a great place. Inside the park, you can see a lake, a bird park
    and two long slides. Near the lake,

    many people are walking their dogs. In front of the lake is the bird park. Many
    different birds are in the park. In

    Area One, you can see parrots. They are beautiful and colorful birds, and they
    can talk like people. In Area Two,

    you can see Sacred Ibis. They have a long black mouth and thin black legs. In
    Area Three, you can see Toco

    Toucans. They are from South America and they have a very big mouth. In Area Four
    are ostriches. They are

    very big birds. They can’t fly, but they can run fast. They are from Africa. After
    watching the birds, you can play

    on the two long slides. Little boys and girls can have a good time there!


    In the park, let’s follow the dos and don’ts.

    1. Please don’t talk too loudly.

    2. Do not run after the birds.

    3. Do not feed the birds. They can’t eat your food.

    4. Be careful with the long slides. Do not stand on them.

    You can see trees and watch many birds in the park. You can take pictures with
    them, too. You can be in the

    nature and have fun. It is a park for all people.

