- id: doc_113_高雄_七賢_社會_g9s2e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 桃園市大園區良質米產銷班第1 班於民國91 年成立，班長陳燕卿曾獲「神農獎」、「十大經典好米」等獎項，其帶領班員打破傳統經營自身田地的模式，依照個人專長專業分組，每組均設專人統合該組任務，將各自農場共同經營成為一個大農場模式。大園區良質米產銷班第1
    班在臺灣加入WTO開放國外稻米輸入臺灣後，仍站穩臺灣米市場。近年甚至外銷國外，在紐西蘭更廣受好評，也進軍對米最講究的國家—日本。文中的大園區各農場組成產銷班後具有下列哪些優點？
    (甲)擴大規模 (乙)提高生產效率 (丙)降低食物里程 (丁)降低作物病蟲害
