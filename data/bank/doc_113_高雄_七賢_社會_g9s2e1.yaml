  section: 1
  number: 1
  type: single
  page: 1
  stem: 臺灣早期有荷蘭人及西班牙人占領，近代又曾遭日人統治，故地名有很多是緣起於政權更替而產生之外語稱呼或譯音。若以列強統治時代區分，下列名稱出現之排序，何者正確？
    (甲)玉井(臺南市) (乙)三貂角(新北市) (丙)左營(高雄市)
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙丙甲
  - label: C
    content: 丙乙甲
  - label: D
    content: 丙甲乙。
