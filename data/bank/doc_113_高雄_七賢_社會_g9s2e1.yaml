- id: doc_113_高雄_七賢_社會_g9s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 「打狗」是馬卡道族的族語音譯，日治時期因為音近京都附近的高雄山，後改名為「高雄」。請問：下列哪一個地名與高雄的例子一樣，舊稱「鹹菜甕」，可能因「鹹菜」與日語諧音相近，而改為今日的名稱？
  options:
  - label: A
    content: 宜蘭縣冬山鄉
  - label: B
    content: 桃園市大溪區
  - label: C
    content: 新竹縣關西鎮
  - label: D
    content: 南投縣信義鄉。
