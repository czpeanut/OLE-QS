- id: doc_113_高雄_七賢_社會_g9s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 地名可反映該地歷史發展的脈絡，下列關於地名和歷史發展的敘述，何者錯誤？
  options:
  - label: A
    content: 桃園市「復興」區，「復興」是中華民國政府遷臺後，想展示民族復興的決心故命名
  - label: B
    content: 臺南市「龍崎」區，是取「龍船」、「崎頂」兩個主要聚落的首字而命名
  - label: C
    content: 高雄市「左營」區，與鄭氏拓墾有關
  - label: D
    content: 高雄市「鹽埕區」，「鹽埕」源自於日本人開墾的移民村名稱。
