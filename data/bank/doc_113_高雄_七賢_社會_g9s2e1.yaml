  number: 7
  type: single
  page: 1
  stem: 「地方創生」的概念源自日本，目的是希望發展出最適合的在地經濟，讓人們不一定非得要在都市工作，而能夠選擇其他鄉鎮或回到自己的故鄉，以改善高齡化、少子化、城鄉發展不均等問題。因此，要使地方創生政策成功，首要步驟應是下列何者？
  options:
  - label: A
    content: 招商引進工業
  - label: B
    content: 舉辦觀光活動
  - label: C
    content: 調查地方特色產業
  - label: D
