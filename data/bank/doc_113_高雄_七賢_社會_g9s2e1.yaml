  number: 10
  type: single
  page: 1
  stem: 食物生產後由產地運送到消費者手中的產銷流程，依其所涵蓋的空間大小，大致可分成「地方性生產與銷售」及「全國性生產與銷售」兩類。關於兩者特徵的比較，下列何者正確？
  options:
  - label: A
    content: 以產銷範圍而言，「全國性生產與銷售」較大
  - label: B
    content: 以食物里程而言，「地方性生產與銷售」較長
  - label: C
    content: 以運輸工具的依賴程度而言，「全國性生產與銷售」較低
  - label: D
    content: 以銷售方式而言，「地方性生產與銷售」與消費者的直接接觸較少。
