- id: doc_113_高雄_七賢_社會_g9s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 「埔、壢、湖、崙、崎、崁」等都是與地形有關的臺灣地名元素，下列何組有關地名元素與指涉意義之間的配對最為正確？
  options:
  - label: A
    content: 崙：平坦、開發程度較低之地
  - label: B
    content: 崁：位於山間的小盆地
  - label: C
    content: 埔：河邊、海岸邊的沙丘或小山丘
  - label: D
    content: 崎：斜坡面，多指崎嶇不平之地。
