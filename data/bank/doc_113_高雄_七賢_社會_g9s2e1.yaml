  group_stem: "【請根據本文回答第45～47 題】 小心最重被罰 75 萬！店家「公然播音樂」遭法辦\n    有音樂公司的員工到南投一間小吃店用餐，卻在用餐期間聽到自家版權的越南流行音樂被「公開播放」，他便暗自蒐證、報警。原來，經營這間越南小吃店的老闆娘平常習慣在影音平台\
    \ YouTube 尋找歌曲，並透過手機藍芽連至店裡的電視等設備，供顧客觀賞。經音樂公司員工檢舉，小吃店老闆娘遭警方以「公開傳輸方法侵害他人◆◆◆權」罪嫌送辦。不過她也喊冤，表示不曉得自身作法會侵犯◆◆◆權，她遭檢舉時間是在\
    \ 2020 年 6 月，所幸，她後續積極與音樂公司調解、談妥賠償，音樂公司已決定對小吃店老闆娘撤銷告訴。\n    因該起案件裡的◆◆◆權的侵害屬於「□□□罪」，也就是發生侵害時，◆◆◆權人有權自決是否要對侵權的人進行刑事告訴，如今，法官判決「公訴不受理」。\n\
