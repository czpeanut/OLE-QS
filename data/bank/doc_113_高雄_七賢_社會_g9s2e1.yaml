- id: doc_113_高雄_七賢_社會_g9s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 臺南市佳里區有一「頂廍」里，地名「廍」乃源自於「某產業」發展而命名，該產業也是當地主要經濟來源。隨著產業的沒落，頂廍里人口日漸外流，近年在里民努力下，結合該傳統產業，成功推動許多遊客體驗活動，藉以活化當地經濟，並傳承地方文化。請問：下列何者最可能是頂廍里舉辦的當地產業體驗活動？
  options:
  - label: A
    content: 採收茶葉
  - label: B
    content: 下田插秧
  - label: C
    content: 翻炒黑糖
  - label: D
    content: 手做地瓜球。
