  group_stem: "經濟發展與文化保存的平衡 —— 從六輕進駐宜蘭到蘇花改工程\n  1986 年到 1991 年，由宜蘭人自發性發動的「反六輕環保運動」。由縣長陳定南、游錫堃帶頭，加強人民對於「輕油裂解廠」、相關重化工業所造成環境污染的認識，與業者以及中央政府公權力進行抗爭。縣政府以宜蘭的環境保存、永續使用等議題，堅決不歡迎六輕來宜蘭。最終遷至雲林麥寮的離島工業區。\n\
    \  另外一件重要的宜蘭大工程——蘇花公路改善工程計畫（簡稱蘇花改）；從 2010 年開始評估、動工，終於在 2020 年元月完工，這項工程將是臺灣唯一一條橫跨多隧道的省道公路。由於地質破碎，加上氣候劇變，現有的蘇花公路常因天氣災害時而坍方，時而封路，故有此計畫的出現。在施工的過程，工程部門在兼顧道路開發與自然生態保護之原則下，透過「老樹搬家」、「生態工法」進行許多友善策略，以最大的開發、最少的破壞進行施工，並進行施工監測，只要噪音、揚塵、汙水、碳足跡逾等項目超標，即刻停工，可以說將對自然界的傷害降到最低。值得一提的是，在開挖基地、隧道期間，也發現了漢本遺址及武塔遺址，為距今約\
    \ 1200～1500 年前的金屬器時代遺址。在交通部與中研院考古專家討論協商、民間團體上街抗議後，政府邁向「現存地保留」的作法，文物被取出，遺址重埋土中，並列為國定遺址。"
