  group_stem: '（一）〈一枝花‧不伏老〉關漢卿

    我是個蒸不爛、煮不熟、捶不扁、炒不爆、響噹噹一粒銅豌豆，恁子弟每誰教你鑽入他鋤不斷、斫不下、解不開、頓不脫、慢騰騰千層錦套頭？我玩的是梁園月，飲的是東京酒，賞的是洛陽花，攀的是章臺柳。我也會圍棋、會蹴踘、會打圍、會插科、會歌舞、會吹彈、會咽作、會吟詩、會雙陸。你便是落了我牙、歪了我嘴、瘸了我腿、折了我手，天賜與我這幾般兒歹症候，尚兀自不肯休！則除是閻王親自喚，神鬼自來勾。三魂歸地府，七魄喪冥幽。天哪！那其間才不向煙花路兒上走！


    斫：ㄓㄨㄛˊ，砍；梁園：借指名勝遊玩之地；東京：借指都城；洛陽花：牡丹花；章臺柳：借指妓女；雙陸：一種賭博遊戲；歹症候：壞脾氣'
  lesson_raw:
    title: 一枝花‧不伏老
    basis: 題組出自關漢卿〈一枝花‧不伏老〉
