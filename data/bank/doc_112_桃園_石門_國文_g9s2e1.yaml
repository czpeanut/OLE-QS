  stem: 「18 世紀的法國貴族以極端奢靡的生活方式而聞名，貴族的生活方式以宮廷為中心，他們在華麗的宮殿中度過大部分時間。宴會、舞會是日常生活的一部分，宴會場合通常佈置華麗，並提供豐盛的美食和美酒。這些活動不僅是社交，也是展現貴族地位和富裕的場合。然而，這種奢靡的生活也在某種程度上加速了法國貴族階層的衰落，成為法國大革命爆發的導火線之一」根據上文，下列說明何者正確？
