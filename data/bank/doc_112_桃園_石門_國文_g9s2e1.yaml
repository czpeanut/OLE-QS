- id: doc_112_桃園_石門_國文_g9s2e1_s5_7
  section: 5
  number: 7
  type: single
  page: 1
  stem: 在〈人間情分〉的第二則故事中，作者選擇在夏日到澎湖旅遊，下列何者的季節與之相同？
  options:
  - label: A
    content: 薰風襲來，庭院裡的荷花開了，樹上的蟬叫了
  - label: B
    content: 進入奧萬大，幾株楓樹已經偷偷紅了容顏
  - label: C
    content: 朔風吹起，聖誕節的彩燈已經閃爍在街頭，叮叮噹的音樂也處處可聞
  - label: D
    content: 小巷中，桂花的香味從不知名的地方溜出來，轉角幾朵橙黃的菊燦爛笑著，我就像是走入祕密的花園裡
  lesson_raw:
    title: 人間情分
    basis: 題目引用課文〈人間情分〉
- id: doc_112_桃園_石門_國文_g9s2e1_s5_8
  section: 5
  number: 8
  type: single
  page: 1
  stem: 「焦躁的感覺，全消散在一位陌生人善意的溫柔中。並且發現，即使行走在雨裡，也可以是一種自在心情。」為何張曼娟會有這樣的感受？
  options:
  - label: A
    content: 下起雨來，天氣較為涼爽，心情因此暢快
  - label: B
    content: 在雨中行走別有一番情趣，何必在意一時不快
  - label: C
    content: 受到陌生人的善意關懷，焦躁感覺一掃而空
  - label: D
    content: 路上邂逅了一見鍾情的對象，心情所以大好
  lesson_raw:
    title: 人間情分
    basis: 題目引用作者張曼娟及〈人間情分〉課文內容
- id: doc_112_桃園_石門_國文_g9s2e1_s5_9
  section: 5
  number: 9
  type: single
  page: 1
  stem: 請問以下何人對於〈人間情分〉中的「白色襯衫的背影」與朱自清〈背影〉一文的「黑布馬褂的背影」來做比較，下列何人說法不正確？
  options:
  - label: A
    content: 佳美：兩者出現的背景皆在人來人往的車站
  - label: B
    content: 圍壕：前者是暗戀的情愫，後者是感恩的心情
  - label: C
    content: 志賢：前者是充滿活力的年輕人，後者是步履蹣跚的老人家
  - label: D
    content: 東樺：前者是善意的印象，後者是父愛的象徵
  lesson_raw:
    title: 人間情分
    basis: 題目引用課文〈人間情分〉與〈背影〉
- id: doc_112_桃園_石門_國文_g9s2e1_s5_10
  section: 5
  number: 10
  type: single
  page: 2
  stem: '席慕蓉在詩中寫道: 「我已在佛前 求了五百年／求祂讓我們結一段塵緣」，這段詩句表現出什麼樣的愛情觀？'
  options:
  - label: A
    content: 堅持五百年未盡的情感
  - label: B
    content: 內心不安而不斷地乞求
  - label: C
    content: 希望這塵緣不繼續下去
  - label: D
    content: 為這情緣而執著地追求
- id: doc_112_桃園_石門_國文_g9s2e1_s5_11
  section: 5
  number: 11
  type: single
  page: 2
  stem: 下列有關元曲概念的論述，何人所說的有誤？
  options:
  - label: A
    content: 桐谷：曲是金、元以來的一種新文體，文人為此新型音樂填詞，逐漸形成新的文學體裁，稱之為「曲」
  - label: B
    content: 沖田：元曲可以分為雜劇和散曲，其中雜劇是元代的歌劇，曲文、科、白三者兼具
  - label: C
    content: 山手：元曲的「曲牌」與內容無關，只代表音樂性而已，而題目則與內容相關
  - label: D
    content: 日向：散曲可以分為小令和散套，其中「散套」是屬於單支的曲子，與詞相似
- id: doc_112_桃園_石門_國文_g9s2e1_s5_12
  section: 5
  number: 12
  type: single
  page: 2
  stem: 〈項鍊〉一文中暗藏了伏筆暗示簡妮借出的項鍊是假的。請問下列哪段情節透露出項鍊可能是假的？
  options:
  - label: A
    content: 瑪蒂爾在鏡子前面試戴這些首飾，猶豫不決，老是問著：「你還有沒有其他的？」
  - label: B
    content: 瑪蒂爾歸還首飾給簡妮時，簡妮甚至沒打開首飾盒呢
  - label: C
    content: 項鍊盒子裡標有珠寶店名，他們帶了盒子來到珠寶商的店鋪
  - label: D
    content: 突然，瑪蒂爾在一只黑緞盒子裡發現一條極美的鑽石項鍊，一股無法扼抑的欲望撲撲跳動
  lesson_raw:
    title: 項鍊
    basis: 題目引用課文〈項鍊〉
