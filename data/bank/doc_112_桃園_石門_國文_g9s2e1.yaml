  group_stem: "（三）台灣冷知識〈古早的香奈兒香水—明星花露水〉\n  本篇要來介紹大家一項歷久彌新阿嬤級百年商品「明星花露水」。不知道對它的最初記憶來自哪裡呢？是在外婆的梳妝台上，還是家裡的廁所芳香劑？對老一輩的女性同胞來說，在當年甚至是出嫁必備嫁妝之一呢！\n\
    \  首瓶明星花露水誕生於1907 年由上海藥商周邦俊所研發調製。當時市面上也有其他的花露水品牌，但要是沾染在衣服上便會留下難以洗淨的黃色污漬，所以周邦俊才研製出的透明無色，即使不小心沾染在衣物上也能輕鬆洗淨的花露水，一推出之後就受到廣大歡迎。墨綠色的玻璃瓶身外觀上是個穿著粉紅色露肩洋裝、雙手拉開裙擺、翩然起舞的女孩。這樣的形象在當時是時髦的象徵，深受年輕仕女喜愛，也成為當時上流社會最暢銷的香水。\n\
    \  隨著時代的變遷，在臺灣，明星花露水最穩定的客戶卻從窈窕淑女漸漸轉變成陽剛威武的國軍弟兄。從上至長官，下至小兵，都會它用來消毒消臭之外，更將這樣的習慣帶入家庭，所以連帶著軍人眷屬也成了明星花露水的愛用者。\n\
    \  時至今日，雖然明星花露水身為香水的功能性已被許多國外進口的高級香水所取代，在一般大賣場甚至被歸類到清潔芳香劑區，但實際上它還有不少好用的功能，簡直就是居家必備的神物等級，而它首屈一指的妙用就是「消毒」。民國九十二年SARS\
    \ 在臺爆發時，正因為花露水的成分除了香精跟水，其酒精成分高達70%到73%，濃度正好具殺菌效果，也不需要再多加稀釋便能直接擦拭消毒，也因此翻身熱賣了好一陣子，在當時就跟口罩一樣，想搶還不一定搶的到。\n\
    \  另外，由於明星花露水所含的酒精是食用酒精，便使禁酒的回教國家，以明星花露水加水稀釋來解酒癮，遂有「阿拉伯人喝花露水」的說法。有趣的是，有人拿它當酒解饞，卻也有人拿它來醒酒。聽說在熱毛巾上滴數滴花露水，再敷在醉酒者的臉上，不僅能醒酒，而且還具有止吐效果。"
