- id: doc_112_桃園_石門_國文_g9s2e1_s6_24
  section: 6
  number: 24
  type: single
  page: 3
  stem: 根據本文的敘述，下列敘述何者正確？
  options:
  - label: A
    content: 酒精的使用僅為文明帶來負面的效應
  - label: B
    content: 酒精到了現代方才被人民廣泛的使用
  - label: C
    content: 酒精的飲用最初是為了攝取更多營養
  - label: D
    content: 造成美洲人口減少的主要原因是酒精
  group_stem: "（二）\n  酒是歷史非常悠久的加工飲品，早在西元前6000年就存在。酒透過植物發酵而成，最初以營養攝取為目的，也用來代替水及藥物。而酒的歷史隨著人類廣泛的發現及利用，對世界產生了舉足輕重的影響力。\n\
    \  在古埃及的歷史中，葡萄酒被視作神的恩賜，只能在宮廷活動及祭祀中使用，並且只能被貴族所飲用。而在中世紀的歐洲，高酒精濃度的伏特加或白蘭地，即成為防範鼠疫蔓延的消毒藥，或戰場上傷病軍人的治療用藥。可以說，人類自有文明之始，便已有酒的存在。\n\
    \  但酒精也帶來許多負面的效應，隨著殖民地的擴張，烈酒廣泛的在世界傳播，造成了一發不可收拾的問題。酒精成癮衝擊社會秩序，歷史學家曾主張，造成美洲人口大量減少與文化沒落的第一大元凶，是歐洲人輸入的傳染病，第二即為烈酒。\n\
    \  酒雖作為全球重要的飲品之一，若大量攝取則會引起中毒，形成種種後遺症，進而死亡。酒精對人類生活有很大的貢獻，但也帶來了許多的悲歌。"
