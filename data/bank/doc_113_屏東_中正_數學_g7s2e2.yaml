  stem: '日前新聞報導彰化縣荔枝、龍眼花況佳 收成有望增加 1 倍以上，員林鎮水果國中七年級有一位學生艾立知喜愛食用荔枝，已知衛生福利部 ＞ 食品藥物管理目中荔枝的
