  stem: '紹榕在外婆家吃晚餐，暖呼呼的火鍋就在她面前，一邊涮肉片、一邊煮青菜，超滿足！突然，紹榕小腿碰觸連接電磁爐插頭的延長線，感覺延長線很燙！飯後她開始收集一系列資訊如下：


