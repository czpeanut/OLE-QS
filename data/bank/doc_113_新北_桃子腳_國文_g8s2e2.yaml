  - label: A
    content: 認為長輩索求不能過於違逆
  - label: B
    content: 想藉此謀得一官半職
  - label: C
    content: 因為某公位高權重，不敢拂逆
  - label: D
    content: 某公平日頗為照顧張家，張公子以此作為答謝。
  group_stem: "甲.\n   鴿類甚繁，名不可屈以指。鄒平 張公子幼量癖好之，務盡其種。其養之也，如保嬰兒。齊 魯養鴿家，無如公子最（１），公子亦以鴿自詡（２）。雖戚好求之，不得也。\n\
    \  有父執某公，為貴官。一日，見公子，問：「畜鴿幾許？」公子唯唯以退。疑某意愛好之也，思所以報而割愛良難。又念長者之求，不可重拂（３）。且不敢以常鴿應，選二白鴿，籠送之，自以千金之贈不啻（４）也。他日見某公，頗有德色（５）；而其殊無一申謝語。心不能忍，問：「前禽佳否？」答云：「亦肥美。」張驚曰：「烹之乎？」曰：「然。」張大驚曰：「此非常鴿，乃俗所言『靼韃』者也！」某回思曰：「味亦殊無異處。」張嘆恨而返。（蒲松齡\
    \ 聊齋志異）\n【注釋】\n（１）齊魯養鴿家無如公子最：指齊 魯一帶養鴿子的行家，以張公子最為著稱。\n（２）自詡：自誇、自耀。\n（３）重拂：過分的違其意願。\n\
    （４）不啻：不止、不僅。\n（５）德色：施恩於人，而有自得之色。"
