    content: 藉此說明請人做事時，應滿足其基本的需求
  - label: B
    content: 頌揚古代皇帝仁民愛物的胸懷，能苦民所苦
  - label: C
    content: 強調執政者必須有識人之明，懂得用人唯才
  - label: D
    content: 指出唯有先解決經濟問題，才能使國家強盛。
