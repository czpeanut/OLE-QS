- id: doc_113_新北_桃子腳_國文_g8s2e2_s3_42
  section: 3
  number: 42
  type: single
  page: 6
  stem: 根據文意，燭之武提到「朝濟而夕設版焉」的用意是什麼？
  options:
  - label: A
    content: 說明晉國有強大的軍事實力
  - label: B
    content: 指責鄭國行動遲緩、難以依靠
  - label: C
    content: 建議秦國與晉國共同設防
  - label: D
    content: 顯示晉國背信棄義，不可信任。
  group_stem: "戊.\n《關稅只是拼圖的一塊，四位專家解析川普雄心勃勃的經濟計劃和對手的策略》\n《分析：川普在關稅議題上的「膽小鬼博弈」讓世界猜不透》\n\
    《賣港口」也要「講政治」？李嘉誠千億交易背後的中美角力》\n《中國實施稀土產品出口管制，澳洲能否趁勢而起》\n《輝達黃仁勳突訪北京背後的區域政治：美中關稅大戰下左右為難或逢源？》\n\
    \    以上為近日以來BBC 中文網上的新聞標題，可以反映出國際局勢的各國傾軋與不穩定性，談判技巧此時影響甚鉅，以下為《左傳》中的經典談判篇章：\n  晉國與秦國聯軍攻打鄭國，鄭國大夫燭之武夜見秦伯，運用巧妙言辭，分析利害，說服秦國退兵，保全鄭國。請於閱讀後完成相關問題:\n\
    \    燭之武見秦伯曰︰「秦、晉圍鄭，鄭既知亡矣。若亡鄭而有益於君，敢以煩執事①；越國以鄙遠②，君知其難也，焉用亡鄭以陪鄰？鄰之厚，君之薄也。若舍鄭以為東道主，行李之往來，\
    \ 共其乏困③，君亦無所害。且君嘗為晉君賜矣，許君焦、瑕④，朝濟而夕設版焉⑤，君之所知也。夫晉何厭之有？既東封鄭，又欲肆其西封，\n若不闕秦，將焉取之⑥？\
    \ 闕秦以利晉， 唯君圖之！」\n秦伯說○7 。與鄭人盟。使杞子、逢孫、楊孫戍之，乃還。\n                            《燭之武退秦師節錄》\n\
    注釋:\n①執事: 執掌事務的官吏，此處指秦伯的將士。\n②鄙遠: 使遠地之鄭國為其邊境的城邑。\n③共其乏困: 共︰即「供」，提供也。乏︰欠缺也。困︰疲憊也。意謂鄭國可為秦國使者提供館舍和所缺乏的物資。\n\
    ④許君焦、瑕: 指承諾與秦焦、瑕之五城\n⑤朝濟而夕設版焉: 濟︰濟河，渡水，指返國。版︰版築，指防禦工程。朝夕︰言其速耳。魯僖公九年九月，晉獻公卒。晉公子夷吾以河外列城五重賂秦伯以求入，置之。翌年四月，立為晉惠公。既而不與。晉之五城，終亦無與秦也。\n\
    ⑥夫晉何厭之有？既東封鄭，又欲肆其西封， 若不闕秦，將焉取之:晉，哪裏會滿足呢？既在東邊的鄭國開拓疆域，又想在西邊擴展領土，如不侵蝕秦國，將到哪裏取得土地呢？闕:\
    \ ︰削小也\n○7 說:通「悅」"
