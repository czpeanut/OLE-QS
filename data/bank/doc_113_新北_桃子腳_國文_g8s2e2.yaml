  stem: 司馬藍想用表格整理本文的論點，下列何者最符合本文所述？
  options:
  - label: A
    content: '| | 富人之田 | 吾之田 |

      | --- | --- | --- |

      | 面積 | 大 | 小 |

      | 作物 | 豐 | 不足 |'
  - label: B
    content: '| | 富人之稼 | 吾之稼 |

      | --- | --- | --- |

      | 耕種 | 依時 | 提前 |

      | 收穫 | 依時 | 落後 |'
  - label: C
    content: '| | 古之人 | 今之君子 |

      | --- | --- | --- |

      | 才能 | 高 | 低 |

      | 官位 | 低 | 高 |'
  - label: D
    content: '| | 古之人 | 今之君子 |

      | --- | --- | --- |

      | 學問 | 寡 | 多 |

      | 成就 | 高 | 低 |'
  group_stem: "乙.\n   曷嘗觀於富人之稼乎？其田美而多，其食足而有餘。其田美而多，則可以更休（１），而地力得完；其食足而有餘，則種之常不後時，而斂（２）之常及其熟。故富人之稼常美，少秕（３）而多實，久藏而不腐。\n\
    \  今吾十口之家，而共百畝之田。寸寸而取之，日夜以望之，鋤耰銍艾（４），相尋於其上者如魚鱗，而地力竭矣。種之常不及時，而斂之常不待其熟。此豈能復有美稼哉？\n\
    \  古之人，其才非有以大過今之人也。其平居所以自養而不敢輕用以待其成者，閔閔（５）焉如嬰兒之望長也。弱者養之以至於剛，虛者養之以至於充。三十而後仕，五十而後爵。信於久屈之中，而用於至足之後；流於既溢之餘，而發於持滿之末。此古之人所以大過人，而今之君子所以不及也。（蘇軾\
    \ 稼說送張琥）\n【注釋】\n（１）更休：輪流休息。  （２）斂：收穫。\n（３）秕：音ㄅㄧˇ，穀類植物所結的果實，虛有外殼，裡面卻是中空的。\n（４）鋤耰銍艾：用鋤頭鬆土或除草、播種後用土覆蓋種子、用鐮刀收割農作物。\n\
    （５）閔閔：祈求關愛、憂慮的樣子。"
