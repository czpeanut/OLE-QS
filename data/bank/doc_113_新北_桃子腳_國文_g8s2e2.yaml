- id: doc_113_新北_桃子腳_國文_g8s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 《史記》中有許多名言警語至今仍被人們所熟知。下列名言皆出自《史記》，請根據文意，判斷何者使用有誤？
  options:
  - label: A
    content: 你的個性太過優柔寡斷，若做每件事都如此舉棋不定，小心「當斷不斷，反受其亂」。
  - label: B
    content: 他勤奮苦學，立下崇高的志向，然而這些鄉里俗人卻不理解，唉！「燕雀安知鴻鵠之志」。
  - label: C
    content: 沒想到向來顧全大局的他，此次卻因一時疏漏而引人非議，可說是「智者千慮，必有一失」。
  - label: D
    content: 張良深諳明哲保身之道，他在幫助漢高祖得天下後，主動求去，逃脫了「無顏見江東父老」的命運。
  tags:
    chapter:
      publisher: 康軒
      book: 八下
      subject: 國文
      code: 第四課
      title: 張釋之執法
      chapter: null
