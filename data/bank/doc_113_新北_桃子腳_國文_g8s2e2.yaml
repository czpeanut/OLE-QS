  group_stem: "丁.\n   時間從亞特蘭大向前快轉來到一九九二年五月，我受邀在一次會議中演講，講我們對傳染病的了解及治療的進展。這次論壇特意在耶魯大學舉辦，為的是紀念美國使用盤尼西林五十週年。一開始，主持人就講起安．米勒的病例。一九四二年，三十三歲的護士安．米勒流產，足足重病了一個月，發高燒且全身顯露鏈球菌感染的跡象，時而清醒時而昏迷，已接近彌留狀態。\n\
    \  然而，不知怎麼來的難以置信的好運，他的醫生弄到了第一批盤尼西林中的小小一份，施用在米勒身上。才幾個小時，她便開始好轉。燒退了，也能進食。經過一個月，她已經復原，簡直是科學版的奇蹟。使她病情逆轉的，是稀釋到她靜脈輸液中約一茶匙量的盤尼西林。當時盤尼西林的供應非常短缺，所以醫院還要把她的尿液收集起來，送回默克製藥公司，將其排除的盤尼西林濾給其他病患使用。\n\
    \  主持人細細述說這個曲折離奇的故事，大家聽得十分入神，全場鴉雀無聲。不久，他先是停頓了一下，然後說：「現在麻煩這位病患站起來。」我轉身回頭，看到第三排有位女士站了起來，她骨架纖細，一頭白髮，氣質優雅，明亮的眼睛看著整個演講廳。她就是安．米勒，時年八十歲餘，當年的盤尼西林讓她多活了五十多年。我至今依然記得當時她那羞赧的笑容。她後來又活了七年，直到九十歲才離世。\n\
    \  盤尼西林是弗萊明在一九二八年發現的。當時他在倫敦 聖瑪麗醫院做事，他在幾個培養皿中置入一些果凍狀生長介質（洋菜及加熱過的血液），再將細菌接種到生長介質中。細菌本來小到肉眼看不見，但它們喜歡吃洋菜，一邊吃養分，一邊一次又一次的分裂。到最後，肉眼便看得見數以百萬計的細菌集結成團。將培養皿放置在保溫箱一個晚上後，弗萊明培養出一團一團清楚可見的金黃色葡萄球等細菌。接下來，他用萃取自白血球和唾液的酵素來殺死這些細菌。\n\
    \  一九二八年八月，弗萊明去法國度假。九月初回到家裡，他發現有幾個培養皿因自己疏忽，出國前忘了丟掉。那裡面植有金黃色葡萄球菌，在出國前一直放在實驗室的椅子上。在他準備把這些培養皿清理乾淨時，其中一個吸引了他的目光。他定睛一看，那是一塊綠色的東西。他認出這東西其實是常見的麵包青黴菌。他發現培養皿裡本來有幾十億個金黃色葡萄球菌蔚然成層，長滿整個培養皿，但在靠近青黴菌的部分都不見了。有什麼東西在青黴菌四周畫了一個圈，阻擋了葡萄球菌的生長。\n\
    \  弗萊明立刻看出這是怎麼一回事。青黴菌這種真菌也很喜歡吃洋菜，它們釋放一種擴散到洋菜裡面的東西，殺死了葡萄球菌。這種東西和溶菌酶一樣，能將細菌細胞溶解，這是人類找到的第一種抗生素。後來的幾個月，弗萊明在培養液裡培養出這種黴菌。他把培養液過濾後得出一種液體，液體中有強大的殺菌活性，他把這個命名為青黴素，也稱為「盤尼西林」。\n\
    \        （改寫自馬丁．布雷瑟 不該被殺掉的微生物）"
