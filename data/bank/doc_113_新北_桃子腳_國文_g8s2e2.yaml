  section: 1
  number: 8
  type: single
  page: 1
  stem: 關於柬帖的說明，下列何者正確？
  options:
  - label: A
    content: 是一種簡短的文書，原為書信的一種
  - label: B
    content: 柬帖的內容包括時間、地點、目的、發帖人姓名等，其 中「目的」可以省略
  - label: C
    content: 可用於婚嫁、慶賀及喪葬等特殊事件，極少用於普通的 應酬上
  - label: D
    content: 「柬」原意是將文字寫在絹帛上，「帖」原意是將文字刻 在竹片上。
