  type: single
  page: 1
  stem: 〈我所知道的康橋〉一文中，將「炊煙」譬喻成「朝來人們的祈禱，參差地翳入了天聽」，這裡運用聯想力，藉由不同感覺摹寫的移用，以「聽覺」表現「視覺」，使這些感覺似能相通。請判斷下列文句中哪些感覺的表現方式有誤？
  options:
  - label: A
    content: 她靦腆的笑容，充滿了濃濃的甜味。／以味覺表現視覺
  - label: B
    content: 從窗外望出去，嘩啦嘩啦的陽光，灑在一望無際的蒼綠草原上。／以視覺表現聽覺
  - label: C
    content: 她的笑聲像散落一地的銀幣，可以一一撿起。／以視覺表現聽覺
  - label: D
    content: 枝上黃鶯的吟唱，彷彿夜裡清涼的微風輕輕的拂過肌膚。／以觸覺表現聽覺
