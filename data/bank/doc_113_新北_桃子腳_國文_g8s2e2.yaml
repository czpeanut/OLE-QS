- id: doc_113_新北_桃子腳_國文_g8s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 「你如愛花，這裡多的是錦繡似的草原。你如愛鳥，這裡多的是巧囀的鳴禽。你如愛兒童，這鄉間到處是可親的稚 你如愛人情，這裡多的是不嫌遠客的鄉人，你到處可以掛單借宿，有酪漿與嫩薯供你飽餐，有奪目的鮮果恣你嘗新。」關於這段文字，下列敘述何者正確？
  options:
  - label: A
    content: 使用類疊修辭技巧，以歡欣的口吻，和讀者分享康橋的自然與人文風情
  - label: B
    content: 描寫康橋秋季豐收的盛況，以及當地居民的生活情形
  - label: C
    content: 說明康橋環境優美，四季如春，十分適合人居住
  - label: D
    content: 觀察遊客在康橋從事的休閒活動，期盼自己日後也能親身體驗。
  lesson_raw:
    number: 第四課
