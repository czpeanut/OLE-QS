- id: doc_113_新北_桃子腳_國文_g8s2e2_s3_38
  section: 3
  number: 38
  type: single
  page: 5
  stem: 根據本文，下列哪一項最能說明「莫內晚年繪畫的特點」？
  options:
  - label: A
    content: 色彩鮮明精細，注重視覺效果
  - label: B
    content: 完全依靠助手完成畫作
  - label: C
    content: 改以攝影輔助創作畫面
  - label: D
    content: 雖視力退化，仍依感官記憶作畫。
  group_stem: "丙.\n    你知道，梵谷在阿爾勒畫的畫，幾乎都有麥田的氣味，看著看著，好像把一顆麥穗放在齒間咀嚼，麥粒上還帶著被夏天的日光曝晒過的氣味。\n\
    \ 有些畫家的畫是沒有氣味的，畫海沒有海的氣味，畫花沒有花的氣味，徒具形式，很難給人留下深刻的印象。\n  繪畫，不只是依靠視覺。晚年的莫內，因為患有白內障而失去了精準的視覺。但是那一時期，他並沒有中斷作畫，依憑著嗅覺與觸覺的記憶畫畫。一朵一朵的蓮花，從水裡生長起來，含苞的蓓蕾倒映水中，柳梢碰觸水面，漾起一圈一圈漣漪。我在那幅畫裡聽到水聲，觸摸到飽滿的花苞；我嗅到氣味，水塘裡清涼的氣味。\n\
    \  莫內並不只是在用視覺畫畫。視覺只是畫家所有感官的窗口。開啟這扇窗，你就開啟了眼、耳、鼻、舌、身，你的視覺、聽覺、嗅覺、味覺、觸覺也都一起活躍了。\n\
    \  我去普羅旺斯，是為了感覺塞尚畫裡的氣味。那條通往維克多的山路，塞尚為了寫生，走了２０年。我走進那條山路，遠遠可以聽到海風聲，海風裡有海的氣味。我一路走下去，空氣裡有松樹皮辛香的氣味，有一點橄欖樹木的青澀氣味。在塞尚畫過的廢棄的採石場，我嗅到了熱烈過後冷冷的荒涼氣味，有堆積的礦土和空洞孔穴的氣味。塞尚的畫裡，有岩石粗糙的質感，有海風聲與松林裡的風聲，但是這一次，我純粹為了尋找氣味而來。\n\
    \  許多藝術工作者，是帶著對氣味的記憶，去寫詩、去跳舞、去畫畫、去作曲、去拍攝電影的。沒有氣味的作品，其實很難打動人。\n  德彪西的音樂，總是有非常慵懶的海風和雲的氣味，有希臘午後陽光的氣味；拉威爾就好像多了一點鮮濃的番紅花與茴香的氣味。如果沒有這些氣味，藝術便不像「母親」、「童年」或「故鄉」了。「母親」、「童年」和「故鄉」都充滿了氣味。\n\
    \  像你在南方，閉著眼睛，深深吸了一口氣，把整個海洋的氣味都吸到身體裡了。海在你的肺葉裡，海在你的皮膚上，海充盈了你身體每一個細胞的空隙。海占領了你的視覺、聽覺，海包圍著你，從心裡壓迫著你，使你心裡哽咽著。有一天，你要寫詩，你要畫畫，你要歌唱或跳起舞來，那海，就在你心裡澎湃起來，不是你去尋找它，而是它鋪天蓋地而來，包圍著你、滲透著你。\n\
    \  藝術家只屬於一個國度，便是感官的國度。\n                     （蔣勳 好的畫，通常都有氣味）"
