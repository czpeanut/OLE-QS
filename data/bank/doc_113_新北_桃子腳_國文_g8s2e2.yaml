    labeled_by: ai
- id: doc_113_新北_桃子腳_國文_g8s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 對人恭敬的稱呼用語，稱為「敬稱詞」；謙遜的自稱用語，稱為「謙稱詞」。下列文句的詞語使用，何者完全正確？
  options:
  - label: A
    content: 臣斗膽稟奏：「殿下」貴為天子，自當賞罰分明，即使太子「陛下」犯法，亦應與庶民同罪，如此則四海歸心，國家可治，否則民心不服，國家危矣！
  - label: B
    content: 最近「敝人」即將前往他國任職，臨別不勝依依，擬藉此邀請各位老友於本週末晚上六點光臨「府上」一敘，屆時將敬備菲酌，恭候大駕光臨。
  - label: C
    content: 聽說「閣下」最近參加國際比賽榮獲優等獎，身為同學的我與有榮焉，改天必當親自前往「府上」道賀。
  - label: D
    content: 請問「敝縣」何時舉辦教育論壇？本人定與「貴縣」教育專家前往參與盛會。
  tags:
    chapter:
      publisher: 康軒
      book: 八下
      subject: 國文
      code: 語文常識(一)
      title: 書信、便條
      chapter: null
    textbook: 八下 語文常識(一) 書信、便條
    labeled_by: ai
