- id: doc_111_桃園_中興_國文_g8s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 透過文字論述，表達對人事物的看法，進而達到說服、批判等目的，這樣的作品即為議論文，議論文主要包含了「論點」、「論據」、「論證」三要素。請根據上述說明，選出正確的選項。
  options:
  - label: A
    content: 對於某個事件或問題，作者提出的主要觀點或信念叫做論證
  - label: B
    content: 以論據來證明論點的方法有例證法、引證法、與比喻法等方法
  - label: C
    content: 論點是用來支持作者想法的證據或材料，包含歷史事實、寓言故事或名人言論
  - label: D
    content: 陶淵明詩句：「盛年不重來，一日難再晨，即時當勉勵，歲月不待人。」在生命中的碎珠這課，是屬於作者的「論點」。
