    content: 太宗因魏徵以下犯上，其行徑與桀、紂無異而抱怨
  - label: B
    content: 皇后說：「國有賢君，而後有不屈之臣」，由此可推論太宗娶了一位賢德之妻
  - label: C
    content: 太宗能善用逢、干等人並聽取其諫言，因此留名青史
  - label: D
    content: 桀、紂雖然暴虐無道，卻有忠臣魏徵的輔助。
  group_stem: '唐太宗有一天退朝後，懷著滿腹怒火回到宮裡，向皇后抱怨魏徵犯顏直諫的事。皇后聽了，默不作聲地退回房中，換上

    禮服後，站在庭階前向太宗道賀。太宗問她何事？她回答：「吾聞國有賢君，而後有不屈之臣。桀、紂獨夫，不容逢、干。

