  section: 2
  number: 31
  type: single
  page: 3
  stem: 根據上圖，請判斷何者才是正確的避難原則？
  options:
  - label: A
    content: 當火在門外時代表外頭溫度極高，應當機立斷地關門並確實將門縫堵住，躊躇不決更不利於逃生
  - label: B
    content: 火場逃生的最好方式就是離開建築物，確認門把不燙及門外無煙後請盡速往下逃生，離開火場
  - label: C
    content: 向下撤離火場時，確立逃生門的位置相當重要，請勿關閉逃生門以保持逃生路線的暢通
  - label: D
    content: 火災濃煙是最為致命的，進入離起火點較遠的相對安全空間後，請記得關閉門窗避免吸入過多濃煙。
  group_stem: 冬日常因窗戶緊閉而火災頻傳造成不少傷亡，為了加深民眾正確的防災觀念，消防單位不斷加強宣導，希望可以藉此避免更多悲劇發生。面對火災時，正確的避難觀念可以大大提升獲救的機會，而錯誤的逃生觀念反而可能釀下大禍，究竟我們應該如何自保呢？
