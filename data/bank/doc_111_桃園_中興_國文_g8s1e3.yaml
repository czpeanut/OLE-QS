  section: 2
  number: 33
  type: single
  page: 3
  stem: 根據上文，以下敘述何者較符合作者對「寂寞」的看法？
  options:
  - label: A
    content: 只有真正的摯友才能陪我們度過寂寞
  - label: B
    content: 面對寂寞承擔寂寞，才能夠走出寂寞
  - label: C
    content: 受歡迎的人往往是不會感到寂寞的人
  - label: D
    content: 人只有在靈魂富足的時候，對於寂寞才能一笑置之。
  group_stem: '每一個人都有在靈魂上痛感寂寞的時候。我們時常會感到滿腹辛酸，卻覺得家人親友之中，竟無一人可與之一吐衷曲。

    尤其是當我們發現並且證明了人們多數喜歡看你春風得意時的笑臉，而不喜歡聽你秋扇見捐時的牢騷；當你一腔心事方待傾

    訴，卻見你生平好友婉謝約談，離席而去，那時，你心中又是什麼感覺？

    但如你夠豁達，你就該了悟，人與人之間只能在笑語喧騰的時候，顯得親熱；或在一方可以施捨善意，博得慷慨之名的

    時候，顯得仁慈，捨此之外，沒有誰真正分擔你心靈上的寂寞。

    因此，我們在這漫長而又孤零的人生道上，只有勇敢的承擔起這與生俱來的寂寞，用自己的力量發出一點光和熱，冀望

    這點光和熱也可以成為漆黑夜空中的一、二星點，在漫漫無際的永恆中，發出一點光輝。            （羅蘭談寂寞）'
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
      code: 自學課二
      title: 一團人生
      chapter: null
    textbook: 八上 自學課二 一團人生
    labeled_by: ai
