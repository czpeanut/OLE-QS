  stem: 關於小說的敘述，下列何者錯誤？
  options:
  - label: A
    content: 生動的人物形象、完整的故事情節、人物活動的具體環境是小說必備的三要素
  - label: B
    content: 理解作品的主題思想、能分析小說故事情節的階段、能分析小說人物形象的性格特點、能分析小說寫作的主要手法是學習小說的重點
  - label: C
    content: 小說的取材包羅萬象，唯一要注意的為必須由事實改編
  - label: D
    content: 小說的情節發展一般來說可以分為緣起、開展、轉折、高潮、與尾聲。
