- id: doc_111_桃園_中興_國文_g8s1e3_s2_35
  section: 2
  number: 35
  type: single
  page: 4
  stem: 根據本文，下列敘述何者正確？
  options:
  - label: A
    content: 首段列出人們看待敵人的種種態度
  - label: B
    content: 好學可以使人化敵為友
  - label: C
    content: 最好的學習往往是自己能由失敗中獲取教訓
  - label: D
    content: 天下沒有永遠的敵人。
  group_stem: "我們在情感上需要朋友，在知識上需要對手。能有一個相互比較競爭的對手，往往可以讓我們帶來可長可久的成長。\n孟子說：「出則無敵國外患者，國恆亡。」然而，卻有很多人無法這樣看待對手。由於對手和敵人往往只有一線之隔，所以，\n\
    對手也很容易變成仇人，因為我們常常在看待對手的時候混雜了情緒。不少人在碰到對手的時候，首先會對其產生不屑的感\n覺；再來則會因為發現竟然有很多人喜歡他，甚至超越自己，於是會感到憤怒不滿；最後則是不能在他面前提到對方的隻字\n\
    片語；然後，對手等於敵人和仇人。\n  其實，越是敵人和仇人，可學的才越多。尤其是在他們使出渾身解數的時候，那就是傳授你最多招數的時候，更要把握\n機會好好跟他學習。而最好的學習，永遠來自於你和他交手，被他擊中的那一刻。\
    \          （本文改寫自網路文章）"
