  section: 2
  number: 39
  type: single
  page: 4
  stem: 垓下歌是西楚霸王項羽敗亡之前吟唱的一首詩。此詩概括了項羽平生的業績和豪氣，表達了他對美人虞姬和其坐騎烏騅馬的憐惜，抒發了他在漢軍的重重包圍之中那種充滿怨憤和無可奈何的心情。下列有關於此詩的敘述，何者錯誤？
  options:
  - label: A
    content: 全詩通過虛實結合的手法，生動地顯示出項羽叱吒風雲的氣概
  - label: B
    content: 本詩篇幅雖短小，卻表現出豐富的內容和複雜的感情
  - label: C
    content: 本詩既洋溢著無與倫比的自信與豪氣，又蘊含著項羽的滿腔深情
  - label: D
    content: 本詩顯示出項羽罕見的謙虛，與在悲憤後發誓東山再起的決心。
  group_stem: '項王軍壁垓⑴下，兵少食盡，漢軍及諸侯兵圍之數重。夜聞漢軍四面皆楚歌，項王乃大驚曰：「漢皆已得楚乎？是何楚

    人之多也！」項王則夜起，飲帳中。有美人名虞，常幸從；駿馬名騅，常騎之。於是項王乃悲歌慷慨，自為詩曰：

    「力拔山兮⑵氣蓋世，時不利兮騅⑶不逝。騅不逝兮可奈何，虞⑷兮虞兮奈若何。」(5)

    歌數闋，美人和之。項王泣數行下，左右皆泣，莫能仰視。

    補充注釋

    ⑴垓（ㄍㄞ）下：古地名，在今安徽省靈璧縣南沱河北岸。

    ⑵兮：文言助詞，相當於現代的口語「啊」或「呀」。

    ⑶騅（ㄓㄨㄟ）：為項羽的頂級寶馬，名為烏騅。

    ⑷虞：即虞姬。是楚霸王項羽心愛的女人。

    (5)此詩即為項羽所作之垓下歌                                                        （司馬遷史記《項羽本紀》）'
