  group_stem: '甲、

    蒹葭蒼蒼，白露為霜。所謂伊人，在水一方。溯洄從之，道阻且長。

    溯游從之，宛在水中央。

    蒹葭萋萋，白露未晞。所謂伊人，在水之湄。溯洄從之，道阻且躋。

    溯游從之，宛在水中坻。

    蒹葭采采，白露未已。所謂伊人,在水之涘。溯洄從之，道阻且右。

    溯游從之，宛在水中沚。

    《詩經·蒹葭》


    乙、

    你住的小小的島我正思念

    那兒屬於熱帶，屬於青青的國度

    淺沙上，老是棲息著五色的魚群

    小鳥跳響在枝上，如琴鍵的起落


    那兒的山崖都愛凝望，披垂著長藤如髮

    那兒的草地都善等待，鋪綴著野花如果盤

    那兒浴你的陽光是藍的，海風是綠的

    則你的健康是鬱鬱的，愛情是徐徐的


    雲的幽默與隱隱的雷笑

    林叢的舞樂與冷冷的流歌

    你住在那小小的島我難描

    難繪那兒的午寐有輕輕的地震


    如果，我去了，將帶著我的牧笛

    那時我是牧童而你是小羊

    要不，我去了，我便化做螢火蟲

    以我的一生為你點盞燈

    鄭愁予〈小小的島〉'
