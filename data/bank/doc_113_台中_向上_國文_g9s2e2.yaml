- id: doc_113_台中_向上_國文_g9s2e2_s1_38
  section: 1
  number: 38
  type: single
  page: 3
  stem: 作者認為林黛玉「只能」得肺結結核，其他病都不合適的主要原因是：
  options:
  - label: A
    content: 肺結核是當時最為普遍的疾病
  - label: B
    content: 即使罹癌也容易被誤認為肺病
  - label: C
    content: 痢疾症狀易中斷小說情節進行
  - label: D
    content: 其他病況難與美感和浪漫共存
  group_stem: '林黛玉罹患的是肺結核，也就是俗稱的「肺癆」。在過去，肺結核是一種相當常見的疾病，十九世纪及二十世纪初年的作家，喜歡讓他們的男女主角染上肺結核，就跟當代作家樂於讓他們的男女主角罹患癌症一樣，這絕不只是「社會寫實」而已，還有超乎醫學與寫實之外的深刻含義。在癌症中，最常出現於愛情小說裡的是「血癌」(一稱「白血病」)，這種癌症並不像其他癌症般會有可見或可觸摸得到的「可憎腫瘤」，能相當維持當事者的「形象美感」；而且血是生命的象徵，病人因此病而臉色蒼白，在「白」與「血」之間，很巧妙地營造出病人「美麗的生命正逐漸被吞噬」的意象。西格爾《愛的故事》裡的女主角，得的就是這種病。結核病也不是只侵犯肺，它還會侵犯腎臓、骨頭等器官，但在過去的愛情小說裡，出現最多的還是僅止於肺的結核病。因為肺是呼吸器官，而呼吸亦是生命的象徴；病人雖然也臉色蒼白，但不時出現「紅暈」，「卻有一股風流體態」，不停地咳嗽，有生命「掙扎」與「顫動」的氣氛，如果能適時吐一口血，則更有魯迅所說「海棠丫鬟」的淒艷美感。肺結核就像血癌，在「白」與「血」之間，營造出病人「美麗的生命正逐漸被吞噬」的意象，而且是更勝血癌三分。如果林黛玉得的不是肺結核，而是亦常見於當時社會的痢疾，需經常跑廁所拉肚子，吐出来的是胃中的穢物；如果《愛的故事》女主角得的不是血癌，而是肚子會鼓得像青蛙一樣，上面血管盤結的肝癌；那麽她們的浪漫愛必然會大為「失色」。我們若考慮疾病的隱喻作用，則不僅能更確認林黛玉得的是肺结核，而且可以說，林黛玉「只能」得肺結核，因為其他病都不「合適」。

    王溢嘉〈美麗與哀愁之外-林黛玉的愛情、疾病與死亡〉'
