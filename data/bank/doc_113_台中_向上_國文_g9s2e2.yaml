- id: doc_113_台中_向上_國文_g9s2e2_s1_40
  section: 1
  number: 40
  type: single
  page: 4
  stem: '下列說明符合作者看法的是:'
  options:
  - label: A
    content: 傳統的心理治療方式不分析，也不診斷，著重發現生命意義
  - label: B
    content: 敘事治療師每每專心聆聽個案的故事，並且和個案進行對話
  - label: C
    content: 從事「敘事治療」時，心理諮商師應該始終保持理性的思考
  - label: D
    content: 如果想學習心理專業，必須先理解心理學中的許多專有名詞
  group_stem: '十三年前,我找到了一個十分適合我風格的諮商學派：敘事治療(narrative therapy)，有學者根本就直接叫它：「故事治療」。這個後現代心理治療學派，一改傳統心理治療的世界觀與治療方式，既不分析也不診斷，就是讓個案敘說自己的故事。個案從敘說故事中理解自己，並重新發現生命的意義，進而重寫生命故事，生命的改變就在其中，十分神奇。

    在傳統理性科學的教育下，人的腦袋越來越複雜，我們一天到晚在思考要如何「解決問題」。偏偏，聆聽故事的腦袋，不是問題解決的腦袋，它需要一種單純、一種簡單。我們必須把自己「變回五歲的孩子」。需要一顆有如孩子般單純的「赤子心」。進入生命的腦袋，是情感的、靈性的、直覺的，感通的。如果用理性的頭腦聽故事，人會急於算計、分析、問題解決，這也沒什麼不好，只是，你喜歡別人用這種方式，來聆聽你的故事嗎？恐怕没人喜歡。

    心理治療是一種生命底層交流的工作，有如藝術，它是一種心靈的運作，它需要美感。然而，美感的前提是「你要有感動」。聆聽故事也需要一種感動，一種熱淚盈眶的感動。從左腦到右腦，從認知的理性到生命的感通與感動。「只有生命可以抵達另一個人的生命。」聆聽故事，不是靠腦袋，它需要一種生命的投入，它是一種靈魂的運作。

    《故事的療癒力量》當然是一本心理專業的書。後現代強調「解構」，這本書也在解構我們對心理專業的認識與學習方式。誰說學習心理專業，非得要從深奧的理論、專有名詞開始。這本書，我想回到敘事「說故事」的本質，並展現敘事的原始風貌。

    本書的第一章先從我的生命故事說，敘事裡有個很重要的概念叫「透明化」(transparent)。敘事治療師不像傳統的治療師那樣，把自己當成「空白螢幕」，我們會適當地自我表露，我們是以一個「人」的姿態去靠近人的。我深信：「只有生命可以教導生命。」如洛爾(Jim
    Loehr)所言：「生命即是故事，故事即是生命(Life as story, story，story as life)。」透過故事敘說，於是我深深理解自己、也療癒自己。「一個人不可能給別人他身上沒有的東西。」如果我不說故事，不親自體會故事的美好，我如何運用故事去療癒他人？一切療癒，由我開始。

    說故事是一種「語言」的運作。語言不光是語言，語言背後是一種價值、是一個文化。語言是有力量的。而以故事的隱喻來理解人的生命，是後現代心理學很重要的視框。正如心理學家克洛斯(Henry
    Close)所言:「透過故事與隱喻metaphor)，將使諮商的型態變得更加豐富又有趣，過程也充滿了驚喜。」確實，隱喻故事，常常是引領個案通往「領悟」的通路，為生命找到新的出口。

    故事是活的，透過「對話」，故事才可以「生生不息」。故事的力量，就是這樣來的。

    周志健〈故事的療癒力量:敘事、隱喻、自由書寫〉'
