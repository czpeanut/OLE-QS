  stem: 依據上文，下列敘述最適當的是：
  options:
  - label: A
    content: 「師道之不傳也久矣」，謂風氣衰敗過久，為人師表者已無法指導後進
  - label: B
    content: 「愚人之所以為愚，其皆出於此」，謂世人愚昧，不知與聖人如何相處
  - label: C
    content: 「聖人無常師」，謂聖人虛心求教，博採眾家的優點，並沒有固定的老師
  - label: D
    content: 「郯子之徒，其賢不及孔子」，謂郯子等人的學生遠不如孔子弟子
  group_stem: '甲、

    嗟乎！師道之不傳也久矣!欲人之無惑也難矣!古之聖人，其出人也遠矣，猶且從師而問焉;今之眾人，其下聖人也亦遠矣，而恥學於師。是故聖益聖，愚益愚。聖人之所以為聖，愚人之所以為愚，其皆出於此乎？

    乙、

    聖人無常師。孔子師郯子、萇弘、師襄、老聃。郯子之徒,其賢不及孔子。孔子曰:「三人行，則必有我師。」是故弟子不必不如師，師不必賢於弟子。聞道有先後，術業有專攻，如是而已。

    韓愈〈師說〉'
