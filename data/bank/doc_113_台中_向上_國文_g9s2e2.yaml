  - label: D
    content: 不知命，無以為君子也
  group_stem: '譽乎己，則以為喜；毁乎己，則以為怒者，心術①之公患也。同乎己，則以為是；異乎己，則以為非者，學術之公患也。君子則不然。譽乎己，則懼焉:懼無其實而掠美也；毁乎己，則幸焉:幸吾得知而改之也。同乎己，則疑焉:疑有所蔽，而因是以自堅②也；異乎己，則思焉:去其所私以觀異術，然後與道大適③也。

    【注釋】①心術：思考、認知事物的方法

    ②自堅：堅持自己的觀點

    ③大適：大體相符

    ―方苞〈通蔽〉'
