- id: doc_113_新北_蘆洲_自然_g9s2e1_s1_39
  section: 1
  number: 39
  type: single
  page: 6
  stem: 39.下列敘述，何者正確 ？
  options:
  - label: A
    content: 電磁爐不一定要使用交流電，使用大小穩定、方向固定的直流電也可以使磁場改變
  - label: B
    content: 交流電的電流強弱和方向會不停變化，產生的磁場大小和方向卻可以保持不變
  - label: C
    content: 電磁爐因為沒用到明火，所以適用於各種材質的鍋具
  - label: D
    content: 電磁爐的使用有應用到電流的磁效應、電磁感應和電流的熱效應。
  group_stem: '◎閱讀題(39、40 題)

    日常生活中有一些物品是運用到電流磁效應與電磁感應原理，如電磁爐和悠遊卡的使用。電磁爐內部有銅製線圈如圖（一），當通以交流電時，磁場便會隨之改變，使爐面上的金屬鍋感應而產生電流，再經由電流的熱效應轉化成熱能後，便可以加熱鍋內的食材。

    悠遊卡內部的晶片與銅製線圈連接如圖（二），當我們搭乘大眾運輸或在便利商店消費時，車站閘門或店家設有讀卡機，其內部含有通電線圈，可以在周圍產生磁場。而將悠遊卡靠近讀卡機時，卡片中的線圈接受到磁場變化後，會產生感應電流，就可以讀寫晶片的數據了。依本文內容回答39、40
    題：'
