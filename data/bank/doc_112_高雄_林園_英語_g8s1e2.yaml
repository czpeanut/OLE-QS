- id: doc_112_高雄_林園_英語_g8s1e2_s6_22
  section: 6
  number: 22
  type: single
  page: 5
  stem: Why did the writer's father cry for the first time?
  options:
  - label: A
    content: His brother passed away.
  - label: B
    content: The writer wrote him a letter.
  - label: C
    content: He went to his brother’s funeral.
  - label: D
    content: He missed his son.
  group_stem: '2)

    When I was eleven years old, I lived in a small house with my parents. One morning,
    before going to school, I saw my father crying. In all my life, I never saw him
    cry. "What''s wrong, Dad?" I asked. He didn''t answer. At school, I kept thinking
    about my father''s tears. After I went home, I found out that my uncle died. My
    father was very close to him. That was why he was so sad. At the funeral, I sat
    next to my father. I wanted to say something to make him feel better, but I didn''t
    know what to say. I saw my father put a letter in the coffin. I asked him about
    the letter. He told me it was a letter to his brother. My father said that sometimes
    he wrote letters to his brother when he missed him. "But how can you write a letter
    to someone who is dead?" I asked. "You can," he said. "It makes me feel good."
    A few days later, my father gave me a notebook. "When you miss me, write me a
    letter," he said. "Even if I''m sitting right next to you, you can still write
    me a letter." I started writing letters to my father every day. Sometimes I wrote
    about what happened at school. Other times I wrote about my dreams for the future.
    Whenever I had a problem, I wrote about it in my letter. Even though my father
    never wrote back, I still kept writing.


    tear 眼淚   funeral 葬禮    coffin 棺材   dead 死的   dream 夢想    Whenever 每當'
