    Dear Diary,

    It was finally the day - a big day for my class! We played a show at Linyuan Dist.
    Bilingual Carnival. All of us spent a lot of time preparing for it. Before the
    show, I got butterflies in my stomach. I was afraid I would be the black sheep
    and make my group lose face. My mom came and cheered for me, I felt fine then.
    We acted the story, the Three Little Pigs. My friend who played the Big Bad Wolf
    was so cute. I heard people laugh when he spoke. Everyone enjoyed the show, so
    it was a success. For me, it was a wonderful experience. I was shy before, but
    I am confident now. Learning English through a story is fun.


