- id: doc_113_新北_忠孝_自然_g7s1e2_s1_24
  section: 1
  number: 24
  type: single
  page: 1
  stem: 聯合國在1982 年第三次海洋法會議中做出《聯合國海洋法公約》決議，對於經濟海域有詳細規定。「經濟海域」是指國際海洋法中為解決國家因海域爭端而提出的一個區域概念。從測算領海寬度的基線量起，不應超過        浬。該國對其專屬經濟海域的漁業資源和礦產資源擁有開發利用或准許它國利用的專有權。請問：上文         應填入？
  options:
  - label: A
    content: '200'
  - label: B
    content: '100'
  - label: C
    content: '400'
  - label: D
    content: '12'
