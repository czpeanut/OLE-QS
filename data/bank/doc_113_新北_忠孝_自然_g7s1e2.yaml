- id: doc_113_新北_忠孝_自然_g7s1e2_s1_19
  section: 1
  number: 19
  type: single
  page: 1
  stem: '阿翔最近積極研究臺灣的山脈分布，他發現臺灣山地面積廣大，孕育豐富的自然生態，而各座山脈也具有不同的特色。右圖是阿翔手繪的五大山脈分布圖

    請問：「北起宜蘭蘇澳，南至恆春鵝鑾鼻，是臺灣的主幹山脈。面對颱風侵襲有「護國神山」之稱，也是東西部河川的分水嶺。」上文描述的是哪一座山脈？'
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
