- id: doc_111_高雄_林園_社會_公民_g9s1e2_s1_37
  section: 1
  number: 37
  type: single
  page: 1
  stem: 基隆的崁仔頂魚市是臺灣批發市場中漁獲種類最多的交易場所。而這裡的交易方式是採拍賣方式，以前一日的成交價格為底價，再漸漸往上加價，直到有買主決定購買為止，因而交易時間從凌晨持續到早上
    6～7 點，造成崁仔頂「不夜城」的特殊景觀，是臺灣獨一無二的特色景點。根據上文敘述，當漁獲成交時，該拍賣價格是由誰決定？
  options:
  - label: A
    content: 政府
  - label: B
    content: 魚販
  - label: C
    content: 消費者
  - label: D
    content: 魚販與消費者 (習作)
  answer:
  - D
  answer_source: answer_key_vlm
  tags:
