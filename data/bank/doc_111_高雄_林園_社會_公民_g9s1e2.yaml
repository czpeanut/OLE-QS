  stem: 2020 年受疫情影響，各種商品價格連帶受挫，而栽種檸檬的果農也受到影響。國內有對夫妻對生態環境相當重視，返鄉務農後申請產銷履歷驗證，以無農藥殘留方式種植，成功栽培出符合市場需求的「ND」（未檢出農藥）的檸檬。「ND」檸檬果皮外觀翠綠，只要手一搓就有一股檸檬香飄出來，因此該對夫妻成功和廠商訂定好的價格，以及建立穩定的銷售通路，不怕受疫情影響。請問「ND」檸檬是採何種競爭方式？
  options:
  - label: A
    content: 重視外觀的價格競爭
  - label: B
    content: 重視生態的非價格競爭
  - label: C
    content: 重視香氣的價格競爭
  - label: D
    content: 重視售價的非價格競爭 (習作)
  answer:
  - B
  answer_source: answer_key_vlm
