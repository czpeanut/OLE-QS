- id: doc_113_新北_土城_社會_g8s2e1_s1_61
  section: 1
  number: 61
  type: single
  page: 6
  stem: 61. 文中所提到孫中山兩次訪問泰國的契機，依時間判斷與何者有關？
  options:
  - label: A
    content: 國民黨發動二次革命失敗
  - label: B
    content: 段祺瑞毀棄臨時約法
  - label: C
    content: 希望透過革命推翻君主專制
  - label: D
    content: 阻止中國代表簽署巴黎和會條約
  group_stem: "【跨科題】 \n請閱讀下文，回答第61～63 題 \n孫中山曾在1924 年提出「大亞洲主義」，期望亞洲弱小民族獲得解放的大同理想，其中最關注的就是東南亞，越南更是重中之重；三民主義甚至被翻譯成越南文。孫中山在建國大綱之中甚至提到，越南是通往西方、印度洋的重要樞紐地區。三民主義思想也影響了越南國父胡志明，越南建國精神是：獨立、自由、幸福，對應三民主義的民族、民權和民生。\
    \ \n另外學者考證過去的文獻資料，孫中山也曾於1903及1908 年兩度訪問泰國，在清廷外交施壓與各方阻礙中，團結了南洋的華僑力量、有力推動了同盟會革命工作，也極大促進了現代革命進步思想在南洋的傳播。\
    \ \n孫中山曾經說過「華僑乃革命之母」，位於馬來亞吉隆坡的「中國同盟會南洋總支部」，就是當時孫中山在馬來亞的革命基地。孫中山在革命的路程上，一共去過馬來西亞6\
    \ 次，如果說越南是孫學和大亞洲主義重要的支點國家，那馬來西亞就是孫學和大亞洲主義的搖籃國家，在這裡辦過一場又一場的演說和理論發表。 \n由於馬來西亞華人眾多，當年同盟會在馬來西亞的運作偏向「吸收黨員、為我所用」，身為東南亞華人數量最多的國家，被孫中山視為重要的革命避居地，同時為了拓展能見度和工作進度，新加坡、吉隆坡、檳榔嶼(現今的檳城)成立分會，孫中山及其同盟會對馬來西亞經營之深，獲得許多檳城商賈的認同和資助。華僑對孫中山理念的支持，讓臺灣至今仍是馬來西亞境外留學的第二大國（僅次於澳洲）。"
