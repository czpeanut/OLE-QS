  - label: D
    content: 袁世凱因此事受到清廷重用
  group_stem: "二、 題組一：請閱讀下文，回答第14～16 題 \n(節錄自林覺民，與妻訣別書)  \n(原文段落) \n吾居九泉之下，遙聞汝哭聲，當哭相和也。吾平日不信有鬼，今則又望其真有；今人又言心電感應有道，吾亦望其言是實。則吾之死，吾靈尚依依汝旁也，汝不必以無侶悲！…\
    \ \n(大意) \n我在九泉之下，遠遠地聽到妳哭泣的聲音，我也會一起哭的。我平生不信鬼怪之說，但現在又希望真的有這麼一回事。現代人不是說心電感應嗎？我也希望這種說法是真的；這樣我死了以後，我的靈魂還能夠常常陪伴著妳，妳也不必因為沒有伴侶而悲傷啊！…\
    \ \n西元1911 年（宣統三年三月二十九日），革命首領黃興領導敢死隊百名，衝進兩廣總督府，但因政府已事先獲知革命份子的計畫而有佈署準備，導致革命黨人死傷甚多，24\
    \ 歲的林覺民也從容就義。留下這封給妻子陳意映的訣別信。"
  tags:
