  type: single
  page: 6
  stem: 64. 鄭毓秀在撰寫《民法》的文章中提到：「未婚單身女性有權簽訂或廢止婚約，也可以個人名義持有或讓渡其個人資產或房地產。」請問：下列哪個人最可與上述內容有相同的行為能力？
  options:
  - label: A
    content: 遭到褫奪公權的受刑人阿文
  - label: B
    content: 受到法院監護宣告的阿明
  - label: C
    content: 因車禍意外暫時休學的高中生阿成
  - label: D
    content: 尚未就讀幼稚園的阿龍
  group_stem: "請閱讀下文，回答第64～65 題 \n鄭毓秀，廣東省新安縣西鄉鄉屋下村（今為深圳市寶安區西鄉街道樂群村）人，出身書香門第，父親是清朝戶部官僚鄭文治。鄭毓秀幼年研讀四書五經，後來到天津市的教會學校念書後赴日求學，期間加入中國同盟會，參與多項革命行動。\
    \ \n1912 年她前往法國留學，於1917 年和1925 年先後獲得巴黎大學碩士與博士學位，據說1919 年，曾經組織留學生要求中國拒絕巴黎和會上簽字。她目前有確切資料可查目前有確切資料可查的中國歷史上第一位女性博士、第一位女性律師、第一位省級女性政務官及地方法院女性院長與審檢兩廳廳長。\
    \ \n1928 年，她被選為五位民法編纂委員中唯一的女\n性，在起草中華民國民法草案時特別提出增加多條女性權利保護條文，保障女性在公民權與財產權諸多方面的平等。在鄭毓秀女士撰寫的文章中提到：「根據這部《民法》女性與男性均享有行使法律之能力─享有權利，並盡義務。未婚單身女性有權簽訂或廢止婚約；以個人名義持有或讓渡其個人資產或房地產；可擔任其他人的代理人；可以繼承人或遺產受贈人的身分享有繼承權。已婚女性可與丈夫取得共識，具有保留原本姓氏，不需要冠夫姓的權利。」\
    \ \n1947 年她被選為立法院立法委員，其夫魏道明任台灣省主席，後來隨夫定居台灣，1959 年病逝於洛杉磯，結束她傳奇的一生。"
