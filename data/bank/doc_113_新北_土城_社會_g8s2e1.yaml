  group_stem: "題組二：請閱讀下文，回答第58～60 題 \n日前發生房東與房客的糾紛案件，某房東利用大學生房客的不知情或不了解法律，巧立各種名目扣錢。如簽約時的合約上明寫「免費供應有線電視台」與「租金已包含水電費」的內容，待大學生入住後，房東卻要求其必須額外付2000\
    \ 元裝機上盒才能看電視，並以超過用電量的預期為由，要求大學生自行另繳電費。而該名大學生在與房東多次反映無果後，因一時氣憤難平，將該房內的所有線路剪斷並砸毀電視，最終雙方鬧上法，互相控告對方。"
