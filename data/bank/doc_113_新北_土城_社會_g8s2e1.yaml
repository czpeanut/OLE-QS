- id: doc_113_新北_土城_社會_g8s2e1_s1_32
  section: 1
  number: 32
  type: single
  page: 3
  stem: 32. 棕櫚油有著悠久使用歷史，是一種來自油棕植物的果實，它的果肉與核仁都可榨取、提煉出豐富的油脂，且其用途相當多元。除了最常見的料理用食用棕櫚油，其它如洗髮精、沐浴乳、口紅、化妝品、麵包、巧克力，加上各式家庭用清潔劑、工業用潤滑油等，統統都有棕櫚油的成分。由於經濟價值高、利潤豐沛，加上全球的廣泛需求和進口量，使得油棕成了非常受農民歡迎的作物，目前兩個全球最大的棕櫚油出產國為印尼和馬來西亞，為了追求更大的利潤，商人將當地的天然植被砍伐，清出來的空間以利油棕種植，此舉不僅大幅改變了當地生態系、讓紅毛猩猩的棲地消失，甚至原住民的生活也大受威脅。請問:油棕樹最適合生長的地區，其氣候類型與下列哪一張氣候圖相符？
