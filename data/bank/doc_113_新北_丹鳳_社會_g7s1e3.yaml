  group_stem: ●以下為某臺灣籍清朝官員的一篇文章：「台灣的人心所以變得如此之壞，乃是從族群的分類開始．．．台灣本來就是各個地方的人雜處在一起，．．．把福建人、廣東人分類，也有人把漳州人、泉州人分類。分類福建人、廣東人的原因是他們來自不同省籍；分類漳州人、泉州人的原因是他們來自不同的府治。．．．然而大家同樣都是從大陸移民來到台灣，就同樣是台灣人了。同樣是一個台灣府治的人民，就像是一個家庭裡的兄弟，算是至親，竟然能同室操戈，村莊市鎮大半變成廢墟。．．．不分親疏，一樣看待，如此一來，內無憂患，外禍不來．．．。」
