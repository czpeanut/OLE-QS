  stem: 80 餘年前，臺灣大學校園大部分的區域都是阡陌稻田，清朝時期修建的水圳流經現在的校園，隨著校地整建，圳道被填平或加蓋。近年來，校方積極推動復育計畫，讓水圳從回憶變成浪漫的校園景觀。請問這一度消失的水圳是下列哪一個？
  options:
  - label: A
    content: 曹公圳
  - label: B
    content: 貓霧捒圳
  - label: C
    content: 瑠公圳
  - label: D
    content: 八堡圳。
- id: doc_113_新北_丹鳳_社會_g7s1e3_s1_19
  section: 1
  number: 19
  type: single
  page: 1
  stem: 臺灣由荒島變為良田，這個改變主要是漢人拓墾的結果。十八世紀以後，渡海來臺的移民日多，移民取得土地的辦法不包含下列哪一個方式？
  options:
  - label: A
    content: 向政府申請墾照，開墾無人耕種的荒地
  - label: B
    content: 與原住民訂立合約，開墾原住民所有的荒埔
  - label: C
    content: 越過「番界」，明爭暗奪原住民土地
  - label: D
    content: 收購政府拍賣的土地。
- id: doc_113_新北_丹鳳_社會_g7s1e3_s1_20
  section: 1
  number: 20
  type: single
  page: 1
  stem: 季英英穿越時空，來到18 世紀的鹿港。漫步長達三里的大街，舟車輻輳，百貨充盈。商號達三百餘家，資產算十萬者達百家。她所見到的商號應該會加入下列哪一個商業組織？
  options:
  - label: A
    content: 怡記洋行
  - label: B
    content: 桂格食品股份有限公司
  - label: C
    content: 美樹食品株式會社
  - label: D
    content: 泉郊金長順。
- id: doc_113_新北_丹鳳_社會_g7s1e3_s1_21
  section: 1
  number: 21
  type: single
  page: 1
  stem: '資料一：一顆在衣櫃或浴廁角落散發著奇特氣味、毫不起眼的白色球體。

    資料二：此物讓臺灣登上名符其實的「世界第一」。

    資料三：英國領事曾派出兩艘軍艦砲轟、佔領安平港，造成清軍多人死傷，並控制安平將近兩個月。

    根據以上資料，此物是指下列哪一個？'
  options:
  - label: A
    content: 茶葉
  - label: B
    content: 蔗糖
  - label: C
    content: 樟腦
  - label: D
    content: 稻米。
- id: doc_113_新北_丹鳳_社會_g7s1e3_s1_22
  section: 1
  number: 22
  type: single
  page: 1
  stem: 歡慶臺北建城140 週年，臺北市政府推出相關系列的導覽活動、攝影工作坊、主題講座與傳統工藝體驗，讓民眾進一步認識臺北發展歷史。想要了解19 世紀中葉北臺灣的經濟發展盛況，應該可以參加下列哪一個導覽活動？
  options:
  - label: A
    content: 找茶、品茶踏查
  - label: B
    content: 鐵道風華記
  - label: C
    content: 神社秘境探訪
  - label: D
    content: 百年廟宇巡禮。
- id: doc_113_新北_丹鳳_社會_g7s1e3_s1_23
  section: 1
  number: 23
  type: single
  page: 1
  stem: 「嘉慶君遊臺灣」是流傳民間已久的傳奇故事，然而根據文獻，這位清朝皇帝從未來臺，但是他在位期間，清廷對臺灣的政治制度與社會掌握進行諸多調整。皇帝曾御書文廟匾額，題曰「聖集大成」，命各省府州縣學宮懸掛。此項諭令，也及於臺灣，於是臺南孔廟內就有了這匾額。這項「建設」應該是影響了臺灣下列哪一方面的發展？
  options:
  - label: A
    content: 重視文教推廣
  - label: B
    content: 族群衝突調解
  - label: C
    content: 行政區域調整
  - label: D
    content: 崇祀國殤英靈。
- id: doc_113_新北_丹鳳_社會_g7s1e3_s1_24
  section: 1
  number: 24
  type: single
  page: 1
  stem: 每年四月五日清明祭祖，子孫們思親掃墓緬懷先祖，著實是家族的大事。號稱全台規模最大的桃園新屋葉氏家族，枝繁葉茂的子孫們在「葉五美公祠」祭拜的對象就是葉氏來台第一代的祖先。這樣的宗族組織屬於下列哪一種？
  options:
  - label: A
    content: 唐山祖
  - label: B
    content: 開台祖
  - label: C
    content: 天公祖
  - label: D
    content: 阿立祖。
- id: doc_113_新北_丹鳳_社會_g7s1e3_s1_25
  section: 1
  number: 25
  type: single
  page: 1
  stem: 花蓮縣豐濱鄉公所於西元2014 年在靜浦國小校區內（古戰場處），設置大港口（Cepo’）事件紀念碑。設置紀念碑的意義，下列哪一個不存在？
  options:
  - label: A
    content: 提醒原住民族人記得這裡曾經歷死亡和破壞
  - label: B
    content: 提供一個觀光旅遊景點
  - label: C
    content: 藉追思傷痛記憶，建構過去與未來的連接點
  - label: D
    content: 給予原住民族後人有重新詮釋、判斷與理解的機會。
- id: doc_113_新北_丹鳳_社會_g7s1e3_s1_26
  section: 1
  number: 26
  type: single
  page: 1
  stem: 居於現住今台中、彰化一帶的道卡斯族人，翻開清朝統治期間的歷史，應該會看見他的祖先猫老尉，面臨下列哪些處境？(甲)清廷官吏指派勞役(乙)歸順清廷賜漢姓(丙)女性族人與漢人男性通婚(丁)部落受壓迫，被迫遷徙(戊)族人土地權受到保障
  options:
