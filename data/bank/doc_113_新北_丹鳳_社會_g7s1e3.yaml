  section: 1
  number: 27
  type: single
  page: 1
  stem: 平均50 公尺就有一座廟，新北眾神之所在：新莊廟街，除了讓地區居民的信仰有所寄託，也成為台灣重要的文化資產。這些廟宇供奉的神明應該包含下列哪些？(甲)媽祖(乙)關聖帝君(丙)土地公(丁)阿拉(戊)三山國王
  options:
