  options:
  - label: A
    content: 空山新雨後，天氣晚來秋。明月松間照，清泉石上流。竹喧歸浣女，蓮動下漁舟。隨意春芳歇，王孫自可留
  - label: B
    content: 至若春和景明，波瀾不驚，上下天光，一碧萬頃；沙鷗翔集，錦鱗游泳，岸芷汀蘭，郁郁青青
  - label: C
    content: 霧凇沆碭，天與雲與山與水，上下一白。湖上影子，惟長堤一痕、湖心亭一點、與余舟一芥、舟中人兩三粒而已
  - label: D
    content: 只見許多異草：或有牽藤的，或有引蔓的，或垂山巔，或穿石隙，味芬氣馥，非花香之可比
