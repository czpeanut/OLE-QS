  stem: 甲是行政院環保署所提供的空氣品質指標(AQI)與活動建議，依據表中所提供的資料判斷，下列何者敘述錯誤？
  options:
  - label: A
    content: 空氣品質的相關指標，數值愈高的則代表當天空氣愈差
  - label: B
    content: 顏色顯示為綠色和黃色時，代表所有族群都可以外出活動
  - label: C
    content: 空氣品質的好壞對身體有不適症狀的人，影響會更為明顯
  - label: D
    content: 當AQI指標＞100，學生皆應禁止戶外活動，將課程調整至室內進行
  group_stem: "甲、\n| 空氣品質指標(AQI) | 對健康影響與活動建議 | 狀態色塊 | 一般民眾活動建議 |\n| :--- | :--- |\
    \ :--- | :--- |\n| 0~50 | 良好 | 綠 | 正常戶外活動 |\n| 51~100 | 普通 | 黃 | 正常戶外活動 |\n| 101~150\
    \ | 對敏感族群不健康 | 橘 | 1. 一般民眾如果有不適，如眼痛、咳嗽或喉嚨痛等，應該考慮減少戶外活動<br>2. 學生仍可進行戶外活動，但建議減少長時間劇烈活動\
    \ |\n| 151~200 | 對所有族群不健康 | 紅 | 1. 一般民眾如果有不適，如眼痛、咳嗽或喉嚨痛等，應減少體力消耗，特別是減少戶外活動<br>2.\
    \ 學生應避免長時間劇烈活動，進行其他戶外活動時應增加休息時間 |\n| 201~300 | 非常不健康 | 紫 | 1. 一般民眾應減少戶外活動<br>2.\
    \ 學生應立即停止戶外活動，並將課程調整至室內進行 |\n| 301~500 | 危害 | 褐紅 | 1. 一般民眾應避免戶外活動，室內應緊閉門窗，必要外出應配戴口罩等防護用具<br>2.\
    \ 學生應立即停止戶外活動，並將課程調整至室內進行 |\n\n乙、（中央社記者楊淑閔 4 月12 日報導）\n    環境部空氣品質監測網顯示，今天環境風場為東南風至偏南風，西半部水平擴散條件差，汙染物易累積，預測中部、雲嘉南、高屏空氣品質為對敏感族群不健康的橘色提醒等級。\n\
    \    環境部指出，依監測資料及氣象署12 日上午10 時氣象資料顯示，今天環境風場為東南風至偏南風，西半部水平擴散條件差，汙染物易累積，午後受光化作用影響，臭氧濃度易上升；金門及馬祖易有局部霧或低雲影響能見度。\n\
    \    根據以上資訊，環境部預測，花東空氣品質擴散影響區為良好等級；臺北、竹苗、宜蘭空品區及離島的馬祖、金門、澎湖為普通等級；中部、雲嘉南、高屏空品區為橘色提醒等級。\n\
    \    後續2 天假日，13 日環境風場為東南風至偏南風，西半部水平擴散條件差，環境部預測，中南部零星地區短時間可能達橘色提醒等級。14 日環境風場轉為西南風，北部位於下風處，汙染物稍易累積，目前預測全臺都是良好或普通等級。"
