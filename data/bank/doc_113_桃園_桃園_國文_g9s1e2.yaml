    content: 因為歐普拉口才極佳、反應靈敏，能成功地提升節目收視率
  group_stem: "歐普拉並非訪談節目的開創者，但卻是她為訪談節目注入「親密交流」的靈魂。歐普拉的巨大感召力，來自於她的真實而不是喜怒不形於色，她與受訪者之間建立起深刻的互信，進而創建了一個她和受訪者敞開心扉、互相交流和共用人生經驗的平台。\n\
    \    歐普拉深諳電視媒體「掌握收視率就是贏家」之道。她常說：「我要的，就是贏！」她在節目中談暴力、談同性戀、談傷痛之事、談受害者如何面對事實，並且走出創傷。二十五年來，談到揭人隱私，沒人比她更在行。她在節目曾讓無數世界級名流揭露他們的愛恨情仇，透露他們深藏內心的惡魔。\n\
    \    歐普拉更深刻的貢獻在於透過「歐普拉‧溫佛瑞秀」，在自我的真誠投入中，與觀眾重建了日常生活的公共空間，使孤獨的個人生活獲得了親密交流的公共性。\n\
    \    大多數訪談節目中，主持人和來賓的界線都非常分明，更像是採訪而不是交談，我提問、你回答，有很大的距離感。歐普拉則把每一位來賓都當成深夜談心的朋友。當一位女士述說自己被親人性騷擾的經歷時，歐普拉靠在對方的肩膀上哭泣了，這樣的場面怎麼能不讓觀眾感動呢？多年以來，歐普拉一直以單刀直入的尖銳訪問和真心誠摯的同情心贏取觀眾的心。\n\
    \    現代社會人與人之間的情感距離越來越遠，冷淡、孤獨的感覺不斷襲來，人們需要的是朋友的問候和關愛，渴望促膝長談。歐普拉的「親密交談」正滿足了人們內心的這種需要，喚起人們心中溫暖和細膩的情感，才能獲得巨大的成功。\n\
    \                               ——我是歐普拉：從貧民到百億天后的關鍵信念 汪仟霖"
