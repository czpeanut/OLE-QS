  stem: 東坡居士既然「極不惜書」，面對乞書者卻「正色詰責之，或終不與一字」的原因為何？
  options:
  - label: A
    content: 書法創作是發自真性情，非刻意為人書寫
  - label: B
    content: 東坡乃隨興之人，開心時不惜墨寶，不開心時惜字如金
  - label: C
    content: 乞書者誠意不夠，應用重金購買東坡作品
  - label: D
    content: 希望有心學書法者能自成一格，勿臨摹東坡作品
  group_stem: "東坡居士極不惜書，然不可乞。有乞書者，正色詰責之，或終不與一字。元祐中，鎖試① 禮部，每來見過，案上紙不擇精粗，書遍乃已。性喜酒，然不能四五龠②\
    \ 已爛醉，不辭謝而就卧，鼻鼾如雷，少焉蘇醒，落筆如風雨，雖謔弄皆有義味，真神仙中人，此豈與今世翰墨之士爭衡哉？\n    東坡簡札，字形溫潤，無一點俗氣。今世號能書者數家，雖規摹古人，自有長處，至於天然自工，筆圓而韻勝，所謂兼四子之有以易之，不與也。\
    \                              ——題東坡字後 黃庭堅\n【注釋】① 鎖試：宋代稱有爵祿者\n         ② 龠：ㄩㄝˋ，量詞，古代計算容積的單位"
