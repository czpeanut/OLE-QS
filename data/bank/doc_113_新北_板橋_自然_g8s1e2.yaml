- id: doc_113_新北_板橋_自然_g8s1e2_s2_9
  section: 2
  number: 9
  type: single
  page: 1
  stem: 古人會使用一種稱為「陽燧」的器物來取火，它是以銅、錫鑄造而成的工具，一面為凹面，另一面為凸面，其出土的文物如圖所示。使用時將其中一面對準太陽，持少量乾草置於靠近此面的某個位置，一段時間後便可引燃乾草。關於「陽燧」引燃乾草取火的科學原理，下列敘述何者最合理？
  options:
  - label: A
    content: 利用凸面面對太陽，使陽光因反射而會聚
