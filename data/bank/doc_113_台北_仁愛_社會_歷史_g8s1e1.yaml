questions:
- id: doc_113_台北_仁愛_社會_歷史_g8s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 有關「商朝」的敘述，下列何者有誤？
  options:
  - label: A
    content: 學者在「殷墟」的考古現場，挖掘出宮殿遺址，可知商朝已有國家組織
  - label: B
    content: 商朝起源於長江流域，顯示古中國的發展由南而北
  - label: C
    content: 商朝距今三千多年，早於周朝
  - label: D
    content: 商朝有文字─甲骨文，顯示他們已進入歷史時期
- id: doc_113_台北_仁愛_社會_歷史_g8s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 小明正在籌備一部「春秋戰國時期」的電影，以下哪個場景不能放入電影中？
  options:
  - label: A
    content: 有人正在製作帝王的隨葬品─兵馬俑
  - label: B
    content: 封建制度瓦解，部分貴族沒落
  - label: C
    content: 各國關係緊張，征戰與兼併層出不窮
  - label: D
    content: 某人雖是平民，卻因其才華而受到國君的重用
- id: doc_113_台北_仁愛_社會_歷史_g8s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 有關「商鞅變法」，我們可以作何解讀？
  options:
  - label: A
    content: 變法的核心是廢郡縣，行封建
  - label: B
    content: 商鞅變法奠定了秦國富強的基礎，秦始皇因而得以結束西周時期
  - label: C
    content: 商鞅變法將國家改造成中央集權的帝國
  - label: D
    content: 商鞅編列戶籍，使得貴族地位更加穩固
- id: doc_113_台北_仁愛_社會_歷史_g8s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 秦漢時期，實施郡縣制度，全國分為數十個行政區，地方長官分別為郡守與縣令。請問，有關郡縣制度，我們可以作何解讀？
  options:
  - label: A
    content: 實施此制度達到了中央集權的效果
  - label: B
    content: 郡守與縣令身分世襲，父死後由兒子繼承其位
  - label: C
    content: 秦始皇要求地方官推舉孝廉，選任他們作為地方官員
  - label: D
    content: 郡守與縣長由世族把持，社會階層缺乏流動
- id: doc_113_台北_仁愛_社會_歷史_g8s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 「評定人品的高下是依據權勢為基準，比起個人才華，官員們更看重的是出身背景與權勢」請問，以上是哪一選才制度的流弊？
  options:
  - label: A
    content: 察舉制度
  - label: B
    content: 九品官人法
  - label: C
    content: 科舉考試
  - label: D
    content: 宗法制度
- id: doc_113_台北_仁愛_社會_歷史_g8s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 課堂上，老師請同學針對「上品無寒門，下品無世族」此一社會現象進行討問，何者的說明正確？
  options:
  - label: A
    content: 甲：此現象出現於東漢時期
  - label: B
    content: 乙：九品官人法的實施導致此弊端的出現
  - label: C
    content: 丙：「世族」等同於「貴族」，指的是皇帝的親戚
  - label: D
    content: 丁：此制度跟封建制度有關，天下之人分為世族、平民、奴隸三個等級
- id: doc_113_台北_仁愛_社會_歷史_g8s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 歷史上某一時期，政府官員的職務由「少數人把持」轉變為「提拔布衣」，國君盡可能的網羅人才。請問，以上這可能是哪個時期的變化？
  options:
  - label: A
    content: 從西周到東周
  - label: B
    content: 從秦朝到漢朝
  - label: C
    content: 從東漢到三國
  - label: D
    content: 從魏晉到隋唐
- id: doc_113_台北_仁愛_社會_歷史_g8s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 「佛教在『甲』時傳入中國，只是當時的佛教徒相當有限……直到『乙』時，社會動盪、戰亂不止，人們尋求精神的慰藉，佛教開始盛行……『丙』時，有僧侶遠至天竺(印度)取經，回國後接著主持譯經工作，此舉拓展了佛教徒的人數與階層……」依據所學，「甲、乙、丙」分別應填入哪些朝代？
  options:
  - label: A
    content: 秦朝、東漢、隋朝
  - label: B
    content: 西漢、魏晉南北朝、唐朝
  - label: C
    content: 東漢、魏晉南北朝、唐朝
  - label: D
    content: 西周、東漢、隋朝
- id: doc_113_台北_仁愛_社會_歷史_g8s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 清代史家趙翼在其著作《廿二史劄記》中，有以下的記載：「自※※擊匈奴，通西域，塞外諸國(註：西域國家)，無不懾漢威，是時漢之兵力實強。」請問，有關「※※」這位君主的敘述何者有誤？
  options:
  - label: A
    content: 要求官員推舉孝廉
  - label: B
    content: 派張騫出使西域
  - label: C
    content: 開通西域而獲得天可汗稱號
  - label: D
    content: 在首都長安設立太學
- id: doc_113_台北_仁愛_社會_歷史_g8s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 「中國邊境胡漢雜處，二者風俗不同，胡人經常遭受歧視…胡人領袖攻陷首都，擄走皇帝，諸王與外族混戰不止，百姓們生活困苦…」請問，上述事件導致了哪一朝代的滅亡？
  options:
  - label: A
    content: 東漢
  - label: B
    content: 西晉
  - label: C
    content: 東晉
  - label: D
    content: 曹魏
- id: doc_113_台北_仁愛_社會_歷史_g8s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 北魏孝文帝的漢化政策，引發部分鮮卑人的不滿，最終導致了北魏的分裂。然而，漢化政策產生了何種影響？
  options:
  - label: A
    content: 南方開發
  - label: B
    content: 文化融合
  - label: C
    content: 文字統一
  - label: D
    content: 佛教傳播
- id: doc_113_台北_仁愛_社會_歷史_g8s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 「戰爭導致許多人死亡，社會上出現了大量的荒田……倖存的農民逃離鄉村，流落於他鄉，戶籍資料因而失準，地方官無法順利推薦人才……」請問，上文是哪一制度實施的背景？
  options:
  - label: A
    content: 封建制度
  - label: B
    content: 科舉制度
  - label: C
    content: 察舉制度
  - label: D
    content: 九品官人法
- id: doc_113_台北_仁愛_社會_歷史_g8s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: (甲)西周；(乙)西漢；(丙)秦朝；(丁)東漢；(戊)西晉。請問，以上朝代有幾個亡於外族之手？
  options:
  - label: A
    content: '2'
  - label: B
    content: '3'
  - label: C
    content: '4'
  - label: D
    content: 5 個
- id: doc_113_台北_仁愛_社會_歷史_g8s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 某個朝代對胡人態度開放，許多胡人造訪其首都，從當時的作品「今夜聞君琵琶語，如聽仙樂耳暫明」、「漁陽鼙鼓動地來，驚破霓裳羽衣曲」亦可見得胡人文化、藝術充斥在當時的社會中。請問，這最可能是哪個朝代的社會現象？
  options:
  - label: A
    content: 西漢
  - label: B
    content: 東漢
  - label: C
    content: 西晉
  - label: D
    content: 唐朝
- id: doc_113_台北_仁愛_社會_歷史_g8s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 以下「外族及相關歷史事件」的配對，何者正確？
  options:
  - label: A
    content: 犬戎─造成西周滅亡
  - label: B
    content: 匈奴─秦始皇築長城即是為了抵擋他們
  - label: C
    content: 東突厥─唐太宗擊滅他們而得到天可汗的稱號
  - label: D
    content: 以上皆是
- id: doc_113_台北_仁愛_社會_歷史_g8s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 請問，「布衣卿相」的現象最早出現於何時？
  options:
  - label: A
    content: 西周
  - label: B
    content: 東周
  - label: C
    content: 秦漢
  - label: D
    content: 隋唐
- id: doc_113_台北_仁愛_社會_歷史_g8s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 某地曾向遣使向唐朝求親，唐太宗以文成公主和親，並贈送大量中國典籍、工藝品、茶葉，之後，此地與中國的交流日趨頻繁。請問，上文描述的為何地？
  options:
  - label: A
    content: 大秦
  - label: B
    content: 大食
  - label: C
    content: 吐蕃
  - label: D
    content: 新羅
- id: doc_113_台北_仁愛_社會_歷史_g8s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 西元 751 年，東西方兩大強權爆發衝突，伊斯蘭軍隊在怛羅斯擊敗唐朝軍隊，部分唐軍被俘。此戰造成的影響有二：其一，※※西傳；其二，中亞此後落入伊斯蘭帝國之手，天可汗體系面臨崩壞的危機。請問，※※為何？
  options:
  - label: A
    content: 指南針
  - label: B
    content: 火藥
  - label: C
    content: 造紙術
  - label: D
    content: 印刷術
- id: doc_113_台北_仁愛_社會_歷史_g8s1e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 阿富汗巴米揚峽谷內曾有兩尊「巴米揚大佛」，矗立於山谷內超過千年，玄奘當年前去印度取經途經此地，還曾將其見聞記錄在著作內。2001 年，塔利班政權不顧各界反對，將兩尊大佛炸毀，造成佛教史上的重大損失。請問，玄奘前去印度取經時，為哪一皇帝在位時期？
  options:
  - label: A
    content: 秦始皇
  - label: B
    content: 漢武帝
  - label: C
    content: 北魏孝文帝
  - label: D
    content: 唐太宗
- id: doc_113_台北_仁愛_社會_歷史_g8s1e1_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 漢朝時，皇帝曾遣使聯絡西域國家共同對抗匈奴，使節團的外交行動對後世有何影響？
  options:
  - label: A
    content: 成功與西域國家共同擊敗匈奴，匈奴從此銷聲匿跡
  - label: B
    content: 西域與中國之間有了交流，無數商人往來於絲路
  - label: C
    content: 使節團遭俘虜，造成中國的造紙術西傳
  - label: D
    content: 匈奴不滿漢朝軍事行動，而攻陷漢朝首都、擄走皇帝
- id: doc_113_台北_仁愛_社會_歷史_g8s1e1_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 魏晉南北朝時期，戰爭頻傳、佛教盛行，人們花費時間、經歷建造與佛教有關的建築、石窟藝術。請問，下列何者不是魏晉南北朝時期的佛教石窟？
  options:
  - label: A
    content: 莫高窟
  - label: B
    content: 馬璘窟
  - label: C
    content: 雲岡石窟
  - label: D
    content: 龍門石窟
- id: doc_113_台北_仁愛_社會_歷史_g8s1e1_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 秦始皇歷時數年，統一天下，以皇帝自居，風光一時。然而，他的一系列暴政也為秦朝的滅亡埋下伏筆。請問，以下何者不是秦始皇的舉措？
  options:
  - label: A
    content: 統一文字、貨幣
  - label: B
    content: 焚書坑儒、統一思想
  - label: C
    content: 刑罰殘酷、賦役繁重
  - label: D
    content: 種族歧視、打壓胡人
- id: doc_113_台北_仁愛_社會_歷史_g8s1e1_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: 京都舊名平安京、奈良舊名平城京，兩座城市均為仿唐建築，街道工整、呈棋盤狀。請問，這兩座城市是模仿哪座城市建成的？
  options:
  - label: A
    content: 南京
  - label: B
    content: 洛陽
  - label: C
    content: 鎬京
  - label: D
    content: 長安
- id: doc_113_台北_仁愛_社會_歷史_g8s1e1_s1_24
  section: 1
  number: 24
  type: single
  page: 2
  stem: 古代中國以北方為重，政治、經濟重心均在北方；然而，某事件後，北方長期戰亂，使得許多人遷往南方居住，各類資源與生產工具亦隨之南遷，此事可視為中國史上首次的經濟南移。請問，首次經濟重心南遷關鍵為何？
  options:
  - label: A
    content: 焚書坑儒
  - label: B
    content: 封建瓦解
  - label: C
    content: 永嘉之禍
  - label: D
    content: 商鞅變法
- id: doc_113_台北_仁愛_社會_歷史_g8s1e1_s1_25
  section: 1
  number: 25
  type: single
  page: 2
  stem: 歷史上某時期，國君要求國人更改姓氏，例如皇室成員的「拓拔」姓就改為「元」。請問，宣布此政策的國君為哪一族人？
  options:
  - label: A
    content: 匈奴
  - label: B
    content: 犬戎
  - label: C
    content: 鮮卑
  - label: D
    content: 東突厥
- id: doc_113_台北_仁愛_社會_歷史_g8s1e1_s1_26
  section: 1
  number: 26
  type: single
  page: 2
  stem: 王綰：「各諸侯國才剛攻滅，應重新分封諸子到僻遠之地，讓諸王鎮守當地」李斯：「分封同姓諸侯的問題是隨時間日久，後代子孫關係疏遠，如同仇敵般相互攻擊」請問，二人的辯論，秦始皇最終採納了誰的意見？
  options:
  - label: A
    content: 王綰，行封建
  - label: B
    content: 王綰，行郡縣
  - label: C
    content: 李斯，行封建
  - label: D
    content: 李斯，行郡縣
- id: doc_113_台北_仁愛_社會_歷史_g8s1e1_s1_27
  section: 1
  number: 27
  type: single
  page: 2
  stem: 以下何者不屬於商鞅變法的內容？
  options:
  - label: A
    content: 政府編列戶籍
  - label: B
    content: 皇帝選任官員
  - label: C
    content: 法令規範人民
  - label: D
    content: 官員身分世襲
- id: doc_113_台北_仁愛_社會_歷史_g8s1e1_s1_28
  section: 1
  number: 28
  type: single
  page: 2
  stem: 在中國某個朝代中，官員將天下之人分成數等，以家世、才學、品德來品評人物，但由於官員的不公正，致使社會缺乏階層流動。請問，此制起於何時、終於何時？
  options:
  - label: A
    content: 秦─漢
  - label: B
    content: 東漢─三國
  - label: C
    content: 曹魏─隋
  - label: D
    content: 隋─唐
- id: doc_113_台北_仁愛_社會_歷史_g8s1e1_s1_29
  section: 1
  number: 29
  type: single
  page: 2
  stem: 中國史上某個朝代，胡漢融合、兼容並蓄，連皇帝都表示「自古皆貴中華，賤夷狄，朕獨愛之如一」。造成以上現象的原因不包含何者？
  options:
  - label: A
    content: 許多外族來中國求學、經商
  - label: B
    content: 此朝的君王擊滅北方外患，得到西域國家的愛戴
  - label: C
