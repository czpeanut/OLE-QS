  stem: '探討生活中的科學現象時，常可利用「科學方法」的步驟來得到結論。佳琳要研究渦蟲的行為，列出了甲、乙、丙、丁四個敘述，如附表所示。若以探討科學現象的步驟排列甲、乙、丙、丁，下列何者為正確順序？


