    | :--- | :--- | :--- | :--- | :--- |

    | 北韓 | 年可一獲 | 重工業為主 | 礦產資源少 | 大財團為主 |

    | 南韓 | 年可二獲 | 軍火工業 | 礦產資源多 | 國營企業盛 |'
  options:
