- id: doc_113_高雄_鼎金_自然_g8s2e1_s1_49
  section: 1
  number: 49
  type: single
  page: 6
  stem: 根據上文，請問氯系漂白劑通常在反應中扮演什麼角色？
  options:
  - label: A
    content: 催化劑
  - label: B
    content: 生成物
  - label: C
    content: 讓其他物質氧化
  - label: D
    content: 讓其他物質還原
  group_stem: "用錯使用方法，漂白劑也會出人命？\n2020 年12 月18 日泛科學網站 阿咏\n 漂白劑的種類依據在漂白過程擔任的角色來區分：若在反應裡擔任氧化劑者，稱為「氧化型漂白劑」；若擔任還原劑者，稱為「還原型漂白劑」。平時我們較常接觸到的是氧化型漂白劑，而氧化型漂白劑通常可以再分為兩類：氯系漂白劑與氧系漂白劑。\n\
    \ 氯系漂白劑含有次氯酸鈉（NaClO），溶在水中會解離成次氯酸離子（ClO–）和鈉離子（Na+），當次氯酸離子（ClO–）與水反應後，會轉變為弱酸性的次氯酸（HClO）。不過，漂白水的原液只含微量\
    \ HClO 分子，加水稀釋後 HClO 的比例會提高，此時才具有比較好的消毒殺菌效果。\n 加拿大多倫多大學 2019 年研究發現，當我們在室內環境使用氯系漂白劑時，容易釋放出氣態的次氯酸（HOCl）和氯氣（$Cl_{2}$），由於兩者都是強氧化劑，因此它們會和清潔劑中常見的揮發性有機化合物——檸檬烯（limonene）產生反應。在室內日光燈或陽光的照射下，檸檬烯會與次氯酸、氯氣發生反應，產生大量含氯顆粒，吸入身體後可能對肺功能或氣管造成負面影響。\n\
    \ 另外，次氯酸（HOCl）和氯氣（$Cl_{2}$）在光的照射下，很容易被分解為氫氧自由基及氯原子，它們也是強氧化劑，可以與許多室內揮發性有機化合物反應，產生氯化物，甚至有助於形成二級有機氣溶膠（SOA），也可能會危害人體的呼吸系統健康。"
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 理化
      code: 2-2
      title: 氧化與還原反應
      chapter: 第2章 氧化還原反應
    textbook: 八下理化 2-2 氧化與還原反應
    labeled_by: ai
