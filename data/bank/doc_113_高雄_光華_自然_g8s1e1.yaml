  section: 1
  number: 5
  type: single
  page: 1
  stem: 如圖(一)所示，民和想利用天平測量瓶裡水的質量，請問下列操作步驟中，何者錯誤？
  options:
  - label: A
    content: 使用前先調整校準螺絲，使天平兩邊保持水平
  - label: B
    content: 砝碼應由大至小放置，能較快達到平衡
  - label: C
    content: 當指針左右擺幅相同時，代表兩盤上的質量相等
  - label: D
    content: 當達成水平平衡時，將瓶子與砝碼互換位置，天平不會平衡。
