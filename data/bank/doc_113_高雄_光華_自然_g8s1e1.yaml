- id: doc_113_高雄_光華_自然_g8s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 關於酒精燈的使用方法，下列敘述何者正確？
  options:
  - label: A
    content: 可用已點燃的酒精燈引燃另一個酒精燈
  - label: B
    content: 若不小心打翻酒精燈導致起火燃燒，應盡速用嘴吹熄
  - label: C
    content: 可用燈罩蓋熄酒精燈
  - label: D
    content: 實驗前，須將酒精燈內的酒精完全加滿。
- id: doc_113_高雄_光華_自然_g8s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 實驗室常用儀器的名稱與用途配對，下列敘述何者錯誤?
  options:
  - label: A
    content: 坩堝鉗：外表與剪刀相似，耐高溫的金屬材質，常用來夾取加熱的品或器皿，避免燙傷
  - label: B
    content: 錐形瓶：瓶身多了一個側管，可用來收集反應後的氣體或蓋上附有橡皮塞的漏斗進行過濾
  - label: C
    content: 錶玻璃：常用來覆蓋在燒杯或蒸發皿上，避免液體蒸發，也可檢驗凝結在表面物質的性質
  - label: D
    content: 秤量紙：秤取固體物質的質量時，用來盛裝實驗藥品。
- id: doc_113_高雄_光華_自然_g8s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 臺灣積極推廣奈米產業，許多清潔用品運用了「奈米科技」，下列關於奈米的敘述何者正確？
  options:
  - label: A
    content: 奈米的縮寫為 $\mu$m
  - label: B
    content: 奈米的大小為百萬分之一毫米
  - label: C
    content: 奈米是測量面積的單位
  - label: D
    content: 一奈米等於一萬分之一微米。
