  section: 1
  number: 9
  type: single
  page: 1
  stem: 對於多次測量求得的平均值而言，下列敘述何者正確？
  options:
  - label: A
    content: 平均值通常較接近物體實際的測量值
  - label: B
    content: 平均值經過多次測量，因此不會有誤差
  - label: C
    content: 求平均值時，小數點後面保留的位數愈多愈好
