  stem: 日本漫畫《遊戲王》講述日本高中生武藤遊戲因破解古埃及神祕古董「千年積木」，意外與古埃及法老亞圖姆的靈魂相遇。後來，一起和伙伴們展開一系列的卡牌決鬥冒險。這部漫畫內容充滿濃厚的古埃及文化。請問：關於古埃及的文化成就，下列敘述何者有誤？
