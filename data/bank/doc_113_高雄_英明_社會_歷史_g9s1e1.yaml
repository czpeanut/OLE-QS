- id: doc_113_高雄_英明_社會_歷史_g9s1e1_s1_27
  section: 1
  number: 27
  type: single
  page: 1
  stem: 在2024年4月，埃及古文物部宣布，迎回一座有3400年歷史，刻畫古埃及法老王拉美西斯二世頭部的雕像，這座雕像據估是1980年代前被竊並走私運出埃及。近年來，埃及爲追回流失海外的文物，設立專責部門，追蹤全球文物經營網站；派駐世界各地的使館，也會留意所在地文物拍賣和轉讓活動。請問：下列何者並非「埃及古文明」的象徵？
  options:
  - label: A
    content: 木乃伊
  - label: B
    content: 象形文字
  - label: C
    content: 獅身人面像
  - label: D
    content: 阿育王石柱。
