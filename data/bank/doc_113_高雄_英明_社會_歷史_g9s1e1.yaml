  page: 1
  stem: 曾於明神宗萬曆年間來到中國的耶穌會傳教士利瑪竇為了傳播天主教，不僅積極學習中國的語言和知識，廣交中國官員和社會名流，還將西方的天文、數學、地理等知識帶入中國。因此，他曾和明朝官員徐光啟合力將希臘化時代的科學著作翻譯成漢文。請問：他所傳入並翻譯的著作，應為下列何者？
