  section: 1
  number: 28
  type: single
  page: 1
  stem: 立志要成為律師的小戴，在研讀法學史的過程中，看到古代歐洲曾有一個國家，曾在西元前450 年制定相當進步並完備的法律，不僅被視為歐陸法系的源頭之一，該國法律主張「一個人若未被證實及判決有罪，在審判上應推定為無罪」的概念，也顯示出其進步的法律精神。請問：小戴所研讀的內容，與下列哪一國家的法律有關？
