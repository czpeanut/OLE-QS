  number: 25
  type: single
  page: 1
  stem: 「他」被視為羅馬偉大的皇帝之一，在其任內運用其審慎的智慧統治羅馬，開啟了羅馬的盛世，史稱「羅馬和平」。由於「他」是在八月獲得元老院加封為「奧古斯都」，於是八月的英文後來也以「奧古斯都」命名。請問：上述的「他」是下列何人？
