- id: doc_113_高雄_英明_社會_歷史_g9s1e1_s1_34
  section: 1
  number: 34
  type: single
  page: 2
  stem: 在金庸武俠小說《倚天屠龍記》中，有個稱為「明教」的組織，主張懲惡揚善、度化世人，並認為光明的力量最終會戰勝黑暗的力量。但因為他們長期受到朝廷鎮壓，行事不免詭秘，被稱為「魔教」，並遭到武林六大門派圍剿。「明教」在中國的出現與西亞「某教派」的傳入有關。請問：下列敘述，何者是此教派的特色？
  options:
  - label: A
    content: 此教派源自於伊朗高原
  - label: B
    content: 主張信仰唯一真神阿拉
  - label: C
    content: 主張種姓制度鞏固政權
  - label: D
    content: 相信行善可以打破輪迴。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 歷史
