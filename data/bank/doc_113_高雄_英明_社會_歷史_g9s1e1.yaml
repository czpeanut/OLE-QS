  number: 26
  type: single
  page: 1
  stem: 歷經幾番波折，最終走在一起的小瑩與高野部長，打算出發到義大利，來一趟浪漫的蜜月旅行。兩人決定先在某座歷史古城落腳，參觀興建於西元一世紀，號稱可容納數萬名觀眾的圓形競技場，還有造訪戰神廣場的萬神殿及澡堂、劇場…等歷史遺跡。最後，前往著名的特雷維噴泉體驗投幣許願。請問：兩人打算前往的歷史古城是下列何者？
