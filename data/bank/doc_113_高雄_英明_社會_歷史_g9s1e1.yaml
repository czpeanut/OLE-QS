- id: doc_113_高雄_英明_社會_歷史_g9s1e1_s1_21
  section: 1
  number: 21
  type: single
  page: 1
  stem: 聽聞歌手周杰倫即將世界巡迴演唱會的小宇，開心地唱起周杰倫著名的歌曲「愛在西元前」：「我給你的愛寫在公元前，深埋在美索不達米亞平原，幾十個世紀後出土發現泥板上的字跡依然清晰可見，我給你的愛寫在公元前，深埋在美索不達米亞平原，用楔形文字刻下了永遠……」請問：歌詞中提到的楔形文字是下列哪一個族群所發明的？
  options:
  - label: A
    content: 蘇美人
  - label: B
    content: 巴比倫人
  - label: C
    content: 波斯人
  - label: D
    content: 希伯來人。
