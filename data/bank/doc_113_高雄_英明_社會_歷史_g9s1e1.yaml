- id: doc_113_高雄_英明_社會_歷史_g9s1e1_s1_30
  section: 1
  number: 30
  type: single
  page: 1
  stem: 阿育王是印度孔雀王朝第三代君主，在位初期被視為暴君，後來在征服他國過程中，目睹大量屠殺的場面，深感悔悟。後來，他虔誠信教，施行仁政，對貧民施捨，禁止無益的殺生，並透過和平方式實現國家的統一，締造古代印度歷史上強盛的時代。請問：下列何者是他任內的重要作為？
  options:
  - label: A
    content: 主張信仰「婆羅門教」，相信靈魂輪迴，藉此讓阿利安人歸順臣服
  - label: B
    content: 設立「種姓制度」，將人民分成不同階級進行統治，並且世代承襲
  - label: C
    content: 提倡「佛教」，並派遣高僧向外弘揚佛法，使佛教在亞洲廣為流傳
  - label: D
    content: 結合婆羅門教、佛教等宗教，形成印度信仰人口最多的「印度教」。
