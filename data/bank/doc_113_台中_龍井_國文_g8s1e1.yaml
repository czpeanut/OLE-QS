  group_stem: '俗語說：「十年樹木，百年樹人」，植樹栽花富有教育子女的功效，斯言誠然。回憶去年炎夏，在熱辣辣的天氣中，溽暑難熬，舍間客小偶而假日出遊外，大半休閒時刻皆涉足於花園散步花草。自從母親把孩子們帶入園藝生活後，已有「種瓜得瓜，種豆得豆」的效果，孩子們樂於跟進跟出，喜愛玩弄花草，在參與中，多少熟識花木瓜果的生長過程和澆水除草的培養常識。曉得花木栽培需要大家分工合作，更領略了「團結合約」的真義。至於享受花開時的喜悅，摘食果實的暢懷，那種逸興遄飛的神情，更教育了小小心靈上得到耕耘的可貴和收成的滿足。在受花開時的喜悅，摘食果實的暢懷，那種逸興遄飛的神情，更教育了小小心靈上得到耕耘的可貴和收成的滿足。在默默的身教下，也培養了孩子們的愛心和耐心。另有人認為「花令人雅，瓜供人食」，或風雅，或食用，都是孩子們幼小心靈中不可或缺的材料，這豈是課本上、故事書中所可取代！

    我曾為「落花黯然」而觸動前塵往事，也曾為「新葉迎春」而滿足新居。有時，由「一抹新綠」而雀躍著它將帶來給我清靜優雅的感受，遠勝追求世風日下的物質享受。

    愛惜花木是一種美好的情操，可變化個人氣質，因為在花境中生活的人，心緒自然平衡而高雅。可惜，又有幾人能做到「惜花春早起，愛月夜眠遲」呢？

    （銘實造園記趣）'
