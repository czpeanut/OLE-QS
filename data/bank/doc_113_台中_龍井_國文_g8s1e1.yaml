- id: doc_113_台中_龍井_國文_g8s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 「雨天可估在於以雨天為苦，做不到本來想做的事，唯有天晴才會活得有勁，天晴才是絕對的好。可怕的在於把陰晴圖畫清景線，好壞二元對立，把希望投資在晴天當中。凡事往好處想，不是雨時想著晴天的好，並守候晴天來臨；而是懂得了雨天有雨天的必然性，體會到陰與缺的好處，這才是生命。」（林夕毫無代價唱最幸福的歌）上述文句的涵義與下列何者最相近？
