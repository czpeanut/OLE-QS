- id: doc_113_台中_龍井_國文_g8s1e1_s2_49
  section: 2
  number: 49
  type: single
  page: 3
  stem: 文中「不再青春的皺紋」指的是什麼？
  options:
  - label: A
    content: 母親年輕時的皺紋少
  - label: B
    content: 青春的臉龐不可能有皺紋
  - label: C
    content: 母親年紀已長，臉上布著皺紋
  - label: D
    content: 年輕人懂看青春稍縱即逝。
  group_stem: '小時候，母親是一扇不透明的玻璃，我的笑與哭都印在她臉上，母親不再青春的皺紋換來我的茁壯、成長。可是，她永遠為我想，說我「是個長不大的孩子」。

    母親一雙不知勞累的手，總是把最甜的給我，最苦的留給自己。多少個夜晚，她引頸眺望著我歸來，端上熱騰騰的關懷說：「你該睡了。」

    離家在外的時刻，總會憶起母親烹煮一道道好吃的菜肴，任何山珍海味的色香氣味都抵不過她親手換來溫暖的菜香，因為母親的菜香裡有分名廚也自嘆不如的愛。

    逞音愈遠，我的思念愈深，揮走歲月，揮不走康乃馨的思念，在一路攀自學中的聲音裡，永遠祈求著，祈求上蒼帶上我無言的祝福，我願把心中的康乃馨恆吻著母親的臉頰。

    （母親）'
