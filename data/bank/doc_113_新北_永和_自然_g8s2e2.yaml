    試問在 25℃下，固定體積之密閉系統中的化學反應已達成平衡，其反應式為：$2\mathrm{NO_{2} \rightleftharpoons N_{2}O_{4}}+$熱量，關於四氧化二氮與二氧化氮之化學平衡，正確的答案為何？'
