- id: doc_113_新北_永和_自然_g8s2e2_s1_50
  section: 1
  number: 50
  type: single
  page: 4
  stem: '人體吸入氧氣後，氧氣會由血液中的紅血球負責攜帶，並經由血液循環運送至組織細胞。這是因為紅血球中的血紅素能與氧氣結合，形成「氧合血紅素」，藉此攜帶氧氣；而「氧合血紅素」也能發生還原反應，形成血紅素與氧氣，藉此釋出氧氣，以供給組織。其反應過程如右：血紅素
    ＋ 氧氣 $\rightleftharpoons$ 氧合血紅素


    此外，由於高海拔地區的氧氣含量，會隨著海拔高度的上升而減少。例如在高山環境中，人體會為了讓組織細胞獲得足夠的氧氣，而頻頻喘氣增加呼吸頻率，使進入體內的氧氣量增加，以提高氧合血紅素的比例。如(圖六）甲、乙、丙分別代表不同海拔高度的環境。

    以下 4 位同學在讀完文章後，分別提出各自的想法，請問誰的想法是正確的？'
  options:
  - label: A
    content: 芯:血紅素與氧氣結合成氧合血紅素是一種不可逆反應
  - label: B
    content: 英:肺部氧氣含量較低，有利於正反應，產生較多的氧合血紅素
  - label: C
    content: 雯:根據(圖六)，推測海拔由高至低為甲>乙>丙
  - label: D
    content: 侑:靜脈中氧氣含量較低，因此血液中的氧合血紅素比例會變成零。
