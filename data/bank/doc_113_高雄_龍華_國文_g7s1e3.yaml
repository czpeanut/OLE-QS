- id: doc_113_高雄_龍華_國文_g7s1e3_s4_30
  section: 4
  number: 30
  type: single
  page: 5
  stem: 根據本文，俗稱的「鬼壓床」，應是生理學上的何種現象？
  options:
  - label: A
    content: 是精神亢奮的狀態
  - label: B
    content: 是精神分裂症症狀
  - label: C
    content: 是睡眠癱瘓麻痺症狀
  - label: D
    content: 是肌肉萎縮症的早期症狀
  group_stem: "你有沒有過這種經驗：「意識明明已經清醒了，可是身體卻動彈不得，想開口喊救命卻又發不出聲音，甚至還看到一些莫名的景象。」這就是俗稱的「鬼壓床」。\
    \ \n  實際上所謂的「鬼壓床」，在睡眠神經醫學上是屬於一種睡眠癱瘓麻痺（Sleep Paralysis）的症狀，患者在睡眠時，呈現半醒半睡的情境，腦波是清醒的波幅，有些人還會併有影像的幻覺，但全身肌肉張力降至最低，類似「癱瘓」狀態，全身動彈不得。\
    \ \n  我們的睡眠歷程依序是由入睡期、淺睡期、熟睡期、深睡期，最後進入「快速動眼期」（做夢期）。睡眠癱瘓主要是提早進入快速動眼期的關係，導致在快速動眼期的階段不協調。在快速動眼期階段，身體呈現休息狀態，而且和大腦的連結信號也暫時中斷，這是一種防禦措施，這樣人體就不會將夢境實現在真實的生活裡，例如夢見打人時，就不會真的付諸行動而對枕邊人拳打腳踢。\
    \ \n  一般而言，「鬼壓床」的情況在任何年紀的人都可能發生。壓力過大、太過焦慮、緊張、極度疲累、失眠、睡眠不足，或有時差問題的情況下，睡眠會提早進入快速動眼期，而發生睡眠癱瘓。但很少有人連續發生，除非經常發生，才需向醫師尋求協助，只要對此症狀有所認識，其實不必過於憂慮。\
    \             ――改寫自《中國時報》"
