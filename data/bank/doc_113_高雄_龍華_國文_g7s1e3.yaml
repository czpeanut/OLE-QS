  section: 4
  number: 28
  type: single
  page: 5
  stem: 根據甲文，下列哪一個選項不正確？
  options:
  - label: A
    content: 遺下的木杖生成了樹林
  - label: B
    content: 黃河、渭水都不夠他喝
  - label: C
    content: 為了追太陽，半路渴死
  - label: D
    content: 喝北方大澤之水後才死
  group_stem: "【甲】 \n  夸父與日逐走，入日。渴，欲得飲，飲於河、渭，河、渭不足，北飲大澤。未至，道渴而死。棄其杖，化為鄧林。    \
    \                                                            ――《山海經‧海外北經》 \n：與日逐走：指追著太陽跑。\
    \ 入日：此指靠近太陽。 大澤：面積廣大的湖泊。 鄧林：即樹林。 \n【乙】 \n  「神話」是遠古人民的口頭創作。當時的人們看到天地萬物的變化無常，對於無法理解的現象，有時會按照自己的想像、理解或期望，創造出神話故事。\
    \ \n  當世界剛剛形成時，天地宛如雞蛋般一團混沌，其中孕育了一個叫盤古的神異之人。他在裡面沉睡了一萬八千年，而後天地漸漸分開，天日高一丈，地日厚一丈，盤古也每天長高一丈。就這樣又經過一萬八千年，天地之間相距達九萬里，盤古也成了頂天立地的超級巨人。\
    \ \n    盤古臨死前，他呼出的氣形成了風和雲，聲音變成巨大雷響，雙眼化為太陽與月亮，身體成了四方的擎天大柱與五嶽名山，血液化成江河湖泊，筋脈變成山川道路，肌肉化作沃土，髮鬚變成閃爍的星辰，皮膚、細毛變成花草樹木，牙齒、骨骼變成金屬和岩石，骨髓變成珍珠美玉，汗水變成潤澤大地的雨露，連身上寄生的小蟲受到暖風的吹拂，也化為大地上眾多的百姓。"
