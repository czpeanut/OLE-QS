- id: doc_113_高雄_龍華_國文_g7s1e3_s3_8
  section: 3
  number: 8
  type: single
  page: 2
  stem: 廣告常用誇飾手法凸顯商品的特色，如「一家烤肉萬家香」用「萬家香」強調醬油的香味遠播，讓人印象深刻。 請判斷下列選項，何者也運用了誇飾手法？
  options:
  - label: A
    content: 又到天黑╱出門時路燈都還沒醒╱急著跟黃昏說再見的她╱朝忙碌裡奔去(告五人〈又到天黑〉)
  - label: B
    content: 人在古老河床蛻變中╱我右拳打開了天╱化身為龍╱把山河重新移動╱填平裂縫(周杰倫〈龍拳〉)
  - label: C
    content: 與你分享的快樂╱勝過獨自擁有╱至今我仍深深感動╱好友如同一扇門╱讓世界開闊(伍思凱〈分享〉)
  - label: D
    content: 盼了好久╱終於盼到今天╱忍了好久╱終於把夢實現╱那些不變的風霜╱早就無所謂(劉德華〈今天〉)
- id: doc_113_高雄_龍華_國文_g7s1e3_s3_9
  section: 3
  number: 9
  type: single
  page: 2
  stem: 「沒有人會否認磨鍊的重要性，但很多人可能會認為，要花心血苦練以前，必須先衡量投資報酬率，苦練沒有什麼指望的事情，到頭來也許只是白費心血。這當然有部分的真實性，不過世事往往有出人意表者。」關於這段文字的理解，下列敘述何者正確？
  options:
  - label: A
    content: 每個人都承認磨鍊的重要性，所以所有人都願意花心血苦練，獲得報酬
  - label: B
    content: 要花心血苦練之前，先衡量投資報酬率的人，講求科學實證，值得效法
  - label: C
    content: 苦練沒有指望的事，到頭來一定只是白費心血，量力而為方可避免損失
  - label: D
    content: 不自我設限，只要願意投注心力，就等於給了自己一個可能成功的機會
  lesson_raw:
    title: 音樂家與職籃巨星
    basis: 題幹引用〈音樂家與職籃巨星〉課文段落
- id: doc_113_高雄_龍華_國文_g7s1e3_s3_10
  section: 3
  number: 10
  type: single
  page: 2
  stem: "關於下列兩首送別詩的寫作手法，何者敘述正確？\n【甲】故人西辭黃鶴樓，煙花三月下揚州。孤帆遠影碧山盡，唯見長江天際流。  \n(李白〈黃鶴樓送孟浩然之廣陵〉)\n\
    【乙】李白乘舟將欲行，忽聞岸上踏歌聲。桃花潭水深千尺，不及汪倫送我情。\n(李白〈贈汪倫〉)"
  options:
  - label: A
    content: 兩首送別詩都有呈現遠行人欲前往的目的地
  - label: B
    content: 甲詩中李白是送行人，乙詩中汪倫是遠行人
  - label: C
    content: 甲詩以「煙花」反襯惆悵，乙詩以「忽聞」描摹驚喜之情
  - label: D
    content: 兩首詩作者皆以第二人稱立場書寫，亦提及水邊送別之情
- id: doc_113_高雄_龍華_國文_g7s1e3_s3_11
  section: 3
  number: 11
  type: single
  page: 2
  stem: 「許多人都懷念學生時代結交的友人，認為不涉及利害，更為清純可喜。雖有幾分真實，卻也不是定論。」依據這段話的敘述，下列何者是作者想要表達的意涵？
  options:
  - label: A
    content: 友情是否清純可喜與何時所結交的朋友無必然關係
  - label: B
    content: 會涉及利害的朋友必然不會是在學生時代所結交的
  - label: C
    content: 學生時代的友誼在步入社會工作之後也不容易變質
  - label: D
    content: 人們一生中最懷念的朋友都是讀書時期結交的友人
  lesson_raw:
    title: 朋友相交
    basis: 題幹引用課文〈朋友相交〉段落
- id: doc_113_高雄_龍華_國文_g7s1e3_s3_12
