- id: doc_113_高雄_龍華_國文_g7s1e3_s3_6
  section: 3
  number: 6
  type: single
  page: 1
  stem: 下列文句，何者成語使用不恰當？
  options:
  - label: A
    content: 在長久的人生中，若能結交到幾個可以暢談心事的「泛泛之交」，也就沒有什麼遺憾了
  - label: B
    content: 湘估和我是從小一起長大的「總角之交」，我們了解彼此的個性與愛好，時常互訴心事
  - label: C
    content: 宏荳和逸紝非常有話聊，不知情的人還以為她們是祖孫關係，其實她們是「忘年之交」
  - label: D
    content: 媖桃和清嬌雖然沒有血緣關係，但她們卻是「手帕之交」，平常相處就像親姊妹一樣好
