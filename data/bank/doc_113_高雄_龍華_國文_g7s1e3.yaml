  group_stem: "【甲】  2024 年世界棒球12 強賽（WBSC Premier 12）於11 月24 日精彩落幕，中華隊在冠軍賽中以4：0 擊敗勁敵日本，奪下歷史性冠軍，展現驕傲的台灣力量。這場比賽不僅帶給我們無數感動，更從中看到選手們的毅力、團隊合作與拚搏精神。一起來看看從這場賽事與選手們身上，值得我們學習的六件事吧！\
    \ \n| 團隊合作，創造無限可能 | 相信自己，也相信隊友 | 接受自己的選擇與情緒 | 專注做好該做的事，小卒也能變英雄 | 不放過任何機會，拚命抓住它\
    \ | 努力不懈，讓世界看見台灣 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| ‧曾豪駒教練：<br>「我非常感謝教練及選手，我們彼此信任，且相信自己，大家用團隊的力量打贏這場比賽。我們在撰寫自己的歷史、故事，人生有無限可能。只有去做，你才知道你能不能實現。」\
    \ | ‧陳傑憲：<br>「我在那個打席的時候，我不覺得自己會輸，而且因為我的隊友很給力，他已經上壘了，我相信我可以，我也相信我的隊友。」 | ‧陳晨威：<br>「因為這是自己的選擇，既然選擇失敗，當然自己要承擔，然後要去接受這樣的結果。會沮喪是正常的，因為這表示我在乎。」\
    \ | ‧林安可：<br>「小卒也能變英雄，其實大家都不看好我們。我們可以打到冠軍，我覺得其實大家就是相信自己，不管有沒有被看好，就是相信自己，然後專注在場上該做的事。」\
    \ | ‧陳傑憲：<br>「我們真的沒有想到會有這一步，所以我和隊友說，已經走到現在了，我們有一個很好的機會，一定要抓住它。」 | ‧陳傑憲：<br>「我只想說，我們真的做到了。我想要跟球迷說，請愛我們、支持我們，我們一直都在努力，不要放棄我們。然後很謝謝這次團隊，讓世界看見台灣。」\
    \ |\n――改寫自＜「世界棒球12 強賽」中華隊贏得冠軍寫下歷史「相信自己，才能創造無限可能」6 個感人的瞬間＞ \n \n【乙】  說到美國職業棒球大聯盟（MLB），大家一定知道這位耳熟能詳的球星――大谷翔平，身為當代棒球界最具代表性的人物，大谷翔平的成功絕非偶然，他是所有球員心中的典範、球迷心中最勵志的指標。\
    \ \n  洛杉磯道奇隊前總經理丹．埃文斯（Dan Evans）長年到日本考察，他很早就關注大谷翔平。埃文斯發現，大谷翔平早在2013 年（當年18 歲）就決定要兼顧投、打，由於目標很清晰並且不斷堅持下去，才能有所成就，每一次的練習，他都必須做到最好、最深刻。\
    \ \n  「大谷翔平在熱身時，就是用毫無保留的態度，全力揮擊，把每一球從本壘板打到最外野。」埃文斯說，肯做好基本功的球員，本身性格就是一大優點，這會讓教練團感覺這名球員值得信任，能成為球隊的核心。\
    \ \n  其實，大谷翔平早在高中時，就採用一套特別的「曼陀羅九宮格思考法」來實現目標。這套方法最早由日本學者今泉浩晃發展，從一個核心主題（大目標），衍生出八項基礎思考，每個基礎思考，再發想出八項實踐思考，旨在拓展更多潛在想法，讓達成目標的過程更加清晰。大谷翔平在高中時就寫下這張清單，其中最核心的主題是「成為八大球團第一指名的新人」，要達到這個目標，基礎思考要素從包含有形的「控球」、「球質」，甚至是無形的「運氣」、「品性」等。他曾告訴自己，如果多讀書、打掃房間、幫助他人、珍惜球具等，他會更幸運；此外，另外一個延伸的大主題是「身體素質」，而他的小目標就是強化下盤、增加體重等，來加強投球速度與球威。\
    \ \n  當大目標與小目標環環相扣，大谷翔平就能更明確地注意到每個細節，來完成願景。為了成為頂尖新人，他除了得做好控球、球質，同時還要關心自己的言行舉止，也就是在各方面都做到最好，才能確保自己的成功。\
    \ \n――改寫自＜「曼陀羅九宮格思考法」是什麼？球星大谷翔平靠它從高中確立目標、逐步圓夢＞"
  shared_asset: g4_32_33
