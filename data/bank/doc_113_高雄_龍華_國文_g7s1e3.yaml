    \ 入日：此指靠近太陽。 大澤：面積廣大的湖泊。 鄧林：即樹林。 \n【乙】 \n  「神話」是遠古人民的口頭創作。當時的人們看到天地萬物的變化無常，對於無法理解的現象，有時會按照自己的想像、理解或期望，創造出神話故事。\
