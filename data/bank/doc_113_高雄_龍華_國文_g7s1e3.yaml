  - label: D
    content: 全文以記敘方式回憶童年點滴，描述的許多趣事建構在視覺和聽覺的感官上
  lesson_raw:
    title: 兒時記趣
    basis: 題幹提及課名〈兒時記趣〉
- id: doc_113_高雄_龍華_國文_g7s1e3_s3_13
  section: 3
  number: 13
  type: single
  page: 3
  stem: 櫻桃同學平時不願花時間複習課業，總是在考試前才臨時抱佛腳讀書，所以學習成果老是敬陪末座。針對櫻桃同學這樣的學習態度，下列哪一句話讓詩詩老師寫在她的聯絡簿上最適當？
  options:
  - label: A
    content: 巧言亂德，小不忍則亂大謀
  - label: B
