  group_stem: "歐陽公嘗得一古畫，牡丹叢，其下有一貓，未知其精粗。丞相正肅吳公與歐公姻家，一見曰：「此正午牡丹也。何以明之？其花披哆而色燥，此日中時花也。貓眼黑睛如線，此正午貓眼也。有帶露花，則房斂而色澤。貓眼早暮則睛圓，日漸中狹長，正午則如一線耳。」此亦善求古人筆意也。\
