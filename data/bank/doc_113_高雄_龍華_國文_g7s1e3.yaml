  stem: 根據本文，下列選項何者並非作者對學生談戀愛的看法？
  options:
  - label: A
    content: 嚴格禁止中學生結交異性朋友
  - label: B
    content: 年輕的心難免對愛情懷抱憧憬
  - label: C
    content: 不該昏天暗地談戀愛輕忽學業
  - label: D
    content: 進德修業讓自己可愛值得信賴
  group_stem: "你聽說過：「強摘的果子不甜。」這句話嗎？ \n枝頭上青澀的果子，靜靜地等待成熟，那的確需要時間。有足夠的養分供給，讓它由酸苦慢慢轉化為甘美，哪能性急呢？揠苗助長有害於作物；強摘果子也是一種摧折、傷害。深秋以後，橘子就上市了。市場新寵，價格難免高些，但誰又在意呢？只是，水果攤上陳列出來的橘子仍然透著青綠，我不免有點兒懷疑：它們會甜嗎？繼而又自以為聰明地解說：「青綠的，才新鮮哪。」\
    \ \n買了回來，我趕忙剝了一個，放進嘴裡。我的天，怎麼這樣酸？ \n一連嘗了幾個，都酸得嚥不下，只好擱在一邊，不吃了。 \n一個禮拜以後，我在無意間又看到了這袋橘子，果皮已略呈黃色，我再剝了一個，一吃之下，大為驚奇：好甜哪！\
    \ \n後來，我才知道，有些水果剛摘下，也並不好吃，需給它一段「果熟期」，才會變得甜美。何況是強摘的澀果呢？ \n於是，每當我看到年少的你們對異性充滿了好奇，對愛情更是躍躍欲試，有些人甚至把功課拋到腦後，昏天黑地談起戀愛來，我就不免有些擔心。\
    \ \n並不是說你們不可以結交異性朋友。懂得與人和諧相處，良好的人際關係將有助於未來事業的發展，尤其，也使自己成為一個快樂的人。 \n但是，當你們還在求學階段，就不應該輕忽學業，不能盡到本分，也是一種不負責。此刻的你們，也像枝頭上青綠的果子，正需要足夠的陽光、空氣和水，在細心培育之下，逐漸飽滿圓熟。萬一，在此時就被強摘，實則是不幸。難道不能再等一等？在一個合適的機緣裡，當你們早已積聚了更多的芳醇，綻放更大的美麗時。\
    \ \n我真心希望你們都能珍惜年少時光，在進德修業上都有飛躍的、令人驚羨的好成績。沒有知識，就沒有力量，又如何對國家社會作更大的奉獻呢？沒有智慧，又如何明辨是非，知所進退呢？\
    \ \n當然，哪個年輕的心不對愛情懷抱憧憬的？可是，你是不是都準備好了呢？你有足夠的學識嗎？有良好的品德嗎？你會不會是個可愛又值得信賴的人呢？你知道怎樣去愛、願意從中學習，且能保護自己不受傷害嗎？……\
    \ \n由青澀轉為成熟，是需要時間的，何苦勉強攀摘？那定然不甜的果子又有什麼好滋味呢？讓我們靜靜等待屬於它芳醇甘美的一日。                \
    \                                              \n――琹涵＜酸橘子＞"
