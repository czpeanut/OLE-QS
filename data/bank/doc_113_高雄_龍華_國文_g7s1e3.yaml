- id: doc_113_高雄_龍華_國文_g7s1e3_s3_15
  section: 3
  number: 15
  type: single
  page: 3
  stem: "琹涵在〈朋友相交〉一文提及「朋友相交，貴在誠信。」；子夏也說：「與朋友相交，言而有信。」；曾子在每日反省自己的三件事中也提到「與朋友交而不信乎？」可見古今學者都很注重與朋友交往間的「誠信」，無獨有偶，下述《世說新語‧方正》正好記錄了一個朋友間「爽約」的事件。試問下列哪個選項對這個事件的理解完全正確？\n\
    陳太丘與友期行①，期日中。過中不至，太丘舍去，去後乃至。元方時年七歲，門外戲。客問元方：「尊君在不②？」答曰：「待君久不至，已去。」友人便怒曰：「非人哉！與人期行，相委③而去。」元方曰：「君與家君期日中，日中不至，則是無信；對子罵父，則是無禮。」友人慚，下車引④之。元方入門不顧。\
    \  \n①期行：約定同行。②不：同「否」，句末疑問語助詞。③相委：拋棄我。④引：逗引。  《世說新語‧方正》"
  options:
  - label: A
    content: 陳元方雖然年幼，卻能清楚地分析這個事件中雙方的是非對錯，讓人佩服
  - label: B
