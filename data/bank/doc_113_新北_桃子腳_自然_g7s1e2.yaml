- id: doc_113_新北_桃子腳_自然_g7s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: "光臘樹的莖，可以不斷增生新的木質部和韌皮部，使莖\n加粗，因此莖內含有： 甲. 新的韌皮部；乙.；老的韌\n皮部 丙. 新的木質部；丁.老的木質部；戊.形成層。\
    \ \n以上構造由外而內排列順序為何？"
  options:
  - label: A
    content: 甲→乙→丙→丁→戊
  - label: B
    content: 乙→甲→戊→丙→丁
  - label: C
    content: 丙→丁→戊→甲→乙
  - label: D
    content: 丁→丙→戊→甲→乙。
