- id: doc_113_新北_桃子腳_自然_g7s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '護士將藥物自病人右手靜脈打入身體內，該藥物在血液

    中的循環順序為何？'
  options:
  - label: A
    content: '大靜脈右心房右心室肺動脈肺微血管肺

      靜脈左心房左心室主動脈腦及胸部微血管'
  - label: B
    content: '大靜脈右心室右心房肺動脈肺微血管左

      心室左心房肺靜脈腦及胸部微血管'
  - label: C
    content: '大靜脈左心室左心房主動脈肺動脈右心

      室右心房上大靜脈腦及胸部微血管'
  - label: D
    content: '大靜脈右心房右心室肺動脈肺微血管肺

      靜脈左心房 左心室上大靜脈腦及胸部微血管'
