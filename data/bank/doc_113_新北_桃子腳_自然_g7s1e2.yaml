    | 乙 | 16 |'
  options:
  - label: A
    content: 甲與大靜脈連接；乙與主動脈連接
  - label: B
    content: '甲與肺靜脈連

      接；乙與大靜脈連接'
  - label: C
    content: '甲與主動脈連接；乙與大靜脈

      連接'
  - label: D
    content: 甲與主動脈連接；乙與肺動脈連接。
