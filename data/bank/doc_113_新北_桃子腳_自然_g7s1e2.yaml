    content: '莖內維管

      束木質部靠外側'
  - label: B
    content: 莖內維管束成散生排列
  - label: C
    content: '葉內

      維管束的韌皮部，靠近上表皮側'
  - label: D
    content: '葉脈為網狀脈，

      所以是雙子葉植物。'
