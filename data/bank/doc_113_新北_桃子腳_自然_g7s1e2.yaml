- id: doc_113_新北_桃子腳_自然_g7s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: "從某植物上取了四個條件相同的枝條，分別標示為甲、乙、丙、丁，並對枝條上的葉子進行以下處理：\n\n| 編號 | 處理方式（已知葉片塗上白膠處的氣孔無法進行蒸散作用）\
    \ |\n| :-: | :- |\n| 甲 | 在葉片上下表皮皆塗上白膠 |\n| 乙 | 只在葉片上表皮塗上白膠 |\n| 丙 | 只在葉片下表皮塗上白膠\
    \ |\n| 丁 | 不做任何處理 |\n\n之後將甲、乙、丙、丁分別插入水量相同的量筒中，再把\n量筒開口處以膜封閉，如圖（一）。將四組實驗裝置給\n予相同條件的環境，一段時間後記錄量筒內水量，實驗\n\
    結果如圖（二）所示。 \n根據實驗結果，對於此植物氣孔位置分布的相關推論，\n最有可能為下列何者？"
  options:
  - label: A
    content: '由甲可推論出葉片上表皮

      無氣孔分布'
  - label: B
    content: '透過乙、丙可推論出，葉片上表皮有氣

      孔，但氣孔主要分布於葉片下表皮'
  - label: C
    content: '透過圖二可推論

      出，氣孔平均分布於葉片上下表皮'
  - label: D
    content: '透過圖二可推論

      出，氣孔只分布於葉片下表皮。'
