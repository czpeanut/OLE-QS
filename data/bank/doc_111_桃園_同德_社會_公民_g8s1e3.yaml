- id: doc_111_桃園_同德_社會_公民_g8s1e3_s1_56
  section: 1
  number: 56
  type: single
  page: 2
  stem: 關於「政治參與」的看法，下列敘述何者正確？
  options:
  - label: A
    content: 政治參與只能透過選舉投票的方式
  - label: B
    content: 只有符合法定年齡的選民，才有資格參與政治
  - label: C
    content: 政治參與是人民的權利，也是現代公民應盡的責任
  - label: D
    content: 成為候選人或擔任政府公職，才是政治參與的方式。
  group_stem: '臺灣校園一向封閉，為了維持校園清淨，嚴禁政治議題或政黨進入校園，學生對國家前途、公共議題較為冷漠，缺乏獨立思辨能力，容易隨網路言論起鬨。其實，每逢選舉期，就是實施公民教育的最佳時機。

    同德國中為了讓未成年學生關心公共事務，舉辦自治市小市長競選活動，讓未滿 18 歲的青少年學習選舉，由學生登記模擬候選人，進行競選和助選活動，培養政治思辨能力，預防盲從。

    我國的公民投票法已將投票年齡從 20 歲降為 18 歲，民主教育應該從小扎根，培養學童與青少年獨立思考的能力，成為國家不可撼動的民主資產。（資料來源：改寫自羅元祺，政治進入校園，培養學生獨立思考的德國「U18
    選舉」，關鍵評論，2018/10/17）'
  tags:
    chapter:
      publisher: 康軒
      book: 八上
      subject: 公民
      code: 6-1
      title: 政治參與的重要性及方式
      chapter: null
