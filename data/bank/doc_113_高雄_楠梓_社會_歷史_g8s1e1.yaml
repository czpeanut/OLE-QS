  stem: 魏晉南北朝後期盛傳：「上車不落則著作，體中如何則秘書」。意思是只要到了坐上車不會跌落的年紀，便可當著作郎（官名），會寫簡單的問候信，就可被選為秘書郎（官名），這是諷刺世家子弟可憑家世任官。請問：下列哪一句話較接近上文中的描述？
