    content: 從尼安德塔人的DNA 分析，推測其滅絕的可能原因
  - label: B
    content: 古代生物的真實樣貌，例如恐龍的皮膚顏色
  - label: C
    content: 了解地球環境的變化，例如現在的某些陸地在過去可能是海域環境
  - label: D
    content: 生物的演化，例如馬的牙齒咀嚼面積越來越大。
  group_stem: '近年來古代 DNA 的研究十分熱門，從猛瑪象、洞熊到冰人奧茲的腸道菌，許多幾千、幾萬年前生物的 DNA 被成功定序，其中最受矚目的莫過於尼安德塔人。約
    4 萬年前滅亡的尼安德塔人（Homo neanderthalensis）是現存的智人（Homo sapiens）近親，自從 1856 年第一個化石出土，100
    多年來科學家找到相當豐富的尼安德塔人化石，並在 2010 年首次發表尼安德塔人的整個基因組，這讓我們得知如今非洲以外人類族群基因組中，有 1.5 到 2.1%的
    DNA 來自於尼安德塔人，可見現代人的祖先當年走出非洲不久後，曾經與尼安德塔人有過遺傳交流。

    研究顯示尼安德塔人的 DNA 會影響現代人的生理健康，例如更容易罹患免疫系統的疾病、自閉症、或是小腦的結構功能受到影響…等。

    此外，科學家也觀察到：大約在 5 萬到 4 萬年前，尼安德塔人的族群人口縮減到僅剩 5000 人左右，導致尼安德塔人的基因組中有了過多的有害突變，這些突變可能造成他們生殖適應力下降，進而導致他們走向滅絕…

    《文章改編自：科學人 2025 年五月號 第 279 期-「你不是怪，只是基因很特別」》'
