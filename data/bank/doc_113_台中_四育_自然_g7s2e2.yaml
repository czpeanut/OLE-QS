- id: doc_113_台中_四育_自然_g7s2e2_s1_23
  section: 1
  number: 23
  type: single
  page: 3
  stem: 依據本文，下列敘述何者錯誤？
  options:
  - label: A
    content: 地衣不具有根、莖、葉等器官
  - label: B
    content: 空氣汙染嚴重的地區不利於地衣的生存
  - label: C
    content: 在荒蕪的空地或是極地的冬天，都有機會看到地衣
  - label: D
    content: 地衣是最早出現在陸地的蘚苔植物。
  group_stem: '爬山的時候，路邊的石頭上、樹皮上，常常可以見到一層有點粉粉的、很像青苔的小生物。它們有綠色、灰色、黃色、紅色，呈現殼狀、葉狀、枝狀等各種形狀。它們的名字叫「地衣」，雖然常常與蘚苔混淆，不過它們並不是植物，而是真菌和綠藻或藍綠菌的共生體：真菌形成外殼，提供綠藻或藍綠菌保護；而綠藻或藍綠菌則可行光合作用，提供真菌養分。

    地衣對空氣中的化學成分很敏感，可以作為空氣汙染的指標。因此，如果你家附近的路邊、行道樹上出現地衣，那代表你家附近的空氣很乾淨喔！此外，由於地衣的生命力強韌，它們通常都是荒蕪環境中的先驅，在植物長出來之前，地衣就會先一步到達，把岩石分解成土壤，為之後的生態系打下基礎。在嚴寒的極地，冬季僅有地衣可以生長。因此，地衣也是馴鹿等野生動物度冬重要的食物來源。

    《文章節錄自：泛科學-「真菌與藻類的共生體，有著「陸上的珊瑚」之稱-地衣」》'
