- id: doc_113_台中_四育_自然_g7s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 從本文可知：造成「達爾文蛙」近年來族群數量迅速減少的主因為何？
  options:
  - label: A
    content: 棲地被破壞
  - label: B
    content: 病毒肆虐
  - label: C
    content: 真菌感染
  - label: D
    content: 因具有觀賞價值而被人類大量捕捉。
  group_stem: '無尾目包含許多蛙類，其中的達爾文赤蛙科僅有一屬(堅吻蛙屬)兩種：一種是生活在智利北部的「智利達爾文蛙 Rhinoderma rufum」，已消失殆盡；另外一種是「達爾文蛙
    Rhinoderma darwinii」，牠的生存正備受威脅…

    2023 年蛙壺菌入侵智利南部後，讓「達爾文蛙」的族群數量在一年內迅速銳減了 90%！蛙壺菌不是細菌，分類上屬於真菌界。研究顯示蛙壺菌會引發蛙的皮膚病變，影響呼吸，甚至導致心臟衰竭，致死率高達八成。蛙壺菌可怕的地方在於它的傳染性高、傳播速度快，科學家普遍認同過去
    40 年間，這種真菌已經導致 200 多種蛙類族群的數量驟減或滅絕！科學家悲觀的認為，兩生綱可能是世界上瀕臨滅絕危機最嚴重的動物。

    《文章改編自：中學生報 第 628 期-「從倫敦到南美智利 跨越萬里搶救瀕危蛙》'
  tags:
    chapter:
      publisher: 康軒
      book: 七下
      subject: 生物
      code: 3-4
      title: 真菌界
      chapter: 第3章 地球上的生物
    textbook: 七下生物 3-4 真菌界
    labeled_by: ai
