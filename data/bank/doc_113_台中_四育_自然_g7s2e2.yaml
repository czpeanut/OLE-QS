- id: doc_113_台中_四育_自然_g7s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 小明罹患的這種影響神經系統的體染色體隱性遺傳疾病，若以A、a 來代表其等位基因，A 對a 為顯性，請問小明爸媽的基因型為何？
  options:
  - label: A
    content: 都是AA
  - label: B
    content: 都是Aa
  - label: C
    content: 都是aa
  - label: D
    content: 其中一人為Aa，另外一人為aa。
  group_stem: '小明是個活潑的 5 歲男孩，大約半年以前，爸、媽發現他走路步態不穩容易跌倒，平衡感也變差，四處求醫輾轉來到遺傳科醫師門診，醫師根據臨床症狀、相關實驗室檢驗和基因檢測後，確認小明罹患了一種會影響神經系統的體染色體隱性遺傳疾病。

    又因為小明還有一個 1 歲多的妹妹，醫師也建議爸、媽帶妹妹來做基因檢查，因為依疾病之遺傳模式，妹妹會有 25%的機會得到此疾病，爸媽還有其他家屬得知這個消息後，除了難過、心中亦出現許多疑問：「到底什麼是遺傳性疾病？」、「我們雙方家庭都很健康，怎麼可能有這種狀況？」、「妹妹當初在產檢時就做過基因晶片檢查是正常才生的啊？」…

    《文章節錄自：臺大醫院健康電子報 2017 年 04 月 113 期》'
  tags:
    chapter:
      publisher: 康軒
      book: 七下
      subject: 生物
      code: 2-2
      title: 人類的遺傳
      chapter: 第2章 遺傳
    textbook: 七下生物 2-2 人類的遺傳
    labeled_by: ai
