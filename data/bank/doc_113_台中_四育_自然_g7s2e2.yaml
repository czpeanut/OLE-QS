- id: doc_113_台中_四育_自然_g7s2e2_s1_27
  section: 1
  number: 27
  type: single
  page: 3
  stem: 根據文章推論，為了能讓母豬乳汁中含有人類凝血因子，科學家進行基因轉殖時是將哪一物質放入豬隻細胞內呢？
  options:
  - label: A
    content: 人類完整的細胞核
  - label: B
    content: 人類的凝血因子
  - label: C
    content: 可製造人類凝血因子的DNA 片段
  - label: D
    content: 人類的血液。
  group_stem: '91 年 4 月 15 日臺灣科學家研究多時的複製豬誕生了，取名為「酷比」(共有三隻，但僅有一隻存活下來)。單單只是成功地複製豬隻已經很有成就了，但真正讓各界刮目相看的是，酷比豬是雙基因轉殖複製豬！牠創下兩項世界第一，牠是世界首例以高齡母豬耳皮膚細胞作為供核者的複製豬，也是全球第一例雙基因轉殖複製豬，同時轉殖入乳鐵蛋白基因與合成人類凝血第九因子的基因…目前
    B 型血友病之患者所使用之凝血第九因子一般均源自人類血漿純化者，其中存在疾病(例如肝炎、AIDS)感染之風險，若能藉由基因轉殖家畜之乳腺進行量產，則對於 B
    型血友病患者，將是一大福音。

    《文章改編自：農政與農情 第 123 期-「生物科技與畜產之應用」》'
