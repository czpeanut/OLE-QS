  section: 1
  number: 17
  type: single
  page: 2
  stem: '下列關於登革熱病毒與沃爾巴克氏菌的比較，何者錯誤？

    | | (A)遺傳物質 | (B)細胞膜 | (C)分類 | (D)體型 |

    | :--- | :--- | :--- | :--- | :--- |

    | 登革熱病毒 | 有 | 無 | 不屬於任何一界 | 較大 |

    | 沃爾巴克氏菌 | 有 | 有 | 原核生物界 | 較小 |'
  options:
  - label: A
    content: 遺傳物質
  - label: B
    content: 細胞膜
  - label: C
    content: 分類
  - label: D
    content: 體型
  group_stem: '登革熱是一種透過病媒蚊(埃及斑蚊及白線斑蚊)叮咬而傳播登革熱病毒的急性傳染病，目前已在世界衛生組織公告之非洲、美洲、東地中海、東南亞及西太平洋地區，超過
    100 個國家中流行。臺灣在 2014 至 2015 年的登革熱疫情最為嚴峻，年病例數超過萬例以上；雖然 2020 年至 2022 年因防範 COVID-19
    疫情，進行邊境管制大幅度減少了登革熱的病例數，但是 2023 年隨著國境開放，民眾出入境、往來各地交流頻繁，加以氣候炎熱經常降雨，有利於病媒蚊孳生，病例數又開始飆升。

    登革熱主要症狀為發燒、身體多處疼痛、出疹或噁心、嘔吐等，若重複感染不同型別的登革熱病毒，將有可能造成出血型登革熱，嚴重則導致死亡。臺灣雖然不是登革熱最主要的流行地區，仍要小心防範！目前臺灣的登革熱防治主要以境外阻絕、清除病媒蚊孳生源、疫情發生初期立即噴灑殺蟲劑阻絕病媒蚊傳播等方式進行，目的在於阻止病媒蚊傳播登革熱病毒；然而，國際間許多專家認為僅靠現有防治方法無法有效持續地控制病媒蚊與其所傳播的疾病，因此持續研發新的防治技術。其中一項是利用一種與
    66%昆蟲天然共生的細菌-沃爾巴克氏菌，將其感染病媒蚊，可降低登革病毒在其體內複製之效率，或是影響病媒蚊的生殖能力，藉此達到登革熱防治的目的。

    《文章改編自：台灣衛誌 2024, Vol.43,No.2》'
