- id: doc_113_新北_中平_數學_g8s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: '小平依照尺規作圖步驟❶❷❸，完成圖形如右

    ❶已知直線 $L$ 與線外一點 $P$，先以 $P$ 點為圓心，適當長為半徑畫弧，弧與直線 $L$ 交於 $A$、$B$ 兩點。

    ❷分別以 $A$、$B$ 為圓心，大於 $\frac{1}{2}\overline{AB}$ 的相同長度為半徑，分別畫出兩弧交於 $Q$ 點。

    ❸連接 $\overline{PQ}$。

    則下列敘述何者正確？'
  options:
  - label: A
    content: 若連接 $\overline{PA}$、$\overline{PB}$、$\overline{QA}$、$\overline{QB}$，則
      $\overline{PA}=\overline{PB}=\overline{QA}=\overline{QB}$
  - label: B
    content: $L$ 是 $\overline{PQ}$ 的中垂線。
  - label: C
    content: $\overline{PQ}$ 與 $\overline{AB}$ 互相垂直。
  - label: D
    content: $\overline{PQ}$ 是 $L$ 的中垂線。
  assets:
  - key: s1_9_f1
    kind: figure
    file: doc_113_新北_中平_數學_g8s2e2/s1_9_f1.png
    crop:
