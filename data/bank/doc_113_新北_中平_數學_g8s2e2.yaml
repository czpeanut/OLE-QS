- id: doc_113_新北_中平_數學_g8s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: '如圖，銳角三角形 $ABC$ 中，$D$ 點在 $\overline{BC}$ 上，$\angle B=\angle BAD=\angle CAD$。今欲在
    $\overline{AD}$ 上找一點 $P$，使得 $\angle APC=\angle ADB$，以下是甲、乙兩人的作法：

    (甲)作 $\overline{AC}$ 的中垂線交 $\overline{AD}$ 於 $P$ 點，則 $P$ 即為所求

    (乙)以 $C$ 為圓心，$\overline{CD}$ 長為半徑畫弧，交 $\overline{AD}$ 於異於 $D$ 點的一點 $P$，則 $P$ 即為所求

    對於甲、乙兩人的作法，下列判斷何者正確？'
  options:
  - label: A
    content: 兩人皆正確
  - label: B
    content: 兩人皆錯誤
  - label: C
    content: 甲正確，乙錯誤
  - label: D
    content: 甲錯誤，乙正確。
