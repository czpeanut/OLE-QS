  stem: '想要分離食鹽與木炭粉的混合物，需以下實驗步驟

    (甲)將食鹽與木炭粉的混合物倒入水中攪拌；

    (乙)混合物的水溶液以濾紙過濾；

    (丙)濾液倒入蒸發皿中，在陶瓷纖維網上加熱至蒸

    下列有關步驟乙的錯誤敘述是：'
  options:
  - label: A
    content: 過濾是利用顆粒大小不同，顆粒小的無法通過，會留在濾紙上，例如本步驟中的木炭粉。
  - label: B
    content: 過濾時，濾紙需撕去一小角，並使其附著在漏斗內壁。
  - label: C
    content: 過濾時，漏斗頸下端需接觸燒杯內壁，避免濾液濺起。
  - label: D
