- id: doc_113_高雄_左營_國文_g8s2e2_s1_1
  section: 1
  number: 1
  type: matching
  page: 1
  stem: 君不見，（1）
  group_stem: "君不見，黃河之水天上來，奔流到海不復回。\n君不見，    （1）      ，    （2）     。\n人生得意須盡歡，   \
    \   （3）        。\n天生我材必有用，      （4）        。\n烹羊宰牛且為樂，      （5）        。\n岑夫子，丹丘生，將進酒，杯莫停。\n\
    與君歌一曲，請君為我側耳聽。\n鐘鼓饌玉不足貴，      （6）       。\n古來聖賢皆寂寞，      （7）       。\n陳王昔時宴平樂，\
    \      （8）       。\n主人何為言少錢？      （9）       。\n五花馬，千金裘，      （10）      ，與爾同銷萬古愁。\n\
    配合選項：（A）會須一飲三百杯        （B）坐對韋編燈動壁        （C）徑須沽取對君酌。\n         （D）斗酒十千恣歡謔    \
    \    （E）高堂明鏡悲白髮        （F）高歌夜半雪壓廬\n         （G）隔籬呼取盡餘杯        （H）但願長醉不願醒     \
    \   （I）莫使金樽空對月\n         （J）朝如青絲暮成雪        （K）舉杯銷愁愁更愁        （L）唯有飲者留其名\n    \
    \     （M）呼兒將出換美酒        （N）莊生曉夢迷蝴蝶        （O）千金散盡還復來"
  lesson_raw:
    title: 將進酒
    basis: 引自李白〈將進酒〉課文
