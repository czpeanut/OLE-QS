- id: doc_113_高雄_左營_國文_g8s2e2_s5_34
  section: 5
  number: 34
  type: single
  page: 7
  stem: 34.根據本文，關於黑眼圈成因的敘述，何者正確？
  options:
  - label: A
    content: 色素型黑眼圈的成因，全來自遺傳因素所影響
  - label: B
    content: 若有過敏性鼻炎，則容易產生微血管增生及擴張而有黑眼圈
  - label: C
    content: 若睡眠不足，則容易產生永久性的血管顯現，造成黑眼圈
  - label: D
    content: 青少年所產生的黑眼圈，大多由於眼眶凹陷的緣故
  group_stem: "（五）\n「熊貓眼」不一定是因為熬夜：黑眼圈的三種類型與改善方法\n    當眼睛下圍到眼眶骨之間有暗沈，就是所謂的黑眼圈。一般我們認為的沒睡飽是源自於暫時性的血管顯現，同樣會造成血管明顯的還有女生生理期、攝取太多鹽分、哭泣過度等等。當有鼻塞、過敏性鼻炎等疾病讓血液循環變差，就會讓微血管增生而有黑眼圈。\n\
    \    黑眼圈的成因也與皮膚有關，如果長期日曬、發炎，或是因為年紀大、膠原蛋白變少，會使皮膚變薄和色素沉積。如果患有異位性皮膚炎，或過度摩擦皮膚都會讓皮膚變粗，進而生成黑眼圈。\n\
    來自以上種種成因，黑眼圈大概可以分成三類：色素型、血管型和結構型。\n1.色素型黑眼圈\n  跟色素累積有關，也有遺傳和後天影響之分。遺傳原因方面，中東、東南亞很多人的上下眼皮天生就有較深的色素。後天影響方面，當我們長期日曬、摩擦眼下皮膚時，也會產生黑色素沉澱。\n\
    \  此外前述提過的異位性皮膚炎、慢性反覆的發炎症，通常也會有紅腫灼熱的現象，也會造成皮膚粗糙和色素累積。有些人會對化妝品起發炎反應，同樣容易造成黑眼圈。也因為色素型黑眼圈是受到基因或發炎影響，針對防曬和避免發炎才能預防色素型。\n\
    改善方法：\n防曬、保濕。\n盡量不亂摸揉眼睛、不用刺激化妝品。\n治療過敏性鼻炎、異位性皮膚炎。\n  上面三項是預防方法，如果是天生的黑眼圈或是已有色素沉積，可以透過維生素C、杜鵑花酸等含有這些美白成分的保養品。若是真的沉澱太多保養品救不了，可以請醫生開藥膏或用雷射來淡化黑色素。\n\
    2.血管型黑眼圈\n  前面也提過，這種黑眼圈受到血液循環和血管影響。當我們的鼻子過敏，會讓鼻子連結到眼表的血液循環不好。當血液不順暢，會塞住而導致血管擴張。\n\
    \  台灣人除了天生色素多，也因為氣候的關係，過敏性鼻炎目前盛行率約25％，才會讓擁有黑眼圈的人到處都是。除了過敏之外，只要眼睛周圍血液循環不好，像是大哭、用眼過度、攝取太多鹽分或水分、生理期、懷孕末期，都會讓眼睛水腫而產生黑眼圈。\n\
    改善方法：\n治療過敏性鼻炎。\n避免熬夜、過度用眼、長時間哭泣。\n避免攝取過多鹽分、水分。\n  若是有水腫狀況，可以透過輕度的按摩、溫水敷眼來緩解血液循環，不過太用力或太熱也不行喔。有些雷射可以幫助去除微血管增生，但眼周的治療相對危險困難。\n\
    3.結構型黑眼圈\n  這個不是真的黑眼圈。當我們的淚溝明顯、蘋果肌流失嚴重，或是眼周的凹陷明顯，都會讓黑眼圈的位置更凹進去。眼眶凹陷（天生或老化影響）使眼眶骨質流失，也就會讓凹進去的那塊看起來更黑。\n\
    \  當我們皮膚的膠原蛋白流失、肌肉張力造成的細紋，也讓黑眼圈更加深色。這種黑眼圈主要就是改善凹陷外觀，如果臥蠶、眼袋、眼眶凹陷是天生的，也就沒辦法做預防。而細紋產生的陰影，能夠藉著保養和按摩來修護。如果硬要改善天生的狀況，也有以下的改善方式：\n\
    臥蠶太肥：注射肉毒桿菌。\n淚溝太深：注射填充物。\n眼袋太大：眼袋內開／外開手術。\n眼窩凹陷：動手術非常困難，建議用化妝修飾。\n眼部細紋：動態紋則注射肉毒，靜態紋則填充物質。\n\
    \  不過以上都是醫美手術的部分，費用、效果、手術風險都要再三考慮。不一定非得動刀改善黑眼圈，可以試著用化妝進行修飾。\n  怎麼判斷黑眼圈類型？\n用手摸：若是皮膚粗糙甚至有掉屑，則為色素型；有脂肪凸起為結構型。\n\
    用手壓：若是輕按後顏色變淡為血管型，但若是嚴重的血管型黑眼圈，通常不能由此測出（嚴重的話應該都看的到血管了）。\n照鏡子：若是上下眼皮都黑為天生色素型，有明顯凹陷為結構型。若確定是細紋造成的結構型黑眼圈，可以透過笑與不笑來判斷是動態紋或靜態紋。\n\
    \  因為常見的是混合型黑眼圈，可能包含了不只一種因素，不會是抹個保養品或按摩一下就能消掉的。要針對自己的黑眼圈類型，去作預防、保養、治療才是最完善的做法。\n\
    \  遇到眼霜、眼膜之類的產品，記得多了解產品成分跟自己的體質，進而改善黑眼圈狀態。因為沒辦法一下就治療完，透過各種保養預防的方式，才是對抗黑眼圈的最佳手段。\n\
    節錄自〈明日科學〉"
