- id: doc_113_高雄_左營_國文_g8s2e2_s5_30
  section: 5
  number: 30
  type: single
  page: 5
  stem: 30.「因為有很多天空的眼睛的微光，讓我們明顯地辨識黑夜裡島嶼的黑影。」這段文字所指稱的「天空眼睛」為何？
  options:
  - label: A
    content: 指引方向、守望船隻的耀眼燈塔
  - label: B
    content: 高掛在寬闊海上的皎潔月亮
  - label: C
    content: 小蘭嶼岸邊家家戶戶的閃耀燈火
  - label: D
    content: 點綴夜空，閃著微弱光芒的繁星
  group_stem: "（三）\n    因為有很多天空的眼睛的微光，讓我們明顯地辨識黑夜裡島嶼的黑影。我們繞過岬角的激流湧浪，避免頂流迎波。已故的小叔在船尾穩穩地掌舵，星羅棋布的星星，微光在他厚厚的肩背反光，清爽的夜色，柔軟的海面恰是飛魚季節正常的氣候。\n\
    \    划了一百多槳的光景，小蘭嶼在星空下成了凸出於海面的影子，祖靈休憩的島嶼。九人十槳，動作整齊劃一是經驗豐富的槳手們的組合和默契，各個皆顯得精神抖擻，意志堅定。暗流湧浪讓航道曲折，約莫划了三百多槳時，海流流經的海面的吸氣與吐氣的間隔拉長了，海面吸氣時，船身便浮在浪頂，吐氣時便盪到浪谷。開始的當頭，也許是四、五十槳吧，我們十個人並未意識到海的吸氣、吐氣是正醞釀脾氣。已故的舵手─小叔，氣宇堅定地站立操舵，而坐在船首的我卻感覺到波峰與波谷拉長了距離之不祥預兆，涼涼的風吹拂我們熱熱的臉。\n\
    \    海在吸氣時，我們的船身被抬到最高點，發現高度竟然與船尾的小蘭嶼的影子同高；海吐氣時，船在深深的、黯黑的波谷，除了天空的眼睛在頂頭外，四周竟發出吵……吵……的浪影呼氣，似是惡靈的鼻息音。起初的情景在星光\
    \ 的照射下，並未令我們這些經驗豐富的槳手有一絲的恐懼。然而，海浪的吸氣、吐氣的間隔越來越長，在這段期間，迎頭趕上的浪頭煞似一座小島的黑景就要淹沒我們的船的感覺，也像惡靈伸出舌頭地令人毛骨悚然，陰魂不散。我們划著船，所有的人感覺海浪的呼吸，就著微弱的星光，我看清楚船慢慢地被浮在浪頭，十個船員動作一致地向前傾且握緊槳使力地划，爾後又慢慢地推往波谷，我們又往後仰，但停止划槳，波峰與波谷的落差高度大約有二、三十公尺，恐懼在心海孕育。我難以形容迎頭趕上的整座浪頭就要吞沒船隻的心境，一波又一波的，我們所有的航程就是在這個過程中進行。也許，已故的小叔心中也充滿恐懼吧！\n\
    \    已故的小叔不斷激勵我們，而我們也像傻蛋般拚命的划。雨下得好像天空破了大洞似的狂洩，雲層低得看不到四公尺後掌舵的已故的小叔。我害怕，害怕惡靈太靠近我，我用手摸摸比雨水溫暖的海，讓她記憶我們的勇敢。很久、很久地划，我們真的累了。突然，已故的叔父說，說得很大聲：「我們就要抵達我們的島嶼了。」\n\
    \    我們像沒有心臟，也像大傻蛋又拚命的划七、八十槳後，已故的小叔命令我們停止搖槳，且說：「我們又回到原來返航的原點─小蘭嶼。」我猶如被捕上船的飛魚，瞬間喪失了對海洋的迷戀，彼時，只能用「死」來形容我的疲憊與對海洋的「恨」。\n\
    \  船懸宕在岬角的激流上，誰也有搖動櫓槳的勇氣。是淚、是汗、是雨、是沉默、是黑夜、是飛魚，是什麼東西吸引我們來在海上，夾擠在烏雲下與浪頭上折磨體力呢？\n\
    節選自 夏曼．藍波安 〈海浪的記憶〉"
