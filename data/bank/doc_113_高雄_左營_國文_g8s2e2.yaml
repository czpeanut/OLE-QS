- id: doc_113_高雄_左營_國文_g8s2e2_s5_28
  section: 5
  number: 28
  type: single
  page: 5
  stem: 28.根據【甲文】，下列描述何者正確？
  options:
  - label: A
    content: 沈括認為王維的〈袁安臥雪圖〉是意境罕見的佳作
  - label: B
    content: 沈括認為書畫之妙，關鍵在於描摹技術的高超
  - label: C
    content: 沈括認為王維四季不分，故畫作中常存有嚴重錯誤
  - label: D
    content: 沈括以形象、位置及彩色這幾點來評論王維的畫作
  group_stem: "（二）\n【甲文】 〈書畫之妙〉\n沈括\n  書畫之妙，當以神會，難可以形器求也。世之觀畫者，多能指摘其間形象、位置、彩色瑕疵而已，至於奧理冥造者，罕見其人。如彥遠〈畫評〉言：「王維畫物，多不問四時，如畫花往往以桃、杏、芙蓉、蓮花同畫一景。」余家所藏摩詰畫〈袁安臥雪圖〉，有雪中芭蕉，此乃得心應手，意到便成，故其理入神，迥得天意，此難可與俗人論也。\n\
    節選自《夢溪筆談．卷十七．書畫》\n【乙文】〈美的藝術〉\n朱光潛\n  談詩與畫的關係，不能不提到王維，只因為蘇軾對其詩與畫的評論：「味摩詰之詩，詩中有畫；味摩詰之畫，畫中有詩。」不僅是因為王維詩中的禪意與畫境，還因其對中國水墨山水畫的開創性貢獻。王維獨創潑墨山水，發揮了水墨在山水畫中的重大作用，把中國山水畫推向了一個新的高度，形成了中國獨有的畫類形式和獨特的藝術表現形式，與西方的風景畫相區分。\n\
    \  長期的貶謫與隱居，加上王維自身特有的畫家素質與禪學修養，使他對山水的審美感受力有很高的靈敏性和深刻性，筆下的景物達到了與自然契合無間的程度。正因為如此，後人多重視的是王維的山水之作。例如他寫的落日夕陽之景，黃昏時的光影變幻，雲色濃淡，時常引發讀者的詩情畫意。\n\
    節選自朱光潛《談美書簡》"
