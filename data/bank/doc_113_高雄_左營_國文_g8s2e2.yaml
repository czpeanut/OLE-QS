  group_stem: "（四）\n    希臘一直是我嚮往的國度。終於成行後，雅典理所當然的成為第一站。朋友幾年前曾到此一遊，早從他口中略知一二。雖然已對這裡沒什麼期望，但還是忍不住要把它繫上邋遢髒亂的標籤。所幸在這逗留不久，第二天我們就前往邁泰奧拉。不知何故，「邁泰奧拉」這名字總給人一種剛中帶柔的韻味。據資料顯示，幾百年前這裡不過是片汪洋，長年累月的地殼運動和海水衝擊才逐漸把它「變為」石林。\n\
    \    斜陽映照著佇立在月台上的我，把目光投向前方，我彷彿看到了邁泰奧拉那七折八繞的山路，深不可測的山谷，刀削般的懸崖峭壁，還有那股隱匿其間的孤絕氣息。回望自身，我們好像都對外面的世界充滿無限憧憬與遐想，至於現狀，怎麼看都不甚滿意似的。\n\
    \    我們常想：「小時候多好，無憂無慮，自由自在。」只是一個冰淇淋、一個巧克力、一個氣球，就樂不可支。當時的我們，怎麼都傻憨憨的，好像完全沒有不開心的回憶，對於「未來」為何物更懵然無知，是不是因為這樣，也就變得特別享受「當下」了?而愈長愈大後，欲望愈來愈多，就這樣被一種營營逐逐的生活模式牢牢困住。殫精竭慮，馬不停蹄，只為了一個又一個的目標，因而，兒時常有的美好感覺便在不知不覺間慢慢消失殆盡。\n\
    \    交纏於忙碌之餘，我們也就忘了，原來惱人的事換個角度看，往往有不同的心情體會。有句名言：「境隨心轉則悅，心隨境轉則煩。」有時候，單純享受當下，把心安頓好就好，不是嗎?\n\
    改寫自筱琳子〈境隨心轉〉"
