- id: doc_113_高雄_五福_數學_g9s1e2_s1_1
  section: 1
  number: 1
  type: fill
  page: 1
  stem: '伸縮型的工作梯可以調整梯子長度，以便解決梯子與地面的夾角問題。例如，若登高的牆面高度固定時，則：

    ❶ 梯腳離牆越近，梯子與地面的夾角越大，需要的梯子越短，但坡度會越大，也就是越陡。

    ❷ 梯腳離牆越遠，梯子與地面的夾角越小，雖然坡度越小，但需要的梯子長度越長。

    如圖，有一個長5公尺的梯子，牆面高4.2公尺，

    品謙利用計算機求出幾個角度的邊長比近似值如下：

    |  | 40° | 45° | 50° | 55° | 60° | 65° |

    |---|---|---|---|---|---|---|

    | sin | 0.642 | 0.707 | 0.766 | 0.819 | 0.866 | 0.906 |

    | cos | 0.766 | 0.707 | 0.642 | 0.574 | 0.5 | 0.423 |

    品謙搬來一個伸縮型的工作梯，長度範圍是3.8到5.2公尺。如果要讓梯子的頂端放到牆的頂端時，梯子與地面的夾角等於60度，則梯子的長度要調整為幾公尺？請四捨五入取近似值到小數點以下第一位。'
