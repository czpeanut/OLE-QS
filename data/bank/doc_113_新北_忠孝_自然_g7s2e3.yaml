  - label: B
    content: 農業採用輪、休耕和有機栽培,可兼顧經濟與生態保育
  - label: C
    content: 為了發展沿海工業區,必要時可遷移黑面琵鷺的棲息地
  - label: D
    content: 在河谷建造水壩可以儲水、防洪、發電,百利無一害,對經濟發展十分重要,所以應多建水庫
