- id: doc_113_新北_忠孝_自然_g7s2e3_s3_48
  section: 3
  number: 48
  type: single
  page: 4
  stem: 下列何者是熱帶雨林儲存養分異於其它森林生態系的主因?
  options:
  - label: A
    content: 光合作用較高
  - label: B
    content: 蒸散作用旺盛
  - label: C
    content: 物質循環快速
  - label: D
    content: 呼吸作用旺盛
  group_stem: '國際環保團體發起了一項抗議速食連鎖店的活動,希望他們停止使用來自中南美洲的進口牛肉,巴西亞馬遜地區消失的森林總面積,從1990 年時的4150
    萬公頃,擴大為2000 年的5780萬公頃,短短10 年內消失的森林面積就相當於葡萄牙的兩倍大,而在過去兩年期間,更有將近　485　萬公頃的雨林遭到破壞,相當於每分鐘破壞　11　座足球場大小的雨林,研究人員指出,這個趨勢與巴西快速成長的牛肉產業有很大的關係!

    被摧毀的亞馬遜雨林,許多已成為牧場,森林消失的現象與畜牧業大幅的增加有關,統計發現,巴西亞馬遜地區的牲口數量,從1990年的2600萬頭增加到2000年的5700萬頭,增加超過一倍,而在過去6年中,巴西的牛肉出口亦增加超過5倍!

    熱帶雨林的生態和土壤與溫帶森林不一樣,熱帶雨林的養分都儲存在樹木裡,而非土壤中,因為在溼熱的熱帶環境中,萬物容易腐朽,熱帶雨林地上的落葉與倒樹會很快的腐朽被分解,以滋養其他物種,重新返回生命系統中,不像溫帶森林,死亡的動植物分解慢,會堆積形成厚且肥沃的土壤,因此在熱帶雨林土壤上農耕或畜牧根本是殺雞取卵,因為養分只存在樹木裡,一旦樹木消失了,整個生態系都將崩潰,拉丁美洲為了發展畜牧業,會放火焚燒並夷平森林改成草地,放養牛群於其中,而開發的放牧地過了幾年就會變得貧瘠而無法長出牧草,不得不再另外破壞森林開發新的牧場,在惡性循環下,使熱帶雨林大量消失!

    估計自中美洲外銷漢堡牛肉一噸,相當於破壞掉一公頃熱帶雨林的代價,而一棵　60　呎高的大樹,樹下大約有　20~30　種小樹苗,數以千計會來到這裡覓食休憩的上百種昆蟲、鳥類、爬蟲類、哺乳類,還有不計其數的苔蘚、蕈類會遭受到破壞,生物多樣性會急速喪失,引發大規模物種的滅絕!

    根據上文,回答下列48~50 題:


    圖為亞馬遜大片森林遭砍伐、焚燒,

    只為了清空林地用於建置牛牧場,製造肉品'
  shared_asset: g3_48_50
  tags:
    chapter:
      publisher: 南一
      book: 七下
      subject: 生物
      code: 4-5
      title: 生態系的類型
      chapter: 第4章 生物與環境的交互作用
    textbook: 七下生物 4-5 生態系的類型
    labeled_by: ai
