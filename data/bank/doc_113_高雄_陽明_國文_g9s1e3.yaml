- id: doc_113_高雄_陽明_國文_g9s1e3_s3_40
  section: 3
  number: 40
  type: single
  page: 8
  stem: 下列何者並非作者在陽關所看到的景象?
  options:
  - label: A
    content: 烽火高臺
  - label: B
    content: 楊柳青青
  - label: C
    content: 群山積雪
  - label: D
    content: 沙坡土墩。
  group_stem: '文人的魔力，竟能把偌大一個世界的生僻角落，變成人人心中的故鄉。他們薄薄的青衫裡，究竟藏著什麼法術呢？

    今天，我衝著王維的那首〈渭城曲〉，去尋陽關了。出發前曾在下榻的縣城向老者打聽，回答是：「路又遠，也沒什麼好看的。這雪一時下不停，別去受這個苦了。」我向他鞠了一躬，轉身鑽進雪裡。

    一走出小小的縣城，便是沙漠。除了茫茫一片雪白，什麼也沒有，連一個褶皺也找不到。在別地趕路，總要每一段為自己找一個目標，盯著一棵樹，趕過去，然後再盯著一塊石頭，趕過去。在這裡，睜疼了眼也看不見一個目標，哪怕是一片枯葉，一個黑點。於是，只好抬起頭來看天。從未見過這樣完整的天，一點兒沒有被吞食，被遮蔽，邊沿全是挺展展的，緊紮紮地把大地罩了個嚴實。有這樣的天，天才叫天。有這樣的天，地才叫地。在這樣的天地中獨個兒行走，侏儒也變成了巨人。在這樣的天地中獨個兒行走，巨人也變成了侏儒。

    天竟晴了，風也停了，陽光很好。沒想到沙漠中的雪化得這樣快，才片刻，地上已見斑斑沙底，卻不見溼痕。天邊漸漸飄出幾縷煙跡，並不動，卻在加深，疑惑半晌，才發現，那是剛剛化雪的山脊。

    地上有一些奇怪的凹凸，越來越多，終於構成了一種令人驚駭的鋪陳。我猜了很久，又走近前去蹲下身來仔細觀看，最後得出結論：那全是遠年的墳堆。這裡離縣城已經很遠，不大會成為城裡人的喪葬之地。這些墳堆被風雪所蝕，因年歲而塌，枯瘦蕭條，顯然從未有人祭掃。它們為什麼會有那麼多，排列得又是那麼密呢？只可能有一種理解：這裡是古戰場。

    我在望不到邊際的墳堆中茫然前行，心中浮現出艾略特的《荒原》。這裡正是中華歷史的荒原：如雨的馬蹄，如雷的吶喊，如注的熱血。中原慈母的白髮，江南春閨的遙望，湖湘稚兒的夜哭。故鄉柳蔭下的訣別，將軍咆哮時的怒目，丟盔棄甲後的軍旗。隨著一陣煙塵，又一陣煙塵，都飄散遠去。我相信，死者臨死時都面向朔北敵陣的；我相信，他們又很想在最後一刻回過頭來，給熟悉的土地投注一個目光。於是，他們扭曲地倒下了，化作沙堆一座。

    這繁星般的沙堆，不知有沒有換來史官們的幾行墨跡？堆積如山的中國史籍，寫在這個荒原上的篇頁還算是比較光彩的，因為這兒是歷代王國的邊遠地帶，擔負著保衛華夏疆域的使命。所以，這些沙堆還鋪陳得較為自在，這些篇頁也還能嘩嘩作響。就像眼下單調的土地一樣，出現在這裡的歷史命題也比較單純。在中原內地就不同了。那兒沒有這麼大大咧咧鋪陳開來的坦誠，一切都在花草掩蔭中發悶，無數不知為何而死的冤魂，只能悲憤懊喪地深潛地底，使每片土地都疑竇重重。相比之下，這片荒原還算榮幸。

    遠處已有樹影。急步趕去，樹下有水流，沙地也有了高低坡斜。登上一個坡，猛一抬頭，看見不遠的山峰上有荒落的土墩一座，我憑直覺確信，這便是陽關了。樹愈來愈多，開始有房舍出現。這是對的，重要關隘所在，屯紮兵馬之地，不能沒有這一些。轉幾個彎，再直上一道沙坡，爬到土墩底下，四處尋找，近旁正有一碑，上刻「陽關故址」四字。

    這是一個俯瞰四野的制高點。西北風浩蕩萬里，直撲而來，腳是站住了，卻分明聽到自己牙齒打戰的聲音，鼻子一定是立即凍紅了的。呵一口熱氣到手掌，捂住雙耳用力蹦跳幾下，才定下心來睜眼。這兒的雪沒有化，當然不會化。所謂古址，已經沒有什麼故跡，只有近處的烽火臺還在，這就是剛才在下面看到的土墩。土墩已坍了大半，可以看見一層層泥沙，拌和著一層層葦草。葦草飄揚出來，在千年之後的寒風中抖動。向前俯視，是西北的群山，都積著雪，直伸天際。我突然覺得，自己是站在大海邊的礁石上，那些山，全是冰海凍浪。（節錄自余秋雨〈陽關雪〉）'
