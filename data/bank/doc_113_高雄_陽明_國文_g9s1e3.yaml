  stem: 〈有關氣候變遷的難題〉一文中，最後作者提及美國東北部印第安 易洛魁族人「大律法」，其用意為何？
  options:
  - label: A
    content: 可效法印第安 易洛魁族人環境保護的各種方法
  - label: B
    content: 「大律法」最有可能解決氣候變遷的種種困境
  - label: C
    content: 呼籲各國學習偏遠部落民族對環境的崇敬之心
  - label: D
    content: 提醒大家需以更長遠的眼光看待氣候變遷問題。
  group_stem: '伊朗西南的城市阿瓦士（Ahvaz）創下了53.7 度的高溫，幾乎破了地球近年來的高溫紀錄。同一時間，熱浪席捲西班牙和葡萄牙，引起森林大火，造成六十四人死亡，上千人被迫撤離家園。

    這一連串罕見的全球酷熱氣候，對比於美國總統在白宮宣佈退出全球一百九十五個國家在二〇一五底共同簽訂的〈巴黎協定〉時，在座各方政要群起鼓掌慶賀，不禁讓人錯以為身在另一個星球。

    因此氣候變遷已經變成信者恆信，不信者恆不信。因為議題太抽象遙遠，因果太錯綜複雜，一般人無從判斷，信或不信只好憑直覺，少有理性分析。

    人類真的有能力減緩氣候變遷嗎？

    氣候是一個複雜系統，雖然多年來全球眾多科學家窮畢生智力，建立各種理論甚至複雜的模擬模型，總是不能周全，讓懷疑論者有機可乘，其中還有許多素有名望的科學家。提出各種質疑。例如
    MIT 知名學者 Richard Lindzen，便在二〇ㄧ七年二月聯合了三百位「科學家」共同署名，建議總統退出〈巴黎協定〉。這些氣候變遷的否定者大致抱持論點：真正造成地球溫度增加的原因是太陽，而不是人類，因此透過改變人類生活方式以扭轉氣候變遷的人為努力必然徒勞無功。

    誰才應該付出代價？

    氣候變遷對各國威脅不同。氣溫上升，北方國家不免心中竊喜，酷寒的冬季轉為宜人的季節，房地產價值上升，經濟成長，居民多不至於反對。此外，先進國家或人口密集的城市雖然是氣候變遷的加害人，真正的受害者卻遠在世界各偏僻的角落，例如非洲、中東的沙漠，氣候本來嚴熱，氣溫持續上升，更不宜居住。許多大洋洲或加勒比海各小國，平均高度十公尺，當海平線升高一公尺，國土面積馬上減半。當加害人與受害者兩無關連，加害人自然漫不經心。

    當氣候變遷碰上政治與國際

    貿易有國界，氣候問題無國界。國際間可以有各種雙邊、多邊的貿易協議、合作條約，發生爭議，有各種國際仲裁組織甚至國際法庭可以調解。然而氣候問題總是需要全球參與，共識雖有道德約束，卻沒有法律責任，一九九二年全球簽訂了〈京都協議〉，美國政府從未正式追認，二〇一五年〈巴黎協〉簽訂，歐巴馬總統參與簽了字，接任的總統卻可以不認帳。

    這種反反覆覆，正反應了氣候變遷雖然是全球問題，卻因為缺乏全球治理機制，以致於氣候變遷從建立共同信念、形成政策、到付諸行動，層層都是關卡。

    為第七代子孫著想

    美國東北部印第安 易洛魁族人有一個大律法（great law）：族人在討論公共事務時，應隨時將第七代後人的福祉放在心中。七代人，相當於一百五十年。

    我們希望居住在什麼樣的地球？而現在的我們又該做什麼決定？

    (節選自鄭志凱〈有關氣候變遷的難題〉）'
