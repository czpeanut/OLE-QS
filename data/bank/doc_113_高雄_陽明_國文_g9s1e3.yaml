- id: doc_113_高雄_陽明_國文_g9s1e3_s3_44
  section: 3
  number: 44
  type: single
  page: 10
  stem: 關於本文的說明與解讀，最適切的是：
  options:
  - label: A
    content: 醬油應該是和宋代「炒」的烹飪方式同時出現
  - label: B
    content: 現今日本料理的方式，主要是向宋人學習而來
  - label: C
    content: 先秦時尚未出現醬油，而主要是以芥醬來搭配各種食材
  - label: D
    content: 孔子「不得其醬不食」，反映他堅持只吃芥醬的偏執。
  group_stem: '《論語‧鄉黨》孔子「不得其醬不食」。孔子在世時，豆豉、豆醬和醬油還沒出現，他老人家所吃的醬，主要是芥醬和各種醢，如肉醬、蛤醬、魚醬等搭配，久而久之就約定成習，甚至形成一種「禮」，隨意搭配非但不合味，也顯得粗野不文。這或許就是「不得其醬不食」的真義。

    豆豉、豆醬和醬油出現後，先秦的各種醬，逐漸走入歷史。使用醬油，是中國菜的特色之一。在宋代以前，烹飪以蒸、煮、炸、烤為主，醬油主要作為蘸料，和現今的日本料理差不多。到了宋代，鐵鍋開始普遍，「炒」成為常用的烹飪方法，醬油成為入味的作料。大量使用醬油的「紅燒」，可能也是由宋代開始的，東坡肉就是個典型的例子。

    將大豆磨碎、濾除渣滓，就成為豆漿。豆漿是一種膠體，加入電解質（如石膏、鹽滷），就會產生凝析作用。以壓榨的方法去除多餘的水分，如壓榨較輕，就成為豆花；如壓榨較重，就成為豆腐。

    豆腐再經進一步壓榨，可製成豆腐乾。豆腐乾經過發酵，可製成豆腐乳等食品。

    豆腐據說是淮南王 劉安發明的，他至今仍是豆腐業的行業神。最早的記載見五代 謝綽的《宋拾遺錄》：「豆腐之術，三代前後未聞有此物，至漢 淮南王始傳其術於世。」劉安是道家人物，水法煉丹時偶然中發明豆腐不無可能。也有人認為豆腐起源於唐末或五代。到了宋代，豆腐已極普遍，南宋
    吳自牧《夢粱錄》卷十六〈酒肆〉：「更有酒店兼賣血臟、豆腐羹、熝螺螄、煎豆腐、蛤蜊肉之屬，乃小輩去處。」可見南宋的臨安，豆腐羹和煎豆腐已成為市井小民的食品。

    （改寫自張之傑《課堂上沒教的科學知識‧豆腐和醬油》）'
