- id: doc_113_高雄_七賢_自然_g7s2e1_s3_46
  section: 3
  number: 46
  type: single
  page: 5
  stem: 海月水母從水母體產生水螅體的過程，請問屬於何種生殖方式？
  options:
  - label: A
    content: 孢子繁殖
  - label: B
    content: 營養器官繁殖
  - label: C
    content: 出芽生殖
  - label: D
    content: 有性生殖
  group_stem: '【題組五】請回答46~47題

    在歷經一番波折之後，阿綸終於變回了王子。有一天阿綸與小咪一起到愛河邊散步，就在願景橋附近，他們發現了大量的海月水母，由於海月水母的體內特徵，乍看之下就像是四葉幸運草的形狀，他們兩人覺得很有興趣，於是上網
    google 了有關海月水母的相關資訊。

    海月水母(學名: Aurelia aurita，又稱月亮水母)是海月水母屬下的一種水母。海月水母的水母體是透明的，一般直徑約25~49公分，有4條明顯的馬蹄狀生殖腺。它們會用觸手來捕捉獵物，如水母體、浮游生物及軟體動物。但觸手的活動有限，牠們也只是會隨波逐流。

    - 海月水母的水母體有呈傘狀的膜及連於底部的觸手。

    - 牠們胃部下有四個鮮明的環形生殖腺。

    - 食物會進入到其垂管，而輻水管則幫助擴散食物。

    - 牠們有一層中膠層，胃循環腔內有胃皮及表皮。

    - 神經網絡負責控制肌肉及覓食反應。

    - 海月水母的世代交替:

    水螅體世代:由受精卵發育出水螅體，其固著在海底或其它基底上，並將觸手向上延伸，進行捕食及防禦行為。

    水母體世代:水螅體發育成橫裂幼體後，逐漸分裂出七個碟狀幼體，再由碟狀幼體逐漸發育成水母體，其飄浮在水體中並拖曳著觸手到處捕食，當環境變化大時，會釋放精子與卵至水中。'
