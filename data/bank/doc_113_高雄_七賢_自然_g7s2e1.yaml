- id: doc_113_高雄_七賢_自然_g7s2e1_s3_48
  section: 3
  number: 48
  type: single
  page: 6
  stem: 請問在進行「玉蘭花鳳梨」的新品種培育過程中，雄配子是來自哪一個品種的鳳梨？
  options:
  - label: A
    content: 金鑽鳳梨
  - label: B
    content: 牛奶鳳梨
  - label: C
    content: 土鳳梨
  - label: D
    content: 芒果鳳梨
  group_stem: '【題組六】請回答48~50題

    時序已是春季，鳳梨的盛產季節即將到來。阿綸與小咪決定一同造訪鳳梨的重要產地—嘉義縣民雄鄉。


    每年5、6月是鳳梨產季，嘉義縣民雄鄉「阿美鳳梨」21年前開始自行培育新品種鳳梨，從上千個育種當中，挑選成果實形狀、口感、香氣等最優品種，其中「玉蘭花鳳梨」因花腔猶如玉蘭花形狀而得名，食用時可聞到淡淡花香味，果肉細緻如牛奶鳳梨般白嫩，又具有如土鳳梨般的酸甜滋味，每年產量約1萬餘顆，雖單顆(約1.5公斤)產地價達百餘元，仍受到頂級客群青睞，默默暢銷已超過10年。農場主人阿美為2003年神農獎得主，兒子陳映延傳承母親的精神，鑽研鳳梨培育，致力於轉型與提升產業，透過建立
    SOP，進行田間系統化管理，不噴灑荷爾蒙，使用自製的營養液，以減少化學肥料與農藥的使用，運用技術，調節種植時間，讓大家一年四季都能吃到好吃的鳳梨，兒子陳映延也於2020年榮獲神農獎的肯定。


    「阿美鳳梨」執行長陳映延是鳳梨農第三代，除傳承家族鳳梨產業，也致力於研發鳳梨新品種，他表示:鳳梨育種過程並非想像中容易，因為大多數育種會失敗，經「萬中選一」挑出優秀種苗後持續育種，再調整栽種技術讓品質、產量穩定;2001年以牛奶鳳梨為父本、土鳳梨為母本雜交培育出玉蘭花鳳梨，到2006年才長出第一顆果實，2012年品質、產量都穩定後，才正式上市販售。目前全台灣只有在「阿美鳳梨」，才買得到「玉蘭花鳳梨」喔!「阿美鳳梨」除了金鑽鳳梨、牛奶鳳梨、芒果鳳梨外，自行培育出的新品種還有琉璃鳳梨、水蜜桃鳳梨、櫻桃鳳梨、百香果鳳梨等，其中玉蘭花鳳梨栽種時需悉心呵護，隨氣候變化、地質特性，隨時調整水量、濕度、溫度、肥料成分等，種植面積約3分地，年產量約18公噸;由於玉蘭花鳳梨有淡淡花香，花腔猶如玉蘭花形狀，且果肉偏白、細緻，還具土鳳梨的酸甜滋味，不只是執行長與媽媽的最愛，也是在「阿美鳳梨」自行育種的鳳梨中銷售最佳的一種。'
