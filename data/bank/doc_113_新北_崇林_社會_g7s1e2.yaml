    現已26 歲的男子阿國指控父親阿華，婚後就不務正業還嗜賭成性，常常數日不回家，不僅未曾提供家庭生活費用，還多次對他及母親施暴，讓他們母子生活在恐懼中。當時一家三口的阿國才念國小一年級，母親獨力賺錢養家，直到阿國國小三年級為止，阿華仍從未支付生活費，就連阿國生病也是由母親帶去看醫生，阿華不聞不問。

    阿國七年級時父母離婚，母親搬離這個家，阿國就交由祖母單獨扶養照顧，父親在他的成長過程中長期缺席。阿國長期不滿父親阿華未盡人父之責，因此憤而向「■」訴請免除對父親的扶養義務，阿國的成長經歷讓他覺得若之後有婚姻，誓言要扮演好父親的角色，絕不能在孩子的學習過程中缺席。【113.11.9
    中時新聞網】'
