  group_stem: '| 資料一 | 延平郡王(鄭成功)攻下臺灣後，巡視已投降歸順的原住民部落，並加以安撫。以部將十人管「社」事，分新港、目加溜灣、蕭壟、麻豆為四大社，並與之貿易。
