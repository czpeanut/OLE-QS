  stem: 等高線地形圖是一種最常用的地形表示方法，下列關於等高線地形圖的敘述，何者錯誤？
  options:
  - label: A
    content: 等高線的水平間距愈密集，表示坡面愈平緩
  - label: B
    content: 在同一張等高線地形圖上，等高線間距值相同
  - label: C
