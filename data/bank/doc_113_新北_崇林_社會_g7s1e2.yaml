  group_stem: 臺中霧峰林家發跡於第三代林甲寅，他生於乾隆47 年(1782 年)，幼年因遭逢亂局，家族瀕臨破產，從原先的大里杙(一ˋ)(今臺中大里區)移居至阿罩霧(霧峰)，重新展開經營。之後的林家後代又以「軍功」起家，林文察協助平定同治初年的「民變」，得朝廷賞賜全福建省（包含台灣）的樟腦專賣權；光緒10
    年(1884 年)，林朝棟協助平定侵臺的「外夷」有功，林家更受朝廷重用。
