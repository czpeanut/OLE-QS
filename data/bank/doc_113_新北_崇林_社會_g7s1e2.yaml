  group_stem: 思思在圖書館資料室閱讀了一封西元1653 年的信件，部分內容翻譯如下：「我們接到閣下寄來的信了，得知漢人企圖顛覆福爾摩沙的荷蘭當局，深感驚駭，並頗感焦慮。所幸這場叛亂已被察覺，並加以鎮壓撲滅。為此，我們要永遠讚美上帝之名。同時，我們懷疑那些刁民若不是受到某些有力人士的支持或煽動，應該不至於起而謀反，但迄今尚未有明確的證據可以證明此種猜測。公司相當幸運，當地的原住民對我們非常忠誠，英勇的消滅了這些叛亂分子。……」
