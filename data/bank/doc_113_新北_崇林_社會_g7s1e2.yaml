    | 資料三 | 鄭氏繼荷而至，立法嚴格，殺戮不分男女老幼……。今大肚、牛罵(今台中清水區的舊稱)、大甲、竹塹(今新竹地區的舊稱)諸社，草木叢生、土地荒廢不見一人……。
    【郁永河《裨海紀遊》】 |'
