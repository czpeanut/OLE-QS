- id: doc_113_新北_桃子腳_社會_g9s2e1_s2_49
  section: 2
  number: 49
  type: single
  page: 5
  stem: 關於米老鼠的版權問題，下列敘述何者正確？
  options:
  - label: A
    content: 任何與老鼠有關的創作皆須迪士尼授權
  - label: B
    content: 通過「米老鼠保護法」可使創作流通共享
  - label: C
    content: 著作物權利保護期限延長與否關乎公益與私益間的平衡
  - label: D
    content: 著作物權利保護期限延長有助於藝術家自由自在的創作
  group_stem: "【題組六】請閱讀下文，回答49-50 題\n「我自由了！」迪士尼初版蒸汽船米老鼠駛入公共領域\n米老鼠的版權束縛於2024 年1 月1\
    \ 日結束，第一個版本的米老鼠將進入美國公共領域。然而米老鼠版權複雜，進入公共領域的版本僅包括早期設計，不包括後來的變化版，所以現代設計的米奇版本仍然受版權保護。\n\
    公共領域的概念旨在讓藝術家和思想家在短期內能夠掌控其作品並從中獲益，同時在長期來看藝術家也能自由地在彼此的創意基礎上創作。迪士尼過去在製作白雪公主和灰姑娘等童話改編作品時就受益於這種概念。\n\
    然而，1998 年美國通過版權期限延長法案，1998 年後的著作物權利保護期限基於舊法之上再延長20 年。這條法律延遲了初版米老鼠登場的蒸汽船威利號進入公共領域，也被戲稱為「米老鼠保護法」，但儘管得名於米老鼠，但這項法案的支持者並非僅有迪士尼。米老鼠的情況成為版權保護延伸的象徵，加強迪士尼透過智慧財產保護法獲得的利益，也引發了對於公共領域米老鼠的法律界限的爭議。\n\
    \      ——陳愷昀，《地球圖輯隊》"
