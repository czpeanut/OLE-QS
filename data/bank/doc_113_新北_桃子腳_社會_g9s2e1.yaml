  stem: 在全球化的趨勢下，下列選項何者可能是上文作者所關心的面向？
  options:
  - label: A
    content: 國家經濟發展與環境保護之間兩難的抉擇
  - label: B
    content: 全球化使得各國有公平交流與發展的機會
  - label: C
    content: 為了取得便宜的農產品，剝削是必要之惡
  - label: D
    content: 全球化的跨國公司可能是另類的殖民主義
  group_stem: '【題組五】請閱讀下文，回答46-48 題

    「香蕉共和國」：拉美蕉民有可能擺脫殖民帝國、貿易商創造的剝削體系嗎？

    20 世紀初的拉丁美洲國家極度依賴香蕉出口產值提振國內經濟，這些國家雖然脫離殖民情境，但仍倚賴過去殖民母國提供的經濟機會，這個機會多半來自於經濟作物生產。母國的跨國食品公司掌握國內香蕉完整供應鏈包括農作物的生產及運輸，他們快速地收購當地農民及政府的土地，要求農民以較低的勞動成本，生產農產品銷往母國，使得蕉農只能沉淪於生產價值鏈的底層受到貿易商剝削，低收入更使得這些國家無法推動產業轉型，只能持續性進行香蕉產業換取微薄的收入維持生活。這種經濟結構被稱為「香蕉共和國」。

    雖然臺灣未准許東南亞、中南美洲香蕉大量進口，但世界絕大多數的香蕉，都來源於跨國食品公司在東南亞、拉丁美洲的種植。我們享受到便宜的香蕉時，也可以嘗試想想看在遙遠的農田，可能有群農民辛勤的種植香蕉，卻連白米飯都吃不起，這些生產過程沒有道德，而且是存在事實。——改寫自吳書毅，《The
    News Lens 關鍵評論網》'
  tags:
