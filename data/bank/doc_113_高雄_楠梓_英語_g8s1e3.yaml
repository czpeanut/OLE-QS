  section: 3
  number: 49
  type: single
  page: 4
  stem: （ ）49. Jenny wants to play volleyball with friends on the sand. Which is the
    rule in a beach volleyball?
  options:
  - label: A
    content: The first two sets are for twenty-five points.
  - label: B
    content: There are five players on each team.
  - label: C
    content: Men can wear tank tops to join the game.
  - label: D
    content: Each game in a beach volleyball has two sets.
  group_stem: "【C】There are some common volleyball rules below.\n1. Each team can\
    \ touch the ball up to three times. Then, the ball has to go over the net.\n2.\
    \ Players cannot touch the net with any body part.\n3. Games usually have three\
    \ sets. The first two are for twenty-five points, and the third is for fifteen\
    \ points.\n     If you want to play volleyball on the sand, try beach volleyball.\
    \ For this game, you only need two players on each team. It’s easy to gather some\
    \ friends and hit the beach for a game. However, it’s hard to move quickly and\
    \ balance on the sand because it’s soft.\n     In a beach volleyball, most of\
    \ the rules are the same as volleyball. However, there are some differences. For\
    \ example, men usually wear tank tops and shorts, and women wear swimsuits. Like\
    \ volleyball, each game has three sets. The first two are twenty-one points, and\
    \ the third is for fifteen points.\n    In Taiwan, places such as Penghu and Waimushan,\
    \ Keelung are famous for this sport."
