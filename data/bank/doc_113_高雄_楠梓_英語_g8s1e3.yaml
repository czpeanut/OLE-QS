  group_stem: '【D】Hundreds of thousands of Christmas trees are needed during Christmas.
    Some people choose to use living trees because they believe that it’s “greener”
    then using plastic trees. But some don’t agree. People throw the trees away after
    Christams. A lot of greenhouse grass are released. However, a plastic tree can
    be used for years. This leads to the question: which is better for the Earth?
    Living Christmas trees or plastic Christmas trees?

    Someone think of an idea: reusing a living Christams tree. Scott Martin, the founder
    of The Living Christmas Company provides people Christmas trees with another choice.
    When Scott was young, he used to sell Christmas trees as his part-time job. People
    were very happy when they came to pick trees for their families before Christmas.
    But after the holidays he saw the trees being discarded and put on the streets
    waiting for garbage trucks. He thought this was wasteful. Now he plants the trees
    in the pots and then rents the trees with pots during Christmas, when people come
    back to rent trees for the holiday.

    Christmas comes and goes every year, but trees shouldn’t die with the passing
    holidays. They do their jobs as Christmas trees in December, and then they go
    back to grow up for the rest of the year. After all, they weren’t born for Christams,
    but to be trees.

