  group_stem: '【素養題】請仔細閱讀下列文章，回答38~40 題：

    摩擦起電效應不再惱人－

    摩擦奈米發電機的誕生與演化

    摩擦奈米發電機在近幾年的重點研究方向，包含如何克服元件在工作時不會受到濕度效應的影響，以及接觸材料因長時間工作而有的耗損問題。我們提出的一個解決方法是利用液體來取代傳統的固體當作接觸材料，也發現此舉可以大幅降低前面提到摩擦奈米發電機的缺點。我們假設以水為液體組成當作例子，此時的固體材料最好就具備疏水表面的特質，而一般生活中常用的疏水材料就是聚四氟乙烯
    (俗稱鐵氟龍，英文名稱為Polytetrafluoroethene，縮寫為PTFE)。兩種可能的機制為如下圖，(a)為當水滴的表面已經帶電；(a)為當水滴表面不帶電。我們以(a)為例做下列詳細解釋：

    ◇ 當水滴的表面已經帶電

    當水滴在與聚四氟乙烯接觸前，常會因已與環境中的其它介質接觸而導致帶電。若我們以單電極的摩擦奈米發電機為例子，則下圖中的四個步驟分別代表：

    (i) 當帶電水滴與聚四氟乙烯接觸時，便會造成與地電極間的電位差，導致電子從地電極流向摩擦奈米發電機的導電電極，而產生電輸出。

    (ii) 因導電電極與帶電水滴達到電位平衡，而不再有電輸出。

    (iii) 當帶電水滴離開聚四氟乙烯時，會造成電位差的減小，使得電子會從導電電極流回地電極，也產生電輸出。

    (iv) 最終回歸到原始狀態，等待下一波帶電水滴的到來。


    文章摘自

    撰文者：林宗宏、黃名證、葉晨'
