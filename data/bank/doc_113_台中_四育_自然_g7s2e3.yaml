  - label: D
    content: 前肢特化為翼。
  group_stem: '國立屏東科技大學野保所鳥類生態研究室，近年來著手推廣田間猛禽生物防治法，在農田裡推廣巢箱、棲架等綜合性的鼠害防治的概念，該原理主要以利用貓頭鷹及老鷹的食性和生態系中的功能，在田間的小樹林設置貓頭鷹巢箱及農田空曠處架設猛禽棲架，試圖增加田間貓頭鷹及老鷹的停留時間，希望能夠協助農民降低田間鼠類密度。這可是讓農民降低老鼠藥使用的另類選擇，也能呼應政府推廣有機、友善農作物，降低田間農藥及鼠藥使用的精神。

    屏科大社會責任計畫(USR)與遠雄人壽企業社會責任(CSR)相互聯手，自110 年起，兩方共同合作在屏東縣高樹鄉六處無毒鳳梨田區架設貓頭鷹巢箱和棲架，開啟「守護億隻鴞」的行動，以「鴞旺來」推廣貓頭鷹與鳳梨間的減用鼠藥、推廣猛禽生物防治法的概念，受到社會大眾關注；更在屏東縣政府及超市通路商的幫忙下，以「貓頭鷹鳳梨」的品牌概念，在超市推廣吃鳳梨護生態的理念，多方支持將大學及各企業的社會責任相互結合，一方面提高民眾對生態的關注力，一方面期待能共同加乘出生態對田間減少用藥的影響力。屏科大期望能將猛禽棲架的生物防治理念推廣給全台更多的農民，友善農業與猛禽保育也能同步落實。       《文章改編自：國立屏東科技大學-媒體報導「從猛禽保育研究到生物防治法的推廣之路」》'
