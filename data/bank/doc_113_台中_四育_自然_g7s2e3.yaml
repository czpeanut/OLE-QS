- id: doc_113_台中_四育_自然_g7s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 依據本文敘述及課程所學，下列何者正確？
  options:
  - label: A
    content: 壁蝨的身體可分為頭、胸及腹三部分，且具有三對步足
  - label: B
    content: 皮膚一旦被壁蝨附著，需盡快將其捏死以降低傷害
  - label: C
    content: 壁蝨的外骨骼無法隨著柔軟的身體一起長大，需進行蛻皮
  - label: D
    content: 每年秋冬時節是壁蝨大量爆發的時刻，使用石油膠能有效將其去除。
  group_stem: '常在草叢或山林活動，以及家裡有養寵物的人，可能都看過一種跟蜘蛛同綱的微小生物，牠就是壁蝨(Tick，也叫蜱蟲)，不僅會附在人和毛小孩的皮膚上，尤其在春至夏的月份更是容易看到牠。壁蝨能以人類或其他哺乳動物的血為食物，吃飽了就會悄悄脫落，一般而言，壁蝨並不會危害人的身體健康，但也有的情況會觸發過敏反應和疾病傳染，造成搔癢感、傷口疼痛及灼熱、起泡或起膿、皮疹(Rash)、發燒、頭痛、肌肉和關節疼痛、肌肉無力、疲勞，嚴重還會有呼吸困難的症狀。

    要正確地將壁蝨從皮膚上移除，其實只要用小鉗子輕輕地往上拉即可，訣竅是要夾在其頭部，但注意不要在拔除的過程中扭轉它，這可能會導致壁蝨的嘴巴部位殘留在皮膚裡。拔除後，請記得用肥皂和水將傷口洗乾淨，並將壁蝨置於酒精中殺死，此外，千萬別用火或石油膠(Petroleum
    jelly)試圖逼它脫落，或是用手指將其捏死。儘快拔除才是最安全的做法！

    為了避免皮膚被壁蝨附上，前往草叢和山林等地方時，先確保服裝和鞋子不會外露，顏色則選擇淺色更容易察覺到，皮膚和衣服都使用驅蟲劑，並且於活動結束後儘快洗澡，確保身體乾淨清爽。        【文章取材於
    hello 醫師 官網】'
  tags:
    chapter:
      publisher: 康軒
