- id: doc_113_台中_四育_自然_g7s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: (甲)吸盤狀口器；(乙)鰓蓋；(丙)管足；(丁)脊椎骨；(戊)魚鰾；(己)肺。請問野翼甲鯰具有上述哪些構造呢？
  options:
  - label: A
    content: 乙戊
  - label: B
    content: 甲乙丁戊
  - label: C
    content: 甲丁己
  - label: D
    content: 甲乙丙丁戊己。
  group_stem: "野翼甲鯰又稱為琵琶鼠魚、清道夫或垃圾魚，廣泛棲息於河川中下游流速緩慢的水域、溝渠、池塘或湖泊，常群體聚集。屬於硬骨魚的野翼甲鯰，是底棲性碎屑雜食性魚，利用特化的吸盤狀口器刮食附著性的微小藻類生活。對於水質的污染容忍度很高，在低溶氧的中度污染水域仍可見其蹤跡。原產於南美洲\
    \ 馬德拉河流域，在臺灣被引進作為觀賞魚和水族箱的藻類清除者，但後來逸散到野外，因為它們的體型較大，全身覆蓋著硬質骨板，不易被其他魚類捕食，再加上對環境的適應性強，使得野翼甲鯰在臺灣的許多淡水水域中快速擴散，與本地的原生魚類競爭，對生態造成影響。\n\
    \                                                                          《文章改編於\
    \ 全球入侵種資料庫網站》"
