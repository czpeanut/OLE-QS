- id: doc_113_台中_四育_自然_g7s2e3_s1_43
  section: 1
  number: 43
  type: single
  page: 4
  stem: 依據本文及課程所學，請判斷下列何者不是森林的功能？
  options:
  - label: A
    content: 降低暴雨對土壤的直接沖刷
  - label: B
    content: 提供野生動物棲息環境
  - label: C
    content: 透過旺盛的蒸散作用帶走空氣中的懸浮微粒
  - label: D
    content: 吸收二氧化碳、減緩全球暖化。
  group_stem: '臺灣山地的特色為山高谷深、斷層綿密、地勢陡峭。經調查全臺灣有4000公頃土地原屬於森林，現在因做為農業用地、建築用地、遊憩用地及道路開發等用途而遭開發利用。山坡地不當或過度開發會衍生出土石流、水庫淤積減少蓄水、河川水庫優養化及破壞生物棲地危及生態平衡等問題。

    森林具有涵養水源、淨化空氣、穩固國土、調節氣候等功能。森林可以吸收二氧化碳減緩全球暖化現象。近年來臺灣山林在極端氣候下的暴雨加上地震作用下，山坡地崩塌及水土流失越來越嚴重。森林植被是水土保持的最後一道防線。據統計森林被砍伐後，土壤流失率增加100倍、每公頃流失160噸土石，一棵樹樹冠旁邊的範圍都是樹根可以抓得到的，這是果樹、檳榔樹等淺根植物無法做到的。所以如何保護森林，在經濟開發與森林保育之間達到平衡是現在國土規劃刻不容緩的問題。'
  tags:
