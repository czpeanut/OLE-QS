- id: doc_113_台中_四育_自然_g7s2e3_s1_32
  section: 1
  number: 32
  type: single
  page: 3
  stem: 依據本文的敘述，何者錯誤？
  options:
  - label: A
    content: 生物圈二號的實驗證明人類已經有能力創造像地球一般穩定運作的環境
  - label: B
    content: 除了政府的力量，也有許多企業加入推動生物多樣性的行列
  - label: C
    content: 為了守護地球環境，許多國家聯合簽署氣候變遷或生物多樣性等公約
  - label: D
    content: 生物圈二號因為生物滅絕、氣體濃度失衡等問題而宣告失敗。
  group_stem: "1990 年代，美國富豪艾德．巴斯在美國亞利桑那州打造一處人造封閉生態系統，名為「生物圈二號」，實驗人類能否在有限生態條件下自給自足生活；兩年後實驗失敗，證明默默服務人類的地球生態系統的珍貴。對比地球自然環境的「生物圈一號」，人造的「生物圈二號」僅1.27\
    \ 公頃，用4000 個物種構成雨林、沼澤等生態系統，花掉近兩億美元，結果發現糧食不足、傳粉動物和19 種脊椎動物滅絕、氧氣濃度下降、二氧化碳濃度飆高等問題。\n\
    聯合國1992 年舉行地球高峰會，除了簽署「聯合國氣候變遷綱要公約」，相約強化氣候治理，各國也首度簽署「生物多樣性公約(CBD)」，至今已有196 個締約方。大會主席暨哥倫比亞環境部長蘇珊娜．穆罕默德指出，氣候變遷和生物多樣性密切相關，必須採取雙重行動：除了脫碳，實現公正能源轉型，還要恢復大自然，才能真正穩定氣候。\n\
    臺灣2023 年已通過施行「氣候變遷因應法」，將2050 淨零目標入法，但面對更複雜的生物多樣性挑戰，未見法制面進一步行動。企業為了永續發展，也需加大投入推動生物多樣性的力度。例如台達電近年將生物多樣性納入經營策略，與海洋科技博物館攜手復育東北角珊瑚、成立臺灣首座零碳珊瑚保種中心。台達電也將在CBD\
    \ COP16 進行跨國交流。\n                                            《文章改編於 2024-10-15\
    \ 聯合報「生物圈實驗示警 物種滅絕人難獨活」》"
