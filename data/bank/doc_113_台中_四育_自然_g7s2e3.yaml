- id: doc_113_台中_四育_自然_g7s2e3_s1_25
  section: 1
  number: 25
  type: single
  page: 3
  stem: 從文中提及的袋熊食性，請推測牠在生態系中可能扮演何種角色？
  options:
  - label: A
    content: 生產者
  - label: B
    content: 初級消費者
  - label: C
    content: 次級或三級消費者
  - label: D
    content: 分解者。
  group_stem: '袋熊是澳洲特有種，生活在南方草原或乾燥林地，屬於袋熊科(現存有三種袋熊)。袋熊的大小約一隻小豬或中大型犬，體型粗壯，四肢短而有力，個個都是挖洞高手。袋熊的洞穴除了自我防禦，也能提供適當的溫度。袋熊白天多待在地洞內，夜晚才出來覓食，可避免高溫與掠食者。袋熊的食物以草類、根莖、樹皮及樹葉為主。這些粗糙的食物不容易消化，所幸，袋熊演化出特殊的消化系統與機制，能有效分解植物纖維。

    至於袋熊的生殖，是典型有袋類的方式。袋熊通常每胎生一隻，胚胎只在母體子宮內住20 多天，小寶寶就出生了。這時，體長不到兩公分的寶寶，會慢慢爬進媽媽的育兒袋，從乳頭中吸取乳汁繼續發育…

    袋熊是可愛又稀有的有袋動物，其中一種北方毛鼻袋熊因為面臨棲地破壞和獵食者的威脅，屬於極度瀕危(CR)狀態，目前族群大小不到300 隻。                            《文章改編自：中學生報
    第633 期-「可愛又稀有的袋熊」》'
