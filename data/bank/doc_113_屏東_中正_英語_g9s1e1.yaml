  stem: What is the main idea of the reading?
  options:
  - label: A
    content: Halloween is one of the best family holidays of the year.
  - label: B
    content: “Trick or treat” is popular with all kinds of kids.
  - label: C
    content: A bit of knowledge and kindness can go a long way for some kids on Halloween.
  - label: D
    content: Blue pumpkin buckets are more common and more fashionable these years.
  group_stem: "(四)                                A New Halloween Color \nHalloween\
    \ is one of the best family holidays of the year. The kids get to have fun \n\
    with costumes, friends and trick-or-treat. But Halloween doesn‛t look the same\
    \ for \neveryone. While you‛re giving out candy to all the boys and girls during\
    \ trick-or-treating \nthis year, keep an eye out for kids with a blue Halloween\
    \ candy bucket. \nIn recent years, blue has become a new color for Halloween buckets.\
    \ What does a \nblue Halloween bucket mean? It all began with Alicia Plumer and\
    \ her 21-year-old boy. He \nloves Halloween a lot, but he is autistic and has\
    \ problems getting along with people. Alicia \nknew some people would have problems\
    \ with that, so she came up with the idea of a blue \nHalloween bucket in 2018,\
    \ instead of the more common orange pumpkin bucket. She \nthought that when people\
    \ saw it, they would know the person had special needs. Then she \nposted it on\
    \ Facebook, and people were deeply touched and shared it over 28,000 times. \n\
    We‛re all pretty used to the normal Halloween night practices when it comes to\
    \ \ntrick-or-treat. Kids ring the doorbell, say “trick or treat” and quickly receive\
    \ some candy. \nBut, it‛s important to notice that some children with special\
    \ needs may be nonverbal. \nBecause of this, saying “trick or treat!” as soon\
    \ as the door is opened may not happen, but \nthat doesn‛t mean that child doesn‛t\
    \ still deserve the best Halloween candy . Seeing the \nblue bucket and being\
    \ aware is the most important step! \nNow, a blue Halloween bucket has become\
    \ a sign for kids with special needs. Just \na bit of knowledge and kindness can\
    \ go a long way for some kids on Halloween.  \n   autistic 自閉（症）的; normal 普通的;\
    \ nonverbal 非語言的; deserve 值得; aware 覺知"
