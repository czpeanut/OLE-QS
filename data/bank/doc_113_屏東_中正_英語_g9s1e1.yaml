- id: doc_113_屏東_中正_英語_g9s1e1_s5_6
  section: 5
  number: 6
  type: single
  page: 3
  stem: In which country have fortune cookies been a popular dessert?
  options:
  - label: A
    content: Japan.
  - label: B
    content: China.
  - label: C
    content: French.
  - label: D
    content: America.
  group_stem: "(三) \n  Have you ever tried fortune cookies?  In fact, they’re not\
    \ just cookies.  Let’s learn more about them. \n  It was a long tradition for\
    \ the Japanese to make cookies with eggs, butter, sugar, and flour.  Around the\
    \ \n1900s, they began to put little notes in cookies to tell a person’s fortune.\
    \  At that time, they became a part of \nthe food culture there.  With this tradition\
    \ in mind, Makoto Hagiwara started to make fortune cookies in the \nUSA. \n  Before\
    \ the 1950s, bakers often made fortune cookies either with their hands or with\
    \ chopsticks, so it took \nthem a long time to make the cookies.  That changed\
    \ when Shuck Yee, a Chinese American, invented a \nmachine to make the cookies\
    \ faster.  This made them popular at Chinese restaurants across the USA. \n  Today,\
    \ many Chinese restaurants in the USA serve fortune cookies at the end of a meal.\
    \  They are well-\nknown not for their taste, but for their sayings.  Here are\
    \ some common fortunes: \nThe world belongs to hard-working \npeople. \n \nIf\
    \ you want the rainbow,  \nyou must put up with the rain. \n \nDig your well before\
    \ you are \nthirsty. \n \n  When you take a trip to the USA, don’t forget to try\
    \ a fortune cookie at a Chinese restaurant and check \nout your fortune. \n \n\
     fortune 運氣 tradition 傳統culture 文化 invent 發明 serve 供應"
  shared_asset: g5_6_8
