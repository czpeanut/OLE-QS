- id: doc_111_彰化_埔心_國文_g8s1e1_s2_26
  section: 2
  number: 26
  type: single
  page: 2
  stem: 關於這篇文章的寫作方法，下列敘述何者正確？
  options:
  - label: A
    content: 善於運用對話技巧，凸顯母女性格的差異
  - label: B
    content: 全文採順敘手法，寫出對母親的種種回憶
  - label: C
    content: 文章多處化用典故，使得文字凝鍊雅致
  - label: D
    content: 透過視覺與嗅覺的摹寫，引出孺慕之情。
  group_stem: '含笑花的美，是潔淨的。那清淡、若有似無的花香，卻令人覺得心酸。因為那種寡靜的香氣，有過世母親的氣味。

    我是個奇怪的女兒。母親在世時，和她沒完沒了的爭吵。母親過世之後，我處處在花香中，看到母親的影子，嗅到她的氣味，感覺到她處處隱含的形影。

    母親是個無懈可擊的日式婦女，做甚麼事都完美得一絲不苟，即使打一個結—粽子上的結、鞋帶上的結—也必須打得工整又完美。頭髮梳得整齊，衣服穿得得體，鞋子一塵不染。供桌上，每天，鮮花蔬果擺得周正美觀。自小到大，我最愛看母親布置供桌。尤其節慶大拜拜時，她領著女傭，做出一大桌極費工夫的菜餚，擺得豐盛美麗。她從庭院親手栽植的花草中剪下花枝插瓶供奉，多半是白色的香花：含笑、茉莉、夜來香或一整盆蘭花，使供桌顯出富泰又莊麗、清寂又潔淨的氛氳。

    這種氛氳在母親辭世兩年來，時時盤桓在我腦中。

    含笑花清寂的香氣裡，有母親清顏的回憶。回鄉時候，在朋友家的庭院裡，不期然邂逅的含笑花。

    「你家的含笑花在對我微笑哩！」我對窗內的朋友喊道。

    猛一回頭，似乎看到母親的身影飄拂過我眼角。愛花的母親和我，不期然在朋友家庭院一角的含笑花旁相遇。母親的身影拂著花香冉冉而退。

    含笑花飽滿如玉色手，心相合的姿態，好像若有所悟，又若有所思。

    那是一個微雨的清晨。

    （改寫自洪素麗 含笑）'
