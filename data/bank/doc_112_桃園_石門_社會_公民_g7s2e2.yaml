- id: doc_112_桃園_石門_社會_公民_g7s2e2_s3_39
  section: 3
  number: 39
  type: single
  page: 4
  stem: 根據上述，下列哪一項說明可體現「民意如流水」的狀況？
  options:
  - label: A
    content: 大眾運輸不該開放給身體不適的民眾
  - label: B
    content: 設置博愛座源自於對弱勢者的保護
  - label: C
    content: 社會大眾擁有禮讓老弱婦孺的觀念
  - label: D
    content: 民眾對博愛座的設置與否產生變化。
  group_stem: 39-40 題 政府為保障身心障礙者權益於交通運輸工具設置博愛座，民眾也已培養讓座老弱婦孺的觀念。但近年來，「到底誰能坐博愛座」的爭議卻一再發生，新聞時有報導，部分身體不適的民眾坐上博愛座之後，受到其他乘客嚴厲譴責與驅趕，甚至發生肢體衝突。社群網路和媒體所做民調顯示，許多民眾認為博愛座的設置有廢除或改革的必要，因此許多政府單位開始宣導，博愛座人人可坐，只要是有需要者都能坐。
