  group_stem: "閱讀下列資料，請回答 33.～35. 題：\n    紅藜為臺灣原生種植物，是原住民的傳統作物，多被當作釀製小米酒的酒麴原料，19 世紀初，臺灣面臨嚴重旱災時，還是重要的救命糧食。\n\
    \    現代經學者研究發現紅藜富含極佳且全面的營養價值，可代替稻米、麵粉、豆類，可作為食品中醣類來源，紅藜也富含多種養分，如：蛋白質、鈣、鎂、鉀等，故紅藜有「穀類的紅寶石」的美名，而所含膳食纖維則高達地瓜的\
    \ 7 倍、也達燕麥的 3.4 倍，各種營養成分都名列前茅，可以說是樣樣兼具的超級優等生，成了近年來接納度頗高的健康食材。"
