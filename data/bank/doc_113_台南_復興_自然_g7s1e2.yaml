  section: 2
  number: 6
  type: fill
  page: 5
  stem: '請根據所學，判斷「血紅素」是位於人體血液何處？答：____(6)____。

    (甲)血漿中    (乙)紅血球中    (丙)白血球中    (丁)血小板中。'
  group_stem: "■請在閱讀下列敘述後，回答下列 6.～7. 題：\n    有些住宅為求方便，將瓦斯熱水器裝設在浴室或是不通風的陽臺上。其實這是十分危險的設計措施，因為在不通風的空間燃燒瓦斯，容易使瓦斯燃燒不完全，而產生無色無臭的一氧化碳，人體吸入後，由於一氧化碳比氧氣更容易與血紅素結合，與一氧化碳結合後的血紅素便失去攜帶氧氣的能力，嚴重時會造成人體缺氧而死亡。若能及早發現，將病患送至醫院，仍可利用高壓氧進行治療，使血紅素恢復攜氧能力。"
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
