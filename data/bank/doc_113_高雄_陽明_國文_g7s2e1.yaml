  stem: 根據上文，「床頭捉刀人」是指誰?
  options:
  - label: A
    content: 崔季珪
  - label: B
    content: 曹操
  - label: C
    content: 間諜
  - label: D
    content: 使者。
  group_stem: "捉刀英雄\n        魏武①將見匈奴使，自以形陋，不足雄遠國，使崔季珪代，帝自捉刀②立床頭。即畢，令間諜問之曰: 「魏王何如?」匈奴使答曰:「魏王雅望非常③。然床頭捉刀人，此乃英雄也。」魏武聞之，追殺此使。\n\
    \                                                                            \
    \                   選自《世說新語》\n注釋:① 魏武:曹操。② 捉刀:握刀。③ 雅望非常:美好的容儀，不同一般。"
