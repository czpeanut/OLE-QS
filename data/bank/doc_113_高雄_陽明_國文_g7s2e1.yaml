  section: 2
  number: 23
  type: single
  page: 3
  stem: 以下是四位同學對「近體詩」格律所做的比較，請問何人敘述最正確？
  options:
  - label: A
    content: 小陽﹕一首五言律詩共有四十個字，一首七言絕句則有二十個字
  - label: B
    content: 小明﹕絕句的首句末字必須押韻，律詩則可押可不押
  - label: C
    content: 小國﹕律詩的中間兩聯一定要對仗，絕句則不可以對仗
  - label: D
    content: 小中﹕無論是絕句或律詩，偶數句的末字都一定要押韻，且必須一韻到底。
