  section: 2
  number: 35
  type: single
  page: 5
  stem: '我的研究方法，總是在一個固定的時點上切一橫斷面，在下一個時點上再切一個橫斷面，然後比較這兩個橫斷面相異之處，再在其中尋求變動的主因及變化的現象。因此我這工作最重要的是選時點，而選時點則往往取決於個人的主觀意識，甚至帶有冒險性的意味，有時也可能因為原選的橫切面不恰當而導致觀察錯誤。因此，歷史研究的主觀性使歷史學無法成為精密的科學。（許倬雲《中國古代文化的特質》）


