  - label: C
    content: 被腰斬的∕說是最挺拔的∕被剝削的∕說是最甜美的—— 甘蔗
  - label: D
    content: 我擁有各式大小橫直的數字∕電腦計算機總算不清這筆帳∕我沒有生命∕但∕收拾生命——電話。
