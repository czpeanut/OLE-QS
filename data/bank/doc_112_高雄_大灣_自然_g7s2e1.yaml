  stem: '人類的 ABO 血型是由一對遺傳因子（等位基因）控制，而控制此血型的遺傳因子有 $I^{A}$、$I^{B}$ 和 i 三種型式，其中 $I^{A}$
    和 $I^{B}$ 是顯性，i 是隱性，血型和基因型的關係如表(一)所示。表(二)為甲～丁四組父母的血型配對，在不考慮突變的情況下，則表(二)中的何種組別可能生下
    AB 型血型的子女？


    表(一)

    | 血型 | 基因型 |

    | --- | --- |

    | A | $I^{A}I^{A}$ 或 $I^{A}i$ |

    | B | $I^{B}I^{B}$ 或 $I^{B}i$ |

    | AB | $I^{A}I^{B}$ |

    | O | ii |


    表(二)

    | 組別 | 雙親父 | 雙親母 |

    | --- | --- | --- |

    | 甲 | A | A |

    | 乙 | A | B |

    | 丙 | O | AB |

    | 丁 | O | O |'
