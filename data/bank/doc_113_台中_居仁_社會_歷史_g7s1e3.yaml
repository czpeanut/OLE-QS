  number: 2
  type: single
  page: 1
  stem: 下圖是臺灣委託英商製作的一款郵票，卻因故只能堆積在倉庫中沒有使用。後來臺灣火車通車後因來不及印製火車票，決定將倉庫中的郵票註記起點站與終點站，充當火車票使用。請問清朝統治臺灣期間，火車票上註記的起點與終點，哪一組最為合理呢？
  options:
  - label: A
    content: 基隆─臺北
  - label: B
