  - label: B
    content: B
  - label: C
    content: C
  group_stem: '(六) 清帝國時期漢人移民積極拓墾臺灣，尚有不少地名沿用至今。請將下列地名沿革的代號填入49、50 題：

    A、本地早期是由開墾者合資向官方領取證照，招募人手開墾，開墾完畢後以墾首分得的份名為地名，故稱「頭份」（今苗栗縣 頭份市）。

    Ｂ、本地早期為原住民活動區域，清初便有先民來此開墾，因為在此設土牆防禦原住民的襲擊，因此稱為「土城」（今新北市 土城區）。

    C、本地名由來是本地拓墾完成後，大地主派人在此設立收租、辦公的地方，因此稱為「公館」（今苗栗縣 公館鄉）。'
