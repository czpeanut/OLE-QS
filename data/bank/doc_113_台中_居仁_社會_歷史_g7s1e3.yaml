  section: 1
  number: 10
  type: single
  page: 1
  stem: 清帝國統治時期，臺北芝山岩附近曾爆發大規模械鬥事件，雙方戰鬥慘烈，傷亡眾多。事後，這次衝突的死難者被葬在一起，即今日芝山岩的「同歸所」，安奉孤魂野鬼。關於當時在芝山岩附近的械鬥相關敘述，何者說法正確？
  options:
  - label: A
    content: 起因會黨聚眾起事、官吏貪汙不公、官民利益衝突
