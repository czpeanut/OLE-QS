  section: 1
  number: 6
  type: single
  page: 1
  stem: 清朝祭祀無主孤魂的有應公廟四處林立，由於早期移民來臺生活不易，經常發生械鬥。因為過去一般人認為死去的靈魂若無神主牌，無後代祭祀，不但會變成孤魂野鬼無法超生，而且會作祟危害人間，形成臺灣「有應公信仰」。請問此一信仰最可能反映出，當時社會發生械鬥的主要因素為何？
  options:
  - label: A
    content: 要求臺灣建省
  - label: B
    content: 對抗外來宗教
  - label: C
    content: 爭奪經濟利益
  - label: D
    content: 抵制鐵路建設
