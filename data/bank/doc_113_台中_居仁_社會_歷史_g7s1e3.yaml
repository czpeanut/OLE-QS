  stem: 下圖海報是臺灣中部近年來都會舉辦的觀光活動。此活動原是感謝開圳先人辛勞的祭典，由身手矯捷者擔任引水人在水圳內等待，等良辰吉時一到，上游開啟水閘放水，此刻宣洩而出的圳水直流而下，這時引水人則要趁水勢到來前，在水圳內一直往前奔跑，此過程就是「跑水」。後來配合行銷觀光，就變成水上馬拉松活動了。請問上述的水圳是指？
  options:
  - label: A
    content: 貓霧捒圳
  - label: B
    content: 瑠公圳
  - label: C
    content: 曹公圳
  - label: D
    content: 八堡圳
