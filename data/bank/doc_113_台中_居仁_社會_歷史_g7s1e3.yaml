  type: single
  page: 1
  stem: 阿綵在課堂上解說「阿兩是清乾隆末年的人，從原鄉泉州府遷到臺灣府居住。他育有六子，死後留下公產二甲作為祭祀公業，由六房輪流耕作，輪值耕作公田者，負責該年祭祀祖先的費用。」請問阿綵正在解說哪個「宗族組織」？
