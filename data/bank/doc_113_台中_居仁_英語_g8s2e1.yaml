- id: doc_113_台中_居仁_英語_g8s2e1_s5_43
  section: 5
  number: 43
  type: single
  page: 4
  stem: What must an escape room have?
  options:
  - label: A
    content: Special lights, sounds, and props.
  - label: B
    content: Some kind of treasure.
  - label: C
    content: A missing person.
  - label: D
    content: A story.
  group_stem: '(43-45) From ABC Magazine


    Escape rooms are fun places with interesting themes and challenging puzzles. There
    are three important parts of an escape room: the story, the puzzles, and the layout.
    According to the story, players might need to find a missing person, search for
    treasure, or stop bad guys. The exciting stories guide players through the game.
    Puzzles often include letters, numbers, and patterns. Some puzzles are easy to
    solve, while others are more difficult. The layout is how the escape room is arranged.
    Players need to be able to move around easily and find the puzzles in the right
    order. If the layout doesn’t make sense, players may have trouble and lose interest.
    To keep players’ interest and attention, escape rooms often use special lights,
    sounds, and props.


     crime scene 犯罪現場；code 密碼；mission 任務'
