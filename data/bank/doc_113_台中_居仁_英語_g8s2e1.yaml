- id: doc_113_台中_居仁_英語_g8s2e1_s5_40
  section: 5
  number: 40
  type: single
  page: 4
  stem: Why does polar bear fur look white?
  options:
  - label: A
    content: It is very soft
  - label: B
    content: It has ice to cover it.
  - label: C
    content: It reflects light.
  - label: D
    content: It has white paint on it.
  group_stem: 'Do you know that February 27th is Polar Bear Day? This day helps us
    learn about polar bears, the largest bears in the world. Male bears can weigh
    up to 800 kg and grow 3 meters tall. Also, they are strong hunters and live in
    the cold Arctic. Did you know their coat is not really white? Their skin is black,
    and their coat has no color. The coat reflects light, so they look white. This
    helps them hide in the snow.

    Polar bears have thick fat and a coat to help them stay warm in the cold. Thanks
    to those, they are hard to be seen with special heat cameras. Their eyes have
    three eyelids to block the bright sunlight in the snow. Besides, they are also
    very strong. A polar bear’s bite is stronger than a great white shark! Polar bears
    also have a great sense of smell and can find food or prey one kilometer away,
    even under the ice.

    Polar bears are good swimmers. They can swim more than 100 kilometers without
    stopping! They have two layers of coat. The outer coat keeps water away, so they
    don’t feel cold when and after swimming. They just shake their bodies, and they
    are dry again! What’s more, they do not need to drink water. They get water from
    their food.

    However, when the Arctic warms and ice melts, polar bears struggle to hunt seals.
    With less ice, finding food becomes more difficult. Besides, when people build
    more houses and roads in the Arctic, polar bears lose their natural homes. This
    makes it harder for them to find safe places to rest and raise their babies. Scientists
    say we must stop global warming to help polar bears, or we will only see them
    in the pictures or books.


     male 雄性；reflect 反射；fat 脂肪；eyelid 眼瞼；layer 層；melt 融化；seal 海豹'
