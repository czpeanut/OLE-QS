  group_stem: 'In September 2024, Instagram made Teen Accounts for users under 18.
    These accounts have special rules to keep young people safe online.

    First, Instagram blocks some content. Teen users cannot see videos of fights or
    plastic surgery. This helps keep them from bad content. Second, Instagram limits
    direct messages (DMs). Teens can only get messages from people they follow or
    who follow them. This stops strangers from sending messages and keeps young users
    safe. Instagram also has Sleep Mode. This turns off notifications from 10 p.m.
    to 7 a.m. It helps teenagers take breaks from social media and get enough sleep.
    Parents can also control Instagram use. They can set time limits, so their children
    do not spend too much time on the app. This helps young people have a better balance
