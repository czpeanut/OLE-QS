- id: doc_113_台中_居仁_英語_g8s2e1_s5_36
  section: 5
  number: 36
  type: single
  page: 3
  stem: 'In what orders does the writer talk about the following points in the reading?

    a: A disease spread

    b: The cold weather

    c: A volcano eruption'
  options:
  - label: A
    content: a➔b➔c
  - label: B
    content: c➔b➔a
  - label: C
    content: c➔a➔b
  - label: D
    content: b➔c➔a
  group_stem: 'Today, there are many problems in the world, like COVID-19 and wars
    in eastern Europe and the Middle East. You may think life is never so bad, but
    some historians say that the worst year in history was AD 536.

    According to historian Michael McCormick, AD 536 was so bad because of a big volcano
    eruption. It created a lot of ash into the sky, and the sky was dark for about
    18 months in Europe and Asia. A Roman writer, Procopius, said, “The sun gave light,
    but it was not bright.” Because of the volcano, the weather became colder. Summer
    was about 1.5℃ cooler. This small change made a big problem. Crops couldn’t grow,
    so people had little food. Many people became hungry and died. After that, a disease
    spread and killed one-third of the people in the Eastern Roman Empire.

    There have been many hard times in history, with wars, sickness, and money problems.
    But AD 536 could be the worst year in history because of the darkness, hunger,
    and disease.


     historian 歷史學家；volcano eruption 火山爆發；ash 灰燼；crops 農作物；disease/sickness 疾病'
