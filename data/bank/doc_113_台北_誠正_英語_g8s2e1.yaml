- id: doc_113_台北_誠正_英語_g8s2e1_s6_37
  section: 6
  number: 37
  type: single
  page: 2
  stem: Which is true about mushroom leather?
  options:
  - label: A
    content: We can only use it to make clothes.
  - label: B
    content: It is a traditional(傳統的) type of leather.
  - label: C
    content: It is expensive, so not many people use it.
  - label: D
    content: It looks almost the same as animal leather.
  group_stem: '(一)

    Many people want to help the Earth, and one new idea is getting popular—mushroom
    leather! Regular leather comes from animal skin, but mushroom leather comes from
    mycelium, the root-like part of a mushroom. This material is better for the planet
    because it does not hurt animals and makes less waste by using leftover food from
    farms.

    Mushroom leather is part of circular fashion. In circular fashion, people reuse,
    fix, or recycle materials to make less waste. Normal fashion makes a lot of waste
    because clothes often end up in the trash. Circular fashion helps the Earth by
    using eco-friendly materials like mushroom leather.

    Mushroom leather looks and feels like real leather. It is also strong, just like
    animal leather. Because of this, many fashion companies like it. They use it to
    make shoes, bags, and clothes. Mushroom leather is a great choice. It is fashionable,
    useful, and helps our Earth!

     root 根 material 材料 normal 一般的'
