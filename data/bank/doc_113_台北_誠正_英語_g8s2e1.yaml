- id: doc_113_台北_誠正_英語_g8s2e1_s6_40
  section: 6
  number: 40
  type: single
  page: 2
  stem: What does the reading say about animal jumping?
  options:
  - label: A
    content: Animals jump only with their front legs.
  - label: B
    content: Animals are better jumpers than people.
  - label: C
    content: Smaller animals jump as far as bigger animals.
  - label: D
    content: Animals jump to do exercise.
  group_stem: '(二)

    When we want to jump high or far, we need to practice. Animals can jump very well
    without practice. They are good at jumping from birth.

    A study about animal jumping shows that some animals can jump very far. When animals
    jump, they use their strong legs and muscles. They jump with their whole body.
    Smaller animals need to jump with more power to go as far as possible. For example,
    a tree frog can jump 150 times its own body length, a kangaroo rat 45 times its
    body length, and a lion about 5 times its body length. Bigger animals carry a
    lot of weight, and it''s more difficult for them to jump.

    For animals, jumping is not just for fun. It helps them stay away from danger
    and catch food. This skill is very important for their lives.

     muscle 肌肉 time 倍 length 長度 weight 重量'
