  stem: 瑋婷觀察爸爸在家中利用茶壺煮水時，茶壺內水量的多少似乎會影響水煮沸所需的時間，她假設當茶壺內水量越多，將水煮沸所需的時間也越多。若要驗證她的假設是否合理，下列哪一種實驗設計可直接用來驗證她的假設？
  options:
  - label: A
    content: 在完全相同的茶壺中，分別裝入不同水量，以同一個瓦斯爐的相同火力加熱，測量水從室溫加熱到沸騰所需時間
