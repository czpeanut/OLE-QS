  stem: '阿鴻認為維生素C 可預防感冒，為了求證，他將8000 人分成四組，

    表1

    | 組別 | | 感冒人數 |

    | :---: | :---: | :---: |

    | 甲 | 1 克糖 | 70 人 |

    | 乙 | 1 克糖＋200mg 維生素C | 74 人 |

    | 丙 | 1 克糖＋400mg 維生素C | 67 人 |

    | 丁 | 1 克糖＋600mg 維生素C | 72 人 |

    在一年中每人每天清晨吃一粒藥丸，成分和結果如上表1 所示，由此可說明下列何種結果？'
  options:
  - label: A
    content: 維生素C 有預防感冒效果
  - label: B
    content: 維生素C 與預防感冒無關
  - label: C
    content: 維生素C 含量愈高，預防感冒效果愈佳
  - label: D
    content: 維生素C 必頇與糖合併使用才能防止感冒
  answer:
  - B
