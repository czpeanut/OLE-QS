- id: doc_111_高雄_林園_自然_g7s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 北極熊的皮毛分為上下兩層，上層毛光滑而長，下層毛短而密，能鎖住空氣並防止水分滲入，北極熊的毛其實是透明的，藉以讓陽光透過透明的毛髮到達皮膚、以有效率地在體內儲存熱能。北極熊透明的毛髮在陽光及冰層的反射下成為白色，使牠們能夠在冰層上悄悄的跟蹤並突襲獵物。科學家觀察北極熊濃密毛髮下的皮膚，發現牠的皮膚竟然是黑色的，你認為黑色皮膚對北極熊適應極地生活有何幫助呢？
  options:
  - label: A
    content: 黑色可以吸熱
  - label: B
    content: 換毛時，體色可以變明顯
  - label: C
    content: 黑色皮膚在北極環境中是保護色
  - label: D
    content: 和毛色形成對比，可以有保護作用
  answer:
  - A
