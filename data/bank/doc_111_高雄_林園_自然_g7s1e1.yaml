  section: 2
  number: 46
  type: single
  page: 4
  stem: 依據本文，可知發現細胞核的是哪位科學家？
  options:
  - label: A
    content: 虎克
  - label: B
    content: 雷文霍克
  - label: C
    content: 布朗
  - label: D
    content: 許來登
  group_stem: "請閱讀以下文章，並回答第46～50 題，選出最適合的答案。\n  英國的虎克觀察到軟木塞的小格子，稱之為「細胞」，其實其所見的死亡的細胞壁所構成的空室，但無論如何，這算是細胞研究的開端。荷蘭的雷文霍克利用改良的透鏡發現到細菌。直到西元1831\
    \ 年，英國植物學家布朗更進一步觀察到，細胞內有一球狀的構造，並稱之為的「細胞核」。\n  西元1839 年，德國動物學家許旺在動物組織中觀察到細胞，他與另一位植物學家許來登提出「生物體至少由一個以上細胞組成」，換句話說，「細胞是生物體的基本單位」，此即「細胞學說（Cell\
    \ theory）」最早的雛形。此後德國的菲可醫生研究細胞的生長，更為確立細胞學說的內容：「生物體皆由細胞所構成，並且，細胞均來自原本已存在的細胞。」"
  answer:
  - C
  answer_source: answer_key_vlm
  tags:
