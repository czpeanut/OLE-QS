  stem: Why do soaps make humans attractive to mosquitos?
  options:
  - label: A
    content: Because of their pH level.
  - label: B
    content: Because of their flowery smell.
  - label: C
    content: Because they smell good.
  - label: D
    content: Because of the food we eat.
  group_stem: 'B.

    Do mosquitos always bite you? Some say it''s the pH level of our bodies. Others
    say it''s the food that we eat. Now, a new study says that soap might be why you''re
    so attractive to those mosquitos. When female mosquitos are not feeding on blood,
    they drink plant nectar. Nowadays, most soaps have fruity and flowery smells,
    just like nectar. When we use these soaps, we''re putting those smells on our
    bodies. This means to the mosquitos, we would smell like humans and flowers together.
    That''s very attractive to mosquitos! But the study also says the effects of soap
    are different on different people. So the scientists think that may be why even
    with the same soap, some people attract mosquitos, while others do not.

