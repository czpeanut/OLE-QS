  - label: B
    content: They were angry.
  - label: C
    content: They found it funny.
  - label: D
    content: They were afraid.
  group_stem: 'A.

    Picture this : You''re walking in the forest , and guess what you find? Piles
    and piles of pasta!

    This happened near a river in the US city of Old Bridge last month. No one knew
    how the pasta got there. And when the city cleaned it up, they found there were
    500 pounds of noodles. Pictures of the pasta were on Facebook, and many people
    found it funny. An Internet user joked that cleaning it up was "Mission Im-pasta-ble".
    And another joked , "Lead suspect is a guy named Al Dente." It turns out the suspect
    was not a guy named Al Dente, but a man who wanted to clean out his pantry. Neighbors
    say the city doesn''t have giant garbage pickup, which is a big problem. The man
    didn''t know how else to throw away all the pasta. The thing brought a lot of
    attention to the town''s garbage problem. The people there hope city authorities
    can provide better trash pickup services after this.

