  group_stem: '玄宗學隱形於羅公遠，或衣帶、或巾腳不能隱。上詰之，公遠極言：「陛下未能脫屣天下，而以道為戲，若盡臣術，必懷璽入人家，將困於魚服①。」玄宗怒，謾罵之。公遠遂走入殿柱中，極疏上失。上愈怒，令易柱破之。復大言於石潟中，乃易潟觀之，潟明瑩，見公遠形在其中，長寸餘，因碎為十數段，悉有公遠形。上懼，謝焉，忽不復見。後中使於蜀道見之，公遠笑曰：「為我謝陛下。」                          (段成式《酉陽雜俎》)

