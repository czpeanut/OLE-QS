- id: doc_113_高雄_龍華_國文_g9s2e1_s2_45
  section: 2
  number: 45
  type: single
  page: 7
  stem: 下列何者符合文中所謂「隨機性快樂」的遊戲？
  options:
  - label: A
    content: 射飛鏢
  - label: B
    content: 扭蛋機
  - label: C
    content: 魔術方塊
  - label: D
    content: 夾娃娃機
  group_stem: '打遊戲有三個境界。遊戲的第一個境界是好玩，首先是「現實感」或者是「超現實感」。一個遊戲讓人覺得好玩，憑的就是它能讓玩家特別逼真地「做事」。《魔獸世界》的一句宣傳口號是「做你從未做過的事」，我在現實生活中從來沒有機會拿一把斧子跟人對砍，從來沒使用過魔法，更從來沒騎乘過大鳥在天上飛。我從來沒指揮過軍隊，沒滅過別人的國家，實際上，我從來沒當過英雄。在遊戲裡我可以做這些事情，如同做了一個好夢。但這種超現實感只能短暫地吸引玩家，再好看的電影，每天都看一遍也會無聊。一個遊戲要做到有趣，要讓人一整天殺怪而不覺得煩悶，還有一個訣竅，叫做「隨機」。殺死一個怪物之前，你不知道它會掉落什麼。多數情況下可能只是一點布料和小錢，但存在某種可能性，它會掉落一件精良甚至史詩級的裝備。人們沉迷於這種隨機性，熱愛這種小意外，好賭，真是人的天性啊。

    遊戲的第二個境界是追求成就感。打贏一場仗，經驗值立即上升，戰利品立即到手。這個規則看似簡單，在現實生活中卻是非常少見的。即時的回報會給做事的人一個正向回饋，使他更投入地繼續工作，這種正向回饋一旦運行起來，只有人的生理極限才能限制他的工作強度。我們經常看到一個政府職員在上班時間悠閒地看報紙，而一個小商販卻可能在工資更低的情況下拚命地加班，其根本原因是這個小商販的每一個動作都可立即轉化為收益。即時正向回饋，就是遊戲上癮動力學。一個玩家一旦陷入這種即時正向回饋系統之中，他就成了遊戲的奴隸。我尊敬這樣的玩家，但有人可能會鄙視他們。

    另有一種玩家，卻是值得所有人敬仰，這就是遊戲的第三個境界――體育和科學的境界。進入這個境界的玩家不是「玩」遊戲，而是「訓練」，甚至是「研究」遊戲。他們不再對升級和獲得裝備之類的事情興奮，他們追求的是技藝。幾年前玩《魔獸世界》的時候，我看過很多這樣的玩家寫的技術文章，他們對每一次升級後的技能修改都敏感。他們試練作戰過程中最有效的攻擊方向和步法，比如說「威脅值」的計算公式，他們用科學研究的精神，去野外找怪物做實驗，然後把發現寫成一篇論文。達到這個境界的玩家把玩遊戲變成了一個體育運動，甚至是一項科學研究。他們可以反覆打某個單機遊戲中的同一張地圖而不覺枯燥，因為他們追求的不是簡單的快感，而是更高的技藝水平。他們彷彿在遊戲之中，又好像在遊戲之外。                  (改寫自萬維鋼〈打遊戲的三個境界〉'
