  type: single
  page: 5
  stem: '體重為衡量個人健康的重要指標之一，下表為成年人利用身高(公尺)計算理想體重(公斤)的三種方式，由於這些計算方式沒有考慮脂肪及肌肉重量占體重的比例，因此結果僅供參考。


    | | 女性理想體重 | 男性理想體重 |

    | :--- | :--- | :--- |

    | 算法① | 身高×身高×22 | 身高×身高×22 |

    | 算法② | (100×身高－70)×0.6 | (100×身高－80)×0.7 |

    | 算法③ | (100×身高－158)×0.5＋52 | (100×身高－170)×0.6＋62 |


    無論我們使用哪一種算法計算理想體重，都可將個人的實際體重歸類為右表的其中一種類別。當身高1.8 公尺的成年男性使用算法②計算理想體重並根據右表歸類，實際體重介於70×90%公斤至70×110%公斤之間會被歸類為正常。若將上述身高1.8
    公尺且實際體重被歸類為正常的成年男性，重新以算法③計算理想體重並根據右表歸類，則所有可能被歸類的類別為何？


    | 實際體重 | 類別 |

    | :--- | :--- |

    | 大於理想體重的 120% | 肥胖 |

    | 介於理想體重的 110%～120% | 過重 |

    | 介於理想體重的 90%～110% | 正常 |

    | 介於理想體重的 80%～90% | 過輕 |

    | 小於理想體重的 80% | 消瘦 |'
