  group_stem: '【題組】閱讀新聞報導，根據文章回答25~28題

    彰化縣111年申請改制直轄市，但因為人口未達125萬遭到駁回，而截至2023年11月底統計，當月遷入2250人遷出2746人，人口數首度跌破124萬大關，若未能產業轉型、吸引青年回流，恐怕人口成長下降趨勢，難以及反轉。

    彰化縣議員：「彰化和台中距離太近，台中市工作機會多、平均薪資高、交通方便及消費便利性，都市磁吸效應更加明顯，就學就業等環境，給予較多的發展空間，彰化的薪資結構沒辦法做有效提升，導致年輕人在彰化是留不住的。」

    彰化創業者：「家在彰化，畢業之後待在彰化，除了考量到和家人住就近照顧，也喜歡這裡的生活步調，剛好也要縣府推的創業獎勵金，逐漸讓咖啡廳經營步上軌道。」

    修改自【TVBS新聞網 2024/01/03報導】'
