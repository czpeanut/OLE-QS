- id: doc_112_高雄_林園_社會_歷史_g7s2e3_s1_30
  section: 1
  number: 30
  type: single
  page: 2
  stem: 美國開始提供各項軍事、經濟援助，主要是受到哪一場戰爭的影響？
  options:
  - label: A
    content: 第二次世界大戰
  - label: B
    content: 八二三炮戰
  - label: C
    content: 國共內戰
  - label: D
    content: 韓戰
  group_stem: '＊請根據下文，回答第30~32 題：

    從麵粉袋改製、印著「中美合作」的內衣內褲(如〔歷史圖二〕)，現在已經絕版，它的材質純天然，是百分百的美國棉，老一輩才穿過，稱為「卡動」（臺式日語，指コットン棉花），通風乾爽，印有「淨重22
    公斤」。為何是22 公斤？因為麵粉袋在美國，規格一律是50 磅，來臺就是22 公斤，凡大宗物資規格都是統一的。

    美援麵粉還促成了1964 年臺灣最早的營養午餐，從偏鄉開始試辦，提供麵粉蒸的蛋糕當點心配牛奶飲品，午餐有時是麵粉加保加麥（長壽麥）做的饅頭，配上脫脂奶粉、蔬菜、牛油熬煮的湯，學童們都說很新奇，雖然味道怪怪的。'
  shared_asset: g1_30_32
  answer:
  - D
  answer_source: answer_key_vlm
