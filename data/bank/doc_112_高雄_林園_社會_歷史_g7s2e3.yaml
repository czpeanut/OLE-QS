- id: doc_112_高雄_林園_社會_歷史_g7s2e3_s1_33
  section: 1
  number: 33
  type: single
  page: 2
  stem: 光華園這座反共前哨重要的心戰基地，最有可能位於下列哪一個地點？
  options:
  - label: A
    content: 澎湖
  - label: B
    content: 金門
  - label: C
    content: 綠島
  - label: D
    content: 龜山島
  group_stem: '＊請根據下文，回答第33~35 題

    坐落於太湖畔的光華園，是兩岸軍事對峙時期，反共前哨站重要的心戰基地。自1969 年成立，迄1997 年結束心戰作業，一路走過28 年烽火歲月。這個老一輩鄉親指為放氣球到大陸，長期披著神祕面紗的地方，上、下2
    廠專責製造空飄氣球，占地約萬餘平方米的10 座地庫，放置4176 枚氫氣鋼瓶。空飄物品琳瑯滿目，除有號召共軍起義來歸的宣傳單之外，也有食品罐頭、餅乾和洗髮精、洗衣粉、香皂、牙刷、牙膏及文具等日用品，連當年禁止軍民持有，嚴防收聽「匪播」的小型收音機都有，高空氣球最遠可飄到大陸外蒙古一帶。'
  answer:
  - B
  answer_source: answer_key_vlm
