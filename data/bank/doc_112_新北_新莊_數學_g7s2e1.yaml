- id: doc_112_新北_新莊_數學_g7s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '下面是小夫解二元一次聯立方程式的過程：$\begin{cases}3x-2y=5 \cdots\cdots ① \\ y=3x-4 \cdots\cdots
    ②\end{cases}$

    步驟一：將②代入①得 $3x-2(3x-4)=5$

    步驟二：去括號得 $3x-6x-8=5$

    步驟三：化簡得 $-3x=-3$

    步驟四：同除以 $(-3)$ 得 $x=1 \cdots\cdots ③$

    步驟五：將③代入②得 $y=-1$

    則小夫從哪一個步驟就開始出現錯誤？'
  options:
  - label: A
    content: 步驟一
  - label: B
    content: 步驟二
  - label: C
    content: 步驟三
  - label: D
    content: 步驟四
