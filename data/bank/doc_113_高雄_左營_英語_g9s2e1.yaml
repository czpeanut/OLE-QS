  group_stem: 'Peter wrote a book report about Diary of a Wimpy Kid.

    I read Diary of a Wimpy Kid by Jeff Kinney.  The story is about a boy named Greg
    Heffley.  He writes in his diary about his life in middle school.  Greg talks
    about his problems with school, his family, and his friends.

    Greg has a best friend named Rowley.  They do many things together, but sometimes
    they have problems.  For example, Greg damages a car and lets Rowley take the
    blame.  This makes them fight, but later they become friends again.

    At school, Greg wants to be popular, but it is not easy.  He tries to join the
    school play, but it doesn’t go well.  He also tries to impress his classmates,
    but they laugh at him.  This makes the book funny because Greg always has problems,
    but he never gives up.

    At home, Greg has a brother named Rodrick.  Rodrick often makes fun of Greg and
    plays tricks on him.  Greg also has a younger brother named Manny.  Manny is treated
    better by their parents, and this makes Greg feel unhappy.

    The book has many pictures, and they are funny.  The drawings help to explain
    the story and make it easier to understand.

    I think Diary of a Wimpy Kid is a great book.  It is funny and easy to read.  I
    like Greg because he is not perfect, and that makes him like other people.  I
    think this book is perfect for anyone who likes funny stories about school and
    family.

