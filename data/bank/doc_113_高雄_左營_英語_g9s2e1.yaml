  group_stem: 'Anna: Hi, Mr. Lewis!  Can you explain the Pygmalion Effect?

    Mr. Lewis: Sure, Anna!  Let me tell you a story first.  Do you know Pygmalion?

    Anna: Not really.  Who is he?

    Mr. Lewis: Pygmalion was a sculptor.  He made a beautiful statue of a woman and
    fell in love with it.  He treated it like it was real.  Aphrodite, the goddess
    of love, saw this and brought the statue to life.

    Anna: Wow!  So, because he believed, it came true?

    Mr. Lewis: You are right!  That’s the idea of the Pygmalion Effect.  When we believe
    in someone, they often do better.

    Anna: How does that work?

    Mr. Lewis: Let’s say a soccer coach has a new player on the team.  The coach believes
    this player can be great.  He gives the player more training, say something good
    to him, and let him play in important matches.  How do you think the player will
    feel?

    Anna: He will feel great and try his best.

    Mr. Lewis: Right!  That’s the Pygmalion Effect.  But if the coach thinks the player
    isn’t good, he might not let him play much or help him do better.  The player
    might lose confidence and give up.

    Anna: That’s sad.  So, believing in people is important?

    Mr. Lewis: Yes, Anna.  It helps others become successful.  This happens in sports,
    at work, and even with friends.

    Anna: My friend always says I’m good at drawing, and it makes me want to get better!

    Mr. Lewis: That’s a great example!  Positive expectations can change everything.

    Anna: I’ll remember that.  Thank you, Mr. Lewis!

    Mr. Lewis: You’re welcome, Anna!  Keep believing in yourself and others!

    sculptor 雕塑家  statue 雕像  goddess 女神  coach 教練  match 比賽  confidence 信心'
