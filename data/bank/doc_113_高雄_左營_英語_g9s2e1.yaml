- id: doc_113_高雄_左營_英語_g9s2e1_s2_36
  section: 2
  number: 36
  type: single
  page: 7
  stem: What is the main idea all the students talk about?
  options:
  - label: A
    content: Ways to save energy.
  - label: B
    content: Plans for new greenhouses.
  - label: C
    content: Choices for energy.
  - label: D
    content: Rules of nature.
  group_stem: 'Mr. Wang asked six students to talk about their ideas and share them
    with their classmates.  Here are what they said.


    | | |

    |---|---|

    | Maya | The weather is changing because we use too much old energy. This energy
    makes dirty air, and that hurts people and animals. Green energy, like wind and
    sun, does not make dirty air. If we use more green energy, we can keep our world
    clean and safe. It is the best way to protect our planet. |

    | Ethan | Green energy sounds good, but it costs too much money. Solar panels
    and windmills are expensive, and not everyone can pay for them. Some people might
    lose their jobs if we stop using old energy too quickly. We need to think about
    people who need work and find a way to make green energy cheaper. Right now, it
    is too expensive for many people. |

    | Sarah | Dirty air from old energy makes people sick, especially children and
    older people. It also hurts animals and plants. If we use green energy, the air
    will be cleaner, and nature will be healthier. We should take care of the Earth
    so that future generations can enjoy it, too. Green energy is the right choice
    for both people and nature. |

    | Emily | The sun and wind do not always make power. On cloudy days, solar panels
    do not work well. If there is no wind, windmills cannot make energy. People need
    power all the time, not just when the weather is right. Green energy is a good
    idea, but we need a way to make sure we always have power. |

    | Jacob | I think green energy is important, but we should not change too fast.
    If we stop using old energy too quickly, some people may not have power when they
    need it. We should change a little at a time and make sure we have enough energy
    for everyone. This way, we will not have big problems. A slow and careful change
    is the best way to use green energy. |

    | David | When we use green energy, we do not have to buy power from other places.
    This helps our country because we can make our own power. Green energy also gives
    people jobs, like building solar panels and windmills. If more people have jobs,
    they can take care of their families. Green energy is good for the future of our
    country. |


     solar panel 太陽能板  windmill 風車'
  ai_answers:
    gemini: C
    qwen: C
  answer:
  - C
  answer_status: ai_generated
  answer_source: ai:gemini+qwen
