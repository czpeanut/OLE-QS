  group_stem: 'Minecraft is a very popular game.  It was made in 2011, and millions
    of people play it around the world.  In the game, you can build, explore, and
    live in a world made of blocks.

    When you play Minecraft, you can choose to play in different ways.  The most common
    way is Survival.  In Survival, you need to collect resources like wood, stone,
    and food.  You must also build a shelter to stay safe from monsters which appear
    at night.

    Another way to play is Creative.  In Creative, you have unlimited resources.  This
    means you can build anything you want, like houses, castles, or big cities.  There
    are no monsters, and you can fly around the world!

    Minecraft’s world is made of blocks.  You can break blocks to collect them.  For
    example, when you cut down a tree, you get wood.  You can use this wood to make
    tools like an axe or a pickaxe to help you collect more resources.

    The best part of Minecraft is that you can be creative.  You can build what you
    want, and there are many places to explore.  You can also play with friends and
    work together to build big things or go on adventures.

    Minecraft is a great game for everyone.  It helps you be creative, learn new things,
    and have fun!

     explore 探索  unlimited 無限的  shelter 掩蔽處  monster 怪物  creative 有創造力的  adventure
    冒險'
