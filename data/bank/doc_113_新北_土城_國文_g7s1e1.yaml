- id: doc_113_新北_土城_國文_g7s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: '關於「神話」與「寓言」的比較，下列何者完全正確？


    | | | 神話 | 寓言 |

    |---|---|---|---|

    | (A) | 定義 | 神明指示的話語 | 寄託之言 |

    | (B) | 內涵 | 來自人們對自然萬物的想像 | 把抽象的道理隱含在生動的故事中，以達到勸諭的作用 |

    | (C) | 作品舉例 | 驚弓之鳥 | 女媧造人 |

    | (D) | 影響 | 對後世的中國小說影響深遠 | 對後世的詩歌影響深遠 |'
  options:
  - label: A
    content: 定義：神話（神明指示的話語）、寓言（寄託之言）
  - label: B
    content: 內涵：神話（來自人們對自然萬物的想像）、寓言（把抽象的道理隱含在生動的故事中，以達到勸諭的作用）
  - label: C
    content: 作品舉例：神話（驚弓之鳥）、寓言（女媧造人）
  - label: D
    content: 影響：神話（對後世的中國小說影響深遠）、寓言（對後世的詩歌影響深遠）
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 國文
      code: 語文常識(二)
      title: 閱讀導航——策略運用與資訊檢索
      chapter: null
