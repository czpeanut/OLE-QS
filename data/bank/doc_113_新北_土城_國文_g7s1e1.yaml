- id: doc_113_新北_土城_國文_g7s1e1_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: 根據【甲】文，下列說明何者正確？
  options:
  - label: A
    content: 打完球後，可用溼潤的棉布沾洗潔精清潔，並用水澈底沖洗乾淨
  - label: B
    content: 不管是PVC 或是PU 材質的籃球，都適合用在專業的木地板球場
  - label: C
    content: 籃球充氣時要使用專用氣針，並盡可能充到飽滿，才能有好的彈跳力
  - label: D
    content: 重壓或坐在籃球上、不當使用氣針充氣，都易破壞球內膽或使之變形。
  group_stem: '【甲】對於喜歡打籃球的人來說，一顆好的球至關重要，要吸汗防滑，耐磨，有絕佳的彈跳力等。關於籃球的保養與選擇要注意以下幾點：

    1. 根據場地選擇籃球：表皮是PVC 的籃球適合水泥地，表皮是PU 的籃球適合平整水泥地、塑膠地板或木地板。

    2. 籃球充氣請用隨球贈送的專用氣針，潤溼後慢慢插入球嘴，以免破壞球內膽，氣壓保持在7～9 磅左右。

    3. 打完球後應使用鬆軟溼潤的棉布沾洗潔精清潔表面，不要浸泡、沖洗，不要使用油類，以免翹皮或變色。

    4. 不能重壓籃球，如坐在籃球上，可能導致球內膽變形。


    【乙】NBA 勇士隊後衛柯瑞上個球季的命中率達67.5％，是他生涯的新高，並且是聯盟榜首。另一位命中率極高的球員是狄安卓‧喬丹，他一度是連續五年全聯盟投籃最「準」的球員，最厲害的時候投籃命中率可達71.4％。

    然而兩人的射程相差太多，狄安卓‧喬丹平均出手距離籃框只有1.5 呎(約46 公分)，大概限於兩步灌籃的距離，柯瑞則遠達28 呎。根據ESPN 統計，柯瑞的命中率即使在距離超越28
    呎時也沒有顯著下降。

    若單從攻擊火力來看，柯瑞是每場球賽平均可達30 分的得分王。因此，筆者認為，_______________'
  tags:
