  stem: 王維的〈九月九日憶山東兄弟〉：「獨在異鄉為異客，每逢佳節倍思親。遙知兄弟登高處，遍插茱萸少一人。」此為大家耳熟能詳的詩，下列對於作者及其詩的解釋，何者錯誤？
  options:
  - label: A
    content: 王維稱號「詩佛」，中年以後因信佛而詩風清淡曠遠
  - label: B
    content: 重陽節是指農曆九月九日，相傳此日登高、插茱萸可趨吉避凶
  - label: C
    content: 重陽佳節作者獨自一人在他鄉登高，因家人均不在身旁，所以作者替他們在山上插茱萸祈求消災解厄
  - label: D
    content: 由此詩可知王維目前孤身在外，因無法回家與兄弟 團聚而心生淒涼寂寞之感
