    content: 你明知在紐約放炮是違法的，居然趁父母不在的時候，請你的朋友肯尼來放炮：無縫接軌
  - label: B
    content: 你經過一戶人家，兩個人正試著開門鎖，你居然熱心地幫著他們開。如果開鎖的是賊，你就是共犯：助紂為虐
  - label: C
    content: 你的朋友把幾可亂真的玩具槍留在我們的樹叢裡，又發現家裡的花盆也被他們當靶子，打得像蜂巢一般：人不輕狂枉少年
  - label: D
    content: 找朋友幫忙，把欠錢的人抓住，逼他家裡還錢而成了擄人勒贖的通緝犯：人算不如天算。
