  group_stem: '因應社群媒體普及所帶來的虛假訊息狂潮，近期西方學界與傳播業界提出「理智清洗」概念與「真實三明治」策略。什麼是「理智清洗」？「以某種方式包裝激進和無恥言論的行為，使它們看起來很正常」。為了解決「理智清洗」現象帶來的報導偏誤，語言學家喬治·萊考夫（George
    Lakoff）提出「真實三明治」策略，就是將虛假訊息夾在兩層真實訊息之間，以減少虛假訊息的擴大傳播效應，並幫助讀者快速掌握事實。

    「理智清洗」意味著媒體在報導時，可能無意間過度「美化」或「正常化」政治人物不合邏輯言論。而「真實三明治」則提供一種事實查核策略，避免媒體在傳播真實資訊的同時，反而放大了錯誤訊息的影響力。為了對抗日趨氾濫的虛假訊息，國際媒體如美聯社（AP）、路透社（Reuters）與英國廣播公司（BBC）近年來紛紛建立專門的事實查核部門，以提升報導的正確性與可信度。

    未來的資訊挑戰將更加複雜，媒體需要積極採用技術創新來應對。包括引入能夠識別虛假訊息的人工智慧（AI）工具，以及強化數位內容的查核流程。也可透過國際合作共同建立更健全的資訊生態系統，確保真實訊息的有效傳播。

    節錄自 事實查核中心的名家專欄 防止「理智清洗」錯誤、運用「真實三明治」策略：新聞媒體如何對抗假訊息 2024-12-06'
