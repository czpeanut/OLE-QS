- id: doc_113_新北_中平_社會_地理_g9s1e2_s1_39
  section: 1
  number: 39
  type: single
  page: 1
  stem: 巴拿馬運河連接下列哪兩個海域間的水運交通？
  options:
  - label: A
    content: 太平洋、印度洋
  - label: B
    content: 太平洋、大西洋
  - label: C
    content: 大西洋、印度洋
  - label: D
    content: 紅海、地中海
  group_stem: '1914 年完工的巴拿馬運河，全長約82 公里，是重要的海上捷徑，有「世界橋梁」之稱。通航後成為世界重要的航運要道。2024 年8 月是巴拿馬運河完工110
    週年。隨著氣候變遷，巴拿馬運河7 月間面臨乾旱缺水的窘境，造成海運路線嚴重阻塞。儘管當地預計9 月間降雨正常之後，運河的船隻通過數量也可回升，但已有航運業寧願繞遠路走南非好望角，讓靠著運河賺錢的地主國意外面臨不少競爭壓力。


    ◆根據上文回答第39〜40 題'
