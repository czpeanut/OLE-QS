- id: doc_113_新北_中平_社會_公民_g8s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 3
  stem: 為達到分權制衡的效果，發布緊急命令要生效有一定的流程，其程序下列何者說明正確？
  options:
  - label: A
    content: 先立法院會議決議後總統發布，須經監察院追認
  - label: B
    content: 先行政院會議決議後總統發布，須經立法院追認
  - label: C
    content: 先行政院會議決議後總統發布，若七日內未獲追認則失效
  - label: D
    content: 先立法院會議決議後總統發布，若十日內未獲追認則失效
- id: doc_113_新北_中平_社會_公民_g8s1e2_s1_16
  section: 1
  number: 16
  type: single
  page: 3
  stem: 立法院是我國最高立法機關，也是中央民意機關，代表人民行使監督的權力，請問：關於立法院的敘述何者正確？
  options:
  - label: A
    content: 可以對行政院長提不信任案，將使得行政院在一年內被解散
  - label: B
    content: 對於監察委員、審計長有人事提名權
  - label: C
    content: 具有審議審核報告權及廢止法律的權力
  - label: D
    content: 有權要求環境部、農業部、審計部提交施政方針與施政報告
