    content: 自由權
  - label: B
    content: 參政權
  - label: C
    content: 受益權
  - label: D
    content: 平等權
  group_stem: "※題組一 (請回答第1 題到第3 題) 《閱讀素養題》\n   基隆市長謝國樑的罷免案結果出爐，不同意票8 萬6014 票，同意票6\
    \ 萬9934 票，不同意票多過同意票，罷免案確定沒有通過。謝國樑表示，感謝市民跟國民黨主席朱立倫等人的支持，也會用謙卑態度，邀請拆樑團體成員對話；拆樑陣營則宣告任務失敗，強調這場罷免還是有近7\
    \ 萬人投下同意票，是史無前例，未來也會將持續監督謝國樑施政。"
