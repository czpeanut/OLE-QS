- id: doc_113_新北_中平_社會_公民_g8s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: "法治社會藉由制定憲法保障人民的基本權利，以及規範政府的權力，以落實憲政精神，因此憲法又稱人民權利的保障書。\n   請問：下列選項何者正確？"
  options:
  - label: A
    content: 人民主動提出立法原則的權利為自由權
  - label: B
    content: 人民對行政機關提出建議的權利是受益權
  - label: C
    content: 人民權益受不法侵害提起訴訟為平等權
  - label: D
    content: 人民參與政論節目評論時事是參政權表現
- id: doc_113_新北_中平_社會_公民_g8s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: "權力分立是指建構一個權力受到限制的有限政府，才能真正落實保障人民的基本權利的核心價值。請問：有關權力分立的\n   設置何者正確？"
  options:
  - label: A
    content: 孫中山先生認為監察權從司法權獨立出來才能避免國會專制
  - label: B
    content: 孫中山先生認為考試權從立法權獨立出來才能為國公正舉才
  - label: C
    content: 五權分立制度下將考試權獨立出來，若不獨立出來容易產生濫用私人的問題
  - label: D
    content: 三權分立由英國歷史學家艾克頓爵士提出，認為權力不能過於集中，分權才能制衡
- id: doc_113_新北_中平_社會_公民_g8s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: "某報社記者緊追某公眾人物婚外情之發展，連日緊迫盯人，此公眾人物不堪其擾報請警方處理，警方提醒該記者已嚴重\n   影響他人行動造成身心壓力，多次勸離，若再不停止將依法送辦。請問：下列選項中的基本人權何者與題目畫線提到的\n\
    \   不同？"
  options:
  - label: A
    content: 新冠病毒疫情全球流行，中央流行疫情指揮中心宣布醫事人員禁止出國命令，除非報准，不得出國
  - label: B
    content: 警消人員殉職、過勞狀況時有所聞，警消工會團體向行政院勞動部表達不滿訴求要爭取自身的權益
  - label: C
    content: 小珍路上邊走邊吃，遇上警察盤查，小珍認為自己沒有行為怪異因此拒絕出示證件，卻遭警察上銬帶走
  - label: D
    content: 某國政府草擬法案，未來警察辦案可不經法官同意，利用GPS 定位人民行蹤、監控LINE 和FB 等通訊軟體
- id: doc_113_新北_中平_社會_公民_g8s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: "新北某國際學校近日發生校車70 天內兩度事故，引發社會關注，新北教育局長表示:「學生安全零容忍，須用最高標準要\n   求」，因此，新北市教育局依私立學校法第55\
    \ 條規定，對學校祭出減招1 班處分；校方不服循救濟程序提出○○。請問：\n   下列選項何者正確？《閱讀素養題》"
  options:
  - label: A
    content: ○○為受益權中的請願權
  - label: B
    content: ○○是人民受不法侵害向法院提出訴訟
  - label: C
    content: ○○是指對民意機關的維護表達訴求
  - label: D
    content: 校方不服循救濟程序應向教育部提出○○
- id: doc_113_新北_中平_社會_公民_g8s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: "近日內政部指出「統促黨幹部涉收中國7400 萬元，介入台灣選舉」，加上其犯罪人數破百人，認為「統促黨系統性、組織性\n   犯罪，已嚴重危害國家安全、社會穩定」，因此聲請解散統促黨。而目前受理單位尚未收案，若未來收案後，統促黨將成為\n\
    \   「首件主管機關聲請解散案」。請問：下列說明何者正確？《閱讀素養題》"
  options:
  - label: A
    content: 受理單位為憲法法庭，由司法院大法官進行審理，決定是否解散政黨
  - label: B
    content: 受理單位為憲法法庭，由司法院大法官進行審理，再由人民公投決定
  - label: C
    content: 受理單位為懲戒法院，由監察院判定是否情節重大，再決定是否彈劾
  - label: D
    content: 受理單位為懲戒法院，由司法院大法官對於有違反失職情事進行彈劾
- id: doc_113_新北_中平_社會_公民_g8s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 承上題，請問：上題中提到的受理單位，還有職責下列哪些事項？
  options:
  - label: A
    content: 審理各級訴訟、處理公務人員違反失職
  - label: B
    content: 審理正副總統彈劾、糾正行政機關
  - label: C
    content: 審理正副總統彈劾案、解釋憲法
  - label: D
    content: 糾舉公務人員、審理各級訴訟
  group_stem: "（第 8 題）近日內政部指出「統促黨幹部涉收中國7400 萬元，介入台灣選舉」，加上其犯罪人數破百人，認為「統促黨系統性、組織性\n\
    \   犯罪，已嚴重危害國家安全、社會穩定」，因此聲請解散統促黨。而目前受理單位尚未收案，若未來收案後，統促黨將成為\n   「首件主管機關聲請解散案」。請問：下列說明何者正確？《閱讀素養題》"
- id: doc_113_新北_中平_社會_公民_g8s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: "我國國會可對中央政府部分官員的人事提名案行使同意權，並在投票表決前，藉由提問來審查被提名人是否適任。\n   請問：根據我國公職人員的法定職權判斷，下列哪一個問題的提問對象最有可能是考試委員？"
  options:
  - label: A
    content: 對於執行職務發生意外或危險以致死亡的因公撫卹類型的等級如何認定
  - label: B
    content: 如何有效地落實嚴謹審核每年中央政府各機關提出編制的年度審計報告
  - label: C
    content: 如何適當的提升對於違法或失職公務人員進行彈劾程序的整體辦案效率
  - label: D
    content: 我國仍維持死刑刑罰是否違反基本人權及聯合國發布有關人權的兩公約
- id: doc_113_新北_中平_社會_公民_g8s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: "在立法院議政博物館官網寫到：「採行○○○制度係因恐懼議會的立法權過度膨脹、草率或濫用，所以賦予國家元首或行\n   政機關得行使○○○，以對抗議會的專斷立法權。此種行政權與立法權相互對抗的互動機制，在憲法中有明確的基本規\n\
    \   定，使雙方有所遵循」。請問：請根據上文敘述判斷○○○為下列哪一種權力？"
  options:
  - label: A
    content: 復議權
  - label: B
    content: 覆議權
  - label: C
    content: 同意權
  - label: D
    content: 質詢權
- id: doc_113_新北_中平_社會_公民_g8s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: "某機關表示公務人員履歷表是各機關辦理初任公務人員送審的法定表件，且與公務人員的任用權益有密切相關，為兼顧公\n   務人員個人隱私權保障，審酌照片主要是供服務機關利於識別之用，與個人工作能力無涉，已修正公務人員履歷表刪除\n\
    \   「照片」欄位，以避免就業歧視爭議。請問：請根據上文敘述判斷某機關為下列何者？"
  options:
  - label: A
    content: 銓敘部
  - label: B
    content: 考選部
  - label: C
    content: 審計部
  - label: D
    content: 數位發展部
- id: doc_113_新北_中平_社會_公民_g8s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 根據上文判斷「甲」、「乙」、「丙」、「丁」依序為哪些中央政府機關？
  options:
  - label: A
    content: 行政、立法、行政、司法
  - label: B
    content: 行政、立法、立法、監察
  - label: C
    content: 立法、行政、行政、司法
  - label: D
