- id: doc_111_嘉義_北興_英語_g7s2e2_s5_29
  section: 5
  number: 29
  type: single
  page: 3
  stem: What is NOT in the “mixture” in step 7 ?
  options:
  - label: A
    content: Water.
  - label: B
    content: Ice cream.
  - label: C
    content: Jelly crystals.
  - label: D
    content: Strawberries.
  group_stem: '(29-31) How to make Strawberry Jelly

    Strawberry jelly is easy to make. You can make it at home at any time.

    What you need:

    ⚫ A box of strawberry jelly crystals

    ⚫ About 12 strawberries

    ⚫ A cup of hot water

    ⚫ A cup of cold water


    What to do:

    1. Put the jelly crystals into the bowl.

    2. Add the hot water to the bowl.

    3. Use the spoon to mix the mixture in the bowl until it is clear and you don’t
    see any crystals.

    4. Cut the strawberries.

    5. Add the cold water to the mixture and mix it again.

    6. Put the strawberries into the mixture.

    7. Wait the strawberry jelly mixture to become more solid in the refrigerator.

    Now, you can enjoy your strawberry jelly with ice cream on sunny days.

     jelly crystal 果凍粉 solid 堅硬的 refrigerator 冰箱'
  shared_asset: g5_29_31
  tags:
    textbook: 第二冊（七下）第2次段考範圍
    labeled_by: ai
