  stem: Why does Alicia say Not even close?
  options:
  - label: A
    content: She doesn’t like Edward’s gift.
  - label: B
    content: She is not Edward’s close friend.
  - label: C
    content: Her favorite singer is not Taylor Swift.
  - label: D
    content: There are still many days away from her birthday.
  group_stem: '(34-35)

    Edward and Alicia are talking.

    Edward : Happy birthday, Alicia! This gift is for you.

    Alicia : Oh … thank you. You are so sweet. But my birthday isn’t today.

    Edward : What? Isn’t it on April 6th?

    Alicia : Not even close. It’s on June 4th . But thank you. The box is beautiful.
    What’s in it?

    Edward : Well, it’s Taylor Swift’s CD. You love her, right?

    Alicia : Come on, Edward. She’s my sister’s favorite singer. I only love Bruno
    Mars.

    Edward : I''m so sorry. I have a bad memory.

    Alicia : That’s fine. You are still my best friend.

     memory 記憶力'
