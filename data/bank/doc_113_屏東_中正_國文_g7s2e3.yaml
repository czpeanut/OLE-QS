  section: 5
  number: 4
  type: single
  page: 5
  stem: 為什麼在唐朝以後，皇帝的稱號逐漸從諡號轉為使用廟號？
  options:
  - label: A
    content: 因為廟號比諡號更能顯示皇帝的德行
  - label: B
    content: 因為諡號越來越長，不便稱呼與記憶
  - label: C
    content: 因為諡號只有少數皇帝才有
  - label: D
    content: 因為廟號是由百姓選出的，更具代表性
  group_stem: '當代影視作品中，常出現許多令人哭笑不得的歷史錯誤。像某抗日神劇中竟出現「抗日戰爭已經第七個年頭了，還有最後一年大家不要放棄」這樣的台詞，彷彿編劇能預知歷史，引發網友吐槽。而古裝劇更是不乏此類錯誤，例如某部熱播清宮劇中，孝莊太后竟自稱「我孝莊怎麼怎麼樣」，令人啼笑皆非。

    其實，「孝莊」是她過世後，康熙皇帝與大臣商議後所上諡號，她生前根本不可能知道，更不會用來自稱。孝莊太后本姓博爾濟吉特氏，名布木布泰，如果劇中讓她自稱「我布泰」還說得過去。編劇可能是為了方便觀眾理解，使用熟悉稱呼，無心犯錯，但也暴露出影視審核上的疏忽。

    歷史上的孝莊太后其實在世時的正式尊稱是「昭聖慈壽皇太后」，簡稱「昭聖皇太后」。若劇中改為「我昭聖怎麼樣怎麼樣」，在歷史邏輯上也說得過去。這樣的錯誤提醒我們，古人名號繁多，要理解各種稱號的用途與區別，才能避免混淆。

    這些稱號主要包括：諡號、廟號、年號和尊號。

    首先，諡號是對地位較高者死後所作的綜合評價，概括其一生的功過是非，起源於西周，有「周公制諡」之說。諡號並非皇帝專屬，也適用於諸侯、大臣、后妃等。若該人德行優異，會得到「文」、「武」、「成」、「孝」等上諡；若品行不端，則可能被賜予如「厲」、「煬」、「幽」、「靈」等下諡。隋煬帝、周幽王等就屬於被賜下諡的例子。不過隨著朝代更替，諡號越來越長，像唐朝、清朝時期已長達十數字甚至二十字，使其不再便於稱呼。

    於是，廟號的使用興起。廟號原本是祭祀祖先所用的稱號，如「太祖」、「高宗」、「太宗」等，意在尊崇特別有功的皇帝。兩漢時期只有少數皇帝有廟號，像漢高祖劉邦、漢武帝劉徹。但自三國後廟號濫用現象日增，幾乎每位皇帝都有一個「祖」或「宗」開頭的廟號。即便如此，廟號因字數簡潔，依然比冗長的諡號好記，成為唐宋以後皇帝最常被提及的稱呼方式，如唐太宗、宋仁宗等。

    不過廟號也有局限。隨著各朝代的廟號愈發重複，比如「高宗」、「太宗」泛濫，不加朝代容易混淆，因此自明朝開始，改用年號作為皇帝稱呼。年號是皇帝為標記其統治時期所創的名稱，自漢武帝「建元」始。早期皇帝有時頻繁更換年號，令人困惑。唐高宗與武則天就曾頻繁更換年號。而明太祖朱元璋推行「一世一元制」，每位皇帝一生只用一個年號，例如「永樂」、「康熙」、「乾隆」等，使後世以年號稱帝成為慣例。

    最後是尊號，這是為了讚美或討好皇帝而加上的尊崇稱號，如武則天曾被加封為「金輪聖神皇帝」，唐玄宗李隆基也有「開元聖文神武皇帝」等尊號。不過這些尊號多流於當時政治需求，後世並不常用來稱呼皇帝。

    總之，這些稱號各有歷史背景與使用場景。理解它們，不僅能讓我們看劇時少些錯誤與誤解，也更有助於掌握歷史人物的真實身份。影視創作固然可適度簡化，但對歷史細節仍應保有敬意與考究的態度。'
