- id: doc_113_屏東_中正_國文_g7s2e3_s5_1
  section: 5
  number: 1
  type: single
  page: 4
  stem: 依據上文所述，下列哪一組的人都「犯了傲慢的毛病」？
  options:
  - label: A
    content: 莊子、惠子、保育專家
  - label: B
    content: 左拉、莊子、保育專家
  - label: C
    content: 惠子、家貓、賈島
  - label: D
    content: 莊子、賈島、保育專家。
  group_stem: '法國自然主義小說家左拉，曾經寫過一篇膾炙人口的短篇小說貓的天堂，從自然主義的角度而言，那隻慵懶痴肥、養尊處優的家貓，顯然較另一隻精捷矯健、風吹雨淋的野貓缺乏生命的活力與生存的意義。在此，左拉對尋常所謂的「天堂」，充滿了質疑與嘲諷。

    　　十九世紀下半葉，科學文明的無限擴張，早已對所謂的「自然」侵蝕得體無完膚，但相較二十一世紀初的現在，似已「小巫見大巫」，未可同日而語了。當時的家貓，寧可安穩舒適的受豢養於「幸福的天堂」，野貓除了遺憾、諷刺，繼續在艱險的荒野中求生外，也別無它途。

    　　也許左拉心中自有其「天堂」，卻永遠無法搖撼家貓對此一象徵著舒適、安全、保障與喜樂的「天堂」之眷戀。莊子與惠子在濠梁上激辯：「魚到底快樂不快樂？」惠子質疑莊子：「你不是魚，怎知魚是快樂的？」左拉不是貓，又怎知哪一隻貓才擁有真正的「天堂」？家貓、野貓、左拉，甚至是人類，都各有自己的「天堂」想望，「天堂」是由自己定義的，而且任何人的定義都不能越界侵犯他人的定義，左拉可以自然主義一番，卻無權否定他人的「天堂主義」。

    　　保育專家大抵都是自然主義的信仰者，在他們心目中，野貓無寧才是最懂得生命與生存之道的；但是卻正犯了與左拉相同的人類傲慢的毛病，企圖以人類的立場，為動物的天堂作定義，敢問：「你不是貓，怎知貓的天堂在哪裡？」更危險的是，二十一世紀初的現在，人類、科技的魔爪早已將「自然」摧毀殆盡，被圈養、受豢養的動物，除了「家」外，何處還有天堂？

    　　唐代詩人賈島詩云：「客居并州已十霜，歸心日夜憶咸陽。無端更渡桑乾水，卻望并州是故鄉。」已受人類圈養、豢養幾十年、幾百年的家禽、家畜，「家」就是故鄉、就是天堂。

    　　低微的人往往只有些低微的期盼，無須「生命」、「生存」等術語在那邊橫生滋擾，舒適、安全、保障與喜樂，這就是我們的天堂。我相信，貓的期盼也不過如此。

    　(摘自「動物的天堂」何在，誰說了算？)'
