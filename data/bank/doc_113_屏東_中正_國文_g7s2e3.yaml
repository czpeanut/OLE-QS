    不過廟號也有局限。隨著各朝代的廟號愈發重複，比如「高宗」、「太宗」泛濫，不加朝代容易混淆，因此自明朝開始，改用年號作為皇帝稱呼。年號是皇帝為標記其統治時期所創的名稱，自漢武帝「建元」始。早期皇帝有時頻繁更換年號，令人困惑。唐高宗與武則天就曾頻繁更換年號。而明太祖朱元璋推行「一世一元制」，每位皇帝一生只用一個年號，例如「永樂」、「康熙」、「乾隆」等，使後世以年號稱帝成為慣例。

    最後是尊號，這是為了讚美或討好皇帝而加上的尊崇稱號，如武則天曾被加封為「金輪聖神皇帝」，唐玄宗李隆基也有「開元聖文神武皇帝」等尊號。不過這些尊號多流於當時政治需求，後世並不常用來稱呼皇帝。

    總之，這些稱號各有歷史背景與使用場景。理解它們，不僅能讓我們看劇時少些錯誤與誤解，也更有助於掌握歷史人物的真實身份。影視創作固然可適度簡化，但對歷史細節仍應保有敬意與考究的態度。'
