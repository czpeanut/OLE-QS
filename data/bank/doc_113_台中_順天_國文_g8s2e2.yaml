- id: doc_113_台中_順天_國文_g8s2e2_s2_38
  section: 2
  number: 38
  type: single
  page: 4
  stem: 上文是輝達執行長黃仁勳在矽谷向「華人科技社群」分享的人生哲學。李倫聆聽黃仁勳給予年輕人的建議後，記錄了幾個要點。下列哪一點最不可能包含其中？
  options:
  - label: A
    content: 鍥而不舍
  - label: B
    content: 立志高遠
  - label: C
    content: 逆向思維
  - label: D
    content: 甘之如飴。
  group_stem: '那是一個夏天，黃仁勳與家人參觀京都 苔寺。他記得，當時天氣炎熱潮溼、沒半點風，有一名老人家蹲著整理花園，「我看見他的竹簍幾乎是空的，只有3株壞死的苔蘚。」老人家告訴黃仁勳，他在寺廟工作已近30年。

    黃仁勳納悶問道：「苔園如此之大，你的簍子和鑷子如此之小，你是如何照顧維護的呢？」老人家回答他：「我有的是時間。」

    這句話對黃仁勳影響深遠。

    他告訴年輕人：「這也是我能給你們最好的職涯建議。我很少追著事情跑，而是享受著我正在做的事。」「我不追求更多，只渴望把當下的工作做到最好。認識我的人都知道，輝達沒有所謂的長期策略和計畫，我們想的是：今天要做好好什麼事？」「很少人知道我有個習慣，就是我不戴手錶，因為『現在』才是最重要的。」

    黃仁勳回顧職涯，提及自己從連鎖餐廳 Denny''s 的一名洗碗工被晉升為服務生，一路到今天的成就，他熱愛每一份工作。

    黃仁勳告訴胸懷壯志的年輕專業人士：「我的建議聽起來或許有違一般人的策略，但這是個好的建議——你儘管每天持續學習，好的事情自會降臨。」他也直言，自己並非一個動作敏捷的人，卻是一個堅持不懈的人。

    黃仁勳也鼓勵年輕人改變慣性的思考方式，從反向角度來分析，「當一名創新者，腦中不能一直想著競爭。因為既然是開創，代表市場上還沒有這項產品，那麼何來競爭？」

    關於領導人的特質，黃仁勳認為每家公司都是由一群絕頂聰明的人所創立，但並非每個人都能成為領導者。「為何有些人能脫穎而出？這是作為華人的幸運之處，我們有長久吃苦耐勞的能力。」他進一步解釋，「這種能耐就是恆心毅力，是成功人士最重要特質之一。打造新公司和發明新事物，都是要經歷大量磨難的，你必須真心感受到它帶給你的樂趣，否則太痛苦了。」

