- id: doc_113_台中_順天_國文_g8s2e2_s2_33
  section: 2
  number: 33
  type: single
  page: 4
  stem: 泰雅族人口中的「馬奧」所指為何？
  options:
  - label: A
    content: 不喜歡說謊的泰雅族男人
  - label: B
    content: 蓄滿熱情香氣的泰雅族女人
  - label: C
    content: 長著一粒粒小果實的山胡椒
  - label: D
    content: 太魯閣戰役中被強徵的族人壯丁。
  group_stem: '很少人知道這是一條「馬奧之路」(馬奧，泰雅語Maau，就是山胡椒)，以為是一條無甚可觀之路，或者是，以所認為的命名之。

    最多的是認為「錐麓古道」，起源於一九一四年臺灣總督府因應太魯閣戰役而闢築。一九一七年，駐在所警察強徵族人壯丁，將小徑拓寬至一點五公尺，以便通行或載運火砲。當時族人以繩索細綁腰際，自斷崖頂垂懸而下，鑿洞以埋設炸藥，可見當年開鑿之艱辛危險。

    晚近，它成了太魯閣國家公園精心規畫的愛山人朝聖地點——錐麓古道，走上古道，目的是要讓愛山人感受「蒼涼悲壯的歷史」，而「太魯閣族人淌在碎石上的血汗，已成為古道上最讓人動容的印記」。

    這些辭令，如今看來，愈來愈像某種政令宣導或是廣告宣傳。我還是喜歡族人口傳的溫度，關於馬奧是第二顆太陽的孩子，第二顆太陽就是血流盡之後成為黑夜的月亮。馬奧不喜歡說謊，身體裡蓄滿熱情的香氣，它藏在一粒粒的小果實裡。泰雅人爬上馬奧高高的肩膀，摘下果實放在耳棒裡(泰雅族的耳管裝飾)，這樣就聽見了河流的聲音，也聞到令人心醉神迷的氣息，香氣吸引隔一座山的女人，舌頭嘗著馬奧，肚子裡就孕育嬰兒的心跳。

    山脈西側的族人以採得一個竹罐的馬奧與東側族人締結婚事，正如「福巴越嶺古道」是連接烏來鄉、復興鄉的嫁娶道路，於是族人走在雲霧彌漫的高山步道時，嘴角總是微微上揚，心臟的跳動總是洋溢著幸福的節拍。因為這是一條「馬奧之路」，是祖先應許的道路。(瓦歷斯·諾幹
    超乎你想想的一條幸福之路)'
