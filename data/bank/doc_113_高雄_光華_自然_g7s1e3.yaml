- id: doc_113_高雄_光華_自然_g7s1e3_s3_49
  section: 3
  number: 49
  type: single
  page: 6
  stem: 根據本文，「漸凍人」與「植物人」是以哪個構造是否仍具有功能而區分？
  options:
  - label: A
    content: 感覺神經元
  - label: B
    content: 脊髓
  - label: C
    content: 腦幹
  - label: D
    content: 大腦。
  group_stem: "2015 年，為了漸凍人發起的公益募捐活動「冰桶挑戰」在全球火紅流行，企圖藉由把冰水往頭上淋來「體會」一下漸凍人的感受。但是到底漸凍人是什麼意思呢？\n\
    \    漸凍人，是肌萎縮性脊髓側索硬化症(amyotrophic lateral sclerosis, ALS)的俗稱，是一種不可逆的神經退化性疾病。此疾病會造成腦部的上運動神經元與脊髓腦幹的下運動神經元的漸進性退化。ALS\
    \ 患者的主要的臨床症狀為肢體及軀幹的肌肉萎縮無力、因延髓（bulbar）退化造成口齒不清、吞嚥困難，最終因橫膈無力而引發呼吸困難等甚至呼吸衰竭，以致於必須長期依賴呼吸器維生，外觀看來就像植物人一樣。然而他們的意識卻非常清醒，感覺正常，就像是活生生的靈魂被禁錮在一個的僵死軀殼裡，完全無法與外界溝通，我們稱之為「漸凍人」，但其痛苦更甚於「植物人」。ALS\
    \ 患者平均發病後的平均存活時間約為五至六年，大多數的患者死於呼吸衰竭或感染等併發症。目前除了症狀治療外，漸凍人目前仍無藥物治療可有效改變病程。目前全世界唯一核准的治療用藥為Riluzole（商品名Rilutek，中文名「銳力得」）。根據相關研究指出，Riluzole\
    \ 只能延長病人數個月存活時間，且對於生活品質或功能無明顯幫助。\n    植物人，是生命中樞─腦幹，仍可以正常運作的；病人會自己呼吸，外界只需協助餵食就可以延續生命；但是病人對外界的刺激沒有反應，只會偶爾表現出如眨眼、手指彈動等無意識的反射動作。一般來說，因意外使頭部受傷的患者，受傷後3～6\
    \ 個月腦部細胞胞恢復速度是最快的，但是一年後恢復速度就會趨緩，甚至停滯，這也是多數醫師不會在受傷後的第一時間就宣布患者是否為植物人的原因。"
