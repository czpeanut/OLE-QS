- id: doc_113_基隆_銘傳_英語_g9s1e1_s5_37
  section: 5
  number: 37
  type: single
  page: 3
  stem: Where does the food fight take place?
  options:
  - label: A
    content: A small town in Bunol.
  - label: B
    content: La Tomatina.
  - label: C
    content: Spain.
  - label: D
    content: Palo Jabon.
  group_stem: 'Do you like tomatoes? Do you want to see trucks full of tomatoes? Do
    you want to swim in a pool of tomato juice? If you do, La Tomatina is just right
    for you.

    La Tomatina is the biggest food fight festival in the world. It takes place in
    Bunol, a small town with about only 9000 people in Spain. It always happens on
    the last Wednesday of August every year.

    On Wednesday morning, the first event before the food fight is Palo Jabon. People
    climb up the pole with a piece of ham at its top, and they may climb on each other
    during the event. The first person who gets the ham and makes it drop from the
    pole starts the food fight. After the ham falls, trucks full of thousands of tomatoes
    come into the center of the town. People get the tomatoes from the truck and throw
    tomatoes at each other. To keep other people from being hurt, people squash tomatoes
    before throwing them. Most importantly, people can''t throw anything but tomatoes.
    They can''t throw at the buildings, either. It is safer for people to put on goggles
    during the food fight. After the two-hour food fight, tomatoes are everywhere.
    Fire trucks wash down the streets, and people go to the public pools to wash away
    the tomatoes.

    Are you ready to feel free with tomatoes? Please download the app Love Latomatina
    for more information. Book a ticket with the app for the crazy food fight now.
    The special price for early birds is waiting for you. You can get a 10% discount
    if you book the tickets with the app before August. Remember to bring more clothes,
    or you can get a new one with tomatoes on it.

     take place 舉行、pole 竿子、center 中央、goggle 護目鏡'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
