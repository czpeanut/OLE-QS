- id: doc_113_基隆_銘傳_英語_g9s1e1_s5_32
  section: 5
  number: 32
  type: single
  page: 2
  stem: What is the best title for the reading?
  options:
  - label: A
    content: Mars, Our New Home
  - label: B
    content: A Great Trip to Mars
  - label: C
    content: Facts of Mars
  - label: D
    content: Let's have Fun on Mars
  group_stem: 'In 2004, two car-sized rovers landed on Mars to look for water and
    signs of the past life. The rovers gave people a lot of useful and important information.
    It was much warmer, and there were seas and rivers on Mars before.

    After getting the information from two rovers, scientists start to ask. Can people
    take a trip to Mars? Can people enjoy their meals on Mars? Can people live on
    Mars? Some people think that the answer to these questions is only a dream, but
    scientists believe people can make the dream come true in the coming future. The
    two main reasons are water and $\text{CO}_{2}$. However, there is still a serious
    problem. The water is frozen.

    Here are scientists'' special plans :

    1. At the beginning, people build small living areas on Mars.

    2. Second, people build factories which can make a lot of heat. It is freezing
    cold on Mars. The heat makes Mars warmer, and the heat melts the ice. Then, people
    can have water.

    3. If Mars gets warmer, air pressure will raise. This is very important because
    it will make rain. Rivers and seas can come back to their lives. Flowers and trees
    can grow up.

    4. Then, people build special garden buildings. They can plant fruits and vegetables
    inside and outside these special garden buildings.

    5. After a long time, the oxygen level will go up.

    With all these special plans, living on Mars is not just a dream but a dream into
    reality.

     rover 探測車、Mars 火星、melt 融化、raise 提高 pressure 壓力、oxygen 氧氣、reality 真實'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
