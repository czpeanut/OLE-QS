  stem: '下列關於主流文化與次文化的比較，何者正確？(習作)


    | | (A)組成原因 | (B)成員規模 | (C)等級 | (D)實例 |

    | :--- | :--- | :--- | :--- | :--- |

    | 主流文化 | 社會當中特定團體的價值和信念 | 較小 | 較高 | 流行音樂 |

    | 次文化 | 社會當中多數人的價值和信念 | 較大 | 較低 | 嘻哈音樂 |'
  options:
  - label: A
    content: 組成原因
  - label: B
    content: 成員規模
  - label: C
    content: 等級
  - label: D
    content: 實例
  answer:
  - D
  answer_source: answer_key_vlm
