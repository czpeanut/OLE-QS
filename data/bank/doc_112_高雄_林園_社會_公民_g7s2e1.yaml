  stem: 過去「瑪麗亞」(Maria)是菲律賓女性常見的名字，隨者許多菲律賓女性漂洋過海來台灣從事看護幫傭的工作，因此台灣民眾開始將「瑪麗亞」視為從事低階工作的外來女性勞工的代名詞。所以當有台灣業者提議引進菲律賓高階白領人才來台教英語，就有政治人物回應：「台灣人可以接受瑪麗亞怎麼變老師了呢？」。請問上述政治人物的說法，突顯下列何種現象的存在？
  options:
  - label: A
    content: 文化創新
  - label: B
    content: 文化位階
  - label: C
    content: 文化交流
  - label: D
    content: 文化衝突
  answer:
  - B
  answer_source: answer_key_vlm
