  stem: 近期有網紅到知名連鎖商店，未結帳就打開店內商品食用，以違法行為博取流量，更戲稱是「客家精神」，強加客家族群小器、吝嗇等負面刻板印象，客委會趕緊呼籲勿消費客家，而國外就有透過法律、教育做法，避免大眾以「言論自由」，當作可隨意謾罵歧視話語的擋箭牌。而這樣的刻板印象常在不自覺中，成為不同族群之間交流與理解的障礙，甚至出現「微歧視」現象。請問上述主要在突顯何者的重要性？
