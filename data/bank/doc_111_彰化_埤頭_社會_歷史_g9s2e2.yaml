  group_stem: ◎莉玉和可瑩想利用放寒假到北部遊玩，並把上歷史課時，老師教的相關歷史景點做一應印證。首站，她們從臺北車站坐捷運到淡水，她們真理大學看到牛津學堂，在這裡她們看到某一仙人物對其一生奉獻給臺灣的記錄。接著，莉玉一行人到基隆廟口遊，並參觀基隆很名的古蹟「二沙灣砲臺」，入口的營門上題有「海門天險」隨後，她們到了山腳下看到一座「法國公墓」，看著天色已晚，莉玉和可瑩帶著滿滿的收穫離開，結束此次的古蹟之旅。請回答44~47題
