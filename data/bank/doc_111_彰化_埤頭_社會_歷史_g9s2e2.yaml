  group_stem: '「國際終戰和平紀念園區」，本以為這裡只是臺灣早期金礦產地，沒想到右圖的看板，

    上寫著『金瓜石第一戰俘營』。

    凱傑怎麼想也想不到，

    這想曾是二次世界大戰時期日軍的戰俘營。

    園區內有紀念牆，上刻當時被關在全臺各地四千多名戰俘姓名，並有雕像取名『夥伴』呈現歷史。

    根據當地人指出，以前這裡楚工

    綝，1942年，

    日軍在南洋戰役擄獲五百多名英、加、澳、紐等同盟國官兵，強迫他們在礦坑開礦。

    當時日軍戰敗時，曾下令若美軍攻台就把戰俘全部處死。原件現由美國國家檔案局保存！

