  group_stem: '未來影像新革命——AI 生成照片

    【資料一：新聞節錄】

    近年來，AI 生成圖片技術（如Text-to-Image）迅速發展，只要輸入文字描述，人工智慧便能自動產出符合語意的圖片。例如輸入「夕陽下的老書店」，系統便能在短短數秒內，生成一張擬真的場景照片。這類工具如DALL·E、Midjourney
    等，常被運用於藝術創作、商品設計、甚至新聞模擬重建等領域。然而，此技術也引發倫理與版權爭議，例如「虛構人物的真實感」可能混淆觀眾判斷，或涉及他人肖像權與創作版權的侵犯。

    【資料二：學生社群討論紀錄】

    亭安：我用AI 畫了一張「戴眼鏡的蒙娜麗莎」當作卡片封面，好玩又酷！

    思菱：可是老師說有些AI 圖不能用來投稿比賽耶，會被算抄襲？

    冠霏：我想用AI 做畢業紀念冊封面，這樣OK 嗎？

    代瑋：我姊說現在AI 圖片甚至可以騙過新聞記者，看起來超真！我覺得有點恐怖…'
