  stem: 根據兩篇文章，下列分析何者正確？
  options:
  - label: A
    content: 【甲】認為秦始皇無功，【乙】認為他毫無過失
  - label: B
    content: 【甲】認為秦始皇是暴君，【乙】則為其改革辯護
  - label: C
    content: 兩篇皆完全肯定秦始皇的統一政策
  - label: D
    content: 兩篇皆主張秦始皇不應被視為歷史上的重要人物。
  group_stem: '【甲】秦王掃六合，兼天下，內修法律，外攘夷狄。然焚書坑儒，嚴刑峻法，百姓怨苦。評曰：始皇帝雖有並天下之功，然好大喜功，不任仁政，卒以亡國。－《史記·秦始皇本紀》

    【乙】秦始皇被批評為暴君，但實際上，他是在中國歷史上第一次真正實現「天下一統」的人。他所建立的制度──郡縣制、統一法律與文字，為後世兩千年的中國政治文化定下基礎。焚書不是毀書，是禁書，是針對私學的思想控制，雖然手段嚴厲，但也反映了他對「官學主導」的信念。坑儒也非殺所有儒者，而是針對反抗者的政治清算，應以時代背景解讀，不應全然以現代價值批判。秦始皇不是暴君，而是實用主義的制度改革者。－李零《秦制兩千年》'
  tags:
    textbook: 第六冊（九下）第2次段考範圍
    labeled_by: ai
