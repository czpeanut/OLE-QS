  section: 1
  number: 20
  type: single
  page: 2
  stem: 民國 112 年 3 月 25 日, 「職權機關」在朝野政黨支持下，以 109 全數同意三讀通過「18 歲公民權」的憲法修正案，修憲內容為「中華民國國民年滿
    18 歲者，有依法選舉、罷免、創制、複決及參加公民投票之權。除本憲法及法律別有規定者外，年滿 18 歲者，有依法被選舉之權。《憲法》 第 130 條之規定，停止適用。」同年中央選舉委員會
    11 月 26 日舉辦修憲案複決投票，中選會公布最終票數，總同意票數 564 萬 7102 票、不同意有 501 萬 6427 票，未達通過門檻 961 萬
