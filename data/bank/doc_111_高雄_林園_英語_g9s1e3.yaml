  group_stem: "Once upon a time, there lived two rats. One rat lived in the bush.\
    \ The other rat lived in a house. One day, the rat that lived in the house said\
    \ to the rat that lived in the bush, “You eat badly, sleep badly, and it rains\
    \ on you.” “But us, we live in a cook’s house. We eat many different kinds of\
    \ food. We live comfortably. One day come and visit me and see,” said the house\
    \ rat. “I will come this very night,” said the bush rat. “I’m ready like a straw\
    \ for taking soda.”\n    At the same time, the owner of the house was mad. He\
    \ said, “These rats that eat my food, they will see!” This time, he set a trap\
    \ with sugar.\n    The rats came in to eat the goodies in the house. They came\
    \ laughing, “Chu…chu…chi…chi.” When they reach the trap, the house rat said, “Let\
    \ me taste this sugar. You see the goodies we eat here.” But before the rat could\
    \ take the sugar, the trap snapped. “PA!” The trap caught the rat’s head, and\
    \ his eyes bulged like eggplants.\n    The bush rat just looked and couldn’t move\
    \ a little. He then said, “E…heee!” My friend, which goodies did you eat that\
    \ made your eyes bugle?” But the house rat could not answer. The bush rat left\
    \ the house, saying, “Ha! I will not take the goodies you said.” “Your worst home\
    \ is better than your neighbor’s best home.”\n bush 草叢 trap 陷阱 goodies 好東西 snap\
    \ 斷裂"
  shared_asset: g5_21_25
  tags:
    textbook: 第五冊（九上）第3次段考範圍
    labeled_by: ai
