  group_stem: "Maki Kaji, a Japanese man who was known as the “Father of Sudoku,”\
    \ died at the age of 69. Mr. Kaji was a puzzle lover who helped turn Sudoku from\
    \ a simple number challenge into a game played around the world.\n    Mr. Kaji\
    \ was born in 1951 in Sapporo, Japan. He started Japan‟s first puzzle magazine,\
    \ Nikoli, with help from two of his friends in 1980. Over the years, Nikoli has\
    \ become very popular. There are many puzzles for people all over the world in\
    \ the magazine. But Sudoku is probably the puzzle that most people think of when\
    \ they remember Mr. Kaji.\n    Sudoku is a number puzzle with nine rows and nine\
    \ columns. Each row and column must have all of the numbers 1 through 9. The same\
    \ rule goes for each of the smaller 9-square boxes that make up the larger puzzle.\
    \ The puzzle has appeared since 1979 in puzzle books under the name Number Place,\
    \ and Mr. Kaji found it five years later. He loved the game, but he didn‟t like\
    \ its name. He then gave it a new name -- Sudoku, which means “single numbers”\
    \ in Japanese. It was this magazine that would plant the seeds for Sudoku to spread\
    \ widely around the world in later years.\n    By 2004, Sudoku became one of the\
    \ most-played puzzles in the world. Now millions of people play Sudoku every day.\
    \ Nikoli says that about 200 million people from about 100 countries have played\
    \ the puzzle. Sudoku isn‟t just popular – it‟s also a huge money-maker, bringing\
    \ in millions and millions of dollars. But Mr. Kaji never made much from the puzzle.\
    \ That didn‟t trouble him, for he published the puzzle for fun, not money. Mr.\
    \ Kaji believed the secret to making a great puzzle was to keep the rules simple\
    \ so that anyone could play. He said finding a new puzzle was exciting enough\
    \ for him.\n    It‟s that kind of spirit that has left many people in the puzzle\
    \ world so sad to hear that Mr. Kaji has died. Puzzle fans around the world have\
    \ thanked Mr. Kaji for his work, and thought of him as a true lover of puzzles.\n\
      puzzle 謎題 challenge 挑戰    magazine 雜誌 column 欄   spirit 精神"
