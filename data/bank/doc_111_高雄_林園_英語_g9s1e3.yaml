    soda?”
  options:
  - label: A
    content: He was prepared to drink the soda in the house.
  - label: B
    content: He was prepared to visit the house the house rat lives.
  - label: C
    content: He was prepared to visit the house rat and play games with him.
  - label: D
    content: He was prepared to collect straws together with the house rat to have
