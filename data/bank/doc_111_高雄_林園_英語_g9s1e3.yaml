  group_stem: 'Yesterday, I watched Jurassic Park, a popular movie in 1993, again.
    It is about a park full of different kinds of dinosaurs on an island. Where were
    those dinosaurs from? Some crazy men created them with the “cloning technology.”
    Cloning animals did happen in real life. A frog was successfully cloned in 1952,
    and over 20 kinds of animals have been cloned since then. Dolly, the sheep was
    the most famous one of them. Dolly was born in 1996, and she gave birth to six
    lambs in total. Sadly, she lived only 6.5 years although a sheep can usually live
    around 11-12 years. She began to get sick very often because she has been taking
    a lot of medicine. Finally, she died in 2003. Cloning didn’t appear to be very
    successful. However, Dolly still gave scientists hope to clone animals form the
    far past, like dinosaurs, or mammoths, a kind of large elephant. Some scientists
    even try to clone humans. Are they crazy? They are trying to break the rules of
    nature, which may bring a lot of problems we have never thought of. Have they
    forgotten the fact Dolly showed us that cloned animals have shorter lives? Are
    we happy when we live on a planet which is full of clones? Besides, how terrible
    and scared we can be when dinosaurs run after us like those in Jurassic Park !

     dinosaur 恐龍 clone 複製 technology 技術 lamb 羔羊 human 人類'
