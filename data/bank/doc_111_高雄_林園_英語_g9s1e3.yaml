    www.wbo.org\nBraille Facts – What is Braille?∣ World Braille Organization\nBraille\
    \ is a reading and writing system that is used by blind people. On this page,\
    \ you can read about what Braille is, how it‟s used, the history of Braille, and\
    \ how it‟s written.\nwww.centerstage.com\nBraille (2020)∣ Center Stage\nAre you\
    \ a theater fan? Then, the newest show is a must for you. Braille was written\
    \ by Andrea Freud Webber, and it has won several top prizes already…Not a member\
