  section: 1
  number: 31
  type: single
  page: 1
  stem: 利益團體與政黨皆是民眾向政府反映公共意見的重要媒介，下列關於兩者的敘述何者正確？
  options:
  - label: A
    content: 政黨為獲得更多民眾的支持，通常會與利益團體進行適度的合作
  - label: B
    content: 為了影響政府的政策，推派代表參選是利益團體主要的活動方式
  - label: C
    content: 政黨的成員數目通常比利益團體多，所以對政策的影響力非常大
  - label: D
    content: 為防止被民眾認定有政治立場，利益團體會避免參與選舉的活動 (習作)
  answer:
