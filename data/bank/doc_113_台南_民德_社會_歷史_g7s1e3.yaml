  - label: D
    content: 小中、小德、小民、小國。
  group_stem: '小民誤入時空隧道，經過長時間的漂流後，在時空隧道中相遇小德、小國及小中。四人又驚又喜的聊起自己的生長經歷，發現彼此都是臺灣人，於是進一步想要辨析彼此是否為同一時代的人。

    小民：「我住在當時臺灣商業最繁榮的城市之一，小時不論晴雨，我最喜歡去附近的不見天街玩，玩到夜色昏暗才回家。」

    小德：「金髮碧眼的統治者意識到若不在懸崖勒馬，將會沒有鹿皮可以出口，於是開始限制鹿皮的狩獵，即使鹿皮在當時是外銷寵兒，深受日本人民喜愛」

    小國：「我居住在咸菜甕（關西），我爸爸常常需要入山採樟，雖然很辛苦，但是當時樟腦賣得很好，所以再辛苦都值得。」

    小中：「我家住在臺灣南部，四歲那年我看著孔廟從零開始興建，統治者開始將儒家文教帶進台灣。媽媽總說在孔廟旁長大的孩子肯定不會學壞。」'
