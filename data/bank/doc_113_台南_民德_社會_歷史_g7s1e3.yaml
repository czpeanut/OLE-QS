  - label: D
    content: 林爽文事件。
  group_stem: 清咸豐年間的開港使行經臺灣的外國船隻增多，衝突事件也隨之增加，每次後山或是原住民發生與國外衝突事件時，清廷的態度都是「後山或原住民不是清廷的管轄範圍」，結果在國際間產生「後山主權無所屬」的主張出現，種下了往後日軍侵臺的遠因之一。在清廷眼中，後山一直是化外之地，直到牡丹社事件後，才使清廷發現後山主權不明確，會帶來國防上的危機，因此正式以國家的權力介入。東部原住民開始頻繁密切的接觸外來勢力，移入者不斷與原住民有所衝突，原住民的強烈反抗，使得開山軍隊不斷增兵，繼而發生了東部原住民捍衛生存空間反抗清廷之事件。
