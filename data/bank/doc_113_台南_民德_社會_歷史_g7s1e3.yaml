  stem: 雍正年間（1731年），原住民族道卡斯族位於大甲一帶的大甲西社，因清廷官吏指派勞役沉重而群起反抗，發動武裝抗官行動。事件平息後，清廷改大甲西社為「德化社」、牛罵頭社為「感恩社」、沙轆社為「遷善社」、貓盂社為「興隆社」，並設立土番「社學」引領部落發展。根據上文，關於以上的敘述下列何者正確？
