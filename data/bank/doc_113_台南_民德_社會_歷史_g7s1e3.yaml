  group_stem: 剝皮寮歷史街區保留了百餘年前清代街廓的歷史樣貌，遊走在這些老房子間，彷彿穿越時空，置身於當時老台北喧鬧繁榮的市井生活。剝皮寮旁是龍山寺，供奉觀世音菩薩，此神明是福建泉州三邑人自原鄉請來的，一旁的西昌街不到
    50 公尺的街巷則是赫赫有名的青草巷，歷經寺廟濃濃的線香「薰陶」，青草巷的草藥香或許更加令人心曠神怡。由於龍山寺和青草巷比鄰而居，以前附近的百姓若身體有病痛，往往先到寺裡求取藥籤，再到隔壁青草巷採買藥材。
