  stem: 1893 年，臺南《英國領事報告》提及：「南部比其他口岸更令外商失望，原是一個極為富庶的地區，卻無任何發展的跡象，貿易一直停滯，然而此時期的淡水港卻迎來出口貿易的盛況，一派欣欣向榮的景象。」
    請問造成此一現象最有可能的原因是什麼？
  options:
  - label: A
    content: 淡水港新設商業組織「郊」，安平港無力與之競爭
  - label: B
    content: 蔗糖的利潤以及國際競爭力漸不如茶葉
  - label: C
    content: 安平港官員仇視洋行，洋行在南部發展前景不佳
  - label: D
    content: 南部開發早已飽和，港口更是早已淤積不堪使用。
