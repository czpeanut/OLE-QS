  stem: 新埔褒忠亭「義民廟」是北臺灣客家族群共同的信仰中心，源自清乾隆年間，臺中大里杙庄的天地會盟主○○○，為了反對政府苛政因而發動民變。當時有不少生活受到嚴重影響的民眾選擇拿起武器，加入官兵的行列對抗這起民變，不幸犧牲的義民骨骸埋葬於此。清乾隆皇帝嘉勉在事變中出錢出力的義民，賜匾「褒忠」。請問上文中○○○發起清代規模最大民變應為何人？
  options:
  - label: A
    content: 郭懷一
  - label: B
    content: 朱一貴
  - label: C
    content: 林爽文
  - label: D
    content: 戴潮春。
