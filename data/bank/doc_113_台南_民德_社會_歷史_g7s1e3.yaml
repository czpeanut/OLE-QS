  stem: 某時期的台灣社會，群眾常因不同祖籍和職業產生隔閡而爆發集體衝突，而北管的派別競爭也是其他之一。當時宜蘭的北管戲曲根據樂器不同而分成「福祿」、「西皮」二派，在廟會時兩派相互競爭，糾眾鬥毆，後逐漸擴大到基隆、台北、花蓮等地，成為社會治安的漏洞。關於上述現象的發生，何者敘述最適當﹖
