- id: doc_113_屏東_中正_自然_g8s2e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: '沛捷拿到四杯透明無色的液體，分別是乙酸、乙醇、乙酸乙酯和己烷。她分別做了下列三組實驗，結果如附圖三表格所示，則甲、乙、丙、丁依序為何種液體？


    | 編號 | 取 5 mL 液體加入 5 mL 水 | 用手搧聞 | 取 2 mL 液體放入碎貝殼 |

    | :--- | :--- | :--- | :--- |

    | 甲 | 不溶於水 | 有香味 | 沒有氣泡 |

    | 乙 | 不溶於水 | 無香味 | 沒有氣泡 |

    | 丙 | 可溶於水 | 無香味 | 沒有氣泡 |

    | 丁 | 可溶於水 | 無香味 | 產生氣泡 |'
  options:
  - label: A
    content: 乙醇、乙酸、乙酸乙酯、己烷
  - label: B
    content: 乙酸、乙醇、己烷、乙酸乙酯
  - label: C
    content: 乙酸乙酯、己烷、乙醇、乙酸
  - label: D
    content: 己烷、乙酸、乙酸乙酯、乙醇
