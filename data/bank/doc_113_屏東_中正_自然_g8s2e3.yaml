- id: doc_113_屏東_中正_自然_g8s2e3_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 蟑螂主要是靠體節上的小孔呼吸，而且他們的體表覆有一層蠟與油脂，因此蟑螂即使掉入水中仍得以逃生，然而蟑螂若掉入含清潔劑的水溶液中，則會在短時間內死亡。請依據上述內容推測下列何者為蟑螂合理的致死原因？
  options:
  - label: A
    content: 清潔劑具腐蝕性，溶解蟑螂
  - label: B
    content: 蟑螂的密度比清潔劑大，所以沉入水中，窒息而死
  - label: C
    content: 清潔劑具有毒性，毒死蟑螂
  - label: D
    content: 清潔劑溶解蠟與油脂，造成呼吸孔進水，窒息而死
