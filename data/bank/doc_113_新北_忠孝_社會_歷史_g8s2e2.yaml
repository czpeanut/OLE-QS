- id: doc_113_新北_忠孝_社會_歷史_g8s2e2_s1_32
  section: 1
  number: 32
  type: single
  page: 1
  stem: '32. 「三國元首第一次達成協議表示，戰爭的目標之一乃是達成日本無條件投降。美國也強力支持國民政府的立場，力主

    戰後東北、臺灣、澎湖歸還中國。而此宣言雖不是正式的條約，卻至少相當程度反映了美國官方的立場，不僅影響了戰後

    接收日本統治區域的安排，國民政府也在次年（民國33 年）成立由陳儀負責的「臺灣調查委員會」，進行接收臺灣的準備

    工作。」請問：上述內容與下列何者最為相關？'
  options:
  - label: A
    content: 雅爾達會議
  - label: B
    content: 西安事變
