- id: doc_113_新北_忠孝_社會_歷史_g8s2e2_s1_33
  section: 1
  number: 33
  type: single
  page: 1
  stem: '33. 「我們從前何以不從事於有組織、有系統、有紀律的奮鬥？因為未有模範，未有先例之故。現在一位好朋友鮑羅庭是

    從俄國來的，……蓋俄國革命之成功，一方面是因黨員積極奮鬥，二方面又有兵力幫助，故吾等欲革命成功，要學俄國組

    織及訓練黨員的方式，方有成功的希望。……所以我請鮑羅庭做吾黨的訓練員，使之訓練吾黨同志，鮑羅庭辦黨極有經驗

    望各同志犧牲自己的成見，誠意去學他的方法。」請問：上文與下列何者最為相關？'
  options:
