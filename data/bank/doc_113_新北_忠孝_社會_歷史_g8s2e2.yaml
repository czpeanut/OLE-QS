    閱讀下列內容後回答問題：

    資料一：民國17 年，北伐軍正在挺進北京、天津等地，當時統治北京政府的軍閥張作霖見大勢已去，於6 月3 日搭乘鐵

    路專車，返回他的老地盤──中國東北地區。日本人對東北懷有野心，決定置張作霖於死地，希望藉此引發東北混亂，趁

    機進軍占取。4 日清晨，專車就要抵達瀋陽，卻在行經皇姑屯時，遭到日軍預埋的炸藥襲擊，轟然一聲，車廂被炸得慘不

    忍睹，張作霖傷重不治，張家長子張學良繼承父業，而這場「皇姑屯事件」對張作霖家族和中國的影響都很巨大。

    資料二：民國20 年，日軍製造九一八事變後，不但占領整個東北，還成立滿洲國，張學良和他的東北軍因此再也回不去

    老家。他無法忘懷這一件件的國仇家恨，最後拒不服從國民政府當時的政策，發動了震驚中外的西安事變。'
