- id: doc_113_新北_忠孝_社會_歷史_g8s2e2_s1_29
  section: 1
  number: 29
  type: single
  page: 1
  stem: '29. 民國76 年第24 屆金馬獎最佳劇情片為稻草人。該片描述日治時期宜蘭一對佃農兄弟的故事：兩兄弟連續經歷了收

