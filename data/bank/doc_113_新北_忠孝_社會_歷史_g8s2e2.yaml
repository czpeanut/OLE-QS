  section: 1
  number: 31
  type: single
  page: 1
  stem: '31. 「因為戰爭的緣故，北平（今北京）淪陷，清華大學、北京大學以及南開大學共同組成臨時大學，配合政府應戰策略，

    先南撤到湖南長沙繼續開課。但敵軍的飛機頻繁轟炸，學生大部分時間都在教室和防空洞間來回跑著。隨著戰事吃緊，

    首都遷往重慶，學校也遷徙到雲南。」文中的戰爭最可能是下列何者？'
