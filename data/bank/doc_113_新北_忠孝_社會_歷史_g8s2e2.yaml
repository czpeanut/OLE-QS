- id: doc_113_新北_忠孝_社會_歷史_g8s2e2_s1_30
  section: 1
  number: 30
  type: single
  page: 1
  stem: '30. 「因為情勢危急，政府決定挑選故宮精品運往臺灣，1948 年第一批箱件由海軍載運駛離南京，抵達基隆。次年，第二、

    三批文物亦先後運抵臺灣。運往臺灣的國寶文物，雖然只是南遷文物的四分之一，但都是精品中的精品，其中包括了西

    周的毛公鼎、王羲之的〈快雪時晴帖〉以及蘇東坡的〈寒食帖〉等，然而卻留下了曠世珍品「后母戊鼎」，主要是因為該鼎重

    達875 公斤，無力搬運，最後只好留在中國大陸。」請問：上文所述的情況與下列何者最為相關？'
  options:
  - label: A
    content: 遷都重慶
  - label: B
    content: 國共內戰
  - label: C
    content: 七七事變
  - label: D
    content: 西安事變。
