  group_stem: "■ 閱讀以下資料，回答14-16 題:\n資料一：\n  1095 年夏天，教宗烏爾班二世在法國的克萊蒙發表演說：「……死於這場戰爭是光榮的，你能洗清罪惡，在天堂將要得到獎賞！甲敵人現今盤踞在聖地，並且我們在希臘的同胞岌岌可危，敵人對他們展開無情的摧殘，我們需要挺身而出，幫助我們在東方的弟兄！拿起武器吧，因為上帝的旨意本是如此！」\n\
    資料二：\n  「君士坦丁堡陷落了，我們竟讓乙異教徒獲勝了。我們帶著行囊逃難，裡面是我們碩果僅存的家當，以及一點點的經書。唉，逃往羅馬的路途竟然如此漫長！」"
