  group_stem: "【網路文章】\n    吉伊卡哇本是個個於日本連載的網路漫畫，副標題為「這又小又可愛的傢伙」，紀錄的是主角吉伊卡哇與他朋友們簡單又夢幻的日常生活。\n\
    \    雖然吉伊卡哇造型可愛、說起話來更是呆萌，但其實他們的世界觀卻如我們的社會一般現實。雖然故事背景訂在森林中，但他們同樣擁有著貨幣經濟和網際網路的存在，因此想要交易，就必須透過「勞動」來換取貨幣。\n\
    \    這些工作以除草和討伐為主，但卻沒有我們之間想像的單純，這些工作地區還有依照等級劃分。除草證書共分為五個等級，五級最小，一級最高，他們必須透過考照來獲得前往更高級地區工作的許可權，而等級越高，所得報酬自然也越高。\n\
    \    也因為有了這樣的階級制度，吉伊卡哇的世界裡也產生了貧富差距，而這個現實，是所有人入坑吉伊卡哇的粉絲在認識之後，最感到驚訝的一點。請根據內容回答第31-33題："
