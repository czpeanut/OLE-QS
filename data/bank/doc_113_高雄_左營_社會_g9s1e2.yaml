    \ Mac」的漢堡等等，來創造新的話題幫自己增加銷售。不過即使是競爭對手，在行銷廣告上也不一定要相互詆毀。阿根廷的漢堡王近日宣布停售他們的招牌漢堡「華堡Whooper」一天：當顧客點餐點到華堡時，店員會委婉告訴他們今天沒有販售，反而請他們就近到對街的麥當勞去點「大麥克Big\
    \ Mac」！原因正是因為麥當勞當天只要販售出一個招牌漢堡「大麥克Big Mac」，便會捐出2美元給兒童癌症機構，漢堡王停止販售華堡的舉動，目的希望能夠轉而提高麥當勞大麥克的銷售。\n\
    \    麥當勞每年都會舉辦該種類型的公益活動，當你購買一款指定的特殊漢堡，麥當勞都會捐出2美元給慈善機構。當兩者為競爭對手，但卻不一定要相互攻擊，將對方視為眼中釘抹黑，才能宣傳自己。漢堡王選擇在公益方面與麥當勞攜手，其實這已經不是阿根廷的漢堡王第一次舉辦「沒有華堡的一天」這個活動了，在2017年就曾經舉辦過一次同樣的活動，同樣也是造成相當大的迴響廣受好評。最後漢堡王當天也並沒有因為沒賣華堡而業績變差，顧客反而轉而選擇其他口味的漢堡；而麥當勞大麥克的銷量也比去年增長73437個，這樣的舉動達成了兩者雙贏的結果。期待未來這個有趣也有意義的活動台灣也可以舉辦！\n\
