- id: doc_113_桃園_桃園_英語_g9s1e1_s7_41
  section: 7
  number: 41
  type: single
  page: 4
  stem: 41. What is the reading mainly about?
  options:
  - label: A
    content: Time is money.
  - label: B
    content: Life is short, play it hard.
  - label: C
    content: Ideas about time in different countries.
  - label: D
    content: Why people in big cities are busy.
  group_stem: 'We all have twenty-four hours a day. No matter who we are, the time
    in a day is all the same. But the same amount of time can be used very differently.
    The ideas about time can be different from person to person, and even from country
    to country.

    If you have been to any big city, like Tokyo or New York, you may feel that everyone
    in those cities seems very busy. People there are usually in a hurry and walk
    fast. They make good use of every minute, trying to do as many things as they
    can. They take time seriously. Any delay will not be allowed, and any time wasted
    on waiting is not smart.

    But some of the countries are different. For example, people in Spain and Italy
    don’t mind if their friends are a little late for dates, or buses delay for several
    minutes. Some companies in Spain and Italy even give workers enough time to enjoy
    a great lunch and allow them to go home and sleep for some time in the afternoon.
    For them, everything will be done at last, and there’s no need to hurry.

    When you understand the different ideas about time in the world, you will find
    it easier to get used to different life modes. So next time when you travel to
    a foreign country, just try to enjoy and feel the moment.


     amount 數量 seem 似乎 delay延遲 allowed允許 mode 模式'
  tags:
    textbook: 第五冊（九上）第1次段考範圍
    labeled_by: ai
