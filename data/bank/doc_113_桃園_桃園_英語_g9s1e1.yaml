  section: 7
  number: 39
  type: single
  page: 4
  stem: 39. According to the reading, what information can we get by scanning QR codes?
  options:
  - label: A
    content: How much the product is.
  - label: B
    content: Who makes the product.
  - label: C
    content: When the product is sent.
  - label: D
    content: What is inside the product.
  group_stem: 'The first QR code system was made in a car company in Japan. It was
    used to keep track of the production process.

    Now, we can find QR codes on websites, in the supermarkets, and many other places.
    A lot of information can be stored in them, like website links, phone numbers,
    or a text with more than four thousand words. We can just scan the codes and get
    the quick information. The following are three uses of QR codes in everyday life.

    1. Sales and marketing:

    They provide a faster and more convenient way to direct people to online shops.

    2. Education:

    They help students find the books or information in classrooms and libraries.

    3. Product packaging:

    These QR codes make buyers get more details about the product, such as nutrition
    facts and the expiration date.

    Most smartphones have built-in QR code scanners. Users just need to turn on their
    phone camera, scan the codes, and the information will be shown on their screen.


     system 系統  company 公司  track 追蹤  production 生產  process 過程  text 文本  scan 掃描
    direct 指引  education 教育  product 產品  details 細節  nutrition 營養  expiration date
    有效日期'
  tags:
    textbook: 第五冊（九上）第1次段考範圍
    labeled_by: ai
