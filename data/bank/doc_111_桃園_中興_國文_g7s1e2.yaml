- id: doc_111_桃園_中興_國文_g7s1e2_s2_21
  section: 2
  number: 21
  type: single
  page: 3
  stem: '如果每個段落前要訂小標題，下列何者正確？

    | 標題 | (Ａ) | (Ｂ) | (Ｃ) | (Ｄ) |

    |---|---|---|---|---|

    | （甲） | 淺山生態系的功用 | 淺山生態系的價值 | 為什麼會有淺山生態系 | 什麼是淺山生態系 |

    | （乙） | 淺山生態系的特色 | 人與淺山生態系的關係 | 淺山生態系的作用 | 淺山生態系的重要性 |

    | （丙） | 淺山生態系的物種 | 如何保護淺山生態系 | 淺山生態系的影響 | 淺山生態系的危機 |'
  options:
  - label: A
    content: （如表格所示）
  - label: B
    content: （如表格所示）
  - label: C
    content: （如表格所示）
  - label: D
    content: （如表格所示）
  group_stem: '(甲)

    「淺山」是指人容易到達的生態環境，與那些跋山涉水才能到達的深山、高山相比，淺山地區是我們走走路、騎車或開車就可以輕易到達的地方。科學家說：淺山是指海拔 800
    公尺以下的區域，其中包含了溪流、溼地、草原、森林等等的自然環境，也包含了農田、果園、林地、放養牛羊的牧區、公園等等的人類活動環境。在這個適合居住的生存帶裡面，除了人類，當然也有其他的生物居住，如蟲、鳥、蛙、龜、食蟹獴、麝香貓、穿山甲，還有飛翔的鳳頭蒼鷹等，都是這裡獨特的居民。

    (乙)

    「淺山」因為就在我們居住環境的周圍，對我們的生活影響十分直接，人類也需要依存淺山來增加我們的生活品質。「淺山生態系」中的「森林」可以淨化空氣、涵養水源、防範土石崩落；「平原」地區可以讓悶熱的空氣吹散，調節氣溫；「溼地」更可以在大雨的時候蓄水滯洪，防止淹水。而生態系中生活的生物，更維持著生態平衡，食物鏈的健全讓我們的農田果園不會有嚴重蟲害。除了這些物理、生物性的價值外，淺山環境裡的公園、步道更提供我們休閒遊憩調適身心的好地方，讓人在繁忙的工作壓力下，心靈可以得到紓解與平靜，也讓居住在城市裡的居民，有個可以享受大自然的好去處。

    (丙)

    由於「淺山生態系」就在人類聚落的周圍，所以容易直接面對人類的開發與迫害，工程建設、興建房屋、造橋開路與農耕放牧等等行為，使得淺山環境支離破碎，自然的區域被大量開發使用。加上，人類活動所產生的汙染，如各式廢水、廢棄物、髒空氣等直接被排放到環境中，毒害了森林溪水與土壤，傷害生態系的健康。有時候，民眾寵物的棄養或放生，入侵到生態系裡面，也干擾、危害原本生活在淺山的生物。另外，由於淺山的便利性，也常常吸引獵人進入，捕捉生態系裡的動物，像是飛鼠、白鼻心、野兔常常是捕捉的對象，有時候石虎也會被捕捉。生活在淺山的生物，除了面對大自然的考驗外，更要直接面對人類所造成的傷害。

    （節錄自網路資料石虎森林）'
