  section: 1
  number: 15
  type: single
  page: 2
  stem: (15)依據上文中的內容可知，馬拉松戰役之所以爆發的主要原因為何？
  options:
  - label: A
    content: 希臘城邦爭相舉辦奧運
  - label: B
    content: 希臘城邦爭奪領導權力
  - label: C
    content: 波斯帝國向外擴張勢力
  - label: D
    content: 雅典面臨來自羅馬威脅
  group_stem: "6、小容正在閱讀某場戰爭的故事，請根據內容回答問題。\n後世對於波 希戰爭的認識，主要來自希臘史家希羅多德所編纂的歷史一書。書中提到，馬拉松戰役之前，雅典的將領派遣一位名叫菲迪皮德斯的信使，長跑趕往斯巴達求助援兵，兩天之間，趕了240\
    \ 公里路。\n  一世紀時，一位希臘作家普魯塔克在文章中描述，當雅典軍在馬拉松平原打敗波斯軍後，傳令使者由馬拉松平原跑回雅典報捷。百年之後，羅馬帝國時代的另一位作家敘述了這個報捷的故事：這位使者名叫菲迪皮德斯，他從馬拉松戰場到雅典全程跑了約40\
    \ 公里。當他回到雅典，將勝利的消息轉告雅典人後，旋即力竭而亡，而這亦是馬拉松長跑的來源。"
