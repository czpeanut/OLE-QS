- id: doc_113_台中_居仁_社會_歷史_g9s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: (1)根據第104、105 條的條文，可推知巴比倫人重視下列何者？
  options:
  - label: A
    content: 商業獲利的多寡
  - label: B
    content: 交換物資的方式
  - label: C
    content: 簽訂交易的契約
  - label: D
    content: 買賣商品的內容
  group_stem: "1、請閱讀以下文章，請閱讀後回答問題。\n    西亞古文明當中，最有名的文化遺產當屬《漢摩拉比法典》。頒布法典的古巴比倫王漢摩拉比稱此法典是由天神傳授，所以他在法典的序言中聲明：「……天神叫道：『漢摩拉比，值得讚美的人君，諸神的虔敬者，你當使正義廣被四方，你當除滅邪惡，你當教化萬民，你當增進萬民福祉。漢摩拉比，……你使巴比倫繁榮昌盛……』。」漢摩拉比藉由序言，向統治區域的人們宣稱自己是受神明認可的正義國王。\n\
    法典正文有282 條，試舉其中幾條為例：\n第104 條：若大商人把穀物、羊毛、油或其他貨物交給小商販出售，則小商販應結算金額給大商人。小商販交給大商人的錢，要收取蓋章的文件。\n\
    第105 條：小商販交給大商人的錢，若沒有收取蓋章的文件，則這些錢就不算數。\n第196 條：若一個平民打瞎另一個平民的眼睛，前者的眼睛應該被打瞎。\n第199\
    \ 條：若一個平民打瞎一個奴隸的眼睛或打斷他的骨頭，平民應該賠償此奴隸身價的一半。"
