- id: doc_113_台中_居仁_社會_歷史_g9s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: (5)上文中提到人們必須在神的面前接受審判，並且不斷的宣稱自己是無罪且純潔無瑕，顯示一種死後審判的觀念。這樣的觀念最可能流行於古代的哪一個地區？
  options:
  - label: A
    content: 埃及
  - label: B
    content: 波斯
  - label: C
    content: 印度
  - label: D
    content: 巴比倫
  group_stem: "2、下列是節錄自死者之書的短文，請閱讀後回答問題。\n噢！讚美您！偉大的神，正義與真理的主宰。\n  我的主宰，我被帶到此地，來到您的面前，瞻仰您美麗的神采，並接受您的審判。我知道您，我知道您，也知道您和正義與真理判官中四十二位神的名。祂們監管罪犯，並當罪人在您面前受審之日，以吞飲他們的血為生。事實上，正義的主宰就是您的名。\n\
    \  我來到您面前，我曾為您彰顯正義，我曾為您消滅欺詐罪惡。我不曾對人行惡，我不曾虐待牛隻，我不曾在神廟中褻瀆神靈，我不曾知道人不該知道之事，我不曾行惡，我不曾蓄意製造聲譽，我不曾對神口出惡言，我不曾對窮人施暴……我不曾偷竊神的牛隻，我不曾阻攔神的遊行。我純潔無瑕！我純潔無瑕！我純潔無瑕！\n\
    資料來源：邢義田譯著(2006)。西洋古代史參考資料(一)。臺北：聯經出版公司。"
