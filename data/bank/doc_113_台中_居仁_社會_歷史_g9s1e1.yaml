  section: 1
  number: 8
  type: single
  page: 1
  stem: (8)由上述的短文內容來看，這應該是描述哪一位君主的重要事蹟？
  options:
  - label: A
    content: 奧古斯都
  - label: B
    content: 阿育王
  - label: C
    content: 漢摩拉比
  - label: D
    content: 釋迦牟尼
  group_stem: '3、請閱讀下列短文並回答問題。

    他為了奪取王位與手足進行激烈的內鬥，並謀殺了兄弟姐妹九十九人，最後成功登上王位。他即位後不久，便積極對外擴張，其中最大規模的一次擴張是對羯陵伽國的遠征，此次軍事行動有十五萬人被俘虜，十萬人被殺，死傷數十萬。這次的戰爭對他帶來了深遠的影響，之後他開始大力推崇某一宗教，並舉辦宗教集會，派出許多傳教團體向周遭國家宣揚此一宗教。

    資料來源：郭豫斌主編(2013)。圖解世界史。臺中：好讀出版社。'
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 歷史
      code: 3-1
