  group_stem: "11、小岑是一位麵包烘培師，他正在閱讀一篇與麵包起源有關的文章，請依據文章內容與你所學知識回答下列問題。\n    古美索不達米亞的吉爾伽美什史詩中引述智慧之神的一段話：「將賜給你一次大豐收，早上讓麵包從空中傾盆而下，晚上降下小麥雨。」這段話象徵對大豐收的歡慶，麵包、小麥從天而降是人類想像中最幸福的事。\n\
    \  古西亞地區率先將小麥馴化為人工栽培作物，使得由小麥製成的麵包成為中東與西亞民眾賴以維生的基本糧食。根據考古發現，古美索不達米亞人已有麵包店。古埃及人以麵包為主食，人們將小麥磨成麵粉，然後做成各種麵點。根據新王國時期的一份文件，埃及有100\
    \ 多種不同的麵包，在壁畫中常見的有半圓形的、有角椎狀的，也有切成片狀的，不一而足。麵包的種類雖多，但從一些木乃伊的牙齒磨損狀況來看，有些學者認為當時人所吃的麵包中含有相當多的沙粒，因為在磨麵粉時，磨石上的碎石會混入麵粉。古希臘人也曾經抱怨，吃了埃及的麵包會把牙齒磨壞。"
