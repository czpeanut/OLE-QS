- id: doc_113_高雄_英明_自然_g8s2e1_s1_49
  section: 1
  number: 49
  type: single
  page: 6
  stem: 小中看完上述的簡介之後，可以得到以下哪些資訊？
  options:
  - label: A
    content: 製陶的順序是先塑陶、再燒窯，最後才是上釉並等待顏料風乾
  - label: B
    content: 同一種釉藥，經燒窯後的顏色都會相同
  - label: C
    content: 成品最終的顏色，受到燒製環境中氧氣的含量影響
  - label: D
    content: 成品最終的顏色，受到燒製的時間與溫度影響。
  group_stem: "【題組】閱讀下列敘述後，請回答第49〜50 題問題：\n手拉坏．燒窯科學．上釉\n〔行程介紹〕\n．手拉坏DIY\n將陶土放在可轉動的輪盤上，應用不同手勢把陶土逐漸塑造出想要的形狀。\n\
    ．燒窯科學\n陶瓷藝品可以根據燒成條件的不同，分為「氧化燒」及「還原燒」。\n氧化燒是在空氣對流旺盛的環境下燒窯，此時釉藥會氧化形成新的化學物質，藉此變化出其他顏色；\n\
    而還原燒是在氧氣不足的環境下燒窯，此時釉藥中的氧會釋出而變化出另一種色彩。\n本課程將介紹不同釉藥在不同環境下的顏色變化。\n．上釉DIY\n最後就運用你從「燒窯科學」中學到的知識，幫你的陶藝作品上色吧！\n\
    \                                                                    (自然在身邊 燒窯學問大)"
