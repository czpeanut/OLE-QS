    |---|---|---|

    | (A) | 豪雨 | 增加土體重量且減少摩擦力 |

    | (B) | 風化嚴重 | 岩層破碎，提供土石來源 |

    | (C) | 砂頁岩互層的順向坡，且坡腳被挖除 | 岩層無坡腳支撐 |

    | (D) | 氣候乾燥炙熱，地下水面下降太多 | 因地下水減少，岩層間的摩擦力也變小 |'
