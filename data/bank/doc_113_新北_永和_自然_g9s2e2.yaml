  stem: 日本鰻在河川中成長，將成熟時，洄游數千公里到馬里亞納群島海域產卵。孵化後，幼魚隨北赤道洋流與黑潮漂游到近岸，再游進河川。每年冬季都可見日本、韓國、臺灣、中國等地漁民於沿岸捕撈鰻苗供養殖所需。根據短文，以下推論何者有顯著錯誤？
