- id: doc_111_高雄_林園_國文_g8s2e2_s5_7
  section: 5
  number: 7
  type: single
  page: 5
  stem: 根據本文，下列何人的發言可看出其屬於「沉浸回憶型」的老人？
  options:
  - label: A
    content: 阿旺：你們年輕人就是過太好，才不懂感恩
  - label: B
    content: 阿泉：我教你的這些都是我歷練的智慧，你一定要聽
  - label: C
    content: 阿良：我這麼老了，你們這些現代年輕人不懂得讓座嗎？
  - label: D
    content: 阿火：想當年我當兵輕鬆跨越五百障礙，你們現在可不同囉
  group_stem: "一、人生糾察隊型\n  當我們與長輩分享生活大小事，試圖找到共鳴時，難免有長輩喜歡對於生活習慣、衣著、嗜好、工作等指指點點，甚至開始批評你的生活，告訴你要怎麼做才對。\n\
    \  多數長輩其實只是出自於關心，當你向他們提起你的生活時，他們想要與你分享過往的生活經驗。那些聽來刺耳的批評，只是他們不懂得如何表達關心與建議。\n  面對長輩的批評時，先別急著反駁，可以聆聽或詢問他們為什麼會有這樣的想法，當然也可以試著對長輩說出心中的看法，兩邊互相交流意見，相信會比針鋒相對的爭吵好。\n\
    二、年齡階級型\n  這類型的老人在聊天時，常常會仗著自己的年紀大，拒絕接受新知又或是倚老賣老要求年輕人聽他的話。\n  這類型長輩個性比較保守，可能與早期臺灣傳統家庭教育有關，他們通常認為晚輩應該聽從長輩的諫言，因為長輩的人生閱歷與年紀都比年輕人多。\n\
    \  面對這類型的長輩，一開始可以先跟著他附和，先讓他覺得自己的觀點被聆聽後，再開始訴說你的想法。這樣的溝通方式較不強硬，可減少衝突發生。\n三、沉浸回憶型\n\
    \  許多長輩在聊天時，很喜歡把過去的豐功偉業或是回憶一再重複的敘述。\n  人生到了晚年，常常會開始想起年輕時的回憶，對於長輩而言，面對朋友逝去，難免會開始懷念起自己人生中美好的過往。\n\
    \  面對這種情況，聆聽是最好的溝通方式，當長輩說這些回憶故事時，有人傾聽，可減少孤獨感，讓他們覺得被關注，或是可以讓長輩多和同年齡的人互動，從中獲得歸屬感。（老人溝通策略：３種常見老人聊天類型與應對方式）"
  answer:
  - D
