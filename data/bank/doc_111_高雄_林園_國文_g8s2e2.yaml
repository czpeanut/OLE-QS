  group_stem: '有人盜高廟（１）坐前玉環，捕得，文帝怒，下廷尉治。釋之案律盜宗廟服御物者為奏，奏當棄市（２）。上大怒曰：「人之無道，乃盜先帝廟器。吾屬廷尉者，欲致之族（３）。而君以法奏之，非吾所以共承宗廟（４）意也。」釋之免冠頓首（５）謝（６）曰：「法如是足也。且罪等，然以逆順為差。今盜宗廟器而族之，有如萬分之一，假令愚民取長陵一抔土，陛下何以加其法乎？」久之，文帝與太后言之，乃許廷尉當。（史記張釋之馮唐列傳）


    【注釋】（１）高廟：指祭祀漢高祖的廟。（２）棄市：死刑。古代將囚犯殺死後拋棄於市集示眾，故稱「棄市」。（３）族：古代刑法名，抄家滅門，殺死全族。（４）共承宗廟：恭敬的守護祖宗的廟宇。共，音ㄍㄨㄥ，通「恭」。（５）免冠頓首：脫帽叩頭。古人脫帽，表示有罪。（６）謝：賠罪、認錯。'
  answer:
  - D
