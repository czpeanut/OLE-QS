- id: doc_111_高雄_林園_國文_g8s2e2_s5_1
  section: 5
  number: 1
  type: single
  page: 3
  stem: 「她們喉中也卡著痰。她們遠渡異國，含著那塊濃痰，口音混濁地學習陌生的語言，手忙腳亂做醫師與家屬之間的橋梁，每天在醫院裡替另一個痰聲隆隆的老人拍背，過著呼吸少少新鮮空氣的生活。卻沒有人想要幫她們化痰。」關於這段文字，下列敘述何者正確？
  options:
  - label: A
    content: 外籍看護長期與病人相處，身心不堪負荷，出現與病人相似的病徵
  - label: B
    content: 對於外籍看護在異鄉工作的艱辛，少有人願意主動了解並給予關懷
  - label: C
    content: 醫院裡的生活品質欠佳，使外籍看護心中累積不滿的情緒，進而積鬱成疾
  - label: D
    content: 外籍看護不熟悉工作內容，身旁的人也都不願意教導她們，讓她們無所適從。
  group_stem: "每一個病弱的老人，幾乎身旁都有一位黝黑的外籍看護。大眼、微胖，略捲的黑髮。我總是無法區分她們到底來自菲律賓、印尼，還是其他東南亞國家，只知道她們大多羞怯而細心，總是把身形藏在陰影裡，彷彿她們只是病房中一抹淡淡的異國香水，沒有實質地位。而早起查房時會遇到的人卻總是她們。主治醫師拉開簾子，讓一聲爽朗的早安與晨間淡淡的陽光一股腦倒進病榻上，會問正睡眼惺忪從一旁陪客椅上掙扎著爬起來的她們說，阿公昨天吃得怎麼樣啊？有沒有帶他們出去走走？\n\
    \   除此之外她們很少說話，一部分是因為中文還不太好，另外也是她們總被定位為家屬與醫師之間，像答錄機或接線生之類、常被人忽視的存在。醫師要解釋病情的時候，她會慌亂地打開她在附近夜市買的仿名牌小提包，拿出貼了水鑽貼紙的廉價手機，小小聲地用不流暢的中文打給她的老闆，然後將手機交給醫師。\n\
    \   在某些晴朗的黃昏，醫院外的湖邊常常聚集著還能坐輪椅出來的老人。在這治療都已結束，卻還不必急著回病房的時刻，常常可以看到湖畔輪椅排排坐曬太陽，上面癱著面無表情的病人，像是晴天時從櫥櫃深處拖出來晾的冬天厚棉被，散發著霉味與溼氣；他們身後母親般的外籍看護則把握一天中難得的悠閒時光，與同鄉用流暢的母語談笑，完全不似在病房時的那種緊張羞怯。\n\
    \   偶爾下班時經過湖邊，黃昏金黃色的靜謐時光，老人們吊著點滴，或插鼻胃管，或做氣切，在湖畔的微風裡彷彿一排陽台上安靜曬太陽的盆栽。他們的外傭就站在身後聊天，陽光斜斜打在她們臉上，深邃五官映出堅毅的影子；而她們臉上線條和緩，這是一天之中，難得不用拍痰、灌食或更換尿布的悠閒時光。\n\
    \   她們喉中也卡著痰。她們遠渡異國，含著那塊濃痰，口音混濁地學習陌生的語言，手忙腳亂做醫師與家屬之間的橋梁；每天在醫院裡替另一個痰聲隆隆的老人拍背，過著呼吸少少新鮮空氣的生活。卻沒有人想要幫她們化痰。\n\
    \   在這間醫學知識建構出來無比繁複的醫院裡，病床旁邊的醫師與家屬來去匆匆，留下床上的病人與他們的外籍看護，默默地在剩餘的緩慢時光中拍痰。比起醫護人員，只會拍痰的她們懂得最少，卻也懂得最多。\n\
    （節錄自阿布〈拍痰〉）"
  answer:
  - B
  answer_source: answer_key_vlm
  tags:
    textbook: 八下 第六課 迷途羔羊──弗氏海豚
    labeled_by: ai
