  options:
  - label: A
    content: 蟬聲是一陣襲人的浪，不小心掉進小孩子的心湖。於是湖心拋出千萬圈漣漪，如千萬條繩子，要逮捕那陣浪
  - label: B
    content: 那低咽的簫聲又傳來了，幽幽的，如同一隻到處漫遊的光焰微弱的螢火蟲，飛到她的心中
