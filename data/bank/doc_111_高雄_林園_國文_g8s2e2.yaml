    \  面對這類型的長輩，一開始可以先跟著他附和，先讓他覺得自己的觀點被聆聽後，再開始訴說你的想法。這樣的溝通方式較不強硬，可減少衝突發生。\n三、沉浸回憶型\n\
    \  許多長輩在聊天時，很喜歡把過去的豐功偉業或是回憶一再重複的敘述。\n  人生到了晚年，常常會開始想起年輕時的回憶，對於長輩而言，面對朋友逝去，難免會開始懷念起自己人生中美好的過往。\n\
    \  面對這種情況，聆聽是最好的溝通方式，當長輩說這些回憶故事時，有人傾聽，可減少孤獨感，讓他們覺得被關注，或是可以讓長輩多和同年齡的人互動，從中獲得歸屬感。（老人溝通策略：３種常見老人聊天類型與應對方式）"
  answer:
  - C
