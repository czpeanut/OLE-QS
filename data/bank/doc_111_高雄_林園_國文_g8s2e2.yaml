- id: doc_111_高雄_林園_國文_g8s2e2_s5_9
  section: 5
  number: 9
  type: single
  page: 5
  stem: 文中對「天婦羅」的說明，下列何者正確？
  options:
  - label: A
    content: 以烹飪的方式而言，天婦羅應屬油炸類
  - label: B
    content: 因偏重於燒烤，所以最早以攤販形式出現
  - label: C
    content: 不論葡萄牙或西班牙文，日人透過「意譯」取名天婦羅
  - label: D
    content: 它的起源和日本人喜歡吃野味有關。
  group_stem: "天婦羅緣起於攤販。炸天婦羅會冒油煙，還可能引起火災，因此適合以攤子的型態販售。天婦羅攤出現於安永年間，當時正值蕎麥麵攤增加，土用丑日（時間不固定，約在大暑前後）也成為吃鰻魚的日子。\n\
    \  詩人柄井川柳描繪了攤販在人群中油炸胡麻楊的光景：「酥脆胡麻楊，店頭味飄香。眾人皆駐足，木屐染油香。」可見原本小販是以「胡麻楊」的名稱販賣天婦羅，直到天明年間（一七八一至一七八九）才出現掛上天婦羅招牌的攤子。\n\
    \  天婦羅是將食材裹以麵粉與蛋汁，然後油炸。日文寫作「天麩羅」，看起來一點也不像日文。由來眾說紛紜，有一說是源自葡萄牙語的「烹飪（ｔｅｍｐｅｒｏ）」，又有一說是出自天主教星期五齋戒日的西班牙文「ｔｅｍｐｏｒａ」。天主教徒在齋戒日這天不吃鳥類與野味，改吃魚類。「ｔｅｍｐｏｒａ」一詞的意義日後發生變化，變成齋戒日吃的魚類料理。\n\
    \  德川家康吃了天婦羅而食物中毒致死，這是人盡皆知的事。根據德川家康傳記記載，他是吃了「切塊的新鮮鯛魚，用油炸得酥脆再炒過，撒上磨碎的韭菜」，到了傍晚腹痛如絞。可知德川家康吃的炸鯛魚沒有裹麵衣，而是直接下鍋炸，也不見天婦羅一詞。他腹痛之後曾經恢復健康，實際過世是四月十七日，也就是此事發生的三個月之後。死因實在說不上是炸鯛魚，更別說是天婦羅了。（改寫自飯野亮一蕎麥麵、鰻魚、天婦羅、壽司：江戶四大美食的誕生）"
  answer:
  - A
  answer_source: answer_key_vlm
