- id: doc_111_高雄_林園_國文_g8s2e2_s4_4
  section: 4
  number: 4
  type: single
  page: 1
  stem: 「徐志摩的一生可用多情來形容。他對文學多情，尤其在新詩的領域，充滿他獨特的見解，創作出許多□□□□的詩篇。他對情人多情，用自己的真心對待每一段感情，即使有時覺得疲憊，他仍如□□□□般義無反顧。他對朋友也多情，為了那場演講，他□□□□地前往，不料搭上的竟是死亡飛機，在煙霧迷茫之中，結束他短暫又絢麗的人生。」這段文字的缺空處，應填入下列何者最恰當？
  options:
  - label: A
    content: 口碑載道→飲鴆止渴→毅然決然
  - label: B
    content: 洛陽紙貴→如魚得水→赴湯蹈火
  - label: C
    content: 不見經傳→螳臂當車→當機立斷
  - label: D
    content: 膾炙人口→飛蛾撲火→奮不顧身。
  answer:
  - D
  answer_source: answer_key_vlm
