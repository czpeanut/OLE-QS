  stem: 根據本文，關於自拍照的敘述，下列何者正確？
  options:
  - label: A
    content: 上傳者總會挑選自認為最理想的照片
  - label: B
    content: 能表現出一個人最不希望被看到的一面
  - label: C
    content: 能讓他人透過照片了解自己的個性
  - label: D
    content: 能夠完全顯示真實的自己。
  group_stem: "自拍這樣空白而自由的特性，某部分遙遙呼應了心理學所說的「投射」：被我們層層粉飾得萬無一失的自拍照，或許也因此洩漏了一部分自己真正的內心。那是想望，是自己最希望被別人看見的那一個面向。是真實，但也不是完全的真實。這或許也是為什麼有研究指出，使用社群軟體反而會增強憂鬱感。畢竟許多人會放上社群軟體分享的自拍或動態，都是自己最風光的那一面啊，很少有人會在剛哭過，剛睡醒，披頭散髮、眼角還黏了眼屎的時候自拍上傳的。\n\
    \  那些千錘百鍊的自拍，永遠是在各種條件準備就緒，燈光、道具、擺位都已臻完美之境的瞬間，才按下快門。那時手機的螢幕一閃，世界就此被切片風乾保存在一張自拍照裡。在那記憶體內存放著的，數十甚至上百張時間的標本之中，反覆斟酌、修圖、刪刪改改，最後上傳到雲端的、那唯一的一張，隱約有一種下好離手的氣勢，一種永不回頭的蒼涼。魔鏡魔鏡，在這張照片裡，是我心目中最理想的自己。即使在未來，眼前所見都將不免要毀壞，我有確實留住我生命中，最美好的那個瞬間了嗎？\n\
    （魔鏡魔鏡）"
  answer:
  - A
