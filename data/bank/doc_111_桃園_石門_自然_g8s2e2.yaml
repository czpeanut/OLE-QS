- id: doc_111_桃園_石門_自然_g8s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: （  ）四個燒杯所含物質的水溶液，分別為何？
  options:
  - label: A
    content: 甲：$NH_{3}$、乙：$CH_{3}COOH$、丙：$Ca(OH)_{2}$、丁：$HCl$
  - label: B
    content: 甲：$Ca(OH)_{2}$、乙：$CH_{3}COOH$、丙：$NH_{3}$、丁：$HCl$
  - label: C
    content: 甲：$Ca(OH)_{2}$、乙：$HCl$、丙：$NH_{3}$、丁：$CH_{3}COOH$
  - label: D
    content: 甲：$CH_{3}COOH$、乙：$NH_{3}$、丙：$HCl$、丁：$Ca(OH)_{2}$
  group_stem: '4 個燒杯中分別盛有 氨$NH_{3}$、醋酸$CH_{3}COOH$、氫氧化鈣$Ca(OH)_{2}$、氯化氫$HCl$ 的水溶液，將
    4 個燒杯任意標示為甲、乙、丙、丁，進行各項實驗，結果如表所示，試回答8-11題。


    | 實驗項目 | 甲 | 乙 | 丙 | 丁 |

    | :--- | :--- | :--- | :--- | :--- |

    | 藍色石蕊試紙 | 不變色 | 呈紅色 | 不變色 | 呈紅色 |

    | 通入 $CO_{2}$ | 呈白色混濁 | 沒有變化 | 沒有變化 | 沒有變化 |

    | 放入鎂帶 | 沒有變化 | 大量氣泡 | 沒有變化 | 少量氣泡 |

    | 導電性 | 容易導電 | 容易導電 | 不易導電 | 不易導電 |'
