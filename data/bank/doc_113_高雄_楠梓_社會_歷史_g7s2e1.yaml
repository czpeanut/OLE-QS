  group_stem: "打狗港歷史\n    最早的打狗港，其實只是一個潟湖，週邊則是漁村和鹽瀨。到了1858 年天津條約後，外國勢力才介入，開設領事館及洋行，展開打狗的國際貿易功能。日本領台後，積極著手建設縱貫鐵道，並築造打狗港成為一個大型商港，從此形成打狗鐵道和港口密切不可分的關係。這種功能對於殖民政府掠奪台灣資源，及發展工商有關鍵性的作用，例如要發展南部的製糖工業，就必須引進新式的製糖設備，這些設備當然得靠大型輪船運送到港，再由火車載運到場裝機；未來出產的砂糖，也藉由火車運送到碼頭，裝船運送出口。隨著1900\
    \ 年11 月縱貫鐵道從打狗先行通車到台南，台灣製糖會社也於通車路段的中間點(甲)，展開建糖廠作業。\n    第一代的打狗停車場（火車站）設置於打狗鐵道故事館北面約一公里處，一直到1908\
    \ 年(乙)全通之後不久，仍繼續使用。隨著打狗港持續進行開挖填砂，填出了現在高雄港站一帶的新用地，才將打狗停車場往南移設到今天的位置，興建頗具規模的調車場、扇形車庫、儲煤槽、旅客月台、天橋和站房等設施，並往南拉出一條「濱線」到碼頭。濱線的日文發音為Hamasen，這也是今日「哈瑪星」的地名由來。\n\
    \    之後，藉著火車與輪船的轉運，哈瑪星、三塊厝一帶就近設置許多台灣工業黎明期的工廠，例如淺野水泥、製罐工廠、台灣煉瓦等。在西臨港線鐵道經過11 號碼頭附近，是「台灣鐵工所」遺址，許多製糖工場的設備，乃至糖鐵的蒸汽火車頭，就是從這裡製作後，利用鐵道運送出去的，可說是台灣工業的發源地。\n\
    \   1920 年以降，配合日本政府的(丙)政策，高雄被指定為「基地」，由於舊市區已呈飽和狀態，為了都市長遠發展，日本內閣跳過台灣總督府，直接訂定1930\
    \ 年「高雄市區都市改正」計畫，以60 萬人為規劃目標，將高雄驛從哈瑪星移設到大港，也就是今天台鐵高雄站的所在地，並在計畫都市外圍設計一圈類似日本東京「山手線」的環狀鐵道；以新高雄驛為基點，後驛一帶為農業區，前驛週邊為商業區，再往南則為住宅區和文教區，至於作為南進基地最重要的軍需工業和重工業，則被安排在環狀鐵道的外圍。\n\
    \    這條高雄環狀線的構想，卻因為(丁)戰爭的爆發，而未能真正實現，直到戰後才把東、西兩段鐵道連接起來，成為環狀的「第一臨港線」系統。從高雄站出發後，兩旁是廣大的檢車段、機務段、鐵路新村日式宿舍區，右轉沿著凱旋路往南行駛，則行經五塊厝一帶的住宅區和多所學校及醫院。過了三多路，進入籬子內地區，都市景觀明顯不同，住宅和商店少了，卻出現許多工廠，包括台鐵高雄機廠、硫酸亞工廠、205\
    \ 兵工廠、中油、台糖、台鋁、台肥、台電南部火力電廠等，許多專用鐵道從臨港線岔出，直接進入廠區，好像微血管從主幹分出一樣，呈現出高雄臨港線強烈的工業性格。"
