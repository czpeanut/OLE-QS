  section: 1
  number: 30
  type: single
  page: 1
  stem: 根據以上兩則資料內容，請問日治初期台灣財政收入增加的原因與總督府採取哪一措施有關？
  options:
  - label: A
    content: 專賣制度
  - label: B
    content: 戶口調查
  - label: C
    content: 整建港口
  - label: D
    content: 統一貨幣。
  group_stem: '★★資料一：日本殖民台灣初期，行政財源主要仰賴日本中央所提供的補助金，附圖四為日治初期台灣的財政收支圖，由內容可知總督府的財政收入逐年增加，至西元1897
    年後財政已經達到收支平衡。

    ★★資料二：樟樹分布於中低海拔闊葉林，是台灣中低海拔主要樹種之一，將樟樹樹幹削成薄片，可蒸餾出樟腦及樟腦油等。西元1899 年，台灣總督府設立「台灣樟腦局」，負責樟腦的收購、檢驗及配售，並在台北城南門外設置工場，進行加工提煉再製樟腦。一戰後期，日本陸續整合台灣八家精製樟腦業，設立「日本樟腦株式會社」。'
  shared_asset: g1_30_31
