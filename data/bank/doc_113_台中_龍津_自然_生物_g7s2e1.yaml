  type: single
  page: 4
  stem: 關於動物的生殖，下列敘述何者錯誤？
  options:
  - label: A
    content: 某些動物可以進行有性生殖及無性生殖
  - label: B
    content: 無性生殖所產下的鯊魚不具有母鯊的 DNA
  - label: C
    content: 鯊魚的無性生殖是經過細胞分裂完成的
  - label: D
    content: 鯊魚的有性生殖需要經過精卵結合。
  group_stem: 通常鯊魚繁衍後代時需要雌雄個體分別提供精卵並成功受精，才會發育成小鯊魚，此生殖方式稱為有性生殖。而在美國的一間動物園中，飼養了三隻雌性的鎚頭鯊，這些母鯊從未接觸過公鯊，管理員卻發現某天水族館中誕生了一隻小鎚頭鯊。研究人員檢測該新生鎚頭鯊的
    DNA 時，發現它不具有公鯊的 DNA，因此排除了母鯊與公鯊曾經交配的可能性。這表示母鯊可以直接經由無性生殖產下小鯊魚。先前已發現部分鳥類、爬蟲類也有無性生殖的例子，但是鯊魚這種大型魚類竟也能進行無性生殖，可見瀕臨絕種動物為了對抗滅絕，而演化出了不同於以往的生殖方式，是一個值得科學家研究的議題。
