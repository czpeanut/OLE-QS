- id: doc_113_台中_四育_國文_g7s2e1_s3_19
  section: 3
  number: 19
  type: single
  page: 2
  stem: 「人生是短暫的，死亡是自然的，認清了這點，活著的時候才可以真正的投入。」這段話的涵義，與下列何者最接近?
  options:
  - label: A
    content: 死亡的不可避免性提醒我們要活在當下，盡情活著
  - label: B
    content: 人生短暫，因此我們應該時刻為死亡做好準備
  - label: C
    content: 生命的價值在於不斷挑戰自我，安於現狀等於死亡
  - label: D
    content: 逃離焦慮的方法是置之生死於度外，及時行樂
- id: doc_113_台中_四育_國文_g7s2e1_s3_20
  section: 3
  number: 20
  type: single
  page: 2
  stem: 紙船印象一文藉由回憶童年玩紙船的往事，勾勒出平凡樸實卻偉大深刻的母愛圖像，以「紙船印象」與「母愛刻畫」作連結，傳達出獨特的人生經驗。有關作者在文章中的鋪排順序，下列何者正確？
  options:
  - label: A
    content: 人→物→情
  - label: B
    content: 情→人→物
  - label: C
    content: 人→情→物
