  group_stem: "出門吃晚餐，過馬路時兒子發現他的涼鞋鞋面跟鞋底裂開，先忍耐拖著走，走到馬路對面，噢，整個分家了！還是親戚送的新鞋呢！他拿起鞋底，不知怎麼是好，太倒楣了！情緒變得煩躁，鬧起脾氣來。我讓他們父子在走廊上等等，跑進旁邊的屈臣氏看看有沒有賣室內拖鞋應急一下。啊，這家屈臣氏比較小，沒有這些雜貨，怎麼辦？先進餐廳再說吧！開門之前，我發現了一樣東西—雨傘套！蹲下來，用那塑膠套幫兒子把鞋底、鞋面綁起來，腳背上打個大蝴蝶結。「咦！還滿結實的！」兒子總算露出了笑容，就這麼穿著這怪異的涼鞋走進餐廳。\n\
    \  太像是一種前世的記憶了……多年前，我們一群年輕人跑海邊玩，我在沙灘上走著走著發覺涼鞋上的鞋帶掉了，而且是不見了之後還走了一段路，直到鞋面敞開沒法走路之後才發現。大家幫我附近搜尋都沒找著，也許被海水沖走了，便有人嘆氣：「怎麼會有人走路走到鞋帶掉了都不知道！」一籌莫展時，有個男生找來一個透明塑膠袋，他用海水洗淨了，搓成細條狀代替鞋帶，蹲下來細心幫我穿過皮面上的小孔，繫好，還打了一個非常漂亮的蝴蝶結。我吃驚地瞅著那隻透明蝴蝶，一邊道謝，一邊忍不住說：「好漂亮喔！我好想把另一腳的鞋帶也抽掉，再綁一隻！」大概我笑得太燦爛了，他忽然抬頭說：「你知道嗎？你有一種與生俱來快樂的能力，我很羨慕。」（宇文正\
    \ 快樂的能力）"
