- id: doc_113_台中_四育_國文_g7s2e1_s3_14
  section: 3
  number: 14
  type: single
  page: 2
  stem: 下列有關於「船」的成語，何者使用正確？
  options:
  - label: A
    content: 即使你有天大的本領，若是欠缺「船到橋頭自然直」的決心，也是無法成功的
  - label: B
    content: 今年的棒球比賽，本班同學原本勝券在握，誰知道一連串的失誤，竟然「逆水行舟」，以九比零慘敗收場
  - label: C
    content: 這次臺南大地震，房屋倒塌，死傷慘重，多虧各界伸出援手，「同舟共濟」，才能順利完成搜救任務
  - label: D
    content: 待人處世要有原則，不要見風轉舵，也不要「陰溝裡翻船」，左右搖擺的人最令人討厭。
- id: doc_113_台中_四育_國文_g7s2e1_s3_15
  section: 3
  number: 15
  type: single
  page: 2
  stem: 關於四種造字法則的敘述，下列何者錯誤？
  options:
  - label: A
    content: 象形和指事是造字的基本法則
  - label: B
    content: 象形字表示的是具體的「物」，指事字表示的是抽象的「事」
  - label: C
    content: 會意是會合兩個或兩個以上文字成新字
  - label: D
    content: 古人造字，先設計四種造字法則，再依此法則造字。
