  stem: 有位詩人讚揚文學大師魯迅的傑出貢獻時，感慨地說：「有的人活著，他已經死了；有的人死了，他還活著。」下列何組詞語和上述前後兩段話的旨意最相近？
  options:
  - label: A
    content: 行屍走肉／名垂不朽
  - label: B
    content: 醉生夢死／陰魂不散
  - label: C
    content: 魂不附體／死裡逃生
  - label: D
    content: 渾渾噩噩／苟且偷生。
- id: doc_113_台中_四育_國文_g7s2e1_s3_2
  section: 3
