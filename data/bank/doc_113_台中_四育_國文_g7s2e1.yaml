  stem: 「尼可拉斯效應」是指一種善行義舉所引起的熱烈迴響。下列選項中的效應名稱，何者使用正確？
  options:
  - label: A
    content: 他原本不打算參加這場派對，但看到朋友們都去，他最終還是跟著大流，犯了「破窗效應」
  - label: B
    content: 政府為保護稀有蝴蝶，成立了保育園區，呼籲大家一起響應「蝴蝶效應」
  - label: C
    content: 氣溫急速驟降，很多動物承受不住低溫而凍死，此即「煮蛙效應」
  - label: D
    content: 在那個小鎮上，大家都不敢說出真相，因為「寒蟬效應」讓每個人都對當局心生畏懼
- id: doc_113_台中_四育_國文_g7s2e1_s3_9
  section: 3
  number: 9
  type: single
  page: 1
  stem: '老師教完「漢字結構」之後，請學生舉例說明漢字的造字法則：

    阿中：「鼠牛馬猴」都屬象形。

    小文：「上下本末」都屬指事。

    阿國：「森林城堡」皆為會意。

    阿漢：「草莓蓮霧」皆為形聲。

    請問哪兩人的舉例完全正確？'
  options:
  - label: A
    content: 阿中、阿漢
  - label: B
    content: 阿中、阿國
  - label: C
    content: 小文、阿國
  - label: D
    content: 小文、阿漢。
- id: doc_113_台中_四育_國文_g7s2e1_s3_10
  section: 3
  number: 10
  type: single
  page: 1
  stem: 「在我們生活周遭，有著無數的聲音。或許，在經常聽到這些聲音的時候，我們並不會有什麼特別感觸。不過，當時移事遷，那些聲音，就成為記憶中的一部分，和我們的童年、少年、青年結為一體，無可分割。臺灣有許多聲音，是永遠停留在人們生命深處的。當歲月流逝，那些記憶中的聲音卻會更加清晰地在心中響起，為童年的溫暖、青春的印記留下軌跡。」（臺灣聲音記憶—叫賣篇）根據這段文字，下列何者最適合用來形容在我們生活周遭的各種聲音？
  options:
  - label: A
    content: 熱鐵烙膚，記憶深刻
  - label: B
    content: 過眼雲煙，過目即忘
  - label: C
    content: 似無所見，歷歷如繪
  - label: D
    content: 天邊飛鳥，逐漸消散。
- id: doc_113_台中_四育_國文_g7s2e1_s3_11
  section: 3
  number: 11
  type: single
  page: 1
  stem: 關於聲音鐘一文的敘述，下列何者不正確？
  options:
  - label: A
    content: 文章首尾呼應，以「我喜歡那些像鐘一般準確出現的小販的叫賣聲」來貫穿全文
  - label: B
    content: 強調聲音鐘建構的是心情的時間，是因為可反映小販當下心情
  - label: C
    content: 藉小販叫賣聲喚起讀者對傳統台灣的記憶與情感，饒富情味
  - label: D
    content: 作者認為這些美妙的叫賣聲是活力人間不可或缺的色彩。
  lesson_raw:
    title: 聲音鐘
    basis: 題目指明「聲音鐘一文」
