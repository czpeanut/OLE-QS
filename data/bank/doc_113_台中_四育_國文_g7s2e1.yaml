  - label: A
    content: 她的笑容如同陽光穿透雲層，溫暖而明亮
  - label: B
    content: 這座城市的夜晚，燈火通明，車水馬龍，熱鬧非凡
  - label: C
    content: 雨後的彩虹在灰暗的天空中格外鮮豔，彷彿為沉重的日子增添了一抹光明」
  - label: D
    content: 夜風輕輕地拂過樹葉，低語著一首遺忘的歌。
  lesson_raw:
