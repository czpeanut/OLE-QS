  group_stem: "「吃苦當做吃補」，是臺灣五○年代（西元一九五○~一九五九）普遍的生活態度。當時臺灣剛從二次大戰後的廢墟站起，又馬上面臨社會動盪、人口劇增、物價飛漲及嚴重失業。如此艱困的環境下，「溫飽」成了每個人生活中最關心的事。由於「走賣」這種邊走邊賣的商業模式不需店面、不用繳稅，加上機動、靈活、成本低，因而吸引不少人投入。歸納五○年代的走賣文化特色，大致有以下九點：\n\
    １服務與商品單純\n  由於邊走邊賣無法負荷過多重量，因此多半是提供專門服務或單一商品。\n２服務到府\n  五○年代的鄉村居民多半以農耕維生，加上城鄉交通不便，到市集或市區購物往往費力費時。相較下，能將商品帶到家門口的走賣交易就方便許多。\n\
    ３廣告效果直接明白\n  國民教育不普及的狀況下，許多人不識字，不少攤子便採用最直接的廣告法，展示實物並搭配叫賣，讓顧客馬上就能明白商品或服務的內容。\n\
    ４做生意兼交朋友\n  走賣交易靠的是規律與信用。因為規律，顧客知道小販何時經過自家門口；因為信用，顧客會放心購買而textBox不怕事後求助無門。長久下來，雙方除了買賣關係，也建立了默契與情感。\n\
    ５窮則變，變則通\n  在物資有限的狀況下，人們善用周邊一切資源，比如碗粿，傳說是用滯銷的受潮米製作而成；又如嘉義「新港飴」，據說是賣糖小販不忍丟棄雨天受潮的麥芽糖和花生糖，於是將兩者加熱混合而創出的新口味。\n\
    ６物資昂貴，手工便宜\n  民生匱乏的年代，日用品往往一修再修，不到最後關頭不輕易丟棄，因而像磨刀、補鍋、補紗窗、修雨傘與修皮鞋等修補業相當盛行。\n７傳承與創新\n\
    \  許多走賣行業是明 清時期由漢族移民帶入臺灣，如補碗與補鍋都可在福建、廣東一帶找到原型。有些則受日本文化影響，例如彈珠汽水就是日治時代由日人引進。至於山東饅頭與五香茶葉蛋，則是隨國民政府遷臺而崛起的小吃。隨著生活型態轉變，更出現電風扇修理與舶來品販售這類新行業。\n\
    ８小小孩子上街頭\n  五○年代的家庭計畫尚未落實，加上多子多孫多福氣的傳統觀念，幾乎家家戶戶都人口眾多。不少孩子為了分擔家計，紛紛走上街頭販售枝仔冰或燒酒螺等零食，至於中斷學業、提早踏入職場的孩子更是不在少數。\n\
    ９「衛生」也是賣點\n  「不乾不淨，吃了沒病」比「飯前便後勤洗手」的觀念更流行，導致寄生蟲感染率很高，應運而生的職業就是蛔蟲藥與蟯蟲藥推銷員。此外，由於醫療資源不普及，巡迴賣藥團販售的傷藥與強身藥也廣受民眾歡迎。（朱南山、陳曉頻〈五○年代走賣特色大搜查〉）"
