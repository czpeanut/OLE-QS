- id: doc_113_高雄_陽明_自然_g7s1e2_s3_49
  section: 3
  number: 49
  type: single
  page: 5
  stem: 關於Elysia chlorotica 海兔分布區域的推論何者最有可能?
  options:
  - label: A
    content: 因其能自行製造養分，所以生活於深海中。
  - label: B
    content: 可能會分布於陽光能照射到的海域。
  - label: C
    content: 深海淺海都適合其生存。
  - label: D
    content: 白天在深海中，夜晚則會回到潮間帶活動。
