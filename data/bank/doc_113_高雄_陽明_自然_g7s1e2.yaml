- id: doc_113_高雄_陽明_自然_g7s1e2_s3_50
  section: 3
  number: 50
  type: single
  page: 5
  stem: 關於Elysia chlorotica 海兔描述何者正確?
  options:
  - label: A
    content: 此種海兔白天只行光合作用，到了晚上才會進行呼吸作用。
  - label: B
    content: 若提供充足的光源，則在水族箱中飼養的海兔不用提供食物也能存活一段時間。
  - label: C
    content: 其光合作用能力可以遺傳至後代，所以其後代能自行製造葉綠體。
  - label: D
    content: 海兔行光合作用會產生葡萄糖，多餘的養分會以纖維素形式儲存體內。
