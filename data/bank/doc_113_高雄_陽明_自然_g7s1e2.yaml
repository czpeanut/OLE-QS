- id: doc_113_高雄_陽明_自然_g7s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: '有關唾液和澱粉的實驗，材料如右表所示：將a、b 兩試管置於室溫下40 分鐘後，各加一滴碘液，a 試管呈黃褐色，b 試管呈藍黑色，根據上述實驗結果，下列敘述何者正確？


    | 試管 | 澱粉液 | 唾液 | 水 |

    | :--- | :--- | :--- | :--- |

    | a | 2毫升 | 2毫升 | 0毫升 |

    | b | 2毫升 | 0毫升 | 2毫升 |'
  options:
  - label: A
    content: 加碘液可促進唾液的分解作用
  - label: B
    content: a 試管中的澱粉已轉變成其他物質
  - label: C
    content: b 試管是因水的關係，所以呈現藍黑色
  - label: D
    content: 由本實驗能得到「唾液可將澱粉分解成葡萄糖」的結論。
