- id: doc_113_高雄_陽明_自然_g7s1e2_s3_48
  section: 3
  number: 48
  type: single
  page: 5
  stem: 根據本文，請問海兔為何具有光合作用的能力?
  options:
  - label: A
    content: 海兔是一種水中的藻類。
  - label: B
    content: 海兔自行演化出能製造葉綠體的基因。
  - label: C
    content: 海兔在攝食藻類後獲得光合作用的能力。
  - label: D
    content: 海兔本身不具有光合作用能力，而是藻類行光合作用後將能量供給海兔使用。
  group_stem: 科學家發現一種海兔(俗稱海蛞蝓，此種海蛞蝓學名為Elysia chlorotica)身體呈亮綠色，並以海藻為食，能夠吸收其葉綠體並擷取一些基因，從而通過光合作用將光能轉為自身能量。這是科學家發現的第一種可行光合作用的多細胞動物。美國生物學家西德尼-皮爾斯說:「這種海兔可以在不吃東西的情況下，生成含有能量的分子。」他還說:「我們收集了一些海兔，在水族館養了幾個月。只要我們能一天12小時讓陽光照射進來，牠們在沒有食物的情況下也能存活。」而據研究此光合作用的能力是可以遺傳給後代的，但其後代只能夠自行製造葉綠素，並沒辦法製造葉綠體，所以牠仍必須攝取藻類到體內以獲得葉綠體。            《摘寫自網路資料：http://txreformer.pixnet.net/blog/post/26883251》
