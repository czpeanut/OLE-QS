  stem: 請問下列選項何者符合本文架構？
  options:
  - label: A
    content: '| 引 | 議 | 聯 | 結 |

      | :--- | :--- | :--- | :--- |

      | 談容顏焦慮的定義 | 舉例容顏焦慮族群 | 分析容顏焦慮症狀 | 自信才是解決之道 |'
  - label: B
    content: '| 總 | 分 | 分 | 總 |

      | :--- | :--- | :--- | :--- |

      | 談容顏焦慮的範圍 | 舉例容顏焦慮族群 | 分析症狀產生途徑 | 美麗該是取悅自己 |'
  - label: C
    content: '| 因 | 果 | 因 | 果 |

      | :--- | :--- | :--- | :--- |

      | 談容顏焦慮的原因 | 舉例造成的影響 | 分析症狀產生原因 | 自信就能降低焦慮 |'
  - label: D
    content: '| 起 | 承 | 轉 | 合 |

      | :--- | :--- | :--- | :--- |

      | 談容顏焦慮的定義 | 舉例分析容顏焦慮 | 具體轉變改善之道 | 美麗該是取悅自己 |'
  group_stem: "容貌焦慮症是什麼？身處於被社群軟體圍繞的大環境，許多人都曾經或是正處於對自己的外表感到不安、焦慮的狀態。然而，過度的自我否定、焦慮不安可能會引發身心問題而不自知！\n\
    \  一般來說有容貌焦慮的人會很在意自己的外表，且特別容易受到外在環境的影響。然而，在大環境中常常會暗示容貌、外在美的重要，並認為外在是很需要被注意的，在這種情形之下，以下族群更容易發生容貌焦慮：\n\
    • 女性族群：相較男性機率較高\n• 公眾人物：經常需要檢視自己的外表\n• 青少年晚期：第二性徵出現、開始注重外表、同儕壓力\n• 自尊或自我形象低落：對容貌沒自信、不喜歡自己\n\
    \  對外表沒自信、喜歡用濾鏡？利用「FACE」檢測自己是否有容貌焦慮：\n• F：臉部回饋(Facial Feedback)像是反覆詢問別人關於自己容貌的問題，不斷在意、尋求別人對自己的回饋。\n\
    • A：外表焦慮(Appearance Anxiety)就算旁人給予正面回饋，還是會感覺到焦慮。\n• C：照片美肌(Camera Cosmetic)沒有使用濾鏡、修圖，就會感到擔心；或是即便倒個垃圾，出門前也一定需要化妝。\n\
    • E：自尊表現(Esteem Expression) 沒有自信、自尊表現低落，可從措辭中發現非常在意別人對自己的看法。\n  如果發現自己或親友對以上四種情形都有明顯地在意，就可能是有容貌焦慮症的問題。\n\
    \  如何改善容貌焦慮？心理師4 招建立自信：\n• 轉移注意力：可以將注意力轉移到自己的內在或是找出自己較為滿意的部分。\n• 減少網路、社群軟體的使用：減少明星或是社群中的網紅、網美，所呈現出對美的形象，對自己的影響。\n\
    • 自我肯定：一定會有人欣賞自己的樣子！坦然接受自己的樣子，學會自我肯定，試著接受自己美好的部分。\n• 降低專注於外貌的時間：當花在外表的時間愈長，就會有越多的時間留意、專注在其中，可降低專注在外貌的時間。\n\
    \  心理師也提到：「美麗」應該用來取悅自己，而非他人，當你變美是為了取悅別人的時候，就會變得壓力更大。"
