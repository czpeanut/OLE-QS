- id: doc_111_桃園_中興_國文_g9s2e2_s1_22
  section: 1
  number: 22
  type: single
  page: 4
  stem: 對這一波能源危機的描述，下列何者符合本文內容敘述情況？
  options:
  - label: A
    content: 英國的家庭能源費用飆漲58%，民眾走上街頭抗議
  - label: B
    content: 台電、中油燃料價格上漲，造成政府虧損埋單
  - label: C
    content: 每次能源危機，各國都致力於提升能源產業技術
  - label: D
    content: 俄烏戰爭帶來石油能源危機，全球經濟都受到衝擊
  group_stem: "俄烏戰事僵持，俄羅斯中斷對歐洲的天然氣供應，近一年來歐洲的能源價格大漲、推升通膨，民生苦不堪言。根據媒體報導，英國的家庭能源費用飆漲8\
    \ 成，民眾走上街頭抗議。德國的電費、瓦斯費較前一年漲了58%，一位外派至德國工作的台灣工程師表示：「家裡不敢開暖氣，公用廁所沒有熱水，洗手還要小心凍傷。」\n\
    \  這波能源危機從歐洲蔓延到亞洲，也從2022 年延續到2023 年。台灣民眾也許無感，但台電、中油都因燃料價格上漲，造成數千億元虧損，最終還是由全民稅收埋單。\n\
    \  回顧過去50 年，能源價格的波動一再衝擊全球經濟，也形塑了一段獨特的地緣政治歷史。1973 年以色列與阿拉伯國家爆發「贖罪日戰爭」，引爆第一次全球石油危機。石油輸出國家組織（OPEC）為了報復歐美聲援以色列，宣布石油禁運，使得油價從戰前每桶不到3\
    \ 美元，飆升到近12 美元，造成全球經濟大衰退。\n  其後，1979 年的伊朗革命演變成第2 次全球石油危機，1990 年伊拉克入侵科威特造成第3 次危機。石油能源不斷成為區域衝突的根源，也被當作地緣戰略博弈的重要籌碼，始終是一條牽動全球經濟興衰的敏感神經。\n\
    \  為了降低能源波動帶來的衝擊，也為了強化屢屢受創的經濟環境韌性，每一次能源危機發生，都可以看到各國致力於能源產業技術的提升。例如，美國1973 年開始發展「水力裂解技術」，以降低頁岩油的開採成本；40\
    \ 年後竟搖身一變成爲全球最大原油出口國。此外，日本、台灣當時則是投入核電建設，減緩了之後幾次石油危機對經濟的衝擊。\n  這次俄烏戰爭帶來能源危機對全球經濟的衝擊，較以往並不遜色，但主角已經從石油變成天然氣；然而在全球減碳的高度共識下，以石油、煤為首的化石燃料，在能源市場上的地位已面臨結構性鬆動。\n\
    \  在1992 年通過《聯合國氣候變化綱要公約》後，國際間將解決溫室氣體排放問題，視為拯救地球任務的重中之重。近幾年，各國更加速投入再生能源，將溫室氣體排放量在2030\
    \ 年前減半，並在2050 年達到淨零，將地球溫升控制在攝氏1.5 度以內。\n  逐步減少化石燃料已是共識，但在全球能源大轉型過程中，排碳量相對較低、市場成熟度高的天然氣，將扮演重要的過渡角色。荷蘭石化大廠殼牌（Shell）預估，至2040\
    \ 年之前，天然氣需求增幅將為所有能源類型之冠。台灣中油也隨著趨勢，逐年提高天然氣的營收比重。"
