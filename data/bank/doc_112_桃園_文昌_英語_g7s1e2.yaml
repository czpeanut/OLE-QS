- id: doc_112_桃園_文昌_英語_g7s1e2_s5_31
  section: 5
  number: 31
  type: single
  page: 4
  stem: What is the main ideal of this reading?
  options:
  - label: A
    content: Time only affects our health.
  - label: B
    content: We can live without time.
  - label: C
    content: Time helps us have a regular life. regular 規律的
  - label: D
    content: There are 31 days in a month.
  group_stem: 'What is Time


    Time is an idea that affects our lives every day. We use it to measure the hours,
    days, months, and years. But what is time?


    Time allows us to plan a schedule, the future, and our lives. Without time, it
    would be hard to plan our day.


    The smallest unit of time is the second. Sixty seconds make a minute, sixty minutes
    make an hour, and twenty-four hours make a day. A week has seven days, a month
    can have 28 to 31 days, and a year has 365 days or 366 days. We can measure time
    with clocks and calendars. These help us to know the time and follow our schedules.


    Time is also important for our bodies. Our body has a clock that says when to
    sleep and wake up. Listening to our body clock helps us stay happy and healthy.


    affect 影響 measure 測量 allow 允許 unit 單位'
  tags:
    textbook: 七上 英語 閱讀理解（短文、書信、圖表、廣告）
