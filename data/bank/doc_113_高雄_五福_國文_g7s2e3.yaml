- id: doc_113_高雄_五福_國文_g7s2e3_s5_9
  section: 5
  number: 9
  type: single
  page: 7
  stem: 文中提到「青年們一切以自己為出發」，作者是想表達甚麼意思？
  options:
  - label: A
    content: 高傲自大，個人主義至上
  - label: B
    content: 缺乏同理心，無法體會他人感受
  - label: C
    content: 自己面對生活甘苦，不依賴他人
  - label: D
    content: 以身作則，在要求他人之前先要求自己
  group_stem: "（五）\n    同事有從韓國剛當過兵回來的，有遠從加州大學來的學生。我問他們，美國做工全這樣緊張嗎？他們異口同聲的說：「這裏可能是最輕閒的。」如不置身其中，可能怎樣說也不容易說明白。在日光下整整推上八小時的草；或在小雨中漆上八小時的牆，下工以後，只覺得這個人已癱下來，比行軍八小時還要累得多。今天下工後，已近黃昏。我坐在湖邊對著遠天遐想。這個環境美得像幅畫。當初造物的大匠畫這個「靜湖」時，用的全是藍色。第一筆用淡藍畫出湖水；第二筆加了一些顏色用深藍畫出山峰；第三筆又減去一些顏色，用淺藍畫出天空來。三筆的靜靜畫幅中，斜躺著一個下工後疲倦不堪的動物。我想整個美國的山水人物畫，可以此為代表。\n\
    \    雖然眼前景色這樣靜、這樣美，我腦海中依然是日間同事們的緊張面孔與急促步伐的影子。我的脈搏好像還在加速的跳動。我昏沉沉的頭腦中得到一個結論：「這樣拚命的工作，這個國家當然要強。」中學生送牛奶、送報；大學生作苦力、作僕役，已經是太習慣了的事。這些工作已經變成了教育的一部分。這種教育，讓每一個學生自然的知道了什麼是生活，什麼是人生。所以一個個美國孩子們，永遠獨立、勇敢、自尊，像個哲學家帝王。\n\
    \    希臘哲人，想出一套訓練帝王的辦法，這種辦法是讓他「從生硬的現實上挫斷足脛再站起來，從高傲的眉毛下滴下汗珠來賺取自己的衣食。」這是作一個帝王必經的訓練，可惜歐洲從未實行過這種理想。沒有想到，新大陸上卻無形中在實踐這句話，每一個青年，全在無形中接受這種帝王的訓練。作卑微的工作，樹高貴之自尊，變成了風氣以後，崢嶸的現象，有時是令人難以置信的。耶魯大學有個學生，父親遺產三十萬美金，他拒絕接受。他說：「我有兩隻手，一個頭，已夠了。」報紙上說：「父親是個成功的創業者，兒子真正繼承了父親的精神。」\n\
    \    青年們一切都以自己為出發，承受人生所應有的負擔，享受人生所應有的快樂。青年們的偶像不是叱吒風雲的流血家，而是勤苦自立的創業者。富蘭克林自傳，是每個人奉為圭臬的經典。我很欽佩在綠色的大地上，金色的陽光中，一個個忙碌的面頰呈現紅色的青年。\n\
    \    然而，我在湖邊凝想了半天，還是覺得，這個美國青年畫幅裏面仍缺少一些東西。什麼東西，我不太能指出，大概是人文的素養吧。我在此三、四個月的觀感，可以說：美國學生很少看報的。送報而不看報，這是件令人不可思議的事。「哲學家帝王」，不僅要受苦，還要有一種訓練，使他具有雄偉的抱負與遠大的眼光，可惜這一點，美國教育是忽略了。忽略的程度令人可哀。\n\
    \    在哲學家帝王的訓練中，勤苦自立，堅忍不拔那一部分，美國的教育與社會所賦與青年的，足夠了。而在人文的訓練上卻差得很多。晚風襲來，湖水清澈如鏡，青山恬淡如詩，我的思想也逐漸澄明而寧靜。天暗下來，星星，一個一個的亮了。\n\
    \                                                                       \n   \
    \                                                                      改寫自陳之藩\
    \ 旅美小簡"
