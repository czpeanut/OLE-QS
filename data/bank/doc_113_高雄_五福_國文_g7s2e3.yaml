- id: doc_113_高雄_五福_國文_g7s2e3_s5_5
  section: 5
  number: 5
  type: single
  page: 5
  stem: 甲、王金生整修日式宿舍 乙、蔣勳文化基金會認養日式老房 丙、堀尾一彥一家入住宿舍，根據本文所敘述，上述事件發生的正確順序應是下列何者?
  options:
  - label: A
    content: 丙甲乙
  - label: B
    content: 甲乙丙
  - label: C
    content: 丙乙甲
  - label: D
    content: 乙丙甲
  group_stem: "(三)\n    立夏之初，走在台東 池上，不時聞到一股淡淡輕柔的薑香。香氣來自端午前後盛開的月桃，中南部拿月桃葉包粽，池上 蔣勳書房的志工，沿途摘下一串串宛若葡萄的月桃花，放在老房中央，為整修重新開放的老建築，注入一股濃郁花香。近90\
    \ 載的老屋簡約素雅，白天不需人工照明，戶外陽光灑落進玻璃木窗，細細品味光影在建築空間裡的流動，如詩如畫。這是城市裡沒能有的光景。去年蔣勳文化基金會認養日式老房，改為蔣勳書房，開放民眾預約到訪，提供一個能沉澱、閱讀，與自己和歷史建築的心靈對話。\n\
    \   3 月書房試營運沒多久，作家齊邦媛便辭世。蔣勳想起她80 歲那年，不畏世俗眼光，一個人拎著包包住進林口養生村，完成30 萬字回憶錄《巨流河》，撼動華文世界。齊邦媛告訴蔣勳，那一代的女性沒有自己的空間，很珍惜晚年有一個書房，寫出半生想寫的書。蔣勳這才訝異，在台大教書一輩子的學者，竟然沒有自己的書房？那是齊邦媛選擇拒絕喧譁熱鬧後而有的寧靜。過了從心所欲的年歲，蔣勳更能體悟這份「靜」的重要，於是書房僅有週四至週六開放，一日3\
    \ 梯次，一次僅限10 人預約入場。外來的遊客抱怨大老遠跑來想臨時入場卻無法，蔣勳也只能說抱歉，他希望透過這間老房，提醒「慢下來」的重要。\n    時光倒回蔣勳書房興建的1936\
    \ 年，前身為福原國小校長宿舍，好幾代校長都曾經短居於此。然而老屋不敵歲月摧殘，木作早已腐朽，校方一度打算拆除，2019 年被一位從三重移居池上的70 歲油漆工王金生給搶救下來。被稱為素人藝術家的王金生，沒受過專業訓練，卻對老房情有獨鍾。他憑著過往在工地偷學的技巧，一個人沒有工班，在疫情期間以舊材料恢復舊觀的工法，一點一滴把破損老舊的日式建築改頭換面，整修回昔日風華。不料整修後沒單位管理，蔣勳不忍王金生花兩年心血整修卻又被荒廢，剛好當時他正四處尋找合適的書房地點，最後就在熟悉的池上，找到書房的落腳。進駐後，蔣勳開始對過往住戶感到好奇，特別是第一代住戶日籍校長堀尾一彥一家，門口的木作名牌還寫有他的名字，打開蔣勳的研究魂。挖出台、日兩方資料，拼湊出射手座的堀尾，19\
    \ 歲渡海來台，最初在北部教書，又輾轉來到台東，1937 年到池上公學校（福原國小前身）任教，成為書房最早的主人。堀尾一彥有8 個孩子，一家10 口就擠在幾坪大的日式空間，蔣勳想起兒時一家人也曾住在大龍峒\
    \ 日式木造小房，每當媽媽做菜，屋內便散發著料理香氣，「她在拍蒜、切薑、摘韭菜，所有的氣味我都記得，」這棟老房不只是書房，還讓蔣勳回到記憶中的老家。\n \
    \                                             節錄自天下雜誌802 期 撰文:鄭景雯(共同採訪:何綺)"
