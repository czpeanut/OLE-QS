  stem: 下列何者是本文作者所要傳達的主旨？
  options:
  - label: A
    content: 大多數人難得一知己，知己能與自己心靈共鳴，堅定不渝
  - label: B
    content: 親子之情不比知己，是因為親子之間絲毫沒有心靈的共鳴
  - label: C
    content: 知己根本不存在於人世，無須辛苦追求，凡事靠自己才是
  - label: D
    content: 只有生死相許，抵擋人世的利害誘惑，才有資格稱為知己
  group_stem: "（一）\n    知己幾乎是另一個自我，人生得一知己足矣。事實上，絕大多數人的一生只有若干好朋友與眾多一般性的朋友，卻難得一知己。「士為知己者死」，說明知己能生死相與，可見知己之稀罕。西方把夫妻比喻為兩個「一半」結合成一體；那麼，知己是兩個「整全」重疊而相符。這樣說來，知己比夫妻更有資格稱為「天作之合」。如果既為知己，又成為夫婦，那更簡直是稀有動物，人間奇珍。\n\
    \    知己是心靈的共鳴，超越人世的利害與誘惑，而且不因世變而有絲毫動搖。親子之愛庶幾近之；但親子之愛不一定有心靈的共鳴，所以知己之難得遠在親情之上。尋覓知己跟與自己的影子對話一樣艱難，所以愛默生說：「我們是世上孤獨的過客，所渴望的知己只在夢幻與寓言之中。」梭羅更乾脆，他說：「尋求朋友的人是不幸的，因為只有自己才是最忠實的朋友。」\n\
    \                                                                            改寫自何懷碩\
    \ 知己"
