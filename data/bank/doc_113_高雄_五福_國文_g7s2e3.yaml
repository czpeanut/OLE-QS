  number: 3
  type: single
  page: 5
  stem: 下列哪一個選項中的句子主語是指尉遲敬德？
  options:
  - label: A
    content: 出為潭州
  - label: B
    content: 蓄怒未泄
  - label: C
    content: 確定不移
  - label: D
    content: 良久索食
  group_stem: "（二）\n    吏部尚書唐儉與太宗棋，爭道。上大怒，出為潭州。蓄怒未泄，謂尉遲敬德曰：「唐儉輕我，我欲殺之，卿為我證驗有怨言指斥。」敬德唯唯。明日上朝，敬德頓首曰：「臣實不聞。」頻問，確定不移。上怒，碎玉珽❶於地，奮衣入。良久索食，引三品以上皆入宴，上曰：「敬德今日利益者各有三。唐儉免枉死，朕免枉殺，敬德免曲從，三利也；朕有怒過之美，儉有再生之幸，敬德有忠直之譽，三益也。」賞敬德一千段，群臣皆稱萬歲。\n\
    注釋: ❶ 玉珽，古代天子上朝所執的玉版。珽:音ㄊㄧㄥˇ。                            改寫自張鷟 朝野僉載"
