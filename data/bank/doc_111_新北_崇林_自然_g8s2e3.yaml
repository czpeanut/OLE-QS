  section: 2
  number: 39
  type: single
  page: 4
  stem: 當大象站在船上時，假設只考慮力的大小。下列關於力的敘述何者正確？
  options:
  - label: A
    content: 「大象所受到的重力」等於「船載大象時所受的浮力」
  - label: B
    content: 「大象所受到的重力」等於「船載石頭時所受的浮力」
  - label: C
    content: 「大象與船整體所受到的重力」等於「石頭排開水的重量」
  - label: D
    content: 「大象與船整體所受到的重力」等於「船載大象時所受的浮力」
  group_stem: 曹沖從小就很聰明。有一天外國使節進貢一隻大象給中國，大家都對這龐然大物的重量很好奇，但是又沒有一個適當的工具可以測量它的重量，這時曹沖聲稱他有辦法可以量出大象的重量。他讓大象站在船上，然後在船側刻劃出水面的位置。等到大象離開船後，他就叫工人搬石頭到船上，讓船身逐漸下沉，直到水面到達所刻劃的記號為止。他把船上的石頭分別稱重，不久就向大家宣布了大象的重量。
