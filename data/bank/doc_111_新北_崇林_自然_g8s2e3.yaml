  section: 1
  number: 9
  type: single
  page: 1
  stem: 阿紹取2mL 乙酸加入2mL 戊醇後再添加3 滴的濃硫酸，沒多久即有香蕉油的氣味散發出來。下列各反應的添加物，何者與濃硫酸有相同作用？
  options:
  - label: A
    content: 氫氧化鈉加入鹽酸產生氯化鈉及水
  - label: B
    content: 肥皂製作時將油脂、鹼及酒精加熱後，產生肥皂及甘油
  - label: C
    content: 雙氧水加入二氧化錳產生氧及水
  - label: D
    content: 大理石加入鹽酸立即產生二氧化碳、氯化鈣及水。
