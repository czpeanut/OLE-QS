    content: 天然聚合物
  - label: B
    content: 熱固性聚合物
  - label: C
    content: 鏈狀聚合物
  - label: D
    content: 網狀聚合物
  group_stem: '市面上多款強調去角質、深層清潔的柔珠洗面乳，內含的「柔珠」就是塑膠微粒。這些微粒的主要材質是聚乙烯，顆粒直徑大小為0.01 mm～1.0
    mm，這些微粒雖然可加熱熔化，但使用後會經由汙水處理系統進入河川與海洋。

    國際期刊文獻提及，這些塑膠微粒會吸附數種有機汙染物，且可能在海洋中經由浮游生物的攝食，進入食物鏈而危及生態，因此許多地區開始立法禁用塑膠微粒。

