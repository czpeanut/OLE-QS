  group_stem: "（五）閱讀文章後，回答35～37 題： \n海洋奇緣 \n  這部電影是迪士尼公司第一次結合   島國的神話內容製作，角色全為   島民，5\
    \ 年的籌備過程中，製作團隊還\n到斐濟、薩摩亞、大溪地、紐西蘭等地實地調查。故事背景發生在南太平洋島嶼，取材自玻里尼西亞文化流傳已久的毛伊\n(Maui)半神人傳說。16\
    \ 歲的少女莫娜來自古老航海家族，和族人原本安居樂業，但萬物女神的海洋之心被毛伊取走，化成岩\n漿怪物釋放出黑暗力量，漁獲、農收開始失衡。莫娜必須尋找到關鍵人物—掌管海洋和風的半神人毛伊，攜手走上冒險旅\n\
    程，完成恢復生態系統和諧的使命。 \n  電影以動畫的方式，企圖還原南島語族在一個島嶼達環境負載力上限時，必須向外面島嶼遷徙的場景。而莫娜駕駛出海\n的船是為了在海上航行能平穩，有著舷外浮桿的風帆船，船上帶著雞、豬與主要的農作物—芋頭，都是南島語族在島嶼間\n\
    移動時會攜帶的共生動物及植物。舷外浮桿的風帆船在現今南島語族的分布地還可以見到，只是會隨著在不同地方而有些許\n的改變。共生物種也隨著南島語族的遷徙，從原生地一路散布到各個島嶼，透過當代的基因技術分析可以找到其中的關連\n\
    性，目前實際研究中的已有緬甸小鼠、豬、麵包樹及構樹等。"
