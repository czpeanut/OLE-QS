  group_stem: "（四）閱讀文章後，回答32～34 題： \n北極爭奪戰持續白熱化 \n  北極的定義有很多種，通常指北極圈以北的地區，另外也有人以「北極原住民活動範圍」，或以「八個北極圈國家的北方\n\
    領土」為定義。除了傳統上常見的「北極圈八國」之外，☆也在西元2018年提出「極地絲綢之路」計畫，主動在北極圈插旗。\n北極地區會這麼熱鬧，主要是因為富含未探勘的石油與天然氣，以及重大的地緣戰略價值。\
    \ \n  ☆雖然不屬於北極圈國家，卻很早就在北極地區擁有話語權。早在西元2016年前後，☆便以低價收購了格陵蘭島的一些公\n司和基礎設施，並嘗試購買一處軍事基地，將其改造為機場；更重要的是，由於北極地區航道通航的可能性，從上海到德國漢\n\
    堡，若走麻六甲海峽—蘇伊士運河—地中海抵達漢堡的航道，路程約為20,000公里；但若採行經北極地區的航道，路程則縮短\n了將近40%，只需約14,000公里，可節省約14天的航行時間。\
    \ \n  專家預估，各國在北極的爭奪與競爭，也將在經濟、政治、軍事、文化各領域全面展開，北極地區的變化可能將使全球\n政治局勢進行一次重新洗牌，贏家所贏得的也許遠遠超出預期。"
