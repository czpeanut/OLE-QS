  stem: '為了使運動會順利進行，這些城市必須針對舉辦運動會期間可能發生的問題加以預防。根據圖(十四)城市位置判斷，以下甲～丁選項，哪兩項敘述最符合真實情況？

    (甲)7 月的里約：進入一年最高溫的季節，以植栽綠化降低運動場館氣溫

    (乙)7 月的多倫多：屬於乾季，露天活動項目不易因下雨受影響

    (丙)8 月的聖多明各：因應多雨的氣候，應事先確保排水管道疏通

    (丁)10 月的瓜達拉哈拉：當地海拔較高，選手可能因氣壓較低而不適'
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 丙丁
  - label: D
    content: 甲丁
