  group_stem: "龍年新生兒人數創新低、比虎年還慘！國家一起養為何難拉抬生育率？\n    根據內政部統計，2024 年（龍年）新生兒13 萬4856\
    \ 人，相對2023 年（兔年）13 萬5571人，再少了715 人，也比2022 年（虎年）新生兒出生數13 萬8986 人更低。此外，2024 年總人口數2340\
    \ 萬220 人，較2023 年減少2 萬222 人，人口再次負成長。\n挽救出生率，從中央到地方，政府頻祭出各式生育獎勵金、育兒津貼、托育補助，以及擴大不孕症補助等，標舉盼減輕家庭育兒負擔，讓年輕世代敢婚敢生。\n\
    據中研院經濟所副研究員楊子霆與政大台灣研究中心合作研究發現，從經濟學來看，生養孩子家庭會面臨兩大轉變，一是支付家戶財務資源開支，另一是改變雙親時間安排與職涯規畫。生養小孩不僅是增加開銷，更重要的是大幅影響個人時間安排；如何讓父母不因小孩出生而犧牲自身發展，應是政府促進生育政策處理的關鍵。\n\
    因此，若想提升生育意願，除了傳統家庭觀念翻轉，政府也應提出更多能兼顧生養子女與個人生涯政策，如增加公共托育設施、居家托育服務、擬定方便育兒的請假制度，避免因生子而成家庭犧牲者。托育及就業政策催生聯盟發言人黃喬鈴表示，許多跨國實證研究得出，「支持女性平衡工作與家庭」才是有效作為，避免女性因育兒而受懲罰，並促進父親參與育兒，鼓勵兩性有效達成職業與生活的平衡。此外，聯合國人口基金報告也強調，未考慮家庭與性別角色的政策，不可能提升生育率。唯有政府透過制度，打破傳統男主外、女主內分工，轉而支持家庭「雙工作、雙育兒」，促進家內、家外、職場的性別平等，才能讓年輕人有意願養兒育女。\n\
    節錄自網址：https://www.gvm.com.tw/article/118819"
