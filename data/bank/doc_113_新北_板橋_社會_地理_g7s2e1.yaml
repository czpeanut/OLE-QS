  section: 1
  number: 15
  type: single
  page: 2
  stem: 根據上文判斷，影響台灣人口負成長主要因素為圖五中何者？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
