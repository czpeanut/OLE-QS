- id: doc_113_台南_民德_國文_g9s1e3_s4_8
  section: 4
  number: 8
  type: single
  page: 5
  stem: 根據本文，關於國中會考的注意事項，下列敘述何者正確？
  options:
  - label: A
    content: 按照窗戶所貼座位表，大致確認座位位置
  - label: B
    content: 為了在考試時保持清醒，建議喝咖啡提神
  - label: C
    content: 凌晨三點半起床，抓緊時間作考前最後衝刺
  - label: D
    content: 看考場時，可進入考場教室檢查桌椅是否搖晃
  group_stem: '※考場要注意

    看考場當天，多數國中會提早放學，讓學生（並無禁止家長陪同）到考場熟悉環境。試場（教室）不開放，但門窗會有座位表，考生可大致確認座位位置。為了防疫，進出動線一定有所限制，所以務必看考場！別把提早放學當成玩樂時間！還有，這時好好確認清楚廁所位置，遠比再讀些甚麼、考前猜題都還重要！

    ※考生考前要注意

    考前一晚最好十點前就寢，此時熬夜已無意義，隔天更易頭腦昏沉。 考試當天車多、人多，務必提早出門。早餐最好在家中吃完，避免空腹應試。進考場前務必上廁所，就算只有幾滴也要擠出，因為「緊張」會加快體內循環，把「它」清空，絕對可延緩爆炸時間。另外，別碰咖啡，咖啡利尿啊！

    ※考生衣著要注意

    若學校要求穿著制服，就請按學校規定。若穿便服，則避免過度「清涼」或「溫暖」。試場都是冷氣教室，怕冷的同學薄外套最好還是帶著備用。

    ※寫作測驗要注意

    1.要看清題目 雖然會考作文並無要求抄題（仍建議抄題），但部分特殊、半開放題目，如「在那段等待○○的日子裡」，就一定要抄題。

    2.題目說明要閱讀 「題目說明」是寫作導引，傳達出題概念，可做為寫作參考，不過依然可有自己的寫作方向。而在文章內直接抄寫題目說明，零分喔！

    3.要分段，三段以上為佳 在民國103 年至110 年的六級分樣卷中，分段以五至六段的占多數。

    4.架構要分明、篇幅要充足 「審題、鋪排、事例、收束」四要素，加上「起、承、轉、合」的架構，絕對是寫作的基本原則，全文篇幅能夠寫到翻面就儘量寫。

    5.別透露個人身分 文章內絕不可出現「我是○○○」或足以透露個人身分的訊息，這樣即便你文章行雲流水，連東坡都稱臣，但你還是，出局！

    6.避免用特殊符號或過度新潮詞彙 各種「新時代」符號、用語能免則免，否則就算寫下「XD」自嘲，結果也只能是「＞＜”」，那不但「冏」，更是「可撥」。寫到情緒高漲，也不要出現「嗨啊」、「不要旋轉我」、「咩噗QQ」等字眼，更別暴衝寫上「高舉人民的法槌」、「948794
    狂」等。若因特殊原因必須使用，請記得加上引號。

    7.不要有與內容無關的文字 所謂與內容無關的文字，例如：「閱卷老師您辛苦了」、「寫這麼多賞個面子給四級分吧」、「欲知後事如何，請待下回分曉」、「老師您好帥」等。

    8.文字不要超出格線 別在稿紙隔線外邊框加字，因為試卷那個位置無法掃瞄，閱卷老師看不到。還有，能不插字就不要插字！

    9.盡量舉出特別事例 數年前的「影響人類的一項發明」，手機、電腦並列兩大紅牌，愛迪生、貝爾也繼續刷存在感，但有人以「衛生紙」拿下六級分！「從陌生到熟悉」一題，多數人都寫學校經歷，當時我導師班的文學奇才，以國中三年來寫詩、創作的歷程入手，果然，六級分入袋！所以，儘量想些特殊的例子吧！

    10.請記得：文章要有「我」 沒有「我」，文章就沒有靈魂，純粹論理或只有別人的故事，連自己的想法都沒有，是沒有血肉的文章喔！

    (節錄自宋維哲〈關於國中會考應考與陪考〉)'
