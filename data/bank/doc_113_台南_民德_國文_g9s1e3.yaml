  group_stem: '十八世紀以前，英國只有貴族才能旅遊；但十六世紀的晚明，庶民也流行旅遊。庶民的主要旅遊形式為節慶廟會與進香團。晚明的進香團會在船上掛著「朝山進香」的旗幟，也有專門接待進香客的旅行社「牙家」，協助旅客吃喝玩樂。商業化的旅遊活動製造許多就業機會，也代表民生富裕。

    各種精緻工具也因旅遊興盛而產生，例如美觀而具不同功能的畫舫、放食物的提盒、烹茶煮酒的提爐等，還有陪伴出遊的僮僕與歌妓。由於商人在貿易行程中會順便觀光，原本供商人選擇交通參考的「路程書」，如《士商類要》、《天下水陸路程》等，也開始附上旅遊景點介紹。

    晚明出版的文集幾乎都有遊記，這個集體書寫現象反映當時的風氣。景點一經文人敘述，其他文人也會跟著尋訪並書寫，所以，景點是被塑造出來的，透過詩文不斷建構美感。當時的文人多在江南旅遊。江南是晚明的文化中心，文人到此社交、撰文，以爭取更多曝光和認可。有些文人不親自旅遊，而是派僮僕前去察看，再據僮僕見聞杜撰遊記，並以寫了多少遊記來彰顯身分地位。晚明由於商人階層崛起，社會地位提高，引起士大夫內心的焦慮，於是士大夫藉著遊道論述、雅俗之辨等，企圖與商人做出區隔，展現不同凡俗的品味。

    （改寫自王怡蓁〈晚明古人瘋旅遊，竟還有炫耀文、套裝行程？〉）'
