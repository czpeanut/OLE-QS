  - label: D
    content: 所有的決定都無法重來
- id: doc_113_台南_民德_國文_g9s1e3_s3_26
  section: 3
  number: 26
  type: single
  page: 3
  stem: 「倪瓚生活於元代後期，其時文人繪畫的創作理念和紙本山水畫的『乾筆皴擦』筆墨技法已經完善，而《六君子圖》可謂經典之作。圖上有倪瓚自題：『盧山甫每見輒求作畫，至正五年四月八日，泊舟弓河之上，而山甫篝燈出此紙，苦徵余畫，時已憊甚，只得勉以應之。大痴老師見之必大笑也。』大痴是黃公望的號，倪瓚這樣寫的意思是謙虛自己的畫藝不精。黃公望曾以十年時間為倪瓚畫《江山勝覽圖》，倪瓚推崇他，尊稱『老師』，可知兩人相交之深。後黃公望果見此圖，並欣然題詩圖上：『遠望雲山隔秋水，近看古木擁陂陀。居然相對六君子，正直特立無偏頗。』此圖之名『六君子』，應該就是從這首詩中來。」根據這段文字，下列敘述何者正確？
  options:
  - label: A
    content: 倪瓚在《六君子圖》畫上題字，以交代畫作命名由來
  - label: B
    content: 《六君子圖》與《江山勝覽圖》都是倪瓚筆下的經典之作
  - label: C
    content: 《六君子圖》表現元末的山水畫特色，倪瓚卻自謙畫技不純熟
  - label: D
    content: 倪瓚、盧山甫、黃公望先後在《六君子圖》上留下對此畫的評論
- id: doc_113_台南_民德_國文_g9s1e3_s4_1
  section: 4
  number: 1
  type: single
  page: 4
  stem: 依據上文，下列關於晚明文人旅遊的敘述，何者正確？
  options:
  - label: A
    content: 以發掘奇僻景點爭取同儕肯定
  - label: B
    content: 透過與商業化的旅遊活動拓展生計
  - label: C
    content: 經營文人導覽行程與庶民區隔
  - label: D
    content: 藉由發表江南旅遊經驗以提高聲望
  group_stem: '十八世紀以前，英國只有貴族才能旅遊；但十六世紀的晚明，庶民也流行旅遊。庶民的主要旅遊形式為節慶廟會與進香團。晚明的進香團會在船上掛著「朝山進香」的旗幟，也有專門接待進香客的旅行社「牙家」，協助旅客吃喝玩樂。商業化的旅遊活動製造許多就業機會，也代表民生富裕。

    各種精緻工具也因旅遊興盛而產生，例如美觀而具不同功能的畫舫、放食物的提盒、烹茶煮酒的提爐等，還有陪伴出遊的僮僕與歌妓。由於商人在貿易行程中會順便觀光，原本供商人選擇交通參考的「路程書」，如《士商類要》、《天下水陸路程》等，也開始附上旅遊景點介紹。

    晚明出版的文集幾乎都有遊記，這個集體書寫現象反映當時的風氣。景點一經文人敘述，其他文人也會跟著尋訪並書寫，所以，景點是被塑造出來的，透過詩文不斷建構美感。當時的文人多在江南旅遊。江南是晚明的文化中心，文人到此社交、撰文，以爭取更多曝光和認可。有些文人不親自旅遊，而是派僮僕前去察看，再據僮僕見聞杜撰遊記，並以寫了多少遊記來彰顯身分地位。晚明由於商人階層崛起，社會地位提高，引起士大夫內心的焦慮，於是士大夫藉著遊道論述、雅俗之辨等，企圖與商人做出區隔，展現不同凡俗的品味。

    （改寫自王怡蓁〈晚明古人瘋旅遊，竟還有炫耀文、套裝行程？〉）'
- id: doc_113_台南_民德_國文_g9s1e3_s4_2
