    8.文字不要超出格線 別在稿紙隔線外邊框加字，因為試卷那個位置無法掃瞄，閱卷老師看不到。還有，能不插字就不要插字！

    9.盡量舉出特別事例 數年前的「影響人類的一項發明」，手機、電腦並列兩大紅牌，愛迪生、貝爾也繼續刷存在感，但有人以「衛生紙」拿下六級分！「從陌生到熟悉」一題，多數人都寫學校經歷，當時我導師班的文學奇才，以國中三年來寫詩、創作的歷程入手，果然，六級分入袋！所以，儘量想些特殊的例子吧！

    10.請記得：文章要有「我」 沒有「我」，文章就沒有靈魂，純粹論理或只有別人的故事，連自己的想法都沒有，是沒有血肉的文章喔！

    (節錄自宋維哲〈關於國中會考應考與陪考〉)'
