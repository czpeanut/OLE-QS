  stem: 「寒食後雨……午霽，偕諸友至第三橋。落花積地寸餘，遊人少，翻以為快。忽騎者白紈而過，光晃衣，鮮麗倍常。諸友白其內者皆去表。少倦，臥地上飲，以面受花，多者浮，少者歌，以為樂。」根據上文，下列說明何者錯誤？
