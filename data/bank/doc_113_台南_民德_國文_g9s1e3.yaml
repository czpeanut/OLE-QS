  - label: C
    content: 這是星期一的早晨，昨晚啃噬的近代史學還沒有發酵，我卻又要站上講臺口沫橫飛。唉！我是否已厭倦了一成不變的教書生涯
  - label: D
    content: 人愛把自己關在門裡，門保證了孤獨和安全，門姑息了神祕和寂寞，門遮攔住照露現實的陽光，門掩蔽起在黑暗中化生的幻想
- id: doc_113_台南_民德_國文_g9s1e3_s3_25
  section: 3
  number: 25
  type: single
  page: 3
  stem: 「你知道嗎？象棋裡頭我覺得最『奧祕』的遊戲規則，就是『卒』。卒子一過河，就沒有回頭的路。人生中一個決定牽動另一個決定，一個偶然注定另一個偶然，因此偶然從來不是偶然，一條路勢必走向下一條路，回不了頭。我發現，人生中所有的決定，其實都是過了河的『卒』。」（龍應台〈親愛的安德烈〉）這段話所闡述的重點，不包含下列何者？
  options:
  - label: A
