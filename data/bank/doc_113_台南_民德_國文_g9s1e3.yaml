  stem: 下列關於張岱「夜戲金山寺」當天的說明，何者正確？
  options:
  - label: A
    content: 由林中點點殘雪場景，可知當時正值冬季
  - label: B
    content: 當日皓月當空，大地一片皎潔
  - label: C
    content: 作者一行人到金山寺時，已是戌時
  - label: D
    content: 作者抵達金山寺時，寺內燈火通明，僧侶群集
  group_stem: '崇禎二年中秋後一日，余道鎮江往兗①。日晡②，至北固，艤舟③江口。月光倒囊入水，江濤吞吐，露氣吸之，噀④天為白。余大驚喜。移舟過金山寺，已二鼓⑤矣。經龍王堂，入大殿，皆漆靜。林下漏月光，疏疏如殘雪。余呼小僕攜戲具，盛張燈火大殿中，唱韓蘄王⑥金山及長江大戰諸劇。鑼鼓喧闐，一寺人皆起看。有老僧以手背揉眼翳，翕⑦然張口，呵欠與笑嚏俱至。徐定睛，視為何許人，以何事何時至，皆不敢問。劇完，將曙，解纜過江。山僧至山腳，目送久之，不知是人、是怪、是鬼。

    （張岱〈金山夜戲〉）

    【注釋】①兗：音ㄧㄢˇ，地名。 ②晡:音ㄅㄨ，傍晚。 ③艤舟：停船靠岸。艤，音一ˇ，使船靠岸。 ④噀：音ㄒㄩㄣˋ，含在口中而噴。 ⑤二鼓：二更。 ⑥韓蘄王：南宋抗金名將韓世忠。蘄，音ㄑㄧˊ。
    ⑦翕，音ㄒㄧˋ，忽然。'
