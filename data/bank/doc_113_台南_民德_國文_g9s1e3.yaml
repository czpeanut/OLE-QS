  stem: 文中「四六」所指為何？
  options:
  - label: A
    content: 賦
  - label: B
    content: 駢文
  - label: C
    content: 樂府
  - label: D
    content: 漢魏古文
  group_stem: '神宗即位，首擢公為翰林學士，公力辭，不許。上面諭公：「古之君子，或學而不文，或文而不學，惟董仲舒、揚雄兼之，卿有文學，何辭為？」公曰：「臣不能為四六。」上曰：「如兩漢制詔可也。」公曰：「本朝故事不可。」上曰：「卿能舉進士，取高第，而云不能四六，何也？」公趨出。上遣內臣至閣門，強公受告，拜而不受。趨公入謝，曰：「上坐以待公。」公入，至廷中，以告置公懷中，不得已乃受。

    (蘇軾〈司馬溫公①行狀②〉)

    【注釋】 ①司馬溫公，即司馬光。 ②行狀：敘述死者生平事蹟的文章。'
