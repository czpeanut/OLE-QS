- id: doc_113_台中_五權_社會_地理_g9s2e1_s1_39
  section: 1
  number: 39
  type: single
  page: 1
  stem: 臺灣的縣市與鄉鎮區名稱，有許多會以其所在位置的相對方位來命名，如臺中市以及臺中市內的北區、東區、南區、西區等，這些名稱顯示該行政區的空間分布特色。請問：臺中市內以方位來命名的行政區，大多具備何項特色？
  options:
  - label: A
    content: 農作物產量較大
  - label: B
    content: 地形較為起伏陡峭
  - label: C
    content: 原住民族比例較高
  - label: D
    content: 都市發展程度較高
