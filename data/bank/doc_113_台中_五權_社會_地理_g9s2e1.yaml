  section: 1
  number: 40
  type: single
  page: 1
  stem: 對地名有興趣的飛飛到「苓雅寮」（現今苓雅區）進行地理實察，發現「苓雅寮」是漁民放置漁網之處，飛飛手上的 GPS 最可能顯示的經緯度為下列何者？
