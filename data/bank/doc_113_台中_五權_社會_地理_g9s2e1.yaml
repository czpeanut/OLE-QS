- id: doc_113_台中_五權_社會_地理_g9s2e1_s1_36
  section: 1
  number: 36
  type: single
  page: 1
  stem: 雅惠的家鄉三面環山，是著名的客家鄉鎮。其中，油紙傘是當地最具代表性的手工藝品，兼具遮雨及擺飾觀賞的功能；過去油紙傘是地方的傳統技藝，後來因為觀光事業興起而成為遊客來此地必購買的紀念品。請問：雅惠的家鄉應位於下列何地？
  options:
  - label: A
    content: 宜蘭冬山
  - label: B
    content: 新北鶯歌
  - label: C
    content: 南投埔里
  - label: D
    content: 高雄美濃
