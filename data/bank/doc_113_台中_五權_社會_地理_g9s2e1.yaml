  page: 1
  stem: 從大航海時代開始，荷蘭與西班牙等歐洲人陸續來到臺灣，並在臺灣留下一些地名，如｢富貴角｣是源自荷蘭語的「Hoek」，為岬角之意。請問下列哪個地名與｢富貴角｣一樣，為源於外來語的地名？
  options:
  - label: A
    content: 北投
  - label: B
    content: 大湖
  - label: C
    content: 玉井
  - label: D
    content: 鯤鯓
- id: doc_113_台中_五權_社會_地理_g9s2e1_s1_35
  section: 1
  number: 35
  type: single
  page: 1
  stem: '附表為大丙利用內政部「地名資訊服務網」查詢，在臺灣各縣市中，包含某一農作物的加工場所名稱之地名數量。請問：由表中資訊判斷，下列哪個地名與該加工場所最相關？

    | 基隆市 | 0 | 臺中市 | 19 | 高雄市 | 26 |

    | 臺北市 | 1 | 南投縣 | 19 | 屏東縣 | 22 |

    | 新北市 | 7 | 彰化縣 | 12 | 宜蘭縣 | 9 |

    | 桃園市 | 4 | 雲林縣 | 27 | 花蓮縣 | 1 |

    | 新竹市 | 1 | 嘉義市 | 2 | 臺東縣 | 1 |

    | 新竹縣 | 10 | 嘉義縣 | 36 | 澎湖縣 | 0 |

    | 苗栗縣 | 2 | 臺南市 | 58 | | |'
  options:
  - label: A
    content: 寮廍
  - label: B
    content: 油車
  - label: C
    content: 鹹菜甕
  - label: D
    content: 樟腦寮
  uncertain_spans:
