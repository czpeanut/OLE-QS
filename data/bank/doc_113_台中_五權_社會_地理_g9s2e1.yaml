  section: 1
  number: 43
  type: single
  page: 1
  stem: 阿花到中國旅遊時，發現當地有些地名與臺灣的聚落名稱很相像，查找資料後，才了解在清代漢人來台開墾時，有時會把原鄉的地名移植來臺，因此形成地名相同的情況，下列地名何者即屬於此？
  options:
