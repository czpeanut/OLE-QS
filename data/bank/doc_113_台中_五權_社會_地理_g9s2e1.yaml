  group_stem: ※「烏來區位於新北市南端，境內山高谷深。相傳三百多年前，當地人狩獵至此，發現南勢溪冒出熱水與輕煙，齊呼『uraikirofu』，意為冒煙的熱水，這就是烏來地名的由來。近年因泡湯文化盛行，各式溫泉旅館在此林立。」請回答下列問題。
