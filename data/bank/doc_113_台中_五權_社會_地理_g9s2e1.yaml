  section: 1
  number: 46
  type: single
  page: 1
  stem: 臺灣山區設立行政區的時間較晚，所以有部分行政區的名稱，被政府賦予政治意識或道德教化的含義。近年來，因尊重原住民族傳統文化的意識抬頭，漸漸開啟正名之路。請問：下列哪個鄉鎮市區名較有改名的需求？
  options:
  - label: A
    content: 桃園市復興區
  - label: B
    content: 新北市北投區
  - label: C
    content: 新北市烏來區
  - label: D
    content: 高雄市那瑪夏
