  section: 1
  number: 41
  type: single
  page: 1
  stem: 臺灣在不同時期曾有不同範圍及名稱，如：大員、福爾摩沙等，請問「臺灣」二字最早被官方用來作為行政區名稱為下列哪個時期？
  options:
  - label: A
    content: 荷人在台時期
  - label: B
    content: 鄭氏時期
  - label: C
    content: 清帝國時期
  - label: D
    content: 日治時期
- id: doc_113_台中_五權_社會_地理_g9s2e1_s1_42
  section: 1
  number: 42
  type: single
  page: 1
  stem: 臺灣行政區名稱多由聚落地名轉化而來，可能是雅化或簡化、合併或重組、重複而改名，下列哪個行政區名的成因與臺南市「龍崎」區相似？
  options:
  - label: A
    content: 屏東「南州」
  - label: B
    content: 彰化「伸港」
  - label: C
    content: 新北「中和」
  - label: D
    content: 新竹「關西」
