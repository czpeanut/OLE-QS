  stem: '根據下文所述內容，下列選項之說明何者正確？


    中國綠茶中具有代表性當屬浙江省 杭州市附近出產的「龍井」。在西湖的西南有個龍井村，其附近的山區是綠茶的主要產地，「龍井」因而得名。一般將其統稱為「西湖龍井」，而在龍井之中，又屬獅峰的茶葉是最上等的，因此獅峰龍井尤為珍貴。

    龍井茶的葉子呈扁平，顏色為漂亮的翠綠色。龍井因「色翠、香郁、味甘、形美」四大特徵而聞名，稱為四絕。

    （陳舜臣 茶事遍路‧龍井）'
