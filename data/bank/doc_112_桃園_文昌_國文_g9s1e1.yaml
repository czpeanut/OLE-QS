  section: 2
  number: 32
  type: single
  page: 5
  stem: 根據本文作者所述，其認為減緩氣候變遷的途徑為下列何者？
  options:
  - label: A
    content: 簽訂國際協定加以約束
  - label: B
    content: 人為努力只是徒勞無功
  - label: C
    content: 增加創新能源使用效率
  - label: D
    content: 改善人口分布不均問題
  group_stem: '一、人類真的有能力減緩氣候變遷嗎？

    　　氣候是一個複雜系統，雖然多年來全球眾多科學家窮畢生智力，建立各種理論甚至複雜的模擬模型，總是不能周全，讓懷疑論者有機可乘，其中還有許多素有名望的科學家提出各種質疑。例如MIT知名學者Richard
    Lindzen，便在二○一七年二月聯合了三百位「科學家」共同署名，建議川普總統退出巴黎協定。這些氣候變遷的否定者大致抱持以下幾個論點：

     地球溫度不像人體保持恆溫，歷史上向來高低交替，周而復始。三百年前，地球才經過「小冰河」時期。雖然當今地球氣溫不斷升高，其實不過是從低點往上回升的正常現象，過了某一高點，自然會回降。

     真正造成地球溫度增加的原因是太陽，而不是人類，因此透過改變人類生活方式以扭轉氣候變遷的人為努力必然徒勞無功。

    　　這樣的說法，你能說不對嗎？能夠拿出證據來反駁嗎？

    　　此外，減緩氣候變遷一則需要減少碳排放，一則要增加能源使用效率。以每人每年平均碳排放量而言，先進國家的居民，特別是美國，是落後國家居民排放量的十倍以上。即使這些先進國家擁有許多環保意識的先驅，但要每一個人類犧牲既有的生活品質，少洗熱水澡，晚上不吹冷氣，走路而不開車，卻是極度困難。更難的是：環保可有個人絕對標準？一個人要不浪費到什麼程度，才算夠環保，夠愛護地球？

    　　難怪有人悲觀地提出一個30-3定律：即使30%的國民裡具有○○意識（○○可以是環保、有機食品或極簡生活），真正能付諸行動的只有3%。

    二、能解決氣候議題的鑰匙可能還沒出現

    　　增加能源使用效率唯有靠創新，但潔淨科技的創新普遍面臨三個弔詭。一是需要長期資源的投入，失敗的風險大。其次是如果創新成功，必將引起一波汰舊換新的資源浪費。最後則是創新發明通常會觸發原本不存在的新應用，結果增加的能源使用量可能比節省的還多。

    　　眾多創新技術的選項裡沒有最佳，只有取捨。例如核電最潔淨，但終極安全令人憂慮；風力或太陽能發電既潔淨又安全，但土地利用效率差，成本又高，而且發電量不穩定；水力發電具有多項優點，但對生態衝擊最大，在先進國家早已不再成為選項；美國用新技術開採出大量的頁岩天然氣，卻有造成地層劇烈變動的隱憂。

    　　因此各種能源的選擇都是兩利難以取其重，兩害又不知如何取其輕。守護家園的願景固然動人，難以兩全的現實卻很冷酷。

    三、誰才應該付出代價？

    　　氣候變遷對各國威脅不同。氣溫上升，北方國家不免心中竊喜，酷寒的冬季轉為宜人的季節，房地產價值上升，經濟成長，居民多不至於反對。此外，先進國家或人口密集的城市雖然是氣候變遷的加害人，真正的受害者卻遠在世界各偏僻的角落，例如非洲、中東的沙漠，氣候本來炎熱，氣溫持續上升，更不宜居住。許多大洋洲或加勒比海各小國，平均高度十公尺，當海平線升高一公尺，國土面積馬上減半。當加害人與受害者兩無關連，加害人自然漫不經心。

    （節錄自鄭志凱 有關氣候變遷的難題）'
