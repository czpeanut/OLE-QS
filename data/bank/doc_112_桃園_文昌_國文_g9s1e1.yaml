- id: doc_112_桃園_文昌_國文_g9s1e1_s2_35
  section: 2
  number: 35
  type: single
  page: 6
  stem: 關於本文的寫作手法，下列何者說明正確？
  options:
  - label: A
    content: 透過與阿公的對話說明作者返鄉之原因
  - label: B
    content: 以夾敘夾議法論述振興家鄉農業的方法
  - label: C
    content: 以譬喻手法具體呈現青春期的重大變化
  - label: D
    content: 藉由聽覺摹寫表現阿公老家的農村風光
  group_stem: '有時覺得，連自己也說不上來，究竟為了什麼理由，在經過三十餘寒暑交替，幾番人世因緣起伏之後，還是選擇回到土地，回到這條阿公曾經走過的田埂路。

    　　2004年春天，我結束在日本研究所的學業，回到睽違兩年的故鄉，下田扮起荷鋤戴笠的作穡人，大多數的朋友，包括一輩子學法律的指導教授在內，聽到我打算回鄉下種田，莫不瞪大了眼睛，加上懷疑的表情。或許只有自己才知道，這顆稻米的種子，早在青澀年少的時代，便已埋進了心田。

    　　十二歲那年冬天，父親經商失敗，舉家遷回台中鄉間、那個原本只有過年過節才有機會回去的小村落。印象中滿溢著年糕香味、炊煙裊裊的阿公老家，對於生長在黑手家庭的自己而言，是個極大的文化震撼。

    　　如今回想起來，當時正值青春期的自己，有如經歷精神上的移植，一如在栽培蔬菜時，將小苗由苗床移植到田圖上那般，雖然幼苗必須忍受根鬚撕裂的苦楚，然而當它定植到柔軟黝黑的沃土時，令人難以想像的，無數新生細密的根系，竟由原本斷裂的傷口處萌發衍生，造就出更加茁壯的根系與體質。整整一年的農村生活經驗，該是自己選擇這條道路最原始的起點吧。

    （節錄自賴青松 回到阿公行過的那條田埂路）'
