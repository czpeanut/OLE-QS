- id: doc_112_桃園_文昌_國文_g9s1e1_s2_38
  section: 2
  number: 38
  type: single
  page: 6
  stem: 關於本詞的寫作手法之說明，下列何者有誤？
  options:
  - label: A
    content: 「剔銀燈」為詞牌名，「與歐陽公席上分題」是本詞的題目
  - label: B
    content: 上片藉歷史人物之對比點出旨意
  - label: C
    content: 下片以問句抒發作者內心的感嘆
  - label: D
    content: 依詞的格律要求，本詞上下片均有一組對仗
  group_stem: '昨夜因看蜀志。笑曹操、孫權、劉備。用盡機關，徒勞心力，只得三分天地。屈指細尋思，爭(1)如共、劉伶一醉。

