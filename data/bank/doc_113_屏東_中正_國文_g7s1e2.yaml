- id: doc_113_屏東_中正_國文_g7s1e2_s2_5
  section: 2
  number: 5
  type: single
  page: 3
  stem: 下列哪一個成語，可用來形容大象的「木樁」心理？
  options:
  - label: A
    content: 畫地自限
  - label: B
    content: 百折不撓
  - label: C
    content: 桀驁不馴
  - label: D
    content: 聰明睿智。
  group_stem: "馬戲團裡表演的大象，都是從小就開始訓練的。\n  小時候的小象很調皮，玩性又大，故用繩子把小象拴在木樁上，由於小象力量小，經過很多次的試驗都無法將木樁拖出來，當時間久了之後，只要把象繫在木樁上，象知道自己無法掙脫，也就會很安分了。\n\
    \  小象長大變成了大象，在馬戲團中可以做很多的表演。大象力大無窮，可以搬很多東西，但在表演後，卻很安分的被繩子拴在木樁上。\n  大象的力量其實是很大的，但是牠因為從小的經驗，覺得木樁的力道比自己大，是唯一可以拴住自己的東西，使得他不敢去移動木樁。\n\
    \  其實大象是被自己以前的觀念所束縛，不了解自己的體力已有很大的改變了，因而放棄了想移動木樁的念頭。\n  木樁，就像是妨礙個人發揮潛力的障礙；或許不是具體可見的阻力，而是由個人過去細微的經驗所產生的無名恐懼。\n\
    （潘台成 綠化心靈．木樁）"
