  group_stem: '冒險—痛苦—失敗—失望，是跟著來的，存心冒險的人就得打算他最後的失望；但失望卻不是絕望，這分別很大。我是曾經遭受失望的打擊，我的頭是流著血，但我的脖子還是硬的；我不能讓絕望的重量壓住我的呼吸，不能讓悲觀的慢性病侵蝕我的精神，更不能讓厭世的惡質染黑我的血液，厭世觀與生命是不可並存的，我是一個生命的信徒，初起是的，今天還是的，將來—我敢說—也是的。我絕不容忍性靈的頹唐，那是最不可救藥的墮落，同時卻繼續軀殼的存在；在我，單這開口說話，提筆寫字的事實，就表示後背有一個基本的信仰，完全的沒有破綻的信仰。

