    content: 就郡言，靈隱寺為「尤」矣。
  group_stem: '東南山水，餘杭郡為最。就郡言，靈隱寺為尤。由寺觀，冷泉亭為甲。亭在山下，水中央，寺西南隅。高不倍尋①，廣不累丈，而撮奇得要，地搜勝概，物無遁形。

    春之日，吾愛其草薰薰，木欣欣，可以導和納粹，暢人血氣。夏之夜，吾愛其泉渟渟，風泠泠，可以消煩解醉，起人心情。山樹為蓋，岩石為屏，雲從棟生，水與階平。坐而玩之者，可濯足於床下；臥而狎之者，可垂釣於枕上。況又潺湲潔澈，粹冷柔滑。若俗士，若道人，眼耳之塵，心舌之垢，不待盥滌，見輒除去。潛利陰益②，可勝言哉？斯所以最餘杭而甲靈隱也。

