  stem: '下列敘述正確的有 $a$ 項，錯誤的有 $b$ 項，請問 $a-b$ 等於多少?

    (甲) 根據四分位數的定義，則 $Q_{3}-Q_{2}=Q_{2}-Q_{1}$。

    (乙)四分位數 $Q_{3}$ 就是將資料由小到大排序，至少有 $\frac{3}{4}$ 的資料小於或等於 $Q_{3}$，且至少有 $\frac{1}{4}$
    的資料大於或等於 $Q_{3}$。

    (丙)當我們知道一群資料的最小值、$Q_{1}$、$Q_{2}$、$Q_{3}$、最大值，則可以根據這 5 個數值，繪製出這群資料的盒狀圖。

    (丁)全距 $=Q_{3}-Q_{1}$。'
