- id: doc_113_高雄_鼎金_社會_地理_g8s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 韓國前總統文在寅對COVID-19大流行的反應，在任內受到國內外稱讚。但在執政黨舞弊仍疑雲重重的狀況下，文在寅在任期最後特赦前總統朴槿惠，並剝奪檢方直接偵查權，遭質疑是為躲避卸任後的牢獄之災。另外2022年8月韓國政府特赦三星集團領導人李在鎔(因涉嫌賄賂前總統朴槿惠的閨密而被定罪入獄)，韓國政府同時發布聯合新聞稿說：「為了藉活化經濟來克服經濟危機，最近緩刑期限結束的三星電子副董事長李在鎔，將得以復職。」請問：上述顯示出韓國產業的哪一項特色？
