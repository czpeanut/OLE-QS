    新冠肺炎(COVID-19)亦影響韓式美妝業「K-beauty」。西元2020年，南韓化妝品出口額約為76億美元，僅次於法國與美國，位居全球第三。其中，中國占南韓化妝品出口總額約50%，而對俄羅斯、哈薩克、日本、英國、加拿大、美國等國的出口額也有所增長。若依化妝品的出口類型來看，護膚產品出口較西元2019年增加17.6%，護髮產品增加19.2%，洗澡產品增加65.6%，彩妝產品則減少5.3%。有趣的是，洗澡類產品增加與彩妝產品減少的原因，與新冠肺炎(COVID-19)疫情改變生活習慣與型態有關。請回答第9~13題：'
