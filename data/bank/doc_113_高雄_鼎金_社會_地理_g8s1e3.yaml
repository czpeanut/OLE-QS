  stem: 日本的建築基準法第56條，明文規定在建造有一定高度的房子時，必須遵照不可侵犯附近鄰居的日照權，讓每個人的家都可以照到陽光，倘若超高大樓真的影響周遭鄰居的日照權，建商甚至還要付出賠償金。該項規定與日本何種環境特徵關係最大？
  options:
  - label: A
    content: 空氣汙染嚴重
  - label: B
    content: 地狹人稠
  - label: C
    content: 氣候乾冷
  - label: D
    content: 地震頻繁
- id: doc_113_高雄_鼎金_社會_地理_g8s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 朝鮮半島以長白山與中國相隔，其地形的樣貌看起來就像一個「豸」字一樣，請問：下列關於朝鮮半島地形的敘述，何者正確﹖
  options:
  - label: A
    content: 太白山脈位於西側
  - label: B
    content: 河流多向西注入日本海
  - label: C
    content: 蓋馬高原位於南方
  - label: D
    content: 平原分布於西南方
- id: doc_113_高雄_鼎金_社會_地理_g8s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 日本主要的自然景觀常常吸引眾多國際觀光客一探究竟，造就日本龐大的觀光收益。下列哪一個景觀的形成與地震帶最無關？
  options:
  - label: A
    content: 「♨」此符號代表溫泉，上方畫了三道熱氣，是代表一天當中泡湯的最好時段為：晚餐前、晚餐後，以及睡覺前，總共三次，可以見得日本人非常喜歡泡溫泉
  - label: B
    content: 日本文學《竹取物語》中，有許多關於火山口冒煙和震動的記錄，文中許多武士將長生不死的靈藥在最接近天的富士山上燃燒，因此，這座山名為「富士山」、「不死山」或「不盡山」。（日語中，「不死」和「不盡」的發音都與「富士」接近）
  - label: C
    content: 關東平原上以東京為中心的首都圈幾乎全為都市用地所覆蓋。在周邊的沖積平原上有一部分的稻作農業存在，而在台地則多為旱田
  - label: D
    content: 日本政府投入1220億日元(約284億台幣)巨資，花費了近30年時間建造北堤全長990米、南堤全長670米、高63米……固若金湯的世界第一防波堤。
- id: doc_113_高雄_鼎金_社會_地理_g8s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 圖(一)提供給賞楓葉遊客參考的地圖。到了秋天，隨著氣溫變冷，楓紅的景致也吸引許多遊客前往觀光。請從此圖中，推想看看，日本四大島中，哪個地方的楓葉最早轉紅?
  options:
  - label: A
    content: 北海道
  - label: B
    content: 本州
  - label: C
    content: 四國
  - label: D
    content: 九州
