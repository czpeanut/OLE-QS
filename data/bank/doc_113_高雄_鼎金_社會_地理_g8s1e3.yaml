  stem: 朝鮮半島從以前開始就是食用泡菜……。請問：這與下列哪一條件最有關？
  options:
  - label: A
    content: 梅雨季長，食物保存不易
  - label: B
    content: 冬季嚴寒，缺乏新鮮蔬菜
  - label: C
    content: 降水量稀少，無法種植蔬菜
  - label: D
    content: 夏季酷熱，食物容易敗壞
  group_stem: '◎日、韓與台灣都有使用筷子，但是相互之間有一些不同。請依下列文章內容，回答第16~20題：

    日本人在吃飯時，一般都把飯菜湯碗全放在一個托盤上，每個人吃自己面前的一份，既不會像中國人一樣圍著大桌子一起吃，也沒有給別人夾菜的習慣，所以筷子就沒必要設計得太長。且日本人吃的食物通常小巧精緻，尖細的筷頭用來剔撥食物更方便，同時他們也很喜歡吃海魚，設計成尖頭更適合扎魚肉、剃魚刺。

    而朝鮮半島早期房子的構造是廚房與飯廳、客廳分開，端菜時為了防止筷子滾落才設計成扁的。且當地從以前開始就是食用泡菜為主食，當地有句俗話說：「泡菜是半個糧食」，泡菜又是需要醃漬、放置的食品，因此使用金屬能方便驗毒，不過更實際的原因可能在於清洗容易，因為韓式料理多使用醃漬、大量醬料，若長期使用木筷的話容易有洗不乾淨的疑慮。與台、日不同，韓國人吃飯從不端起碗來，筷子是為了「把菜挟進碗裡」而存在，夾完菜再換成湯匙將食物放入口，韓國飲食文化認為只有乞丐才會拿碗(因當地「捧碗」即「要飯」之意)，因此吃飯時他們多用湯匙挖飯，避免手、嘴巴靠近飯碗。'
