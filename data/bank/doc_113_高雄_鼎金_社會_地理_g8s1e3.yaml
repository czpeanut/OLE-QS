  section: 1
  number: 9
  type: single
  page: 2
  stem: 韓國綠色新政宣示要在西元2050年成為東亞與東北亞地區第一個「去碳化(淨零碳排)國家」。請問：下列哪一項重大產業採用綠色能源後，將可大幅減少碳排放量，有助於達成目標？
  options:
  - label: A
    content: 成衣
  - label: B
    content: 手機
  - label: C
    content: 汽車
  - label: D
    content: 電影
  group_stem: '◎韓國的新冠肺炎(COVID-19)疫情在西元2020年8月中再度上升，且以人口稠密的都市區域為中心迅速擴散，為了挽救疫情造成的經濟停滯與衝擊，總統文在寅提出推動數位與綠色新政，重新思考能源、基礎建設與產業發展的機會，也同步回應氣候變遷的危機，南韓的「綠色新政」宣示要在2050年成為東亞與東北亞地區第一個「去碳化(淨零碳排)國家」。

    新冠肺炎(COVID-19)亦影響韓式美妝業「K-beauty」。西元2020年，南韓化妝品出口額約為76億美元，僅次於法國與美國，位居全球第三。其中，中國占南韓化妝品出口總額約50%，而對俄羅斯、哈薩克、日本、英國、加拿大、美國等國的出口額也有所增長。若依化妝品的出口類型來看，護膚產品出口較西元2019年增加17.6%，護髮產品增加19.2%，洗澡產品增加65.6%，彩妝產品則減少5.3%。有趣的是，洗澡類產品增加與彩妝產品減少的原因，與新冠肺炎(COVID-19)疫情改變生活習慣與型態有關。請回答第9~13題：'
