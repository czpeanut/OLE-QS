  section: 1
  number: 3
  type: fill
  page: 1
  stem: '下列將文字敘述改寫成不等式的寫法，哪些是正確的？

    (A) 小白：「$x$不小於 18」可以改寫成「$x \geq 18$」。

    (B) 正男：「$4y - 9$至多 36」可以改寫成「$4y - 9 < 36$」。

    (C) ㄚ呆：「$2a$超過 30」可以改寫成「$2a > 30$」。

    (D) 妮妮：「$5b + 7$不逾 11」可以改寫成「$5b + 7 \leq 11$」。

    (E) 小葵：「$3c$比（$-6$）大、比 15 小」可以改寫成「$3c > -6 < 15$」。'
