- id: doc_113_新北_丹鳳_國文_g8s1e2_s3_26
  section: 3
  number: 26
  type: single
  page: 3
  stem: 「以後，開始讀文學史、讀陶淵明文集，終於知道淵明所處的時代，是一個紛亂擾攘、令人嘆息的亂世，同時也漸漸了解，淵明的個性，又是怎樣的剛拙高潔、率性任真；……淵明的表現，雖然冷淡，但他的心比誰都熱；他愛這個人類世界，但是以一種孤絕的愛去愛它──揀盡寒枝不肯棲，寂寞沙洲冷──這樣一個懷抱理想、堅持原則的人物，悠悠千載之下，再讀，便只有掩卷沉默。」（陳幸蕙〈自在飛花輕似夢〉）以上這段文字的主旨為何？
  options:
  - label: A
    content: 點出陶淵明身處亂世卻不合時宜的悲哀
  - label: B
