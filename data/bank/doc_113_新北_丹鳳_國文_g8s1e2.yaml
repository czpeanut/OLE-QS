- id: doc_113_新北_丹鳳_國文_g8s1e2_s4_34
  section: 4
  number: 34
  type: single
  page: 3
  stem: 根據上文，「細腰」是由下列哪一種器物所幻化而成？
  options:
  - label: A
    content: 杵
  - label: B
    content: 錢
  - label: C
    content: 銀
  - label: D
    content: 金。
  group_stem: '魏郡 張奮者，家本巨富，忽衰老，財散，遂賣宅與程應。應入居，舉家病疾，轉賣鄰人何文。文先獨持大刀，暮入北堂中梁上。至三更竟，忽有一人，長丈余，高冠黃衣，升堂，呼曰：「細腰！」細腰應諾。曰：「舍中何以有生人氣也？」答曰：「無之。」便去。須臾，有一高冠，青衣者；次之，又有高冠白衣者。問答並如前。及將曙，文乃下堂中，如向法呼之，問曰：「黃衣者為誰？」曰：「金也。在堂西壁下。」「青衣者為誰？」曰：「錢也。在堂前井邊五步。」「白衣者為誰？」曰：「銀也。在牆東北角柱下。」「汝復為誰？」曰：「我，杵也。今在灶下。」及曉，文按次掘之，得金銀五百斤，錢千萬貫，仍取杵焚之。由此大富。宅遂清寧。

    （干寶《搜神記》）'
