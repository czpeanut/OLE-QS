- id: doc_113_新北_丹鳳_國文_g8s1e2_s3_1
  section: 3
  number: 1
  type: single
  page: 1
  stem: '（甲）賞罰要公正，不宜有所「異同」

    （乙）「黑白」不分的人，有理說不清

    （丙）「臧否」人物，應公平公正

    （丁）「國家」興亡，匹夫有責

    （戊）久遠的「記憶」，早已淡忘

    （己）天有不測風雲，人有旦夕「禍福」

    （庚）事有「輕重」緩急，不可本末倒置

    （辛）把「窗戶」打開，讓空氣流通。

    以上「  」中的詞語，何者是偏義複詞？'
  options:
  - label: A
    content: 甲丁己辛
  - label: B
    content: 甲丙己庚
  - label: C
    content: 乙丁戊庚
  - label: D
    content: 乙丙戊庚。
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
      code: 語文常識(二)
      title: 語法(下)句子
