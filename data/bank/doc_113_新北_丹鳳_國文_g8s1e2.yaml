- id: doc_113_新北_丹鳳_國文_g8s1e2_s3_6
  section: 3
  number: 6
  type: single
  page: 1
  stem: 下列句子，哪一句的用字完全正確？
  options:
  - label: A
    content: 最近這幾場滂沱的西北雨讓水庫大霸緊急洩洪以條節水位，氣勢萬鈞的景像讓遊客嘆為關止
  - label: B
    content: 老王平常省吃撿用，揭盡心力的幫助他人，屢次為育幼院幕款，希望能看見孩子的笑容
  - label: C
    content: 對他來說，閱讀就像呼吸一樣自然，總是隨身戴著耳機、一本書，善用生活中的空檔，靜下心來閱讀
  - label: D
    content: 這步電影的題材新影，主角們各個演技精贊，最有趣的是結局顛復觀眾的想像，難怪會造成陌大的話題。
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
      code: 第一課
      title: 田園之秋選
      chapter: null
