  stem: 「蓮花洞之前為居然亭，亭軒豁可望。每一登覽，則湖光獻碧，鬚眉形影，如落鏡中。六橋楊柳，一路牽風引浪，蕭疏可愛。晴雨煙月，風景互異，淨慈之絕勝處也。洞石玲瓏若生，巧逾雕鏤。」關於這段遊記的內容，下列敘述何者正確？
