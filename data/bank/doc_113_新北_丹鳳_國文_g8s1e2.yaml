  section: 3
  number: 5
  type: single
  page: 1
  stem: 下列「 」的字義比較，何者意思相同？
  options:
  - label: A
    content: 盡「向」地面攫來／心之所「向」
  - label: B
    content: 不汲汲「於」富貴／祖母之「於」我家
  - label: C
    content: 大約大去之「期」不遠矣／「期」在必醉
  - label: D
    content: 晏「如」也／「如」願以償。
