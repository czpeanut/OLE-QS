- id: doc_113_新北_丹鳳_國文_g8s1e2_s3_9
  section: 3
  number: 9
  type: single
  page: 1
  stem: 下列有關〈田園之秋選〉文意的敘述，何者正確？
  options:
  - label: A
    content: 「只覺滿天無數黑怪，張牙舞爪，盡向地面攫來」：西北雨來勢洶洶，宛如黑怪降臨
  - label: B
    content: 「接著便是閃電纏身，霹靂壓頂，在荒野中的人，此時沒有一個不是被震懾得氣脫委頓，匍匐不能起的」：溫室效應帶來氣候異常，人們自食惡果
  - label: C
    content: 「下午大雨滂沱，霹霹環起，若非番薯田在家屋邊，近在咫尺，真要走避不及」：大雨來得迅雷不及掩耳，差點讓人措手不及
  - label: D
    content: 「遇到這樣氣勢萬鈞的大西北雨前奏，誰也不能逞英雄，因為此時在天地之間除了它是英雄之外，不准有第二個人是英雄」：人若向大自然逞英雄，將會受到其反撲。
