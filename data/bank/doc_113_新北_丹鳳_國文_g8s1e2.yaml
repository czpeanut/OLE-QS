- id: doc_113_新北_丹鳳_國文_g8s1e2_s4_28
  section: 4
  number: 28
  type: single
  page: 3
  stem: 「飢來食倦來眠，一切視需要」中的「需要」應是指哪方面？
  options:
  - label: A
    content: 心理
  - label: B
    content: 精神
  - label: C
    content: 生理
  - label: D
    content: 社會。
  group_stem: '酣睡中醒來，聽見貓頭鷹在窗外老楊桃樹上鳴。貓頭鷹的鳴聲一點兒也不吵人，相反地，有種靜謐感，可加深人的酣睡，但是我還是醒來了，可見貓頭鷹的鳴聲如何地吸引我！既聽見貓頭鷹的鳴聲，興致便來了，不想再睡了，於是起來點了燈，壁鐘噹、噹、噹敲了三下，纔只有三點鐘，管它幾點，飢來食倦來眠，一切視需要。

    不久貓頭鷹走了。洗過了臉面，坐下來晨讀。櫥下傳出唧唧蟲鳴，那是竈①雞，通常聚在竈邊積柴下，入夜即鳴，我叫牠為詩蟲，因為牠是詩人夜裏唯一的知友，鳴聲很美，和外邊草中的鈴蟲聲，構成最美妙的音樂。覺察到竈雞的細鳴，不得不放棄了書本，此君比書本還吸引人。通常總因習焉不察，聽而不聞，一旦覺察過來，任何事情都抵不過牠。此蟲唯一的缺點，是會啃書，但無論牠對書本造成多大的傷害，我都不忍傷害牠。聽貓頭鷹是一種味兒，聽竈雞是另一種味兒，而外邊草中的鈴蟲聲，又是另一種味兒，各有千秋，可是都同是夜裏的美音，田園之夜雖說是靜謐的，卻穿插著一些細微的美音，就像森林中暗穿著涓涓的細流一般。（節選自陳冠學《田園之秋》）

    注：①竈，音ㄗㄠˋ以磚土或石塊砌成，用來生火烹飪的設備。也作「灶」。'
