  section: 3
  number: 7
  type: single
  page: 1
  stem: 關於「柳樹」的成語很多，下列何者使用最為正確？
  options:
  - label: A
    content: 變形金鋼氣質高雅，正是「蒲柳之姿」
  - label: B
    content: 蜘蛛人平常看來「弱柳扶風」，沒想到變身後如此健壯
  - label: C
    content: 金鋼狼深具「詠絮之才」，是知名的黃金單身漢
  - label: D
    content: 霹靂嬌娃一副「柳眉倒豎」的模樣，不知是誰惹了她。
  tags:
