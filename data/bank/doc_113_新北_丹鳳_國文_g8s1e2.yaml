  group_stem: '結廬在人境，而無車馬喧。

    問君何能爾？心遠地自偏。

    採菊東籬下，悠然見南山。

    山氣日夕佳，飛鳥相與還。

    此中有真意，欲辯已忘言。

    （陶淵明〈飲酒其五〉）'
