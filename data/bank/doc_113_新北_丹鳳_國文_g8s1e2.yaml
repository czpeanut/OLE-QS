  stem: 下列〈我在圖書館的一天〉文意的解讀，何者不正確？
  options:
  - label: A
    content: 「人和書很近也很遠。近的是，書隨意可得；遠的是，美麗的風景常讓我分心，因而忘書」：圖書館內眾多藏書唾手可得，此刻與書的距離很近
  - label: B
    content: 「午後的陽光被裁切成幾何圖案，讀書人此時晒書也晒心」：「晒心」說明沐浴陽光下，更覺心曠神怡
  - label: C
