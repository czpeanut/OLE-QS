  section: 3
  number: 4
  type: single
  page: 1
  stem: 下列有關「鬼」的成語，何者運用不當？
  options:
  - label: A
    content: 胖虎常「裝神弄鬼」地惡作劇而被媽媽責罰
  - label: B
    content: 小杉因為「鬼迷心竅」而落入詐騙集團的圈套
  - label: C
    content: 歹徒的行蹤「鬼斧神工」，令警察難以捉摸
  - label: D
    content: 小夫雖只是個孩子，但「人小鬼大」，機靈得很。
