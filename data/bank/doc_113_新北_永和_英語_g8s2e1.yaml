  section: 2
  number: 57
  type: single
  page: 6
  stem: 57. What does “provenance” mean in the reading?
  options:
  - label: A
    content: The ways companies can use to save more money.
  - label: B
    content: The story of making products famous.
  - label: C
    content: The ways to protect labor in poor countries.
  - label: D
    content: The story behind the making of something.
  group_stem: "D. (57~59)\n      How do you choose a T-shirt when you’re shopping?\
    \ Its price, its brand, or how it looks on you? Do you know what\nit may take\
    \ to make a T-shirt?  Did you ever think it may come from a so-called “sweatshop”?\n\
    \      Let’s take a famous brand many people love, Nike, as an example. In the\
    \ 1970s, Nike's shoes were mostly made in\nSouth Korea and Taiwan, with some factories\
    \ still in the United States. However, in 1984, the $5.2 billion dollar Nike\n\
    Corp. closed its last U.S. factory and moved all its production to the countries\
    \ in Asia, such as Indonesia, China, and\nVietnam. They did so because of cheaper\
    \ labor and the lack of laws to protect labor. Workers at Vietnam Nike shoe\n\
    factories made $1.60 per day but they had to spend $2 on three meals a day, meaning\
    \ that they even didn’t have enough\nmoney to live. What’s more, workers were\
    \ not allowed to go to the bathroom more than once per eight hour shift, and\n\
    they couldn’t drink water more than twice per shift.\n      When people heard\
    \ about the workers in poor countries working day and night on little pay, they\
    \ felt worried their\nclothes were from factories of this kind. The provenance\
    \ of clothes became a more important factor to decide what to\nbuy. Some brands\
    \ of clothes started to move their factories back to their home countries. There\
    \ the cost of making clothes\nwas higher, but the working conditions were friendlier\
    \ to the workers.\n      Next time you are buying a T-shirt that feels good on\
    \ your body, you may want to learn its story and see if it also feels\ngood in\
    \ your heart.\n brand 品牌  sweatshop 血汗工廠   labor 勞工；勞力   lack 缺乏   shift 輪班 \
    \  if 是否   factor 因素"
