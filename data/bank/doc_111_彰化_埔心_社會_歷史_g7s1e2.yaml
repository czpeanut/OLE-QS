  section: 1
  number: 7
  type: single
  page: 1
  stem: 市政府舉辦臺灣古籍展，其中有109 件的「番仔契」，內容包含有新港社(新港文書)的87 件，包括21 件的漢番對照，以及卓猴社的3 件(卓猴文書)；麻豆社16件(麻豆文書)及大武壠社1
    件（大武壠文書)；下淡水社1 件(下淡水文書)及茄藤社1 件(茄藤文書)。關於這個展覽的解讀，下列何人說法正確？
  options:
  - label: A
