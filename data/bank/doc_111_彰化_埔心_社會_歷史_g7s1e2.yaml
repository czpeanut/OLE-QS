  stem: 全臺唯一的施琅廟(施公祠)，位於澎湖天后宮旁，已有三百多年的歷史，施公祠旁的一口井被稱為萬軍井，提供當年施琅攻臺期間軍隊駐紮澎湖時的飲用水。關於施琅的事蹟，下列敘述何者錯誤？
