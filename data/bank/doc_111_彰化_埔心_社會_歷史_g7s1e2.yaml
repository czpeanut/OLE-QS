  section: 1
  number: 2
  type: single
  page: 1
  stem: 在荷蘭、西班牙、鄭氏政權統治的範圍內，原住民的生活及文化都受到很大的衝擊。在原漢不斷的衝突中，原住民爆發了多次的抗官事件，例如：鄭氏在臺時期，曾有中部原住民族以武力反抗其統治。請問：這是指哪一個原住民族群？
  options:
  - label: A
    content: 大肚王勢力
  - label: B
    content: 西拉雅族
  - label: C
    content: 麻豆社
  - label: D
    content: 新港社。
  answer:
