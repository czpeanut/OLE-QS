- id: doc_113_高雄_七賢_英語_g9s2e2_s2_34
  section: 2
  number: 34
  type: single
  page: 4
  stem: What is this reading most likely to be?
  options:
  - label: A
    content: A story about a poor boy becoming a rich young man.
  - label: B
    content: A letter to a school library about a famous novel.
  - label: C
    content: A school report about a famous Charles Dickens book.
  - label: D
    content: A newspaper story about a long-forgotten library book.
  group_stem: 'Clearing the Books After 119 Years

    by R.E. Porter

    Toowoomba Grammar School is the largest school in the town of Toowoomba, Australia.
    In 1903, Arthur Lamb, a student there, decided to borrow a book from the school
    library. The book he borrowed was Great Expectations, a famous 1861 novel by the
    English writer Charles Dickens. This was Dickens’s thirteenth novel, and it tells
    the story of a poor orphan boy named Pip. He grows up in the home of his older
    sister and her husband, Joe. However, Pip’s life changes a lot when a rich person
    gives him money, so he can live as a gentleman in London. Since he doesn’t know
    who gave him the money, it’s a big surprise when he later finds out. The story
    keeps readers wondering what will happen to Pip and how his life will turn out,
    which makes the book so interesting.

    Arthur Lamb must have liked the book a lot because, surprisingly, he never returned
    it! In fact, he likely put it away with his other things.

    Fast forward to 2022, when the Lamb family was going through a box full of their
    grandfather’s old things. Among them, they found a copy of Great Expectations.
    Even though the book was over a hundred years old, it still looked in good shape.
    Another surprise was that the book didn’t actually belong to Grandpa Arthur. It
    was, in fact, a school library book that had been "overdue" for 119 years!

    As they say, it’s never too late. Arthur Lamb’s grandson, John Lamb, finally returned
    the overdue copy of Great Expectations to the Toowoomba Grammar School library
    last week. Although the Lamb family had to give up such a special book, they are
    now, at last, back in the library''s good books!

    📖 forward 前進 orphan 孤兒 gentleman 紳士'
