  group_stem: 'The University of Oxford

    The University of Oxford is one of the best universities in the UK and the world.
    It is nearly a thousand years old and has many famous graduates, including leaders,
    writers, and actors. Every year, many people visit Oxford because it is beautiful
    and has a lot of history. Some places in the university are even in Harry Potter
    movies!

    Oxford has many special traditions. Even though some are very old, they are still
    important to student life today. For example, classes at Oxford start at five
    minutes past the hour, unlike most universities that begin on the hour. Students
    must also wear formal black and white clothing for their final exams. Many wear
    special white ties or bows and carry black caps. They bring these caps to every
    exam, but they usually don''t wear them on their heads until they graduate.

    Another tradition is called "trashing." This happens after final exams when students
    celebrate their graduation by throwing things at each other. Friends often throw
    shiny paper or food and drinks. On exam day, you might see students covered in
    honey, soda, milk, and even cold noodles! Even though they wear nice clothes,
    they don''t mind the mess. However, some people think "trashing" is too messy,
    so it might not last forever. Not all traditions can stay the same as time goes
    on.

