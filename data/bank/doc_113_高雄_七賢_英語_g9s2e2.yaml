  group_stem: 'What''s Raining from the Sky?

    Have you ever heard someone say, "It''s raining cats and dogs"? Well, here’s a
    true story about animals falling from the sky — not cats or dogs, but frogs.

    It happened one day in March 1998 in the town of Croydon, near London. A woman
    called the local office to report something strange. She said she had found hundreds
    of dead frogs all around her house. She explained that it had rained early that
    morning, and the wind was very strong. The rain sounded different than usual,
    so she opened her window to take a look. To her surprise, she saw hundreds of
    dead frogs on the ground. "These frogs don’t look like the ones from around here,"
    she said. "They are a different kind."

    This was not the first time such an event had happened. In fact, "frog rain" has
    been reported many times in different parts of the world. Experts believe that
    "frog rain" happens because of something called a waterspout. A waterspout is
    a type of tornado that forms over bodies of water, such as the sea, lakes, rivers,
    or ponds. When a waterspout forms, it can pick up small animals, including frogs,
    from the water. The waterspout then carries them high up into the air, sometimes
    for hundreds of miles, before dropping them in a different place.

    Scientists say that this event is rare, but it does happen from time to time.
    The animals that are caught by the waterspout are often small and lightweight,
    so they can be carried long distances by the wind. While "frog rain" is strange,
    it is not the only time animals have fallen from the sky. There have been reports
    of fish, birds, and even spiders raining down in different parts of the world.
    All of these events are caused by strong winds or tornadoes that can pick up and
    carry small creatures before letting them fall back to the ground.

    📖 waterspout 水龍捲風 form 形成 Paragraph 段落 creatures 生物 tornado 龍捲風'
