  section: 1
  number: 4
  type: single
  page: 1
  stem: 人口紅利是當一地某一個時期內出生率下降，且老年人口未達高比例，形成勞動力資源相對豐富、扶養負擔相對較輕，有利於國家經濟發展的黃金時期。通常扶養比小於50%，即為人口紅利時期。請問：圖(二)哪個年段為臺灣的人口紅利時期？
