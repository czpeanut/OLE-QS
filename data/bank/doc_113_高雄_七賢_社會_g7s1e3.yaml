  stem: '天氣變化主要受到大氣流動的影響，圖(七)為氣壓與風向的示意圖，有關圖中甲、乙兩者的敘述，下表中哪一項資訊正確？


    | | (A)氣壓特性 | (B)氣溫高低 | (C)天氣狀況 | (D)空氣狀況 |

