  stem: '一位西方古代的人物，每天總是在街上市集，人們聚集的地方，與願意和他交往的人討論生死與人生的意義等各種問題，他總是讓別人多說些，偶而從中插入問題或批評，然而他總是主導討論，使之順利進行頗見效果。他的這種對話，幾乎都是一問一答，以鋒利的問題激發對方的思想，從而加以矯正、駁斥或發展。

