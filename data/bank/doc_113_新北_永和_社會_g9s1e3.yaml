  stem: 黃男、鄭男、顏男三人組成詐騙集團，成立投資群組，聲稱代客操作股票、短期便可取得高額獲利，誆騙被害人使用假投資軟體，待款項入帳後便提領一空，直到被害人要拿出獲利時才驚覺上當受騙。民眾報警後，警方成立專案小組多日跟監，將三人一網打盡，當場查獲作案手機、電腦、提款卡等罪證，粗估詐騙金額高達2
    億元，全案訊後依詐欺罪移送偵辦。請問，有關刑事訴訟程序，下列敘述何者正確？(B4Ch4)
  options:
  - label: A
    content: 警察根據犯罪偵查結果，以詐欺罪提出公訴
  - label: B
    content: 判決確定前，依「罪刑法定原則」推定為無罪
  - label: C
    content: 被害人也可委任律師後，向檢察官提出自訴
  - label: D
    content: 判決確定後，交由檢察官負責指揮執行該判決。
