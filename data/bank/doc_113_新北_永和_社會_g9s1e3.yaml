  group_stem: '◎請根據選文，回答第18-20 題: (L4)

    「玉米」最早是由中南美洲的印地安人培育出的糧食作物。古印加文明中的大地之母，她的兩個化身，一個為馬鈴薯女神，另一個即為玉米女神。許多中南美洲的傳說故事，都描述人是由玉米做成的，因此古文明的人民十分崇敬玉米，甚至當成供品祭祀神明。在15
    世紀歐洲人抵達美洲殖民後，也將玉米帶到歐洲，並廣泛傳播。

    中美洲的瓜地馬拉，甚至訂定了國定玉米日，當天會舉辦祭拜玉米神的各種儀式，這些儀式融合了殖民時期的宗教元素，呈現多元的文化色彩，此傳統慶典也被聯合國認證為瓜地馬拉的非物質文化遺產。'
