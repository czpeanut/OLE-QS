- id: doc_113_新北_永和_社會_g9s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 新聞報導：「2024 年美國總統大選結束，當選人川普宣布上任後，將對墨西哥和加拿大商品徵收25%關稅。而一旦課徵關稅的政策開始啟動，很可能會重創全球供應鏈，特別是臺灣製造業，將面臨重新調整布局的壓力。尤其許多臺廠近期剛在墨西哥設廠，因應關稅政策，可能得加速美國在地化生產計劃。」以下對於此篇新聞的解讀，何者正確？(L4)
  options:
  - label: A
    content: 川普可能會修正美墨加協定的內容
  - label: B
    content: 課徵關稅的國家僅限於北美洲國家
  - label: C
    content: 墨西哥擁有豐富礦產吸引外資設廠
  - label: D
    content: 此政策有可能會提高美國的失業率。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
