  group_stem: '題組一：請根據以下資料回答28~29 題(L6)

    資料一 伽利略：「上帝在聖經中所欲啟示人類的，是如何上天堂，不是天體如何運行。」

    資料二 馬丁路德：「所以現在是這樣一個情況。誰想要聰明就得反對大眾認為的事情。他必須有自己的東西。這正是『那個傢伙』所做的事情，他想把整個宇宙顛倒過來。儘管在這些陷入混亂的事情中，我依然相信聖經，因為約書亞命令太陽靜止不動，而不是地球！」

    資料三 《天體運行論》：「是的，尊敬的教皇陛下，我已經獲得了莫大的勇氣，將自己花費了巨大心血研究出來的結果公諸於世，並毫不猶豫地用書面形式陳述它。或許，您大概想聽我談談，我怎麼會完全否定那些天文學家的論點，甚至違背常識，而假設地球正在它預定的軌道上漫步呢？」'
