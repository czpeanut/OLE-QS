  stem: 陳男駕車違規迴轉，後方林女所騎機車反應不及摔車，(甲)雙方達成共識，約定20 萬元和解，結果陳男後續各種藉口不支付，(乙)雙方決定聲請調解由第三人居中協調。請問，關於畫底線處，下列敘述何者正確？(B4Ch2)
  options:
  - label: A
    content: 若陳男未遵守(甲)，林女可以聲請強制執行
  - label: B
    content: (甲)又稱訴訟上和解，是在法官面前達成協議
  - label: C
    content: (乙)調解成立後，效力與法院確定判決相同
  - label: D
    content: (乙)的第三人是指法官，做出的判決具強制力。
