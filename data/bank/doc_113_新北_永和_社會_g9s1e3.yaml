  stem: 美國國家籃球協會(簡稱NBA)是一個男子職業籃球組織，每年的11 月至隔年4 月舉辦的比賽為例行賽，NBA 在臺灣也擁有廣大的球迷，但因為時差的關係，臺灣的觀眾常需要熬夜或早起觀看同步轉播。球季中，若臺灣球迷想在臺灣同步觀看轉播比賽，而每場球賽開賽時間均為晚上八點，請問圖八中哪一個城市當天開始時間最晚?
