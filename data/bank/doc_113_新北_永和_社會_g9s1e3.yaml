    資料二 美國《獨立宣言》：「我們認為下面這些真理是不證自明的：人人生而平等，造物主賦予他們若干不可剝奪的權利，其中包括生命權、自由權和追求幸福的權利。為了保障這些權利，人們才在他們之間建立政府，而政府之正當權力，則來自被統治者的同意。任何形式的政府，只要破壞上述目的，人民就有權利改變或廢除它，並建立新政府。」'
