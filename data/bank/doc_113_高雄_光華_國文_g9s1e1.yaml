  type: single
  page: 8
  stem: 文中於成龍至高郵時，遇見什麼案件？
  options:
  - label: A
    content: 地方豪強恃強凌弱
  - label: B
    content: 強盜穿牆殺人越貨
  - label: C
    content: 夫妻失和暴力相向
  - label: D
    content: 財主家中嫁妝失竊。
  group_stem: '(七)

    於中丞成龍按部（１）至高郵。適巨紳（２）家將嫁女，妝奩（３）甚富，夜被穿窬（４），席捲而去。刺史無術（５）。公令諸門盡閉，止留一門放行人出入，吏目（６）守之，嚴搜裝載。又出示，諭闔城戶口各歸第宅（７），候次日查點搜掘，務得贓物所在。乃陰（８）囑吏目：「設有城門中出入至再（９）者，捉之。」過午得二人，一身之外，並無行裝。公曰：「此真盜也。」二人詭辯不已。公令解衣搜之，見袍服內著女衣二襲（10），皆奩中物也。蓋恐次日大搜，急於移置，而物多難攜，故密著而屢出之也。

    （蒲松齡 聊齋志異．於中丞）

    【注釋】（１）按部：巡查屬下州縣。（２）巨紳：大財主。（３）妝奩：嫁妝。（４）穿窬：穿壁越牆。窬，音ㄩˊ。（５）術：方法、策略。（６）吏目：職官名，掌管緝捕盜賊、防獄囚等事。（７）第宅：住家。（８）陰：暗中。（９）再：兩次。（10）襲：量詞。衣裳一套叫一襲。'
