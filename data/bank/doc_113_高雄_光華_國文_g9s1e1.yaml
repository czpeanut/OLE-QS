  stem: '四位古代的詞人在天堂得以跨年代聚會，以下是他們的自我介紹，依照對話內容依序分別是什麼人？

    甲：「我啊，擅長繪畫、精通音律，本過著逍遙日子，大多寫宮廷歡樂生活。怎奈，我被俘虜，甚至喝下那可惡小人賜的酒。我想你們都看過我後來哀怨淒絕的作品吧。」

    乙：「我家父子三人都頗有名，我詩、詞、書、畫樣樣精通。只因我耿直敢言，得罪了人，一生被貶謫多次，最遠還被貶到海南島。你們都沒去過吧？」

    丙：「我是婉約派的代表人物之一，如夢令當中『知否？知否？應是綠肥紅瘦』，是我廣為人知的句子。」

    丁：「人家給我封號叫『愛國詞人』，我也想有一番作為，怎知朝廷只是妥協苟安，我真是抑鬱不得志啊！」'
