- id: doc_113_高雄_光華_國文_g9s1e1_s2_3
  section: 2
  number: 3
  type: single
  page: 5
  stem: 根據本文及下圖，文中缺空處應填入下列何者最恰當？
  options:
  - label: A
    content: 東
  - label: B
    content: 西
  - label: C
    content: 南
  - label: D
    content: 北。
  group_stem: "(二)\n    這一條祕密的鐵軌只有我知道，它通往想像的銀河。而想逃的意念從來沒有斷絕過，生活總是在他方。但有時它也會和現實世界的具體畫面合而為一，於是我總是離開家，背著小背包，就從北投站跳上一列北淡線的火車，然後一直往後走，往後走。\n\
    \  我們不喜歡往臺北城的方向去，而是要一路向□，往島嶼邊緣大海和山的盡頭，好像從那兒就可以漂流出海，一直流到看不見的地平線之外。於是我們在車廂中跌跌撞撞地往後走，慢車一向搖晃得非常厲害，發出哐啷哐啷的聲響，全身的機械螺絲和零件都快要散開來似的，我們就這樣走過了一節又一節的車廂。因為這裡已經是北投了，遠離市中心，而大多數搭火車通勤的人，也都早在士林和石牌下車了，再過去，就是復興崗、關渡、竹圍和淡水，火車上幾乎沒剩下多少乘客，全成了我們的天下。\n\
    \  車廂內墨綠色的兩排座椅大半是空蕩蕩的，如果上面坐著人，也多是些孤零零的老人，默默地瞪著窗外的景色發呆，要不然，就是一些頭戴斗笠的農夫，他們的腳旁放著一支扁擔，兩端的竹簍裡塞滿了綠色的青菜。那些青菜都是剛從田裡拔出來的，一片片蓬勃深綠的葉子舒展開來，溢滿了整個簍筐。我們一走過去，葉子的邊緣輕輕擦過腳踝，就把那一股淡淡的泥土腥味和潮溼的青菜味，全都留在我們身上了，一直等我們走到了車尾，都還聞得到它。\n\
    \  是的，我們聞得到它。那溼潤的黑色土壤，蒼綠色的草山，隨著海風依稀飄散的硫磺味，以及紅樹林的沼澤，淡水河口白茫茫的煙霧、沙灘以及大海。這一列火車從臺北城出發，穿過了綠色的平原，貼著山巒前行，一路就來到了河口的出海處。它的車身沾滿了一路上的氣味。我聞得到它。這是一列如今已經消失了的，但卻還一直留在我鼻腔深處的北淡線。\n\
    （節選自郝譽翔 溫泉洗去我們的憂傷．青春的北淡線）"
