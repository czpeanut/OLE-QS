- id: doc_113_高雄_光華_國文_g9s1e1_s2_9
  section: 2
  number: 9
  type: single
  page: 7
  stem: 根據本文，下列情境中的角色，何者最可能被「公布名字」？
  options:
  - label: A
    content: 被驗出含有農藥成分的知名手搖飲料店
  - label: B
    content: 參加教育會考時被現場抓到作弊的學生
  - label: C
    content: 上網給某餐廳誇大的負面評價的消費者
  - label: D
    content: 在禁止飲食的捷運上喝珍珠奶茶的乘客。
  group_stem: "(四)\n    金榜題名，眾所皆知，是光榮的事。以前學生被記過或申誡，會公布姓名，懲罰外或許還有殺雞儆猴的意味。但現在隱私權意識抬頭，加上學校教育的目的，應該是輔助並導正學生的作為，即時給予正確的指引及扶助。因為犯錯就永遠給人貼標籤，彷彿獵巫的作法，真的好嗎？\n\
    \  「可是像是拍賣網站被評為劣等的賣家，不公布他的名字，我們這些買家就很吃虧啊！」妹妹上次網購買到假的ＢＴＳ簽名海報，忿恨難消。\n  那麼，如果是政府依據法令，將違法做錯事的公司名字公布出來，大家看了會怎麼想呢？\n\
    \  「應該就是被認證過的差勁吧！」哥哥義正詞嚴。\n  將名字公布出來，好事傳千里，是一種榮耀。相反地，若將個人或公司做的違法事蹟公布，屬於一種懲罰，在行政罰法上，稱作「影響名譽之處分」。\n\
    \  最常見就是，勞工明明有加班，公司卻苛扣加班費不發；或者是投標的廠商，利用不當方式得標。這些公司，除了會被主管機關依據法令處罰鍰之外，還會被「公布姓名」（勞動基準法第８０條之１），或者「刊登政府採購公報」（政府採購法第１０２條第３項）。\n\
    \  這些違法廠商被公布姓名，就不只是道歉就沒事了。它可能會被列入黑名單，相當期限內不能再參加投標，生意就做不成了啊！或者是因此喪失某些優良廠商的認證標籤，本來有的生意也會流失的。\n\
    \  「就像你們在找餐廳，會先搜尋一下網路評價，」爸爸說：「在找工作的時候，也會先去探聽這家公司的風評。」弔詭的是，網路的評價雖說是消費者累積起來的，大家幾乎都會拿來參考，但有時仍會有消費者灌水或者惡意的評價，千萬要注意。\n\
    \  再例如某建築工地，因為安全設備設計不良，在蓋屋時候屢屢發生工人傷亡事件，經過政府公告，消費者會去買這個房子嗎？現在雖然強調「實價交易」，房屋的買賣價格都有登記可查，那麼攸關建築物的建築過程安全問題，是不是比價格更重要呢？如果連基本的安全措施都沒注意，可以期待這間廠商蓋的房子夠穩固嗎？\n\
    \  政府部門電子資訊網站，幾乎都有建置，分門別類，依照管理事項而有查詢的連結。當然還有一些認證標籤，例如優良食品、檢驗合格證等等，其實就是給予消費者安心，用簡單易懂的標示讓大家明瞭，這也是政府守護人民的責任。食衣住行，只要是好的廠商，通過認證或聲請合格，就得到讓消費者信任的標章，彼此安心。對於不良的企業商家，也該給予合理的處罰或公布，才不會劣幣驅逐良幣啊！\
    \        （張瑜鳯 你的名字）"
  tags:
    chapter:
      publisher: 南一
