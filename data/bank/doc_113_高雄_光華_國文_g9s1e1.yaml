- id: doc_113_高雄_光華_國文_g9s1e1_s2_1
  section: 2
  number: 1
  type: single
  page: 4
  stem: 根據本文，關於李白與杜甫的敘述，下列何者正確？
  options:
  - label: A
    content: 兩人初識，是在李白官場得意之時
  - label: B
    content: 兩人相識時，在名聲上有很大的差距
  - label: C
    content: 都曾在彼此被流放時，寫信關懷對方
  - label: D
    content: 李白讀了杜甫的詩後，深受杜甫的情誼所感動。
  group_stem: "(一)\n    詩仙李白、詩聖杜甫，是唐代知名且偉大的詩人，兩人之間曾有過交往，有相當深厚的交情。\n  他們認識的時候，李白剛因楊貴妃作梗（１），只被視為一個「御用詩人」，不得一展抱負。他自知無法久留朝中，因此自請歸山。而杜甫，則因科考落第，四處遊歷，才在洛陽與李白相遇。論年齡，李白比杜甫大十一歲。論聲望，杜甫那時才剛剛出道，尚未為人所知，他真正「成名」也不在生前，而在死後，但李白當時已經「詩名滿天下」。對杜甫來說，可以說是見到心中的「神」級「偶像」了。\n\
    \  朋友之間論交，在彼此青雲（２）得意的時候，不能作準（３）。平時也還一般，難能可貴的是在對方失意，甚至窮途末路時的關懷。杜甫的〈夢李白〉和〈天末懷李白〉，都寫於聽說李白因罪而流放夜郎的時候，那時的李白，已成了罪犯逐臣（４），鬧不好，杜甫也可能被牽累。\n\
    \  不知道李白是否讀過杜甫的這幾首詩，如果讀到，他大概會感激涕零（５）了，在他跌落人生低谷時，還有這樣一位真心關懷他的朋友。\n（改寫自樸月李白與杜甫的交誼）\n\
    【注釋】（１）作梗：從中阻撓，使其不得進行。（２）青雲：此指地位顯要。（３）不能作準：不能算數。（４）逐臣：被貶謫放逐的臣子。（５）感激涕零：感激得涕淚俱下。形容非常感謝的樣子。"
