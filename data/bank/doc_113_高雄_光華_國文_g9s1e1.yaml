- id: doc_113_高雄_光華_國文_g9s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '蚯蚓對於農地的貢獻可分為兩個層面：一個是蚯蚓的進食與排放，促進有機質的「礦化」作用，幫助有機質被分解成更小的形式，更容易被植物吸收。第二個層面是牠會在土中鑽洞，製造土壤裡面的隧道和孔隙、粉碎板結的土塊，改善土壤的通氣和排水，也就是改善了土壤的物理性質，對根系發展很有幫助。蚯蚓讓土壤肥沃鬆軟，但牠最怕：農藥、過量施肥、犁田、鋪抑草蓆。

    依據上文，下列敘述何者正確？'
  options:
  - label: A
    content: 花園植栽土裡若有看到蚯蚓群居，表示這塊土壤並未受到大量農藥或化學肥料的干擾
  - label: B
    content: 蚯蚓在土中鑽洞，大量製造土壤裡面的隧道和孔隙，會讓鬆動的土質難以保持含水量
  - label: C
    content: 蚯蚓會間接破壞土壤的物理性質，因此，春耕時可以使用機械犁田減少蚯蚓的繁殖
  - label: D
    content: 蚯蚓造成土壤的「礦化」作用，會讓土壤凝結成塊無法吸水，此時可鋪草蓆抑制蚯蚓鑽洞。
  tags:
    chapter:
      publisher: 南一
      book: 九上
      subject: 國文
      code: 第四課
      title: 黑與白─虎鯨
      chapter: null
    textbook: 九上 第四課 黑與白─虎鯨
    labeled_by: ai
  ai_answers:
    gemini: A
    qwen: A
  answer:
  - A
