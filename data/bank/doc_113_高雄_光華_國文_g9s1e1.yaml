  group_stem: "(三)\n    人君一話一言不宜輕發，況於詔令形播告者哉！漢光武初即位，既立郭氏為皇后矣，時陰麗華為貴人，帝欲崇以尊位，後固辭，以郭氏有子，終不肯當。建武九年，遂下詔曰：「吾以貴人有母儀之美，宜立為后，而固辭不敢當，列於媵妾（１）。朕嘉其義讓，許封諸弟。」乃追爵其父及弟為侯，皆前世妃嬪所未有。至十七年，竟廢郭后及太子強，而立貴人為后。蓋九年之詔既行，主意移奪，已見之矣。郭后豈得安其位乎？\n\
    （洪邁 容齋隨筆）\n【注釋】（１）媵妾：除了皇后以外的姬妾。媵，音ㄧㄥˋ。"
