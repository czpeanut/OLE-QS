- id: doc_113_新北_福和_國文_g7s1e2_s3_5
  section: 3
  number: 5
  type: single
  page: 1
  stem: 在中國古代避諱直說「死亡」，因此常用一些委婉的近義詞來表達。請問下列選項中的詞語，何組皆是「死亡」的婉曲用語？
  options:
  - label: A
    content: 與世長辭／日薄西山／風中殘燭
  - label: B
    content: 蒙主寵召／駕鶴西歸／撒手人寰
  - label: C
    content: 煙消雲散／一命嗚呼／眼穿腸斷
  - label: D
    content: 奄奄一息／病入膏肓／壽終正寢【綜合】
  tags:
