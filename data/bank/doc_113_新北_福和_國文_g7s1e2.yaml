  group_stem: '（甲）

    　　20 世紀初，數學界曾出現過一道叫人頭疼的難題，就是2 的67 次方減1 到底是不是人們猜想的質數。1905 年，在紐約的數學學會上，英國數學家科爾通過一番令人信服的運算論證，成功破解了這一難題，取得了出類拔萃的成果。有人問科爾：「您論證這個課題前後共花了多少時間？」科爾回答：「三年內的全部星期天。」多麼振聾發聵的聲音！正是「星期天」這個人人皆有的業餘時間，被科爾充分利用起來，從而成就了一位卓越的數學家。愛因斯坦說：「人的差異在於業餘時間，『業餘時間』生產著人才，也生產著懶漢、酒鬼、牌迷、賭徒。」時間最珍愛愛惜它的人們。聲色犬馬、碌碌無為，時間就會從你的身邊悄悄溜走；不斷學習，充實自己，你就會覺得時間在有意為你放慢。

    改寫自郭冬仙〈人的差異在於業餘時間〉

