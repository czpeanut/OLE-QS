- id: doc_113_新北_福和_國文_g7s1e2_s3_4
  section: 3
  number: 4
  type: single
  page: 1
  stem: 成語是長期文學精華的濃縮，簡單數個字，就可以傳達豐富的意涵，收畫龍點睛之效。下列各組文句，「　」內成語運用適當的選項是何者？
  options:
  - label: A
    content: 一聽說自己的作品獲得全國藝文競賽冠軍，他內心不禁「躊躇滿志」
  - label: B
    content: 有懼高症的她，只要站在稍微高一點的地方，就會覺得「嘆為觀止」
  - label: C
    content: 馬戲團空中飛人的特技十分刺激，觀眾看得屏氣凝神，「驚世駭俗」
  - label: D
    content: 面對大家不斷的謾罵指責，他「肝腦塗地」，忍不住發了一頓脾氣【綜合】
  tags:
