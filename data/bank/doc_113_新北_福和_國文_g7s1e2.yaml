  group_stem: "國立故宮博物院、巴黎裝飾藝術博物館，與Van Cleef & Arpels 梵克雅寶 攜手合作，於2024 年9 月26 日至12 月29\
    \ 日在台北國立故宮博物院，以及2025 年1 月23 日至4 月20 日在嘉義國立故宮博物院，聯合呈獻「大美不言」典藏特展。展覽主題源自道家思想大師莊子的名言，意指大自然中有一些無法言喻的美。\n\
    \    展覽分為五大主題：自然萬物、動靜有形、奇幻仙境、神祕莫測與五彩繽紛，匯集三方逾260 件珍品，將東西方工藝技術的融合展現得淋漓盡致，詮釋了大自然令人屏息的美感。展場設計上，日本建築師田根剛透過沉浸式的舞台設計，營造詩意且具穿越時空富體驗感的氛圍。\n\
    \    展覽由三方精選的主打作品拉開序幕，包括故宮院藏〈清 乾隆 洋彩玲瓏轉旋瓶〉由頸部、腹部、內瓶及底座組成，各部件層層套疊，內瓶描繪五彩祥雲和紅色蝙蝠，瓶腹鏤空彩繪兩對口銜蓮花和靈芝的雙龍紋。當轉動瓶頸時，內瓶隨之旋轉，饒富趣味。巴黎裝飾藝術博物館館藏〈布洛瓦帶蓋長頸壺〉，由法國著名塞弗爾瓷器廠與多位藝術家共同製成，是19\
    \ 世紀法國奢華工藝的經典。壺柄上方雪白的天使雕塑出自名家奧古斯都．羅丹的作品，壺身底色和堆花裝飾技術，則源自亞洲陶瓷工藝。Van Cleef & Arpels的經典前衛之作〈Zip〉項鍊，靈感來自飛行外套和軍服拉鍊，巧妙運用流蘇式拉鍊，拉開時可作為項鍊，拉合時則轉換為手鍊，綴飾金絲、寶石和鑽石，展現作品多變的形式與創意。\n\
    \    美麗的東西不需要太多話語去解釋，作為故宮博物院100 週年系列的活動，歷時7年準備，「大美不言Beauty Speaks for Itself」大展作品即使是不同時代背景下的創作，仍各自展現不言自證的臻美姿態。\n\
    票價資訊：\n◾️ 外籍人士普通參觀券NT$350 \n◾️ 外籍團體參觀券NT$320 （10 人以上團體）\n◾️ 國人優惠參觀券NT$150 （個人、團體票價均相同）\n\
    1、國人憑身分證件\n2、持中華民國外僑永久居留證者\n3、持國際學生證者\n◾️ 免費券（出示證件）\n1、年齡未滿18 歲者（不分國籍）\n2、65 歲以上者（本國籍）平日免費\n\
    3、身心障礙者及其陪同者一人（不分國籍）\n4、本國學生（持「教育部立案學校有效學生證」者）\n＊租用語音導覽系統，每人另加收系統租金30 元\n　　　　　　　　　　　　　　　　　　　　　　　　　　整理自國立故宮博物院官網"
