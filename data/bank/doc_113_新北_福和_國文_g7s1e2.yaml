- id: doc_113_新北_福和_國文_g7s1e2_s4_26
  section: 4
  number: 26
  type: single
  page: 3
  stem: 「要在非洲活下來，目前數量超過十萬隻的長頸鹿，已練就了多項本事。」下列何者不是長頸鹿為了生活練就出的本事？
  options:
  - label: A
    content: 每天總共只睡三分鐘
  - label: B
    content: 真想趴著睡時也保持隨時警戒的狀態
  - label: C
    content: 能睜著眼睛睡
  - label: D
    content: 怕影響逃生通常站著打瞌睡【自學二】
  group_stem: "「長頸鹿只睡三分鐘！」非洲嚮導說。長頸鹿的每次睡眠時間非常短，而且是站著睡覺。在物競天擇的萬年演化，在獅子、豹子環伺的非洲叢林裡，敢大搖大擺睡覺的長頸鹿已變成獅子的腹中物。根據研究，長頸鹿的睡眠時間是所有哺乳動物中最短，一天平均睡眠總時間低於兩小時。牠們通常站著打瞌睡，長長的脖子往下垂或掛在樹梢，真想趴著睡時，也會呈現奇特的睡姿，為的是在緊急情況下能一躍而起。不只如此，長頸鹿還能睜著眼睛睡覺。\n\
    要在非洲活下來，目前數量超過十萬隻的長頸鹿，已練就了多項本事。相較之下，獅子每天能睡十五至二十個小時，沒人能拿牠如何，這就是叢林法則。如果你無法成為叢林之王，就要是永不鬆懈的長頸鹿。你只有三分鐘睡眠，完全沒有貪睡的權利，貪睡的下場，就是出局。大自然的草食性動物平均睡眠時間都比肉食性動物短。\n\
    \    職場與商場上，不也是如此。生命原本就是一個選擇，當獅子未必好，當長頸鹿未必差，只要一切恰如其分。想擁有權力、想主導棋局的獅子，能力就要相當，也要願意承擔。人生最可怕的是，錯置。所謂錯置，就是搞不清楚自己是誰或想成為什麼樣的人，沒有獅子的能力、地位，卻想過獅子的生活。\n\
    \    獅子有獅子的得失，何必羨慕牠一天可睡十五小時？有人想當叢林之王，碰到獵物(問題)卻搞不定。相對的，我也看過很多平凡但可愛的小人物，認分與踏實，當一隻長頸鹿就像長頸鹿。\n\
    　　　　　　　　　　　　　　　　　　　　　　　　　　　改寫自〈貪睡的長頸鹿〉"
