- id: doc_113_新北_福和_國文_g7s1e2_s3_7
  section: 3
  number: 7
  type: single
  page: 1
  stem: 下列「　」中的詞語，何組意思前後相同？
  options:
  - label: A
    content: 金旼炡「說話」總是輕聲細語，沒想到歌聲竟如此宏亮／這件事不管再怎麼悉心處理，總還是有人會「說話」
  - label: B
    content: 用「料理」照顧下班後的疲憊，吃得好就是對身心的慰藉／我這樣大年紀的人，難道還不能「料理」自己嗎
  - label: C
    content: 他揮霍無度又不思進取，家中「光景」一日不如一日／春回大地，天氣風和日麗，自然「光景」也煥然一新
  - label: D
    content: 使用第二外語時，常常語言影響思考，嘴巴「左右」大腦／要有自己的判斷力，不能被他人的意見所「左右」【綜合】
