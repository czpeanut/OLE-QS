- id: doc_113_新北_福和_國文_g7s1e2_s3_6
  section: 3
  number: 6
  type: single
  page: 1
  stem: 語言和文字會隨著時代而演變，因此有時所指稱的事物相同，但古今用語卻不同。如「腳夫」就是「搬運工」的意思。金枝利正在練習古今用語辨識。下列「　」中的用語經替換後，何者意思相同？
  options:
  - label: A
    content: 新郎是世家子弟，「新娘」是名門閨秀，兩人結為連理，可說是天作之合──紅娘
  - label: B
    content: 他家境艱困，繳不起「學費」，同學們知道後幫忙募款，才使他免於輟學──盤纏
  - label: C
    content: 「法醫」常觀察屍體僵硬度、斑點、溫度、胃內消化物等，推斷死亡時間──仵作
  - label: D
    content: 賴清德「總統」接受專訪，針對外交、兩岸政策等議題，回應媒體提問──百里侯【綜合】
  tags:
    chapter:
      publisher: null
      book: 七上
      subject: 國文
      code: null
      title: null
      chapter: null
    textbook: 七上 第2次段考範圍
