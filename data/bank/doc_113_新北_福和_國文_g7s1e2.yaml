- id: doc_113_新北_福和_國文_g7s1e2_s3_10
  section: 3
  number: 10
  type: single
  page: 2
  stem: '子畏於匡，曰：「文王既沒，文不在茲乎？天之將喪斯文也，後死者不得與於斯文也。天之未喪斯文也，匡人其如予何？」

    　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　（論語 子罕篇）

    注釋

    畏：圍禁拘留。

    沒：通「歿」，去世。

    文：傳承文化道統的文章典籍。

    茲：此。孔子指著馬車裡的文章典籍，表示自己隨時學習與努力實踐，擔負傳承文化道統的責任。

    將：如果。

    喪：失去。

    斯：同「茲」，皆指這些文章典籍。

    後死者：孔子稱自己是比文王後死的人。

    與：參與，意思是周文王傳下的文章典籍，自己可以學習、研究與實踐。

    予：我。

    　下列文句，最適合說明上文主旨的是何者？'
  options:
  - label: A
    content: 文化的傳承不在典籍，關鍵在傳承道統的人
  - label: B
    content: 凡事應未雨綢繆，問題發生時才能有備無患
  - label: C
    content: 孔子安然赴死的決心讓敵人畏懼，逆轉局勢
  - label: D
    content: 文王未能推行仁道，孔子期許自己感化匡人【L4】
  lesson_raw:
    number: 第4課
    title: 論語選
    basis: 引用論語選文，選項含【L4】
