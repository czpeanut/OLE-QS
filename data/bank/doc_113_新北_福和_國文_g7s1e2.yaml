- id: doc_113_新北_福和_國文_g7s1e2_s4_34
  section: 4
  number: 34
  type: single
  page: 5
  stem: 甲文提到科爾「三年內的全部星期天」都用來解答難題，此行為反映了什麼觀點？
  options:
  - label: A
    content: 科爾沒有其他休閒活動，生活單調
  - label: B
    content: 科爾利用每個星期天的時間，逐步接近成功
  - label: C
    content: 科爾認為星期天是唯一有效工作的時間
  - label: D
    content: 科爾相信質數問題的解答需要足夠的資源支持【綜合】
  group_stem: '（甲）

    　　20 世紀初，數學界曾出現過一道叫人頭疼的難題，就是2 的67 次方減1 到底是不是人們猜想的質數。1905 年，在紐約的數學學會上，英國數學家科爾通過一番令人信服的運算論證，成功破解了這一難題，取得了出類拔萃的成果。有人問科爾：「您論證這個課題前後共花了多少時間？」科爾回答：「三年內的全部星期天。」多麼振聾發聵的聲音！正是「星期天」這個人人皆有的業餘時間，被科爾充分利用起來，從而成就了一位卓越的數學家。愛因斯坦說：「人的差異在於業餘時間，『業餘時間』生產著人才，也生產著懶漢、酒鬼、牌迷、賭徒。」時間最珍愛愛惜它的人們。聲色犬馬、碌碌無為，時間就會從你的身邊悄悄溜走；不斷學習，充實自己，你就會覺得時間在有意為你放慢。

    改寫自郭冬仙〈人的差異在於業餘時間〉

    （乙）

    　　某段期間，因為下地獄的人銳減了，閻羅王緊急召集群鬼，商討如何誘人下地獄。牛頭提議說：「我告訴人類：『丟棄良心吧！根本就沒有天堂！』」閻羅王考慮一會兒，搖搖頭。馬面提議說：「我告訴人類：『為所欲為吧！根本就沒有地獄！』」閻羅王想了想，還是搖搖頭。過了一會兒，旁邊一個小鬼說：「我去對人類說：『還有明天！』」閻羅王終於點了頭。「還有明天」可以使人懶惰荒廢，「還有明天」也可以讓人奮發向上。你我，會是閻羅王心中想要引誘的那一位嗎？

    　　　　　　節錄自潘台成〈綠化心靈〉'
