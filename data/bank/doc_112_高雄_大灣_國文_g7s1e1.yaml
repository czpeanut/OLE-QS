  group_stem: "題組﹙四﹚\n    林瓊瀛認為，要提高對錯誤的警覺性，必須做到兩件事：心胸開放以及自省。\n  心胸開放是要能聽進去建言；當別人告訴你有錯時，不要情緒化，懷疑對方在挑剔你、針對你，要跳脫情緒去思考原委。而自省則是作情境分析。在顧問業服務多年，林瓊瀛保持一個習慣，即使再忙碌，也會抽空思考，今天在人、事、情、物上面有沒有做錯？就像是我們跟客戶做完簡報，之後一定會再做一次簡報檢討一樣，自我反省：有沒有更好的方法？不要單一思考，認為沒有其他解法了。當然，要坦然面對錯誤並不容易，認錯是對自我價值和自尊的一種否定，誰願意承認「我很笨」？認錯時傷害自我價值體系是必然的，但要學著去淡化。也就是佛家講的：面對它、處理它、放下它。\n\
    \  認錯，是加分不是扣分。世界上沒有不犯錯的人，錯誤也不只發生在職場，而是發生在生活周遭。林瓊瀛認為，認錯並不會貶損一個人的價值，好好的認錯，解決犯錯所造成的問題，反而會提升你在他人眼中的評價。\n\
    \   （蕭西君認錯，沒有那麼可怕）"
