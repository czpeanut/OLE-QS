  - label: D
    content: 早一點成就人生的事業。
  group_stem: "題組﹙三﹚\n    閱讀的最大理由是想擺脫平庸。一個人如果在青年時期就開始平庸，那麼今後要擺脫平庸就十分困難。\n    何謂平庸？平庸是一種被動而又功利的謀生態度。平庸者什麼也不缺少，只是無感於外部世界的精彩，人類歷史的厚重，終極道義的神聖，生命涵義的豐富。而他們失去的這一切，光憑一個人有限的人生經歷是無法獲得的，因此平庸的隊伍總是相當龐大。黃山谷說過：「人胸中久不用古今澆灌，則塵俗生其間，照鏡覺面目可憎，對人亦語言無味。」這就是平庸的寫照。黃山谷認為要擺脫平庸，就要「用古今澆灌」。\n\
    \    只有書籍，能把遼闊的空間和漫長的時間澆灌給你，能把一切高貴生命早已飄散的信號傳遞給你，能把無數的智慧和美好對比著愚昧和醜陋一起呈現給你。區區五足之軀，短短幾十年光陰，居然能馳騁古今、經天緯地，這種奇蹟的產生，至少有一半要歸功於閱讀。\n\
    \    如此好事，如果等到成年後再來匆匆彌補就有點可惜了，最好在青年時就進入。早一天，就多一分人生的精彩；遲一天，就多一天平庸的困擾。         \
    \                                           （節錄自余秋雨臺灣演講）"
