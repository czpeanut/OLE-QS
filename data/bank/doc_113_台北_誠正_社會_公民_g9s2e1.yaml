- id: doc_113_台北_誠正_社會_公民_g9s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 芩貝經營一家花店，為了讓選購的客戶享受浪漫氣氛，因此於近日連續播流行歌曲，讓來店的消費者收聽。但有附近的居民認為，若芩貝未經同意或授權便播放流行音樂，恐有觸法之虞。關於芩貝的行為，依法律的認定來看，哪一個角度的分析正確？
  options:
  - label: A
    content: 僅是用來製造氣氛，不會涉及法律問題
  - label: B
    content: 未經同意公開播放，已觸犯了《商標法》
  - label: C
    content: 公開播放屬合理使用範圍，有助於創作者進行推廣
  - label: D
    content: 此項侵權行為，將負起民事損害賠償責任。
