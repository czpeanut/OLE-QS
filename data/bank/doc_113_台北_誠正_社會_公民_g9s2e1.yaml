  group_stem: "OpenAI 新推出的ChatGPT 圖像生成器，因能生成具日本動畫工作室吉卜力風格的迷因圖，在網路上爆紅，但引發侵權疑慮。網路上流傳吉卜力工作室發布警告信，稱這些應用程式侵害該公司權利，但吉卜力接受日本放送協會（NHK）採訪表示，「發布警告信並非事實」。\n\
    \  自這個圖像生成器上線以來，網友已利用該工具生成包含馬斯克（Elon Musk）與美國總統川普（Donald Trump）、「魔戒」（The Lord\
    \ of the Rings），以及重現911 事件場景的吉卜力風格圖片。甚至白宮也在X 發布一張吉卜力風格圖片，內容敘述一名流著淚的嫌疑犯遭美國移民官員戴上手銬，準備驅逐出境，連OpenAI\
    \ 執行長阿特曼（Sam Altman）都將X 的個人頭像換成吉卜力風格。\n  在此背景下，有一名網友26 日在X 發文，稱要推出一款「可以將任何圖片轉換為吉卜力風格的共有應用程式」。該名網友27\
    \ 日又發布了一封自稱來自吉卜力工作室的警告信圖片，表示「吉卜力工作室要求停止該項目」。\n  所謂的「警告信」以英文寫成，上頭還有正版吉卜力工作室的龍貓側臉大LOGO，內容大致說，這類應用程式涉嫌侵害該公司權利，威脅說如果不停止，將採取法律手段。\n\
    \  然而，吉卜力工作室接受NHK 採訪時明確表示，「本公司發布警告信一事並非事實」，顯示該名網友上傳的是假的警告信，整起事件是虛假訊息。\n  不過，這封假警告信已經透過許多社群媒體名人轉發傳播，甚至也出現了網路媒體報導「吉卜力工作室透過正式文件，要求停止相關應用程式」的錯誤報導。\n\
    ~摘改自《「應停止吉卜力風AI 創作」為ChatGPT 生成圖發警告信？吉卜力：並非事實》"
