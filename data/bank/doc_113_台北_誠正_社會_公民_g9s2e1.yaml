- id: doc_113_台北_誠正_社會_公民_g9s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 陳澄波，嘉義人，為臺灣人首次以西畫跨進日本官展的門檻；其後又數度入選「帝展」和其他各項展覽，其畫作亦屢次刷新台灣藝術家作品拍賣紀錄，然不幸於西元1947
    年因二二八事件遇害。他的作品大多描繪當下台灣的環境、文化，以油畫紀錄了當時的台灣，相關作品有些也被放入教科書中，依著作權的角度來看，哪一項敘述正確？
  options:
  - label: A
    content: 該作品已超過保障期限，書商可自由放入課本中
  - label: B
    content: 作品放入教科書與教學目的有關，符合公共利益
  - label: C
    content: 為了凸顯作品價值，書商應支付報酬給後代子孫
  - label: D
    content: 因作者已去世，故使用其作品不會構成侵權行為。
