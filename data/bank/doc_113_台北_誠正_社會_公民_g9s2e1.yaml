- id: doc_113_台北_誠正_社會_公民_g9s2e1_s3_31
  section: 3
  number: 31
  type: single
  page: 3
  stem: 上述國際組織的成員性質，與下列何者最類似？
  options:
  - label: A
    content: 歐洲聯盟
  - label: B
    content: 世界展望會
  - label: C
    content: 世界貿易組織
  - label: D
    content: 亞太經濟合作會議。
  group_stem: '紅十字會與紅新月會國際聯合會（IFRC）今天緊急呼籲募集1 億瑞士法郎（約新台幣37 億7000 萬元），來協助緬甸震災的災民。

    法新社報導，全球最大規模的人道援助網絡IFRC 指出，緬甸中部城市瓦城（Mandalay）附近28 日發生震矩規模7.7 強震，造成嚴重災損，當地的援助需求與時俱增。

    IFRC 的聲明寫道：「為擴大援助規模，IFRC 緊急呼籲籌集1 億瑞士法郎來協助10 萬人（2 萬戶家庭），在未來24 個月內提供挽救性命的救濟以及早期復原支持。」聲明提到，未來幾週氣溫會持續上升，雨季也將到來，「在後續出現危機之前」，受災社區亟需穩定下來。

    IFRC 亞太主任馬修（Alexander Matheou）表示：「這不只是單一災難，更是一場堆疊在既有弱點上的複雜人道危機。」他還說：「緬甸持續面臨境內流離失所及糧食不安全等問題。這次地震惡化本已脆弱的處境，國際社會必須挺身而出，支援大膽且持久的應對措施。」

    IFRC 聲明並提到，緬甸紅十字會（Myanmar Red Cross Society）已動員受訓過的志工提供協助且展開搜救。緬甸軍政府今天下午發布聲明指出，強震迄今已造成國內約1700
    人喪生、約3400 人受傷，另有300 多人失蹤。

    ~摘改自聯合報《緬甸地震援助需求與時俱增 國際紅十字會籲募款逾37 億元助災民》'
