  stem: 下文中針對我國咖啡的相關敘述，下列何者最適當？「過去以茶文化為主的亞洲人，對咖啡的接受度愈來愈高，更逐漸在各地形成獨特的咖啡文化。近年臺灣也吹起喝咖啡的風潮，路上常看到人手一杯咖啡。其實早在日治時期，日本就已將飲用咖啡的習慣帶入臺灣，戰後有業者創立供內用的專業咖啡店，還有廠商生產即溶與罐裝咖啡，但直到九○年代末期，美式咖啡連鎖品牌進駐臺灣引進外帶現煮咖啡後，咖啡市場才出現了關鍵性的改變，讓喝咖啡變成日常生活的一部分。2018
    年時，臺灣平均每人一年喝下超過200 杯咖啡，咖啡豆的進口量是2008 年時的兩倍以上，而且咖啡商機還在持續成長中。」【摘改自111 年教育會考】
