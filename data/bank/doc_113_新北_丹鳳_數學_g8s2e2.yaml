- id: doc_113_新北_丹鳳_數學_g8s2e2_s2_2
  section: 2
  number: 2
  type: single
  page: 2
  stem: '請根據以下甲、乙、丙、丁四人的說法，判斷有幾人的敘述是正確的？


    甲：「若 $\angle AOC=72^{\circ}$，$\angle BOC=108^{\circ}$，則 A、O、B 三點不一定會在同一條直線上。」


    乙：「$\triangle ABC$ 中，已知 $\angle C=\angle A+\angle B$，則 $\triangle ABC$ 一定是直角三角形。」


    丙：「已知 n 邊形可從其中一個頂點作出最多 10 條對角線，則 n 必定等於 13。」


    丁：「如下圖，直線 L 與 M 相交於 O 點，E、O、F 三點不在同一直線上，則 $\angle 1$ 與 $\angle 4$ 肯定不是對頂角的關係。」'
  options:
  - label: A
    content: 1 人
  - label: B
    content: 2 人
  - label: C
    content: 3 人
  - label: D
    content: 4 人
  assets:
