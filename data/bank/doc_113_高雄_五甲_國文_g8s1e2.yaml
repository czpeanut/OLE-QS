  stem: 根據本文,下列句意說明何者正確?
  options:
  - label: A
    content: 亦寄酒為跡者也:有酒之處必有陶淵明蹤跡
  - label: B
    content: 抑揚爽朗,莫之與京:文章起伏跌宕、清朗通達,無人能及
  - label: C
    content: 干青雲而直上:志向遠大,在仕途上也曾飛黃騰達
  - label: D
    content: 尚想其德,恨不同時:感嘆自己德行高潔卻生不逢時。
  group_stem: '有疑陶淵明詩篇篇有酒,吾觀其意不在酒,亦寄酒為跡者也。其文章不群,辭采精拔,跌宕昭彰,獨超眾類,抑揚爽朗,

    莫之與京。橫素波而傍流,千青雲而直上。語時事則指而可想,論懷抱則曠而且真。加以貞志不休,安道苦節,不以躬耕為

    恥,不以無財為病。自非大賢篤志,孰能如此乎?余愛嗜其文,不能釋手,尚想其德,恨不同時。

    註:①莫之與「京」:齊等。

