- id: doc_113_高雄_五甲_國文_g8s1e2_s4_5
  section: 4
  number: 5
  type: single
  page: 3
  stem: 故事中的溺水者「兩搖其首」,他所表現出的行為,可用下列何者來加以形容?
  options:
  - label: A
    content: 對同伴的不信任
  - label: B
    content: 溺水時的慌亂無措
  - label: C
    content: 財如命的頑固態度
  - label: D
    content: 貪生怕死的膽小模樣。
  group_stem: '永之氓威善游。一日,水暴甚。有五、六氓乘小船絕湘水。中濟,船破,皆游。

    有一氓盡力而不能尋常。其侶曰:「汝善游最也,今何後為?」曰:「吾腰千錢,重,是以後。」曰:「何不去之!」不應,

    搖其首。

    有頃,益怠。已濟者立岸上,呼且號,曰:「汝愚之甚、蔽之甚!身且死,何以貨為?」又搖其首,遂溺死。

    吾哀之,且若是,得不有大貨之溺大氓者乎?

    (節錄自柳宗元柳河東集)

    註:①永:地名,永州。

    ②氓:百姓。

    ③水暴甚:水暴漲得厲害。

    ④「絕」湘水:橫渡。

    且若是:還像這樣。

    ⑤不能「尋常」:度量單位,古代八尺為尋,倍尋為常。比喻狹小的地方。'
