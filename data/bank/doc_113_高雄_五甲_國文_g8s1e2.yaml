- id: doc_113_高雄_五甲_國文_g8s1e2_s4_3
  section: 4
  number: 3
  type: single
  page: 3
  stem: 根據作者的觀點,下列行為何者屬於文明人的象徵?
  options:
  - label: A
    content: 晚上在旅館小聲說話
  - label: B
    content: 在戲院看演員演啞劇
  - label: C
    content: 在鄉間見面時大聲問好
  - label: D
    content: 被人踩住脖子時大喊救命。
  group_stem: "「旁若無人」的精神表現在日常行為上者不只一端,其中經常令人困惱的乃是高聲談話。在喊救命的時候,聲音當然不\n「嫌其大,除非是脖子被人踩在腳底下,但是普通的談話令人聽見即可,而無須一定要力竭聲嘶的去振聾發\
    \ 。生理學告訴我\n「們,發音的構造是很複雜的,說話一分鐘要有九百個動作,有一百塊筋肉在弛張,但是大多數人似乎還 不足,恨不得嘴上\n再長一個擴大器。有個外國人疑心我們國人的耳鼓生得異樣,那層膜許是特別厚,非扯著脖子喊不能聽見,所以說話總是像\n\
    「打架。這批評有多少真理,我不知道。不過我們國人會嚷的本領,是誰也不能否認的。電影場裡電燈初滅時候,總有幾聲「愛\n哟,小三兒,你在哪兒哪?」在戲院裡,演員像是演啞劇,大\
    \ 大鼓之聲依稀可聞,主要的聲音是觀眾鼎沸,令人感覺好像\n是置身蛙塘。在旅館裡,好像前後左右都是廟會,不到夜深休想安眠,安眠之後難免有響皮底的大皮靴,毫無\
    \ 愧的在你門\n前 來 \n狼味,\n虎嘯, 鳴,犬吠,即使是小如促織蚯蚓,聲音都不算小,都不會像人似的有時候也會低聲說話。大概文明程度愈高,說話\n愈不以聲大見長。群居習慣愈久,愈不容易存留「旁若無人」的幻覺,我們以農立國,鄉間地曠人稀,\
    \ 畝 陌之間,低聲\n說一句「早安」是不濟事的,必得扯長了脖子喊一聲「你吃過飯啦?」可怪的是,在人煙稠密的所在,人的喉嚨還是不能縮\n小。更可異的是,紙\
    \ 嗓,破 嗓,喇叭嗓,公雞嗓,並不被一般人認為是缺陷,而且「麻衣相法」還公然的說,聲音洪亮\n者主貴!\n(改寫自梁實秋旁若無人)"
