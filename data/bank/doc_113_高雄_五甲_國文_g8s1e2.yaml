- id: doc_113_高雄_五甲_國文_g8s1e2_s4_7
  section: 4
  number: 7
  type: single
  page: 4
  stem: 本文所要表達的意旨,可用下列何者概括?
  options:
  - label: A
    content: 飲水思源
  - label: B
    content: 數大就是美
  - label: C
    content: 柳暗花明又一村
  - label: D
    content: 萬物靜觀皆自得。
  group_stem: '我正在努力提醒我的朋友們,設法花十分鐘看一株樹。

    我告訴他們一般人看見一株樹或者身旁周遭美麗的事物,實際上目光停留的時間往往不超過十秒,許多人的心靈皆太匆

    促了。

    不過在說這句話之前,我會先帶他們走進樹林裡,請他們抬頭看一棵樹,暗中幫他們計算時間。結果的確是如此,少有

    人花上超過十秒的時間去瞧一棵樹,大多數的人在十秒前便把頭垂下來,奇怪地望著我為何叫他去看一棵樹,等待我的答案。

    然後我的提醒便使得他們若有所悟:原來生活的心情太匆忙,即使是處於休息狀態,內心仍不得悠閒。

    這是我從一本討論「環境教育」的書中學到的方法,這本書提醒我「重新看見」。即使我學習過正統的植物分類學,有過

    三、五年的賞鳥經驗,而我仍然發覺,要真正地用心去看待植物、烏類、山林、自然萬物,就如同學佛修行一般不容易。如

    何從進入山林的過程之中,得到平心靜氣的好果,有了這般好果,當然觀察力、思考力便能充裕自如。而如此「平心靜氣」

    猶如入山朝聖的自我修練學習,正是最難達到,但也是最精妙愉悅的歷程。

    其實我想追求「面對荒野」的真正經驗,正是如此的單純過程。

    (我看到植物的光和影(節錄) 王家祥)'
