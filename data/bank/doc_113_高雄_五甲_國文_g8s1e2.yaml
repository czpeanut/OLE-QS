- id: doc_113_高雄_五甲_國文_g8s1e2_s4_9
  section: 4
  number: 9
  type: single
  page: 4
  stem: (甲)敗興 (乙)興起 (丙)見荷 (丁)領略。關於文中作者賞荷的心理過程為何?
  options:
  - label: A
    content: 甲乙丙丁
  - label: B
    content: 乙丙甲丁
  - label: C
    content: 丙乙甲丁
  - label: D
    content: 甲丙乙丁。
  group_stem: '看荷花,宜晨、宜夜。朝晖月色映照下,玉立婷婷,青蓋田田,倍添麗色。不過,黃昏夕陽中,卻也別有風情。

    近來,炎天 暑,始終徘徊不去。很想念那片「清風徐來,綠雲自動」的荷池。趁著晚晴時分,全家到了植物園。一路

    上盡念著姜白石的句子:「古城野水,喬木參天」、「水佩風裳無數」、「冷香飛上詩句」、「高柳垂蔭,老魚吹浪,留我花間住」,

    似乎涼意頓生, 暑已消。

    可是,真正面對滿塘翠葉紅花,卻很想嘆氣!首先,荷葉太擠,擠得每片葉子都不易伸展,很難有「田田」之感;其次,

    「花不是已謝,就是未開,加以剛下過一場雨,一點荷香也聞不到,自悔尋芳到已遲,「冷香嫣然」只有憑想像得之。再放眼一

    望,池塘中間居然一大塊空白,片葉俱無,真像人頭上患了癬 之疾,成了不毛之地!據說是水汙染的後遺症,真是大煞風

    景。看荷的心情,到此已索然無味,正預備敗興而返——偏偏一歲半的小女兒面對平生初見的「奇景」,正感動得目眩神迷,

    「不停地說「花花開啦!」「蜻蜓來啦!」兩條小腿,繞池急奔,興奮得恨不能縱浪池水中,伴花葉蜻蜓共舞!怕她跌倒,我們

    也只有繞池一周。這才發覺到池邊樹下,遊人如織,觀賞荷塘夕照的人並不少!面向一池翠碧,有人靜坐,有人閒聊,有人

    讀書,有人漫步,俱都怡然自得。驟而方晴,夕陽燦燦如金,荷風陣陣,拂面生涼,老樹濃蔭,細草柔碧。再細看池中未開

    | 的花苞宛如木筆,亭亭擎立,媽紅如染,荷葉上圓珠的爍,晶瑩如玉。此情此景,確也可樂。忽覺心中陰霾頓消,也想和著

    大女兒唱起歌來:「夕陽斜,晚風飄,大家齊唱採蓮謠……………。」

    原來喜樂悲愁,全在一念之間。一年好景,一歲繁花,本無須遠求,只要能以無沾不染之心,鉅細靡遺的眼,真正去領

    略,就是福氣。

    (荷塘夕照 方瑜)'
