- id: doc_113_台中_大業_英語_g7s2e1_s3_49
  section: 3
  number: 49
  type: single
  page: 7
  stem: ( )49. What is the main idea of the reading? 📖 main 主要的
  options:
  - label: A
    content: How to play games in parks.
