  group_stem: 'THE NATIONAL LIBRARY OF PUBLIC INFORMATION


    The National Library of Public Information is in Taichung. The library is very
    big. It is also a beautiful and special place. It has many big windows, and they
    bring a lot of light inside.


    The library has many books. It has books in Chinese. It has books in English,
    too. There are comfortable chairs. People can read books here. They can also borrow
    books to take home.


    On the other hand, people use the library on different purposes. Students come
    to study. Children come to read fun books. Some people use computers in the library.
    They can even watch movies and listen to music there.


    The library isn’t open every day. It opens at 9:00 in the morning and closes at
    9:00 at night from Tuesday to Sunday. Everyone can visit the library for free.


    The National Library of Public Information is a good place to learn. It is also
    a good place to relax.


