    content: Parkour as a way of moving.
  - label: C
    content: Running is good for you.
  - label: D
    content: Different types of sports. 📖 type 種類
  group_stem: 'PARKOUR: MOVING IN A FUN WAY


    ❧ WHAT IS PARKOUR?

    Parkour is not a game. It is not a sport with rules. It is a fun way to move from
    one place to another place quickly. People use walls, rails, and benches to move.


    ❧ HOW DO PEOPLE DO PARKOUR?

    Parkour people run fast. They jump over things. They climb walls. They roll on
    the ground. They use their hands and feet to move.


    ❧ WHERE CAN YOU DO PARKOUR?

    You can do parkour in many places. You can do it in parks. You can do it in cities.
    You can use steps, walls, and rails. Some cities have special parkour parks.


    ❧ IS PARKOUR SAFE?

    Parkour can be dangerous. People must be careful. They start with easy moves.
    They practice a lot. They learn how to fall safely.


    ❧ WHY DO PEOPLE LIKE PARKOUR?

    Parkour is fun. It makes the body strong. It helps people feel free. It teaches
    people to solve problems. People play with each other when they do parkour together.

    Parkour is a good way to move and have fun at the same time!


