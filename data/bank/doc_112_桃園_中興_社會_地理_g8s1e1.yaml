- id: doc_112_桃園_中興_社會_地理_g8s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 「中印部隊在喀什米爾與西藏邊境對峙近一個月舉世矚目。其中一個對峙地點班公湖地理位置特殊，有2/3 水域位於中國境內，1/3 受印度控制，它最特別的是湖水在中國境內是淡的，到了印度境內變成鹹的。造成這種神奇象的原因是班公湖最大的兩條支流，嘛嘎藏布河和多瑪曲，都來源於中國境內。這兩條支流都匯入班公湖的東段，給這段湖區帶來豐富的淡水資源，導致水源補給量大於氣候蒸發量，所以才能使得東段湖水能夠成為高原上為數不多的淡水湖。而在印度控制的班公湖西段，雖也有河流連接班公湖西側，但水量不足。印度控制的這段區域，南有喜馬拉雅山阻擋印度洋的濕氣和雨水，降水稀少，且蒸發作用強。所以，西段由於補水嚴重不足，加之班公湖中段湖體十分狹窄，湖水的交流不暢，東部淡水難以流動到西部交替補償，導致西段成為鹹水湖。」附圖3
    是青藏高原地形剖面圖，依據上文描述判斷，班公湖最有可能是圖3 中何處？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
  assets:
  - key: s1_4_f1
    kind: figure
    file: doc_112_桃園_中興_社會_地理_g8s1e1/s1_4_f1.png
  tags:
