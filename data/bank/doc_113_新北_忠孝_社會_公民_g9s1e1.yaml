- id: doc_113_新北_忠孝_社會_公民_g9s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 近期在國外引發討論的「自由座位」辦公室模式，打破原有固定的座位模式。公司可選擇【甲】方式，有時會坐在主管附近適時得到督促，有時會坐在窗邊，轉換工作情緒。若擔心管理上的難度，可運用【乙】方式，在系統中建立座位表單，讓員工在上班日前，先選擇就座日期和時間，讓主管容易找到員工，也方便不同部門進行橫向會議。針對上述提及的【甲】、【乙】方式，下列敘述何者正確？
  options:
  - label: A
    content: 甲為使用者付費的方式
  - label: B
    content: 資源長期被占用是甲方式的缺點
  - label: C
    content: 乙為取決於運氣的抽籤方式
  - label: D
    content: 乙方式可能有較缺乏彈性的缺點。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 公民
      code: 1-2
      title: 誘因影響選擇行為
      chapter: 第1章 選擇與消費
    textbook: 九上公民 1-2 誘因影響選擇行為
    labeled_by: ai
- id: doc_113_新北_忠孝_社會_公民_g9s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: '某工廠評估三種營運策略的收支情況，如右表所示。若僅考量利潤，該工廠的最佳選擇是「維持現狀」，且此選擇的機會成本是「增產乙產品」。根據上述內容判斷，表中「☆」處的數值，最可能為下列何者？

    | 營運策略 | 銷貨收入 | 生產成本 |

    | :--- | :--- | :--- |

    | 增產甲產品 | 120 | 90 |

    | 增產乙產品 | 105 | ☆ |

    | 維持現狀 | 80 | 40 |

    單位：萬元／月'
  options:
  - label: A
    content: '80'
  - label: B
    content: '70'
  - label: C
    content: '60'
  - label: D
    content: 50。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 公民
      code: 2-1
      title: 生產與利潤
      chapter: 第2章 生產與生產資源
