- id: doc_113_新北_忠孝_社會_公民_g9s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '若來辭去月薪3萬2千元的祕書一職，將老宅改建為民宿並開始營業，附表列入他營業第一個月的帳目，他應該如何衡量機會成本？

    | 收入 | 一天1500元×20天=30000元 |

    | :--- | :--- |

    | 支出 | 裝潢店面、廣告行銷、公共意外責任保險等 |'
  options:
  - label: A
    content: 機會成本就是指營業的收入部分
  - label: B
    content: 機會成本是指代價，計算支出即可
  - label: C
    content: 只要收入大於支出，就無機會成本
  - label: D
    content: 經營民宿的機會成本尚需包含擔任祕書的薪資。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 公民
      code: 1-1
      title: 選擇與機會成本
      chapter: 第1章 選擇與消費
