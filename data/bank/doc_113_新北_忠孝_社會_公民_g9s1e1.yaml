- id: doc_113_新北_忠孝_社會_公民_g9s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '下表是四位應徵者在面試甲、乙兩工作時所開出的時薪條件──

    | 應徵者 | 甲工作 | 乙工作 |

    | :--- | :--- | :--- |

    | 小一 | 250元 | 230元 |

    | 小二 | 210元 | 190元 |

    | 小三 | 240元 | 220元 |

    | 小四 | 280元 | 250元 |

    針對此份資料，哪一項分析是正確的？'
  options:
  - label: A
    content: 若四人都選擇從事甲工作，小一的機會成本最大
  - label: B
    content: 若甲工作的平均工資為210元，則小四最為適合
  - label: C
    content: 若四人都選擇從事乙工作，小二的機會成本最小
  - label: D
    content: 小三選擇甲工作的機會成本高於乙工作，故很適合。
