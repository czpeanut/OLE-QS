- id: doc_113_新北_忠孝_社會_公民_g9s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '小允有甲、乙、丙三份工作機會，將其機會成本繪製如右表。若小允在繪製表格時僅以薪資為考量，根據表中內容判斷，甲、乙、丙三份工作的薪資，由高到低依序為下列何者？


    | 工作 | 機會成本 |

    | :--- | :--- |

    | 甲 | 丙的薪資 |

    | 乙 | 甲的薪資 |

    | 丙 | 甲的薪資 |'
  options:
  - label: A
    content: 丙、乙、甲
  - label: B
    content: 甲、丙、乙
  - label: C
    content: 丙、甲、乙
  - label: D
    content: 甲、乙、丙。
