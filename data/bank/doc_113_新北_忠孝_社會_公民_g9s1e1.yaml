  stem: '小影獲得甲、乙、丙、丁四個薪資不同的工作機會，若他僅以薪資作為選擇工作的依據，在甲、乙兩工作中，他會選擇甲工作，且機會成本為35,000 元；他另將乙、丙工作與乙、丁工作分別比較，結果整理如附表。根據表中資訊判斷，乙、丙、丁三項工作的薪資高低關係應為下列何者？

    | 選擇比較的工作 | 最佳選擇的機會成本 |

    | :--- | :--- |

