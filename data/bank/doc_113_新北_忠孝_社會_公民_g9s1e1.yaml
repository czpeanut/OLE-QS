- id: doc_113_新北_忠孝_社會_公民_g9s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: '筱華在網路上看到下列政策報告，有關此項政策在不同面向誘因的分析，何者正確？

    政府自西元2016 年開始推行「汰舊換新」補助政策，針對購買汽車、機車的車主，在換購新車前後半年內報廢或出口原本的舊車，都能享有汽車5 萬元、機車4 千元的貨物稅減徵優惠。從政策開始到西元2019
    年共增加44 萬台車輛的汰換，帶動汽車產業產值達2115 億元，政府的稅收增加約1057 億元，節能減碳效果更高達72.39 萬公噸。'
  options:
  - label: A
    content: 對產業效益來說，屬於負向誘因
  - label: B
    content: 對政府稅收來說，屬於非金錢誘因
  - label: C
    content: 對環保成效來說，屬於金錢誘因
  - label: D
    content: 對欲換車車主來說，屬於正向誘因。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 公民
      code: 1-2
      title: 誘因影響選擇行為
      chapter: 第1章 選擇與消費
    textbook: 九上公民 1-2 誘因影響選擇行為
    labeled_by: ai
- id: doc_113_新北_忠孝_社會_公民_g9s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 陽陽只剩下一個小時可以準備課業，此時，他還有國文、英文與歷史還沒讀完。若從科目加權的角度來看，國文的加權是分數乘上5，英文的加權是分數乘上4，歷史的加權是乘上2。請從經濟學角度分析，小明選擇讀國文的原因為何？
  options:
  - label: A
    content: 因為讀國文得到分數的誘因較高
  - label: B
    content: 讀國文的機會成本最高
  - label: C
    content: 讀國文的效益較其他科低
  - label: D
    content: 讀書並無機會成本可言，因為沒有獲利。
