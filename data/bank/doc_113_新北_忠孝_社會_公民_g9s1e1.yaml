- id: doc_113_新北_忠孝_社會_公民_g9s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 經濟學者李維特說過：「經濟學就是研究各類的誘因…，誘因往往不大，改變情境的力量卻驚人。」依此，誘因會如何影響人們的決策？
  options:
  - label: A
    content: 誘因是強調人們可以得到的有形利益
  - label: B
    content: 誘因會改變選擇後所付出的代價進而影響人們的行為
  - label: C
    content: 誘因不含限制或減少特定行為的懲罰
  - label: D
    content: 誘因對每個人所追求的報償完全相同。
