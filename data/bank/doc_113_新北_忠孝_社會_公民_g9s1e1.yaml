- id: doc_113_新北_忠孝_社會_公民_g9s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 人們會衡量做選擇時的利弊得失，做出決定後，行為就會受到誘因的支配和影響。而當誘因改變時，人的行為也可能會隨之改變，下列哪些符合此種情形？ (甲)羨羨喜歡喝咖啡，當茶類飲品特價時，他仍選擇買咖啡；(乙)爍爍成績優秀是全班第一名，他決定持續努力維持第一；(丙)小宇看到網路有便宜的團購蛋糕，他也下單買來吃看看；(丁)阿毅因為政府加重酒後駕車罰則，他喝酒後決定坐捷運
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 丙丁
  - label: D
    content: 甲丁。
