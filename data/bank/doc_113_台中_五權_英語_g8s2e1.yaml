- id: doc_113_台中_五權_英語_g8s2e1_s2_30
  section: 2
  number: 30
  type: single
  page: 3
  stem: Why did Reef Chang start the “Wantshowasyoung” Instagram account?
  options:
  - label: A
    content: He wanted to make his grandparents’ dreams come true.
  - label: B
    content: He felt bored during COVID-19.
  - label: C
    content: He wanted to stop his grandparents from feeling bored.
  - label: D
    content: He wanted to make money for a better life.
  group_stem: 'Want-Show Laundry is in Taichung and the owner(擁有者) is an 80-something
    couple(夫妻). They run the laundry for over 70 years. They became(變) famous on Instagram
    in June, 2020. In fact, they are so famous that they have more than 650,000 fans,
    and the number keeps growing. They changes fashion by wearing unclaimed(無人領取的)
    clothes from their laundry.

    Reef Chang, the grandson of the owners Chang Wan-ji and Hsu Sho-er saw his grandparents
    were very bored(感到無聊的) during COVID-19. He wanted to help them get through the
    hard time and brighten up their lives. He started the “Wantshowasyoung” Instagram
    account(帳號) and put pictures of his grandparents wearing interesting old clothes
    on the Internet. Then, the laundry got attention(注意) from people all over the
    world soon. Everyone on Instagram liked them and their clothes.

    Reef came up with an idea to make money by selling the old clothes. They washed
    the clothes before sending them to people. However, Reef didn’t keep all the money.
    He gave charities(慈善機構) the money to wash clothes, and gave clothes to the poor
    or the old people in need.

    It’s so sad that Hsu Sho-er passed away at age 86 in May,2023. Her life stops,
    but her spirit(精神) lives long.'
  tags:
    textbook: 第四冊（八下）第1次段考範圍
    labeled_by: ai
