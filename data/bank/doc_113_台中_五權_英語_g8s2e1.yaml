    content: The skirt is from my great grandmother. I am glad it’s not         .
  - label: C
    content: I got up late this morning. That’s why I didn’t have          to prepare
      breakfast.
  - label: D
    content: Something is wrong with the bus. To be safe, We have to fix it        .
  group_stem: 'BEST  HOUSES  FOR  SALE


    Type A: Apartment; 10 million NTD

    It has 1 living room, 1 kitchen, 1 dining room, 3 bathrooms, and 5 bedrooms. It
    is a very good place for married(已婚的) couple when they are going to have kids.
    It’s quiet and next to a police station. It’s nice for a family to have a happy
    life here.


    Type B: Studio (套房); 2 million NTD

    It’s one of the 120 Studios in a building. It has one bedroom, one bathroom, and
    one small kitchen. It is on the top floor. The best thing about this place is
    that it’s near the metro and train station. It’s convenient for you to go anywhere.


    Type C: Office(辦公室); 9 million NTD

    The office is across from the City Park. It’s so large that you can placed up
    to 80 office desks inside. It’s good for someone to start their business. A boss(老闆)
    can have a meeting or talk with his workers in no time, so they can fix any problems
    as soon as possible.


    Type D: House; 15 million NTD

    The 3-story(三層樓)house is in the mountains. There are 2 bedrooms, 2 bathrooms,
    and 1 living room on each floor. It’s far away from downtown(市中心). It takes the
    owner more than one and a half hours to go to the nearest hospital with a supermarket
    on its 2nd floor in the downtown. To a big family or nature lovers, it is the
    best place.'
