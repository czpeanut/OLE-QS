  group_stem: '【B】 Daylight Saving Time (DST) is when we change the clocks to make
    good use of daylight. In spring, people move the clocks forward by one hour, and
    in autumn, people move them back by one hour. This change helps us enjoy more
    daylight in the evening.

    In America, DST starts in March and ends in November. On the second Sunday in
    March, Americans move their clocks forward by one hour when there is longer daylight
    during the day. On the first Sunday in November, they move their clocks back to
    normal time. DST lasts for a total of 34 weeks every year, about 65% of a year.
    In Europe, DST works in a similar way, but the dates are different. People move
    the clocks forward on the last Sunday in March and turn them back on the last
    Sunday in October.

    Daylight Saving Time began over 100 years ago. It was created to save energy because
    people used sunlight instead of electric lights. Today, some countries still use
    DST to have more sunlight during spring and summer, but other countries stop using
    it because it can be confusing. However, the USA and many European countries still
    follow it to enjoy longer daylight.

