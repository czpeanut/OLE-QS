  group_stem: '【A】 People from all ages may suffer from insomnia. For example, John
    is 9 years old and he has insomnia. This means he has a hard time sleeping at
    night. Sometimes, he lies in bed for hours but he just can’t fall asleep. Even
    when he sleeps, he wakes up in the middle of the night and can’t get back to sleep
    again. Because John doesn’t sleep well, he feels very tired during the day.

    John also has trouble concentrating at school, and it’s not easy for him to listen
    carefully in class. He often forgets his homework and gets bad grades because
    he’s alwasys sleepy. What’s more, he feels moody and gets sad easily because he
    doesn’t feel well all the time. He has headaches very often, and he catches colds
    easily.

    John’s parents are trying to help him. They make sure he goes to bed at the same
    time every night. They ask him not to use cellphone before bedtime. They also
    make a relaxing routine with a warm bath and a bedtime story to help him sleep
    better. Slowly, John is getting healthy.

     suffer 遭受/ lie 躺/ concentrate 集中精神/ sleepy 想睡的

    moody 心情不穩定的/ relaxing 使人放鬆的/ routine 生活慣例'
