- id: doc_112_彰化_福興_英語_g8s2e3_s10_1
  section: 10
  number: 1
  type: single
  page: 3
  stem: What does Sally's father write this letter for ?
  options:
  - label: A
    content: To show her how important a clean room is.
  - label: B
    content: To ask her to do something about her room.
  - label: C
    content: To tell her how messy her room is.
  - label: D
    content: To share how to shop wisely.
  group_stem: "Dear Sally,\n    Last night, I tried to talk to you about your messy\
    \ room, but you shied away from the problem, so I am writing this letter to you.\n\
    \    Before tidying your room, you should know what a need is and what a want\
    \ is. A need is something that you need to keep healthy and safe, while a want\
    \ is something that is fun or makes you happy, but on the other hand, you can\
    \ live without it. Buying new clothes when old ones are still in good shape is\
    \ an example of a want. One of the reasons why your room is messy is that you\
    \ own too many things that you don't really need.\n    Every time I ask you to\
    \ tidy your room, you say something like, \"Oh, forget it! I'm too busy for that.\"\
    \ I don't see why it is a problem. As long as you've made up your mind to do it,\
    \ it is easier than you think. You don't have to do all the tidying at a time.\
    \ Just block out some time to do a little. For example, take out things that do\
    \ not belong in your room, or clothes that you no longer wear.\n    Do as you\
    \ are told, my sweet girl.\nYours,\nDad"
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
