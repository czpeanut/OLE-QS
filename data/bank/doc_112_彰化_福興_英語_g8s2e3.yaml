  group_stem: "World Oceans Day\n    Many people around the world celebrate World\
    \ Oceans Day on June 8th every year. They celebrate this special day by holding\
    \ movie festivals to show the public how beautiful and important our oceans are.\
    \ They also clean up the trash on their countries' beaches.\n    Our oceans were\
    \ once rich in fish and plants. However, now there is a lot less life in the oceans\
    \ than before. Sadly, people created this serious problem. This is becsuse a lot\
    \ of our trash ends up in the oceans. When fish eat it by mistake, it kills them.\
    \ Water pollution also kills a lot of the oceans' fish and plants. If we don't\
    \ fix these problems right away, more marine life will die.\n    By celebrating\
    \ World Oceans Day, people not only learn a lot about the world's oceans but also\
    \ start to make them cleaner. However, it shouldn't just be a one-day event. Let's\
    \ work together and save our oceans!"
