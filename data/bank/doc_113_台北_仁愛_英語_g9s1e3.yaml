  group_stem: '第一則：


    Alina Morse is an American entrepreneur, the boss of Zoli Candy, (44) she set
    up at age ten. Her candy is sold online and in about 25,000 stores in the U.S.
    and around the world, totaling US $ 6 million in sales in 2018. She was the youngest
    person to be on the cover of Entrepreneur Magazine and was twice invited to the
    White House by First Lady Michelle Obama. (45) being the leader of a multi-million-dollar
    company, Morse goes to high school as other teenagers do.


    Morse (46) to be leader of a business since she was three. She was born with a
    large number of fresh and amazing ideas. She lives with her parents and younger
    sister in Michigan. All of them work now in More’s company. Her father Tom works
    as Alina’s manager, dealing with meetings when she is busy. Her mother Suzanne
    helps plan different programs or activities for sales promotions. As for her sister
    Lola, she makes videos for the company. Tom is proud of Alina and calls working
    for her is the most fulfilling thing that he has done in his life.


    The idea for Zollipops, the lollipops that are the company’s main product, came
    out in 2012. She was at a bank with her father when she (47) a lollipop. Her father
    stopped her from eating, saying that it would hurt her teeth. Morse began thinking
    about making a sugar-free lollipop. It took her two years of online research and
    hundreds of unsuccessful experiments at home. She also worked with her dentists
    and doctors. What’s more, she traveled with her father to different factories
    to find all (48) they needed to make their candy.


    The company began making money in a short time. Sales kept soaring sharply from
    2014 through 2018. By 2018, Zollipops were the best-selling lollipops in the U.S.
    In September, 2018, Morse became the youngest person to appear on the cover of
    Entrepreneur Magazine. Zolli Candy was listed as one of the most successful companies
    of the year.


    📖 entrepreneur 企業家 manager 經理 research 研究 experiment 實驗'
