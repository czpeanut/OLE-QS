  section: 1
  number: 25
  type: single
  page: 4
  stem: '台灣是世界上風力資源最豐富的地區之一，在非核家園的政策後，風力發電也將成為台灣未來重要的替代能源之一。新竹某地一年內的日平均風速不小於 3 米/秒的天數約有
    160 天，其中包含平均風速不小於 6 米/秒的天數約占 60 天，為了充分利用“風能”這種“綠色能源”，該地擬建一個小型風力發電廠，決定選用 $A$、$B$
    兩種型號的風力發電機來發電。根據產品說明，這兩種風力發電機在各種風速下的日發電量（即一天的發電量）如下表：


    | 日平均風速 $v$ | | $v<3$ | $3 \leq v<6$ | $v \geq 6$ |

    | :--- | :--- | :--- | :--- | :--- |

