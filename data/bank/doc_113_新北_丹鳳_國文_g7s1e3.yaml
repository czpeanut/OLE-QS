  section: 1
  number: 22
  type: single
  page: 2
  stem: 王溢嘉:「即使你的資質再好，若沒有經過琢磨，也是一塊沒有什麼價值的璞玉。」這段話的涵義和下列何者最相近？
  options:
  - label: A
    content: 盡人事，聽天命
  - label: B
    content: 不鳴則已，一鳴驚人
  - label: C
    content: 玉不琢，不成器
  - label: D
    content: 一分耕耘，一分收穫
