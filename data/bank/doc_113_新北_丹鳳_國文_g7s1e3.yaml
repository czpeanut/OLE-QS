  stem: 沈復在兒時記趣一文中展現了豐富的想像力。下列敘述中，何者沒有運用「想像力」?
  options:
  - label: A
    content: 火車在山洞中前進，驀地，天地重現開闊明亮，黑洞把你吐回給白晝
