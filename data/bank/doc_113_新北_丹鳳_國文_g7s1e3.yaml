  section: 1
  number: 23
  type: single
  page: 2
  stem: 「勤能補拙」是指「勤奮努力可以彌補天資的不足」下列文句何者沒有表達這層涵義？
  options:
  - label: A
    content: 政務纏身的歐陽脩，每日仍會把握「馬上、枕上、廁上」做學問
  - label: B
    content: 成功是一分天才，加上九十九分的努力
  - label: C
    content: 人一能之，己百之；人十能之，己千之
  - label: D
    content: 騏驥一躍，不能十步；駑馬十駕，功在不捨
- id: doc_113_新北_丹鳳_國文_g7s1e3_s1_24
  section: 1
  number: 24
  type: single
  page: 2
  stem: 下列各文句的描述，何者用詞最精簡？
  options:
  - label: A
    content: 身高不足的喬丹並不氣餒洩氣，反而更賣力地磨鍊自己的球技
  - label: B
    content: 每次段考，我總是臨陣磨鎗、臨時抱佛腳，難怪成績都不佳不好
  - label: C
    content: 我們常迷惑不解於成功者的資賦，卻忽略絢麗燦爛背後的長期付出
  - label: D
    content: 草上飛本就輕功了得，又服用了天山雪蓮，功力簡直如虎添翼
