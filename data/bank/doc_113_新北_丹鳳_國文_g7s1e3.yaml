    content: 以具體的鋼釘為喻，描摹李智凱苦練體操的堅毅心志
  group_stem: "2023 年八月，成都 世大運男子競技體操鞍馬項目，二十七歲的臺灣「鞍馬王子」李智凱以15.500 分，第三度贏得金牌，也創下世大運鞍馬三連霸紀錄。鞍馬在上場時間只有幾十秒鐘，他卻苦練超過二十年，付出了無數汗水、淚水。\
    \ \n  李智凱六歲時，被教練林育信發掘，開始學習體操。接受訓練後，每當跟媽媽在市場賣菜時，他常展示體操動作吸引顧客，被暱稱為「菜市仔凱」。2005 年上映的紀錄片翻滾吧！男孩，記錄了李智凱和同學在國小體操隊訓練的故事。\
    \ \n  體操訓練極為艱苦，不僅是流汗，拉筋痛到流淚，各種翻滾動作練習時不慎造成瘀青、破皮、挫傷、摔傷，更是常有的事。在2016 年里約奧運前不久，二十歲的李智凱還因受傷骨裂，必須打上鋼釘。但傷癒後，他立即回到訓練場上。\
    \ \n  運動員要長期維持最佳狀態，是很困難的事。多年以來，李智凱每週訓練六天。即使新冠疫情期間，許多賽事停辦，他仍毫不鬆懈，不斷練習各項高難度動作。 \n\
    \  正因如此，二十年來的堅持，使他成為臺灣最傑出的體操選手之一。他的招牌動作湯瑪士迴旋，被國際體操總會列為教案。2021 年，他在東京奧運贏得的鞍馬銀牌，是臺灣第一面奧運體操獎牌。2023\
    \ 年，還創下世大運三連霸紀錄。同年九月，他不負眾望，再度勇奪杭州亞運金牌。 \n  李智凱以積年累月的鍛鍊和自我挑戰、追求卓越的態度，只為了在場上的幾十秒內能展現超完美動作，這正是體操選手堅毅不屈的精神。\
    \ \n--（改寫自國語日報）"
