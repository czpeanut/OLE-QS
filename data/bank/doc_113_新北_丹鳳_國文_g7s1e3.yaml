- id: doc_113_新北_丹鳳_國文_g7s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 「呀然」是吃驚的樣子，下列各項含有「然」字詞語的運用，何者最為恰當?
  options:
  - label: A
    content: 獨居的老人家沒有子孫承歡膝下，晚年生活總是「截然」一身
  - label: B
    content: 行經走廊的轉角處，遇見百分之百的女孩，不由得「悵然」心動
  - label: C
    content: 世界盃十二強棒球賽奪冠當下，台灣健兒不禁「潸然」相擁而泣
  - label: D
    content: 設計師以中國結飾和水墨畫裝潢，使得主人家的新居一片古意「黯然」
- id: doc_113_新北_丹鳳_國文_g7s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 下列哪一組朋友之間的交情最為淡薄?
  options:
  - label: A
    content: 春秋時代擅長彈琴的伯牙，有一位知音好友鍾子期，兩人形同「莫逆之交」
  - label: B
    content: 劉備、關羽、張飛三人在桃園結為「八拜之交」，從此以兄弟相稱
  - label: C
    content: 我和他算是「泛泛之交」，見面談論的話題大都與工作有關
  - label: D
    content: 媽媽和鄰居的漂亮阿姨，因為經常一起研究烹飪而成為「手帕之交」
