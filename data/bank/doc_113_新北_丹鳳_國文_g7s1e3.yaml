- id: doc_113_新北_丹鳳_國文_g7s1e3_s2_37
  section: 2
  number: 37
  type: single
  page: 4
  stem: 根據本文，喝酒時最重要的原則是什麼？
  options:
  - label: A
    content: 寫出好詩後，飲酒味道更醇美
  - label: B
    content: 為了促進酒的療效，需先服用藥物
  - label: C
    content: 酒量要少，並且要知所節制
  - label: D
    content: 呼朋引伴，可以使歡樂加倍
  group_stem: "古人常讚嘆「酒逢知己千杯少」，顯示酒能促進良好的人際關係，讓人能夠在喝酒後敞開胸懷之際，結交到更多志同道合的朋友。而「李白斗酒詩百篇」一句，更可以看出酒能使詩人墨客文思泉湧，也因此有了許多流傳千古的美文詩句。\
    \ \n    本草新編中有一段對酒的描述是這麼說的：「酒，味苦、甘、辛，氣大熱，有毒。無經不達，能引經藥，勢尤捷速，通行一身之表，高中下皆可至也。少飲有節，養脾扶肝，駐顏色，榮肌膚，通血脈。」\
    \ \n    酒顯然是個好東西，不但能通經舒脈，讓人氣血暢通，甚至能作為藥引，更甚者能讓飲用者脾肝受到滋養，進而呈現出美好的肌膚及臉色。但最重要的前提是要「少飲有節」。也就是說，少量的喝，有節制地喝，才是健康飲酒的最大原則。\
    \ \n               --（改寫自臺灣時報 2019-02-14）"
