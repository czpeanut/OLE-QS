  type: single
  page: 1
  stem: 下列選項「」中的字，何組字義兩兩相同?
  options:
  - label: A
    content: 「蓋」一癩蝦蟆也 / 英雄「蓋」世
  - label: B
    content: 以叢草「為」林 / 民以食「為」天
  - label: C
    content: 歷久「彌」新 /「彌」天大罪
  - label: D
    content: 二蟲「盡」為所吞 / 孤帆遠影碧山「盡」
  lesson_raw:
