    title: 兒時記趣
    basis: 兒時記趣一文中
- id: doc_113_新北_丹鳳_國文_g7s1e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 朋友相交一文，作者說:「和朋友來往，我喜歡簡單，談得來便多談，談不來則緘默。」這句話的情境最接近下列何者？
  options:
  - label: A
    content: 世人結交須黃金，黃金不多交不深
  - label: B
    content: 同是天涯淪落人，相逢何必曾相識
  - label: C
    content: 桃花潭水深千尺，不及汪倫送我情
  - label: D
    content: 酒逢知己千杯少，話不投機半句多
  lesson_raw:
    title: 朋友相交
    basis: 朋友相交一文
