  section: 1
  number: 20
  type: single
  page: 2
  stem: '根據朋友相交一文，作者對君子與小人交友之道的敘述，下列何者正確？


    | | 君 子 | 小 人 |

    | :--- | :--- | :--- |

    | (A) | 待友遮掩虛偽 | 待友純淨坦白 |

    | (B) | 對朋友心無所求 | 對朋友別有所圖 |

    | (C) | 交友親密熱情 | 交友情真意切 |

    | (D) | 無所不用其極，誠信俱可拋 | 講究誠信，不逾規矩 |'
  options:
  - label: A
    content: 君子：待友遮掩虛偽；小人：待友純淨坦白
  - label: B
    content: 君子：對朋友心無所求；小人：對朋友別有所圖
  - label: C
    content: 君子：交友親密熱情；小人：交友情真意切
  - label: D
    content: 君子：無所不用其極，誠信俱可拋；小人：講究誠信，不逾規矩
  lesson_raw:
    title: 朋友相交
    basis: 根據朋友相交一文
- id: doc_113_新北_丹鳳_國文_g7s1e3_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 美籍鋼琴演奏家魯賓斯坦對仰慕他的樂迷:「如果妳能一天練琴六到八個小時，並且心無旁騖地苦練許多年，妳的鋼琴就能彈得跟我一樣好。」請問他所強調的是何者的重要？
  options:
  - label: A
    content: 學海無邊，唯勤是岸
  - label: B
    content: 尺璧非寶，寸陰是競
  - label: C
    content: 言行相顧，慎終猶始
  - label: D
    content: 水到渠成，順其自然
