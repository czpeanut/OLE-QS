  section: 1
  number: 19
  type: single
  page: 2
  stem: 朋友相交一文中，作者引用許多名言俗諺來說理，下列何者說明正確?
  options:
  - label: A
    content: 「相交滿天下，知心有幾人」:知己易求，因緣相守
  - label: B
    content: 「君子之交淡如水」:君子志同道合，不會另懷居心
  - label: C
    content: 「君子之過也，如日月之蝕焉」:君子言行無懈可擊
  - label: D
    content: 「友直、友諒、友多聞」:對於結交損友的深切警惕
  lesson_raw:
    title: 朋友相交
    basis: 朋友相交一文中
