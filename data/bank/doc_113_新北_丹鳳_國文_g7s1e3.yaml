    | 戊 「白」手起家 | 己 「黑」箱作業 |

    | 庚 秋節「丹」楓 | 辛 玉貌「絳」脣 |

    | 壬 胸無點「墨」 | 癸 留蚊於「素」帳 |'
  options:
  - label: A
    content: 五個
  - label: B
    content: 六個
  - label: C
    content: 七個
  - label: D
    content: 八個
