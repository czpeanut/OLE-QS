  section: 1
  number: 25
  type: single
  page: 3
  stem: 「當你真心渴望某樣東西時，整個宇宙都會聯合起來幫助你完成。」(牧羊少年奇幻之旅) 請問這句話所代表的涵義，與下列何者最不相關？
  options:
  - label: A
    content: 天助自助者
  - label: B
