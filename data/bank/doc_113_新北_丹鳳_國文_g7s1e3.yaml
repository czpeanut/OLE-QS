  stem: 四個棒球國手練球之餘玩小詩猜謎，每個人唸出的小詩內容要符合「夏□成雷」中的□字，請問誰會答對呢?
  options:
  - label: A
    content: 傑憲:「驚鴻一瞥的靈感/在黝暗的飄忽追尋中/稍縱即逝」
  - label: B
    content: 鞏冠:「有一夜∕牠又在蠟燭上∕試著世界的溫暖∕卻被燒成灰燼∕永不回來」
  - label: C
    content: 坤宇:「在不同的脣吻間，游移/等待的愛/終是苦釀後的回甘」
  - label: D
    content: 家正:「感謝阿拉萬能的神/讓我在每個小老百姓的身上/都鑽到了一口/取之不盡/鮮紅的油井」
