  section: 2
  number: 35
  type: single
  page: 4
  stem: 根據文意判斷，這篇文章最有可能歸類在浮生六記的哪一篇章當中？
  options:
  - label: A
    content: 中山記歷
  - label: B
    content: 坎坷記愁
  - label: C
    content: 閨房記樂
  - label: D
