  stem: 關於下列細胞敘述何者正確？
  options:
  - label: A
    content: 神經細胞有許多突起，可以傳遞訊號到全身各部位，是動植物體內傳送訊息的重要細胞
  - label: B
    content: 口腔皮膜細胞形狀扁平，具有保護功能
  - label: C
    content: 保衛細胞為半月狀，兩兩一對負責保護植物內部構造
  - label: D
    content: 肌肉細胞形狀細長，因為具有細胞壁，所以當人體用力時，肌肉會變硬。
