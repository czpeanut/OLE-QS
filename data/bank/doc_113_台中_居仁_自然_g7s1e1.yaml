    你是否曾有吃鳳梨時，舌頭刺痛的經驗呢？日前網路上出現一則新聞，說明鳳梨割舌的原因是鳳梨細胞中含有許多尖銳的「針晶體」─草酸鈣結晶，會刺破我們的細胞而出現「割舌」的現象。這些結晶在顯微鏡下看起來就像是一把把鋒利的刀子一樣，搭配煞有其事的解說，幾乎讓人誤以為鳳梨細胞裡藏有刀子或細針。

    詢問專家後，他們認為這樣的說法缺乏科學根據。因為草酸鈣的結晶極其細微，微小到幾乎無法對細胞造成傷害。在這一則新聞影片中，將顯微鏡下的草酸鈣結晶特寫放大，卻未加以說明放大倍率，也沒有附上比例尺做參照，讓人誤以為草酸鈣結晶和細胞一樣巨大，能像針一樣把細胞刺破，造成迷思。其實只要在草酸鈣及鳳梨細胞的圖片旁，分別加上比例尺作為對照，就會發現以草酸鈣的微小，要傷害我們的細胞是不太可能的事；而另一方面，草酸鈣這種礦物結晶也並非鳳梨獨有，其他蔬果像是菠菜也有豐富的草酸鈣結晶，卻沒聽說有人因為吃這些蔬果而舌頭刺痛，足以說明草酸鈣並不是鳳梨割舌的主因。目前研究指出，造成不適感的原因是鳳梨中某種成分破壞口腔皮膜細胞，其中的「針晶體」則加強了這種不舒服的感覺。對圖片的科學觀察除了眼見為憑，也別忘了微觀世界中比例尺的重要性喔！【改自翰林閱讀素養-江家豪老師】'
