- id: doc_113_台中_居仁_自然_g7s1e1_s2_27
  section: 2
  number: 27
  type: single
  page: 2
  stem: 請問「海綿並非是典型的_______」，空格中應填入下列何者？
  options:
  - label: A
    content: 無生物
  - label: B
    content: 單細胞生物
  - label: C
    content: 多細胞生物
  - label: D
    content: 非生物。
  group_stem: '26-27 為題組

    海綿是我們生活中非常常見的清潔用品，但其實人類模仿大自然中的海綿所製造出來的。

    海綿不會移動又固著於海中，長久以來一直被歸類於植物，但科學家們發現海綿具有動物的基本特徵，所以在十九世紀的中期才將海綿歸類為動物。海綿並非是典型的_______，他們利用身上的許多小孔過濾海水，以此獲得養分及氧氣，海水流經過他們的身體時，也可帶走海綿體內的代謝廢物。海綿細胞雖然已經開始分化，卻沒有形成明顯的組織與器官，但海綿細胞卻共同捕食、分工消化，因此被認為是動物器官形成的開始。'
