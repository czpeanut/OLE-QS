  group_stem: '「汽油車要跑得遠，油箱要大顆；電動車要跑得遠，電池要大顆。」

    這不是廢話嗎？沒錯，不過電池一大顆，體積變大、重量變重，車子也需要變得更大更重，於是耗電又變更快，搞不好一來一往，裝了大顆電池以後，續航力反而變小。

    電池的材料與設計，當然就是要儲存電能，盡可能要提高「能量密度」，其定義為「…」，單位是「Wh/kg」，也就是「瓦×小時／公斤」。目前車用鋰電池，能量密度大約為
    250 Wh/kg，僅為汽油能量密度的50 分之1，雖然電動車的能源轉換效率比汽油車的引擎來得高，不過還是很難弭平這個落差。因此找到能量密度更高、而且安全的材料來製造車用電池，是當務之急。'
  answer:
