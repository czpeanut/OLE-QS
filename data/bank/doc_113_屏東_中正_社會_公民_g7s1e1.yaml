- id: doc_113_屏東_中正_社會_公民_g7s1e1_s2_24
  section: 2
  number: 24
  type: single
  page: 4
  stem: 下列何者符合文中所述？
  options:
  - label: A
    content: 2023 年之前，政府制定的法律已經相當完備，能充分保障性別平權
  - label: B
    content: 權勢性騷擾是偶發事件不需重視
  - label: C
    content: 2023 年修法後，性騷擾受害人可向加害人請求懲罰性賠償金
  - label: D
    content: 性騷擾申訴案件多但裁罰件數少，可見2023 年修法後成效有限。
  group_stem: '現行性平三法的立法時間，分別是2002 年《性別工作平等法》、2004 年《性別平等教育法》、2005 年《性騷擾防治法》，三法各自在不同時間修正過，但三法分治，有不同的適用對象與範圍，難免有規範及管轄權不明等灰色地帶問題。

    2023 年政府跨院跨部會修正性平三法，權勢性騷擾是此次修法的重點。任何場域涉及權勢性騷擾者，都加重刑度、罰鍰與賠償金額，同時提供受害者更具保護性的申訴管道，以及明確的申訴窗口。至於最常見的職場性騷擾，過去上司對下屬的性騷擾事件，被害者往往因為擔心工作或影響生計，不敢反抗或求助，尤其《性別平等工作法》過去並未明確規範雇主涉及性騷擾的處罰機制。修訂後新增雇主為性騷擾行為人時，可罰款之外，受害人可向雇主加害人請求3~5
    倍的懲罰性賠償金，向權勢加害人請求1~5 倍賠償金，目的是遏止性騷擾行為人再犯。

    前年性騷擾事件申訴案2086 件，比2017 年的662 件成長3 倍，顯示被害人意識提高，也較願意站出來申訴，但性騷擾裁罰件數只有489 件，總罰金只有911
    萬元，顯示過去性騷擾案難以有效裁罰加害人。'
