  - label: A
    content: 警方打擊犯罪，應採強制手段壓制嫌犯
  - label: B
    content: 即使是嫌犯，也不能侵害他的基本權利
  - label: C
    content: 過度強調人權，將不利於維護社會秩序
  - label: D
    content: 當嫌犯遭到逮捕，基本人權已交至律師手上。
