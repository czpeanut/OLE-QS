  stem: 「有學者指出即使女性教育水準已大大提升，男女之間的薪資鴻溝仍難以跨越。女性大多從事幼教、住宿餐飲業、社會工作等，薪資敬陪末座，即使這些工作也要求具備相當技術且身負托育或社會安全重任，但具有女性標籤的工作價值仍被忽視。另外有些學者則看見某些打破性別障礙的女性領導者，便武斷的認為性別薪資差距不存在，且將薪資差距歸因於女性不願意從事需要體力的工作，但女性往往因敵意工作環境等因素，選擇退出或排斥進入這類技術藍領行業。」上述內容中的學者對於性別薪資不同有各自的看法，但都可以自由公開的討論。這樣的溝通與交流最符合哪一個公民德性的精神？
