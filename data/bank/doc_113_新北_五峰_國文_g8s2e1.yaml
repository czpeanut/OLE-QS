- id: doc_113_新北_五峰_國文_g8s2e1_s1_31
  section: 1
  number: 31
  type: single
  page: 3
  stem: 文中畫雙線處的說明，選出正確者
  options:
  - label: A
    content: (1)—強調塗鴉藝術具有強大且能應變的市場壟斷現象
  - label: B
    content: (2)—點明日本塗鴉工作者如何在創作的夾縫中求生存
  - label: C
    content: (3)—指出藝術的影響力因地域文化的不同而有所差異
  - label: D
    content: (4)—說明塗鴉藝術展現的場域不同，但核心價值不變
  group_stem: '「塗鴉」一詞來自英文的Graffiti，最早是古代牆上的壁畫書寫，是藝術史研究的對象。專精塗鴉研究的台大教授畢恆達說:「都市空間裡的塗鴉文化，要歸根到1960
    年代美國的費城跟紐約，最早的塗鴉形式即是簽名，這和美國當時的幫派塗鴉有關。」美國是移民社會，大量的種族衝突反映在居住空間上，幫派會在牆面簽字以劃清地盤。爾後一些生活於都會外緣的社會邊緣人，他們用塗鴉表達個人意見、宣洩情感、抨擊批判社會的不公或歧視，展現一種反叛與非主流的精神和態度，因此，早期的街頭塗鴉並不被視為一種藝術。

    隨著全球化，人口移動以及報章雜誌、電影等文化媒介的傳播，台灣在20 世紀末開始興起塗鴉。1995 年開始接觸塗鴉的Reach，是台灣塗鴉客的先鋒之一。而塗鴉在發展過程中也逐漸形成另類的街頭藝術。

    擁有設計師、藝術策展人多重身分的他認為，以塗鴉為出發點的創作者，重視個人風格大於一切，「每種藝術自然都重視風格，但學油畫的第一件事是基本技法、學攝影的第一件事是機器操作，而塗鴉直接面對的就是個人風格。這跟街頭文化的氛圍有關，沒有個人風格就只是在copy
    別人。」(1)強烈的個人風格，也是塗鴉與其他藝術領域競爭的利器。塗鴉藝術家布雷克分析，10 個塗鴉客就有10 種不同風格，對客戶來說就有10 種選擇。塗鴉原是年輕人的文化，它快速、鮮明，跟著流行的脈動走，能即刻反映當下最潮的元素、風格和顏色。這是因為塗鴉源於街頭，與街舞、滑板、嘻哈音樂等有深刻的連結，布雷克也自然走上為樂團專輯設計封面的道路。Reach
    坦言，當年舉辦塗鴉展時被罵得很慘，被質疑辦展太過商業，也違反塗鴉精神，但現在哪個國際知名的塗鴉人不辦展？於是，塗鴉流於商業化的議題浮上檯面。(2)日本很多塗鴉前輩同時接商業案，也在街上keep
    running，他們擁有2∼3 個名字轉換身分。放眼望去，LV、DIOR、GUCCI、FENDI、Nike、Adidas、PUMA 等品牌大廠，都可以發現融合塗鴉的設計元素，如同在街頭轉角隨時都能遇見塗鴉，現今的塗鴉創作以更多元的型態出現在我們的生活。畢恆達認為，「塗鴉的影響比其他藝術都還大，沒有任何一種藝術形式能用大規模的方式占領都市空間。(3)我們說畢卡索很厲害，但畢卡索不可能影響到台北街頭。」(4)跨進主流聚光燈下的塗鴉，看似改變了許多，但其實甚麼也沒變。不論街頭還是美術館，精品還是專輯設計，都是塗鴉客的創作場域，他們依舊顛覆傳統，未來也會帶來更多驚喜。(塗鴉的逆襲  改寫自
    網路文章)'
