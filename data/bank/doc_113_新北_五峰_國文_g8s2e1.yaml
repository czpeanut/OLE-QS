- id: doc_113_新北_五峰_國文_g8s2e1_s1_18
  section: 1
  number: 18
  type: single
  page: 1
  stem: 「一般海豚的眼睛很難看到，得在牠們刻意翻身近距離和你對望時，才能有機會看入牠的眼神。……然而弗氏海豚的眼睛非常容易看到，只要牠們跳出水面，就像每一個玩具布偶總是少不了圓睜睜的眼睛。我了解，我所看到的只是牠們的一個符號標記，那並不是牠們真正的眼睛。……對於弗氏海豚，我始終無法感受牠的眼神，牠們太倉卒、太慌亂……」
