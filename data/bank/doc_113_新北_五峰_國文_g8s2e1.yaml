  - label: D
    content: 尾聯——表達螳螂捕蟬，黃雀在後的微妙關係
  group_stem: "(甲) 病蟬飛不得，向我掌中行。\n  折翼猶能薄①，酸吟尚極清②。\n露華凝在腹，塵點誤侵睛。\n黃雀並鳶鳥，俱懷害爾情。    \
    \        (賈島 病蟬)\n注①薄：同「搏」，拍打，搏擊\n②酸吟：痛苦呻吟。形容蟬鳴。極清：餐風飲露，表示高潔\n\n(乙) 島，字浪仙，范陽人。初為浮屠③，名無本。來東都，時洛陽令禁僧午後不得出，島為詩自傷。愈憐之，因教其為文，遂去浮屠，舉進士。當其苦吟，雖逢值公卿貴人，皆不之覺也。累舉，不中第。文宗時，坐飛謗，貶長江主簿。會昌初，以普州司倉參軍遷司戶，未受命卒。(新唐書)\n\
    \     注③浮屠:此指出家\n\n(丙) 島久不第，吟《病蟬》之句，以刺公卿。或奏島與平曾等為「十惡」，逐之。(唐詩記事)"
