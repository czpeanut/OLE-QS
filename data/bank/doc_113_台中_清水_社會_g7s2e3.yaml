- id: doc_113_台中_清水_社會_g7s2e3_s3_31
  section: 3
  number: 31
  type: single
  page: 3
  stem: 全國國土計畫有四大功能分區，根據上述新聞報導，計畫展延後，哪一個分區正在被逐漸消失中？
  options:
  - label: A
    content: 城鄉發展地區
  - label: B
    content: 農業發展地區
  - label: C
    content: 國土保育地區
  - label: D
    content: 海洋資源地區。
  group_stem: '藍綠聯手 三讀通過國土計畫最遲2031年上路

    內政部：民間申請土地變更案暴增

    2024年12月31日

    環境資訊中心記者 袁慧妍報導

    國土計畫法定原定2025年5月前全面上路，立法院趕在2024年12月31日審議部分條文修正草案，藍綠白三黨均有提案要求展延，表決後三讀通過國土功能分區圖作業期程再延六年。

    發言表達反對延期的則有民進黨原住民立委伍麗華。她稱，1974年《區域計畫法》上路時，因未調查就訂立，令許多原民地區建物變成「非法建築」，本來有望在2025年5月《國土計畫法》上路後，《原住民土地管理規則》也能公告，原民建物可申請合法化，但展延恐怕將令希望破滅。

    地球公民基金會副執行長黃靖庭根據國土署的資料，2024年平均每個月都有50件農地變更非農業用途的申請案，土地破碎化的狀況非常嚴重。'
