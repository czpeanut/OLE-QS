    臺中市政府勞工局為協助中高齡、二度就業婦女等特定對象及就業弱勢者就業，持續走進社區，結合在地資源，與民間團體合作辦理就業促進講座及設攤宣導活動，希望可以補足企業勞動力缺口。其中「55Plus就業促進措施」，針對55歲以上或年滿45歲退休者，只要離開職場連續達3個月以上，至臺中市立就業服務機構辦理求職登記，並經諮詢後順利就業，受僱滿6個月最高獎勵可達6萬元。'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
