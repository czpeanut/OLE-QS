  - label: D
    content: 國土計畫法。
  group_stem: '茭白筍之鄉|水源地遇上掩埋場

    2025-05-09

    南投縣埔里鎮，擁有台灣八成以上的茭白筍產量，且以清澈、甘甜的水質聞名。然而，在這片滋養無數農作物的水源上游，有座私人興辦的事業廢棄物掩埋場，正在申請土地變更，準備設立，讓居民十分擔心。

    麒麟里里長黃茂寅憂心，除了ㄧ般廢棄物，可能還包括焚化爐飛灰或爐碴等有毒的廢棄物，加上掩埋場的場址是一個自然形成的窪地，雨水會往下流入南港溪，一旦廢水往下滲透，會對當地水源造成很大的污染。'
