- id: doc_113_台中_四育_社會_公民_g9s1e3_s5_34
  section: 5
  number: 34
  type: single
  page: 4
  stem: 依據上文判斷，兌換下列何國貨幣的匯率最高?
  options:
  - label: A
    content: 英鎊
  - label: B
    content: 港幣
  - label: C
    content: 美金
  - label: D
    content: 澳幣
  group_stem: '根據以下資料請回答問題:


    許多人會擔任國際志工，在出國前可先至銀行兌換準備前往服務國家的外幣。由於各家銀行給的匯率不同，在兌換前可以先查看哪家最划算。盡量不要在機場兌換，因為機場匯率通常較差。

    如果是在國內先換好外幣帶在身上，就要注意各家銀行現金匯率。以附圖為例，若要換美金，1美金要用30.985元新臺幣兌換。

    假如在國內沒有提供兌換該國貨幣的服務，可以先換取流通性較高的外幣，到當地再兌換。除了到時候兌換方便外，有些額外行程也可利用美金來付款。而兌換時記得以大面額為主，因為到了當地銀行，面額大的匯率會比面額小的來得佳。假如要攜帶信用卡或是國際提款卡，一定要確認卡片已經開卡，也要確認可以在即將前往的國家消費或提款。

    (資料來源:改寫自1.國際工作營，【國際工作營的行前8大Tips】- Tips 3:打包你的行李，國際工作營網站，2020/03/12。2.臺灣銀行，歷史匯率收盤價，掛牌時間:2023/01/05
    15:29，臺灣銀行網站，2023/01/05。3.馬哈，全家出國不是只有玩!「換錢」可讓孩子見識不同貨幣，親身體驗「匯率」是什麼!，風傳媒網站，2019/09/04。)'
