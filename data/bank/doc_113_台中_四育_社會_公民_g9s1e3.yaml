- id: doc_113_台中_四育_社會_公民_g9s1e3_s4_32
  section: 4
  number: 32
  type: single
  page: 4
  stem: 根據上文，以下哪一項最能描述雷諾提到的「非勞動力」與「失業者」之間的關係？
  options:
  - label: A
    content: 兩者的定義完全不同，無法相互替換
  - label: B
    content: 兩者之間只有時間長短的差異，沒有其他區別
  - label: C
    content: 兩者的區別只是是否積極尋找工作，並無明確標準
  - label: D
    content: 兩者都是完全沒有工作的人，沒有任何區別
  group_stem: '經濟學者雷諾曾經提到，什麼是失業人口？什麼是非勞動力？在統計上，這兩個概念常常存在模糊的界線。像是，如果一個求職者一週前還在積極找工作，但現在稍作休息，他自己和家人可能會認為自己是失業者，但政府卻可能把他歸類為「非勞動力」，也就是那些有意願工作卻沒有積極尋找工作的人。這樣看來，非勞動力與失業者之間，其實只差一線之隔。

    再來，假設有一份工作要求應徵者當「營運總監」，全天候隨叫隨到，且不支付薪水。你認為會有人應徵嗎？其實，這種情況在家庭中並不罕見，尤其是家庭主婦或家庭主夫。他們的工作雖然不會獲得薪水，但他們卻是在家中「打理一切」，如同在做一份沒有薪水的全職工作。

    當家庭主婦或家庭主夫，被稱為”家管”的角色，對家人表達不滿時，往往會被認為是情緒失控，而不是在為自己爭取應有的權益。回顧，2020 年因為防疫措施，許多人開始在家工作，家庭成員相處的時間增加，卻也讓原本的生活平衡打破。對家中的家管來說，他們的休息時間變得更少，還得照顧在家工作的配偶。有時，看到配偶對外工作時表現耐心和溫和，卻用另一個態度對家人，這讓家管感到失望和不滿，讓家庭成員之間的關係變得更緊張。'
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 公民
      code: 4-1
      title: 勞動參與的重要性
      chapter: 第4章 勞動參與
    textbook: 九上公民 4-1 勞動參與的重要性
