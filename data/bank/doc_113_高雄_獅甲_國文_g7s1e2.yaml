- id: doc_113_高雄_獅甲_國文_g7s1e2_s5_31
  section: 5
  number: 31
  type: single
  page: 3
  stem: 據作者推測，這棵樹在成長過程中，不會受到什麼威脅？
  options:
  - label: A
    content: 風
  - label: B
    content: 陽光
  - label: C
    content: 頑童
  - label: D
    content: 汙濁的空氣
  group_stem: "(一)有一棵樹   鄭 頻 \n  有一棵樹，就在靠近火車站的大馬路上。第一次看到它的時候，只是一棵小小的樹，依附在一根小竹竿上，一副弱不禁風的模樣，著實令人為之擔憂。馬路上，車多人擠，它僅有的幾片樹葉也早已枯黃，隨時都能因風委地。我心想：它若不毀於頑童之手，只怕這汙濁的空氣，也將威脅它的生長。\
    \ \n  之後，好久不再經過火車站，那棵樹的影子也在記憶裡逐漸淡去…… \n  今日，我又再度看到它，竟發覺：它已亭亭直立，大異昔日。陽光下，有它細碎的身影，碧綠的葉片彷彿上了一層亮麗的釉彩。環境的惡劣竟阻遏不了它求生的欲望。它成長，充滿了生氣。模糊之間，也依稀看到它不屈的毅力，面對險阻，也終究戰勝了險阻。"
