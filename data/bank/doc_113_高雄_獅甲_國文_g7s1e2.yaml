- id: doc_113_高雄_獅甲_國文_g7s1e2_s4_1
  section: 4
  number: 1
  type: single
  page: 1
  stem: "品茗居中有四大招牌茶飲，分別為：龍井、凍頂烏龍、鐵觀音與紅茶。以下是此四種茶的簡介： \n1.龍井：茶湯色澤呈翠綠或是碧綠色，茶香為清香味，尾韻略帶苦澀。為未發酵茶。\
    \ \n2.凍頂烏龍：茶湯呈金黃色，茶香甘醇濃香。為半發酵茶。 \n3.鐵觀音：茶湯呈現琥珀色，茶香帶有甘醇的果香味。為四分之三發酵茶。 \n4.紅茶：茶湯呈現朱紅色，茶香甜香甘醇。為完全發酵茶。\
    \ \n \n舒華喜歡味道甘醇的茶湯，再加上舒華的胃不好，不能喝發酵程度低的茶。店員特別向舒華推薦了其中一款茶葉，然而舒華卻忘了茶葉品名，只曉得其茶湯為清淡透徹，略顯金黃。請問店員最有可能推荐舒華何種茶飲？"
  options:
  - label: A
    content: 龍井
  - label: B
    content: 凍頂烏龍
  - label: C
    content: 鐵觀音
  - label: D
    content: 紅茶
