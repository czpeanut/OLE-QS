- id: doc_113_高雄_獅甲_國文_g7s1e2_s5_34
  section: 5
  number: 34
  type: single
  page: 3
  stem: 根據本文，關於世界各地吃冰的歷史，下列何者說法正確？
  options:
  - label: A
    content: 中國的帝王領先其他地區，知道享受夏日吃冰的樂趣
  - label: B
    content: 亞歷山大大帝是世界上最早開啟吃冰歷史的人
  - label: C
    content: 奶製的冰淇淋正是馬可孛羅在中國旅行時意外發明的
  - label: D
    content: 美國人將他們製冰技術傳至中國，目的用來招待嘉賓
  group_stem: "(二)生活科技——吃冰簡史（節錄）   陳雅茜 \n  現代人吃冰是理所當然的一件事，不過古人沒有冰箱怎麼吃冰呢？西元前第四世紀的亞歷山大大帝與第一世紀的羅馬暴君尼羅，都是在冬天派人山上取冰，加入蜂蜜、水果後享用。\
    \ \n  不過中國人吃冰吃得更早。幾千年前，中國的帝王已經知道享受夏天吃冰的樂趣。他們在冬天把冰塊存入地窖，等到夏天再取出來享用。到了一千多年前，唐朝人發現硝石溶於水可以吸熱，把水溫降到冰點，於是夏天製冰變成了一件可能的事。\
    \ \n  元朝時出現了奶製冰品，與現代的冰淇淋類似。傳說中，馬可孛羅十三世紀到中國旅行時，才把冰品的配方帶回歐洲。 \n  冰淇淋原本是皇親貴族用來款待佳賓的美食。十七世紀的英王查理一世為了保有冰淇淋的秘密，不惜花費重金收買廚師。十九世紀初，美國\
    \ 麥迪遜總統就職時，也特別端出了冰淇淋這道美食，以饗賓客。"
