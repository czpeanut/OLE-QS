- id: doc_113_高雄_獅甲_國文_g7s1e2_s4_3
  section: 4
  number: 3
  type: single
  page: 1
  stem: 「三國時候，魏國有個人叫盧毓，為官清正，很受魏明帝信任。當時選拔官吏，一般是憑人推薦，而推薦者往往只推薦有名的人物，因此魏明帝很不滿意。在選拔中書郎時，魏明帝就下令說：『這次選拔，要由盧毓來推薦。選拔的人不要只看名聲。名聲就像在地上畫個餅一樣，其實是不能吃的啊！』後來『畫餅充飢』用來比喻用空想來作自我安慰，或者用來說明虛名是沒有實際用處的。」本文是成語「畫餅充飢」的典故說明，其最有可能收錄在下列哪一個網站中？
  options:
  - label: A
    content: 教育部 成語典
  - label: B
    content: 教育部 國語小字典
  - label: C
    content: 教育部 國語辭典簡編本
  - label: D
    content: 教育部 重編國語辭典修訂本
