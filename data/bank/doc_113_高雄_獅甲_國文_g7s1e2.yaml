  stem: 「那條鯨於太陽沉落在海峽彼端時進入近海海域，不久之後就迷航了。夜色十分平靜，是真正的熱帶景觀，空中瀰漫著澄澈的霧，在月亮四周形成一大圈柔和而完整的光暈，大海只因海水升漲而微有動蕩。牠繼續曲折前進，眼前是一片閃爍的海波，不久月亮隱去了，天海之間是神祕而可怖的黑暗。」小明閱讀完本文後，做出以下筆記：「藉由光線的變化描寫，作者營造出什麼樣的情境？」小明最可能運用了下列何種閱讀策略？
