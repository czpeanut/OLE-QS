- id: doc_113_新北_崇林_數學_g7s2e3_s1_25
  section: 1
  number: 25
  type: single
  page: 4
  stem: "漏窗又稱花窗，是中國建築中獨特的藝術設計。其施造方法通常是在牆上預留空間，利用紮筋支撐主體並以土石或磚瓦磨製輪廓，然後鑲嵌於牆面，再以泥塑勾勒將細部樣貌塗勻，最後敷彩，除了磚瓦製作的漏窗，亦有以木條材料組成各種形狀的漏窗。\n\
    \  漏窗窗框的形式有方、橫長、直長、圓、六角、扇形及其他各種不規則形狀，而矩形窗框除了做成方角以外，又有圓角與海棠紋等形式。漏窗花樣繁多，不僅美觀，還有通風及採光的作用。\n\
    \  位於新北市 板橋區的林本源園邸，園林中處處可欣賞漏窗，其設計表現出對吉祥如意的精神寄託，也是古典建築工藝的美學成就，透過漏窗意識形態展現，不僅能凝結中華文化雕塑工藝美學，更是古蹟保存的精髓所在。\n\
    Q:下列為歐歐一行人參觀林本源園邸時所拍下的部分漏窗，如下圖(1)(2)(3)(4)哪些是線對稱圖形？（只考慮漏窗部分）"
  options:
  - label: A
    content: (1)&(4)
  - label: B
    content: (2)&(3)
  - label: C
    content: (2)&(4)
  - label: D
    content: (3)&(4)
