- id: doc_113_屏東_明正_社會_g7s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 文中提到：「臺灣位在歐亞大陸東側邊緣，西側臺灣海峽較淺，東部緊鄰較深的太平洋」。請問︰這種表達位置的方式與下列哪一種相同？
  options:
  - label: A
    content: 小東坐在教室的第三排第二列
  - label: B
    content: 宜蘭市位於地圖(3，B)的地方
  - label: C
    content: 臺灣總統府位於(25°N,121.5°E)
  - label: D
    content: 小光坐在小東的西南方。
  group_stem: 臺灣位在歐亞大陸東側邊緣，西側臺灣海峽較淺，東部緊鄰較深的太平洋，因此在臺灣與歐亞大陸相連的冰河時期，物種遷徙停止在此，無法再往東邁進。待冰河退去，這些生物最終定居在臺灣並繁衍後代。臺灣與歐亞大陸因臺灣海峽的隔絕，再加上高山阻擋，造成基因隔離，隔離時間久了，生物與其他族群缺乏基因交流，就可能促使亞種分化或是演化出新的物種。
