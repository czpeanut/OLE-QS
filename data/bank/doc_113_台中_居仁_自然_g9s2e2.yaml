  type: single
  page: 2
  stem: '已知甲烷和甲醇與足量的氧氣反應，生成物皆為二氧化碳和水，反應式如下：

    反應一：$CH_4＋2O_2 \rightarrow CO_2＋2H_2O$

    反應二：$2CH_3OH＋3O_2 \rightarrow 2CO_2＋4H_2O$

    若分別進行此兩種反應，且完全反應後所得到的生成物總質量相同，則關於反應物的比較，下列敘述何者正確？（原子量：H＝1、C＝12、O＝16）'
  options:
