- id: doc_113_台中_居仁_自然_g9s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '阿問以手施一大小為 F 的作用力，水平向東推木樁，木樁仍然立著不動，手受到木樁回推一個反作用力。

    阿春、阿偉兩人對於木樁受力後仍然靜止不動的狀態及原因解釋如下：

    阿春：木樁保持靜止不動，是因為  F 比其反作用力的大小來得小，所以阿問無法推動木樁。

    阿偉：木樁保持靜止不動，是因為 F 與其反作用力的大小相同、方向相反，恰好互相抵消。

    於兩人的描述正確與否，下列何者正確？'
  options:
  - label: A
    content: 兩人皆正確
  - label: B
    content: 兩人皆不正確
  - label: C
    content: 阿春正確，阿偉不正確
  - label: D
    content: 阿春不正確，阿偉正確。
