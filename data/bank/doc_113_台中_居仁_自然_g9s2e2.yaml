- id: doc_113_台中_居仁_自然_g9s2e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: '四位學生分別對「可導電的物質」或「電解質」的說明如下：

    曉芬：「可導電的物質都是純物質。」

    惠心：「可導電的物質都可以溶於水。」

    欣怡：「電解質溶於水後，其水溶液都靠電子移動導電。」

    宜庭：「電解質溶液內含有的正、負離子總電量都相等。」

