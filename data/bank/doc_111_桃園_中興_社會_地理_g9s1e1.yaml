  group_stem: "題組\n    仰賴打獵、採果子的生活就一定貧困又落後嗎？人類學家的在地調查發現，生活在漠南非洲喀拉哈里盆地的部落民族，長期維持採集與狩獵的生活，每週只需勞動15\
