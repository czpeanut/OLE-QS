  group_stem: '【題組III】

    The Horse That Fell into a Well

    One day, a farmer''s old horse fell into a well. The horse was lucky because there
    was no water in the well. However, the well was too deep for the horse to get
    out of. The farmer felt bad for the horse, but he didn''t know how to save it.
    He then decided to bury it in the well because neither the old horse nor the dry
    well was useful to him anymore.

    The farmer had his friends come to help him throw dirt into the well. The horse
    started to cry when it saw what was happening. But suddenly, an idea came to its
    mind. Every time the dirt hit its back, the horse would shake it off and walk
    on it. Finally, enough dirt was thrown into the well, and the horse was able to
    jump out. The horse didn''t give up when it was being buried. Instead, the horse
    found a way to save itself. The lesson of the story is simple: when life gives
    you lemons, make lemonade.

