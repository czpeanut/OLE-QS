  - label: B
    content: 虛構
  - label: C
    content: 寄寓性
  - label: D
    content: 歷史性
  group_stem: "( 一 ) 冷眼看人間──古代寓言笑話簡說（改寫）\n 寓言是中國文化不可忽視的一部分，它具有獨特的藝術魅力和生命力。\n 寓言源於比喻，人們常用比喻的方式，表達自己的觀點。但比喻雖有寄託，卻沒有故事情節，表現力有限。因此，人們進而虛構一個故事來做比方，傳達自己的想法，故事有形象與情節，較能引人入勝，影響力就擴大了。\n\
    \ 現在我們能見到的最早的寓言，出於左傳的記載。陳國內亂，騷擾到楚國邊境，楚莊王想藉此起兵滅陳，大夫申叔時說：「牽牛以蹊人之田，而奪之牛。牽牛以蹊者，信有罪矣，而奪之牛，罰已重矣。」申叔時為了勸阻楚王滅陳，而虛構了這個小故事，勉強可以算作一篇粗具型態的小寓言了。\n\
    注：①蹊：音ㄒㄧ，踐踏。"
