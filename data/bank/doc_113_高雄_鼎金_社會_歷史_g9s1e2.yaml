- id: doc_113_高雄_鼎金_社會_歷史_g9s1e2_s1_26
  section: 1
  number: 26
  type: single
  page: 1
  stem: 「拜占庭帝國的皇帝對教會有極大影響力，他可以任命主教，過問教會的教義和儀式問題，也可以召開並主持重要的宗教相關會議。」請問：上述反映拜占庭帝國何種現象？
  options:
  - label: A
    content: 政教衝突
  - label: B
    content: 政教合一
  - label: C
    content: 教權至上
  - label: D
    content: 政教分離。
- id: doc_113_高雄_鼎金_社會_歷史_g9s1e2_s1_27
  section: 1
  number: 27
  type: single
  page: 1
  stem: 中古時期的歐洲，有人稱其為「黑暗時代」，當時哪一個宗教在此時超越國家、民族，成為西方世界的一盞明燈？
  options:
  - label: A
    content: 佛教
  - label: B
    content: 伊斯蘭教
  - label: C
    content: 基督教
  - label: D
    content: 猶太教。
- id: doc_113_高雄_鼎金_社會_歷史_g9s1e2_s1_28
  section: 1
  number: 28
  type: single
  page: 1
  stem: 拜占庭帝國自四世紀末羅馬帝國分裂後形成，宗教信仰在帝國內亦有不同的發展。下列敘述何者正確？
  options:
  - label: A
    content: 因基督教分裂而全面信奉天主教
  - label: B
    content: 採政教分離制度
  - label: C
    content: 主要信奉希臘正教
  - label: D
    content: 萬神殿是其特色的宗教建築。
- id: doc_113_高雄_鼎金_社會_歷史_g9s1e2_s1_29
  section: 1
  number: 29
  type: single
  page: 1
  stem: 文藝復興是歐洲史上的一個重大變革，它標誌著歐洲文化的轉型，也是邁向近代的開端。請問：下列關於文藝復興的敘述，何者正確？
  options:
  - label: A
    content: 完全是復古，全面恢復古希臘、羅馬文化
  - label: B
    content: 從義大利開始，因為義大利商業復甦、城市興起
  - label: C
    content: 拜占庭帝國的學者為躲避日耳曼民族而將文獻西遷
  - label: D
    content: 這個活動由國王發起，是個由上而下的活動。
- id: doc_113_高雄_鼎金_社會_歷史_g9s1e2_s1_30
  section: 1
  number: 30
  type: single
  page: 1
  stem: 文藝復興的核心除了復古之外，更在於創新，許多文化在此時慢慢成形。請問：以下何者並非是文藝復興的「創新」？
  options:
  - label: A
    content: 人文主義興起，不再將上帝視為人生唯一的追求
  - label: B
    content: 以神為中心思想，追求來世的幸福
  - label: C
    content: 作家以各地方言進行文學、劇本的創作
  - label: D
    content: 以人為本，肯定人的尊嚴。
- id: doc_113_高雄_鼎金_社會_歷史_g9s1e2_s1_31
  section: 1
  number: 31
  type: single
  page: 1
  stem: 西元1984 年，美國漫畫《忍者龜》出版，主角是四隻基因變異的青少年烏龜，他們居住在紐約市曼哈頓的地下水道，並與黑道、惡霸、變異生物及外星入侵者戰鬥。這四隻忍者龜的名字分別是：李奧納多、拉菲爾、多納太羅、米開朗基羅。請問：漫畫家應該是參考哪一個時代的著名人物來命名？
  options:
  - label: A
    content: 希臘化時代
  - label: B
    content: 文藝復興時代
  - label: C
    content: 羅馬帝國時代
  - label: D
    content: 古埃及時代。
- id: doc_113_高雄_鼎金_社會_歷史_g9s1e2_s1_32
  section: 1
  number: 32
  type: single
  page: 1
  stem: 史家表示：「歐洲的中古時期走向黃昏，來自於部分地方的崛起，商業高度發達，帶來了另外一個文化的出現。」請問：上述提到「部分地方」指的應是附圖中的哪裡？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
  assets:
  - key: s1_32_f1
    kind: figure
    file: doc_113_高雄_鼎金_社會_歷史_g9s1e2/s1_32_f1.png
