questions:
- id: doc_113_高雄_鼎金_社會_歷史_g9s1e2_s1_21
  section: 1
  number: 21
  type: single
  page: 1
  stem: 八世紀時，中國某個朝代為了管理某族群來華貿易的事業，遂在港口設置市舶司。該族群除了將中國的絲綢運回國內販售，亦將東方的知識與技術，如造紙術、指南針等向西方傳播。請問：上述的中國朝代為何？來華的族群又是指何者？
  options:
  - label: A
    content: 漢朝；歐洲人
  - label: B
    content: 漢朝；阿拉伯人
  - label: C
    content: 唐朝；歐洲人
  - label: D
    content: 唐朝；阿拉伯人。
- id: doc_113_高雄_鼎金_社會_歷史_g9s1e2_s1_22
  section: 1
  number: 22
  type: single
  page: 1
  stem: 隨著新型冠狀病毒席捲全球，各地的人口移動皆受影響，連伊斯蘭教的聖地麥加亦受波及，西元2021 年到麥加朝聖的信徒不如以往人山人海的盛況。下列關於伊斯蘭教發展的敘述，何者正確？
  options:
  - label: A
    content: 由蘇美人所建立
  - label: B
    content: 信奉阿拉為唯一真神
  - label: C
    content: 為推廣信仰，積極翻譯《聖經》
  - label: D
    content: 因強調底層至上，獲得底層民眾喜愛。
- id: doc_113_高雄_鼎金_社會_歷史_g9s1e2_s1_23
  section: 1
  number: 23
  type: single
  page: 1
  stem: 七世紀以後，拜占庭帝國力抗外族的入侵，成為基督教世界與西歐地區的屏障，也是東西交流的孔道，直到西元1453年才被消滅。請問：擊敗拜占庭帝國的勢力為下列何者？
  options:
  - label: A
    content: 大唐帝國
  - label: B
    content: 伊斯蘭教勢力
  - label: C
    content: 印度
  - label: D
    content: 匈奴。
- id: doc_113_高雄_鼎金_社會_歷史_g9s1e2_s1_24
  section: 1
  number: 24
  type: single
  page: 1
  stem: 下列哪一支民族在十四、十五世紀時迅速擴張，除了消滅拜占庭帝國，還攻占巴爾幹半島、北非等地，進而成為西方世界的威脅？
  options:
  - label: A
    content: 匈奴人
  - label: B
    content: 蒙古人
  - label: C
    content: 塞爾柱土耳其人
  - label: D
    content: 鄂圖曼土耳其人。
- id: doc_113_高雄_鼎金_社會_歷史_g9s1e2_s1_25
  section: 1
  number: 25
  type: single
  page: 1
  stem: 附圖是八世紀時，一個橫跨歐、亞、非三洲帝國的疆域圖，關於這個帝國的敘述，下列何者正確？
  options:
  - label: A
    content: 此帝國為拜占庭帝國
  - label: B
    content: 這個帝國起源於阿拉伯半島
  - label: C
    content: 這個帝國建立希臘化文化
  - label: D
    content: 這個帝國引發亞歷山大東征。
