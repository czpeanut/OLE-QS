- id: doc_113_高雄_鼎金_社會_歷史_g9s1e2_s1_33
  section: 1
  number: 33
  type: single
  page: 2
  stem: 十四世紀，義大利學者能再度接觸到古希臘、羅馬文化，而揭開文藝復興的序幕，乃是因下列何種媒介？
  options:
  - label: A
    content: 日耳曼人、阿拉伯人
  - label: B
    content: 羅馬教會、鄂圖曼土耳其學者
  - label: C
    content: 拜占庭學者、鄂圖曼土耳其商人
  - label: D
    content: 拜占庭學者、阿拉伯人。
- id: doc_113_高雄_鼎金_社會_歷史_g9s1e2_s1_34
  section: 1
  number: 34
  type: single
  page: 2
  stem: 銀行是當代社會重要的金融機構，銀行的英語「Bank」一詞是來自□□的語言「Banca」，□□是歐洲商業最早復甦的地區，也成立了世界第一家銀行。此地區商業繁榮，人們累積了大量的財富，也支持藝術發展，可說是文藝復興運動的重要推手。請問：上述的□□是指何地？
  options:
  - label: A
    content: 葡萄牙
  - label: B
    content: 西班牙
  - label: C
    content: 法國
  - label: D
    content: 義大利
- id: doc_113_高雄_鼎金_社會_歷史_g9s1e2_s1_35
  section: 1
  number: 35
  type: single
  page: 2
  stem: 下列哪一位人物並不屬於文藝復興時代的藝術家？
  options:
  - label: A
    content: 達文西
  - label: B
    content: 歐幾里德
  - label: C
    content: 米開朗基羅
  - label: D
    content: 拉斐爾。
- id: doc_113_高雄_鼎金_社會_歷史_g9s1e2_s1_36
  section: 1
  number: 36
  type: single
  page: 2
  stem: 相傳漢代蔡倫改良造紙之術：以樹皮、麻頭、破布、魚網，經過挫、搗、抄、烘等一系列工藝加工製成紙，有助紙張的普及與知識的流通。八世紀中期，因戰爭致使造紙術西傳。請問：中國造紙術西傳與普及，有助於下列哪一歐洲歷史發展？
  options:
  - label: A
    content: 佛教傳布
  - label: B
    content: 文藝復興
  - label: C
    content: 大航海探險
  - label: D
    content: 希臘化文化。
- id: doc_113_高雄_鼎金_社會_歷史_g9s1e2_s1_37
  section: 1
  number: 37
  type: single
  page: 2
  stem: 馬丁路德所提出的《九十五條論綱》中指控教會財政處理不當，並且強調《聖經》才是基督教教義的根據或權威所在，還主張所有的信徒都是解經者和傳道者，一個人是否獲救全憑神的恩典。《九十五條論綱》在當時很短的時間內被傳達到德國各地，以及其他歐洲國家。請問：下列哪一項新技術的使用，對上述的事件發展具有很大的推力？
  options:
  - label: A
    content: 造紙術
  - label: B
    content: 指南針
  - label: C
    content: 火藥
  - label: D
    content: 印刷術。
- id: doc_113_高雄_鼎金_社會_歷史_g9s1e2_s1_38
  section: 1
  number: 38
  type: single
  page: 2
  stem: 學者綜觀歐洲的歷史，認為工商業與資本主義的蓬勃發展，與某位宗教領袖的主張有關。請問：這位宗教領袖是下列何者？
  options:
  - label: A
    content: 批評不應販賣贖罪券的馬丁路德
  - label: B
    content: 重視教士虔誠與否的羅耀拉
  - label: C
    content: 自立英格蘭國教派的亨利八世
  - label: D
    content: 鼓勵累積財富以榮耀上帝的喀爾文。
- id: doc_113_高雄_鼎金_社會_歷史_g9s1e2_s1_39
  section: 1
  number: 39
  type: single
  page: 2
  stem: 辰安到高雄英國領事館參觀，看到一位外國醫生的塑像，領事館的導覽員向辰安介紹這位是馬雅各醫生，是蘇格蘭長老教會第一位駐臺宣教師，長老教會認為努力工作是榮耀上帝的一種方式。請由此判斷長老教會是屬於哪一個教派？
  options:
  - label: A
    content: 耶穌會
  - label: B
    content: 英格蘭國教派
  - label: C
    content: 路德教派
  - label: D
    content: 喀爾文教派。
- id: doc_113_高雄_鼎金_社會_歷史_g9s1e2_s1_40
  section: 1
  number: 40
  type: single
  page: 2
  stem: 宗教改革運動中，馬丁路德強調《聖經》是信仰的最終依歸，甚至將《聖經》翻譯成德文，讓信徒能夠自行閱讀。請問：馬丁路德翻譯《聖經》的行為，應是受到哪一個時期的哪一項潮流所影響？
  options:
  - label: A
    content: 鄂圖曼帝國建立後，歐亞接觸頻繁，《聖經》的翻譯有助於東西方文化交流
  - label: B
    content: 文藝復興時期，方言文學興起
  - label: C
    content: 中古時期，神是一切的權威
  - label: D
    content: 羅馬教會內部改革聲浪。
