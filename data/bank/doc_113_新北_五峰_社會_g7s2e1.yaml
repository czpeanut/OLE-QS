  stem: 從族群特色與統計資料判斷，「某行政區」應為下列何者？
  options:
  - label: A
    content: 新店區
  - label: B
    content: 信義區
  - label: C
    content: 烏來區
  - label: D
    content: 中山區。
  group_stem: '※請閱下列讀文章，並參考表格資訊回答第12～14 題。

    「某行政區」位於臺灣北部，地勢多山，境內擁有豐富的森林資源，且有溫泉資源。境內擁有許多泰雅族人聚居，清代主要居住於今福山村一帶，道光年間，因為人口增加，而沿南勢溪向北擴張至屈尺、乾溝一帶山區。後來則因漢人開發新店地區，才又再向南遷徙。附表為該行政區近年人口變化與組成。請問：


    | 族群 | 年份 | 合計(人) | 幼年人口(人) | 壯年人口(人) | 老年人口(人) | 某數值(%) |

    |---|---|---|---|---|---|---|

    | 原住民 | 110年 | 2,934 | 578 | 2,084 | 272 | 40.79 |

    | 原住民 | 111年 | 2,934 | 582 | 2,066 | 286 | 47.39 |

    | 原住民 | 112年 | 2,962 | 595 | 2,099 | 268 | 41.12 |

    | 漢人 | 110年 | 3,457 | 323 | 2,389 | 745 | 44.7 |

    | 漢人 | 111年 | 3,425 | 313 | 2,329 | 783 | 47.06 |

    | 漢人 | 112年 | 3,398 | 302 | 2,335 | 761 | 45.53 |

    | 全區 | 110年 | 6,391 | 901 | 4,473 | 1,017 | 42.88 |

    | 全區 | 111年 | 6,359 | 895 | 4,395 | 1,069 | 44.69 |

    | 全區 | 112年 | 6,360 | 897 | 4,434 | 1,029 | 43.44 |'
