  stem: '近年來，由於臺灣勞動市場對移工需求的增加，特別是在新冠疫情後，製造業、建設業和服務業對東南亞移工的需求顯著上升。這些移工多數持有工作許可證卻無法永久定居，來臺工作數年後仍需返鄉。這種情況屬於哪類遷移？

