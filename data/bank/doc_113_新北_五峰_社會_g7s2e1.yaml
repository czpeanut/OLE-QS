  page: 1
  stem: 報導文章：「臺灣□□□持續走低，各縣市政府致力補助生育獎勵。此外，高齡人口持續增加導致□□□轉為上升，2019 年到人口總數最高峰2,360 萬人。根據國發會推估，未來人口減少速度將會加速，至2070
    年，總人口將降至1,502~1,708 萬人，進而造成兩個社會現象：人口高齡化以及□□□□愈來愈嚴重。」根據文章內容，此三項空格應依序填入哪些？
