- id: doc_113_新北_五峰_社會_g7s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '新店區位於臺灣新北市南部，臺北盆地的南緣，面積約120平方公里，人口總數約30 萬人，而一般住宅區的居住密度標準大概區分為三種程度，分別為：

    「低密度」：2 萬5 千人／平方公里以下

    「中密度」：2 萬5 千～6 萬人／平方公里

    「高密度」：6 萬人／平方公里以上。

    依照資料計算，新店區的居住密度應屬於哪個程度？'
  options:
  - label: A
    content: 低程度
  - label: B
    content: 中程度
  - label: C
    content: 高程度
  - label: D
    content: 無法判斷。
  tags:
    chapter:
      publisher: 康軒
      book: 七下
      subject: 地理
      code: 1-3
      title: 臺灣的人口分布有何特徵？
      chapter: null
    textbook: 七下地理 1-3 臺灣的人口分布有何特徵？
