  options:
  - label: A
    content: 全詩以五言為主，語言樸實自然，善用典故，而且一韻到底，展現民歌的特色
  - label: B
    content: 「爺孃聞女來，出郭相扶將……磨刀霍霍向豬羊」，採簡筆呈現返鄉後闔家團圓的歡樂
  - label: C
