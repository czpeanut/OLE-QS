  group_stem: '五月二十五日丙戌，小暑，晴。申刻北風甚大，遂雨，有雷，傍晚霽，同寄公、季貺出門看荷花。行田埂上，雨後泥濘，失足落水中，雙踝皆沒，不覺自笑，從種花人周姓乞花三枝、蓮蓬一枝。歸，洗足早睡。鄉人種藕，以不花為豐年，蓋藕力盡泄於花，花愈多則藕愈瘦。今田中彌望如雪，為我曹吟賞計甚得矣，鄉人得無怨乎？種藕之家，藕為上利，葉次之，蓮子則不賣，賣亦不得價也。凡田上腴者，可兩年種藕，下此可一年，多則土瘠而收不豐，但可種荸薺耳。

    (周星譽〈鷗堂日記〉)'
