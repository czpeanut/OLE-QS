  - label: B
    content: 作者將煙囪聯想成毒癮深重的大煙客，並以「蠻不講理」、「髒話」等負面字眼加強效果
  - label: C
    content: 作者除了提倡正視環保問題，也鼓勵人們戒菸，以免傷害肺葉、影響全高雄市民的健康
  - label: D
    content: 作者有見於空氣汙染日益嚴重，故苦口婆心一一條列環保訴求，期望能從高雄開始轉變
