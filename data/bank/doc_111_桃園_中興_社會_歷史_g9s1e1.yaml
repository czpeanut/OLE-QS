  section: 1
  number: 28
  type: single
  page: 3
  stem: '請閱讀文章，回答下列問題：

    每年7～10 月尼羅河水流最大的時候，大批工人在河谷開採石塊，然後綁縛棕梠樹幹推到水裡，借力讓河水沖到下游，而另一批工人在河岸邊打撈石塊上岸，再利用木橇與繩索把石塊搬運到緊鄰河岸邊數十公尺的金字塔工地。

    搬運石頭不是用拖的，而是用滾的。他們使用4 塊半圓形的木製夾板(形似半圓形木橇)：把方形的石頭的四邊變成圓形。這是為何同一座金字塔的石塊都幾乎是一樣大小，而且幾乎都切割成正方形的緣故。石頭的形狀與大小很重要，這是滾動搬運石塊的基本原則。

    上述短文和古埃及人的何種文化成就相關？'
  options:
  - label: A
    content: 六十進位法
  - label: B
    content: 醫學
  - label: C
    content: 歷史學
  - label: D
    content: 幾何學。
