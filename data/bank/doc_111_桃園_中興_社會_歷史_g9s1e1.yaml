  type: single
  page: 2
  stem: '荷馬史詩是希臘重要的文化遺產，其中有一篇內容如下:

    居住在奧林帕斯山上的希臘眾神，將要舉辦海洋女神賽蒂斯下嫁凡人英雄佩柳斯的婚禮。婚宴那天，希臘眾神都接到了喜帖，卻只有搗蛋女神厄里斯沒有被邀請。憤怒的厄里斯，在眾神酒酣耳熱之際，將一顆寫著「獻給最美麗的女神」的金蘋果，丟進婚禮現場，立刻引來了眾女神的紛搶爭奪、互不相讓……。

