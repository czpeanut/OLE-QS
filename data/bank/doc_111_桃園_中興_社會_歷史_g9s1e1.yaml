  section: 1
  number: 4
  type: single
  page: 1
  stem: 羅穆斯是羅馬共和時期的貴族，當時他所參與的政府組織是最重要的決策機構，而羅馬在此時期也積極對外擴張，版圖橫跨歐、亞、非三洲。請問：羅穆斯所參與的政府決策機構為何？
