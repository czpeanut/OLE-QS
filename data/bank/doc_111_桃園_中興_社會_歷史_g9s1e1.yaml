  section: 1
  number: 11
  type: single
  page: 1
  stem: 古埃及統治者被視為是最高神明之子，也是神在人世間的代言人。所以，他們產生出一種「近親通婚制」，兄妹、叔姪、姐弟等通婚關係屢見不鮮，也致使家族性遺傳疾病很容易在統治者身上見到。之所以會有這樣的情況，主要是因為他們認為統治者身上具備了哪一個神明的血統？
