  type: single
  page: 1
  stem: 世界古文化中，有部分發展出文字。其中一個古文化的文字原本是圖像符號的象形文字，後來有些符號成為表音文字，更在簡化後被傳播出去，成為西方拼音文字的基礎。這個古文化應是下列何者？
  options:
  - label: A
    content: 蘇美
  - label: B
    content: 波斯
