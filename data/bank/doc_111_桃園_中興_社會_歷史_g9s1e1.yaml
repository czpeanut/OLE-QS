  stem: 亞歷山大率兵西征，最遠至印度河流域，建立起橫跨三洲的大帝國，並致力於促進各地文化融合，締造出歷史上著名的「希臘化文化」。請問：「希臘化文化」是希臘古典文化與下列哪些文化交流而孕育出來的？
