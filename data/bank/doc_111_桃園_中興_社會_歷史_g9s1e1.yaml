  page: 2
  stem: 西元前六世紀，波斯王居魯士統一各部，憑著軍事才能和政治手腕征服兩河流域，建立波斯帝國。至西元前六世紀末，大流士即位，領土再繼續擴展，成為跨歐、亞、非三洲的大帝國。波斯人能統治如此龐大的帝國，其統治方式為何？
  options:
  - label: A
    content: 政治上採取自治，宗教上則是信奉唯一真神
  - label: B
    content: 對統治地區採取一致性高壓，嚴格的軍事化管理
  - label: C
    content: 認為國王即是太陽神後裔，實行政教合一
  - label: D
    content: 雖採中央集權，仍重視各地文化促使文化交流。
