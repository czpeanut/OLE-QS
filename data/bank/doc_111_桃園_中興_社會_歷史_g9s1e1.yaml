- id: doc_111_桃園_中興_社會_歷史_g9s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 希臘史學家曾說：「埃及是尼羅河的贈禮。」這句話道盡埃及與尼羅河的關係。請問：我們可以如何解讀這句話？
  options:
  - label: A
    content: 尼羅河定期氾濫帶來的淤泥，使埃及發展出高度的農業文化
  - label: B
    content: 尼羅河從不氾濫因而相當安全
  - label: C
    content: 尼羅河方便埃及人航行於歐亞非，使民族往來頻繁商業繁榮
  - label: D
    content: 尼羅河是天然的屏障阻絕埃及與外地接觸。
