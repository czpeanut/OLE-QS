  section: 1
  number: 3
  type: single
  page: 1
  stem: 西亞古民族希伯來人，居住在地中海東岸的巴勒斯坦地區，他們創立的宗教，認為上帝是唯一的真神，這種一神信仰是團結他們民族重要的力量，也影響到後來的其他宗教。請問：希伯來人創立的宗教是下列何者？
  options:
  - label: A
    content: 伊斯蘭教
  - label: B
    content: 基督教
  - label: C
    content: 猶太教
  - label: D
    content: 祆教。
