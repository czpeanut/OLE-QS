  stem: 一名20 歲的男大生在網路上表示：他在上課時，不慎摔到女同學的手機，導致螢幕因此有些裂痕。女同學向他索賠3 萬，男大生覺得不合理，因為3 萬元已經能買一支全新的同型號手機了。依據民法的規定，下列敘述何者正確？
