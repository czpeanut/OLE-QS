  section: 1
  number: 3
  type: single
  page: 1
  stem: 下列是某一則新聞報導：小斌將限量款高級自行車借給17 歲的阿德騎去環島，阿德卻不慎將車撞毀，所幸沒有波及他人，事發後雙方自行簽訂高額賠償契約。不過阿德的父母得知後反對這份契約，於是阿德事後反悔不願依約賠償，小斌因此告上法院要求阿德履行契約，但法官以該契約無效為由，判決小斌敗訴。關於上述報導內容，下列哪一項推論最合理？
