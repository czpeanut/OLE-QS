  group_stem: "題組題:\n    臺灣旅遊活動從何時逐漸普及，可以從負責旅遊活動的官方機構總督府交通局鐵道部的出現看出端倪。當時，總督府交通局鐵道部年年都發行的臺灣鐵道旅行案內，不僅成為現在鐵道迷醉心追求的經典，更反映當時臺\
    \ 人對旅遊的興致大增。民間當然也出現大量的旅館、溫泉區、海水浴場以及風景名勝等旅遊相關住宿與景點，以 配合逐漸「習慣」旅遊的臺人或來臺日人。 目前臺灣學校都有的「校外教學」，最早可追溯到日治時期，從小學校到國語學校，都曾有前往內地進行修\
    \ 學旅行的經驗。總督府的目的，是想讓來自臺灣的學生親身體驗內地的現代化，可是經費是一大考量，因此總督 府利用內地舉辦博覽會的時機，補助學校修學旅行所需要的費用。旅行的行程內容，則以內地的自然與人文景觀\
    \ 為主軸。而臺人旅行逐漸成為習慣，主因為時間觀念的改變：以往日出而作，日落而息的生活模式，轉而以六十 進位法計算時間的方式以及一天二十四小時的概念；另外還有星期制的出現，使臺人逐漸出現休假的概念，休假\
    \ 日最好的休閒活動便是旅行。旅行活動的熱絡，除了上述條件的配合，更需要基礎建設的升級，例如：鐵路、公 路、港口等整建與整合。（資料來源：蔣竹山，島嶼浮世繪：日治臺灣的大眾生活）"
