    翰翰、宣哥、博博、奕翔、謙緯五個人都是在臺灣土生土長的臺灣人，唯一的不同是他們出生的年代都不一樣。某日下午，他們在餐廳聚餐時，聊到了他們「二十八歲時從事的工作」。請根據他們的聊天內容回答下列問題：

    謙緯：「我跟你們說，我之前情人節的時候，接了一個水蜜桃巧克力的業配，結果我的粉絲居然把每一家便利商店的巧克力都掃光了，明明吃起來就超難吃的，廠商應該直接請我當他們的廣告總監了。」

    奕翔：「現在水蜜桃可以做成巧克力了喔！以前我們家種的水蜜桃都被拿去加工成罐頭了，不過我跟你講，水蜜桃還是要吃原味的比較好吃，雖然我已經吃到會怕了。」

    宣哥：「奕翔至少你工作時還可以看到外面的風景，我那時可是每天都被關在工廠裡面監督工人組裝玩具，國外訂單多的時候還要自己下去組裝，你知道我小孩玩的玩具都是我親自修理的嗎？」

    博博：「哈哈，那你跟我的工作很像欸，只是我的部下製作的是晶圓，或許你可以把你的職業名稱改成玩具工程師。翰翰那你呢？你的二十八歲在幹嘛？」

    翰翰：「我喔，那時候每天都在都為了國家政策忙得焦頭爛額，為了中國鋼鐵公司還有整個臺灣的鋼鐵產業吼，我整整半個月待在行政院沒回家過。」

    謙緯：「你們幾位是活的臺灣工業史吧，也許你們應該來我的YouTube 分享一下。」'
