  group_stem: "二、\n   德國的合法結婚年齡是18 歲，經過特別允許，才可以在16 歲結婚，因此兒童婚姻在德國是違法的。但在德國收容120 萬多數是穆斯林的難民時，是否應該承認這些難民兒童新娘的婚姻成為難題。在德國巴伐利亞登記有案的難民兒童新娘，就有160\
    \ 人未滿16 歲，這些兒童新娘絕大部分都由神職人員根據伊斯蘭教法主持婚禮完婚。\n  西元2016 年6 月，巴伐利亞的班貝格法院正式承認一位14 歲的敘利亞難民與其21\
    \ 歲表哥的婚姻關係，使得兒童婚姻變成眾所矚目的問題。當兩人來到巴伐利亞時，當地的青年福利處因他們違反德國法律而將其拆散，並把女孩的監護權交給地方法院，因為根據德國的兒童福利法，不滿16\
    \ 歲的兒童一定要有監護人。男方因此向班貝格法院提出上訴，由於其婚姻符合敘利亞的法律，最後法院判定他們的婚姻有效。\n\n資料來源：觀念座標翻譯(2016.8.25)。「童婚」習俗隨難民落腳歐洲，德國面對燙手山芋。關鍵評論網。"
