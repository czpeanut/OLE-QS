- id: doc_113_新北_忠孝_數學_g7s2e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: '下列關於平面上，正確的敘述有幾項？

    【甲】$\vec{AB}$與$\vec{BA}$代表相同的射線。

    【乙】過直線　L　外一點　P　到直線　L　的垂線只有一條。

    【丙】將$\overline{AB}$ 平分的直線只有一條。

    【丁】線對稱圖形的對稱軸垂直平分兩個對稱點的連線段。

    【戊】等腰三角形的兩底角相等。

