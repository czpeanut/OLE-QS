- id: doc_113_台中_五權_國文_g8s2e3_s1_16
  section: 1
  number: 16
  type: single
  page: 3
  stem: 「紫陌紅塵拂面來，無人不道看花回。玄都觀裡桃千樹，盡是劉郎去後栽。」這首詩是劉禹錫被貶謫後返回京城所寫，然而有許多高官認為劉禹錫被貶謫後藉這首詩諷刺他們。詩中的諷刺內容最有可能是下列何者?
  options:
  - label: A
    content: 以桃樹比喻高官陷害自己才登上高位
  - label: B
    content: 以紫陌紅塵比喻高官品德如塵土低賤
  - label: C
    content: 以不願與人共同賞花凸顯自我清高
  - label: D
    content: 以玄都觀的冷清嘲笑高官無人巴結
- id: doc_113_台中_五權_國文_g8s2e3_s1_17
  section: 1
  number: 17
  type: single
  page: 3
  stem: 以下選項皆為詠人物之詩，請問何者配對正確?
  options:
  - label: A
    content: 九州一統皇威勝，鐵血雄心定乾坤。阿房宮闕千萬間，金碧輝煌映日新――唐明皇
  - label: B
    content: 長安回望繡成堆，山頂千門次第開。一騎紅塵妃子笑，無人知是荔枝來――楊貴妃
  - label: C
    content: 草莽出身功績著，苦難磨礪成大臣。一代名將留青史，忠謀智略萬世珍――花木蘭
  - label: D
    content: 玉面虯髯氣不平，青龍偃月夜光明。英風凜凜生廟貌，義氣堂堂照汗青――周瑜
