  stem: 作者提到「我深刻感受到臺灣的教育過於偏重『知識』的傳授，卻忽略了「最重要的事』」。請問下列何者不屬於「最重要的事」？
  options:
  - label: A
    content: 除了做好自己的工作之外，願意有全盤了解整個產品的思維
  - label: B
    content: 將各種成果數據化，以便能更客觀的去評估自己當下的實力
  - label: C
    content: 赢得他人的信任所累積的人脈，將可以得到更多的工作機會
  - label: D
    content: 把個人工作品質當成一個品牌來經營，絕不忽略細節的品管
  group_stem: "〈八個不該有的「學生思維」：學校都教不了你〉(節錄)   羊正鈺\n    從事教育的過程中，我深刻感受到臺灣過於偏重「知識」的傳授，卻忽略了「最重要的事」。職場往往沒有標準答案，以下思維，是我認為「學生」該澈底拋下的：\n\
    一、只會分工，不會「合作」\n【在學校最常見的】分組報告時，每個人負責一部分，再一個人負責統整。最後只是東拼西湊、整理一下格式，看起來像一份報告就交上去了。問題是，內容上是否真有實質價值與閱讀意義呢?\n\
    【職場的真實世界】工作當然是要分配的，但是每個人都要清楚自己扮演的角色，透過討論、互相配合，最後產出的才會是「一個產品」，而非拼貼出來的散沙。這就是「產品思維」：每個人都知道自己負責的是整個產品，不只是螺絲釘。\n\
    二、做人不做事，不如「對事不對人」\n【在學校最常見的】分組報告時，找好朋友或室友同組，到頭來才發現，有些組員不是進度嚴重拖延，就是乾脆擺爛。為了不惹麻煩，也只能咬牙自己扛下來。\n\
    【職場的真實世界】「做人」當然重要，但既然我們是為了「做事」才聚在一起，溝通上要謹守「對事不對人」原則，才是負責的態度：我們是對事情負責，即便要做人也是為了把事情辦好。\n\
    三、做完，不等於「做好」\n【在學校最常見的】工作分配完，結果大家在截止前丟出來的東西都差強人意。變成負責統整的那個人要當苦主，不眠不休的做完所有該補救和收尾的工作。\n\
    【職場的真實世界】工作沒有做到一百分就不應該交出去，因為從我們經手過的每一件事，都代表了自己的「個人品牌」。\n四、人脈不是認識多少人，而是「把自己做好」\n\
    【在學校最常見的】總是有人愛吹噓自己認識某風雲人物，不然就是跑過多少活動、社群媒體有多少好友，好像有了這些「數字」就等於自己多有「人脈」。\n【職場的真實世界】人脈的本質是「信任」，先把自己做好，承諾過、經手的每件事做到最好，就算只認識十個人，這十個人也會信任的把你推荐給更多人。\n\
    五、評價你的不是數字，是「你的行為」\n【在學校最常見的】會忍不住去在乎考試考幾分，或是比賽最後獲得第幾名、辦的活動多少人參加、選的代表和幹部最後有沒有當選。\n\
    【職場的真實世界】事情永遠不是「交出去」那一刻就結束，當下獲得的數字，只代表「現在的你」，卻不等於「未來的你」。關鍵是你能否馬上檢討、下次優化到什麼程度，才是別人真正記得你的樣子。"
