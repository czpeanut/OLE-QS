- id: doc_113_台中_五權_國文_g8s2e3_s1_21
  section: 1
  number: 21
  type: single
  page: 3
  stem: 「禍福互為倚伏，成敗轉眼易位，由失敗而成功或許累計了二十年，由成功而失敗，有時驟生於旦夕之間。」這段文字的主要含義為何？
  options:
  - label: A
    content: 家境富裕的人未必能成功，出身低微的人也未必會失敗
  - label: B
    content: 成功或許需要經歷千辛萬苦，失敗卻可能在一瞬間發生
  - label: C
    content: 禍福相生相滅，成功與失敗必然會同時發生
  - label: D
    content: 若沒有二十年的磨練，便無法取得成功
- id: doc_113_台中_五權_國文_g8s2e3_s1_22
  section: 1
  number: 22
  type: single
  page: 4
  stem: '〈小店銘〉

    店不在大，業精則名；技不在多，美觀則行。此乃小店，惟吾經營。進門雖垢面，出門便年輕。往來四海客，來者一樣親。可以剪染燙，款式新。無醜怪之汙眼，擁吸睛之造型。服務總周到，開口笑臉迎。眾人云：「何小之有?」


    以下對聯，何者最適合貼在上文行業的店門口？'
  options:
  - label: A
    content: 察及秋毫如照燭，看來老眼不生花
  - label: B
    content: 音畫交融真幻境，悲歡共感大銀屏
  - label: C
    content: 藏諸名山守文脈，啟我心眼識古今
  - label: D
    content: 修去煩惱千千結，梳開眉頭寸寸歡
