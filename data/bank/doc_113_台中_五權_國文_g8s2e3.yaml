- id: doc_113_台中_五權_國文_g8s2e3_s1_33
  section: 1
  number: 33
  type: single
  page: 6
  stem: "勝利至上的「遊戲家精神」（改寫）    周偉航\n    缺乏運動家精神的人，通常會被看作是「輸不起的人」或「爛贏家」，前者指比賽輸了之後的態度不佳，而後者是採用不合規範或習慣的方式取勝（包括合於道德及不合道德的），兩者皆算不上有運動家精神。可是有種和運動家精神類似的運動態度，就有可能產生出「爛贏家」，這種態度就是「遊戲家精神」。\n\
    \  因為遊走在規則邊緣，盡一切可能增加對自身有利的競賽條件，是以多數的倫理學家不會鼓勵「遊戲家精神」，因為道德的要求往往比規則嚴苛許多，但「遊戲家精神」推動了各種運動戰術的誕生，少了這種在規則邊緣盡可能擴張戰果的操作，那競技運動或賽事就會變得無聊許多。你可以說這種精神\
    \      。\n  不論是職業或業餘運動，「遊戲家精神」是某些技術或條件較差的運動員企圖突破困境時的常見態度，相對來說，知名球員或以球品聞名的球員，就較不會持這種態度上場比賽。\n\
    \n下列選項中的敘述，何者適合填入畫線中？"
  options:
  - label: A
    content: 在倫理學方面的貢獻不足，卻提升了運動的美學層次
  - label: B
    content: 透過突破規則的極限，以提升賽事精采度為最高宗旨
  - label: C
    content: 完全無可取之處，觀眾見到也爭相唾棄，不屑觀戰之
  - label: D
    content: 等同輸不起的表現，單為取悅觀眾採取的低級戰術
