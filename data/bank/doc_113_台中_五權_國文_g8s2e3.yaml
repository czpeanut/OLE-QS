  stem: '馬謖、王平二人兵到街亭，看了地勢。馬謖笑曰：「丞相何故多心也？量此山僻之處，魏兵如何敢來！」王平曰：「雖然魏兵不敢來，可就此五路總口下寨。即令軍士伐木為柵，以圖久計。」謖曰：「當道豈是下寨之地？此處側邊一山，四面皆不相連，且樹木極廣，此乃天賜之險也。可就山上屯軍。」平曰：「若參軍欲在山上下寨，可分兵與我，自於山西下一小寨，為犄角之勢。倘魏兵至，可以相應。」馬謖不從。忽然山中居民，成群結隊，飛奔而來，報說魏兵已到。

