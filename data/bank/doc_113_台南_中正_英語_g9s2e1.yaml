  stem: According to the reading, what is AI ?
  options:
  - label: A
    content: It is a skill that enables machines to act like humans.
  - label: B
    content: It is a person that looks like a robot.
  - label: C
    content: It is a machine that has the ability to act like humans.
  - label: D
    content: It is a car that is programmed to take people everywhere.
  group_stem: "AI and Life\n         Artificial Intelligence ( AI ) is a skill of\
    \ computer program that enables machines to learn and think like humans. Since\
    \ it first showed up, AI has successfully helped machines to understand human\
    \ speech, take part in strategic games like chess, and drive. In factories, many\
    \ jobs have now been done by machines. It is believed that in the future AI will\
    \ take over 40% of our work. Millions of workers will be reporting to their “Robot\
    \ Boss.” However, it may be dangerous if we fully rely on AI. AI only follows\
    \ the order which is placed at the very beginning unless it receives another new\
    \ order. Because of this, some terrible results may happen. The following are\
    \ two examples.\n\n① Imagine a self-driving car is programmed to take you to the\
    \ airport as fast as possible. In the end, you might arrive at the airport on\
    \ time, but the high speed may make you travel-sick and get you a traffic ticket\n\
    \n② AI can also be programmed to control the weapons like guns or bombs at a far\
    \ distance. However, if it is used by bad guys to kill people, the situation will\
    \ be out of control.\n\n         Therefore, we should use AI skills wisely, or\
    \ it will bring us big troubles.\n\U0001F4D6 enable 使…能夠    strategic 策略的    chess\
    \ 西洋棋    take over 接管    rely on 依賴    unless 除非    result 結果    imagine 想像  \
    \  situation 情況"
