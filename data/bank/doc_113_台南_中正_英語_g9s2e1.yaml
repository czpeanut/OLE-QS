    Jane：Hi, Juliet. Nice to see you. How are you doing?

    Juliet：I’ve been busy preparing for my engineering entrance exams.

    Jane：That’s great! I didn’t know that you wanted to become an engineer.

    Juliet：I’m very interested in all kinds of machines, so I want to become an engineer.
    What about you? What do you want to do in the future?

    Jane：I have always loved teaching. I hope to become a good teacher like my mother.

    Juliet：I saw you teach your younger brother to do his homework the other day.
    I think you have all the qualities of a great teacher.

    Jane：Thanks, Juliet. I hope I can be a teacher and share my knowledge with my
    students in the future.

    Juliet：That’s good for you, Jane, though there are lots of tasks that a teacher
