  group_stem: "Crimes in Taiwan\n    According to a study from Global Database Number\
    \ in 2020, Taiwan has been the second-safest country in the world. It’s not surprising\
    \ because there are a lot of security cameras all over Taiwan. They are installed\
    \ at traffic corners, inside or outside a building, and almost everywhere. This\
    \ large coverage helps lower the number of crimes and makes most of the streets\
    \ safe.\n    However, theft can still happen in crowded places, such as night\
    \ markets. So people should be careful while visiting such places. Phone scams\
    \ are also a serious problem. There are cases that scammers tried to trick people\
    \ out of their money by pretending to be bank clerks, or insurance companies.\
    \ Anyone who receives these calls should call 165, the anti-fraud hotline, and\
    \ report it right away. Another problem is the share of free Wi-Fi. It is not\
    \ safe and easily causes risks of cyber attacks. Therefore, people had better\
    \ avoid paying by credit card while shopping online with Wi-Fi.\n    Even though\
    \ the above may happen to anyone, Taiwan is still a safe country to visit, as\
