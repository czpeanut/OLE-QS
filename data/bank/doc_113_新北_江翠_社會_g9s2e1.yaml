  - label: D
    content: 停止價格競爭。
  group_stem: "中國人工智慧（AI）新創公司深度求索（DeepSeek）應用程式於今年(2025)1 月11 日發布，在1 月27日就超越ChatGPT、Gemini\
    \ 成為美國的蘋果App Store 下載最高的免費應用程式，截至1 月31 日上線僅21 天，日活躍用戶數（DAU）已達2,215 萬戶，為ChatGPT\
    \ 的41.6%，顯示其受歡迎的程度。\n    DeepSeek 的成功，與背後的DeepSeek-R1 模型有關聯。不同於ChatGPT、Gemini\
    \ 等封閉模型，DeepSeek採用開源模型，允許所有開發者都可以免費取得原始碼，甚至拿去改進、重新訓練，或整合到應用程式中。更令人驚豔的是，DeepSeek\
    \ 聲稱其訓練模型成本僅560 萬美元（約新台幣1.84 億元），而ChatGPT 等系統花費高達數十億美元，這優勢，在開發者社群引發了轟動。不過，DeepSeek\
    \ 近期捲入嚴重的資安爭議，知名雲端安全公司Wiz 研究團隊揭露，該公司某關鍵資料庫無加密保護直接暴露於網路，恐造成機密資料大規模外洩，遭多國禁用。請問："
