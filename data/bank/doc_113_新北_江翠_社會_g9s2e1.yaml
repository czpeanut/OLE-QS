    年12 月13 日三讀通過《運動產業發展條例》修法。此次修法新增條文包括，以強暴、脅迫、詐術、利誘或其他非法方式，妨害運動競技賽事公平者，處1 年以上、7
    年以下有期徒刑，得併科新台幣1000 萬元以上、3000 萬元以下罰金。另外針對過去運彩投注項目以外賽事的簽賭狀況，原本只能以《刑法》賭博罪等條文進行規範，此次修法也將運彩投注項目以外的賽事納入法律規範。
