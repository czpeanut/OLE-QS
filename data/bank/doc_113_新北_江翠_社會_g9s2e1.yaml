- id: doc_113_新北_江翠_社會_g9s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 歐洲各國的君主常因政治聯姻，使得彼此之間有親戚關係。第一次世界大戰時，英國與德國為敵，然而英國王室有著德國血統、姓著德國姓氏「薩克森-科堡-哥達」，令英國民眾感到不滿。為安撫民心，英王喬治五世毅然決定將英國王室名改為「溫莎王朝」──以英國古老的溫莎城堡為名，以示與德國關係的斷絕。此一舉動得到大量民意支持，使英國人民更加團結一心。喬治五世更名的舉動可說是何種思維的體現？
  options:
  - label: A
    content: 民族主義
  - label: B
    content: 帝國主義
  - label: C
    content: 社會達爾文主義
  - label: D
    content: 孤立主義。
  tags:
    chapter:
      publisher: 康軒
      book: 九下
      subject: 歷史
      code: 2-2
      title: 第一次世界大戰
      chapter: null
    textbook: 九下歷史 2-2 第一次世界大戰
    labeled_by: ai
