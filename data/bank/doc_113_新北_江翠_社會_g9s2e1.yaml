  section: 1
  number: 10
  type: single
  page: 1
  stem: 這份聲明最可能在哪場會議之中被提出？
  options:
  - label: A
    content: 大陸會議
  - label: B
    content: 三級會議
  - label: C
    content: 維也納會議
  - label: D
