  group_stem: '※以下為二十世紀初期在某場會議中的聲明節錄，請回答第10~11 題：

    ⚫ 奧匈帝國統治下的各民族應獲得自由的機會，以實現其自治發展，確保其在國際間地位獲得保障與認可。

    ⚫ 同盟國應撤出羅馬尼亞、塞爾維亞及蒙特內哥羅，並恢復被佔領領土。各巴爾幹國家之間的關係，應透過友善協商，依歷史上民族關係予以確定，以維護各巴爾幹國家之政治與經濟獨立及領土完整。

    ⚫ 現今鄂圖曼帝國的土耳其部分應確保其穩固的主權，但其他受鄂圖曼統治的民族，則應獲得無可置疑的生命安全與絕對不受干涉的自治發展機會。'
