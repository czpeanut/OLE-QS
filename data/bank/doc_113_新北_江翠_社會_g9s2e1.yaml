  page: 1
  stem: 某份文件中寫道：人人生而平等，造物者賦予他們若干不可剝奪的權利，其中包括生命權、自由權和追求幸福的權利。……當任何形式的政府破壞這些權利時，人民便有權力改變或廢除它，以建立一個新的政府。我們不是沒有顧念我們英國的弟兄，但他們切斷我們同世界各地的貿易、未經我們同意便向我們強行徵稅；我們懇求他們念在同種同宗的分上，棄絕這些掠奪行為，但他們充耳不聞。因此，我們實在不得不宣布和他們脫離……。關於上述內容何者正確？
