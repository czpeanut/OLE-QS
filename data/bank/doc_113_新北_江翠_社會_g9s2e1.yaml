- id: doc_113_新北_江翠_社會_g9s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 文中的國際組織應為下列何者？
  options:
  - label: A
    content: 國際聯盟
  - label: B
    content: 聯合國
  - label: C
    content: 關稅同盟
  - label: D
    content: 三國同盟。
  group_stem: "※根據以下文章回答第14~16 題：\n    盧安達位於非洲中部地區，當地主要人口為胡圖族約占85%，圖西族14%，特瓦族1%。1870\
    \ 年代起，歐洲各國競相殖民非洲，1884 年柏林會議後，德國開始殖民盧安達、蒲隆地、坦尚尼亞等地直到一戰結束。根據凡爾賽和約，當時的國際組織將德國殖民地分配給比利時管理，盧安達因此成為比利時的殖民地。無論是德國或後來的比利時，都採用間接式殖民，也就是透過人數較少的圖西族掌權，對胡圖族進行壓迫。\n\
    \    1962 年盧安達獨立後，比利時卻將政權移交給人數較多的帕梅胡圖黨。胡圖族掌權後，累積近百年來的怨氣大爆發，反過來開始施行歧視圖西族的壓迫政策，有所政治、教育、經濟等福利皆以胡圖族優先享有。\n\
    \    1994 年盧安達大屠殺起因於兩位胡圖族出身的總統──盧安達總統哈比亞利馬納與蒲隆地總統恩塔里亞米拉所乘坐的小客機，遭到不明飛彈擊落身亡，謠言便直指是「圖西族」發動暗殺。於是針對圖西族的「種族滅絕」大屠殺正式展開：各種無差別強暴、虐殺、處決、縱火，以每日將近1\
    \ 萬死的屠殺速率，殺盡了圖西族總數的70%，快速消滅了盧安達10%的人口；短短100 天內便有超過80 萬名圖西人喪生。"
