  group_stem: '◎「打拋豬肉」是泰式料理中的一道名菜，其中的「打拋」常被誤以為是料理方式，其實它是一種香料植物~聖羅勒，因為泰文的發音類似打拋而以此命名。早期台灣沒有引進打拋，所以用有類似香味的九層塔代替，九層塔是西方常用香料植物~羅勒的變種。「變種」是指分布在相同區域的同一種植物，由於細微的環境差異，導致形態上產生差異，但相互授粉後仍能產生有生殖能力的後代，因此命名上會在原本的學名後加上「var.
    變種加詞」，其中 var.是 variety(變種)的縮寫，變種加詞是形容該變種的特徵。三種香料植物的學名如下：


    | | 學名 |

    | :--- | :--- |

    | 聖羅勒(打拋) | Ocimum tenuiflorum |

    | 羅勒 | Ocimum basilicum |

    | 九層塔 | Ocimum basilicum var.thyrsiflora |'
