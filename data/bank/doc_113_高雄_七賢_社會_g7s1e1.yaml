    | C 學生 | 2023 年 5 月＃MeToo 運動風潮的爆發，促成政府修法，但仍有許多不足之處，在法律無法顧及的地方，我們應該思考如何改變社會風氣，建立性別平權的意識，多方面杜絕性別暴力的發生。
