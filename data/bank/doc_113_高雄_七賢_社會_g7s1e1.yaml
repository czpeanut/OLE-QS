  group_stem: 'Me Too(我也是)最早起源於2006年美國非裔女權運動者塔拉納·伯克(Tarana Burke)在Myspace 上使用了「Me
    Too」這一短語，與當時的反性侵運動做連結。「Me Too」為性侵害倖存者提供了一個分享故事的平台，它揭露加害者的罪行，在受害者之間建立一種團結感，並倡導改變社會態度和制度。其實在各行各業和社會環境中「性騷擾」和「性侵害」普遍存在，此活動讓大家對這個問題有更深入的了解，它引發了公眾對話，並挑戰了容忍此類行為的社會潛規則，並引發改革的呼聲。

    2023年是臺灣＃MeToo 運動的元年，藝人、公眾人物透過社群平臺揭露自己遭遇性騷擾、性侵害的過往，這些勇敢的作法讓臺灣社會各個角落的受害者不再感到孤立無援，選擇採取司法途徑為自己討回公道。這場社會運動促使政府修訂性平三法，以國家公權力落實受害者的權益保障，嚴懲性別暴力的行為，阻止加害者繼續傷害他人。'
