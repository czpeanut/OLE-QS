  group_stem: '（第 47 題）下表為公民課學生報告的片段，內容是針對某項議題的探討，下列何者與學生的發言主旨最為符合？


    | A 學生 | 為了維護在職場中的受騷擾者的權益，政府修訂此項法規，對於申訴流程訂出明確規範，如果不服公司做出的處置，可直接向政府主管機關提出檢舉。 |

