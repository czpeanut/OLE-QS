  type: single
  page: 3
  stem: 西方歷史上的「西元紀年」與中國古代的「年號紀年」有何不同？
  options:
  - label: A
    content: 西元紀年是以耶穌誕生為起點，年號紀年是以皇帝在位期間的年號來計算年份
  - label: B
    content: 西元紀年是以皇帝的年號來計算年份，年號紀年是以耶穌誕生為起點
  - label: C
    content: 西元紀年和年號紀年都以皇帝或國王的即位為起點
  - label: D
    content: 西元紀年是以耶穌出生的那一年為起點，年號紀年是以天干地支為基準。
- id: doc_113_高雄_七賢_社會_g7s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 3
  stem: 早期的臺灣原住民族並沒有留下文字資料，而傳說與神話是了解其發展的重要材料，例如，泰雅族有岩石始祖傳說，布農族有洪水傳說，而我們應該如何看待他們的傳說與神話？
  options:
  - label: A
    content: 部分原住民稱自己祖先從裂開的石頭而出，不符合科學推理，不值得採信
  - label: B
    content: 祖先曾遭遇洪水災難的傳說，顯示臺灣原住民從中國的黃河流域遷徙而來
  - label: C
    content: 許多臺灣原住民都有洪水氾濫的傳說，證明其祖先相同並且來自同一地區
  - label: D
    content: 從部分傳說可推知原住民可能從其他島嶼移居至臺灣，再遷移到其他地區。
