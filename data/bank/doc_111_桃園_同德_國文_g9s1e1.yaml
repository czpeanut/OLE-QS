  group_stem: '馬二先生回頭一看，祠門口立著一人，身長八尺，頭戴方巾，身穿繭紬長袍，左手理著腰絲縧，右手拄著龍頭拐杖，一部大白鬚，直垂過臍，飄飄有神仙之表。馬二先生慌忙上前施禮：「敢問素昧平生，何以便知學生姓馬？」那人道：「天下何人不識君？先生既遇著老夫，不必求籤了，且同到敝寓去談談。」

