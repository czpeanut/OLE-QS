  stem: 「駢體文是古代中國一種特有的文言文文體，其句式多由四字或六字(四六句)及對仗構成，故又稱四六文、駢儷或駢體。具駢文特點而押韻者稱駢賦，然其因為文章受限於追求藝術技巧之故，適於寫景而不適於敘事。駢文興盛於南北朝，因當時儒學衰微，盛行追求藝術之風氣，文學作品傾向較重文辭修飾，然漢字本便有適合使用偶句的特點，在戰國漢代文人如李斯、賈誼，文章便已多用偶句，具後世駢文之雛形。士族的提倡文學觀念的發展純文學觀念和聲律說，也促使駢文興盛。」根據上文，下列敘述何者正確﹖
