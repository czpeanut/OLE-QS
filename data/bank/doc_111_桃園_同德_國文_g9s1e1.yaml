  group_stem: '馬二先生回頭一看，祠門口立著一人，身長八尺，頭戴方巾，身穿繭紬長袍，左手理著腰絲縧，右手拄著龍頭拐杖，一部大白鬚，直垂過臍，飄飄有神仙之表。馬二先生慌忙上前施禮：「敢問素昧平生，何以便知學生姓馬？」那人道：「天下何人不識君？先生既遇著老夫，不必求籤了，且同到敝寓去談談。」

    當下攜了馬二先生的手，走出丁仙祠，卻是一條平坦大路，未及一刻功夫，已到了伍相國廟門前。馬二先生心裡疑惑：原來有這近路，是我方才走錯了？又疑惑恐是神仙縮地騰雲之法也未可知。進入伍相國寺殿後，有極大的地方，又有花園，園裡有五間大樓，四面都是窗子，望江望湖，景色全收眼底，那人就住在這樓上，邀馬二先生上樓，施禮坐下。四個長隨，整整齊齊，都穿著紬緞衣服，腳下新靴，上來奉茶，那人吩咐備飯，一齊應諾下去。

    馬二先生舉眼一看，樓中間貼著一張素紙，上寫冰盤大小的二十八個大字，乃是一首絕句，詩道：

    南渡年來此地遊，而今不比舊風流。

    湖光山色渾無恙，揮手清吟過九州！

    後面一行寫：「天臺 洪憨仙題。」馬二先生屈指一算，宋高宗南渡，已是三百多年前的事，這人經歷南渡，而今還在，一定是個神仙無疑。問道：「這佳作是老先生的？」

    那人道：「憨仙便是賤號，偶爾遣興之作，頗不足觀。先生若愛看詩句，前時在此，有同撫臺、藩臺及諸位當事在湖上唱和的一卷詩，取來請教。」說完，拿出個手卷來，馬二先生放開一看，都是各當事的親筆，一首首七言律詩，詠的西湖之景，圖書新鮮，著實讚了一回。

    捧上飯來，雖是便飯，卻也豐盛，馬二先生腹中尚飽，不便辜負仙人，又盡力吃了一餐。飯畢清談，談起目前住在書坊裡，沒有什麼文章選，想要問問可有發財機會？洪憨仙道：「發財也不難，但大財須緩一步，目前先發個小財好嗎？」走進房內，床頭邊摸出一個包來，打開，裡面有幾塊黑煤，遞與馬二先生道：「你將這東西拿回去，燒起一爐火來，取個罐子把他頓在上面，看他成個什麼東西，再來和我說！」

    馬二先生接著，晚間果然如法炮製，那火吱吱地響了一陣，取罐傾了出來，竟是一錠細絲紋銀，馬二先生喜出望外，一連傾了六七罐，倒出來六七錠大紋銀，疑惑不知是否真銀。次日清早上街，送到店裡去看，錢店都說是十足紋銀，隨即換了幾十錢，拿回住處收好。趕到洪憨仙住處來道謝，果然仙家妙用，憨仙道：「早哩，我這裡還有一些，先生再拿去試試。」又取出一包來，比前有三四倍，送與馬二先生。別了回來，一連在住處燒爐，燒了六七天，把那些黑煤都傾完了，都是紋銀，上戥子一秤，足有八九十兩，馬二先生歡喜無限，一包包收藏起來。

    這一日，憨仙請馬二先生去，憨仙道：「先生，你是處州，我是臺州，相近原要算是同縣。今日有個客來拜我，我和你要認作中表弟兄，將來自有一番交際，不可有誤。」馬二先生道：「請問這位尊客是誰？」

    憨仙道：「便是這城裡胡尚書家三公子，名縝，字密之。尚書公遺下宦囊不少，這位公子卻有錢癖，想要多多益善。他要學我這燒銀之法，眼下可以拿出萬金來，以為爐火藥物之費。但這事須有一位中間的人，先生的大名，他是知道的，何況在書坊選批文章，是有蹤跡可尋、可靠的人，他更可以放心。如今相會過了，決定此事，開始燒銀，到七七四十九天之後，成了銀母：凡是一切銅錫之物，點著就成黃金，何止數十百萬？我是用他不著，到那時告別還山，先生得了這銀母，家道自此也可以小康了。」

    馬二先生見他如此神術，有什麼不信。等到胡三公子來，憨仙介紹：「這是舍弟，各書坊所貼『處州 馬純上先生選三科程墨』的便是。」胡三公子改容尊敬，施禮坐下。三公子舉眼一看，洪憨仙人物軒昂，行李華麗，四個長隨，輪流獻茶，又有選家馬先生是至親，歡喜放心，坐了一會去了。

    次日，憨仙同馬二先生回拜胡府。第三天是胡三公子請客，兩席酒、一本戲，吃了一日。胡三公子約定三五日後，到家來寫立合同，就請馬二先生作中人，然後在自家花園裡準備丹室，先兌出一萬兩銀子來，託憨仙修製藥物。並請憨仙住進丹室，開始工作。

    一連四天，不見憨仙處有人來請，馬二先生過去探望，一進了門，只見那幾個長隨不勝慌張，敢問方知是憨仙病了，症候甚重，醫生已不肯用藥。馬二先生大驚，上樓去看，已是奄奄一息，頭都抬不起來。

    馬二先生好心相伴，晚間也不回去。挨過兩天，那憨仙壽盡身亡。四個手下慌了手腳，寓所一擄，只有四五件紬緞衣服，還可當得幾兩銀子，其後一無所有，幾個箱子都是空的。這四個人也並不是什麼長隨，是一個兒子，兩個姪兒，一個女婿，這時都說出身分。馬二先生聽在肚裡，替他們著急，此時連買棺材的錢都不夠，馬二先生有良心，趕回住處，取了十兩銀子來與他們料理。

    兒子守著哭泣、姪子上街買棺材，女婿無事，同馬二先生走去隔壁茶館談談。馬二先生道：「你令岳是個活神仙，活了三百多歲，怎會忽然間就死？」

    女婿道：「笑話！他老人家今年只得六十六歲，哪有什麼三百歲？想著他老人家，也就是不守本分，慣弄玄虛。尋來錢又混用掉了，而今落得如此收場！不瞞你先生說，我們都是買賣人，拋下生意，跟著他作這種騙人的事。如今他一死，害得我們要討飯回縣，這話從哪裡說起！」馬二先生提起那一包包黑煤，燒起爐來，一傾就是紋銀。

    女婿道：「哪裡是什麼黑煤，那就是銀子，用煤弄黑了的！一下了爐，銀子本色就現出來了。那原是作出來騙人的，用完了那些，就沒得再用了。」

    馬二先生道：「還有一點，他若不是神仙，為何在丁仙祠初見我的時候，不曾認得就知我姓馬？」女婿道：「你又差了！他那日在片石居扶亂出來，看見你坐在書店看書，書店的人問你尊姓？你說就是書面上馬什麼的，他聽了記在心裡。世間哪有什麼神仙！」

    馬二先生這才恍然大悟，憨仙的結交，目的是要借馬二先生的名頭作中人，去騙胡三公子家上萬兩的銀子。幸得胡家時運高，不曾上當；更幸得這騙局還未弄成，馬二先生不受連累。

    馬二先生忠厚，又想道：「他虧負了我什麼？我到底還是該感激他才是。」當下候著裝殮，算還廟裡的錢，叫腳夫抬去清波門外，暫時厝著。馬二先生備了個牲禮紙錢，送到厝所，看著用磚砌好了，剩下的銀子，那四個人作旅費，謝別了馬二先生，回鄉去了。

    (選自〈儒林外史-書生現形記〉時報文化出版公司)'
