  - label: C
    content: 無邊落木蕭蕭下，不盡長江滾滾來。萬里悲秋常作客，百年多病獨登臺（杜甫〈登高〉）
  - label: D
    content: 花自飄零水自流，一種相思，兩處閒愁。此情無計可消除，才下眉頭，卻上心頭（李清照〈一翦梅〉）
