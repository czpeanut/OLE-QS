  stem: 乙文作者認為李清照以「『綠肥紅瘦』一句抒發傷春之情」的原因，最可能為下列何者？
  options:
  - label: A
    content: 紅花與綠葉並存展現春天景色優美，生機盎然，使人格外眷戀
  - label: B
    content: 紅花與綠葉歷經昨夜風雨仍屹立不搖，使人油然而生憐惜之情
  - label: C
    content: 紅花與綠葉的不同說明萬物各有其美好姿態，值得欣賞、體會
  - label: D
    content: 紅花與綠葉的消長暗示美好事物難以長存，猶如春日無法永駐3
  group_stem: '甲

    昨夜雨疏風驟，濃睡不消殘酒。試問捲簾人，卻道海棠依舊。知否？知否？應是綠肥紅瘦。（李清照〈如夢令〉）

    乙

    李清照的〈如夢令〉善於化用古人詩句，更技高一籌，成為千古絕唱。此詞情境取唐人孟浩然〈春曉〉：「春眠不覺曉，處處聞啼鳥。夜來風雨聲，花落知多少。」夜來風雨後花落的意象。更直接的關聯，則取自唐末韓偓的〈懶起〉：「昨夜三更雨，今朝一陣寒。海棠花在否？側臥捲簾看。」詩中的夜雨、海棠、捲簾，皆被李清照襲用，脫胎成「昨夜雨疏風驟，濃睡不消殘酒。試問捲簾人，卻道海棠依舊」。綜觀〈如夢令〉一詞，語言婉轉含蓄，筆調跌宕有致，看似描寫海棠花的凋零，實為李清照對大自然變化的敏感，以及對春光一瞬和好花不常在的無限惋惜。其中「綠肥紅瘦」一句抒發傷春之情，尤為後人所稱道。'
