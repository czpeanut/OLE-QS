  type: single
  page: 4
  stem: 下列何者是本文寫作的主要用意？
  options:
  - label: A
    content: 讚嘆西湖冬日雪景的奇絕
  - label: B
    content: 藉冬雪烘托自己高潔的情操
  - label: C
    content: 敘述與好友在西湖飲酒的雅趣
  - label: D
    content: 表達對自然山水的雅好與痴迷。
  group_stem: '崇禎五年十二月，余住西湖。大雪三日，湖中人鳥聲俱絕。

    是日，更定矣，余拏一小舟，擁毳衣、爐火，獨往湖心亭看雪。霧凇沆碭，天與雲、與山、與水，上下一白。湖上影子，惟長堤一痕，湖心亭一點，與余舟一芥、舟中人兩三粒而已。

    到亭上，有兩人鋪氈對坐，一童子燒酒，爐正沸。見余大喜，曰：「湖中焉得更有此人！」拉余同飲，余強飲三大白而別。問其姓氏，是金陵人客此。及下船，舟子喃喃曰：「莫說相公痴，更有痴似相公者。」(張岱〈湖心亭看雪〉）'
