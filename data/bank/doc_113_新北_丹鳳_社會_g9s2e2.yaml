- id: doc_113_新北_丹鳳_社會_g9s2e2_s3_47
  section: 3
  number: 47
  type: single
  page: 6
  stem: 針對川普政府的關稅政策，我國行政院擬定「9 大面向、20 項措施、總經費880 億元」支持方案。請問以上敘述呈現出哪些全球化的影響面向？
  options:
  - label: A
    content: 經濟全球化、文化全球化
  - label: B
    content: 經濟全球化、政治全球化
  - label: C
    content: 文化全球化、政治全球化
  - label: D
    content: 軍事全球化、政治全球化
  group_stem: "題組：請依據下列文章回答第47-48 題。\n  2025 年4 月，美國總統川普為兌現其「美國優先」的競選承諾，宣布實施新一波關稅政策，將實施「全球對等關稅政策」（Reciprocal\
    \ Tariffs），最低稅率為10%，部分國家將面臨更高稅率，其中臺灣被課徵32%。川普政府強調，這項政策目的是保護美國本土產業、促進就業，並重建美國的製造優勢。\n\
    \  與此同時，美國也針對臺灣的貿易政策做出調整。部分臺灣出口的科技產品，如晶片設備與精密零組件，被列入「戰略關鍵物資」清單，暫時免除關稅以確保美國供應鏈安全；但對於其他項目如塑膠製品與民生用品，則小幅提高關稅。此舉顯示，美國在實行貿易保護的同時，也根據地緣政治與產業戰略，對不同國家實施差別待遇。\n\
    \  針對美國川普總統公布的對等關稅政策，其中對我國開徵32%關稅一事，行政院長卓榮泰率領相關部會首長召開「因應美國關稅我國出口供應鏈支持方案」記者會，向國人說明影響評估及因應措施。卓院長表示，政府已擬定「9\
    \ 大面向、20 項措施、總經費880 億元」的支持方案，全力讓「國家經濟穩定、產業發展穩定、國人生活安心」。\n  川普此波關稅政策引發國際社會關注。中國、歐盟等主要貿易夥伴紛紛表示抗議，認為美國違反自由貿易原則，破壞WTO\
    \ 規範，並已正式向WTO 提出申訴，要求啟動爭端解決機制。該事件再次引發對全球化發展與國際貿易秩序的廣泛討論。"
