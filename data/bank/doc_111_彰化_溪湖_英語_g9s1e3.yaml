    content: Parents
  - label: B
    content: Smaller clothes
  - label: C
    content: Babies
  - label: D
    content: New packages of clothes
  group_stem: "(二)\n    For many young parents, buying clothes for their babies is\
    \ a troubling problem. In Demark, it costs about ninety-seven thousand NT dollars\
    \ to buy clothes for babies in a year. Babies grow, and the clothes become too\
    \ small for them to wear, so a brand, Vigga, has a new way for parents to rent\
    \ clothes for their babies. Parents pay some money once in every month, and then\
    \ they can have 20 pieces of clothes in their babies’ size. When the clothes are\
    \ becoming small, they can be replaced by a new package of clothes one size bigger.\
    \ The returned clothes must be washed cleanly.\n    The important idea of Vigga\
    \ is to make a new way of sharing clothes and recycle the clothes when they are\
    \ too old to wear again. Parents don’t have to worry about buying clothes for\
    \ babies any more. They can rent them when they need.\n******************************************\n\
    brand 品牌      rent 租用      replace 替換\nreturn 歸還        recycle 回收"
