  group_stem: "(三)\n    Many people keep some animals as pets. For example, cats,\
    \ dogs, rabbits, and sea animals. Although these animals have eyes as humans do,\
    \ some of them can’t see certain colors. In other words, they are color-blind.\n\
    \    Dogs’ cute faces and their loyalty make people love them. However, they can’t\
    \ see red, orange, and green. These colors always appear yellow or blue to them.\
    \ A green plant becomes a yellow or blue plant to dogs. For cats, they can see\
    \ things in blue or green, but things in red appear in different colors to them.\n\
    \    Most sea animals can only see black and white. For example, sharks, whales,\
    \ and dolphins. As the time goes by, they might lose their color vision because\
    \ they live under the sea. There is one sea animal which can’t see colors. The\
    \ sea animals are skates. Can you imagine living in a world without any colors?\n\
    ******************************************\ncertain 特定的   loyalty 忠誠 skate 鰩科魚\
    \  imagine 想像"
