    content: Their eyes might be smaller.
  - label: B
    content: Their brain will be damaged.
  - label: C
    content: They might have trouble sleeping.
  - label: D
    content: Things might not be clear to them.
  group_stem: "(一)\n    Eyes are one of the most important parts of our bodies. People\
    \ use eyes to do a lot of things. For example, we use them to watch movies, see\
    \ beautiful scenery, and study. Without it, it might be difficult to do things\
    \ that people are doing every day.\n    However, people have to protect their\
    \ eyes because they are easily damaged. If people don’t take a rest after using\
    \ their eyes for some time, they might be nearsighted.\n    In other words, they\
    \ can’t see things as clearly as before. Some people even become blind. When parts\
    \ of their eyes don’t work, the information can’t be sent to the brain. Therefore,\
    \ blind people can’t see things what is showing to them.\n    There are some ways\
    \ to protect the eyes. First, use them for thirty minutes and take a rest for\
    \ ten minutes. People can follow this rule when they are playing video games or\
    \ studying. Second, get some exercises. Exercising can help people’s eyes relaxed.\n\
    ******************************************\nprotect 保護  nearsighted 近視的  brain\
    \ 大腦\nrelaxed 放鬆的"
