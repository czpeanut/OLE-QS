    在外星人阿弟的協助下，經過不斷嘗試，努力調整儀器參數，阿比終於將身體縮小成適當大小，如願以償地進入細胞。但奇怪的是，阿比一進入細胞，就有一股神祕的力量將他往細胞外推。相反地，離開細胞後，卻又有一股神祕的力量將阿比往細胞內送，如此往復，讓阿比頭昏腦脹。


    在阿弟的幫助下，阿比幸運地逃過溶體的追殺，並回復成原來的大小，突然，阿比瞥見布告欄上的公告：11 月5日(二)，七年級同學要去六福村進行戶外教育。阿比興奮的說：「他們也要戶外教育耶！看來六福村一定很有趣，我們也去六福村看看！」


    後記：經過兩天颱風假的短暫拜訪，阿比和阿弟覺得地球實在太有意思了，一定要長期研究才行。為了避免被人類發現，他們決定『附身』在福和國中生物老師上，以便進一步探訪地球的萬事萬物。所以啊，當你經過生物老師身旁，不經意地說出『克卜勒22b』，而生物老師臉上浮現詭秘又意味深長的微笑時……嘿嘿，你懂得，他/她可能就是阿比……或阿弟，請心照不宣地點點頭喔！😊'
