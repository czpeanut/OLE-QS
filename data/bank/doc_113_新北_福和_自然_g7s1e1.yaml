  section: 1
  number: 41
  type: single
  page: 4
  stem: 當他們駕駛飛碟進入地球大氣層，隨著海拔高度越來越低，突然螢幕發出【發現地球生物警告！】，請問，此時高度計的顯示的海拔高度應該會是？
  options:
  - label: A
    content: 2 萬公尺
  - label: B
    content: 1 萬公尺
  - label: C
    content: 5 千公尺
  - label: D
    content: 0 公尺。
  group_stem: '題組：阿比和阿弟的地球探險

    為了完成學校規定的戶外教育作業，來自【克卜勒22b】星球的阿比和阿弟，兩位年輕有為又英俊的外星少年，選定600 光年遠的藍色星球—地球，進行探訪學習之旅……


    阿比和阿弟順利地降落在西太平洋的海面上，透過地球新聞得知，新北市正因為山陀兒颱風來襲而放颱風假，學校全面停班停課，於是他們潛入福和國中生物實驗室，期待能進一步了解地球生物。阿比：「據說地球的生物都是由細胞組成，而且有兩種典型的細胞分別構成植物體和動物體，我們一起探索這兩種細胞吧！」於是阿比和阿弟開始分別研究如附圖的兩種細胞。


    在外星人阿弟的協助下，經過不斷嘗試，努力調整儀器參數，阿比終於將身體縮小成適當大小，如願以償地進入細胞。但奇怪的是，阿比一進入細胞，就有一股神祕的力量將他往細胞外推。相反地，離開細胞後，卻又有一股神祕的力量將阿比往細胞內送，如此往復，讓阿比頭昏腦脹。


    在阿弟的幫助下，阿比幸運地逃過溶體的追殺，並回復成原來的大小，突然，阿比瞥見布告欄上的公告：11 月5日(二)，七年級同學要去六福村進行戶外教育。阿比興奮的說：「他們也要戶外教育耶！看來六福村一定很有趣，我們也去六福村看看！」


    後記：經過兩天颱風假的短暫拜訪，阿比和阿弟覺得地球實在太有意思了，一定要長期研究才行。為了避免被人類發現，他們決定『附身』在福和國中生物老師上，以便進一步探訪地球的萬事萬物。所以啊，當你經過生物老師身旁，不經意地說出『克卜勒22b』，而生物老師臉上浮現詭秘又意味深長的微笑時……嘿嘿，你懂得，他/她可能就是阿比……或阿弟，請心照不宣地點點頭喔！😊'
