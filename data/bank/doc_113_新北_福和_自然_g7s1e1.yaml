- id: doc_113_新北_福和_自然_g7s1e1_s1_38
  section: 1
  number: 38
  type: single
  page: 3
  stem: 根據本篇文章內容，下列敘述何者錯誤？
  options:
  - label: A
    content: 動物在體內將葡萄糖轉化為維生素C 的過程是一種代謝作用
  - label: B
    content: 維生素C 分子是由三種原子構成
  - label: C
    content: 長期缺乏維生素C 可能會導致敗血症造成病患死亡
  - label: D
    content: 貓狗都能夠自行合成維生素C。
  group_stem: '閱讀題：維生素C 與壞血病

    維生素C 又稱抗壞血酸，分子式為$C_{6}H_{8}O_{6}$，和葡萄糖的分子式$C_{6}H_{12}O_{6}$十分類似，只是少了4 個氫原子。由此看來，生物似乎可以輕易地從葡萄糖分子轉化獲得維生素C。事實上也的確如此，絕大部分哺乳動物都可以利用體內的葡萄糖來合成維生素C，例如許多純肉食性的動物，除了可以從生肉、生肝臟中獲得維生素C
    外，也能夠自行合成，所以即使不吃蔬果，也不會出現維生素C 缺乏的病徵。但是人類、猿猴、天竺鼠、大部分蝙蝠則是例外，這些哺乳類必須從飲食中獲得維生素C，無法在體內自行合成。

    壞血病是一種因長期缺乏維生素C 而引起的疾病，壞血病的症狀包括牙齦出血、皮膚瘀青、疲勞、關節疼痛以及嚴重的健康惡化，最終可能導致死亡。在16 世紀到18 世紀間，壞血病是航海者的致命威脅，數以萬計的船員因此喪命。

    1747 年，英國皇家海軍的醫生詹姆斯·林德（James Lind），決定進行一項實驗，希望能找出治療壞血病的最佳方法。他在軍艦上選擇了12 名患有壞血病的船員，並將他們分成6組，每組2
    人。這12 名船員的病情相似，並且他們的居住環境和日常飲食也保持一致，唯一的差別是每組船員接受的治療不同。林德醫生為每組船員提供以下不同的治療方案：

    第一組：每天飲用約一公升蘋果酒

    第二組：每天喝25 滴硫酸混合物

    第三組：每天喝兩湯匙醋

    第四組；每天飲用約半公升的海水

    第五組：每天吃兩個柳橙和一個檸檬

    第六組：每天服用大蒜、芥末、香料調配而成的混合膏

    因為柳橙和檸檬存量不足，林德醫生的實驗僅僅持續了6天。儘管如此，結果卻十分明顯：食用柳橙和檸檬的第五組船員恢復得最快，其中一名船員在6 天內完全康復，另一名也大大改善。其他治療方法的效果則微乎其微或者根本無效。

    林德醫生的實驗是歷史上首批科學臨床試驗之一，這個實驗對壞血病的研究具有重大意義。他的實驗證明了柑橘類水果（富含維生素C）對治療壞血病的有效性，這是醫學史上的一個重要發現。儘管林德的研究成果在當時並沒有立即得到廣泛應用，但隨著後來科學家們對維生素C
    的重要性有了進一步的了解，英國海軍終於從1795 年起正式使用柳橙和檸檬來預防壞血病。'
