  section: 1
  number: 4
  type: single
  page: 1
  stem: 開港通商對臺灣社會造成很大的影響，也對原住民族群產生巨大的衝擊，除了西方宗教的傳入、對原始山林的破壞等情況之外，清廷的「開山撫番」行動，導致原住民族嚴重的死傷。下列哪一事件即是清帝國時期的原漢衝突事件？
  options:
  - label: A
    content: 林爽文事件
  - label: B
    content: 大港口事件
  - label: C
    content: 戴潮春事件
  - label: D
