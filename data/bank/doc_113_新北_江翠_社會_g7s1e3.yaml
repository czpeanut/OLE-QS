- id: doc_113_新北_江翠_社會_g7s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 江翠週報的編輯年年近日在整理家族祖先留下的日記與族譜時，發現原來祖先在清帝國領臺初期曾經從事進出口貿易，而且經營得有聲有色，年年決定將其整理成一篇報導。他的報導中，應會出現下列何種內容？
  options:
  - label: A
    content: 由洋行掌握臺灣的進出口貿易
  - label: B
    content: 祖先經營的「泉郊」，專營對廈門的貿易
  - label: C
    content: 祖先的貨品從鹿耳門出口到廈門
  - label: D
    content: 祖先的主要貿易對象是日本人。
