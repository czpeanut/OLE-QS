  number: 8
  type: single
  page: 1
  stem: 江翠國中七年級同學日前至新竹進行史蹟考察活動，導覽人員在介紹清代「開臺進士」鄭用錫的住所「進士第」時，進行了有獎徵答，問題是「清初在臺灣考上舉人與進士的人數少之又少，甚至還要設立保障名額，但自嘉慶、道光年間以後，愈來愈多的臺人子弟考上科舉，造成此種改變的原因為何？」請問:下列哪一位同學得到了獎勵？
