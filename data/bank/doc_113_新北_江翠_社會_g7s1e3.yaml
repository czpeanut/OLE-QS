  stem: 平埔族人原本沒有姓氏只有名字，乾隆23 年(西元1758 年)，清廷諭令：「平埔各族薙髮同時賜姓」。當時賜給平埔族群的姓氏包括：潘、陳、劉、戴、李、王等，實際上取用潘姓最多。請問：這項政策的用意為何？
