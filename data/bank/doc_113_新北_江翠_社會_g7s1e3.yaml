  section: 1
  number: 10
  type: single
  page: 2
  stem: 依據文中提及的內容來判斷，茶葉帶動○○地區的繁榮，○○成為茶葉的集散地，○○指的是下列何地？
  options:
  - label: A
    content: 艋舺
  - label: B
    content: 大稻埕
  - label: C
    content: 鹿港
  - label: D
    content: 八里坌。
  group_stem: 台灣開港通商後，英商陶德自福建運來茶苗，自此播下臺灣茶業的種子。數年後此作物在臺灣種植成功，帶動○○地區的繁榮與發展，○○成為茶葉的集散地，提供許多新興的工作機會。茶葉由淡水出口
