- id: doc_113_新北_江翠_社會_g7s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 新新是清康熙時期的漳州人，聽人家說臺灣未開發的土地廣大、工作機會多，決定到臺灣打拚。他來到臺灣時，可能有怎樣的遭遇？
  options:
  - label: A
    content: 供奉原鄉神明三山國王
  - label: B
    content: 多數平原地區已被開發，他只能依循法規前往深山進行開墾
  - label: C
    content: 政府鼓勵人民來臺開墾，漢人常攜家帶眷來臺
  - label: D
    content: 開墾土地時，原有水源不敷使用，他只好找人合資修築水圳。
