- id: doc_113_台中_大業_自然_g8s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 常被稱為空氣污染物的氮氧化合物指的是下列哪兩個物質？
  options:
  - label: A
    content: NO、$N_{2}O$
  - label: B
    content: $NO_{2}$、$N_{2}O_{5}$
  - label: C
    content: $N_{2}O$、$N_{2}O_{5}$
  - label: D
    content: NO、$NO_{2}$
  group_stem: '氮氧化合物指的是「僅由氮、氧2 種元素組成的化合物」，常見的氮氧化合物有一氧化氮（NO，無色）、二氧化氮（$NO_{2}$，紅棕色）、一氧化二氮（$N_{2}O$）、五氧化二氮（$N_{2}O_{5}$）等，其中除五氧化二氮常態下呈固體外，其他氮氧化合物常態下都呈氣態。常被稱為空氣污染物的氮氧化合物（NOx）是指一氧化氮及二氧化氮。

    空氣中的氮氧化合物過多會導致濃煙霧（Smog），減低可見度、損害植物、刺激眼睛，並引起咳嗽，刺激胸腔。當氮氧化合物在大氣中與水氣化合成硝酸時，隨著下雨的過程，即形成酸雨，高酸度的雨水對許多水生生物有害，並會阻礙植物生長、使其落葉。請根據內容回答第10
    至第11 題。

    【資料來源：科技網DIGITIMES】'
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 理化
      code: 2-2
      title: 氧化與還原反應
      chapter: 第2章 氧化還原反應
    textbook: 八下理化 2-2 氧化與還原反應
    labeled_by: ai
