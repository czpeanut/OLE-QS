- id: doc_113_台中_大業_自然_g8s2e1_s1_20
  section: 1
  number: 20
  type: single
  page: 4
  stem: '對於文章中所提到的三個化學反應式之敘述，何者正確？

    甲反應式：$3C＋2Fe_{2}O_{3}\rightarrow 4Fe＋3CO_{2}$

    乙反應式：$2C＋O_{2}\rightarrow 2CO$

    丙反應式：$2Fe_{2}O_{3}＋3CO\rightarrow 2Fe＋3CO_{2}$'
  options:
  - label: A
    content: 甲反應式中，C 發生氧化，Fe 發生還原
  - label: B
    content: 乙反應式僅單純發生氧化反應，而無還原反應發生
  - label: C
    content: 丙反應式中，CO 同時發生氧化及還原反應
  - label: D
    content: 三個反應式中，發生氧化的物質，其反應係數總和等於8
  group_stem: '鋅、鐵、鉛和銅等大多數金屬，都是以化合物形式存在於自然界礦石中。從金屬礦中提煉出金屬的過程稱為冶煉，由於碳對氧的活性比這些金屬大，且價格較便宜，所以常用來還原這些金屬礦。

    鐵礦冶煉（如圖二）是以鐵礦、煤焦（C）與灰石（$CaCO_{3}$）為主要原料，將原料依適當比例混合後，從爐頂受料斗送入高爐中加熱，並由爐底風口處通入熱空氣以利反應進行。煤焦和鐵礦經過一連串複雜的反應，最終產生鐵與二氧化碳，還原出來的鐵在高溫中會熔化成液態鐵，從高爐下方出鐵口流出。化學反應式為：

    $3C＋2Fe_{2}O_{3}\rightarrow 4Fe＋3CO_{2}$

    高爐中的煤焦在空氣不足下，燃燒會產生一氧化碳，一氧化碳在煉爐中亦會將鐵由鐵礦中還原出來。

    $2C＋O_{2}\rightarrow 2CO$

    $2Fe_{2}O_{3}＋3CO\rightarrow 2Fe＋3CO_{2}$

    請根據內容回答第20～21 題'
