  group_stem: '(4-5)

    Red is a strong and warm color. It means love, danger, or full of life. Many people
    wear red on Valentine’s Day. Red also means “stop” in traffic lights. In art,
    red can show strong feelings. The artist Henri Matisse used red to show energy
    in The Red Room.

    Blue is a cool color. It makes people feel calm or sad. In everyday life, many
    offices and hospitals use blue to help people feel quiet. Pablo Picasso used blue
    in his “Blue Period” to show sad feelings in his art.

    Yellow is bright and happy. It is the color of the sun. People often use yellow
    in children’s books and school signs. Yellow catches our eyes quickly. The artist
    Vincent van Gogh used yellow in Sunflowers to show joy and light.

    Green is the color of trees, grass, and plants. It means nature, health, and “go”
    in traffic lights. In shops, green is used to show that it is good for the earth.
    Artists use green to show life or hope.

    Colors help us understand the world. They give us feelings, send messages, and
    make things beautiful. Artists, shops, teachers, and even street signs all use
    colors to help people.


     nature 自然 message 訊息'
