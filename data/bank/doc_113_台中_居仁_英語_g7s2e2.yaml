    Easter is a special holiday. Around the world, people do many fun things on Easter.


    In the UK and other places, kids enjoy Easter egg hunts. They look for chocolate
    eggs in parks and gardens. Sometimes, people have egg-rolling races. The game
    is to roll your egg down a hill without breaking it!


    In parts of Mexico, people fill empty eggs with colorful paper pieces. When you
    break the egg on someone''s head, it can bring good luck. In Sweden and Finland,
    children dress up like Easter witches and go trick-or-treating.


    In the USA, the UK, and Australia, many young students make special hats called
    Easter bonnets. They put flowers, eggs, and other colorful things on their hats
    to make them look beautiful.


    In Bermuda, two days before Easter Sunday, on Good Friday, people love to fly
    kites. Some people buy their kites, and others make them themselves.


