  group_stem: 'b. “The Last __(35)__” in the Ocean（35-38：8%）

    (In Uncle Paul’s house)

    Ann: Is this a straw? It looks so strange.

    Paul: Yes, it’s a metal straw. I can use it again and again.

    Ann: Why bother? Isn’t a plastic straw more convenient?

    Paul: That’s true, but there’s a problem. Look at this photo.

    Ann: Oh! That looks terrible.

    Paul: Some of your convenient plastic straws may end up in the ocean and in a
    turtle’s nose.

    Ann: I see your point. Perhaps we should use fewer plastic straws to save our
    ocean.

    Paul: You’re right. If we don’t take action now, by the year 2050, there will
    be more plastic in the ocean than fish.


    (Another day)

    Ann: Look, Uncle Paul. I got my own straw. I followed your example.

    Paul: That’s good though you’re still carrying your drink in a plastic bag.

    Ann: What’s wrong with that?

    Paul: Most of the plastic in the world takes a long time to break down.

    Ann: It lasts longer than us?

    Paul: Correct. Even worse, it’s bad for many of the sea animals.

    Ann: How?

    Paul: Seabirds feed plastic trash to their babies. What’s more, turtles can’t
    tell plastic bags from jellyfish, so they often eat the bags as food.

    Ann: Gee! That would be "the last straw" for the ocean.'
