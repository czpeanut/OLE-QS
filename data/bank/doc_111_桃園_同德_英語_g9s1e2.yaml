  group_stem: 'a. Sharing News is OK As Long As You Check It First （31-34：8%）

    Fiona: Hi, Scott. I sent you a news report about someone who suddenly attacked
    some foreigners with a sharp knife yesterday, but you didn’t answer right away
    like you usually do. I was really __(31)__.

    Scott: Sorry about that. It’s because I was checking the information in that news
    report, and I found __(32)__ you shared some fake news with me, just like the
    boy who cried wolf!

    Fiona: “I’m nothing like him!” First, he was lazy. Second, he got bored while
    he was watching the sheep, so he tricked people into believing a wolf was attacking
    his sheep. That’s not like sharing a news report at all, even if it is fake.

    Scott: That may be true, but as long as you keep sharing news reports without
    checking them first, you might give others the wrong information. As a result
    of that, people may get into trouble. For example, people have lost their jobs
    or gotten hurt because of fake news. That’s why we have to be really careful.

    Fiona: I’m sorry. I never meant to hurt anyone. What can I do to change that?

    Scott: I’m glad to hear that. The next time you send someone a news report, the
    best thing to do is to make sure it is real before you share it.

    Fiona: Well, that’s going to be hard because I like to share things as soon as
    I find out about them, but I’ll __(33)__.


    ★as long as→ only if/ ★attack→ try to hurt or kill/ ★as soon as→ possibly quickly'
