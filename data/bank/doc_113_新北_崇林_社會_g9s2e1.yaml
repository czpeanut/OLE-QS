  type: single
  page: 4
  stem: '地名常被稱作「活化石」，透過地名的解讀，可以「還原過去地表的自然景觀」。請問下列哪一個地名之演變，可以用來證明此一論述？

    (甲)臺南市西港區的地名由來是因位於直加弄港(今臺南市安定區)的西側，昔日為台江南海的港口，但目前西港已距離七股潟湖有12 公里遠

    (乙)臺北市文山區的木柵之由來與清代漢人前來拓墾時，在景美溪畔設木柵以抵擋原住民族的侵擾有關

    (丙)早期平埔族聚落都稱為「社」，彰化縣社頭鄉之由來即代表當時是和安雅族大武郡社頭目首領居住之地

    (丁)嘉義縣六腳鄉之由來是清代有六戶農家在此耕稼、居住，原稱「六家佃庄」，後因「家」與「腳」的臺語音似，外人誤音成習，讓地名從六家變成六腳'
