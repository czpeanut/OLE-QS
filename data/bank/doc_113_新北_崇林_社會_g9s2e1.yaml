- id: doc_113_新北_崇林_社會_g9s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 請問關於人物(甲)的描述，下列何者「錯誤」？
  options:
  - label: A
    content: 人物(甲)為美國總統威爾遜，他主張建立維護世界和平的組織並發表和平宣言
  - label: B
    content: 國情咨文中的「他們」是指拉丁美洲國家
  - label: C
    content: 人物(甲)的立場是支持「他們」獨立
  - label: D
    content: 隨著歐洲勢力的退出，美國漸漸的控制了「他們」。
  group_stem: '人物題：底下(甲)(乙)(丙)(丁)分別代表對近代歷史有重要影響的人物，請依照生平描述回答1~4 題

    (甲)西元1823 年，美國總統○○○於國會發表國情咨文時表示：「美國不干預現存的歐洲殖民地，也不會參與歐洲國家內部事務，但倘若歐洲國家進一步對「他們」進行殖民或對其政權進行干預，都將被視為侵略行為。」

    (乙)西元1862 年，普魯士議會拒絕國王威廉一世提出增加軍費的要求，幾日後，□□□在議會預算委員會前，強調準備軍事的重要。他的演說結論：「普魯士在德意志的地位，不取決於它的自由主義，而是取決於它的力量……當代的重大問題不是通過演說和多數派決議所能解決的，而是要用鐵和血來解決！」

    (丙)西元1812 年，被稱為「解放者」的△△△發表《卡塔赫納宣言》分析委內瑞拉第一共和國失敗的原因為內部不團結。除了領導委內瑞拉革命，他也曾推動哥倫比亞、玻利維亞等國獨立並表示：「只有團結才能驅逐敵人，建立一個自由的政府。」

    (丁)被稱為「荒野雄獅」或「科西嘉怪物」的☆☆☆數度擊敗反法聯盟因此被視為法國英雄人物，西元1815 年，被歐洲聯軍擊敗後，被流放於聖赫勒拿島上度過最後的人生。'
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 歷史
      code: 1-3
      title: 拉丁美洲的獨立運動
      chapter: 第1章 現代國家的建立
    textbook: 九下歷史 1-3 拉丁美洲的獨立運動
    labeled_by: ai
  ai_answers:
    gemini: A
    qwen: A
  answer:
  - A
  answer_status: ai_generated
  answer_source: ai:gemini+qwen
