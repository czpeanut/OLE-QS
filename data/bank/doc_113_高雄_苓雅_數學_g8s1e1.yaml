  group_stem: '數學老師替每位同學設定了考試成績標準，如下表。分數有達到標準以上(含) 的同學可獲得獎勵。

    後來老師發現大家這次考試的成績不太理想，決定以「$\sqrt{成績} \times 10$」的方式來加分。

    例如：原本分數為25 分，加分後為$\sqrt{25}\times 10$＝50 分。


