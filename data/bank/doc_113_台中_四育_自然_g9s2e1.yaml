  section: 1
  number: 1
  type: single
  page: 1
  stem: 聲帶是人體的發聲構造，位於喉部內，是由兩片皺褶狀的構造組成。聲帶之間的空間稱為聲門，如圖一所示。人體正常發聲時，氣流會由肺部通過聲門，並藉由聲帶的改變，造成聲音頻率的不同。根據上述，下列何者最可能是人體正常發聲時的相關構造變化？
  options:
  - label: A
    content: 肋骨下降，胸腔變小
  - label: B
    content: 肋骨上舉，橫膈下降
  - label: C
    content: 橫膈上升，胸腔變大
  - label: D
    content: 肺部先縮小，引發胸腔變小。
