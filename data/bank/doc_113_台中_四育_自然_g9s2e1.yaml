- id: doc_113_台中_四育_自然_g9s2e1_s2_33
  section: 2
  number: 33
  type: single
  page: 4
  stem: 依據本文所提供的資訊，下列關於糖尿病的敘述，何者錯誤？
  options:
  - label: A
    content: 患者的尿中會出現糖
  - label: B
    content: 古代的糖尿病人可能會因為酮酸中毒而死亡
  - label: C
    content: 可利用胰臟分泌的胰液控制血糖
  - label: D
    content: 目前可利用基因工程製造胰島素，供患者所需。
  group_stem: '「糖尿病」是一種古老的疾病，早在3000 多年前，埃及就有相關的記載；2000 多年前的希臘醫書也描述過第一型糖尿病(先天性糖尿病)的症狀。雖然人類早就認識到糖尿病的存在，但是，醫生對於糖尿病的治療依然是束手無策，患者經常死於酮酸中毒(註：糖尿病患者體內缺乏胰島素，造成體內酸性代謝產物──酮酸增加，所導致的併發症)。這也就是為什麼胰島素的製造及相關研究具有劃時代的意義，甚至先後產生三屆諾貝爾獎得主的原因。

    西元1889 年，馮梅林和明可夫斯基發現切除胰臟的小狗會多尿，且尿中有大量的糖，這是人類首度確認降血糖的物質存在於胰臟內。到了1916 年，沙佩沙爾醫生進一步提出胰臟中的胰島會分泌降血糖的激素，並將它命名為「胰島素」。然而，一直到1922
    年，班廷、貝斯特和麥克勞德利用胰管結紮術迫使胰臟的消化腺萎縮，才真正萃取出了胰島素，成功治療並挽救了一位患有第一型糖尿病男孩的生命。此後不到兩年的時間，胰島素已經廣泛的在世界各地使用。也因此，西元1923
    年的諾貝爾生理醫學獎決定頒發給這三位開創糖尿病治療新時代的研究者。

    雖然隨著科技的進步，胰島素已由早期自屠宰場取得的動物胰臟萃取，進步到近年來利用基因工程製造，暫時解決了糖尿病患者缺少胰島素的問題，但距離根本的治療之道還有很長的一段路要走，有待眾人的努力。

    《文章改編自：南一出版社-好自然科普閱讀篇-救命仙丹 胰島素的發明史》'
