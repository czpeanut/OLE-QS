  type: single
  page: 1
  stem: 小鼠性別決定機制與人類相同，但視覺僅能看見黃、藍和灰色。若將人類感光色素基因成功轉殖至許多小鼠受精卵的X 染色體之特定位置，則由此發育的小鼠可分辨紅綠燈的顏色。關於上述成功轉殖的這群小鼠，下列推論何者最合理？
