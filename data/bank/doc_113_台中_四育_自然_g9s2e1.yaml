  group_stem: 瘧疾是一種可致命的嚴重疾病，由屬於原生動物的瘧原蟲寄生所導致。這種疾病常見於氣候溫暖的地區，如非洲、東南亞及南美洲等熱帶及亞熱帶地區。瘧疾是由受感染的雌性瘧蚊（註：瘧蚊屬於昆蟲綱）傳播的疾病。雌性瘧蚊叮咬了瘧疾患者後，蚊子會受到感染，並在叮咬另一人時把瘧疾傳播開去。瘧疾並不會在人與人之間傳播，但卻可透過輸入受污染的血液或血液製成品、器官移植或共用刺針或針筒傳播。瘧疾亦可於懷孕或生產時由母親傳染胎兒或初生嬰兒。
