  group_stem: "【42-45】\n   Do you know what 2024, 2028, and 2032 have in common? They\
    \ are all leap years! Leap years happen every four years because the Earth takes\
    \ about 365.2422 days to go around the sun. To keep the calendar in line with\
    \ the Earth’s position, we add an extra day, called Leap Day, to February.\n \
    \  But how do we know what year is a leap year? It’s not hard to tell. There are\
    \ two ways to tell a leap year. On one hand, if the year can be divided by 4,\
    \ it is a leap year. On the other hand, if the year can be divided by 4, 100,\
    \ and 400 at the same time, it is also a leap year. Although Leap Day is not a\
    \ holiday, it is special and important for people born on that day because they\
    \ can only celebrate their real birthday once every four years! Or people born\
    \ on that day usually celebrate their birthday on the last day of February or\
    \ the first day of March.\n   After getting to know something about the Earth,\
    \ let’s talk about the moon. Do you know the moon always shows the same face to\
    \ us? This is because the moon turns at the same speed when it moves around the\
    \ Earth. It takes the moon about 27 days to turn once and about 27.3 days to go\
    \ around the Earth. That is why we never see the far side of the moon.\n   Leap\
    \ years and the moon are both great examples of how the Earth and space work together\
    \ perfectly. Isn’t science cool?\n in common 共通；calendar 日曆；position 位置；extra\
    \ 額外的；divided by 被…整除；celebrate 慶祝；speed 速度；square 方形的；space 太空"
