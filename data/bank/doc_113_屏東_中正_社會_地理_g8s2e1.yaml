  section: 1
  number: 9
  type: single
  page: 1
  stem: 東南亞位在兩大洋必經的位置上，自古以來就是不同文化接觸的地區，包含貿易、移民、殖民等等原因， 使得東南亞文化相當豐富多元。請問：下列各國的特色，何者不是因為殖民所形成的特色？
  options:
  - label: A
    content: 汶萊以伊斯蘭教為國教
  - label: B
    content: 雅加達為港埠型都市
  - label: C
    content: 菲律賓料理中有西班牙海鮮燉飯
  - label: D
    content: 印尼大規模種植油棕樹提煉棕櫚油
