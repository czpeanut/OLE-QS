  section: 1
  number: 10
  type: single
  page: 1
  stem: 根據聯合國（UN）的統計，印度（India）人口已經在2023 年4 月正式超越中國（China），成了全球人口第一大國。龐大的人口數量造就印度近年來經濟快速成長，但也對環境造成不少破壞。請問：下列關於印度近年來的環境問題，何者正確？
  options:
  - label: A
    content: 工業發展使得印度河汙染嚴重
  - label: B
    content: 平原西部地勢低窪，經常淹水
  - label: C
    content: 貧民窟經常有疾病擴散的問題
  - label: D
    content: 東北部土壤逐漸鹽鹼化
