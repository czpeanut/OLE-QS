  section: 2
  number: 1
  type: fill
  page: 2
  stem: 根據上文，荷蘭人統治臺灣時期，在大員興建統治臺灣的行政中心，當時如何稱呼該城？
  group_stem: 2024 年，台南市政府為紀念大員出現在大航海時代世界版圖 400 周年，以「台南 400」為主題，推出一系列的活動。也適逢台南市主辦台灣燈會，規劃兩大燈會區展示多件作品，另有無人機表演等，將台南歷史元素帶入。回顧台南的歷史，1624
    年荷蘭人抵達大員後，在當地建立行政中心，即今日「安平古堡」。後又擴大發展，在赤崁一帶建立商業市街，並在一場大規模動亂後，另建立西式城堡以鞏固對臺灣南部的統治。台南見證臺灣不同時期的興衰與變遷，可以說是臺灣歷史發展最悠久的城市之一。
