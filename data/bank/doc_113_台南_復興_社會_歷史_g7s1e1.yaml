  section: 1
  number: 13
  type: single
  page: 2
  stem: 清代將原住民族區分為「生番」及「熟番」，其分類的標準為何？
  options:
  - label: A
    content: 以漢化程度及是否服勞役為區分標準，漢化較深的為熟番，反之為生番
  - label: B
    content: 以生活方式不同加以區分，農業維生的是熟番，打獵維生的是生番
  - label: C
    content: 以種族加以區分，具有漢人血統的稱熟番，純粹原住民血統的為生番
  - label: D
    content: 以居住地區的不同加以區分，住平原為熟番，住山上的是生番
