- id: doc_111_高雄_大灣_國文_g7s2e2_s4_1
  section: 4
  number: 1
  type: single
  page: 4
  stem: 本文可能是下列哪一個演講活動的導讀資料？
  options:
  - label: A
    content: 人生最有價值的事------生命教育講座
  - label: B
    content: 尊重差異不挑不棄------品德教育講座
  - label: C
    content: 夢想起飛------做好生涯規劃
  - label: D
    content: 讓孩子願意聽------ 一分鐘親子神奇溝通術
  group_stem: "（一）\n 我讀初三那年，有一天晚上借住在小鎮的一個同學家裡，開夜車準備月考。那時電話還很不普遍，我無法向家中報備。第二天回家，父親不聽我的解釋，以為我交了壞朋友，嚴厲地責罵我一頓。這樣不分青紅皂白，心中有氣，我掉頭就走，從此三天不回家。\n\
    那天傍晚，我才走進院子，父親就放下手上的工作，帶著我往屋後的溪堤就跑，他的手上拿著兩個風箏。到了堤防，季風正盛，父親把其中一個風箏交給我，他自己則很快地把手中那只放到天上去：我有樣學樣，很快地，我的風箏也在天上飛翔了。突然一陣風吹來，父親大叫「抓緊繩子！」但是已經遲了。風箏掙脫我手中的束縛，只見它在空中搖擺了一陣，就很快地下墜，墜─墜─墜，終於落在遠處的一塊大石上。「唉！」我惋惜地嘆了一聲，很後悔自己那麼不小心。這時，父親把他的風箏線交給我，淡淡的說：「繩子握在你手中，風箏覺得不自由，隨時想掙脫，你一不小心，它掙脫了你的掌握，對啦！它自由了，但是，過份的自由卻害了它！」我默默地收拾好風箏，跟在父親的背後回家，父親沒有再說一句話。\n\
    \ 看著他日漸佝僂的背影，想到癱瘓在床的母親，我懊悔得想把自己撕裂！我是風箏，父親是放風箏的人，他手中的那條繩子，在我以為是束縛的，卻是他不盡的牽掛喲！\n\
    \ 羊牧〈放風箏〉"
