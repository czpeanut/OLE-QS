- id: doc_111_高雄_大灣_國文_g7s2e2_s4_3
  section: 4
  number: 3
  type: single
  page: 4
  stem: 根據報導內容，下列敘述何者正確？
  options:
  - label: A
    content: 只有特定海域的磷蝦才可以大量分解塑膠微粒
  - label: B
    content: 磷蝦可能會因為分解塑膠微粒而影響壽命
  - label: C
    content: 經由磷蝦分解的塑膠微粒，其縮減的比例並非完全一致
  - label: D
    content: 消化系統跟磷蝦類似的浮游動物皆已證實可以分解塑膠微粒
  group_stem: "（二）\n 澳洲格里菲斯大學九日於「自然通訊」期刊發表的最新研究顯示，磷蝦能夠消化海洋中五毫米以下的「塑膠微粒（microplastic）」，經過分解排泄後成為較小的「奈米塑膠（nanoplastic）」，意味位於食物鏈底層的磷蝦，可能成為對抗世界海洋塑膠汙染的秘密武器。\n\
    \ 格里菲斯大學於澳洲南極局（ADD）磷蝦水族館進行研究，檢視去角質凝膠等化妝品中使用的塑膠微粒，對海洋產生的毒害影響。研究人員意外發現，磷蝦的消化系統能分解塑膠微粒，在排泄後體積平均減少七十八％，有些甚至縮減九十四％。\n\
    \ 研究作者道森（Amanda Dawson）表示，研究結果令她「極度驚訝」，經過長時間重複測試後才確信這項發現。研究人員餵食磷蝦的是全新塑膠，由於塑膠在海洋中已經分解且更加脆弱，理論上能更輕易地被磷蝦分解。然而，當更小有機物無法消化含塑膠排泄物時，潛在毒物可能傳至食物鏈下層。\n\
    \ 研究共同作者、澳洲南極局生物學家川口博士（So Kawaguchi）則指出，這是科學家首次檢視磷蝦消化的塑膠微粒。研究顯示，擁有與磷蝦類似消化系統的其他浮游動物，可能也能分解塑膠微粒。\n\
    \ 據估計，每年有超過八百萬噸塑膠進入海裡，導致海洋生態系統數十億美元的損失，殺害一百多萬隻海鳥、十萬多隻海洋哺乳動物及無法計算的魚類。聯合國秘書長古特瑞斯去年引述研究強調，如果毫無作為，二○五○年海洋塑膠量將重過魚類。\n\
    \ 磷蝦為無脊椎浮游動物，成群漂浮在世界海洋上，只有迴紋針大小，壽命可達十年，能吃掉同等尺寸的生物。磷蝦是數量最多的物種之一，光是南冰洋就約有五億公噸，估計每隻一天能過濾八十六公升海水。生物學家指出，每天都有數百億公噸的南極海水經過磷蝦過濾，為分解塑膠做出重大貢獻。\n\
    \ 陳正健編譯〈磷蝦可消化塑膠 海洋汙染救星〉(2018/03/10《自由時報》)"
