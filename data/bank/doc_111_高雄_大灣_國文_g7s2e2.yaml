  number: 9
  type: single
  page: 1
  stem: 關於跳水、風箏兩首詩的作法，下列敘述何者有誤？
  options:
  - label: A
    content: 跳水由靜而動並運用色彩，營造生動的畫面感
  - label: B
    content: 風箏以天空為希望的象徵，比喻人生奮鬥的過程
  - label: C
    content: 跳水以跳水前→ 跳水過程→ 跳水後的順序敘述
  - label: D
    content: 均運用象徵筆法隱含對理想的追求
