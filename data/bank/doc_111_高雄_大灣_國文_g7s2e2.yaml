  stem: 以下是少年偵探團針對艾青跳水一詩所做的分析，請問何者分析的內容較為正確？
  options:
  - label: A
    content: 元太：「陶醉」於下面的湛藍一句中的「湛藍」是指倒映水面的天空
  - label: B
    content: 柯南：「從容的曲線」是指跳水者曼妙的身材
  - label: C
    content: 步美：作者運用「青春」與「激起」描寫觀眾對跳水比賽滿懷著熱血與衝勁
  - label: D
    content: 光彥：「雪白的讚嘆」可看出觀眾相當肯定跳水選手努力實踐理想的表現
  lesson_raw:
    title: 跳水
    basis: 題目引用了艾青〈跳水〉
