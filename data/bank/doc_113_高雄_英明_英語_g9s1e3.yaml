  - label: D
    content: Providing farmers with more milk and meat.
  group_stem: "First Light News\nNov. 1, 2024 by Alex Robinson\nMeet the Goats That\
    \ Help Create Firebreaks\n\nGoats are great because they provide farmers with\
    \ milk and meat. Now, Scott Mort of 805 goats has found another way that goats\
    \ can provide for us.\nMort lives in California. There is bush everywhere there,\
    \ and the bush can easily catch fire and turn into a wildfire. So, to prepare\
    \ for the autumn wildfire season, people have to clear the bush and build firebreaks.\
    \ However, that takes a lot of time.\nThis is where Mort’s idea comes in. He gets\
    \ his goats to do it. He knows goats love to eat, eat fast, and eat continuously.\
    \ Also, getting goats to eat the bush is less expensive than having people clear\
    \ it away. Besides, it’s good for the Earth.\nWildfires have become a serious\
    \ problem in California and in many other parts of the country. So, Mort’s 805\
    \ goats and others like them might be just what we need to help fix the problem.\n\
    \n  firebreak 防火帶 provide 提供 California 加州 bush 灌木叢\n wildfire 野火 continuously\
    \ 持續地"
  shared_asset: g3_40_42
