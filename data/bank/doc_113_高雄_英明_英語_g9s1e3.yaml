  group_stem: 'Basketball is one of the most popular activities in the world now.
    You must know Kobe Bryant and Stephen Curry, but do you know when and how it appeared
    in the world?

    During the winter of 1891~1892, Dr. James Naismith, a PE teacher in the USA, wanted
    to give his students another sport to play between the end of the football season
    and the start of the baseball season. He put two baskets overhead on the walls
    at two ends of the gym and used a soccer ball. He also formed two teams to play
    the game. Each team had nine players to play the game. The players had to throw
    the ball into the basket, and they needed to keep the other team from throwing
    it into the other basket. Every game would last for twenty minutes.

    Early basketball game looked different from the game today: for example, the basket
    didn’t have a hole in the bottom, so every time a player threw the ball in, someone
    had to go up and get it out again! Another difference is dribbling, which didn’t
    exist in early basketball because the balls didn’t bounce well enough. Also, the
    first games were played with soccer balls. One thing that hasn’t changed, though:
    James Naismith put the basket 10 feet (3.05 meters) above the floor, and that’s
    where they’ve stayed.

    Although there have been changes in the rules, the game is still interesting and
    exciting to people today.  dribble 連續運（球） exist 存在 bounce 反彈'
