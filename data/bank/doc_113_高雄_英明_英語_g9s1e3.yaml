  group_stem: "Frida Kahlo, one of Mexico’s greatest artists, didn’t always want to\
    \ be a painter. She loved science and dreamed of becoming a doctor one day, but\
    \ life had a different plan for her.\nFrida Kahlo was born on July 6 in 1907.\
    \ Because of the polio she got at the age of 6, her right leg and foot grew much\
    \ thinner than her left one, and she had been wearing long skirts to cover that\
    \ for the rest of her life. When she was 18, a car accident happened and she was\
    \ badly injured. She had to stay in bed for several months. To kill time and forget\
    \ the pain, she started painting and finished her first self-portrait. Actually,\
    \ of the 143 paintings she drew in her life, 55 are self-portraits. Frida Kahlo\
    \ once said, “I paint myself because I am often alone and I am the subject I know\
    \ best.”\nFrida’s life wasn’t easy. She took 35 surgeries over her life and could\
    \ never have any children. Her marriage with Diego Rivera was full of trouble,\
    \ too. And, though Frida worked hard, sometimes people saw her only as “the wife\
    \ of Diego Rivera.” It was several years after her death in 1954 that her work\
    \ began to draw more and more attention from the public Through her beautiful\
    \ paintings, people get to know how painful she was and how strong her feelings\
    \ were. Even now, there are many art lovers visiting the Frida Kahlo Museum in\
    \ Mexico City every year to remember this unique woman.\n  Mexico 墨西哥 polio 小兒麻痺\
    \ pain 痛苦 surgeries 手術 marriage 婚姻"
