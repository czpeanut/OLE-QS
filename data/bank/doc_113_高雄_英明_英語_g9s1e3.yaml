  group_stem: "Tale of Tails\nMany animals have tails. They use their tails for many\
    \ different things. For example, some animals use their tails as flyswatters.\
    \ Have you ever seen cows moving their tails back and forth? They do so to move\
    \ bugs away from their bodies. Horses use their tails in this way, too.\nSome\
    \ animals hang by their tails like monkeys. Then they can use all their fingers\
    \ for other things, such as eating. Other animals that use their tails as “hangers”\
    \ are opossums. An opossum also climbs trees with its tail. Animals that live\
    \ in the water use their tails to help them swim. A fish moves its tail from side\
    \ to side. The rest of its body curves in a different way from its tail. Alligators\
    \ and crocodiles also swing their tails when they swim. Their large tails give\
    \ them power and speed.\nThe kangaroo has a large, useful tail. It is like a chair.\
    \ The kangaroo uses its tail to take a break and balance. The tail also helps\
    \ it to jump and land. This is important because an adult kangaroo can jump as\
    \ far as 15 feet at a time. A fox has a big, bushy tail. This is a good tail to\
    \ have on cold nights. The fox can put its tail over its nose while it is sleeping.\
    \ The tail is a blanket that keeps the fox warm.\n  opossum負鼠 curve捲曲 alligator短吻鱷\
    \ crocodile鱷魚 bushy濃密的"
