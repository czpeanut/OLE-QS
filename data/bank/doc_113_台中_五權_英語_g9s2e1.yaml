  section: 2
  number: 33
  type: single
  page: 4
  stem: What’s the main idea of the reading?
  options:
  - label: A
    content: The importance of flying far and landing safely in ski jumping
  - label: B
    content: How Eddie the Eagle made ski jumping popular
  - label: C
    content: The reason why people like ski jumping
  - label: D
    content: The history and change of ski jumping
  group_stem: "In 2016, the movie Eddie the Eagle made people around the world crazy\
    \ about ski jumping. To succeed in ski jumping, people need to slide down from\
    \ the top of a high hill and jump at point “t”(see picture 1). To win in ski jumping\
    \ games, players must “fly” as far as they can before they land, so “how to jump\
    \ far and safely” is very important to ski jumpers.\n    At first, after ski jumpers\
    \ took off at point “t”, they kept their legs straight and close to each other.\
    \ People called the position “standing style” because it looked like the players\
    \ were standing straight in the sky. A few years later, some ski jumpers from\
    \ Norway took a new position in the Olympic Games. After they jumped at point\
    \ “t”, they raised their hands above their heads and kept them straighten high.\
    \ The position looked like the position of swimming, so people called it “swimming\
    \ style. ”In 1950s, some ski jumpers gave up the swimming style. They didn’t raise\
    \ their hands above their head after they jumped but kept both arms close to their\
    \ legs. When they were flying in the sky, their bodies looked like the number\
    \ 1. People called it “parallel style.” The most important breakthrough in the\
    \ history of ski jumping happened when “V-style” appeared in 1969. Graf is the\
    \ first one to jump in the V-style. After he jumped, he spread his feet outward\
    \ to make the ski board on his feet look like the letter V. At that time, people\
    \ thought the position was ugly and stupid. However, people found the V-style\
    \ is in fact helpful in flying further and landing more safely in the late 20th\
    \ century, so it’s one of the most popular styles in ski jumping now.\nski 滑雪\
    \  position 姿勢  parallel 平行的  breakthrough 突破  spread.. outward 向外張開  century\
    \ 世紀"
