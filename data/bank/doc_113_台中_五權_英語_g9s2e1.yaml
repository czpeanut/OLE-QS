  group_stem: 'When looking at the pictures, many people cannot tell tortoises from
    turtles. People may think they look just like each other. Actually, tortoises
    are turtles, but not all turtles are tortoises. They are very different in many
    ways.

    Living Place Tortoises live on land and most of them can be found in Asia and
    Africa. However, turtles live in salt water, and people found them in Africa and
    America. One interesting thing is that both turtles and tortoises lay eggs on
    the ground.

    Shell Tortoises have large dome shaped shells and their shells are heavier, but
    turtles have streamlined and light shells. Light shells help turtles increase
    swimming speed.

    Diet Most tortoises are herbivores. They have plants and fruits for lives, but
    turtles can be both carnivores and herbivores. Turtles eat fruits, vegetables,
    and small fish or shrimps.

    Lifespan Tortoises can live as long as humans, around 60-80 years. Some tortoises
    can live for over 150 years. The longest living tortoise is 326 years. Unlike
    tortoises, turtles can only live 20-40 years. According to the record, the oldest
    turtle was 86 years.

    More to Know… Both are kept as pets, though small turtles are more common to be
    pets. Tortoises are actually easier to care for, but more expensive to own. Both
    of them need careful owners to take care of them for the lifelong time.

