- id: doc_113_基隆_銘傳_自然_g9s1e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 小銘與小星挑戰碰碰車時，兩輛車發生碰撞，車輛突然停止且兩人彼此都感受到相同大小的衝擊力，請問方框內描述現象主要可以運用哪一個物理定律作為解釋？
  options:
  - label: A
    content: 牛頓第一運動定律
  - label: B
    content: 牛頓第二運動定律
  - label: C
    content: 牛頓第三運動定律
  - label: D
    content: 能量守恆定律。
  group_stem: '【題組 2】

    八年級的兩位好友小銘與小星，跟著班上同學一起來到六福村進行校外教學，他們迫不及待地挑戰各種經典設施。一行人從旋轉木馬開始暖身，隨後體驗了驚險的雲霄飛車，小銘緊抓扶手尖叫連連，而小星則興奮地感受速度與高度的交替變化。

    接著，他們進入槓桿類的投石機遊戲，小星奮力一擊將小球拋得很遠，贏得了同學的喝采。緊接著，他們挑戰了翹翹板遊戲，比拼誰能最準確地利用槓桿原理達到平衡；碰碰車場上，小銘與小星在激烈的碰撞中大笑不止。午後，他們勇敢嘗試了大怒神，感受從高處俯衝而下的刺激；結束後，兩人又搭乘了摩天輪，欣賞全園的美景，並體驗高度變化帶來的物理奧秘。

    最後，他們來到水上滑道，速度越來越快，激起的水花讓所有人都開心地笑了起來。這一天的旅程不僅充滿歡笑，還讓小銘與小星透過遊玩親身體驗了槓桿原理、能量守恆與運動定律的奇妙之處。六福村的校外教學，成為了他們最難忘的一次物理探險！'
