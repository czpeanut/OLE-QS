- id: doc_113_基隆_銘傳_自然_g9s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 林家正擊出陽春全壘打，球從球棒擊出後飛行至外野看台。若球飛行過程中僅受重力作用，以下哪一項敘述是正確的？
  options:
  - label: A
    content: 球的動能保持不變
  - label: B
    content: 球的位能保持不變
  - label: C
    content: 球的力學能保持不變
  - label: D
    content: 球的速度保持不變
  group_stem: '【題組 1】

    2024 年世界棒球 12 強賽冠軍戰的第五局上半，中華隊與對手以 0 比 0 僵持不下。比賽進入最緊張的時刻，此時林家正走上打擊區，肩負著打破僵局的重任。對方投手深吸一口氣，投出了一顆時速
    144 公里/小時的快速球，力求讓林家正出局！林家正見球路清晰，果斷揮棒，球棒精準擊中球心！只見棒球瞬間被擊飛，以每秒 50 公尺的速度飛向外野。這支球在空中畫出了一道完美的弧線，越過了外野全壘打牆！林家正振臂高呼，全場觀眾歡聲雷動，這支陽春全壘打幫助中華隊率先拿下一分，打破僵局！氣勢如虹的中華隊繼續進攻，接下來陳傑憲在一二壘有人情況下，果斷揮棒，擊出一支三分全壘打！棒球高速飛行，測速器顯示球速高達每秒
    45 公尺，瞬間越過外野全壘打牆。觀眾席上的歡呼聲達到最高點，中華隊在這一局攻下了 4 分，成功奠定領先優勢。這場比賽充分展現了選手的實力與對物理力量的巧妙運用。'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
