    年時被羅馬皇帝下令停辦而中斷長達1500 年，直到西元1896年才因奧運之父古柏坦基的倡議下在雅典恢復舉辦奧運。現代奧運復辦後，也曾因世界大戰而三次停辦，上屆東京奧運則因新冠病毒疫情延後至2021
    年。下屆奧運則是恢復以來的第33 屆奧運，將於明年7 月26 日到8 月11 日在巴黎舉行，屆時可預期是全球矚目的焦點。                                                                ※改寫自維基百科
