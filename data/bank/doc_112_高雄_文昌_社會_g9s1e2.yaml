  group_stem: "史料一：\"神所揀選所喜愛的子民--……從耶路撒冷及君士坦丁堡境內，我們獲得一則令人悲憤的報導，一受咒詛、與神隔絕的民族，猛烈地侵犯基督徒的領域，燒殺擄掠當地居民。他們將部份的俘虜帶回自己的國家，又以酷刑將其餘的殺害了。這些不潔淨的民眾褻瀆了祭壇，復加以搗毀。如今希臘人的王國已慘遭瓜分，又被奪去了大片的領土，被佔据的土地面積廣大，費時兩個月，仍未能穿越。\
    \ 因此，願你們彼此間的爭鬧停止，啟程遠赴聖墓，自邪惡之民手中奪回那地，使其歸屬於你們，耶路撒冷是片沃土，遠勝其他各地，它誠為一樂園。若欣然踏上征途，保証罪得赦免，並可得天國永不朽壞的榮耀。\"\
    \                                                                  1095 年教皇烏爾班的十字軍東征宣言\
    \ \n史料二：\"驚人的事，到處可見，許多回教徒被砍頭……其他的人被箭射殺，或被迫以高聳的城堡上跳下；有些人被折磨數天再焚以烈火，街上隨處是成堆的頭，手和腳，有一個人在人、馬的屍堆中騎行。……城中7\
    \ 萬回教徒盡被殺戮，殘存着的猶太人被趕入會堂中活活燒死，勝利者聚集在聖墓教堂，此洞穴他們相信一度曾埋葬釘十字架的基督，在那裏他們相擁喜極而泣，並感謝慈悲的神賜予勝利。\"\
    \                              1099 年隨十字軍佔領耶路撒冷的一位神父的報導"
