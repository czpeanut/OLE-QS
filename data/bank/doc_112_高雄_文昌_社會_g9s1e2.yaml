  group_stem: 德國社會學者馬克思．韋伯於1905 年出版《新教倫理與資本主義精神》，韋伯認為，所謂「天職」指的是新教教派中的核心倫理，「天職」描述人們不是要以苦修、超越世俗道德的禁慾主義方式來追求上帝的應許，反而應該在俗世中，完成個人在其所處職業位置上的工作責任和義務。韋伯描述的資本主義精神具有理性計算的特徵，以嚴格、小心謹慎且有遠見的計算為基礎，進以謀求經濟上的成功。這種資本主義的特徵和韋伯自己描述的傳統主義經濟特徵不同，不是僅追求餬口的農民謀生舉動，也不是如同業公會（英語：guild，行會）師傅或冒險家般，利用各種政治機會和非理性的活動來獲利。
