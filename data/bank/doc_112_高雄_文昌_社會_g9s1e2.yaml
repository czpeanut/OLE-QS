- id: doc_112_高雄_文昌_社會_g9s1e2_s1_45
  section: 1
  number: 45
  type: single
  page: 6
  stem: 請問：除了廢止禁教令，使基督教合法化之外，以下哪個事蹟也是君士坦丁所為？
  options:
  - label: A
    content: 元老院奉上奧古斯都稱號，羅馬進入帝國時期
  - label: B
    content: 在東方的拜占庭興建東都
  - label: C
    content: 將羅馬帝國一分為二，分為東、西二部
  - label: D
    content: 為保障平民權益，制定《十二銅表法》。
  group_stem: "西元三一二年十月二十八日，世上最重大的戰役之一在羅馬北方的米爾維安大橋（Milvian Bridge）爆發，戰爭導因於三世紀末開始，在東、西各設置一個皇帝與副皇帝的四帝共治制度。在戰役開始前，君士坦丁大帝做了一個使他下定決心藉上帝耶和華庇護而戰的夢，最終擊敗馬克森提烏斯(如右方壁畫)，進入羅馬成為西方的新皇帝。他將這場勝利歸給耶穌基督，並立刻宣布改信基督教，他的家族也跟著改信。次年，君士坦丁與東方皇帝李錫尼正式廢止禁教令。幾乎一夜之間，基督教的命運有了戲劇性轉變。過去主要在文盲貧窮階級流傳、受人嗤笑的宗教，突然間成了帝國統治者的信仰。過去從未正眼看過基督教的權勢男女，現在也開始另眼相待。許多人改信並受洗。\n\
    \    君士坦丁與李錫尼和平共存一段時間，兩人也都選擇兒子擔任凱撒(副皇帝)，但雙方都不是能共享權力之人。經過一些摩擦與條約協定，內戰在西元三二四年爆發。君士坦丁召集大軍，在基督羅馬旗之下出征，預備征服另一半的帝國。君士坦丁率領滿載的數百艘軍艦，從克里索波里斯北方穿越博斯普魯斯海峽，迎上好整以暇等待的李錫尼。李錫尼增加軍力，在西元三二四年九月十八日與君士坦丁軍正面交鋒。再一次，君士坦丁戴著基督標記迎向勝利。完全被擊潰的李錫尼選擇投降，同意以平民身分安享餘年。君士坦丁重新統一羅馬帝國，自此成為帝國唯一的統治者。\n\
    \                    改寫自關鍵評論網〈君士坦丁才是翻轉世界的異類〉https://www.thenewslens.com/article/98242"
