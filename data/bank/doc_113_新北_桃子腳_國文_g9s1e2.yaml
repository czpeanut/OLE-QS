- id: doc_113_新北_桃子腳_國文_g9s1e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: '下列摘句皆出自生於憂患，死於安樂，若各搭配一句道理相近的名言佳句，何者搭配最不恰當？

    | 選項 | 摘句 | 名言佳句 |

    | :--- | :--- | :--- |

    | (A) | 膠鬲舉於魚鹽之中，管夷吾舉於士，孫叔敖舉於海，百里奚舉於市 | 將相本無種，男兒當自強 |

