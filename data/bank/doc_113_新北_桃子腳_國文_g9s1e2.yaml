- id: doc_113_新北_桃子腳_國文_g9s1e2_s3_34
  section: 3
  number: 34
  type: single
  page: 4
  stem: 有關巴黎歌劇院的建築設計，不可用哪個成語形容？
  options:
  - label: A
    content: 雕欄畫棟
  - label: B
    content: 獨樹一幟
  - label: C
    content: 玉樓金闕
  - label: D
    content: 天造地設。
  group_stem: '巴黎歌劇院是巴黎最具代表性的建築之一，劇院有著全世界最大的舞台，其富麗堂皇的休息大廳堪與凡爾賽宮大鏡廊相媲美，裡面裝潢豪華，四壁和廊柱布滿巴洛克式的雕塑、掛燈、繪畫，藝術氛圍十分濃郁。巴黎歌劇院大概是全世界最有神秘色彩的歌劇院之一，總覺得在入夜以後，會有什麼不為人知的故事在水晶吊燈和階梯上展開。如果光是參觀無法滿足你的好奇心，那就一起到歌劇院裡玩「密室逃脫」。


    1875 年完工，由拿破崙三世下令建造，外觀宏偉壯觀，擁有精緻的裝飾和雕刻；內部則以華麗的紅色天鵝絨、金色裝飾以及巨型吊燈而著名，特別是位於中央的大劇場，它擁有世界著名的天篷和大型舞台。而巴黎歌劇院因作為The
    Phantom of the Opera（歌劇魅影）的故事場景，增添了許多神秘感，讓這座建築充滿陰暗和奇異的氛圍，特別是歌劇院的地下區域，讓世界各地遊客深深著迷。


    不過，有沒有可能，歌劇魅影真的還住在地下通道？想更深入探索巴黎歌劇院，除了買票參觀、聽導覽，還有一個內行人才知道的隱藏行程：密室逃脫。玩家將扮演名偵探Arsène
    Lupin（亞森羅蘋），獲准進入歌劇院深處，像是著名的大廳、大樓梯，甚至是一些平時不對外開放的空間，尤其那些雕像、畫作和裝飾品裡可能都藏有各種線索，解開關於Count
    of Cagliostro（卡廖斯特羅伯爵）的謎團。


    密室逃脫必須提前預訂，遊戲時間共1.5 個小時，有法語和英語兩種語言可選擇，不過最好是懂法文才能玩得更盡興，屆時玩家將獲得一本含有小提示的「路徑圖」。本實境解謎適合10
    歲以上的玩家參與，可以根據自己的步伐搜索直到破案，邊推理邊以不同角度欣賞巴黎歌劇院，是非常推薦參與的行程。

    ──節選自網路文章除了參觀，原來巴黎歌劇院可以玩「密室逃脫」！'
