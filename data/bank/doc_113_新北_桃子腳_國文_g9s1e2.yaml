  group_stem: '人目不見青黃曰「盲」，耳不聞宮商曰「聾」，鼻不知香臭曰「癰①」。癰、聾與盲，不成人者也。人不博覽者，不聞古今，不見事類②，不知然否，猶目盲、耳聾、鼻癰者也。儒生不覽，猶為閉暗③，況庸人④無篇章之業，不知是非，其為閉暗，甚矣！此則土木之人，耳目俱足，無聞見也。涉淺水者見蝦，其頗深者察魚鱉，其尤甚者觀蛟龍。

