  group_stem: '【甲】

    嶺南人認為檳榔可以解瘴癘之氣，蘇東坡入境隨俗，大嚼大噉，至汗出且面紅如醉，還特地寫詩歌詠檳榔：「能消瘴癘暖如薰」。南宋羅大經鶴林玉露中說自己初至嶺南，對檳榔敬謝不敏；過了一段時間，才敢稍微嘗試；住了一年多後，卻「不可一日無此君矣」。南宋周去非嶺外代答則寫道：「有嘲廣人曰：『路上行人口似羊。』言以蔞葉雜咀，終日噍飼也，曲盡噉檳榔之狀矣。每逢人，則黑齒朱唇；數人聚會，則朱殷遍地，實可厭惡。」言詞中極盡輕蔑。

    ──改寫自黃楷元陪蘇東坡一起吃檳榔


    【乙】

    李時珍本草綱目說：「嶺南人以檳榔代茶禦瘴，其功有四：一曰醒能使之醉，蓋食之久，則醺然頰赤，若飲酒然，蘇東坡所謂『經潮登頰醉檳榔』也。二曰醉能使之醒，蓋酒後嚼之，則寬氣下痰，即朱晦庵所謂『檳榔收得為祛痰』也。三曰飢能使之飽。四曰飽能使之飢。蓋空腹食之，則充然氣盛如飽；飽後食之，則飲食快然易消。」

    檳榔果實含多酚類化合物，會影響大腦、交感神經及副交感神經作用，提高警覺度，刺激腎上腺素分泌。世界衛生組織證實：檳榔素、檳榔鹼具潛在致癌性，檳榔所添加的石灰則會破壞口腔黏膜的表皮細胞，導致細胞增生變異。嚼食經驗令我覺得檳榔很容易成癮，戒除甚難，但不知它的成癮機轉。它迷惑人，卻極具危險，像不正常的親密關係，像禁忌的遊戲，嚼多了會有墮落感、罪惡感。可它又那麼清香，那麼容易上癮。

    ──改寫自焦桐禁忌的親密關係'
