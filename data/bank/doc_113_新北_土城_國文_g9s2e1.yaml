- id: doc_113_新北_土城_國文_g9s2e1_s1_33
  section: 1
  number: 33
  type: single
  page: 4
  stem: 根據本文的描述，以下何選項不符合文章所寫的情況？
  options:
  - label: A
    content: 恃才傲物
  - label: B
    content: 玩物喪志
  - label: C
    content: 愛鶴失眾
  - label: D
    content: 因小失大。
  group_stem: "你有沒有這樣的經驗：明明隔天早上八點就要期末考，該念的書從床頭堆到床尾，卻永遠提不起勁對，心裡想著打完這場 LOL 就馬上奮發圖強，最後卻是一場接一場，一不小心天就亮了，下回考試前，還是一樣無法自拔。\n\
    \    從精神醫學的角度來看，上癮的核心概念跟心理層面的失控有關，從生物層面解釋的話，就是「快樂系統（酬賞系統）reward system 過度被活化。」(陽明大學腦科學研究所博士林煜軒)大腦對正向經驗會產生記憶學習效果，當遊戲世界的擬真、聲光效果出時，神經內分泌系統透過多巴胺（dopamine）的分泌，強化玩遊戲與正向情緒經驗之間的連結，讓玩家在想到遊戲時只回憶起遊戲中的快樂情緒。如果一個人在現實中經常受到挫折，卻能在遊戲裡找到滿足與快樂，要學會對遊戲自我克制，恐怕很難。\n\
    \    類似的說法也出現在傳播學域，國內少數以電玩為研究主題的政大傳播學院副教授林日璇，自己也是個重度玩家，她認為電玩會讓人上癮，有個重要原因是「即時回饋」：「當你意識到投入是有回饋的，就會很\
    \ enjoy 這個過程。」相較於現實生活，念書工作可能要花一年半載、每天廢寢忘食努力，才可能有結果，但玩遊戲十分鐘就可以得到報酬，不僅讓人難以抗拒、更容易深陷其中而無法自拔。\n\
    \    林日璇也舉出娛樂媒介中知名的「自我決定論」（Self-determination theory, SDT），來解釋玩家沉迷原因。「自我決定論」認為人類與生俱來有三種需求：自主（Autonomy）、勝任（Competence）、歸屬（Relatedness）。\
    \ 大部分人都是因為在心理、社會層面沒辦法獲得滿足，才會轉而從網路世界中找尋滿足。「所以補救措施絕對不是斷網或限制上網，而是要想辦法從現實生活中的心理、社會層面提供玩家需要的滿足。」\
    \    彭婉馨〈真的再打一場就好……嗎？電玩怎麼讓你失控上癮〉"
