  stem: 下列有關元曲常識的敘述，何者有誤？
  options:
  - label: A
    content: 散曲正如元代的新詩，用字遣詞不避俚俗，且可在曲牌規定字數之外添加「襯字」。
  - label: B
    content: 元曲又稱「詞餘」，而馬致遠、白樸、關漢卿、鄭光祖被並稱為「元曲四大家」。
  - label: C
    content: 雜劇正如元代的歌劇，如馬致遠的漢宮秋，即以舞台搬演漢元帝與王昭君的愛情故事。
  - label: D
    content: 散曲中的「小令」由同一宮調的若干「散套」為一組，只有「曲」而無「科」、「白」。
