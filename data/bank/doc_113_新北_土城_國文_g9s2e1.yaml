  group_stem: '寶應中，有元無有，獨行維揚郊野。值日晚，風雨大至。時兵荒後，人戶多逃，遂入路旁空莊。須臾霽〔1〕止，斜月方出。未幾，見月中有四人，衣冠皆異，相與談諧，吟詠甚暢。乃云：「今夕如秋，風月若此，吾輩豈不為一言，以展平生之事也。」其一人即曰云云。吟詠既朗，無有聽之具悉。其一衣冠長人即先吟曰：「齊紈魯縞〔2〕如霜雪，寥亮高聲予發。」其二黑衣冠短陋人詩曰：「嘉賓良會清夜時，煌煌燈燭我能持。」其三故弊黃衣冠人亦短陋，詩曰：「清冷之泉候朝汲〔3〕，桑綆〔4〕相牽常出入。」其四故黑衣冠人詩曰：「爨薪〔5〕貯泉相煎熬，充他口腹我為勞。」四人遲明方歸舊所，無有就尋之，堂中惟有□□、□□、□□、□□。乃知四人，即此物所為也。（太平廣記
    元無有）

    【注釋】1 霽：雨後轉晴。2 齊紈魯縞：指質地細緻的絲織品。3 汲：自井中取水。4 綆：音ㄍㄥˇ，汲水所用的繩子。5 爨薪：點火所用的柴草。爨，音ㄘㄨㄢˋ'
