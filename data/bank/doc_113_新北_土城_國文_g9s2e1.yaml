  stem: '當然，不只小說家會說謊。眾所周知，政治人物也會說謊。外交官、將軍、二手車業務員、屠夫和建築師亦不例外。 ____________。相反地，小說家愈努力說謊，把謊言說得愈大愈好，大眾和評論家反而愈讚賞他。為什麼？我的答案是：藉由高超的謊言，也就是創作出幾可亂真的小說情節，小說家才能將真相帶到新的地方，也才能賦予它新的光輝。在大多數的情況下，我們幾乎無法掌握真相，也無法精準的描繪真相。因此，必須把真相從藏匿處挖掘出來，轉化到另一個虛構的時空，用虛構的形式來表達。


