  stem: 依據本文的脈絡及意涵，下列敘述何者正確？
  options:
  - label: A
    content: 以暗引經典的詩句起筆，印證主角當時心境哀戚。
  - label: B
    content: 由星月無光的景象描述，轉折至內心情感的抒發。
  - label: C
    content: 憂國憂民又陷入簞瓢屢空的困境，不禁老淚縱橫。
  - label: D
    content: 因時局動盪不安，官員竟尸位素餐而流下男兒淚。
  group_stem: '老殘對著雪月交輝的景致，想起謝靈運的詩「明月照積雪，北風勁且哀。」兩句。若非經歷北方苦寒景象，那裡知道「北風勁且哀」的個「哀」字下的好呢？這時月光照的滿地的亮，抬起頭來，天上的星一個也看不見，只有北邊，北斗七星開陽、搖光，像幾個淡白點子一樣，還看得清楚。那北斗正斜倚在紫微垣的西邊上面，杓在上，魁在下。心裡想道：「歲月如流，眼見斗杓又將東指了，人又要添一歲了。一年一年的這樣瞎混下去，如何是個了局呢？」又想到《詩經》上說的「維北有斗，不可以挹酒漿。」──「現在國家正當多事之秋，那王公大臣只是恐怕擔處分，多一事不如少一事，弄的百事俱廢，將來又是怎樣個了局，國是如此，丈夫何以家為！」想到此地，不覺滴下淚來，也就無心觀玩景致，慢慢回店去了。一面走著，覺得臉上有樣物件附著似的，用手一摸，原來兩邊著了兩條滴滑的冰。初起不懂什麼緣故，既而想起，自己也就笑了。原來就是方才流的淚，天寒，立刻就凍住了，地下必定還有幾多冰珠子呢。悶悶的回到店裡，也就睡了。」

    （劉鶚《老殘遊記》）'
