  page: 3
  stem: 歐巴老師籌組讀書會，第一次聚會以中國的「章回小說」為研討題綱，請問何者顯然沒有做好事先的準備？
  options:
  - label: A
    content: 敏鎬：劉義慶傾其畢生心力所撰寫的《世說新語》，可定義為章回小說的濫觴，也是志人類筆記小說的代表作。
  - label: B
    content: 寶劍：宋代話本即說書人劇本，分章分回，可說是章回小說的前身。許多章回歷史小說，即以此為基礎發展。
  - label: C
    content: 秀賢：每章每回可見有提舉要旨的回目，歸納情節梗概，回目多由雙句組成，對仗工整，辭藻精鍊。
  - label: D
    content: 鍾碩：每回開頭常用「話說」、「卻說」引出正文；結尾慣用「欲知後事如何，且聽下回分解」等字眼。
  tags:
    textbook: 第五冊（九上）第2次段考範圍
    labeled_by: ai
