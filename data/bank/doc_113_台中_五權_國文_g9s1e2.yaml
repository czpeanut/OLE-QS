    labeled_by: ai
- id: doc_113_台中_五權_國文_g9s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 目標臺中三中的祟端焚膏繼晷將〈與宋元思書〉讀個通透，請問有關於他的文意理解，何者正確？
  options:
  - label: A
    content: 「水皆縹碧，千丈見底」：以誇飾的筆法，極寫水之清、水之深，刻畫水至清則無魚的意境，屬靜態寫景。
  - label: B
    content: 「急湍甚箭，猛浪若奔」：以俯視的角度寫水之急，並以飛箭、奔馬比擬，活靈活現地呈現水流動態的美感。
  - label: C
    content: 「負勢競上，互相軒邈」：化動態為靜態，將山擬人，以高聳的山勢烘托群樹的生長，呈現林峰相疊的雄偉氣象。
  - label: D
    content: 「橫柯上蔽，在晝猶昏」：插敘當日艷陽高照、濃蔭蔽天的景象。與「風煙俱淨，天山共色」前後呼應。
  lesson_raw:
    title: 與宋元思書
    basis: 題幹提及〈與宋元思書〉文意理解
  tags:
    textbook: 第五冊 與宋元思書
    labeled_by: ai
