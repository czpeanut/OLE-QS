  number: 1
  type: single
  page: 1
  stem: 在國文課偷畫畫、傳紙條的祟端被罰抄寫〈與宋元思書〉的課文注釋，卻錯誤百出，請問只有何者音義皆正確？
  options:
  - label: A
    content: 「泠」泠作響：音「ㄌㄥˇ」，流水聲。
  - label: B
    content: 水皆「縹」碧：音「ㄆ一ㄠˋ」，墨綠色。
  - label: C
    content: 橫「柯」上蔽：音「ㄎㄜ」，樹枝。
  - label: D
    content: 千「轉」不窮：音「ㄓㄨㄢˋ」，鳥叫。
  lesson_raw:
    title: 與宋元思書
    basis: 題幹提及〈與宋元思書〉課文注釋
  tags:
