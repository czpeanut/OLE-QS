  - label: A
    content: 砂鍋：花若盛開，蝴蝶自來；人若精彩，天自安排。吸引是一種等待，追求是一種挑戰。世界不為誰存在，也可以為自己存在，期待總是最美。
  - label: B
    content: 黑鍋：二十年後，你會對自己沒有做的事感到失望，而不是對自己做了的事感到後悔。所以，扔掉船纜，駛離安全的港灣，迎著信風揚帆起航，勇往直前。
  - label: C
    content: 飯鍋：寧可有光明的失敗，絕不要有不榮譽的成功。平生所為，但求無不可對人言者耳。心體光明，暗室中有青天；念頭暗昧，白日下有厲鬼。
  - label: D
    content: 火鍋：心安茅屋穩，性定菜根香。一飽之需，何必八珍九鼎？七尺之軀，安用千門萬戶？用功於內者，必於外無所求；飾美於外者，必其中無所有。
