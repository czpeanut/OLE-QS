  number: 6
  type: single
  page: 1
  stem: 國寶級大師韶哥任意揮灑了「隨意春芳歇，王孫自可留。」這幾個大字給美術班的學生於書法課臨摹，並要大家從課文中找到與作者心境相近的句子，請問誰可以得分？
  options:
  - label: A
    content: 梅：風煙俱淨，天山共色，從流飄蕩，任意東西
  - label: B
    content: 蘭：鳶飛戾天者，望峰息心；經綸世務者，窺谷忘返
  - label: C
    content: 竹：泉水激石，泠泠作響；好鳥相鳴，嚶嚶成韻
  - label: D
    content: 菊：游魚細石，直視無礙。急湍甚箭，猛浪若奔
  lesson_raw:
    title: 與宋元思書
    basis: 選項引用〈與宋元思書〉課文句子
  tags:
