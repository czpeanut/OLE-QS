- id: doc_113_台中_五權_國文_g9s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 咪其林於黑金大廚的比賽鏖戰群雄後，慘遭滑鐵盧，校長於升旗典禮勉勵大家效法其奮戰精神。請問下列四位同學的生活日記，何者用字遣詞及文意邏輯均正確無誤？
  options:
  - label: A
    content: 白毛：所謂打斷手骨顛倒勇，這一次的掄揆根本算不上什麼，只要秉持屢戰屢敗的精神，下次比賽捲土重來，一定可以泥菩薩過江，勢如破竹。
  - label: B
    content: 加羊：上場時選手們劍拔弩張、針鋒相對是必然的。比賽結束，大家彼此鼓舞，惺惺相惜的情誼才是難能可貴。一枝草一點露，敗者毋須妄自菲薄。
  - label: C
    content: 餅大：路遙知馬力，小時候胖不是胖，在取得優勢之際，切莫吊以輕心，以免大意失荊州。能拔得頭籌絕非泛泛之輩，要效法其困獸猶鬥之精神。
  - label: D
    content: 易蹲：即便是初生之犢不畏虎的老將，面對比賽，臨場的抗壓性仍是不共戴天的考驗。一但心有旁鶩，很可能所有的努力與鍛鍊都付諸東流了。
  tags:
    textbook: 第五冊（九上）第2次段考範圍
    labeled_by: ai
- id: doc_113_台中_五權_國文_g9s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 參加畢業旅行的樂樂在遊覽車上睡得迷迷糊糊，一下車眼前名勝正門的聯語即為「英雄三國無雙士，正氣千秋第一人。」入廟後，在正殿最有可能再看到哪一副楹聯？
  options:
  - label: A
    content: 舉念有神知善惡正邪能立判；照人如明鏡吉凶禍福總無私。
  - label: B
    content: 一色水天秋卻難洗三字污穢；雙清風月夜正好分兩世精忠。
  - label: C
    content: 青燈觀青史著眼在春秋二字；赤面表赤心滿腔存漢鼎三分。
  - label: D
    content: 註定榮華註定賢能皆因善果；生成富貴生成忠孝好答慈恩。
  tags:
    textbook: 第五冊（九上）第2次段考範圍
    labeled_by: ai
- id: doc_113_台中_五權_國文_g9s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 承上題，樂樂的參觀心得，哪一句不會被老師指正？
  options:
  - label: A
    content: 同學們井然有序地魚貫進入廟內參拜，就像黃鼠狼給雞拜年般虔誠，祈求明年會考能夠逢凶化吉。
  - label: B
    content: 導覽志工述說了許多歷史故事與稗官野史，但是，對於沒有文化素養的我而言，可真是鴨子聽雷呀！
  - label: C
    content: 廟宇中美輪美奐的雕樑畫棟，賞來更是曹操吃雞肋，我們一定要致力於古蹟的維護，才能代代相承。
  - label: D
    content: 廟口的榕樹下，聚集了好多當地的耆老伯伯們，個個義憤填膺地針砭時政，儼然閻王出告示般慷慨激昂。
