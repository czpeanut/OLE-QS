  stem: 依據文義，以下何者「主語」的解讀是正確的？
  options:
  - label: A
    content: 「忽呼媒納妾，價欲至廉，貌欲至美。」：媒人
  - label: B
    content: 「攜一女來，不索價，但取衣食充足而已。」：富翁
  - label: C
    content: 「翁大喜過望，女又甚美，頗嬖之。」：小妾
  - label: D
    content: 「嗣後且防之，慮其花費。如是者半年。」：富翁
  group_stem: '濟南富翁某，性慳吝，綽號「鐵公雞」，言一毛不拔也。忽呼媒納妾，價欲至廉，貌欲至美，媒笑而允之。未幾，攜一女來，不索價，但取衣食充足而已。翁大喜過望，女又甚美，頗嬖之。一日，女置酒勸翁曰：「君年已老，需此多錢無用，何不散之貧人，使感德耶？」翁大怒拒之，嗣後且防之，慮其花費。如是者半年，啟其所藏，已空矣。翁知女所竊，拔刀問之，女笑曰：「君以為我為人乎？我狐也。君家從前有後樓七間，是我一家所居，君之祖父每月以雞酒相餉，已數十年。自君掌家，以多費故罷之，轉租取急，俾我一家無住宿處。懷恨在心，故來相報耳。」言訖不見。


    嬖：音ㄅㄧˋ，寵愛。            (袁枚《子不語》)'
