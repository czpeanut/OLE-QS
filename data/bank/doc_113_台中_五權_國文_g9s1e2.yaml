- id: doc_113_台中_五權_國文_g9s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '國文課心不在焉的王奇，一邊夢周公一邊抄筆記，內容如下所列，請問何者是有關於「駢文」的描述？

    (甲)句式勻稱整齊，講究平仄、對仗，多用典故、詞藻華麗，風格大多含蓄婉轉、典雅精鍊，又稱「四六文」。

    (乙)由民間歌謠或文人的詩作加以配樂，內容以敘事寫實為主，大多反映當時的現實生活或思想，情感質樸直接。

    (丙)多為文人作品，以抒情為主，多抒發個人感受、離別愁緒、人生無常等情志，情感表現溫雅，不能合樂歌唱。

    (丁)講究韻律，但不要求押韻，故不屬於韻文。文意常受限於追求用字遣詞的藝術技巧，容易流於只重形式之美。'
  options:
  - label: A
    content: 甲
  - label: B
    content: 甲乙
  - label: C
    content: 甲丙
  - label: D
    content: 甲丁
  tags:
    textbook: 第五冊（九上）第2次段考範圍
    labeled_by: ai
- id: doc_113_台中_五權_國文_g9s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 上課遲到的王奇，錯過國文老師講解的〈與宋元思書〉，請問其自己整理的重點中，唯有哪一項正確？
  options:
  - label: A
    content: 作者是南朝 宋出身寒門的吳均，字朝請，著有《吳朝請集》。另有著作《搜神記》，為志怪類的筆記小說。
  - label: B
    content: 文章形式上屬於應用文。內容則因景興感、借景抒懷，描述作者從富陽到桐廬，於舟中所見富春江的山光水色。
  - label: C
    content: 以「奇山異水，天下獨絕。」為全文綱領，採第三人稱的角度客觀描述沿途所見所聞，並善用典故、詞藻唯美。
  - label: D
    content: 全文採「先分述，後歸納」的筆法，從蟬鳴鳥叫、水聲猿啼的摹寫，再帶入山水奇景的視覺感受，層次分明。
  lesson_raw:
    title: 與宋元思書
    basis: 題幹提及〈與宋元思書〉
  tags:
    textbook: 第五冊 與宋元思書
    labeled_by: ai
- id: doc_113_台中_五權_國文_g9s1e2_s1_6
