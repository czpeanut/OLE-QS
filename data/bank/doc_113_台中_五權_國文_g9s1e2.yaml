- id: doc_113_台中_五權_國文_g9s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 咪其林報名參加黑金大廚的節目錄影，在與製作人討論食材及作品的過程中，何者「」內的用字，讀音完全正確？
  options:
  - label: A
    content: 主菜以淡水的阿給為發想，內餡包入豆「豉」(ㄍㄨˇ)干貝，鮮美的湯汁，必使賓客杯盤狼「藉」(ㄐㄧㄝˋ)。
  - label: B
    content: 湯品要以當令的西瓜與荷花熬煮豚骨，佐以小羔羊肉「臊」(ㄗㄠˋ)，濃郁的口感必能睥「睨」(ㄋ一ˊ)群雄。
  - label: C
    content: 飲品一定要調配最適合「觥」(ㄍㄨㄥ)籌交錯的向日葵梅果凍飲了，絕對能收服評審刁鑽的味「蕾」(ㄌㄟˇ)。
  - label: D
    content: 畫龍點睛的甜點，就以「咖」(ㄍㄚ)哩芒果千層慕斯作結，讓觀眾也沉浸於甜蜜蜜的幸福「氛」(ㄈㄣˋ)圍中。
  tags:
    textbook: 第五冊（九上）第2次段考範圍
    labeled_by: ai
- id: doc_113_台中_五權_國文_g9s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 承上題四個選項的討論，為加強對於當季食材的靈感，咪其林拜讀許多篇散文，請問何者較契合當時的季節？
  options:
  - label: A
    content: 滿天是厚重灰黃的濁雲。東北風在曠野恣意肆虐，握著銳利的刀劍，刺穿嚴嚴實實的皮襖，那暴露在外面的臉皮，被它劃了一刀又一刀，疼痛難熬。樹梢的葉，也在突然襲來的寒潮中，禁不住朔氣，翩然飄落。
  - label: B
    content: 先是料料峭峭，繼而雨季開始，時而淋淋漓漓，時而淅淅瀝瀝，天潮潮地溼溼，彷彿在夢裡，也需要把傘撐著。驚蟄一過，寒氣便加劇了，即便寒食已至，仍躲不過一陣陣瀟瀟的冷雨，才知眼眶中的相思也都是潮潤潤的。
  - label: C
    content: 最適合蹲踞的，是桂花樹盛開的堤岸，夥在老人堆裡，逗弄晒暖了的貓咪、行色匆匆的狗兒，在一寸寸老去的斜陽裡，可以提前品味一下垂老的光景。從堤岸繼續往前走，是拍攝婚紗照的新人最常出沒處，景觀之佳由此可見。
  - label: D
    content: 今年的鳳凰花開得特別盛，整個大度山像火燒一樣。那俗豔大膽的紅與綠，不含蓄、不收斂，是準備著在這一季用最狂烈的方式，把生命燃燒消耗殆盡。我站在那紅如血的花前，看血點飄灑飛揚，不禁要驚叫起來。
  group_stem: （第 9 題）咪其林報名參加黑金大廚的節目錄影，在與製作人討論食材及作品的過程中，何者「」內的用字，讀音完全正確？
