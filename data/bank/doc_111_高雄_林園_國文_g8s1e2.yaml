  options:
  - label: A
    content: 圖書館內眾多藏書唾手可得，此刻與書的距離很近；圖書館的巧思設計，攬綠意入館，使作者陶醉其間，忘了書籍。
  - label: B
    content: 在圖書館翻閱風景攝影集，可以神遊遠方，忘卻現實煩憂
  - label: C
    content: 圖書館的寧靜氛圍讓人能專心閱讀，拉近人與書的距離
  - label: D
    content: 美麗的造景易讓人流連忘返，讀者忘了書的存在，人與書的距離被拉遠了，因而圖書館的設計布置以樸質無華為佳。
  answer:
  - A
