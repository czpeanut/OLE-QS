- id: doc_111_高雄_林園_國文_g8s1e2_s3_5
  section: 3
  number: 5
  type: single
  page: 1
  stem: 「此時它是無敵的大主宰，任何人都不能不懾服。牛群在原野上狂奔，羊群在哀哀慘叫，樹木在盡力縮矮，哪個敢把手舉得最高，頭伸得最長，定立時被劈殺」從作者這段對西北雨前奏的補敘中，下列何者是最合理的解讀?
  options:
  - label: A
    content: 神威顯現，大自然是有神力的，人類應該虔誠服侍。
  - label: B
    content: 生命是很脆弱的，隨時都可能被大自然奪走
  - label: C
    content: 大自然的力量是如此的強大，相形之下，萬物顯得渺小且無力
  - label: D
    content: 萬物帄等，人類、牛群、羊群、樹木都是大自然中的一環
  lesson_raw:
    title: 西北雨
    basis: 引用陳冠學〈西北雨〉課文
  answer:
  - C
  answer_source: answer_key_vlm
  tags:
    textbook: 八上 第一課 田園之秋選
    labeled_by: ai
