  stem: 「在一個高度異質性且充滿認同焦慮的社會，表態文化尌變得更加必要，而每一次的表態又疏離了更多的人——他們傾向於不聽、不看，拒絕相信或眼不見為淨。更多的人則也開始鎖定立場、意見更接近的媒體和訊息，或可以認同的聚落，形成了一個又一個彼此不了解，也不交流的族群，這尌是我說的『部落化』。」（羅智成〈尋找部落〉）根據本文，作者所謂的「部落化」與下列何者最接近？
  options:
  - label: A
    content: 個人可以自由的表達意見，社會上各項資訊蕪雜。
  - label: B
    content: 社群媒體可以展露個人訊息，更容易理解他人。
  - label: C
    content: 人們因認同焦慮，選擇接受與自己意見相近的族群而排斥異己。
  - label: D
    content: 社會有著高度異質性，人們會像傳統部落文化般團結。
  answer:
  - C
