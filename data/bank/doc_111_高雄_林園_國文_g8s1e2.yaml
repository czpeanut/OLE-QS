- id: doc_111_高雄_林園_國文_g8s1e2_s3_1
  section: 3
  number: 1
  type: single
  page: 1
  stem: 請選出下列成語運用，哪個選項是錯誤的?
  options:
  - label: A
    content: 隊友比賽成績破大會紀錄，消息傳來，宛如「晴天霹靂」，大家高興得相互擁抱。
  - label: B
    content: 那家飯店的董事長每年都對外宣稱會改善員工的待遇與福利，然而卻總是「雷大雨小」，空口說白話。
  - label: C
    content: 貝多芬的《命運交響曲》「氣勢磅礴」，令聽眾肅然起敬。
  - label: D
    content: 今年夏天，登革熱如「疾風迅雷」般的蔓延開來，疫情相當嚴峻。
  answer:
  - A
  answer_source: answer_key_vlm
  tags:
    textbook: 第三冊（八上）第2次段考範圍
