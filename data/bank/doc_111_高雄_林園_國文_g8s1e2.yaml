- id: doc_111_高雄_林園_國文_g8s1e2_s3_6
  section: 3
  number: 6
  type: single
  page: 1
  stem: 「夏天像一個年輕人，灼熱的陽光是他燦爛的笑容，迸發的熱量是他蓬勃的氣息，蔥蘢的草木是他厚密的頭髮，水漲潮急山洪是他的力量，倏來忽去的驟雨是他的脾氣。」這段文字主要在描寫什麼？
  options:
  - label: A
    content: 一般年輕人對夏天的觀感。
  - label: B
    content: 年輕人喜愛夏天的原因。
  - label: C
    content: 用譬喻的方式，表達夏天這個季節鮮活、壯盛的特色。
  - label: D
    content: 夏天常見的各種自然災害及其成因。
  answer:
  - C
