  group_stem: "讓我們以心和眼去與生活真正相遇，成為於無字句處讀書、於無山水處看風景的「全方位閱讀者」！\n    而即使是一缸餿水、滿街濁塵、都市邊緣的垃圾山、地下道行乞者的卑微身姿……，我們豈不也都可在其中讀出許多其他的意義？\n\
    \    讀出人間殘破、世界傷痛的訊息？\n    讀出悲憫、讀出責任、讀出反省、讀出危機意識，也讀出一些特殊的心得來？\n   「書」的定義真的不該那麼狹隘，不該只局限於文字之書、白紙黑字的作品。\n\
    \    未曾定義、無法定義的，是天地、歲月、人間、世界這本真正的「無字天書」。\n    因此，當我們閱讀，請不要忘了抬起頭來，走入生活，也去讀一讀世界這本大書。\n\
