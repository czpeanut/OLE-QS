- id: doc_111_高雄_林園_國文_g8s1e2_s4_8
  section: 4
  number: 8
  type: single
  page: 6
  stem: 凌性傑：「不知道從什麼時候開始，我們的學生一直被教導、鼓勵在考試作文中矯情。在大大小小的考試作文中，好多人都會設計催淚情節，試圖打動評閱者。所以不是讓祖父母死掉，尌是讓寵物死掉。只不過這些伎倆往往無法躲過法眼，每每在細節中顯露出作假的痕跡。一個對世界沒有感覺的人，想要說服他人對世界有感覺，這是不可能的事。無法掌握人之常情，尌無法用人之常情彼此溝通。」根據這段文字，學生在作文中設計催淚情節時，為何常會顯露出作假的痕跡？
  options:
  - label: A
    content: 缺乏真實情感，細節往往不真實。
  - label: B
    content: 情節前後矛盾，沒有合理的過程。
  - label: C
    content: 敘事技巧不佳，導致無法理解。
  - label: D
    content: 文句沒有新意，總是陳腔濫調，流於俗套。
  answer:
  - A
  answer_source: answer_key_vlm
