  stem: 關於〈五柳先生傳〉的字義理解，下列何者最為正確?
  options:
  - label: A
    content: 「好讀書，不求甚解，每有會意，便欣然忘食」：喜歡讀書，但不是很想了解書中含意，只要懂了一些尌會高興到忘了吃飯
  - label: B
    content: 「造飲輒盡，期在必醉，既醉而退，曾不吝情去留」：到了朋友家尌開始喝酒，希望能喝醉，喝醉了尌告辭回家，從來不會賴著不走。
  - label: C
    content: 「環堵蕭然，不蔽風日，短褐穿結，簞瓢屢空──晏如也。」：住的房子空無一物，簡陋到不能遮風蔽日，穿粗布破衣，碗瓢常常是空的，沒食物吃──但常常有朋友宴請吃飯。
  - label: D
    content: 「黔婁之妻有言：『不戚戚於貧賤，不汲汲於富貴。』極其言，茲若人之儔乎？」：黔婁的太太曾經說，對於貧賤不感到憂慮，對於富貴不努力求取。想想她的話，黔婁的太太和五柳先生是同一類人嗎?
  lesson_raw:
    title: 五柳先生傳
    basis: 題目考查〈五柳先生傳〉字義理解
  answer:
  - B
