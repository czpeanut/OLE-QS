- id: doc_111_高雄_林園_國文_g8s1e2_s3_3
  section: 3
  number: 3
  type: single
  page: 1
  stem: '請依序排列上面內容中，西北雨從開始到結束的過程。

    甲：大雨滂沱    乙：雨過天青     丙： 霹靂壓頂，閃電纏身    丁：滿天烏雲。'
  options:
  - label: A
    content: 丁丙甲乙
  - label: B
    content: 丙丁甲乙
  - label: C
    content: 丁乙甲丙
  - label: D
    content: 丙甲乙丁
  group_stem: '霎時間，天昏地暗，抬頭一看，黑壓壓的，滿天烏雲，盤旋著，自上而下，直要捲到地面。這種情況，在荒野中遇到幾回。只覺滿天無數黑怪，張牙舞爪，盡向地面攫來。……..接著便是閃電纏身，霹靂壓頂好在再接著便是大雨滂沱，再看不見滿天張牙舞爪的黑怪，而閃電與霹靂仍肆虐不已，卻多少為雨勢所遮掩，於是匍匐在地的失魂者，便在雨水的不斷澆淋下，漸漸地蘇醒，而閃光與雷聲也愈來愈遠，轉眼雨過天青，太陽又探出了雲端，樹葉上、草上閃爍著無邊亮晶晶的水珠。

    ……

    終於雷聲愈來愈遠，電光只在遙遙的天邊橫掃。太陽又出來了，一片清新的空氣、鮮潔的色彩，彷彿聽見了貝多芬《田園交響曲》第四樂章〈牧羊人之歌〉。'
  lesson_raw:
    title: 西北雨
    basis: 引用陳冠學〈西北雨〉課文
  answer:
  - A
  answer_source: answer_key_vlm
  tags:
    textbook: 八上 第一課 田園之秋選
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
      code: 第一課
      title: 田園之秋選
      chapter: null
- id: doc_111_高雄_林園_國文_g8s1e2_s3_4
  section: 3
  number: 4
  type: single
  page: 1
  stem: 文末，作者提及貝多芬《田園交響曲》第四樂章〈牧羊人之歌〉的原因：
  options:
  - label: A
    content: 透過宏偉的交響曲，強調西北雨的閃電、霹靂、大雨的戲劇化過程
  - label: B
    content: 用樂曲表達視覺經驗，西北雨過後景象，正如〈牧羊人之歌〉呈現的帄靜祥和、清新舒緩。
  - label: C
    content: 希望以動聽的音樂，來呈現在鄉居生活中感受到的悠閒情致。
  - label: D
    content: 藉由樂章名稱，接露自己是牧羊人的身分。
  group_stem: '霎時間，天昏地暗，抬頭一看，黑壓壓的，滿天烏雲，盤旋著，自上而下，直要捲到地面。這種情況，在荒野中遇到幾回。只覺滿天無數黑怪，張牙舞爪，盡向地面攫來。……..接著便是閃電纏身，霹靂壓頂好在再接著便是大雨滂沱，再看不見滿天張牙舞爪的黑怪，而閃電與霹靂仍肆虐不已，卻多少為雨勢所遮掩，於是匍匐在地的失魂者，便在雨水的不斷澆淋下，漸漸地蘇醒，而閃光與雷聲也愈來愈遠，轉眼雨過天青，太陽又探出了雲端，樹葉上、草上閃爍著無邊亮晶晶的水珠。

    ……

    終於雷聲愈來愈遠，電光只在遙遙的天邊橫掃。太陽又出來了，一片清新的空氣、鮮潔的色彩，彷彿聽見了貝多芬《田園交響曲》第四樂章〈牧羊人之歌〉。'
  lesson_raw:
    title: 西北雨
    basis: 引用陳冠學〈西北雨〉課文
  answer:
  - B
