- id: doc_111_高雄_林園_國文_g8s1e2_s3_2
  section: 3
  number: 2
  type: single
  page: 1
  stem: 請選出下列成語運用，哪個選項是錯誤的?
  options:
  - label: A
    content: 這棟老舊公寓因為地震而出現多處裂縫，屋況「岌岌可危」，隨時都可能倒塌。
  - label: B
    content: 華恩今年再度當選班長，可見他的領導能力是「無庸置疑」的。
  - label: C
    content: 為了名利而「汲汲營營」的人，永遠得不到真正的快樂。
  - label: D
    content: 阿芳姨做事向來「嫉惡如仇」，我行我素，從不在乎旁人的眼光或感受。
  answer:
  - D
