  stem: 林肯說：「你可以為玫瑰長滿刺而抱怨，或為刺上長滿玫瑰花而喜悅。」這句話的涵義與下列何者不同？
  options:
  - label: A
    content: 悲觀的人在每個機會裡都只看到困難，樂觀的人卻能在每個困難裡看見機會。
  - label: B
    content: 憂鬱是一種習慣，快樂也是一種習慣；要哪一種，是你的選擇。
  - label: C
    content: 所有事情，在它們經由嘗試而成為簡單的事情之前，都是困難的。
  - label: D
    content: 無論遇到什麼困難，提醒自己，你可以選擇如何看待它們。
