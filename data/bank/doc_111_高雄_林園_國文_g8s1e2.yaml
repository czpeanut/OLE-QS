- id: doc_111_高雄_林園_國文_g8s1e2_s4_3
  section: 4
  number: 3
  type: single
  page: 5
  stem: 「假新聞何以在美國這麼流行？美國ＣＢＳ『六十分鐘』節目訪問很多假新聞當事人，有人說︰『我有這麼多粉絲追隨，一定要滿足他們」』；還有人為了『看到按讚分享數字狂跳，尌讓我興奮莫名，上了癮』。這麼多新聞造假，追快與聳動、娛樂化，社群媒體的轉播與行銷，都是原因之一，也造成新聞出錯率高，品質下降的自我沉淪。另一原因是記者常把臉書、推特當成消息來源，網路傳播快速，一旦犯錯覆水難收。因此在社會日趨激情的時代，媒體更應冷靜自持，提升新聞品質。」（蘇蘅
    〈當媒體不重視採訪「真新聞」〉）根據這段文字，下列何者錯誤？
  options:
  - label: A
    content: 假新聞的問題在美國是嚴重的。
  - label: B
    content: 假新聞流行的原因之一是製造假新聞的當事人別有所圖，不在乎真實性。
  - label: C
    content: 記者應謹慎運用臉書、推特的內容，以免散播了假新聞
  - label: D
    content: 在網路世代，媒體已經式微，大家只能自求多福，以免被假新聞蒙騙。
  answer:
  - D
