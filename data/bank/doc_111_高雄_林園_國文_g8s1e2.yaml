  group_stem: '13~14.陶淵明寫〈五柳先生傳〉，傳中的五柳先生尌是陶淵明自己，「常著文章自娛，頗示己志」，是指陶淵明藉由詩文作品，表達自己的思想觀念，請從下面陶淵明的作品，一窺陶淵明內心世界。

    〈飲酒〉     陶淵明

    結廬①在人境，而無車馬喧。

    問君何能爾②？心遠地自偏。

    採菊東籬下，悠然見南山。

    山氣③日夕④佳，飛鳥相與還⑤。

    此中有真意，欲辯已忘言。

    【注釋】

    ① 結廬：建造房舍。     ②爾：如此。      ③山氣：山中的雲霧之氣。

    ④日夕：黃昏。        ⑤相與還：結伴歸來。還，音ㄏㄨㄢˊ。'
