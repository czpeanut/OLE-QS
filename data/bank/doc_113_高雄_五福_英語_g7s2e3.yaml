- id: doc_113_高雄_五福_英語_g7s2e3_s4_3
  section: 4
  number: 3
  type: single
  page: 4
  stem: What happens when we eat delicious food?
  options:
  - label: A
    content: We feel sleepy.
  - label: B
    content: Our brain makes dopamine.
  - label: C
    content: We lose focus.
  - label: D
    content: Our body stops moving.
  group_stem: 'Dopamine is a chemical in the brain. It helps us feel happy. When we
    eat delicious food or get a good grade, our brain makes dopamine. This makes us
    feel good and want to do it again.


    Dopamine is important for learning. It also helps us move our bodies. If someone
    does not have enough dopamine, they may feel tired, sad, or have trouble focusing.


    There are healthy ways to increase dopamine. Exercising, sleeping well, listening
    to music, and spending time with friends can all help. Eating healthy foods like
    bananas, fish, and nuts can also be helpful.


    However, too much dopamine is not good. It can cause problems like stress or addiction.
    Our brain works best when dopamine levels are just right.


    dopamine 多巴胺; chemical 化學物質; focus 專注; stress 壓力; addiction 成癮'
