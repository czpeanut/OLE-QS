- id: doc_113_高雄_五福_英語_g7s2e3_s4_1
  section: 4
  number: 1
  type: single
  page: 3
  stem: What is this reading mainly about?
  options:
  - label: A
    content: All animals are similar.
  - label: B
    content: There are five kinds of animals.
  - label: C
    content: Animals only live on land.
  - label: D
    content: No animals can fly.
  group_stem: 'How Are Animals Different?

    There are five kinds of animals: mammals, birds, reptiles, amphibians, and fish.
    They are all different from each other.


    Mammals are animals like dogs, cats, and lions. They give birth to live babies.
    Babies drink milk from their mothers. All birds have feathers, but not every bird
    can fly. Some common birds are penguins, eagles, and chickens. Reptiles and amphibians
    are similar. Reptiles lay eggs and like warm places. Amphibians live both in water
    and on land. They lay eggs in water. Snakes and lizards are reptiles, and frogs
    are amphibians. Fish live in water and lay eggs, too. They use gills to take in
    oxygen from the water. Sharks and catfish are fish.


    These animals are different, but they all play an important role in nature.


    give birth to live babies 胎生; feather 羽毛; similar 相似; lay 產卵; gill 鰓; oxygen 氧'
