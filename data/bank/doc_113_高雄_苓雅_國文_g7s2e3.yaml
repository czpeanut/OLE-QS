  group_stem: '在夏日枯旱的非洲大陸上，一群飢餓渴乏的鱷魚陷身在水源快要斷絕的池塘中，較強壯的鱷魚已經開始弱肉強食同類了，眼看物競天擇、強者生存的理論正在上演。這時，一隻瘦弱勇敢的小鱷魚卻起身離開了快要乾涸的水塘，邁向未知的大地。乾旱持續著，池塘中的水愈來愈混濁、稀少，最強壯的鱷魚已經吃掉了不少同類，剩下的鱷魚看來是難逃被吞食的命運；卻不見有鱷魚離開，也許棲身在混水中，等待遲早被吃掉的命運，似乎總比離開、走向完全不知水源在何處還安全些。

    可是，那隻勇敢離開的小鱷魚呢？

    在經過多天的跋涉，幸運的牠竟然在乾旱的大地上，找到了一處水草豐美的綠洲。原來物競天擇，未必強者生存，小鱷魚有運氣，但牠懂得選擇離開，證明了改變觀念便能改變命運的適者生存哲學。

    這讓我想到多年前一個年輕朋友的遭遇，她在工作單位上屢受排擠，使她最後毅然決定離開，自己成立公司，幾年下來她的公司頗具規模，但當初排擠她的人卻因公司經營不善倒閉而失業了。這個年輕朋友告訴我，她一直很感激當初大力壓制她的人，她說那個人給了她一個機會讓她「到別處去尋找夢想」。

    人生就是這樣，勇於競爭做強者的人未必一定贏得最後的球賽，反而是能夠自我調整、改變、創新的人更能適應環境而生存下來。重要的是要先能內心保有夢想，如果在某個地方實現不了自己的夢想，那麼就換個地方吧！

    只要懂得到別處找夢想，你將擁有更海闊天空的生活。

    （節錄自網路文章離開後才有未來）'
