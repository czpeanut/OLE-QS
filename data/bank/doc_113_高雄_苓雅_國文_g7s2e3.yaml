- id: doc_113_高雄_苓雅_國文_g7s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 「『臺灣菜』是臺灣在不同歷史時期，由原住民和一波波移民所帶來『飲食傳統』（foodways）的總和，包含了家常菜、宴席菜及點心，這些飲食傳統隨著時代遞嬗而有所變遷。十七世紀之前，臺灣南島民族已建立獨特的生活方式，以小米、芋頭等為常見主食，之後納入番薯、稻米等，不過一直到清代，並未使用『臺灣菜』一詞來指稱臺灣的菜餚。直到日本殖民統治時期，相對於『日本料理』，才有『臺灣料理』的稱呼。除了從歷史文獻中找尋其源流外，更重要的是回到自己家庭的餐桌，了解家裡不同世代人的拿手菜餚、節慶食物等。『家庭的餐桌，就是一部家族史』，每個臺灣人家庭的餐桌，都是臺灣飲食史的一部分，需要每個人更加珍惜，將之記錄下來，傳承手藝，也賦予當代『臺灣菜』新的意義。」根據上文，下列說明何者正確？
  options:
  - label: A
    content: 臺灣菜系具有單一而純正的血統
  - label: B
    content: 從平民飲食就能看出臺菜的歷史
  - label: C
    content: 臺灣料理出現時間較日本料理晚
  - label: D
    content: 小米、芋頭、番薯等是臺菜靈魂
