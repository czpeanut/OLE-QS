- id: doc_113_高雄_苓雅_國文_g7s2e3_s2_47
  section: 2
  number: 47
  type: single
  page: 6
  stem: 「芋頭如果擬人，大概是老好人，總是幫襯別人。它和音時多，個唱時少。」作者的比喻是在說芋頭的何種特質？
  options:
  - label: A
    content: 適合作為主食容易消化
  - label: B
    content: 吃了對身體健康有益處
  - label: C
    content: 多半搭配其他材料入菜
  - label: D
    content: 好種植易收成容易烹煮
  group_stem: '料理芋頭，很倚重芋頭的天分。菜場裡，常見商販取一隻芋，削出切面讓人窺視。紫紅筋絡均勻的，或掂在手裡輕的，粉質重，熟了才鬆化。若遇壞芋，質地堅，搗不爛，要把硬塊挑出來，通常還不香，怎麼調味也難救。

    芋頭從成形到不成形的，樣態很多。芋頭如果擬人，大概是老好人，總是幫襯別人。它和音時多，個唱時少。完整到爛糊，化成什麼形都好吃。原形芋頭，切塊炸酥，在火鍋裡或佛跳牆裡燉出絨。我吃佛跳牆，專挑湯裡墊底的栗子、筍絲和芋頭吃，這些才吸收了所有鮮湯。

    吃芋的原形，還喜歡它與牙口牴觸，咬著化掉，漸漸的香。終極芋頭製法，當然是芋泥。芋泥是傳統甜點的要角之一，兒時上中式餐館吃壽宴，最期待飯後分得一小碗甜芋泥或芝麻糊，如今不多見了。一切費時，手工密集，要求耐性的事，未來都要愈來愈少，或要重金去換。

    芋泥真是非常東方的材料，咱臺灣人除了愛戴它，還極能變化它。當代芋泥，將油脂換成奶油或其他植物油，還將之包進芋頭酥，抹進海綿蛋糕作為夾餡，弄成芋頭奶茶芋頭布丁什麼的，它始終不是席上最貴、賣相最佳的菜，但是粗樸雋永，怎麼翻來覆去地吃它都好，都被撫慰。

    （節錄自洪愛珠 芋頭的天分）'
