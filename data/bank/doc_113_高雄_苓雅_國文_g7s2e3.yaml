  group_stem: '(甲)從生命之初，糕餅的感官記憶與生命記憶就此綿綿相連。從孩子還在母親肚內，向臨水夫人祈求安胎、順產所祭拜的糖餅開始；滿月外嬤送的長壽紅龜粿；「收涎收離離，嬰仔食百二」四月日收涎時套在嬰兒頸間的酥餅串；成年禮的糖、粿祭品；出嫁迎娶的喜餅；每年作壽的壽桃、糕粿等，都是臺灣糕餅文化重要的展現。糕餅內藏的文化意涵，不單是人與神間的禮制與祈福，並顯示人民與自然環境、農作物產的對應關係，成為獨一無二的文化。飲食，永遠是最貼近在地文化與生命記憶的一環。從糧食到糕餅，異質文化在原生飲食文化的插枝與發展；從小米、黍粿到漢人移動所引入的米麥食材，糕餅原料挾帶新的飲食方式在臺灣開創與傳承，同時也展現新的飲食風貌與各地歲時祭儀的文化樣態。

    （節錄自臺中市政府文化局 食代記憶話從頭—淺談糕餅文化）

    (乙)「昔日，糕餅用於祭神或者敬祖。但到了今日，它不再是限定於特定節日吃的，糕餅成為人際關係的橋梁。中秋節、農曆春節時，糕餅更成為送禮的代表。」張尊禎認為，臺灣糕餅有6
    大滋味，分別是「地方味、歲時味、時代味、人情味、吉祥味與虔誠味」，它絕不只是食品，而是珍貴的文化資產，是一門與生活禮俗息息相關的活藝術。

    （節錄自張尊禎 走進臺灣民間，那些你不知道的「糕餅密碼」）'
