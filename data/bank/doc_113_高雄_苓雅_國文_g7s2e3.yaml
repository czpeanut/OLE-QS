  stem: 關於這則故事內容，下列敘述何者正確？
  options:
  - label: A
    content: 洛陽僧侶修煉而成怪，請求術士設法幫助
  - label: B
    content: 曹紹夔發現問題根源，因而替洛陽僧侶解難
  - label: C
    content: 洛陽僧侶以盛宴款待曹紹夔，卻一言不合而吵架
  - label: D
    content: 曹紹夔因疾病尋訪僧侶，兩人因同病而相互告慰
  group_stem: '洛陽有僧，房中磬子夜輒自鳴。僧以為怪，懼而成疾。求術士百方禁之，終不能已。曹紹夔素與僧善，適來問疾，僧俱以告，俄頃輕擊齋鐘，磬復作聲。紹夔笑曰：「明日設盛饌，余當為除之。」僧雖不信其言，冀其或效，乃置饌以待。紹夔食訖，出懷中銼，銼磬數處，其響遂絕。僧苦問其所以，紹夔曰：「此磬與鐘律合，擊彼應此。」僧大喜，其疾使愈。

    （唐語林曹紹夔捉鬼）'
