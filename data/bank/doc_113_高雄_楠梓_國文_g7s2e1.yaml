  group_stem: "(三)\n 從前，有一個不愛讀書的學子，每次遇到考試就急得不得了，現在又面臨到考試了，不知如何是好。\n 後來他心想，何不如去求神仙，請他指點解決方法。\n\
    \ 他跑到設壇扶乩的地方，請八仙之一的呂純陽①幫忙，他對著神座磕頭禱告，一會兒乩童在沙盤上揮動起來，寫道：「趙酒鬼來也！」學子一看，連忙說：「錯了錯了！我要請的是呂大仙，誰找趙酒鬼來呢？」旁邊的乩童說：「大概是你誠意不夠，要加香油錢。」學子趕緊掏錢，然後又恭敬的下跪，等待呂大仙降臨。果然，一會兒乩童又大揮大動起來，在沙盤上寫了三個字：「呂純陽。」學子高興極了，急忙向大仙哭訴。他說馬上就要考試，書也沒念，心裡著急，求大仙指點怎樣才能考試及格。沙盤上寫了：「快去喝墨水一大瓶，再來聽示。」學子趕緊磕了頭爬起來，跑去買了一瓶特大號的墨水喝了，然後又來拜仙。一會兒乩童又寫道：「添油五十斤，燒香五十炷。」學子只好照辦。\n\
    \ 最後等了半天，腿都跪痠了，乩童才又揮動，寫的是一首打油詩：「平時不努力，臨時喝墨水。我非呂純陽，依然趙酒鬼。」學子看了，大呼上當。\n 【注解】①呂純陽：字洞賓，為八仙之首。"
