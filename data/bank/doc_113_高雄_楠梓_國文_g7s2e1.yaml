  type: single
  page: 6
  stem: 依據文中所述，下列選項何者並非是「15-30 歲年輕人免費心理諮商方案」的目標？
  options:
  - label: A
    content: 加強高風險個案醫療轉介
  - label: B
    content: 鼓勵年輕人勇於求助
  - label: C
    content: 尋求及認識心理諮商
  - label: D
    content: 從學校系統中及早介入防範
  group_stem: "(四) 15-45 歲青壯世代心理健康支持方案\n 去年首次由政府提供的「15-30 歲年輕人免費心理諮商方案」，有 3 大目標：鼓勵年輕人勇於求助、尋求及認識心理諮商、加強高風險個案醫療轉介，讓這群正值家庭、人際、學業與求職等人生議題的族群，\
    \ 能減輕經濟負擔前來接受諮商服務。此方案推出半個月，許多縣市便已預約額滿，使得衛福部只好緊急追加預算來提供更多名額。自 112 年 8 月統計到 113\
    \ 年 6 月底，此方案已服務 29,920 人。經衛福部統計，高達 95% 的申請者認為接受心理諮商服務對自己的困擾議題有所幫助，甚至有不少人是第一次接受心理諮商服務，而其中高風險即早治療者更是突破萬人，佔使用者的三分之一。\n\
    \ 當心理諮商需求被看見後，政府接續著擴大推出「15-45 歲青壯世代心理健康支持方案」（如下圖）， 使得憂鬱、焦慮等常見精神疾患盛行率最高的 30-45\
    \ 歲族群，也能從方案中受益。而針對青少年族群，「學生輔導法」也研議修法增加輔導專業人力，希望能從學校系統中及早介入防範，學習情緒調節能力與提升心理健康。"
