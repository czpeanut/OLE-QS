  type: single
  page: 2
  stem: '阿奇解二元一次聯立方程式 $\begin{cases}5x-4y=23......①\\ 2x+y=4.........②\end{cases}$
    的過程如下：

    步驟一：由②式得$y=4-2x......③$

    步驟二：將③式代入①式，得$5x-4(4-2x)=23$，

    步驟三：去括號得$5x-16-8x=23$

    步驟四：化簡得$x=-13$代入③式，得$y=30$

    則阿奇從哪一個步驟就開始出現錯誤？ 【1-2】'
  options:
  - label: A
    content: 步驟一
  - label: B
    content: 步驟二
  - label: C
    content: 步驟三
  - label: D
    content: 步驟四
