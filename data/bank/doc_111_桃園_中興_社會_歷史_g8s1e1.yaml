  section: 1
  number: 13
  type: single
  page: 1
  stem: 張騫是中國著名的外交家和探險家。首先開闢了一條經西域、中亞，通往北非、歐洲的道路，此即後世所稱的絲綢之路。西漢歷史學家司馬遷將張騫通西域的壯舉稱為「鑿空」，形容他開通東西兩方的壯舉。請問：皇帝派遣張騫出使西域的主要目的是什麼？
  options:
  - label: A
    content: 聯絡西域諸國夾擊匈奴
  - label: B
    content: 護送漢朝公主與匈奴和親
  - label: C
    content: 積極發展對西域各國的貿易
  - label: D
    content: 說服南匈奴降漢以移居邊境。
