    C=\angle E$

    老師在批改時，留言寫道：「其實在 $\overline{DE}$ 邊上，找到一點 $G$ 替代點 $D$，就有 $\triangle ABC \cong \triangle
    GFE$ 囉！」

    由上所述，試問下列哪一種作圖方式必能找到點 $G$ 正確的位置？'
  options:
