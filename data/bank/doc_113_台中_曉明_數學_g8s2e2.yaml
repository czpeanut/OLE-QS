    content: 作 $\overline{DE}$ 邊上的高 $\overline{FH}$，在 $\overline{HE}$ 上取點 $G$ 使 $\overline{HG}=\overline{DH}$
  - label: C
    content: 作等腰三角形 $\triangle DFG$，其中 $\angle DFG$ 為頂角
  - label: D
    content: 作 $\angle DFE$ 的角平分線 $\overline{FG}$，交 $\overline{DE}$ 邊於 $G$
