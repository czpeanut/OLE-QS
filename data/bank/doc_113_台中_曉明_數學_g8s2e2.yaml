  stem: '如右圖，直線 $CP$ 是 $\overline{AB}$ 的中垂線且交 $\overline{AB}$ 於 $P$，其中 $\overline{AC}=2\overline{CP}$。

    甲、乙兩人想在 $\overline{AB}$ 上取兩點 $D$、$E$，使得 $\overline{AD}=\overline{DC}=\overline{CE}=\overline{EB}$

    其作法如下：

    甲：作 $\overline{AC}$、$\overline{BC}$ 之中垂線、分別交 $\overline{AB}$ 於 $D$、$E$，則 $D$、$E$
    即為所求

    乙：作 $\angle ACP$、$\angle BCP$ 之角平分線，分別交 $\overline{AB}$ 於 $D$、$E$，則 $D$、$E$ 即為所求

    對於甲、乙兩人的作法，下列判斷何者正確？'
