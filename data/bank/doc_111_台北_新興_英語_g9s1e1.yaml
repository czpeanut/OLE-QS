  - label: D
    content: To show how popcorn was made.
  group_stem: "Anyone who has been to the movies knows what popcorn is.  It is a delicious\
    \ treat that has answered many people’s need for something natural and full of\
    \ taste to eat.  Popcorn is not a new treat at all.  In fact, it has been around\
    \ since 4700 BC.\n  Popcorn comes from the Americas.  The Aztecs made popcorn\
    \ into things that could be worn around their necks and keep them safe during\
    \ important events.  Later, popcorn was turned into necklaces by the Native Americans.\
    \  \n  Native Americans also ate popcorn as a dish.  To make it, many different\
    \ ways were used.  In one way, whole ears of corn were put on sticks and cooked\
    \ over an open fire.  In another way, corn kernels were cut down and thrown right\
    \ into the fire, and only those pieces that happened to pop out of the fire were\
    \ eaten.  In still another way, which was used later, corn kernels were thrown\
    \ onto the sand that was heated inside a pot.  That made more popped corn be collected\
    \ and eaten.   \n  It wasn’t until the 1880s that the first popcorn machines were\
    \ made and used in the United States. That made popping corn much easier and popcorn\
    \ more popular.  However, what made popcorn really popular was the TV.  Pretty\
    \ soon, everyone was enjoying a bowl of it while they watched their favorite programs.\
    \   \n  Popcorn got another hand up with microwave popcorn in 1981.  Now, most\
    \ people get their favorite popcorn that way, and millions of pounds of popcorn\
    \ are eaten each year.  \n necklace 項鍊 Native American 美洲原住民 corn 玉米 sand 沙 microwave\
    \ 微波"
