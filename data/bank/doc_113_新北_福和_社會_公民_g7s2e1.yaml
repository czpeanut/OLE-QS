  group_stem: "為因應未來的能源轉型政策,政府預計於桃園大潭電廠外興建觀塘液化天然氣接收站；該處有豐富的生態系，養育近百種生物，覆蓋面積高達230 公頃的藻礁，還有一級保育類的柴山多杯孔珊瑚，綠蠵龜、台灣白海豚，因此遭環保團體–台灣環境保護協會強烈抗議，因工業污染、填海造陸、海岸人工化所造成的棲地破壞，已使得近75%桃園藻礁生態消失，主張大潭藻礁生態應受保育，而發起「珍愛藻礁公投」的活動。\n\
    \    19 歲的阿忠是環保團體的一員，對環境保育不遺餘力，是此次公民投票發起人之一，並於投票日前往投票。公民投票結果雖然失敗，但有416 萬人反對此項建設，並引起社會大眾關注環境保護的議題。"
