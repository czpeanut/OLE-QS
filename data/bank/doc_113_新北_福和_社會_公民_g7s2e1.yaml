  page: 1
  stem: '請依據下列內容判斷，阮氏融入台灣的社會生活，是透過何種過程？ L1


    越南籍阮氏嫁給台灣男子，起初因語言障礙、文化差異而不適應台灣的生活。之後，阮氏到國小夜補校上課，增強語言能力及認識台灣文化，也參加政府舉辦的職業技能班，三年後，阮氏溝通能力已提升，也會製作台灣的美食，和家人一同過台灣的節慶，阮氏已適應台灣的生活。'
  options:
  - label: A
    content: 民間化
  - label: B
    content: 社會化
  - label: C
    content: 團體化
  - label: D
    content: 國際化
- id: doc_113_新北_福和_社會_公民_g7s2e1_s1_36
  section: 1
  number: 36
  type: single
  page: 1
  stem: 2023年發生藝人間ME TOO (性騷擾)事件，小哲到GOOGLE查詢何謂ME TOO及整件事的過程，發現有很多網友也在網路上表達看法，小哲也因此學到性騷擾的法律責任及如何尊重異性。請問下列所提及的學習途徑，何項與小哲的方式相同？L1
  options:
  - label: A
    content: 小健從新聞報導得知近日流感肆虐，要注意防疫
  - label: B
    content: 出生於軍人世家的阿國，已養成規律生活的習慣
  - label: C
    content: 學校的防震演習，安安學會地震時如何逃生避難
  - label: D
    content: 受到同學影響，小育也加入童軍團幫助獨居老人
- id: doc_113_新北_福和_社會_公民_g7s2e1_s1_37
  section: 1
  number: 37
  type: single
  page: 1
  stem: 烏克蘭籍的藝人瑞莎與我國男子結婚生子，於2017 年取得我國國籍，成為我國國民。她曾經是烏克蘭韻律體操國手，如今在台灣落地生根、建立家庭，且義務到桃園的中、小學協助訓練體操選手。請問下列何人也是我國國民？L1
  options:
  - label: A
    content: 在美國出生，現在成為職棒球員的若熙
  - label: B
    content: 父母都是日本人，在新北市出生的竣岳
  - label: C
    content: 已來台灣工作5 年，申請歸化中的易磊
  - label: D
    content: 市長選舉時從英國回來完成投票的晟睿
- id: doc_113_新北_福和_社會_公民_g7s2e1_s1_38
  section: 1
  number: 38
  type: single
  page: 1
  stem: '四位棒球球迷聊到法定年齡可參與的公共事務，以下是他們聊天內容，由內容判斷，四位球迷的年齡依序大小為何？

    傑憲 :「今年我可以實現『憲法』的規定，投票選出我國的總統」

    昱珉 :「我現在是國中一年級的學生，正享國民的權利和盡義務」

    家正 :「明年我可以參加公務人員的考試，通過即可成為公務員」

    東華 :「今年是我第一次投下公投的票，表達對政府政策的意見」'
  options:
  - label: A
    content: 傑憲 > 家正 > 東華 > 昱珉
  - label: B
    content: 家正 > 傑憲 > 昱珉 > 東華
  - label: C
    content: 傑憲 > 東華 > 家正 > 昱珉
  - label: D
    content: 東華 > 傑憲 > 昱珉 > 家正
- id: doc_113_新北_福和_社會_公民_g7s2e1_s1_39
  section: 1
  number: 39
  type: single
  page: 1
  stem: 台北市政府為落實「開放政府，全民參與」理念，推出「i-Voting」網路投票機制，民眾可上網在這個平台，表達對政策的看法和意見，以促進民眾對政治的關心與討論，也可作為市政府施政的參考。依據上述内容下列何項說明最適當？
    L1
  options:
  - label: A
    content: 市政府為方便少數人決定公共事務推動網路投票
  - label: B
    content: 民眾上網表達意見，可讓政策更貼近市民的需求
  - label: C
    content: 市政府推動網路投票機制，導致市民的生活負擔
  - label: D
    content: 市民表達對政策意見，屬於理性思考的公民德性
- id: doc_113_新北_福和_社會_公民_g7s2e1_s1_40
  section: 1
  number: 40
  type: single
  page: 1
  stem: "《做工的人》一書的作者林立青先生，有感於對社會的責任，成立了「友洗社創」清潔公司。該公司的員工全是流連在街頭、夜宿網咖或馬路的「街友」們，他們每日薪資最少一五○○元，林立青先生讓他們不再流浪，能自力更生。\n\
    \   請問林立青先生的作為，實踐下列哪一項公民素養？ L1"
  options:
  - label: A
    content: 理性思考判斷
  - label: B
    content: 遵守法律規範
  - label: C
    content: 實現公平正義
  - label: D
    content: 培養倫理道德
- id: doc_113_新北_福和_社會_公民_g7s2e1_s1_41
  section: 1
  number: 41
  type: single
  page: 1
  stem: '以下是四位學生以公民德性來說明自己假日時所從事的活動，請問下列何人的歸類正確? L1

    | 人物 | 活 動 | 公 民 德 行 |

    | --- | --- | --- |

    | 娟娟 | 搭乘公車時，使用手機時音量不影響他人 | 遵守法律規範 |

    | 玉玉 | 參加災後重建的公聽會，並聆聽他人意見 | 展現相互尊重 |

    | 秀秀 | 參加山林撿拾垃圾的活動,以維護山林環境 | 捍衛公平正義 |

    | 寬寬 | 觀看電視新聞，關心國內、外發生的大事 | 促進公共利益 |'
  options:
  - label: A
    content: 娟娟
  - label: B
    content: 玉玉
  - label: C
    content: 秀秀
  - label: D
    content: 寬寬
- id: doc_113_新北_福和_社會_公民_g7s2e1_s1_42
  section: 1
  number: 42
  type: single
  page: 1
  stem: '小瑩是位學校老師,平日除了參與「全國教師工會」和「排球社」的活動，寒、暑假也擔任「台南市文史工作室」的導覽志工,假日還會參加「台語文教育基金會」舉辦的推廣活動。下列關於小瑩參與活動的叙述何者正確?
    L2 (註:工會: 同一職業的勞工組成)'
  options:
  - label: A
    content: 「排球社」的成立是依《憲法》的集會自由而組成
  - label: B
    content: 「台語文教育基金會」舉辦的推廣活動具有民間性
  - label: C
    content: 小瑩老師擔任導覽志工可以實現公共利益的德性
  - label: D
    content: 「全國教師工會」，由教師組成，為非志願性團體
- id: doc_113_新北_福和_社會_公民_g7s2e1_s1_43
  section: 1
  number: 43
  type: single
  page: 1
  stem: 正義新村長期因住戶停車問題常發生糾紛，管理委員會預計於近期召開社區大會，小為得知後(甲)上網查詢相關的法規及別的社區如何處理，以做為參考。社區大會時小為也到現場關心並發表意見，最後住戶透過表決決定規畫停車格，且須(乙)收取停車費，以利社區使用。請問下列何項說明最貼切？
    (素養題) L1、 L2
  options:
  - label: A
    content: 正義新村管理委員會是隸屬於政府機關
  - label: B
    content: 甲畫線處展現小為遵守倫理道德德行
  - label: C
    content: 乙畫線處可看出管理委員會具有營利性
  - label: D
    content: 小為和居民的參與可避免少數人操弄
- id: doc_113_新北_福和_社會_公民_g7s2e1_s1_44
  section: 1
  number: 44
  type: single
  page: 2
  stem: 近日某王姓藝人搭乘計程車時，懷疑連姓司機繞路，雙方爆發口角引發衝突，幾天後該藝人教唆幫派毆打計程車司機，新北市地方法院檢察署的檢察官得知後隨即依法偵辦。請問針對組織幫派的說明何項正確？
    L2
  options:
  - label: A
    content: 組織幫派是《中華民國憲法》保障的結社自由
  - label: B
    content: 幫派毆打計程車司機的行為屬於團體的自主性
  - label: C
    content: 依據《世界人權宣言》人人可自由意願加入幫派
  - label: D
    content: 幫派危害他人依《組織犯罪防制條例》加以限制
- id: doc_113_新北_福和_社會_公民_g7s2e1_s1_45
  section: 1
  number: 45
  type: single
  page: 2
  stem: '安娜上公民課後，練習有關志願結社的特徵題目，請問安娜的作答依序何者正確? L2

    志願結社的特徵:(甲) 志願性 (乙) 民間性 (丙) 組織性 (丁) 非營利性 (戊) 自主性

    1.伊甸基金會提供身心障礙者的協助，歡迎民眾加入，一起協助身心障礙者。

    2.荒野保護協會2025 年舉辦(荒野桃園)棲地維護，移除大萍、布袋蓮的活動。

    3.台灣兒童暨家庭扶助基金會內部分有認養處、社會工作處，專門處理相關業務。。

    4.喜憨兒社會福利基金會成立喜憨兒購物網，將喜憨兒製作的產品在網路上販售，盈餘用於基金會。

    5.台灣土木技師公會，於地震後協助政府鑑定傾斜的建築物，以供政府處理的參考，不能強制拆除。'
  options:
  - label: A
    content: 甲戊丙丁乙
  - label: B
    content: 甲乙丙丁戊
  - label: C
    content: 乙丙丁甲戊
  - label: D
    content: 丙乙丁戊甲
- id: doc_113_新北_福和_社會_公民_g7s2e1_s1_46
  section: 1
  number: 46
  type: single
  page: 2
  stem: 安德烈慈善協會藉由「食物銀行計畫」結合學校，將食物援助15 歲以下弱勢家庭的孩童，並教育學生珍惜食物和學會分享愛心。去年在福和國中舉辦的慈善活動「愛要即食，校園幸福一日捐」，邀請學生在家長同意之下攜帶食物至學校捐贈，學生和家長響應熱烈，共募得了二貨車的食物，並全數捐給弱勢的家庭。上述內容主要呈現安德烈慈善協會的作法對公共生活有何種影響？
    L2
  options:
  - label: A
    content: 強迫學生積極參與捐贈食物
  - label: B
    content: 集結群體的力量協助弱勢家庭
  - label: C
    content: 吸引社會大眾的關注與支持
  - label: D
    content: 呼籲政府正視弱勢兒童的問題
- id: doc_113_新北_福和_社會_公民_g7s2e1_s1_47
  section: 1
  number: 47
  type: single
  page: 2
  stem: 2024 年4 月3 日，花蓮大地震造成三棟房屋嚴重的損壞，許多民眾受傷或失聯。花蓮慈濟志工在地震後啟動救災機制，立即成立災害應變中心，提供救援和物資；紅十字會即刻配合花蓮消防局出動救災隊，協助搜救與運送傷者，還在後續的重建工作中持續關懷受災民眾的需求。透過民間組織與政府機關的合作及有效整合資源，大幅提升災難時應變效率及能量，並協助災民快速重建及回復災前正常生活。請問下列何項敘述最符合上述內容的意涵？
    L2
  options:
  - label: A
    content: 民間團體有責任監督政府救災的進度
  - label: B
    content: 政府機關可提供民眾參與救災的管道
  - label: C
    content: 吸引民眾關注與支持以利募得物資
  - label: D
    content: 民間團體的力量在救災上的重要性
- id: doc_113_新北_福和_社會_公民_g7s2e1_s1_48
  section: 1
  number: 48
  type: single
  page: 2
  stem: 「博愛座衝突頻傳！」近期捷運上多次發生博愛座爭議，其中一位女乘客拒絕讓座給長者，還被長者斥責和毆打，這一事件引起了社會對博愛座讓座議題的討論，甚至有人在「公共政策網路參與平台」提出「廢除博愛座」的意見；博愛座到底誰能坐？小愛上網查詢資料，得知「行動不便者、孕婦、身心障礙或身體不適等旅客皆可使用。」政府也將修正《身心障礙者權益保障法》，將「博愛座」修改為「優先席」，並將現行規定博愛座為「身心障礙者及老弱婦孺」優先乘坐，擴大至「有其他實際需要者」以減少紛爭。針對上述狀況，下列說明何項最〝不恰當〞？
    L2
  options:
  - label: A
    content: 女乘客未禮讓座位給長者因缺乏法律素養
  - label: B
    content: 網路平台提供人民參與公共事務管道
  - label: C
    content: 小愛上網查詢相關資料具理性思考的德性
  - label: D
    content: 網路平台的意見可以影響政府的政策
- id: doc_113_新北_福和_社會_公民_g7s2e1_s2_49
  section: 2
  number: 49
  type: single
  page: 2
  stem: 阿忠參與「珍愛藻礁公投」的投票，請問他的身分，最可能具備何種資格 ? (素養題) L1
  options:
  - label: A
    content: 阿忠具有狹義公民身分，可投票選民意代表
  - label: B
    content: 阿忠是我國的公民，可以行使所有的參政權
  - label: C
    content: 阿忠已領我國身分證，可行使選舉、罷免權
  - label: D
    content: 阿忠擁有創制、複決、應考試服公職的權利
  group_stem: "為因應未來的能源轉型政策,政府預計於桃園大潭電廠外興建觀塘液化天然氣接收站；該處有豐富的生態系，養育近百種生物，覆蓋面積高達230 公頃的藻礁，還有一級保育類的柴山多杯孔珊瑚，綠蠵龜、台灣白海豚，因此遭環保團體–台灣環境保護協會強烈抗議，因工業污染、填海造陸、海岸人工化所造成的棲地破壞，已使得近75%桃園藻礁生態消失，主張大潭藻礁生態應受保育，而發起「珍愛藻礁公投」的活動。\n\
    \    19 歲的阿忠是環保團體的一員，對環境保育不遺餘力，是此次公民投票發起人之一，並於投票日前往投票。公民投票結果雖然失敗，但有416 萬人反對此項建設，並引起社會大眾關注環境保護的議題。"
