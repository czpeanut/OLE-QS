- id: doc_113_新北_福和_社會_地理_g8s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 從中非到西非，再到東非的沿海森林，整個非洲大陸的森林面積正逐漸縮減。森林不只與生物多樣性相關，更與全球氣候存在密切關聯。健康的森林還可以形成穩定的水循環，維持地面的水土保持，減少土壤侵蝕和退化的情況。請問關於減緩非洲森林的消失，下列何項策略是最佳的治本方法？
  options:
  - label: A
    content: 非洲政府取消伐林禁令，同意海外及當地企業伐林，避免私自盜伐
  - label: B
    content: 擴大非洲地區油棕樹的種植面積，提升經濟作物的產量與土地收益
  - label: C
    content: 要求礦業與化石燃料業者在進行伐木開採時，需補貼當地政府損失
  - label: D
    content: 推動植樹造林和生態恢復計劃，在退化的土地上，提高森林覆蓋率
