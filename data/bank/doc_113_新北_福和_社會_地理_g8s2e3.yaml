    年代農民分得16%的利潤，如今僅剩6.6%，豐厚的利潤大部分流向零售商，其次是製造商。象牙海岸與迦納的農民日收入僅50 至84 美分，遠低於貧窮線，甚至買不起自己生產的巧克力。童工問題仍普遍存在，估計有210
