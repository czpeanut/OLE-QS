  stem: '「2019 年，全球規模最大的自由貿易區—非洲大陸自貿區（AfCFTA）正式成立。說是全球最大，並非指經濟實力而是指面積與人口數。AfCFTA 成立目標：一、降低非洲內部的關稅，提升區域內貿易水平，目前非洲內部貿易遠低於亞洲和歐洲。二、非洲約75%的出口來自石油和採礦行業，易受國際市場波動影響。AfCFTA
    致力於推動產業多樣化，如鐵礦開採國向煉鋼及相關行業延伸。三、非洲每年食品進口花費630 億美元，供應商多為境外國家，自貿協議有望促進內部農產品貿易增長20%至30%。」

    請問下列關於非洲大陸自貿區的敘述何者為非？'
