  type: single
  page: 1
  stem: 「被譽為『赤道雪峰』的吉力馬札羅山，海拔5895 公尺，位於坦尚尼亞東北部，靠近肯亞邊界，是世界七大洲的最高峰之中攀登難度最低的一座山岳，不需冰雪裝備即可登頂。其攀登路線眾多，Machame（威士忌）路線是最受歡迎的露營路線，沿途景觀多變，從熱帶雨林、溫帶森林，再到冰川雪地，幾乎涵蓋所有的地理帶。旺季時，遊客與挑夫絡繹不絕。」根據上文，下列敘述何者正確？
  options:
  - label: A
    content: 吉力馬札羅山位於撒哈拉沙漠以北的非洲
  - label: B
    content: 因位處高緯地區所以登頂時可見美麗雪景
  - label: C
    content: 由於地勢落差小，氣溫與植被呈垂直變化
  - label: D
    content: 登山旅遊業的興起可增加當地居民的收入
