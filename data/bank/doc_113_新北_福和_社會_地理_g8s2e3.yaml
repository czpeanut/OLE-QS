- id: doc_113_新北_福和_社會_地理_g8s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 公平貿易運動始於一九四○年代，當時美國與歐洲很小型的組織，開始與低度開發國家的生產者，直接展開手工藝品的貿易。這種與傳統貿易不同的另類貿易組織(Alternative
    Trading Organizations)，首度以保障生產者與他們的社群，在商品買賣中得到一個公平的價格。由於此種貿易關係成功改善與提升貧窮地區的生活水平，因此接下來數十年，這種貿易模式被複製在農產品等其他商品的供應鏈中。請判斷以下關於公平貿易的敘述，何者正確？
  options:
  - label: A
    content: 公平貿易強調以市場機制為主，不注重環境與生產者的權益
  - label: B
    content: 公平貿易的主要目的是提高跨國企業的利潤，減少生產成本
  - label: C
    content: 公平貿易旨在改善生產者的生活條件，提供更合理的價格與收入保障
  - label: D
    content: 公平貿易旨在降低非洲的產品價格，以便具有進入國際市場的競爭力
