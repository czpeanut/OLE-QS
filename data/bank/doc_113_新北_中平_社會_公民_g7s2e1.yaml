  stem: 03. IG 熱門hashtag「#OOTD」，全稱為「Outfit of the Day」，指的是當日的全身穿搭，許多人會用來記錄自己每天的打扮，也會透過此標籤來參考其他潮流人士的衣著品味，許多年輕人即藉此來參考最新的流行元素，學習穿搭外也增添對時尚的敏感度。請問上述的社會化途徑與下列哪一項相同？【素養導向】
  options:
  - label: A
    content: 小晟看同學使用環保餐具決定改變自己使用免洗筷的習慣
  - label: B
    content: 阿元平時的興趣是閱讀課外讀物與收聽教育類Podcast
  - label: C
    content: 姜姜見到親戚長輩總會記得爸爸的交代：要有禮貌的問好
  - label: D
    content: 小云前一晚熬夜打電動不小心睡過頭，被老師叫去訓話
