    \    有關行人路權團體，許多有志者是為了行人能安心使用道路的權利而選擇加入團體，其中一個團體是「還路於民行人路權促進會」，該促進會的工作人員皆以志工性質參與，成員們來自不同的背景從事於各行各業，並不屬於政府組織的一部分。該團體希望大家能更加關注交通議題，因為每一個人的生命皆為無價，如果為了交通效率和便利而損失任何人命，在道德上是無法接受的，因此期望可以做到零死亡願景以致力於優先保護道路上脆弱的用路人安全，且為了讓更多人了解、關注行人議題，於去年開始舉辦「零死亡願景散步節」的活動，邀請大眾一同來參與此活動。\n\
    －擷取自網路新聞與還路於民官網－"
