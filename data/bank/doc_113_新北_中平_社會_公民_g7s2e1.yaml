  stem: 01. 近年因我國體育賽事活絡及競賽場館普及，教育部體育署致力於推動運動場館無障礙設施的建置，希望完善的設置可以讓身心障礙者充分享受競賽觀賞的樂趣。而為了瞭解國內場館無障礙設施的現況，針對我國26
    座職業棒球、籃球賽事及排球聯賽的主要場館，進行無障礙設施的現場勘查，希望透過實地場勘來檢視並確保使用者的實際需求。根據前述，試問該作為的目的是要落實哪項公民德行？【素養導向】
