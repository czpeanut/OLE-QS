  stem: 05. 中中與平平正在討論公民課所提到的國籍取得方式與相關權益問題，可是兩人沒有認真複習因此許多內容都有錯誤，請幫他們找出正確的內容吧。
  options:
  - label: A
    content: 中中：我國國籍的取得是根據《民法》的規定
  - label: B
    content: 平平：只要是具備國籍的國民就可以享有參政權的權利
  - label: C
    content: 中中：外國人可以透過申請歸化取得我國國籍
  - label: D
    content: 平平：歸化後可享有我國賦予的權利，且不須承擔義務
