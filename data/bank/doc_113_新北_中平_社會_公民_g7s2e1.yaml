- id: doc_113_新北_中平_社會_公民_g7s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 10. 請問上文畫線處哪一個是實踐公民德行中的「遵守法律」？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
  group_stem: "◎請閱讀以下的文章，並根據內容回答第10–16 題◎【素養導向】\n    台灣的交通亂象名揚四海，更被外媒貼上「行人地獄」的標籤，為了撕除這個標籤，（甲）立法院通過的《道路交通管理處罰條例》\
    \ 34 條修正案，於 2023 年 6 月 30 日正式上路，除了加重罰鍰外，更新增了 13 項民眾檢舉違規項目，若是不停讓行人，最高可開罰 6000 元，肇事導致人受傷或死亡最高可處\
    \ 36000 罰鍰。本次修法除加重嚴重影響道路交通安全違規行為之相關罰責及保障行人安全外，修正案中將違規記點及道路交通安全講習授權子法規定，（乙）避免駕駛人經常性違規，促使其心生警惕保持良好駕駛行為，並可即時導正違規駕駛人交通安全觀念與駕駛行為，將有助不適任駕駛人退場，目的是希望可以提升所有用路人的道路交通安全。\n\
    \    然而，在交通新制上路後，由於擴大檢舉範圍與記點項目，導致規定過於嚴苛而引發計程車等職業駕駛反彈，對此交通部考量到職業駕駛團體與行人路權團體的訴求，故邀請各方代表前來參與座談會，在座談會中雙方各自表達立場與其對於法規修訂的論點，初步達成了五項共識，包含提供完善道路交通環境、完備的道路設計規範及提供道路合理臨停與停車空間等，只是（丙）原先關於罰鍰\
    \ 1200 元以下的微罪檢舉，含臨時違停、騎機車使用行動電話等，將不開放給民眾檢舉。此舉引發相關團體不滿，有人指出現行許多地方皆未劃設人行道，行人必須走到車道，若車道再放任違停，不論是行人、身心障礙者、推娃娃車的家長都會很困難，因此（丁）行人路權團體發起街頭遊行，要求立法院在取得共識前應退回來修正法案，之後再召開公聽會逐條研議。\n\
    \    有關行人路權團體，許多有志者是為了行人能安心使用道路的權利而選擇加入團體，其中一個團體是「還路於民行人路權促進會」，該促進會的工作人員皆以志工性質參與，成員們來自不同的背景從事於各行各業，並不屬於政府組織的一部分。該團體希望大家能更加關注交通議題，因為每一個人的生命皆為無價，如果為了交通效率和便利而損失任何人命，在道德上是無法接受的，因此期望可以做到零死亡願景以致力於優先保護道路上脆弱的用路人安全，且為了讓更多人了解、關注行人議題，於去年開始舉辦「零死亡願景散步節」的活動，邀請大眾一同來參與此活動。\n\
    －擷取自網路新聞與還路於民官網－"
