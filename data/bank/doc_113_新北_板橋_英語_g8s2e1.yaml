    content: "Germany stops its population from a quick falling by taking a big number\
      \ of \nforeigners. ( 外國人 )"
  - label: C
    content: "Japanese are working for more years because they enjoy working more\
      \ than \nhaving fun."
  - label: D
    content: Chinese parents can have only one child now.
  group_stem: "(二)\n    For the first time in history, the world has more grandparents\
    \ than grandchildren. There are now around 705 million people over 65, while those\
    \ aged 0-4 number about 680 milliion.  By 2050, the gap between the oldest and\
    \ the youngest will grow even greater. Japan is no stranger to the news. At the\
    \ end of 2018, the number of over-65s in Japan was 27% of its population, while\
    \ the under-five population shared only around 3.85%.  Now it already has the\
    \ highest share of people aged 65 in the world.\n    Taiwan has the same problem.\
    \ People are now living longer and not making enough babies. That means less economic\
    \ growth and more social burden.  To take care of the problem, workers in Japan\
    \ will have to work until they are 70. China already stops its one-child-birth\
    \ -planning since the 1970s and asks young parents to have two or three kids.\
    \  Germany is taking in millions of people looking for a safe home from other\
    \ countries. However, although these countries are trying hard to deal with the\
    \ problem, the world is still getting older by the minute.\ngap 差距  populatiion\
    \ 人口  economic growth 經濟成長  while 然而  aged 年齡\nsocial burden  社會負擔  although 雖然\
