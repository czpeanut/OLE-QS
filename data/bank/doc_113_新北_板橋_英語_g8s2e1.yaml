- id: doc_113_新北_板橋_英語_g8s2e1_s4_36
  section: 4
  number: 36
  type: single
  page: 4
  stem: "Nancy decided to use the Pomodoro Technique to finish her homework and history\
    \ report. \nAccording to the reading, when can he take a rest for the first time?"
  options:
  - label: A
    content: When she feels tired.
  - label: B
    content: After her timer rings.
  - label: C
    content: After she finishes her homework.
  - label: D
    content: After she finishes history report.
  group_stem: "{36-37}(一)\n    Francesco Cirillo developed the Pomodoro Technique.\
    \ It got the name from the Pomodoro timer, and people used it in the kitchen then.\
    \ Cirillo found himself more focused with the help of the timer by chance, and\
    \ now the Pomodoro Technique is widely used in the world. It helps people make\
    \ good use of their time to get things done. There are 6 steps in the Pomodoro\
    \ Technique:\n1. List the things you have to finish.\n2. Set your timer for 25\
    \ minutes.\n3. Start working.\n4. When the timers rings, whether you have finished\
    \ or not, stop and leave a mark on your list.\n5. Take a short break for 5-10\
    \ minutes.\n6. After 4 Pomodoro timers, take a longer break for about 15-30 minutes.\n\
    If you find that you can keep working for more than 25 minutes, you are free to\
    \ set for a longer time. The key is to stay fully focused when you work. Also,\
    \ make sure you don’t do anything about your work when taking a break. Things\
    \ like taking a walk or having a cup of tea are all good ideas. Just remember,\
    \ when using the Pomodoro Technique, “stay focused” both when you work and when\
    \ you rest.\n\ndevelop 發展    timer 計時器    widely 廣泛地   focused 專注的\nmanage 管理\
    \    whether…or not 是否           by chance 偶然"
