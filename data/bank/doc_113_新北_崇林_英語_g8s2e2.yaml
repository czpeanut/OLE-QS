  group_stem: 'III.

    Ken and Mary are good friends. They live and work in different countries—Ken in
    Taiwan, and Mary in Japan. Here are some facts about the good luck charms in their
    offices.


    Ken:

    Like many offices in Taiwan, ours has an interesting “Guai Guai culture,” which
    is mainly about keeping our machines, computers, and work running smoothly.

    Interestingly, “Guai Guai” is just a green bag of snacks whose name means “well-behaved.”
    Many people, like me, place one next to our computers to wish for smooth, problem-free
    work.

    At the beginning of each year, I buy a new bag of “Guai Guai,” which is important
    to me. Would you like to give it a try?


    Mary:

    In many offices or workplaces in Japan, it is common to see a “Daruma doll,” a
    red, round doll with a big face and blank eyes. Its bottom is heavy, so if it
    falls, it stands up again. This shows not giving up.

    When I have a goal, I paint one eye on the doll. Every time I see it, I tell myself
    to keep working hard. When I reach my goal, I paint the other eye, and this makes
    me feel proud. The doll shows me that I can reach my dreams.

    What do you think of our lucky dolls?


    charm 幸運物 culture 文化 smoothly 順利地 well-behaved 表現良好 goal 目標'
