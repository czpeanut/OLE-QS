    dogs in the sleeves of robes.

    Over the years, there are different kinds of dogs for different purposes. Toy
    dogs, like poodles, corgis, and pugs, are meant to be pets. Other dogs are meant
    to do some special things. The cocker spaniel and the golden retriever help people
    hunt birds. The beagle and other hounds hunt animals. The Siberian husky pull
    sleds. Sheepdogs look after farm animals. Those kinds of dogs still do their job
    till now.

    Working dogs do many other jobs today. Some smell bags in search of explosives
    or drugs to protect people from all over the world from being hurt. Others rescue
    people in dangerous places. Guide dogs help the blind walk around. Dogs are really
