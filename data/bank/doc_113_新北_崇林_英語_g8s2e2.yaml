  group_stem: 'I. Earthquake in Myanmar

    A very strong earthquake hit Myanmar on March 28, 2025. It happened early in the
    morning when many people were still sleeping. The earthquake had a magnitude of
    7.7. The center of the earthquake was in the central part of the country.

    Thousands of buildings were damaged, and many fell down. The earthquake even caused
    shaking in Thailand. In Bangkok, the largest city in Thailand, people felt the
    movement. A skyscraper that was being built at the time of the earthquake fell
    down and took the lives of at least a dozen workers.

    After the earthquake, the Myanmar government asked their people to be careful
    because there might be aftershocks. These are usually smaller earthquakes that
    happen after a big one. At the same time, they are looking for help from the world.

