- id: doc_113_台中_向上_數學_g7s1e2_s3_1
  section: 3
  number: 1
  type: calc
  page: 2
  stem: '所謂的地震規模(Magnitude)是用來描述地震大小的尺度，依地震所釋放的能量而定，以一個無單位的實數表示。

    根據地震學家古騰堡(Gutenberg)的公式，

    地震所釋放的能量$E$(單位：爾格，$erg$)，與芮氏地震規模(Richter Magnitude Scale)$M$的關係為：$E=10^{11.8+1.5M}$。

    2024年4月3日7點58分台灣發生規模7的強烈主震，之後更是發生了數百起餘震，在4月23日凌晨再度發生規模5的餘震，請問：依據關係式，主震(4/3)所釋放的能量是餘震(4/23)的多少倍？(3
    分)'
  tags:
