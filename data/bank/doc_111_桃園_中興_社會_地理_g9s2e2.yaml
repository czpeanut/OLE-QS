  group_stem: '(三)「釋迦」原產於南美洲低緯度的秘魯、厄瓜多爾等地，於17 世紀前葉西班牙殖民政權佔領菲律賓期間，由傳教士將其帶至時值明朝後期的中國，因幼果極似荔枝遂被稱為「番荔枝」。

    不過，在台灣則稱為釋迦，在約定俗成下，民眾已認為此名稱對佛陀未有不敬之意；台灣釋迦是由荷蘭人於17 世紀，從南洋群島引進台南一帶，並有專家認為釋迦之名有可能是源自當地語言的srikaya；另一更為大眾普遍採信的說法，乃是釋迦果實外形頗似佛陀頭形遂有此稱。

    因為南台灣日照充足，使釋迦得以順利生長，嗣後數百年釋迦不斷擴植於經年陽光普照的南部和台東，且歷經不斷的改良而已「本土化」為台灣水果，如今台東從南邊的太麻里到北邊的卑南、東河，都可以看到大片的釋迦園，當地果農藉由○，以掌握農業經營優勢，共同運銷並且穩定銷貨價格，不僅市場接受度高，農民收益也獲得保障。請回答下列問題(19~24
