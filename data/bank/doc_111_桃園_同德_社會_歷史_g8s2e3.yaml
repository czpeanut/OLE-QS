  group_stem: 冷戰期間，美國欲拉攏中共的新戰略思維愈來愈明顯。但基於民主陣營與共產陣營的對抗立場，破冰之期始終遙遙無期。至1971 年，雙方的接觸意外有了突破性的發展。美國桌球隊相關成員經由香港抵北京，之後中美桌球隊在北京與上海進行了友誼交流賽。後來，美國總統尼克森發表談話，宣布一連串對中共的解禁措施。翌年，中國桌球隊回訪美國，還參觀了迪士尼樂園及工業大城底特律等。中美桌球隊的交流，受到全球矚目，被媒體稱為「乒乓外交」，自此，中美日後的外交發展有了突破性的發展。中美關係解凍，也牽動我國與美國關係的變化。
