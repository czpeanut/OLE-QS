  stem: 近年來韓風來襲，說到韓國美食，很多人都會想起這道「部隊鍋」。20 世紀中期的韓國，因戰後糧食短缺，居民以美軍援助的物資，加上韓式辛辣烹調手法，進而發明「部隊鍋」這道料理。隨著時代演變，「部隊鍋」的內容雖然有所變化，但食材中總是保留三大元素：午餐肉、德式香腸、焗豆。請問，關於「部隊鍋」的由來與下列哪一場戰爭有關？
  options:
  - label: A
    content: 韓戰
  - label: B
    content: 第一次世界大戰
  - label: C
    content: 珍寶島事件
  - label: D
    content: 第二次世界大戰。
