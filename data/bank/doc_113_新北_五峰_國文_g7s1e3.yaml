  stem: 作者以轉化的筆觸描寫「竈」，呈現出濃重的情感。下列何者的寫作手法不同？
  options:
  - label: A
    content: 竈，是老祖宗們傳下來的一座最重感情的建築
  - label: B
    content: 多少歲月的流轉，多少竈前的辛勤，換來生命的成長與茁壯
  - label: C
    content: 一種屬於母親的驕傲與責任，只有竈才能詮釋、才能分享
  - label: D
    content: 而竈，仍舊是默默地承受，仍舊是一年到頭，燃著縷縷的炊煙
  group_stem: '竈，是老祖宗們傳下來的一座最重感情的建築。堆砌的紅磚頭也曾新過，只是燃了多少季的木柴、粗糠，才累積成那款出色的容顏。曾經是嗷嗷待哺的娃兒，曾經是牙牙學語的稚童，多少歲月的流轉，多少竈前的辛勤，換來生命的成長與茁壯。有娶了媳婦的，有嫁為人妻的……又是一代。做母親的閃著淚光緊緊握著披著嫁裳的女兒，不曾說什麼，只是緊緊的握著，那粗糙的雙手已經以最神聖的方式把母親心中的那座竈傳給了女兒，總有一天，女兒也會將它傳給她的女兒……一種屬於母親的驕傲與責任，只有竈才能詮釋、才能分享。那竈裡熊熊的火焰，正是母親不熄的熱愛。母親的笑、母親的淚、母親的汗水與感嘆，都曾灑在竈上。而竈，仍舊是默默地承受，仍舊是一年到頭，燃著縷縷的炊煙。於是，一座竈，沾著數不盡的母愛，從古老古老的那一代傳了下來。


    簡媜˙月娘照眠床‧竈'
