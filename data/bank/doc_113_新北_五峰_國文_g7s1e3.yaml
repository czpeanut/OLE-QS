  section: 2
  number: 28
  type: single
  page: 3
  stem: 時代進步的洪流中，許多傳統技藝逐漸式微。一群文化工作者發起懷舊市集，讓大家體驗傳統技藝的趣味，希望能延續這些技藝的生命力。下列各項技藝的簡介，何者正確？
  options:
  - label: A
    content: 紙雕：運用不同的剪貼和摺疊方法，把紙剪出各種花樣，多用作喜慶裝飾或窗花、燈花，現代也用作裝飾品
  - label: B
    content: 捏麵人：利用黃褐色糊狀的麥芽糖為材料，揉捏後用嘴吹製成戲偶、人形，或其他動物、花鳥、蔬果等造型
  - label: C
    content: 剪黏：裁剪陶瓷片、玻璃片成為需要的樣子，將這些處理過的材料黏在已有雛形的泥灰表面，做為鑲嵌建築物的裝飾
  - label: D
    content: 剪紙：利用切割、折疊、捲曲等方法，突破紙的平面性，做出各種立體造型的作品
