  stem: 兒時記趣 ：「一日，見二蟲鬥草間，觀之，興正濃，忽有龐然大物，拔山倒樹而來，蓋一癩蝦蟆也。舌一吐而二蟲盡為所吞。」   根據這段文字，下列何者解析正確
    ？
  options:
  - label: A
    content: 「見二蟲鬥草間」一句的主詞是「癩蝦蟆」
  - label: B
    content: 「盡為所吞」中的「為」讀「ㄨㄟˋ」，解釋作「因為」
  - label: C
    content: 以誇張的手法，營造癩蝦蟆驚人的氣勢
  - label: D
    content: 二蟲的爭鬥，因為作者突然出現而中止
