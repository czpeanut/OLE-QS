  type: single
  page: 1
  stem: 下列選項，何者沒有錯別字？
  options:
  - label: A
    content: 童年的記憶，像春花，也像秋草，不去想，什麼都沒有，一但思想起，便歷歷如繪。
  - label: B
    content: 大陣杖的舞龍拜年，吸引人潮聚集圍關，活龍似地奔騰盤旋，看得人熱血沸騰。
  - label: C
    content: 羅浮宮曾是法國的皇宮，建築氣派儼然，而今已成為典藏四十萬件藝術品、享譽全球的博物館。
  - label: D
    content: 國內大學廣設電資系所，為企業培育人才。科技產業的發展趨勢，對高等教育的影響可見一般。
