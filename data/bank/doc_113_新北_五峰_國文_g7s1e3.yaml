  stem: '「一隻驢子爬到屋頂上跳舞，踩碎了屋瓦；主人到屋頂上去，將牠趕了下來，並用木棒痛打牠。驢子說：『為什麼昨天猴子也這樣玩的時候，你們都很高興地笑著，好像猴子跳舞能帶給你們很大的快樂呢？』」

