  section: 1
  number: 17
  type: single
  page: 2
  stem: 下列關於兒時記趣文中字句的賞析，何者錯誤 ？
  options:
  - label: A
    content: 「余憶童稚時，能張目對日，明察秋毫。」是作者自述目力甚佳，且能細心觀察生活周遭的事物
  - label: B
    content: 先以「時有物外之趣」揭示全文旨趣，再逐段一一示現
  - label: C
    content: 「夏蚊成雷，私擬作群鶴舞空，心之所向，則或千或百，果然鶴也。」善用借代、誇飾，展現作者敏銳的觀察力
  - label: D
    content: 「神定，捉蝦蟆，鞭數十，驅之別院。」表現作者充滿同情心和正義感的赤子童心
  lesson_raw:
    title: 兒時記趣
    basis: 題幹標註「兒時記趣」
