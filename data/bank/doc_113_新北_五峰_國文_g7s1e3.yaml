  stem: 關於本文，下列何者分析不正確？
  options:
  - label: A
    content: 文中的三個「之」，依序指「李子」、「王戎」、「諸兒」
  - label: B
    content: 王戎與諸小兒在本文中的行為表現，形成鮮明的對比
  - label: C
    content: 故事啟示我們要三思而行，才不會徒勞無功自食苦果
  - label: D
    content: 王戎具備不盲目從眾、人云亦云，能獨立思考的精神
  group_stem: '王戎七歲，嘗與諸小兒遊。

    看道邊李樹多子折枝，諸兒競走取之，唯戎不動。

    人問之，答曰：「樹在道邊而多子，此必苦李。」取之，信然。


    世說新語‧雅量第六


    注釋：

    （1）多子折枝：子，果實；折枝，壓彎樹枝

    （2）競走：爭相奔跑

    （3）信然：果真如此'
