  section: 1
  number: 18
  type: single
  page: 2
  stem: 紙船印象：「只盼望自己能以母親的心情，為子女摺出一艘艘未必漂亮但卻堅強的、禁得住風雨的船，如此，便不致愧對紙船了。」  關於這段文字的說明，下列何者錯誤？
  options:
  - label: A
    content: 作者期許自己繼承母志，薪火相傳，把愛心施給下一代
  - label: B
    content: 風雨象徵困難，作者盼望能養成子女勇於面對考驗的精神
  - label: C
    content: 作者期勉自己「不愧對紙船」，意指不愧對母親的慈愛
  - label: D
    content: 紙船象徵母愛，藉憶述紙船印象感念親恩，闡述孝道的真諦
  lesson_raw:
    title: 紙船印象
    basis: 題幹標註「紙船印象」並引用課文
