  stem: 下列選項皆運用了與「雨」有關、帶有「然」字的成語，何者措辭不當？
  options:
  - label: A
    content: 古時大禹治水，「櫛風沐雨」，三過家門而不入，大公無私的精神令人「肅然起敬」。
  - label: B
    content: 近幾年晶片需求暢旺，新興工業園區的高科技廠房如「雨後春筍」般「井然有序」地拔地而起。
  - label: C
    content: 這件醜聞鬧得「滿城風雨」，引起「軒然大波」和群起撻伐，當事人恐怕難以收拾。
  - label: D
    content: 跨年時，世界各大都會的煙火秀陸續登場，「煙雨濛濛」的燦爛景象令人「茫然若失」。
