  stem: '美國總統林肯少年時曾在農場工作，見到習於安逸的馬兒被馬蠅叮咬後縱步奔馳，他當下領悟到：「再懶惰的馬，只要身上有馬蠅叮咬，它也會精神抖擻，飛快奔跑。」

