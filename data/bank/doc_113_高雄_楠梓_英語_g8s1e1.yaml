  group_stem: 'Good morning, everyone. This is Jill. Now, it’s time to see the weather
    reports from different places:


    | City | 10/11 Fri. | 10/12 Sat. | 10/13 Sun. | 10/14 Mon. |

    |---|---|---|---|---|

    | Pingtung | rainy | cloudy | cloudy | cloudy |

    | Hualien | cloudy | rainy | rainy | cloudy |

    | Kaohsiung | sunny | sunny | sunny | cloudy |

    | Taitung | cloudy | rainy | rainy | cloudy |


    Pingtung

    Although the typhoon is far away from us, we may still be hit by strong winds
    and heavy rain. Saturday and Sunday may be cloudy, and temperatures may go down.

    Hualien

    The typhoon may move near us on Saturday, but don''t worry. We are out of its
    big winds. The typhoon does not move directly over us. We tell everyone to be
    careful and not to go to the beach because the waves may be quite large and dangerous.

    Kaohsiung

    The typhoon may not be moving near us. Both Saturday and Sunday may be sunny and
    beautiful. However, there is a small chance that the typhoon could turn in our
    direction on Monday. Keep watching our weather reports.

    Taitung

    We will be safe especially strong winds and heavy rain when the typhoon moves
    directly over the city. When the typhoon is here, be sure to stay inside. Just
    prepare for the storm, be sure to get water and food at home.


    📖 hit 襲擊; temperature 溫度; directly 直接地; storm 暴風雨; direction 方向; especially 特別地'
