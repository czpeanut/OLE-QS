  group_stem: 'It’s always fun to see a beautiful hot air balloon in the sky—and when
    there are hundreds! In October every year, during fall time, there is a Balloon
    Day in Albuquerque, New Mexico. About 600 balloons are up in the sky at the same
    time. And many of them look like animals.

    How do hot air balloons fly in the sky? To begin with, the pilot lights gas to
    make a small fire. This heats up the air inside the balloon. Hot air always lets
    the balloon fly up slowly into the air. Then, when the balloon flys high, the
    pilot just adds more gas to go higher.

    When it’s time to land, the pilot needs a little help. To do this, there is a
    group of people on the ground called the “chase team.” Their job is to follow
    the balloons. While following the balloons in a truck, they are talking to the
    pilot on a radio. The pilot looks for a safe place to land and tells the chase
    team where to find the balloons. After that, the chase team finds the balloons
    and takes them back home!


