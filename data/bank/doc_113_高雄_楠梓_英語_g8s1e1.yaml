  group_stem: 'Joe：What do you do after the basketball club? Today, I feel sick, so
    I can’t have dinner with you.

    Lily：You don’t look good. What happened?

    Joe：I didn’t do well on the math test this morning. Doing math is really killing
    me. And, I am tired right now.

    Lily：Math isn’t hard. When you have some problems about math, you can ask me.
    I will help you.

    Joe：Thanks. In fact, I didn’t prepare for the math test last night.

    Lily：Why didn’t you prepare for it?

    Joe：I “got hooked on” video games and played them every night. Free Fire is so
    cool.

    Lily：But, video gams aren’t good for you. Why didn’t your parents stop you from
    playing video games last week?

    Joe：Well, they were out of town. They took a one-week trip to the USA.

    Lily：I see.

    Joe：Achoo! Achoo! Achoo!

    Lily：Are you OK?

    Joe：I caught a cold because I didn’t wear enough clothes last night when I slept.

    Lily：You have to see a doctor now.

    Joe：Don’t worry. I have some medicine with me. I take it after breakfast.

    Lily：Please take good care of yourself. And bring the good luck for your family,
    too.

    Joe：Thank you so much.'
