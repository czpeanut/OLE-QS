  stem: 「『鳳梨酥』之所以會如此命名，與使用的食材沒有直接關係，而是為了讓這個佳節送禮首選能有個福氣的意涵。事實上最傳統的鳳梨酥內餡並沒有包鳳梨，而鳳梨的閩南語念起來是『旺來』，有好運旺旺來、子孫旺旺來的吉祥意味，因此才將它取名為『鳳梨酥』。而我們在傳統鳳梨酥中吃到甜而不膩的內餡，其實是冬瓜製成的冬瓜醬。臺灣農民在主要農作物休耕期間會種植冬瓜作為輪作農作物，使得冬瓜這個臺灣盛產的蔬菜，以容易取得、高產量與價格便宜的特色，成為傳統甜品中常見的食品原料。」依據上文所述，鳳梨酥的命名原因為何？
