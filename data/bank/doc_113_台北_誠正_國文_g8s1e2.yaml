  stem: 相傳古代號稱望帝的蜀王杜宇失國後，精魂化為杜鵑鳥，苦啼不止，滴血不止，染紅杜鵑花。杜鵑鳥聲聲喚的都是「不如歸去」，古代文人特別喜歡把杜鵑鳥作為思鄉之情的寄託。下列詩詞中，何者未帶有此種思鄉情懷？
  options:
  - label: A
    content: 蜀國曾聞子規鳥，宣城還見杜鵑花。一叫一回腸一斷，三春三月憶三巴
  - label: B
    content: 住近湓江地低濕，黄蘆苦竹繞宅生。其間旦暮聞何物？杜鵑啼血猿哀鳴
  - label: C
    content: 杜鵑花時夭艷然，所恨帝城人不識。丁寧莫遣春風吹，留與佳人比顏色
  - label: D
    content: 霧失樓台，月迷津渡。桃源望斷無尋處。可堪孤館閉春寒，杜鵑聲裡斜陽暮
