  section: 1
  number: 15
  type: single
  page: 2
  stem: 關於愛蓮說一文的分析，何者正確？
  options:
  - label: A
    content: 以「蓮花」象徵兼善天下、有道德理想的君子，寫君子莊重正直的品德修養
  - label: B
    content: 用「牡丹」象徵世上追求富貴、貪名逐利之人，來反襯「蓮花」的平易近人
  - label: C
    content: 用「菊花」象徵獨善其身、潔身自愛的隱居者，來陪襯「蓮花」的高不可攀
  - label: D
    content: 先泛論眾花，再分別描述三種花的特質，最後抒懷，發出嚴厲的抨擊與批判
