  stem: 有關愛蓮說一文的分析，何者有誤？
  options:
  - label: A
    content: 「說」亦稱雜說，是用來解析事理、闡述己意的文體，與「論」合稱為「論說文」
  - label: B
    content: 本文是一篇「藉物託志」的詠物作品，作者藉蓮來言志抒懷，立意深刻，發人省思
  - label: C
    content: 表面上寫蓮，其實是寫君子。除藉蓮來象徵君子的美德外，更進一步寄託作者的胸懷
  - label: D
    content: 以花代表三種不同的人格典型，運用對比、映襯的技巧，烘托出蓮的高潔、孤芳自賞
