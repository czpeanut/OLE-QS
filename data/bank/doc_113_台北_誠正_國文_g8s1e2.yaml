    content: 真正有能力的人，不怕和合作的伙伴一起變好，沒能力的人才會一味地去貶低他人，以為自己比較好
  - label: B
    content: 真正厲害的人，不再看別人的臉色，不是每個人都值得你的在乎，對不喜歡的人勇敢的說不，走出自己的風格
  - label: C
    content: 工作能力強的人，通常都具備強大的溝通與協調能力。他們懂得在關鍵時刻退一步，創造雙贏的價值
  - label: D
    content: 成功的人士大多很自律，自律說的正是讓自己的想法決定你的行為，你必須要有原則，而不是總是隨人搖擺
  group_stem: '「天下武功，唯○不破：川普政治學」

    美國總統大選落幕，川普大獲全勝，臺灣的焦點都在川普上任後會對臺灣如何？這個問題有待慢慢往下看。我對這次川普勝選的兩個造勢非常嘆服，也印證了上一次川普勝選後，我曾經提出一個觀點：「天下武功，唯○不破」！這次川普的力道比上次更強！

    昨天川普向麥當勞遞「辭呈」，說他要去白宮上班了！大家都記得，10 月20 日賀錦麗在競選造勢中說：「川普天生好命，沒有在麥當勞上過一天班！」川普二話不說，馬上到麥當勞去炸薯條，在得來速窗口送餐。川普穿起麥當勞圍兜兜，立即拉近和選民的距離，對他的選戰大大加分。

    到了10 月30 日，拜登在助選中批評支持川普的選民都是垃圾，川普居然在第一時間跑去開垃圾車，川普還帶諷刺地說：「你覺得我開垃圾車怎麼樣？這輛車是為了紀念卡馬拉和拜登！」

    一個78 歲的老人，反應如此快速，靈活，這樣的政治人物並不多見。其實，在賀錦麗和川普辯論後，賀錦麗民調仍領先，但10 月的電視專訪，賀錦麗言而無物，內容太空洞，立刻被川普比下去。

    川普的直球對決更是令人驚嘆，像泰勒絲公開支持賀錦麗後，川普立刻發文：「I hate Taylor Swift！」川普毫不掩飾他的好惡。

    川普當選了，立刻展現力量與霸氣，這個特質完全把「讓美國再偉大」的氣勢凸顯出來！他的靈活應變，完全呈現速度感，也把領袖魅力發揮到極致。這場選戰的川普政治學，對全世界的政治人物都有很大的啓發效果。

    ──謝金河2024年11月10日'
