- id: doc_113_台北_誠正_國文_g8s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 「『逍遙』是領悟自己可以成為你嚮往的自己，嚮往了幾億年，水中游動的鰭鬣就能變成空中搧動的翅翼。『逍遙』也是心靈的自由，不被客觀現實綑綁，不被成見拘束，你想從魚變鳥，你想飛，你就成就了『逍遙』。從逍遙遊裡，我們也許能讀出一個答案，那是：『回來做自己』。」（蔣勳
    莊子，你好：逍遙遊）關於這段話，下列敘述何者正確？
  options:
  - label: A
    content: 莊子所謂的「逍遙」可定義為心靈自由，擺脫束縛
  - label: B
    content: 若我們能從魚變鳥，若我們能飛，即成就了「逍遙」
  - label: C
    content: 「逍遙」能使水中游動的鰭鬣變成空中搧動的翅翼
  - label: D
    content: 從逍遙遊裡我們一定能讀出「回來做自己」這個答案
