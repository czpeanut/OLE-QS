  page: 5
  stem: 依據文中秦失的經歷與反應，下列何者正確？
  options:
  - label: A
    content: 面對老子去世➔看到人們哭泣➔體悟到順應自然的真理
  - label: B
    content: 看到人們哭泣➔面對老子去世➔體悟到順應自然的真理
  - label: C
    content: 體悟到順應自然的真理➔看到人們哭泣➔面對老子去世
  - label: D
    content: 體悟到順應自然的真理➔面對老子去世➔看到人們哭泣
  group_stem: '老聃①死，秦失②弔③之，三號④而出。弟子曰：「非夫子之友邪？」曰：「然。」「然則弔焉若此可乎？」曰：「然。始也吾以為⑤其人也，而今非也。向⑥吾入而弔焉，有老者哭之，如哭其子；少者哭之，如哭其母。彼其所以會之⑦，必有不蘄言⑧而言，不蘄哭而哭者，是遁天倍情⑨，忘其所受，古者謂之遁天之刑⑩。適⑪來，夫子時也；適去，夫子順也。安時而處順，哀樂不能入也。」

    ──摘錄自 莊子．養生主


    註釋

    ① 老聃：人名，即道家創始人老子，姓李名耳，字聃。

    ② 秦失：人名，一作秦佚。

    ③ 弔：弔喪，即至喪家祭奠死者。

    ④ 號：ㄏㄠˊ，呼號、哭叫。

    ⑤ 以為：用為、用作。此指秦失最初為了老聃其「人」離去而呼號，但後來明白到其精神仍可一直「薪火相傳」之理，故三號即止。

    ⑥ 向：剛才。

    ⑦ 會之：聚集。之，代詞，代指老聃的死。

    ⑧ 蘄言：蘄，通「祈」，希望。言，通作「唁」，指對喪者親屬的慰問。

    ⑨ 遁天倍情：違背天性與真情。

    ⑩ 遁天之刑：指違背了自然的原來模樣。刑，通作「型」，模範，樣式。

    ⑪ 適：正當，正值。'
