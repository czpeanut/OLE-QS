- id: doc_113_台北_誠正_國文_g8s1e2_s2_35
  section: 2
  number: 35
  type: single
  page: 4
  stem: 根據本文所述，臺灣青少年渴望贏得認可的原因為何？
  options:
  - label: A
    content: 在班上利用炫耀物質消費而來爭取社交地位
  - label: B
    content: 上課無法專心，個性衝動易怒，常常干擾課程的進行
  - label: C
    content: 父母給予真切溫暖的關心，而非以購物取代
  - label: D
    content: 青少年兒童時未能從其父母身上得到必要的情感關注
  group_stem: '山道猴子的一生：獻給禿鷹的贖金（摘錄）

    盧郁佳

    山道猴子的一生在臺灣迅速竄紅，故事主軸大致上描繪一名便利超商夜班男子購買超出能力所及的重機、遭第一任女友劈腿、不信任第二任女友，最終導致悲慘的結局。

    在臺灣，許多父母在外地大城市上班，將兒女交給祖父母照顧，以年節團聚買禮物給兒女，代替日常關愛。兒女學到購物就是愛自己，在班上用炫耀物質消費來爭取社交地位。許多孩子未能從身邊大人身上獲取必要的情感關注，導致認知發展連帶受損。青少年因此在學校無法專心，衝動易怒、干擾大家上課，功課不好、在團體中被邊緣化，渴望贏得別人關注認可。

    而一般人大致認為「衝動性消費」的揮霍導致貧窮，例如窮人竟敢花錢吃龍蝦。其實貧窮無所不在的身心壓力，嚴重侵蝕了窮人正常應付工作生活所需的情緒資源。正是這種壓力，使龍蝦從窮人無關痛癢的想要，變成急迫需要，而重機就是山道猴子飢渴的龍蝦。剝奪了不能沒有的自尊，導致只能從自毀的揮霍中重金贖回。

    消費性債務，就是山道猴子自尊的贖金。


    註：山道猴子的一生是由臺灣創作者Eric Duan 在網路影音平台發表的長篇網路影片系列，劇情講述一名超商上班的年輕人，因虛榮心膨脹而在感情中迷失自我，最後眾叛親離並在山道飆車意外身亡的故事。'
