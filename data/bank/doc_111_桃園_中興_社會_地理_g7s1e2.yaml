  group_stem: ◎1621 年，一艘荷蘭商船「金獅號」從爪哇島的巴達維亞（今印尼雅加達）揚帆出發，目的地是澎湖。航行至中途，金獅號決定在一座珊瑚礁島嶼附近下錨，打算在此補給淡水。然而，上島的船員卻消失在熱帶叢林裡。原來，這座島並非無人島。荷蘭人後來才發現，島上住著一群原住民，稱自己的家園叫「拉美（Lamey）」。
    島上居民皮膚黝黑，依靠捕魚跟採椰子過活，金獅號的水手，就是死於他們之手。1633 年荷蘭人派兵征伐拉美島，在攻擊行動中，原住民被迫逃入洞中。1636 年荷蘭人聯合平埔族，找到島民躲避的洞穴，塞住所有的洞口，用煙和硫磺逼出島民。三日之後，陸續有人爬出洞，分批被俘虜到大員（今臺南安平），共有323
