- id: doc_113_台南_復興_國文_g9s2e2_s2_40
  section: 2
  number: 40
  type: single
  page: 12
  stem: 下列各句所省略的主語，何者說明錯誤？
  options:
  - label: A
    content: 延坐書屋：曹某
  - label: B
    content: 倏然滅：鬼怪
  - label: C
    content: 及歸途再宿：曹某
  - label: D
    content: 甫露其首：鬼怪。
  group_stem: '曹司農竹虛言：「其族兄自歙往揚州，途經友人家，時盛夏，延①坐書屋，甚軒爽②。暮欲下榻其中，友人曰：『是有魅，夜不可居。』曹強居之。夜半，有物自門隙蠕蠕入，薄如夾紙，入室後，漸展開作人形，乃女子也。曹殊不畏，忽披髮吐舌作縊鬼狀，曹笑曰：『猶是髮，但稍亂；猶是舌，但稍長，亦何足畏？』忽自摘其首置案上，曹又笑曰：『有首尚不足畏，況無首耶！』鬼技窮，倏然滅。及歸途再宿，夜半門隙又蠕動，甫露其首，輒唾曰：『又此敗興物耶？』竟不入。」此與嵇中散③事相類。夫虎不食醉人，不知畏也。大抵畏則心亂，心亂則神渙，神渙則鬼得乘之；不畏則心定，心定則神全，神全則殄戾④之氣不能干。故記中散是事者，稱神志湛然⑤，鬼慚而去。

    （紀昀《閱微草堂筆記》）

    【注釋】：

    ① 延：邀請。

    ② 軒爽：高闊涼爽。

    ③ 嵇中散：即嵇康，官至中散大夫。傳聞嵇康曾於深夜彈琴，來了一隻鬼在燈下作怪，嵇康注視許久後，淡然地吹熄了燈，說：「君子光明正大，恥與鬼魅同處光域之中。」

    ④ 殄戾：音ㄊㄧㄢˇ ㄌㄧˋ，因氣不和而生之災害。引申為妖邪或瘟疫。

    ⑤ 湛然：安然清高的樣子。'
