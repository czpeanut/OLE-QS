- id: doc_113_台南_復興_國文_g9s2e2_s2_39
  section: 2
  number: 39
  type: single
  page: 12
  stem: 關於文中人物對獻馬的看法，敘述最適當的是：
  options:
  - label: A
    content: 芮季和榮夷公相同，都想從芮伯那裡獲得一匹良馬
  - label: B
    content: 榮夷公和君子相同，都認為芮伯隱藏了其他的良馬
  - label: C
    content: 榮夷公和周厲王相同，都認為芮伯不應只獻一匹馬
  - label: D
    content: 芮季和君子相同，都認為芮伯之舉使王想得到更多。
  group_stem: '周厲王使芮伯帥師伐戎，得良馬焉，將以獻於王。芮季曰：「不如捐之。王欲無厭，而多信人之言。今以師歸而獻馬焉，王之左右必以子獲為不止一馬，而皆求於子。子無以應之，則將嘵於王，王必信之。是賈禍也。」弗聽，卒獻之。榮夷公果使有求焉，弗得，遂譖諸王曰：「伯也隱。」王怒逐芮伯。君子謂芮伯亦有罪焉。爾知王之瀆貨而啟之，芮伯之罪也。

    （劉基《郁離子・獻馬》）'
