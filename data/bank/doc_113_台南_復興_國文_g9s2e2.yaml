  stem: '以下為文化內容IP 發展方式的整理，請根據本文，選出適合填入①、②、③的選項：

    | IP 類型 | 發展策略 | 技術應用 | 主要目標 |

    | :--- | :--- | :--- | :--- |

    | 三麗鷗 | ( ① ) | XR、Web3、VTuber | 擴展角色影響力，提高互動性 |

    | 梵谷IP | 跨域合作，沉浸式體驗 | ( ② ) | 讓觀眾深入藝術與畫家故事 |

    | 臺灣原創IP | ( ③ ) | VR、Vtuber、AI | 增強沉浸感，打進國際市場 |'
  options:
  - label: A
    content: ①授權周邊商品與數位娛樂 ②VR、AI、沉浸投影 ③改編成影視動畫，帶動流行現象
  - label: B
    content: ①發展遊樂園與演唱會 ②Web3、NFT ③只專注於漫畫與小說創作
  - label: C
    content: ①主要透過傳統商品銷售 ②3D 列印技術 ③透過社群行銷提升影響力
