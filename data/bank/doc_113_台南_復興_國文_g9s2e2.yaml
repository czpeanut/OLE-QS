- id: doc_113_台南_復興_國文_g9s2e2_s2_35
  section: 2
  number: 35
  type: single
  page: 11
  stem: 鄭燮在〈寄弟墨書〉中提及：「愚兄平生最重農夫。新招佃地人，必須待之以禮。彼稱我為主人，我稱彼為客戶；主客原是對待之義，我何貴而彼何賤乎？」其觀點與下列何者較為接近？
  options:
  - label: A
    content: 以道觀之，物無貴賤
  - label: B
    content: 以物觀之，自貴而相賤
  - label: C
    content: 自細視大者不盡
  - label: D
    content: 自大視細者不明。
  group_stem: '萬物與世人，不僅有大小、長短、輕重之分，更從中衍生出貴賤、優劣、善惡之別。後一類的差別觀屬於價值判斷，會讓人產生更大的情緒反應，甚至左右人生的方向。莊子希望大家不要再受到這一類價值差別觀的愚弄，他提醒我們：從道來看，萬物本沒有貴賤的分別；從物來看，則各自以為貴而互相賤視；從流俗來看，貴賤都由外來而不在事物自身。①

    貴賤、優劣、善惡並沒有像公尺、公斤這種客觀的衡量標準，不僅有相當的主觀性，而且一個人覺得「貴」的，很可能被另一人認為「賤」；它們並非物與人的本質，而是人們強行附加上去的。心理學家威爾森做過一個有趣的實驗：他向三組大學生介紹一位老師，分別賦與講師、副教授、教授的頭銜，然後要學生估量該師的身高。結果，該師的地位每上升一級，被估量的身高就多出約二公分。這顯示在多數人的認知裡，高矮與優劣有一種虛幻的聯結。認知雖是虛幻的，但卻會產生實質的影響，幾年前，普林斯頓大學的一項研究指出，無論男女，個子每高四英寸（十公分），平均收入就會增加
    10%。

    高個子真的比較優秀嗎？沒有人知道，但矮子倒是經常受人嘲弄。美國知名作家奧利佛・霍爾姆斯身材矮小，某日去參加一個會議，與會者個個身材高大，有位仁兄揶揄說：「霍爾姆斯博士，在這些大個子中，你一定覺得自己很渺小吧！」霍爾姆斯回答：「沒錯，我覺得自己就好像混在一大堆銅幣中的一枚小銀幣。」相信很多人都會給予霍爾姆斯喝采，認為他以「反將一軍」的手法在破除對方的迷障。但莊子可能無法苟同，因為把高個子說成不值錢的銅幣，同樣是在貶低對方。莊子希望大家不要「各自以為貴而互相賤視」，他奉勸我們能從「相對論」進入「齊物論」：從小的角度去看大，看不到全面；從大的角度去看小，會看不分明。大小各有各的合宜之處，這才是事物固有的態勢。②

    所謂__________，每個人、每樣東西都各有長處，也各有短處，各有存在的道理和價值。「萬物一齊，孰短孰長？」宇宙萬物本是渾同齊一的，分什麼長短、大小？說什麼優劣、貴賤呢？所以，我們要養成一種好習慣：在看待他人及周遭事物時，不要先將他們貼上優劣、貴賤的標籤，在反觀自身時，不可為自己的大或高而驕傲，更不必對自己的小或低而自卑，一切「等價齊觀」，那你不僅會豁達許多，而且也能慈悲許多。

    （王溢嘉〈萬物一齊：撕掉優劣貴賤的標籤〉）

    【注釋】：

    ① 以道觀之，物無貴賤；以物觀之，自貴而相賤；以俗觀之，貴賤不在己。

    ② 夫自細視大者不盡，自大視細者不明。故異便，此勢之有也。'
