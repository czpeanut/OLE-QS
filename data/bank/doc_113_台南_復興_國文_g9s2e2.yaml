- id: doc_113_台南_復興_國文_g9s2e2_s2_27
  section: 2
  number: 27
  type: single
  page: 7
  stem: 下列有關郵局代收貨款服務說明的敘述，何者正確？
  options:
  - label: A
    content: 只要於郵局開立郵政劃撥或存簿儲金帳戶者均可使用此服務
  - label: B
    content: 上門收件的服務僅提供給特約用戶，一般戶只能至郵局寄件
  - label: C
    content: 「代收貨款郵件託運單」上須寫收件者的存簿儲金帳戶及戶名
  - label: D
    content: 經此服務寄送的國內包裹、便利箱（袋）均可於24 小時內送達。
  group_stem: "★郵局代收貨款服務說明\n一、服務特色\n| 1、手續簡便，免申請、免簽約 | 服務對象不限企業用戶，凡於郵局開立郵政劃撥或存簿儲金帳戶者均可直接使用本服務。\
    \ |\n| 2、多項遞送服務可供搭配選擇 | 郵局之國內包裹、便利箱（袋）、國內快捷及小包掛號函件等均提供本項服務。 |\n| 3、交寄便利 | 全國郵局均提供本項服務。\
    \ |\n| 4、提供您一站購足之完整服務 | ■郵局「代收貨款」服務結合郵局安全便捷的物流、金流系統，提供您從「窗口收寄／上門收件／物流倉儲中心出貨」$\t\
    o$「遞送」$\to$「貨款收取」$\to$「貨款至遲於次一營業日入帳」之完整「貨到付款」服務。<br>■特約戶：提供上門收件。<br>一般戶：由各郵局視人手、車輛及業務需要，就當次交寄件數、當次交寄郵資等自行訂定一般用戶上門收件標準、收件時間及收件地區範圍並公告周知。\
    \ |\n| 5、郵局收到貨款入帳迅速 | 本服務於郵件妥投後，收到之款項將以最快速度迅速匯入您的帳戶（例假日及偏遠地區順延），安全有保障。 |\n\n二、服務流程\n\
    | 1、先選擇配送郵件種類 | 郵局提供國內包裹、便利箱（袋）、國內快捷或小包掛號函件服務。 |\n| 2、按件填寫「代收貨款郵件託運單」或「詳情單（大宗戶使用）」\
    \ | 於上開單據註明該郵件之內容物名稱、價值、寄件人本人之劃撥儲金或存簿儲金帳戶及戶名。 |\n| 3、全國送透透 | 代收貨款之郵件將經由郵局之遞送系統送至全國各地。（國外暫不提供本項服務）\
    \ |\n| 4、收件人付款前先確認 | 物品送達時，收件人應先確認託運單所書之內裝物品名稱，係其訂購之商品無誤後再付款，郵差收取貨款後，將郵件妥交收件人。\
    \ |\n| 5、貨款匯入 | 目前有2 種代收貨款入帳方式可供選擇：<br>A. 撥存於寄件人之劃撥儲金帳戶。（免再扣收匯費）<br>B. 撥存於寄件人之存簿儲金帳戶。（免再扣收匯費）\
    \ |\n\n★郵局「代收貨款服務」應加收之資費\n代收貨款金額最高為新臺幣50,000 元。\n收件人交付貨款前應先確認有否訂購再付款領取郵件；領取後應立即拆開檢視，如內件不符，而貨款尚在郵局者，可向郵局要求退還貨款，而郵件由收件人在郵局人員會同下，郵寄退還寄件人。但貨款已匯出者，請收件人主動與寄件人洽辦。\n\
    本項代收貨款資費內含報值費及匯款匯費，未妥投退回時，僅退50%代收貨款資費。\n郵件無法投遞時退回資費之收取，按其郵件種類規定辦理。"
