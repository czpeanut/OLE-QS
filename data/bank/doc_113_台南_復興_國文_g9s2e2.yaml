  section: 2
  number: 38
  type: single
  page: 11
  stem: 根據文章內容，為何君子認為芮伯也有過錯？
  options:
  - label: A
    content: 他帶兵攻打戎族，私藏許多戎族進獻的馬，未獻給周厲王
  - label: B
    content: 他因驕貪而賈禍，無法勝任帥師之職，兵馬皆為敵人所擒
  - label: C
    content: 他明知周厲王貪婪，卻仍然進獻良馬，導致自己遭受誣陷
  - label: D
    content: 他與榮夷公勾結，暗中向周厲王進言，揭發諸王隱匿之事。
  group_stem: '周厲王使芮伯帥師伐戎，得良馬焉，將以獻於王。芮季曰：「不如捐之。王欲無厭，而多信人之言。今以師歸而獻馬焉，王之左右必以子獲為不止一馬，而皆求於子。子無以應之，則將嘵於王，王必信之。是賈禍也。」弗聽，卒獻之。榮夷公果使有求焉，弗得，遂譖諸王曰：「伯也隱。」王怒逐芮伯。君子謂芮伯亦有罪焉。爾知王之瀆貨而啟之，芮伯之罪也。

    （劉基《郁離子・獻馬》）'
