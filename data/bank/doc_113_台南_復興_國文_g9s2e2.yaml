    content: ①縮小IP 經營範圍，維持品牌獨特性 ②純粹依靠實體展覽 ③限制數位化發展，以保留文化原貌。
  group_stem: '智慧財產權（IP）在文化創意產業中，代表的是具有市場價值潛力的文化內容。這些文化內容IP 一般會有特定的消費目標受眾或粉絲群，隨著時代的發展及科技的演變，為了擴大成果效益並將產值最大化，許多IP
    需要進行轉譯與跨域發展。通過將原本的內容延伸或改編成其他形式，IP 能夠觸及更多的消費族群，並延續世代的影響力。

    優秀的文化內容IP 不僅能傳遞品牌價值，還能提供更多異業合作、開發周邊商品的機會，並開創更多商業發展的可能性。無論是流行文化還是經典藝術，跨域經營已成為文化產業重要的商業模式。以日本的三麗鷗公司為例，該公司推出了多個經典IP，如Hello
    Kitty、美樂蒂、布丁狗等，並積極發展IP 授權業務，提升公司獲利。近年來，三麗鷗突破傳統的IP 管理模式，成立了XR 和Web3部門，並開發虛擬遊樂園，與VRChat
    合作，將主題樂園的魅力延伸至虛擬空間。此外，三麗鷗成功舉辦了三次虛擬盛典，並提供遊行、演唱會、VTuber、VSinger 等多樣化內容，讓觀眾能夠在虛擬世界中即時互動。

