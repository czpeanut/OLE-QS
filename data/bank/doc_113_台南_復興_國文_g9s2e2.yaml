  type: single
  page: 4
  stem: '大多數機場的指標都使用黑體字，因為它給人乾淨簡潔的現代感。若使用新細明體，由於筆畫很細，一段距離外就不易閱讀，甚至連發現它都有困難。新細明體的橫筆設計得偏細，不適合使用在距離讀者較遠的指標上。而黑體橫筆夠粗，就有良好的「易視性」。新細明體在80
    年代曾是新潮設計，但時過境遷，難免審美疲乏，是想改變中文字型設計現狀者要革新的對象。高解析度螢幕時代，它更難以勝任螢幕上的閱讀。但只要它是系統內建的首要字型，就會是大多數人的首選。如此一來，文字風景的基本面一時難有什麼變化。

    根據本文內容，造成「文字風景難有變化」的主要原因是什麼？'
