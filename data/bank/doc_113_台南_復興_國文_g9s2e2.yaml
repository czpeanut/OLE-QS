    年宣布將進軍日本市場，成為翔英融創公司「日照計畫」首波動畫化作品之一。漫畫的主角「克蘇」還運用了2D、3D 及AI 技術，並以Vtuber 形式在展區現身，與觀眾進行即時互動。

    由此可見，文化內容與科技技術的結合，已成為臺灣IP 跨域發展的重要選擇。利用VR 或Vtuber等技術，觀眾不再是單純的旁觀者，而能夠身臨其境，從主觀視角深入情境中，增強沉浸感與情感連結，並為IP
