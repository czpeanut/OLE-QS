- id: doc_113_台南_復興_國文_g9s2e2_s1_16
  section: 1
  number: 16
  type: single
  page: 3
  stem: '以工作為中心的生活，讓我們漸漸以工作「產能」定義自己的價值，西蒙・史托佐夫就指出「在一個推崇副業和職涯發展的文化中，有種感覺，你如果不進步，就會落後」然而將自己全然投入於工作中，事實上也是高風險行為，一旦工作有個風吹草動，你對自己的定義可能隨時瓦解。而不問結果、不追求更好的「玩樂體驗」能讓我們的身心都更加平衡健康，不要再老為「沒做正事」感到罪惡，我們需要創造自己工作之外的更多定義。

    這段文字的觀點與下列何者相去最遠？'
  options:
  - label: A
    content: 人們應該學習從工作以外的面向重新定義自己
  - label: B
    content: 工作若能結合玩樂與成長，對長遠發展有幫助
  - label: C
    content: 適度的玩樂有助身心平衡，減少對工作的過度依賴
  - label: D
    content: 過度專注於追求卓越，可能將陷入自我認同的焦慮。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
