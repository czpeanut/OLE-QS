- id: doc_113_台南_復興_國文_g9s2e2_s2_33
  section: 2
  number: 33
  type: single
  page: 10
  stem: 關於本文內容的說明，下列敘述何者正確？
  options:
  - label: A
    content: 根據研究顯示，有超過50%的小學生在該睡覺的時間還在使用手機
  - label: B
    content: 夜間使用手機的頻率在青春期早期達到尖峰，尤其是以男孩更明顯
  - label: C
    content: 沒有遭受過網路霸凌的參與者，在晚上會使用手機的比率不到50%
  - label: D
    content: 會暴露在網路霸凌的風險，是因為發布訊息後就不理會後續的言論。
  group_stem: '3C 世代，父母得擔心孩子睡前頻繁使用手機，可能對睡眠品質跟心理健康產生負面影響！董氏基金會今（31）日警告，根據新近研究指出，夜間使用手機不僅剝奪了孩子的睡眠時間，也對他們的心理健康產生負面影響，尤其是曾遭受網路霸凌的孩子，若發現他們在該睡覺的時間仍頻繁使用手機，須特別留意。

    該 2024 年 8 月發表於《青少年(Adolescents)》期刊的研究由南澳大學研究中心所進行，研究人員針對 5 萬 3734 名年齡介於 7 至 19
    歲的學生為對象，了解他們的睡眠與「夜間」（應該在睡覺的時間）使用手機的習慣，以及遭受網路霸凌的經驗和壓力水平之間的關係。

    研究顯示，約 34%的小學生及超過 60%的青少年，在晚上該睡覺的時間使用手機；夜間使用手機的頻率和每晚睡眠時間少於 8 小時的情況在青春期早期達到尖峰，且在年輕女孩中更為明顯。研究也發現，遭受網路霸凌的參與者，近
    75%承認整晚都會查看手機，而未遭受網路霸凌的參與者只有不到一半表示晚上有使用手機。

    兒童心智科醫生吳佑佑表示，許多研究已證實，過度使用網路和 3C 產品與睡眠影響密切相關，尤其當孩子夜裡醒過來看手機，受到強光和藍光刺激可能導致失眠，或干擾他們的睡眠周期，進而對睡眠和生活造成影響。

    吳佑佑說，半夜使用手機或高度依賴手機的孩子，暴露在網路霸凌情境的風險較高。通常我們在網路發布訊息後，會查看是否有人看到，別人怎麼回應，以及如何回覆他人的回應，越頻繁使用，越容易依賴網路，若選擇公開發表內容，未限定觀看對象，後續失控的言論與網路霸凌事件發生的風險將提升。她提醒，連大人都不見得能夠控制自己不去使用手機，更何況是孩子，建議家長教導孩子如何有效運用
    3C 產品，更智慧地應用這些工具，避免不當使用影響生活和心理健康。

    董氏基金會心理衛生中心主任葉雅馨強調，使用手機透過社群互動、紀錄生活已是常態，當看到有些回應和想像的不同時，自然會擔心、想回覆，而「思考」本身很難關機，所以容易干擾睡眠。

    葉雅馨建議，父母可透過以下三點幫助孩子建立健康的手機使用習慣。一、說明而有共識：跟孩子說明不睡覺玩手機的缺點，像是會吸引晚睡的人線上聊天、玩遊戲，常因此不好意思提早休息，可教孩子練習拒絕，或告知對方要先下線。二、增強給予獎勵：父母以孩子喜歡的事物作為獎勵，當孩子在約定的時間休息就能夠獲得，時間拉長就會變成一種習慣。三、從小目標開始：用手機對孩子來說可能是種紓壓，避免讓孩子產生剝奪感與抗拒感，可利用漸進式的目標設定，幫助他們克服覺得很難的心理障礙，例如從睡覺時間提早十分鐘開始，逐步接近最終目標，較容易與孩子取得共識。

    （〈CNEWS 匯流新聞網〉）'
