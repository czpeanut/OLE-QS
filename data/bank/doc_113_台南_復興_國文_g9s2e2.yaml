- id: doc_113_台南_復興_國文_g9s2e2_s2_31
  section: 2
  number: 31
  type: single
  page: 9
  stem: 關於文中「挽面」的意涵，下列何者最符合作者觀點？
  options:
  - label: A
    content: 相信透過此種美容技術，可以去除細毛並讓皮膚更加細緻
  - label: B
    content: 意謂母親希望女兒能擁有傍身的技能，以獲得世俗的認可
  - label: C
    content: 代表母親對女兒的關愛與牽掛，試圖維繫彼此的情感連結
  - label: D
    content: 暗示母親不滿女兒的外貌，希望透過挽面來改變她的容貌。
  group_stem: '我姑且閉上眼睛，讓母親低著頭，執眉夾，替我挽面。光影透過她的手勢錯落在眼皮上，我很快就沉沉睡著，再醒來時什麼也沒變，母親卻累得直不起身子來。

    我不信這套古老方法能改變什麼，日後我轉身朝著鏡子，自己處理面子問題。但無論我如何背對母親，她還是會好好說歹說把我枕在腿上，面對著她，問我，沒什麼心事要說的嗎？我緘口，她也不追問那些藏在我抽屜裡，單方面寫下的日記和情書怎麼回事，只是繼續挽面。經常，我被她沾了收斂水的化妝棉一擦，冰涼澀鹼扎得我醒來，卻看到她眼角有光，推說是目油。

    歹勢，弄痛你了。

    她其實都知道了，儘管痛的是我，哭的卻是她。

    我曾和某任男友交往數年，好不容易感情穩定，以為自己終於有臉面對母親了，遂和母親坦白，並安排他們一起用餐。餐後男友說：你長得很像媽媽。我一聽到這句話就板臉生氣，彷彿我努力切斷的又被黏回來。

    這是我喜歡你的原因之一，謝謝她。他說。

    原來，當我對著鏡子發自己的脾氣時，看在她的眼裡，我卻是使力地用各種洗潔保養品抹去她的輪廓。

    工作後瑣事纏身，很少讓母親替我挽面。突然有一日她敲我的門，將我枕在腿上替我挽面，問我什麼時候再帶男友來見。我說現在沒有男友，找不到，睜開眼睛，她沉默不語，只是推推鼻梁上的老花眼鏡，在我臉上仔細揪她自己的錯。

    弄痛你了嗎？歹勢。

    光影錯落，在夢與醒的恍惚之間，想起她那句歹勢，總有弦外之音，彷彿每個手勢都在告訴我：生給你的不夠好，只能盡力替你挽一張乾淨的臉，讓你接下來的人生有顏有面，能抬頭挺胸走路。

    我想說，沒有關係的，長得像妳，我很開心。

    （節錄自謝凱特〈挽面〉）'
