  section: 2
  number: 29
  type: single
  page: 8
  stem: 詩中從「最後一隻大象」、「我們一起回家」到「昨天還會點亮／愛會甦醒」，呈現了情感上的轉折。下列對這段情感發展的理解，何者最恰當？
  options:
  - label: A
    content: 從沉重與哀傷走向希望與愛的再生，傳達對未來的樂觀信念
  - label: B
    content: 從幻想與虛構轉為寫實與紀錄，強調歷史的真實與可驗證性
  - label: C
    content: 從個人回憶轉為自然描寫，呼應對動物保育和環境永續的重視
  - label: D
    content: 將作者想像化為超現實敘述，凸顯詩句語言形式的創新與趣味。
  group_stem: '大象仍然席地而坐　　　　高于棋


    勾起長鼻子，搭出橋

    通往世界，沒有愛的電廠

    這是，最後一夜

    憂鬱企鵝依舊沉睡

    作家提起黑暗的筆，劃開時間


    博物館舉槍，盔甲躁動

    中國遠征軍驚醒緬甸的雨林，和平低鳴

    我睜開雙眼，從南國北方出發

    走出島嶼標本，搭乘靈魂纜車

    展開一場限時旅途，穿越海峽

    前往天然氣的脈搏

    真相太過粗糙，磨傷腳掌的興「旺①」


    牠是基輔

    最後一隻大象

    雙眼緊閉，虔誠跪地祈禱


    獵豹與獅子紛紛出籠

    穿越明天的邊境

    飼育員餵養溫柔，沒有蘋果

    輕撫柵欄，巨大的信仰

    在荒原裡並排而坐

    我說，我們共同來自他方

    沒有人類，樹叢高聳茂密

    遮蔽傷口一路遷徙，笑容是影


    你說，我們一起回家

    他們躲在烏雲下，牽一隻赤裸的羊

    徒步走過街區，穿越森林


    一同仰望藍天起霧

    機械鳥下蛋

    在歷史破殼之前守護，試著

    我們用力接住

    一些易碎的今天

    紅色雨水，滴落自由的眼睛

    大陸羽翼未曾翱翔

    死亡持續盤旋

    模糊了窗戶，草綠和白雪

    他們緊閉呼吸的門

    盛滿最後一碗羅宋湯

    我們屏息擁抱，交換疼痛

    粗壯的四肢，小心摸黑行進

    生怕吵醒

    還沒說完的故事


    他用皺紋寫遺書

    藏進我皮膚老舊的褶痕

    橋梁在生還夢境裡瓦解

    我的言語，隨秒針褪色

    最後回到千里之外，另一座城市

    島嶼的太陽，仍然升起日落的信仰

    昨天還會點亮

    愛會甦醒

    我們仍然席地而坐


    【注釋】①：「旺」為林旺，原是第二次世界大戰期間在緬甸為日軍服役的亞洲象，後安養在臺北市立動物園。'
