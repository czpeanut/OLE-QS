- id: doc_113_屏東_明正_國文_g9s2e1_s4_18
  section: 4
  number: 18
  type: single
  page: 4
  stem: 余秋雨在論及蘇軾、白居易二人之餘又提出林和靖為例，用意為何？
  options:
  - label: A
    content: 以蘇、白二人的價值觀與林和靖的相對比
  - label: B
    content: 以林和靖的辭章風采對比蘇、白
  - label: C
    content: 林和靖隱居動機高於蘇、白二人
  - label: D
    content: 表達蘇、白應如林和靖般急流勇退
  group_stem: '(四)

    西湖勝跡中最能讓中國文人揚眉吐氣的，是白堤和蘇堤。兩位大詩人、大文豪，不是為了風雅，甚至不是為了文化上的目的，純粹為了解除當地人民的疾苦，興修水利，浚湖築堤，終於在西湖中留下了兩條長長的生命堤壩。清人查容詠蘇堤詩云：「蘇公當日曾築此，不為遊觀為民耳。」恰恰是最懂遊觀的藝術家不願意把自己的文化形象雕琢成遊觀物，於是，這樣的堤岸便成了西湖間特別顯得自然的景物。不知旁人如何，就我而論，遊西湖最暢心意的，乃是在微雨的日子，獨個兒漫步於蘇堤。也沒有什麼名句逼我吟誦，也沒有後人的感慨來強加於我，也沒有一尊莊嚴的塑像壓抑我的鬆快，它始終只是一條自然功能上的長堤，樹木也生得平適，鳥鳴也聽得自如。這一切都不是東坡學士特意安排的，只是他到這裡做了太守，辦了一件盡職的好事，就這樣，才讓我看到一個在美的領域真正卓越到了從容的蘇東坡。

    但是，就白居易、蘇東坡的整體情懷而言，這兩道物化了的長堤還是太狹小的存在。他們有他們比較完整的天下意識、宇宙感悟，他們有比較硬朗的主體精神、理性思考，在文化品位上，他們是那個時代的峰巔和精英。他們本該在更大的意義上統領一代民族精神，但卻僅僅因辭章而入選為一架僵硬機體中的零件，被隨處裝上拆下，東奔西顛，極偶然地調配到了這個湖邊，搞了一下別人也能搞的水利。我們看到的，是中國歷代文化良心所能作的社會實績的極致。儘管美麗，也就是這麼兩條長堤而已。

    也許正是對這類結果的大澈大悟，西湖邊又悠悠然站出一個林和靖。他似乎把什麼都看透了，隱居孤山二十年，以梅為妻，以鶴為子，遠避官場與市囂。他的詩寫得著實高明，以「疏影橫斜水清淺，暗香浮動月黃昏」兩句來詠梅，幾乎成為千古絕唱。中國古代，隱士多的是，而林和靖憑著梅花、白鶴與詩句，把隱士真正做道地、做漂亮了。在後世文人眼中，白居易、蘇東坡固然值得羨慕，卻是難以追隨的；能夠偏偏到杭州西湖來做一太守，更是一種極偶然、極奇罕的機遇。然而，要追隨林和靖卻不難，不管有沒有他的才分。梅妻鶴子有點煩難，其實也很寬鬆，林和靖本人也是有妻子和小孩的。那兒找不到幾叢花樹、幾雙飛禽呢？在現實社會碰了壁、受了阻，急流勇退，扮作半個林和靖是最容易不過的。

    余秋雨：《文化苦旅‧西湖夢》'
