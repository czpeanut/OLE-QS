  stem: 這段文字的主要內容，應是下列何者？
  options:
  - label: A
    content: 油芒產量的不足，使族人發現氣候變遷帶來的問題
  - label: B
    content: 部落居民透過實際耕作體驗，體認到糧食得來不易
  - label: C
    content: 部落居民重新種植臺灣油芒，可望為部落帶來改變
  - label: D
    content: 長年面臨乾旱問題，使許多族人選擇離開部落謀生
  group_stem: 對南島各族而言，萬物取之於天地，對任何東西都充滿敬畏，即便是已經消逝的作物，一談起來，仍不敢苟且。在屏東的德文部落，居民積極復耕消失逾六十年的作物「臺灣油芒」，該作物具耐旱、抗溼、抗鹽化的特性，且營養含量十分可觀，有望成為因應氣候變遷與糧食危機的「超級未來食物」。而油芒產品較有利潤，或許能讓離開的族人再回來部落。
  tags:
    chapter:
