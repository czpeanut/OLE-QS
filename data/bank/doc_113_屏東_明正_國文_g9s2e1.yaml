- id: doc_113_屏東_明正_國文_g9s2e1_s4_15
  section: 4
  number: 15
  type: single
  page: 3
  stem: 關於甲、乙二曲的寫作手法上，下列何者敘述正確？
  options:
  - label: A
    content: 兩曲皆使用鼎足對，且皆疊用九個名詞
  - label: B
    content: 兩曲皆使用襯字，可知襯字可放置句中任何位置
  - label: C
    content: 兩曲皆使用典故寄託寓意，並用兩個相同人物
  - label: D
    content: 兩散曲文詞典雅，皆避用俚俗
  group_stem: '(三)

    【甲】菊花開，正歸來。伴虎溪僧鶴林友龍山客１，似杜工部陶淵明李太白,有洞庭柑東陽酒西湖蟹。哎!楚三閭２休怪。

    馬致遠〈撥不斷〉

    【乙】長醉後妨何礙？不醒時有甚思？糟醃兩個功名字，醅３渰４千古興亡事，麴埋萬丈虹霓志。不達時皆笑屈原非，但知音盡說陶潛是。

    白樸〈寄生草〉

    【丙】屈原已經成為一個符號和象徵。

    漢代，屈原的爭議主要落於「怨君」。儒家對情感表達的理想是「樂而不淫，哀而不傷」。肯定屈原的人以注解儒家經書的方式注《楚辭》，試圖建立其經典地位，認為屈原和《詩經》一樣「怨誹而不亂」，可與日月爭光。批評屈原的人認為屈原在<離騷>有著歌淚式的表達，甚至悲壯付出生命，與儒家中庸之道產生劇烈拉鋸。

    宋朝遭外族侵門踏戶，激發民族情感。《楚辭》讀者對屈原情感表現的理解，不同於漢代只從忠君脈絡詮釋，轉而強調其愛國之心，以國家民族興亡的高度，將「當怨與否」的倫理內涵重新審視，由此確立屈原情感的正當性。

    明代黃文煥因蒙冤下獄，對屈原不被理解的痛苦感同身受。在獄中著《楚辭聽直》，為屈原的忠義之心辯護，希望有人也能替他昭雪冤屈。

    屈原之於現代讀者的意義，與社會文化語境相關，面對抗戰，屈原愛國的面向被重新加強。隨著端午節被確立為詩人節，學者開始思考「詩人何為」，從中探討文學與政治的關係。當個人理想遭遇挫折，就像屈原不被楚王了解，這時該不該執著？可藉由屈原「舉世皆濁我獨清」的心緒，思考理想和世界的衝突。
    改寫自徐平<一個屈原，各自表述>

    ＊註：1.虎溪僧：指晉代高僧慧遠。鶴林友：指五代道士殷天祥。龍山客：指晉代名士孟嘉。2.楚三閭：指屈原。3 醅:沒過濾的酒。4.渰:一ㄢˇ，同「淹」,淹沒。'
