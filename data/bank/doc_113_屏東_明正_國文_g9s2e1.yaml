  - label: D
    content: 前世因果報應，牽連至今世
  group_stem: '(二) 余鄉唐太史濟武，數歲時，有表親某，相攜戲寺中。太史童年磊落，膽即最豪，見廡①中泥鬼，睜瑠璃眼，甚光而巨，愛之，陰②以指抉③取，懷之而歸。既抵家，某暴病不語。移時忽起，厲聲曰：「何故抉我睛！」譟叫不休。衆莫之知，太史始言所作。家人乃祝曰：「童子無知，戲傷尊目，行奉還也。」乃大言曰：「如此，我便當去。」言訖，仆地遂絕，良久而甦，問其所言，茫不自覺。乃送睛仍安鬼眶中。
    （節選自蒲松齡 聊齋誌異－泥鬼）

