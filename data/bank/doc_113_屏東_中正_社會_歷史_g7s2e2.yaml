  type: single
  page: 2
  stem: 請問今日的玉井國小，日治時期是噍吧哖公學校，改為玉井公學校，後改制為玉井西國民學校。請問「國民學校」的出現，是日治時期的哪一階段?
  options:
  - label: A
    content: 無方針主義時期
  - label: B
    content: 殖民地特殊統治時期
  - label: C
    content: 內地延長主義時期
  - label: D
    content: 皇民化運動
  group_stem: '湯德章（1907年—1947年），出生於臺灣臺南，父親為日本人，母親為臺南人。湯德章曾就讀噍吧哖公學校(今玉井國小)，老師曾評價他：「勤勉誠實，做事有魄力、負責，有點不修邊幅，但有抑強扶弱之氣概。」


    曾在台南任職警官，1940年到日本進修法律專業知識，回到台灣後擔任律師。


    1945年，國民政府接管臺灣，湯德章在隔年加入中國國民黨。228事件擴及台南，3月6日「二二八事件處理委員會台南市分會」成立，湯德章被推爲治安組長。國軍第21師進入台南市後，逮捕湯德章，槍決於民生綠園（今湯德章紀念公園）。2014年，台南市政府將湯德章忌日3月13日訂為「台南市正義與勇氣紀念日」，以紀念湯德章英勇堅韌所代表的台灣精神。'
