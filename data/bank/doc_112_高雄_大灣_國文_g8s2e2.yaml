- id: doc_112_高雄_大灣_國文_g8s2e2_s4_32
  section: 4
  number: 32
  type: single
  page: 5
  stem: 有關本文敘述，下列說明何者不正確？
  options:
  - label: A
    content: 在十指扎針放血，能使中風患者因痛覺刺激而清醒
  - label: B
    content: 中風一旦處理不當，可能導致對腦部與神經的傷害
  - label: C
    content: 在黃金三小時內送醫治療，是處理中風最好的方式
  - label: D
    content: 昏倒、暈眩、抽搐症狀類似中風，易造成大眾混淆。
  group_stem: "查核案件 \n    根據衛福部統計，腦血管疾病已成為國人十大死因之一，每年奪走一萬多條寶貴性命，令人聞之色變。因此網路盛傳：「看到有人腦中風昏倒時，用針刺十指尖端以放血，可救人一命。」\
    \ \n查核結果 \n  根據腦神經外科醫師指出，戳破十指放血對中風暈倒者會有反應，是因為有些疾病症狀，如昏倒、眩暈、抽搐等，乍看之下像中風，此時扎針的疼痛正好刺激在人體感覺神經較集中的指尖上，病人的確有可能因疼痛而清醒過來，但其原因並非放血，而是疼痛刺激。假如是真正中風，扎針放血也是無效。\
    \ \n  家屬正確的應對方式，應把握黃金三小時，叫救護車送醫。因為在高階影像的診斷下，才能做精確的醫療處置，減少後續對腦部及神經的損害。"
  tags:
