  section: 3
  number: 13
  type: single
  page: 2
  stem: 下列關於勵志名言的涵義，何者闡述不正確？
  options:
  - label: A
    content: 勿以惡小而為之，勿以善小而不為――越是微小的事情，越見品質
  - label: B
    content: 書到用時方恨少，事非經過不知難――勤懇才能登上知識高峰，不怕吃苦才能有所得
  - label: C
    content: 良言一句三冬暖，惡語傷人六月寒――任何話語、舉動，都要三思而後行
  - label: D
    content: 非淡泊無以明志，非寧靜無以致遠――心思澄澈、安定，摒除誘惑，才可成就大事業。
