- id: doc_112_高雄_大灣_國文_g8s2e2_s3_3
  section: 3
  number: 3
  type: single
  page: 1
  stem: '下述文句「 」中的字，共有幾組意思前後相同？

    甲 斯是陋室，「惟」吾德馨／「惟」膀子疼痛厲害

    乙 無「絲竹」之亂耳／金石「絲竹」之聲，不絕於耳

    丙 「徒」步是一種愉快／少壯不努力，老大「徒」傷悲

    丁 可以調「素」琴，閱金經／留蚊於「素」帳中

    戊 參差地「翳」入了天聽／後來足足害了一年多的眼「翳」病

    己 往來無白「丁」／目不識「丁」。'
  options:
  - label: A
    content: 一組
  - label: B
    content: 二組
  - label: C
    content: 三組
  - label: D
    content: 四組。
