- id: doc_112_高雄_大灣_國文_g8s2e2_s4_33
  section: 4
  number: 33
  type: single
  page: 5
  stem: 關於甲和乙的寫法，下列選項何者敘述正確？
  options:
  - label: A
    content: 兩篇都有對句
  - label: B
    content: 兩篇韻腳相同
  - label: C
    content: 兩篇皆非韻文
  - label: D
    content: 兩篇都是樂府詩。
  group_stem: "甲 無道人之短，無說己之長。 \n   施人慎勿念，受施慎勿忘。 \n   世譽不足慕，惟仁為紀綱¹。 \n   隱²心而後動，謗議庸³何傷？\
    \ \n   無使名過實，守愚聖所臧⁴。 \n   在涅⁵貴不緇⁶，曖曖⁷內含光。 \n   柔弱生之徒，老氏誡剛強。 \n   行行⁸鄙夫志，悠悠故難量。\
    \ \n   慎言節飲食，知足勝⁹不祥。 \n   行之茍¹⁰有恆，久久自芬芳¹¹。   ──崔瑗〈座右銘〉 \n【注釋】  \n1.綱：法則。     \
    \        \n2.隱：安穩的意思。                      \n3.庸：豈。    \n4.臧：音ㄗㄤ，動詞，讚賞。      \
