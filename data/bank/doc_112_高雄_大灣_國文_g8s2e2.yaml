- id: doc_112_高雄_大灣_國文_g8s2e2_s3_15
  section: 3
  number: 15
  type: single
  page: 2
  stem: 以下是四位同學看完上文之後的解讀，請問哪一位的看法最為正確？
  options:
  - label: A
    content: 幽助：作者透過摹寫、誇飾等修辭客觀地記錄自己騎車追逐晨曦美景的經驗
  - label: B
    content: 桑原：作者在第二段經驗中跪下，是因為餘暉過於耀眼、熾熱，讓人無力招架
  - label: C
    content: 藏馬：若實際將作者分享的美感經驗繪成圖畫，則第三段經驗所含的色彩與景觀最為豐富
  - label: D
    content: 飛影：文末作者未具體寫出罌粟花田在落日下的景象，是想賣關子預留伏筆。
  group_stem: 1.有一次，我趕到一個地方，手把著一家村莊的籬笆，隔著一大田的麥浪，看西天的變幻。2.有一次，是正衝著一條寬廣的大道，過來了一大群羊，放草歸來的，偌大的太陽在牠們後背放射著萬縷的金輝，天上卻是烏青青的，只剩這不可逼視的威光中的一條大路、一群生物！我心頭頓時趕著神異性的壓迫，我真的跪下了，對著這冉冉漸隱的金光。3.再有一次，是更不可忘的奇景，那是臨著一大片望不到頭的草原，滿開著艷紅的罌粟，在青草裡亭亭地像是萬盞的金燈，陽光從褐色雲裡斜著過來，幻成一種異樣的紫色，透明似的，不可逼視，剎那間在我迷眩了的視覺中，這草田變成了……，不說也罷，說來你們也是不信的！
