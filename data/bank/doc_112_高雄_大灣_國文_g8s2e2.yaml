- id: doc_112_高雄_大灣_國文_g8s2e2_s3_11
  section: 3
  number: 11
  type: single
  page: 1
  stem: 德國哲學家康德曾把美分為「壯美」和「秀美」，其中「壯美」是一種雄壯、遼闊、崇高的美感，例如：〈我所知道的康橋〉一文中「滿開著豔紅的罌粟，在青草裡亭亭地像是萬盞的金燈」一句，正是徐志摩所說的「數大便是美」的景致，也就是所謂的「壯美」。依此說明，下列描寫的景物，何者不屬於「壯美」？
  options:
  - label: A
    content: 泰山頂上的雲海，巨萬的雲峰在晨光裏靜定著
  - label: B
    content: 紅紅的花開滿了木棉道，長長的街好像在燃燒
  - label: C
    content: 月牙清亮而溫柔，把一些軟光輕輕送到柳枝上
  - label: D
    content: 巨浪一波又一波地撞擊岩石，千堆雪花捲起又捲起。
