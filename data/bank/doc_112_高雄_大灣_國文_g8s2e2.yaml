- id: doc_112_高雄_大灣_國文_g8s2e2_s3_18
  section: 3
  number: 18
  type: single
  page: 2
  stem: '下述是佩佩豬對〈水神的指引〉一文的理解，請問表中何項內容描述正確？

    | 選項 | 課文原句 | 文意理解 |

    | --- | --- | --- |

    | （Ａ） | 祖父曾說過：「自然從未啞過，只是我們一直在背離她而已，我們不敢用真實去面對她，我們脫離了與她的歸屬感，讓自己獨享一切。」 | 族人離開故鄉，讓自然感到寂寞
    |

    | （Ｂ） | 兒子，別小看這麼一點點的水量，她是很彌彌足珍貴，就如你口乾後芋葉上的那個水滴一樣，在這麼大的獵場裡，也就只有這裡有水源，在附近耕作或打獵的人都來這裡用水，這裡是獵場裡唯一的水源區。
    | 感恩珍惜自然資源，並適度共享 |

    | （Ｃ） | 老獵人為了讓附近的人知道這裡有水流出，就在水滴落的地方放了一塊石板，石板下挖空，讓水的滴落聲能起共鳴，讓人來到這裡取水。 | 自然生生不息，人類卻帶來浩劫
    |

    | （Ｄ） | 這條山徑，是父親付出勞力和血汗的最好證據，由採藤心的次數來換算他對我們付出的辛苦，我們的生活費、學費，就是從這條山徑走出來的。 | 面對自然被破壞，人們無能為力
    |'
  options:
  - label: A
    content: （Ａ）
  - label: B
    content: （Ｂ）
  - label: C
    content: （Ｃ）
  - label: D
    content: （Ｄ）
