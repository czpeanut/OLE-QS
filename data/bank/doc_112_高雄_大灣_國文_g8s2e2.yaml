    content: 「斯是陋室，惟吾德馨」：為全文綱領，主旨所在
  - label: B
    content: 「苔痕上階綠，草色入簾青」：強調居家雜草叢生
  - label: C
    content: 「……有仙則名；……有龍則靈」：以仙、龍喻有才德者
  - label: D
    content: 「可以調素琴，閱金經」：寫作者平時的清雅情趣。
