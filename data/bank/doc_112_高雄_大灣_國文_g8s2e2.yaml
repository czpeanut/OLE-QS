    \          \n9.勝：克制、制止。 \n10.茍：如果。 \n11.芬芳：在此比喻才德的發揚。 \n\n乙 事父盡孝敬，事君端忠貞。 \n  \
    \ 兄弟敦和睦，朋友篤信誠。 \n   從官重公慎，立身貴廉明。 \n   待士慕謙讓，蒞民¹²尚寬平。 \n   理訟惟正直，察獄必審情¹³。 \n  \
