    | 連用三個「頃刻間」除了描寫朝陽升起後景色的瞬息變化，也表現作者因白晝降臨而感到光榮愉悅的心情。 |

    | （Ｃ） | 四 | 你如愛花，這裡多的是錦繡似的草原。你如愛鳥，這裡多的是巧囀的鳴禽。你如愛兒童，這鄉間到處是可親的稚子。你如愛人情，這裡多的是不嫌遠客的鄉人……。
    | 連用四個「你如愛」是向一同騎自行車出遊的友伴，推薦春日野遊的自然與人情之美。 |

