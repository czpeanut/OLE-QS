- id: doc_112_高雄_大灣_國文_g8s2e2_s3_12
  section: 3
  number: 12
  type: single
  page: 2
  stem: 下列關於〈我所知道的康橋〉文意的說明，何者正確？
  options:
  - label: A
    content: 滿開著豔紅的罌粟，在青草裡亭亭地像是萬盞的金燈：描述淒涼哀傷的黃昏之景
  - label: B
    content: 萬縷的金輝，天上卻是烏青青的，只剩這不可逼視的威光中的一條大路、一群生物：貼切地描寫早晨的景象
  - label: C
    content: 頃刻間這田野添深了顏色，一層輕紗似的金粉糝上了這草、這樹、這通道、這莊舍：描述柔麗的陽光灑落大地之景
  - label: D
    content: 在靜定的朝氣裡漸漸地上騰，漸漸地不見，彷彿是朝來人們的祈禱，參差地翳入了天聽：形容尖閣的壯觀。
  lesson_raw:
    title: 我所知道的康橋
    basis: 題目指明〈我所知道的康橋〉文意
