  section: 3
  number: 14
  type: single
  page: 2
  stem: 下列對聯所題的對象，何者搭配正確？
  options:
  - label: A
    content: 草堂留後世，詩聖著春秋──李白
  - label: B
    content: 成大事以小心，一生謹慎；仰宗臣之遺像，萬古清高──司馬遷
  - label: C
    content: 剛直不阿，留得正氣沖霄漢；幽愁發憤，著成信史照塵寰──諸葛亮
  - label: D
    content: 豪情跌宕，文采風流，新月新詩廣陵散；逸興遄飛，黃泉碧落，奇人奇死破天荒──徐志摩。
