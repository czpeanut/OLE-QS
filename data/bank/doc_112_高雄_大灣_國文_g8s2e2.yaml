  stem: 〈水神的指引〉一文中，作者父親藉由「夠用就好」的言行，傳達珍愛資源，取用有節的理念。現今環保議題逐年受到關注，可惜並非人人皆存「永續經營」的概念。請問下列選項中，何人也具備了「永續經營」的理念？
  options:
  - label: A
    content: 孔子：「天何言哉？四時行焉，百物生焉。」
  - label: B
    content: 孟子：「斧斤以時入山林，材木不可勝用也。」
  - label: C
    content: 荀子：「積土成山，風雨興焉；積水成淵，蛟龍生焉；積善成德，而神明自得，聖心備焉。」
  - label: D
    content: 蘇軾：「取之無盡，用之不竭，是造物者之無盡藏也。」
