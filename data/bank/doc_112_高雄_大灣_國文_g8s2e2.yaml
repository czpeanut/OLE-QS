  stem: 瓦歷斯為何生氣「番仔」的稱號？
  options:
  - label: A
    content: 番仔是客語中罵人的話
  - label: B
    content: 同學故意叫錯他的姓名
  - label: C
    content: 番仔是侮辱原住民的綽號
  - label: D
    content: 瓦歷斯不喜歡同學叫他的漢名。
  group_stem: "瓦歷斯是部落長大的孩子，從小就跟父親上山打獵、砍竹子。小學念的是部落小學，沒想過外面的世界，直到國中才發現班上客家人比原住民多，而且人家都喊他：「番仔」，還對他動手動腳！瓦歷斯越來越沉默，國中三年，班上還有同學根本記不起他的名字。\
    \  \n    他少數被記得的事情，都不愉快。一次是數學模擬考，全班都用很厚的《建立參考書》，他買不起，只好買很薄的《苦瓜數學參考書》，沒想到竟然跟資優生同為最高分，老師卻當著全班的面質問他：「你是不是抄別人的？」\
    \  \n    國中三年，值得說的事情太少，他感嘆：「當人都只看到對立面時，就很難寬容。」        \n                     \
    \                                            ──節錄改寫自瞿欣怡〈當風吹過部落的髮〉"
