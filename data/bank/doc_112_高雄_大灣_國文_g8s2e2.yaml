  stem: 下列各句中「 」的詞語，何者意思前後相去最遠？
  options:
  - label: A
    content: 面對逆差，我隊不甘示弱，馬上還以「顏色」／弟走從軍阿姨死，暮去朝來「顏色」故（白居易〈琵琶行〉）
  - label: B
    content: 人在旅途不是歸人，只是一個「躊躇」的過客／天旋地轉迴龍馭，到此「躊躇」不能去（白居易〈長恨歌〉）
  - label: C
    content: 章垿自然率真，騎單車遊賞康橋是他與眾不同的「風流」／搖落深知宋玉悲，「風流」儒雅亦吾師（杜甫〈詠懷古跡〉）
  - label: D
    content: 甄老先生回首一生一事無成，憾恨「老大」徒傷悲／少小離家「老大」回，鄉音無改鬢毛衰（賀知章〈回鄉偶書〉）。
