- id: doc_113_高雄_苓雅_數學_g8s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: '小明利用配方法解一元二次方程式 $2x^{2}-6x-5=0$，下面是他的解題步驟，請問他在哪一個步驟開始發生錯誤？

    第一步：$x^{2}-3x=5$

    第二步：$x^{2}-3x+(\frac{3}{2})^{2}=5+(\frac{3}{2})^{2}$

    第三步：$(x-\frac{3}{2})^{2}=\frac{29}{4}$

    第四步：$x-\frac{3}{2}=\sqrt{\frac{29}{4}}$，$x=\frac{3\pm\sqrt{29}}{2}$'
  options:
  - label: A
    content: 第一步
  - label: B
    content: 第二步
  - label: C
    content: 第三步
  - label: D
    content: 第四步。
