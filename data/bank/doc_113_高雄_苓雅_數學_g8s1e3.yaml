- id: doc_113_高雄_苓雅_數學_g8s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '以下是解 $9x^{2}-24x+16=x^{2}+4x+4$ 的步驟：

    步驟(一)：先因式分解，得 $(3x-4)^{2}=(x+2)^{2}$

    步驟(二)：等號兩邊同時開根號，得 $3x-4=x+2$

    步驟(三)：由移項法則，得 $2x=6$

    步驟(四)：解的結果為 $x=3$（重根）'
  options:
  - label: A
    content: 上述步驟合理
  - label: B
    content: 上述步驟不合理，從步驟(一)開始錯了
  - label: C
    content: 上述步驟不合理，從步驟(二)開始錯了
  - label: D
    content: 上述步驟不合理，從步驟(三)開始錯了。
  tags:
