  section: 1
  number: 4
  type: single
  page: 1
  stem: 柯南是一名大學二年級學生，利用課餘的時間至飲料店工作，店長透過監視器發現他與同事一起工作時表現得還算勤奮，但無人監督時就開始打混摸魚。請問：柯南的行為屬於下列何者？
