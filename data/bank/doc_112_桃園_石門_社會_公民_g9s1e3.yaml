  section: 1
  number: 19
  type: single
  page: 2
  stem: 新聞報導：「台幣對美元早盤強升突破29元整數大關，盤中最高來到28.959元，升值1.91角⋯」，此新聞對不同貿易業者影響很大。請問：依據新聞報導，對下列何人最有利？
  options:
  - label: A
    content: 在台灣從事進口美國名牌皮包的靜香
  - label: B
    content: 專門外銷蘭花到美國的小夫
  - label: C
    content: 擁有美元存款的大雄此時想解約美元定存
  - label: D
    content: 來台灣觀光的美國人傑夫。
- id: doc_112_桃園_石門_社會_公民_g9s1e3_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 員工就業會和雇主簽訂勞動契約，(甲)原則只要雙方意思一致，契約即成立，(乙)內容可隨意規範最低薪資及每日最高工作時數，雙方按照此契約，(丙)若有違約或違法內容可解除契約，(丁)不遵守契約政府也會協助強制執行，但(戊)員工必須主動採取權利救濟，政府一定不會讓勞工權利睡著的。請問：上文中有哪些畫線處是正確敘述呢？
  options:
  - label: A
    content: 甲乙丁
  - label: B
    content: 甲丙戊
  - label: C
    content: 乙丙丁
  - label: D
    content: 丙丁戊。
