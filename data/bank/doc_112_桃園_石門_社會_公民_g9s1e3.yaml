  section: 1
  number: 6
  type: single
  page: 1
  stem: 阿信將老爸給他額度十萬元的信用卡附卡刷爆了，卻無力償還。老爸在又氣又無奈下，只好替孩子償還並取消附卡。關於此事件，下列敘述何者正確？
  options:
  - label: A
    content: 信用卡又稱塑膠貨幣，方便交易
  - label: B
    content: 信用卡能發揮貨幣清償債務的功能
  - label: C
