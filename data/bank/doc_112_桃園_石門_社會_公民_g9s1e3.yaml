  section: 1
  number: 14
  type: single
  page: 2
  stem: 小蝶到服飾店買衣服，發現正在換季拍賣中，一件衣服290 元，二件500 元，結果一口氣刷卡買了四件，共花了1,000 元。請問，下列何者敘述正確？
  options:
