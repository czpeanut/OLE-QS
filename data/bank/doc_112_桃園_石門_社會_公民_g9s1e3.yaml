  stem: 根據行政院金管會研究資料顯示，有6 成4 的卡債族，刷卡都是花在非必要性支出上，這些卡債族月收入平均只有2 到2.9 萬元，但欠債金額卻高達100
    到199 萬元。請問：根據上述，這些卡債族應該要具備下列哪一種觀念才較適當？
  options:
  - label: A
    content: 完全委託專業人士協助理財
  - label: B
    content: 量入為出，做好財務規劃
  - label: C
    content: 承擔社會責任以回饋社會為重
  - label: D
    content: 抵制銀行信用卡發卡業務。
- id: doc_112_桃園_石門_社會_公民_g9s1e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 某財經新聞報導：「近年來，南韓在國際市場上大舉搶占日本同業的市場，影響了在經濟上相當依賴出口的產業發展。」請問：若日本政府想讓日本出口業能更具競爭力，可以怎麼做較有幫助？
  options:
  - label: A
    content: 讓日幣升值，日系產品價格上揚，有利於出口
  - label: B
    content: 讓日幣升值，日系產品價格上揚，不利出口
  - label: C
    content: 讓日幣貶值，日系產品價格下降，有利出口
  - label: D
    content: 讓日幣貶值，日系產品價格下降，不利出口。
