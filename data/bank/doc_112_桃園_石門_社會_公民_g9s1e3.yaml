    content: 價格影響了小蝶的購買數量，符合供給法則
  - label: B
    content: 信用卡又稱塑膠貨幣，所以它也算是貨幣
  - label: C
    content: 刷卡完成交易，顯示出信用卡有延遲支付債務的作用
  - label: D
    content: 衣服一件290 元，此時「元」代表價值儲存的工具。
