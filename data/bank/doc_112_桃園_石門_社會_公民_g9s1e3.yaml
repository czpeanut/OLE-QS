  section: 1
  number: 11
  type: single
  page: 1
  stem: 我國西部許多沿海鄉鎮是養蚵的大本營，因此衍生了許多工作機會。有業者貼出徵人剝蚵的告示，寫著「徵有緣人，剝蚵人才，早班、中班、晚班和假日班，時薪100
    元」。下列哪位網友對此事件的評論較〝具有保障市場勞動〞的觀念？
  options:
  - label: A
    content: 小君：根據契約自由原則，時薪可以隨雇主自訂
  - label: B
    content: 阿香：就是緣份的問題，不滿意可不去
  - label: C
    content: 小丁：身為國二生，我可以應徵假日班
  - label: D
    content: 小美：時薪的約定也是要遵守法令基本工資規定。
- id: doc_112_桃園_石門_社會_公民_g9s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: '當一國的物價持續以大幅度上漲，通常會引發下列何種現象？(甲)貨幣價值貶低(乙)一般人願意及有能力拿貨幣來儲蓄(丙)收入固定的人，生活水準下降 (丁)同樣金額的貨幣可以買到的物品愈來愈少。正確者為:'
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲乙丁
  - label: C
    content: 甲丙丁
  - label: D
    content: 乙丙丁。
- id: doc_112_桃園_石門_社會_公民_g9s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 某公司員工因在懷孕期間請產假，考績因此被評為丙等，她認為此一處分不合法，反遭人資室表示「去勞動局申訴、提告啊！」。勞動局對此進行調查與審議後，認定該公司違法，依法開罰20
    萬元並限期改善。對此事件，下列敘述何者正確？
  options:
  - label: A
    content: 請產假是雇主給員工的福利
  - label: B
    content: 這與《性別平等教育法》有關
  - label: C
    content: 開罰的單位屬立法機關
  - label: D
    content: 開罰金額20 萬元是行政罰鍰。
