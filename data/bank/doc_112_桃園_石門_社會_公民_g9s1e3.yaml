- id: doc_112_桃園_石門_社會_公民_g9s1e3_s1_30
  section: 1
  number: 30
  type: single
  page: 3
  stem: 雇主做出減班休息的決策與下列何者較無關？
  options:
  - label: A
    content: 對職場的安全衛生有影響
  - label: B
    content: 可降低受僱者的工作時數
  - label: C
    content: 可以降低雇主的成本
  - label: D
    content: 會影響受僱者的工作收入。
  group_stem: '「勞雇雙方協商減少工時」（俗稱無薪假）是指當事業單位受景氣因素影響，為避免資遣員工， 造成更多社會問題，雇主與勞工先行協商減少工時。但我國《勞動基準法》或《就業服務法》中並未明確規定無薪假的法源依據，係透過雇工及勞工協商、變更勞動契約內容為之，不過主管機關也有訂定「因應景氣影響勞雇雙方協商減少工時應行注意事項
    」供勞雇依循，若雇主未依規定與勞工協商而造成勞工權益損害，仍會有罰則。但事業單位實施無薪假並沒有強制通報機制，倘若企業實施無薪假卻未向地方主管機關通報，並沒有違法，導致部分被放無薪假的勞工淪於統計黑數。勞動部幕僚表示，減班休息法制化目前正在研議中，未來將修正上述相關法規且加上更明確的罰則，惟細節尚待評估。根據上述內容，回答第30~32
    題:'
