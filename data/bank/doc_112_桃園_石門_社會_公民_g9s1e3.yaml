  stem: 下列有關國際貿易的敘述，何者錯誤？
  options:
  - label: A
    content: 國際貿易也是一種國與國之間的專業分工現象
  - label: B
    content: 我國對日本有貿易逆差，是代表我國對日本的進口總值＞出口總值
  - label: C
    content: 美金對新台幣匯率由1:32變為1:30，表示新臺幣升值，美金貶值
  - label: D
    content: 新臺幣升值，美金貶值時，有利於臺灣出口商進行出口到美國。
- id: doc_112_桃園_石門_社會_公民_g9s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 小智帶著200元到超市幫媽媽買了一罐韓式辣醬，他看見辣醬上的定價為188元，在結帳後趕緊拿回家給媽媽煮他最愛的辣炒年糕；而媽媽為感謝他的幫忙，就將找回的12元送給小智當零用錢，而小智也很高興的將錢存到自己的存錢筒中，當成是自己未來買遊戲卡的基金。請問：根據上文，下列敘述何者錯誤?
  options:
  - label: A
    content: 小智在這裡是擔任商品市場的供給者
  - label: B
    content: 購買辣醬的行為是一種消費行為
  - label: C
    content: 辣醬的定價188元，「元」是一種貨幣計價的標準
  - label: D
    content: 小智願意將12元存起來，可以看出貨幣是具有價值儲存的功能。
