questions:
- id: doc_113_台中_五權_社會_歷史_g9s2e1_s1_17
  section: 1
  number: 17
  type: single
  page: 1
  stem: 歷史 Youtuber 阿寶正在直播介紹某國的建國史。他提到一本1776 年 1 月出版名為《常識》的小冊子，鼓吹十三州的獨立，獲得群眾熱烈迴響。而後，湯瑪斯．傑佛遜起草了一份文件，內容如下：「我們認為下面這些真理是不言而喻的：人人生而平等，造物者賦予他們若干不可剝奪的權利，其中包括生命權、自由權和追求幸福的權利。為了保障這些權利，人類才在他們之間建立政府，而政府之正當權力，是經被治理者的同意而產生的。我們不是沒有顧念我們英國的弟兄。我們時常提醒他們，他們的立法機關企圖把無理的管轄權橫加到我們的頭上，這些聯合一致的殖民地從此是自由和獨立的國家。」下列關於阿寶的歷史直播敘述，何者正確？
  options:
  - label: A
    content: 該直播節目名應為《大英帝國崛起》
  - label: B
    content: 賈斯汀應是來自於法國的新移民
  - label: C
    content: 傑佛遜起草文件應為《人權宣言》
  - label: D
    content: 文件中提到的新政府是世界近代史上第一個的聯邦共和國。
- id: doc_113_台中_五權_社會_歷史_g9s2e1_s1_18
  section: 1
  number: 18
  type: single
  page: 1
  stem: 「由於『他』」的努力，現今委內瑞拉、祕魯、哥倫比亞、厄瓜多、玻利維亞和巴拿馬，這六個國家紛紛從『甲國』殖民統治中解放出來，獲得獨立。」請問：上述的『他』和『甲國』分別是下列何項？
  options:
  - label: A
    content: 華盛頓、英國
  - label: B
    content: 玻利瓦、西班牙
  - label: C
    content: 門羅、葡萄牙
  - label: D
    content: 馬志尼、義大利。
- id: doc_113_台中_五權_社會_歷史_g9s2e1_s1_19
  section: 1
  number: 19
  type: single
  page: 1
  stem: 1914 年有許多人過了一個不一樣的聖誕節，他們爬出壕溝，放下武器暫時休戰，和敵軍交換聖誕禮物，甚至進行足球比賽，還有牧師自發性以英語和德語帶領眾人朗誦聖詩，雖然不久後又繼續交戰，但在雙方士兵心中依然留下難以抹滅的回憶。請問：這場戰爭的導火線為何？
  options:
  - label: A
    content: 俄國國內爆發革命
  - label: B
    content: 無限制潛艇政策
  - label: C
    content: 德國煽動墨西哥反美
  - label: D
    content: 奧匈帝國皇位繼承人遇刺。
- id: doc_113_台中_五權_社會_歷史_g9s2e1_s1_20
  section: 1
  number: 20
  type: single
  page: 1
  stem: 西元 1815 年日耳曼邦聯成立，此後知識分子鼓吹日耳曼的統一，強化了民族認同。請問：以下關於德意志統一過程的敘述何者正確？
  options:
  - label: A
    content: 以薩丁尼亞王國為主導的統一中心
  - label: B
    content: 提倡「關稅同盟」，先奠定經濟的統一基礎
  - label: C
    content: 加富爾主張的鐵血政策獲得成效
  - label: D
    content: 最後經由第一次世界大戰，完成統一。
- id: doc_113_台中_五權_社會_歷史_g9s2e1_s1_21
  section: 1
  number: 21
  type: single
  page: 1
  stem: 殖民統治時代，埃及的英式建築常掛著「埃及人與狗，不准入內」的告示；相當於同時期的中國上海租界公園也常出現「不准華人與狗進入」的招牌。而西方人這種種族優越的思維是受到下列何者的影響？
  options:
  - label: A
    content: 保守主義
  - label: B
    content: 社會主義
  - label: C
    content: 社會達爾文主義
  - label: D
    content: 現實主義。
- id: doc_113_台中_五權_社會_歷史_g9s2e1_s1_22
  section: 1
  number: 22
  type: single
  page: 1
  stem: 西元 1823 年，美國門羅總統發表重要的對外宣言，下列何者是此一宣言的主要內容？
  options:
  - label: A
    content: 任何一州若仍蓄奴，將被視為反叛。所有的奴隸應當獲得並永享自由。
  - label: B
    content: 十三州殖民地應當是自由而獨立的國家，各州與英帝國之間的從屬關係必須取消。
  - label: C
    content: 任何歐洲強權若企圖干預美洲國家事務，美國將視此為對美國安全的威脅。
  - label: D
    content: 日本與夏威夷之間的距離，證明這場攻擊是蓄意謀畫，我已下令採取一切手段進行防禦。
  uncertain_spans:
  - 內容與原卷文字層不符（吻合 77%）
- id: doc_113_台中_五權_社會_歷史_g9s2e1_s1_23
  section: 1
  number: 23
  type: single
  page: 1
  stem: '下表是關於美國獨立和法國大革命的比較，正確的有幾項？


    | | 美國獨立 | 法國大革命 |

    | :--- | :--- | :--- |

    | 時間 | (甲)17 世紀 | (乙)18 世紀 |

    | 背景 | (丙)啟蒙運動的影響 | (丁)啟蒙運動的影響及美國獨立的刺激 |

    | 原因 | (戊)徵稅問題 | (己)徵稅問題 |

    | 外交 | (庚)法國全力支持 | (辛)歐洲各國皆支持 |

    | 結果 | (壬)建立共和政府 | (癸)建立第一個三權分立政府 |'
  options:
  - label: A
    content: '8'
  - label: B
    content: '7'
  - label: C
    content: '6'
  - label: D
    content: 5。
- id: doc_113_台中_五權_社會_歷史_g9s2e1_s1_24
  section: 1
  number: 24
  type: single
  page: 1
  stem: 拿破崙戰敗後，依照維也納會議，義大利也被重新劃分，被當時主導者梅特涅譏笑說：「義大利只是一個地理名詞。」直到 19 世紀才開始有統一的核心領導王國，位於右圖中的哪個位置？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
  assets:
