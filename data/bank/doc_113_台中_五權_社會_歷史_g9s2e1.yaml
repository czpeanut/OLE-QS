  section: 1
  number: 25
  type: single
  page: 1
  stem: 有位 19 世紀的詩人曾說，在義大利統一過程中，加富爾相當於義大利的腦袋，主導外交策略；加里波底象徵義大利的利劍，達成軍事任務；下列何人則象徵義大利的靈魂，激發民族意識？
  options:
  - label: A
    content: 俾斯麥
  - label: B
    content: 馬志尼
  - label: C
    content: 威爾遜
  - label: D
    content: 玻利瓦。
- id: doc_113_台中_五權_社會_歷史_g9s2e1_s1_26
  section: 1
  number: 26
  type: single
  page: 1
  stem: 巴爾幹半島被稱為「歐洲的火藥庫」，此衝突的發生原因之一，乃是源自那兩個不同宗教信仰所致？
  options:
  - label: A
    content: 羅馬公教、基督教
  - label: B
    content: 希臘正教、伊斯蘭教
  - label: C
    content: 希臘正教、羅馬公教
  - label: D
    content: 羅馬公教、伊斯蘭教。
- id: doc_113_台中_五權_社會_歷史_g9s2e1_s1_27
  section: 1
  number: 27
  type: single
  page: 2
  stem: 附圖畫中的巨人象徵著美國，而巨人手中拉了一艘艘的船隻象徵拉丁美洲各國。 對於這幅諷刺漫畫下列何者敘述正確？
  options:
  - label: A
    content: 諷刺美國干預拉丁美洲的事務
  - label: B
    content: 拉丁美洲各國追隨美國加入帝國主義行列
  - label: C
    content: 拉丁美洲各國希望與美國合作，脫離西、葡統治
  - label: D
    content: 這幅漫畫所發生時間是在大航海時代。
