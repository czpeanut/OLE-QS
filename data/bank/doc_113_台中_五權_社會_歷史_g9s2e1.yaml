- id: doc_113_台中_五權_社會_歷史_g9s2e1_s1_28
  section: 1
  number: 28
  type: single
  page: 2
  stem: 共產主義重要思想家恩格斯曾說：「當『科西嘉怪物』最後被牢牢地禁閉起來之後，大大小小的帝王們立刻在維也納開了一次大會，以便分配贓物和獎金，並商討能把革命前的形勢恢復到什麼程度。」請問：恩格斯所說的「科西嘉怪物」指的是下列何人？
  options:
  - label: A
    content: 華盛頓
  - label: B
    content: 伏爾泰
  - label: C
    content: 拿破崙
  - label: D
    content: 希特勒。
