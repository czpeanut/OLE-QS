- id: doc_113_台中_五權_社會_歷史_g9s2e1_s1_30
  section: 1
  number: 30
  type: single
  page: 2
  stem: 「當某國際組織抵達滿洲奉天時，當地中國人都表示日軍非法佔領滿洲…即使此國際組織否認滿洲國的合法地位，並要求日本將滿洲交還給中國，日本卻宣布退出此國際組織，令中國無法收復滿洲。根據條約，此國際組織應對日本實施經濟制裁，但實際上郤無法推行，日本更加速對中國的侵略。」根據上文，請問下列敘述何者正確？
  options:
  - label: A
    content: 上文的時代背景使中國發生五四運動
  - label: B
    content: 此國際組織的成立是由於威爾遜總統在《十四點和平原則》中的倡導
  - label: C
    content: 上文顯示此國際組織積極有效進行制裁侵略行動
  - label: D
    content: 美國加入此國際組織後，發揮維護世界和平的功能。
