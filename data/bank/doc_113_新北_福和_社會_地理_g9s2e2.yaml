  stem: 為解決農業缺工問題，2019 年臺灣勞動部決議將試辦酪農業開放引進外籍移工。花蓮某牧農表示，他的牧場有900 頭乳牛，現在包含他自己在內，只有10
    個人力，預計要聘2 名移工，牧場每天有兩個時段要工作，凌晨4 點半到上午7 點與下午3 點到晚上7 點，過程相當重勞力。請問：上述文章，主要呈現出臺灣酪農業的哪一項特性？
  options:
  - label: A
    content: 已高度機械化
  - label: B
    content: 以集約方式經營
  - label: C
    content: 運輸與冷藏技術的不足
  - label: D
    content: 零散分布於市郊平原上。
