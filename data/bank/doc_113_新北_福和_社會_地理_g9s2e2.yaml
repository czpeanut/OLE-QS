  stem: 歐洲難民潮議題是指自2010 年底以來，從中東和北非等地激增的難民，經由地中海及巴爾幹半島進入歐盟國家尋求居留的事件。請問：歐盟執行委員會因應難民危機，研擬由成員國攤派接納一定配額難民，下列哪個國家需遵守此規定？
  options:
  - label: A
    content: 瑞士
  - label: B
    content: 挪威
  - label: C
    content: 俄羅斯
  - label: D
