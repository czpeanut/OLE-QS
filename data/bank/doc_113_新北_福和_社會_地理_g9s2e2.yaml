  page: 1
  stem: 臺灣每年都需要從義大利進口提供餐廳製作燉飯料理的稻米。花蓮農改場經過多年研究，培育出臺灣第一款燉飯專用米「花蓮26 號」，此舉促使一些休耕農地紛紛種起花蓮26
    號，以銷售給餐廳。根據此敘述請問：當臺灣多數餐廳改以花蓮26 號作為燉飯的食材時，最可能帶來下列哪項影響？
  options:
  - label: A
    content: 縮短食物里程降低對外依賴
  - label: B
    content: 區域專業化而能達到環境永續
  - label: C
    content: 提升碳足跡以確保無毒種植
  - label: D
    content: 透過基因改造來促進糧食出口。
  tags:
    chapter:
      publisher: 翰林
      book: 九下
