  stem: 「以前種地瓜，是看天吃飯，產量多少無法掌控，連價格好壞也只能任由批發商宰割。」地瓜農楊先生說出許多農民的心聲。為了改變臺灣地瓜的命運，黃榮清於2013
    年成立慶全地瓜生產合作社，找來臺灣的地瓜農進行契作，陸續加入超市、超商和連鎖餐飲等通路。請問：根據上文所述，地瓜產業的發展，符合下列哪些農業經營的特徵？(甲)有機農業；(乙)精緻農業；(丙)休閒農業；(丁)區域專業化；(戊)農業企業化。
