  type: single
  page: 1
  stem: 根據2015 年與2021 年的蚵架分布與等高線的型態，可判斷潮間帶範圍發生變化，關於潮間帶範圍的變化趨勢，與造成此現象的原因，下列何者敘述正確？
  options:
  - label: A
    content: 增加，超抽地下水地層下陷
  - label: B
    content: 增加，全球暖化海平面上升
  - label: C
    content: 減少，沿海設置水泥消波塊
  - label: D
    content: 減少，附近河川沉積物減少。
  group_stem: '◎「靠山吃山、靠海吃海」是臺灣常見的人地互動關係連結，「看天吃飯」也是農業受環境影響大的寫照。臺灣西部海岸受到河流帶來的沉積物堆積，擁有廣大的潮間帶(指平均高潮位線至平均低潮位線之間的範圍)，浮游生物豐富。某地的蚵仔養殖在潮間帶的範圍內，將一根根的竹竿插入潮埔裡，再將蚵條綁在樁上。當漲潮時，蚵仔就會濾食海水中的浮游生物而生長。附圖三為2015
    年與2021 年該地海岸地區的等高線地形圖，附表一為該地的潮位資料。請回答下列問題：


