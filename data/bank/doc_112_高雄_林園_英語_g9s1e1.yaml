    \ the haunted house. Although the haunted house was so scary that it made their\
    \ hair stand on end, most people  \n   came out feeling happier and less tired.\
    \ Dr. Margee Kerr and her team found out that getting scared is like doing exercise.\
    \  \n   It helps lower（降低）brain activities, so people can be less worried. The\
    \ study also showed that being afraid can help put  \n   people in good mood（心情）."
