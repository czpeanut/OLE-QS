  stem: 國界的劃分會形成一種分割，無論是有形的山脈、河川阻隔，或是無形的政治與經濟體制差異等，都會造成鄰國間往來的障礙。目前，已有部分地區透過政策實施，打破國界的限制，促進國家間人員、貨物與資金的自由流通，如圖(三)甲區內所形成的區域整合體。請問：甲區推行下列何種政策來減少人員與貨物流通的障礙？
