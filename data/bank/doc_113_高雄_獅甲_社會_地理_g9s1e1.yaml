  section: 1
  number: 7
  type: single
  page: 1
  stem: 法國是七大工業國家組織(G7)的成員國，其鐵礦蘊藏豐富，在政府與企業的合作下，發展鋼鐵、汽車、高速鐵路、航空與通訊等工業。同時，法國也是歐洲能源大國，自一九七○年代起大規模建造核能反應爐，是全球僅次於美國的核能大國。由圖(五)的訊息可知，法國的供電結構在西元1981
