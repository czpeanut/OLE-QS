- id: doc_113_高雄_獅甲_社會_地理_g9s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '權威雜誌《美國新聞與世界報導》(US News and World Report)公布的飲食建議排名，以「地中海飲食(Mediterranean
    diet)」奪冠。研究指出，地中海飲食不僅能抗發炎、長壽、護心，還能預防失智症。而在地中海飲食之外，近年又興起了「新北歐飲食(The Nordic diet)」的風潮，兩著蔚為健康飲食界流行的當紅飲食新法。所謂的地中海飲食和新北歐飲食，概念上其實相當接近，皆強調攝取在地食材，並以多食天然蔬果、魚類和植物油為主軸。下表(一)為有關上述兩種飲食法的地理環境比較，何者「有誤」？


    表(一)

    | | (A)地理位置 | (B)氣候特徵 | (C)農業 | (D)在地食材代表 |

    | :--- | :--- | :--- | :--- | :--- |

    | 地中海飲食 | 南歐地區 | 夏乾冬雨 | 以耐旱作物為主 | 香料、橄欖油 |

    | 新北歐飲食 | 北歐地區 | 西南沿海地區全年有雨 | 以麥類為主 | 魚類、葡萄酒 |'
  options:
  - label: A
    content: 地理位置
  - label: B
    content: 氣候特徵
  - label: C
    content: 農業
  - label: D
    content: 在地食材代表
