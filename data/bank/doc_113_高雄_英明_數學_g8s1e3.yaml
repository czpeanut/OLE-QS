  stem: 比較方程式 $16x^{2}=0$ 和 $x^{2}=x$ 的解，下列何者正確？
  options:
  - label: A
    content: 兩個方程式的解皆是 $x=0$(重根)
  - label: B
    content: 兩個方程式有一個解相同，而這個相同的解是 $x=0$
  - label: C
    content: 兩個方程式有一個解相同，而這個相同的解不是 0
  - label: D
    content: 兩個方程式的解都不相同
