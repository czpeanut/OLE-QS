- id: doc_113_高雄_英明_數學_g8s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '下列敘述中，有幾項是正確的?

    ① $1+(3x-5)^{2}=4+3x^{2}$ 是一個一元二次方程式。

    ② 若方程式 $(2x+1)(x+2)=1$，則 $2x+1=1$ 或 $x+2=1$。

    ③ 解方程式 $(x+5)(x+6)=(x+5)(2x+3)$ 時，等號兩邊可同時先將 $(x+5)$ 消去，求得此方程式的解為 $x=3$。

    ④ 解一元二次方程式 $(x-5)^{2}=9$ 時，等號兩邊開根號得 $x-5=3$，所以 $x=8$。'
  options:
  - label: A
    content: 0 項
  - label: B
    content: 1 項
  - label: C
    content: 2 項
  - label: D
    content: 3 項
