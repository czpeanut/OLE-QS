  type: single
  page: 1
  stem: 〈湖心亭看雪〉文中「天與雲、與山、與水，上下一白」，是由上而下的觀察方式寫景。下列選項，何者未使用相同手法？
  options:
  - label: A
    content: 千山鳥飛絕，萬徑人蹤滅。孤舟簑笠翁，獨釣寒江雪
  - label: B
    content: 春眠不覺曉，處處聞啼鳥。夜來風雨聲，花落知多少
  - label: C
    content: 上下天光，一碧萬頃；沙鷗翔集，錦鱗游泳
  - label: D
    content: 亂石崩雲，驚濤裂岸，捲起千堆雪。
  lesson_raw:
    title: 湖心亭看雪
