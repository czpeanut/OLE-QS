- id: doc_113_新北_五峰_國文_g9s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 關於〈喂—出來！〉一文的文意，下列敘述何者錯誤？
  options:
  - label: A
    content: 結局寫到「一粒小石子在工人面前一略而過，工人竟沒發現」，這與老人說「這樣會有報應」，形成暗示性的呼應
  - label: B
    content: 填洞一事，村民有點擔心，但商人保證「幾千年都不會造成危害」，最後大家之所以同意，是因為有利可圖。
  - label: C
    content: 「喂─出來！」的喊聲第二次出現，是年輕人聽到自己的回音，但他並未察覺異樣
  - label: D
    content: 本文中，消失的小神社具有「失去傳統道德與信仰」的暗示，也隱喻了故事可能的結局。
  lesson_raw:
    title: 喂—出來！
    basis: 題目直接提及篇名〈喂—出來！〉
