- id: doc_113_新北_五峰_國文_g9s1e3_s2_32
  section: 2
  number: 32
  type: single
  page: 3
  stem: 根據文意脈絡判斷，上文的畫線處應填入下列何者最恰當？
  options:
  - label: A
    content: 他的病情急轉直下，墜入無底的黑暗深淵
  - label: B
    content: 他只是持續著喃喃細語，沮喪地低著頭
  - label: C
    content: 他的眼睛仍然張開向著前方，堅定地看著
  - label: D
    content: 他的雙腳不安地顫抖著，一步也踏不出去。
  group_stem: '那些因視力問題而住院的新病人，我都盡量做了眼底檢查。健康人的眼底，視神經盤明亮如滿月，圍繞一圈光暈，幾根枯枝橫過夜空，那是眼底的血管，像一個乾淨晴朗的夜晚。

    有些夜晚出現烏雲，那或許是糖尿病造成的出血病變；甚至大片雲層席捲而來，裡頭風雷隱隱，則必須考慮視網膜剝離的可能性。青光眼、血管炎、甚至連顱內壓力升高，都有各自的隱喻；在有經驗的醫師眼中，水晶球背後每一絲天光雲影，仔細捕捉，都可以占卜疾病的未來吉凶。

    我遇過一個年輕病人，急性雙側視網膜剝離，他的視網膜在眼底鏡下開了大蓬大蓬的暗色的花。他的病史究竟是如何，我已經忘記了，只記得他下床的時候，那是一種在黑暗中緩慢前進的姿態，盡可能延展自己的感官，像冬夜下床赤著腳摸索拖鞋的樣子。他的眼球完好，卻沒有視覺，空洞的眼神似乎沒有什麼東西能夠填滿；但                       ，彷彿一直往前走，就將會穿過隧道，有光在不遠處等著他。

    ──阿布〈眼底的風景〉'
  tags:
    chapter:
      publisher: 康軒
      book: 九上
      subject: 國文
      code: 第九課
      title: 喂──出來！
      chapter: null
    textbook: 九上 第九課 喂──出來！
    labeled_by: ai
