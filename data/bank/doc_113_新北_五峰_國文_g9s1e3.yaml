- id: doc_113_新北_五峰_國文_g9s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 「在人們的心中，如果還存在著對生命的慎重，對天地的感謝，對萬物的敬愛與珍惜，便一定存在著這香煙繚繞的桌案吧。雖然簡陋到不能再簡陋，在我的記憶中，卻如同華貴莊嚴的神庥俎豆。」關於〈無關歲月〉這段文字的含意，下列敘述何者正確？
  options:
  - label: A
    content: 華貴的俎豆遠不如簡陋的桌案更能表達虔誠
  - label: B
    content: 供桌上豐盛或簡樸，無關對生命的真誠敬重
  - label: C
    content: 簡單惜物的祭祀才能實際表達對天地的感謝
  - label: D
    content: 祭拜儀式必須香煙繚繞華貴莊嚴，才是虔誠。
  lesson_raw:
    title: 無關歲月
    basis: 題目直接提及篇名〈無關歲月〉
  tags:
    chapter:
      publisher: 康軒
