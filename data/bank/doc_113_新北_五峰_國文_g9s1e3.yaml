- id: doc_113_新北_五峰_國文_g9s1e3_s2_30
  section: 2
  number: 30
  type: single
  page: 2
  stem: 根據甲、乙兩文，梅花書屋與不二齋兩者環境的共同特色為何？
  options:
  - label: A
    content: 竹林綿延
  - label: B
    content: 繁花錦簇
  - label: C
    content: 雪景清幽
  - label: D
    content: 蔭涼清爽。
  group_stem: '(甲) 老屋傾圮，余築基四尺，造書屋一大間。旁廣耳室①，設臥榻。前後空地，後牆根植西瓜瓤大牡丹三株，花出牆上，歲滿三百餘朵。壇前西府②二樹，花時積三尺香雪。窗外竹棚，密寶相③蓋之。階下翠草深三尺，秋海棠疏疏雜入。前後明窗，寶相西府，漸作綠蔭，爽快宜人。余坐臥其中，非高流佳客，不得輒入。

    ──改寫自張岱〈梅花書屋〉

    (乙) 不二齋，高梧④三丈，翠樾⑤千重，牆西稍空，臘梅補之，但有綠天，暑氣不到。後窗牆高於檻，方竹數竿，瀟瀟灑灑，鄭子昭「滿耳秋聲」橫披一幅。天光下射，望空視之，晶沁如玻璃、雲母，坐者恒在清涼世界。

    ──張岱〈不二齋〉


    註解：①耳室；正房兩旁的小屋 ②西府：指西府海棠 ③寶相：花名，薔薇的一種 ④梧：指梧桐，樹名 ⑤樾：音ㄩㄝˋ，樹蔭'
