- id: doc_113_新北_五峰_國文_g9s1e3_s2_36
  section: 2
  number: 36
  type: single
  page: 3
  stem: 「王羲之的帖，其實是散文詩，往往比有格律的詩句還耐讀。」這句話的主要含意為何？
  options:
  - label: A
    content: 王羲之不追求格律的創作精神，深深更受世人敬重
  - label: B
    content: 王羲之文字跳脫格律但意境高遠，更值得細細品味
  - label: C
    content: 王羲之善於在帖文中抒發人生感悟，引起世人共鳴
  - label: D
    content: 王羲之人品高尚，作品展現了他的風範，深受推崇。
  group_stem: '在東部一所大學校園駐校，上完課，恰好雨後初晴，從校門口可以眺望到不遠處一大片蒼翠雄渾的山，山間交錯著變滅的雲嵐。雲從山谷裡升起，像一朵一朵蓮花，升到高處，緩緩四散而去。從校門左轉出去，開車四十分鐘，可以過砂卡礑、溪畔、寧安，過靳珩橋，到一處我常去的叫布洛灣的平台，有散落在平台間約二十間簡單樸素民宿。忽然覺得應該上山，聽雨後千山萬壑間的流泉入睡，第二天可以早起看山，因為隔天沒有事，可以看一整天的山。

    上海博物館新近收到流失到美國的《淳化閣帖》北宋拓本的殘卷，其中第六卷有王羲之的「適得帖」，剛好朋友送了一冊極精的印本，我就帶著「適得帖」上山。

    入睡前在燈下細看「適得帖」的線條轉折，很像雲嵐的變滅，也像水聲，朦朧間讀到「靜佳眠」三個字，便在萬籟闃寂間睡去。

    日出前，山極靜寂。天地間一大黑塊，稜線起伏，一條充滿彈性張力的線，像蹲伏的野獸的背脊，蓄勢待發。

    真正的寂靜，正是蓄勢待發。內在沒有飽滿的生命，內在沒有渴望，沒有追求，沒有要飛撲起來的狂喜，或許是不會懂得什麼是真正的寂靜的。

    破曉時山間的嬰啼，是群鳥的喧嘩。一樹一樹的鳥聲，此起彼落，彷彿配合明度一點一點增強的曙光，喧嘩的聲音也逐漸擴大。被晨光吵醒的鳥們越來越多了，從低迴試探的一兩聲呢喃啁囀，逐步變成壯闊歡欣的合聲呼應，呼應著浩大的黎明之光，彷彿是要呼喚起天地的初始，不得不用全心的肺腑來大聲唱讚。

    昨天夜裡陪伴我入夢的遠遠近近潺潺湲湲的急湍流泉，水聲還在耳邊，但是清晨眾鳥喧嘩，水流的聲音卻都昇華成山谷下冉冉上升的雲嵐煙霧，它們不再流盪奔騰在深壑溪谷，卻一一幻化成初日裡一縷一縷升起的雲。

    「行到水窮，坐看雲起」，水的窮絕之處，就是雲升起的時候。一整天隨水行走，走得氣喘吁吁，筋疲力盡，才想到可以坐下了，可以躺在一片巨石上看雲升起，四野都寂靜，片刻就在石上睡著了。

    王羲之的「適得帖」，很美的句子在雲際迴旋──「宅上靜佳眠」，躺在巨石上睡，四圍都是雲起雲滅，「靜佳眠」三個字也在似睡似醒間。我不自覺將手指在空中旋繞，是法帖裡的「靜佳眠」三個字的線條。像一根纏繞的藤的鬚蔓，像一片無風中墜落的秋天的枯葉，像水波在土岸邊迴旋，像空氣裡一聲歎息的尾音。空中有「靜佳眠」，是雲嵐的舒卷變幻，這三個字原來只是說：這麼靜，可以睡得很好。

    「適得帖」是回答朋友來信，「適得書，知足下問。吾欲中冷，甚憒憒①。向宅上靜佳眠，都不知足下來門。甚無意，恨不蹔②面。羲之。」

    「中冷」兩個字在台北故宮的「何如帖」裡也用到，而且是「中冷無賴」。南朝的歲月，王羲之總讓人覺得他心中寒冷荒涼，百無聊賴，什麼也提不起勁。「中冷」，下面接著「宅上靜佳眠」，彷彿一個小院落裡白日睏睡的畫面。「都不知足下來門，甚無意」，朋友來了，到了門口，都不知道。真是好一個「宅上靜佳眠」。

    王羲之的帖，其實是散文詩，往往比有格律的詩句還耐讀。

    ──改寫自蔣勳〈靜佳眠──適得帖〉


    註解：①憒憒；音ㄎㄨㄟˋ，煩悶，憂愁的樣子 ②蹔：音ㄓㄢˋ，同「暫」。'
