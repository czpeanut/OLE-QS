  group_stem: '夫臨高遠視，心意之快也，晴澄雨昏，峰嶺之顛也，心意快而笑歌發，峰嶺明而氣象歸，其近則草樹之煙綿，溪水之澄鮮，銜鱗①翩來，的的②有光，掃黛③侍側，嫵嫵發秀，有趣若此，樂亦由人。何則？景雖常存，人不常暇，暇不計其事簡，計其善決；樂不計其得時，計其善適。能處是而覽者，豈不暇不適者哉？吾不信也。

    ──梅堯臣〈攬翠亭記〉

