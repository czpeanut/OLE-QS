- id: doc_113_新北_五峰_國文_g9s1e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 晚明小品是興起於明代晚期的文學體裁，下列關於晚明小品敘述，何者錯誤？
  options:
  - label: A
    content: 內容以表達個人心情，抒發生活雜感為主
  - label: B
    content: 風格自由活潑，文字清麗可喜，可信筆直書
  - label: C
    content: 注重聲調和諧，形式對稱，且多用典故
