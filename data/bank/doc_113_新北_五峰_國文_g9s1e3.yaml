  stem: 關於〈喂—出來！〉一文，下列敘述何者正確？
  options:
  - label: A
    content: 批判人類一味破壞環境，卻缺乏解決問題的行動和勇氣
  - label: B
    content: 「無底洞」為全文主線，描述人們盲目自卑又自以為是
  - label: C
    content: 作者仿新聞報導的手法，詳實報導此一真實社會事件
  - label: D
    content: 「越來越美的都市天際線」代表村民越來越重視居住品質。
