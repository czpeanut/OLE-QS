- id: doc_113_高雄_獅甲_社會_公民_g8s2e1_s1_35
  section: 1
  number: 35
  type: single
  page: 1
  stem: 現代公民社會中，人民有許多政治參與的機會，《憲法》也保障人民各種不同政治參與方式的權利。下列何種政治參與的方式不屬於參政權？
  options:
  - label: A
    content: 加入政黨成為黨員
  - label: B
    content: 登記參選地方公職
  - label: C
    content: 提案連署公民投票
  - label: D
    content: 發起罷免立法委員
- id: doc_113_高雄_獅甲_社會_公民_g8s2e1_s1_36
  section: 1
  number: 36
  type: single
  page: 1
  stem: 我國司法院於2020 年宣告《刑法》第239 條「通姦罪」與《刑事訴訟法》第239 條但書「可單獨對通姦配偶撤告」違反比例及平等原則，也有違《憲法》保障性自主權的意旨，因此兩條法律應自解釋公布日起失效。前述「性自主權」雖非《憲法》列舉的基本權利，但仍受《憲法》第22
    條保障。下列何者同樣屬於這類權利？
  options:
  - label: A
    content: 生存權
  - label: B
    content: 環境權
  - label: C
    content: 表現自由
  - label: D
    content: 應考試權
- id: doc_113_高雄_獅甲_社會_公民_g8s2e1_s1_37
  section: 1
  number: 37
  type: single
  page: 1
  stem: 欣元今年十九歲，因心智缺陷、不能處理日常生活事務，目前受法院監護宣告。下列關於欣元目前狀態的敘述，何者最合理？
  options:
  - label: A
    content: 只要得到監護人同意，欣元仍可以自行購買日用品
  - label: B
    content: 欣元的行為能力與受法院判處褫奪公權者是一樣的
  - label: C
    content: 欣元若有侵權行為，法定代理人需負連帶賠償責任
  - label: D
    content: 無論是選舉投票或全國公民投票，欣元都不能參加
- id: doc_113_高雄_獅甲_社會_公民_g8s2e1_s1_38
  section: 1
  number: 38
  type: single
  page: 1
  stem: 淓儀拿著積存多年的壓歲錢購買最新的iPhone 手機，卻遭到父母反對，並立刻陪同淓儀返回店家要求退貨。根據我國法律規定，就淓儀的年齡而言，此項契約須經法定代理人同意才具備效力，因此店家只能接受父母的要求，讓淓儀辦理退貨。根據上述內容判斷，下列敘述何者最合理？
  options:
  - label: A
    content: 以年齡來說，淓儀有可能可以參與公民投票
  - label: B
    content: 淓儀購買早餐、搭公車的行為也需父母同意
  - label: C
    content: 淓儀如果自己向房東簽租屋契約，必定無效
  - label: D
    content: 淓儀可以收受一萬元獎學金且不需父母同意
- id: doc_113_高雄_獅甲_社會_公民_g8s2e1_s1_39
  section: 1
  number: 39
  type: single
  page: 1
  stem: '以下這則新聞報導中的挖空處，最有可能是什麼概念或原則？


    約定肉償契約無效 主張債權才能討錢

    游姓男子借48 萬元給方姓女子，約定以性行為抵債。曾任檢察官的王律師表示，依照我國民情對「性」的認知，這不能拿來當作履約的手段，亦即違反＿＿＿＿＿，所以此類合約應屬無效。

    王律師還說，如果性行為被當成有效合約的標的，屆時一方不願履行責任，難不成法院可以強制執行雙方發生性行為嗎？故民眾私下簽訂「分手砲」、包養一個月性愛幾次等契約，法律上全部都是無效的。'
  options:
  - label: A
    content: 善良風俗
  - label: B
    content: 消滅時效
  - label: C
    content: 誠實信用原則
  - label: D
    content: 契約自由原則
- id: doc_113_高雄_獅甲_社會_公民_g8s2e1_s1_40
  section: 1
  number: 40
  type: single
  page: 1
  stem: '表（一）是某地方法院累計去年度民事訴訟上已終結的案件數，某家電視台的記者引用此份資料來製作新聞報導，下列在該篇新聞報導內的說法，何者最合理？


    ▲表（一）

    | 項目 | 類型 | 案件數 |

    | :---: | :---: | :---: |

    | 甲 | 借貸 | 73,489件 |

    | 乙 | 買賣 | 8,808件 |

    | 丙 | 婚姻 | 5,263件 |

    | 丁 | 租賃 | 3,046件 |

    | 戊 | 遺產 | 1,696件 |'
  options:
  - label: A
    content: 從案件數最高的類型可知，誠實信用原則已從民眾生活消失殆盡
  - label: B
    content: 丙類案件依法需以書面契約加上登記，以達對外公開明示的效果
  - label: C
    content: 甲、乙、丁、戊案件皆屬於債權人與債務人之間的權利義務糾紛
  - label: D
    content: 身分關係上的紛爭成為近年民事訴訟主流，平時應盡量關心家人
- id: doc_113_高雄_獅甲_社會_公民_g8s2e1_s1_41
  section: 1
  number: 41
  type: single
  page: 1
  stem: 在一場高中辯論大賽當中，各組隊伍針對某些法規政策是否符合實質平等原則為題目進行辯論。以下是其中四個隊伍在辯論時提到的例子，哪一個隊伍提出的例子符合實質平等原則？
  options:
  - label: A
    content: 花蓮縣秀林鄉公所編列三千萬經費，普發秀林鄉民每人兩千元
  - label: B
    content: 確診武漢肺炎而在段考期間請假的學生，補考成績打七折計算
  - label: C
    content: 通過族語認證的原住民族學生可以在升學時加分百分之三十五
  - label: D
    content: 無論是男性還是女性，都可以在子女未滿三歲之前申請育嬰假
- id: doc_113_高雄_獅甲_社會_公民_g8s2e1_s1_42
  section: 1
  number: 42
  type: single
  page: 1
  stem: 網路業者推出食品特賣專區，低價促銷即將到期的食品，除了清楚標示保存期限與售價之外，並在宣傳文案上強調：「即將到期，絕不過期！」這樣的做法所體現的原則與精神，與下列何者最為接近？
  options:
  - label: A
    content: 六歲男童騎腳踏車擦撞停在路邊的跑車，父母需代替男童賠償車主
  - label: B
    content: 五金行的店門口貼著一張公告：「小本生意，貨既售出，概不退換」
  - label: C
    content: 借貸的債權人若超過十五年沒有向債務人請求還款，則請求權消滅
  - label: D
    content: 房屋若曾經發生非自然死亡事件，屋主在出售時必須如實告知買家
- id: doc_113_高雄_獅甲_社會_公民_g8s2e1_s1_43
  section: 1
  number: 43
  type: single
  page: 2
  stem: 17 歲的蕙菱某天自己去應徵一家網路電商的小幫手，雇主與她當面簽訂了工作契約，但事後這份契約被視為無效。下列哪一種理由最有可能是它無效的原因？
  options:
  - label: A
    content: 該契約約定的薪資低於最低基本工資
  - label: B
    content: 簽訂工作契約時雙方僅簽名但未蓋章
  - label: C
    content: 蕙菱只有帶家長同意書但家長未陪同
  - label: D
    content: 雇主販售商品時未與顧客簽書面契約
- id: doc_113_高雄_獅甲_社會_公民_g8s2e1_s1_44
  section: 1
  number: 44
  type: single
  page: 2
  stem: 甲、乙、丙分別是什麼？
  options:
  - label: A
    content: 甲：訴願，乙：申訴，丙：上訴
  - label: B
    content: 甲：訴願，乙：請願，丙：訴訟
  - label: C
    content: 甲：請願，乙：訴願，丙：訴訟
  - label: D
    content: 甲：請願，乙：訴訟，丙：訴願
  group_stem: '祁家威先生是我國的性別平權運動者。在我國同性婚姻合法化之前，他曾經多次嘗試透過各種程序與同性登記結婚。1986 年，他到臺北地方法院公證結婚遭到拒絕，於是他便向立法院提出（甲），希望立法委員能修法讓他可以結婚，卻仍遭拒絕。2013
    年，他與當時的同性伴侶到臺北市的戶政事務所登記結婚，結果被戶政人員以「結婚必須一男一女」為由，再度被拒。祁家威認為戶政事務所的這項處分讓他權益受損，於是向臺北市政府提出（乙）；遭到駁回後，他再向法院提起（丙）。可惜最後判決的結果依然讓他失望。


    不過祁家威並不因此氣餒，2015 年在民間團體與律師們的協助下，他向司法院聲請釋憲。2017年，司法院受理他的聲請，並在同年的5 月24 日作出《司法院釋字第七四八號解釋》。該解釋認為，當時某部法律只讓不同性別的二人之間得以締結婚姻，卻未讓相同性別的二人得以締結婚姻，與《憲法》保障某項基本權利的意旨有違，因此認定相關規定違憲。該解釋要求立法機關應該要在兩年內處理，以便保障同性伴侶的權益。


    兩年後，立法院長蘇嘉全在「國際不再恐同日」（5 月17 日）當天敲下三讀的法槌，臺灣也就此成為亞洲第一個同性婚姻合法的國家。自稱「等這天等了四十一年多」的祁家威以及同志族群們，終於可以和心愛的人結婚了。'
- id: doc_113_高雄_獅甲_社會_公民_g8s2e1_s1_45
  section: 1
  number: 45
  type: single
  page: 2
  stem: 2015 年祁家威聲請釋憲時，《憲法訴訟法》尚未修正實施，因此司法院解釋憲法的方式與現今有所不同。假設祁家威在2025 年的現在聲請釋憲，司法院會以什麼方式進行憲法審查？
  options:
  - label: A
    content: 大法官以會議方式表決
  - label: B
    content: 大法官以憲法法庭審理
  - label: C
    content: 公告半年後選舉人複決
  - label: D
    content: 司法院長會同總統審查
  group_stem: '祁家威先生是我國的性別平權運動者。在我國同性婚姻合法化之前，他曾經多次嘗試透過各種程序與同性登記結婚。1986 年，他到臺北地方法院公證結婚遭到拒絕，於是他便向立法院提出（甲），希望立法委員能修法讓他可以結婚，卻仍遭拒絕。2013
    年，他與當時的同性伴侶到臺北市的戶政事務所登記結婚，結果被戶政人員以「結婚必須一男一女」為由，再度被拒。祁家威認為戶政事務所的這項處分讓他權益受損，於是向臺北市政府提出（乙）；遭到駁回後，他再向法院提起（丙）。可惜最後判決的結果依然讓他失望。


    不過祁家威並不因此氣餒，2015 年在民間團體與律師們的協助下，他向司法院聲請釋憲。2017年，司法院受理他的聲請，並在同年的5 月24 日作出《司法院釋字第七四八號解釋》。該解釋認為，當時某部法律只讓不同性別的二人之間得以締結婚姻，卻未讓相同性別的二人得以締結婚姻，與《憲法》保障某項基本權利的意旨有違，因此認定相關規定違憲。該解釋要求立法機關應該要在兩年內處理，以便保障同性伴侶的權益。


    兩年後，立法院長蘇嘉全在「國際不再恐同日」（5 月17 日）當天敲下三讀的法槌，臺灣也就此成為亞洲第一個同性婚姻合法的國家。自稱「等這天等了四十一年多」的祁家威以及同志族群們，終於可以和心愛的人結婚了。'
- id: doc_113_高雄_獅甲_社會_公民_g8s2e1_s1_46
  section: 1
  number: 46
  type: single
  page: 2
  stem: 《司法院釋字第七四八號解釋》認定當時的某部法律違憲。下列哪一事項最可能也規範在該部法律裡？
  options:
  - label: A
    content: 企業在徵募員工時不得對性別有差別待遇
  - label: B
    content: 未經正當法律程序，人民不得受逮捕拘禁
  - label: C
    content: 遭受家庭暴力者可依法向法院聲請保護令
  - label: D
    content: 債權人可以對未履行債務者要求損害賠償
