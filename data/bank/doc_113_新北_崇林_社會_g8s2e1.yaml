- id: doc_113_新北_崇林_社會_g8s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 請問從以上文章中知道,孫中山先生是採取了甚麼作法?
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 己
  - label: D
    content: 庚
  group_stem: '我們從前何以從事於有組織、有系統、有紀律的奮鬥?因為未有模範,未有先例之故。現在一位好朋友鮑羅庭是從俄國來的,......蓋俄國革命之成功,一方面是因黨員積極奮鬥,二方面又有兵力幫助,故吾等欲革命成功,要學俄國組織及訓練黨員的方式,方有成功的希望。......所以我請鮑羅庭做吾黨的訓練員,使之訓練吾黨同志,鮑羅庭辦黨極有經驗,望各同志犧牲自己的成見,誠意去學他的方法。

    資料來源:孫文。要靠黨員成功不專靠軍隊成功。民國 12 年 11 月 25 日在廣州大本營演講。國父全集第二冊。

    題目選項

    (甲)聯俄容共 (乙)南北政府分裂 (丙)武漢分共,結束與共黨的合作 (丁)寧漢分裂 (戊)北伐開始

    (己)清黨(庚)黃埔軍校成立'
