    之出席，及出席立委4 分之3 之決議，始能提出憲法修正案。近期立法院審查大法官提名人何賴傑人事案時，有立委詢問過去台灣各黨派共識推動18 歲公民權，但到了公民複決那關，卻因為公投票數未過半而遭否決，認為目前現行修憲門檻過高難如登天，何賴傑坦言，目前修憲訂出的門檻標準確實過高，但放寬修憲程序及門檻事關重大，仍需謹慎討論。【聯合新聞網2025-01-26、中央廣播電台2024-12-11】
