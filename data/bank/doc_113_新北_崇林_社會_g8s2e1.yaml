  stem: 上述四個宣言，請依發生時間先後順序排列
  options:
  - label: A
    content: 甲乙丙丁
  - label: B
    content: 乙甲丙丁
  - label: C
    content: 乙丁甲丙
  - label: D
    content: 乙丙丁甲
  group_stem: '資料甲：中國數千年以來，習於君主專制體制，各地學校短缺，大多數之人民智識不甚高尚，人民更缺乏參與政治之能力，四年以前，由專制一變而為共和，此番變動太快，難望有良好結果⋯⋯中國將來必因總統繼承問題「釀成禍亂」⋯⋯如一時不立即撲滅禍亂，可能導致敗壞中國之獨立⋯⋯中國如用君主制，較共和制為宜，此殆無可疑者也。

    西元1915 年8 月20 日發表於北京每日新聞(習作L1)

    資料乙：孫中山誓詞（白話意譯）推翻滿清專制政府，鞏固中華民國，謀取民生幸福，是國民整體的意志，我將遵從該意志，忠於國家、為民服務。直到專制政府遭推翻、國內和平，中華民國獨立自主於世界，並受各國承認之時，我將卸下臨時大總統的職位。在此向國民發誓。

    資料丙：袁世凱誓詞（白話意譯）中華民國才剛開始建設，有很多事情還需要興辦、治理，我深深期望能夠竭盡全力，發揚民主共和精神，洗去專制的影響，遵照臨時約法，並依照國民的願望，讓國家成為安全、完好、堅固的地方，讓五大民族共同享有快樂與利益。為了此一目標，將遵循禮法不逾越。等到召集國會，選出第一任大總統後，我隨即辭職。在此向同胞發誓。

    資料丁：不意「宋案」發生，袁氏陰謀一旦盡揭。使袁氏果知公義自在，輿論難誣，即當引咎辭職，以謝國民。何圖袁氏轉為私謀，倒行不已，以致東南人民荷戈而逐，旬日之內相連併發。「告全體國民促令袁氏辭職宣言」'
