    多年過去，內政部仍堅持不變更該函釋。自2021 以來，迄今已累積多件行政法院判決認為內政部97函釋違憲，而且前大法官詹森林及現任大法官暨司法院代理院長謝銘洋於出具之意見書也認定內政部97
