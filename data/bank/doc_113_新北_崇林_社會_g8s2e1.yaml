  stem: 根據上文，第十五步兵團介入中國內戰，間接保護天津民眾安全，當時中國的主要政治情況為何？
  options:
  - label: A
    content: 立憲派與革命派爭論不休，滿清帝制搖搖欲墜
  - label: B
    content: 地方軍事強人憑藉武力以奪取地盤，割據一方
  - label: C
    content: 日本扶植汪精衛政權，對抗在重慶的國民政府
  - label: D
    content: 國民黨與共產黨不斷衝突，共黨全面控制中國。(109 會考)
  group_stem: 1900 年，在慈禧太后默許民眾攻擊教堂及傳教士，甚至包圍北京的外國使館後，美軍第十五步兵團首次被派遣至中國保護僑民。清朝滅亡後，步兵團為確保美國人在華利益，長期駐守天津。袁世凱死後至北伐完成期間，中國內戰不斷，步兵團為避免動亂影響美國的利益，也曾介入其中，間接保護了天津民眾的安全。後來，當日本在今日北京附近發動侵華的軍事行動，與中國爆發戰爭，美國政府不願捲入戰局，因此決定撤離第十五步兵團，結束多年的派駐。
