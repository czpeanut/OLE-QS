    次預售屋買賣定型化契約查核，對於契約內容不合規定的建商，消保處已請內政部地政司督導各直轄市、縣市政府地政局處依《平均地權條例》裁處6 萬元以上、30 萬元以下罰鍰，本次查核共計裁處234
    萬元。消保處呼籲，建商應依照「預售屋買賣定型化契約應記載及不得記載事項」之規定，擬定各項契約條款，切勿刻意隱瞞重要消費資訊，影響消費者判斷（甲）；亦不得以「（乙）」為名，增列「預售屋買賣定型化契約應記載及不得記載事項」所無且不利於消費者之契約條款。【地產王2025-03-06】
