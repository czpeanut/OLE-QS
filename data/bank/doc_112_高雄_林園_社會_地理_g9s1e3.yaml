    個島嶼，大部分都有人居住，也有幾個島嶼上面都有甲時代的神廟遺址。而的的喀喀湖最出名的就是數十座漂浮在湖上，用蘆葦草鋪成的人工島嶼。到目前那些島上還有人在上面居住，形成很特殊的景色。'
