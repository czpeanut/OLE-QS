  stem: '某書介紹特殊的葉片標本之製作方法，如右表。根據上表推測，此葉片標本留存的構造原本應具有下列何種功能？


    | 步驟 | 製 作 過 程 |

    | :---: | :--- |

    | 一 | 將葉片浸泡於 $\text{NaOH}$ 溶液中，並加熱一段時間。 |

    | 二 | 以鑷子夾出葉片，再用刷子去除葉片的表皮及葉肉組織。 |

    | 三 | 將葉片留存的部分以重物壓平、乾燥，即得到成品。 |'
  options:
  - label: A
    content: 運送養分
  - label: B
    content: 供氣體進出
  - label: C
    content: 防止水分散失
  - label: D
    content: 可產生有機養分
