  group_stem: 'Anna Jarvis was an American, and she had a very kind mother. At that
    time, there was a war in America. Because many people got hurt in the war, Anna’s
    mother went to the hospital and took care of them. To make people show their love
    to each other, Anna started “Mother’s Friendship Days” after the war.


    Anna loved her mother very much and she always helped her with the housework.
    However, Anna’s mother died on the second Sunday of May in 1905 and she was very
    sad about this. In 1907, she asked the government to make a holiday to remember
    her mother and those poor people. In 1914, the day became a national holiday and
    all the people in the USA celebrated it with a lot of activities.


    On Mother’s Day, children say thanks to their mothers in many different ways.
    Some may make beautiful cards and draw pictures of their mothers. Some may help
    with the housework, like doing the dishes, taking out the garbage, or washing
    cars. Many children even send carnations to their mothers. How about you? Don’t
    forget to show your love to your mother on this special day.


    📖 war 戰爭 hurt 受傷 die 死亡 government 政府 remember 記得 national 國家的 celebrate 慶祝 activity
