  group_stem: 'Dolphins in Laguna, a town in Brazil, are helping fishermen with their
    work. As they swim, the dolphins collect groups of fish near the fishermen. When
    the group is big enough, the dolphins make a sign with their heads or tails. This
    way, the fishermen know when to throw their nets.


    This shows that dolphins can work together, and work with people. It also shows
    that dolphins are intelligent because they learn to do it by themselves. Dolphins
    know one thing: when they help the fishermen, they also get more fish to eat.


    Scientists studied dolphins in Brazil for two years. They are interested in this
    fact because not every dolphin wants to help. This means that dolphins are like
