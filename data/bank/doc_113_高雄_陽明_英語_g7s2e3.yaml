  group_stem: 'In Japan, people love to watch cherry blossoms in spring. This is called
    hanami. Most people think hanami is just for fun and enjoying the flowers. But
    there is an interesting story!


    Long ago, in the Edo period(江戶時代), the government wanted to build riverbanks near
    rivers. However, they didn’t have enough money to build all the riverbanks and
    make them strong enough. The government decided to plant cherry trees near rivers
    and asked people to come and walk there. Why? Because when many people walked
    on the ground, the soil became harder and this helped make the riverbanks strong.
    So, hanami was not only for fun—it also helped protect the land!


