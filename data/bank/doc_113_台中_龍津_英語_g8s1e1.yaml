    content: A cookie shop.
  - label: B
    content: A strange clerk.
  - label: C
    content: Her favorite food.
  - label: D
    content: British English.
  group_stem: 'Dear Hanna,

    How are you doing? This spring, I traveled to the UK with my family. We visited
    many places and ate different foods. It was a lot of fun.

    Everyone speaks English in the UK, so I could practice English there. But sadly,
    I could not understand them sometimes. You know, we all study American English
    in Taiwan, but in the UK, people don''t really speak that way. For example, we
    say candy and cookies, but the British people say sweets and biscuits. One time,
    I saw some yummy chocolate cookies in a shop, and I said to a young clerk there,
    "Can you give me ten cookies?" And he said, "What do you mean? Sorry, we only
    sell biscuits here." Anyway, British English is really different from American
    English.

    How was your trip to Australia? Did you have a good time there? See you soon!

    Love,

    Lydia


    📖 could能夠 understand 理解

    British英國的 sweets甜點 biscuits餅乾'
