  - label: B
    content: Summer.
  - label: C
    content: Fall.
  - label: D
    content: Winter.
  group_stem: 'In Taiwan, we have summer from June to August, and we have winter from
    December to February. But in the southern hemisphere, the weather is not the same.

    In New Zealand, they can enjoy the sunny beach on Christmas and wear heavy coats
    in July. Summer in New Zealand is from December to February, and winter is from
    June to August.

    We have four seasons in Taiwan. But in Thailand, it''s hot the whole year. For
    people in Thailand, it''s always summer. In Northern Europe, the weather is always
    like in winter, and it''s seldom hot. If you like snowy days, you can go on a
    trip to Northern Europe and have fun.


    📖 southern hemisphere 南半球

    New Zealand 紐西蘭 whole整個的

    if 假如 Northern Europe 北歐'
