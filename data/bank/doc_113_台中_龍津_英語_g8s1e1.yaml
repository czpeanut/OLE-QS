  stem: Which might(可能) be the name of Jackson's club?
  options:
  - label: A
    content: Card Tricks.
  - label: B
    content: Cool Magic.
  - label: C
    content: The History of Magic.
  - label: D
    content: Math and magic.
  group_stem: 'Hello, everyone. Welcome to the club. I''m Jackson Liu. I''m a three-time
    winner of Wow Magic Contest. You all like magic, right? Me, too! When I was a
    kid, my parents took me to a magic show. The magician pulled many animals out
    of his black hat. After that, I thought of magic day and night, so I went to different
    magicians for their tricks. They didn''t teach me for free – my parents gave them
    lots of money for my magic lessons.

    But you guys are very lucky because you can learn a magic trick here every week
    for free. You can also design your own tricks and show them to me.

    Okay, let''s start our first lesson with an old magic trick. In my hand, there
    is a tall black hat. It is empty, right? Now watch. I''m turning it over. Ta-da!
    Now we have a cute rabbit in the hat!


    📖 contest比賽 magician 魔術師 trick 戲法

    hat帽子 empty 空的 turn... over 翻轉'
