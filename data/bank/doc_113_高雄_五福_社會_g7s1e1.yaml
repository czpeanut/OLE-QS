  stem: '太平洋諸島的南島語族會利用構樹樹皮製作「樹皮衣」。構樹原本生長在溫帶氣候區與熱帶氣候區之間，廣泛分布在東亞地區。太平洋諸島不適合構樹自然繁殖，因此推論，太平洋諸島的構樹應是跟著人們遷徙而來。學者分析東亞各地構樹後發現，太平洋諸島的構樹，絕大多數與臺灣南部本土構樹擁有相同的特徵，此一特徵證實這些構樹最可能來自臺灣。


    根據上述資料，四個學生搭配課堂上所學的南島語族知識，討論樹皮衣與南島語族的關係，何者說法明顯不適當？'
