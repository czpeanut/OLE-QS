- id: doc_113_高雄_五福_社會_g7s1e1_s1_31
  section: 1
  number: 31
  type: single
  page: 4
  stem: 根據同酬日的定義與文中內容，下列分析與因應策略何者較適切？
  options:
  - label: A
    content: 政府須立法提高女性的基本工資以改善同工不同酬現象
  - label: B
    content: 我國兩性勞動力的工資報酬已日趨平等大有改善
  - label: C
    content: 顯示女性在職場的貢獻已得到重視
  - label: D
    content: 雇主應落實性別平等工作法保障性別平權。
  group_stem: '什麼是同酬日？

    ■同酬日是為了突顯男女工資差距的象徵性日子，希望喚起兩性同酬的意識，縮小薪資差距。

    勞動部公布今年台灣「同酬日」為2 月23 日，較去年進步4 天，台灣同酬日是主計總處2023 年「受僱員工薪資調查」的統計結果，台灣女性平均時薪新台幣318
    元，為男性373 元的85.3%，兩性薪資差距為14.7%，換言之，女性需較男性多工作54 天（365 日曆天×14.7%≒54 天），才能達到與男性相同的全年薪資，因此自2024
    年1 月1日起算54 天之2024 年「同酬日」為2 月23 日。評估是住宿餐飲等服務業人力需求高、女性從業人員居多，服務業缺工造成2 度就業女性受到青睞，但距離兩性同工同酬還有很長一段路要走，近年來兩性同酬日及薪資差距的統計，如表（一）。勞動部表示，若與美日韓等國比較，台灣近年的兩性平均薪資差距表現均較為優異（圖一）。


    表（一）

    | 同酬日 | 女性需增加工作天數 | 兩性薪資差距 |

    | :--- | :--- | :--- |

    | 110 年2 月23 日 | 54 天 | 14.8% |

    | 111 年2 月27 日 | 58 天 | 15.8% |

    | 112 年2 月27 日 | 58 天 | 15.8% |

    | 113 年2 月23 日 | 54 天 | 14.7% |


    ■為什麼同酬日這麼難縮小？

    美國經濟學家Claudia Goldin 分析200 多年的美國數據，證明20 世紀初後服務業興盛與避孕藥的出現，讓已婚婦女的就業參與程度開始增加，但女性仍然受到婚姻以及家庭責任的限制，使得全球勞動市場中的女性仍嚴重不足，且收入低於男性。Goldin
    的研究指出，雖然女性的就業比例不斷上升，但兩性的收入差距仍沒有縮小。部分原因是社會對年輕女性的期望是受前幾代人影響，例如希望母親等到孩子長大後才回到就業市場的觀念。

    請回答第31-33 題：'
