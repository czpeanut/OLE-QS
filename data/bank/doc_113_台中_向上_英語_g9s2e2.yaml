  - label: C
    content: c→b→a
  - label: D
    content: b→a→c
  group_stem: "When we see kiwifruits, we usually think they are from New Zealand.\
    \ However, in fact, there were not any kiwifruits there before 1910. Green kiwifruit\
    \ seeds were brought to New Zealand by Mary Isabel Fraser, a principal of a girls’\
    \ school, from China in 1904. They were planted in 1906 by Alexander Allison,\
    \ and the first fruit was produced in 1910. People then thought the fruit tasted\
    \ like a gooseberry, and began to call it “Chinese gooseberry.” New Zealand began\
    \ selling the Chinese gooseberry to America and the UK in the 1950s, but not many\
    \ people liked it because of the strange name. To sell more, it was changed into\
    \ “kiwifruit” because the shape of it is like the bird “kiwi” in June 1959. This\
    \ new name did make the new fruit popular because this kind of bird was only found\
    \ in New Zealand, and it made people think of New Zealand when they ate the fruit.\
    \ In 1991, a new kind of kiwifruit, golden kiwifruit, was developed. In 1997,\
    \ some kiwifruit farmers formed Zespri Company. Since then, all kiwifruits have\
    \ been sold by the name of Zespri.\n   Although New Zealand’s kiwifruits are famous,\
    \ many countries produce a lot of green kiwifruits, too. They are China, Australia,\
    \ Chile, France, Italy, Iran, and Greece. Of them, China produces the most. Golden\
    \ kiwifruit is also planted in some countries, like China, Italy, France, and\
    \ Chile. Perhaps we can see where the kiwifruits come from next time when we choose\
    \ them at the supermarket.\n\n\U0001F4D6 principal 校長 develop 開發 form 組成"
