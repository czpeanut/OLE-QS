  group_stem: "TNC NEWS READER'S OPINION\nA lot of workers are building a new road\
    \ to Shiyawase City. I am happy it will be more convenient to go to Shiyawase\
    \ City from our town although it goes through my orange farm. However, I was told\
    \ Madagascar almonds will be planted along both sides of the road after it is\
    \ finished. If it is so, I think the government should think twice although those\
    \ trees can make the road cooler.\n  Madagascar almond is a deciduous tree. It\
    \ loses all its leaves in winter and brings trouble for people along the road.\
    \ They spend lots of time sweeping the leaves during its leaf-losing days. That\
    \ is why many people in other places ask to cut them down.\nDevil's tree and camphor\
    \ tree are evergreen (having leaves all year round) street trees. They both do\
    \ not lose leaves in fall. But devil’s trees are often cut down, too, because\
    \ their flowers do not smell good. Camphor trees are popular although their flowers\
    \ are very small and not beautiful. The trees of the famous green tunnel in Jiji,\
    \ Nantou, are all camphor trees. If we can plant camphor trees, perhaps we can\
    \ have another green tunnel and make our town be a popular check-in place.\n \
    \ Some people say, “Why not plant golden trumpet trees or bead trees? Their flowers\
    \ are beautiful. Visitors will come to our town during their flower season.” That\
    \ is true, but they also lose their leaves in fall before their flowers bloom.\
    \ Besides, it will be dangerous if there are too many people staying along the\
