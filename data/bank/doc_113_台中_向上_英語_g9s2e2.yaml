- id: doc_113_台中_向上_英語_g9s2e2_s2_22
  section: 2
  number: 22
  type: single
  page: 1
  stem: Why was the Twitter user @cretiredroy not able to get an 11-inch pizza?
  options:
  - label: A
    content: The restaurant didn’t sell 11-inch pizzas.
  - label: B
    content: The waiter didn’t take the right order.
  - label: C
    content: The waiter forgot to give him the pizza.
  - label: D
    content: The restaurant didn’t have enough 11-inch pizzas.
  group_stem: "Pizza Problem Solved with Math\n  Math seems to have nothing to do\
    \ with Italian food. However, one Twitter user @cretiredroy posted about his pizza\
    \ problem, and his post has almost 200,000 likes these days.\n  In his post, the\
    \ man said he ordered an 11-inch pizza at a restaurant. He was given two 6-inch\
    \ pizzas instead because they didn’t have any other larger pizzas left. The waiter\
    \ said that the man was getting an extra inch for free. The man didn’t agree on\
    \ his idea, and he proved the waiter wrong with a math formula. In the end, the\
    \ man proved that two 6-inch pizzas are much smaller than one 11-inch pizza. In\
    \ fact, even three 6-inch pizzas would be less. But how can this be true?\n  @cretiredroy\
    \ used a simple formula for the total area of a circle: $\\pi r^2$. In this formula,\
    \ “$\\pi$” is about 3.1416, and “r” is the radius of the circle. Using this, he\
    \ showed that one 11-inch pizza has an area of 95.03 square inches. One 6-inch\
    \ pizza just has only an area of 28.27 square inches.\n  There was a happy ending\
    \ for @cretiredroy though, when the restaurant owner finally gave him a little\
    \ more than he ordered at first. He wants his followers to learn from his example\
    \ and take math more seriously.\n\n\U0001F4D6 Italian 義大利的 extra 額外的 prove 證明\
    \ formula 公式\narea 面積 radius 半徑 square 平方的"
  tags:
    textbook: 第六冊（九下）第2次段考範圍
    labeled_by: ai
  ai_answers:
    gemini: D
    qwen: D
  answer:
  - D
  answer_status: ai_generated
  answer_source: ai:gemini+qwen
