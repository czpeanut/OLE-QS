  group_stem: 'We all know that being in nature is good for us. New study shows that
    being in the natural world for just ten minutes can help our mental health. The
    study also says being with others in nature can make our friendships better. Even
    being in city parks and gardening can make a difference. A study from the City
    University of Hong Kong found that nature makes us want to help and work together
    with others more. We become more sociable. This makes us feel better about ourselves.
    We feel better, so our mental health gets better. Helping others can also lower
    our stress and worry.

    Mental health is a big problem that is growing around the world. More people are
    feeling worried, sad, and have other kind of mental health problems. The National
    Alliance on Mental Illness in the USA reported that one in five Americans has
    mental health problems. The study gives good view on how nature can help with
    these problems. It says being around trees or in open fields helps us sleep better
    and focus more. One study from Chiba University in Japan found that even flowers
    can help our mental health in a good way. Researchers found that workers with
    roses on their desk felt calm and less stressed after four minutes.


