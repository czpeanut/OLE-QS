  stem: '立瀚在不同溫度下測定KNO$_{3}$ 和KCl 對水的溶解度（克/100 克水），他將數據記錄於表三，並據以繪製圖十七表達溶解度與溫度的關係。


    表三

    | 溫度（℃） | 0 | 10 | 20 | 30 | 40 | 50 | 60 | 70 |

    |---|---|---|---|---|---|---|---|---|

    | KNO$_{3}$（克） | 13.3 | 20.9 | 31.6 | 45.8 | 63.9 | 85.5 | 110 | 138 |

    | KCl（克） | 27.6 | 31.0 | 34.0 | 37.0 | 40.0 | 42.6 | 45.5 | 48.3 |


