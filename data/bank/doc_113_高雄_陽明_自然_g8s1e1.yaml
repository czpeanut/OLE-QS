    沛恩以X 牌綠茶進行實驗，探討不同沖泡條件對茶湯變色快慢的影響，並利用透光率表示茶湯顏色深淺，透光率是表示透過介質的比例，透光率越低代表茶湯顏色越深，實驗結果如圖十八所示：'
