- id: doc_113_台南_復興_國文_g7s2e2_s7_1
  section: 7
  number: 1
  type: single
  page: 5
  stem: 根據上文，請問下列選項中，何者不是作者此篇論文的探討內容？
  options:
  - label: A
    content: 探討對重劃區居住環境品質影響的相關建設規劃與建築手法
  - label: B
    content: 以虎尾寮為研究對象，分析後提出原則性建議，做為重劃區日後規劃設計之參考
  - label: C
    content: 分類討論虎尾寮重劃區內出現的各式有別於傳統連棟街屋類型之社區型連棟街屋
  - label: D
    content: 市地重劃街廓尺寸來確保開發配置方式能夠符合經濟優先原則，達到有效率的應用市地
  group_stem: '（一）

    市地重劃的意涵在於將不符經濟使用土地透過交換分合達到有效率的應用，但最終目的仍是提供居民一宜居的住宅環境。近年來台灣對住宅的要求以從對坪數上的追求轉變為居住環境的要求，而新興之重劃區大多劃分成較大規模街廓為主，並鼓勵整體開發方式進行開發，因此居住環境品質之優劣不再僅是住宅單元本身，而是住宅單元與周邊環境的相互關係，因此本論文藉由調查虎尾寮重劃區內配置方式探討不同配置方式對住宅環境的影響，其中虎尾寮重劃區內出現各式有別傳統連棟街屋類型之社區型連棟街屋，成為虎尾寮重要的特色之一，本論文將加以分類討論。

    此外台灣居住環境經常受到商業設施所帶來的負面衝擊影響，但卻又無法否認商業活動帶來的生活上的便利性，因此若能於開發階段即透過對區域環境分析來判斷基地從事商業活動的潛力與機會，並藉由適合的配置方式與適當建築手法來刻意塑造或避免商業活動產生，如此一來除了可降低商業活動所造成之影響外亦可創造環境附加價值達到住商空間互惠。

    本研究藉由掌握：(1)虎尾寮區域內配置類型 (2)中庭式連棟透天厝之中庭使用狀況 (3)區域內避免從事商業活動之建築手法，期待提出對重劃區居住環境品質影響之相關手法。最後再由「有無從事商業活動」、「是否享有中庭空間」、「中庭是否採人車分道」、「車道環境是否綠化」做為判斷居住環境品質之要素，並於分析討論後依中庭使用狀況、避免商業活動所採用之建築手法、車道環境提出原則性建議，做為日後規畫設計之參考。本論文再依上述原則性建議提出住宅單元
    Type 來探討未來(社區型)重劃區之街廓尺寸，希望未來能藉由相關法令對街廓尺寸之規定來確保開發配置方式，進而提升居住環境品質。

    陳玠妤(2014)。重劃區中庭式連棟透天厝的規劃設計對居住環境品質影響---以台南市 虎尾寮重劃區為例，論文摘要。[碩士論文，國立成功大學]'
