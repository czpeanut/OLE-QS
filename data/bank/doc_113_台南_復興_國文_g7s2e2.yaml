  stem: '正德間，徽郡天旱，府守祈雨欠誠，而神無感應。無賴子作十七字詩嘲之云:「太守出禱雨，萬民皆喜悅。昨夜推窗看，見月。」守知，令人捕至，責過十八，止曰:「汝善作嘲詩耶?」其人不應。守以詩非己出，根追作者，又不應。守立曰:「汝能再作十七字詩，則恕之，否則，罪置重刑。」無賴子應聲曰:「作詩十七字。被責一十八。若上萬言書，打殺。」守亦哂①而逐之。此世之所少，無賴亦可謂勇也。

