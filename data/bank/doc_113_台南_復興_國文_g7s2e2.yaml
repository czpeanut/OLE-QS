  type: single
  page: 4
  stem: '為何閒談要稱為「聊天」，這大概很難考證。我猜因為「天」是遙遠的、空闊的，且虛實不定，很像閒談的內容和狀態。人類是最愛說話的動物，整天講個不停。白天面對面講，晚上電話對電話講，還講不夠，網路上有「聊天室」、「聊天系統」等，話真是永遠說不完……。如果廢話可以回收當燃料，世界就不會有石油危機了。

    孔子最不喜歡「群居終日，言不及義」的行為，可見幾個人沒事坐在起胡扯，在先秦時代就很多。不過考察《論語》，這部「語錄」本身就是對話的記載，裡面的人「群居終日」是肯定的，但因為他們大多討論政教問題，所以應當屬於「義」的一部分而未遭到反對吧。

    節錄自徐國能〈聊天〉


    根據上文，下列何者說明正確？'
  options:
  - label: A
    content: 「如果廢話可以回收當燃料，世界就不會有石油危機了」指廢話也有其作用
  - label: B
    content: 所謂「群居終日，言不及義」中的「義」，應該包含了政治教化的相關議題
  - label: C
    content: 作者認為閒聊之所以叫「聊天」，乃因討論天氣方面的話題較容易引起共鳴
  - label: D
    content: 孔子不喜歡閒談胡扯，《論語》卻是孔子和弟子的閒談記錄，真是自圓其說
