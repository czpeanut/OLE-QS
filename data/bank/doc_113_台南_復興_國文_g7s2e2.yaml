- id: doc_113_台南_復興_國文_g7s2e2_s7_9
  section: 7
  number: 9
  type: single
  page: 7
  stem: 依據本文，關於君主用來確保地位的特殊方式，何者說明適當？
  options:
  - label: A
    content: 將「燔祭」改為「肴羹」，漢化與簡化祭祀的方式
  - label: B
    content: 以賞食維持政事堂的飲食支出，拉近與官員的距離
  - label: C
    content: 獨享天神授予的祭獻權利，與天下的百姓祈福同食
  - label: D
    content: 藉由規範化的儀式，強調君主的威嚴，展現其神性
  group_stem: '（四）

    許多人類學者指出:君主保持其地位特殊的重要方式之一，便是仰賴許多儀式、規範，強調統治者的威嚴，透過儀式化行為，裝飾一種「神性人格」。除了居所、服裝與各種晉見儀式外，不讓一般人了解其飲食內容或方式，也是一種重要手段。就如獻祭一般，天子可以進爵、獻果給天帝，並代表天帝將祭品賜給與祭者，但天子並不隨便與民同食，以凸顯其「神性」。而皇帝經常有「賞食」的做法，以控制食物的分配，並有分嘏①、散胙②的宗教意義。

    飲食除了維持生命外，也是一種社會階級與身分的重要表徵，唐代名臣張文瓘為侍中時，可以依例享用政事堂供應的伙食。當時有同僚希望減供伙食以省費，但張文瓘不同意，認為:「此食，天子所以重樞機，待賢才也。若不任其職，當自陳乞，以避賢路，不宜削減公膳，邀虛名。國家所貴，不在於此。」

    飲食既是身分的表徵，飲食內容也應該是反映身分的工具，藉由飲膳，不僅可以確認身分，也可以建立較親近的關係。房玄齡、杜如晦曾於隋時任吏部侍郎高孝基下屬。高認為二人日後必貴，刻意與之交好，希望日後能「以子孫為託」。高乃「延至內齋共食」。

    不僅上層社會利用飲食拉近距離，平民階級也多以飲食為社交手段。不過儀式與方式不同於上層階級，平民階級要加入上層社會時，必須學習宮廷的禮節，除語言、舉止外，飲食禮節也是重要內容。

    歷代以來，許多重要場合中，君臣上下要集會慶祝，並由朝廷提供適當的飲食，依禮、依序享用，形成一種特殊的社會行為，並有適度的規範。例如漢代的大朝會，群臣上殿，口稱萬歲，並舉觴祝頌，朝廷則提供百官宴饗。以後歷朝踵事增華，宋代的朝宴就變得相當奢華。明朝沿其制，宮廷禮儀也相當繁複，雖亦有大宴、中宴、常宴、小宴等名目，但已經自認省略。不過「凡立春、元宵、四月八日、端午、重陽、臘八日，永樂間，俱於奉天門賜百官宴。」其他如皇太后聖誕，東宮千秋節等，皇帝都有可能以此為由，賜宴群臣。甚至祀圜丘③、方澤④、祈穀⑤、朝日夕月、耕藉、經筵日講、東宮講讀等場合，都賜飯；纂修校勘書籍，開館暨書成，也要賜宴。至於閣臣九年考滿，也於禮部賜宴，還有各種恩榮宴，賞賜九卿、新科進士等。都有燒尾⑥的實際功能。

    滿洲人原本生活在關外，飲食可以分成好幾種，祭祀、宴會與家庭日常生活，各種飲食不同。例如祭祀一向在野外，以燔祭⑦為主。入關以後，住在北京城中，燔祭多有不便，康熙乃下令改「燔祭」為「肴羹」，開始漢化與簡化祭祀。至於一般宴會，也以漢人習慣的肴羹為主，由內膳房負責皇帝等宮中主體人物的飲食，另外還有外膳房，負責其他相關人等飲食。

    節錄自周惠民〈從檔案看清代宮廷飲食〉

    註：①嘏：音ㄍㄨˇ，福祉。

    ②胙：音ㄗㄨㄛˋ，古代祭祀時供奉的肉。

    ③圜丘：古代君主為祭天而建造的圓形高壇。

    ④方澤：古代夏至祭地祇的方壇。

    ⑤祈穀：古代祈求穀物豐熟的祭禮。耕藉：中國古代帝王親耕田地的禮儀制度。

    ⑥燒尾：即燒尾宴，唐時初拜官職的大臣，依例設宴獻食，以表慶祝酬謝。

    ⑦燔祭：指將所獻上的整隻祭牲完全燒在祭壇上，全部經火燒成灰的一種祭祀儀式。'
