    三顧頻煩天下計，兩朝開濟老臣心。出師未捷身先死，長使英雄淚滿襟。

    杜甫〈蜀相〉

    (乙)

    鐵馬雲雕久絕塵，柳營①高壓漢宮春。天清殺氣屯關右，夜半妖星②照渭濱。

    下國臥龍空誤主，中原逐鹿不由人。象牙錦帳③無言語，從此譙周④是老臣。

    溫庭筠〈過五丈原〉

