  group_stem: '齊桓公好服紫，一國盡服紫。當是時也，五素不得一紫。 桓公患之，謂管仲曰：「寡人好服紫，紫貴甚，一國百姓好服紫不已，寡人奈何①？」管仲曰：「君欲止之，何不試勿衣紫也？謂左右曰：『吾甚惡②紫之臭。』於是左右適有衣紫而進者，公必曰：『少卻③，吾惡紫臭！』」公曰：「諾。」於是日，郎中莫衣紫；其明日，國中莫衣紫；三日，境內莫衣紫也。

