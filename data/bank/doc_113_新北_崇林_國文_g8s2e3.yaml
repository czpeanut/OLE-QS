- id: doc_113_新北_崇林_國文_g8s2e3_s3_40
  section: 3
  number: 40
  type: single
  page: 5
  stem: 下列關於文章內容的敘述說明，何者錯誤？
  options:
  - label: A
    content: 與作者奮戰的鬼頭刀翻跳如蠻牛，故在搖晃的甲板上難以將其制伏
  - label: B
    content: 鰹魚被捕後，會像電動按摩棒般拍打船板，且讓血水從嘴邊噴抖出
  - label: C
    content: 旗魚一旦被抓捕，會以端莊高雅如同貴族的姿態保持著牠們的尊嚴
  - label: D
    content: 鯊魚的報復性強，被捕後有「同歸於盡」的舉動，直到被打死為止
  group_stem: '鯊魚最耐，無論用甚麼方法捕到牠，無論牠在海水裡流失了多少血，拉到船舷邊時，一定還活跳跳，一定還張著大口舞甩著滿滿一嘴的尖牙，彷彿不報復地咬住什麼不甘心似的。曾經有一艘船，以為鯊魚已經死了，拉放在船板邊，一個漁人從旁走過，牠飛起來，像火燙著了屁股似的飛起來，咬住漁人大腿，不要命的撕扯甩動，直到扯下一塊大大的腿肉，扯出一地溫熱熱的血，牠才含笑繼續死去。所以，鯊魚被拉靠在船舷邊時，短棒、短鎚，所有船上能握住敲打的工具，全都「噗噗咑咑」一陣陣敲打在鯊魚被拉提在水面上的頭殼。

    旗魚很乾脆，幾乎把所有生命的液體全部留在海水裡，把所有受創的掙扎都埋藏在海水裡進行，彷彿牠覺得把垂死掙扎的模樣現露在敵人面前是生命最大的恥辱。船隻是牠的棺槨，上船前牠得保持佼好的遺容，像棺木裡化過妝的屍首。被拉近船邊的旗魚，都只靜靜的躺著，姿態雍容高貴，好像在示威似的告訴我們：「你們只能抓到我的身體。」沒有一滴血，就連受創的傷口也是很有尊嚴地綻翻著蒼白碎肉，沒有流下一滴血。

    鰹魚會像一陣急鼓顫打船板，全身繃緊像一根電麻麻的按摩棒，血水從鰓蓋邊抖出，噴濺起的血滴也都麻麻顫顫，像是長了牙齒般一路沾黏啃咬。

    鬼頭刀最是蠻橫難纏，牠猛暴的翻跳像一頭瘋狂的蠻牛。有一次，我費力的拉起一條咬中尾繩的鬼頭刀，是一條十公斤左右的公魚。牠表情像一個抵死不從的戰犯，把在水裡爆炸似的游速任性地在甲板上撒野。牠狠狠咬著魚鈎，身體彈跳起來足足有兩尺高，抽長的身軀像一把刀斧在甲板上掃踢。看我彎下腰去，海湧伯回頭喊著：「卡小心咧！臉被搧到會烏青。」可是，我得先拔下牠嘴裡的魚鈎才能重新把尾繩放下去。我在寬闊的後甲板上圈轉著追牠，學老討海人拔鈎技術伸長了腳掌要踩住牠。左舷翻蹦著跳到右舷，右舷又翻躍著跳回左舷，搖晃的甲板上要站穩腳步都相當困難，何況是要去踩住一條活蹦亂跳的魚。

    「咚！咚！咚！」牠甩頭自殺似的猛力敲打船板，「咚！咚！咚！」鮮血迸出，牠滿頭滿臉，我渾身上下。拉放在船尾角落的魚線被牠攪亂紊棼地糾結在整片後甲板上。海湧伯轉頭看著這場混亂搖了搖頭，臉上現出鄙夷的訕笑。

    節錄自 廖鴻基 《漂流監獄·魚血》'
