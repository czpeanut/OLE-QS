    \ 開袂完的銃」（他們開不完的槍）則是最讓人警覺響起「白色恐怖」訊號的關鍵，因為在白色恐怖時期你可能會遇到下面這些事情：學校老師突然消失後就再也沒看過他；家人被警察帶走，不是沒回來，就是回來後容易對一些事情緊張兮兮，又絕口不提發生什麼事；政治犯的家書、遺書時常寄不到家屬手中……\n\
    \ 在臺灣歷史上使人被噤聲沉默、被消失後回來的是屍體，大概就也只剩下「白色恐怖時期的極權統治」。「寫袂了的批」不禁令人聯想到那一封封被鎖在國家檔案庫裡的遺書，甚至到了解嚴幾十年後家屬都仍看不到親人最後的遺言。也因此歌詞裡對愛人的「消失（死亡）」欲言又止，暨氣憤又裝作不在意。那是時代下，每一個微小的人無法對不公言說，也不知道要向誰言說的無奈心情。\n\
    \ 因此，若帶著白色恐怖的背景來理解歌曲，間奏後的「南無觀世音菩薩」會變成整首歌最精華的部分！這句歌詞的和聲混著吼腔，配上後續訴說對菩薩的怨懟，讓祈禱的佛號變成怒吼──個人面對體制的不公無從歸咎，所以只好把所有的埋怨歸咎給神明。歌曲中的「我」越是對菩薩不解，越反映了白色恐怖時期現實的無奈跟無力。無法把摯愛失蹤歸咎給誰，因為帶走他的是國家的極權，而我們也甚至不知道具體的幕後兇手，所以只能向神明發洩不滿，怪上天為什麼為什麼要讓這些悲劇發生。一聲聲對菩薩的怨懟，其實吼向的是白色恐怖對人的迫害──殘酷到個人無以承受，怨恨無以歸咎，只能怪「天」給了一個黑暗的時代。\n\
    \ 縱使珂拉琪〈萬千花蕊慈母悲哀〉在創作時不全然是以白色恐怖為出發點，但歌詞塑造的情境，都與當時的社會氛圍極為相似。那些歷史上難以直視的創傷，被迫沉默的歷史記憶，甚至到解嚴後三十幾年的現在，我們都還得無法好好地面對。那個時代的倖存者絕口不提過往，或許不是因為無視傷痛能帶來痊癒，而是傷痛太過巨大無以直視。這也是作為後代的我們，必須要不斷追問、探究前一輩人走過的時代與傷痛的原因──看見，才能治癒創傷，雖然我們能做的也僅是替他們看見而已。\n\
    (改寫自張國勳〈歌/ 詩中的白色恐怖：珂拉琪〈萬千花蕊慈母悲哀〉〉)"
