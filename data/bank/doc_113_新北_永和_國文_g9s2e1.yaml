- id: doc_113_新北_永和_國文_g9s2e1_s2_27
  section: 2
  number: 27
  type: single
  page: 4
  stem: 根據下圖，可以呼應本篇文章中什麼資訊?
  options:
  - label: A
    content: 護理系學生招不滿，入學人數主要趨勢呈現減少狀況
  - label: B
    content: 護理系註册率從106年起逐年上升
  - label: C
    content: 護理系註册率落差最大在107到109年
  - label: D
    content: 護理系註册率最高在110年。
  group_stem: "護理師的人才荒正在惡化中!如今有愈來愈多的患者們抵達醫院，只能躺在救護車的擔架床上，沒有空病床可以等待醫治。事實上，患者等住院不只是没床，更是因為缺乏人力而不能增加床位。舉臺大\
    \ 雲林分院為例，過去急診病患通常待床超過一天的比例約5%，現在則達到3 倍以上;等床的民眾也從原先的一天30 人增加到60 人甚至更多。根據衛福部統計，國內每年流失將近五千名護理師，護理科系學生也呈現招不滿，學生人數整體雖有小波動，但主要趨勢還是遞減的現象，現在只能靠著18.6\
    \ 萬名護理師支撑全國醫療資源的運作，主要流失的護理人員年齡約在30 到35 歲，是正值生兒育女，將重心回歸家庭的年紀。\n而護理師離職的最大原因在於三班制。所謂的三班制，便是以日夜輪休的方式，以三個固定班組輪休日班、小夜班與大夜班，而變動如此大的值班時段將導致個人生活作息大亂，難以兼顧家庭及育兒生活。與艱困的三班制與長工時的特性對應到的，卻是偏低的薪資額，若是在地區醫院年薪可能也只有五十萬上下，因此護理人員本在醫療體系中就是離職率相當高的一群，在疫情最為嚴峻時，即便護理師確診、身體不適也因人手不足而需到職，而在經歷了新冠疫情的高峰後，連帶著流感與腸病毒的高原期也接續著，護理師最終不堪沉重的負荷，紛紛出走。\n\
    \    許多護理師選擇離開大醫院，投入診所、長照機構或是藥廠醫材等領域工作，愈來愈多護理師選擇居家保母、居家護理師，或是鐘點超高的特別護士，甚至考取美國執照以跨海執業，薪水可能都更優渥或是工時更健康，還有的直接轉任空服員、教職等專業，而相關科系的畢業生們考取護理執照後，約有一成的畢業生未投入醫療臨床服務，約八到九成會進入臨床，但會在未來十年後容易因「工作難以兼顧生活」而離職。\n\
    原先就工作負荷大、薪資與付出不成正比的護理工作，加上部分臺灣民眾抱著「有錢就是大爺」的心態，對護理人員頤指氣使、耍大牌，而讓這群護理師感受不到專業認同與尊重，加速了人才外流。如今在醫療需求量增加的窘境下，如何將國家培訓出的護理專業人員喚回臨床崗位，是醫療體系與政府機關正在共同關注的議題。\
    \    \n                  ──改寫自翰林〈護理師離職潮〉"
