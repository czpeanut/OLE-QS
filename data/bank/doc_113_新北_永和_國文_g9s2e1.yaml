  type: single
  page: 6
  stem: 依據上文(一)，下列關於「生命意義」的敘述，何者最正確?
  options:
  - label: A
    content: 不必跟隨別人對生命的看法
  - label: B
    content: 對自己負責，以自身的實踐來回應生命的質疑
  - label: C
    content: 每個人都有自己對生命的看法
  - label: D
    content: 維克多·弗蘭克認為生命本身沒有意義。
  group_stem: "(一)\n生命的意義是什麼呢?\n    用概括性的措辭來回答這個問題，正如我們去問一名棋弈高手:「這世界上最好的一步棋該如何下手?」\n\
    \    事實上，根本沒有所謂最好的「一步棋」，也沒有不犯錯誤的棋弈，而是要看棋局中的特殊局勢以及對手的性格而定。\n    生命中的每一階段，都如同棋盤，端看你如何布局，同時如何破解難關。因此，有關生命意義為何，這樣的問號該顛倒過來。人不應該去詢問生命的意義，而是要反過來問自己，你覺得生命是什麼?你想如何去過?怎樣讓它變得有價值?\n\
    \    一言以蔽之，每個人都在被「生命」質疑，而唯有自身的實踐足以答覆。用「對自己負責」來回答，因而「對自己負責」，正是回答生命問號最好的答案。\n(二)\n\
    \    一位年老的醫生患了嚴重的憂鬱症，兩年前他最摯愛的妻子過世，爾後，他便一直無法抗拒沮喪的情緒。\n    他前來求助，我正想著，該如何去幫助他，又該說些什麼安慰他的話好。\n\
    \    於是，我有了個點子，反問他:\n   「假使是您先去世，而尊夫人繼續活著，您想，那會是怎樣一個情形?」\n   「喔!對她而言是可怕的，我無法想像她會遭受多大的痛苦。」他說。\n\
    \   「那麼，她現在不必承受這樣的苦了，因為有你來承擔著，所以您付出了代價，以繼續活下去來償付您心愛的人免於苦難。」我說。\n    這位老先生一語不發地、平靜地離開診所，我想說的是:\n\
    \    痛苦在被發掘出意義時，它就不成為一種苦了。\n    當一個人遭遇無可避免的人生巨創時，他等於得到最重要的一個機會，去實現人生最高價值和最深的意義:即苦難的價值。\n\
    \    這時，重點在──對痛苦採取了什麼樣的態度，用怎樣的態度來承擔痛苦。\n                                     \
    \                                  ──維克多·弗蘭克〈活出意義來〉"
