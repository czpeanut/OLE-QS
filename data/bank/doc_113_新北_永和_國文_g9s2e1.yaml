  group_stem: "我的母親很久以前是文藝少女，這是我很後來才知道的事情。\n    母親常稱羨父親高中畢業，自卑地說自己只有小學學歷，無捌字，無智識。聽人在學英文就把兒子送進英語補習班;親戚孩子都念普通高中，便否決兒子追隨板模工父親腳步念高職的室內設計科的決定;看新聞恐嚇大學學歷已經不夠，本是大學畢業即不再供應兒子生活所需，卻又掏出私傢錢送兒子念研究所──她是如何在眾多是非難辨的資訊之中辨析，對著一知半解的說法點頭稱是，尷尬地掏錢替種種名目買單。坐在一旁的我，靜靜看著一疊鈔票自她懷裡交出，暗自氣惱那些都是話術，是拐騙，收走了錢，將我的義務教育從九年延長成十九年。而我未曾料到那是一場時間的等價交換。\n\
    \    以為母親書讀得少，我視為常識的，對她卻是珍寶，常常拿來反覆擦拭般詢問。但總有怎麼教都不會的發音，怎麼解釋都聽不懂的事。情緒像□□，很看對手反應，至終若不是我放棄治療，她□□笑說啊就學不會，閃身回廚房洗碗抹地；若我發起脾氣來，她也忿忿搬出「提錢乎你讀冊，毋是乎你看父母無啦」的經典臺詞，用憤怒掩蓋□□，轉身回臥室攬鏡抹開架保養品。要是再年輕個幾歲就好，要是，保養品也能讓大腦逆齡。\n\
    \    一回，她指著我書架上那排花布書封的張愛玲說：我做小姐的時陣都看這些書。恍然間腳下湧起浪潮，有些時間之流，我從未涉足。              \
