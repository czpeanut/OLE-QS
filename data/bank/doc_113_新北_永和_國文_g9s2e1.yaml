  stem: 根據甲、乙兩文的內容，以臺 美目前對於深偽技術的立法內容看來，下列敘述何者正確?
  options:
  - label: A
    content: 在美國總統拜登的強力推動下，美國國會已將深偽技術納入聯邦法律
  - label: B
    content: 在臺灣以科技方式合成他人不實影音，只要未散布就不觸法
  - label: C
