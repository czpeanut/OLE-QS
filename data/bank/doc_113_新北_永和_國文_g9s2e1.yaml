  stem: '小梅、阿鈞、小維、阿靜四人參加電視台舉辦的中華古典詩詞大賽，按照賽制，需各回答一題關於中國古典詩詞常識問題，答對者才可晉級下一關，請問哪一個人的回答無法晉級？【L2】


    | | 題目 | 回答 |

    | :--- | :--- | :---: |

    | (A)小梅 | 《詩經》是中國最早的詞歌總集，也是韻文之祖。 | ○ |

    | (B)阿鈞 | 絕句和律詩合稱近體詩，兩者皆須有對仗。 | ╳ |

    | (C)小維 | 宋詞依字數可分為小令、中調和長調，平仄通押，須一韻到底。 | ╳ |

    | (D)阿靜 | 散曲中的「小令」由同一宮調的若干「散套」為一組，只有「曲」而無「科」、「白」。 | ○ |'
