  group_stem: '丙午，上①與群臣論止盜，或請重法以禁止，上哂②之曰：「民之所以為盜者，由賦繁役重，官吏貪求，饑寒切身，故不暇顧廉恥耳。朕當去奢省費，輕徭薄賦，選用廉吏，使民衣食有餘，則自不為盜，安用重法邪！」自是數年之後，海內昇平，路不拾遺，外戶不閉，商旅野宿③焉。                      ──選錄自司馬光《資治通鑑》

