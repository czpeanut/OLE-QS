  stem: 根據本文，屈原為何「顏色憔悴，形容枯槁」?
  options:
  - label: A
    content: 感慨年華老去，時不我與
  - label: B
    content: 甘願與世合污，隨波逐流
  - label: C
    content: 受漁父羞辱，心有不甘
  - label: D
    content: 被君王放逐，仕途多舛。
  group_stem: "屈原既放，游於江潭，行吟澤畔；顏色憔悴，形容枯槁。漁父見而問之曰：「子非三閭大夫與？何故至於斯？」屈原曰：「舉世皆濁我獨清，眾人皆醉我獨醒，是以見放。」\n\
    \    漁父曰：「聖人不凝滯於物，而能與世推移。世人皆濁，何不淈①其泥而揚其波？眾人皆醉，何不餔②其糟③而歠④其醨⑤？何故深思高舉，自令放為？」屈原曰：「吾聞之：新沐者必彈冠，新浴者必振衣，安能以身之察察⑥，受物之汶汶⑦者乎？寧赴湘流，葬身於江魚之腹中，安能以皓皓之白，而蒙世俗之塵埃乎？」\n\
    \    漁父莞爾而笑，鼓枻⑧而去。歌曰：「滄浪之水清兮，可以濯吾纓⑨；滄浪之水濁兮，可以濯吾足。」遂去，不復與言。\n  ──屈原〈漁父〉\n【注釋】①淈：音ㄍㄨˇ，攪亂使其混濁。②餔：音ㄅㄨ，吃。③糟：釀酒時濾下來的渣滓。④歠:音ㄔㄨㄛヽ，喝。⑤醨：音ㄌㄧˊ，薄酒。⑥察察：潔淨。⑦汶汶：音ㄨㄣヽ，玷污，污辱。\
    \ ⑧鼓枻：搖槳行船。枻，音ㄧヽ，船槳。⑨纓：繫帽的帶子。"
