  group_stem: "【甲】\n    AI 蓬勃發展讓深偽技術成熟且普及，照片與影片遭盜用、濫用、變造、換臉的事件頻傳，但華府截至2023年11月底，尚未訂立針對變造不雅內容的聯邦法律，只有極少數州頒布相關州法規範。美國總統拜登於10月底簽署一項AI\
    \ 行政命令，呼籲國會通過資料隱私立法，禁止未經同意變造私密圖像。維吉尼亞大學AI 倫理專家蕾妮·康明斯表示:「當一個人的臉被合成在不屬於你的身體上，可能產生『法律矛盾』，現行法律禁止在未經他人同意的情況下傳播不雅照，但可能不適用於深偽圖像。」不過，深偽技術的發展也不是毫無價值的，在好萊塢拍攝的電影中，會運用大量的深偽AI\
    \ 技術，協助電影場景製作，讓真人演員不再需要冒巨大生命危險以進行拍攝，並且，深偽技術也可運用在製作更加擬真的AI 機器人進程中。\n          \
    \         ──改寫自《好讀周報·AI 偽造不雅照》、韓其珍〈「謎片換臉」所引發的AI 與法律管制反思〉\n【乙】\n    近來臺灣應用於AI 的深偽技術(deepfake)進行換臉、使用其他電腦合成方法製作不實影像等案件頻傳，導致民眾分不清真假，甚至受騙上當。對此，立法院會三讀通過《刑法》部分修正條文，增訂以電腦合成或其他科技方法製作關於他人不實影像、聲音或電磁紀錄的詐欺罪，並增列加重處罰事由，包含「冒用政府機關或公務員名義犯之」、「3人以上共同犯之」、「以廣播電視、電子通訊、網際網路或其他媒體等傳播工具，對公眾散布而犯之」，只要構成其中一種情形，可處1年以上、7年以下有期徒刑，得併科新臺幣100萬元以下罰金，未遂犯也要受罰。\n\
