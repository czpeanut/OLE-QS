  stem: 關於馬致遠〈天淨沙秋思〉與白樸〈沉醉東風漁父詞〉敘述何者正確? 【L2】
  options:
  - label: A
    content: 〈天淨沙〉描寫時間是黃昏；〈沉醉東風〉描寫的時間是早晨
  - label: B
    content: 〈天淨沙〉的主旨是浪跡天涯，孑然無依；〈沉醉東風〉的主旨是自我充實，待時以動
  - label: C
    content: 〈天淨沙〉以「小橋流水人家」溫馨之筆反襯主角的悲涼；〈沉醉東風〉以對比手法表達萬戶侯欣羨煙波釣叟的心境
  - label: D
    content: 〈天淨沙〉整首小令為靜態景物的平列，並以「枯」、「昏」、「老」、「古」、「瘦」等字烘托悲涼氣氛；〈沉醉東風〉多是靜態景物描述，以四種明豔色彩呈現生機蓬勃的景致。
