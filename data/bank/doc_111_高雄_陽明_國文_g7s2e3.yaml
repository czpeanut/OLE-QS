  group_stem: '姑媽過世後留給我一隻安哥拉貓，這是一隻很蠢的貓。某個冬夜，在溫暖的壁爐旁，他講了一段故事給我聽：

    我兩歲時就已自命不凡，瞧不起家裡舒適溫暖的生活。但，我還是很感謝老天爺把我安頓在你姑媽家裡。這個善良的女人非常寵愛我，讓我睡的是羽絨床墊和三層毛毯的床，吃的水準也不差，要吃就是吃肉，新鮮的肉。

    可是，在這舒適的環境中，我卻有個夢想：從半開的窗戶溜出去。我已對主人的撫愛和柔軟的床墊感到厭煩，覺得生活極為無聊，甚至肥胖到連自己都覺得噁心。

    有一天，主人忘記關廚房的窗戶，我便跳到窗下的小屋頂上。不瞞你說，我的四條腿其實直打哆嗦，快樂中仍夾雜恐懼，有一剎那還嚇得差點掉到街上去。有三隻貓從別棟的屋脊上衝過來，對著我凶狠地叫著，我快嚇暈了。他們說，這是跟你鬧著玩的。於是，我也跟著一起亂叫，確實很好玩。這些傢伙不像我又傻又胖，看見我在屋頂上像顆球似的滑來滾去，都嘻嘻哈哈取笑我。但當中有隻老公貓對我特別友善，主動指點我，我非常感激。

    夜晚慢慢降臨，大霧瀰漫，寒風挾帶著細雨，凍得我渾身發冷。我們從樓梯間有破洞的玻璃窗下了樓，眼前的街道多麼醜陋啊！沒有普照的陽光，沒有融融的暖意，也沒有明亮的、可以在上面愜意打滾的白色屋頂。我的腳爪在滿是油汙的石板上打滑，不由得懷念起那羽絨床墊和三層毛毯。

    一到街上，老公貓就開始打哆嗦。他縮著身子，偷偷摸摸沿著房子走，並叫我緊跟著他，一旦發現給馬車通過的大門，就連忙躲進去，我問他為什麼要躲躲藏藏。

    「你看見那個背著簍子、手拿鐵鉤的人嗎？」他反問。

    「看見了！」

    「如果我們被發現，就會被打死烤來吃！」

    「什麼！被打死烤來吃！」我大叫：「這街道不是我們的嗎？不但吃不到東西，還可能被吃掉？」

    這時，許多人家陸續將垃圾放在門口，我心灰意冷地在垃圾堆裡翻找，只找到兩、三塊骯髒又沒有肉的骨頭，頓時才體會到鮮肉是多麼美味。我的朋友老公貓熟練地翻扒垃圾，他不慌不忙地帶著我在每條街道遊走，一直奔波到隔天早晨。我淋了差不多十小時的雨，四肢凍得發抖。唉！該死的街道！要命的自由！我多麼懷念你姑媽家裡的那片小天地！

    天亮了，老公貓看見我走路踉踉蹌蹌，便問我：

    「你受不了啦？」

    「是的。」我回答。

    「想回家了？」

    「當然，可是要怎麼找到回家的路呢？」

    「來吧！昨天早上看見你溜出來時，我就知道像你這麼胖的貓，生來就不配享受那伴隨艱辛的自由。我認得你家在哪裡，我帶你回去吧！」老公貓直率地說。

    「再見！」到家時，他向我道別，沒有一絲不捨。

    「不！」我呼喊：「我們不要分開，你跟我一起進來吧！我們可以共享一張床、同吃一塊肉，我的主人是個好心腸的女人……」

    「閉嘴！」他粗暴地打斷我：「你這個蠢蛋！要是被關在你那溫暖舒適的環境，我寧可去死！富足的生活只適合軟弱的貓，自由的貓絕不會為了鮮肉和羽絨軟墊而甘願被囚禁。再見！」

    老公貓跳回屋頂，他瘦高的身影在旭陽照耀下歡樂地抖動著。

    我回到家，你姑媽拿起雞毛撢子狠狠地教訓我一頓，我心悅誠服地領受，充分體會到享受溫暖和挨打的樂趣。主人打我時，我喜孜孜地想著：她馬上就要給我鮮肉吃了。

    「你瞧！」我的貓在壁爐前伸了伸懶腰，做出結論：「我親愛的主人，真正的天堂，就是被關在一間屋子裡，挨打但有肉吃。」

    摘錄自〈貓的天堂〉'
