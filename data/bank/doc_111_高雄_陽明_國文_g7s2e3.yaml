    全世界都認為德國人熱愛香腸和煎肉排。與此同時，英國食物在德國人眼裡糟糕至極。德國人覺得英國食物難吃，不是油炸就是味如嚼蠟。唯一值得稱許的是廣受大眾歡迎的炸魚薯條。

    四、彬彬有禮

    這個刻板印象近年來頗受質疑，不過仍獲得普遍認同：英國人是非常有禮貌的家伙。許多德國人認為，英國人在沒有犯錯的情況下還是習慣道歉，詢問他人「你好嗎？」的次數多得毫無必要，普遍來說非常有禮貌。

    五、別提戰爭

    第二次世界大戰已經過去七十多年，但許多德國人並不相信英國人的國家記憶如此短暫。英國廣播公司制作的電視喜劇《非常大酒店》（Fawlty Towers）有句著名台詞「別提戰爭」，正好鞏固了這種刻板印象。這類無法擺脫戰爭記憶以及對痛惡德國人的角色，在德國特別出名。在英國舉行脫歐公投前，反歐盟言論也曾將矛頭對準德國和二戰。

    六、瘋迷王室

    德國人在第一次世界大戰後終結了貴族政治。許多德國人認為，英國人對其王室過分著迷。雖然在現今的英國社會中，英國女王只扮演象徵性角色，但從英國女王在脫歐中的角色（包括聲稱受到強森欺騙），仍凸顯出屹立不倒的英國王室傳統。

    節錄自〈德國之聲──紅茶與王室：德國人眼裡的英國人〉'
