  stem: 根據本文的內容，下列分析何者正確？
  options:
  - label: A
    content: 英國人每日會喝上十杯紅茶正是當地人的風俗習慣
  - label: B
    content: 德國人對於英國擁有民主政治展現高度關注與肯定
  - label: C
    content: 德國人對英國人的王室癡迷表現出嗤之以鼻的不屑
  - label: D
    content: 德國人覺得英國食物難吃，唯獨炸魚薯條在此之外。
  group_stem: '英語系國家人民對德國人應該有不少刻板印象，例如愛喝酒及吃香腸。那麼德國人又是如何看待「老對頭」英國人呢？以下是德國人對英國人的六大刻板印象：

    一、愛喝茶

    德國人對英國人最普遍的印象就是愛喝茶。位於波恩的德意志聯邦共和國史博物館正舉辦特展「非常英國」（Very British），介紹德國人對英國人的刻板印象，而這場特展的廣告圖像就是一個巨大茶杯。有些德國人真的認為，英國人每天會喝上十杯茶，而德國人則習慣「咖啡配蛋糕」。

    二、瘋狂政壇

    在德國人眼中，英國政治家是一群行為古怪的異類，與他們過去的行為相比，脫歐這件事大概算不上太瘋狂。英國首相約翰遜一直被國際社會視為可愛的丑角，不過隨著脫歐時間將近，這樣的印象逐漸出現轉變。

    德國的政治評論家和喜劇演員如亨寧·韋恩（Henning Wehn）就因為嘲諷英國的脫歐進程以及老派的政治模式，在英國頗為出名。例如在英國國會開幕大典上，英國女王伊麗莎白二世戴著華麗的首飾發表演說。亨寧·韋恩在推特上發文：「又是一個值得期待的政治娛樂周。喝點茶，坐下看戲吧！」

    三、黑暗料理

    全世界都認為德國人熱愛香腸和煎肉排。與此同時，英國食物在德國人眼裡糟糕至極。德國人覺得英國食物難吃，不是油炸就是味如嚼蠟。唯一值得稱許的是廣受大眾歡迎的炸魚薯條。

    四、彬彬有禮

    這個刻板印象近年來頗受質疑，不過仍獲得普遍認同：英國人是非常有禮貌的家伙。許多德國人認為，英國人在沒有犯錯的情況下還是習慣道歉，詢問他人「你好嗎？」的次數多得毫無必要，普遍來說非常有禮貌。

    五、別提戰爭

    第二次世界大戰已經過去七十多年，但許多德國人並不相信英國人的國家記憶如此短暫。英國廣播公司制作的電視喜劇《非常大酒店》（Fawlty Towers）有句著名台詞「別提戰爭」，正好鞏固了這種刻板印象。這類無法擺脫戰爭記憶以及對痛惡德國人的角色，在德國特別出名。在英國舉行脫歐公投前，反歐盟言論也曾將矛頭對準德國和二戰。

    六、瘋迷王室

    德國人在第一次世界大戰後終結了貴族政治。許多德國人認為，英國人對其王室過分著迷。雖然在現今的英國社會中，英國女王只扮演象徵性角色，但從英國女王在脫歐中的角色（包括聲稱受到強森欺騙），仍凸顯出屹立不倒的英國王室傳統。

    節錄自〈德國之聲──紅茶與王室：德國人眼裡的英國人〉'
