- id: doc_111_高雄_陽明_國文_g7s2e3_s3_36
  section: 3
  number: 36
  type: single
  page: 7
  stem: 下列關於本文的寫作技巧呈現，何者說明正確？
  options:
  - label: A
    content: 先依據自身經驗舉例再提出需文化互相尊重的積極面
  - label: B
    content: 藉著與女兒的相處之道讓讀者反思文化主導的重要性
  - label: C
    content: 作者提出禮貌謙和的理念，期盼大家都能接受並支持
  - label: D
    content: 詳筆描述越南以讓讀者感受新住民在臺灣的挫折困境。
  group_stem: '目前在政大外語學院擔任越南語講師的陳凰鳳，去年接受新聞臺訪問時，分享了在臺灣身為外籍新娘被歧視的歷程：「我剛到臺灣時，看到到處貼的『外籍新娘二十萬』，我看到我這個身分是別人用買賣方式來評斷……」陳凰鳳用流利的中文道出不平的心聲，引起很大的迴響。剛到臺灣時飽受歧視，她為了怕孩子也被歧視，因此反而努力地參與孩子校園的生活。為了融入臺灣社會當一個新臺灣人，陳凰鳳要比一般人更努力。

    端坐時雙腿併攏，開心大笑時不忘用手掩嘴，來到臺灣第十六年，陳凰鳳從在家相夫教子的越南媳婦變成在政大開班教越語的講師。無論身分如何轉換，她始終沒有忘記母親在家鄉教導過她的點點滴滴。

    陳凰鳳的父母都是順化古城人，長年的皇城文化薰陶，讓他們格外重視禮節與道德，「我爸媽認為，這是家庭教育的一部分，不能等到學校教育、社會教育才開始。而且對女兒特別注意與關心，因為女兒以後是別人的媳婦，如果教得不夠好，女兒過得辛苦，做父母的會心疼，也會被認為家教不好。」

    結婚第七年，夫妻倆決定帶著稚齡兒女回臺定居，她一心想像媽媽一樣當個賢妻良母專心持家，但看著其他新住民帶著母國文化來到臺灣，兩方文化衝突產生誤會與悲劇，陳凰鳳決定去當志工，也因此得知更多悲傷的故事。「有個姐姐在準備祭拜牲禮時，不知道臺灣傳統必須全雞、全魚，按照越南習慣全部切塊、切片，婆婆看了勃然大怒，但兩人語言不通，媳婦不知道哪裡做錯，而造成極大的誤解。」此外，在越南無論年紀，只要是輩分較長，都會被尊稱為姐姐，但臺灣同輩間習慣直呼其名，「有位姐妹一直被小姑喊名字，覺得不受尊重，也不喜歡臺灣人總是愛取暱稱『阿蘭、阿惠』。」

    早期臺灣對新住民的跨國婚姻沒有信心，加上媒體報導讓社會認為娶外配的男人社會地位低、找不到老婆，公婆總是希望媳婦趕快融入臺灣，不要被認出是外籍配偶，也不希望孫子學習媳婦母語，擔心影響中文學習和課業發展。

    陳凰鳳以原生文化的教育方式要求女兒。但她的期望，造成了女兒的反感，認為媽媽對自己太嚴格，女兒國中時，兩人關係變差。

    有一天，陳凰鳳決定要跨出溝通第一步，母女兩人待在房間聊天，陳凰鳳說著自己對教育的想法，忍不住掉下眼淚，女兒也開口道歉，說出覺得自己不被疼愛的心情。

    跨過了這一關，兩人感情恢復往昔，甚至變得更加緊密，女兒升上高中的那年母親節，女兒不再是被要求而心不甘、情不願說出母親節快樂，而是為晚歸的她在桌上留了張紙條，寫著：「媽媽辛苦了，母親節快樂，早點睡覺喔！」陳凰鳳哭了又哭。她也調整了自己的教養觀念，留下臺灣社會也認同的作法，例如在文雅的用詞與說話禮節方面，當女兒大笑時她不再出聲阻止，也讓女兒疲累時能躺在沙發抬腳休息。

    曾經不愛拍照、也不喜歡和家人合照的女兒，現在手機裡一定有和媽媽的自拍照，母女都找到更放鬆生活的方式了。對陳凰鳳來說，在不同的文化、不同的世代，找尋適合彼此的生活方式，是她為人妻、人母路上，不斷學習的一堂課。

    改寫自〈你的獨特，我看見〉'
