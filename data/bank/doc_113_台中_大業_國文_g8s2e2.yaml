  group_stem: '輕輕的我走了， 正如我輕輕的來；/ 我輕輕的招手， 作別西天的雲彩。

    那河畔的金柳， 是夕陽中的新娘； /波光的豔影， 在我的心頭蕩漾。

    軟泥上的青荇， 油油的在水底招搖： /在康河的柔波裏， 我甘心做一條水草！

    那榆蔭下的一潭， 不是清泉，是天上虹 /揉碎在浮藻間， 沉澱着彩虹似的夢。

    尋夢？撐一支長篙， 向青草更青處漫溯，/滿載一船星輝， 在星輝斑斕裏放歌。

    但我不能放歌， 悄悄是別離的笙簫； /夏蟲也為我沉默， 沉默是今晚的康橋！

    悄悄的我走了， 正如我悄悄的來； /我揮一揮衣袖， 不帶走一片雲彩。         徐志摩〈再別康橋〉'
