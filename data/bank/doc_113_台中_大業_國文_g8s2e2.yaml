- id: doc_113_台中_大業_國文_g8s2e2_s4_5
  section: 4
  number: 5
  type: single
  page: 5
  stem: 「你的眼睛你的皮膚你的手腳／甚至於你的耳朵都是最好的老師」此段文字的意義，何者正確？
  options:
  - label: A
    content: 身體是父母給予的，我們應當像尊敬老師那樣對待它
  - label: B
    content: 身體就像我們的老師，有許多值得我們學習的地方
  - label: C
    content: 肢體五官能像老師一樣，引領我們體會自然的奧妙
  - label: D
    content: 人類應向自己身體探求生命的意義
  group_stem: "山、怎麼會是一座學校？/黑板、粉筆在哪裡？/老師、會不會/手握凶猛粗暴的藤條？\n黑亮的眼睛發問著/問號宛似天上的星群/親愛的孩子、請揮掉/你腦海中所有的疑惑\n\
    簡簡單單地/用腳掌去感覺踏實/用肌膚感受風的愛撫/用手心觸摸山的容顏\n用一顆心推開山的門窗/你會發現到/他正悄悄的敞開校門/柔聲的說：請進、孩子\n\n\
    孩子、請進……/推開第一扇門/你將發現/這是一座沒有黑板的教室\n天空兩行字、請用力讀：/把手伸開、當翅膀/把腳站穩、當車輪/操場就是寬廣的草原\n你將與野獸一同捉迷藏/與星星親密地交談/樹藤和你玩跳繩比賽/流水教你歡唱童謠\n\
    這正是山所教導的第一課：把身體交給大自然\n\n第二座教室只有空白的天空/但飛鳥與你們一同上課/他帶領你一同升高翱翔\n熟悉每條河流的歌譜/熟悉每株林木的服裝/熟悉每座山的脾氣\n\
    冷了、白雲為你披圍巾/累了、就在樹林的肩膀/和松鼠一起休息/記得不要被絢麗的黃昏迷惑/\n他會灑滿軟軟的金披風/引領你徘徊而迷路\n\n離開第二座教室/山徑會通向山的屋頂/在那裡、你有一扇四面敞開的窗戶/暴雨會搖撼你的身軀/\n\
    冷雨會拉扯你的衣服/狂風會吹亂你的視野/你們會看到/柔弱的草、謙遜的彎腰/龐大的石頭、堅忍的立正/\n頑皮的松鼠、機伶的午睡/落葉、將重回泥土的懷抱/他們依然生活下來/像山的胸膛/藏著千百年的深豁\n\
    像山的歷史/充滿億萬年的驚喜/像山的志節/誰也不許令他改變\n\n第四座、第五座……教室/以至於第無數座教室/你將發現自己是學生也是老師\n你的眼睛你的皮膚你的手腳/甚至於你的耳朵都是最好的老師/當山的校園敲起上課的鐘聲/\n\
    你要自己找椅子上課/風霜雨雪可能是一枝鉛筆/一本書、一架鋼琴，或是\n一座實實在在的體育場/因為你正是山的孩子/有天，當你們下山/來到城市來到鷹架上\n來到礦坑來到辦公室/你們將和不同語言的人/不同習慣的族群/不同膚色的人群\n\
    共同生活/請永遠記住，緊緊地/記取山的教誨/好讓島嶼每一個角落矗立著一座座/英挺的山\n                                 \
    \                                    瓦歷斯諾幹〈山是一座學校〉"
