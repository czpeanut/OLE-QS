  page: 2
  stem: 關於書信、便條的寫法，下列哪一個選項不正確？
  options:
  - label: A
    content: 明信片的啟封詞宜用「收」，緘封詞宜用「寄」
  - label: B
    content: 便條較不拘禮節、不夠莊重，因此對於尊長盡量避免使用
  - label: C
    content: 橫式信封中收信人的地址宜寫在左上角，郵票貼在右上角
  - label: D
    content: 書信中為表示尊敬常用「挪抬」，例如：提到自己的老師：「吾○師」，書寫時在「師」字前需空一格
