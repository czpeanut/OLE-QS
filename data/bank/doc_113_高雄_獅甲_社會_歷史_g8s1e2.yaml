- id: doc_113_高雄_獅甲_社會_歷史_g8s1e2_s1_23
  section: 1
  number: 23
  type: single
  page: 1
  stem: 元代治理中國以征服先後、族群分類等不同條件將人民劃分等級。不同等級在政治、法律、科舉等方面都有不同的待遇，這也造成人民對於政府向心力不足，也是元朝統治中國時間不長的原因之一。請問：有關色目人在當時的相關敘述何者正確？
  options:
  - label: A
    content: 是當時種族政策下最高等級的階層
  - label: B
    content: 歐洲人來華大多被視為色目人
  - label: C
    content: 主要負責軍事國防的相關工作
  - label: D
    content: 是指原受女真統治的人民。
