    content: 宋朝重武輕文造成外患不斷
  - label: B
    content: 女真族為兩宋皆有的外族威脅
  - label: C
    content: 契丹是南宋後期所面對的主要外患
  - label: D
    content: 蒙古是北宋外患的主要代表。
