  section: 1
  number: 21
  type: single
  page: 1
  stem: 宋朝是一個外族威脅甚大的朝代，不論北宋、南宋，外族的威脅不曾消失，這與宋朝的立國政策方向有必然的關係。請問：有關兩宋外族威脅的相關敘述何者正確？
