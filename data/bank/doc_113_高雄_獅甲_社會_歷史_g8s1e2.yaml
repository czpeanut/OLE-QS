  stem: 烏俄戰爭從西元2022 年開始至今已將近三年，俄羅斯政府對外不斷強調兩者之間為同一民族並相關深遠，兩者在十三世紀時同屬於蒙古遠征後同一汗國治理。請問：有關此一汗國的相關敘述何者正確？
  options:
  - label: A
