- id: doc_113_高雄_獅甲_社會_歷史_g8s1e2_s1_25
  section: 1
  number: 25
  type: single
  page: 1
  stem: 義大利商人馬可波羅在遊歷中國返歐後留下《馬可波羅遊記》一書，當中有一段對當時最大港口泉州的描述：「大批商人雲集在刺桐(泉州港口)這裡，貨物堆積如山難以想像。每一個商人，必須付自己投資的總額百分之十的稅收，據商人們計算，成本(包含付給政府的稅金)總共達到貨物價值的一半。就算如此他們也能取得很大的利潤，而來自草原的統治者更是歡迎他們的到來，藉此增加收入。」請問：有關馬可波羅在當時中國的相關敘述何者正確？
  options:
  - label: A
    content: 馬可波羅來中國時間是唐朝
  - label: B
    content: 馬可波羅是從西域來到中國
  - label: C
    content: 馬可波羅繳稅機構對象是市舶司
  - label: D
    content: 馬可波羅只能先朝貢才能貿易。
