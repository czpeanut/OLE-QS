  number: 24
  type: single
  page: 1
  stem: 宋朝是科技與知識技術進步相當快速的朝代，再加上宋元與國際互動頻繁，中國的科技因此得以傳播世界其他地方。請問：有關宋元時期科技與文化傳播的相關敘述何者正確？
