  lesson_raw:
    title: 寄弟墨書
    basis: 題幹提及〈寄弟墨書〉
- id: doc_112_桃園_石門_國文_g9s1e3_s3_25
  section: 3
  number: 25
  type: single
  page: 1
  stem: 鄭燮：「聰明難，糊塗尤難，由聰明而轉入糊塗更難。」請判斷這句話的涵義為下列何者？
  options:
  - label: A
    content: 渴望在亂世中能明哲保身
  - label: B
    content: 以豁達圓融的態度自勉
  - label: C
    content: 期望能重回朝廷效力
  - label: D
    content: 裝糊塗的人才是真英雄
  lesson_raw:
    title: 寄弟墨書
    basis: 提及鄭燮名言
- id: doc_112_桃園_石門_國文_g9s1e3_s3_26
  section: 3
  number: 26
  type: single
  page: 1
  stem: 古代有著「萬般皆下品，唯有讀書高」的說法。下列選項，何者可以打破此種思維，傳達職業無貴賤的平等觀念？
  options:
  - label: A
    content: 夫束修自好者，豈無其人？經濟自期，抗懷千古者，亦所在多有
  - label: B
    content: 工人制器利用，賈人搬有運無，皆有便民之處，而士獨於民大不便，無怪乎居四民之末也
  - label: C
    content: 予兄弟二人，各得百畝足矣，亦古者一夫受田百畝之義也。若再求多，便是占人產業
  - label: D
    content: 新招佃地人，必須待之以禮。彼稱我為主人，我稱彼為客戶，主客原是對待之義，我何貴而彼何賤乎
  lesson_raw:
    title: 寄弟墨書
    basis: 選項引用〈寄弟墨書〉課文段落
