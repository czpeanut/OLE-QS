  - label: A
    content: 黑髮不知勤學早，白首方悔讀書遲
  - label: B
    content: 知恥後勇幡然悟，一改往昔立志新
  - label: C
    content: 古人學問無遺力，少壯工夫老始成
  - label: D
    content: 浪子回頭金不換，衣錦還鄉做賢人
  lesson_raw:
    title: 在錯誤中學習
    basis: 引用〈在錯誤中學習〉課文原句
- id: doc_112_桃園_石門_國文_g9s1e3_s3_24
  section: 3
  number: 24
  type: single
  page: 1
  stem: 〈寄弟墨書〉一文中，作者認為下列哪一項才是讀書人應有的本分？
  options:
