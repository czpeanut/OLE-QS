    \  現在很多餐飲業者為了健康取向等原因，研發不同的餡料口味，讓消費者可以有更多選擇。知名的日式漢堡連鎖店更是在二〇一五年的年底推出了刈包餅皮夾雞肉內餡的台灣限定款「福堡」，可見刈包深受台灣市場的喜愛。\n\
    \  但你知道，「刈包」到底應該怎麼唸嗎？刈當名詞是割草的镰刀，動詞則有「割」的意思，讀音為「ㄧˋ」。所以，刈包應該發音「ㄧˋ包」，至於大家習慣的刈包念法—「ㄍㄨㄚˋ」，其實是「割包」的閩南語發音喔。\n\
    \  到了刈包熱賣的年底尾牙，根據農民曆記載，其實是在每年的農曆十二月十六日。但現在很多公司行號慰勞員工會依據宴客方便或其他考量，會選在年底前挑一天或是隔年初辦春酒，宴請員工慰勞辛勞，感謝土地公一年來的保佑，並為來年祈福，所以並不拘泥非得在尾牙當天辦理宴席。"
