  group_stem: "（二）霧裡看花不是淚—白居易〈眼病〉詩\n※以下三則為常見的眼睛疾病的症狀說明\n1.老花眼症狀\n(1)近距離閱讀時需要超過40 公分以上才看的清楚。\n\
    (2)閱讀時常感覺眼睛疲勞、酸澀、頭暈、想睡覺、視線難以聚焦。\n(3)光線昏暗時比較看不清楚，需要把光線調亮才看得清楚。\n(4)視力已會呈現不穩定，眼睛在遠近交替時需要幾秒鐘才能看清目標物。\n\
    \n2.青光眼症狀\n(1)突發性：突發視力模糊、眼睛紅痛、頭痛，甚至噁心、嘔吐。\n(2)慢性：偶而眼球脹痛併頭痛，但睡覺時會覺得較舒服；晚上看燈光可見到虹彩似的光圈；晚上或燈光暗淡的情況下，視力減退。\n\
    \n3.飛蚊症症狀\n(1)眼前出現如蚊子般的異物卻打不到、揮不去，眼球一轉動，又立刻出現。\n(2)嚴重時，這些懸浮物彷彿像是薄霧一般，遮住視線，即便眼球停止運動仍會繼續移動，進而影響日常生活。\n\
    \n※以下為白居易的詩文：\n 散亂空中千片雪，蒙籠物上一重紗。\n 縱逢晴景如看霧，不是春天亦見花。\n白居易〈眼病二詩〉節錄"
