- id: doc_112_桃園_石門_國文_g9s1e3_s3_23
  section: 3
  number: 23
  type: single
  page: 1
  stem: 「所以沈君烈說劉邦雖不讀書，一生學問全在錯誤中得力。」這段文字的觀點，與下列何者最接近？
