- id: doc_112_桃園_石門_國文_g9s1e3_s4_35
  section: 4
  number: 35
  type: single
  page: 3
  stem: '請問下列選項中，哪些有可能是刈包的由來？

    (甲)張飛將饅頭劃開，夾入肉餡

    (乙)由福州傳入，其內餡是紅糟肉

    (丙)因為飲食西化，將漢堡做改良'
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 甲丙
  - label: D
    content: 以上皆是
  group_stem: "（三）台灣冷知識\n〈刈包怎麼念，我都唸「刈」那你呢？〉\n  刈包，台灣的傳統美食，咬一口，白白嫩嫩像是饅頭的麵皮夾著滷透了的五花肉，享受酸菜、香菜、花生粉和糖粉一起在口中爆發的好滋味。因為模樣像極了老虎張嘴咬豬肉，所以也有人叫它「虎咬豬」（閩南語發音：厚嘎低），閩南語的「虎」和「福」的發音因為十分相似，所以民間有吃「虎咬豬」祈求福氣的習俗；也有人覺得刈包的形狀宛如錢袋，象徵富貴發財，十分喜氣，所以也被認為是能夠討好彩頭的食物。\n\
    \  刈包的由來已經難以考究，相傳三國時代的張飛用刀將饅頭劃開口子，再夾上餡料，所以也叫「割包」。不過也有人說是諸葛亮在平定孟獲後，為了教化當地獵殺人頭供祭祀使用的陋習而發明的。\n\
    \  有趣的是刈包跟著早期福州移民被引進台灣後，其實也經過一番改良，因為傳統的福州刈包又稱「福州湯包」，做法是將刈包和紅糟肉切片放進碗公，撒上各式配料再淋上湯汁，但因為外出工作攜帶十分不便，所以台灣人將其改良成乾式吃法，酷似西式漢堡的吃法也是刈包成為台式漢堡揚名國際的原因。\n\
    \  現在很多餐飲業者為了健康取向等原因，研發不同的餡料口味，讓消費者可以有更多選擇。知名的日式漢堡連鎖店更是在二〇一五年的年底推出了刈包餅皮夾雞肉內餡的台灣限定款「福堡」，可見刈包深受台灣市場的喜愛。\n\
    \  但你知道，「刈包」到底應該怎麼唸嗎？刈當名詞是割草的镰刀，動詞則有「割」的意思，讀音為「ㄧˋ」。所以，刈包應該發音「ㄧˋ包」，至於大家習慣的刈包念法—「ㄍㄨㄚˋ」，其實是「割包」的閩南語發音喔。\n\
    \  到了刈包熱賣的年底尾牙，根據農民曆記載，其實是在每年的農曆十二月十六日。但現在很多公司行號慰勞員工會依據宴客方便或其他考量，會選在年底前挑一天或是隔年初辦春酒，宴請員工慰勞辛勞，感謝土地公一年來的保佑，並為來年祈福，所以並不拘泥非得在尾牙當天辦理宴席。"
