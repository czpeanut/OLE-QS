  stem: 「居廟堂之高，則憂其民；處江湖之遠，則憂其君。是進亦憂，退亦憂。」此段文句之意旨，與哪句最相近？
  options:
  - label: A
    content: 先憂事者後樂，先樂事者後憂
  - label: B
    content: 己欲立而立人，己欲達而達人
  - label: C
    content: 松柏後凋於歲寒，雞鳴不已於風雨
  - label: D
    content: 何事非君？何使非民？治亦進，亂亦進
- id: doc_112_桃園_石門_國文_g9s1e3_s3_20
  section: 3
  number: 20
  type: single
  page: 1
  stem: 有關孟子與孟子一書，下列選項何者不正確？
  options:
  - label: A
    content: 孟子是「亞聖」，為戰國時期偉大的思想家
  - label: B
    content: 《孟子》一書與《詩》《書》《易》合為「四書」
  - label: C
    content: 孟子主張「人性本善」、「民貴君輕」的思想
  - label: D
    content: 《孟子》篇名取自各章開頭幾字，無特定的涵義
