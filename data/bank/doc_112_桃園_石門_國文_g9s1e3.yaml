  group_stem: '（一）扁鵲三兄弟

    魏文侯曰：「子1 昆弟三人其孰最善為醫？」

    扁鵲曰：「長兄最善，中兄次之，扁鵲最為下。」

    魏文侯曰：「可得聞邪2？」

    扁鵲曰：「長兄於視3 病，未有形4 而除之，故名不出於家。中兄治病，其在毫毛5，故名不出於閭6。 若扁鵲者，鑱7 血脈，投毒藥8，敷肌膚間，而名出聞於諸侯。」

    魏文侯曰：「善。」

