- id: doc_112_桃園_石門_國文_g9s1e3_s3_29
  section: 3
  number: 29
  type: single
  page: 2
  stem: 「藏書室是一處有著許多迷睡靈魂的神奇陳列室，當我們呼叫他們，這些靈魂就甦醒過來。」這句話的意旨，與下列何者最接近？
  options:
  - label: A
    content: 許多作家在藏書室找到心靈的歸屬
  - label: B
    content: 好的作品可以喚醒讀者迷睡的靈魂
  - label: C
    content: 讀者可透過閱讀與作者的心靈相通
  - label: D
    content: 迷失在書海的讀者需要適當的指引
- id: doc_112_桃園_石門_國文_g9s1e3_s3_30
  section: 3
  number: 30
  type: single
  page: 2
  stem: 「臺灣海峽黑水溝的形成是受地形影響，使水流加速，最快可達每秒四公尺。當湍急的水流帶走水中的沉積與雜屑，海水少了許多反射陽光的雜質，使光線能貫穿深處，所呈現的色澤就如墨黑般的深藍。」根據這段文字，下列敘述何者最恰當？
  options:
  - label: A
    content: 海水的雜質含量與水流速度無關
  - label: B
    content: 海水的流速變慢，顏色就會變深
  - label: C
    content: 黑水溝的流速至少為每秒四公尺
  - label: D
    content: 黑水溝的水較清澈，透光性較佳
- id: doc_112_桃園_石門_國文_g9s1e3_s4_31
  section: 4
  number: 31
  type: single
  page: 2
  stem: 就文中所言，扁鵲三兄弟，何者醫術最高明？
  options:
  - label: A
    content: 長兄
  - label: B
