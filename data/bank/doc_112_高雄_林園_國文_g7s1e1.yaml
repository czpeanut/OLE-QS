- id: doc_112_高雄_林園_國文_g7s1e1_s5_2
  section: 5
  number: 2
  type: single
  page: 4
  stem: 作者到杭州求學，看到桂花如雨飄落時「金沙鋪地」的景象，就聯想到「母親一生辛勞，無怨無尤，就是因為她心中有一個金沙鋪地的西方極樂世界。」此段往事作者想抒發何種心情？
  options:
  - label: A
    content: 對桂花的眷戀之情
  - label: B
    content: 對杭州求學的回顧
  - label: C
    content: 對童年純真的緬懷
  - label: D
    content: 對母親的懷念之情
  group_stem: '念中學時到了杭州，杭州有一處名勝滿覺壠，一座小小山塢，全是桂花，花開時那才是香聞十里。我們秋季遠足，一定去滿覺壠賞桂花。「賞花」是藉口，主要的是飽餐「桂花栗子羹」。因滿覺壠除桂花以外，還有栗子。花季栗子正成熟，軟軟的新剝栗子，和著西湖白蓮藕粉一起煮，面上撒幾朵桂花，那股子雅淡清香是無論如何沒有字眼形容的。即使不撒桂花也一樣清香，因為栗子長在桂花叢中，本身就帶有桂花香。

    我們邊走邊搖，桂花飄落如雨，地上不見泥土，鋪滿桂花，踩在花上軟綿綿的，心中有點不忍。這大概就是母親說的「金沙鋪地，西方極樂世界」吧。母親一生辛勞，無怨無尤，就是因為她心中有一個金沙鋪地、玻璃琉璃的西方極樂世界。'
  lesson_raw:
    title: 桂花雨
    basis: 選自琦君桂花雨
