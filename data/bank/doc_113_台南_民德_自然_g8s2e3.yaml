  type: single
  page: 1
  stem: 同時用兩手的指頭，頂住鉛筆的兩端，如圖二。當鉛筆靜止不動，則此時甲端手指所施的力為 $F_\text{甲}$，乙端手指所施的力為 $F_\text{乙}$，甲端手指所受的壓力為
    $P_\text{甲}$，乙端手指所受的壓力為 $P_\text{乙}$，則下列敘述何者正確？
  options:
  - label: A
    content: $F_\text{甲} = F_\text{乙}$；$P_\text{甲} = P_\text{乙}$
  - label: B
    content: $F_\text{甲} < F_\text{乙}$；$P_\text{甲} > P_\text{乙}$
  - label: C
    content: $F_\text{甲} = F_\text{乙}$；$P_\text{甲} > P_\text{乙}$
  - label: D
    content: $F_\text{甲} = F_\text{乙}$；$P_\text{甲} < P_\text{乙}$。
