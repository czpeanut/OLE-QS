  section: 1
  number: 3
  type: single
  page: 1
  stem: 如圖一所示，三個杯子底面積相同，重量也相同，當杯子裡加入等高的水時，且欲以三個相同大小的鋁塊分別完全沒入三個杯子的水中，但不與杯子的底部接觸，且杯子中的水未溢出，則關於鋁塊放入前及鋁塊放入後的敘述何項正確？
