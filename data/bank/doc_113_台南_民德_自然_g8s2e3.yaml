  type: single
  page: 1
  stem: 作用於某物體上的兩力，兩力之合力為 10kgw，則此兩力可能為下列哪種組合？(甲)3kgw、7kgw (乙)6kgw、8kgw (丙) 10kgw、20kgw
    (丁)4kgw、15kgw (戊)4kgw、5kgw。
  options:
  - label: A
    content: 甲丁戊
  - label: B
    content: 甲乙丙
  - label: C
    content: 乙丙丁
  - label: D
    content: 乙丁戊。
