  stem: 下列「 」中的字義，何者前後相同？
  options:
  - label: A
    content: 意「猶」未盡／記憶「猶」新
  - label: B
    content: 貧「寒」／嚴「寒」
  - label: C
    content: 「拔」草／選「拔」
  - label: D
    content: 太平「盛」世／「盛」怒之下。
- id: doc_113_新北_桃子腳_國文_g8s2e3_s1_3
