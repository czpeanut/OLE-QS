- id: doc_113_新北_桃子腳_國文_g8s2e3_s3_40
  section: 3
  number: 40
  type: single
  page: 5
  stem: 根據本文內容，下列何者最符合本文所述？
  options:
  - label: A
    content: 廉租房住戶以城市中產階層為主
  - label: B
    content: 明朝才出現較具規模的廉租房
  - label: C
    content: 汴京廉租房可供5-10%汴京人民居住
  - label: D
    content: 負責政府公屋租賃的是「店宅務」。
  group_stem: "乙.  宋朝廉租房\n    說起廉租房的歷史，人們一般都認為廉租房誕生於西歐國家的近代化過程，比如說英國早在1844 年就成立了住房協會，為工資收入最低的工人租賃廉價住房。沒錯，廉租房的確是近代化的產物，因為近代化產生了一個龐大的城市貧民階層，住房問題的嚴重性前所未有地突顯出來，迫切要求政府供應廉價租房。但許多人未必知道中國宋代已被海外漢學家稱為「現代的拂曉時辰」，而且，也恰恰在宋代，已經出現了比較完備的廉租房制度，即政府長期性、規模化向城市的中下層居民提供廉價的公租房。\n\
    \    我們要說的宋朝廉租房便是宋政府「店宅務」轄下的公屋。店宅務，宋初又稱「樓店務」，太平興國初年改名「店宅務」。宋朝的京城及各州縣均設有店宅務，負責政府公屋的租賃、管理與維修。店宅務名下的公租房規模相當大，宋真宗天禧年間，汴京左右廂店宅務共有公租房23300\
    \ 間，宋仁宗天聖年間是26100 間，宋神宗熙寧年間有平房14626 間、宅子（別墅）164 所。以汴京常住人口一百多萬人、每口需住房一間計算，這批公租房至少可供1%～2%的汴京人口居住。\n\
    \    問題是，你怎麼斷定店宅務提供的公租房就是廉租房？只要我們找出店宅務公屋的租賃價，並與當時同一城市的私房租賃價、城市中下層市民的收入相比，這個問題便可迎刃而解。恰好《宋會要輯稿》收錄有天禧元年與天聖三年汴京店宅務的出租屋間數及租金收入總數，不難計算出北宋京城的公租房租金。政府公屋的月租金只需500文錢。\n\
    \   天禧元年（1017 年），汴京左右廂店宅務名下共有23300 間公租房，當年收到租金共140093 貫，可以算出，平均每間房的年租金約6 貫，月租金為500\
    \ 文錢；天聖三年（1025 年），京城店宅務轄下的公租房增加到26100 間，當年的租金收入為134629 貫，平均每間房屋的年租金約5 貫多一點，月租為400\
    \ 多文錢。\n   大中祥符八年（1015 年）的一道減租法令也透露了店宅務公屋的租金水平並不高：「八年正月詔，市中延燔官舍，其修益訖移居者，免僦①居二十日；應僦官舍居，賦直十五錢者，每正至寒食免三日之直。」當時，由於店宅務一批公屋發生了火災，朝廷決定，凡房屋被燒、需要搬遷整修的人家，可以安排在政府公屋免費居住二十天；凡租住店宅務公屋、日租金15\
    \ 文錢以下的貧困住戶，逢正至寒食節，可免收三日房租。日租15 文錢，月租即450 文，跟我們上面的計算結果差不多。\n    在宋代汴京，一戶尋常市民的生活成本一般又是多少文錢呢？北宋政府對城市貧民的救濟標準是每人「日給錢二十」。每日二十文錢，應該就是一名城市底層人的最低生活費用了。換言之，當時維持一個五口之家的基本生活開銷，每月至少要3\
    \ 貫錢。生活在汴京的中下層市民家庭，如果家中有一名勞動力每日能賺取200 文錢，或者家中有兩名勞動力，每人每日賺100 文錢，那麼在刨掉衣食方面的必要開支之後，每月四五百文的房租，還是支付得起的。如果家庭日收入不足100\
    \ 文，則溫飽堪憂，屬於需要政府救濟的「不能自存者」。\n                             （吳鉤 私家歷史）\n【注釋】\n（１）僦，音ㄐㄧㄡˋ，租賃。"
- id: doc_113_新北_桃子腳_國文_g8s2e3_s3_41
  section: 3
  number: 41
  type: single
  page: 5
  stem: '若你是宋朝時租廉租房居住的鄉民，在不幸發生火

    災後，政府最可能會有什麼下列哪項措施？'
  options:
  - label: A
    content: 每日補助20 文
  - label: B
    content: 可於政府公屋免費居住20 天
  - label: C
    content: 協助尋找勞務工作
  - label: D
    content: 補助房屋裝潢費用。
  group_stem: "乙.  宋朝廉租房\n    說起廉租房的歷史，人們一般都認為廉租房誕生於西歐國家的近代化過程，比如說英國早在1844 年就成立了住房協會，為工資收入最低的工人租賃廉價住房。沒錯，廉租房的確是近代化的產物，因為近代化產生了一個龐大的城市貧民階層，住房問題的嚴重性前所未有地突顯出來，迫切要求政府供應廉價租房。但許多人未必知道中國宋代已被海外漢學家稱為「現代的拂曉時辰」，而且，也恰恰在宋代，已經出現了比較完備的廉租房制度，即政府長期性、規模化向城市的中下層居民提供廉價的公租房。\n\
    \    我們要說的宋朝廉租房便是宋政府「店宅務」轄下的公屋。店宅務，宋初又稱「樓店務」，太平興國初年改名「店宅務」。宋朝的京城及各州縣均設有店宅務，負責政府公屋的租賃、管理與維修。店宅務名下的公租房規模相當大，宋真宗天禧年間，汴京左右廂店宅務共有公租房23300\
    \ 間，宋仁宗天聖年間是26100 間，宋神宗熙寧年間有平房14626 間、宅子（別墅）164 所。以汴京常住人口一百多萬人、每口需住房一間計算，這批公租房至少可供1%～2%的汴京人口居住。\n\
    \    問題是，你怎麼斷定店宅務提供的公租房就是廉租房？只要我們找出店宅務公屋的租賃價，並與當時同一城市的私房租賃價、城市中下層市民的收入相比，這個問題便可迎刃而解。恰好《宋會要輯稿》收錄有天禧元年與天聖三年汴京店宅務的出租屋間數及租金收入總數，不難計算出北宋京城的公租房租金。政府公屋的月租金只需500文錢。\n\
    \   天禧元年（1017 年），汴京左右廂店宅務名下共有23300 間公租房，當年收到租金共140093 貫，可以算出，平均每間房的年租金約6 貫，月租金為500\
    \ 文錢；天聖三年（1025 年），京城店宅務轄下的公租房增加到26100 間，當年的租金收入為134629 貫，平均每間房屋的年租金約5 貫多一點，月租為400\
    \ 多文錢。\n   大中祥符八年（1015 年）的一道減租法令也透露了店宅務公屋的租金水平並不高：「八年正月詔，市中延燔官舍，其修益訖移居者，免僦①居二十日；應僦官舍居，賦直十五錢者，每正至寒食免三日之直。」當時，由於店宅務一批公屋發生了火災，朝廷決定，凡房屋被燒、需要搬遷整修的人家，可以安排在政府公屋免費居住二十天；凡租住店宅務公屋、日租金15\
    \ 文錢以下的貧困住戶，逢正至寒食節，可免收三日房租。日租15 文錢，月租即450 文，跟我們上面的計算結果差不多。\n    在宋代汴京，一戶尋常市民的生活成本一般又是多少文錢呢？北宋政府對城市貧民的救濟標準是每人「日給錢二十」。每日二十文錢，應該就是一名城市底層人的最低生活費用了。換言之，當時維持一個五口之家的基本生活開銷，每月至少要3\
    \ 貫錢。生活在汴京的中下層市民家庭，如果家中有一名勞動力每日能賺取200 文錢，或者家中有兩名勞動力，每人每日賺100 文錢，那麼在刨掉衣食方面的必要開支之後，每月四五百文的房租，還是支付得起的。如果家庭日收入不足100\
    \ 文，則溫飽堪憂，屬於需要政府救濟的「不能自存者」。\n                             （吳鉤 私家歷史）\n【注釋】\n（１）僦，音ㄐㄧㄡˋ，租賃。"
