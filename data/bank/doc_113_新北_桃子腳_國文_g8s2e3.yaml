- id: doc_113_新北_桃子腳_國文_g8s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: "由「南陽 諸葛廬，西蜀 子雲亭」可推知作者的心態\n  為何？"
  options:
  - label: A
    content: 靜待時機，一展抱負
  - label: B
    content: 恬淡無為，不求功名
  - label: C
    content: 看破紅塵，與世隔絕
  - label: D
    content: 安於現狀，故步自封。
  lesson_raw:
    number: 第七課
    title: 陋室銘
    basis: 引用陋室銘文句
- id: doc_113_新北_桃子腳_國文_g8s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: "在陋室銘一文中作者居於陋室卻能安然自得的態度，\n  與下列何者最相近？"
  options:
  - label: A
    content: 願無伐善，無施勞
  - label: B
    content: 人一己百，人十己千
  - label: C
    content: 不患人之不己知，患不知人也
  - label: D
    content: "環堵蕭然，不蔽風日，短褐穿結，簞瓢屢空—晏如\n  也。"
  lesson_raw:
    number: 第七課
    title: 陋室銘
    basis: 題目指明陋室銘一文
- id: doc_113_新北_桃子腳_國文_g8s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: "借用事物局部特徵或與其關係密切的詞語來替代稱呼\n  的技巧，稱為「借代」。下列各組文句「 」中的借代詞語\n  ，何者不同?"
  options:
  - label: A
    content: "時窮節乃見，一一垂「丹青」/人生自古誰無死，留取\n 丹心照「汗青」"
  - label: B
    content: "中秋佳節將至，各地遊子紛紛返鄉與親人團聚，共賞\n 「嬋娟」/ 「金烏」自海面升起，只見天邊雲彩變幻，繼\n 而紅光四射"
  - label: C
    content: "她的眼神如「回祿」之焰，燃盡了他所有的矜持與理智\n /一場「祝融」無情，燒毀了整片森林，造成生態浩劫"
  - label: D
    content: "旁人勸和後，他們終於化「干戈」為玉帛，由敵人變為\n 朋友了/這兩個國家長年「烽火」不斷，人民一直處在恐\n 懼之中"
- id: doc_113_新北_桃子腳_國文_g8s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: '下列成語皆與「良好品德」有關，請根據文意，選

    出使用不正確的句子。'
  options:
  - label: A
    content: "他們兄弟倆「兄友弟恭」，感情很好，且時常互相幫\n 忙，真是令人羨慕"
  - label: B
    content: "他除了應得的俸祿，其餘則「一介不取」，是位清廉的\n 好官，深受人民愛戴。"
  - label: C
    content: "革命烈士慷慨赴義的情操，是「飲水思源」的最佳寫\n 照。"
  - label: D
    content: "彥婷為人「豁達大度」，不念舊惡，在對手急需幫助之\n 時雪中送炭，令人十分欽佩。"
- id: doc_113_新北_桃子腳_國文_g8s2e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: "「禍福互為倚伏，成敗轉眼易位，由失敗而成功或許\n 累計了二十年，由成功而失敗，有時驟生於旦夕之間。」這\n段文字的主要含義為何？"
  options:
  - label: A
    content: 家境富裕的人未必能成功，出身低微的人也未必會失敗
  - label: B
    content: 成功或許需要經歷千辛萬苦，失敗卻可能在一瞬間發生
  - label: C
    content: 禍福相生相滅，成功與失敗必然會同時發生
  - label: D
    content: 若沒有二十年的磨練，便無法取得成功。
- id: doc_113_新北_桃子腳_國文_g8s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: '下列對成功的看法，何者與成功為失敗之母一文相去

    最遠？'
  options:
  - label: A
    content: 保持謙卑而不驕傲，才不會失去得來不易的成功
  - label: B
    content: 成功後能小心謹慎，以保持原來地位者實屬難得
  - label: C
    content: 在成功之後，因得意忘形而迅速衰敗的事層出不窮
  - label: D
    content: 好不容易成功的人，不會輕易被一時的勝利沖昏了頭。
- id: doc_113_新北_桃子腳_國文_g8s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: '由兩個意思相反的字所組成，且同時保留兩個字意

    思的複詞，稱為「反義複詞」。請問下列何者使用最正確?'
  options:
  - label: A
    content: 二手貨品質「良莠」不齊，挑選時應做全面性的比較
  - label: B
    content: 行動前要先做好充分準備，才不會「遲早」失據
  - label: C
    content: 人類若持續破壞自然環境，「貴賤」會自食惡果
  - label: D
    content: 這部電影「進退」共賞，票房屢創新高。
- id: doc_113_新北_桃子腳_國文_g8s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: "作者在看雲的日子一文中善於運用鮮活的譬喻來描\n 寫白雲。下列文句，何者無法看出此項寫作特色？"
  options:
  - label: A
    content: "我想那雲朵像極了舞者，將藍天當成舞臺，恣意的在上\n 頭揮灑絕佳的舞技"
  - label: B
    content: "夏天的雲，綿密細緻，經常是一大朵一大朵獨自飄動，\n 有時候真的像極了可口清涼的霜淇淋"
  - label: C
    content: "如果仔細觀看，它們就像是具有昂揚生命力的精靈，   \n 蹦蹦跳跳喳喳呼呼的不斷舞動身姿"
  - label: D
    content: '清晨起床，打開窗簾，赫然瞧見一片片雲朵便在窗外流

      動。'
  lesson_raw:
    number: 第八課
    title: 看雲的日子
    basis: 題目指明看雲的日子一文
- id: doc_113_新北_桃子腳_國文_g8s2e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: "「呼嘯而過的日子，從不曾真正離去，只是換種風\n  情繼續在天涯響遏行雲，見證一切。」根據本文，這段文\n  字所表達的含義與下列何者最相近？"
  options:
  - label: A
    content: "經過歲月的洗禮，童稚蛻變為成熟，能更了然的面對\n  未來"
  - label: B
    content: "失敗是成功最佳的墊腳石，記取教訓才能創造璀璨的\n  前程"
  - label: C
    content: 凡走過必留下痕跡，只要肯用心打拚，一定會有收穫
  - label: D
    content: "時間絕不會為任何人停留，懂得珍惜光陰才能讓生命\n  變更有價值。"
  lesson_raw:
    number: 第八課
    title: 看雲的日子
    basis: 看雲的日子課文結語
- id: doc_113_新北_桃子腳_國文_g8s2e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: "聯綿詞就是合兩個字成一詞，表示一個意義。這  \n   兩個字不能再分析。下列文句「 」中的詞語，何者不屬\n於聯綿詞?"
  options:
  - label: A
    content: "如今已是人事全非，我只能獨自在此「徘徊」，追\n   憶當年"
  - label: B
    content: "白雲如一葉扁舟，「逍遙」自在的航行於蔚藍遼闊的天  \n  空中。"
  - label: C
    content: 消費者正「醞釀」拒買，以抵制商品不合理的漲價
  - label: D
    content: '山路「崎嶇」不平，一旁又是懸崖峭壁，讓我們不禁

      望而生畏。'
- id: doc_113_新北_桃子腳_國文_g8s2e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: '下列成語皆與「雲」有關，根據文意，何者使用最

    正確?'
  options:
  - label: A
    content: "晉安為人謙和，表現出色，在職場上「判若雲泥」是\n    理所當然的事"
  - label: B
    content: "聽到老師如此清楚的解說，使我茅塞頓開，有如「撥  \n   雲見日」一般"
  - label: C
    content: "人各有志，有人汲汲於功名利祿，但也有人嚮往「愁\n  雲慘霧」般的自在生活"
  - label: D
    content: "品瑜這篇文章如「白雲蒼狗」般自然暢達，受到老  \n師的讚賞。"
- id: doc_113_新北_桃子腳_國文_g8s2e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 下列「 」中的成語，何者運用恰當？
  options:
  - label: A
    content: "此地山青水秀，「物殷俗阜」，百姓安居樂業，是宜\n    居之地"
  - label: B
    content: "颱風過後，天空放晴，氣溫宜人，真是「河清海晏」\n    的一天"
  - label: C
    content: "上班時間搭捷運好擠，我每天都被人「傾軋擠害」真\n    的很痛苦"
  - label: D
    content: "他半生顛沛，半生流離，在這裡定居之前一直過「金\n    城千里」的生活。"
- id: doc_113_新北_桃子腳_國文_g8s2e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: '下列「」內的詞語都有「然」字，下列哪一個句

    子使用最正確？'
  options:
  - label: A
    content: "它就在空曠偉大的天地中，與「浩然」之氣相往來，與\n  自然成一整體"
  - label: B
    content: "窗外秋雨綿綿，他「赫然」凝視著窗景，思緒悠悠然\n 展開"
  - label: C
    content: 放學後的教室空無一人，「儼然」比白天還吵雜
  - label: D
    content: 他成功考上第一志願，全家歡笑聲不斷，氣氛「悻然」
- id: doc_113_新北_桃子腳_國文_g8s2e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: '項鍊一文中，對比的安排是寫作經營的重點，下列

    何者不是故事中對比情節的安排？'
  options:
  - label: A
    content: 男女主角遺失項鍊前後生活狀況的對比
  - label: B
    content: '瑪蒂達幻想中溫暖明亮的大廳和現實中寒傖老舊的公寓

      的對比'
  - label: C
    content: 安於平凡的丈夫和其結婚前英俊挺拔男友的對比
  - label: D
    content: 瑪蒂達幻想中的生活和其實際生活的對比
  lesson_raw:
    number: 第十課
    title: 項鍊
    basis: 題目指明項鍊一文
- id: doc_113_新北_桃子腳_國文_g8s2e3_s2_18
  section: 2
  number: 18
  type: single
  page: 2
  stem: '子貢問為仁。子曰；「工欲善其事，必先利其器。」

    此即謂培養仁德須如何呢？'
  options:
  - label: A
    content: 師心自用
  - label: B
    content: 事賢友仁
  - label: C
    content: 里仁為美
  - label: D
    content: 克己復禮。
  lesson_raw:
    number: 論語
    title: 論語
    basis: 論語選
