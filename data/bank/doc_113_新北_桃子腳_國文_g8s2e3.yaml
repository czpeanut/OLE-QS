  - label: B
    content: 多拉A 夢：可戒勉自己或頌揚功德
  - label: C
    content: 胖虎：屬於應用文，一般篇幅短小
  - label: D
    content: 小夫：陋室銘是屬於頌揚功德。
  lesson_raw:
