    content: 三則故事都在歌詠愛情的美好
  group_stem: "戊.   \n    優質的文學作品，經得起時間考驗。「短篇小說之王」蓋伊．德．莫泊桑（1850-1893）名著《羊脂球》、《項鍊》、《我的叔叔于勒》……都是傳世之作，大家耳熟能詳，暫不贅述。我們且聊聊《面具》、《泰列埃夫人之家》和《模特兒》這三篇短篇小說。\n\
    \    這三個故事，清楚可見莫泊桑慣用的書寫技法：從平常人視而不見的日常平淡生活中，挖掘生命和生活的本質意義與美學價值的內涵。表面上看，莫泊桑無非是以一些凡人小事作為題材，但其隱藏在文本深處，對人性的諷刺，及表達人性與世俗間的衝突、矛盾，卻非常深刻而且犀利。這是我最佩服、也最鍾愛莫泊桑作品的理由。\n\
    \    1952 年，法國導演馬克斯．奧菲爾斯將之拍成一部三段式電影，名為「Le plasisir 歡愉」。該片在半個多世紀後的今天來看，非但不覺得過時，反倒覺得諷刺性更強，戲劇張力更大。\n\
    \   《面具》在講一個不服老的老翁昂布魯瓦，年輕時帥氣瀟灑無人能敵，是風流倜儻的理髮師，名媛、貴婦、女明星都追求戀慕他。他無法接受自己衰老的樣子，所以天天戴上年輕俊俏的人皮面具，參加舞會，總要跳到體力不支昏倒。某次，舞會現場一位醫生為他急救，面具下的他白髮蒼蒼，滿臉皺紋，口裡只剩三兩顆爛牙，老得相當不堪。\n\
    \    醫生叫了馬車送他回到破落老樓，老妻招呼著，她告訴醫生：「當年他把我帶回家後，我就一天也沒離開過他。……我是他妻子兼傭人……他每天在外風騷，黎明方歸，我則夜夜苦等他回來……。」醫生離去，莫泊桑旁白：「醫生目睹世界各地每天有人以各種方式，上演一個永恆戲劇的第一幕。」這永恆戲劇的第一幕，莫不也是永恆戲劇的最後一幕呢？我腦海裡糾結著，莫泊桑不用美人遲暮，而用了美男子遲暮，這其中的迂迴，與對人性的體悟和掌握，著實更見莫泊桑的功力。\n\
    \   《泰列埃夫人之家》，我喜歡稱它《院子》。這是個不尋常的院子，這座小樓其實是妓院，說得風雅些，就是幾位丰姿綽約的夫人，以酒、以咖啡、以甜美的歌聲、以美貌風韻、以靈以肉，熱情接待士紳、名流、美國大兵的場域。\n\
    \    某個週末夜晚，院子大門深鎖，掛出「東主有喜、休假一天」告示牌。不得其門而入的美國大兵在門口躁動鬧事，尋芳不著的退休市長、法官、荷蘭布商……等六、七位食色男子，唉聲嘆氣，結伴散步到橋墩下閒聊，他們因寂寞難以宣洩、心情不佳，弄得不歡而散……。\n\
    \    「泰列埃夫人之家」的女主人茱莉亞出身單純農家，嫁到諾曼第大運河旁港口的小鎮，她已寡居兩年。哥哥約瑟夫在鄉下當木匠，以女兒領聖餐為名，請妹妹帶著眾夫人搭火車返鄉熱鬧一下。他駕著自製簡陋馬車到火車站接她們，鄉間小路風光明媚，夫人們開心唱歌，流露天真本性……。\n\
    \    第一次夜宿農家，有人因太安靜而耳鳴，有人覺得不安，這一夜她們失眠了。隔天清早，大家上教堂禮拜，牧師證道，夫人們感動得都哭了，抽泣聲感染了教堂裡的會眾，男男女女全都流下淚來……。\n\
    \   約瑟夫暗暗愛慕羅莎夫人，教堂禮拜結束，愛筵之後，約瑟夫醉言醉語，闖進羅莎夫人房裡示愛，被他妹妹打出房去；叫他下樓備馬車，送她們去火車站。約瑟夫目送火車載著夫人們離去，他的一日戀情，在淡淡的薄愁裡匆匆結束。\n\
    \    院子又開張了，當晚高朋滿座，豪飲狂歡，衣冠楚楚的偽君子爭先恐後光臨；老商賈對妻子扯謊，說有緊急商務，衝出家門；到院子找樂子。無止盡的慾望，人性的貪婪，在院子裡泛著鮮艷明麗的光芒！莫泊桑處理人性的軟弱與生命的無奈，不溫不火，隱隱約約的諷刺，全然的雲淡風輕，好像就是你鄰居家發生的，再尋常不過的家常小事一樣；卻教人餘味繚繞，幽思緜長。\n\
    \   《模特兒》的故事更平淡無奇，年輕畫家薩默愛上美麗清純的模特兒約瑟芬。「始亂『中』棄，『終』不離不棄。」兩句話就講完了。薩默迷戀約瑟芬，同居三個月後發現她與一般模特兒沒有兩樣；漸漸地，開始爭吵，激烈爭吵……；畫家留書一封、鈔票一張，出走了。約瑟芬四處找他，最後在藝術經紀人家裡找到他。約瑟芬說：「你若離棄我，去娶別人，我就從窗子跳樓自殺。」薩默指指樓上的窗子，約瑟芬真跳了。她雙腿殘了，薩默娶了她。故事的最後，他推著輪椅，陪約瑟芬看海。莫泊桑用這麼老套的故事，究竟要表現甚麼呢？我猜，他要表現的是：日光之下沒有新鮮事。不過，依我看，月光下可就不一定了。\n\
    \                    (王學敏 莫泊桑的三個故事)"
