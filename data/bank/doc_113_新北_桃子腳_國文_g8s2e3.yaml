  type: single
  page: 7
  stem: '根據本文，關於「缺乏運用語文的思想」的敘述，

    下列何者最正確？'
  options:
  - label: A
    content: 心中想說的話總思慮再三
  - label: B
    content: 別人總搶在自己之前表達
  - label: C
    content: 無法精準說出自己心中的想法
  - label: D
    content: 心中的情感受到壓抑。
  group_stem: "丁.   \n   當了老師，每天都有說不完的話，也有固定的聽眾，但經常說來說去，總覺得有一句「心頭話」找不到適當的字眼來表達，這也許就像是有許多人，胸中禪機滿地，卻沒有一聯偈語；一生充滿傳奇，比任何小說都要精采，但卻從未寫出任何片段。文藝理論家朱光潛先生說明這種情況是：「缺乏運用語文的思想」。\
    \ 語文人人能夠，在使用上頂多有精粗之分，但是「運用語文的思想」卻不一定每個人都具備。而成為作家的，不過就是經常在訓練中 強化了自己的運用語文的思想，因此任何風景人事所給予他的刺激，都可以透過文字的形式表現出來。換一個角度來說，許多優秀的文學傑作，看似那麼平淡，卻又如此動人如此雋永，那就是因為作者率先用文字寫下了人人都可以體會，但卻不易用實際文字描述的情狀。傳說李白過黃鶴樓看見「崔顥題詩在上頭」而不能作詩，這是因為他的靈感、情緒與修辭都被崔顥搶先用去，而無法再創新意之故，因此嘆道：「眼前有景道不得」。\
    \ 如何運用語文表達難以言喻的動人情狀，其實就是寫作本身的探討，這種能力的培養實有必要深究的。而我現在回想起來，在我心中 吶喊「我有話要說」青少年歲月裡，如果將麥克風放在我的面前，我是不是真能完整而準確地說出那些苦悶、壓抑與寂寥所帶來的憂傷？\n\
    \            （摘錄自徐國能〈我有話要如何說〉）"
