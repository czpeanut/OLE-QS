  group_stem: "丙.    \n 台灣隊長陳傑憲打進WBC 經典賽！\n關於他的秘密\n一起來認識沒有極限的陳傑憲！\n節錄自《ELLE 名人面對面》\n\
    \n中華隊拿下世界棒球12 強賽冠軍！ 台灣隊長陳傑憲賽後落淚：\n「請愛我們，請繼續支持我們，謝謝團隊讓世界看見台灣。我們創造了歷史，創造了奇蹟。所以有夢的人，就努力去闖。謝謝球迷，在東京巨蛋氣勢不輸台北大巨蛋。謝謝老婆，這座冠軍獻給妳。獻給天上的爸媽，你的兒子讓人很驕傲，希望你們有看到。」\n\
    \n一、陳傑憲拿下12 強MVP，台灣隊長當之無愧\n「我壓力真的很大，因為我們台灣要跟世界對抗，挑戰性真的很大。我告訴我的隊友，不用把目標放遠，每天把每一步走好，慢慢走，就能走到最後。這次我們創造了歷史、創造了奇蹟，這座冠軍對我們來說，就是奇蹟。」謝謝陳傑憲帶領中華隊寫下歷史，攻守俱佳的他，也不負眾望拿下大會MVP！\n\
    陳傑憲賽後感言聲淚俱下，令不少球迷也跟著鼻酸。陳傑憲出生棒球世家，父親陳建彰不僅曾是棒球國手，也是帶他走上棒球這條路的領路人、教練。這幾年陳傑憲面臨至親相繼離世，不僅父母、爺爺，哥哥也英年早逝，這一路走來真的不容易。而這些打擊成為滋養陳傑憲的動力，讓他從低潮爬起，拿下世界冠軍更奪得MVP\
    \ 殊榮。\n\n二、陳傑憲手勢是什麼？\n陳傑憲在世界棒球12 強賽中轟出3 分全壘打，成功拉開台日大戰比分，最後帶領中華隊成功拿下冠軍。當時，陳傑憲手勢引起大家注意，他滿場跑、兩隻手框在胸前，因為12\
    \ 強賽中，只有我們的隊伍，每個人的胸口都是空白的。\n別場比賽你會在球員的衣服上看見Japan、USA 字樣，唯獨我們這支冠軍球隊胸前空空，陳傑憲賽後受訪時表示：「我們從一路真的不被看好，被當作笑話，努力的走到了最後。我想要跟大家球迷說，請愛我們、請支持我們，我們一直都在努力著不要放棄，讓世界看見台灣。」\n\
    三、高中曾赴日讀書，最終決定效力家鄉\n從小在台灣長大的陳傑憲，高中學涯到日本就讀岡山共生高校，和吳復連之子吳念庭為同時期的搭檔。畢業後陳傑憲曾參加日本職棒選秀，最後還是決定回到家鄉，為中華職棒效力。\n\
    曾在日本讀書，為陳傑憲打下良好的語言基礎，這次世界棒球12 強賽，陳傑憲在面對日本媒體詢問時都能以日文流利對答，讓記者們都相當吃驚，他在日本的人氣也跟著水漲船高！\n\
    四、也許不是天才，但可以當最努力的\n身高173 公分的陳傑憲，在高中時曾夢想加入日本職棒，但卻沒有成功，加上家中經濟條件的關係，陳傑憲最終回台發展，並將在日本學到的職人精神帶回台灣，造就了如今的輝煌。\n\
    在接受媒體受訪時，陳傑憲曾經說過自己最喜歡的日語就是：「只要去做，就能成功。（やればできる）」他說這是高中的校訓，「校長總是說，大家只要努力就能做到。」也許我們不是天才、不是贏在起跑點，但我們可以當最努力的那一個。\n\
    五、離開球場，也是「第一名」的超級奶爸！\n陳傑憲在球場上叱吒風雲，將所有的溫柔，都留給了自己的家庭。除了時常在社群上跟老婆Hailey 曬出甜蜜互動以外，陳傑憲最常分享的，還是自己的寶貝兒子。即使練球很累、比賽很累，但陳傑憲從不忘了撥出時間陪伴家人。\n\
    他曾經在IG 寫下：「成為人父之後更深刻體會到家人的意義，做任何事情，已經不是單純為了自己，而是為了老婆、小孩，為了這個家去做努力。也謝謝老婆挺著33週的大肚子，帶著1\
    \ 歲3 個月的兒子一起參與這次的盛會，過程中真的很辛苦。」\n六、即使外界不看好，他用成績證明\n面對世界棒球12 強各國強敵，這次中華隊組從組軍以來就一直不被看好，唱衰聲四起，但陳傑憲從來沒有因為這樣而卻步。\n\
    在面對媒體的訪問中他說：「不看好嗎？我不相信外界怎麼說，我相信我們團隊，請球迷相信我們。」、「棒球就是結果好與壞、輸或贏的運動，只要盡百分之百的力量和對手對抗，每次比賽經驗值都會提升。」而他也真的做到了。\n\
    七、說到做到、沒有極限的陳傑憲\n因為中華隊的不懈努力，帶著台灣人民看到不一樣的風景、前進東京。中華隊改寫歷史，在2024 世界棒球12 強賽締造史詩級戰績。陳傑憲當初許下的諾言，真的做到了！\n\
    在前往日本東京之前，陳傑憲以隊長之姿帥氣發言，「開訓儀式時就說過，我們會用100%的力量前進東京，我們真的做到了！我們想要成為台灣的驕傲，所以我們每一場比賽都盡最大的努力，為台灣拿下最好的成績！」"
- id: doc_113_新北_桃子腳_國文_g8s2e3_s3_45
  section: 3
