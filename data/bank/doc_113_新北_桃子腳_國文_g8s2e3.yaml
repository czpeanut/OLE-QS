  section: 2
  number: 19
  type: single
  page: 2
  stem: 「管仲之力也」一句是說管仲如何？
  options:
  - label: A
    content: 以德行仁
  - label: B
    content: 以禮待人
  - label: C
    content: 以利誘人
  - label: D
    content: 以霸取仁。
  lesson_raw:
    number: 論語
    title: 論語
    basis: 論語選
- id: doc_113_新北_桃子腳_國文_g8s2e3_s2_20
  section: 2
  number: 20
  type: single
  page: 2
  stem: '由「師冕見」一文可知，孔子心目中的「與師言之

    道」為何？'
  options:
  - label: A
    content: 恭謹謙和
  - label: B
    content: 密切追隨
  - label: C
    content: 察言觀色
  - label: D
    content: 體貼需要。
  lesson_raw:
    number: 論語
    title: 論語
    basis: 論語選「師冕見」
- id: doc_113_新北_桃子腳_國文_g8s2e3_s2_21
  section: 2
  number: 21
  type: single
  page: 2
  stem: 「子張書諸紳」其原因為何？
  options:
  - label: A
    content: 展現紳士名流風範
  - label: B
    content: 向人炫耀，沽名釣譽
  - label: C
    content: 隨時觀看，深怕忘記
  - label: D
    content: 裝飾衣帶，美化衣著。
  lesson_raw:
    number: 論語
    title: 論語
    basis: 論語選「子張書諸紳」
- id: doc_113_新北_桃子腳_國文_g8s2e3_s2_22
  section: 2
  number: 22
  type: single
  page: 2
  stem: '孔子說「友直，友諒，友多聞」，是因為結交這三種

    朋友可以收到何種效果?'
  options:
  - label: A
    content: 能言善辯
  - label: B
    content: 助長威望
  - label: C
    content: 以友輔仁
  - label: D
    content: 廣結良緣。
  lesson_raw:
    number: 論語
    title: 論語
    basis: 論語選
- id: doc_113_新北_桃子腳_國文_g8s2e3_s2_23
  section: 2
  number: 23
  type: single
  page: 3
  stem: '由「生而知之者」一文可知 ，孔子對下列哪一種人

    的評價最低？'
  options:
  - label: A
    content: 生而知之
  - label: B
    content: 學而知之
  - label: C
    content: 困而學之
  - label: D
    content: 困而不學。
  lesson_raw:
    number: 論語
    title: 論語
    basis: 論語選「生而知之者」
- id: doc_113_新北_桃子腳_國文_g8s2e3_s2_24
  section: 2
  number: 24
  type: single
  page: 3
  stem: 「不學詩，無以言！」句中的「無以言」意思為何？
  options:
  - label: A
    content: 沒有說話的餘地
  - label: B
    content: 話說得不流利
  - label: C
    content: 話說得不得體
  - label: D
    content: 不能明確回答孔子的問話。
  lesson_raw:
    number: 論語
    title: 論語
    basis: 論語選
- id: doc_113_新北_桃子腳_國文_g8s2e3_s2_25
  section: 2
  number: 25
  type: single
  page: 3
  stem: '「少之時，血氣未定，戒之在色。」句中的「色」

    字，其意義與下列何者相同？'
