  stem: '下圖為甲、乙、丙三班英文段考分數的盒狀圖，已知甲、乙、丙三個班級皆有 34 名學生。

    小妍、小翊、小美和小文 4 人針對盒狀圖的說法如下； (素養)

    小妍：若將三班的 $Q_{1}$ 依大小關係排序，可得丙＞甲＞乙。

    小翊：若將三班的全距依大小關係排序，可得甲＞丙＞乙。

    小文：若甲班的小明、乙班的小英、丙班的小君都是 75 分，則三人的名次會一樣。

    小美：丙班至少有 $\frac{1}{4}$ 的人，分數比乙班的最高分還高。

    請問以上 4 人何者的說法不正確？'
