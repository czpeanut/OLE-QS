  section: 7
  number: 43
  type: single
  page: 3
  stem: What do you pass on your right after leaving the train station and walking
    for some time?
  options:
  - label: A
    content: A large supermarket with many people and parking spaces for cars and
      bikes.
  - label: B
    content: A small park with trees and flowers next to the street.
  - label: C
    content: The post office close to the city library.
  - label: D
    content: A bus stop in front of the train station for bus number 2.
  group_stem: 'I.

    How to Get to the City Library

    Do you need to go to the city library from the train station? It is easy!


    When you leave the train station, you will see a big street. Walk on this street
    for about 10 minutes. On

    your right side, you will pass a small park. The park has many trees and flowers.
    Keep walking until you see

    a supermarket. The supermarket is called “Easy Shop”, and it will be on your left
    side.


    At the supermarket corner, turn left. This street is very busy with cars, so walk
    carefully. After 5 minutes,

    you will see a red building. This building is the post office. The city library
    is near the post office.


    If you do not want to walk, you can take a bus. The bus stop is in front of the
    train station. Take bus number

    2. The bus ride to the city library takes only 5 minutes.


    Enjoy your visit to the city library.


    carefully 小心地'
