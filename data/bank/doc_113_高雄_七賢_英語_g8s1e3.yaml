- id: doc_113_高雄_七賢_英語_g8s1e3_s7_46
  section: 7
  number: 46
  type: single
  page: 4
  stem: Why was Taiwan’s victory against Japan in the Premier12 final so special?
  options:
  - label: A
    content: It was Taiwan’s first baseball game against Japan.
  - label: B
    content: Taiwan won their first Premier12 championship in baseball.
  - label: C
    content: Taiwan didn’t play in an international tournament for 32 years.
  - label: D
    content: Taiwan won every game in the Premier12 tournament.
  group_stem: 'II.

    Team Taiwan Wins the Premier12!

    On November 24, 2024, Taiwan’s baseball team won a big game! In the Premier12
    final, Taiwan played

    against Japan and won 4-0. This was a very special win for Taiwan. This win was
    big because Taiwan did not

    beat Japan for 32 years. Taiwan stopped Japan’s winning streak and became the
    champions!

    This win was special because Taiwan never beat Japan in a big tournament in the
    past 32 years. The last time

    Taiwan beat Japan was in 1992 at the Olympics in Barcelona. Now, Taiwan has won
    its first Premier12

    championship, and fans in Taiwan feel proud and excited.


    Star Players

    Two players, Lin Chia-Cheng and Chen Chieh-Hsien, helped Taiwan win. Lin Chia-Cheng
    hit the ball that

    scored Taiwan’s first run. This gave the team energy. Before the tournament, not
    many people knew Lin, but

    now they know him because of his good catching and teamwork.

    Later, Taiwan’s captain, Chen Chieh-Hsien, hit a three-run home run. This added
    three more runs. Chen

    played well and he won the Premier12 MVP. After the game, he said, “I want to
    thank my teammates. We won

    this together!” He was very happy and cried while speaking.

    All the players worked hard to win this big tournament. We will not forget Taiwan’s
    victory for a long time!


