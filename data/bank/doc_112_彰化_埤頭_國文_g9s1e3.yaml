- id: doc_112_彰化_埤頭_國文_g9s1e3_s4_42
  section: 4
  number: 42
  type: single
  page: 3
  stem: ( )根據本文，關於登上綠星的人類，下列敘述何者正確？ (A)只知攜帶各種名貴物品，卻毫無一技之長 (B)登上綠星後不久，心情由興奮轉變為恐慌 (C)只要經濟許可，多數人皆能如願移居綠星
    (D)目睹地球爆炸的瞬間，發出惋惜的驚嘆聲。
  options:
  - label: A
    content: 只知攜帶各種名貴物品，卻毫無一技之長
  - label: B
    content: 登上綠星後不久，心情由興奮轉變為恐慌
  - label: C
    content: 只要經濟許可，多數人皆能如願移居綠星
  - label: D
    content: 目睹地球爆炸的瞬間，發出惋惜的驚嘆聲。
  group_stem: '（二）我們一天天天長大，母親卻一天天天嘆氣。因為我們不會耕種田地，不會縫紉烹飪。母親常對我們說，你們以後可怎麼活啊！

    我們總是蠻橫地說，到時候就有辦法。雖然我們都不會耕種烹飪，但是我們卻能掙錢。想吃什麼就買什麼，商店裡的衣物琳瑯滿目應有盡有；吃的喝的全都是買的，街上的飯店豪華氣派。

    天有不測風雲。據可靠消息，再過四十天人類就要進入一百世紀，地球在那一刻就要毀滅。所幸的是，人類經過幾十世紀的不斷探測，在茫茫宇宙中發現了一顆類似地球的星球——綠星。所幸我的後裔是富人中的一員，在地球毀滅的前夕登上綠星。

    開始，大家無比興奮，他們膜拜目睹了地球爆炸的精彩瞬間。蔚藍色的地球發出「轟」的一聲巨響，變成一個太陽般的大火球，消失在浩瀚無垠的太空。他們站在綠星上先是魂不附體，呆若木雞，隨後便歡呼雀躍，慶幸他們成為百億人類中極少數的倖存者。

    可好景不長，他們不久又陷入無比的恐慌之中。因為大家已經把帶來得食物衣物消耗殆盡。更不幸的是，來到這個星球的人，有的會發號施令，有的會高談闊論，有的會做帳造表……唯獨缺少會耕種田地、裁衣做飯的人。捎來的諸如電腦、手機、金子、珠寶、名車……幾乎成了一堆廢品，不能吃不能喝不能穿，毫無用處。

    他們終日無食可餐，無衣可穿。餓極了，他們開始吃草、吃野菜、生吃魚、生吃野獸……由於長期喝生水吃生食，他們的身上長出了長長的毛，久而久之，他們變成一群用四肢行走的叫做「猿」的動物……

    過了幾個世紀，他們學會了用石器打獵……

    又過了幾個世紀，他們發現了火……

    再過幾個世紀，他們開始直立行走……（改寫自馬新亭 人類起源）'
