- id: doc_112_彰化_埤頭_國文_g9s1e3_s4_45
  section: 4
  number: 45
  type: single
  page: 3
  stem: ( )下列何者是作者在把玩長卷時的感悟？ (A)怨嘆長卷未能展出的可惜 (B)從中體會到時間的流動 (C)立下成為畫家的職志 (D)發出今不如昔的感概。
  options:
  - label: A
    content: 怨嘆長卷未能展出的可惜
  - label: B
    content: 從中體會到時間的流動
  - label: C
    content: 立下成為畫家的職志
  - label: D
    content: 發出今不如昔的感概。
  group_stem: '（三）長卷是中國特有的繪畫形式，也常稱為「手卷」。數十年前在臺北故宮上課，莊嚴老師常常調出「長卷」，數百公分長，要學生「把玩」。四名研究生戰戰兢兢，慢慢把卷展開。體會「把玩」，知道是文人間私密的觀看，與在美術館擠在大眾中看畫不一樣。

    十二公尺長的反里江山一眼看不完。想像在手中把玩，慢慢展開，右手是時間過去，左手是未來。「把玩」「長卷」是認識到自己和江山都在時間之中，時間在移動，一切都在過去，有逝去的感傷，也有步步意外發現的驚奇喜悅。瀏覽千里江山，也是在閱讀生命的繁華若夢吧。

    長卷是中國特有的美學形式，卻在今天被遺忘了，西方影響下的書館、美術館，作品必須掛在牆上。長卷無法掛，也不能全部拉開，十二公尺長，必須一點一點在手中「把玩」過去，在眼前瀏覽，且行且觀，可以停留，靠近駐足，看細如牛毛的亭臺樓閣，點景人物，也可以退後，遠觀大山大河，平原森林，氣象萬千。可以向前看，也可以回溯，長卷的瀏覽，其實更像電影的時間。美術館受了局限，很難展出長卷，長卷美學也慢慢被淡忘了。（蔣勳
    長卷）'
