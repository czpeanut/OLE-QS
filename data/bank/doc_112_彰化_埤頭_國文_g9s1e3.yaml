  group_stem: '（四）晉中期有王質者，常入山伐木，至石室，見童子四人彈琴而歌。質因留，跌（1）斧柯（2）聽之。童子以一物與質，狀如棗核，質取而含之，便不復饑，遂復留習。俄頃，童子曰：「汝來已久，何不速去？」質諧而起，所坐斧柯爛盡。既歸，計已離家數十年矣，舊宅遷移，室宇靡存，遂號慟（3）而絕。（酈道元
