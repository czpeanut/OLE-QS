  group_stem: '一老儒訓蒙鄉塾，塾側有積柴，狐所居也。鄉人莫敢犯，而學徒頑劣，乃時穢污之。一日，老儒往會葬①，約明日返。諸兒因累几為臺，塗朱墨演劇。老儒突返，各撻之流血，恨恨復去。眾以為諸兒大者十一、二，小者七、八歲耳，皆怪師太嚴。次日，老儒返，云昨實未歸，乃知狐報怨也。有欲訟諸土神者，有議除積柴者，有欲往詬詈②者。中一人曰：「諸兒實無禮，撻不為過，但太毒耳。吾聞勝妖當以德，以力相角，終無勝理。冤冤相報，吾慮禍不止此也。」眾乃已。此人可謂平心，亦可謂遠慮矣。                                                    （紀昀《閱微草堂筆記．狐化老儒》）

