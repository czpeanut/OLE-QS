  - label: D
    content: 甲文用「我輩」指王戎這種無法忘懷傷痛的人；乙文用「我輩」專指邁入中年、桑榆晚景的人
  group_stem: "甲、\n  王戎喪兒萬子，山簡往省之，王悲不自勝。簡曰：「孩抱中物，何至於此！」王曰：「聖人忘情，最下不及情；情之所鍾，正在我輩。」簡服其言，更為之慟。\
    \ （節錄自《世說新語．傷逝》）\n乙、\n  想要寫一本中年人的書，是從面對了生命中的變動開始的，這變動不是天光雲影共徘徊，而是土石流般的崩塌與毀壞。我輩中人，是首先浮起的意象。我們這些「中年」人；夾在上一代與下一代「中間」的人；思維和行為「不中不西」的人。\n\
    我們到底是什麼樣的人？\n  我們走過怎樣的路？又將往哪裡走去呢？……\n  我輩中人邁入人生下半場時，最該做的是對自己的清算與和解。靈魂中那些幽暗的、破碎的部分，也許是因為傷害而造成，無以言宣的痛苦已經承載了幾十年，直到中年才明白，並沒有什麼人會替我們取下枷鎖，帶來救贖。我們苦苦等待的，釋放我們於深淵的那股力量，原來在我們自己身上。\n\
    \                                                                          （節錄自張曼娟《我輩中人．自序》）"
