- id: doc_111_桃園_同德_國文_g8s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 「〈張釋之執法〉，短短一百多字，一個違反交通管制的小案，能表達出什麼價值？張釋之如果提出闖禍者的身家背景，然後說其情可憫，那就表示是法外開恩，以裁量權設法開脫，但是，張釋之卻直接了當告訴漢文帝：是因為『法如此』，而且一股腦兒把後果都講出來：『今法如此而更重之……天下用法皆為輕重』，將會導致『民安所錯其手足』，破壞了法制和公信力，人民不知道怎樣做事生活了。」根據本文，張釋之堅持課罰金的原因為何？
  options:
  - label: A
    content: 法律是國君和人民都要共同遵守的，不宜隨意更改，以免破壞法律威信
  - label: B
    content: 法律本是由國君與人民共同制定，不可由國君擅自改變，以免破壞信任
  - label: C
    content: 國君須以身作則，國君若不守法，法律就算再嚴苛，人民也不需要遵守
  - label: D
    content: 法律是由國君制定給天下人的，天子應該當人民表率來遵守，樹立模範。
