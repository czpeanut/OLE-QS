- id: doc_113_新北_丹鳳_國文_g9s1e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 一愚人，居於東市。見鄰人居室華美，乃自思惟：彼有居室如是，何我獨無？乃寤寐思量，何處作基，何處立柱，何處架屋，何處安門，如何塗飾，如何安頓。如是五年，一磚未置，一木未備。其人撫膺嘆曰：「建屋如是之難乎！吾殫思竭慮，竟不能成。」
    故事中愚人花了五年卻建屋不成的原因為何？
  options:
  - label: A
    content: 計畫周詳，卻難以實行
  - label: B
    content: 想法多變，且難以抉擇
  - label: C
