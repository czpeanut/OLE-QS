- id: doc_113_新北_丹鳳_國文_g9s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 張愛玲寫道：「大考的早晨，慘淡的心情大概只有軍隊作戰前的黎明可以比擬，像電影裡奴隸起義的叛軍在晨霧中遙望羅馬大軍擺陣，那是所有的戰爭片中最恐怖的一幕，因為完全是等待。」這段文字的涵義，與下列何者最接近？
  options:
  - label: A
    content: 面對考試的焦慮，就像奴隸遭到禁錮的心情
  - label: B
    content: 面對即將到來的硬仗，考生滿懷不確定的憂懼感
  - label: C
    content: 在考試的壓力下，學子因自卑無助而感到絕望
  - label: D
    content: 考前若努力不夠，準備不充足，必然慘遭滑鐵盧。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 國文
