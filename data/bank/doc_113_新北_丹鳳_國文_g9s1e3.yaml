  group_stem: "(丙) 西郭子僑與公孫詭隨、涉虛俱為微行，昏夜踰其鄰人之垣，鄰人惡之，坎①其往來之涂②而置溷③焉。一夕又往，子僑先墮于溷，弗言，而招詭隨，詭隨從之墮，欲呼，子僑掩其口曰：「勿語。」俄而涉虛至，亦墮。子僑乃言曰：「我欲其相無咥④也。」\n\
