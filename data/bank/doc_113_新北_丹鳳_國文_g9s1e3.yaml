- id: doc_113_新北_丹鳳_國文_g9s1e3_s2_39
  section: 2
  number: 39
  type: single
  page: 4
  stem: 依據上文，關於「梔子花」的說明，何者最適當？
  options:
  - label: A
    content: 於春天開花，品種上有單瓣與複瓣兩種
  - label: B
    content: 花香與玫瑰相比，玫瑰更勝一籌
  - label: C
    content: 作者所見的為單瓣品種
  - label: D
    content: 梔子花的花色是純牛奶的色澤。
  group_stem: "(戊)  有一天中午，坐在車上，忽聽假警報，車子立刻掉轉方向，往一條不知名的路上疏散去了。一霎間，彷彿真有一種戰爭的幻影在藍的離奇的天空下湧現。\n\
    \    由於是春天，好像不知不覺間就有一種流浪的意味。這突起的防空演習簡直有點郊遊趣味，不經任何人同意就自作主張而安排下的一次郊遊。車子開到一個奇異的角落，忽然停了下來，大家下了車，沒有野餐的紙盒，大家只好咀嚼山水，天光仍藍著，藍得每一種東西都分外的透明起來。車停處有一家低簷的人家，在籬邊種了好幾棵複瓣的梔子花，那種柔和的白色是大桶的牛奶裡勾上那麼一點蜜，在陽光的烤炙中鑿出一條香味的河。\n\
    \    如果花香也有顏色，玫瑰花香所掘成的河川該是紅色的，梔子花的花香所掘的河川該是白色的，但白色有時候比紅色更強烈、更震人。也許由於這世界上有單瓣的梔子花，複瓣的梔子花就顯得比一般的複瓣花更複瓣。像是許多疊的浪花，撲在一起，糾住了，扯不開，結成一攅花......這就是梔子花的神話吧！\n\
    \                     ——張曉風＜梔子花＞"
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 國文
      code: 第六課
      title: 一家手語餐廳的誕生
      chapter: null
    textbook: 九上 第六課 一家手語餐廳的誕生
    labeled_by: ai
