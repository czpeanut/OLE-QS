  section: 1
  number: 7
  type: single
  page: 1
  stem: 「莫聽穿林打葉聲，何妨吟嘯且徐行。竹杖芒鞋輕勝馬，誰怕？一蓑煙雨任平生。 料峭春風吹酒醒，微冷，山頭斜照卻相迎。回首向來蕭瑟處，歸去，也無風雨也無晴。」〈定風波〉——關於此詞的解析，下列何者正確？
  options:
  - label: A
    content: 「莫聽穿林打葉聲」說明意外遇大雨，「雨天」象徵「人生總有意料之外的困境」
  - label: B
    content: 「何妨吟嘯且徐行」指出蘇軾遭遇風雨，一貫以玩世不恭的態度面對
  - label: C
    content: 從「竹杖芒鞋輕勝馬」可知蘇軾嚮往田園生活
  - label: D
    content: 「歸去，也無風雨也無晴」意指蘇軾雨中思鄉，興起「不如歸去」之嘆。
  lesson_raw:
    title: 定風波
    basis: 題幹引用蘇軾〈定風波〉詞
