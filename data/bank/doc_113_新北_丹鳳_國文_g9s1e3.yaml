    content: 二人此次夜遊為元豐六年十月十二日之約定
  - label: D
    content: 引發夜遊的動機是「月色入戶」。
  group_stem: "(乙) 元豐六年十月十二日夜，解衣欲睡，月色入戶，欣然起行。念無與樂者，遂至承天寺尋張懷民。懷民亦未寢，相與步於中庭。\n   庭下如積水空明，水中藻荇交橫，蓋竹柏影也。\n\
