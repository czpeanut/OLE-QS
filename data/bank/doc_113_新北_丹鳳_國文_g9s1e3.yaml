  type: single
  page: 2
  stem: 一日，歐陽脩在路上看到一匹脫韁野馬飛馳而過，踩死了一隻臥在路上的大黄狗。他要求在旁的學生把這件事寫下來，學生寫道：「劣馬正飛奔，黄犬臥通途。馬從犬身踐，犬死在通衢。」歐陽脩不甚滿意，後改為「逸馬斃犬於道」，可以想見歐陽脩不滿意該學生作品的原因為何？
