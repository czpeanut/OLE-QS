  group_stem: "(8-10) 109會考補考 \nA Chinese saying goes, “If you’re bitten by a snake\
    \ once, \nyou’ll be scared by a rope for ten years.” I have my own \nexperience\
    \ of this. \nIt all happened one night. I was cooking dinner, and at \nthat moment,\
    \ I really needed to go to the bathroom. Without \nturning the gas off, I quickly\
    \ went to the bathroom. When I \nfinished, I couldn’t open the door. “I can’t\
    \ get out!” I shouted. I \nbecame worried that I was going to die in a fire. \n\
    “No!” I kicked the door hard but it didn’t move an inch. I \nturned around and\
    \ saw hope. I hurried to the window and \npushed it really hard. But the luck\
    \ was not on my side. I just \ncouldn’t open it. I would have to break it. I started\
    \ hitting it \nwith the hardest thing I could find—a trash can. \nWith a loud\
    \ “BANG,” the window broke. “I’m safe!” I \ntook in the fresh air happily. However,\
    \ the cold wind woke me \nfrom my joy. I was on the tenth floor and there was\
    \ no way to \nget down. I kept shouting for help. Luckily, someone heard me \n\
    and called 119. \nSince then, I’ve never closed the door when I use my \nbathroom."
