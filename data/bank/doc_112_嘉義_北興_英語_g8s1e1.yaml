  - label: D
    content: can write a lot of works
  group_stem: 'Bai Ju-yi is a famous poet. He passed away over 1,100 years ago, but
    people are still reading his works today. Children in Taiwan read his poems in
    Chinese classes, and there are even a lot of foreigners reading and studying them
    around the world. Bai Ju-yi was a very productive poet. There are about 3,000
    of Bai Ju-yi’s poems now.

    Bai Ju-yi liked talking about social problems. He also wrote about a lot of interesting
    things in his own life. In fact, he was working on poems almost all the time.
    For example, when he missed his family and friends, he wrote poems to them. When
    he ate something delicious, he wrote poems. He even wrote poems after he had a
    cup of tea in the afternoon. He had at least 65 poems about tea! Can you believe
    that?

    Thanks to Bai Ju-yi, we can learn a lot about the life of the Tang people. There
    was no Facebook in the past, but if there were, we would probably see Bai Ju-yi
    sharing everything in his life on Facebook!


    📖 famous 有名的 📖 poet 詩人 📖 pass away 過世 📖 poem 詩 📖 foreigner 外國人 📖 social 社會的

    📖 after 在…之後 📖 Thanks to 幸虧 📖 Tang 唐代 📖 past 過去 📖 if 如果 📖 probably 可能'
