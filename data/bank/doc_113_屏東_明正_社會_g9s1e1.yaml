  stem: 小綱在商業週刊上閱讀到下文：「網路使用者可能會發現一件事，曾經利用電腦或是手機搜尋過某樣商品，之後瀏覽網頁時，頁面就會出現類似的商品廣告，這是因為許多網站利用追蹤技術，蒐集使用者的資訊，分析得知使用者感興趣的品項，因而投放相關的廣告，以提高被購買的機會。」文中的行銷手法是運用何種因素以增加消費者的消費行為？
