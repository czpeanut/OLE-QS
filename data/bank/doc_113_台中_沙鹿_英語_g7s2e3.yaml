  group_stem: "What musical instrument comes to your mind when you think of music?\
    \ You probably think of the piano, the guitar, or the drums. But do you know some\
    \ people make music with vegetables? They are called the Vegetable Orchestra.\
    \ They have had albums and held concerts in many countries.\n    <u>  (38)  </u>\
    \ For example, they tap pumpkins to make “drum” sounds. They use carrots as flutes.\
    \ They hit cucumbers. They rub onion skins together. Different vegetable instruments\
    \ create different sounds. When they are played together, they create beautiful\
    \ music. You might think it would be easy for them to prepare for a show.\n  \
    \  <u>  (39)  </u>, they need to get up early in the morning to buy fresh vegetables\
    \ that are just right for their performance. They need the right-sized pumpkin\
    \ for a drum. After a trip to the market, they need to cut and carve vegetables\
    \ to make them into instruments. All the hard work pays off when the audience\
    \ hears their amazing music in the evening. Vegetables cannot be reused after\
    \ the show because they only last for a day. To not waste food, fresh vegetables\
    \ soup will be made from the instruments when the concert ends. It is a feast\
    \ not only to the ears <u>  (40)  </u> to your stomach.\n orchestra 樂隊 instrument\
    \ 樂器 probably 可能 cue instrument 樂器 probably 可能 cucumber 小黃瓜 onion 洋蔥 carve 雕刻\
