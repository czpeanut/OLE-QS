    \ Dali's paintings.\n    Dali was born in Spain in 1904. His painting style is\
    \ called Surrealism because the objects in his works often changed strangely.\
    \ He often painted things from the ideas in his dreams. Because of it, his paintings\
    \ are usually very special in people's eyes. Most people usually have different\
    \ thoughts of his paintings.\n    One of his most famous paintings is The Persistence\
    \ of Memory. In this painting, the objects are shown in strange ways. For example,\
    \ the clocks are melting. It looks like the clocks are dying. The clock is a symbol\
    \ of time. One of the clocks has ants on it. They are eating the clock. Ants usually\
    \ eat dead things. Therefore, maybe it may mean that the clock is dead. There\
    \ is a thing with a clock on the ground. People can't be sure what it is. Both\
    \ the clock and the thing are soft and melting. Perhaps time is killing it.\n\
    \    When people look at Dali's paintings, they make people think. It is hard\
