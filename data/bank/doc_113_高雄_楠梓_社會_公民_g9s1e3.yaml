  stem: 匯率也會影響兩國貨物貿易的成本，因此對國際貿易影響很大。請用圖中甲時期的匯率,假設我國出口筆記型電腦到美國，在臺灣的售價為NT$33,000 元，在甲時期換算成美金的價格為何？
