  stem: 同學們討論到「貨幣價值」的議題，下列何者敘述錯誤？
  options:
  - label: A
    content: 蘇西：物價的漲跌，是影響貨幣價值的原因之一
  - label: B
    content: 佩得羅：當貨幣價值下跌時，通常人們的儲蓄意願增加
  - label: C
    content: 佩琪：貨幣的發行量也是影響貨幣價值的原因之一，若貨幣發行的數量超過市場上流通所需要的數量，此時物價就會上漲
  - label: D
    content: 喬治：當貨幣價值下跌時，人們容易出現搶購、囤積物資的現象
