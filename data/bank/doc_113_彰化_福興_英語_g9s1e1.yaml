- id: doc_113_彰化_福興_英語_g9s1e1_s3_5
  section: 3
  number: 5
  type: single
  page: 2
  stem: What DIDN’T the Yangs do to make more money?
  options:
  - label: A
    content: They had another name for the food truck.
  - label: B
    content: They changed the color of the food truck.
  - label: C
    content: They drew something about Taiwan on the truck.
  - label: D
    content: They made a block with Taiwanese food in the city.
  group_stem: 'B.

    During lunch time, on 53rd street, you’ll see a long line of people in front of
    a Taiwanese food truck for their “bian-dang,” a Taiwanese word for “lunch box.”
    On the menu you can find fried chicken with rice, pork dumplings, tea eggs, and
    other popular Taiwanese dishes.

    The owner of the food truck are Thomas and Diana Yang, two Taiwanese-Americans.
    This brother-sister team started their business in 2009. Back then, there were
    a few Taiwanese restaurants in the city and several thousand food truck, but the
    Yangs were the first to sell Taiwanese food on a food truck.

    At first, business was slack(慘澹的). People thought they were just another Chinese
    food truck, and the food truck’s name, “Cravings,” often made people think of
    desserts, not lunch. Few people would stop by and try their food. “I couldn’t
    even give away free food,” said Thomas. To catch people’s eye, they painted their
    truck blue, and drew Taiwanese national flower, the plum blossom, on it. They
    also changed the food truck’s name to “bian-dang.” Soon people started to notice
    them, and business finally got better. Now on a good day, they can sell about
    150 bian-dangs in about two hours.

    So what’s next for Thomas and Diana? Well, they hope one day there will be a block
    with Taiwanese food in the city, just like there is a Chinatown, a Korea Town,
    and a Little Italy. And their bian-dang food truck might just help to make that
    happen.'
