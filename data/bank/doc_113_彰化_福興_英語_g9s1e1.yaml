  stem: According to the reading, what can parents do to keep their children from
    developing TikTok brain?
  options:
  - label: A
    content: Stop screen time for their children.
  - label: B
    content: Ask their children to turn off their phone.
  - label: C
    content: Avoid face-to-face interactions with their children.
  - label: D
    content: Manage(管理) time on how long their children look at the screen.
  group_stem: 'C.

    The latest social media app among young people is TikTok. This app works by people
    creating and sharing short videos and they usually last under a minute. The videos
    include many topics like dance shows, fashion, funny videos, or news. While this
    might seem like just another harmless(無害的) social media app, a new research shows
    that TikTok can negatively(負面地) affect(影響) people’s attention.

    Some studies have discovered that apps like TikTok affect people’s brains. The
    short style of TikTok video is leading to “TikTok Brain.” Specifically (特別地),
    it has changed how our brains release(釋放) dopamine (多巴胺). Dopamine is a kind of
    “feel-good” hormone(賀爾蒙) because it produces feelings of pleasure (愉悅) that can
    let people do more activities. Our brain releases dopamine, for example, when
    we exercise or listen to music. The feeling of pleasure may make us repeat the
    same thing again and again. Many TikTok users show signs of addiction(上癮) when
    watching the short and interesting videos. It can be very difficult for them to
    stop watching these short videos, even when they have something more important
    to do. This behavior trains the brain to expect instant satisfaction (滿足), and
    it makes people’s attention shorter in the long run.

    To prevent the development of TikTok brain in children, parents are advised to
    limit the amount of screen time their children have. Parents should also set good
    example by turning off their phones and talk with their children as often as possible.'
