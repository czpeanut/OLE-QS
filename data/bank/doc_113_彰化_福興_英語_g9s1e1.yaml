- id: doc_113_彰化_福興_英語_g9s1e1_s3_1
  section: 3
  number: 1
  type: single
  page: 2
  stem: Why does Manson feel ashamed of himself?
  options:
  - label: A
    content: He wanted to keep the bag of money to himself.
  - label: B
    content: He said something wrong to his mother.
  - label: C
    content: He can’t find the owner of the bag.
  - label: D
    content: He lost his money.
  group_stem: 'A. Manson Made the Right Decision

    Manson, a fifty-year-old man, who is between jobs, walks with his head down along
    the country road. He has no idea where his future lies. If he does not find a
    job soon enough, he is going to lose his car and even his house.

    Suddenly, he sees a paper bag on the side of the road. After picking it up, he
    is surprised to find that there is a lot of money in it, NT$5000,000 in total.
    He looks around and sees no one else nearby. He thinks to himself, “What a blissful
    day! This bag of money is going to save my life!” However, a minute later, what
    his mother used to say comes to his mind: “Always do the right thing, son. Never
    ever take anything that isn’t yours.” Then and there, he feels ashamed of himself.
    He understands what he should do.

    Manson walks into the police station and hands the money to the police. That night,
    he gets a call from a stranger, Mrs. Williams, who calls to thank him for what
    he has done. Manson says he is glad that she gets her money back.

    The following day, three newspapers report Manson’s story. Then five businesses
    ask him to work for them. Andrew Smith, the owner of AAA Computer Store, says
    his store needs a good worker like Manson.

    Manson is happy. He looks up at the sky and says, “Mom, you’re right again! Thank
    you.”'
