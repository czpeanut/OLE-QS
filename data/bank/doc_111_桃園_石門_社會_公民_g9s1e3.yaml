  section: 1
  number: 31
  type: single
  page: 3
  stem: 從文中敘述可知，保障勞工權益需透過多種策略，下列何者方法較不適當？
  options:
  - label: A
    content: 以團體力量跟雇主做協商
  - label: B
    content: 受雇者不斷示威抗議、跟雇主對立以爭取更多福利
  - label: C
    content: 修改法令以維護勞資雙方利益
  - label: D
    content: 雇主及員工都必須有正確的勞動意識，理性協商找出對雙方有利的解決方案。
  group_stem: "題組(二)\n    契約自由與私法自治，是民法的核心精神，以人人平等為信念，相信人民可以依自己的自由意願，衡量自身能力來塑造自己和其他人的法律關係。但是在勞動關係中，雇主通常處於較為優勢的談判地位，勞工事實上難以與雇主協商勞動契約及工作條件。勞動關係的本質，存在著「老闆不給，勞工不能要」的情況，導致民法的契約自由與私法自治淪為遮掩剝削勞動力的香水。因此《勞動基準法》第1\
    \ 條第1 項規定：「為規定勞動條件最低標準，保障勞工權益，加強勞雇關係，促進社會與經濟發展，特制定本法；本法未規定者，適用其他法律之規定。」這意味著國家透過立法為勞動條件設下最低標準，藉此保護勞工不因為欠缺談判實力而被迫接受不健康、不人道的勞動條件。\n\
    \    《勞動基準法》雖然是適用多數勞工的個別勞動法，但無法改變個別勞工欠缺談判力量的弱勢情況。因此衍生以集體勞動權為核心的勞動三法：《工會法》、《團體協約法》及《勞資爭議處理法》促使勞工脫離弱勢的狀態，透過勞工團結，達成集體勞動條件的共同決定，促使勞工脫離弱勢的狀態。然而，即使國家透過立法保護勞工，許多企業開始以俗稱「非典型勞動」的方式進用勞工，例如「外送員」、「家庭幫傭」、「家庭看護」和「漁工」，讓企業主事實上可以使用勞工的勞動力，卻不用、負擔像法律要求的勞動成本。即便在社會快速更迭、開始重視勞動權益的現在，這些非典型勞工又或者是來台灣的移工們，仍有許多難以打破的難題需要面對：不受到保障的薪資、移工不能自由轉換雇主、當工作中受到不當對待時難以為自己發聲等。\n\
