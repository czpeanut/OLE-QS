  stem: '探討生活中的科學現象時，常可依序用「觀察→提出問題→提出假設性的答案→設計與進行實驗」的步驟來得到結論。奕睿要研究渦蟲的行為，列出了甲、乙、丙、丁四個敘述，如附表所示。若以上述科學方法的步驟排列甲、乙、丙、丁，下列何者正確？

    | 編號 | 敘述 |

    | --- | --- |

    | 甲 | 為何渦蟲要聚集在石塊下方 |

    | 乙 | 應該是渦蟲不喜歡有光的環境 |

    | 丙 | 直接以燈光照射石塊下方，記錄渦蟲的反應 |

    | 丁 | 在水族箱飼養渦蟲時，發現渦蟲常聚集在石塊下方 |'
  options:
  - label: A
    content: 乙→丁→丙→甲
  - label: B
    content: 乙→甲→丙→丁
  - label: C
    content: 丁→乙→甲→丙
  - label: D
    content: 丁→甲→乙→丙
