  group_stem: '◎請閱讀下列敘述後，回答39、40 題：

    下列為小銘依據科學方法所寫的實驗報告：

    初步觀察：放有數枚一元硬幣的水盆裡沒有孑孓生存，但沒有一元硬幣的水盆裡卻有孑孓生存。

    提出問題：為什麼放有一元硬幣的水盆中孑孓無法生存？

    提出假說：含有一元硬幣的水可能會促使孑孓死亡。

    設計實驗步驟：準備甲、乙兩組相同的水盆，皆倒入等量的純水。僅在甲組中放入10 枚一元硬幣，乙組則無。甲、乙兩組皆放入30 隻孑孓，每日皆提供充足的相同食物，等待一週後觀察兩組孑孓的存活率。

    實驗結果如附表所示：

    | 組別 | 甲 | 乙 |

    | --- | --- | --- |

    | 實驗設計 | 純水＋孑孓＋一元硬幣 | 純水＋孑孓 |

    | 孑孓的存活率 | 43.3％ | 40.0％ |'
