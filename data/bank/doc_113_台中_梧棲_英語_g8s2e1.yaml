  section: 5
  number: 36
  type: single
  page: 2
  stem: What is the best name for this reading?
  options:
  - label: A
    content: High Mountains in Taiwan.
  - label: B
    content: Mountain Climbing in Taiwan.
  - label: C
    content: Best Places to Enjoy Snow in Taiwan.
  - label: D
    content: How to Get to Jade Mountain.
  group_stem: '【 I 】

    Taiwan is not a big island, but it has the largest number of high mountains in
    the world. 286 mountains on the island are higher than 3,000 meters. For many
    Taiwanese, mountain climbing is the most popular activity of all. Climbing all
    of the high mountains is the greatest challenge for them. Joy Mountain is a 3,416-meter-high
    mountain in Central Taiwan. It is the snowiest mountain in Taiwan during the winter.
    It''s also the most famous place for many Taiwanese to enjoy snow. There are 54
    mountains taller than 3,000 meters in Snow Mountain Range. The highest point of
    Snow Mountain Main Peak is 3,886 meters. The main peak of Jade Mountain is even
    higher at 3,952 meters. Jade Mountain National Park is now Taiwan''s largest and
    highest national park. However, it''s the most difficult to get to.

    challenge 挑戰 central 中部 range 山脈 peak 峰 national 國家的'
