  stem: '西元一九一四年十二月的一場大火，幾乎摧毀了愛迪生的實驗室，他一生的研究幾乎付之一炬。他的兒子查爾斯說：「我真的很心疼，父親已經七十六歲了，不再是年輕小伙子，而大半成果卻隨火而逝。」隔天早晨，愛迪生望著一片廢墟說：「災難中自有大價值，我們所有的錯誤都燒之殆盡。感謝上帝，我們又可以重新開始了。」大火後三個月，愛迪生發表了他的第一部留聲機。

    下列何者適合形容文中愛迪生的處事態度？'
