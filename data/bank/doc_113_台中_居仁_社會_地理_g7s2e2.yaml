  - label: A
    content: 基隆市
  - label: B
    content: 花蓮縣
  - label: C
    content: 新竹縣
  - label: D
    content: 台南市
  group_stem: '(二) 「漁電共生」是將太陽能電廠蓋在魚塭的土堤上，養殖為主、發電為輔，新的異業合作模式，不僅增加土地利用率，且幫助漁民減輕負擔。不過漁民憂心光電業把魚塭搶光，也擔心魚塭被填平，養殖漁業會受到衝擊，所以政府訂定「養殖漁業經營結合綠能設施專案計畫審查作業要點」，規定魚塭上太陽能板覆蓋面積必須在40%以下，且不得改變原有的養殖物種，並且要能維持70%以上的漁獲量，開發前要先取得地主及養殖戶的同意才能進行，以保障漁民的權益。太陽能板具有冬季擋寒風降低寒害，夏季遮太陽減少池水蒸發的功效，故漁民對漁電共生的接受度愈來愈高。部分企業也有意願購買再生能源，例如：Google
    資料中心目前預計將使用漁電共生的電能，請問:'
