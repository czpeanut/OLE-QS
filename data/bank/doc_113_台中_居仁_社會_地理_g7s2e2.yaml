  stem: 丁祥正在聽導覽員的解說：「此展覽是依照臺灣工業發展歷程作展區規劃，每個展區介紹不同時期的發展特色。目前我們在甲展區，民國 50 年代政府設立加工出口區，拓展海外市場並吸引外資，以出口為主，工業產值逐漸超越農業。」接著來到乙展區，導覽員：「民國
