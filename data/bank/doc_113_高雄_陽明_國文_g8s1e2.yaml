  group_stem: "「綠建築」在各國有不同的名稱，定義及內涵也略有差異。概念源自於1960 年代的生態建築，各國響應永續發展，從知名的LEED 美國綠建築認證、\
    \ BREEAM 英國綠建築認證、 WELL 健康建築標準，而EEWH是臺灣從1999 年開始推動綠建築標章制度，為全世界第四個推動的綠建築評估系統。\n\n\
    | 項目 | EEWH | LEED | BREEAM | WELL |\n| :--- | :--- | :--- | :--- | :--- |\n|\
    \ 推動協會 | 財團法人臺灣建築中心 | 美國綠色建築委員會 | 英國建築研究機構 | 美國 IWBI |\n| 指標項目 | 1.綠化量<br>2.基地保水<br>3.水資源<br>4.日常節能<br>5.二氧化碳減量<br>6.廢棄物減量<br>7.污水垃圾改善<br>8.生物多樣性<br>9.室內環境\
