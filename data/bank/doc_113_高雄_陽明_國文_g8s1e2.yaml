- id: doc_113_高雄_陽明_國文_g8s1e2_s3_34
  section: 3
  number: 34
  type: single
  page: 6
  stem: 下列女士們所表達的購衣原則，何者最符合作者的觀點？
  options:
  - label: A
    content: 美繡姊：只要時尚，就會包色全都買回來
  - label: B
    content: 比利姊：衣服夠便宜，就會買來試試看
  - label: C
    content: 法拉利姊：網購好方便，買錯就捐出去
  - label: D
    content: 心梅姊：二手衣交換也可以找到我想要的
  group_stem: '「恩典牌」不是專指單一的時尚品牌，而是一種人間善意流動的總稱。把用不到的衣物、用品、電器、鍋碗……整理並檢修後，送給想要或需要的人家，讓循環再利用成為生活習慣，不但皆大歡喜，更讓地球有了小小喘息的機會，不會又多出一堆垃圾廢棄物……。

    古時候有個民間習俗，嬰兒出生時，父母會挨家挨戶向鄰居祈求一塊舊布，然後用收集來的數百塊舊布縫製成嬰兒的衣服，稱為「百衲衣」。據說能保佑嬰兒平安成長、長命百歲。

    孩子成長的速度非常快，衣服穿一季沒多少次，隔年就穿不下了，購買時很貴，但擺在家裡用不到又太占空間，直接扔掉似乎又捨不得，難怪朋友把衣服送給我們時那麼感謝，因為幫他們解決了一個大難題啊！

    5 年前臺灣有個調查發現，平均每個民眾的衣櫃裡擁有75 件衣服，其中有2 成衣服，也就是15 件是幾乎沒有在穿的。

    舊衣服之所以會這麼多，全世界的快時尚品牌是罪魁禍首之一，這些服裝公司超量製造、超量傾銷取得最低成本，以非常便宜的價格吸引消費者，再加上網購的便利，不知不覺隨手一滑就買了一件又一件不見得會穿的衣服，又自以為不要的衣服是捐給需要的窮困人家，做善事又環保，所以心安理得地不斷買、不斷丟。

    以前這些舊衣服的確會出口到非洲或經濟困難的國家，但這些價廉物美的二手衣卻傷害了當地的服裝產業，除了導致大量失業人口之外，也無法以基礎的民生工業發展國家的自主能力，假如一個國家連最簡單的半手工業都無法自行發展，如何循序漸進地升級到較複雜的工業，無法創造出完整的產業體系，人民與國家就永遠處於窮困、必須受人濟助的處境。

    快時尚造成的資源浪費與環境汙染，近年來已引起廣泛關注，法國政府開出第一槍，2020 年2 月通過「反浪費與循環經濟法」規範了服裝、食物、藥材、建材、電子產品等物品的回收規定，強制要求製造商或通路必須對產品的最終處理負起責任，同時不能隨意丟棄或銷毀未售出的全新產品。

    近年開始出現的網路二手衣交換或銷售平臺，也許是個方式，當然，如果有時間，親手轉送給親朋好友也很好，然而最好的方式還是從減少購買的源頭做起。

    ——《李偉文的退休進行式3：你好，我好，做公益與世界共好》'
