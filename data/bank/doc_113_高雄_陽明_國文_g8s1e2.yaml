  type: single
  page: 5
  stem: 〈定伯賣鬼〉中，故事情節的主詞常常被省略。請依上文內容判斷，下列選項的□缺空處，何者是指鬼？
  options:
  - label: A
    content: 鬼大呼，聲咋咋，索下，□不復聽之
  - label: B
    content: □恐其變化，唾之
  - label: C
    content: 道欲水，定伯命鬼先渡，□聽之，了無聲
  - label: D
    content: 徑至宛市中，□著地化為一羊。
  group_stem: '南陽 宗定伯，年少時，夜行逢鬼。

    問曰：「誰？」鬼曰：「鬼也。」鬼曰：「卿①復誰？」定伯欺之，言：「我亦鬼也。」鬼問：「欲至何所？」答曰：「欲至宛市。」鬼言：「我亦欲至宛市。」

    共行數里，鬼言：「步行太極，可共迭②相擔③也。」定伯曰：「大善。」鬼便先擔定伯數里。鬼言：「卿太重！將非鬼也？」定伯言：「我新死④，故重耳。」

    定伯因復擔鬼，鬼略無重。如是再三。定伯復言：「我新死，不知鬼悉何所畏忌？」鬼曰：「唯不喜人唾⑤。」

    於是共行，道遇水，定伯命鬼先渡，聽之，了無聲。定伯自渡，漕漼⑥作聲。鬼復言：「何以作聲？」定伯曰：「新死不習渡水耳，勿怪！」

    行欲至宛市，定伯便擔鬼至頭上，急持之，鬼大呼，聲咋咋，索⑦下，不復聽之。徑⑧至宛市中，著地化為一羊，便賣之。恐其變化，唾之，得錢千五百，乃去。

    當時有言：「宗定伯賣鬼，得錢千五百。」

    注釋：①卿：你 ②迭：輪流 ③擔：背負 ④新死：剛死不久 ⑤唾：吐口水 ⑥漕漼：渡水聲 ⑦索：要求 ⑧徑：直接 ——曹丕《列異傳•定伯賣鬼》'
