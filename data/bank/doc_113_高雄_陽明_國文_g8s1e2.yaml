    \ | 1.管理<br>2.健康及福祉<br>3.能源<br>4.運輸<br>5.水<br>6.資源<br>7.廢棄物<br>8.土地利用及生態<br>9.污染<br>10.創新\
    \ | 1.空氣<br>2.水<br>3.營養<br>4.光<br>5.熱舒適<br>6.聲環境<br>7.運動<br>8.材料<br>9.精神 |\n\n\
    \    以鄰近的日本為例，其綠建築最早之發展稱「環境共住宅」，其內涵包括「地球環境的保全」、「周邊環境的親和」、及「健康快適的居住環境」等三個層次，而綠建築在歐洲國家稱為「生態建築」或「永續建築」，主要強調生態平衡、保育、物種多樣化、資源回收再利用、再生能源及節能等永續發展課題。而在美國、加拿大等國，即稱「綠建築」，主要講求能源效率的提升與節能、資源與材料妥善利用、室內環境品質及符合環境容受力等。由此可知，雖然「綠建築」的內涵，具有隨著各國能源、資源及環境條件不同而調整的特性，但整體而言，各國對建築開發行為的訴求，也都具有減少環境負荷，達到與環境共生共榮共利的共識。\n\
    \    「綠建築」可定義為：「以人類的健康舒適為基礎，追求與地球環境共生共榮，及人類生活環境永續發展的建築設計」，因此綠建築評估系統必須依據氣候條件、國情等的不同，而有所調整，並不是一體適用的。\n\
    ——衛生福利部〈何謂綠建築〉"
