  type: single
  page: 3
  stem: (１)根據上文，下列說明何者正確？
  options:
  - label: A
    content: 作者家鄉的生活用水多取自龍井
  - label: B
    content: 作者母親不認同父親的泡茶哲學
  - label: C
    content: 作者母親要孩子多喝水以防生病
  - label: D
    content: 作者父親每日以山泉水泡茶供佛
  group_stem: "2. 水是故鄉甜 琦 君\n 俗話說得好：「人窮志不窮，家窮水不窮，」這話我最聽得進。因為我故鄉家中的水就有三種，河水、井水、山水。\n\
    山水是長工每天清早去溪邊一桶桶挑來，傾在大水池中備飲食之用，洗滌多用河水。母親為了長工挑水辛苦，叫聰明靈\n巧的小幫工，用一根根長竹竿，連接起來，從最靠近屋子的山邊，引來極細小的一縷清泉，從廚房窗外把竹竿伸入，滴\n\
    在一隻小缸中。這才是涓涓滴滴的源頭活水，一天接不了多少。母親只舀來做供佛的淨水，然後泡茶給父親喝。「喝這\n樣清的山水，又是供過佛的，保佑你長生不老。」母親總是這麼說的。那時泡的茶葉，除了家鄉的明前茶、雨前茶之外，\n\
    還有從杭州帶回的龍井。父親品著茶，常常說：「龍井茶，一定要虎跑水來泡才香、才道地。」母親不以為然地說：「是\n哪裡生長的人，就該喝哪裡的水。要知道，水是故鄉的甜喲。」母親還說：「孩子們多喝點家鄉的水，底子厚了，以後\n\
    出門在外，才會承受得住異鄉的水土。」"
  tags:
    textbook: 八上 第三課 下雨天，真好
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
      code: 第三課
      title: 下雨天，真好
      chapter: null
