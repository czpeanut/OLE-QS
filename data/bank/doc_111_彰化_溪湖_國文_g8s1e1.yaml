  type: single
  page: 1
  stem: 下雨天，真好一文，作者多處描述對童年雨天時光的喜愛，下列何者是從反面來敘述？
  options:
  - label: A
    content: 啊，好極了！又是個下雨天
  - label: B
    content: 那些有趣的好時光啊，我要用雨珠的鍊子把它串起來，繞在手腕上
  - label: C
    content: 豆子吃夠了再吃芝麻糖，嘴巴乾了吃柑子。下雨天真好，有吃有玩
  - label: D
    content: 雨連下十天，半月，甚至一個月，屋裡掛滿萬國旗似的溼衣服，牆壁地板都冒著溼氣，我也不抱怨。
