- id: doc_111_彰化_溪湖_國文_g8s1e1_s4_6
  section: 4
  number: 6
  type: single
  page: 4
  stem: (１)這篇文章主要是在說什麼？
  options:
  - label: A
    content: 雷雨名稱的由來
  - label: B
    content: 雷雨出現的時間
  - label: C
    content: 雷雨的影響範圍
  - label: D
    content: 雷雨如何形成
  group_stem: "3.單獨一塊雷雨雲（即積雨雲）的生命殊為短暫，通常僅不過一兩小時，其間可畫分為發展期、成熟期及消散期三個階\n 段（圖表）。在第一階段先是形成一股上升氣流，把溫暖潮溼的空氣送到半空中。上升的空氣遇冷，其中水氣即開始\n\
    \ 凝結而變成雲。當氣流繼續上升，雲也就越積越高，直上更冷的高空。雲中的水珠變得更大更重。有的凍結成雪或雹，\n 有的雨滴越結越大，直到無法再被上升氣流所支持時即開始落下。隨雨而來或先雨而至的下降氣流，會造成涼爽的陣\n\
    \ 風，此即意味著一場雷雨快要來臨。（摘自「中央氣象局‧氣象百科」網站）"
  shared_asset: g4_6_8
