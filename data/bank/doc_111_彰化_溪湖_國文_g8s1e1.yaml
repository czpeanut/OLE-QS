  section: 3
  number: 3
  type: single
  page: 1
  stem: 「昔有吳起者，母歿喪不臨，嗟哉斯徒輩，其心不如禽！慈烏復慈烏，鳥中之曾參。」一詩中所要表達的主旨與下列何者最相近？
  options:
  - label: A
    content: 思爾為雛日，高飛背母時。當時父母念，今日爾應知
  - label: B
    content: 月下飛天鏡，雲生結海樓。仍憐故鄉水，萬里送行舟
  - label: C
    content: 海內存知己，天涯若比鄰。無爲在岐路，兒女共沾巾
  - label: D
    content: 積雪與天迥，屯軍連塞愁。誰知此行邁，不為覓封侯。
