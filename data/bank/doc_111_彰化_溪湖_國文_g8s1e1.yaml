- id: doc_111_彰化_溪湖_國文_g8s1e1_s3_7
  section: 3
  number: 7
  type: single
  page: 1
  stem: 「矮厝外的狂風暴雨，彷彿撼動整座山林，而閃電似乎要劈毀一切，閃過咯咯作響的窗櫺。」請問這段文字描寫的景象與下列何者最接近？
  options:
  - label: A
    content: 月光焦急的飛行，像逃竄，從圓和宮拱翹的屋簷，滑下去
  - label: B
    content: 我聽見雨暴在向我們呼喊，一萬畝顫抖的星光與陰影
  - label: C
    content: 山風吹動晨霧，像一條條白緞，輕輕地，慢慢地，把錯落有致的村寨，纏繞上一層薄薄的柔紗
  - label: D
    content: 天空中飄著濛濛的雨絲，只聽見雨落芭蕉的聲音，只看見那輕盈的雨滴，落在新發的綠葉紅花上。
  tags:
    textbook: 八上 第一課 田園之秋選
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
      code: 第一課
      title: 田園之秋選
      chapter: null
- id: doc_111_彰化_溪湖_國文_g8s1e1_s3_8
  section: 3
  number: 8
  type: single
  page: 2
  stem: 峻英參加問答節目，被問到關於古詩選的題目，趕緊向四位朋友求救，下列關於詩句的說明，誰的回答正確？
  options:
  - label: A
    content: 英瑀：「纖纖擢素手，札札弄機杼」：藉織女勤勞織布的情景，刻畫出古代女子善於女紅的形象
  - label: B
    content: 華信：「聲中如告訴，未盡反哺心」：未盡扶養兒女的心意。
  - label: C
    content: 娜麗：「晝夜不飛去，經年守故林」：表現慈烏對母親深切的舐犢之情
  - label: D
    content: 靜恩：「河漢清且淺，相去復幾許」：以反詰句作結，暗示牛郎與織女兩人距離並不遙遠。
