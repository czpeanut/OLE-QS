  stem: 上國文課時，四位同學上臺報告田園之秋選一文中的句意，誰的解釋正確？
  options:
  - label: A
    content: 馬芳齡：「遇到這樣氣勢萬鈞的大西北雨前奏，誰也不能逞英雄」說明西北雨雨量驚人，藉此烘托大自然的偉大
  - label: B
    content: 路小佳：「你說這是戲劇不是戲劇？」以諷刺語氣作結，隱約透露出作者認為西北雨如同一場脫軌演出的鬧劇
  - label: C
    content: 傅紅雪：「只覺滿天無數黑怪，張牙舞爪，盡向地面攫來。」此句極力描摹天空烏雲湧起，震懾人心的景象
  - label: D
    content: 葉開：「無論多大多長久的雨……，雨一停，便全部滲入地下。」說明西北雨為臺灣地下水主要來源之一。
