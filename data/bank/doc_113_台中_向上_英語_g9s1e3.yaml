  group_stem: '(B)    Somewhere far away, there was a kind girl, Rose. She lived with
    her mother and her older sister, Flora. They treated her badly and  made her 23_
    all the work. But Rose never complained.

    Rose had to go to the river to collect water every day. One hot summer day, she
    was on the way to the river. Suddenly, she noticed an old woman    24_ in the
    mud ahead of her, so she went up to the woman.

    "You look weak and thirsty in this summer heat. Here. Have some of the water I
    just drew from the river."

    Suddenly, the old woman stood up.  25, the old woman was actually a fairy. The
    fairy was so touched that she gave Rose a gift. When Rose spoke, jewels and flowers
    would fall out of her mouth.

    Rose went home and told her mother about the experience she had. When Rose''s
    mom saw the jewels, she became excited and said to Flora, "Go find the weak old
    woman, give her water, and bring back home jewels."

    On the way, Flora met a lady, and she asked Flora for some water.

    "Get it yourself, you lazy fool. I have bigger fish to fry," Flora shouted at
    her because she wasn''t the weak old woman she was looking for.

    Suddenly, the lady turned into the fairy. The fairy was angry and put a spell
    on Flora. When Flora spoke, snakes and frogs would fall out of her mouth.'
