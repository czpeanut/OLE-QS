  stem: 'What do people do during Galungan?

    ① Watch performances.

    ② Discuss the future of new babies.

    ③ Visit their family and village temples

    ④ put bamboo poles along the street.

    ⑤ Carry a big monster around the village.'
  options:
  - label: A
    content: ① ② ⑤
  - label: B
    content: ① ③ ④
  - label: C
    content: ② ③ ④
  - label: D
    content: ② ④ ⑤
  group_stem: "(G)  Indonesians love to celebrate. They believe that celebrating and\
    \ eating together brings good luck. Let’s party the Indonesian way! \nWould you\
    \ be surprised to find a New Year’s Day in March? Indonesians on the island of\
    \ Bali are getting ready to celebrate Nyepi, their New Year. It falls in March\
    \ or April on the night of the new moon and stands for a fresh start for the people\
    \ and the island of Bali. On the eve of Nyepi, families and friends get together\
    \ in the market. They carry a big monster made of wood and other things around\
    \ the village three times. After that, they burn it to keep evil spirits away.\
    \ \nAfter Nyepi, the Turun Tanah ceremony begins to celebrate a child’s first\
    \ steps. At the Turun Tanah, parents invite friends and family to a party to show\
    \ their baby. They put different things such as a bracelet, pen, mirror, or toy\
    \ computer around the baby. If the baby picks up a pen, he or she may be a writer.\
    \ A child who picks up a gold bracelet may be rich. \nWhile Turun Tanah celebrates\
    \ a family's future, Galungan celebrates its past. Ancestors return “home” during\
    \ this ten-day celebration, and living relatives do their best to make them happy.\
    \ Tall bamboo poles line the street. People go to the ceremonies and visit their\
    \ family and village temples. Actors and dancers give performances about stories\
    \ of good fighting evil. \n \n Indonesian 印尼人(的)      monster 怪物            \
    \ evil spirit 惡靈     \n     ceremony 儀式                  bracelet 手鐲         \
    \     ancestor祖先       \n     celebration慶祝活動         bamboo pole 竹竿      performance\
    \ 表演"
