  options:
  - label: A
    content: b→d→a→c.
  - label: B
    content: b→a→d→c.
  - label: C
    content: d→a→ c→b
  - label: D
    content: d→ c→a→b
  group_stem: "(D)    Why is the sea salty? Long before we found scientific ways of\
    \ thinking about it, we explained it in a story. Even though the answer isn’t\
    \ scientific, there is some other truth in it—especially about the human heart.\n\
    Long ago, a poor old couple lived on the coast. One day, an old storyteller came\
    \ to their village. The old couple gave him a meal. For their kind act, he gave\
    \ them a coffee mill and said, “Say, ‘Mill, please grind,’ and it’ll make anything\
    \ you want. To stop it, say, ‘Mill, please cease grinding.’”\nSoon, the old couple\
    \ had a much better life. They were happy, and they didn’t need much more. But\
    \ the young couple next door was a different story.  When they saw the old couple\
    \ wearing good clothes and buying good food, a burning feeling filled their hearts.\
    \ So one day, the young husband went to the old couple’s house quietly and heard,\
    \ “Mill, please grind hot chocolate!” Seeing hot chocolate come out was the last\
    \ thing he expected, so he went home to share what he saw with his wife.\nThen\
    \ the young couple stole the mill from the old couple. With it, they rode a horse\
    \ and headed down the coast, where no one would know them. Along the way, the\
    \ husband held it out proudly and asked, “What do you want it to make?” “Oh, I\
    \ don’t know. Why not salt?” the wife said. “Mill, please grind salt!” he said.\
    \ “It works!” the wife shouted. But then they saw that the salt kept coming. “Make\
    \ it stop,” the wife said. But the husband didn’t know how. “Mill, please stop\
    \ grinding! Please, no more!” His words didn’t work. The mill kept grinding. Finally,\
    \ the young husband threw the mill into the sea as far as he could.\nAnd there\
    \ it’s been, for hundreds of years, grinding salt without stopping. That’s why\
    \ the sea is salty even today.\n   salty 鹹的    scientific 科學的    human 人的   couple夫妻\
    \  \n coast 海岸    mill 研磨機           grind 研磨       cease 停止"
  tags:
    textbook: 第五冊（九上）第3次段考範圍
    labeled_by: ai
