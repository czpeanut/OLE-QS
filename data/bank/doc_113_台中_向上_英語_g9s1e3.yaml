    \ Fish Harbor were much cheaper and fresher, it became one of their favorite places\
    \ to go on holidays. More and more people enjoyed buying fish to take home or\
    \ eating at Beitang. More visitors meant more business opportunities. Businessmen\
    \ started moving into Beitang in 1986.  The population (all the people living\
    \ in Beitang) grew every year, reaching 4,200 by the end of 2001. Restaurants\
    \ and shops were always filled with visitors on holidays.  \nIn 2003, some people\
    \ in the village noticed that parking became easier on holidays. Business dropped\
    \ year by year. People began  moving out of Beitang in 2006. By the end of 2020,\
