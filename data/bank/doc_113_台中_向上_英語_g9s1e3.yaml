    \ in the village noticed that parking became easier on holidays. Business dropped\
    \ year by year. People began  moving out of Beitang in 2006. By the end of 2020,\
    \ fewer than 3,000 people lived in Beitang. Interestingly, more and more people\
    \ began  visiting Hotang, a small harbor near Beitang, on holidays. Steve and\
    \ several restaurant owners from Beitang decided to visit Hotang to find out why.\
    \ They talked with visitors in Hotang whenever they had the chance. The visitors\
    \ told Steve and his friends that the fish in Hotang were cheaper and the dishes\
    \ were more delicious. Besides, one more thing caught Steve’s eye: there were\
    \ always people picking up trash. This surprised Steve and his friends. “Actions\
    \ have to be taken for Beitang,” they said. \n harbor 港口    opportunities 機會(複數)\
