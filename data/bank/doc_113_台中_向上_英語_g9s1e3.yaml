  group_stem: "(A)   Everybody yawns. Why? Well, the easy answer is that no one really\
    \ knows  18_. However, there are many ideas about it. 19 , people yawn when they\
    \ feel tired or bored, or even when they are traveling on an airplane. Who knows?\
    \ You'll probably yawn when reading this, too.\n          Some people believe\
    \ that a yawn is a way for our body to cool down the brain. Sometimes, when we\
    \ are tired or overworked, our brains can get a little warmer than usual.  20_,\
    \ our body brings in more air through a yawn as a way to wake us up. Others believe\
    \ that people yawn to show that they are feeling the same way someone else is\
    \ feeling. So 21_ , we yawn too. We don't think about this action. We just do\
    \ it.\n         Lastly, have you ever seen people yawn when an airplane takes\
    \ off or lands? Well, it's because  22_. At moments like this, people are yawning\
    \ to make the air pressure in their ears the same as the air pressure on the outside.\n\
    \         As you can see, there is still a lot more to learn about yawning.  Which\
    \ of the ideas do you think is the best?\n yawn 打哈欠 usual 平常 air pressure 氣壓\
    \  moment 時刻"
  tags:
    textbook: 第五冊（九上）第3次段考範圍
    labeled_by: ai
