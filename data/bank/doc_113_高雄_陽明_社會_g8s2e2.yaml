  stem: 過往跟蹤騷擾行為只能依照《社會秩序維護法》處以罰鍰，《跟蹤騷擾防治法》立法後，可依法處以刑罰，與下列何種法律原則相關？
  options:
  - label: A
    content: 無罪推定原則
  - label: B
    content: 罪刑法定原則
  - label: C
    content: 權利濫用禁止原則
  - label: D
    content: 消滅時效原則
  group_stem: "(題組一)根據警政署統計，全臺每年約有八千件的跟蹤騷擾事件，調查分析後發現，被害者有90%是女性，尤其是年輕女性更是跟蹤騷擾的受害高危險群，造成人身安全的威脅。但是在過去，因為跟蹤騷擾沒有被定義成「明確違法的事實」，因此警方只能先勸導，若未改善再依《社會秩序維護法》處以罰鍰，很難有嚇阻作用。\n\
    \    2021 年我國終於三讀通過《跟蹤騷擾防治法》，並於2022 年6 月開始施行，法規中定義八種跟蹤騷擾行為，包含監視跟蹤、尾隨接近、威脅辱罵、通訊網路騷擾、不當追求、寄送文字影像等行為，警察機關可以介入調查。此罪屬於告訴乃論之罪，可處一年以下有期徒刑、拘役或科或併科新臺幣10\
    \ 萬以下罰金。"
