  section: 1
  number: 1
  type: single
  page: 1
  stem: 小橘子參加了一趟西亞與北非三天兩夜的旅遊，根據下文旅遊行程的介紹，請問：下列何者最可能是他這三天的旅遊路線？
  options:
  - label: A
    content: 甲→己→戊
  - label: B
    content: 丙→辛→丁
  - label: C
    content: 戊→庚→乙
  - label: D
    content: 己→癸→庚
  group_stem: '圖（一）為西亞與北非的主要地形分布圖，根據此圖，請回答第1~3 題：


    第一天：在世界上最大的沙漠中來趟冒險，可以體驗四驅越野車飆沙，或是騎駱駝穿越沙漠，充分體驗沙漠居民和古老商隊的日常。玩累了可以躺在沙洞中，享受一下當地柏柏人的「沙浴」，觀賞日落的美景。


    第二天：參觀連接地中海至紅海水運而建的蘇伊士運河，親眼見證偉大的奇蹟。並安排造訪素有「運河新娘」美稱的伊斯梅利亞小鎮，一睹依靠運河孕育而生的美麗城市。


    第三天：參觀以宗教聖地而聞名世界的耶路撒冷，這裡是世界三大宗教（猶太教、基督教、伊斯蘭教）的搖籃和聖地。藉由參觀眾多的博物館、劇院、歷史遺跡，欣賞東西方文明在這裡交匯、碰撞出的多彩絢爛。'
