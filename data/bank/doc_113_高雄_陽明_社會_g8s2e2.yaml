- id: doc_113_高雄_陽明_社會_g8s2e2_s3_49
  section: 3
  number: 49
  type: single
  page: 8
  stem: 立法院三讀通過《詐欺犯罪危害防制條例》，提高詐騙犯罪的罰則，此項修法主要是期望藉此達到下列哪一項目的？
  options:
  - label: A
    content: 產生威嚇的效果，達到預防犯罪目的
  - label: B
    content: 矯正犯罪者不良習性，以利重返社會
  - label: C
    content: 以剝奪生命的刑罰，處罰犯罪
  - label: D
    content: 提高國家公權力威信，安慰被害人
  group_stem: "(題組二)詐騙案件猖獗，近日新型詐騙為「假交友真詐財」，交友詐騙又稱為愛情詐騙，是網路詐騙的類型之一。詐騙者可能是個人或集團，大多從交友網站\
    \ (例如：TanTan)、社群媒體平台 (例如：臉書)、通訊軟體 (例如：LINE) 等管道尋找對象，藉由建立假帳號來與交友軟體的使用者建立關係，詐騙者通常謊稱正在尋找固定交往對象來接近受害者，其最終目標卻是想透過感情弱點來騙取被害者的金錢；等被害人交付金錢後，對方隨即避不見面或無法聯繫。\n\
    \    為了遏止詐騙猖獗的情況，立法院在113 年7 月三讀通過俗稱打詐專法的《詐欺犯罪危害防制條例》，條文明定因詐欺獲益達500 萬元以上者，最重可處10\
    \ 年有期徒刑得併科3 千萬元以下罰金；若不法所得達1 億元以上，最重可處12 年有期徒刑，得併科3 億元以下罰金，也提高了假釋的門檻。此外，為消弭犯罪誘因，擴大對犯嫌不法得利的沒收範圍，希望藉由修法加強打詐手段，以徹底打擊詐欺犯罪，瓦解詐欺犯罪組織。"
