- id: doc_113_台北_仁愛_自然_g7s2e3_s1_31
  section: 1
  number: 31
  type: single
  page: 3
  stem: 關於寄生關係，下列敘述何者正確？
  options:
  - label: A
    content: 植物與根瘤菌為寄生關係
  - label: B
    content: 寄生生物會幫助宿主消化
  - label: C
    content: 寄生生物對宿主有害
  - label: D
    content: 寄生生物只寄生在非生物上
  group_stem: "◎ 閱讀下列有關生物之間交互作用的文章，回答31-34 題：\n    在自然界中，生物彼此之間並非孤立存在，而是透過各種方式互相影響、共存與競爭。這些生物間的互動可大致分為四種主要類型：互利共生、寄生、競爭與捕食。這些關係不僅影響個體的生存，也共同維繫著整個生態系統的平衡。\n\
    \    互利共生指的是兩種不同生物長期生活在一起，彼此提供幫助，雙方都能從中受益。例如，小丑魚與海葵的關係中，小丑魚不受海葵毒刺影響，可躲在其中避免掠食者攻擊；而小丑魚活動時會驅趕其他可能傷害海葵的生物，並協助海葵獲得更多氧氣和食物。又如，豆科植物的根部會與一種叫做根瘤菌的細菌共生。根瘤菌可以從空氣中固定氮氣，使土壤養分增加，幫助植物生長；而植物則為細菌提供糖分與棲息空間。這種合作關係，也常被應用於友善農耕與土壤改善。\n\
    \    寄生是一種不對等的關係，寄生生物（寄主）從宿主身上獲得資源，而對宿主造成傷害。例如，蛔蟲寄生在人體腸道中，吸收人類攝取的養分，導致宿主營養不良、腹痛甚至發育遲緩。\n\
    此外，家畜常被牛蜱寄生，牛蜱吸取血液，有時還會傳播疾病。這些例子提醒我們，寄生雖是一種生存策略，但往往對宿主是不利的。\n    當不同或相同物種的生物生活在同一環境中，若資源（如陽光、水、食物）有限，便會產生競爭關係。例如獅子與鬣狗常因爭奪同一片獵物而彼此衝突，甚至互相驅逐對方出領域。\n\
    \    捕食關係是自然界最直接的能量獲取方式之一。掠食者會捕捉並吃掉獵物，以維持自身生存。例如貓頭鷹捕食田鼠，不僅滿足自身營養需求，也有助於控制田鼠族群，避免過度繁殖破壞農作。水中也常見這類關係，例如大白鯊捕食海豹，這類天敵的存在讓整個海洋生態維持平衡與多樣性。\n\
    \    生物之間這些看似對立卻互相影響的關係，構成了自然界精巧的網絡。了解這些互動，不僅有助於我們學習生物，也讓我們更尊重生命間的依賴與共存。"
