  section: 1
  number: 38
  type: single
  page: 4
  stem: 下列哪一個建築案例最有可能符合綠建築的理念？
  options:
  - label: A
    content: 使用大理石地板與大型吊燈
  - label: B
    content: 屋頂鋪設太陽能板並種植綠屋頂
  - label: C
    content: 全室使用冷氣並加裝厚重窗簾
  - label: D
    content: 夜間照明不間斷開啟所有戶外燈光
  group_stem: "◎ 閱讀下列有關綠建築的文章，回答38-40 題：\n    隨著氣候變遷與環境污染的加劇，越來越多城市開始重視「永續發展」的概念。而「綠建築（Green\
    \ Building）」就是一種在設計與施工過程中，考量對環境影響與資源使用效率的建築方式。它強調節能、節水、減少廢棄物，以及與自然共生。\n    綠建築的外觀不一定綠色，但它背後的理念卻很「綠」──例如利用自然光與通風來減少冷氣與照明的用電量，屋頂設置太陽能板來發電，建材則選用回收或低污染的材料。部分綠建築還會設有「雨水回收系統」，將雨水儲存後用於澆花或沖廁。\n\
    \    台灣已有許多知名的綠建築，如台北的「松山文創園區」、「高雄圖書館總館」等。政府也推動「綠建築標章」，鼓勵建築設計符合節能減碳與生態保護的原則。\n\
    \    綠建築的興起，不只是科技的進步，更反映出人們對地球的責任感。每一棟環保建築，都是邁向永續未來的一步。"
