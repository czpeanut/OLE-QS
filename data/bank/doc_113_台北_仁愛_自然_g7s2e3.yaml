- id: doc_113_台北_仁愛_自然_g7s2e3_s1_35
  section: 1
  number: 35
  type: single
  page: 3
  stem: 下列哪一項最能說明「碳足跡」的意義？
  options:
  - label: A
    content: 人類活動產生的垃圾總量
  - label: B
    content: 二氧化碳在地面上留下的痕跡
  - label: C
    content: 一個人或活動產生的溫室氣體排放量
  - label: D
    content: 碳在人體內累積的數量
  group_stem: "◎ 閱讀下列有關碳足跡的文章，回答35-37 題：\n    在現代生活中，我們每天的行為都可能對地球造成影響。其中，「碳足跡（carbon\
    \ footprint）」是一個用來表示人類活動所產生二氧化碳（$CO_{2}$）等溫室氣體排放量的指標。這些氣體會加劇溫室效應，導致全球暖化，進而影響氣候變遷、極端天氣頻傳與生態環境改變。\n\
    \    日常生活中，許多行為都會產生碳足跡。例如：駕車或搭乘飛機時會燃燒石化燃料，排放二氧化碳。吃肉類食品，特別是牛肉，其生產過程中會產生大量甲烷和碳排放。電器長時間待機、空調設太低或開太久，也會提高用電量，增加碳足跡。\n\
    \    相對地，我們也可以透過行動來減少碳足跡。例如：搭乘大眾運輸、步行或騎腳踏車。減少使用一次性用品，選擇可重複使用的物品。吃在地、當季、以植物為主的食物。節約用電，例如關燈、拔插頭、調高冷氣溫度等。\n\
    \    每個人雖然只是地球上的一分子，但若大家都能從小地方做起，就能一起減緩氣候變遷的速度，守護我們的未來。"
- id: doc_113_台北_仁愛_自然_g7s2e3_s1_36
  section: 1
