  stem: '已知DDT 是一種殺蟲劑，難以被生物代謝，且容易累積於內臟與脂肪中。下表為某食物鏈中甲、乙、丙、丁四種生物體內含有的DDT 濃度。已知其中一種生物為生產者，根據上述，下列推論何者正確？


