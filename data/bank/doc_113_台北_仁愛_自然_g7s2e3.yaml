    | :--- | :---: | :---: | :---: | :---: |

    | 體內 DDT 的含量 (ppm) | 2.0 | 0.2 | 20 | 0.04 |'
  options:
  - label: A
    content: 若人類捕食此環境中各種生物，體內的DDT 濃度將小於2 ppm
  - label: B
    content: 食性關係可能為乙→丁→甲→丙
  - label: C
    content: 環境中的汙染容易累積在生產者中
  - label: D
    content: 減少攝食內臟與脂肪可減少毒物累積
