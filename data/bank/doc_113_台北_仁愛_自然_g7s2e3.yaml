  stem: 白蟻巢上通常長有真菌（白蟻菌），這類真菌倚靠白蟻的嘔吐物和排泄物做為養分，而白蟻為了獲得合成蛋白質的充足原料，則以真菌的菌絲為食。由於這類真菌的菌柄撕開後像雞肉絲，且味道鮮美，猶勝土雞肉，故又稱為「雞肉絲菇」。請問白蟻和雞肉絲菇的關係的為何？
