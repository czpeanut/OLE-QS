  group_stem: "牟子，本名牟融，東漢人，熟讀經史百家，並精通佛理，許多儒家學者都向他請教有關佛學的問題。\n  不過牟子在對儒家學者講解佛理時，總是引用儒家的經書來作說明，有人問：「您說佛家經典那麼多，內容廣博深厚，為什麼不用佛經講解呢？」\n\
    \  牟子答道：「你們對儒家經典的內容很熟，如果我引用儒家經典解釋佛理，你們很容易就能了解。反之，我若是引用佛典，就像對失明的人說各種漂亮顏色，對失聰的人演奏音樂，一點幫助也沒有。就是師曠那樣的音樂大師，無論技藝多麼精巧，也不能彈奏沒有琴弦的琴；狐貉的皮毛雖然暖和，但也不能溫暖沒有生氣的死人。例如春秋\
    \ 魯國的公明儀，有一次看見一頭牛在吃草，就彈琴給牠聽，可是不管旋律多悅耳動聽，牛卻充耳不聞，自顧著吃草，這是因為人類的音樂不適合給牛聽。後來他改彈出蚊虻鼓翅聲、落單小牛的悲鳴聲，牛就立刻停止吃草，搖著尾巴，豎起耳朵，徬徨不安地聆聽。我引用儒家經典來講解佛理，也是同樣的道理。」\n\
    \  後來這個故事被濃縮成「對牛彈琴」，用來比喻對不懂道理的人講道理。（教育部 成語典）"
