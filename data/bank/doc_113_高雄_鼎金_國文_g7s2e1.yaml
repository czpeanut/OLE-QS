  stem: 根據閱讀裝置的使用狀況，下列敘述何者正確？
  options:
  - label: A
    content: 使用行動裝置閱讀的人數比例少於閱讀器
  - label: B
    content: 使用閱讀器閱讀的比例較二○一九年顯著增加
  - label: C
    content: 使用閱讀器閱讀的人數比例已經追平行動裝置
  - label: D
    content: 使用閱讀器閱讀的人較二○一九年略為增加
  group_stem: "樂天KoBo 發表二○二○閱讀習慣調查報告，分析讀者閱讀習慣及購買電子書的種類、時間、數量及金額，從調查結果顯示，讀者最喜歡的電子書種類，第一名為文學小說，比例為56%，稍高於商業理財類別的55%。整體而言，女性偏愛文學小說、心理勵志、飲食類別；而男性則更愛商業理財、社會科學、人文史地與漫畫類別。\n\
    \  在閱讀的動力項目，增長知識與娛樂放鬆，分別占84%及71%，也對應出暢銷百大書單，以商管財經書籍占比超過五成，顯示讀者對商管理財類書籍有極高的學習誘因。\n\
    \  在閱讀時數項目，根據問卷調查結果，超過五成電子書讀者，每週閱讀時數在一到五小時之間，78%讀者每次閱讀在一小時以內。使用行動裝置閱讀的比例占67%（ios\
    \ 占50%，安卓系統占17%），閱讀器（EPD）占比33%，但閱讀器使用人數較去年成長近九成。\n  在閱讀本數方面，每月閱讀1 到10 本的讀者占比最高，有36%；其次為11\
    \ 到20 本，占比30%。其中有超過六成讀者表示會閱讀完整本書籍，23%讀者至少會閱讀一半以上。對於閱讀本數的攀升，有94%使用者認為電子書改變其閱讀型態，超過八成讀者認為電子書增加閱讀的數量以及提高閱讀的效率。\n\
    \  值得一提的是，今年漫畫類別首次成為類別暢銷第四，鬼滅之刃系列作一共有八本入圍銷售百大，尤其在鬼滅之刃劇場版 無限列車在臺上映後，單月銷售冊數翻倍成長，透過動畫、電影的快速圈粉，成為電子書創造銷售佳績的原因。\n\
    \                       （康弘昌 後疫情時代商機．電子書提高閱讀效率 閱讀器銷量翻倍成長）"
