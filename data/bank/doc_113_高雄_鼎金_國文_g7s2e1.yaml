- id: doc_113_高雄_鼎金_國文_g7s2e1_s5_32
  section: 5
  number: 32
  type: single
  page: 6
  stem: 有關「青」顏料的製作，下列何者說明是正確的？
  options:
  - label: A
    content: 冬日割取馬藍，春天插根在土壤中，使其發芽
  - label: B
    content: 石灰與水的比例，是一石的石灰對上五升的水
  - label: C
    content: 青色的顏料，由莖、葉浸入石灰水中，攪拌得之
  - label: D
    content: 插根前，根需浸水七日泡軟才可進行。
  group_stem: "凡藍五種，皆可為澱①。茶藍即菘藍，插根活。蓼藍、馬藍、吳藍等皆撒子生②。近又出蓼藍，小葉者俗名莧藍，種更佳。\n    凡種茶藍法，冬月割獲，將葉片片削下，入窖造澱；其身斬去上下，近根留數寸，薰乾，埋藏土內；春月燒凈山土，使極肥鬆，然後用錐鋤（其鋤勾末向身長八寸許）刺土，打斜眼，插入於內，自然活根生葉。其餘藍皆收子撒種畦圃中，暮春生苗，六月採實，七月刈身造澱。\n\
    \    凡造澱，葉與莖多者入窖，少者入桶與缸。水浸七日，其汁自來。每水漿一石下石灰五升，攪衝數十下，澱信即結。水性定時，澱澄於底。近來出產，閩人種山皆茶藍，其數倍於諸藍。山中結箬簍，輸入舟航。其掠出浮沫晒乾者，曰靛花。凡靛入缸，必用稻灰水先和，每日手執竹棍攪動，不可計數。其最佳者曰標缸。\
    \                                              ~《天工開物》③第三卷‧藍澱\n【注釋】①澱：即靛，藍色染料。\
    \   ②撒子生：播種法。    \n③天工開物：是中國古代一部綜合性的科學技術著作，作者宋應星是明朝科學家。\n★白話改寫—\n植物中有五種藍，都可以作「藍澱」：\n\
    茶藍：也就是菘藍（十字花科），只要插根就能成活。\n蓼藍（蓼科）、馬藍（爵床科）、吳藍（豆科）：必須撒籽而生。\n莧藍：近來又出現一種小葉蓼藍，俗名為莧藍，是更好的品種。\n\
    \    茶藍的種植方法是，在立冬之月（皇曆十月）收割， 將茶藍上的葉子一片一片地摘下來，放入窖中造藍澱。剩下的茶藍莖桿的上下都要切去，只留靠根的部位數寸，曬乾後埋在土裡。來年春天時，燒掉山上的雜草，使土地肥沃、疏鬆，然後用錐鋤（鋤勾向內彎曲，鋤長八寸）掘土，打成斜洞，將茶藍莖段插入其中，根部自然會成活而生出葉子。其餘各種藍都是收籽作種，撒在畦圃裡。春末出苗，六月採籽，七月割藍造澱。\n\
    造藍澱時，要是葉與莖很多，便放在窖裡，少的放入桶內或缸內。用水浸泡七天，自然會浸出藍液。每一石藍液放入石灰五升，攪動數十下，藍澱很快就會結成。靜放後，藍澱便沉於底部。\n\
    近來所生產的藍澱，多是用福建人在山上遍種的茶藍製得，其數量比其他各種藍的總和還要多好幾倍。他們在山上將茶藍裝入竹簍內，由船運到外地出售。\n製造藍澱時，將漂在上面的浮沫取出曬乾，名為「靛花」。放在缸內的藍澱，必須先和以稻灰水，每天手持竹棍不計次數地攪動，其中最好的叫作「標缸」。"
