- id: doc_113_高雄_鼎金_國文_g7s2e1_s5_30
  section: 5
  number: 30
  type: single
  page: 5
  stem: 本文主要在描寫下列何者？
  options:
  - label: A
    content: 順風耳、千里眼出沒人間的事蹟
  - label: B
    content: 人民感念順風耳、千里眼的緣由
  - label: C
    content: 順風耳、千里眼助媽祖收服水中妖
  - label: D
    content: 媽祖收服順風耳、千里眼的過程。
  group_stem: '西北方有二怪，一號順風耳、一號千里眼，出沒為祟，村民苦之，求治於后①，后乃雜跡於女流採摘中，十餘日，方與之遇。彼誤認為民間女子，將追前，后叱之，遂騰躍而去，一道火光，如車輪飛越，不可方物。后手中絲帕一拂，霾障蔽空，飛飆捲地。彼仍持鐵斧疾視。后曰：「敢擲若斧乎？」遂擲不可覆起，因咋舌②伏法。越兩載，復出為厲，幻生變幻，乘濤騎沫，滾蕩於浮沉蕩漾之中，巫覡③莫能治。后曰：「江河湖海，水德攸鍾，彼乘旺相之鄉，須木土方可剋之。」至次年五、六月間，絡繹問治於后，乃演起神咒，林木震號，沙石飛揚。二神躲閃無門，遂拜伏願皈正教。時后年二十三。

    （敕封天后志）

    【注釋】①后：媽祖。②咋舌：嚼咬舌頭。形容因害怕、悔恨而說不出話的樣子。咋，音ㄗㄜˊ。

    ③巫覡：男女巫師的合稱。男巫師稱為「覡」，女巫師稱為「巫」。覡，音ㄒㄧˊ。'
