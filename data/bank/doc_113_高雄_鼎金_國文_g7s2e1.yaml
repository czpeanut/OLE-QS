  group_stem: '李漁好食蟹。曾說過：「蟹之為物至美，而其味壞於食之之人。以之為羹者，鮮則鮮矣，而蟹之美質何在？以之為膾者，膩則膩矣，而蟹之真味不存。更可厭者，斷為兩截，和油、鹽、豆粉而煎之，使蟹之香與蟹之真味全失。此皆似嫉蟹之美觀，而多方蹂躪，使之泄氣而變形者也。世間好物，利在孤行。」                                                                  (李漁閒情偶寄)

    【注釋】①膾：ㄎㄨㄞˋ，切細的肉

    ★白話改寫—

    李漁喜歡吃螃蟹。他曾經說過：「螃蟹的味道極佳，而這樣的好味道往往被吃螃蟹的人破壞。用螃蟹來做湯，鮮是很鮮，但蟹的口感怎麼體現？切細後拿來燉的話，肥是很肥，但螃蟹真正的滋味卻沒有了。更可惡的是把螃蟹剁成兩塊，加上油、鹽、豆粉來煎，使得螃蟹的顏色、香氣和味道都失去了。這些做法似乎是嫉妒螃蟹的美味和美觀，想出各種辦法來糟蹋它，使它洩氣變形。世界上的好東西，都適合單獨品嘗。」'
