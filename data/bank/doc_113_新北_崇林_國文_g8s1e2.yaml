  section: 4
  number: 19
  type: single
  page: 3
  stem: 〈鳥〉一文中，下列文句的詮釋，何者正確？
  options:
  - label: A
    content: 從前我常見提籠架鳥的人，清早在街上遛達。我感覺興味的不是那人的悠閒，卻是那鳥的苦悶→以對比手法強調的重點是人的悠閒
  - label: B
    content: 牠的苦悶，大概是僅次於黏在膠紙上的蒼蠅；牠的快樂，大概是僅優於在標本室裡住著罷→以反諷筆法，寫鳥失去自由的苦悶
  - label: C
    content: 胳膊上架著的鷹，有時頭上蒙著一塊皮子，羽翮不整地蜷伏著不動，哪裡有半點瞵視昂藏的神氣→以反詰手法，寫鷹的沉潛待出
  - label: D
    content: 常年的關在柵欄裡，飲啄倒是方便，冬天還有遮風的棉罩，十分地「優待」，但是如果想要「搏扶搖而直上」，便要撞頭碰壁→以寫實手法描寫人對鳥的照顧。
