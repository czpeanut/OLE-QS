  section: 5
  number: 6
  type: single
  page: 5
  stem: 文章中提到，臺灣人使用注音符號的原因是什麼？
  options:
  - label: A
    content: 注音符號在社群場合中能改變語氣
  - label: B
    content: 注音符號是精靈符號
  - label: C
    content: 注音符號是學習漢字的基礎
  - label: D
    content: 注音符號是外國人學習漢字的工具
  group_stem: "全世界使用漢字的人很多，但只有台灣人以注音系統學習漢字拼讀，自小背誦的注音符號表、電腦手機使用的注音輸入法，都是我們生活中不可或缺的一部分。而對外國人來說，注音像是某種神秘符碼，如同台灣人的專屬，常常在社群場合上出現，有時可以改變語氣、有時還可以當作密碼。\n\
    \    以此為由，書法家「做作的Daphne」將台灣人熟悉的注音符號作為基礎，融入了神秘的「精靈文」概念，賦予注音文嶄新的視覺風貌，讓台灣人能以自己的方式書寫和表達。在設計編排時，偶爾會因為漢字的方整造形，而感覺視覺疲勞；又或者想在台味設計中增添點異國風味，打造又在地又國際的風格時，就是「精靈文」派上用場的時候了！\n\
    \   「精靈文」結合歐文書法造形，讓注音符號有了既典雅又陌生的氣質。其魔幻風格不僅適用於萬聖節，流動感造型也易於版面規劃，帶有西方視覺元素的設計更幫助「精靈文」凸顯跨文化對話。\n\
    \  「精靈文」字體由做作的Daphne 親手寫下，再經justfont 完成字型化，共推出兩種造形風格，各有特色，適合不同的使用場景。第一種：精靈文．岩(如下圖)「精靈文．岩」設計靈感來自中世紀的歌德體，稜角分明、結構敦厚穩重，帶有濃厚的古典氣息。其命名取群山之島的印象，適合較為莊重的場合，豪氣與典雅並存。第二種：\
    \ 精靈文．蕨(如下圖)「精靈文．蕨」曲線柔美，造形靈動，設計融入了卡洛林小寫體和義大利體的元素，呈現出自然的流線感。其命名源於蕨類王國的美名，輕盈且充滿活力的風格，適合用於日常貼文中，提升生活質感。\
    \    摘自網路文章 注音符號化身精靈文 20241031"
