  stem: 根據文章，為何古之學者必有師？
  options:
  - label: A
    content: 因為人非生而知之者，無人不會有疑惑。
  - label: B
    content: 因為古之學者通常不需要指導。
  - label: C
    content: 因為學習道理不需要任何幫助。
  - label: D
    content: 因為師者不再傳授知識。
  group_stem: 古之學者必有師。師者，所以傳道受業解惑也。人非生而知之者，孰能無惑？惑而不從師，其為惑也，終不解矣。生乎吾前，其聞道也固先乎吾，吾從而師之；生乎吾后，其聞道也亦先乎吾，吾從而師之。吾師道也，夫庸知其年之先后生于吾乎？是故無貴無賤，無長無少，道之所存，師之所存也。                     （節錄
    〈師說〉 韓愈）
