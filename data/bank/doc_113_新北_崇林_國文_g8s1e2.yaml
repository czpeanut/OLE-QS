- id: doc_113_新北_崇林_國文_g8s1e2_s5_3
  section: 5
  number: 3
  type: single
  page: 4
  stem: 作者認為的「心靈沙拉」是何種情景？
  options:
  - label: A
    content: 社區道路整潔
  - label: B
    content: 在乾淨的廚房煮菜
  - label: C
    content: 窗外花景加上各種鳥鳴
  - label: D
    content: 家中窗戶正對著高級社區。
  group_stem: "家裡廚房窗戶正對著一座美麗的社區，花木扶疏、道路整潔，讓我的柴米油鹽每天都呼吸到清新的空氣，還不時有意外的訪客出現窗外，點綴這已經繽紛燦爛的花園社區，煮飯用餐因此都成為悠閒怡悅的雅事。\n\
    \  上禮拜，一群綠繡眼在窗前的斑葉欖仁樹上，窸窸窣窣討論著要去探險一類的事情，之後，有幾天不見了身影。前天，牠們又來到斑葉欖仁樹上，一邊踩落細小的樹葉，一邊發表牠們探險的收穫。纖秀的樹枝輕緩顫動，可以察覺到小傢伙們興奮極了！\n\
    \  昨天，社區圍牆的鐵絲網上，站著一隻橄欖綠的鳥兒，開開心心唱著歌，足足有半個小時。小小的頭動個不停，黃色的嘴巴短短卻大大聲地歡唱。儘管天上烏雲密布，這隻鳥兒儼然是呼喚雷雨的精靈，在隆隆雷聲中越發唱得精神極了。\n\
    \  頑皮聒噪的八哥，總是站在社區陽臺、樓頂或外牆上，大落落地唱起情歌，很有山歌對唱的趣味。我喜歡看牠們唱唱跳跳，彷彿這情歌是為我唱的。不過白頭翁絕對不會同意我的一廂情願。牠們哪，直接就在我窗前的桂花上大聲糾正我：「專心洗菜！別浪費水。」響亮的嗓音蓋過了八哥。我低頭洗菜，心裡卻暗自發噱，嘿，這些訪客管得也太多啦。\n\
    \  訪客們走來走去，在我窗前寒喧、問訊。隨著牠們身影跳動、飛翔、穿梭，我的視線也上下游移，逡巡、捕捉，耳朵則是忙著接收牠們拋下的片言隻語。享用這歡樂鳥語和璀璨花顏拌成的心靈沙拉，我，福氣啦！\n\
    \           心靈沙拉 \n林加春"
