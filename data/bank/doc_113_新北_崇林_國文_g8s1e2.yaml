  group_stem: '周敦頤，字茂叔，道州營道人。原名敦實，避英宗舊諱改焉。以舅龍圖閣學士鄭向任，為分寧主簿。有獄久不決，敦頤至，一訊立辨。邑人驚曰：「老吏不如也。」部使者薦之，調南安軍司理參軍。有囚法不當死，轉運使王逵欲深治之。逵，酷悍吏也，眾莫敢爭，敦頤獨與之辯，不聽，乃委手版歸，將棄官去，曰：「如此尚可仕乎！殺人以媚人，吾不為也。」逵悟，囚得免。

    節錄自 宋史 周敦頤傳'
