- id: doc_113_新北_崇林_國文_g8s1e2_s4_10
  section: 4
  number: 10
  type: single
  page: 2
  stem: 小名在閱讀完 (甲) (乙)兩篇文章後，說出以下評論，請問何者完全正確？
  options:
  - label: A
    content: 兩篇文章所描寫的時間都與「宮中午漏長」的時間相通
  - label: B
    content: 兩篇文章所描寫的感觸均與「日暮客愁新」的感觸相同
  - label: C
    content: 兩篇文章所描寫的季節都是夏秋之交相關
  - label: D
    content: 兩篇文章都寫到鳥類的鳴聲引發人不同的感受。
  group_stem: '(甲)我開始欣賞鳥，是在四川。黎明時，窗外是一片鳥囀，不是吱吱喳喳的麻雀，不是呱呱噪啼的烏鴉。那一片聲音是清脆的，是嘹亮的。有的一聲長叫，包括著六七個音階;有的只是一個聲音，圓潤而不覺其單調;有時是獨奏，有時是合唱，簡直是一派和諧的交響樂。不知有多少個春天的早晨，這樣的鳥聲把我從夢境喚起。等到旭日高升，市聲鼎沸，鳥就沉默了，不知到那裡去了。一直等到夜晚，才又聽到杜鵑叫，由遠叫到近，由近叫到遠，一聲急似一聲，竟是淒絕的哀樂。客夜聞此，說不出的酸楚！(梁實秋〈鳥〉)

    (乙)隨著太陽升高，森林裡逐漸暖和，也隨之熱鬧起來。大冠鷲此起彼落的哨鳴，從高空遍傳林裏。我從樹隙上望，偶爾可以瞥見四隻在藍天上盤來旋去。幾隻竹雞在樹蔭深處激昂地分邊對叫。小捲尾在樹梢上振著雙翅，發出高亢的歌聲，五色鳥、樹鵲、紅嘴黑鵯、繡眼畫眉都加入了，譜成了這首暮春初夏的山林交響樂。最後因為加入筒鳥幽遠的木管聲，使得交響樂達到了高峰。(徐仁修〈森林最優美的一天〉)'
  tags:
    chapter:
      publisher: 康軒
      book: 八上
      subject: 國文
      code: 第八課
      title: 鳥
      chapter: null
