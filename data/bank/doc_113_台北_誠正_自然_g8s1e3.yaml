  page: 4
  stem: 有關道耳頓原子說的敘述，下列敘述何者是正確？
  options:
  - label: A
    content: 所有物質皆由不可被分割的分子所組成
  - label: B
    content: 相同元素的原子具有相同的質量與性質，不同元素的原子具有不同的質量與性質
  - label: C
    content: 不同元素的原子可以非整數比例結合成化合物
  - label: D
    content: 化學反應是分子間重新排列，形成新物質，反應中原子會消失、自然生成且改變，原子的質量及特性會改變。
