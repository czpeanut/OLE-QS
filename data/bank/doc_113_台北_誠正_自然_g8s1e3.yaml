- id: doc_113_台北_誠正_自然_g8s1e3_s1_20
  section: 1
  number: 20
  type: single
  page: 3
  stem: '煙囪效應（英文：Stack effect）是指戶內空氣沿著有垂直坡度的空間向上昇或下降，造成空氣加強流動的現象。在高樓大廈的環境內，煙囪效應可以是令火災猛烈加劇的原因。在低層發生的火災造成的熱空氣，因為密度較低，經電梯槽或走火通道內得以往上流動，使高熱氣體不斷在通道的頂部積聚，結果是使火勢透過這種空氣的影響在大廈的頂部製造另一個火場。不單使撲救變得更困難，更會危及前往天台逃生者的生命安全。

    讀完上述敘述，選出能正確描述上述現象的名稱及日常生活中的類似應用:'
  options:
  - label: A
    content: 輻射，太陽能儲熱器
  - label: B
    content: 對流，壁爐
  - label: C
    content: 傳導，電鍋
  - label: D
    content: 對流，保溫瓶
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 理化
      code: 5-5
      title: 熱的傳播方式
      chapter: 第5章 溫度與熱
    textbook: 八上理化 5-5 熱的傳播方式
    labeled_by: ai
- id: doc_113_台北_誠正_自然_g8s1e3_s1_21
  section: 1
  number: 21
  type: single
  page: 3
  stem: '某生使用同一熱源做15℃同質量甘油與水的加熱時間與溫度變化實驗，得出上升溫度與加熱時間關係圖如右圖所示。從液體黏滯係數的科展報告與探討中得知，低溫時甘油與水的黏滯係數比為657：1。顯示甘油低溫時黏稠不易流動，高溫時甘油黏滯性大為降低，有較好的流動性。

    而且甘油30℃的熱傳導係數為0.38 傳導係數低不易導熱，水同溫時則為0.62 較容易導熱。表示水低溫時的熱傳導性較甘油好。根據上列敘述，判斷下列何人敘述正確?'
  options:
  - label: A
    content: 玄燁：「甘油的比熱一定比水大，容易升溫。」
  - label: B
    content: 劉彘：「甘油低溫時性質像固體易導熱，也易升溫；高溫時像液體不易導熱，也不易升溫。」
  - label: C
    content: 世民：「甘油的比熱肯定比水小，但不易升溫。」
  - label: D
    content: 朋朋：「甘油低溫時性質像固體不易導熱，也不易升溫；高溫時像液體可利用對流方式傳播熱量，比水易升溫，可知甘油比熱比水小。」
