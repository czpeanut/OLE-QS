  section: 1
  number: 3
  type: single
  page: 1
  stem: 有關溫度計的種類與科學原理的敘述，下列何者正確？
  options:
  - label: A
    content: 傳統溫度計量體溫是利用熱平衡及熱脹冷縮原理
  - label: B
    content: 熱顯像儀的原理是利用物質熱脹冷縮來測量溫度
  - label: C
    content: 只要能因溫度變化而有均勻的體積變化的物質多可以當作溫度計材料，所以水是很好的溫度計材料
  - label: D
    content: 梅西利用固體熱脹冷縮的原理，發明世界第一個溫度計。
