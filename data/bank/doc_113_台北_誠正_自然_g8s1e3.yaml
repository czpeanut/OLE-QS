- id: doc_113_台北_誠正_自然_g8s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 物體的熱量變化（H）和質量（m）、比熱（S）、溫度變化（△T）均有關係，現有甲、乙兩物體相互比較，當固定其中兩個變因時，另兩者大小關係敘述下列何者正確？(熱量公式如右
    H ＝ m × S × △T)
  options:
  - label: A
    content: 當H 與△T 相同時，若$m_{甲} > m_{乙}$，則$S_{甲} > S_{乙}$。
  - label: B
    content: 當m 與H 相同時，若$S_{甲} < S_{乙}$，則$△T_{甲} > △T_{乙}$。
  - label: C
    content: 當H 與S 相同時，若$m_{甲} > m_{乙}$，則$△T_{甲} > △T_{乙}$。
  - label: D
    content: 當m 與S 相同時，若$H_{甲} < H_{乙}$，則$△T_{甲} > △T_{乙}$。
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 理化
      code: 5-3
      title: 比熱
      chapter: 第5章 溫度與熱
    textbook: 八上理化 5-3 比熱
    labeled_by: ai
- id: doc_113_台北_誠正_自然_g8s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 有四位學生參考右圖並討論有關溫標的敘述如下，何者正確?
  options:
  - label: A
    content: 蓬蓬：「溫標是用來表示熱量的單位，臺灣地區一般較常使用華氏溫標℉」
  - label: B
    content: 悟悟：「水的冰點是華氏溫標0℃、沸點是100℃；攝氏溫標水的冰點是0℉、沸點是180℉」
  - label: C
    content: 佩佩：「攝氏溫標與華氏溫標會有一個相同數字的相同溫度為－80℃＝－80℉」
  - label: D
    content: 淨淨：「攝氏溫標將水的冰點到沸點分為100 格，而華氏溫標則分為180 格，所以華氏溫標比較精密」。
