      file: doc_113_屏東_中正_社會_地理_g9s2e1/1_36_optD.png
  group_stem: 臺灣早期的聚落發展，反映了先民生活環境的變遷與土地拓墾的歷程，當時民生以農業為主，多數民眾居住在為數眾多的鄉村聚落中。各聚落的居民依當地的自然環境、族群文化與產業，賦予聚落獨特的地名。2020
    年，臺灣共有 368 個鄉鎮市區，大多以當地居民日常生活所在的聚落名稱，作為其鄉鎮市區地名。早期的農業社會中，天然資源或作物的加工場所，常成為地名的命名依據。例如：早期甘蔗製糖非常發達，因此出現與糖類相關的地名。(回答第35.36
    題)
