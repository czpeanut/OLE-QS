  group_stem: 地名是一個地方的名稱，反映當地居民和土地的關係。歷經長期開發，臺灣在 19 世紀末發展出約數千個聚落，這些聚落規模較小、層級較低，因此地名異動較少，得以保留早年的環境特徵或族群文化。其中以地形特徵為名的情形尤為常見，但臺灣族群多元，常有不同族群的語言文化或是原鄉文化反映於聚落地名中。附圖八為臺中市大安區牛埔地圖，牛埔是臺中市大安區的一個傳統地域名稱，位於該區中部偏東南，相較於今日行政區，其範圍大致為福興里境內。(回答第37.38
