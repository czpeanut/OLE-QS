  group_stem: "請閱讀下列敘述，並回答第32~34 題：\n  臺灣的地名與歷史產業有密切的關聯。例如：「鎮」與「營」的相關地名，是因為當地曾實施寓兵於農的「軍屯」；而「大稻埕」則是晒穀場的意思；「張犁」、「甲」代表土地的計算單位；「股」是墾戶募集資金，墾成後分配土地股份；「結」是漢人墾地「結首」制的代稱，這些地名都反映當時農業開墾的狀況。除此之外，地名含有「樟」或「腦」者多半與製造樟腦有關，而含有「茶」字者大多為產茶區域。"
