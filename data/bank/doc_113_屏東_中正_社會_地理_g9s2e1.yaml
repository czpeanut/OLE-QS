  stem: 有美食奧斯卡之稱的英國美食大賞，將最高級別的獎項──金叉獎，頒給來自臺灣醬油生產商豆油伯所生產的「茶姬」。茶姬是以臺灣茶豆天然釀造單方豆配方醬油，醬油入口後，細膩且持久的鹹甜味蕾交織，在舌尖有飽滿的味覺表現，可搭配多種食物，料理潛力無限。臺灣食品逐漸在國際嶄露頭角，代表著臺灣農業的何種趨勢？
