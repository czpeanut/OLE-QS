- id: doc_113_台北_仁愛_社會_地理_g9s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 嘉義市的舊稱「諸羅」，最早是來自在今天嘉義市一帶生活的平埔族「諸羅山社」(Tirocen sha)，漢人取其音譯，稱嘉義市這一帶平埔族居住的地方為「諸羅山」。臺灣納入清帝國版圖並設一府三縣，乃沿用此「諸羅」的地名而設立「諸羅縣」。西元1787
    年，清高宗為表彰林爽文事件期間，諸羅縣城內民眾「急公向義」協助朝廷奮勇抵禦的英勇事蹟，「應錫嘉名」，故將「諸羅」改為「嘉義」。請問：根據上文推論此地名的演變順序下列哪一項為正確？
  options:
  - label: A
    content: 嘉義市→諸羅山→諸羅縣
  - label: B
    content: 諸羅縣→諸羅山→嘉義市
  - label: C
    content: 諸羅山→諸羅縣→嘉義市
  - label: D
    content: 諸羅山→嘉義市→諸羅縣
  answer:
  - C
  answer_source: answer_key_vlm
