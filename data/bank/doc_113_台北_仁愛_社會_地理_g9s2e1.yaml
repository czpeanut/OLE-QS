- id: doc_113_台北_仁愛_社會_地理_g9s2e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 西方國家早期稱臺灣為「福爾摩沙」，該詞音譯自拉丁文的「Formosa」。傳說在 1542 年，西方水手前往日本的航行途中經過臺灣東岸，映入眼簾的蔥鬱美景，讓他們驚呼、讚歎「Ilha
    Formosa！」（美麗之島），因而得名。若依上述說法判斷，當時這些水手的航行路線為何？
  options:
  - label: A
