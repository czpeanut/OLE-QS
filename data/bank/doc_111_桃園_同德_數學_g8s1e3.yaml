- id: doc_111_桃園_同德_數學_g8s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '大同與阿德對於「一元二次方程式 $2x^{2}-x-6=9$」的描述如下。判別他們的說法是否正確？

    | 大同 | 阿德 |

    | :--- | :--- |

    | 將 $x=3$ 代入 $2x^{2}-x-6=9$<br>得 $2x^{2}-x-6=6^{2}-3-6=27 \neq 9$<br>所以 $x=3$
    不是方程式 $2x^{2}-x-6=9$ 的解 | 因為 $2x^{2}-x-6$ 可分解為 $(2x+3)(x-2)$<br>所以 $2x^{2}-x-6=9$<br>$(2x+3)(x-2)=9$<br>$x=-\frac{3}{2}$
    或 $x=2$<br>此方程式的解為 $-\frac{3}{2}$ 與 2 |'
  options:
  - label: A
    content: 大同正確，阿德錯誤
  - label: B
    content: 大同錯誤，阿德正確
  - label: C
    content: 兩人皆正確
  - label: D
    content: 兩人皆錯誤
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 數學
      code: 4-1
      title: 因式分解法解一元二次方程式
      chapter: 第4章 一元二次方程式
