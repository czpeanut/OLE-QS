- id: doc_113_台南_明正_英語_g9s2e1_s4_1
  section: 4
  number: 1
  type: single
  page: 2
  stem: What does media literacy mean?
  options:
  - label: A
    content: Being able to tell right from wrong when looking for information on the
      Net.
  - label: B
    content: Understanding how to create technology.
  - label: C
    content: Using technology for fun.
  - label: D
    content: Having the skill to fix computers.
  group_stem: '第一篇

    In today''s world, technology and media play an important role in how we live.
    Almost everyone has a chance to use a smartphone or computer, and many of us spend
    a lot of time on the Internet. Technology has made it easier for us to keep in
    touch with friends and family, learn new things, and get information quickly.
    However, with so much information, it''s important to know how to find trusted
    sources we see online.

    Media literacy means being able to understand and evaluate the media we meet every
    day. That is to say we are clear about what is right and what is wrong when we
    get information on the Net. It is important because not everything we see on the
    Internet is true. Some websites and social media accounts pass on fake news. Being
    able to spot fake news helps us avoid believing wrong information and make better
    choices.

    Besides, many people share personal information on social media without thinking
    about the results. It''s important to know how to make your personal information
    safe online.

    In school, students should learn how to check information, get a clear understanding
    of what they found on the Net, and avoid fake information. By doing so, they are
    able to make better choices in their personal lives.

     technology 科技；evaluate 評估；personal 私人的；social media 社群媒體；account 帳戶；avoid 避免；privacy
    隱私'
