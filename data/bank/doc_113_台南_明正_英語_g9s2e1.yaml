- id: doc_113_台南_明正_英語_g9s2e1_s4_6
  section: 4
  number: 6
  type: single
  page: 3
  stem: What is the main idea of the reading?
  options:
  - label: A
    content: Teamwork is not important.
  - label: B
    content: Good interpersonal relationships help teams succeed.
  - label: C
    content: People should always work alone.
  - label: D
    content: Sports teams are more important than school teams.
  group_stem: '第二篇

    Teamwork is important in many parts of our life, from school plans to sports.
    Working together with others allows people to get things done that might be difficult
    to do alone. A good team relies on strong interpersonal relationships. The members
    in the team communicate well with each other and often support each other.

    In a team, it’s important to listen to everyone’s ideas and opinions. When people
    respect each other, they can solve problems more easily and make better choices.
    Sometimes, there might be disagreements, but learning how to solve them helps
    the team grow stronger.

    Good teamwork also means knowing when to take the lead and when to follow. Every
    member of the team plays a role, and knowing each person’s good points can help
    the team succeed. Whether you are working on a school plan or playing sports,
    the key to success is working together and building good relationships.

     rely 在於；interpersonal 人際的；relationship 關係；communicte 溝通；support 支持；respect 尊重；disagreement
    意見不合'
