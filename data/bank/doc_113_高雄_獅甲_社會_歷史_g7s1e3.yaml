  group_stem: 1723 年，巴宰族岸里社（今臺中市神岡區一帶）因灌溉水源不足，與漢人墾戶張達京協議割地換水，由張達京出資興建水圳，並以漢八番二的比例分水。1733
    年，因用水量增加，岸里社再度協議割地換水，此次張達京邀秦登鑑、姚德心、廖朝孔、江又金、陳周文等人組成「六館業戶」共同出資，興建新圳合併舊圳，並開墾岸里社割讓的土地。水圳完工後，臺中盆地獲得充足灌溉，農業發達，漢人移民更增，岸里社人的生活空間卻逐漸遭到壓縮，後被迫遷移至內山與東部。請依上文回答18-21
