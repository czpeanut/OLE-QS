- id: doc_113_高雄_獅甲_社會_歷史_g7s1e3_s1_22
  section: 1
  number: 22
  type: single
  page: 1
  stem: 關於文中所提到之「頂郊」與「下郊」，下列敘述何者正確？
  options:
  - label: A
    content: 此種組織主要經營國際貿易
  - label: B
    content: 兩者應該是以貿易商品做區分
  - label: C
    content: 貿易商品應該是稻米與蔗糖
  - label: D
    content: 此類組織在開港通商後才興起
  group_stem: 臺北市萬華區艋舺清水巖主祀清水祖師，創建於1787 年，由＿＿府安溪縣移民奉請清水祖師香火來臺。當時艋舺因港運之便，貿易發達，但利益大多掌握在「頂郊」手中，引起另一派「下郊」（或稱廈郊）不滿，1853
    年，雙方終於爆發衝突，史稱「頂下郊拚」，清水巖受波及遭到焚毀（1875 年重建完成），而下郊則不敵敗退到大稻埕一帶。後來艋舺逐漸淤積，船隻開始改泊大稻埕，加上1860年後清帝國開港通商，____成為臺灣第一熱銷之商品，大稻埕成為＿＿的加工集散地，因而取代艋舺的地位，成為臺北地區最繁華的商業中心。請參考上文回答22-25
