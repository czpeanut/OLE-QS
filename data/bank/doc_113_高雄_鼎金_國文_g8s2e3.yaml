  stem: 根據文章內容，下列分析何者最恰當？
  options:
  - label: A
    content: 作者以「山島林壑，舟楫器物，盡作金色」特寫夕陽
  - label: B
    content: 作者運用許多摹寫技巧來敘述竹島人如何度過中秋節
  - label: C
    content: 作者六月四日抵達竹島後，一直到中秋節皆未離開竹島
  - label: D
    content: 竹島，據高麗人說法，是因為菩薩曾經顯靈而得名
  group_stem: "六月四日。午後過菩薩苫，麗人謂其上曾有顯異，因以名之。申後風靜，隨潮而進。\n     是日酉後，舟至竹島拋泊，其山數重，林木翠茂。其上亦有居民，民亦有長。山前有白石焦數百塊，大小不等，宛如堆玉。\n\
    \     使者回程至此，適值中秋月出，夜靜水平，明霞映帶，斜光千丈，山島林壑，舟楫器物，盡作金色。人人起舞弄彩，酌酒吹笛，心目欣快，不知前有海洋之隔也。\
    \ (註：菩薩苫(ㄕㄢ)：韓國地名。)  ( 徐競 使高麗錄 )"
