  stem: 讀了這篇文章後，幸敏覺得很有趣，但不了解文章中「揖」的字義，請問：若想查找「揖」的字義，幸敏找錯了哪一本工具書？
  options:
  - label: A
    content: 重編國語辭典
  - label: B
    content: 標準國語字典
  - label: C
