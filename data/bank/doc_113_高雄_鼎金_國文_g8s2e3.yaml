    content: 詞依照句數可分為小令、中調、長調
  - label: B
    content: 每首詞的句數、字數、平仄和用韻皆依照詞牌規定，而詞牌和內容大多無關
  - label: C
    content: 詞興起於唐代，發展在五代，盛行於宋代。是由唐詩演變而來的，故稱「詩餘」
  - label: D
    content: 詞是可以配樂歌唱的，詞家三李是指李白、李煜、李清照。
