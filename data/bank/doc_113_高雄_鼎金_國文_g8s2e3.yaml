  group_stem: 昔有雄雌二鴿，共同一巢。秋果熟時，取果滿巢。於其後時，果乾減少，唯半巢在。雄瞋雌言：「取果勤苦，汝獨食之，唯有半在。」雌鴿答言：「我不獨食，果自減少。」雄鴿不信，瞋怒而言：「非汝獨食，何由減少。」即便以嘴，啄雌鴿殺。未經幾日，天降大雨。果得濕潤，還復如故。雄鴿見已，方生悔恨：「彼實不食，我妄殺他！」即悲鳴命喚雌鴿：「汝何處去？」                                          《百喻經》
