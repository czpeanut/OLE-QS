- id: doc_113_高雄_鼎金_國文_g8s2e3_s4_9
  section: 4
  number: 9
  type: single
  page: 2
  stem: 「太陽黑子是太陽活躍程度的指標，黑子數量越多，太陽就越活躍。太陽在極大期時，發出的能量會比極小期多大約千分之一。黑子是太陽表面比較暗的地方，太陽黑子極大期時，變暗的地方增加了，為何太陽發出的能量反而比較多？那是因為太陽黑子增加的時候，太陽光斑(solarfacula)也增加了，光斑的亮度比太陽表面還亮，太陽光斑增加的亮度比黑子減少的還多，所以整體而言，太陽發出的能量還是增加了。」(有趣的天文學)根據這話的說明，下列選項哪一個敘述錯誤？
  options:
  - label: A
    content: 黑子所指的就是太陽的陰暗面
  - label: B
    content: 太陽黑子增加的時候，太陽光斑的亮度比太陽黑子還要亮
  - label: C
    content: 太陽越是活躍，黑子的數量越多
  - label: D
    content: 太陽在極大期時，發出能量會比極小期多大約千分之一。
