- id: doc_113_高雄_鼎金_國文_g8s2e3_s5_32
  section: 5
  number: 32
  type: single
  page: 6
  stem: 根據文章，下列說明何者與文章內容不相符？
  options:
  - label: A
    content: 世界壯年運動會跟奧林匹克運動會一樣，每四年舉辦一次，未曾失誤
  - label: B
    content: 2025 世壯運的標誌標語具有團結、臺灣生態的多元與美麗的象徵意義
  - label: C
    content: 2025 年世壯運是第10 屆舉辦
  - label: D
    content: 臺灣是亞洲第一個舉辦世界壯年運動會的國家。
  group_stem: "世界壯年運動會（簡稱世壯運）為每四年舉辦一次的知名國際大型綜合性運動賽會，由世壯會國際壯年運動總會（IMGA）管理，這是國際奧會認可的非營利組織，除了推廣奧林匹克精神與活動外，也希望提升民眾終身運動的相關意識，也因此，世壯運倡導「終身運動」及「全民運動」，成為了運動結合觀光旅遊的指標性重要國際賽會。如前所述，2025\
    \ 年世界壯年運動會將由臺灣的臺北市、新北市共同舉辦，本屆賽會共計為期13 天，自2025 年5 月17 日至5 月30 日。目前開幕式預計會在台北大巨蛋登場，閉幕式則於新北淡水漁人碼頭。\n\
    \    首屆世壯運在1985 年登場，當時在加拿大多倫多舉行，之後的舉辦城市包括1989 年丹麥的奧胡斯、1994 年澳洲的布里斯本、1998 年美國的波特蘭、2002\
    \ 年澳洲的墨爾本、2005 年加拿大的艾蒙頓、2009 年澳洲的雪梨、2013 年義大利的杜林、2017 年紐西蘭的奧克蘭等，目前澳洲已累積舉辦三次，成為現階段舉辦次數最多的國家。而原訂要在2021\
    \ 年主辦的日本關西，當時因為疫情的關係被迫延至 2027 年舉行，這也代表臺灣將成為亞洲第一個舉辦世界壯年運動會的國家。\n    世界壯年運動會最特別的地方，由於秉持著「終身運動」及「全民運動」的精神，只要年滿30\
    \ 歲，不分國籍、不分背景，有意願參加的民眾都可以參加，無需經歷任何選拔過程，同時在組隊國籍上也不會有任何限制，就是希望可以盡量的讓更多民眾參與世壯運賽事。\n\
    2025 雙北世壯運的報名時間自2024 年2 月17 日14 點起至2025 年2 月17 日23 時59 分59 秒截止。\n持有國民身分證、健保卡、護照、外僑居留證者：選手報名費3,600\
    \ 元、隊職員與陪同者1,800 元、12 歲以下陪同者與帕拉選手助理員則為免費。持有外國護照者：選手報名費7,500 元、隊職員與陪同者3,600元。\n\
    \    2025 年世界壯年運動會的舉辦競賽項目共計有35 項，其中必辦項目19 項、選辦項目14 項、示範項目2 項。\n\n| 必辦項目 | | |\
    \ | |\n| :--- | :--- | :--- | :--- | :--- |\n| 射箭 | 田徑 | 羽球 | 棒壘球 | 籃球 |\n| 輕艇\
    \ | 自由車 | 舉重 | 桌球 | 足球 |\n| 高爾夫 | 曲棍球 | 定向越野 | 划船 | 鐵人三項 |\n| 排球 | 射擊 | 壁球 | 網球\
    \ | |\n\n| 選辦項目 | | | | |\n| :--- | :--- | :--- | :--- | :--- |\n| 衝浪 | 拔河 | 水上運動\
    \ | 橄欖球 | 救生 |\n| 空手道 | 手球 | 運動舞蹈 | 飛盤 | 跆拳道 |\n| 帆船 | 柔道 | 滾球 | 擊劍 | |\n\n| 示範項目\
    \ | |\n| :--- | :--- |\n| 槌球 | 木球 |\n\n    雖說本屆世壯運為雙北世壯運，但與今年的巴黎奧運類似，2025 世壯運主要也是以使用現有場館、不另行興建場館為主，共計有69\
    \ 座的場館使用，遍布臺北、新北、宜蘭、桃園、新竹縣市等。\n    這次雙北世壯運運用例如繩結的線條，帶出象徵「團結」的凝聚力量，透過體育將世界不同的文化交融在一起，雙線色彩表現來自世界各地的選手相互切磋與交流。蝶翼造型除了能象徵臺灣生態的多元與美麗，對稱展翅的樣式也表現了兩個城市一起迎接世界的記號。\
    \           ( 資料來源：網路 )"
