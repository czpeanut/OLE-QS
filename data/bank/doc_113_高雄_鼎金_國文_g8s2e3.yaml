  stem: 𨑨迌旅行社想要推廣摩爾曼斯克的旅遊方案，下列標語何者最適合用來製成宣傳海報？
  options:
  - label: A
    content: 戀戀摩爾曼斯克─天選之地，一百八十天都有極光
  - label: B
    content: 戀戀俄羅斯─體驗聖誕老公公馴鹿雪橇的生活
  - label: C
    content: 愛戀洛沃澤羅─認識全世界最後的遊牧民族
  - label: D
    content: 戀戀摩爾曼斯克─體會截然不同的鋼鐵與極光交織的衝突美。
  group_stem: "此生必追一次世界自然奇觀北極光，親歷其境，畢生難忘。傳說看見極光的人能幸福一輩子，使得極光旅遊越來越受歡迎。\n    每年九月到二月的秋冬季節是欣賞極光的月份，極光大爆發的季節通常在早春或晚秋，三月到四月也有機會看見極光，追極光最佳的時間是在午夜時刻。追極光較熱門地區北歐(包括芬蘭、挪威、冰島)及北美加拿大黃刀鎮等。這幾個靠近北極的地點有很多機會可看見極光。\n\
    \    許多人不知道，其實俄羅斯擁有全世界最長的極光帶，理論上是最適合追極光的地區，但在極光旅遊界，俄羅斯卻是沒沒無聞了很長一段時間。原因在於，俄羅斯大部分的極光帶都位於西伯利亞的北冰洋海岸線，不僅天氣嚴寒人跡罕至，大部分還是軍事管制區，一般人根本無法進入。但即使如此，俄羅斯仍有一個位於北極圈內的新興極光首都──摩爾曼斯克。\n\
    \    摩爾曼斯克在俄羅斯西北部的科拉半島，位於俄羅斯與挪威、芬蘭的邊境，地處高緯度優勢(北緯68度)，深入北極圈超過三百公里，市中心人口三十萬人，是北極圈內最大的城市，有極圈首都之稱。因有北大西洋暖流，所以讓此地的溫度較其他觀賞極光之地暖和，且地點位置極佳，一年之中極光出現天數竟然高達一百八十天。\n\
    \    此外，這座城市還是俄羅斯的英雄城市之一，是俄羅斯在北冰洋最重要的軍事港口，也是北極圈內發展最好的城市之一，擁有全世界最北的火車站，以及全世界第一艘核子動力破冰船：列寧號。在俄羅斯看極光，您可以體會到截然不同的鋼鐵與極光交織的風味。\n\
    \    摩爾曼斯克的市區因為有光害影響，比較難看到極光，建議往人煙稀少的郊區移動。在摩爾曼斯克看極光最佳地點，一個是捷里別爾卡，另外一個是薩米人的棲息地洛沃澤羅。這兩個地方光污染小，看到的極光的概率很大。\n\
    \    除了追極光，白天可以到洛沃澤羅遊覽，住在這裡的薩米人是歐洲目前僅存的游牧民族，目前只剩下數萬人口。他們保留了上世紀的生活方式，說薩米語、吃森林鹿肉、養狐狸當寵物等。以捕魚狩獵，飼養馴鹿、哈士奇維生，深入北極圈才有的哈士奇狗拉雪橇、馴鹿雪橇、冰上摩托車、鑿冰冰釣等豐富的雪地體驗，每一樣都能讓造訪的旅人興奮不已、樂在其中。\n\
    ★追俄羅斯極光的注意事項：\n1、摩爾曼斯克的冬天溫度在零下20~30 度之間，但俄羅斯室內的暖氣通常都非常足，基本只穿一件單衣就夠了，所以衣服不要穿太多層，但每件衣服的保暖性能要好。\n\
    2、雖然摩爾曼斯克在極光帶上，但看極光仍然需要帶點運氣，為了增加看到極光的機會，建議在摩爾曼斯克至少停留二至三天。       (鄭子宏俄羅斯也能追極光)"
