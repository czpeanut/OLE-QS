  type: single
  page: 1
  stem: 二次大戰削弱了西方列強的殖民統治勢力，動搖帝國主義的殖民體系，同時也使殖民地國家的人民經歷各式苦難，逐漸增強民族獨立意識。因而，戰後亞、非地區的許多殖民地國家先後獲得獨立。有關這些新興國家的說明何者正確？
  options:
  - label: A
    content: 他們強調帝國主義、法西斯主義
  - label: B
    content: 他們多半依附美國或蘇聯
  - label: C
    content: 獨立之後多半政治、經濟穩定
  - label: D
    content: 這些新獨立國家即為第三世界國家。
