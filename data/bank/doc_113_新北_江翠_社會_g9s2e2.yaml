  group_stem: "※本文改寫自DQ 地球圖輯隊，《30 年前，那一場改變歐洲的野餐》，請回答第12~13 題：\n    1989 年8 月19 日，代表著自由西歐的奧地利和位於蘇聯鐵幕之下的匈牙利邊界舉辦了一場讓兩地民眾交流的野餐會，位於奧地利的聖馬加雷騰和匈牙利的索普隆科西達小鎮將擋在彼此之間的木製圍籬打開3\
    \ 個小時，象徵支持一個沒有隔閡的歐洲。\n    很快的，人們發現這場被稱為「泛歐野餐」的活動充滿了政治性和象徵性。透過西德人在背後暗中幫忙、匈牙利邊境警衛選擇假裝看不到有人逃亡而不開槍；短短3\
    \ 個小時內，有超過600 名東德人以野餐名義借道匈牙利逃往奧地利──逃離蘇聯鐵幕的監控和東德不穩的經濟。最終實在是抵擋不住逃亡的人潮，1989 年9月11\
    \ 日，奧匈邊界正式開放；同年11 月9 日，分隔東西柏林的柏林圍牆也正式被推倒，隔年東西德統一。"
