  type: single
  page: 5
  stem: 1920 年代台灣民眾採用請願的方式參與政治抗爭活動，這種人民權利行使與下列何者最相似？
  options:
  - label: A
    content: 戒嚴時期批評政府的報紙被停刊
  - label: B
    content: 監護宣告者進行公職人員投票
  - label: C
    content: 男性員工也可以申請育嬰假
  - label: D
    content: 接受國民義務教育。
  group_stem: "1920 年代臺灣民眾積極參與政治抗爭活動，其中以在日臺灣留學生組成的「新民會」等發起前後 15 次的「臺灣議會設置請願運動」為著。何以民眾會採用請願方式?因為統治者不願將日本本土的行政救濟制度施行於臺灣，人民無從透過行政訴訟對抗政府,達成改革訴求，故選擇體制內許可、效力較弱的請願權。在第3\
    \ 次請願運動期間，參與民眾在臺倡議成立「臺灣議會期成同盟會」，卻被警察以違反《治安警察法》禁止此類結社為由制止。參與者不服警察禁令又投訴無門，全島更有百餘位遭到逮捕起訴。但一審法院判決被告全數無罪，導致檢察官不服上訴，直至二審，才改判徒刑或罰金。\n\
    \    經歷此事件，論者認為總督府法院對檢方起訴內容不會照單全收，仍有依法審判空間，反而激起當時臺灣民眾的政治參與熱潮。請問              \
    \                           (摘自114 年學測社會科題組)"
