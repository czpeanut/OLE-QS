- id: doc_113_台中_四育_社會_地理_g9s1e3_s2_39
  section: 2
  number: 39
  type: single
  page: 5
  stem: 關於火山爆發與地表溫度的關聯下列敘述何者正確？
  options:
  - label: A
    content: 若火山爆發時，沒有將二氧化硫氣體噴入平流層中，也可以使地表溫度下降
  - label: B
    content: 氣體溶膠只會反射輻射，而不會吸收輻射，進而導致溫度下降
  - label: C
    content: 小粒徑的溶膠較容易反射太陽輻射，且停滯空中時間較久
  - label: D
    content: 近年來地表溫度提高的主因是超級火山噴發使氣體溶膠漂浮在平流層
  group_stem: '西元1991 年，菲律賓皮納圖博火山噴發，直接導致了北半球平均地表溫度下降了0.5 度，甚至直到1994 年才恢復了上升的趨勢。事實上，根據氣候學家的研究，超級火山的噴發足以產生改變全球氣候的重大影響，甚至能夠直接導致地球進入溫度極低的冰河時期。火山爆發對氣候的影響主要取決於停留於平流層的懸浮微粒含量。在火山爆發時，會將許多二氧化硫氣體噴入平流層（距地面10～55
    公里的高空）中，該化合物與水結合便會形成氣體溶膠，氣膠是指懸浮於氣體介質中形成的分散體系，懸浮粒子大小多在0.01-10 微米之間，而這些氣體溶膠在平流層中會反射來自太陽的輻射，使地表冷卻；亦會吸收由地表反射的長波長輻射，加劇溫室效應。然而小粒徑的氣體溶膠更容易反射陽光，而大粒徑的則容易吸收熱量。所幸，隨著時間推進，大粒徑的氣體溶膠為例將會受重力而沉降地表，留下小粒徑的氣體溶膠繼續反射陽光，而這些微粒有的甚至能停留在平流曾長達數年，影響深遠。


    然而，若想逆轉溫室效應，就必須要有數倍於皮納圖博火山噴發規模的火山運動發生，如此巨大火山噴發，無疑會對人類社會帶來可怕的災害。因此，便有科學家提出：利用人工方式投放二氧化硫溶液至平流層中，模擬火山噴發的影響，形成人造「火山噴發」，以控制溫室效應。這樣的方法在技術層面上具有一定的可行性，且人造火山噴發的方式也較其他控制溫室效應的二氧化碳減排策略來的成本低廉。


    即便如此，仍有不少人持反對意見。首先，經由氣候模擬研究，若將二氧化硫大量排入大氣層中，將會造成大量酸雨，而首當其衝的便是海洋生態，海水將會酸化，大量海洋中的生產者將會面臨生存危機。再者，雖然硫酸鹽氣體溶膠能夠有效減少太陽輻射到達地表，已達降溫效果，但也減少了地氣層中的溫度差，反而會造成降雨減少，導致大規模的乾旱。最後，人造火山噴發的方式只不過是治標不治本，除了可以使地球降溫，並不能解決其他二氧化碳排放所造成的環境傷害，過度依賴這種方法反而會導致更嚴重的環境問題。

    －林子耕 《地球工程（3）人造「火山噴發」－幫地球撐陽傘降溫》'
