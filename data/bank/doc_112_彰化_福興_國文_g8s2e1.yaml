  group_stem: '春的消息多半是由杜鵑花首先傳來,而春的燦爛也多半是由杜鵑花擔當的,不論是杜鵑花城還是杜鵑花山,花開才是春,花開便是春。尤其是那座聞名中外的陽明山,幾乎已經成為杜鵑花的天下,不但是滿山滿野,而且是滿溝滿谷,甚至連大小路徑也不例外。

    山上的杜鵑花,很像是一個同一血統、同一姻緣的類族,大家一起聚居、一起生活、一起成長。更重要的是,大家也幾乎是一起孕苞、一起綻放、一起燦爛。山的當局每年都替這座花山宣布一個花季,而杜鵑花們卻不管你花季不花季的,想開就開,想放就放。像今年的這一季春,沒等到花季開始,耐不住寂寞的杜鵑花族們,便大模大樣地燦爛起來了,把一大片山野繽紛成一片花海,惹得四面八方的愛花人不得不成群結隊、絡繹不絕的往那裡跑。

    聽說陽明山上的人群洶湧得幾乎要無處容身了,而我卻悠然地坐在院子裡猛賞我那唯一的一棵杜鵑。花分六幹,枝分十七,六十幾個花朵在上面爭先恐後地燦爛著,自成一幅美景。雖然僅僅是這麼一棵,然而,在我的感覺裡,那是一大叢族,那是一片花田,那是一個陽明山,甚至也是一個花季。

    (張騰蛟花豔)'
