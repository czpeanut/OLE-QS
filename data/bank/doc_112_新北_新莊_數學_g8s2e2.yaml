    labeled_by: ai
- id: doc_112_新北_新莊_數學_g8s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: '如右圖，$\triangle ABC$ 中，小妍與小翊兩人想在 $\triangle ABC$ 外部找到一點 $D$，使得 $\triangle
    ABC$ 與 $\triangle DBC$ 全等，其尺規作圖的痕跡如下。則下列敘述何者正確？


    | 小妍 | 小翊 |

    | :--- | :--- |

    | ①分別以 $B$、$C$ 為頂點，$\overline{BC}$ 為一邊，在 $\overline{BC}$ 下方，作 $\angle 1 = \angle
    ABC$、$\angle 2 = \angle ACB$。<br>② $\angle 1$ 和 $\angle 2$ 兩角的另一邊交於 $D$ 點，則 $D$
    點即為所求。 | 分別以 $B$、$C$ 為圓心，$\overline{BC}$ 為半徑畫弧，兩弧交於 $D$ 點，則 $D$ 點即為所求。 |'
  options:
  - label: A
    content: 兩人皆正確，小妍是根據 AAA 全等性質，小翊是根據 SSS 全等性質
  - label: B
    content: 兩人皆正確，小妍是根據 ASA 全等性質，小翊是根據 SSS 全等性質
  - label: C
    content: 只有小翊正確根據 SSS 全等性質
  - label: D
    content: 只有小妍正確是根據 ASA 全等性質
