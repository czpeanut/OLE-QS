- id: doc_113_新北_江翠_自然_g9s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 關於礦物的特性，下列敍述何者錯誤？
  options:
  - label: A
    content: 寶石通常是指硬度大、色澤美且稀少的礦物
  - label: B
    content: 水晶就是石英，因色澤美麗，常被做成裝飾品
  - label: C
    content: 可用鑽石刻劃或小蘇打水來分辨方解石與石英
  - label: D
    content: 黃鐵礦的金黃色光澤常讓人誤以為是黃金
- id: doc_113_新北_江翠_自然_g9s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 在甲、乙兩地中，岩層皆未發生倒轉與變動，其中甲地三個岩層中分別含有Ⅰ：三葉蟲化石、Ⅱ：恐龍化石、Ⅲ：劍齒虎化石；乙地兩個岩層中分別含有Ⅳ：恐龍化石、Ⅴ：三葉蟲化石，請問下列敍述何者錯誤？
  options:
  - label: A
    content: 甲地中的Ⅱ岩層，應與乙地的Ⅳ岩層地質年代相同
  - label: B
    content: 三葉蟲化石比恐龍化石早形成
  - label: C
    content: 最老的地層為I、V，且三葉蟲化石代表中生代海洋環境
  - label: D
    content: 甲地未曾出現新生代化石
