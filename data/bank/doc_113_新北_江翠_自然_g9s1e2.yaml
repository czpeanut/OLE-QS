- id: doc_113_新北_江翠_自然_g9s1e2_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 有關人造衛星的敘述，何者正確？
  options:
  - label: A
    content: 人造衛星架在火箭上，火箭噴出的氣體施力於空氣，空氣給予火箭反作用力，將火箭送至地球高空
  - label: B
    content: 火箭將人造衛星送至地球高空，因為高空阻力小，考慮地球的曲率，只要給予少許水平速度，它就能持續繞地球運動
  - label: C
    content: 人造衛星受到地球的重力吸引，不斷的改變運動方向，繞著地球做等加速度圓周運動
  - label: D
    content: 人造衛星受到的地球重力即是環繞地球的向心力
- id: doc_113_新北_江翠_自然_g9s1e2_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 某一撐竿跳選手正在練習，右圖為他在練習時的畫面，請問下列敘述何者正確？
  options:
  - label: A
    content: 在上升過程中具有彈性的竿子對人作正功
  - label: B
    content: 在下落過程中，重力對人作負功
  - label: C
