- id: doc_111_桃園_同德_社會_地理_g7s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: '婉予在某個島嶼進行實察的時候，訪問到一位當地的文史工作者

    ，得到以下的內容：「這個島嶼位於台灣的東南方，也是達悟族

    的傳統生活領域，比其他離島的開發要少很多，保留了很多原始

    的生活型態。但是近年來，有越來越多的都市人和商店進駐，觀

    光客也越來越多，帶來了許多商機和汙染。也因為早期國民政府

    強制執行的華語政策，使得現在的孩子逐漸不太會說自己的母語

    (達悟族語)，也使得我們的傳統文化逐漸消失中…」請根據上述

    的訪談內容，推測婉予去的島嶼應該是下列何者？'
  options:
  - label: A
    content: 澎湖群島
  - label: B
    content: 琉球嶼
  - label: C
    content: 馬祖列嶼
  - label: D
    content: 蘭嶼
