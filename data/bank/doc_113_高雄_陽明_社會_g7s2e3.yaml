  group_stem: '護弱勢滿足營養 安得烈慈善協會推客製化食物箱

    安得烈慈善協會2017 年起推客製化食物箱，光嬰幼兒奶粉就有40 多種品項，對80 歲以上牙口不好長輩有松柏食物箱，患三高受助者也有低糖飲食的食物箱。執行長羅紹和說，食物箱無法完全滿足受助者需求，至少能減輕負擔，也能引導受助家庭飲食盡量均衡。

    安得烈慈善協會是全台唯一做客製化服務的食物銀行，目前扶助對象達6024 人，受助對象0 歲到100 歲都有，每個月送給扶助對象一個食物箱，這些愛心物資有70%至80%是採購而來，20%至30%是捐助的物資，平均1
    個月募款要1 千萬才能維持運作。羅紹和說，推客製化食物箱出發點是讓受助者拿到愛心物資能充分運用，困難、需求能被滿足，客製化在需求調查、採購及配送上雖然增加一些難度及挑戰，卻能真正將資源用在對的地方、對的人，過程辛苦一點，但看到受助者需求能被滿足、能吃得均衡，一切努力很值得。

    ＊新聞來源:2025-01-13 聯合報 ／ 記者王慧瑛'
