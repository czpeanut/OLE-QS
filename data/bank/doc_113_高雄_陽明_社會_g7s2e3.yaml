  group_stem: 'e 卡「飽」護 安心餐食數位票卡愛無界線

    為照顧經濟弱勢家庭孩子休假日及寒暑假的用餐，教育局自2019 年起推動安心餐食券計畫，針對國中、小及完全中學的低收入戶學童發放紙本餐券。


    隔年受到疫情影響，各校相繼階段性停課，一位觀音國小老師回憶說：「我們學校有近一百多位學生需要領安心餐食券，當時動員全校行政人員幫忙填寫日期、蓋章和數餐券，還要通知學生和家長到校領取，那時候真是一片混亂。」紙本餐券層層流程及需要人工兌領，因此觸發數位票卡推動契機。秉持「不讓孩子餓肚子」的初衷，教育局與一卡通公司於2022
    年3 月起合作，率全國之先發行「安心餐食數位票卡」 ，邀請7-ELEVEN 、全家、OK mart、Hi-Life 萊爾富等4 大超商及正忠排骨飯、太師傅加入行列，方便弱勢學生持數位票卡就近兌餐。


    轉型數位票卡後，核兌流程電子化、兌領無紙化，讓學生即使遇上學校臨時停課的突發狀況，也不用擔心無法即時領餐。老師也可進入系統後臺，根據各校行事曆彈性設定兌領日期，孩子只需攜帶已登錄的數位票卡至超商或店家，不受時間限制均可兌換餐點，校方也能依據系統平臺提供的數據，主動關心兌餐情況並即時提供協助。同時，一年還能省下逾600
    萬張紙，為守護地球盡一份力。


    安心餐食數位票卡可綁定自己喜愛的一卡通，卡片上無任何註記，去標籤化讓孩子更可安心做選擇。學生小雨（化名）說：「我比較喜歡票卡，因為不容易讓別人發現我沒付錢就兌換餐，讓我比較自在一點。」另一位經濟弱勢的單親媽媽表示，數位票卡讓她們家的寒暑假變得不一樣，可以跟孩子一起去超商逛逛，一起挑選便當，感覺很輕鬆。


    為讓餐食補助造福更多弱勢孩子，每餐補助金額為65 元，難能可貴的是，合作超商及便當業者秉持企業社會責任，主動加碼做愛心，提高可兌領額度，7-ELEVEN73
    元、全家74 元、OK mart74 元、Hi-Life萊爾富85 元、正忠排骨飯70 元及太師傅75 元，讓學生感受更為豐富的社會溫暖以及開心又吃飽的餐食。

    資料來源:高雄畫刊 2024/04'
