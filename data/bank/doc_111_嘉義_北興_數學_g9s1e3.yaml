- id: doc_111_嘉義_北興_數學_g9s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: '右圖的 $\triangle ABC$ 中，$\overline{AB}>\overline{AC}>\overline{BC}$，且 D 為 $\overline{BC}$
    上一點。今打算在 $\overline{AB}$ 上找一點 P，在 $\overline{AC}$ 上找一點 Q，使得 $\triangle APQ$ 與
    $\triangle PDQ$ 全等，以下是皓源、傅語兩人的作法：

    (皓源)連接 $\overline{AD}$，作 $\overline{AD}$ 的中垂線分別交 $\overline{AB}$、$\overline{AC}$
    於 P點、Q點，則 P、Q 兩點即為所求。

    (傅語)過 D 作與 $\overline{AC}$ 平行的直線交 $\overline{AB}$ 於 P 點，過 D 作與 $\overline{AB}$
    平行的直線交 $\overline{AC}$ 於 Q點，則 P、Q 兩點即為所求。

    對於兩人的作法，下列判斷何者正確？'
  options:
  - label: A
    content: 皓源正確，傅語錯誤
  - label: B
    content: 皓源錯誤，傅語正確
  - label: C
    content: 兩人皆正確
