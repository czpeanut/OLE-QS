  type: single
  page: 2
  stem: '如右圖，銳角三角形 ABC 中，D 點在 $\overline{BC}$ 上，$\angle B=\angle BAD=\angle CAD$。

    今欲在 $\overline{AD}$ 上找一點 P，使得 $\angle APC=\angle ADB$，以下是銘安、偉辰兩人的作法：

    (銘安) 作 $\overline{AC}$ 的中垂線交 $\overline{AD}$ 於 P 點，則 P 即為所求。

    (偉辰) 以 C 為圓心，$\overline{CD}$ 長為半徑畫弧，交 $\overline{AD}$ 於異於 D 點的一點 P，則 P 即為所求。

    對於銘安、偉辰兩人的作法，下列判斷何者正確？'
  options:
  - label: A
    content: 銘安正確，偉辰錯誤
  - label: B
    content: 銘安錯誤，偉辰正確
  - label: C
    content: 兩人皆正確
  - label: D
    content: 兩人皆錯誤
