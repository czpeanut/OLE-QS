- id: doc_113_新北_江翠_自然_g7s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 地球上最深的海溝馬里亞納海溝居住著深海生物角高體金眼鯛，牠們最常棲息的地方是水深 500～2,000 公尺處。深海雖然仍溶有氧氣，但由於陽光無法照射到海底，導致環境漆黑、溫度接近攝氏零度，且水壓很大，能生存的生物種類不多，因此角高體金眼鯛主要的食物為從海洋上層所掉落的生物碎屑。有關角高體金眼鯛和海底環境的敘述，何者錯誤？【1-1】
