  - label: A
    content: 深海雖無光、壓力大，但仍有生物生存
  - label: B
    content: 角高體金眼鯛食物主要為海洋深處的綠色大型藻類
  - label: C
    content: 角高體金眼鯛生存的環境中，較缺少養分這種資源
  - label: D
    content: 深海魚類多已發展出特殊構造，能適應高壓低溫的海底環境
