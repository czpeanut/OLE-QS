- id: doc_113_新北_中平_自然_g8s2e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 請問硝酸銨的分子量是多少？
  options:
  - label: A
    content: '60'
  - label: B
    content: '70'
  - label: C
    content: '80'
  - label: D
    content: '90'
  group_stem: '尿素可作為植物的肥料，施加在土壤中會緩慢轉化成碳酸銨，接著被土壤膠體吸附，進而被農作物吸收，此過程約需要 67 天。在工業上會使用氨與二氧化碳反應製得尿素和水，尿素的化學式為
    $(NH_{2})_{2}CO$，分子量 60。

    製造的化學反應式：$NH_{3} + CO_{2} \rightarrow (NH_{2})_{2}CO + H_{2}O$。


    硝酸銨也是一種含氮的化合物，可以應用於農業肥料。硝酸銨比尿素的優勢在於它更穩定，不會迅速向大氣中損失氮。不過硝酸銨是一種危險的物質，因為它具有高度爆炸性，因此其製造和儲存的規定非常嚴格。

    製造的化學反應式：$HNO_{3} + NH_{3} \rightarrow NH_{4}NO_{3}$。'
  answer:
  - C
  answer_source: answer_key_vlm
