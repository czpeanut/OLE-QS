- id: doc_112_桃園_文昌_數學_g9s1e1_s1_24
  section: 1
  number: 24
  type: single
  page: 4
  stem: 若大呆、二花、三寶三人每周運動所消耗的熱量均相等，則大呆、二花、三寶三人的體重比為何？
  options:
  - label: A
    content: 44：40：55
  - label: B
    content: 10：11：8
  - label: C
    content: 8：11：10
  - label: D
    content: 10：7：8
  group_stem: "運動消耗的熱量如何計算？「代謝當量」告訴你\n    如果想知道在從事不同的運動時，會消耗多少熱量？那麼你得先有三個數字才行，一是運動者本身的體重（以kg\
    \ 為單位），二是運動所持續的時間（以小時為單位），以上這兩個數字還容易理解，至於第三個數字，則是聽起來較為學術的「MET」。\n     MET 的全名叫做代謝當量（Metabolic\
    \ Equivalent of Task, MET），可以理解為是以靜息代謝量（大約等於是靜坐不動時的代謝量）為基準，來和特定運動狀態下的代謝量做比較所得出的比值，例如慢走(4\
    \ 公里/時)的METs 為3.5，指的就是每小時慢走(4 公里/時)所能夠消耗的能量比起靜坐不動而言，高了3.5 倍的意思。\n為了知道各種運動所消耗的熱量，可藉由各種運動的代謝當量(METs)來估算，其公式如下：\n\
    \     消耗的熱量(大卡)＝代謝當量(METs)×體重(公斤)×運動時間(小時)\n已知大呆、二花、三寶三人均維持運動的好習慣，且大呆每周打羽毛球2 次，每次3\
    \ 小時，二花每周健走(6.0 公里/時)  6 次，每次1 小時，三寶每周騎腳踏車(10 公里/時)  2 次，每次3 小時，其中各種運動的代謝當量(METs)，如下表所示。\n\
    \n| 運動項目 | 代謝當量(METs) |\n| :--- | :--- |\n| 慢走(4 公里/時) | 3.5 |\n| 健走(6.0 公里/時)\
    \ | 5.5 |\n| 慢跑(8 公里/時) | 8.2 |\n| 羽毛球(每小時) | 5 |\n| 騎腳踏車(10 公里/時) | 4 |\n\n註1：中等費力身體活動(3-6METs)：持續從事10\
    \ 分鐘以上還能舒服的對話，但無法唱歌。這類活動會讓人覺得有點累，呼吸及心跳比平常快一些，也會流一些汗。\n註2：費力身體活動(>6METs)：持續從事10\
    \ 分鐘以上時，將無法邊活動邊跟人輕鬆說話。這類活動會讓身體感覺很累，呼吸及心跳比平常快很多，也會流很多汗。\n註3：1 分鐘的費力身體活動 = 2 分鐘的中度身體活動。"
