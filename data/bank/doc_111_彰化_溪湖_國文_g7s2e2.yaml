  group_stem: "〈□□□□□〉\n  每次戰爭過後／總得有人處理善後／畢竟事物是不會自己收拾自己的。\n  總得有人把瓦礫鏟到路邊／好讓滿載屍體的貨車順利通過。／總得有人跋涉過泥沼和灰燼、穿過沙發的彈簧、玻璃碎片、血跡斑斑的破布。\n\
