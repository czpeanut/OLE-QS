    \  欖蠵龜（學名：Lepidochelys olivacea）是海龜的一種，又稱太平洋欖蠵龜、麗龜、橄龜、姬賴利海龜。最大特徵為灰黑色心型背甲，外觀像一顆大橄欖，成龜體長達62\
    \ 到72公分，體重約45 公斤，是世界上現存七種海龜中體型最小的。欖蠵龜被認為是數量較多的海龜，估計全球每年有80萬隻欖蠵龜媽媽築巢產卵。牠們分布於南大西洋、太平洋和印度洋的熱帶地區。然而，即使欖蠵龜是海龜中的相對多數，牠們也在國際自然保護聯盟（IUCN）的紅色名錄中，被列為易危物種。\n\
    \  印度東部的奧里薩邦（Odisha），因季節性大量欖蠵龜產卵聞名，每年都有規模不等的欖蠵龜群體在孟加拉灣沿岸的海域築巢產卵。今年相當特別，上萬隻海龜七年來首次於白晝上岸築巢，因為時間與今年疫情相近，許多報導將兩件事建立因果關係，認為這和現在印度實施的全城封鎖有關。\n\
    \  當地有政府官員以及保育人士已經作出澄清，說明無法證實關聯性，但可以確定因為人潮大減，海龜蛋因人為損毀的機率理應大幅下降，對保育來說都是正面影響。此外，原本每年都有促進觀光的「海龜季」活動也取消了，這也讓保育工作更可以順利執行，包括清理海灘以及海龜巢的數量紀錄。\n\
    \  「烏龜築巢的環境條件非常嚴格，牠們是應對某些環境變因，例如：潮汐條件，風向，月相而築巢。」野生動物保育機構（Wildlife Institute of\
    \ India）的研究員 Bivash Pandav 表示。當海龜寶寶孵化後，便會朝著光亮的水面爬去，回到大海。而在爬行的過程中，海龜會靠著身體記憶走過的路（地磁資料，即地球磁場與重力），長大後才能憑藉記憶回到原地，繁衍後代。\n\
    海龜真正的好消息，掌握在您我手中\n  不可否認的，無論原因為何，這種生態奇景都是大家所樂見。如果真的要幫助海龜，就如同幫助其他大自然的萬物生靈一樣，我們務必得反思人類與自然和平共處的生活模式。全球有七種海龜，當中玳帽及肯氏龜已陷入極危，綠蠵龜被評為瀕危，棱皮龜、赤蠵龜及欖蠵龜同屬易危，只有平背龜因數據不足，無法評斷。然而全球海龜同樣面臨塑膠污染、氣候變遷、棲地消失、被誤捕等危機十面埋伏，需您我關注。\n\
    \  全球每年6%漁網、9%捕魚陷阱及29%「延繩釣具」（longlines）因丟棄、遺失等理由，成為殘留海洋的汙染物，並在世界各地留下血腥的教訓：2018\
    \ 年，墨西哥海域發生約300 隻欖蠵龜被「鬼網」纏身而集體死亡的不幸事件。\n     引自https://www.greenpeace.org/taiwan/update/"
