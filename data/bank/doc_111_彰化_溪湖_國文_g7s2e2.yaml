- id: doc_111_彰化_溪湖_國文_g7s2e2_s2_12
  section: 2
  number: 12
  type: single
  page: 1
  stem: 石虎是我們的龍貓的作者在提到「低海拔山區」時說：「學童在成長過程中，對自然環境保護的重要，難以產生深層的認同。四、五年級一輩對這一區域鄉野的緬懷，更難以影響下一代，建立共同的信念和價值。」這段話的意思為何？
  options:
  - label: A
    content: 六、七十歲的民眾雖然經常進行淺山活動，但因不懂使用網路資訊，而無法影響兒童
  - label: B
    content: 學童從學校獲得知識，但是缺乏家長的帶領，難以對低海拔山區產生認同
  - label: C
    content: 由於四、五年級的國小課程缺乏低海拔的環境教育，因此學童無法產生情感認同
  - label: D
    content: 學童成長過程無法產生對環境保護的認同，長輩又難以影響下一代，因此對低海拔山區保育工作不夠落實
  lesson_raw:
    title: 石虎是我們的龍貓
    basis: 題目引用課文劉克襄《石虎是我們的龍貓》
  tags:
    textbook: 七下 第六課 石虎是我們的龍貓
    labeled_by: ai
