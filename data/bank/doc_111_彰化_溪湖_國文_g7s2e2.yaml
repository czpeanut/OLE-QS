- id: doc_111_彰化_溪湖_國文_g7s2e2_s2_27
  section: 2
  number: 27
  type: single
  page: 3
  stem: 根據上文，下列說明何者有誤？
  options:
  - label: A
    content: 王羲之的快雪時晴帖、王珣的伯遠帖、王獻之的中秋帖，合稱「三希」
  - label: B
    content: 王羲之去世後書法作品才聞名於世，尤其唐太宗將其作品蘭亭序帖視若珍寶
  - label: C
    content: 王羲之學習書法堅持有恆，且形神兼備、剛柔相濟、獨具風格
  - label: D
    content: 王羲之書法精湛，使中國書法邁入一個更高更廣的新領域，且對全人類文化有了重大的貢獻
  group_stem: "〈王羲之與中國書法〉\n  王羲之在中國書法上的地位，無人可與之相比，大致說起來，他是把文字從應用提升到藝術欣賞的第一人。在他之前，文字的主要功用是記事，王羲之書法精湛，遂使中國書法從此邁入一個更高更廣的新領域，且對全人類文化有了重大的貢獻。\n\
    \  史書上說他「臨池學書，池水盡墨」，又說他在睡覺中還在作夢寫字，一寫寫到太座的身上，王夫人曰：「人各有『體』。」他便因之而大悟，書法益進。他的書法在當時便有高名，所以又有書扇增值的故事流傳下來：一位老婦人賣扇不售，王羲之便為她在扇上大筆揮灑一番，告訴她持往市場，就說王右軍所書（他官至右軍將軍），果然一下子就被搶購罄1\
    \ 盡，可知其書法價值的高貴。\n  他留下來的書法名蹟，首推快雪時晴帖，這帖法書2現藏臺北 故宮博物院，和王珣的伯遠帖、王獻之的中秋帖合稱「三希」，因為清高宗\
    \ 乾隆得到這三件晉代法書墨蹟，自認是稀世珍寶，所以特在養心殿溫室中虔誠供養，而且鄭重其事地名這耳室3 為「三希堂」。\n  王羲之的字被稱為鐵畫銀鉤4，形容它形神兼備、剛柔相濟的特色，在快雪時晴帖上可以略窺其風采於一二，尤其膾炙人口的是蘭亭序帖。可惜後來唐太宗\
    \ 李世民愛王羲之的字入骨，不但盡收天下王書據為己有，而且臨死時，還把蘭亭殉葬，這真是所謂的「愛之適足以害之」。幸虧在未殉葬之前，唐太宗曾搨寫了許多份賞賜給親信大臣，於是有拓片傳諸世間，我們還可以從這些傳世的遺跡上，想見當日王逸少的逸筆神采！\n\
    \           節錄自李霖燦 中國美術史稿\n註：1.罄：盡、用完。2.法書：名家的書法範本，也用以稱美別人的書法。3.耳室：位於正屋兩側較小的房間，恰如人臉兩側的耳朵，因而得名。4.鐵畫銀鉤：形容筆畫如鐵般的剛勁，如銀般的柔媚。"
