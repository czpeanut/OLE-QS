  group_stem: '張媽媽非常關心孩童的教養方式，她發現有親子共學團體，是由一群關心孩童的媽媽組成，主要關注政府對於兒童權益的相關政策，且常參與社會運動表達對法規的觀點。<u>該團體在各區域設有分會，辦理親子共學活動、兒童權益的討論會等，方便各地家長參加。</u>

