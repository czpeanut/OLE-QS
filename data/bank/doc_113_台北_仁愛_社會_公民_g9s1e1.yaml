    10 倍，並譴責藥廠的貪婪，呼籲大家關注不合理藥價的議題。附圖為美國胰島素歷年來的價格變化。假設美國國會過法令要求胰島素的價格降低為原價的十分之一，則廠商願意生產的胰島素數量會產生何種變化？（★愈多表示數量愈多）
