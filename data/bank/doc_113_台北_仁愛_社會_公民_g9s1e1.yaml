  type: single
  page: 2
  stem: 康明公司開發了甲乙兩款吸塵器，假設每個吸塵器的生產成本固定且公司隨時都有足夠庫存可以供應市場的需求，請根據員工們提供的資訊判斷，康明公司應採用誰提供的策略會最為有利？
  options:
  - label: A
    content: 米熙：最近甲吸塵器的價格上漲，應該多生產甲吸塵器，這樣可以增加甲吸塵器的銷貨收入。
  - label: B
    content: 文彥：最近甲吸塵器的價格下跌，應該多生產甲吸塵器，這樣可以增加甲吸塵器的銷貨收入。
  - label: C
    content: 梓琳：最近乙吸塵器的價格上漲，應該多生產甲吸塵器，這樣可以增加甲吸塵器的銷貨收入。
  - label: D
    content: 銘毅：最近乙吸塵器的價格下跌，應該多生產乙吸塵器，這樣可以增加乙吸塵器的銷貨收入。
