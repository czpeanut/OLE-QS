    content: 為了支持偶像團體，搶購他們代言的商品。
  group_stem: '(四)2023 年3 月我國出現嚴重蛋荒，為減緩缺蛋影響，行政會農業部宣布實施雞蛋專案進口計畫，每週將進口五百萬顆雞蛋，並制定相關政策補貼進口蛋價差額，以解決市場缺蛋及蛋價高昂的問題。後來因進口雞蛋爭議不斷，傳出效期疑慮、
    改標等爭議，引發食安風暴，導致出現搶購國產雞蛋潮，本土蛋的需求量增加，但產蛋率仍未能提升。公會表示蛋價將繼續調漲。主因為近期進口蛋爭議，讓民眾對於進口蛋充滿疑慮，加上越來越多地方政府限制學校營養午餐禁用液蛋，每天約多出
    2000 箱殼蛋的需求。在進口蛋沒人買，以及國內蛋雞產蛋率不足的情況下，用蛋缺口可能越來越大，年底前當然會繼續缺蛋，因此只能漲價， 之後不排除還會繼續漲，消息一出，國產蛋架一掃而空。(註:「液蛋」屬於食藥署主管的加工食品，需經原料蛋選別、清洗、打蛋去殼、過濾或殺菌、充填及入庫，如液蛋白、
    液蛋黃、液全蛋及混合製品。)請問:'
