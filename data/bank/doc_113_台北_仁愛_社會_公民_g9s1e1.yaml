- id: doc_113_台北_仁愛_社會_公民_g9s1e1_s2_13
  section: 2
  number: 13
  type: single
  page: 1
  stem: 沙發衝浪（couchsurfing）是一種新興的互助旅遊型態。在網際網路的幫助下，藉由屋主免費提供陌生旅客住宿的空間，讓不同地區的民眾互相接觸，增加彼此了解，發揮互助分享精神，並建立對陌生人的信任感。但對沒有嘗試過的人而言，難免會擔心財物遭竊，因此民間也發展出多種認證機制，提供主客雙方進行辨識，增進彼此的信賴感。這樣的旅遊型態在年輕族群中得到廣大共鳴，因為對經濟較為拮据的他們而言，能節省旅費正是它最大魅力所在。」下列哪一項吸引旅客外出旅遊的誘因，與文中沙發衝浪對年輕族群的最大魅力，最能用同一項「影響消費行為的因素」說明？
  options:
  - label: A
    content: 領到年終獎金，計畫帶家人一起出國遊玩
  - label: B
    content: 為節省開銷，至各賣場比較新鮮牛乳售價
  - label: C
    content: 颱風即將侵襲臺灣，提前至超市搶購蔬菜
  - label: D
    content: 為了支持偶像團體，購買他們代言的商品。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 公民
      code: 1-3
      title: 影響消費者的因素
      chapter: 第1章 選擇與消費
