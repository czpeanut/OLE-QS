  type: single
  page: 1
  stem: 人稱木村阿公的日本蘋果農夫木村秋則先生，在日本青森縣種蘋果。在附近蘋果農都使用慣行農法的環境下，木村 卻以無肥料無農藥栽培出廣受好評的蘋果，將近 600
    株蘋果樹的產量現在已是網路開賣十分鐘就被訂購一空。木村阿公因為妻子對農藥過敏，以無肥料無農藥栽培出廣受好評的蘋果。請問:根據上述木村阿公生產的選擇是考量下列何種因素？
