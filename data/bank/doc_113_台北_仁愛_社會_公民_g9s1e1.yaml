  type: single
  page: 1
  stem: 在一次演講中，講對臺下的學生說：「時間很貴，過去的講者會讓你覺得在浪費時間，你只好去做對你來說比較有價 值的事件，例如：滑手機或睡覺。」請問：下列何者最符合講者這段話的意涵？
  options:
  - label: A
    content: 學生選擇聽演講的機會本是滑手機加上睡覺得到的快樂
  - label: B
    content: 稀少性是指資源總數的多寡，因此聽演講的時間具稀少性
  - label: C
    content: 學生想做的事很多，但時間是有限的，因此聽演講的時間具稀少性
  - label: D
    content: 過去的講者讓學生認為聽演講的機會成本最低，因此選擇不聽演講。
