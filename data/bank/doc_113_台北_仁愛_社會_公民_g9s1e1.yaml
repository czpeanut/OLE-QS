  section: 1
  number: 1
  type: single
  page: 1
  stem: 浩誠跟母親回到臺東老家參加豐年祭，同時也享受了新鮮空氣，而住在臺中的小燕卻需要花錢購買空氣清淨機。從經濟學的角度來看，下列敘述何者正確？
