  stem: '金芳工廠評估三種營運策略的收支情況，如附表所示。若僅考量利潤，該工廠的最佳選擇是「維持現狀」，且此選擇的機會成本是「增產乙產品」。根據上述內容判斷，表中「★」處的數值，最可能為下列何者？


