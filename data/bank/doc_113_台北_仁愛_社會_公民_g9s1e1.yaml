  stem: 臺灣的海運業近年出現不少傑出女性，任職於某海運公司的汪船長更是臺灣首位女船長，她主要負責長程航線，從三副、二副到大副，入行僅 6 年就當上船長，月薪
    26 萬元以上。這個新聞鼓舞了班上想當船長的同學，下列關於同學們的討論，何者敘述正確？
