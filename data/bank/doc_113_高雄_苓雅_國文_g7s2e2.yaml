    \  新北市政府所舉辦的「平溪天燈節」，今年也邁入第二十一個年頭，不論在傳統文化意義與觀光經濟效益上，天燈都有不可或缺的重要性與代表性。\n  有環保團體呼籲，不要再到平溪放天燈，以保護山林，別再製造擾人的垃圾，因為有些天燈甚至會落到河川內，對於棲地造成破壞。就算天燈的材質都是紙與木，可以自然被環境分解，但短期內來看，還是對於周邊居民有嚴重的影響。\n\
    \  如果把「天燈」這個要素因為保護環境之故而從平溪取消，恐怕平溪線鐵道都有可能因為漸漸減少的人潮而黯淡，不僅造成當地經濟效益的損失，連帶會影響國際觀光效益。\n\
    \  天燈，就好比平溪的命脈，它的重要性甚至被Discovery 評為「全世界最重要節慶」第二名（僅次於巴西嘉年華），CNN 也推薦為「世界上最值得參與的年度新鮮事」之一。\n\
    \  現在最重要的，是臺灣民眾自發性地減少，甚至不要再施放天燈，漸漸改變觀念，總有一天能讓施放天燈的垃圾愈來愈少。\n  下次來到平溪，不應該再以天燈為主，□看看當地特殊的鐵道文化、基隆河谷壺穴美景、十分瀑布的渾然天成、菁桐煤礦的興衰過往故事、十分老街的美食傳統、日據時期的老舊宿舍環境等，平溪還有許多值得旅人挖掘的好地方。\n\
    ──改寫自魯皓平〈放天燈是傳統，還是為山林製造更多垃圾？〉"
