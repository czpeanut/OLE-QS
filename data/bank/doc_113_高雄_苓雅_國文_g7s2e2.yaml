  options:
  - label: A
    content: 唐人科舉考試的形式
  - label: B
    content: 王維早年仕途與任官
  - label: C
    content: 王維詩歌創作的風格
  - label: D
    content: 唐代職業貴賤的比較
  group_stem: "據王勳成所考，王維 20 歲便考中進士，23 歲就出任他的第一個官職太樂丞。唐代進士是一種競爭異常劇烈的考試。每年的考生約二三千人，但及第者只有\
    \ 25 到 30 人左右，淘汰率是很高的。王維 20 歲考中進士也很傑出，非常年輕。唐史上沒有多少人如此年少即中第，因為中進士的一般年齡是 25 到 30\
    \ 歲左右，如張九齡是 25 歲，元結是 36 歲，韓愈和元稹也是 25 歲，杜牧 26 歲，韋莊則遲至 59 歲。\n  王維的第一個官位太樂丞也很不尋常。唐代太樂署是太常寺底下的幾個官署之一。它的長官叫太樂令，專「掌教樂人調合鐘律，以供邦國之祭祀、饗燕」。太樂令的副官即太樂丞，是個八品小官。王維這個官位，用現代話來說，大約便是「宮廷樂團副教練」。唐代士人對樂工、醫者和占卜者等技術官僚是輕視的，認為這些官是「濁官」，「汙濁」的官，跟士人所擔任的「清官」或「清流官」相對，有點類似現代「藍領」○1\
    \ 和「白領」的區別。\n※注釋：○1 藍領：從事勞力工作的僱員，與其相對之概念為「白領」。\n──節錄自賴瑞和《品味唐朝：唐人的文化、經濟和官場生活》"
