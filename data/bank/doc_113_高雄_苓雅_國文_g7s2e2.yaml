  group_stem: "如果要挑一樣臺灣最美的地貌，我認為是山。臺灣的山只有兩種顏色，一種是白，下雪；一種是綠，終年森林的蓊鬱。它沒有像高緯度國家的山，四季顏色分明，但仍有獨特的「氣味」，我印象最深的是在棲蘭山拍攝，飛機靠近山林，旋翼片攪動了空氣，把山裡的空氣往我們機艙裡送，才知道原來森林也有味道，是淡淡的檜木香，整個空氣是清爽帶著淡淡的甜味，我從來沒聞過這樣的味道。\n\
    \  高山遠離人群，但別以為這樣就逃得過人為的破壞。比如從桃園 復興鄉經新竹 尖石、五峰，臺中 和平再到南投 仁愛、嘉義 阿里山，這一整條帶狀中高海拔的山區，全是高山農業，不是果樹就是蔬菜農場及高山茶園。密密麻麻，看起來怵目驚心。\n\
    \  我來自公務員家庭，從小就聽大人說十大建設如何偉大，所以我一直以為，梨山上的果樹菜園是一種人定勝天的表現，不僅征服了自然，還讓老榮民有個安家立業之處。但其實高山農業所造成水土的破壞是難以恢復的。拍照之後，我開始不買高山蔬果，算是我對這塊土地能做的一點小事。\n\
    \  我也拍了很多山裡發生的災難畫面，而臺灣最常見的就是土石流。在九二一之後，我大規模拍攝了臺灣山林的變化，處處都是滑動的土石，蓊鬱的山林常常就中間滑掉了一大片，留下醜陋的土黃色。我原本認為，臺灣的山只有兩種顏色，一種是白雪的白，一種是常年的綠，現在多了第三種，是滿山遍野、殘破的土黃色，像是大地的傷口。\n\
    ──節錄自齊柏林《我的心，我的眼，看見臺灣》"
