  stem: '珠垠將《近體詩選》三首詩的格律做了整理，但有些地方寫錯了，下列哪一列完全正確？


    | | 王之渙〈登鸛雀樓〉 | 杜甫〈聞官軍收河南河北〉 | 杜牧〈過華清宮其一〉 |

    |---|---|---|---|

    | | 白日依山盡，<br>黃河入海流。<br>欲窮千里目，<br>更上一層樓。 | 劍外忽傳收薊北，初聞涕淚滿衣裳。<br>卻看妻子愁何在，漫卷詩書喜欲狂。<br>白日放歌須縱酒，青春作伴好還鄉。<br>即從巴峽穿巫峽，便下襄陽向洛陽。
    | 長安回望繡成堆，<br>山頂千門次第開。<br>一騎紅塵妃子笑，<br>無人知是荔枝來。 |

    | (A)字數／詩體 | 五言絕句 | 五言律詩 | 七言絕句 |

    | (B)平仄起 | 仄起 | 仄起 | 平起 |

    | (C)押韻字 | 盡、流、樓 | 北、裳、狂、鄉、陽 | 堆、開、來 |

    | (D)對仗 | 無對仗 | 有三組對仗 | 無對仗 |'
  options:
  - label: A
    content: 字數／詩體：五言絕句／五言律詩／七言絕句
  - label: B
    content: 平仄起：仄起／仄起／平起
  - label: C
    content: 押韻字：盡、流、樓／北、裳、狂、鄉、陽／堆、開、來
  - label: D
    content: 對仗：無對仗／有三組對仗／無對仗
  lesson_raw:
    title: 近體詩選
    basis: 題目指名整理《近體詩選》三首詩
