  group_stem: "少年得志，最容易流入不可一世的泥潭，然而家世顯赫、憑〈阿房宮賦〉一舉登第天下知的杜牧，某次與友人遊寺，寺僧有眼不識泰山，他卻能清醒自牧，寫下「禪師都未知名姓，始覺空門意味長。」這樣真誠謙卑的體悟。\n\
    \  杜牧進士及第後，曾在揚州擔任推官，其「南朝四百八十寺，多少樓臺煙雨中。」即為讚賞揚州美景的詩句。然而，自古江南多美女，據說杜牧在揚州時，最愛流連青樓，《唐才子傳》記載他「好歌舞，風情頗張，不能自遏」。上司牛僧孺知道而不點破，但擔心他常出入是非之地引起麻煩，甚至派人暗中尾隨，負責其安全。\n\
    \  離開揚州很久以後，杜牧寫了一首〈遣懷〉，算是他對揚州生活的總結：「十年一覺揚州夢，贏得青樓薄幸名。」──前塵恍然如夢，不堪回首。\n  王朝的興衰總是「其興也勃，其亡也忽。」日漸衰亡的帝國就像一輛破舊不堪的牛車，走進最後的終結。晚唐衰世當中，詩人觸及現世的荒誕與可笑，感知到歷史的濃黑與悲哀。\n\
    \  杜牧就是這樣的詩人。他的詠史詩角度獨特，思想深邃，往往能另闢蹊徑、耐人尋味。如〈題烏江亭〉中的「江東子弟多才俊，捲土重來未可知。」，不同於數百年來，後人多將項羽在烏江自刎①一事，當成壯烈崇高的象徵──而杜牧彷彿是在告誡統治者──\
    \                            。\n※注釋：①烏江自刎：項羽在垓下之戰被劉邦指揮諸侯六十萬聯軍所敗，突圍至烏江後，無顏見江東父老，自刎而死。\n\
    ──改寫自夏崑《最美的國文課：唐詩》"
