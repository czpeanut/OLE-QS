  group_stem: '從雲水洞歸，諸公共臥榻上。予曰：「陡泉甚近，曷①往觀？」遂相挈循澗行。食頃至。石壁躍起百餘丈，平坦滑澤，間以五彩。壁上有石，若冠若柱，熟視似欲下墮，使人頭眩。壁腰一處，巉巉②攢結，成小普陀③。泉在壁下，泓渟○4
    清徹。寺僧云：「往有用此水熟腥物者，泉輒伏○5 。至誠懺謝，復湧出如常，故相傳稱聖泉。」

    ──改寫自袁宗道《白蘇齋類集．卷十四》

    ※注釋：①曷：通「何」。②巉巉：山勢高險。③普陀：指普陀山，為佛教四大名山之一。○4 泓渟：水深貌。○5 伏：隱藏。'
