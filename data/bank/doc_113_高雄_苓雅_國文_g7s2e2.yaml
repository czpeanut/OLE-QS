  group_stem: '【甲】漢家旌幟滿陰山，不遣胡兒匹馬還。願得此身長報國，何須生入玉門關？

    【乙】黃河遠上白雲間，一片孤城萬仞山。羌笛何須怨楊柳，春風不度玉門關。

    【丙】青海長雲暗雪山，孤城遙望玉門關。黃沙百戰穿金甲，不破樓蘭終不還。'
