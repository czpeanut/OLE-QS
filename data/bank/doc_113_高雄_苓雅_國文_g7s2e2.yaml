- id: doc_113_高雄_苓雅_國文_g7s2e2_s1_35
  section: 1
  number: 35
  type: single
  page: 4
  stem: 根據文意，文中□處依序應填入下列哪些詞語？
  options:
  - label: A
    content: 不僅／因此／而是
  - label: B
    content: 由於／還是／以及
  - label: C
    content: 除了／與其／最終
  - label: D
    content: 若是／所以／不如
  group_stem: "在美麗的天燈施放過後，我們所看不到的，是隨之而來散落在各地的垃圾，□造成環境汙染，隨時可能引起火災，也讓平溪周邊的民眾隨時處在警戒狀態。\n\
    \  天燈一盞高達一公尺，體積龐大，隨著火種的燃燒殆盡，飛得再高的天燈也會面臨墜落的命運，這些天燈，隨著東北季風的飄散吹拂，最遠可能落到坪林、深坑、烏來的山區，這些殘骸有的高掛枝頭，有的落在民眾的屋頂，甚至還有卡在電線杆上的危險景象──這都成了美麗的傳統文化背後所帶來的環境威脅。\n\
    \  根據環保局統計，每年過年至元宵節期間，光平溪當地就會製造超過二十噸的垃圾，翠綠山頭被五顏六色天燈所「點綴」，那畫面特別怪異且突兀。雖然說，平溪區公所每年都會加派人力清除周邊垃圾，也祭出獎勵辦法鼓勵居民幫忙清掃，但隨時可能「降落」的垃圾，已讓許多居民不勝其擾。\n\
    \  天燈到底該不該放？也許要全面禁止，是件不可能的事。\n  這在平溪當地流傳百年的文化，最早可追溯到三國時代。早年先民來臺開墾十分寮地區時，年節時分常受到外敵侵辱，□老弱婦孺會到外地避難，等待做為信號的天燈施放後歸來，並逐漸演變為十分地區的特有文化。\n\
    \  新北市政府所舉辦的「平溪天燈節」，今年也邁入第二十一個年頭，不論在傳統文化意義與觀光經濟效益上，天燈都有不可或缺的重要性與代表性。\n  有環保團體呼籲，不要再到平溪放天燈，以保護山林，別再製造擾人的垃圾，因為有些天燈甚至會落到河川內，對於棲地造成破壞。就算天燈的材質都是紙與木，可以自然被環境分解，但短期內來看，還是對於周邊居民有嚴重的影響。\n\
    \  如果把「天燈」這個要素因為保護環境之故而從平溪取消，恐怕平溪線鐵道都有可能因為漸漸減少的人潮而黯淡，不僅造成當地經濟效益的損失，連帶會影響國際觀光效益。\n\
    \  天燈，就好比平溪的命脈，它的重要性甚至被Discovery 評為「全世界最重要節慶」第二名（僅次於巴西嘉年華），CNN 也推薦為「世界上最值得參與的年度新鮮事」之一。\n\
    \  現在最重要的，是臺灣民眾自發性地減少，甚至不要再施放天燈，漸漸改變觀念，總有一天能讓施放天燈的垃圾愈來愈少。\n  下次來到平溪，不應該再以天燈為主，□看看當地特殊的鐵道文化、基隆河谷壺穴美景、十分瀑布的渾然天成、菁桐煤礦的興衰過往故事、十分老街的美食傳統、日據時期的老舊宿舍環境等，平溪還有許多值得旅人挖掘的好地方。\n\
    ──改寫自魯皓平〈放天燈是傳統，還是為山林製造更多垃圾？〉"
