- id: doc_113_台中_大甲_社會_公民_g8s2e2_s1_34
  section: 1
  number: 34
  type: single
  page: 1
  stem: 宗玄是線上遊戲玩家，帳號角色擁有非常多珍貴的高級裝備與寶物。但是卻遭到其他不肖玩家盜用帳號，把他的裝備與寶物一掃而空。宗玄不甘心向警局報案，要以「竊盜罪」來進行刑事救濟，警方卻告訴宗玄：虛擬寶物並不屬於動產，遊戲伺服器也不歸玩家所有，是屬於遊戲公司的，因此被歸類為「電磁紀錄」，不在《刑法》第
    320 條第 1 項「竊盜罪」範圍內。但這並不代表盜取虛擬寶物就沒有處罰，在《刑法》第 359 條規定中，只要是取得、刪除或無故變更輸入他人電磁紀錄，造成他人損害，仍然有對應的罰則。」請問：宗玄無法以「竊盜罪」的罪名來進行刑事救濟的原因是？
  options:
  - label: A
    content: 刑責相當原則，為了保護被害者，必須擴大竊盜罪適用範圍
  - label: B
    content: 無罪推定原則，因為《刑法》規定，竊取虛擬寶物不算犯罪
  - label: C
    content: 罪刑法定原則，因為盜用帳號行為發生當下，並無《刑法》規範
  - label: D
    content: 罪刑法定原則，因為竊取虛擬寶物不符合竊盜罪規範的條件。
