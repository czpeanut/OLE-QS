- id: doc_113_高雄_光華_社會_g8s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 西方有句法諺：「有權利，必有救濟。」在我國憲法第16 條規定：「人民有請願、訴顧及訴訟的權利」，即所謂的救濟權。下列關於救濟權的敘述，何者正確？
  options:
  - label: A
    content: 訴願－人民因行政機關的處分有不當或違法而提起的救濟，屬於參政權
  - label: B
    content: 請願－人民對於政策或利益，向主管機關或民意機關陳述願望，屬於受益權
  - label: C
    content: 訴訟－人民的權益受到不法侵害，向法院尋求救濟，屬於自由權
  - label: D
    content: 自由權－人民有積極要求國家有所作為，而享受特定利益的權利。
  answer:
  - B
  answer_source: answer_key_vlm
- id: doc_113_高雄_光華_社會_g8s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 請依據下列案例，判斷哪一項人民的基本權利未被提出？ （甲）參與職業訓練 （乙）就讀學區國小（丙）參與組織政黨（丁）設置親子車位（戊）上街示威遊行
  options:
  - label: A
    content: 自由權
  - label: B
    content: 平等權
  - label: C
    content: 受益權
  - label: D
    content: 參政權。
  answer:
  - D
  answer_source: answer_key_vlm
- id: doc_113_高雄_光華_社會_g8s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '2024 年我國總統、立法委員大選後，多名原任地方公職人員者因當選中央民意代表，依法某些鄉鎮市長及縣市議員須進行補選，根據右表的公職人員缺額及我國現行法律判斷，下列敘述何者正確？

    | 項次 | 公職人員缺額 |

    | :--- | :--- |

    | 甲 | 苗栗縣苗栗市市長 |

    | 乙 | 雲林縣虎尾鎮鎮長 |

    | 丙 | 臺東縣大武鄉鄉長 |

    | 丁 | 宜蘭縣〇〇選區縣議員 |

    | 戊 | 臺中市〇〇選區市議員 |'
  options:
  - label: A
    content: 甲、乙、丙皆屬於地方上的民意代表
  - label: B
    content: 若受監護宣告，仍具有參選丁的資格
  - label: C
    content: 丁、戊的參選年齡皆須至少滿26 歲
  - label: D
    content: 甲、乙、丙行政區的地方層級皆相同。
  answer:
  - D
  answer_source: answer_key_vlm
- id: doc_113_高雄_光華_社會_g8s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 下列有關地方政府職權的敘述何者正確？
  options:
  - label: A
    content: 苗栗縣縣民代表會通過《苗栗縣石虎保育自治條例》，讓苗栗縣成為全國第一個通過保育單一物種自治條例的縣市
  - label: B
    content: 我國中央與地方的分權方式採均權制度，職權畫分是依事務的規模大小，若發生爭議則交由立法院解決
  - label: C
    content: 民國86 年修憲，將省「虛級化」，不再是地方自治團體，省政府成為行政院的派出機關
  - label: D
    content: 地方政府的水平分權具有行政、立法、司法三權，彼此互相制衡。
  answer:
  - C
  answer_source: answer_key_vlm
