  section: 1
  number: 44
  type: single
  page: 5
  stem: 屏東著名的「老鷹紅豆」誕生背景，是源自於少數農民為了避免鳥害造成農損，使用劇毒農藥拌稻穀製作毒餌，造成小型鳥類大量死亡，再被老鷹撿食後，導致老鷹也中毒。後來在一群願意改變的契作農夫，透過不毒鳥、不用落葉劑讓紅豆自然熟成及符合產銷履歷規範等方式，以無毒栽培打開市場知名度。上述資料說明了何種農業的轉型策略？
  options:
  - label: A
    content: 發展高度集約的農業，提升單位面積產量
  - label: B
    content: 推動有機農業，喚醒消費者對土地的關懷
  - label: C
    content: 設立專業生產區，銷往國外穩定農業收入
  - label: D
    content: 進行品種改良，藉此增加符合市場的需求。
