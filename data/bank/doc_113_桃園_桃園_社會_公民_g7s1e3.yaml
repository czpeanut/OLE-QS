- id: doc_113_桃園_桃園_社會_公民_g7s1e3_s1_34
  section: 1
  number: 34
  type: single
  page: 1
  stem: '桃園市原住民族行政局舉辦賽夏族祖靈祭，活動內容概述如下所示：


    賽夏族祖靈祭

    每年舉行兩次，農事祭儀之一，依耕作狀況決定，第一次是在開墾旱田或播種完成等作物成長舉行；第二次是收割稻子後舉行。


    該活動讓無法帶子女返回原鄉部落參加歲時祭儀的家長，能在都市中教導下一代賽夏族的文化，也讓都市各族群有機會能認識賽夏族傳統文化。此祭典須經過部落長老同意後才舉行，全程依祖先流傳下來的傳統儀式和內容辦理，並且由部落長老到現場教導儀式流程，用母語祈福給部落族人，活動全程以賽夏語為主，中文同步口譯。下列哪一項內容與此活動的舉辦「無關」？'
  options:
  - label: A
    content: 儀式流程會對族人產生約束的規範
  - label: B
    content: 部落長老是文化中重要的政治組織
  - label: C
    content: 祭典的舉行時間展現共工互助機制
  - label: D
    content: 桃園市政府舉辦的目的在於文化傳承。
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 公民
      code: 6-1
      title: 部落的意義與重要性
      chapter: 第6章 部落與公民參與
