- id: doc_113_桃園_桃園_社會_公民_g7s1e3_s1_44
  section: 1
  number: 44
  type: single
  page: 2
  stem: 關於公共事務討論的過程，請問：下列敘述何者正確？
  options:
  - label: A
    content: 根據該議題涉及的對象，文中各方意見皆應該要被採納
  - label: B
    content: 部分學生不配合班聯會的決議，是自我意識的展現，值得鼓勵
  - label: C
    content: 為維護學生的權益，在討論公共事務時不需要遵守學校的規範，必要時可以罷課作為手段
  - label: D
    content: 從上文內容判斷，該校的作法是符合教育部規定的
  group_stem: '日前某高中校務會議決定廢除朝會，學生於網路發文表示：「經過為期一個學期的學生抗爭，加上班聯會的推動、學校老師的理性討論與教育部政策的配合，每週一次的朝會正式走入歷史。」在該議題決議前，學生蒐集的各方意見如下：

    | 該校校方 | 即使取消了朝會制度，每月仍需召開一次月會，以向全校傳達重要事項。 |

    | 该校學生 | 朝會取消後，未來可以運用朝會時間念書，或休息養足更多體力。 |

    | 家長會長 | 學生權益得到保障，校方也得以推動校務，這是一個雙贏的決定。 |

    | 該校班聯會 | 依教育部規定，班聯會票選共識決定每週一、五可八時再到校，但部分學生不理會此規定，任意選擇週二以避開朝會。 |

    | 網友留言 | 早自習不要，朝會也不要，那乾脆都不要上學好了。 |

    | 教育部 | 學校朝會不論要保留還是廢除，都必須循民主參與的程序，與學生、教師與家長充分溝通，並經過校務會議議決通過後實施。 |'
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 公民
      code: 5-2
      title: 如何參與校園公共事務？
      chapter: 第5章 學生權利與校園生活
    textbook: 七上公民 5-2 如何參與校園公共事務？
    labeled_by: ai
- id: doc_113_桃園_桃園_社會_公民_g7s1e3_s1_45
  section: 1
  number: 45
  type: single
  page: 2
  stem: 有關該校學生自治的運作，下列何者正確？
  options:
  - label: A
    content: 班聯會身為學生自治組織，有效的整合學生的意見，向校方表達
  - label: B
    content: 班聯會所作出的決議，不具任何強制力，學生可自由選擇是否遵守，此舉符合自治規範
  - label: C
    content: 在蒐集意見時，直接採用網友的意見，才能真實反映出各方看法
  - label: D
    content: 此議題涉及全國各高中，各高中都應該要比照辦理
