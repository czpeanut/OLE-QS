  section: 1
  number: 37
  type: single
  page: 1
  stem: '下列為有關飛魚的報導──

    據說飛魚是天神給達悟族的禮物，達悟族祖先曾經混吃不同類的魚而生病，後來好心的黑鰭飛魚教導達悟族如何招、捕、辨認、煮食各類飛魚。種種因素促使達悟族對待飛魚特別心存戒慎，以各種儀式配合漁撈、煮食活動以及曬曝過程，以保一切安全無虞。其中飛魚又分為老人魚、男人魚以及女人魚，故一個達悟族男子在捕魚時，必須捕撈到不同種的魚，以供應家裡的男女老少享用。間接抑制了過量捕殺單一魚類的危機，也兼顧了生態保育的平衡。

    上文中達悟族人捕飛魚的考量，顯示出下列哪一項部落的重要性？'
  options:
  - label: A
    content: 語言文化傳承，形塑族人對部落的認同感
  - label: B
    content: 生產分配中心，重視生態平衡與共享特質
  - label: C
    content: 基本政治組織，依各族文化形成政治組織
  - label: D
    content: 傳統信仰重心，以凝聚部落族人的向心力
