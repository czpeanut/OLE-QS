  section: 1
  number: 39
  type: single
  page: 2
  stem: 根據文中的內容判斷，奧吉媽媽堅持讓奧吉到學校學習的主張，最可能是基於下列何項考量？
  options:
  - label: A
    content: 展現自我潛能面對異樣眼光
  - label: B
    content: 在團體中培養人際互動能力
  - label: C
    content: 向同學學習有效的讀書方法
  - label: D
    content: 以學生自治限制他人的權利
  group_stem: 電影「奇蹟男孩」改編自同名暢銷小說，故事講述男孩奧吉因為罕見基因造成了臉部天生的不完整，經過幾十次大小手術之後，才能夠和正常人有一樣的身體機能。奧吉媽媽認為奧吉總有一天要面對社會，要學習面對來自同學間的異樣眼光，因此主張結束一對一在家自學，讓他進入學校中實際生活與學習。10
    歲的奧吉結束了在家與媽媽自學的生活，決定踏出家門上學去。剛開始奧吉自然在校園中成為大家指指點點的目標，有人嘲笑他、有人欺負他、甚至直接說他有「傳染病」。如何面對可能來自同學間不友善的眼光，以及充滿歧視性的語言，是他們全家即將面對的新挑戰。
