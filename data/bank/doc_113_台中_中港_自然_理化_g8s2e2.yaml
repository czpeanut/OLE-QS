  - label: A
    content: 石灰溶於水為放熱反應,而高溫使鴉片更容易溶於水中
  - label: B
    content: 石灰溶於水為吸熱反應,而高溫使鴉片更容易溶於水中
  - label: C
    content: 鴉片浸泡海水後會使水溫上升,使其與石灰反應速率加快
  - label: D
    content: 鴉片浸泡海水後會使水溫下降,使其與石灰反應速率加快。
