- id: doc_113_台南_民德_國文_g8s2e1_s4_5
  section: 4
  number: 5
  type: single
  page: 6
  stem: 這是曾國藩寫給家中兄弟的一封信，請問依照正式書信的格式，提稱語應該寫什麼?
  options:
  - label: A
    content: 膝下
  - label: B
    content: 鈞鑒
  - label: C
    content: 道鑒
  - label: D
    content: 大鑒。
  group_stem: '我仕宦十餘年，現在京寓所有，惟書籍、衣服二者。衣服則當差者必不可少，書籍則我生平嗜好在此，是以二物略多。將來我罷官歸家，我夫婦所有之衣服，則與五兄弟拈鬮①均分。我所辦之書籍，則存貯利見齋②中，兄弟及後輩皆不得私取一本。除此二者，予斷不別存一物以為宦囊，一絲一縷不以自私。此又我待兄弟之素志也，恐溫弟③不能深諒我之心，故將我終身大規模告與諸弟，惟諸弟體察而深思焉。

    (曾國藩 曾文正公家書)


    【注】：①拈鬮：從預先做好記號的紙捲或紙團中，隨意拈取一個，來決定事情。鬮：音ㄐㄧㄡ。

    ②利見齋：曾國藩之父曾國麟所設立的家塾。③溫弟：曾國藩的弟弟曾國華，字溫甫。'
