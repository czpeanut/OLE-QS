  group_stem: "臺灣讀者對隈研吾應該不陌生，負建築、自然的建築到甫出版的奔跑的負建築家，每本都是建築人書架上的聖經。日本當紅建築家隈研吾的作品散發濃濃風土味，毫不掩飾地表達創時代的建築理念，尤其是挑戰傳統的「負建築」思想，令人重新省思二十一世紀建築與人的關係。\n\
    \    隈研吾直接批判工業化的「混凝土」建築，他覺得二十一世紀的建築應該是有溫度的。所謂的「負建築」，是不再標榜高聳、特立的環境標的。人們不應和環境對抗或劃清界線，建築應該與當地的環境、文化和需求有所連結。此外，他堅信材質能呈現出建築師想表達的信息，他說:「我喜歡木造的房子，因為會隨著時間變化；雖然過程中必須不斷的保養維修，但是比起ㄧ造成定局的混凝土，質樸素材的生命週期還是比較恆久。」對這位勇敢的建築師來說，建築應該是「活著的建築」，而非「紀念碑」似的建築。\n\
    \    隈研吾不斷旅行，觀察世界各地建築者對應材質的態度，他發現:西方人相信工業可以取代工藝，但亞洲技師卻將建材視為自己的合作夥伴；美國人用機器對待建材，但亞洲人則用雙手堆疊石牆。隈研吾認為，二十一世紀是亞洲建築的時代，那種大屋簷建築下的光影與氛圍，表現了無限溫柔的時代感。\n\
    \    「竹子有分粗細和軟硬，以建築來說，一般人喜歡用堅硬的材質，但我喜歡表達一種溫柔、溫暖的感覺，所以會選擇細而軟的竹子。」隈研吾輕輕地說。「強而有力的建築似乎是一個幻象；過去總認為建築可以戰勝環境，但我完全質疑這件事。」隈研吾點出了外表愈是堅硬的建築，本質愈是脆弱，而日本311\
    \ 地震之後更證實了他的觀點。\n    隈研吾以勇者之姿，一次又一次地申論新時代的「負建築」理念。\n(改寫自有溫度的建築*無形的溫暖=「負建築」代表隈研吾)"
