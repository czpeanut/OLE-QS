  type: single
  page: 6
  stem: 關於〈飲馬長城窟行〉的說明，何者正確?
  options:
  - label: A
    content: 「青青河畔草，綿綿思遠道」:藉景色的鋪陳，引發主角觸景生情，表現源源不絕的思念
  - label: B
    content: 「入門各自媚，誰肯相為言」:透露出婦人在家中受到排擠，只能說好話討好別人
  - label: C
    content: 「客從遠方來，遺我雙鯉魚」:遠方的客人離開時，遺留了二條鯉魚忘記帶走
  - label: D
    content: 「上言加餐食，下言長相憶」:婦人向丈夫訴說思念之情並提醒他出門在外要記得吃飯。
  group_stem: '(甲)〈飲馬長城窟行〉

    青青河畔草，綿綿思遠道。遠道不可思，夙昔夢見之。

    夢見在我旁，忽覺在他鄉。他鄉各異縣，展轉不可見。

    枯桑知天風，海水知天寒。入門各自媚，誰肯相為言！

    客從遠方來，遺我雙鯉魚。呼兒烹鯉魚，中有尺素書。

    長跪讀素書，書中竟何如？上言加餐食，下言長相憶。


    (乙)〈十五從軍征〉

    十五從軍征，八十始得歸。道逢鄉里人，家中有阿①誰？

    遙望是君家，松柏塚②累累。兔從狗竇③入，雉從梁上飛。

    中庭生旅穀④，井上生旅葵。舂穀持作飯，采葵持作羹。

    羹飯一時熟，不知貽⑤阿誰？出門東向望，淚落沾我衣。

    【注】：①阿：發語詞，無意義。 ②塚：高墳。 ③狗竇：給狗出入的牆洞。

    ④旅穀：植物未經播種而生叫「旅生」。旅生的穀與葵叫「旅穀」、「旅葵」。

    ⑤貽：送。'
