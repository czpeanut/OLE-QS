  stem: '父親大人膝下:敬稟者，自拜別  雙親，思念殷切。投軍至今已匆匆半年，軍旅生活緊張匆忙，幸得軍中長官愛護，同袍也對兒十分照顧，目前已逐漸適應，請勿掛念。天氣寒冷，請注意保暖，早晚添衣。謹此奉稟，敬請

