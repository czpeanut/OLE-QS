- id: doc_113_台南_民德_國文_g8s2e1_s4_3
  section: 4
  number: 3
  type: single
  page: 5
  stem: 根據本文，關於E-Bike 的說明，下列敘述何者錯誤?
  options:
  - label: A
    content: 為強化續航力，電池重量不減反增
  - label: B
    content: 目前無駕照、牌照、行照仍可騎乘
  - label: C
    content: 政府會進行審驗，並給予合格標章
  - label: D
    content: 功能逐漸多元，不再單純是交通工具。
  group_stem: "相較於傳統自行車，電動輔助自行車(E-Bike)的馬達輔助功能，讓許多人克服體力限制，不論是通勤、登山甚至遠程環島，隨時都能享受追風樂趣。\n\
    \    電動自行車是以「蓄電池」為主要能源的小型陸上車輛，沒有踏板，因此長相也類似於一般電動機車；而電動輔助自行車則是以「人力」為主，「電池」為輔的小型陸上車輛，長相類似於腳踏車，會裝置踏板供駕駛踩踏，才能啟動電池能量支援，並通過感測器測量騎乘者踩踏時的用力程度，來決定馬達輸出的扭力輔助，騎來輕鬆又省力，更能兼具運動而深受歡迎。\n\
    \    以往E-Bike 的設計，因受限於電池及機電設備的安裝而顯得笨重醜陋，但現今電池技術有很大的突破，在續航力、輕量化或蓄電方便性都有更佳表現。\n\
    \    另外，在機電設備及馬達功能上，都有新的技術及軟體系統整合，使得E-Bike 不再僅限於機能性，並漸漸告別戶外大地、多色活潑的設計風格，而是轉以簡約都會感、現代高科技感的風格取向為主，讓電動輔助自行車成為「生活風格」，而非只是交通工具。\n\
    \    但無論是哪一種車款，消費者在選購E-Bike 時，宜先認明是否通過國家安全測試，且須通過交通部審驗通過合格，並具有「綠色網狀與黃色閃電」的合格標章，才能合法上路。\n\
    \    雖然目前E-Bike 上路免牌照、免行照、免駕照，但無論是電動自行車或電動輔助自行車都必須通過審核認證並貼上合格標籤，且騎乘時必須配戴安全帽，行駛於指定自行車道，以免發生意外。\n\
    (改寫自李寶怡 馬達輔助，享受騎乘樂趣)"
