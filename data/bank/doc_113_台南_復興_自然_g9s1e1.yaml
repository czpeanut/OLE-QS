  section: 2
  number: 8
  type: fill
  page: 4
  stem: '有五位同學在討論「速度變化與加速度」的關係，

    甲生：只要速度改變，就一定會有加速度。

    乙生：速度變化量越大，加速度就越大。

    丙生：只要有加速度，速度就會變快。

    丁生：速度越來越快，物體的加速度越大。

    戊生：物體的速度為 0 m/s 時，加速度也為 0 m/s。

    依據上述對話，請判斷哪些人的說法正確？【(8)】'
