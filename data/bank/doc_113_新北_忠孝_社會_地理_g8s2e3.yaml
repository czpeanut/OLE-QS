  stem: 考量該國的經濟發展現況，若要協助該國經濟成長及轉型，下列哪一作法是較佳的方案？
  options:
  - label: A
    content: 鼓勵台灣紡織及製鞋業前往投資，帶動紡織工業成長
  - label: B
    content: 協助該國的畜牧業轉型為酪農業，滿足當地都市所需
  - label: C
    content: 協助興建現代大型港口，成為該區域的貿易轉運中心
  - label: D
    content: 引進外勞到台灣，提升該國人力素質及增加外匯收入。
