  stem: '根據該城市的氣候圖，附表中何者最符合其氣候特徵？


    | | 氣候特徵 |

    | :--- | :--- |

    | 甲 | 全年高溫，年溫差小<br>乾溼季節分明，降雨多集中於夏季 |

    | 乙 | 全年高溫，年溫差小<br>全年潮溼多雨，降雨多集中於午後 |

    | 丙 | 終年涼爽宜人，日夜溫差大<br>秋冬雨量較多，春夏雨量較少 |

    | 丁 | 四季變化顯著<br>乾溼季節分明，冬季降雨多於夏季 |'
