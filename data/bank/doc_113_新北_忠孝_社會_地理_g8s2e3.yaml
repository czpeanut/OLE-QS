- id: doc_113_新北_忠孝_社會_地理_g8s2e3_s2_24
  section: 2
  number: 24
  type: single
  page: 1
  stem: 烏干達獨立建國之後，包含了二十多個不同的部落，這些不同部落缺乏國家共識，彼此常因國內外糾紛，產生嚴重分歧，甚至導致種族間的衝突。請問烏干達這樣的政治困境和下列哪一個原因關係較為密切？
  options:
  - label: A
    content: 礦產豐富引發爭奪
  - label: B
    content: 歐洲殖民統治方式
  - label: C
    content: 實施「種族隔離」政策
  - label: D
    content: 氣候乾燥生存不易。
- id: doc_113_新北_忠孝_社會_地理_g8s2e3_s3_25
  section: 3
  number: 25
  type: single
  page: 2
  stem: 請由上述資料推論，布吉納法索最可能曾經是哪一國家的殖民地？
  options:
  - label: A
    content: 德國
  - label: B
    content: 法國
  - label: C
    content: 英國
  - label: D
    content: 象牙海岸。
  group_stem: "※    網路上有封e-mail 是這麼寫的：「來自非洲的聲音---資源再利用，環保又人道。有位朋友在非洲服替代役，他在『布吉納法索』工作。他之前在當地試辦了一個計畫：\n\
    三包垃圾換一件衣服。他這個計畫十分成功，因為那兒的垃圾問題嚴重，而且當地人十分缺衣服……」\n    這個人的名字叫連加恩，他帶著受訓三個月的生疏法語服役前去。一下飛機，這個位在赤道以北、北緯九至十五度的國家，迎面而來的就是熱浪襲人；前往醫療團途中，他見到的就是滿街垃圾，廢棄的塑膠袋甚至掛滿樹上。應該在學校讀書的小孩，在街上拿著三包面紙，頂著四十度以上的大太陽兜售；或是背著擦鞋工具，找白人、黃種人擦鞋賺錢，連加恩感受到這個國家的貧窮。在這裡的人，每天就是為了填飽肚子。活著，不是一件很單純的事嗎？布吉納法索人的生活，強烈衝擊著生長於富裕台灣的六年級世代連加恩。而連加恩這個來自台灣的年輕人，除了跟著醫療團在各個小村莊義診，還參加了一個跨國義工團隊，成員是一個台灣人、三個法國義工、三個布國傳統音樂家、一個布國現代音樂家和一個布國版畫家。幾個原本不認識的黑人、白人、黃人，一起幫當地挖井、幫一個叫Ti\
    \ ogo Mose 的村子蓋孤兒院。\n以下是布吉納法索的地理位置圖及簡介：\n布吉納法索曾為台灣邦交國，2018 年斷交，國家的官方語言均為法語，為全球識字率最低的國家，只有約兩成三的國民識字。\n\
    \    全境並無沙漠，但西部有廣大地區土壤多沙，十分貧瘠；而東南部伏塔河谷則有采采蠅的騷擾，伏塔河在\n境內，其流量受乾、雨二季的控制，呈間歇河狀態，無航運，亦少水利灌概，致使農業生產力低落，不易自給自足。\n\
    \    經濟上，以農牧立國，是個非常貧困的國家，也是周邊非洲國家主要的外來勞工輸出國。純賴微弱的農牧經濟並不能支持其國民的生活，因此每年布吉納法索均有大批勞工外流，主要移向南方各鄰國如迦納、象牙海岸和幾內亞，出賣勞力以賺取生活所需，有的是短期工作，但也有不少人是長期居留國外。境內唯一的一條鐵路是通往象牙海岸，所以與該國的互動密切。"
  shared_asset: g3_25_27
