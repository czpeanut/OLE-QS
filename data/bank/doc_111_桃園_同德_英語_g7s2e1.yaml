  group_stem: "【19.~21.】 \nFood Waste: A Big Problem We Can Solve \n    Do you know\
    \ that every day in Taiwan, people throw away enough food to fill 74 Taipei 101?\
    \ That's a lot of \nfood! And it's not just happening in Taiwan. All around the\
    \ world, people are wasting food. But do you also know \nthat there are over 650,000\
    \ families in Taiwan that don't have enough food to eat? This is a big problem\
    \ we need to \nsolve. \n    Food waste happens when we buy or make too much food\
    \ and don't eat it up. But throwing away food wastes \nnot only the food but also\
    \ the resources used to make it, like water and energy. This is not good for the\
    \ Earth. At the \nsame time, a lot of people around the world don’t have enough\
    \ food. This is not fair. We need to find out ways to \nreduce food waste and\
    \ make sure that food is enough for everyone. \n    So what can we do? We can\
    \ plan our meals and buy only what we need. What else can we do? Let’s think about\
    \ \nit. By working together, we can make a change and do something good for our\
    \ Earth! \nsolve 解決；happen 發生；need 需要；much 很多；resource 資源；reduce 減少；  \nmake\
    \ sure 確保；change 改變"
