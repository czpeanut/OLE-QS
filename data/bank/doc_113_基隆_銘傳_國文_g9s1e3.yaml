  - label: C
    content: 以「好鳥相鳴，嚶嚶成韻。蟬則千轉不窮，猿則百叫無絕」反襯幽靜，意境似「蟬噪林逾靜，鳥鳴山更幽」
  - label: D
    content: 以「負勢競上，互相軒邈；爭高直指，千百成峰」烘托山勢高峻。並以「負、競、爭、指」化靜為動，使群山眾林生機盎然
