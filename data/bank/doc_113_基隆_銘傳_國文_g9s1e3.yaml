  page: 6
  stem: '測驗說明：

    這是本校國文科段考作文測驗題目卷，僅有一題，提供寫作稿紙一張，共2頁。測驗時間從15:10至15:55，共45分鐘。作答時間開始與結束以學校鐘聲為主（或依監考老師現場指示），作答時請從第1頁右邊第1行開始作答。


    題目：地球的獨白


    引導語：

    在〈喂—出來！〉一文中，作者藉由一個憑空出現的「無底洞」，敘述人們將它視為解決問題的妙方，進而毫無節制的製造垃圾，最終卻可能咎由自取。其反映了現代人對自然的予取予求，持續造成污染的真實情況。環境污染的類型有很多種，空氣污染、水污染、土壤污染則為常見的污染種類，這些污染不但導致生態環境日益惡化，也影響人類的生存空間。

    請將自己想像成地球，以「地球的獨白」為題，透過第一人稱「我」的視角，述說地球所面臨的各種挑戰。'
