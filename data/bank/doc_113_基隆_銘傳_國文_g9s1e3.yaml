    content: 因石簧期盼降雨
  - label: B
    content: 因連日有雨
  - label: C
    content: 因山中氣候易降雨
  - label: D
    content: 因正值當地雨季
  group_stem: '甲

    數日陰雨，苦甚，至雙清莊，天稍霽。莊在山腳，諸僧留宿莊中，僧房甚精。溪流激石作聲，徹夜到枕上。石簧①夢中誤以為雨，愁極，遂不能寐。次早，山僧供茗糜②，邀石簧起。石簧嘆曰：「暴雨如此，將安歸乎？有臥遊耳！」僧曰：「天已晴，風日甚美，響者乃溪聲，非雨聲也。」石簧大笑，急披衣起，啜茗數碗，即同行。

    （袁宏道〈初至天目③雙清莊記〉）

    注釋：①石簧：即陶望齡，字周望，號石簧。②茗糜：茶水和稀粥。③天目：即天目山，座落在浙江省臨安縣的名山。


    乙

    西湖最盛，為春為月。一日之盛，為朝煙，為夕嵐。今歲春雪甚盛，梅花為寒所勒①，與杏、桃相次開發，尤為奇觀。石簧數②為余言：「傅金吾③園中梅，張功甫④玉照堂故物也，急往觀之。余時為桃花所戀，竟不忍去。

    由斷橋至蘇堤一帶，綠煙⑤紅霧⑥，彌漫二十餘里。歌吹⑦為風，粉汗⑧為雨，羅紈⑨之盛，多於堤畔之草，艷冶極矣。

    然杭人遊湖，止午、未、申三時；其實湖光染翠之工，山嵐設色之妙，皆在朝日始出，夕舂未下⑩，始極其濃媚。月景尤不可言，花態柳情，山容水意，別是一種趣味。此樂留與山僧遊客受用，安可為俗士道哉！

    （袁宏道〈晚遊六橋待月記〉）

    注釋：①勒：抑制、壓抑。②數：音ㄕㄨㄛˋ，屢次。③金吾：官名，掌京師戒衛。④張功甫：本名張鎡。

    ⑤綠煙：柳綠如煙。⑥紅霧：桃紅如霧。⑦歌吹：指吹奏聲。⑧粉汗：指遊湖仕女眾多。⑨羅紈：泛指精美的絲織品。紈：音ㄨㄢˊ。此指穿著華美衣服的遊客。⑩夕舂未下：指傍晚時刻。'
