  type: single
  page: 3
  stem: 文中提到「是夕，天宇開霽，林間月明，可數毫髮。」下列敘述何者正確？
  options:
  - label: A
    content: 作者以「可數毫髮」，凸顯當夜作者的閒情逸致
  - label: B
    content: 「天宇開霽，林間月明」，此情景多發生在陰時多雲的日子
  - label: C
    content: 「是夕，天宇開霽」，「宇」是指房屋，表示作者透過窗戶欣賞戶外的景色
  - label: D
    content: 「林間月明，可數毫髮」表示當夜天空清朗，月光明亮
  group_stem: '元豐二年，中秋後一日，余自吳興過杭，東還會稽。龍井有辨才大師，以書邀予入山。比①出郭，日已夕。航湖至普寧②，遇道人參寥，問龍井所遣籃輿③，則曰：「以不時至，去矣。」

    是夕，天宇開霽④，林間月明，可數毫髮。遂棄舟，從參寥杖策並湖而行。出雷峰，度南屏，濯足於惠因澗，入靈石塢，得支徑上風篁嶺，憩於龍井亭，酌泉據石而飲之。自普寧經佛寺十五，皆寂不聞人聲。道傍廬舍，燈火隱顯，草木深鬱，流水激激⑤悲鳴，殆非人間有也。行二鼓⑥，始至聖壽院，謁辨才於朝音堂，明日乃還。

    （秦觀〈龍井題名記〉）


    注釋①比：等到。 ②普寧：寺廟名。 ③所遣籃輿：可供遣使的竹轎。

    ⑤激激：水勢湍急的樣子。 ⑥行二鼓：快二更天了。行，不久、將要。'
