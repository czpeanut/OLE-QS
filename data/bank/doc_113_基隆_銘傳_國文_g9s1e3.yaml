- id: doc_113_基隆_銘傳_國文_g9s1e3_s3_47
  section: 3
  number: 47
  type: single
  page: 5
  stem: 關於十二生肖的說明下列何者正確？
  options:
  - label: A
    content: 中國將十二獸傳入亞洲各地，故各地版本大同小異
  - label: B
    content: 學者們大致認為世界的計時規則受中國十二生肖影響深遠
  - label: C
    content: 十二動物紀年之說各地皆有，因地區特色不同，略有差異
  - label: D
    content: 作者認為十二地支與十二生肖的配對是先民智慧的結晶
  group_stem: '西方人常用的「占星術」，是套用一年中夜空裡走馬燈般的「黃道十二宮星座」。……榜上有名的星星們，除了都是銀河系裡離太陽系較近（因此較亮）的星星外，互相並無關聯；它們在夜空中的安排不過是從我們所在的角度看出去的排列，也沒有特別的物理意義；同樣的一批夜空星斗，中國人把它們訂為二十八宿，……中國人自古以來，還有一套標記時間的循環計數法，也就是干支紀元：十天干配以十二地支，形成六十年（一「甲子」）的循環。

    可是，十二生肖真是源自古代中華文化的產物嗎？相較於中華文化裡的二十八宿和天干地支，十二生肖的文化意象、對應的思考方式顯然很不相同。更何況，既然已經有了十二地支，何必重複創造出功能相同的十二生肖呢？並存之下，兩者也就自然被一對一配了對，於是子鼠、丑牛、寅虎、卯兔、辰龍、巳蛇、午馬、未羊、申猴、酉雞、戌狗、亥豬就這麼莫名其妙地出現了。原因很簡單：十二生肖其實是強加進來的舶來品。世界各文化對待時間的循環更迭，都不約而同採用了十二進位，這兩組的匹配其實是「亂點鴛鴦譜」，用之於占卜，除了增加趣味性以外，其實沒有什麼意義可言。

    歷代的學者一般都比較認同中國的十二生肖傳自西方的說法。古代西方文明，包括巴比倫、埃及、希臘、印度，以至歷代西域各國、北方牧民、西南各民族，都有十二動物紀年之說，各版本都帶有各地的特色。……

    在亞洲，各地的十二獸與中國版本基本上相同，……但其起源、沿革，究竟是誰先誰後、誰學誰，可真是難說得很。

    （節錄自趙丰〈又見龍年〉）'
