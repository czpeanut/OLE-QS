- id: doc_111_彰化_埔心_國文_g9s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 「漸漸長大的孩子，終會發現，哪怕從不出海，人生也會有某些『荒島時刻』，感覺自己被放逐，那樣孤單無助。這時候，他們也許會想起隨身攜帶的錦囊，小小的錦囊中有微微發亮的詩，當他輕輕誦讀，便聽見了鳥語，嗅聞到花香，整個世界露出溫柔的微笑。」（張曼娟〈荒島的錦囊〉）根據這段文字，下列敘述何者正確？
  options:
  - label: A
    content: 透過閱讀，能使人孤獨的心靈得到慰藉
  - label: B
    content: 當孩子長大後，就難以單純的享受閱讀
  - label: C
    content: 即使漂流到荒島，閱讀依舊能帶給人們快樂
  - label: D
    content: 在荒島上獨自閱讀，將使人感到孤單無助。
  tags:
    chapter:
      publisher: 康軒
      book: 九上
      subject: 國文
      code: 第三課
      title: 人間好時節
      chapter: null
    textbook: 九上 第三課 人間好時節
    labeled_by: ai
- id: doc_111_彰化_埔心_國文_g9s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 「從不同的角度看世界，世界會變得不一樣。不要強迫自己追求不屬於自己的東西，而是接受你原本擁有的一切。即使遭遇挫折也是一樣，被貶謫到黃州的蘇軾，彷彿被囚禁在沒有欄杆的監牢，無法控制自己的人生，所謂『漁樵江渚』、『魚蝦麋鹿』、『扁舟匏樽』只是沒有選擇的選擇罷了。然而，黃州的一切，就是宇宙的一切，人在何處？擁有所物？又有什麼值得難過的呢？蘇軾說：『我們好好享受人生吧！』」這段文字的含義與下列何者最相近？
  options:
  - label: A
    content: 打破現狀，不斷進取創新，才能走出舒適圈
  - label: B
    content: 轉變心念，好好活在當下，不必強求不屬於自己的事物
  - label: C
    content: 成大事者的願望，最初便開始於不滿足
  - label: D
    content: 坦然面對自己的過失，反省之後便能有所領悟。
  tags:
    chapter:
      publisher: 康軒
      book: 九上
      subject: 國文
      code: 第三課
      title: 人間好時節
      chapter: null
    textbook: 九上 第三課 人間好時節
    labeled_by: ai
