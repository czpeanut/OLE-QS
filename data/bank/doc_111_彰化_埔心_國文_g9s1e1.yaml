  options:
  - label: A
    content: 「你曾是黃河之水天上來」點出黃河之名源自神話故事，帶有古老神祕的氛圍
  - label: B
    content: 「而今黃河反從你的句中來」表示現今許多人對黃河的印象，來自李白的詩句
  - label: C
    content: 「黃河西來，大江東去」意指李白離世後，黃河流域的文學風氣不如長江流域興盛
  - label: D
    content: 「有一條黃河，你已夠熱鬧的了」指出李白詩中多寫黃河流域的繁盛富庶。
