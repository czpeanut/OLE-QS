- id: doc_111_彰化_埔心_國文_g9s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 詞有婉約與豪放之別。婉約之詞，多為閒愁別恨，情感表現含蓄。豪放之詞，不拘曲律，重個性表現，有疏放之氣。下列詞作，何者屬於豪放的作品？
  options:
  - label: A
    content: 春深雨過西湖好，百卉爭妍，蝶亂蜂喧，晴日催花暖欲然
  - label: B
    content: 四十三年，望中猶記、烽火揚州路。可堪回首，佛貍祠下，一片神鴉社鼓。憑誰問：廉頗老矣，尚能飯否
  - label: C
    content: 十年生死兩茫茫，不思量，自難忘。千里孤墳，無處話淒涼。縱使相逢應不識，塵滿面，鬢如霜
  - label: D
    content: 昨夜雨疏風驟，濃睡不消殘酒。試問捲簾人，卻道海棠依舊。知否？知否？應是綠肥紅瘦。
  tags:
