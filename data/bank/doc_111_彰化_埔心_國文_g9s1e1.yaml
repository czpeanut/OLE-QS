- id: doc_111_彰化_埔心_國文_g9s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 「余光中的詩游滑順暢，可以直接把情緒寫出來，我喜歡他滿溢的情緒感。羅智成是能夠造出宇宙般的龐大情境，讓我著迷。我早期很愛模仿他們。林燿德將昆蟲與人造物對比的詩歌技能，比如機械吊臂像螳螂的爪，超驚奇。再往後，辛波絲卡為我示範重複的形式、寫法其實可以很美，持續堆疊同樣的意象本身就有美感。」根據文意，作者提到許多詩人的原因為何？
  options:
  - label: A
    content: 列舉自己喜愛與嫌惡的詩人
  - label: B
    content: 為了評價詩人的藝術成就
  - label: C
    content: 舉出曾經啟發自己的詩人
  - label: D
    content: 討論早期詩人的共通風格。
