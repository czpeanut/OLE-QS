  page: 1
  stem: 「為什麼要苦苦去挽救黃昏呢？／那只是落日的背影／也不必吸盡大澤與長河／那只是落日的倒影／與其窮追蒼茫的暮景／埋沒在紫靄的冷燼／—何不回身揮杖／迎面奔向新綻的旭陽／去探千瓣之光的蕊心？／壯士的前途不在昨夜，在明晨／西奔是徒勞，奔回東方吧／既然是追不上了，就撞上」（余光中）本詩所取材的神話故事為下列何者？
