- id: doc_111_彰化_埔心_國文_g9s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 「東夏口，西武昌，赤壁峭絕當中央。奸雄將軍氣蓋世，敗卒零落慚周郎。得鱸魚，沽美酒，孰若黃州 蘇子瞻，謫向江湖動星斗。噫吁戲！曹公氣勢，蘇子文章，人物銷鑠，塵跡荒涼。惟有江水，千古萬古空流長。」（方孝孺
    赤壁）根據文意，下列敘述何者錯誤？
  options:
  - label: A
    content: 「東夏口，西武昌，赤壁峭絕當中央」呈現赤壁的地理位置
  - label: B
    content: 「奸雄將軍氣蓋世，敗卒零落慚周郎」寫曹操兵敗零落的羞愧
  - label: C
    content: 「孰若黃州 蘇子瞻，謫向江湖動星斗」寫遭貶謫到黃州的蘇轍
  - label: D
    content: 「惟有江水，千古萬古空流長」和「千古興亡多少事？悠悠，不盡長江滾滾流」都有人事滄桑之嘆。
