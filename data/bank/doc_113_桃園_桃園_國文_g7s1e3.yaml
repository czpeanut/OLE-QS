  stem: 根據本文，下列敘述何者最恰當？
  options:
  - label: A
    content: 作者家中留存至今的硯臺價值早已大不如前
  - label: B
    content: 事過多年之後，作者發現端硯並非上選的文具
  - label: C
    content: 作者童年時羨慕同學擁有擲地無聲的塑膠製硯臺
  - label: D
    content: 成年後把玩端硯時，作者遺憾今人只看重硯臺好壞。
  group_stem: '早年曾經跟幾方很過得去的硯臺親近過，惱人的是當年根本不知眼前的硯臺是上選的文具。也許在當年這不算什麼，讀書人家裡總有三、五方石硯，其中總有一兩方是以端石為材吧？這一點現在也無法絕對肯定了，畢竟那幾方用過的硯臺老早就沒了蹤影，特別能夠留下記憶的，是它們的沉重、細潤，還有奇形怪狀。才上小學的孩子，一方硯臺發不發墨、傷不傷筆，於他自是毫不相干。有時還以這種觀念為恥，道理很簡單，別人家的孩子上學，帶的都是一般尺寸一般規格的塑膠硯臺，擲地無聲還會反彈，看到人家表演此等妙技，想想自己書包裡沉甸甸黑漆漆的傢伙，委實氣短。世事之錯誤，有時從這樣的小事也看得出來。或許有人疑惑，你的家人怎肯把上等硯臺給你這個不懂事的小毛頭拿到學校糟蹋？現在想來也不禁啞然，當時家裡好硯臺是有，米缸卻可能是空的，想用硯臺換米，那個年頭根本辦不到。真正的癥結在於買不起塑膠硯臺，卻用得起端硯歙硯。亂世之中什麼怪事都有，這只是最微末的一樁而已。這些小玩意若是能夠留到今天，說不定可以解決一點問題。只是多年來家中老小跌跌撞撞的衝過許多歲月，誰還能管得了這些？歷經戰火的家庭，類此的經驗大多數都有，要說這也算是遺憾，就未免太不識大體了。


    （改寫自亮軒 筆硯船）'
