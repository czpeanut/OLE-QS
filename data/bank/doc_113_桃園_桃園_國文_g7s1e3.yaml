- id: doc_113_桃園_桃園_國文_g7s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 王溢嘉在音樂家與職籃巨星一文中提到：「但很多人可能會認為，要花心血苦練以前，必須先衡量投資報酬率，苦練沒有什麼指望的事情，到頭來也許只是白費心血。這當然有部分的真實性，不過世事往往有出人意表者。」這段話與下列何者相呼應？
  options:
  - label: A
    content: 那當然也是運動天分加上無數的苦練所造就出來的
  - label: B
    content: 喬丹要等到自己長得「夠高」，才加緊練習球技，那可能為時已晚
  - label: C
    content: 在「二軍」參賽時，每場球賽的平均得分高達二十八分
  - label: D
    content: 但是教練還是嫌他「矮」，只讓他當學校代表隊的「二軍」。
  lesson_raw:
    title: 音樂家與職籃巨星
    basis: 題目指明「音樂家與職籃巨星一文中」
