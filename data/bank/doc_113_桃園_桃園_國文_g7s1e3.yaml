- id: doc_113_桃園_桃園_國文_g7s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 兒時記趣一文中運用了「虛實錯間」的手法，把尋常事物幻想成新奇景象，展現作者敏銳的觀察力與豐富的想像力。下列「虛」與「實」的配對，何者正確？
  options:
  - label: A
    content: 私擬作群鶴舞空，心之所向，則或千或百／把雪花紛飛想像成群鶴於空中飛舞
  - label: B
    content: 以叢草為林，蟲蟻為獸／把叢生的小雜草當作樹林，把野獸當作昆蟲螞蟻
  - label: C
    content: 忽有龐然大物，拔山倒樹而來／將癩蝦蟆當作龐然大物，是闖入自己幻想中的小人國天地的不速之客
  - label: D
    content: 作青雲白鶴觀／把煙霧想像成群鶴於空中飛舞。
  lesson_raw:
    title: 兒時記趣
    basis: 題目指明「兒時記趣一文中」
