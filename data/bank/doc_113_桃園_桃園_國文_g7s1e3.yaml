- id: doc_113_桃園_桃園_國文_g7s1e3_s2_28
  section: 2
  number: 28
  type: single
  page: 5
  stem: 若要為本文下一標題，下列何者最符合？
  options:
  - label: A
    content: 日食傳說，北歐神話也有「天狗食日」
  - label: B
    content: 各國神話傳說源自天狗食日
  - label: C
    content: 上天發怒？天狗食日給人民的警訊
  - label: D
    content: 中國古代神話故事的起源。
  group_stem: '古代的中國，日食一直被視為是不祥之兆，往往視為災難的象徵。不過，也讓這樣的天文觀測發源得很早。在中國，最早有歷史紀錄的日食，是西元前1161年的日全食，這次的日食記載於河南
    安陽出土的甲骨文上。其次，在春秋時期的詩經 小雅 十月中，也記載了「十月之交，朔月辛卯，日有食之，亦孔之丑」，據考證，這記錄了西元前776年9月的那次日環食。

    就如大家知道的，古代中國稱日食為「天狗食日」，在古老相傳的神話故事裡，所謂的天狗，有人說是射日的后羿所畜養的獵犬，也有人說是佛教故事「目連救母」裡的目連媽媽變的。但不變的是，凡是看到日食，人們總是要在地面上敲鑼打鼓趕走天狗。

    除了華人世界的「天狗食日」說之外，世界各地也有不同的神話傳說，用來解釋這個天文現象。

    舉例來說，在日本傳統神話裡，將太陽視為是最高神「天照大神」的化身，因此當日食發生時，侍奉太陽神的巫女卑彌呼就會失去神力，受她統治的邪馬台國民眾才利用這個機會殺掉卑彌呼。

    與華人世界的「天狗食日」很類似，在北歐神話裡，蘇爾（Sol）駕馭太陽馬車在天空奔馳，而名為斯庫爾（Skoll）的天狼則是不斷在車後追逐，發生日食，就是斯庫爾追上了蘇爾，人們此時就應該在地面上敲鑼打鼓趕走天狼。但如果有一天斯庫爾一口吞下了太陽，那就是「諸神黃昏（北歐神話裡的世界末日）」的到來。


    （節錄自NOWnews 今日新聞）'
