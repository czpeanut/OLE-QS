- id: doc_113_桃園_桃園_國文_g7s1e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 「所謂『光明的城市』，其實是被光明所汙染的城市。每隔一段時間，我渴望遠離城市，渴望的其實是逃離那被眾人歌頌的、過多的光明事物。」（王溢嘉）關於這段文字，作者想要表達的想法是什麼？
  options:
  - label: A
    content: 城市生活太多汙染，讓人有種快窒息的感覺，想要逃離
  - label: B
    content: 被光明汙染的城市就是沒有隱私的生活，缺乏個人空間
  - label: C
    content: 太過吵雜致使城市生活變調，渴望回到安靜的生活清閒
  - label: D
    content: 光鮮亮麗的城市生活，其實充滿虛假，是被烘托的假象。
  tags:
    textbook: 七上 第九課 音樂家與職籃巨星
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 七上
      subject: 國文
      code: 第九課
      title: 音樂家與職籃巨星
      chapter: null
- id: doc_113_桃園_桃園_國文_g7s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 「夸父與日逐走，入日。渴，欲得飲，飲於河、渭，河、渭不足，北飲大澤。未至，道渴而死。棄其杖，化為鄧林。」這則關於夸父的神話，下列說明何者正確？
  options:
  - label: A
    content: 夸父運用智慧，勝過大自然
