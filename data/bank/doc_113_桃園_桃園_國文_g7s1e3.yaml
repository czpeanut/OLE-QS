- id: doc_113_桃園_桃園_國文_g7s1e3_s2_30
  section: 2
  number: 30
  type: single
  page: 5
  stem: 關於本文的敘述，下列何者正確？
  options:
  - label: A
    content: 作者送老夫婦魚和蔬菜
  - label: B
    content: 老夫婦送作者一雙鞋子
  - label: C
    content: 老夫婦是一對俗不可耐的村民
  - label: D
    content: 作者在庭院中享用晚餐。
  group_stem: '鄰僅老夫婦二人，灌園為業，知余夫婦避暑於此，先來通慇勤①，並釣池魚，摘園蔬為饋②。償③其價不受；芸作鞋報之，始謝而受。時方七月，綠樹蔭濃，水面風來，蟬聲聒④耳；鄰老又為製魚竿，與芸垂釣于柳蔭深處。日落時，登土山，觀晚霞夕照，隨意聯吟，有「獸雲吞落日，弓月彈流星」之句。少焉⑤，月印池中，蟲聲四起，設竹榻於籬下，老嫗⑥報酒溫飯熟，遂就月光對酌，微醺而飯。

    （沈復 避暑記樂）


    ①慇勤：誠意周到。

    ②饋：贈送。

    ③償：報酬。

    ④聒：吵雜。

    ⑤少焉：不久。

    ⑥老嫗：老婦人。嫗，音ㄩˋ。'
