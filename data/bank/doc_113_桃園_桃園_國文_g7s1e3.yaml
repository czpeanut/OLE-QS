- id: doc_113_桃園_桃園_國文_g7s1e3_s2_33
  section: 2
  number: 33
  type: single
  page: 6
  stem: 甲、乙兩則關於盤古的神話，來自於遠古人民對下列何者的理解與想像？
  options:
  - label: A
    content: 宇宙形成，萬物生成
  - label: B
    content: 世事無常，生命脆弱
  - label: C
    content: 晝夜變化，四季推移
  - label: D
    content: 山河劇變，滄海桑田。
  group_stem: '（甲）天地混沌①如雞子②，盤古生其中。萬八千歲，天地開闢，陽清為天，陰濁為地，盤古在其中。一日九變，神於天，聖於地③，天日高一丈，地日厚一丈，盤古日長一丈，如此萬八千歲，天數極高，地數極深，盤古極長。

    （三國 三五曆紀）


    （乙）首生盤古，垂死化身：氣成風雲，聲為雷霆，左眼為日，右眼為月，四肢五體為四極④五嶽，血液為江河，筋脈為地里，肌肉為田土，髮髭⑤為星辰，皮化為草木，齒骨為金石，精髓為珠玉，汗流為雨澤，身之諸蟲，因風所感，化為黎⑥甿⑦。

    （三國 五運歷年紀）


    ①混沌：世界未開闢以前的狀態。

    ②雞子：雞蛋。

    ③神於天，聖於地：比喻盤古的各方面表現高出於天地。

    ④四極：支撐蒼天的四根柱子。

    ⑤髮髭：頭髮和鬍鬚。髭，音ㄗ。

    ⑥黎：民眾。

    ⑦甿：音ㄇㄥˊ，農夫。'
