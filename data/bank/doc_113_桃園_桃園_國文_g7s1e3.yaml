- id: doc_113_桃園_桃園_國文_g7s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 喬丹曾說：「我深信一分耕耘，一分收穫。我做任何事絕不掉以輕心，因為我知道只要一不經心，結果必定大打折扣，所以我把練習視同比賽。我每天重複練習那套已用過幾千次的動作及技巧，我知道只要全力以赴，輸贏都無所謂。」由這段話中「無法」得到下列哪一項啟示？
  options:
  - label: A
    content: 認真是成功的祕訣，粗心是失敗的伴侶
  - label: B
    content: 成大事不在於力量之大小，而在於能堅持多久
  - label: C
    content: 得失無動於衷
  - label: D
    content: 人總是在錯誤中累積經驗。
  tags:
