  section: 7
  number: 36
  type: single
  page: 2
  stem: 36. What does the report say about the world in the future?
  options:
  - label: A
    content: We would live longer in a cold climate.
  - label: B
    content: It encourages the use of clean energy to gain carbon dioxide emission.
  - label: C
    content: We are unable to live in the world because of the rising of sea levels.
  - label: D
    content: It would rise 1.5 degrees of global warming over the next 20 years.
  group_stem: "(A)\nThe Earth Is Getting Warmer Because of Human Activities \nThe\
    \ United Nations Intergovernmental Panel on Climate \nChange (IPCC) said that\
    \ the Earth is warming faster than we \nthought. In the next 20 years, the global\
    \ temperature is likely \nto rise by 1.5 degrees. Human activities are changing\
    \ the \nclimate. Many places in the world have already experienced \nlonger droughts,\
    \ more heatwaves, and more serious heavy \nrain. \nThe IPCC report found that\
    \ between 2011 and 2020, the \nglobal ground temperature was 1.09°C higher than\
    \ it was \nbetween 1850 and 1900. Besides the rising sea levels, \nsummers are\
    \ becoming longer, and winters are becoming \nshorter. These results of climate\
    \ change are not going to \nrecover. \nIn November, the UN Climate Change Conference\
    \ \n(COP26) will have a meeting in Glasgow, UK. Leaders from \n196 countries will\
    \ come together to discuss how to stop \nclimate change. They plan to do something\
    \ important, such \nas ending the use of coal, stopping deforestation, changing\
    \ \nto electric cars, and putting money into clean energy to \nreduce carbon dioxide\
    \ emissions. \n temperature 溫度 degree 度數 drought 旱災 \n result 結果 recover 恢復 deforestation\
    \ 濫伐森林 \n reduce 減少 carbon dioxide emission 碳排放"
  tags:
    textbook: 第四冊（八下）第1次段考範圍
    labeled_by: ai
