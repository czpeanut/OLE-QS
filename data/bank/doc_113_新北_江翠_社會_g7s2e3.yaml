  number: 15
  type: single
  page: 2
  stem: 這份文件呈現出中華民國與美國當時外交關係為何？
  options:
  - label: A
    content: 國共內戰期間，美國停止援助國民黨
  - label: B
    content: 美國與我國簽訂中美共同防禦條約
  - label: C
    content: 八二三炮戰期間，美國軍事協防臺灣
  - label: D
