  type: single
  page: 1
  stem: 第一島鏈是指西太平洋島嶼及其之間的廣泛海域，北起日本群島、琉球群島、中接臺灣，南接菲律賓、大巽他群島至紐西蘭，為美國外交國防政策中圍堵中華人民共和國的第一道防線，因主要為島嶼又呈鏈條形，因而得名。在戰爭爆發時，美國積極促成該島鏈串起，以求防堵共產勢力擴散，為此美國派遣第七艦隊協防臺灣海峽。請問:上述「戰爭」發生於右圖中何處？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
