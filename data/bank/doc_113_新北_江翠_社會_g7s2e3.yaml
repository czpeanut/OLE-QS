- id: doc_113_新北_江翠_社會_g7s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 2025 年開齋節日前在大安森林公園盛大登場，主題為「Eid-al-Fitr in Taipei」「開齋之約 相遇臺北」，穆斯林在齋戒月後，會與親朋好友團聚、享受美食，這一天就像臺灣的過年一樣熱鬧歡騰。台北市政府希望大家能透過品嚐異國美食、欣賞精彩表演，一起來感受這場歡樂盛宴，深入體驗開齋節的文化魅力，請問:這項活動反映了臺灣何種社會風貌？
  options:
  - label: A
    content: 傳統文化衰退
  - label: B
    content: 外來文化逐漸融入臺灣社會
  - label: C
    content: 社會運動發達
  - label: D
    content: 美國文化盛行。
