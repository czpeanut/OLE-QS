  section: 1
  number: 10
  type: single
  page: 2
  stem: 1980 年代初期，臺灣電影受到香港電影新浪潮的影響，進入「臺灣新電影」時期。「新電影」發展初期的導演與編劇，在劇本創作上融入鄉土文學的題材，拍攝風格以強調自然、寫實為主，《兒子的大玩偶》即為「新電影」初期的代表作，請問:「新電影」發展之初，最可能以下列何者作為電影題材？
  options:
  - label: A
    content: 關注一般農民、勞工等小人物生活中的困頓
  - label: B
    content: 宣揚政府推行南進政策所帶來的經濟成就
  - label: C
    content: 受到美援影響，將美國流行文化作為劇情主軸
  - label: D
    content: 重視原住民文化，發揚原住民族音樂與神話傳說。
