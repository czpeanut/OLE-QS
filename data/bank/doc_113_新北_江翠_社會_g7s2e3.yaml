- id: doc_113_新北_江翠_社會_g7s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 臺灣的飲食習慣在過去幾十年來發生了顯著變化，特別是米飯消費量的下降與麵食的增加。請問:臺灣飲食習慣的改變與下列何者有關？
  options:
  - label: A
    content: 日本推銷小麥，導致臺灣將麵食取代稻米作為主食
  - label: B
    content: 美國在美援期間，主要向臺灣提供番薯以促進糧食安全
  - label: C
    content: 美國輸入大量麵粉，成立麵食推廣委員會，改變了臺灣以稻米為主的飲食習慣
  - label: D
    content: 兩岸大三通以後，臺灣的主食從稻米轉向麵食。
