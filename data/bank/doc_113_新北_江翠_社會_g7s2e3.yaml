  - label: D
    content: 為突破外交困境，中華民國改採彈性外交政策。
  group_stem: '※請閱讀下列資料並回答問題。


    資料一   在這場會議中表決「恢復中華人民共和國權利案」，結果七十六票贊成、三十五票反對、十七票棄權、三票缺席，最終形成《二七五八號決議文》，其內容提到：「……恢復中華人民共和國的所有權利，承認其政府的代表為中國駐聯合國的唯一合法代表，並立即將蔣介石的代表逐出他們在聯合國與其所有附屬組織非法占有的席位。」

    資料來源：聯合國大會第2758 號決議文'
