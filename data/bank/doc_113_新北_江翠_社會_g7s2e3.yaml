  page: 1
  stem: 孫伯伯於民國 38 年隨中華民國政府遷來臺灣，在與中國大陸的家人分開將近 40 年後，政府終於開放民眾赴中國大陸探親，他立刻辦理手續，在臺灣子女的陪同下展開探親之旅。在探親過程中，他的子女不幸遭遇交通事故，請問他可向處理兩岸事務的哪一民間機構尋求協助？
