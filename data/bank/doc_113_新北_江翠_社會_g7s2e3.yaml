  number: 7
  type: single
  page: 1
  stem: 2023 年以來的以巴戰爭尚未結束，以色列、伊朗近日又爆發大規模衝突，中東戰事升溫，油價也再度飆升。回顧歷史，民國60 年代中東地區亦曾爆發戰爭，導致國際能源危機，對臺灣經濟造成嚴重衝擊，請問:當時政府的因應措施為何？
  options:
  - label: A
    content: 政府推動十大建設，提供就業機會
  - label: B
    content: 設立新竹科學工業園區，發展高科技產業
  - label: C
    content: 發展輕工業，成為亞洲四小龍之一
  - label: D
    content: 臺灣走向自由化與國際化，加入世界貿易組織。
