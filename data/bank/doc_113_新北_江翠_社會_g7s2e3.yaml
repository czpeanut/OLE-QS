- id: doc_113_新北_江翠_社會_g7s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 1960 年代起，吃苦耐勞的女工成為臺灣經濟發展的主角，這些女工一輩子從事機械式的工作，絕大多數都是小學或國中畢業就到工廠上班，用青春換取家裡的經濟改善，把自己的「機緣留在門外，將青春嫁給輸送帶」，沒有加班費、沒有休假、沒有勞工運動的保障，但是女工們展現了無比堅韌的生命力，創造了臺灣的經濟奇蹟。請問:1960
    年代臺灣的經濟發展有何特點？
  options:
  - label: A
    content: 美國看中臺灣女工的產能，大力延攬女性成為臺灣移工
  - label: B
    content: 為發展重化工業，政府透過建設奠定重工業基礎，健全投資環境
  - label: C
    content: 政府積極展開土地改革，提高自耕農的生產意願，增加國家財富
  - label: D
    content: 鼓勵中小企業投資，設立加工出口區以吸引外資，並導入新技術。
  tags:
    chapter:
      publisher: 康軒
      book: 七下
      subject: 歷史
      code: 6-1
      title: 經濟變遷
      chapter: null
    textbook: 七下歷史 6-1 經濟變遷
    labeled_by: ai
