  section: 1
  number: 8
  type: single
  page: 1
  stem: 隨著臺灣經濟不斷成長，農、漁等產業在經濟結構中的重要性日益下降。為改善上述現象，近年來，政府透過什麼措施來提振傳統農、漁產業？
  options:
  - label: A
    content: 鼓勵鄉村青年前往都市就業
  - label: B
