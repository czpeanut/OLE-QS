  group_stem: '三九五二，是你高貴的身材

    白首天際是山族的至尊

    一切仰望和指點的焦點

    最早的金暾，最晚的赤霞

    唯你崢崢的絕頂獨戴

    黑熊和石虎豈敢高攀

    耐寒的圓柏都已放棄

