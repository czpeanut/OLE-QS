  group_stem: '漢愍帝之季年①，東都大旱，野草皆焦，昆明之池竭。洛巫謂其父老曰：「南山之湫②有靈物，可起也。」父老曰：「是蛟也，弗可用也，雖得雨必有後憂。」眾曰：「今旱極矣，人如坐爐炭，朝不謀夕，其暇計後憂乎？」乃召洛巫與如湫，禱而起之。酒未畢三奠，蛟蜿蜒出，有風隨之，颼颼然山谷皆殷③，有頃，雷雨大至，木盡拔，彌三日不止，伊、洛、瀍、澗皆溢，東都大困，始悔不用其父老之言。
    劉基《郁離子》

    ①季年：晚年、末年②湫：水池③殷：震動'
