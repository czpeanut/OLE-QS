  - label: B
    content: 乙詩屬仄起式，「未休兵」與「戍鼓斷人行」呼應
  - label: C
    content: 甲詩四聯皆對仗工整，是一首五言律詩
  - label: D
    content: 乙詩共有三聯對仗，運用抒情到寫景的鋪排。
  group_stem: '【甲】海上生明月，天涯共此時。

    情人怨遙夜，竟夕起相思。

    滅燭憐光滿，披衣覺露滋。

    不堪盈手贈，還寢夢佳期。

    張九齡〈望月遠懷〉

    【乙】戍鼓斷人行，邊秋一雁聲。

    露從今夜白，月是故鄉明。

    有弟皆分散，無家問死生，

    寄書長不達，況乃未休兵。

    杜甫〈月夜憶舍弟〉'
