- id: doc_112_台北_仁愛_國文_g7s2e3_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: '「同義複詞」是由意義相同的兩個字組合而成；「反義複詞」是由意義相反的兩個字組合而成，但兩字意義皆取用；「偏義複詞」是兩個字只取一字的意義。請依據以下例句，選出敘述正確的選項：

    (甲) 希望在晚宴上，大家都能「賓主」盡歡

    (乙) 教室裡鴉雀無聲，一點「動靜」也沒有

    (丙) 酒後「駕駛」是危險的行為

    (丁) 司法判決應公正無私，不宜「異同」

    (戊) 人生滋味如人飲水，「冷暖」自知

    (己) 詐騙集團就是利用人性的「貪婪」面

    (庚) 前鋒今夜潛入敵營一探對方「虛實」

    (辛) 與其「詛咒」黑暗，不如找尋光亮'
  options:
  - label: A
    content: 甲乙丙皆為「反義複詞」
  - label: B
    content: 甲己庚皆為「同義複詞」
  - label: C
    content: 丙戊辛皆為「同義複詞」
  - label: D
    content: 乙丁庚皆為「偏義複詞」
  tags:
    textbook: 第二冊（七下）第3次段考範圍
    labeled_by: ai
