  group_stem: 'Before we talk about CPR, let''s first learn what "cardiac arrest"
    means. Cardiac arrest happens when a person''s heart stops working. This is a
    very serious problem because, without the heart pumping, brain cells can start
    to die quickly. To help save a person''s life during cardiac arrest, the first
    thing we need to do is do CPR.

    Unluckily, many people do not know how to do CPR. This means that many people
    do not know what they can do if someone needs help, which may cause many deaths
    from cardiac arrest. In the United States, more than 320,000 people die from cardiac
    arrest each year outside of hospitals. About 70% of these cases happen at home.
    This shows that cardiac arrest can happen to anyone, anywhere, and at any time.
    Because of these facts, it is important for everyone to learn how to do CPR, even
    kids. Learning CPR is not just for doctors or experts; anyone can do it with some
    training.

    Finding a CPR class is not difficult. Many schools, hospitals, and fire stations
    have CPR courses. Signing up for one of these classes is a simple way to learn
    this important lesson. When we see someone having cardiac arrest, it is our job
    to help them. Remember, their lives are in our hands. By learning CPR, we can
    be ready to give a hand at any time.

