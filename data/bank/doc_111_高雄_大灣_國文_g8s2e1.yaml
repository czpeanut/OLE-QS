  stem: OpenAI 執行長奧特曼（Sam Altman）認為「當AI 日益強大，人類許多勞務價格將降到零」，請問這句話的涵義為何？
  options:
  - label: A
    content: 因為AI 的普及，勞務性工作將由AI 取代，勞務價格將不再值錢
  - label: B
    content: 因為AI 強大，勞務價格將降到零，所以人類可以做更多有意義的事
  - label: C
    content: 在AI 的世界，一切都有AI 機器人協助勞務，人類只需要研究控制AI 的價格
  - label: D
    content: 人類因AI 而不需要再做勞務性工作，當勞務價格降至到零時，將實現科技化世界的夢想。
