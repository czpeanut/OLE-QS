  stem: '下列關於樂府詩和古詩的說明，何者正確？

    | | 樂府詩 | 古詩 |

    | :--- | :--- | :--- |

    | 音樂性 | (A)不入樂，可吟誦 | 不入樂，不可歌 |

    | 句式 | (B)多長短句，句數不拘 | 多五七言，亦有六言雜言 |

    | 作者 | 多民間作品 | 多士大夫之作 |

    | 對仗 | 不論 | (C)一定要對仗 |

    | 平仄 | 不論 | 不論 |

    | 押韻 | 可換韻腳 | (D)一韻到底 |'
  options:
  - label: A
    content: 音樂性：樂府詩不入樂，可吟誦／古詩不入樂，不可歌
  - label: B
    content: 句式：樂府詩多長短句，句數不拘／古詩多五七言，亦有六言雜言
  - label: C
    content: 對仗：樂府詩不論／古詩一定要對仗
  - label: D
    content: 押韻：樂府詩可換韻腳／古詩一韻到底
