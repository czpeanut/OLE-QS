- id: doc_111_高雄_大灣_國文_g8s2e1_s1_39
  section: 1
  number: 39
  type: single
  page: 6
  stem: 根據文章內容，請問下列何人說明有誤？
  options:
  - label: A
    content: 櫻木：ChatGPT 不僅可以幫我寫論文，而且能陪我聊天
  - label: B
    content: 赤木：可以利用ChatGPT1 幫忙企劃籃球隊迎新活動
  - label: C
    content: 晴子：這一次的畢業劇本及音樂，就交給ChatGPT 來協助創作
  - label: D
    content: 木暮：ChatGPT 並非萬能，只要擁有重複性、操作性的工作就不會被AI 取代。
  group_stem: 'ChatGPT 是什麼？

    聊天生成型預訓練變換模型（Chat Generative Pre-trained Transformer）簡稱ChatGPT，是OpenAI 開發的人工智慧聊天機器人程式，於2022
    年11 月推出，上線兩個月後已有上億使用者。ChatGPT 目前仍以文字方式互動為主，其次可以用於複雜的語言工作，包括自動生成文字、自動問答、自動摘要等多種任務。如：在自動文字生成方面，ChatGPT
    可以根據輸入的文字，自動生成類似的文字（劇本、歌曲、企劃等），在自動問答方面，ChatGPT可以根據輸入的問題自動生成答案。還有編寫和除錯電腦程式的能力。

    ChatGPT 可寫出相似真人的文章，並在許多知識領域給出詳細且清晰的回答而迅速獲得關注，證明了從前認為AI注不會取代的知識型工作它也足以勝任，對金融與白領人力市場的衝擊相當大，但也認為事實準確度參差不齊是其重大缺陷，並認為基於意識形態的模型訓練結果須小心校正。

    ChatGPT 等生成式AI注應用陸續爆紅，讓不少人憂心，是否白領上班族的工作機會將迅速被取代？若是真的，哪類工作最快被消滅？

    創新工場李開復在ChatGPT 來臨後，人們要選擇職涯，有幾種工作得避開，否則恐很快被AI注淘汰，如：電話銷售員、客服、倉庫工人、電話接線生、收銀員、速食店員、洗碗工、生產線品管師、快遞員、保全員、卡車司機、放射科醫師等工作。

    注AI：人工智慧'
