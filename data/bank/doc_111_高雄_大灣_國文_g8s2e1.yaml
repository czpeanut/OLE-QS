- id: doc_111_高雄_大灣_國文_g8s2e1_s1_36
  section: 1
  number: 36
  type: single
  page: 5
  stem: 根據上文及聯合國SDGs 永續發展的17 項核心目標推論何者說明有誤？
  options:
  - label: A
    content: 聯合國成立於1945 年，MDGs 是其史上最重要的全球發展目標
  - label: B
    content: SDGs 設立是延續MDGs 的精神而來，為了解決所有國家都面臨的問題而提出的指導原則
  - label: C
    content: 2030 前是SDGs 永續發展的最後期限，對於未來的我們僅有7 年的時間解決問題
  - label: D
    content: SDGs 有17 項核心目標及169 項細項指標，兼顧了經濟成長、社會進步與環境保護三大面向。
  group_stem: '如果我們要追求一個更美好、更永續的環境，該怎麼做呢？2000年千禧年，聯合國就曾設定千年發展目標（MDGs），此目標側重於消除極端貧困、飢餓和可預防的疾病，是聯合國歷史上最重要的全球發展目標。而延續而來的SDGs目標，除了繼續改善世界上極端貧窮的困境，亦關注社會公平發展，以及減緩因為人為因素使得氣候變遷加劇的處境。設立SDGs，除了在眾聲嘈雜之中給予全球一個能夠共同前往的目標，也能夠透過群體聲量，製造同儕壓力，不論各國發展狀況如何，都能清楚知道，這些指標是全球多數國家一致期待的世界模樣。

    （SustainableDevelopment Goals,SDGs），我們是有機會做到的！2015聯合國成立70週年之際，世界領袖們齊聚聯合國紐約總部，舉行「聯合國發展高峰會」，發佈了《翻轉我們的世界：2030年永續發展方針》。這份方針提出了所有國家都面臨的問題，並基於積極實踐平等與人權，規畫以下17項永續發展目標及169項細項指標，作為未來15年內（2030年以前），成員國跨國合作的指導原則。


    圖：聯合國SDGs 永續發展的17 項核心目標'
