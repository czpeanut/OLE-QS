- id: doc_111_高雄_大灣_國文_g8s2e1_s1_37
  section: 1
  number: 37
  type: single
  page: 6
  stem: 根據本則新聞，王姓男子散布的訊息，依照美國First Draft 組織定義的七種假訊息形式，應屬下列何種內容？
  options:
  - label: A
    content: 諷刺模仿
  - label: B
    content: 誤導內容
  - label: C
    content: 捏造內容
  - label: D
    content: 錯誤情境。
  group_stem: '嘉義王姓男子日前在 LINE 的社團群組中，見林男發布「嘉義有人確診」、「是博愛路某老闆」等新冠肺炎疫情不實訊息，立即分享到其他社團給友人閱覽，經檢察官偵辦後依違反「嚴重特殊傳染性肺炎防治及紓困振興特別條例」，申請簡易判決處4
    萬元罰金，如易服勞役1000 元折算一日，不服判決可上訴。嘉義地檢署主任檢察官蔡英俊表示，本案原社團中涉嫌傳出訊息的林姓男子，目前仍在偵辦中，也呼籲民眾，任何有關新冠肺炎訊息，都應參見衛福部所發訊息，相關訊息應妥善查證，不可隨意轉傳。本案經他人截圖檢舉，檢警偵查發現，王男傳訊時間為3
    月21 日中午，但嘉義市3 月26 日才有第1 例確診案例，認定王姓男子涉嫌散播疫情不實訊息：王偵訊中也坦承犯行，但表示主要是為提醒防疫，並非刻意亂傳訊息。
    (節錄自聯合報)

    假訊息類型：美國的First Draft 是一個處理假訊息的非營利組織，該組識定義了假訊息的七種形式，分別為：

    1.諷刺模仿：設計對白消遣某個名人。

    2.誤導內容：斷章取義，扭曲原本的意思。

    3.圖文不符：標題或圖片與內文不符。

    4.偽裝內容：假冒消息的來源，讓人誤以為有所根據。

    5.錯誤情境：張冠李戴，產生誤會。

    6.捏造內容：惡意捏造，完全不是事實。

    7.操弄內容：惡意操弄事實，誇大原本的事件。'
