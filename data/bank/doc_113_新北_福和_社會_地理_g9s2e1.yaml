- id: doc_113_新北_福和_社會_地理_g9s2e1_s2_14
  section: 2
  number: 14
  type: single
  page: 2
  stem: 依據上文敘述對於『八尺門』地名取名的由來，與下列哪一個地名可能最為相似？
  options:
  - label: A
    content: 桃園市中壢區
  - label: B
    content: 南投縣信義鄉
  - label: C
    content: 澎湖縣馬公市
  - label: D
    content: 屏東縣林邊鄉。
  group_stem: '西元2023 年由網路串流平臺所推出的臺劇《八尺門的辯護人》，故事的開端為「平春16 號」□□族船長一家三口滅門命案，但同樣是當地□□族人的公設辯護人佟寶駒竟被法院安排替嫌犯進行辯護，引起族人的不滿。兇嫌是該船一名逃逸的印尼籍漁工阿甘，阿甘將船長對他平時虐待的方式用在船長的女兒，導致誤殺後因過度恐懼而滅船長全家。藉由劇情來探討原住民與移工在臺灣社會上與司法上是否受到公平合理的對待？以及當時臺灣十分爭議議題否要廢除死刑？

    『八尺門』是今日基隆市中正區的正濱里，基隆港的出入門戶，連接和平島與臺灣本島間唯一的水道，『八尺』則是用來形容該水道十分狹窄，如同海門而得名。當地原本主要居住著凱達格蘭族人，當地歷經西班牙、荷蘭、鄭氏政權的統治，逐漸形成漢人、原住民混居的聚落。1960
    年代，一些□□族人陸續從花東緃谷平原遷徙至此，形成違章建築聚落。據統計，西元1984 年該地已經有650 位左右的居民，其中□□族人占大多數，加上少數的布農族和漢人。西元1991
    年，基隆市市政府為了拆遷該地違章建築與當地居民進行協商，尚無共識時突然發生大火，之後市政府順利拆遷改建為「海濱國宅」。「海濱國宅」擁有其歷史背景及產業因素，涉及原住民、外籍漁工等社會的敏感議題，成為劇中的重要場景之一。'
