  stem: 依據文章內容，故事主角印尼籍的漁工在從事捕撈時，常遭到船長的不諒解而遭虐待，下列何者可能是原因之一？
  options:
  - label: A
    content: 阿甘因為信仰要往麥加的方向禮拜五次，常沒有配合大家一起捕撈魚群
  - label: B
    content: 阿甘因為挑食，只吃打拋豬肉、咖哩豬肉的料理包，不肯吃魚罐頭料理
  - label: C
    content: 阿甘因為臺灣的氣候，經常中暑而臥病在床，病假太多無法一起好好工作
  - label: D
    content: 阿甘因為外籍的身份，他的工資遠遠高過其他本國籍船員，引人嫉妒與不滿。
