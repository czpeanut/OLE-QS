  section: 2
  number: 12
  type: single
  page: 2
  stem: 中南部有許多地名叫『水底寮』，過去人們會利用乾旱期在野溪上搭建簡易工寮，方便種植西瓜、蔬菜等。這些中南部早期先民利用乾涸河床從事開墾，最有可能是在哪一個季節較利於耕種？
  options:
  - label: A
    content: 春末夏初
  - label: B
    content: 梅雨季節
  - label: C
    content: 盛夏時節
  - label: D
    content: 冬末春初。
  group_stem: 『寮』是指早期農業社會中，人們在外開墾或捕獵等經濟活動時所搭建簡易建物。在屏東通往墾丁的路上有一個傳統聚落『水底寮』，以前是東西部交通的轉運站，前往東部的旅客通常在此過夜才能搭乘巴士前往臺東。如今，『水底寮』不復熱鬧，只能在老街上看著斑駁的商行招牌，緬懷往日風華。請回答下列問題。
