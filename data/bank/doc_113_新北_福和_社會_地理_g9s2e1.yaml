- id: doc_113_新北_福和_社會_地理_g9s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '同一地名，不同時期所涵蓋的空間範圍可能不一樣。下列稱呼『臺灣』的文字中，何者所涵蓋的空間範圍最大？

    (甲)荷蘭東印度公司於不受明朝政府管轄的『臺灣』，建立信史上第一個統治政權

    (乙)清代康熙年間福建火藥庫火災，因火藥所需硫磺在福建並無產地，故郁永河自告奮勇前往硫磺產地『臺灣』採硫

    (丙)2021 年東京奧運挑戰疫情完美落幕，『臺灣』獲得2 金、4 銀、6 銅的好成績，大幅超過原先預期，可謂獎牌大豐收！'
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 一樣大。
