- id: doc_113_新北_福和_社會_地理_g9s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 「在漢人來開墾之前，這個臺灣島最南的地區多是平埔族馬卡道族『阿猴社』的聚落範圍，因此稱為『阿猴』。後來到了日治初期，日本人覺得『阿猴』拿來當城市名實在是太不文明了，就將『阿猴』改為『阿緱』。最後在行政區的重劃過程中，日本人才以方位改名為現在的名稱。」文中所指的地區『阿緱』最可能的現在名稱為何？
  options:
  - label: A
    content: 南港
  - label: B
    content: 屏東
  - label: C
    content: 關西
  - label: D
    content: 中和。
