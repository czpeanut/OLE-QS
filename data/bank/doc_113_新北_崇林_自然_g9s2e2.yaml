  page: 1
  stem: 關於磁鐵特性的敘述，下列何者錯誤？
  options:
  - label: A
    content: 將磁鐵的磁極靠近鐵製迴紋針，可使迴紋針產生磁性
  - label: B
    content: 磁力線是封閉的平滑曲線，任兩磁力線絕不相交
