  page: 1
  stem: 右圖為接有檢流計的圓形線圈，當移動磁棒時，關於檢流計指針偏轉方向的敘述，何者正確？
  options:
  - label: A
    content: 檢流計指針偏轉表示線圈產生感應電流
  - label: B
    content: 當磁棒S極進出線圈時，檢流計指針不會偏轉
  - label: C
    content: 磁棒進出線圈的速率愈快，檢流計指針偏轉角度愈小
  - label: D
    content: 若磁棒靜止不動，改以線圈靠近磁棒時，則檢流計指針不會偏轉。
