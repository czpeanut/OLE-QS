  stem: 下列敘述何者正確？
  options:
  - label: A
    content: 磁力作用所及的空間分布在平面上
  - label: B
    content: 鐵製迴紋針被磁化後無法長期保有磁性
  - label: C
    content: 不具磁性的鐵釘，靠近磁鐵的一端，會被磁化成同名極
  - label: D
    content: 斷裂的磁鐵磁性會消失。
- id: doc_113_新北_崇林_自然_g9s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '小立取一漆包線製成螺線形線圈，刮除兩端的表漆後連接檢流計，接著將一磁棒靠近線圈的一端，測量感應電流，完成一次實驗，實驗裝置如圖所示。他想了解有哪些變因會影響電磁感應的效果，於是依附表操作實驗
    1～6，並記錄感應電流平均值。


    | 實驗 | 螺線形線圈長度（cm） | 螺線形線圈總圈數 | 漆包線粗細 | 感應電流平均值（mA） |

    | :---: | :---: | :---: | :---: | :---: |

    | 1 | 10 | 1000 | 細 | 30 |

    | 2 | 10 | 1000 | 粗 | 34 |

    | 3 | 10 | 2000 | 粗 | 50 |

    | 4 | 15 | 1000 | 細 | 25 |

    | 5 | 15 | 1000 | 粗 | 28 |

    | 6 | 15 | 1500 | 粗 | 34 |


    ※磁棒靠近線圈的速率固定為 v


    試問從實驗數據可以做出下列哪一項推論？'
  options:
  - label: A
    content: 由實驗1 與實驗2 可得知：使用較粗的漆包線會產生較大的感應電流
  - label: B
    content: 由實驗1 與實驗5 可得知：螺線形線圈長度愈短，產生的感應電流愈大
  - label: C
    content: 由實驗3 與實驗6 可得知：螺線形線圈總圈數愈多，產生的感應電流愈大
  - label: D
    content: 由實驗2 與實驗6 可得知：螺線形線圈長度和總圈數不會影響產生的感應電流大小。
  assets:
  - key: s1_2_f1
    kind: figure
    file: doc_113_新北_崇林_自然_g9s2e2/s1_2_f1.png
- id: doc_113_新北_崇林_自然_g9s2e2_s1_3
