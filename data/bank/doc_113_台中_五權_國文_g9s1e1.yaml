- id: doc_113_台中_五權_國文_g9s1e1_s3_33
  section: 3
  number: 33
  type: single
  page: 4
  stem: '宋朝時，坊市制已經瓦解，夜禁也鬆弛下來，街市上到處都是商鋪，城市的夜生活非常豐富。出遠門也不需要開具路引，遷徙自由。只有進出要塞的關禁時，才需要辦理「公憑」（通行證）。良賤制度在宋代也趨於解體，除了少數官妓之外，所有國民都是法律意義上的自由民，具有平等的法律身分。

    兄弟影視將著手拍攝李清照傳，若根據上文，下列場景何者最符合當時文化背景？'
  options:
  - label: A
    content: 因布帛鋪將在傍晚歇業，清照趕緊出門購買
  - label: B
    content: 若清照想去南方城鎮，須先向官府呈報行程
  - label: C
    content: 通過有管制的要塞時，清照需交付巨額金錢
  - label: D
