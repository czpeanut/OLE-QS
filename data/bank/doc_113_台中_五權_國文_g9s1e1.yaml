  group_stem: "(三)\n            西江月    宋．張孝祥\n  問訊湖邊春色，重來又是三年。\n  東風吹我過湖船，楊柳絲絲拂面。\n\
    \  世路如今已慣，此心到處悠然。\n  寒光亭下水如天，飛起沙鷗一片。\n【詞場曼話】\n  張孝祥（西元一一三三～一一七○年），自幼聰慧，讀書過目不忘，他在偏安的南宋朝廷為官，於荊州任安撫使時，修築金堤，為百姓解除了深以為苦的水患，很受地方愛戴。凡是孝祥所到之處，皆有政聲，可惜三十八歲英年早逝，令當時人同感哀痛。他的文章俊逸，才思敏捷。詞風豪放，常有感懷時事之作。清曠飄逸的情調，與蘇東坡相類似。這闋西江月，是路過江蘇\
    \ 溧陽縣的三塔寺時所作，也是張孝祥的代表作。\n  問候著湖上的無邊春色，那些充滿生機的綠意盎然，這次重新造訪已是三年之後了。溫暖的東風，將我的小船吹到湖的另一邊，柔軟的楊柳絲也像故人似的輕輕拂面。人世間的種種坎坷滄桑，或許曾令人難以承受，如今卻漸漸習以為常了。無論飄流何處，無論經歷怎樣的考驗，都能保持悠然自在的心態。憩息在寒光亭下，水面平靜無波時，與天色竟如此相似，在這樣的寧謐之中，忽然一群白鷗飛起，劃過湖水而去。\n\
    \  「世路如今已慣，此心到處悠然」，我常想著，要經過多少年的歲月，要承受多少無情的試煉，我們對於生命中的悲歡離合才能無動於衷呢？如同一個行路的人，看見悲哀如同泉水，能汲泉而啜，滋潤乾渴的心靈；看見怨忿如同奔瀑，能屏息靜觀，安頓許多紛雜的思緒。於是，再不畏懼傷害了，因為可以包容一切，涵納所有。如果可以許願，願我年老的時候，能有這樣的胸襟，達到這樣的境界。\n\
    \                          （選自時光詞場 麥田出版公司）"
