  stem: 關於辛棄疾 南鄉子的說明，下列何者敘述正確？
  options:
  - label: A
    content: 藉歌頌孫權，暗諷當朝朝廷的無能，也抒發自我的壯志未酬之慨
  - label: B
    content: 「滿眼風光北固樓」描寫國家山川風光，也隱含了對國家的自豪
  - label: C
    content: 「悠悠，不盡長江滾滾流」由登樓而聯想，發出「浪淘盡，千古風流人物」之感慨，由情映景
  - label: D
    content: 以「年少萬兜鍪」一句盛讚劉備，點出其年少有為，具非凡膽識
