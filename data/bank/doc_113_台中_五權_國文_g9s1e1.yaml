  section: 1
  number: 10
  type: single
  page: 1
  stem: 黑與白――虎鯨：「八月十五日午後，對南方海域的期待好不容易等到今天才綻露曙光，我難得那樣肯定，也不徵詢船上其他人意見，直直說出：『駛出去，巡一趟再回去！』」根據本段文句，可推知下列何者？
  options:
  - label: A
    content: 作者對於今天的行程仍有所存疑
  - label: B
    content: 作者做事情不喜歡徵詢其他人意見
  - label: C
    content: 八月十五這天讓作者覺得有成功希望
  - label: D
    content: 最後由作者親自駕船巡視南方海域
