  stem: 下列文句皆摘自廖鴻基的作品，對於修辭法的使用說明，何者正確？
  options:
  - label: A
    content: 鏢臺起伏搖擺著夢一樣的節奏：轉化
  - label: B
    content: 觸鬚飄垂如吊燈懸掛的裝飾：摹寫
  - label: C
