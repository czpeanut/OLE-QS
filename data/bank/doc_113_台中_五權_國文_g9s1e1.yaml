  number: 3
  type: single
  page: 1
  stem: 關於飛瀑詩句的解讀，下列說明何者不正確？
  options:
  - label: A
    content: 卻攔不住我／向一個出海口／奔騰而去的決心→暗諷匹夫之勇的荒謬，提醒世人做事須三思
  - label: B
    content: 不是失足更不是自盡／一路從上游奔騰而來／是來赴懸崖的挑戰→寫出水流奔赴懸崖，展現出昂揚無懼的氣勢
  - label: C
    content: 那一堆獰怪的亂石／全在那下面等我／要把我撞傷、撞碎／撞成飛沫和漩渦→藉由亂石象徵阻礙追求人生目標上的障礙物
  - label: D
    content: 飛吧，轟動千山的一縱／把生命揚在半空／乘著最透徹的一刻／已往和未來斷然一割→寫水流奔下懸崖形成飛瀑，顯現其果斷決心與堅定的意志
  lesson_raw:
