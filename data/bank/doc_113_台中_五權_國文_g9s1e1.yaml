- id: doc_113_台中_五權_國文_g9s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 黑與白――虎鯨一文中，「牠們和船隻、我們之間沒有間隔距離，以牠們的能力，要把我們撂到船下並不困難，整個接觸過程中，牠們不曾稍稍顯露任何惡意。反而，是我們曾經疑懼、曾經誤解善意、曾經躑躅不敢真情表露友誼。」這段文字的主旨，下列說明何者正確？
  options:
  - label: A
    content: 人類的躑躅與疑懼傷害了虎鯨，使牠們不相信人類
  - label: B
    content: 虎鯨喜愛與船隻惡作劇，常讓人類誤解其為惡意
  - label: C
    content: 說明在虎鯨的猛烈攻勢下，人類幾乎無法抵擋
  - label: D
    content: 以虎鯨的真誠直率凸顯人類的遲疑與裹足不前
  lesson_raw:
    title: 黑與白――虎鯨
    basis: 題目指明出自黑與白――虎鯨
