  stem: 黑與白――虎鯨：「船頭浪花切切迎風翻飛，鏢臺起伏搖擺著夢一樣的節奏。辨認是虎鯨後的過度真實反而拉開了真實。」關於本段文字，下列說明何者最適當？
  options:
  - label: A
    content: 表現出海象險惡的狀況，體現討海人對生命感到無常的一面
  - label: B
    content: 作者對於海洋十分喜愛，連做夢都會夢到開船出海找尋鯨豚
  - label: C
    content: 作者一心只想遇到虎鯨，因而預想與虎鯨相遇時的美好景象
  - label: D
    content: 作者因見到虎鯨，心中的喜悅之情讓眼前所見皆美好且夢幻
  lesson_raw:
    title: 黑與白――虎鯨
    basis: 題目指明出自黑與白――虎鯨
