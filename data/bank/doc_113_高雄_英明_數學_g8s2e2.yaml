  number: 2
  type: single
  page: 1
  stem: '以尺規作圖作出一個45°角的步驟如下，則正確的順序為何？

    (甲) 在直線$L$ 上任取$P$、$Q$ 兩點

    (乙) 過$P$ 作$\overleftrightarrow{PR} \perp \overleftrightarrow{PQ}$

    (丙) 作一直線$L$

    (丁) 作$\angle RPQ$ 的角平分線$\overline{PS}$，則$\angle SPQ$＝45°即為所求'
  options:
  - label: A
    content: 甲→乙→丙→丁
  - label: B
    content: 甲→丙→乙→丁
  - label: C
    content: 丙→甲→乙→丁
  - label: D
    content: 丙→甲→丁→乙
