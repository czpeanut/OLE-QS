  stem: '如右圖，已知四邊形$ABCD$，下列$P$、$Q$、$R$、$S$ 四個點中，哪一點到$A$ 點、$D$ 點距離等長，且該點到$\overline{AD}$、$\overline{CD}$
    的距離也相等？

