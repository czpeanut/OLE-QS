    $Q$ 點：$\angle C$ 角平分線與$\overline{CD}$ 中垂線的交點

    $R$ 點：$\angle D$ 角平分線與$\overline{AD}$ 中垂線的交點

    $S$ 點：$\angle D$ 角平分線與$\overline{CD}$ 中垂線的交點'
  options:
