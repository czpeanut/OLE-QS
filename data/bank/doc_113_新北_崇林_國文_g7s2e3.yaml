    別紙^(1)累幅^(2)過當，老病廢忘，豈堪^(3)英俊^(4)如此責望^(5)邪。少年應科目時，記錄名數沿革及題目等^(6)，大略與近歲應舉^(7)者同爾。亦有少節目文字^(8)，才塵忝後^(9)，便被舉主^(10)取去，今皆無有，然亦無用也。實無捷徑必得之術。但如君高才強力，積學數年，自有可得之道，而其實皆命也。但卑意欲少年為學者，每一書皆作數過盡之。書富如入海，百貨皆有，人之精力，不能兼收盡取，但得其所欲求者爾。故願學者每次作一意求之。如欲求古今興亡治亂、聖賢作用、但作此意求之，勿生余念。又別作一次，求事跡故實典章文物之類，亦如之。他皆仿此。此雖迂鈍，而他日學成，八面受敵^(11)，與涉獵者不可同日而語也。甚非速化之術。可笑可笑。──〈又答王庠書〉蘇軾

    註：(1)別紙：指王庠來信中的附箋。(2)累幅：幾頁文字。(3)堪：擔當，承當。(4)英俊：氣概才能不凡的年輕人，指代王庠。(5)責望：期望，要求。(6)名數沿革及題目等：指為了應科舉必須死記的一些東西。(7)應舉：參加科舉考試。(8)節目文字：指應試時較難較大的題目。《禮記‧學記》載：「善問者如攻堅木，先其易者，後其節目。」(9)才塵忝後：才能低下，名列榜後。自謙之辭。(10)舉主：主考官。(11)八面受敵：指可以應付各種情況。

    (乙)

    古之人，其才非有以大過今之人也，其平居所以自養而不敢輕用，以待其成者，閔閔焉^(12)，如嬰兒之望長也。弱者養之，以至於剛；虛者養之，以至於充。三十而後仕，五十而後爵。信^(13)於久屈之中，而用於至足之後；流於既溢之餘，而發於持滿之末^(14)。此古之人所以大過人，而今之君子所以不及也。

    吾少也有志於學，不幸而早得^(15)與吾子同年，吾子之得，亦不可謂不早也。吾今雖欲自以為不足，而眾已妄推之矣。嗚呼！吾子其去此，而務學也哉。博觀而約取，厚積而薄發，吾告子止於此矣。子歸過京師而問焉，有曰轍，子由者，吾弟也，其亦以是語之。──〈稼說送張琥〉蘇軾

    註：(12)閔閔焉：殷切狀，十分關心的樣子。(13)信，同「伸」。(14)發於持滿之末：在弓拉滿之後才把箭射出去。(15)早得：很年輕便通過科舉考試。'
