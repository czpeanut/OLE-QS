- id: doc_113_台中_衛道_自然_理化_g7s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 由題目可知米酵菌酸為何種物質？
  options:
  - label: A
    content: 混合物
  - label: B
    content: 化合物
  - label: C
    content: 元素
  - label: D
    content: 以上為非
  group_stem: "※閱讀下列文章，請回答 6~8 題 文章節錄於米酵菌酸-不常見但可致命的毒素-莊梓傑博士報告\n 2024年3月底，台灣衛生當局通報一宗在台北一家餐廳發生的食物中毒事故。患者的臨床樣本檢出對米酵菌酸毒素呈陽性反應。據報，一名廚師的手檢出對該毒素呈陽性反應，顯示經該名廚師處理過的食物可能受到污染。懷疑涉事的食品包括河粉和粿條。\n\
    \ 米酵菌酸是一種耐熱毒素，具有固定的熔點與沸點，可透過化學方法分離出其他物質，分離出的物質與米酵菌酸的性質截然不同。由椰毒伯克氏菌產生，這種細菌在土壤及植物中無處不在，適合細菌生長的溫度範圍是攝氏\
    \ 30 至 37 度，適合產生毒素的溫度範圍則是攝氏 22 至 30 度。最初通報的米酵菌酸中毒個案是因食用發酵粟米和以椰子為原料的食物而發生的。部分脂肪酸，特別是椰子和粟米內的脂肪酸能促進細菌生長和產生該毒素。"
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
