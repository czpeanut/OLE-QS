- id: doc_113_台中_衛道_自然_理化_g7s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '附圖為實驗室中常見的四項器材，使用說明分別如下：

    器材一：使用此器材時，應填充 $1/3 \sim 2/3$ 的液體即可，避免翻覆造成危險，使用完畢後將其用口吹熄滅。

    器材二：可用於精準測量體積、盛裝液體、加熱等用途。

    器材三：附有刻度可精準測量體積，但不可用於加熱及進行化學反應。

    器材四：可做為加熱之容器，加熱時可傾斜，開口請勿對人以避免液體噴濺傷人。

    關於以上四種器材的使用說明，何者正確？'
  options:
  - label: A
    content: 器材一及器材二
  - label: B
    content: 器材一及器材三
  - label: C
    content: 器材三及器材四
  - label: D
    content: 器材二及器材四
