    \ 米酵菌酸是一種耐熱毒素，具有固定的熔點與沸點，可透過化學方法分離出其他物質，分離出的物質與米酵菌酸的性質截然不同。由椰毒伯克氏菌產生，這種細菌在土壤及植物中無處不在，適合細菌生長的溫度範圍是攝氏\
