- id: doc_113_高雄_五甲_數學_g9s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: '右圖為某地區跨年晚會的圓形表演劇場，主辦單位搭建了甲、乙、丙三個弓形區域作為觀眾席，其中甲面積$>$丙面積$>$乙面積。而主舞臺中心將搭建在距離
    $\overline{AB}$、$\overline{CD}$、$\overline{EF}$ 皆相等的位置。小翊和小妍對於「主舞臺中心搭建位置」的說法如下。

    小翊：作圓形劇場的圓心 $O$，則 $O$ 點即是主舞臺中心的位置。

    小妍：延長 $\overline{AB}$、$\overline{CD}$、$\overline{EF}$，使得三直線 $\overline{AB}$、$\overline{CD}$、$\overline{EF}$
    兩兩相交於 $M$、$N$、$P$ 點。作 $\triangle MNP$ 的內心 $I$，則 $I$ 點即是主舞臺中心的位置。

    請判斷他們的說法是否正確？（3-2課本）'
  options:
  - label: A
    content: 兩人皆正確
  - label: B
    content: 兩人皆錯誤
  - label: C
    content: 小翊正確，小妍錯誤
  - label: D
    content: 小翊錯誤，小妍正確
