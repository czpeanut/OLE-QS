- id: doc_113_台中_四育_數學_g9s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: "如圖，四邊形ABCD 為平行四邊形，G 為$\\overline{BD}$與$\\overline{AC}$的交點，且E、F 為$\\overline{BD}$上的兩點，若$\\\
    overline{AE}$、$\\overline{CF}$皆垂直於$\\overline{BD}$，求證四邊形AECF 為平行四邊形。\n       關於甲乙兩生證明方向的敘述，何者正確？\n\
    \n       甲：利用$\\triangle AGE \\cong \\triangle CGF$，得$\\overline{GE} = \\overline{GF}$，\n\
    \           且$\\overline{AG} = \\overline{CG}$(四邊形ABCD 為平行四邊形)\n           故四邊形AECF\
    \ 為平行四邊形\n           (兩條對角線互相平分)\n       乙：利用$\\triangle ABD$及$\\triangle CBD$面積相等，同底等高\n\
    \           故$\\overline{AE} = \\overline{CF}$\n           且$\\overline{AE}$、$\\\
    overline{CF}$皆垂直於$\\overline{BD}$，則$\\overline{AE} // \\overline{CF}$\n      \
    \     故四邊形AECF 為平行四邊形\n           (一組對邊平行且等長)"
  options:
  - label: A
    content: 甲對，乙錯
  - label: B
    content: 甲錯，乙對
  - label: C
    content: 甲乙都對
  - label: D
