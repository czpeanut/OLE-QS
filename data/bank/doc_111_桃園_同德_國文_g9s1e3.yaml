  section: 1
  number: 13
  type: single
  page: 2
  stem: 海上之人有好鷗鳥者，每旦之海上，從鷗鳥游，鷗鳥之至者百住而不止。其父曰：「吾聞鷗鳥皆從汝游，汝取來，吾玩之。」明日之海上，鷗鳥舞而不下也。（列子 黃帝）上文寓意與下列敘述最為接近？
  options:
