  stem: '「我們溝通時，只有 7％的意思是經說話的內容傳達，更大部分是透過語氣、表情及肢體語言來表達的。美國心理學家保羅．艾克曼（Paul Ekman）發現即使是天生失明、從未見過別人面部表情的盲人，也能夠展露同樣的面部表情，從而推斷我們天生就會表現不同表情，幫助傳達自己的想法。」

