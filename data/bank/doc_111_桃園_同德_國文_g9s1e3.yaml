  number: 37
  type: single
  page: 6
  stem: 「要進行厲害的談判，你必須先對自己和對手有足夠的理解，才能夠展開對話，為雙方都創造價值。但是，多數人不懂得靠提出正確的問題來獲得這些資訊。研究顯示，只有7％的人會在談判中問出好問題。如果你談判時就馬上論理，或問錯了問題，不但會失去在談判桌上互相理解的機會，最後可能還必須屈就更差的結果。」就談判而言，這段文字的觀點，與下列何者最接近？
  options:
  - label: A
    content: 談判順利的前提，在於兩方願意解決問題
  - label: B
    content: 談判時應建立底線，而非遷就對方的要求
  - label: C
    content: 真正的談判專家雖寡言，但善於察言觀色
  - label: D
    content: 知己知彼，有助於為談判創造出雙贏局面。
