  options:
  - label: A
    content: 一種用來擦拭距離的橡皮／卻擦不去／一路的崎嶇—輪胎
  - label: B
    content: 我不算博學／但我很多聞／從開始就聽／脣槍舌劍／竊竊私語／口沫橫飛／滔滔不絕—電話
  - label: C
    content: 來自石頭的族群／雖然被騷人墨客／請入書齋／視為上賓／始終還不是／不改其石頭的本性—墨
