  section: 1
  number: 15
  type: single
  page: 2
  stem: 妻子正在廚房炒菜。丈夫在她旁邊一直嘮叨不停：「慢些、小心！火太大了。趕快把魚翻過來、油放太多了！」妻子脫口而出：「我懂得怎樣炒菜，不用你指手畫腳的。」丈夫平靜地答道：「我只是要讓妳知道，我在開車時，妳在旁邊喋喋不休，我的感覺如何……」以下何者最適合形容上述的情境？
