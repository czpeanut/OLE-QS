- id: doc_111_桃園_同德_國文_g9s1e3_s2_38
  section: 2
  number: 38
  type: single
  page: 6
  stem: 依據本文，小說的力量之所以龐大的原因為何？
  options:
  - label: A
    content: 情節的曲折離奇
  - label: B
    content: 人物的有血有肉
  - label: C
    content: 是男性社會的附庸
  - label: D
    content: 個性上的愛惡強烈。
  group_stem: "戊\n    一支筆所能寫出來的力量及影響力，金庸可以說是前無古人，恐怕也是後無來者了，我們去探討為什麼小說的力量可以這麼龐大，事實上，不在於情節的曲折離奇，而在於人物的有血有肉，金庸確實是天下無雙，在金庸的書中，每個人物都是活生生的，在被塑造的環境裡掙扎。\n\
    \  而，很有趣的，小說中對每一個角色的描寫，充分反映出作者對傳統的呼應與批判，也充滿對現實世界的反射。尤其是女性，很容易在武俠世界中脫離現實生活，不再是男性社會的附庸，但是卻仍然得面對女性的自身掙扎；這是一個很有趣的現象，值得我們探討。\n\
    \  而在長篇小說中的女主角，個性上的愛惡可就強烈而見仁見智了，基本上這些女主角都比較像政治人物，或者說，放在現代絕對是女強人的形態，例如趙敏、任盈盈、溫青青、黃蓉等，對她們所愛的人們而言，她是天使，對不愛的人而言，可能是魔鬼；愛恨分明、手段明快。而男主角往往是剛好相反的，令狐沖的天同特性，瀟灑自如，下起決斷來差盈盈多矣；張無忌更慘，忠厚君子，換句話說天同太陰的個性，老實人一個，不太有中心思想，在趙敏和周芷若之中，真是被擺弄於股掌之間，幸與不幸，可就難講了。只有郭靖，堅毅木訥的武曲天相，大拙勝巧，與黃蓉就是絕配。\n\
    \                                                               （科技紫微網 金庸筆下的女性）"
  tags:
    textbook: 九上 第九課 射鵰英雄傳──智鬥書生
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 九上
      subject: 國文
      code: 第九課
      title: 射鵰英雄傳──智鬥書生
      chapter: null
