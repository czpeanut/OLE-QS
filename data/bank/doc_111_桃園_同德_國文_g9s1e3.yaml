  stem: 「龍門」原為黃河上游某一水流湍急處，傳說鯉魚躍過此處，即可化身為龍，騰飛升天。後用「魚躍龍門」比喻登上高位。以下各詞語都是由地名衍生而出，請判斷它們在句子中的用法何者正確？
  options:
  - label: A
    content: 總務主任為人清廉、謹守分際，對公、私財物一向「涇渭分明」，連辦公室的紙筆都不曾帶回家使用
  - label: B
    content: 每年元旦為迎接第一道曙光，不少人遠赴臺東 太麻里，一睹太陽「東山再起」的壯觀景致
  - label: C
    content: 疫情初起時，各國廠商紛紛搶購口罩原物料，造成物料短缺，一時之間「洛陽紙貴」，民眾就算有錢也買不到口罩
  - label: D
