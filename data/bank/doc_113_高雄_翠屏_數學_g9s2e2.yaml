  section: 1
  number: 26
  type: single
  page: 4
  stem: '以下對於關於 10 噸重大貨車剎車距離的敘述，何者正確？

    (甲) 有可能在某個速度時，使用算法①與②，算出的剎車距離會相同

    (乙) 只要速度超過 20，使用算法②算出的距離都會比與算法③算出的距離大

    (丙) 在某個速度時，若使用算法②與③，算出的剎車距離會相同'
  options:
  - label: A
    content: 甲、乙
  - label: B
    content: 甲、丙
  - label: C
    content: 乙、丙
  - label: D
    content: 甲、乙、丙
  group_stem: '請閱讀下列敘述後，回答 26～27 題


    開車保持安全的距離，避免追尾(後車撞擊前車)是非常重要的，除了不同車重在不同速度下的剎車距離不同外，總剎車距離還必須考慮到反應時間的行駛距離。表(一)算法為品謙根據網路資料或自己推算的總剎車距離公式，速度在
    100 公里以內，其可能因輪胎與地面之摩擦係數不同或駕駛人之反應速度而有差異。其中速度單位為每小時行駛的公里數，剎車距離的單位為公尺。


    表(一) 總剎車距離公式

    | | 一般汽車 | 10 噸重大貨車 |

    | :--- | :--- | :--- |

    | 算法① | $0.005 \times \text{速度}^2$ | $0.01 \times \text{速度}^2$ |

    | 算法② | $0.6 \times \text{速度} - 15$ | $0.6 \times \text{速度} - 3$ |

    | 算法③ | $(\text{速度} - 10) \times 0.5 - 7$ | $(\text{速度} - 10) \times 0.5 + 4$
    |'
