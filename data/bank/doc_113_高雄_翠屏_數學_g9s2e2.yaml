    | $10 \leq ( \text{與前車距離} - \text{剎車距離} ) < 20$ | 還算安全 |

    | $0 \leq ( \text{與前車距離} - \text{剎車距離} ) < 10$ | 有點危險 |

    | ( 與前車距離－剎車距離 ) $\leq 0$ | 非常危險 |


