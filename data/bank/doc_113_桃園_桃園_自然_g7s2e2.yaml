  stem: 雨來菇和下列哪一種生物，在生物分類上屬於同一界？
  options:
  - label: A
    content: 香菇
  - label: B
    content: 大腸桿菌
  - label: C
    content: 綠藻
  - label: D
    content: 蘚苔。
  group_stem: "閱讀題(一)\n雨來菇－情人的眼淚\n    你吃過雨來菇嗎？這是點亮農村的情人淚喔！雖名為「菇」字輩，但雨來菇不是菇，而是一種可食用的陸生藍綠藻，正式名稱為葛仙米藻。\n\
    \    過去農村會採集野生雨來菇入菜，十餘年前，國內開始發展出人工栽培雨來菇的技術。由於栽培不需太多勞力，收入也不錯，各地漸漸出現雨來菇農場。雨來菇需要石頭與乾淨的水源，因此溪畔是理想的種植環境，\n\
    \n種在石頭間的雨來菇生長約45天至60天\n就可以採收（攝影／林怡均）\n\n    雨來菇的營養價值相當高，尤其是蛋白質，「雨來菇烘乾後，47% 都是蛋白質」，尤其富含藻膽蛋白。不只蛋白質含量高，雨來菇還富含維生素\
    \ A、B12、C、β-胡蘿蔔素等多種維生素，礦物質如鈣、鉀、鋅等含量也極高，同樣重量的雨來菇，鐵質含量為葡萄的 32 倍。\n    除了食用，雨來菇本身擁有的天然螢光色素以及藻膠，可以應用在生醫產業，甚至開發出精華液、面膜等美妝用品。\n\
    試根據上文，回答下列問題："
