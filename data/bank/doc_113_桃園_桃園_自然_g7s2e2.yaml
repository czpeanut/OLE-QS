  stem: '下表列出綬草和兩種相關植物的中文名稱、分類科名和學名，試判斷下列敘述何者正確？


    | 中文名稱 | 盤龍參、綬草 | 人參 | 蟠龍石斛 |

    | --- | --- | --- | --- |

    | 科名 | Orchidaceae | Araliaceae | Orchidaceae |

