- id: doc_113_桃園_桃園_自然_g7s2e2_s1_49
  section: 1
  number: 49
  type: single
  page: 6
  stem: 下列關於「萊特合唱蛙」的敘述，何者正確？
  options:
  - label: A
    content: 「萊特合唱蛙」是新發現的物種
  - label: B
    content: 「萊特合唱蛙」無法產出後代
  - label: C
    content: 「萊特合唱蛙」的學名是Kaloula conjunta
  - label: D
    content: 「萊特合唱蛙」與親代「樹棲狹口蛙」和「彩繪狹口蛙」都是同種的蛙類。
  group_stem: '閱讀題(三)

    進入演化死胡同的混種「萊特合唱蛙」2025/04/07

    (https://news.ltn.com.tw/news/world/breakingnews/5003679)


    困擾演化生物學家數十年的菲律賓兩棲類謎團終獲解答。一種外觀奇特、極為罕見的「萊特合唱蛙」（Leyte Chorus Frog），經最新基因組學分析證實，並非獨立物種或亞種，而是因森林砍伐導致兩種棲地重疊的青蛙意外雜交所產生的第一代（F1）混種（hybrid），且此混種無法繁衍後代，是演化的死胡同。


    研究指出，這種青蛙外觀獨特，介於兩種可能的親代之間。「其中一個親代「樹棲狹口蛙( Kaloula conjunta )」是樹棲蛙，體型較大，有寬大趾尖吸盤；另一個親代「彩繪狹口蛙(Kaloula
    picta )」則是地棲蛙，體型較小，趾尖吸盤幾乎不發達。」


    分析顯示，萊特合唱蛙的基因組恰好各有一半來自上述兩種親代蛙。


    研究團隊認為這種F1 混種很可能無法繁殖。「當牠們嘗試與親代或彼此交配時，可能因遺傳不相容性）而失敗。」陳建安表示，「這解釋了牠們為何如此稀有，因為無法產生F2
    或之後的世代。」'
