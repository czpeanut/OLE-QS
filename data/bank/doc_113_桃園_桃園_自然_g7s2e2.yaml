  options:
  - label: A
    content: 綬草的屬名是sinensis
  - label: B
    content: 綬草又名盤龍參，故與人參親緣關係較近，但和蟠龍石斛親緣關係較遠
  - label: C
    content: 綬草和蟠龍石斛在分類階層上都是同綱的植物
  - label: D
    content: 「蘭科」在分類階層的名稱為Araliaceae
  group_stem: '閱讀題(二)

    桃園八德發現罕見「最小蘭花」－綬草（Spiranthes sinensis） 議員籲當學校的生態教材。

    https://news.ltn.com.tw/news/life/breakingnews/5005628

    (2025/04/08 19:46，記者謝武雄／桃園報導)


    綬草（Spiranthes sinensis）是蘭科綬草屬植物之臺灣原生種蘭花，主要分布於臺灣全島中低海拔的平野、草地或草叢中，由於花序如古時的綬帶而得「綬草」之名。綬草小巧的粉紅花朵旋轉著生於花軸上，宛如青龍纏柱般，相當特別，且於清明前後盛開，另因其根狀似人參，故綬草又名青龍纏柱、盤龍參、清明草等。'
