- id: doc_112_高雄_林園_自然_g9s1e1_s1_27
  section: 1
  number: 27
  type: single
  page: 2
  stem: 鹽礦主要是如何形成的？
  options:
  - label: A
    content: 岩漿凝固結晶析出
  - label: B
    content: 封閉的鹹水體蒸乾結晶析出
  - label: C
    content: 岩石風化產生
  - label: D
    content: 海水飽和析出結晶沉積於海底。
  group_stem: '請閱讀下列文章並回答27~30 題:

    你有看過裝飾用的鹽燈嗎？如果你也曾看過料理用的玫瑰鹽，應該會發現鹽燈的色澤和玫瑰鹽的顏色十分接近（如圖）。玫瑰鹽和鹽燈都是由類似的礦物組成，它們都是從鹽礦中開採出來的。鹽礦是一種沉積岩，又稱為蒸發岩（註1），由封閉的鹹水水域蒸發形成，這是乾燥地區常見的沉積作用。玫瑰鹽約97％是氯化鈉，約3％是雜鹵石（註2），其紅色或粉紅色調是來自微量的雜質，例如氧化鐵、鎂、銅等。許多廣告號稱玫瑰鹽有多種微量元素，對健康極好，但目前沒有足夠的科學證據，能夠證明長期食用玫瑰鹽對人體有益。

    玫瑰鹽主要產自巴基斯坦的烏拉鹽礦（Khewra salt mine），歷史悠久，是著名的旅遊景點，每年約生產35 萬公噸的岩鹽。

    （註1）蒸發岩：是一種沉積岩，由水溶液蒸發析出結晶的礦物組成，常見礦物有岩鹽（氯化鈉結晶）、石膏、方解石、雜鹵石等。

    （註2）雜鹵石：海水蒸發形成的礦物，是鉀、鈣和鎂的硫酸鹽類，結合水分子所組成。化學式為$K_{2}Ca_{2}Mg(SO_{4})_{4} \cdot 2H_{2}O$。'
  shared_asset: g1_27_30
  answer:
  - B
  answer_source: answer_key_vlm
