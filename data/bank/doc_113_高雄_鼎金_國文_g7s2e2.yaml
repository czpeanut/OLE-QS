  group_stem: "第一次聽到荷蘭這個地名，我六歲，在浙江 余姚（今慈溪）鄉下。這天，我扶著祖母，她把我當拐杖，一步步挪到了河西。\n  河西老太躺在床上，見到祖母很高興，想伸手卻抬不起來。祖母連忙俯下身去，輕聲問她想吃什麼。河西老太似乎有點不好意思，但終究喃喃的說了。\n\
    \  祖母皺了皺眉，要她再說一遍，然後笑了，抬起頭來對眾人說:「她要喝荷蘭水。」\n  這是我第一次聽到這種奇怪的水名，回到家裡問媽媽。媽媽只說荷蘭是一個很遠的國家，卻也不知道荷蘭水是什麼，就要祖母描述一下。等祖母簡單的說了荷蘭水的特徵，母親「哦」了一聲：「那就是汽水！」\n\
    \  原來，在祖母一代，汽水還叫荷蘭水。\n  媽媽寫完信後，由一位後生快速地跑到北邊逍林鎮去寄出，媽媽特地關照他寄「快信」，不可延誤。\n  幾天以後，河西老太的兒子回來了，一到就從旅行袋裡摸出一個玻璃瓶，上面封著小鐵蓋。他又從口袋裡取出一個開關，輕輕一扳，鐵蓋開了，瓶裡的水冒著密密的氣泡。也不倒在杯子裡了，直接湊上了河西老太的嘴。\n\
    \  河西老太喝了兩口，便搖頭，不想再喝。她兒子把那大半瓶汽水放在一邊，也不再說話。我當時不明白，是河西老太不想喝了，還是她覺得兒子買錯了？\n  當天晚上，老太就去世了。\n\
    \  這事早就遺忘，今天到了荷蘭，輕輕地念一聲國名，才如沉屑泛起，突然記得。\n  上幾代中國的普通百姓對於西方世界茫然不知，若偶有所聞，大多是由於那時開始傳入中國的西方器物；西方普通人對中國的瞭解也長期局限於絲綢、瓷器和茶葉。這種交流，直接滲透到生活底層，甚至滲透到生命底層，有著遠遠超越政治、軍事、外交領域的深刻性。你看這位只在上海住過一段時間的老婦人，生命中最後念叨的居然是一個西歐小國的國名。\n\
    \  我猜想河西老太在上海第一次喝到汽水時一定不會適應，但很快就從不適應中找到了一種舒鼻通喉的暢快。這個短暫的轉變過程包含著兩種生態文化的愉快對接，後來失去了對接的可能，就成了\
    \     。\n  回憶中的一切都比事實更加美好。離開上海很久的老太其實已經重新適應了傳統風俗，因此她對於那瓶好不容易來到嘴邊的汽水，第一口失望，第二口搖頭。她終於沒有了牽掛，撒手塵寰，也就這樣丟棄了荷蘭。她以生命的結束，完成了一場小小的兩種生態文明的拉鋸戰。\
    \                              （余秋雨 荷蘭水）"
