  group_stem: '更始時，天下亂，劉平弟仲為賊所殺。其後賊復忽然而至，平扶侍其母，奔走逃難。仲遺腹女始一歲，平抱仲女而棄其子。母欲還取之，平不聽，曰：「力不能兩活，仲不可以絕類（１）。」遂去不顧，與母俱匿野澤中。平朝出求食，逢餓賊，將烹，平叩頭曰：「今旦為老母求菜，老母待平為命，願得先歸，食（２）母畢，還就死。」因涕泣。賊見其至誠，哀而遣之。平還，既食母訖，因白曰：「屬（３）與賊期，義不可欺。」遂還詣賊。眾皆大驚，相謂曰：「常聞烈士，乃今見之。子去矣，吾不忍食子。」於是得全。       （改寫自後漢書）


