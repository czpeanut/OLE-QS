  stem: 根據本文，羅斯福沒有開槍射擊小熊的主要原因為何？
  options:
  - label: A
    content: 不願靠著作弊來贏得顏面
  - label: B
    content: 擔心狩獵會遭到媒體批判
  - label: C
    content: 憂愁英雄主義將成為風氣
  - label: D
    content: 拒絕因虛榮犧牲幼小生命。
  group_stem: "臥室床頭櫃上，擺著兩隻米棕色毛茸茸小泰迪熊，是我常深情凝視的心愛之物。\n  在我這年齡還喜歡泰迪熊，許多人都要覺得「幼稚」吧！\n\
    \  但我所以喜愛泰迪，除了它充滿童趣的形象，屢屢召回我失落的童心外，更因為這超「萌」小熊背後，蘊含著一個令我歡喜讚嘆的故事。\n  其實，泰迪（Ｔｅｄｄｙ），原是上世紀美國總統老羅斯福小名。據說，一九〇二年，羅斯福在密西西比秋季狩獵中，因毫無斬獲，隨扈們覺得空手而返，有失總統顏面，遂把他們在森林中捕捉到的一隻出生不久的小熊，綁在樹上，請羅斯福開槍射擊。\n\
    \  但羅斯福斷然予以拒絕了！\n  因為這不只是一種作弊行為，更因為油然而生的惻隱之心，使他無論如何也無法對這可能尚未斷奶的嬰兒熊下手！他寧可讓人嘲諷他是個差勁的獵人，也不願因虛榮的英雄主義作祟，犧牲一個無辜幼小的生命。\n\
    \  不久後，華盛頓郵報刊登了一幅以這故事為主題的漫畫：一位在紐約 布魯克林區賣水果的俄裔移民蘿絲，更根據這故事，製作了兩隻絨毛熊在店內展示，據說這便是世上第一對泰迪熊。\n\
    \  由於深受歡迎，更經由專家設計、量產，如今，這可愛小熊已成為跨國界、跨種族、甚至跨文化與跨性別的一種玩偶了。\n  但對我而言，泰迪熊不是玩偶，而是一種象徵，象徵人道主義、慈悲、憐憫、不忍與——愛。\n\
    \  當這世界充斥殺戮與流血，令人傷心失望時，泰迪熊卻令人想起人性中這些可貴的特質，而彷彿看見希望之光。\n  因為這希望之光，是的，我愛泰迪熊！\n  \
    \                                                                       （陳幸蕙 我愛泰迪熊）"
