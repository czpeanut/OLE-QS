  type: single
  page: 4
  stem: 根據本文，文中缺空處最適合填入下列何者？
  options:
  - label: A
    content: 華麗的馬戲團舞台以及觀眾的喝采聲
  - label: B
    content: 殘酷的馬戲團訓練以及大象的哀鳴聲
  - label: C
    content: 仁慈的保育團援助以及社會的撻伐聲
  - label: D
    content: 艱辛的肉體上折磨以及遊客的歡樂聲。
  group_stem: "電影大象的眼淚，母象蘿西被象鉤鞭打，一鞭一血痕，讓牠學會兩腳站立、跪坐、躺臥、甚至倒立。動物的眼淚與辛酸，掩蓋在____________下。其實，大象和人類一樣會因喜或悲而落淚，但不知是幸還是不幸，大象記憶力遠超過人類，在商人殘酷的訓練下，擁有的幾乎都是痛苦的記憶。\n\
    \  大象演出一直是馬戲團的重頭戲，而美國真的有一個以大象為主角的知名馬戲團——玲玲馬戲團，該馬戲團在一八八二年引進第一隻亞洲象，帶給觀眾無數的歡樂，但歡樂背後，卻是動物眼淚織就的悲歌。為了讓大家乖乖就範，馴獸師不斷的揮鞭或用象鉤戳刺大象，在鐵的紀律和血的教訓下，大象豈能無淚？\n\
    \  近年來，保育團體揭發馬戲團虐待動物的事實，引發社會撻伐，玲玲馬戲團抵不過輿論，宣布取消大象演出，已有兩百多年歷史的大象表演在二〇一七年五月正式走入歷史，並將退役大象送至佛州的大象保育中心。\n\
    \  除了馬戲團，騎大象這個在東南亞普遍的觀光活動，背後也存在著讓人難以想像的酷刑。在大象三至六歲時，馴獸師就會狠心的硬把小象帶離母象，把牠關在一個窄小的籠子裡，用繩子與鐵鎖綑綁固定住小象的四肢，讓牠難以動彈。接下來，馴獸師會不斷地對小象施以精神和肉體上的折磨，殘忍的用特製的象鉤戳刺小象，讓小象挨餓，甚至不讓小象睡覺，所有的訓練必須由痛來承受。而大象每載一次人，頸椎就會被傷害一次，直到牠傷重到無法載人為止，才能「除役」。許多熬不過的小象在訓練中夭折，而撐過去的，終其一生成為人類的奴隸，以及取悅遊客的「玩物」，陪遊客照相、讓遊客騎乘、互踢足球逗觀眾開心、甚至在象鼻裡插著畫筆作畫，讓遊客見證大象不輸人類的靈性。\n\
    \                                                                （改寫自鍾玉玨 大象永遠不會忘記）"
