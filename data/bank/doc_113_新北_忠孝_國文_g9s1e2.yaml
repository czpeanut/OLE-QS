- id: doc_113_新北_忠孝_國文_g9s1e2_s2_35
  section: 2
  number: 35
  type: single
  page: 4
  stem: 文中對「米的天性既純真又深情」、「白飯之於佳肴，好比畫布之於色彩和線條」的解說，依序相當於下圖的哪個理由？
  options:
  - label: A
    content: ➀、➁
  - label: B
    content: ➁、➂
  - label: C
    content: ➂、➃
  - label: D
    content: ➁、➃
  group_stem: "(丁)\n    米飯總帶著樸素的美感，自足而清純。袁枚說:「飯之甘，在百味之上，知味者，遇好飯不必用菜。」飯如果優秀，不必佐任何菜肴，即滋味無窮。\n\
    \    米的天性既純真又深情，跟什麼水結合，加熱，就變成什麼飯。若用雞汁煮飯，即煮出雞飯；加入薑汁，則煮出薑飯；加入檸檬汁，就是檸檬飯；加入椰漿，自然呈現椰漿飯；加入墨魚汁，將變出烏亮的墨魚飯。\n\
    \    不過也並非每種米皆如此。如長米有點像騎牆派，蒸煮後不具黏性，顆粒各自獨立，善變，不強調自我，適合用來製作各式菜飯或炒飯。香米則個性拘泥，堅持主體性，烹煮時會散發芳香，不宜添加咖哩、椰汁、番茄等外物。\n\
    \    吃飯很像家居生活，平常地位低落，往往忽略其存在，名稱明明叫「主食」，卻成附屬品，講究的飯館往往專吃各式菜肴，不配一口飯。白飯之於佳肴，好比畫布之於色彩和線條，一席筵宴總不乏華麗的菜肴，互相爭奇鬥豔，但若缺少白飯的搭配調和，不免彼此扞格。\n\
    \                          (改寫自焦桐〈論吃飯〉)"
