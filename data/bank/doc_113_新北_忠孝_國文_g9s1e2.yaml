- id: doc_113_新北_忠孝_國文_g9s1e2_s2_38
  section: 2
  number: 38
  type: single
  page: 5
  stem: 如果想讓生活快樂充實，按照作者的說法，下列方法何者無效？
  options:
  - label: A
    content: 省思自己各方面生活
  - label: B
    content: 調配生活素材比例與方法
  - label: C
    content: 主動解決自己人生問題
  - label: D
    content: 重新尋求生活的新奇刺激
  group_stem: "(己)\n    如今在大城市裡，到處可見咖啡連鎖店的招牌。如果你喝過咖啡，那你是否發現，人生就好比到咖啡店喝咖啡？\n  當你進到店裡後，你不能坐在位置上等服務生來，而必須自己到櫃檯去點選。這是人生的第一課：沒有人會把現成的人生送到你面前來，你必須自己去挑選。\n\
    \  在你點了一杯本日咖啡後，你必須自行到調理台去加牛奶和糖。奶有全脂、脫脂和鮮奶，糖有砂糖、冰糖和代糖，另有肉桂、荳蔻等香料，你選擇自己喜歡的牛奶、糖和香料，然後以不同的比例調配出讓自己滿意的色澤、香醇與味道，這是人生的第二課：老天爺只提供你生活的基本素材，要怎麼調劑全靠你自己。同樣的材料在不同人的調配下，可以出現截然不同的色澤、香醇與味道。\n\
    \  如果你覺得生活沉悶、單調是因為缺乏新奇的刺激，那可能是因為你還沒有了解生命的真諦。有一個故事說：\n  有位想了解生命真諦而四處追尋的人，上山去請教一位智者。智者說：「答案就在山下的十字路口。」當他興匆匆來到十字路口時，卻只看到三家小店：一家賣金屬，一家賣木料，一家賣繩線。這和生命的真諦有什麼關係呢？迷惑的他又回到山上去問智者，但智者只淡淡地說：「日後你自然會明白。」說完就閉上眼睛。\n\
    \  在繼續追尋了數年之後，他還是沒有找到他想要的答案。有一晚，在荒郊野外，他忽然聽到非常美妙的琴聲，彷彿就在向他訴說生命的真諦。他循聲前往，看到一個老人在月光下彈著西塔琴。\n\
    \  老人的手，那細細的琴弦，那木頭做的琴身，還有那金屬片，讓他一下子領悟了過來：木頭、金屬、長線這三種尋常東西，經過適當的搭配組合，在一個巧人手中，就成了能發出美妙之音的神奇樂器。\n\
    \  這也正是智者要向他開示的：美好的人生乃是由平凡的事物搭配而成，關鍵在於你怎麼去演奏。\n  每個人都是自己生活的調劑師。生活沉悶，主要不是缺乏五光十色的刺激和千奇百怪的際遇，而是你對家庭、學校、學習、娛樂、親情、友情、愛情等這些生活基本素材調配的比例和方法不對。\n\
    \  人生就好比到咖啡店喝咖啡、彈西塔琴，你不能坐在那裡等待有什麼「服務生」來提供你生命的歡樂，而必須自行走上調理台，利用那幾種基本材料，學習改善自己對人生咖啡的調配方法，直到產生讓自己滿意的色澤、香醇與味道。\n\
    \  而這，也就是你用來為自己演奏生命美妙樂章的西塔琴。\n              (改寫自王溢嘉＜特調一杯人生咖啡＞)"
