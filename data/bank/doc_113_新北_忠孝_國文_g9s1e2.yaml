    \    潭中魚可百許頭，皆若空游無所依。日光下澈，影布石上，佁然➃不動。俶爾➄遠逝，往來翕忽➅，似與遊者相樂。\n    潭西南而望，斗折蛇行，明滅可見。其岸勢犬牙差互➆，不可知其源。\n\
    \    坐潭上，四面竹樹環合，寂寥無人，淒神寒骨，悄愴幽邃。以其境過清，不可久居，乃記之而去。\n    同遊者：吳武陵，龔古，余弟宗玄。隸而從者，崔氏二小生：曰恕己，曰奉壹。\n\
    \                          （柳宗元＜小石潭記＞）\n➀坻︰水中高地\n➁嵁：高低不平的山巖\n➂蒙絡：遮蔽纏繞\n➃佁然：癡呆的樣子\n\
    ➄俶爾：忽然\n➅翕忽:快速的樣子\n➆犬牙差互：形容縱橫交錯，複雜難辨"
