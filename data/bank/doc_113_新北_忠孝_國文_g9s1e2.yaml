- id: doc_113_新北_忠孝_國文_g9s1e2_s2_36
  section: 2
  number: 36
  type: single
  page: 5
  stem: 下列人物皆可視為「斜槓青年」的代表，何者生平事蹟及才能的描述有誤？
  options:
  - label: A
    content: 劉鶚：旅遊記錄／文字學家／郎中
  - label: B
    content: 蘇軾：文學家／畫家／政治家
  - label: C
    content: 陶淵明︰田園詩人／隱士／農夫
  - label: D
    content: 王維︰政治家／畫家／邊塞詩人
  group_stem: "(戊)\n   「斜槓」一詞源自於英文「Slash」，這個概念出自紐約時報專欄作家瑪希‧艾波赫的著作。她在書中提到，越來越多年輕人不再滿足於「單一職業」的生活方式，而是開始藉由多重收入、多重職業來體驗更豐富的生活。這些人在自我介紹中會用「斜槓：∕」來區分不同職業，於是「斜槓」便成為他們的代名詞。\n\
    \    留美作家Susan：「過自己想要的生活其實是一個偽命題，因為你根本不知道自己喜歡怎樣的生活，直到你開始這種生活。」Susan 認為，想成為一位斜槓青年，最重要的就是不斷嘗試、學習。成為斜槓青年的第一步就是：開始自己做自己感興趣事情，並從中賺取收入。\n\
    \    「斜槓青年」代表的是一種全新的人生價值觀，它的核心不在於多重收入，也不在於多重職業，而在於多元人生。觀察我們身邊那些已經成為「斜槓青年」的人，會發現他們實際上都是一群自制力強，經歷過長時期的自我投資與累積，並擁有核心競爭力的人。「斜槓生活」的實踐者更需要自制力，沒有自制力與實力作為前提的自由，只能被稱為任性。\n\
    \    早在一九九六年，美國學者阿蒂爾和盧梭就提出了類似的概念：無邊界職涯。無邊界職涯強調以提升個人能力替代長期雇傭保證，使員工能夠藉由跨足不同的組織體現無邊界職涯。亦即，能力才是賺錢的關鍵，只要有才華，有實力，就能藉由為不同組織服務，獲取更多收入及生活上更高的彈性。\n\
    \    無邊界的含義是廣泛的，它可以指職業和收入的無邊界，也可以指工作方式的無邊界，意即沒有限定的工作場所，沒有固定的雇主，沒有固定的合作夥伴，更重要的是一種心態上的無邊界──人生沒有必須或一定，人生有無限的可能。\n\
    \                 (改寫自Susan Kuang《斜槓青年》)"
