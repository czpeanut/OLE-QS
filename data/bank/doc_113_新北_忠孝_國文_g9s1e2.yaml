- id: doc_113_新北_忠孝_國文_g9s1e2_s2_31
  section: 2
  number: 31
  type: single
  page: 4
  stem: 作者在臉頰上發現「原來兩邊著了兩條滴滑的冰」，其實是指什麼？
  options:
  - label: A
    content: 落下的雨水在臉上結成冰
  - label: B
    content: 因天氣太冷而流下的鼻涕
  - label: C
    content: 因天氣寒冷，汗水結成冰
  - label: D
    content: 感慨時光飛逝流下的眼淚
  group_stem: "(丙)\n    老殘對著雪月交輝的景致，想起謝靈運的詩，「明月照積雪，北風勁且哀」兩句。若非經歷北方苦寒景象，哪裡知道「北風勁且哀」的「哀」字下得好呢？這時月光照得滿地灼亮，抬起頭來，天上的星一個也看不見，只有北邊北斗七星，像幾個淡白點子一樣，還看得清楚。那北斗正斜倚在紫微垣的西邊上面，杓在上，魁在下。老殘心裡想道：「歲月如流，眼見斗杓又將東指了，人又要添一歲了。一年一年的這樣瞎混下去，如何是個了局呢？」又想到《詩經》上說的「維北有斗，不可以挹酒漿。」──「現在國家正當多事之秋，那王公大臣只是恐怕擔處分，多一事不如少一事，弄的百事俱廢，將來又是怎樣個了局，國是如此，丈夫何以家為？」\n\
    \    想到此地，不覺滴下淚來，也就無心觀玩景致，慢慢地走回店去了。\n    老殘一面走著，覺得臉上有樣物件附著似的，用手一摸，原來兩邊著了兩條滴滑的冰。初起不懂什麼緣故，既而想起，自己也就笑了。\n\
    \                            (劉鶚＜黃河結冰記＞)"
