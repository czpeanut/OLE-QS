    諾羅病毒的直徑大小為_____________公尺'
  group_stem: '非洲豬瘟病毒（Asfivirus）是外型複雜的大型 DNA 病毒，病毒顆粒直徑大小約 0.2 微米($\mu\mathrm{m}$)。室溫下，可在糞便中存活
    11 天，在部分豬肉產品中可存活超過 140 天以上。伊波拉病毒（Ebola virus）屬線狀病毒科的一種，病毒顆粒直徑大小約 80 奈米(nm)，可導致出血熱，使人致死。諾羅病毒(
    Norovirus)是一群會造成人類腸胃炎的病毒，屬於杯狀病毒科，病毒顆粒直徑大小約 0.000027 毫米(mm)。試回答下列問題。

    (已知 1 毫米＝$10^{-3}$公尺，1 微米＝$10^{-6}$公尺，1 奈米＝$10^{-9}$公尺)'
