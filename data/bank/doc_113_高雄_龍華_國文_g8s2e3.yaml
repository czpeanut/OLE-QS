  group_stem: '燕王好烏，庭有木皆巢烏，人弗敢觸之者，為其能知吉凶而司①禍福也。故凡國有事，惟烏鳴之聽。烏得寵而矜，客至則群呀之，百鳥皆不敢集也。於是大夫、國人咸事烏。烏攫腐以食腥於庭，王厭之。左右曰：「先王之所好也。」一夕，有鴟止焉，烏群睨而附之如其類。鴟入嘑②於宮，王使射之，鴟死，烏乃呀而啄之。人皆醜之。

