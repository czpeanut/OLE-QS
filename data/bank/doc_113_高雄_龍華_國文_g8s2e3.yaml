  group_stem: '傳奇發展之初受到前代志怪小說影響頗大，出現一系列「奇幻」故事。而當讀書人皆執迷於科舉，日思夜想著高官厚祿，便有了點醒迷夢的「警世」小說。因著唐朝婚配制度特殊，標舉門第的價值觀，使青年男女更盼望能擁有自由的戀愛與婚姻，哪怕是與道統相抗衡亦無怨無悔，「愛情」故事如一首首哀婉的歌謠，餘音繚繞。唐人原本是尚武的，「安
    史之亂」後出現了藩鎮割據，加上國勢衰微，人民的苦痛日深，對於能解民於水火的豪俠之流心生嚮往，「俠義」小說的數量與品質皆有可觀。

    節錄自張曼娟《柔軟的神殿：古典小說的神性與人性》'
