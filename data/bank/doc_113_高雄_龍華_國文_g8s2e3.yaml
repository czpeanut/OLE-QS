- id: doc_113_高雄_龍華_國文_g8s2e3_s3_7
  section: 3
  number: 7
  type: single
  page: 1
  stem: 下列各選項「」中的成語皆與「魚」有關，請問何者使用最不恰當？
  options:
  - label: A
    content: 街上的遊客有如「過江之鯽」，來來往往，一片熱鬧景象
  - label: B
    content: 他年紀輕輕，就已在官場上「鳶飛魚躍」，確實令人欽羨
  - label: C
    content: 不肖商人想拿仿冒品來「魚目混珠」，欺騙不知情的顧客
  - label: D
    content: 他那麼喜歡唱歌，你讓他加入合唱團，真是「如魚得水」
- id: doc_113_高雄_龍華_國文_g8s2e3_s3_8
  section: 3
  number: 8
  type: single
  page: 2
  stem: 下列各組文句傳達的主要語氣，何組前後相同？
  options:
  - label: A
    content: 「莫非諸葛亮無軍，故作此態」／「而廷尉乃當之罰金」
  - label: B
    content: 「記住，飯碗裡一粒米都不許剩」／「應是母慈重，使爾悲不任」
  - label: C
    content: 「吾若為司馬懿，必不便退也」／「兩兔傍地走，安能辨我是雄雌」
  - label: D
    content: 「我軍若進，中其計也。汝輩焉知」／「如有妄行出入，及高聲言語者，立斬」
- id: doc_113_高雄_龍華_國文_g8s2e3_s3_9
  section: 3
  number: 9
  type: single
  page: 2
  stem: 下面關於〈飛魚〉中各文句的說明，下列何者正確？
  options:
  - label: A
    content: 「在臺灣沿岸漁撈日漸式微的今天，飛魚帶給了阿美族男人豐年祭才有的光彩」──阿美族男人都在每年豐年祭時，出海捕撈飛魚
  - label: B
    content: 「月輪自海面昇舉，銀光粼粼，星光漸漸稀微」──與楊喚〈夏夜〉詩中所說的「撒了滿天的珍珠／和一個又大又亮的銀幣」相似
  - label: C
    content: 「從船上看下去牠們不像是魚，倒像是一群被燈光懾怔住的大型蜻蜓」──作者將飛魚在海面飛行與蜻蜓在原野輕舞的意象做結合
  - label: D
    content: 「又見阿美族男人興致勃勃推船去海上瘋狂飛翔」──以阿美族男人熱衷捕捉飛魚，透露自己仍保有探索海洋與鯨豚的熱情與動力
  lesson_raw:
    title: 飛魚
    basis: 題目引用〈飛魚〉課文語句
- id: doc_113_高雄_龍華_國文_g8s2e3_s3_10
  section: 3
  number: 10
  type: single
  page: 2
  stem: 在〈飛魚〉一文中，黃昏時分，作者正在追逐「大海翁」，「深水烏」一路熱情相伴，讓作者產生一連串的疑問，也藉此透露對自身探尋歷程及抉擇的反思。以下關於二者相對應的說明，何者最不恰當？
  options:
  - label: A
    content: 「牠們紛飛散去各奔西東，落水後如何相聚重逢？」──作者選擇出海到各地進行各種的鯨豚生態調查，當自己返航重回陸地後，面對不是那麼支持自己抉擇的家人、朋友時，又該如何相處？
  - label: B
    content: 「牠們飛起是無奈憋氣，抑或暢懷享受水面上的空氣？」──作者選擇離開陸地成為「討海人」，而「討海人」是一種艱辛勞累、無奈被迫的工作？還是一種如釋重負、樂在其中的心境解脫？
  - label: C
    content: 「牠們飛起空中是竄逃？是遊戲？是苦？是樂？」──作者選擇下海遨遊的目的是什麼？是選擇自己所愛，還是為了逃避岸上世事紛擾？自己對這樣的抉擇是開心？是後悔？還是無怨無尤？
  - label: D
    content: 「飛過蘭嶼飛到臺灣沿岸，牠們失落了什麼？」──作者在船上雖見到許多美景和魚群，在很多方面有所收穫，但遼闊的大海值得探尋的事物如此眾多，自己是否仍有所錯過或失去了什麼？
  lesson_raw:
    title: 飛魚
    basis: 題目引用〈飛魚〉課文情節與文句
- id: doc_113_高雄_龍華_國文_g8s2e3_s3_11
  section: 3
  number: 11
  type: single
  page: 2
  stem: 關於《三國演義》的說明，下列何者正確？
  options:
  - label: A
    content: 作者羅貫中，號湖海散人，《三國演義》是他窮一生之力，獨見創新的偉大作品
  - label: B
    content: 《三國演義》取材於正史《三國志》，因此其內容皆為屬實，故事情節曲折精彩
  - label: C
    content: 全書以蜀漢為正統，與《西遊記》、《水滸傳》、《金瓶梅》合稱「四大奇書」
  - label: D
    content: 《三國演義》內容宣揚忠義仁德思想，批評道德淪喪的行為，屬於諷刺章回小說
- id: doc_113_高雄_龍華_國文_g8s2e3_s3_12
  section: 3
  number: 12
  type: single
  page: 2
  stem: 關於〈空城計〉中各文句的說明，下列何者正確？
  options:
  - label: A
    content: 「孔明傳令：眾將旌旗……不可擅動，吾自有計」──孔明以寡擊眾，採用拖延戰術，等待救援，最後逼退敵軍
  - label: B
    content: 「懿看畢，大疑，便到中軍，教後軍作前軍，前軍作後軍」──司馬懿確認敵軍狀況後，決定重新佈陣，再行進攻
  - label: C
    content: 「亮平生謹慎，不曾弄險。今大開城門，必有埋伏。我軍若進，中其計也」──可見司馬懿是一個舉棋不定的人
  - label: D
    content: 「此人料吾平生謹慎，必不弄險，見如此模樣，疑有伏兵，所以退去」──孔明能知己知彼，使司馬懿起疑而退兵
  lesson_raw:
    title: 空城計
    basis: 題目引用〈空城計〉課文原句
- id: doc_113_高雄_龍華_國文_g8s2e3_s3_13
  section: 3
  number: 13
  type: single
  page: 3
  stem: 關於中國小說發展的說明，下列敘述何者正確？
  options:
  - label: A
    content: 魏 晉時期發展出筆記小說，主要有志怪、志人兩類，雖然大多篇幅短小， 但已具備相當完整的結構
  - label: B
    content: 唐朝的小說稱為「傳奇」， 意指傳述奇聞， 因此大多是文人參考民間流傳故事來進行加工創作而成
  - label: C
    content: 章回小說盛行於明 清時期，由宋 元說書人的話本演變而來，是以分章回方式來進行敘述的長篇小說
  - label: D
    content: 唐傳奇常用對仗句子作為標題來概括主要情節 ，〈李娃傳〉、〈鶯鶯傳〉 都是流傳後世的有名作品
- id: doc_113_高雄_龍華_國文_g8s2e3_s3_14
  section: 3
  number: 14
  type: single
  page: 3
  stem: 有關〈柳毅傳書結情緣〉一文的說明，下列敘述何者正確？
  options:
  - label: A
    content: 陷入痛苦絕望的小龍女請柳毅替他傳書給父母，是想要藉此製造與柳毅締結情緣的機會
  - label: B
    content: 聽聞小龍女遭遇，龍王怕安睡中的錢塘君被驚擾而大發雷霆，急忙命令眾人不要哭出聲
  - label: C
    content: 錢塘君威之以武，以「你若不答應，大夥兒都會像掉進糞坑般的難堪」逼柳毅答應婚約
  - label: D
    content: 柳毅送信只是為了助人，對小龍女並無半分情意，因此拒絕錢塘君強將小龍女許配給他
  lesson_raw:
    title: 柳毅傳書結情緣
    basis: 題目寫了課名〈柳毅傳書結情緣〉
- id: doc_113_高雄_龍華_國文_g8s2e3_s3_15
  section: 3
  number: 15
  type: single
  page: 3
  stem: 下列題辭的使用，哪一項完全正確？
  options:
  - label: A
    content: 書法比賽：入木三分／鐵畫銀鉤／龍飛鳳舞
  - label: B
    content: 慶賀男壽：松柏長青／萱草長春／萬壽無疆
  - label: C
    content: 哀輓女喪：懿範長存／福壽全歸／遽返道山
  - label: D
    content: 醫界開業：杏壇春暖／懸壺濟世／仁心仁術
- id: doc_113_高雄_龍華_國文_g8s2e3_s3_16
  section: 3
  number: 16
  type: single
  page: 3
  stem: 下列情境中所使用的題辭，何者的說法或做法正確？
  options:
  - label: A
    content: 娜美：羅賓在歌唱大賽中技壓群倫，獲得了一座題寫著「珠圓玉潤」的獎盃
  - label: B
    content: 香吉士：我在高雄的新餐廳開張時，朋友們合送了一塊「前程似錦」的匾額
  - label: C
