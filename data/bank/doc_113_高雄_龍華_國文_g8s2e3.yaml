- id: doc_113_高雄_龍華_國文_g8s2e3_s4_34
  section: 4
  number: 34
  type: single
  page: 8
  stem: 根據本文，下列敘述何者正確？
  options:
  - label: A
    content: 透過表演繁複的事物，描寫口技表演者出神入化的技藝
  - label: B
    content: 藉由火災意外的發生，凸顯口技表演者臨危不亂的反應
  - label: C
    content: 以觀眾被火災表演嚇到逃離現場，烘托出其高明的技巧
  - label: D
    content: 因為觀眾精神不濟，口技表演者故意表演火災嚇唬他們
  group_stem: '京中有善口技者。會賓客大宴，於廳事之東北角，施八尺屏障，口技人坐屏障中，一桌、一椅、一扇、一撫尺①而已。眾賓團坐。少頃，但聞屏障中撫尺一下，滿坐寂然，無敢嘩者。

    遙聞深巷中犬吠，便有婦人驚覺欠伸②，其夫囈語。既而兒醒，大啼。夫亦醒。婦撫兒乳③，兒含乳啼，婦拍而嗚之。又一大兒醒，絮絮不止。當是時，婦手拍兒聲、兒含乳啼聲、大兒初醒聲、夫叱大兒聲，一時齊發，眾妙畢備。滿坐賓客無不伸頸，側目，微笑，默嘆，以為妙絕。

    忽一人大呼：「火起！」夫起大呼，婦亦起大呼。兩兒齊哭。俄而百千人大呼，百千兒哭，百千犬吠。中間力拉崩倒之聲，火爆聲，呼呼風聲，百千齊作；又夾百千求救聲，曳屋許許④聲，搶奪聲，潑水聲。凡所應有，無所不有。雖人有百手，手有百指，不能指其一端；人有百口，口有百舌，不能名其一處也。於是賓客無不變色離席，奮袖出臂，兩股戰戰⑤，幾欲先走。

    忽然撫尺一下，群響畢絕。撤屏視之，一人、一桌、一椅、一扇、一撫尺而已。

    注釋①撫尺：即醒木，說書人遇精采要緊處，為使人注意而用來擊桌的小木塊。②欠伸：張嘴哈氣伸懶腰。③撫兒乳：安撫孩子，餵他吃奶。④許許：音ㄏㄨˇ ㄏㄨˇ，眾人共同出力時所發出的聲音。⑤戰戰：害怕而發抖。

    （改寫自林嗣環〈口技〉）'
- id: doc_113_高雄_龍華_國文_g8s2e3_s4_35
  section: 4
  number: 35
  type: single
  page: 8
  stem: 關於文中口技的說明，下列何者正確？
  options:
  - label: A
    content: 表演口技者只會模仿人或動物的聲音，其他事物的聲音完全無法精準模仿
  - label: B
    content: 第二段中表演口技者模仿了各種人聲，依序為：婦人、丈夫、大兒、小兒
  - label: C
    content: 透過呼救聲與眾人救火的雜亂聲，烘托出所表演的火災場景既紛亂又緊張
  - label: D
    content: 「雖人有百手，手有百指，不能指其一端」描述眾人手忙腳亂救火的景象
