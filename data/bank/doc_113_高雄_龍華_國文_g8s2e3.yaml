    content: 電子菸溶液成分隨時會產生有毒金屬粒子
  group_stem: '■電子菸的引誘嘗試成分

    電子菸所使用之添加物，多半是為了使電子菸產品帶有特殊風味、甜味、薄荷味或其他香味等調味用途，例如添加糖類可使菸具有甜味或焦糖香味等特定氣味，減少電子菸難聞之氣味。常見的添加物如薄荷醇，具有止癢、輕微止痛、麻醉、清涼等效果，可減緩吸食電子菸呼吸道之刺激與不適感，且該氣味使人覺得舒適；有吸引或引誘特定族群嘗試吸菸，特別是初次嘗試吸菸者、兒童及青少年。

    ■電子菸的危害

    經檢測，電子菸溶液成分包括已知的致癌物及有毒化學物（如甲醛、乙醛）。此外，在霧化過程中可能產生有毒金屬奈米粒子等。使用電子菸亦可導致使用者對其中一些物質成癮，可能誘發罹患精神疾病。電子菸對於兒童、青少年、孕婦、物質濫用的病人、嚴重的精神疾病病人尤其更可能造成損害。

    （改寫自衛生福利部＜電子菸危害防治宣導＞）'
- id: doc_113_高雄_龍華_國文_g8s2e3_s4_32
  section: 4
  number: 32
  type: single
  page: 7
  stem: 根據內容，「公石虎第一次發生嘔吐」、「開始給予少量雞肉作為副食品」、「逐漸以貓乾糧泡奶水為主食」的情形，依序出現在哪個年齡的石虎身上？
  options:
  - label: A
    content: 6 週齡、8 週齡、10 週齡
  - label: B
    content: 6 週齡、7 週齡、10 週齡
  - label: C
    content: 7 週齡、8 週齡、10 週齡
  - label: D
    content: 9 週齡、10 週齡、16 週齡
  group_stem: '特有生物研究保育中心飼育了兩隻由民眾拾獲的石虎，其成長歷程如下表：

    | 年齡 | 餵食狀況及成長情形 |

    | --- | --- |

    | 6 週齡 | 每次以奶瓶餵代奶15～20ml，每天5～6 餐，母比公重。 |

    | 7 週齡 | 公石虎第一次發生嘔吐情形，母則無，治療後隔日恢復正常。 |

    | 8 週齡 | 奶量增加為每次20～30ml，開始給予少許雞肉作為副食品，公石虎體重逐漸大於母石虎。 |

    | 9 週齡 | 第二次發生嘔吐情形，公與母皆有症狀，治療後隔日即恢復。 |

    | 10 週齡 | 每天僅餵兩次奶，逐漸以副食品（貓乾糧泡奶水）為主。破壞力強，常咬壞奶嘴。 |

    | 14～15 週齡 | 訓練兩隻石虎適應較大的籠舍，並訓練進食整隻小雞與老鼠。 |

    | 16 週齡 | 開始在新籠子內全日生活，習慣吃帶毛的鼠與雞。 |

    | 20～24 週齡 | 每日各給3 隻小雞、4 隻老鼠，分早晚兩次給予，發現會玩食物。 |

    | 28 週齡 | 公石虎的睪丸掉入陰囊，逐漸性成熟，故將公母分籠。每隻石虎每日食物增加為4 雞5 鼠，分早晚兩次給予。 |

    | 36 週齡 | 麻醉做健康檢查，石虎們因緊張而食慾下降，體重減輕。 |

    | 40 週齡 | 將石虎們移至專屬大籠舍，可能因為換環境產生焦慮，公石虎有刻板行為出現。 |

    | 48 週齡 | 石虎逐漸熟悉環境，食慾恢復，每日約可進食5 雞5 鼠。焦慮情減輕，唯公石虎在人類進入籠舍時會誘發其刻板行為。 |

    （改寫自《自然保育季刊》63 期）'
