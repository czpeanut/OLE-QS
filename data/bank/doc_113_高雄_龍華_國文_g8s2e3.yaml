  stem: 近年來網路上大量使用主題標籤，若在「推特」上看到本篇報導，下列何者最有可能是這篇文章對電子菸的主題標籤？
  options:
  - label: A
    content: 電子菸的製作原理
  - label: B
    content: 電子菸的添加物質
  - label: C
    content: 電子菸的成癮症狀
  - label: D
    content: 電子菸的流行趨勢
  group_stem: '■電子菸的引誘嘗試成分

    電子菸所使用之添加物，多半是為了使電子菸產品帶有特殊風味、甜味、薄荷味或其他香味等調味用途，例如添加糖類可使菸具有甜味或焦糖香味等特定氣味，減少電子菸難聞之氣味。常見的添加物如薄荷醇，具有止癢、輕微止痛、麻醉、清涼等效果，可減緩吸食電子菸呼吸道之刺激與不適感，且該氣味使人覺得舒適；有吸引或引誘特定族群嘗試吸菸，特別是初次嘗試吸菸者、兒童及青少年。

    ■電子菸的危害

    經檢測，電子菸溶液成分包括已知的致癌物及有毒化學物（如甲醛、乙醛）。此外，在霧化過程中可能產生有毒金屬奈米粒子等。使用電子菸亦可導致使用者對其中一些物質成癮，可能誘發罹患精神疾病。電子菸對於兒童、青少年、孕婦、物質濫用的病人、嚴重的精神疾病病人尤其更可能造成損害。

    （改寫自衛生福利部＜電子菸危害防治宣導＞）'
