  stem: 根據文章的推論，下列何者正確？
  options:
  - label: A
    content: 麻沸散能使患者暫時的失去知覺
  - label: B
    content: 扁鵲治病使用的神藥即是麻醉藥
  - label: C
    content: 張湛認為扁鵲剖胸一事純屬虛構
  - label: D
    content: 麻沸散是提高療癒效能的特效藥
  group_stem: '《列子》中記述了春秋時代名醫扁鵲為公扈和齊嬰治病的事：「扁鵲遂飲二人毒酒，迷死三日，剖胸探心，易而置之；投以神藥，既寤，如初。」關於這對段記載，晉人張湛認為「此言恢誕，乃書記少有，然魏世華陀能刳①腸易胃，湔②洗五藏，天下理自有不可思議者。」不管是否過於誇張，但這有可能是關於麻醉藥的最早記載。

    另據《後漢書》記載，東漢 華佗發明了麻沸散，「若疾發結於內，針藥所不能及者，乃令先以酒服麻沸散，既醉無所覺，因挖破腹背，抽割積聚。若在腸胃，則斷截湔洗，除去疾穢。既而縫合，傅以神膏，四五日創愈，一月之間皆平復。」

    注釋①刳：音ㄎㄨ，剖開。②湔：音ㄐㄧㄢ，清洗。

    節錄自劉默《被誤解的歷史常識與真相》'
