  group_stem: '有二娼妓，一妓牙齒生得烏黑，一妓牙齒生得雪白。有人問齒黑者姓甚？其妓將口緊閉，在喉中答應：「姓顧。」問多少年紀？又鼓起腮答：「年十五。」問能甚的？又在喉中答：「會敲鼓。」又問齒白者何姓？其妓將口一呲①答：「姓秦。」問青春幾歲？口又一呲答：「年十七。」問會做什麼事？又將口一大呲，白齒盡露，說道：「會彈琴。」

