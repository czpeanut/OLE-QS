  stem: Which of the following is the best title to the reading?
  options:
  - label: A
    content: What You Should Know about the History of Sports Medicine.
  - label: B
    content: The Unknown Problems Behind Dieting.
  - label: C
    content: A Healthier Way to Eat and Live.
  - label: D
    content: How to Travel in Mediterranean Countries.
  group_stem: 'C.

    For a long time, health experts around the world have told people to have the
    “Mediterranean diet.” People who follow this diet would have grains, vegetables,
    seafood, and a small amount of meat in their meals. However, this is just a small
    part of the Mediterranean diet.

    Another part of the diet focuses on “how you eat”, not “what you eat” only. That
    means both are important. For a start, you should eat the meals slowly and chat
    with your friends and families happily. After that, take a relaxing walk with
    them to end the meal time.

    New studies find out that walking can be the key to a healthy life. According
    to the study in Sports Medicine, walking for one or two minutes after eating can
    reduce the amount of sugar in your blood by 17%. By taking a short walk after
    eating, you can keep you from getting diabetes.

    So, no matter what you plan to eat today, remember to share it with your family
    or friends, chat with them, and have a walk after the meal! Why not give “Mediterranean
    diet” a try?

