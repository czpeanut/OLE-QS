  group_stem: 'D.

    Help! I Got Lost in the Mountains!

    Before you go mountain climbing, you can download an offline map. With the map,
    you know your location even if you don’t have the Internet. Follow the rules below
    when you cannot find your way in the mountains.

    1. Don’t Worry

    Look carefully around you. Check the weather. Make sure the road is safe.

    2. Walk Back

    If you are not hurt and you still remember the way, try your best to walk back.
    Usually, you won’t be too far away from the right road.

    3. Walk to the Ridge

    If you don’t know the way back, try to go up to the ridge. When you walk on the
    ridge, your cellphone can work better, and the helicopter can see you more easily.

    4. Call and Wait for Help

    If you are hurt or too tired to walk, stay in the same place. Call “112” on your
    cellphone, and you must tell them “who, what, where, and when” as quickly as possible.

    📖offline 離線的 location 位置 helicopter 直昇機'
