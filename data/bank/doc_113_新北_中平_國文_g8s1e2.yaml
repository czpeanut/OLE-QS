- id: doc_113_新北_中平_國文_g8s1e2_s5_11
  section: 5
  number: 11
  type: single
  page: 5
  stem: 根據本文，Instagram 對青少年的負面影響不包括：
  options:
  - label: A
    content: Instagram 在親密朋友間的高曝光率，直接導致校園霸凌的發生
  - label: B
    content: 青少年在Instagram 的有害體驗，影響到他在生活中的自我認同
  - label: C
    content: Instagram 注重身體和生活方式，容易使青少年產生不健康感覺
  - label: D
    content: Instagram 的演算法可能讓厭世的青少年接觸到鼓勵自殘的文章。
  group_stem: '年輕人早就從Facebook 轉移至Instagram，Instagram 用戶有四成年齡在22 歲以下。美國青少年在Instagram
    花的時間比Facebook 多50%，為了解社群媒體對青少年的影響，Facebook 動用資料科學、行銷和產品開發等領域的員工，許多人擁有電腦科學、心理學以及量化和質化分析的背景，研究用戶如何與平臺互動，近年來做了多次焦點團體、線上調查和日記研究。

    《華爾街日報》報導揭露Facebook 內部文件，指出有三成少女表示「若她們覺得自己的身材糟糕時，Instagram 會讓她們感覺更糟。」青少年將焦慮和憂鬱率增加歸咎於Instagram，有自殺傾向的青少年中，13%英國用戶和6%美國用戶自殺念頭追溯到Instagram。另一項跨大西洋研究則發現，超過40%的Instagram
    用戶表示感覺自己沒有吸引力始於Instagram，約四分之一表示感覺不夠好的青少年，也表示是從使用Instagram 開始。

    人們會根據他人的吸引力、財富和成功來評估自己的價值，這種社會比較在Instagram 更糟糕，結論是有些問題是Instagram 特有。該報導寫道，TikTok
    以表演為基礎，Snapchat 用戶則透過濾鏡將焦點保持在臉部，但Instagram 非常注重身體和生活方式，內部研究表明，只分享最佳時刻的傾向、看起來完美的壓力和令人上癮的產品可能會使青少年陷入飲食失調、對自己身體的不健康感覺和憂鬱症，且內容還提到透過演算法為用戶提供照片和影片的探索頁面，可能會讓用戶近一步接觸可能有害的內容。

    Instagram 正在醞釀完美風暴！內部文件發現，青少年就算知道應該少上Instagram，但缺乏自制力，有人提出建議：「Instagram 應該減少名人時尚、美容和人際關係曝光，增加親密朋友曝光。」報導指出Facebook
    對Instagram 研究突顯他們明知將青少年推入虎口卻裝傻，公開場合Facebook 一直淡化Instagram 對青少年的負面影響，並沒有將研究公開或提供要求的學者或立法者。

    青少年一直是金雞母，商人不可能放棄這塊市場，內部文件有句話說明一切：「Instagram 很適合在年輕人引起共鳴並贏得他們的青睞，如果Instagram 能繼續發展軌跡，就有增長之路。」Facebook
    拒絕對此提出看法，Instagram 公共政策負責人說《華爾街日報》的報導偏頗負面角度，表示：「世界有負面社會比較和焦慮等問題，因此也存於社群媒體」。商人的良心發現速度永遠比不上利益，心智成熟之前，青少年最好少接觸社群媒體。

    節錄改寫自《遠見雜誌－早知Instagram 是毒品？臉書內部文件：危害青少年心理健康》'
