    content: 鬼魅。
  group_stem: "晉時，吳興一人，有二男，田中作時，嘗見父來罵詈①，趕打之。兒以告母，母問其父，父大驚，知是鬼魅，便令兒斫②之，鬼便寂不復往。父憂恐兒為鬼所困，便自往看。兒謂是鬼，便殺而埋之。鬼便遂歸，作其父形，且語其家：「二兒已殺妖矣。」兒暮歸，共相慶賀，積年不覺。\n\
    \  後有一法師過其家，語二兒云：「君尊侯有大邪氣。」兒以白③父，父大怒。兒出，以語師，令速去。師遂作聲④入，父即成大老狸，入床下，遂擒殺之。向所殺者，乃真父也。改殯治服⑤。一兒遂自殺，一兒忿懊，亦死。\n\
    《搜神記》\n註釋：①罵詈：責罵，詈，音ㄌㄧˋ。②斫ㄓㄨㄛˊ：砍殺。③白：告訴 ④作聲：口念咒語。\n⑤改殯治服：重新為父親改葬、服喪。"
