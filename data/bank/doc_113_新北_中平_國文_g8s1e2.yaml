  section: 5
  number: 13
  type: single
  page: 6
  stem: 門人忿然曰：「君責人亦太無理！」的原因是？
  options:
  - label: A
    content: 因主人染病卻不願就醫，胡亂對門人發脾氣
  - label: B
    content: 因門人夜色昏暗找不到鑽火用具，遭到主人斥責
  - label: C
    content: 因門人視力不良找不到刷漆工具，被主人斥責
  - label: D
    content: 因主人未聽醫囑服藥，導致疾病傳播給門人。
  group_stem: '某甲夜暴疾，命門人鑽火。其夜陰暝，不得火，催之急，門人忿然曰：「君責人亦太無理！今暗如漆，何以不把火照我？我當得覓鑽火具，然後易得耳。」孔文舉①聞之曰：「責人當以其方也。」

    《□□□□》

    註釋：①孔文舉：孔融，字文舉，漢末文學家。'
