- id: doc_113_新北_中平_國文_g8s1e2_s3_1
  section: 3
  number: 1
  type: essay
  page: 1
  stem: 他噬之如命的愉樂活動就是待在家中佻高的屋舍裡，擁懶地躺著看書。有時他也會拿起一把劍，在寬敞的空間裡霹殺著空氣，彷彿在對抗張牙舞爪的怪物。
  tags:
    textbook: 八上 第一課 田園之秋選
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
      code: 第一課
      title: 田園之秋選
      chapter: null
- id: doc_113_新北_中平_國文_g8s1e2_s4_1
  section: 4
  number: 1
  type: single
  page: 1
  stem: 根據〈田園之秋選〉一文，下列選項中的文句所描述的景象，何者與「黑壓壓的，滿天烏雲，盤旋著，自上而下，直要捲到地面」一句相同？
  options:
  - label: A
    content: 惡魔與妖巫之出世
  - label: B
    content: 閃電纏身，霹靂壓頂
  - label: C
    content: 天上的水壩在洩洪似的
  - label: D
    content: 彷彿聽見了貝多芬《田園交響曲》第四樂章〈牧羊人之歌〉。
  lesson_raw:
    title: 田園之秋選
    basis: 題目引用〈田園之秋選〉課文
  tags:
    textbook: 八上 第一課 田園之秋選
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
      code: 第一課
      title: 田園之秋選
      chapter: null
- id: doc_113_新北_中平_國文_g8s1e2_s4_2
  section: 4
  number: 2
  type: single
  page: 1
  stem: 下列引號中的詞語意思，何者與其他三者最不相同？
  options:
  - label: A
    content: 原本晴空萬里的天氣，「霎時」天昏地暗
  - label: B
    content: 王冕的繪畫天分極高，只見他拿起畫筆，「須臾」便畫成一幅美麗的風景畫
  - label: C
    content: 蘇軾在獄中一見餐食有魚，便以為有壞消息，「立時」覺得心灰意冷
  - label: D
    content: 西北雨歷時短，天氣「轉眼」便能放晴。
  tags:
    textbook: 八上 第一課 田園之秋選
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
      code: 第一課
      title: 田園之秋選
      chapter: null
- id: doc_113_新北_中平_國文_g8s1e2_s4_3
  section: 4
  number: 3
  type: single
  page: 1
  stem: 請判斷下列引號中詞語的詞性結構，何者不符合「句中對」的要求？
  options:
  - label: A
    content: 西北雨前，窗外常常會忽然「天昏地暗」的
  - label: B
    content: 閃電與霹靂「左右夾擊」，前後合攻
  - label: C
    content: 在田野中遇到閃電打雷，會令人「膽破魂奪」
  - label: D
    content: 滿天「張牙舞爪」的黑怪，是將降下西北雨的前奏。
  tags:
    textbook: 八上 語文常識(二) 語法(下)句子
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
      code: 語文常識(二)
      title: 語法(下)句子
      chapter: null
- id: doc_113_新北_中平_國文_g8s1e2_s4_4
  section: 4
  number: 4
  type: single
  page: 1
  stem: 下列引號中的詞語解釋，何者前後相同？
  options:
  - label: A
    content: 「盡」向地面襲來／「盡」情揮灑
  - label: B
    content: 雷電威力「為」雨勢遮掩／我「為」人人，人人為我
  - label: C
    content: 我「酷」愛旱地／臺灣夏天的天氣「酷」熱
  - label: D
    content: 電光在天邊「横」掃／她總是蠻「橫」不講理。
  tags:
    textbook: 八上 第一課 田園之秋選
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
      code: 第一課
      title: 田園之秋選
      chapter: null
- id: doc_113_新北_中平_國文_g8s1e2_s4_5
  section: 4
  number: 5
  type: single
  page: 1
  stem: 下列引號中的成語，何者運用最為正確？
  options:
  - label: A
    content: 如果一再宣傳的政策，卻不確實去執行，難免讓人批評是「雷厲風行」
  - label: B
    content: 輝達公司的執行長黃仁勳，現在在臺灣的名聲是「疾風迅雷」，所到之處，萬人空巷
  - label: C
    content: 這次古典音樂節辦得十分成功，現場悠揚的音樂聲「如雷貫耳」，大家都靜靜的享受著
  - label: D
    content: 這些願景，如果沒有人去計劃、執行，那期盼的美好未來，也只會像是「海市蜃樓」，一場虛空。
  tags:
    textbook: 八上 第一課 田園之秋選
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
      code: 第一課
      title: 田園之秋選
      chapter: null
- id: doc_113_新北_中平_國文_g8s1e2_s4_6
  section: 4
  number: 6
  type: single
  page: 1
  stem: 在文章摹寫中，運用聯想力，將視覺、聽覺、味覺、觸覺、嗅覺等不同印象，轉移互通的寫作手法，稱作「移覺」。下列各項移覺的手法，何者與〈田園之秋選〉中，表現雨後天青的景色，卻以「彷彿聽見貝多芬《田園交響曲》」一句，同樣以聽覺印象表現視覺印象？
  options:
  - label: A
    content: 她的歌喉無人可比，只要聽她唱歌，身上任一毛孔無不舒坦
  - label: B
    content: 這道菜平凡無奇，口味彷彿黑白照片般色彩全無
  - label: C
    content: 今天寒流來襲，這冷冽的風吹來，就像刀子割在肉上般疼痛
  - label: D
    content: 這幅圖畫用色大膽鮮艷，一面欣賞著，一面似也聽到了鑼鼓喧天。
  lesson_raw:
    title: 田園之秋選
    basis: 題目引用〈田園之秋選〉課文文句分析移覺修辭
  tags:
    textbook: 八上 第一課 田園之秋選
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
      code: 第一課
      title: 田園之秋選
      chapter: null
- id: doc_113_新北_中平_國文_g8s1e2_s4_7
  section: 4
  number: 7
  type: single
  page: 2
  stem: 請問下列何者讀書心境與陶淵明「每有會意，便欣然忘食」最為接近？
  options:
  - label: A
    content: 蘇軾：「發憤識遍天下字，立志讀盡人間書」
  - label: B
    content: 孔子：「發憤忘食，樂以忘憂」
  - label: C
    content: 朱熹：「問渠哪得清如許？為有源頭活水來」
  - label: D
    content: 陸游：「書到用時方恨少，事非經過不知難」。
  lesson_raw:
    title: 五柳先生傳
    basis: 題目引用陶淵明〈五柳先生傳〉課文原句
