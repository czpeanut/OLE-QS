- id: doc_113_新北_中平_國文_g8s1e2_s5_1
  section: 5
  number: 1
  type: single
  page: 3
  stem: 依據本文，從定伯與鬼的互動，推斷文章的故事情節發展順序為何？
  options:
  - label: A
    content: 識鬼→遇鬼→賣鬼
  - label: B
    content: 賣鬼→識鬼→遇鬼
  - label: C
    content: 遇鬼→識鬼→賣鬼
  - label: D
    content: 識鬼→賣鬼→遇鬼。
  group_stem: "南陽有個人叫宗定伯，他年輕的時候，有一次走夜路遇見了鬼。\n  當時颳著陣陣陰風，定伯停下腳步，壯起膽問：「是誰？」對方回答：「我是鬼。」接著問：「你又是誰？」定伯擔心鬼會加害自己，猶豫了一下決定欺騙鬼，便說：「我也是鬼。」鬼問：「你要去哪裡？」定伯說：「我要去宛市。」鬼很高興的說：「太巧了，我也去宛市，那我們結伴一起走吧！」\n\
    \  他們共同走了幾里路，鬼提議說：「唉！走路實在太累了！我們可以輪流背著對方走，這樣比較省力。」定伯說：「真是好主意！」鬼於是先背著定伯走了幾里路。鬼說：「咦！老兄，你實在太重了，恐怕不是鬼吧？」定伯鎮定的說：「我剛死不久，所以身體比較重。請多多包涵。」\n\
    \    走了一段路之後，換成定伯背鬼，鬼輕得幾乎沒有重量。他們就這樣輪流互背了好幾次。途中定伯問鬼：「我剛死，不知道我們鬼害怕什麼？」鬼回答：「我們鬼最怕被人吐口水。」他們走著走著，到了河邊。定伯讓鬼先過河，鬼過河時居然完全沒有濺起任何水花，就靜悄悄的過了河。等到定伯渡河時，卻發出了嘩啦啦的水聲。鬼問：「你過河時，怎麼會有聲音呢？」定伯說：「我剛死不久，還不熟悉鬼的過河方式，請不要見怪。」\n\
    \  快走到宛市時，定伯突然迅速將鬼舉到頭上，並緊緊抓住他。鬼一時措手不及，驚慌的大聲吼叫：「你要做什麼？快放我下來！」定伯絲毫不理他，加快腳步直奔宛市。到了宛市，定伯大力的把鬼摔到地上，鬼瞬間變成了一隻羊，定伯想找個買家把羊給賣了。因為擔心鬼再起變化，就朝羊身上吐了好幾口口水，最終賣得一千五百錢，然後揚長而去。\n\
    \  在當時有人流傳著：「定伯賣鬼顯奇能，賣得一千五百錢。」\n改寫自《列異傳》"
  tags:
    textbook: 八上 自學課一 世說新語選(一)坦腹東床(二)王藍田食雞子
    labeled_by: ai
    chapter:
      publisher: 翰林
