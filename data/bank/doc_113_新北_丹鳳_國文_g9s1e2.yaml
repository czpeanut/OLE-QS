- id: doc_113_新北_丹鳳_國文_g9s1e2_s2_37
  section: 2
  number: 37
  type: single
  page: 4
  stem: 根據本文，作者所謂「電腦化」的閱讀，其特性最不可能包含下列何者？
  options:
  - label: A
    content: 以「掃瞄」方式閱讀，獲得大量資訊
  - label: B
    content: 透過他人的摘要與引介，能快速吸收
  - label: C
    content: 大量的資訊可以豐富心智
  - label: D
    content: 閱讀摘要重點，以求增加效率。
  group_stem: '處理大量資訊是電腦的運作方式，而不是人心的思維方式。當我們閱讀的數量越來越多，速度越來越快，效率越來越高，以至於越來越接近「掃瞄」之際，或許我們就真的進入了一個「電腦化」的時代。

    所謂閱讀的「電腦化」，指的並不是我們使用電腦，或透過電腦閱讀。指的是，因應資訊爆炸的情況，使許多人以高度的勤奮與超人的努力，把自己的心靈壓縮成某種意義上是一臺高效率的電腦—只是輸入大量資訊，按照既定程序處理，然後再加以輸出的工作機器—因而任令資訊窒息了他們「人心的思維」。

    現代的讀萬卷書，往往只是讀摘要或結論，對於其中的精神經驗與心理歷程並不重視。因此出現許多摘要與引介的文章，而且讀引介的人，永遠多於原著的讀者，這正是「電腦化」閱讀最粗淺的癥候。

    但是一本經典的著作，猶如一位超越古今的偉大教師。其所顯現的思維方向與表現形式，都是他精神氣質與人格風度的展露。只有受其精神氣質的浸潤感染，受其人格風度的潛移默化，才能開啟我們的思維，進而在生活上有所創造。經典著作不只是一些固定的觀念與過去資訊的陳跡，而是精神的展示、風格的顯現。

    「告訴你結論或答案」和「教導你如何思維與創造」，是截然不同的兩回事，但卻可以同時發生在同一個作品中。從前者而言，所有的經典著作，都不免是昨日過時的資訊。從後者而言，經典著作之所以經典，正因為它萬古常新，開啟未來無限的思維，刺激未來無盡的創造……，不論在文化上、人格上，或者日常生活上。（改寫自柯慶明閱讀）'
