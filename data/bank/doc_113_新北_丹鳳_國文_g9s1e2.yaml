    「告訴你結論或答案」和「教導你如何思維與創造」，是截然不同的兩回事，但卻可以同時發生在同一個作品中。從前者而言，所有的經典著作，都不免是昨日過時的資訊。從後者而言，經典著作之所以經典，正因為它萬古常新，開啟未來無限的思維，刺激未來無盡的創造……，不論在文化上、人格上，或者日常生活上。（改寫自柯慶明閱讀）'
