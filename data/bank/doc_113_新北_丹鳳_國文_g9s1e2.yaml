- id: doc_113_新北_丹鳳_國文_g9s1e2_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 孫子兵法：「視卒如嬰兒，故可與之赴深谿；視卒如愛子，故可與之俱死。厚而不能使，愛而不能令，亂而不能治，譬若驕子，不可用也。」根據這段文字，下列敘述何者最恰當？
  options:
  - label: A
    content: 帶兵要帶心，統治者要能同理下位者的需求
  - label: B
    content: 風行草偃、上行下效是為將領者的不二法門
  - label: C
