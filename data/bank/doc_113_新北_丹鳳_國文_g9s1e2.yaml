- id: doc_113_新北_丹鳳_國文_g9s1e2_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 「一期一會」來自日文，是日本茶道中很重要的一種精神。就茶道來說，每一碗茶都是唯一的。這一次一起喝茶的朋友們，下次不見得能再聚在一起。就算人都一樣好了，風花雪月，四時心情，日子不一樣，茶的味道就不一樣。兩碗茶，無法有相同的感受。「一期一會」就是要將每一碗茶，當作是今生唯一、最後的一碗茶，懷抱著感激，安靜地品嘗這碗茶的香味。根據上文，下列選項何者最能詮釋「一期一會」的內涵？
  options:
  - label: A
    content: 人生無常，不必執著
  - label: B
    content: 把握當下，珍惜所有
  - label: C
    content: 世事多變，禍福難料
  - label: D
    content: 逝者已矣，展望未來。
  tags:
    chapter:
      publisher: null
      book: 九上
      subject: 國文
      code: null
      title: null
