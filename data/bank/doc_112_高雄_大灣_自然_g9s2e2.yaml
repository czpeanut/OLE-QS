- id: doc_112_高雄_大灣_自然_g9s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 下列敘述何者錯誤？
  options:
  - label: A
    content: 兩磁鐵互相靠近時，若是同名極會彼此排斥，若是異名極則會互相吸引
  - label: B
    content: 被磁化後的鐵釘無法長期保有磁性稱為暫時磁鐵
  - label: C
    content: 磁力是一種超距力，且N 極或S 極不能單獨存在
  - label: D
    content: 磁性物質受外在磁力的影響而具有磁性，遠端形成異名極。
