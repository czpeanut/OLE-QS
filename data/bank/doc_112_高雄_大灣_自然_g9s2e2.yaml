- id: doc_112_高雄_大灣_自然_g9s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 關於電流的三大效應，哪一選項敘述是正確？
  options:
  - label: A
    content: 電流的熱效應：通電流會產生磁場，如：電磁鐵
  - label: B
    content: 電流的磁效應：通電流會產生熱能，如：電鍋、暖爐
  - label: C
    content: 電流的化學效應：電解質溶液通電流後會產生化學變化，如：電解硫酸銅溶液、電鍍
  - label: D
    content: 電流的熱效應：將熱能轉為電能，如：烤箱。
  tags:
