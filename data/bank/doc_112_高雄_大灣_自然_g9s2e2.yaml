- id: doc_112_高雄_大灣_自然_g9s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 若將圖一的棒狀磁鐵截斷成甲、乙兩種情形如圖二，則下列敘述何者正確？
  options:
  - label: A
    content: 甲的兩塊磁鐵的右端（上下塊）皆形成 S 極，斷口接合時皆會相斥
  - label: B
    content: 乙磁鐵的斷口處不會有新的磁極產生
  - label: C
    content: 甲磁鐵外部磁場方向由左端進入，右端通出
  - label: D
    content: 乙磁鐵的斷口處接合時會相斥。
  assets:
