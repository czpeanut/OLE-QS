  type: single
  page: 4
  stem: 鏡面上的小水滴是以何種方式轉變為水蒸氣？若每天通電使用此除霧鏡的除霧功能 2 小時，連續使用 20 天，1 度電需付4 元，則所需的電費為下列何者？
  options:
  - label: A
    content: 蒸發，1.6 元
  - label: B
    content: 凝結4.8 元
  - label: C
    content: 蒸發，1600 元
  - label: D
    content: 凝結2400 元。
  group_stem: "(四)科普閱讀：閱讀後，請回答第40 題：\n   家中的浴室有一面除霧鏡，此除霧鏡需插電才能正常使用除霧功能，其所消耗的電功率為10\
    \ 瓦特。這種鏡子能夠除霧的原因，是因為其鏡面背後有連接鎳鉻金屬薄片的電路，經通電後，鎳鉻金屬發熱使鏡子的表面溫度升高，並維持在50℃，如此可去除附在鏡面上的細小水滴，而使鏡子可以一直保持清晰明亮。（1\
    \ 度＝1 仟瓦．小時）而鏡子為何會產生霧氣?鏡子的霧氣是室內的水蒸汽遇到溫度較低的鏡面液化而形成的。也就是說，減小鏡子表面和水蒸氣的溫度差，就可以減少霧氣的產生。"
