- id: doc_112_高雄_大灣_自然_g9s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 將導線穿過水平紙面，距導線東、西、南、北各 3 cm 處放置磁針甲、乙、丙、丁，四個磁針 N 極均指向北方，如圖所示。當通以方向朝下的電流時，發現其中有一個磁針的N
    極是指向北方。接著改通以方向朝上且大小相同的電流時，也發現其中有一個磁針的N 極是指向北方。前後兩次改變電流方向時，分別是哪一個磁針的N 極指向北方？
  options:
  - label: A
    content: 甲、乙
  - label: B
    content: 丙、甲
  - label: C
    content: 乙、丁
  - label: D
    content: 甲、丙。
