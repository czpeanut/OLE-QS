questions:
- id: doc_112_桃園_平南_社會_g8s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 蔣中正為中華民國歷史發展的重要人物，參與過許多重大的歷史事件。請問：下列哪一個事件與他較無關聯？
  options:
  - label: A
    content: 剿共
  - label: B
    content: 成立滿洲國
  - label: C
    content: 西安事變
  - label: D
    content: 擔任黃埔軍校校長。
- id: doc_112_桃園_平南_社會_g8s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 民國 38 年對中華民國來說，是個重要的一年。請問：這年發生了什麼重大事件？
  options:
  - label: A
    content: 中日戰爭爆發
  - label: B
    content: 國共內戰爆發
  - label: C
    content: 美國派特使來中國
  - label: D
    content: 中華民國政府遷臺。
- id: doc_112_桃園_平南_社會_g8s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 一位東北軍的將領說道：「……我已經好久沒有回到我的家鄉了，自從外敵入侵後，國民政府便下令要我們撤退，現在我們成為無根的浮萍，不知道何時才能回到那令人懷念的家鄉？」請問：因為當時國民政府抱持著什麼樣的策略，而失去東北，也導致民間的反日情緒日漸高漲？
  options:
  - label: A
    content: 速戰速決
  - label: B
    content: 以空間換取時間
  - label: C
    content: 先安內後攘外
  - label: D
    content: 停止剿共，一致抗日。
- id: doc_112_桃園_平南_社會_g8s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 中國國民黨和中國共產黨曾經有兩次合作，分別發生於何時？
  options:
  - label: A
    content: 聯俄容共、西安事變後
  - label: B
    content: 十年建設、九一八事變
  - label: C
    content: 五四運動期間、聯俄容共
  - label: D
    content: 北伐期間、西安事變後。
- id: doc_112_桃園_平南_社會_g8s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 阿華在某電視特輯中看到一位長者訴說年輕時的回憶：「戰事開打後，因為敵軍不斷進逼，北平(今北京)、天津相繼淪陷，許多工廠被迫往南遷徙，我就讀的學校也遷至湖南長沙。隨著戰事擴大，政府遷都重慶，學校計畫再遷移至昆明。為了節省經費，我和許多同學參加校方規畫的『長沙臨時大學湘黔滇旅行團』，雖然名為旅行團，但其實我們歷經千里跋涉，步行
    68 天，行走 1300 公里，才抵達了昆明。」由上述內容判斷，此一特輯是以何者為報導題材？
  options:
  - label: A
    content: 九一八事變
  - label: B
    content: 中日戰爭
  - label: C
    content: 國共內戰
  - label: D
    content: 二萬五千里長征。
- id: doc_112_桃園_平南_社會_g8s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 「駝峰航線」是美國援華的補給線，被譽為航空史的奇蹟，從印度的汀江起飛，向東橫越喜馬拉雅山，直抵昆明或重慶。這條空運通道，須飛躍綿亙起伏的高山陡谷，很像駱駝的背峰，故以此命名。因海拔高達七千公尺，氣流太猛，容易撞山，美國援華飛行員們表示：「根本是『死亡航線』，有時一天摔三架！」另一人說：「有次日本戰鬥機迎面而來，我的運輸機無反擊能力，只好躲在雲層裡，引擎差點結冰失事。」請問：此航線的開闢，與下列何事最有關聯？
  options:
  - label: A
    content: 九一八事變
  - label: B
    content: 南京大屠殺
  - label: C
    content: 盧溝橋事變
  - label: D
    content: 珍珠港事變。
- id: doc_112_桃園_平南_社會_g8s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 清末以來，中國受到不平等條約的束縛，直至民國建立後，持續影響中國，直到條約廢除。中國不平等條約的「簽訂」和「廢除」，各出現在哪一場戰爭？
  options:
  - label: A
    content: 八國聯軍、北伐完成後
  - label: B
    content: 甲午戰爭、八年抗戰
  - label: C
    content: 鴉片戰爭、第二次世界大戰
  - label: D
    content: 英法聯軍、中日戰爭
- id: doc_112_桃園_平南_社會_g8s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 某舊報紙上曾有一段敘述：「各地都在囤積物資，貨幣膨脹到太不值錢，我到餐廳，身懷近億元，但餐廳夥計告訴我，最便宜的也要 2 億元。想不到我身懷鉅款，竟然瞪眼看著天花板捱餓。」這段敘述反映出中國哪段時期的狀況？
  options:
  - label: A
    content: 十年建設期間
  - label: B
    content: 國共內戰期間
  - label: C
    content: 軍閥統治期間
  - label: D
    content: 北伐期間。
- id: doc_112_桃園_平南_社會_g8s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 以下內容出自於一位臺灣人的受訪紀錄：「在那個時代，我先是接受政府徵調當了日本兵，到廣東打中國兵。」「隨著戰爭的結束，我又當了中國兵，到東北打共產黨。」「但這都不是自己的選擇，是時代的悲哀。」這位臺灣人所描述的，應是他在下列何時的遭遇？
  options:
  - label: A
    content: 1900 年代
  - label: B
    content: 1910 年代
  - label: C
    content: 1930 年代
  - label: D
    content: 1940 年代。
- id: doc_112_桃園_平南_社會_g8s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 「訓政時期」是由孫中山規畫的政治過渡階段，透過以黨治國的指導，奠定未來推行共和政治的基礎。此一時期的開始與結束，是在哪兩個事件之間？
  options:
  - label: A
    content: 辛亥革命~北伐開始
  - label: B
    content: 北伐完成~盧溝橋事變
  - label: C
    content: 北伐完成~制定憲法
  - label: D
    content: 憲法頒布~動員戡亂。
- id: doc_112_桃園_平南_社會_g8s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 十年建設期間，中國內憂外患交迫，其中「內憂」與「外患」各是指何者？
  options:
  - label: A
    content: 中共、日本
  - label: B
    content: 軍閥、日本
  - label: C
    content: 滿洲國、日本
  - label: D
    content: 中共、蘇聯。
- id: doc_112_桃園_平南_社會_g8s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 紫禁城是中國著名的皇城，1925 年成立故宮博物館來管理前朝皇城的文物。然而受到政局動盪影響，為了保護國寶的安全，開啟遷運避難的計畫。故宮文物搬遷始於
    1931 年下半年，當時入侵的敵軍不斷壓迫中國東北。北平(今北京)、天津岌岌可危，故宮未雨綢繆，特別挑選院藏文物精品裝箱儲置，為文物播遷避難預作準備。請問：故宮文物最早開始籌畫搬遷，應與下列哪個事件有關？
  options:
  - label: A
    content: 七七事變
  - label: B
    content: 西安事變
  - label: C
    content: 珍珠港事變
  - label: D
    content: 九一八事變。
- id: doc_112_桃園_平南_社會_g8s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 民國建立後，貨幣制度混亂，商人至各地經商，往往攜帶各種不同的貨幣，諸如：美金、銀兩，甚至直接以黃金交易，此現象到何時才消失？
  options:
  - label: A
    content: 北伐期間
  - label: B
    content: 十年建設期間
  - label: C
    content: 八年抗戰期間
  - label: D
    content: 國共內戰期間。
- id: doc_112_桃園_平南_社會_g8s2e2_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: 國片《稻草人》描述日治時期的臺灣佃農收成變差、耕牛被徵收，兩兄弟面臨被徵召為軍伕的命運，後來一枚沒有爆炸的炸彈掉進田地後發生的一連串故事。請問：上述中的炸彈可能是哪個國家投擲的？
  options:
  - label: A
    content: 美國
  - label: B
    content: 日本
  - label: C
    content: 蘇聯
  - label: D
    content: 中國。
- id: doc_112_桃園_平南_社會_g8s2e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 歷經八年抗戰，中華民國終於獲得最後勝利。請問：這場戰爭對中國造成什麼影響？
  options:
  - label: A
    content: 戰爭期間的雅爾達會議，聲明東北應歸還給中華民國
  - label: B
    content: 開羅會議中，中美蘇簽訂密約，犧牲中國權益
  - label: C
    content: 中共在聯共抗日下，在八年抗戰期間乘機壯大勢力
  - label: D
    content: 戰爭結束後，美英首先與中華民國簽訂平等新約。
- id: doc_112_桃園_平南_社會_g8s2e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 孫中山在北伐之前就因病過世，其遺囑上稱「革命尚未成功，同志仍須努力」。以當時的時代背景，革命之所以尚未成功的主要障礙是下列何者？
  options:
  - label: A
    content: 軍閥
  - label: B
    content: 滿清
  - label: C
    content: 日本
  - label: D
    content: 中共。
- id: doc_112_桃園_平南_社會_g8s2e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 根據資料統計，日本自 1938 年到 1944 年之間，其軍事費用金額成長了 10 倍以上，以軍事費用占國民生產總額的比例來看，這段期間的占比大幅成長近八成，1944
    年時更是高達 98%以上。上述日本軍事費用急遽增加，最可能與下列哪一事件有關？
  options:
  - label: A
    content: 日軍於國共內戰爆發後支援共產黨
  - label: B
    content: 日本發動九一八事變占領中國某地
  - label: C
    content: 日俄爭奪中國權益，雙方爆發戰爭
  - label: D
    content: 日軍攻打珍珠港，開啟太平洋戰場。
- id: doc_112_桃園_平南_社會_g8s2e2_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 近年來詐欺犯罪層出不窮，檢察官工作量嚴重超出負荷，根據統計，新北地檢署自民國 111 年 9 月至 112 年 8 月，詐欺案件增加 16333 件，遽增
    60%，臺中地檢署詐欺案件也暴增了 37%。根據我國法律規定，下列關於文中司法人員之職權說明，何者正確？
  options:
  - label: A
    content: 出庭為案件的被告進行辯護
  - label: B
    content: 在刑事法庭擔任原告的角色
  - label: C
    content: 依法對犯罪嫌疑人提起自訴
  - label: D
    content: 對被告做出有期徒刑的判決。
- id: doc_112_桃園_平南_社會_g8s2e2_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 警方接獲民眾報案，路邊有兩男為搶停車位發生爭執，其中 35 歲張男憤而用腳踢壞 26 歲李男駕駛的車門，在李男大聲理論之際，警方趕到現場，將兩人帶回警局，全案經偵查後，依毀損罪起訴。依我國法律對上述事件的相關規定，下列敘述何者最正確？
  options:
  - label: A
    content: 雙方涉嫌之罪屬非告訴乃論不可調解
  - label: B
    content: 民眾向警方報案的行為稱為「告訴」
  - label: C
    content: 偵查犯罪行為及起訴皆屬檢察官職權
  - label: D
    content: 文中遭到起訴的嫌犯即可認定為有罪。
- id: doc_112_桃園_平南_社會_g8s2e2_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 陳先生是劉小姐的前夫，但陳先生屢次侵擾劉小姐的住處，甚至還到她上班的地方騷擾，最後陳先生因違反保護令的相關規定，被判處拘役四十天。根據上述內容判斷，下列敘述何者正確？
  options:
  - label: A
    content: 劉小姐因警察局所核發的保護令而獲得保障
  - label: B
    content: 陳先生必須為自己的違法行為負起刑事責任
  - label: C
    content: 劉小姐可依《性別平等教育法》向謝先生求償
  - label: D
    content: 陳先生若不服判決可向地方法院提出民事訴訟
- id: doc_112_桃園_平南_社會_g8s2e2_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 某文教基金會創辦人被指控對女聲樂家毛手毛腳。臺北地方法院判處該基金會創辦人 3 個月有期徒刑，可易科罰金。關於上述可以解讀出下列何項資訊？
  options:
  - label: A
    content: 罰金為刑罰中的從刑
  - label: B
    content: 有期徒刑為刑罰中的從刑
  - label: C
    content: 有期徒刑屬於剝奪財產的刑罰
  - label: D
    content: 該創辦人須負起刑事責任。
- id: doc_112_桃園_平南_社會_g8s2e2_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 近年來假消息猖獗，常會偽裝成新聞流傳於通訊軟體中，以下是吳言收到的相關法律新聞標題，其中哪一項應該是假訊息？
  options:
  - label: A
    content: 立委詐領補助費，僅被判褫奪公權
  - label: B
    content: 83 歲老婦撞傷路人，被判減輕其刑
  - label: C
    content: 駭客盜幣，被沒收不法所得高達百億
  - label: D
    content: 8 歲兒偷竊母報警，但不以刑罰處罰。
- id: doc_112_桃園_平南_社會_g8s2e2_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: 鄰居常常聽到隔壁小美的哭聲，疑似有遭受家庭暴力，某日鄰居看到小美手腳皆有傷痕，懷疑遭家人毆打成傷，隔壁鄰居見狀向警察機關報案，。上述鄰居的作法屬於刑事訴訟上的何種作為？
  options:
  - label: A
    content: 公訴
  - label: B
    content: 告訴
  - label: C
    content: 告發
  - label: D
    content: 自訴。
- id: doc_112_桃園_平南_社會_g8s2e2_s1_24
  section: 1
  number: 24
  type: single
  page: 2
  stem: 關於《刑法》的刑罰，下列相關敘述何者正確？
  options:
  - label: A
    content: 徒刑與罰金只能選一個
  - label: B
    content: 徒刑與罰金都屬於從刑
  - label: C
    content: 徒刑與罰金不能單獨宣判
  - label: D
    content: 徒刑與罰金都屬於主刑。
- id: doc_112_桃園_平南_社會_g8s2e2_s1_25
  section: 1
  number: 25
  type: single
  page: 2
  stem: 一個國家的社會秩序如果穩定，將有利於國家經濟的發展，我國對於處罰與預防犯罪的法律規定於《刑法》之中，而刑事訴訟的程序如附圖所示。請問：對於甲→乙→丙三個程序的主導者，下列組合何者正確？
  options:
  - label: A
    content: 檢察官→檢察官→法官
  - label: B
    content: 檢察官→檢察官→大法官
  - label: C
    content: 警察→檢察官→法官
  - label: D
    content: 警察→法官→檢察官。
  assets:
