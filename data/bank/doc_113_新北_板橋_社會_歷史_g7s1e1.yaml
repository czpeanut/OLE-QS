  section: 2
  number: 32
  type: single
  page: 2
  stem: 日治時期戶籍謄本對原住民的註記，部分源自於清帝國時期「生番」、「熟番」等稱呼。請問：清代「生番」、「熟番」是依據什麼標準區分而來？
  options:
  - label: A
    content: 原住民居住地區的海拔
  - label: B
    content: 原住民出外打獵的頻率
  - label: C
    content: 原住民是否納稅服勞役
  - label: D
    content: 原住民是否成年可嫁娶。
  group_stem: "人人都是平埔原住民？ \n  在臺灣，你絕不免會聽過的都市傳說：只要你有某項特徵，你就有原住民血統！比如手臂上的「祖靈線」（手肘彎曲，小手臂靠近彎曲處約2-3\
    \ 公分的明顯橫線）、深邃的雙眼皮、腳的小趾甲上有裂紋等。的確，原住民在先天基因的遺傳上，擁有與其他族群不同的外貌。但隨著社會越趨多元與開放，族群的遷徙與融合，使得先天的特徵也產生許多變數。\
    \ \n  那麼，究竟有多少臺灣人是真正的平埔原住民族後代呢？對自己的來歷與家族脈絡有興趣的你，可不能被這些子虛烏有的迷思矇騙。想要找到自己的根，以下是更有依據的方法！\
    \ \n1.到戶政事務所查詢日治時期，家族的戶籍謄本資料。 \n  日本人進行戶口調查時，曾針對臺灣族群做過種族登錄，並標記在戶籍謄本的種族欄上，其中便將山地原住民註記為「生」或「高」，將平地原住民註記為「熟」或「平」。\
    \ \n2.舊地名辨別。 \n   臺灣現在有許多地名，是根據平埔原住民舊社名稱而直接音譯，比如屏東市舊稱「阿猴」，就是過去馬卡道族Akao 社的舊址。此外，過去為了區別漢人與平埔原住民，在地名上會加上「番」或「社」，如「社仔」、「番仔寮」等等。而有些平埔原住民的舊居地，因漢譯後沒有對應的字，會將類似的字加上口字邊，如「噍」、「吧」、「唭」等字。像臺南玉井舊稱「噍吧哖」，便是平埔族過去居住地之一。\
    \ \n3.姓氏辨別。 \n  過去統治者為了管理方便，會強迫平埔原住民更改為漢姓，常見的姓氏包含潘、羅、卓、兵、蒲等。 \n上文參考改寫自：原視界〈人人都是平埔原住民？！〉（https://insight.ipcf.org.tw/article/204）"
