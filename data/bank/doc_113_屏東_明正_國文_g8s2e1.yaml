  type: single
  page: 2
  stem: 老師解說運動家的風度一文時，提及文中善用「言例」，便請同學搜尋文義上能與本文「言例」相對應的名句，以下是同學搜尋的結果，何者配對不正確？
  options:
  - label: A
    content: 潔晞：言必信，行必果——真金不怕火煉
  - label: B
    content: 承家：君子不怨天，不尤人——君子求諸己，小人求諸人
  - label: C
    content: 品萱：勝固欣然，敗亦可喜——人生得意而不忘形，失意而不喪志
  - label: D
    content: 永程：任重而道遠，貫徹始終——生活好比橄欖球比賽，原則就是「奮力衝向底線」。
