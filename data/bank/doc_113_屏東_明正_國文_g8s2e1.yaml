  section: 5
  number: 2
  type: single
  page: 4
  stem: 對於本則傳奇的理解，下列敘述何者正確？
  options:
  - label: A
    content: 崔護與都城女子的故事採順敘法寫作，情節曲折離奇，辭藻優美。
  - label: B
    content: 崔護與都城女子相遇三次，最終還是無法把誤會澄清
  - label: C
    content: 由都城女子死而復活的情節發展，可窺見濃厚的道家思想
  - label: D
    content: 崔護的言行舉指輕挑無禮，因而傷害了都城女子。
  group_stem: '博陵 崔護，資質甚美，而孤潔寡合。舉進士下第。清明日，獨遊都城南，得居人莊，一畝之宮，而花木叢萃，寂若無人。扣門久之，有女子自門隙窺之，問曰：「誰耶？」護以姓字對，曰：「尋春獨行，酒渴求飲。」女入，以杯水至，開門設床①命坐，獨倚小桃斜柯佇立，而意屬殊厚②，妖姿媚態，綽有餘妍。崔以言挑之，不對，目注者久之。崔辭去，送至門，如不勝情而入。崔亦睠盼而歸，嗣後③絕不復至。及來歲清明日，忽思之，情不可抑，徑往尋之。門牆如故，而已鎖扃④之。因題詩於左扉曰：「去年今日此門中，人面桃花相映紅。人面不知何處去，桃花依舊笑春風。」

    後數日，偶至都城南，復往尋之，聞其中有哭聲，扣門問之，有老父出曰：「君非崔護耶？」曰：「是也。」又哭曰：「君殺吾女！」崔驚起，莫知所答。老父曰：「吾女笄年知書，未適人，自去年以來，常恍惚若有所失。比日與之出，及歸，見左扉有字，讀之，入門而病，遂絕食數日而死。吾老矣，此女所以不嫁者，將求君子以托吾身，今不幸而殞，得非君殺之耶？」又持崔大哭。崔亦感慟，請入哭之。尚儼然在床。崔舉其首，枕其股，哭而祝曰：「某在斯，某在斯。」須臾開目，半日復活。老父大喜，遂以女歸之。

    （孟棨本事詩情感崔護）

    ①床：坐榻。 ②意屬殊厚：有著極深的情意。 ③嗣後：從此以後。 ④扃：關閉、關上。'
