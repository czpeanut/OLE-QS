  section: 4
  number: 6
  type: single
  page: 2
  stem: 「朝辭爺孃去，暮宿黃河邊，不聞爺孃喚女聲，但聞黃河流水鳴濺濺。旦辭黃河去，暮至黑山頭，不聞爺孃喚女聲，但聞燕山胡騎聲啾啾。」關於這段詩句的說明，下列敘述何者正確？
  options:
  - label: A
    content: 文中三度提及黃河，顯示黃河周邊就是戰事頻繁地區
  - label: B
    content: 反覆點出時間由早晨至黃昏，給人戰爭漫長難耐的感受
  - label: C
    content: 以時空的瞬變，傳達出一日千里的行軍迅捷，也意味木蘭離鄉愈遠，思親愈深
  - label: D
    content: 「但聞燕山胡騎聲啾啾」描繪戰場上兩軍士氣激昂壯烈。
  lesson_raw:
    title: 木蘭詩
