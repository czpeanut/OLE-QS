  stem: '張栩的棋風薄而銳利，擅長以對方最拿手的絕招來攻破對手。有的棋士喜歡拚殺、有的棋士喜歡布局，張栩則都配合他們，正面對決。

    在他的對弈人生中，最經典的一役就是二○○一年初次挑戰頭銜戰，面對擁有本因坊資格的王銘琬，打成三比三時，最後一戰，張栩採用王銘琬屢出奇招、變幻莫測的棋風，而即便最後敗北，輸了生平第一場頭銜賽，張栩也沒有太多懊悔。

    「我沒有很急著當下就贏，因為我想要贏過他們最強的地方，就會變得比他們還強。」他分析。

    二○一五年張栩與妻子搬回臺灣定居，希望藉由環境改變，重新找回手感。二○一六年初，睽違三年的時間，他重新在第六十三屆NHK 電視圍棋賽，拿下冠軍。

    職業棋士每天背負輸贏立判、黑白分明的壓力，但個性成熟的張栩說：「職業棋士不可能永遠贏，但至少心態上不能輸。」張栩深信，從10％開始一點一滴累積勝利，以最低的姿態，就能贏得最大的勝利。

    （資料來源：新臺灣之光100：超越自我的夢想家）

    之又想要使用剛抽到的「藝FUN 券」觀賞體育電影。下列電影標題及引用的劇中名言，何者與職業棋士張栩面對輸贏的心態最為接近？'
