  - label: B
    content: 語晨：無邊落木「蕭蕭」下，不盡長江滾滾來——形容下雨的聲音
  - label: C
    content: 若菲：宜圍棋，子聲「丁丁」然——形容下棋的聲音
  - label: D
    content: 子洋：讀書閉閣人罕識，明月夜照聲「琅琅」——形容清朗、響亮的聲音。
