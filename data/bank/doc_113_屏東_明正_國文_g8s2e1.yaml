- id: doc_113_屏東_明正_國文_g8s2e1_s5_5
  section: 5
  number: 5
  type: single
  page: 4
  stem: 若要為上文下一個標題，下列何者較為合適？
  options:
  - label: A
    content: 細說梅花妝的變革
  - label: B
    content: 花木蘭的妝飾與打扮
  - label: C
    content: 貼花黃的由來與演變
  - label: D
    content: 北朝女子最愛的化妝。。
  group_stem: '花黃，是古代流行的一種女性額飾，又稱額黃、鵝黃、鴨黃等，是把黃金色的紙剪成各式裝飾圖樣，或是在額間塗上黃色。關於這一習俗的由來，還有一個美麗的傳說。相傳，南北朝
    劉宋時，宋武帝的女兒壽陽公主有一次睡在含章殿簷下，有梅花恰巧落在她的額頭上，梅花漬染，在她額頭形成梅花之形，拂之不去。此後壽陽公主便經常將梅花貼在額前，宮人們也紛紛效仿。此後就有所謂梅花妝，簡稱梅妝。這種妝飾傳到宮外後，民間女子也紛紛效仿，或用菊花或用黃紙剪出花樣貼在前額，後來逐漸發展成「貼花黃」的習俗。

    北朝木蘭女扮男裝，代父從軍載譽歸來後，也不忘「當窗理雲鬢，對鏡貼花黃」。到了唐代，開始以金、銀製成花形，蔽於臉上，這種面飾稱作花鈿。

    五代 歐陽炯所寫的〈南鄉子〉：「二八花鈿，胸前如雪臉如蓮。耳墜金環穿瑟瑟，霞衣窄，笑倚江頭招遠客。」女子眉間一點花鈿，猶如畫龍點睛之筆，將古代女子映襯得美麗動人，活靈活現。或微微一笑，或輕輕蹙眉，不需多言就風情自在。

    （節錄網路文章）'
