  section: 1
  number: 46
  type: single
  page: 1
  stem: 19世紀，艋舺移民漸多，同安人為主的下郊，與三邑人的頂郊為了爭取艋舺碼頭的泊船權利，加上同安人自己奉祀有鄉土神霞海城隍，並未加入龍山寺的信仰圈，時常發生衝突。在公家官衙刻意忽視下，1853年，三邑人終於與同安人發生了俗稱「頂下郊拚」的分類械鬥。請問：「頂下郊拚」的發生，最可能與下列哪一現象有關？
  options:
  - label: A
    content: 合資開墾土地所引發的衝突
  - label: B
    content: 郊商排解糾紛、安定社會而引起
  - label: C
    content: 因商業利益而引發的械鬥
  - label: D
    content: 開港通商後的貿易爭奪戰
