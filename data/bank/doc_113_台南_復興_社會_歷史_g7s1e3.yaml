  - label: C
    content: 英法聯軍
  - label: D
    content: 戴潮春事件
  group_stem: ※傳統漢人男性大多負責農務工作，而女性則擔負了養育兒女、照料家庭的任務。然而，隨著臺灣經濟的發展，女性開始有了另一種角色。臺灣開港通商後，製茶業需要大量人力從事採茶、揀茶與包裝等工作，需要細心的特質，因此平日從事紡織、編織等家庭副業的婦女，便逐漸將工作場域從個別的家庭集中到特定的工廠或區域，從事撿茶的工作。
