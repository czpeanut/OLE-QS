  group_stem: 'Hi, I’m Scott. There are two parks near my house. They are both great,
    but they are very different.


    The first park is Star Park. There’s a big basketball court in it. My friends
    and I always play basketball there on Sundays. Beside the court, there’s a playground
    with swings and a slide for little children. There are two restrooms around the
    playground. This is convenient for parents with young kids when their children
    need to use the bathroom. If you like sports, Star Park is a nice place for you.


    The second park is Moon Park. There is a playground here, too. Like Star Park,
    the playground is with swings and a slide. What’s special about the park? There
    is a library here! Inside the library, there are many books for people of all
    ages. You can study or read books here. There are also restrooms in the library
    and in the park. The restrooms in the park are near the playground.


    Both parks are great, but they are for different activities. If you like playing
    sports, go to Star Park. If you like to read or study, Moon Park is good for you.
    I am happy to live near these two great parks.

