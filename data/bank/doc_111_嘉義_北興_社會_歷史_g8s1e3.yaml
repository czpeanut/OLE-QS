  type: single
  page: 4
  stem: 屈臣氏最早發跡地點澳門，請問當初是哪一家治理該地？
  options:
  - label: A
    content: 英國
  - label: B
    content: 葡萄牙
  - label: C
    content: 荷蘭
  - label: D
    content: 西班牙。
  group_stem: "（三）屈臣氏是中國歷史最悠久的藥房之一，最早可以追溯到1820 年皮爾森及李文斯頓在澳門開設的「澳門藥房」。1828 年，皮爾森與李文斯頓於中國廣州沙面開設「廣東大藥房」。1841\
    \ 年，廣東大藥房又於上環開設「香港大藥房」，不久後把在廣州的汽水工廠搬到香港。\n    1855 年，托馬斯·屈臣加入香港大藥房，三年後其侄子亞歷山大·斯柯文·屈臣（Alexander\
    \ Skirving Watson）獲聘為藥劑師，小屈臣從1860年起接手經營藥房。1871 年，公司正式註冊為A.S. Watson & Company\
    \ 並開始以此名進行貿易，成為正式的商業品牌。1886 年屈臣氏公司上市，成為公眾性股份有限公司。\n    在19 世紀中後期，屈臣氏成功在中國各地開辦多家分號，成爲成功的連鎖企業，同時發展汽水、飲料生産以及酒類進出口生意。至19\
    \ 世紀末在大陸有超過30 家屈臣氏大藥房，在香港也有超過30 家屈臣氏藥房。到20 世紀初，屈臣氏成爲遠東最大的藥房，其中又以上海分號的營業額最大。\n\n\
