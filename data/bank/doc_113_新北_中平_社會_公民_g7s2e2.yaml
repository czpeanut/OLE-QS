  page: 1
  stem: 從文化特性的觀點分析，將10 萬多名原住民兒童帶離他們的家庭和社區以學習白人價值觀的政策，其目的何在？
  options:
  - label: A
    content: 強化文化的制約性以壯大弱勢文化
  - label: B
    content: 重視文化累積性以達成文化的傳承
  - label: C
    content: 在文化差異的基礎上達成文化位階
  - label: D
    content: 透過文化普遍性以學習合宜的行為
  group_stem: "※題組一 (請回答第3 題到第4 題)\n    澳洲政府17 年前向歷來受到不公正對待的原住民族正式致歉，路透社報導，總理莫里森於國會發表談話以紀念這個日子。莫里森說，過去的行動，包括將10\
    \ 萬多名原住民兒童帶離他們的家庭和社區以學習白人的價值觀，必須勇於承認政策錯誤。在國會上向被稱為「失竊世代」(Stolen Generations)的原住民族成員致上具里程碑意義的官方道歉。\n\
    \    澳洲政府過去幾年都會在紀念道歉週年的這天公布「消弭落差」計劃的年度報告。這是一項長期進行，目的在改善原住民族生活的計畫。澳洲原住民人口約70 萬名，然而，在幾乎所有的經濟和社會指標中，他們近乎處於全國2,600\
    \ 萬國民的最底層。在歷經10 多年的時間，改善原住民預期壽命、教育和健康水準等目標仍無法達成後，澳洲政府去年對這項計劃進行全面改革，並將原住民領袖置於決策核心。\
    \                                               改編自網路新聞"
  tags:
