  group_stem: "※題組四 (請回答第13 題到第16 題) 【閱讀素養】\n   「博愛座」亦稱「優先席」，為大眾運輸工具當中為照顧孕婦、傷病者、年長者、身心障礙者所設立之座位。博愛座設置需靠近車門或出入口，以及確保博愛座通往出入口的地板平坦。\n\
    \    台北捷運公司行車處規劃課專員表示，「禮讓博愛座」的乘車禮儀，在旅客與工作人員的共同努力下，已形成獨特且珍貴的捷運文化，並且期許旅客不分年紀、性別或國籍，都能具有友善意識並相互尊重，也希望旅客秉持正確觀念，有需求時可以大方使用博愛座，或是徵詢他人的讓座意願，而使用一般座位的旅客也可以主動觀察他人需求並熱心讓座。期望能將博愛座設置的美意發揚光大，共創美好的環境與未來。\n\
    \   針對越來越多的博愛座爭議事件，為減少輿論壓力，衛生福利部社會及家庭署於近期公布，將修正《身心障礙者權益保障法》第53 條草案，計畫將「博愛座」更名為「優先席」。目的在於讓民眾不再被博愛一詞束縛，同時修正座位的適用對象，也增設友善隱性需求族群的讓座貼紙，讓大家共同營造美好的大眾運輸文明。\
    \          節錄自網路新聞"
