  page: 1
  stem: 社會規範並非一成不變，且常會互相影響。請問：下列哪一個選項沒有提到社會規範中的「倫理道德」？
  options:
  - label: A
    content: 傳統社會人們習慣在節慶時施放爆竹增添喜氣，然而基於安全考量，政府制定爆竹煙火管理條例
  - label: B
    content: 過去對於身心障礙者的協助多基於自發性的善心助人，如今透過身心障礙者權益保障法明定提供許多援助
  - label: C
    content: 由於環保意識的抬頭，許多廟宇減少香爐或改以用手參拜
  - label: D
    content: 隨著性別平等觀念的推行，我國修改婚姻制度的法規，讓同性婚姻合法化
