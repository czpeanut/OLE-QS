  section: 1
  number: 10
  type: single
  page: 1
  stem: 為了讓每一位民眾都可以享有安全的退休生活，政府在既有的職業保險外，規畫「國民年金」保險制度。但是實施以來，因為許多符合資格的民眾未按時繳納保險費，導致「國民年金」面臨破產的危機。請問，下列何者最有助於解決上述問題？
