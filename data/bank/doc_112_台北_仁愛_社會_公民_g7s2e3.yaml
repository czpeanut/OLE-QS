  type: single
  page: 1
  stem: 隨著新冠病毒變異株肆虐，資料顯示疫苗保護力在下降，部分國家討論是否要追打第三劑疫苗的加強針。甲國認為，應該要讓所有完整接種過疫苗的民眾都追加第三劑，提升全體國人的保護力。乙國認為，應讓易感染重症的群體優先施打第三劑，維持保護力。針對兩國追打第三劑疫苗的分析，下列何者較為正確？
  options:
  - label: A
    content: 甲國政策保障人民均等接種疫苗的機會，符合公平正義的內涵
  - label: B
    content: 乙國政策照顧易染重症的族群，重視人民機會的平等
  - label: C
    content: 甲國政策在資源不足的情形下，更可對人民提供妥善的照顧
  - label: D
    content: 乙國政策偏重照顧身體狀況相對弱勢者，與公平正義精神牴觸
