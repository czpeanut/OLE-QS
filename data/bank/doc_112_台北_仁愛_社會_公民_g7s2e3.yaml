  section: 3
  number: 38
  type: single
  page: 4
  stem: '「躺平族」指年輕群體對所處的社會環境充滿不平與無力感，出現不想努力選擇躺平，無欲無求的處事態度。根據國外研究，千禧世代(指目前28~43 歲者)在35
    歲時，比同一年齡的戰後嬰兒潮世代財富少了30%，嬰兒潮世代憑藉所繼承的房屋價值上漲與理財投資，較易累積財富成為高收入者，千禧世代歷經金融危機年代，住房擁有率低，債務超過資產，薪資低且工作不穩定，職業與財富狀況跟戰後嬰兒潮世代相比落差擴大，出現貧窮世襲、財富世襲的現象，導致千禧世代更易出現躺平族。

