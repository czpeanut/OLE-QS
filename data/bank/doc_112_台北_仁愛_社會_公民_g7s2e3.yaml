  stem: 日本經濟評論家大前研一曾提出「M型社會」，認為中產階級人數變少，低收入者和高收入者均變多，使得財富程度與人數的模型呈現M字型。近年，有人認為此模型已不適用當前臺灣社會，而提出「ㄩ型社會」，顯示出上圖中的轉變，其顯示何種現象日趨嚴重？
