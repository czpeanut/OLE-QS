  type: single
  page: 4
  stem: 中產階級，指的是擁有一定程度的經濟獨立，整體薪資相對高一點的族群，若以111 年每戶可支配所得94萬元下去算，中產階級落在70.5 萬到188 萬。中產階級為什麼會陷落呢？受數位化和自動化的影響，部分的工作被電腦科技取代，薪資漲幅明顯的產業是落在半導體等明星產業，企業老闆的盈餘增加，而一般產業員工能分到的經濟果實愈來愈少；另外，政府調薪政策調高的是最低基本工資，對薪資已逾基本工資的中產階級沒有上調機制無法受惠，加上房價飆漲，拚的頭破血流都很難買得起房子；此外，政府的稅制也有問題，持有豪宅者用很低的公告地價課稅，而非用市價課稅，高財富者繳的稅不合理的低，對社會福利資源助益有限。【摘錄自天下雜誌】根據上文，可做出以下何項推論？
  options:
  - label: A
    content: 中產階級的陷落與器物和制度層次的變遷有關
  - label: B
