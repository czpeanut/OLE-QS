- id: doc_112_台北_仁愛_社會_公民_g7s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: '小琪在雜誌上讀到以下內容，由文中畫線部分可看出何者促進了社會變遷中的公平正義？

    台灣少年權益與福利促進聯盟與多個關注少年權利的學生團體、少年團體組成「18 歲公民權推動聯盟」，舉辦各類演說活動、模擬投票、街頭遊行、民意調查等，希望推動政府下修投票年齡，終於在2017
    年底，經立法院三讀通過，修改公民投票法，將公民投票年齡由20 歲降至18 歲。'
