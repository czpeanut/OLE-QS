    content: 建立正確使用社會福利資源的觀念
  - label: B
    content: 民間力量彌補現行社會福利的不足
  - label: C
    content: 企業增加應繳納的國民年金保險費
  - label: D
    content: 個人必須要善盡對社會福利之責任
