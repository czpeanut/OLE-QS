  section: 1
  number: 9
  type: single
  page: 1
  stem: 四位同學一起討論社會變遷所帶來的影響，根據下圖的對話，請問：何人所述現象是因為社會變遷而惡化個人或群體所面臨的不公平處境？
  options:
  - label: A
    content: 政府明定性別工作平等法，無論男女只要符合規定，都可以申請育嬰假，讓更多女性願意投入職場
  - label: B
    content: 經過民間團體的努力催生家庭暴力防治法，打破以往「法不入家門」的觀念
  - label: C
    content: 建築技術發展後，高樓大廈變多，但不是每棟建築的電梯都有點字板和語音播放的設計
  - label: D
    content: 對於多元文化的重視，學校鄉土語言的課程選擇變多，讓大家可以尋根認識母語。
