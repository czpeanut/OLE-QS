    GDP 排名的主要原因？


    表一

    | 排名 | 國家 | 人均 GDP（美元） |

    | :-: | :-: | :-: |

    | 1 | 盧森堡 | 114,234 |

    | 2 | 瑞士 | 82,950 |

    | 3 | 挪威 | 81,695 |

    | 4 | 愛爾蘭 | 76,009 |

    | 5 | 冰島 | 74,278 |

    | 67 | 中國 | 9,608 |'
