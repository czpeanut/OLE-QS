    content: 西部地區主要優勢為天然資源豐富
  - label: B
    content: 「青藏鐵路」建設十分困難，主因是氣候嚴寒、凍土廣布
  - label: C
    content: 「西氣東輸」是指內蒙古盛產天然氣，供應長江三角洲所需
  - label: D
    content: 「南水北調」是將長江流域的水引至黃河流域。
