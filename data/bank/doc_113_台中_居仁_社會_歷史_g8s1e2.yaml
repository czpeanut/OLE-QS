- id: doc_113_台中_居仁_社會_歷史_g8s1e2_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 「這個時期，境內各族群依舊保留民族習俗，伊斯蘭教、佛教等各式宗教皆被接受，統治當局整合本身的軍事優勢、漢人的資源及穆斯林的商業技巧，分別以漢人體制及傳統體制管理各族群，建構了版圖遼闊的歷史階段。」上述為對中國某朝代的描述。請問：在這朝代中應還可見到何景象？
  options:
  - label: A
    content: 君主專制，導致流寇之禍亡國
  - label: B
    content: 倭寇盤據東南沿海，進行走私貿易
  - label: C
    content: 征服東突厥後得成吉思汗的稱號
  - label: D
    content: 為鞏固統治地位，將人民分等級，部分族群在政治法律多受限制
