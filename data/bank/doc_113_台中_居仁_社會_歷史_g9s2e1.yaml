  section: 1
  number: 11
  type: single
  page: 2
  stem: 西元1789 年7 月14 日，起事的民眾攻入巴士底監獄所在的堡壘，獄中升起了紅白藍三色旗，廢墟裡豎立一塊木牌，上面寫著：「這裡埋葬了巴士底監獄，象徵著『封建罪惡』的巴士底監獄從此在地球上永遠消失了。」下列何者是法國民眾所指的「封建罪惡」中的一種？
  options:
  - label: A
    content: 教士、貴族、平民三大階級須負擔一樣重的稅收
  - label: B
    content: 法王路易十六專制自為，召開國民會議欲徵稅。
  - label: C
    content: 第三階級人數較多，但投票時僅有一票
  - label: D
    content: 教士、貴族、平民依人數比例分配投票數量
