- id: doc_113_台中_居仁_社會_歷史_g9s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 維也納會議的召開，是為了重組當時歐洲混亂的政治秩序，此會議由奧國首相梅特涅主導，許多歐洲代表都派員共襄盛舉，共商往後各國勢力的發展，以及重整政治秩序。下列關於「維也納會議」的敘述，何者正確？
  options:
  - label: A
    content: 維也納會議主張維持歐洲各國現有的政治狀態，恢復各國王室統治權
  - label: B
    content: 維也納會議是在反法聯軍擊敗拿破崙後召開
  - label: C
    content: 維也納會議將法國大革命「自由、平等、博愛」的精神澈底實踐
  - label: D
    content: 維也納會議被視為是改革勢力的勝利。
