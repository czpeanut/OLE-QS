- id: doc_113_台中_居仁_社會_歷史_g9s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 十九世紀的義大利透過許多能人志士不懈的努力，突破強國阻撓的困境，運用靈活的外交手段，完成國家統一的理想。下列有關義大利統一建國的敘述，何者錯誤？
  options:
  - label: A
    content: 薩丁尼亞王國是領導統一運動的主要勢力
  - label: B
    content: 西元1870 年從奧國手中取回羅馬，完成統一
  - label: C
    content: 十九世紀時仍有許多地方受到奧、法等勢力的控制
  - label: D
    content: 馬志尼主張恢復古羅馬光榮，建立統一的國家。
