  section: 1
  number: 14
  type: single
  page: 2
  stem: 附圖是刻在美國波士頓的紀念石碑上的一段懺悔文，出自於德國牧師馬丁‧尼莫之筆。此文敘述旁人不該漠視暴力殺戮，而應挺身而出、共同奮戰。請問：下列關於文中「他們」的敘述，何者正確？
  options:
  - label: A
    content: 「他們」意指義大利的法西斯黨
  - label: B
    content: 「他們」因實施新政而實力強大
  - label: C
    content: 第一次世界大戰期間「他們」曾中途退出戰場
  - label: D
    content: 「他們」是指德國的納粹黨。
