- id: doc_113_台中_居仁_社會_歷史_g9s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 西元1920 年，某國際組織成立，總部設在瑞士日內瓦，其盟約開宗明義的表示：「藉由各國彼此約束而非訴諸戰爭，以促進國際合作、達成國際和平與安全……。」下列有關此組織的敘述，何者正確？
  options:
  - label: A
    content: 成立的背景是美國總統羅斯福於「十四點原則」中提及永久性國際組織的設立
  - label: B
    content: 此組織依據西元1919 年巴黎和會的決議而成立
  - label: C
    content: 此組織經常能夠有效處理國際紛爭及制裁侵略行為
  - label: D
    content: 為現今最重要的國際組織，參與國多達192 個。
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 歷史
      code: 2-3
      title: 巴黎和會與國際聯盟
      chapter: 第2章 帝國主義與第一次世界大戰
    textbook: 九下歷史 2-3 巴黎和會與國際聯盟
    labeled_by: ai
- id: doc_113_台中_居仁_社會_歷史_g9s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 一位政治人物為掌握政權，曾許諾「給農民以土地，給國家以和平，給飢民以麵包！」他號召民眾推翻舊政府，試圖建立一個新的政府。當革命成功，土地重新分配了，一年後，他卻要求農民把農產品交給新政府，命令「紅軍士兵們挨村尋找那些最差的、最懶的、最奸猾的農民，給他們權力，讓這些精心挑選的人去沒收他們鄰居的『餘糧』。」根據上述選出正確的說明？
  options:
  - label: A
    content: 政治人物是指史達林
  - label: B
    content: 文中的革命指十月革命
  - label: C
    content: 「和平」指退出第二次世界大戰
  - label: D
    content: 文中的新政府指臨時政府。
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 歷史
      code: 2-2
      title: 第一次世界大戰
      chapter: 第2章 帝國主義與第一次世界大戰
    textbook: 九下歷史 2-2 第一次世界大戰
    labeled_by: ai
- id: doc_113_台中_居仁_社會_歷史_g9s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 在人類歷史中，化學分子有時扮演著重要角色。十九世紀初，歐洲軍服普遍使用的「錫」製鈕釦在低溫時，會因化學作用而崩解成粉末狀。有學者便認為，1812 年，拿破崙所發動的重要戰役，由於戰地冰天雪地的氣候，讓這支堪稱史上最大軍旅因化學作用導致士兵「衣不蔽體」飢寒交迫，也成為拿破崙大軍敗北的原因之一。文中所指的戰役應發生於何處？
  options:
  - label: A
    content: 羅馬
  - label: B
    content: 維也納
  - label: C
    content: 滑鐵盧
  - label: D
    content: 莫斯科。
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 歷史
      code: 1-2
      title: 法國大革命
      chapter: 第1章 現代國家的建立
    textbook: 九下歷史 1-2 法國大革命
    labeled_by: ai
- id: doc_113_台中_居仁_社會_歷史_g9s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 十七世紀與十九世紀曾經遭遇外國勢力控制的臺灣，基本上便是當時世界局勢的縮影。關於這兩階段的說明，下列哪個敘述合乎史實？
  options:
  - label: A
    content: 導致這兩次外國勢力的擴張，主要是因為啟蒙運動與工業革命
  - label: B
    content: 第二階段以經濟侵略為主，未掌控台灣的內政和外交
  - label: C
    content: 這兩個階段均可稱之為帝國主義的擴張
  - label: D
    content: 第一階段時期西方以「社會達爾文主義」來合理化侵略行為。
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 歷史
      code: 2-1
      title: 19世紀帝國主義
      chapter: 第2章 帝國主義與第一次世界大戰
    textbook: 九下歷史 2-1 19世紀帝國主義
    labeled_by: ai
- id: doc_113_台中_居仁_社會_歷史_g9s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 此人出生於委內瑞拉，成立祕密組織進行獨立運動，並驅逐殖民當地的歐洲人總督。他曾指出：「三百年的等待還不夠？難道還要再等三百年嗎？」以鼓動民眾勇於爭取國家獨立自主。在他持續努力下，終於玻利維亞共和國成立，其國名以他命名，並尊其為總統。他在南美五國（哥倫比亞、委內瑞拉、厄瓜多、秘魯和玻利維亞）獨立過程中功勳卓著，因此被稱為「南美的華盛頓」。請問：下列敘述何者正確？
  options:
  - label: A
    content: 此人希望祖國可以從葡萄牙獨立出來
  - label: B
    content: 此人揭竿而起的時機，適逢拿破崙征服歐洲各地
  - label: C
    content: 由於此人的推動，南美各國於 18 世紀陸續獨立
  - label: D
    content: 英國曾發表「門羅宣言」，支持南美各國獨立運動。
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 歷史
      code: 1-3
      title: 拉丁美洲的獨立運動
      chapter: 第1章 現代國家的建立
    textbook: 九下歷史 1-3 拉丁美洲的獨立運動
    labeled_by: ai
- id: doc_113_台中_居仁_社會_歷史_g9s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 新冠肺炎(Covid-19)肆虐多年，造成全球大恐慌。事實上，被稱為「大流行之母」的西班牙流感，亦曾在西元1918～1920 年間流行，不但間接造成當時戰爭的結束，死亡人數更超過4000
    萬人。請問：下列哪一項是關於該場戰爭的敘述？
  options:
  - label: A
    content: 戰爭開打後不久，西線戰場即陷入膠著的壕溝戰
  - label: B
    content: 戰爭起因於德法戰爭後，法國擴張勢力
  - label: C
    content: 戰後各國召開維也納會議，重建歐洲秩序
  - label: D
    content: 美國在中期宣布對日作戰，扭轉戰爭局勢。
