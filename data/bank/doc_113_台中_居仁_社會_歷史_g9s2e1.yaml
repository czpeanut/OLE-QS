    | 甲 領導邦國 | 普魯士 | 薩丁尼亞 |

    | 乙 任用首相 | 俾斯麥 | 馬志尼 |

    | 丙 領導君主 | 伊曼紐二世 | 威廉一世 |

    | 丁 關鍵戰役 | 德法戰爭 | 德法戰爭 |'
