    資料二：刺殺案件發生後，奧地利的主戰分子要求政府立刻出兵。但奧國政府明白若無某國牽制俄國，則戰事不利。某國政府認為，此事奧國名義正當，因此同意支持奧國。7月23日奧國對塞爾維亞政府提出最後通牒，原本以為塞爾維亞不會同意，但塞國同意奧國提出的條件，本來各國政要鬆一口氣，但是奧國仍然出兵，各國態度丕變。俄國首先動員，與某國立場衝突因此某國亦宣戰，法國軍方也要求政府宣戰，英國則是因為某國進兵比利時，使其中立被破壞，因此宣戰。

