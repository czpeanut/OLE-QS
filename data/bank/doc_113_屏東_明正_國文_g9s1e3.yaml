  stem: 〈湖心亭看雪〉一文所描寫的湖景意境，與下列何者最相近？
  options:
  - label: A
    content: 松下問童子，言師採藥去。只在此山中，雲深不知處（賈島 尋隱者不遇）
  - label: B
    content: 千山鳥飛絕，萬徑人蹤滅。孤舟蓑笠翁，獨釣寒江雪（柳宗元 江雪）
  - label: C
    content: 山中相送罷，日暮掩柴扉。春草明年綠，王孫歸不歸（王維 送別）
  - label: D
    content: 移舟泊煙渚，日暮客愁新。野曠天低樹，江清月近人（孟浩然 宿建德江）。
