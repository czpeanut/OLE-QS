- id: doc_113_屏東_明正_國文_g9s1e3_s1_16
  section: 1
  number: 16
  type: single
  page: 1
  stem: 「鳶飛戾天者，望峰息心；經綸世務者，窺谷忘返。」在此文句中，作者因山水美景所觸發的人生態度與下列何者相似？
  options:
  - label: A
    content: 官場太黑暗，要遠離政治權力鬥爭；宜在山林之間潛心學佛
  - label: B
    content: 世事無常，不如流連於山河之間，過著醉生夢死的生活
  - label: C
    content: 山水優美，不僅可以怡情養性，更可以洗滌自我在塵俗的慾望，平息自己忙於追逐名利的心
  - label: D
    content: 人生苦短，應努力活在當下，享受生活，辭官歸隱讓自己從此過著縱情山水的逍遙生活。
  lesson_raw:
    title: 與宋元思書
    basis: 引自〈與宋元思書〉課文原句
