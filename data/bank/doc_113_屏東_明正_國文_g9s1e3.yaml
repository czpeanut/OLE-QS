- id: doc_113_屏東_明正_國文_g9s1e3_s2_3
  section: 2
  number: 3
  type: single
  page: 2
  stem: 根據上面這篇文章，下列敘述何者正確？
  options:
  - label: A
    content: 為了在過年喝才釀酒，平時接待客人時都是青茶
  - label: B
    content: 由年紀小的先喝，才輪到長輩喝
  - label: C
    content: 會先放在酒器裡加熱後才給晚輩喝
  - label: D
    content: 歲酒通常指燒酒和啤酒而非清酒。
  group_stem: '「對於熱愛酒的韓國人來說，在新年當然也不能漏掉酒！在初一的早上會喝一杯酒，有著把福帶來的意思，大人們會先給晚輩一杯酒，也順便告訴晚輩酒導（喝酒的方式），所喝的酒叫做歲酒，把它弄得冰冰涼涼的再喝下，先從年紀小的喝，之後再輪到長輩喝，因為對於年紀小的是又得到了新的一年，而年紀大的則是又失去了一年。這時候喝的酒並不是啤酒或燒酒，而是清酒，也有一些家庭會為了在過年喝，或是接待客人而親自釀酒。」

    （〈韓國人也過農曆年——歲酒〉）'
