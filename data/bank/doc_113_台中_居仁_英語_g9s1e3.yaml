  group_stem: 'Keanu Reeves is a famous actor known for his roles in movies like The
    Matrix and John Wick. However, when he was young, he faced a big challenge—dyslexia.
    This made reading and learning in school very difficult for him.

    Keanu didn’t let this problem stop him. He found something he was good at—acting.
    He also found that he could show himself through performing and didn’t need to
    rely on reading as much.

    He also found a love for Shakespeare’s works, which helped him relax and focus.
    “I love Shakespeare,” Keanu shared in an interview. “It’s very relaxing when you
    speak it out loud.” At 18, he performed Romeo and Juliet on stage. Acting became
    his way of shining since then.

    Today, Keanu Reeves is a successful actor. His story shows that challenges like
    dyslexia don’t have to hold you back. With hard work, you can make your dreams
    come true, just like Keanu did.

     Matrix 駭客任務 John Wick 捍衛任務 rely on 依賴 challenge 挑戰'
