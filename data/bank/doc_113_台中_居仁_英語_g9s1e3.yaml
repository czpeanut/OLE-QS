  group_stem: 'The Lion, the Witch and the Wardrobe

    Four siblings—Lucy, Edmund, Susan, and Peter—were sent to live in a big, old house
    during the war. One day, Lucy found a magical wardrobe that leads to a snowy land
    called Narnia. In Narnia, she met a creature, Mr. Tumnus, who told her about the
    White Witch. The Witch had made it winter in Narnia forever, with no Christmas.

    When Lucy returned, no one believed her, but Edmund sneaked into the wardrobe
    and met the White Witch. She gave him magical treats, and promised that she would
    make him a prince if he brought his siblings to her. Later, all four children
    went into Narnia and met friendly creatures who told them about Aslan, a great
    lion who could fight the Witch.

    Edmund said yes to the Witch and brought his siblings to her, but she was mean
    to him. Meanwhile, the others met Aslan and prepared to fight. Aslan sacrificed
    himself to save Edmund, but because of magic, he came back to life. With Aslan’s
    help, the children led an army to fight the Witch.

