  group_stem: "濰縣署中與舍弟墨第二書‧書後又一紙   鄭 燮 \n  所云不得籠中養鳥，而予又未嘗不愛鳥，但養之有道耳。欲養鳥莫如多種樹，使繞屋樹百株，扶疏茂密，為鳥國鳥家。將旦時，睡夢初醒，尚展轉在被，聽一片啁啾，如雲門、咸池之奏；及披衣而起，□面漱口啜茗，見其揚翬振彩，倏往倏來，目不暇給，固非一籠一羽之樂而已。大率平生樂趣，欲以天地為囿，江漢為池，各適其天，斯為大快。比之盆魚籠鳥，其鉅細仁忍何如也！\
