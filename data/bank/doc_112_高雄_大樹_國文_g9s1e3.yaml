  section: 5
  number: 9
  type: single
  page: 4
  stem: 從上文看，芬蘭學生塞羅丁能夠揭穿路透社照片假象的最主要原因何在？
  options:
  - label: A
    content: 多次觀賞《鐵達尼號》電影，從而發現真相
  - label: B
    content: 從小就喜歡蒐集模型，恰好有一樣的潛水艇
  - label: C
    content: 樂於學習，具備主動探索與解決問題的能力
  - label: D
    content: 正好在作相關的研究，偶然發現事實的真相。
  group_stem: "芬蘭的閱讀教育 \n2007年，路透社傳送兩張俄羅斯潛艇在北極海底下插國旗的照片，提供全球新聞界刊登。照片見報後，芬蘭北方小鎮的少年塞羅丁察覺有異，加以查證，竟然發現照片是翻拍自電影《鐵達尼號》，迫使這個世界著名的新聞通訊社認錯道歉。他們怎麼也想不到，一個13歲的芬蘭中學生竟能拆穿這個謊言，讓他們顏面盡失。在芬蘭，像塞羅丁這樣有解決問題能力的青少年，其實為數不少呢！\
    \ \n芬蘭的孩子最常從事的「休閒活動」就是閱讀，每天花1至2個小時享受單純的閱讀樂趣。芬蘭大多數的父母喜歡閱讀，除了在家和孩子共讀外，也常陪孩子上圖書館。知名學者洪蘭教授指出，閱讀能力和創造力是相關的。芬蘭的孩童從小培養閱讀的習慣，因此增強了資訊蒐集、理解分析與解決問題的能力。所以芬蘭15歲的學生從2000年起，每一屆的「國際學生評量計畫」，閱讀能力、數學、自然科學以及解決問題能力的成績，都名列前茅。\
    \ \n芬蘭學生喜歡閱讀，也使芬蘭的教育政策能夠成功落實。1970年代兩次教改之後，芬蘭將教育資源專注於初級中學和學習遲緩者身上。學校不強調菁英，不講求競爭，希望全面加強孩子的能力，使學生樂於學習，並且能運用在實際生活中。或許有人會問：過度關注學習緩慢者和基礎教育，那學得快的人怎麼辦？高等教育又如何提升呢？其實答案很簡單，因為喜歡閱讀，學得快的人會主動探索，嘗試解決問題，所以他們的進展並沒有減緩，而且基礎教育扎實了，高等教育自然也就提升。事實證明，芬蘭人的做法十分成功，值得國內教育當局參考。"
  answer:
  - C
