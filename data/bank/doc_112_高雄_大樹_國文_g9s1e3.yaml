  group_stem: "茶葉蛋  焦 桐 \n  茶葉蛋流傳甚廣，幾乎遍布大中華。在臺灣，這種庶民小吃更緊密連接著生活，甚至成為許多數據的指標，如最近要調漲的基本工資，換算後大約是每天一顆茶葉蛋，清楚明瞭。\
