  group_stem: "匡衡鑿壁偷光 \n    匡衡，字稚圭，勤學而無燭。鄰舍有燭而不逮，衡乃穿壁引其光，以書映光而讀之。邑人大姓文不識，家富多書，衡乃與其傭作，而不求償。主人怪而問衡，衡曰：「願得主人書遍讀之。」主人感嘆，資給以書，遂成大學。\
    \ \n    衡能說詩，時人為之語曰：「無說詩，匡鼎來。匡說詩，解人頤。」鼎，衡小名也。時人畏服之如是，聞者皆解頤歡笑。衡邑人有言詩者，衡從之與語質疑。邑人挫服，倒屣而去。衡追之，曰：「先生留聽，更理前論。」邑人曰：「窮矣。」遂去不返。"
