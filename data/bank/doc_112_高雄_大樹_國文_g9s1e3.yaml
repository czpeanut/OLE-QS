  group_stem: "茶葉蛋  焦 桐 \n  茶葉蛋流傳甚廣，幾乎遍布大中華。在臺灣，這種庶民小吃更緊密連接著生活，甚至成為許多數據的指標，如最近要調漲的基本工資，換算後大約是每天一顆茶葉蛋，清楚明瞭。\
    \ \n  有時旅行異域，在酒店內早餐吃水煮蛋，原味，撒一點鹽就很美。茶葉蛋則必須入味，類似滷蛋的美學原理，令茶湯滷汁有效滲入蛋白及蛋黃，干涉其味道；異於滷蛋的是帶殼製作，滲透之道乃依賴蛋殼裂縫。那裂縫乍看似毀壞，似傷痕，其實是茶葉蛋之宿命。人生本來就不缺乏損傷與苦澀。既選擇入味，就註定回不去水煮蛋的時光，回不去了年輕時光，那些裂痕，那深褐紋路的表皮像歲月的皺紋，像生活的歷程，深刻，實在，飽滿著記憶之味。\
    \ \n  人生果然像茶葉蛋，偶有傷痕與毀壞，像烹煮的茶葉，略帶苦澀；苦中帶甘，苦中作樂。微笑中閃著淚光。"
  answer:
  - B
