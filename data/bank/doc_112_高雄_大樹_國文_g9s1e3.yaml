  stem: 為什麼說「君子無一朝之患」？
  options:
  - label: A
    content: 吉人自有天相，必能逢凶化吉
  - label: B
    content: 仁者無敵，人人都歸向他
  - label: C
    content: 逍遙物外，忘情塵世
  - label: D
    content: 樂天知命，不把一己的利害、得失當作憂患
  group_stem: "憂患意識   中央副刊 \n  在中國歷史傳統，知識分子對一己的利害、得失、榮辱而言，是「樂天知命故不憂」。但對人群而言，誠如曾子所說：「士不可以不弘毅，任重而道遠，仁以為己任，不亦重乎？死而後已，不亦遠乎？」仁是愛人，個人的生命有限，而愛人的責任則無盡。這一種思想，就是憂患意識。士，這一個字的含義甚廣，從窮則獨善其身，到達則兼善天下。因此，自古以來，舉凡明君、賢相、良將，莫不抱有深刻的、悲天憫人的憂患意識。\
    \ \n  最早記錄，古代帝王終其生抱有憂患意識的，就是大禹。所以「禹思天下有溺者，由己溺之也。」范仲淹「先天下之憂而憂」，這是一位大儒、名臣的憂患意識；林則徐說：「亡中國者，其俄羅斯乎？」此有清一代疆吏，謇謇諤諤之士的殷憂，不幸百年後莫斯科竟假毛賊手中實現。故「君子有終身之憂，而無一朝之患」，如果人人具有兢兢業業的憂患意識，敵人也就無法乘瑕蹈隙了。\
    \ \n注：①謇謇諤諤：音ㄐㄧㄢˇ ㄐㄧㄢˇ ㄜˋ ㄜˋ，說話正直的樣子。②殷憂：深憂。 ③兢兢業業：小心謹慎"
  answer:
  - D
  answer_source: answer_key_vlm
