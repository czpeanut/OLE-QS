  type: single
  page: 1
  stem: 「奧林匹克運動會起源於宗教祭典。西元前八世紀，因長期的戰亂難以解決，國王向神請示該怎麼做才能結束內戰？女祭司建議國王擴大舉辦奧林匹克賽會，並在此賽期間宣告休戰，藉此促成各城邦間短暫的和平。因此，奧運會也成為和平的象徵。」按文中前述，奧林匹克運動會可能是源於何種宗教的祭典？
  options:
  - label: A
    content: 希臘神話中的萬神之王—宙斯
