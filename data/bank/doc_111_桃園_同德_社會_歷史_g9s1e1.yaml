  stem: '詠晴在著名的書籍中看到如下的對話，以辯論的方式進行真理的探討，請問：下列何人最不可能進行此種類型的探討？


    甲：我宣布，強權就是公理，公正就是強者的利益。無論是民主的、貴族的還是獨裁的，他們在制定法律時，都是為了各自的利益。這些為他們自身利益服務的法律，被當作『公正』讓臣民們接受，誰違反了法律就會被當做違反了正義準則，因而受到懲罰。

    乙：統治者不可能永遠偉大光榮正確，他也可能犯錯誤的時候。比方說，他一時糊塗，制定了與自己的利益相悖的法律，此時，行使正義，就不是維護強者的利益。

    甲：那就不是真正的統治者，真正的統治者是不會犯錯誤的，就像真正的醫生，不會犯錯一樣

    乙：那麼醫生的目的是為了治病還是賺錢？請聽好，我問的是真正的醫生。

    甲：真正的醫生是為了病人的利益而非自己的利益，就像真正的統治者是為了被統治者的利益—也就是弱者的利益。'
  options:
  - label: A
    content: 蘇格拉底
  - label: B
    content: 柏拉圖
  - label: C
    content: 亞里斯多德
  - label: D
    content: 漢摩拉比。
