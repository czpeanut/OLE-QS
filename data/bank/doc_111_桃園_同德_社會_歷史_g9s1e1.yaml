  stem: 凱撒是羅馬重要歷史人物，曾為羅馬開疆拓土，創下無數戰功，但暗殺凱撒的人卻說：「吾愛凱撒，但吾更愛羅馬。」如果你是本案檢察官，對於兇手的犯罪動機應如何正確解讀？
