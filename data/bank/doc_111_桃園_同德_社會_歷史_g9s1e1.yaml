  group_stem: '波灣戰爭後流浪30年「吉爾伽美什夢幻泥板」將歸還伊拉克

    周刊王 CTWANT | 張羽緻 (2021年9月24日)

    一塊罕見的泥板記載著世界最古老文學作品之一的吉爾伽美什史詩 (Epic of Gilgamesh) 部分內容，目前已被美國下令正式歸還交給伊拉克當局。

    根據《BBC》報導，這塊約為3600年前的宗教文本。2019年，美國特工從博物館扣押了這塊泥板，7月，美國聯邦法官下達將其歸還伊拉克當局的命令。

    這塊泥板一旦回到伊拉克，將被送到巴格達國家博物館，在那裡，神話中吉爾伽美什國王的夢想將再次被保存在他們應在的地方。'
