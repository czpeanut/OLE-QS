- id: doc_113_新北_福和_社會_公民_g9s1e2_s2_47
  section: 2
  number: 47
  type: single
  page: 2
  stem: 根據文章內容，請問下列何項敘述正確？（L4）
  options:
  - label: A
    content: 因為國際分工盛行，所以臺灣才會將農產品出口至各國
  - label: B
    content: 中國取消零關稅對該國農產品生產者是不利的
  - label: C
    content: 對台灣而言，只要中國取消關稅就一定有利農產品出口
  - label: D
    content: 中國以收取關稅的方式，保護中國當地農產品
  group_stem: "【題組一】請回答第47～48 題\n  根據中國國務院關稅稅則委員會近日發布公告，自2024 年9 月25 日起，將停止執行對部分原產於臺灣，共計34\
    \ 項農漁產品的免徵關稅政策，其中包含才剛重新開放輸入中國的鳳梨釋迦和文旦柚。但我國農業部表示「臺灣近年來積極開拓中國大陸以外的高消費市場，本次34 項農漁產品免徵關稅取消，對臺灣的影響有限」。\n\
    \  臺灣農產品2024 年輸往中國約5 億美元，該34 種產品輸往中國佔約736 萬美元，其中銷往中國但享零關稅優惠項目很少，且中國實施進口食品註冊制度亦影響到臺灣業者，故該國不只透過關稅，早已利用其他阻礙的方式，來影響我國農產品出口。\n\
    \  我國農業部更指出，臺灣蔬果輸中國除關稅外，同時也面臨了運銷成本高等問題，而農業部即持續落實各階段產銷措施，提升農產品外銷競爭力，維持產地價格，積極開拓中國以外高消費市場。\n\
    改寫自聯合新聞《陸停台34 項農產品免關稅 農業部：損失有限影響可控》2024/9/19"
  shared_asset: g2_47_48
- id: doc_113_新北_福和_社會_公民_g9s1e2_s2_48
  section: 2
  number: 48
  type: single
  page: 2
