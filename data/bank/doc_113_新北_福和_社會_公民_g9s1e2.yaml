  stem: 翔陽在網購平台上買了一件球衣，經賣家確認尺寸與款式無誤後即安排出貨，翔陽也利用線上完成付款，3 天後收到衣服的翔陽立刻試穿，卻發現穿起來不如預期好看，故於貨到當天立即向賣家要求退貨還款，不料賣家以事前確認過訂單無誤為由拒絕。翔陽將此事件告訴好友們請求協助，以下為大家的建議，何項可被翔陽採納使用？（L3）
  options:
  - label: A
    content: 影山：「親自到地方的消費者保護處尋求協助。」
  - label: B
    content: 月島：「可直接撥打『1995』消費者服務專線。」
  - label: C
    content: 澤村：「若調解不成，可依照《公平交易法》提出訴訟。」
  - label: D
    content: 西谷：「消費者保護法規定網路購物享有7 天的猶豫期。」
- id: doc_113_新北_福和_社會_公民_g9s1e2_s1_36
  section: 1
  number: 36
  type: single
  page: 1
  stem: '為了慶祝吉伊的生日，好友小八和烏薩奇決定一起購買一台汽車當作生日禮物送他，但礙於存款不足，他們決定以打工的方式賺取費用，右表為他們選擇各項工作一天能賺到的薪資，每人一天只能做一種工作，需考量能在最短時間存到最多錢，且每種工作每天只能一人選擇的狀況下，請問以下何者敘述最正確？（L4）


    | | 選擇除草的薪資(天) | 選擇討伐的薪資(天) |

    | :---: | :---: | :---: |

    | 小八 | 2000 元 | 2000 元 |

    | 烏薩奇 | 6000 元 | 4000 元 |'
  options:
  - label: A
    content: 烏薩奇負責除草的機會成本比較高
  - label: B
    content: 小八負責討伐、烏薩奇負責除草會是最好的選擇
  - label: C
    content: 烏薩奇負責討伐所得利益較除草多
  - label: D
    content: 小八負責除草、烏薩奇負責討伐之機會成本較低
