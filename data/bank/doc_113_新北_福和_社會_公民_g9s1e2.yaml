  section: 1
  number: 39
  type: single
  page: 1
  stem: 因近年國內缺蛋問題嚴重，有業者趁機囤積、哄抬蛋價，藉此獲取暴利，故政府祭出右圖措施，來防範這些破壞市場價格的行為。請問下列何項為右圖依循法律的說明？（L3）
