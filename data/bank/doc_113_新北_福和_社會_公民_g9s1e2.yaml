- id: doc_113_新北_福和_社會_公民_g9s1e2_s2_49
  section: 2
  number: 49
  type: single
  page: 2
  stem: 魯夫喜愛吃肉，但目前只有500 元可支付餐費，希望選到可以吃肉且能在預算內支付費用的餐廳，而他看完以上四家的菜單後，發現三星主廚隊餐廳的酥烤牛肉刈包符合他的需求外，也相較其他家的肉類餐點更便宜，因此最後他選擇了三星主廚隊餐廳，而其營業額也因此提升。請問以下何者，與三星主廚隊運用的競爭策略相同？（L3）
  options:
  - label: A
    content: 知名飲料店聯名吉伊卡哇
  - label: B
    content: 百貨公司周年慶滿千送百
  - label: C
    content: 親子餐廳新增遊樂器材
  - label: D
    content: 超商販售立體悠遊卡
  group_stem: "【題組二】請回答第49～50 題\n  Netflix 韓國料理實境秀《黑白大廚：料理階級大戰》一開播就引起關注，其中在「餐廳任務」的團體競賽裡，廚師除了要展現出高超的廚藝與創意美味的料理外，也要學會如何經營餐廳，以提高營業額為主要目的，共計四個隊伍裡，營業額最高者全員晉級，營業額最低的隊伍全員淘汰，而第二、三名的隊伍由評審決定符合資格的晉級者，最後由8\
    \ 名主廚晉級八強賽。\n  以下是每隊為了獲勝，所制定的菜單（以下標價已換算成新台幣）：\n| 崔主廚隊餐廳 | 三星主廚隊餐廳 | 愛德華主廚隊餐廳 |\
