- id: doc_113_台中_順天_社會_地理_g9s2e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 昔日對花蓮的稱呼相當多，「洄瀾」是其中之一。該地名是來自於早期移民者的經驗，當來自今宜蘭縣的漳州人乘船來到花蓮溪口時，見到溪水奔注與海浪衝擊呈迴旋狀時，脫口而出「洄瀾」(Huelien)；由於漳州人以河洛話的俗音唸「花」為
    Hue，「蓮」為 lien，因此後來把「洄瀾」改成諧音的「花蓮」。到了泉州人進入花蓮後，改以河洛話的正音來唸，把「花」讀成 Hua，而出現今日的「花蓮」(Hualien)地名。請問：文中早期移民者乘船航行到花蓮溪口，所行經的海域應為下列何者？
  options:
  - label: A
    content: 南海
  - label: B
    content: 太平洋
