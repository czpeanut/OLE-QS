  section: 2
  number: 38
  type: single
  page: 8
  stem: 依據文中來判斷，年僅十七歲的普林西普之所以進行暗殺行動，是受到下列何種思潮的刺激？
  options:
  - label: A
    content: 自由主義
  - label: B
    content: 民主主義
  - label: C
    content: 民族主義
  - label: D
    content: 社會主義
  group_stem: "十九到二十世紀以來，巴爾幹半島在歐洲列強爭霸下如同火藥庫，而位於此地的波士尼亞與赫塞哥維納在西元1908年一同被奧匈帝國併吞。他們和鄰近的塞爾維亞同屬斯拉夫民族。塞爾維亞原先計畫建立一個以該國為核心的統一的斯拉夫民族國家，而奧匈帝國粗暴的侵略，激起塞爾維亞人的不滿與憤恨，因此斐迪南大公夫婦出巡塞拉耶佛，便成為他們剷除頭號敵人的時機。\n\
    \  斐迪南大公夫婦試圖透過出巡行動，給塞爾維亞人留下開明親和的形象，故搭乘敞篷車進行巡視，這給普林西普等暗殺者提供了絕佳機會，七位愛國青年暗藏手槍、炸彈，靜靜埋伏尋找暗殺時機。最後，年僅17歲的普林西普近距離向大公夫婦開了兩槍，大公夫婦不治身亡。82歲的奧匈帝國老皇帝聽聞王儲噩耗，悲痛欲絕，但是德皇威廉二世卻大喜過望，認為千載難逢的好機會來臨了，積極勸說奧匈帝國向塞爾維亞開戰，並表態會援助其作戰，奧匈帝國後以塞爾維亞未能全盤接受自身提出的條件為由，便向塞爾維亞開戰。\n\
    \n資料來源：改寫自郭豫斌(2007)。圖解世界史‧現代卷。臺中：好讀出版社。頁60-63。\n***請閱讀資料並回答下列問題。"
