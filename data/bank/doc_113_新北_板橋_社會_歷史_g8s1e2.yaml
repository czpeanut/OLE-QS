  section: 1
  number: 30
  type: single
  page: 2
  stem: '資料一：雍正年間發生「查嗣庭試題案」。禮部侍郎查嗣庭到江南某省主持科考，試題中先有「正」，後有「止」字，後又有人查出查嗣庭的文集《維止錄》，有許多「狂妄悖逆」之語，有人說標題「維止」，是「雍正」兩字，少掉上端，意思是要斬首雍正皇帝，雍正大怒，令嗣庭斬首，後嗣庭病死獄中。

    資料二：雍正年間，徐駿寫了「明月有情遠顧我，清風無意不留人」；清乾隆時，胡中藻寫了「一把心腸論濁清」，結果這兩人都被皇帝下令處死。

    根據以上資料：請問是清朝統治的哪一種手段？'
