  stem: '「歷史事實」與「歷史解釋」的區別，在於歷史事實是客觀呈現過去發生的事件；而歷史解釋是後人運用歷史資料，對於相關歷史事件進行的詮釋與評價。下列畫線的敘述中，何者適合歸類為「歷史解釋」？

    (甲)<u>宋真宗時，遼軍南侵，真宗親征，最後雙方簽訂「澶淵之盟」</u>，(乙)<u>依盟約規定，宋每年支付遼國銀、絹，稱為歲幣。</u>(丙)<u>並畫定疆界，建立對等關係，雙方君主以兄弟互稱。</u>(丁)<u>此後，宋遼維持了一百多年的和平，首開屈辱求和的先例。影響所及，此後西夏、女真族也比照契丹要求歲幣維繫和平。</u>'
  options:
