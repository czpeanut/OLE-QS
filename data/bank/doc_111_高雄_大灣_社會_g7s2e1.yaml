- id: doc_111_高雄_大灣_社會_g7s2e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 「1895 年是決定臺灣命運的一年。4 月份的臺灣，春天降臨，然而卻充滿了惶惑與不安，因為對岸的祖國，在戰敗後，已將臺灣拋棄。面對新來的主人和臺灣未卜的將來，臺灣巡撫在府衙中一籌莫展。」請問：下列敘述何者正確
    ﹖
  options:
  - label: A
    content: 上文中的「戰敗」是指清法戰爭
  - label: B
    content: 1895 年，臺灣更換新主人是根據《馬關條約》的規定
  - label: C
    content: 當時的臺灣巡撫劉銘傳被推舉為「臺灣民主國」的總統
  - label: D
    content: 臺灣自此開港，洋人充斥島上，與中國斷絕關係。
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 歷史
      code: 1-1
      title: 殖民體制的建立
      chapter: 第1章 日治時期的政治
    textbook: 七下歷史 1-1 殖民體制的建立
    labeled_by: ai
- id: doc_111_高雄_大灣_社會_g7s2e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 由於臺灣為日本新取得的殖民地，1896 年有一個和臺灣總督權力有關的法令頒布，下列關於此法令的敘述，何者正確？
  options:
  - label: A
    content: 此項日本國會頒布的法令稱為「三一法」
  - label: B
    content: 依據此項法令的規定，臺灣人民享有與日本（內地）國民平等的待遇
  - label: C
    content: 此法令授權臺灣總督可以頒布具有法律效力的命令，形成總督專制體制
  - label: D
    content: 臺灣總督因為擁有行政、立法及指揮軍隊等大權，臺民稱之為「大人」。
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 歷史
      code: 1-1
