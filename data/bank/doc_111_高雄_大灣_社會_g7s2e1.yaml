- id: doc_111_高雄_大灣_社會_g7s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 「清朝康、雍時期，中國沿海人口快速成長，人口壓力逐漸升高，尤其是閩粵地區，由於生齒愈繁，需米日殷，再加上臺灣開發已具一定成效，因此閩粵人口便源源不斷向臺灣擁入，使得清初臺灣人口大量增加。這些移民來到臺灣，以農業開墾為主要的生產活動，本來臺灣尚屬地廣人稀之地，但是卻因渡臺者漸多，而土地開墾卻增加緩慢，造成無田可耕的現象，人民在找不到工作的情況下，部分人民就成為了『羅漢腳』。」請問：文中當年的「羅漢腳」遇到什麼樣的困境？
  options:
  - label: A
    content: 中國移民與臺灣原住民衝突不斷
  - label: B
    content: 政府的移民政策，使居民被迫離鄉背井
  - label: C
    content: 文化背景不同，導致移民者生活格格不入
  - label: D
    content: 原鄉推力被迫離鄉打拚，但因競爭者眾使得生活不如預期。
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 地理
      code: 1-3
      title: 人口遷移
      chapter: 第1章 人口成長與分布
    textbook: 七下地理 1-3 人口遷移
    labeled_by: ai
