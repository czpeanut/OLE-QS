- id: doc_113_台南_復興_國文_g7s2e1_s4_9
  section: 4
  number: 9
  type: single
  page: 3
  stem: 根據洪醒夫的〈紙船印象〉，請問下列選項中的分析，何者正確？
  options:
  - label: A
    content: 以文本脈絡而言：由「物」而「人」而「情」，層次分明；「那些紙船都是有感情的」為全文轉折處，讓文意由抒情轉為記敘
  - label: B
    content: 以文章架構而言：首段予以破題，第二段則承上，寫出紙船在作者童年時代的重要之緣由；再轉而抒發母愛，最末段則扣緊題目以收結
  - label: C
    content: 以修辭技巧而言：作者擅用排比句及譬喻法來描述對往事的印象，譬喻法讓紙船具體而形象，排比句亦增強了文章的語勢；對於紙船的刻畫勾勒，富含動靜態的摹寫
  - label: D
    content: 以寫作手法而言：作者從首段開始，便以「紙船」為線索，貫穿全文，運用「藉物抒情」手法，以具體的紙船象徵抽象的母愛，傳遞對母親的感念，令讀者格外動容
