  group_stem: '收買酒矸報紙的，近日成群的過來，搬家的人很多的緣故，但是我總不能忘記最誠實可靠的那個。

    許多年來，都是把家裡的舊報紙和瓶瓶罐罐的賣給缺了門牙的那個。他每次來，都是很誠懇的用他的秤一邊秤著一邊說：「我的秤頭是沒有錯的，做生意就要老實，一點兒都不能亂來。」

    我很高興，我說：「是的，舊報紙是不值錢的東西，我也不是在乎那一毛兩毛的，但是，如果不誠實的秤，真讓人生氣，我最厭惡不誠實。」

    生意做得很高興，個把月，他來一趟。他喊的聲音是深沉的、老練的、穩重的。我家的報紙和舊雜誌太多太多了，十幾種報紙和三十幾種雜誌。每次他來，都說：「我的秤頭是沒有錯的……報紙有很多剪了的，也沒關係……」

    【甲】好可怕的一剎那！最小的事情，最少的利潤，變成了最大的騙局。這樣的局面，比面對一個搶劫的強盜還令人尷尬吧！那時的心情，感覺到的是受了侮辱，而不是欺騙。

    【乙】我也有些歉意，蠅頭小利，是多麼不容易。我說：「剪了洞的，就不要算秤，扔在一邊好了，但是我的雜誌是嶄新的。你看，你看，你秤斤買了去，到舊書攤就是起碼一塊一本呢！」

    【丙】忽然有一年，我家阿綢心血來潮，把報紙秤了秤。我家沒有秤，她是怎麼去秤的，我也不清楚。然後，誠實的人來了，他又說：「我的秤頭沒有錯……」阿綢從身後拿出了另一根秤，揭發了他十年來的不誠實。

    【丁】此後，很多日子，那個深沉、老練、穩重的聲音，不再從早晨的窗子透進來。我偶然老遠的在巷頭看見他了，他就繞道而行。一個月一個月的過去了，報紙和雜誌堆得把那塊地板都壓凹下去了。沒有勇氣再叫另外收買報紙的，覺得彼此誠實是一件困難的事，又覺得一向信任的事突然扭轉成這個樣子，不知道該怎麼處理了。

    我和阿綢很想把這件事忘記，我們很希望他再敲一敲我們那扇友情之門，如果他再說一次「我這回秤頭沒有錯」，我們一定會相信他，一定會說：「快拿去秤吧，堆得太久了。」

    但是他自那以後並沒有再出現。——節選自林海音〈豆腐一聲天下白〉'
