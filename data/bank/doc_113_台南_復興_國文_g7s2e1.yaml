  section: 4
  number: 14
  type: single
  page: 3
  stem: 根據陳黎〈聲音鐘〉，請問下列選項中的分析，何者正確？
  options:
  - label: A
    content: 以修辭技巧而言：由於作者針對叫賣聲的聽覺摹寫，令讀者身臨其境；加上「聲音鐘」的譬喻修辭恰當，益發烘托出小販叫賣聲之生動具體
  - label: B
    content: 以文章架構而言：首段直接破題，接著鋪陳聲音鐘闖入自己生活前的種種困境；再敘述聲音鐘的特色，最末再次點題
  - label: C
    content: 以寫作特色而言：作者運用「阿奇毛」等方言，傳遞鄉土情懷；以〈丟丟銅仔〉等民謠，展現古典臺灣的風華
  - label: D
    content: 以文本主旨而言：藉著描摹小販的叫賣聲，傳達作者喜愛臺灣攤販文化的博大精深及肯定其鄉土文化價值
