  group_stem: '全國中等學校運動會(下稱全中運)為國內中學生綜合性運動最高競技殿堂，臺南市於去年睽違16年承辦全國運動會，挾著成功完成全國運動會的氣勢，再次承接下114年全中運舉辦權，將於明年4月19日至24日舉行，預計將舉辦22項運動種類，參與人數達1萬8000人，臺南市長黃偉哲與教育部.體育署副組長黃幸玉今天為執行委員會揭牌，並頒發執行委員與工作組聘書，預告臺南市正全力整備，準備迎接一年一度的重要學生運動賽會。

    市長黃偉哲表示，臺南市繼去年主辦全國運動會後，市府後續爭取舉辦明年4月的114年全國中等學校運動會，同時明年5月全國大專運動會由長榮大學主辦，市府將與長榮大學攜手努力，讓整個賽事場館及選手培訓更加優化，期盼明年全中運再次帶給選手們美好的賽事。

    此外，巴黎奧運即將於下週展開，市長黃偉哲說，如今在奧運殿堂上發光發熱的選手，也都是從全中運這個賽事開始嶄露頭角，期勉透過辦理這樣的賽會，能夠持續不斷培養國內優秀運動選手，讓臺南成為選手「榮耀的起點」。

    體育局長陳良乾指出，本次大會主視覺採用活潑的色調及律動的外型，散發青春洋溢的氣氛，而吉祥物以「鯤鯓」做為發想，並命名為「大員」及「甜甜」，分別表示臺南的古地名及飲食文化甘甜特色，希望能讓與會嘉賓及參賽選手感受臺南綻放的熱情及文化。

    體育局表示，114年的賽事將於4月19日至24日舉辦，市府目前正全力整備籌辦，賽事期間臺南市高、國中、國小也將配合停課，讓學生及市民朋友能夠一起進場為小將們加油。——改寫自113年07月19日聯合報'
