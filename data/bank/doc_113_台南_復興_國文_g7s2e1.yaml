- id: doc_113_台南_復興_國文_g7s2e1_s4_13
  section: 4
  number: 13
  type: single
  page: 3
  stem: 根據上文，請問下列選項中的分析，何者正確？
  options:
  - label: A
    content: 第二段中，作者以「日子安靜得像掛在壁上的月曆、時間的推移總是默默地進行」說明日子的平靜恬適，以呈現作者安之若素的心境
  - label: B
    content: 第二、三段從周遭取材，描摹出聲音鐘的特色；也以「我把書桌從前面的房間移到後面之後」說明這是小販叫賣聲闖入作者生活的轉折
  - label: C
    content: 第四段敘述小販的準時出現叫賣餐飲，滿足了作者的轆轆飢腸時之口腹所需，也暗指作者心情得到了饜足，為第五段的「人性時間」做了隱微的鋪墊
  - label: D
    content: 第四段提及「那些小販們總是在這個小空間最需要他們時適時地出現」，接著舉出小販叫賣中西早餐的例子，以描述作者喜歡小販叫賣準確地出現不逾時，如此守時誠信，讓作者不須久候
  group_stem: '(二)日子安靜得像掛壁上的月曆，時間的推移總是默默地在不知不覺中進行，你至多只能從天晴時射入斗室內的陽光，它們的寬窄、亮暗來判定時的腳步……但自我把書桌從前面的房間移到後面之後，我就發現頭腦裡裝了許多新的時鐘。

    (三)那是因為……小販的叫賣聲。

    (四)那些小販們總是在這個小空間最需要他們時適時地出現……你想起自己還沒吃早餐，「豆奶哦！煎包哦！糯米飯哦！」的叫聲就正好穿過你推開的窗戶，不客氣的進來。……換個方向，你也許聽到……「最好吃的美心麵包、三明治……」時間一到，這些叫賣聲就像報時的鐘一般準確地出現。

    (五)但這些鐘可不是一成不變的聲音……他們構築的是人性時間。——節錄自陳黎〈聲音鐘〉


    那塊小小的空地是後面幾排人家出入的廣場，假日裡孩子們會在那兒玩沙、丟球，除此之外，就幾乎是附近女人家、老人家每日閒聚的特區了。那些小販們總是在這個小空間最需要他們時適時地出現。早起，看完報，你想起自己還沒吃早餐，「豆奶哦！煎包哦！糯米飯哦！」的叫賣聲就正好穿過你推開的窗戶，不客氣地進來；而且你知道這是用純正臺灣國語呼叫的「中華臺北版」早餐。換個方向，你也許聽到一輛緩緩駛近的小汽車，開著一臺錄音機嬌滴滴地喊著：「最好吃的美心麵包，最好吃的美心三明治，請來吃最好吃的美心巧克力蛋糕，美心冰淇淋蛋糕……」時間一到，這些叫賣聲就像報時的鐘一般準確地出現。

    但這些鐘可不是一成不變地只會敲著噹、噹、噹的聲音，或者每隔一個鐘頭伸出一隻小鳥，「布穀、布穀」地向你報時。他們的報時方式、出現時機，是和這有情世界一樣充滿變化與趣味的。他們構築的不是物理的時間，而是人性——或者更準確地說——心情的時間。就拿在蚵仔麵線之後出現的賣芭樂的老阿伯為例吧，那清脆、鄉土的叫喊雖然只有幾個音節，但宛轉有致的抑揚頓挫卻讓你以為回到了古典臺灣。你聽，那一聲聲拉長的吟唱：「鹹——芭樂，鹹——甜——脆，甘——的哦！」這簡直是人間天籟，臺語的瑰寶——具體而微地把整個民族、整塊土地的生命濃縮進一句呼喊。如果你在心裡一遍遍學著，你一定可以聽到跟〈牛犁歌〉或〈丟丟銅仔〉一樣鮮活有趣的旋律。

    過了下午，乍暖還寒，比起被落的叫賣聲就更加豐富了。一下子你吃到熱騰騰的「肉圓，豬血湯，四神湯哦」；一下子冷卻下來，變成「芋粿，紅豆仔粿，紅豆米糕」，或者清甜可口的「杏仁露，綠豆露，涼的愛玉哦」。那位賣蝦仁羹的歐巴桑的叫賣聲恐怕是最平板無奇的，但還沒看到她就會強烈懷念起她就拿著大碗小碗衝出來的大人小孩，每天不知凡幾。她的蝦仁羹，據「羹學界」人士表示，是確實「料好，味好，臺灣第一」的。

    碰到颱風下雨，這些鐘自然也有停擺、慢擺或亂擺的時候。他甚至跟你惡作劇。在你心情一樣明亮、美好的日子裡，你忽然發現早該出現的叫賣聲一直沒有出現，這時你就會強烈懷念起——譬如說，那推著手推車，一邊搖著鐵片罐子，一邊喊「阿——奇毛」的賣烤番薯的老頭了。你甚至擔心他是不是太老了，太累了，生病了，以至於不能出來賣了。但就在你懷疑、納悶的時候，那熟悉的聲音也許又出現了。

    這些聲音鐘不但告訴你時刻，也告訴你星期、季節。慢條斯理，喊著「修理沙發哦」的車子經過時，你知道又是週末了。賣麥芽糖、鹹橄欖粉的照例在星期三出現；賣衛生紙與賣豆腐乳的，都是在星期天下午到達。昨天晚上你也許還吃著燒仙草，今天你忽然聽到他改叫「冷豆花哦」——這一叫，又讓你驚覺春天的確來了。——陳黎〈聲音鐘〉'
