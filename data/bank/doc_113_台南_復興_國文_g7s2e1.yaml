- id: doc_113_台南_復興_國文_g7s2e1_s6_6
  section: 6
  number: 6
  type: single
  page: 7
  stem: 根據上下文推測，________最適合填入下列何者？
  options:
  - label: A
    content: 錯字取代了正字
  - label: B
    content: 正字取代了錯字
  - label: C
    content: 音近字取代了正字
  - label: D
    content: 音近字取代了錯字
  group_stem: '哏，音ㄍㄣˇ，是個很年輕的字；據我大膽估計，其壽命還不到一千年，但是很可能就要死了，而且這字的死亡，還會使得另一個字多出一個新的意思來。

    先就「哏」本身來看。它的本義和「很」或者「狠」是一樣的。既有「過甚」之義；也有「兇惡」之義。

    以「過甚」義言之，例句如此：《元典章‧工部三‧役使》裡面有一段和今天我們所使用的大白話相去不遠的文字，是這麼說的：「如今吃飯的人多，種田人少有，久已後哏不便當。」（見《漢語大詞典》）。另外，以「兇惡」義言之，例句如此：元曲《救風塵‧第三折》裡有一段家暴的場面：「則見他惡哏哏，摸按著無情棍，便有火性的不似你個郎君。」在表達以上兩個創意的時候，「哏」的讀音與「很」、「狠」無別。

    我們祇能就現存的文獻看出：「哏」字雖然攔取了「很」字和「狠」字的意義，但是並沒有取而代之。「很」字還是繼續維持它「過甚」的意義；而「狠」字則在「兇惡」之餘、偶爾也搶著表現「過甚」之義。像在《儒林外史》、《官場現形記》之類的小說裡，「大膽得很」、「很有錢」之類的話屢見不鮮，我們用字人也習以為常，不把它看成錯字。

    讀作「ㄍㄣˇ」的「哏」是元代以後才出現的俗體字，斷不至於在初出現的時候就已經具備了日後所表達——有趣、滑稽以及笑點——的意義。從曲藝表現形式上可以常見，對口相聲裡主述搞笑的一角謂之「逗哏」，呼應襯托的一角謂之「捧哏」，「哏」這個字在北方方言裡可謂「俗白得很」，根本不是一個生字，但是到了台灣，地方文化裡沒有這種形式，語言中就沒有這個符號，生小不聽相聲的孩子長大之後也許還認得
    stand-up comedy(單口相聲)的字樣，卻聽不懂老相聲藝人或者是藉由曲藝中的術語來表達「好笑」、「可笑」之義的「哏」字了。

    人們不認識「哏」字、卻又聽見有人發出了這個字的字音，從上下文判讀，猜想大約是「好笑」、「可笑」之義，於是，既不願意當場求問、也不願意事後查找，卻滿心害怕在俗用語言上落伍、想要跟著他人捕捉那個字音，並表達「好笑」、「可笑」之義的人該如何是好？這種人祇能想像一個音近的字，並且猜測它就是原字。不過，這種情況祇能訴諸個別的心理，無從風行普及，真正推廣者另有其人。

    以傳播媒體的現況推之，我妹可以更大膽地估計：就是出於電視公司聽寫字幕的人員「無知的創造」，我們如今才會經常將該寫成「哏」的字，寫成了「梗」字。無知、懶惰且望文生義的不祇是這些聽寫字幕人員，還有上節目以及看節目的演藝人員、名嘴和傳媒受眾。大家不需要通過考試或學力認證，非但將「哏」誤認並錯寫成「梗」字，還硬是使得「梗」字居然有了「好笑」、「可笑」之義。

    然而在這件事上，我並不想責弄文字學的知識來嘲笑無知懶惰的笨蛋，反而看見了一個活生生的、「訛字自冒為假借」的例子。以往在文字演變的歷史上，我們讀過許多字形相近、字音相同、字義相通但是原本很可能祇是便宜簡化或一時誤寫，久而久之，人人從眾，遂致積重難返的例子。但是我們很少能如此明顯地眼看著一個________、並且在可以輕易追蹤其來歷、理解其謬誤的情形下，目睹所有的人寧可唸錯字而九死未悔——這，真是令人嘆為觀止！——張大春《送給孩子的字‧失而復得的字‧哏》'
