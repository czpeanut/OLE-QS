  section: 3
  number: 1
  type: fill
  page: 1
  stem: '「根據房間位置及年齡來確定座次：面向房門的座位是最年長者，最年長者的左手邊是次年長者，最年長者的右手邊是年紀排序第三；最年長者的對面是年齡最小者，坐在那裡，方便傳菜斟酒。」四人——不惑之年的小鍾、荳蔻年華的小蔡、老蔡年方弱冠、老蘇年逾花甲——相約到餐廳用餐，餐廳座位甲、乙、丙、丁，如右圖。請依據上述「
    」內的文字，為他們四人安排座位。

