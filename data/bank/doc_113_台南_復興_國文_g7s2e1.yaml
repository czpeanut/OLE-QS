- id: doc_113_台南_復興_國文_g7s2e1_s4_4
  section: 4
  number: 4
  type: single
  page: 1
  stem: 請問下列選項「 」中的詞語運用，何者正確？
  options:
  - label: A
    content: 他們兄弟倆一起出外打拚，患難與共；尤其哥哥無微不至的照護弟弟，如此「舐犢情深」的表現令人感動
  - label: B
    content: 爺爺奶奶結婚五十多年，一路走來，彼此扶持，至今恩愛敬重如初，這份「舉案齊眉」的互敬互諒，羨煞眾人
  - label: C
    content: 詐騙集團常以高獲利、低風險作為誘餌，讓拜金主義者及貪財者對投資標的趨之若鶩，這般「金蘭之交」的手法，令人咋舌
  - label: D
