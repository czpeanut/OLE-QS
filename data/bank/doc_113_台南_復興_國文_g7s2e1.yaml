- id: doc_113_台南_復興_國文_g7s2e1_s6_4
  section: 6
  number: 4
  type: single
  page: 6
  stem: 文中，作者逛完遼寧夜市後，為何會「滿懷罪惡與快樂回家」？
  options:
  - label: A
    content: 禁不起路邊攤的誘惑而花掉一週的零用錢
  - label: B
    content: 夜市小吃太誘人，大吃大喝導致體重增加
  - label: C
    content: 雖然擔心衛生問題，卻仍享受了夜市美食
  - label: D
    content: 逛夜市太開心，以至於忘了該回家的時間
  group_stem: '我們家每個人都是逛夜市高手，我弟五六歲就在廟口跟大人喊價搶購拍賣品，媽跟我們最愛逛布店，光看那些五顏六色的布料就開心得不得了，然後到水果攤上吃蕃茄蘸糖粉醬油膏，下港才有的吃法，老闆熟到遠遠的就準備起來，切的是不計本錢的多，吃時我們看人們，人們看我們，因為姊姊與妹妹是漂亮得有名，末了買一束花回來插，畫上美麗的句點。姐妹們讀屏女時，總要到屏東夜市大吃一頓才回來，那裡有潮洲沒有的冰果室，墨綠色的包廂椅，是約會的好場所。我們還不懂什麼約會，只是來大吃大喝的，什麼蘇打冰淇淋、香蕉船，價格貴死人，吃掉一個禮拜零用錢都不在乎，末了再吃它一個菜粽才告圓滿結束。

    結婚後又是住在市場邊，離遼寧夜市也近，那時嫌路邊攤髒，當母親之後成了嚴重的懷疑主義者，總覺得外面每樣東西都是髒的，病態的潔癖，就是無法抵抗那攤賣豬血糕或白苓糕的，自己買一串，不給兒子吃，他才兩三歲，怕吃了不乾淨，兒子痴痴地看我吃，然後說：「好想吃一口，口水都流出來了！」聽他誠摯的告白，這時才心軟讓他咬一口，兩人滿懷罪惡與快樂回家。

    到美國那一年，最想念的是豆漿與燒餅油條，有一次殺到波士頓.中國市場，的確是琳瑯滿目，買到的燒餅冷冷的，厚如披薩，心中悵然若失，聽同伴說哈佛大學附近有道地的燒餅油條，恨不得殺過去，可惜團體行動，沒人附和。中國人到國外一定會想念中國食物，每個人想的不一樣，但大多是不起眼的路邊攤食物，如我妹最想的是滷肉飯，我姐最想牛肉麵，路邊攤把我們塑造成一種奇特的人，自由且自我的外食主義，口味奇刁。國外沒有我們這麼豐富的路邊攤文化，就連大陸、香港也比不上。我在西安一時好奇，吃他們的路邊攤，也不過寥寥幾攤，食材貧乏，一點也不誘人，不像我們的路邊攤大多集中在市場口，用料實在又新鮮。

    夜市生活於我遂如遙遠的鄉愁，有次回到東海別墅，燈火輝煌中，車如流水馬如龍，我東轉西轉，不知要駐足哪一攤，一時竟不知身在何處。——周芬伶〈夜市仔〉'
