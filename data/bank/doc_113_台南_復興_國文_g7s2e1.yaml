- id: doc_113_台南_復興_國文_g7s2e1_s4_7
  section: 4
  number: 7
  type: single
  page: 2
  stem: 根據上文，第一段敘述了往事的四種類型，而「紙船」屬於「似無所見，又非視而不見」的往事類型。請問：下列選項中，何者的推敲內容最不合理？
  options:
  - label: A
    content: 以寫作手法而言，第二段「紙船是其中之一」承接首段的「童年」一詞，所以「紙船」屬於「似無所見，又非視而不見」的往事類型
  - label: B
    content: 以連接詞的作用而言，「而有一些事」的「而」字作為轉折連接詞，讓「似無所見，又非視而不見」的往事類型相對於前三項的往事類型，所以「紙船」屬於「似無所見，又非視而不見」類型
  - label: C
    content: 運用切割段落的閱讀策略，可以順著「有些是過眼雲煙……；有些是熱鐵烙膚……；有些像是飛鳥掠過天邊……；而有一些事……紙船是其中之一。」的文意脈絡來切割意義段落，所以「紙船」屬於「似無所見，又非視而不見」的往事類型
  - label: D
    content: 「有些是過眼雲煙」屬印象微淺的往事，「有些是熱鐵烙膚」屬印象深刻的往事。而「有些是漸去漸遠……夏日、冬天、春、秋」皆與時間相關，是以「——」破折號具時間延續的作用，讓童年時光與紙船延續承接，因此「紙船」屬於「似無所見，又非視而不見」的往事類型
  group_stem: '(一)每個人的一生都會遭遇許多事，有些是過眼雲煙，倏忽即逝；有些是熱鐵烙膚，記憶長存；有些像是飛鳥掠過天邊，漸去漸遠。而有一些事，卻像夏日的小河、冬天的落葉，像春花，也像秋草，似無所見，又非視而不見——童年的許多細碎事物，大體如此，不去想，什麼都沒有，一旦想起起，便歷歷如繪。

    (二)紙船是其中之一。

    ——洪醒夫〈紙船印象〉


    (二)紙船是其中之一。我曾經看過許多紙船，在童年的無三尺浪的簷下水道航行，使我幼時的雨天時光，特別顯得亮麗充實，讓人眷戀。

    (三)那時，我們住的是低矮簡陋的農舍，簷下無排水溝，庭院未鋪柏油，一下雨，便泥濘不堪。屋頂上的雨水滴落下來，卻理直氣壯的在簷下匯成一道水流，水流因雨勢而定，或急或緩，或大或小。我們在水道上放紙船遊戲，花色斑雜者，形態怪異者，氣派儼然者，甫經下水即遭沉沒者，各色各樣的紙船或列隊而出，或千里單騎，或比肩齊步，或互相追逐，或者乾脆是曹操的戰艦——首尾相連。形形色色，蔚為壯觀。我們所得到的，是真正的快樂。

    (四)這些紙船都是有感情的，因為它們大都出自母親的巧思和那雙粗糙不堪、結著厚ㄐㄧㄢˇ的手。母親摺船給孩子，讓孩子在雨天裡也有笑聲，這種美麗的感情要到年事稍長後才能體會出來，也許那雨一下就是十天半月，農作物都有被淋壞、被淹死的可能，母親心裡正掛記這些事，煩亂憂愁不堪，但她仍然平靜和氣的為孩子摺船，摺成比別的孩子所擁有的還要漂亮的紙船，好讓孩子高興。

    (五)童年舊事，歷歷在目，而今早已年過而立，自然不再是涎著臉要求母親摺紙船的年紀。只盼望自己能以母親的心情，為子女摺出一艘艘未必漂亮但卻堅強的、禁得住風雨的船，如此，便不致愧對紙船了。——洪醒夫〈紙船印象〉'
  lesson_raw:
    number: 第2課
    title: 紙船印象
    basis: 引用洪醒夫〈紙船印象〉
