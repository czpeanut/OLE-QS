    碰到颱風下雨，這些鐘自然也有停擺、慢擺或亂擺的時候。他甚至跟你惡作劇。在你心情一樣明亮、美好的日子裡，你忽然發現早該出現的叫賣聲一直沒有出現，這時你就會強烈懷念起——譬如說，那推著手推車，一邊搖著鐵片罐子，一邊喊「阿——奇毛」的賣烤番薯的老頭了。你甚至擔心他是不是太老了，太累了，生病了，以至於不能出來賣了。但就在你懷疑、納悶的時候，那熟悉的聲音也許又出現了。

    這些聲音鐘不但告訴你時刻，也告訴你星期、季節。慢條斯理，喊著「修理沙發哦」的車子經過時，你知道又是週末了。賣麥芽糖、鹹橄欖粉的照例在星期三出現；賣衛生紙與賣豆腐乳的，都是在星期天下午到達。昨天晚上你也許還吃著燒仙草，今天你忽然聽到他改叫「冷豆花哦」——這一叫，又讓你驚覺春天的確來了。——陳黎〈聲音鐘〉'
