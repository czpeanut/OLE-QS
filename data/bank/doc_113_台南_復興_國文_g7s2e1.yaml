  stem: 在日常生活中，我們可能會聽到某種效應或現象，如李黎〈孩子的鐘塔〉一文中所提到的「尼可拉斯效應」是指一種善行義舉所引起的熱烈迴響。請問下列「效應」的用法，何者正確？
  options:
  - label: A
    content: 臺北因地形及「煮蛙效應」之故，造成熱氣沉降，是以夏日經常飆出近四十度的高溫，暑氣蒸溽，令人汗如雨下
  - label: B
    content: 老師的稱許增強了學生們的自信，進而刺激了他們學習動機，學生的潛能得以發展，形成了「比馬龍效應」
  - label: C
    content: 極地渦旋長驅直下，引發的寒流讓玉山主峰霧淞沆碭，粉妝玉砌的雪景構築出奇幻的「寒蟬效應」，甚是美麗
  - label: D
    content: 團體裡的領袖若能發揮領頭羊的優勢，就能觸發群起效法的風潮，形成良好的「羊群效應」
