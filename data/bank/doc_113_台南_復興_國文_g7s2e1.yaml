- id: doc_113_台南_復興_國文_g7s2e1_s4_15
  section: 4
  number: 15
  type: single
  page: 4
  stem: 根據上文，請問下列選項中的分析，何者錯誤？
  options:
  - label: A
    content: 作者總結聲音鐘「定時」和「變化和趣味」二特色——「時刻、星期和季節」呼應聲音鐘的「定時」的特色，「不同叫賣聲和不同小販」更緊扣聲音鐘的「心情」這項特點
  - label: B
    content: 一旦聲音鐘忽然停擺，偶爾不定時出現的小販叫賣聲使作者心情受到波動，所呈現聲音鐘的「變化」的特色，正是作者覺得聲音鐘深具「心情時間」特色的魅力所在
  - label: C
    content: 「肉圓、四神湯、芋粿、紅豆米糕、杏仁露、蝦仁羹」，正是作者說明攤販所販售的商品林林總總，以呼應「叫賣聲豐富」，勾勒出聲音鐘具有「變化」這項特色
  - label: D
    content: 作者描寫小販叫賣中式早餐「豆奶哦！煎包哦！」的純正臺灣國語的叫賣聲，細膩刻畫出叫賣聲恍若天籟，可謂是臺語的瑰寶，以呼應聲音鐘「趣味」的特色
