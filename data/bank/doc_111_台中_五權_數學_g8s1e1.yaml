  group_stem: '2. 小安計算$\sqrt{27}$的近似值時，小安媽媽提供了一串有效數據，如表所示。


    | x | $x^{2}$ | x | $x^{2}$ | x | $x^{2}$ |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 5 | 25 | 6 | 36 | 6 | 36 |

    | 6 | 36 | 7 | 49 | 7 | 49 |

    | 5.5 | 30.25 | 6.5 | 42.25 | 6.8 | 46.24 |

    | 5.25 | 27.5625 | 6.75 | 45.5625 | 6.9 | 47.61 |

    | 5.125 | 26.265625 | 6.875 | 47.265625 | 6.85 | 46.9225 |

    | 5.1875 | 26.91015625 | 6.8125 | 46.41015625 | 6.86 | 47.2596 |


