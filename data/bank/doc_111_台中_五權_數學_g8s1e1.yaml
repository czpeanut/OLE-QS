    $5 < \sqrt{27} < 6$

    $5 < \sqrt{27} < 5.5$

    $5 < \sqrt{27} < 5.25$

    $5.125 < \sqrt{27} < 5.25$

    $5.1875 < \sqrt{27} < 5.25$'
