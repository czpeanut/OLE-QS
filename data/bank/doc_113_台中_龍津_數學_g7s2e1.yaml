- id: doc_113_台中_龍津_數學_g7s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: '為了降低中暑的機會，近年來部分國家會使用綜合溫度熱指數$WBGT(^{\circ}\text{C})$作為判斷熱傷害風險的指標，而$WBGT$的計算方式如下：

    在戶外有日曬時，$WBGT=0.7T_{w}+0.2T_{g}+0.1T_{d}$

    在戶外無日曬或室內時，$WBGT=0.7T_{w}+0.3T_{g}$

    $T_{w}$：自然濕球溫度($^{\circ}\text{C}$)，用以反映水分揮發的難易度

    $T_{g}$：黑球溫度($^{\circ}\text{C}$)，用以反映太陽輻射的效應

    $T_{d}$：乾球溫度($^{\circ}\text{C}$)，用以反映單純空氣溫度

    依$WBGT$數值大小可將熱傷害風險區分為五個等級，如表(一)所示。

    表(一)

    | WBGT數值 | <21 | 21～25 | 25～28 | 28～31 | $\geq 31$ |

    | :--- | :---: | :---: | :---: | :---: | :---: |

    | 風險等級 | 安全 | 注意 | 警戒 | 高度警戒 | 危險 |

    ※21～25代表21以上(含)，未滿25，其他依此類推

    表(二)為戶外有日曬的甲地與室內的乙地在中午時所測量到的各種溫度。根據上文，甲地、乙地在中午時的熱傷害風險等級分別為何？

    表(二)

    | | 甲地 | 乙地 |

    | :---: | :---: | :---: |

    | $T_{w}$ | $23^{\circ}\text{C}$ | $20^{\circ}\text{C}$ |

    | $T_{g}$ | $30^{\circ}\text{C}$ | $24^{\circ}\text{C}$ |

    | $T_{d}$ | $26^{\circ}\text{C}$ | $24^{\circ}\text{C}$ |'
  options:
  - label: A
    content: 注意、注意
  - label: B
    content: 注意、安全
  - label: C
    content: 警戒、安全
  - label: D
    content: 警戒、注意
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
