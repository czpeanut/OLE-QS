  section: 1
  number: 8
  type: single
  page: 2
  stem: 請問雷震等人組織反對黨，此黨為何？
  options:
  - label: A
    content: 臺灣民眾黨
  - label: B
    content: 民主進步黨
  - label: C
    content: 臺灣地方自治聯盟
  - label: D
    content: 中國民主黨。
  group_stem: "1949 年國民黨政權敗退到臺灣，雷震也隨之來臺。11 月20 日，他負責相關行政、編輯作業的《自由中國》半月刊在臺北創刊，創刊的宗旨是想藉宣傳自由民主來對抗專制的共產政權。創刊之初，該刊得到國民黨當局的大力支持。對當時風雨飄搖的國民黨政權而言，《自由中國》的民主招牌頗有助於該政權塑造開明的形象，以爭取海內外（特別是美國）的支持。而來臺後受聘為總統府國策顧問且參與國民黨「改造」的雷震，此時也相信國民黨能透過「改造」痛改前非，朝民主化發展，以民主來反共。\n\
    \    1950 年代初期，他對國民黨的改革仍寄以厚望。然而，到了50 年代中期，隨著期望的落空，他也開始思考組織反對黨的可能性。到了1960 年地方選舉過後，在野人士召開了一場選舉檢討會，會中多人強烈地批評國民黨選舉的弊端，最後並決議組織「地方選舉改進座談會」，密集展開組黨。1960\
    \ 年6 月25 日，「座談會」推出雷震等16 名召集人，積極展開組黨運動。\n    1960 年9 月4 日上午，臺灣警備總司令部以「涉嫌叛亂」為由，拘捕了《自由中國》半月刊的發行人雷震、編輯傅正、經理馬之驌與離職職員劉子英等4\
    \ 人。警備總部高等軍事審判庭根據臺灣警備總司令部（49）警審特字第35 號判決書宣判：「雷震明知為匪諜（指昔日下屬劉子英）而不告密檢舉，處有期徒刑7年，褫奪公權5\
    \ 年，連續以文字（指《自由中國》的言論）為有利於叛徒之宣傳，處有期徒刑7 年，褫奪公權7 年，執行有期徒刑10 年，褫奪公權7 年。……。」\n    節錄自，雷震，國家人權記憶庫。"
