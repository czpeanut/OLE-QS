- id: doc_113_台中_大業_社會_歷史_g7s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 請問這場危機四伏的中華民國第一次總統直接民選，是發生在民國幾年？
  options:
  - label: A
    content: 民國80 年
  - label: B
    content: 民國39 年
  - label: C
    content: 民國85 年
  - label: D
    content: 民國76 年。
  group_stem: "中華民國第九任總統副總統選舉，在臺海飛彈危機的衝擊之下，投票率居然高達76.04%，被中共設定為打擊目標的國民黨的李登輝和連戰，得到54%的選票，民進黨的彭明敏和謝長廷，得到21.1%選票，新黨的林洋港和郝柏村，得到了14.9%選票，前監察院長陳履安和王清峰，得到9.98%的選票。\n\
    \    後面兩組候選人的立場反對臺獨，譴責美軍是「外力干涉」，跟中共的論調接近，而國民黨跟民進黨的兩組候選人，則是對美軍的支援表示歡迎。換句話說選舉結果顯示，反對中共武力恐嚇、打壓的民意高達了75%以上。\n\
    \    但在共軍一波接一波的軍演和飛彈試射之下，臺灣社會也受到了驚嚇，股票直接跌了17%，政府動用了18 億元來救市，房地產和新臺幣價格一洩千里，申請護照跟外國簽證的人暴增。為了安定民心，李登輝告訴民眾，對岸打來的飛彈是空包彈，並沒有攜帶彈頭，據說李登輝說的話，還暴露了潛伏在共軍內部的臺灣高階諜報網，成員遭到了中共的軍法處決。整體而言，李登輝的危機處理得宜，成立股市穩定基金、央行介入匯市跟房市等措施，基本上穩定了股匯市，選舉結果更加鞏固了李登輝的領導地位。\n\
    \    節錄自，〈那一年中共的飛彈，使臺灣距離戰爭僅一步之遙〉，中央廣播電台，2024/10/29。"
  tags:
    chapter:
      publisher: 翰林
