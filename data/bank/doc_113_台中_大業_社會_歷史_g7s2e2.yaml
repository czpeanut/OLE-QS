  group_stem: '資料一：大陸人士以解放者自居，使無法得到政府工作的臺灣本土精英更為難受，他們原本希望優先被考慮擔任政府的職務，也殷盼經濟能恢復到至少相當於日治時期的標準。然而，國民黨在過去十年已經精疲力盡，戰後又遭受到出人意料的逆境，難以提供有效率、大規模的行政管理，和迅速的經濟恢復。

