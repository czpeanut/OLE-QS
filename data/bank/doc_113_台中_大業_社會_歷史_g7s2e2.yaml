- id: doc_113_台中_大業_社會_歷史_g7s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 根據閱讀資料，請問烏克蘭因為何事而實施戒嚴法和動員法？
  options:
  - label: A
    content: 俄羅斯入侵
  - label: B
    content: 第二次世界大戰
  - label: C
    content: 俄羅斯總統普丁要求
  - label: D
    content: 烏克蘭總統澤連斯基決定。
  group_stem: "烏克蘭總統澤連斯基（Volodymyr Zelenskyy）稍早簽署該國國會通過的第15 次延長戒嚴和動員法案，直到今年8 月6 日之前都不會讓俄羅斯總統普丁（Vladimir\
    \ Putin）換掉烏克蘭領袖的盤算如願。\n    普丁要求烏克蘭必須改選1 位新的總統，才願意停止侵略戰爭。然而烏克蘭主張，在戰爭期間前線士兵無法返鄉投票，在俄軍佔領區內人民的選舉權也沒有保障。\n\
    \    烏克蘭第13172 號法律案（戒嚴法）和第13173 號法律案（動員法）原定於 5 月9 日到期。烏克蘭國會於16 日以346 票支持、1 票棄權，1\
    \ 票反對，通過將戒嚴和總動員期限再延長90 天，從5 月9 日至8 月6 日。這是自2022 年2 月該國遭到俄羅斯全面入侵後第15 次延期。\n   \
    \ 根據烏克蘭憲法，戒嚴期間不能舉行選舉。儘管有傳言稱，如果美國斡旋的停火協議得以實現，烏國可能會舉行選舉，但最新延長的戒嚴令實際上排除了今年夏天舉行任何選舉的可能性。\n\
    \    節錄自，〈不讓普丁得逞 烏克蘭戒嚴延長8 月前不可能改選換總統〉，Newtalk 新聞，2025/04/19。"
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 歷史
      code: 4-2
      title: 戒嚴體制與白色恐怖
