  - label: D
    content: 漸禁政策時期。
  group_stem: '樂信瓦旦進入蕃童教育所就讀，一路受到總督府刻意栽培，並進入臺灣總督府醫學校就讀，當時臺灣原住民中，像樂信瓦旦這樣受過高等教育的人並不多。醫學校畢業後，樂信瓦旦回到泰雅族部落擔任公醫，為族人提供醫療服務。樂信瓦旦和日本人一直保持著良好關係，甚至娶了日本妻子，改用日本名字。

    第二次世界大戰後，臺灣由中華民國接管，樂信瓦旦改名林瑞昌，曾擔任第一屆省參議員及第一屆臨時省議員。二二八事件期間，不少原住民與漢人聯手，抗議國民黨統治，但樂信瓦旦擔心年輕人被政府的軍隊所傷，勸族人不要加入反抗的行列。

    雖然樂信瓦旦總是盡力調解不同族群間的糾紛，卻在西元1952 年無預期被政府逮捕。原來因為他主張政府應該歸還原住民被佔領的土地，讓族人能夠回到故鄉居住，但這樣的主張被政府認定是宣揚共產主義，樂信瓦旦因此被誣賴是共匪，最終遭到槍決。樂信瓦旦死後，家人的生活陷入困境，許多親友甚至擔心被牽連而遠離他們。'
