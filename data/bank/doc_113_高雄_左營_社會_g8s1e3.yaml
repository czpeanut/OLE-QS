  stem: 「與西洋文明國共進退」，日本做了許多的努力。請問：下列何者正確?
  options:
  - label: A
    content: 進行明治維新，以器物改革為主
  - label: B
    content: 日本結束鎖國政策受英國強行入侵影響
  - label: C
    content: 明治維新後首次出兵海外是攻打臺灣
  - label: D
    content: 日俄戰爭後進行君主立憲
  group_stem: "資料一：\n    1885 年，日本學者福澤諭吉在日本報章《時事新報》發表一篇著名的短文《脫亞論》。內容有「作為當今之策，我國不應猶豫，與其坐等鄰國的開明，共同振興亞洲，不如脫離其行列，而與西洋文明國共進退。對待支那、朝鮮的方法，也不必因其為鄰國而特別予以同情，只要模仿西洋人對他們的態度方式對付即可。與壞朋友親近的人也難免近墨者黑，我們要從內心謝絕亞細亞東方的壞朋友」，引起廣大的迴響。\n\
    資料二：\n    1898 年，中國官員張之洞發表《勸學篇》，大力闡揚「中學為體，西學為用」的思想，成為當時官員普遍認同的觀念。當時維新派提倡「西學」反對「中學」，而守舊派則反對「西學」，固守「中學」。張之洞認為，只有「中學為體，西學為用」才是不偏不倚的正確思想。\n\
    根據上述資料，回答下列48-50 題："
