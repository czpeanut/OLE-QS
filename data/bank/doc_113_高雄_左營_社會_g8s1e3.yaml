  stem: 全國性公民投票案第17案至第20案，藍綠兩黨積極備戰，分別主張「4個同意」與「4個不同意」。例如第19案的同意方便主張：「公投綁大選將大幅降低行政成本、促進多元討論。」而不同意方的認為：「2018年大選綁公投就已造成選務混亂，勿再重蹈覆轍。」請問，這凸顯了公共意見的哪一項特性？
