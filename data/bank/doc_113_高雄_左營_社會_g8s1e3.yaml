- id: doc_113_高雄_左營_社會_g8s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 「不分區」在選舉制度設計上，就是各政黨推出專業的、弱勢代表、以及可代表黨意的人選，因為很多社會上各領域人士，不容易透過「選舉」選上，「不分區」就提供這樣一個機會，這些人能不受地區限制，更兼顧全國利益來問政、修法。不過，「不分區」由政黨提名，若遭「撤銷黨籍」就失去資格，所以能否貫徹「黨的意志」也很重要。請問，上文主要是對焦在哪一項主題？
  options:
  - label: A
    content: 地方自治團體的歷史演進
  - label: B
    content: 單一選區兩票制的設計
  - label: C
    content: 公平投票的無記名原則
  - label: D
    content: 直轄市山地原住民區的選舉制度
- id: doc_113_高雄_左營_社會_g8s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '下表四位市民均表達競選高雄市長的意願，請問，誰才具有高雄市長候選人的資格？

    | 選項 | 姓名 | 國籍 | 年齡 | 設籍 | 簡介 |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | (A) | 陳○○ | 中華民國 | 45歲 | 滿6個月 | 受監護宣告 |

    | (B) | 韓○○ | 中華民國 | 32歲 | 滿6個月 | 沒有政黨背景 |

    | (C) | 李○○ | 中華民國 | 28歲 | 滿4個月 | 毫無從政經驗 |

    | (D) | 蔡○○ | 中華民國 | 40歲 | 滿4個月 | 做滿8年剛退下來的前任市長 |'
  options:
  - label: A
    content: 陳○○
  - label: B
    content: 韓○○
  - label: C
    content: 李○○
  - label: D
    content: 蔡○○
- id: doc_113_高雄_左營_社會_g8s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 根據媒體的調查，台灣國高中生每日在校時間約為9.5小時，而歐、美多數國家則為6至7小時。有民眾透過網路連署要求縮短上課時數，教育部因為連署達到門檻而召開公聽會。民眾透過網路連署公開表達意見，就是希望能形成(甲)以影響政策。而教育部會為其召開公聽會，是為了讓更多的民眾進行公開的對話與討論，凝聚共識。請問，上問中的(甲)為何？
  options:
  - label: A
    content: 社會福利
  - label: B
    content: 性別平等
  - label: C
    content: 地方政府
  - label: D
    content: 公共意見
- id: doc_113_高雄_左營_社會_g8s1e3_s2_4
  section: 2
  number: 4
  type: single
  page: 1
  stem: 中華民國國民年滿(甲)歲，除受(乙)尚未撤銷者外,在各該選舉區內繼續居住(丙)個月以上,有這次公民投票的選舉投票權。請問：甲、乙、丙分別為何？
  options:
  - label: A
    content: 18歲；褫奪公權；4個月
  - label: B
    content: 18歲；監護宣告；6個月
  - label: C
    content: 20歲；褫奪公權；4個月
  - label: D
    content: 20歲；監護宣告；6個月
  group_stem: "全國性公民投票案第17案至第20案（重啟核四、反萊豬、公投綁大選、三接遷離）於2021年12月18日投票。\n第17案您是否同意核四啟封商轉發電？\n\
    第18案你是否同意政府應全面禁止進口含有萊克多巴胺之乙型受體素豬隻之肉品、內臟及其相關產製品？\n第19案你是否同意公民投票案公告成立後半年內，若該期間內遇有全國性選舉時，在符合公民投票法規定之情形下，公民投票應與該選舉同日舉行？\n\
    第20案您是否同意中油第三天然氣接收站遷離桃園大潭藻礁海岸及海域？\n    中選會晚間8時20分完成開票。「重啟核四」同意票380萬4755張、不同意票426萬2451張；「反萊豬」同意票393萬6554張、不同意票413萬1203張；「公投綁大選」同意票395萬1882張、不同意票412萬38張；「三接遷離」同意票390萬1171張、不同意票416萬3464張。四項公投案都因同意票未多於不同意票，投票結果為不通過。"
