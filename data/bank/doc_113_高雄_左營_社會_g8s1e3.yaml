  group_stem: '清帝國在對外戰爭失敗後，被迫與英國簽訂條約及其續約，這些條約除了割讓領土、開放五個沿海口岸通商外，也准許英國商人帶家眷到通商口岸居住，因此英國派遣領事來中國處理相關的商務事宜。為了解決英國人的居住問題，地方官員與英國領事共同協商通商口岸租地建屋的地點，最終劃定長江三角洲中的一個區域，使其成為中國第一個租界。此後，外商紛紛進入租界拓展貿易，商業迅速發展，成為中國最早接觸西方文明的重要窗口，逐漸改變原有中國城市的面貌。

