- id: doc_111_彰化_溪湖_國文_g8s1e3_s2_39
  section: 2
  number: 39
  type: single
  page: 4
  stem: 有關本文的敘述，下列何者正確？
  options:
  - label: A
    content: 本文是一篇寫景的遊記
  - label: B
    content: 可推知作者當時的位置是在松風亭中
  - label: C
    content: 「望亭宇尚在木末」可換為「望亭簷之未至」
  - label: D
    content: 通篇以登松風亭為喻，描繪出自己仕途的艱辛
  group_stem: '余嘗①寓居惠州 嘉祐寺，縱步松風亭下，足力疲乏，思欲就林止息。望亭宇尚在木末，意謂是如何得到？②良久，忽曰：「此間有什麼歇不得處？」由是如③掛鉤之魚，忽得解脫。若人悟此，雖兵陣相接，鼓聲如雷霆，進則死敵，退則死法，④當什麼時也不妨⑤熟歇。

    （蘇軾 記遊松風亭）

    註：①寓居：寄住。

    ②良久：過了好久。

    ③掛鉤之魚：比喻處境危險。

    ④當什麼時：這時。

    ⑤熟歇：好好休息一番。'
