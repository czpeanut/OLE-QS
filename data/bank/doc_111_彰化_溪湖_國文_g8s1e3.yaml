  - label: D
    content: 相見時難別亦難
  group_stem: '愛一個人，在心裡的隔間點燈，一盞一盞，照亮過往和未來，整個人通透了。

    愛一個人，並且得到愛，並不是最困難的。

    愛一個人，而能保持愛意，長久在一起，卻很不容易。

    如果想長長久久愛著一個人，一直在一起，理解是很重要的吧。

    不是我想像或期待的樣子，而是愛人真正的樣子。

    真實的性情，真實的陰暗與寡合，都能理解。

    而後，我仍想和這個人在一起，

    仍為了這個人怦然心動，仍希望自己帶給他最多的幸福。

    於是，我才能說，我愛一個人。

    （張曼娟 愛一個人）'
