  options:
  - label: A
    content: 「一棵開花的樹」象徵期待青春長存的女子，並以花開花落表示對時光流逝的感嘆
  - label: B
    content: 「陽光下慎重開滿了花╱朵朵都是我前世的盼望」：表達對愛情的專注與莊嚴，竭盡心思吸引對方目光
  - label: C
    content: 「那顫抖的葉是我等待的熱情」：女子興奮又緊張不安的心情，既期待又怕受傷害
  - label: D
    content: 「在你身後落了一地的╱朋友啊 那不是花瓣╱是我凋零的心」：期盼落空，而傷心失望
