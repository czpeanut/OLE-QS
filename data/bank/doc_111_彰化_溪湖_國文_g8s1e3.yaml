  section: 1
  number: 12
  type: single
  page: 1
  stem: 「不是每件事都會成功，但卻都值得一試。沒有人不害怕改變，因為會擔心失去一些東西；但只要肯努力，就有可能得到更好的回報。很多的事，如果你因為去做而失敗，或許你會難過一陣，但選擇不做而錯過，你將會後悔一輩子。」關於這段話的判讀，下列何者正確？
  options:
  - label: A
    content: 失敗是一時的，但錯過的遺憾是永久的
  - label: B
    content: 所有人都不害怕改變，每件事情都值得一試
  - label: C
    content: 只要肯努力，事情最終都會成功也能獲取更好的報酬
  - label: D
    content: 寧願不做而後悔，也不願面對失敗之後的心理折磨
