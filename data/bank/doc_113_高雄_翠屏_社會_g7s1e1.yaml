  stem: 依上文所述，下列何者並非兒童因取水或缺乏乾淨的飲用水，而可能侵害其人性尊嚴的原因？
  options:
  - label: A
    content: 失去接受教育的機會
  - label: B
    content: 走路過久而影響健康
  - label: C
    content: 因危險意外失去生命
  - label: D
    content: 飲用不潔的水而生病。
  group_stem: '● 請閱讀下列短文並回答問題：

    每年的3 月22 日是「世界水資源日」(World Water Day)，根據世界衛生組織(WHO)報告，全球至少有8.4 億人口缺乏安全乾淨的飲用水，相當於每9人中就有1
    人因不乾淨的水影響其生活，其中有超過3.4 億人居住在撒哈拉沙漠以南的非洲。撒哈拉沙漠以南的偏遠地區人們，平均每趟取水需耗費至少半小時，在水資源更缺乏、環境安全不穩定的索馬利亞、衣索比亞及烏干達等國家，單趟的平均取水時間更超過1
    小時。在這漫長的取水路途上，許多兒童為了取水而來不及上學，因此失去接受教育的機會；或於取水途中發生危險意外而失去生命。此外，更有許多兒童因飲用不潔的水而生病。'
