  stem: 上文中的「偏鄉遊童」，因為家庭的各種因素導致無法專心念書，也沒有人可以教導課業，最後覺得自己會無法與都市小孩相比，而自認不如他人，此可能會影響其對於以下哪一個觀念的理解？
  options:
  - label: A
    content: 人身自由
  - label: B
    content: 性別平等
  - label: C
    content: 人性尊嚴
  - label: D
    content: 國家安全。
  group_stem: '● 下列為「兒童福利聯盟」調查報告中的兩則報告：


    在偏鄉地區，有超過三成六的孩子放學後，由於家中沒有大人在家，因此會在外遊蕩成為「偏鄉遊童」。因為單親、隔代教養、經濟等家庭困境，在偏鄉地區有一群孩子回家後不一定有大人陪伴，協助家務、照顧弟妹、自理晚餐對孩子來說是每天必須要做的事情，因此常常無法專心念書，課業上有問題也時常無法有人教導。此外，也有六成的偏鄉孩子覺得自己長大以後，成績會比不上都市的小孩。


    民國98年起，「兒童福利聯盟」實地走訪全臺偏遠鄉鎮，尋找資源缺乏，鮮少有人關注的偏遠小學，幫助偏鄉小學的弱勢孩子，藉由提供偏鄉學校弱勢兒童各項資源及關懷，維持兒童基本生活需求、確保他們的健康，更重要的是幫助他們能繼續上課和學習。


    請根據這兩則報告，回答下列問題：'
