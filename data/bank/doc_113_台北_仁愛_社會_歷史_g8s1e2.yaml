  section: 1
  number: 2
  type: single
  page: 1
  stem: "資料一：中國西北和歐洲大陸間的交通，因蒙古餘部的阻隔，無法暢通，但南方海上的交通，則進入了盛況…鄭和下西洋，出使次數之多、所帶船隻兵丁數目之大和航程之遠，在當時可以說是一項偉大的事業…\n\
    \  資料二：原有的首都應天，去邊塞六千里，蒙古人經常出沒…他自立為帝後，改北平為北京，設順天府，將富民遷至該地，數年後徙都北京…\n請問，資料一、二講述的是哪位君主的事蹟？"
