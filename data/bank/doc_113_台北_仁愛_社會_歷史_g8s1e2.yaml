  stem: 1596 年，英國女王伊莉莎白一世寫了一封外交信件(如圖一)給當時的明朝君主萬曆皇帝，然而，這封信件最終未能送達。直到1986 年，英國女王伊莉莎白二世訪問中國時，才將此信的複印件送給中國作為外交禮品。請根據歷史所學，分析明代貿易有何特色？
  options:
  - label: A
    content: 受禁教政策影響，英國傳教士未能開展其傳教事業
  - label: B
    content: 歐洲商人將美洲白銀傳入中國，購買中國絲綢、瓷器
  - label: C
    content: 英國國書未能送達明朝，明代的鄭和卻曾訪問英國
  - label: D
    content: 明代實施「鎖國政策」，英國商人不可能到中國貿易
