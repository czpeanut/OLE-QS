  page: 1
  stem: '某大學教授於講課時，曾提到：「※※到處都有，當時遞送公文者在一定時間內須趕多少路都有著嚴格規定…某一個※※都有駐點人員，送公文者抵達前，駐點人員早已將吃食備好，吃飽喝足、稍事休息後，換一匹預先餵好的馬繼續上路…古代交通不便，誤點是尋常的事，但公文最慢也須在一定時間內送達，否則政事會亂、國家會垮…」

    請問，※※所指為何？'
