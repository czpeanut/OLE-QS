- id: doc_112_台中_居仁_自然_g8s2e3_s2_34
  section: 2
  number: 34
  type: single
  page: 4
  stem: 關於此篇文章之敘述，何者有誤?
  options:
  - label: A
    content: 和甲醇相比，酒精分解酵素與乙醇的親和性較高。
  - label: B
    content: 甲酸的毒性比乙酸高。
  - label: C
    content: 喝到假酒會中毒，是因為甲醇有機會轉化成甲醛造成代謝性酸中毒。
  - label: D
    content: 甲醇中毒時，在醫師指示下可以用乙醇療法。
  group_stem: "誤食假酒的乙醇療法，請閱讀後，回答34~35題\n    「乙醇療法」聽起來雖然令人疑惑，卻是現今對於甲醇中毒相當重要的療法之一。\n\
    \    「假酒」之所以使人中毒，是因為裡面加入了和乙醇相似、卻較容易取得且便宜的甲醇（methanol），通常是不肖商人用以降低成本的手段。\n    甲醇本身並不具毒性。當甲醇被喝下或吸入後，會在消化道和肺臟透過擴散作用吸收進入血液中，然後被人體轉化為甲醛（Formaldehyde,\
    \ $\\mathrm{CH_{2}O}$），也就是我們常聽到的福馬林。不過，甲醛雖具有毒性，但仍不是最可怕的敵人。甲醛形成之後，會再被轉化成甲酸（Formic\
    \ acid, $\\mathrm{CHOOH}$），此時真正的大魔王才要等登場。甲酸毒性比甲醛更強，也是甲醇中毒最主要的原因。甲醛被轉化為甲酸之後會在身體裡累積，抑制粒線體的呼吸作用、使細胞壞死，破壞神經系統進而導致失明，此症狀稱為代謝性酸中毒（metabolic\
    \ acidosis）。\n    2017 年八月，中國重慶市一名男子誤喝假酒後，被診斷出是甲醇中毒，轉院進行急救，此時已生命垂危，醫生在診斷後作出了一個令人不解的決定：請家屬買烈酒來給患者服用，最後，患者的病情好轉，血液中的甲醇濃度降低，終於康復出院。\n\
    \    前面提過，甲醇中毒主要是因為甲酸的強烈毒性。而要形成甲酸，就必須讓甲醇在肝臟被酒精分解酵素（alcohol dehydrogenase, ADH）分解形成甲醛，再讓甲醛跟甲醛去氫酵素\
    \ （aldehyde dehydrogenase, ALDH） 反應形成甲酸。\n    還好，酒精分解酵素並不是只會對甲醇作用，它也會將乙醇轉化成乙醛（acetaldehyde,\
    \ $\\mathrm{CH_{3}CHO}$），更幸運的是，酒精分解酵素對於乙醇的親和性較高。故當血液中的乙醇濃度夠高時，酵素與乙醇的反應達到飽和，就不能將甲醇轉化為毒性較高的甲醛，讓甲醇直接被排出體外，等到一開始生成的甲酸被人體所代謝，形成無害的水與二氧化碳之後，才算是治療完成。"
