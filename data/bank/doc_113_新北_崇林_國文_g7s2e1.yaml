- id: doc_113_新北_崇林_國文_g7s2e1_s4_25
  section: 4
  number: 25
  type: single
  page: 3
  stem: 「以貓頭鷹中的倉鴞為例，牠的左、右耳位置不同，右耳略高於左耳，因此聲音到達左、右耳的時間有些微的差異。若是牠的左、右耳同高，和我們人一樣，就只能判斷音源的遠近，而無法判斷音源的高低。此外，倉鴞的臉盤上還布滿能接收外界細微震動的羽毛，左半部的毛略微向下方長，右半部的毛略微向上方長，阻隔開臉盤左、右兩邊傳來的聲音，如此左、右耳各自對來自下前方、上前方的聲音較為敏感。倉鴞便依照_________________，來判斷聲音的位置。」根據文意，文中畫線處應填入下列何者最恰當？
  options:
  - label: A
    content: 兩耳聽到聲音的時間差異及音量大小
  - label: B
    content: 臉部羽毛隔開兩耳的角度及音節快慢
  - label: C
    content: 左、右耳對聲音的敏感度及音色優劣
  - label: D
    content: 臉盤上羽毛震動幅度大小及音調高低。
  tags:
