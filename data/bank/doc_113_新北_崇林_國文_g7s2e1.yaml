- id: doc_113_新北_崇林_國文_g7s2e1_s5_4
  section: 5
  number: 4
  type: single
  page: 4
  stem: 本文提及「樂施會」的寫作手法，下列說明何者正確？
  options:
  - label: A
    content: 指出另一種相反的觀點來佐證，凸顯主旨
  - label: B
    content: 用正面的例子來支持論點，豐富欲說明的主旨
  - label: C
    content: 舉不同文化的作法為例，說明主題事物仍有不足之處
  - label: D
    content: 提出其他不同作法來對比主要欲說明的事物，比較其利弊。
  group_stem: "題組三\n  有人放生鳥，有人放生魚，你可曾想過，有一群人覺得書也是可以放生的？\n  臺北有一群人，在網路上聚成了「行書」的網站，登載將有哪些書會在哪些地點被放生。這些書的擁有者，決定把自己或許看過了，或許曾珍藏，或許只是不想再擁有的書交付出去。早期這些書會放在捷運站等公共空間任人拿取，但發現有的書竟然被當成垃圾處理掉，真傷透放生者的心，於是改成把書放在某些固定的咖啡館中，而網路上會刊登哪些書在哪些咖啡館內，讓有心收養書的人可以依址前往。\n\
    \  通常，放生書的主人會在網上寫一段自己對書的看法，也算是某種表明自己和書的關係，頗有交代前世來歷之感。而認養放生書的人，也可能會上網審查書的身世，之後再交代自己和書相遇後的心得，讓書的有情輪迴公諸於世。\n\
    \  這些行書人，強調讓書流轉，和二手書的市場意義不同。這些交出書的人，並不把書當成商品，而是某種精神、感情、靈魂，他們交出書，是希望傳播這些事物出去。因此大多數時候，不同於賣出二手舊書的人，通常是交出自己不想要的東西，行書人反而可能交出的是自己最在乎、最喜歡的書（也有可能他們會自己留一本，又送出一本）。他們期待的是讓有緣人看到這本書，也期待在這世界上某一角落會有某位陌生人，因為這本書，而上網和他們溝通內心的想法。\n\
    \  放生書，的確是件有趣的事，讓我想到我在倫敦時，常常去一個叫樂施會的二手商店，那裡專門收藏人們放生的舊衣服、舊物、舊書等，但要認養這些舊貨的人，要付出一些錢，但這些錢全都用去捐助非洲的飢民。\n\
    \  樂施會的人認為，讓用過的東西流傳，意義不單只是收到一些捐助的錢，也是在倡導惜物的精神，他們相信東西也是有情世界，讓舊貨有機會重新被珍惜，也是愛惜萬物的表示。\n\
    \  放生書也一樣，因為有所取捨，更讓我們珍惜與書相處時的緣分，等到緣分已被美好完成時，或許該是讓書再去另覓佳緣之時。能如此對待書，雖不是執著的書痴，卻可能是化小愛為大愛的書聖了。\
    \        （韓良露 放生書）"
