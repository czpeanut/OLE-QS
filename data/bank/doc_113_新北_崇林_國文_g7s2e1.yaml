  stem: 「雖然懷疑某些書上所說的東西，但你卻無法自己去驗證他們的虛實。」這段話的情境與下列何者最相近？
  options:
  - label: A
    content: 玉不琢，不成器
  - label: B
    content: 學而不思則罔
  - label: C
    content: 學如不及，猶恐失之
  - label: D
    content: 學然後知不足。
  group_stem: "題組二\n  你說你雖然懷疑某些書上所說的東西，但你卻無法自己去驗證他們的虛實，而且以你現在的思考功力，也難以提出更佳的答案。\n \
    \ 這的確是個問題。讀書容易驗證難。我們不可能上窮碧落下黃泉，一一去驗證書上所說的話是否真實，而對某些問題的思考，也不見得比作者來得高明。那要如何發現虛妄呢？我想除了要看作者個人的「可信度」外，另一個簡單易行的方法就是「讀更多的書」。\n\
    \  這聽來似乎有點矛盾，既然每本書中都可能含有虛妄的成分，那讀更多的書豈非使虛妄變得更加複雜？如果你想知道某個知識體系是否虛妄不實，是否有它的盲點或弱點，讀同類的書當然沒有幫助，甚至可能使你越陷越深。但如果你讀的是它的「知識敵人」的著作，那就經常能收醍醐灌頂之效。\
    \                           （王溢嘉 尋找知識上的敵人）"
