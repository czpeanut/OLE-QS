  - label: B
    content: The Brooklyn Bridge.
  - label: C
    content: The Met.
  - label: D
    content: The American Museum of Natural History.
  group_stem: "B.\n    Hi, I’m Sam. My family takes a trip to a different country\
    \ almost every year. This year, we chose to visit the USA. We got to New York\
    \ City yesterday, January 15th. We took the subway to our hotel. After we checked\
    \ in, we went to Times Square on foot. In many people’s eyes, it’s the heart of\
    \ the city. There are many theaters around Times Square, and we saw The Lion King\
    \ there. This morning, we rode bicycles to the Brooklyn Bridge. On the way there,\
    \ we enjoyed many beautiful sights. I will never forget them even in the far future.\n\
    \    Tomorrow, we are going to have a museum day. In the morning, we will take\
    \ a bus to the Met. There are many wonderful works of art there, and I really\
    \ want to see Monet’s and Picasso’s paintings. In the afternoon, we’ll visit the\
    \ American Museum of Natural History. It was the setting for the successful movie,\
    \ Night at the Museum. Maybe “I will get museum feet” after walking around these\
    \ places all day, but I will learn a lot for sure.\n\n  subway 地鐵    far 遙遠的\
    \    painting 畫作    setting 佈景    successful 成功的"
