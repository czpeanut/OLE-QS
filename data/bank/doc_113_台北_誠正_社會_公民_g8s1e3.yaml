  stem: '當我們談論政治的時候，底下這段文字很常被提起，請問這段文字表達何種概念的重要性？


    起初他們追殺共產主義者，因為我不是共產主義者，我不說話；

    接著他們追殺猶太人，我不是猶太人，我不說話；

    後來他們追殺工會成員，我不是工會成員，我繼續不說話；

    此後他們追殺天主教徒，我不是天主教徒，我還是不說話；

    最後他們奔向我而來時，再也沒有人站起來為我說話了。'
