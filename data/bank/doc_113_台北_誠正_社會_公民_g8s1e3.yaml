- id: doc_113_台北_誠正_社會_公民_g8s1e3_s2_31
  section: 2
  number: 31
  type: single
  page: 4
  stem: 根據報導一，新北市舉行警犬退役儀式的活動主要體現了以下哪一項地方政府的職責？
  options:
  - label: A
    content: 經濟建設
  - label: B
    content: 安全衛生
  - label: C
    content: 社會福利
  - label: D
    content: 教育文化
  group_stem: '報導一、

    新北市6 隻警犬光榮退役，近日舉行盛大又充滿榮耀與溫暖的退役儀式，新北市長侯友宜親手頒授退休獎牌給6 隻警犬，他表示，警犬在治安維護、反恐執勤、毒品查緝及重大活動安全保障中都是默默奉獻，感謝所有領養家庭，讓退役警犬可享受平靜退休生活。


    6 隻退役警犬分別是台灣唯一的血跡偵搜犬「福星」、偵爆犬「首領」、「亮亮」、「飛達」、「XINA」以及緝毒犬「YUTU」，牠們正式卸下任務，走向平靜幸福的退休生活，牠們與領犬員間深厚的情誼以及領養家庭的愛心承接，成為全場最動人的亮點。


    選文摘改自聯合報《新北6 警犬光榮退役 侯友宜：感謝領養家庭、享受平靜退休生活》


    報導二、

    臺北市過去幾年在元旦升旗、燈節等大型例行性活動時執行「偵爆」及「緝毒」勤務，屢向新北市府警犬隊借緝毒犬。臺北市議員陳怡君對此表示，她在質詢時發現，在執行公務勤務時，對於「偵爆」及「緝毒」勤務時臺北市竟然沒有警犬可以執行該任務，需要透過新北市政府警犬隊支援。


    而從111 年至113 年的數據來看，過往支援活動項目都是例行性的。新北市警犬隊每年人員編制為13 至15 人，緝毒犬數量為5 至6 隻，編列預算226 至276
    萬元。希望臺北市應該要有自己的警犬，不能每次都是外借。


    選文摘改自太報《北市例行活動屢跟新北借緝毒犬 議員籲培養自己的警犬》'
