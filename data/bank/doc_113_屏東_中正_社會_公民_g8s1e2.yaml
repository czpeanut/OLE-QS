  stem: '由關心族名議題的大學生所組成的「以我的族名呼喚我」行動小組，認為傳統名字羅馬拼音等方式，可能會有漢字無法明確傳達原住民名字發音和意義的問題，違反憲法所保障的基本權利，也違背原住民族基本法和原住民族語言發展法的精神。因此行動小組成員向戶政事務所上級機關內政部提出訴願，要求政府開放身分證單列族名、尊重原住民族語言與文字。

