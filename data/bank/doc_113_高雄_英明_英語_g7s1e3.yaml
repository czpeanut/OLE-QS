  stem: What does the “nest” mean?
  options:
  - label: A
    content: The place for baby birds.
  - label: B
    content: The place for old birds.
  - label: C
    content: The place for catching food.
  - label: D
    content: The bald eagle’s white head.
  group_stem: '題組二

    Facts of the American National Bird:The Bald Eagle


    The bald eagle is a big bird. It lives in the USA and Canada. It’s called “bald”
    because of its white head and neck. It is the national bird of the USA. It stands
    for the power of the USA. What’s special about the bald eagles?

    1. Bald eagles have good eyes. They can see their food from far away.

    2. Bald eagles have big claws to catch a fish or snake.

    3. Bald eagles’ wings are wide and powerful, so they can fly fast.

    4. Bald eagles use sticks and grass to make nests, the home for their baby birds.

    5. Their nests are high in trees. Both parents take care of babies together.

