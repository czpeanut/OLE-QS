  - label: C
    content: 'Marsupial Animals: The kangaroo and the Wallaby'
  - label: D
    content: Round faced animals
  group_stem: '題組一

    Kangaroos and wallabies are from Australia.They look the same, but they are not
    the same at all.


    1. The wallaby is short. Its legs are short.

    2. Its tail is short.

    3. Its face is round.

    4. Its fur is mixed with brown, gray, white, yellow and orange.


    1. The kangaroo is tall. Its legs are long.

    2. Its tail is long.

    3. Its face is long.

    4. Its fur is brown or gray.


    They are not the same in sizes, face shape, and colors. BUT, they all have “POUCH”.
    The pouch is like a pocket at the front of their bodies. Baby kangaroos and baby
    wallabies can stay in their mother’s pouch for over six months. The animal with
    a pouch is also called marsupial animals.


