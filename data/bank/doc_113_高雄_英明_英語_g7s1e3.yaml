  group_stem: '題組三

    Celebrate Your Family

    When you see the word “family”, what do you picture in your head? Is it a mom,
    dad, and children? Many people have this idea of family. But there are lots of
    one-parent families in this world too.

    Some think that one-parent families are “broken”. Therefore, children from this
    kind of family feel bad. But are one-parent families really bad?

    Ask yourself this question. What is important when we think about family? Is there
    love for the children? Is there enough food for the children to eat? Are the children
    healthy and safe? If the answer to these questions is yes, that means the number
    of parents you have is not important. What kind of parents you have is important.
    So if you are from a one-parent family, don’t be ashamed. If you have a good mom
    or dad, don’t be afraid to celebrate it!

    ❖ celebrate 慶祝 broken 破碎的 therefore 因此 ask 詢問 yourself 你自己 if 如果 afraid 害怕'
