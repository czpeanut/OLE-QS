  group_stem: '題組四

    Tina: Hey Jeff, do you know that some people think dogs only see in black and
    white?

    Jeff: Isn’t that true?

    Tina: No, not true. Dogs can see colors, just not the same as we do.

    Jeff: How do they see colors?

    Tina: Well, when we see a rainbow, we see lots of colors like purple, blue, green,
    yellow, and red.

    But when dogs see a rainbow, they see not so many colors as we do.

    They see the colors like gray, blue, yellow, and yellow-brown.

    Jeff: That''s new to me.

    Tina: If we give them a red toy, they see it as an ugly yellowish brown. Isn''t
    that funny?

    Jeff: Why do they see colors not the same as we do?

    Tina: Because our eyes have three cells for colors, but dogs only have two. So,
    they can''t see many colors.

    Jeff: I see. You really are a dog expert to me!

    ❖ the same as 如同…一樣 rainbow 彩虹 yellowish 淡黃色的 cell 細胞'
