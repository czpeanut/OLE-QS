- id: doc_113_桃園_桃園_社會_公民_g7s2e2_s2_41
  section: 2
  number: 41
  type: single
  page: 2
  stem: 41. 根據上文可判斷，兒童新娘的婚姻在敘利亞有效，但在德國可能無效的原因是哪兩種社會規範的衝突？
  options:
  - label: A
    content: 敘利亞風俗習慣vs.德國風俗習慣
  - label: B
    content: 敘利亞法律規範vs.德國倫理道德
  - label: C
    content: 敘利亞宗教信仰vs.德國風俗習慣
  - label: D
    content: 敘利亞法律規範vs.德國法律規範
  group_stem: '請閱讀下列短文並回答問題


    德國的合法結婚年齡是18 歲，經過特別允許，才可以在16 歲結婚，因此兒童婚姻在德國是違法的。但在德國收容120 萬多數是穆斯林的難民時，是否應該承認這些難民兒童新娘的婚姻成為難題。在德國
    巴伐利亞登記有案的難民兒童新娘，就有160 人未滿16歲，這些兒童新娘絕大部分都由神職人員根據伊斯蘭教法主持婚禮完婚。


    西元2016 年6 月，巴伐利亞的班貝格法院正式承認一位14 歲的敘利亞難民與其21 歲表哥的婚姻關係，使得兒童婚姻變成眾所矚目的問題。當兩人來到巴伐利亞時，當地的青年福利處因他們違反德國法律而將其拆散，並把女孩的監護權交給地方法院，因為根據德國的兒童福利法，不滿16
    歲的兒童一定要有監護人。男方因此向班貝格法院提出上訴，由於其婚姻符合敘利亞的法律，最後法院判定他們的婚姻有效。'
