- id: doc_113_新北_福和_自然_g9s1e2_s1_39
  section: 1
  number: 39
  type: single
  page: 4
  stem: 有關地震的相關敘述，下列何者正確？
  options:
  - label: A
    content: 當發生地震規模5.5時，全台灣的民眾都會收到國家級警報的訊息
  - label: B
    content: 針對某個容易發生地震的地區，目前的科技可以做到地震短期預報
  - label: C
    content: 目前中央氣象署的能力已可以針對地震精準做到預警、預報及預測
  - label: D
    content: 地震預警的關鍵，正是把握P波與S波抵達的時間差。
  group_stem: '【題組】地震預警、預測、預報大不同！

    「地震預警」Earthquake early warning：在「地震已經發生、破壞性震波到達前」預估該次地震的規模超過5 時，會透過通訊技術，將警報傳送到預估震度大於4
    級的地區民眾手機上，以手機通知民眾強震即將來襲，方便民眾在十幾秒的空檔裡，趕緊各就各位，掩護避災。地震預警技術示意圖，如附圖

    「地震預測」Earthquake prediction：在「地震發生前」，預測未來地震發生的時間、位置和規模，才稱得上準確的預測，準確的地震預測有助於事先防災、撤離人員。我們知道，地震釋放能量的源頭是斷層，科學家對地震發生的機制與過程還在充分理解當中，沒有辦法作為發布預警的依據。另外，當我們發現臺灣被各式各樣的地震傳說壟罩，如漁民捕獲罕見的深海「皇帶魚」(俗稱地震魚)，恐有大地震。如1999
    年發生集集大地震前後，由於部分地區出現了大量蚯蚓，因此臺灣也盛傳著「蚯蚓」是地震警訊的說法。但這一切在科學家眼中，僅僅是一種流傳於民間的迷信，會影響動物行為的因素實在是太多了，科學家仍然沒有找到動物異常行為和地震之間的關聯或機制。

    「地震預報」 Earthquake forecasts：地震預報也需要在「地震發生前」，針對某個容易發生地震的地區，預報發生時間、位置和規模資訊。就像氣象預報分為短期和長期，長期的地震預報包含地震的機率和趨勢評估，準確的長期地震預報，有助於國土規劃、建築物設計、防災宣導等措施。(參考資料來源：中央氣象署)請回答第39〜40
    題：'
  shared_asset: g1_39_40
  answer:
  - D
  answer_source: answer_key_vlm
