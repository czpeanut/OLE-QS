- id: doc_113_新北_江翠_國文_g9s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 〈蘇東坡突圍〉文中「他真的害怕了嗎？也是也不是。他怕的是麻煩，而絕不怕大義凜然地為道義、為百姓，甚至為朝廷、為皇帝捐軀。他經過『烏臺詩案』已經明白，一個人蒙受了誣陷即便是死也死不出一個道理來。」根據這段所述，「烏臺詩案」使蘇東坡明白的道理是：
  options:
  - label: A
    content: 捐軀取義是實現道義的唯一途徑。
  - label: B
    content: 為道義犧牲可以徹底說明真相。
  - label: C
    content: 詩詞的表達應當避諱敏感話題。
  - label: D
    content: 個人即使蒙冤犧牲，也難以改變現實。
