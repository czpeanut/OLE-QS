- id: doc_113_新北_江翠_國文_g9s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 關於本闋詞的說明，下列敘述何者「有誤」？
  options:
  - label: A
    content: 本闋詞前的「小序」點出人、事、時、地、物。
  - label: B
    content: 「莫聽穿林打葉聲，何妨吟嘯且徐行」的「莫聽」、「吟嘯」，隱含著作者坦然面對人生橫逆的豪情。
  - label: C
    content: 與「試問嶺南應不好，卻道，此心安處是吾鄉」呈現的心境接近。
  - label: D
    content: 「回首向來蕭瑟處，歸去，也無風雨也無晴」隱含東坡心境失落的感觸。
  group_stem: '〈定風波〉三月七日，沙湖道中遇雨。雨具先去，同行皆狼狽，余獨不覺。已而遂晴，故作此

    莫聽穿林打葉聲，何妨吟嘯且徐行。竹杖芒鞋輕勝馬，誰怕？一蓑煙雨任平生。

    料峭春風吹酒醒，微冷，山頭斜照卻相迎。回首向來蕭瑟處，歸去，也無風雨也無晴。'
