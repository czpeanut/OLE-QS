    常州宜興縣黃土村，東坡南還北歸，常與單秀才步月至其地，地主攜酒來餉，曰：「此紅友也」。坡曰：「此人知有紅友，而不知有黃封，可謂快活」。余嘗因是言而推之，金貂紫綬，誠不如黃帽青蓑；朱轂繡鞍，誠不如芒鞋藤杖；醇醪養牛，誠不如白酒黃雞；玉戶金鋪，誠不如松窗竹屋。無他，其天者全也。


