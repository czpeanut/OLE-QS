- id: doc_113_新北_江翠_國文_g9s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 「美國人平均一年要吃十公斤零食，消耗量是二十年前的兩倍。而二十年前美國只有兩成人口體重超標，現在卻有超過六成，且每四個人就有一個屬於癡肥，每年因肥胖相關病症而死的有三十萬人。不只美國多胖子，臺灣也有將近五成的人超重，中國有四成，香港有兩成半，全世界加起來，至少有十億人超重。」歸納上文所述，下列何者最為正確？
  options:
  - label: A
    content: 美國在這二十年來，人均零食消耗量和體重超標人口兩者的成長比例旗鼓相當。
  - label: B
    content: 美國的癡肥人口比例在體重超標人口中屬於少數
  - label: C
    content: 臺灣體重超重的人數高於中國
  - label: D
    content: 二十年前全世界超重人口數不到四億
  tags:
    chapter:
      publisher: 翰林
      book: 九上
