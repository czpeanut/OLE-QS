- id: doc_113_新北_江翠_國文_g9s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 「布朗奈的（壞食物稅）呼籲雖然深得各方響應，然而也有人批評，這是不顧個人選擇自由，以公權力介入規管，武斷判定食物的好壞，不但執行困難，而且不免落入法西斯心態。」根據上文推斷，下列何者最可能被布朗奈的批評者所認同？
  options:
  - label: A
    content: 〈大專校院餐飲衛生輔導注意事項〉：非以學生供餐為主的美食街、連鎖餐飲、便利商店等，不限制僅使用國產豬、牛肉。
  - label: B
    content: 〈校園飲品及點心販售範圍〉：高級中等學校校園飲品禁止供應碳酸飲料。
  - label: C
    content: 〈學校餐廳廚房員生消費合作社衛生管理辦法〉：高級中等以下學校供售之食品，不得使用甜味劑或代脂。
  - label: D
    content: 〈幼兒園餐點食物內容及營養基準〉：設計點心時，高油糖鹽食品每週不超過1 次。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 國文
      code: 第七課
      title: 我們的饕餮時代
      chapter: null
