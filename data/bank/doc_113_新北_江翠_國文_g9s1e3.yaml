  stem: 「再說，垃圾食物早就和正常食物勾搭摻混，沆瀣一氣，打開抽屜和廚櫃，你能分辨清楚嗎？你確定正常食物沒有垃圾成分嗎？還有，你會不會狂噬暴食，把正常食物當成垃圾食物吃呢？」歸納上述文字，下列何者最符合作者質疑的觀點？
  options:
  - label: A
    content: 垃圾食物更具市場競爭力，導致大多數廠商甘為一丘之貉，追求更高的利潤。
  - label: B
    content: 食品在生產過程時或多或少含有垃圾食物的成分，以致正常食物和垃圾食物的界線模糊不清。
  - label: C
    content: 食品在倉儲存放時未加區分正常食物和垃圾食物，導致兩者成分互相混雜。
  - label: D
    content: 如果消費者無法控制食慾，正常食物的危害更甚於垃圾食物。
