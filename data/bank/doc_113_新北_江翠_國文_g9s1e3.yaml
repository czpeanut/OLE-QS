- id: doc_113_新北_江翠_國文_g9s1e3_s2_40
  section: 2
  number: 40
  type: single
  page: 6
  stem: 根據本文所述，以下是關於庶民與文人旅遊敘述的比較，何者「有誤」？
  options:
  - label: A
    content: 旅遊目的｜文人：主要為了遊歷名山大澤、社交與創作，爭取更多的曝光與認可。｜庶民：以宗教活動（如進香）為主要目的，且多帶有娛樂性質，強調社交與放鬆。
  - label: B
    content: 旅遊方式｜文人：常選擇交通便利的地點，如江南地區，並親自前往｜庶民：多參加進香團等集體旅遊活動，且有旅行社（牙家）提供旅遊服務，這些服務會包括食宿與娛樂。
  - label: C
    content: 旅遊對象｜文人：通常前往的是文化重鎮或名山大川，選擇的地點經常是詩文中被廣為歌頌的景點。｜庶民：則可能會選擇當地較為平常的景點或與宗教相關的場所，如寺廟等。
  - label: D
    content: 社會觀感｜文人：旅遊不僅是休閒，也是一種社會身份的象徵，會在遊記中展示自己的旅行經歷。｜庶民：旅遊活動常被視為較為輕鬆的娛樂，並且由於進香活動的盛行，具有強烈的宗教色彩。
  group_stem: '〈研之有物〉晚明古人瘋旅遊！

    中國古代的詩詞中常可見大量山水的描述，在晚明遊記當中亦然。

    文人會選擇方便抵達，或受到歌詠的景點旅遊。就算是名山大澤，若交通不便，不僅所費不貲、風險也高，前往旅遊的人自然就少。江南是晚明的文化中心，文人會到這裡遊歷、社交、撰文，以爭取更多曝光與認可。

    晚明的庶民旅遊與文人遊歷的地方多有重複。

    庶民進香團會在船上掛有「朝山進香」的旗幟，也有專門接待旅客的「牙家」，負責協助旅客的吃喝玩樂所需。費元錄《鼂采館清課》中提到士女禮朱元君神的活動：「笑語喧騰，樂聲間作」，顯示進香活動帶有濃厚娛樂色彩。旅遊興盛代表著國富。進香活動轎夫、舁夫、牙家等人力需求製造了就業機會。但官員認為旅遊會造成奢侈浪費，會影響民生、甚至是國家稅收，因此主張禁止。

    而文人書寫遊記除了炫耀，還有社會、經濟上的考量。有些筆記小說提到，有些文人不親自旅遊，而是派「僮僕」去，文人再杜撰遊記，並以記遊彰顯身份地位，由此可見遊記風潮所衍生的奇異之事。

    從十八世紀前的傳教士記載著驚訝——他們描述了轎子的舒適、道路平整便利、尤其是畫舫舒服精緻，也讚揚了旅館的普及。這些設施體驗遠遠超過當時歐洲所及。'
