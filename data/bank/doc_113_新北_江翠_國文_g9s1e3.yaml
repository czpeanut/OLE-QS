- id: doc_113_新北_江翠_國文_g9s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: '甲：「用餐時間終於到了，我早已餓得飢腸轆轆，不知道今天菜色如何？我定要巴蛇吞象一番。」

    乙：「餐廳老闆多次邀請我們，由於盛情難卻，今天我們大駕光臨，由他招待美味的山珍海味。」

    丙：「從原本一成不變的伙食換成餐廳別出心裁的佳餚，真可謂魚躍龍門！等等可由我獨占鰲頭嗎？」

    丁：「你們這群沆瀣一氣的一丘之貉，這次是長官通權達變才放行的，到了外面可別丟臉。」

    根據上述對話，何者用字遣詞完全正確？'
