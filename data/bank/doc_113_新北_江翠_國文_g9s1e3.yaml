- id: doc_113_新北_江翠_國文_g9s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 「成熟是一種明亮而不刺眼的光輝，一種圓潤而不膩耳的音響，一種不再需要對別人察顏觀色的從容，一種終於停止向周圍申訴求告的大氣，一種不理會哄鬧的微笑，一種洗刷了偏激的淡漠，一種無須聲張的厚實，一種並不陡峭的高度。」關於這段文字的意涵，下列何者「不」包括在內？
  options:
  - label: A
    content: 成熟是有極高的識見，卻能隨和平易，不顯得孤高自傲
  - label: B
    content: 成熟是說話圓融周到，不會讓人刺耳煩厭
  - label: C
    content: 成熟是面對委屈困厄，不向外求援訴苦，能豁達以對
  - label: D
    content: 成熟是說服別人並固執己見，積極超越生命的高峰
