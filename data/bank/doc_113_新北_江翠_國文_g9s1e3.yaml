  section: 1
  number: 12
  type: single
  page: 2
  stem: 「吃零食不僅是臺灣的全民運動，也是蓬勃興盛的全球運動。不論經濟好壞，業務一直穩定成長，景氣好時消費者出手爽快，景氣壞時大家吃得更兇，更需要從這小東西上得到迅速的麻痺或者慰藉」根據上述內容，下列說明何者最為正確？
  options:
  - label: A
    content: 臺灣蓬勃興盛的吃零食風氣帶動了全球的風潮
  - label: B
    content: 零食業務的成長與衰退與經濟景氣息息相關
  - label: C
    content: 零食具有撫慰人心的作用
  - label: D
    content: 主旨在於零食產業牽動著全球經濟發展。
  tags:
    chapter:
      publisher: 翰林
