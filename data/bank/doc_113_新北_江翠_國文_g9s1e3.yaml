  group_stem: '《山海經》

    「窮奇狀如虎，有翼食人從首始，所食被髮。」

    「又北三百五十里，曰鈎吾之山，其上多玉，其下多銅。有獸焉，其狀如羊身人面，其目在腋下，虎齒人爪，其音如嬰兒，名曰狍鴞【注】，是食人。」

    【注】狍鴞：為物貪淋，食人未盡，還害其身。像在夏鼎，《史記》所謂饕餮是也。

    《神異經》

    「昆侖西有獸焉，其狀如犬，長毛四足，似羆（熊）而無爪，有目而不見，行不開。有兩耳而不聞，有人知往。有腹無五臟，有腸直而不旋，食物徑過。人有德行而往牴觸之。有凶德則往依憑之。天使其然，名為渾沌。」

    「西北有獸焉，狀似虎，有翼能飛，便剿食人。知人言語，聞人鬥，輒食直者；聞人忠信，輒食其鼻；聞人惡逆不善，輒殺獸往饋之。名曰窮奇，亦食諸禽獸也。」

    「西方荒中有獸焉，其狀如虎而犬毛，長二尺，人面虎足，豬口牙，尾長一丈八尺，攪亂荒中，名檮杌」'
