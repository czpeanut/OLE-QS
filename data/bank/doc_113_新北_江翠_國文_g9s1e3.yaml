- id: doc_113_新北_江翠_國文_g9s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 「缺月掛疏桐，漏斷人初靜。誰見幽人獨往來？縹渺孤鴻影。 驚起卻回頭，有恨無人省。揀盡寒枝不肯棲，寂寞沙洲冷。」關於這闕詞的寫作手法，以下解釋何者正確？
  options:
  - label: A
    content: 藉殘月、疏桐、夜靜景象傳達作者對故人思念及寂寞心境。
  - label: B
    content: 詩句以比擬和象徵手法，以鳥喻人，傳達內心孤寂與無奈。
  - label: C
    content: 寒冽沙洲為背景，象徵冷漠以對世情，暗示與世隔離。
  - label: D
    content: 「缺月」描繪月的圓缺，表達時間流逝，無常之慨。
