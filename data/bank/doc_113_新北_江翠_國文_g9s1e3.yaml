  stem: 「布朗奈是研究肥胖的權威，他認為在人性弱點和商業洗腦下，不健康的食物充斥周遭，造成『毒食環境』，社會大眾應該拿出反菸的戰鬥態度，政府亦應政策介入，補助健康食物，向壞食物抽重稅，並規管針對兒童的零食廣告。」根據上文情境，社會大眾對於何者最有共識，立場最為堅定？
