  group_stem: "◆請閱讀下列敘述後，回答18 題\n    七巧板是一種智力遊戲，英文名稱為「Tangram」，由七種圖形的板子組成，分別有一塊正方形、一塊平行四邊形及五塊等腰直角三角形，這五塊等腰直角三角形有三種尺寸，其中，最大與最小的三角形各有兩塊，且形狀、大小分別相同。\n\
    \  用七巧板拼出的圖形要由全部的七塊板子組成，由於每塊都是幾何圖形，所以這七塊板子可以拼成千種以上相等面積的圖形，且板與板之間要有連接，即點與點、線與線或點與線的連接。\n\
    \  下方是用七巧板所拼成的風車、天鵝和帆船。〔2-3〕"
