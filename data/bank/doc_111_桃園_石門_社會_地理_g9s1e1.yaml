  group_stem: "(二)請閱讀文章後並配合附圖，回答下列問題：\n  依靠打獵、採果子的生活就一定落後又貧困嗎？人類學家詹姆斯．舒茲曼的多年在地調查，發現生活在漠南非洲\
    \ 喀拉哈里盆地的布希曼人，長期維持採集與狩獵的生活，每週只需勞動 15 個小時，就能獲取充分的營養。\n  生活在「甲」地區的布希曼人，仰賴稱作「曼傑提樹」的果實為重要熱量來源。該樹多分布於南部非洲，適宜高溫、少雨的環境。曼傑提樹結果實的時間始於雨季結束時，但由於此時草叢較高、野生動物出沒頻繁，因此採收通常在\
    \ 6 月開始，直到旱季結束。\n\n• 書名：原始富足：布希曼族的生存之道，以及他們能教給我們什麼？"
