- id: doc_113_新北_江翠_自然_g8s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '2024 年9 月5 日早上，國道1 號北上260.4 公里現場掉落10 多桶氫氧化鉀在中央分隔島，其中2 桶掉落外側車道，被1 部自小客車撞擊導致洩漏。氫氧化鉀有強烈腐蝕性，溶於水放出大量熱，吸入後強烈刺激呼吸道或造成灼傷，皮膚和眼直接接觸可引起灼傷，口服會灼傷消化道。

    下列敘述何者正確？'
  options:
  - label: A
    content: 鈉與鉀同週期，所以氫氧化鈉也有強烈腐蝕性
  - label: B
    content: 鈉與鉀同族，所以氫氧化鈉也有強烈腐蝕性
  - label: C
    content: 鉀與鎂同族，所以氫氧化鎂，溶於水也會放出大量熱
  - label: D
    content: 鉀與鋁同族，所以氫氧化鋁，溶於水也會放出大量熱
- id: doc_113_新北_江翠_自然_g8s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 加熱披薩的過程所對應的熱傳播方式如下。甲:煙囪及磚窯口要保持通風，讓煙霧排出。乙:柴火與儲存在磚窯內壁裡的熱加熱披薩。丙:高溫的磚窯底部可創造酥脆餅皮。請選出正確的對應敘述。
  options:
  - label: A
    content: 甲為傳導；乙為對流；丙為輻射
  - label: B
    content: 甲為傳導；乙為輻射；丙為對流
  - label: C
    content: 甲為對流；乙為輻射；丙為傳導
  - label: D
    content: 甲為輻射；乙、丙皆為對流
  group_stem: 傳統的窯烤披薩是用柴火當作熱源，在磚窯內將木柴點燃後，要保持煙囪及磚窯口的通風，以利煙霧排出。磚窯內部會不斷吸收柴火燃燒放出的熱能，待溫度足夠後將披薩放入窯內，柴火和儲存在磚窯內壁裡的熱就會開始加熱披薩了。除此之外，由於磚窯底部會直接接觸到披薩的緣故，如此一來便可以創造出餅皮酥脆的口感喔！請回答下列07
    和08 問題：
