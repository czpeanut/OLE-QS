- id: doc_113_新北_江翠_自然_g8s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 孔雀魚的飼養要有適當的水溫與水質，適宜孔雀魚生活的水溫為攝氏22 到26 度之間，水中的酸鹼pH 值在pH6.5 到pH7.5 之間，水質硬度要求為10
    到15 度左右。常用的水質檢測試紙，可以檢測酸鹼pH 值和硬度外，也可以檢測鐵、銅、鋅、錳、氯、汞、鉛…等等。請問畫底線的元素，有幾種是金屬元素？
  options:
  - label: A
    content: '1'
  - label: B
    content: '2'
  - label: C
    content: '6'
  - label: D
    content: '7'
- id: doc_113_新北_江翠_自然_g8s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: "承上題，液晶體溫度計是以含化學物料的液晶片製成，此等物料在不同溫度下呈現不同顏色，藉此可顯示溫度，可用於探測魚缸的水溫。攝氏22 度為藍色、24\
    \ 度為綠色、26 度為黃色、28 度為紅色。\n      檸檬酸（分子式：$C_{6}H_{8}O_{7}$），檸檬酸溶解於水中，溶液的溫度明顯下降。將20\
    \ 克檸檬酸加入攝氏26 度水60 克，在燒杯中溶解，用液晶體溫度計測量溫度，不可能是下列哪一種顏色。"
  options:
  - label: A
    content: 藍色
  - label: B
    content: 綠色
  - label: C
    content: 黃色
  - label: D
    content: 紅色
  group_stem: （第 1 題）孔雀魚的飼養要有適當的水溫與水質，適宜孔雀魚生活的水溫為攝氏22 到26 度之間，水中的酸鹼pH 值在pH6.5 到pH7.5
    之間，水質硬度要求為10 到15 度左右。常用的水質檢測試紙，可以檢測酸鹼pH 值和硬度外，也可以檢測鐵、銅、鋅、錳、氯、汞、鉛…等等。請問畫底線的元素，有幾種是金屬元素？
- id: doc_113_新北_江翠_自然_g8s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 在室溫攝氏26 度時，將20 克檸檬酸放入60 克水中，充分攪拌後，配製成水溶液，則在此過程中，檸檬酸分子的下列何種性質會改變？
  options:
  - label: A
    content: 分子的大小
  - label: B
    content: 分子中的原子數目
  - label: C
    content: 分子的總數目
  - label: D
    content: 分子間的距離
- id: doc_113_新北_江翠_自然_g8s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 每當節慶時，可以欣賞到繽紛絢爛的煙火，若我們看到一個以黃色和綠色構成的煙火，試推斷煙火的火藥中可能含有哪些元素呢？
  options:
  - label: A
    content: 鈉和硼
  - label: B
    content: 鈣和鈉
  - label: C
    content: 鈣和銫
  - label: D
    content: 鋰和硼
  group_stem: '觀賞節慶或活動施放的煙火時，光彩奪目的煙火總讓人捨不得移開視線，你知道這些顏色是怎麼產生的嗎？

    在煙火中加入含有不同元素的物質，會讓火焰的顏色產生改變。舉例來說，鈣的化合物在燃燒時會發出橙紅色火焰；鈉的化合物在燃燒時會發出橙黃色火焰，煙火即是利用這個方法製造出五光十色的視覺效果。

    除了煙火的應用外，科學家碰到未知的物質時，也會透過焰色反應來初步判斷物質可能含有哪些元素。請回答下列04 和05問題：'
  shared_asset: g1_4_5
- id: doc_113_新北_江翠_自然_g8s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 鈉和硼除了可用燃燒時的火焰顏色來區分，還可如何區分呢？
  options:
  - label: A
    content: 常溫下硼為液態，鈉為固態
  - label: B
    content: 鈉具有延性，硼則無
  - label: C
    content: 硼較鈉容易導熱
  - label: D
    content: 硼具有展性，鈉則無
  group_stem: '觀賞節慶或活動施放的煙火時，光彩奪目的煙火總讓人捨不得移開視線，你知道這些顏色是怎麼產生的嗎？

    在煙火中加入含有不同元素的物質，會讓火焰的顏色產生改變。舉例來說，鈣的化合物在燃燒時會發出橙紅色火焰；鈉的化合物在燃燒時會發出橙黃色火焰，煙火即是利用這個方法製造出五光十色的視覺效果。

    除了煙火的應用外，科學家碰到未知的物質時，也會透過焰色反應來初步判斷物質可能含有哪些元素。請回答下列04 和05問題：'
