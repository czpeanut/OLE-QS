    content: 在自然界中，多倍體的動物比植物更常見
  group_stem: "※無｢籽｣之談\n    「吞下西瓜籽的話，西瓜會從肚臍長出來喔！」不知道大家小時候有沒有被父母這樣嚇唬過？雖然說這多半是教導我們吃水果時不要狼吞虎嚥，不過現在這種話大概已經沒辦法繼續唬小孩子了，畢竟市場上已經有不少「無籽水果」，自然也不用擔心會吞下種子了，這些沒有種子的水果是怎麼栽培出來的呢？\n\
    \    一般而言，生物的染色體數量以雙套（2n）為主，也就是「雙倍體」，但自然界偶爾會出現三、四甚至更多套染色體的突變個體，稱為「多倍體」。多倍體物種因為染色體數量增加，所以他們的遺傳性狀會變得更多樣化，但也有一個顯而易見的缺點：因為減數分裂的機制，多倍體的配子會因為染色體數量，造成配對上產生紊亂，而難以進行有性生殖；由於植物比起動物能進行有效率的無性生殖，相比之下多倍體植物更加常見，其中奇數套多倍體植物往往不能生成種子，這種特性引起植物育種學家的好奇並進行相關研究，而其中最知名的成果，就屬於近代所培育出來的「無籽西瓜」。\n\
    \    在20 世紀初，日本京都大學科學家木原均，將「秋水仙素」噴灑在西瓜幼苗上，這種化學物質能夠使細胞分裂發生異常，造成染色體無法分離從而產生「四倍體」（4n），之後他的研究團隊突發奇想，利用普通雙倍體的雄花，對四倍體的雌花進行人工授粉，得到具有三倍染色體的種子，也就是「三倍體」（3n），這些種子仍能正常成長並結果，不過三倍體西瓜的種子無法正常發育，最後變成果肉中一粒粒白色細嫩的「秕」。俗稱的「無籽西瓜」也就因此而誕生了。"
