- id: doc_113_高雄_左營_自然_g7s2e1_s2_34
  section: 2
  number: 34
  type: single
  page: 4
  stem: 關於母系遺傳的敘述，下列何者正確?
  options:
  - label: A
    content: 遵守孟德爾遺傳定律
  - label: B
    content: 其遺傳方式是利用顯隱性來辨別的
  - label: C
    content: 粒線體與葉綠體在減數分裂時不會發生染色體分離，會全部集中在同一個卵子中提供給下一代，故稱為母系遺傳
  - label: D
    content: 粒線體與葉綠體中的DNA 和酵素系統，能獨立進行複製，稱為母系遺傳。
  group_stem: "※靠｢媽｣的母系遺傳\n    在真核細胞中，除了細胞核作為細胞生命的主宰，因其中含有大量遺傳物質之外，還有兩種胞器:粒線體和葉綠體，也同樣具有自己特殊的DNA\
    \ 和酵素系統，可以獨立進行複製，產生特定的蛋白質，因此被稱為半自主胞器。\n    更特別的是，在很多生物中，這兩種胞器是以母系遺傳的方式傳給下一代。母系遺傳是指帶有遺傳物質的胞器由卵提供，而來自父親粒線體和葉綠體的遺傳物質，並不會傳給子代。正因為如此，母系遺傳代表這些基因並不會在有性生殖時發生重組，遺傳學家可以更容易藉由DNA\
    \ 的相似性來追溯物種的祖先，而對生物的演化或是族群的分布歷程提供有利的證據。\n    母系遺傳的特性:只有女性會遺傳該DNA 給下一代，而男性不會，因此，可由此追溯母系族譜，母系遺傳在科學上最著名的例子是｢粒線體夏娃｣，即科學家藉由現存人類的粒線體DNA\
    \ 回推比對，能追溯到最早的女性。｢粒線體夏娃｣這位最早的母親，生存於十七萬年前的非洲，該女性的每一代的後代皆有女性子孫傳承，因此可以由女兒回推母親，母親再回推外祖母的方式，找到粒線體夏娃。"
