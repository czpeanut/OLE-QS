  - label: D
    content: 形成兩個子細胞。
  group_stem: "※破解細胞分裂的秘密\n    在細胞進行細胞分裂與減數分裂時，須將複製好的染色體分開，過程中需要許多調控機制配合，才能確保染色體正確的分離到子細胞中。\n\
    \    透過研究細胞的分裂過程，國立清華大學的研究團隊發現，細胞內的特殊蛋白質會和特定酵素一起作用，在特定酵素剪斷複製染色體的過程中，特殊蛋白質會負責確認酵素有剪斷所有的\
    \ DNA，整個工作才算完成；如果沒有特殊蛋白質幫忙，複製染色體很容易在尚未完全剪斷前就被迫分離，造成 DNA 損傷，損傷的 DNA 容易產生錯誤的蛋白質，因此帶有損傷\
    \ DNA 的細胞最後很可能成為癌細胞，所以研究細胞分裂的機制，有助於找出細胞癌化的重要原因。\n    目前研究已進展到動物實驗階段，未來有機會利用研究成果製作新藥物，治癒細胞分裂發生異常的疾病，例如\
    \ B 型肝炎。"
