  section: 1
  number: 14
  type: single
  page: 2
  stem: 14.位於南投縣仁愛鄉的霧社水庫從1957年啟用至今，因為上游嚴重的泥沙淤積，導致蓄水量逐年下降，最大滿水量從14860萬噸，到現在只剩下3750萬噸，淤積量高達75%，讓人相當擔心水庫量能，恐只剩下十年的使用壽命。請問：若要解決臺灣水庫淤積嚴重問題，其治本之道應為下列何者？
  options:
  - label: A
    content: 在水庫上游蓋攔沙壩
  - label: B
    content: 投入大量經費清淤泥
  - label: C
    content: 在河川下游建攔河堰
  - label: D
    content: 做好集水區水土保持。
  group_stem: '◎台灣本該是全球降雨量最多的地區之一—台灣北部和中部屬副熱帶季風氣候，南部屬熱帶季風氣候。夏秋兩季常有颱風，也有季風。這裏常下雨，以至於地鐵站和企業都會放置雨傘供人借用。但2021年發生了一件不尋常的事：沒有颱風登陸，而且很少下雨。這使台灣陷入56年來最嚴重的乾旱。許多水庫的蓄水量不到20%，有些水庫的水位甚至低於10%。

    全球最高端的晶片約有90%在台灣生產。這些晶片對呼吸機和智能手機等各種產品至關重要，而新冠疫情使其需求高漲，供應緊張。美國現在擔心自己過度依賴包括台灣在內的海外晶片工廠。晶片行業對台灣的整體經濟貢獻很大，但需大量的水來清洗晶圓。為確保供水，台灣政府去年停止了對7.4萬多公頃農田的灌溉。台灣政府還每周兩天暫停對三個市縣居民和企業供水，這包括台灣最大的城市之一台中。

    台灣的水價為每噸11元新台幣（0.39美元；0.27英鎊），在被調查的35個國家和地區中排名第二，是韓國水價的一半，是美國水價的四分之一，英國的六分之一。台灣水利署表示：「出於經濟社會發展和社會資源公平性的考量，目前還在仔細評估，暫時沒有成熟的調整方案。」節錄自〈2021/04/21
    BBC NEWS台灣缺水為何吸引了全世界關注，這次到底有多嚴重？〉'
  tags:
