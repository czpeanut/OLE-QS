  group_stem: '◎為了迎接2025年的到來，同學們紛紛規劃不同的旅遊計畫，假期結束後熱烈地討論彼此的行程。請回答第19~20題：

    小傑：我和朋友去臺北欣賞101跨年煙火秀，雖然臺北飄著細雨，但是大家還是很熱情倒數跨年。

    奇犽：我和家人上阿里山迎接新年的日出，看著太陽從玉山群峰躍起，大家高聲互道「新年快樂」。

    雷歐力：我和媽媽回屏東娘家參加「2025歌舞昇屏High歌之夜」。

