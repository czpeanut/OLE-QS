    YouTuber 不算「音樂人」，但更像是「創作者」

    大多數人可能只知道WebTVAsia 就像是個「網紅經紀公司」，旗下有很多知名「YouTuber」，像是打敗「蔡阿嘎」率先在台灣衝破200 萬訂閱的「這群人」、最快達到100
    萬訂閱的「聖結石」以及許多年輕人耳熟能詳的「Gino 脖子」、「小玉」、「Joeman」、「魚乾」等。

    「網紅」是近年從中國流行到台灣的詞彙，通常是指某個人因為外貌或才藝或特殊事件在網路上爆紅，有意或無意受到網路世界的追捧，成為「網絡紅人」。又因為時下影音製作、傳播的普及，YouTube
    幾乎成了網紅中的網紅。

    張捷惟進一步解釋，他認為這些YouTuber 比較像是「內容創作者」，他強調，當年的藝人，不太會突然就紅了，但又突然消失、被取代，也就是說，如果不想被取代，那就得要努力，要不斷的創新，要隨著時間不斷的學習、再進步，而這也是WebTVAsia
    核心價值的一部分。

    台灣的「網紅」有什麼的優勢？

    張捷惟說，2015 年來台灣的時候他就發現，台灣有很多很棒的創作者，但大多是自己做自己的，沒有更多的支持和合作機會。沒想到，才一年多WebTVAsia 台灣的成績就不輸泰國，變成泰國反而在跟台灣學習。

    而在馬來西亞出生，在台灣、新加坡都工作過，如今集團遍及亞洲各國的張捷惟更毫不諱言地說，從創作者的角度來看，台灣是創作者的天堂，「台灣人可以比較開放，能很自然地發表意見、說自己的想法。」他還指出，尤其因為台灣多年來，都是一個非常歡迎外來內容的國家，也就是說，台灣除了自己本土的東西強，對外來文化接受度也高，當台灣可以接受美國、接受馬來西亞又接受日本的文化，台灣的內容就會顯得更國際化、更多元。

    不過，張捷惟有點惋惜地說道，「只是我現在最希望的是，台灣主流媒體也願意接受他們。」

    YouTuber 和主流媒體的「瑜亮情結」

    在張捷惟的想像中，「最好的雙贏」就是主流媒體的公司、藝人都願意和新媒體的YouTuber 多交流，互相影響下找出新舊媒體之間的平衡點，「那樣的內容，才是未來的內容」。

    而這一切，似乎正呼應著採訪一開始張捷惟提到的，他二十年前的論文結論：「不能只當創作者，而是要弄一個聚集優秀創作者的平台。」這麼多年了，他從來不是只想做音樂又天真的想賺大錢。但張捷惟依然熱愛音樂，喜歡娛樂圈，只是二十年後，他親手打造了一個自己的「YouTuber
    王國」。

    ──節選自THE NEW LEANS〈做音樂不見得能賺大錢，但搞平台可以〉'
