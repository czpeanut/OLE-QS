- id: doc_113_高雄_左營_國文_g7s2e1_s2_17
  section: 2
  number: 17
  type: single
  page: 2
  stem: 關於漢字的敘述，下列何者正確？
  options:
  - label: A
    content: 根據人們推測，東漢學者許慎為第一個整理文字的人
  - label: B
    content: 會意和形聲是文字構造中字形可以分析的合體，稱為「字」
  - label: C
    content: 根據造字法則，指事字通常會以簡單的符號表示抽象的「物」
  - label: D
    content: 《鐵雲藏龜》為中國最早依部首編排的字典，所收字體以小篆為主
- id: doc_113_高雄_左營_國文_g7s2e1_s2_18
  section: 2
  number: 18
  type: single
  page: 2
  stem: 同學們在下課聊天時，以自身對作者們的認識進行描述，請問下列描述何者正確？
  options:
  - label: A
    content: 李白天才洋溢，充滿想像力，善用誇飾、譬喻來表現熱烈奔放的思想，人稱他「詩魔」
  - label: B
    content: 杜甫的詩作忠實反映時代的苦難與社會的困頓，故被稱為「詩史」，後世尊稱他「詩聖」
  - label: C
    content: 王維對佛理有很深刻體會，表現在山水田園詩中，意境悠遠而富有禪意，被譽為「詩仙」
  - label: D
    content: 蓉子從第一本散文集青鳥集出版後創作不輟，被文壇譽為「永遠的青鳥」，文風溫婉敦厚
- id: doc_113_高雄_左營_國文_g7s2e1_s2_19
  section: 2
  number: 19
  type: single
  page: 2
  stem: 「讀書時，須細看古人處一事，接一物，是如何思量？如何氣象？及自己處世接物時，又細心將古人比擬。設若古人當此，其措置之法，當是如何？我自己任性為之，又當如何？然後自己過錯始見，古人道理始出。斷不可以古人之書，與自己處世接物為兩事。」（引自《左宗棠全集》）關於本文的說明，下列何者最恰當？
  options:
  - label: A
    content: 「如何氣象」其意是思索今人當前所處的環境氛圍
  - label: B
    content: 「我自己任性為之」意謂今人比古人更加不受拘束
  - label: C
    content: 期許以古人處世的標準，評斷自身舉措是否合宜
  - label: D
    content: 本文認為讀書應活用，不應拘泥於古人的看法
- id: doc_113_高雄_左營_國文_g7s2e1_s2_20
  section: 2
  number: 20
  type: single
  page: 2
  stem: 「形聲字」是由「形符」與「聲符」所組成，形符表示事物類別，聲符表示字音。下列地名，何者皆屬於形聲字？
  options:
  - label: A
    content: 頭份
  - label: B
    content: 烏日
  - label: C
    content: 苗栗
  - label: D
    content: 新社
- id: doc_113_高雄_左營_國文_g7s2e1_s2_21
  section: 2
  number: 21
  type: single
  page: 3
  stem: 「              。所以，我們寧願放掉功課而選擇看漫畫、滑手機，因後者帶來的快樂往往是立即的。此外，開心時大腦會分泌多巴胺，讓人容易重複相同的行為，難怪我們會不斷看漫畫、滑手機，直到考試時間逼近，才開始熬夜抱佛腳。」根據文意脈絡，劃線處填入下列何者最恰當？
  options:
  - label: A
    content: 距離考試越近，讀書的效果越好
  - label: B
    content: 人類等待報酬的時間越短，動力越強
  - label: C
    content: 時間越晚，大腦分泌的多巴胺越多
  - label: D
    content: 重複相同行為的次數越多，人們越快樂
- id: doc_113_高雄_左營_國文_g7s2e1_s2_22
  section: 2
  number: 22
  type: single
  page: 3
  stem: 「詠物詩」是以描寫客觀的「物」為主題的詩，下列新詩內容所描述的對象，何者最為恰當？
  options:
  - label: A
    content: 爆竹：「無悔的痛燒自己／直至／淌下最後一滴熱淚／冷死的心／完全無法復燃」
  - label: B
    content: 郵票：「一張嬌小的綠色魔氈／你能夠日飛千里／你的乘客是沉重的戀愛／和寬厚的友誼」
  - label: C
    content: 蘭花：「攀過來／附過去／處處都是春天／辦公桌上／我小聲的告訴你／這就是永遠不老的／秘密」
  - label: D
    content: 蠟燭：「夜，點亮一路檀香／拱手作揖，在宇宙的櫥窗／釀造美麗的灰燼，收割／漆黑的孤獨與寂寞，然後／暢飲，未央的繽紛」
- id: doc_113_高雄_左營_國文_g7s2e1_s2_23
  section: 2
  number: 23
