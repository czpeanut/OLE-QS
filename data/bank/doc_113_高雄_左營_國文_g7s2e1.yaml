- id: doc_113_高雄_左營_國文_g7s2e1_s2_12
  section: 2
  number: 12
  type: single
  page: 2
  stem: 關於〈早發白帝城〉一詩的分析，下列敘述何者正確？
  options:
  - label: A
    content: 詩作首句作者即利用描寫「彩雲間」的美麗景致，來反襯與好友辭別的依依不捨心情
  - label: B
    content: 次句「千里」與「一日」形成強烈對比，以迅捷的船速反映作者遇赦返還的愉快心情
  - label: C
    content: 末句以「輕舟」的飛快對比「萬重山」的凝重，寓景於情，來襯托內心的歡喜與糾結
  - label: D
    content: 其寫作技巧先抒發內心情感，後再運用視覺、嗅覺、聽覺等摹寫技巧來寫白帝城景色
  lesson_raw:
    title: 早發白帝城
    basis: 題幹提到〈早發白帝城〉
- id: doc_113_高雄_左營_國文_g7s2e1_s2_13
  section: 2
  number: 13
  type: single
  page: 2
  stem: 關於〈山居秋暝〉一詩的分析，下列敘述何者正確？
  options:
  - label: A
    content: 「空山新雨後，天氣晚來秋」指白天的山林因下雨而如秋天的天氣般寒涼
  - label: B
    content: 「明月松間照，清泉石上流」藉運用觸覺摹寫，呈現「詩中有畫」的效果
  - label: C
    content: 「竹喧歸浣女，蓮動下漁舟」以人物的活動的熱鬧景象，襯托山林的靜謐
  - label: D
    content: 「隨意春芳歇，王孫自可留」傳達出作者渴望任官、為百姓謀福祉的心願
  lesson_raw:
    title: 山居秋暝
    basis: 題幹提到〈山居秋暝〉
- id: doc_113_高雄_左營_國文_g7s2e1_s2_14
  section: 2
  number: 14
  type: single
  page: 2
  stem: 關於〈聞官軍收河南河北〉一詩的分析，下列敘述何者錯誤？
  options:
  - label: A
    content: 首聯點名題目，描寫作者飽經戰亂，忽然聽到捷報，喜極而泣的心情
  - label: B
    content: 頷聯中以連續動作「卻看」、「漫卷」表現狂喜，同時也為還鄉做鋪陳
  - label: C
    content: 頸聯以「白日」、「青春」來烘托歡愉的氣氛，並點出準備返鄉的想法
  - label: D
    content: 尾聯連用四個地名，暗示此行將充滿險阻，帶著發憤圖強的心情出發
  lesson_raw:
    title: 聞官軍收河南河北
    basis: 題幹提到〈聞官軍收河南河北〉
- id: doc_113_高雄_左營_國文_g7s2e1_s2_15
  section: 2
  number: 15
  type: single
  page: 2
  stem: 下列關於傅佩榮〈四種讀書的方法〉的說明，請選出敘述正確者？
  options:
  - label: A
    content: 所謂「略讀」的做法是對於非本行的書，挑選章節閱讀，以增廣見聞
  - label: B
    content: 「真正的唸書是重讀」講的是反覆讀一本書，才能確實牢記精華內容
  - label: C
    content: 「默讀」著重安靜唸書以追求無我境界，因爲安靜才能獲得心靈感悟
  - label: D
    content: 作者指的「精讀」，是希望讀者能利用歸納重點的方法，來突破書中觀點
  lesson_raw:
    title: 四種讀書的方法
    basis: 題幹提到傅佩榮〈四種讀書的方法〉
- id: doc_113_高雄_左營_國文_g7s2e1_s2_16
