- id: doc_111_桃園_中興_社會_公民_g8s2e2_s2_23
  section: 2
  number: 23
  type: single
  page: 3
  stem: 根據上文所述，關於跟蹤騷擾防制法的說明，下列敘述何者正確？
  options:
  - label: A
    content: 此法律是屬於民事法規
  - label: B
    content: 跟騷行為若發生在生效日之前，則無法依此法處罰
  - label: C
    content: 此法律是由立法院公布
  - label: D
    content: 此法律是由司法院制定
  group_stem: "(題組一)\n    警政署統計，臺灣每年約8 千件跟騷案件，若將私下隱忍未報警案件也納入統計，顯示跟蹤騷擾犯行已不是少數 個案。2021\
    \ 年底，跟蹤騷擾防制法三讀通過，新法將於公布後6 個月生效。\n    根據條文，「跟蹤騷擾」行為定義為：對特定人反覆或持續違反其意願，且與「性或性別」有關的八類行為，包括監視觀察、不當追求、尾隨接近、寄送物品、歧視貶抑、妨害名譽、通訊騷擾、冒用個資等行為，造成被害人心生畏怖，足以影響其日常生活或社會活動。若因宗教、種族、身分地位等的跟蹤騷擾行為，則不適用該法。\n\
    \    為保護被害人安全，將跟蹤騷擾入罪化，有關跟騷防制流程及罰則大致如下：\n| 違反跟騷防制的罰則 | 跟騷防制流程 |\n| --- | --- |\n\
    | 跟蹤騷擾：1 年以下有期徒刑、併科10 萬元以下罰金。<br>攜帶凶器：5 年以下有期徒刑、併科50 萬元以下罰金。<br>違反保護令：3 年以下有期徒刑、併科30\
    \ 萬元以下罰金。 | 被害人報案<br>↓<br>警察調查後，核發書面告誡<br>↓ 2 年內再犯<br>法院核發保護令 |\n（資料來源：改寫自「跟蹤騷擾防制法」三讀，8\
    \ 類跟騷最重判5 年，聯合新聞網，2021/11/20。）"
