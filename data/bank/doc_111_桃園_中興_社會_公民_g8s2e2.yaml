  group_stem: "(題組二)\n    大學生毅鈞一時興起，在未經欣晴同意情況下，輸入其帳號、密碼，退選欣晴的選課，欣晴發現後向學校反應，學校報警後才發現，竟然只是同學間的惡作劇。雖然情況不嚴重，但檢察官偵查終結，仍以「妨害電腦使用罪」起訴毅鈞。\n\
    \    毅鈞的行為已觸犯刑法的兩種犯罪行為。首先，輸入欣晴的帳號密碼，入侵其電腦，觸犯刑法第358 條入侵電腦或相關設備罪；將欣晴已經選好的課退選，導致欣晴選課權益受損，則觸犯刑法第359\
