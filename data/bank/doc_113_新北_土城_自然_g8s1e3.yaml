  group_stem: '（３）原子的活潑程度與外圍的電子數量有關，當外圍電子滿足特定條件時，原子就會變得相當穩定；反之，若外圍電子不滿足條件，原子會因為想送出或接收電子而與其他原子進行反應。已知第18
