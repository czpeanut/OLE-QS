  section: 2
  number: 31
  type: single
  page: 3
  stem: 若此圖是由於溫度過高而導致彎曲的雙金屬片，則關於圖中箭頭所指的單側金屬片膨脹效果，下列敘述何者正確？[5-4 習作]
  options:
  - label: A
    content: 該側金屬片膨脹效果較好，因此加熱容易收縮
  - label: B
    content: 該側金屬片膨脹效果較好，因此加熱容易膨脹
  - label: C
    content: 該側金屬片膨脹效果較差，因此加熱不易膨脹
  - label: D
    content: 條件不足，無法判斷。
  group_stem: "（１）熱動式斷電器是一種利用熱脹冷縮原理來自動控制電路開關的裝置，常用於電器設備中，防止因過熱而引發電路損壞或火災。當電器運行時，電流會通過導線和元件，產生熱能。如果電流過大或電器過載，將會導致溫度過高，斷電器內的雙金屬片受熱膨脹，彎曲變形，進而切斷電路，如右圖所示。而當溫度降低後，雙金屬片恢復原狀，電路重新接通。\n\
    \  生活中的應用如快煮壺，當水煮沸後，壺內的雙金屬片受熱變形，自動斷電。吹風機在長時間使用導致機內溫度過高時，斷電器也會自動斷電，防止過熱損壞。"
  shared_asset: g2_31_32
