  type: single
  page: 1
  stem: '請問下述報導事件發生的背景因素，與印度社會何種觀念最有相關？

    【美聯社報導】

    2018 年9 月，一名印度父親因不滿女兒和賤民階級的男子私奔、結婚，竟花 1000 萬盧比（約新台幣440萬元）僱用刺客，在懷有身孕的女兒面前，將其殘忍殺害。報導更指出父親曾警告女兒說：「寧可把妳嫁給高種姓乞丐，也不可能讓妳跟賤民在一起。」'
  options:
  - label: A
    content: 以牙還牙的報復原則心態
  - label: B
    content: 傳統宗教帶來的階級劃分
  - label: C
    content: 佛教教義所謂的因果報應
  - label: D
    content: 教派分裂所產生不同宗教。
