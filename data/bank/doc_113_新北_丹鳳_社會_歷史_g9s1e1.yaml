  type: single
  page: 1
  stem: '下列是世界重要宗教的分布區域與教義主張圖表，請問：表格中的甲、乙、丙依序應是哪些宗教？

    | 宗教信仰 | 分布區域 | 教義主張 |

    | :--- | :--- | :--- |

    | 甲 | 41%在中東北非、44%在美洲 | 一神信仰 上帝的選民 |

    | 乙 | 99%以上在亞洲 | 眾生平等 超脫輪迴 |

    | 丙 | 95%在印度 | 因果輪迴 階級制度 |'
