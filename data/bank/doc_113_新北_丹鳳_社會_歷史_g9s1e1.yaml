  stem: 金庸的著名小說《倚天屠龍記》中有一個重要的角色張無忌，張無忌曾帶領明教與天下武林講和，率領百姓揭竿起義，抵抗蒙古的統治，而明教信徒崇拜聖火，追求光明，據說是來自於一個可以追溯到上古的宗教。請問：明教的來源最有可能是下列哪一個宗教信仰？
  options:
  - label: A
    content: 希伯來的猶太教
  - label: B
    content: 印度的婆羅門教
  - label: C
    content: 埃及的多神信仰
  - label: D
    content: 波斯的祆教。
