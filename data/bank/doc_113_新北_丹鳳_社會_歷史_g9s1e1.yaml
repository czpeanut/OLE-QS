  section: 1
  number: 29
  type: single
  page: 2
  stem: 《後漢書．西域傳》曾經敘述「大秦」的政治局勢：「常使一人持囊隨王車，人有言事者，即以書投囊中，……。各有官曹文書。置三十六將，皆會議國事。其王無有常人，皆簡立賢者。【翻譯：「（國王）身旁有一個使者手持袋子，有意見可以投書。…國王的人選並沒有固定，會選擇有賢能的人擔任。另外有其他的官員，會一起討論國事。」】請問根據上述資料，我們該如何推測文中「大秦」的政治概況？
  options:
  - label: A
    content: 國王選賢舉能體現雅典的民主政治
  - label: B
    content: 國王中包含曾制定法典的漢摩拉比
  - label: C
    content: 國王以神權統治自稱為太陽神之子
  - label: D
    content: 國王應為元老院所推舉的共和領袖。
