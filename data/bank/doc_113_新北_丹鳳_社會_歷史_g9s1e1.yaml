- id: doc_113_新北_丹鳳_社會_歷史_g9s1e1_s1_21
  section: 1
  number: 21
  type: single
  page: 1
  stem: "下列是兩份西方古代的重要法典內容，請依據相關敘述，選出正確選項。\n法典一： 任何人如犯偽證罪，將自匹安岩上扔下山。\n         任何人不能將尚未定罪的人，置於死地。\n\
    法典二： 若貴族毀傷另一個貴族的眼睛，則他們(法官)\n         應該毀傷他的眼睛。若自由民毀損任何自由\n         民之子之眼，則應毀其眼。"
  options:
  - label: A
    content: 法典一用拉丁文寫成，法典二則用象形文字寫成
  - label: B
    content: 法典一的編訂時代較早，法典二頒布的時代較晚
  - label: C
    content: 法典一強調法律之前人人平等，法典二注重報復
  - label: D
    content: 法典一與法典二的觀念都為現今歐洲法律所採用。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 歷史
      code: 1-1
      title: 西亞古文明
      chapter: 第1章 西亞與非洲的古文明
    textbook: 九上歷史 1-1 西亞古文明
    labeled_by: ai
- id: doc_113_新北_丹鳳_社會_歷史_g9s1e1_s1_22
  section: 1
  number: 22
  type: single
  page: 1
  stem: 歷史學者許倬雲曾談論某個古文明：「這一完整的格局，沒有可以修正與適應的餘地，所有的刺激都只能來自外面的挑戰……挑戰力量強大，則改變得十分徹底，甚至使原來的主體消失不見。」這個古文明曾受波斯帝國、亞歷山大帝國、羅馬帝國的挑戰而喪失政治的獨立性，又受到基督教、伊斯蘭教的影響而喪失了文化的主體性。請問，今日我們還能透過下列何種建築來瞭解這個古文明的原始面貌？
  options:
  - label: A
    content: 擁有巨大且莊嚴佛陀像的石窟
  - label: B
    content: 內部畫著《死者之書》的金字塔
  - label: C
    content: 讓許多角鬥士流血拼命的競技場
  - label: D
    content: 用於祭拜多位神明的帕德嫩神廟。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 歷史
      code: 1-2
      title: 埃及古文明
      chapter: 第1章 西亞與非洲的古文明
    textbook: 九上歷史 1-2 埃及古文明
    labeled_by: ai
