  page: 1
  stem: 歷史老師在課堂上放了一首歌，歌詞節錄如下：「古巴比倫王頒布了《漢摩拉比法典》，刻在黑色的玄武岩，距今已經三千七百多年，……祭神、神殿、征戰、弓箭，是從前的誰……思念像底格里斯河般蔓延。」請問：此地區通行的文字是下列何者？
  options:
  - label: A
    content: 象形文字
  - label: B
    content: 拉丁文字
  - label: C
    content: 楔形文字
  - label: D
    content: 希臘文字。
