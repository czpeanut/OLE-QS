  group_stem: "■|閱讀完干寶〈隋侯珠〉，作答第31～32 題。\n    隋縣溠水側，有斷蛇丘。隋侯出行，見大蛇，被傷中斷，疑其靈異，使人以藥封之，蛇乃能走，因號其處「斷蛇丘」。歲餘，蛇銜明珠以報之。珠盈徑寸，純白，而夜有光，明如月之照，可以燭室。故謂之「隋侯珠」，亦曰「靈蛇珠」，又曰「明月珠」。\n\
