  group_stem: "■|閱讀完劉克襄〈魅力無窮的兵仔市場〉節選，作答第36～38 題。\n    凡軍隊長年集聚或駐紮的都會鄉鎮，往往形成一個大市集。這種地方有個奇特的名稱，叫兵仔市場。\n\
    \    它和傳統市場有何差異呢？這還得看位置。地點允當了，常常會撞擊出意想不到的火花。若尋常了，就跟後者沒兩樣。臺灣便有好幾個熱鬧的兵仔市場，諸如左營、永康等地。以陸軍官校知名的鳳山，更是全台最大的所在。\n\
    \    初次去鳳山，我未帶指南，不知此一兵仔市場的存在。反而是走出車站，胡亂闖逛時，不小心遭逢的。\n    沿著曹公路信步，滿街蕭索，十來分鐘的荒涼後，到了光遠路，才覺得接近這個城市的心臟，整個空間和氛圍都加速了蹦跳。光遠路、維新路和中山路在這裡，奇妙地構成一個三角形地帶，成為鳳山最繁華熱鬧的區域，南邊一角即兵仔市場。\n\
    \    一個新都會多半以方正的棋盤街道出現，絕不擘劃成三角形空間，造成交通壅塞的紛亂動線。何以本地竟如此狀態？\n    原來，這裡是老舊的城區，一個清朝末年遺留下來的古城格局。街衢隨河道呈現不規則的形狀，後來演變成今日的尷尬。古蹟建築、傳統市集和商家百貨都在此集聚，所有的新路到了此，好像迷失方向般，變得歪七扭八。\n\
    \    兵仔市場跟一般菜市場最根本的差異，在於軍人充斥。往昔，這兒一大早便看到，部隊來的採買者，大批發似的進貨。除了蔬果，還兼及軍需品的各種補給。\n \
    \   這樣龐大的購物量，常刺激周圍，帶動人潮，形成豐富而物美價廉的生活圈。毫無怪乎，每到選舉，此地就成為兵家必爭之地。菜市場裡的人，便這麼自豪地說，「至少來一下，沒來，一點機會都沒有。」\n\
    \    它到底是何來歷，如何形成的呢？這個三角地帶，大致上是由四個階段慢慢演化而成的。清末時，市集屬於流動攤販形式，日出而集，日入而息。當時有菜市、魚市、鴨市、柴市、米市各據一方，傳統市場的雛型已然具備。\n\
    \    到了日治時期，交通和環境衛生整頓後，出現了公有市場的型態。國民政府來台後，附近設置許多軍事基地。營區官兵就近，以此為採買地點。此地貨色齊全，價格便宜，愈來愈吸引消費人口，商家也絡繹不絕，連馬路兩旁都被佔用，終而形成全台聞名的兵仔市場。\n\
    \    十幾年前，這座以軍人為主顧的兵仔市場，風光一陣後，隨著市容整頓有了些微的改變。軍需品和攤販減少了，但傳統已經形成，人潮還是不減。蔬果供應繼續在熱鬧的中山路、成功路上，維持過去的繁華，最後連接到第二市場。\n\
