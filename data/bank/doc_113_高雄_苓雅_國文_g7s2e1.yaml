  options:
  - label: A
    content: 利用許多結構相似的句法，如：「像夏日的小河、冬天的落葉，像春花，也像秋草，似無所見，又非視而不見」，可增強文章語勢、深化情感
  - label: B
    content: 「屋頂上的雨水滴落下來，卻理直氣壯的在簷下匯成一道水流」，「理直氣壯」是誇飾的手法，表現出雨勢磅礡
  - label: C
    content: 「紙船」象徵母親對子女無私、毫不保留的愛
  - label: D
    content: 「曹操的戰艦－－首尾相連」巧妙使用典故，畫龍點睛表達紙船列隊的壯觀。
