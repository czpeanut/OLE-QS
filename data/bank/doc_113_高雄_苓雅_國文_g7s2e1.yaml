- id: doc_113_高雄_苓雅_國文_g7s2e1_s4_33
  section: 4
  number: 33
  type: single
  page: 5
  stem: 作者提到「我深深的懂那一句『夠了』」，這個「夠了」代表的意思是下列何者？
  options:
  - label: A
    content: 在歷經臺灣隊許多敗戰後，能夠奪下世界第一的僥倖
  - label: B
    content: 不滿球員能力、素質參差不齊
  - label: C
    content: 不爽、不甘心總有人等著冷眼唱衰的怨嘆
  - label: D
    content: 觀賞球賽後，壓力釋放，跳脫勝負執著的滿足感。
  group_stem: "■|閱讀下篇網路改寫文章後，請回答第33～35 題。\n    西班牙很頑強，可以感受到全場鄉親都默默散發出緊張的磁場，林子偉的全壘打被判界外沒收的時候，全場從歡呼到哀嚎，再到屏住呼吸，看完那個打席保送之後的歡呼，我應該會一直記著。\n\
    \    那種一起承擔輸贏的心情。\n    一種我們、一種We are、還有一種獻出心臟的緊張感。\n    其實一開始不太清楚那種難以言喻不斷湧上的緊張感從何而來，中年之後大部分的情感是厭離與淡然，而且臺灣棒球在多次的自毀式破壞之後，能夠重建這樣的環境（還有綜藝嘉年華等級的啦啦隊），已經是一種不可多求的福份，所以大部分看比賽的時候，即便是12\
    \ 強，我都沒有那麼緊張。\n    我還牢牢記得12 強，當我們確定擊敗日本拿到冠軍之後，有位阿伯默默走到陽台抽了一根菸，然後說「夠了」。我深深的懂那一句「夠了」。\n\
    \    我們看過無數次的被血洗、被打爆、被逆轉，看過喜歡的球隊解散，看過陳金鋒受傷蹲在打擊區，看過輸了不該輸的球賽，看過真心支持的球員收錢打假球辜負了球迷，看過無數的差一點點的不甘心飲恨，然後棒球之神塞一顆內角速球給陳傑憲，然後全壘打，然後冠軍了？\n\
    \    棒球真的「夠了」。應該是真心沒有遺憾的「夠了」才對。\n    但是當第一場對上被西班牙打爆之後，那種「夠了」消失了，取而代之是一種不能輸的緊張感，而且這一次的緊張十分陌生，我才發現原來這一次的比賽，我們的身份已經是個「衛冕者」了。\n\
    \    很多人還很不習慣臺灣是個「衛冕者」，也有很多人等著看衰臺灣這個「衛冕者」，我的緊張不是害怕輸球，而是害怕有人等著用「衛冕者」這個頭銜來傷害臺灣的棒球。\n\
    \    像是「剛剛搭好的神壇崩潰的有點快」、「問總統新的500 塊鈔票還要印嗎？」\n    對比賽的緊張還有對勝負的執著，因為這些攻擊而通通回來了。這種緊張的根源是一種不爽，跟不想看到真愛受傷難過的擔憂。\n\
    \    我本來以為只有我，但臺灣球迷居多散發著這種不爽。\n    一種我們、一種We are 的不爽。\n    西班牙是個可敬畏的對手，這位我很陌生的野手連續失誤流淚時，我在歡呼的瞬間感受到他的不甘心，一種強烈的、經常發生在我們身上的不甘心，這種不甘心是跨越國界共同的情感。\n\
    \    一種我們、一種We are 的不甘心。\n    就像日本球迷跟臺灣球迷約好在WBC 的賽場再次一決勝負一樣，我也想跟西班牙的棒球迷約好再次一決勝負。因為我們都是愛棒球的人，不是唱衰者。\n\
    \    一種我們、一種We are 的真愛。\n    棒球是我人生中少見的真愛吧，我想。"
