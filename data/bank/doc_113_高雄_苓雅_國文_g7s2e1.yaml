    \ 三角形地帶也像一個果實的核心。更奇的是，很少一個舊城包裹得如此完整。從城市外頭看，旅人難以察覺，一如我的到來。但苛刻地說，儘管外表密覆著完好的果肉，裡面卻是潰爛的。只是這潰爛充滿生機，好像也惟有如此敗壞，才能發芽。\n\
    \    這裡也是鳳山市最迷人的地方。那外冷內熱，若不走進去，根本難以感受，也嗅不到真正的南方氣息。我從中間的三民路切入，便是一路興奮。只見到處髒亂忙碌，洋溢著強勁的粗獷活力。\n\
    \    眼前彷彿是一鍋熱騰騰的濃湯，不停地滾開。那人潮的驚人熱絡，猶如每天在廟會節慶。尤其是早上九點前，當市府的人還沒來吹笛趕攤時，各地湧來的果農菜販聚集在這裡。他們不斷地出入，運補貨品。還有小吃攤沿著巷弄比鄰而立。每天都讓這裡熱鬧非凡，形成一團失序的吵雜。"
