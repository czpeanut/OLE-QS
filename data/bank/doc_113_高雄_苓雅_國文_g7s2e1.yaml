    \    於是，尼可拉斯的心臟救活了一名十五歲的少年，肝臟救活了十九歲的少女，兩枚腎臟救助了兩名兒童，眼角膜讓兩名盲人重獲光明，胰臟細胞治癒了一名糖尿病患者。這些人，當然全是義大利人。\n\
    \    格林夫婦的義舉震撼了整個義大利。除了無數來自個人、民間團體、媒體和政府的感激頌揚之外，最強有力的反應，是器官捐贈的行為忽然成倍成倍地增加了。像漣漪擴散一般，從義大利，從美國，這個動人的事跡流傳到全世界，改變了許多人對器官捐贈的保守觀念，更改變了許多罹患不治之症，亟需救助的病人的命運。這個現象，媒體稱之為「尼可拉斯效應」。\n\
    \    尼可拉斯的爸爸媽媽，從下了那個決定開始，就繼續不斷地為他做了許多事情：除了器官，還捐出原為他將來上大學的基金，設立一個全國性的才智兒童獎學金。他們倆抑制著自己最深沉的悲痛，接受無數媒體訪問，不厭其煩地一遍又一遍陳述自己這樁行為的理念，並且一再重回義大利那處傷心地，處理源源而來的後事──這一切，無非是為了要把「尼可拉斯效應」無止境地推展下去。\n\
    \    《尼可拉斯效應：一個男孩送給世間的禮物》，正是尼可拉斯的爸爸瑞格‧格林寫的書。曾經做過新聞記者的父親，藉著自己所熟習的文字，親密對話般地展現了他在媒體上難以流露的心底深處的情懷。書中有幾頁尼可拉斯、他的親人，以及器官捐贈受惠者的照片，最可愛而又令我不忍看的一幀，是葬禮上尼可拉斯五歲的妹妹，舉起手中的玩具兔兔，輕輕為媽媽擦拭臉上的淚水……\n\
    \    喪失子女的傷痛，除非身臨其境，否則永難體會，但旁人當能理解這對父母親的至愛，表現在如此苦心護持亡兒的「永生」──尼可拉斯肉體的一部分活在七名義大利人身上，他的名字和事跡活在無數人心裡，並將永存在一些醫學和人文的典籍中。他可愛的笑臉，會比許多徒然追求「不朽」的所謂偉人的容貌更令人難忘。格林夫婦選擇了用這樣高貴的方式來愛他、紀念他，然而對於絕大多數的父母親來說，這樣的選擇還是太艱難了。\n\
    \    「孩子的鐘塔」矗立在一片寬闊的草地上，那是尼可拉斯生前常來玩的地方。上面的一百四十口小鐘來自義大利各地的家庭、教會、學校，向尼可拉斯的父母親致意。中間一口名廠特鑄、被教皇祝福過的大鐘，鐫刻了尼可拉斯和七名受惠者的姓名。鐘塔下滿置著花束、小汽車、玩具熊、零錢……顯然許多來訪的人，都準備了一份送給七歲男孩的小禮物。\n\
    \    在小鐘如鈴般輕巧的聲響中，我想著南邊的聖地牙哥，也曾有過一個男孩，捐出他一雙美麗的眼睛──那兩名因他而重獲光明的人，在世上某個地方，心中可會偶然響起細細的、如孩子笑聲般的鐘聲呢？"
