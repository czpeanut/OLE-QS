- id: doc_113_台中_向上_國文_g9s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 1
  stem: 在行文說話時，經常把文字的形體、意義加以分析，就形成了析字的藝術，如「六經蘊藉胸中久，一劍十年磨在手」，將「六」字下面加上一個「一」、一個「十」，合為「辛」字。下列何者沒有使用這個技巧寫成？
  options:
  - label: A
    content: 半夜生孩，亥子二時難定；百年匹配，己酉兩姓相當
  - label: B
    content: 人過大佛寺，寺佛大過人；僧遊雲隱寺，寺隱雲遊僧
