  type: single
  page: 4
  stem: 關於插花，《瓶花譜》與《瓶史》兩文相同的觀點為何？
  options:
  - label: A
    content: 瓶身宜瘦巧，瓶高與瓶口相稱
  - label: B
    content: 枝葉任其自然，不可人為加工
  - label: C
    content: 樹枝須曲斜，否則如墓門華表
  - label: D
    content: 用兩種以上花材，應高低搭配。
  group_stem: "(四) 閱讀以下文章，並回答 39～40 題\n【甲】\n插花不可太繁，亦不可太瘦，多不過二種三種，高低疏密，如畫苑布置，方妙。置瓶忌一律，忌以繩束縛。夫花之所謂整齊者，正以參差不倫，意態天然，如子瞻之文，隨意斷續，青蓮之詩，不拘對偶，此真整齊也。若夫枝葉相當，紅白相配，此省曹墀下1樹，墓門華表2也，惡得為整齊哉！\n\
    \                                          ——《瓶史》\n 1.省曹墀下：官署的臺階旁。墀，音ㄔˊ，臺階上的平地。2.墓門華表：豎立在墳墓前的大柱。\n\
    【乙】\n大率插花須要花與瓶稱，令花稍高於瓶。假如瓶高一尺，花出瓶口一尺三四寸，瓶高六七寸，花出瓶口八九寸，乃佳。忌太高，太高瓶易仆；忌太低，太低雅趣失。\n\
    小瓶插花，宜瘦巧，不宜繁雜。若止插一枝，須擇枝柯奇古，屈曲斜裊者。欲插二種，須分高下合插，儼若一枝天生者；或兩枝彼此各向，先湊簇像生，用麻絲縛定插之。\n\
    ——《瓶花譜》"
