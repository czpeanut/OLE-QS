  group_stem: '賽局理論(Game Theory)，由數學家馮紐曼(John Von Neumann)和經濟學者摩根斯坦(Oskar Morgenstern)合著《賽局理論與經濟行為》中提出，主要在敘述兩個以上具有利益衝突的個體，彼此運用策略得到自己最好結果的過程。

    雖然賽局理論訴諸複雜的數學，但其實核心概念很簡單，當我們在做選擇的時候，我們的決定會影響他人的最終決定；相同的，他人的決定也會影響我們的最終決定。在思考的時候，       ，這就是賽局理論的精髓。               ——改寫自哈伊姆《賽局思考》'
