  group_stem: "(二) 閱讀以下文章，並回答33～35 題\n宋人有酤①酒者，升概甚平②，遇客甚謹，為酒甚美，懸幟甚高，然貯而不售，酒酸。怪其故，問其所知閭長者楊倩，倩曰：「汝狗猛邪？」曰：「狗猛，則酒何故而不售？」曰：「人畏焉。或令孺子懷錢挈壺罋而往酤③，而狗迓④而齕⑤之，此酒所以酸而不售也。」\n\
    夫國亦有狗。有道之士懷其術而欲以明萬乘之主，大臣為猛狗迓而齕之。此人主之所以為蔽，而有道之士所以不用也。\n                       \
    \     節錄自《韓非子．外儲說右上》\n【注釋】：①酤：賣。②升概甚平：買賣公平。升概：裝酒的器具，此處指量器。③酤：買。④迓：迎接。⑤齕：用牙齒咬。"
