- id: doc_113_台中_向上_國文_g9s1e3_s2_30
  section: 2
  number: 30
  type: single
  page: 2
  stem: 依據本文，下列說明何者正確？
  options:
  - label: A
    content: 宋人聘貓是為了保護莊稼，唐人聘貓是為了保護書籍
  - label: B
    content: 宋徽宗喜歡以「貓和蝶」入畫，取其「長壽」之寓意
  - label: C
    content: 明朝由於皇帝愛貓，皇宮內的貓皆納入編制、享俸祿
  - label: D
    content: 古人與貓咪簽訂「貓兒契」，旨在祈求貓咪認新主、忘舊主。
  group_stem: "(一) 閱讀以下文章，並回答30～32 題\n古代貓奴知多少？\n    宋代《埤雅》中記載：「鼠害苗，而貓能捕鼠，去苗之害，故貓字從苗。」貓對於古人來說，如英雄一般地保護了莊稼。唐朝時，貓漸漸成了貴族階級般的寵物，從各處進獻的貢品中也有貓。鼠患不只危害人類的糧食、建築，連書籍也難逃其害，對於文人來說無疑是巨大威脅。因此，文人們開始養貓護書，並將這類的行為稱之為「聘貓」。就像是要聘娶別人家的女兒一樣，必須先奉上聘禮，如果要養的是家貓，就得給原主人送鹽、糖等物品；養野貓的話，則要給貓媽媽送一串小魚或鹽巴。宋代大詩人陸游就是個貓奴，他在《贈貓》一詩中寫道：「裹鹽迎得小狸奴，盡護山房萬卷書。慚愧家貧策勛薄，寒無氈坐食無魚。」「狸奴」是宋人對貓的別稱，從此詩可看出宋代人對貓非常虔誠。北宋的汴京城有專門的寵物市場，到了南宋時還出現了類似於現代寵物美容的服務。宋人也愛以貓入畫，宋徽宗就非常喜歡以「貓和蝶」爲主題作畫，因爲貓音似「耄」，蝶音同「耋」，寓意良好。\n\
    \    明朝時，貓已經是宮裡王公大臣們的寵兒了，還有貓被皇帝封了「管事」職銜，每月和大臣們一起領工資，不過它們的工資是小魚乾。明仁宗有一次畫了七隻不同的貓，心血來潮還叫旁邊的大臣題寫跋文；明宣宗認真治國，最大的樂趣就是擼貓跟畫貓，他一生中畫的「貓畫」無數，行徑相當於現在幫貓咪建粉專、天天上傳照片的那種貓奴吧；明世宗不只在皇宮養「三千佳貓」，當愛貓「霜眉」過世時，還命人準備了金棺下葬、叫文官寫祭文超度，堪稱重度貓奴。\n\
    \    到了清朝，出現一本《貓苑》，內容從種類、毛色、故事、形相等七個方面寫貓，可以說是一本關於貓的百科全書，更確立了貓已經變成寵物的事實。清朝人要迎接貓回家，還得選擇一個良辰吉時，舉辦一場「納貓禮」。黃漢編著的《貓苑》就記載了收編貓咪的完整儀式：首先將貓裝在桶子裡，外層用布袋蓋上，並從原主人家討一雙筷子，和貓放在一起(因爲上面有熟悉的氣味)，連桶帶貓一起扛回家；除此之外，新主人還要和貓咪簽訂「貓兒契」，上面寫著：「東王公證見南不去」、「西王母證知北不遊」。\n\
    \    正式養貓之後，替貓命名也是件重要大事，古人會根據貓身上的顏色、花紋來命名，且都非常文藝優雅，像白肚白足的黑貓叫「烏雲蓋雪」、四足全白的黑貓叫作「〇〇〇〇」，全身黑色尾巴末端白色的叫「〇〇〇〇」。\n\
    \    現在養貓的人越來越多，並戲稱自己為「鏟屎官」。看看古代的貓奴行徑，「鏟屎官」們也覺得不可思議吧!"
