- id: doc_113_台中_向上_國文_g9s1e3_s2_36
  section: 2
  number: 36
  type: single
  page: 3
  stem: 關於上文畫線處說明，何者正確？
  options:
  - label: A
    content: ①描寫狼嗜肉的本性
  - label: B
    content: ②展現屠戶殺狼的意圖
  - label: C
    content: ③刻劃狼與犬的兇狠狡猾
  - label: D
    content: ④說明屠戶引狼入洞的機智。
  group_stem: '(三) 閱讀《蒲松齡‧聊齋誌異》甲、乙二則故事，並回答36～38 題

    【甲】

    有屠人貨肉歸，日已暮。忽一狼來，①瞰擔中肉，似甚垂涎，隨屠步亦步，尾行數里。屠懼，示之以刃，則稍卻；及走，又從之。②屠無計，默念狼所欲者肉，不如姑懸諸樹而蚤取之。遂鉤肉，翹足挂樹間，示以空擔。狼乃止。屠即逕歸。昧爽注1
    往取肉，遙望樹上懸巨物，似人縊死狀，大駭。逡巡注2 近視，則死狼也。仰首細審，見狼口中含肉，肉鉤刺狼齶，如魚吞餌。時狼革價昂，直十餘金，屠小裕焉。緣木求魚，狼則罹之，亦可笑已！

    【乙】

    一屠晚歸，擔中肉盡，止剩骨。途遇兩狼，綴行甚遠。屠懼，投以骨。一狼得骨止，一狼仍從；復投之，後狼止而前狼又至；骨已盡，而兩狼並驅如故。屠大窘，恐前後受其敵。顧野有麥場，場主以薪積其中，苫蔽注3
    成丘。屠乃奔倚其下，弛擔持刀。狼不敢前，眈眈相向。③少時，一狼逕去；其一犬坐於前，久之，目似瞑，意暇甚。屠暴起，以刀劈狼首，又數刀斃之。方欲行，④轉視積薪後，一狼洞其中，意將隧注4
    入以攻其後也。身已半入，露其尾，屠自後斷其股，亦斃之。方悟前狼假寐，蓋以誘敵。狼亦黠矣！而頃刻兩斃，禽獸之變詐幾何哉，止增笑耳！

    (注：1.昧爽：天將曉而尚暗之時。2.逡巡：徘徊不前。3.苫蔽：覆蓋。4.隧：挖洞。)'
