- id: doc_113_台中_向上_國文_g9s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 「鹹最俗而苦最高，常人日不可無鹹，但苦不可兼日，況且苦味要等眾味散盡方才知覺，是味之隱逸者，如晚秋之菊，冬雪之梅；而鹹則最易化舌，入口便覺，看似最尋常不過，但很奇怪，鹹到極致反而是苦，所以尋常之中，往往有最不尋常之處。」關於這段話的解讀，下列何者最接近？
  options:
  - label: A
    content: 提到鹹味為最為俗氣，因最易化舌不可每天食用
  - label: B
    content: 作者認為苦味最為高尚，最先知覺，如同隱逸者
  - label: C
    content: 作者藉此總結尋常事物更值得深入體會其中奧秘
  - label: D
    content: 引申應吃點苦中苦，方能成就尋常中之不尋常人。
