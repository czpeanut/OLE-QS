  stem: 黃蓉與書生比試文才過程中，面對書生的刁難提問，憑藉其過人的機智一一化解，請判讀下列何者說明正確？
  options:
  - label: A
    content: 「有朋自遠方來，不亦樂乎？」――黃蓉表明自己與一燈大師早已是忘年之交
  - label: B
    content: 「聖人吾不得而見之矣！得見君子者，斯可矣。」――提及聖人及君子，譏嘲書生自詡飽讀詩書、允文允武。
  - label: C
    content: 「暮春者，春服既成，冠者五六人，童子六七人，浴乎沂，風乎舞雩，詠而歸。」――黃蓉旁徵博引論證孔子弟子中實有成年者三十人及四十二位少年。
