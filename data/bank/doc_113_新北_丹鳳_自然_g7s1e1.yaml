- id: doc_113_新北_丹鳳_自然_g7s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 請問小明觀察麵包發霉的情況，並記錄下來，是屬於科學方法的哪一項？
  options:
  - label: A
    content: 討論並提出結論
  - label: B
    content: 參考文獻資料
  - label: C
    content: 設計實驗
  - label: D
    content: 整理並分析數據。
  group_stem: '※ 小明買了一塊麵包後，放在客廳桌上數天，結果發現兩天後麵包發霉，上網收集資料後發現，黴菌喜歡生活在溫暖潮濕的地方，梁兄猜測發霉的原因是因為梅姬颱風剛過，最近下雨頻繁，空氣濕度較高，導致麵包容易發霉吧!為了釐清麵包上黴菌生長與水分的關係，依照科學方法進行相關實驗，試回答下列問題：


    | 組別 | 光線 | 環境溼度 | 溫度(℃) | 黴菌生長情形 |

    | :--- | :--- | :--- | :--- | :--- |

    | 甲 | 照光 | 不給水 | 20 | 很少(約 10％) |

    | 乙 | 黑暗 | 不給水 | 20 | 中等(約 30％) |

    | 丙 | 黑暗 | 不給水 | 30 | 中等(約 40％) |

    | 丁 | 照光 | 給適量水 | 20 | 多量(約 60％) |

    | 戊 | 照光 | 給適量水 | 30 | 多量(約 70％) |

    | 庚 | 黑暗 | 給適量水 | 30 | 多量(約 90％) |'
