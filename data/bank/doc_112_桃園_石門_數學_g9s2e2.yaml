- id: doc_112_桃園_石門_數學_g9s2e2_s1_23
  section: 1
  number: 23
  type: single
  page: 4
  stem: '赤壁戰後，曹操逃回許昌，孫吳與蜀漢皆想趁機打倒曹魏，出發前想找一個地點(許昌以外的目的地)打一場友誼戰，模擬攻打許昌的路途，以下是兩方軍師的提議：目的地到建業的距離和許昌到建業的距離要相等，目的地到成都的距離和許昌到成都的距離也要相等，如圖所示。

    周瑜：以建業為圓心，建業到許昌的距離為半徑畫弧，再以成都為圓心，成都到許昌的距離為半徑畫弧，兩弧的交點為目的地。

    諸葛亮：沿著成都、建業連線將地圖對折，在地圖上的許昌戳一個洞，地圖打開後，另一個破洞的點即為目的地。

    請問下列何者正確？'
  options:
  - label: A
    content: 周瑜錯誤，諸葛亮正確
  - label: B
    content: 周瑜正確，諸葛亮錯誤
  - label: C
    content: 兩人皆錯誤
  - label: D
    content: 兩人皆正確。
