  group_stem: '※請閱讀下列文章，並回答問題：

    DNA 是生物體非常重要的遺傳物質，它的結構是由華生和克里克兩位科學家共同發現的。他們於《自然》（Nature）期刊上發表DNA 為雙股螺旋結構的論文，認為DNA
    就像是一把規律扭轉的螺旋梯子，兩側的扶手是由去氧核糖與磷酸根兩種化學物質組成，而中間的階梯則是由四種含氮鹼基配對而成。DNA 結構的發現讓科學家了解遺傳物質是如何代代被傳遞下來，DNA
    作為遺傳密碼的載體之角色被確立。此研究被認為是20 世紀最重要的科學發現，兩人也共同獲頒1962 年諾貝爾生理醫學獎。'
  answer:
  - C
  answer_source: answer_key_vlm
