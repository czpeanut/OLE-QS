- id: doc_113_高雄_獅甲_社會_公民_g7s1e3_s1_46
  section: 1
  number: 46
  type: single
  page: 2
  stem: 根據會議記錄內容，下列對於甲、乙、丙、丁的敘述，何者正確？
  options:
  - label: A
    content: 甲是提案
  - label: B
    content: 乙是附議
  - label: C
    content: 丙是秩序問題
  - label: D
    content: 丁是權宜問題
  group_stem: '★題組：秀知院學園的文化祭（校慶園遊會）稱為「奉心祭」，該活動的實行委員會準備召開籌備會議。會議當天出席的人有子安學姊、小野寺同學、田中同學、小林同學、佐藤同學，以及代表學生會出席的石上同學、伊井野同學；原本應該出席的學生會書記藤原同學請病假。以下是其中一段開會的實況紀錄，已知該次會議皆依照《會議規範》的原則進行。根據此開會實況紀錄，回答
    46-50 題：


    子  安：好——的！現在進入討論事項囉！目前沒有人在會議之前提交其他可以討論的意見，所以接下來我們按照例行會議的議程，討論奉心祭的標語。現在有誰要提出_甲_嗎？

    小野寺：(舉手)

    子  安：小野寺同學請說。

    小野寺：我提議「就很青春咩～」。這種任性的感覺很適合我們秀知院。

    子  安：哇！聽起來很有活力呢。有人要_乙_嗎？

    （現場有兩個人舉手。原本正在會議室後方打鬧的田中、小林、佐藤，此時剛好打破會議室窗戶）

    石  上：(舉手)

    子  安：石上同學，怎麼了？

    石  上：我提出_丙_，他們三個太吵了，等他們安靜下來我們再開會吧。

    子  安：了解。嘿！你們三個，再不安靜下來，就只能請你們離席了喔( •̀ω•́ )

    （三人不再吵鬧，並開始收拾殘局。接下來，大家陸續依規定提出『就蔗樣ㄛ』、『傳達燃燒的心意』、『Heart to Heart』等想法。）

    子  安：大家想法真是豐富啊，太棒了。我們馬上來表決吧！

    伊井野：(舉手)

    子  安：伊井野同學，怎麼了嗎？

    伊井野：我提出_丁_，這些提議應該要先討論過才能表決吧？

