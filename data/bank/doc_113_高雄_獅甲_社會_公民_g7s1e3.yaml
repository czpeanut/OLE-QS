  stem: 為了讓學生能達成有效學習與其他相關目的，政府制定明確的規範來保障學生在校園生活的權利，因此教師對學生的輔導管教措施也應多所斟酌，以免侵害學生權益。下列教師的班級經營或者對學生的輔導管教措施，何者沒有侵害學生的權益？
  options:
  - label: A
    content: 教師可以對犯錯的學生施以輕微的體罰措施，只要學生不受傷即可
  - label: B
    content: 若發生班級內竊案，教師可以自行搜索全班書包以尋找失竊的財物
  - label: C
    content: 若學生上課寫別科作業，教師可以將該份作業當場沒收，不予歸還
  - label: D
    content: 若學生上課吵鬧且屢勸不聽，教師可以請他帶著課本到學務處罰站
