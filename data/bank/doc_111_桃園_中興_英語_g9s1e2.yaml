  - label: B
    content: a bookseller
  - label: C
    content: a writer
  - label: D
    content: a shoemaker
  group_stem: 'Hans Christian Andersen

    One of the world’s greatest storytellers, Hans Christian Andersen was born on
    April 2, 1805, in Denmark. He was the son of a poor shoemaker. After his father’s
    death, he traveled to Copenhagen to try out for the theater. He hoped to become
    an actor, but his real talent was for writing and he first became known for his
    poetry. He also wrote plays, novels and travel books, but while many of these
    are now almost unknown outside Denmark, his fairy tales are famous around the
    world.

    His first collection of fairy tales, Tales Told for Children, was published in
    1835 and included such favorites as The Tinderbox and The Princess and the Pea.
    His most famous fairy tales, however, are The Ugly Duckling, The Snow Queen and
    The Little Mermaid. There probably isn’t a child in the world who hasn’t read
    at least one of these, or had it read to them.

    Shortly before his death, in August 1875, he was asked what music he would like
    played at his funeral. “It should be in time with little steps, “he said, “because
    most of the people at my funeral will be children.”

    There is a statue of the Little Mermaid in Copenhagen Harbor. It was put there
    because the Danish are very proud of their most famous writer.'
