  group_stem: 'Good afternoon, ladies and gentlemen. Many people think that it is
    difficult to learn English; so, they don’t like it. (21) , I think it is a very
    interesting subject. I’ve enjoyed learning English since I was a child. My mom
    always tells me,” (22) If you really want something, you must try hard to get
    it.” That’s why she pushed me so hard. When I was in third-grade, my teacher encouraged
    me to enter as many English storytelling contests as possible. I was (23) in front
    of people, so I almost forgot what I had to say. As soon as I left from the stage,
    the only thing that I thought was that I failed. I didn’t feel down at that time,
    but kept that experience in mind so that I could always encourage myself to be
    better.

    I realized(明瞭) that no matter what the results(結果) are, I should at least (24)
    and learn from it. If you don’t try, you will never know who you really are.'
