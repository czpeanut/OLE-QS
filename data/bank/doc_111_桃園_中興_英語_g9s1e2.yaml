  group_stem: 'The Wilsons decided to go overseas for a vacation. They had a family
    meeting to plan the vacation.

    “ First, Mr. Wilson said, “ we should decide where we want to go.” “I don’t agree,’
    Mrs. Wilson said. “I think we should decide when we want to go first. We don’t
    want to go to some countries when they’re cold.”

    Mr. Wilson agreed, so the family’s first decision was when to go on a vacation.
    They decided to go in July, when it’s warm throughout the northern hemisphere.

    “ Now we can decide where to go,’ Mr. Wilson said. “But, Dad,’ Ben said, “don’t
    you think that where we go depends on how we go? If we plan to fly, we can go
    a long way. If we plan to drive, we can’t go as far.”

    Again Mr. Wilson agreed, and they discussed this. At last, they agreed to travel
    by plane. Then Mr. WIison said, “Now, where do we want to go?”

    “Actually, Dad,” Trudy said,” I think we should work out how many days vacation
    we’ll have before we can decide where to go.”

    And so the meeting went on. The next day, one of Mr. Wilson’s friends at work
    asked, “Have you planned your vacation yet? We’ve decided when we want to go,
    how long we can go for, how we want to get there and how much money we can spend,
    “Mr. Wilson took him, “but we still haven’t decided where we’re going!”

