  group_stem: 'The Chinese say, “ If you’re bitten by a snake once, you’ll be scared
    by a rope for ten years.” I have my own experience of this.

    It (25) one night. I was cooking dinner, and at that moment, I really needed to
    go to the bathroom. Without turning the gas off, I quickly went to the bathroom.
    When I finished, I couldn’t open the door. “ I can’t get out!” I shouted. I became
    worried that I (26) in a fire!

    “ No!” I kicked the door hard but it didn’t move an inch. I turned around and
    saw hope. I hurried over to the window and pushed it really hard. (27) I just
    couldn’t open it. I would have to break it. I started hitting it with the hardest
    thing I could find — a trash can.

    With a loud “BANG,” the window broke. “ I’m safe!” I took in the fresh air happily.
    (28) , the cold wind woke me from my joy. I was on the tenth floor and there was
    no way to get down! I kept shouting for help. Luckily, someone heard me and called
    119.

    Since then, I’ve never closed the door when I use my bathroom. (109 會考補考）

