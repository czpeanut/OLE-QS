  group_stem: 'THE SOUTHEND TRAIL is always popular with nature lovers.  The

    120-km trail passes beautiful lakes, crosses rivers, and goes through

    mountains.  This gives bird lovers some of the best places for

    birdwatching.  The trail also takes you to the Southend Museum and to

    two famous castles, Edward Castle and Sloan Castle.

    It’s best to plan one day for one part of the trail and start your hike early

    in the morning because each part takes about seven hours.  If you don’t

    want to walk, you can bike, but make sure you stay on the main trail

    because the side trails are not wide enough for biking.

    There are two styles of lodging for visitors.  Camping is popular in

    summer, but it is only allowed on some campgrounds (see the map).  A

    more comfortable style is to stay at a hotel in one of the towns.  You

    can find some very nice ones with breakfast.

     trail 步道  pass 經過  if 假如  main 主要的  wide 寬的  style 型式  allowed 被允許的'
