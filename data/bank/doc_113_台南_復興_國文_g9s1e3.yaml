  stem: 「對偶修辭」是指文句中兩兩相對、字數相等、句法相似、意義相關的兩個詞組或句子所構成的修辭，如：「黃蘆岸白蘋渡口，綠楊堤紅蓼灘頭」；而「鼎足對」則是指三個互為對偶的句子組成的對聯。第一句可對第二句，第二句可對第三句，第三句也可直接與第一句相對，如：「枯藤、老樹、昏鴉，小橋、流水、人家，古道、西風、瘦馬」。請判斷以下文句，何者為鼎足對？
