  group_stem: '今天晚上在僑光科大上「中國文化導論」，和同學談到了中國以外的其他上古文化，包含發源於兩河流域的巴比倫文化。

    巴比倫文化離我們有多遠？

    巴比倫文化所處的時間、空間距離我們實在太遙遠，這樣的足以叫我們對該文明漠不關心，覺得不關己事，然後去忽略它。

    但我們談到了臺灣作詞家方文山為歌手周杰倫寫了愛在西元前這首歌，這首歌用了許多有關巴比倫文化的典故和名詞，例如：「古巴比倫王頒布了漢摩拉比法典」、「祭司／神殿／征戰／弓箭／是誰的從前」、「經過蘇美女神身邊」、「用楔形文字刻下了永遠」。

    方文山並非巴比倫文化研究專家，只是稍微接觸到有關巴比倫文明的知識，就引發他寫出這首當時大家都朗朗上口的暢銷歌曲。我藉由這個例子鼓勵大家，除了專業以外，我們更應該多去增廣見聞，累積自己的知識，也許在我們專業的工作上用不到這些我們廣博接觸到的知識。我們也不一定會去寫歌或從事文學創作，但知識的累積將可以促進我們思考，增加我們靈感，豐富我們的生命經驗。

    增加自己的知識並且去思考，是培養自己競爭力的不二法門。

    常在課堂上問同學們問題時，有些同學總說不知道或想不出來，說不知道就是我們對解決這個問題的知識有所欠缺，說想不出來則是我們沒有好好思考。在自己的能力及時間限制下，廣博而深入地多接觸這世界所蘊藏的種種知識，就像隨時多帶一些有用的工具在身邊一樣，隨時都能夠派上用場。

    學校的通識課、圖書館、社團、網路都是我們廣博自己知識的方式，我曾說過我希望每個同學能隨時對世界充滿好奇，好奇心會是我們廣博增加自己知識的原動力，當我們知識愈廣博而豐富時，我們在工作或生活上愈能觸類旁通、如魚得水地引發我們的創意或靈感。

    巴比倫文化之於作詞人方文山就是一個很好的例子。

    巴比倫和我們日常生活一點關係都沒有，但它能激起作詞家美好的詩意。據此，我們怎能隨意摒棄自以為跟我們沒有關係、不重要或我們根本不感興趣的知識學問。

    從巴比倫文化開始，讓我們對世界更多了解一點點吧！

    ——節選自《學歷遊戲：學校沒有教的事》'
