- id: doc_113_台南_復興_國文_g9s1e3_s1_42
  section: 1
  number: 42
  type: single
  page: 6
  stem: '晚明文人旅遊風氣很盛，遊必有記，但大部分是「小品」，像張岱的湖心亭賞雪、西湖七月半，袁宏道鑑湖、雨後遊六橋記，都是短程定點旅遊，所記也是很個人的內心抒發——因景而生的末代感傷，恍惚驚愕，繁華夢醒。

    同時代的徐霞客遊記很不一樣，徐霞客花了三十年，足跡遍及大江南南北。他翻山越嶺、過河渡湍，所經歷之人文風俗、景觀異致、地質奇貌、種族宗教……，無不一一記錄，留下三十餘萬字的遊記與資料。

    清人潘耒形容徐霞客：「途窮不憂，行誤不悔，瞑¹則寢樹石之間，飢則啖草木之實，不避風雨，不憚虎狼，不計程期，不求伴侶，以性靈遊，以軀命遊，亙古以來，一人而已。」徐霞客曾在旅途中遭土匪洗劫一空，友死心慟，有人勸他返鄉，他仍堅定的說：「吾荷一鍤來，何處不可埋吾骨耶？」可見他不但有登山客的勇氣，還有探險家的毅力，更有豁達的人生觀。

    ——改寫自謝邦振〈徐霞客穿越古今五百年〉


    📖 1. 瞑：音ㄇㄧㄥˊ，通「眠」。


    根據本文，關於徐霞客遊記與其他晚明文人遊記的比較，下列敘述何者錯誤？'
  options:
  - label: A
    content: 前者為多方探遊記錄，後者多為定點描述
  - label: B
    content: 前者內容常涉險阻，後者內容多就近尋訪
  - label: C
    content: 二者皆為旅遊風氣之下的產物，遊必有記
  - label: D
    content: 二者皆有因景而生、繁華夢醒的末代感傷
