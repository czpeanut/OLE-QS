  stem: '惠州市井寥落，然猶日殺一羊，不敢與仕者爭買，時囑屠者買其脊骨耳。骨間亦有微肉，熟煮熱漉出(自注：不乘熱出，則抱水不乾)，漬酒中，點薄鹽炙微燋食之。終日抉剔，得銖兩於肯綮之間，意甚喜之，如食蟹螯；率數日輒一食，甚覺有補。子由三年食堂庖，所食芻豢，沒齒而不得骨，豈復知此味乎？戲書此紙遺之，雖戲語，實可施用也。然此說行，則眾狗不悅矣。——宋·蘇軾〈與子由書〉


