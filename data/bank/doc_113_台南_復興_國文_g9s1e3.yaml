  stem: 你是否有發現，許多電影的主軸都離不開愛情這兩個字嗎？試問何部電影的敘述最符合本文提及的「羅密歐與茱莉葉效應」？
  options:
  - label: A
    content: 《手札情緣》：諾亞以手札記錄和艾莉的動人愛情故事，每日耐心地對患有阿茲海默症的她訴說兩人年輕相遇時遭受現實阻礙的椎心點滴，期盼喚醒她腦海中的記憶廝守白頭
  - label: B
    content: 《派特的幸福劇本》：在精神病院療養的派特和喪夫的蒂芬妮因為追求成為別人眼中的正常人而相識，他們彼此都在偽裝中活著，也在包容彼此後反而獲得了自己的幸福意義
  - label: C
    content: 《樂來越愛你》：蜜雅懷有演員夢，但每次試鏡總無果而終，在一場派對上認識才華洋溢、愛好爵士樂的賽巴斯丁，兩人互生好感而在一起，卻也因各自追求夢想，互道祝福
  - label: D
    content: 《真愛挑日子》：艾瑪和德克斯特在大學四年期間從未相識，卻在畢業舞會上跳出情愫，兩人的個性、家庭背景、價值觀都是一道道鴻溝，雖曾在一起最終因現實而選擇分離
  group_stem: '元曲四大家之一的鄭光祖所著雜劇可考者有十八種，其中以元代四大愛情劇之一的《倩女離魂》最為著名。《倩女離魂》這部雜劇是改編自唐朝 陳玄祐所著傳奇《離魂記》，內容大意如下：

    張倩女與書生王文舉自小便指腹為婚，但是王文舉的雙親與倩女的父親皆早逝，因而兩人的婚事懸宕未決。

    一日，王文舉在上京趕考前來到了張家，欲與未來的岳母確定自己與倩女的親事，想不到張母卻因王生為白衣秀才而欲悔婚，可是倩女與文舉二人一見鍾情，兩人雖對張母多有埋怨，但礙於禮教卻也無計可施，只好以兄妹相稱。然而就在文舉搭船北上的當晚，倩女隻身一人追到了河岸邊要文舉帶她走。

    三年後，已為官吏的文舉帶著妻子倩女重回張家，欲拜見張母並向其請罪，卻赫然發現張家中竟還有一位病臥繡榻的張倩女。當眾人都摸不清頭緒時，文舉的妻子張倩女走向了臥病在床的張倩女，然後就在眾人的注視下，兩位倩女合而為一。

    原來這是因為倩女實在很喜歡文舉，卻又無法違抗母命，所以深為相思所苦的她才會魂靈離體，一分為二。一個跟著文舉私奔，另一個則留在家中病犯沉痾。

    這部雜劇之所以著名就在於作者寫出了從前為禮教所禁錮的女性，為了追求愛情而不顧一切大膽犯禁的行為。

    另外，若沒有張母的阻擋，文舉與倩女或許無法那麼「順利」的結為夫妻；若沒有張母的刁難，或許倩女與文舉也無法痛下決心，勇敢追愛。兩人的行為其實就像是《戀愛心理學》中所提到的「羅密歐與茱莉葉效應」：比起彼此間毫無障礙的情侶，當戀情有阻擾時，兩人之間的關係更為堅定。

    心理學家多里斯克福（Driscoll）與里佩茲（Lipetz）曾以情侶為對象進行過一項關於戀愛滿意度的調查。結果發現，當雙方家長越是反對兩人的戀情時，當事人彼此對於戀愛的滿意度就越高。由此可知，當戀愛處於越艱難的狀態時，反而越能點燃兩人的愛苗。他們將此結論命名為「羅密歐與茱莉葉效應」。《羅密歐與茱莉葉》是莎士比亞的戲劇之一，內容描述十四世紀義大利的
    Montague 及 Capulet 兩家之間紛爭不斷，然而雙方的子女羅密歐與茱莉葉卻愛上對方，並為了捍衛愛情而努力對抗各種障礙。

    其實，除了西方的名劇外，中國古代戲曲也有許多傳世的傑作，其中也不乏對愛情的描寫，像是崑劇的經典《牡丹亭》。只是，中國的愛情劇並不如西方戲劇那樣，那麼的激情、濃烈。雖然中國戲曲的描寫較西方顯得含蓄些，然而在這深而不露的筆鋒下所隱含的波濤情感反而更能動人心弦。

    ——改寫自〈中國的愛情戲劇：倩女離魂〉'
