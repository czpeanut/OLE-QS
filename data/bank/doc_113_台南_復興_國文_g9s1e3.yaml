- id: doc_113_台南_復興_國文_g9s1e3_s2_45
  section: 2
  number: 45
  type: single
  page: 8
  stem: 根據本文，今年升上九年級的阿復可能會經歷何事？
  options:
  - label: A
    content: 去年曾被隨機抽中，參加每四年施測一次 TIMSS 電腦施測成就測驗
  - label: B
    content: 曾經歷新冠肺炎疫情，因篩檢後出現陽性反應，導致學習成就不佳
  - label: C
    content: 國小時期沒有自然科學實驗課，升上國中後才有機會踏入實驗室
  - label: D
    content: 國中老師實踐 108 課綱的精神，以精熟練習取代運用概念解釋現象
  group_stem: '教育部今天和全球同步，公佈 2023 年國際數學與科學教育成就趨勢調查（TIMSS），臺灣八年級學生的數學和科學都名列全球第二，四年級的數學和科學，則分別排行第二和第三，其中八年級數學、科學排名持平，四年級的數學、科學排名雙雙進步。新加坡在四項的表現都名列第一，臺灣、韓國均分屬各項排行前五名。

    TIMSS 是由 IEA（教育成就評鑑國際學會）、每四年施測一次。臺灣從 1999 年起參加，至今參與第七次。2023 年有五十八個國家參與四年級評比，四十四個國家參加八年級評比。而全台有
    5,308 名小四學生、5,543 名八年級學生被隨機抽樣參加此次測試。本次受測學生均為 108 課綱學生，且在受測期間曾經歷新冠肺炎疫情。

    TIMSS 除了透過電腦施測成就測驗，也同時向學生、老師發放紙本問卷，深入了解學生的學習興趣和態度。根據問卷結果，臺灣學生持續在此次測試成績中創下歷屆最佳的成績，卻普遍「不喜歡」數學學、科學，也「沒自信」學數學、科學。

    研究顯示，臺灣四年級學生每月在自然科學課中至少會做一次實驗，四年級學生普遍喜歡學習科學，但到了八年級每月在自然科學課中至少做一次實驗的百分比降至 65%，加上課程難度提升，影響了學生的學習興趣與自信，出現「學習疏離」情形。「兩週能做一次實驗就不錯了！」在有進度壓力的情況下，老師光課本、習作要上得仔細，就得花掉大半時間。而最大的問題在於不是教完課本、習作，學生就能把會考考好，而是
    108 課綱和會考均強調素養導向，但素養導向需要理解、閱讀能力，學生在有時間壓力的考試中，不可能慢慢解題，除非學生本身具有「精熟」程度，才能看到題目就能馬上作答。

    探究教學確實能引起學生學習興趣，讓「低成就」的學生因為提高學習興趣而進步到「中成就」。但要從「中成就」到「高成就」，除了要有天份，也需要熟練。因此，老師若能採取探究、素養導向的教學方法，先提升學生學習興趣，堅持提問、做實驗、運用概念或證據解釋現象和辯論時，學生的學習信心與成就就會愈高。

    ——改寫自趙宥寧〈翻轉教育：2023 TIMSS 調查出爐 2024-12-05〉'
