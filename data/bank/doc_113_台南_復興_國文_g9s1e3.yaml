  stem: '我們學了多種古典韻文，而這些韻文在寫作格律上皆有其相關要求。下列表格統整，何者正確？


    | 項目 | 古詩 | 近體詩 絕句 | 近體詩 律詩 | 詞 | 曲 |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | (A) 字數 | 四言或六言 | 固定五言 | 固定七言 | 依詞牌規定 | 依曲牌規定 |

    | (B) 對仗 | 第一、二句須對仗 | 無須對仗 | 第二、三聯須對仗 | 依詞牌規定 | 依曲牌規定 |

    | (C) 用韻 | 可換韻 | 一韻到底 | 一韻到底 | 依詞牌規定 可換韻 | 依曲牌規定 不可換韻 |

    | (D) 別稱 | 古體詩 | 今體詩 | 今體詩 | 詩餘、長短句、樂府 | 詞餘、曲子詞、樂府 |'
  options:
  - label: A
    content: 字數
  - label: B
    content: 對仗
  - label: C
    content: 用韻
  - label: D
    content: 別稱
