  stem: 關於兩文，下列敘述何者正確？
  options:
  - label: A
    content: 【甲】文敘事聚焦於作者與朋友騎馬遊春之舉，並脫外衣為戲
  - label: B
    content: 【甲】文寫景著重於對湖邊景物和光影的描寫，展現特殊美感
  - label: C
    content: 【乙】文題為「待月」並以之貫串全文，通篇卻未見「待」字
  - label: D
    content: 【乙】文認為西湖最美的時刻是春天月夜，也是人潮最多之時
  group_stem: '【甲】寒食後雨，予¹曰：「此雨為西湖洗紅²，當急與桃花作別，勿滯也。」午霽³，偕諸友至第三橋。落花積地寸餘，遊人少，翻⁴以為快。忽騎者白紈而過，光晃衣，鮮麗倍常，諸友白其內⁵者皆去表⁶。少倦，臥地上飲，以面受花，多者浮⁷，少者歌，以為樂。偶艇子出花間，呼之，乃寺僧載茶來者。各啜一杯，蕩舟浩歌而返。——選自明·袁宏道〈雨後遊六橋記〉


    【乙】西湖最盛，為春為月。一日之盛，為朝煙，為夕嵐。今歲春雪甚盛，梅花為寒所勒，與杏桃相次開發，尤為奇觀。石簣數為余言：「傅金吾園中梅，張功甫 玉照堂故物也，急往觀之。」余時為桃花所戀，竟不忍去湖上。由斷橋至蘇堤一帶，綠煙紅霧，彌漫二十餘里，歌吹⁸為風，粉汗⁹為雨，羅紈¹⁰之盛，多於堤畔之草，豔冶極矣。然杭人遊湖，止午未申三時，其實湖光染翠之工，山嵐設色之妙，皆在朝日始出，夕舂¹¹未下，始極其濃媚。月景尤不可言，花態柳情，山容水意，別是一種趣味。此樂留與山僧遊客受用，安可為俗士道哉！——節選自明·袁宏道〈晚遊六橋待月記〉


    📖 1. 予：音「ㄩˇ」，我。 2. 洗紅：洗去紅妝，這裡指予打落西湖的花朵。 3. 霽：音「ㄐㄧˋ」，雨後放晴。 4. 翻：反而。 5. 白其內：在內穿著白衣。
    6. 去表：脫去外衣。 7. 浮：罰酒。 8. 歌吹：遊人的歌聲和著吹奏樂聲。 9. 粉汗：仕女們的香汗。 10. 羅紈：穿著羅紈華服的遊人。 11. 夕舂：指夕陽。'
