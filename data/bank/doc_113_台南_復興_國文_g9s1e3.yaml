- id: doc_113_台南_復興_國文_g9s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: '崇禎五年十二月，余住西湖。大雪三日，湖中人鳥聲俱絕。

    是日，更定矣，余拏一小舟，擁毳衣、爐火，獨往湖心亭看雪。霧淞沆碭，天與雲、與山、與水，上下一白。湖上影子，惟長堤一痕，湖心亭一點，與余舟一芥，舟中人兩三粒而已。

    到亭上，有兩人鋪氈對坐，一童子燒酒，爐正沸。見余，大喜曰：「湖中焉得更有此人！」拉余同飲。余強飲三大白而別。問其姓氏，是金陵人客此。

    及下船，舟子喃喃曰：「莫說相公痴，更有痴似相公者！」


    關於上方〈湖心亭看雪〉文內容敘述，下列何者正確？'
  options:
  - label: A
    content: 首段點明受邀看雪的時間、地點、情境
  - label: B
    content: 第二段描述冬夜前往湖心亭賞雪的心得
  - label: C
    content: 第三段描述巧遇金陵故友，暢飲同樂
  - label: D
    content: 末段藉船夫之口，道出作者癡愛山水
  lesson_raw:
    title: 湖心亭看雪
    basis: 題目引述〈湖心亭看雪〉全文
