- id: doc_113_台南_復興_國文_g9s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: '國文課堂上，同學分組合作學習，輪流發表對〈湖心亭看雪〉的文句解讀，何組解讀正確？


    | 組別 | 內容 | 解讀 |

    | :--- | :--- | :--- |

    | (A) | 大雪三日，湖中人鳥聲俱絕 | 以視覺摹寫形容大雪後的西湖 |

    | (B) | 霧淞沆碭，天與雲、與山、與水，上下一白 | 以觸覺摹寫形容天寒地凍之景 |

    | (C) | 惟長堤一痕，湖心亭一點，與余舟一芥，舟中人兩三粒而已 | 藉由量詞表現出景物、人物愈來愈小，寫出視角是由高處俯瞰湖面 |

    | (D) | 見余，大喜曰：「湖中焉得更有此人！」拉余同飲。余強飲三大白而別 | 作者對於兩人的意外闖入感到驚喜，熱情地邀請他們一起飲酒、欣賞雪景 |'
  options:
  - label: A
    content: 大雪三日，湖中人鳥聲俱絕：以視覺摹寫形容大雪後的西湖
  - label: B
    content: 霧淞沆碭，天與雲、與山、與水，上下一白：以觸覺摹寫形容天寒地凍之景
  - label: C
    content: 惟長堤一痕，湖心亭一點，與余舟一芥，舟中人兩三粒而已：藉由量詞表現出景物、人物愈來愈小，寫出視角是由高處俯瞰湖面
  - label: D
    content: 見余，大喜曰：「湖中焉得更有此人！」拉余同飲。余強飲三大白而別：作者對於兩人的意外闖入感到驚喜，熱情地邀請他們一起飲酒、欣賞雪景
