  group_stem: '整個夏天，我都是浸在蟬聲裡度過的。

    城裡的蟬似乎總是孤孤單單，在悶溼的下午偶爾拉那麼一聲長鳴，聊為點綴。山裡的蟬卻是千人大合唱，你啟我應，你唱我和，煞是熱鬧。在那些沒有風沒有雲的日子，蟬聲匯成一道清流，在樹叢
    的綠蔭間流淌。

    想起蟬；就想起蟬的生命。蟬的幼蟲時期非常長，有十幾年的光陰是蟄伏在泥土裡，然後鑽出地面，蛻為蟬，飛上枝頭，化為一首歌，唱出夏之戀。當秋風乍起，桂子飄香，牠們便也悄悄結束了短暫的生命，有如一位盡瘁於舞臺的藝術家。何以蟬必須忍受十幾年無天日的生活，只為了造就一季的輝煌？多麼奇特的成長過程。

    蟬的故事也讓我想起那些有名的音樂家們，如巴哈、貝多芬、舒伯特、韓德爾、莫札特、普西尼等，幾乎都曾經歷過一段黯淡的時光；或出身寒微，或少年坎坷，或身有殘疾，長期掙扎於貧困與潦倒之間。但不幸的命運、惡劣的環境反而驅使他們將全部的生命傾注於藝術的創造，充分發揮出他們的天分與才華。世人往往眩惑於他們所得到的成就與榮譽，卻不了解在這一切的背後，他們曾付出多少辛酸與眼淚？忍受多少孤單與冷落？

    通往成功的路程往往是漫長而艱苦的。神讓我們在困厄中學習信心，在孤單中學習忍耐，我們的生命便趨於圓滿成熟。 ──選自杏林子生之歌蟬的故事'
