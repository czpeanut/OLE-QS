  - label: C
    content: by weight
  - label: D
    content: by numbers
  group_stem: 'A. (1-3)

    Robert collects rocks. He collects big rocks and small rocks. He collects brown
    rocks and green rocks. He collects bumpy rocks and small rocks.

    Robert keeps his rocks in a jar by his bed. The jar is big. Robert can see in
    the jar. He likes to look at all of the rocks he has collected.

    Robert likes to take his rocks out of the jar. He puts the rocks on his bed. Robert
    counts the rocks. He has a lot. He sorts the rocks by color, by shape, and then
    by size. Then Robert puts the rocks back in his jar. He goes outside to collect
    more rocks. So many rocks, so little time!'
