- id: doc_112_高雄_大樹_英語_g8s1e2_s2_13
  section: 2
  number: 13
  type: single
  page: 3
  stem: What is the main idea of the reading?
  options:
  - label: A
    content: People must keep learning.
  - label: B
    content: Robots are better than people.
  - label: C
    content: People are good at making robots.
  - label: D
    content: Robots do everything for everyday life.
  group_stem: '(13～16)

    Are there any jobs for people in the future?

    Our jobs now may never show up in the future.  Robots will take over our life.  What
    can robots do?  In the car factory,

    lots of robots make cars day and night.  They don’t need to take a rest and seldom
    make something wrong.  In the bank, robots

    can answer people’s questions and help them.

    In the military, robots can do dangerous jobs, like driving and bomb cleanup.  They
    can also fly planes and take action.  It

    can protect people from danger.  People may feel safe when being with the robots.  As
    for research robots, they can teach students,

    write and do research.  In the hospital, robots can help doctors and nurses to
    take care of sick people.

    It looks like these robots will take the place of our jobs in the future.  However,
    unlike robots, we people can feel and think.

    Take teachers and writers for example: teachers teach students to think and don’t
    just teach schoolbooks; writers are good at telling

    stories and share interesting stories with readers.

    We people have no idea about the future, but we need to look on the bright side
    of the future.  Just keep learning and

    thinking, and robots will not take our jobs and even we can work together with
    robots.


