- id: doc_113_台中_大甲_自然_g8s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '已知甲烷（$CH_{4}$）和甲醇（$CH_{3}OH$）與足量的氧氣反應，生成物皆為二氧化碳和水，反應式如下：

    反應一 $CH_{4} + 2O_{2} \rightarrow CO_{2} + 2H_{2}O$

    反應二 $2CH_{3}OH + 3O_{2} \rightarrow 2CO_{2} + 4H_{2}O$

    若分別進行此兩種反應，且完全反應後所得到的生成物總質量相同，則關於反應物的比較，下列敘述何者正確？（原子量：$H=1$、$C=12$、$O=16$）'
  options:
  - label: A
    content: 甲烷與甲醇兩者消耗的質量相同
  - label: B
