  group_stem: "Have you ever tried fortune cookies? In fact, they’re not just cookies.\
    \ Let’s learn more about them.\n  It has been a long tradition for the Japanese\
    \ to make cookies with eggs, butter, sugar, and flour. Around the 1900s, they\
    \ began to put little notes in cookies to tell a person’s fortune. Since then,\
    \ they have been a part of the food culture there. With this tradition in mind,\
    \ Makoto Hagiwara started to make fortune cookies in the USA.\n  Before the 1950s,\
    \ bakers often made fortune cookies either with their hands or with chopsticks,\
    \ so it took them a long time to make the cookies. That changed when Shuck Yee,\
    \ a Chinese American, invented a machine to make the cookies faster. This made\
    \ them popular at Chinese restaurants across the USA.\n  Today, many Chinese restaurants\
    \ in the USA serve fortune cookies at the end of a meal. They are well-known not\
    \ for their taste, but for their sayings. Here are some common fortunes:\n1. All\
    \ roads lead to Rome.\n2. Dig your well before you are thirsty.\n3. If you want\
