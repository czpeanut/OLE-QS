- id: doc_113_新北_江翠_數學_g8s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: '八上數學2-2 的課本，提到「當分母為根式時，為了化簡成最簡根式，可設法將分母轉化成整數，這種過程稱為有理化分母。」班上4 位同學接龍練習有理化分母的例題，想化簡式子
    $\frac{3\sqrt{2} + 2}{\sqrt{2} - 1}$，過程如下：

    肖佔  ： 原式$=\frac{(3\sqrt{2} + 2)(\sqrt{2} + 1)}{(\sqrt{2} - 1)(\sqrt{2} + 1)}$

    楊子  ： 上式$= (3\sqrt{2} + 2)(\sqrt{2} + 1)$

    成義  ： 上式$= 6 + 3\sqrt{2} + 2\sqrt{2} + 2$

    路絲  ： 答案$= 13\sqrt{2}$

    以上從哪位同學開始發生了錯誤？  (習 2-2)'
  options:
  - label: A
    content: 肖佔
  - label: B
    content: 楊子
  - label: C
    content: 成義
  - label: D
    content: 路絲
