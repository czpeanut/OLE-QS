  stem: 小吳看書看到一半，60 W 鎢絲燈泡突然壞掉了。小吳趕快買了新的 100 W 鎢絲燈泡回來替換。安裝後發現新的鎢絲燈泡比原先的燈泡亮。下列關於新、舊燈泡的比較，何者最合理？
