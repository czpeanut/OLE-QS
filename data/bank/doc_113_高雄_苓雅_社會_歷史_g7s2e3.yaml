  stem: 請問該份文件簽訂的時代背景，應為下列何者？
  options:
  - label: A
    content: 美國與我國正式斷交，不再維持官方往來
  - label: B
    content: 李登輝繼任為總統後，推動務實外交政策
  - label: C
    content: 中華人民共和國剛獲得聯合國的「中國席位」
  - label: D
    content: 美國將臺灣納入東亞反共防衛體系的一環
  group_stem: '有關美國與我國簽訂的〈臺灣關係法〉部份內容，請閱讀後，回答39-40 題：

    ･表明西太平洋地區的和平及安定符合美國的政治、安全及經濟利益，而且是國際關切的事務。

    ･任何企圖以非和平方式來決定臺灣的前途之舉 --包括使用經濟抵制及禁運手段在內，將被視為對西太平洋地區和平及安定的威脅，而為美國所嚴重關切。

    ･提供防禦性武器給臺灣人民。'
