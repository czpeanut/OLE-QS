  stem: 以下是台灣史上某場運動的訴求：「台灣各族群長期對國語政策的抵抗，更積極維繫自身族群文化，閩南語、客語、原民語的多方開放，才能展開台灣社會多音交響的面貌，我們不願意母語被禁聲，勇敢地掀開口罩吧!」
