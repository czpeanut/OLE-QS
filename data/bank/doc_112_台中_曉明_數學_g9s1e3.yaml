- id: doc_112_台中_曉明_數學_g9s1e3_s1_16
  section: 1
  number: 16
  type: single
  page: 3
  stem: '現解一個二元一次聯立方程式 $\begin{cases} 3x+4y=10 \dots(1) \\ -x+2y=0 \dots(2) \end{cases}$
    的步驟如下：

    步驟一：由(2)$\times 2$ 得 $-2x+4y=0$ ……(3)

    步驟二：由(1)$-$(3)得 $x=10$ ……(4)

