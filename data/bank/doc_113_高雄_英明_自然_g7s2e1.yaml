- id: doc_113_高雄_英明_自然_g7s2e1_s2_11
  section: 2
  number: 11
  type: single
  page: 1
  stem: 有一對夫妻爸爸的血型是A 型，媽媽的血型是B 型，他們已經生育有兩個小孩分別是A 型跟B 型，請問下一胎生出O 型小孩的機率是多少？
