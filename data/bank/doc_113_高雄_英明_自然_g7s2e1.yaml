    content: 這種TAS2R 基因位於X 染色體上
  - label: B
    content: 人類對甜味的敏感程度比對苦味來的高
  - label: C
    content: 對於苦味的厭惡程度，無感味覺者＞一般味覺者＞超級味覺者
  - label: D
