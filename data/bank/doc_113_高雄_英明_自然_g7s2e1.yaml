  group_stem: "閱讀以下文章並回答47-49 題：\n 人類的舌頭上具有酸、甜、苦、鹹等各種味覺接受器，而相對於酸、甜等味覺，人類天生就對苦味的敏感程度較高，這樣可以幫助辨認一些對人體有害的物質，所以覺得苦也算是一種防禦機制。\n\
    \ 心理學家曾經以「超級味覺者」來稱呼對苦味特別敏感的族群，超級味覺者除了味蕾數量是一般人的四倍，也和第七對染色體上的味覺基因TAS2R 有關（這項味覺基因是由成對的遺傳因子所控制，而且其因子的傳遞方式符合孟德爾的遺傳推論）；「超級味覺者」具有成對的顯性遺傳因子，因此使味覺受器更容易接受苦味化合物的刺激而產生苦味和厭惡感；「一般味覺者」具有一個顯性和一個隱性遺傳因子，會產生苦味的感覺但不會厭惡；另外有所謂的「無感味覺者」則具有成對的隱性遺傳因子，對苦味的敏感度很低。"
