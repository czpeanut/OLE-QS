  type: tf
  page: 1
  stem: 小明是學校男籃校隊的隊長，外貌長得高又帥，鄰居都說他跟父親年輕時幾乎一模一樣；由以上的敘述來推測，小明細胞內的染色體應該大部份來自父親。
