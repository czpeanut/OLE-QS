  - label: A
    content: 理論上不會生出O 型小孩
  - label: B
    content: 約有四分之一的機率
  - label: C
    content: 有二分之一的機率
  - label: D
    content: 因為雙親的基因型不明，所以無法判斷
- id: doc_113_高雄_英明_自然_g7s2e1_s2_12
  section: 2
  number: 12
  type: single
  page: 1
  stem: 已知豌豆的紫花遺傳因子A 對白花遺傳因子a 是顯性，如果孟德爾將紫花豌豆和白花豌豆相互授粉，結果發現子代中紫花與白花的比例為63 比61，則下列敘述何者正確？
  options:
  - label: A
    content: 實驗結果子代紫花豌豆的基因型都是AA
  - label: B
    content: 實驗結果子代白花豌豆的基因型都是Aa
  - label: C
    content: 子代的白花碗豆再互相交配，得到的後代應該都是白花
  - label: D
    content: 子代的紫花碗豆再互相交配，得到的後代應該都是紫花
- id: doc_113_高雄_英明_自然_g7s2e1_s2_13
  section: 2
  number: 13
  type: single
  page: 1
  stem: 若A 為雙眼皮基因，a 是單眼皮基因，而眼皮的遺傳現象符合孟德爾的遺傳法則；小丁跟小華是一對單眼皮的雙胞胎兄妹，但是父母都是雙眼皮，則在不考慮突變的情況下，下列敘述何者正確？
  options:
  - label: A
    content: 他們是雙胞胎，所以兩人的其他性狀也應該都一樣
  - label: B
    content: 他們的爸爸媽媽不可能生出單眼皮的小孩，所以應該是養父母
  - label: C
    content: 他們的父母都帶有單眼皮的遺傳因子，而基因型是Aa
  - label: D
    content: 雖然他們是單眼皮，但是如果父母再生弟弟或妹妹就一定會是雙眼皮
