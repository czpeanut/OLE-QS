  stem: 試問在鮭魚的生殖過程中，不會出現下列哪一項過程？
  options:
  - label: A
    content: 細胞分裂
  - label: B
    content: 減數分裂
  - label: C
    content: 細胞內的同源染色體互相分離
  - label: D
    content: 上述過程都會發生
  group_stem: "閱讀以下文章並回答44-46 題：\n 鮭魚是洄游型的魚類，出生在河川上游，小魚苗順著河流遊向大海，發育成熟的鮭魚會游回到出生溪流中繁殖，返回出生地的鮭魚會在河床挖一個淺坑，然後雌魚產卵，雄魚撒下精子完成繁殖的使命；至於鮭魚如何游泳數千公里準確地回到出生地，目前科學家並沒有確實的答案，可能是鮭魚能夠記憶出生地的水質、氣味、溫度或鹽度等特性。1950\
    \ 年美國科學家在某溪流捕撈300 條正在洄游的鮭魚，並將他們分為兩組，一組用棉花球塞住鼻孔，另外一組沒有塞住，再將他們都送回河川下游，結果沒有被塞住的一組全數都順利游回，但是被塞住鼻孔的則有超過四分之一以上無法游回出生地；此研究結果可能提供一些有關鮭魚如何洄游的訊息。"
