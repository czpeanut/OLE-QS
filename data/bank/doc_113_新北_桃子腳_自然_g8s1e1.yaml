  group_stem: '臺灣的空氣汙染主要來源為工廠、發電廠及汽機車排放的廢氣等，這些汙染源所產生的細懸浮微粒又以PM2.5最多，PM2.5代表顆粒直徑在2.5微米之粒子。世界衛生組織訂定若空氣PM2.5濃度超過10微克／立方公尺，會危害民眾身體，美國、臺灣與歐盟將標準分別訂為12、15與20微克／立方公尺。

    臺中火力發電廠是臺灣發電量最大的電廠，它的二氧化碳排放量亦為世界第一，是中部空氣主要的汙染源。臺灣的地形也是惡化臺灣空氣汙染的重要因素，高聳連綿的中央山脈，容易在冬天的時候阻擋東北季風吹散中南部空氣中的細懸浮微粒。據統計，南部地區冬天空氣品質達到不良以上的天數，80天中有76天，另有4天是普通，沒有任何一天是良好；中部地區有37天、北部地區則有12天為不良。'
