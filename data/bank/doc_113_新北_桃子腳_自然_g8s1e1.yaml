- id: doc_113_新北_桃子腳_自然_g8s1e1_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: '品魚在網路上搜尋了「焦糖烤布蕾」的料理步驟如下：

    步驟1：鮮奶油、鮮奶和香草莢醬拌勻，中火煮沸

    步驟2：蛋黃加糖拌勻，慢慢加入步驟1 中，要不停的攪拌，完成布丁液

    步驟3：布丁液過篩兩次，去除氣泡或使用保鮮膜去除，倒入烤盅，深烤盤加約1 公分高熱水，入爐170 度烤40 分鐘，出爐放涼移入冰箱冷藏

    步驟4：食用前表面灑上薄薄一層二砂，用噴槍炙燒至焦糖色，即可享用

    對於上述中步驟三「過篩兩次，去除氣泡」以及步驟四「用噴槍炙燒至焦糖色」的說明，下列何者最合理？'
