- id: doc_113_高雄_五福_自然_g8s1e3_s1_28
  section: 1
  number: 28
  type: single
  page: 4
  stem: '小軒將中性原子內粒子的性質整理如下，其中有不少錯誤，班上同學提出一些修改意見，請判斷哪些同學修改的意見是正確的？


    | 粒子 | 發現者 | 數量關係 | 質量 | 帶電狀況 | 在原子中的位置 |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 電子 | 湯姆森 | 電子數多於質子數 | 很輕 | 帶負電 | 在原子核中 |

    | 質子 | 拉塞福 | 質子數等於電子數 | 很輕 | 帶正電 | 在原子核中 |

    | 中子 | 查兌克 | 質子數等於中子數 | 較重 | 電中性 | 在原子核中 |


    小冬：中子的帶電狀況應該改成「帶正電」，原子核才會帶正電

    小希：電子在原子中的位置應該改成「在原子核外」。

    小楠：中子的數量關係應該改成「質子數皆等於中子數」

    小北：質子的質量應該改成「較重」'
  options:
  - label: A
    content: 小冬、小希
  - label: B
    content: 小北、小希
  - label: C
    content: 小楠、小北、小希
  - label: D
    content: 四位同學都正確。
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 理化
      code: 6-3
      title: 原子結構
      chapter: 第6章 物質的基本結構
