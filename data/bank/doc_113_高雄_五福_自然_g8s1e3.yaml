- id: doc_113_高雄_五福_自然_g8s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: '甲、乙兩個物體的質量、比熱與初溫如下表所示，四位同學預測當甲和乙接觸時會產生什麼現象並解釋原因，請問誰的說法是正確的?


    | 物體 | 質量(g) | 比熱($\text{cal}/\text{g}\cdot{^\circ}\text{C}$) | 初溫(${^\circ}\text{C}$)
    |

    | :--- | :--- | :--- | :--- |

    | 甲 | 10 | 0.6 | 60 |

    | 乙 | 20 | 0.2 | 40 |


    然然：熱能由乙流向甲，因為乙物體比熱小，較甲物體容易降溫

    明明：熱能由甲流向乙，因為甲物體所含熱量比乙物體多

    阿福：熱能由甲流向乙，因為甲物體的溫度比乙物體高

    欣欣：熱能由乙流向甲，因為乙物體的質量比甲物體大'
  options:
  - label: A
    content: 然然
  - label: B
    content: 明明
  - label: C
    content: 阿福
  - label: D
    content: 欣欣
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 理化
      code: 5-3
      title: 比熱
      chapter: 第5章 溫度與熱
    textbook: 八上理化 5-3 比熱
    labeled_by: ai
