  type: single
  page: 2
  stem: '寒帶地區，在冬天時湖水都結成冰了，湖中魚卻仍能在湖底生存，以下解釋何者正確？

    小名：冬天水溫一直下降至0℃，使湖水的密度一直變小，當魚密度大於湖水密度時就可以沉在湖底生存。

    安可：水溫低於4℃時，反而會讓溫度低於4℃的水留在上層，不再產生對流，當氣溫降到0℃時，湖面開始結冰，使魚可在湖底生存。'
  options:
  - label: A
    content: 小名
  - label: B
    content: 安可
  - label: C
    content: 兩人都正確
  - label: D
    content: 兩人都錯誤。
