  section: 7
  number: 29
  type: single
  page: 4
  stem: How do people feel about shark fin soup?
  options:
  - label: A
    content: The Chinese think it’s a sign of being rich.
  - label: B
    content: Americans love how the fins are taken.
  - label: C
    content: Everybody knows it’s good for your health.
  - label: D
    content: Nobody wants it to be taken off the menu.
  group_stem: "Sharks have long been feared for their really sharp teeth.  Although\
    \ that is enough to keep most people away from those \nanimals, one part of them\
    \ that has been received with open arms is their fins.  The Chinese eat it in\
    \ the way of a soup, which they \nsay has many things that are good for people’s\
    \ health.  The dish has even grown to become a sign of wealth and class for them.\
    \ \n    For many others, shark fin soup is mean and not needed.  The reason for\
    \ that is how the shark fin is taken.  It is called \nshark-finning, and it cuts\
    \ the fins off living sharks before throwing them back into the ocean.  There,\
    \ they not only lose blood \nand die, but they also become food for other sea\
    \ animals.  Shark-finning is threatening the sharks and the oceans because the\
    \ \nanimals grow slowly and some types are already dying off.  Millions of these\
    \ sea animals die every year, which throws \neverything off balance. \n    Lucky\
    \ for us, governments across the planet have taken action to try to fix this problem.\
    \  In 2000, the USA made \nshark-finning illegal.  Also, Palau, the Maldives,\
    \ and the Bahamas have set up natural places that are safe for sharks.  Thanks\
    \ to \nthose actions and others, people have become more aware.  More people who\
    \ are getting married don’t have shark fin soup at \ntheir weddings.  Also, some\
    \ restaurants have taken the dish off their menus. \n receive 接受  fin 鰭  wealth\
    \ 財富  blood 血  threaten 威脅  balance 平衡  government 政府  illegal 非法的  \naware 意識到的"
