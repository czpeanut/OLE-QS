- id: doc_113_新北_土城_數學_g8s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '下列是阿昌利用配方法來解一元二次方程式 $x^{2}-4x-396=0$ 的過程，<4-2>

    $x^{2}-4x-396=0$

    $\Rightarrow x^{2}-4x=396$

    $\Rightarrow x^{2}-4x+a=396+a$

    $\Rightarrow (x-b)^{2}=c$

    $\Rightarrow x-b=\pm \sqrt{c}$

    $\Rightarrow x=b\pm \sqrt{c}$

    $\Rightarrow x=d$ 或 $x=f$

    請問下列選項哪一個是錯誤的?'
  options:
  - label: A
    content: $d+f=4$
  - label: B
    content: $b=2$
  - label: C
    content: $c=400$
  - label: D
    content: $a^{2}=4$
