  stem: A person with memory problem can’t _______________.
  options:
  - label: A
    content: write
  - label: B
    content: drink milk
  - label: C
    content: make good food
  - label: D
    content: remember things
  group_stem: '(9~11)

    George and Mary were husband and wife, and they were very old. They had memory
    problems, so they went to see a doctor. “ I can’t help you much. You’re losing
    your memory because of your age. Just write everything down. That can help.” George
    and Mary thanked the doctor and went home.

    Later that night, they were watching TV when George got up from his chair. Mary
    asked, “ Where are you going? ”

    “ To the kitchen, I’m thirsty.”

    Mary thought for a minute and then said, “ I’m hungry. Can you make a sandwich
    for me?”

    “Sure.”

    “Write it down. You have memory problems,” said Mary.

    “ I can remember it. What else do you want?”

    Mary said, “ Maybe some ice cream with banana. Write them down, please. You can’t
    remember them all.”

    “I can remember. You want a sandwich and some ice cream with banana.” George said
    and left for the kitchen. After 20 minutes, he came back. Mary was watching TV
    when he handed her a bowl of cookies. “ Here you go,” he said.

    She looked at the food and said, “ See? You couldn’t remember my request. Where
    is my milk for the cookies?”

    ※ hand 將…. 遞給 request 要求 leave for 前往 joke 笑話 remember 記住'
