  stem: Justin is 10 years old. How many tablets can he take one time?
  options:
  - label: A
    content: one
  - label: B
    content: two
  - label: C
    content: three
  - label: D
    content: four
  group_stem: '(6~8)

    Justin went swimming on Thursday. After that he felt sick and saw a doctor. The
    doctor gave him the medicine. Here is usage of the medicine.

    Anti-Phen

    For : ￭Headache ￭Fever ￭Sore Throat ￭Toothache ￭ Running Nose

    Instructions:

    1. Take the medicine every six hours. No more than 4 times a day.

    | Under 3 years old | Do Not Use |

    |---|---|

    | 3~6 years old | 1 tablet |

    | 7~11 years old | 2 tablets |

    | 12 years old and over | 3 tablets |

    2. Take the medicine with warm water.

    3. Keep the medicine in a cool, dry place.

    4. Keep away from kids.

    If there is any question, please call 0800-378-456

    ＊ instructions 使用說明 more than 超過 tablet 藥片'
