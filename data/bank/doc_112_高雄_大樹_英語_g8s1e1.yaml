  group_stem: 'Jimmy was a seven-year-old fun-loving boy, and he lived on the farm
    with his parents. He liked to walk around his house every day because he could
    always (1) . One day, when he walked around a river, he saw a frog on a rock.
    As Jimmy got closer to the frog, the frog opened its mouth and spoke to him.

    “Hello!” said the frog. “I am in fact a beautiful girl. A bad witch put a spell
    on me and turned me into a frog. (2) , and I will turn back into a pretty girl.
    I would stay by your side until you die.”

    Jimmy didn’t believe her words at first, but he still (3) the frog and put it
    into his pocket. He kept walking the river as he usually did. A few minutes later.
    The frog spoke again.

    “Hey, (4) I said I am a pretty girl. If you kiss me, I can change back and become
    your girlfriend!”

    Jimmy stopped, thought for a few seconds, and then said, “Umm, no. At my age,
    I think I want a talking frog more than a girlfriend.”'
