  type: single
  page: 2
  stem: What is the best title for this reading?
  options:
  - label: A
    content: Table Manners in India
  - label: B
    content: Guides to Interesting India
  - label: C
    content: Ways to Be Happy in India
  - label: D
    content: Menus of an Indian Restaurant
  group_stem: '(1～3)

    Many people visit India because of its delicious food. There are some rules for
    everyone to follow when they eat in India.

    First, Indians eat with their right hands. Only use your right hand when you eat.
    Keep your left hand by your side, and do not put it on the table. Second, don’t
    pass food to people with your left hand. This is because Indian people think the
    right hand is clean and the left hand is dirty. Third, only touch your own food,
    and never touch other people’s food. When you touch their food, it becomes dirty
    in their eyes.

    Follow these rules, and you can enjoy Indian food with Indians!

    ※ pass 傳遞 holy 神聖的 manner 方法 left 左邊的'
