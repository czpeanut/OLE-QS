  group_stem: "★閱讀下面修改自報紙的短文，回答下列問題：\n    過去一百年，地球整體表面平均氣溫，大致每年上升攝氏 0.005 度，據研究，其主因為大氣中「溫室效應氣體」之二氧化碳、甲烷、氟氯碳化物等濃度增加。因為地球溫室效應增強，導致大氣與海水的溫度上升，使得大氣與海水之間的熱與水分的循環量起了微妙變化。近幾年世界各地頻繁發生之多雨、颱風、洪災、乾旱、異常低溫等「極端天氣事件」，溫室效應增強為原因之一。溫室效應增強對河川、沿海水域之水文環境的影響，亦不可忽視。氣溫一增高，則水分的蒸發數量亦會增加，河川之流量會減小，直接影響整體水資源的開發利用；地表溫度上升導致動植物、浮游生物更加繁殖，下水道亦會增加臭味，與治海因高潮位產生海水倒灌之海岸災害等。總之，漠視「溫室效應增強」對氣候環境變動的影響，會增加自然環境對人類的反撲力量。"
