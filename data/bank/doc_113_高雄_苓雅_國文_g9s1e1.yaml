    \ 萬婦女為了照顧家人而退離職場，顯見「結婚生子」確實是女性的重大轉折。\n\n瑞典皇家科學院9 日宣布2023 年諾貝爾經濟學獎得主為戈丁（Claudia\
    \ Goldin），表揚她揭開勞動市場性別差異（gender differences）的關鍵驅動因素，寫下首次女性獨得經濟學獎的紀錄。\n\n戈丁致力於探究勞動市場存在巨大的性別差距，包含勞動參與率、所得差異等，她分析逾200\
    \ 年來的數據，研究結果表明，性別薪資不均與其說是對女性的歧視，不如說是反映工作彈性，以及平衡事業與家庭的高昂成本。\n\n戈丁認為，如果一個人有小孩或是其他家庭責任，即便他（她）可能有工作，也須在家待命，而在家待命的人將被迫選擇更有彈性、對工作要求更低的職位，因此薪資往往較低；女性通常是在家待命的人，換言之，性別不均的另一面是夫妻不均。\n\
    \n攤開台灣勞動市場現況，性別差距議題相當嚴峻，除了女性背負較大的家庭照護責任，使得勞參率（勞動參與率）受結婚生子影響甚鉅，且職場環境對二度就業接受度不高，導致女性離開職場後，幾乎一去不回頭。\n\
    \n「女性勞參率確實因為婚育過程而下降」，國發會官員直言，台灣在25 至39 歲的勞參率，其實比日本、韓國、美國等主要國家還要高，只是先後受到照顧小孩、照顧老人等因素影響，陸續退離職場。\n\
    \n觀察2021 年主要國家勞動力參與率，會發現台灣在25 至39 歲的年齡層間，勞參率都在8 成以上的高水準，尤其在25 至29 歲階段，女性離開校園後，幾乎都投入職場，勞參率高達89.9%、直逼9\
    \ 成。\n\n對照其他國家同年齡層的女性勞參率，韓國、日本、美國女性均是25 至29 歲勞動參與率最高，分別為75.5%、86.9%、76.8%，仍不及台灣，但隨著年紀漸長，情況慢慢翻轉，台灣女性勞參率逐漸跌破8\
    \ 成、7成，到了55 至59 歲，更只剩下45.4%，遠遠不及美國、韓國的6 成多，以及日本的7 成多。主計總處進一步調查女性退離職場、成為非勞動力的原因，結果顯示，關鍵是「做家事」以及「照顧家人」的比率，女性都大幅高於男性；凸顯即便女性投入職場相當普遍，「主內」的責任還是多落在女性頭上，甚至權衡之下，做出退離職場的選擇。\n\
    \n以2022 年數據來看，女性為了照顧老人、小孩等因素而退出勞動市場的人數高達33 萬人，其中有22 萬人是為了照顧家中未滿12 歲的子女；相比之下，男性為了照顧家中子女而退離職場的人數僅2000\
    \ 多人，差距懸殊。\n 中央社報導"
