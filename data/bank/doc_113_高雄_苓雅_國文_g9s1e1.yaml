  group_stem: '其實害怕冬天，那種很溼冷的感覺。


    國三換到新班級後，有好一段時間我都被同學關在教室的後陽台，我時常倚著欄杆發呆看風景，二年級的導師辦公室就在正對面，我看老師們起身行走又回座位坐下，他們從沒有看向窗外過一次，我想他們並不需要窗戶。


    期中以後就是更嚴實的冬天，鐵欄杆很冰，雨水降下來更是。那時刻，我就不能趴在上面了，只能伸出凍著的手呵氣作畫，灰濛濛的世界裡還能有欄杆和水珠裡的美麗倒影。


    終於有人發現我了。理化老師站在黑板前大聲命令要我快回座，我動也不動，假如他能走過來轉開門把就好了。但即便我坐回座位，在老師每次轉身的剎那仍會有腳踹過來，水壺裡永遠是泡麵調味包的味道。我有點哀傷，彷彿自己只能被討厭的人發現。

    白常屾 躲貓貓'
