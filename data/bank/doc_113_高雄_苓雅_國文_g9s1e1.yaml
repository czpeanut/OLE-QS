- id: doc_113_高雄_苓雅_國文_g9s1e1_s3_35
  section: 3
  number: 35
  type: single
  page: 5
  stem: 「紙被圍身度雪天，白于狐腋軟於棉」為陸游詩句，從文章與詩句可以推測當時的社會現象是：
  options:
  - label: A
    content: 即使是成為皇室成員的詩人，冬天也是蓋紙被度日
  - label: B
    content: 紙被的保暖度與柔暖度大勝棉被和狐裘
  - label: C
    content: 紙被的內層多為柳絮或茅草，外層為花椒樹皮
  - label: D
    content: 紙被的材料為樹皮，價格便宜，一般人較負擔得起。
  group_stem: '古人怎麼熬過寒流的，答案比較殘忍——很難熬過。


    漢武帝時期，發生過好幾次嚴重寒流，據記載霜凍雪災4 次、冰雹災害2 次，死者不計其數，還發生人吃人事件。《西京雜記》也記載到當嚴重寒流來襲時，每10 人就有2-3
    人凍死，牲口凍死不計其數，野鳥獸皆死。唐昭宗年間，接連戰事加上大雪不止，每天都有幾千人凍死。北宋年間開封有紀錄的寒災一共16 次，史書上頻繁寫道「人多凍死」、「凍死者甚眾」、「路有僵屍」；道光年間，一個縣連下三天大雪，該縣有數百戶團滅。


    你可能覺得為什麼古人不燒柴呢？答案是無柴可燒，古代柴是稀缺資源，古人沒有水土保持觀念，加上房屋建造會消耗大量木材，元明後基本上許多地方都是光禿禿一片，城附近能砍的樹全砍完了，唐朝時華北一帶的居民基本上沒燒過柴火，全年都吃冷食。古代為什麼有茶樓、路邊有茶水攤，那是因為柴火和乾淨飲水所製成的開水，是稀缺到不行的物品，所以才能夠賣錢。


    那怎麼不穿厚衣服呢？答案是沒有，古代禦寒衣物是稀缺品，甚至結婚嫁娶時，嫁妝或聘禮還得有棉被，我們現在陪嫁的物品清單中，也還保留床罩組的傳統。棉花是宋代以後的產物，一開始還是產量稀少的品種。有錢人一般穿狐貂裘衣，普通人只能穿柳絮、蘆花、茅草這種劣等填充物，有句成語叫「金玉其外、敗絮其中」，這個敗絮就是在講柳絮，基本完全不保暖。窮人甚至沒褲子穿，只能靠上衣遮蔽，這種現象一路到了民國初年還如此，所以台灣早期阿公阿媽都穿過「中美合作麵粉袋」做成的褲子，連近代都如此，何況古代。古代窮人還穿過紙衣蓋過紙被，唐、宋時期造紙業發達，人們發現楮樹皮做成的紙漿，韌性特別好，質地也算柔軟，價格還便宜，導熱性差，這就意味著穿在身上很保暖，是窮人的首選，陸游就曾寫過「紙被圍身度雪天，白于狐腋軟於棉」。


    至於皇室呢？皇室基本上可以動用最好的禦寒資源，皮草就不說了，建築方面也下了苦工。漢朝會用花椒樹的花混合泥做為塗料，塗在牆壁上，又香又保暖，未央宮的「椒房殿」就是這麼來的；清朝皇室會使用銅製手爐，裡面放上炭，冬天又暖又好看，暖腳則會使用湯婆子，你可以想像成一個熱水袋，冬天放上熱水放到被窩裡，晚上好睡個暖覺。


    不只有手爐跟湯婆子，還得有暖房設施，於是我們在《甄嬛傳》會看到炭盆，太監會將燒紅的炭放入炭盆中，相當於古代屋內的暖氣了，別小看炭，古代炭也是高級用品，還分三六九等，給不同等級的皇室成員使用。紫禁城還有「地暖」，就是一些重要宮殿內會有地下火道，冬天來臨時，太監會在火道坑中倒入燒好的炭，燃燒的熱量會隨空氣流動充滿整個地道，把地板烘熱，這樣整個宮殿也就暖起來了。


    現代寒流來臨，我們有瓦斯爐和電鍋、有發熱衣和羽絨被、有電暖爐和暖氣、有隨處可見的熱食，其實都要好好感謝這個時代，因為你不知道，光是活下來，你就有多幸運了。別動不動就憂鬱了，現代人。

    李的歷史故事 古人怎麼熬過寒流的'
