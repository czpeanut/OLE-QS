- id: doc_113_新北_土城_國文_g8s1e3_s1_29
  section: 1
  number: 29
  type: single
  page: 3
  stem: 關於文章中劉明燈的介紹何者有誤？
  options:
  - label: A
    content: 從湖南前往臺灣並擔任軍事要職
  - label: B
    content: 為一名善於揮毫且筆走龍蛇的文官
  - label: C
    content: 因率兵協助處理羅妹號事件而廣為人知
  - label: D
    content: 因所題碑文貼上金箔因而得名「金字碑」，現為新北市古蹟。
  group_stem: "愛寫字的總兵大人—劉明燈 \n \n 劉明燈是左宗棠的親信，湖南張家界土家族人，雖為武官，但亦擅長書法；同治五年(一八六六)奉旨來台擔任臺灣總兵，同治七年(一八六八)年底離台，任期短暫而精彩。最知名的事蹟，即率領五百軍力南下協助處理同治六年(一八六七)秋在恆春發生的羅妹號事件(即電視劇《斯卡羅》所本)。\
    \ \n 同年冬天，劉明燈從淡水廳取道三貂嶺前往噶瑪蘭廳時，有感山徑崎嶇艱辛展望壯闊，遂題七言律詩一首，並命人在越過三貂嶺的道路上，以篆體雕刻山壁成摩崖刻石、貼上金箔，成為流傳百年的「金字碑」。\
    \ \n 劉明燈所題之金字碑。其高約二百四十公分，寬約一百四十三公分，全碑原貼有金箔而得名，現為新北市市定古蹟。碑文如下： \n \n雙旌遙向淡蘭來，此日登臨眼界開。\
    \ \n大小雞籠(1)明積雪，高低雉堞挾奔雷。 \n穿雲十里連稠隴，夾道千章蔭古槐。 \n海上鯨鯢(2)今息浪，勤修武備拔良才。 \n \n註：(1)大小雞籠：在此指的是和平島與基隆嶼。(2)鯨鯢：羅妹號事件中的海外勢力"
