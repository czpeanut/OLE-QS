  stem: 關於修正後的「捐血者健康標準」草案描述，下列何者理解有誤？
  options:
  - label: A
    content: 治霈：捐血前無論是以何者方式測量體溫，都要換算成口溫的標準不超過攝氏37.5 度
  - label: B
    content: 傳翔：我身體機能一切正常，雖然只有46 公斤，草案修正後等我符合年齡標準也可以捐血了
  - label: C
    content: 奕幟：血壓新規定放寬了，以後血壓範圍在30～90 毫米汞柱就可以捐血救人
  - label: D
    content: 翔林：草案修正以後，身體機能一切正常的我滿16 歲時只要取得法定代理人同意也可以捐血了。
  group_stem: "捐血者健康標準草案，修正了什麼？ \n \n「捐血者健康標準」自2006 年發布施行，至今已18年未曾修正。為確保捐血者健康、血液品質安全、穩定用血供需平衡，衛福部食藥署10\
    \ 月24 日預告將修正「捐血者健康標準」草案，隔日（10 月25 日）起預告60 天，若外界無太大異議，預告期滿後將盡速公告上路，修正後的捐血條件重點如下：\
    \ \n•年齡：原65 歲以上需取得醫師同意，放寬為逾65 歲者，應有兩年內捐血紀錄；逾70 歲者，應得醫師同意。此外，現行捐血要求年滿17 歲，未滿17\
    \ 歲者，視體能狀況，經法定代理人同意才可捐；由於此類民眾一般介於16 至17 歲，食藥署新修規定為16 歲以上、未滿17 歲者，要取得法定代理人同意才能捐血。\
    \ \n•體重：過去要求女性至少45 公斤、男性50 公斤；新規定取消性別差異，45 公斤以上就可捐。 \n•體溫：原規定為口溫不超過攝氏37.5 度；新規定補充說明，以其他身體部位量測者，應換算為口溫。\
    \ \n•血壓：新舊規定均規範，收縮壓90～160 毫米汞柱，舒張壓50～95 毫米汞柱，收縮壓及舒張壓之差距低於30 或高於90 毫米汞柱者，應得醫師之同意。\
    \ \n•血液檢查：原規定有針對血紅素、血小板、白血球、血漿總蛋白計數；新規定將血液檢驗項目另置於附表，並新增B 型肝炎病毒、C 型肝炎病毒、人類免疫缺乏病毒核酸檢驗於其中。\
    \ \n•捐血量：每次捐血量，以250 毫升為原則。體重60 公斤以上者，得為500 毫升。每年捐血量，男性應在1500毫升；女性應在1000 毫升以內。捐分離術血小板、白血球或血漿，每次以500\
    \ 毫升為限，其全年捐血漿量不得超過12 公升。 \n•捐血間隔：前次捐血250 毫升者，應至少間隔兩個月以上；前次捐血500 毫升者，應至少間隔三個月以上；捐分離術血小板、分離術白血球或分離術血漿者，應至少間隔兩周以上。"
