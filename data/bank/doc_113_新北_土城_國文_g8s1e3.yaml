- id: doc_113_新北_土城_國文_g8s1e3_s1_31
  section: 1
  number: 31
  type: single
  page: 3
  stem: 根據本文，下列對乾隆第一次南巡的描述何者正確？
  options:
  - label: A
    content: 由乾隆皇欽定，嚮導官員無法預知
  - label: B
    content: 體察風土民情，同時具備政治意義
  - label: C
    content: 長途陸路為主，沿途巡查各地軍防
  - label: D
    content: 主要由西向東，最後抵達浙江錢塘。
  group_stem: "遨遊新世界，就像讀新書，總是充滿意外驚喜。如同現代人喜歡做行前功課，清代乾隆皇帝也有自己的旅行計畫，其中《乾隆南巡紀程圖》就極具代表性。現代戲劇中乾隆皇帝微服下江南，但在史實中南巡卻是大張旗鼓，凡御道經臨之處，地方大臣須與嚮導處官員擬好路程並繪圖呈覽。\
    \ \n    《乾隆南巡紀程圖》中即介紹衙署城池、山川名勝、水利設施及駐蹕位置，圖後文字則記載各站距離、地方沿革等。其上雖未載年款，但與記錄皇帝日常的《起居注》相比對後，可得知約完成於乾隆十六年（1751），第一次南巡前。此外，圖冊記載自直隸、山東起，之後一路大多由運河經徐州、揚州、鎮江、常州與蘇州貫穿到浙江錢塘，歷時二十三天，共十八站，一站一圖，構圖樸素，設色淡雅，共分為十八冊，可惜部分已失傳。從《起居注》還可發現實際路線與《乾隆南巡紀程圖》的計畫不同，學者推測御駕可能多次臨時修改。\
    \ \n 還有一個值得注意的是這套圖被製成易於攜帶的袖珍本，此類小尺寸的書籍，常被文人置於專門收納頭巾的箱篋中，故南朝齊至南宋一直以巾箱本稱之，至明清之際才漸為袖珍本一詞取代，外型細緻迷你，行旅坐臥，任其展卷玩賞。"
  tags:
    chapter:
      publisher: null
      book: 八上
      subject: 國文
