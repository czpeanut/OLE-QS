    content: 蛇蛻在醫典中顯示多半用於治療不同年齡層的疾病，包括蛇毒
  - label: B
    content: 因為蛇的外型特色而有龍衣、長蟲皮的別稱，各種蛇類蛻下肢皮膜皆可入藥
  - label: C
    content: 中醫認為蛇蛻可止癢解毒，為了不影響藥效，只可隨著白開水入藥，而孕婦忌用
  - label: D
    content: 非人工的蛇蛻才能夠入藥，不可強行用外力使蛇褪下皮膜。
  group_stem: "蛇蛻(ㄕㄨㄟˋ) \n \n醫典原文：味鹹平。主治小兒百二十種驚癇，瘈瘲，癲疾，寒熱，腸痔，蟲毒，蛇癇。—《神農百草經》 \n \n\
    釋義：「蛇蛻」又名龍衣、長蟲皮，顧名思義指的是蛇類蛻下的皮膜，完整者或呈圓筒狀，雖然整體皺縮，卻略帶光澤與彈性，味道則微腥、微鹹，現在臨床上多以黑眉錦蛇、錦蛇或烏梢蛇的蛇蛻入藥。傳統漢醫學認為蛇蛻具有止癢退翳、消腫解毒的功效，可研末後後攙入紅糖水、黃酒或乳汁等沖服，唯《本草綱目》中特別提到這味藥品「孕婦忌用」，故而務須遵循醫囑行事。值得一提的是，其皮殼若非屬自然蛻下、而為人工逕自剝除者，則不能入藥。"
