  section: 1
  number: 28
  type: single
  page: 4
  stem: '近年臺灣吹起一股露營風，到山林原野享受大自然成為許多人在假日的休閒選擇。根據統計，全臺露營地最多的前二名分別是南投縣與苗栗縣。露營地的申請需符合相關法規，如：非都市土地農牧用地、不得位於環境敏感地區、至少應有一條聯絡道路足以供消防救災及救護車輛通行等。然而，現實情況是多數的露營地皆為非法經營，使露營民眾暴露於危險之中。請問，以下何者並非環境敏感區？


    環境敏感區：對於人類具有特殊價值或潛在天然災害，極易受到人為不當開發影響而產生環境負面效應的地區。'
