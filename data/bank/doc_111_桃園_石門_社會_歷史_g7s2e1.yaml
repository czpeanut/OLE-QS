  stem: 1896 年，日本國會通過並公布《法律第六十三號》，第一條提到：「□在其管轄區域內，得發布具有法律的效力之命令」，第三條更進一步闡明：「在臨時緊急時，□得不經……手續，即時發布第一條之命令。」請問：日本國會透過《法律第六十三號》，賦予何人在臺灣可以頒佈具有法律效力的命令？
  options:
  - label: A
    content: 日本警察
  - label: B
    content: 臺灣巡撫
  - label: C
    content: 日本議員
  - label: D
    content: 臺灣總督。
