  group_stem: (乙)1902 年成立的高雄橋頭糖廠，舊稱「橋仔頭糖廠」，是臺灣第一座現代化製糖工廠。廠區內包含製糖工廠、運送甘蔗的五分車、日式建築、防空洞與彈藥庫。廠區內設有防空洞是因為戰爭期間，糖廠曾大量生產可提供戰鬥機替代燃料的酒精，因此被敵軍轟炸、掃射。1998
