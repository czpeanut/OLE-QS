  type: single
  page: 1
  stem: 夏、秋之際的臺灣常有颱風侵襲，其帶來的充沛雨量，使得河川水位暴漲，沖毀路基或橋墩，造成人員的傷亡及交通的不便。若在日治時期發生上述情形，政府會動員哪一個組織協助救災？
  options:
  - label: A
    content: 總督府
  - label: B
    content: 義勇隊
  - label: C
    content: 壯丁團
  - label: D
    content: 社區巡邏隊。
