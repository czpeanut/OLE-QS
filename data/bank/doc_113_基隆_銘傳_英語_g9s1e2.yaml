  number: 33
  type: single
  page: 3
  stem: What is Antonya Gonzalez's job?
  options:
  - label: A
    content: Teacher
  - label: B
    content: Psychologist
  - label: C
    content: Doctor
  - label: D
    content: Engineer
  group_stem: 'Antonya Gonzalez is a psychologist in Canada at the University of British
    Columbia in Vancouver. She says that we might think we treat everyone the same,
    but we can have hidden biases that affect how we act. Knowing about these biases
    is the first step to changing how we treat others.

    In 2016, Gonzalez did a study with children aged 5 to 12. She found that their
    hidden bias against black people could change. The children heard positive stories
    about people, like a firefighter who helps his community. Some children saw a
    picture of a white person, and others saw a picture of a black person. After the
    story, the children took a test. Those who learned about a black person were less
    biased than those who learned about a white person.

    Gonzalez says that learning about people from different groups who do good things
    can help us think positively about those groups. This is why diversity in the
    media is important. It helps us learn about people who break stereotypes.

    Hillard at Adrian College found that diversity training can help adults reduce
    bias against women. She says the first step is to be aware of our biases. Once
    we know about them, we can work to stop them.

    It is important to think about whether stereotypes can give good information,
    she says. Can a stereotype about a large group, like “all women” or “all people
    of color,” really be true?

    The key is to accept diversity, says Staats. We should not pretend it does not
    happen. One of the best ways to do this is to spend time with people who are different
    from you. This will help you see them as individuals, not just as part of a group.

