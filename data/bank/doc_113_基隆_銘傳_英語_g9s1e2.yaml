  - label: C
    content: Staying at home and doing activities nearby
  - label: D
    content: Visiting museums and local festivals
  group_stem: 'The Oxford English Dictionary (OED) often adds new words. Some new
    words are made by joining two words. One example is “voluntourism,” from “volunteer”
    and “tourism.” It means working as a volunteer while traveling. It is not just
    a vacation. Volunteers use their skills to help others. Many people from rich
    countries travel to poor countries to help. This has been popular for almost 50
    years. The word was added to the dictionary in 2014.

    Another example is “staycation,” added to OED in 2010. It became popular in the
    late 2000s. The word was first used in 2003 by a reporter. During a staycation,
    people stay home and do activities nearby. They might swim in the backyard, visit
    a museum, or go to local festivals. This feels like a vacation without traveling
    far. After COVID-19 in 2020, people were unsure if travel was safe. So, staycations
    became popular again.


