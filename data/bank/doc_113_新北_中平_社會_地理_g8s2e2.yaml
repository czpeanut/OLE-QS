- id: doc_113_新北_中平_社會_地理_g8s2e2_s1_34
  section: 1
  number: 34
  type: single
  page: 1
  stem: 小安在阿拉伯國家旅遊時，點了一頓豐盛的早餐【圖 1】，經由廚師說明，才知道這道料理的食材相當多元，除了歐洲的薯條外，油炸鷹嘴豆餅源於埃及、咖啡來自衣索比亞、優格源自中亞的游牧民族……此外，還有頗具特色的「北非蛋」（Shakshuka），由燉至軟爛的番茄丁為底，配上黃椒、洋蔥等蔬菜，再加上數種在地或來自東南亞的香料，烘托出獨特的香味。根據上文，西亞人民食材選用及飲食特色的形成，與下列哪一項因素最為相關？
  options:
  - label: A
    content: 當地氣候炎熱乾旱，傳統產業為畜牧業，菜色普遍以肉、乳為主
  - label: B
    content: 尼羅河及兩河流域因有豐富的水源，自古即為著名的農業帶
  - label: C
    content: 游牧民族間的資源爭奪，使得阿拉伯半島時常處於政治混亂的局面
  - label: D
    content: 西亞位於連結歐洲、亞洲、非洲的交會路口，古時貿易發達、人群交流往來密切。
