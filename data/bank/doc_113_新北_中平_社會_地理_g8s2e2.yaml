    content: 甲：副熱帶低壓帶
  - label: B
    content: 乙：欄牧
  - label: C
    content: 丙：層狀分布種植方式
  - label: D
    content: 丁：小窗、斜屋頂、厚牆，部分國家發展出干欄式建築。
  group_stem: '以下為老師整理西亞與北非自然環境與產業發展的上課重點筆記。請根據筆記內容，回答第48-50 題：【素養題】


    西亞與北非因處於(甲)副熱帶高壓帶影響範圍，以乾燥氣候為主，也因此傳統產業多為(乙)游牧與山牧季移，只有在少數有固定水源的區域才能發展綠洲農業，例如：尼羅河與兩河流域，土地利用以(丙)大規模機械化方式種植提高單位面積產量，作物多以椰棗、棉花等作物為主。傳統建築以(丁)小窗、平頂、厚牆，部分國家發展出風塔建築，促進室內涼爽。

    而在此區發現大量石油資源後，產業發展發生巨大轉變，經濟結構由農、牧業轉向工業與商業，經濟急速成長。然而，西亞部分國家，經濟發展逐漸多元化發展，加速他們與世界經濟的整合。例如阿拉伯聯合大公國，在首都阿布達比興建了法拉利遊樂園，成為世界最大的室內遊樂園；杜拜更是破天荒，在熱帶沙漠中興建了世界最大的室內滑雪場。'
