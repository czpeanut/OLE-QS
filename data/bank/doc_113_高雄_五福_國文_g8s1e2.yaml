  stem: '關於以下四則故事的敘述，下列選項說明何者最正確？

    第一則 蘇秦讀書欲睡，引錐，自刺其股，血流至足。（節錄自《戰國策》〈秦策〉）

    第二則 孫敬，字文寶，好學，晨夕不休。及至眼睡疲寢，以繩繫頭，懸屋梁。後為當世大儒。（節錄自《太平御覽》）

    第三則 孫康，晉 京兆人，性敏好學，家貧無油，於冬嘗映雪讀書。（節錄自《尚友錄》）

    第四則 車胤博學多通，家貧不常得油，夏月則練囊盛數十螢火以照書，以夜繼日焉。（節錄自《笑得好》）'
  options:
