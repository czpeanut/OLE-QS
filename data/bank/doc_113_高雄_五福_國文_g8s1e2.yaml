- id: doc_113_高雄_五福_國文_g8s1e2_s4_9
  section: 4
  number: 9
  type: single
  page: 5
  stem: 根據上述內容判斷，關於車輛上山賞雪的注意事項，下列敘述何者正確？
  options:
  - label: A
    content: 服用鎮靜劑
  - label: B
    content: 輪胎加裝雪鏈
  - label: C
    content: 聘請教練擔任駕駛
  - label: D
    content: 選擇清晨或夜間時刻
  group_stem: "【丁】 賞雪行前須知與相關疾病預防\n 臺灣地處熱帶，賞雪不易。海拔三千多公尺的合歡山，位於中橫公路旁，容易抵達，每到冬季，就成了臺灣人心目中的賞雪勝地。\n\
    \ 上山賞雪需要開車，在雪地開車和平地截然不同，車輛必須配備四輪傳動或輪胎加裝雪鏈才能上山，不然，就有打滑墜谷的危險。此外，山區行駛時，宜避開視線不清的清晨或夜間。\n\
    \ 上山賞雪，車輛有車輛的風險，遊客有遊客的風險，賞雪遊客最常罹患的疾病有以下兩種：\n※一、高山症\n 它是在低壓、缺氧的高山環境裡所產生的症狀。超過二千五百公尺的高度，大多數的人就會出現高山症。它的主要症狀為頭痛、嘔吐、厭食、全身倦怠等，嚴重時甚至會引發肺水腫、腦水腫而危及生命。預防的方法是「緩慢上升」，讓身體有足夠的時間去適應高度的變化。此外，吸菸、喝酒及服用鎮靜劑，都很容易誘發高山症。若不幸高山症發作，「下降」、「下降」再「下降」是最好的處理原則。\n\
    ※二、雪盲症\n 雪盲症是指視網膜受到強光刺激，引起暫時性的失明。雪地對日光的反射率可達到百分之九十五，眼睛直視雪地如同直視陽光。預防的方法是配戴防紫外線的太陽眼鏡，和補充維生素A、維生素B群、維生素C和維生素E等。若是得了雪盲症，可以用眼罩或乾淨的紗布覆蓋眼睛，並儘快就醫，通常可在一至三天內復原。"
