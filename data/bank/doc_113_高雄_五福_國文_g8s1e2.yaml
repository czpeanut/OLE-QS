  stem: 文中，義興人所謂「三橫」，以何者為害最大？
  options:
  - label: A
    content: 蛟龍
  - label: B
    content: 老虎
  - label: C
    content: 周處
  - label: D
    content: 清河
  group_stem: "【戊】 周處年少時，凶強俠氣，為鄉里所患，又義興水中有蛟，山中有邅跡虎，並皆暴犯百姓。義興人謂為「三橫」，而處尤劇。\n 或說處殺虎斬蛟，實冀三橫唯餘其一。處即刺殺虎，又入水擊蛟。蛟或浮或沒，行數十里，處與之俱。經三日三夜，鄉里皆謂已死，更相慶。\n\
    \ 竟殺蛟而出，聞里人相慶，始知為人情所患，有自改意。乃自吳尋二陸。平原(1)不在，正見清河(2)，具以情告，並云：「欲自修改，而年已蹉跎，終無所成。」清河曰：「古人貴朝聞夕死，況君前途尚可；且人患志不立，亦何憂令名不彰邪？」處遂改勵，終為忠臣孝子。\n\
    ※注釋：(1)平原：陸機 (2)清河：陸雲 （劉義慶《世說新語》〈自新〉篇〈周處斬蛟〉）"
