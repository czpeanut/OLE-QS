  group_stem: '【甲】 雨水也是溫暖的。但那是異鄉的雨水，落著，落在外邦生長農作物的土地上。幾天來看到的和聽到的，都是些陌生的點點滴滴，那綿亙一派土黃色的洛磯山風景線，也是破碎的點滴，如同石濤的畫，或是王粲的詩。我所掌握到的浮光再也營養不了自己，只為看不到的，聽不到的萬里以外的一草一木興懷生悲——更不用說羽毛河的深淵和內華達州蒼涼的沙原了。閉起眼睛來，最清晰的仍是北臺灣俯瞰時幾分鐘長如永生的翠綠和黛玉。江山如畫，乍離時，心隨上揚的機身做等速度的下降。接著我們只有不可分際的藍天和大海，幾朵浮雲，也如家鄉小溪流裡的游魚。

    （節錄楊牧 〈秋雨落在陌生的平原上〉）'
