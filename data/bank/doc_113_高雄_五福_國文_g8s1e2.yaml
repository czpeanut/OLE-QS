- id: doc_113_高雄_五福_國文_g8s1e2_s4_7
  section: 4
  number: 7
  type: single
  page: 4
  stem: 「小老太婆，怎麼會這樣想法？」那麼此處的「小老太婆」所指的究竟是誰？
  options:
  - label: A
    content: 作者
  - label: B
    content: 作者的媽媽
  - label: C
    content: 叔叔的老婆
  - label: D
    content: 作者的家庭老師
  group_stem: '【丙】 其實我知道自己想念的不是這支萬花筒，而是童年時代被家庭教師鎖在抽屜裡的那一支。

    那是大我三歲的堂叔給我做的。他的手最巧，用三條玻璃合成三角形管子，再把彩色玻璃敲碎，裝在一端，鑲上玻璃片，外面包了馬糞紙，再包錫箔紙，用大拇指背刮得晶光閃亮，才教我把眼睛貼在小圓洞口，用手轉著看裡面的五彩花朵兒。我真是太驚奇、太高興了，把它捧在手裡，抱在胸前，走到東、走到西，一邊喊著：「哪個要看變戲法？一個銅板看一次。」長工伯伯們只對我咧咧嘴說：「只那麼個筒筒，變得出什麼戲法？」我生氣地走開了。

    晚上臨睡前，我遞給母親看，她對著菜油燈看了半天，高興地說：「真好看哪。」我忽然抱著她說：「媽媽，我好想念哥哥，因為他的手更巧，也會做萬花筒，叔叔說的。」母親不作聲，眼淚卻幾乎掉下來了。因為哥哥被父親帶到遙遠的北平，而且有病不能回來。

    我在書房裡跟老師讀書時，偷偷地取出萬花筒來玩，被老師生氣地拿走，鎖在抽屜裡，竟一直都不還給我。我傷心地對叔叔說：「我不想讀書，也不想玩萬花筒了，覺得做人好苦啊，一點都不自由。」叔叔對我說：「小老太婆，怎麼會這樣想法？你看萬花筒裡不過幾粒玻璃末，會變出這許多花朵兒來。你的手一轉，要它變就變，我覺得做人有意思得很呢。」

    （節選自琦君〈萬花筒〉）'
