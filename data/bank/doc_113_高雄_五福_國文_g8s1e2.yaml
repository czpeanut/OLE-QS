  type: single
  page: 1
  stem: 偏義複詞：由兩個詞組成，卻只取其中一個詞的意義，另一個詞沒有意義。「曾不吝情去留」句中「去留」實際只取用一個詞的意義，只有「去」的意思，沒有「留」的意思。下列選項「」中的詞語，何者也是「偏義複詞」？
  options:
  - label: A
    content: 我最不能「忘記」的是他的背影
  - label: B
    content: 鳥的「身軀」都是玲瓏飽滿的
  - label: C
    content: 請衡量此事的利弊「得失」，再做決定
  - label: D
    content: 這幅潑墨山水畫筆致豪放，氣勢「磅礡」
