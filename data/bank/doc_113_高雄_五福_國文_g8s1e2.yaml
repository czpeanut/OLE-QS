  stem: 下列文句（ ）中所應填入的主語，何者正確？
  options:
  - label: A
    content: （ ）好書畫──牧童
  - label: B
    content: （ ）曝書畫──杜處士
  - label: C
    content: （ ）拊掌大笑──戴嵩
  - label: D
    content: （ ）掉尾而鬥──奴僕與女傭人
  group_stem: "【己】 蜀中有杜處士(1)，好書畫，所寶以百數。有戴嵩(2)〈牛〉一軸，尤所愛，錦囊玉軸(3)，常以自隨。一日曝書畫，有一牧童見之，拊掌大笑，曰：「此畫鬥牛也，鬥牛力在角，尾搐(4)入兩股間，今乃掉尾(5)而鬥，謬矣！」處士笑而然之。\n\
    \ 古語有云：「耕當問奴，織當問婢(6)。」不可改也。\n（節錄自蘇軾《東坡志林》〈戴嵩畫牛〉）\n※注釋：(1)處士：指有德才而隱居不願做官的人。\n(2)戴嵩：唐代初期著名畫家，擅長畫牛。\n\
    (3)錦囊玉軸：用彩錦做裝畫的袋子，用玉石做卷畫的軸子。\n(4)搐：抽搐，收縮。\n(5)掉尾：搖著尾巴。掉，擺動，搖動。\n(6)婢：女傭人。"
