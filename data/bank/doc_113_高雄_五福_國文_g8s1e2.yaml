  group_stem: '【乙】 南無，或稱軟霧，譯音也。種出南洋，傳入台灣未及百年，故舊志(1)不載。樹高至三、四丈，葉長而大。春初開白花，多髭(2)，結實纍纍，大如茶杯。有大紅、粉紅、大白、小青四種。味甘如蜜。夏時盛出。臺南最多，彰化以北則少見。實曝乾煎茶，可治痢疾。（連橫
