  - label: D
    content: 受洞外人的言語刺激
  group_stem: '有一群人到山上去打獵，其中一個獵人不小心掉進很深的坑洞裡，他的右手和雙腳都斷了，只剩下一隻健全的左手。坑洞非常深，又很陡峭，地面上的人束手無策只能在地面上喊叫。

    幸好，坑洞的壁上長了一些草，獵人就用左手撐住洞壁，以嘴巴咬草，慢慢慢慢地往上攀爬。

    地面上的人就著微光，看不清洞裡，只能大聲為他加油。等到看清他身處險境，嘴巴咬著小草攀爬，忍不住議論起來:

    「哎呀!像他這樣一定爬不上來了!」

    「情況真糟，他的手腳都斷了呢!」

    「對呀!那些小草根本不可能撐住他的身體。」

    「真可惜!他如果摔下去死了，留下龐大的家產就無福享用了。」

    「他的老母親和妻子可怎麼辦才好!」

    落入坑洞的獵人實在忍無可忍了，他張開嘴大叫:

    「你們都給我閉嘴!」

    就在他張口的剎那，他再度落入坑洞，當他摔到洞底即將死去之前，他聽到洞口的人異口同聲的說:「我就說嘛!用嘴爬坑洞是絕不可能成功的!」'
