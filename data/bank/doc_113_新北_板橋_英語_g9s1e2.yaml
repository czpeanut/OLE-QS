- id: doc_113_新北_板橋_英語_g9s1e2_s4_38
  section: 4
  number: 38
  type: single
  page: 5
  stem: 'What does the report NOT suggest?

    📖 suggest 建議'
  options:
  - label: A
    content: Changing the time of the special sale on weekdays.
  - label: B
    content: Make plans to help weekend morning business.
  - label: C
    content: Having more buses and parking areas for shoppers.
  - label: D
    content: Changing the opening hours on weekdays and weekends.
  group_stem: '✧Below is part of a new shopping center''s market report.


    Our busiest time is on weekend afternoons, between 2:30 p.m. and 4:30 p.m. About
    half of the week''s business happens during this time. So, it might be better
    to move the "Weekend Special Sale" from Saturday evening to Saturday afternoon
    because more people might come during the sale. We should also think about having
    more free buses and parking areas on weekends.


    Weekday evenings are the second busiest time, and the business is much better
    than last season. This might be because there were typhoons in the past two weeks,
    and people wanted to buy food early. Another interesting fact is that most sales
    happen in the last hour before closing. Most shoppers at that time live nearby
    or are busy working parents. They come for last-minute shopping before the store
    closes. These people make up almost 80% of weekday evening business. So, we might
    get more business if we stay open for 30 more minutes on weekdays, until 10:30
    p.m.


    Another thing is that business on weekend mornings is not as good as in the evenings.
    If we open before 9 a.m. on weekends and serve breakfast, we might get more shoppers.


    📖 make up 組成; serve 供應'
  shared_asset: g4_38_40
