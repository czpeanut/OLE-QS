  group_stem: 'You might go near a Swinhoe''s lizard in the park because it is only
    8 centimeters long and won''t hurt you. But it would be quite different _31._.


    The Komodo dragon is the biggest lizard in the world. It can grow up to 304 centimeters
    long and weigh over 90 kilograms. There are about 5,700 Komodo dragons in total,
    and they only live on four Indonesian islands: Komodo, Rinca, Flores and Gili
    Montang, even though there are other islands near the dragons'' "home." Scientists
    wanted to know _32._ because they''re good at swimming in the sea. After a 10-year
    study, scientists found they like to stay close to their homes.


    Komodo dragons eat almost any kind of meat, such as birds, snakes, fish, pigs,
    insects, horses, and even younger Komodo dragons. In 2007, a 10-year-old boy was
    killed by a Komodo dragon. Since then, there have been more than a dozen attacks,
    and the dragons are becoming more dangerous to humans. However, there are still
    4,000 people living on the islands. _33._ They build their houses higher than
    the ground and do not go outside at night. During the day, they carry Y-shaped
    sticks. If a dragon comes near, they throw things at it or shout to scare it away.
    Surprisingly, _34._. Instead, they try their best to protect them because the
    giant lizards bring tourists and money to the islands every year.


    📖 lizard 蜥蜴; Komodo dragon 科莫多龍; Indonesian 印尼的; scientist 科學家; stick 棍狀物; instead
    取而代之的是'
  shared_asset: g3_31_34
