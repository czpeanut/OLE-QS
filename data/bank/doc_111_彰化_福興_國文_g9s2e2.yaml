- id: doc_111_彰化_福興_國文_g9s2e2_s2_40
  section: 2
  number: 40
  type: single
  page: 6
  stem: 根據本文，獅貓為什麼能贏過大鼠？
  options:
  - label: A
    content: 先發制人
  - label: B
    content: 聲東擊西
  - label: C
    content: 謀定後動
  - label: D
    content: 調虎離山。
  group_stem: '萬曆間，宮中有鼠，大與貓等，為害甚劇。遍求民間佳貓捕制之，輒被噉食。

    適異國來貢獅貓，毛白如雪。抱投鼠屋，闔其扉，潛窺之。貓蹲良久，鼠逡巡自穴中出，見貓，怒奔之。貓避登几上，鼠登，貓則躍下，如此往復，不啻百次。眾咸謂貓怯，以為是無能為者。

    既而鼠跳擲漸遲，碩腹似喘，蹲地上少休。貓即疾下，爪掬頂毛，口齧首領，輾轉爭持間，貓聲嗚嗚，鼠聲啾啾。啟扉急視，則鼠首已嚼碎矣。然後知貓之避，非怯也，待其惰也。彼出則歸，彼歸則復，用此智耳。

    噫！匹夫按劍，何異鼠乎！

    清·蒲松齡《聊齋誌異·大鼠》'
