  group_stem: '群芳譜上只有你們的名字

    因你們的綻放比較繽紛亮麗

    但我有另一種綻放

    而且甚長


    那是悠久的橙紅球

    或是蒼翠的莖

    或是鵝黃的花

    或是茜紅的香檳杯

    被多刺的拳頭握住


    最重要的

    你們禁不起風吹雨打

    物換星移

    我卻能在沙漠中

    站出一種永恆

    ——胡品清'
