- id: doc_111_彰化_福興_國文_g9s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 「事實上，高畑勳為日本動畫的付出是全方位的：他不僅引領了改編外國文學的電視動畫風潮，也多方參與各種動畫創作專案。他因為有作詞作曲能力，因此也多次跟久石讓一起為吉卜力作品企畫配樂，甚至也親自為《輝耀姬物語》做了兩首插曲。他因為法語系的背景，翻譯了一些法國動畫小說和動畫字幕。高畑勳自己也寫了好幾本跟電影和動畫有關的書籍。」（魏玓〈園丁與騎士：在宮崎駿的鋒芒之外，高畑勳是什麼樣的存在？〉）根據這段文字，下列影視方面的獎項，何者是高畑勳最有可能獲得的？
  options:
  - label: A
    content: 最佳攝影獎
  - label: B
    content: 最佳動作設計獎
  - label: C
    content: 最佳造型設計獎
  - label: D
    content: 最佳原創電影歌曲獎。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
