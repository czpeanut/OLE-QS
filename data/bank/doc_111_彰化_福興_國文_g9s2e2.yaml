- id: doc_111_彰化_福興_國文_g9s2e2_s2_38
  section: 2
  number: 38
  type: single
  page: 6
  stem: 根據本文，臺灣的降雨量充足，卻仍不夠支應需水量的原因為何？
  options:
  - label: A
    content: 雨水要經過數年處理才能使用
  - label: B
    content: 因地形因素，地表水流入大海
  - label: C
    content: 水庫興建數量少，蓄水量有限
  - label: D
    content: 降雨多寡因季節有顯著的落差。
  group_stem: '臺灣是全球排名第18位的缺水國家，但臺北人的用水量卻在30個國家首都中排名第二，面臨嚴重的缺水危機。中央研究院地球科學所兼任研究員汪中和提醒大家，滋養萬物的水，如今正因為人類自作孽而變成惡水。

    臺灣的水資源分為地面水與地下水，從1950年以來地面水的使用都逐年成長，但到了1980年以後開始呈現下降趨勢，許多民眾於是使用地下水來彌補，從原來5%左右變成超過30%，甚至曾高達40%。但臺灣地下水的安全使用量僅有20%，凸顯了超抽地下水的嚴重性。

    其實臺灣一年有90億噸的豐沛降雨量，可惜的是，因為地形因素，有72%流入大海。臺灣每年170～180億噸的需水量，不足的部分都靠地下水支撐，代價則是地層下陷，危害到國土與交通安全。

    既然臺灣降雨量不少，設法留住水資源是最佳解方。汪中和認為要讓臺灣「海綿化」，涵養中央山脈的蓄水，成為綠色水庫，同時也會讓河川激流有較多水源。此外，現在高屏溪和中部地區在開發的「伏流水」，也可幫助克服河川水量不足和水質不好的情況。「都市海綿化」也是儲水的永續策略，以新的生態工法將城市道路變成蓄水空間，還具有減緩淹水、抗旱、降溫的功能，估計六都若能海綿化，將可年增6億噸儲水量。

    開源也要節流，臺灣用水問題不少，水價偏低的課題未解，只能尋求適當管理。佔目前用水7成、高達120億噸的農業用水，從耕種面積逐年下降來看，若落實工業用水與生活廢水回收，也能彌補一些缺口。除了幾家規模較大的企業深受缺水之苦、會自主回收，如果政府能對一般工廠提供稅負獎勵，減低設備投資成本，也可以提高回收意願。而民眾的用水習慣也需要改變，惜水惜福，且多利用科技省水裝置，估計可以省下約6億噸水量。還有，每年漏掉4.4億噸的自來水，也應盡快查漏修補管線，降低漏水率，這是減少無謂浪費的迫切工作。

    面對水文環境的急遽變化，在臺灣寸土寸金的生活空間裡，怎能再無視又無感地消耗下去？危機不能只當成轉機，而是亟需改變的契機。

    （節選自「天下獨立評論」網站2021、10.23）'
