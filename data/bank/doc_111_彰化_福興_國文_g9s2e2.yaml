- id: doc_111_彰化_福興_國文_g9s2e2_s2_44
  section: 2
  number: 44
  type: single
  page: 7
  stem: 根據本文，下列關於這兩位強盜的敘述，何者最恰當？
  options:
  - label: A
    content: 鮑勃與多德森兩人對於這次有驚無險的搶奪收穫皆感到心滿意足
  - label: B
    content: 鮑勃當強盜的經驗不足，逃離時暴露了自己的大意與輕忽
  - label: C
    content: 與鮑勃相較之下，多德森顯得多所顧慮且心事重重
  - label: D
    content: 兩人關係可用「人生貴相知，何必金與錢」形容。
  group_stem: '兩個強盜衝下陡坡，謹慎而迅速的穿過樹林，馳進一個原始的荒涼峽谷。在這裡，鮑勃·蒂德博爾的坐騎在一塊長滿苔蘚的岩石上打了滑，摔折了前腿。他們立刻朝牠腦袋開了一槍。

    「哦，我想你那匹小野馬暫時馱得動我們兩個人。」樂天派的鮑勃說，「路上一見到馬，我們就徵用一匹。天哪，我們發了一筆財，可不是嗎？看錢上的標籤，一共三萬，每人一萬五！」

    「比我預料的少。」鯊魚多德森說，用靴尖輕輕踢著鈔票捆。接著，他沉思的瞅著他那匹跑累的馬的汗水淋漓的肋腹。「老博利瓦爾差不多要累垮啦。」他慢吞吞的說，「我真希望你的栗毛馬沒有摔傷。」

    「我也這樣希望，」鮑勃無憂無慮的說，「不過那也是沒有辦法的事。博利瓦爾的腳力很健——牠能很快的把我們馱到可以換新坐騎的地方。」

    （改寫自歐·亨利《我們選擇的道路》）'
