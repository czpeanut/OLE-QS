  page: 6
  stem: '你或許有以下乘搭電梯的經驗。當升降機向上加速時，你會感到好像有股一力將你下壓，若這時你剛好站在磅秤上，你的重量增加了一點。而當升降機減速時，你會感到好像有股一力將你往上拉，若這時你剛好站在磅秤上，你就會變得輕一點。可應用牛頓第三運動定律來解釋這個現象。假設升降機內有一個人站在磅秤上，如圖二十四所示，人的重量為
    W 公斤重，電梯的重量 M 公斤重。磅和那人之間的相互作用是一對作用力和反作用力，人下壓磅秤的力為 R’ 公斤重，磅秤給人的反作用力為 R 公斤重【註: W、M、R、R’
    為數值大小，圖中箭號表示力的方向】。試問當電梯向上作 2m/$s^{2}$ 的等加速度運動時，電梯裡的人受力的等式應為下列何者?'
