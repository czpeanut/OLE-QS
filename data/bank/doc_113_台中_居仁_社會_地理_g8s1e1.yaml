  section: 2
  number: 46
  type: single
  page: 5
  stem: 中國的農牧分界最可能是以年降水量幾毫米的等值線為界線呢?
  options:
  - label: A
    content: 250mm
  - label: B
    content: 500mm
  - label: C
    content: 750mm
  - label: D
    content: 1000mm
  group_stem: "【題組三】請根據文中內容，回答以下問題(文章擷取自胡鬆梅：全球視野下中國北方農牧交錯帶的形成):\n  中國農、牧分界大致以年降水量__46.__毫米的等值線為界，以東、以南為農業區，以西、以北為畜牧區。農牧交錯帶範圍北起大興安嶺西麓的呼倫貝爾，向西南延伸，經內蒙古東南、河北、山西北部直到榆林地區。\n\
    \  農牧交錯帶伴隨著農業與牧業的出現而形成。在中國，北方粟黍農業經濟形成遠遠早於牧業，大約起源於一萬年前的新石器時代。伴隨著食草動物牛、羊、馬的出現而產生了畜牧業。\n\
    \  陝西省北部的榆林地區，是中國典型的農牧交錯帶，其氣候和植被特點，為牛、羊的大量養殖提供了基礎。近十幾年來，隨著榆林地區基本建設的開展和文明探源等研究課題的深入，陝西省考古研究院和榆林市文物考古勘探工作隊聯合發掘了30多處新石器遺址，初步建立了榆林地區距今約5\
    \ 千年的文化發展序列。\n  從目前的DNA 研究來看，羊和黃牛二者都是距今約一萬年前起源於西亞地區，並於距今約4500 年前傳入中國。<u>羊在西亞地區被馴化後，開始經中亞草原向東傳播，到達蒙古高原、河西走廊與河套地區，隨後由北向南再傳播到中原地區。</u>這也許可以幫助我們理解在距今4500\
    \ 年前後黃河中下游地區同時出現綿羊和黃牛的現象。而黃牛傳入中國的路線可能有兩條，一條與羊的傳播路線基本一致，另外一條從南亞地區東傳，經印度河流域進入中國雲南地區，然後向北傳播至黃河流域和中國其他地區。\n\
    \  榆林地區，在新石器晚期的龍山文化時期，基於當地優質的草料，使先民很快地接受了從西邊傳入的綿羊、山羊和黃牛，並發展成為當地的畜牧經濟。直到今天，這個地區仍然是以半農半牧經濟為主，且畜牧業已成為支柱產業，促進了當地經濟、社會和文化的發展。"
