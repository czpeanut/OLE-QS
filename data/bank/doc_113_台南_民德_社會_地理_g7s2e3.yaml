  section: 1
  number: 16
  type: single
  page: 1
  stem: 下列四種交通形式，何人提及的與其他三人不同？
  options:
  - label: A
    content: 飛雄：「寒假的時候我去了西伯利亞體驗哈士奇雪橇，速度極快、爆發力強、衝勁猛烈，習慣後會覺得身心都非常輕鬆！」
  - label: B
    content: 妮可：「在葡萄牙有一種看起來像雪撬的籐椅飛車，會由兩名身穿傳統白色棉褲、襯衫和草帽的男子駕駛，熟練的利用鞋底的橡膠來剎車！」
  - label: C
    content: 鷹央：「隨著全球進入低軌通訊衛星密集發射期，工研院發展高階大型相位陣列天線模組技術，提升自主衛星通訊系統與元件的發展。」
  - label: D
    content: 小嗶：「臺灣交通號誌傳統實施號誌纜線埋設的方式，現在已經出現以『微管溝工法』進行號誌纜線地下化了。」
