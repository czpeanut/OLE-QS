  section: 1
  number: 17
  type: single
  page: 2
  stem: "以下有四位同學對自己的家鄉做簡單的介紹敘述，這四位同學的家鄉依序位於圖一中的哪一區？\n   杰利蜀：「我的家鄉有臺灣第一座國家公園，這裡也常常會舉辦熱帶農業博覽會和黑鮪魚季，很多人來這裡都會買烏魚子、豬腳、蓮霧等伴手禮！」\n\
    \   史狄琪：「我的家鄉原名是『竹塹』，我們會利用有名的九降風來風乾柿子和米粉。這裡客家族群佔了八成以上，幾十年來由於科學園區的建立，讓這個風城逐漸轉變為科技城市。」\n\
    \   丸琵豹：「我家鄉擁有許多世界級的山水美景，西元1590 年葡萄牙人航經沿海地區，驚呼『FORMOSA 福爾摩沙』。汙染程度低，成為臺灣重要的有機農業生產地。」\n\
    \   筱虹荳：「每年大甲媽祖遶境進香就是從我的家鄉出發！也因位處大甲溪出海口，所以擁有豐富的濕地生態，落日十分的夕陽美景也都十分漂亮，每年秋冬也都有大批候鳥聚集。」"
