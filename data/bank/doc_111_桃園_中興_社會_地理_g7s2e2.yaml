  number: 21
  type: single
  page: 2
  stem: 林瑞漳先生從事農業生產之前的工作應屬於哪一種產業？
  options:
  - label: A
    content: 輕工業
  - label: B
    content: 重工業
  - label: C
    content: 高科技工業
  - label: D
    content: 食品加工業。
  group_stem: "請閱讀完下文後，回答21~24 題。\n    林瑞漳先生鑒於父執輩們種植的稻米銷量下跌，轉作其他作物，產銷通路又不順暢，毅然決然地放棄待遇優渥的電子資訊業，返鄉協助父親從農並協助行銷。\n\
    \    1980 年起，政府推行稻田轉作計畫，選擇南投草屯地區栽種薏苡，期間創立薏仁生產合作社，並與農業改良場合作進行品種優化，找出適合臺灣本土之優良品系。\n\
    \    有了好作物，還得賣出去，才能維持農民的生計。林瑞漳先生發展出一條自產自銷的路，把薏苡脫殼為薏仁，真空包裝，或將薏仁研磨成粉，方便消費者食用。\n\
    \    為建立產品形象，他們打造了「田野仕」品牌，現在你也可以利用網路，線上購買這群在九九峰下、烏溪旁，樂天知命農夫們辛勤的成果。\n※以上內容改寫自「田野仕夢想農園」網站※"
