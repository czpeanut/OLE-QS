- id: doc_113_高雄_楠梓_社會_地理_g8s2e1_s1_45
  section: 1
  number: 45
  type: single
  page: 1
  stem: 在印度電是奢侈品、電費昂貴，許多人無法負擔，因此一位中學輟學的陶泥工發明了不用插電的的土製冰箱「Mitticool」。土冰箱用黏土製作，外圍有一個能裝水的水箱，中間是隔離儲物區，原理和陶罐類似，只要在冰箱外圍的水箱注水，水就會沿著冰箱兩側流下，內部隨著水分蒸發達到降溫，冰箱內部溫度甚至可低於外面約10
    到20 度，蔬果可以保存7 天。節能、環保、不用插電、價格便宜，窮人也有辦法購買。印度常出現符合居民需求的工業產品，主要原因為下列哪兩者？
  options:
  - label: A
    content: 傳染病肆虐、外國強權迫害
  - label: B
    content: 老百姓貧困、基礎設施不足
  - label: C
    content: 醫療水準低落、老人死亡率高
  - label: D
    content: 階級歧視明顯、政局動盪不安。
