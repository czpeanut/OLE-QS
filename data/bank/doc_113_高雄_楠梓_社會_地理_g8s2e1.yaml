  stem: 知名日系品牌欲推出黃麻購物袋,因價格低廉且環保實用成為上班族、學生族的愛用包款。原生於南亞地區的黃麻生長迅速,在種植時不需使用農藥及化學肥料,還能吸收二氧化碳,是名符其實的環保商品。若該品牌設計師欲至原料產區實地勘查,應到【圖三】何處?
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
  group_stem: "◎ 我愛咖啡也愛茶 \n    印度是世界第五大咖啡生產國。早在十七世紀，印度就已經是重要的歐洲咖啡供應地。當時都是透過帆船海運，在海賊橫行的航海時代，咖啡豆必須長時間的受海風吹拂，咖啡豆也因此被「加味」，「風漬咖啡」(India\
    \ Monsooned Malabar)就此誕生。咖啡製造商會在潮濕炎熱的雨季，將咖啡豆放置於沿海朝西的「風漬廠」，面迎鹹溼的夏季季風讓豆子熟成獨特風味。印度也是全世界最大的茶葉生產國家之一，擁有許多世界主要茶葉產區，其中著名的有大吉嶺（Darjeeling）、阿薩姆（Assam）等。"
