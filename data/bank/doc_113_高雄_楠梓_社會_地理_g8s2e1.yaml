  section: 1
  number: 50
  type: single
  page: 1
  stem: "過去，東協國家因為主要作物及採礦經營權被西方企業掌控，無法有效獲利，導致經濟落後、人民貧困；現今區域團結結盟力抗強成為共識，2020 年，更結合周邊的中國、日本、南韓、澳\
    \ 洲、紐西蘭簽署完成「區域全面經濟夥伴協定(RCEP)」，企圖發展成為全球規模最大的自由貿易市場。試問：下列哪些礦產為東協較豐富的資源？ \n甲：石油、乙：天然氣\
    \ 、丙：錫礦、丁：鈾礦"
