  section: 1
  number: 48
  type: single
  page: 1
  stem: 古文明國家印度，近年來經濟活動相當發達，卻也在從傳統走向現代的過程中，存在著適應的問題。2019 年， 政府提出國家發展目標指出：｢印度在全球貿易體系的角色已經改變、過去將產業重心放在電子業已經不夠，
    未來將提出整體性策略，將印度更契合融入全球供應鏈，達到｢在印度生產、為印度生產，也為全球生產(Made in India,for India and for
    the world)的目標。｣試問：下列哪些條件是印度本身具有的優勢？ 甲:優秀科技人才 乙:英語好溝通 丙:當地工資低廉 丁:國內交通便捷
