    content: 無法判斷。
  group_stem: "※\n    西元2019 年，中國全國國民生產毛額（GDP）總量為990,865 億人民幣，排名前30強的城市就占了全國經濟總量的43%。其中，全國GDP\
    \ 前十名仍然延續2018 年的十個城市，其名次及分布如附圖，排名第一和第二的城市，其GDP 總值已超過3 萬億人民幣。然而，城市GDP 衡量的是一座城市的地區生產總值，而平均到每個常住人口的人均GDP，則更能清晰看到當地居民的富裕水平和城市的發達程度。根據統計，2019\
    \ 年中國人均GDP 最高的城市不是經濟總量最高的上海、北京，而是深圳。2019 年深圳的人均GDP 為203,489 元，領先全國，其次是江蘇省的無錫、蘇州和南京。請問："
