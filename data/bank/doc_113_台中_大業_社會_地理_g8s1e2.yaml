- id: doc_113_台中_大業_社會_地理_g8s1e2_s2_38
  section: 2
  number: 38
  type: single
  page: 6
  stem: 根據文中資料，南韓環境部的資料認為PM2.5 濃度每立方公尺只要超過多少微克以上，就達到會對人體造成危害的警戒等級？
  options:
  - label: A
    content: 25 微克
  - label: B
    content: 50 微克
  - label: C
    content: 70 微克
  - label: D
    content: 150 微克。
  group_stem: "※請閱讀下列短文並回答問題。\n\n「首爾空汙破紀錄 都是中國惹的禍？」\n\n    西元2019 年3 月初，南韓首都首爾創下近年來PM2.5\
    \ 汙染最高紀錄，濃度飆破每立方公尺150 微克，已經達到危害人體的等級，連續一週的嚴重霧霾，讓首爾籠罩在「極度危害」的灰色世界當中。南韓政府表示：「空氣汙染的元兇來自中國」，汙染物質隨風影響南韓，呼籲中韓雙方共同解決環境災難；但中國卻否認南韓的說法，表示南韓的說法毫無根據，南韓的空汙並非全是中國的問題。\n\
    \n    根據南韓環境部的資料，截至3 月6 日為止，首爾已經連續6 天處於嚴重空汙狀態，PM2.5 濃度只要超過70 微克以上，就是對人體造成危害的警戒等級，但是首爾這次的監測值一度超過每立方公尺150\
    \ 微克，已經創下有監測紀錄以來的最高值，也是全球空汙最嚴重的城市之一。\n\n    面對連日惡劣的空氣品質，南韓政府採取緊急應變措施，已經緊急實施限制車輛上路，還有建築工地停工等方式。未來該如何防制空汙，已經是南韓政府的巨大挑戰。\n\
    \n資料來源：Udn 轉角國際(2019.03.27)。首爾破紀錄空汙：文在寅指控「中國霧霾外送南韓」。"
  tags:
    chapter:
      publisher: 翰林
      book: 八上
