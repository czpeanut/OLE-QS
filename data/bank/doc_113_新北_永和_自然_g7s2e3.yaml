- id: doc_113_新北_永和_自然_g7s2e3_s2_21
  section: 2
  number: 21
  type: single
  page: 3
  stem: 食蟲植物在生態系中扮演的角色，何者最為貼切？
  options:
  - label: A
    content: 僅廣義消費者
  - label: B
    content: 僅生產者
  - label: C
    content: 僅消費者兼分解者
  - label: D
    content: 僅生產者兼廣義消費者。
  group_stem: '別以為我是吃素的~食蟲植物

    達爾文於1875 年的《食蟲植物》（Insectivorous Plants）中定義肉食性植物的特質為：「產生酶分解養分，以利葉部吸收，藉此代謝掉所吃的動物」。食蟲植物除像一般植物進行光合作用外，還能捕食昆蟲和小型動物等，藉捕食行為攝取蛋白質和硫氮磷類養分。

    豬籠草為石竹目（Caryophyllales）豬籠草科（Nepenthaceae）豬籠草屬（Nepenthes）植物的統稱，主要產於熱帶亞洲地區，在高濕條件下才能生長發育，通常藉由風傳送花粉，花萼也會分泌花蜜吸引昆蟲授粉。為讓授粉昆蟲能不掉落捕蟲籠並完成授粉，豬籠草在繁殖季會長出細長的花軸，讓花朵遠離捕蟲籠。

    豬籠草有葉子特化的捕蟲籠，上方籠蓋可防止雨水與雜物掉落，籠蓋下的蜜腺可分泌蜜汁，昆蟲或小型動物受吸引進入捕蟲籠後籠蓋並不會合上，蟲籠內表面的臘質區很光滑，能防止昆蟲爬出，籠內則分泌帶黏性的酸性消化液可將昆蟲淹死並消化吸收。食蟲植物對大多昆蟲和小型動物而言是可怕的地獄，但有些生物會與肉食性的豬籠草發展出捕食以外的互動關係，舉例如下：

    (一) 哈德威克毛蝙蝠（Kerivoula hardwickii）體長小於四公分，可住在赫姆斯利豬籠草（N. hemsleyana）捕蟲籠內，不怕日曬雨淋、無寄生蟲干擾，母蝙蝠甚至會和孩子擠在同一個捕蟲籠內休息或睡眠。由於赫姆斯利豬籠草的蜜汁氣味較淡、缺乏鮮艷花紋，且消化液含量較少，較難誘引捕獲昆蟲，必須靠蝙蝠的糞尿補充所需營養。

    (二) 二齒豬籠草（N. bicalcarata）擁有極大的蜜腺，蟻科的弓背蟻（Camponotus schmitzi）可於捕蟲籠中築巢居住，取食蜜汁同時清理籠口邊緣的真菌菌絲和污染物，並在籠口處分泌黏液，防止雨水或其他昆蟲進入搶食或破壞，也會擊退前來啃咬新芽的長足象鼻蟲（Alcidodes
    sp.）等植食性昆蟲。

    (三) 姬蛙（Microhyla nepenthicola）尺寸像一粒豌豆，可抵禦消化液酸度，於蘋果豬籠草（N. ampullaria）捕蟲籠中生長繁殖；成蛙可在豬籠草附近覓食，於籠內鳴叫求偶，再將卵產在捕蟲籠上，待卵孵化後，蝌蚪會在捕蟲籠內吃著淹死的昆蟲成長，排泄物也成為豬籠草的養分。

    豬籠草經長期演化，雖可在土壤貧脊的環境中生存，卻因人類開發導致其棲息地不斷縮減甚至消失，成立保護區也面臨遊客破壞，嚴重影響野外族群密度。由於外形和習性特殊，野生種豬籠草由原產地被採集販售至世界各地，須極力保護。生物學家嘗試以無毒染料塗抹某些珍稀種類的野生豬籠草植株，一旦發現待售的植株，查驗人員就可迅速判斷是否為非法野外盜取。根據《甲公約》規定，目前必須經申請並獲得公約許可證後才可進行豬籠草貿易。

    (內容改編自：臺灣博物館（2017.8.4.）https://ntmedu.blogspot.com/2017/08/blog-post_4.html )'
