- id: doc_113_新北_永和_自然_g7s2e3_s2_12
  section: 2
  number: 12
  type: single
  page: 2
  stem: 綠鬣蜥在生態系中的角色，何者最為合理？
  options:
  - label: A
    content: 幼體時主要為初級消費者
  - label: B
    content: 成體時主要為次級消費者
  - label: C
    content: 綠鬣蜥在中南美洲是外來入侵種
  - label: D
    content: 在台灣缺乏天敵，造成危害。
  group_stem: '綠鬣蜥~從寵物到生態危機

    綠鬣蜥（Iguana iguana）原產於中南美洲，十多年前被列為二級保育類動物，由於外型特殊，許多人從國外引進成為台灣的熱門寵物。但因成體體型龐大飼養不易，不少人棄養導致部分綠鬣蜥逸入自然環境，在墾丁一帶迅速繁殖。

    綠鬣蜥繁殖力極強，每年春季可產下3到50顆蛋，且台灣氣候溫暖、缺乏天敵，使綠鬣蜥數量急速擴增，從2017年的約二千隻，短短幾年內暴增至2024年的八萬多隻。

    綠鬣蜥幼體會捕食昆蟲，長大後則以植物的葉、芽、花與果實為主食，大量攝食人工種植的葉菜類。綠鬣蜥會挖掘堤防或河岸的土洞築巢產卵，導致排水系統損壞、農田灌溉受阻，甚至影響土堤結構的穩定性。牠們也可能與本土昆蟲、小型蜥蜴競爭食物，破壞原本的食物網結構與生態平衡。

    為了防止綠鬣蜥進一步擴散，政府2014年起將牠們從保育名單中除名，並於2020年正式公告為「外來入侵種」。林業署積極推動人為移除，包括開放訓練有素的獵人使用氣動槍捕捉，也要求飼主登記、限制飼養。屏東縣政府甚至推出「抓蜥換農產品」的獎勵活動；網路上也有人發起「吃綠鬣蜥、護生態」行動，但專家提醒：野生個體可能含有寄生蟲，食用風險高。

    曾經是新興寵物的綠鬣蜥，最後卻成為生態破壞者。這個案例讓人深思：人類在引進外來物種與棄養寵物時，若缺乏長遠考量，就可能對自然環境造成難以彌補的後果。綠鬣蜥不只是外來種問題，更是我們如何與自然共存的重要提醒。

    (內容改編自：E報（2025.1.6.）。〈綠鬣蜥你有所不知〉https://enews.ccu.edu.tw/p/405-1089-67571,c177.php?Lang=zh-tw)'
