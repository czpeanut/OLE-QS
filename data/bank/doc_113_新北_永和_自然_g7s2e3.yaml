  group_stem: '無題

    我是一顆在地球旅行了幾十億年的原子。我走過空氣、植物、動物、岩石和海洋，今天就讓我帶你一起看看我的冒險！

    一開始，我以 a 狀態飄盪在空中，有一天一株綠油油的青草利用甲作用吸收了我，把我轉變成 b 儲存在葉片中。過幾天，一隻兔子跑來啃草，我也進入兔子體內，兔子被狐狸捕食，我又進入狐狸體內成為養分儲存。冬天時，狐狸利用乙作用把養分轉化成能量產生體溫，也讓我再度回到空氣中，準備下一段旅程。

    回想起來，最長的一次旅行是幾千萬年前的事了，當時我在一棵老樹體內，隨著森林倒下後，我和原子夥伴們一起被深埋在地下。因為環境缺氧、在高溫高壓中沉睡幾千萬年之後，我們變成了
    c 。有一天，人類將我們挖出，透過丙作用發電、讓機械運轉，提供人類生活更高的效能與便利，我和伙伴們也被迅速地大量釋放重返大氣。但我也發現，空氣組成和從前不一樣了，擠滿了我和伙伴們，丁作用加劇造成地表溫度逐漸上升、冰川融化、氣候變遷，對生態產生極大衝擊。

    我不壞，但人類的每一個選擇，都影響著我旅程的方向，也牽動著整個地球的命運。'
