  group_stem: "關渡濕地的紅樹林\n靠近基隆河與淡水河交界，一項籌備許久的工程動工了。怪手朝著水筆仔落下，一勺勺把樹挖起來，放在平台船上。紅樹林植株與淤泥被運往對岸，準備用來保護社子島的堤防。\n\
    1964 年，政府為了改善淡水河上游的淹水問題，決定炸開關渡隘口，漲潮時海水長驅直入，導致關渡跟五股地區成為紅樹林能夠生長的環境。這一帶曾經有每年10 萬隻水鳥停棲的盛況，而為了保護水鳥，當時的農委會將關渡防潮堤外的55公頃灘地，公告成立「關渡自然保留區」。當時紅樹林面積只有3.5\
    \ 公頃，但紅樹林隨時間持續擴張，原本的泥灘地逐漸變為草澤，進而形成大面積的林澤，使得陸域範圍快速擴張，到了2022 年，紅樹林面積已經增加到41.8 公頃，擴張十倍以上。這嚴重壓縮原本生活在泥灘地的底棲生物的生存空間，如招潮蟹、彈塗魚、文蛤等，這些生物沒辦法生長在紅樹林環境，而鷸鴴科等水鳥也逐漸消失，種類減少30%以上，僅剩下樹棲型鳥類，物種多樣性銳減。\n\
    \  灘地消失、物種改變，紅樹林持續生長卻束手無策。依照《文資法》規定，自然保留區內「禁止改變或破壞其原有自然狀態」，是最嚴格禁止人為經營管理手段介入的保護區域類型，無法以疏伐等人為方式介入。直到2021\
    \ 年12 月解編，改依《濕地保育法》，這個區域成為關渡重要濕地的一部分，才能夠適度經營管理。\n改寫自我們的島/ 灘地回復｜為什麼這些地方必須清除紅樹林？"
