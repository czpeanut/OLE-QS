  stem: 以下的食物鏈，何者最符合文中所述的生態？
  options:
  - label: A
    content: 旗魚→飛魚→鬼頭刀→浮游生物
  - label: B
    content: 浮游生物→飛魚→鬼頭刀→旗魚
  - label: C
    content: 浮游生物→鬼頭刀→飛魚→鮪魚
  - label: D
    content: 鮪魚→鬼頭刀→飛魚→浮游生物
  group_stem: "黑潮中的海洋食物鏈\n    每年春夏時節，以浮游生物為食的飛魚，隨著黑潮向北迴游經過台灣東部，至彭佳嶼附近海域繁殖產卵。這些飛魚不僅是當地原住民的重要食材，更是多種大型魚類的獵物，例如鬼頭刀與鮪魚。鬼頭刀雖然是飛魚、丁香魚等小型魚類的殺手，但也會被旗魚、鮪魚等大型洄游魚類所獵食。因此，一道黑潮，幾種魚類，串起了豐富繁雜的海洋生態。\n\
    \    然而，這樣緊密相扣的生態系，也因為過度捕撈與海洋污染而面臨威脅。若其中一個環節改變，例如飛魚數量遽減，不只鬼頭刀將失去主要食物來源，整條食物鏈也可能因此失衡。為了確保海洋資源得以世代相傳，漁業工作者與政府已開始推動永續漁業的實踐。像是在飛魚繁殖季節劃設禁漁區，讓魚群有足夠時間繁殖；推廣定額捕撈制度，避免魚類資源被一次性掏空；甚至鼓勵漁民改用不傷害幼魚的漁具，減少對下一代魚群的破壞。"
