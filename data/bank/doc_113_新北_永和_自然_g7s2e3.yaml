    (三) 姬蛙（Microhyla nepenthicola）尺寸像一粒豌豆，可抵禦消化液酸度，於蘋果豬籠草（N. ampullaria）捕蟲籠中生長繁殖；成蛙可在豬籠草附近覓食，於籠內鳴叫求偶，再將卵產在捕蟲籠上，待卵孵化後，蝌蚪會在捕蟲籠內吃著淹死的昆蟲成長，排泄物也成為豬籠草的養分。

    豬籠草經長期演化，雖可在土壤貧脊的環境中生存，卻因人類開發導致其棲息地不斷縮減甚至消失，成立保護區也面臨遊客破壞，嚴重影響野外族群密度。由於外形和習性特殊，野生種豬籠草由原產地被採集販售至世界各地，須極力保護。生物學家嘗試以無毒染料塗抹某些珍稀種類的野生豬籠草植株，一旦發現待售的植株，查驗人員就可迅速判斷是否為非法野外盜取。根據《甲公約》規定，目前必須經申請並獲得公約許可證後才可進行豬籠草貿易。

    (內容改編自：臺灣博物館（2017.8.4.）https://ntmedu.blogspot.com/2017/08/blog-post_4.html )'
