  group_stem: "石虎的生存危機\n    淺山地區，泛指低海拔的丘陵區域，其中包含了溪流、草原、森林等等的自然環境，也包含了農田、果園、牧場等等的人類活動環境。這邊除了人類之外，也是很多野生動物的家園，例如石虎、穿山甲、鼬獾等。\n\
    \    石虎住在林地與草地的交界，以鼠類為主食，也會捕食野兔、鳥類、青蛙、蜥蜴、昆蟲、甚至是魚類等小動物。由於生活區域通常離農地很近，所以人類的農業活動很容易影響到石虎的生存。\n\
    \    石虎曾遍布台灣全島，隨著經濟起飛、城市發展，人類開始與生活在低海拔山區的石虎搶地，近年只剩苗栗、南投有石虎族群的分布。在石虎的棲地中，由於道路開入淺山地區，使得石虎有機會進入路面並遭到車輛撞擊，造成路殺的事件出現。此外，隨著人類活動深入山區，許多放養或走失的家犬進入石虎棲地，導致犬殺事件頻繁發生。不僅如此，流浪犬的活動也會驚擾石虎覓食與育幼，增加其生存壓力。犬隻還可能帶有疾病或寄生蟲，進一步威脅石虎健康，形成生態上的隱形殺手。\n\
    \    也有研究指出，施用在農田中的農藥、老鼠藥，透過食物鏈而層層累積到石虎體內，導致作為高階消費者的石虎，因高劑量的毒性而變得虛弱生病、容易出現路殺或是被獵捕。種種因素造成石虎數量大幅減少，而近親繁殖下又造成抗病能力降低，如此惡性循環之下，讓牠們的生存考驗日益嚴峻。\n\
    \    對此，農業部推動「友善石虎農作」，推廣在田間不使用除草劑、老鼠藥，且不放養犬貓等友善行動，營造石虎適合的棲地環境。而改採友善農作的農民也驚喜發現，農園的生態變得豐富起來，甚至還拍攝到石虎獵捕田間鼠類的影像，彰顯石虎在這個生態系中扮演控制鼠類數量的重要角色。"
