  section: 1
  number: 24
  type: single
  page: 2
  stem: 「無論是姓資、還是姓社，只要有用的，我們都要採用」此番談話的意思是，無論資本主義還是社會主義(共產主義)都要採用。依據課程所學，這番言論最可能出自何人之口？
