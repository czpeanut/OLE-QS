  section: 1
  number: 21
  type: single
  page: 2
  stem: 1980 年代後的中共在經濟上脫胎換骨，與過去毛澤東主政時期有很大的差異，兩者最主要的差異在於「改革開放」，改革開放後的中國經濟突飛猛進，令世人驚豔。請問，所謂的「改革開放」不包含以下何者？
  options:
  - label: A
    content: 廢除人民公社
  - label: B
    content: 整頓國營企業
  - label: C
