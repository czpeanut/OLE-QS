  section: 1
  number: 23
  type: single
  page: 2
  stem: 某年4 月，鄧小平藉著一次採訪的機會，對於當時的學生運動發表了談話：「這群學生是非法聚集，他們正在否定共產黨領導、否定社會主義制度」在此番談話不久後，便發生了震驚世人的事情。請問，這是何時的談話？鄧小平口中的學生正在何處聚集？
  options:
  - label: A
