- id: doc_113_台北_仁愛_社會_歷史_g8s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 改革開放後，中國大陸經濟競爭力大幅提升，但也出現下列哪一種社會現象？
  options:
  - label: A
    content: 共產主義盛行，私有財產消失
  - label: B
    content: 農村收入提高，大量青年返鄉
  - label: C
    content: 迅速達到全民共同致富的目標
  - label: D
    content: 區域、階級間的經濟發展不均
- id: doc_113_台北_仁愛_社會_歷史_g8s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 美國與中華人民共和國在冷戰時期屬於敵對陣營，雙方直接發生衝突，關係急遽惡化。上述情形與中華人民共和國的哪一場行動有關？
  options:
  - label: A
    content: 在國際乒乓球賽打敗美國
  - label: B
    content: 於1949 年出兵攻打金門
  - label: C
    content: 韓戰爆發後派兵支援北韓
  - label: D
    content: 在古寧頭戰役打敗蔣中正
- id: doc_113_台北_仁愛_社會_歷史_g8s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 中國大陸製造業蓬勃發展，被稱為「世界工廠」，主要有三個原因：一是中國是外資直接投資最多的國家；二是中國擁有世界上規模最大的消費市場；第三個原因可能為下列何者？
  options:
  - label: A
    content: 農業產值比重高
  - label: B
    content: 企業經營規模大
  - label: C
    content: 生產效率達最高
  - label: D
    content: 勞力充足工資低
- id: doc_113_台北_仁愛_社會_歷史_g8s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 中華人民共和國派遣志願軍參與朝鮮戰爭的可能原因為何？
  options:
  - label: A
    content: 避免中華民國的反攻
  - label: B
    content: 表明與蘇聯同一戰線
  - label: C
    content: 希望能獲得美軍裝備
  - label: D
    content: 打擊國內的反對勢力
- id: doc_113_台北_仁愛_社會_歷史_g8s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 西元1972 年美國總統尼克森訪問北京，雙方簽署《上海公報》，兩國展開「關係正常化」發展。當時中華人民共和國的實際領導人為下列何者？
  options:
  - label: A
    content: 毛澤東
  - label: B
    content: 胡耀邦
  - label: C
    content: 鄧小平
  - label: D
    content: 習近平
- id: doc_113_台北_仁愛_社會_歷史_g8s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 西元1973 年1 月，北越、南越、美國的代表在巴黎的飯店裡談判簽約，《越南終戰和平協定》於當日午夜火速生效，歷時多年的越戰終告結束。越戰的終結，我們可以作何解讀？
  options:
  - label: A
    content: 美軍最終贏得了戰爭
  - label: B
    content: 越南在1973 年分裂至今
  - label: C
    content: 這是冷戰時期的第一場軍事衝突
  - label: D
    content: 越南最終於1975 年統一
- id: doc_113_台北_仁愛_社會_歷史_g8s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 美國為了防堵共產主義的擴張，曾於1954 年9 月邀集英國、法國、澳洲等七國，簽訂了一份資料，目的在確保東亞地區的集體安全。請問，上述資料為何？
  options:
  - label: A
    content: 太平洋公約組織
  - label: B
    content: 東南亞公約組織
  - label: C
    content: 東亞和平倡議
  - label: D
    content: 東南亞共同防禦條約
- id: doc_113_台北_仁愛_社會_歷史_g8s2e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 二戰結束後不久，某地接著爆發戰爭，美國和聯合國軍隊前往支援※※國；於此同時，蘇聯與中共則選擇支援○○國。經歷了多年的戰爭，雙方商議以38 度線為界，某地走向政治分裂，許多家庭受到分離之苦。請問，以下說明何者正確？
  options:
  - label: A
    content: ※※國是北韓
  - label: B
    content: ○○國是南韓
  - label: C
    content: 這場戰爭的時間為1950-1953 年
  - label: D
    content: 中華民國也曾派兵參與此戰
- id: doc_113_台北_仁愛_社會_歷史_g8s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 歷史老師在課堂上多次強調：「西安事變救了共產黨，韓戰救了國民黨」，以下同學的解讀何者正確？
  options:
  - label: A
    content: 睿睿：西安事變迫使國民黨結束清黨
  - label: B
    content: 祥祥：韓戰促使美國派遣第七艦隊協防臺海
  - label: C
    content: 慈慈：韓戰後臺灣加入東約組織
  - label: D
    content: 以上同學全部答錯
- id: doc_113_台北_仁愛_社會_歷史_g8s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 柴契爾夫人(Margaret Thatcher)是英國史上第一位女性首相，素有「鐵娘子」之稱。1982 年時，柴契爾夫人發動福克蘭戰爭，在兩個多月的戰爭後，擊敗阿根廷，奪回福克蘭群島。挾著這股氣勢，柴契爾夫人於同年的9
    月前往中國，與中共當局針對某地的主權問題進行談判，此次的談判卻異常不順，柴契爾夫人離開談判禮堂時，還不慎摔下樓。請問，上述事件可以做何解讀？
  options:
  - label: A
    content: 雙方針對香港回歸進行談判
  - label: B
    content: 與柴契爾夫人談判的是毛澤東
  - label: C
    content: 該地最終於1999 年回歸中國
  - label: D
    content: 該地回歸後，中共將其設為經濟特區
- id: doc_113_台北_仁愛_社會_歷史_g8s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 1960 年代被學者稱為「激情且叛逆的世代」，以下哪件事情並非發生於1960 年代？
  options:
  - label: A
    content: 文化大革命
  - label: B
    content: 六四天安門事件
  - label: C
    content: 法國學運
  - label: D
    content: 高雄加工出口區成立
- id: doc_113_台北_仁愛_社會_歷史_g8s2e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 據學者估計，某一時期美、蘇擁有庫存驚人的核子武器，數量足夠殺死兩千四百億人、摧毀地球近八十次。此現象說明了何事？
  options:
  - label: A
    content: 美蘇陷入一種相互節制的情形
  - label: B
    content: 此即是冷戰，冷戰期間完全無戰爭
  - label: C
    content: 此情形自二戰期間便已經出現
  - label: D
    content: 美蘇的對立要到2010 年代才有所改善
