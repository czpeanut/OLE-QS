  section: 1
  number: 27
  type: single
  page: 3
  stem: 越南在歷史上曾與中國關係親近，甚至有很長一段時間為中國領土的一部分；十九世紀後，越南淪為某國的殖民地，在二戰期間被日本佔領；二戰後，因意識形態、政治體制之爭，分裂成兩國，多年後才歸統一。請問，越南曾是何者的殖民地？
  options:
  - label: A
    content: 英國
  - label: B
    content: 法國
  - label: C
    content: 德國
  - label: D
    content: 美國
