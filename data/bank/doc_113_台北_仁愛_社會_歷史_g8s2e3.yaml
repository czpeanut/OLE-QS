  section: 1
  number: 28
  type: single
  page: 3
  stem: 回顧改革開放的歷史，其發展路徑為：「領導人宣布改革開放→改革開放因某事受到挫折，改革政策退縮→在○○後，再度向市場經濟前進」請問，上文中的○○所指為何？
  options:
  - label: A
    content: 文化大革命
  - label: B
    content: 中美建交
  - label: C
    content: 南巡講話
