  section: 1
  number: 13
  type: single
  page: 2
  stem: 附圖是某一時期的中國政治宣傳版畫，圖片搭配上一行醒目的文字「中蘇同盟無敵於天下」，道盡了此時的中國外交政策。請問，以上海報最可能出現在哪一時期的中國？
  options:
  - label: A
    content: 1940 年代初期
  - label: B
    content: 1950 年代初期
  - label: C
    content: 1960 年代初期
  - label: D
    content: 1970 年代初期
