  section: 1
  number: 22
  type: single
  page: 2
  stem: 1960 年代的美國大學中出現了大規模的學運，學生們的訴求是「反戰」，學運就像野火般影響多個城市，迫使美國政府評估終止某場對外戰爭。請問，學生們反對的是哪一場戰爭？
  options:
  - label: A
    content: 第二次世界大戰
  - label: B
    content: 國共內戰
  - label: C
    content: 韓戰
  - label: D
    content: 越戰
