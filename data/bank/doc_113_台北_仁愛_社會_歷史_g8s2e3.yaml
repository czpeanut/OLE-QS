  section: 1
  number: 26
  type: single
  page: 3
  stem: '美國某一總統巧妙的平衡各國際勢力，單是1972 年就訪問了多地、提出了多項施政方針(如下表)。請問，這位美國總統最可能是何人？

    (一)訪問莫斯科，與蘇聯針對洲際飛彈、控制核潛艦數量的議題進行磋商

    (二)訪問中國，中美兩國「關係正常化」

    (三)針對越戰，提出「越戰越南化」的想法，將美軍逐步撤出越南'
  options:
  - label: A
    content: 尼克森
  - label: B
    content: 羅斯福
  - label: C
    content: 卡特
  - label: D
    content: 雷根
