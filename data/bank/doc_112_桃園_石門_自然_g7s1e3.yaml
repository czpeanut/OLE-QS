  stem: 「嚐到草莓軟糖的酸甜味而流出大量口水」以上敘述的神經傳導路徑為何？
  options:
  - label: A
    content: 運動神經元→舌頭→脊髓→感覺神經元→唾腺
  - label: B
    content: 感覺神經元→舌頭→小腦→唾腺→運動神經元
  - label: C
    content: 唾腺→運動神經元→大腦→感覺神經元→舌頭
  - label: D
    content: 舌頭→感覺神經元→腦幹→運動神經元→唾腺。
  group_stem: "(三) 聞到的味覺 \n觀察舌頭可以發現表面有許多細小的白色突起物，這突起物叫做舌乳頭，微小的味蕾便是埋在\n這些舌乳頭上。藉由味蕾可以感知到酸、甜、苦、鹹、鮮等五種主要的味覺，而舌頭上除了味蕾外，\n\
    還有其他的感覺細胞可以用來感知溫度、香料調味和辛辣程度等刺激。   \n科學家發現嘗到的味道，其實有75%～95%來自於嗅覺，這是因為在咀嚼的過程中所散發的氣\n\
    味分子，沿著鼻腔傳達到嗅覺細胞，這些細胞接受刺激後，所收集的資訊經由「嗅覺轉介」傳送給\n嘴巴，由此就可以知道食物的味道。   \n試著蒙住雙眼、捏住鼻子咀嚼草莓軟糖，隨著時間可以感覺到糖果由硬變軟以及帶來的酸甜味，\n\
    但是並不會感覺到草莓的香氣。當手放開，那些氣味分子傳達到了鼻腔，突然就能知道是草莓軟糖\n了！   \n除了嗅覺，視覺也是影響大腦判斷的一個重要因素。法國的研究人員將白酒以無特殊氣味的染\n\
    料變成紅色，然後請一群品酒專家描述所喝到的味道，而這些專家竟以對紅酒的敘述來評價這杯帶\n有顏色的白酒。   \n由這些實驗可以了解，味覺、觸覺、嗅覺及視覺皆影響了食物的滋味，每一種知覺都會影響大\n\
    腦的判斷，而食物的外觀與人體的嗅覺，也會影響對味道的判斷。"
