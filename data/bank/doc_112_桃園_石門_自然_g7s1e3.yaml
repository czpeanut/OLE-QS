- id: doc_112_桃園_石門_自然_g7s1e3_s3_47
  section: 3
  number: 47
  type: single
  page: 4
  stem: 關於駱駝調節體內水分恆定的方式，下列何者正確？
  options:
  - label: A
    content: 體表有豐厚的羽毛可防止水分從體表蒸散
  - label: B
    content: 呼氣時鼻孔到上唇間的裂縫能將蒸散的水氣收集回身體內
  - label: C
    content: 駱駝駝峰中有儲水囊，可供短期缺水時利用
  - label: D
    content: 缺水時，肝臟會將尿液濃縮，只排出對身體有害的代謝廢物。
  group_stem: "(二) 沙漠之舟的神祕絕活 \n在動物園中，時常可以看到駱駝站在陰涼樹下悠閒的反芻，觀察牠們的習性，會發現牠們很少\n排尿，若你觀察夠仔細，會發現在其尾部和後腳的地方有些條狀白色結晶，而排出的糞便呈現乾乾\n\
    的粒狀，其實這些都是駱駝適應乾旱與炎熱環境的聰明策略喔！   \n駱駝為可生活在沙漠中的哺乳動物，有著沙漠之舟的美名，其體表有豐厚的皮毛可防止水分從\n體表蒸散，在呼氣時鼻孔到上唇間的裂縫能將蒸散的水氣收集回身體內，在有水的環境中，駱駝胃\n\
    中有儲水囊，可供短期缺水時利用，在缺水時，腎臟會將尿液濃縮，使尿中水分再回收至循環系統，\n只排出對身體有害的代謝廢物，也就是在後腳看到的濃縮尿液結晶。若是長期缺水，便會將背上駝\n\
    峰儲藏的脂肪分解為能量和水。   \n駱駝對溫度的調節能力也十分驚人，體溫能夠介於34℃～41℃之間，可接受波動的範圍為6℃\n～7℃，反觀人類只要體溫差1℃就會生病，超過3℃便會危及生命。在酷熱環境中，駱駝能自動調\n\
    節升高體溫，到夜間才會慢慢散發，此機制讓駱駝不需通過汗液蒸發來散熱，也可減少水分流失。\n另外，駱駝接近腦部的血管有多條且彼此靠近的動脈與靜脈血管，由鼻腔較冷的靜脈血透過對流作\n\
    用讓腦中血液溫度維持穩定，是駱駝得以在沙漠中維持體溫恆定的重要構造。"
  tags:
    chapter:
      publisher: 翰林
      book: 七上
