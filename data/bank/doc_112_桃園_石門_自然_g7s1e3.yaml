- id: doc_112_桃園_石門_自然_g7s1e3_s3_45
  section: 3
  number: 45
  type: single
  page: 3
  stem: 糖尿病患者可能是哪一種激素分泌異常導致的？
  options:
  - label: A
    content: 胰島素
  - label: B
    content: 腎上腺素
  - label: C
    content: 甲狀腺素
  - label: D
    content: 生長激素。
  group_stem: "(一) 飲食新風潮--低GI 飲食 \n升糖指數（GI）是由加拿大多倫多大學大衛詹金斯博士（Dr. David Jenkins）於西元1980\
    \ 年提出。\n此指數表示吃完食物的2 小時後，經過消化所產生的糖分造成血糖上升幅度的高低，以0～100 這個區間\n內的數值呈現，攝取之食物的GI 值愈高，血糖上升的速度愈快。\
    \   \n升糖指數最初是針對糖尿病患者的飲食控制所提出的概念，因為對於糖尿病患者而言，維持血糖的平\n衡是非常重要的，若食用太多高GI 的食物，會導致血糖在短時間內上升，引發心跳加速、嘔吐、噁心等症\n\
    狀，嚴重一點則會神智不清甚至昏迷，因此建議患者避免食用GI 值高於60 的食物，以免造成血糖失控。   \n低GI 食物在近幾年也掀起了一股新型的飲食風潮，低GI\
    \ 食物除了有助於患者控制血糖，其實也有助\n於減重，因為低GI 食物在消化吸收速度上比較緩慢，可以提供減重族們飽足感而不容易感到飢餓。但需要\n注意的是，低GI\
    \ 的食物並不代表低熱量，所以減重族們在飲食的調控上還是要特別注意，避免食用過多低\nGI 但熱量高的食物，像是堅果、花生等；而食物的加工與烹調也會影響GI\
    \ 值，少加工、烹調方式愈簡單\n的GI 值會比較低，像是炒青菜的GI 值會比生菜來得高。有在進行體重控制的人，謹記以上小知識來選擇\n食物，才能真正達到減重的效果。"
