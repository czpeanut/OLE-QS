  type: single
  page: 2
  stem: 「馬勒的旋律哀傷又優美，A 段完了換B 段，B 段完了換C 段，再回到A 或B，頂多稍微變化一下，不像貝多芬那樣苦心經營，一小段、一小段往前推，像數學證明題，一步錯不得。聽貝多芬，你不能分神，錯過一段都不行。聽馬勒，你可以隨時分神，隨時回來，因為每一段都很動人，而且每一段似乎都很熟悉。馬勒教導我們，不一定要貝多芬的邏輯和意義，生活可以每一段都很愉快，不一定死要逗成一整塊。我以前太愛逗了，逗來逗去，怎麼也拼不出一整塊來。破碎的雞蛋殼怎麼拼得圓滿光滑呢？」（呂正惠〈馬勒拯救我於炎炎夏日〉）下列敘述，何者最符合「破碎的雞蛋殼怎麼拼得圓滿光滑呢」的體會？
  options:
