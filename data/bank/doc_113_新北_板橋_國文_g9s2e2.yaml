  stem: 「影評在主觀性和客觀性之間怎樣定位，要看你的目標讀者是誰，亦反映了你本身的個性及觀念。如果你定位是『消費指南』，是寫給那些想先看影評再決定是否買票進場的人看的，你便會避免透露關鍵情節，著重觀眾預期是否得到滿足，也很少會在必須先看過電影才能了解的細節上探究。若你是寫給那些資深影迷，或期望在評論文章中得到新知識及見解的讀者，並預期他們是在觀影之後尋求更深入的鑑賞，你便可能乾脆從結局開始說起。」（賴勇衡〈如何成為影評人？給入門者的建議〉）根據這段文字，如果將影評定位為「消費指南」，下列何者為寫作時應該著重的內容？
