- id: doc_113_新北_板橋_國文_g9s2e2_s2_35
  section: 2
  number: 35
  type: single
  page: 5
  stem: 下列哪項最能反映清朝前期對台灣的統治態度？
  options:
  - label: A
    content: 對台灣關注度不高，視之為邊陲之地
  - label: B
    content: 積極經營，視為東亞貿易重鎮
  - label: C
    content: 強化軍事控制，積極推動移民開墾
  - label: D
    content: 設立眾多學校，推動文化教育
  group_stem: "(二)                        清朝統治下的台灣：發展與變遷  \n    清朝於1683 年正式將台灣納入版圖，結束了鄭氏家族的統治。起初，清政府對台灣的態度較為消極，視之為「化外之地」，但隨著移民增多及經濟價值的提升，統治策略逐漸改變，開始加強治理與開發。\
    \   \n清廷在台灣設立台灣府，隸屬於福建省，下轄三縣：台灣縣、鳳山縣與諸羅縣。至十九世紀，台灣人口激增，社會發展日趨複雜，清廷逐步增設行政區劃，如淡水廳、彰化縣等，以維持治理。由於來台移民多來自福建、廣東，閩南文化與客家文化在台灣紮根，形成豐富的地方特色。\
    \   \n    清朝統治期間，台灣的經濟發展以農業為主，主要作物包括稻米、甘蔗與茶葉。此外，台灣亦成為東亞貿易的重要樞紐，對外輸出蔗糖與樟腦。鹿港、安平等地成為貿易港口，吸引商人往來，促進經濟繁榮。然而，政府為了控制資源，對貿易實施許多限制，如禁止對外貿易或限制某些特定商品的輸出，導致部分商人轉向私下交易。\
    \   \n    由於土地資源有限，加上移民眾多，台灣時常爆發械鬥與民變，例如漳泉械鬥、客閩衝突等。十九世紀，戴潮春事件、林爽文事件等大規模反抗運動更讓清廷意識到治理台灣的困難。面對這些問題，政府派遣官員鎮壓，但治理效果有限，最終影響了台灣的安定。\
    \   \n    十九世紀後期，隨著國際局勢變化，台灣逐漸成為列強關注的焦點。1884 年爆發中法戰爭，法軍一度攻佔基隆與淡水，清廷遂於1885 年將台灣升格為行省，加強防務。然而，1895\
    \ 年甲午戰爭後，清朝戰敗，簽訂《馬關條約》，將台灣割讓給日本，結束了兩百多年的清朝統治，開啟台灣歷史的新篇章。"
