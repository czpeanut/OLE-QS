    \ \n頭頂與河童一樣有一個圓圓的盤子。在山裡走路或者勞作的人們只要不做冒犯他們的事，並準備一些 \n他們最喜歡吃的飯糰，他們就十分樂意幫助人們在山裡挑東西、搬重物。不過，在和他們打交道時也得\
    \ \n留個心眼兒：一定要在搬完東西後再給他們吃的，否則山童先吃了飯糰可能會中途偷偷溜 \n掉。         。這恐怕也是妖怪世界讓人感到親切的原因之一吧！」（薛燕平\
    \ 〈怪談：日 \n本動漫中的傳統妖怪〉）根據文意推論，畫線處應填入何者？"
  options:
