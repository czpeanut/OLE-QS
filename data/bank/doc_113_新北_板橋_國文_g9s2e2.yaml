- id: doc_113_新北_板橋_國文_g9s2e2_s2_37
  section: 2
  number: 37
  type: single
  page: 6
  stem: 若【甲】、【乙】二文所敘寫的皆是「與家長互動」的成長經驗，下列敘述，何者正確？
  options:
  - label: A
    content: 皆在遭受挫折後尋求家長協助
  - label: B
    content: 皆嘗試與家長溝通內心的想法
  - label: C
    content: 皆在溝通後獲得自由發展機會
  - label: D
    content: 皆對自己曾經的任性感到後悔
  group_stem: "【甲】風箏曾無拘無束，享受著風的安撫，卻不知在何時，被線緊緊拽住：「去迎接更多的挑戰，離天空更近一步！」風箏不知道那條與自己最親密相連的線，為什麼會變得如此殘酷。即使飛向高空不是它的理想，它還是乖乖順服。但強風呼嘯，並沒有讓它飛得更高。搖搖欲墜的它說服線，將主導權交給一個小孩，隨心所欲地飛，迎向新的未來。（改寫自陳冠曄〈風箏〉）\
    \  \n \n【乙】母親只買回了七尺布，我悔恨得很，為什麼不敢自己去買。我說：「媽，七尺是不夠的，要八尺才夠做。」母親說：「以前做七尺都夠，難道你長高了嗎？」我一句話也不回答，使母親自覺地矮了下去。\
    \ \n母親仍按照舊尺碼在布上畫了一個我，然後用剪刀慢慢地剪，我慢慢地哭，啊！把我剪破， 把我剪開，再用針線縫我，補我，……使我成人。（蘇紹連〈七尺布〉）"
