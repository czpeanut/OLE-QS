  - label: D
    content: 聞嫗房中有聲嗚嗚然：韓氏子
  group_stem: '（一）江浙之俗信巫鬼，相傳人死則其魄復還，以其日測之，某日當至，則盡室出避於外，名為避放。命壯僕或僧守其廬，布灰於地，明日，視其跡，云受生為人為異物矣。鄱陽民韓氏嫗死，倩族人永寧寺僧宗達宿焉。達瞑目誦經，中夕，聞嫗房中有聲嗚嗚然，久之漸厲，若在甕盎間，蹴蹋四壁，略不少止，達心亦懼，但益誦首楞嚴咒，至數十過。天將曉，韓氏子亦來，猶聞物觸戶聲不已，達告之故，偕執杖而入。見一物四尺，首戴一甕，直來觸人。達擊之，甕即破，乃一犬呦然而出。蓋初閉門時，犬先在房中矣，甕有糠，伸首舐之，不能出，故戴而號呼耳。《夷堅志‧韓氏放鬼》

    【注釋】(1)以其日測之：以人去世的日子推測。  (2)受生為人為異物：出生當人或當其他生物。  (3)倩：請。  (4)盎：腹大而口小的用器。 (5)蹴蹋：音ㄘㄨˋ
    ㄊㄚˋ，踢、踏。   (6)首楞嚴咒：佛經的一種。  (7)呦：音ㄧㄡ，叫聲。'
