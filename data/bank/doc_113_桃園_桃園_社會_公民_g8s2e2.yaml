  section: 1
  number: 33
  type: single
  page: 1
  stem: 「告訴」與「告發」是刑事訴訟過程中的兩種程序，關於兩者的主要差別，下列敘述何者正確？
  options:
  - label: A
    content: 被害人或其家屬只能提出「告訴」，此外的第三人只能提出「告發」
  - label: B
    content: 檢察官負責受理「告發」，「告訴」應向直接向法院提出
  - label: C
    content: 「告訴」請求追究犯罪者的刑事責任，「告發」則是單純舉發犯罪事實
  - label: D
    content: 任何人均有權針對犯罪行為提出「告訴」，「告發」必須委託檢察官提出。
