  section: 1
  number: 35
  type: single
  page: 1
  stem: '小杜向朋友借一部影集回家觀賞，影集內容與一件刑事案件有關，但因包裝盒破損，僅剩部分劇情說明可辨識，如表所示。根據我國現行法律判斷，若將四張光碟片按照案件處理的先後次序排列，則其順序應為下列何者？


    | 光碟 | 劇情說明 |

    |---|---|

    | 甲 | ……只剩這個機會，法院能否推翻先前判決還他清白……。 |

