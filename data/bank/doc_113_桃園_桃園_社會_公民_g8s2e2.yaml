  section: 1
  number: 31
  type: single
  page: 1
  stem: 社會勞動制度仿效歐美盛行已久的「社區服務」，限於刑罰輕微的案件，包括受六個月以下有期徒刑或拘役的宣告者，或罰金刑案件須宣告行為六個月以下有期徒刑併科罰金，且罰金易服勞役期間一年以下者，可聲請以此代替入監服刑，藉由提供一定時數的無償勞動或服務回饋社會。有關此項制度的補充，哪一項是正確？
  options:
  - label: A
    content: 實施的對象僅限於乙區行為
  - label: B
    content: 此制度僅針對甲區部分行為
  - label: C
    content: 回饋的對象以乙區行為為主
  - label: D
    content: 行為將於結束後由甲改為乙。
