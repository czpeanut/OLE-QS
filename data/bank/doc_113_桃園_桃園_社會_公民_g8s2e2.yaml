  section: 1
  number: 40
  type: single
  page: 2
  stem: 民國88 年到102 年，有關駕駛動力交通工具肇事，致人死傷而逃逸者，其法條規定上出現何項變化？
  options:
  - label: A
    content: 在主刑中附加從刑的處罰
  - label: B
    content: 提高了自由刑的處罰刑度
  - label: C
    content: 加入剝奪財產的單章規定
  - label: D
    content: 由剝奪自由轉為剝奪生命。
  group_stem: 民國88 年《刑法》增訂第185 條之4 規定：駕駛動力交通工具肇事，致人死傷而逃逸者，處6 月以上5 年以下有期徒刑；民國102 年提高刑度到1
    年以上7 年以下。但大法官認為，法條中「肇事」一詞不明，且處罰對情節輕微個案顯然過苛，宣告違憲。因此，民國110 年修正《刑法》，「肇事」改為「發生交通事故」，也就是不管有沒有故意過失，只要發生交通事故，就不能離開現場，須通知警察處理、協助就醫。另外也對「致人傷害而逃逸」、「致人於死或重傷而逃逸」兩種情形在法定刑上做出區分。請回答下列問題：
