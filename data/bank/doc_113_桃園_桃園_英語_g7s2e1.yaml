  options:
  - label: A
    content: It needs power.  need 需要
  - label: B
    content: It charges a cellphone.
  - label: C
    content: It is the most expensive one.  the most 最
  - label: D
    content: It gives light after people play with it.
  group_stem: 'In Mr. Lin’s class, students are talking about new things.


    Eric: I read about “Soccket” from the online news. It is a soccer ball, but it
    can also make power. Play with it for thirty minutes, and then it gives light
    for a long time. It is about NT$2,000.


    Amy: “GravityLight” is a lamp, and it works with no batteries. Just pull up a
    heavy bag with a rope. The bag goes down, and it makes light for 20 minutes. Guess
    what? It is only NT$150.


    Roger: There is a cool video about “Energy Skateboard!” People ride it, and this
    special skateboard can save energy for them. After that, they can use the energy
    to charge small devices, like a cellphone or a lamp. However, it’s very expensive.


