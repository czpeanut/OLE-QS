- id: doc_113_新北_福和_國文_g7s2e1_s4_30
  section: 4
  number: 30
  type: single
  page: 4
  stem: '從圖一與文章內容，我們無法得知何項訊息？

    (現代詩文閱讀題組)'
  options:
  - label: A
    content: 病況的進程
  - label: B
    content: 病毒的起源
  - label: C
    content: 麻疹的潛伏期
  - label: D
    content: 染上麻疹會有的症狀
  group_stem: "麻疹是一種急性、高傳染性的病毒性疾病，疫苗施打前，超過99%的人都會被感染，幾乎每個人一生中都難逃麻疹侵襲，較嚴重者會併發中耳炎、肺炎或腦炎。麻疹傳染力極高，可經由空氣、飛沫傳播，或是直接接觸病人的鼻腔或咽喉分泌物感染，距離病患1至2公尺內皆為飛沫傳染範圍，病毒可在空氣中停留2小時，只要走過，就可能被感染。出疹的前後4天內皆具有傳染力，因此感染麻疹或有疑似症狀者應配戴口罩、實施自我隔離，並通知所在地衛生所協助安排就醫，以避免傳染給沒有免疫力的人。\n\
    \    得過麻疹的人，對麻疹終身免疫。1976年前台灣麻疹曾一度大流行，因此40歲以上的民眾大多都有抗體，20歲以下的年輕族群第二劑MMR疫苗接種率已超過97％、保護力還夠，但研究指出，1981年後出生的成人，小時候接種麻疹疫苗的抗體效力，可能隨著時間衰退而使保護力變低。所有不曾得過麻疹，或不曾接種麻疹疫苗者，都可能感染麻疹；另外，嬰兒自母體得來的抗體只能持續6至9個月。\n\
    \    打疫苗是預防麻疹的最好方法，建議滿1歲時及滿5歲進入小學前各接種一劑麻疹、腮腺炎、德國麻疹混合疫苗（MMR），其餘民眾也可自費接種麻疹疫苗。近年研究顯示，麻疹疫苗有效期約15年，不確定是否曾感染麻疹，或曾接種疫苗，擔心抗體減少、消失者，若需前往流行地區，可先就醫評估接種需求。\n\
    改寫自YAHOO早安健康網路新聞、HEHO網路文章"
