    \n    目前的地震前兆研究都還在發展階段，因此要在地震前幾週、幾天就預測到地震的發生，就現在技術而言還做不到，但是重要的是在收到「地震預警」時能有一點應變時間，把地震可能帶來的傷害降到最低。\n\
    \n要觸發強震即時警報，就必須滿足以下條件之一：\n    1.地震預估規模 5.0 以上，預估震度達 4 級以上的縣市\n    2.地震預估規模 6.5\
    \ 以上，預估震度達 3 級以上的縣市\n滿足這些條件的地區，氣象署便會透過「災防告警細胞廣播訊息系統」（Public Warning System, PWS），以手機通知民眾強震即將來襲。而有時民眾可能在地震搖晃後才收到警報，或感覺劇烈搖晃卻未收到通知，原因則包括：\n\
    \    1.所在區域距震央太近，屬於預警盲區。\n    2.手機所在位置信號不穩，無法即時接收警報。\n    3.手機當下的高耗能操作（如通話、遊戲）影響警報顯示。\n\
    \n    地震發生時，即便警報系統已發揮作用，但最重要的還是應變行動，大家也要記住地震時要「趴下、掩護、穩住」，把地震可能帶來的災害降到最低！\n改寫自〈嘉義6.4強震！地震預警是怎麼做到的？原來預警、預測、預報不一樣！〉"
