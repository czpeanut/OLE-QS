- id: doc_113_新北_福和_國文_g7s2e1_s4_33
  section: 4
  number: 33
  type: single
  page: 5
  stem: '根據本文，下列關於地震預警的敘述，何者為非？

    (素養題)'
  options:
  - label: A
    content: 要能做到地震預警，關鍵是利用地震發生時產生的震波特性
  - label: B
    content: 地震發生前會產生兩種主要的地震波，分別為P波與S波
  - label: C
    content: 氣象署會利用P波與S波傳遞的時間差發布地震國家警報
  - label: D
    content: 震波S波傳遞速度慢，破壞力大於P波的破壞力
  group_stem: "1月21日凌晨0時17分，嘉義縣大埔鄉發生規模6.4強震，國家警報大響，全台明顯搖晃，甚至傳出房屋倒塌災情，那我們的「地震預警」究竟是怎麼做到的呢？\n\
    \n地震預警的原理是什麼？\n    其實在去年中央氣象署就為大家解答過，要做到地震預警，關鍵就在於充分利用地震波的特性，也就是地震發生時會產生的兩種主要震波「P波和S波」。P波質點與波行進方向相同、傳遞速度快，破壞力弱，會產生上下振動；而S波則是質點與波行進方向垂直、傳遞速度慢，破壞力強，產生水平振動。而P波跑得更快一些，在偵測到它以後就能快速計算出地震的規模、位置與深度，以便推估破壞力更勝一籌的S波可能造成的震度和抵達時間。由於電磁波傳遞速度遠快於地震波，挾著這樣的優勢，氣象署就能在S\
    \ 波到達前發出警報！\n\n地震預警（Earthquake Early Warning）\n    地震預警是在「地震已經發生、破壞性震波到達前」預估地震的搖晃程度、多久後抵達，並發送警報，方便民眾在十幾秒的空檔裡，趕緊掩護避災，這就是大家會在手機中收到的國家警報。\n\
    \n地震預測（Earthquake Prediction）\n    地震預測則是在「地震發生前」，預測未來地震發生的時間、位置和規模，這樣才稱得上準確的預測，例如：美國加州的聖安德里斯斷層會在3天內發生規模6\
    \ ~ 7的地震。準確的地震預測有助於事先防災、撤離人員。但是要注意的是，地震釋放能量的源頭是斷層，科學家對地震發生的機制與過程還在充分理解當中，目前由於技術限制，地震預測還沒有辦法作為發布預警的依據。\n\
    \n    目前的地震前兆研究都還在發展階段，因此要在地震前幾週、幾天就預測到地震的發生，就現在技術而言還做不到，但是重要的是在收到「地震預警」時能有一點應變時間，把地震可能帶來的傷害降到最低。\n\
    \n要觸發強震即時警報，就必須滿足以下條件之一：\n    1.地震預估規模 5.0 以上，預估震度達 4 級以上的縣市\n    2.地震預估規模 6.5\
    \ 以上，預估震度達 3 級以上的縣市\n滿足這些條件的地區，氣象署便會透過「災防告警細胞廣播訊息系統」（Public Warning System, PWS），以手機通知民眾強震即將來襲。而有時民眾可能在地震搖晃後才收到警報，或感覺劇烈搖晃卻未收到通知，原因則包括：\n\
    \    1.所在區域距震央太近，屬於預警盲區。\n    2.手機所在位置信號不穩，無法即時接收警報。\n    3.手機當下的高耗能操作（如通話、遊戲）影響警報顯示。\n\
    \n    地震發生時，即便警報系統已發揮作用，但最重要的還是應變行動，大家也要記住地震時要「趴下、掩護、穩住」，把地震可能帶來的災害降到最低！\n改寫自〈嘉義6.4強震！地震預警是怎麼做到的？原來預警、預測、預報不一樣！〉"
