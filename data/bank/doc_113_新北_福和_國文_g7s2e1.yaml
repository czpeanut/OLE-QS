    \  定伯因復擔鬼，鬼略無重。如是再三。定伯復言：「我新死，不知鬼悉何所畏忌？」鬼答曰：「唯不喜人唾。」\n    於是共行，道遇水，定伯命鬼先渡，聽之，了無聲。定伯自渡，漕漼作聲。鬼復言：「何以作聲？」定伯曰：「新死不習渡水耳，勿怪！」\n\
    \    行欲至宛市，定伯便擔鬼至頭上，急持之，鬼大呼，聲咋咋，索下，不復聽之。徑至宛市中，著地化為一羊，便賣之。恐其變化，唾之，得錢千五百，乃去。\n \
    \   當時有言：「宗定伯賣鬼，得錢千五百。」\n曹丕《列異傳》"
