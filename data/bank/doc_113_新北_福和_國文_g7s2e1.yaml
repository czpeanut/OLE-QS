- id: doc_113_新北_福和_國文_g7s2e1_s4_27
  section: 4
  number: 27
  type: single
  page: 3
  stem: '根據本文，下列何者最能顯示出女性在古代較不受重視的意識？

    (古典詩文閱讀題組)'
  options:
  - label: A
    content: 父母無德，惟生六女，無有一男，雖有如無
  - label: B
    content: 東治都尉及屬城長吏，多有死者
  - label: C
    content: 汝輩怯弱，為蛇所食，甚可哀憐
  - label: D
    content: 寄乃告請好劍及咋蛇犬
  group_stem: "東越閩中，有庸嶺，高數十里，其西北溼地有大蛇，長七八丈，大十餘圍，土俗常懼。東冶都尉及屬城長吏，多有死者。祭以牛羊，故不得福，或與人夢，或下諭巫祝，欲得啖童女年十二三者。都尉、令、長，並共患之，然氣厲不息，乃請求人家婢子，或有罪家女養之，至八月朝，祭送蛇穴口，蛇出吞囓之。累年如此，已用九女。\n\
    \    爾時預復募索，未得其女，將樂縣李誕，家有六女，無男。其小女名寄，應募欲行。父母不聽。寄曰：「父母無德，惟生六女，無有一男，雖有如無。女無緹縈濟父母之功，既不能供養，徒費衣食，生無所益，不如早死。賣寄之身，可得少錢，以供父母，豈不善耶？」父母慈憐，終不聽去。寄自潛行，不可禁止。\n\
    \    寄乃告請好劍及咋蛇犬。至八月朝，便詣廟中坐，懷劍，攜犬。先將數石糕餅，用蜜漿灌之，以置穴口。蛇便出。頭大如穀倉，目如二尺鏡，聞餅香氣，先啖食之。寄便放犬，犬就囓咋，寄從後斫①\
    \ 得數創。創痛急，蛇因躍出，至庭而死。寄入視穴，得其九女骷髏，悉舉出，吒言曰：「汝輩怯弱，為蛇所食，甚可哀憐！」於是寄緩步而歸。\n    越王聞之，聘寄為后，拜其父為將樂令，母及姐皆有賞賜。自是東冶無復妖邪之物。\n\
    （改寫自干寶《搜神記‧李寄》）\n注釋\n① 斫：音ㄓㄨㄛˊ，砍。"
