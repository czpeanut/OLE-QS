  section: 1
  number: 1
  type: single
  page: 1
  stem: 在接通的電路中，有關導線上的電流敘述，何者錯誤?
  options:
  - label: A
    content: 電流由正極流向負極，因為是正電荷在流動
  - label: B
    content: 當電子通過燈泡後，造成燈泡發亮，但是電流大小不變
  - label: C
    content: 電子流由負極流向正極，是由負電荷在移動
  - label: D
    content: 電流的單位為庫倫/秒，也就是安培。
