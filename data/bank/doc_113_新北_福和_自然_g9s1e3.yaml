  stem: 某日小伍跟著愛爬山的父親爬上了標高3950 公尺的玉山主峰，累翻了的小伍說：「難得來到台灣最高點，我想在山上待一整天，然後利用一整天，早上看日出，傍晚看日落。」父親回他：「時間可能不夠，明天早上要趁白天下山。不過，我們倒是可以在明天一早，看日出順便看月落。」請問小伍父子二人上山的時間及月相如何？
