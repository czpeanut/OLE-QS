  group_stem: '題組: 請在閱讀下列敘述後，回答下列11、12 題。

    芯妤為了要了解歐姆式導體電阻與它的長度、截面積及材料三者關係，而設計了「影響導體電阻大小因素」的探究實驗。附表提供了可以選擇的相關材料與型式的導體，分別以甲～庚表示，試回答下列問題：


    | 導體代號 | 長度（m） | 截面積（mm$^{2}$） | 材料 |

    | :--- | :--- | :--- | :--- |

    | 甲 | 1.0 | 0.2 | 銅 |

    | 乙 | 1.0 | 0.4 | 銅 |

    | 丙 | 1.0 | 0.6 | 銅 |

    | 丁 | 0.5 | 0.4 | 銅 |

    | 戊 | 1.5 | 0.4 | 銀 |

    | 己 | 1.0 | 0.4 | 銀 |

    | 庚 | 2.0 | 0.4 | 銀 |'
