  stem: 小鄭某日早上來到野柳附近海邊釣魚，見到各式奇形怪狀的蕈狀石，於是隨便找了一塊頂面較平坦，離水面高約4 公尺的礁石，坐下開始垂釣，在風平浪靜的徐徐海風吹拂下，也就睡著了。過了幾小時，發現海水已到腳邊，眼見海水就要漲上來了，下一瞬間卻又神奇地慢慢退去，沒多久就被附近的漁船救上岸。其實小鄭到野柳前已先參考中央氣象局的潮汐預報表如附圖，當天到野柳是早上的乾潮時刻。請你找出小鄭最有可能是哪一天去野柳的?
