- id: doc_113_新北_福和_自然_g9s1e3_s1_38
  section: 1
  number: 38
  type: single
  page: 4
  stem: '請你根據所學的天文知識，挑選正確的敘述補充至新聞報導中。

    甲：大台北地區能看到部分太陽被遮住的日偏食

    乙：太陽離地球較近，所以看起來比較大，月球無法完全遮住太陽，才形成日環食

    丙：發生日環蝕的當日正好是夏至，但兩者並無關連

    丁：若農曆當月初一發生日食，十五天後地球別的地區一定會發生月食'
  options:
  - label: A
    content: 甲乙丙丁
  - label: B
    content: 甲乙丙
  - label: C
    content: 甲丙丁
  - label: D
    content: 甲丙。
  group_stem: '題組: 請回答下列第38、39 題

    2020 年6 月21 日新聞報導：本次的日環食帶會通過台灣本島中部縣市，包含雲林、嘉義、台南、高雄、花蓮、台東，離島的金門與澎湖也能觀測到日環食，而台灣其餘其他地區也可觀測到日食。整個「日環食」將於6/21（日）下午2
    點49 分開始、5 點25 分結束，全程為2 小時36 分鐘。錯過這次的日環食，下次得等到2074 年、並且要到馬祖地區才能看到，而台灣本島下次能見到日環蝕的時間則為2215
    年。'
