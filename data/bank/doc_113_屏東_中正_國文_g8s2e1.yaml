- id: doc_113_屏東_中正_國文_g8s2e1_s5_5
  section: 5
  number: 5
  type: single
  page: 4
  stem: 「我努力聽海頓、莫札特，也努力聽孔子、孟子、柏拉圖和莎士比亞。不管是聽音樂或讀書，我學會了去尋找那裡面的『人的訊息』，也就是作為人，我能特別理解感應的部分。我相信，他們在對我說話，他們不是在講什麼抽象的、冷冰冰的知識，或玩什麼硬梆梆的形式，那裡面有他們柔軟的心，會碰觸到我自己內在柔軟的心。擁有那樣聆聽音樂與書籍的『內在耳朵』，是我這一生最大的幸福。」（楊照
    找到音樂與書籍裡的「柔軟的心」）上文中，作者所謂的「內在耳朵」最接近下列何者？
  options:
  - label: A
    content: 化具體為抽象的能力
  - label: B
    content: 顛覆傳統的創新發現
  - label: C
    content: 對於文化的全面觀照
  - label: D
    content: 與創作者的心靈感應
