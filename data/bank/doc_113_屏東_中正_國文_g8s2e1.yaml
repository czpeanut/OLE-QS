  stem: 根據本文，下列哪一張圖是作者所認識的「強者」，會使用的一套歸因模式？
  options:
  - label: A
    content: ''
    asset:
      key: optA
      file: doc_113_屏東_中正_國文_g8s2e1/5_1_optA.png
  - label: B
