- id: doc_113_屏東_中正_國文_g8s2e1_s4_1
  section: 4
  number: 1
  type: single
  page: 1
  stem: 下列引號中的字，何者意思前後相同？
  options:
  - label: A
    content: 切回岸「緣」／無「緣」無故
  - label: B
    content: 感激涕「零」／草木凋「零」
  - label: C
    content: 「鎮」日奔波／冰「鎮」水果
  - label: D
    content: 賞賜百千「強」／脅迫勉「強」
- id: doc_113_屏東_中正_國文_g8s2e1_s4_2
  section: 4
  number: 2
  type: single
  page: 1
  stem: 下列引號中的注音寫成國字後，何組字形兩兩相同？
  options:
  - label: A
    content: 步人後「ㄔㄣˊ」／閉目「ㄔㄣˊ」思
  - label: B
    content: 臨風顧「ㄆㄢˋ」／「ㄆㄢˋ」若兩人
  - label: C
    content: 漫不「ㄐㄧㄥ」心／累月「ㄐㄧㄥ」年
  - label: D
    content: 「ㄧˊ」態萬千／「ㄧˊ」風易俗
- id: doc_113_屏東_中正_國文_g8s2e1_s4_3
  section: 4
  number: 3
  type: single
  page: 1
  stem: 下列引號中的詞語，何者使用最恰當？
  options:
  - label: A
    content: 面臨失業的毛利小五郎「屹立」在街頭，眼神空洞，不知該何去何從
  - label: B
    content: 剛畢業的基德總是「憧憬」著美好的未來，並用熱情去築自己的夢
  - label: C
    content: 新一若真的為她好，就別再「探望」她的傷心處，讓她好好沉澱一下
  - label: D
    content: 雖然園子擁有「懸殊」的金銀財寶令人稱羨，但處處提防，過得也不安心
- id: doc_113_屏東_中正_國文_g8s2e1_s4_4
  section: 4
  number: 4
  type: single
  page: 1
  stem: 「我已在佛前求了五百年」使用了「誇飾」修辭技巧，下列詩句，何者沒有使用此修辭技巧？
  options:
  - label: A
    content: 身子比影子還輕／連蒼蠅都可以將他撞翻
  - label: B
    content: 左邊的鞋印才下午／右邊的鞋印已黃昏
  - label: C
    content: 知道思念從此生根／浮雲白日／山川莊嚴溫柔
  - label: D
    content: 媽媽那幀含淚的照片／擰了三十多年／仍是溼的。
  lesson_raw:
    title: 一棵開花的樹
    basis: 引用席慕蓉〈一棵開花的樹〉原句
- id: doc_113_屏東_中正_國文_g8s2e1_s4_5
  section: 4
  number: 5
  type: single
  page: 1
  stem: 「軍書十二卷、同行十二年」，句中的「十二」均非指實際數字，而是指「很多」的意思。下列引號的數字，何者是指實際的數字？
  options:
  - label: A
    content: 「三」折肱為良醫
  - label: B
    content: 「三」思而後行
  - label: C
    content: 「三」人成虎
  - label: D
    content: 報得「三」春暉
  lesson_raw:
    title: 木蘭詩
    basis: 引用木蘭詩原句
- id: doc_113_屏東_中正_國文_g8s2e1_s4_6
  section: 4
  number: 6
  type: single
  page: 2
  stem: 下列引號中的疊字詞，何者使用正確？
  options:
  - label: A
    content: 昔日所種下的小樹，如今已「絲絲」如蓋了
  - label: B
    content: 老闆看到顧客上門，立刻笑臉「盈盈」，熱情招待
  - label: C
    content: 窗外「唧唧」的雨聲，更添百無聊賴的愁緒
  - label: D
    content: 「啾啾」的馬蹄聲迴盪在原野，自有一股蒼涼的氣息
- id: doc_113_屏東_中正_國文_g8s2e1_s4_7
  section: 4
  number: 7
  type: single
  page: 2
  stem: 下列四個句子，何者沒有語病？
  options:
  - label: A
    content: 信用卡盜刷事件衝擊金融業，各家銀行莫不人人自危
  - label: B
    content: 歹徒靠智慧來犯罪，遑論當局者人謀不臧
  - label: C
    content: 塑膠貨幣的危機，愕然在社會上掀起軒然大波
  - label: D
    content: 科技帶給人們許多便利，縱然潛藏著許多危機
- id: doc_113_屏東_中正_國文_g8s2e1_s4_8
  section: 4
  number: 8
  type: single
  page: 2
  stem: 下列文句引號中的成語，何者使用最恰當？
  options:
  - label: A
    content: 武藏和佐佐木的關係原本很好，最近卻因對事情的看法不同而搞到「水乳交融」的地步
  - label: B
    content: 小玉突然昏倒，眾人趕忙「七零八落」的把她抬到保健室
  - label: C
    content: 花輪心地雖然不壞，卻因為「群龍無首」而不能獲得認同
  - label: D
    content: 櫻桃隊棒棒強打，以「秋風落葉」之勢，打得對方潰不成軍
- id: doc_113_屏東_中正_國文_g8s2e1_s4_9
  section: 4
  number: 9
  type: single
  page: 2
  stem: 作家廖鴻基對「弗氏海豚」的描述:「我感到不安，船隻的靠近顯然侵擾了牠們，但我們只是如靠近其他種海豚般靠近而已，是我們不當介入？還是牠們過度反應？」這段文字表現出何種心理特質？
  options:
  - label: A
    content: 對於人類破壞自然環境的罪惡感
  - label: B
    content: 比較不同海豚群體生態的洞察力
  - label: C
    content: 設身處地體諒其他生命的同理心
  - label: D
    content: 彌補動物保育法規漏洞的正義感
- id: doc_113_屏東_中正_國文_g8s2e1_s4_10
  section: 4
  number: 10
  type: single
  page: 2
  stem: 下列何者說明了孔明設下空城計的原因？
  options:
  - label: A
    content: 忽然十餘次飛馬報到，說司馬懿引大軍十五萬，望西城蜂擁而來
  - label: B
    content: 眾官聽得這消息，盡皆失色
  - label: C
    content: 今大開城門，必有埋伏。我軍若進，中其計
  - label: D
    content: 若棄城而走，必不能遠遁，得不為司馬懿所擒乎
  lesson_raw:
    title: 空城計
    basis: 課文〈空城計〉相關內容
- id: doc_113_屏東_中正_國文_g8s2e1_s4_11
  section: 4
  number: 11
  type: single
  page: 2
  stem: 下列引號中的詞語，何者解釋錯誤？
  options:
  - label: A
    content: 剛才來不及吃午餐，現在我的肚子正在「唱空城計」呢：比喻肚子餓
  - label: B
    content: 他為人狡猾，我看你還是不要去赴那場「鴻門宴」吧：祝賀的酒宴
  - label: C
    content: 你哪時有空來我家玩，記得先打電話告訴我，好讓我做個「東道主」：接待或宴請賓客的主人
  - label: D
    content: 法院常常上演「羅生門」，分辨實情得靠法官的智慧：比喻對同一件事，因立場不同而說出不同事實的歧異情形
- id: doc_113_屏東_中正_國文_g8s2e1_s4_12
  section: 4
  number: 12
  type: single
  page: 2
  stem: 依據下列四個同學對三國演義的了解，請問哪一個人敘述的內容錯誤？
  options:
  - label: A
    content: 梅：「三國演義是一部俠義長篇小說。」
  - label: B
    content: 蘭：「三國演義和西遊記都是章回小說。」
  - label: C
    content: 竹：「三國演義原名三國志通俗演義，作者是羅貫中。」
  - label: D
    content: 菊：「取材自陳壽的三國志與宋、元以來說書人和通俗文學家所編寫的三國故事。」
  lesson_raw:
    title: 空城計
    basis: 三國演義常識題（空城計作者/出處）
- id: doc_113_屏東_中正_國文_g8s2e1_s4_13
  section: 4
  number: 13
  type: single
  page: 2
  stem: 下列文句引號中的成語，何者使用正確？
  options:
  - label: A
    content: 一早，小英就鬱鬱寡歡，一副「笑容可掬」的樣子，不知有何心事
  - label: B
    content: 這座古屋陰森森的，「神鬼莫測」，沒人敢進去探險
  - label: C
    content: 由於百貨公司大減價，顧客「蜂擁而至」瘋狂的搶購
  - label: D
    content: 夜市收攤後，整條街上「旁若無人」
- id: doc_113_屏東_中正_國文_g8s2e1_s4_14
  section: 4
  number: 14
  type: single
  page: 2
  stem: 下列四組對話，哪一組使用的稱謂完全正確？
  options:
  - label: A
    content: 「家慈」囑我向您問候 ／ 多謝「令堂」的關心
  - label: B
    content: 不知「令嬡」今年貴庚 ／「舍女」今年二十七歲
  - label: C
    content: 近來「寒舍」已重新裝潢完畢，歡迎光臨 ／ 我們夫婦倆必擇期造訪「寶號」
  - label: D
    content: 很榮幸「內人」能獲得模範母親的表揚 ／「外子」也是非常上進孝順的好青年
- id: doc_113_屏東_中正_國文_g8s2e1_s4_15
  section: 4
  number: 15
  type: single
  page: 2
  stem: 一棵開花的樹前半段充滿女子等待的心情，下列何者也是等待之情？
  options:
  - label: A
    content: 青山橫北郭，白水繞東城。 此地一為別，孤蓬萬里征
  - label: B
    content: 曾經滄海難為水，除卻巫山不是雲。取次花叢懶回顧，半緣修道半緣君
  - label: C
    content: 梳洗罷，獨倚望江樓。過盡千帆皆不是，斜暉脈脈水悠悠，腸斷白蘋洲
  - label: D
    content: 海內存知己，天涯若 比鄰。無為在歧路，兒女共沾巾
  lesson_raw:
    title: 一棵開花的樹
    basis: 題目提及「一棵開花的樹」
- id: doc_113_屏東_中正_國文_g8s2e1_s4_16
  section: 4
  number: 16
  type: single
  page: 2
  stem: 下列選項引號中的詞語，何者詞性前後相同？
  options:
  - label: A
    content: 反覆操演著「不安」／牠們的情緒很「不安」
  - label: B
    content: 這件事「關係」著你我的未來／他們有很密切的「關係」
  - label: C
    content: 就憑這些水花「特徵」／哺乳類的「特徵」是溫血、哺乳、毛髮蔽體
  - label: D
    content: 「盲目」地在一定的範圍內盤轉／愛情是「盲目」的
- id: doc_113_屏東_中正_國文_g8s2e1_s4_17
