  - label: D
    content: ''
    asset:
      key: optD
      file: doc_113_屏東_中正_國文_g8s2e1/5_1_optD.png
  group_stem: "人在面對一件事情時，會發展出兩套歸因方式，一種是外在歸因，把責任歸於外界；一種是內在歸因，把責任歸於自身。偏偏，人在不同的情境下，會聰明的選用不同歸因，來讓自己好過一點。\n\
    \    當我們看發生在別人身上的好事，會傾向用「外部歸因」。比方小李在公司升遷了，你可能心想：「那個馬屁精，天天討好老闆，難怪升得快。」但難道，小李本身沒有努力嗎？而當我們看發生在自己身上的好事，卻傾向用「內部歸因」。比如你自己升遷，得意得很，心裡讚嘆自己：「我升遷，當然是因為我夠努力啊！」，可是，難道你的升遷，沒有絲毫的運氣成分嗎？\n\
    \    再換個角度來看，當我們面對別人的壞事，這時我們傾向用「內部歸因」。比方說小李遲到，你心裡想：「小李又遲到了，這人就是懶散。」；可是換作你自己遲到，你會怎麼解釋呢？「都是路上大塞車，害我遲到。」所以，顯而易見，發生在自己身上的壞事，我們更常用「外部歸因」。\n\
    \    我們就是這麼聰明，聰明的規避過錯、歸咎他人，於是我們的人生慢慢變成一場謊言。但是要看透自己，本身就得付出高成本，因為你得接受自己的不完美。看見別人身上的好事，我們改用「內部歸因」：看見小李升遷背後的努力，這讓我們學會了「虛心」。發生在自己身上的好事，我們改用「外部歸因」：知道自己的升遷，在努力之外，也有貴人相助。於是我們學會了「感激」。\n\
    \    當壞事發生在別人身上，我們試著「外部歸因」一下：小李遲到，背後是不是有難言之隱？這瞬間，我們有了「憐憫」；而壞事落在自己頭上，我們改用「內部歸因」一回：我遲到，是因為我自己偷懶，下次，別再犯就好了，這回，我們學會了「反省」。那些我認識的強者，都是這麼反人性的要求自己，也因為如此，成功者才如此碩果僅存。\n\
    \                                               （節選自歐陽立中 看透自己，要付出多大代價）"
