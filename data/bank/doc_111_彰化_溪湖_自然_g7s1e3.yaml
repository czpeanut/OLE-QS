- id: doc_111_彰化_溪湖_自然_g7s1e3_s1_38
  section: 1
  number: 38
  type: single
  page: 2
  stem: 最初於何處發現降鈣素的存在？
  options:
  - label: A
    content: 副甲狀腺
  - label: B
    content: 甲狀腺
  - label: C
    content: 後鰓體
  - label: D
    content: 卵巢的濾泡。
  group_stem: "【閱讀測驗】降鈣素的發現\n    以狗作實驗時，若以含有高濃度$Ca^{2+}$(鈣離子)的溶液灌流副甲狀腺旁之甲狀腺區域，會導致週邊血漿中的鈣濃度下降。將此區域破壞後，$Ca^{2+}$的灌流引起血漿中鈣濃度的增加比對照組的動物上升得還多。上述及一些其他的觀察導致一種降鈣物質的發現，此種降鈣荷爾蒙稱為降鈣素。\n\
    \    在非哺乳類的脊椎動物中，降鈣素來自後鰓體，它是胚胎時來自第五對鰓弓的一對腺體。哺乳類的後鰓體大多已併入甲狀腺中，但後鰓組織的分布圍繞著濾泡，稱為濾泡旁細胞。因為這些又稱為清澈細胞或C\
    \ 細胞的細胞分泌此激素，因此降鈣素常被稱為甲狀腺降鈣素。但是完全切除甲狀腺並不會將血液循環中這激素的濃度降到0，用放射性免疫檢定法可在腦、脊髓、胸腺、肺、腸胃道、肝、膽囊等組織中找到此激素。甲狀腺外降鈣素的重要性尚未有定論。至少，我們叫它的原名：降鈣素，總是錯不了的。"
