  group_stem: "Do you ever think about what will happen when you don’t have enough\
    \ water to use in your everyday life? If \nwe only have little water to use, we\
    \ may have nothing to drink, plants may die, and animals may, too. Does it sound\
    \ \nterrible? However, it’s now happening in some parts of the world. When there\
    \ is not enough water in one place for a \nlong time, we call it a “drought”.\
    \ People find that some small changes in the flow of wind, water, and temperature\
    \ \ncan have a great influence on the climate of some places. And when the change\
    \ of the climate comes, it may lead to \ndroughts. The quick changes of the climate\
    \ may cause droughts, but what people do will make them worse, like \ncutting\
    \ trees. Trees can protect the earth from the sun’s heat. The temperature will\
    \ become higher than it was if we \ndon’t have trees. More and more people living\
    \ in the north America are moving to the southeast of America. \nHowever, the\
    \ habits of using water in life don’t change much. They may still take long showers\
    \ and wash cars often \nlike before. The best way to solve the problem of droughts\
    \ right now and in the future is to use water carefully. Let’s \ntake action in\
    \ our everyday life when we still have enough water to use.  \n           if\
    \ 假如；flow 流動；temperature 氣溫；influence 影響；climate 氣候；lead to 導致；quick 快速的； \n \
