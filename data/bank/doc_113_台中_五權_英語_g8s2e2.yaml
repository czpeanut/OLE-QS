- id: doc_113_台中_五權_英語_g8s2e2_s1_23
  section: 1
  number: 23
  type: single
  page: 3
  stem: "As Sakura said, which of the following might be the weather in one week in\
    \ March \n         in Taiwan?"
  options:
  - label: A
    content: -10℃→ -5℃ → -27℃ → -15℃
  - label: B
    content: 30℃→ 15℃ →  3℃    →  27℃
  - label: C
    content: 30℃→ 35℃ →  37℃  →  36℃
  - label: D
    content: 35℃→ 30℃ → -27℃  → -20℃
  group_stem: "The Four Seasons in Spring  \nAs we all know, there are four seasons\
    \ in a year. Of the four seasons, \nspring comes first. In most of the countries,\
    \ spring is a season for people to take \noff their heavy coats and put on their\
    \ lighter ones. However, Sakura from Japan \nhas a special idea on the order of\
    \ the four seasons in Taiwan.  \nSakura stays in Taiwan for years. She always\
    \ wears the wrong clothes in \nspring because the weather in Taiwan changes a\
    \ lot in a week or even in a day. \nIt’s hard for Sakura to wear the same clothes\
    \ from morning to night. For her, \nthere may be cold time and hot time during\
    \ a spring day. She can even feel the \nweather of four seasons in a week here\
    \ in spring. As for the weather in autumn \nin Taiwan, it is almost as hot as\
    \ it is in summer. Sakura always wears shorts \naround Moon Festival. That means\
    \ there is almost no autumns in Taiwan for \nher. In winter, it’s wet, cold and\
    \ windy in Taiwan. And it never snows in the \ntowns or in any plains (平原)."
