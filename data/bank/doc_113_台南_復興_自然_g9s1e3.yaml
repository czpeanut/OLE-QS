- id: doc_113_台南_復興_自然_g9s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 兩個原本不帶電的物體，分別是毛皮和琥珀棒，當兩者互相摩擦後，毛皮帶正電，琥珀棒帶負電。關於這個摩擦起電的過程，下列敘述何者正確？
  options:
  - label: A
    content: 毛皮得到質子而帶正電。
  - label: B
    content: 琥珀棒失去電子而帶負電。
  - label: C
    content: 摩擦的過程中，毛皮上的電子轉移到琥珀棒上
  - label: D
