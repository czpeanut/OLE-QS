- id: doc_113_台南_復興_自然_g9s1e3_s2_39
  section: 2
  number: 39
  type: single
  page: 5
  stem: 以下關於彗星的敘述，哪一個是正確的？
  options:
  - label: A
    content: 彗星是熾熱的星體，會自行發光。
  - label: B
    content: 彗星主要由冰、塵埃和岩石組成，被稱為「髒雪球」。
  - label: C
    content: 彗星的尾巴總是朝向太陽的方向。
  - label: D
    content: 彗星的軌道都是規則的圓形。
  group_stem: '【揭開彗星的神秘面紗】

    彗星主要由冰、塵埃和岩石組成，因此又被稱為「髒雪球」。它們多數來自太陽系邊緣的庫伯帶或更遙遠的歐特雲，這些區域的溫度極低，使得水和其他揮發性物質以固態冰的形式存在。當彗星接近太陽時，太陽的熱力會使彗星表面的冰昇華，直接變成氣體，同時夾帶著塵埃顆粒，形成我們所見的彗核、彗髮和彗尾。

    彗星的彗尾是其最顯著的特徵，但它並不是像噴射機一樣向後噴射，而是受到太陽風的吹拂，總是背向太陽。彗尾的長度可達數百萬公里，甚至更長，而且隨著彗星與太陽的距離變化，彗尾的大小和亮度也會隨之改變，一般而言，彗星越靠近太陽亮度越亮(也有部分彗星在靠近太陽時分解殆盡)。彗星的運行軌道多為橢圓形，有些彗星繞太陽一圈的時間可能長達數百年甚至數千年，因此人們看到它們的機會並不多。

    彗星通常會有兩個名字，一個是由彗星的發現者命名，例如 2020 年最熱門的彗星 NEOWISE 就是NASA 的太空望遠鏡 NEOWISE 發現的，所以名字就叫
    NEOWISE。

    另外國際天文聯合會在 1995 開始啟用另一套彗星命名法。這套命名法就像是一串流水號，NEOWISE 彗星也叫 C/2020 F3。彗星的編號開頭是英文字母（最常見的是
    C:週期 200 年以上或不確定週期、P:週期 200 年以下或確定週期），再以斜線／分隔，後為發現年份與發現月份（一個月分切分為上下兩個半月）的英文代碼，最後加上那個半月發現的彗星順序。以
    NEOWISE 彗星為例，它的國際編碼 C/2020 F3，表明這顆彗星是 2020 年 3 月下旬發現的第 3 顆彗星。

    英文有 26 個字母，用其中的 24 個來代表一年中 24 個半月，如下表(二)。1 月的上半月是 A，下半月是 B，2 月的上半月是 C，依此類推。其中字母
    I、Z 跳過，因為 I、Z 和數字 1、2 很像。所以NEOWISE 彗星 C/2020 F3 中的 F3 代表這顆彗星是 3 月下旬發現的第 3 顆彗星。

    【表二 彗星發現月份編碼表】

    | 月 | 1 月 | 2 月 | 3 月 | 4 月 | 5 月 | 6 月 | 7 月 | 8 月 | 9 月 | 10 月 | 11 月 | 12 月
    |

    | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---:
    | :---: | :---: | :---: |

    | 上 | A | C | E | G | J | L | N | P | R | T | V | X |

    | 下 | B | D | F | H | K | M | O | Q | S | U | W | Y |

    【文章節錄、改寫自中央氣象署數位科普網、屋頂上的天文學家】'
