  number: 1
  type: single
  page: 1
  stem: 小明使用安培計測量通過電路中某個元件的電流，他需要將安培計正確的連接到電路中。下列關於安培計使用方式的敘述，何者正確？
  options:
  - label: A
    content: 安培計必須與待測元件並聯。
  - label: B
    content: 安培計的正極端子要連接到電路中靠近電池負極的一端。
  - label: C
    content: 安培計的負極端子要連接到電路中靠近電池負極的一端。
  - label: D
    content: 使用安培計測量時，不需要注意電流的方向。
