  type: single
  page: 1
  stem: 在一次靜電實驗中，小安將帶負電荷的塑膠尺靠近水龍頭流出的細小水柱，觀察到水柱彎曲的現象，如圖(一)。下列哪一項敘述最能解釋水柱彎曲的原因？
  options:
  - label: A
    content: 水分子不帶電，但受到塑膠尺的靜電感應而彎曲。
