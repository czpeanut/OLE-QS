  type: single
  page: 1
  stem: 小華在實驗室中進行靜電實驗，他將一不帶電的金屬球放在絕緣架上，然後將帶負電的塑膠棒靠近金屬球但不接觸。接著，他用手指輕觸金屬球的另一側後移開，發現金屬球帶了電。下列關於此實驗的敘述，何者正確？
  options:
  - label: A
    content: 當塑膠棒靠近時，金屬球帶正電
  - label: B
    content: 手指觸摸金屬球過程，是讓電子從手指流入金屬球。
  - label: C
    content: 手指移開後，金屬球會帶正電。
  - label: D
    content: 整個過程中，金屬球的電荷總量增加了。
