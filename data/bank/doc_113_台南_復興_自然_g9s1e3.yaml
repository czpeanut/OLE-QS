- id: doc_113_台南_復興_自然_g9s1e3_s2_42
  section: 2
  number: 42
  type: single
  page: 6
  stem: 天文學家測量近距離恆星最常用的方法是：
  options:
  - label: A
    content: 紅移法
  - label: B
    content: 標準燭光法
  - label: C
    content: 視差法
  - label: D
    content: 宇宙微波背景輻射法
  group_stem: '【宇宙有多大？我們怎麼知道？】

    你有沒有想過，宇宙到底有多大？那些閃亮的星星距離我們有多遠呢？天文學家們為了解答這些問題，發展出了許多聰明的方法來測量宇宙中天體之間的距離。

    1. 測量近距離：視差法，測距適用範圍：~1,000 pc。

    以地球和太陽間的平均距離為底線，觀測恆星在六個月間隔，相對於遙遠背景恆星的視差。恆星的距離 d

    d（秒差距，pc）= 1/ p（視差角，秒弧）

    1 pc 定義為造成一秒視差角的距離，等於 3.26 光年。地面觀測受大氣干擾的限制，有效的觀測距離約為 100 pc（～300 光年）。在地球大氣層外的
    Hipparcos 衛星與哈伯望遠鏡，能用視差法量測更遠的恆星，範圍可推廣到 1000 pc。。

    2. 中距離測量：標準燭光測距適用範圍：造父變星～17 Mpc，超新星> 1000 Mpc

    對於再遠的星星，視差就太小了，看不出來。這時候，天文學家會使用一種叫做「標準燭光」的天體來測量距離。標準燭光就像是一顆亮度固定的燈泡，只要知道它的絕對亮度，再測量我們看到的亮度，就可以算出距離我們有多遠。常見的標準燭光有：

    • 造父變星：這是一種會規律變亮的星星，它的亮度變化週期和它的絕對亮度有固定的關係，我們的北極星【勾陳一】就是常用的造父變星。

    • Ia 型超新星：超新星是一種爆炸非常明亮的恆星，平均每年可以觀測到數十顆外星系的超新星。大部份的超新星(I 型與 II 型）的最大亮度都很相近，天文學家常假設它們一樣，並以它們做為大距離的指標。

    3. 遠距離測量：紅移告訴我們宇宙正在膨脹

    對於更遙遠的星系，天文學家則利用紅移和哈勃定律來測量距離。

    • 紅移：當星系遠離我們時，它發出的光線會發生紅移現象，即光譜線向紅端偏移。紅移量與星系遠離的速度成正比。哈勃定律指出，星系遠離的速度和它與我們的距離成正比。通過測量星系的紅移量，就可以計算出星系遠離的速度，進而推算出星系的距離。

    4. 宇宙有多大？

    根據目前觀測到的宇宙，我們認為宇宙的直徑至少有 930 億光年。'
