  group_stem: 2021 年8 月海巡單位查獲100 多隻走私貓，2 天後全被安樂死，引發討論。事實上，海關緝私條例與動物傳染病防治條例等法規，均無動物必須立即被銷毀的規定。查獲走私動物一律撲殺的慣例，是依據行政院農業部為處理「走私農產品」而自行訂定的法規─
