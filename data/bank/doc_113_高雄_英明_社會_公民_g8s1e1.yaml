  stem: 請問：有關憲法的修正程序，下列何者正確？
  options:
  - label: A
    content: 透過司法院大法官解釋憲法後公佈
  - label: B
    content: 由立法院提出後交由公民複決
  - label: C
    content: 由立法院修正通過後交由總統公佈
  - label: D
    content: 由行政院擬定行政命令後發佈
  group_stem: '有關2022 年「18 歲公民權」修憲案的複決公投，是我國史上首次修憲複決公投，此修憲案經過選舉人複決後，決定選舉權年齡維持20 歲。

    本次《憲法》修正案於2020 年開始討論，終於在 2022 由立法院決議提出，並將公告至少半年後舉行複決公投，屆時將由全體國民投票複決，以表達是否支持《憲法》的修正。而本次修憲的有效同意票要超過可投票者總數的
    50％才為通過。從中可知，《憲法》的修正並不容易且十分繁複。'
