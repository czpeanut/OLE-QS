  stem: 下列「 」中的書信稱呼，何者運用正確？
  options:
  - label: A
    content: 歡迎有空蒞臨「貴宅」，我們必定用心款待
  - label: B
    content: 「令堂」一人含辛茹苦，扶養我們兄弟長大
  - label: C
    content: 「小犬」在校的表現十分優異，您大可放心
  - label: D
