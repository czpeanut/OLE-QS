  section: 3
  number: 6
  type: single
  page: 1
  stem: 木蘭詩：「願借明駝千里足，送兒還故鄉。」由上述詩句判斷，木蘭當時的心境，與下列哪一個選項最相近？
  options:
  - label: A
    content: 勸君更進一杯酒，西出陽關無故人
  - label: B
    content: 即從巴峽穿巫峽，便下襄陽向洛陽
  - label: C
    content: 故人西辭黃鶴樓，煙花三月下揚州
  - label: D
    content: 醉臥沙場君莫笑，古來征戰幾人回。
