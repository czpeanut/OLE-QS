  stem: 依據上文，「馬拉松」和「百米賽跑」所代表的人生意涵並不相同。下列選項，哪一種人生的體悟符合文章所述？
  options:
  - label: A
    content: 人生要有跑馬拉松般的長久堅持，並且須以跑百米的速度一路前進
  - label: B
    content: 人生像跑馬拉松一樣不容易成功，但卻像跑百米一樣的匆忙又短暫
  - label: C
    content: 人生必須像馬拉松一樣不斷前進，不是贏在起跑點就能夠贏到最後
  - label: D
    content: 人生像馬拉松賽道般冗長變幻，不像百米賽道是短暫而且固定。
  group_stem: '張忠謀曾說：「不管人生或事業，都像是跑馬拉松，成功往往是長久的努力，不是一兩年就能做到。」如果你還年輕，面對人生這場不會重來的賽局，不一定要贏在起跑點，但絕對要愈挫愈勇，人生不是一場百米賽跑，而是一場馬拉松。有些人小時了了、大未必佳，而有些人小時被認為是註定要失敗的人，但長大後卻比任何人都還出色。不管你處在人生的任何階段，告訴自己，永遠都還有機會。人生是一場馬拉松，只要你還在場上，就可以持續地往前進，只要你仍然持續地往前進，就代表你仍然持續地成長、進步，你應該戒慎恐懼的是自己是否正在原地踏步、裹足不前。

    在社會上，擁有學習的能力，看似簡單，卻是足以影響你一生的關鍵。無論身處校園或職場，國內或海外，唯有持續不斷的學習，能讓你不害怕改變和困難，找到自己的發光之道。一個卓越的人，其優點是越在不利與艱難的困境裡，越能百折不撓，越在自己遭遇困境時，越能適時改變心境，幫自己找到走出困境的出口。

    真正的成長沒有捷徑的，學習是條終生漫長的跑道。

    所謂不經一事，不長一智，其實，失敗只是人生的一部分，也是一種人生閱歷，每一次失敗都意味著向成功邁進一步。胡哲曾說：「告訴自己再多撐一天、一個禮拜、一個月，再多撐一年吧。你會發現，拒絕退場的結果令人驚訝。只有拒絕再試一次的人才會被打敗。」一個人的價值不在於他現在的水平有多高，而在於他是否能在生活中不停頓地前進。人生是一場馬拉松，不是一場百米賽跑。

    過去曾經輸的，不代表未來就得不到，現在贏的，也不代表未來不會失去。成功很難，但要持續地成功更難。人生比的絕對不是一時的成敗、得失，而是比誰能夠走得更久、更遠。（節錄自知識家
    人生是一場馬拉松，不是一場百米賽跑）'
