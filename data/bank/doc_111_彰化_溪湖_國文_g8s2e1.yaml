  section: 3
  number: 7
  type: single
  page: 1
  stem: 「讓春天從高雄登陸／這轟動南部的消息／讓木棉花的火把／用越野賽跑的速度／一路向北方傳達」有關讓春天從高雄出發這段詩句的解讀，下列何者正確？
  options:
  - label: A
    content: 以木棉花紅色鮮豔的花朵，來象徵愛情的熱情與溫暖
  - label: B
    content: 春天來臨是轟動大消息，藉以襯托氣候異常的嚴重性
  - label: C
    content: 以春天生機蓬勃的季節特色，表達對高雄深深的祈願
  - label: D
    content: 以木棉花從北到南盛開，象徵高雄獲得北部支援挹注。
