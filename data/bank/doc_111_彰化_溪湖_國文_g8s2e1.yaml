  stem: 下圖是條件關係呈現「反比」的線條圖，請根據上文，分析文中的各種條件狀態，若要呈現其關係，那麼在兩側的條件X 和條件Y，應分別填入下列何者最符合文意？
  options:
  - label: A
    content: 幸福感與空汙嚴重程度
  - label: B
    content: 胎兒死亡率和空汙程度
  - label: C
    content: 廢棄物量和工作壓力
  - label: D
    content: 孕婦人數和空汙程度。
  group_stem: '最近中國霾害嚴重，空氣中濃霧瀰漫，許多機場因為能見度不佳而關閉。空氣汙染已經被許多研究證實對於人類生理有許多負面影響，例如：會造成心血管疾病、呼吸道患者的人數增加，若孕婦暴露於高濃度的空氣汙染環境，會影響胎兒的成長發育，造成胎兒死亡率升高、出生平均體重下降，未來胎兒也會是焦慮、憂鬱症、注意力不集中等問題的高危險群。

    除了對生理諸多負面影響，一份加拿大的研究亦發現，空氣汙染與人們的心理狀態有關：空氣汙染越嚴重的地方，居民感覺越不快樂，反之亦然。

    居民的快樂與健康有密切關係。清新的空氣或是良好的自然環境可以提高居民的生活滿意度，因為居民可以擁有更為健康的身體，或有更好的生活方式。相反的，如果空氣汙染嚴重，將迫使居民減少從事自己喜歡的戶外活動，因而感覺不快樂。另外，幸福感越高的人將有更高的滿足感，這些人對於其周圍的人與環境將更為友善。因此，若能讓居民感到快樂，他們製造的廢棄物可能就越少。滿足感高的人對環境保護將更有責任感，例如將採取更環保的方式生活。

    因此，研究者建議各地的政策決策者應採取各種措施提高居民的生活滿意度，例如改善醫療照顧與教育，提供陷於貧困的族群健全的社會保險網絡，並盡力減少居民的工作壓力，提高居民滿足感將能反過來減少空氣汙染。

    （節錄自國科會補助「新媒體科普傳播實作計畫——重大天然災害之防救災科普知識教育推廣」執行團隊撰稿你快樂嗎？空氣汙染影響我們的幸福感受）'
