  stem: 關於讓春天從高雄出發和控訴一枝煙囪的比較，下列何者有誤？
  options:
  - label: A
    content: 前者滿載作者對所居城市的祝願與期許；後者用期盼的語氣，希望空氣污染有所改善
  - label: B
    content: 兩首詩皆運用轉化的寫作手法，可感受到作者深入了解當地風物與民情的深情摯意
  - label: C
    content: 皆為作者對於居住環境的描述，揭露詩人對在地的關懷
  - label: D
    content: 前者祈願高雄文藝如春天般蓬勃發展，甚至引領風潮；後者提出對工業汙染的控訴。
