- id: doc_111_彰化_溪湖_國文_g8s2e1_s3_4
  section: 3
  number: 4
  type: single
  page: 1
  stem: 老師在講解書信常識的內容時，小兜一直跟隔壁同學打鬧聊天而分心，下列關於他所抄寫的筆記，何者有誤？
  options:
  - label: A
    content: 中式信封框內欄的稱謂，是發信人對受信人的稱呼
  - label: B
    content: 書信中，單字不成行。若遇到人名，必須同行書寫
  - label: C
    content: 現代信紙多樣化，唯弔唁信要避免用有紅線的信紙
  - label: D
    content: 信封的緘封詞對親長宜用「謹緘」，對平輩用「緘」。
  tags:
    textbook: 八下 語文常識(一) 應用文──書信、便條
