    content: 肯定自我，不在意惡意批評
  - label: B
    content: 臨危不亂，思考得勝的策略
  - label: C
    content: 跳脫勝敗，欣賞對手的表現
  - label: D
    content: 鬥志昂揚，力求自我的突破。
