- id: doc_113_新北_桃子腳_社會_g7s2e2_s2_31
  section: 2
  number: 31
  type: single
  page: 3
  stem: 關於上述○○所指的戰爭，下列敘述何者正確？
  options:
  - label: A
    content: 此戰爭結束後，日本實施南進政策，欲取東南亞資源
  - label: B
    content: 戰爭發生原因為國民黨與共產黨彼此爭奪中國的政權
  - label: C
    content: 此戰爭結束後，美國總統威爾遜提倡民族自決的思想
  - label: D
    content: 戰爭發生原因為美國在廣島、長崎兩地投下了原子彈
  group_stem: "【題組四】根據文章，回答第31 至32 題\n    瘦老闆與胖老闆在民國38 年因○○戰爭結束，隨著中華民國政府來到臺灣。兩人在臺灣合開了一間雜貨店，生意興隆，生活過得相當富足。然而，在瘦老闆心中始終藏著一個夢想──回到中國大陸探親。\n\
    \    當年因戰亂匆匆離開，他未曾與妻子和孩子好好道別，這段遺憾成了他心中最深的牽掛。即便在臺灣生活穩定，身旁的朋友也勸他：「回去的時間遙遙無期，不如在臺灣落地生根，重新組織家庭吧！」但瘦老闆始終搖頭拒絕，因為對他而言，真正的家人仍在對岸。\n\
    \    然而，好景不常，民國75 年瘦老闆因病辭世，長眠於臺灣。他一生堅持想要返回中國，卻最終未能如願。\n    直到民國76 年，政府終於開放兩岸探親。這一開放，讓離散38\
    \ 年的親人終於得以重逢——只可惜，瘦老闆已無緣親眼見證這歷史性的時刻。"
