  stem: 在古代，不論什麼職業，多是守之以世。所以管子曾說：「士之子恆為士，工之子恆為工，商之子恆為商，農之子恆為農。」這句話顯示了當時社會階層固定、不易流通的情況。請問：最可能是下列哪個朝代的特色？
