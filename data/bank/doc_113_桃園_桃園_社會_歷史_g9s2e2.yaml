- id: doc_113_桃園_桃園_社會_歷史_g9s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: '下表呈現某國在不同局勢下，於不同面相採取的措施。表中的「?」最適合填入下列何者?


    | 不同局勢下採取的措施 | 第一次世界大戰後 | 第二次世界大戰時 |

    | --- | --- | --- |

    | 對殖民地的政策 | 實施內地延長主義 | 實施皇民化運動 |

    | 對外擴張的行動 | 發動九一八事變 | ? |'
  options:
  - label: A
    content: 發動甲午戰爭
  - label: B
    content: 發動珍珠港事變
  - label: C
    content: 扶植溥儀成立滿州國
  - label: D
    content: 簽訂二十一條要求
- id: doc_113_桃園_桃園_社會_歷史_g9s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 聯合國是一個「由獨立國家所構成的組織」，下圖為該組織不同時期成員國組成與數量。根據內容判斷，圖中所呈現出的趨勢應為何者?
  options:
  - label: A
    content: 拉丁美洲各殖民地陸續發起獨立運動
  - label: B
    content: 大量殖民地在二戰脫離列強的統治
  - label: C
    content: 一戰後歐洲各民族依據民族自決的原則建國
  - label: D
    content: 蘇聯改革後東歐各國取回國家自主權
  assets:
  - key: s1_12_f1
    kind: figure
    file: doc_113_桃園_桃園_社會_歷史_g9s2e2/s1_12_f1.png
- id: doc_113_桃園_桃園_社會_歷史_g9s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 一位政治人物為掌握政權，曾許諾「給農民以土地，給國家以和平，給飢民以麵包！」他號召民眾推翻舊政府，試圖建立一個新的政府。當革命成功，土地重新分配了，一年後，他卻要求農民把農產品交給新政府，命令「紅軍士兵們挨村尋找那些最差的、最懶的、最奸猾的農民，給他們權力，讓這些精心挑選的人去沒收他們鄰居的『餘糧』。」根據上述選出正確的說明？
  options:
  - label: A
    content: 政治人物是指列寧
  - label: B
    content: 文中的革命指二月革命
  - label: C
    content: 「和平」指退出第二次世界大戰
  - label: D
    content: 文中的新政府指臨時政府。
- id: doc_113_桃園_桃園_社會_歷史_g9s2e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 約翰擔任外國歷史短劇的男主角。在劇中，他看到自己國家的街道上，插滿如附圖的旗幟。而後，又從新聞得知原來在戰爭中，外國勢力已入侵。過沒幾年，好不容易戰爭獲勝了，政府又加入華沙公約組織，落入他國的牢籠。請問：約翰最有可能扮演下列哪一身分的人？
  options:
  - label: A
    content: 美國的士兵
  - label: B
    content: 波蘭的記者
  - label: C
    content: 比利時的工人
  - label: D
    content: 西班牙的教師。
  assets:
  - key: s1_14_f1
    kind: figure
    file: doc_113_桃園_桃園_社會_歷史_g9s2e2/s1_14_f1.png
