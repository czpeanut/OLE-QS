- id: doc_113_桃園_桃園_社會_歷史_g9s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 一位法國大使曾對某項外交變化寫信回國，其內容為:「那些德意志人以為威廉一世在凡爾賽宮登基就比別人高一等嗎?居然還高舉『日耳曼團結』的大旗號召團結。或許政府可以邀請俄國前來一敘，共同商議接下來的外交布局。」這封信件出現時的國際局勢應為何者?
  options:
  - label: A
    content: 18 世紀後期歐洲理性主義的興起
  - label: B
    content: 19 世紀初期歐洲民族主義的興起
  - label: C
    content: 19 世紀後期歐洲軍事結盟的盛行
  - label: D
    content: 20 世紀初期民族自決思潮的盛行
- id: doc_113_桃園_桃園_社會_歷史_g9s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: '附表是四個歐洲國家在第一次世界大戰爆發後的反應，根據表中內容判斷，何者屬於「協約國」陣營？


    | 國家 | 事件後的反應 |

    | --- | --- |

    | 甲 | 得到德國全力支持，向塞爾維亞宣戰。 |

    | 乙 | 全面動員軍隊，對付奧匈帝國等國。 |

    | 丙 | 為支持同一民族，同時向法國與俄國宣戰。 |

    | 丁 | 因德軍入侵比利時，向德國宣戰。 |'
  options:
  - label: A
    content: 甲丙
  - label: B
    content: 丙丁
  - label: C
    content: 甲乙
  - label: D
    content: 乙丁。
- id: doc_113_桃園_桃園_社會_歷史_g9s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 下列為一位美國官員回憶:「在事件之初，我認為媒體的報導是誇大其詞，畢竟自門羅宣言以來，我國持續深化對當地及其周邊的影響力，蘇聯領導人若理智尚存，就不可能放任戰爭爆發。數年後我才知道，那時蘇聯除了在當地架設飛彈基地，還派駐了數萬軍隊，這個世界曾與毀滅如此接近。」根據上文判斷，該事件造成下列何種影響?
  options:
  - label: A
    content: 美國宣布自南越撤軍，不久後越南成為共產國家
  - label: B
    content: 美、蘇領導人建立溝通管道，世界局勢漸趨和緩
  - label: C
    content: 蘇聯領導人宣布實施改革，最終導致蘇聯的瓦解
  - label: D
    content: 美國意欲聯中制蘇，宣布與中華人民共和國建交
- id: doc_113_桃園_桃園_社會_歷史_g9s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: ﹤安妮的日記﹥是猶太人安妮･法蘭克在1942~1944年的日記，紀錄了荷蘭當時的生活情況以及安妮成長的心路歷程，若到安妮所處的時空能觀察到那些情形?
  options:
  - label: A
    content: 德國人佔領街道，到處搜索猶太人
  - label: B
    content: 墨索里尼政變，國王任命他為首相
  - label: C
    content: 荷蘭已加入聯合國，維持世界和平
  - label: D
    content: 美國為結束戰爭，在廣島和長崎投下原子彈
- id: doc_113_桃園_桃園_社會_歷史_g9s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 附圖呈現蘇聯、美國、英國、義大利四個國家參與第二次世界大戰的時段。根據內容判斷，圖中甲、乙、丙、丁何者最可能是蘇聯？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
