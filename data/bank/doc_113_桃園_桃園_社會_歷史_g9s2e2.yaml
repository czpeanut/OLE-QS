  stem: 1837 年，英國在印度修築的第一條鐵路通車；1880年代，越南在法國主導下開始建造鐵路。當時英法在這兩地區進行交通建設與下列何者關係最密切？
  options:
  - label: A
    content: 啟蒙思想的實踐
  - label: B
    content: 大航海時代的海外殖民
  - label: C
    content: 科學革命的萌芽
  - label: D
    content: 帝國主義國家的對外擴張
- id: doc_113_桃園_桃園_社會_歷史_g9s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 英國保守主義學者曾提出下列觀點:法國大革命最後必將走上強人政治的結局，其後法國政治的發展軌跡果如他所料。請問:下列各項史實，何者印證了他的觀點?
  options:
  - label: A
    content: 拿破崙稱霸歐洲，並喚起各地的民族意識
  - label: B
    content: 路易十六下令解三級會議，另組國民會議
  - label: C
    content: 國民會議改行共和，並以恐怖統治掌控全歐
  - label: D
    content: 威廉一世登基稱帝後，歐洲召開維也納會議
- id: doc_113_桃園_桃園_社會_歷史_g9s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 九一八事變發生後，蔣中正發表文章〈敵乎？友乎？中日關係的檢討〉解釋為何不與日本交涉，而選擇訴諸國際公論。文中提及雖然在日本發動侵襲時，英美忙於應付致災性危機，蘇聯則積極推動經濟計畫，因此不予回應。一旦列強完成經濟建設，將會協助中國。下列關於當時局勢的敘述，何者正確？
  options:
  - label: A
    content: 蔣中正所謂的訴諸國際公論是向聯合國抗議
  - label: B
    content: 英美處理的危機是從德國開始的經濟大恐慌
  - label: C
    content: 蘇聯的所推動的經濟計畫是由史達林主導
  - label: D
    content: 九一八事變的發生導致一次大戰亞洲戰場引爆。
- id: doc_113_桃園_桃園_社會_歷史_g9s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 「圍棋定式」是一種最穩妥的順序，讓下棋雙方大抵安定，利益大小均等，各不吃虧的下法。某位歷史人物也抱持著此種想法，在面對國與國間的利益與衝突時，考量的並非是當下的輸贏，而是均衡點的達成，進而確保了幾十年間歐洲沒有大型戰爭。這位歷史人物的想法做可能在下列哪一事件中實踐?
  options:
  - label: A
    content: 組成日耳曼邦聯
  - label: B
    content: 召開國民會議
  - label: C
    content: 建立13 州殖民地
  - label: D
    content: 召開維也納會議
- id: doc_113_桃園_桃園_社會_歷史_g9s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 湯姆是19 世紀某一地區經營皮毛貿易的商人，雖坐擁巨額財富，卻因自己並非出身於伊比利半島，而無法擔任官職、軍職，感到十分不滿，他試圖打破當時社會階級的限制，積極遊說當地的黑人與印地安人:「我們應該起身奮戰，直到對岸的暴君加諸在我們身上的桎梏粉碎為止。」請問:湯姆應該是下圖中哪一個地區的商人?
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
  assets:
  - key: s1_5_f1
