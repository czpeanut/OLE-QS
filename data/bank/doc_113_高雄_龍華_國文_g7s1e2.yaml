  type: single
  page: 4
  stem: 根據【甲】文的涵義，其主旨與下列何者最接近？
  options:
  - label: A
    content: 但丁：「道德能彌補智慧的缺陷，而智慧卻彌補不了道德的缺陷。」
  - label: B
    content: 莎士比亞：「無知是種罪惡，而知識便是我們用來飛向天堂的翅膀。」
  - label: C
    content: 愛因斯坦：「一個人的價值，應當看他貢獻什麼？而不是取得什麼。」
  - label: D
    content: 羅曼‧羅蘭：「生命像一股激流，沒有岩石和暗礁，就激不起美麗的浪花。」
  group_stem: '【甲】子路曰：「南山有竹，弗揉①自直，斬而射之，通於犀革②，又何學為乎？」孔子曰：「括③而羽之，鏃④而砥礪之，其入不益深乎？」子路拜曰：「敬受教哉！」
    ――《孔子家語‧子路初見》

    【乙】孔子將行，雨而無蓋⑤。門人曰：「商⑥也有之。」孔子曰：「商之為人也，甚吝於財。吾聞與人交，推⑦其長者，違⑧其短者，故能久也。」 ――《孔子家語‧致思》

    ：①揉：搓揉、揉製。 ②犀革：犀牛皮。 ③刮：箭尾。 ④鏃：箭頭。

    ⑤雨而無「蓋」：雨傘。 ⑥商：即子夏，孔子弟子之一。 ⑦推：稱許。 ⑧違：避開。'
