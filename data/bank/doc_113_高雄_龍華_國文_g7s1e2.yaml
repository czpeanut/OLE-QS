- id: doc_113_高雄_龍華_國文_g7s1e2_s4_28
  section: 4
  number: 28
  type: single
  page: 5
  stem: 「一直到自己快三十歲……在家門內。」末段作者所說的「在家門內」，與何者所表示的意涵最接近？
  options:
  - label: A
    content: 比喻父親晚年因沒了工作，才逐漸融入家庭
  - label: B
    content: 比喻父親千篇一律，且不知變通的頑固思想
  - label: C
    content: 父親的功能若有似無，早就對家庭少有關切
  - label: D
    content: 比喻父親長年來醉心事業，不顧家庭的冷漠
  group_stem: '父親六十二歲那年，總算放下了重擔――他沒了工作。隨著父親的失業，母親對家庭經濟的壓力重擔也越大。大姊考上師院，年年都以優越的成績，拿走班上同學引領期盼的高額獎學金；二姊則以公費生的姿態博取整個家裡的掌聲進入到台灣師大；而我則是在家族內部不斷督促、提醒的細碎耳語中，和台北那海市蜃樓般的繁華美景道別，以另一個公費生的姿態，扮演好我應盡的「好兒子」角色進入高師大。隨著父親失業越久，家裡經濟越顯負擔，儘管三個孩子看起來似乎不需要人操心，但家裡的開銷仍是一如無底洞般，父親辛苦賺來的錢沒有任何回響的一一落進裡頭。

    記憶裡的父親總像是一個鮮少存在的角色。他會在下午五點多一點進到家門，像隻頹圮疲倦的獸一般，不發一語的先去洗澡，然後一家人坐在飯桌上開動。印象中他就是不斷的低下頭扒著飯，然後拖著疲累的身子窩回到他溫暖的巢穴，仿若冬眠著，那些微的鼾聲伴隨著客廳外的電視聲，像拍打上岸的潮浪一起傳入我的耳內。七點一到，一家大小輪番上陣去把門內冬眠中的獸給挖了起來，父親伸了懶腰似乎不信時間過得會是如此快，別人黃粱一夢可以經歷一生，而自己一夢卻彷彿被上帝之手偷偷掩去好幾些時間。父親換穿上另一套工作服，洗把臉又出門去了。而凌晨時分，睡夢中的我偶爾會被客廳中鑰匙喀擦、門把轉動的聲音給驚醒，不過隨即又沉落入夢中。雖然知道父親回來了，不過此刻的自己沒有任何體力張開眼睛跟父親說聲：「哈嚕！老爹您回來啦！」

    大學畢業那年到北部就職，陰暗、濕冷、多雨的天氣，加上地處近海，海風常帶著海潮腥味襲擊而來。到了冬天，那風成了刺骨的針一一鑽入體內。那時的父親不論晴雨，儘管外頭大風大雨，父親仍舊發動著那輛陪著他二十年的機車前往上班途中，只為了賺取一份如今看在我眼中微乎其微的薪水。父親從來沒有抱怨過一句，只有在父親偶爾上班途中受傷回家療養之時，母親會代替少言的父親發言著：「天氣那麼壞，叫你不要出門你偏要出門！」而那傷依舊得不到工廠的慰問和補助，換來的只是停薪的指示，而父親在尚未痊癒之際又要上班，我總算看不下去這一切，要父親別再做那些工作。父親沒有聽任何人的話，繼續像隻生來就要工作的螞蟻般勤奮辛勞的工作，一人兼兩份工作養起一個家。最近兼職的工作也不好找了，父親努力過幾次，卻常在別人的婉拒中頹然地回家，由於長年在工廠工作的原因，那工廠內機械運作的音量不比待在一個舞池的少，父親的聽力開始有問題，需要我們大聲地和他說話，他才能了解我們的意思。

    沒了工作的父親，鎮日在家中就是不斷的看著電視，隨著電視螢幕的跳動，父親努力和世界有機會聯繫。此外，他也以我所不知道的方式悄悄復甦他內在的工作慾望，家中的任何場所都會被父親仔細的清潔整理過。除此之外，父親就像一個殷殷期盼老板發號施令的員工般，所有大小雜事只要他能幫得上忙的父親一定不會拒絕。「爸，幫我把這筆錢存起來！」、「爸，幫我繳這筆帳單，快到期了！」、「爸，有空幫我寄這封信！」、「爸，丟在洗衣籃的衣服幫我洗一下！」……我們待在只有一個員工的地方，每天以各式不同的任務與工作交付給父親。現在，每當我下班回到家中，看到失去工作的父親像隻小獸，安穩的窩在彷彿他地盤的客廳椅子上看著電視時，我突然心中有著一種安全感，因為我知道，從此之後，只要我推開家門，父親就會坐在門內的那邊等著家裡任何人的歸來。一直到自己快三十歲年紀，這時，才真正感受到父親，在家門內。

    ――改寫自徐嘉澤〈小時候〉'
