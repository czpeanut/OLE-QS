  stem: 根據以上展覽資訊，下列情境何者可能真實發生？
  options:
  - label: A
    content: 少曦利用國慶假期與好友前往故宮博物院，免費參觀本展覽
  - label: B
    content: 力政看到故宮毀損的文物，經香港城市大學以新媒體修復而重現
  - label: C
    content: 湛豪在展覽中可看到以「書畫」和「斷層掃描」等方式來記錄動物的展品
  - label: D
    content: 勁禮最感驚豔的展品，是使用AI 技術讓動物說出牠們眼中人類形象的「立體光雕百福瓶」
  group_stem: '動物藝想――故宮新媒體藝術展

    ● 展期：07╱23〜10╱27

    ● 時間：09：30〜17：00 【週一休館】

    ● 展場：松山 奉天宮 (台北市 信義區 福德街221 巷12 號)

    ● 票價：免費

    以「博物百科」、「吉祥寓意」兩大主題，討論人與動物多樣性的關聯。多角度地探索動物世界，引領觀眾傾聽多姿多彩的動物故事，並向觀眾傳達人類與動物相互且複雜的依存關係。

    本次展品包含：(一)國立故宮博物院以動物為題的珍藏、(二)香港城市大學的新媒體藝術――取材自院藏精選書畫的「百駿變」與「南懷仁的坤輿世界」、(三)以今日醫療科技為基礎的「貓狗斷層掃描」等，串聯出人們自古以來製作生物紀錄的不同方式。而「立體光雕百福瓶」則將人類賦予動物的意義形象具體化，展現出人類對動物的獨特情感投射。'
