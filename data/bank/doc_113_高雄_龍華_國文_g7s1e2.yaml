    沒了工作的父親，鎮日在家中就是不斷的看著電視，隨著電視螢幕的跳動，父親努力和世界有機會聯繫。此外，他也以我所不知道的方式悄悄復甦他內在的工作慾望，家中的任何場所都會被父親仔細的清潔整理過。除此之外，父親就像一個殷殷期盼老板發號施令的員工般，所有大小雜事只要他能幫得上忙的父親一定不會拒絕。「爸，幫我把這筆錢存起來！」、「爸，幫我繳這筆帳單，快到期了！」、「爸，有空幫我寄這封信！」、「爸，丟在洗衣籃的衣服幫我洗一下！」……我們待在只有一個員工的地方，每天以各式不同的任務與工作交付給父親。現在，每當我下班回到家中，看到失去工作的父親像隻小獸，安穩的窩在彷彿他地盤的客廳椅子上看著電視時，我突然心中有著一種安全感，因為我知道，從此之後，只要我推開家門，父親就會坐在門內的那邊等著家裡任何人的歸來。一直到自己快三十歲年紀，這時，才真正感受到父親，在家門內。

    ――改寫自徐嘉澤〈小時候〉'
