  group_stem: "★全球恐怖主義擴張？\n    講到恐怖組織，人們關注的大多還是以中東地區的阿富汗、巴基斯坦、伊朗等國家為主；但曾幾何時，恐怖主義的勢力版圖早已從中東逐步擴散至非洲大陸了。多年來，國際間較專注處理其他區域問題，未能正視非洲恐怖主義迅速延燒議題，更未積極因應過去十年間，非洲各國持續擴散成長百倍的恐攻事件。儘管恐怖組織仍然專注重整在西亞的勢力，但他們在非洲大陸肆無忌憚的蔓延，令人震驚，也充滿了警示危機。"
