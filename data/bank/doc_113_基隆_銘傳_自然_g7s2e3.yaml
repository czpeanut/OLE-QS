- id: doc_113_基隆_銘傳_自然_g7s2e3_s2_38
  section: 2
  number: 38
  type: single
  page: 7
  stem: 化學公司辯稱：「水中 DDT 濃度極低，甚至測不出來，不會對生物造成影響。」下列哪一項最能有力反駁這種說法？
  options:
  - label: A
    content: 瑞士化學家穆勒曾證明 DDT 具有殺蟲效果，不論濃度都會對生物造成傷害
  - label: B
    content: 化學公司說得有道理，生物體內的 DDT 來源不是來自於噴灑到水中的農藥
  - label: C
    content: DDT 停留在環境中的時間很長，一定會對生物造成傷害
  - label: D
    content: DDT 難以分解，使得鳥類體內的毒素透過食物鏈累積
  group_stem: '寂靜的春天與看不見的危險


    瑞秋·卡森是美國賓夕法尼亞州出生的海洋生物學家、作家，曾在美國漁業管理局擔任出版物主編。她在觀察自然與生物變化的過程中，逐漸對人類大量使用化學農藥的行為感到憂慮。1957年，一位來自馬薩諸塞州鳥類保護區的管理員來信告訴她，鳥類卵殼變薄，使鳥類無法順利孵化，甚至面臨滅絕危機。這封信成為她深入調查的起點。


    DDT（滴滴涕）是一種人工合成的殺蟲劑，最早於1939年由瑞士化學家保羅·穆勒發現具有強效殺蟲能力。它能有效消滅瘧蚊、蝨子與農業害蟲，因而在第二次世界大戰期間廣泛應用於防疫與糧食生產。由於
    DDT 具有持久性、不易分解，且成本低廉，戰後迅速被推廣至全球農業使用，被譽為「神奇農藥」。


    穆勒因發現 DDT 的殺蟲效力，在1948年獲得諾貝爾生理學或醫學獎，表彰其對控制瘧疾與公共衛生的貢獻


    瑞秋發現，戰後廣泛使用的 DDT 雖然初期能有效殺蟲，但很快便產生抗藥性，農民便需加大劑量或更換藥劑，造成環境中毒性物質不斷累積。她懷疑這些難以分解的 DDT
    和其他化學藥劑，就是造成生態問題的元凶。底下是她調查時測得的 DDT 濃度數據。生物間的食性關係:植物性浮游生物 $\rightarrow$ 水蚤 $\rightarrow$
    小型魚類 $\rightarrow$ 掠食性魚(如鱸魚) $\rightarrow$ 魚鷹(猛禽)


    | 生物種類 | 體內 DDT 濃度 | 出現健康影響的濃度門檻 |

    | :--- | :--- | :--- |

    | 湖水 | 0.000003 | 無（非生物） |

    | 植物性浮游生物 | 0.04 | 無明確資料 |

    | 水蚤 | 0.23 | 0.5 以上行動可能受影響 |

    | 小型魚類 | 2.07 | 1.5 以上神經與繁殖受影響 |

    | 掠食性魚（如鱸魚） | 13.8 | 5.0 以上可能抑制蛋白合成 |

    | 魚鷹（猛禽） | 25.0 | 10.0 以上蛋殼變薄、孵化率下降 |


    然而，農藥公司反駁這些質疑，聲稱「水中濃度如此低，甚至測不出來，遠低於任何有害標準，根本不會對生物造成影響」。他們強調，只要在標準範圍內使用，就不會對生態產生實質威脅。


    1962年，她出版了震撼社會的著作《寂靜的春天》，用科學證據揭露農藥濫用對生態系統與人類健康的破壞，引起極大關注。書中描述了原本鳥鳴聲充滿的春天，因為農藥的污染而變得寂靜無聲的景象，令人警醒。然而，也因為她的揭發，化學公司群起攻擊她，指控她誇大其詞甚至不懂化學。但她毫不退縮，勇敢參與公共辯論，並強調「我不喜歡我所見到的，但因此視而不見絕非好事」，展現科學家的良知與責任。


    雖然瑞秋·卡森後來罹癌過世，但她的努力促使政府與大眾重新審視化學品的使用，並推動美國日後禁用 DDT 的政策。她的行動不僅點燃了全球的環保意識，也讓人們明白，科學不只是發現與研究，更應關心生命與環境的永續發展。


    參考資料:1. 翰林出版編輯部(2021)。《自然第二冊》。臺北市：翰林出版股份有限公司

    2. 輔仁大學生物學系。(無年份)。〈1948 年諾貝爾獎得主：保羅·穆勒〉。取自：

    https://www.bio.fju.edu.tw/teaching-excellence-project/content06/detail/194x/1948.htm'
