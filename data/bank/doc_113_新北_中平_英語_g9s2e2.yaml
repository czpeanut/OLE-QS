  section: 2
  number: 42
  type: single
  page: 4
  stem: 42. What is the main idea of the reading?
  options:
  - label: A
    content: K-pop is loved by many fans around the world.
  - label: B
    content: Some Korean words have become part of English.
  - label: C
    content: The best way to learn Korean is to watch Korean shows.
  - label: D
    content: The Oxford English Dictionary is helpful for learning English.
  group_stem: 'Korean Words in the Oxford English Dictionary

    K-pop groups, Korean shows, and Korean movies are getting popular all over the
    world today. Korean people use the word "Hallyu" to describe this phenomenon.
    It means the "Korean Wave." Thanks to the Hallyu, many Korean words are known
    by English speakers and have become part of their language. In 2021, the Oxford
    English Dictionary even added 26 Korean words that are most commonly used in English-speaking
    countries. Here are some examples.


    | Word | Meaning |

    | --- | --- |

    | aegyo | acting in a cute way |

    | oppa | a handsome Korean man |

    | daebak | People say this when they are surprised to see something very good.
    |

    | mukbang | an online video that shows a person who is having a big meal |

    | chimaek | a Korean meal of fried chicken and beer |

    | fighting | The English word got a new meaning in Korean. It is used to cheer
    people up or wish them good luck. |


    The fact that these Korean words are in the Oxford English Dictionary shows how
    popular Korean culture has become. It also shows that English is a growing language
    that is getting new words from different parts of the world over time.


    phenomenon 現象'
  tags:
    textbook: 第六冊（九下）第2次段考範圍
    labeled_by: ai
