  group_stem: 'How to Build Your Own 72-Hour Disaster Kit

    Taiwan is a hotspot for earthquakes, typhoons, floods, and landslides. Sadly,
    such natural disasters not only are scary but also damage buildings and can hurt
    or even kill people.

    Natural disasters can happen at any time, so it’s always a good idea to be well-prepared.
    One way is to have an easy-to-carry 72-hour disaster kit in your home, which experts
    believe is a must-have during any emergency situation. Here are some ideas on
    how to build a disaster kit.


