- id: doc_113_新北_中平_英語_g9s2e2_s2_33
  section: 2
  number: 33
  type: single
  page: 3
  stem: '33.'
  options:
  - label: A
    content: where people eat only one meal a day
  - label: B
    content: that many people are running away from
  - label: C
    content: where even a simple thing costs a lot of money
  - label: D
    content: where everyone has millions of dollars on them
  group_stem: 'What is it like to live in a country 33. ? It is not as good as it
    sounds. At least not for the people in Venezuela. Since 2016, the hyperinflation
    in Venezuela has made people''s life more difficult than ever.

    Because of hyperinflation, the bolivar has become worthless. By the summer of
    2018, a million bolivars could only get you around NT$5. This means that people
    would have to carry several bags of money with them because ordinary things could
    easily 34. tens of millions of bolivars in Venezuela.

    Hyperinflation raises the cost of living. The price of a cup of coffee in 2016
    was 450 bolivars, but by the end of 2018, a cup of coffee cost 2.5 million bolivars.
    35. , there is not enough food for everyone. The shelves at the stores are empty
    most of the time. When there is food, people wait in line for hours just to get
    simple things like eggs and flour. Some have no choice but to turn to the black
    market to buy food 36. . On the black market, one kilogram of flour can cost around
    10,000 NT dollars.

    With all the problems 37. in Venezuela, many people choose to leave the country
    and look for a better life somewhere else. For those who stay, their only hope
    is that all the crazy things will come to an end one day.


    hyperinflation 惡性通貨膨脹 bolivar 委內瑞拉貨幣

    shelf 貨架　　　　　black market 非法交易市場'
  tags:
    textbook: 第六冊（九下）第2次段考範圍
    labeled_by: ai
