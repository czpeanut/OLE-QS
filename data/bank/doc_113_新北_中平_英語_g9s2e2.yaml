  stem: 38. Which of the following questions does the reading answer?
  options:
  - label: A
    content: What kind of food do mountain lions eat?
  - label: B
    content: Why are animals dangerous to cities?
  - label: C
    content: How did P-22 become famous and what happened to him?
  - label: D
    content: How many mountain lions live in LA?
  group_stem: 'A few years ago, Los Angeles lost a special star. It wasn’t an actor
    or singer, but a mountain lion named P-22. He became famous for living in Griffith
    Park, right in the city. Many people loved him, and he helped them care more about
    wildlife.

    When he was young, P-22 crossed two big, busy roads to find a new home in the
    park. This was very dangerous, but he made it. Because of him, people now want
    to build a special bridge to help animals stay safe from cars.

    After living in the park for 10 years, P-22 was found hurt in December 2022, probably
    from a car crash. To stop his pain, wildlife experts decided to end his life.
    Many people were very sad. But P-22’s story reminded everyone that animals need
    help to live safely in cities like LA.

    Now, a special bridge for animals is being built near Los Angeles. It’s called
    the Wallis Annenberg Wildlife Crossing. The bridge is 64 meters long and made
    for animals, not cars. It helps animals cross the busy Highway 101, where many
    animals were hurt before. This crossing is very important. It helps animals find
    food, mates, and new homes without getting hit by fast cars. The project is named
    after Wallis Annenberg, who gave a lot of money to support it. The bridge will
    be the biggest wildlife crossing in the world and should be finished in 2026.

    This bridge will not only help LA’s animals but also be a good example for other
    cities. It will become a monument to P-22, showing how one mountain lion inspired
    people to protect wildlife. It is also a way to remember everything he showed
    us about protecting animals, no matter where they live.'
