- id: doc_113_新北_中平_英語_g9s2e2_s2_45
  section: 2
  number: 45
  type: single
  page: 5
  stem: 45. What is a time capsule?
  options:
  - label: A
    content: It’s a letter that you get from other people.
  - label: B
    content: It’s a box where you put your pocket money.
  - label: C
    content: It’s a letter you write good things about others.
  - label: D
    content: It’s a memory box that reminds you of your past.
  group_stem: '(Rebecca, Fiona, and Josh are digging up their time capsules under
    a tree.)

    Rebecca: Let’s open our time capsules!

    Fiona:I can’t believe that it’s been fifteen years since we buried them.

    Josh:Which capsule should we look at first?

    Rebecca: How about this one? Hey, look. There’s a box of money inside. Do you
    know whose money it is?

    Josh:That is my pocket money. And here is my letter.

    Dear Josh,

    Your grades have never been great at school, but I do know that you will be successful
    one day. If not, here’s a bag of money for you to start your own business. Please
    don’t give up!

    Josh:I don’t think I can start a business with less than one thousand dollars.

    Fiona: Haha. How silly you were! But you were right. You now own five stores.
    You are so successful. Come and see mine. It’s a book and this is my letter.

    Dear Fiona,


    Fiona:I miss Mrs. White. I want to take her baking class again even though I’m
    an engineer now.

    Rebecca: Me, too. I remember the cookies, the pies, and the toast we made in her
    class. She is the best teacher ever. This is my time capsule. Look! I put a picture
    of us inside it.

    Josh: Time capsules are like time machines that are filled with our memories.

    Rebecca: I’m glad that we are still best friends after so many years.'
  tags:
    textbook: 第六冊（九下）第2次段考範圍
    labeled_by: ai
