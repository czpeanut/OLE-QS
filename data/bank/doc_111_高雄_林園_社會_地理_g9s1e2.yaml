  group_stem: "◎請閱讀以下媒體報導，並回答第14~15 題：\n\n歐盟10 月初通過議案，2024 年底，在歐盟販售的手機、平板等都必須使用Type-C\
    \ 充電規格，包含一直以來使用Lightning充電線的蘋果（Apple）。儘管蘋果對協議有不同的意見，但蘋果高層近期受訪坦言，蘋果「別無選擇」，雖然反對但也不得不接受歐盟的規定。\n\
    \    蘋果全球行銷資深副總喬斯維亞克（Greg Joswiak）出，歐盟立法者與蘋果就充電規格監管存有一點分歧。他表示，歐盟的出發點是好的，但監管卻讓事情變得棘手。喬斯維亞克也無奈證實，面對歐盟的規定，蘋果「別無選擇」。雖然他並未直言iPhone\
    \ 將使用Type-C 規格，但這是唯一的解方。\n 根據2021 年數據顯示，蘋果全年銷售2.41 億iPhone 手機，其中歐洲佔了5,600 萬部。\n\
    \                       節錄自< 2022/10/26 中時新聞網   iPhone 真的要換Type-C？蘋果高層認了：不同意但別無選擇>"
