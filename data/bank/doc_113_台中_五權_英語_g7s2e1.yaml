  - label: C
    content: The four seasons are different.
  - label: D
    content: The weather is warm in spring.
  group_stem: 'The weather changes from season to season. There are four seasons in
    a year. They are spring, summer, fall, and winter. The weather is warm in spring.The
    trees and flowers are growing this season. It rains a lot in some places during
    spring. In summer, the weather is very hot. It is the warmest season of the year.
    The days in summer are long, and there are more hours of sunlight.

    Fall comes after summer. The weather in fall is cool and the tree leaves change
    color. Winter is the coldest season of the year. It snows a lot in some places
    during winter. Also, the days in winter are short. There are less hours of sunlight
    this season.


     change 改變 during 在...期間 sunlight 陽光 less 較少 after 在...之後 sunset 日落'
  tags:
    textbook: 第二冊（七下）第1次段考範圍
    labeled_by: ai
