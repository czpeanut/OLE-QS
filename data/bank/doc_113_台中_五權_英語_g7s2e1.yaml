  group_stem: '(Matt and Alan are watching TV in the living room.)

    Matt: Look! World Baseball Classic(WBC) is in Taipei this Saturday. How about
    watching the game together?

    Alan: That’s a good idea. But, how can we get into the stadium there?

    Matt: We can book tickets online.

    Alan: It’s not easy for me. I don’t have a computer.

    Matt: I can do that on the Net.

    Alan: I don’t have money for the tickets.

    Matt: Don’t worry. It’s on me this time.

    Alan: Cool! Thanks. You are a good friend to me.

    Matt: You bet! Let’s have fun.


     pay 付錢 stadium 運動場WBC 世界棒球經典賽'
