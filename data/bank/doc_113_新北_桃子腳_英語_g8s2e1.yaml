  group_stem: 'A Tasty Story: Where the Sandwich Came From

    A French writer told the story of the sandwich in the late 1700s in a book called
    A Tour to London. It was only a few lines long:

    "The Minister of State spent a day at a public gambling table, so busy with the
    game that he only ate a beef sandwich without leaving the table. This new dish
    became very popular while I was in London and was named after the minister who
    created it."

    The minister was John Montagu, the fourth Earl of Sandwich. The word “sandwich”
    first appeared in a cookbook in 1773. Some say Montagu made it so he could keep
    playing cards without stopping to eat. Others think his chef was the one quick
    on his feet so that the Earl wouldn’t go hungry.

    No one knows the full truth, but one thing is clear: if the sandwich was named
    after someone who wanted to eat and play at the same time, it could have been
    anyone!

    Since John Montagu made it famous, let’s celebrate Sandwich Day like this: Make
    your favorite sandwich, name it after yourself, and enjoy!

