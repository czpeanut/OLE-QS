- id: doc_113_高雄_苓雅_國文_g9s2e2_s1_39
  section: 1
  number: 39
  type: single
  page: 7
  stem: 「是余之罪也夫！是余之罪也夫！身毀不用矣！」推想作者說這段話的時候，應是什麽神情？
  options:
  - label: A
    content: 驚奇訝異
  - label: B
    content: 滿腹牢騷
  - label: C
    content: 傷心絕望
  - label: D
    content: 大發雷霆。
  group_stem: '太史公遭李陵之禍，幽於縲紲①。乃喟然而嘆曰:「是余之罪也夫！是余之罪也夫！身毀不用矣！」退而深惟曰:「夫詩、書隱約②者，欲遂其志之思也。昔西伯拘羑里③，演周易；孔子厄陳、蔡④，作春秋；屈原放逐，著離騷；左丘失明，厥有國語；孫子臏腳⑤，而論兵法；不韋遷蜀，世傳呂覽；韓非囚秦，說難、孤憤；詩三百篇，大抵聖賢發憤之所為作也。此人皆意有所鬱結，不得通其道也，故述往事，思來者。」                                                       (史記
    太史公自序)

    注釋①紲紲：囚禁在監獄之中。②隱約：意義深微而言詞簡略。③羑里：以前西伯昌被紂王拘禁在羑里。④孔子厄陳、蔡：孔子周列國，在陳、蔡受到圍困，因而絕糧。⑤孫子臏腳：戰國大軍事家孫臏因受龐涓所害，割去膝蓋骨。'
