- id: doc_113_高雄_苓雅_國文_g9s2e2_s1_35
  section: 1
  number: 35
  type: single
  page: 6
  stem: 根據上文，下列敘述何者正確？
  options:
  - label: A
    content: 假如人的肝臟有了疾病，其情緒的成因一定是太過憤怒
  - label: B
    content: 人一旦有了各種情緒，就會使內臟受到傷害而有所虧損
  - label: C
    content: 雖有治療流程，但情緒太過而造成內臟受傷也不易治癒
  - label: D
    content: 有智慧的醫師進行情緒治療時，多採取情緒壓抑的方法。
  group_stem: "喜、怒、憂、悲、思、恐、驚，謂之七情。七情通於五臟：喜通心，怒通肝，憂通肺，悲、思通脾，憂通腎，驚通心與肝。故七情太過，則傷五臟。七情内傷，則有所虧損，療之不易也。須識其何臟獨傷，觀其色，察其脈，驗其形神，詳其太過與不及，而後調濟之。其惟智者之能事乎!\n\
    \                                                             高士宗《醫學真傳・七情內傷》"
