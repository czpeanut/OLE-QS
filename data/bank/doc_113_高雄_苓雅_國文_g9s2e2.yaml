    content: 人們常選擇性的認知，不肯面對真相
  - label: D
    content: 人生追求的是美好典範，供後世仿效。
  group_stem: "李清照曾在晚年下嫁張汝舟，原來只想在晚年圖個清靜平凡，讓在顛沛流離中疲憊的身心得到休憩，誰知，這個張汝舟竟是個不良之徒，他以一個奸商的目光，看上了李清照在亂離中已所剩無幾的文物，所謂結婚只是詐騙的一個手段，等到文物到手了，他立刻對李清照拳腳相加，百般虐待。但李清照知道生命的可貴，知道善良高雅不該自甘滅亡，因此不顧輿論的訕笑，在結婚三個月後向官府提出解除婚姻的訴訟。\n\
    千千萬萬不知道李清照命運悲劇的讀者，卻在心中一直供奉著一個無限優雅的李清照。這是一種虚假嗎？還是一種比表層的真實更深的真實？真希望飽學之士們不要嘲笑後代讀者對於李清照命運悲劇的無知，這種無知正體現了一種歷史的過濾和選擇。那些連李清照本人也擔心「難逃萬世之譏」的惡名並未長久延續，真正延續萬世的名譽，在當時被大家忽視了，包括李清照自己。\n\
    \                                                  (改寫自余秋雨關於名譽·舉例李清照)"
