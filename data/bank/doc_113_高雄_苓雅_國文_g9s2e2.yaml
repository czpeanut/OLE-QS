- id: doc_113_高雄_苓雅_國文_g9s2e2_s1_26
  section: 1
  number: 26
  type: single
  page: 5
  stem: 作者認為現代年輕人面對生活，及時的享樂遠比任何學習都來得有吸引力的理由為何?
  options:
  - label: A
    content: 生在不必為物質生活擔憂的時代，電腦和網路視訊發達
  - label: B
    content: 處在一個消耗過度的社會，有過量的資訊和太多的誘惑
  - label: C
    content: 對年輕的朋友而言，這個世界混亂了點，以致容易迷失
  - label: D
    content: 現今這個世界遠比作者所成長的年代不但遼闊還更複雜。
  group_stem: "年輕朋友們，這個世界對你們來說，恐怕是混亂了一點。有時我也會將心比心，如果我也誕生在這樣的年代，是不是能夠很快找到人生的方向？雖然你們出生在一個不必為物質生活擔憂的時代，甚至，文字和閱讀對你們而言不是那麼必要，電視和電腦，影像和網路，你們的世界遠比我們所成長的年代遼闊而複雜，也因此，更需要智慧去理解。\n\
    \    對年輕的你們而言，及時的享樂可能遠比任何學習都來得有吸引力，因為誘惑太多，資訊過量，你們處在一個消耗過度的社會，要沉静心志去思考自己的方向以及追求的目標，可能真的有點困難。我記得當年初創業時，帶著剛做好的計算機四處找客户，印象很深刻的一次是到了越南，半夜躺在破舊的旅館，不遠處的砲聲隆隆，戰争就在窗外，第一次感覺到死亡就在幾百公尺外。心裡有恐懼，可是有更大的意志和企圖壓過心底的恐懼。人會害怕，往往是因為未知，因為不曉得會發生什麼樣的狀況，因為無知，所以心生恐懼。可是，我知道我要的是什麼，那種熱情會讓恐懼也變得容易征服。\n\
    \    成功背後的奮鬥故事，你們可能已經聽得厭煩了，我只想說一個很簡單的概念，這是個需要創意的時代，有創意的人才能成功，但是創意絕對不是坐在家中等候它憑空而降的靈感。\n\
    \    畢卡索的抽象畫很多人都覺得是塗鴉亂畫，看不出所以然，甚至有人批評，沒有學過畫的人都可以畫抽象畫。可是你去看畢卡索藍色時期的畫作，他的素描，你會忍不住驚嘆他的功力，那是經過長期訓練之後的深厚功底，這個功底奠定了他日後開創抽象畫這種新風格的基礎。任何創新的風格和概念，都來自於對傳統的學習和浸潤，講得更簡單些，創新就是一種對傳統的挑戰，既然要挑戰傳統，又怎能不知己知彼？\n\
    \    傳統的價值往往有不可思議的智慧，像現在流行的事物，不論是暢銷書或暢銷商品，有哪些是真的可以打動你的心靈，可以穿越時空的限制仍能觸發你對這個世界的善意和美感？流行往往是消耗品，而唯有智慧是没有保存期限的，可以永遠新鮮。這些養分不是古老的化石，恰好是創新的基石，如同牛頓說的:「站在巨人的肩膀上看事物。」因為有了巨人的肩膀，我們可以看得更高更遠。\n\
    \    或許，年輕人們，你們想要知道的可能是成功的捷徑，或幸福的秘訣，然而幸福屬於有智慧的人，只有能洞悉世情、理解別人的人，才能找到那把打開幸福之門的鑰匙。静下心來觀察自己，如果是一隻鳥，就不要羨慕魚的生活，追求創意的同時，先問自己夠不夠努力，在創意的背後，往往是無數辛苦功力的累積。\
    \                                (溫世仁 給年輕人的一封信)"
