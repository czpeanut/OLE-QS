- id: doc_113_高雄_苓雅_國文_g9s2e2_s1_24
  section: 1
  number: 24
  type: single
  page: 4
  stem: 根據上文內容，下列選項說明何者正確？
  options:
  - label: A
    content: 雄性深海鮟鱇魚具有明顯的「釣竿」和餌求，有助於吸引雌性
  - label: B
    content: 雄性鮟鱇魚咬住選定的伴侶後，除精巢外身體各部分會逐漸退化
  - label: C
    content: 鮟鱇魚為體外受精，雄性排出精子後透過血管輸送給雌性
  - label: D
    content: 深海鮟鱇魚具有致銳的視覺，得以在黑暗中順利找到未來配偶。
  group_stem: "以部分深海鮟鱇魚來說，雌性有明顯的「釣竿」和餌球，雄性就不是這麼一回事了。他們的體型比雌性小得多，看起來就像普通小魚，而且不具有吻觸手這種吸引獵物的功能。你可能會很疑惑，那他們要如何吃東西呢？\n\
    \    比起吃，他們有著更重要的任務。雄性鮟鱇魚擁有非常敏銳的嗅覺，幫助他們嗅探在深海黑暗中的未來配偶。當他找到她時，可能會面臨與四位男分享伴侶的窘境。但愛是盲目的，對伴侶的渴望最終勝過一切。在雄性鮟鱇魚用他那小而鋒利的牙齒咬住雌性后，身體各部位就會逐漸退化，因為他不再需要這些構造；他身上的器官也會逐漸退化消失，只留下精巢持續發育，成為雌性鮟鱇魚身上不可移動的一個附屬品。\n\
    \    鮟鱇魚是體外受精，所以雌性會以血管輸送荷爾蒙給雄性，讓她們在排卵的同時，雄鮟鱇魚也可以排出精子。於是，雄性鮟鱇魚成了她生命中不可或缺的一部分，確保雌性可以在她的餘生中產生受精卵，成為物種延續下去的關鍵角色。\n\
    \    除了部分深海鮟鱇魚有寄生行為和極端性別二態性(兩性間有明顯的外觀差異)外，其他的鮟鱇魚並不寄生也無雌雄間的極端差異，推性和雌性體型通常相近。而這些自由自在的雄性鮟鱇魚會花上一輩子的時間來找他們的真命天女，聽起來快樂多了，對吧。\n\
    \                         (節選自泛科學——深海鮟鱇魚X 檔案:糾纏在暗黑大洋中的極端端痴戀)"
