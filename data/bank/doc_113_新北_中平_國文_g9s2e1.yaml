- id: doc_113_新北_中平_國文_g9s2e1_s2_40
  section: 2
  number: 40
  type: single
  page: 5
  stem: 菊花在「前庭牆下」消失的原因，下列敘述最適當的是：
  options:
  - label: A
    content: 舂陵人忙著將菊花製成菊花酒用以助興養生，因此消失
  - label: B
    content: 歌妓將菊花製成香包佩戴身上，以提高身價，因此消失
  - label: C
    content: 前庭牆下處人來人往，菊花被踩踏蹂躪，因此凋謝枯萎
  - label: D
    content: 菊花移地種植於舂陵後，無法適應氣候，因而凋謝枯萎。
  group_stem: "(三)閱讀下文，回答40、41 題 \n    舂陵俗不種菊，前時自遠致之，植於前庭牆下。及再來也，菊已無矣。徘徊舊圃，嗟嘆久之。誰不知菊也，芳華可賞，在藥品是良藥，為蔬菜是佳蔬。縱須地趨走，猶宜徙植修養，而忍蹂踐至盡，不愛惜乎！嗚呼！賢士君子自植其身，不可不慎擇所處。一旦遭人不愛重如此菊也，悲傷奈何！於是更為之圃，重畦植之。其地近宴息之堂，吏人不此奔走；近登望之亭，旌旄不此行列。縱參歌妓，菊非可惡之草；使有酒徒，菊為助興之物。為之作記，以託後人；並錄藥經，列於記後。\
    \                                                                            \
    \     元結菊圃記"
