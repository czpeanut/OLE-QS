  - label: D
    content: 武則天對待臣子一視同仁賞罰分明。
  group_stem: "(四)閱讀下文，回答44、45 題 \n    狄梁公與婁師德同為相。狄公排斥師德非一日，則天問狄公曰：「朕大用卿，卿知所自乎？」對曰：「臣以文章直道進身，非碌碌因人成事。」則天久之曰：「朕比不知卿，卿之遭遇，實師德之力。」因命左右取筐篋，得十許通薦表，以賜梁公。梁公閱之，恐懼引咎，則天不責。出於外曰：「吾不意為婁公所涵！」而婁公未嘗有矜色。\
    \ \n  注釋①婁師德：唐武后時宰相  ②狄梁公：狄仁傑   \n                                           \
    \                                          王讜 狄仁傑與婁師德"
