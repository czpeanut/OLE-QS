- id: doc_113_新北_中平_國文_g9s2e1_s2_45
  section: 2
  number: 45
  type: single
  page: 6
  stem: "下列關於本文的敘述，何者正確？ \n    甲、武則天讓狄仁傑看奏本的原因是認為狄仁傑實力不如婁師德 \n    乙、狄仁傑看奏本之後非常惶恐是因為奏本裡都是狄仁傑的優點\
    \ \n    丙、讓狄仁傑對婁師德改變態度的關鍵物是筐篋內約十件通薦表 \n    丁、文章中藉武則天與狄仁傑的對話主要是要烘托婁師德的寬容"
