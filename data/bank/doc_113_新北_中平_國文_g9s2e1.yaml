- id: doc_113_新北_中平_國文_g9s2e1_s2_42
  section: 2
  number: 42
  type: single
  page: 6
  stem: 依據(甲)文，下列說明正確的是：
  options:
  - label: A
    content: 芫荽就是香菜也可以稱為花椒或茴香，烹調食物的過程中加入它可增加食物的色香味
  - label: B
    content: 泰式料理中常用芫荽子，是因其味道層次豐富多變，涼拌清蒸靈活運用，供饕客享用
  - label: C
    content: 中國菜使用芫荽，取其清香、調味與菜色美感，廚師發明出許多以香菜為主食的料理
  - label: D
    content: 從文中論述可知：芫荽不僅廣泛出現於中國料理，也是各國料理中會使用的調味香草。
  group_stem: "(三)閱讀下文，回答42、43 題： \n(甲) \n    香菜原產於地中海沿岸涼爽潮溼的地區，自古即為希臘、羅馬等文明古國民眾廣為使用的香料。漢武帝時代，張騫出使西域，帶回了香菜的種子栽種成蔬菜使用。因它的香氣深受中原民眾喜愛，大家紛紛栽種，稱其為蒝荽或芫荽。據作家蔡珠兒形容其氣味：「芫荽的基調是一段清清冷冷的甜香，幽幽然施施然飄來，有種空渺的遠近感。」芫荽的芳香氣味深受大眾喜愛，成為廣泛使用的香辛料蔬菜，漸漸地它就得到了「香菜」這個美譽。\
    \ \n  而在烹調方面，中國菜和墨西哥菜常用芫荽的葉子，芫荽葉子高溫加熱體積會顯著縮小，所以通常不炒或煮，一般是湯菜入盤之後，才把切碎的芫荽撒在上面。如同蔡珠兒所說：「中國菜用芫荽，一來取其清香以烘襯菜餚的氣味，二來借它沁人的翠色及散布有致的莖葉以增添生動食相，雖說兼顧了調味功能與菜色美感，但我總覺得其心法只在一個『借』字，並不是認真要吃它。」\
    \ \n  在歐洲、西亞和南亞則較常用晒乾之後的果實，並且在油裡炸過才易出味。印度菜餚中大多用磨成粉的芫荽子，但磨粉之後很容易失去味道。泰式菜餚中則會使用芫荽根，辛香味要比葉子來得強，常連同芫荽葉使用，成為泰式菜餚香辛基底。但不管怎麼使用，其用法可能都近乎中國人使用花椒或茴香而已。\
    \ \n  芫荽在不同民族間應用如此廣泛，若還以為芫荽是中國菜的專擅特長，這樣說起來只能算是一項美麗的誤解。 \n(乙)芫荽與芫荽子的功能"
  shared_asset: g2_42_43
