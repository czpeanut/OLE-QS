  section: 1
  number: 35
  type: single
  page: 5
  stem: "關於本文提及的寫作方法，下列敘述何者錯誤？ \n    作文之法：意之曲折者，宜寫之以顯淺之詞；理之顯淺者，宜運之以曲折之筆；題之熟者，參之以新奇之想；題之庸者，深之以關繫之論。至於窘者舒之使長，縟者刪之使簡，俚者文之使雅，鬧者攝之使靜，皆所謂裁制也。\
    \ \n幽夢影"
  options:
  - label: A
    content: 文章內容較複雜時，應採用淺白的文字表達
  - label: B
    content: 若題目平凡普通時，應試深入探討背後含意
  - label: C
