- id: doc_113_台中_大業_英語_g8s1e1_s2_35
  section: 2
  number: 35
  type: single
  page: 4
  stem: 35. What is the reading mainly about?
  options:
  - label: A
    content: People must see a doctor when they have a common cold.
  - label: B
    content: We can use some food from nature as medicine for a cold.
  - label: C
    content: Many people think that ginger and garlic smell so bad.
  - label: D
    content: Drinking water and resting enough are also important.
  group_stem: 'When we are sick, many of us will go see a doctor. But going to the
    doctor is not always a must when we have a common cold. We can also turn to nature
    for help.

    When we catch a cold, our body fights it really hard. This makes us feel weak
    and sick. Some of nature’s gifts help make us feel more comfortable. One of them
    is honey. In fact, in many cultures, people eat honey to fight coughs.

    Garlic and ginger are helpful, too. In Spain, when someone feels under the weather,
    it is normal to drink garlic tea. It can help the body fight the cold. In Chinese
    culture, people often put ginger root in their tea for the same reason. Although
    ginger and garlic may not taste or smell good, they are good for fighting a cold.

    Food from nature can help treat a cold. You can give them a try next time. However,
    it’s always important to have a lot of water and rest.


     when 當…時 common 常見的 turn to nature 轉向大自然 fight 對抗 weak 虛弱的 comfortable 舒服的 cultures
    文化 coughs 咳嗽 garlic 大蒜 ginger 蒜頭 Spain 西班牙 normal 正常的 root 根 reason 原因 although
    雖然 taste 嘗起來 smell 聞起來 important 重要的'
  ai_answers:
    gemini: B
    qwen: B
  answer:
  - B
  answer_status: ai_generated
  answer_source: ai:gemini+qwen
