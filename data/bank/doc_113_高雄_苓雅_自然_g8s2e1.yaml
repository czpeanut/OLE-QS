- id: doc_113_高雄_苓雅_自然_g8s2e1_s1_47
  section: 1
  number: 47
  type: single
  page: 4
  stem: 請根據上面的【科普閱讀】選出錯誤的選項？
  options:
  - label: A
    content: 亞硫酸鹽類常用於乾燥食品（例如：果乾或蔬菜乾等）的加工保存
  - label: B
    content: 利用食品中所含二氧化硫的量可推斷亞硫酸鹽類的使用量，並且做出限制規範
  - label: C
    content: 為了減少攝取到二氧化硫，食用前應先以清水浸泡沖洗、烹調時可開蓋煮沸
  - label: D
    content: 亞硫酸鹽類是利用自己本身被還原來達到漂白的目的。
  group_stem: 【科普閱讀】二氧化硫是什麼？為什麼會出現在食物裡？食品中的二氧化硫來自於食品添加物：亞硫酸鹽類，如亞硫酸鈉（$Na_{2}SO_{3}$）、亞硫酸鉀（$K_{2}SO_{3}$）等。這些添加物具有「使物質發生還原作用」的功能，可漂白食品，也能防止食物中的分子變質、腐敗，導致顏色、味道改變。像是果乾或蔬菜乾等常見乾貨，也會添加亞硫酸鹽來保存和維持顏色。在如食品等富含水分的環境中，亞硫酸鹽類的部分分子會轉變為二氧化硫，便可被檢測到。因此，檢驗單位利用食品中所含二氧化硫的量，以回推添加劑的使用量，並做出限制規範。在選購醃漬或乾燥蔬菜等產品時，應盡量避免購買顏色過白或是有刺激性氣味的食品。在料理或食用前，別忘了「泡、洗、煮」3
    步驟，先將醃漬或乾燥蔬菜以清水沖洗或浸泡處理，利用亞硫酸鹽類與二氧化硫都易溶於水的特性，可減少其殘留。烹調時打開鍋蓋煮沸，也可使二氧化硫揮發。
