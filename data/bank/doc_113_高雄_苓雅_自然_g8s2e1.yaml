- id: doc_113_高雄_苓雅_自然_g8s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 製作蛋糕時，常會在白色的鮮奶油中加入些許色素混合，使其顏色變化增加美觀，而鮮奶油仍維持原本的性質。做好的蛋糕需妥善冷藏，以防止鮮奶油腐壞變質。關於上述鮮奶油「變色」和鮮奶油「變質」兩者的說明，下列何者最合理？
  options:
  - label: A
    content: 兩者都是化學變化
  - label: B
    content: 兩者都不是化學變化
  - label: C
    content: 只有後者是化學變化
  - label: D
    content: 只有前者是化學變化。
- id: doc_113_高雄_苓雅_自然_g8s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 如附圖所示，小林取 2 公克碳酸氫鈉粉末置入試管中，放在酒精燈上加熱，則下列相關的敘述何者錯誤？
  options:
  - label: A
    content: 此為吸熱的化學反應
  - label: B
    content: 裝置中的試管將管口向下傾斜，可避免反應產生的液體逆流回試管底部造成試管因溫差太大而破裂的危險
  - label: C
    content: 澄清石灰水會變混濁，表示碳酸氫鈉加熱會產生二氧化碳
  - label: D
    content: 實驗完畢，應先熄火再將橡皮管抽離石灰水。
