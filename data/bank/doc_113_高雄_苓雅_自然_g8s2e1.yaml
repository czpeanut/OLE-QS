- id: doc_113_高雄_苓雅_自然_g8s2e1_s1_33
  section: 1
  number: 33
  type: single
  page: 3
  stem: '市面上有些鐵製品被稱為白鐵或亞鉛製品，名字中有「鉛」字，但並不含鉛。亞鉛是鐵製品外鍍上一層鋅的外皮，「鍍鋅」是一項常見的金屬表面處理，可將鐵與空氣、水氣隔開，避免生鏽損壞。即使外層的鋅部分破損，導致裡面的鐵外露於空氣中，剩餘的鋅仍可為鐵提供保護。因為鋅的活性比鐵大，比鐵容易氧化，鋅可以「搶走」氧，使鐵不容易氧化生鏽。另外，鋅氧化後形成的氧化鋅會包覆原本的鋅材，使內層不再氧化並提供保護作用。

    根據以上敘述，下述何者正確？'
  options:
  - label: A
    content: 亞鉛是鉛的一種
  - label: B
    content: 鋅的氧化物結構緊密，能隔離鐵與氧，故能防鏽
  - label: C
    content: 鋅對氧的活性比鐵小不易被氧化，故能防鏽
  - label: D
    content: 鋅能與鐵結合成合金，降低鐵的活性，故不易生鏽。
