  group_stem: 'When we talk about brushing teeth, people may think of toothpaste.
    We use it in our everyday life. But do you know that it can do much more than
    just clean your teeth? Let’s learn more about what it can do for you in your life.

    ★Remove marks from glass - To clean dirty marks on glass, you can use a cloth
    with a little toothpaste and fix them. Then, wash off the toothpaste, and the
    marks will be gone. You can also try this on CDs, screens, and cars.

    ★Clean the house - People use toothpaste to clean other things, too. Some people
    use it to take away marks from walls. Others use it to clean the bathroom or the
    kitchen.

    ★Treat bug or insect bites - Don’t rub the bite with your nails after the bug’s
    bites. Just put a little toothpaste on it. The menthol in the toothpaste will
    cool your skin and then the uncomfortable feeling on the skin will go away.

    ★Take away smells - After you cook something with strong smell, it is very difficult
    to take away the smell on your hands. Use some toothpaste on your fingers, and
    then the smell will be gone soon.

    ★Remove gum from hair – When you have gums on your hair, bags, or shoes by mistake
    , you can use toothpaste to clean the gum.

     cloth 抹布 rub 搓揉 menthol 薄荷醇 gum 口香糖'
