    Italy-- When in Italy, do as the Romans do, and never put cheese on seafood.

    Portugal-- Don''t ask the waiter for salt if the dish is on the table. Asking
    for salt would be an offense to the chef''s skills.

    Now you should know what to do after you learn these little tips. Don''t forget
