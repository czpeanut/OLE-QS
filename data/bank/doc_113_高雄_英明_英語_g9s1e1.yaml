  group_stem: 'Kira：Summer vacation is right around the corner, but I still don’t
    have any plans. How about you?

    Riley：Hold on. Three weeks ago, you said you were going to Japan to study for
    a month, didn’t you? Has that changed?

    Kira：Well, that plan fell through when my aunt told my mom that I couldn’t stay
    with her and her family. She said they would be away on vacation at that time.

    Riley：That’s too bad! I’m sure you were sad about the news. As for me, I will
    spend the summer with a really cool and interesting organization. They are trying
    to clean up all the beaches on this island as well as the ocean around it.

    Kira：Wow! That sounds amazing! You really want to help protect our Earth, don’t
    you?

    Riley：Of course! I have always thought that without all the animals and the nature
    in the world, we wouldn’t have a nice place to live in.

    Kira：I hear you loud and clear on that one. Hey, it’s not too late to join you
