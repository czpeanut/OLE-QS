  group_stem: 'Dining abroad can be stressful because you want to show good table
    manners. That''s why it''s a good idea to learn some news before you go abroad.
    Here are a few do''s and don''ts about dining in different countries.

    France-- There will likely be bread on the dining table, but don''t eat all the
    bread before the waiter serves your meal. Have the meal with bread. Tear the bread
    into pieces with hands. Don’t pick it up and bite it directly. When you don’t
    eat the bread, leave it on the table but not on your plate.

    Thailand-- People use forks only to push food into a spoon. It''s not the habit
    to eat with the fork here.

    Mexico-- You should not use a fork and knife to eat food; you should have the
    dishes with your hands here.

    Chile-- Interestingly, touching food with one''s hands is a bad manner in Chile.
    People there use forks even for French fries.

    Italy-- When in Italy, do as the Romans do, and never put cheese on seafood.

    Portugal-- Don''t ask the waiter for salt if the dish is on the table. Asking
    for salt would be an offense to the chef''s skills.

    Now you should know what to do after you learn these little tips. Don''t forget
    to enjoy your meal!

     stressful 壓力大的 manner 禮儀 tear 撕 directly 直接 offense 冒犯'
