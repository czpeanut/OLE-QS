  stem: 下列何者較符合作者的觀點？
  options:
  - label: A
    content: 阿根廷在國際賽場的成功完全源於球隊的技術與實力優勢
  - label: B
    content: 馬拉度納的「上帝之手」事件削弱了阿根廷的國際影響力
  - label: C
    content: 足球在阿根廷不僅是一項運動，更是國家認同的重要象徵
  - label: D
    content: 體育發展落後國家需透過宗教信仰的力量凝聚國民團結力。
  group_stem: '◎請閱讀下文，並完成第 40.-42. 題。


    甲

    很多人知道阿根廷與英國的恩怨情仇，也明白他們在足球場上是永遠的死敵，卻很少人知道，阿根廷是英國足球的嫡傳弟子，1891 年創立的阿根廷足球聯賽，是除了英倫三島以外，世界上第一個足球聯賽。

    蘇格蘭教師哈頓（ALEXANDRO WATSON HUTTON）跟著英國水手來到南美，一手建立了南美洲第一支足球俱樂部 ALUMNI，同時也建立了阿根廷足協，在之後長達三十年的歲月裡，ALUMNI
    主導了阿根廷足球，而阿根廷史上第一場國際足球賽，正是為了慶祝英國女王維多利亞七十歲的生日而舉辦的。


    乙

    阿根廷的足球發展得非常早，曾經在南美雄霸一方，但是在贏得冠軍榮耀上，卻落後於另外兩支南美勁旅－烏拉圭與巴西，在足球世界盃之前，烏拉圭已經贏得兩次奧運金牌，之後又分別在
    1930、1950 年贏得兩次世界盃冠軍，另一個鄰國巴西，在 60 年代稱霸世界，同時因為新技術與新戰法的確立，而有「足球王國」的美譽。

    阿根廷足球的第一個世界冠軍頭銜，一直到 1978 年世界盃才出現，而這一年剛好是阿根廷發生軍事獨裁政變的時候，當時的陸軍總司令魏德拉（Jorge Rafaél
    Videla）以政變奪得政權，並發動「骯髒戰爭」，凌虐並殺害了超過三萬名異議者，同時也用高壓手段逼迫阿根廷 28 歲以下職業足球員不得出國，當年阿根廷成功以地主身分拿下世界盃冠軍，但是以
    6:0 大勝秘魯的比賽，一直被流傳是軍政府以黑市交易的方式，收買了秘魯國家隊，也讓這座冠軍的光彩蒙上陰影。

    1986 年世界盃阿根廷在球王馬拉度納（Diego Armando Maradona）帶領下，再度捧起金盃，這也是在 1982 年福克蘭戰爭後失利後，阿根廷在國際上的重大成就，但是在八強賽對上英格蘭的比賽，馬拉度納用「上帝之手」淘汰對手，同樣引起爭議，不過不論過程如何，這兩次的勝利，都讓阿根廷在國家局勢動蕩不安中，用足球凝聚了國民的團結意識，最終是成功渡過了重大危機。


    ——節錄自石明瑾《Road to World Cup 足球應許之地：朝世界盃奔馳的人們與他們的國度》'
