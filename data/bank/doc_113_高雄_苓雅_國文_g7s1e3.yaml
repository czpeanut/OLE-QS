- id: doc_113_高雄_苓雅_國文_g7s1e3_s1_38
  section: 1
  number: 38
  type: single
  page: 7
  stem: 根據文意，下列段落排序何者最恰當？
  options:
  - label: A
    content: (甲)→(丙)→(乙)
  - label: B
    content: (乙)→(甲)→(丙)
  - label: C
    content: (乙)→(丙)→(甲)
  - label: D
    content: (丙)→(乙)→(甲)。
  group_stem: '◎請閱讀下文，並完成第 38.-39. 題。


    我本是隻螞蟻，小時會在稀飯之下偷埋一瓢砂糖，也會偷偷買一排三個布丁，躲起來一次吃完。幾年前調整飲食，嗜甜的天性似乎有漸漸被馴化的跡象。然而一旦離開家鄉，味蕾就背叛腦子，像是磁碟重組，再次被覆寫成不同的格式。

    （甲）這是極自然的事，你知道嗎？二十世紀初，做成癮實驗科學家說，當老鼠被單獨隔離，給牠一般的水和加了海洛因或古柯鹼的水，用不了多久，老鼠便開始對藥物上癮，只肯喝加藥的水，甚至飲用過量致死。然而，心理學家
    Bruce K. Alexander 亦作了類似的實驗。他建造了能讓老鼠玩耍、並與其他老鼠自由交流、交配的生活環境，此時，加藥的水變得不值一飲。老鼠喝一般的水，過著正常的生活。他認為這說明，當生物與其他同類有足夠的連結時，成癮的機率微乎其微。所有上癮的成因，皆與失去與他人、所屬社會的連結有關。

    （乙）上海外國人多，不乏極富水準的異國餐廳。周末和朋友吃吃喝喝，免不了一嚐各式甜點。法租界的幾家甜點店，每週都隔空像我拋著媚眼，Liquid Laundry
    的藍莓比利時鬆餅、Farine 的檸檬百香果塔、覆盆子塔……我的嗜甜小惡魔又慢慢地長出角來。

    （丙）所以，很自然的，離開家鄉，必須重新建立社會網路，這件事為我的嗜甜基因提供了滋養環境。


    ——節錄自謝子凡〈味覺的覆寫與拗執〉'
  answer:
  - B
  answer_source: answer_key_vlm
