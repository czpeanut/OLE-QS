  group_stem: '◎請閱讀下文，並完成第 45.-47. 題。


    萊恩‧赫傑克（Ryan Hreljac）是一位改變世界的孩子。

    他在六歲時得知有些地方的人因缺乏乾淨的水而死亡。他向父母要錢，想去非洲挖一口井，父母卻建議他憑自己的能力賺錢。他透過洗車、擦窗戶等賺錢方式，在四個月內存下七十元加幣捐給慈善機構，□發現挖井需要兩千元。萊恩□放棄，而是繼續努力，□吸引了更多捐款。1999
    年，烏干達的一個村莊建成了他的第一口井，村民終於喝上清潔的水。

    隨後，萊恩的善舉引發全球關注，他成立了「萊恩基金會」，至今已在非洲、亞洲和南美洲的 16 個國家建造了近千口井，讓 85 萬人獲得了乾淨的水源。他的筆友吉米‧阿卡納因內戰而無家可歸，後被萊恩的家人收養，並立志成為一名律師或老師，延續愛的力量。

    萊恩的故事顯示了愛心的真正意義：不只是情感上的同理，更需要化為行動。從他父母的教育可以看出，培養孩子的責任感與堅持，是促成奇蹟的重要因素。這也讓我們反思，愛的行動無關年齡大小，而是人人都可以參與的改變。

    村上春樹曾說：「在高牆和蛋之間，我永遠站在蛋這一邊。」像萊恩這樣脆弱的小小力量，當被保護與孵化，能夠成為飛越高牆的力量。萊恩的故事提醒我們，＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿。


    （改寫自郝廣才〈行動的水滴才能匯流大河）'
