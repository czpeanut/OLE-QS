    〈我的海〉 宋尚緯

    你走了以後

    那些悲傷的語言

    都隨著雨落入海裡

    沉進太陽照不進的地方

    沉進那些

    我看不見的地方


    痛苦和快樂一樣

    會漸漸被分解

    變成更小的分子

    像泡沫，浮上海面

    被大氣帶到更遠的地方

    到我感受不到的地方


    我以為一切都停下來了

    太陽卻照常起落

    有些痛苦變成浪被打上岸

    沒有留下任何話

    日光把它曬成了鹽

    退潮時海風便將它吹走


    我曾以為痛苦

    是佇立在生命裡的石柱

    頑固且難以摧毀

    海使我變得堅硬

    太陽卻照在我的身上

    讓我成為粗糙的鹽粒

    那些沒說出口的話

    最後都成為我的海洋了

    它們也成為我的浪

    成為我的鹽

    成為我的花'
