  stem: 關於本文「 」中字義的解釋，何者正確？
  options:
  - label: A
    content: 余雞「屢」勝之：每每
  - label: B
    content: 鬥雞「雄」天下：陽性的
  - label: C
    content: 又不得，「益」忿懣：幫助
  - label: D
    content: 余亦酉年酉月生，「遂」止：滿足。
  group_stem: '◎請閱讀下文，並完成第 48.-50. 題。


    天啟 壬戌間好鬥雞，設鬥雞社於龍山下，仿王勃〈鬥雞檄①〉，檄同社。仲叔 秦一生日攜古董、書畫、文錦、川扇等物與余博，余雞屢勝之。仲叔忿懣②，金其距③，介④其羽，凡足以助其腷膊⑤敪咮⑥者無遺策，又不勝。人有言徐州
    武陽侯 樊噲子孫，鬥雞雄天下，長頸烏喙，能於高桌上啄粟。仲叔心動，密遣使訪之，又不得，益忿懣。

    一日，余閱稗史⑦，有言唐玄宗以酉年酉月生，好鬥雞而亡其國。余亦酉年酉月生，遂止。

    （張岱《陶庵夢憶‧第三卷》）

    ※注釋：

    ①檄：音ㄒㄧˊ，古代用於徵召、聲討等的官方文書。

    ②懣：音ㄇㄣˋ，憤恨。

    ③距：公雞、雄雉等腳上蹠骨後上方突出像腳趾的部分。

    ④介：披甲戴盔，指幫鬥雞武裝。

    ⑤腷膊：音ㄅㄧˋ ㄅㄛˊ，鳥類拍翅的聲音。

    ⑥敪咮：音ㄉㄨㄛˊ ㄓㄡˋ，此指鳥類鳴叫聲。

    ⑦稗史：記載瑣事的野史、小說之類。'
  answer:
  - A
