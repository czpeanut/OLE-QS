- id: doc_113_高雄_苓雅_國文_g7s1e3_s1_18
  section: 1
  number: 18
  type: single
  page: 3
  stem: 「然」字可作為形容詞或副詞之詞尾助詞，解釋成「……的樣子」。如〈兒時記趣〉中「為之『怡然』稱快」即為之。下列「 」中的「然」字，何者屬於此種用法？
  options:
  - label: A
    content: 宣和初，徽宗有意征遼，蔡元長、鄭達夫不以為「然」
  - label: B
    content: 凡有四端①於我者，知皆擴而充之矣，若火之始「然」，泉之始達 （①四端：人的四種善性。）
  - label: C
    content: 吾不能早用子，今急而求子，是寡人之過也。「然」鄭亡，子亦有不利焉
  - label: D
    content: 主人視其里居、姓氏，似有所動，問所從來。忠泣訴父名，主人悵「然」若失。
  lesson_raw:
    title: 兒時記趣
    basis: 題幹提及〈兒時記趣〉
