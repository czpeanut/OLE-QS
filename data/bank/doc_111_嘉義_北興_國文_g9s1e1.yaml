  section: 2
  number: 10
  type: single
  page: 1
  stem: 下列選項，何組所指的季節前後相同？
  options:
  - label: A
    content: 煙花三月下揚州／秋山紅葉
  - label: B
    content: 薰風自南來／金風颯爽
  - label: C
    content: 溪口冰已合／百花爭妍
  - label: D
