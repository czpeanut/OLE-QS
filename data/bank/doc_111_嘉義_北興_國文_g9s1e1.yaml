  number: 21
  type: single
  page: 3
  stem: 「英傑哪堪屈下僚／便栽門柳事蕭條／鳳凰不共雞爭食／莫怪先生懶折腰」上述詩句所歌詠的是哪一位古人？
  options:
  - label: A
    content: 陶潛
  - label: B
    content: 屈原
  - label: C
    content: 李白
  - label: D
    content: 蘇軾。
- id: doc_111_嘉義_北興_國文_g9s1e1_s2_22
  section: 2
  number: 22
  type: single
  page: 3
  stem: 余光中〈戲李白〉說：「那轟動匡廬的大瀑布/無中生有/不止不休/可是你傾側的小酒壺？」這段詩句主要在表達什麼？
  options:
  - label: A
    content: 驚嘆廬山大瀑布懾人的氣勢
  - label: B
    content: 讚美李白酒後作詩的才思敏捷
  - label: C
    content: 感謝李白使世人見到廬山之美
  - label: D
    content: 表示李白一定要透過喝酒，才能激發他的寫詩靈感。
- id: doc_111_嘉義_北興_國文_g9s1e1_s2_23
  section: 2
  number: 23
  type: single
  page: 3
  stem: 「世界是多麼美好，在這片廣袤無垠的星空下，人們就不可以舒適、自由的生活嗎？在這裡，他們怎麼會保存凶狠的、復仇的情感，擁有消滅同類的瘋狂想法呢？」這段文字最適合作為下列何者的宣傳標語？
  options:
  - label: A
    content: 環境保護組織
  - label: B
    content: 反戰和平社團
  - label: C
    content: 心理健康基金會
  - label: D
    content: 都市更新促進計畫。
- id: doc_111_嘉義_北興_國文_g9s1e1_s2_24
  section: 2
  number: 24
  type: single
  page: 3
  stem: 「其實最精緻最恣縱的聊天應該是讀書了。或清茶一盞邀來莊子，或花間置酒單挑李白。如果嫌古人渺遠，則不妨與辛稼軒、曹雪芹同其哭歌，如果你嚮往更相近的跫音，便不妨拉住梁啟超或胡適之來聒絮一番。如果你握一本生活的藝術，林語堂便是你談笑風生的韻友，而執一卷白玉苦瓜足以使余光中不能不向你披肝瀝膽。」下列何者最符合這段文字的旨意？
  options:
