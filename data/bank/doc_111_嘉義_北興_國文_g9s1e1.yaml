- id: doc_111_嘉義_北興_國文_g9s1e1_s2_11
  section: 2
  number: 11
  type: single
  page: 1
  stem: 下列關於李清照〈如夢令〉的敘述，何者說明正確？
  options:
  - label: A
    content: 「試問捲簾人」表示作者想試探侍女是否盡責
  - label: B
    content: 「濃睡不消殘酒」指熟睡了一晚也無法消除殘餘的酒意
  - label: C
    content: 「卻道海棠依舊」顯現答話者不置可否的心態
  - label: D
    content: 「應是綠肥紅瘦」為作者親眼所見之景。
  lesson_raw:
    title: 如夢令
