  stem: 根據本文，下列敘述何者正確？
  options:
  - label: A
    content: 第一個說法可信度不高
  - label: B
    content: 李白曾在文章中提及，自己和李隆基是親戚關係
  - label: C
    content: 作者認為第二種的說法完全可信
  - label: D
