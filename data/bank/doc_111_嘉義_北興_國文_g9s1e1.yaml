  group_stem: "大名鼎鼎、幾乎婦孺皆知的李白是一個實實在在生平不明的人，用現代的話來說，這孩子就是個\n黑戶啊，出生地、出生日期、父母情況、家庭背景，史料皆未註明。但是，與之相關的傳聞、傳說卻\n\
    很多很多。其中流傳度比較高的說法有兩個。\n 第一種說法是，李白生於唐朝 安西四鎮中的碎葉城（今吉爾吉斯斯坦共和國 托克馬克城西\n南），他的祖先是西涼 武昭王\
    \ 李暠，也就是說，李白和李唐皇室五百年前是一家，和李隆基算得上\n親戚。當然，也有人藉此推測，李白很可能是李建成或李元吉的後人，因玄武門之變，舉家遠赴西域\n\
    避難。這一推斷本身就如同偵探小說，極為複雜，可以講上一天。\n 至於第二個說法，雖然不是特別傳奇，但在我看來，倒也極為勵志。此一說法認為李白的家族是\n隋末大亂期間，為躲避戰火遷居西域，在西域生活奮鬥了八十多年後，終於成功，成為當地的富商，\n\
    出於對祖國故土的懷念，這一家子不遠萬里又從西域遷回了故鄉，並恢復原來的漢姓，於是李白就以\n大唐公民的身分降生在劍南道 綿州 昌隆縣（今四川省 江油市 青蓮鎮）。\n\
    \ 其實，對於第一種說法，史學界一直抱持懷疑。倒是第二種說法比較可靠。退一步講，從現有\n的史料來看，李白至少在四歲到二十四歲期間是在巴蜀之地生活成長的，而且從他的詩文來看，他也\n\
    確實是將蜀地視為故鄉。所以，我們應該不用擔心，一夜之間被其他國家單方面宣布李白是他們國家\n的偉大歷史人物。（士承東林 李白竟是國際偷渡客？詩仙皇室血統的身世之謎）"
