  stem: 蘇東坡為何說佛印的坐姿像牛糞？
  options:
  - label: A
    content: 蘇東坡天性瀟灑，習慣口無遮攔
  - label: B
    content: 諷刺佛印禪師的坐姿極為醜陋
  - label: C
    content: 蘇小妹指示蘇東坡應如此回答
  - label: D
    content: 蘇東坡想占上風，一吐長久敗給佛印的怨氣。
  group_stem: "佛印老實，老被蘇軾欺負。蘇軾有時候占了便宜很高興，回家就喜歡跟他那個才女妹妹蘇小妹\n說。\n 但每次老是讓佛印禪師占盡上風，蘇東坡心裡總覺不是滋味，所以百般用心，想讓佛印下不了\n\
    臺。\n 一天，兩人相對坐禪，蘇東坡一時心血來潮，問佛印禪師：「你看我現在禪坐的姿勢像什麼？」\n 佛印禪師說：「像一尊佛。」\n 蘇東坡聽了之後滿懷得意。\n\
    \ 此時，佛印禪師反問蘇東坡：「那你看我的坐姿像個什麼？」\n 蘇東坡毫不考慮地回答：「你看起來像一堆牛糞！」\n 佛印禪師微微一笑，雙手合十說聲：「阿彌陀佛！」\n\
    \ 蘇東坡回家後，很得意地向妹妹炫耀，說：「今天總算占了佛印禪師的上風。」\n 蘇小妹冷笑一下對哥哥說：「哥哥！你今天輸得最慘！因為佛印禪師心中全是佛，所以看任何眾\n\
    生皆是佛，而你心中全盡是汙穢不淨，把六根清淨的佛印禪師，竟然看成牛糞，這不是輸得很慘\n嗎？」\n 蘇東坡手拈一拈鬍子，黯然地同意蘇小妹的看法。\n 佛看眾生各人均是佛，因為他沒有分別心，只有平等心，心中不起分別，一律平等。（望秋\
    \ 佛\n學小故事）"
