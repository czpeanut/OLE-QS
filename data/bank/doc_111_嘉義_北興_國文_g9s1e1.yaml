- id: doc_111_嘉義_北興_國文_g9s1e1_s2_12
  section: 2
  number: 12
  type: single
  page: 1
  stem: 「柳絮與葵花的不同，就在於這裡，柳絮隨風飄揚，並沒有固定的方向，向日葵卻是不管太陽在哪裡，它的臉孔都會轉向那裏，如此執著。」這段文字透過向日葵告訴我們，當人生走到夏季時，應持有哪種生命態度？
  options:
  - label: A
    content: 立定目標，勇往直前的去追尋
  - label: B
    content: 順其自然，一切隨遇而安
  - label: C
    content: 遵守傳統，固執己見
  - label: D
    content: 學習謙卑，努力精進自己。
- id: doc_111_嘉義_北興_國文_g9s1e1_s2_13
  section: 2
  number: 13
  type: single
  page: 2
  stem: 「秋天是收穫的時刻，也是賞玩的季節，一方面收取自己的耕耘，一方面還能欣賞別人更高的成就，不張狂，不嫉妒，正是學習悠然的好時機。」關於這段話的解讀，下列何者最適合？
  options:
  - label: A
    content: 含淚播種的人必歡呼收割
  - label: B
    content: 做人要有自信心，要肯定自己的努力和成就
  - label: C
    content: 肯定自己，欣賞他人，有益於自我成就和學習
  - label: D
    content: 有捨必有得，人要放下自己，學習他人。
- id: doc_111_嘉義_北興_國文_g9s1e1_s2_14
  section: 2
  number: 14
  type: single
  page: 2
  stem: 下列文句「 」中的成語，何者使用最恰當？
  options:
  - label: A
    content: 櫻花季已到來，賞花的遊客絡繹不絕，盡情享受這「臘盡冬殘」的美好時光
  - label: B
    content: 他們兩個是死對頭，分組活動時總是「心有靈犀」，互相找對方的麻煩
  - label: C
    content: 他個性憨直，做事一向「落落寡歡」，不懂得變通
  - label: D
    content: 事態已嚴重至此，你再怎麼補救也是「江心補漏」為時已晚。
- id: doc_111_嘉義_北興_國文_g9s1e1_s2_15
  section: 2
  number: 15
  type: single
  page: 2
  stem: 余光中〈戲李白〉說：「你曾是黃河之水天上來／陰山動／龍門開／而今黃河反從你的句中來」關於這段詩句的寫作手法，下列分析何者正確？
  options:
  - label: A
    content: 運用今昔對比，凸顯黃河的變遷
  - label: B
    content: 運用倒反的 描寫手法，表現李白的才氣
  - label: C
    content: 運用景色的白描手法，如實呈現黃河流域的奇景
  - label: D
    content: 運用誇張手法， 表示現今許多人對黃河的印象，來自李白的詩句。
- id: doc_111_嘉義_北興_國文_g9s1e1_s2_16
  section: 2
  number: 16
  type: single
  page: 2
  stem: 春節前夕，君君學著寫春聯，上聯寫作「三春淑氣盈門室」，下聯卻寫不出來，請你幫他決定下聯應為下列何者？
  options:
  - label: A
    content: 筆花開遍四時春
  - label: B
    content: 四海風光隨處好
  - label: C
    content: 萬里祥光滿斗文
  - label: D
    content: 五色雲中開曉日。
- id: doc_111_嘉義_北興_國文_g9s1e1_s2_17
  section: 2
  number: 17
  type: single
  page: 2
  stem: 「天下二分」的「二分」使用了「除以二」的數學概念，下列何者與之相同？
  options:
  - label: A
    content: 兩三點雨山前
  - label: B
    content: 三五之夜，明月半牆
  - label: C
    content: 十五升去其半
  - label: D
    content: 五穀不分。
- id: doc_111_嘉義_北興_國文_g9s1e1_s2_18
  section: 2
  number: 18
  type: single
  page: 2
  stem: 「這些詩詞帶給我們的，不只是悲愁的情意，更多時候還有心靈與智慧的啟發。我們必須有一首，或是幾首詩，要放進人生的行囊裡，足以抗禦這詭譎多變的人間。」這段文字的主旨為何？
  options:
  - label: A
    content: 勉勵大家將詩詞運用在文學創作中
  - label: B
    content: 鼓勵大家養成閱讀詩詞的好習慣
  - label: C
    content: 認為讀詩詞內容艱深，帶給人悲愁
  - label: D
    content: 說明閱讀詩詞對人生的種種益處。
- id: doc_111_嘉義_北興_國文_g9s1e1_s2_19
  section: 2
  number: 19
  type: single
  page: 2
  stem: 下列有關宋詞的說明，何者錯誤？
  options:
  - label: A
    content: 與漢賦、唐詩、元曲並稱中國四大韻文
  - label: B
    content: 詞牌與作品的內容大多無關
  - label: C
    content: 依字數多寡，可分為小調、中調、長調
  - label: D
    content: 每個詞牌的句數、字數、平仄和用 韻都有規定。
- id: doc_111_嘉義_北興_國文_g9s1e1_s2_20
  section: 2
  number: 20
  type: single
  page: 3
  stem: 上圖是國家圖書館在２０２１舉辦春天讀詩節「情為何物—歷代愛情詩詞導讀」的講座海報， 班上有幾位同學在經過老師介紹後，決定前往參加。下列哪位同學無法順利參加自己感興趣的講座？
  options:
  - label: A
    content: 小A 想了解先秦愛情詩，於是參加３／１３的講座
  - label: B
    content: 小B 對於愛情詩詞想有廣泛認識，可全程 參與
  - label: C
    content: 小C 在３／２７未時到國家圖書館可以聽歐麗娟教授的「唐詩中的婚姻與愛情」的講座
  - label: D
    content: 喜愛宋詞的小D 可參加「我思君處君思我」的講座。
  assets:
  - key: s2_20_f1
    kind: figure
    file: doc_111_嘉義_北興_國文_g9s1e1/s2_20_f1.png
