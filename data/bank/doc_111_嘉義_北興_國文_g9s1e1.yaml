- id: doc_111_嘉義_北興_國文_g9s1e1_s2_9
  section: 2
  number: 9
  type: single
  page: 1
  stem: 「一片白花映著帶水氣的斜陽，好似一條粉紅絨毯，做了上下兩個山的墊子，實在奇絕！」關於這段描述，下列說明何者正確？
  options:
  - label: A
    content: 「上下兩個山」指的是千佛山和千佛山倒影
  - label: B
    content: 時間是在日出的時候
  - label: C
    content: 句中的「白花」指的是水中的荷花
  - label: D
    content: 運用誇飾修辭技巧來描寫風景。
  lesson_raw:
    title: 大明湖
    basis: 引用劉鶚〈大明湖〉課文原句
