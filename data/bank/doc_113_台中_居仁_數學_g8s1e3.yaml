  stem: "相傳西元前六世紀，古希臘數學家畢達哥拉斯發現把單弦琴的弦線在約五分之二長度的地方用承托托著時，兩邊就能彈出極美妙的和音。他認為，既然琴弦有一個完美的分割點（或比例），那麼所有線條、形狀、物體，萬事萬物，乃至宇宙，都應該有同一個完美的比例。因此，以畢氏為首的許多古希臘數學家，窮畢生精力去研究比例。直到西元前4\
    \ 世紀，在歐幾里得的《幾何原本》一書中，才對這個比例寫下確切的定義：「若將一線段分割成長、短兩段，且長段與短段的比，恰好等於全長與長段的比，則稱此種分割為黃金分割」。\n\
    \   如下圖所示，$\\overline{AB}$、$\\overline{AC}$、$\\overline{BC}$三線段的長度若滿足 $\\overline{AB}：\\\
    overline{AC}=\\overline{AC}：\\overline{BC}$的關係，稱為黄金分割比。\n   若已知$\\overline{AC}=2y$，$\\\
