- id: doc_113_台中_居仁_數學_g8s1e3_s1_2
  section: 1
  number: 2
  type: fill
  page: 1
  stem: '下列敘述哪些正確？_____________。

    (A)有兩個數$A$、$B$，若$AB=0$，則$A=0$ 或$B=0$。

    (B)若方程式$(2x+1)(x+2)=1$，則$2x+1=1$ 或$x+2=1$。

    (C)$x$ 的一元二次方程式$ax^{2}+bx=c$ 中，當$b^{2}-4ac=0$ 時，此方程式有重根。。

    (D)$-1$ 為一元二次方程式$-x^{2}-4x-3=0$ 的一個解。

    (E)解一元二次方程式$(2x+1)(2x-3)=5(2x+1)^{2}$，等號兩邊同除以$(2x+1)$，得$2x-3=5(2x+1)$，利用移項化簡，得$x=-1$'
