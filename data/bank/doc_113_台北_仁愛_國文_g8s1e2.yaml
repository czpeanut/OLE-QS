  stem: 關於本文的說明，下列何者正確？
  options:
  - label: A
    content: 郁離子藉由山貓啣雞而死，強調弱肉強食的法則
  - label: B
    content: 縣官「終弗承以死」，在讚譽官員堅持自身理念
  - label: C
    content: 作者認為宋人之子和山上的野狸一樣令人嗤笑
  - label: D
    content: 透過狸至死弗肯舍雞，來諷刺時人貪財好利益
  group_stem: '（五）

    郁離子居山，夜有狸取其雞，追之弗及。明日，從者1擭2其入之所以雞，狸來而縶3焉，身縲4而口足猶在雞，且掠且奪之，至死弗肯舍也。

    郁離子嘆曰：「人之死貨利5者，其亦猶是也。夫宋人有為邑而以賂致訟者，士師鞫6之，隱弗承；掠焉，隱如故。吏謂之曰：『承則罪有數，不承則掠死，胡不擇其輕？』終弗承以死。且死，呼其子私之曰：『善保若貨7，是吾以死易之者。』人皆笑之。則亦與狸奚異焉？」

    （郁離子．山居夜狸）

    註：

    1 從者：僕人

    2 擭：捕捉野獸的機關木籠

    3 縶：拘囚

    4 縲：繫綁人犯或物品的大繩

    5 死貨利：即「死於貨利的人」

    6 鞫：審問

    7 若貨：你的貨'
