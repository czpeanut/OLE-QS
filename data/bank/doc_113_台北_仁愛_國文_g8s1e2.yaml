  group_stem: '（一）

    (甲)

    帝城春欲暮，喧喧車馬度。共道牡丹時，相隨買花去。

    貴賤無常價，酬值看花束：灼灼百朵紅，戔戔五束素。

    上張幄幕庇，旁織笆籬護。水灑復泥封，移來色如故。

    家家習為俗，人人迷不悟。有一田舍翁，偶來買花處。

    低頭讀長嘆，此嘆無人喻：一叢深色花，十戶中人賦。

    (乙)

    洛陽之俗，大抵好牡丹，春時城中無分貴賤皆插花，雖負擔者亦然。洛陽至東京六驛，以菜葉實竹籠子，藉1覆之使馬上不動搖，以蠟封蒂，乃數日不落。

    註：1藉：鋪墊。'
