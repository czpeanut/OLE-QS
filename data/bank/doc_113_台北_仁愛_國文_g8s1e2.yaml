  - label: C
    content: 各種類「ㄒㄧㄥˊ」／模「ㄒㄧㄥˊ」玩具
  - label: D
    content: 「ㄇㄢˋ」山遍野／姿態「ㄇㄢˋ」妙
- id: doc_113_台北_仁愛_國文_g8s1e2_s4_2
  section: 4
