  group_stem: '世有伯樂，然後有千里馬。千里馬常有，而伯樂不常有。故雖有名馬，只辱於奴隸人之手，駢死於槽櫪之間，不以千里稱也。馬之千里者，一食或盡粟一石。食馬者，不知其能千里而食也。是馬也，雖有千里之能，食不飽，力不足，才美不外見，且欲與常馬等不可得，安求其能千里也？

    策之不以其道，食之不能盡其材，鳴之而不能通其意，執策而臨之曰：「天下無馬。」嗚呼！其真無馬邪？其真不知馬也！（韓愈馬說）'
