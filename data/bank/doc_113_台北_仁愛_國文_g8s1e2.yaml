  section: 4
  number: 16
  type: single
  page: 2
  stem: 「楚楚衣冠乃一書生，早晚總是風流倜儻，平日老想一步登天，好吃懶做仕途無望。」娟娟看見這四句話，幫它做了句型的分析，請問下列何者正確？
  options:
  - label: A
    content: 楚楚衣冠乃一書生──有無句
  - label: B
    content: 早晚總是風流倜儻──判斷句
  - label: C
    content: 平日老想一步登天──敘事句
  - label: D
    content: 好吃懶做仕途無望──表態句
- id: doc_113_台北_仁愛_國文_g8s1e2_s4_17
  section: 4
  number: 17
  type: single
  page: 2
  stem: 主語是句子中所陳述的對象。下列「 」內的詞語，何者不是該句的主語？
  options:
  - label: A
