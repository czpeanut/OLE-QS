  group_stem: '（二）

    魏文侯問於解狐曰:「寡人將立西河之守，誰可用者？」解狐對曰:「荊伯柳者賢人，殆可。」文侯將以荊伯柳為西河守。荊伯柳問左右：「誰言我於吾君？」左右皆曰：「解狐。」荊伯柳見解狐而謝之曰:「子乃寬臣之過也，言於君，謹再拜謝。」解狐曰：「言子者，公也；怨子者，吾私也。公事已行，怨子如故。」

