- id: doc_113_台北_仁愛_國文_g8s1e2_s4_4
  section: 4
  number: 4
  type: single
  page: 1
  stem: 下列文句，何者用字完全正確？
  options:
  - label: A
    content: 道路交通管理修正草案，民眾若拒繳罰鍰，即強致送交通法庭裁處，不再勁行吊扣或吊消駕照
  - label: B
    content: 澄清湖的蓮與白河的蓮有同樣的美，在湖河之中的朵朵嬌顏，不受遊客的喧擾，兀自盛開
  - label: C
    content: 大甲媽祖繞境進香活動，所到之處，萬人空巷，許多善男信女仍絡譯不絕前去朝拜，讓鎮瀾宮香火頂盛
  - label: D
    content: 九二一大地震後，許多人對地震餘忌猶存，六月接連著兩天的六極地震，更讓大家心驚膽戰
- id: doc_113_台北_仁愛_國文_g8s1e2_s4_5
  section: 4
  number: 5
  type: single
  page: 1
  stem: 在愛蓮說一文中，作者將蓮花比喻君子，在日常生活中，我們也常用「慣用語」來比喻人，下列慣用語的說明，何者錯誤？
  options:
  - label: A
    content: 半瓶水—比喻對知識或技能一知半解的人
  - label: B
    content: 變色龍—比喻立場不穩見風轉舵的人
  - label: C
    content: 東道主—比喻經驗老到處事滑頭的人
  - label: D
    content: 領頭羊—比喻在團體中主導的人
  lesson_raw:
    title: 愛蓮說
    basis: 題幹提及愛蓮說一文
- id: doc_113_台北_仁愛_國文_g8s1e2_s4_6
  section: 4
  number: 6
  type: single
  page: 1
  stem: 在歷代文學作品，我們常看到以花為主題的詩作，請問下列哪首詩描寫的植物配對是正確的？
  options:
  - label: A
    content: 待到秋來九月八，我花開後百花殺。沖天香陣透長安，滿城盡帶黃金甲──桂花
  - label: B
    content: 春紅始謝又秋紅，息國亡來入楚宮。應是蜀冤啼不盡，更憑顏色訴西風──菊花
  - label: C
    content: 富貴風流拔等倫，百花低首拜芳塵。畫欄繡幄圍紅玉，雲錦霞裳蹋翠茵──牡丹
  - label: D
    content: 不受塵埃半點侵，竹籬茅舍自甘心，只因誤識林和靖，惹得詩人說到今──水仙
- id: doc_113_台北_仁愛_國文_g8s1e2_s4_7
  section: 4
  number: 7
  type: single
  page: 1
  stem: 有關愛蓮說一文，下列說明何者正確？
  options:
  - label: A
    content: 用「牡丹」象徵尊貴，對世人發出嚴厲的抨擊與不屑
  - label: B
    content: 藉「菊花」的平易近人，來對比「蓮花」的高不可攀
  - label: C
    content: 「蓮之愛，同予者何人？」表達具有道德理想的人，實在難尋，意近於「曲高和寡」
  - label: D
    content: 「噫！菊之愛，陶後鮮有聞。」感嘆世風日下，人心不古，兼善天下的人已經不多
  lesson_raw:
    title: 愛蓮說
    basis: 題幹提及愛蓮說一文
- id: doc_113_台北_仁愛_國文_g8s1e2_s4_8
  section: 4
  number: 8
  type: single
  page: 1
  stem: 文言文中，常使用倒裝句型表示意思，如「蓮之愛」的「之」是將賓語提前的結構性助詞，意即「愛蓮」。請問下列何者「之」字用法與此相同？
  options:
  - label: A
    content: 知「之」為知之
  - label: B
    content: 句讀「之」不知
  - label: C
    content: 無懷氏「之」民歟
  - label: D
    content: 送孟浩然「之」廣陵
  lesson_raw:
    title: 愛蓮說
    basis: 題幹引用愛蓮說課文「蓮之愛」
- id: doc_113_台北_仁愛_國文_g8s1e2_s4_9
  section: 4
  number: 9
  type: single
  page: 2
  stem: 用具體的描述來表達抽象的意念，方可使文章更為生動。下列何者屬於此類的運用？
  options:
  - label: A
    content: 圍牆邊綻放的繁花，是造物主所設下的美麗陷阱
  - label: B
    content: 牡丹花在夜裡被驚動，齊齊轉過頭，發出無聲的驚呼
  - label: C
    content: 黃槐艷麗耀眼的黃色花朵，在陽光下是一種龐大集團的色彩
  - label: D
    content: 她獨自漫步在一望無際的原野，啜飲寂寞，品嚐沉靜的滋味
- id: doc_113_台北_仁愛_國文_g8s1e2_s4_10
  section: 4
  number: 10
  type: single
  page: 2
  stem: 關於森林最優美的一天的寫作手法，下列敘述何者錯誤？
  options:
  - label: A
    content: 善用誇飾、映襯技巧，描寫山黃梔花紛飛、墜落的景致
  - label: B
    content: 運用嗅覺、視覺等摹寫手法，呈現出森林的清幽與曼妙
  - label: C
    content: 作者嗅到金銀花的香味，聯想到一段童年往事，呈現溫馨可愛的一面
  - label: D
    content: 運用寫實又不失優美的文字，將森林中變化萬千的景色，鮮活地呈現在讀者眼前
  lesson_raw:
    title: 森林最優美的一天
    basis: 題幹提及課名森林最優美的一天
- id: doc_113_台北_仁愛_國文_g8s1e2_s4_11
  section: 4
  number: 11
  type: single
  page: 2
  stem: 關於森林最優美的一天，下列選項中的文句闡釋何者正確？
  options:
  - label: A
    content: 「許許多多雪片一般飛落的油桐花，飄盪著、旋轉著，好像仙女散花一般」，意境與「不經一番寒徹骨，焉得梅花撲鼻香」相似
  - label: B
    content: 「我戰戰兢兢地踩著落花前進，唯恐腳印破壞了這稀世白花地毯」，呈現作者對大自然的傑作表達珍惜且心存敬畏
  - label: C
    content: 「只是因為我們很少去接近，也沒空去留意，更無心去關懷，而忘了森林」，表示我們往往只欣賞自然，欠缺與自然共存的省思
  - label: D
    content: 「只有像我這樣深入、珍惜大自然的人，才會受到邀請，才能找到這條美麗的祕徑」，說明想要揭開森林的神祕面紗，需要足夠的專業知識
  lesson_raw:
    title: 森林最優美的一天
    basis: 題幹提及課名森林最優美的一天
- id: doc_113_台北_仁愛_國文_g8s1e2_s4_12
  section: 4
  number: 12
  type: single
  page: 2
  stem: 梁實秋在鳥一文中提到：「客夜聞此，說不出的酸楚！」作者說這句話的心境，與下列何者最相近？
  options:
  - label: A
    content: 將縑來比素，新人不如故（上山採蘼蕪）
  - label: B
    content: 蕩子行不歸，空床難獨守（青青河畔草）
  - label: C
    content: 同是天涯淪落人，相逢何必曾相似（琵琶行）
  - label: D
    content: 共看明月應垂淚，一夜鄉心五處同（望月有感）
  lesson_raw:
    title: 鳥
    basis: 題幹提及作者梁實秋與篇名鳥
- id: doc_113_台北_仁愛_國文_g8s1e2_s4_13
  section: 4
  number: 13
  type: single
  page: 2
  stem: 有關梁實秋 鳥一文的寫作手法，下列敘述何者有誤？
  options:
  - label: A
    content: 以「我愛鳥」點明全文旨趣，表達愛鳥的情緒
  - label: B
    content: 用自然中鳥的苦悶反襯籠中鳥優游自在的快樂
  - label: C
    content: 擅長以日常事物來描摹和譬喻，刻劃鳥的形態
  - label: D
    content: 全文善用古典詩文名句，使文章讀來典雅優美
  lesson_raw:
    title: 鳥
    basis: 題幹提及作者梁實秋與篇名鳥
- id: doc_113_台北_仁愛_國文_g8s1e2_s4_14
  section: 4
  number: 14
  type: single
  page: 2
  stem: 關於梁實秋 鳥一文的說明，下列敘述何者正確？
  options:
  - label: A
    content: 「牠的苦悶，大概是僅次於黏在膠紙上的蒼蠅」──用以反諷人對鳥的虐待
  - label: B
    content: 「減一分則太瘦、增一分則太肥那樣地穠纖合度」──描述鳥的動作輕盈靈巧
  - label: C
    content: 「跳盪得那樣輕靈，腳上像是有彈簧」──敘寫鳥的飛行動作十分快速，而且無聲無息
  - label: D
    content: 「不知是什麼驚動牠了，牠倏地振翅飛去，牠不回顧」──寫鳥毫不眷戀人類的飼養
  lesson_raw:
    title: 鳥
    basis: 題幹提及作者梁實秋與篇名鳥
