- id: doc_113_台北_仁愛_國文_g8s1e2_s5_30
  section: 5
  number: 30
  type: single
  page: 4
  stem: 「目光在已經走過的千里之間來回」，這句話的意思為何？
  options:
  - label: A
    content: 攤開地圖，回想自己曾經走過的地方
  - label: B
    content: 向朋友述說自己曾經有過的旅行經驗
  - label: C
    content: 看著電視裡的遊客詳細介紹山水景色
  - label: D
    content: 在夢中反覆出現自己過去的行旅遭遇
  group_stem: '（三）

    夜雨是行旅的大敵。

    倒不是因為夜間行路艱難，也不是因為沒有帶著雨鞋和傘。夜雨會使旅行者想家，想得很深很深。夜雨會使旅行者企望安逸，突然憬悟到自己身陷僻遠、孤苦的處境，顧影自憐，構成萬里豪情的羈絆。

    不是急流險灘，不是崇山峻嶺，而是夜雨，使無數旅行者頓生反悔，半途而歸。我不知道法顯、玄奘、鄭和、鑑真、徐霞客他們在一次次夜雨中心境如何，依我看，他們最強的意志，是衝出了夜雨的包圍。

    如我無用之輩，常常會在大雨如注的夜晚，躲在鄉村旅店裡，把地圖拿出來細細查看。目光在已經走過的千里之間來回，痴想著其間在夜幕雨帳籠罩下的無數江河和高山。這樣的夜晚，我常常失眠。為了把這種沒出息的惰怠心緒驅趕，我總會在夜雨中邀幾個不相識的旅人長時間閒談。

    但是，真正讓心緒復歸的，完全不是這種談話，而是第二天晴朗的早晨。雨後的清晨，鋪天蓋地奔瀉著一種興奮劑，讓人幾乎把昨夜忘卻；又不能完全忘卻，留下一點影子，陰陰涼涼的，添一分淡淡的惆悵。

    （余秋雨 夜雨詩意）'
