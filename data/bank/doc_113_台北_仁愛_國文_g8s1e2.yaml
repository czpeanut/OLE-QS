- id: doc_113_台北_仁愛_國文_g8s1e2_s5_32
  section: 5
  number: 32
  type: single
  page: 4
  stem: 閱讀上文後，作者在標題中將月餅命名為「百變怪」的原因最可能為何？
  options:
  - label: A
    content: 月餅的造型以百變怪進行設計
  - label: B
    content: 因為月餅可以做成很多種形狀
  - label: C
    content: 各種糕點與食物都能作為月餅
  - label: D
    content: 月餅是由各種餡料混合在一起
  group_stem: '（四）

    每年農曆八月十五日是華人重要的中秋節，在這一天中人們會團聚在一起賞月、烤肉、吃月餅。而其中特有的「月餅」糕點，不僅是代表性的美食，更是承載著好幾個世紀的飲食文化，在華人糕點文化中扮演著重要的角色。

    月餅的起源可追溯到商朝時期，當時人們會在秋天時食用一種類似月餅的糕點，稱為「月餅呈」，主要是以穀物、果仁和蜜為主要成分，有著豐收和幸福的寓意。經過唐代、宋代、明清時期與現代的變遷，月餅不再是傳統的圓形，還有方形、花紋刻印以及月免等不同款式的造型；餅皮則是有油皮、薄皮、冰皮和酥皮等不同口感的變化；內餡也從果仁混著蜜餡，一路到蓮蓉、鹹酥、楊桃蓮子餡、肉鬆、水果餡料、蛋黃流沙，甚至重口味的「榴槤」也成為月餅的內餡。

    臺灣中秋節的月餅，起初是深棕色、油油亮亮的廣式月餅，尺寸通常很大一個，內餡的質地也比較黏膩，適合切塊和家人分食。在融合日式糕點技術的「綠豆椪」出現後，商家開始將月餅縮小，變成可以個人品嘗的大小，至此之後，廣式月餅與綠豆椪遂成了月餅的主流。後來鳳梨酥也被納入月餅禮盒中，成為大家熟知的中秋禮盒，就連蛋黃酥、糖果餅乾、杏仁堅果甚至是茶葉等飲食產品，都能在這中秋佳節以「月餅」的身分進入到人們的口腹之中。我們以往熟知的「月餅」，也漸漸從以前某種糕點的指稱，演變為親友團圓相聚、送禮文化中傳達心意的飲食文化產品。

    （改選自月餅百變怪：中秋「月餅」的多樣化）'
