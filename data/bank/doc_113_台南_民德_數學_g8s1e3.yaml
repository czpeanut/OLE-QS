  stem: '( )體重為衡量個人健康的重要指標之一，下表為成年人利用身高(公尺)計算理想體重(公斤)的三種方式，由於這些計算方式沒有考慮脂肪及肌肉重量占體重的比例，因此結果僅供參考。


