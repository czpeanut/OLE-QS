  group_stem: '子之武城，聞弦歌之聲。夫子莞爾（１）而笑曰：「割雞焉用牛刀？」子游對曰：「昔者，偃也聞諸夫子曰：『君子學道則愛人，小人學道則易使也。』」子曰：「二三子，偃之言是也，前言戲之耳！」            （論語
