- id: doc_113_新北_五峰_國文_g7s1e2_s5_27
  section: 5
  number: 27
  type: single
  page: 4
  stem: 下列自我介紹，何者符合文中所說的「斜槓」概念？
  options:
  - label: A
    content: 張紹玲，女性／高雄市人／數學教師
  - label: B
    content: 薛正杰，天蠍座／體育老師／喜歡看電影
  - label: C
    content: 丁珊妮，家庭主婦／美食部落客／烘焙老師
  - label: D
    content: 王繼生，十八歲／主修企業管理／知名電子廠實習員工
  group_stem: "從二○一六年開始，陸續有人稱自己是「斜槓青年」，而且這樣的身分認同也持續增加， 有越來越多人不再滿足於專一職業的工作模式，開始選擇一種能夠利用自身專業和才藝，經營多重身分的多職人生。\n\
    \    其實「斜槓」一詞便是英文中的「Slash」，早在二○○七年時就由紐約時報的專欄作家Marci Alboher 在專欄以及出版的暢銷書不能只打一份工：多重壓力下的職場求生術中提到這個概念。這些年輕人會在自我介紹中使用「斜槓」來區分不同職業，例如「姓名，職業／職業／職業」，所以被稱作「斜槓青年」。\n\
    \    人類已經跨入知識和創造力的時代，人才才是生產中最重要 industrial 的部分，這樣的概念讓「工作」的意義正在改變，也難怪「斜槓」會開始成為年輕人熱衷的生活方式。在臺灣更是表明了「斜槓」的出現並非偶然，而是社會發展的必然現象。\n\
    \    基本上，「斜槓」的概念有別於傳統的接案工作者，許多斜槓仍有一份正職、為一個企業或組織機構工作，在下班後的時間，繼續發展其他的專業能力。而臺灣的「斜槓」更是打破了框架的限制，呈現更多元的樣貌，沒有年齡、職業與身分的限制。\n\
    \    因此，「斜槓」並不能被完整歸類在任何一種生活模式，有人希望將專業結合公益服務，用自己的能力為更多人解決問題；有人認為工作要與愛好結合，不僅平衡生活，也提升了個人發展的靈活度，追求自我價值；也有人脫離傳統組織的藩籬，善用網路社群平臺，隨時記錄並分享觀點與生活，展現充實人生。這些都是「斜槓」多元的樣貌。\n\
    （艾力克 臺灣斜槓世代的多職人生）"
