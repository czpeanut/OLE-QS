- id: doc_113_新北_五峰_國文_g7s1e2_s5_25
  section: 5
  number: 25
  type: single
  page: 3
  stem: 關於本文對螢火蟲的介紹，下列何者未提及？
  options:
  - label: A
    content: 軀體的長度
  - label: B
    content: 發光的目的
  - label: C
    content: 出現的季節
  - label: D
    content: 生活的地理位置
  group_stem: "螢火蟲屬於鞘翅目昆蟲，分布在溫帶與熱帶，但以熱帶較多。其幼蟲捕食螺類與甲殼類動物，是蝸牛的天敵，也是農家的益蟲。\n    馬來西亞有一種「螢火樹」，舉世聞名。在該國的柔佛州，成千上萬的螢火蟲長年棲息在\
    \ 一片紅樹林上。每當夜晚來臨時，牠們一起發光閃爍，整片紅樹林就像一棵棵有生命的聖誕樹，非常壯觀、美麗。\n    為什麼螢火蟲會發光呢？原來在牠們腹部末端的細胞中，含有一種發光物質的螢光素，此種螢光素一旦與空氣中的氧接觸之後，產生發光酵素作用，然後引起一連串的生化反應，而閃光乃是生化反應之後的副產品。總之，閃光是由發光細胞所產生；而發光細胞所需要的氧氣，則由氣管充分供應。\n\
    \    根據昆蟲學家的研究後發現，螢火蟲發光的原因，除了警示作用之外，主要是為了求偶。有些成蟲不吃不喝，生存唯一的目的就是找對象，以延續後代。牠們的閃光就是兩性引誘的信號。各種不同的螢火蟲均藉著不同的閃光顏色、不同的閃光頻率和不同的閃光應答時間來辨認對方，以進行交尾。不同的螢火蟲，非但彼此不交尾，而且會互相殘食。螢火蟲的體長在0.5\
    \ 至 2.5 公分之間，若干體型較大的雌蟲，會模仿別種雌蟲的閃光信號，藉以引誘其雄蟲而殘食之。\n（改寫自郭泰 拜動物為師）"
