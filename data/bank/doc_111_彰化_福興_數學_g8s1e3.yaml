- id: doc_111_彰化_福興_數學_g8s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '甲、乙兩生解一元二次方程式$(x-1)(2x+3)=(x-1)(x+2)$的過程如下。請問誰的過程完全正確？

    | 甲：$(x-1)(2x+3)=(x-1)(x+2)$ | 乙：$(x-1)(2x+3)=(x-1)(x+2)$ |

    | :--- | :--- |

    | $(x-1)(2x+3)-(x-1)(x+2)=0$ | $(2x+3)=(x+2)$ |

    | $(x-1)[(2x+3)-(x+2)]=0$ | $(2x+3)-(x+2)=0$ |

    | $(x-1)(x+1)=0$ | $x+1=0$ |

    | $x-1=0$或$x+1=0$ | $x=-1$ |

    | $x=1$或$x=-1$ | |'
  options:
  - label: A
    content: 只有甲正確
  - label: B
    content: 只有乙正確
  - label: C
    content: 甲、乙都是正確的
  - label: D
    content: 甲、乙都是錯的
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
