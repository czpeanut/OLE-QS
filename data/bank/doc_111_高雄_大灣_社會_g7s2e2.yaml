- id: doc_111_高雄_大灣_社會_g7s2e2_s1_26
  section: 1
  number: 26
  type: single
  page: 3
  stem: 民國34 年日本投降，而民國35 年的臺灣民間流傳一首民謠：「臺灣光復真吃虧，餓死同胞一大堆。物價一日一日貴，阿山一日一日肥。」民謠中的「阿山」是當時本省人對外省人的稱呼。這首民謠是部分臺灣基層人民對於臺灣光復的心聲，反映了臺灣當時的情況，下列相關敘述何者錯誤？
  options:
  - label: A
    content: 臺灣民眾對新來的統治者失望
  - label: B
    content: 政府實施共產制度，造成貧富差距加大
  - label: C
