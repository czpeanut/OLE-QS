  stem: '右表為日治時期臺灣學齡兒童就學率簡表，依據表內數據及課程所學，

    以下是四位同學的說法：

    甲生：臺人無法獲得與日人帄等的教育機會

    乙生：1940 年代以後為配合皇民化運動，將公學校、小學校一律改稱「國民學校」

    丙生：在臺日人學齡兒童就學率偏高，是內地延長政策所導致

    丁生：日治後期臺灣學齡兒童就學率大幅增加，也提升了日語普及率。

    請問哪幾位說法正確？


    | 年(西元) | 臺灣人 | 在臺日人 |

    | :--- | :--- | :--- |

    | 1917年 | 13.1% | 95.1% |

    | 1920年 | 25.1% | 98.0% |

    | 1925年 | 29.5% | 98.3% |

    | 1930年 | 33.1% | 98.8% |

    | 1935年 | 41.5% | 99.3% |

    | 1940年 | 57.6% | 99.5% |

    | 1943年 | 71.3% | 99.6% |'
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙丙丁
  - label: C
    content: 甲丙丁
  - label: D
    content: 甲乙丁。
- id: doc_111_高雄_大灣_社會_g7s2e2_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 林獻堂出身臺中霧峰望族，在日本治臺時期，對於臺灣的民權運動積極參與，並曾與中國近代知名的政治改革家梁啟超有過一番深談，讓他決心以『非武力抗爭』的方式進行政治運動。請問：由臺灣留日學生及士紳發起的臺灣議會設置請願運動，其時代背景為何？
  options:
  - label: A
    content: 第一次世界大戰爆發，日本徵調臺人赴南洋戰場
  - label: B
    content: 霧社事件發生後，臺人不滿總督府的統治措施
  - label: C
    content: 第一次世界大戰後，全球瀰漫民族自決的風潮
  - label: D
    content: 中國國內要求民主的聲浪高漲，新思潮衝擊臺灣青年。
- id: doc_111_高雄_大灣_社會_g7s2e2_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 蔣渭水曾診斷出臺灣人患有「智識營養不良」症，為世界文化的低能兒，普遍的症狀為「道德頹廢，物欲旺盛，精神生活貧瘠，風俗醜陋，迷信深固，頑迷不悟，罔顧衛生，智慮淺薄，不知永久大計，只圖眼前小利……等。」蔣渭水認為醫治當時臺灣人的病症，可以利用下列哪一個組織？
  options:
  - label: A
    content: 臺灣議會
  - label: B
    content: 臺灣文化協會
  - label: C
    content: 臺灣總督府
  - label: D
    content: 臺灣民主國。
