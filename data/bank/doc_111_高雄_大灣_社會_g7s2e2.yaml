  stem: 新聞報導：「溫室氣體對於大氣層暖化的影響，又多了一種精確的測量方式。美國太空總署發表的研究指出，大氣層邊緣的『夜光雲』範圍有擴大的趨勢，顯示溫室效應更加嚴重。科學家指出，二氧化碳造成的大氣層暖化問題，就是因為地球的熱度被鎖在接近地表的部分，沒有辦法通過大氣層外緣散發到外太空。夜光雲的增加，更顯示地球暖化問題相當嚴重。」全球環境問題日趨嚴重，加速各國在環保的合作是必要的課題，顯示出人類需重視何者的重要性？
