  stem: 阿奇的爺爺是日治時期的保正，他回憶以前都要協助日本警察宣布政令，倡導放足斷髮，還要挨家挨戶巡視環境清潔、抓老鼠、清水溝、垃圾清運等等工作，也提到當時沒有人敢隨地吐痰或亂丟垃圾。請問：在這樣的作為之下，臺灣社會最明顯的改變為何？
