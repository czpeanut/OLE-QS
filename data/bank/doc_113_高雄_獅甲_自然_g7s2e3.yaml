  type: single
  page: 1
  stem: 為避免蝴蝶幼蟲對農作物的危害，農夫將一群寄生蜂野放至田間，一段時間後，可發現寄生蜂的幼蟲從蝴蝶幼蟲體內鑽出，下列有關此現象的描述與推論，何者錯誤？
