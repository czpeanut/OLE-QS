questions:
- id: doc_113_高雄_獅甲_自然_g7s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 某生物族群在棲息地中生存並保持一穩定的狀態。則下列對此族群的敘述與討論，何者正確？
  options:
  - label: A
    content: 此生物族群的出生、死亡、遷入與遷出保持平衡
  - label: B
    content: 此生物的族群大小不會變
  - label: C
    content: 此生物族群個體數目不會有上下起伏的變化
  - label: D
    content: 此生物族群不會被淘汰。
- id: doc_113_高雄_獅甲_自然_g7s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 「那一年森林發生了火災，很多的樹木焚燒後，都死亡了，鳥類、昆蟲與松鼠等消失了，大地一片寂靜。大雨後，草出現了，漸漸的雜草叢生，昆蟲回來了，一段時間後，灌木回來了，雜草也漸漸被灌木所取代，多年後，喬木也回來了，鳥類與松鼠也回來了，大家都回來了，這被火所焚身的森林又復活了……」以上為某登山客的隨手雜記，請問這段文章是在描述下列何種現象？
  options:
  - label: A
    content: 消長或演替
  - label: B
    content: 群集中生物間的關係
  - label: C
    content: 族群的遷移
  - label: D
    content: 森林景象四季的變化。
- id: doc_113_高雄_獅甲_自然_g7s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 下列哪一群生物不能算是族群？
  options:
  - label: A
    content: 阿里山 森林遊樂區的臺灣二葉松
  - label: B
    content: 高雄市 柴山的臺灣獼猴
  - label: C
    content: 淡水河口紅樹林中的招潮蟹
  - label: D
    content: 陽明山國家公園 夢幻湖中的臺灣金線蓮。
- id: doc_113_高雄_獅甲_自然_g7s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 小婕去南非 克魯格國家公園進行生態旅遊，一日在公園某處發現草原中有一群羚羊與鳥類、數隻犀牛、長頸鹿與大象在河邊喝水、吃草，而附近的草叢中埋伏了數隻的獅子，正盯著這群動物，準備進行捕獵。根據上述，下列敘述何者正確？
  options:
  - label: A
    content: 這草原中的鳥類可組成 1 個族群
  - label: B
    content: 這草原中的動物可組成 6 個族群
  - label: C
    content: 這草原中的所有生物可組成 6 個群集
  - label: D
    content: 這草原中的所有生物可組成 1 個群集。
