  group_stem: "1. 請在閱讀下列敘述後，回答下列問題：\n  俗稱「國慶鳥」的灰面鵟鷹（灰面鷲）是過境臺灣第二多的猛禽，數量僅次於赤腹鷹，赤腹鷹的數量雖多，但體型較小，觀察不易，所以名氣不如灰面鵟鷹。灰面鵟鷹體型較大，且有固定的夜息棲地，加上特徵明顯，易於觀察與記錄，故廣受矚目。專家指出灰面鵟鷹每年秋季在屏東\
    \ 墾丁都有數萬隻過境，每當集結向南遷移，群鷹振翅高飛，場面十分壯觀，令人嚮往。\n  猛禽平時活動範圍大，若散佈於繁殖或度冬的棲地時就難以估算其族群數量，唯鵟鷹每年遷徙時，會集中、成群通過固定路徑，而利用這些通過點去計算猛禽數量是目前最常採用的估算法。小明與小華為研究灰面鵟鷹的遷徙數量，決定於國慶日前後\
    \ 5 日，於墾丁 社頂自然公園選擇 2 個地點進行定點觀察，每天自 5：30 開始至 11：30 為止，每人各以 10 倍雙筒望遠鏡為主要觀察工具，並以計數器與數位相機輔助計數灰面鵟鷹的數量。表(一)為兩人記錄通過觀察點之灰面鵟鷹的數量（單位：隻）。\n\
    \n| 日期 | 小明 | 小華 |\n| :--- | :--- | :--- |\n| 10 月 07 日 | 1256 | 1231 |\n| 10\
