  stem: 如圖(1)，甲、丙兩斜面與乙平面皆視為完全光滑，當球自離地 15 公分處的 a 點靜止釋放後，經乙平面到丙斜面，最終在 d 點時速度為零，若空氣阻力可忽略不計，則下列敘述何者正確？
