  stem: '日月潭水庫之水位高低落差達三百公尺以上，很適合作為「抽蓄水力發電廠」之用地。台電於 1987 及 1996 年完成兩座抽蓄水力發電廠（明湖及明潭），均以日月潭水庫為上池，在位於下游的水里溪河谷興建下池，利用上下池間約
    380 公尺之落差作抽蓄水力發電。

    抽蓄式水力發電，主要是利用夜間離峰時段的剩餘電力，將「下池」水庫的水抽回「上池」蓄存，待白天尖峰時段，再將上池水放下，推動水輪機發電，使離峰時段剩餘之低成本電力，轉化為尖峰時間高價值之電力。

    有關抽蓄式水力發電，下列何者為其能量轉換主要的過程？'
  options:
  - label: A
    content: 電能→水的動能→水的重力位能→電能
  - label: B
    content: 水的動能→化學能→水的重力位能→電能
  - label: C
    content: 電能→水的重力位能→水的動能→電能
  - label: D
    content: 電能→化學能→水的動能→電能。
