- id: doc_113_台中_居仁_自然_g9s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '一個質量為 5 公斤的物體作直線運動，其速度-時間關係圖（v-t 圖）如圖(2)所示。大雄、胖虎及靜香分別對此物體所受的合力提出看法，其敘述如下：

    大雄：在 5～10 秒與 10～15 秒，這兩段時間內，物體所受的合力大小相同，方向也相同。

    胖虎：在 15～20 秒間，物體所受的合力為零。

    靜香：在 0～5 秒與 5～10 秒這兩段時間內，物體所受的合力大小相同，但受力方向相反。'
  options:
  - label: A
    content: 三人均合理
  - label: B
    content: 只有大雄合理
  - label: C
    content: 只有胖虎及靜香合理
  - label: D
    content: 只有胖虎合理。
