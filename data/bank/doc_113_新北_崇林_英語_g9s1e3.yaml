  group_stem: '(37-40)

    This summer, at 2024 Paris Olympics, a 17-year-old Chinese diver, won two gold
    medals, becoming "the youngest three-time gold medal winner" in China''s Olympic
    history. All the Chinese people are proud of her. Many people from other countries
    also like her very much. However, behind her gold medals is a sad story.

    Quan Hongchan was born in a very poor family on March 28, 2007. They live in a
    small village in Zhanjiang, Guangdong Province, China. Quan has four brothers
    and sisters, and her parents are farmers. Quan''s mother was often sick before,
    and she wanted to help her family by becoming a successful diver.

    Quan started diving when she was 7 years old. Her coach, Chen Huaming, found her
    gift for diving and taught her to dive on the diving team. Quan worked very hard
    by spending eight hours training and practicing diving three hundred times every
    day.

    In 2021, Quan joined the Tokyo Olympic Games. She won the gold medal in the women''s
    10-meter platform event. Quan amazed everyone by getting full marks(10s) in three
    of her five dives. No other divers did that before!

    Quan''s success brought attention to her family and her hometown. She is a role
    model for young people, showing that with hard work and determination, you can
    do great things, no matter where you come from.


