  section: 2
  number: 41
  type: single
  page: 4
  stem: In the reading, why do people often feel tired in the early afternoon?
  options:
  - label: A
    content: Because they don't sleep well the night before.
  - label: B
    content: Because of the body's biological clock.
  - label: C
    content: Because they eat too much food for lunch.
  - label: D
    content: Because they have too much homework to do.
  group_stem: '(41-43) The power of napping:

    push your afternoon energy

    Do you often feel sleepy in the afternoon? This might mean your body needs a short
    break, called a nap.

    In the afternoon, it''s normal to feel tired. This is because our body''s "biological
    clock" makes us feel awake in the morning or sleepy at night. But around the early
    afternoon, many people feel a bit tired again. This is normal and part of our
    body''s natural cycle.

    Taking a nap can help us feel better. A short rest in the afternoon can give our
    brains a break, help us remember things, and reduce stress. It can also make it
    easier to focus and learn. However, napping for the right amount of time is important.
    A nap of about 20-30 minutes is best, and the best time is early to mid-afternoon.
    This way, it won''t make it harder to sleep at night.

    In a busy school life, a short nap can be a simple way to feel more focused. So,
    next time you feel sleepy in the afternoon, try taking a short nap to recharge
    and feel ready for the rest of the day.


    | normal 正常的 | biological 生理的 | stress 壓力 | focused 專注的 | recharge 再充電 |'
