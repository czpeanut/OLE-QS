  stem: According to the reading, how much were the total Christmas sales in the UK
    in 2010?
  options:
  - label: A
    content: £2 billion.
  - label: B
    content: £16 billion.
  - label: C
    content: £24 billion.
  - label: D
    content: £32 billion.
  group_stem: '(34-36)

    Christmas is the season for giving gifts, being with family, and sharing happiness.
    But this is not all! Christmas is also a big time of year for businesses to make
    a lot of money. For example, people spend £8 billion online in the UK in 2010.
    That''s only one fourth of total Christmas sales. Also, lots of paper, Christmas
    cards, and Christmas trees become trash after Christmas.

    Christmas may be the most wasteful holiday around the world. Because of that,
    many people start doing something different. Some do not buy gifts but make them
    on their own. Some do not buy Christmas candy in candy shops but make them at
    home. Others don''t ask for gifts but give them out. Do you have any idea how
    much gas we use every Christmas to send all those gifts? How much does air pollution
    increase during Christmas?

    To more and more people, it''s important to care about the Earth and do something
    for it. Christmas is still a holiday to enjoy, but maybe we can enjoy it in more
    relaxing and better ways for the Earth.

    increase 增加'
