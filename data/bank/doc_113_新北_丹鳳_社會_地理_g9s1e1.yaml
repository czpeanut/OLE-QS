  section: 1
  number: 11
  type: single
  page: 2
  stem: '下列為一則有關歐盟經濟整合的報導：「歐盟被視為區域經濟整合的典範，其理論基礎可追溯至美國經濟學家Jacob Viner 於1950 年提出的關稅同盟經濟效果論。Viner
    主張，消除關稅及其他貿易障礙，不僅能提升區域內企業的競爭力，還有助於優化資源配置，促進經濟成長並提升社會福利。」請問 : 依據歐盟現行政策，以下哪些項目已涵蓋在內？

    (甲) 區域內關稅壁壘的消除

    (乙) 資金的自由流通

    (丙) 勞動力的跨國自由移動

    (丁) 統一貨幣的使用

    (戊) 對區域外國家免除關稅

    (己) 職業資格證書無法相互承認'
  options:
  - label: A
    content: 甲乙丙丁
  - label: B
    content: 乙丙丁戊
  - label: C
    content: 甲丙戊己
