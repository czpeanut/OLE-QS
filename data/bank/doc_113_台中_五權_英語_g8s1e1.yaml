  group_stem: 'It was a windy night. Harry and his wife were in

    bed. Harry slept well through the storm, but his wife

    didn’t. The wind was so strong that she couldn’t

    sleep.

    Suddenly she heard a different noise. She was

    very frightened and woke her husband up. "Harry,"

    she said, "there''s someone outside the window.

    Listen!"

    "It''s OK," he said, "just the tree tapping against

    the window in the wind. Go back to sleep." Harry

    went back to sleep again.

    The tapping kept going. It got so loud, and then

    the window started to rattle. Harry''s wife woke him

    up again.

    "Harry, it isn''t just the wind. There''s someone

    there. I know there is. Get up and look."

    Harry got out of bed and walked across the

    room to the window. He looked out and saw a man

    standing on a ladder outside the window. Harry

    smiled at the man and then went back to bed.

    "Well?" his wife asked. "Was anyone there?"

    "Yes, there''s a burglar trying to get in."

    "Then do something! Call the police!"

    "No," Harry said. "Wait until he opens the

    window. I couldn’t get it open after we painted the

    house last year. And I still can’t open it now."


