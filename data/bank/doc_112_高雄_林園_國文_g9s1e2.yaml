  group_stem: '8~10 文章理解，請閱讀下面《清心苦味》一文的節選，回答問題。

    一 年幼時陪阿媽上龍山寺，阿媽總會順道去青草巷喝涼茶，阿媽替我叫杯甜甜的青草茶，而她自己總是喝苦茶。有一回，我好奇喝了一口苦茶，當場大叫「好苦唷！」眼淚幾乎掉了下來。事後我十分不明白地問阿媽幹嘛要自找苦吃，阿媽說我小孩子不明白苦味對身體最好。外婆說苦可清心，又說苦味消逝前會回甘。

    二 阿媽說的道理，我可是花了好多好多年頭後才逐漸明白，而當我明白時，我也同時發現自己的青春已一去不復返了。

    三 似乎，在青春期之前的我，從來是不碰苦味的，不喝苦茶，不愛吃苦瓜。但慢慢地在沉浸於酸甜辣鹹多年後的我，有一天卻突然發現苦味好比意外的訪客般敲醒我的味蕾之門，苦味的拜訪帶來的是深沉厚重的感受，那種滋味留在喉頭最隱祕幽微的地方久久不散，當苦味慢慢離開後，竟然留下淡淡的清甜。

    四 當時我想起阿媽說的話，甜過了頭的味道會變成苦的，但苦過了之後反而轉甜。我也忽然明白這段話不只有關味覺之事，也有關人生，許多的人生不也這樣，一逕追求甜蜜的人生，常常愈活愈苦，但真正過過苦日子的人，回頭一看，卻發現苦頭吃多了後就沒什麼怕苦之事，反而更懂得日子不苦就是甜的道理。'
  lesson_raw:
    title: 清心苦味
    basis: 題目出自《清心苦味》選文
