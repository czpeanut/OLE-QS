  stem: "4.【助憨兒學習獨立 喜憨兒屏東開辦「夜間社區家園」服務】\n    為了協助憨兒學習獨立，喜憨兒基金會先後在高雄、新竹、臺北、臺南、桃園、屏東等地設有10\
    \ 個夜間社區家園，近60 位憨兒在此學習與生活。喜憨兒基金會會安排一位教保員老師與憨兒們同住，提供生活上的訓練與協助。舉凡居家生活能力、情緒管理能力、休閒生活安排、社區資源使用以及家庭支持等，讓每一位身心障礙者都能透過社區家園的居住訓練，學會獨立生活。\n\
    \    小良是一位心智障礙者，今年47 歲，白天在喜憨兒日間社區作業設施南門站，進行掛耳咖啡代工作業。經評估，小良入住夜間社區家園，花了半年時間，學習自立生活以及跟同儕和睦相處。對於社區資源非常熟悉且能運用，舉凡外出購物、運動、休閒、用餐等都沒有問題。小良週一到週五住家園，假日則返家。在社區家園及父母支持下，小良情緒表現平穩，父母照顧的壓力\n\
    也有所減輕。\n    依據身心障礙者權利公約，障礙者有權利選擇在哪裡居住以及和誰居住，各國有責任發展社區居住及自立生活支持方案，促使身心障礙者和一般人擁有平等機會融入社區。夜間家園給了憨兒們一個舒適學習的地方，支持他們走向獨立之路。未來也將持續提供憨兒們適切的服務，減輕照顧者壓力，讓照顧者與被照顧者都能提升其生活品質。\n\
    （改寫自喜憨兒社會福利基金會網站）\n關於以上公告，下列敘述何者正確?"
  options:
  - label: A
    content: 「夜間社區家園」分布北、中、南各區，提供服務給近60 位憨兒，目的是協助憨兒走向獨立生活
  - label: B
    content: 園內除教保員老師，因憨兒能力不足，另安排廚房阿姨、清潔人員、保全同住，才能全面照顧
  - label: C
