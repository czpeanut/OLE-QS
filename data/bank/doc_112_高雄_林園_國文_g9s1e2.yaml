  type: single
  page: 1
  stem: 3.「生於憂患，死於安樂」所要表達的道理，與下列何者最為相近？
  options:
  - label: A
    content: 先天下之憂而憂，後天下之樂而樂
  - label: B
    content: 天時不如地利，地利不如人和
  - label: C
    content: 憂勞可以興國，逸豫可以亡身
  - label: D
    content: 放棄者不會勝利，勝利者永不放棄。
