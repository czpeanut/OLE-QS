  section: 4
  number: 12
  type: single
  page: 3
  stem: 12.老獵人說：「勇敢、智慧與愛就是一個好獵人的全部財產」，作者在上文哪兩段，最能表現出獵人的勇敢無懼?
  options:
  - label: A
    content: 第八、十段
  - label: B
    content: 第九、十段
  - label: C
    content: 第十、十一段
  - label: D
    content: 第八、十一段。
  group_stem: '12~14 文章理解，請閱讀下面《獵人》一文的節選第八~十一段，回答問題。

    八 芒草擦過肌膚，馬上就泌出明亮的血痕，為了不使血腥味觸動野獸的鼻子，我順手搓揉了藥草抹去。我取下堅實的櫸木，製作一些堅固而實用的長矛。來到山谷地，一彎溪水流瀉著山的音符，溼潤的泥地可發現不同的蹄跡。我慶幸發現了牠的蹤跡，逆著風跟隨牠的腳步，全身的血液快速流轉在緊握長矛的手掌上，我興奮著自己將要成為「泰雅」。

    九 我看見牠了，牠必然也感覺到我的存在。在牠轉身剎那，我的長矛像頭豹奔出去，牠受傷的前蹄憤怒地跨過來，把我的身軀像葉片般撥開。我從草地爬起來時，老獵人晶亮的眸光一閃而逝，就在樹林背後，像祖靈從無聲中飛來又滅去，那真是老獵人嗎？抑或是泰雅的守護神？待我完全定神，山林中只剩下空寂的樹林，和樹葉的訕笑聲。

    十 穿過樹林，陽光把一盆火當頭罩下來，鹹溼的汗水亰凌傷口，我只好先以爛泥和腐葉裹傷。疲憊地穿行山林間，可以感覺到似乎有一對眼睛審視著我，一刻不曾稍停，我懷疑是不是老獵人？數度轉身，只有山中偶爾傳來鳥雀的鳴聲。我重新回到山谷地，選擇芒草覆蓋的巨岩背後，從草徑的縫隙間，可以清楚地看見溪水的一切。「等待是獵人的美德」，我像壁虎般趴著伏著。黃昏，牠必須前來飲水，到時候，我將給牠致命的一擊。

    十一 「來了！」我聽見草叢分撥的聲音，聽到悶雷般的吼聲。我揉亮眼睛，不錯，果真是牠，隨後，還有三隻淘氣的小山豬……。'
