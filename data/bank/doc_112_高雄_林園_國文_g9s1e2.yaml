  stem: 10.「甜味如果是純粹幸福的陶醉，酸味似乎多了一點憂愁。在姐姐之後，我逐漸也懂了酸的滋味，開始喜歡起「酸」在味蕾上帶一點刺激的清醒。我已經讀中學，發育了，有一些身體上的變化，有點害怕，又不願與他人分享。喜歡孤獨，喜歡看似懂非懂的書，歌德的《少年維特之煩惱》，總拿在手上，很久都以為是《少年維「持」之煩惱》，覺得有書可以教人「維持煩惱」，真是太棒了。喜歡酸味大概是迷戀憂傷的開始吧。」作者中學時喜歡上酸味，其原因為何？
  options:
  - label: A
    content: 由於仿效姐姐吃酸的食物，久而久之便愛上酸味帶來的暢快感受
  - label: B
    content: 因青春期生理心理的變化，嘗到孤獨煩惱的滋味，覺得酸味貼近這種憂傷的心情
  - label: C
    content: 姊姊喜歡酸的滋味，作者耳濡目染之下，也喜歡酸的味道
  - label: D
    content: 因當時閱讀憂傷煩惱的文學作品，而體悟酸味蘊含的人生況味。
