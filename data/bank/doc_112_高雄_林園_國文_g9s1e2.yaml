  stem: "4.下段文章，節自《巨星的崛起: 雷霸龍詹姆斯》這本書的介紹，\n請問雷霸龍LeBron James 的成就，來自「情緒和行為調整」、「自我控制」、「有效的家庭教育」、「同伴關係」、「社區資源」這5\
    \ 部分的哪一部分? (1 分)\n\n如果沒有社區的關愛，就不會有現在的雷霸龍LeBron James。\n    當今NBA 最紅、最年輕的球星，身價千萬的NIKE\
    \ 代言人雷霸龍‧詹姆斯，出生於貧困的單親家庭。在擔負家計的外婆逝世後，詹姆斯母子的生活頓時陷入困境。自四歲半起，詹姆斯開始過著長達七年的漂泊生活。所幸，在這段困苦的歲月中，數十個社區鄰居輪流伸出援手，收留詹姆斯母子，讓詹姆斯有機會過著正常小孩的生活，不致誤入歧途。\n\
    \    其中影響他最深遠的，莫過於蘭基‧沃克，一位義務帶領小孩從事球類活動的教練。沃克在一次家訪中發現詹姆斯母子四處流浪，他說服格勞利雅把詹姆斯接到自己家裡。詹姆斯：我和他們住了一年，那真是莫大的禮物。那年，我不再轉學。我終於可以睡在同一張床上，待在同一個球隊，沃克教練讓我進入第一個籃球隊，我每個週末去見媽媽。\n\
    \    在寄居沃克家庭的二年期間，沃克不僅改正了詹姆斯的不良生活習慣，更啟蒙他的籃球技藝與天分，開啟了他日後成功的NBA 籃球之路，這些社區大愛的影響，造就了心胸開闊，懂得感恩圖報，回饋社會的NBA\
    \ 巨星詹姆斯，同時也給我們啟示：只有相互的協助和關愛，只有不斷地付出和感受愛，生命才會完美成長。詹姆斯回憶道：「我愛沃克夫婦，沒有他們，就絕對不會有我的今天。」"
