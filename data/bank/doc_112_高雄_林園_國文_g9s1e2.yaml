  stem: '2.

    「我們常配著電視、電腦螢幕啃便當，不用十分鐘就稀哩呼嚕吃飽了。」我說。

    ………

    她滿臉不可思議：「我的父母常回憶在納粹佔領期間，我的祖父母還能端前菜、主菜、甜點上桌呢。」

    「怎麼可能？。聽說那時物資缺乏，連糖都要配給。」我說。

    「所以在每個點心盤上放四分之一顆的方糖，沾一點黑咖啡。就是甜點了。」

    …….

    「法國人之所以為法國人，是因為我們無時無刻都講究享樂的態度，」她一面挑選搭配的餐具一面說：「但我們享受的，不見得是鵝肝或黑松露這種高檔美饌，就算只是區區一塊平凡的鹹派，也會專心致志去享受它帶來的滿足感，來回細細品味。」

    「不吝惜時間，運用全副心神，把最小的樂趣最大化。這才是法式享樂主義(French Epicureanism)的真諦。」

    節選自《在異國的餐桌上旅行》張健芳

    關於上面這段文字，下列敘述，何者正確?'
  options:
  - label: A
    content: 作者敘述個人的旅遊的經驗，與對美食的感受及體驗。
  - label: B
    content: 作者在朋友家作客，從對話中，可看出法國人的飲食文化，非常著重食物的美味與否，食材越珍貴越好
  - label: C
    content: 作者特別提到自己的飲食習慣是豪邁不羈、速戰速決，頗為自傲，與朋友的法國文化形成強烈對比。
  - label: D
    content: 對話中可知，法國的飲食文化是一種傳統。就連戰爭，被敵人佔領，這麼危險匱乏的時刻，依舊能面對飲食的專注與滿足。
  answer:
