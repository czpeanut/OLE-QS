    一老殘告辭動身上車，一路秋山紅葉，老圃黃花，頗不寂寞。到了濟南府，進得城來，家家泉水，戶戶垂楊，比那江南風景覺得更為有趣。

    二到了小布政司街，覓了一家客店，名叫高陞店，將行李卸下，開發了車價酒錢，胡亂吃點晚飯，也就睡了。

    三次日清晨起來，吃點兒點心，便搖著串鈴滿街踅了一趟，虛應一應故事。午後便步行至鵲華橋邊，雇了一隻小船，盪起雙槳。朝北不遠，便到歷下亭前，止船進去。入了大門，便是一個亭子，油漆已大半剝蝕。亭子上懸了一副對聯，寫的是「歷下此亭古，濟南名士多」，上寫著「杜工部句」，下寫著「道州
    何紹基書」。亭子旁邊雖有幾間房屋，也沒有什麼意思。

    四復行下船，向西盪去，不甚遠，又到了鐵公祠畔。你道鐵公是誰？就是明初與燕王為難的那位鐵鉉。後人敬他的忠義，所以至今春秋時節，土人尚不斷的來此進香。到了鐵公祠前，朝南一望，只見對面千佛山上，梵宇僧樓，與那蒼松翠柏，高下相間，紅的火紅，白的雪白，青的靛青，綠的碧綠。更有一株半株的丹楓夾在裡面，彷彿宋人趙千里的一幅大畫，做了一架數十里長的屏風。

    五正在嘆賞不絕，忽聽一聲漁唱，低頭看去，誰知那明湖業已澄淨得同鏡子一般。那千佛山的倒影映在湖裡，顯得明明白白。那樓臺樹木格外光彩，覺得比上頭的一個千佛山還要好看，還要清楚。

    六這湖的南岸，上去便是街市，卻有一層蘆葦，密密遮住。現在正是開花的時候，一片白花映著帶水氣的斜陽，好似一條粉紅絨毯，做了上下兩個山的墊子，實在奇絕！'
  answer:
  - C
