    (甲)今夫弈之為數，小數也，不專心致志，則不得也。弈秋，通國之善弈者也。使弈秋誨二人弈，其一人專心致志，惟弈秋之為聽；一人雖聽之，一心以為有鴻鵠將至，思援弓繳而射之，雖與之俱學，弗若之矣。為是其智弗若與？曰：「非然也。」

    —節選自《孟子‧告子上》

    (乙)所云不得籠中養鳥，而予又未嘗不愛鳥，但養之有道耳。欲養鳥莫如多種樹，使繞屋樹百株，扶疏茂密，為鳥國鳥家。將旦時，睡夢初醒，尚展轉在被，聽一片啁啾，如雲門、咸池之奏；及披衣而起，①面漱口啜茗，見其揚翬②振彩，倏往倏來，目不暇給，固非一籠一羽之樂而已。大率平生樂趣，欲以天地為囿，江漢為池，各適其天，斯為大快。比之盆魚籠鳥，其鉅細仁忍何如也！

    --《濰縣署中與舍弟墨第二書‧書後又一紙》鄭燮

    注：①：音ㄏㄨㄟˋ，洗臉。 ②翬：音ㄏㄨㄟ，羽毛。'
