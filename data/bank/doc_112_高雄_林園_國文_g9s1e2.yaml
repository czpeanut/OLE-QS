  stem: 11.「一物有一物之味，不可混而同之。猶如聖人設教，因才樂育，不拘一律。所謂君子成人之美也。今見俗廚，動以雞、鴨、豬、鵝，一湯同滾，遂令千手雷同，味同嚼蠟。吾恐雞、豬、鵝、鴨有靈，必到枉死城中告狀矣。善治菜者，須多設鍋、灶、盂、缽之類，使一物各獻一性，一碗各成一味。嗜者舌本應接不暇，自覺心花頓開。」（袁枚《隨園食單》）根據這段文字，下列敘述何者正確？
