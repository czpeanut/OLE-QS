  stem: 3.「通常來說，我們對幸福可能存在著這幾種誤解：其中之一：『幸福＝沒有痛苦。』幸福不是沒有痛苦，相反地，痛苦對於幸福而言有一定的必要性。Brock（2014
    年）指出，體驗痛苦可以幫助人更好地感知幸福。一個隨時隨地都快樂的人往往感知不到幸福，只有當他有負面感受時，才能激發對幸福的覺察。其實遭受痛苦是人生的常態，哪怕是那些幸福的人，也一樣會經歷許多痛苦。不同之處在於，幸福的人有面對痛苦、解決問題的能力。他們不會因為意外和傷害感到恐懼，並且可以從面對痛苦中獲得成長。」（by
    KnowYourself 2021／04／15）下列何者說明與本文內容相去最遠？
  options:
  - label: A
    content: 想要幸福就必須澈底讓痛苦從此消失
  - label: B
    content: 痛苦能讓我們更深刻體會幸福的美好
  - label: C
    content: 沒有痛苦，會讓人身在福中不知福
  - label: D
    content: 因為有幸福感，人較能勇敢地面對痛苦，解決問題。
  answer:
  - A
