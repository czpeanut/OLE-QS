- id: doc_112_高雄_林園_國文_g9s1e2_s4_1
  section: 4
  number: 1
  type: single
  page: 1
  stem: 1.下列語詞運用，何者錯誤?
  options:
  - label: A
    content: 旅遊時，全身上下名牌的打扮，很容易引起竊賊的「覬覦」
  - label: B
    content: 媽媽期待四歲的小孟能贏在起跑點，便讓他學多種才藝，一段時間後，小孟因無法負荷，而出現厭學情緒，小孟的媽媽真是「揠苗助長」
  - label: C
    content: 節能減碳的環保行動，雖然能落實的人不多，對於環境問題的解決很有限，可說是「杯水車薪」，但仍然不能因此放棄
  - label: D
    content: 董氏基金會致力於推動菸害防制，保護國人的健康，於1989 年創立「亞太地區拒菸協會」，2007 年6 月15 日立法院三讀通過「菸害防制法」修正案。這漫長的立法之路，歷經20
      多年的努力，集眾人之力，一步一腳印，是民間力量推動立法的「始作俑者」。
  answer:
  - D
  answer_source: answer_key_vlm
  tags:
    textbook: 九上 第八課 孟子選：生於憂患死於安樂
