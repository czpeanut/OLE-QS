    十 穿過樹林，陽光把一盆火當頭罩下來，鹹溼的汗水亰凌傷口，我只好先以爛泥和腐葉裹傷。疲憊地穿行山林間，可以感覺到似乎有一對眼睛審視著我，一刻不曾稍停，我懷疑是不是老獵人？數度轉身，只有山中偶爾傳來鳥雀的鳴聲。我重新回到山谷地，選擇芒草覆蓋的巨岩背後，從草徑的縫隙間，可以清楚地看見溪水的一切。「等待是獵人的美德」，我像壁虎般趴著伏著。黃昏，牠必須前來飲水，到時候，我將給牠致命的一擊。

    十一 「來了！」我聽見草叢分撥的聲音，聽到悶雷般的吼聲。我揉亮眼睛，不錯，果真是牠，隨後，還有三隻淘氣的小山豬……。'
