    例如：遊戲機先決定數字x＝2，再讓編號為1、2、4、6、8 的地鼠同時冒出頭。

    若遊戲進行數回合後停止，編號為3、4、9 的地鼠冒出頭的總次數依序為28、22、23 次，則編號為2 的地鼠冒出頭的總次數為______⑮______次。(2-2)'
