  section: 2
  number: 2
  type: calc
  page: 3
  stem: '如圖，漢糕祖烘焙廠是邊長 $x＋8$ 公尺的正方形，糖太宗食品廠是長 $x＋4$ 公尺、寬 $x＋8$ 公尺的長方形，分別由祖文、宗凡兩兄弟所擁有。兩廠房重疊區域為長6
    公尺、寬2 公尺的長方形食材倉庫。今兩兄弟決定合併經營，但巧遇covid-19 疫情，實施廠區全面清消並停工一週，需於整個廠區外圍圍上一圈警戒封鎖繩，以避免閒雜人等誤入，在不考慮警戒封鎖繩接合長度的情況下，請問：

