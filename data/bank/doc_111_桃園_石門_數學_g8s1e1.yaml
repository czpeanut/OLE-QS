    黃庭：$(2x+ y)^{2}=4x^{2}+4xy+y^{2}$

    路飛：$(p-2q)^{2}=p^{2}-4pq-4q^{2}$

    郁玲：$4m^{2}-9n^{2}=(2m+3n)(2m-3n)$'
