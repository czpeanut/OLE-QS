    content: The difference between countable and uncountable nouns.
  group_stem: 'What’s in the Fridge?

    Look at the fridge! There are many kinds of food inside.

    But do you know which ones are countable and which ones are not?


    Countable nouns are things we can count one by one, like eggs, apples, and oranges.

    We can say: • “There is an apple in the fridge.”

    • “There are two eggs in the fridge.”

    We use how many to ask about them:

    “How many eggs are there?”


    Uncountable nouns are things we cannot count one by

    one, like cheese, cake, or coke.

    We don’t say “one cheese” or “two cokes.”

    We can say: • “There is some cheese in the fridge.”

    • “There is a can of coke.”

    We use how much to ask about them:

    “How much cheese is there?”


    Be careful! Some foods can be both countable and uncountable

    when we talk about them in different ways.

    For example, “cake” is usually uncountable, but if we talk about slices or pieces,
    it becomes countable.


    | fridge 冰箱 | kind 種類 | countable noun 可數名詞 | uncountable noun 不可數名詞 |'
