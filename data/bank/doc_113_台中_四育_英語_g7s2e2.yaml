  group_stem: 'The Starry Night

    The Starry Night is a painting by Vincent van Gogh. The

    name shows two important parts of the painting, the night sky

    and the quiet town.


    In the painting, the sky is full of bright stars and a big

    yellow moon. The wind looks like it moves in the sky and

    makes strong marks. This part of the painting feels full of life. Under the sky,
    there is a small

    town. The houses are dark and quiet. On the left side, there is a tall black tree.
    It goes up to the

    sky.


    The two parts, the moving sky and the quiet town, look different, but they go
    well together.

    The painting shows both peace and energy at the same time.


    | town 城鎮 | move 移動 | mark 標記 | peace 寧靜 | energy 活力 | same 相同的 |'
