- id: doc_113_高雄_龍華_國文_g7s2e2_s4_30
  section: 4
  number: 30
  type: single
  page: 5
  stem: 下列文句的字義說明，何者不正確？
  options:
  - label: A
    content: 「筠薦之於朝」的「之」：李白
  - label: B
    content: 「白已臥於酒肆矣」的「於」：從
  - label: C
    content: 「白衣宮錦袍」的「衣」：穿
  - label: D
    content: 「竟以飲酒過度」的「以」：因為
  group_stem: "李白，字太白，山東人。少有逸才①，志氣宏放，飄然有超世之心。父為任城尉，因②家焉。少與魯中諸生孔巢父、韓沔、裴政、張叔明、陶沔等隱於徂徠山，酣歌縱酒，時號「竹溪六逸」。\n\
    \ 天寶初，客遊會稽，與道士吳筠隱於剡中。既而玄宗詔筠赴京師，筠薦之於朝，遣使召之，與筠俱待詔翰林。白既嗜酒，日與飲徒醉於酒肆。玄宗度曲，欲造樂府新詞，亟召白，白已臥於酒肆矣。召入，以水灑面，即令秉筆，頃之成十餘章，帝頗嘉之。嘗沉醉殿上，引足令高力士脫靴，由是斥去。乃浪跡江湖，終日沉飲。時侍御史崔宗之謫官金陵，與白詩酒唱和。嘗月夜乘舟，自採石達金陵。白衣宮錦袍，於舟中顧瞻笑傲，旁若無人。\n\
    \ 初，賀知章見白，賞之曰：「此天上謫仙人也。」祿山之亂，玄宗幸蜀，在途以永王璘為江淮兵馬都督、揚州節度大使。白在宣州謁見，遂辟③從事。永王謀亂，兵敗。白坐④，長流夜郎。後遇赦，得還，竟以飲酒過度，醉死於宣城。\
    \ (《舊唐詩·李白傳》)\n註： ①逸才：卓越出眾的才藝。 ②因：於是。 ③辟：從事。 ④坐：被連坐，被定罪。"
