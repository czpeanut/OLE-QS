  stem: 老師要同學在課堂上報告「現代詩」與「近體詩」的相關內容，下列何者敘述正確？
  options:
  - label: A
    content: 紅玉：「現代詩」也稱「今體詩」、「白話詩」，形式自由不拘，題材十分多元化
  - label: B
    content: 烏龍：「小詩」是「現代詩」中篇幅極短的作品，界定在十行以下、一百字以內
  - label: C
    content: 金萱：「近體詩」盛行於唐代，「律詩」和「絕句」在平仄、對仗上都有嚴格要求
  - label: D
    content: 拿鐵：「近體詩」須一韻到底，不可換韻，偶數句必須押韻，奇數句皆不可押韻
