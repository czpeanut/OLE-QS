- id: doc_113_高雄_龍華_國文_g7s2e2_s4_28
  section: 4
  number: 28
  type: single
  page: 5
  stem: 根據本文，下列行為與其涉及罪名的對應，何者完全正確？
  options:
  - label: A
    content: 在網路上討論某位藝人在活動中呼籲捐款，自己卻沒捐──誹謗罪
  - label: B
    content: 和朋友私聊某同學家裡經濟只有小康，卻表現富裕的樣子──誹謗罪
  - label: C
    content: 因物品失竊與某同學在教室吵架而在班群裡發言：「樑上君子，偷東西還不承認！」──公然侮辱罪
  - label: D
    content: 因閨密向自己暗戀的男生告白而在日記裡寫：「綠茶小花，喜歡別人暗戀的對象！」──公然侮辱罪
  group_stem: "在臉書、IG、社團留言或發文批判別人，這樣也有責任嗎？罵人，會涉及「公然侮辱罪」或「誹謗罪」，而「公然侮辱」要成立，有兩個要件：一是公然、二是要知悉你在罵誰。公然就是要在公開場所，是在大家都看得到、聽得到的情況下罵。網路討論區、線上遊戲區……只要是公開留言，都算是「公然」。如果你的描述足以讓他人對號入座，也會觸法。\n\
    \ 基於《憲法》保障言論自由，對於善意發表的言論，會從寬解釋，採取「真正惡意原則」。也就是說，只要發表言論時，沒有毀損他人名譽的惡念，就算事後發現與真相有差距，都符合「善意」。可是「誹謗罪」呢？誹謗，簡單說就是惡意栽贓，讓對方名譽受損。誹謗沒有公不公然的問題，只要你故意散播就成立。很多人誤以為，只要講的內容是真實的，就不會構成誹謗。其實能說的事，只限於可受公評的公眾人物，以及與公共利益有關的事項。\n\
    \ 依據《通訊保障監察法》，檢警要查網路IP 雖然有很多限制，但如果從別的跡證可以查出這個帳號是在使用，還是有成罪的可能。 （改寫自吉靜如《只是開玩笑，竟然變被告？》）"
