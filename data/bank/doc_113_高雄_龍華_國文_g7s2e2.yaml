  stem: 本詩大量使用譬喻手法，使詩的意象更加深刻豐富。對於本詩的解讀，下列何者有誤﹖
  options:
  - label: A
    content: 以生命力的綻放，比喻走出網路世界後發覺現實生活的美好
  - label: B
    content: 以海洋的深邃與無邊無際，比喻豐富而充滿驚奇的網路世界
  - label: C
    content: 以鑽進深海中泅泳的海魚，比喻沉浸在網路世界裡的人們
  - label: D
    content: 以海中有無窮盡的驚奇，比喻網路世界中無數真實的美麗幻象
  group_stem: "上網\n水就從四面八方漫出\n明知不是海魚\n卻一頁頁鑽進深洋\n\n左右無邊\n上下無界\n無數真實的美麗幻象\n從每一個湧動的按鍵浮現\n\
    以僵硬不變的姿勢\n從入夜泅泳到三更\n偶而無意識地眨眼\n不知是魚游還是水動\n\n海中有無窮盡的驚奇\n把過去和未來都在此方螢幕中濃縮顯現\n只有此刻\n\
    在手與滑鼠的親密接觸中\n才感到生命力的綻放\n在與世界如此貼近的變換中\n才感覺我在虛無中的分量\n\n網路深海中的魚\n在無「我」的時刻\n忘「我」於「我」的永恆存在\n\
    \ (林盛彬〈魚〉)"
