  stem: "小炒肉用後臀，做肉圓用前夾心，煨肉用硬短勒①。炒魚片用青魚、季魚，做魚松用緷魚、鯉魚。蒸雞用雌雞，煨雞用騸②雞，取雞汁用老雞；雞用雌才嫩，鴨用雄才肥；蒪③菜用頭，芹韭用根。皆一定之理，餘可類推。(袁枚《隨園食單》)\n\
    \    注：①勒：通「肋」。  ②騸雞：閹雞。騸，音ㄕㄢˋ。  ③蒪：音ㄆㄛˋ，植物名。\n根據這段文字，下列何者不是作者對於食材的觀點？"
