  section: 5
  number: 28
  type: single
  page: 5
  stem: 根據甲篇，下列敘述何者最符合崔群的看法？
  options:
  - label: A
    content: 玄宗因頻換宰相而導致國家朝政紛亂
  - label: B
    content: 用人得當與否攸關國家的盛衰
  - label: C
    content: 君臣關係是否融洽對國情影響甚深
  - label: D
    content: 為人臣者應以張九齡遭罷相之事為鑑。
  group_stem: "【甲】\n    上問宰相：「玄宗之政，先理而後亂，何也？」崔群對曰：「玄宗用姚崇、宋璟、盧懷慎、蘇頲、韓休、張九齡則理，用宇文融、李林甫、楊國忠則亂。故用人得失，所繫非輕。人皆以天寶①十四年安祿山反為亂之始，臣獨以為開元二十四年罷張九齡相，專任李林甫，此理亂之所分也。願陛下以開元初為法，以天寶末為戒，乃社稷無疆之福！」\
    \ ──《資治通鑑》\n【乙】\n安祿山起軍擊契丹，席豫言祿山賢。時宰相李林甫憂儒臣以戰功進，乃請專用番將，故帝寵祿山益牢，群議不能軋，卒②亂天下，林甫啟之也。\
    \ ──改寫自《新唐書》\n注：①天寶開元：皆為唐玄宗的年號。唐玄宗共有三個年號，依序為先天、開元、天寶。  ②卒：終於、終究。"
