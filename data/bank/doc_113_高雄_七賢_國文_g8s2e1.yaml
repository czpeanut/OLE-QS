- id: doc_113_高雄_七賢_國文_g8s2e1_s4_17
  section: 4
  number: 17
  type: single
  page: 3
  stem: '忽視睡眠的代價十分昂貴，正在侵蝕人類福祉的各個面向，以及社會組成的每條經緯。不管對人類本身或對世界經濟都造成傷害，程度之高，讓世界衛生組織終於宣布，睡眠缺乏是所有工業化國家的流行病。過去一個世紀以來，睡眠時間減少得最為劇烈的國家，如美國、英國、日本、南韓和一些西歐國家，同時也是生理疾病及精神障礙增加程度最高的國家，這並非巧合。

    (節錄自沃克〈為什麼要睡覺？：睡出健康與學習力、夢出創意的新科學〉)

    根據這段文字，下列敘述何者與本文觀點最相近？'
  options:
  - label: A
    content: 睡眠不足的影響不僅止於個人健康，甚至可能擴大到世界經濟
  - label: B
    content: 由於人民犧牲睡眠，讓工業化的先進國家得以領導世界經濟走向
  - label: C
    content: 全人類的福祉由於少數人長期失眠而受到嚴重破壞
  - label: D
    content: 世界衛生組織指出，流行病導致工業化國家的人民普遍缺乏睡眠。
  tags:
    textbook: 八下 第六課 森林最優美的一天
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 八下
      subject: 國文
      code: 第六課
      title: 森林最優美的一天
      chapter: null
- id: doc_113_高雄_七賢_國文_g8s2e1_s4_18
  section: 4
  number: 18
  type: single
  page: 3
  stem: '傳統寺廟的左右定義是以神明坐向為準，也就是人如果面對廟宇，右手邊即是建築物的左側、龍邊；左手邊即是建築物的右側、虎邊。廟宇的左門為龍門，應由此進入廟殿；右門為虎門，如果從虎門入，就有「入虎口」比較不吉祥之意。龍門進、虎口出的用意何在？從龍門進，可仗祥龍之勢，阻邪並納祥瑞之氣；從虎門出，可仗猛虎之威，降邪化煞。一般廟宇正面多開三門，即中、左、右，中門為「神道」，是神明進出的通道，所以盡量不走。

    根據上述文章，一般人到廟宇參拜時進出的示意圖，下列何者最恰當？'
