- id: doc_113_高雄_七賢_國文_g8s2e1_s5_34
  section: 5
  number: 34
  type: single
  page: 6
  stem: 根據上表，在2024 年全球百大機場排名前十名的機場中，哪一洲表現最為亮眼？
  options:
  - label: A
    content: 亞洲
  - label: B
    content: 美洲
  - label: C
    content: 歐洲
  - label: D
    content: 大洋洲。
  group_stem: "隨著新冠肺炎疫情解封，全球航空業漸趨復甦。有著「航空界奥斯卡」之稱的Skytrax，公布2024 年度全球百大機場，卡達 哈馬德國際機場超越去年的冠軍新加坡\
    \ 樟宜機場，成為 2024 年的最佳機場。至於臺灣的桃園國際機場，則由去年的第82 名進步至第66 名。\n    臺灣 桃園國際機場在Skytrax 的最佳排名為2019\
    \ 年的第13 名，之後便沒有再出現更好的名次。在疫情解封後，桃園機場的旅運量明顯復甦，2023 年度超越3 千萬人次，已恢復至疫情前的73％，旅客出入境通關、轉機、購物、餐飲、聯外交通等各方面的需求也隨之提升。因應客運量及相關需求，桃園機場偕同各單位打造高效率的通關服務，進行設備汰換，透過智慧系統改善行李輸送和自動通關流程，在去年轉型智慧化機場，這些成果也反映在今年排名的行李遞送和安檢項目中。\n\
    \    下列表格為2023、2024 年的全球百大機場前十名。\n\n| | 2024 | 2023 |\n| :--- | :--- | :--- |\n\
    | 1. | 卡達 哈馬德國際機場 | 新加坡 樟宜機場 |\n| 2. | 新加坡 樟宜機場 | 卡達 哈馬德國際機場 |\n| 3. | 韓國 仁川國際機場\
    \ | 日本 東京 羽田國際機場 |\n| 4. | 日本 東京 羽田國際機場 | 韓國 仁川國際機場 |\n| 5. | 日本 東京 成田國際機場 | 巴黎\
    \ 夏爾•戴高樂機場 |\n| 6. | 巴黎 夏爾•戴高樂機場 | 土耳其 伊斯坦堡機場 |\n| 7. | 杜拜 杜拜國際機場 | 德國 慕尼黑機場 |\n\
    | 8. | 德國 慕尼黑機場 | 瑞士 蘇黎世機場 |\n| 9. | 瑞士 蘇黎世機場 | 日本 東京 成田國際機場 |\n| 10. | 土耳其 伊斯坦堡機場\
    \ | 西班牙 阿道弗•蘇亞雷斯馬德里─巴拉哈斯機場 |\n\n(改寫自聯合新聞網〈百大最佳機場排名 桃機躍居全球第66！〉)"
