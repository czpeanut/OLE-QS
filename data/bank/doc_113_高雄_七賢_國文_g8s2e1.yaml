  type: single
  page: 3
  stem: "屠龍子與都黎弈，都黎數敗。館人憐而助之，又敗。觀者皆愕，胥①助焉。從者請已，曰：「吾聞寡不敵眾，彼方鳩②群智，吾憂子之不勝以圮前勞也。」屠龍子弗應，坐而弈如故。都黎乃大敗不能支，助者相顧皆失色，執子以詬。從者喜曰：「神矣哉！夫子之弈也。」屠龍子曰：「未也。子不觀夫鬥獸乎？夫獸虎為猛，今以虎鬥虎，則獨虎之不勝多虎也，明矣。以狐鬥虎，則雖千狐其能勝一虎哉？多，愈見其自亂也。」(劉基《郁離子》)\n\
    \    注：①胥：皆、都。  ②鳩：聚集。\n文末屠龍子談論獸類相鬥，用意卻在說明對弈之道。據此，下列何者最接近屠龍子的看法？"
  options:
  - label: A
    content: 陷入僵局時，能力較強者敢於突破瓶頸，開創新局
  - label: B
    content: 能力不同者進行較量，掌握先機將是致勝關鍵
  - label: C
    content: 能力較弱的一方即使人多勢眾，也無法取得勝利
  - label: D
    content: 能力相同者進行較量，人數較少的一方勝算高。
