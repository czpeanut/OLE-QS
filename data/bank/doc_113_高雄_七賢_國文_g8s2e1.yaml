    content: 跟隨鯨豚蹤跡，找到孕育萬物的源頭
  - label: D
    content: 跨越海陸與物種的界線，達到心靈上的交流。
  group_stem: "不知從何時開始，一頭來自太平洋的少年抹香鯨，總會在游經臺灣東部深邃黑潮時，跟來自陸地的人們親忉說聲「嗨」。這頭帶著遠洋神祕氣息的少年抹香鯨，與海上船隻互動異常親切。牠的身影，讓人情緒掀昂如大洋不知如何歇停的洶湧波濤。牠的名字叫「花小香」。從此，海面上的白花噴氣，變成眾人的期待。\n\
    \    如今，「鯨與船與人」久別重逢的海陸大戲，每年都固定上演。「我曉得，花小香將開始帶領我的眼、帶領我的心遨遊於開闊深邃的太平洋深海。透過我的眼，也許牠將更了解這座島嶼；我也將經由牠的眼，重新看見太平洋。」\
    \ (節錄自廖鴻基《遇見花小香：來自深海的親善大使》)"
