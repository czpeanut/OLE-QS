  section: 3
  number: 1
  type: fill
  page: 1
  stem: "東市買駿馬，(1.)，(2.)，北市買長鞭。朝辭爺孃去，(3.)；不聞爺孃喚女聲，(4.)。旦辭黃河去，暮至黑山頭；不聞爺孃喚女聲，(5.)。\n\
    \    (6.)，關山度若飛。(7.)，寒光照鐵衣。將軍百戰死，壯士十年歸。歸來見天子，天子坐明堂。策勳十二轉，賞賜百千強。可汗問所欲，「木蘭不用尚書郎，(8.)，送兒還故鄉。」\n\
    \   開我東閣門，坐我西閣床；脫我戰時袍，著我舊時裳。(9.)，(10.)。出門看火伴，火伴皆驚惶：「同行十二年，不知木蘭是女郎。」\n（請填入第 1 格）"
