- id: doc_113_高雄_七賢_國文_g8s2e1_s5_32
  section: 5
  number: 32
  type: single
  page: 6
  stem: 關於本文內容，下列敘述何者最恰當？
  options:
  - label: A
    content: 丈人看到畫像，對於女兒與陌生男子一同入畫而不悅
  - label: B
    content: 丈人因太久未與夫妻二人見面，故而認不出其長相
  - label: C
    content: 畫者聽從他人建議想改善生意，卻暴露出畫技不佳
  - label: D
    content: 畫者為招攬生意將私人畫像貼出，引來丈人不滿。
  group_stem: '有寫真者，絕無生意。或勸他將自己夫妻畫一幅行樂①貼出，人見方知。畫者乃依計而行。一日，丈人來望，因問：「此女是誰？」答云：「就是令媛。」又問：「她為甚與這面生人同坐？」

    (節選自〈笑林廣記〉)

    注：①行樂：指人的肖像畫。'
