- id: doc_113_高雄_七賢_國文_g8s2e1_s4_25
  section: 4
  number: 25
  type: single
  page: 4
  stem: '邯鄲之民，以正月之旦獻鳩於簡子，簡子大悅，厚賞之。客問其故，簡子曰：「正旦放生，示有恩也。」客曰：「民知君之欲放之，故競而捕之，死者眾矣。君如欲生之，不若禁民勿捕。捕而放之，恩過不相補矣。」簡子曰：「然。」（列子〈說符〉）

    簡子之客認為簡子的作法，屬於下列何種行為？'
  options:
