- id: doc_113_基隆_銘傳_國文_g8s2e3_s1_24
  section: 1
  number: 24
  type: single
  page: 3
  stem: 「常言道，一進入家門，往三面看看，就知道這是什麼樣文化的家庭。（甲）一逢到陌生人，聽他三句話，就知道這是什麼樣品格的人。（乙）一個傻瓜只要裝得老神在在，死不開口，沒人會知道他是傻瓜，無奈（丙）傻瓜總是無法掌控自己的舌頭，接二連三的出糗，把自己的昏聵愚蠢不停藉著舌頭表現無遺。所以（丁）舌頭常常是表現自己最赤裸的履歷表，也是決定一個人成敗的重要關鍵。」上段論述畫線處，何者是作者提出的論點？
