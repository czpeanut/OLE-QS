  group_stem: '據說盆景始於漢、唐，盛於兩宋。明朝吳縣人王鏊作《姑蘇志》有云：「虎丘人善於盆中植奇花異卉，盤松古梅，置之几案，清雅可愛，謂之盆景。」是姑蘇不僅擅園林之美，且以盆景之製作馳譽於一時。劉鑾《五石瓠》：「吾人以盆盎間樹石為玩，長者屈而短之，大者削而約之，或膺寸㊟而結果實，或咫尺而蓄蟲魚，蓋稱盆景，元人謂之些子景。」些子大概是元人語，細小之意。

