  group_stem: '(甲) 節選自《三國演義》

    卻說周瑜夜坐帳中，忽見黃蓋潛入軍中來見周瑜。瑜問曰：「公覆夜至，必有良謀見教。」蓋曰：「彼眾我寡，不宜久持，何不用火攻之？」瑜曰：「誰教公獻此計？」蓋曰：「某出自己意，非他人之所教也。」瑜曰：「
    吾正欲如此，故留蔡中，蔡和詐降之人，以通消息；但恨無一人為我行詐降計耳。」蓋曰：「某願行此計。」瑜曰：「不受些苦，彼如何肯信？」蓋曰：「某受孫氏厚恩，雖肝腦塗地，亦無怨悔。」瑜拜而謝之曰：「君若肯行此苦肉計，則江東之萬幸也。」蓋曰：「某死亦無怨。」遂謝而出。

    次日，周瑜鳴鼓大會諸將於帳下，孔明亦在座。周瑜曰：「操引百萬之眾，連絡三百餘里，非一日可破。今令諸將各領三個月糧草，準備禦敵。」

    言未訖，黃蓋進曰：「莫說三個月；便支三十個月糧草，也不濟事！若是這個月能破便破；若是這個月不能破，只可依張子布之言，棄甲倒戈，北面而降之耳！」

    周瑜勃然變色大怒曰：「吾奉主公之命，督兵破曹，敢有再言降者必斬。今兩軍相敵之際，汝敢出此言，慢我軍心，不斬汝首，難以服眾！」喝左右將黃蓋斬訖報來。黃蓋亦怒曰：「吾自隨破虜將軍，縱橫東南，已歷三世，那有你來？」

    瑜大怒，喝令速斬。甘寧進前告曰：「公覆乃東吳舊臣，望寬恕之。」瑜喝曰：「汝何敢多言，亂吾法度！」先叱左右將甘寧亂棒打出。眾官皆跪告曰：「黃蓋罪固當誅，但於軍不利。望都督寬恕，權且記罪。破曹之後，斬亦未遲。」

    瑜怒未息，眾官苦苦告求。瑜曰：「若不看眾官面皮，決須斬首！今且免死！」命左右拖翻，打一百脊杖，以正其罪。

    眾官又告免，瑜推翻案桌，叱退眾官，喝教行杖。將黃蓋剝了衣服，拖翻在地，打了五十脊杖。眾官又復苦苦求免，瑜躍起指蓋曰：「汝敢小覷我耶！且記下五十棍！再有怠慢，二罪俱罰！」恨聲不絕而入帳中。


    (乙) 節選自《三國志》

    時劉備為曹公所破，欲引南渡江，與魯肅遇於當陽，遂共圖計，因進住夏口，遣諸葛亮詣權，權遂遣瑜及程普等與備并力逆曹公，遇於赤壁。時曹公軍衆已有疾病，初一交戰，公軍敗退，引次江北。瑜等在南岸。瑜部將黃蓋曰：「今寇衆我寡，難與持久。然觀操軍船艦首尾相接，可燒而走也。」乃取蒙衝鬪艦數十艘，實以薪草，膏油灌其中，裹以帷幕，上建牙旗，先書報曹公，欺以欲降。'
