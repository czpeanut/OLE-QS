  stem: '危機發生時，當事人為凝聚同陣營者，通常會使用形象修護策略。上述甲、乙兩案例中的「鄭文公面對燭之武」、「劉邦面對張良」，請問他們所使用的策略各是什麼？

    | 形象修護策略 |

    | :--- |

    | ① 道歉，表示懺悔 |

    | ② 卸責，指錯誤由他人造成 |

    | ③ 強調事件導因於無法控制的外力 |

    | ④ 強調出自好意，或行為本屬正當 |

    | ⑤ 抨擊責問者，貶損其言論可信度 |

    | ⑥ 提醒責問者，事情與你切身相關 |'
  options:
  - label: A
    content: 鄭文公：①④ 劉邦：⑤
  - label: B
    content: 鄭文公：②④ 劉邦：③
  - label: C
    content: 鄭文公：①⑥ 劉邦：②
  - label: D
    content: 鄭文公：③⑤ 劉邦：①
  group_stem: '甲、（秦、晉圍鄭，鄭文公請問燭之武協助。）辭曰：「臣之壯也，猶不如人。今老矣，無能為也已。」公曰：「吾不能早用子，今急而求子，是寡人之過也。
    然鄭亡，子亦有所不利焉。」


    乙、（項羽準備擊破劉邦，項伯暗中通知張良。）良乃入，具告沛公註 1。沛公大驚 ， 曰：「為之奈何？」張良曰：「誰為大王為此計者？」曰：「鯫生註 2 說我曰：『距關，毋內諸侯，秦地可盡王也。註
    3』故聽之。」

    註 1 沛公即劉邦   註 2 鯫生：指見識淺薄的書生   註 3 距關……(整段)：守住涵谷關，不讓諸侯進入。可占整個關中並稱王'
