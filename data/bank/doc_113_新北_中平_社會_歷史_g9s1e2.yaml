  section: 1
  number: 27
  type: single
  page: 2
  stem: 文藝復興時期名著《十日談》，描述城市青年為了躲避黑死病疫情，相約避居鄉間「自我隔離」。他們在這段與外界隔絕期間說故事來打發時間，共說了一百個故事。故事取材廣泛，包括古羅馬小說與東西方民俗寓言，還有作者經歷與當時生活描述。這部數百年前的著作反映古今共同困境，對仍受新冠病毒影響的當代世界，應可帶來不少啟示。請問本書作者是下列何人？他創作所使用的語言又是哪一種？
  options:
