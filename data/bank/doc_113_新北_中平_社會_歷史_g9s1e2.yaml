  stem: 義大利文藝復興時期，波提切利畫有著名作品「維納斯的誕生」，他的家鄉佛羅倫斯因為種種背景條件成為文藝復興的搖籃。請問下列哪一選項『不是』佛羅倫斯成為文藝復興搖籃的背景條件？
