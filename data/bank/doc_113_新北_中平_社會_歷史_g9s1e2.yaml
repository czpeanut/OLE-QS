- id: doc_113_新北_中平_社會_歷史_g9s1e2_s1_19
  section: 1
  number: 19
  type: single
  page: 1
  stem: 「某位君主為了統治上的考量，需要招募許多能夠書寫的人才。一開始在他的國度中，竟然找不到太多有文化的人，這是因為西羅馬帝國滅亡後，城市生活逐漸消失，文化知識也幾乎被遺忘殆盡。因此這位君主特地聘請知名學者，來主持文化復興工作，諸如設立新學校、抄寫古羅馬的重要拉丁文著作，使拉丁文成為各地共通的文字系統。」根據上文，請問下列哪一敘述『符合』此時期西歐的歷史文化發展？
  options:
  - label: A
    content: 西羅馬帝國被土耳其人滅亡後，日耳曼人趁機進入西歐各地建國
  - label: B
    content: 基督教教會負擔起社會秩序維持的任務，雖然努力傳教，但日耳曼人並未因此改信基督教
  - label: C
    content: 教會教士除了傳教外，抄寫古籍對保存希臘、羅馬的古典文化也所貢獻
  - label: D
    content: 教會在社會上頗具影響力，西歐各國君主因信仰虔誠，從未發生政教衝突
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 歷史
      code: 2-2
      title: 羅馬的政治與文化發展
      chapter: 第2章 古希臘羅馬文化的開展
    textbook: 九上歷史 2-2 羅馬的政治與文化發展
    labeled_by: ai
- id: doc_113_新北_中平_社會_歷史_g9s1e2_s1_20
  section: 1
  number: 20
  type: single
  page: 1
  stem: 「這個帝國興盛時期，疆域廣大，橫跨三洲。皇帝在政治上享有至高無上的權力，同時在宗教上也是上帝的代表，可以任命帝國首都主教，主導教會行事，而且也常頒佈與基督教教義有關的規定。」根據上文，請問下列哪一敘述『不符合』此帝國的歷史文化發展？
  options:
  - label: A
    content: 此帝國為東羅馬帝國
  - label: B
    content: 信仰中心為首都君士坦丁堡
  - label: C
    content: 查士丁尼皇帝在位時國力強盛，信仰虔誠，建有聖索非亞大教堂
  - label: D
    content: 與羅馬教會爭奪基督教領導權後，基督教因而分裂，帝國信仰的教派被稱為為天主教
  tags:
