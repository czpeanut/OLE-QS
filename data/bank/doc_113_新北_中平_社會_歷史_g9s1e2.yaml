- id: doc_113_新北_中平_社會_歷史_g9s1e2_s1_29
  section: 1
  number: 29
  type: single
  page: 2
  stem: 西元1517 年，日耳曼教士批判羅馬教會腐敗，揭開宗教改革的序幕。依據以上資料內容，請問哪一項是當時羅馬公教教會的主張？
  options:
  - label: A
    content: 資料一
  - label: B
    content: 資料二
  - label: C
    content: 資料三
  - label: D
    content: 資料四
  group_stem: '◎請閱讀以下資料並回答問題：

    資料一：你們從我主耶穌基督的代理人那裡得到了贖罪券，你就能夠完全獲得赦免。

    資料二：靈魂獲得赦罪不需仰賴神職人員，只需要《聖經》，而《聖經》的領會只能依靠信仰。

    資料三：國王，我們最高的統治者，和他的繼承者，應該被接受且被尊為英格蘭教會唯一致高的領袖。

    資料四：如果上帝啟示獲利的機會，則選民必須遵循上帝的召命而用心追求。人雖然不可為私利而致富，但是可以為上帝勞動而致富。'
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 歷史
      code: 5-1
      title: 宗教改革
      chapter: 第5章 近代歐洲的變革
    textbook: 九上歷史 5-1 宗教改革
    labeled_by: ai
