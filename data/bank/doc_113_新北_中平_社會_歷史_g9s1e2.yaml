- id: doc_113_新北_中平_社會_歷史_g9s1e2_s1_21
  section: 1
  number: 21
  type: single
  page: 1
  stem: 伊斯蘭教創立後，在西元8 世紀建立起一個橫跨歐、亞、非三洲的阿拉伯帝國，隨著領土擴張，帝國的科學研究、藝術文化、海外活動都非常發達，有許多偉大發明。又因為於歐亞交界處，故扮演串連海上與路上貿易的關鍵角色。請問下列哪一敘述，『不符合』當時阿拉伯帝國的歷史文化發展？
  options:
  - label: A
    content: 欲了解當時帝國盛況，可以參考名著《天方夜譚》
  - label: B
    content: 科學成就很多，重要發明有指南針
  - label: C
    content: 重視教育，翻譯古希臘、羅馬典籍為阿拉伯文
  - label: D
    content: 透過對外貿易，將穆斯林的支票等商業制度傳播到各地
  tags:
