  group_stem: '題組二

    沛沛在網路上看到一段文字敘述：

    「一般的釀造醬油是利用黃豆、小麥、食鹽及水為原料，再經米麴菌發酵釀製而成，經過長時間熟成後才能展現出濃郁的香氣與風味。米麴菌（Aspergillus oryzae）是一種帶有菌絲的黴菌，能夠分泌多種酵素（如蛋白酶、澱粉酶）來分解原料中的大分子，協助醬油發酵。在分類上，它屬於真菌界子囊菌門髮菌科麴菌屬，是東亞發酵食品工業中極為重要的微生物之一。」

