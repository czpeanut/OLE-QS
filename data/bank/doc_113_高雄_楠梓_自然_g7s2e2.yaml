  stem: 漫威電影「綠巨人浩克」的故事中，男主角是一位天才科學家。在一次實驗中，他為了救一位年輕人，被大量伽瑪射線直接照射。結果他的身體產生突變，DNA 被改寫。下列有關突變的敘述，哪位同學說的比較正確？
  options:
  - label: A
    content: 雨璇：突變發生的機率很低，因此懷孕的婦女不須做產前檢查
  - label: B
    content: 姵潔：突變是指一對外表正常的表兄妹結婚，卻生下患有遺傳疾病小孩的情況
  - label: C
    content: 方岑：突變若發生在生殖細胞，才有可能傳給下一代
  - label: D
    content: 玥彤：X 光和紫外線是可能誘發突變的化學因素
