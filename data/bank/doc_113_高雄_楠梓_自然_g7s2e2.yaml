  stem: '在課堂上，同學們發表有關生物科技的資料，

    俞萱：「組織培養法是把植物莖頂組織切成小塊處理後放入培養基，然就能長成新植株，可大量生產，屬無性生殖」；

    妤婕：「基因改造食品就是把一段外來的基因轉殖到動、植物細胞內而製造出來的農產品」；

    語晴：「複製動物如桃莉羊，在試管受精，長大後，和生下牠的羊媽媽性狀完全相同」；

    菲徽：「科學家把人類胰島素基因轉植入細菌染色體內，就可讓細菌合成胰島素」。請問：哪幾位同學的說法是對的？'
