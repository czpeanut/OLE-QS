  stem: V3 大白花蝴蝶蘭是研發者為了日本市場而培育的，其親代一邊是荷蘭品系，另一邊是日本品系，授粉後再從眾多的種苗裡選育出來。此品種好種，可塑性高，大型的優雅白色花朵在外銷市場上極受青睞。關於此品種的培育，下列敘述何者正確？
  options:
  - label: A
    content: 在培育新品種過程主要用的是組織培養法（分生苗）
  - label: B
    content: 在大量生產品質齊一的蘭花外銷海外時用的主要是實生苗
  - label: C
    content: 用荷蘭品系與日本品系授粉是一種人工育種技術，生殖方式屬於有性生殖
  - label: D
    content: 此品種的培育過程使用的是基因轉殖技術
  group_stem: "題組一\n臺灣素有「蘭花王國」的美譽，尤其以蝴蝶蘭（Phalaenopsis）馳名國際，行銷至美國、日本、歐洲等地，成為重要的農業輸出品之一。根據行政院農業部農產貿易統計資料，2021\
    \ 年度臺灣花卉外銷總金額高達 2 億 2,415 萬美元，其中蘭花的出口金額為 2 億 740 萬美元，占總額的 92.53%，換算成新台幣超過 60 億元，顯示蘭花在臺灣農業經濟中的重要地位。\n\
    \     臺灣蘭花產業的蓬勃發展，除了仰賴適宜的氣候與栽培技術，最關鍵的就是在繁殖技術的突破。目前主要採用兩種繁殖方式：\n無菌播種（實生苗）：是將蘭花種子在無菌環境下培養，因蘭花種子極為細小且缺乏胚乳，必須依賴人為提供營養才能發芽。此方式能夠產生基因多樣的個體，適合用來進行新品種選育與雜交育種研究。\n\
    組織培養（分生苗）：是從母株的莖尖、芽體等部位取得小塊組織，經過無菌操作後放入培養基中進行繁殖。由於分生苗具有與母株完全相同的遺傳特性，因此適合用來大量生產外型一致、品質穩定的植株，符合商業栽培與大量外銷的需求。"
