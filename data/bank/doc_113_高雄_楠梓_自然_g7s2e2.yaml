  stem: 血友病為隱性等位基因且位於X 染色體上，以$X^{HP}$代表帶有血友病隱性等位基因的X 染色體，阿達為男性血友病患者，他的父母表現型皆無血友病的表現，試推測他的父母性染色體基因型應該為下列何者？
  options:
  - label: A
    content: $XY \times X^{HP}X$
  - label: B
    content: $X^{HP}Y \times X^{HP}X$
  - label: C
    content: $X^{HP}Y \times XX$
  - label: D
    content: $X^{HP}Y \times X^{HP}X^{HP}$
  group_stem: '題組三

    「血友病」是人類最常見的先天性出血性血液凝固異常疾病。其特徵是病人由出生到老一旦受傷或開刀，就會血流不止，嚴重者甚至有生命危險，平常也會無緣無故出血， 尤其肌肉關節腔內經常出血而引起腫脹和疼痛；更由於經年累月無法充份治療和止血，終會造成關節變形僵硬、肌肉萎縮、殘廢跛行等現象。「血友病」是一種
    X 染色體隱性的基因遺傳疾病，絶大多數的病友是男性，因為男性只有一個X 染色體，所以只要這個X 染色體有問題就會有血友病的症狀表現；對於女性而言，因為有兩個X
    染色體，所以必須這兩個X 染色體都有問題，才會有血友病的症狀表現。如果只有一個 X 染色體有問題的女性，不會出現血友病症狀，稱為「帶因者」。'
