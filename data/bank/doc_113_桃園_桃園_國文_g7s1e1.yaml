- id: doc_113_桃園_桃園_國文_g7s1e1_s2_38
  section: 2
  number: 38
  type: single
  page: 6
  stem: 根據上文，請問作者認為人們抱怨世界愈來愈醜的原因為何？
  options:
  - label: A
    content: 工業化產生的噪音、機器聲等污染
  - label: B
    content: 都市高樓林立，蟬聲已漸漸聽不見
  - label: C
    content: 只因為太忙碌，忙得與美擦身而過
  - label: D
    content: 太忙碌且太專注於自我的喜怒哀樂。
  group_stem: '我喜歡一面聽蟬一面散步，在黃昏。

    走進蟬聲的世界裡，正如欣賞一場音樂演唱會一般，如果懂得去聽的話。

    有時候我們抱怨世界愈來愈醜了，現代文明的噪音太多了；其實在一灘濁流之中，何嘗沒有一潭□□？在機器聲交織的音圖裡，也有所謂的「天籟」。我們只是太忙罷了，忙得與美的事物擦身而過都不知不覺。也太專注於自己，生活的鏡頭只攝取自我喜怒哀樂的大特寫，其他種種，都是一派模糊的背景。如果能退後一步看看四周，也許我們會發覺整個圖案都變了。變的不是圖案本身，而是我們的視野。

    所以，偶爾放慢腳步，讓眼眸以最大的可能性把天地隨意瀏覽一番，我們將恍然大悟：世界還是時時在裝扮著自己的。而有什麼比一面散步一面聽蟬更讓人心曠神怡？聽聽親朋好友的傾訴，這是我們常有的經驗。聆聽萬物的傾訴，對我們而言，亦非難事，不是嗎？                                                                   （簡媜夏之絕句）'
