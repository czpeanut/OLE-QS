  - label: D
    content: 因為女學生不在乎校內的考試成績。
  group_stem: '有一天，收到一位中學生的來信，還沒打開，已經被那封信的厚度嚇到。打開之後，又是一驚，只見工工整整十幾張信紙上，排列著密密麻麻，卻又工整無比的小字。

    那字像是印刷的「仿宋體」，娟秀而一筆不苟。當我展讀之後，更是訝異了！真難相信一位高中生，能寫那麼深入的文章。

    我立刻邀請那位女同學到辦公室聊天，還請她和陪她來的同學午餐。

    在餐桌上，我問她：「相信你在學校的作文成績一定很好。」未料，她淡淡一笑：「很爛！」

    「你的文筆這麼好、字這麼漂亮，怎麼可能呢？」我幾乎不敢相信自己的耳朵。

    「因為我從來不好好寫」。她又淡淡一笑：「我的老師很爛，我為什麼要辛辛苦苦寫給她看？」

    然後，她形容了老師的「爛」，又很羨慕地說某名校的國文老師多好。問題是，她可曾想過，文章是她自己的，學問是她自己作的，不是給她老師作的。

    由這位同學的表現，使我想：這世界上會不會有許多具有才華的年輕朋友，只因為不滿意學校，不滿意老師，而放棄自己、埋沒了才華？                                                                     （劉墉別埋沒自己的才華）'
