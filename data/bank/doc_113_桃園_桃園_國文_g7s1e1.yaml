  stem: 本文多次引用文言文說明讀書之樂，請問下列何者也使用「引用」修辭？
  options:
  - label: A
    content: 俗話說：「書中自有黃金屋，書中自有千鍾粟，書中有女顏如玉」只要書讀得好，富貴利祿自然到來。
  - label: B
    content: 面對所有的事情，你給我的解釋都是：「他們沒有惡意，我也無心。」
  - label: C
    content: 他常常說：「凡事只要差不多就好，何必太精明呢？」
  - label: D
    content: 「你沒有老子，是多麼得意的事！好用來說嘴！」
  group_stem: '古人說：「三日不讀書，便覺言語無味，面目可憎」。乍聽之下，這話似乎說得嚴重，可是仔細一想，卻覺得十分有理。

    一個喜歡讀書的人，假如好久沒有接近書本了，那必定是因為他忙，或因他心思分散在其他瑣碎拉雜的事情上，使他沒有時間或沒有心情讀書，而這些瑣碎的生活項目使人忙碌，正是造成一個人思想膚淺庸俗的最大原因。思想膚淺庸俗形之於外的時候，言語就自然無味，面目而隨之可憎了。

    古詩中有「問渠那得清如許，為有源頭活水來。」我們的思想需要源頭活水，而這源頭活水有一大部分是來自讀書，天天讀點有益的書，對精神有滋補作用，言談舉止就不至於無味可憎了。「腹有詩書氣自華」，它能夠使人風度高雅，氣宇軒昂，遠勝服飾上的奢華，而它能使你享有恬淡寧適，心安理得的快樂。                     （羅蘭讀書之樂）'
