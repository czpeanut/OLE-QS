- id: doc_113_高雄_鼎金_國文_g8s1e2_s5_35
  section: 5
  number: 35
  type: single
  page: 5
  stem: 下列何者是兩文都直接描寫的內容？
  options:
  - label: A
    content: 鳥的鳴叫聲
  - label: B
    content: 鳥的外型鮮豔
  - label: C
    content: 鳥在籠中的悲苦
  - label: D
    content: 作者養鳥的方法。
  group_stem: "(五)\n【甲】\n    余讀書之室，其旁有桂一株焉。桂之上，日有聲弇弇①者，即而視之，則二鳥巢於其枝幹之間，去地不五六尺，人手能及之。巢大如盞②，精密完固，細草盤結而成。鳥雌一雄一，小不能盈掬③，色明潔，娟皎可愛，不知其何鳥也。雛且出矣，雌者覆翼④之，雄者往取食。每得食，輒息於屋上，不即下。主人戲以手撼⑤其巢，則下瞰而鳴，小撼之小鳴，大撼之即大鳴，手下，鳴乃已。他日，余從外來，見巢墜於地，覓二鳥及鷇⑥，無有。問之，則某氏僮奴取以去。\n\
    \    嗟呼！以此鳥之羽毛潔而音鳴好也，奚⑦不深山之適⑧而茂林之棲，乃託身非所，見辱於人奴以死。彼其以世路為甚寬也哉⑨。                \
    \                                                (戴名世 鳥說)\n【注】\n①弇弇（ㄧㄢˇ）：擬聲詞，二鳥相和之聲。②盞：燈。③掬：捧。④覆翼：用翅膀保護。⑤撼：搖晃。\n\
    ⑥鷇（ㄎㄡˋ）：初生的小鳥兒。⑦奚：為什麼。⑧適：到。⑨非所：不應該待的地方。\n\n【乙】\n    我愛鳥。\n    從前我常見提籠架鳥的人，清早在街上蹓躂。我感覺興味的不是那人的悠閒，卻是那鳥的苦悶。胳膊上架著的鷹，有時頭上蒙著一塊皮子，羽翮不整地蜷伏著不動，哪裡有半點瞵視昂藏的神氣？籠子裡的鳥更不用說，常年的關在柵欄裡，飲啄倒是方便，冬天還有遮風的棉罩，十分地「優待」，但是如果想要「搏扶搖而直上」，便要撞頭碰壁。鳥到了這種地步，我想牠的苦悶，大概是僅次於黏在膠紙上的蒼蠅；牠的快樂，大概是僅優於在標本室裡住著罷？\n\
    \    我開始欣賞鳥，是在四川。黎明時，窗外是一片鳥囀，不是吱吱喳喳的麻雀，不是呱呱噪啼的烏鴉，那一片聲音是清脆的，是嘹亮的。有的一聲長叫，包括著六七個音階；有的只是一個聲音，圓潤而不覺其單調；有時是獨奏，有時是合唱，簡直是一派和諧的交響樂。\
    \                                       （節錄梁實秋 鳥）"
