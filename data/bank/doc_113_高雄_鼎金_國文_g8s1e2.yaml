  - label: C
    content: 心有不甘
  - label: D
    content: 毫不在意。
  group_stem: "(二)\n    荷看到紅顏褪色，肌膚漸漸失去光潤；荷為風華不再、日影西斜的生命感到悲哀恐懼。難道生命就這樣無聲無息的結束嗎？那些光彩呢？那些掌聲呢？\n\
    \    她向造物主求救，造物主溫柔的看著她說：「孩子，這是每一個生命必經之路啊！」荷仍然做最後的掙扎：「可是，你不是說生命是永恆的嗎？」\n    造物主微笑了：「生命的奧妙就在這裡啊！沒有生，就沒有死；沒有死，就沒有生。」\n\
    \    在獨自薄涼的西風裡，荷曾經美麗的容顏一點點的凋零、剝落。極度絕望中，荷突然發現小小的子房自她體內成形，隨著她蒼老的腳步緩緩膨脹長大。荷開始明白造物主的話，「唯有經過死亡，才能再生」。\n\
    \    當最後一片花瓣隨風而逝後，荷心滿意足，含笑而逝。\n    次年初夏，水中升起無數新荷，清涼無垢，又領一季風騷。                \
    \     （杏林子 荷之一生）"
