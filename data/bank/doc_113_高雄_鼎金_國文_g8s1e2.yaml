  - label: C
    content: 本文呼籲人類要保育鳥類，不要濫捕
  - label: D
    content: 本文以胳膊鷹、籠中鳥，說明被人類豢養的鳥，過著不自由的生活。
  lesson_raw:
    title: 鳥
    basis: 題目指明梁實秋〈鳥〉
- id: doc_113_高雄_鼎金_國文_g8s1e2_s4_15
  section: 4
  number: 15
  type: single
  page: 2
  stem: '鄭人有愛惜魚者，計無從得魚，或汕① ，或網，或設餌鉤之，列三盆庭中，且實水焉。人曰：「魚以江為命，今處一勺之水，日玩弄之，而曰：『我愛魚，我愛魚』，魚不腐者，寡矣！」不聽，未三日，魚皆鱗敗以死。鄭人始悔不用或人之言。【注】①汕：用竹編的器具抓魚。

    這則故事所說明的道理，與下列何者相去最遠？'
  options:
  - label: A
    content: 不自由，毋寧死
  - label: B
    content: 取物宜依道義，不可強奪
  - label: C
    content: 萬物應任其天性而動，各得其所
  - label: D
    content: 待物順應自然，不妄加干預。
- id: doc_113_高雄_鼎金_國文_g8s1e2_s4_16
