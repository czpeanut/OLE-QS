- id: doc_113_高雄_鼎金_國文_g8s1e2_s4_14
  section: 4
  number: 14
  type: single
  page: 2
  stem: 小國在書桌上放了四張關於梁實秋 鳥一文的筆記，請問哪一張內容正確？
  options:
  - label: A
    content: 本文以「十分地『優待』」，讚許養鳥人十分貼心，為籠中鳥提供舒適的生活環境
  - label: B
