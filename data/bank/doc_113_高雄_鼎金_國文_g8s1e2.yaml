- id: doc_113_高雄_鼎金_國文_g8s1e2_s4_6
  section: 4
  number: 6
  type: single
  page: 1
  stem: 「俗話說：『一枝草，一點露』，陶淵明任真自得、離群索居，過著□□□□的生活；周敦頤□□□□、鄙棄世俗的爭名逐利，他們都堅持理想而找到自己的發展空間。」以上缺空處，依序應填入何者最恰當？
  options:
  - label: A
    content: 梅妻鶴子、冰清玉潔
  - label: B
    content: 悲天憫人、仁民愛物
  - label: C
    content: 光風霽月、蕙質蘭心
  - label: D
    content: 自力更生、處事圓融。
- id: doc_113_高雄_鼎金_國文_g8s1e2_s4_7
  section: 4
  number: 7
  type: single
  page: 1
  stem: 愛蓮說一文中，有關蓮花特質與君子品格的配對，何者正確？
  options:
  - label: A
    content: 「出淤泥而不染」象徵君子平易近人，和藹可親
  - label: B
    content: 「中通外直」代表君子坦率直爽
  - label: C
    content: 「不蔓不枝」是指君子不汲汲於富貴
  - label: D
    content: 「香遠益清」形容君子品德醇美，芬芳遠播。
  lesson_raw:
    title: 愛蓮說
    basis: 引用課名〈愛蓮說〉
- id: doc_113_高雄_鼎金_國文_g8s1e2_s4_8
  section: 4
  number: 8
  type: single
  page: 1
  stem: 「一叢深色花，十戶中人賦。」（白居易 買花）句中深色花指的是牡丹，由此推知，這句話的含義與下列何者相呼應？
  options:
  - label: A
    content: 水陸草木之花，可愛者甚蕃
  - label: B
    content: 自李唐來，世人盛愛牡丹
  - label: C
    content: 牡丹，花之富貴者也
  - label: D
    content: 牡丹之愛，宜乎眾矣。
- id: doc_113_高雄_鼎金_國文_g8s1e2_s4_9
  section: 4
  number: 9
  type: single
  page: 2
  stem: 「菊，花之隱逸者也；牡丹，花之富貴者也；蓮，花之君子者也。噫！菊之愛，陶後鮮有聞。蓮之愛，同予者何人？牡丹之愛，宜乎眾矣！」這段話主要是在說明什麼？
  options:
  - label: A
    content: 牡丹比菊花、蓮花豔麗，所以深受世人喜愛
  - label: B
    content: 牡丹具有富貴的氣質，所以比菊花、蓮花珍貴
  - label: C
    content: 菊花、蓮花太過孤傲，不合時宜
  - label: D
    content: 世人只知貪慕富貴，缺乏道德理想。
  lesson_raw:
    title: 愛蓮說
    basis: 引用〈愛蓮說〉課文
- id: doc_113_高雄_鼎金_國文_g8s1e2_s4_10
  section: 4
  number: 10
  type: single
  page: 2
  stem: 「２０世紀７０年代，德國植物學家在研究植物葉面時發現，光滑的葉子表面有灰塵，要先清洗才能在顯微鏡下觀察，而蓮葉等植物葉面卻總是乾乾淨淨。他們利用人造的灰塵粒子汙染玉蘭、林山毛櫸、蓮花、芋、甘藍等植物的葉面，然後用人造雨清洗２分鐘，使雨滴滑落，再觀察葉面灰塵粒子殘留狀況。實驗發現，有些植物葉面殘留的汙染物多達４０％，而蓮花等植物葉面的汙染物殘留比例均小於５％。這就是所謂的蓮花效應。」（潔身自好的蓮花）由上文可知，所謂「蓮花效應」指的是下列何種現象？
  options:
  - label: A
    content: 植物學家透過顯微鏡所觀察到的各種蓮花現象
  - label: B
    content: 蓮葉內殘留的水分，長期維持在百分之五以上
  - label: C
    content: 蓮花對於灰塵的吸收能力，較其他植物來得高
  - label: D
    content: 蓮葉上的灰塵可被雨珠帶走，而變得清潔乾淨。
- id: doc_113_高雄_鼎金_國文_g8s1e2_s4_11
  section: 4
  number: 11
  type: single
  page: 2
  stem: 艾麗絲 詠蓮：「植於汙泥性自清／挺拔出碧水／綻殊容／蓮輝萬里霞光澄／法輪轉／佛果現層層／蓮種覆泥行／上千黑暗夜／心淨平／萬千紅蓮照中空／映穹宇／誰知幾多重？」關於這首詩的說明，以下何者正確？
  options:
  - label: A
    content: 「植於汙泥性自清」意近於「出淤泥而不染」
  - label: B
    content: 「挺拔出碧水」與「濯清漣而不妖」相同
  - label: C
    content: 「法輪轉／佛果現層層」指的是蓮的花朵顏色與大小
  - label: D
    content: 本詩寫作風格應為雄渾豪邁。
- id: doc_113_高雄_鼎金_國文_g8s1e2_s4_12
  section: 4
  number: 12
  type: single
  page: 2
  stem: 下列選項的文句，何者最具動態美感？
  options:
  - label: A
    content: 草地上的花朵開得燦爛，他們有些是紅色的、有些是淺紫色的、有些是白色的。
  - label: B
    content: 當我抬頭一看，只看見一隻雄鷹在廣闊無垠的天際翱翔。他在空中盤旋，雙眼直盯著碧波蕩漾的海面。
  - label: C
    content: 稻田裡佇立著一隻白鷺，拳著一條腿，縮著頸子
  - label: D
    content: 我們在水道上放紙船遊戲，花色斑雜者，形態怪異者，氣派儼然者，甫經下水即遭沉沒者。
- id: doc_113_高雄_鼎金_國文_g8s1e2_s4_13
  section: 4
  number: 13
  type: single
  page: 2
  stem: 「由遠叫到近，由近叫到遠，一聲急似一聲，竟是淒絕的哀樂。客夜聞此，說不出的酸楚。」這段文字所描述的情感與下列何者最相近？
