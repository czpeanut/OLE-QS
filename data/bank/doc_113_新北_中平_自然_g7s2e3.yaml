- id: doc_113_新北_中平_自然_g7s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 阿樹比較了甲、乙兩地的生物數量與種類，並繪製示意圖如下圖所示。根據生態學原理，甲、乙兩地何者的生態較容易維持平衡？相關理由應為下列何者？【素養題】
  options:
  - label: A
    content: 甲地，因為甲地生物數目較少，生物間較不會 競爭環境資源
  - label: B
    content: 乙地，因為乙地的生產者比消費者多，有較高 的生產者能量
  - label: C
    content: 甲地，因為甲地的物種較多，食物網比較複雜
  - label: D
    content: 乙地，因為乙地的每個族群的個體數目較多
