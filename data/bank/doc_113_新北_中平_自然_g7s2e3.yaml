- id: doc_113_新北_中平_自然_g7s2e3_s1_29
  section: 1
  number: 29
  type: single
  page: 3
  stem: '翻車魚 (學名：Mola mola)是世界上最重的硬骨魚之一，體長可達3 公尺。食物來源十分廣泛，主要有小型魚類、魚類幼體、魷魚、甲殼動物和水母等，成年翻車魚很少遭到天敵捕食，但海獅、虎鯨和鯊魚可以牠們為食。

    翻車魚的皮膚和體內的寄生蟲可能超過50 種，白天時常側著身子在水面曬太陽，讓海鳥吃掉牠皮膚上的寄生蟲；此外在透光水域及珊瑚礁區域，有許多種清潔魚也可吃掉翻車魚皮膚上的寄生蟲。目前翻車魚因為人類的過度捕撈及誤捕，導致其面臨生存危機。

