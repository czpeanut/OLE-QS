- id: doc_113_高雄_英明_社會_歷史_g7s2e1_s1_22
  section: 1
  number: 22
  type: single
  page: 1
  stem: 電視上報導：「原臺南警察署為臺灣現存最早的警察局，在臺灣引進現代警察制度時，曾經興建八座警察署，但多數已拆除改建，而此地則保存下來作為美術館預定地。」根據你的歷史知識，關於警察制度的敘述何者錯誤？
  options:
  - label: A
    content: 於日治時期引進臺灣
  - label: B
    content: 臺灣因為尊敬警察愛護人民而稱其為「大人」
  - label: C
    content: 指揮保甲制度協助調查戶口
  - label: D
    content: 臺灣因為利用優勢警力管理臺灣，所以被稱為警察政治。
