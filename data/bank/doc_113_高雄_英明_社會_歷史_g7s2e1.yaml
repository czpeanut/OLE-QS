  section: 1
  number: 24
  type: single
  page: 1
  stem: 野薔薇從小就被送去當別人家的養女，那戶人家有三個男孩，因為女主人一直想要一個女兒未能如願，才想收養養女，養父母和哥哥們都對她非常好，不但吃穿用度都和哥哥們一樣，還送
    7 歲的野薔薇去學校念書，在學校裡老師都是從內地來的，講的話也和臺語不一樣，但野薔薇很快就學會了這種語言。但在 1937 年，當野薔薇 12 歲時戰爭爆發了，一切慢慢變了調，首先物資逐漸短缺，在朝會時校長會帶領全校師生精神喊話要效忠天皇，為天皇犧牲，最後疼愛野薔薇的哥哥們先後被送上戰場，僅剩最小的哥哥和野薔薇還在父母身邊。從時間判斷來看，野薔薇所經歷的事件不包括下列何者？
  options:
  - label: A
    content: 看見壯丁團協助撲滅火災
  - label: B
    content: 聽說有女生被拐騙到海外擔任慰安婦
  - label: C
    content: 聽聞臺灣民主國初成立
  - label: D
    content: 學校戶外教學到神社去參拜。
