- id: doc_113_高雄_英明_社會_歷史_g7s2e1_s1_23
  section: 1
  number: 23
  type: single
  page: 1
  stem: 五條悟在歷史文獻中看到以下內容：「朝鮮因打壓國內天主教活動，開始與外國勢力發生衝突。此時，朝鮮出現了結合儒家、佛教及民間信仰的新興宗教『東學』，標榜對抗外國勢力與國內腐敗官僚。1894
    年春天，東學信眾被號召，發起一場聲勢浩大的抗官行動。無力鎮壓的朝鮮政府，向隔壁的清廷求救，但也把日軍一起引了進來。日、清兩軍在朝鮮海域上開炮交火，因此揭開□□的序幕。」上述缺空處應填入下列何者？
  options:
  - label: A
    content: 牡丹社事件
  - label: B
    content: 甲午戰爭
  - label: C
    content: 第一次世界大戰
  - label: D
    content: 第二次世界大戰。
