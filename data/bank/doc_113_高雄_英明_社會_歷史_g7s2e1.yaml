- id: doc_113_高雄_英明_社會_歷史_g7s2e1_s1_21
  section: 1
  number: 21
  type: single
  page: 1
  stem: 1918 年，林獻堂曾推動「六三法撤廢運動」，想促使臺灣納入帝國憲法體制下的社會運動，使本島人（臺灣人）享有和內地人（日本人）一樣的法律地位。這個運動是為反對「六三法」何種不合理的內容？
  options:
  - label: A
    content: 臺灣總督可頒布具法律效力的命令
  - label: B
    content: 標榜日臺合一將日本法制沿用到臺灣
  - label: C
    content: 嚴密的警察制度與保甲的連坐責任
  - label: D
    content: 皇民化運動中改造臺灣人的法源依據。
