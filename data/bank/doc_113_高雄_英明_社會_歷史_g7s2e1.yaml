  section: 1
  number: 29
  type: single
  page: 1
  stem: 日治時期，在台灣建立了四通八達的鐵道，分為林業鐵道、糖業鐵道及縱貫線，其中縱貫線改變了民眾的生活作息。下列何者屬於日治時期民眾生活中因縱貫線而產生的生活經歷？
  options:
  - label: A
    content: 從北部南返的遊客，其旅程所花費的時間可以大大縮短
  - label: B
    content: 花蓮的大理石產業因為縱貫線的貫通，更方便將石材送至臺灣西部
  - label: C
    content: 參加卒業旅行的學生可搭乘火車從臺東到臺北參觀臺灣神社
  - label: D
    content: 南部的糖廠生產出蔗糖後，可以運送到花蓮港出口至日本。
