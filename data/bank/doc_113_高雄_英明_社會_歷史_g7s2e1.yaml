  section: 1
  number: 27
  type: single
  page: 1
  stem: 日本政府曾經在臺灣實施皇民化運動，目的在使臺灣人成為真正的日本人，以利徵召臺籍人士入軍隊。下列哪一個人的敘述不符合皇民化運動的敘述？
  options:
  - label: A
    content: 派遣武官總督來臺灣，強化對日本的愛國心
  - label: B
    content: 正在政府單位上班的妘妘，改用日本姓名妘子
  - label: C
    content: 老師上課說，主要因應第一次世界大戰的爆發
  - label: D
    content: 鈴鈴穿著新買的和服上街。
