  stem: 臺南晶英酒店曾推出近百年前的「裕仁皇太子宴」，以重現 1923 年日本皇太子裕仁來臺巡察時吃到的臺灣美食。當時裕仁皇太子是應臺灣首位文官總督的邀請，來臺進行
    12 天的訪問。裕仁皇太子巡臺時，臺灣正在推動下列哪一政策？
  options:
  - label: A
    content: 無方針主義
  - label: B
    content: 內地延長主義
  - label: C
    content: 皇民化運動
  - label: D
    content: 殖民地特殊統治時期。
