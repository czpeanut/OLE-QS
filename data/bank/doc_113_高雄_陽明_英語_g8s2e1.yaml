    Many things in your life can make you worried, down, and anxious. Your friends,
    your family, and your troubled experiences in the past can all make you feel so.
    When that happens to you, "The Butterfly Hug" can help.

    A Mexican woman, Lucina Artigas, thought up the Butterfly Hug in 1998. That year,
    a big typhoon hit Mexico and killed many people. Those who luckily lived through
    it experienced sad times for losing their loved ones. Some of them started to
    have bad dreams at night and became anxious. Artigas then came up with the Butterfly
    Hug to help them calm down. Slowly, it has become known to the world and now many
    people know it. When people feel anxious and have trouble calming down, they will
    use it.

    To practice the Butterfly Hug, cross your two arms in the front and put your left
    hand on your right shoulder and your right hand on the left. Slowly touch your
    shoulders with hands several times, and lightly run your fingers on them. Then
    try to picture how a butterfly flies in your mind and take a few deep breaths.
    Tell yourself to listen to the voice of your heart and not to care about anything
    else. When you feel calmer and no longer anxious, put your hands down and stop.

    After people practice the Butterfly Hug, they report that they become calmer and
    feel much safer after doing it. Some believe that the Butterfly Hug helps them
    change for the better. So next time when you feel anxious, let the Butterfly Hug
    help you find your cool back.


