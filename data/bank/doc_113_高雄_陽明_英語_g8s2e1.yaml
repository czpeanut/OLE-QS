  group_stem: '(36-37)


    When your teacher asks you to finish a report on your own, you will start planning
    and even writing right away. However, if you have to finish the report with a
    group of 5, most students won''t be so hard-working.

    The above is a perfect example for social loafing. It''s common for people to
    put in less effort when working in a group than when working on their own. In
    1913, Max Ringelmann did a very famous experiment in social loafing. In the experiment,
    he asked people to try their best to pull a rope and checked how much effort they
    could put in. He found that as the group got bigger, the average force each person
    exerted went down.

    How social loafing happens is also talked about in many studies. When working
    in a group, people believe that the others would do things well. Second, people
    feel that they can "hide" in a group, and the others wouldn''t know if they are
    really doing their job. Third, some people feel that what they do is little and
    not important in a big group, so they would put in less effort.

    Although working in a group is usually great, social loafing brings problems,
    too. It''s important to deal with the phenomenon.


    📖 hard-working 認真 perfect 完美的 effort 力量:努力 experiment 實驗 average force 平均力量 exert
    發揮 deal with 處理 phenomenon 現象'
