- id: doc_113_台中_向上_國文_g8s1e1_s4_33
  section: 4
  number: 33
  type: single
  page: 3
  stem: 下列何者最適合填入( 1 )的空格中？
  options:
  - label: A
    content: 人聞而往觀
  - label: B
    content: 姊乃泣而謝
  - label: C
    content: 鄉人乃資而掩
  - label: D
    content: 老者多時稍甦
  group_stem: '某山隅有一老圃①，早失偶，惟一女遠適他鄉。獵者憐其孤，贈以猴。老者愛如赤子，每出必從，不鏈不掣，而不離不逸。如是五年。一日，老者暴卒，猴掩門，奔其姐，淚如雨。曰：「父死乎？」頷之，乃俱歸。老者家徒壁立，無以為葬，猴遍哭於鄉，(
    1 )。姐引之去，猴揖謝之，仍牢守故宅，擷果自食。每逢五必哭祭，似念老父養之五年，哀傷殊甚。未三月而僵臥墳間。鄉人憐之，乃葬於老者之側，勒石其上，曰：「義猴之墓」。

    ①老圃：種植瓜果蔬菜的老人'
