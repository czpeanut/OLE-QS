- id: doc_113_台中_向上_國文_g8s1e1_s4_30
  section: 4
  number: 30
  type: single
  page: 2
  stem: 下面是搭配上文方框內容所繪製的大綱圖片，依據文意脈絡，甲、乙、丙、丁的順序何者正確？
  options:
  - label: A
    content: 甲乙丙丁
  - label: B
    content: 甲丁丙乙
  - label: C
    content: 丁乙甲丙
  - label: D
    content: 丁丙甲乙
  group_stem: '避免兩節課教一首絕句、抄解釋翻譯，反正注釋課本上都有。學一首詩的時間可以讀10 首，10 首詩就有10 種內涵，10 種語言的變化，以及不同的情感意境。年輕的生命就是要多體驗，要豐富多元，讓他們感受各種情境的詩意。人的生活經驗有限，但文學有助於經驗的拓展，閱讀各種作品，可以知道不同的人跟生命型態。因此要多讀幾首詩，讓學生在短短時間內，感受「庭中有奇樹，綠葉發華滋」的思念，體會「關關雎鳩，在河之州；窈窕淑女，君子好逑」的曖昧，想像「君不見黃河之水天上來，奔流到海不復回」的雄壯與失落，經歷「兩岸猿聲啼不住，輕舟已過萬重山」的瀟灑與速度。更重要的，是讓學生停下來思考。比如教『空山新雨後，天氣晚來秋』，你要讓他們去想甚麼是新雨，甚麼是晚來秋？整個山都沒人，自己在那裡賞雨是怎樣的感覺？作者在這個情境都在想甚麼？問他們自己，有沒靜下來好好賞過雨？讓他們跟詩人同步，相同的感受就可以被召喚出來，而充分理解這首詩。」既然詩就是在表達情感，讀詩就要讓學生發言，表達自己。讓他們講講同樣的情境會寫甚麼來呈現？讓他們表現自己，學習創作詩的語言。甚至可以鼓勵他們把古詩改成rap，好好「古學今用」一番。


    改寫自《人文•島嶼》〈都什麼年代了，為何讀古詩？清大蔡英俊教你詩的語言藝術〉'
  assets:
