- id: doc_112_新北_桃子腳_國文_g7s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 「剛上小學的我，正在念打倒偶像及破除迷信等為內容的課文，我的學校就是從前的關帝廟，我的書桌就是供桌，我曾給周倉畫上眼鏡，給關平戴上鬍子，祖母的話，老天爺也者，我覺得是既多餘，又落伍的。」根據這段文字，下列敘述何者正確？
  options:
  - label: A
    content: 作者為幼時對神像不禮貌的行為流露出羞愧之意
  - label: B
    content: 作者雖然念的是打倒偶像的課文，卻很尊敬神明
  - label: C
    content: 幼時的教育讓作者不相信祖母關於老天爺的言論
  - label: D
    content: 祖母責怪作者對神像不敬，作者便忤逆祖母，嫌她落伍
  lesson_raw:
    number: 第七課
