  section: 1
  number: 14
  type: single
  page: 1
  stem: 「如果你因為自覺在某方面不如人，而且相信『勤能補拙』，願意比別人花更多的心血去練習，使它成為一種良好的習慣，那麼有一天物換星移，情況變得對自己有利時，這種良好的習慣就更能使你脫穎而出。」這段文字的主要含義為何？
  options:
  - label: A
    content: 機會只敲門一次，要善加把握
