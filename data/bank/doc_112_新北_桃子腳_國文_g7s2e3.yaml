- id: doc_112_新北_桃子腳_國文_g7s2e3_s3_45
  section: 3
  number: 45
  type: single
  page: 5
  stem: 下列關於Kobe 的敘述，何者最可能是錯誤的？
  options:
  - label: A
    content: NBA 的傳奇巨星
  - label: B
    content: 影響力限於體育方面
  - label: C
    content: 擁有可愛的女兒Gianna
  - label: D
    content: 討厭失敗更甚於死亡
  group_stem: "戊. Kobe Bryant 的人生結束但故事和精神將會長存！\n傳奇「黑曼巴」教會我們的八堂課\n    對許多籃球迷來說，時間可能已經停止在2020\
    \ 年1 月26日那一天的凌晨四點了。NBA 傳奇球星科比布萊恩（Kobe Bryant）陪著13 歲的二女兒 Gianna Bryant 搭乘私人直升機前往參加比賽，卻不幸在美國早晨墜機罹難享年41\
    \ 歲，讓全球粉絲太震驚、太悲痛！\n    Kobe 啟發了這世上許多人，不只是運動員，他的影響力遠遠超出體育的範圍，包含藝術、文化、商業，近年來他也在各種不同主題上分享自己的想法，傳奇不朽，Kobe\
    \ 的故事和精神將會延續⋯⋯ 在 Kobe 逝世一周年的今天，我們整理了「傳奇黑曼巴」教會我們的八堂課，他的人生結束了，但故事和精神將會長存！\n    每一個決定背後都伴隨著犧牲\n\
    \    「我們都可以成為自己行業裡的專家，但你必須做出選擇。我的意思是，伴隨選擇而來的是必定的犧牲。你要家庭時間、與朋友一起出去玩、當一個好朋友做一個好兒子、好侄子，無論什麼，做決定的同時就會伴來犧牲。」\n\
    \    當一個好的領導者，你必須聽出別人沒有說出口的話\n    「要成為一個有效的領導者，你必須先是一個好的聆聽者，但不是聽別人說了什麼，而他們沒說出口的；你也必須觀察入微。\
    \ 對我來說，那是一個很大的轉變。 我從一名得分手、控球主將到變成一位領導者，那意味著要把別人放在第一位。我不用再擔心自己的節奏、自己在比賽裡有沒有表現好、準備好，而是要關心『別人』有沒有準備好、我該如何幫助他們做好準備？\n\
    \n    關於「球霸」的批評\n    「我從八歲就已經太多次射籃。但『太多』是一個觀點問題。有人認為莫扎特的作品中音符太多。我換句話說，我娛樂了那些說我射籃太多的人，我覺得滿有趣的。回到莫扎特，他對那些批評的回應是沒有所謂的『太多』或『太少』，就是跟依照需要的去做。」\n\
    \    別因為害怕失敗、害怕別人的言語而囚禁了自己\n    「你必須起身繼續打球，老大！ 別去擔心批評、擔心失敗，害怕這些東西。你得自己走出去去闖一闖，去盡全力做到最好。那麼接著無論發生什麼，就是會發生。別因為害怕失敗、害怕別人的言語而囚禁了自己。」\n\
    \n    如果心態對了，膽怯就不存在\n    「我的想法不是那樣運作的，它甚至從不在我的思考模式裡。我最後一次感到膽怯是我6 歲時參加空手道課。那時我是橘色腰帶，但教練要我和黑帶對打，他年紀比我大、體型也比我大，我很害怕。我很害怕，然後他也打贏我了。但後來我發現，他沒有如我所擔心的那樣痛宰我一頓，所以其實根本沒有什麼好怕的。大概是那時候我就意識到，如果心態正確，膽怯就不存在了。」\n\
    \n    Oh，原來那叫努力\n    「我之前從沒把籃球當成是工作，直到進入NBA 後才改變。當我加入後，我身邊都是專業的人，我以為籃球對他們來說就是一切，但後來發現不是這樣。我才驚覺『這不一樣』我以為每個人都跟我一樣對比賽很執著，但後來發現『Oh，原來那叫努力，現在我懂了。』」\n\
    \n    告訴自己你失敗了，對我來說比死亡還要糟\n    「當我們說這個沒辦法、這個做不到時，我們都在悄悄改變自己。我的大腦，它沒辦法處理失敗，也將不會處理失敗。因為我得坐在那思考、面對自己、告訴自己『你是個失敗者』我覺得那更糟，幾乎比死亡還要糟」\n\
    \n    二女兒 Gianna 是那樣令他驕傲⋯⋯\n    「最棒的是，每次我們出門時粉絲會走向我，Gianna 就站在我旁邊，他們會跟我說：『你一定要生個男生，一定要有人來繼承你的傳統、你的風範呀！』這時\
    \ Gianna 就會說：『哦，這我來！不需要男生。』那時候我就覺得沒錯！你來，你可以的！」\n\n節錄自《ELLE 雜誌》"
