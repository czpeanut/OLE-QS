- id: doc_112_新北_桃子腳_國文_g7s2e3_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 「我想，沒有人會否認磨練的重要性，但很多人可能會認為，要花心血去苦練某種技能之前，必須先衡量投資報酬率，苦練沒有什麼指望的事情，到頭來也許只是白費心血。這當然有部分的真實性，不過世事往往有出人意表者。」下列何者最能夠表達這段文字的含義？
  options:
  - label: A
    content: 苦練有成的人，往往具備精打細算的個性
  - label: B
    content: 努力固然重要，但有些人總能出人意表的只靠天賦便輕鬆達標
  - label: C
    content: 努力不一定會成功，但不努力絕無成功機會
  - label: D
    content: 苦練之前必須先衡量投資報酬率，確定會成功再付出努力
  lesson_raw:
    number: 第九課
    title: 音樂家與職籃巨星
