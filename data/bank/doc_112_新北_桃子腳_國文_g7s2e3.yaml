  stem: 根據本文，關於動物聽覺由優至劣的比較，下列何者正確？
  options:
  - label: A
    content: 馬→蛇→倉鴞
  - label: B
    content: 牛→蛇→倉鴞
  - label: C
    content: 牛→倉鴞→蛇
  - label: D
    content: 倉鴞→馬→蛇
  group_stem: "己.\n    「東風吹馬耳」這則成語出自唐代詩人李白的〈答王十二寒夜獨酌有懷〉：「吟詩作賦北窗裡，萬言不直一杯水。世人聞此皆掉頭，有如東風射馬耳。」是形容心中漠然時所用的成語，與它類似的有「對牛彈琴」。到底馬耳、牛耳有何用？牛、馬對樂聲、風聲會有反應嗎？\n\
    \n    其實彈了琴，牛一定聽得到，馬不只聽得到風聲，還聽得到夾雜在裡面的一些聲音。牠們的耳朵依聽到的聲音或聲音傳來的方向而動，尤其是馬，大多在草原裡生活，除了有擅長疾跑的四隻腳，沒有其他有效的自衛武器，耳朵變得很重要。相較之下，牛好多了，頭上有禦敵用的牛角，不必像馬那樣聽到聲音，拔腿就奔逃。\n\
    \    馬的耳朵不僅是一種聽覺器官，也是反映情緒的指標。懂馬的人知道從馬身體的各種姿勢、臉部肌肉的動作、尾巴和四肢的活動，和嘶鳴的聲音，來觀察馬的心情和體能狀況。尤其從耳朵的「表情」，可以掌握馬的心理狀態。如果馬的耳朵垂直豎立，耳根有力，微微搖晃，那表示牠心情很好；當牠的耳朵不停前後搖動，表示心情欠佳。另外，馬在興奮或生氣時，耳朵會倒向後方；緊張時，馬會高高揚起頭，耳朵向兩旁豎立；感到恐懼時，馬會不停地擺動耳朵並從鼻子裡發出響聲；疲倦想休息時，馬的耳根略顯無力，耳朵會倒向前方或垂向兩側。馬的耳朵和眼睛協調得很好，眼睛一發現異樣，耳朵會跟著朝那個方向「打聽」，一聽到異聲，眼睛也會馬上進行「搜尋」。\n\
    \n    所以，用「東風吹馬耳」來比喻「充耳不聞，無動於衷」，其實是不夠了解馬。動物界裡，真正「充耳不聞」的，當屬一些未具真正聽覺器的動物。例如蛇類缺乏外耳，只有內耳，即相當於我們的耳朵沒有鼓膜不能直接聽到空氣中傳播的聲音。因此把「馬耳東風」改為「蛇耳東風」可能更符合現狀。\n\
    \    在印度街頭常可看到一些舞蛇人盤腿而坐，邊舞動著身體，邊用美妙的笛聲，引出竹籠裡的眼鏡蛇，眼鏡蛇配合著音樂的節奏婆娑起舞。其實蛇不是隨音樂起舞，牠根本聽不見空氣中傳來的笛聲，而是看著舞蛇人上下左右舞動肢體和笛子，所作出的反應。\n\
    \n    那動物界的順風耳呢？應是貓頭鷹。牠們不但具有極佳的視覺，能在黑暗裡瞄準獵物，聽覺更是一流，不會遺漏獵物走動時發出的小小聲音。不僅如此，還能準確地判斷聲音的來源，並配合視覺，來提高獵捕的效率。\n\
    \    以貓頭鷹中的倉鴞為例，牠的左、右耳位置不同，右耳略高於左耳，因此聲音到達左、右耳的時間有些微的差異。若是牠的左、右耳同高，和我們人一樣，就只能判斷音源的遠近，而無法判斷音源的高低。此外，倉鴞的臉盤上還布滿能接收外界細微震動的羽毛，左半部的毛略微向下方長，右半部的毛略微向上方長，阻隔開臉盤左、右兩邊傳來的聲音，如此左、右耳各自對來自下前方、上前方的聲音較為敏感。倉鴞便依照兩耳聽到聲音的時間差異及音量大小，來判斷聲音的位置。倉鴞的這種特殊構造，讓牠在音源高低的定位上，足足比人類強三倍。所以「東風吹鴞耳」，絕對聲聲入耳。\n\
    \n                            ＜東風吹馬耳＞ 朱耀沂"
