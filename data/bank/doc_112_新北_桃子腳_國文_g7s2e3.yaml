  page: 6
  stem: 根據本文，以下何者不是黃仁勳認為台大畢業生比自己會面對更複雜世界的原因？
  options:
  - label: A
    content: 地緣政治
  - label: B
    content: 社會問題
  - label: C
    content: 環境變遷
  - label: D
    content: 追求理想
  group_stem: '庚.你會被 AI 取代，還是因此變更專業？

    黃仁勳：從輝達 3 個故事學成功


    輝達（NVIDIA）執行長黃仁勳現身台大畢業典禮致詞，媽媽及哥哥今日也ㄧ同到場。黃仁勳除分享十年前和台大校長陳文章的第一次接觸，同時也透過 3 個故事，勉勵台大學生找到自己道路的重要性，要為了自己的理想大力奔（run）。

    黃仁勳在會前穿著皮衣，與學生輕鬆打招呼，甚至玩起自拍，於典禮開始時才換上長袍，在學生的歡呼下進場。演講一開始時也大方用台語和大家打招呼，「本來想說跟你們說台語，但是愈想愈緊張，我在美國長大台語不標準，今天說英文好嗎？」引發現場觀眾一陣笑聲。


    黃仁勳：雖然現在多了地緣政治和新科技，但 2023 這個畢業時機很完美

    黃仁勳回憶，第一次來到台大是十年前，陳文章經由兒子介紹，認識到輝達專為人工智慧（AI）打造的軟體工具 CUDA，並將其用於研究當中。黃仁勳回憶，當時門一打開，發現陳文章運用輝達顯卡，打造一台「手工」超級電腦。

    「這是輝達旅程的早期案例，陳博士告訴我：『輝達的產品讓我能做一生所追求志業』，讓我相當感動。」黃仁勳說。比起今日的台大畢業生，黃仁勳正好在 40 年前從奧勒岡州立大學畢業。黃仁勳表示，當時的環境很簡單，還沒有電視、手機這些東西。直到
    1994 年，IBM 的電腦和蘋果（Apple）麥金塔電腦開始了個人電腦革命，帶來晶片、軟體等行業興起，「你們現在的世界更複雜，有地緣政治、社會以及環境變遷等問題。」


    他認為，如今數位世界和現實世界幾乎平行，AI 的發明讓車子可以自駕，醫院也能夠自動判讀 X 光片，創造數百萬美元的商機，「人工智慧開啟很多機會。」


    他指出，AI 將改變未來的工作型態，從軟體到運行過程，每一層都會被重新發明，必須擁抱人工智慧的優勢。「 有人擔心會被 AI 取代，但也有人會因為 AI 而變得更專業。
    」

    台灣在 AI 晶片、伺服器和零組件上，扮演了重要角色。黃仁勳認為，AI 是台灣產業的黃金機會，台大學生是電腦產業下個十年的基石，下個十年，半導體產業將創造數兆美元的產值。「我的旅程從
    40 年前開始，1984 是一個畢業完美時機，2023 也是。」


    黃仁勳 3 個小故事勉勵畢業生：跑起來，否則就會成為獵物

    黃仁勳也在演講中告訴畢業生，「今天將是你一生當中最成功的一天。」指出自己在創業之前也一度很成功，創業後卻歷經多次失敗或被羞辱的經驗。而他也透過 3 個小故事，勉勵畢業生要全力衝刺（run,don''t
    walk），期許畢業生無論是為了追求理想或逃離困難，都要記得大力奔跑，「不管你是為了追逐食物，或是為避免成為獵物。」


    課題一：認錯——正視錯誤並即時停損

    第一個小故事是，輝達所自研的第一項技術為 3D 繪圖晶片，主要應用於電腦遊戲，歷經幾代開發後為降低成本，找上日本遊戲大廠 SEGA 共同開發。然而，經過一年的開發後，黃仁勳發現輝達的技術策略已偏離了市場主流。那是一個生死關頭，若
    SEGA 和輝達分手且不付款，輝達將面臨倒閉命運。

    「讓我驚訝的是 SEGA 答應了，也因為他們的慷慨，讓我們能再活 6 個月。」最終，輝達開發出 RIVA28 顯示晶片。黃仁勳表示， 正因為輝達正視了錯誤並及時止損，並願意即時尋求結束，才挺過了倒閉危機
    。

    課題二：堅持——磨難過去，光明終會到來

    第二個小故事，是有關如今讓輝達站上近兆市值巔峰的 CUDA（Compute Unified Device Architecture，一種平行編程的模型和架構）。由於輝達過去用遊戲繪圖顯卡
    GEFORCE GPU 運算時，沒有模型的作法讓運算的成本很高，利潤也大受打擊，因此「市值一直低於 10 億美元。」而且因為當時 CPU 模型自 IBM 制定規格後，已經標準化了
    60 年，創造一個新的計算模型非常難，因此輝達 2006 年決心投資 CUDA 之後，受到很多投資人的質疑，輝達必須證明這項開發是有其市場需求，並不斷展示開發
    CUDA 的好處。直到 2014 年，一位 AI 學者把 CUDA 用在 GPU，因而開啟了人工智慧的年代，CUDA 才得以順利打開大門。「幸運的是，我們也發現人工智慧的潛力。多年後
    AI 革命爆發，輝達則成為引擎。」黃仁勳認為，正是因為過去的磨難，讓輝達最終完成了任務。

    課題三：撤退——有策略地撤退，是成功的核心

    第三個小故事，黃仁勳分享了在 Google 開發出安卓（Android）系統時，輝達所扮演的算力角色。黃仁勳回憶，當時手機市場正在快速發展，但競爭者眾多，輝達因此決定離開手機市場，「因為我們知道，輝達的使命是要來解決一般電腦無法解決的問題。」輝達因而轉向發展機器人技術，從
    0 開始創造出千億美元的機器人市場。「這真的得之不易，撤退對你們這樣的聰明人不容易，但有策略的撤退、知道你要什麼，是成功的核心。」黃仁勳說。

    （本文出自數位時代）'
