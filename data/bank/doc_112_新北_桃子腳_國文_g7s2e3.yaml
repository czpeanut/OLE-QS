  group_stem: "甲.\n江僕射① 年少，王丞相呼與共棋。王手嘗不如兩道許② ，而欲敵道戲，試以觀之。江不即下。王曰：「君何以不行？」江曰：「恐不得爾。」傍有客曰：「此年少，戲乃不惡。」王徐舉首曰：「此年少，非唯圍棋見勝！」\n\
