  group_stem: "丁.\n    蘇子夜坐，有鼠方嚙。拊床而止之，既止復作。使童子燭之，有橐① 中空。嘐嘐聱聱② ，聲在橐中。曰：「噫！此鼠之見閉而不得去者也。」發而視之，寂無所有，舉燭而索，中有死鼠。童子驚曰：「是方嚙也，而遽死也？向為何聲，豈其鬼耶？」覆而出之，墮地乃走，雖有敏者，莫措其手。\n\
    \    蘇子歎曰：「異哉，是鼠之黠也！」\n《黠鼠賦》蘇軾\n解釋：① 橐：音ㄊㄨㄛˊ，袋子\n      ② 嘐嘐聱聱：音ㄒㄧㄠㄒㄧㄠ ㄠˊㄠˊ，形容老鼠咬袋子的聲音"
