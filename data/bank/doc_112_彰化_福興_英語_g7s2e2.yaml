  page: 2
  stem: What kind of animals are groundhogs?
  options:
  - label: A
    content: reptiles
  - label: B
    content: arachnids
  - label: C
    content: rodents
  - label: D
    content: insects
  group_stem: 'A. Groundhogs

    What do you know about groundhogs? Did you know that groundhogs are also called
    woodchucks? Groundhogs are rodents, just like rats, mice, and hamsters.

    Groundhogs eat lots of plants. All summer long, groundhogs eat and eat and eat.
    After so much eating, groundhogs get fat.

    Groundhogs use their paws to dig their homes. Their homes are underground. They
    are called burrows. When it is wintertime, groundhogs go into their burrows to
    sleep. They sleep all winter. They live on their own body fat!

    In the spring, groundhogs wake up and come out of their burrows. The groundhogs
    are skinny when they come out. They start to look for plants to eat, so they can
    get fat all over again.'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
