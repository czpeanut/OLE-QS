    B: Hi, Lynn. I must thank you for the tip on the chicken soup. It is delicious.

    A: I''m glad you like it. So, what can I get you today?

    B: Umm... I''m thinking about making an apple pie.

    A: Your famous apple pie? And I see you got some nice fish from Mr. Brown. Someone''s
    coming to dinner, I guess.

    B: Well, it''s my son. He''s coming back tonight.

