- id: doc_113_新北_五峰_自然_g8s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 如圖所示，阿翰取 2 公克碳酸氫鈉粉末置入試管中，放在酒精燈上加熱，下列相關的敘述何者正確？
  options:
  - label: A
    content: 因為試管變熱，所以此反應為放熱的反應。
  - label: B
    content: 因為水往下流，所以要將圖中鐵架上的試管管口朝上，反應產生的液體才能集中到試管底方便收集。
  - label: C
    content: 澄清石灰水會變混濁，表示碳酸氫鈉粉末透過橡皮管跑到試管中，造成碳酸氫鈉的沉澱。
  - label: D
    content: 實驗完畢熄火之前，應先將橡皮管抽離石灰水，可避免石灰水逆流造成試管破裂。
