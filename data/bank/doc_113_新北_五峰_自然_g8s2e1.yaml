- id: doc_113_新北_五峰_自然_g8s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 學校機踏車棚的鐵皮屋頂因為鏽蝕嚴重需要更新，廠商說換鍍鋅鋼板的材料比不銹鋼的便宜又防鏽，請問日常生活中，許多金屬製品表面會鍍上一層薄薄的鋅以達防鏽的目的，其防鏽作用的敘述何者正確？
  options:
  - label: A
    content: 鋅不容易氧化，所以可以隔絕氧氣達到防鏽目的。
  - label: B
    content: 鋅容易氧化，但會形成緻密的氧化鋅，能避免內部的金屬繼續氧化生鏽。
  - label: C
    content: 若鍍鋅的厚度太厚，對氧的活性太大，反而不能防鏽。
  - label: D
    content: 鋅與鐵結成合金會降低鐵的活性，因此不易生鏽。
