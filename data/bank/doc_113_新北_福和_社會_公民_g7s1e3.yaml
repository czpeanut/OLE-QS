    labeled_by: ai
- id: doc_113_新北_福和_社會_公民_g7s1e3_s1_38
  section: 1
  number: 38
  type: single
  page: 1
  stem: 據說飛魚是天神給達悟族的禮物，達悟族人以各種儀式配合漁撈、煮食活動以及曬曝過程，其中飛魚又分為老人魚、男人魚以及女人魚，故一個達悟族男子在捕魚時，必須捕撈到不同種的魚，以供應家裡的男女老少享用，抑制過量捕殺單一魚類的危機，並兼顧了生態保育的平衡。達悟族人捕飛魚的考量，顯示出下列哪一項部落的重要性？
    L6
  options:
  - label: A
    content: 基本政治組織，依各族文化形成政治組織
  - label: B
    content: 傳統信仰重心，對族人產生約束規範力量
  - label: C
    content: 語言文化傳承，形塑族人對部落的認同感
  - label: D
    content: 生產分配中心，重視生態平衡與共享特質
