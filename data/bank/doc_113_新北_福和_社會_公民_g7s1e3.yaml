  section: 1
  number: 39
  type: single
  page: 1
  stem: 霸凌事件層出不窮，根據兒福聯盟《2023 臺灣兒少遭微歧視經驗與校園霸凌調查報告》公布調查發現，有15.1%兒少被霸凌，包含網路、肢體、言語、關係霸凌等，身心疾病、性別氣質、性傾向被歧視最嚴重，霸凌雖非使被害者直接受到身體上的傷害，但仍會造成受害者一輩子不可抹滅的傷害，請問下列有關「校園霸凌」的敘述，何者正確？
    L5
  options:
  - label: A
    content: 排擠關係不佳的同學就是霸凌
  - label: B
    content: 網路上的謾罵不算霸凌
  - label: C
    content: 霸凌不會涉及名譽和隱私的問題
  - label: D
    content: 霸凌只會是偶然的突發事件。
