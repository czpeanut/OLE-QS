- id: doc_113_新北_福和_社會_公民_g7s1e3_s1_35
  section: 1
  number: 35
  type: single
  page: 1
  stem: '某高中學生小美參加學校熱舞社，在校慶表演時因為服裝不小心鬆脫，露出了裡面的運動內衣，被同校學生小華拍下後製成迷因梗圖，並上傳到社群媒體，引來許多網友嘲笑和批評。小美看到圖片後覺得很難過，也開始害怕上學，擔心會被更多人嘲笑。學校得知此事後，便通報教育主管機關，並對相關學生進行輔導。在這起事件中，上表有關小華對小美涉及的侵犯行為敘述，哪些是正確？
    L5


    | 甲 | 導致小美害怕上學，侵害小美學習的權益 |

    | :--- | :--- |

    | 乙 | 侵害小美的服裝財產權和身體外觀所應該受到尊重 |

    | 丙 | 小華在學校和網路上的行為對小美的聲譽造成損害 |

    | 丁 | 未經同意散布涉及身體外觀的圖像侵犯了小美的隱私 |'
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙丙丁
  - label: C
    content: 甲丙丁
  - label: D
    content: 甲乙丁。
