  type: single
  page: 2
  stem: '西元 2019 年 2 月，臺東知本溼地的卡大地布部落，對於政府預備將太陽能板裝設在原民傳統領域上，表達反對意見。部落族人北上陳情，訴說對於候鳥棲息環境將因此而遭到破壞的憂心，要求政府應事先與部落協商，而不是用招待族人去遊覽、承諾增加工作機會等方式包裝，然後即刻實施裝設施作。根據上述，右圖何者可能為部落陳情的理由？
