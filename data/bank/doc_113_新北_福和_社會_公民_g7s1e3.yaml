- id: doc_113_新北_福和_社會_公民_g7s1e3_s1_37
  section: 1
  number: 37
  type: single
  page: 1
  stem: 為了讓校園生活更美好，許多學校鼓勵學生積極參與公共事務，並透過學生自治的方式來解決校園中遇到的問題。然而，並非所有的事情都屬於校園公共事務的範疇，下列哪一個事件最適合透過學生自治的方式來討論和解決？
    L5
  options:
  - label: A
    content: 小強認為學校每學期三次段考壓力太大，想要建議學校比照小學端舉行兩次段考即可
  - label: B
    content: 小華覺得學校的籃球場地燈光昏暗，容易發生危險，想要建議學校改善照明設備
  - label: C
    content: 小志發現學校附近的便利商店販售過期食品，想要發起同學抵制該商店的行動
  - label: D
    content: 小美認為學校的手機使用規定太過嚴格，想要爭取學生在校有自由使用手機的權利。
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 公民
      code: 5-2
      title: 如何參與校園公共事務？
      chapter: 第5章 學生權利與校園生活
