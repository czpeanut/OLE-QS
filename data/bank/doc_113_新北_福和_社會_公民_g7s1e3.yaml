    | 大獎 | 好啊，我順便提議，我們全班自動放假一天，去聽張韶涵的演唱會。 |


    導師提醒主席小強和大獎的發言內容已超出討論範圍，主席確認小帥與大壯的發言有人 甲 ，並告知小強與大獎其發言不列入討論，過程中有老鼠突然衝出驚動同學，致使會議秩序大亂，討論被迫中斷，阿花提出
