  section: 1
  number: 47
  type: single
  page: 2
  stem: 司馬庫斯部落積極發展觀光，吸引許多遊客造訪，但也面臨觀光發展與部落傳統文化、生態環境之間的衝突與挑戰。下列哪一項作法是司馬庫斯部落居民在發展觀光的同時，也能兼顧部落永續發展所選擇的方式？
    L6
  options:
  - label: A
    content: 興建大型遊樂園區，吸引更多觀光客
  - label: B
    content: 部落居民透過部落會議討論，制定相關規範
  - label: C
    content: 禁止遊客進入部落，以保護部落生活
  - label: D
    content: 將部落土地所有權販售給財團，快速發展部落觀光產業。
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 公民
