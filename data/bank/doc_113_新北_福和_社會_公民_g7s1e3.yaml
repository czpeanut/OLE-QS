  section: 1
  number: 46
  type: single
  page: 2
  stem: 部落對原住民而言，不僅是傳統的聚居型態，更具有多面向且深刻的意義與連結，包括宗教信仰、語言文化、經濟與政治等方面，請問下列敘述，何者與語言文化傳承有關？
    L6
  options:
  - label: A
    content: 武界部落以部落會議討論與議決部落事務
  - label: B
    content: 土阪部落建祖靈屋庇佑子孫並表達對祖先心存敬畏
  - label: C
    content: 布農族的八部合音表彰對大自然的崇敬
  - label: D
    content: 太魯閣族狩獵不打幼獸以維護生態永續。
