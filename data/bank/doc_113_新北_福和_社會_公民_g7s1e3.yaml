  type: single
  page: 2
  stem: 台南女中爭取短褲權，發起在升旗典禮脫下長褲，秀出運動短褲，爭取權利，此後陸續發生多個女校爭取短褲權，最後教育部修正《學校訂定教師輔導與管教學生辦法注意事項》，明確規範學校不得以學生服儀違規為由懲罰學生，讓該項學生服儀的規範正式劃下句點。站在人權保障的立場，關於學生爭取服儀自主的行為，下列敘述何者正確？
