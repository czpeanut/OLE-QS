  stem: F 國國會正式立法通過一項政令，於全國實施「禁止學生在校園內使用手機、平板電腦、智慧型手錶等電子產品」，該國總統表示「學生來學校是為了學習，為了不使學生學習受到干擾，提高學習成效，故適當的限制將有助於學生學習。」根據上述，下列何者正確？
