    labeled_by: ai
- id: doc_113_新北_福和_社會_公民_g7s1e3_s1_36
  section: 1
  number: 36
  type: single
  page: 1
  stem: '右表示有關於社區與部落的比較，請問哪一個項目的敘述正確？ L6


    | | 社區 | 部落 |

    | :--- | :--- | :--- |

    | (甲)重要性 | 「我是當地人」的認同感與歸屬感 | 獨特信仰、文化、生產與分配的傳承 |

    | (乙)意義 | 區域內依傳統規範共同生活的團體 | 生活息息相關所形成的公共生活團體 |

    | (丙)位置 | 僅限都市地區 | 多分布偏鄉山區 |

    | (丁)範圍 | 沒有明確界線 | 由政府核定地區 |'
