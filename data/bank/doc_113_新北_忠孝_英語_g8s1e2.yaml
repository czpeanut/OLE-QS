  group_stem: 'Depression is a mood problem. People with depression may have a strong
    feeling of sadness and lose interest in life. Over 264,000,000 people in the world
    have depression. How much do you know about depression? People have some common
    myths. Let’s take a look.

    Myth 1: Depression is just like being sad. False! Depression and sadness are not
    the same. Depression changes the body and mind. People with depression need help
    from doctors.

    Myth 2: Depression is not common. False! Up to 10% of people in the world may
    need help for depression.

    Myth 3: Only sad adults have depression. False! People of any age, old or young,
    can have depression.

    Myth 4: Don’t tell others if you have depression. False! Many people have depression.
    Talking about it with doctors can be helpful for everyone.


