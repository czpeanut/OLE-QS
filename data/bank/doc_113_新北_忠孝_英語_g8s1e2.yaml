    keep. You may come up with a plan to fix a problem after a full night of good
    sleep. Next time when you don’t know how to work out a problem, just sleep on
    it. Below are some tips for a good night’s sleep.


    1. Go to bed and get up at the same time every day.

    2. Sleep in a dark and quiet room.

    3. Don’t use your cellphone before bed.

    4. A warm bath or reading before bed may help.

    5. Do exercise every day, but not right before bedtime.

