  group_stem: 'ICRT News for Kids (2024-10-23)

    One October, some kids in the U.S. learned about people with no homes. The kids
    wanted to help them very much. They talked to their teacher about helping. The
    teacher didn''t know what to tell them. So he talked to a local shelter. That''s
    where people with no homes stay for a short time. The shelter said it needed socks!
    Winter was coming, and new socks help keep people warm. The kids were excited!
    They made a project to get new socks. They named their project Socktober! People
    from their town gave socks. The project got a lot of them. Everyone was surprised!
    People like Socktober. Many started their own projects.

