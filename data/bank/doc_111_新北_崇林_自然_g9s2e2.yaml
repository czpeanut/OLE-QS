- id: doc_111_新北_崇林_自然_g9s2e2_s1_24
  section: 1
  number: 24
  type: single
  page: 3
  stem: 互斥式的磁浮列車，其原理與下列何者相似？
  options:
  - label: A
    content: 地球上的磁針會指向北方
  - label: B
    content: 斷裂的磁棒兩端仍有兩種不同的磁性
  - label: C
    content: 將磁棒推入線圈會產生電流
  - label: D
    content: 用磁鐵吸引鐵釘，可使其具有磁性
  group_stem: "請在閱讀下列敘述後，回答24~25 題:\n\n    運輸工具的發展，對我們生活的影響極大；從早期的公車和火車，到近期的捷運和高鐵，每種交通工具皆改變了我們的生活形態，也擴展了我們的生活圈。而磁浮列車，則是目前最受注目的交通工具之一。\n\
    \    大部分的陸上交通工具，皆是以輪子在地面或軌道上運行；而磁浮列車則是藉由磁力的相斥或相吸，使得列車能懸浮於軌道上運行，這點是與其他的載具最大的不同處。也由於此原理，減少了列車與軌道間的摩擦力，使得它的時速可高達五百多公里，速度遠大於其他陸上的載具。\n\
    \    根據運行的原理，可將磁浮列車分為互斥式磁浮與吸引式磁浮兩種。互斥式的列車下方裝有磁石，其磁力線的改變，會使得軌道上的線圈產生感應電流；而此感應電流產生的磁場，會與列車的磁場互相排斥，便可使得列車懸浮於軌道上。而吸引式列車則是藉由通入電流後，產生的磁場與軌道相吸，並調整電流大小，使得磁力的吸引力和列車本身的重力達成平衡，讓列車懸浮。不論何種型式的列車，皆有低汙染、速度快的優點。"
  tags:
