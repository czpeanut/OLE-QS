- id: doc_111_新北_崇林_自然_g9s2e2_s1_22
  section: 1
  number: 22
  type: single
  page: 3
  stem: 若地磁的產生是因為地核內電子繞地球旋轉而產生，試問若由北極上空觀看，此電子環繞的方向較接近下列何者？
  options:
  - label: A
    content: 逆時鐘轉動
  - label: B
    content: 順時鐘轉動
  - label: C
    content: 由北極向東方環繞旋轉
  - label: D
    content: 由北極向西方環繞旋轉。
  group_stem: '請在閱讀下列敘述後，回答22~23 題


    地球周圍具有磁場，科學上有關地球磁場的成因有數種不同的說法，近幾年較為人們肯定的說法有兩種：其一是地球外地核是液態，隨地球自轉而流動的液態金屬產生電流，進而感應產生磁場；其二是地核的放射性元素在衰變的過程中產生了電流，進而感應產生磁場。在地表上生活的我們，可以簡單的將地球的磁場想像成一個巨大的棒形磁鐵。這個假想磁棒的延伸，和地表有兩個交點，在地理北極附近的稱為「地磁北極」；在地理南極附近的稱為「地磁南極」。假想磁棒中心線的方向與地球的自轉軸（地理南、北極的連線）夾角約為11
    度，故地磁北極的位置在加拿大北部，距離地理北極約有1200 公里之遠。但美國科學家在西元2005 年底的報告中提到，地磁北極正逐漸從北美的加拿大移向俄羅斯的西伯利亞，預計50
    年內將完成這一過程。

    科學家很早以前就知道地球磁極會移動，但為何移動仍然是謎。俄勒岡州立大學的古磁學家約瑟夫‧斯托納在舊金山召開的美國地球物理學會會議上說：「地磁北極移往西伯利亞也許是磁場正常振動所致，最終仍將移回加拿大。」斯托納的研究顯示過去150
    年間，地磁北極移動了1100 公里，已進入北極圈。過去100 年地磁北極的移動速度比之前的400 年提高，按目前速度計算，50 年後地磁北極將從加拿大北部移至西伯利亞。科學家對於海底板塊沉積物的研究中也發現，大約毎隔數十萬年到數百萬年，地球上的磁場會發生反轉的現象。科學家分析了四次地層反轉期的地層沉積樣本，從這些沉積樣本可以探知地球磁場完成一次反轉所需時間約7000
    年。但地球磁場的反轉時間還與緯度有關，在赤道地區僅需2000 年，緯度越高所需時間越長，在兩極地區需要11000 年才能完成。最近一次發生地磁反轉大約是在78
    萬年前，現在靠近地球兩極的地區，地球磁場差不多已經完全消失，這正是地球磁場南、北兩極又將發生大反轉的訊號。

    在兩極反轉的過程中，地球生命會受到許多影響。例如，在地磁完全消失的時期中，地球會暴露在各種致命的宇宙射線下，對地球生命造成危害；大氣層上層也因宇宙射線摩擦而升溫，引起全球氣候改變。此外，位於地球近軌道上的導航和通訊衛星，都會受到破壞，地球上遷徒性的動物也將失去定向能力。'
