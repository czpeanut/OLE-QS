- id: doc_113_新北_丹鳳_國文_g7s2e2_s4_2
  section: 4
  number: 2
  type: single
  page: 1
  stem: 關於〈跳水〉與〈風箏〉兩詩的敘述，何者有誤？
  options:
  - label: A
    content: 〈跳水〉描寫人們全情投入、樂在其中的精神面貌，展現青春與活力
  - label: B
    content: 〈風箏〉一詩中，強調「人的意志力可以戰勝環境，永遠懷抱希望」的積極態度
  - label: C
    content: 兩詩皆篇幅短小，以簡單的意象，蘊含深遠的寓意
  - label: D
    content: 〈跳水〉以「雪白的讚嘆」象徵成功後的自我肯定，〈風箏〉以「天空」象徵寬闊的胸懷。
- id: doc_113_新北_丹鳳_國文_g7s2e2_s4_3
  section: 4
  number: 3
  type: single
  page: 1
  stem: '下列關於三首詩的比較，何者錯誤？


    | | 〈登鸛雀樓〉 | 〈聞官軍收河南河北〉 | 〈過華清宮其一〉 |

    | :--- | :--- | :--- | :--- |

    | (A)對仗 | 有兩聯對仗 | 有三聯對仗 | 無對仗 |

    | (B)文體 | 五言絕句 | 七言律詩 | 七言絕句 |

    | (C)押韻 | 平聲韻 | 平聲韻 | 平聲韻 |

    | (D)表達情感 | 登高懷古 | 歸心似箭 | 觸景傷懷 |'
  options:
  - label: A
    content: 對仗：〈登鸛雀樓〉有兩聯對仗，〈聞官軍收河南河北〉有三聯對仗，〈過華清宮其一〉無對仗
  - label: B
    content: 文體：〈登鸛雀樓〉五言絕句，〈聞官軍收河南河北〉七言律詩，〈過華清宮其一〉七言絕句
  - label: C
    content: 押韻：〈登鸛雀樓〉平聲韻，〈聞官軍收河南河北〉平聲韻，〈過華清宮其一〉平聲韻
  - label: D
    content: 表達情感：〈登鸛雀樓〉登高懷古，〈聞官軍收河南河北〉歸心似箭，〈過華清宮其一〉觸景傷懷
  uncertain_spans:
  - 內容與原卷文字層不符（吻合 86%）
- id: doc_113_新北_丹鳳_國文_g7s2e2_s4_4
  section: 4
  number: 4
  type: single
  page: 1
  stem: 下列對〈聞官軍收河南河北〉詩中語意的理解，何者正確？
  options:
  - label: A
    content: 「劍外忽傳收薊北，初聞涕淚滿衣裳」：表現詩人對喪失國土的哀傷悲憤
  - label: B
    content: 「卻看妻子愁何在，漫卷詩書喜欲狂」：描寫妻子樂觀豁達，苦中作樂的性格
  - label: C
    content: 「白日放歌須縱酒，青春作伴好還鄉」：表現詩人把握青春、及時行樂的生活態度
  - label: D
    content: 「即從巴峽穿巫峽，便下襄陽向洛陽」：抒發詩人想像返鄉路途，急切思歸的心情。
  lesson_raw:
    title: 聞官軍收河南河北
    basis: 題目引用〈聞官軍收河南河北〉詩句
- id: doc_113_新北_丹鳳_國文_g7s2e2_s4_5
  section: 4
  number: 5
  type: single
  page: 1
  stem: 下列何人對近體詩的理解或說明正確？
  options:
  - label: A
    content: 翔翔：凡唐朝文人所創作的詩，皆稱為近體詩
  - label: B
    content: 妮妮：我在書本裡找到一首近體詩，細數之後發現它不加題目總共有36 個字
  - label: C
    content: 小貝：一首律詩最多會有五個韻腳
  - label: D
    content: 妞妞：一首絕句最少會有一聯對仗。
- id: doc_113_新北_丹鳳_國文_g7s2e2_s4_6
  section: 4
  number: 6
  type: single
  page: 1
  stem: 關於〈過華清宮其一〉一詩的說明，下列何者錯誤？
  options:
  - label: A
    content: 以濃縮極簡的筆觸，諷刺當年上位者動員國家資源以遂一己之私的舉動
  - label: B
    content: 最後一句為全詩筆調的轉折之處
  - label: C
    content: 詩的前兩句描寫華清宮的建築景觀，後兩句揭曉專使親送荔枝的實情，結構嚴謹
  - label: D
    content: 詩人以第三人稱視角講述自己親眼目睹荔枝運送的場景。
