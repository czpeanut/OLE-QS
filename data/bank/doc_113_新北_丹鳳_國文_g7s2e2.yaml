  group_stem: "題組（三） 24～26 題，閱讀下列兩段資料，回答以下問題\n\n資料一：\n漢皇重色思傾國，御宇多年求不得。\n楊家有女初長成，養在深閨人未識。\n\
    天生麗質難自棄，一朝選在君王側。\n回眸一笑百媚生，六宮粉黛無顏色。\n……\n春宵苦短日高起，從此君王不早朝。\n承歡侍宴無閒暇，春從春遊夜專夜。\n後宮佳麗三千人，三千寵愛在一身。\n\
    金屋妝成嬌侍夜，玉樓宴罷醉和春。\n（錄自白居易〈長恨歌〉）\n\n資料二：\n 妃嗜荔枝，必欲生致之，乃置騎傳送，走數千里，味未變已至京師……每歲十月，帝幸華清宮，五宅車騎皆從，家別為隊，隊一色，俄五家隊合，爛若萬花，川谷成錦繡……及祿山反，玄宗以貴妃為天下怨，乃賜死馬嵬坡。\n\
    （錄自《新唐書．楊貴妃傳》）\n\n注釋：\n1. 粉黛：指後宮嬪妃們。\n2. 幸：此指帝王蒞臨華清宮。\n3. 五宅：應為長安十王宅的一部分，「長安十王宅」是唐玄宗時期在長安城興建的皇室住宅區，專門集中安置皇子、皇孫，便於朝廷集中管理宗室成員，防止他們參與政治鬥爭或結黨營私。"
