- id: doc_113_新北_中平_自然_g9s2e2_s3_37
  section: 3
  number: 37
  type: single
  page: 5
  stem: 根據上述表一的資訊，下列哪種溫室氣體對全球暖化貢獻比例最高？
  options:
  - label: A
    content: 甲烷
  - label: B
    content: 二氧化碳
  - label: C
    content: 一氧化二氮
  - label: D
    content: 三氯氟甲烷。
  group_stem: '※工業革命以來，人類燃燒化石燃料、砍伐森林、農業施肥、畜養放牧等活動，排放出大量溫室氣體，主要有二氧化碳和甲烷等。科學家為了比較各種溫室氣體的特性，發展出全球暖化潛勢（Global
    Warming Potential，簡稱GWP）等指標，各種溫室氣體對暖化的貢獻如表一所示：

    表一 全球暖化的主要溫室氣體貢獻比例

    | 比較項目\氣體 | 氣體來源 | 全球暖化潛勢 GWP註1（100年） | 對全球暖化貢獻比例 |

    | :--- | :--- | :--- | :--- |

    | 二氧化碳 | 燃燒化石燃料、砍伐森林 | 1 | 60% |

    | 甲烷 | 農牧行為、燃料外洩 | 27～29.8 | 20% |

    | 一氧化二氮 | 農牧行為、燃燒 | 273 | 6% |

    | 三氯氟甲烷註2 | 冷卻劑 | 6226 | 14% |


    除了氣體本身的特性，氣體的總量、氣體濃度、氣體停留於大氣的時間等，也是影響溫室氣體對全球暖化貢獻比例的因素。'
