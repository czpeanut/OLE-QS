- id: doc_113_新北_中平_自然_g9s2e2_s3_38
  section: 3
  number: 38
  type: single
  page: 5
  stem: 黃色小鴨只是玩具，不是真的會游泳的鴨子，是什麼因素使玩具鴨能穿越那麼遙遠的海洋，到世界各地呢？
  options:
  - label: A
    content: 洋流
  - label: B
    content: 潮汐
  - label: C
    content: 波浪
  - label: D
    content: 季風
  group_stem: '※西元1992 年，一艘貨輪從中國出發要穿越太平洋前往美國，在海上經過國際換日線附近時遇到強烈風暴，整艘船搖搖晃晃，其中幾個貨櫃墜入海中。破裂的貨櫃中漂出二萬九千隻黃色小鴨等浴盆玩具，在海面上浩浩蕩蕩的展開歷險。
    海洋科學家們認為這是對於研究洋流流向很好的標的物，配合學者研究，玩具鴨的製造公司「The First Years」也提供獎勵給發現鴨子的民眾。科學家比較撿到鴨子的位置和電腦模擬洋流循環圖，發現鴨子沿途經過了太平洋、大西洋、北極海等海洋，平均每天漂流11
    公里。十五年後，這些鴨子隨著洋流分批登陸加拿大、美國東岸與英國北部等海灘，完成數萬公里的歷險。雖然這些印有「The First Years」標記的玩具鴨經過長途旅行，大部分已經被沖刷成白色，卻因為它們對於研究洋流的價值非常高而身價倍漲，有公司甚至願以一隻五十英鎊的高價收購。請回答48-50
    題(素養導向) :'
  shared_asset: g3_38_40
