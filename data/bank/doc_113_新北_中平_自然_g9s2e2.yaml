- id: doc_113_新北_中平_自然_g9s2e2_s2_24
  section: 2
  number: 24
  type: single
  page: 4
  stem: 使用電磁爐時需通以交流電，其原因為何？
  options:
  - label: A
    content: 交流電的電流強弱固定，可以提供穩定的電流
  - label: B
    content: 交流電的電流強弱和方向雖然會不停變化，但產生的磁場大小和方向會固定而沒有改變
  - label: C
    content: 交流電的電流強弱和方向會不停變化，產生的磁場大小和方向也不停變化
  - label: D
    content: 不一定要使用交流電，使用直流電也可以使磁場改變。
  group_stem: '日常生活中有一些物品是運用到電磁感應原理，如電磁爐和悠遊卡。

    電磁爐內部有銅製線圈，當通以交流電時，磁場便會隨之改變，使爐面上的金屬鍋感應而產生電流，再經由電流的熱效應轉化成熱能後，便可以加熱鍋內的食材。

    　　悠遊卡內部的晶片與銅製線圈連接，當我們搭乘大眾運輸或在便利商店消費時，車站閘門或店家設有讀卡機，其內部含有通電線圈，可以在周圍產生磁場。而將悠遊卡靠近讀卡機時，卡片中的線圈接受到磁場變化後，會產生感應電流，就可以讀寫晶片的數據了。請回答24
    ~ 25 題。'
  tags:
    chapter:
      publisher: 康軒
      book: 九下
      subject: 理化
      code: 2-3
      title: 電流與磁場的交互作用
      chapter: 第2章 電流與磁現象
