  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
  group_stem: "◎請閱讀下面短文，回答第14~15 題：\n    1950 年，非洲總人口僅2.29 億，但1990 年來到6.3 億，而1996\
    \ 年已經超過歐洲，人口數躍升為僅次於亞洲的第二大洲。千禧年，非洲總人口達8 億，而且之後每年都在增長，2022 年更首度超過14 億。根據各項預測數據顯示，非洲未來仍將持續擁有令人矚目的人口增幅，預計2050\
    \ 年將增長至24.9 億。\n    非洲過去40 年的人口迅速增長，尤以撒哈拉沙漠以南最為顯著，不僅開始超越其他大陸，龐大迅速的人口增加比例更超過了印度和中國，成為全球人口增長最快速的地區之一。這裡的嬰兒出生數從1990\
    \ 年後增加了21%，預計在2050 年將增至37%。\n    當印度和中國的成長人口預計在本世紀中葉逐漸萎縮趨緩，撒哈拉以南的非洲卻成為唯一到本世紀末還持續大幅增長的地區。估計2100\
    \ 年世界人口數前10 名國家，將有4 國來自撒哈拉以南的非洲區域，非洲總人口數將暴增至今日的3 倍。\n                        摘錄自《獨立評論》＜非洲的人口紅利：未來全世界每3～4\
    \ 人，就有1 位來自非洲！＞"
