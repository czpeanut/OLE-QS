- id: doc_113_高雄_英明_社會_公民_g7s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 請問上述所述事件，正凸顯了部落所面臨的哪一項挑戰？
  options:
  - label: A
    content: 傳統文化的斷層
  - label: B
    content: 部落經濟的停滯
  - label: C
    content: 傳統領域的保護
  - label: D
    content: 文化與法律的衝突。
  group_stem: 2015 年，一位布農族人為了照顧生病的母親，依照傳統習俗進行狩獵，但因觸犯相關法律被起訴。此案件引發社會廣泛討論，許多團體提出意見，認為狩獵行為是原住民族文化的一部分，應受到尊重，而現行法律可能無法完全兼顧文化需求。相關團體上街抗議爭取權益，並遞交陳情書至政府，希望展現原住民族文化的重要性。該案件最終經過多次審理與討論，當事人也獲得總統特赦，成為原住民族權益的重要案例之一。
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 公民
      code: 6-2
      title: 部落的挑戰與公民參與
