  page: 1
  stem: 在月光國中一年甲班的班會上，大家正在進行票選班級模範生。結果顯示，莉芙蓮和希洛的票數相同，無法直接決定人選。依據一般班會規範，此時應該如何決定人選？
  options:
  - label: A
    content: 由主席直接決定
  - label: B
    content: 須重新進行投票
  - label: C
    content: 透過抽籤來決定
  - label: D
    content: 讓兩人進行猜拳。
