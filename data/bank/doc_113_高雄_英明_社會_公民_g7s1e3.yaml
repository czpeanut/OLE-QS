- id: doc_113_高雄_英明_社會_公民_g7s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 在鬼殺隊的一次會議中，善逸和其他隊員一起討論分配夜間巡邏的責任。討論結束後，善逸發現自己被分配到最危險的區域，雖然他內心有些猶豫，但仍然決定接受分配，並按照會議的結果行動。善逸的這種行為展現了哪一項公民德性？
  options:
  - label: A
    content: 尊重並遵守共同制定規範
  - label: B
    content: 提供創新建議以改進事務
  - label: C
    content: 運用理性思考與分析能力
  - label: D
    content: 展現公平正義並捍衛弱勢。
