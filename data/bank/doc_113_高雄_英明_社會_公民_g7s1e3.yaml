- id: doc_113_高雄_英明_社會_公民_g7s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 阿美族傳統有八大年齡階層制度，男孩從13 歲開始進入第一階段，學習跟隨長者上山辨識植物；經過4 年進入第二階段後，開始學習黃藤的剝皮與劈片技巧；當進入第三階段（20
    多歲）時，則能獨立動手編織，例如製作桌椅、籃子、魚簍等日常用品。由此可見，阿美族此種傳統的目的為何？
  options:
  - label: A
    content: 確保族內合理分工
  - label: B
    content: 重視自然資源管理
  - label: C
    content: 文化傳承活動推廣
  - label: D
    content: 表達自治訴求權益。
