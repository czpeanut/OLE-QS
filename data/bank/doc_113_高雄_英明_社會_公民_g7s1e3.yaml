- id: doc_113_高雄_英明_社會_公民_g7s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 針對甲乙兩案的敘述，下列何者正確？
  options:
  - label: A
    content: 甲案被稱為提案
  - label: B
    content: 乙案要以書面的方式呈現
  - label: C
    content: 甲案的提出須有一人以上的附議
  - label: D
    content: 乙案可用來提出與甲案無關的議案。
  group_stem: '木葉村中學某班的同學們決定在寒假舉行班遊，增進同學與老師的情誼。關於班遊的地點，大家在班會上展開熱烈討論：

    主席：目前我收到一份（甲案），是佐助同學建議班遊可以去波之國玩。

    小櫻：主席我想提出（乙案），班遊可以改去湯之國，路程較近呢！

    主席：好的，那我們現在來表決！

    鳴人：我要提出（丙）！表決前應該讓同學充分討論後再表決。

    主席：好的，現在給同學五分鐘的討論時間……

    （表決結束後）

    主席：目前班上共有 30 位同學，贊成波之國的人有 14 位，贊成湯之國的人有 12 位，所以這次班遊地點選為波之國。'
