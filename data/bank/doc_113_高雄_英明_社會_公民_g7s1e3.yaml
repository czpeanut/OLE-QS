  type: single
  page: 1
  stem: 在班會表決班遊地點的過程中，丙案被提出，建議在表決前進行充分討論。假設丙案獲得通過，但甲案與乙案最終票數相同（各 14 票）。根據班會規範，主席應如何處理？
  options:
  - label: A
    content: 要求重新表決，直到一案獲得多數票
