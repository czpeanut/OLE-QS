- id: doc_113_高雄_英明_社會_公民_g7s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 班上的同學小櫻熱愛運動，皮膚曬得健康黝黑，但有些同學卻因她的膚色取笑她，甚至背後給她取了難聽的綽號，讓小櫻感到非常難過和自卑。這些行為不僅影響小櫻的情緒，也可能對她的身心發展造成傷害。這些不友善的行為侵犯了小櫻的何種權利？
  options:
  - label: A
    content: 隱私權
  - label: B
    content: 學習權
  - label: C
    content: 受教育權
  - label: D
    content: 人格發展權。
