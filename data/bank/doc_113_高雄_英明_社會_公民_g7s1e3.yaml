  section: 1
  number: 4
  type: single
  page: 1
  stem: 部落是指原住民族依特定區域範圍內，依其傳統規範，共同生活所形成的團體，經中央原住民族事務機關核定。請問：上述是依據哪一部法律對部落的定義？
  options:
  - label: A
    content: 《憲法》
  - label: B
    content: 《原住民族平等法》
  - label: C
    content: 《原住民族基本法》
  - label: D
    content: 《原住民族文化資產處理法》。
