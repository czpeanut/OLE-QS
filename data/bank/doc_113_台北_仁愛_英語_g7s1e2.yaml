- id: doc_113_台北_仁愛_英語_g7s1e2_s7_38
  section: 7
  number: 38
  type: single
  page: 3
  stem: What can we know from the reading?
  options:
  - label: A
    content: Phubbers are people persons.
  - label: B
    content: Social media can’t change people’s lives.
  - label: C
    content: Phubbing can hurt friendships. It’s hard for people to talk to you.
  - label: D
    content: If you miss out the things that your friends are doing, they will not
      be happy.
  group_stem: "(38-40)\nHow to Stop Phubbing\nPhubbing, a mix of “phone” and “snub,”\
    \ happens\nwhen someone ignores people around them because\nthey’re busy with\
    \ their phone. People phub because social\nmedia is addictive. They want online\
    \ likes, and they are\nafraid to miss out things their friends do. This hurts\n\
    friendships and real-life conversations.\nTo stop phubbing, we can set times to\
    \ use our phones,\ntalk to people in person, and stay in the moment. We take\n\
    breaks from our phones and see how phubbing makes\nothers feel. This way, we build\
    \ better connections and\nenjoy real-life conversations more.\n\U0001F4D6 happen\
    \ 發生 ignore 忽略 addictive 上癮的 miss out 錯過\n   hurt 傷害 conversation 對話 connection\
    \ 連結"
