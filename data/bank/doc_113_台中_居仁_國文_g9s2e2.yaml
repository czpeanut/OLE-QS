  page: 2
  stem: '依據下文，□內最適合填入的詞語依序為何？

    對演員來說，聾啞角色雖是限制，也可能是機會。吳慷仁在《富都青年》中掌握手語節奏與情緒，削弱外放的表演氣質，□□□□，讓無語的角色更顯張力。一場自白口語戲，從平靜到憤怒，從憤怒到悲哀，□□□□，即使無聲也毫不影響情緒傳遞，反而更聚焦於細微表情的情感流轉，極具渲染力，□□□□□。

    (改寫自彭紹宇〈《富都青年》：關於愛，也關於愛的無能〉)'
