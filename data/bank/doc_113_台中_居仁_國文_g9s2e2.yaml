  section: 3
  number: 31
  type: single
  page: 5
  stem: "林子啜茗於湖濱之肆。叢柳蔽窗，湖水皆黯碧若染，小魚百數，來會其下。戲嚼豆脯唾之，群魚爭喋，然隨喋隨逝，繼而存者，三四魚焉。再唾之，墜綴葑草①之上，不食矣。始謂魚之逝者，皆飽也，尋丈之外，水紋攢動，爭喋他物如故。余方悟釣者之將下鉤，必先投食以引之，魚圖食而并吞鉤，久乃知凡下食者，皆將有鉤矣。然則名利之藪②，獨無鉤乎？不及其盛下食之時而去之，其能脫鉤而逝者，幾何也？\n\
