- id: doc_113_台中_居仁_國文_g9s2e2_s4_33
  section: 4
  number: 33
  type: single
  page: 5
  stem: 根據本文，手語星巴克主要希望傳達下列何種理念？
  options:
  - label: A
    content: 訓練非聽障者透過學習亦成為手語使用者
  - label: B
    content: 推廣手語文化並給予聽障者更多就業機會
  - label: C
    content: 讓顧客體驗不同的服務，提升消費新鮮感
  - label: D
    content: 企業經營多元化，提升品牌形象與競爭力
  group_stem: "在日本 東京，有一家特別的星巴克咖啡店，它名為「手語星巴克（Signing Store）」。這家店與一般星巴克不同，店員大多是聽障人士，他們透過手語來與顧客溝通。這樣的創新設計，不僅讓顧客體驗不同的點餐方式，也讓聽障人士擁有更多的就業機會。\n\
    \    聽障者在求職過程中，往往會遇到許多挑戰。由於無法聽見聲音，很多工作場所會認為他們無法順利與同事或顧客溝通。然而，在手語星巴克，這一切變得不再是問題。店內的員工大多使用手語，顧客也能學習一些簡單的手語來與他們交流。這不僅讓聽障者擁有了穩定的工作，還讓大眾對聽障者有了更多的了解與接納。\n\
    \    這家手語星巴克的設計非常注重顧客的體驗。除了可以透過手語點餐外，顧客還可以利用店內的電子螢幕進行選擇，或是用紙筆書寫他們的需求。牆上還展示了常見手語的圖示，讓顧客能夠學習一些基本的手語，並嘗試與店員進行交流。一般的星巴克都是透過叫名字的方式領取飲料，但手語門市的星巴克是透過電子告示牌提醒，順序還是透過數字手勢來標示。疫情期間，手語星巴克門市也會佩戴透明的口罩，讓聾啞顧客可以透過笑容、嘴型來感受人與人之間的感情。這樣的設計不僅解決了聽障者的工作困境，也讓更多人開始學習手語，從而提高了社會的包容性。\n\
    \    手語星巴克的概念並非僅在日本實行。2016 年，星巴克首先在馬來西亞 吉隆坡開設了全球首家手語星巴克，並取得了成功。隨後，美國、中國等國家也開設了類似的門市。這些店鋪不僅是提供咖啡的場所，更是讓顧客體驗和學習手語文化的機會。\n\
    \    手語星巴克是一個結合商業與社會責任的典範。它不僅提供了聽障者就業的機會，也推動了社會對手語文化的理解與尊重。在這裡，顧客不僅品嚐到了美味的咖啡，還學會了如何以不同的方式與人交流，進一步促進了社會的包容性與多元文化的發展。\n\
    \     ——〈日本的手語星巴克：用手語溝通的咖啡館〉"
