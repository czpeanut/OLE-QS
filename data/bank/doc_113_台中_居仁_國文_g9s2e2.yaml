    \ 武俠小說是「男權」的文化「幫兇」。也許有人會說，④ 女俠或女魔頭走出了閨房和廚房，是否可視為「女權」的伸張？表面上如此，但實際上，女俠終究要成為男俠的附庸，因此不能被視之為對「男權」的挑戰。\n\
    \    這段論述中畫線的文字，何者屬於作者意圖陳述的論點，而非立論的證據？"
