  stem: "縣人冉氏，有狗而猛，遇行人輒搏噬之，往往為所傷，傷則主人躬詣請罪，出財救療，如是者數矣。冉氏以是頗患苦狗，然以其猛也，未忍殺，故置之。居數月，冉之鄰至，問其狗，曰：「烹之矣。」驚而詰其故，曰：「日者冉氏有盜，主人覺之，呼二子起，操械共逐之，盜驚而遁。主人疑狗之不吠也，呼之不應，遍索之無有也。將寢，聞臥床下若有微息者，燭之則狗也，卷曲蹲伏，不敢少轉側，垂頭閉目，若惟恐人之聞其聲者。主人曰：『嘻！吾向之隱忍不之殺也，為其有倉卒一旦之用也，惡知其搏行人則勇，而見盜則怯乎哉？』以是故，遂烹之也。」\n\
