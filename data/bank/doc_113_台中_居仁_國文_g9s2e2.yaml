    content: 學博然後志定，故可姑且不論志向
  group_stem: "志之定於心也，如種之播於地也，種粱菽則粱菽矣，種烏附①則烏附矣。雨露之滋，壅培②以成效焉。粱菽成則人賴其養，烏附成則人被其毒。學不正志，而勤其佔畢③，廣其聞見，美其文辭，以售於世，則所學於古之人者，皆其毒人自利之藉也。鳴呼！學者一日之志，天下治亂之原，生人憂樂之本矣。《孟子》曰：「士何事？曰：尚志。」〈學記〉曰：「凡學官先事，士先志。」張子曰：「未官者使正其志。」教而不知先志，學而不知尚志，欲天下治隆而俗美，何由得哉？\n\
    \                              ——張爾岐〈辨志〉\n【注釋】①烏附：藥名，有毒。②壅培：用泥土或肥料培養植物的根部。③佔畢：誦讀。"
