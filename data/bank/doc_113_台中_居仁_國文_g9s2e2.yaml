- id: doc_113_台中_居仁_國文_g9s2e2_s4_39
  section: 4
  number: 39
  type: single
  page: 6
  stem: 下列對於【甲】【乙】兩文中「雲」之描寫，何者正確？
  options:
  - label: A
    content: 甲文認為雲形不定難畫，乙文則視雲為自由象徵
  - label: B
    content: 甲文以雲表現氣象變化，乙文以白雲喻皇恩浩蕩
  - label: C
    content: 甲文主張雲可作畫入詩，乙文則譏諷雲徒具虛名
  - label: D
    content: 甲乙文皆以譬喻句描繪雲形，並視雲為權勢象徵
  group_stem: "【甲】 雲之為物，或崔巍如山，或瀲灩如水，或如人，或如獸，或如鳥毳，或如魚鱗。故天下萬物皆可畫，惟雲不能畫。世所畫雲，亦強名耳。\n\
    \                                ——張潮《幽夢影》\n【乙】 當雨還沒有降下大地時，曾經是雲，雲給人們許多奇妙的聯想。小孩子抬頭看雲，想到的是棉花糖；麵包師傅抬頭看雲，想到的是剛剛揉好的麵團；趕著上班的人抬頭看雲，想到的是軟軟的枕頭。\n\
    \    雲這種東西確實是變化萬千，有時形象如崇偉的山，有時光亮流麗如水，有時像一個人，有時像一匹獸，有時細微得像毫毛或鱗片。張潮認為天下萬物最難描繪的就是雲，世人畫出來的雲都無法掌握真實樣貌，都太勉強了。\n\
    \    它的難以歸類和定型，使我想到「君子不器」這樣的話，一個真正有修為的君子，是不可能古板不知變通的，他可以因時度勢，成為不同的樣子。\n    一千五百多年前的南朝，有位品德與學問都很好的隱者陶弘景，他曾當過梁武帝的老師，很得皇帝敬重，然而，不管皇帝知何懇求，陶弘景都不願意出山為官，只想過著自由自在的隱居生活。\n\
    \    梁武帝寫信問他：「山中何所有？卿何戀而不返？」陶弘景反而用皇帝的問話，寫了一首詩：「山中何所有？嶺上多白雲。只可自怡悅，不堪持贈君。」\n   \
    \ 一個隱士所擁有和珍愛的，只是白雲而已，這不是君王稀罕或需求的東西。喜歡雲的人，看了無限歡悅，而君主的歡悅可不是建立在這種事物上，他們要的更具體、更實際、更巨大，完全利己。\n\
    \   「______________。」這或許是陶弘景真正想要表達的，但又何必把話說得那麼落實呢？於是，他看著眼前起起落落的白雲，微微笑了，在細絹上寫下第一句詩：「山中何所有？」山中所有之物，豈是野心者所能見到的？\n\
    \    天上的白雲是無法捕捉的，真正的隱士是不會被網羅的，就像誰也無法網住一朵雲。\n    雲比我們走得快，雲比我們去得遠，我們走到無路可走的地方，雲才正要飛昇而起。\n\
    \       ——節錄自張曼娟《好潮的夢．雲是無法捕捉的》"
