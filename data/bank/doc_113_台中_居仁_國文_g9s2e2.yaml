  section: 3
  number: 30
  type: single
  page: 4
  stem: "折檐①之前有隙地，方四五丈，直對非非堂，修竹環繞蔭映，未嘗植物，因洿②以為池。不方不圓，任其地形；不甃③不築，全其自然。縱鍤以浚之，汲井以盈之。湛乎汪洋，晶乎清明，微風而波，無波而平，若星若月，精彩下入。予偃息④其上，潛形於毫芒；循漪沿岸，渺然有江潮千里之想，斯足以舒憂隘而娛窮獨也。乃求漁者之罟，市數十魚，童子養之乎其中。童子以為斗斛之水不能廣其容，蓋活⑤其小者而棄其大者。怪而問之，且以是對。嗟乎！其童子無乃⑥嚚昏⑦而無識矣乎！予觀巨魚枯涸在旁不得其所，而群小魚游戲乎淺狹之間，有若自足焉，感之而作〈養魚記〉。\n\
    \                             ——歐陽脩〈養魚記〉\n【注釋】\n①折檐：屋簷下的迴廊。②洿：音「烏」，地勢低的地方。這裡名詞用作動詞，是挖掘的意思。③甃：音「宙」，砌牆。④偃息：休息。毫芒：微小的東西。⑤活：形容詞用作動詞，讓……活著。⑥無乃：難道不是。⑦嚚昏：糊塗昏庸。\n\
    根據上文描述，下列敘述何者正確？"
