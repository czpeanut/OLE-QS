  stem: 依據本文，作者以「種粱菽與種烏附」為喻，是為了強調何種道理？
  options:
  - label: A
    content: 人的志向與其未來所獲得的結果息息相關
  - label: B
    content: 倚靠後天的勤奮努力，遠比天賦更為重要
