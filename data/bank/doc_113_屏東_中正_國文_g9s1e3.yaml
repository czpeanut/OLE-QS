- id: doc_113_屏東_中正_國文_g9s1e3_s4_2
  section: 4
  number: 2
  type: single
  page: 1
  stem: 在錯誤中學習：「一個成名的書法家，送你一幅字，在背後他不知撕毀了多少張，才成就這一張。」上文的意涵，可與下列何句相印證？
  options:
  - label: A
    content: 不經一事，不長一智
  - label: B
    content: 臺上一分鐘，臺下十年功
  - label: C
    content: 人在江湖，身不由己
  - label: D
    content: 過頭話少說，便宜事少做
