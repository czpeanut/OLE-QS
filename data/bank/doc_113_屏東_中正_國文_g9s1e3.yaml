  section: 5
  number: 3
  type: single
  page: 3
  stem: (3)請問巴納比是運用了什麼策略吸引熊狼互鬥，逃出惡狼的威脅？
  options:
  - label: A
    content: 激起母熊的領域觀念，驅散入侵的惡狼
  - label: B
    content: 激起母熊的護子意識，擊退威脅小熊的惡狼
  - label: C
    content: 以小熊當餌，轉移惡狼的目標
  - label: D
    content: 製造兩熊夾攻的陷阱，讓惡狼無處可逃
  group_stem: '引熊鬥惡狼，女子奇蹟脫身狼口

    巴納比於10 日和友人柯德隆到加拿大西北地區史密斯堡附近的森林采蘑菇；兩人分開後沒多久，她和混種狗喬伊就遭遇黑狼跟蹤。惡狼似乎是有策略地要讓巴納比耗盡體力，先是讓她離公路愈來愈遠，再迫使她不斷地深入樹林，還企圖將她和喬伊分開；她當時身上什麼都沒有，只有一個空的啤酒罐，而且身體已經逐漸開始脫水，期間還被森林的大群蚊子侵襲。

    巴納比就這樣被黑狼折磨到清晨4 點半左右，正當瀕臨崩潰之際，她聽見了一頭母熊發出的咕噥聲，而另個方向也能聽見小熊的回應；她判斷，這對母子應該是走失了。因此，她決定放手一搏，朝小熊的方向走去。約20
    分鐘後，她聽見身後傳來攻擊聲，應該是黑狼和母熊奮戰時發出的喊叫。脫困後，她和喬伊繼續走了半小時左右，而黑狼也沒再跟上來；到了11 日的早上8 點，她終於走出樹林，看見正在尋找她的員警，這才結束了這一場驚魂記。'
