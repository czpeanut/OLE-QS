- id: doc_113_屏東_中正_國文_g9s1e3_s5_1
  section: 5
  number: 1
  type: single
  page: 3
  stem: (1)「有的成為生鐵，鑄造笨重的器物；有的成為鍛鐵，製造精密的儀表；有的成為鋼鐵，塑造刀刃與槍炮。」這句話沒有運用到下列何種修辭法？
  options:
  - label: A
    content: 排比
  - label: B
    content: 借代
  - label: C
    content: 類疊
  - label: D
    content: 層遞
  group_stem: '鑄 劍 劉 墉

    你曾經見過鑄劍嗎？燒得通紅的鋼條，從爐裡鉗出，置於鐵砧上用力錘打，沒入涼水，讓它冷卻，又重新放進爐中。就這樣一遍又一遍，直到它成為百煉的精鋼，削鐵如泥的利器。

    鋼鐵就像人，受的煉燒愈深，它的力量愈韌；受的淬浸愈冷，它的意志愈堅；受的磨礪愈細，它的鋒刃愈利。所以同樣是平凡的鐵砂，經過不同的冶煉，有的成為生鐵，鑄造笨重的器物；有的成為鍛鐵，製造精密的儀表；有的成為鋼鐵，塑造刀刃與槍炮。

    再三地燃燒自己以求塑造，再三地淬勵自己以求鋒利。能這樣的鐵砂，就能成鋼；能這樣的凡夫，就能成偉人。'
