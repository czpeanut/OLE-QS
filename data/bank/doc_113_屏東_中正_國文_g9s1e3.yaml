  stem: 孟子：「生於憂患，死於安樂。」同於下列何者？
  options:
  - label: A
    content: 業精於勤，荒於嬉
  - label: B
    content: 安貧樂道，居安思危
  - label: C
    content: 憂勞興國，逸豫亡身
  - label: D
    content: 未雨綢繆，勵精圖治
