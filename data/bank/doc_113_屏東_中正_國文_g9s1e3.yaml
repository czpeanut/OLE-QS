  stem: '學完生於憂患死於安樂一文後，小紅豆製作了論語與孟子兩書的比較表，如下：


    | | 論語 | 孟子 |

    | :--- | :--- | :--- |

    | (甲)時代 | 戰國 | 春秋 |

    | (乙)作者 | 孔子弟子和再傳弟子紀錄編輯而成 | 孟子和其弟子編輯而成 |

    | (丙)內容 | 孔子、弟子、時人應答的語錄 | 孟子的言論和事蹟 |

    | (丁)篇幅 | 篇幅長，雄辯滔滔 | 篇幅短小，言簡意賅 |


    但她卻不小心寫錯了幾個地方，請同學幫她指出是哪些選項？'
