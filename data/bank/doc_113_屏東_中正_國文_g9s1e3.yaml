  section: 5
  number: 5
  type: single
  page: 3
  stem: (5)文中「環而攻之而不勝」其原因為何？
  options:
  - label: A
    content: 城不高，池不深
  - label: B
    content: 地利不如人和
  - label: C
    content: 兵革不夠堅利
  - label: D
    content: 天時不如地利。
  group_stem: '孟子曰：「①天時不如地利，地利不如人和。」三里之城、七里之郭，環而攻之而不勝。夫環而攻之，必有得天時者矣；然而不勝者，是天時不如地利也。城非不高也，池非不深也，②兵革非不堅利也，米粟非不多也；委而去之，是地利不如人和也。」

    故曰：「③域民不以封疆之界，固國不以山谿之險，威天下不以兵革之利；得道者多助，失道者寡助。寡助之至，親戚畔之；多助之至，天下順之。以天下之所順，攻親戚之所畔，故君子有不戰，戰必勝矣。」

    【注釋】①天時：作戰的時機、氣候。②兵革：武器、甲冑。③域：限制、界限 （孟子 公孫丑）'
