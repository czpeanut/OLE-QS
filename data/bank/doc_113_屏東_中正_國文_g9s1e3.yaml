  stem: (7)第二段的大意為何？
  options:
  - label: A
    content: 以「擇不處仁」的不智反襯「里仁為美」
  - label: B
    content: 強調以個人心意為擇居的標準
  - label: C
    content: 說明擇居有賴仁人的指導
  - label: D
    content: 正面闡論里仁的好處。
  group_stem: '為善必慎其習，故所居必擇其地。善在我耳，人何①損焉？而君子必擇所居之地者，蓋慎其習也。孔子曰：「里仁為美。」意以此與！

    一②薰一③蕕，十年有臭，非以其化之之故耶？一日暴，十日寒，無復能生之物。傅者寡，而咻者眾，雖日撻不可為齊語，非以其害之之故耶？善不勝惡舊矣！為善而不求善之資，在我未保其全，而惡習固已亂之矣。此擇不處仁，所以謂之不智，而里仁所以為美也。

    【注釋】①損：傷害、毀壞。②薰：香草。③蕕：音ㄧㄡˊ，臭草。 （王安石 里仁為美）'
