  stem: '第一段：故天將降大任於是人也，必先苦其心志，( ① )，餓其體膚，空乏其身，( ② )：

    所以動心忍性，( ③ )。


    第二段：人恆過，然後能改；困於心，衡於慮，而後作；( ④ )，發於聲，而後喻。

    入則無( ⑤ )，出則無( ⑥ )者，國恆亡。


    請填入第 ① 格：'
