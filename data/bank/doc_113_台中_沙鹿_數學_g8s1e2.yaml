  group_stem: '飼主的煩惱之一就是寵物的飲食，吃太多怕變胖、吃太少怕營養不良，到底寵物應該要吃多少呢？我們可以從熱量來管控寵物的能量攝取。寵物就算一天只有睡覺、吃飯、排泄也會消耗熱量，稱之為「靜止能量需求量」，而依據寵物不同的狀態（需求因子）可計算出不同的「每日能量需求量」，其計算方式如下：


    ◈靜止能量需求量(大卡)=$(\sqrt{K}) \times 70$

    其中 $K=(\sqrt{\text{體重}})^{3}$（體重以公斤計算）


    ◈每日能量需求量(大卡)=靜止能量需求量(大卡)$\times$需求因子

