  stem: 關於本文，下列敘述何者正確？
  options:
  - label: A
    content: 吳玠想要陷害岳飛，所以贈送美人給他
  - label: B
    content: 岳飛認為欲天下太平，需要文臣武將共同為國效力
  - label: C
    content: 岳飛不善飲酒，因此皇上從不勸酒
  - label: D
    content: 岳飛拒絕了吳玠的餽贈，吳玠因此懷恨在心。
  group_stem: '【戊】岳飛傳

    飛至孝，母留河北，遣人求訪，迎歸。母有痼疾，藥餌必親。母卒，水漿不入口者三日。家無姬侍。吳玠素服飛，願與交驩，飾名姝遺[1]之。飛曰：「主上宵旰[2]，豈大將安樂時？」卻不受。玠益敬服。少豪飲，帝戒之曰：「卿異時到河朔[3]乃可飲！」遂絕不飲。帝初為飛營第[4]，飛辭曰：「敵未滅，何以家為！」或問天下何時太平，飛曰：「文臣不愛錢，武臣不惜死，天下太平矣。」


    [1] 遺：音ㄨㄟˋ，贈送。 [2] 宵旰：比喻勤於政事。 [3] 河朔：泛指黃河以北的地方。此指北宋的失土。

    [4] 營第：建造住宅。營，建造。第，古時指王公大臣或富貴人家的住宅。'
  answer:
  - B
  answer_source: answer_key_vlm
