- id: doc_112_高雄_大樹_國文_g8s2e1_s5_11
  section: 5
  number: 11
  type: single
  page: 6
  stem: 根據本文，袁紹的部屬紛紛投效曹操的原因為何？
  options:
  - label: A
    content: 人在屋簷下，不得不低頭
  - label: B
    content: 暫時歸順，將來再謀恢復
  - label: C
    content: 曹操胸襟寬，有容人大度
  - label: D
    content: 畏懼曹操暴虐，被迫投效。
  group_stem: '【己】陳琳檄文聲討曹操

    陳琳是著名的建安七子之一，原是袁紹的書記官。野心勃勃的袁紹，見曹操崛起，對自己的威脅越來越大，便讓陳琳寫了一篇檄文聲討曹操。文中慷慨陳詞，不但細數曹操的罪狀，還痛罵了他的祖宗三代。據說部下把檄文拿來時，曹操正為頭痛所苦，陳琳的檄文文采華茂、言詞犀利，讓他嚇出一身冷汗，頭痛症竟然好了。

    當時袁紹兵多糧足，實力大大超過曹操，但是驕傲自大，對於部屬的意見不但不採納，甚至認為他們別有所圖，還加以責備。有一個叫許攸的重要謀士，因而投奔曹操。許攸對袁紹軍隊的情況十分清楚，曹操採納他的獻策，不但打敗了袁軍猛將，也燒了袁紹的糧草，結果官渡大戰中，袁紹慘敗。

    戰後，陳琳自然也成為階下囚。曹操責問陳琳：「檄文罵我就罷了，為何連祖宗三代也加以辱罵？」陳琳答說：「當時箭在弦上，不得不發啊！」曹操本來就十分欣賞陳琳的文才，聽完後不但不生氣，還封他為官。袁紹的部屬知道了，也都紛紛投效曹操。'
  answer:
  - C
  answer_source: answer_key_vlm
