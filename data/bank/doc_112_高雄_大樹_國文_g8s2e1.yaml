  stem: '秋刀魚是一群擠成一團的洄游性小型魚類，像羔羊群一樣，遇到獵食者突襲時，除了逃，沒什麼其他本領。牠的外體沒任何硬刺，不像許多魚有背刺、鰓蓋棘或尾柄鉤，多少讓獵食者受點苦頭。體內細刺多，胸刺如髮絲柔細，骨骼帶點青綠色，曾被以為和重金屬汙染有關。一般用來引誘魚隻上鉤的魚餌，除了鮮、肥，更講究的是要夠腥、夠臊。秋刀魚肥美多油、體味重，符合餌料的條件。牠原生在高緯度的冷海水域，初從日本進口到臺灣時，「烤秋刀」曾是名貴的海鮮料理。後來，臺灣遠洋漁船開發了庫頁島、北海道附近的漁場，漁獲暴增，秋刀魚變成處處看得到、人人吃得起。量多價賤，從高貴到不貴，牠不再只是岸上的海鮮，熱帶水域裡永遠飢餓的獵食者，也因而得以品嚐秋刀魚的美味。                                                            ――改寫自廖鴻基〈秋刀魚〉

    根據本文，下列關於秋刀魚的敘述何者正確？'
  options:
  - label: A
