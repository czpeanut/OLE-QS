  type: single
  page: 4
  stem: '由於宋遼、宋金、宋夏、宋元之間戰爭不斷，產生了大量無人收斂的死屍，有些黑心的養殖戶就拿這些屍體去餵豬、養魚。腐屍中的毒素進入動物體內，再被買主吃進肚子裡，對民眾的生命健康威脅很大。針對市場上出現的種種亂象，宋朝的當權者採取的辦法是組織行會，按照行業把商人們組織起來，加入行會，行會要負責監管產品品質，確保食品安全。如果出了問題，行會的負責人，當時稱為「行首」、「行頭」或「行老」，是要承擔連帶責任的。《宋刑統》則規定：肉販因為過失出售變質肉，導致他人食物中毒，要把沒有賣出去的肉馬上焚毀，否則的話，杖九十；如果是故意出售變質肉，則要處以流放一年；造成嚴重後果，致人死亡的，絞刑。對於賣灌水肉的行為，宋朝的法律規定要杖六十；而明朝的法律則規定，賣灌水肉或者在糧食中摻沙土，要杖八十。

    ――節選自劉峰 《食不厭精，膾不厭細》

    根據上文，下列解讀何者正確？'
  options:
  - label: A
    content: 宋朝戰爭不斷，導致農作荒廢而缺糧，才會以屍體餵養豬隻
  - label: B
    content: 若販商故意出售變質肉導致消費者食物中毒而亡，在宋朝會被判死刑
  - label: C
    content: 宋朝禁止賣灌水肉或在糧食中摻砂土，違反者會被杖責八十下
  - label: D
