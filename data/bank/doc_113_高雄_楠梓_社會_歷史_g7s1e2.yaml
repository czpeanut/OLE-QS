- id: doc_113_高雄_楠梓_社會_歷史_g7s1e2_s1_37
  section: 1
  number: 37
  type: single
  page: 2
  stem: 下列有關此資料的敘述，何者正確？
  options:
  - label: A
    content: 信件寄件人是鄭克塽
  - label: B
    content: 信件內容提到我的父親「一官」是指鄭經
  - label: C
    content: 信中談到的「此地」是指福建
  - label: D
    content: 這封信應該是寫於鄭軍登陸鹿耳門前後。
  group_stem: "※※※請閱讀以下資料，並回答問題：\n這是1661 年5 月1 日從赤崁送來大員的大官國姓爺寫給荷蘭長官Frederick Coyett\
    \ 閣下的信。\n大明招討大將軍國姓寄這封信給長官Frederick Coyett 閣下：\n         澎湖群島（Piscadores）距離漳州諸島不遠，因此隸屬漳州；同樣，台灣因靠近澎湖群島，所\n\
    以台灣也應在中國政府的統治之下；因而，也應該明白，這兩個濱海之地的居民都是中國人，他們是\n自古就已據有此地，並在此地耕種的人。以前，當荷蘭人的船來謀求貿易通商時，荷蘭人在這些地方\n\
    連一小塊土地也沒有；那時家父一官出於友誼，指這塊土地給他們，但只是借用而已。…………\n         但是現在，我率領強大的軍隊來到此地，不僅要來改善這塊土地，也要在這塊土地上建造幾個\n\
    城市，開創繁衍一個龐大的人群社會。您閣下也當知道得很清楚，還要繼續佔據別人的土地（那個原\n本屬於我們的祖先，因而現在屬於我的土地）是不妥當的，……因此，如果你們及早來向我彎腰低頭，\n\
    用商談的方式，和氣地將你們的城堡移交給我，我不但會把你們的地位升高，使婦女兒童都得保全生\n命，還將允許你們仍舊保有你們所有的物品，也將允許你們按照自己的意願居住在我的轄區裡。\n\
    \        相反地，如果你們拒絕聽從我的話，要反抗我，向我表現敵意，那就要仔細想想，將沒有人逃得\n了命，會全部被殺。又，如果你們想偷偷離開你們的城堡，搭船逃回巴達維亞城，……那時你們將同\n\
    樣必被處死。……\n         最後，我已派十二艘戎克船，載我的官吏和士兵去你們那邊的〔大員〕市鎮，要去防止發生搶劫\n和擾亂的事情，使住在那裡的人，無論是中國人或是荷蘭人，都得以保全他們的物品，也不致有人遭\n\
    受損害，對此，大家都盡可放心，不必害怕我的軍隊。\n永曆十五年三月二十九日，國姓爺。"
