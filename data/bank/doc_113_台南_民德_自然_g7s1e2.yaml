- id: doc_113_台南_民德_自然_g7s1e2_s1_36
  section: 1
  number: 36
  type: single
  page: 4
  stem: '以下內容為某船員的航海日誌，請閱讀完後判斷何者敘述最合理？

    6 月5 日：今天的航程一如往常，不幸的是，我在甲板上工作時不小心被刀子劃傷了手臂，只用急救箱進行了簡單的包紮。

    6 月6 日：手臂上的傷口並沒有好轉，反而開始流膿，周圍的皮膚變得紅腫。我嘗試用消毒藥水清洗，希望能夠減少感染的風險。

    6 月7 日：今天我發現船上的氣氛變得異常凝重。一些夥伴開始出現不適的症狀，有人發燒，有人腹痛，像是無形的惡魔在船上肆虐。

    6 月9 日：今天早上，船上許多夥伴已經無法再起身……除了我，船上只剩下少數幾位曾經得過這種病的船員似乎對這次的疫情免疫。他們是僅存的希望，目前只能依賴他們來照顧病人和維持船上的運轉。

    6 月10 日：希望我們能夠平安度過這次危機。'
  options:
  - label: A
    content: 6 月6 日某船員體內啟動了第一道防禦
  - label: B
    content: 6 月7 日船員們體內啟動了第二道防禦
  - label: C
    content: 對於少數幾位曾經得過這種病的船員來說，體內尚未啟動第三道防禦
  - label: D
    content: 由於體內缺乏三道免疫防線，所以船員才會病死的。
