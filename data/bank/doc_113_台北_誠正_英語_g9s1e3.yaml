  group_stem: 'Recycling is very important. It helps us to protect our Earth and saves
    important materials. Recycling means that we use old things like paper, plastic,
    metal, and glass again to make new things. This helps us make less trash and keeps
    the environment clean.

    For example, recycling one ton of paper saves about 17 trees and uses less water
    and energy. Recycling plastic is important because it stops plastic from going
    into the oceans and hurting sea animals. When we recycle metal, we do not need
    to dig for new metal. It also helps us protect nature.

    People can help by using recycling programs. It’s also important to show people
    how to put their trash in the right place, so they know what can be recycled.
    Schools and offices can set up recycling boxes for everyone to use. This makes
    it easier for people to recycle. We can also do small things, such as bringing
    our own bags and bottles. This way, fewer plastic bags and bottles can be used
    to save the environment. Everyone can help recycle to keep the Earth clean and
    safe for the future.  recycle 回收 material 材料 plastic 塑膠 metal 金屬 ton 噸 energy
    能量'
