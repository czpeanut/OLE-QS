  group_stem: 'Emily is doing her homework.

    Here is something she wrote down on her workbook:

    ?

    -Japan-

    Families clean their houses before the New Year. This is called "Oosouji." It
    means that people start a year in a new way. On New Year’s Day, people go to temples.
    They pray for the health and good luck of this year.


    -South Korea-

    People celebrate New Year with their families. They wear traditional clothes called
    "Hanbok." They bow to their elders and wish them good luck. They also eat rice
    cake soup called "Tteokguk." This soup means they are one year older than last
    year.


    -Spain-

    People eat 12 grapes at midnight. They eat one grape for each sound of the clock.
    They believe the grapes bring good luck for the new year.


    -Philippines-

    Round shapes mean money and good luck. People wear clothes with round shapes,
    like polka dots. They also prepare 12 round fruits for the new year.


    -Denmark-

    People break plates on New Year’s Eve. They throw broken plates at their friends’
    doors. If they break more plates, they will have more luck in the new year.


     pray 祈禱 traditional 傳統的 bow 鞠躬 elder 長輩'
