  group_stem: 'The Power of Gratitude: A Daily Habit

    Gratitude means feeling thankful and showing thanks for the good things in life.
    A study shows that being thankful can help us feel happy and healthy. For example,
    when we say “thank you,” it can reduce stress, help us sleep better, and make
    us feel better. It can also make our friendships be stronger.

    We do not need to do big things to show gratitude. A smile, a "thank you," or
    a short note can show our thanks. These small actions can make others happy. At
    the same time, they also make us feel good. When we say kind words or do nice
    things to others, we bring joy to their day. For example, holding the door for
    someone or helping a friend to carry books can make them feel warm. If we practice
    showing our gratitude every day, we will notice more good things around us.

    Try to imagine a world where everyone thinks about the good things in their lives.
    This can improve relationships and make the world be better. Gratitude can lead
    to kindness, care, and strong connections between people.

     Here is an example of a gratitude diary:

    Today, I’m thankful for…

    (1) The beautiful sunset I saw on my way home.

    (2) A friend who helped me with my homework.

    (3) A warm cup of tea in the morning from my dear mom.

    By writing down small things we are thankful for, we can enjoy the little joys
    in our life. Keeping a gratitude diary helps us see the good side every day. It
    is a simple habit, but it can change the way we think and feel. Why not start
    your own gratitude diary today?

