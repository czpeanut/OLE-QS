- id: doc_111_高雄_林園_社會_歷史_g7s1e3_s1_25
  section: 1
  number: 25
  type: single
  page: 1
  stem: 臺灣俗諺「尪公無頭殼，聖公無手骨」的解說如下：「尪公」指雙忠尊王，祭祀的是唐代張巡、許遠兩位忠臣，為泉州安溪人鄉土保護神。「聖公」指開漳聖王，祭祀的是唐代陳元光，為漳州人的鄉土保護神。清帝國治理臺灣早期，基隆一帶的漳州移民群居今基隆港附近，泉州安溪人則聚集在暖暖地區，雙方以獅球嶺為界。安溪人拜尪公，漳州人拜聖公，每逢械鬥，雙方抬出自己族群的守護神助威，以期獲勝。械鬥之慘烈，連神像都難以保存，故有此諺語。請問：上文中的械鬥，屬下列何種性質？
  options:
  - label: A
    content: 漳泉械鬥
  - label: B
    content: 閩粵械鬥
  - label: C
    content: 職業械鬥
  - label: D
    content: 水源械鬥。
  answer:
  - A
  answer_source: answer_key_vlm
