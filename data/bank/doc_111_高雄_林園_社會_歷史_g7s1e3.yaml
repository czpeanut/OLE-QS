  section: 1
  number: 24
  type: single
  page: 1
  stem: 嘉義市嘉義公園有一「福康安紀功碑」的石碑，右書漢文，左書滿文，其漢文內容如下：「若今特命臺港建立福康安等生祠，實因臺潛當逆匪肆逆以來，荼毒生竅，無慮數萬。福康安等於三月之內，掃蕩無遺，全郡之民威登任傭。此其勳績，固貲有可紀；且令奸頑之徒觸目警心，方可以潛消狠戾。是此舉似與前此之禁毀跡雖相殊，而崇實斥虛之意則原相同，軌能橫議？且勵大小諸臣，果能實心為國愛民，確有美政者，原不禁其立生祠也。崇實斥虛政在茲。乾隆五十三年仲秋月御筆」請問：紀功碑內容提到「實因臺潛當逆匪肆逆」，指的是哪一事件？
  options:
  - label: A
    content: 朱一貴
  - label: B
    content: 林爽文
  - label: C
    content: 戴潮春
  - label: D
    content: 郭懷一。
  answer:
  - B
