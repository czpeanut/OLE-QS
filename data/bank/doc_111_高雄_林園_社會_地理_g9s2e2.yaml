- id: doc_111_高雄_林園_社會_地理_g9s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 下列哪個舉措最符合食品議題中「身土不二」的精神？
  options:
  - label: A
    content: 改良作物營養價值
  - label: B
    content: 大量生產、大量消費
  - label: C
    content: 優先採用當地當令食材
  - label: D
    content: 基因轉殖技術改良農作物。(習作)
  group_stem: '◎請閱讀以下文章，並回答1-2 題：

    「身土不二」原為佛教用語，指「身」與「土」二者無法分開，其中「身」指至今的行為，而「土」則指身處的環境。後來，身土不二成為支持本土生產食品的口號，主要的意涵為──我們和環境是沒有分別的，自己即是環境的一部分，同時也被環境滋養。例如：日本推動的食養運動以「身土不二」作為口號，主張「食用本地生產的時令食物和傳統食品有益身體」；南韓農業協會也引用「身土不二」概念，鼓勵南韓民眾食用國產農作物。'
  answer:
  - C
  answer_source: answer_key_vlm
  tags:
    chapter:
      publisher: 翰林
