  stem: 近年來，臺灣興起許多小農市集，來自鄰近地區的小農會在固定地點，定期將自己種植的農產品帶來銷售，這些小農的農場規模不大，產量不多，大多採用有機農法來耕種，故價格較貴且外觀並不漂亮，但擺上架的都是剛採收的新鮮產品。此外，消費者在購買時，能直接與生產者對話，了解這些食品生產的過程與理念，許多民眾攜家帶眷的前往市集，就是為了帶小朋友聽小農種田的故事。這種生產銷售方式，買到的不只是產品，更買到安心、買到知識、買到一份感情。請問：上述小農市集的生產與銷售方式，符合下列哪些現代農業特色？(甲)減少食物里程
    (乙)機械化耕作 (丙)企業化生產 (丁)重視生態農業 (戊)重視生產履歷。正確的是：
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲丁戊
  - label: C
    content: 乙丁戊
  - label: D
    content: 甲乙丁。
  answer:
  - B
