- id: doc_113_高雄_五甲_社會_g8s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 撒哈拉沙漠位於非洲大陸北部，是世界上最大的沙漠。它西起大西洋沿岸，向東經過埃及到達紅海之濱，長 5600 公里，南北寬 2000 公里，總面積約 932
    萬平方公里，橫跨北非諸多國家，為世界上最乾旱的地區之一，其降水量不足 100 毫米，夏季炎熱，曾出現過 58℃的極端高溫，地表溫度可達 70～80℃。請問：下列哪些因素是當地形成沙漠景觀的原因？(甲)距海遙遠，水氣不易到達(乙)副熱帶高氣壓壟罩
