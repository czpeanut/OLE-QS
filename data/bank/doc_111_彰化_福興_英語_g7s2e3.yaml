- id: doc_111_彰化_福興_英語_g7s2e3_s8_1
  section: 8
  number: 1
  type: single
  page: 3
  stem: How are bats like humans?
  options:
  - label: A
    content: Bats fly at night.
  - label: B
    content: Bats bite people.
  - label: C
    content: Bats sleep upside down.
  - label: D
    content: Bats breathe through lungs.
  group_stem: 'A (1-3)


    Bats, Not Birds


    If you have ever seen a bat flying, you may have thought that it was a bird. But
    bats are actually unique animals. They are also quite different from birds.

    Bats are mammals, not birds. Bats have fur on their bodies and breathe through
    lungs. They are born alive and drink milk from their mothers. Birds have feathers
    on their bodies and breathe through air sacs. They do not drink milk like bats.

    Bats fly at night. They fly to find food. Bats eat fruit, fish, and nectar. Most
    birds fly in the daytime. They fly to find food also, but they mostly eat worms,
    nuts, and seeds. Bats sleep in caves. They sleep upside down. Birds sleep in nests.
    They sleep sitting down.

    As you can see, both bats and birds may be able to fly, but that does not mean
    they are the same. Next time you see a bat and bird, notice what other differences
    there are between them.'
