    title: 張釋之執法
    basis: 引用〈張釋之執法〉課文原句
- id: doc_113_高雄_翠屏_國文_g8s2e2_s3_9
  section: 3
  number: 9
  type: single
  page: 1
  stem: 「罐頭發展初期，售價不菲，也經常有中毒的意外事件傳出，社會大眾普遍不接受這種新式飲食，只有軍隊或是行旅才會購買，還得冒著生命危險。一八六二年，法國科學家巴斯德提出食品腐敗與細菌的關係後，罐頭生產工序改變，高溫蒸氣殺菌可以防止食物腐敗，但是罐頭封口鉛條仍可能導致慢性中毒，防不勝防。」關於這段文字，下列分析何者正確？
  options:
  - label: A
    content: 罐頭食品發展初期因價格昂貴、流通困難，僅在上流社會中風行
  - label: B
    content: 罐頭食品廣受軍隊與行旅所喜愛，以致甘冒生命危險去搜尋採購
  - label: C
    content: 罐頭食品至一八六二年改變生產工序之後，已全面避免食安危機
  - label: D
    content: 罐頭食品初期易產生中毒意外，可能肇因於食品腐敗與包裝材質。
