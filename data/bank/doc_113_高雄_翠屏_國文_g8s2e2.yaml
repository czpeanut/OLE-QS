- id: doc_113_高雄_翠屏_國文_g8s2e2_s3_4
  section: 3
  number: 4
  type: single
  page: 1
  stem: 根據張釋之執法一文，下列文意解釋，何者正確？
  options:
  - label: A
    content: 「見乘輿車騎即走耳」是指那個人看到皇上的車就馬上很慌張的跑走
  - label: B
    content: 「吾馬賴柔和」表示馬平時賴皮但柔和
  - label: C
    content: 「是法不信於民也」是說法律不信任人民
  - label: D
    content: 「唯陛下察之」指希望皇上重新調查。
