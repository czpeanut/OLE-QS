  stem: '下表是〈罐頭由來〉一文關於罐頭的發展演進前後期的敘述，請問哪些選項正確？


    | 選項 | 項 目 | 發展前期 | 發展後期 |

    | --- | --- | --- | --- |

    | 甲 | 罐頭材質 | 鐵皮罐 | 玻璃瓶 |

    | 乙 | 封口方式 | 用軟木塞塞緊，再用鐵線固定瓶蓋或用蠟封死 | 鉛條封口 |

    | 丙 | 殺菌技術 | 高溫蒸氣殺菌 | 在沸水鍋中加熱 30 分鐘以上 |

    | 丁 | 開罐方式 | 用刺刀、斧頭 | 開罐器 |'
  options:
  - label: A
    content: 甲乙
