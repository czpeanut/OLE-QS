    「讀小學的時候，班上要推派打掃廁所的人選時，同學們的眼光都會集中到我的身上，然後全體大合唱似的，叫出我的名字ˇˇ御手洗潔、御手洗潔，好像沒有人比我更適合去做打掃廁所的事了。老師完全不制止這樣的情形，還說：『那麼，就請御手洗同學當代表吧！』對當時的小孩子而言，打掃學校廁所，是最討厭的事，而且是有屈辱性意義的工作。因為不得不做那樣的工作，我只好每天都帶著痛苦的心情去上學。回想起當年的同班同學，我就能明顯感到心裡的邪惡本能。『清潔廁所』就是他們給我的綽號。因為姓名，而得到令人不愉快的綽號，實在很沒有道理。我從小就為了這個而感到痛苦。自從有了這個綽號以後，就算我犯了值得同情的失敗，也得不到同情。例如說，冬天的時候內褲穿反了，在廁所裡不知道要怎麼辦才好，卻聽到同學起鬨喊：耶！耶！因為是『清潔廁所』的人，所以才會這樣啦。這到底是什麼理論呢？我覺得人心好殘酷，我的心也深受傷害。於是我日夜詛咒給我這個名字的父母、給我取綽號的同學、不為我主持公道的老師和學校。我甚至詛咒這個世界，為什麼有廁所這種東西。最可笑的是，遇到因為名字而難堪時，我卻只能躲在廁所裡哭；這種情形一直持續到高中……良子小姐，妳哭了嗎？我所遭遇到的事，確實非常殘酷。……」

    聽著御手洗的敘述，良子笑出了眼淚。說的也是，誰的人生完全沒有辛酸呢？'
