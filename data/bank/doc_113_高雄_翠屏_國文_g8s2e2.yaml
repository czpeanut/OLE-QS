- id: doc_113_高雄_翠屏_國文_g8s2e2_s3_24
  section: 3
  number: 24
  type: single
  page: 3
  stem: 「十七世紀因宗教衝突發生三十年戰爭。當時歐洲國家沒有常備軍隊的概念，雙方在戰爭中大量使用雇傭兵，而雇傭兵的紀律十分渙散。其中的代表人物是神聖羅馬帝國的大元帥華倫斯坦。蝗蟲大軍所到之處燒殺搶掠，由於供給問題，軍隊多採取以戰養戰，所以貧民也就成為劫掠的對象。」根據文意，「蝗蟲大軍」所指為何？
  options:
  - label: A
    content: 貧民
  - label: B
    content: 雇傭兵
  - label: C
    content: 常備軍隊
  - label: D
    content: 宗教衝突。
- id: doc_113_高雄_翠屏_國文_g8s2e2_s3_25
  section: 3
  number: 25
  type: single
  page: 3
  stem: 「『紅外線』能促進人體的血液循環和新陳代謝，『紫外線』能殺滅病菌。但是人在陽光下晒久了，這兩種看不見的光線都會破壞人的皮膚組織。我們的機體為了自我保護，就產生出大量的黑色素，像一條防線，沉積在皮下，使上述兩種光線不能無限制的透入人體。除了含錳及石英的玻璃，一般玻璃都不能使這兩種光線順利的透入。人在玻璃窗裡既然已經受到保護，黑色素就不再大量產生，人的皮膚也就不像曝晒在陽光下那麼容易變得黝黑了。」根據文意，下列說明何者正確？
  options:
  - label: A
    content: 即使只是短暫曝晒在陽光下，皮膚也一定會受到傷害
  - label: B
    content: 紅外線與紫外線對人來說，可說是載舟覆舟
  - label: C
    content: 人的皮膚及血液就像一條防線，能自我保護，防止光線破壞
  - label: D
    content: 即使隔著玻璃窗，人的皮膚也會輕易晒黑。
- id: doc_113_高雄_翠屏_國文_g8s2e2_s3_26
  section: 3
  number: 26
  type: single
  page: 3
  stem: 這篇文章裡共有幾個人在對話？
  options:
  - label: A
    content: １
  - label: B
    content: ２
  - label: C
    content: ３
  - label: D
    content: ４。
  group_stem: '島田莊司《異邦騎士》節錄

    「御手洗先生。」良子邊喝咖啡邊說。

    「什麼事？」

    「御手洗是你的本姓嗎？」

    「不錯。」

    「這個姓氏很有趣。」

    「……」

    「那麼，名字呢？」

    「名字嗎？我是御手洗……算了，知不知道名字，都沒有關係吧？」

    良子好像發出驚叫似的，大聲地說：「我想知道，我非常想知道。」

    她轉頭問我：「你一定也想知道吧？好有意思呢！我真的很想知道。」

    「喂，你們，這個咖啡還可以嗎？」御手洗想借此轉移話題。

    「請你說吧！我也想知道你的名字。」

    御手洗像受盡折磨，對人生感到倦怠的人，他深深嘆了口氣說：「這種痛苦的時間，對我的人生所產生的負面影響，是無法計量的。『名稱表現本質』這句日本格言，真是莫名其妙。」

    我們非常認真、專心地聽著。

    「名稱和本質有什麼關係呢？如果一個人的名字和他的本質，有密切的相關的話，那麼，叫做雪子的人，就絕對不能去海水浴場；叫黑田的人，就得搬去大溪地住囉！」

    「不要發表高論了。」

    「KIYOSHI，我的名字是KIYOSHI。」御手洗悲壯地說。

    可是我心裡想：「這不是什麼不好的名字呀！」

    「寫成漢字的話，就是清潔的『潔』。」我很快地就有一個聯想，並且強忍著不笑出來。良子也是，她先是頭髮和肩膀抖動著，但是最後還是忍不住，笑了出來。

    接著，御手洗就像自虐一樣，自動自發地述說起從小到大這個名字帶給他的不幸。

    「讀小學的時候，班上要推派打掃廁所的人選時，同學們的眼光都會集中到我的身上，然後全體大合唱似的，叫出我的名字ˇˇ御手洗潔、御手洗潔，好像沒有人比我更適合去做打掃廁所的事了。老師完全不制止這樣的情形，還說：『那麼，就請御手洗同學當代表吧！』對當時的小孩子而言，打掃學校廁所，是最討厭的事，而且是有屈辱性意義的工作。因為不得不做那樣的工作，我只好每天都帶著痛苦的心情去上學。回想起當年的同班同學，我就能明顯感到心裡的邪惡本能。『清潔廁所』就是他們給我的綽號。因為姓名，而得到令人不愉快的綽號，實在很沒有道理。我從小就為了這個而感到痛苦。自從有了這個綽號以後，就算我犯了值得同情的失敗，也得不到同情。例如說，冬天的時候內褲穿反了，在廁所裡不知道要怎麼辦才好，卻聽到同學起鬨喊：耶！耶！因為是『清潔廁所』的人，所以才會這樣啦。這到底是什麼理論呢？我覺得人心好殘酷，我的心也深受傷害。於是我日夜詛咒給我這個名字的父母、給我取綽號的同學、不為我主持公道的老師和學校。我甚至詛咒這個世界，為什麼有廁所這種東西。最可笑的是，遇到因為名字而難堪時，我卻只能躲在廁所裡哭；這種情形一直持續到高中……良子小姐，妳哭了嗎？我所遭遇到的事，確實非常殘酷。……」

    聽著御手洗的敘述，良子笑出了眼淚。說的也是，誰的人生完全沒有辛酸呢？'
