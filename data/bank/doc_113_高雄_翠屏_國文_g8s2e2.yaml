- id: doc_113_高雄_翠屏_國文_g8s2e2_s3_7
  section: 3
  number: 7
  type: single
  page: 1
  stem: 「軍事行動中真正能夠做到秋毫無犯者，少之又少，歷史家才會書而榜之。」這段文字的含義與下列何者最接近？
  options:
  - label: A
    content: 戰爭中能做到不侵害人民的行為，實屬難能可貴
  - label: B
    content: 好的軍事領導者懂得運用民間力量
  - label: C
    content: 軍隊中要有鍥而不捨的研究精神才可致勝
  - label: D
    content: 在戰事中要獲得勝利，必須仰賴許多人的智慧。
- id: doc_113_高雄_翠屏_國文_g8s2e2_s3_8
  section: 3
  number: 8
  type: single
  page: 1
