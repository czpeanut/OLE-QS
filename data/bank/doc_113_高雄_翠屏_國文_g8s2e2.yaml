  type: single
  page: 2
  stem: 〈張釋之執法〉一文中，有關對話、人物、表情與文意的配對，下列何者正確？
  options:
  - label: A
    content: 「令他馬，固不敗傷我乎？而廷尉乃當之罰金」－描寫漢文帝對於犯蹕者的魯莾感到生氣，並氣憤張釋之給予犯人的懲罰太少
