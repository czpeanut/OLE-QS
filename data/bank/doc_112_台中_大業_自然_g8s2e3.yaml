- id: doc_112_台中_大業_自然_g8s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '以下有關於烴類的敘述，哪些錯誤？


    (甲)烴類是易溶於水的化合物

    (乙)烴類是有機化合物，故烴類僅含碳元素所組成

    (丙)甲烷、酒精、乙酸這三種化合物中，只有甲烷屬於烴類

    (丁)石油經過分餾塔分離後的烴類產物為純物質

    (戊)烴類完全燃燒會生成二氧化碳和水。'
  options:
  - label: A
    content: 甲丙戊
  - label: B
    content: 甲乙丁
  - label: C
    content: 乙丙丁
  - label: D
    content: 乙丁戊。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 理化
      code: 5-2
      title: 常見的有機化合物
      chapter: 第5章 有機化合物
    textbook: 八下理化 5-2 常見的有機化合物
    labeled_by: ai
