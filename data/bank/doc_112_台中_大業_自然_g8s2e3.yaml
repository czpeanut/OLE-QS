- id: doc_112_台中_大業_自然_g8s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: '逛服飾特賣會時，常被破盤價吸引而造成荷包大失血。但購買衣服除了價錢外，衣服材質也很重要。請問關於下列甲、乙、丙三種衣料材質的特性，何者配對正確？


    甲材質：具有蠶絲般的光澤，吸水性佳，但不耐拉、扯

    乙材質：以石油為原料，燃燒後末端呈球狀，堅韌、易乾、不易皺

    丙材質：由蛋白質組成，燃燒時會有如同燃燒毛髮的臭味'
  options:
  - label: A
    content: 甲材質為再生纖維；乙材質為合成纖維；丙材質為動物纖維
  - label: B
    content: 甲材質為再生纖維；乙材質為合成纖維；丙材質為植物纖維
  - label: C
    content: 甲材質為合成纖維；乙材質為植物纖維；丙材質為再生纖維
  - label: D
    content: 甲材質為植物纖維；乙材質為動物纖維；丙材質為合成纖維。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 理化
      code: 5-3
      title: 聚合物與衣料纖維
      chapter: 第5章 有機化合物
