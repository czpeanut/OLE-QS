- id: doc_112_台中_大業_自然_g8s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 有關有機酸的敘述，下列何者錯誤？
  options:
  - label: A
    content: 有機化合物分子中含有－COOH 原子團時稱為有機酸
  - label: B
    content: 硫酸具有脫水性，滴到方糖上能讓它變成黑色的碳，所以硫酸是有機酸
  - label: C
    content: 乙酸俗稱醋酸屬於弱酸，常用來製造食用醋
  - label: D
    content: 甲酸俗稱蟻酸，其化學式為HCOOH。
