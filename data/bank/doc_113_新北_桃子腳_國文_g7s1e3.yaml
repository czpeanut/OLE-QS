- id: doc_113_新北_桃子腳_國文_g7s1e3_s2_44
  section: 2
  number: 44
  type: single
  page: 5
  stem: 根據本文，宮女元宵淚流滿面準備投井的原因，與下列何者最接近？
  options:
  - label: A
    content: 思君令人老
  - label: B
    content: 不知心恨誰
  - label: C
    content: 花落知多少
  - label: D
    content: 未盡反哺心。
  group_stem: '庚、

    相傳漢武帝有一個寵臣叫東方朔。有一年冬天，連下了幾天大雪，東方朔到御花園給武帝折梅花。一進園門，竟發現一個宮女淚流滿面準備投井。東方朔急忙上前搭救，並問明她要自殺的原由。得知這個宮女名叫元宵，家裡還有雙親和一個妹妹。在她進宮以後，就再也無緣與家人見面。每當到了冬去春來的時節，都比平常更加思念家人，覺得無法在雙親身邊盡孝，還不如一死了之。東方朔聽了之後深感同情，便向她保證，一定會設法給她一個與家人團聚的機會。

    某一天，東方朔在長安街邊上擺了一個占卜攤。很多人都爭著向他占卜求卦。意外的是，每個人所求得的籤，都是「正月十六火焚身」的籤語。隨即長安城裡起了很大恐慌。人們紛紛祈求解災之法。東方朔便說：「正月十三日傍晚，火神君會派一位紅衣神女下凡，她就是那位奉玉帝旨意燒長安的使者，我把抄錄的偈語留給你們，可讓當今的天子想想辦法。」說完，就扔下一張紅帖，揚長而去。

    老百姓拿著紅帖，趕緊送往皇宮稟報皇上。漢武帝接過去一看，只見上面赫然寫著：「長安在劫，火焚帝闕，十五天火，焰紅宵夜。」他頓感大驚，連忙召見了足智多謀的東方朔。東方朔假意地想了想，便說：「據說火神君最愛吃湯圓，宮女元宵經常給您做湯圓，十五日晚上可讓元宵做好湯圓，您焚香上供，傳令長安城家家都做湯圓，一起敬奉火神君。並傳諭臣民一齊在十五晚上掛燈，滿城放鞭炮、煙火，像是滿城大火，這樣便可瞞過玉帝了。另外，通知城外百姓，十五晚上可以進城觀燈，雜在人群中便可消災解難。」武帝聽後，非常高興，就傳旨按照東方朔的辦法執行。

    到了正月十五日，長安城裡張燈結彩、煙花綻放，遊人熙熙攘攘，異常熱鬧。元宵的父母也帶著妹妹進城來觀燈。當他們看到寫有「元宵」的大宮燈時，驚喜地高喊：「元宵！元宵！」等候多時的元宵聽到喊聲，急忙趕來，終於和親人團聚了。就這樣熱鬧了一夜，漢武帝看到長安城果然平安無事，大喜，便下令以後每年的正月十五都做湯圓供火神君，照樣全城都掛燈放煙火。因為宮女元宵做的湯圓最好，人們就把這一天的湯圓叫元宵，這一天就叫元宵節。'
