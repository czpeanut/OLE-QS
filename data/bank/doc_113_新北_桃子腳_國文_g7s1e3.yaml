  section: 2
  number: 31
  type: single
  page: 3
  stem: 根據本文，下列何者不是英雄鼠的英雄事蹟？
  options:
  - label: A
    content: 幫助防治走私保育動物
  - label: B
    content: 摧毀隱藏於未知處的地雷
  - label: C
    content: 經過訓練即展現出良好效率
  - label: D
    content: 探查出肺結核樣本的高準確度。
  group_stem: '甲、

    非洲巨頰囊鼠是一種雜食性動物，體型巨大如貓，體長可達1 公尺，但體態輕盈不足1.5 公斤。牠們嗅覺非常敏銳，且易受到食物獎賞的激勵。來自比利時的非營利組織APOPO
    自1997 年開始訓練此種巨鼠來探測地雷，從巨鼠出生後4 星期開始進行，訓練期約9 個月。牠們可以在20 分鐘內搜索200 平方公尺，這相當於除雷人員帶著地雷探測器連續工作25
    個小時的工作效率。全世界有超過六十個國家的人因戰後四處散落的地雷，生活在誤踩地雷的風險中，不少無辜的百姓因而失去四肢或生命。這些因掃雷而成為戰爭蹂躪地區的「英雄鼠」，其體輕可免於引爆地雷之禍，截至目前，沒有任何巨鼠「殉職」。此外，在許多開發中國家因缺乏資源以及專業人員的技術低落，不少結核病患者未能成功地受到診斷。於是APOPO
