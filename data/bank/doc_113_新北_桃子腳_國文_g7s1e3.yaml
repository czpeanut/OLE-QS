    王戎(1)七歲，嘗與諸小兒遊。看道邊李樹多子折枝(2)，諸兒競走取之，唯戎不動。人問之，答曰：「樹在道邊而多子，此必苦李。」取之，信然(3)。

    （世說新語 雅量篇）

    【注釋】

    (1) 王戎：晉 琅邪 臨沂（今山東省 臨沂縣）人。幼時聰敏，是竹林七賢之一。

    (2) 折枝：指李樹結果很多，以致樹枝下垂、折斷。

    (3) 信然：果然如此。'
