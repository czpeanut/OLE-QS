  type: single
  page: 5
  stem: 文中「沒有人該為我廢寢忘食，出入攜抱」，指的是誰為我們付出？
  options:
  - label: A
    content: 老師
  - label: B
    content: 同學
  - label: C
    content: 父母
  - label: D
    content: 朋友。
  group_stem: '己、

    我深愛那兩個字，那是人類共有的最美麗的語言。

    膚淺的人也許會把「謝謝」解釋為「應酬話」，從小家教甚嚴的人也許已經訓練到把「謝謝」當口頭語來說而毫無感覺的程度。但只有一個一生兢兢業業的人，走盡了人生的末程，深情的回顧所曾行過的一站站風雨晴露，想起上天的恩惠和同行者的徘徊顧戀之意，佇足道旁，哽咽地說一句「謝謝」，這種「謝謝」才是令人五內驚動的。

    一聲謝謝是說不盡的盛意，道不完的感恩。「謝謝」兩字是如此端寧肅穆，像海岬日出，單純平實而又撼天搖地。

    凡不肯說謝謝的人，是一個驕傲冷橫的人，他覺得在這個世界過的是「銀貨兩訖」的日子。他是工商業社會的產物，他覺得他不欠誰，不求誰，他所擁有的東西都是他該得的，所以他不需要向誰說「謝謝」。

    但我知道，我並不「該」得什麼，我曾赤手空拳來到這個世界，沒有人「該」愛我，沒有人「該」養我，沒有人「該」為我廢寢忘食，出入攜抱。我也許繳了學費，但老師那分關懷器重是我買得到的嗎？我也許付了米錢，但農夫的辛勞豈是我那一點錢報償得了的？

    不是在生命退潮的黃昏，而是現在，我要學習說「謝謝」。

    （張曉風 謝謝）'
