  group_stem: '戊、請在閱讀「世界童玩展展覽簡介」後回答問題。


    世界童玩展

    展覽期間：114 年4 月1 日 114 年4 月30 日

    展覽地點：國立台灣歷史博物館

    展覽票價：全票150 元，雙人票260 元，優惠票120元（持學生證或65 歲以上長者）

    展覽簡介：

    世界各民族古老的童玩，多從當地自然界的產物取材，加上創意巧思製作而成，例如：非洲兒童玩的草製獨輪車、南島兒童玩的竹製吹箭、中國兒童玩的陶偶等，因此從童玩中能發現當地的產物特色。

    歐洲在羅馬時代就有供小嬰兒玩的響鈴，還有玩偶及毛髮球；希臘人在上體育課時，要學習四種不同材質的球類課程；在八至十三世紀歐洲的玩具中，以「會動的木偶人」最令人驚奇；十五至十六世紀王公貴族的小孩玩著高級華麗的洋娃娃；十六至十七世紀歐洲的小朋友已在玩陀螺、騎竹馬、跳房子、捉迷藏、盪鞦韆等遊戲。

    中國於清代就有象牙製的「遊藝多寶盒」外銷歐洲，開啟了與世界童玩交流的大門。迄今，童玩已是世界性的流通文化及娛樂，醫學也證明，玩遊戲對肢體發展和身心健康有益。

    本次展覽提供數十件國外的童玩，有來自印度的手拉打鼓三輪車，也有來自德國的桌遊、日本的劍玉等。展場內的童玩依類別展示，將不同國家地區的同類童玩擺放在同區展示，讓民眾可以同時比較世界的童玩，會發現世界上兒童純潔的童心是一樣的。'
