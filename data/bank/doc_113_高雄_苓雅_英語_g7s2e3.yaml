  group_stem: 'Internet Safety Tips


    The Internet is important in our life.  Be sure to keep safe online.  Here are
    some useful tips.

    1. Never give out your phone number or home address to people you meet online,
    or you might get into trouble.

    2. Keep your password safe.  It is not safe to use weak passwords like your phone
    number, or your birth date.  Remember to change your password every 90 days.  Set
    good passwords with numbers and letters.

    3. Think twice before you upload words or pictures.  Once you post them, they
    must be on the Internet for all time.

    4. Be cautious of the people you meet online because you don’t know them in the
    real world.  What they say might not be true.

