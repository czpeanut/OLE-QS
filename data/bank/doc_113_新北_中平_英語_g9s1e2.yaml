  section: 2
  number: 33
  type: single
  page: 4
  stem: 33. What does the report not suggest?
  options:
  - label: A
    content: To give older people some special prices.
  - label: B
    content: To make room prices lower.
  - label: C
    content: To change the menu of the restaurant.
  - label: D
    content: To put more toys or picture books for children.
  group_stem: '(A) Below is a part of A&S Hotel''s market report.


    Since WJ Hotel opened next door to our hotel two years ago, our business has not
    been as good as before. Business is the worst in April and the best in July. April’s
    business is only one tenth of July''s. We must do something about it. For example,
    it would be better if we give seniors a special discount, so more of them will
    stay at our hotel. Also, we should put more toys or children''s books in the playroom
    because around half of our customers bring their children with them. What’s more,
    we were happy to see that the business of our restaurant is rising. After interviewing
    one thousand customers at our restaurant, we were surprised to find that over
    half of those interviewed customers stayed at WJ Hotel for a night or two because
    it was cheaper than staying at our hotel. However, they chose to eat at our restaurant
    because its food was much more delicious than that in WJ Hotel. If we lower room
    prices, especially in December, more business will come in because this month
    is the second busiest month of the year. People would be glad to stay at our hotel
    and have delicious meals at our restaurant to celebrate Christmas and New Year.'
  tags:
    textbook: 第五冊（九上）第2次段考範圍
    labeled_by: ai
