- id: doc_113_新北_中平_英語_g9s1e2_s2_39
  section: 2
  number: 39
  type: single
  page: 7
  stem: 39. What would be a good title for this reading?
  options:
  - label: A
    content: 'Copenhagen: the Cleanest City in Europe.'
  - label: B
    content: Denmark’s Transportation Problem.
  - label: C
    content: Copenhagen’s Goal to Become Carbon Neutral.
  - label: D
    content: The Best City in Demmark.
  group_stem: '(C)


    By 2025, Copenhagen, Denmark wants to be carbon neutral. This means it will stop
    adding extra CO2 into the air.

    How do they plan to do this? To start, the city is doing things like changing
    in its old buses for new electric ones. Today, just half of their buses are electric,
    but in five years, all of them should be. Since 27% of people there use public
    transportation, this will help a lot.

    Bikes are another important part of Copenhagen''s plan. The government has even
    built special roads for them. It is the best place to bike in the world right
    now. Three out of every five people in the city bike to work or school every day.
    More people there actually use bikes rather cars or public transportation.

    There is one thing that has been difficult for Copenhagen. While only 25% of people
    use cars in the city, some people still need them. So the government has been
    helping these people buy electric cars. They are also spending a lot of money
    on clean energy that releases less or no CO2 to power these cars. Even with that,
    however, only 20% of cars in Copenhagen are electric.

    Still, if Copenhagen meets all of its goals, it will be the first major city to
    be carbon neutral. For the health of our planet, let''s hope it can.


    electric 電動的 carbon neutral 碳中和 public transportation 大眾運輸 release 釋放'
