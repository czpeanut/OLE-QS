    content: 棲地破壞
  - label: B
    content: 環境汙染
  - label: C
    content: 過度捕捉
  - label: D
    content: 外來種引入
  group_stem: "※ ※金門國家公園是首座以維護歷史文化資產、軍事戰役紀念為主軸，並兼具自然資源保育功能的國家公園。國際自然保護聯盟(IUCN)為了維護生物多樣性，維持\
    \ 環境的穩定，會評估生物的滅絕風險。圖為 IUCN 評估物種滅絕風險的簡略流程。\n   歐亞水獺（NT）、金龜（EN）及大鱗梅氏鯿（NE）為金門3 大瀕危保育物種，歐亞水獺分佈橫跨亞洲、非洲及歐洲，但已在列支敦斯登、荷蘭、瑞士、以及臺灣本島滅絕，目前金門仍有小族群。其數量下降是因殺蟲劑及多氯聯苯等有毒物質累積、失去棲息地及被獵殺。\n\
    \   大鱗梅氏鯿原本分布在台灣西部河川，但在台灣本島已絕跡，僅剩少量存活在金門水域，為初級淡水魚，喜棲息於平原河川中、下游的潭區或營養豐富的湖沼水域屬雜食性，以浮游動物、植物及小型無脊椎動物等為食。試回答\
    \ 47-50 題"
