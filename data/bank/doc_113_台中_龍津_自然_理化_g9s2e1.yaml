  stem: '（ ）高美溼地每年秋冬之際都會有大批的候鳥抵達，為此地平添無數的生趣。日治時期，日人除了設立學校也開闢高美海水浴場，民國56年增建燈塔，使高美海水浴場的遊客熱潮，達到巔峰。

