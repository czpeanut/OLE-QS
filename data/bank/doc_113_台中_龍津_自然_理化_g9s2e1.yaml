  stem: （ ）有關甲文內容，下列敘述何者正確？（原卷有誤，已修正）
  options:
  - label: A
    content: 「遺其雙鶴」乃某人表達與支公癖好相同，以討好支公
  - label: B
    content: 「鎩其翮」因支公擔心鶴鳥會傷害他人，而摧殘其羽翮
  - label: C
    content: 「如有懊喪意」描述支公見鶴鳥垂頭喪氣，而心生懊悔
  - label: D
    content: 「何肯為人作耳目玩物？」表示支公終能理解鶴鳥天性。
  group_stem: '6.請閱讀甲、乙二文，回答下列問題。

    （甲）

    支公好鶴，住剡東岇山，有人遺其雙鶴。不久鶴翅長欲飛，支憐惜之，乃鎩其翮。鶴高舉不能復飛，乃反顧翅，垂頭，視之如有懊喪意。支公曰：「既有凌霄之姿，何肯為人作耳目玩物？」養令翮成，置使飛去。

    （改寫自世說新語 言語）

    註：①支公：東晉高僧，字道林，世稱支公。

    ②遺：音ㄨㄟˋ，贈送。

    ③翮：音ㄍㄜˊ，鳥類羽毛中的硬梗。

    （乙）

    齊桓公喜歡穿紫色衣服，所以整個國都的人也都流行穿紫色衣服。當時，五匹白色生絹換不到一匹紫色的絹布。齊桓公對此十分擔憂，對管仲說：「我喜歡穿紫色衣服，因此紫色布料變得很貴，整個都城的百姓喜歡穿紫色衣服的風氣不消除，我該怎麼辦呢？」管仲說：「您想制止這種風氣，為何不試著不穿紫色衣服呢？然後您可以跟身邊的侍從說：『我非常討厭紫色衣服的氣味。』」齊桓公說：「好。」

    後來正好有穿紫衣的侍從來進見，齊桓公就說：「退後點！我厭惡紫色衣服的氣味。」從這天開始，侍衛近臣就沒人再穿紫色衣服，到第二天，都城中也沒人再穿紫色衣服，第三天，整個齊國境內都沒人穿紫色衣服了。

    （改寫自韓非子 外儲說左上）'
