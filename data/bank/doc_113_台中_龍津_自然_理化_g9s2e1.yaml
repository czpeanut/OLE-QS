- id: doc_113_台中_龍津_自然_理化_g9s2e1_s2_36
  section: 2
  number: 36
  type: single
  page: 4
  stem: （ ）根據文中資訊，下列敘述何者正確？
  options:
  - label: A
    content: 「金門三寶」是指貢糖、高粱酒與風獅爺
  - label: B
    content: 鄭成功在金門砍林造艦，並派人設置風獅爺以樹立軍威
  - label: C
    content: 近年來隨著兩岸情勢轉變，金門已由戰地轉為旅遊勝地
  - label: D
    content: 「小三通」指臺灣、金門、馬祖三島與廈門可直飛通航。
  group_stem: '5.探索金門：以下為金門島的介紹，請仔細閱讀後，回答下列問題。

    金門古時稱為浯洲，又名浯島。明代初年因其位置內捍漳、廈，外制臺、澎，有「固若金湯、雄鎮海門」之勢，故改名為「金門」。其總面積約一百五十平方公里，人口約十四萬人。1949年國民政府播遷來臺，金門成為保衛臺、澎的前線，駐軍最多曾達十多萬人。此後歷經1949年古寧頭大捷、1958年八二三炮戰等大小戰役，使金門發展出獨特的戰地風貌。近年來隨著兩岸情勢的轉變，昔日戒備森嚴的金門，憑藉特殊的歷史與人文景觀，已搖身一變，成為悠閒從容的旅遊勝地。


    何謂小三通？

    小三通是指小範圍的通郵、通商、通航。目前有金門、馬祖、澎湖與中國大陸福建地區，實行兩岸小三通。


    臺灣←→金門的交通方式

    臺北、臺中、嘉義、臺南、高雄、澎湖均設有航空站，航程約40～55分鐘。3～5月常起濃霧，7～9月颱風季節，航班有時會因而延後或停飛。


    遊玩兩岸小三通

    金門與福建省的廈門、泉州藉由小三通的船運接駁，便可輕鬆遊玩兩岸。

    ◎金門 水頭碼頭←→廈門 五通碼頭，航程約30分鐘。

    ◎金門 水頭碼頭←→泉州 石井碼頭，航程約70分鐘。


    金門守護神——風獅爺

    在唐朝時，金門是個草木茂盛的島嶼，隨著元朝開始伐木製鹽、明代倭寇焚林、鄭成功砍木造艦等緣故，林木逐漸消失殆盡，加上強勁的東北季風肆虐，導致整座島嶼飛沙走石。因此先民從泉州、漳州引入石獅避邪的信仰，在聚落或風大之地設置風獅爺，希望能夠防風鎮煞，後逐漸形成當地的特殊信仰文化。

    目前金門有一百多尊的風獅爺，通常安置於村落外緣，或嵌於民宅牆面、屋頂上方。其造型分為直立、蹲踞兩種，立姿者的四肢在比例上顯得細小，高度則在三十至三百多公分不等。雖然刻工細緻不一，但風獅爺外觀大多是圓眼闊鼻，張嘴露齒，在表情及動作上相當豐富，有的露齒含笑，扭頭轉身；有的咧嘴獰獰，仰天咆哮。這些姿態迥異的風獅爺，一直是地方的重要信仰、金門的守護神，迄今更搖身一變成為觀光大使，在藝品店裡不難發現精緻討喜的風獅爺產品，不僅帶來商機，也讓金門這項極富特色的文化，廣為流傳。


    交通建設：金門大橋是連接金門本島金寧鄉與烈嶼鄉（小金門）的跨海大橋。全長5.4公里，其中跨海橋長4.8公里，是全國最長的跨海大橋。

    戰地史蹟：兩岸對峙時期，全島興建許多軍事設施，因此留下許多珍貴史蹟。遊人若想一睹戰地風情，可參觀以下景點：古寧頭戰史館、北山古洋樓、八二三戰史館、馬山觀測所、翟山坑道、莒光樓、擎天廳等。

    人文風采：金門位處福建南方廈門港灣外，其建築與人文景點多呈現閩南特色與僑鄉文化，如山后民俗文化村、瓊林古聚落、得月樓、水頭聚落、風獅爺文物坊、陳景蘭洋樓等，都是不可錯過的景點。

    當地特產：貢糖、高粱酒、鋼刀（以炮彈殼鑄成），合稱「金門三寶」。'
