  stem: 已知「軟骨發育不全症」其致病的等位基因是顯性的A，子代只要得到一個A，就會罹患此症狀。若基因型為AA 的小孩，通常會在出生後的一年內死亡。如果夫妻雙方其中有一個是「軟骨發育不全症」的患者，生出患病小孩的機會是百分之五十，生出健康小孩的機率也是百分五十。如果夫妻都有「軟骨發育不全症」，則生出患病小孩和健康小孩的比率為何？
