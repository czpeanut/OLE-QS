- id: doc_113_桃園_桃園_社會_歷史_g9s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 由資料一的內容來看，下列何者是此主張造成的影響？
  options:
  - label: A
    content: 中國青年學生不滿巴黎和會未按此原則處理山東問題，引爆五四運動
  - label: B
    content: 台灣林獻堂等發起台灣議會設置請願運動，親赴日本請願達十五次，終於成功
  - label: C
    content: 巴爾幹半島出現許多新興獨立國家，如希臘、塞爾維亞等
  - label: D
    content: 日本對台統治改採無方針主義，策略性安撫台人民族情緒
  group_stem: '※請閱讀下列兩則資料，回答相關問題：


    資料一：我們的希望與目的是巴黎和會召開的過程可以絕對公開，而其決議中絕不附帶任何祕密協商。……真正的世界和平應該可以期待。我們參戰的目的是為了人類更美好的生活，希望所有愛好和平的國家可以獲得更安全的保障，並且可以過他們喜愛的生活、決定自己的制度，使正義得以實現。


    資料二：下列為某條約的重要內容：

    1.德國的亞爾薩斯與洛林回歸法國。 2.萊因河東西岸五十公里德軍不能設防。3.德國負起全部戰爭責任，德皇威廉二世是頭號戰犯。4.德國必須以黃金賠償2,260億馬克，後來減為1,320億馬克。'
  tags:
    chapter:
      publisher: 翰林
      book: 九下
