  type: single
  page: 1
  stem: '老師引用一則新聞如下，在課堂上請四位同學發表意見。根據報導內容及我國現行法律判斷，下列哪一位同學的說法最正確？

    某公司負責人涉嫌以親友的公司掩護，進口違法加工食品卻拿合格產品送驗，藉此取信其他廠商⋯⋯，檢察官依詐欺、洗錢等罪起訴涉案的相關6 人，並聲請法院將這些年的不法獲利沒收，另外也建請法院對涉案公司科以高額的金錢處罰。不知情而購買的受害廠商及消費者可依其損失向該公司請求賠償。'
