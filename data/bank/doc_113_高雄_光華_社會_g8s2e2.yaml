- id: doc_113_高雄_光華_社會_g8s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 下列哪些屬於「妨害電腦使用罪」？ （甲）盜用他人的帳號密碼（乙）盜用別人遊戲帳號中的虛擬寶物（丙）私自刪除他人電腦中的檔案（丁）製作專供犯罪的電腦程式
  options:
  - label: A
    content: 甲丙
  - label: B
    content: 甲丁
  - label: C
    content: 甲乙丙
  - label: D
    content: 甲乙丙丁。
  group_stem: '【題組一】請閱讀以下文章後，回答 7 ~ 8 題。

    ➢ 1999 年發生一起被稱為「電腦大屠殺」的電腦病毒散布案件，CIH 病毒癱瘓了全球近 600 萬臺電腦，造成嚴重損失。病毒程式作者來自臺灣，當時他製造是用來測試防毒軟體之用。這起案件影響甚大，我國卻面臨無法可罰的狀況，為此，我國立法院特別增訂了《刑法》「妨害電腦使用罪」以規範駭客的攻擊行為，避免同樣狀況再度發生。

    ➢ 警政署統計，臺灣每年約8 千件跟騷案件，若將私下隱忍未報警案件也納入統計，顯示跟蹤騷擾犯行已不是少數個案。2021 年底，跟蹤騷擾防制法三讀通過，新法將於公布後6
    個月生效。

    根據條文，「跟蹤騷擾」行為定義為：對特定人反覆或持續違反其意願，且與「性或性別」有關的八類行為，包括監視觀察、不當追求、尾隨接近、寄送物品、歧視貶抑、妨害名譽、通訊騷擾、冒用個資等行為，造成被害人心生畏怖，足以影響其日常生活或社會活動。為保護被害人安全，將跟蹤騷擾入罪化。'
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 公民
      code: 3-1
      title: 刑法的意義
      chapter: 第3章 刑法與刑罰
    textbook: 八下公民 3-1 刑法的意義
    labeled_by: ai
