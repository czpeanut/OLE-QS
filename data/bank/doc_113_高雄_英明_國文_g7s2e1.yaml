- id: doc_113_高雄_英明_國文_g7s2e1_s5_9
  section: 5
  number: 9
  type: single
  page: 4
  stem: 依據上文所述，下列何者說明正確？
  options:
  - label: A
    content: 如果真理是座寶庫，學問的方法便是門鎖
  - label: B
    content: 青年不要金子證明人品高潔不貪慕財利
  - label: C
    content: 學問方法是「金」，「金」比「指」重要
  - label: D
    content: 杜威認為科學方法比科學文明更為重要
  group_stem: '有個流傳的故事，説呂洞賓下山，欲尋覓不慕富貴而堪傳道的弟子。 遇見一青年，他以指點石成金與之，那青年不要；再以指點一大石成金與之，他仍不要；再點一山成金山，那青年仍無動於心。呂洞賓正以那人能不愛黃金，堪以傳道，乃問他要什麼？那人說：「我不要點成的金，我要你那點金的指頭。」

    這一個故事，常被人引來證明學問方法的重要。學問方法是「指」，依此方法所得之學問，是點出的金。「指」比金重要，只要「指」存，莫有金亦不要緊。所以杜威曾說過，縱然現在之科學文明全部毀滅，只要科學方法存在，即不難再造科學文明。

    呂洞賓的故事，不僅表示「指」比金重要，而且表示「指」先於金。呂洞賓要點石成金，必須先有那指頭。於是有不少人想，人必先有學問方法，才能治學。如不先知學問方法，其學問必不能成。因為宇宙一切真理，最初好似是封閉於黑暗中，人要求真理而獲得知識學問，必須把封閉的真理之寶藏打開。開門，要先經過門徑，門上有鎖，必須以一鑰匙來打開。學問方法是門徑，是鑰匙。不得門徑便永遠在牆外轉，莫有鑰匙，決不能開鎖。

    又有人比喻：學問方法有如一把刀，只要刀鋒利，任何東西都可切。如無此刀，對一切東西都只有囫圇吞棗，於一切事物，剖析不開，便不能見真理之寶藏了。（節錄自唐君毅先生〈學問之方法〉）'
