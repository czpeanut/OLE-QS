  group_stem: '相傳閩中龍蝦，大者重二十餘斤，鬚三尺餘，可作杖，海上人習見之。予在會城曾未一睹，後至漳，見極大者亦不過三斤而止。頭目實作龍形，見之敬畏，戒不敢食。後從張賡陽席間誤食之，味如蟹螯，鮮美逾常，遂不能復禁矣。有空其肉為燈者，貯火其中，電目血舌、朱鱗火鬣。攜之江南，環觀橋舌❶。」

