  section: 4
  number: 21
  type: single
  page: 3
  stem: 我們常會以某種效應或理論來說明某種現象。依據下列情境，何者的效應或理論說明是正確的？
  options:
  - label: A
    content: 現今韓流當道，很多年輕人刻意模仿韓星的言行舉止、衣著打扮，甚至不惜一擲千金，只為能買到韓星代言的產品，卻未曾思考過是否適合自己的風格，反而失去了自我。——（煮蛙效應）
  - label: B
    content: 某網友在網路上對店家散布不實指控，不明事理者也跟著留言謾罵。店家火速發出聲明要對這些人提告，嚇得網友們立即刪除留言，其他人再也不敢發表任何意見。——（羊群效應）
  - label: C
    content: 春節期間停收垃圾，有人貪圖方便就把整包垃圾丟棄在電線桿旁，因垃圾沒有即時被清運，其他人也群起效尤，以致垃圾越堆越多，造成環境髒亂，讓周遭居民不堪其擾。——（破窗效應）
  - label: D
    content: 老郭身為公司主管，卻安於現狀不思進取，未能察覺大環境的改變與時代脈動，一旦面臨公司重整、人事異動，恐怕是最先被裁汰的人選。——（寒蟬效應）
