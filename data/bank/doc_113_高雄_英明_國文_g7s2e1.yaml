- id: doc_113_高雄_英明_國文_g7s2e1_s5_17
  section: 5
  number: 17
  type: single
  page: 6
  stem: 「所謂『晚不晚』，乃是相對的，看你跟誰比。如果是跟莫札特和比爾•蓋茲比，可能是『太晚』了。」可推知莫札特和比爾•蓋茲在人生規劃上是怎樣的人？
  options:
  - label: A
    content: 較晚入行，以致大器晚成
  - label: B
    content: 養精蓄銳，等待最佳時機
  - label: C
    content: 及早立定志向，一展長才
  - label: D
    content: 中途轉換跑道，再創新局
  group_stem: '很多人抱怨，他們不是不想成為一個更傑出、更好的人，只是起步太晚，一切都已太遲。

    如果是從事短時間的競爭，像一百公尺短跑，起步太晚，可能真的會太遲。但如果是馬拉松長跑，起步比別人晚一點，並非勝負的關鍵。人生的旅途不知比馬拉松長幾萬倍，更應該沒有「太晚」的問題。

    想當一個優秀的醫師，要幾歲唸醫學院才不會太晚？史懷哲為了實現到非洲從事醫療傳道的理想，去唸醫學院時，已經三十歲。通過醫師資格考試時，已經三十八歲。但他對人類的貢獻，卻比那些在十五、六歲就跳級考上醫學院的「資優生」，多出許多。

    想當一個傑出的畫家，要幾歲開始學畫才不會太晚？擔任台糖工程師的劉其偉參觀工程師香洪的畫展，激發對繪畫的渴望。於是回家後就去買紙張和材料，提起畫筆，開始「學」畫畫，當時，他已三十八歲。興趣，再加上勤學，他的畫藝進展神速。第二年，作品就入選第五屆臺灣省美展。此後，不僅作品連連得獎，更成為臺灣最具代表性的畫家之一。他的成就，遠比許多從八歲就開始學畫的人，高出許多。

    所謂「晚不晚」，乃是相對的，看你跟誰比。如果是跟莫札特和比爾•蓋茲比，可能是「太晚」了，但如果是跟史懷哲、劉其偉比，卻一點也「不晚」。當然，你也不能因為覺得時間還很多，就一再拖延，而不去行動。'
