    content: 在窗戶上貼滿復古的窗花
  group_stem: '全球的大城市中，因建築的玻璃與鏡子等設計，經常會發生鳥類飛行時錯認這些是可飛行的路徑，導致撞上而造成傷亡的「窗殺」事件。依成因不同，「窗殺」可歸納為日間撞擊與夜間撞擊二種。

    日間撞擊的原因有二：一為玻璃具穿透性，因此玻璃帷幕或隔音墻等建物，若是位於鳥類穿越的路徑上，便會導致窗殺：二為玻璃的鏡像反射效應，如公廁設立的鏡子會讓鳥類無法分辨影像真偽，以為反射的遠景或山林影像可以飛過，因此一頭撞上而造成傷亡。

    夜間撞擊的原因則為「燈塔效應」。當夜間空氣溼度較高，或有霧氣、霧霾時，建築物的燈光便會吸引遷徙中的鳥類，導致鳥類迷航而誤撞建物。

    該如何避免窗殺？其實只要讓鳥能「看懂」眼前的玻璃是無法通過的阻隔物即可。因此，凡是改善玻璃材質，如霧面、雕花;或在玻璃上裝飾，如貼或畫上密集圖案或大面積圖案；或在玻璃外加上布置，如掛上垂墜物、植生牆、圍欄，都有防治效果。而最常見的錯誤防法，就是在面積不小的玻璃上只貼一張猛禽貼紙或鷹眼貼紙，認為鷹的形象可以嚇阻鳥兒不接近，但最後卻發現效果不彰，因為鳥類會判定環境中的威脅者，當牠發現貼在玻璃上的飛鷹不會動，便會判定沒有威脅，自然不當一回事，反而想從沒貼貼紙的玻璃處飛去，而導致窗殺。
    改寫自《泛科學・窗殺事件：鳥類的隱形殺手》'
