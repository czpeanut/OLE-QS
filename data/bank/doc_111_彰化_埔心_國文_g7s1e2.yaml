- id: doc_111_彰化_埔心_國文_g7s1e2_s5_7
  section: 5
  number: 7
  type: single
  page: 1
  stem: 子游問孔子孝道。孔子回答：「今之孝者，是謂能養。至於犬馬，皆能有養。不敬，何以別乎？」依照孔子的回答，真正盡孝應該如何實踐？
  options:
  - label: A
    content: 基於「愛屋及烏」對父母飼養的寵物也要照顧
  - label: B
    content: 子女須光耀門楣，讓父母受鄉里尊敬讚揚
  - label: C
    content: 照顧父母須用心，能讓父母在衣食方面無缺
  - label: D
    content: 為人子女要發自內心，恭敬地對待父母
  lesson_raw:
    title: 論語選
    basis: 引自論語選課文原句
  tags:
    textbook: 第一冊 論語選
