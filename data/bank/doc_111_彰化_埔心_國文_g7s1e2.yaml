  stem: 「不要為我哭，要為我笑，雖然我不能預知明天，但我知道我的人生不是悲劇！」這段話強調畫家的什麼性格？
  options:
  - label: A
    content: 強顏歡笑
  - label: B
    content: 啼笑皆非
  - label: C
    content: 樂觀進取
  - label: D
    content: 含悲忍淚
  group_stem: "曾經，他到一所中學演講，同學問他靠什麼克服生理與心理障礙？面對那群和他當年出事時年齡相同的男孩，他微笑起來，爽朗地送給他們底下這段話：\n\
    \  你不能左右天氣，但你可以改變心情。\n  你不能更換容貌，但你可以展現笑容。\n  你不能預知明天，但你可以利用今天。\n  你不能樣樣勝利，但你可以事事盡力。\n\
    \  看著這位沒有雙手、右腿與右眼的畫家，就在他們眼前活成一幅壯麗的風景，並且熱情地為他們簽名時，這些四肢健全的男孩，有一位哭了。但畫家只說：「如果我有手，一定會拍拍你的肩！真的，不要為我哭，要為我笑，雖然我不能預知明天，但我知道我的人生不是悲劇！……」\n\
    （陳幸蕙‧ 雖然我不能預知明天）"
  tags:
    textbook: 第一冊（七上）第2次段考範圍
    labeled_by: ai
