  section: 1
  number: 16
  type: single
  page: 2
  stem: 歐洲在 15 世紀下半開啟了以哥倫布、達伽馬為代表的地理大發現，帶領歐洲人開創了早期版本的全球化貿易，而早在 15 世紀上半，中國的鄭和下西洋也可以說是中國版的地理大發現，而且鄭和還擁有更好的航海技術。為何歐洲地理大發現能帶動歐洲人全球貿易的風潮，但中國卻後繼乏力？
  options:
  - label: A
    content: 大木：歐洲人想經由航海宣揚國威，故有持續力
  - label: B
    content: 小木：鄭和的初衷就是遠洋貿易，所以已完成目標不必繼續
  - label: C
    content: 大明：中國自以為天朝上國對海外貿易不積極
  - label: D
    content: 小明：歐洲人因海外傳教的動機而積極開展全球化
