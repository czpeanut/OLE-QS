- id: doc_111_桃園_中興_社會_歷史_g9s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 中南美洲的阿茲提克帝國、印加帝國，曾經是獨具特色的古文明，這些古文明呈現的文化風貌與生活型態與歐亞地區全然不同。然而現在我們只能從留存下來的文物、遺跡，概略認識這些古文明，主要是因為許多珍貴的美洲文化曾因「外力」入侵遭到破壞。上述的「外力」最有可能是指下列哪一群人？
  options:
  - label: A
    content: 西班牙人
  - label: B
    content: 荷蘭人
  - label: C
    content: 英國人
  - label: D
    content: 墨西哥人
