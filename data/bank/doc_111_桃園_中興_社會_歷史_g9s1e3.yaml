- id: doc_111_桃園_中興_社會_歷史_g9s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 達伽馬是葡萄牙著名的航海家，西元 1498 年他率領船隊沿著西非洲海岸，而後深入南大西洋並繞過好望角，最後抵達印度，成為第一位從歐洲遠航到印度的人，對日後葡萄牙的殖民擴張具有關鍵的影響。達伽馬展開探險之旅的主要目的為何？
  options:
  - label: A
    content: 尋找新農耕地，解決人口眾多問題
  - label: B
    content: 探索不為人知的古文明與少數族群
  - label: C
    content: 受到鄭和影響，希望前往中國參觀
  - label: D
    content: 直接取得亞洲的香料、絲綢等商品
