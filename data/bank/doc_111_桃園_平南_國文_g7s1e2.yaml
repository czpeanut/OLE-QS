- id: doc_111_桃園_平南_國文_g7s1e2_s5_3
  section: 5
  number: 3
  type: single
  page: 4
  stem: 非洲草原獅子每天睡覺長達十五至二十個小時的原因，不包括下列何者？
  options:
  - label: A
    content: 非洲氣溫高，睡覺可以減少水分消耗
  - label: B
    content: 動物眾多，食物豐足，不愁獵物來源
  - label: C
    content: 沒有動物敢打擾獅子，而能安心睡覺
  - label: D
    content: 養精蓄銳，才能應付激烈的獵捕活動。
  group_stem: "長頸鹿的睡眠時間是所有哺乳動物中最短，一天睡眠總時間低於兩小時，進入深度睡眠狀態只有幾分鐘。牠們通常站著打瞌睡，長長的脖子往下垂或掛在樹梢，就是牠們最奢侈的休息。因為從睡夢階段醒來、在地上站起來，長頸鹿要花一分鐘，這很危險，嚴重地減低牠的逃生能力。所以，當長頸鹿真想趴著睡時，牠的三條腿彎曲在肚子下，留另一條後腿伸展在一邊，長脖子呈弓形彎向後腿。這種奇特的睡姿既能縮小目標，又可在緊急情況下一躍而起。不只如此，長頸鹿還能睜著眼睛睡覺。\n\
    \  要在非洲活下來，目前數量超過十萬隻的長頸鹿，已練就了多項本事。\n  相較之下，獅子每天能睡十五至二十個小時，三分之二的時間都在睡覺，沒人能拿牠如何。這就是叢林法則。如果你無法成為叢林之王，就要是永不鬆懈的長頸鹿。很嚴酷，你只有三分鐘睡眠，完全沒有貪睡的權利，貪睡的下場，就是出局。在大自然，不只長頸鹿，草食性動物的平均睡眠時間都是比肉食性動物短。\n\
    \  職場與商場上，不也是如此。生命原本就是一個選擇，當獅子未必好，當長頸鹿未必差，只要一切恰如其分。想擁有權力、想主導棋局的獅子，能力就要相當，也要願意承擔。人生最可怕的是，錯置。所謂錯置，就是搞不清楚自己是誰或想成為什麼樣的人，沒有獅子的能力、地位，卻想過獅子的生活。\n\
    ──節錄自〈貪睡的長頸鹿〉"
  shared_asset: g5_3_5
  answer:
  - A
  answer_source: answer_key_vlm
