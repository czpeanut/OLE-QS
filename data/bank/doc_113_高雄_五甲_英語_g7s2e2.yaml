    content: What Are Abbreviations?
  group_stem: '(三)

    Words ! Words ! Words ! So many words ! We use them to communicate feelings and
    ideas. Words like “C.M.” and “Dr.” are both abbreviations. C.M. is an abbreviation
    for “centimeter,” and Dr. is short for “doctor.” In English, words like these
    are all around us. There are many types of abbreviations. Some abbreviations come
    from the first letter of a group words. For example, DVD is short for “digital
    video disc,” and the USA is short for “the United States of America.” Some abbreviations
    are from a part of the word. For example, Dec. is short for “December,” and Tue.
    is short for “Tuesday.” Abbreviations are a help to readers. With abbreviations,
    words are easy. What other abbreviations do you know?


    | word 字 | communicate feelings and ideas 溝通感情和想法 | abbreviation 縮寫 | type 類型
    |

    | :--- | :--- | :--- | :--- |

    | digital video disc 數位多功能光碟 | letter 字母 | group 群；組 | |'
