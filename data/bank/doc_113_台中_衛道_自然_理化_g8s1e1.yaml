- id: doc_113_台中_衛道_自然_理化_g8s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: '實驗室裡有四個沒有標示的玻璃瓶，瓶子中都裝著白色的固體。老師說它們分別為 $NaOH$、$CaCl_{2}$、$CaCO_{3}$ 和 $Na_{2}CO_{3}$，並要同學們用實驗方法確認這些藥品後，再貼上標籤。小榛、小媛、阿強和阿賢等四位同學將此四瓶分別編號為甲、乙、丙和丁，然後進行下列實驗操作，並將觀察到的結果記錄如下表：


    | 實驗操作 | 觀察到的結果:甲 | 觀察到的結果:乙 | 觀察到的結果:丙 | 觀察到的結果:丁 |

    | :---: | :---: | :---: | :---: | :---: |

    | 取 1 克藥品置於試管，加水 10 mL 後搖盪試管 | 不溶 | 溶解 | 溶解 | 溶解 |

    | 滴兩滴酚酞指示劑於水溶液中 | ---- | 紅色 | 紅色 | 無色 |

    | 取 1 克藥品置於試管中，分別加入稀鹽酸 | 產生氣泡 | 產生氣泡 | 沒有氣泡 | 沒有氣泡 |


    小榛、小媛、阿強和阿賢等四位同學分別寫出甲、乙、丙和丁四個玻璃瓶的標示如下表，根據實驗所觀察的結果，哪一位同學的標示正確？


    | | 甲 | 乙 | 丙 | 丁 |

    | :---: | :---: | :---: | :---: | :---: |

    | 小榛 | $CaCO_{3}$ | $Na_{2}CO_{3}$ | $NaOH$ | $CaCl_{2}$ |

    | 小媛 | $CaCO_{3}$ | $NaOH$ | $CaCl_{2}$ | $Na_{2}CO_{3}$ |

    | 阿強 | $Na_{2}CO_{3}$ | $CaCO_{3}$ | $CaCl_{2}$ | $NaOH$ |

    | 阿賢 | $Na_{2}CO_{3}$ | $CaCl_{2}$ | $NaOH$ | $CaCO_{3}$ |'
  options:
