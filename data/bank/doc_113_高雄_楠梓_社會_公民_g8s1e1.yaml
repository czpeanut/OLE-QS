- id: doc_113_高雄_楠梓_社會_公民_g8s1e1_s3_13
  section: 3
  number: 13
  type: single
  page: 2
  stem: 你覺得我國在哪一方面的作為，有朝向『社會自由程度』邁進？
  options:
  - label: A
    content: 開辦全民健保
  - label: B
    content: 實施義務教育
  - label: C
    content: 保障人民集會結社權
  - label: D
    content: 公平的升學制度。
  group_stem: '幸福國家   依下述文章   回答13-15 題

    聯合國大會承認「幸福作為全世界人類生活中的普遍目標和願望的重要性，以及幸福在公共政策目標中得到承認的重要性」。根據最新出爐的報告，在全球146 個國家和地區中，擁有充滿美食創意的首都、壯觀的北極光，還是聖誕老人家園的芬蘭，連續五年成為世界上最幸福的國家，其次是丹麥、冰島、瑞士和荷蘭。在亞洲國家部分的排名，我國排名第26
    名，領先第27 名的新加坡、第54 名的日本和第59 名的南韓，該項調查報告是根據「收入、經濟表現、社會支持、預期壽命、社會自由程度、政府腐敗程度」等幸福指數的衡量指標，對各國進行幸福程度的排名。那些最幸福國家的生活方式有著共同性：居民信任政府、生活自由、彼此互相支持、互相關心，這就是人們想要居住的地方。排名墊底的阿富汗飽受戰爭蹂躪，成為全球最不幸福的國家，其次是面臨經濟崩潰的黎巴嫩第145
    名和辛巴威第144 名'
