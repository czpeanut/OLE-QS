    由於新冠肺炎疫情持續，(甲)政府推出實聯制簡訊，讓民眾掃碼進出店家，協助未來疫情調查。然而，有法官撰文表示，警察在搜索票聲請書中，利用嫌犯上傳的實聯制簡訊來鎖定嫌犯行蹤，質疑政府實聯制簡訊並非僅用在防疫。(乙)民間團體也呼籲政府應說明清楚，並儘速修法。針對此狀況，(丙)行政院國家通訊傳播委員會澄清指出，(丁)警察是依據通訊保障及監察法規定取得簡訊內容，並非由「中央流行疫情指揮中心」提供。(戊)行政院法務部也提出三點聲明：首先，政府辦案時不會特別調閱實聯制資料。其次，政府辦案時，若有需要調取相關通訊紀錄，皆會依照通訊保障及監察法之規定向法院聲請，取得核准才會調閱。最後，政府將進一步蒐集疫情期間各國文獻資料來積極研議修法。(己)司法院也發表聲明表示，通訊保障及監察法的主管機關雖非司法院，但後續修法若需提供諮詢意見，司法院也會本於保障人權職責，提供見解。此外，在現行法制下，法院核准調取通訊紀錄時，對於實聯制資料內容核准與否，應由法官以保障人權的角度審視個案狀況，以進行判斷。基於司法審判獨立之精神，司法院不會表示意見及干預。

    劉世怡。實聯制簡訊遭誤解用於辦案法務部：研議修法保障個資。中央社。'
