- id: doc_113_新北_板橋_國文_g9s2e1_s4_31
  section: 4
  number: 31
  type: single
  page: 5
  stem: 作者引用「點秋江白鷺沙鷗」一句，主要為了襯托什麼？
  options:
  - label: A
    content: 秋風的颯爽
  - label: B
    content: 秋雲的淡然
  - label: C
    content: 秋水的明澈
  - label: D
    content: 秋山的巍峨
  group_stem: "秋天的風不帶一點修飾，是最純淨的風。那麼爽俐的輕輕掠過園林，對蕭蕭落葉不必有所眷顧──季節就是季節，代謝就是代謝，生死就是生死，悲歡就是悲歡。無需參與，不必流連。\
    \ \n  秋水和風一樣的明澈。「點秋江白鷺沙鷗」，就畫出了這份明澈。沒有什麼可憂心、可緊張、可執著。「傲殺人間萬戶侯，不識字煙波釣叟」。秋就是如此的一塵不染。\
    \ \n「閒雲野鶴」是秋的題目，只有秋日明淨的天宇間，那一抹白雲，當得起一個「閒」字。野鶴的美，澹如秋水，遠如秋山，無法捉摸的那麼一份飄瀟，當得起一個「逸」字。「閒」與「逸」，正是秋的本色。\
    \ \n  也有某些人，具有這份秋之美。也必須是這樣的人，才會有這樣的美。這樣的美來自內在，他擁有一切，卻並不想擁有任何東西。那是由極深的認知與感悟所形成的一種透徹與灑脫。\
    \ \n  秋是成熟的季節，是收穫的季節，是充實的季節，卻也是澹泊的季節。它飽經了春之蓬勃與夏之繁盛，不再以受讚美、被寵愛為榮。它把一切的讚美與寵愛都隔離在澹澹的秋光外，而是願做一個閒閒的、遠遠的、可望而不可及的，秋。(本文摘錄自羅蘭〈秋頌〉)"
