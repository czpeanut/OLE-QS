  group_stem: "我們常走在一條既定的軌道上，準時而又精確，以一定的步調來處理眼前的事，不會旁生枝節，不致手忙腳亂，這讓我們覺得安心；然而，偶發的事件卻足以打散所有的秩序，那時又該怎麼辦呢？\
    \ \n \n虹雲是個可愛的女孩。有一回聊天時，她跟我說：「有時候，縱然搭錯了車或下錯了地方，我都以為沒什麼關係，仍然願意花點兒時間，好奇地四處走走看看，再謀求補救，也覺得心中歡喜，而不像別人地懊喪，認為自己好倒楣，浪費了時間。」\
    \ \n \n這的確是很好的態度。生活中處處都有趣味，卻要有福之人方能享得。在悠閒裡，我們比較有心思去觀望和體會，尤其，當我們能更坦然地面對溢出常軌的不順，從而另有所得時，生命已呈顯了它的圓熟。\
    \ \n \n我們的人生常充滿了未知，沒有人能明確地指出，自己一生的遭遇必循著某一既定的軌道，分釐不爽。那麼偶爾的偏離，又何嘗不是冥冥之中自有安排呢？又何須驚慌怪異？甚或因著一切發展的無可預料，誰又能斷言那不會是一場大豐收？\
    \ (本文改寫自琹涵〈軌道之外〉)"
