- id: doc_113_新北_板橋_國文_g9s2e1_s3_4
  section: 3
  number: 4
  type: single
  page: 1
  stem: 看看以下四位同學對友誼的理解與用詞，哪個人的句子最通順合理、沒有語病？
  options:
  - label: A
    content: 彭德：所謂的「布衣之交」，肯定適合來形容我和國毅的交情，僅見過一次，但一見如故。
  - label: B
    content: 約兒：如果談到「忘年之交」，那就不能不提那位打從幼稚園就認識到現在的大仁哥啦!。
  - label: C
    content: 安妮亞：女神依晨和我之間的異姓姊妹情，才稱得上是人人羨慕的「八拜之交」呢!
  - label: D
    content: 洛伊德：我認識一個大我十多歲的網友，這樣的「總角之交」是你們所沒有的吧!
- id: doc_113_新北_板橋_國文_g9s2e1_s3_5
  section: 3
  number: 5
  type: single
  page: 1
  stem: 下列關於詞、曲的文體比較，哪個同學的回答有待修正？
  options:
  - label: A
    content: 止雲：詞和曲共同的別名是樂府。
  - label: B
    content: 欣翎：詞和曲的產生背景都受外來民族的影響。
  - label: C
    content: 云璇：詞和曲都需一韻到底，不可換韻。
  - label: D
    content: 偉謙：詞和曲都可配合音樂演唱，其中詞的單位量詞為闋；曲的單位量詞為首、支。
- id: doc_113_新北_板橋_國文_g9s2e1_s3_6
  section: 3
  number: 6
  type: single
  page: 1
  stem: 一年一度的國學常識競賽中，請問誰會拔得頭籌？
  options:
  - label: A
    content: 碇明：散曲又分為小令和散套，有曲文、科、白；雜劇只有曲文，而無科、白，僅可歌唱。
  - label: B
    content: 勝和：為了增加韻律之美、補足語氣，在曲牌規定的字數之內增字，稱為襯字。
  - label: C
    content: 子翔：曲牌標明曲子的音樂性，與內容無關，所以字體需略小偏右。
  - label: D
    content: 于郡：散套是用同宮調兩支以上的小令所組成，又稱為套數、套曲。
- id: doc_113_新北_板橋_國文_g9s2e1_s3_7
  section: 3
  number: 7
  type: single
  page: 1
  stem: 下列關於第二課 <曲選>的文意理解，何者正確？
  options:
  - label: A
    content: 〈天淨沙 秋思〉呈現的淒涼漂泊氛圍，也傳達出當時動盪的戰亂時局、人民流離失所的情景。
  - label: B
    content: 「小橋、流水、人家」從反面襯托出遊子無法回家的惆悵，更添悲痛心情。
  - label: C
    content: 「黃蘆岸白蘋渡口，綠楊堤紅蓼灘頭。」此句描摹植物的鮮明色彩，寫盡春日水邊風光之美。
  - label: D
    content: 〈沉醉東風 漁父詞〉傳達出白樸希冀成為萬戶侯，也不願淪落為不識字漁父的心境。
- id: doc_113_新北_板橋_國文_g9s2e1_s3_8
  section: 3
  number: 8
  type: single
  page: 2
  stem: 修辭競賽中，哪一小隊會在第一關落敗，喪失晉級資格，打道回府？
  options:
  - label: A
    content: 頑皮隊：「鐵板沙連到七鯤，鯤身激浪海天昏」→頂真修辭。
  - label: B
    content: 菁英隊：「東邊日出西邊雨，道是無晴卻有晴」→雙關修辭。
  - label: C
    content: 對不隊：「傲殺人間萬戶侯，不識字煙波釣叟」→倒反、借代、映襯修辭。
  - label: D
    content: 陸戰隊：「原本颳一陣停一陣的風如今呼嘯不停」→聽覺修辭。
- id: doc_113_新北_板橋_國文_g9s2e1_s3_9
  section: 3
  number: 9
  type: single
  page: 2
  stem: 關於<二十年後>的文意理解，何者正確？
  options:
  - label: A
    content: 作者在小說中安排許多伏筆暗示鮑伯是通緝犯，像是鮑伯身上的鑽石領帶夾，可看出他擁有不尋常的財富。
  - label: B
    content: 本文符合小說的基本結構，以反諷手法形塑出立體的人物形象。
  - label: C
    content: 吉米身為正直不阿的警察，因「情」與「法」不能兩全，最後選擇自行逮捕好友鮑伯。
  - label: D
    content: 吉米與鮑伯交談許久，是為了讓他放鬆戒備，從中套出對方犯案的證據。
- id: doc_113_新北_板橋_國文_g9s2e1_s3_10
  section: 3
  number: 10
  type: single
  page: 2
  stem: 〈天淨沙 秋思〉描寫遊子漂泊異鄉的心境，下列詩句，何者不是描寫遊子的心情？
  options:
  - label: A
    content: 長夜縫羅衣，思君此何極?
  - label: B
    content: 憑添兩行淚，寄向故園流。
  - label: C
    content: 逢人漸覺鄉音異，卻恨鶯聲似故山。
  - label: D
    content: 胡馬依北風，越鳥巢南枝。
- id: doc_113_新北_板橋_國文_g9s2e1_s3_11
  section: 3
  number: 11
  type: single
  page: 2
  stem: 以下是同學抄錄的〈聊齋志異選—種梨〉課堂筆記，請問誰的筆記有誤？
  options:
  - label: A
    content: IU：《聊齋志異》是一部清代文言短篇小說集。
  - label: B
    content: 寶劍：「聊齋」是作者蒲松齡書齋名。
  - label: C
    content: 宣美：作者時而在文末模仿史傳體例，化身為「太史公」發表自己的觀點。
  - label: D
    content: 恩地：《聊齋志異》文字精鍊，暗諷政治與社會不公，寄託諷諭警世之意。
- id: doc_113_新北_板橋_國文_g9s2e1_s3_12
  section: 3
  number: 12
  type: single
  page: 2
  stem: '余鄉唐太史濟武，數歲時，有表親某，相攜戲寺中。太史童年磊落，膽即最豪，見廡①中泥鬼，睜瑠璃眼，甚光而巨，愛之，陰②以指抉③取，懷之而歸。既抵家，某暴病不語。移時忽起，厲聲曰：「何故抉我睛！」譟叫不休。衆莫之知，太史始言所作。家人乃祝曰：「童子無知，戲傷尊目，行奉還也。」乃大言曰：「如此，我便當去。」言訖，仆地遂絕，良久而甦，問其所言，茫不自覺。乃送睛仍安鬼眶中。

    【注釋】：

    ①廡：廳堂兩側較矮的廂房。

    ②陰：暗中。

    ③抉：挖、挑出。（節選自蒲松齡 聊齋誌異－泥鬼）


    根據上文，泥鬼為什麼附身在太史的表親身上？'
  options:
  - label: A
    content: 太史偷拿玻璃珠，得罪泥鬼。
  - label: B
    content: 泥鬼怨氣深重，心懷不軌。
  - label: C
    content: 表親在廟中喧鬧，態度不敬。
  - label: D
    content: 前世因果報應，牽連至今世。
- id: doc_113_新北_板橋_國文_g9s2e1_s3_13
  section: 3
  number: 13
  type: single
  page: 2
  stem: 關於〈聊齋志異選—種梨〉的內容與寫作手法，下列敘述何者正確？
  options:
  - label: A
    content: 鄉人因車上的梨所剩不多，故不願施捨給道士。
  - label: B
    content: 道士會施法種梨，是想藉此賺取錢財。
  - label: C
    content: 本文藉由真實的歷史事件，闡明過於吝嗇必遭懲戒的下場。
  - label: D
    content: 鄉人最後才知道道士分送的是自己的貨品，但已無法追究。
- id: doc_113_新北_板橋_國文_g9s2e1_s3_14
  section: 3
  number: 14
  type: single
  page: 2
  stem: "起初我覺得西施柚太湯湯水水，不像文旦整顆吃完了還乾爽俐落。西施柚的甜度甚高，甜中隱而不顯的是酸；那酸味非常含蓄，似乎刻意矮化自己的存在，僅專注於修飾甜度，令甜不致於太武斷，太蠻橫。\n\
    \n        上文摘錄自焦桐〈西施柚〉，下列選項何者詮釋錯誤？"
  options:
  - label: A
    content: 西施柚較於文旦柚肉多汁。
  - label: B
    content: 西施柚的甜味甚強，甜中透露輕微的酸。
  - label: C
    content: 本文運用轉化修辭，描摹食用西施柚的味覺感受。
  - label: D
    content: 作者喜愛西施柚的原因是西施柚香氣甜度皆勝過文旦。
- id: doc_113_新北_板橋_國文_g9s2e1_s3_15
  section: 3
  number: 15
  type: single
  page: 3
  stem: 黑板上的成語例句，不慎被頑皮的值日生修改，請選出使用正確的字形？
  options:
  - label: A
    content: 聽信無「ㄐㄧ」之談的她，最終自食惡果─ 機。
  - label: B
    content: 邊「ㄈㄨˊ」不修的形象，是他面試失利的主因─ 服。
  - label: C
    content: 我終日提心「ㄉ一ㄠˋ」膽，害怕一切會東窗事發─ 掉。
  - label: D
    content: 出類拔「ㄘㄨㄟˋ」的表現，使他在這次演講比賽中獨占鰲頭─ 萃。
- id: doc_113_新北_板橋_國文_g9s2e1_s3_16
  section: 3
  number: 16
  type: single
  page: 3
  stem: 下列文句「  」中的成語，何者運用最恰當？
  options:
  - label: A
    content: 連續數月乾旱不雨，許多地方早已「青黃不接」，任何作物都無法生長。
  - label: B
    content: 一畦畦農田連成一幅「赤地千里」的景象，壯闊的稻浪在風中搖曳生姿。
  - label: C
    content: 這片果園枝繁葉茂，「離離蔚蔚」，令人期待豐收季節的到來。
  - label: D
    content: 辛勤耕種多年的田園如今卻「枝葉扶疏」，農人不禁悲從中來。
- id: doc_113_新北_板橋_國文_g9s2e1_s3_17
  section: 3
  number: 17
