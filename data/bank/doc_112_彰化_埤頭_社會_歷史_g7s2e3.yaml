  section: 1
  number: 15
  type: single
  page: 1
  stem: 當□首次以中華民國總統身份訪問新加坡的時候，由於兩國沒有正式外交關係，加上新加坡政府不願得罪中共，因而當地媒體以「來自臺灣的總統」稱之。當被問到媒體的稱呼時，□說出「不滿意但可接受」的名句，從此成了臺灣突破國際禁錮的敲磚石。當年兩岸依舊在國際場合爭唱哨門、互挖邦交國牆角，中華民國正面臨大陸流失邦交國的危機。□倡導務實靈活的外交策略，不拘泥於「漢賊不兩立」的傳統外交思維，有段時間確實讓中共疲於奔命。只不過，國際社會實在難以突破中共劃下的「一中原則」框架，或許也是□始至終的痛吧！請問□最適合填上何人？
  options:
  - label: A
    content: 蔣經國
  - label: B
    content: 李登輝
  - label: C
    content: 陳水扁
  - label: D
    content: 馬英九。
