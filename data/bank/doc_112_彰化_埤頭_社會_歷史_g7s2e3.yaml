  section: 1
  number: 12
  type: single
  page: 1
  stem: 民國68年後，中共對我國採取「以和平統一步驟」的統戰策略，提出了「三通」與「一國兩制」，而我國則強調「三民主義統一中國」，並提出「三不政策」的原則。中銓和同學針對這段歷史事進行了一番討論，下列何人的說法是「正確」的？
  options:
  - label: A
    content: 中銓：「三不」是指不談判、不妥協、不理會
  - label: B
    content: 秉和：這時的兩岸關係已發展到民間交流時期
  - label: C
    content: 苑瑜：「三通」是指通郵、通商、通信
  - label: D
    content: 翊珽：「一國」指的是中華民國。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
