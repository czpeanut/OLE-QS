  stem: 逸臣對朋友抱怨：「不是不愛，是找不到愛。」句中的「不是不愛」是「要」愛的意思，整句話是肯定的語氣，其意為「是要愛，只是找不到愛的對象。」下列各句都有兩個否定的字句，何者解釋不正確？
