  group_stem: '《樂善錄》

    富商有段姓者，養一鸚鵡，甚慧，能誦龐客詩及梵本心經。段剪其兩翅，閉以雕籠，加意豢養。熙寧六年，段忽繫獄。及歸，問鸚鵡曰：「我半年在獄，極用愁苦；汝在家，餵飼以時否？」鸚鵡曰：「君半年在獄，早已不堪；鸚哥幾時籠閉，豈亦不生怨恨乎？」段大感悟，即日放之。'
