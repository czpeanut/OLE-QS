  section: 1
  number: 3
  type: single
  page: 1
  stem: '歐洲兩大河川藉由某一運河相互連結，以提升河川的航運價值。甲港口為該運河上重要的轉運樞紐，表(一)為2016 年兩條河川流域內各國與甲港口之間的船舶貨運量。由表中資訊判斷，可推論出其中一條河川的貨運量較大，該河川應是注入哪個海域？


    表(一)

    | 國家 | 船舶貨運量（公噸） |

    | :--- | :--- |

    | 荷蘭 | 100,488 |

    | 德國 | 68,520 |

    | 比利時 | 50,813 |

    | 奧地利 | 34,498 |

    | 匈牙利 | 8,891 |

    | 法國 | 5,552 |

    | 斯洛伐克 | 4,094 |

    | 羅馬尼亞 | 854 |

    | 總計 | 273,710 |

    註：船舶貨運量為各國以船舶運抵甲港口及從甲港口運至各國的貨運量總和。'
