- id: doc_113_高雄_五甲_國文_g8s2e3_s4_5
  section: 4
  number: 5
  type: single
  page: 5
  stem: 關於方文山的閱讀經驗，下列敘述正確的是
  options:
  - label: A
    content: 龍應台以筆代劍，解析了文字之美
  - label: B
    content: 蔣勳以現代語言，直指社會的弊病
  - label: C
    content: 認為應該廣泛涉獵不同視角，形成一家之言
  - label: D
    content: 可將我們認知的世界提升為「被有意識灌輸的世界」。
  group_stem: '（三）

    對於方文山（註1）來說，閱讀是一個「凝聚觀點」的過程，他經常是透過閱讀不同的書，獲取不同的視角，再消化成自己的觀點，「如果我們不廣泛涉獵，我們所認知的世界，就只是被有意識灌輸的世界，沒有機會從另一個角度看問題。」

    對方文山人生帶來影響的書中，其一便是龍應台的《野火集》。龍應台直指一九八○年代臺灣社會的種種問題和弊病，行文相當犀利，像是把瘡疤撕開，讓人直接看到傷口。「當時的我看了這本書，感到很震驚，因為居然有人這麼看問題。」方文山回憶說：「原來寫文章不一定只能風花雪月，也能夠以筆代劍、氣勢磅礴。」

    另外，方文山也是蔣勳的書迷，蔣勳以現代的語言解析古典藝術之美，寫成如《美的沉思》一類的作品，讓他更深入了解中國文化的精髓。

    「做為一名創作者，有自己的觀點很重要。」方文山指出，龍應台針砭時事有她的觀點，蔣勳對美學的解釋也成一家之言，「他們都看到別人沒看到的東西，這就是個人特色。」

    只是，身處網路時代，大量的網路資訊是否足以滿足人們擁有多方視野，形成「觀點」的需求？方文山不否認，就資訊的即時性來說，網路遠勝於紙本書，說：「但是書也有它的優勢，當手指跟書頁接觸的時刻，內心就開始安靜下來。」

    （〈讀得愈多，你的夢想愈開闊〉，天下文化團隊採訪撰寫）

    （註1）方文山，台灣著名歌曲填詞人、作家、導演、編劇'
