  stem: 關於本文的主旨，下列說明何者正確？
  options:
  - label: A
    content: 想要使用火攻，只要準備好工具，其他的不需要多加考慮
  - label: B
    content: 運用任何計謀都要考慮資源如何配合因應，方能提高勝率
  - label: C
    content: 水攻會比用火攻來得更加有效，故應盡量使用水攻來應敵
  - label: D
    content: 一旦使用火攻都應該直衝殺敵，才能最有效發揮速度優勢
  group_stem: '（四）孫子曰：凡火攻有五：一日火人，二日火積，三日火輜①，四曰火庫，五日火隊。行火必有因②，煙火必素③具。發火有時，起火有日。時者，天之燥也。日者，月在箕、壁、翼、軫④也。凡此四宿者，風起之日也。

    凡火攻，必因五火之變而應之：火發於內，則早應之於外；火發而其兵靜者，待而勿攻，極其火力，可從而從之，不可從則止；火可發於外，無待於內，以時發之；火發上風，無攻下風；晝風久，夜風止。凡軍必知有五火之變，以數守之。故以火佐攻者明，以水佐攻者強。水可以絕，不可以奪。

    （節錄自孫子兵法火攻第十二）

    ①輜:輜重，跟隨作戰部隊行動，提供後勤支援的必要裝備與人員。②因：憑藉。③素：平日。④箕壁翼軫：星宿名。'
