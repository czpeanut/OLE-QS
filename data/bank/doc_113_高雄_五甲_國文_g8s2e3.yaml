  stem: 南方人因「日與水居」，所以「十五而能沒」；北方人因「生不識水」，所以「雖壯，見舟而畏之」，由此可見在學習上，下列何者影響甚鉅？
  options:
  - label: A
    content: 天賦所在，才華異稟成就後天技能
  - label: B
    content: 尋找益友，互相切磋才能共同成長
  - label: C
    content: 良師引導，適時教導選擇正確方向
  - label: D
    content: 環境影響，時時接觸得以熟能生巧。
  group_stem: '（二）南方多沒人①，日與水居也，七歲而能涉，十歲而能浮，十五而能沒矣。夫沒者豈苟然哉！必將有得於水之道者。日與水居，則十五而得其道；生不識水，則雖壯，見舟而畏之。

    故北方之勇者，問於沒人，而求其所以沒，以其言②試之河，未有不溺者也。故凡不學而務求道，皆北方之學沒者也。

    （蘇軾 北人學沒）

    註：①沒人：善潛水之人

    ②以其言：用言語說明'
