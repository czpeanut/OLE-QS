- id: doc_112_高雄_大樹_國文_g7s1e2_s3_7
  section: 3
  number: 7
  type: single
  page: 1
  stem: '閱讀素養題:   有「冰上花蝴蝶」、「滑冰皇后」美譽的美國 華裔運動員關穎珊，5 歲開始學習滑冰，歷經千辛萬苦終於在15 歲時登上世界冠軍寶座。為了每一次成功的表演，她不知道要跌倒幾次，但是她從來都不放棄，就算跌倒了，仍然咬緊牙關重新站起來，終於贏得眾人熱烈的掌聲。她的奮鬥故事給我們的啟示，用下列哪一選項來形容最貼切？'
  options:
  - label: A
    content: 譬如為山，未成一簣，止，吾止也
  - label: B
    content: 譬如平地，雖覆一簣，進，吾往也
  - label: C
    content: 人不知而不慍，不亦君子乎
  - label: D
    content: 學而不思則罔，思而不學則殆。
  tags:
    textbook: 七上 第四課 論語選(1)子游問孝(2)譬如為山(3)吾日三省吾身
