- id: doc_112_高雄_大樹_國文_g7s1e2_s4_9
  section: 4
  number: 9
  type: single
  page: 5
  stem: 根據本文，作者對年輕人向他詢問失敗而非成功的經驗表達肯定，其原因並非下列何者？
  options:
  - label: A
    content: 失敗能夠避免，但是成功經驗無法複製
  - label: B
    content: 知悉他人失敗經驗，可以避免重蹈覆轍
  - label: C
    content: 循著別人成功的路徑，輕而易舉不費力
  - label: D
    content: 成功經驗易使人有錯誤期待，因而自滿
  group_stem: '<5.> 從失敗中學習成長

    現代的年輕人越來越聰明，會問我失敗的經驗而不問成功的經驗，這是對的。失敗比成功更值得學習，因為成功無法複製，但是失敗可以避免。複製別人成功的路徑一點意義都沒有，因為天時、地利、人和缺一不可，但別人曾經失敗的經驗，卻可成為未來不犯同樣錯誤的借鏡。微軟的創辦人──比爾．蓋茲曾經說過：「成功是個爛老師，它引誘聰明人，自以為永遠不會失敗。」沒錯，成功的經驗會讓人自滿、驕傲，結果犯不該犯的錯。

    就學習的角度而言，人可以分三種。第一種聰明的人就是別人犯過的錯，引以為戒，不會再犯；第二種人，就是別人犯過的錯，自己還要繳一次學費，痛了才會學習到經驗；第三種人，也是最沒有學習能力的人，自己曾經犯過的錯，毫不自覺，一而再、再而三的犯同樣的錯。

    最好我們可以訓練自己成為第一種人，這樣在人生的道路上，我們就可以少走一些冤枉路，少付出一些慘痛的代價。但是可惜大多數的人都是屬於第二種人，總是要跌倒才記得痛的滋味。

    我年輕的時候，曾在盛怒下說了不該說的話，導致一位我非常依賴的工作夥伴提了辭呈，而我又太愛面子，拉不下臉跟他承認我的錯誤，於是流失好的人才。這個失敗的經驗讓我學到，盛怒之下絕對不能做任何決定和舉動。

    我也曾在一場運動賽事轉播上看到相似的例子，感慨良多。二○○六年，代表法國隊力拚世足賽的隊長席丹，在與義大利隊爭取冠亞軍時，竟然在賽中用頭去衝撞對方的一位球員，導致被舉紅牌出場，讓法國隊喪失了冠軍的寶座。原因只是對手在場上說了一些激怒他的話，而席丹竟然就這樣中計發飆。

    原來我們最大的敵人不是別人，是我們自己。

    失敗是人生的必然，我沒有看過不會犯錯的人。可是千萬不能因為害怕失敗，就少做少錯，或是什麼也不做，至少要嘗試過。做不了第一種聰明的人，至少要做第二種從失敗中學習的人。我曾經問過以前一位外國主管：「你為什麼總可以找到對的人放到對的位置？」他回答我，那是因為他失敗過很多次。張愛玲說：「成名要趁早」，我卻常說：「失敗要趁早」，這樣至少還有足夠的時間可以站起來。

    （節選自〈失敗是人生的必然，但至少要從失敗中學習成長〉）'
