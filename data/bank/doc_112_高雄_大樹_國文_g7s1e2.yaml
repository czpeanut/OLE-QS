  group_stem: "<3.>\n  在我居住的巷子裡，有一樁使人敬佩又感動的事。一位男士每天清晨扶著他的老母散步，十幾年來從未間斷。我在十七年前移居此巷時，就發現此事。現在那位男士已漸漸由青年進入中年，但仍然風雨無阻每天陪老母作晨間散步。\n\
    \  前人講兒女盡孝，不貴在錦衣玉食，而貴在有誠敬之意。誠心事親，方是盡孝，單是奉養，算不得什麼。\n  任何事都貴在有恆心，孝順父母尤其如此。若只是偶爾感念，忽發孝思，縱使間關萬里，專程省親，也不足稱道。像這位男士侍母散步，十幾年不間斷，就真難能可貴了。\n\
    \  我們古人強調「孝，德之本也」、「百行孝為先」。凡是有孝心的人，消極的不做壞事，積極的能為國家盡忠，也就是使社會國家祥和安定的中堅分子。當此母親節即將來臨，我特地舉出巷口所見感人之事，並為這兩位母子祝福。\n\
    （中央日報副刊一對母子）\n註：間關：音ㄐㄧㄢ ㄍㄨㄢ，行盡艱難的遠路。"
