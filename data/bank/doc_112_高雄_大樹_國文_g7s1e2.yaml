  stem: 根據本文所述，古代行拜師禮的過程繁複，主要是希望透過禮儀傳達什麼訊息？
  options:
  - label: A
    content: 禮多人不怪，展現禮數周到的風範
  - label: B
    content: 建立師生關係，表現對師長的敬重
  - label: C
    content: 古禮其來有自，後人僅須依循往例
  - label: D
    content: 拜師禮越繁複，對師長的敬意越高
  group_stem: '<4.> 古人的超講究拜師禮

    古人注重品行修養，學師德，謝師恩。傳統的師徒關係僅次於父子關係，例如古訓中便有「一日為師，終身為父」的說法，甚至有的行業，一入師門全由師父管教，父母無權干預。建立如此重大的關係，自然得需要隆重的風俗禮儀加以確認和保護。《禮記．內則》就規定：兒童十歲時出門拜師求學，都要行拜師禮。它的過程繁複，可見古人對拜師的重視，其大致分為這幾個步驟：

    一、正衣冠

    據《禮記》記載：「禮義之始，在於正容體、齊顏色、順辭令。」古人認為：「先正衣冠，後明事理。」入學時，學生要一一站立，由教師依次幫學生整理衣冠。

    二、盥洗禮

    學生在教師的帶領下，行盥（ㄍㄨㄢˋ）洗禮，要按教師的要求，將手放到水盆中洗淨。其寓意為淨手淨心，去雜存菁，希望能在日後的學習中專心致志。

    三、叩首禮

    學生舉行拜師禮前，要先跪拜至聖先師孔子，其次是拜教師，並獻上投師帖子。這是對先師和教師的虔誠及敬重，並祝願自己學業有成。

    四、贈送六禮束脩①

    行完叩首禮後，學生需要贈禮。束脩在春秋以前就存在了，孔夫子曰：「自行束脩以上者，吾未嘗無誨焉。」意為弟子拿著肉乾作為見面禮來拜見，自己是一定會傳授知識的。後來逐漸演變為「六禮束脩」，分別為：

    1.芹菜：寓意勤奮好學，業精於勤。  2.紅豆：寓意紅運高照。

    3.蓮子：蓮子心苦，寓意苦心教育。  4.紅棗：寓意早早高中。

    5.乾肉條：即束脩，表達弟子心意。  6.桂圓：寓意功德圓滿。

    五、吉時獻茶，師長訓示

    除了敬獻禮物之外，學生還要選擇吉時，向教師跪拜獻茶。教師會在這時宣布門規及賜名，告誡道德規範，並表達自身對學生的期許等。

    傳統文化中非常重要的「拜師禮」，乃是學生懷著尊重與敬意，透過一個個環節踏入學堂，希望自教師的言行舉止中感受其品格，學會為人處世的方法。

    （整理自〈正衣冠、盥洗禮、叩首禮……古人的拜師禮超講究〉每日頭條網站）

    【注釋】①束脩：古人以肉脯十條紮成一束，作為拜見教師的禮物。'
