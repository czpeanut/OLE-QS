questions:
- id: doc_113_高雄_獅甲_國文_g9s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 下列各選項「 」的相似字，何者讀音相同？
  options:
  - label: A
    content: 披沙「揀」金／規「諫」
  - label: B
    content: 踉「蹌」／「嗆」鼻
  - label: C
    content: 「挽」回／分「娩」
  - label: D
    content: 「沆」瀣一氣／悶不「吭」聲。
- id: doc_113_高雄_獅甲_國文_g9s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列「 」中的同音字寫成國字後，何組字形相同？
  options:
  - label: A
    content: 紛紛出「ㄌㄨㄥˊ」／振「ㄌㄨㄥˊ」發聵
  - label: B
    content: 貪得無「ㄧㄢˋ」／食不下「ㄧㄢˋ」
  - label: C
    content: 「ㄔㄢˊ」言／嘴「ㄔㄢˊ」
  - label: D
    content: 化險為「一ˊ」 ／履險如「一ˊ」。
- id: doc_113_高雄_獅甲_國文_g9s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 下列選項的成語造句，哪一個的用法是正確的?
  options:
  - label: A
    content: 這件物品對我來說只不過是「鳳毛麟角」，太便宜了
  - label: B
    content: 當一個表裡如一的人，是一件「吉光片羽」的事
  - label: C
    content: 她的荒唐行為，每個聽說過的人都「瞠目結舌」
  - label: D
    content: 這棟建築物外觀「冠冕堂皇」，簡直和宮殿沒兩樣了。
- id: doc_113_高雄_獅甲_國文_g9s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 下列選項「 」中的字，何者詞性兩兩相同？
  options:
  - label: A
    content: 修「葺」／通「緝」
  - label: B
    content: 「懺」悔／一語成「讖」
  - label: C
    content: 槍「膛」／「瞠」乎其後
  - label: D
    content: 潮「汛」／「迅」雷不及掩耳。
- id: doc_113_高雄_獅甲_國文_g9s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 下列「 」中的字，何組意思相同？
  options:
  - label: A
    content: 「蓋」竹柏影也／「蓋」一癩蝦蟆也
  - label: B
    content: 閉「塞」／搪「塞」
  - label: C
    content: 連「載」／「載」貨
  - label: D
    content: 「縹」碧／「縹」緲。
- id: doc_113_高雄_獅甲_國文_g9s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 下列文句，何者沒有語病？
  options:
  - label: A
    content: 面對各界的質疑聲浪潮，市長承諾絕不跳票，該項建設一定會如期限完成
  - label: B
    content: 每天清晨，市場裡一片萬籟俱寂，讓人感受到城市熱鬧的生命力
  - label: C
    content: 「跨年演唱會」眾星雲集，為了目睹巨星丰采，現場湧進入十萬許人
  - label: D
    content: 即使外國人對臭豆腐敬而遠之，但它肯定是台灣的庶民美食之一。
- id: doc_113_高雄_獅甲_國文_g9s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 下列文句，何者用字完全正確？
  options:
  - label: A
    content: 這棟百年洋樓還是可看出精緻的彩繪與雋刻，昔日繁華可見一般
  - label: B
    content: 祖先們駢手胝足，夙夜悱懈的開墾這片土地，才有了現在美好家園
  - label: C
    content: 這次拍賣釋出史上絕無僅有的超值優惠，吸引上萬民眾趨之若鶩前往搶購
  - label: D
    content: 他總對旁人抱著一幅指高氣昂的態度，眾人老早就看不慣了。
- id: doc_113_高雄_獅甲_國文_g9s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 下列字音，何者完全正確？
  options:
  - label: A
    content: 蘇軾仕途坎坷（ㄎㄜ），縱使被貶到儋（ㄉㄢ）州，卻仍能從容引吭（ㄎㄤˋ）高歌，瀟灑自得
  - label: B
    content: 捧起一樽（ㄗㄨㄣ）摻(ㄔㄢ)入各種不同液體的飲料，還狂噬（ㄕˋ）暴食，是我紓壓的方式
  - label: C
    content: 面對黃藥師百般阻撓（ㄖㄠˊ），郭靖愕（ㄜˋ）然蹙眉。幸好黃蓉慧黠（ㄐㄧˊ），成功解決難題
  - label: D
    content: 成吉思汗膂（ㄌㄩˇ）力過人，書生不禁一怔（ㄌㄥˋ），半晌（ㄒㄧㄤˋ）說不出話來。
- id: doc_113_高雄_獅甲_國文_g9s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 戶外教學去參觀電影片廠，看到幾個古代的街坊場景，戶戶門旁皆貼著對聯，其中第一家店貼著「薛家新制巧，蔡氏舊名高」，第二家貼的是「是留侯橋邊拾起，看王令天上歸來」，第三家貼的是「是池沼中物，作濠濮上觀」。布魯諾不甚明白，請問你可以告訴他這幾家店分別賣的是什麼嗎?
  options:
  - label: A
    content: 書／魚／菜
  - label: B
    content: 紙／鞋／魚
  - label: C
    content: 米／魚／書
  - label: D
    content: 鞋／鵝／菜。
- id: doc_113_高雄_獅甲_國文_g9s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 下列對聯，何者所對應的節日不正確？
  options:
  - label: A
    content: 美酒雄黃，正氣獨能消五毒；錦標奪紫，遺風猶自說三閭—端午節
  - label: B
    content: 天增歲月人增壽，春滿乾坤福滿門—春節
  - label: C
    content: 晴空一鏡懸明月，夜市千燈照碧雲—中元節
  - label: D
    content: 天上一輪滿，人間萬里明—中秋節。
- id: doc_113_高雄_獅甲_國文_g9s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 下列「行業聯語」的組合，錯誤的選項是?
  options:
  - label: A
    content: 夏鼎商彝傳流千古，秦磚漢瓦羅列一堂──古董店
  - label: B
    content: 公月旦評見聞悉備，執春秋筆褒貶無私──報社
  - label: C
    content: 入門盡是彈冠客，去後應無搔首人──理髮店
  - label: D
    content: 玉井秋香清泉可釀，洞庭春色生涯日佳──水果店。
- id: doc_113_高雄_獅甲_國文_g9s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 台灣廟宇是信仰的中心，同時也形成獨具特色的廟宇文化。下列三副對聯，依序對應那些廟宇? (甲)福降自天維守正；德能配地合稱神；(乙)陽世三間，積善作惡皆由你；古往今來，陰曹地府放過誰；(丙)氣被四時，與天地日月鬼神合其德；教垂萬世，同堯舜禹湯文武作之師
  options:
  - label: A
    content: 土地公廟/城隍廟/孔廟
  - label: B
    content: 天后宮/王爺廟/城隍廟
  - label: C
    content: 城隍廟/天后宮/孔廟
  - label: D
    content: 媽祖廟/觀音廟/土地公廟。
- id: doc_113_高雄_獅甲_國文_g9s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 關於蘇軾與其作品，下列敘述何者正確？
  options:
  - label: A
    content: 蘇軾散文、詩詞、書畫俱佳。其詞風屬於豪放派，風格豪邁，他擴大詞的內容和境界，與辛棄疾並稱「蘇辛」
  - label: B
    content: 蘇軾因烏臺詩案一度入獄。曾以「問汝平生功業，黃州惠州儋州。」調侃自己曾遠赴越南的經驗
  - label: C
    content: 在蘇軾給李端叔的一封信中，可見蘇軾貶謫在外，仍有許多親友遠道而來，陪伴他度過人生最黑暗的階段
  - label: D
    content: 蘇軾，字子由，因嗜吃東坡肉，故號東坡居士。和父洵、弟弟轍，同列於唐宋古文八大家。
- id: doc_113_高雄_獅甲_國文_g9s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 〈蘇東坡突圍〉一文中，作者指出蘇東坡「經歷了一次整體意義上的脫胎換骨」，「脫胎換骨」指的是什麼？
  options:
  - label: A
    content: 鍛鍊體魄，從柔弱書生化為強健將士
  - label: B
    content: 對自己曾大放厥詞的態度徹底悔悟而歸隱
  - label: C
    content: 心態成熟，由鋒芒畢露轉為沉穩內斂
  - label: D
    content: 改變立場，從批評、反對到支持新政。
  lesson_raw:
    title: 蘇東坡突圍
    basis: 題目引用〈蘇東坡突圍〉
- id: doc_113_高雄_獅甲_國文_g9s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 余秋雨以〈蘇東坡突圍〉作為該文標題，請問「突圍」，指的是什麼？
  options:
  - label: A
    content: 蘇軾衝破創作上的瓶頸，並且在事業上更有成就
  - label: B
    content: 蘇軾逃離滾滾塵世，追隨佛印，遁入空門。
  - label: C
    content: 蘇軾突破小人圍困，順利從京城逃至黃州
  - label: D
    content: 蘇軾在困厄中沒被打倒，進而成長，超脫逆境。
  lesson_raw:
    title: 蘇東坡突圍
    basis: 題目引用余秋雨〈蘇東坡突圍〉
- id: doc_113_高雄_獅甲_國文_g9s1e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 蘇軾卜算子:「缺月掛疏桐，漏斷人初靜。誰見幽人獨往來？縹緲孤鴻影。 驚起卻回頭，有恨無人省。揀盡寒枝不肯棲，寂寞沙洲冷。」關於此闋詞，下列敘述何者正確？
  options:
  - label: A
    content: 透過「夜月」、「梧桐」、「沙洲」這些意象營造開闊清麗的境界
  - label: B
    content: 以缺月、疏桐、幽人、孤鴻道盡孤寂處境，並表達了以高潔自許
  - label: C
    content: 描述客居他鄉，久未見親友的懷鄉之情
  - label: D
    content: 「有恨無人省」反襯出自己對於前途未卜的憂懼。
- id: doc_113_高雄_獅甲_國文_g9s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 下列是〈蘇東坡突圍〉一文中，關於對成熟的敘述，何者的文意理解是錯誤的?
  options:
  - label: A
    content: 一種不再需要對別人察言觀色的從容---毀譽坦然不在意
  - label: B
    content: 一種並不陡峭的高度---風骨高尚，平易近人
  - label: C
    content: 一種不理會轟鬧的微笑---事不關己，冷眼看待
  - label: D
    content: 一種明亮而不刺眼的光輝---懷才內斂不顯露。
  lesson_raw:
    title: 蘇東坡突圍
    basis: 題目引用〈蘇東坡突圍〉
- id: doc_113_高雄_獅甲_國文_g9s1e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 關於〈我們的饕餮時代〉一文，下列敘述何者正確？
  options:
  - label: A
    content: 作者引用數據及資料佐證，指出零食的添加成分往往標示不清
  - label: B
    content: 文章說明神獸「饕餮」典故，解釋人天生貪食，一如饕餮
  - label: C
    content: 作者以饕餮為題，凸顯現今社會人們對零食往往貪食難以自制
  - label: D
    content: 本文藉物說理，強調零食會影響主食的需求量，以致經濟衰退。
  lesson_raw:
    title: 我們的饕餮時代
    basis: 題目引用〈我們的饕餮時代〉
- id: doc_113_高雄_獅甲_國文_g9s1e3_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 「以脂肪窒息焦慮，用糖漿淹死憂傷；酗可樂酗咖啡直到醺醺然，在口腔的滿足快感裡暫忘事實，讓強烈的甜蜜或者辛辣麻痺所有感覺。」請問這段話說明了什麼現象？
  options:
  - label: A
    content: 吃零食是生活的「儀式感」
  - label: B
    content: 人們藉零食滿足口腹之慾來紓解壓力
  - label: C
    content: 零食的銷量高漲與三高等疾病之間的關聯成反比
  - label: D
    content: 因零食中的添加物導致各種疾病產生。
  lesson_raw:
    title: 我們的饕餮時代
    basis: 課文原句〈我們的饕餮時代〉
- id: doc_113_高雄_獅甲_國文_g9s1e3_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 〈我們的饕餮時代〉一文，筆調幽默。以下句子所使用的修辭，何者與其他三者不同？
  options:
  - label: A
    content: 吃零食是酷，是炫，是有品味
  - label: B
    content: 垃圾食物早就和正常食物勾搭摻混，沆瀣一氣
  - label: C
    content: 以脂肪窒息焦慮，用糖漿淹死憂傷
  - label: D
    content: 大腦一直發出警告，可是手和嘴才不理它，自顧自墮落下去。
  lesson_raw:
    title: 我們的饕餮時代
    basis: 題目引用〈我們的饕餮時代〉
- id: doc_113_高雄_獅甲_國文_g9s1e3_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 在〈我們的饕餮時代〉一文中提到「布朗奈是研究肥胖的權威，他認為在人性弱點和商業洗腦下，不健康的食物充斥周遭，造成『毒食環境』，社會大眾應該拿出反菸的戰鬥態度，政府亦應政策介入，補助健康食物，向壞食物抽重稅，並規管針對兒童的零食廣告。」關於上述文句，下列敘述何者是錯誤的？
  options:
  - label: A
    content: 商人刻意營造吃零食是時尚潮流的象徵
  - label: B
    content: 抽菸和吃零食對身體造成的傷害是相同的
  - label: C
    content: 零食會危害下一代的健康，應加以管制
  - label: D
    content: 政府應對垃圾食物課重稅以遏阻其氾濫。
  lesson_raw:
    title: 我們的饕餮時代
    basis: 題目引用〈我們的饕餮時代〉
- id: doc_113_高雄_獅甲_國文_g9s1e3_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 關於〈射鵰英雄傳—智鬥書生〉一文，下列敘述何者是錯誤的？
  options:
  - label: A
    content: 書生對郭靖的話充耳不聞，黃蓉刻意巧解孔門弟子的人數，主要是要讓書生開口回應
  - label: B
    content: 書生在又濕又滑又窄且凹凸不平的石梁上飛騰跳躍，展現俐落身手，可見其武功高強
  - label: C
    content: 黃蓉道:「瞧你這般學而不思，嘿，殆哉，殆哉!」是引自論語:「學而不思則罔，思而不學則殆」來調侃書生
  - label: D
    content: 書生透過「六經蘊藉胸中久，一劍十年磨在手。杏花頭上一枝橫，恐洩天機莫露口。一點纍纍大如斗，掩卻半床無所有。完名直待掛冠歸，本來面目君知否？」一詩，黃蓉不加思索就解出析字字謎的答案，掌握書生的出身來歷。
