  stem: 孔子過泰山側。有婦人哭於墓者而哀。夫子式而聽之。使子路問之，曰：「子之哭也，壹似重有憂者。」而曰：「然，昔者吾舅死於虎，吾夫又死焉，今吾子又死焉。」夫子曰：「何為不去也？」曰：「無苛政。」夫子曰：「小子識之，苛政猛於虎也。」（禮記檀弓下）
    （注:壹似重有憂者：實在很像有深沉的悲痛似的。識:記住）關於上述文字，下列哪一個敘述是正確的?
  options:
  - label: A
    content: 可以看出婦人不離開的原因是不願受殘暴政治的壓迫
  - label: B
    content: 「夫子式而聽之」的「式」通「試」，是嘗試的意思
  - label: C
    content: 「使子路問之」與「子之哭也」的「之」詞性意義皆相同
  - label: D
    content: 「昔者吾舅死於虎」的「舅」識指母親的弟弟。
- id: doc_113_高雄_獅甲_國文_g9s1e3_s1_34
  section: 1
  number: 34
  type: single
  page: 3
  stem: 康有為在其遊記中寫著：「七月八日晚七時，汽車自挪威行，九日晨抵瑞典京士多貢。始以為瑞、挪同，國小民貧，必不足觀。驗行李訖，甫出汽車場，流觀道路之廣潔，仰視樓閣之崇麗，周遭邂逅士女之昌豐妙麗，與挪威幾有仙鬼之判。豈止挪威不及，乃可稱為冠冕歐洲，雖英、法亦遠遜焉。」（註：士多貢：瑞典首都，今譯為斯德哥爾摩。）根據這段文字，下列有關康有為遊歐的敘述何者正確？
  options:
  - label: A
    content: 英、法堪稱是全歐洲發展最好的國家
  - label: B
    content: 由道路、建築、人民三方面認定瑞典是進步的國家
  - label: C
    content: 到瑞典首都時是深夜，光照不佳，覺得無甚可觀
  - label: D
    content: 先遊瑞典後至挪威，發現相鄰兩國發展卻是天壤之別。
- id: doc_113_高雄_獅甲_國文_g9s1e3_s2_35
  section: 2
  number: 35
  type: single
  page: 4
  stem: 根據本文，鄰人為何要把雞烹煮來吃？
  options:
  - label: A
    content: 認為他養的雞會學人說話，不合常理
  - label: B
    content: 認為雞太早啼叫，打亂他一天的行程
  - label: C
    content: 認為牠叫的時機不對，使鄰人心裡發毛
  - label: D
    content: 認為牠太早鳴叫會導致家裡不得安寧。
  group_stem: '鄰之人有雞夜鳴，惡其不祥，烹之。越數日，一雞旦而不鳴，又烹之。已而謂余曰：「吾家之雞或夜鳴，或旦而不鳴，其不祥奈何？」余告之曰：「夫雞鳴能不祥於人歟？其自為不祥而已。或夜鳴，鳴之非其時也；旦而不鳴，不鳴非其時也，則自為不祥而取烹也，人何與焉？若夫時然後鳴，則人將賴汝以時夜①也，孰從而烹之乎？」

    又思曰：「人之言默，何以異此？未可言而言，與可言而不言，皆足取禍也。故書之以為言默戒。」

    ※注釋：①時夜：司夜，指雞鳴報曉 (楊時 言默戒)'
