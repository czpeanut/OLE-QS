    content: 生於憂患，死於安樂的道理
  - label: B
    content: 忍讓謙退的美德
  - label: C
    content: 朋友只能共患難不能同享福
  - label: D
    content: 愈挫愈勇的鬥志。
  group_stem: 與人相處之道，第一要謙下誠實。同幹事則勿避勞苦，同飲食則勿貪甘美，同行走則勿擇好路，同睡 寢則勿占多床席。寧讓人，勿使人讓我；寧容人，勿使人容我。人有恩於我，則終身不忘；人有讎於我，則即時丟過。見人之一善，則對人稱揚不已；聞人之過，則
    絕口不對人言。有人向你說某人感你之恩，則云：「他有恩於我，我無恩於他。」則感恩者聞之，其感益深。有人向你說某人惱你、謗你，則云：「彼與我平日最相好，豈有惱我、謗我之理？」則惱我者聞之，
    其怨即解。人之勝似你，則敬重之，不可有妒忌之心；人之不如你，則謙待之，不可有輕賤之意。又與人交，久而益密，則行之邦家，可無怨矣。 (楊繼盛書付尾箕兩兒 )
