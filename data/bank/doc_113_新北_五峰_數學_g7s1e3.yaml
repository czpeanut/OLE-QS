    content: 甲、乙兩人共有 100 元，若甲有 $x$ 元，且甲給乙 10 元後，甲的錢數和乙的錢數一樣多，則可列式為 $x - 10 = 100 -
      x + 10$
  - label: C
    content: 小翊今年 $x$ 歲，小萱今年 25 歲，3 年前，小翊的年齡比小萱年齡的 2 倍少 1 歲，則可列式為 $x - 3 = 2 \times
      25 - 3 - 1$。
  - label: D
    content: 有五個連續奇數的和為 55，且其中最小的奇數為 $x$，則可列式為 $x + (x + 1) + (x + 3) + (x + 5) +
      (x + 7) = 55$
