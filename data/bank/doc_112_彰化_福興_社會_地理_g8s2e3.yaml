- id: doc_112_彰化_福興_社會_地理_g8s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 『從納米比亞的鯨灣港出發，前往世界最古老的沙漠：納米比沙漠。所謂「納米比」，用從古至今在這塊土地生活的原住民的語言來說，有著「什麼都沒有」的意思。確實，這裡就是一片什麼都沒有的廣大沙漠，但卻有著超乎想像的景色。這地區被認為是世界上最古老的沙漠，乾旱和半乾旱的氣候已持續了最少
    8 千萬年，從大西洋吹向該地區的空氣經過 OO 洋流後變得乾燥並冷卻下沉，形成乾旱氣候。沙漠每年的降雨量少於 10 毫米，幾乎寸草不生。這個納米比沙漠，也是
    2015 年發行的世界大熱門電影「瘋狂麥斯」的拍攝地點喔！聽到這個，應該很多人都會想起「對吼，這裡曾經有很多越野車在奔馳，還有那個夕陽的場景！」。在這片幾乎沒有雨水，極度乾燥的土地上生存的特有動植物，也是不容錯過。這個是稱為「千歲蘭」的植物，據說可以長到
    2000 歲！』請問上文所描述的地點，其氣候類型最有可能那是那一張氣候圖？
