  stem: 「地球上的冥湖」納特龍湖位於東非坦尚尼亞，納特龍湖 (Lake Natron) 位在東非大裂谷與肯亞邊界的，因湖水內含有致命的化學物質，幾乎沒有生物能生存，生物一碰到水就會被「鈣化」成雕像，像極了恐怖片的畫面。受到周邊火山運動的影響，湖水變質成高強鹼性，因此又稱為泡鹼湖。湖水中含有大量的碳酸鈉，加上湖面高度反射，會讓飛行的動物以為倒映在湖面的天空是真的，於是便一頭衝入水中，沒多久，湖裡的碳酸鈉結晶會讓生物像被石化般無法動彈，讓其身體鈣化，最後以生前姿勢在湖邊死去。請問：造成東非地區火山運動頻繁的作用力與下列何者相同？
