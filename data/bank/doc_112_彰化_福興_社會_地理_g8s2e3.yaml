  page: 1
  stem: 『…1830 年，西班牙探險隊發現這塊綠地，將之取名為 Vegas，意即「牧草地」。之後，十九世紀末，逐漸有拓荒者前來，拉斯維加斯原只是沙漠中一片為印地安人所熟知的綠洲，其氣候相似中國塔里木盆地的氣候環境，乾燥少雨，年溫差大。二十世紀初鐵路開始興建後，開始了拉斯維加斯的商機。1931
    年，內華達州通過「賭博合法化」的法令，至此發展出日後拉斯維加斯的賭場文化。為吸引賭客，各賭場飯店的投資愈來愈大，裝潢也愈顯豪華。這種奢華的手筆，一家家爭奇鬥豔、各要噱頭的賭場飯店也逐年進駐拉斯維加斯大道，締造了前所未有的拉斯維加斯傳奇。』請問上文該城市的氣候類型最有可能那是那張氣候圖？
