  type: single
  page: 2
  stem: 『分布於漠南非洲東南隅的德爾班（英語：Durban，南非語：Durban），是南非夸祖魯-納塔爾省最大的一座城市，德爾班人口眾多，它同時也是南非僅次於約翰尼斯堡的製造業中心。德爾班也是南非最繁忙的港口，它也因夏季受東南信風影響較顯著而有著溫暖的氣候和迷人的海灘風光被認為是熱門的旅遊城市之一。這座城市連同它周圍的諸多小鎮擁有將近
    370 萬的人口，這使其成為了印度洋海岸線的非洲部分上最大的城市。』請問上文該城市的氣候類型最有可能那是那一張氣候圖？
