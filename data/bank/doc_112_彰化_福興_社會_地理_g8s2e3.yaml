  stem: '右圖為小阿飯在研究某年非洲貿易現況時所發現的某些現象。非洲各國採取下列何項措施，最可能有助於改善非洲這些現象？


    * 肯亞是世界主要的花卉生產國，但奈及利亞的花卉有八成來自荷蘭；奈及利亞生產大量棕櫚油，但肯亞的棕櫚油主要進口自馬來西亞。

    * 以洲內貿易的比例而言，非洲僅有15%，亞洲是58%，歐洲高達67%。

    * 目前非洲大部分國家的貿易對象主要為歐盟國家、中國及美國。'
