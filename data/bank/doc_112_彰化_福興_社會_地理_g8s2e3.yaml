- id: doc_112_彰化_福興_社會_地理_g8s2e3_s1_30
  section: 1
  number: 30
  type: single
  page: 4
  stem: 『…璀璨生輝的鑽石受到許多人的喜愛。一克拉的鑽石，往往要處理 250 噸的岩石、沙和礫石後才能得到。根據數據顯示，約有一半鑽石產自非洲，它除了帶給非洲財富外，也帶給當地人民無休止的暴力、血腥及自相殘殺。「衝突鑽石」是指產自未經國際承認的非法勢力所控制地區的鑽石。非法勢力使用這些鑽石收入來對抗合法政府或聯合國安理會。此情勢的形成，與冷戰結束後的政治情勢有關。因為原先支持當地叛亂團體的外國勢力相繼退出非洲，這些團體為了維持與政府對抗的態勢，必須另覓經濟來源，其中最常用的手段就是開挖及販售昂貴的鑽石。這些叛亂團體為了獲得鑽石，殘忍地控制當地平民。因此當人們購買這些來路不明的鑽石時，也將使當地平民繼續面對無止盡的虐待與殺戮…』請問：文中所敘述的國家族群衝突不斷，造成政治局勢不穩定，同一國家內有許多不同族群，彼此間互相攻擊的情況屢見不鮮，造成這種現象的最主要的原因為下列何者？
  options:
  - label: A
    content: 種族隔離政策
  - label: B
    content: 國界劃分不當
  - label: C
    content: 宗教信仰不同
  - label: D
    content: 語言溝通障礙
