- id: doc_112_彰化_福興_社會_地理_g8s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 『大西洋邊，被稱為「上帝之餐桌」的桌山（Table Mountain）腳下的南非城市，因著名的好望角而得名，這裡也是歐洲殖民者最早登陸的地點，是南非歷史最久遠的城市，因此被稱為「母親城」，這就是開普敦（Cape
    Town）。南非最富觀光資源的地方，絕非開普半島莫屬。不論是自然景觀、歷史、購物娛樂、多民族生活樣貌，以及旅遊安全和發達的旅行業，都吸引世界各地的遊客蜂擁而來，桌山山脈環繞著開普敦，遮擋著來自大西洋的寒風，開普半島四季分明，每年
    5 月至 8 月西風帶和鋒面從大西洋帶來豐沛的降水。其餘月份氣候溫暖而乾燥。達伽馬登陸之後，來自歐洲的船隻就把這裡作為東方航線上一個上岸休息和補充給養的地點，開普敦因此被稱為「海上客棧」。荷蘭式和維多利亞式的建築是歐洲殖民者的家園，馬來區則以繽紛的色彩記錄著一段辛酸的歷史。桌山(Mountain
    Table)雖高僅 1067 公尺，卻如屏風般環繞著開普敦市，山頂平坦一片，真是山如其名。如果是晴天的黃昏，山上嵐霧迷漫，緩緩飄下桌山時，彷如繡滿蕾絲邊的白桌巾隨風輕輕飄動，美得令人不敢置信！』請問上文該城市的氣候類型最有可能那是那一張氣候圖？
