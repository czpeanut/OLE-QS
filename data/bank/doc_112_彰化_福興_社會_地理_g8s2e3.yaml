  group_stem: ※『相對於咖啡農獲利日趨微薄，近年來酪梨被西方人鼓吹營養價值高，所以需求量日益增加，價格也水漲船高，被視為是非洲改變貧困現狀的「綠金」。據傳南非是非洲大地最早種植酪梨的國家，大約是在十七世紀末期，自原產地熱帶的南美洲引進種子。農夫於數年前移除農場上一半的咖啡樹改種酪梨，若一切順利則可採收
