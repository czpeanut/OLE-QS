- id: doc_113_新北_五峰_自然_g8s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '生活忙碌的上班族，總是要來杯咖啡提神。下列為網路上大家關心的一則問與答，關於文中所提及的 PS 及 PP 的敘述，請問下列何者錯誤?


    問:外帶咖啡的塑膠杯蓋會釋出致癌物質，是真的嗎?

    答:過去咖啡杯蓋的材質多為聚苯乙烯(簡稱PS)，由苯乙烯($C_{8}H_{8}$)聚合而成，因民眾擔心該材質有釋出致癌物質的可能，相關單位已對此材質訂出使用規範，以確保安全。為免疑慮，市面咖啡杯蓋材質已逐漸改成聚丙烯(簡稱PP)，由丙烯($C_{3}H_{6}$)聚合而成。PS
    和 PP 都屬於熱塑性聚合物，只要符合規定，消費者正常使用，尚無安全疑慮。'
  options:
  - label: A
    content: PS 和 PP 都屬於鏈狀聚合物。
  - label: B
    content: PS 和 PP 皆為塑膠，為環保起見都須回收。
  - label: C
    content: PP 是由碳水化合物聚合而成。
  - label: D
    content: PS 是由數千個以上的原子所組成。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 理化
      code: 5-3
      title: 聚合物與衣料纖維
      chapter: 第5章 有機化合物
    textbook: 八下理化 5-3 聚合物與衣料纖維
    labeled_by: ai
  ai_answers:
    gemini: C
    qwen: C
  answer:
  - C
  answer_status: ai_generated
  answer_source: ai:gemini+qwen
- id: doc_113_新北_五峰_自然_g8s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 露營野炊時，有使用卡式瓦斯爐以及瓦斯罐。小婷發現瓦斯罐上成分標記「液化丁烷」。關於「液化丁烷」的敘述，請問下列何者正確?
  options:
  - label: A
    content: 丁烷在常溫常壓下為液態。
  - label: B
    content: 此瓦斯罐主要是利用降低溫度的方法讓丁烷液化。
  - label: C
    content: 丁烷液化後，變為不易燃燒，儲存上較為安全。
  - label: D
    content: 丁烷屬於烴類，燃燒完全後，會產生 $CO_{2}$ 和 $H_{2}O$。
