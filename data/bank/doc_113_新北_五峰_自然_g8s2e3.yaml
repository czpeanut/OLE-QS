- id: doc_113_新北_五峰_自然_g8s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 小南欲做實驗探討：「接觸面的平滑程度對摩擦力之影響。」今準備體積相同的木塊、鐵塊、磚塊及500 公克重的砝碼 3 個，置於水平桌面上，並用彈簧秤測量啟動時所需的拉力，其正確的實驗方法為何？
  options:
  - label: A
    content: 分別測量木塊、鐵塊、磚塊的啟動拉力。
  - label: B
    content: 分別在木塊上疊1～3 個砝碼，測量啟動拉力。
  - label: C
    content: 分別將木塊平放、側立、直立，測量啟動拉力。
  - label: D
    content: 分別在桌面上塗蠟、鋪砂紙、墊玻璃，測量木塊的啟動拉力。
