- id: doc_113_新北_五峰_自然_g8s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 家裡廚房的瓦斯爐，燃燒液化石油氣提供煮飯的熱能。你知道液化石油氣的主要成分是哪一類的有機化合物嗎？又這些化石燃料是如何形成的呢？
  options:
  - label: A
    content: 醇類，由植物行光合作用直接產生。
  - label: B
    content: 烴類，由古代生物遺骸在地殼內經高溫高壓形成。
  - label: C
    content: 有機酸，由微生物分解有機物後產生。
  - label: D
    content: 酯類，由動物排泄物累積而成。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 理化
      code: 5-2
      title: 常見的有機化合物
      chapter: 第5章 有機化合物
    textbook: 八下理化 5-2 常見的有機化合物
    labeled_by: ai
  ai_answers:
    gemini: B
    qwen: B
  answer:
  - B
