  section: 1
  number: 8
  type: single
  page: 1
  stem: '在科技快速發展下，傳統新聞媒體式微與自媒體興盛。從資訊自由化與多元化的角度而言，網路爆料、網路紅人與不限主題的直播，或許是一種進步，但假新聞、不實爆料、網路霸凌、網路公審等有違傳播倫理的行為，不禁讓人質疑「人人都是媒體」的說法，究竟是時代的進步，還是傳播科技引發的新災難？

