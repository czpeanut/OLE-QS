  section: 1
  number: 36
  type: single
  page: 2
  stem: 中國古代的統治者，為了維持國家運作並管理人民，因而建立賦稅制度。下列有關此制度的敘述何者錯誤？
  options:
  - label: A
    content: 人頭稅是中國稅賦的基本稅源
  - label: B
    content: 歷代統治者規定一律以金錢繳交稅賦
  - label: C
    content: 商鞅變法時曾透過稅賦制度鼓勵分家
  - label: D
    content: 成年人除了繳交稅賦之外還需負擔徭役。
