- id: doc_111_桃園_同德_社會_歷史_g8s1e1_s1_25
  section: 1
  number: 25
  type: single
  page: 1
  stem: 智弋發現日本是一個深受中國文化影響的國家，日本長期與中國往來接觸，甚至影響日本歷史與文化的發展，日語中「大化革新」的意思就是偉大的變化。請問，關於大化革新的敘述何者正確？
  options:
  - label: A
    content: 模仿中國小篆字體創造日本文字
  - label: B
    content: 中國透過公主下嫁帶動文化交流
  - label: C
    content: 目的在於學習唐朝律令制度
  - label: D
    content: 最後導致日本併入中國版圖。
