  section: 1
  number: 26
  type: single
  page: 1
  stem: 小說《長安十二時辰》中的美食讓人垂涎欲滴，其中胡餅是出場率最高的食物，歷史上胡餅也深受歡迎，如《後漢書》所記「靈帝好胡餅……，京都貴戚皆競為之。」右圖為漢代疆域圖，請問胡餅應是從右圖中何處傳入中國？
  options:
  - label: A
    content: 甲
