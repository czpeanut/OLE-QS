  section: 1
  number: 34
  type: single
  page: 2
  stem: 中國長期以來位居中原，稱呼周邊文化差異較大的民族為蠻夷戎狄，彼此之間時有交流、貿易、通婚或衝突。請問：漢人與南方民族開啟交流，與下列何者最有關係？
  options:
  - label: A
