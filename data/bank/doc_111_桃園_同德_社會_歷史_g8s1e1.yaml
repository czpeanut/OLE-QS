  section: 1
  number: 37
  type: single
  page: 3
  stem: 周平王東遷後，王室衰微，戎狄對華夏造成嚴重的威脅。所謂的「華夏」是指下列何者？
  options:
  - label: A
    content: 周朝的封建諸邦，過著工商業為主的生活
  - label: B
    content: 周朝的封建諸邦，過著農業為主的生活
  - label: C
    content: 雜居中原的游牧民族
  - label: D
    content: 分布在邊疆地區的農民
  tags:
    chapter:
