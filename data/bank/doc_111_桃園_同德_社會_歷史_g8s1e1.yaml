- id: doc_111_桃園_同德_社會_歷史_g8s1e1_s1_28
  section: 1
  number: 28
  type: single
  page: 1
  stem: 都江堰是中國一項被列為世界文化遺產的水利設施，建於西元前3 世紀，是規模十分龐大的工程，除了需要大量人力修築之外，完工後也必須耗費資源進行維護。該設施在當時得以推動並完工，與下列哪種政策的實施最相關？
  options:
  - label: A
    content: 邊境地區設郡置縣
  - label: B
    content: 君王將諸侯分封各地
  - label: C
    content: 以禮制定行為規範
  - label: D
    content: 政府將人民編入戶籍
