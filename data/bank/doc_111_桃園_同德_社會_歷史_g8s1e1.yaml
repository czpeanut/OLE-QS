- id: doc_111_桃園_同德_社會_歷史_g8s1e1_s1_27
  section: 1
  number: 27
  type: single
  page: 1
  stem: 唐代國力強盛，除了被視為東亞地區的國際盟主外，鄰近的國家也紛紛派遣使者前來學習、仿效唐 代典章制度、文學藝術與宗教信仰。其中有一個位於朝鮮半島，深受唐代影響的國家，是下列哪一個？
  options:
  - label: A
    content: 大食
  - label: B
    content: 日本
  - label: C
    content: 吐蕃
  - label: D
    content: 新羅。
