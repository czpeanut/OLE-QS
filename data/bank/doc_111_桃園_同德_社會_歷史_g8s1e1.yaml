  section: 1
  number: 24
  type: single
  page: 1
  stem: 唐太宗曾說：「自古皆貴中華，賤夷狄，朕獨愛之如一。」請問：從唐太宗的談話內容中，最能彰顯唐代社會文化的哪一項特色？
  options:
  - label: A
    content: 胡漢融合，兼容並蓄
  - label: B
    content: 十年寒窗無人問，一舉成名天下知
  - label: C
    content: 上品無寒門，下品無世族
  - label: D
    content: 布衣卿相，貴族没落平民崛起。
