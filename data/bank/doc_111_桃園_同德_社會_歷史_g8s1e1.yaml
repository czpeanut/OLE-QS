  - label: C
    content: 形成了「上品無世族，下品無寒門」的現象
  - label: D
    content: 世族勢力一直到宋代才逐漸退出政治舞臺。
  group_stem: 古代中國逐漸形成講究身分的世族社會，西元3 世紀以來，因遭逢戰亂，前朝選拔官員的方式已不可行，因此政府改用新的選才方式。此法源是要為國家挑選人才，卻意外造成世族勢力的迅速發展，使世族不僅掌控政權，在經濟上還擁有大量土地。除此之外，他們凡事講求門當戶對，以維持其尊貴的社會地位，甚至連皇帝都對世族有所顧忌。
