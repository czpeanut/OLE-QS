  section: 1
  number: 30
  type: single
  page: 2
  stem: 育群勤奮好學，飽讀詩書，欲入朝為官，施展抱負，為民謀福。請設想育群若是身處不同時代，下列何項敘述可能為育群受選拔任官的情形？
  options:
  - label: A
    content: 若他是西周時代的平民，可以出色的才能與謀略受到國君重用
  - label: B
    content: 若他為漢代經學世家的成員，可透過九品官人法出任官員
  - label: C
    content: 若他為曹魏時期的儒家學子，可能因獲得軍功受地方長官薦舉任官
  - label: D
    content: 若他是唐代的平民子弟，可能透過科舉獲得出任官員的資格。
