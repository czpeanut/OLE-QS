  section: 1
  number: 22
  type: single
  page: 1
  stem: 宜庭正在製作有關唐代「東亞文化圈」的歷史報告，但是有個地方寫錯了。請你在下列選項中幫她找出這個錯誤？
  options:
  - label: A
    content: 影響的國家包含新羅、日本與越南等國
  - label: B
    content: 唐代派遣使節到各國留學，學習他國長處
  - label: C
    content: 佛教是東亞文化圈共同的元素之一
  - label: D
    content: 中國文字、法律與制度對鄰近國家的影響很大。
