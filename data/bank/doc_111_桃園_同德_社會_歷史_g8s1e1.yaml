  stem: 根據上文，佛教是中國主要信仰之一，關於佛教的敘述何者正確？
  options:
  - label: A
    content: 佛教為外來宗教，自天竺透過西域傳入中國。
  - label: B
    content: 佛教在春秋戰國之際傳入中國，很快地便成為普及民間的信仰。
  - label: C
    content: 兩晉南北朝是佛教發展的關鍵，因為長期的戰亂使佛教大受打擊。
  - label: D
    content: 佛教在漢朝已呈現中國化樣態，隋唐時期甚至成為國教。
  group_stem: 支遁字道林，陳留（今河南省開封市）人，生於西晉末年。兩晉之際，天下大亂，支道林家族隨中原難民離開原籍渡江南下。家族有佛教信仰傳統，故自幼即拜法師求學，出家後雲遊京師。因身處玄談盛行
    之地，自己也好談玄理，講經如同談玄，講述十分生動，很受歡迎和稱讚，成為東晉名僧。他與名士交往很廣，與謝安、王羲之等名士來往甚切，還多次受皇帝邀請到京城講經。
