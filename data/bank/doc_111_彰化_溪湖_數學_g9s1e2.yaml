- id: doc_111_彰化_溪湖_數學_g9s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '在同一圓中，有關弦心距的概念，哪些是正確的？

    (甲)若兩弦等長，則其弦心距相等。

    (乙) 若兩弦的弦心距相等，則此兩弦等長。

    (丙)若兩弦不等長，則弦愈長，其弦心距愈短。

    (丁)弦心距愈短的弦，其弦的長度愈短。'
