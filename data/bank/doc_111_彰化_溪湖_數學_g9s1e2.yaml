  stem: '有關弦、圓心、直線的關係，哪些敘述是正確的？

    (甲) 弦的垂直平分線必通過其所在圓的圓心。

    (乙) 如果弦不是直徑，則過圓心且平分弦的直線，必垂直此弦。

    (丙) 過圓心且與弦垂直的直線，必平分此弦。'
