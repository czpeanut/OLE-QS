- id: doc_113_新北_桃子腳_國文_g8s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 文言文裡把賓語（受詞）提到述語（動詞）的前面時，中間常加一「之」字或「是」字，「之」與「是」為結構助詞，無義。此種概念稱為「賓語提前」，請根據此原則，判斷下列「」的文字何者並未將文句還原成原來的句型？
  options:
  - label: A
    content: 父母唯「其疾之憂」→憂其疾
  - label: B
    content: 大華事業有成後積極回饋社會，擺脫商人「唯利是圖」的形象→圖唯利
  - label: C
    content: 這個案子由你全權負責，如今虧損，當然「唯你是問」→唯問你
  - label: D
    content: 「牡丹之愛」，宜乎眾矣！→愛牡丹。
