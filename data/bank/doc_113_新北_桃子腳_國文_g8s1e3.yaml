  stem: 依據上文，關於馬航MH17 空難事件，以下哪一個說法正確？
  options:
  - label: A
    content: 空難是由烏克蘭軍隊擊落的，俄羅斯當局承認了責任。
  - label: B
    content: 法庭確認三名罪犯親自按下了導彈發射按鈕。
  - label: C
    content: 調查人員發現「山毛櫸」導彈由俄羅斯提供，並從俄羅斯轉移到烏克蘭東部。
  - label: D
    content: 俄羅斯與荷蘭合作，積極參與調查並提供了證據。
  group_stem: "庚.\n馬航MH17：致命空難發生十年後的四個關鍵問題(摘錄BBC 中文網)\n2014 年7 月17 日，馬來西亞航空公司（Malaysian\
    \ Airlines）一架客機被俄製導彈擊落，機上近300 人喪生。以下是關於這起事件的四個關鍵問題，其中有許多問題仍未得到解答。\n    事發時，MH17\
    \ 航班正從阿姆斯特丹飛往吉隆坡，在烏克蘭東部頓巴斯地區上空被導彈擊中。當時，俄羅斯控制的武裝組織正與烏克蘭軍隊激戰。空難導致包括80 名兒童在內的283\
    \ 名乘客，以及15 名機組人員全部遇難。\n荷蘭當局對墜機事件展開了刑事調查，多年來問詢了數十名目擊者，並檢查了數百件證據。俄羅斯否認對空難負責，但調查人員發現了該事件與俄羅斯當局的聯繫。\n\
    以下是圍繞這起致命空難的幾個關鍵問題。\n一、誰被認定與墜機事件有關？\n2022 年，海牙地區法院判定三人與客機墜機事件有關。\n他們都是俄羅斯聯邦安全局（FSB）的前官員，同時也是自封的「頓涅茨克人民共和國」政府成員，這是俄羅斯在烏克蘭東部支持的一個分離主義地區。\n\
    伊戈爾·吉爾金（Igor Girkin）曾是「頓涅茨克人民共和國」的前「國防部」部長，謝爾蓋·杜賓斯基（Sergei Dubinsky）是前軍事情報局局長，列昂尼德·克拉夫琴科（Leonid\
    \ Kravchenko）曾為杜賓斯基工作。\n還有第四個人也被指控，但法庭後來認為沒有足夠證據對他定罪。被定罪的三人都被判處終身監禁，但他們都沒有出庭。儘管吉爾金和杜賓斯基都是俄羅斯公民，但莫斯科並沒有配合國際社會對墜機事件的調查。\n\
    伊戈爾·吉爾金最終確實在俄羅斯身陷囹圄，但是因完全不同的罪名被起訴。\n這名前聯邦安全局官員指責俄羅斯軍事領導層在對烏克蘭發動全面入侵時能力不足，在2024\
    \ 年1 月被控犯有極端主義罪，並被判處四年監禁。自2022 年2 月的入侵行動開始後不久，批評俄羅斯軍隊即可構成刑事犯罪。\n二、誰發射了導彈？\n  \
    \  荷蘭主導的調查人員研究了視頻和照片證據，並檢查了數百個截獲的電話。這些證據幫助他們認定，飛機是被從「頓涅茨克人民共和國」分離主義分子控制區所發射的「山毛櫸」（Buk）防空導彈擊落。發射車由俄羅斯提供。與此同時，法庭指出，三名罪犯都沒有按下導彈發射按鈕。\n\
    \    開源調查機構貝寧貓（Bellingcat）網站證實，涉案的「山毛櫸」發射車屬於俄羅斯第53 防空旅第三營——這將潛在罪犯的範圍縮小至30 人左右。其中三到四人在2014\
    \ 年7 月17 日可能一直在操作山毛櫸發射車。\n    荷蘭調查人員要求俄羅斯當局詢問該旅旅長謝爾蓋·穆奇卡耶夫（Sergei Muchkaev）上校。莫斯科抱怨被剝奪參與調查該案的權利，並沒有回應這些請求。\n\
    在被截獲電話中出現的另一個人是俄羅斯聯邦安全局上將安德烈·布爾拉卡（Andrey Burlaka）。通話證據顯示，布爾拉卡很可能參與了將「山毛櫸」系統從俄羅斯轉移到烏東的工作。BBC\
    \ 已確定，在2014 年至2015 年烏東衝突的活躍階段，布爾拉卡將軍曾被授予俄羅斯最高獎章——「俄羅斯英雄」。\n三、普京扮演了什麼角色？\n    2023\
    \ 年2 月，在三名罪犯被宣判的數月之後，調查人員稱，俄羅斯總統普京（Vladimir Putin）直接參與了烏東衝突和擊落客機事件。\n    作為證據，他們拿出了兩通被截獲的電話，其中都提到將「山毛櫸」防空導彈發射車運往烏克蘭的決定是由「最高人物」做出的，這很可能是指普京總統。\n\
    \    在新聞發佈會上，荷蘭領導的聯合調查組的調查員說：「有強烈的跡象表明，普京直接參與了有關『山毛櫸』導彈的決策，但這些跡象並未達到完整和無可辯駁的證據的高標凖」。\n\
    \    他們還表示，根據荷蘭法律，普京總統的俄羅斯國家元首身份為他提供了豁免權。在他任職期間，該國法院不能對他進行審判。\n    普京的發言人德米特里·佩斯科夫（Dmitry\
    \ Peskov）當時評論說，俄羅斯未被允許參與調查，這「無助於調查的客觀性」。\n四、受害者賠償如何進行？\n    2020 年，荷蘭政府向歐洲人權法院（European\
    \ Court of Human Rights）提起上訴，要求承認俄羅斯對MH17 航班298 名乘客和機組人員的死亡以及拒絕調查事件負有責任。此案仍在審理中。\n\
    \    荷蘭政府聲稱，俄羅斯在這場災難中扮演了關鍵角色，克里姆林宮就墜機事件持續進行造謠活動，嚴重侵犯了遇難者親屬的公民權利。\n    莫斯科繼續否認對其提出的所有指控，並積極利用MH17\
    \ 事件進行宣傳。它聲稱飛機是被烏克蘭軍隊擊落的，甚至聲稱飛機上的乘客在被擊落前就已經死亡。\n如果俄羅斯在歐洲人權法院的案件中敗訴，法院有可能要求俄羅斯向受害者支付賠償金。但在實際層面，這樣的判決很可能只是象徵性的。\n\
    \    俄羅斯在開始全面入侵烏克蘭後不久，該國議會就通過了一項關於「不執行歐洲人權法院裁決」的法律——該法於2022 年3 月15 日生效。\n    與此同時，對MH17\
    \ 航班空難遇害者的賠償沒有時效限制。在未來的某個時候，俄羅斯不同的政府可能會做出政治決定，達成某種解決方案。"
