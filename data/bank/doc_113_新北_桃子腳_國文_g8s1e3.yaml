  stem: 「童年的行徑是比較不可理喻的，固執，任性，有些聲符實在猜不透，乍看是散步的飛禽，瞧仔細了卻是走獸的背影。」這段文字主要在描寫什麼？
  options:
  - label: A
    content: 幼童心智的發展變化
  - label: B
    content: 大眾對鬼的窺探好奇
  - label: C
    content: 有感於自身學識不足
  - label: D
    content: 篆體字形的不易解讀。
  group_stem: "戊.\n小篆是漢字的童年，比甲骨金文的嬰兒期晚一點點。童年的行徑是比較不可理喻的，固執，任性，有些聲符實在猜不透，乍看是散步的飛禽，瞧仔細了卻是走獸的背影。許慎在進行一場前無古人的大猜謎，他的謎底洩露了大量漢字的小祕密。我翻到鬼部，所有跟鬼相關的字都「從鬼」，由鬼這個大酋長親自領隊。原來鬼的脖子上頂著個似田非田的醜陋大頭，跟我童年想像的不一樣。看來在造字的時代，鬼已經是惹人討厭的醜東西，尤其臉部一定有縱橫的刀疤，或猙獰的表情。也許可以構成一種巫祝的文化吧，如果有人將歷代的幽靈召回來詳加考據。那魂呢？魂字被解釋成令我眼睛為之一亮的「從鬼，云聲」。\n\
    \  云聲，難道是雲在風中移動的聲響？好一句「從鬼，云聲」。\n  我不禁想起每個看過鬼片的夜晚，失眠的耳蝸管常常把聲音誇大，削尖，磨利，再拉長！從童年到壯年都一直如此。我的想像，會主動替寂靜的房子配樂，木質的櫥櫃不時傳出古怪的夢囈，打算喚醒某些被封印千年的老精靈；我長不大的恐懼，躲在膽囊兩側探頭，朝著異聲的來源悄悄豎耳。佛呢？我佛在信仰的邊陲靜靜佇立，不視不聽不動不語，說是太遠，而且又是微不足道的幻想事件。偏偏有風在窗外搬弄著布袋戲，樹和莫名的影子是奸角在排練劇情。多風的小城本來就適合鬼怪氣氛的萌生，雲的移動扭曲了天空單純的內容，成就了我印象中的鬼魂。\n\
    \  在一切從鬼的云聲中，我度過無數失眠的夜晚，硬撐到天色微亮才草草入睡。（陳大為 從鬼）"
