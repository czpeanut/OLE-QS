  group_stem: "甲.\n現代人的兩片嘴脣，像溫煦的春風，也如凌厲的冬風，能夠讓你如醉如痴，也可以把你活活颳進地獄。一件單純的事，一句普通的話，經過人們「舌花」的搬弄，往往無端帶來許多額外的困擾。\n\
    \  人性中的弱點之一，是每個人都想使自己看起來顯得重要，而經常能發表一些聳人聽聞的消息，不失為受人重視的好方法。也難怪人們要大耍「舌花」而樂此不疲了。\n\
    \  說穿了，容不得別人成功，看不慣別人賺錢，常是每一樁「舌花」事件的起源。既然有人能把極其單純的事情弄得十分複雜，我們自然可將複雜的事還原為單純，也就是說，即使有人利用「舌花」傷害了你，你也大可不必介意，說不定對方是無意的，你若嚴加追究，於是無意成為有意，簡單變成複雜。世界所以大亂，人類無法和平，大概也是人性使然。\n\
    \  總之，「舌花」是經不起分析，也不值得分析的！\n                               ＜隱地 舌花＞"
