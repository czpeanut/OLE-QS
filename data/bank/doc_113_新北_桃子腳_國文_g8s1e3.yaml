  stem: 關於朱新仲親戚的難產情況，下列敘述正確的是？
  options:
  - label: A
    content: 難產情況持續三天，因藥物治療無效而請龐安常治療。
  - label: B
    content: 難產情況持續七天，試過藥物與符水但無效，產婦瀕臨 死亡。
  - label: C
    content: 產婦在龐安常到來之前，已經順利生下男嬰。
  - label: D
    content: 李幾道直接施針救助產婦，但效果不佳。
  group_stem: "己.\n妙手助產\n  朱新仲租居桐城時，親識①間一婦人妊娠將產，七日而子不下，藥餌符水②無所不用，待死而已。名醫李幾道偶在朱公舍，朱邀視之，李曰：「此百藥無可施，惟有針法；然吾藝未至此，不敢措手也。」遂還。而幾道之師龐安常適過門，遂同謁朱。朱告之故，曰：「其家不敢屈先生，然人命至重，能不惜一行救之否？」安常許諾，相與同往。才見孕者，即連呼曰：「不死！」令家人以湯溫其腰腹間，安常以手上下拊摩之。孕者覺腸胃微痛，呻吟間，生一男子，母子皆無恙。其家驚喜拜謝，敬之如神。而不知其所以然。安常曰：「兒已出胞，而一手誤執母腸胃，不復能脫，故雖投藥而無益。適吾隔腹捫兒手所在，針其虎口，兒既痛，即縮手，乃遽生，無他術也。」令取兒視之，右手虎口，針痕存焉，其妙至此。\n\
    \                     《摘錄夷堅志·甲志卷十》\n\n註: ①親識:指親戚或朋友\n    ②符水:溶有符籙灰燼的水。道士用來治病。"
