  group_stem: 39 歲的卓暐彥，退伍後在都市打拚，直到5 年前他看見露營市場的盛行與客群，自認家鄉桃園市復興區雪霧鬧部落天然的地理環境極具魅力，決定回部落創立「飛鼠不渴休閒露營農場」，但剛回到部落創業，他深深體認到在部落發展的艱辛，從下山採買家用品等家庭事務需耗費數小時，部落面臨高齡化、青年往外發展，還有許多農民不善使用智慧型手機及網路，不懂將農產品上架網購平台，或網路行銷，影響產品競爭力。為解決「數位落差」的問題，卓暐彥和族人共同建置「樹不老共享店鋪」智慧共享平台，統整金流、訂單資料，採「先付款後到貨」的方式，使農民不必反覆查帳等繁瑣做業，還會幫忙拍照、美化、上架；此外還可讓族人提出需求，不論是因山區交通不便，需要花很多時間下山採買日用品，提出「跑腿」任務或族人住院募款、送餐等，「只要想得到的」都由族人共同解決部落需求。支付酬勞方式也強調不限於金錢，以物易物、換工，甚至免費都可以。
