- id: doc_113_高雄_左營_社會_g7s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 因應1980 年代起的原住民權利促進運動，立法院自1994 年起多次修訂《姓名條例》，政府也陸續開放原住民能以不同形式回復其族名。然而直至今日，當原住民向戶政機關申請回復族名時，仍被要求加上無法正確傳達族名發音與意涵的中文字。2021
    年初，來自不同族群的原住民人權捍衛者組成「以我的族名呼喚我」行動小組，實際到各地戶政機關，嘗試用「單獨使用族語拼音登記」的方式申請姓名變更，皆遭戶政機關以「不符合規定」為由拒絕，並駁回其訴願。請問:有關原住民族運動的敘述何者正確?
  options:
  - label: A
    content: 該行動小組的作為屬於部落營造
  - label: B
    content: 原住民透過公民參與爭取權益
  - label: C
    content: 原住民族的主張是為促進部落經濟永續發展
  - label: D
    content: 部落舉辦的祭典如豐年祭屬於原住民族社會運動
