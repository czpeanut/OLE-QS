  stem: '高中籃球聯賽HBL 冠軍隊隊長突然宣布退隊，指控球隊未履行承諾，讓他一度想要輕生，傳出是因為被球隊總教練兼領隊霸凌，更有多名球員及家長投訴，總教練經常羞辱經濟弱勢的球員及家長，還威脅要封殺不聽話的球員。對此，台北市教育局日表示，若查證屬實，將依法解聘相關人員。請問:關於上述事件，下列觀念有幾項是正確的?

