  section: 1
  number: 5
  type: single
  page: 1
  stem: (甲)台南市長榮社區的居民大多在此居住長久的時間，一直很投入社區營造相關議題的潘美純，帶領(乙)長榮社區發展協會，在社區發起讀書會，一起唸書、一起開電影，甚還包下夜店上pub、舉辦旗袍選美等，讓長輩找回生活的重心。同時，為了長輩的健康與照護問題，潘美純透過(丙)普查了解社區長輩的健康狀況與需求，也創立「長青食堂」除解決長輩三餐問題，還能掌握老人家的狀況，適時地照顧與關心。(丁)「把社區當成自己的家，那麼就可以形成一股對社會正向的力量，正是當時我們社區所需要的。」也因此，潘美純提出「我們都是一家人」提案，用眷村文化及迎新活動拉近新舊住民的距離。根據上述畫線內容判斷，下列敘述何者正確？
  options:
  - label: A
    content: 甲：此社區是由政府劃設形成的
  - label: B
    content: 乙：負責延續傳統祭祀的社區組織
  - label: C
    content: 丙：以社區為生產分配單位
  - label: D
    content: 丁：該社區能夠凝聚社區意識
