  group_stem: "The Taiwan leopard cat is a rare and special animal. It lives in the\
    \ forests and grasslands of Taiwan. It likes to stay in places with trees, rivers,\
    \ and small hills. It is a wild cat, and it is smaller than a house cat.\n   \
    \ This animal eats small animals like birds, mice, and frogs. It hunts at night\
    \ and rests during the day. Its fur is brown with dark spots, which helps it hide\
