  type: single
  page: 3
  stem: 高等法院依刑法第19 條之1「不罰」規定改判無罪。請問：梁男在高等法院上量刑標準與下列何者相同？
  options:
  - label: A
    content: 剛達結婚法定年齡的小柔
  - label: B
    content: 84 歲獨居的王奶奶
  - label: C
    content: 今年剛升國一的大胖
  - label: D
    content: 20 歲大學生瘖啞人小明。
  group_stem: "根據新聞報導：(請回答15~16 題)\n梁姓男子2018 年弒母砍下頭顱，一審桃園地院認定，梁施用毒品導致辨識違法能力降低，依此將梁男判處無期徒刑。\n\
    \    上訴後高等法院則認定，梁弒母前，因吸食安非他命和卡西酮類毒品，且是卡西酮作用最強期間，弒母時已喪失辨識和控制能力，依刑法第19 條之1「不罰」規定改判無罪，引發社會議論。\n\
    \    案經最高法院撤銷發回更審，2021 年7 月高院更一審宣判再次逆轉，高院更一審認為，梁弒母有殺人的直接故意，依桃園療養院鑑定、加上函詢台大醫院補充鑑定意見，綜合認定梁是施用毒品誘發致其精神障礙，犯案時辨識、控制能力顯著降低，並非無辨識力，依刑法第19\
    \ 條之2 規定減刑，並考量胞姊請求勿判死刑，依此改判無期徒刑。"
