- id: doc_113_新北_中平_社會_公民_g8s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 近年來，酒駕案件在媒體上不斷曝光，尤其有許多酒駕行為人並不是第一次酒駕，因此民眾希望加重處罰，以減少道路的危險，維護人民的安全。針對酒駕議題，下列何者是以「矯正犯罪」為核心的發言？
  options:
  - label: A
    content: 小玉：相較於提高刑期，事先預防，例如：酒精鎖管制方式，更能達到治本效果
  - label: B
    content: 永澤：酒駕者就應該負擔對應的代價，『以牙還牙』就這麼簡單而已，有需要這麼複雜嗎。
  - label: C
    content: 丸尾：政府應該在酒駕者的刑期中加強酒駕防制教育訓練，避免再犯者出現
  - label: D
    content: 花輪：或許我們需要提高刑度，符合罪責相當，才能有效減少酒駕情況
- id: doc_113_新北_中平_社會_公民_g8s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 阿迪看到的新聞報導最高法院107 年度九州賭博罪案判決，內容如下：「電信及資訊科技進步，網路就能開賭，然而據現有法令，因網路賭博需申請帳號、密碼加入會員，有一定封閉性，並非在『公共場所』或『公眾得出入之場所』聚賭，法院認為不構成賭博罪」。線上博奕歪風愈來愈盛。為遏阻相關犯罪，目前修法後已將「電信設備、電子通訊、網際網路或其他相類之方式」，參與他人意圖營利而供給賭博場所或聚眾的賭博者都納入刑罰範圍，也新增賭博罪的沒收條款。請問：依據報導，當時九州賭博罪案的網路賭博不構成賭博罪的原因是基於下列何者？
  options:
  - label: A
    content: 行為不符合犯罪構成要件
  - label: B
    content: 行為人缺乏責任能力
  - label: C
    content: 行為沒有違法
  - label: D
    content: 賭博罪不處罰過失犯
