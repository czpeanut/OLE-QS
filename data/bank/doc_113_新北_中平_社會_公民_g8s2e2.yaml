  stem: 針對上文中提及，該案將由國民法官審理，下列四位同學分享內容何者正確？
  options:
  - label: A
    content: 灰灰：法官將著黑袍藍邊並與國民法官一起決定被告有罪與否及刑期
  - label: B
    content: 毛毛：宣判結果最重刑期可能為主刑中的無期徒刑附加從刑的沒收
  - label: C
    content: 天天：國民法官參與審判適用重大民事、刑事案件，由六個國民法官及三個職業法官共同審判
  - label: D
    content: 阿奇：根據《刑法》規定：「被告未經審判證明有罪確定，推定其為無罪」。
  group_stem: "根據新聞報導：(請回答1~5 題)\n    台中林姓男子去年底吸食毒品K 菸、再到KTV 喝了1 瓶威士忌，整個人神智不清開車上路，同時毒駕、酒駕還在市區高速狂飆，撞飛杜姓老翁釀1\
    \ 死3 傷慘劇，呼氣酒測值高達每公升0.98 毫克，車內還被起獲毒品，犯後遭收押至今，【甲】依酒駕致死等罪嫌起訴他，將由國民法官審理。\n    但林男危險駕駛並非首例，他2023\
    \ 年12 月10 日騎機車經北屯洲際路、崇德八路2 段，就和人以高速競速、逆向行駛及翹單輪方式騎車。台中地院當時就認為，林男稱「僅因想試車」罔顧其他人生命身體安全，創造參與交通者的潛在風險，侵害社會法益，依妨害公眾往來安全罪判刑。"
