- id: doc_113_新北_中平_社會_公民_g8s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 《跟蹤騷擾防制法》三讀通過後將跟蹤騷擾行為分成八種樣態：監視觀察、尾隨接近、歧視貶抑、通訊騷擾、不當追求、寄送物品、妨礙名譽、冒用個資。 如果基於性或性別有關的意圖，針對特定對象，違反其意願，反覆、持續做出上述的行為之一，造成當事人心生畏怖、影響生活，就會構成跟蹤騷擾的行為。根據上文判斷，《跟蹤騷擾防制法》主要保障的法益與下列何者相同？
  options:
  - label: A
    content: 外患罪
  - label: B
    content: 公共危險罪
  - label: C
    content: 傷害罪
  - label: D
    content: 妨害公務罪。
- id: doc_113_新北_中平_社會_公民_g8s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 根據上文判斷，最有可能是下列何者做出憲判字第8 號判決？
  options:
  - label: A
    content: 檢察官
  - label: B
    content: 法官
  - label: C
    content: 書記官
  - label: D
    content: 大法官
  group_stem: "根據新聞報導：(請回答13~14 題)\n    2024/09/20，憲法法庭做出113 年憲判字第8 號判決，裁定死刑制度「部分合憲」，同時決定死刑僅適用犯罪情節屬最嚴重、且刑事程序符合憲法、經最嚴密正當法律程序要求的情形，如須合議庭一致決、三審要言詞辯論等，方可採用。針對部分罪行之判決「唯一死刑」，憲法法庭宣告違憲。\n\
    \    此次判決沒有廢除死刑，但明顯拉高死刑適用門檻，雖有傳媒估計未來的死刑案例只會日漸式微，不過在馬國女大生命案更一審判決中，高雄高分院仍判死刑，成釋憲後維持死刑判決首例。2025\
    \ 年1 月16 日，法務部簽准死囚黃麟凱的執行死刑執行命令，成為本次釋憲後執行死刑首例。"
