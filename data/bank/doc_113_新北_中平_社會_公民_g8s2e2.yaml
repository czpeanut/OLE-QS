- id: doc_113_新北_中平_社會_公民_g8s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 法務部於2024 年10 月29 日公告，提案修法《刑法》墮胎罪，將第288 條墮胎行為以及第290 條意圖營利者的處罰提高，引起民眾抗議，各界專家也表示憂心。同時呼籲法務部應該朝人工流產（即《刑法》中的「墮胎」）除罪化方向修法，以保障婦女自主權益以及公共健康。然而，法務部以「起訴與偵結案件不多」作為拒絕除罪化的理由。民團則回應將人工流產視為「犯罪」，本身就可能對有需求之女性造成身心壓迫與強制力，這才是除罪化的真意，與案件多寡無關。根據上文判斷，下列敘述何者錯誤？
    【素養導向】
  options:
  - label: A
    content: 將人工流產視為「犯罪」，主要是能發揮《刑法》嚇阻作用
  - label: B
    content: 若尚未除罪化代表未來墮胎行為仍屬犯罪但不一定違法
  - label: C
    content: 若修法內容最後三讀通過須經由總統公告，才能正式實施
  - label: D
    content: 根據罪刑法定原則，除罪化與否將影響該行為是否被處罰
