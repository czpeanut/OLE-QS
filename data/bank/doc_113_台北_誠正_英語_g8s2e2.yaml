- id: doc_113_台北_誠正_英語_g8s2e2_s6_41
  section: 6
  number: 41
  type: single
  page: 3
  stem: 41. What is the reading mainly about?
  options:
  - label: A
    content: How to start a new company with a good logo.
  - label: B
    content: The history of famous companies.
  - label: C
    content: The ideas and messages behind the logos.
  - label: D
    content: The secrets(秘密) of being a good businessman.
  group_stem: '(二)

    As customers, we see company logos every day. You see the 7-Eleven logo when you
    go into the store. You hold the Louisa logo on your coffee cup. Logos are everywhere!
    But do you ever stop and really look at them? They are more interesting than you
    think.

    Many companies hide secret messages in their logos. Big companies like Starbucks
    and Amazon use their logos to tell people about their business and the things
    they sell. Some logos try to make people feel something or do something. For example,
    red can make you feel hungry. That’s why many restaurants use red in their logos.
    Let’s look at some logos and their secret messages.


    | | |

    |---|---|

    | ![](amazon) | Amazon is a big online store. There is a small arrow in the logo.
    The arrow goes from the letter “A” to the letter “Z.” This means Amazon sells
    many kinds of things—from A to Z. |

    | ![](apple) | Apple is a popular computer company. Its logo shows an apple with
    a bite. Do you ever think about why? The bite helps people see it as an apple,
    not a cherry. |

    | ![](wendys) | Wendy’s is a fast-food place. When you first see it, the logo
    looks very simple. But if you look at the shirt closely, you can see the word
    “Mom.” This makes people think of home-cooked food. |

    | ![](hyundai) | Hyundai makes cars. The “H” in the logo shows two people shaking
    hands. One person is buying a car. The other is helping with the sale. |

    | ![](adidas) | Adidas sells shoes and sports items. The lines above the company
    name look like a mountain. This shows that people can try their best to reach
    the top, even when it is not easy. |


    Logos can be fun to study. Next time you see one, look closely. You may find a
    fun message inside!

     logo 標誌 secret 祕密的 arrow 箭頭 cherry 櫻桃'
