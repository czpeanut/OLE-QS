- id: doc_113_台北_誠正_英語_g8s2e2_s6_39
  section: 6
  number: 39
  type: single
  page: 2
  stem: 39. What can we learn from the reading?
  options:
  - label: A
    content: People from different generations(世代) all enjoy watch TV.
  - label: B
    content: Generation Z enjoy video apps like TikTok, YouTube, and Netflix more
      than old-style TV.
  - label: C
    content: As for Zoomers, watching a 2-hour movie makes them feel comfortable.
  - label: D
    content: Zoomers are slow to find mistakes in videos and have no idea of their
      likes.
  group_stem: '(一)

    Generation Z, also Zoomers, came into the world between the late 1990s and early
    2000s. They grow up with the Internet, so they spend a lot of time looking at
    screens.

    Most Zoomers watch many videos every day. In the morning, they start with TikTok
    or Reels. Around lunch, they check YouTube. In the evening, they watch Netflix
    or other video apps. They don’t want to miss the newest must-see shows. For Zoomers,
    videos feel like friends. They help Zoomers feel happy, especially after a long
    day of work or school.

    If you look at Generation Z and other groups, Zoomers’ video choices are very
    different. They don’t spend much time watching old-style TV. They like to use
    apps like Netflix. But they don’t always watch the whole show or movie. Sometimes,
    they skip to the best parts.

    Because Zoomers watch so much, they know a lot. If something in the video is wrong,
    they notice it right away and may say something. Zoomers know the kind of videos
    they enjoy and the best time to watch them.

     generation 世代 choice 選擇 skip to 跳到'
  tags:
    textbook: 第四冊（八下）第2次段考範圍
    labeled_by: ai
