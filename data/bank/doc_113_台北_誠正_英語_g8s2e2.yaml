- id: doc_113_台北_誠正_英語_g8s2e2_s6_44
  section: 6
  number: 44
  type: single
  page: 3
  stem: 44. What does “think outside the box” mean in the reading?
  options:
  - label: A
    content: Putting things in a box.
  - label: B
    content: Following an old way.
  - label: C
    content: Taking out the trash.
  - label: D
    content: Looking for fun and different ways.
  group_stem: '(三)

    Turn Old Things into New Fun Things!

    Today, many people know that recycling is good for the Earth. But sometimes, recycling
    can be a little difficult. There is another fun way to help the Earth—you just
    need to use your imagination. It''s upcycling!

    Recycling usually means taking things like old bottles or paper, breaking them
    down, and turning them into something new. However, it is often less special.
    Upcycling is different. It means turning old things into something useful and
    pretty—without fully breaking them down!

    You can use upcycling in your daily life. For example, you can make a cool new
    bag from your old T-shirts. Don’t throw away used bottles! You can paint them
    with bright colors and turn them into eye-catching lamps. Old birthday cards?
    Turn them into cute bookmarks! With upcycling, you can give new use to old things.

    Upcycling is a great way to help the Earth. Why not try it? If you use a little
    time and think outside the box, you can turn your old things into special new
    things!

     imagination 想像力 used 使用過的 bookmark 書籤'
