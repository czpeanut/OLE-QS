  group_stem: (八)、竹筍是一種常見的食材，竹筍帶有苦味是因為含有化合物X，若化合物X 在酵素參與催化下和水反應，產物之一為有毒的氫氰酸(HCN)，可避免被動物取食，是植物本身的一種保護機制。當竹筍從地下莖冒出土，筍尖被陽光照射後會轉為綠色，俗稱「出青」。竹筍的尖端嫩芽，尤其是出青的竹筍嫩芽，含有較多的化合物X，所以此部位更易帶有苦味。有鑒於此，農民常在竹筍生長處事先覆蓋土壤或使用其他方式，以避免竹筍出青，對品質和口感帶來影響。請回答下列問题38
