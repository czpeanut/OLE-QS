- id: doc_113_台南_復興_自然_g8s1e2_s3_1
  section: 3
  number: 1
  type: single
  page: 5
  stem: 超音波在人體內產生的主要現象不包括：
  options:
  - label: A
    content: 加熱效應
  - label: B
    content: 冷卻效應
  - label: C
    content: 穴蝕效應
  - label: D
    content: 反射
  group_stem: '光聲合璧，照亮醫學新世界 （本文修改自：https://case.ntu.edu.tw/blog/?p=37457 ，作者：台灣大學電機工程系教授
    李百祺）


    你聽過超音波嗎？產檢時，醫生用它來觀察胎兒的成長。而你知道，聲音除了能聽，還能「看」嗎？這就要談到一個有趣的現象：光聲效應。


    我們都知道聲音是由物體振動產生的，它會在空氣中傳播，當傳到我們的耳朵時，會使耳膜振動，我們就聽到了聲音。超音波是一種頻率高到人耳聽不見的聲波，它具有穿透力強、方向性好等特點，因此被廣泛應用於醫學領域。當超音波進入人體時，會與身體組織產生交互作用，一部分能量會被吸收，轉化為熱能。這個過程就叫做「加熱效應」。如果能精確控制超音波的能量和作用時間，就能利用熱能來治療疾病。

    除了加熱效應，超音波還可能產生「穴蝕效應」。簡單來說，就是超音波在液體中產生微小的氣泡，這些氣泡在不斷生長和破裂的過程中，會產生強大的衝擊波，可以破壞細胞。這個現象在醫學上也有重要的應用。


    那麼，光和聲有什麼關係呢？一百多年前，科學家就發現了光聲效應。他們發現，當光照射到某種物質時，物質會吸收光能，產生熱量，進而產生微小的振動，也就是聲波。這個現象為醫學影像帶來了新的可能。

    傳統的超音波影像雖然可以穿透人體，但對於軟組織的分辨能力有限。而光學影像雖然可以提供高解析度的圖像，但穿透深度有限。為了克服這些限制，科學家將光和超音波結合起來，發展出了光聲成像技術。


    光聲成像的工作原理是：首先，用一束脈衝光照射人體組織，不同的組織會吸收不同波長的光，產生不同的熱量。這些熱量會引起組織的微小膨脹，產生超音波。然後，用超音波探頭接收到這些超音波，並將其轉換成圖像。

    光聲成像具有許多優點：

    · 高空間解析度：可以清晰地顯示組織的微小結構。

    · 高穿透深度：可以穿透較深的組織，例如骨骼。

    · 對比度高：可以清楚地區分不同種類的組織。

    光聲成像在醫學領域具有廣闊的應用前景，例如：

    · 腫瘤診斷：光聲成像可以早期發現腫瘤，並準確地定位腫瘤的位置和大小。

    · 血管成像：光聲成像可以無痛、無輻射地對血管進行成像，有助於診斷心血管疾病。

    · 分子影像：透過引入特殊的造影劑，光聲成像可以實現對特定分子的檢測，有助於早期診斷疾病。

    請回答以下問題'
