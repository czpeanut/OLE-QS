- id: doc_113_新北_中平_社會_地理_g7s2e1_s1_35
  section: 1
  number: 35
  type: single
  page: 1
  stem: '據內政部人口統計資料顯示，六都2024 年人口與2023 年相比，桃園市人口數增加最多、達21203 人。老師請同學尋找新聞資料，並分享桃園市人口成長成為六都之冠的原因。由三人對話判斷，桃園市的人口成長較其他縣市高，主要與【圖1】中的哪些數據有關？

    阿羽：「我發現桃園自從升格直轄市後，大型公共建設、重劃區開發題材一波接一波，房價相近起鄰近的城市又相對親民，未來前景看好。」

    阿華：「桃園的生育獎勵曾經為全臺最高，每胎補助3 萬元，打造從準備懷孕到懷孕後，生產後的友善親子空間，『催生』成效顯著，引來其他縣市跟進。」

    阿涵：「近幾年的新聞報導，許多企業將總部、聯絡處遷至桃園，機捷開通之後，捷運站周邊生活圈逐步成形，也增加不少就業機會。」'
  options:
  - label: A
    content: 甲丙
  - label: B
    content: 乙丙
  - label: C
    content: 丙丁
  - label: D
    content: 甲丁。
