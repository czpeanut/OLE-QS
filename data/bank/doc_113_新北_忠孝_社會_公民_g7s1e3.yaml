- id: doc_113_新北_忠孝_社會_公民_g7s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 在學校中，我們會透過班會來討論與決定班級的公共事務，下列有關班會進行方式的說明何項正確？
  options:
  - label: A
    content: 由導師宣布會議的開始及開會的目的
  - label: B
    content: 會議之前提出動議並由一人以上附議
  - label: C
    content: 表決採取先提名先表決及多數決原則
  - label: D
    content: 報告事項完畢時，先討論臨時動議
