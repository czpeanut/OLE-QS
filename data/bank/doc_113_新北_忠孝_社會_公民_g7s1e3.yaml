- id: doc_113_新北_忠孝_社會_公民_g7s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 日光小林社區的大武壠族人透過歌舞文化節，所傳達的理念為下列何項？
  options:
  - label: A
    content: 基本政治組織
  - label: B
    content: 生產分配中心
  - label: C
    content: 發展部落經濟產業
  - label: D
    content: 傳承族人的傳統文化
  group_stem: 莫拉克風災造成當時高雄縣甲仙鄉小林村覆滅，但倖存的小林人並未沉溺於傷痛，反而努力復振流逝的文化。部分倖存的族人移居杉林區日光小林社區，族人們在復振產業及文化中找回重新生存的價值。日光小林社區自獲得高雄市文化局挹注經費後，開辦「大武壠族歌舞文化節」，作為重現文化溯源成果的舞臺，許多離鄉遊子也於此時重返故鄉相聚，傳承文化香火。
  tags:
