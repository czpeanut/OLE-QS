  section: 1
  number: 10
  type: single
  page: 1
  stem: 桃園原住民族人口超過8 萬6 千餘人，其中阿美族為該市原住民人口數最多的族群，阿美族部落的族人十分遵守祖先的智慧，不會竭澤而漁，也體現循環經濟的精神，其中，阿美族祖靈祭每年都會在部落頭目及祭司的帶領下，進行祈福儀式，祈求祖靈保佑農事豐收、族人平安順遂，同時也傳承祖先的訓示。上述內容主要彰顯部落對原住民族的何項重要性？
  options:
  - label: A
    content: 傳統信仰重心
  - label: B
    content: 基本政治組織
  - label: C
    content: 生產分配中心
  - label: D
    content: 語言文化傳承
