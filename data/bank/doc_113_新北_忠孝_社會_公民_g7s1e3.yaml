  stem: 由多名原住民教育界人士在新竹縣組成的泰雅學堂，多年來推廣音樂、美術、講座和親子共讀，其成立的「泰雅之聲和青少年合唱團」更在國內、外多項音樂大賽中屢摘大獎。另外尖石鄉有6
    所學校串聯，以區域整合的方式，發展音樂特色課程，其主要是希望從音樂教育達到下列何項目標？
