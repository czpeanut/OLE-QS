  stem: 和平社區的居民想藉由提升民眾活動中心的使用率，爭取成為模範社區，於是決定募款購置電腦網路設備，作為社區青少年休閒的場所，並開辦各項有助聯繫情感的活動，提升居民的歸屬感。請問：上述做法最能表現何項概念？
