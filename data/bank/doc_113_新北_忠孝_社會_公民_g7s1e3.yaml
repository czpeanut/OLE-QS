  section: 1
  number: 7
  type: single
  page: 1
  stem: 布農族的卡度部落召開部落會議，積極推動部落傳統領域的劃設工作，針對與邵族傳統領域出現重疊爭議的土地，希望能提出新事證，以和平理性的方式進行協商、化解爭端。根據上述，部落會議主要具備何項功能？
  options:
  - label: A
    content: 決定部落事務
  - label: B
