  section: 1
  number: 14
  type: single
  page: 1
  stem: 小林村舊址因莫拉克風災重度受創，被畫為禁止開發的區域，倖存的族人移居重生，這顯示原住民族部落與大自然的關係應為下列何者？
  options:
  - label: A
    content: 強調物競天擇
  - label: B
