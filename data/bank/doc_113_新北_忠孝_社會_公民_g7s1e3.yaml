- id: doc_113_新北_忠孝_社會_公民_g7s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 政府近年來推動「地方創生」，面對農村地區的人口老化、青年人口外移，在地公所如何連結地方組織，帶動在地居民參與，共同尋找重振地方發展的策略，進而使農村地區人口回流，成為各個鄉鎮必須思考的重要課題。關於地方創生的敘述，下列何項正確？
  options:
  - label: A
    content: 無法和社區永續發展並存
  - label: B
    content: 目的在於解決環境生態議題
  - label: C
    content: 與社區永續發展皆強調讓地方特色被看見
  - label: D
    content: 與社區居民的公共參與並不相關
