- id: doc_113_新北_忠孝_社會_公民_g7s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 社區是指居住在某一特定地區的一群人，由於彼此常往來接觸且生活息息相關，而形成的公共生活領域。請問：下列關於社區的敘述何項正確？
  options:
  - label: A
    content: 社區組織是社區組成最關鍵的要素
  - label: B
    content: 社區意識指居民對社區的認同感和歸屬
  - label: C
    content: 社區的範圍有明確的界線，須由相關單位認定
  - label: D
    content: 社區居民的共同關係來自於其屬於相同的原住民族
