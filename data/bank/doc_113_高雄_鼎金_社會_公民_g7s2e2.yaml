- id: doc_113_高雄_鼎金_社會_公民_g7s2e2_s1_41
  section: 1
  number: 41
  type: single
  page: 1
  stem: 聯合國訂定12 月18 日為國際移民日，我國是擁有許多新移民與移工的國家，我國也於2011 年開始將每年12 月18 日訂為移民節，並舉辦各種慶祝活動，活動內容包括由新移民帶來其原生母國的特色舞蹈表演與美食料理，除了讓民眾在活動過程體驗多元文化之美，更透過這樣的機會感謝新移民與移工對臺灣的付出。請問：下列何者最可能是上述節日舉辦相關慶祝活動的理由？
  options:
  - label: A
    content: 增進不同文化之間的交流互動，促進尊重異國文化
  - label: B
    content: 加速多元族群融合，降低文化多樣性避免社會分歧
  - label: C
    content: 放寬移工歸化限制，吸引外籍人士補足我國勞動力
  - label: D
    content: 提供移民舉辦宗教活動的環境，保障信仰宗教自由。
