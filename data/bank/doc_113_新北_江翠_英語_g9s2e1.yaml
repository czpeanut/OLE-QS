- id: doc_113_新北_江翠_英語_g9s2e1_s5_33
  section: 5
  number: 33
  type: single
  page: 4
  stem: Why do people need to think carefully when using AI?
  options:
  - label: A
    content: AI always makes mistakes and can’t even find answers.
  - label: B
    content: AI can find answers, but people must check them.
  - label: C
    content: AI does not know how to read and say the answer.
  - label: D
    content: AI cannot help with problems that people face.
  group_stem: 'The world is changing because of AI (Artificial Intelligence). Many
    jobs are different now. Though many jobs use AI, people are still very important.
    Here are some important skills necessary for people in the future:

    1. Thinking Carefully – AI can find answers, but people need to check if they
    are correct or not. It is important for people to think and solve problems.

    2. Creativity – AI can help, but it cannot make new ideas like people. Artists,
    designers, and businessmen need to be creative.

    3. Learning New Things – Technology changes fast. People who can learn new things
    quickly will have better jobs.

    4. Speaking Skills and Empathy – AI cannot understand feelings like people. Good
    speaking skills and understanding how other people feel are important in jobs
    like teaching and healthcare.

    5. Combining Different Skills – Many jobs need knowledge in different areas. For
    example, business and technology work together. It is good to understand different
    subjects.

    6. Understanding AI and Data – Even if you are not a programmer, it is good to
    understand how AI works. This helps you work better with technology.

    AI can do simple jobs, but people can create new ideas. Those who always learn
    and try new things will have a better chance of success in the AI era. Now is
    the time to think about what skills you can develop to make sure that your career
    will be safe in the future.

     necessary 必要的  technology 科技  empathy 同理心  data 資料，數據  programmer 程式設計者'
