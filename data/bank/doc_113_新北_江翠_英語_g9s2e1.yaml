  group_stem: 'FOMO: Fear of Missing Out

    With the rise of social media, FOMO is becoming more and more common. FOMO stands
    for “fear of missing out.” It is a worry you might have that others are having
    more fun,   40.   better lives, or experiencing better things than you are. For
    example, you feel sad when your friends are chatting excitedly about a new movie
    you haven’t seen.

    FOMO can create some problems. It may lead to Internet addiction. Because you
    don’t want to miss out on things, you’ll keep checking social media. What’s more,
    FOMO can cause attention problems. When you check your phone every five minutes,
    it’s hard to focus. FOMO can also cost you money. Because you want to do what
    everyone is doing, you follow   41.   trend, like eating at an Internet-famous
    restaurant or buying a video game everyone is playing. In the end, you spend money
    on things you don’t need.

    How do you stop FOMO? One simple way is to just take a break from social media.
    Turn off your phone or computer. Also, change your focus.   42.   about what you
    don’t own. Live in the moment and enjoy life.

    FOMO happens to almost everyone.   43.  , you have the power to stop it. Change
    a letter and go from FOMO to JOMO (joy of missing out).

     social media 社群媒體  trend 趨勢，潮流，時尚                  資料來源：翰林九下課本P. 47'
