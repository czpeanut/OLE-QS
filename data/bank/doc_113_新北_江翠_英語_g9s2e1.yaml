  group_stem: "The Story of Captain Wang Sheng-Ying\nWang Sheng-Ying is the first\
    \ female captain in Taiwan and the only female pilot in Iceland. Her life is full\
    \ of challenges and success. She shows that women can be strong leaders in the\
    \ shipping industry.\nWang Sheng-Ying grew up in Taiwan. Her father was a captain,\
    \ so she loved the ocean from a young age. She studied at National Taiwan Ocean\
    \ University and became a third officer in 2004. She worked very hard and became\
    \ Taiwan’s first female ship captain in 2010. But she wanted to learn more. In\
    \ 2020, she moved to a small town in Iceland where only about 2,700 people lived.\
    \ The fjords in Iceland make it difficult for foreign ships to stop without help,\
