  section: 1
  number: 4
  type: single
  page: 1
  stem: 請問發生八二三炮戰的時間，臺灣內部不會遇上下列哪個狀況？
  options:
  - label: A
    content: 積極扶植輕工業、生產民生必需品，限制外國的相關產品口
  - label: B
    content: 白色恐怖時期雷震案發生
  - label: C
    content: 推動十大建設計畫，帶動景氣復甦
  - label: D
    content: 加入世界貿易組織。
  group_stem: 八二三砲戰，又稱第二次臺灣海峽危機（英語：Second Taiwan Strait Crisis）。中國人民解放軍與中華民國國軍以隔海砲擊為主要戰術行動，因此稱為砲戰。中國人民解放軍首先發起砲戰，中華民國國軍隨即開始反擊。砲戰初期，解放軍攻擊島上軍事目標，後期著重封鎖海運線。砲戰期間，雙方海軍艦艇和空軍也多次戰鬥。10
    月初，解放軍宣布放棄封鎖，改為「單打雙不打」（逢單日砲擊，雙日不砲擊），逐漸減少攻勢。至此，中華民國成功守衛前線地區。中華人民共和國維持單打雙不打，直到1979
    年1 月1，通過《告臺灣同胞書》正式宣布停止砲擊。此次戰役是國共雙方陸海空軍至今最後一次大型軍事衝突，期間雙方的軍事衝突侷限於海上，並逐漸停止。
  tags:
