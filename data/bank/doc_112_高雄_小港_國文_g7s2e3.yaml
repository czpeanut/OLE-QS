  stem: 關於這篇文章內容，下列敘述何者錯誤？
  options:
  - label: A
    content: 茶葉分類可從茶樹的品種與製茶的方式來區分
  - label: B
    content: 茶葉發酵程度中，發酵最輕的是紅茶、最重的是綠茶
  - label: C
    content: 文山包種茶中最有名的是來自於坪林所產製
  - label: D
