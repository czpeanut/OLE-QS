  group_stem: "齊王一日臨朝①，顧謂侍臣曰：「吾國介於數強國間，歲苦支備②，今欲調丁壯，築大城，自東海起，連即墨，經大行，接軒轅，下武關，逶迤③四千里，與諸國隔絕。使秦不得窺④吾西，楚不得竊吾南，韓魏不得持吾之左右，豈不大利耶？今，百姓築城，雖有少勞⑤，而異日不復有征戍侵虞⑥之患，可以永逸矣。聞吾下令，孰不欣躍而來耶？」艾子對曰：「今旦大雪，臣趨朝，見路側有民，裸露僵踣⑦，望天而歌。臣怪之，問其故。答曰：『大雪應候⑧，且喜明年人食賤麥，我即今年凍死矣。』正如今日築城，百姓不知享永逸者當在何人也。\
    \ 」                                                               （蘇軾艾子雜説）\n注釋\
    \ \n① 臨朝：指帝王到朝廷上處理政務。 \n② 支備：調度戰備。 \n③ 逶迤：彎彎曲曲延續不絕的樣子。 \n④ 窺：窺伺可乘之機。 \n⑤ 少勞：稍增勞累。\
    \ \n⑥ 侵虞：侵犯。 \n⑦ 踣ㄅㄛˊ：跌倒。 \n⑧ 應候：順應時令。"
