  group_stem: "心理效應，是指大多數人在相同的情況下或對某種相同的刺激，產生相同或相似的心理反應的現象，它具有普遍性，也具有差異性。 \n煮蛙效應：把一隻青蛙直接放進熱水鍋裡，由於它對不良環境的反應十分敏感，會迅速跳出鍋外。如果把一個青蛙放進冷水鍋裡，慢慢地加溫，青蛙並不\
    \ 會立即跳出鍋外，水溫逐漸提高的結局是青蛙被煮死了，因為等水溫高到青蛙無法忍受時，牠已經來不及、或者沒有能力跳出鍋外了。 \n破窗效應：一個房子如果窗戶破了，沒有人去修補，隔不久，其他的窗戶也會莫名其妙地被人打破；一面牆，如果出現一些塗鴉沒有被清洗掉，很快的，牆上就佈滿了亂七八糟、不堪入目的東西；一個很乾淨的地方，人們不好意思丟垃圾，但是一旦地上有垃圾出現之後，人們就會毫不猶疑往地上拋，絲毫不覺得羞愧。這真是很奇怪的現象，但就是事實。\
    \ \n責任分散效應：美國紐約郊外某公寓前，一位年輕女子在結束酒吧的工作回家路上遇刺。當她喊叫：「救命!\n救命!」聽到喊叫聲，附近住戶亮起了燈，打開了窗戶，兇手嚇跑了。當一切恢復平靜後，兇手又返回作案，當她又呼救時，附近的住戶又打開了電燈，兇手又逃跑了。當她認為已經無事，回到自己家上樓時，兇手又一次出現，將她殺死在樓梯上。只因最後儘管她大聲呼救，鄰居中至少有38\
    \ 位到窗前觀看，但無一人來救她，甚至無人打電話報警。這引起紐約社會的轟動，也引起社會心理學工作者的重視和思考。 \n馬太效應：聖經馬太福音裡有個故事：一個主人準備出門，將他的財產交給他的僕人管理。他給其中一個僕人5,000\
    \ 個銀子，給另一個僕人2,000 個銀子，再給另一個僕人1,000 個銀子，每個人都按照自己的才能得到不同數量的金錢。那個得到5,000 個銀子的僕人立刻開始經商，將這5,000\
    \ 個銀子投資，最終賺了另外5,000個銀子。那個得到2,000 個銀子的僕人也用同樣的方式投資，最後賺了另外2,000 個銀子。然而，那個只得到1,000\
    \ 個銀子的僕人卻害怕失敗，於是他把銀子埋在地裡。 \n    一段時間後，主人回來了，要求僕人們交出他們所得的利潤。得到5,000 個和2,000 個銀子的僕人都把所獲得銀子翻漲一倍，主人非常高興地給他們獎賞。然而，得到1,000\
    \ 個銀子的僕人卻將這1,000 個銀子還給了主人，也因為害怕失敗而沒有進行投資，更不可能獲得任何利潤，於是主人就嚴懲這位僕人。 \n月暈效應：俄國大文豪普希金曾狂熱愛上了「莫斯科第一美人」的娜坦麗，並和她結了婚。娜坦麗容貌驚人，但與普希金志不同、道不合。當普希金每次把寫好的詩讀給她聽時，她總是捂著耳朵不聽！相反，她總是要普希金陪她遊樂，出席豪華的晚會、舞會，普希金為此丟下創作，弄得債臺高築，最後還為她決鬥而死，使一顆文學巨星過早地隕落。在普希金看來，一個漂亮的女人也必然有非凡的智慧和高貴的品格，然而事實並非如此。\
    \                                                                （改編自維基百科）"
