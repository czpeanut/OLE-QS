  group_stem: "茶葉的分類 \n走進茶行，林林總總的茶葉名稱，常讓許多人大惑不解，其實茶的分類主要有兩大原則：一是茶樹的品種，二是不同的製茶方式。 \n\
    品種 \n  常見的茶樹品種有：軟枝烏龍、金萱、翠玉、鐵觀音、武夷茶等；同一品種採用不同的製作方式，就是不一樣風味的茶，如金萱可製成烏龍茶，也能製成包種茶；但每一品種也都有最能表現其特色的製茶法，如翠玉就適合做成半發酵茶。至於最近流行的「高山茶」，則是指種植於海拔一千二百公尺以上地區的茶，並不專指特定品種。\
    \ \n製茶方式 \n  製茶過程中發酵程度的高低、揉捻出的不同外形，都可使茶葉有不同的風味表現；我們常聽的凍頂茶、包種茶、冷凍茶、白毫烏龍等，就是以不同方法製出的茶葉名稱。以發酵度來說，不發酵者，湯色青綠，如：龍井等，一般稱為「綠茶」；輕度發酵、中度發酵至重度發酵茶，湯色則由蜜綠轉金黃至深黃；至於全發酵茶，如：紅茶，湯色則偏紅褐。\
    \ \n  臺灣幾個重要茶產區，因為茶樹品種、製茶技術上的差異，多年來各自發展出具代表性的地方名茶，如坪林的文山包種茶、鹿谷的凍頂烏龍茶、木柵的鐵觀音、鶴岡的紅茶等。"
