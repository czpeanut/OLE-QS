  section: 2
  number: 41
  type: single
  page: 4
  stem: 根據文中所述，以哪一個成語為題最適當？
  options:
  - label: A
    content: 暗箭傷人
  - label: B
    content: 劍拔弩張
  - label: C
    content: 百步穿楊
  - label: D
    content: 射石飲羽
  group_stem: "□□□□                              \n    楚國有個著名的射箭手，名叫養由基。此人年輕時就勇力過人，練成了一手好箭法。當時還有一個名叫潘虎的勇士，也擅長射箭。一天，兩人在場地上比試射箭，許多人都圍著觀看。靶子設在五十步外，那裏撐起一塊板，板上有一個紅心。潘虎一連三箭都正中紅心，博得圍觀的人一片喝采。潘虎洋洋得意地向養由基拱拱手，表示請他指教。\n\
    \    養由基環視一下四周，說：「射五十步外的紅心，目標太近、太大了，還是射百步外的柳葉吧！」說罷，他指著百步外的一棵楊柳樹，叫人在樹上選一片葉子，塗土紅色作爲靶子。接著，他拉開弓，「嗖」的一聲射去，結果箭鏃正好貫穿在這片楊柳葉的中心。在場的人都驚呆了。潘虎自知沒有這樣高明的本領，但又不相信養由基箭箭都能射穿柳葉，便走到那棵楊柳樹下，選擇了三片楊柳葉，在上面用顔色編上號，請養由基按編號次序再射。\n\
    \    養由基走前幾步，看清了編號，然後退到百步之外，拉開弓，「嗖、嗖、嗖」三箭，分別射中三片編上號的楊柳葉。這一來，喝采聲雷動，潘虎也口服心服。就在一片喝采聲中，有個人在養由基身旁冷冷地說：「嗯，有了這樣的的本領，才可以教他射箭了！」養由基聽此人口氣這麽大，不禁生氣地轉過身問道：「你準備怎樣教我射箭？\
    \ 」\n    那人平靜地說：「我並不是來教你怎樣彎弓射箭，而是來提醒你該怎樣保持射箭名聲的。你是否想過，一旦你力氣用盡，只要箭不中，你那百發百中的名聲就會受到影響。一個真正善於射箭的人，應當注意保持名聲！\
    \ 」養由基聽了這番話，覺得很有道理，再三向他道謝。               改寫自《戰國策.西周策》"
