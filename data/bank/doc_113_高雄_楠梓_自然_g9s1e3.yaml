questions:
- id: doc_113_高雄_楠梓_自然_g9s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 下列有關靜電感應、感應起電及接觸起電敘述，何者錯誤？
  options:
  - label: A
    content: 接觸起電後，原帶電體的電量減少
  - label: B
    content: 帶電體不經接觸，而使其他物體內正、負電分離的現象，稱為靜電感應
  - label: C
    content: 感應起電後，原帶電體的電量增加
  - label: D
    content: 接觸起電後，原帶電體與被接觸物體間所帶電性相同
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 理化
      code: 4-1
      title: 電荷與靜電現象
      chapter: 第4章 電流、電壓與歐姆定律
    textbook: 九上理化 4-1 電荷與靜電現象
    labeled_by: ai
- id: doc_113_高雄_楠梓_自然_g9s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 關於導體與絕緣體的敘述，下列何者正確？
  options:
  - label: A
    content: 絕緣體中因為不含任何的正、負電荷，所以不能導電
  - label: B
    content: 導體通常適合用摩擦起電方式來帶電
  - label: C
    content: 金屬導體幫助導電的粒子包含自由電子與自由質子
  - label: D
    content: 導體因含有可自由移動的電荷，所以可以導電
