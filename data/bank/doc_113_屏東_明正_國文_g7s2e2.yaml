    content: 趙孟頫非常喜歡〈定武蘭亭真本〉曾留下題跋
  - label: D
    content: 〈定武蘭亭真本〉是傳世唐代拓本。
  group_stem: '八八節到故宮南院欣賞千古名作！國立故宮博物院南部院區人氣國寶展8 月8 日起以「蘭亭的遊與思」為題，展出書法國寶〈定武蘭亭真本〉及〈春水玉飾〉、黃振效〈雕象牙蘭亭脩禊小插屏〉等11
    件與蘭亭主題相關的器物；重達95 公斤的故宮最大鼎「嬰祖丁鼎」重磅回歸，展期至113 年11 月3 日止。

    策展人故宮書畫文獻處助理研究員陳建志指出，相傳永和9 年（西元353 年）書聖王羲之作〈蘭亭序〉。原蹟亡佚，但因鍾愛王羲之書法的唐太宗曾命人摹搨，隨之幻化出各式各樣的分身。石刻拓本中又以點畫結構近似歐陽詢的〈定武蘭亭〉為最佳，因其刻石在定武（今河北真定縣）發現而得名。

    陳建志說，〈定武蘭亭〉是中國書法史上理解王羲之、歐陽詢書法，以及刻帖的製作與演變至關緊要的範本之一，國立故宮博物院院藏〈定武蘭亭真本〉為傳世最完整的宋拓善本，106
    年文化部核定為國寶，也是故宮院藏碑帖中唯一指定為國寶的文物；歷代文人書家如趙孟頫等「心想手追」，於前、後隔水及拖尾處所留下的每一段題跋款識，娓娓道出每人心中不一樣的蘭亭故事，值得細細品味琢磨。'
