  stem: 根據上文，何者正確？
  options:
  - label: A
    content: 避免暗路危險，應以強光照射
  - label: B
    content: 涼爽的秋天正適合賞螢
  - label: C
    content: 下過雨的夜晚，看不到螢火蟲
  - label: D
    content: 適合賞螢的時間為戌時。
  group_stem: '那瑪夏與螢共舞(4/2—5/1)

    ─賞螢須知─

    ★最佳賞螢時間：晚間7：00～8：30 左右

    ★勿拿手電筒直接照射

    汽車、手電筒的光害都會影響螢火蟲發光，且強光會影響螢火蟲求偶。螢火蟲看不見紅光，所以包紅色玻璃紙發出紅光的手電筒，對螢火蟲的干擾最小。

    ★勿大聲喧譁

    大聲喧譁會影響周遭氣流波動，這種微幅的氣流變化，對螢火蟲是很嚴重的干擾。

    ★勿進入草叢

    因為螢火蟲是在草叢或樹林間羽化，且賞螢季節易有蛇類出沒，為了螢火蟲的繁衍與個人的安全，千萬不要進入草叢與樹林。

    ★勿捕捉螢火蟲

    被人類觸碰過的螢火蟲，會被同伴排擠，且螢火蟲容易因受驚嚇或手觸摸而死亡。

    ★大雨的夜晚不適合賞螢

    螢火蟲喜歡有點潮溼、溫暖的天氣，所以下過雨的夜晚，更容易看到螢火蟲。但風很大、下超大豪雨、溫度明顯下降的夜晚，則不適合賞螢。'
