  group_stem: "在西方眾多語言中，區分男女性別的歷史由來已久。以英語為例，表示女性第三人稱單數詞的符號，就經歷了從古英語裡的「hēo」到中世紀至現代英語中「she」的變化過程。一般認為，「she」字大約形成於12-13\
    \ 世紀，屬於中世紀英語的產物，但它並非單純從hēo 轉化而至，同時更是受到了古英語裡陰性定冠詞sēo 的直接影響。在東方的中國和日本，表示女性第三人稱單數代詞的「她」和「彼女」（かのじょ），則產生的歷史都很短。「彼女」在日本流行開來不過120\
    \ 年左右的時間，而「她」字在中國的現代認同史，總共也還不到90 年。它們都是近世以來東西文化交流互動的歷史結晶。\n                  \
