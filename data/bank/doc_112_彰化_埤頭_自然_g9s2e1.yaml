  section: 1
  number: 43
  type: single
  page: 3
  stem: 根據課文中的資料，在人工造雨的作業中，不適合使用下列哪一種物質？
  options:
  - label: A
    content: 氣態二氧化碳($\text{CO}_{2}$)
  - label: B
    content: 固態二氧化碳($\text{CO}_{2}$)
  - label: C
    content: 氯化鈉(NaCl)晶體
  - label: D
    content: 碘化銀(AgI)晶體。
  group_stem: 久旱不雨，地面嚴重缺水時，人們常用人工造雨的技術增加降雨量。當有鋒面過境，低壓籠罩或颱風接近時，是實施人工造雨作業的良好時機。造雨的方法會隨雲的性質而不同：在0℃以上的暖雲內可撒播鹽粒，鹽粒會吸收水分，使其周圍的小水滴向它靠攏，迅速變成大水滴，最後成為雨滴掉下來；在0℃以下的冷雲中可撒播乾冰，乾冰會使周圍空氣的溫度急速下降，以致雲中的水氣或水滴迅速凝結成冰晶，並使附近的水氣以它為核心而凝結，如此不斷增大其體積，最後形成雨滴降落地面。此外也可使用碘化銀，將它撒播在雲層中或在地上焚燒，碘化銀的蒸氣在0℃以下的雲層中會形成微粒，產生類似前述冰晶的效果。根據專家評估，經由以上技術最多只能增加10~15%的降雨量。請回答下列的問題：
