- id: doc_113_台北_仁愛_國文_g7s1e1_s4_32
  section: 4
  number: 32
  type: single
  page: 4
  stem: 根據上文，有關這兩種心態的特色，何者敘述正確？
  options:
  - label: A
    content: 「人能學習新的東西，但實際上無法改變自己的智能水準」──成長心態
  - label: B
    content: 「沒有打算要成為第一，只是替自己認為值得投入的事努力以赴」──固定心態
  - label: C
    content: 「如果你需要在某件事上作出努力，那一定代表你不擅長這件事」──成長心態
  - label: D
    content: 「讓外界以為自己沒有付出太多努力，因為真正優秀的人哪裡需要努力」──固定心態。
  group_stem: '卡蘿·德魏克博士提出兩種心態：一種是因為怕失敗而逃避問題，稱作「固定心態」。一種是視問題為學習的機會，稱為「成長心態」。前者相信：人的智商和才能是固定的，可決定人是否成功。後者相信：經過練習可發展出新能力。

    班上有A、B 兩位同學。A 認為：學得來就學，學不來就放棄。B 認為如果自己的慾望夠強，就能學會任何東西。上體育課時要跳鞍馬，A 選擇逃避挑戰，因為他怕自己動作笨拙被人嘲笑。B
    則覺得有趣，他知道失敗是學習的一部分，若努力嘗試，最終不會有人笑他。A 逃避回饋意見，當老師告訴他要如何修改作業時，他認為老師是在批評他。B 知道，為了改進，他需要建設性的批評，他也了解老師不是在針對他，而是在評量他的作業成果。A
    練習吉他，只要卡住就不練了，B 每天打鼓15 分鐘，雖然不順利，但他知道，努力是通往更有趣的生活的必經之路。B 喜歡看別人成功，他會鼓勵朋友進步，因為他也能跟著成長。若A
    的朋友嘗試新事物且成功了，A 會覺得受到威脅，他擔心朋友的成功是一種壓力，迫使他得做更多。

    實驗證明大腦跟身體的肌肉一樣，會隨著鍛鍊而成長，後天的教養也比先天的素質更重要。面對環境改變，兩種心態會做出不同選擇，但假使能做出持久的改變，你認為一個人會從固定心態變為成長心態嗎？

    〈網路文章〉'
