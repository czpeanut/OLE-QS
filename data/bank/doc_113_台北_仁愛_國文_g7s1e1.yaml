  stem: 文中這串珍貴的荔枝，不僅讓作者一家兩代十口人品嘗，還分享給巷裡的每一家人。下列何者最適合形容作者家人的做法？
  options:
  - label: A
    content: 沒有規矩不能成方圓
  - label: B
    content: 天下沒有白吃的午餐
  - label: C
    content: 獨樂樂，不若與人樂樂
  - label: D
    content: 冰凍三尺，非一日之寒。
  group_stem: "一直到小學五年級，我才第一次吃到荔枝。\n 在竹東林場工作的大哥，坐了兩天一夜的車子，回鄉探親時，特地帶了一串「很少有人見過的荔枝」，讓我們見識。\n\
    \ 在我們花蓮的後山，黃色的木瓜、紅色的蓮霧、皺巴巴的綠皮芭樂之外，香蕉、甘蔗，還有當正餐或零食的番薯也不少，偏是「長眼睛沒見過」這種粗粗的、紅紅的，聞不出什麼氣味的荔枝。\n\
    這串珍果被擺在神明廳的供桌上，先讓左鄰右舍聞風趕來的觀眾，輪番看了一回，直到第三天才公開享用。我們一家兩代十口人，一人分得一粒，其餘不多不少的，巷裡的每一家人都分得一粒。\n\
    \ 習慣了大啃西瓜，大口吃木瓜和芭樂的我，面對這麼一粒秀氣的荔枝，一時還拿不定主意。該是一口解決呢？還是拿鉛筆刀削片處理？是飯前吃？還是飯後食用比較理想？是在榕樹下獨自品嘗？還是帶去學校公開亮相比較過癮？用便當盒裝？還是用透明玻璃杯捧著比較好？\n\
    \ 這粒命運坎坷的荔枝，幾經折騰，被我握在掌心一整天，終於由我和三個好友分享。當然他們和我一樣，吃得很仔細，也品嘗得很滿意。那個阿洛說：「荔枝真好吃，它的肉是熱的呀！這種水果太少了，不知道種在哪裡？以後畢業旅行，我們什麼地方不去，一定要老師帶我們去參觀荔枝樹。」\n\
    李潼〈油條報紙．文字夢熱荔枝〉"
