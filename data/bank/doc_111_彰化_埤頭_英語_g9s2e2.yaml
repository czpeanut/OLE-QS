- id: doc_111_彰化_埤頭_英語_g9s2e2_s5_45
  section: 5
  number: 45
  type: single
  page: 3
  stem: What is the best title for the reading?
  options:
  - label: A
    content: A City of Love.
  - label: B
    content: A City of Festival.
  - label: C
    content: A Forgotten Old City.
  - label: D
    content: A City with A Long History.
  group_stem: 'Siena is an old city in the north of Italy. It began with a group of
    people living on its hills over 2,900 years ago. Around the year 1100, Siena became
    an important business center in Italy. In 1472, the first bank of the world was
    built in this city and has been doing business ever since.

    Today Siena is famous for keeping its “old face.” For example, its city walls,
    which helped keep the city safe in the past, are hundreds of years old now and
    look almost the same as before. Also, many old buildings are seen at the Piazza
    del Campo, the most important meeting place of the city. Few things have really
    changed in this center of public life for hundreds of years. Now people still
    go to the open space for sharing news, shopping, or playing sports. There is one
    more thing that helps keep Siena''s old face: cars cannot enter the city most
    of the time.

    True, Siena is old, but it is beautifully old. People are welcome to visit this
    beautiful city and walk into the past.'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
