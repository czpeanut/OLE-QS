  stem: Why do some people think cilantro tastes like soap?
  options:
  - label: A
    content: It is because cilantro is washed by soap.
  - label: B
    content: It has chemicals called aldehydes.
  - label: C
    content: The soap taste comes from the way it is stored.
  - label: D
    content: It is because cilantro smells good.
  group_stem: 'V. 閱讀測驗(2分/題, 共20分)


    [51-53]


    Cilantro: Love It or Hate It?


    Cilantro is an herb that people either love or hate. Some people really enjoy
    its fresh taste, while others don''t. But no matter what you think of cilantro,
    it''s one of the most popular herbs in the world.


    For most people, cilantro adds a good taste to many dishes. However, some people
    find that it doesn''t taste good at all. This difference in taste is actually
    has something to do with our genes. A 2012 study showed that the soapy taste some
    people experience results from chemicals called aldehydes, which are found in
    cilantro. People who hate cilantro have a gene that makes them have more strong
    feeling to these aldehydes, making it taste like soap! But don''t worry if you
    don''t like cilantro''s taste! You can still enjoy it by mixing it with other
    strong and sweet fruits in juices. Cilantro is an important herb in many kinds
    of food from around the world. It''s used in Mexican, Indian, Chinese, Thai, North
    African dishes. You can find cilantro in soups and sauces, adding special smell
    to each meal.


    What do you think? Do you love or hate cilantro? Here are some viewpoints from
    Class 901:


    • "I only eat it in vegetable soup, which I grew to love in Scotland! I can''t
    really stand it in anything else." – Lisa

    • "I keep trying to like it because I love Mexican food, but there is something
    about the smell that turns me off." – Mish

    • "Not a fan. I think the taste covers other flavors." – Rachel

    • "Put me in the LOVE side. I always order things just because they have cilantro
    in them." – Rebecca

    • "Cilantro is a big part of Indian food, which I grew up eating. Nothing says
    home to me more than walking in the door and being hit with a dish of cilantro."
    – Ida


    📖 cilantro 香菜 herb 香草 gene 基因 soapy 肥皂味的 chemical 化學物質 aldehydes 醛類'
