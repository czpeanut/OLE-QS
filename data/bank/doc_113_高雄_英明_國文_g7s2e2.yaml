  group_stem: "一人素性最懶，終日偃臥①不起。每日三餐，亦懶於動口，懨懨絕粒②，竟至餓斃。冥王③以其生前性懶，罰去輪迴變貓。懶者曰：「身上毛片，願求大王賞一全體黑身，單單留一白鼻，感恩實多。」王問何故，答曰：「我作貓躲在黑地裡，鼠見我白鼻，認作是塊米糕，貪想偷吃，潛④到嘴邊，一口咬住，豈不省了無數氣力。」\
    \                                                  —《笑林廣記》 \n  注釋: ①偃臥：仰臥。②粒：米粒，此指食物。③冥王：閻羅王的俗稱，即陰間的主宰。④潛：暗中的。"
