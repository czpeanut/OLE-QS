- id: doc_113_高雄_英明_國文_g7s2e2_s6_6
  section: 6
  number: 6
  type: single
  page: 4
  stem: 依據上文，何者是調查石虎數量宜先克服的問題？
  options:
  - label: A
    content: 研究設備老舊
  - label: B
    content: 研究經費有限
  - label: C
    content: 研究人員缺乏
  - label: D
    content: 研究步驟混亂。
  group_stem: "透過石虎斑紋的辨識，有助於調查石虎分布範圍與族群量。每隻石虎兩側斑紋不同，因而須在獸徑兩邊都架設自動相機，但這些設備對經費拮据的研究人員而言，幾乎是不可能的任務。除了自動相機，利用毛髮陷阱並結合分子生物技術也可以辨識不同個體。但毛髮陷阱這類被動式的等待，往往效率不彰，因此近年有人嘗試透過偵測犬主動出擊，搜索貓科動物的排遺，再利用分子生物技術辨識排遺屬於哪一物種，甚至哪隻個體。這些非侵入式調查法，皆能提供保育所需的資訊，但也各有其限制。若能對動物進行定位追蹤，則可獲得活動範圍、移動模式、繁殖處所等更全面的資訊。雲豹在臺灣已難再現，而石虎正在苦苦掙扎，只要我們繼續努力，石虎就有希望。\
    \ \n—改寫自姜博仁〈重返山林〉"
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 國文
      code: 第六課
      title: 石虎是我們的龍貓
