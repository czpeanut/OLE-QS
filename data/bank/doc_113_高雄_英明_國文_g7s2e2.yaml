- id: doc_113_高雄_英明_國文_g7s2e2_s5_19
  section: 5
  number: 19
  type: single
  page: 3
  stem: "「 『雷聲始收，蟄蟲坯戶，水始涸。』就是說自此不會再聽到轟隆隆的雷聲，春天出來活動的小蟲也回到土裡，水氣不再像夏天時那麼充沛，反而可以感覺到空氣越來越乾燥。在這個季節裡，可是許多農作物的收成期，若此時晴空萬里，辛苦耕作一年的農夫將有好收成，每戶農家都會開懷唱歌，慶祝今年好豐收。」\
    \     坯戶:用細土封起洞口，防止寒氣侵入。 \n根據以上內容判斷，這段文字所指的季節與下列何者相同？"
  options:
  - label: A
    content: 清明時節雨紛紛，路上行人欲斷魂
  - label: B
    content: 黃梅時節家家雨，青草池塘處處蛙
  - label: C
    content: 停車坐愛楓林晚，霜葉紅於二月花
  - label: D
    content: 六出飛花入戶時，坐看青竹變瓊枝。
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 國文
      code: 第一課
      title: 聲音鐘
      chapter: null
    textbook: 七下 第一課 聲音鐘
    labeled_by: ai
