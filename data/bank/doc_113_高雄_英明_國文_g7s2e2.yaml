  stem: 根據內容，關於韓國影集魷魚遊戲，下列敘述何者最恰當？
  options:
  - label: A
    content: 劇中參與遊戲的人多為庶民一族，為求擺脫命運而不惜孤注一擲，以命來搏
  - label: B
    content: 因為資本主義的興盛，使得韓國的影視產業蓬勃發展，順勢誕生了這部佳作
  - label: C
    content: 魷魚遊戲成功演繹了底層人民的苦，成為該影音平臺上最多人觀看的節目
  - label: D
    content: 劇情充滿超現實的色彩，也利用「魷魚」的象徵手法展現了烏托邦的世界觀。
  group_stem: 'Netflix 播映的韓國影集魷魚遊戲近日火速席捲全球，劇情講述社會底層平民，因負債累累走投無路，不惜賭命參加遊戲，以求獲取高額獎金翻身。有英媒分析指出，此劇的部分劇情看似荒謬，但某種程度上，卻也反映出韓國基層人民的真實處境。

    英國衛報8 日報導，作為有機會成為Netflix 有史以來收視率最高的節目，魷魚遊戲以混合黑色幽默和批評韓國式資本主義失敗的方式，吸引了全球觀眾；然而，現實中卻有越來越多的韓國人，就跟劇中人物一樣，被債務壓得喘不過氣，只能不停以貸款來償還貸款。

    報導指出，韓國家庭的負債水平近年上升，是亞洲唯一一個家庭負債比破100％的國家，債務與收入的差距急劇擴大，而青年失業率上升、大城市房地產價格超出多數普通勞工承受範圍，都讓情況更加惡化。'
