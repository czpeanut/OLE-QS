  stem: 根據本文，為何懶人希望冥王將他變成一隻白鼻貓？
  options:
  - label: A
    content: 白鼻貓擁有更好的嗅覺，能夠迅速聞到老鼠氣味
  - label: B
    content: 透過白鼻可偽裝成老鼠，以增加成功捕鼠的機會
