  type: single
  page: 2
  stem: "現今的人類大腦，是在演化中不斷地修正錯誤後才得以成型的。□□大腦的功能已經十分強大，□□它並非不會犯錯，因為演化過程所篩選出的，是「幫助物種取得競爭或繁衍優勢」的大腦，而非「永不犯錯」的完美大腦。□□，弱肉強食的野性世界是殘酷的，大腦為了幫助人類存活下來，經常必須選擇犧牲「正確性」來換取「速度」。\
    \ \n根據文意脈絡，文中缺空處依序填入下列何者，文意最為通暢？"
