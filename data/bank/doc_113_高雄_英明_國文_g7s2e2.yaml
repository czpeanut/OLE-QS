  group_stem: "臺灣鄉土智慧─宜蘭三星稻鴨米 \n  早期臺灣的農業社會，農夫種植作物善用自然資源，利用動物的排泄物作為天然肥料。隨著時代日益進步，農民開始依賴方便的農藥及化學肥料，直到福壽螺大肆危害臺灣農村與溪流，且危害人體，老農夫們這才想起老祖宗的智慧，重新把鴨子趕回田裡。從此不用肥料與農藥，更創造出了宜蘭美味有機的「稻鴨米」。\
    \ \n  其實對老一輩的農夫來說，稻鴨米根本不是什麼新鮮事，以前的農夫們會在水稻插秧後約二十天、水稻開始展現綠意後，就把一大群出生約十五天的小鴨子趕進水稻田裡。這些小鴨子在水稻田裡穿梭，把田裡的害蟲吃光光，讓農夫完全不用灑農藥，小鴨的排泄物更成了天然肥料，讓農夫也順便省下肥料錢，稻米就成了再健康不過的有機米。\
    \ \n  宜蘭縣 三星鄉 稻鴨米產銷班班長陳文連說：古早人的智慧都是寶貝，猶記小時候農藥不普及的年代，下雨天時，父親會遙指稻田說：「今年有望了。」意指田面上稻子末端結滿了蜘蛛網（望與網的閩南語發音相同），今年稻穀將會豐收。陳文連在解說的過程中，十分感慨農藥破壞了生態的循環，他說：「農藥把益蟲都噴死了，卻滅不了福壽螺等有害的生物。」\
    \ \n  而今，宜蘭稻鴨米由陳文連與其子陳晉恭一同經營，陳晉恭發揮自己行銷專長，和爸爸共同打拚，希望將宜蘭稻鴨有機米在臺灣建立起口碑。陳晉恭自己也表示，面對普世認為「種稻沒前途」的價值觀中，他選擇反其道而行，投入有機農業，並說只要子女對有機農業有興趣，將鼓勵他們傳承下去，繼承這一份祖先傳承下來的生活智慧。"
