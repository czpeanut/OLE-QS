  page: 5
  stem: 「最近，我還從這種基礎，摸索出一種觀察車站的方法，作為旅行的樂趣。」請問作者以何種方式觀察車站?
  options:
  - label: A
    content: 以火車為主體，畫出火車車頭簡圖及型號解說
  - label: B
    content: 以車站為中心，將附近有趣的景物抄寫描繪下來
  - label: C
    content: 以車廂為背景，素描火車內搭車乘客的各種表情
  - label: D
    content: 以火車為中心，利用攝影裝備拍下車站的建築特色。
  group_stem: "搭乘火車是我認為最安全，最能思考的旅行。你不用擔心未來的路線，因為你已經設定方向，很清楚火車會前往哪裡，在哪些地方下車。上了車，你很安心，專注地面對正在出現的風物，不管是窗內或窗外。你輕鬆跟人接觸，認真交談，更清楚社會的面相。許多著名作家都喜愛搭火車旅行，想必都跟這種情境的存在有關。\
    \ \n    最近，我還從這種基礎，摸索出一種觀察車站的方法，作為旅行的樂趣。 \n    每次抵達一個車站時，我都會以車站為中心，把附近有趣的地形地物抄記在隨身攜帶的小冊子上。有哪些東西會放進呢?其實，事先也未必知道，都是抵達現場時才會撞見的。我會把一個車站周遭的景物，自己喜愛或好奇的簡單地畫進去或添寫文字。\
    \ \n    一般人都以為，我不是畫家，哪有能力畫圖。但我覺得正因為我們不是畫家，更該使用小冊子隨興作畫。非畫家時，我更有權利，不需要任何素描的基礎，重要的是感情和興致。\
    \ \n    但搭火車要畫什麼內容呢?我覺得還是隨興，端憑自己喜歡。很可能是一棵樹、一個攤販、一根巴士站牌、一間舊樓房等等，任何可能性都有。不一定像鐵道迷，非得滿懷鐵道知識。如此記載風物，看似漫無目標，卻是很好的生活履歷，一來讓我跳離了現今認識車站和火車的規矩，不用擔心錯失了紙票、路票機、建築風貌，這些鐵道迷酷愛的舊事物。二則，對一些地方生活的小事物有了學習的機會。相對地，透過這些地方風物和人物，我們也意外地有了許多生活的驚喜。\
    \ \n—節選自劉克襄 和火車做朋友"
