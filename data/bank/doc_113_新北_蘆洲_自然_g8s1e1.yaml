- id: doc_113_新北_蘆洲_自然_g8s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: '下列關於這個實驗的操作，哪幾項是正確？

    (甲)長管末端低於液面是為了避免氧氣由薊頭漏斗衝出並將雙氧水噴出而發生危險

    (乙)為避免實驗誤差，一開始產生氣體時，應立即開始收集

    (丙)若氣泡的生成速率過快，應將薊頭漏斗拉出吸濾瓶

    (丁)薊頭漏斗穿過橡皮塞時，應緩緩旋轉塞入，避免玻璃管斷裂。'
  options:
  - label: A
    content: 甲丁
  - label: B
    content: 甲丙丁
  - label: C
    content: 甲乙
  - label: D
    content: 甲乙丙。
  group_stem: '在實驗室製造並收集氧氣時可使用如圖的裝置。請依此回答下列 10~12 問題:'
