  section: 1
  number: 38
  type: single
  page: 4
  stem: 蝶豆花在水溶液中因酸鹼度不同而變色是因哪一種物質的變化造成？
  options:
  - label: A
    content: 物理變化
  - label: B
    content: 化學變化
  - label: C
    content: 三態變化
  - label: D
    content: 形變。
  group_stem: 蝶豆花飲品是利用溶於水中的花青素做出顏色漸層的效果。蝶豆花會因為浸泡時間增加而溶出更多的花青素使得顏色變得更深。花青素還會隨酸鹼度不同，呈現出不同顏色，花青素在鹼性環境中會呈現藍色、中性呈現紫色、酸性則呈現紅色，因此加了酸性檸檬的蝶豆花茶，才會出現奇幻炫麗的紫紅色。請根據本文內容來回答
    38~40 題：
