- id: doc_113_新北_蘆洲_自然_g8s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '桌上有一隻筆及一把直尺，筆的一端對齊直尺 1cm 的刻度時，另一端則介在 2.5 公分至 2.6 公分的刻度間，如下圖所示。若四位同學記錄筆長度的結果如下表所示，則下列敘述何者正確？


    | 同學 | 劉備 | 諸葛亮 | 關羽 | 張飛 |

    | :--- | :--- | :--- | :--- | :--- |

    | 記錄結果 | 1.56cm | 1.55cm | 1.566cm | 2.56cm |'
  options:
