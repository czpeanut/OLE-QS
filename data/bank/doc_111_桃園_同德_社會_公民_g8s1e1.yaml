  stem: 關於《憲法》的特性，下列敘述何者錯誤？
  options:
  - label: A
    content: 《憲法》僅就婚姻選擇的權利做出簡要的規定，這是《憲法》的「原則性」。
  - label: B
    content: 《民法》的條文因牴觸《憲法》精神，由大法官釋憲後失效，這是《憲法》的「最高性」。
  - label: C
    content: 《憲法》由立法院制定並修正，不再由總統公布，修改程序繁複，這是《憲法》的「固定性」。
  - label: D
    content: 《憲法》為眾法之源、萬法之母，有「最高性」的特性。
