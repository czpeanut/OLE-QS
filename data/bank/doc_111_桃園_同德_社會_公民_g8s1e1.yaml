  section: 1
  number: 42
  type: single
  page: 1
  stem: 現今一般疾病的患者可以選擇不接受治療，即使有生命危險，國家也不能強制就醫，但新冠肺炎屬於法定傳染病，在嚴重特殊傳染病肺炎防治及紓困振興特別條例中，授權政府把患者強制隔離治療，而費用應由政府負擔。根據上文，請問下列敘述何者正確？
  options:
  - label: A
    content: 一般疾病不受治療是基於人民的自由權。
  - label: B
    content: 內文提到的條例其地位低於行政命令。
  - label: C
    content: 政府把病患強制治療是一種權利的行使。
  - label: D
    content: 法律保障人民權力不受政府任意侵犯。
