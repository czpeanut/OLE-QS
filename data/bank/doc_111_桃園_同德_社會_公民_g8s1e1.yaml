  section: 1
  number: 41
  type: single
  page: 1
  stem: 古代有篡位取得君權者，近代則有利用政變取得政權的統治者。若上述事件發生在今日，以現代民主政治運作的角度觀察，這些政治權力的來源其實都不具合法性。上述「篡位」、「政變」兩者政權的取得皆缺乏哪一條件？
