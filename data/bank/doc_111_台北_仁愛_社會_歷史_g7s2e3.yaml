  section: 1
  number: 3
  type: single
  page: 1
  stem: 右圖為中華民國政府遷台後，東亞地區的國際情勢圖，當時各國皆分別與美國締約，其主要目的為何？
  options:
  - label: A
    content: 倡導亞太地區的環境保護
  - label: B
    content: 促進東亞地區的經濟合作
  - label: C
    content: 共同遏止共產勢力的擴張
  - label: D
    content: 協助各國核子武器的研發。
