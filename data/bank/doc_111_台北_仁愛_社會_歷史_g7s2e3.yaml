- id: doc_111_台北_仁愛_社會_歷史_g7s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 西元 1976 年加拿大蒙特婁奧運，由於中華人民共和國政府不允許有「兩個中國」出現，造成當時中華民國政府雖派出代表隊，但拒絕以「臺灣」名義參與，認為改變名稱的建議，違反國際奧會不容許任何政治干涉與歧視的憲章規定。最終無法妥協，於
    7 月 16 日為了抗議而退賽抵制。造成臺灣如此的外交困境，應與下列何者有關？
  options:
  - label: A
    content: 臺美斷交
  - label: B
    content: 退出聯合國
  - label: C
    content: 臺海爆發軍事衝突
  - label: D
    content: 宣布戒嚴。
- id: doc_111_台北_仁愛_社會_歷史_g7s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 西元 2019 年 6 月 9 日香港民眾上街示威反對修訂逃犯條例，原因是憂慮修法將削弱香港在「一國兩制」下的獨立司法管轄區地位。中共能否讓香港繼續維持高度自治及商業中心地位受到質疑。關於「一國兩制」，下列敘述何者正確？
  options:
  - label: A
    content: 「一國」指的是中華民國
  - label: B
    content: 目前正在實施「一國兩制」的地區是香港和台灣
  - label: C
    content: 香港實施自治的權限屢遭質疑，我國政府對「一國兩制」未尊重我國主權而未能接受
  - label: D
    content: 「兩制」是指大陸和臺灣實行不同的制度，因有利於兩岸對等溝通而成為目前我國政府推動的政策。
