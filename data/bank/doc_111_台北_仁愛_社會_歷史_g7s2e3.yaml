  section: 1
  number: 1
  type: single
  page: 1
  stem: 吐瓦魯（Tuvalu），位於南太平洋的島國，由於地勢極低，溫室效應造成的海平面上升，使國家的平地日漸縮少。然而臺灣的農業技術團努力讓這片只有沙和海水的土地，透過買土、調養料，許多技術加上細心呵護，在這片土地上無中生有，種出西瓜、木瓜、空心菜、高麗菜…請問：關於農技團的事蹟，下列敘述何者正確？
  options:
  - label: A
    content: 這是臺灣在鞏固外交時期，積極爭取友邦的最佳範例
  - label: B
    content: 這是從彈性外交時期至今，我國積極爭取國際友誼、拓展外交空間的重要工作
  - label: C
    content: 農耕團的主要目的是在兩岸武力對峙時期，種植更多的農作物作為後勤補給
  - label: D
    content: 由於中共對我國實施經濟封鎖，導致我國外派農耕團皆無功而返。
- id: doc_111_台北_仁愛_社會_歷史_g7s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '四位同學敘述了關於《臺灣關係法》制訂的原因及內容，下列哪一位同學的說法與此法案並不符合？

    小蔡：此法案簽訂不久後，中華人民共和國取代中華民國地位，順利進入聯合國。

    小依：此法取代了遭終止的《中美共同防禦條約》。

    小琳：依據此法美國仍可以出售臺灣防衛性武器。

    小美：即使無邦交的臺美雙方仍繼續維持經貿交流。'
  options:
  - label: A
    content: 小蔡
  - label: B
    content: 小依
  - label: C
    content: 小琳
  - label: D
    content: 小美。
