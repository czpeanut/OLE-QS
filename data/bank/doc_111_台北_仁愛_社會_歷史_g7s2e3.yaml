    content: 乙→丙→丁→甲
  - label: B
    content: 丙→乙→甲→丁
  - label: C
    content: 乙→丙→甲→丁
  - label: D
    content: 丁→甲→丙→乙。
  group_stem: '※一位歷史學家將臺灣文化的演變做了下面的敘述，閱讀後，請回答 36～40 題：

    甲：「人們很容易地，就可以從這些以鄉土社會和鄉村人物為題材的小說中，滿足他們對社會意識的感情，知識分子也開始關懷在地人民的生活。」

    乙：「那個年代的年輕人，便以到舞廳跳舞，聽著西洋音樂為時尚。美軍的駐防，也使得一些地方產生了文化交流，如臺北市的北投與圓山等地，仍保留了許多當時的文化影響，而保齡球也是那時由美軍帶入。」

    丙：「擬定文化政策，培養人民對國家的同感，如國劇的定期演出，定期舉辦各大專青年暑期國劇研習會等，同時須限制臺灣方言及音樂。」

    丁：「國家應依民族意願，保障原住民族之地位及政治參與，並對其教育文化、交通水利、衛生醫療、經濟土地及社會福利事業予以保障扶助並促其發展。」'
