    | 民事事件 | 45 |

    | 告訴乃論刑事案件 | 15 |

    | 非告訴乃論刑事案件 | 35 |'
  options:
  - label: A
    content: '15'
  - label: B
    content: '45'
  - label: C
    content: '50'
  - label: D
    content: 35 件。
- id: doc_113_屏東_中正_社會_公民_g8s2e2_s1_26
  section: 1
  number: 26
  type: single
  page: 3
  stem: 選舉期間有候選人被爆料涉嫌違法，但檢方調查後發現證據不足，未起訴。關於這件事，下列哪一項最符合「罪刑法定原則」的精神？
  options:
  - label: A
    content: 因為形象已受損，無論是否違法，都因褫奪公權不可參選。
  - label: B
    content: 民眾認為他有問題，就算未有完整的證據也應當視為嫌疑犯而不能參選。
  - label: C
    content: 沒有明確違反法律及確實的證據，就不能任意給予刑事處罰。
  - label: D
    content: 新聞明確報導了，就算沒有起訴，也應當視為有罪。
