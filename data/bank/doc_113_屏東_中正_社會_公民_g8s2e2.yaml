  - label: C
    content: 起訴階段—自訴
  - label: D
    content: 起訴階段—公訴
- id: doc_113_屏東_中正_社會_公民_g8s2e2_s1_24
  section: 1
  number: 24
  type: single
  page: 3
  stem: 家宏近來在道路上發現有車主使用遮牌神器來躲避違規被開罰單，他回去查找相關法規，發現車輛裝設遮牌神器，會違反《道路交通管理處罰條例》中的規定「損毀或變造汽車牌照、塗抹污損牌照，或以安裝其他器具之方式，使不能辨認其牌號」，一樣難逃要繳罰單的命運。下列是家宏對上述行為的分析，何者說明最正確？
  options:
  - label: A
    content: 車輛裝設遮牌神器屬於犯罪行為
  - label: B
    content: 車輛在路上超過限速屬違法行為
  - label: C
    content: 裝設遮牌神器不只是違法還犯罪
  - label: D
    content: 只要未犯罪就不須承擔法律責任
