  section: 1
  number: 19
  type: single
  page: 2
  stem: 刑罰的目的有預防犯罪、補償被害人損失與伸張正義、教化罪犯，若只用報復和懲罰而忽略教育的意義，可能造成下列何種問題？
  options:
  - label: A
