- id: doc_113_屏東_中正_社會_公民_g8s2e2_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 『告訴』和『告發』是兩個相近的概念，兩者有共同點也有差異處。請問兩者的共同點為下列何者？
  options:
  - label: A
    content: 都由被害人提起
  - label: B
    content: 都由任何人提起
  - label: C
    content: 都向偵查機關提起
  - label: D
    content: 都向地方法院提起。
- id: doc_113_屏東_中正_社會_公民_g8s2e2_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 新聞報導某嫌疑人因涉嫌詐欺被警察逮捕。依據我國刑事訴訟原則，下列敘述何者正確？
  options:
  - label: A
    content: 嫌疑人應提起自訴，控訴警方逮捕他
  - label: B
    content: 嫌疑人必須主動證明自己無罪
  - label: C
    content: 檢警單位可公開嫌疑人的所有個人資訊，以免受害人不知情
  - label: D
    content: 在法院判決有罪確定前，該嫌疑人應被視為無罪。
- id: doc_113_屏東_中正_社會_公民_g8s2e2_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 下圖為2020-2024 年青少年犯罪類型統計：竊盜：40%、傷害：25% 、詐欺：15%、公共危險（酒駕）：10%、其他：10% 請問，從上述資料可得出哪項正確的推論？
  options:
  - label: A
    content: 青少年最常因故意殺人而觸法
  - label: B
    content: 可以調解的案件比例有50%以上
  - label: C
    content: 酒駕仍是青少年犯罪的主要問題
  - label: D
    content: 犯罪類型以非告訴乃論案件居多
  assets:
