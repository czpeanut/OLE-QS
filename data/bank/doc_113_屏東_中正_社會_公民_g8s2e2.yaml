- id: doc_113_屏東_中正_社會_公民_g8s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: '請問：下列哪一個選項正確歸類為從刑？

    | 主刑 | 從刑 |

    | --- | --- |

    | 死刑 | 褫奪公權 |

    | 無期徒刑 | 徵收犯罪所得 |

    | 有期徒刑 | 勒令公開道歉 |

    | 拘役 | --- |'
  options:
  - label: A
    content: 拘役
  - label: B
    content: 有期徒刑
  - label: C
    content: 罰金
  - label: D
    content: 褫奪公權。
- id: doc_113_屏東_中正_社會_公民_g8s2e2_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: 老師上課說明我國的刑罰制度，大致可分為四種類型，第一種是死刑、第二種是無期徒刑、第三種是自由刑、第四種是財產刑。關於所提及的刑罰其種類與性質，以下哪一個敘述是錯誤的？
  options:
  - label: A
    content: 自由刑是剝奪犯罪者的人身自由，可單獨科處
  - label: B
    content: 主刑和從刑應由法院進行審理判決
  - label: C
    content: 褫奪公權是剝奪為公職的資格，無法單獨宣告
  - label: D
    content: 刑罰設立「沒收」專章，具獨立性可單獨宣告。
- id: doc_113_屏東_中正_社會_公民_g8s2e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 網路上常有人主張「重刑才會讓人不敢犯罪」，但也有人認為這樣的處罰未必有效。只強調報復功能的刑罰可能會忽略犯罪的成因。在一場監獄舉辦的技能訓練成果發表會中，與會來賓在致辭時指出：｢監獄不該只是監獄，獄所人員應協助收容人習得專業技能、扎實的訓練，建立將來順利回歸家庭與社會可能性。｣上述說法指的是刑罰應發揮何項功能？
  options:
  - label: A
    content: 處罰
  - label: B
    content: 嚇阻
  - label: C
    content: 預防
  - label: D
    content: 矯正。
- id: doc_113_屏東_中正_社會_公民_g8s2e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: '以下是屏東近年來發生的幾起案件，請同學依犯罪案件與判決，找出正確的答案：

    | 甲 | 屏東違法電信詐騙機房案，詐財金額上千萬元 | 詐欺罪、洗錢防制法 |

    | 乙 | 殺人棄屍案，婦人被殺害後棄屍在大武山山區 | 殺人罪，判刑20 年 |

    | 丙 | 屏東市某男子在夜店遭多人圍毆致死 | 殺人罪起訴，刑期10 年以上 |

    | 丁 | 屏東山老鼠，在霧台鄉盜伐珍貴檜木 | 森林法、刑法竊盜罪 |'
  options:
  - label: A
    content: 甲案違法但不構成犯罪
  - label: B
    content: 乙案兇嫌至少年滿18 歲
  - label: C
    content: 丙案可進行和解或調解
  - label: D
    content: 丁案的檜木沒收後只須負起民事賠償責任。
