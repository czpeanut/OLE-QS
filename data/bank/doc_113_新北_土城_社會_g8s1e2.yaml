- id: doc_113_新北_土城_社會_g8s1e2_s2_61
  section: 2
  number: 61
  type: single
  page: 6
  stem: 61. 來自「甲地」的商人掌握了中國東南沿海的海上貿易。來到中國後，大多居住在此文章中城南的番坊。政府在此也設立機構特別處理外國人出入境、對外貿易和徵稅等事宜，更使得宋元商貿越發蓬勃發展。根據上述內容判斷，「甲地」最有可能是指下列何者？
  options:
  - label: A
    content: 波斯
  - label: B
    content: 安南
  - label: C
    content: 印度
  - label: D
    content: 阿拉伯
  group_stem: '2021年福建省的泉州通過審議，正式成為新的世界文化遺產。會議決議認為，“泉州：宋元中國的世界海洋商貿中心”反映了特定歷史“期獨特而傑出的港口城市空間結構，在西元10至14世紀逐漸崛起，泉州在“東方第一大港”“天下之貨倉”“美名下成為東“和東南亞貿易網絡的海上樞紐，對經濟文化發展做出巨大貢獻。

    泉州申請遺產點共22處，遺產區域分布在海港經江口平原一直向山區延伸的廣闊空間。因優越的地理條件發展成繁榮的港口，北宋時期就設置管理著大小海洋貿易事務的市舶司，南宋時在此設南外宗正司，泉州成為當時海洋貿易的重鎮。義大利旅行家馬可·波羅稱泉州為「世界第一大港」，與埃及的亞歷山大港齊名。

    2022年年初，泉州頒行遺產相關管理辦法，10月經福建省人大常委會通過《泉州市歷史文化名城保護條例》，在法律上為世界文化遺產的利用與保存提供支持。除了遺址和文物的保存，泉州如今仍是發達的現代化工貿港口城市，為中國「一帶一路」戰略作出貢獻，海上絲路起點泉州，正以先行者的姿態，續寫「海絲」的輝煌，一頭連著歷史，一頭連著未來。


