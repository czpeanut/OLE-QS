- id: doc_113_新北_土城_社會_g8s1e2_s1_37
  section: 1
  number: 37
  type: single
  page: 4
  stem: 37. 文中提到了美洲白銀的開採和貿易，請問最早是由哪個歐洲國家主導此事？
  options:
  - label: A
    content: 西班牙
  - label: B
    content: 葡萄牙
  - label: C
    content: 荷蘭
  - label: D
    content: 英國
  group_stem: '十六世紀的世界，因為白銀的關係串連起世界貿易，大量的白銀進入中國成為法定貨幣。無論是葡萄牙、西班牙還是後來的荷蘭，在與中國的貿易中，始終處在逆差之中。正如德國學者弗蘭克在《白銀資本：重視經濟全球化中的東方》中所說：「外國人，包括歐洲人，為了與中國人做生意不得不向中國人支付白銀，這也確實表現為商業上的『納貢』；中國貿易造成的經濟和金融後果是，中國憑藉著在絲綢、瓷器等方面無可匹敵的製造業和出口，與任何國家進行貿易都是順差。」根據研究，十六世紀中期至十七世紀中期，美洲生產白銀三萬噸，日本生產白銀八千噸，最終流入中國的白銀達到七千噸至一萬噸，約占世界白銀產量的四分之一至三分之一。甚至有的學者認為，通過貿易渠道，全世界白銀的一半最終流入中國。不管具體數據有什麼差異，巨額白銀流入中國是確鑿無疑的，任何人都不能不承認，當年的中國是歷史上罕見的輝煌。


    請回答下列37~38題'
