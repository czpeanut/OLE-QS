    content: 為世界主要糧食生產地，可操控農產品價格
  - label: B
    content: 國家數多，在國際組織中集結成一股力量
  - label: C
    content: 經濟成長快速，可左右國際經濟發展
  - label: D
    content: 人口成長率高，國力雖不強，卻是資本主義國家爭取的合作夥伴。
