  section: 1
  number: 33
  type: single
  page: 2
  stem: '第二次世界大戰期間，召開不少國際會議，商討作戰方針與戰後秩序的重建。其中有關「開羅會議」和「雅爾達會議」的敘述，何者需要修正？


    | 會議 | （A）與會國 | （B）主要內容 | （C）聲明 | （D）影響 |

    | :--- | :--- | :--- | :--- | :--- |

    | 開羅會議 | 中、美、英、蘇 | 討論東亞問題 | 日本須無條件投降 | 日本須將臺、澎、中國東北歸還中華民國 |

    | 雅爾達會議 | 中、美、英、法、蘇 | 討論歐洲問題 | 德國須無條件投降 | 共產勢力擴張 |'
  options:
