- id: doc_111_桃園_同德_社會_歷史_g9s2e2_s1_31
  section: 1
  number: 31
  type: single
  page: 2
  stem: 1962 年，美國擁有各類核武器27387 件，蘇聯只有3322 件。就戰略核武器運載工具的數量而言，蘇聯也遠遜於美國。美國擁有各種戰略核彈頭5000
    枚，蘇聯只有3000 枚，美國享有17：1 的絕對優勢。同樣重要的是，蘇聯中程和中遠端導彈的設計、部署是供歐洲衝突使用的，打擊的主要目標是美國在歐洲的核力量。這些導彈射程有限，如果部署在蘇聯國內，則根本無法打到北美大陸，不足以構成對美國的威脅。為此，蘇聯將飛彈基地設在美洲，以制衡美國在歐洲的核力量。請問：上述內容是針對何事的註解？
  options:
  - label: A
    content: 柏林危機的背景
  - label: B
    content: 蘇聯在古巴部署飛彈的原因
  - label: C
    content: 美國利用北大西洋公約組織制衡蘇聯
  - label: D
    content: 韓戰爆發的經過。
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 歷史
      code: 4-1
      title: 冷戰時代
      chapter: 第4章 第二次世界大戰後的國際局勢
    textbook: 九下歷史 4-1 冷戰時代
    labeled_by: ai
- id: doc_111_桃園_同德_社會_歷史_g9s2e2_s1_32
  section: 1
  number: 32
  type: single
  page: 2
  stem: '臺灣因為地理位置優越，在歷史上數次成為列強競逐的對象；而國際局勢的轉變也會影響臺灣的局勢，下列有關臺灣在兩次大戰期間的敘述，何者需要修改？

    「（甲）第一次世界大戰爆發時，臺灣是日本殖民地，日本在臺灣召集志願兵加入戰場；（乙）一戰結束後，日本為消弭臺灣反抗聲潮，治臺政策轉為「內地延長主義」，標榜日臺共學、臺日合一；（丙）第二次世界大戰爆發時，臺灣屬於軸心國陣營，亦加入戰局；（丁）1945
    年二戰結束，由國民政府接收臺灣，但因族群差異、省籍衝突引發二二八事件。」'
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
  tags:
    chapter:
      publisher: 翰林
      book: 九下
