  type: single
  page: 2
  stem: 詩婷在圖書館翻閱一本回憶錄，內容如下，「1945 年8 月8 日，蘇聯宣戰，我們這群鄉間民眾完全暴露在蘇聯攻擊之下，幾乎是不戰而潰；1946 年春，蔣介石的國民黨政府取代撤離的蘇聯軍隊成為統治當局，開始進行俘虜遣返；中間的種種就不多說了……，1946
    年9 月，我和兩個孩子總算坐上遣返火車……。」由上述文字判斷，這位受訪者在何地？經歷哪一場戰爭？
