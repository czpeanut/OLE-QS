- id: doc_111_桃園_同德_社會_歷史_g9s2e2_s1_29
  section: 1
  number: 29
  type: single
  page: 2
  stem: '有鑑於兩次世界大戰對世界造成的強大破壞，在一戰、二戰之後皆成立以維繫世界和平為目標的國際組織，下列有關這兩個國際組織的敘述，何者正確？


    | 國際組織 | （A）提倡者 | （B）會員國 | （C）結束 | （D）缺點 |

    | :--- | :--- | :--- | :--- | :--- |

    | 國際聯盟 | 美國總統威爾孫 | 戰勝國才能加入 | 聯合國成立後終止 | 強國未加入，無法有效解決國際糾紛 |

    | 聯合國 | 美國總統羅斯福 | 主權獨立國家即可加入 | 冷戰結束後解散 | 缺乏武力，無法有效制裁侵略國 |'
  options:
  - label: A
    content: 提倡者
  - label: B
    content: 會員國
  - label: C
    content: 結束
  - label: D
    content: 缺點
