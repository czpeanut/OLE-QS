  stem: 1930 年代，美國股市大跌、公司虧損倒閉、失業率暴增，史稱經濟大恐慌。全球經濟受到連帶影響，各國為了因應經濟衰退，各國政府提出不同的因應之道，下列相關的配對何者有誤？
