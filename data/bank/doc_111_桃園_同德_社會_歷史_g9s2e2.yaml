  section: 1
  number: 27
  type: single
  page: 1
  stem: 「第三世界」崛起於20 世紀中後期，目前形成一股國際新力量可與美、蘇兩大集團抗衡，請問：第三世界具有何種優勢，使他們形成一股新興勢力？
  options:
