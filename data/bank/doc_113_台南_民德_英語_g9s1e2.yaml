- id: doc_113_台南_民德_英語_g9s1e2_s3_7
  section: 3
  number: 7
  type: single
  page: 3
  stem: Why do some students want to wear their own clothes?
  options:
  - label: A
    content: Their parents buy too many clothes for them.
  - label: B
    content: They can make clothes by themselves.
  - label: C
    content: They don’t need to buy uniforms.
  - label: D
    content: They want to look more special and prettier in their own clothes.
  group_stem: "III. In Taiwan, most junior high school students have to wear uniforms\
    \ (制服) to school. Students want to know why they should do so and why they can’t\
    \ wear their own clothes to school.\n  Some students don’t want to wear uniforms\
    \ because they don’t think uniforms are beautiful. They don’t want to wear the\
    \ same clothes as others. If they wear their own clothes, they can look special\
    \ and more beautiful or handsome. However, they will spend more time on clothes\
    \ than the schoolwork, or they will ask their parents to buy more clothes for\
    \ them.\n  Some students think wearing uniforms is great. First, they don’t have\
    \ to worry about which clothes they should wear to school. Second, their parents\
    \ don’t need to buy too many clothes for them. Third, others will know they are\
    \ students when they wear uniforms. At school, teachers can know if strangers\
    \ get into their school. Fourth, they think that their uniforms look beautiful\
    \ and special and that they are different from other school uniforms.\n  What’s\
    \ your opinion (看法)? Which do you think students should wear to school, uniforms\
    \ or casual clothes (便服)?"
