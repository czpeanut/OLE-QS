- id: doc_113_台南_民德_英語_g9s1e2_s3_4
  section: 3
  number: 4
  type: single
  page: 2
  stem: How do the stripes on zebras help them?
  options:
  - label: A
    content: They help zebras eat more grass.
  - label: B
    content: They help zebras hide in grass safely.
  - label: C
    content: They help zebras drink lots of water.
  - label: D
    content: They help zebras to attack lions.
  group_stem: "II. Zebras are known for their black and white stripes (條紋), and the\
    \ zebra-crossing is named after them. In fact, the stripes on each zebra are different,\
    \ and they help zebras to hide in grass. If a zebra stands still (靜止的) in tall\
    \ grass, it won’t be noticed by a lion. This is because lions are color blind\
    \ (盲的). Also, a group of zebras may look like a large animal, and it’s difficult\
    \ for a lion to pick out one to attack.\nZebras live in family groups. They are\
    \ led by a mother zebra. When a zebra is born, its mother will take it away from\
    \ the family for a few days. That helps the baby zebra to learn the mother’s sound\
    \ and smell.  \nWhen a zebra is attacked by other animals, the other zebras will\
    \ circle (圍成圓圈) them to save it. Though zebras run more slowly than horses, they\
    \ have greater hearing. Their ears are rounder (更圓的) and larger, and they can\
    \ turn in any direction (方向). Zebras have good eyes, too. They can see things\
    \ in the dark. They feed on grass and often have to drink water. A zebra can live\
    \ up to 30 years."
