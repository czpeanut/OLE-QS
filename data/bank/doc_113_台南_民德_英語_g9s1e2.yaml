- id: doc_113_台南_民德_英語_g9s1e2_s3_1
  section: 3
  number: 1
  type: single
  page: 2
  stem: Which is the best title (標題) for the reading?
  options:
  - label: A
    content: Blair’s PTSD
  - label: B
    content: The Best Way to Treat PTSD
  - label: C
    content: What Is PTSD?
  - label: D
    content: How Do People Live with PTSD?
  group_stem: "I.  Blair experienced a war when he was young. During the war, his\
    \ village was bombed, and his family and friends were all killed. In fact, he\
    \ was the only survivor (生還者) in the village. Since then, he has had PTSD. Sometimes\
    \ he can’t fall asleep, and sometimes he dreams his village is being bombed again.\n\
    \  PTSD is a mental disorder (精神疾病), and people may have it after experiencing\
    \ scary events. For example, some people have PTSD after having a serious car\
    \ accident, fighting in a war, or being abused (虐待).  When people have PTSD, they\
    \ may have sleeping problems, like Blair. They may also avoid (避免) being around\
    \ people or doing certain (特定的) things because they don’t want to remember the\
    \ terrible events.\nLuckily, PTSD can be treated in many ways. If you think you\
    \ have PTSD, don’t be afraid to talk about it and go to the doctor as soon as\
    \ possible. The earlier you get treated, the sooner you will feel better."
