  - label: D
    content: 一心締造世界長跑紀錄
  group_stem: "歷經一百一十一天、七千三百公里長征，2007 年二月，臺灣「超馬王子」林義傑和美國 查理、加拿大 雷伊終於橫越撒哈拉沙漠，抵達終點紅海旁，完成人類史無前例的壯舉。沙塵暴的攻擊、溫差五十度的折磨、隨時踩到地雷的威脅、從頭痛到腳底長水泡的全身疼痛……林義傑表示，他用自己的雙腳、雙眼經歷到的、看到的，都是屬於臺灣的經驗，所以他知道自己不能放棄，再苦、再累都要撐下去。\n\
    \                                                                          ──臺灣「超馬王子」"
