- id: doc_113_高雄_五福_國文_g8s1e1_s4_3
  section: 4
  number: 3
  type: single
  page: 4
  stem: 根據本文內容,下列敘述何者正確？
  options:
  - label: A
    content: 「竹風蘭雨」指宜蘭是盛產竹子和蘭花之鄉
  - label: B
    content: 欣賞宜蘭山上美景時,也要注意蟲蛇的威脅
  - label: C
    content: 不管何時來宜蘭，只要到山上都能一覽美景
  - label: D
    content: 三角崙山被譽為「巨人戰後所留下的遺跡」
  group_stem: "【縣市】宜蘭縣  \n【景點】聖母山莊登山步道  \n【概要】位於宜蘭縣礁溪鄉五峰旗瀑布風景區左上方，標高908 公尺、徒步單程約略兩小時三十分鐘。登山步道主要分為兩部分，前面是五峰旗瀑布至通天橋的產業道路，步行距離約2.9\
    \ 公里，而抵達通天橋後，1.6 公里長的「聖母山莊登山步道」於此正式展開，此段為山徑步道，盡頭為「聖母山莊」。  \n    那天我穿著海灘褲，腳下踩著一雙涼鞋，宜蘭的天氣正如「竹風蘭雨」這句俗諺的形容一樣正飄著雨，在毫無任何準備的情況下登山的我早已疲勞困頓，尤其是從登山口開始的1.6km,真的有夠漫長。其實，在還沒實際看到美景之前，我們也滿懷疑前方真的有什麼漂亮的景色在等著我們嗎？但是，在走出森林，三角崙山頂忽然映入眼簾的瞬間，我突然覺得這一切都值得了。三角崙山彷彿一座壯大而飽滿的抹茶山，我想，這便是人稱的絕世美景、人稱的神仙祕境吧？相較於被世人美譽為「巨人戰後所留下的遺跡——菲律賓巧克力山丘」，毫不遜色。雖然在宜蘭登山需做好萬全的準備，然而這般特殊氣候所形成的大自然奇景，除了親來一趟以外，絕對沒有辦法在其他地方看到，快來吧!\n\
    【注意事項】  \n1.宜蘭天氣變化大,因此需小心風雨。這裡很少放晴,並非隨時可以一覽宜蘭美景,所以一切都要看運氣。 \n2.山上會有毒蛇出沒的可能性。 3.自己的垃圾,請自己帶走。\
    \ 4.昆蟲超級多，驅蟲劑噴霧請務必準備。 \n                  ──節錄自小林賢伍 臺灣日記Taiwan Diary:我能做的,就是告訴全世界臺灣的美!"
  tags:
