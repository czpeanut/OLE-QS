- id: doc_113_高雄_五福_國文_g8s1e1_s4_13
  section: 4
  number: 13
  type: single
  page: 7
  stem: 「此生唯一能給的，只有陪伴。而且，就在當下，因為，人走，茶涼，緣滅，生命從不等候。」這是作 者侍親的深刻體驗，與下列何句文意相差最遠？
  options:
  - label: A
    content: 「父母在，不遠遊」父母健在，子女不能遠離家鄉，以盡早晚侍奉之責
  - label: B
    content: 孝順要及時，莫留「樹欲靜而風不止，子欲養而親不待」的遺憾
  - label: C
    content: 朝夕相伴，承歡膝下，晨昏定省，勝過物質財富的給予
  - label: D
    content: 父母的命令、呼喚、要求不能怠慢，隨時恭敬待命在側
  group_stem: "不再是匆匆來，匆匆一瞥，匆匆走；不再是虛晃一招的「媽你好嗎？」然後就坐到一旁低頭看手機；不再是一個月打一兩次淺淺的照面；真正兩腳著地，留在你身旁，我才認識了九十三歲的你，失智的你。\
    \ \n   我無法讓你重生力氣走路，無法讓你突然開口跟我說話，無法判知當我說「我很愛你媽媽」時你是否聽懂，但是我發現有很多事情可以做，而且只有留在你身旁時才做得到。\
    \ \n   因為在你身旁，我可以用棉花擦拭你積了黏液的眼角，可以用可可脂按摩你佈滿黑斑的手臂，可以挑選適合的剪刀去修剪那石灰般的老人腳趾甲，可以發現讓你聽什麼音樂使你露出開心的神情。\
    \ \n   我可以用輪椅推著你上菜市場；我會注意到，在熙熙攘攘的菜市場裡，野薑花和綠檸檬的氣味相混、虱目魚和新切雞肉的腥氣激盪、賣內衣束褲的女人透過喇叭熱切的呼喚聲，都使你側耳傾聽。\
    \ \n   我可以讓你坐在我書桌旁的沙發上，埋頭寫稿時，你就在我的視線內，如同安德烈和飛力普小時候，把他們放在書桌旁視線之內一樣。打電腦太久而肩頸僵硬時，就拿著筆記本到沙發跟你擠一起，讓你的身體靠著我的身體。因為留在你身旁，我終於第一次得知，你完全感受我的溫暖和情感汨汨地流向你。\
    \ \n   我們是在山河破碎的時代裡出生的一代，可是讓我們從滿目荒涼、一地碎片裡站起來，抬頭挺胸、志氣滿懷走出去的人，卻不是我們，而是美君你，和那一生艱辛奮鬥的你的同代人。現在你們成了步履蹣跚、眼神黯淡、不言不語的人了，我們可以給你們什麼呢？\
    \  \n   我們能夠給的，多半是比你們破碎時代好一百倍的房子、車子、吃不完的、丟不完的衣服，喔，或許還有二十四小時的外傭和看護。但是，為什麼我們仍然覺得那麼不安呢？那是因為我們每一個在假裝正常過日子的中年兒女其實都知道，我們所給的這一切，恰恰是你們最不在乎的，而你們真正在乎和渴望的，卻又是我們最難給出的。我們有千萬個原因蹉跎，我們有千萬個理由不給，一直到你們突然轉身、無語離去，我們就帶著那不知怎麼訴說的心靈深處的悔欠和疼痛，默默走向自己的最後。\
    \  \n   你們走後，輪到的就是我們。在木棉道上行禪時，我對自己說，不要騙自己了。此生唯一能給的，只有陪伴。而且，就在當下，因為，人走，茶涼，緣滅，生命從不等候。\
    \ \n                                                      ──龍應台《天長地久》〈此生唯一能給的〉"
