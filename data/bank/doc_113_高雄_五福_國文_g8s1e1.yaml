  section: 4
  number: 5
  type: single
  page: 5
  stem: 根據以上報導，下列對「真人圖書館」的理解，哪一個是正確的？
  options:
  - label: A
    content: 提供會走動、會回話的書，並可與書籍互動，實際體驗他的生活
  - label: B
    content: 建有「圖書目錄」給借閱人參考，撕毀圖書將被限制停止借閱
  - label: C
    content: 館藏書單以被社會汙名化、引人好奇的族群為主，旨在消除大眾的偏見
  - label: D
    content: 圖書館有常設的、固定的建築或地點，目前已在歐 美近卅個國家辦過活動
  group_stem: "認識真人圖書館 \n1.組織總部：「真人圖書館（the Human Library）」組織總部位於哥本哈根，是由丹麥人羅尼‧艾柏格與四個朋友創設。\
    \ \n2.圖書館位置：真人圖書館並不是一般固定的建築物，也不限於一座建築物，通常出現在圖書館、書展、年會、嘉年華、校慶……等各種場合舉辦，目前已在歐 美近卅個國家辦過活動，在亞洲的臺灣\
    \ 蘭陽女中亦成立真人圖書館。 \n3.圖書館特色：以幽默且創新的方法，提供對話、增進理解，以協助讀者釐清自己可能有的偏見。館內藏書沒有版權，歡迎複製。 \n\
    4.成立宗旨：打破刻版印象，挑戰偏見，提倡尊重多元文化，消除歧視與暴力，促進人權與社會凝聚。 \n5.圖書目錄：這裡跟一般圖書館裡的其他書籍一樣，建有「圖書目錄」，圖書目錄中的「真人書單」常是因宗教、性向、外表……遭受歧視的一群，包括：穆斯林、金髮女郎、胖子、厭食症患者、跨性別裝扮者、愛滋帶原者、或是禮儀師、靠翻撿垃圾過活的「垃圾掏客」等等。\
    \ \n真人圖書館借閱守則 \n1.訪客填表登記後，依館藏借出「真人書」。 \n2.借閱時間內可交談30～40 分鐘，但只能在活動場地內閱讀，可以全家共讀，不能帶出場。\
    \ \n3.沒有笨問題，但提問須有禮貌。如果「書本」覺得受辱，有權終止借閱，回到藏書區。"
