  group_stem: "根據調查報告，臺灣青少兒的入口網站除跨國搜尋引擎掛帥外，2023 年Instagram 與抖音短影音異軍突起，已經超越臉書，不過，報告也指出，短影音與AI\
    \ 衝擊下，臺灣青少兒搜尋自己文化資訊的比例呈現下降趨勢。政治大學 廣電系教授黃葳威憂心，每個時代的青少兒都有自己的次文化，倚重跨國科技平臺的青少兒，卻成為失根的年代。\
    \ \n政大 數位傳播文化行動實驗室與白絲帶關懷協會發表「2023 臺灣青少兒美感素養與上網趨勢調查報告」。調查顯示，臺灣國小三年級至大學四年級在學學生青少兒最常使用的入口網站，以「Google」為入口網站的青少兒最多（49.0%），其次為社群網站「Instagram」（45.6%）、影音平臺「YouTube」（35.2%），「Tiktok抖音」（25.5%）還擊敗「Facebook」（23.4%），其餘作為入口的均不到兩成。今年IG\
    \ 與Tiktok 異軍突起，YouTube 使用者略呈下滑。 \n而在青少兒美感素養調查中，再現反思表現最不足的有「平日我會主動搜尋藝文活動相關資訊」、「我能具體說明藝術創作在不同文化所呈現的差異性」、「我能夠向他人解說自己文化中的藝術創作特色」，及「我會蒐集不同文化的藝文資訊」等。\
    \ \n報告指出，不可否認，疫情期間實體的藝文活動暫停，影響受訪者實際接觸的機會，然而，青少兒學生透過網路搜尋相關藝文資訊的行為也相當有限，更遑論臺灣青少兒學生向他人說明自己文化藝術的特色。黃葳威也表示，加上短影音的內容品質不一，但青少兒對於自己文化的認知卻沒有成長，打卡頻頻的日常，青少兒缺乏本土文化藝術資訊的胃口，臺灣需要優質的青少年影音內容，兒少需要具備融合人文藝術與科技的素養教育。\
    \ \n調查也顯示，小三到大四的在學學生家中平均擁有的電視數量為1.77 臺，電腦數量達2.2 臺，近9 成（88.4%）的青少兒擁有自己的手機，9 成5\
    \ 以上都是智慧型手機，代表智慧型手機與青少兒生活緊密相連。整體而言，小三到大四受訪的在學學生，每週使用手機時間達26.21 小時，上網時間有24.54 小時，收看電視時間只有6.01\
    \ 小時，運動時間更少，僅7.61 小時。 \n青少兒上網動機，7 成以上主要是為了看影片（75.1%）、聽音樂（69.9%），其次為玩遊戲（69.4%）、查詢資料（56.4%）、使用社群網站（54.2%），再者，4\
    \ 成以上青少兒使用即時通訊工具與他人聯繫，3 成4 看娛樂資訊。 \n衛星電視公會祕書長陳依玫強調，臺灣本土影音節目多由電子媒體穩定產製，跨國科技平臺僅僅是購買、播出極少量的臺灣自製節目。相較之下，政府對於影音頻道與網際網路的治理，卻形成不對稱監理，對於受到短影音、網路包圍的影音產業，猶如雪上加霜。科技與時俱進，設計始自人心。政大\
    \ 數位傳播文化行動實驗室也提出「善用AIGC 的媒體識讀」，建議如下： \n1.賞識思維 A（Artful Thinking）：培養賞識思維，落實12 年國教。\
    \ \n2.智慧財產 I（Intelligence Property）：維護智慧財產，促進文創發展。 \n3.數位品味 G（Good Taste）：提升數位品味，跨越資訊落差。\
    \ \n4.創意創新 C（Creative Innovation）：實踐創意創新，融合人文科技。 \n──（節選自「信傳媒」網站2023.11.24）"
