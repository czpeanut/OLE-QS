  section: 3
  number: 38
  type: single
  page: 7
  stem: 老太太說：「我沒有時間流淚，也沒有時間悲傷，這就是我的哲學!」由此可知老太太是怎樣的人？
  options:
  - label: A
    content: 對生命充滿熱情，珍惜時間，努力實現夢想
  - label: B
    content: 熱愛結交朋友，悲傷時可以互相扶持和安慰
  - label: C
    content: 生活負擔很沉重，出門旅行也想要節省開銷
  - label: D
    content: 勇敢熱情大方，喜歡賺錢，想要幸福的生活
  group_stem: '那天清晨有點陰霾，不像初春的天氣。我在雅典上了巴士，無聊地向「太陽神阿波羅的聖地」德爾菲緩緩駛去，這是我第一次遇到那位叫我「年輕人」的老太太。

    車很空，老太太只隔走道與我相鄰。她從東德來，有些胖，看來將近七十歲，穿著半舊的過時花襯衫，緊張地將藤織提袋抱在胸前，看來生活有些拮据。她發現我在注意，怯生生地向我打了招呼。

    「這趟旅行，是孩子們合送給我的生日禮物……」她用帶著濃重德文腔的英語，一個字一個字慢慢說，將手上的薄荷軟糖送我一個。

    「他們真孝順！」我笑一笑。

    「嗯！」她掩不住內心的驕傲，「我很高興，非常非常高興！」

    然後我們都有點羞赧，不知道該怎麼接下去，只好各自看著窗外的田園風景。

    上午茶的時間一到，司機在鄉下的小咖啡座前停下來，乘客紛紛下車用茶，我如常一個人背著行李在田間散步，突然感覺到有人跟著，一回頭看到那老太太拿著照相機對準我，笨拙地偷偷照了一張後趕快跑開。我先是呆了一會兒，然後笑了，叫住她說：

    「讓我也來幫妳拍一張吧！」

    她堅決地搖搖頭，趕緊又拿起照相機「喀嚓！喀嚓！」朝我照兩張。

    太陽靜靜地出來了。我不知怎的，對這奇怪而傻氣的老太太，一點也不生氣，反而彎下身來採了一小把野雛菊花弄成一束，她不斷偷看我在做什麼，正在那兒探頭探腦，我已經伸手交給她這份禮物。

    「喏，給妳的。」

    「給我？……真的給我？」她吃驚地拿著小黃花，臉上飛過一陣紅暈。

    德爾菲到了，我陪她爬上狹窄的石階去看阿波羅神殿。後面的人不耐煩地抱怨這行動遲緩的老太太，她其實是聽到了，卻假裝不知道，紅著臉努力拖著胖身軀，一步一步往上爬。

    「我不敢相信，我真的看到了……」她不顧禁止標誌，興奮地來回撫摸著刻有塔列斯「人需要了解自我」那句名言的石刻。

    再往上走一、兩公里，就是聞名的古劇場以及競技場。

    「走！我們再上去！」我愉快地說。

    沒想到她只是搖搖手，「你自己去吧！我走不動了，在這裡坐著等你！」

    「那我陪妳坐吧！」我怕傷她的心。

    結果她堅決地推了我一把，「去幫我看吧，年輕人！值得用一輩子換的美景呢！」

    回到了山下，她看到冰淇淋車，很高興地吃了一個，就算是午餐了。

    沒想到，過了幾天，我們又在愛琴海的船上相逢。

    「年輕人！」她興奮地擁抱我，「我好想念你！」

    她顯得有些手足無措，在那個舊袋子裡翻了半天，找到薄荷軟糖給我，還是那麼神采奕奕，似乎一點也不怕在年輕的世界裡賽跑。

    中午她還是沒有吃飯。但是從袋裡拿出幾片乾麵包和一顆橙，安靜地啃了起來。

    「旅館每天都供應自助餐，怎麼樣都吃不完，太可惜了，所以每天我都包些剩菜，就可以省下隔天的午餐錢了，……」她仔細看著我，「年輕人，我還要去好多地方，一定要更節儉才行，他們絕對賺不到我的錢！」

    那說話的神情，像是包裹了一顆年輕旅行家的心，陶醉在長久的夢想裡，即使生活多麼艱苦，也要實現。

    我拿出一捲中文音樂卡帶送她，不可抑遏的淚水從她的老花眼鏡背後潸潸流下。

    「總有一天，我要親眼看到你的國家！」她哽咽著說。

    「一定會的，一定會的！」我手忙腳亂拍著她的背。

    她平靜下來，恢復了笑容，珍惜地將薄荷糖棒折了半條給我，摸著我的臉，彷彿我還是個小孩子。

    「每當下雨天、冬天下雪的時候，我會坐在老房子的窗邊，看著一張張春天旅行時的照片，於是所有的回憶就全都回來了。……年輕人，我沒有時間流淚，也沒有時間悲傷，這就是我的哲學！」

    她肥胖年邁的身體，在夕陽的港口邊顯得礙手礙腳，和那個舊藤袋一起消失在人群雜沓中。她老了，但是她教導一個年輕人學會什麼叫做勇敢，以及對生命的熱情，而那頭銀髮是我春天在希臘旅行，捕捉到的最美麗的一幅風景。

    （二)'
