- id: doc_113_高雄_陽明_國文_g7s2e3_s3_36
  section: 3
  number: 36
  type: single
  page: 6
  stem: 〈再見，西莎〉一文虛實交錯，格外觸動人心。下列敘述何者是作者親眼所見之景？
  options:
  - label: A
    content: 車子駛到陌生城市後，主人將西莎往車外一推，發動引擎駛離
  - label: B
    content: 西莎在蒼綠的大地上自由奔馳，快樂地跑過滿山遍野的花叢
  - label: C
    content: 出門放風的家犬朝西莎猛吠，在主人狗鍊束縛下，所幸並未攻擊西莎
  - label: D
    content: 透過罐頭上神采飛揚的狗明星，作者得知西莎已找到愛牠的新主人
  group_stem: '春日結束前，一個薄涼黃昏，我在自由廣場練完馬拉松時遇見他。稱他，而不稱她，是因那隆起的肩胛、寬大的骨架，予人雄性的感覺。他，是一隻西莎流浪狗。

    不同於有名的「西莎罐頭」上，那漂亮可愛的狗明星所予人的印象，這頸間戴一只褪色項圈的流浪西莎，腰腹凹扁，長毛灰黃骯髒、糾結成絮，肩背有一塊暗褐潰爛，溼濡的嘴毛則因口涎浸染，一片鏽紅汙漬。只見他步履蹣跚，不時停下搔癢，百無聊賴過街後，轉進騎樓，越過市場邊緣，踅入小巷，漫無目的，又繞回原先騎樓。

    由於是垂頭喪氣的髒狗，路人多側身閃避。出門放風的家犬，在主人狗鍊束縛下，撲將過來不成，也齜牙咧嘴朝他猛吠。不過，經過某洗車行，當西莎就著塑膠桶咕嚕咕嚕大口喝水時，那滿身油汙的洗車工，倒很有興趣地微笑看著，沒有趕他。我再次想起罐頭上，那惹人喜愛、吸睛無數的西莎明星。他原也該如此神氣漂亮的，不是嗎？

    西莎的故鄉，是遙遠的蘇格蘭高地，他的學名是「西高地白㹴」。這種蘇格蘭犬，據說是一種溫和聰明、服從性很強的狗。由於我曾兩度前往蘇格蘭高地旅行，因此對這來自蘇格蘭的朋友，格外湧生好感與親切。

    高緯度且瀕臨北海的蘇格蘭，記憶中，是一處廣布峽灣、丘陵與湖泊的地方。柔緩的矮坡上，終年有悠然吃草的綿羊、溫柔淡紫的石楠花，以及冰河歲月留下的磊磊白石。火車行走於此廣漠乾淨、罕見人煙的北國大地時，天高雲遠，薄霧朦朧，我總幻覺有低吟的風笛聲隔山傳來。那清寂敻遠之感，常令我想起高中上音樂課時非常喜愛的一首歌〈蘿蔓湖畔〉，那美麗的哀愁、高曠的情懷、悠揚的旋律，正是蘇格蘭民謠最令人低迴的特色！若眼前這西莎，還在他美麗的故鄉，該會多麼快樂地跑過滿山遍野的石楠花叢，在那寧靜蒼綠的大地上放肆奔縱。

    薄暮時分，天色漸暗，由於與朋友約定見面的時間將至，我不再尾隨西莎流浪路線，逕轉至捷運站出口，和朋友會合。我告訴朋友西莎之事，且想起西莎前額飄下的幾綹長毛所微微遮住的眼睛。那失神失望卻充滿靈性的雙眼，一路覓索，似正在這廣大世界上，尋找一樣非常非常重要的東西，除了這東西，整個世界都不存在，也無關緊要！

    我問朋友，那會是什麼呢？朋友不假思索地回答：「當然是他主人啊！他在找他主人！而且一定還很擔心著急，主人怎麼不見了？會不會有危險？我要趕快找到主人保護他！」

    唉，是的，這不知何謂拋棄、出賣、欺騙，卻還一心牽掛著主人的忠誠者啊！當主人帶他上車，他興高采烈且完全信任地聽命，終於來到一個陌生城市、從不曾到過的地方，車門打開，主人將他往外一推，引擎啟動，絕塵離去，獨留下茫茫然不知發生了什麼事的孤犬—據說，這便是許多流浪狗的由來。

    思索著朋友這令人心痛的回答，陪他走進路旁便利商店買晚報時，迎面一列狗罐頭恰在架上美味紛陳：野菜豬排、鮮蔬起士牛肉、花椰馬鈴薯羊排、義大利肝醬小牛肉……。若再看見那西莎，我想，不能帶他回家，至少，請他吃一客罐頭，也算傳達一種溫暖吧！

    走出便利商店時，街燈正逐一亮起，無數行人擦肩而過，但那孤獨落寞的身影卻早不知去向。一隻被棄的髒狗，在這華燈初上的城市，會有怎樣的命運呢？

    但願噩夢過後，傷心疲倦的西莎，能幸運遇見愛他直至終老的新主人，並且每晚都夢到自己在故鄉美麗遼闊的蘇格蘭高地上，揚尾奔馳。

    再見了，西莎！

    （一)'
