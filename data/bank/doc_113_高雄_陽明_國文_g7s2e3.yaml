  stem: '「留白，是一種藝術，更是一種境界。書法方面，在字與字、行與行之間，一定是偃仰顧盼，陰陽起伏，如樹木之枝葉扶疏，而彼此相讓。音樂方面，留白便是以休止符的形式來展露。在樂曲演奏時，時常會有片刻的休止或停頓，有張有弛、有收有放，才能體現出音樂的節奏。其實，不只是藝術上要留白，人際關係更需要留白。君子之交淡如水，『淡』是友情的留白，味甘易壞，唯其恬淡，因此更為親近、深遠；相敬、相愛是夫妻長久之道，而『敬愛』就是尊重，讓雙方分別保有空間，『尊重』則成了愛情的留白。」

