  group_stem: '永和九年，歲在癸丑，暮春之初，會於會稽山陰之蘭亭，修（註1）禊（註2）事也。群賢畢至，少長咸集。此地有崇山峻嶺，茂林修竹；又有清流激湍，映帶左右。引以為流觴曲水，列坐其次；雖無絲竹管弦之盛，一觴一詠，亦足以暢敘幽情。〈蘭亭集序〉

