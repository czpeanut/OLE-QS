- id: doc_113_高雄_陽明_國文_g7s2e3_s3_43
  section: 3
  number: 43
  type: single
  page: 8
  stem: 文中作者將學習新語言的過程比喻為戀愛，關於作者以此比喻的原因，下列敘述何者有誤？
  options:
  - label: A
    content: 因為學習語言的規則，能漸漸理解對方話語背後的意義，最終達到共鳴
  - label: B
    content: 因為兩者同樣不知道達到順暢溝通需要花費多少時間，且產生學得越多，犯錯越頻繁的錯覺
  - label: C
    content: 因為學習語言和戀愛都像數學公式一樣，掌握規則即可控制所有情況
  - label: D
    content: 因為用了錯誤的文法會成為彼此誤會的開始，如同戀愛中的摩擦
  group_stem: '結束約會，Ｃ坐上公車之前對我說，如果我知道西班牙文的「再見」怎麼說，他就留下來，那是他正在學習的語言，對我而言全然陌生，但也許是過去曾經在電影裡面聽過，我竟然不需要思考便浮現了正確的答案，於是我對他說：『adiós。』他驚訝地看著我。在我說出通關密語的時刻，Ｃ等待的公車來了，他猶豫著要不要上車。那一晚Ｃ沒有留下來，不過之後許許多多的夜晚他都留在我的身邊。他繼續學習著來自歐洲的語言，並且半強迫地要我和他一起學，我們在睡前用新的語言道晚安，在浴室的水聲中背誦著單字，把電影的字幕關掉胡亂猜測著劇情。我們在主詞與受詞間交換著角色，在例句中練習各種時態。學習新語言的過程總像一場戀愛，我學習和你溝通的規則，漸漸能夠理解你話語背後的意義，我們的聲音終於有了共鳴，然而偶爾用了錯誤的文法，就成為我們誤會的開始。我不知道要完全學會一個語言需要花費多久的時間，有時候我會有這樣的錯覺，彷彿我們學習的越多，犯錯的機率便越頻繁，常常我看著Ｃ的表情，覺得他好像完全不明白我在說什麼，到了最後，當他開口的時候，我也失去了聽的能力。那一天終於來臨時，我對著滿臉眼淚的Ｃ說了『adiós』，我才發現最一開始的那一個晚上，Ｃ問錯了問題。他想要我說的是『留下來』，但我卻說了再見。那時候我們都只是初學，還不知道如何挽留。

    鍾旻瑞 〈觀看流星的正確方式〉

    （五)'
