  section: 1
  number: 9
  type: single
  page: 1
  stem: 英國皇家海軍上校詹姆士‧庫克及他所帶領的船員創下歐洲船隻首次環繞紐西蘭航行的紀錄。以往長時間的航海中，水手容易身患壞血病而身亡，但庫克船長在探索旅程中，無一人因為壞血病而喪命，這是因為庫克當時先從個別船員觀察實驗狀況，提供充足的新鮮食物，尤其是青檸等含豐富維生素C的蔬果而得到結論，之後再適用全體船員。請問庫克使用的方法跟哪一位學者最有關？
