  section: 1
  number: 35
  type: single
  page: 3
  stem: 澳洲原住民起初擁有兩百多種語言，現在卻只有大約一百多種原住民語言存在，且大多數屬於瀕危語種，顯示原住民文化面臨消失或被遺忘的困境。造成上述困境的主要原因為何？
  options:
  - label: A
    content: 殖民者以武力、疾病使許多原住民喪生，導致文化延續困難
  - label: B
    content: 英國文化水準較高，吸引原住民主動學習，並放棄傳統文化
  - label: C
    content: 大量原住民被強制送往美洲充當勞動力，澳洲族群因此減少
  - label: D
    content: 受海外探險影響，澳洲原住民多移往亞洲貿易、居住
