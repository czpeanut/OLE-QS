  section: 1
  number: 11
  type: single
  page: 1
  stem: 《為奴十二載》，故事發生在 19 世紀中葉的美國，具有自由人身份的紐約州黑人居民所羅門‧諾瑟普被兩位白人設計誘騙至華盛頓，落入奴隸販子之手，隨後被運往盛行奴隸制度的路易斯安那州，賣至當地的種植園。主人時常引經據典引用《聖經》中的話語來說明自己行為的「合法性」與「純聖性」，可以任意處置自己的「財產」(黑奴)，並義正嚴詞地訴說這是上帝賜予的權力。請問這位主人濫用了哪個觀點?
  options:
  - label: A
    content: 看不見的手
  - label: B
    content: 主權在民
  - label: C
    content: 三權分立
  - label: D
    content: 天賦人權
