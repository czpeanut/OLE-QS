  stem: 歐洲波蘭的弗龍堡大教堂2010年為這位科學革命的天才設立墓碑，當時他提出的學說被天主教教會視為異端，但卻是現代天文學的起點，墓碑上的行星運行雕塑說明了他的成就。請問：關於這位偉大的科學天才，哪一項敘述不正確？
