  section: 1
  number: 6
  type: single
  page: 1
  stem: 隨著大航海時代的展開，世界各地的交流日益密切，相互帶來許多影響。在此時代背景下，關於右圖的標示，下列敘述何者正確？
  options:
  - label: A
    content: 為開發殖民地，歐洲人從「甲」捕捉黑人，運往乙從事奴工
  - label: B
    content: 殖民者在「乙」開採銀礦，獲得大量財富
  - label: C
    content: 「丙」原生的農作物，如玉米、馬鈴薯，成為世界各地重要的食物
  - label: D
    content: 「丁」為英國的殖民地，眾多原住民死於殖民者帶來的傳染病
