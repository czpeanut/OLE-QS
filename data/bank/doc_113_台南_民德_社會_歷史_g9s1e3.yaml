  stem: 「哥倫布大交換」是一場東半球與西半球之間生物、農作物、人種、文化、傳染病等的性交流，也是舊大陸與新大陸之間聯繫的開始，引發各種生態上的巨大轉變。對中國而言，在此大交換中有何影響?
