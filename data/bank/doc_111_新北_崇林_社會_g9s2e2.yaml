  stem: '小丸子在網路上查詢烏俄戰爭爆發原因，整理出如下表共8 項因素。請問：根據下表，俄羅斯向同屬斯拉夫民族的烏克蘭開戰的理由，與哪幾項因素有關？（甲）族群（乙）宗教（丙）政治（丁）領土（戊）資源


    1.俄羅斯與歐洲國家之間缺乏天然屏障，形成俄國以擴張領土為戰略的立國心態

    2.俄羅斯缺乏不凍港

    3.專制集權國家在政治上企圖恢復歷史榮光的野心，遠大於民生與經濟

    4.烏克蘭是俄羅斯天然氣輸往歐洲的必經之道

    5.烏克蘭是東歐糧倉

    6.整個歐洲依賴俄羅斯的天然氣供應，以至於對俄國引發戰爭的行為制裁進程緩慢

    7.有鑑於北大西洋公約組織對於成員國遭受攻擊，等同本國遭受攻擊，其他公約組織成員國必須出兵相助，因烏克蘭頻繁與北約接觸表達欲加入北約組織，俄羅斯選擇在未成定局之前對烏克蘭開戰

    8.保護俄羅斯在烏克蘭的僑民'
