  group_stem: '在「人類何以陷入戰爭: 李德哈特的歷史哲學」書中提出一些值得省思的問題，人類要到什麼時候才能向歷史學習？

    ● 1812 年的拿破崙征俄失敗，是個在歷史上人們總會談論的重大錯誤，可是在129 年後，「甲」再次做出誤判，為什麼？

    ● 一個發生在「乙」的暗殺事件卻把整個歐洲帶入萬劫不復的戰禍之中，導致第一次世界大戰的爆發，為什麼？

    ● 英國對「丙」曾提出在危難之時，對華沙提供必要的援助，可是英法兩國是沒有能力實踐這個諾言的，但英國人還是讓「丙」相信了這個空泛的承諾，為什麼？

    ● 人們總相信自己那方發動的戰爭能夠在短時間之內取得勝利，但事實證明這樣的推估是毫無根據的，在「丁」戰爭中一再發生同樣的錯誤，為什麼？


    結論:「那些影響國家命運的大事，其決定的基礎往往不是平衡的判斷，而是衝動的情緒，以及層級不高的個人考量。」人類似乎還沒有從過去的經驗學到教訓。本書針對人類的弱點－－不向歷史學習而一再重蹈覆轍，敲出最為沉重的警聲。歷史意識能幫助人類在「危難的時候」保持冷靜，度過難關。歷史指出最長的隧道還是有其終點。即使我們看不出前途存有任何正向的希望，但是一種對於未來演變而對歷史的關注，還是可以幫助我們繼續活下去的。

    世界地圖，20 世紀發生衝突的地點'
