  group_stem: '針對台中老屋施工倒塌事件，傳出罹災勞工均未加保職災保險，勞動部指出，《勞工職業災害保險及保護法》於去（2022）年5 月1 日施行，《災保法》第6
    條及第13 條規定，受僱於依法已辦理登記等事業單位的勞工，不論該單位僱用人數，都應由雇主辦理參加職保；勞工的保險效力，自到職當日起算。勞動部強調，確保職場安全衛生，提供每位員工一個安心安穩的工作環境，是企業應盡責任，同時呼籲雇主應依《災保法》規定，為所屬員工辦理參加職保，除了讓勞工朋友享有完整職保保障外，也可有效分攤職業災害補償責任，以免屆時觸法，得不償失。

    【TVBS 新聞網2023-04-02】'
