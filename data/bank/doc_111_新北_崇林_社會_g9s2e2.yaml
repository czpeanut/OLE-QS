- id: doc_111_新北_崇林_社會_g9s2e2_s3_35
  section: 3
  number: 35
  type: single
  page: 4
  stem: 以反共為名互為盟友的是那些國家？
  options:
  - label: A
    content: 甲乙庚
  - label: B
    content: 甲乙丙
  - label: C
    content: 丙丁戊己
  - label: D
    content: 乙丙戊
  group_stem: '以下出現的言論，請判斷是哪個國家、哪個人所發表，並回答35~40 題：


    (甲)在擺脫《凡爾賽和約》的束縛後，他說隨後對周邊小國實施占領。說了：「強者必須統治弱者，只有天生的弱者才會認爲這是殘酷的，同情弱者是對大自然最大的不敬。」

    (乙)為法西斯主義的創始人，他曾說：「個人是國家的一部分，必須服從於國家的需要，否則，個人根本不存在」

    (丙)「我們全體國會議員和政府成員對於你們大家——我國的人民——深表感激。在整個經濟蕭條時期，你們大家很有耐心。你們授予我們廣泛的權力；你們對我們的目標的廣泛支持，鼓舞了我們。」，也因此該國只著重於自身問題解決而不干涉他洲事務。

    (丁)他說：「我帶來了這個時代的和平！」他極力避免戰爭的發生，努力的協調歐洲各國之間的衝突。所以當大戰不得不爆發後，他飽受批評。

    (戊)在對方撕毀互不侵犯條約後，他派兒子參加戰爭與對方作戰，但兒子卻被對方俘虜，對方提出以此交換他們被俘虜的元帥，他拒絕地說：「我該如何向其他士兵的父親交代？不，他們都是我的兒子……我絕不會用元帥換一名普通士兵！」

    (己)他在廬山發表最後關頭宣言並再次強調：「和平未到根本絕望時期，決不放棄和平，犧牲未到最後關頭，決不輕言犧牲。」

    (庚)「朕深鑑世界之大勢及帝國之現狀，欲以非常之措置以收拾時局，茲告爾忠良臣民。」——終戰詔書'
  tags:
    chapter:
      publisher: 翰林
