    content: 園長的叮嚀
  group_stem: '葛尼奇和阿雅蕾特自從結婚有了小孩之後，幾乎沒有悠閒的時刻。有一天，兩人很想到海邊放鬆一下，送女兒到幼兒園之後，便到海灘晒太陽、享用美味的餐點，卻延誤了接女兒回家的時間。等到兩人趕到幼兒園時，看到園長蕾貝卡還留在園裡照顧自己的女兒，覺得非常內疚。幾個星期以後，園長宣布：「從今以後，家長來接小孩時，只要遲到10
    分鐘以上，幼兒園就要加收3 美元的罰款。」

    園長蕾貝卡宣布罰則後，葛尼奇和阿雅蕾特認為晚接小孩的代價只有3 美元，還滿划算的，所以他們不再像從前那樣拚命趕路，而是選擇把事情完成後再去接小孩，只要有繳罰款，就不用感到愧疚。而有這樣想法的家長不只他們兩人，因此遲到、延後接小孩的家長數目不但沒有減少，反而急遽升高。'
