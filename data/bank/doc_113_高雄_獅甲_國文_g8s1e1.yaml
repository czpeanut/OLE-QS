  group_stem: '許允婦是阮衛尉女，德如妹，奇醜。交禮竟（１），允無復入理，家人深以為憂。會允有客至，婦令婢視之，還答曰：「是桓郎。」桓郎者，桓範也。婦云：「無憂，桓必勸入。」桓果語許云：「阮家既嫁醜女與卿，故當有意，卿宜察之。」許便回入內。既見婦，即欲出。婦料其此出，無復入理，便捉裾（２）停之。」許因謂曰：「婦有四德，卿有其幾？」婦曰：「新婦所乏唯容爾。然士有百行，君有幾？」許云：「皆備。」婦曰：「夫百行以德為首，君好色不好德，何謂皆備？」允有慚色，遂相敬重。（劉義慶
    世說新語 □□）

    【注釋】（１）竟：完成。（２）裾：衣服的後襟。'
