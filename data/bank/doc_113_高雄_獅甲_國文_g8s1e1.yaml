  stem: 「番石榴，既不古又不美，兩頭不到岸」一句中的「兩頭不到岸」所指為何？
  options:
  - label: A
    content: 既不適合當饋贈親友的禮物，也不可以拿來當祭祖拜神的供果
  - label: B
    content: 既不能在國人心中成為臺灣之光，也不能在泰國、香港等外地發揚光大
  - label: C
    content: 既不是香甜氣佳、形貌綺麗可以外銷的佳果，也不是自古受歡迎能內銷的果物
  - label: D
    content: 既不屬原生、自古就受歡迎的嶺南佳果，也不是近代引入令人驚豔的熱帶果物。
  group_stem: '華南的熱帶水果可分兩類，原生的嶺南佳果，如荔枝、龍眼、柑橘等，自古已深受推崇禮讚，成為南方的象徵；而近代引入的熱帶果物，如香蕉、芒果、鳳梨、楊桃等，則以香氣甜味或綺麗形貌，令人驚豔珍愛，得以內售外銷，衍生可觀的商業價值。

    唯獨番石榴，既不古又不美，兩頭不到岸，只能流落在鄉野民間，連本地人都視為賤物。臺灣風俗中，番石榴既不宜饋贈，也不可拿來祭祖拜神，說是此果多生於糞溷（１），出身汙穢可疑。而由菝仔轉化而來的「芭樂」，不知何故，更成了臺語裡的貶抑詞，「芭樂票」指空頭支票，「芭樂歌」則是俗濫之音。

    和它的親戚蓮霧相比，菝仔就更顯坎坷。蓮霧也是桃金孃科的外來植物，土生種酸淡無滋味，但經改良，出落得美豔甜脆，地位直升，名聞遐邇，成為臺灣水果之光。同樣是風土特產，滋味也都清奇，浮沉卻各自異勢，原來豈僅人事，果物也有時運氣數。

    還好，近年來菝仔也逐步翻身，臺灣從泰國引進大芭樂後，培育出珍珠菝和水晶菝等新品種，九○年代末以來，「臺灣芭樂」漸成外銷水果主力，我在香港也能買到。吃過幾次，我也開始喜歡，它雖然不香，但風味爽利清甘，肉質亦不粗笨，那種微淡的鮮甜，點到為止，絕不纏膩，格外耐人尋味。（蔡珠兒
    女人狗肉）

    【注釋】（１）溷：音ㄏㄨㄣˋ，廁所。'
