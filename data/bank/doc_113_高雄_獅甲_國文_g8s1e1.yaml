- id: doc_113_高雄_獅甲_國文_g8s1e1_s5_37
  section: 5
  number: 37
  type: single
  page: 5
  stem: 科學家很感慨的說：「好像看到好幾部採取同步進行資訊處理的電腦在滾燙的沙漠上移動！」這是在讚嘆銀蟻具有何種能力？
  options:
  - label: A
    content: 能夠調節身體溫度，適應炎熱的沙漠
  - label: B
    content: 能夠身體協調，靈活換腳前進
  - label: C
    content: 能夠精確的計算光波振動方向
  - label: D
    content: 能夠成群結隊對抗天敵蜥蜴。
  group_stem: '夏天真的到了，天氣越來越熱了。屋外陽光猛照的日子，你寧可窩在房裡，任炎炎的夏日把柏油路面晒得熱氣直冒。你只要往外面望一眼，就會被烈日嚇得不敢再往外移動。其實房子外面再熱也不過攝氏三十五度而已，你能想像在攝氏六十度的沙漠裡，竟然還會有生物敢頂著陽光出巡嗎？

    瑞士的一組生物研究人員，花了好幾年的工夫，守在撒哈拉沙漠的不毛之地（１），耐心的觀測非洲銀蟻冒熱在沙上尋食的壯舉。但見一望無際的沙漠，在中午的陽光下燃燒。幾乎所有的動物都被熱呼呼的烈日照得骨頭都癱掉了。只有那一隻一隻的銀色螞蟻，正趁著「眾物皆癱」的時刻，來個「唯我獨行」的覓食活動，以求在極端惡劣的環境之下，能突破危險，來求取一線生機。為什麼牠們要這麼辛苦呢？原來在牠們的螞蟻洞外頭，經常有蜥蜴在一旁「虎」視眈眈（２），正在從事著「守洞待蟻」的勾當（３）。只要這些螞蟻一不小心爬出洞外，則一口一蟻，這些蜥蜴是毫不容情的。

    銀蟻們總不能在洞裡坐以待斃（４）吧！為了逃避蜥蜴的「虎」口，銀蟻就發展出一套在逆境中求生的策略。只見牠們選擇在日正當中的時刻才冒熱出擊。那時候，但見一隻隻蜥蜴都已被烤得全身動彈不得，只能眼睜睜的看那銀蟻在面前橫行而過。更氣人的是這些銀蟻得意著跳躍而去，簡直是欺人太甚！其實，跳躍不是因為牠得意忘形，而是為了沙粒實在是太燙腳了，牠必須經常的換腳前進。每一次只能以一隻腳輕輕點在沙上，讓其他的五隻腳輪番休息，手舞足蹈為的是讓剛剛才被燙到的腳有風涼的機會！你如果也有過赤腳走在滾燙的沙灘上的經驗，就會對這些銀蟻的跳躍動作發出會心的微笑了！

    更重要的是這些瑞士的研究者還有一個令人大開眼界的發現。原來這些銀蟻趁著正午的時候出巡，還有一個原因：牠們會利用日光反射在沙漠上的光波振動方向，來幫助確定遊走的方位。牠們那小小的腦袋，竟然能完成如此複雜的計算工作，不得不令人嘆為觀止。瑞士的科學家很感慨的說：「好像看到好幾部採取同步進行資訊處理的電腦在滾燙的沙漠上移動！」（改寫自曾志朗《用心動腦話科學．螞蟻雄兵》）

    【注釋】（１）不毛之地：荒涼貧瘠、不生草木的土地。（２）虎視眈眈：比喻心懷不軌，想要伺機掠奪。眈，音ㄉㄢ。（３）勾當：音ㄍㄡˋ ㄉㄤˋ，事情，多指壞事而言。（４）坐以待斃：形容面臨危難，不積極有所作為，反而坐等失敗。'
