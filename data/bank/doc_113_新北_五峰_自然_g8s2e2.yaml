  stem: '現有四杯透明溶液甲、乙、丙、丁，體積均相等，但因為未貼標籤所以無法得知其為何種溶液，只知這四杯溶液有可能為：加了兩滴酚酞的純水、氫氣化鈉或鹽酸。現奶寶進行下列操作：

    一、將甲溶液倒入乙溶液中，溶液變為紅色。

    二、將步驟一混合溶液倒入丙溶液中，溶液變為透明。

    三、將步驟二混合溶液倒入丁溶液中，溶液又變為紅色。

    則對於溶液成份的推測，何者正確？'
  options:
  - label: A
    content: 甲必為加了兩滴酚酞的純水。
  - label: B
    content: 乙必為氫氧化鈉。
  - label: C
    content: 丙必為鹽酸。
  - label: D
    content: 丁必為鹽酸。
