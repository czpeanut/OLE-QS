- id: doc_113_高雄_五甲_英語_g8s1e3_s5_1
  section: 5
  number: 1
  type: single
  page: 3
  stem: What is the main idea of the reading?
  options:
  - label: A
    content: We have to buy things that we need, not things that we want.
  - label: B
    content: We will buy things with Fairtrade price at a higher price.
  - label: C
    content: When we buy things with a Fairtrade logo, we can help the poor.
  - label: D
    content: When we buy things in poor countries, we help Fairtrade Foundation.
  group_stem: '(一) . F is for Fairtrade, but what is Fairtrade?


    Fairtrade is an easy but important idea. It''s all about giving people who produce
    the things you buy a fair price for their work. Lots of people in poor countries
    work long hours for very low pay. Often, only very little money can finally go
    to the poor''s hands. Did you know nearly half the people in the world live on
    less than 80 NT dollars a day? The Fairtrade Foundation was set up to help these
    producers in poor countries to get a fair price for their work. When you buy something
    with a Fairtrade logo on it, you know that a fair amount of money is going to
    the poor directly. There are many everyday goods like food, tea, coffee, sugar,
    and fruits that you can buy with Fairtrade. Don''t forget to check on the logo.


    ✧ Fairtrade goods are sold in over 120 countries.

    ✧ The first Fairtrade product was chocolate bars.

    ✧ Fairtrade goods come from over 70 different countries around the world.


    ● produce 生產 price 價格 less than 少於 producer 生產者 directly 直接地 fair 公平的'
