- id: doc_113_高雄_五甲_英語_g8s1e3_s5_5
  section: 5
  number: 5
  type: single
  page: 3
  stem: Which could also be a title for the reading? * title 標題
  options:
  - label: A
    content: Singaporeans' Secret to Health
  - label: B
    content: Tea and Coffee in Singapore
  - label: C
    content: Different Ways to Order Coffee in Singapore
  - label: D
    content: Singaporeans' Favorite "Kopi"
  group_stem: '(二) Experience Coffee the Singaporean Way


    In Singapore, "kopi" means coffee, and there are many ways to enjoy it. One way
    is "kopi-O," which is black coffee with sugar. "kopi-O kosong" is black coffee
    without sugar. If you want coffee with milk and sugar, say "kopi C." If you want
    your coffee stronger, ask for "kopi gao." "Gao" means thick in Hokkien. Singaporeans
    love their kopi. They often have it with extra milk, less sugar, or cold with
    ice. At Kopitiams, local coffee shops, people come together to enjoy kopi and
    food. These places play an important role in daily life in Singapore.


    To learn more about how to order different types of kopi, you can visit:

    https://www.visitsingapore.com.cn/editorials/order-kopi-like-a-local/


    ● Singapore 新加坡 Hokkien 福建話 Singaporean 新加坡人 Kopitiam 咖啡店 extra 額外的 local 當地的
    role 角色 daily 日常的'
