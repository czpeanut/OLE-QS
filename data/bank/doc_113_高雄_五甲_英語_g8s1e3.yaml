- id: doc_113_高雄_五甲_英語_g8s1e3_s5_8
  section: 5
  number: 8
  type: single
  page: 4
  stem: What does "summit" mean in the reading?
  options:
  - label: A
    content: A time for visiting.
  - label: B
    content: A building to stay in.
  - label: C
    content: The top of a mountain.
  - label: D
    content: The right to come or go into a place.
  group_stem: '(三) Hiking Life : Mount Hatley


    Every year, about 250,000 people from all around the world come to hike Mount
    Hatley. It is open to hikers from early July to late September because the mountain
    is usually free of snow during those months.


    There are four trails, with different starting points. Hikers usually go to the
    starting points by bus, then go up on foot. Trail-4 is the most popular hiking
    trail and the most accessible from the city.


    | Trail-1 | | Trail-2 | | Trail-3 | | Trail-4 | |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | Level | ★ | Level | ★★★ | Level | ★★ | Level | ★ |

    | Up | 5km 5hrs | Up | 12km 8hrs | Up | 7.5km 6.5hrs | Up | 7.5km 6hrs |

    | Down | 5km 3hrs | Down | 9km 4hrs | Down | 6.2km 3hrs | Down | 7.6km 3hrs |

    | Hikers (2020) | 70,319 | Hikers (2020) | 18,411 | Hikers (2020) | 23,475 | Hikers
    (2020) | 172,657 |

    | Huts | 8 | Huts | 4 | Huts | 12 | Huts | 18 |


    To most hikers, it usually takes two days to go up and down Mount Hatley. They
    rest at a mountain hut and begin at night in order to reach the summit in time
    to watch the sunrise. Staying at one of the mountain huts costs $80, and a hot
    meal is about $8. Also, there are no "free" restrooms on Mount Hatley. It will
    cost you $3 to use the restrooms.


    Finally, Mount Hatley is not an easy mountain to hike at all. Please train before
    your trip. Good luck and happy hiking!


     trail 步道 starting point 起點 accessible 容易到達的 level 程度 hut 山屋 sunrise 日出'
