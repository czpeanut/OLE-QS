  number: 43
  type: single
  page: 6
  stem: What is the reading mostly about?
  options:
  - label: A
    content: Why people play sports.
  - label: B
    content: How to become a professional athlete.
  - label: C
    content: How to help young people stay away from problems.
  - label: D
    content: Whether young people should spend lots of time on sports.
  group_stem: 'A lot of people play sports, but few people become professional athletes.
    If sports aren’t going to be your career, then why should you play them? Why should
    you train every day? Why should you work hard and feel sore the next day? Wouldn’t
    it be better to forget sports and only focus on school?

    There are actually a lot of good reasons to play sports. First of all, sports
    are a great way to exercise. Exercising keeps you healthy and strong. It also
    helps you stay in a good mood. When you exercise, your body produces endorphins,
    which make you feel not only stronger but also happier.

    Sports are important for everyone, but they are especially important for young
    people. They teach young people about winning and losing. Also, they teach young
    people how to work as a team and respect others.

    Many reports say that sports help young people stay away from problems. If young
    people play sports, they get into trouble less often. This is because sports teach
    people about rules. They also teach people that if they work hard, they might
    succeed.

    Another good thing about sports is that they get people out of their houses. These
    days, a lot of us spend too much time using computers or cellphones. When you
    play sports, you go outside and exercise in the sun. You get some fresh air and
    may get a bit dirty. All of these things are important.

    You’re probably not going to become a professional athlete, but that doesn’t matter.
    Sports will help you become a better and happier person. Sports will help you
    make friends and stay healthy. And here is another good reason to play sports:
    They are fun!


     professional athlete 職業運動員 endorphins 腦內啡 especially 尤其 succeed 成功'
