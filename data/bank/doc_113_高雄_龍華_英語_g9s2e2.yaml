  group_stem: 'When speaking of voting, we can’t miss its history. Greece is the country
    where voting was first held. In ancient Greece, only men who owned land had the
    right to vote. They were asked to vote and decide which political leader or candidate
    was going to leave their country. Usually, the one who did not do their job well
    was voted to be exiled for the next ten years.

    As for the early ballot system in old Greece, voters wrote their choice on broken
    pieces of pots. If any candidate got more than six thousand votes, the one with
    the largest number would have to leave Greece. If no one got over 6,000 votes,
    then all the candidates would stay.

    As you can see, not everyone could enjoy the right to vote. Take the USA for example,
    women couldn’t vote until the 1920s when the 19th Amendment was made. Later, in
    the 1960s, black people were finally allowed to vote. From then on, voting has
    been common around the world, and everyone can enjoy the right to vote.


