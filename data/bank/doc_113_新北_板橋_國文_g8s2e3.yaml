  stem: 看雲的日子一文中，作者用了大量的筆墨去描繪雲的各種姿態，下列何者描寫的對象並非「雲」？
  options:
  - label: A
    content: 像仙女的魔棒，所到之處灑下魔幻金粉，帶給觀者無窮盡的驚奇
  - label: B
    content: 仰頭欣賞著那無盡的虛空，那層層藍色便如海水般盈滿所有視線
  - label: C
    content: 一會兒旋轉柔軟身體，一會兒跳躍美妙的舞姿，這一刻飛舞在山這頭，下一刻便又躍升到遙遠天際
  - label: D
    content: 有時真的像極了可口清涼的霜淇淋，讓人忍不住想飛上天咬一口
  lesson_raw:
    title: 看雲的日子
