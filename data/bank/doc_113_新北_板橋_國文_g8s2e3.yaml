- id: doc_113_新北_板橋_國文_g8s2e3_s2_43
  section: 2
  number: 43
  type: single
  page: 6
  stem: 依據文章資訊與背景，下列何者不是日本發展家用機器人的主要原因？
  options:
  - label: A
    content: 減少因勞力短缺產生的經濟壓力
  - label: B
    content: 提高老人照護的品質與效率
  - label: C
    content: 提供青少年情緒輔導與心理支持
  - label: D
    content: 取代保母等需要長期陪伴的角色
  group_stem: "我們常會說一個冷血無情、不懂感情的人是冷冰冰的機器，現在這個說法可能要改變一下，因為日本的軟銀公司(Softbank)就開發出了可以讀懂人類情感的機器人「胡椒」(Pepper)。\
    \ \n機器人胡椒可以使用「情感引擎」和雲端人工智慧系統分析人的姿勢、表情和聲音的音調。機器人之間還可以用雲端分享資料，幫助他們更了解人類的情感，而且主人的資料也不會經由雲端洩漏出來。\
    \ \n  機器人可以讀懂情感，人類就能夠自由自在地和機器人胡椒溝通，而且感覺就像是在跟家人朋友聊天一樣，除此之外，機器人胡椒還會做非常多的事情。  \n\
    軟銀公司老闆孫正義(Masayoshi Son)在記者會上說：「我們形容一個沒有感情、沒有心的人是機器人」「這是人類史上第一次，我們給了機器人一顆心和情感。」\
    \  \n軟銀公司將會在旗下兩家店裡放上機器人，讓民眾可以跟機器人互動。他們也計畫未來陸續在軟銀公司的各國分店也放上機器人。機器人胡椒預計在明年上市，售價是19.8\
    \ 萬日幣(折台幣5.7 萬)。日本的人口現在正在快速老化，出生率也不斷下降，造成日本老人的人數增加，年輕的勞動力減少，因此日本政府希望企業可以用機器人代替人力，減緩勞動力減少帶來的衝擊。\
    \  \n分析指出，在日本這樣老年人眾多的國家，家用機器人的發展會更加快速。對機器人的需求主要會來自企業和家庭；企業因為勞力的短缺和人力成本，改雇用機器人當員工；一般家庭也會因為家裡有需要照顧的老人，採用機器人來代替保母。預期機器人市場的成長，許多家日本科技公司紛紛投入機器人的開發。像是松下電器(Panasonic)就和旗下的機器人研究公司ActiveLink\
    \ 研發出機器人裝，這個機器人裝能幫助拿重物、從樹上採水果等高勞力高負擔的工作。個人或家庭機器人方面則有本田(Honda)的Asimo 機器人，Asimo\
    \ 機器人就被視為未來可以替小家庭提供家庭照護的機器人 \n                                             選自DQ\
    \ 地球圖輯隊 日本推出可以讀懂情感的機器人"
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 國文
      code: 第十課
      title: 科幻極短篇選(一)深藍的憂鬱(二)替代死刑
