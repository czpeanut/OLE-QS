    content: 親眼見到妖怪
  - label: B
    content: 聽到虎聲後察覺
  - label: C
    content: 周象告訴他夢境
  - label: D
    content: 過周象家時感應到妖氣
  group_stem: "周象者，好畋獵，後為汾陽令，忽夢一乳虎相逼，驚而睡覺，因茲染疾。 後有僧海寧者，因過象門，謂鄰叟曰：「此居有妖氣，久則不可救也。」鄰叟遂聞於象。\
    \ 象召僧令視之，僧曰：「當與君禳之。」遂擇日設壇，持劍禹步誦咒。 自大門而入至於寢所，繞患人數遍而叱之，忽於床下作一虎聲，家人悉驚奔散。周象亦不覺投床下，伏死於地。\
    \ 僧以水噀之，須臾如故。 \n註(1)禳：祭神祈求消除災變 \n註(2)噀：將水含在口中噴出去                             \
    \          《開元天寶遺事》"
