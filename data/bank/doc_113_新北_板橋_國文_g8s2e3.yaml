    \ \n*邊緣模式：沿牆壁及傢俱邊緣掃除灰塵。 \n三、日常維護：每次使用後，請清理集塵盒及過濾網，避免堵塞影響吸力。定期檢查滾刷及邊刷是否纏繞毛髮。 \n\
    四、注意事項：避免在潮濕或有液體的地面使用，以防機器人滑倒或損壞。遇到卡住狀況，請先關閉電源，清除障礙物，再重新啟動。切勿自行拆卸，以免損壞機器。"
