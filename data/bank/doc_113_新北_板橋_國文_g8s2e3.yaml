  group_stem: "智慧型掃地機器人使用說明書 \n一、充電：將充電座放在平坦、靠牆的位置，避免陽光直射及潮濕環境。首次使用時，請將機器人放置充電座充滿電，約需4\
    \ 小時。 \n二、啟動與清掃模式：充滿電後，使用遙控器按下啟動鍵開始清掃。機器人有三種清掃模式： \n*自動模式：自主規劃路線，自動避障清掃。 \n*定時模式：針對髒污區域反覆清掃。\
    \ \n*邊緣模式：沿牆壁及傢俱邊緣掃除灰塵。 \n三、日常維護：每次使用後，請清理集塵盒及過濾網，避免堵塞影響吸力。定期檢查滾刷及邊刷是否纏繞毛髮。 \n\
    四、注意事項：避免在潮濕或有液體的地面使用，以防機器人滑倒或損壞。遇到卡住狀況，請先關閉電源，清除障礙物，再重新啟動。切勿自行拆卸，以免損壞機器。"
