- id: doc_113_台中_五權_國文_g7s1e1_s2_31
  section: 2
  number: 31
  type: single
  page: 3
  stem: 根據內容，下列何者並非作者曾在「魔術盒子」中所經歷？
  options:
  - label: A
    content: 聽到各種聊天內容
  - label: B
    content: 坐在陌生人的周邊
  - label: C
    content: 和人一起玩撲克牌
  - label: D
    content: 看見各處睡滿了人。
  group_stem: "（一） \n    對我來說，火車永遠是魔術盒子。 \n    永遠帶你到某個地方，每一次跟著幾乎完全不同的人。我永遠猜不到坐在我前面、後面、左邊、右邊的會是什麼人。也許我會重複坐過某個車廂某個號碼的座位，但我永遠不能確定下次我會坐在哪個車廂，跟著哪些陌生、相識的人。這是火車的第一個魔術――比撲克牌、麻將、六合彩更富變化的重組遊戲。\
    \ \n    這是藏著各種不同聲音和生命風景的魔術盒子。你也許一上車就聽到兩個聒噪的聲音天南地北的開講起來。這聲音確定你並不熟悉，然而他們居然愈逼愈近，開始談到你身邊的某個熟人。你試圖猜測說話者的身分，忽然間，他們居然談到了你。你趕緊抬頭看看他們，發現他們並不認識你，等你定下來，準備再聽他們怎麼說你，他們已轉向改談天氣……。\
    \ \n    魔術盒子開開合合，倒出這些，又裝進那些。當兵的時候有一次搭每站皆停的夜車從高雄到臺北，半夜醒來發現腳下、座位下、走道上，甚至頭上的行李架上都睡滿了人。這真像魔幻寫實主義的小說。\
    \ \n    我特別懷念童年的時候東線火車。那時候，坐火車似乎是一件大事。每次要到外公家，母親總是燒著一大鍋熱水幫我們兄弟洗頭、洗澡。記憶中我的東線火車總是載著明亮的陽光跟濃濃的肥皂味，從花蓮開到玉里再開到大舅舅住的富里就停了。\
    \ \n                                                            （改寫自陳黎〈魔術火車〉）"
  tags:
    textbook: 第一冊（七上）第1次段考範圍
    labeled_by: ai
