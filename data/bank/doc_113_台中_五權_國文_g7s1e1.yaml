  group_stem: "（三） \n    童年的午後，南臺灣的陽光還沒有變涼以前，我是不被獲准打開院子的紅色木門、衝到巷子裡呼朋引伴的小囚犯。 \n   \
    \ 閒得發慌，翻翻圖畫書，玩玩紙娃娃，拿舌尖頂頂要掉不掉的那幾顆蛀牙，我總是自然而然地爬上沙發，挨近置物架上的一口籐籃，伸長手臂挖挖掏掏，嘿，一條嶄新的奶油巧克力。\
    \ \n    剝開包裝紙，一陣可愛的濃郁香味，教人不由得微笑；輕盈的奶油咖啡光澤，月光似的鋪在巧克力塊表面，迷醉了我小小亮亮的眼瞳；大口一咬，奶油夾心QQ\
    \ 黏牙，我彷彿嚼著全世界的最快樂與最美妙，過癮哪，想跺腳。 \n    嚼著嚼著，那些快樂和美妙，竟化成顆顆蛀牙，搖的搖，掉的掉；有時候還得哭喪著臉，被爸爸半嚇半哄拉進牙醫診所，才能解決惱人的疼痛與不舒服。\
    \ \n    蛀牙一顆繼一顆離開我的嘴巴。童年越縮越短，新牙一顆繼一顆宣告：我正慢慢長大。 \n    到底是什麼時候，不再把奶油巧克力當成當成最快樂與最美妙？老實說，我已經忘了。只記得在偷吃蒜爆五花肉的某個下午過後，自己的口味忽然由甜轉鹹，從此蝦味先和鱈魚香絲大把大把嚼，吃什麼都要香要鹹，甚至愛上麻嘴的辣椒醬。\
    \ \n    現在，我真的長大了，新的恆牙早長齊，還被牙醫使著大鉗拔掉四顆智齒。但，即使咬著同樣的奶油巧克力，嚼著不變的奶油夾心，半顆蛀牙也沒有的我，卻再也嘗不到那些下午的快樂，那些下午的美妙。\
    \ \n \n                                （節錄自侯維玲〈那些味道，我的蛀牙知道〉）"
  tags:
    textbook: 第一冊（七上）第1次段考範圍
    labeled_by: ai
