  stem: We can infer that Bozo did not have ________ when he was on the island.    📄infer
    推論
  options:
  - label: A
    content: tools
  - label: B
    content: clothes
  - label: C
    content: a radio
  - label: D
    content: food
  group_stem: "The Hermit\n      \n      Most people like living with others, but\
    \ some people prefer to live alone. One example is Bozo\nKucik. Bozo lived alone\
    \ on a small island for more than eighty-four years!\n      In 1888, when Bozo\
    \ was just sixteen years old, his father left him on a small island near Croatia.\n\
    Before leaving, his father kissed him goodbye and said, \"I hope everything goes\
    \ well for you, my\nson.\" Then his father sailed away without him. Why did he\
    \ do this? Bozo asked him to.\n      Bozo's father was a poor farmer with seven\
    \ children. He couldn't take care of all of them. So, he\nasked his sons to decide\
    \ what they wanted to do. Bozo decided he wanted to live alone, far from\npeople.\n\
    \      While Bozo lived alone, many big events happened in the world, like World\
    \ War I and World\nWar II. But Bozo never heard about them because he lived on\
    \ his island without any contact with\nthe outside world.\n      In 1972, a group\
    \ of fishermen came to Bozo’s island. They tried to talk to him, but at first,\
    \ Bozo\nran away from them. After some time, he let them come into his simple\
    \ home, a small stone hut\nwith no windows.\n      The fishermen talked to Bozo\
    \ for more than two hours. They told him about the two world wars\nhe missed.\
    \ When they asked how old he was, Bozo guessed he was one hundred years old. The\n\
    fishermen asked him if he wanted to go home, but Bozo said no. He was happy living\
    \ alone on his\nisland.\n\n \U0001F4C4prefer 較喜歡   event 事件   contact 接觸   hut\
    \ 小屋"
