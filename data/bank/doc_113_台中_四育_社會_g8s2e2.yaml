- id: doc_113_台中_四育_社會_g8s2e2_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 請問滿洲國的成立與日本的哪場擴張行動有關聯？
  options:
  - label: A
    content: 九一八事變
  - label: B
    content: 七七事變
  - label: C
    content: 五九國恥
  - label: D
    content: 五四運動
  group_stem: '1932 年，在中國東北成立的滿洲國，與當時的臺灣都由日本所殖民。日本為了加速滿洲國的建設，放出消息說，去滿洲國工作，薪水會是在臺灣的三倍。此時臺灣有才能、有野心的年輕人，紛紛前往異鄉奮鬥，希望創造美好的未來。滿洲國的第一任外交總長—謝介石，就是在這樣情況下，遠赴他鄉。幼年時期的謝介石，遭遇國破山河在的憂患，曾擔任伊藤博文來臺通譯的他，在職場上體驗到時代對翻譯能力的需求性與希望積極創造自己的不可取代性，他離開臺灣，前往日本留學，於明治大學法律系畢。

    畢業後的他，輾轉到了中國的天津，因而認識張勳，得以在底下做事，民國6 年發生的復辟事件，使他與溥儀結緣。其後，溥儀聘謝介石為擔任天津行在御前顧問和外務部右丞，這份工作也讓後來日本人知道了他的才能，更因為他被殖民的曾經，更加受到日本人的認同，一躍成為滿洲國的第一任外交總長，當時的報紙形容謝介石是「幸運兒」。

    直至二戰結束，日本無條件投降，這些人的成功頓時成為過街喊打的屈辱，謝介石等人曾在滿洲國呼風喚雨的過去，成為新政權撻伐的「漢奸」，被捕入獄。'
  tags:
    chapter:
      publisher: 翰林
