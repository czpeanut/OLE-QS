    content: 必須附加於主刑而科處。
  group_stem: "二、\n    鑒於歷年來幾起重大經濟犯潛逃出境，及黑心食品案件屢屢發生，卻因法律限制而無法沒收犯罪者或企業的不法所得，因此立法院進行修法，在《刑法》中新增「沒收」專章，以保障受害者的權益，並藉此呼籲有犯罪意圖者，勿存僥倖心裡，從事犯罪不僅須受刑罰處罰，所得的利益將全部被沒收。請問："
