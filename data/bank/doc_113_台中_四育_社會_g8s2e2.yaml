- id: doc_113_台中_四育_社會_g8s2e2_s3_57
  section: 3
  number: 57
  type: single
  page: 7
  stem: 根據上文，下列敘述何者正確？
  options:
  - label: A
    content: R 小姐的案件與民事糾紛有關
  - label: B
    content: 陳先生報案為向警察自首的方式
  - label: C
    content: 起訴R 小姐竊盜罪嫌疑的是律師
  - label: D
    content: R 小姐犯竊盜罪的判決是出自法院
  group_stem: '一、

    監護工R 小姐與陳先生一家人同住。陳先生的女兒因衣物遺失，要求R 小姐打開行李箱，在箱中發現了陳先生家人的衣物。陳先生向警察報案，在警察和檢察官的調查下，由檢察官認定R
    小姐有竊盜嫌疑而起訴。法官根據手上擁有的證據，判「R 小姐犯竊盜罪；此案可以上訴」。

    R 小姐不服判決結果，向法院提出上訴，法官認為沒有證據可證明R 小姐的犯罪行為，且仍存在其他合理的懷疑，例如：衣物是從哪裡找出，不能認定R 小姐就是有罪的人，最終宣判撤銷對R
    小姐原先的判決結果，改判無罪。

    （資料來源：改寫自1.臺灣基隆地方法院108 年易字第293 號刑事判決，司法院判決書查詢，2019/10/22。2.臺灣高等法院108 年上易字第2253
    號刑事判決，司法院判決書查詢，2020/02/12。）'
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 公民
      code: 3-1
      title: 刑法的意義
      chapter: 第3章 刑法與刑罰
