  - label: B
    content: 哈薩克人
  - label: C
    content: 阿拉伯人
  - label: D
    content: 庫德族人
  group_stem: '第一次世界大戰期間，英國與法國為了瓜分西亞的鄂圖曼土耳其，畫設了賽克斯－皮科協議（Sykes-Picot Agreement）。該協議決定了英、法在當地的勢力範圍，並影響了現今敘利亞、伊拉克等國的邊界畫設，被認為是現今西亞衝突不斷的重要因素。但也有觀點指出，族群分布本來就是交錯、難以畫分，因此邊界並不能完全解釋此區的長期紛擾。

    （參考資料：Sykes-Picot Agreement，Britannica，2022/03/17查閱；Nick Danforth，Stop Blaming
    Colonial Borders for the Middle East''s Problems，The Atlantic，2013/09/11。）'
  shared_asset: g2_22_23
  uncertain_spans:
