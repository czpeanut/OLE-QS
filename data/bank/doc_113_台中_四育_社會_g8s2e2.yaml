  section: 1
  number: 1
  type: single
  page: 1
  stem: 在某本以近現代中國為背景的小說中寫到︰「最近，國家開始實施新政策，由政府指定中央、交通、中國這幾家銀行發行法幣。我想，此政策若真能好好實行，改善過去幣制混亂的情況，買賣交易就比較好做了。」這段話所呈現的最可能是中國處於下列何種局勢下的情況？
  options:
  - label: A
    content: 戊戌變法期間，朝廷推動經濟改革
  - label: B
    content: 八國聯軍結束，朝廷陸續推行新政
  - label: C
    content: 北伐統一完成，政府致力建設發展
  - label: D
    content: 中華民國初創，政府收繳民間銀兩
