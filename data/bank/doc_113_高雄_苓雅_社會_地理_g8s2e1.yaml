  stem: 棕櫚油取自油棕的果實，從食物到化妝品等產品都以棕櫚油為重要原料。由於國際市場需求量大，油棕的種植在部分地區已造成生態環境破壞，歐洲國家正計畫逐步禁止車輛使用棕櫚油生質燃料。但主要生產國家向世界貿易組織(WTO)提出申訴，認為歐洲國家對棕櫚油採取「歧視性」政策，可能令雙方貿易爭執加劇。請問向世界貿易組織
