  group_stem: "閱讀文章，並回答17~20 題：\n17 世紀初，荷蘭人從葉門引入咖啡豆，展開了■國的咖啡種植歷史，目前■國的咖啡產量為世界第四。除了得天獨厚的自然條件，當地氣候濕熱多雨，咖啡豆不易乾燥，咖啡農們必須好好利用曝曬生豆的時間，因此發展出獨特的咖啡處理法，名為二次曝曬的「濕剝法（Giling\
    \ Basah）」。當地農民人工摘採咖啡果實後，會讓生豆在帶殼的狀態下第一次曝曬，當含水量剩下30～50%時就先剝去殼及果肉，再進行第二次曝曬，藉此縮短日曬的時間。這種方式相較一般日曬法可以節省至少3\
    \ 成的製程時間。\n■國境內有五個主要咖啡產區：\n【爪哇】：17 世紀荷蘭人開始種植阿拉比卡咖啡豆，咖啡豆採用水洗法，酸度較低，味道較甜，烘焙度較深。\n\
    【蘇拉威西】：採用濕剝法，讓咖啡呈現滑順的口感，大多味道較清淡。\n【蘇門答臘】：採用濕剝法，豆子酸度低，有巧克力味，且因為生長在火山土壤，帶有土地芳香及草豆蔻等香料味。\n\
    【弗洛勒斯】：主要產地鄰近許多活火山和休火山，火山噴發帶來的火山黑土助長當地有機咖啡的耕作。\n             使用濕剝法，咖啡豆較甜，有牛奶巧克力的味道，也帶有花香、木香。\n\
    【峇里】：產於金塔馬尼高地，位置在布拉坦和阿貢火山之間，助長高品質咖啡的栽種。採用水洗法，烘焙度深。\n         花、檸檬、巧克力等多種滋味集中於該咖啡豆。"
