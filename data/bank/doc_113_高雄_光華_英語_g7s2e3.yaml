  group_stem: "IV.  \nSwitzerland is a small but very beautiful country in the middle\
    \ of Europe.  It is famous for its high \nmountains, delicious chocolate and excellent\
    \ watches.  The Alps are some of the tallest mountains in the world. \nThey cover\
    \ a large part of the country.  People from all over the world come here to ski,\
    \ hike and enjoy the \namazing views.  Switzerland is also known for being very\
    \ clean and for having everything run on time.   \n    Switzerland was formed\
    \ when three small states got together in 1291.  More small states joined over\
    \ the \nyears, and today, Switzerland has twenty-six.    Switzerland hasn’t joined\
    \ in wars for hundreds of years.  This \nis why many important international organizations,\
    \ such as the RED Cross, have their main offices in \nSwitzerland.  Switzerland\
    \ is often listed as one of the best countries in the world to live in. \n   \
    \ Swiss people love their traditions.  One popular tradition is yodeling, a special\
    \ way of singing.  It was first \nused to communicate in the mountains.  Another\
    \ is making cheese; Switzerland is famous for its many kinds of \ncheese. \n \
    \    Swiss cows spend the summers high in the mountains.  At the end of the summer\
    \ season, cow farmers \nbring their animals down into the local villages.  The\
    \ cows wear flowers and large cowbells.  The villages \ncelebrate their return\
    \ with food and music"
