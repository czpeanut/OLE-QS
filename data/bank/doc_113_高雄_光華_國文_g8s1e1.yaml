  - label: B
    content: 「在跳板與水面之間／描畫出從容的曲線」展現出跳水者經過無數苦練後，充滿力與美的優美姿態
  - label: C
    content: 「讓青春去激起／一片雪白的讚嘆」意指跳水者耗費青春練習，卻只得到不切實際的讚賞
  - label: D
    content: 全詩表現出運動員無悔的付出，與不求回報的心情。
