    content: 白居易，字樂天，晚號香山居士。因遭遇喪母之痛，而藉著慈烏夜啼一詩抒發子欲養而親不待的遺憾
  - label: B
    content: 古詩十九首皆為五言詩，其主題大致分為逐臣棄婦、朋友闊絕、遊子他鄉、亂世裡的人生感慨等
  - label: C
    content: 魏 晉 南北朝時期盛行短篇雜錄的筆記小說，可分為志人與志怪兩類，世說新語即為志怪類的代表
  - label: D
    content: 南朝 宋的劉義慶，襲封臨川王，曾召集文士編撰書籍，其中著名的有世說新語、幽冥錄等。
