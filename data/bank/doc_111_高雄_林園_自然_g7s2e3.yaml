    | 名稱 | DDT 含量（ppm） |

    | :--- | :--- |

    | 海水 | 0.00001 |

    | 生物甲 | 0.003 |

    | 生物乙 | 5 |

    | 生物丙 | 0.02 |

    | 生物丁 | 0.1 |

    | 生物戊 | 42.7 |'
  options:
  - label: A
    content: 甲→乙→丙→丁→戊
  - label: B
    content: 甲→丙→丁→乙→戊
  - label: C
    content: 戊→乙→丁→丙→甲
  - label: D
    content: 戊→丁→丙→乙→甲
  answer:
  - B
  answer_source: answer_key_vlm
