  stem: 'DDT 是一種農藥，早期曾經在世界各地被廣泛利用，發現者甚至因此拿了諾貝爾獎。但在70 年代後，科學家發現DDT 進入食物鏈後，無法被大部分生物分解，導致許多生物因為累積過多的DDT
