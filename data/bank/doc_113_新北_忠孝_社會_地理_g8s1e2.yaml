  section: 2
  number: 23
  type: single
  page: 2
  stem: "23.都市發展與交通息息相關，大都市常位在各種交通方\n 式交會的樞紐上。請問上海的交通方式可將其歸納成附\n 表中哪一種類型？\n| 類型 |\
    \ 交通方式 |\n| :---: | :--- |\n| 甲 | 鐵路－公路樞紐 |\n| 乙 | 海運－鐵路－公路樞紐 |\n| 丙 | 河運－鐵路－公路樞紐\
    \ |\n| 丁 | 河運－海運－鐵路<br>－公路樞紐 |"
  options:
  - label: A
    content: 甲類
  - label: B
    content: 乙類
  - label: C
    content: 丙類
  - label: D
    content: 丁類。
