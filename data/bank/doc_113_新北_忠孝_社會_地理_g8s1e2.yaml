  stem: "19.明清時期，中國東南沿海人口急遽增加，許多人移居\n 海外，成為移居地的「華人」，並傳播漢人文化。請問:\n 根據地理位置，下列哪一地區並非東南沿海居民的主要\n\
    「移居地」?"
