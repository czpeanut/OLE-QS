  section: 2
  number: 22
  type: single
  page: 1
  stem: "22.附圖是中國糧食作物栽種面積比例變化圖，根據圓餅\n 圖呈現的變化，可看出近年中國農業發展何項主要特\n 色？"
  options:
  - label: A
    content: 國民所得增加，使消費需求多元化
  - label: B
    content: 經濟成長停滯，降低糧食消費需求
  - label: C
    content: 環境汙染惡化，導致耕作面積減少
  - label: D
    content: 貿易需求，刺激蔬果種植面積增加。
