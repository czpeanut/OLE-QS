  type: single
  page: 1
  stem: "20.中國近10 年來的人口政策口號從「一對夫妻只生一\n個\n 孩子」，到「全面實施兩孩政策」、「三孩政策來了」\n這\n 主要反映了中國人口結構的何種特徵？"
