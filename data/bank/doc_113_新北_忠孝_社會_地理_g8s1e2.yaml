- id: doc_113_新北_忠孝_社會_地理_g8s1e2_s2_24
  section: 2
  number: 24
  type: single
  page: 2
  stem: "24.傳統的人口學認為，一個國家如果人口快速成長，會\n 造成糧食不足，扶養壓力沉重，不利經濟成長。然而，\n 近年來，許多經濟學的研究卻證實，人口成長是經濟成\n\
    \ 長的動能，反倒人口成長緩慢，會造成經濟成長停滯。\n 因此，中國在1979 年實施的「一胎化」政策不只是為\n了\n 解決人口壓力，更可能是配合1978\
    \ 年「經濟改革開\n放」\n 政策的勞力需求！請問；根據上述，下列何者最可能是\n 中國政府推出「一胎化」政策的主要原因？"
  options:
  - label: A
    content: 家庭貧困孩子缺乏照顧
  - label: B
    content: 人口壓力造成糧食飢荒
  - label: C
    content: 引導婦女勞力投入生產
  - label: D
    content: 性別失衡有礙經濟發展。
  tags:
    chapter:
      publisher: null
      book: 八上
      subject: 社會
      code: null
      title: null
      chapter: null
    textbook: 八上 第2次段考範圍
    labeled_by: ai
