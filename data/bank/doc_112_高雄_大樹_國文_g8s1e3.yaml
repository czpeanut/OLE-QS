  stem: '「假新聞何以在美國這麼流行？美國ＣＢＳ『六十分鐘』節目訪問很多假新聞當事人，有人說︰『我有這麼多粉絲追隨，一定要滿足他們」』；還有人為了『看到按讚分享數字狂跳，就讓我興奮莫名，上了癮』。這麼多新聞造假，追快與聳動、娛樂化，社群媒體的轉播與行銷，都是原因之一，也造成新聞出錯率高，品質下降的自我沉淪。另一原因是記者常把臉書、推特當成消息來源，網路傳播快速，一旦犯錯覆水難收。因此在社會日趨激情的時代，媒體更應冷靜自持，提升新聞品質。」

