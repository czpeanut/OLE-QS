- id: doc_112_高雄_大樹_國文_g8s1e3_s6_6
  section: 6
  number: 6
  type: single
  page: 5
  stem: 談生的妻子對他說「勿以火照我也」，其原因為何？
  options:
  - label: A
    content: 面容會在半夜產生變化
  - label: B
    content: 希望丈夫能夠以禮相待
  - label: C
    content: 希望自己可以成功復生為人
  - label: D
    content: 不希望談生發現她私藏珍寶
  group_stem: "談生者，年四十，無婦。夜半，有女子年可十五六，姿顏服飾，天下無雙，來就生為夫婦。曰：「我與人不同，勿以火照我也。三年之後，方可照。」為夫妻，生一兒，已二歲。不能忍，夜伺其寢後，盜①照視之，其腰以上生肉，如人，腰以下但有枯骨。婦覺，遂言曰：「君負我！我垂②生矣，何不能忍一歲而竟相照也？」生辭謝③，涕泣不可復止。云：「與君雖大義永離，然顧念我兒，若貧不能自偕活者，暫隨我去，方遺④君物。」生隨之去。入華堂，室宇器物不凡。以一珠袍與之，曰：「可以自給。」裂取生衣裾⑤，留之而去。\n\
    \                                      干寶《搜神記．談生妻鬼》\n【注釋】\n1.盜：偷偷的 2.垂：將要 3.辭謝：道歉\
    \ 4.遺：音ㄨㄟˋ，送 5.裾：音ㄐㄩ，衣服後襟"
  lesson_raw:
    title: 談生妻鬼
    basis: 短文為干寶《搜神記．談生妻鬼》
