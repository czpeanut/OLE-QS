  - label: D
    content: 桃紅康乃馨
  group_stem: '(甲)日記一篇

    將近年來，一有空我就利用時間記住各種花代表的意義及其花語，但大多數時候都派不上用場。同樣的花語我一用再用：一束金盞花表示悲傷，一籃薊草表示厭世，一撮羅勒表示仇恨。大多數時候我想表達的就是這些，只有少數例外，比方知道法官宣判我再也不能回到我最喜歡的葡萄園居住時，我給了法官滿滿一口袋的________________。

