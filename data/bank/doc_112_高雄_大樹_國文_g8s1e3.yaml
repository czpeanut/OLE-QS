- id: doc_112_高雄_大樹_國文_g8s1e3_s5_5
  section: 5
  number: 5
  type: single
  page: 4
  stem: 關於臺灣藍鵲，下列敘述何者正確？
  options:
  - label: A
    content: 臺灣藍鵲體型並不大，但羽尾卻占全長的三分之二
  - label: B
    content: 臺灣藍鵲分工明確，雌鳥哺育幼鳥，雄鳥外出覓食
  - label: C
    content: 臺灣藍鵲不怕人類，威脅出現時，甚至會主動攻擊
  - label: D
    content: 臺灣藍鵲會私自貯藏各類食物，不與其他藍鵲分食。
  group_stem: '臺灣藍鵲小檔案

    【甲】臺灣藍鵲與烏鴉是同一科的鳥類，羽色分配卻簡單而華麗，嘴喙寬厚、呈鮮紅色，雙腳也是鮮紅色，尾羽占全長三分之二，頭部、胸部都是黑色。身體上半部的背部、腰部、尾上及雙翼皆覆羽鮮藍色，較短的尾羽為黑色、末端白色。雌鳥與雄鳥的羽色一致，不易區分。

    【乙】臺灣藍鵲的活動範圍局限在低海拔山區，因其具有不怕人的特性，常可見牠們在山區的人家或小型村落，以及經人工開墾的竹林、果園、農地等地區活動。常在闊葉林區或次生林地帶棲息，由於體型大，在飛行時僅作短距離移動，常見一隻接一隻滑行過山谷，並發出金屬般「ㄎ一ㄤ、ㄎ一ㄤ」的鳴叫聲。

    【丙】臺灣藍鵲的食性廣泛，能攫獲蛇、蜥蜴、鳥等較大型的食物，亦會啄食毛毛蟲及各種昆蟲，植物的果實和廚餘剩飯也都是牠們取食的對象，木瓜最為喜愛。臺灣藍鵲也會將吃剩的食物貯藏在樹上的枝椏間，或者地面泥土中和木板下，等待一段時間後才把剩餘的食物吃掉。

    【丁】藍鵲間有相互乞食和理毛的行為。牠們也會共同合作抵禦掠食者的威脅，對於生殖期間闖入築巢區的人類，也會毫無忌憚地發動攻擊，直到威脅消失為止。孵卵、育雛時可能有幫手制度。

    【戊】多築巢於大樹的樹梢，以樹枝、細籐和雜草築成碗形的巢，每巢通常有4-6 個橄欖綠帶有濃褐色斑點的蛋，孵卵及育雛通常由親鳥及同群的其他成員共同參與，形成一種育幼幫手制度。較常見的例證是一對親鳥在前一季養育的子女，長大後繼續留在巢邊協助父母養育弟妹，使親鳥在育雛時更加順利。

    （資料來源：臺灣藍鵲小檔案 http://www.wxp.ks.edu.tw/nature/theme2/bird/3bird-special3.htm）'
