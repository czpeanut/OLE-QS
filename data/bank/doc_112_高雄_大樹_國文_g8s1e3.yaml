    content: ''
    asset:
      key: optC
      file: doc_112_高雄_大樹_國文_g8s1e3/6_8_optC.png
  - label: D
    content: ''
    asset:
      key: optD
      file: doc_112_高雄_大樹_國文_g8s1e3/6_8_optD.png
  group_stem: '鼎，是中國古代的一種煮食器，材質以青銅或陶為主。早在新石器時代，中國先民就開始使用陶鼎，到金石並用時代，青銅鼎開始出現，經過夏商兩代的發展，青銅鼎的使用在周代達到鼎盛。青銅鼎是中國青銅器重要的器形之一，除了作為食器，也有鼎是被用作承放食物或佐料的盛器、祭祀神明和祖先的禮器、陪葬的明器，甚至還有的被用作刑具。周代之後，隨著鐵器和灶台的普及，鼎逐漸被其他器形所取代。宋朝以後，隨著金石學的興起，又有一些鼎作為裝飾品出現，除仿古的銅鼎，還有一些是金銀器、玉器或者瓷器。

    作為西周禮樂制度的一部分，列鼎制度規定只有周天子才能使用九個鼎，諸侯用七鼎，卿大夫用五鼎，元士用三鼎，鼎成為等級和權力的象徵。相傳為夏代鑄造的九鼎也成為周天子王權的象徵。雖然有些鼎僅有十幾厘米高，幾千克重，但作為禮器的銅鼎卻往往非常巨大，已發現最大的后母戊鼎高133
    厘米，重達832.84 公斤。

    鼎由足、腹、耳等部分組成。一般圓鼎為三足，方鼎為四足，但也存在四足的圓鼎。鼎一般有兩耳，根據耳的位置立於腹壁上方，還是附於腹壁側面，又可分為立耳和附耳。部分鼎還帶有鼎蓋，鼎蓋上一般帶有蓋鈕。鼎腹部一般帶有精美的紋飾，足部、耳部和鼎蓋也有飾有紋飾的。鼎上常見紋飾有獸面紋、乳釘紋、雲雷紋等。

    (改寫自維基百科〈鼎〉條)'
