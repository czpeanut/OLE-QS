- id: doc_112_高雄_大樹_國文_g8s1e3_s5_3
  section: 5
  number: 3
  type: single
  page: 4
  stem: '俊賢在閱讀完上文之後，整理出一個表格。請問表格中哪一選項整理錯誤，需要再做修改？


    | | 印度 | 埃及 |

    | :--- | :--- | :--- |

    | (Ａ)蓮花的種類 | 主要有7 種 | 主要有3 種 |

    | (Ｂ)蓮花的地位 | 崇高 | 崇高 |

    | (Ｃ)蓮花與宗教的關係 | 緊密結合 | 息息相關 |

    | (Ｄ)蓮花的象徵意義 | 復活之神 | 美好的一切皆是 |'
  options:
  - label: A
    content: 蓮花的種類：印度 主要有7 種，埃及 主要有3 種
  - label: B
    content: 蓮花的地位：印度 崇高，埃及 崇高
  - label: C
    content: 蓮花與宗教的關係：印度 緊密結合，埃及 息息相關
  - label: D
    content: 蓮花的象徵意義：印度 復活之神，埃及 美好的一切皆是
  group_stem: "蓮也稱荷，所以蓮花也稱荷花，蓮花果實叫蓮蓬、蓮子。蓮子有驚人的生命力，日本 千葉縣發掘出的千年的古蓮子，經過培植，竟然開花結實。\n\
    \  你知道嗎？印度的國花正是蓮花。印度蓮花主要有七種，故有「七寶蓮花」之稱。印度人民把蓮花當作是力量、吉祥、平安、光明的象徵，還把蓮花比喻英雄和神佛。總之，一切美好的理想皆以蓮花表示，甚至是畫佛像、塑佛身，都以蓮花為臺座。所以，寺廟裡許多佛像都坐立在蓮花上面。蓮花被如此尊重和神化，是花中少有的。\n\
    \  另外，古埃及人對蓮花也是非常敬愛，認為是神聖不可侵犯的神靈之花；他們更認為蓮花是「復活之神」，可以使人起死回生，所以喜歡在木乃伊裡放進蓮花。在古埃及的社交中，蓮花成為朋友、愛人之間互相饋贈的典雅飾物。埃及民間崇尚蓮飾，到處都飾有蓮花圖案和雕刻。可見，蓮花和埃及的傳統風俗、宗教文化也是息息相關的。\n\
    \    埃及的蓮花有白、藍、紅之分。白蓮花是埃及最古老的植物之一；古埃及第十九王朝拉美西斯的屍體上，就曾發現過一整束的白蓮花。藍蓮花在古埃及時代已遍布全國各地。紅蓮花是從印度經波斯傳入埃及的，在古埃及享有特殊的神聖地位，禁止人民食用其果實。\n\
    （資料來源：以蓮花做為國花 https://tinyurl.com/y8hueusy）"
