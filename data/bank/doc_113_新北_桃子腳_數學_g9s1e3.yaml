- id: doc_113_新北_桃子腳_數學_g9s1e3_s2_11
  section: 2
  number: 11
  type: single
  page: 1
  stem: 請問______⑪______需填入哪個選項？
  options:
  - label: A
    content: $\overline{EG}=\overline{GF}$
  - label: B
    content: $\overline{GA}=\overline{GC}$
  - label: C
    content: $\overline{AE}=\overline{CF}$
  - label: D
    content: $\angle GAE=\angle GCF$
  group_stem: '請依題意選出最適當的答案，完成下列的推理證明：

    甲、已知：如右圖，四邊形 ABCD 為平行四邊形，G 為$\overline{BD}$與$\overline{AC}$的交點，且 E、F 為$\overline{BD}$上的兩點，若$\overline{AE}$、$\overline{CF}$皆垂直於$\overline{BD}$。

    求證：四邊形 AECF 為平行四邊形。

    證明：

    (1)∵四邊形 ABCD 為平行四邊形，∴$\overline{GA}=\overline{GC}$。

    (2)在$\triangle AGE$與$\triangle CGF$中，

    ∵$\angle AGE=\angle CGF$（對頂角相等），

    $\angle AEG=\angle CFG=90^{\circ}$，

    ______⑪______，

    ∴$\triangle AGE\cong\triangle CGF$（______⑫______全等性質），故$\overline{GE}=\overline{GF}$。

    由(1)、(2)可知，$\overline{GA}=\overline{GC}$且$\overline{GE}=\overline{GF}$，

    故四邊形 AECF 為平行四邊形（______⑬______）。'
  shared_asset: g2_11_13
