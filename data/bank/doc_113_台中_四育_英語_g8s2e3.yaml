- id: doc_113_台中_四育_英語_g8s2e3_s5_48
  section: 5
  number: 48
  type: single
  page: 3
  stem: Who will find this infographic helpful?
  options:
  - label: A
    content: Billy. He wants to know how to take care of his stomach.
  - label: B
    content: Sherry. She wants to know why she often has a stomachache.
  - label: C
    content: Allen. He wants to know what is wrong with his stomach.
  - label: D
    content: Amanda. She wants to know how much food the stomach can hold.
  group_stem: 'Our stomach is one of the body parts that digest food. Shaped like
    the letter J, it is about 28 cm long and 6 cm wide. Interestingly, its size can
    change. During a meal, it becomes much bigger. However, after 3 to 6 hours, it
    returns to its normal size.

    We often think that thin people have a smaller stomach than heavy people. In fact,
    the stomach is almost the same size in everyone.


    Why people sometimes feel hungry sooner?

    If people eat food high in sugar, the food will be digested very quickly, and
    they will feel hungry sooner. However, food high in protein or fat is digested
    much more slowly. In this way, people can stay full longer.


    How the stomach digests food?

    Food lands in the stomach after passing down the throat and through the food pipe.
    Then the stomach holds the food in it, and the juice in it begins to break down
    the food into smaller pieces. After that, the smaller pieces are passed on to
    the intestines.


    Tips for keeping the stomach healthy

    ◆ Eat small meals.

    ◆ Take the time to eat slowly.

    ◆ After the meal, take a walk.

    ◆ Say no to bedtime snacks.

    ◆ Eat more fruit and vegetables.

    Best food for the stomach: carrot, apple, broccoli, pumpkin

    ◆ Drink a lot of water.

    ◆ Stop smoking.


    * digest 消化

    * return 恢復到

    * normal 正常的

    * protein 蛋白質

    * intestine 腸

    * infographic 資訊圖表'
  shared_asset: g5_48_50
