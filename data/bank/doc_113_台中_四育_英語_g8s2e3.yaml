- id: doc_113_台中_四育_英語_g8s2e3_s5_46
  section: 5
  number: 46
  type: single
  page: 4
  stem: What can we learn about vitamin C from the reading?
  options:
  - label: A
    content: Only fruit has vitamin C.
  - label: B
    content: Our body can take no more than 200 mg a day.
  - label: C
    content: It's better to take vitamin C right after you get up.
  - label: D
    content: Take vitamin C every day, and we won't have heart problems at all.
  group_stem: 'You Can''t Live Without Vitamin C


    How much vitamin C can we take a day?

    About 60 mg is enough.

    Taking more than 200 mg a day can lead to side effects, like stomach upset.


    What should we know about vitamin C?

    1. Don''t take it before meals.

    2. Have enough water.


    Why do we need vitamin C?

    * Keep the cold away.

    * Make skin whiter.

    * Keep tooth and lip problems away.

    * Heart problems won''t happen easily.

    * Help our body take more nutrients.


    Food with vitamin C (every 100 mg)

    * Guava 137 mg

    * Orange 74 mg

    * Strawberry 69 mg

    * Papaya 58 mg

    * Lemon 34 mg

    * Red pepper 137 mg

    * Broccoli 75 mg


    * vitamin 維他命

    * side effect 副作用

    * nutrient 營養

    * skin 皮膚

    * pepper 甜椒'
