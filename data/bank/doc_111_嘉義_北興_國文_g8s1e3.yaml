- id: doc_111_嘉義_北興_國文_g8s1e3_s3_1
  section: 3
  number: 1
  type: single
  page: 1
  stem: 為表示恭敬、尊重，不直接稱呼對方的用詞，稱為敬稱詞；為表示謙遜的自稱之詞，則稱為謙稱詞。下列「 」中的詞語，何者使用正確？
  options:
  - label: A
    content: 我們這幾個大學同學裡，只有「陛下」的成就最好──不到三十歲，就已是一家大公司的老闆了。
  - label: B
    content: 「在下」資質愚魯，還請先生不吝賜教。
  - label: C
    content: 難得巧遇你這許久不見的老同學，今晚就請到「貴舍」一聚，讓我們把酒言歡話當年吧！
  - label: D
    content: 商鞅對秦孝公說：「太子『閣下』犯法，應該與庶民同罪，接受國法的審判。」
  tags:
    textbook: 八上 語文常識(二) 語法(下)句子
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
      code: 語文常識(二)
      title: 語法(下)句子
      chapter: null
- id: doc_111_嘉義_北興_國文_g8s1e3_s3_2
  section: 3
  number: 2
  type: single
  page: 1
  stem: 有一些詞語於不同的地方使用，往往會有不同的意義，形成同詞異義的情形。下列「 」中的詞語，何組意思相同？
  options:
  - label: A
    content: 「出入」公共場所，要注意安全／他的話和事實「出入」甚多
  - label: B
    content: 小花唱片大賣，真是「風光」／奧萬大的「風光」明媚，引人入勝。
  - label: C
    content: 民安所錯其「手足」／小豬和小馬情同「手足」
  - label: D
    content: 男友的劈腿讓她「方寸」大亂／如何取捨，全在於你「方寸」之間。
  tags:
    textbook: 八上 語文常識(二) 語法(下)句子
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
      code: 語文常識(二)
      title: 語法(下)句子
      chapter: null
- id: doc_111_嘉義_北興_國文_g8s1e3_s3_3
  section: 3
  number: 3
  type: single
  page: 1
  stem: 司馬遷善用對話刻畫人物形象。如「縣人來，聞蹕，匿橋下。久之，以為行已過，即出，見乘輿車騎即走耳。」即以縣人的自白，敘述事件始末，呈現人物形象。下列關於這段對話的解析，何者錯誤？
  options:
  - label: A
    content: 以迫促、簡短的語氣，呈現縣人誠惶誠恐、緊張害怕的表情
  - label: B
    content: 使縣人其情可憫的形象，躍然紙上
  - label: C
    content: 「見乘輿車騎即走耳」最能顯出縣人的犯意，乃是看到皇帝車駕，便跑上前去
  - label: D
    content: 司馬遷掌握了「氣急則辭促」的原則，烘托出縣人的心理狀態。
  lesson_raw:
    title: 張釋之執法
    basis: 引用課文《張釋之執法》原句
  tags:
    textbook: 八上 第七課 張釋之執法
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
      code: 第七課
      title: 張釋之執法
      chapter: null
- id: doc_111_嘉義_北興_國文_g8s1e3_s3_4
  section: 3
  number: 4
  type: single
  page: 1
  stem: 下列選項「 」中的字，何者詞性前後不同？
  options:
  - label: A
    content: 廷尉奏「當」／而廷尉乃「當」之罰金
  - label: B
    content: 「是」法不信於民也／大丈夫當如「是」也
  - label: C
    content: 今既「下」廷尉／煙花三月「下」揚州
  - label: D
    content: 而廷尉乃當「之」罰金／屬「之」廷尉。
  lesson_raw:
    title: 張釋之執法
    basis: 引用課文《張釋之執法》文句
