- id: doc_111_嘉義_北興_國文_g8s1e3_s3_5
  section: 3
  number: 5
  type: single
  page: 1
  stem: 「廷尉，天下之平也，一傾而天下用法皆為輕重。」這段話意近於下列哪個道理？
  options:
  - label: A
    content: 近朱者赤，近墨者黑
  - label: B
    content: 水可以載舟，亦可以覆舟
  - label: C
    content: 上梁不正下梁歪
  - label: D
    content: 道高一尺，魔高一丈。
  lesson_raw:
