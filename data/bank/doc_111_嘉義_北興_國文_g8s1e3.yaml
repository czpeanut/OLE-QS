  group_stem: "丙. 馬上、枕上、廁上 歐陽脩\n 錢思公雖生長富貴，而少所嗜好。在西洛時，嘗語僚屬言：「平生惟好讀書。坐則讀經史，臥則讀小說，上廁則閱小辭，蓋未嘗頃刻釋卷也。」\n\
    \ 謝希深亦言：「宋公垂同在史院，每走廁，必挾書以往，諷誦之聲琅然，聞於遠近，其篤學如此。」\n 余因謂希深曰：「余平生所作文章，多在三上，乃馬上、枕上、廁上也。」蓋惟此尤可以屬思爾。"
