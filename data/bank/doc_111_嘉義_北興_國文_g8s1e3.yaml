- id: doc_111_嘉義_北興_國文_g8s1e3_s3_6
  section: 3
  number: 6
  type: single
  page: 1
  stem: 「臺灣大學為紀念前校長傅斯年的貢獻，特地在校內鑄造一座傅鐘，於每節上下課均會敲二十一響來提醒師生時間。然而，為何是二十一響呢？這是源於傅校長的名言：『一天只有二十一小時，剩下三個小時是用來沉思的。』每當悠揚的鐘聲迴盪在校園內，似乎在提醒著師生要牢記校長的教誨。」請問傅校長所說的話，其用意為何？
  options:
  - label: A
    content: 期許學生要在不疑處有疑，才能突破思考框架
  - label: B
    content: 期望學生要恪守應有分際，待人處世不可自滿
  - label: C
    content: 鼓勵學生要勇於提出己見，進而創造獨特的價值
  - label: D
    content: 勉勵學生不僅善用時間，也須要保有思考的時間。
  tags:
    textbook: 八上 自學課三 安藤忠雄：孤獨，也要讓夢想開花
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
      code: 自學課三
      title: 安藤忠雄：孤獨，也要讓夢想開花
      chapter: null
- id: doc_111_嘉義_北興_國文_g8s1e3_s3_7
  section: 3
  number: 7
  type: single
  page: 1
  stem: 「是那樣萬般無奈的凝視 ／ 渡口旁找不到一朵可以相送的花 ／ 就把祝福別在襟上吧／ 而明日 ／ 明日又隔天涯。」這首詩所表達的情感與下列何者最相近？
  options:
  - label: A
    content: 明日隔山岳，世事兩茫茫
  - label: B
    content: 情人怨遙夜，竟夕起相思
  - label: C
    content: 青青河畔草，綿綿思遠道
  - label: D
    content: 此物何足貢，但感別經時。
  tags:
    textbook: 八上 第九課 一棵開花的樹
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
      code: 第九課
      title: 一棵開花的樹
      chapter: null
- id: doc_111_嘉義_北興_國文_g8s1e3_s3_8
  section: 3
  number: 8
  type: single
  page: 1
  stem: 有一種蟬白天出生到晚上就死了，牠應該最能體會    的真諦；相對於人生百年，在超脫三界外的神仙世界中，用他們那無盡無量的壽命來看人生，必覺得人的生命也像那朝蟬般一樣短促。什麼富貴功名，什麼家庭幸福，都只是鏡花水月而已，所以古今中外才有這麼多有智慧有根基的人，要把紅塵拋，入山尋仙訪道去。」根據上文，    處應填入何者最恰當？
  options:
  - label: A
    content: 樹倒猢猻散
  - label: B
    content: 天生我材必有用
  - label: C
    content: 死有輕於鴻毛
  - label: D
    content: 一日難再晨。
  tags:
    textbook: 八上 第四課 愛蓮說
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
