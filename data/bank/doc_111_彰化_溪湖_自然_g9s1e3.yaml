  options:
  - label: A
    content: 不合理，因為電流從電池正極流出，且乙較靠近電池正極，所以$I_{乙}＞I_{甲}$才合理
  - label: B
    content: 不合理，因為乙測得的電流值應為流過丙與丁的電流值相加，所以$I_{乙}＞I_{甲}$才合理。
  - label: C
