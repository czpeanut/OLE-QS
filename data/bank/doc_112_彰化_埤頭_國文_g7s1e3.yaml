- id: doc_112_彰化_埤頭_國文_g7s1e3_s4_49
  section: 4
  number: 49
  type: single
  page: 2
  stem: 根據本文，作者對「孤獨」的看法是什麼？
  options:
  - label: A
    content: 與人分享事物，就不再孤獨
  - label: B
    content: 與世俗性格格不入的人才會孤獨
  - label: C
    content: 孤獨可以使人反觀自照
  - label: D
    content: 好似被世界遺棄了
  group_stem: '（四）

    我們都同意：好的東西，要與好朋友分享；因此，咖啡可以分享，音樂也可以分享。但是，唯有孤獨是不能與人分享的。若要欣賞孤獨的好處，首先必須知道它與寂寞不同。「寂寞是一種冷清清的感覺，好像自己被別人遺棄了、被世界遺棄了、被自己遺棄了、被生命遺棄了。這種被遺棄的感覺往往出於主觀的幻想。自己把門窗關起來，然後抱怨沒有陽光。」孤獨則不同，它使人暫時擺脫種種俗世的念慮，親親切切的面對自己，讓心中的旋律恣意奏鳴，然後譜出寧靜悠遠的雅趣。更重要的是：孤獨往往牽引出沉思的心境，由沉思可能帶來澈悟，煥發內在的光明，獨照人生的真義。唯有善於享受孤獨的人，才能分辨也才會珍惜人與人之間交會時互放的光亮。

    （傅佩榮 孤獨）'
