- id: doc_112_彰化_埤頭_國文_g7s1e3_s4_47
  section: 4
  number: 47
  type: single
  page: 2
  stem: 根據文章內容，下列敘述何者正確？
  options:
  - label: A
    content: 減少攝取氫化油類能防止反式脂肪
  - label: B
    content: 早餐少吃，午餐適度，晚餐、消夜宜少吃
  - label: C
    content: 蔬菜、水果應生食蛋白質及澱粉類則熟食，以符合一比一原則
  - label: D
    content: 動人絕對不可攝取含有添加物及經過加工程序的食品
  group_stem: '（三）

    1.食物四分法：蔬菜25％、水果25％、蛋白質25％、澱粉類25％，生熟比例最好為一比一。

    2.多吃好油、少壞油：拒絕反式脂肪，如氫化棕櫚油、氫化椰子油、植物乳化油、植物酥油、起酥油等，以防在體內形成壞的膽固醇，或增加血管中風風險。

    3.多原味、少調味：減少攝取有添加物的食品、拒絕加工程序多者、減少不必要的容器與包材，以免攝取不到食物原有的維生素及纖維質。

    4.每餐只吃七分飽：早餐要足量、午餐要適量、細嚼慢嚥才是王道。晚上8點以後不宜再進食，可改善肥胖與慢性病。

    （吃出健康的原則 今周刊844期）'
