    content: 擅長酌油
  - label: B
    content: 擅長射箭
  - label: C
    content: 擅長應對
  - label: D
    content: 擅長買油
  group_stem: '（二）

    陳康肅公善射，當世無雙，公亦以此自矜。

    嘗射於家圃，有賣油翁釋擔而立，睨之，久而不去。見其發矢十中八九，但微頷之。

    康肅問曰：「汝亦知射乎？吾射不亦精乎？」翁曰：「無他，但手熟爾。」康肅忿然曰：「爾安敢輕吾射！」翁曰：「以我酌油知之。」乃取一葫蘆置於地，以錢覆其口，徐以杓酌油瀝之，自錢孔入，而錢不濕。因曰：「我亦無他，惟手熟爾。」康肅笑而遣之。

    （歐陽脩 賣油翁）'
