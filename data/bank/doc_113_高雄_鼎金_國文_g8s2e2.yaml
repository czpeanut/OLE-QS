  group_stem: "(一)\n    「雅舍」最宜月夜——地勢較高，得月較先。看山頭吐月，紅盤乍湧，一霎間，清光四射，天空皎潔，四野無聲，微聞犬吠，坐客無不悄然！舍前有兩株梨樹，等到月升中天，清光從樹間篩灑而下，地上陰影斑斕，此時尤為幽絕。直到興闌人散，歸房就寢，月光仍然逼進窗來，助我凄涼。細雨濛濛之際，「雅舍」亦復有趣。推窗展望，儼然米氏章法，若雲若霧，一片瀰漫。但若大雨滂沱，我就又惶悚不安了，屋頂溼印到處都有，起初如碗大，俄而擴大如盆，繼則滴水乃不絕，終乃屋頂灰泥突然崩裂，如奇葩初綻，砉然一聲而泥水下注，此刻滿室狼藉，搶救無及。此種經驗，已數見不鮮。「雅舍」之陳設，只當得簡樸二字，但灑掃拂拭，不使有纖塵。我非顯要，故名公巨卿之照片不得入我室；我非牙醫，故無博士文憑張掛壁間；我不業理髮，故絲織西湖十景以及電影明星之照片亦均不能張我四壁。我有一几一椅一榻，酣睡寫讀，均已有著，我亦不復他求。\n\
    （梁實秋 雅舍）"
