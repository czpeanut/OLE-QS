  group_stem: "(三)\n    廣闊大海裡，一隻鯨魚用沒有同伴聽得見的聲音歌唱著，這景象是如此寂寞，令人們不禁對牠生出憐憫與同理之心。很快的，這隻名為「52\
    \ 赫茲」的鯨魚，便以「世界上最孤獨的鯨魚」聞名於世。\n    「52 赫茲」鯨魚的故事起源於1989 年，美國海軍當時建立了「水下聲音監測系統」(SOSUS)，也就是以陳列式的水下麥克風來偵測敵軍潛艦的一套設備。結果在某天卻收到奇怪的訊號，聽起來像是藍鯨的歌聲，但卻發現這個聲音的頻率為52\
    \ 赫茲，這與一般藍鯨的鳴唱的10 赫茲至40 赫茲有明顯的不同，它的頻率太高了些。\n    最早發現這段錄音不同的人，是一名海洋哺乳類學家瓦特金斯（Bill\
    \ Alfred Watkins），從此之後，他開始追尋這隻傳說中以52 赫茲鳴唱的鯨魚。瓦特金斯在2004 年辭世前幾個月，他與團隊發表對「52 赫茲」鯨魚的研究成果，其成果主要指出聲音綿延的範圍很小，軌跡主要都由西向東，由北向南。\n\
    \    「即便仔細年復一年的監聽，有這樣特色的聲音卻只有一個，而且每季只有一個來源。」瓦特金斯等人的研究如此寫道。這項發現集結了許多引人入勝的元素，許多科學家也開始全心投入尋找這條神秘的鯨魚。\n\
    \    直到2013 年，英國的小報《快報》聲稱這隻鯨魚「一輩子孤單寂寞，注定找不到愛情。」將「52 赫茲」鯨魚的故事渲染成一個極具感染力的報導，牠的故事開始被反覆傳頌，感動了全世界，亦啟發了許多歌曲、圖畫與電影創作，「52\
    \ 赫茲」一躍成為世界上最有名的鯨魚，成了動物界最神秘的明星之一。\n (改寫自52 赫茲的鯨魚們)"
