- id: doc_113_高雄_鼎金_國文_g8s2e2_s5_35
  section: 5
  number: 35
  type: single
  page: 6
  stem: 根據【甲】文，關於雞粥的製作過程，下列說明何者正確？
  options:
  - label: A
    content: 先把肥母雞斬成肉塊，再刨肉，去除油膩
  - label: B
    content: 熬湯時一併加入細米粉、火腿屑、松子肉
  - label: C
    content: 蔥、薑需要在熬煮前先爆香，才能使粥散發香氣
  - label: D
    content: 是否去除粥上浮渣，由處理食材的用刀方式而定。
  group_stem: "(五)\n【甲】：\n《隨園食單》 卷二  羽族① 單\n——袁枚\n【雞粥】\n    肥母雞一隻，用刀將兩脯肉② 去皮細刮，或用刨刀亦可。只可刮刨，不可斬，斬之便不膩③\
    \ 矣。再用餘雞熬湯下④ 之，吃時加細米粉、火腿屑、松子肉，共敲碎放湯內。起鍋時，放蔥、薑，澆雞油，或去渣，或存渣俱可。宜於老人。大概斬碎者去渣，刮刨者不去渣。\n\
    \n【注釋】：\n① 羽族：泛稱鳥類，此處指家禽。\n② 脯肉：ㄆㄨˊ，胸部的肉，指雞胸肉。\n③ 膩：食物中油脂多。\n④ 下：放入、投入。\n\n【乙】：\n\
    跟著《隨園食單》學做菜\n粥品愛好者必學菜：雞粥\n1.將雞洗淨後去皮，先取出雞胸肉，其餘部分備用。\n2.用鐵湯匙由肉厚部位開始向薄的部位刮，將雞胸肉刮成細肉絲。\n\
    3.細肉絲加入胡椒粉、醬油醃片刻。\n4.用剩餘的雞肉加十二碗水，放入薑片及蔥段來熬湯。湯熬好後瀝出雞骨。\n5.米沖洗後瀝乾水，用皮蛋、鹽及油醃一小時。\n\
    TIPS 如熬湯後可將湯連雞肉放過夜，隔天再烹煮，味道會更濃更甜。\n6.醃好的米放入雞湯中，粥滾後揭蓋繼續大火煮至米粒變綿。熄火前加入雞肉絲，雞肉絲熟後加鹽調味，食用時可加火腿丁、碎花生及蔥。\n\
    製作心得\n1.此雞粥沒骨沒皮，適合老人及幼兒食用。\n2.食單中說可澆些雞油，但味道已夠，若不想太油膩，不加亦可。食單亦建議放松子末、炸米粉碎、金華火腿屑等，可依自己喜好調整配料。"
