  group_stem: "(四)\n  藝人大S 徐熙媛春節期間赴日本旅遊因流感併發肺炎過世，震驚各界。前臺大醫院感染科醫師、知名旅遊部落客林氏璧表示，流行性感冒病毒絕對不能輕忽，不僅傳染力高，能造成大流行，且可能發生併發症，造成肺炎、腦炎、心肌炎等重症。相較之下，普通的感冒病毒幾乎不會有併發症。他解釋，流感病毒併發的肺炎有兩種，一種是病毒直接侵犯造成的病毒性肺炎，病程較快且通常來勢洶洶，致死率較高，偶爾會發生在年輕族群。第二種是續發性的細菌性肺炎，流感破壞身體防衛機制後細菌趁機入侵，傳統抗生素可以有效治療。總體而言流感致死率約千分之一。\n\
