  stem: 「西班牙人常航行基隆和淡水之間，因在經過野柳岬角處常會觸礁擱淺，並遭當地原住民趁火打劫，所以在地圖上標示 Punto Diablos。西班牙文的 Punto
    就是岬角，Diablo 即英文的 Devil，就是魔鬼的意思，可見那時西班牙人把野柳視為可怕的魔鬼岬角。西班牙文 Diablo，可以確定就是臺語野柳（音 iá
