    content: 輻射造成體細胞基因突變時，對人體健康通常不會有影響。
  group_stem: '◎請閱讀下列敘述後，回答48～50 題：


    位於烏克蘭北部的車諾比核電廠於1986 年發生爆炸，約2600 平方公里範圍被劃定為輻射禁區，至今無人居住，這場事故也被認為是人類史上最嚴重的核災。然而，近期科學家發現，核災區內的兩個狗群發生基因突變，對輻射、重金屬及污染展現出免疫能力。

    綜合外媒報導，哥倫比亞⼤學環境衛生科學家克萊曼（Norman J. Kleiman）領導的研究團隊發現，車諾比核災區的流浪狗因⻑期暴露於輻射及有毒物質，其基因出現顯著變化。

    研究顯⽰，生活在核電廠周圍的狗群可分為兩個基因群體，雖然遺傳結構有所差異，但皆展現出強⼤的環境適應能力。科學家推測，這些狗群可能是當年居⺠撤離時遺留的寵物及其後代。牠們的基因變異說明，這些動物已經適應了⻑期暴露於劇毒環境中，也解釋了牠們為何能在禁區內繼續生存和繁衍。

    克萊曼教授表⽰，研究這些狗群的遺傳與健康變化，不僅有助於深入理解極端環境如何影響生物，還可能為人類提供應對輻射及毒性暴露的解決方案。

    此外，車諾比核災區內不僅狗群基因發生突變，過去研究也發現當地樹蛙的皮膚顏色從綠色變為黑色以中和輻射，狼群則展現出對癌症的抵抗力。這些現象顯⽰，極端環境正在重塑動、植物的基因，為科學研究帶來新契機。'
