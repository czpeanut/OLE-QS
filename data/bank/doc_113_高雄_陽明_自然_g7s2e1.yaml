- id: doc_113_高雄_陽明_自然_g7s2e1_s1_46
  section: 1
  number: 46
  type: single
  page: 5
  stem: 下列關於綠蠵龜的敘述，何者正確？
  options:
  - label: A
    content: 綠蠵龜和兩生類都是體外受精，因此都棲息於水源處
  - label: B
    content: 綠蠵龜和鳥類的卵都具外殼，因此有利於在陸地孵化
  - label: C
    content: 綠蠵龜幼體存活率比哺乳類低，可能是產卵數較少
  - label: D
    content: 綠蠵龜上岸產卵後會回到海中，之後即可開放民眾自由地在沙灘上遊玩。
  group_stem: '◎請閱讀下列敘述後，回答46～47 題：


    海洋保育署去年113 年的5 月至9 月在南沙太平島進行生態調查，共記錄到141 隻⺟綠蠵⿔上岸產卵，累計221 個卵窩，主要分布在沙草交界、沙灘、沙林交界，遠高於台灣其他產卵地紀錄，以每窩平均70
    顆計算，估計12 個月產卵量達5 萬顆，依照目前約70%的孵化率，預計可孵出3 萬5000 隻幼⿔，數量為歷年最多。

    此次調查也記錄到台灣過去未⾒的最⼩體型產卵個體，背甲曲線⻑度僅84 公分，顯⽰該區可能有⼤量年輕⺟⿔⾸次加入產卵行列。另觀察到海⿔多次近岸交配行為，進⼀步證實太平島不只是產卵地，更是海⿔完整繁殖週期的重要場域。

    然而，海⿔族群存活率極低，平均每1000 隻幼⿔僅約1 至2 隻能存活至成年。由於成年⺟⿔會回到⾃⼰出生的海灘產卵，研究團隊推估，約20 年後，只剩36 隻成年⺟⿔返回太平島產卵。'
  shared_asset: g1_46_47
