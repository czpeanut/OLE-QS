- id: doc_113_高雄_楠梓_國文_g7s1e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 「臺灣欒樹的根系很深，具有穩定邊坡的功能；茂盛生長的葉子，也能減少雨滴對脆弱土壤的撞擊，是水土保持的好幫手。臺灣七至九月多颱風、下大雨，此時臺灣欒樹不開花、不結果，保持植株體內的養分，不做無效的工。待颱風期過後，才開花結果，一直持續到隔年二月。當我看到臺灣欒樹結果，就知道颱風期要過了。臺灣欒樹的果實留在樹上的時間很長，眾多的果實也成為鳥類終年可得的食物。」根據這段敘述，下列說明何者正確？
  options:
  - label: A
    content: 臺灣欒樹的茂密枝葉不僅能防風，還能有效減少土壤侵蝕
  - label: B
    content: 七至九月期間，臺灣欒樹選擇不開花以避免水分流失
  - label: C
    content: 當觀察到臺灣欒樹結果，便知颱風季節將結束，可視為「一葉知秋」的表現
  - label: D
    content: 臺灣欒樹果實雖多，但果期較短，鳥類無法長期依賴其為食物。
  tags:
