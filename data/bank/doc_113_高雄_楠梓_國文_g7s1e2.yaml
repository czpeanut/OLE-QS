- id: doc_113_高雄_楠梓_國文_g7s1e2_s2_28
  section: 2
  number: 28
  type: single
  page: 4
  stem: 下列何者最符合本文的主旨？
  options:
  - label: A
    content: 不要畫地自限，要自信的積極奮進
  - label: B
    content: 禁不起考驗的研究成果，常淪為無稽之談
  - label: C
    content: 累積失敗的經驗，才能通往成功的殿堂
  - label: D
    content: 適度的壓力，是激發潛能的關鍵。
  group_stem: "(二)\n  專家們曾針對一群因紐特人做研究。發現就生理條件來說，他們理當無法在酷寒的極地下生存。因紐特人並不知道這項研究成果，世世代代一直在漫天風雪的極地，日復一日愜意的生活著。\n\
    \  根據空氣力學理論，以大黃蜂的體型、大小、重量以及翅膀張開的幅度比例，牠們根本不可能飛得起來。但大黃蜂仍每天自由自在的在百花中飛舞穿梭，製造蜂蜜。\n\
    \  世界知名的長跑選手康寧漢，年幼時因火災而燒傷腿，醫生宣判他一生都不能夠再走路。但他不相信，屢次打破室外一英里賽的世界紀錄。\n  過往不愉快的失敗經驗，以及種種約定俗成的看法，經常影響我們對自己的信心與判斷。因此，許多時候，盼望的活動或設定的目標，會避免去嘗試；關係的疏離或挑戰的失敗，不再試圖彌補。一再的故步自封，只因為我們相信：根據常理或往昔的失敗經驗，鐵定是行不通的。但事實證明，事情可行或不可行，唯有試了才知道。當我們能夠主導自己的思想，控制自己的情緒，便能掌握自己的命運。改變想法，所需的僅僅是個決定。\n\
    \  有形的世界是心的映像。當我們把自我設限的習慣丟棄，時時擁抱正向的想法，輔以積極的行動，自然而然的，對生活的看法也將全然改觀。"
  tags:
    chapter:
      publisher: null
      book: 七上
      subject: 國文
      code: null
      title: null
      chapter: null
    textbook: 七上 第2次段考範圍
    labeled_by: ai
