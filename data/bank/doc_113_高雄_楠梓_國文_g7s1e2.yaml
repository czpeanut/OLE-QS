    labeled_by: ai
- id: doc_113_高雄_楠梓_國文_g7s1e2_s2_26
  section: 2
  number: 26
  type: single
  page: 4
  stem: 依據本文，下列何者並非作者認為可以增加「好吃滋味」的必要條件？
  options:
  - label: A
    content: 便宜的價格
  - label: B
    content: 愉悅的心情
  - label: C
    content: 歡樂的氣氛
  - label: D
    content: 美好的環境。
  group_stem: "(一)\n  那個「合格」的烤洋芋顯然燙得不得了，因為即使戴了手套，還是得很快地把它擱在工作檯。年輕的男孩拿起一把小刀，把烤洋芋的肚子剖開，輕輕挖著他的肚子，把洋芋肉攪碎，然後依從顧客的需要澆上作料，再裝進紙盒。輪到我的時候，我毫不猶豫地點了兩個熱騰騰的羅宋牛肉烤洋芋。我又走向國王學院，那兒有一排排供人休息的木椅，我挑了一張可晒著太陽，面對湛藍的天，碧綠的草地，舒舒服服地吃起我的午餐來。\n\
    \  有時候，好吃的感覺並不完全是來自食物本身，四周的環境、心情、氣氛，也都可以加強食物本身的滋味。我就是在這樣美好的環境下吃烤洋芋。也許是我吃東西的模樣看起來「太好吃」了，說了你也許不相信，竟有好幾個來往的行人停在我面前，用很饞的表情問：「你這烤洋芋是哪兒買的？」\n\
    —桂文亞 好吃的滋味"
  tags:
    chapter:
      publisher: 康軒
      book: 七上
      subject: 國文
      code: 第三課
      title: 吃冰的滋味
      chapter: null
    textbook: 七上 第三課 吃冰的滋味
    labeled_by: ai
