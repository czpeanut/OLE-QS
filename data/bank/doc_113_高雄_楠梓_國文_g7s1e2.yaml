  stem: 「布農族人的傳統生產方式以山田燒墾式的農業為主，主要農作物有小米、玉米、甘薯等。目前飲食習慣已轉變，多半以稻米、地瓜為主食；副食為野菜、蕈類，其中樹豆可以說是布農族人最重要的副食之一，亦是布農族人最常食用的湯。隨著時代的變遷，布農族的經濟開始轉型，農產品的種植和運銷逐漸取代了傳統的自給自足模式。如今，許多部落開始專注於種植經濟作物，如香茅、桃李、蕃茄等，隨著市場的需求變化，各地的作物生產也日益多樣化。」根據文意，下列何者最可能是本文的標題？
