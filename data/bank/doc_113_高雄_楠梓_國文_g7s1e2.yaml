- id: doc_113_高雄_楠梓_國文_g7s1e2_s2_31
  section: 2
  number: 31
  type: single
  page: 5
  stem: 依據上文，何者最接近「IKEA 效應」？
  options:
  - label: A
    content: 萬物靜觀皆自得
  - label: B
    content: 孩子總是自己的好
  - label: C
    content: 花若盛開，蝴蝶自來
  - label: D
    content: 醉翁之意不在酒。
  group_stem: "(三)\n  你曾在「IKEA」或其他地方買過需要自行組裝的家具嗎？組裝完成後，是否覺得自己很厲害，越看越滿意？這就是美國行為經濟學家Dan\
    \ Ariely 所說的「IKEA 效應」。\n  妥善運用「IKEA 效應」，能使參與者投入情感，享受過程，獲得成就感，增加凝聚力。例如：在社團成果發表會前，大家花時間布置場地；在親子活動中，讓小孩親手做蛋糕；在銷售遇到瓶頸時，請員工們動腦想辦法。付出的心血能為事物加值，令我們倍加珍惜親力親為的成果。\n\
    \  不過，「IKEA 效應」也可能導致「自我感覺良好」，誤以為別人也會肯定我們的心血結晶，因而失去檢視缺點的機會。企業經理人尤其不應有「非我所創症候群」（Not\
    \ Invented Here Syndrome）─外來的構想一概不用，獨鍾內部自行研發的方案。而對投注大量資源卻遲無進展的計畫，也不宜敝帚自珍，以免一條路走到黑。"
  tags:
