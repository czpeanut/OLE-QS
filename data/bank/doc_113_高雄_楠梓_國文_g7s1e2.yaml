- id: doc_113_高雄_楠梓_國文_g7s1e2_s1_25
  section: 1
  number: 25
  type: single
  page: 3
  stem: 「當年農村沒有供電，農家很少夜間活動，早早地便上床睡覺。只是夏天天熱，晚餐後家人還是會坐在晒榖場上乘涼，大人們閒話家常，小孩則數星星，看月亮，等溫度降下來了才回房睡覺。農村的夜晚，除了星光、月光，還有入秋出現的螢火蟲。在沒有光害的環境下，螢火蟲的光特別明亮，小孩常抓來一大群放在玻璃瓶裡，那瓶子便亮得可以當手電筒，拿著到處去尋寶，或玩捉迷藏的遊戲，苦中作樂一番，這也是田園生活中最令人難忘的娛樂。」下列何者最符合本文的主旨？
  options:
  - label: A
    content: 作者認為早年農村缺乏供電，對農村生活造成了諸多困擾
  - label: B
    content: 作者對於當年將螢火蟲作為娛樂的做法感到懊悔
  - label: C
    content: 農村夜晚的自然景觀與童年時的娛樂，讓作者至今難以忘懷
  - label: D
    content: 本文主要討論當今城市與農村生活的差異，喚起讀者對鄉村生活的懷舊之情。
