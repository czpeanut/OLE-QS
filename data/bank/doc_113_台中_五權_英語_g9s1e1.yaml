- id: doc_113_台中_五權_英語_g9s1e1_s2_39
  section: 2
  number: 39
  type: single
  page: 6
  stem: Which of the following can we both see in Sophia’s book and the letter she
    found?
  options:
  - label: A
    content: Both tell the sad stories of the writers’ families.
  - label: B
    content: Both show why the writers care about a stranger they once met.
  - label: C
    content: Both show how much the writers want to find somebody.
  - label: D
    content: Both tell people to forget about the past and move on.
  group_stem: 'In 1975, Sophia found a bottle on the beach. There was a letter in
    the bottle.


    May 2, 1974

    Dear Max,


    You didn’t show up that Friday when I waited at your school gate like before.
    You have been lost to me since.

    Everyone’s been telling me eighteen years is enough and that it’s time to let
    you go.


    But I know you are somewhere in this world. I just haven’t found out where you
    are. I’ll keep looking for you. I don’t care if it may take another eighteen years.
    I will never give up. I believe we’ll see each other again someday.


    Love,


    Dad


    After reading the letter, Sophia felt sad for the father and wanted to find him.
    With very few clues to start with, Sophia worked hard for years trying to find
    out the truth. However, she could not put the broken pieces together to get a
    clear picture. Six years later, Sophia decided to write about the whole story
    of looking for the father. Her book came out in 1978, and, to her surprise, it
    sold thousands of copies.

     gate 大門 clue 線索'
