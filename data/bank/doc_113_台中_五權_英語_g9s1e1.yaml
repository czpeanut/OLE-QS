- id: doc_113_台中_五權_英語_g9s1e1_s2_24
  section: 2
  number: 24
  type: single
  page: 2
  stem: What does the reading say about shaking?
  options:
  - label: A
    content: Shaking themselves dry may help animals run faster in dangerous moments.
  - label: B
    content: Shaking is a way that animals use to make other animals scared.
  - label: C
    content: Pet animals do the shaking better than wild ones.
  - label: D
    content: Different animals’ shaking begins with different body parts.
  group_stem: 'When we get wet, we need a towel to get ourselves dry. When a dog gets
    wet, all it needs is to shake its body. A study in 2010 showed that a wet dog
    can throw off half the water on its body by shaking for less than a second. In
    fact, this easy act of dogs works better than a washing machine.


    The study found that animal shaking begins with the head and ends with the tail
    (尾巴). During a shake, the animal’s head, body and skin all move. Smaller animals
    must shake faster than bigger animals to get water off. For example, in one second,
    a rat can shake 18 times, a dog 6 times, and a bear 4 times. Bigger animals can
    get their bodies dry with fewer shakes.

    For animals, shaking is not just about getting themselves dry. It is also about
    saving their lives. Being wet makes animals heavier, and that makes it harder
    to run. In the animal world, the faster an animal can run, the better chance it
    can live. Maybe that’s why the “wet-dog shake” has become a habit of many animals.

     skin 皮膚'
