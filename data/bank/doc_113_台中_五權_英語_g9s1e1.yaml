  stem: Who is this reading mainly (主要地) speaking to?
  options:
  - label: A
    content: Soldiers.
  - label: B
    content: Dentists.
  - label: C
    content: Parents.
  - label: D
    content: Children.
  group_stem: 'Halloween Candy Buy Back


    Halloween is fun. But maybe not for some parents. These parents have to take their
    kids to see you after they eat too much candy. And you may not want to see a house
    of kids crying and kicking, either. Here’s a way to help parents and save you
    from a day of headache – join Soldier Voice’s Halloween Candy Buy Back plan!


    What will you do?

    ＊ Invite kids to bring you their candy from trick-or-treat.

    ＊ Pay them US$1 for every kilogram of candy.

    ＊ Send the candy you collect to Soldier Voice by November 10.


    What will Soldier Voice do?

    ＊ Send the candy to soldiers. The soldiers are fighting in other countries for
    our country.


    What’s the good of doing it?

    ＊ You’ll have fewer crazy kids to take care of.

    ＊ Parents will know you care about their kids.

    ＊ Soldiers will know we still remember them.

    ＊ More people will know about your hospital in the country.


    More than 2,000 dentists all over the country have joined. Call now at 1234-5678'
