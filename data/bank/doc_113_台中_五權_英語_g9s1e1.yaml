  - label: D
    content: Mona did not call Easy-Snap.
  group_stem: 'Mona: Honey, can you go to the photo shop and print out two more sets
    of these photos for my parents?

    Chad: But it looks like rain now! Why don’t you just call Easy-Snap? It takes
    them only five minutes to get here from Gemmy Road.

    Mona: But that’ll be very expensive!!

    Chad: OK, OK. Then I’ll go to the photo shop next to the café. I heard it’s having
    a sale.

    Mona: You mean Nice-Shoot? Too late. Yesterday was the last day. There’s a new
