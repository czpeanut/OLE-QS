- id: doc_113_台中_五權_英語_g9s1e1_s2_31
  section: 2
  number: 31
  type: single
  page: 4
  stem: What do we know about the six people in the dialogue?
  options:
  - label: A
    content: They all talked about the roof garden before they built it.
  - label: B
    content: Some of them got money for building the roof garden.
  - label: C
    content: They all said good things about the roof garden.
  - label: D
    content: Some of them worked on the plan to build the roof garden.
  group_stem: 'Six people are talking about the garden on the roof of their building.


    Jasmine: I loved the idea when Jason first told me about it. We had lots of meetings
    with many people, trying to make them understand why it''s good to build a garden
    on the roof. Now people love coming here, and it''s helped many of us become friends!

    Jason: The thing wasn''t easy at first. But Jasmine helped a lot. And she was
    really good at making people happy to give money for the roof garden.

    David: My kids love going up there. They sit there watching butterflies and birds.
    The roof garden brings them closer to nature.

    Samuel: You want something green? Visit the park! It''s only one block away! After
    the workers built the roof garden, bugs started flying into my room! And the kids
    leave garbage on the stairs when they come down from the roof!

    Rosie: Our building is now cooler in the summer. My baby sleeps well even on hot
    summer days!

    Flora: Where are these tomatoes from? Not from the supermarket. They''re from
    our roof! Isn''t that wonderful?

     roof屋頂'
