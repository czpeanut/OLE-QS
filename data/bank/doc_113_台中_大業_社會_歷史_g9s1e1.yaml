  group_stem: 收藏於倫敦大英博物館的羅塞塔石碑是遊客一定不能錯過的「鎮館之碑」，這塊花崗閃長岩石碑上刻著埃及托勒密五世詔書的三種不同語言版本，使得近代考古學家有機會對照各語言版本的內容後，解讀出已經失傳千年的埃及文字的意義與結構，成為日後研究古埃及歷史的重要里程碑。羅塞塔石碑的碑文雖然是同一段內容卻刻著三種文字：古埃及文聖書體、埃及世俗體和古希臘文。聖書體是呈現給神明的文字，世俗體則是當時埃及平民使用的文字，希臘文則是由於當時外來者征服埃及，要求埃及人使用古希臘文，因此代表著統治者的語言。請回答第20-21
