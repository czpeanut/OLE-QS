  stem: 《戰國策．燕策二》：「今者臣來，過易水，蚌方出曝，而鷸啄其肉，蚌合而拑其喙。鷸曰：『今日不雨，明日不雨，即有死蚌。』蚌亦謂鷸曰：『今日不出，明日不出，即有死鷸。』兩者不肯相舍，漁者得而并禽之。」類似的事情也在古希臘城邦，在開啟了雅典的黃金時代後，希臘城邦卻陷入內戰。請問：當時誰扮演漁翁的角色統一希臘？
