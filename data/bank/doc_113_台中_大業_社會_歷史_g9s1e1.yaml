  group_stem: 他是一位數學家，曾求學於阿加德米學園，後應托勒密國王邀請到埃及的亞歷山卓城任教，他把數學知識蒐集起來，加以系統化，建立了一個數學體系。他的代表作品《幾何原本》集當時幾何學之大成，使後世對於幾何學的了解更進一步。十六世紀時，歐洲天主教耶穌會推動教會改革，積極向海外拓展傳教事業，並派遣傳教士隨著歐洲的探險隊和商人陸續東來。來到中國的這位傳教士，為了順利傳教，允許中國教徒祭祖祀孔，並將西方科學知識與技術介紹到中國，這位傳教士與中國人合譯《幾何原本》，引介三角學與對數表，點、線、面、直角、三角形、四邊形等常見詞彙也是由他們創造並沿用至今。請回答第22-24
