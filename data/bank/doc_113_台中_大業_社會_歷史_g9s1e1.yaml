  group_stem: 我是強而有力的王，是巴比倫的太陽……當太陽神命令我為這片土地上的人民創造正義，並建立井然有序的政府，這片土地上處處都有我所提出的真理與正義，這把人民帶向繁榮。……如果有貴族挖掉另一貴族的眼睛，他的眼睛也要被挖掉。如果有貴族打斷另一貴族的肢體，他的肢體也要被打斷。如果有貴族挖掉平民的眼睛或打斷其肢體，他必須賠償一明納銀子。如果有貴族挖掉奴隸的眼睛或打斷其肢體，他必須賠償半明納銀子。……以上是能幹、有才識的王所制定的法律，讓這個世界的人都可以享受安定的政局。我，是受領主神所賦予的這個偉大任務的人。……如此，再不會有強凌弱的事情發生，就連孤兒寡母也可以得到正義的對待。……請回答第29-32
