- id: doc_113_台中_大業_社會_歷史_g9s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 五百人會議是的最高行政機構，相當於政府，由新設的10 個地區的部落組成，從所有公民中各選50 人參加。這50 人是按照人口比例抽籤選出。抽籤在一所神廟中進行，那兒設有兩只箱子，一只箱子裡放著寫有候選人姓名的名單，另一只箱子放著白豆與黑豆。由官員從一只箱子裡取出名單，又從另一只箱子中拿出豆粒。如果是白豆，這個人就當選了；如果是黑豆，那就要再等下一次的機會了。正是因為如此，常能聽到「真是倒楣，又是黑豆」的抱怨聲。請問：上述內容是哪一文明的特色？
  options:
  - label: A
    content: 波斯
  - label: B
    content: 斯巴達
  - label: C
    content: 雅典
  - label: D
    content: 埃及
- id: doc_113_台中_大業_社會_歷史_g9s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 我國不斷向外擴張並取得戰爭的勝利，因此軍人的地位愈來愈高，我也是在這樣的潮流下崛起。但我記取前輩急切想要掌權卻遭到暗殺的教訓，一步步改變我們的政治體制，最終使元老院封我為「第一公民」獻上「奧古斯都」的尊號，成功成為國家的統治者。請問：上述內容所描述的是誰？
  options:
