  group_stem: 這個擅長航海經商的民族其名稱的起源來自希臘文，為紫紅色之意，因為當地盛產一種紫紅色染料，所以被逐漸用來稱呼當地的居民。他們建立許多商業據點與殖民地，其中最著名的殖民地就是位於北非的迦太基，但是在西元前三世紀到前二世紀，三次的布匿戰爭都敗於羅馬後被覆滅。這個民族從事航海經商時常需要記帳或簽署文件，可是當時流行的西亞文字或北非文字過於複雜，寫作費時，為了節省時間，將北非文字改良後，簡化成22
    個字母（時間約在西元前1700 年）。後來經商向外傳播到沒有文字的地中海地區，古希臘人在這基礎上創造了希臘字母，日後又影響到羅馬人。請回答第27-28 題：
