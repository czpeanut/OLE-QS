- id: doc_113_台中_大業_社會_歷史_g9s1e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 他們將死者臉部塗滿融化的松脂，再從鼻孔取出腦髓，並填入藥料。隨後用石刀切開身體的側腹取出肝、腸、胃、肺等內臟，放入食鹽將水分吸乾，再塗上油和松脂，分別裝入罐子中，這些罐子被放在陵墓中與屍體不遠的地方。後來也有人用亞麻布將內臟包裹起來，重新放入木乃伊的體內。請問：為什麼要做這些事情？
  options:
  - label: A
    content: 相信死後可以復活
  - label: B
    content: 展現自身手藝技術
  - label: C
    content: 表現對逝者的紀念
  - label: D
    content: 可以護佑親人平安
