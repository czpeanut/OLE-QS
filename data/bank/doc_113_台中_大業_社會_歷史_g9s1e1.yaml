  type: single
  page: 1
  stem: 「巴比倫之囚」時期，遭到奴役的他們渴望返回自己的土地，期待「彌賽亞」（意即救世主）的出現。於是，在他們族人之間逐漸流傳著耶和華一神信仰，以及王國將在耶和華神權下復興的說法，宗教因而逐漸成形。西元前586
    年，波斯人釋放巴比倫的他們回到自己的土地，這個宗教因此獲得更進一步的發展機會。請問：他們渴望返回自己的土地是在圖(一)的何處？
  options:
