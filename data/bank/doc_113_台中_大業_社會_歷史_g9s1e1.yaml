- id: doc_113_台中_大業_社會_歷史_g9s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 《伊里亞德》描述的是特洛伊戰爭在第十年（也是最後一年）戰爭結束前幾個星期的故事，重心主要放在傳說中的英雄阿基里斯、阿伽門農和奧德修斯等人的事蹟。戰爭起因於愛神阿芙羅黛蒂允諾將最美的女子—海倫（時為斯巴達國王的妻子）許配給特洛伊國王之子，兩人私奔至特洛伊，引起希臘各城邦組成聯軍進攻特洛伊。最後，奧德修斯想出一個計策：希臘聯軍假裝撤退，再將藏滿士兵的大木馬獻給特洛伊。特洛伊人以為戰勝，高興之餘將木馬移回城內，結果木馬內的希臘士兵開啟城門，裡應外合下攻滅特洛伊。請問：《伊里亞德》所描述的戰場大多在哪一個海域？
  options:
  - label: A
    content: 黑海
  - label: B
    content: 紅海
  - label: C
    content: 亞得里亞海
  - label: D
    content: 愛琴海
- id: doc_113_台中_大業_社會_歷史_g9s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 「300 壯士：斯巴達的逆襲」故事背景是波希戰爭波斯第三次入侵希臘半島時，斯巴達國王李奧尼達率領三百名斯巴達精兵，於溫泉關抵抗波斯軍隊的攻勢。電影以斯巴達國王與300
    名精兵的犧牲，喚起希臘城邦的抵抗意志，從而最後在斯巴達統率的希臘聯軍，於普拉提亞會戰擊潰波斯軍隊。本片基本上是以第三次入侵中的陸戰為主，但本片在劇情和場景設計上更具誇大效果，上映時甚至遭到某國以汙衊先人（波斯人）為由，予以禁播。請問：某國所指的是？
  options:
  - label: A
    content: 波蘭
  - label: B
    content: 希臘
  - label: C
    content: 伊朗
  - label: D
    content: 義大利
- id: doc_113_台中_大業_社會_歷史_g9s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 西元前2300 年左右，印度河流域城市文明興起。雖然出土的印章與泥版上發現文字符號，但因沒有解讀的線索，迄今還無法了解他們的文字內容。因此，目前只能從城市遺址的考古材料來認識這個文明。從城市遺址中，可以發現城內街道井井有條，顯然有經過良好規畫。在街道上還有不少燈柱，大概是用於夜間的照明。而交叉路口的房屋牆角砌成圓形，可能為了方便交通。在街道底下，還有縱橫交錯的下水道系統，汙水可經由下水道送往鄰近的河流裡。請問：上述內容所描述的城市是？
  options:
  - label: A
    content: 摩亨佐達羅
  - label: B
    content: 新德里
  - label: C
    content: 巴比倫
  - label: D
    content: 斯巴達
