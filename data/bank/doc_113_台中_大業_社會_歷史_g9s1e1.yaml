- id: doc_113_台中_大業_社會_歷史_g9s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 為了防範具有政治野心的人士興起而出現僭主政治，公民在公民大會上可以表決是否需要舉行陶片放逐制。約西元前5 世紀中期時，成年男性公民約3 萬人，依照陶片放逐法，至少需6,000
    位公民參與投票，把希望流放的人名刻寫在陶片上，票數最多者會被流放國外10 年，但不剝奪他的公民資格與私人財產。請問：上述內容是圖(二)何處的制度？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
- id: doc_113_台中_大業_社會_歷史_g9s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 在進入歷史時期時，王權已和宗教產生了密不可分的關係。在早期王朝時期所留下各地崇奉的神明，大致上繼續存在，其中又以天神霍魯斯、太陽神雷，以及風暴之神塞特最為重要，這些神祇都已超越了地域性，成為全國的神祇。其中可以看到有許多法老的名字前面都冠有「霍魯斯」的名，象徵是神的化身；到了古王國末期，有的法老名字前面冠上了「雷之子」的稱號，象徵著法老是神之子，承襲著神給予的統治權力。請問：上述內容所描述的地點在圖(三)的？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
