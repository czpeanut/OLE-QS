- id: doc_113_台中_大業_社會_歷史_g9s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 這個宗教崇信阿舒拉．馬茲達，祂是宇宙間代表光明與善良的神明，但是另有一個邪惡的神阿利曼，代表著黑暗與罪惡。善神的隨從是天使，惡神的隨從是魔鬼，彼此間進行長期的鬥爭。但最後善神一定會戰勝惡神。這個宗教的重要經典為「贊德．阿維斯達」，意思是「知識」，又稱「火教經」，主要記述瑣羅亞斯德的生平和教義，特別是有關於天使、魔鬼，以及末日審判等觀念，對於基督教都有影響。請問：這個宗教信仰者在圖(一)的何處？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
