- id: doc_113_台中_大業_社會_歷史_g9s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 這裡被羅馬君王們視為其內海，在他們統治的疆域內，建造了一座又一座的圓形競技場，如同露天體育場一般的娛樂複合式建築。這些巨大、呈現圓形或橢圓形的露天場地伴隨隆起的觀眾席，安排鬥士在此搏鬥或野獸表演、競賽與行刑，任何能夠「與民同享」的活動皆會舉辦於此。現存的圓形劇場約有230
    座，被不同國家保存下來，至今還有不少仍持續使用來舉辦音樂演唱會之類的活動。請問：被視為內海的是？
