    年，為抵禦北方民族攻擊，統治者哈德良下令在最北方邊界修建一道長達上百公里、貫穿不列顛島的城牆，這道牆因此被稱為哈德良長城。因為該長城有將近2/3 的牆體以石頭砌成，即使有的地段僅剩下基石和壕溝，但它仍能夠留存至今。一直維持派遣軍隊駐紮在城牆的關鍵地點，直到4
    世紀末才撤軍。之後，北方民族便突破長城、大舉南侵，長城南方地區從此陷入長期戰亂之中。請回答第35-38 題：
