  - label: D
    content: 丁
- id: doc_113_台中_大業_社會_歷史_g9s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 奧林匹克競技會原本是當地居民一種祭神儀式，自西元前776 年始，每隔四年舉行一次，每次歷時五、六天。競技會即將開始，各邦派出的龐大代表團自四面八方湧向奧林匹亞，遠道而來的船隻擠滿了阿爾浦斯河巨大的港口，乘車、馬或徒步行走的人布滿了通向奧林匹亞的大道，寧靜的聖地一時變得熱鬧非常。河岸邊、馬路與圍牆旁，一間間帳蓬與木屋搭建起來，來自各地的人便居住在裡面，他們還將帶來的各地特產在此交易，這真是一個名副其實的大聚會。他們不再擔心戰爭的發生，因為在節日期間，嚴禁各地進行一切軍事行動，凡違背此條款者要受到鉅額罰款。請問：上述活動的起源在圖(二)的何處？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
  assets:
