- id: doc_112_彰化_福興_國文_g9s1e1_s2_34
  section: 2
  number: 34
  type: single
  page: 5
  stem: 關於吳同學的研究過程，下列敘述何者正確？
  options:
  - label: A
    content: 上網找資料，是成功的重要關鍵
  - label: B
    content: 推算數據資，決定實驗的成敗
  - label: C
    content: 先理論後執行，終必推演出解答
  - label: D
    content: 不斷地探究與充實，才能解開科學的奧妙。
  group_stem: '一位年僅14歲，目前就讀國二的吳同學，日前為了找出地層下陷對高鐵的影響，跟爸爸借了十五萬，每天五點半出門趕搭高鐵，一個月內共搭了二百趟。吳同學奔波於高鐵間，夜以繼日地研究測量震動與分析的方法。包括上網蒐集資料、自己設計測量震動架、每天五點半出門趕車，只為了得到最多的數據。別人搭高鐵是坐在椅子上，他卻是坐在地板上測量震動數據等。而有了數據後，他卻無法解答計算數據的奧妙。他又找到了耶魯大學物理課程，並到臺大學習「傅立葉分析」，接著又意外發現手機可以偵測震動，開始學寫手機程式。累得他一個月下來瘦了六公斤！

    然而，這段努力並沒有白費，他在2012年獲得了「國際科學展覽會二等獎」，成了最年輕的得獎者。吳同學說，就因為渴望解開疑惑，因為「找到答案的爽度很高」，日後會繼續找下去！

    ——改寫自《聯合報》

    註：傅立葉分析(FourierTorm)是一種目前十分重要而且廣用於各行業的數位訊號分析技術，將儀器測量所得的數位訊號轉換為頻率振幅，進行頻率特性的分析。'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
