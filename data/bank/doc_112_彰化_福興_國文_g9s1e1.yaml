  stem: 根據本文內容，下列文句的主語何者正確？
  options:
  - label: A
    content: 且當以四百金為酬——盜賊
  - label: B
    content: 席捲而繩縛之——客商
  - label: C
    content: 俱順流傍岸——客商
  - label: D
    content: 驗席上有齒痕——僧人。
  group_stem: '伏波灘，入廣之要區，因其地有漢伏波將軍廟而名也。某年，有客收債而返，泊其處，船戶數人夜操刀直入曰：「汝命當畢於斯，我輩盜也，可出受死，勿令血汗船艙，又需滌洗！」客哀求曰：「財物悉送公等，肯俾我全屍而斃，不惟中心無憾，且當以四百金為酬。」既出券示之曰：「此項現存某行，執券往索可得。惟我清醒受死，殊難為情，請賜盡醉，裹敗席而終，可乎？」盜憐其誠，果與大醉，席捲而繩縛之，拋擲於河。

    甫溺，有犬躍而從焉，俱順流傍岸。犬起抓擊廟門，僧問為誰，不應；及啟關，見犬走入，渾身淋漓，銜僧衣不放，若有所引。隨至邊，見裹屍，俱欲散去，犬復作遮攔狀。僧喻其意，抬屍至廟。撫之，酒氣熏騰，猶有鼻息。解其縛，驗席上有齒痕，始知是犬齧斷，乃與茶湯而臥。

    明晨，客醒曰：「盜走水路，我輩從陸告官，當先盜至。」蓋度必執券而往某行也。僧諾，與俱。俄而盜果持券至，行主人偽為趨奉，遣客鳴官，遂皆擒獲。改寫自袁枚《續新齊諧》'
