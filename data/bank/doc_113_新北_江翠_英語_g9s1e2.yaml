  - label: B
    content: How to Keep Dementia Away?
  - label: C
    content: How to Stay Healthy?
  - label: D
    content: A Good Way to Treat Dementia
  group_stem: 'Dementia is a kind of brain sickness. For people with dementia, it
    is hard to remember things, think clearly, take care of themselves, and make decisions.
    They might forget names or have trouble doing everyday things. Dementia often
    happens to older people, but not everyone will get dementia. How can people keep
    dementia away when they get old? Here are some tips.

    1. Exercise. Keep moving! Walking, swimming, or doing any body activity helps
    your brain stay healthy.

    2. Eat healthy food. Eat fruit, vegetables, or fish. A balanced diet keeps your
    body and mind strong.

    3. Keep your mind active. You can play games, read books, or learn new things
    to keep your brain busy.

    4. Get enough sleep. Sleep for 7 to 8 hours each night. Enough sleep makes your
    brain rest and stay sharp.

    5. Stay social. Social activities help make your mind stay strong. Try to talk
    to your friends and family often. You can also join groups or clubs to meet new
    people.

    6. Don’t smoke or drink too much alcohol. Smoking and drinking too much alcohol
    can hurt your brain, so try to stop them.

    By following the simple tips above, you will give yourself the best chance of
