- id: doc_113_新北_江翠_英語_g9s1e2_s5_33
  section: 5
  number: 33
  type: single
  page: 4
  stem: Which country is NOT around the Mediterranean Sea?
  options:
  - label: A
    content: Greece
  - label: B
    content: Spain
  - label: C
    content: Italy
  - label: D
    content: India
  group_stem: 'What is a Mediterranean Diet?

    A Mediterranean diet is the way of eating in countries around the Mediterranean
    Sea like Greece, Spain, and Italy. It’s based on eating lots of fruit, vegetables
    and whole grains, with some fish and dairy products. People who follow this diet
    drink red wine with their meals.

    The Mediterranean diet is one of the healthiest in the world. It has lots of vitamins
    and minerals from the fruit and vegetables, and the olive oil is good for your
    heart. Fish is a great source of protein, and it’s low in unhealthy saturated
    fats. The red wine has antioxidants, which are also good for you.

    What should and shouldn’t I eat?

    The Mediterranean diet is very simple. You should eat lots of fresh fruit, vegetables,
    whole grain bread, pasta or rice, and so on. Use olive oil instead of butter.
    Eat fish at least twice a week, especially oily fish like sardines or salmon.
    Have a small amount of cheese and yogurt every day. Drink red wind but not too
    much. Don’t put too much salt or sugar in your food. Don’t eat too much red meat
    or drink too much alcohol. Eating in moderation is the key to health. In a Mediterranean
    country, people might have ice cream after a meal, or cake on a special occasion,
    but they don’t eat these things every day.

    Does it help you lose weight?

    Studies show that people who follow a Mediterranean diet have a lower body mass
    index (BMI) than those who don’t. That means they’re less likely to be overweight.
    They also have a lower risk of serious diseases like heart disease, diabetes and
    some types of cancer.

     vitamin 維他命 mineral 礦物質 protein 蛋白質 saturated fat 飽和脂肪 antioxidant 抗氧化劑 occasion
    場合 risk 風險 disease 疾病'
  ai_answers:
    gemini: D
    qwen: D
  answer:
  - D
  answer_status: ai_generated
