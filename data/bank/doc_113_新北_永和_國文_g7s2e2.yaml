  group_stem: "※請閱讀以下作品，並回答 28 ～ 29 題：\n甲、在一個沒有星星的夜裡/我獨自走在無人的街上/聽著自己的腳步聲/一下一下/敲打著寂寞的旋律/風/吹過空曠的巷子/發出嗚咽的聲音/像是誰在低聲哭泣/訴說著無盡的孤寂/遠處/傳來火車的汽笛聲/長長的/劃破了夜的寧靜/也劃破了我心中的寂寥/我停下腳步/閉上眼睛/仔細聆聽/這城市寂寞的聲音/它像一首無言的詩/在黑暗中/默默地吟唱。\
    \                             ——周夢蝶〈寂寞的聲音〉\n乙、有時候，我喜歡獨自一人，去聽那種「沒有聲音的聲音」。例如，雪落無聲。例如，花開無聲。例如，夜的來臨無聲。我喜歡在雪地裡行走，聽那種「沒有聲音的聲音」，那是一種純淨的寂靜，一種連時間都停止了的寂靜。我喜歡在花園裡靜坐，聽那種「沒有聲音的聲音」，那是一種生命的寂靜，一種連呼吸都屏住了的寂靜。我喜歡在夜裡獨自一人，聽那種「沒有聲音的聲音」，那是一種宇宙的寂靜，一種連星辰都沉默了的寂靜。在這些「沒有聲音的聲音」裡，我聽見了自己的心跳，聽見了自己的呼吸，聽見了自己的靈魂。\n\
    \                                                                       ——張曉風〈只緣身在此山中〉"
