  - label: C
    content: 這則寓言給我們的啟示是妄想不用付出勞力便能享受現成福利，終究一無所成
  - label: D
    content: 藉由「漁翁、鷸、蚌」三者關係來分別比喻「秦、趙、燕」三國的情勢
