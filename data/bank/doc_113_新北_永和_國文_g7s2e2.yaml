  group_stem: "※請閱讀以下短文，並回答 32 ～ 33 題：\n江海所以能為百谷王者，以其善下之，故能為百谷王。是以聖人欲上民，必以言下之；欲先民[1]，必以身後之。是以聖人處上而民不重[2]，處前而民不害。是以天下樂推[3]而不厭。以其不爭，故天下莫能與之爭。\n\
    \                                                                            \
    \      ——老子〈江海〉\n注釋：[1]先民：領導人民。[2]不重：不會感到有負擔。[3]樂推：樂於奉獻、效力。"
