  group_stem: "※請閱讀以下短文，並回答 30 ～ 31 題：\n    山居胸次[1]清灑，觸物皆有佳思：見孤雲野鶴而起超絕之想，遇石澗流泉而動澡雪之思[2]，撫老檜寒梅而勁節挺立，侶沙鷗麋鹿而機心頓忘。若一走入塵寰[3]，無論物不相關，即此身亦屬贅旒[4]矣。\n\
    \                                                                            \
    \ ——洪應明〈菜根譚〉\n注釋：[1]胸次：心中、心胸。[2]澡雪之思：比喻洗滌俗慮。[3]塵寰：世俗人間。[4]贅旒：比喻多餘的裝飾。旒，音ㄌㄧㄡˊ，旗子上垂下來的綵帶。"
  lesson_raw:
    title: 菜根譚
    basis: 古文閱讀第5～8篇
