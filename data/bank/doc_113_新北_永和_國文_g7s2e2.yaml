  stem: 下列何者的情境與「江海所以能為百谷王者，以其善下之，故能為百谷王」一句最不符合？
  options:
  - label: A
    content: 雖然他是隊長，但總是讓隊員先發表意見，並耐心整理大家的想法，從不急於表現自己的意見
  - label: B
    content: 她負責全場管理工作，卻默默做完最辛苦的部分，始終不炫耀，不計較得失，總是為團隊著想
  - label: C
    content: 他明明最有經驗，但總是謙虛地說自己只是學習比較早，並不認為自己比其他人更優秀或更厲害
  - label: D
    content: 會議結束後，他嚷嚷說：「幸好我提前提醒大家，否則今天計畫會出現大問題，應該好好酬謝我。」
