  - label: C
    content: 聲音類型：周夢蝶〈寂寞的聲音〉為雪落、花開、夜晚——抽象且「無聲」；張曉風〈只緣身在此山中〉為腳步聲、風聲、火車聲——具體且有聲
  - label: D
    content: 重點描寫：周夢蝶〈寂寞的聲音〉為外在環境的聲音象徵內心寂寞；張曉風〈只緣身在此山中〉為無聲中的聲音象徵內在平靜與靈性感受
