  stem: '根據下列寓言故事的內容，哪一個選項的敘述正確？【自學二】

    趙且伐燕，蘇代爲燕謂惠王曰：「今者臣來，過易水。蚌方出曝，而鷸啄其肉，蚌合而拑其喙。鷸曰：『今日不雨，明日不雨，即有死蚌！』蚌亦謂鷸曰：『今日不出，明日不出，即有死鷸！』兩者不肯相舍，漁者得而并禽之。今趙且伐燕，燕、趙久相支，以弊大衆，臣恐強秦之爲漁夫也。故願王之熟計之也！」惠王曰：「善。」乃止。                                      ——《戰國策．燕策》'
