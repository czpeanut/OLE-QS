- id: doc_113_新北_忠孝_社會_地理_g7s1e3_s1_22
  section: 1
  number: 22
  type: single
  page: 1
  stem: '2016 年的「帝王級/霸王級寒流」來臨，台北測站測得攝氏

    4 度的低溫，並出現設站以來第一次下冰霰的紀錄。

    2021 年臺灣旱災缺水危機是指發生於本島西部地區的大規

    模乾旱事件，尤其全台最大的台南曾文水庫蓄水率剩6%。

    此危機又被稱作「百年大旱」。

    上述兩次破紀錄的氣象災害較可能分別發生於何月份？'
  options:
  - label: A
    content: 3 ~ 5 月；1 ~ 3 月
  - label: B
    content: 7 ~ 9 月；10 ~ 12 月
  - label: C
    content: 10 ~ 12 月；7 ~ 9 月
  - label: D
    content: 1 ~ 3 月；3 ~ 5 月
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 地理
      code: 5-4
      title: 臺灣的氣象災害
      chapter: 第5章 天氣與氣候
    textbook: 七上地理 5-4 臺灣的氣象災害
    labeled_by: ai
- id: doc_113_新北_忠孝_社會_地理_g7s1e3_s1_23
  section: 1
  number: 23
  type: single
  page: 1
  stem: '「暑假期間，小倩與家人一起到溪邊玩水。她所在的

    下游地區天氣晴朗，但她抬頭望見上游山區開始變得

    烏雲密布，身旁河川的水位也漸漸上升，她馬上警覺

    到可能即將山洪暴發！」文中所描述的情形，除夏季

    的暴雨因素外，還與該地河川的何種特色最有關係？'
  options:
  - label: A
    content: 含沙量高
  - label: B
    content: 坡陡流急
  - label: C
    content: 東西分流
  - label: D
    content: 侵蝕旺盛
  tags:
