    (甲)卑南溪與高屏溪的分水嶺是中央山脈

    (乙)高屏溪流域因人口集中導致工業與民生污水較嚴重

    (丙)高屏溪的長度為全臺灣排名第一

    (丁)卑南溪主流流向北方，最後則注入太平洋'
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
