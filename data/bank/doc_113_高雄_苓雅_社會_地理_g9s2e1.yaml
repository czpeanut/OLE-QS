  stem: 「2000 年問世的黃金米，是由瑞士與德國學者所研發的基改米，可在白米中產生胡蘿蔔素，避免落後國家兒童因罹患維生素A 缺乏症而導致死亡。時至今日，黃金米雖仍頗受大眾議論，但已為基因改造技術寫下新的一章」。根據上述報導，科學家進行作物基因改造的原因，與下列何者關係密切？
