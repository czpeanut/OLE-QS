  stem: 台灣歷經數百年的開發歷史，透過地名可以看到不同時期留下的痕跡。住在台北信義區的小瑜與同事一早搭乘高鐵至高雄，準備吃遍南台灣各大小吃，第一站選擇到左營品嘗平價眷村懷舊美食，第二站來到屏東潮州，迫不及待要來一碗燒冷冰!
