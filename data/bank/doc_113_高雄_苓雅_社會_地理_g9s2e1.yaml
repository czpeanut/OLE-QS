  section: 1
  number: 15
  type: single
  page: 2
  stem: 根據前述短文，日語「旬」及台語「著時」的飲食概念，其宗旨最希望達到下列何種目標？
  options:
  - label: A
    content: 推廣有機農業
  - label: B
    content: 產銷履歷認證
  - label: C
    content: 縮短食物里程
  - label: D
    content: 符合市場需求。
  group_stem: 日語的「旬」，為「當令」的意思。「旬料理」表示餐廳準備的食材都是當令的「初物」—最早上市的時鮮之意。日語俗諺裡有「吃了初物，可以多活七十五日」，他們認為若照著自然的節奏走，合乎時節的農作物才能夠不使用農藥和肥料，對健康也最沒有負擔。台語裡則有「著時」一詞，也是在描述自然生長成熟的食物，懂食材的人都知道，著時的食物格外香甜可口，不屬於當季的食材病蟲害多而且生長不好，也不好吃。請回答15~16
