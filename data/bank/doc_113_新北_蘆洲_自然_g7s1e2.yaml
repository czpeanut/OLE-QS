  group_stem: "◎在植物中，光合作用利用太陽能將二氧化碳以及水轉換成醣類，人造光合作用則是一種將二氧化碳轉換成有用的碳基化學物質的過程。\n 人造光合作用中會有一個日光收集器，儲存太陽能量於電化學電池，再將二氧化碳轉換成簡單的碳燃料，例如甲酸（蟻酸）或甲醇，這些產物進一步提煉可製造乙醇（酒精）還有其他燃料，這同時也減少大氣中的二氧化碳。"
