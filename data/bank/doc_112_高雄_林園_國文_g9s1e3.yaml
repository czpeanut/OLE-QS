  group_stem: "晉中朝時有王質者，常入山伐木，至石室，見童子四人彈琴而歌。質因留，趺（１）斧柯（２）聽之。\n童子以一物與質，狀如棗核，質取而含之，便不復饑，遂復稍留。俄頃，童子曰：「汝來已久，何不速去？」，\n\
    質諾而起，所坐斧柯爛盡。既歸，計已離家數十年矣，舊宅遷移，室孙靡存，遂號慤（３）而絕。\n    \n【注釋】（１）趺：音ㄈㄨ，盤腿而坐。（２）斧柯：斧柄。（３）號慤：哀嚎悲痛。\
    \                            （鄭緝之 東陽記）"
