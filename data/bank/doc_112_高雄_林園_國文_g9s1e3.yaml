  stem: '「寒食後雨，余曰：『此雨為西湖洗紅，當急與桃花作別，勿滯也。』午霽，偕諸友至第三橋，落花積地寸餘，遊人少，

    翻以為快。」關於作者的想法，下列敘述何者正確？'
  options:
  - label: A
    content: 趁著雨後轉晴，呼朋引伴前往西湖遊賞
  - label: B
    content: 在寒食節之前，偕友同赴西湖向桃花告別
  - label: C
    content: 與人約在第三橋碰面，觀賞桃花盛開的美景
  - label: D
    content: 在雨中駐足第三橋，欣賞花瓣於風雨中翻飛。
  group_stem: '寒食後雨，余曰：「此雨為西湖洗紅，當急與桃花作別，勿滯也。」午霽，偕諸友至第三橋，落花積地寸餘，遊人少，翻以為快。

    忽騎者白紈而過，光晃衣，鮮麗倍常，諸友白其內者皆去表。少倦，臥地上飲，以面受花，多者浮，少者歌，以為樂。

