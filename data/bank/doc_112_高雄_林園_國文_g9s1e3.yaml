- id: doc_112_高雄_林園_國文_g9s1e3_s2_36
  section: 2
  number: 36
  type: single
  page: 4
  stem: 文中的實驗，主要是針對人的何種心理進行研究？
  options:
  - label: A
    content: 人在轉換不同角色時的心理調適
  - label: B
    content: 先入為主對人的觀感造成的偏差
  - label: C
    content: 人的心理狀態對容貌產生的影響
  - label: D
    content: 身分改變時外界眼光前後的差異。
  group_stem: "這是一個著名的心理實驗。一家視覺工作室，請六個專業攝影師，給同一個人拍肖像照。拍攝之前，工作人員分別向攝影師們描述了這個拍攝對象的身分：他是一位白手起家創業致富的百萬富翁，他是一名救生員，他是一個出獄的囚犯，他是一個職業漁民，他是一個靈媒，他是一個成功戒酒的酒鬼。\n\
    \  之後，六張肖像照被掛在了一起。每一張照片都準確、生動、傳神的表現了肖像照主人的身分：這是很大的一張面部特寫，眼神犀利，微微翹起的嘴角，顯得如此志得意滿，他是百萬富翁；這是一張扭過來的側臉照，磨亮的光頭，大鼻子，目光尖銳，嘴巴抿著，看上去牙關是緊咬的，身後是大面積的陰影，讓人覺得沉重，他是出獄的囚犯；這是一張如此燦爛的笑臉，敦厚、善良，給人溫暖和安全感，他是救生員；他坐在沙發上，雙手帄放在膝蓋上，目光犀利，洞穿鏡頭，他只占了半個畫面，另一半畫面是一張空椅子，他彷彿是在等待什麼人，整個畫面給人一種隱隱不安的詭異感，他是一個靈媒……。\n\
    \  但這個被拍攝的人，既不是出獄的囚犯，也不是救生員；既不是漁民，也不是百萬富翁；既不是酒鬼，也不是靈媒。這六個身分，其實都與他無關。他也不是演員，沒有瞬間進入角色的能力。可是，當他被當作囚犯、救生員、漁民、百萬富翁、酒鬼和靈媒之後，攝影師們居然將他拍出了這六張迥然不同的臉。這個實驗，是想告訴人們，當一個人被先入為主的假定為某種身分後，他的身上，可能尌真的能找到那個身分所具備的特定潛質。偏見尌是這樣產生的。\
    \   （孫道榮 偏見這樣產生）"
  answer:
  - B
  tags:
    textbook: 第五冊（九上）第3次段考範圍
