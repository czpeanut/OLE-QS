  section: 1
  number: 17
  type: single
  page: 2
  stem: '（  ）

    資料一：清末中國梁啟超提到：「國家積弱的根本，主因於婦女多半不受教育。女子受教育與否，關係到國家的存亡，女性必須被賦予責任。受教育才能培育優秀的下一代。」


    資料二：中國第一本女權著作《女界鐘》：「女子者，國民之母也。欲新中國，必新女子，欲強中國，必強女子，欲文明中國，必先文明女子……」


    請問：這兩則資料皆反應下列哪一件事？'
  options:
  - label: A
    content: 女性受教育更勝男性
  - label: B
    content: 受教育是一種新常態
  - label: C
    content: 國家富強與女性受教育有關
  - label: D
    content: 三從四德為教育根本。
