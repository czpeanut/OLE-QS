questions:
- id: doc_113_高雄_鼎金_社會_歷史_g8s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: （  ）十九世紀以來，不只是中國面臨來自西方國家的進逼，日本也在美國等西方國家的壓力之下，進行了改革運動，史稱「明治維新」。這場維新運動讓日本脫胎換骨，使得其國力逐漸增強，之後也讓日本成為國際局勢的一大焦點。下列關於「明治維新」的敘述，何者正確？
  options:
  - label: A
    content: 「明治維新」主要是由日本的知識分子推動，其君王並沒有特別支持與推行
  - label: B
    content: 日本「明治維新」的成功，使得清廷學習日本的經驗，加以推行「自強運動」
  - label: C
    content: 「明治維新」的改革重點主要是推行西化的改革和接收中國儒家傳統的禮儀特色
  - label: D
    content: 在「明治維新」的成果影響之下，日本在「甲午戰爭」當中打敗清廷，並迫使清廷割讓臺灣和澎湖等領土給日本。
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 歷史
      code: 5-2
      title: 中日對西力衝擊的回應
      chapter: 第5章 西力衝擊下的東亞世界
    textbook: 八上歷史 5-2 中日對西力衝擊的回應
    labeled_by: ai
