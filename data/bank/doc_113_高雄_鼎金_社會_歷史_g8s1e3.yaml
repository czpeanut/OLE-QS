  section: 1
  number: 2
  type: single
  page: 1
  stem: （  ）西元1905 年9 月，慈禧太后為收攬人心，推動「庚子後新政」，廢除實行千年的科舉制度，希望以新式教育培養一批以西方技術、制度、文化為主的新知識分子。考試形式改變後，入取的稱呼隨著專業的不同，便有「商科舉人」、「工科進士」的稱呼，有別於過去對科舉的價值觀。有關「廢科舉制度」的目的，下列敘述何者正確？
  options:
  - label: A
    content: 效法日本實行
  - label: B
    content: 派學生赴日學習儒家文化
  - label: C
    content: 科舉取士已不再適用，需要西學人才
  - label: D
    content: 推動留學生至國外就讀。
