  section: 5
  number: 27
  type: single
  page: 4
  stem: 幾位同學嘗試統整上文內容，何者敘述最為恰當？
  options:
  - label: A
    content: 小嘉：斑蝶傾向棲息於水源充足且位於背風側的森林
  - label: B
    content: 小渝：海拔越高空氣越潔淨，斑蝶的停棲數越多
  - label: C
    content: 小畇：在導航輸入地點「紫蝶幽谷」，可就近觀察斑蝶
  - label: D
    content: 小樂：為協助斑蝶南下越冬，國道採取保護措施。
  group_stem: '（二） 資料來源：交通部觀光署茂林國家風景區管理處網站

    千萬別誤以為「紫蝶幽谷」是一處地名，它其實是一個多種斑蝶群聚越冬的生態現象。時序進入秋分，台灣便開始吹起了東北季風，這時候熱帶起源的蝴蝶－—紫斑蝶便順著東北季風南下來到北回歸線以南的南部越冬。

    目前台灣有超過30處紫蝶幽谷，高雄市茂林區擁有至少10處的蝶谷，佔所有越冬蝶谷數量約1/3，谷內的斑蝶種類包括四種紫斑蝶及兩種青斑蝶，至少有六種蝴蝶。

    「紫蝶幽谷」形成於冬季期間，具有以下共通特性：一、位處北迴歸線以南的高雄、屏東、台東低海拔山區，冬季氣候條件較為乾燥及溫暖。二、屬避風的谷地或山凹地形，多數山谷北面有山勢或谷口朝南方，以阻擋東北季風侵襲。三、具有完整的森林層次及覆蓋度，以提供斑蝶停棲及森林內微環境的穩定。四、谷內或附近有水源，提供斑蝶晴朗時刻覓食。五、海拔500公尺以下的山區。

    每年斑蝶會依循固定路線北返，離開越冬棲地，過程中阻礙重重，其中一條路徑正好與國道三號垂直相交，導致車撞蝶亡！因此在北返高峰期的清明連假期間，高速公路局和台灣斑蝶生態保育協會聯手規劃以下保護措施：一、每分鐘斑蝶飛越高速公路數量超過300隻時，先封閉國道3號林內段251到253公里處北上外側車道；遷徙尖峰時，再進行車道管制。二、在路堤邊架設防護網，讓斑蝶飛越高速公路時，因阻礙而提高飛行高度，避開車流。'
