      code: 第六課
      title: 石虎是我們的龍貓
      chapter: null
- id: doc_112_桃園_石門_國文_g7s2e2_s4_11
  section: 4
  number: 11
  type: single
  page: 2
  stem: '下列文句節錄自放天燈是傳統，還是為山林製造更多垃圾，中間文句的順序被打亂了，正確排序應為何者？

    ------------------------------------------------------------------------------------------------------------------------------------------------

    有許多日本、韓國與香港的觀光客從國外慕名而來──平溪成了許多外國朋友來台體驗傳統文化的首選，

    上千盞天燈同步冉冉上升的畫面，也是觀光局推廣台灣意象的主要宣傳象徵。

    甲、但，現實真的如此嗎？

    乙、那碩大與壯觀之美，就彷彿星空般閃耀，感動無數人心。

    丙、在元宵天燈活動時，主辦單位更會準備數千盞的天燈免費提供給民眾施放，

    丁、在美麗的天燈施放過後，我們所看不到的，是隨之而來散落在各地的垃圾，

    不僅造成環境汙染，隨時可能引起的火災，也讓平溪周邊的民眾隨時處在警戒狀態。

    ------------------------------------------------------------------------------------------------------------------------------------------------'
  options:
  - label: A
    content: 丙乙甲丁
  - label: B
    content: 甲丙乙丁
  - label: C
    content: 乙丁甲丙
  - label: D
    content: 丁乙丙甲
  tags:
    textbook: 七下 第六課 石虎是我們的龍貓
    labeled_by: ai
