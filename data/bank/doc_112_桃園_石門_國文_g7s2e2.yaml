    要雨又無雨的城市／抖不掉黏在身上的灰濛／但總有人在馬路邊派發未來／一張一張／彩色印刷的夢和掉漆的現在在街頭移動／南京東路三房兩廳／近捷運／夢想對折再對折／放進左胸口袋／（再送幾趟，陽台的磚頭會多幾塊？）

