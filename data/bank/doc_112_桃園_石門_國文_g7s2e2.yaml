  section: 4
  number: 10
  type: single
  page: 1
  stem: 「傳說中，天燈是由三國時期的軍師諸葛亮所發明，他利用空氣燃燒，密度會變小的原理，設計出了天燈，作為軍隊之間互相傳遞訊息的工具。天燈的材料為宣紙、金紙、竹條、鐵絲和膠帶，利用這些東西製作出來的天燈，只要點燃金紙，燃燒空氣，就可以讓天燈飄上天，等到金紙燒完，天燈又會慢慢掉下來。雖然天燈和熱氣球的原理一樣，都是利用熱空氣升空，但是天燈升空後，人們沒辦法控制它會掉落在哪裡，所以會製造一些垃圾遺留在山中。」上述文句並未提及哪一項關於天燈的訊息？
  options:
  - label: A
    content: 天燈掉落後的環保議題
  - label: B
    content: 天燈升空的科學原理
  - label: C
    content: 天燈被發明之初的功能
  - label: D
    content: 天燈文化的式微沒落。
  answer:
  - 「逮」捕
  tags:
    textbook: 七下 第六課 石虎是我們的龍貓
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 七下
