  stem: 近來高雄市政府不斷將高雄市推向國際舞臺，讓世人認識這美麗的港都。高雄開創港市合作新模式，用公共建設帶動城市升級，吸引了半導體產業鏈與國際新創 AI
    企業爭相投資。同時還用國際級巨星的演唱會，帶動觀光風潮。以下對於高雄市的介紹，何者正確？
