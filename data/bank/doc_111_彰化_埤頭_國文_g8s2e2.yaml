  stem: 「沒有人懂你，是人生最艱難的時候嗎？不，最難的是你不懂你自己，運氯好，你會碰到比你更懂你的人。懂你的人有兩種，一種叫賁人，一種叫高人。人想飛，要有一雙臻膀，一邊叫貴人，一邊叫高人。齒膀一隻不夠，要一雙才能飛。」〈誣匽正《有一天》〉根據造段文字，下列推論何者最恰當？
  options:
  - label: A
    content: 懷才不遇是人生當中最艱難的時候
  - label: B
    content: 貴人與高人總在適當的時機出現
  - label: C
    content: 有貴人和高人提攜是成功一大助力
  - label: D
    content: 本身能力強即不須高人和貴人相助。
  tags:
    textbook: 第四冊（八下）第2次段考範圍
    labeled_by: ai
