  stem: 根據本文內容判斷，下列哪一則標語的涵義與本文的主旨最相近？
  options:
  - label: A
    content: 科技潮流，嶄新時尚
  - label: B
    content: 樂極生悲，物極必反
  - label: C
    content: 減法生活，加法人生
  - label: D
    content: 環保滿分，時尚零分。
  group_stem: '什麼是微塑膠？

    當我們把衣服丟進洗衣機，在洗滌的過程中，合成纖維會脫落釋出細小纖維，稱為微塑膠。每洗一次衣服，70萬條微塑膠纖維便隨著汙水進入下水道。微塑膠纖維有些堆積在海灘上，有些流入大海，汙染停留數百年。微塑膠不但容易成為微生物、魚類和海洋哺乳類的食物，隨食物鏈轉移，最後很可能出現在我們的餐桌上。依IUCN統計，35%的微塑膠汙染來自合成纖維。單就歐洲和中亞的數據推估，清洗衣服釋出的微塑膠纖維，等同每人每週往海洋丟棄54個塑膠袋。

    但是人造纖維的使用極為廣泛，若完全停止使用合成纖維，就目前地球上的棉花及天然纖維產量而言，不可能滿足大量的製衣需求。因此淘汰合成纖維是不符合現實的作法，所以我們應全盤重新思索製造衣物與看待衣物的方式，將產品壽命的耐穿性作為優先考量，而非大量生產拋棄式衣服。並且讓產品經過多年穿著後，可以進入完整的回收系統中重新被利用。身為消費者，我們在微塑膠問題中扮演關鍵角色——這一切可以從減少消費開始！若我們減少不必要的花費，便直接減少廢棄物的產生。

    〈改寫自綠色和平網站〉'
