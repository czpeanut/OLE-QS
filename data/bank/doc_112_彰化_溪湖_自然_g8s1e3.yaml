    | 丙 | 40 | 0.40 |

    | 丁 | 50 | 0.50 |'
  options:
  - label: A
    content: 乙、丁
  - label: B
    content: 甲、丙
  - label: C
    content: 甲、丁
  - label: D
    content: 乙、丙
