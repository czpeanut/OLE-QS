- id: doc_112_彰化_溪湖_自然_g8s1e3_s3_38
  section: 3
  number: 38
  type: single
  page: 3
  stem: '當原子的質子數與電子數相等時，我們稱這個原子為「電中性」。但當原子得到或失去電子時，我們會根據得失的電子多寡，而在原子旁邊標註＋（該原子少一個電子）或－（該原子多一個電子）的符號，例如：$H^{+}$代表少了一個電子的氫。而化合物的形成，也必須遵守電中性的原則，請參考下表，回答問題:


    | +1 價 | +2 價 | +3 價 | -1 價 | -2 價 |

    | :--- | :--- | :--- | :--- | :--- |

    | $Na^{+}$<br>$K^{+}$ | $Mg^{2+}$<br>$Ca^{2+}$ | $Fe^{3+}$<br>$Al^{3+}$ | $Cl^{-}$<br>$OH^{-}$<br>(氫氧根)
    | $O^{2-}$<br>$S^{2-}$ |


    請問下列哪個化學式是錯誤的?'
  options:
  - label: A
    content: NaCl
  - label: B
    content: $CaCl_{2}$
  - label: C
    content: $O_{3}Al_{2}$
  - label: D
    content: $Ca(OH)_{2}$
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 理化
      code: 6-5
      title: 分子與化學式
      chapter: 第6章 物質的基本結構
    textbook: 八上理化 6-5 分子與化學式
    labeled_by: ai
