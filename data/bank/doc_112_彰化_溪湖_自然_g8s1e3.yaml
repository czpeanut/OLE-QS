  number: 21
  type: single
  page: 2
  stem: 下列關於熱的敘述，何者正確？
  options:
  - label: A
    content: 熱傳播是由比熱大的物體傳到比熱小的物體
  - label: B
    content: 質量相同但比熱不同的兩物質，吸收相同的熱量，比熱小者溫度上升較多
  - label: C
    content: 不論兩杯水的質量為何，20℃和80℃的兩杯水混合平衡溫度一定為50℃
  - label: D
    content: 物體表面顏色越深、表面越光滑，越容易吸收或放出熱量
