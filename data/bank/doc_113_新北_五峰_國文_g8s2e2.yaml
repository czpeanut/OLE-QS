  group_stem: "請閱讀以下短文，並回答30～31 題：\n    景公有馬，其圉人(1)殺之。公怒，援戈將自擊之。晏子曰：「此不知其罪而死，臣請為君數(2)之，令知其罪而\
    \ 殺之！」公曰：「諾。」晏子舉戈而臨之，曰：「汝為吾君養馬而殺之，而罪當死；汝使吾君以馬故殺圉人，而罪又當死；汝使吾君以馬故殺人聞於四鄰諸侯，汝罪又當死。」公曰：「夫子釋之！夫子釋之！勿傷吾仁也！」\
    \               (劉向《說苑‧正諫》)\n   \n(1) 圉人:養馬者。圉，音ㄩˇ。\n(2) 數:音ㄕㄨˇ，責備。"
