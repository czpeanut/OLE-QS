- id: doc_113_新北_五峰_國文_g8s2e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: '趙高欲為亂，恐群臣不聽，乃先設驗(1)，持鹿獻於二世，曰：「馬也。」二世笑曰：「丞相誤邪？謂鹿為馬。」問左右，左右或默，或言馬以阿順趙高。或言鹿，高因陰中(2)諸言鹿者以法。後群臣皆畏高。」

    (司馬遷《史記‧秦始皇本紀》)

    注：(1)設驗：設計試驗。

    (2)陰「中」諸言鹿者：音ㄓㄨㄥˋ，重傷、陷害。

    根據這段故事，下列敘述何者正確？'
  options:
