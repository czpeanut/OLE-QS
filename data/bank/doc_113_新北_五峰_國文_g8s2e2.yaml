    content: 秦王因堅持所見，不願指鹿為馬而被趙高殺死
  - label: B
    content: 秦王為了測試大臣是否忠心，指使趙高指鹿為馬
  - label: C
    content: 秦王為了鞏固自己的權力處死不願指鹿為馬的大臣
  - label: D
    content: 秦王身邊的臣子大都因畏懼趙高的權勢而指鹿為馬
