  stem: 下列選項，何者無法看出司馬遷對孔子的敬仰？
  options:
  - label: A
    content: 破例將布衣孔子放至「世家」等級
  - label: B
    content: 余讀孔氏書，想見其為人
  - label: C
    content: 適魯，……余低回留之不能去云
  - label: D
    content: 天下君王，至於賢人，眾矣
  group_stem: "請閱讀以下短文，並回答34～35 題：\n    太史公曰：「詩有之：『高山仰止，景行行止。』①雖不能至，然心鄉②往之。余讀孔氏書，想見其為人。適魯，觀仲尼廟堂車服禮器，諸生以時習禮其家，余低回留之不能去云。天下君王，至於賢人，眾矣！當時則榮，沒則已焉。孔子布衣，傳十餘世，學者宗之。自天子王侯，中國言六藝③者，折中④於夫子，可謂至聖矣！」\
    \              (司馬遷《史記‧孔子世家》)\n \n【解釋】①出自《詩經》，意謂高山可以仰望，大道可供循行。 ②鄉：嚮往。 ③六藝︰六經，即《詩》、\
    \ 《書》、《禮》、《樂》、《易》、《春秋》。 ④折中︰取正，用以做為判斷事物的準則。"
