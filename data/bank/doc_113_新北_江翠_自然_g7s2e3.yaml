- id: doc_113_新北_江翠_自然_g7s2e3_s2_36
  section: 2
  number: 36
  type: single
  page: 3
  stem: 依據上文，熱泉生態系中的能量來源主要為下列何者？【4-3】
  options:
  - label: A
    content: 太陽
  - label: B
    content: 管蟲
  - label: C
    content: 硫化菌
  - label: D
    content: 硫化氫
  group_stem: '失落的生態系―熱泉生態系


    大洋深海區，廣大、黑暗、低溫、壓力大，有內太空之稱。長久以來科學界認為深海底部應像沙漠一般貧瘠，但隨著深海探測技術的進步，西元1977 年深海探測潛水艇於加拉巴哥海域深約2500
    公尺的海底，發現了多處海底熱泉，科學家發現此處竟有生氣盎然的生物群集，包括紅蛤、海蟹、貽貝、小蝦、章魚、管蟲等，甚至在熱泉區以外的海底，還有海星、海葵及蠕蟲等，形成了獨特的熱泉生態系。


    在資源貧瘠的深海環境，熱泉生態系是如何維持呢？科學家研究發現在100℃以上的海水中竟然有許多的細菌，其中的硫化菌可利用熱泉口所噴發出來的硫化氫作為能量來源，以合成自身所需的養分，故硫化菌屬於「化學自營細菌」。最奇妙的是那裡還有大量的管蟲族群，管蟲沒有消化道，體內卻含有大量的硫化菌，管蟲提供硫化菌生活的棲息地、氧氣與硫化氫等，而管蟲所需要的養分則由硫化菌所提供。此外，硫化菌也是紅蛤、貽貝與蝦等生物的食物來源，而蟹類再攝食這些紅蛤、貽貝與蝦等生物，如此也就形成了特殊的食物網。


    改寫自翰林版教科書p.158'
