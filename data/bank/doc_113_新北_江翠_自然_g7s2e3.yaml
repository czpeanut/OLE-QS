  - label: D
    content: 生物多樣性公約
  group_stem: '林保署推保育共生地 打造生物多樣性


    為呼應聯合國《●●●公約》要求各國在2030 年，達到三成國土面積受到有效庇護的目標，臺灣的農業部林業及自然保育署(簡稱林保署)在日前宣布，「保育共生地認證方案」正式上路，將廣邀企業、民間團體及機關學校一同協力，打造無保護區之名，但具保育之實的生物多樣性場域，達成三成陸域獲有效保育的目標。


    林保署說明，目前臺灣國有林以外的淺山、平原與海岸地區，因人口稠密，長期人為開發，導致棲地流失與破碎化，衝擊生物多樣性。為因應此狀況，林保署開始推動將許多具生物多樣性資源的公私有土地場域，加入保育共生地認證的行列，共同拓展臺灣在保護區外的實質保育空間。


    改寫自國語日報2025.06.16'
