    林保署說明，目前臺灣國有林以外的淺山、平原與海岸地區，因人口稠密，長期人為開發，導致棲地流失與破碎化，衝擊生物多樣性。為因應此狀況，林保署開始推動將許多具生物多樣性資源的公私有土地場域，加入保育共生地認證的行列，共同拓展臺灣在保護區外的實質保育空間。


    改寫自國語日報2025.06.16'
