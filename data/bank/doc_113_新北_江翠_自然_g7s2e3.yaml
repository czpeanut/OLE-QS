- id: doc_113_新北_江翠_自然_g7s2e3_s2_33
  section: 2
  number: 33
  type: single
  page: 3
  stem: 文中提到近年來地球的溫室效應增強，試問下列何者與溫室效應增強較無 關係？【4-3、跨科】
  options:
  - label: A
    content: 燃燒化石燃料增加
  - label: B
    content: 臭氧層破洞變大
  - label: C
    content: 海洋的鯨豚數量減少
  - label: D
    content: 二氧化碳排放量增加
  group_stem: '咦？什麼是「碳匯」？


    我們可以將碳匯想像是地球上大型的碳倉庫，透過人為或自然的方式存放了各種「碳的化合物」，例如煤炭、石油、天然氣等，而在特定條件下，這些化合物中的碳甚至可以被儲存長達千年之久。根據研究，海洋在西元2010~2019
    年間存放了約22%人為排放的碳，是地球上非常重要的碳匯。


    基於溫室效應增強與氣候變遷加劇，人們越來越關注大型魚類與鯨豚在海洋碳匯以及碳循環中的角色。其中大型鯨魚由於壽命長且身軀龐大，能將大量的碳長時間儲存在體內，而當鯨魚死亡沉落(鯨落)時，又將大量的碳帶入海底。另外，由於部分鯨魚會到深海覓食，並在靠近海水表層的地方排泄，而這些排泄物中的有機物、鐵、氮、磷能夠讓被鯨魚「施肥」過的地方浮游植物增生，藉由光合作用將大氣中的二氧化碳轉化為有機物。在上述過程中，鯨魚就像一座大型幫浦，在海洋中上上下下，協助著碳循環的進行。


    海洋碳匯是一個包含生物、化學和物理的複雜過程，控制著各種樣態的碳化合物進入海洋內部。根據科學家研究，比起人為刻意地將碳注入至海底儲存，減少工業捕鯨與投入鯨豚保育是更有效恢復海洋碳匯的方法。因為鯨豚能透過■■將海洋表層的碳轉移並長期儲存於海底，且這個過程不僅風險低、持續時間長、效率也很高。


    改寫自黑潮海洋文教基金會2023.08.08'
