  - label: C
    content: 僕人／ 館人／齊人／僕人
  - label: D
    content: 齊人／齊人／ 館人／齊人
  group_stem: '齊人有好詬①食者，每食必詬其僕，至壞器②投匕③箸，無空日。館人④厭之，(甲)忍弗言，(乙)將行，(丙)贈之以狗，曰：「是能逐禽，不腆⑤以贈子。」行二十里而食，食而召狗與之食。狗嗥而後食，且食而且嗥。主人詬於上，而狗嗥於下，每食必如之。一日，其僕失笑，然後(丁)覺。

    郁離子曰：「夫人必自侮，而後人侮之。」又曰：「飲食之人，則人賤之。」斯人之謂矣。

    ——劉基詬食


    注釋①詬：責罵 ②至壞器：甚至摔壞容器 ③匕：湯匙 ④館人：旅館主人 ⑤不腆：不豐厚。通常為贈人禮物的謙辭 ⑥嗥：音ㄏㄠˊ，吼叫。'
