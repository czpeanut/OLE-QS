  page: 3
  stem: 關於本文的說明，下列何者正確？
  options:
  - label: A
    content: 氫化油類能夠防止在體內形成壞的膽固醇
  - label: B
    content: 早餐多吃，午餐適度，晚餐、宵夜宜少食
  - label: C
    content: 勸人應少吃過度包裝、加工程序多的食品
  - label: D
    content: 蔬菜、水果應生食而蛋白質及澱粉類則熟食，以符合一比一原則
  group_stem: '吃出健康的原則

    1. 食物四分法：蔬菜25%、水果25%、蛋白質25%、澱粉類25%，生熟比例最好為1：1

    2. 多吃好油、少壞油：拒絕反式脂肪，如氫化棕櫚油、氫化椰子油、植物乳化油、植物酥油、起酥油等，以防在體內形成壞的膽固醇，或增加血管中風風險。

    3. 多原味、少調味：減少攝取有添加物的食品、拒絕加工程序多者、減少不必要的容器與包材，以免攝取不到食物原有的維生素及纖維質。

    4. 每餐只吃七分飽：早餐要足量、午餐要適量、晚餐要少量、細嚼慢嚥才是王道。晚上八點以後不宜再進食，可改善肥胖與慢性病。

    ——節選自今周刊844期'
