  group_stem: '鄰僅老夫婦二人，灌園為業，知余夫婦避暑於此，先來通殷勤，並釣池魚、摘園蔬為饋，償其價，不受，芸作鞋報之，始謝而受。

    時方七月，綠樹蔭濃，水面風來，蟬鳴聒耳。鄰老又為製魚竿，與芸垂釣於柳蔭深處。日落時登土山觀晚霞夕照，隨意聯吟，友「獸雲吞落日，弓月彈流星」之句。

