  stem: 上文提到「移民初墾時期，械鬥爭執不斷發生，人民團結自保」請問：下列何者是造成械鬥頻繁的原因？
  options:
  - label: A
    content: 統治階級濫徵雜稅，官吏因稅收分配不均互爭鬥
  - label: B
    content: 來臺移民爭奪土地水源及利益，因而聚眾結黨門毆
  - label: C
    content: 開港通商後，洋人與臺人間產生許多文化衝突
  - label: D
    content: 原住民土地遭到洋人侵占，生活窘困，被迫武力抗爭
  group_stem: '海綿寶寶、派大星、珊迪、章魚哥等人看到高雄市政府的創意宋江陣大賽傳單，起感興趣，躍躍欲試。於是上網搜尋資料，發現宋江陣流傳於臺灣南部，以臺南市、高雄市為主，其中高雄內門區宋江陣隊伍最多。其源流有許多說法，而其中一種是來自福建漳泉地區的團練。移民初墾時期，械鬥爭執不斷發生，人民團結自保。在此社會背景下，地方自組的武術陣頭「宋江陣」就因應而生。它不只是廟會進行，更是擔負著保家衛民的防衛任務。請回答第29到31題：

    承上述，這一行人在內門區發現一個很特別的現象：

    | 內門區的永富、永興、永吉、溝坪、內興、木柵、三平等七個里，有二十多幾個罕見姓氏。

    (1) 總鋪師机義雄「阿机師」與名廚阿基師同音，但此机非彼基。机義雄說，他原本姓「機」，十幾年前到戶政事務所詢問，戶政人員調出日治時檔案，才發現他原來姓「机」，猜想以前戶政所的人只認識「機」，不識「机」而弄錯。

    (2) 農民買順發被稱「買先生」，買姓家族住在溝坪里，買順發的3小孩分別命名為藝萍、藝菁、立龍，字面上看名字不奇怪，但冠上姓買，名字諧音成了「買一瓶、買一斤、買一龍」。

    (3) 內門居民力煒庭說，因為姓力，他從小被同學稱為水牛，長大後常被人要求拿身分證佐證他的姓氏。

    (4) 研究內門當地文化近廿年的文史工作者陳聰賢指出，當地比較罕見姓氏的居民，大部分都具有平埔族血統。平埔族在荷蘭統治時期都是使用羅馬拼音，沒有自己的姓。清乾隆年間，協助平亂有功，乾隆賜他們這些姓氏，使平埔族群也逐漸改漢姓。

    ※本文轉載自蘋果日報/劉智維/高雄報導〔2013-08-28〕，人間福報/高雄訊〔2019-12-05〕，及網站【南島觀史-福爾摩沙 Formosa】 |'
