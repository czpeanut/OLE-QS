- id: doc_113_基隆_銘傳_社會_g7s1e3_s3_49
  section: 3
  number: 49
  type: single
  page: 6
  stem: 根據上文，政府推廣「林下經濟」的目的最可能為下列何者？
  options:
  - label: A
    content: 鼓勵原住民族放棄傳統生活習慣
  - label: B
    content: 避免部落經濟出現發展停滯問題
  - label: C
    content: 改善外界對原住民族的刻板印象
  - label: D
    content: 取代原住民族世襲制的部落自治
  group_stem: '社會快速變遷，原住民族部落的存續面臨許多考驗，為此政府制定相關政策予以協助，例如：導入「林下經濟」，讓原住民族在舊有的基礎上，利用原本的生產技術，發展小型農業、畜牧業，種植藜麥、小米，放養土雞，採集蜂蜜、香菇、山當歸等，以不破壞環境生態的方式，與森林共存，不僅能夠增加收入，也為部落的產業創造更多可能性。

    而另外一個重要的挑戰與原住民族的傳統有關，以狩獵文化為例，一原住民族部落因違反《野生動物保育法》獵殺保育類動物黑熊，多名族人遭到檢方起訴。同村族人受訪表示，居住的區域被黑熊入侵，長久以來生活擔心受怕，黑熊是凶猛殘暴的動物，這些年輕人為保護族人安全，勇敢進行獵殺，在他們的眼裡，已獲得該族至高榮耀，他們是部落中的英雄，但在當代社會，他們卻將成為法律的階下囚。當原住民族傳統文化與當代價值觀相互牴觸，如何於兩者中找到彼此認同的平衡點，我們應該審慎以對。請問：'
