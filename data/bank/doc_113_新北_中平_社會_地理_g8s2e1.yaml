    然而，進入21 世紀，因全球供應鏈重整，我國產業面臨轉型挑戰，為降低對單一市場的依賴，我國政府積極推動「新南向政策」。近年來，新南向六國經濟快速發展(如表三)，已成為我國第二大出口市場，雙方建立互利共贏的夥伴關係，推動科技、觀光、教育、文化等交流，逐步實現「經濟共同體意識」的目標。'
