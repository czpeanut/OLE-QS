    圖(九) 為全球各緯度降水量與蒸發散量變化情形示意圖，地球上不同緯度的降水量與蒸發散量分布不均，因此形成「剩水區」與「缺水區」兩種類型的水分平衡區域。當一地的降水量大於蒸發散量時，即形成「剩水區」，反之則為「缺水區」。

    「剩水區」水分充足，物種多樣，「缺水區」地表水與地下水供應不足，對農業與人類活動產生限制，因此，合理的水資源管理顯得非常重要。'
