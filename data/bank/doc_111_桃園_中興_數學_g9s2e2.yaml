  stem: '1.今有甲、乙、丙三名候選人參與某村村長選舉，共發出 1720 張選票，得票數最高者為當選人，且廢票不計入任何一位候選人之得票數內。全村設有四個投開票所，目前第一、第二、第三投開票所已開完所有選票，剩下第四投開票所尚未開票，結果如表所示：


    | 投開票所 | 候選人 甲 | 候選人 乙 | 候選人 丙 | 廢票 | 合計 |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 一 | 201 | 190 | 137 | 12 | 540 |

    | 二 | 75 | 276 | 234 | 15 | 600 |

    | 三 | 31 | 87 | 195 | 7 | 320 |

    | 四 |  |  |  |  | 260 |


    （單位：票）


    請回答下列問題：

    (１)請分別寫出目前甲、乙、丙三名候選人的得票數。(2 分)

    (２)承(１)，請分別判斷甲、乙兩名候選人是否還有機會當選村長，並詳細解釋或完整寫出你的解題過程。(4 分)'
