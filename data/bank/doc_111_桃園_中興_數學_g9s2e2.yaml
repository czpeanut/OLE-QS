  stem: '火鍋店正舉辦週年慶活動，結帳時，顧客可從裝有若干顆金球、銀球、白球的箱子中抽出一顆球後，再將球放回箱內，若抽到金球則結帳免費，抽到銀球則結帳打五折，抽到白球則結帳沒有優惠。已知箱子中白球數量是金球數量的300
    倍，銀球數量是金球數量的 5 倍，小美打算參加此活動，且箱子中每顆球被她抽到的機會相等，以下為兩個關於小美參加此活動的敘述：

    (甲)小美結帳免費的機率是$\frac{1}{300}$

    (乙)小美結帳沒有優惠的機率是結帳打五折的機率的 60 倍

