    \ Mrs. Williams, who calls to thank him for what he has done. Manson says he is\
    \ glad that she gets her money back.\n        The following day, three newspapers\
    \ report Manson's story. Then five businesses ask him to work for them. Andrew\
    \ Smith, the owner of AAA Computer Store, says his store needs a good worker like\
    \ Manson. Manson is happy. He looks up at the sky and says, '\"Mom, you're right\
    \ again! Thank you.\""
