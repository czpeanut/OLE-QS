- id: doc_113_新北_中平_國文_g8s1e1_s5_13
  section: 5
  number: 13
  type: single
  page: 6
  stem: 根據文意，下列敘述何者是錯誤的？
  options:
  - label: A
    content: 作者旅行時堅持逛菜市場，是因為像逛大觀園，常被熱鬧的場景吸引，因此發展出了走逛樂趣。
  - label: B
    content: 走進菜市場看食材的原來模樣，從交談知道栽種環境，對地方生活風土更有較踏實的認識。
  - label: C
    content: 台灣的菜市場不論東西南北，林林總總，七拼八湊，幾乎大同小異，難有貼近在地生活的體驗。
  - label: D
    content: 作者認為菜市場是地方生活資訊中心，更會展現生機和危機的生態環境，現代人往返菜市場必須有積極質疑的精神。
  group_stem: '戊、〈節選自男人的菜市場　劉克襄〉

    　　三十歲以前，我是很少買菜作飯、五穀不分的單身漢。從住家附近的菜市場開始學習，一般人家出門買菜，總要忖度家人吃些什麼，要買幾日分量？我卻像逛大觀園，常被熱鬧的場景吸引，忘了買菜的真正目的。後來的旅行為什麼堅持逛菜市場，大概也是從這樣的走逛樂趣發展出來。以前走到哪兒，我也嘗試在地美食。但食物再好吃，總是他人烹煮，心頭有層隔閡。如果走進菜市場，看到食材的原來模樣，知道栽種的環境，似乎才有所安心，對地方生活風土更有較踏實的認識。

    　　有好幾回的鐵道旅行，我便如此深刻地經驗。譬如，有次帶學生到隆田，參觀舊車站和街景市容，還有幾家知名的飲料店。沒半小時，我們走逛結束，仍舊意猶未盡。隨後，我注意到，過馬路後有座菜市場，便順路去探看。我們在那兒看到了樹子豐盛的採收，以及酪梨一簍簍運載過來，告知了在地當令季節的物產為何。還有旁邊的小吃店，斗大看板寫著「草魚粥」，提醒此地不遠乃養殖草魚之地。有此市場一逛，我們對這小鎮的認識才生動地具體起來。菜市場從來就不只是買賣蔬果之地而已，大抵也扮演了這樣的功能和角色。一趟城鎮旅行，若少了菜市場的見聞，我們難有貼近在地生活的體驗。

    　　喜歡走逛菜市場的人，大概也很少像我這樣，好像是去聊天的。整個市場逛個一圈，我最愛跟菜販果農探東問西。返家後若有購買的蔬果，忙的也不是洗切烹煮，而是先仔細端看，翻書查冊，想要從剛到手的食材，獲得更淵博的認識和想像。賣蔬果的小販想必都不喜歡我這種人，才買一二，竟想順勢把菜的出處、特質和栽種方法問個明白。甚至，連販售者住在哪兒，農作物的生長環境都追究清楚。這就是我的買菜樂趣，不管在住家附近，或者遠到台東花蓮旅居。從一座菜市場觀窺城市，我習慣於這樣的生活認知，勾勒一個城鎮核心的綠色地圖。

    　　台灣的菜市場南北總有差異，東西部更是截然不同。旅行多年後，諸多菜市場的林林總總心得，如今七拼八湊，大抵也有了綜觀和具體的新角度。這本書的寫作內容，或許即可當作一座菜市場。菜市場裡有各類型的老師，我像一個愛發問的孩子，不斷地提出困惑，想要知道答案。我試著區分五大類，好讓大家清楚我的認知和思考，以及在那兒獲得的啟發。

    　　輯一，市場的走訪。

    　　傳統菜市場是動態的地方生活博物館。周遭鄉野物產，每天都在街頭熱鬧上演。我習慣從某一二特定物產，展開在地區域的摸索。那線頭，有時是某一季節才會茂發的食材，也可能繫乎某一在地族群鍾愛的蔬果。抑或是，一間著名老店散發的食物風味，一群果農小販微妙地定時來去。從這一細微之處探究，逐漸堆疊一個鄉鎮風土的認識，地方菜市場有何特質，大抵浮現。至於，新興的農夫市集，既保持著傳統市集的淳樸況味，又關連著食物安全、環保生態，最近幾年蔚為風氣，我亦甚愛走逛，但好些困境隱隱欲發，我也嘗試爬梳釐清，藉此拋磚引玉。

    　　輯二，食材的意見。

    　　日常食用的五穀雜糧，以及熟悉的食材配料，各地都有充裕的供應。但一口白飯、一顆雞蛋，一塊豆腐，這樣熟悉的事物，我們卻最容易疏忽。過去更少思考，其背後所衍生的諸多問題。菜市場不只是買賣的所在，也有物產起落的提點。不少食物的內容隨著生活型態的轉變，合成物、添加物的發達，早已悄然演化。從自己家庭日常的飲食，追溯到市場販售的情境，甚至源頭的生產者。在食材遞嬗的歷程中，我體悟到風土的脈動，也欣見改革力量的興起。

    　　輯三，時蔬的采風。

    　　不少熟悉的尋常蔬菜，過去可能被誤解了，或因時間歲月而被遺忘。更有一些，正以其目前發展出的特色，提示一個過去未曾注意的事端，可能會在未來，帶來另一食材的小小變革。走逛菜市場，絕對不能忽視一個小農的蹲坐。他們擺售自己栽種的任何物產，很可能是即將消逝的，或者外來新種的，也或許提示一不曾設想的飲食方法。我樂於停頓這一看似小小無關痛養的地點，發掘新的美好。

    　　輯四，水果的身世。

    　　水果的栽種和研發素來競爭激烈，品種隨時迭興。不少昔時熟悉的水果，跟現今流行風尚的有些落差，如今只能淪落鄉間，在地方偏遠的傳統菜市場發現。每個年代推陳出新的果物，都有其時代風味，反映當時的味蕾偏好、飲食觀念。不再獲得青睞的老舊水果，不等於劣等之物。相對地，面對現下的主流，豐碩而甜美的水果，或許得多些審慎。認識每個年代的優勢水果，不僅了解它當時盛產的意義，甚而明白如今它為何繼續存在，或者重新回來？

    　　輯五，小吃的啟發。

    　　每個菜市場總有些具有代表性的小吃特產。小吃的美學層次，自有屬於美食意見的豐富天地。但這些食材背後常有另一風土的隱喻，呼應當地生活的狀況，甚而精采反映在地自然環境的特色。地方獨特的小吃或者飲料，或許都可找到一些社會的因由背景，值得在未來當做某一節慶的要素。但更重要的，或許是提供了更進一步深化在地食物的論述。

    　　綜觀之，青蔬水果、柴米油鹽不只是生活必需品，現在談生態環保，恐怕也得從此一小處著手，從生活飲食，從庶民風土的悉心了解，才能引發更多人共鳴。我們走進這座森林裡觀察，不時遇見各種可能。太多食品的出產過程，有待我們更多研判，以及提供一個可能的想像。看到喜歡的蔬果擺在眼前，我常驚喜如見翠玉珠寶，也常保持這種探險的狀態。從這一頭順瓜摸藤，回溯源頭，看到它最初的環境。我定調菜市場為地方生活資訊中心，但更視為展現生機和危機的生態環境現場。一處測試你自己生活價值的場域。時而歪頭沉思，皺眉蹙頭，恐怕是現代人往返菜市場必須擁有的積極質疑，不容打折。'
