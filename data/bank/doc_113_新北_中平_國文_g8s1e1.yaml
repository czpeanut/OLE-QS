    竹林在狂風中甩著滿頭亂髮／幽靈踢起落葉尋找自己的腳印／整座山只有窗台上那根紅蠟燭

    眨也不眨眼，驚訝於黑暗中／玻璃窗上一個亮麗，惹火的身影　　――〈燭台〉

    螢光幕上幽浮來又幽浮走的，是個壞球／下墜球會到香港，上飄球則入蘇杭／

    當門窗都被吹成口哨，螺旋早把台灣捲入瘋狂／沒有一棵樹挺腰揮棒，茫茫大海中誰是投手

    衛星揉眼看，小心！又一顆變化球側身投出　　――〈颱風〉'
