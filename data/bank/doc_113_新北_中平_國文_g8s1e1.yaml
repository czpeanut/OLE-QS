- id: doc_113_新北_中平_國文_g8s1e1_s3_1
  section: 3
  number: 1
  type: fill
  page: 1
  stem: 社區中果香濃郁的土芭樂樹，使我不襟回憶起兒童時期翻越離笆、潘爬樹幹、採謫鄰居家的果實，最後被母親揪著耳朵則備的往事。
