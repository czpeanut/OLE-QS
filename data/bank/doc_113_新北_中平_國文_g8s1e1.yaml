  stem: 〈慈烏夜啼〉：「慈烏失其母，啞啞吐哀音。晝夜不飛去，經年守故林。夜夜夜半啼，聞者為沾襟。聲中如告訴，未盡反哺心。」這段詩句所傳達的意旨，與下列何者最接近？
  options:
  - label: A
    content: 吳宮花草埋幽俓，晉代衣冠成古丘
