  section: 5
  number: 7
  type: single
  page: 4
  stem: 下列詩句表達的意義，何者有誤？
  options:
  - label: A
    content: 「道路阻且長，會面安可知」：就算道路險阻，遙遠漫長，只要兩人心意堅定，會面必然平安可期。
  - label: B
    content: 「胡馬依北風，越鳥巢南枝」：北馬南來仍依戀北風，南鳥北飛仍築巢南枝，遠行之人也該心念故土。
  - label: C
    content: 「相去日已遠，衣帶日已緩」：因為相隔日漸久遠，思念益深，所以衣帶日緩，人漸消瘦。
  - label: D
    content: 「浮雲蔽白日，遊子不顧返」：就像浮雲遮蔽了太陽，遊子在外耽擱不顧念返還家鄉。
  group_stem: '丙、〈古詩十九首二首　佚名〉

    一、〈行行重行行〉

    行行重行行，與君生別離，相去萬餘里，各在天一涯，道路阻且長，會面安可知，胡馬依北風，越鳥巢南枝，

    相去日已遠，衣帶日已緩，浮雲蔽白日，遊子不顧返，思君令人老，歲月忽已晚，棄捐勿復道，努力加餐飯。

    二、〈涉江採芙蓉〉

    涉江採芙蓉，蘭澤多芳草，采之欲遺誰，所思在遠道，還顧望舊鄉，長路漫浩浩，同心而離居，憂傷以終老。'
