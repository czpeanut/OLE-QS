- id: doc_113_新北_中平_國文_g8s1e1_s4_1
  section: 4
  number: 1
  type: single
  page: 1
  stem: 對於〈跳水〉這首詩的含意，下列分析何者錯誤？
  options:
  - label: A
    content: 詩中藉事抒懷，以「跳水」為主題，鼓勵我們對於目標要樂在其中，追求自我實現。
  - label: B
    content: 「在跳板與水面之間／描畫出從容的曲線」：形容跳水過程的慌張匆忙。
  - label: C
    content: 「從十米高臺／陶醉於下面的湛藍」：跳水者準備充足，充滿期待與自信。
  - label: D
    content: 「讓青春去激起／一片雪白的讚嘆」：跳水者所展現的活力，令觀眾讚嘆不已。
  lesson_raw:
    title: 跳水
    basis: 題目指名〈跳水〉
  tags:
    textbook: 八上 第一課 小詩選(一)跳水(二)風箏
    labeled_by: ai
    chapter:
      publisher: 康軒
      book: 八上
      subject: 國文
      code: 第一課
      title: 小詩選(一)跳水(二)風箏
      chapter: null
- id: doc_113_新北_中平_國文_g8s1e1_s4_2
  section: 4
  number: 2
  type: single
  page: 1
  stem: 對於〈風箏〉一詩，下列選項的分析何者錯誤？
  options:
  - label: A
    content: 「拉著天空奔跑」說明只要堅持到底，必能掌握自己的人生。
  - label: B
    content: 「風箏」一詩所表現的人生態度，是不畏現實艱難，積極朝理想前進。
  - label: C
    content: 「細細一線，卻想與整座天空拔河」是指凡人力量有限，難以勝天，切莫狂妄自大。
  - label: D
    content: 「風箏」象徵著人們的希望。
  lesson_raw:
    title: 風箏
    basis: 題目指名〈風箏〉
  tags:
    textbook: 八上 第一課 小詩選(一)跳水(二)風箏
    labeled_by: ai
    chapter:
      publisher: 康軒
      book: 八上
      subject: 國文
      code: 第一課
      title: 小詩選(一)跳水(二)風箏
      chapter: null
- id: doc_113_新北_中平_國文_g8s1e1_s4_3
  section: 4
  number: 3
  type: single
  page: 1
  stem: 關於〈跳水〉和〈風箏〉兩首詩的比較，下列選項何者敘述正確？
  options:
  - label: A
    content: 前者以沉默、冷靜的態度詮釋理想，後者以歡樂、遊戲的心態看待人生。
  - label: B
    content: 兩首詩皆藉由觀眾的反應，傳達堅定志向、努力奮鬥的精神。
  - label: C
    content: 兩首詩皆以湛藍的天空象徵目標，勉勵人們努力去追尋自由。
  - label: D
    content: 前者藉由俯視的角度營造空間感，後者則以仰視的角度描繪場景。
  lesson_raw:
    title: 跳水
    basis: 題目指名〈跳水〉與〈風箏〉
  tags:
    textbook: 八上 第一課 小詩選(一)跳水(二)風箏
    labeled_by: ai
    chapter:
      publisher: 康軒
      book: 八上
      subject: 國文
      code: 第一課
      title: 小詩選(一)跳水(二)風箏
      chapter: null
- id: doc_113_新北_中平_國文_g8s1e1_s4_4
  section: 4
  number: 4
  type: single
  page: 1
  stem: 請根據下列新詩文句，判斷所描述的對象，何者正確？
  options:
  - label: A
    content: 直到疲倦也喊出了／生命的沙啞／在羽翼生鏽的夢裡／夏天／最遠我曾抵達／一個充滿謠言而又陌生的城市――螢火蟲。
  - label: B
    content: 秋天／最容易受傷的記憶／霜齒一咬／噢！那樣輕輕/就咬出一掌血來――聖誕紅。
  - label: C
    content: 感謝你們／對於我／小小的存在／還報予／生命最熱烈的掌聲――蚊子。
  - label: D
    content: 只有翅膀／而無身軀的鳥／在哭與笑之間／不斷飛翔――雙手。
  tags:
    textbook: 八上 第一課 小詩選(一)跳水(二)風箏
    labeled_by: ai
    chapter:
      publisher: 康軒
      book: 八上
      subject: 國文
      code: 第一課
      title: 小詩選(一)跳水(二)風箏
      chapter: null
- id: doc_113_新北_中平_國文_g8s1e1_s4_5
  section: 4
  number: 5
  type: single
  page: 1
  stem: 關於《古詩十九首》的敘述，下列何者為非？
  options:
  - label: A
    content: 作者是南朝梁的蕭統
  - label: B
    content: 十九首皆為五言詩
  - label: C
    content: 沒有題目，後人就以每首詩的第一句為題
  - label: D
    content: 詩作質樸自然，簡潔生動，是東漢末期五言古詩的最高成就。
  lesson_raw:
    title: 庭中有奇樹
    basis: 題目指名《古詩十九首》
