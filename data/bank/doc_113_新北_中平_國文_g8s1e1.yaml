  group_stem: '乙、〈五行詩三首　白靈〉

    一朵白雲抹亮了湖心／奮翅游泳過去幾隻鳥影／鳥的叫聲使整座湖淺淺／

    淺淺的地震，群山坐不住／醉熊之姿一隻隻倒頭栽入了　　――〈一朵白雲抹亮

