  stem: 下列關於〈庭中有奇樹〉一詩的分析，何者敘述正確？
  options:
  - label: A
    content: 「庭中有奇樹，綠葉發華滋。」以春天繁花盛開的景象，預告主角與親友久別重逢的喜悅。
  - label: B
    content: 「攀條折其榮，將以遺所思。」透過隨意攀折花朵的動作，宣洩主角傷心難過的心情。
  - label: C
    content: 「此物何足貴？但感別經時。」藉由奇樹香花不足珍視，表達出主角對長久分別的感嘆。
  - label: D
    content: 「此物何足貴？」含有「物以稀為貴，價格昂貴，所費不貲」的意思。
