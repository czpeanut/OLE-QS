- id: doc_112_高雄_大灣_國文_g7s1e3_s2_39
  section: 2
  number: 39
  type: single
  page: 7
  stem: 依據本文內容，江志忠遭受的人生磨鍊依序為下列何者？
  options:
  - label: A
    content: 父親過世後協助扛起家計→眼部感染開刀→殘障者身份的自我認同→練習田徑時的心境調適
  - label: B
    content: 父親過世後協助扛起家計→練習田徑時的心境調適→眼部感染開刀→殘障者身份的自我認同
  - label: C
    content: 眼部感染開刀→殘障者身份的自我認同→父親過世後協助扛起家計→練習田徑時的心境調適
  - label: D
    content: 眼部感染開刀→殘障者身份的自我認同→練習田徑時的心境調適→父親過世後協助扛起家計
  group_stem: '（三）

    江志忠出生於高雄的布農族部落，國小三年級時，父親不幸因意外過世，母親獨自扛起家計，身為長子的江志忠也跟著種芋頭、生薑來維持家計，養成他負責認真的態度。

    小學六年級時，喜歡運動的他加入了棒球校隊，可是他的眼睛不慎因為細菌感染，出現砂眼、紅腫的情況，母親沒有警覺到事情的嚴重性，畢竟，當時要下山看醫生，必須走幾十公里的路程，醫療費用也會是家中的負擔，因此只能長期使用藥房販售的眼藥水，對眼睛造成極大的傷害。

    升上國中之前，因為眼睛的狀況越來越嚴重，影響到視力，家人才送他到醫院開刀，1992 年，江志忠領取了殘障手冊。

    國中期間，他換了許多學校，也都持續參加學校的棒球校隊，最後因為視力的因素，他決定休學回家。後來在醫生的介紹下，進入台中啟明學校（專收視覺障礙學生的特殊學校）就讀。

    進入台中啟明學校是一件不容易的決定，因為從此他必須認定「殘障者」的身分，一開始他無法接受這樣的事實，每天孤僻、不快樂，直到他看到了許多處境比自己還要惡劣的同學，依然開心的度過學校生活，再加上學校老師如親人般的呵護，使得在啟明學校的就讀，成為他人生最大的轉捩點。

    透過老師的鼓勵，他開始接觸障礙體育，開始認真接受田徑運動的訓練。他在 2000 年的曼谷遠南運動會中得了一金兩銅牌，分別是標槍、鐵餅及鉛球項目，讓他得以憑著體育績優，進入文化大學就讀。

    進入文化大學後，學校提供工讀生抄筆記、錄音的協助，障礙教室也有擴視器能方便自修，雖然不能在上課的第一時間馬上吸收老師教導的知識，也仍能掌握學習的進度。

    江志忠說田徑運動是個人項目，難免會感到寂寞、乏味，當自己在休息時也會想到或許其他的競爭者正努力的鍛鍊，就更不敢放鬆懈怠。

    令江志忠最為難忘的一次比賽是參加 2000 年雪梨殘障奧運會得到金牌，站在頒獎台上，看到大會升起的中華奧會會旗，即使無法清楚看見那飄揚的旗幟，心中仍是滿滿的感動和成就感。

    （節錄改寫自殘障奧運會上的布農金牌標槍手江志忠／程廷）'
