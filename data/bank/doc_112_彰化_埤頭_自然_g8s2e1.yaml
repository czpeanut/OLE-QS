- id: doc_112_彰化_埤頭_自然_g8s2e1_s2_39
  section: 2
  number: 39
  type: single
  page: 3
  stem: 有關地殼組成元素的敘述，何者正確？
  options:
  - label: A
    content: 大多以化合物存在
  - label: B
    content: 只有在元素狀態可以被氧化
  - label: C
    content: 鎂是其中含量最少的元素
  - label: D
    content: 化合物的種類比元素的種類少，但是數量大。
  group_stem: '地殼含有多種元素，若以超過1%的元素含量多寡依序排列是氧＞矽＞鋁＞鐵＞鈣＞鈉＞鉀＞鎂＞氫。氧是地殼組成物質中含量最高的元素，約占49%，其餘占比的矽約為26%、鋁8%、鐵5%、鈣3.5%等。因此觀察地殼的物質組成時，很容易看到各式各樣的氧化物。

    生活中最常見的砂土，其實就是一種氧化物，主要是由氧和矽的各種化合物混合組成，而其他常見的氧化物還有氧化鋁($Al_{2}O_{3}$)、氧化鐵($Fe_{2}O_{3}$)、氧化鈣($CaO$)等，種類繁多。人體不可或缺的空氣中，所含的氣體眾多，其中氧氣就占了21%！而地球上最豐富資源——水，就是氫的氧化物。地球所含元素相當豐富，才得以成為富含生命的星球。'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
