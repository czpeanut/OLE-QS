    content: 有一天蓋茲在信箱裡發現一張生日賀卡，那是寄給含月的，郵遞員不當心放錯了，蓋茲就想著要給牆東邊的鄰居送回去
  - label: B
    content: 含月正對著自己孤獨的生日晚餐流淚，隔壁的洋老頭突然給她送來了一大把飯勺
  - label: C
    content: 蓋茲受這美好的菜香味誘惑已經多時，得此一請，也就不客氣地坐下來大嚼一頓
  - label: D
