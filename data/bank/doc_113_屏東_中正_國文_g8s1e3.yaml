  page: 2
  stem: 〈鳥〉一文中，作者以細膩的筆觸寫出對鳥獨特的感受，並運用豐沛的聯想力，以日常事物，來描摹和譬喻，使得鳥的樣貌鮮明活潑，如：(甲)「腳上像是有彈簧」描寫鳥的跳盪輕靈
    (乙)有時是合唱，有時是獨奏簡直是一派和諧的交響樂，形容鳥的叫聲美妙多樣(丙)「世界上的生物，沒有比鳥更俊俏的」以轉化兼誇飾的修辭來形容鳥的外形俊美秀麗(丁)善用現代詩文名句，使得文章更具典雅優美(戊)文章末段用不忍看籠中鳥作結束，呼應首段的「我愛鳥」。上述敘述哪些是正確?
