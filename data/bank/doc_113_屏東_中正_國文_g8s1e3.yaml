- id: doc_113_屏東_中正_國文_g8s1e3_s4_20
  section: 4
  number: 20
  type: single
  page: 3
  stem: 〈拆牆〉一文中「現在，牆的西邊只剩下蓋茲，牆的東邊只剩下含月了。蓋茲依然能聞到牆東邊飄來的飯菜香，但再也聽不見有人叫『挨千刀的』了。含月依然能看見牆西邊的車出出進進，但耳邊叮叮咣咣的聲音卻沒有了。」根據這段文字，下列敘述何者不正確？
  options:
  - label: A
    content: 以「只剩下」委婉表達絲黛娜與啟華已過世
  - label: B
    content: 含月於丈夫不在後，整天茶飯不思，甚至無心下廚
  - label: C
    content: 蓋茲於妻子不在後，已將掛在車上的生日禮物取下
  - label: D
    content: 描寫東西兩家失去伴侶後生活的改變，透露出孤寂之感。
