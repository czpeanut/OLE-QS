- id: doc_113_屏東_中正_國文_g8s1e3_s4_4
  section: 4
  number: 4
  type: single
  page: 1
  stem: 「菊，花之隱逸者也；牡丹，花之富貴者也；蓮，花之君子者也。」關於作者對這三種花的評論，下列說明何者正確？
  options:
  - label: A
    content: 菊花代表遠離塵囂，獨善其身的隱士
  - label: B
    content: 牡丹代表樂於分享，慷慨布施的富人
  - label: C
    content: 蓮花代表修身養性，不問世事的君子
  - label: D
    content: 由此評論可見作者三種花都喜愛。
  lesson_raw:
    title: 愛蓮說
    basis: 引用〈愛蓮說〉原文
  tags:
    textbook: 八上 第七課 愛蓮說
