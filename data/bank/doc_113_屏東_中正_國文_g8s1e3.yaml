- id: doc_113_屏東_中正_國文_g8s1e3_s4_16
  section: 4
  number: 16
  type: single
  page: 2
  stem: 「不陰不晴的天氣，乍寒乍暖的時令。樹枝間新透出葉芽，稀疏瑣碎的點綴著，地上黃一塊，黑一塊，又淺淺的綠一塊，看去很不順眼，但幾天後，便成了一片蓊然的綠雲，一條綴滿星星野花的繡氈了。」（蘇雪林〈青春〉）根據上述文意判斷其季節與下列何者不同？
  options:
  - label: A
    content: 亂花漸欲迷人眼，淺草才能沒馬蹄。（白居易〈錢塘湖春行〉）
  - label: B
    content: 渭城朝雨浥輕塵，客舍青青柳色新。（王維〈送元二使安西〉）
  - label: C
    content: 此花此葉常相映，翠減紅衰愁殺人。（李商隱〈贈荷花〉）
  - label: D
    content: 沾衣欲濕杏花雨，吹面不寒楊柳風。（志南和尚〈絕句〉）
