  page: 2
  stem: 古人以「飛鴿傳書」傳遞消息，隨著時代的改變，飛鴿逐漸被電報、電話，甚至是各種通訊軟體所取代。下列文句皆在描寫現代的科技產品，請根據文意敘述何者不正確？
