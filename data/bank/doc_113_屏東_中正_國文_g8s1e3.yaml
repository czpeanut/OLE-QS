  type: single
  page: 2
  stem: 在〈冬陽〉一文中提及「經過師傅翻彈過的棉被，質地蓬鬆多了，蓋在身上的重量變輕卻較前暖和，顏色會從原先的深褐色變成淺淺的乳黃，卻永遠也無法變回剛買時那種雪柔的白。」根據文意，關於翻彈過的棉被，下列敘述何者正確？
