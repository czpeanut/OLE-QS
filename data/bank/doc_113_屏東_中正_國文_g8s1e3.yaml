- id: doc_113_屏東_中正_國文_g8s1e3_s4_5
  section: 4
  number: 5
  type: single
  page: 1
  stem: 「噫！菊之愛，陶後鮮有聞。蓮之愛，同予者何人？牡丹之愛，宜乎眾矣！」關於這段文字的含義，下列敘述何者正確？
  options:
  - label: A
    content: 懷抱道德理想的人到處都有
  - label: B
    content: 追名逐利的人沒有從前多
  - label: C
    content: 社會上多數人都能棄惡從善
  - label: D
    content: 隱居守節的人已不復多見。
  lesson_raw:
    title: 愛蓮說
    basis: 引用〈愛蓮說〉原文
  tags:
    textbook: 八上 第七課 愛蓮說
