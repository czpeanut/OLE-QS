- id: doc_113_屏東_中正_國文_g8s1e3_s4_2
  section: 4
  number: 2
  type: single
  page: 1
  stem: 關於〈愛蓮說〉一文的說明，下列選項何者正確?
  options:
  - label: A
    content: 以「蓮花」的特質象徵君子的品德作為全文主軸
  - label: B
    content: 用「牡丹」象徵尊貴，來陪襯「蓮花」的婀娜多姿
  - label: C
    content: 用「菊花」的平易近人，來對比「蓮花」的高不可攀
  - label: D
    content: 以「蓮之愛，同予者何人？」一句，比喻君子自視清高。
  lesson_raw:
    title: 愛蓮說
    basis: 題幹提及〈愛蓮說〉
  tags:
    textbook: 八上 第七課 愛蓮說
