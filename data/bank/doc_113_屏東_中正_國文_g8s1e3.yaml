- id: doc_113_屏東_中正_國文_g8s1e3_s4_3
  section: 4
  number: 3
  type: single
  page: 1
  stem: 〈愛蓮說〉一文中的寫作手法，下列敘述何者錯誤？
  options:
  - label: A
    content: 藉由蓮花的特質象徵君子的美德，並寄託作者心志
  - label: B
    content: 作者藉蓮對世人發出嚴厲的抨擊與批判，表示不屑
  - label: C
    content: 本文藉三種花表達三種人格特質，各有其象徵意義
  - label: D
    content: 內容先泛論眾花，再聚焦描寫蓮的特質，最後抒懷。
  lesson_raw:
    title: 愛蓮說
    basis: 題幹提及〈愛蓮說〉
  tags:
    textbook: 八上 第七課 愛蓮說
