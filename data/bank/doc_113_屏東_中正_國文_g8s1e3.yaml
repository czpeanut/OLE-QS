  stem: 在〈鳥〉一文中提及「好銳利的喜悅刺上我的心頭」這裡將抽象的「喜悅」，用「刺」這個字，將它轉化為「具體」的尖銳物體，使人的感受特別深刻。下列文句，何者沒有採用這樣的手法？
