- id: doc_113_屏東_中正_國文_g8s1e3_s4_1
  section: 4
  number: 1
  type: single
  page: 1
  stem: 〈愛蓮說〉一文為「藉物託志」的文章，下列選項何者不是作者想表達的旨意?
  options:
  - label: A
    content: 藉蓮的特質來象徵君子的美德
  - label: B
    content: 表達君子莊重正直的品德修養
  - label: C
    content: 暗示君子具有環境保護的意識
  - label: D
    content: 彰顯君子不肯隨波逐流的情操。
  lesson_raw:
    title: 愛蓮說
    basis: 題幹提及〈愛蓮說〉
