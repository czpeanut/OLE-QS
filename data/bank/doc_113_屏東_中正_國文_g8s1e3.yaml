  page: 4
  stem: 'Netflix 韓國〈魷魚遊戲2〉影集劇組、演員等一行人應某商家邀請到台來進行宣傳，在活動宣傳結束後依慣例要拍一張大合照，下列哪個圖式最有可能是當時合照人員所站的位置？

    【●→男、女主角、▲→男、女配角、■→劇組隨行人員、▼→商家、★→粉絲】'
  options:
