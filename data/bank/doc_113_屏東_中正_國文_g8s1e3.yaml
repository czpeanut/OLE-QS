- id: doc_113_屏東_中正_國文_g8s1e3_s3_1
  section: 3
  number: 1
  type: fill
  page: 1
  stem: 【①】
  group_stem: 周敦頤在〈愛蓮說〉一文中藉由描繪蓮花的形象，以闡明君子的品德，例如：以「【①】」象徵君子能潔身自愛，不同流合汙；以「【②】」象徵君子品格清高，不媚世隨俗；以蓮花「【③】，【④】」的外形，表現君子行為正直，不攀附關係的形象。「【⑤】，【⑥】，【⑦】」，則是從蓮花的香氣、外觀來形容君子，其品德醇美，芬芳遠播，不但可以影響他人，也讓人心生敬仰，不敢輕慢玩弄。
  lesson_raw:
    title: 愛蓮說
    basis: 默寫〈愛蓮說〉
  tags:
