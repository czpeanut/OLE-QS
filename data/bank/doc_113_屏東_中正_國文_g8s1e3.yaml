        - 821.45
  group_stem: '(甲)「C 位」是網絡用語，也有Carry 或Center 的核心位置的意思。其實這個詞語早期於遊戲領域是指能夠在遊戲的中後期擔任主力帶領隊伍的角色。隨後「C
    位」也逐漸轉移到生活中，即是當某一人在團隊中處於核心位置—一眼能看到的中心位置。如果在團隊組合中，站這個位置就代表這個人是團隊核心；在影視劇或綜藝宣傳海報中，在這個位置也是身份地位比較高或特殊的人，例如：男、女主角、主唱、隊長等。一般C
    位大多是一個人，有時也會出現雙C 位，甚至更多。（節錄修改Thread貼文）


    (乙)台灣隊奪下2024 年世界十二強棒球賽冠軍，代表隊凱旋歸國時，副總統親自前往接機，不過當時場面卻相當混亂，尤其在與棒球隊大合照的環節時，遭機場內某家免稅店人員突然亂入搶C
    位蹭合照，把球員和教練晾在後方且瞬間淪為配角。影片曝光後立刻引發砲火，大批網友灌爆該家免稅店臉書，並怒轟其利用「國家英雄」來蹭宣傳，造成場面混亂失控，超級丟臉。有關免稅店人員搶C
    位合影一事，引發維安疑慮。國安局已將檢討報告送立法院，並列出三缺失檢討，包含儀節動線規劃欠佳、合影引導管制不足、現場機動應變不佳。交通部長在立法院接受媒體聯訪時表示該免稅店在國家運動員回台時，未經同意就拉布條、高舉標示牌和做廣告的動作，他認為非常不妥。國安局也說：「當活動現場狀況失序時，未能有效調整勤員部署位置，處置技巧不夠靈活細膩。今後將加強溝通協調，有效掌控風險；審慎規劃動線，嚴密計畫作為；提升執勤技巧，以應對突發狀況。」

    （節錄修改三立新聞網頁新聞〈2024/11/26〉）'
