- id: doc_113_新北_崇林_數學_g9s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '已知：如圖，$\angle 1＝\angle 2$，$\angle 3＝\angle 4$。

    求證：$\overline{AC}＝\overline{BD}$。

    證明的過程有下列四個步驟：

    (1) $\overline{AC}＝\overline{BD}$

    (2) ∵ $\angle 1＝\angle 2$，∴ $\angle DAB＝\angle CBA$

    (3) $\triangle ABD \cong \triangle BAC$(ASA 全等性質)

    (4) ∵ $\angle 3＝\angle 4$，$\overline{AB}＝\overline{AB}$，$\angle CBA＝\angle DAB$

    請問證明的順序應為下列何者？'
  options:
  - label: A
    content: (1)→(3)→(2)→(4)
  - label: B
    content: (2)→(4)→(3)→(1)
  - label: C
    content: (3)→(4)→(1)→(2)
  - label: D
    content: (4)→(2)→(3)→(1)
