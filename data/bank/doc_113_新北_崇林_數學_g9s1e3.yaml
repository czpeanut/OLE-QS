  section: 1
  number: 17
  type: single
  page: 3
  stem: '生活中有許多物品與服務使用阿拉伯數字 0～9 進行編碼識別，並在編碼的個位數後標上一位數檢核碼，以檢查編碼是否被掃描裝置誤判或人工輸入誤植。我們以二位數編碼說明一種產生檢核碼的方法，如下表所示。


    | 格式 | 編碼（十位數、個位數） | 檢核碼 |

    | :--- | :--- | :--- |

    | 產生檢核碼 | 步驟一 | 將編碼中的十位數字乘上 2、個位數字乘上 3，再將這些乘積相加。 |

    | | 步驟二 | 步驟一中得出的數值，其個位數字即為此編碼的檢核碼。 |


    已知編碼中的十位數字與個位數字皆可為 0～9，請根據上述的資訊，求出編碼 16 與 94 的檢核碼？【仿會 110(補考)】'
  options:
  - label: A
    content: 兩者檢驗碼相同，數字為 0
  - label: B
    content: 兩者檢驗碼相同，數字為 5
  - label: C
    content: 兩者檢驗碼不相同，前者數字為 0，後者數字為 5
  - label: D
    content: 兩者檢驗碼不相同，前者數字為 5，後者數字為 0
  assets:
  - key: s1_17_f1
    kind: figure
    file: doc_113_新北_崇林_數學_g9s1e3/s1_17_f1.png
