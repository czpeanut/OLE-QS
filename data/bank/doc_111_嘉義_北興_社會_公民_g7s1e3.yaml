    content: 秩序問題
  group_stem: "請閱讀以下文章，並回答問題：\n  噹噹噹～上課鐘聲響起，班會活動開始。七年二班今天要討論的議題是決定班服製作的圖案。下列是他們利用班會課進行討論的過程：\n\
    班長：各位同學坐好，我們準備開班會。首先我們要先選出主席、司儀和紀錄。\n  主席、司儀和紀錄產生後，班會正式開始，接著進入提案討論的部分。\n主席：今天我們討論的議題是決定班服的圖案，請同學踴躍提供意見進行討論。\n\
