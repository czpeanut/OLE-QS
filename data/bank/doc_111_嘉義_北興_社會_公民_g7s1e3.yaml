  stem: 文中提到許多居民不願遷村，是因為下列何種原因？
  options:
  - label: A
    content: 遷村的補償金額太少
  - label: B
    content: 遷村會使原住民族失去自治權
  - label: C
    content: 遷村會改變部落原有的生活模式
  - label: D
    content: 反對遷村是為了反對當時的執政黨。
  group_stem: "請閱讀以下文章，並回答問題：\n  位於新店溪，以阿美族族人為主要成員的溪洲部落，是新北都會區都市邊緣的原住民族部落。1981 年族人開始自力造屋建造家園，逐漸形成聚落。1995\
    \ 年，在地方政府的輔導下，部分住戶遷入新店區的中正國宅。然而，因部落的生活型態與國宅空間差異極大，許多居民不願遷村，因此組成自救會，展開反迫遷的抗爭道路。\n\
    \  2007 年，政府開始積極拆遷數個位於新店溪畔的都市原住民族部落，並且認定部落為違建，自救會激烈抗爭，並成立溪洲阿美文化永續暨社區發展協會。社會各界聲援協助，歷經\
    \ 10 年抗爭，政府的態度從拆遷到緩拆，到願意在部落旁畫設原住民族生活區。由族人向銀行貸款及自籌、企業捐款與新北市政府補助三方共助下，終於在 2017 年正式舉行家園新建工程的開工儀式。\n\
    \  新北市政府人員表示，新家園的位置離原本的部落大約 100 公尺，地勢較高，位於堤頂，以後不會在颱風季節受到淹水的威脅。家屋的型式及結構皆由部落族人依自己的住居需求及意願設計規畫，並由族人實際一起參與營造工作，親手自力建造家園。"
