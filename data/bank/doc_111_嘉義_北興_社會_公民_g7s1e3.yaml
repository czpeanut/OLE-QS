  section: 1
  number: 4
  type: single
  page: 1
  stem: '報紙專欄刊出一篇社論如下，針對社論提出的問題，下列何人的回應較為適當？

    社論專欄

    再度有原住民族因使用槍枝狩獵保育類動物而遭到判刑。雖然法律是具有強制力的規範，但若與原住民族傳統狩獵文化發生衝突時，究竟孰輕孰重，兩者間的矛盾應如何解決？'
  options:
  - label: A
    content: 蓁蓁：法律不能剝奪人權，應允許原住民族無限制進行狩獵
  - label: B
    content: 郁郁：原住民族應與政府協調溝通，尋求法律與傳統之間的平衡
  - label: C
    content: 靖靖：原住民族應發動抗爭廢除法律，爭取特權以維護傳統狩獵文化」
  - label: D
    content: 楠楠：法律之前人人平等，政府不應允許原住民族持有任何槍枝。
