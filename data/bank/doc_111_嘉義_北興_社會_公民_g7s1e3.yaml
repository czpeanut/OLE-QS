  section: 2
  number: 21
  type: single
  page: 3
  stem: 日光小林社區的大武壠族人透過歌舞文化節，所傳達的理念不包含下列何者？
  options:
  - label: A
    content: 凝聚族人的向心力
  - label: B
    content: 塑造族人的身分認同
  - label: C
    content: 傳承族人的傳統文化
  - label: D
    content: 參與集會保護部落權益。
  group_stem: "請閱讀以下文章，並回答問題：\n  莫拉克風災造成當時高雄縣甲仙鄉小林村覆滅，但倖存的「小林人」並未沉溺於傷痛，反而努力復振流逝的文化。部分倖存的族人移居杉林區日光小林社區，族人們在復振產業及文化中找回重新生存的價值，也在溯源中發現自己原來是大武壠族，而非泛稱的平埔族，對自己的根源有更深體認。日光小林社區自獲得高雄市文化局挹注經費後，開辦「大武壠族歌舞文化節」，作為重現文化溯源成果的舞臺，許多離鄉遊子也於此時重返故鄉相聚，傳承文化香火。也有一些部落青年返鄉，發表記載小林獨特工藝的專書用手說的故事，或者像大武壠族後裔徐銘駿一樣，從傳統植物的田野調查做起，探索先輩的生活智慧，完成種回小林村的記憶一書，並在「大武壠族歌舞文化節」中發表。\n\
    （資料來源：改寫自聯合報，2019/04/13）"
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 公民
      code: 6-1
