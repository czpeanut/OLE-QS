  stem: '郁恬和家人參加旅遊，聽導遊介紹阿里山鄒族人的庫巴制度，便隨手記錄下來，以下內容顯示出部落對原住民族有何種重要性？

    庫巴，是部落一個類似集會所的地方，除了舉行祭典、成年禮、鄒族男子在裡面學習狩獵技巧、進行軍事訓練外，當發生重大事件，也會聚集在此共同決定。即使到了現在，庫巴依舊是鄒族人重要的祭典聖地和精神象徵，繼續將鄒族文化傳承下去。'
  options:
  - label: A
    content: 凝聚族人的向心力
  - label: B
    content: 取代政府法治的規範
  - label: C
    content: 阻斷與其他族的互動
  - label: D
    content: 避免外族文化的侵擾。
