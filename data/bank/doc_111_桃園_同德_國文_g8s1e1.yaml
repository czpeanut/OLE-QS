- id: doc_111_桃園_同德_國文_g8s1e1_s3_3
  section: 3
  number: 3
  type: single
  page: 1
  stem: 在田園之秋選中，作者以貝多芬 田園交響曲的牧羊人之歌的「聽覺」印象來表達「視覺」印象，與下列哪一選項的手法相同？
  options:
  - label: A
    content: 陽光好亮，透過葉隙，叮叮噹噹擲下一大把金幣
  - label: B
    content: 蟬聲是一陣襲人的浪，不小心掉進小孩子的心湖
  - label: C
    content: 漫步在夕陽餘暉裡，晚景的溫存，就這樣被我偷嘗了不少
  - label: D
    content: 那低咽的簫聲，幽幽地，如同一隻到處漫遊、光焰微弱的螢火蟲。
  lesson_raw:
    title: 田園之秋選
    basis: 題目寫了課名
