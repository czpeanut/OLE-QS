- id: doc_111_桃園_同德_國文_g8s1e1_s3_4
  section: 3
  number: 4
  type: single
  page: 1
  stem: '「春天多細雨無聲，不走在雨中，不會有聽覺上的干擾。夏天的雨多如放聲嚎啕，傾盆而下，痛快淋漓，來得快，收得也快，不像冬天雨聲無休無止的纏繞。冬雨是可憐哀怨又於事無補的嘮叨，瑣碎卻不能有任何現況改善，最是煩人。」

    根據這段文字，下列敘述何者最恰當？'
  options:
  - label: A
    content: 春雨又細又輕，夏雨既急且驟
  - label: B
    content: 冬雨滂沱，傾盆而下，聲量最響
  - label: C
    content: 夏天雨聲淒切，如同無休無止的纏繞
  - label: D
    content: 走在冬雨中，會聽到人們哀怨瑣碎的嘮叨
  tags:
    textbook: 八上 第一課 田園之秋選
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
      code: 第一課
      title: 田園之秋選
      chapter: null
- id: doc_111_桃園_同德_國文_g8s1e1_s3_5
  section: 3
  number: 5
  type: single
  page: 1
  stem: 讀完陳冠學對西北雨的描述後，阿明自己也上網搜尋到一些相關資訊及民間俗諺。請問下列對照何者正確？
  options:
  - label: A
    content: 西北雨的霹靂猛烈，故有「雷聲大雨點小」的俗諺
  - label: B
    content: 西北雨是在夏季午後發生的，又稱之為「杏花雨」
  - label: C
    content: 西北雨來得快也去得快，降水強度大，有「死豹雨」之稱
  - label: D
    content: 西北雨影響區域具局部性，民間有「西北雨落不過田岸」的說法。
  lesson_raw:
    title: 田園之秋選
    basis: 題目寫了作者陳冠學
  tags:
    textbook: 八上 第一課 田園之秋選
