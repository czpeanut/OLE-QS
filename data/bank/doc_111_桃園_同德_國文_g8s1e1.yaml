- id: doc_111_桃園_同德_國文_g8s1e1_s3_26
  section: 3
  number: 26
  type: single
  page: 3
  stem: '某位老師向學生講述下文的用意，最可能是希望學生能夠學會什麼？

    農民問教授：「一個聾啞人到五金行買釘子，他先把左手的兩個指頭放在桌上，然後用右手做鎚釘的樣子。店員拿出鎚子，他搖搖頭，用右手指了指左手的兩個指頭；店員拿出釘子，他點點頭。這時，一個盲人走進來。先生，請您想一下，他會如何買到一把剪刀？」教授從容答道：「簡單。他只要伸出兩個指頭，模仿剪刀的樣子就可以了。」

    農民笑起來：「先生，他不需要這樣，盲人是會說話的。」 （改寫自郭亞維《哈佛校訓給大學生的24 個啟示》）'
  options:
