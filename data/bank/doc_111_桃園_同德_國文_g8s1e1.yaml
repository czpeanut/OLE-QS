- id: doc_111_桃園_同德_國文_g8s1e1_s3_30
  section: 3
  number: 30
  type: single
  page: 5
  stem: 根據本文內容，慈禧太后與其他后妃用餐的敘述何者正確?
  options:
  - label: A
    content: 慈禧太后與其他后妃經常同桌共食
  - label: B
    content: 當膳食足夠時，慈禧太后願意讓其他后妃先食用
  - label: C
    content: 皇后與其他后妃須等慈禧太后吃好方可用膳，且須謹守禮儀
  - label: D
    content: 與慈禧太后同桌時，皇后與其他后妃或坐或立，要看慈禧太后當天心情而定。
  group_stem: '孝欽后之飲食品 徐珂

    孝欽①喜食燒烤與醬及麥類，餅為炕餅、蒸餅、椒鹽餅、甜餅，亦有以肉為餡者，其式為龍形、蝶形、花形，又有大米小米粥、綠豆糕、花生糕帶甜湯，凡此種種，皆常膳所必備者也。米飯以玉田稻米為之，長及寸，有胭脂、碧粳②諸名。常膳必備粥，至五十餘種之多，稻梁菽麥無所不有。故每餐所耗輒需百金。

    御廚供膳，小菜俱盛以碟，如醃西瓜皮之類，亦燦然大備，其味精絕，聞別有泡製之方。

    大梨切為塊，以蜜漬之，尤為雋味，諸王大臣時蒙撤賜。孝欽晚年，時患咳，故以此代滋潤之品焉。

    水皆於玉泉山汲之，清洌異常，非泥沙俱下者所能比也。

    太后用膳畢，輒命皇后、宮妃等食之，然不得坐，惟立而餐之，且不敢言語。


    【注釋】①孝欽：清 慈禧太后的諡號。

    ②胭脂碧粳：指胭脂米與碧粳米，皆產自玉田'
  tags:
    textbook: 第三冊（八上）第1次段考範圍
