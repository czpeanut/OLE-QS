  stem: 關於迢迢牽牛星及慈烏夜啼二詩的說明，下列何者正確？
  options:
  - label: A
    content: 兩首詩皆為諷諭詩
  - label: B
    content: 兩首詩皆為古詩，且偶數句押韻
  - label: C
    content: 兩首詩因為年代久遠，作者皆不可考
  - label: D
    content: 兩首詩皆是站在第一人稱的角度表達心中感慨。
