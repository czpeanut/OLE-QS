- id: doc_111_桃園_同德_國文_g8s1e1_s3_27
  section: 3
  number: 27
  type: single
  page: 4
  stem: '等他們說完了，我忽然覺得驚訝不可置信，他們中間照我看來分成兩類，有一類說「我從前愛玩，不太用功，從現在起，我想要好好讀點書」，另一類說「我從前就只知道讀書，從現在起我要好好參加些社團，或者去郊遊」。

    奇怪的是，兩者都有輕微的追悔和遺憾。

    根據文中所述，下列何者正確?'
  options:
  - label: A
    content: 年輕人貪婪而不知足，只想不勞而獲
  - label: B
