- id: doc_111_桃園_同德_國文_g8s1e1_s3_2
  section: 3
  number: 2
  type: single
  page: 1
  stem: 下列選項所傳達的情感，何者與慈烏夜啼一詩中「聲中如告訴，未盡反哺心」最相近？
  options:
  - label: A
    content: 勞苦莫教爹娘受，憂愁莫教爹娘擔
  - label: B
    content: 樹欲靜而風不止，子欲養而親不待
  - label: C
    content: 身體髮膚，受之父母，不敢毀傷，孝之始也
  - label: D
    content: 今之孝者，是謂能養。至於犬馬，皆能有養。不敬，何以別乎？
  lesson_raw:
    title: 慈烏夜啼
