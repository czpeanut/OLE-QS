  section: 3
  number: 1
  type: single
  page: 1
  stem: 關於古詩的說明，下列何者錯誤？
  options:
  - label: A
    content: 古詩偶數句押韻且不能換韻
  - label: B
    content: 古詩在格律的要求上比近體詩寬鬆
  - label: C
    content: 古詩又稱古風，而近體詩又稱今體詩
  - label: D
    content: 古詩於漢代時已有作品出現，唐以後仍有文人創作古詩。
