- id: doc_111_桃園_同德_國文_g8s1e1_s3_8
  section: 3
  number: 8
  type: single
  page: 2
  stem: 「近年臺灣的鯨豚擱淺通報數量逐年升高，其中有一『場』令我印象深刻的報導：在臺東 長濱海灘發現一『宗』死亡多日、散發一『股』惡臭的魚屍，經過DNA 比對，研判牠是未成年藍鯨，最痛心的是牠的頭、頸均被多『枝』網繩纏繞，導致無法開口覓食，活活餓死。」上文『
    』中的量詞，何者使用最恰當？
  options:
  - label: A
    content: 場
  - label: B
    content: 宗
  - label: C
    content: 股
  - label: D
    content: 枝。
