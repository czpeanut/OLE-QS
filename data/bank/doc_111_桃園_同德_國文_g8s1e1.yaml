- id: doc_111_桃園_同德_國文_g8s1e1_s3_28
  section: 3
  number: 28
  type: single
  page: 4
  stem: 根據上文內容，下列敘述何者正確?
  options:
  - label: A
    content: 我們必須刻意，才能在回憶一件事時觸發另一件往事
  - label: B
    content: 在安德森的實驗裡，測試期間穿插怪異圖片，可增強對詞彙的記憶
  - label: C
    content: 「健忘的陰影」可解釋為何有些人經歷創傷遺忘後，對於日常生活事件的記憶力也較差
  - label: D
    content: 「當你開始回憶，心智的自動反應會試圖提供相關記憶，可是有時我們寧可不要想起那些往事。」因此要刺激海馬迴的活性，以減輕創傷後壓力疾患患者的痛苦。
  group_stem: '遺忘也可以學習嗎?

    看到熱鍋從爐子上掉落時，我們會下意識伸手去抓鍋子，但也會在手被燙傷之前縮回來。這是因為大腦的執行控制功能介入，中斷一連串的自動命令。近來有許多新證據顯示，當我們忽然想起往事時，大腦同樣會自動阻止我們回憶起當時的痛苦。

    記憶潛藏在大腦中相互連接的訊息網路，因此回憶一件事可能觸發另一件往事，並非我們刻意如此。英國 劍橋大學的神經科學家安德森（Michael Anderson）說：「當你開始回憶，心智的自動反應會試圖提供相關記憶，可是有時我們寧可不要想起那些往事。」

    還好我們並非無計可施。過去腦造影研究顯示，大腦額葉能抑制海馬迴（儲存記憶的關鍵構造）的活性，進而阻止自動提取記憶。最近安德森和同事進一步探究，抑制海馬迴會引發什麼結果。他們讓381
    名受試大學生閱讀兩兩一組的低相關配對詞彙，接著讓受試者觀看其中一個字，再要求他們回想、或不去回想另一個字，並在這些測試作業間穿插觀看怪異圖片，例如一隻孔雀出現在停車場。

    研究人員指出，如果受試者在觀看怪異圖片之前或之後，被要求避免回想所看到的詞彙，比起被要求回想詞彙的受試者，前者記憶圖片的能力降低約40%。

    這項研究結果意味大腦存在著記憶調控機制，也顯示避免回想特定記憶可能也會對一般記憶產生負面影響。研究人員稱這種現象為「健忘的陰影」，因為在海馬迴的活性降低時，回想不相關事件的能力也受到阻撓。這項研究結果可用來解釋為何有些人經歷創傷（並試圖遺忘）後，對於日常生活事件的記憶力也較差。

    安德森提到，如果先不管可能會導致暫時性失憶的後果，根據需求抑制記憶也許是可行的方法。他們推測，這類型提示也許能幫助一些人有效學習選擇性遺忘，特別是減輕創傷後壓力疾患（PTSD）患者的痛苦。

    （節錄自科學人雜誌）'
