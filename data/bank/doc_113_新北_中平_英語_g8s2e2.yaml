- id: doc_113_新北_中平_英語_g8s2e2_s2_22
  section: 2
  number: 22
  type: single
  page: 4
  stem: 7. What is the reading mainly about?
  options:
  - label: A
    content: Many girls can’t go to school after marriage.
  - label: B
    content: Most people in Taiwan get married young.
  - label: C
    content: Some children get married under the age of eighteen.
  - label: D
    content: Child marriage is a problem, and let’s do something about it.
  group_stem: '(C)

    Most people in Taiwan can choose who they want to marry. But in some countries,
    people cannot. Millions of children under the age of eighteen get married without
    a choice. Here are two stories:

    Geeta is a girl from Niger (尼日爾). She got married to a thirty-year-old man when
    she was only ten years old. Geeta had her first baby and became a mother at eleven.
    She could not go to school because she had to take care of her baby.

    Tanya, from Yemen (葉門), got married to a man at eleven because the man gave her
    father money. She cried and said "NO!", but nobody helped her. Her husband often
    hit her. She felt very scared and could not sleep at night. Her marriage was like
    a bad dream.

    Child marriage still happens in many countries. Children like Geeta and Tanya
    need our help. Let’s take action now!


     marriage 婚姻 take action 採取行動'
  tags:
    textbook: 第四冊（八下）第2次段考範圍
    labeled_by: ai
