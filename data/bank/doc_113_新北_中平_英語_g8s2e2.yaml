- id: doc_113_新北_中平_英語_g8s2e2_s2_16
  section: 2
  number: 16
  type: single
  page: 3
  stem: 1. Why is air pollution the worst?
  options:
  - label: A
    content: Because it hurts all living things.
  - label: B
    content: Because modern technology needs air.
  - label: C
    content: Because there is little we can do to fight air pollution.
  - label: D
    content: Because cars pollute the air less and less every year.
  group_stem: '(A)  Modern technology makes our lives easier, but it also creates
    different kinds of pollution.  Noise pollution hurts our ears and makes us angry
    more easily.  Water pollution makes rivers dirty.  Air pollution, however, is
    the most serious problem because it hurts all living things.

    Many countries are making new laws to stop pollution.  Governments ask factories
    to clean their dirty water. They also ask car makers to make better cars that
    cause less air pollution.  We can do many things to save the world.  For example,
    we should not buy water in plastic bottles because plastic hurts the Earth.  We
    should walk or ride a bike to school.  It is not too late to stop pollution.  Everyone
    must work together!


     pollution 汙染 serious 嚴重的 government 政府 pollute 汙染

    cause 造成 plastic 塑膠的 harm 傷害'
  tags:
    textbook: 第四冊（八下）第2次段考範圍
    labeled_by: ai
