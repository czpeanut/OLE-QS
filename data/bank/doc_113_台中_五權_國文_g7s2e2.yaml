  stem: 根據天堂與地獄一文，所謂的「天堂」應該要是什麼樣子，下列說明何者有誤？
  options:
  - label: A
    content: 建立目標
  - label: B
    content: 追逐理想
  - label: C
    content: 安和樂利
  - label: D
    content: 充實心靈
  group_stem: "（乙）\n  某人死後，靈魂來到一個地方，當他進門的時候，守門人對他說：「你不是貪吃嗎？這裡有的是東西隨你吃。你不是貪睡嗎？這裡睡多久也沒人打擾。你不是愛玩嗎？這裡有各種娛樂由你選擇。你不是討厭工作，不喜歡受拘束嗎？這裡保證沒有事做，更沒人管你。」\n\
    \  此人於是高高興興地留下來。吃完就睡，睡夠就玩，邊吃邊玩。但是三個月下來，他漸漸覺得有點不是滋味，於是跑去見守門人：「這種日子過幾天倒還不錯，但是時間長了，不見得好。因為玩得太多，我已經提不起什麼興趣；吃得太飽，使我身體不斷發胖；睡得太久，頭腦又變得遲鈍，您能不能給我一點工作，早晨催我起床啊！」\n\
    \  守門人搖搖頭：「對不起！這裡沒有工作，更沒人催你早起。」又過了三個月，這人實在太難受了，於是他又跑到守門人面前哭訴：「這種日子我實在受不了了，如果你再不給我工作，我寧願下地獄。」\n\
    \  「你以為這兒是天堂嗎？這裡本來就是地獄啊！」守門人大笑道：「它使你沒有理想、沒有創造、沒有前途，逐漸腐化，這種心靈的煎熬，要比上刀山下油鍋的皮肉之苦，更令人受不了啊！」\n\
    \                                                                     天堂與地獄  劉墉"
  tags:
    textbook: 第二冊（七下）第2次段考範圍
    labeled_by: ai
