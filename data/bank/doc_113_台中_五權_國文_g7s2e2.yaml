  stem: 孟子曰：「弈秋，通國之善弈者也。使弈秋誨二人弈，其一人專心致志，惟弈秋之為聽。一人雖聽之，一心以為有鴻鵠將至，思援弓繳而射之。雖與之俱學，弗若之矣。為是其智弗若與？曰：非然也。」上文所舉兩位資質相近的學生，在同一名師調教之下，結果成就卻有天壤之別。下列哪一項可以說明其中道理？
  options:
  - label: A
    content: 快馬也要響鞭催，響鼓也要重槌擂
  - label: B
    content: 為學正如撐上水船，一篙不可放緩
  - label: C
    content: 月缺不改光，箭折不改鋼
  - label: D
    content: 一心不能二用，先生不過引路人
  tags:
    textbook: 第二冊（七下）第2次段考範圍
    labeled_by: ai
