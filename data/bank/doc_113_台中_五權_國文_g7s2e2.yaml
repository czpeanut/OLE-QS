    content: 「月色入戶」與「水中藻荇交橫」皆是虛景描寫
  - label: C
    content: 「庭下如積水空明，水中藻荇交橫」這句話的解釋是:庭院裡的月光有如積水那樣澄澈清明，月光如水中似有水草交錯縱橫
  - label: D
    content: 蘇軾與張懷民兩人邂逅於承天寺，賞月品茗同遊甚歡
