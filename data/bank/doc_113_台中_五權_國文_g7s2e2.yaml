    \  在心理方面，心理學家視個人的情況而給予的個別指導和心理治療，仍然是個人學習應付壓力的最佳方法。\n  世上所謂的道德家、宗教家等，一味地大力鼓吹「嚴以律己」的思想，使人們把壓力生活視為正常。這往往造成身心的緊張。想要踏上成功的人生，首先要消除這種緊張感，達到身心的放鬆。即使緊張是天生的，也要靠人為的努力舒緩緊張。"
  tags:
    textbook: 第二冊（七下）第2次段考範圍
    labeled_by: ai
- id: doc_113_台中_五權_國文_g7s2e2_s2_38
  section: 2
  number: 38
  type: single
  page: 5
  stem: 讀完（子）、（丑）二文，哪一聯最能表現出宴席氣氛熱絡，眾人同樂的畫面？
  options:
  - label: A
    content: 首聯，畫面最豐富
  - label: B
    content: 頷聯，客人和主人歡喜相見。
  - label: C
    content: 頸聯，有酒有菜賓主盡歡
  - label: D
    content: 末聯：主人、客人與鄰舍共享酒菜
  group_stem: "（丁）\n （子）\n  舍南舍北皆春水，但見群鷗日日來。\n  花徑不曾緣客掃，蓬門今始為君開。\n  盤飧市遠無兼味，樽酒家貧只舊醅。\n\
    \  肯與鄰翁相對飲，隔籬呼取盡餘杯。\n\n   注釋：①蓬門：用蓬草編成的門。在此形容居室簡陋。②盤飧市遠無兼味：因為距離市集很遠，所以盤中的菜肴不豐盛。\n\
    \         ③樽酒家貧只舊醅：因為家境貧困，所以杯中只有舊釀的酒。樽，酒杯。醅，沒過濾的酒。\n          ④餘杯：剩餘的酒。杯，酒杯，這裡借代酒。\n\
    \                                                                            \
    \  客至  杜甫\n （丑）\n  杜甫的客至詩題後原有注解「喜崔明府相過」六字，「明府」乃唐人對縣令的尊稱，這位「崔明府」正是杜甫的舅舅，他在當年春天拜訪杜甫，親人的到訪，使詩人熱烈相迎，心情也隨之開懷。\n\
    \  詩中「舍南舍北」的所在處，為杜甫位於四川 成都 浣花溪畔築蓋的一間茅屋，史稱「浣花草堂」。安史之亂後，杜甫在這裡度過人生中最為安定的一段田園生活。\n\
    \  當親舅「崔明府」拜訪浣花草堂，杜甫在此已居住一年餘，詩中前兩句描寫家門前後春水圍繞，詩人終日徜徉山水鷗鳥之間，生活清寒卻也恬淡自適；其中「花徑不曾緣客掃，蓬門今始為君開」，說明杜甫居住此地往來人客之稀少，故一見親人到訪，興奮地趕緊清理庭院，打掃門前花草繁茂的小路。盛情的杜甫，雖極力想端出好酒好菜，招待這位至親稀客，但因草堂距離市集遙遠，未能多備菜肴，連既有的酒都是口感不好的舊時濁酒。最後，這頓粗糙簡單的筵席尚未結束，杜甫詢問客人，可願和隔壁老翁相飲一番，展現其敦厚親鄰的率真性情。全詩以第一人稱書寫，與杜甫其他憂國憫民、漂泊不定的時代史詩相比，客至呈現的是如話家常的田園風情，充滿淳樸的鄉居樂趣。"
  tags:
    textbook: 第二冊（七下）第2次段考範圍
    labeled_by: ai
