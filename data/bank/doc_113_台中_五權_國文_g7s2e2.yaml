- id: doc_113_台中_五權_國文_g7s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 仔細品味偉人的話可以讓我們獲得許多心靈的觸發，請問以下何者名言涵義說明有誤？
  options:
  - label: A
    content: 人生不是一支短短的蠟燭，而是一支由我們暫時拿著的火炬，我們一定要把它燒得十分光明燦爛，然後交給下一代的人們（蕭伯納）:強調生命的價值
  - label: B
    content: 一個驕傲的人，結果總是在驕傲裡毀滅了自己(莎士比亞):說明謙遜的重要
  - label: C
    content: 最盲目的服從乃是奴隸們所僅存的唯一美德(盧梭 ):應當培養正確的價值觀與判斷力
  - label: D
    content: 人不光是靠他生來就擁有一切，而是靠他從學習中所得到的一切來造就自己（歌德）:說明天賦與潛能的重要
  tags:
    textbook: 第二冊（七下）第2次段考範圍
    labeled_by: ai
