  group_stem: "（戊）\n山暝聽猿愁，滄江急夜流。\n風鳴兩岸葉，月照一孤舟。\n建德非吾土，維揚憶舊遊。\n還將兩行淚，遙寄海西頭。\n\n注：①桐廬江：即桐江，為錢塘江流經桐廬縣一帶的別稱。②廣陵：指揚州，今江蘇省揚州市。\n\
    \    ③舊遊：老朋友。④滄江：指桐廬江。滄，同「蒼」，形容水色蒼青。\n   ⑤建德：桐廬的鄰縣。這裡泛言桐廬、建德一帶江域。\n      ⑥吾土：我的家鄉。⑦維揚：揚州的別稱。⑧海西頭：指揚州。\n\
    \                                                           宿桐廬江寄廣陵舊遊 孟浩然"
