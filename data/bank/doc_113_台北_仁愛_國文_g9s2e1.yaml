    content: 置子女於別室，己坐亡者帳中待之。
  group_stem: "題組(三)\n    淮安 李姓者與妻某氏琴瑟調甚。李三十餘病亡，已殮矣。妻不忍釘棺，朝夕哭，啟而視之。故事：民間人死七日，則有迎煞之舉，雖至戚，皆迴避。妻獨不肯，置子女於別室，己坐亡者帳中待之。\n\
    \    至二鼓，陰風颯然，燈火盡綠。見一鬼紅髮圓眼，長丈餘，手持鐵叉，以繩牽其夫從窗外入。見棺前設酒饌，便放叉解繩，坐而大啖。每咽物，腹中嘖嘖有聲。其夫摩撫舊時几案，愴然長歎，走至牀前揭帳。妻哭抱之，泠然如一團冷雲，遂裹以被。紅髮神競前牽奪。妻大呼，子女盡至，紅髮神踉蹌走。妻與子女以所裹魂放置棺中，屍漸奄然有氣，遂抱至臥牀上，灌以米汁，天明而蘇。其所遺鐵叉，俗所焚紙叉也。復為夫婦二十餘年。\n\
    \    妻六旬矣，偶禱於城隍廟，恍惚中見二弓丁① 舁② 一枷犯至。眕③ 之所枷者，即紅髮神也。罵婦曰：「吾以貪饞故，為爾所弄，枷二十年矣！今乃相遇，肯放汝耶！」婦至家而卒。\n\
    （袁枚 子不語）\n\n☆註：① 弓丁：鬼卒 ② 舁：ㄩˊ，扛抬 ③ 眕：仔細看"
