- id: doc_113_台北_仁愛_國文_g9s2e1_s2_13
  section: 2
  number: 13
  type: single
  page: 1
  stem: 關於白樸沉醉東風漁父詞一曲,下列敘述何者正確?
  options:
  - label: A
    content: 「黃蘆岸白蘋渡口，綠楊堤紅蓼灘頭」呈現春天色彩繽紛、欣欣向榮的景致，呼應題目沉醉東風
  - label: B
    content: 「雖無刎頸交，卻有忘機友」，此二句描述作者感物思人，思念坦誠相待、沒有心機的知己好友
  - label: C
    content: 「點秋江白鷺沙鷗」一句，以白鷺、沙鷗自在飛舞，勾勒出動態的景觀，也寄託優游的閒情
  - label: D
    content: 「傲殺人間萬戶侯，不識字煙波釣叟」抒發作者雖為萬戶侯，卻想要寄情山水、淡泊名利的心境。
