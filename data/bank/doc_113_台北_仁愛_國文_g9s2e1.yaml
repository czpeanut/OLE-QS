  stem: 【甲】文中，「投壺」活動意義的演變趨勢是如何變化？
  options:
  - label: A
    content: 因受眾越來越少而式微，對後世影響不大
  - label: B
    content: 由正式禮儀演變為技術性與娛樂性的遊戲
  - label: C
    content: 由平民百姓的遊戲發展為貴族專屬活動
  - label: D
    content: 原為古代軍事訓練轉變為皇室儀式。
  group_stem: "題組(四)\n【甲】\n    「投壺」是中國古代的一種遊戲，源於六藝中的射禮，禮記傳中就提到：「投壺，射之細也。燕飲有射以樂賓，以習容而講藝也。」歐陽脩\
    \ 醉翁亭記中則講述了投壺時歡樂景象：「射者中，弈者勝，觥籌交錯，起坐而喧嘩」因為投壺具備「禮」的意味，所以主客間須請讓三次才能進行，而古時由於主人家庭院無法習射，後人便以投壺來象徵。\n\
    \    到了秦 漢時期，射禮逐漸式微，投壺儘管不再屬於嚴格的禮儀範疇，仍被視為一種高雅的遊戲。魏 晉時期，人們對投壺的器具進行改良，在壺口兩側增設貫耳，不僅提高了命中率，還衍生出多種投壺技巧，並發展成可供評比的競技活動。即便進入宋\
    \ 元時代，士大夫階層仍熱衷於此，但投壺已不再承載古禮精神，而是更偏向於技術性與娛樂性的展現。為了使其兼具教育意義，司馬光特別撰寫了投壺新格，對其名稱及計分規則進行重新規範。\n\
    \n【乙】\n司馬光 投壺新格的計分規則\n| 規則名稱 | 得分方式 |\n| --- | --- |\n| 有 初 | 以首箭中者，得十算 |\n| 連\
    \ 中 | 第二箭以下，連中不絕者皆五算 |\n| 貫 耳 | 耳小於口而能中之者十算 |\n| 全 壺 | 所射之箭皆中，不論得算幾何，皆為終勝。若角逐者俱全壺，則計算各方所得之算數。\
    \ |\n\n☆註：「算」是計分的單位；每人各射八箭為終。"
