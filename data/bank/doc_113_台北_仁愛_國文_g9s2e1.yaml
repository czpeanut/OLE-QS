    content: 「宮婦左右，莫不私王；朝廷之臣，莫不畏王；四境之內，莫不有求於王。」→仗義直言，據理力爭
  - label: B
    content: 「令初下，群臣進諫，門庭若市；數月之後，時時而間進；期年之後，雖欲言，無可進者。」→察納雅言，成效卓著
  - label: C
    content: 「燕、趙、韓、魏聞之，皆朝於齊。此所謂戰勝於朝廷。」→善用進攻，國力強盛
  - label: D
    content: 「吾妻之美我者，私我也；妾之美我者，畏我也；客之美我者，欲有求於我也。」→尊重歧見，體現人性。
