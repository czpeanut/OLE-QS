- id: doc_113_台北_仁愛_國文_g9s2e1_s3_39
  section: 3
  number: 39
  type: single
  page: 4
  stem: 根據文中的敘述，猶太人經過何歷程而被物化？
  options:
  - label: A
    content: 從性格批評到外貌醜化，最終成為物件
  - label: B
    content: 從一開始就被視為無價值的生命來看待
  - label: C
    content: 從外貌判定其性格，再標籤為害蟲非人類
  - label: D
    content: 因猶太人居高不下的犯罪率，成為全民公敵。
  group_stem: "題組(二)\n    毒素滲透語言，往往不知不覺，且比其他實體的事物更持久。戰後，一個集中營的守衛接受審判，在庭上他不自覺說出，自己負責看守的那十六「隻」囚犯，以及最後「腐屍利用」的處理過程。原本用於畜牧業的「腐屍利用」，成為集中營中通行的行政語言，進毒氣室前先剪頭髮，大把剪下的頭髮織成軍毯，有其實用價值。\n\
    \    要在幾年內殺光歐洲的猶太人，最困難的不是毒氣室等硬體夠不夠，而是執行者的心理素質，一旦讓盡忠職守的人相信，他手上待處理的只是「物件」，而非有靈魂的人，齒輪便得以運轉起來。集中營裡的屠殺字眼不用「幹掉」，而用「結清」。「結清」是商業用語，就像當今的網路購物，最後總會回到購物車結清、歸零，下次繼續。\n\
    \    讓人成為物件，需要潛移默化的工夫。物化之前，是成為害蟲，卡夫卡的變形記像世紀災難前先寫定的讖言。在元首呼告式的演講中，猶太人首先成為猶太小人，是德國童話裡駝背小人的變形，帶來厄運的象徵。猶太小人偷偷摸摸、鬼鬼祟祟，那身影逐漸具象化，成了傳染黑死病的老鼠，獐頭鼠目的傳單貼滿大街小巷。\n\
    \    將猶太人的「變形記」倒推回去：在被焚毀的物件之前，是吸血扁蝨與黑死病疫鼠；在害蟲之前，是猶太小人；在搗蛋的惡精靈之前，是扁平足、歪鼻子的劣質皮囊；在醜陋的外表之前，是狡滑、刁鑽、說謊、懦弱的性格。\n\
    \    「狡猾、刁鑽、說謊、懦弱」出現於一九三三年希特勒剛上台的說詞，猶太人尚且還是個「人」，是帶著性格缺陷，行事卑鄙之人，這是醜化的開端，不太嚴重的「批評」，也常出現在當今台灣的選舉攻擊語言裡。在納粹\
    \ 德國的初始，有誰看得到包藏的禍心。\n（節選自房慧真 太初有字）"
