- id: doc_113_台北_仁愛_國文_g9s2e1_s2_15
  section: 2
  number: 15
  type: single
  page: 1
  stem: 詩人渡也的石滬一詩展現作者獨有的觀察力，在平凡的事物中賦予獨到的見解，下列關於詩的文意，何者說明正確？
  options:
  - label: A
    content: 「一生第一次上岸，也是最後一次」表示魚如壯士斷腕，能夠當機立斷遠離危險，最後卻一失足成千古恨
  - label: B
    content: 「上岸的魚／最後的眼神／我無法救援」石滬是受人擺布的工具，即使想為魚有所作為，也無可奈何
  - label: C
    content: 「水／不遠千里游來／游去／魚也不遠千里游來」大海與魚群在潮起潮落的石滬間優游，來去全不受限
  - label: D
    content: 「漁夫把大海縮小／藏在心型石滬心中」大海是石滬命運的幕後黑手，將石滬妝點得應有盡有，等待魚挖掘。
