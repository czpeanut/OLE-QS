  section: 4
  number: 3
  type: single
  page: 1
  stem: 余光中的〈戲李白〉一文中「你曾是黃河之水天上來／陰山動／龍門開／而今黃河反從你的句中來／驚濤與豪笑／萬里滔滔入海」根據詩意，作者為何說「而今黃河反從你的句中來」？
  options:
  - label: A
    content: 李白多次將黃河寫進自己的作品中，於後人心中形塑鮮明的黃河印象
  - label: B
    content: 李白的人生際遇巔峰，幾乎都在黃河流域附近活動，使李白永生難忘
  - label: C
    content: 黃河流水不捨晝夜的奔流，常讓李白想到人應該要及時行樂，秉燭夜遊
  - label: D
    content: 李白的創作靈感，就像黃河的流水奔騰到大海，雖然充沛但也容易消逝
  lesson_raw:
    title: 戲李白
    basis: 題目寫了課名〈戲李白〉與作者余光中
  answer:
  - A
