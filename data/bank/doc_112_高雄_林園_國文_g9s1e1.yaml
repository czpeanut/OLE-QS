  stem: 下列詩句歌詠的對象為歷史人物，哪個選項的配對是正確的？
  options:
  - label: A
    content: 車子已開出成都路／猶聞浣花草堂的吟哦不絕／再過去是白帝城，是兩岸的猿嘯／從巴峽而巫峽心事如急流的水勢／一半在江上／另一半早已到了洛陽➡李白
  - label: B
    content: 放逐夜郎也罷，泛舟洞庭／出三峽去聽那哀絕的猿聲也罷／人在江湖，心在江湖／江湖注定是你詩中的一個險句➡杜甫
  - label: C
    content: 群山萬壑赴荊門，生長明妃尚有村。一去紫臺連朔漠，獨留青塚向黃昏➡王昭君
  - label: D
    content: 一代傾城逐浪花，吳宮空自憶兒家。效顰莫笑東村女，頭白溪邊尚浣紗➡楊貴妃
  answer:
  - C
