  stem: 下列有關「江」、「河」的成語，哪一個運用正確？
  options:
  - label: A
    content: 宥廷做事謹慎小心，總是「江心補漏」提早規劃，往往都能順利達成任務
  - label: B
    content: 這家公司的創辦人堅持不斷求進步的理念，使得公司營運狀況「江河日下」
  - label: C
    content: 近年來台灣傳統市場客人如「過江之鯽」不斷流失，攤販感嘆賺錢不容易
  - label: D
    content: 品叡憑著「暴虎馮河」的勇力就挑戰攀登玉山，最後因沒有專業裝備而落難
  answer:
