- id: doc_112_高雄_林園_國文_g9s1e1_s5_9
  section: 5
  number: 9
  type: single
  page: 5
  stem: 根據文章，使用抖音這項應用程式，用戶的什麼行為最有可能會讓國家的軍事情報被洩漏？
  options:
  - label: A
    content: 點按特製惡意連結
  - label: B
    content: 自拍個人影片上傳
  - label: C
    content: 輸入信用卡資訊
  - label: D
    content: 點閱誤導性影片
  group_stem: '台灣須正視抖音資訊安全疑慮

    美國智庫彼得森國際經濟研究所2019 年曾警告，TikTok（抖音）在美國年輕軍人間非常活躍，他們上傳的自拍短影片常無意間揭露自己的個資（如名牌ID tag）、身處環境的軍事設施、戰場環境等。由於TikTok
    會將用戶個資傳到中國，恐有洩露軍事情報的風險。

    2020 年蘋果公司舉辦的全球開發者大會上，更有資安專家揭露TikTok 會偷偷讀取iPhone 的剪貼簿；同年還有Google和推特的工程師發現，TikTok
    在內建的瀏覽器有鍵盤側錄程式，會記錄用戶在內建瀏覽器輸入的密碼、信用卡資訊等敏感資訊。韓國廣播通信委會也表示，TikTok 會非法蒐集14 歲以下的兒童個資，並轉移至海外。

    TikTok 蒐集用戶個資並送入北京的行為不僅被外媒揭露，也受到美國調查機構關注。美國 印第安那州檢察官辦公室去年12 月公開指出，中國政府能接觸到TikTok
    用戶的敏感資訊，並將網路上性行為、吸毒等不當內容推播給兒童，基於違反州消費者保護法起訴TikTok。

    營運TikTok 的公司「字節跳動」也發生內部員工不當蒐集用戶個資的爭議。2022 年，字節跳動一項內部調查發現，內部稽核與風險部門有4 名員工不當存取美國用戶的數據，其中包括兩名記者的IP
    位址、聯絡紀錄。雖然這4 名員工已遭到解雇，該部門也因此重整，但TikTok 員工取得用戶個資的行為仍受到外界擔憂。

    TikTok 另一疑慮是存在高危險性的安全漏洞。2022 年微軟發現，TikTok 存在編號為「CVE-2022-28799」的安全漏洞，使用者只要點選一個特製惡意連結，駭客就能進入使用者的帳號，存取或竄改使用者的檔案與機密資訊，例如公布私人影片、自行傳送訊息或上傳檔案。目前這個漏洞已被TikTok
    修復。

    TikTok 還有不實訊息的問題。美國新聞可信度評分工具《新聞守門人》曾發布報告指出，如果在TikTok 上搜索「烏克蘭」、「俄羅斯」、「戰爭」等關鍵字，前20
    項結果中存在虛假、誤導性影片，是俄羅斯宣傳的不實訊息。

    然而TikTok 蒐集用戶個資的行為，與Google、Meta 有何不同？曾任資策會資安所所長的台大電機系教授林宗男解釋，Google、Meta 蒐集用戶數據的行為有受到法律規範，也有在隱私政策中清楚告知用戶蒐集的個資項目及目的。且在西方自由世界，公家機關和一般企業有清楚分界。但TikTok
    是中國公司，中國政府有權要求TikTok 交出用戶個資，這是TikTok 和Google、Meta 最大的不同。

    （改編自 今周刊 2023-03-16 發佈〈抖音資安爭議連環爆，台灣政府卻慢半拍！資安專家：僅有行政院禁用完全不夠〉）'
  answer:
  - B
