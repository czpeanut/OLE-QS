    TikTok 還有不實訊息的問題。美國新聞可信度評分工具《新聞守門人》曾發布報告指出，如果在TikTok 上搜索「烏克蘭」、「俄羅斯」、「戰爭」等關鍵字，前20
    項結果中存在虛假、誤導性影片，是俄羅斯宣傳的不實訊息。

    然而TikTok 蒐集用戶個資的行為，與Google、Meta 有何不同？曾任資策會資安所所長的台大電機系教授林宗男解釋，Google、Meta 蒐集用戶數據的行為有受到法律規範，也有在隱私政策中清楚告知用戶蒐集的個資項目及目的。且在西方自由世界，公家機關和一般企業有清楚分界。但TikTok
    是中國公司，中國政府有權要求TikTok 交出用戶個資，這是TikTok 和Google、Meta 最大的不同。

    （改編自 今周刊 2023-03-16 發佈〈抖音資安爭議連環爆，台灣政府卻慢半拍！資安專家：僅有行政院禁用完全不夠〉）'
  answer:
  - 這篇新聞可信度高，因為有確切的日期、消息來源且證據多元充足。
