  type: single
  page: 1
  stem: 余光中的〈戲李白〉一文中「那轟動匡 廬的大瀑布／無中生有／不止不休／可是你傾側的小酒壺」詩句中「無中生有」的含義為何？
  options:
  - label: A
    content: 李白微醺之下，寫出「君不見黃河之水天上來，奔流到海不復回」的名句
