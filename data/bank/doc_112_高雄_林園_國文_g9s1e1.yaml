  stem: 關於這闋詞的說明，下列敘述何者正確？
  options:
  - label: A
    content: 「青玉案」是題目，「元夕」是詞牌
  - label: B
    content: 這闕詞分兩段，有上下片
  - label: C
    content: 這闋詞總共有67 個字，屬於中調
  - label: D
    content: 這闋詞押平聲「ㄨ」韻
  group_stem: "青玉案元夕①    辛棄疾\n  東風夜放花千樹②，更吹落、星如雨③。寶馬雕車④香滿路。鳳簫⑤聲動，玉壺⑥光轉，一夜魚龍⑦舞。  蛾兒雪柳黃金縷⑧，笑語盈盈暗香去。眾裡尋他千百度，驀然回首⑨，那人卻在，燈火闌珊⑩處。\n\
    【注釋】\n① 元夕：正月十五日元宵節的夜晚。\n② 花千樹：指花燈繁多如千樹開花。\n③ 星如雨：指煙火紛紛，如雨亂落。\n④ 寶馬雕車：豪華的馬車。\n\
    ⑤ 鳳蕭：泛指簫或排簫。\n⑥ 玉壺：指月亮。\n⑦ 魚龍：指魚形、龍形的燈籠。\n⑧ 蛾兒雪柳黃金縷：古代婦女配戴的各種裝飾品。\n⑨ 驀然回首：忽然回頭。\n\
    ⑩ 燈火闌珊：形容燈光稀落、微暗的樣子。"
  answer:
  - B
  answer_source: answer_key_vlm
