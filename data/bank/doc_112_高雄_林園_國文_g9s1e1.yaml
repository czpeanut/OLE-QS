  stem: 「但是長久以來所累積的經驗法則也告誡過我們『免費的最貴』，這是屢試不爽的硬道理，所以美好的人生真的可以透過這種媒體型態的改變來獲得嗎？」這段文字的涵義，與下列何者最接近？
  options:
  - label: A
    content: 新興媒體的免費訊息，可以幫助人們創造更美好的生活經驗
  - label: B
    content: 人們在獲得社群媒體的免費訊息時，不知不覺地接受其支配
  - label: C
    content: 唯有設計出昂貴的社群媒體，人們才願意花時間大量地瀏覽
  - label: D
    content: 新型態媒體打破「免費的最貴」經驗法則，人們更願意嘗試
  group_stem: "養成新聞判斷力，迎向更美好的生活（節錄） 黃俊儒\n這真是多采多姿的年代，每天我們都有看不完的訊息，學習不完的知識，不僅很多都是免費的，還會自己搶著送上門。你高興訂閱什麼粉絲頁就訂閱什麼粉絲頁，你高興加誰好友就加誰好友。相較於過往訊息容易被少數主流媒體壟斷，這個時代的新媒體概況，似乎提供了某種救贖，讓我們獲得了解放。但是長久以來所累積的經驗法則也告誡過我們「免費的最貴」，這是屢試不爽的硬道理，所以美好的人生真的可以透過這種媒體型態的改變來獲得嗎？相信所有深諳社群媒體背後那套演算法運作的人，應該都不會這麼樂觀，因為這些無所不在的社群媒體網絡，正在用一套全新的模式支配我們每個人對於訊息的獲得。\n\
    \  每當時序進入冬天，臺灣的空氣就開始變得不忍卒「聞」，汙穢的氣流不時盤旋在臺灣的上空。有一天，透過LINE 群組，我接到了朋友傳來一則關懷簡訊：「快通知北部親友①趕緊關窗，中南部也要，因霾害嚴重。」不僅如此，內容還寫道：「②中研院\
    \ 陳伶志博士表示，這波主力在晚上九點登陸北部，約凌晨兩點會到臺中，約五點會到臺南、高雄一帶，嚴格來說今晚③全臺都會被影響到。」最後更提醒：「這幾天最好④戴口罩！」過了不久，另一個親戚群組也傳來了一模一樣的簡訊。總之，在幾天之內，我總共收到了三次同樣的訊息。\n\
    \  這串充滿愛與關懷的簡訊到底有什麼問題？它的問題很簡單，就是它沒有說明「晚上」指的是哪一天晚上！我平時很關心空氣品質的訊息，所以當我第一次收到簡訊時，我知道它已經距離陳博士所說的「那天」三天了。"
  answer:
  - B
