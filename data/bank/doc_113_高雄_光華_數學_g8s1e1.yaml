- id: doc_113_高雄_光華_數學_g8s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '小光與小華想要利用公式算出 $999^{2}$ 的值，兩人的做法如下：

    小光：$999^{2}＝(1000-1)^{2}＝1000^{2}-2 \times 1000 \times 1+1^{2}$

    小華：$999^{2}＝999^{2}-1^{2}+1^{2}＝(999+1)(999-1)+1^{2}$

    如果小光與小華接下來的計算都沒有錯誤，則下列敘述何者正確？'
  options:
  - label: A
    content: 兩人的做法都對
  - label: B
    content: 只有小光做對
  - label: C
    content: 只有小華做對
  - label: D
    content: 兩人都不對
