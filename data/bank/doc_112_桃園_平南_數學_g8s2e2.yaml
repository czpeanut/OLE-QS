- id: doc_112_桃園_平南_數學_g8s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '右圖為五邊形公園，公園管理處規劃在內部設置一座涼亭，設置原則為「使涼亭到最多民眾散步的兩條步道 $\overline{BC}$ 、$\overline{CD}$
    之距離相等，且到洗手間 B、E 兩處的距離亦相等。」以下為鄧全、小訓與雨彤的建議方案，判斷他們的建議方案是否符合設置原則。


    小訓：「我知道 ! 找出$\angle BAE$的角平分線與 $\overline{BD}$ 的中垂線，兩直線的交點就是涼亭的最佳位置。」

    雨彤：「你說錯了啦 !是找出$\angle BCD$的角平分線與 $\overline{BE}$ 的中垂線，兩直線的交點才是涼亭的最佳位置。」

    鄧全：「你們都說錯了!明明就是找$\angle BAE$的角平分線與 $\overline{BE}$ 中垂線的交點!」


    問：三人的建議方案，誰才是符合設置原則？'
