- id: doc_112_桃園_平南_數學_g8s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '下列 正確 敘述有幾個？


    甲、角平分線上任一點到此角兩邊的距離相等

    乙、兩個直角三角形在兩股對應相等的條件下必全等

    丙、若兩個三角形的面積相等，則這兩個三角形也會全等

    丁、等腰三角形頂角的角平分線，也會是底邊的中垂線

    戊、若一點到某線段兩端點的距離相等，則此點會在該線段的垂直平分線上'
  options:
  - label: A
    content: 1個
  - label: B
    content: 2個
  - label: C
    content: 3個
  - label: D
    content: 4個
  tags:
