- id: doc_112_桃園_平南_數學_g8s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '下列 錯誤 敘述有幾個？


    甲、兩個等腰直角三角形必全等

    乙、五邊形的每一個外角都會相等

    丙、三角形有2個內角相等，此三角形必為等腰三角形

    丁、判斷兩個三角形的全等性質有五種，分別是 SSS、SAS、RHS、AAA 及ASA。

    戊、兩個三角形在SSA的條件下，若該對應角是直角時，則這兩個三角形必全等。'
