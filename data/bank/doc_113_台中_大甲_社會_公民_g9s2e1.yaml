- id: doc_113_台中_大甲_社會_公民_g9s2e1_s1_39
  section: 1
  number: 39
  type: single
  page: 3
  stem: 我們如果要想將此篇文章結合公民所學的，下列哪一個公民的議題最可以配合？
  options:
  - label: A
    content: 發展資訊科技而帶來的利益
  - label: B
    content: 資訊公開可能侵犯個人隱私
  - label: C
    content: 閱聽人應該培養媒體識讀的能力
  - label: D
    content: 強勢文化擴張。
  group_stem: '台大新研所教授王泰俐，針對去年縣市長選舉(2018 九合一地方選舉)，辨識假新聞的研究調查發現，女性選民，辨別假新聞能力，比男性差，而年齡與假新聞辨識度，則呈正比關係，越年輕的選民，愈不容易判斷新聞真偽。另外，以收入來看，月收入
    5 到 10 萬的選民中，有高達六成一，可判斷新聞真偽，月入一萬元以下，只有三成七。

    世新大學兼任客座教授彭懷恩說：「強烈政黨認同的這些人是不會受這個外來資訊的影響的，的確是有比較弱的政黨認同，或者是中間選民他們會是受政治訊息的影響。」

    為防堵假新聞，府院總動員。蔡總統日前親自督軍，要求各部會積極迅速澄清，更宣示修法重罰，行政院更成立「行政院防制假訊息危害工作小組」討論修法。

    行政院發言人 Kolas Yotaka 說：「我們現在並不是另訂新法或是專法，現在法律已經明訂的違法行為，加重他的刑責或罰則。」

    不過學者警告，假新聞查證不易，用國家機器管制、防堵，尺度沒拿捏好，恐淪為打擊新聞與言論自由的工具。

    資料來源：2019/03/18 公視新聞網'
