  section: 1
  number: 14
  type: single
  page: 1
  stem: 若一個籃球急速撞擊到同樣在空中的足球，下列敘述何者正確？
  options:
  - label: A
    content: 足球比籃球輕，故足球所受的撞擊力比籃球大
  - label: B
    content: 速度快的物體所受的撞擊力比較大
  - label: C
