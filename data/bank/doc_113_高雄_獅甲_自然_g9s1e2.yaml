  section: 1
  number: 8
  type: single
  page: 1
  stem: 若同一物體在月球上重量僅為在地球上重量的$\frac{1}{6}$，今不計空氣阻力、摩擦力，欲使同一物體產生相同的加速度，則月球上與地球上所需的施力比為
  options:
  - label: A
    content: 1：1
  - label: B
    content: 1：6
  - label: C
    content: 6：1
  - label: D
    content: 36：1。
- id: doc_113_高雄_獅甲_自然_g9s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 甲物的質量為3 公斤，施力使其產生1 公尺／秒$^{2}$的加速度，若施相同大小的力作用於質量為2 公斤的乙物時，則乙物產生的加速度為多少公尺／秒$^{2}$？
  options:
  - label: A
    content: '3'
  - label: B
    content: '2'
  - label: C
    content: '1.5'
  - label: D
