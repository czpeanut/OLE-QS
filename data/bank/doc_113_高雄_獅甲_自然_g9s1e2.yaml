questions:
- id: doc_113_高雄_獅甲_自然_g9s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 物體的質量一定時，在光滑平面上受到外力作用，物體所產生的加速度和外力的大小關係如何？
  options:
  - label: A
    content: 成反比
  - label: B
    content: 成正比
  - label: C
    content: 質量固定，加速度也固定
  - label: D
    content: 兩者無相關。
- id: doc_113_高雄_獅甲_自然_g9s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 一物體受數個力作用而產生加速度運動，則下列何者正確？
  options:
  - label: A
    content: 物體的速度方向必與合力方向相同
  - label: B
    content: 物體的速度方向必與合力方向互相垂直
  - label: C
    content: 物體的加速度方向與合力方向互相垂直
  - label: D
    content: 物體的加速度方向必與合力方向相同。
- id: doc_113_高雄_獅甲_自然_g9s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 在光滑無摩擦力的水平面上，有質量相同的甲、乙、丙三物體，甲為靜止，乙以3 公尺／秒等速度向北運動，丙以5 公尺／秒等速度向南運動，則甲、乙、丙三物體受到的外力大小比較？
  options:
  - label: A
    content: 甲＝乙＝丙
  - label: B
    content: 甲＞乙＝丙
  - label: C
    content: 甲＜乙＝丙
  - label: D
    content: 甲＜乙＜丙。
- id: doc_113_高雄_獅甲_自然_g9s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 手推車上放一裝滿水的水桶，以一固定的力推動手推車產生加速度運動。若此水桶底部有一小孔不斷漏水，整體重量逐漸變輕，則手推車的加速度有何改變？
  options:
  - label: A
    content: 固定不變
  - label: B
    content: 愈來愈小
  - label: C
    content: 愈來愈大
  - label: D
    content: 恆等於零。
- id: doc_113_高雄_獅甲_自然_g9s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 牛頓（N）是一種力的單位，下列哪一個也是力的單位？
  options:
  - label: A
    content: m
  - label: B
    content: kg
  - label: C
    content: kgw‧m／s$^{2}$
  - label: D
    content: kg‧m／s$^{2}$。
- id: doc_113_高雄_獅甲_自然_g9s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 汽車的安全氣囊是利用什麼原理減少身體受到的衝擊力？
  options:
  - label: A
    content: 使運動速度迅速降低，衝擊力較小
  - label: B
    content: 安全氣囊摩擦力大，衝擊力小
  - label: C
    content: 安全氣囊質量小，衝擊力小
  - label: D
    content: 增加緩衝時間，使加速度減小。
