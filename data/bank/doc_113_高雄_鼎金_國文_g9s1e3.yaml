  group_stem: '有一天，有個貧窮的鄰居偷了羅可家一隻雞，悄悄殺了，煮了一鍋燒酒雞，準備大快朵頤。

    羅可知道以後，拎了一壺酒到那個偷雞的窮人家裡，向窮人道歉說：「我們住同一個鄉里，我不能把雞煮好了，請你來吃，還要麻煩你自己動手，真是不好意思，我特地帶一壺酒來向你道歉。」說完了，把酒放到桌上，請鄰居叫妻子小孩一塊兒坐上桌，大家高高興興的飽餐一頓，喝得十分盡興，才告辭而歸。

    別人做了對不起我們的事，我們當然有權利大聲責備別人，可是如果我們能跟晉代的羅可學習，用開闊的心胸去原諒別人，那我們就可以成大功、做大事了。

    （殷登國 寬容）'
