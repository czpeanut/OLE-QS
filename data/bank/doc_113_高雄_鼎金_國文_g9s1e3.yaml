- id: doc_113_高雄_鼎金_國文_g9s1e3_s2_46
  section: 2
  number: 46
  type: single
  page: 5
  stem: 根據下圖，若Ｙ軸是「價值」，依照文意，Ｘ軸應填入下列何者最適合？
  options:
  - label: A
    content: 孤單
  - label: B
    content: 學習
  - label: C
    content: 長壽
  - label: D
    content: 合群。
  group_stem: '「……有一天，海鷗強納森．李文斯敦，你會知道不負責任的後果。鳥的一生是未知且不可知的，唯一確定的是我們生出來就是為了吃，而且活得越久越好。」

    海鷗是絕不會在議會上回嘴的，可是強納森卻拉高了嗓門。「不負責任？我的天啊！」他吼道，「一隻找到生活意義且追求更崇高目標的海鷗，有誰比他更負責任？一千年來，我們成天都在翻找魚骨頭，但現在我們有生存的理由了—為了有所發現，為了自由自在！給我一個機會，讓我為你們展示我的發現……」鳥群怒不可遏。

    「我們的情誼已經毀了。」他們異口同聲說，並不約而同的閉起耳朵，轉身背對他。

    海鷗強納森過著孤單的日子，不過他飛到比遠端山崖更遠的地方去。他並不為孤單而難過，他難過的是其他海鷗拒絕相信飛行的光榮正等著他們；他們拒絕睜開眼睛去看。

    每天他都學到更多。他學到流線型的高速俯衝可以使他捕捉到海面十呎下方成群集結的魚，而這些魚既稀有又美味。他不再需要靠漁船而活和吃不新鮮的麵包。他學會在半空中休憩，在夜晚定下航向穿過海風，從日落到日出飛上一百哩。靠著內在的控制，他飛過海上的濃霧，爬行到濃霧上方、清澄得令人炫目的天空；而同時其他的海鷗都站在地面上，呆望著雨霧，一無所知。他學會乘風飛到內陸深處，在那裡吃美味的昆蟲。

    他原本希望鳥群能得到的一切，現在由他獨享。他學會飛行，而且並不為他必須付出的代價感到懊惱。海鷗強納森發現，海鷗的生命如此短暫是因為乏味、懼怕和氣憤。只要不去想這些，他就可以享有美妙又長壽的一生。

    （曾琳之 今周刊）'
