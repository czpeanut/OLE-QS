    content: 師父讓師妹獨自往光明頂挑戰眾門派高手，萬一有個「長短」，該如何是好
  - label: B
    content: 棒球好不好玩？如人飲水，「冷暖」自知。你只要拿著球棒上場即能見分曉
  - label: C
    content: 以色列和周遭阿拉伯國家的「恩怨」頗深，期盼短時間內化解，實在不容易
  - label: D
    content: 上了國中後，回想起國小在海邊就讀的逍遙時光，依舊令我難以「忘懷」。
