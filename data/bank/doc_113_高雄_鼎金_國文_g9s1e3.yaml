  group_stem: '(一) 滾滾長江東逝水，浪花淘盡英雄。是非成敗轉頭空，青山依舊在，幾度夕陽紅。 白髮漁樵江渚上，慣看秋月春風。一壺濁酒喜相逢，古今多少事，都付笑談中。
    （三國演義卷頭詞 臨江仙）

    (二) 大江東去，浪淘盡，千古風流人物。故壘西邊，人道是，三國 周郎赤壁。亂石崩雲，驚濤裂岸，捲起千堆雪。江山如畫，一時多少豪傑？ 遙想公瑾當年，小喬初嫁了，雄姿英發，羽扇綸巾。談笑間，強虜灰飛煙滅。故國神遊，多情應笑我，早生華髮。人間如夢，一尊還酹江月。
    (蘇軾 念奴嬌赤壁懷古)'
