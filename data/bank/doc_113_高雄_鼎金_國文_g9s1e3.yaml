  section: 1
  number: 17
  type: single
  page: 2
  stem: 「臺灣海峽黑水溝的形成是受地形影響，使水流加速，最快可達每秒四公尺。當湍急的水流帶走水中的沉積與雜屑，海水少了許多反射陽光的雜質，使光線能貫穿深處，所呈現的色澤就如墨黑般的深藍。」根據這段文字，下列敘述何者最恰當？【110
    教育會考】
  options:
  - label: A
    content: 海水的雜質含量與水流速度無關
  - label: B
    content: 海水的流速變慢，顏色就會變深
  - label: C
    content: 黑水溝的流速至少為每秒四公尺
  - label: D
    content: 黑水溝的水較清澈，透光性較佳。
  tags:
    chapter:
      publisher: 康軒
      book: 九上
      subject: 國文
      code: 自學課二
      title: 大明湖
      chapter: null
