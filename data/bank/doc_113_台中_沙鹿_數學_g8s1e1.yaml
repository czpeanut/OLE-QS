  section: 1
  number: 10
  type: single
  page: 1
  stem: '有四位同學想要算出 $8.5^{2}$ 的值，他們的方法如下：

    小安：$8.5^{2}=(8+0.5)^{2}=8^{2}+2 \times 8 \times 0.5+0.5^{2}$

    小芸：$8.5^{2}=\left(\frac{17}{2}\right)^{2}=\frac{17^{2}}{2^{2}}$

    阿志：$8.5^{2}=8^{2}+0.5^{2}$

    阿岳：$8.5^{2}=(9-0.5)^{2}=9^{2}-2 \times 9 \times 0.5+0.5^{2}$

    如果這四人接下來都沒有計算或其他方面的錯誤，那麼誰的答案是不正確的？（原卷有誤，已修正）'
