- id: doc_113_高雄_英明_自然_g9s1e1_s2_50
  section: 2
  number: 50
  type: single
  page: 7
  stem: '毛毛參加金門旅行，遊覽了許多景點。其中當地導遊介紹了一種岩石「流紋岩」，其化學性質與花岡岩十分接近。毛毛近距離觀察流紋岩後發現，流紋岩組成顆粒細小，也不像花岡岩可以明顯觀察到組成礦物顆粒間彼此緊密鑲嵌在一起。上網查了資料後，發現流紋岩與花岡岩卻被歸類在同一種岩類。而後，毛毛還參觀了翟山坑道，坑道內主要以花岡片麻岩為主，仔細觀察可見有玄武岩如葉脈般，貫穿其中。

    根據上述內容，判斷下列關於「流紋岩」的敘述何者是合理的？'
  options:
  - label: A
    content: 屬於火成岩，因其組成顆粒較花岡岩小，推測可能是岩漿冷卻速度較快而形成
  - label: B
    content: 屬於變質岩，顆粒細小且成分近似花岡岩，推測是花岡岩受變質作用而形成
  - label: C
    content: 屬於沉積物，顆粒細小且成分近似花岡岩，推測是花岡岩受河流的地質作用後，最後沉積下來的
  - label: D
    content: 屬於沉積岩，顆粒細小且成分近似花岡岩，推測是花岡岩受外營力的地質作用，最後再壓密膠結形成。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 地科
      code: 5-3
      title: 岩石與礦物
      chapter: 第5章 地球的環境
    textbook: 九上地科 5-3 岩石與礦物
    labeled_by: ai
