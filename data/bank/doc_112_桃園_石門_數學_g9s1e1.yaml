- id: doc_112_桃園_石門_數學_g9s1e1_s2_3
  section: 2
  number: 3
  type: calc
  page: 4
  stem: (1) 請幫小頌找出另外不同的 3 組相似三角形？（3 分）
  group_stem: '2. 小頌在複習國中數學第五冊 1-3 縮放與相似時，請教老師一題有趣的題目，題目是：


    如右圖，$\square ABCD$ 中，E 點在 $\overleftrightarrow{CD}$ 上，$\overline{BE}$ 分別交 $\overline{AC}$、$\overline{AD}$
    於 G、F 兩點，若 $\overline{AF}：\overline{FD}＝1：2$，求 $\overline{EF}：\overline{FG}：\overline{BG}＝$？


    以下是他們師生兩人的對話：

    老師：右圖中隱藏 6 組相似三角形，利用其中兩組的對應邊成比例性質，即可解決這個問題。

    小頌：那右圖中包含哪 6 組相似三角形呢？

    老師：這 6 組相似三角形分別是：$\triangle AFG \sim \triangle CBG$、$\triangle ABG \sim \triangle
    CEG$、$\triangle EFD \sim \triangle EBC$、……

    噹~噹~噹~噹~~~~此時下課鐘聲響起

    老師：為了不耽誤各位的下課時間，其他三組我們明天上課再繼續，下課!

    小頌：可是我現在就想知道啊~

    老師：自己想想，或是先請教同學。


    請根據上面敘述回答下列問題，第(2)題不需詳細的證明，簡單說明即可，但仍需要有合理的計算過程：'
