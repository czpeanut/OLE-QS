- id: doc_112_彰化_埤頭_社會_地理_g9s2e1_s1_15
  section: 1
  number: 15
  type: single
  page: 1
  stem: 屏東縣的滿州鄉早期為原住民的領地範圍，當地原住民族人在打獵後，常將食用剩餘的獵物丟棄於此處，使得這裡遍布動物的腐屍氣味，故被這些原住民人稱為「vangevul」，即為以當地族語的「臭氣」。後來移墾至此的漢人以閩南語音譯「vangevul」為「蚊蟀」（báng-sut），將此地稱為「蚊蟀埔」。日治時期日本政府又以日文的相近音「manshu」改為「滿州」。根據推論上文及附圖提及當地族語，應為下列何哪一族？
  options:
  - label: A
    content: 泰雅族
  - label: B
    content: 排灣族
  - label: C
    content: 阿美族
