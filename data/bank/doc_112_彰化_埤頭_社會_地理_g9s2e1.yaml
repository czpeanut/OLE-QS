  section: 1
  number: 23
  type: single
  page: 2
  stem: 烏石鼻最可能位於附圖何處？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
  group_stem: 臺東縣有許多原住民族部落，其中一個部落名為「烏石鼻部落」。「烏石鼻」地名源於漢人，指出突出於當地東南方海邊的黑岩石，由於岩石像人的鼻子往外突出而得名。而阿美族語的部落名稱則自稱為「Ciradayai」，源於植物發音「datay」或「radai」（月橘、七里香）。因為早期這裡的阿美族人，皆用月橘或七里香的樹枝燒成炭，來染黑牙齒，加上部落附近有許多月橘、七里香，因此以此來命名部落名稱。請回答23-25題：
