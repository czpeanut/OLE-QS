  section: 1
  number: 3
  type: single
  page: 1
  stem: 敏敏要繪製台灣地形特徵的海報，同學七嘴八舌的說出他們的想法，請問敏敏應該要採用下列哪位同學的說法才是正確的呢？
  options:
  - label: A
    content: 安安：台灣人口主要集中平原地區，因為平原所佔的面積最大。
  - label: B
    content: 妙妙：由於板塊交界在西部，所以臺灣山脈偏東，山地為森林資源的保育地。
  - label: C
    content: 靜靜：盆地主要分布中南部，適合人類活動，所以往往形成人口密集區喔！
  - label: D
    content: 親親：埤塘是桃園台地的特色，主要原因是台地地勢較高，早期水源存取不易。
