  type: single
  page: 6
  stem: 塑膠製品是日常用品中使用最多的物品，下列有關塑膠的敘述何者錯誤？
  options:
  - label: A
    content: 聚合物 PP、PS、PVC 等目前有強制回收、分類再重複使用，可降低塑膠垃圾對環境的影響
  - label: B
    content: 聚丙烯「PP」可製成環保杯具及餐盒，因紙杯上塗有一層塑膠布「PP」，故使用後的垃圾仍無法分解
  - label: C
    content: 聚氯乙烯「PVC」可製成水管、水桶，若加熱超過 60℃時可能釋放出致癌物，因此限用已成國際趨勢
  - label: D
    content: 聚苯乙烯「PS」所製飲料杯 6 號杯蓋可盛超過 100℃之飲品，所以大家要多加利用，達成地球減碳運動。
  group_stem: '塑膠是絕緣體，可用來包覆電線，西元1940 年有關「塑膠像金屬一樣可以導電」的理論相繼出現。西元1958年義大利 納德教授首先合成這種塑膠：聚乙炔，它是由乙炔在催化劑的作用下大量聚集連結所製造而成，這類塑膠因可以導電又保有傳統塑膠質輕的特性，因此勢必對未來生活產生極大的影響。聚乙炔結構如右：…
    CH－CH＝CH－CH＝CH－…。（★5 號杯蓋為PP 材質，可耐高溫）

