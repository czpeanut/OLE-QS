- id: doc_113_高雄_光華_自然_g8s2e3_s1_40
  section: 1
  number: 40
  type: single
  page: 4
  stem: 「磺火捕魚」是僅存於臺灣北海岸金山一帶的傳統捕魚方式。漁民利用電石（主成分為碳化鈣（$CaC_{2}$）加水，反應產生電石氣（$C_{2}H_{2}$）和氫氧化鈣（$Ca(OH)_{2}$），再點燃電石氣，會產生強光，利用魚的趨光性，吸引魚群聚集，即可捕撈上船。因為點燃電石氣時會產生強光及巨響，所以此種捕魚方式也俗稱「蹦火仔」。化學反應為：$CaC_{2}
    + 2H_{2}O \rightarrow C_{2}H_{2} + Ca(OH)_{2}$，在本文中提及的電石氣，屬於下列哪一種物質？
