- id: doc_113_高雄_光華_自然_g8s2e3_s1_41
  section: 1
  number: 41
  type: single
  page: 4
  stem: 天氣寒冷，米酒銷售旺。不肖廠商用來路不明的酒精，或溶入乙酸乙酯混充米酒香氣，製成「黑心米酒」牟利。乙酸乙酯具有芳香氣味，易揮發，通常用於人工皮革、芳香劑製品及塗料；可作為食品香味添加劑，但製酒過程不可添加乙酸乙酯，食入過量則有噁心、嘔吐、呼吸急促、暈眩等症狀，因對人體諸多器官造成傷害。一般釀酒時，利用酵素將醣類轉為酒精，反應式為$X\rightarrow
    2C_{2}H_{5}OH + 2 O_{2}$ (已平衡)，則反應式中的X 物質為下列何者?
