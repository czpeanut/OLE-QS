- id: doc_113_高雄_光華_自然_g8s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '取甲、乙兩種化合物，分別在足量的氧氣中燃燒，反應式分別為：

    甲＋$3O_{2}$ → $2CO_{2}$＋$3H_{2}O$

    乙＋$3O_{2}$ → $2CO_{2}$＋$2H_{2}O$

    關於甲、乙兩種化合物的比較與說明，下列何者正確？'
  options:
  - label: A
    content: 甲的分子量大於乙，且甲可能為醇類
  - label: B
    content: 甲的分子量大於乙，且甲可能為烴類
  - label: C
    content: 乙的分子量大於甲，且乙可能為醇類
  - label: D
    content: 乙的分子量大於甲，且乙可能為烴類。
