- id: doc_113_高雄_龍華_自然_g7s1e2_s1_44
  section: 1
  number: 44
  type: single
  page: 4
  stem: 哪一種 LDL 顆粒對心血管健康的風險較高？
  options:
  - label: A
    content: Omega-3 脂肪酸
  - label: B
    content: 大顆粒浮性 LDL
  - label: C
    content: 高密度脂蛋白（HDL）
  - label: D
    content: 小顆粒緻密 LDL。
  group_stem: "題組\n    你知道嗎？並不是所有的壞膽固醇都會增加心血管疾病風險！加州州立理工大學的最新研究指出，並非所有 LDL「壞膽固醇」都會增加心血管疾病風險。傳統上\
    \ LDL 被視為壞膽固醇，但實際上 LDL 包括「小顆粒緻密」和「大顆粒浮性」兩種不同顆粒類型，各自對心血管健康的影響也大不相同。\n    小顆粒緻密的\
    \ LDL 更易穿透血管壁，增加動脈粥狀硬化和心血管疾病的風險。這類型的 LDL 顆粒體積較小、密度較高，易於氧化，會使血管壁發炎，逐漸導致動脈硬化。相反地，大顆粒浮性的\
    \ LDL 顆粒則較為安全，不易黏附在血管內壁，對心血管健康的影響相對友善，甚至可能不具顯著風險。\n    事實上，不同飲食會影響 LDL 的顆粒大小。極低脂的飲食容易增加小顆粒\
    \ LDL，使心血管風險上升，原因是低脂飲食減少了身體對健康油脂的吸收，導致 LDL 顆粒變小。適量攝取飽和脂肪，則能促進對心血管較友善的大顆粒 LDL 生成。因此，追求健康飲食時，低脂並非唯一解方，反而應選擇富含健康脂肪的食物，如橄欖油、酪梨、堅果和深海魚等，以提升\
    \ HDL「好膽固醇」，促進心血管健康。\n    此外，高纖維飲食、適量蛋白質攝取及均衡的 Omega-3 脂肪酸也有助於優化膽固醇狀況，減少小顆粒 LDL\
    \ 的生成。這些營養素不僅能調節膽固醇分布，也能抗炎、穩定血糖，對整體心血管健康十分有益，所以膽固醇的管理不應再僅僅依賴「低脂」飲食，反而應注重油脂質量。\n\
    \     資料來源:脂肪消耗對健康個體低密度脂蛋白粒徑的影響(2021)  https://pubmed.ncbi.nlm.nih.gov/34362390/"
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 生物
      code: 4-4
      title: 人體的循環系統
      chapter: 第4章 生物體的運輸作用
