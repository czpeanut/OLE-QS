  stem: 根據此實驗何者正確?
  options:
  - label: A
    content: 本實驗的操作變因是糖類的質量
  - label: B
    content: 麥芽糖的還原力最強
  - label: C
    content: 黑糖中含有少量還原性糖
  - label: D
    content: 本實驗的控制變因應為最終的顏色。
  group_stem: "本氏液經常用來檢測試管中的醣類。以下是該實驗的原理說明，試回答第39 題：\n1. 本氏液的成分：本氏液是一種常用的化學試劑，主要成分包括銅(II)硫酸鹽（$CuSO_{4}$）、檸檬酸、碳酸鈉等。其作用是檢測還原性糖類。\n\
    2. 還原性糖的特性：還原性糖包括單醣（如葡萄糖、果糖）和某些雙醣（如麥芽糖、乳糖），它們能夠還原本氏液中的銅離子（$Cu^{2+}$）成為銅(I)氧化物（$Cu_{2}O$），從而產生顏色變化。\n\
    3. 結果判斷：如果試管中沒有顏色變化，則表示該糖類不具有還原性，或是含量過低。\n    小亞在此實驗中，先將3g 的方糖、麥芽糖粉、黑糖、葡萄糖，分別放入四支試管中，再於各試管加入等量的本氏液與水直到完全溶解，然後隔水加熱，小亞將此實驗各試管的處理與結果整理如表：\n\
    \n| | 方糖 | 麥芽糖粉 | 黑糖 | 葡萄糖 |\n| :--- | :--- | :--- | :--- | :--- |\n| 顏色 | 藍色\
    \ | 橘色 | 黃綠色 | 紅色 |"
