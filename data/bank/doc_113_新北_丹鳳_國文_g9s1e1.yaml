- id: doc_113_新北_丹鳳_國文_g9s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '下列「 」中的字，讀音為四聲的，總共有幾個？

    甲、一「闋」詞   乙、柔「靡」  丙、雕闌玉「砌」

    丁、令人嘆「惋」 戊、感「慨」  己、直抒胸「臆」

    庚、「稼」軒居士  辛、當頭棒「喝」'
  options:
  - label: A
    content: 五個
  - label: B
    content: 六個
  - label: C
    content: 七個
  - label: D
    content: 八個
- id: doc_113_新北_丹鳳_國文_g9s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列選項「 」中的字，何組字義兩兩相同？
  options:
  - label: A
    content: 春花秋月何時「了」 ／ 「了」無新意
  - label: B
    content: 不「盡」長江滾滾流 ／ 應有「盡」有
  - label: C
    content: 坐斷東南戰未「休」 ／ 「休」學在家
  - label: D
    content: 生子當「如」孫仲謀 ／ 遠親不「如」近鄰
- id: doc_113_新北_丹鳳_國文_g9s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 下列「 」中的注音寫成國字後，何組相同?
  options:
  - label: A
    content: 「ㄩˊ」美人 ／ 不「ㄩˊ」匱乏
  - label: B
    content: 不「ㄎㄢ」回首 ／ 「ㄎㄢ」查地形
  - label: C
    content: 委婉「ㄑ一ㄢˇ」責 ／ 「ㄑ一ㄢˇ」送出境
  - label: D
    content: 興衰更「ㄉ一ㄝˊ」 ／ 「ㄉ一ㄝˊ」血沙場
- id: doc_113_新北_丹鳳_國文_g9s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 以下課文注釋，何者正確？
  options:
  - label: A
    content: 春花秋月：指紅潤的容貌。
  - label: B
    content: 故國：舊日的國家。此指北宋。
  - label: C
    content: 悠悠：長遠的樣子。
  - label: D
    content: 孫仲謀：孫堅，字仲謀。
- id: doc_113_新北_丹鳳_國文_g9s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 以下有關宋詞的簡介，何者有誤？
  options:
  - label: A
    content: 宋詞的別稱有：曲子詞、樂府、詞餘、長短句。
  - label: B
    content: 詞一首稱一「闋」，大多分為上、下片。
  - label: C
    content: 詞牌是填詞時所用的曲調名，與內容大多無關。
  - label: D
    content: 宋詞與漢賦、唐詩、元曲，並稱為中國四大韻文。
- id: doc_113_新北_丹鳳_國文_g9s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 下列誰說的韻文常識最正確？
  options:
  - label: A
    content: 胖虎：宋詞可以因為內容需要，自由調整句式的長短。
  - label: B
    content: 大雄：宋詞按句數多寡有小令、中調、長調之分。
  - label: C
    content: 小夫：宋詞與唐詩押韻方式皆為隔句押韻。
  - label: D
    content: 靜香：宋詞在相同詞牌下，字數、句數、平仄等格律皆相同。
- id: doc_113_新北_丹鳳_國文_g9s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 有關李煜 虞美人一詞，下列選項何者正確？
  options:
  - label: A
    content: 上片藉「春花秋月」的美好光景，對比「往事」、「故國」的人事變化無常，來抒發樂不思蜀的情懷。
  - label: B
    content: 下片透過「朱顏改」的景色變化，與「一江春水向東流」的春意盎然相呼應。
  - label: C
    content: 此詞以問起筆，以答作結。充滿作者對於當下的人生處境，從大惑不解到坦然釋懷的過程。
  - label: D
    content: 末兩句自問自答，以水喻愁，具體而深刻的表達內心的愁緒，成為千古絕唱。
  lesson_raw:
    title: 虞美人
    basis: 題幹提到李煜《虞美人》
- id: doc_113_新北_丹鳳_國文_g9s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 有關辛棄疾 南鄉子 登京口北固亭有懷一詞，下列選項何者正確？
  options:
  - label: A
    content: 詞的起筆，就眼前景色盛讚三國時期英雄輩出，尤以孫吳更是人才鼎盛。
  - label: B
    content: 本詞為思古傷今之作，藉由憑弔千古英雄，感慨當朝掌權者皆為庸碌之輩。
  - label: C
    content: 全詞共五十六字，依宋詞分類當為中調。
  - label: D
    content: 上片中「不盡長江滾滾流」化用杜甫的詩句，正是詞人感懷時局，與杜甫所遭受的安史之亂起共鳴。
  lesson_raw:
    title: 南鄉子 登京口北固亭有懷
    basis: 題幹提到辛棄疾《南鄉子 登京口北固亭有懷》
- id: doc_113_新北_丹鳳_國文_g9s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 請判斷下列對聯，那個節慶聯在一年中的時間是最早的：
  options:
  - label: A
    content: 未到中秋開月桂；且看嘉會集盂蘭。
  - label: B
    content: 萬家燈火同秋月；大地光明不夜天。
  - label: C
    content: 艾葉如旗招百福；菖蒲似劍斬千妖。
  - label: D
    content: 話舊他鄉曾作客；登高佳節倍思親。
- id: doc_113_新北_丹鳳_國文_g9s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 明芬一早到花店買花，沿途經過醫院、理髮店以及米店，請問下列哪副對聯是明芬不會看到的？
  options:
  - label: A
    content: 熱血丹心育桃李；櫛風沐雨作園丁。
  - label: B
    content: 無時巧婦難為力；欠歲司農費盡心。
  - label: C
    content: 作天下頭等事業；用人間頂上功夫。
  - label: D
    content: 常體天地好生德；獨存聖賢濟世方。
- id: doc_113_新北_丹鳳_國文_g9s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 對聯的上下兩聯必須字數相等，平仄相對，詞性相同。從這個特徵來看，「登樓燦明月／火樹暖□□」缺空處最適宜填入的詞語為何？
  options:
  - label: A
    content: 星子。
  - label: B
    content: 冬雪。
  - label: C
    content: 萬戶。
  - label: D
    content: 春風。
- id: doc_113_新北_丹鳳_國文_g9s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 風靡全臺的樂透彩，今年正式由丹鳳銀行接手辦理。許多同業紛紛送上對聯以茲慶祝。下列哪一副對聯最適合用來贈送丹鳳銀行？
  options:
  - label: A
    content: 情投結就兩親家；意合牽成百世緣。
  - label: B
    content: 中郎有女傳家業；要知半子勝生男。
  - label: C
    content: 生意興隆通四海；財源茂盛達三江。
  - label: D
    content: 流水高山思典範；光風霽月仰懿行。
- id: doc_113_新北_丹鳳_國文_g9s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: '吉伊卡哇跑進爺爺的書房玩，不小心把爺爺寫好的對聯弄亂了次序，請你協助將這些對聯依格式復原：

    甲、曲奏笙歌司管樂

    乙、萬里祥光滿斗文

    丙、三春淑氣盈門室

    丁、聲出金石下針砭'
  options:
  - label: A
    content: 乙為上聯、甲為下聯；丙為上聯、丁為下聯。
  - label: B
    content: 甲為上聯、乙為下聯；丁為上聯、丙為下聯。
  - label: C
    content: 甲為上聯、丁為下聯；丙為上聯、乙為下聯。
  - label: D
    content: 丙為上聯、乙為下聯；丁為上聯、甲為下聯。
- id: doc_113_新北_丹鳳_國文_g9s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: '李清照 如夢令：「常記溪亭日暮，沉醉不知歸路。興盡晚回舟，誤入藕花深處。爭渡！爭渡！驚起一灘鷗鷺。」

    關於這闋詞的內容，下列何者正確？'
  options:
  - label: A
    content: 船兒誤入花叢，嚇得水鳥四散紛飛。
  - label: B
    content: 因為醉酒身子昏沉，提早返家休息。
  - label: C
    content: 依字數判斷，這是一闋中調。
  - label: D
    content: 作者夢見某日上午在溪邊涼亭遊玩。
  lesson_raw:
    title: 如夢令
    basis: 題幹引李清照《如夢令》
- id: doc_113_新北_丹鳳_國文_g9s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: '周邦彥 浣溪沙：「樓上晴天碧四垂，樓前芳草接天涯，勸君莫上最高梯。新筍已成堂下竹，落花都上燕巢泥，忍聽林表杜鵑啼。」

    古典詩詞中，常用一些特定的典故或詞語來表達一定的意涵。以這闋詞為例，下列各項說明，何者正確？'
  options:
  - label: A
    content: 「新筍」暗示「重生」。
  - label: B
    content: 「落花」暗示「懷舊」。
  - label: C
    content: 「杜鵑」暗示「思歸」。
  - label: D
    content: 「芳草」暗示「忠君」。
- id: doc_113_新北_丹鳳_國文_g9s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: '宋應星 天工開物：「凡釀酒，必資麴藥成信。無麴，即佳米珍黍，空造不成。」

    在這一段文字中，釀酒的關鍵條件為何？'
  options:
  - label: A
    content: 空間。
  - label: B
    content: 誠信。
  - label: C
    content: 好米。
  - label: D
    content: 麴藥。
- id: doc_113_新北_丹鳳_國文_g9s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: '「柳樹從來不能造成森林，它註定是堤岸上的植物，而有些事，翻字典也是沒用的，怎樣的注釋才使我們了解蘇堤的柳，在江南的二月天梳理著春風，隋堤的柳怎樣茂美如堆煙砌玉的重重簾幕。」

    文中畫粗線處，作者主要想表達什麼意思？'
  options:
  - label: A
    content: 若沒親眼見過柳樹，無法真正體會詩文中描繪的柳樹之美 。
  - label: B
    content: 個人的審美有優劣之分，對於缺乏審美觀的人，再多解釋都難以使之理解 。
  - label: C
    content: 字典中對於柳樹的說明過少，無法提供足夠的資訊。
  - label: D
    content: 盡信書不如無書，字典內的知識，容納不了天地萬物。
- id: doc_113_新北_丹鳳_國文_g9s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 下列「 」中的詞語，何組的詞序顛倒後，意思沒有改變？
  options:
  - label: A
    content: 這樁意外「事故」是因駕駛酒後駕車所導致 ／ 爸媽相識、相戀的過程有如浪漫的童話「故事」。
  - label: B
    content: 今天晴空萬里，是個「適合」出遊踏青的好日子 ／ 好劇本需要「合適」的演員才能綻放它的光采。
  - label: C
    content: 他心中打著如意「算盤」，希望這筆投資能夠獲利 ／ 我「盤算」著這個月的開支，不知能否撐到月底。
  - label: D
    content: 五月天演唱會現場人山人海，可看出他們的高「人氣」 ／ 真「氣人」！詠然以一分之差落敗，無緣晉級。
- id: doc_113_新北_丹鳳_國文_g9s1e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: '老闆對品超說：「你真是我的左右手。」這是以「人體部位」中的「左右手」來比喻「得力的助手」。

    下列各文句「 」內的人體譬喻詞，哪一個指「事情的頭緒」？'
  options:
  - label: A
    content: 他的外交「手腕」高超，很快就升職了。
  - label: B
    content: 事情已迫在「眉睫」，得快點進行才行。
  - label: C
    content: 案情已經有點「眉目」，應該快破案了。
  - label: D
    content: 小夏，你是我的「心肝」，不要離開我。
- id: doc_113_新北_丹鳳_國文_g9s1e1_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 小丸子研究所考試，高分落榜，家人們紛紛安慰她，下列何人所言，最不具安慰效果？
  options:
  - label: A
    content: 爺爺：「三百六十行，行行出狀元」，不管怎樣，爺爺都支持你。
  - label: B
    content: 奶奶：「人有失手，馬有失蹄」，不要因為一次失誤從此灰心喪志。
  - label: C
    content: 媽媽：「失敗為成功之母」，記取這次的教訓，妳又離成功更近了。
  - label: D
    content: 爸爸：入取與落榜的分數，「失之毫釐，差以千里」，真是太可惜了。
- id: doc_113_新北_丹鳳_國文_g9s1e1_s1_21
  section: 1
  number: 21
  type: single
  page: 3
  stem: 下列文句「 」中的詞語，何者沒有自謙的含意？
  options:
  - label: A
    content: 逢人「說項」的修養不是人人都有的。
  - label: B
    content: 學生學藝不精，不妥之處，敬請「斧正」。
  - label: C
    content: 「在下」才疏學淺，恐怕有負重託。
  - label: D
    content: 能從眾參賽者之中脫穎而出，承蒙各位的「承讓」。
- id: doc_113_新北_丹鳳_國文_g9s1e1_s1_22
  section: 1
  number: 22
  type: single
  page: 3
  stem: 「幸運之門確實存在，但鑰匙在你手上。」這句日本諺語的意思和下列哪一句話不能吻合？
  options:
  - label: A
    content: 幸運只眷顧已經準備好的人。
  - label: B
    content: 為了要得到幸運，我們應該相信運氣。
  - label: C
    content: 你這一生的運途發展，關鍵全在於你自己。
  - label: D
    content: 運氣這玩意兒，我深信不疑，而且我還發現，我越努力，運氣越好。
- id: doc_113_新北_丹鳳_國文_g9s1e1_s1_23
  section: 1
  number: 23
  type: single
  page: 3
  stem: 下列破折號的用法，哪一個是作為補充說明之用？
  options:
  - label: A
    content: 「噹──噹──」教堂響起寧靜的鐘聲。
  - label: B
    content: 在旁人看來，也許認為父親只是一般「赤腳仔仙」──但是他在我心中，卻是一個大仙型的人物，因為他有一顆濟世救人的善心。
  - label: C
    content: 南方澳社會文化的形成、發展，與變遷──從古迄今，與我無關。
  - label: D
    content: 西瓜給人的感覺，說穿了只是兩個字──痛快。
- id: doc_113_新北_丹鳳_國文_g9s1e1_s1_24
  section: 1
  number: 24
  type: single
  page: 3
  stem: 以下各文句中連接詞的使用，何者正確？
  options:
  - label: A
    content: 「雖然」有個廚師老爸，「而且」我對廚藝卻是一竅不通。
  - label: B
    content: 他「寧可」挨餓受凍，「也只好」接受別人的施捨。
  - label: C
    content: 「不論」今天路上大塞車，「所以」他現在才進公司。
  - label: D
    content: 「既然」你已經知道問題出在哪裡，「就要」好好自我檢討。
- id: doc_113_新北_丹鳳_國文_g9s1e1_s1_25
  section: 1
  number: 25
  type: single
  page: 3
  stem: 「介詞」的功能是介繫或引進名詞、代詞到句子中，就像是詞與句中間的仲介人。根據此原則判斷，下列文句「 」中的字，何者不屬於介詞？
  options:
  - label: A
    content: 徐噴「以」煙，使之沖煙飛鳴。
