- id: doc_113_新北_丹鳳_國文_g9s1e1_s2_39
  section: 2
  number: 39
  type: single
  page: 4
  stem: 根據上文，遭受批評後，能夠「處之泰然」的原因最可能是下列何者？
  options:
  - label: A
    content: 自省無愧，謗議庸何傷。
  - label: B
    content: 堅持己見，擇善固執。
  - label: C
    content: 對於外界的批評充耳不聞。
  - label: D
    content: 笑罵由人，得饒人處且饒人。
  group_stem: "如何面對別人的批評能處之泰然？這是一種修養工夫。面對別人的批評，通常有三種反應，一是「不在乎」，好壞隨便；一是「太在乎」，一聽到別人的批評就坐立不安，這兩種都不好。第三種是「適度的反應」，就是想一想別人的批評對不對，抱著「有則改之，無則加勉」的態度，或者更進一步有「君子聞過則喜」的雅量，有「月蝕更明」的心胸，這樣雖然有所反應，但不會耿耿於懷，更不會在心中形成一個「結」，甚至記恨對方。要不然聽到批評之後，自己捫心自問，俯仰無愧，那就懷著「豈能盡如人意，但求無愧我心」，也就一笑置之。我認為這樣才是面對批評的好方式，也才能處之泰然。\n\
    \                     潘家群 如何面對批評"
