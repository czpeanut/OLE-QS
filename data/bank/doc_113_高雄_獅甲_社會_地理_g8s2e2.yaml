- id: doc_113_高雄_獅甲_社會_地理_g8s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 根據上文，其中提及圖(一)的內容判斷，該旅遊景點應位於圖(二)中下列哪一個地區？
  options:
  - label: A
    content: 乙
  - label: B
    content: 丙
  - label: C
    content: 丁
  - label: D
    content: 己
  group_stem: 隨著旅遊風氣盛行，許多歷史地點成為熱門的觀光景點，圖(一)中的旅遊景點面積只有1平方公里，由一圈城牆圍繞，全城被兩條主要的街道縱橫分為四區，其中亞美尼亞區的旅遊重點是聖雅各教堂；基督徒區則以聖墓堂最聞名，傳統和考古指向此處為耶穌被釘十字架、埋葬和復活之處；而穆斯林區的面積最大，以阿拉伯人居多，中心點是聖殿山，上有磐石圓頂寺，該地是穆斯林世界的第三至聖之地；猶太區最熱門旅遊景點為西牆（又稱哭牆），西牆仍然保留著第一世紀聖殿西牆的大石塊，是猶太區最靠近聖殿原址的地方，猶太人常到這裡讀經祈禱，或舉行其他節慶。
