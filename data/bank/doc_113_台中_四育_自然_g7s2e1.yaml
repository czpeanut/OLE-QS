- id: doc_113_台中_四育_自然_g7s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 依據本文，下列哪些水果為真果？
  options:
  - label: A
    content: 李子、蘋果
  - label: B
    content: 李子、桃子
  - label: C
    content: 蘋果、桃子
  - label: D
    content: 蘋果、梨子。
  group_stem: "【題組一】\n請在閱讀下列文章後，回答 1～6 題:\n    真果是指一般的果實，是由雌蕊發育成的，果實的果壁是由子房壁變成的，像桃子、李子等都是真果；而假果是指主要是由雌蕊以外的地方發育成的果實，像蘋果(圖一)、梨子等是假果，我們所食用甜而多汁的部分是由子房壁外側及膨大的花托癒合發育而成，這樣的果實稱爲梨果(pome)。梨果中有果心線，果心線裡面的蘋果核或梨核的部份，如:圖一中的ㄆ，是由子房壁形成的；梨果真正的果皮位於中心包覆著種子，果心線外面好吃的果肉部份主要是由花托形成的，如:圖一中的ㄅ。蘋果核或梨核，通常較硬且略帶澀味，會因為口味不佳，而被丟棄，便達到傳播種子的目的。\n\
    \    所以，我們一般吃果實的果肉部份其實不一定是由雌蕊的子房發育而成的。       【取材自 網路文章:真果與假果】"
