    \ 首次觀察到細胞核內的「絲狀結構」。\n1879 年：德國生物學家佛萊明（Walther Flemming） 發現「細胞分裂」，並詳細描述染色體在細胞分裂中的變化。\n\
    1883 年：比利時科學家范本登（Edouard Van Beneden） 研究線蟲（Ascaris），發現精子與卵子各有一半的染色體，並首次提出染色體與遺傳有關的假說。\n\
    1902 年：美國生物學家薩頓（Walter Sutton）和德國學者波韋里（Theodor Boveri） 提出「薩頓-波韋里假說」，認為染色體是遺傳資訊的載體，正式將孟德爾遺傳定律與染色體行為聯繫起來。\n\
    1911 年：美國科學家托馬斯·摩根（Thomas Hunt Morgan） 透過果蠅實驗，證實基因位於染色體上，並發現了性染色體的概念。\n1944 年：艾弗里（Oswald\
    \ Avery）、麥克勞德（Colin MacLeod） 和麥卡蒂（Maclyn McCarty）證明 DNA 而非蛋白質是遺傳物質。\n1953 年：詹姆斯·華生（James\
    \ Watson） 和弗朗西斯·克里克（Francis Crick） 依據羅莎琳·富蘭克林（Rosalind Franklin） 的X 光繞射圖像，提出 DNA\
    \ 的「雙螺旋結構」。\n1956 年：喬·辛頓（Joe Hin Tjio） 和艾伯特·利文（Albert Levan） 確定人類體細胞中染色體數目為 46\
    \ 條（23 對）。\n  \n 【取材自 網路文章:染色體研究的歷史 】"
