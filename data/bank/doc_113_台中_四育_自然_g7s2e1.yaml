- id: doc_113_台中_四育_自然_g7s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 下列何者不是農業上常用的無性生殖技術？
  options:
  - label: A
    content: 馬鈴薯塊莖繁殖
  - label: B
    content: 小麥花粉受精
  - label: C
    content: 香蕉組織培養
  - label: D
    content: 番薯莖的扦插。
  group_stem: "【題組二】\n請在閱讀下列文章後，回答 7～10 題:\n    當我們談到生殖時，通常會想到動物交配或植物開花結果。然而，在無性生殖（Asexual\
    \ Reproduction）的幫助下，許多生物不需依賴配偶即可繁殖。這種繁殖方式不僅發生在自然界，也被廣泛應用於農業、醫學與生物技術領域，對人類社會產生深遠影響。無性生殖的應用領域有:一、農業與園藝：可以提高產量與品質。二、醫學與生物科技：複製與再生技術，如克隆技術(科學家已成功複製綿羊「桃莉」，這是第一隻由體細胞複製而來的哺乳動物)，可以延續保存瀕危動物基因，延續珍貴物種。幹細胞研究(幹細胞治療：利用人體細胞培養組織，未來可用於器官移植或再生醫學)，可以延續保存，提供醫療新選擇，幫助修復受損器官或組織。三、食品與環保：合成肉與生態保育，利用細胞培養技術，製造「無需屠宰」的肉類，減少環境負擔。不過，在發展無性生殖應用的同時，我們也需要隨時注意它是否同時可能會帶來對自然生態環境的負面衝擊。\
    \                                                      【取材自 網路文章:無性生殖從自然界到科技的創新】"
