- id: doc_113_台中_四育_自然_g7s2e1_s1_22
  section: 1
  number: 22
  type: single
  page: 3
  stem: 關於文章中各種動物的求偶行為的敘述，何者錯誤？
  options:
  - label: A
    content: 只有雄丹頂鶴會跳舞和唱歌，雌丹頂鶴不會
  - label: B
    content: 鳥類的求偶行為不一定是唱歌，例如:鳳頭麗雀則是裝飾巢穴
  - label: C
    content: 雄鹿的鹿角是用來求偶的重要構造
  - label: D
    content: 雄蛙會鼓起鳴囊發出聲音吸引雌蛙的注意 。
  group_stem: "【題組四】\n請在閱讀下列文章後，回答 22～30 題:\n    在大自然中，行有性生殖的動物為了傳宗接代，演化出各種繁殖行為，其中的求偶行為展現時，像極了千奇百怪的「才藝」表演現場。\n\
    \    例如:(1) 森林裡的建築大師-鳳頭麗雀（Bowerbird）：像是「室內設計師」的雄鳥會用樹枝、花朵和鮮豔物品建造「愛的小屋」（Bower）來吸引雌鳥。有的甚至會利用藍色塑膠片或玻璃來裝飾！雌鳥會仔細檢查這些建築物，選擇最有創意的雄鳥作為配偶。(2)\
    \ 丹頂鶴（Red-crowned Crane）：戀愛時會「跳舞」的丹頂鶴是很優雅的鳥類，在求偶時，牠們會與伴侶進行雙人舞蹈。這些舞步包含優雅的跳躍、翅膀拍動，甚至還會模仿對方的動作！(3)\
    \ 在雨林或池塘中舉辦著青蛙的「大聲公」比賽，你會聽到一陣陣此起彼落的「呱呱」聲。這是雄性青蛙的求偶大賽！不同種類的青蛙有不同的鳴叫頻率，聲音越響亮、持續時間越久的雄蛙，通常更容易吸引到異性。(4)\
    \ 鹿的man power「決鬥」，在鹿的世界裡，雄鹿之間的角力戰決定了誰能擁有交配權。在繁殖季節，雄鹿會以鹿角相撞的方式比拼力量，強壯的雄鹿能夠獲得雌鹿的青睞。這種爭鬥有時可能會導致受傷，甚至喪命，但對鹿群來說，這是確保優良基因傳承的方法之一。(5)\
    \ 雄海象在「拳擊擂台」較勁!海象的雄性個體體型巨大，擁有強壯的獠牙，牠們會在冰面上進行激烈的打鬥，透過強力的撞擊與推擠來決定誰能擁有交配權。這種行為讓較弱的雄海象無法繁殖，而強壯的基因能夠流傳下去。\n\
    \                                                                    【取材自 網路文章:為愛情奮鬥的生存遊戲】\n\
    \n表(一)\n| 動物 | 卵黃量 | 受精方式 | 發育場所 | 育幼行為 |\n| :--- | :--- | :--- | :--- | :---\
    \ |\n| 甲 | 豐富 | 體內 | 母體外 | 孵卵育幼 |\n| 乙 | 很少 | 體內 | 母體內 | 哺乳育幼 |\n| 丙 | 多 | 體外\
    \ | 母體外 | 無 |\n| 丁 | 多 | 體內 | 母體外 | 無 |"
