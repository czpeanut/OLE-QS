  section: 4
  number: 31
  type: single
  page: 3
  stem: 本文敘述海豚誤食塑膠袋而死的遭遇，主要在說明下列何者？
  options:
  - label: A
    content: 追求經濟發展而不付出代價是不可能的，因此無法兼顧環境保育
  - label: B
    content: 加拿大的環保觀念最為先進，應加以效法
  - label: C
    content: 要維護海洋生態，不可濫殺濫捕
  - label: D
    content: 痛斥人們的自私，傷害了海洋生物
  group_stem: "我曾經和一位加拿大鯨豚研究者一起出海尋鯨，也碰到了同等規模的海上垃圾堆，他說：「在加拿大，船隻若是碰到了塑膠袋，船主會停船將塑膠袋撈上來，我們那裡的海塑膠袋很少—當然，這裡這麼多不可能這樣做。」他指了指那一大片漂流塑膠袋。加拿大朋友的一番話，竟然每字每句都如針尖鍼在心底。如果將海洋當成自己的領土、自己的家園，或許我們會去關心海洋環境問題，可惜，海洋一直被當做化外之地，岸上都管不完了，誰會來在意海洋環境？\n\
    \ 他又繼續說：「我曾經在臺灣解剖過一隻生病擱淺的瓶鼻海豚，牠的前胃腫脹得像一顆美國大南瓜，主胃和幽門胃則是消癟空無一物；剖開後，發現前胃裡塞了一只黑色大塑膠袋，像毛巾擰轉成曲捲條狀，臭油味、腐敗味很濃，胃壁原有的皺摺全被塑膠袋撐脹消失了，胃壁糜爛死白。塑膠袋塞住前胃，牠沒辦法進食，難逃活活餓死的命運，牠死去前一定受了很多苦。」\n\
    \ 我也聽過曾經有一隻海豚的胃裡，被發現有一只印著店名、地址……的塑膠袋，是國內一家頗負盛名的食品公司的包裝袋。是多大的諷刺，食品廣告做到海上、做到海豚的胃裡去了。\n\
    （改寫自廖鴻基 塑膠海豚塑膠）"
