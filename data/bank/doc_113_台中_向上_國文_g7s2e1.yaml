- id: doc_113_台中_向上_國文_g7s2e1_s4_4
  section: 4
  number: 4
  type: single
  page: 3
  stem: 根據美國的學習習慣研究，下列何者是中小學生在學習挑戰上的共同難題？
  options:
  - label: A
    content: 不懂時間管理，不知如何安排課業及其他活動的時間規畫
  - label: B
    content: 不會配戴手錶，絕大多數的中小學學生都看不懂傳統時鐘
  - label: C
    content: 不曾做過家事，課業繁忙而且課外活動多，無暇協助家務
  - label: D
    content: 不會物歸原位，家人會協助歸位，且不曾教導孩子怎麼做。
  group_stem: "寫過多本學習方法暢銷書的臺灣大學教授呂宗昕在《教出學習力》透露，從小他讀書名列前茅的原因，除了年幼時培養良好的生活習慣，還有他總是提早針對大型考試做讀書計畫。但他去各處演講時發現，會做讀書計畫的學生寥寥可數。\n\
    \    自2011 年至2013 年，美國 布朗大學 阿爾培特醫學院等機構針對美國中、小學生共五萬個家庭進行「學習習慣研究」，發現雖然每個孩子面對的學習挑戰各有不同，但幾乎全部孩子對於時間管理都有困難，他們不知道該如何有效規畫與分配課業、課外活動和其他生活責任。\n\
    \    該研究也發現，普遍而言，很少學生會帶手錶，四年級以下的學童，絕大多數看不懂傳統時鐘。而不懂規畫時間的學生，通常在家裡不必做家事、沒有物歸原位的習慣、家裡沒有要求規律有效率的作息等等。\n\
    \    到了國中階段，課業、考試壓力更大，學會做讀書計畫更重要。以下三項建立能力的行動，可幫助孩子在開始做讀書計畫以前，擁有時間及計畫的概念：\n\n能力一：建立時間感\n\
    \    要學會孩子管理，首先要建立內在的生理時鐘，意即有時間感，能了解完成某件任務，需要多少時間。《教出好大人》作者鍾安淇建議從「玩時間」開始，用計時器來建立時間感。例如：倒數一分鐘可以跳繩幾下、拍幾下手等。接著用計時器算自己完成某項任務需要的時間，進而設定學習目標。例如：寫一頁數學作業大約需要三十分鐘，可以挑戰在二十五分鐘內完成。\n\
    \n能力二：估算待辦事項\n    呂宗昕在《教出學習力》中建議，若要學會時間規畫，回家以後，先別急著開始寫功課，可以先條列出今天得完成哪些事情？然後再寫下估計每項需要多少時間，加總起來，就知道所需要的工作總時間。如果工作總時間大於當晚可利用時間，代表可用時間不足，必須調整工作項目或是加快腳步完成。\n\
    \n能力三：判斷優先順序\n    許多孩子分不清事情輕重緩急，自己有興趣的，不管重不重要，都擺在前面先做。成功學大師史蒂芬．柯維（Stephen Covey）提出成功者在安排計畫時，會依照事件的重要和緊急性來決定優先性。呂宗昕也以此來提醒大家，把待辦事項依照：一、重要又緊急，二、重要但不緊急，三、緊急但不重要，四、不緊急又不重要的優先順序來完成。\n\
    \n─改寫自〈時間管理：打穩3 能力，讀書就有效率〉親子天下"
