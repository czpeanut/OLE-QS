  group_stem: "【題組六】請閱讀以下短文：\n          十七世紀時，當時的人們認為腐肉會自發生成蛆，但是義大利的醫生雷迪卻認為「所有的生命都從生命而來，不會由無生物自然發生」。於是進行了以下實驗：他準備了甲乙兩組罐子，兩組的罐子裡都放入生牛肉。甲組罐子上蓋紗布，乙組的罐子上未蓋紗布。觀察幾天後，他看到蒼蠅可以飛進乙組的罐子裡，最後牛肉的表面出現了蛆。而在有紗布的甲組，紗布上雖然有蒼蠅卵，但罐子裡的牛肉就沒有生蛆。\n\
    根據短文，請回答第49~50 題。"
