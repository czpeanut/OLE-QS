- id: doc_113_新北_桃子腳_自然_g8s2e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: '外帶咖啡的塑膠杯蓋會釋出致癌物質嗎？下列為網路上大家關心的一則問與答，關於文中所提及的PS 或PP 的敘述，何者正確？

    問： 外帶咖啡的塑膠杯蓋會釋出致癌物質，是真的嗎？

    答： 過去咖啡杯蓋的材質多為聚苯乙烯（簡稱PS），由苯乙烯（$C_{8}H_{8}$）聚合而成，相關單位已對此材質訂出使用規範，確保安全。為免疑慮，市面咖啡杯蓋材質已逐漸改成聚丙烯（簡稱PP），由丙烯（$C_{3}H_{6}$）聚合而成。PS
    和PP 都屬於熱塑性聚合物，只要符合規定，消費者正常使用，尚無安全疑慮。'
  options:
  - label: A
    content: 兩者都屬於耐高溫的網狀聚合物
  - label: B
    content: PP 是由碳水化合物聚合而成
  - label: C
    content: 兩者都無安全疑慮，毋須回收
  - label: D
    content: PS 是由數千個以上的原子所組成
  answer:
  - D
