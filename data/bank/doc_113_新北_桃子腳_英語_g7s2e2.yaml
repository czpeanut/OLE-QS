  group_stem: 'Leonardo da Vinci is a famous artist. Many people know his paintings,
    like Mona Lisa and The Last Supper. He is a great artist and a scientist.

    Leonardo is famous for starting painting at a young age. His famous painting,
    Mona Lisa, shows a woman with a special smile. People still don’t understand her
    smile even today. He creates his works with great skill and he uses light to make
    paintings. He enjoys drawing animals, people, and plants. Today, people in the
    world are still learning from his art and ideas.

    Leonardo is a famous artist, but he is not always rich. His main job is not painting.
    He works for kings and other important people. He creates art and designs machines
    for them. Art and creating machines are not always his bread and butter, so he
    often works for rich patrons to make money.

    Leonardo da Vinci’s life story tells us one thing: “Maybe your hobby cannot bring
    you money, but it can still change the world.” Leonardo’s work is still part of
    people’s lives in many places.


     scientist 科學家 main 主要的 designs 設計 machines 機器 patrons 支持藝術的人或機構'
