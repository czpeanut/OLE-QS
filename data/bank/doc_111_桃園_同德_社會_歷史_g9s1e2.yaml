  section: 1
  number: 40
  type: single
  page: 2
  stem: '逸凱以中世紀歐洲與文藝復興的世界觀與文藝風格為題製作了一個比較表。請找出正確的選項？

    |  | 中世紀歐洲 | 文藝復興 |

    | --- | --- | --- |

