    are small. Some are only six centimeters long. Anemones look like flowers. They
    are animals, not plants. They live in the sea. They make their homes on coral
    reefs. They have beautiful colors: pink, green, red, purple and blue.

    Anemones look very nice, but they are not really nice. They can hurt people. But
