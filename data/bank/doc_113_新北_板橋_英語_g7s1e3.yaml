    Clownfish and anemones are a good example of mutualism. The anemone gives the
    clown fish a happy and safe home for clownfish. The clownfish brings the anemone
    food and sea anemones keep bad guys away from clownfish. Thanks to the clownfish,
    the anemone is full and healthy.


