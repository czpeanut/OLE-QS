- id: doc_113_台南_復興_自然_g8s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: '表(二)為金屬的發現年代，其中銅器廣泛使用於中國商朝，鐵器則是宋朝常使用的金屬。然而隨著考古的發現，商朝出土大量青銅器因而被命名為青銅器時代，宋朝的鐵器則是大量佚失。請問最有可能造成此現象的原因為何？


    表(二)

    | 推估發現年代 | 金屬 |

    | :--- | :--- |

    | 西元前 6000 年 | 銅 |

    | 西元前 5000 年 | 鐵 |

    | 西元前 1000 年 | 鋅 |

    | 18 世紀 | 鎂 |'
  options:
  - label: A
    content: 銅的熔點比鐵高，所以經過地殼活動能保存下來
  - label: B
    content: 鐵的硬度比銅大，所以在挖掘時候被破壞
  - label: C
    content: 銅的延展性比鐵好，器具較有韌性
  - label: D
    content: 銅的活性比鐵小，所以長時間保存不易氧化而損壞
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
