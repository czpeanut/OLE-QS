- id: doc_113_台南_復興_自然_g8s2e1_s3_31
  section: 3
  number: 31
  type: single
  page: 5
  stem: 根據本文，下列敘述何者正確？
  options:
  - label: A
    content: 加熱後所產生的物質為汞
  - label: B
    content: 鵝頸瓶與罩子的總質量在加熱前後並不相同
  - label: C
    content: 加熱過程的反應物之一佔空氣體積約五分之一
  - label: D
    content: 水也有可能是加熱的產物之一
  group_stem: '[一] 18 世紀時，人類認為能夠燃燒的物質是因為內部含有燃素，當物質燃燒後，因為失去燃素而減輕。然而燃素說無法說明鋼絲絨等有些物質燃燒後質量卻增加的現象。1772
    年，「現代化學之父」拉瓦節為了解開背後科學原理，進行一系列實驗來挑戰燃素說。實驗裝置如圖(三)，拉瓦節將純汞放入標示為 A 的鵝頸瓶中，鵝頸瓶再與另外一個罩子連接，罩子中含有空氣與水，整個鵝頸瓶與罩子的連接裝置是密閉的。拉瓦節在鵝頸瓶下方進行加熱，反應期間汞的表面會逐漸生成紅色粉末的氧化汞（mercuric
    oxide，HgO）。12 天後，氧化汞不再產生，這時候罩子內空氣體積消滅了五分之一，而鵝頸瓶與罩子的總質量沒有改變。爾後，拉瓦節進一步分析後證明：金屬燃燒後增加的重量恰等於空氣減少的重量，成功推翻燃素說。最後他將空氣中參與燃燒的氣體稱為氧氣，並算出所佔的比例，推翻長久以來人們以為空氣是單一元素的錯誤觀念。(本文改寫自維基百科與泛科學文章)

    請根據文章內容回答 31-32 題。'
