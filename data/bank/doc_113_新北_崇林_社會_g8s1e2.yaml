    (甲)皇帝與涮羊肉

    他的部落長年征戰，三次西征建立四大汗國，他也常常帶軍隊南下打仗。一次戰後，士兵勞累飢餓，為重振士氣命人宰羊慰勞軍隊。不想此刻追兵突然來襲，時間不夠煮熟羊肉。他便命人將羊肉片成薄片放入沸湯中。士兵吃後士氣大振，打了個打勝仗。之後他又用此法犒賞將士，於是這種吃法也就慢慢流傳了下來。

    (乙)皇帝與油煎毛豆腐

    他自幼父母雙亡，年輕時卻吃了不少苦，當過乞丐也當過和尚也在地主家做過長工。有一次，他不小心闖了禍，於是逃離了主家，來到附近土地廟躲藏。和他一起幹活的李大叔偷偷給他送了些豆腐，但他卻因病幾天都動不成。可豆腐已經長毛，飢餓難忍的他顧不得許多，支起了一口鍋將長毛的豆腐下鍋煎熟。嘗一塊便覺得美味異常。後來，他當上了皇帝，仍然經常命人做這道菜。小小的毛豆腐搖身一變成了宮廷菜餚。

    (丙)皇帝與羊肝

    在陳橋兵變與杯酒釋兵權達成權力轉交與兵權交接後，有一天夜裡他突然從床上坐起來，卻又百般糾結遲遲不下命令，這讓侍衛也很是茫然，便忍不住上前詢問皇上到底有何吩咐，他卻說：「我要是真說了，每天肯定有隻羊被你們殺死。」原來，這是他想吃羊肝了，還是特別想吃，但猶豫不決一時不好開口。

    (丁)皇帝與巧克力

    中國在位最久的皇帝年輕時，因聽聞有樣稀罕的西洋食物叫「綽科拉」要求西方傳教士多羅進貢一些來品嚐，這帶有苦味的西洋食物，並不合他胃口，也因為沒有特殊治病功效，自此從皇帝的身邊消失了。'
