  stem: 亞他加馬沙漠成為世界上最乾燥沙漠的原因和下列何者關係最為密切?
  options:
  - label: A
    content: 沿海地區有寒流經過
  - label: B
    content: 位在盛行西風的背風側
  - label: C
    content: 距海遙遠水氣難以深入內陸
  - label: D
    content: 副熱帶高氣壓壟罩
  group_stem: '●智利北部的亞他加馬沙漠是世界上最乾旱的沙漠，被NASA 認為是地球上與火星最相似的地方，擁有獨特而脆弱的生態系統。然而，該生態系統近年正受到來自世界各地的成堆垃圾威脅。堆積如山的廢棄衣物、堆積如山的鞋子以及成排成排的報廢輪胎和汽車，正威脅著沙漠中的生態。沙漠小鎮的市長告訴法新社：「我們不再只是當地的垃圾場，而是世界的垃圾場，這更糟糕。」此外，亞他加馬沙漠的自然環境也因A
    礦產和鋰的密集開採而發生了變化。請回答第12、13 題:'
  tags:
