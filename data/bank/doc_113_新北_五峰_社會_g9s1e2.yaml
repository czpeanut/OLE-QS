- id: doc_113_新北_五峰_社會_g9s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: BBC 報導:「在墨西哥北部的蒙特雷市（Monterrey），中國公司敏華家具（Man Wah Furniture）設立了大型廠房，從生產線下來的躺椅和真皮沙發全是100%墨西哥製造。這些產品的目的地是美國大型零售商，例如好市多（Costco）和沃爾瑪（Walmart）。但該公司來自中國，其墨西哥製造工廠是由中國資本修建的。美國、中國和墨西哥的三角關係，形成了墨西哥商界的流行語：「近岸外包」（nearshoring）。許多中國公司近年搬到墨西哥北部的工業園區，使生產線更接近美國市場，敏華家具就是其中之一。」根據上文，中國敏華家具的策略主要是考量該公司在墨西哥生產的產品在哪個區域型組織內販售，具有相對優勢?
  options:
  - label: A
    content: ASEAN
  - label: B
    content: APEC
  - label: C
    content: EU
  - label: D
    content: USMCA。
  tags:
    chapter:
      publisher: 康軒
      book: 九上
      subject: 公民
      code: 4-2
      title: 國際分工與國際貿易
