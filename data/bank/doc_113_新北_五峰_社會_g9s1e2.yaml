- id: doc_113_新北_五峰_社會_g9s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 加州因氣候因素，野火災害最為嚴峻。過去兩年，因加州有較多降水，森林和草原迅速生長，但2024 年夏季炎熱乾燥，使植物快速枯萎，為野火製造許多燃料。據報導，2024
    年6 月野火季初期，野火已燒毀加州近9 萬英畝的土地。加州的極端氣候可能會透過產業供應鏈而影響到全美國。下列菜單食材皆取自美國本土，考量到美國農業的分布情形，哪一項最可能受加州極端氣候的影響而漲價？
  options:
  - label: A
    content: 前菜：普羅旺斯燉菜（原料：櫛瓜、甜椒、番茄、橄欖油、香草……）
  - label: B
    content: 主菜：帶骨牛排（原料：帶骨牛肉、奶油、粗海鹽、香草……）
  - label: C
    content: 湯品：玉米濃湯（原料：玉米、火腿、麵粉、牛奶……）
  - label: D
    content: 點心：可麗餅（原料：小麥粉、蛋、糖、奶粉、鮮奶油……）。
