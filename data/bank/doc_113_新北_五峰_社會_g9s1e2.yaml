  stem: 在2012 至2013 年的咖啡葉銹病，影響數以萬計的拉丁美洲咖啡農，許多咖啡田社區損失近九成的收成，使一批又一批的咖啡農被迫離鄉找工作。但即便是在咖啡葉銹病大肆侵襲前，大多數只靠種植咖啡豆的咖啡農收入也不足以養家活口。咖啡價格受到市場大幅波動的影響，讓許多咖啡農無法支付家庭一整年的糧食所需。「Los
    Meses Flacos(飢餓月)」指的正是每年當販售咖啡豆收入耗盡後，長達6 個月以上沒有足夠食物的情況。上述現象和下列哪種原因關聯性較低?
  options:
  - label: A
    content: 土地利用多改種經濟作物
  - label: B
    content: 作物單一化
  - label: C
    content: 氣候條件不適合農耕
  - label: D
    content: 經濟依賴出口他國
