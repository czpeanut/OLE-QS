  - label: D
    content: 嘉年華會的由來源自於該古文明
  group_stem: '●宏都拉斯是位在中美地峽的小國，人口約 990 萬人，平均每人 GDP 接近 2,800 美元，經濟上是相對貧窮的國家，重要的出口商品以熱帶栽培業或是水產養殖等初級產品為主，而「A
    古文明」則是該國重要的文化遺產。

    　　臺灣與宏都拉斯在2023 年斷交前已有超過八十年的情誼，臺灣長期提供包含教育、農業、公衛醫療、基礎建設等方面的援助，也透過簽訂自由貿易協定（FTA）增加貿易往來，白蝦、咖啡等都是該國進口至臺灣的重要商品，希望能藉此改善宏都拉斯國內的經濟與人民生活品質。兩國斷交讓原本約
    100 名在臺就學並領取獎學金的留學生，在 2023 年上半年完成該學期學業後就不再享有獎學金，教育部表示將提供單程回程機票協助學生返國。除了留學生外，與臺灣有貿易往來的當地居民也將會有很大的影響。請回答第9-11
    題:'
