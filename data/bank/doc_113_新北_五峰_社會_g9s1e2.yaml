- id: doc_113_新北_五峰_社會_g9s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 「2024 美國總統大選結果出爐，川普以277 票通過總統勝選門檻，搭檔范斯也將成為第47 屆美國副總統。今年6 月CNN 的調查發現，56%的美國人從未聽過范斯這號人物。為什麼川普要選擇他?很可能是因為他來自鐵鏽帶(Rust
    Belt)，而川普不能放棄這裡。鐵鏽帶曾是美國經濟的心臟，過去靠著製造、鋼鐵、煤碳、汽車等產業為主力，但在1980 年代，因為全球貿易自由化而逐漸沒落，2008
    年全球金融海嘯更是致命一擊造成人口外流，百業蕭條。」文中所指的「鐵鏽帶」應為附圖中的何者?
