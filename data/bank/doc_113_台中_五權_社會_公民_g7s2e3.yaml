  stem: 社會生活中，每個人都有可能陷入經濟或不公平的困境，因此對弱勢群體伸出援手或如何減少不公平的現象，就是我們要追求的社會正義。下列我國政府的作為中，何者最能實踐上述社會正義的精神？
  options:
  - label: A
    content: 為防堵非洲豬瘟入境，在機場實施安檢
  - label: B
    content: 增加偏鄉學校的補助，改善當地教育資源
  - label: C
    content: 鼓勵民眾自發組成志工隊，加入社區的治安巡邏
  - label: D
    content: 降低酒駕風險，警察在各路口實施臨檢。
  answer:
  - C
  answer_source: answer_key_vlm
