  - label: B
    content: 打破社會階級的限制
  - label: C
    content: 提升個人的社會地位
  - label: D
    content: 發揮社會規範的功能。
  answer:
  - A
  answer_source: answer_key_vlm
- id: doc_113_台中_五權_社會_公民_g7s2e3_s1_2
