  stem: 根據衛生福利部中央健康保險署統計，健保平均一年在藥費上花費1,600億元，但每年卻有約193公噸的藥物被丟掉，等於超過5億顆藥進了垃圾桶，可環島近8圈。上文內容凸顯全民健保制度的何種爭議？
  options:
  - label: A
    content: 國家財政負擔沉重
  - label: B
    content: 醫療資源濫用嚴重
  - label: C
    content: 每個人繳相同的保費，享有一樣的醫療服務
  - label: D
    content: 個人健康狀況良好。
  answer:
  - D
  answer_source: answer_key_vlm
