  stem: 文中提到「網飛(Netflix)公司曾統計，西元2020 年全球已逾1 億戶家庭曾在其平臺觀看至少一部動畫片」，請問：下列何者是世界各地人們可以看到日本動漫作品的主要原因？
  options:
  - label: A
    content: 資訊科技進步
  - label: B
    content: 言論自由保障
  - label: C
    content: 跨國移動便利
  - label: D
    content: 國際政治角力
  group_stem: "※閱讀文章並回答48~50 題\n近年來，日本動漫已在全球擁有一定的市場。在西元2020 年新冠肺炎(COVID-19)疫情的推波助瀾下，數位化的動漫劇集更成為民眾居家必備的「精神食糧」之一。例如：網飛(Netflix)公司曾統計，西元2020\
    \ 年全球已逾1 億戶家庭曾在其平臺觀看至少一部動畫片，比西元2019 年同期暴增50％以上，且將近100 個國家年度前10 大熱門片單中，皆包含日本動畫。索尼(Sony)公司旗下出品的「鬼滅之刃劇場版：無限列車篇」，其票房紀錄更榮登西元2020\
    \ 年全球最賣座的動畫電影冠軍。\n  上述現象顯示日本動漫在全球的影響力，也因此吸引世界各大網路串流媒體群起爭奪這塊龐大的商機，例如：索尼、網飛、迪士尼、華納(HBO\
