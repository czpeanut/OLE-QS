  page: 4
  stem: 下列選項中，哪一組配對正確描述了皮膚的結構與其對恆定性的作用？
  options:
  - label: A
    content: 表皮含有毛囊，通過汗液分泌調節體溫
  - label: B
    content: 真皮含有血管，通過調節血流幫助維持體溫
  - label: C
    content: 皮下組織形成角質層，防止水分蒸發
  - label: D
    content: 真皮由脂肪組成，主要負責保溫與水分儲存。
  group_stem: '皮膚由三層主要結構組成，每一層都有其特定的功能：

    1. 表皮層：具有保護功能，外層有角質層可以形成防水屏障，防止水分流失和病原體入侵。

    2. 真皮層：位於表皮下，含有血管、淋巴管、神經、汗腺和毛囊。血管和汗腺有助於調節體溫和水分平衡。

    3. 皮下組織：在最深層，有脂肪組織能緩衝外力和儲存能量，並幫助保溫。'
  shared_asset: g3_45_46
