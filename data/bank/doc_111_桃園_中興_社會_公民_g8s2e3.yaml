- id: doc_111_桃園_中興_社會_公民_g8s2e3_s2_29
  section: 2
  number: 29
  type: single
  page: 4
  stem: 這起案件中，下列何者屬於行政罰？
  options:
  - label: A
    content: 實施酒測攔檢
  - label: B
    content: 攔停羅先生機車
  - label: C
    content: 吊銷羅先生汽車駕照
  - label: D
    content: 要求羅先生進行酒精濃度測試
  group_stem: '有大客車職業駕照的羅男凌晨喝酒後騎機車，遭員警攔停。員警要求羅男進行酒精濃度測試，但羅男竟趁隙落跑，被依違反道路交通管理處罰條例等規定，裁處新臺幣
    9 萬元、吊銷汽車駕照且 3 年內不得考領駕照，還應參加道路交通安全講習。

    法律規定交通裁決事件免經訴願程序，可直接提起行政訴訟。因此羅男不服，向法院提起行政訴訟指出，他願接受無照駕駛的裁罰，但職業大客車駕照是他養家餬口的工具，不願遭吊銷。法院審理後，認為吊銷拒絕酒測者的駕照，目的在於避免危險駕駛人繼續駕駛而肇事，影響公共安全，因此駁回羅男的上訴。

    （資料來源：改寫自無照酒駕機車，男遭吊汽車駕照，臺灣英文新聞，2014/01/03）'
  tags:
