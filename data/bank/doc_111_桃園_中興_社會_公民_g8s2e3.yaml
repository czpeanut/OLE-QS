  - label: B
    content: 不配合疫情防治措施，最高會被罰到5 萬元
  - label: C
    content: 負責開罰那些不守防疫規範民眾的是警察局
  - label: D
    content: 被要求居家檢疫是政府做出的一種行政處分
  group_stem: '2020 年新型冠狀病毒疫情延燒，臺中市衛生局局長在行動市政會議中，指出有 4 名居家檢疫者不遵守規範，任意外出，已針對其中 2 人開罰
    5 萬元，其餘 2 名民眾也將依規定開罰。

    局長表示，開罰 2 例均經警察局及民政局通報蒐證，確定其行為已違反傳染病防治法規定：「主管機關對入、出國（境）之人員，得施行健康評估或其他檢疫措施，並得徵收費用。」呼籲進行居家隔離與居家檢疫的民眾，務必確實配合，勿擅離指定住所，以免觸法。

    他也強調，民眾若未配合中央流行疫情指揮中心防治措施，將依傳染病防治法裁罰，第一次違規重罰 5 萬元，再次違規將罰最高 15 萬元，並立即執行指定處所強制安置。'
