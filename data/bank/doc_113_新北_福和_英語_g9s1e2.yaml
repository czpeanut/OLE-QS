  stem: 47. What is "e-waste"?
  options:
  - label: A
    content: Waste from food packaging.
  - label: B
    content: Garbage from house-cleaning items.
  - label: C
    content: Waste from plastic products.
  - label: D
    content: Any electronic item that is not used anymore.
  group_stem: 'The United Nations is warning that the growing problem of "e-waste"
    is becoming a huge environmental problem. E-waste means that we no longer use
    some electronic items, such as old phones, computers, TVs, and even things like
    refrigerators and washing machines. Many of these items have toxic chemicals inside.
    They can pollute the environment and be dangerous to our health.

    In 2022, the world threw away about 62 million tons of e-waste. Picture how much
    that is - it can fill over 1.5 million big trucks! If those trucks are lined up,
    they will go all the way around the Earth! Most of this e-waste comes from rich
    countries, but it''s often shipped to poorer countries for recycling. The problem
    is that those countries don’t always have the tools or technology to recycle the
    waste safely. Therefore, toxic chemicals polluted rivers, land and even caused
    harm to wildlife.

    The United Nations says that those companies aren’t doing enough to make their
    products easy to recycle. They also ask people like us not to buy new electronic
    items quickly without thinking about how to deal with the old ones.

    So, what can we do? The UN is asking for better recycling. It means electronics
    should be made to be reused or recycled safely. This would help reduce the total
    number of e-waste and protect the planet.

    In short, e-waste is a big problem. If we don’t do something about it, it could
    harm our health and the environment.


    warn 警告 electronic 電子的 toxic 有毒的 chemical 化學物質 ton 噸 harm 傷害'
