- id: doc_113_新北_福和_英語_g9s1e2_s2_41
  section: 2
  number: 41
  type: single
  page: 3
  stem: 41. What problems are local people in the town near Mount Fuji facing because
    of overtourism?
  options:
  - label: A
    content: Short of food and water.
  - label: B
    content: Crowded shopping malls and fewer hotel rooms.
  - label: C
    content: Trash on the streets, blocked traffic and lots of selfie takers.
  - label: D
    content: Pollution from too many tourism advertisements.
  group_stem: 'Overtourism is causing a big headache for local people in Japan. The
    weaker yen has meant visitors are coming to see Japan''s sights and try its world-famous
    food. A town at the foot of Mount Fuji is taking action to fight against the problem.
    The town is being filled with tourists, and they are taking selfies in front of
    a convenience store with Mount Fuji as the background. The town will make a giant
    wall to block the view of Japan''s iconic mountain.

    A local official said the tourists were throwing trash on the streets and blocking
    traffic, so the town has asked some people to control selfie takers. The official
    said it was sad to have to set up the wall, and the wall will be 20 meters long
    and 2.5 meters high. Other places in Japan are also fighting overtourism. For
    example, some areas of Kyoto have been closed to stop tourists from closely watching
    geishas or even taking photos of them.


     overtourism 過度旅遊 yen 日圓 background 背景 official 官員 geisha 藝妓'
