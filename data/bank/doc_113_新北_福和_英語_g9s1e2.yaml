- id: doc_113_新北_福和_英語_g9s1e2_s2_53
  section: 2
  number: 53
  type: single
  page: 6
  stem: 53. Which of the following ISN’T an example of IoT mentioned in the article?
     mention 提及
  options:
  - label: A
    content: Monitoring cameras.
  - label: B
    content: Planting sensors.
  - label: C
    content: Health checking.
  - label: D
    content: Trust building.
  group_stem: 'The Internet of Things makes our lives easier and helps us take care
    of our homes better. One popular example of IoT is smart home tools. These include
    smart speakers and security cameras: you can use your phone to play music and
    check your home safety from anywhere! IoT is also useful in other areas like healthcare
    and farming. Doctors can use connected tools to check patients’ health from a
    far place. Farmers can use sensors to see how their plants are growing.

    However, there are also concerns about IoT. Because these tools collect personal
    information, it’s important to make sure the data is safe. If it is not safe,
    everyone might break into the network and enter the house easily. Besides, trust
    plays an important part of building online relationship. Without it, people might
    try to avoid uploading their personal information on the Net. All in all, IoT
    is an exciting technology. It helps us in many ways, but we need to be careful
    with other areas.


     include 包含 sensor 感應器 concern 擔憂 data 數據 avoid 避免'
