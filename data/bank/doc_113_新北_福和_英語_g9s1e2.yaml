- id: doc_113_新北_福和_英語_g9s1e2_s2_50
  section: 2
  number: 50
  type: single
  page: 5
  stem: 50. In the reading, which word has the same meaning with dementia?
  options:
  - label: A
    content: Memory loss.
  - label: B
    content: Forgetting things.
  - label: C
    content: Poor memory.
  - label: D
    content: Bad thinking.
  group_stem: 'Many people’s brain cells are damaged. They have trouble in many ways.
    For example, they become lost easily and have poor memory. What’s worse, some
    even put themselves in danger just because of the sickness, dementia. The following
    dialogue is talking about dementia:


    A: Hey, have you ever heard of memory loss before?

    B: No, what is it?

    A: Memory loss is that the brain is damaged and can make you forget things and
    have trouble acting or thinking.

    B: Oh, I see. Is it the same as forgetting things?

    A: Not really. Forgetting things is a specific type of memory loss, but memory
    loss is a bigger condition.

    B: That''s interesting. How does memory loss change people''s daily lives?

    A: Well, people with memory loss may have trouble remembering things, doing tasks,
    or even talking with others.

    B: That must be really hard for them and their family.

    A: It surely is. That''s why it''s important for everyone to understand memory
    loss and give help to care those going through it.

    B: I agree. It''s important to treat them kindly and patiently.

    A: Yes. By telling more people and offering help, we can have a more welcoming
    and understanding community for everyone.


     cell 細胞 loss 喪失 specific 特定的 condition 情況 community 社區'
