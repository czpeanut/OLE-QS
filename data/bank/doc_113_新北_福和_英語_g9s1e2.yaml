- id: doc_113_新北_福和_英語_g9s1e2_s2_44
  section: 2
  number: 44
  type: single
  page: 4
  stem: 44. Why did Nihon Hidankyo get the 2024 Nobel Peace Prize?
  options:
  - label: A
    content: For their hard work to promote peace in Ukraine. promote 宣導
  - label: B
    content: For their pushing for a world without nuclear weapons.
  - label: C
    content: For helping to rebuild Hiroshima and Nagasaki.
  - label: D
    content: For their support of no nuclear weapons in North Korea.
  group_stem: 'The 2024 Nobel Peace Prize has been given to Nihon Hidankyo, a group
    of survivors of the atomic bombings of Hiroshima (廣島)and Nagasaki(長崎) in Japan.
    The group was created in 1956. For the past many years, they have worked to end
    nuclear weapons and prevent another bombing like the ones that gave huge damage
    to their cities.

    The Nobel Committee praised Nihon Hidankyo for their hard work to create a world
    free from nuclear weapons. The atomic bombs dropped on Hiroshima and Nagasaki
    killed between 150,000 and 250,000 people. The survivors have worked hard to make
    sure the world never forgets the horrors of those attacks.

    Even with their hard work, the world still faces new threats from nuclear weapons.
    Countries like Russia, North Korea, and Iran are increasing their nuclear power,
    and many fear that nuclear war could happen. For example, Russia said that it
    could lead to a nuclear war if the US continues supporting Ukraine. North Korea
    has also been building more nuclear weapons, and Iran is believed to try to do
    the same.

    So, the Nobel Peace Prize for Nihon Hidankyo gives an important message that nuclear
    weapons are too dangerous for any country to use. Their work shows how important
    it is to continue pushing for a world without nuclear weapons. When the world
    faces new nuclear threats, the advice of Hiroshima and Nagasaki’s survivors keeps
    clear: the use of nuclear weapons must never happen again.


    survivor 倖存者 atomic 原子的 nuclear weapon 核武 praise 讚揚 threat 威脅 increase 增加'
