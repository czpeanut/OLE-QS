  stem: '52. Peter is making a report about dementia. Here are his findings:


    Alzheimer and dementia are often seen the same, but they are actually different.
    Alzheimer is the most common type of dementia, and memory changes are its most
    common signs. Sadly, there is no way for this disease. Dementia, on the other
    hand, is not a single disease but a group of symptoms caused by different conditions.
    Some people can even be cured if they are treated early.

     disease 疾病 symptom 症狀 cure 治療 single 單一的


    Peter shows his findings in the table below. Which column is WRONG?  column 欄位


    | | (A) definition | (B) common sign | (C) cure | (D) disease |

