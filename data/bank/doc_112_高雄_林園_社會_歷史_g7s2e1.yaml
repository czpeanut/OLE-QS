- id: doc_112_高雄_林園_社會_歷史_g7s2e1_s1_27
  section: 1
  number: 27
  type: single
  page: 1
  stem: '關於下列兩則資料的敘述，何者正確？

    資料一：為因應當時世界風行的潮流，日本政府開始強調「日臺合一，一視同仁」，但臺灣人始終未獲得與日本人相同的待遇。

    資料二：總督府開始要求大家要說日語、穿和服、改日本姓氏並頒發「國語家庭」門牌與認定證書。'
  options:
  - label: A
    content: 資料一所說世界風行的潮流是民主自決思潮
  - label: B
    content: 資料一的統治階段，臺灣武裝抗日運動頻繁
  - label: C
    content: 資料二所述時期，日本尊重臺灣的原鄉信仰
  - label: D
    content: 資料二的統治階段後期，開始徵召台人當兵
  answer:
  - D
  answer_source: answer_key_vlm
  tags:
    chapter:
