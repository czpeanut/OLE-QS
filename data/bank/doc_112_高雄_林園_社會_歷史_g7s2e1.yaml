- id: doc_112_高雄_林園_社會_歷史_g7s2e1_s1_28
  section: 1
  number: 28
  type: single
  page: 1
  stem: '由兩則資料的內容來看，其所談論的主題應該是下列何者？

    資料一：一九○○年代，歐陸各國競相充實軍備，臺灣樟腦的出口量也創新高，西元1900～1907 年間，樟腦專賣利益占臺灣總督府年度總歲入平均15.5％左右。第一次世界大戰爆發前夕，歐陸各國向日本(含臺灣)購買大量樟腦以充實軍需，西元1910～1916
    年間，日本每年樟腦出口量均達九百萬至一千萬公斤之間，占世界總產值的70％，其中產自臺灣的便占了其中80％以上。

    資料二：因樟腦的鉅額利益，驅使日本殖民政府推動更積極主動的理蕃政策，總督佐久間左馬太上任後，於西元1910 年宣示推動「五年理蕃計畫」，在理蕃政策下，失去土地和工作的「蕃人」，其命運……。

    資料來源：臺灣博物季刊107 期，2010 年。'
  options:
  - label: A
    content: 漢人抗日勢力的發展
  - label: B
    content: 總督府教育原住民族
  - label: C
    content: 日治時期的理蕃政策
  - label: D
    content: 皇民化政策下的原住民生活
  answer:
  - C
  answer_source: answer_key_vlm
