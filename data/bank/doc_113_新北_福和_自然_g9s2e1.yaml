  type: single
  page: 1
  stem: 有關家庭用電的敘述，下列何者錯誤？
  options:
  - label: A
    content: 利用延長線連接出無數個插座，是安全的用電方式
  - label: B
    content: 身體或站立處潮溼時，不可接觸電源
  - label: C
    content: 同時使用的電器越多，總開關處匯集的電流會越大。故應在總開關與家用電器之間串聯合適的保險絲，以防電流量過大而引起火災
  - label: D
    content: 不可使用銅線代替保險絲或無熔絲開關。
