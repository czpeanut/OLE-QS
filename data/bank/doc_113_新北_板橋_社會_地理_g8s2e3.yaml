  city: 新北
  school_short: 板橋
  school: 新北市立板橋國中工新北市立板橋國中113 學年度第2 學期第3 次段考8 年級社會領域(地理科)試題卷 1. 漠南非洲許多國家在歷經殖民後，經濟結構仍高度依賴單一或少數主要的出口商品，如農產品（例如可可、咖
    啡）或礦產資源（例如石油、金礦）。這種依賴的經濟模式，常使國家面臨多重發展挑戰。請問，此種經濟模式可 能產生何項風險？ (A) 國內缺乏工業化基礎，難以發展多元產業，經濟結構單一。
    (B) 國際市場價格大幅波動，導致出口收入不穩定，經濟易受衝擊。 (C) 大量土地集中種植經濟作物，減少糧食自給，依賴進口嚴重。 (D) 外資企業掌控資源，剝削本地農民與工人，造成社會不公平。
    2. 非洲為擺脫對石油產業的高度依賴，近年來積極發展太陽能等再生能源。圖【一】為非洲地區太陽能資源的分布 情形（顏色越深表示太陽能潛力越高）。請問:下列何者設置太陽能板的成效較差?
    (A) 剛果盆地 (B) 納米比沙漠 (C) 撒哈拉沙漠 (D) 東非高原。 圖【一】 圖【二】 圖【三】 3. 圖【二】是全球電力普及比例圖，有些地區幾乎全民享有穩定用電，有些地區則仍有較大比例人口缺乏穩定電力
    供應。請問:影響各地電力普及程度的最主要因素為何？ (A) 地區日照時間的長短，影響太陽能發電量 (B) 緯度位置不同，導致氣候差異造成用電需求不同 (C)
    是否擁有能源礦產資源，如煤、天然氣等 (D) 工業與經濟發展程度，影響電力基礎建設。 4. 圖【三】為非洲各國最主要的自然資源分布圖。南非蘊藏著大量的黃金與鑽石，吸引過無數淘金者與探險家前來
    尋寶。請問，南非之所以擁有這麼豐富的礦產資源，最主要與下列哪一項自然環境因素有關？ (A) 位於板塊張裂帶，地殼活動頻繁 (B) 地質古老，利於礦產的形成與保存
    (C) 氣候乾燥炎熱，利於礦石裸露與開採 (D) 地勢低平，方便人們進行開採和搬運礦物。 5. 承上題，一位來自OPEC 成員國的移工描述家鄉的自然環境：「我們國家的森林覆蓋率非常高，擁有豐富的生物多
    樣性，是許多珍貴動植物的家園。」請根據圖【三】判斷，這位移工的家鄉最可能位於圖中哪個地區？ (A) 甲 (B) 乙 (C) 丙 (D) 丁 6. 非洲雖然擁有豐富的自然資源，但許多地區卻長期受到乾旱與缺水問題的困擾，影響到居民飲水、農業灌溉，甚
    至引發糧食危機，因此改善水資源困境是非洲發展的重要課題。請問:非洲大部分地區缺水的自然因素為何? (A) 位於低緯度地區，氣溫高，水分蒸發旺盛 (B) 副熱帶高壓帶籠罩，氣流下沉抑制降水
    (C) 非洲面積廣大，水氣難以深入內陸地區 (D) 水氣受高原阻擋，導致降雨稀少。 7. 你知道未來的世界地圖可能會長得不一樣嗎？在非洲東部，有一條長達數千公里的大地裂痕—東非大裂谷，這是
    地球內部力量正在進行中的「改造工程」之一。由於地殼長期受到張裂作用的影響，谷地正逐漸擴大。根據地質 學家的推測，若此地質活動持續進行，百萬年後，一個位於東北方的水域將可能滲入這片低地，導致東非從非洲
    大陸上逐漸分離，形成一座新的大型島嶼。這樣的變化不僅改寫地理圖像，也顯示地球仍是一顆不斷變動的星 球。請問:地質學家所推測的這個可能流入東非大裂谷的水域為何？
    (A) 紅海 (B) 阿拉伯海 (C) 地中海 (D) 黑海 。 8. 南非好望角是著名的岬角和航海地標。在蘇伊士運河尚未通航的期間，歐洲與亞洲之間的船隻必須繞道好望角，
    是連接兩大洲的重要航道。因其地理位置和海流交會，海象常變幻莫測，歷來多艘船隻曾因風浪而擱淺或失事， 因此有「海上墳場」的稱號。請問:好望角位於哪兩大洋的交會處？
    (A) 太平洋與大西洋 (B) 印度洋與太平洋 (C) 大西洋與印度洋 (D) 大西洋與地中海 9. 近年來非洲音樂興起，知名串流平台spotify 為搶進非洲市場。為因應非洲許多地區缺乏信用卡與銀行帳戶的現
    況，Spotify 與當地行動支付系統M-Pesa 合作，推出便捷付款方式。截至2020 年，漠南非洲已有超過5.48 億個 行動支付帳戶，展現高度的數位轉型潛力。請問：串流音樂平台積極布局非洲市場，主要看中該區域具備什麼樣
    的優勢？(A) 豐富的自然資源 (B) 穩定的糧食供應能力 (C) 廣大的潛在消費族群 (D) 富創造力的音樂傳統。新北市立板橋國中
