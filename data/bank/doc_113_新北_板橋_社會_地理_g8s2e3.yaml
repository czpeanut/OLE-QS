  stem: 你知道未來的世界地圖可能會長得不一樣嗎？在非洲東部，有一條長達數千公里的大地裂痕—東非大裂谷，這是地球內部力量正在進行中的「改造工程」之一。由於地殼長期受到張裂作用的影響，谷地正逐漸擴大。根據地質學家的推測，若此地質活動持續進行，百萬年後，一個位於東北方的水域將可能滲入這片低地，導致東非從非洲大陸上逐漸分離，形成一座新的大型島嶼。這樣的變化不僅改寫地理圖像，也顯示地球仍是一顆不斷變動的星球。請問:地質學家所推測的這個可能流入東非大裂谷的水域為何？
