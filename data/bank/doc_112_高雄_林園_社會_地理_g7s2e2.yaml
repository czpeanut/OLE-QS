    成產能集中於本土的策略，而必須進入新一輪全球化的布局世代。台積電「放眼全球、根留台灣」的投資策略遂成為台灣半導體廠的指標參考對象。台積電為降低對地緣政治緊張局勢的脆弱性，試圖通過將資產分散到全球(如地理圖四所示)，至於台灣依舊扮演先進製程與先進封裝產能的關鍵生產重鎮，畢竟本土生產的性價比仍遠高於海外，而除了新竹寶山的2
