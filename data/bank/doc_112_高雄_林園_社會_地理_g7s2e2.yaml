  stem: 台灣土地小、高溫多濕，先天不利發展酪農業，但隨著國內酪農過去60 年的努力，台灣不管是飼養技術、牛乳品質與產業的建構上都有所成長。近年來積極推廣酪農業，頗具規模的牧場紛紛建立，台灣的酪農產區主要分布於西南方，其中屏東萬丹、彰化福興、雲林崙背及臺南柳營為「四大酪農專區」，產乳量佔了全國約
    4 成。但隨著台灣人牛乳飲用量逐年攀升，國產生乳不僅依然是供不應求，價位居高不下，且根本無法拿來發展其他乳製品產業。請問台灣此種畜牧業發展的目的為何？
