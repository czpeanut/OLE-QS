  stem: '小潔在一本名為《跟著成語學歷史》的書中，看到了下列的成語典故。根據內容判斷，這些成語事件所對應的朝代出現時間順序，應為下列何者？

    甲、作法自斃：商鞅推動改革，因執法嚴苛引起貴族們的怨恨。新君繼位後便有人誣告商鞅謀反，使其最終因此被處決。

    乙、分道揚鑣：孝文帝遷都洛陽後，當地漢人官員與鮮卑貴族因爭奪路權而產生衝突，孝文帝聽到後要求他們將道路劃分為兩半，車輛分邊行駛，便不再有爭執。

    丙、春風得意：孟郊在科舉考試多次落榜後，終於在中年時金榜題名。放榜當天，他騎著馬、迎著春風四處遊覽，寫下「春風得意馬蹄疾，一日看盡長安花」的詩句。

    丁、揭竿而起：國家耗費巨資興修長城及帝王陵寢，以致陳勝能以平民之姿，用砍下的樹枝為兵器，高舉竹竿作為號召群眾的旗幟，使得天下人群起反抗政府'
  options:
  - label: A
    content: 甲乙丙丁
  - label: B
    content: 丁甲丙乙
  - label: C
    content: 甲丁乙丙
  - label: D
    content: 乙丁甲丙
