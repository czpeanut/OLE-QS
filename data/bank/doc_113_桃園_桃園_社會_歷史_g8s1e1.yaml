  stem: '下面三則資料為中國歷史上重要的選才制度，依據三則資料出現的先後次序加以排列，其先後次序應該為何？


    資料一  政府透過開科取士的方式來選拔人才，其中包含：進士、明經、明法、明算等科別，只要有能力者都可以報考，為平民晉升開啟了一道大門。

    資料二  政府授權中正官在地方上進行人物品評，依據士人的才能、德行與家世來區分品級，但之後品評只重家世，結果造成「上品無寒門，下品無世族」的現象。

    資料三  朝廷根據政府的不同需要設立各種科目，包含：「孝子」、「廉吏」等，並指定有關的官員擔任推舉者，依照規定舉薦相應的人才，經朝廷檢定後給予錄用或升遷。

    資料來源：傅樂成(2008)。中國通史。新北：弘揚圖書。'
