- id: doc_113_台中_大業_英語_g9s2e2_s5_45
  section: 5
  number: 45
  type: single
  page: 7
  stem: What does the word “misconception” mean?
  options:
  - label: A
    content: A study that is important.
  - label: B
    content: An idea that is not true.
  - label: C
    content: Information that is useful.
  - label: D
    content: Machines that are not helpful.
  group_stem: 'Vincent: Hey, guys. You know what! Dishwashers are really a game-changer
    in the kitchen. My life has changed a lot since I bought one last week! I just
    need to put all the dishes into the machine and push the start button. Then I
    can go watch TV. No more washing, no more drying…… Think about how much time I
    can save with it!

    TingTing: A dishwasher? I’m not sure about that. Don’t you need more water to
    wash the dishes with the machine than hand washing? Also, I still think dishes
    washed by hands are much cleaner.

    Shirley: Well, it’s actually a misconception. A study pointed out that modern
    dishwashers use far less water than hand washing, which can use up to 20 gallons
    of water every load, while dishwashers use only about 3-5 gallons.

    Paco: I have been using the dishwasher for 3 years. It’s true that dishwashers
    save more water when you run a full load. That’s why I don’t wash dishes after
    every meal. Instead, I collect them and do it only once every day after dinner.

    Vincent: As for whether the machine can wash the dishes better than humans, it
    depends on if you use it correctly. For example, you need to rinse the dishes
    first to wash away the food left. You also need to place the dishes in order,
    or the machine can’t reach every angle of them. But in short, I think it is very
    useful.

    TingTing: Sounds good. Maybe I should get one as well! I will order one online
    now!

    Vincent: Don’t hurry into a decision. First of all, a dishwasher might cost you
    a lot, and your kitchen has to be big enough for it. It’s better you have everything
    planned out first.

    Shirley: Vincent’s got a point. Besides, not all items can be put into a dishwasher.
    Some items, like non-stick pans, may not be dishwasher-safe and can be damaged
    in the machine. What’s more, I don’t want to wait for 1-2 hours for the dishes
    to be done by the machine. And I don’t want them to be dirty all day, either.
    I guess washing them myself is the best for me.


     gallon 加侖(容量單位)；load 裝載量、裝載；rinse 沖洗；decision 決定；non-stick pan 不沾鍋'
