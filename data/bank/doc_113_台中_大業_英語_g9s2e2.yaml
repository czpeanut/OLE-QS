  group_stem: 'Picture that you try to drink sea water when you are thirsty. You''d
    end up feeling even thirstier, and maybe even getting sick! That''s why no one
    drinks sea water. But what happens when you''re stuck in a place with no other
    water to drink?

    That''s the case in the United Arab Emirates (UAE), one of the driest countries
    in the world. It''s a land of deserts, with almost no rivers and very little rain.
    The only water they have is salty sea water, and even most of their underground
    water is salty, too. This isn''t just a problem in the UAE. Almost all the water
    on Earth is either too salty or in the form of ice, making it not able to drink.
    But the people of the UAE have found some smart ways to get the water they need.

    First, they collect sea water and take out the salt in it with special machines.
    These machines are like giant water filters. They push the sea water through and
    catch the salt, letting only fresh, drinkable water pass by. Every day, billions
    of liters of sea water are turned into fresh water, enough to provide for almost
    all the people in the country.

    Next, they do something even crazier: they make their own rain! They send planes
    up into the clouds and drop salt. The salt helps the clouds grow bigger and bigger,
    until raindrops fall from the clouds. This is called “cloud seeding”, and they
    do it almost every day in the UAE. When the rain falls, they collect it in huge
    dams, providing even more fresh water.

    So, next time you see a glass of water, think about how much it takes to get that
    water to you. People in the UAE are working hard to find water, and we should
    all try our best to save it.


