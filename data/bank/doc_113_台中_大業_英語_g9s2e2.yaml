  group_stem: 'We all want to be heard and understood when talking with others. The
    key isn’t just about the words we say but how we say them. Here are some tips
    that help us to have a better conversation. To start with, ___(48.)___ is the
    most powerful ways. Instead of jumping in with advices, listen to what they want
    to say first. People feel valued when they’re heard, not just answered. Second,
    starting a sentence with “I” is another way to make a conversation go better.
    This helps people feel understood, not blamed. Here are two sentences: “I feel
    tired when I do all the work alone.” and “You never help with anything.” The first
    sentence surely sounds ___(49.)___ the second one. Next is to respect others’
    feelings. To do so, you don’t always have to feel the same ways as them. Let them
    know you understand how they feel ___(50.)___ you don’t think so. For example,
    say “I see why you are so angry about what he said.”, but actually, you may not
    think being angry is the best thing to do. Last, showing some thanks goes a long
    way, too. When someone does something well, take a moment to let them know it.
    You could say, “___(51.)___” By doing so, your relationships will become better
    and stronger. Also, this will lead to more kindness between you and the people
    around you. Practice these tips when you talk with your friends or family and
    see how they work for you!


     conversation 對話；advice 建議；valued 受重視的；blame 責怪；relationship 關係'
