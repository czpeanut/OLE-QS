  stem: 'Four students made a conclusion on high heels in history. Which one is correct?

     conclusion 結論'
  options:
  - label: A
    content: 'Levi: The love for high heels keeps growing until now.'
  - label: B
    content: 'Violet: Men are getting more interested in high heels than women.'
  - label: C
    content: 'Daniel: It has experienced many ups and downs in history.'
  - label: D
    content: 'Emma: It sees a great drop in history but then climbs back again.'
  group_stem: 'The Story behind high heels

    ① 5000 years ago in Egypt

    Butchers, people who kill animals for their meat as a job, wore high heels to
    keep their feet out of the animal blood on the floor.

    ② The 10ᵗʰ century in the Middle East

    High heels turned into boots for soldiers to wear when they ride on a horse to
    keep them from falling off the horseback.

    ③ The 15ᵗʰ century

    High heels were worn by both men and women to keep their clothes away from muddy
    streets. It also showed a person’s place in the society, the higher the shoes,
    the higher the wearer’s place.

    ④ The 17ᵗʰ century in France

    King Louis the 16ᵗʰ made high heels with red bottoms popular among upper classes.
    This short king wore up to 12-centimeter-high heels to show his power.

    ⑤ The late 18ᵗʰ century in France

    The French Revolution brought a great change in fashion. People said no to high
    heels because they were signs of the once rich and powerful upper class. Instead,
    people wore simpler and more practical shoes.

    ⑥ The 19ᵗʰ century

    High heels became popular again thanks to better skills of making shoes. Factories
    with modern machines made more shoes faster than before, making high heels less
    expensive. The number of people wearing high heels grew largely.

    ⑦ The 20ᵗʰ century

    This century marked an important time in the design of high heels. The heel looks
    long and thin, just like the knife it got the name, stiletto, from. At this point,
    high heels became a must-have for women.


     heel 鞋跟；century 世紀；boot 長靴；society 社會；practical 實用的'
