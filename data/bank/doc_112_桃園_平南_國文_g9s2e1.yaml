  group_stem: "左慈：字元放，廬江人也。少有神通。嘗在曹公座，\n【甲】公笑顧眾賓曰：「今日高會，珍羞略備。所少者，吳 松江鱸魚為膾。」放曰：「此易得耳。」因求銅\
    \ 盤貯水，以竹竿餌釣於盤中，須臾，引一鱸魚出。公大拊掌，會者皆驚。\n【乙】公曰：「今既得鱸，恨無蜀中生薑耳。」放曰：「亦可得也。」\n【丙】公恐其近道買，因曰：「吾昔使人至蜀買錦，可告吾使，使增市二端。」人去，須臾還，得生薑。又\
    \ 云：「於錦肆下見公使，已敕增市二端。」\n【丁】公曰：「一魚不周坐客，得兩為佳。」放乃復餌釣之。須臾，引出，皆三尺餘，生鮮可愛。公便自前 膾之，周賜座席。\n\
    \ 後經歲余，公使還，果增二端。問之，云：「昔某月某日，見人於肆下，以公敕敕之。」\n 改寫自《搜神記》\n注釋：(1)端：古代布帛的長度單位 (2)錦肆：此指出售錦緞的店舖"
