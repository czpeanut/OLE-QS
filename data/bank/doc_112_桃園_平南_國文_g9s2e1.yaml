  group_stem: "魏王遺楚王美人，楚王說之。夫人鄭袖知王之說新人也，甚愛新人，衣服玩好，擇其所喜而為之；宮室臥具，擇其所善而為之。愛之甚於王。王曰：「婦人所以事夫者，色也；而妒者，其情也。今鄭袖知寡人之說新人也，其愛之甚於寡人，此孝子所以事親，忠臣之所以事君也。」\n\
    \ 鄭袖知王以己為不妒也，因謂新人曰：「王愛子美矣。雖然，惡子之鼻。子為見王，則必掩子鼻。」新人見王，因掩其鼻。王謂鄭袖曰：「夫新人見寡人，則掩其鼻，何也?」鄭袖曰：「妾知也。」王曰：「雖惡，必言之。」鄭袖曰：「其似惡聞君王之臭也。」王曰：「悍哉！」令劓之，無使逆命。\
    \ 《戰國策·楚策四》\n注釋：(1)遺：贈送 (2)說：通「悅」，喜愛 (3)惡：音ㄨˋ，討厭 (4)劓：音ㄧˋ，古代割去鼻子的刑罰"
