  group_stem: "(43~44)\nDear Mr. Chang,\n  I just learned over the radio that you\
    \ feel as bad as I do about the way people use their smartphones.  Very often\
    \ in public places, people speak loudly on their smartphones, and we have to hear\
    \ about other people’s business.  But who cares about that?  Not me!  Why should\
    \ I know the life of people I don’t even know?  It’s really nice that someone\
    \ famous like you speaks out for a quiet living space.\n  And it’s even more wonderful\
    \ to know that you yourself always talk quietly when you have to use the smartphone\
    \ in public places.  Thanks for NOT sharing what you are talking about.  We have\
    \ shared too much noise already!\n                                           \
    \                     A Person on Your Side"
