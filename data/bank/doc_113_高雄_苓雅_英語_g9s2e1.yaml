  group_stem: "(36~38)\nThe earth is getting warmer with more and more greenhouse\
    \ gases in the atmosphere.  To better understand how greenhouse gases heat up\
    \ our earth, we should first know  (36) .  A greenhouse is a special house made\
    \ of glass for plants.  It holds the heat of the sun so that the plants inside\
    \ can grow better.  Some gases in the atmosphere work like a greenhouse and can\
    \ keep the heat of the sun, so we call them greenhouse gases.  Greenhouse gases\
    \ help our earth stay warm enough for animals and plants.  In fact,  (37) .\n\
    \   There is, however, a big problem.  More greenhouse gases than our earth needs\
    \ are entering the atmosphere because of the way we live.  (38) , with a great\
    \ number of cars, there is too much CO2, a common greenhouse gas, and farm animals\
    \ give off a lot of CH4, another greenhouse gas.  If we want to “cool down” our\
    \ earth, a good start is to change our way of life, like driving less and eating\
    \ less meat.\n gas 氣體  atmosphere 大氣層  give off 放出(氣體)"
