  group_stem: 西元2014 年巴基斯坦少女馬拉拉(Malala Yousafzai)才17 歲，為諾貝爾和平獎的最年輕得主。12 歲的她在英國廣播公司(BBC)以「巴基斯坦女學生的日記」專欄，記錄在塔利班(Taliban)統治下的親身經驗與生活，其中包括禁止女孩上學，以及各種恐怖活動。後來，馬拉拉的日記引起了許多人的關注，但隨著知名度愈來愈高，讓塔利班決定對她下毒手，開槍射殺馬拉拉頭部，生命一度垂危，塔利班還宣稱是馬拉拉不接受警告、堅持上學。幸好，在英國醫院努力搶救之下，她幸運的康復，迄今她持續不斷的在為女孩的教育奔走與發聲。馬拉拉曾說過一句讓人印象深刻的話：「讓我們拿起我們的課本和筆吧！因為它是我們最有力量的武器。」
