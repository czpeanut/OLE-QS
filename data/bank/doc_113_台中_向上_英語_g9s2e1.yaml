- id: doc_113_台中_向上_英語_g9s2e1_s1_35
  section: 1
  number: 35
  type: single
  page: 2
  stem: In which book can you most likely find this reading?
  options:
  - label: A
    content: All about Bacteria:The living things you can’t see can make you sick
  - label: B
    content: 'What’s That Smell?: Is that the smell of blue cheese? No, it’s your
      feet.'
  - label: C
    content: 'Ten Ways to Eat Cheese: Want to eat cheese in a new way?'
  - label: D
    content: 'More Than Hamburger Cheese: Become a cheese know-it-all.'
  group_stem: 'Below is the information about Brie and blue cheese in a book.


    Brie cheese

    Brie is a French cheese made from cow’s milk. “Brie” is the name of

    a place where the cheese was first made. Brie is soft, but its texture

    doesn’t change much with heat. It is very good for people because it is a

    good source of portein and Vitamin B. To make Brie, you need to put

    Brevibacterium linens, a kind of bacteria, into whole milk. This mix of

    milk and bacteria needs to be kept at the same temperature for four to five

    weeks. Brie is usually eaten with fruit or nuts.


    Blue cheese


    “Blue cheese” makes many people run away because they think it

    smell like feet. One of the bacteria added to this cheese is Brevibacterium

    linens, which is responsible for the smell! The cheese was found when a

    boy left his cheese out for too long. The most interesting part of blue

    cheese is the blue lines that can be seen throughout the cheese. They are

    formed by another kind of bacteria: Pencillium. Blue cheese can be eaten

    by itself or melted into or over other food.


    ★texture 質地 temperature 溫度source 來源 protein 蛋白質 bacteria 細

    菌 nut 堅果 melt 融化'
