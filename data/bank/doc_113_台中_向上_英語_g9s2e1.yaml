  group_stem: "Lake Town News                           September 10, 2024\n\nElementary\
    \ schools in Lake Town started last Monday. The total of\nGrade 1 students in\
    \ 2024 is 36,005, 1678 more than in 2023. During the\npast five years, the number\
    \ of Grade 1 students in this town has grown\nabout 15%. It’s mainly because the\
    \ population of Lake Town grew to\nabout 3.8 million in 2023.\n\nWhat do you think\
    \ about the increase in Grade 1 students in Lake\nTown? Tell us!\n\nGood for Lake\
    \ Town! While lots of towns and cities in Dreamland are\nfacing a shrinking population,\
    \ this town is believed to have a population\nof 4 million in 2035. Before that,\
    \ we should build more elementary\nschools…                                  \
    \         ~Jasmine\n\nI don’t know if it’s good news. There are not enough elementary\
    \ schools\nhere, so most of the Grade 1 classes have more than 40 students….\n\
    \                   ~ Snow White\n\nI agree with Snow White. My grandson entered\
    \ elementary school this\nschool year. It is difficult for a teacher to take good\
    \ care of all the 45 kids\nin class…                                         \
    \    ~Hoodie\n\nMy daughter is studying in Grade 1. Even though there are 38 students\
    \ in\nher class, it doesn’t worry me. What I care most is a good school and\n\
    excellent teaching. That’s why we moved to Lake Town three years ago…\n~Elsa\n\
    ★ population 人口 increase 增加"
