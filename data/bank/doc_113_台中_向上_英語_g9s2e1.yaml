- id: doc_113_台中_向上_英語_g9s2e1_s1_32
  section: 1
  number: 32
  type: single
  page: 2
  stem: Why did Judy write this letter to Mr. Wilson?
  options:
  - label: A
    content: To welcome him to be her new neighbor.
  - label: B
    content: To tell him what to do to be a good neighbor.
  - label: C
    content: To ask him how to take care of his pet nicely.
  - label: D
    content: To teach him when to take out the trash.  ★according to 根據
  group_stem: 'Dear Mr. Wilson,


    My name is David, and I am your neighbor next door. You may be

    surprised to get this letter since you just moved in this building. But the

    fact is, I need to talk to you about some things you have done, and they

    really give me a headache. I know you are a hospitable person who enjoys

    being together with friends. That’s why you always hold parties and

    invite your friends home. I totally understand that you want to have

    fun and spend some time with your friends, but sometimes you get too

    loud. You sing and shout even late at night, so I can’t sleep at all. When

    you are partying, your pet dog barks loudly, too, which makes things

    even worse. The most terrible thing is that every time you finish your

    party, you just put all the trash in front of your door. It gives off bad

    smell and attracts lots of bugs and cocoroaches. All the neighbors are

    unhappy, but they don’t know what to do about it.


    So, Mr. Wilson, if you care about how your neighbor feel, you

    should try to make some changes. First, you need to stop making so

    much noise when it’s late. Think about those who need to get up early for

    school or work. What’s more, take care of your dog. Don’t let it bark late

    at night. Last, you should clean your trash and keep our building clean.

    The trash truck comes at six thirty every evening, and if you need any

    help, I’d be glad to give you a hand. If you can make these changes, I

    believe our building will be the best place in our neighborhood.

    Your neighbor,

    Judy

    ★bark 吠叫attract 吸引 cockroach 蟑螂'
