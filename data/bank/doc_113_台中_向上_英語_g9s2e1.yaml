  - label: D
    content: Seahorse.
  group_stem: '(Melisa and her husband, Mike, are having their honeymoon in Taiwan.)

    Mark: I have no idea how to get to Peng-hu.

    Melisa: Don’t worry. Ela told me we could leave from the ports in Chia-yi

    or Kaohsiung and take the ferry there. But we’ll need to think about

    how long it will take us to the port and when we will arrive in

    Peng-hu.

    Mark: So, what’s next?

    Melisa: Let me google the time and course of the ferry first.


    | Ferry | from | Departure | Arrival | Full/half ticket |

    | :--- | :--- | :--- | :--- | :--- |

    | Sunny | Chia-yi | 9:30 | 10:45 | 850/500 |

    | Rainbow | Chia-yi | 10:30 | 11:30 | 1000/600 |

    | Star | Chia-yi | 11:30 | 12:45 | 850/500 |

    | Seagull | Kaohsiung | 8:00 | 11:20 | 900/450 |

    | Seahorse | Kaohsiung | 8:00 | 11:45 | 900/450 |


    ◆Full ticket: Above age 13  ◎Book at least two weeks earlier, get 20% off

    Half ticket: Age 3 to 12

    Children below age 3: $100

    ★ferry 渡輪 port 港口 departure 出發 arrival 抵達'
