- id: doc_113_高雄_左營_英語_g9s1e2_s2_23
  section: 2
  number: 23
  type: single
  page: 3
  stem: Compared (比較) with gas cars, what is NOT true about electric vehicles?
  options:
  - label: A
    content: Electric vehicles needs batteries to run on.
  - label: B
    content: It takes longer time to recharge EV.
  - label: C
    content: Electric vehicles cause more health problems.
  - label: D
    content: Electric vehicles make less CO2.
  group_stem: 'More and more people choose electric vehicles (EV) as their transportation
    tool, instead of traditional gas cars. Following table shows the differences between
    electric vehicles and traditional gas cars.


    | | Electric Vehicles (EV) | Gas cars | |

    |---|---|---|---|

    | The cost of operaiton | low | high | See Note 1 |

    | The way they run on | batteries | gas | |

    | Where to get energy | at home, at work, at the stores | at the gas stations
    | See Note 2 |

    | Time spent on getting energy | hours to recharge | minutes to refuel | |

    | The emission of CO2 | less | more | See Note 3 |

    | Air pollution | less | more | See Note 4 |


    Note:

    1. Some studies have shown that the average cost for an EV was around $485 per
    year and a gas car was at $1,117. Other studies found that EV drivers are likely
    to spend almost 60% less on operation costs.

    2. As more and more EV hit the market, the number of new recharging stations will
    increase. There will be more recharging stations in the public places, such as
    supermarkets, parking lots, workplaces, etc.

    3. The average CO2 emission of EV is 54% less than that of gas cars.

    4. The largest reason of air pollution in the US is cars. The emissions from gas
    cars might have some bad effects for health.

     electric vehicle 電動車; transportation 運輸; operation 運作; battery 電池; recharge
    充電; refuel 加油; emission 排放; average 平均; be likely to 可能; increase 增加; reason 理由;
    effect 效果;'
