- id: doc_113_高雄_左營_英語_g9s1e2_s2_19
  section: 2
  number: 19
  type: single
  page: 2
  stem: What can we learn from the reading?
  options:
  - label: A
    content: It is not common to find typos in e-mails or text messages.
  - label: B
    content: All typos are interesting.
  - label: C
    content: Typos don’t matter at all.
  - label: D
    content: Typos could cause serious problems.
  group_stem: 'Have you ever sent an e-mail or a text message with typos? Maybe you
    are just not careful enough to type right, or maybe you notice the mistake, but
    you just don’t care.

    Some people say that typos are small mistakes, and they don’t matter at all. Is
    that true? Some typos could be funny actually. For example, when you are waiting
    at a park to meet your friend, you get his text message: “Where’s the pork?” You
    know what your friend means, so you text back a laughing face and tell him where
    the park is. However, some typos are not funny at all. Imagine that you just sent
    an e-mail to your teacher, Miss Lin. And you suddenly found that you typed the
    words “Dead Miss Lin” in the e-mail. You have to say sorry right away because
    this typo could really annoy her.

    A small mistake can casue big trouble. Before you send any important e-mails or
    text messages, make sure there are not any typos. You don’t want to make any stupid
    mistakes, right?

     text message 簡訊; typo 打字錯誤; cause 造成'
