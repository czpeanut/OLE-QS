  - label: B
    content: how often people yawn a day
  - label: C
    content: why people yawn
  - label: D
    content: how yawning gives people energy
  group_stem: 'People yawn not only when they are tired, but also when they are bored,
    sleepy or even when they are on the plane. There are a lot of other things that
    make people yawn. You probably yawn while you are reading this passage. However,
    nobody really knows (29) .

    Some believe that people yawn when they are tired. When we are tired, our brain
    temperatures rise. This makes our brains slow down. Yawning cools our brain off
    and (30) .

    Some studies show that people yawn to show others that they feel the same way
    that other people do. (31) , we yawn, too. We don’t think about this action. We
    just do it. Yawning shows other people that we are all part of the same group.
    Perhaps this makes us feel less lonely.

    Other studies show that people yawn to make the air pressure in their ears the
    same as the air pressure outside. For example, the air pressure changes when a
    plane takes off or lands, and people (32) . This is why you will often see people
    yawning on planes.

    There are so many theories about what makes people yawn. People need to study
    more about it.

     yawn 打哈欠; probably 可能; temperature 溫度; pressure 壓力; theory 理論'
