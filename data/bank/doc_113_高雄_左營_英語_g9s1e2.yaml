- id: doc_113_高雄_左營_英語_g9s1e2_s2_21
  section: 2
  number: 21
  type: single
  page: 3
  stem: What is Kerry worried about?
  options:
  - label: A
    content: She is worried Jack smokes with the two ninth graders.
  - label: B
    content: She is worried Mr. Wang won’t believe her.
  - label: C
    content: She is worried the two ninth graders will follow her after school.
  - label: D
    content: She is worried the two ninth graders will bully Jack.
  group_stem: 'Kerry: Sandy, I am worried about Jack.

    Sandy: What happened to him?

    Kerry: I have seen him walk with two ninth graders many times.

    Yesterday after school, I saw the three guys take out cigarettes from their schoolbags,
    and I also saw

    Jack take out a lighter from the pocket of his uniform.

    Sandy: Do you know who the two guys are?

    Kerry: Sure, they are Kevin and Dennis.

    Sandy: Did you see them give Jack a cigarette?

    Kerry: No, I didn’t. But I am afraid Jack smokes with them.

    Sandy: I think you should ask Jack first. If he smokes, you should tell his mom.

    Kerry: I want to ask him, but I am afraid he will lie to me. I don’t know what
    I should do now.

    Sandy: How about telling our teacher, Mr. Wang? He will ask Jack and tell him
    what he shouldn’t do.

    Kerry: Sounds like a good idea.  cigarette 香菸; lighter 打火機; pocket 口袋'
