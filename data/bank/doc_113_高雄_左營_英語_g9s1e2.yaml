- id: doc_113_高雄_左營_英語_g9s1e2_s2_25
  section: 2
  number: 25
  type: single
  page: 4
  stem: Accroding to the article, how does AI create art?
  options:
  - label: A
    content: AI mixes numbers and text.
  - label: B
    content: AI uses brushes and penciles.
  - label: C
    content: AI works with a lot of computers.
  - label: D
    content: AI learns from humans and uses code.
  group_stem: "Artificial Intelligence (AI) is a smart computer technology. Also,\
    \ it can be a great artist. It means a computer uses its “mind” to create beautiful\
    \ pictures and other works of art. AI can learn from many different paintings\
    \ and drawings. Then, it uses all the learning to make its own art.\n    AI doesn’t\
    \ need any brushes or pencils. It uses lines of code to draw and create. It understands\
    \ colors, shapes, lines, and styles just like humans. Moreover, it can mix all\
    \ kinds of styles together to make something new and unique.\n    One surprising\
    \ thing about AI art is that it can make humans and machines work together. Artists\
    \ can do a lot of things by using AI. For example, artists can work with AI to\
    \ bring their ideas to life or even create more new and surprising works of art.\n\
    \    AI is not just about a group of numbers and text. It is also about showing\
    \ ideas or feelings through art. People are excited to see how AI and humans work\
    \ together to make the world colorful and better!\n technology 科技; create 創造;\
    \ code 代碼"
