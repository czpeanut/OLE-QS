- id: doc_113_高雄_左營_英語_g9s1e2_s2_16
  section: 2
  number: 16
  type: single
  page: 2
  stem: What is the main idea of the second paragraph?
  options:
  - label: A
    content: Newspapers are less important now.
  - label: B
    content: The Internet changed media.
  - label: C
    content: All websites make fake news.
  - label: D
    content: There are thousands of news websites now.
  group_stem: "Media used to be simple. If you wanted the news, you bought a newspaper.\
    \ You didn’t have a lot of choices: maybe two or three to choose from. And these\
    \ newspapers paid reporters to go out and find the news. If the reporters wrote\
    \ something fake, they would lose their jobs.\n     Nowadays, the Internet changed\
    \ all that. There are thousands of news websites to choose from, and lots of them\
    \ are free. People pay nothing for the news on the websites. Therefore, the websites\
    \ may not afford to pay the reporters. So how do they get their news? Maybe they\
    \ get the information secondhand, from newspapers or other websites. Or maybe\
    \ they just make fake news.\n     “Fake news” is news with inaccurate information.\
    \ Sometimes this is on purpose. Sometimes it is just a simple mistake. Fake news\
    \ is a big problem. It can be hard to know what is real and what is fake.\n  \
    \   How can readers know whether the news is real or not? Always think of the\
    \ reputation of the website. Media companies and reporters care about their reputations.\
    \ They might not be right all the time, but they will not try to trick their readers\
    \ on purpose.\n media 媒體; therefore 因此; afford 負擔得起; inaccurate 不準確的; on purpose\
    \ 故意的; reputation 聲譽"
