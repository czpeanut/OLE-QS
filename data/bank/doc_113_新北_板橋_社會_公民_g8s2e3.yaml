  type: single
  page: 2
  stem: '阿榮無照駕駛、違規闖紅燈並撞傷學童，警察隨即到場並開單處罰，事後雙方和解不成，遭學童家長告上法院。附圖 3 是他此次事故所支出的費用，其中屬於民事責任的部分是多少元？


    附圖 3

    | 項目 | 金額（元） |

    | :--- | :--- |

