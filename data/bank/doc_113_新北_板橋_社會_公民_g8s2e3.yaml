  number: 43
  type: single
  page: 1
  stem: 請依刑法規定的罪刑，判斷年滿十四歲的少年觸犯何者，會以少年刑事案件審理？
  options:
  - label: A
    content: 意圖為自己或第三人不法之所有，以強暴、脅迫、藥劑、催眠術或他法，至使不能抗拒，而取他人之物或使其交付者，為強盜罪，處五年以上有期徒刑
  - label: B
    content: 無故侵入他人住宅，處一年以下有期徒刑、拘役或三百元以下罰金
  - label: C
    content: 無故開拆或隱匿他人之封緘信函，處拘役或三千元以下罰金
  - label: D
    content: 公然侮辱人者，處拘役或三百元以下罰金。
