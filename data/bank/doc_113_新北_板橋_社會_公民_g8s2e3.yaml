  number: 39
  type: single
  page: 1
  stem: 台北市小青在瀏覽社群媒體時，看到一個廣告連結，點進去發現是色情影片網站。該網站只要求「註冊成為會員」，就能免費觀看成人影片，過程中未設有年齡驗證機制，也無任何警語或防護措施。小青好奇詢問學校老師：這樣的網站是不是違法？因為根本無法防止未滿
    18 歲的少年接觸不當內容。請問：此網站最有可能違反下列哪一部法律？
