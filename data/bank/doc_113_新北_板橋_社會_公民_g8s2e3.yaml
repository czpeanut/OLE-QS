- id: doc_113_新北_板橋_社會_公民_g8s2e3_s1_38
  section: 1
  number: 38
  type: single
  page: 1
  stem: 此事件引發社會對「高齡駕駛管理制度」的討論。有立委建議，應定期檢驗高齡駕駛人的反應力與健康狀況。下列對此討論的描述何者最符合法治社會的精神？
  options:
  - label: A
    content: 國家應全面禁止 70 歲以上長者駕駛，以維護社會安全。
  - label: B
    content: 法律應設計兼顧公共安全與個人基本權利的制度，透過科學評估落實監管。
  - label: C
    content: 政府應由醫院與家屬決定長者是否可駕車，以減少行政成本。
  - label: D
    content: 若高齡者肇事率較高，應一律吊銷所有高齡者駕照以避免差別對待爭議。
