    臺灣平均每年進口大量生鮮冷藏水果，奇異果長年佔據進口排行榜第二名，若以1個國際標準游泳池水的重量換算（一個游泳池水量約2500噸），臺灣每年奇異果的進口量，相當於填滿12個游泳池，每位國人一年平均吃下1.2公斤奇異果。

    然而，這些「飄洋過海」奇異果，臺灣竟是它最早原生地之一。將豪農場座落於苗栗縣的馬拉邦山，是臺灣少數的本土奇異果園。農場主人引用知名教育家安娜．拉佩（Anna
    Lappe）名言:「我們每一次的消費，都在為理想的世界投下一票」。一次次蔬果進口背後，是龐大緊密的運輸鏈及不可忽略的碳排放。「在地」與「進口」，是小蝦米對抗大鯨魚的殘酷，為了更好的地球環境，得努力為永續的未來尋找出路。請根據上文敘述，回答第49-50題:'
