  group_stem: '閱讀下列選文，回答第14 至16 題：

    下列為某展覽中展出的三份歷史文件。

    文件甲：

    ․對通往大連的中東鐵路和南滿鐵路，應設立一中蘇合辦的公司以共同經營之，蘇聯的優越權益須予以保證。

    ․分裂德國，解散納粹德軍，德國不准再擁有軍隊。美英蘇認為這是「今後和平和安全之必要條件」。

    文件乙：

    ․中、英、美三國堅持對日作戰直到日本無條件投降為止。

    ․日本歸還自第一次世界大戰以來在太平洋區域所占的一切島嶼。

    ․日本自中國人所得到的所有領土，比如滿洲、臺灣及澎湖群島，應該歸還給中華民國。其他日本以武力或貪慾所攫取之土地，亦務將日本驅逐出去。

    文件丙：

    ․本組織主要機關如下：

    大會、安全理事會、經濟暨社會理事會、託管理事會、國際法庭、及秘書處。

    ․各會員國應一秉善意，履行其依本憲章所擔負之義務，以保證全體會員國由加入本組織而發生之權益。

    ․各會員國應以和平方法解決其國際爭端，避免危及國際和平、安全及正義。'
