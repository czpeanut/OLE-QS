  section: 1
  number: 12
  type: single
  page: 2
  stem: 資料一中這位總統為何發佈此一咨文？
  options:
  - label: A
    content: 1823年，反對歐洲干預美洲獨立
  - label: B
    content: 1917年，對抗德國「無限制潛艇政策」
  - label: C
    content: 1941年，抵抗日本侵略珍珠港
  - label: D
    content: 1962年，阻止蘇聯在古巴秘密佈署飛彈
  group_stem: '閱讀下列選文，回答第12 至13 題：

    ◎有兩份美國外交文件，內容如下：

    資料一：一件總統咨文宣示：「我們尊重西歐諸國在西半球的殖民地，但對於已經宣佈獨立，並經我國承認的國家，西歐諸國如果要予以干涉的話，我們認為他將危害美國的和平與幸福。」

