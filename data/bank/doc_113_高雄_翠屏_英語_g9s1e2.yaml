  group_stem: "Do you know what gender stereotypes are?  You might not have heard\
    \ that words before.  \nHowever, I’m sure you know what they are, ＿51.＿?  The\
    \ reason I know that is because we \nhave all been showed to those common ideas\
    \ of how boys and girls should be and act.  In \nfact, we were exposed to them\
    \ not long after we were born.\n     You know that.  Soon after babies are born,\
    \ they ＿52.＿ differently because of their \ngender.  Boy babies are put in blue\
    \ blankets, while girl babies are put in pink ones.  That’s \nnot surprising to\
    \ people in this day and age.  However, did you know that blue was first a \n\
    color for girls and pink for boys?  In the past, the first color was seen as softer,\
    \ and the \nsecond one was seen as stronger.  ＿53.＿\n     The gender stereotypes\
    \ don’t stop there.  ＿54.＿, they are told and taught different \nthings about\
    \ their gender.  Girls are encouraged to play with dolls, be quiet, and act like\
    \ little\nprincesses.  ＿55.＿, boys are encouraged to play with trucks, be active,\
    \ and like sports.  \nEveryone should know that those stereotypes aren’t good\
    \ for either gender.\n\n\U0001F56E term 專有名詞 expose 暴露 while 然而 encourage 鼓勵 active\
    \ 活潑的"
