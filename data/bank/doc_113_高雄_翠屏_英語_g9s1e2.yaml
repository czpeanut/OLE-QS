  type: single
  page: 8
  stem: What is the main idea of the article?
  options:
  - label: A
    content: Japanese people don’t use English words in their language.
  - label: B
    content: English words are only used in Japanese for technology.
  - label: C
    content: New English words are often translated into Japanese, using to Japanese
      pronunciation and writing.
  - label: D
    content: There isn’t any foreign words in Japanese language vocabularies.
  group_stem: "B.\n     As languages develop, they often borrow words from each other,\
    \ especially when new \nideas or technologies come out. In Japan, many new English\
    \ words are used into the \nJapanese language through a way called “loanwords.”\
    \ Some of these loanwords are directly \ntranslated, while others are little changed\
    \ to fit Japanese pronunciation or meaning.\n     For example, English words like\
    \ modern technology, fashion, and food are often used \ninto Japanese. The English\
    \ word “computer” is transformed into “konpyūtā” \n(コンピューター), closely copying\
    \ the original sound but written in Japanese words. This \nway helps people in\
    \ Japan quickly understand new words to international new wave.\n     Some English\
    \ phrases are also directly translated to create new Japanese expressions. For\
    \ \nexample, “self-service” is turned into “serufu-sābisu” (セルフサービス) and “ice\
    \ cream” \nbecomes “aisukurīmu” (アイスクリーム). These words keep the original meaning\
    \ while \nmixing the word to be easier for Japanese speakers to use.\nThese words\
    \ are usually written in “katakana,”  and are used mainly for foreign words. By\
    \ \nusing katakana, Japanese speakers can understand loanwords easily, making\
    \ it clear that the \nwords came from another language.\n     This practice of\
    \ using English words adds Japanese vocabularies and connects Japanese \nspeakers\
    \ to everyone’s ideas. It’s an interesting example of how language can bring cultures\
    \ \ncloser while allowing people to talk about new ideas more quickly.\n\n\U0001F56E\
    \ technology科技  loanword外來語  directly直接地  pronuncitation發音  original原始的 \n   \
    \   katakana平假名 formal正式的 separate"
