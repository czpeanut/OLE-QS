  stem: 政府將《勞動基準法》中強制退休年齡由60 歲調高至65 歲，意即勞工年齡若未滿65 歲，雇主不得強制其退休，以保障有經驗與健康情形良好的勞工，此趨勢在世界許多先進國家也愈來愈普遍。上述政策的調整，主要目的為何？
