  section: 1
  number: 14
  type: single
  page: 2
  stem: 存於臺灣之傳統民族，稱為「原住民」，因其血統與特殊的文化內涵，被視為我國重要的文化資產。近年來，國際通婚日益頻繁，若配偶一方持有外僑居留證、永久居留證，申請入境停、居留及定居我國之配偶，稱為「新住民」，被視為臺灣競爭力發展重要的生力軍。附圖為臺灣近五年來原住民與新住民的人口成長趨勢。由圖判斷，新住民人口數逐漸接近原住民，成為臺灣重要的族群之一，面對這樣的趨勢，政府該如何面對，以符合現代社會所需？
  options:
  - label: A
    content: 尊重多元族群發展，保障各族群語言的學習機會
  - label: B
    content: 保障原住民族的生存發展，限制新住民申請入籍
  - label: C
    content: 鼓勵原住民遷移至都市居住，以提升其生活品質
  - label: D
    content: 保障各族群的生活領域，各自劃設獨立的自治區。
