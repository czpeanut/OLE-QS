  group_stem: '＊ 以下為日治時期統治政策的資料，請依敘述回答問題：

    資料一：「演布袋戲時必須講日語，木偶必須穿上日本服，拿著武士刀在臺上砍來砍去。臺下還有巡查監看，以免有中國文化的影子出現在劇中。如果他們覺得有，便會強制我們停戲」。

    資料二：「對於日本許多官員來說，取得臺灣作為殖民地後陷入了迷惘，所有的統治策略都必須重新制定，政策以穩定政權方便管理為優先。然而抗日事件仍然層出不窮。臺灣無疑變成『難治之地』，以至於傳出日本曾計畫將臺灣賣給法國的傳聞。」

    資料三：「今日修訂法律，是促進日臺合一，使台灣人與內地人享有同樣法律地位。此外，這次新設立的總督府評議會，是在某些重要案件上，總督認為有必要時，會諮詢評議會，以徵求民意。」'
