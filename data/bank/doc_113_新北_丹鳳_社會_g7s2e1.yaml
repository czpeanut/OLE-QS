    資料二：「對於日本許多官員來說，取得臺灣作為殖民地後陷入了迷惘，所有的統治策略都必須重新制定，政策以穩定政權方便管理為優先。然而抗日事件仍然層出不窮。臺灣無疑變成『難治之地』，以至於傳出日本曾計畫將臺灣賣給法國的傳聞。」

