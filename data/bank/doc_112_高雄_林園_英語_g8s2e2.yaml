  group_stem: 'I have to quit.

    I open my eyes, what a busy day again and again!

    Kids, wake up!

    Husband, wake up!

    Cats and dogs, wake up!

    Eat, go to school, and work!

    So, I can clean the table, the rooms, the kitchen ,

    Everything at home.


    I want to quit, but it’s time for shopping.

    Kids like hot dogs, husband needs coffee, cats’ and

    dogs’ food...


    Night is coming, and after dinner,

    There are always Taipei 101s in the sink,

    And dirty clothes in the basket.

    Kids, husband, cats and dogs are laughing.

    And I am thinking.

    I need to quit!


    “Good night,  (21) , love you.”

    “Thank you, dear, love you.”

    “Meow and bow-wow.”

    Many kisses and hugs, all to me.


    Did I just say I should quit?


    quit 辭職  sink 水槽 hug 擁抱'
