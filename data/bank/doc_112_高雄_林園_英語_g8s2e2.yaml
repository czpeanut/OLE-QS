  group_stem: 'Did you join the activities for World Earth Day at our school?  The
    goal is to let us understand the importance of going green and each of us can
    do a little to help the earth. The health of our earth is very important and we
    can act like          to check it carefully. We all know the climate changed over
    the years and if we don''t stop climate change, we cannot have food or water.
    What’s more, the sea animals cannot be safe, either. So, what can we do? First,
    we can use less energy and water. Second, we can recycle our trash. Third, we
    can walk, ride a bike, or take public transport. Fourth, we can plant trees. Trees
    help clean the air. Fifth, we can talk about the environmental problems with our
    friends and family. And we can ask our government to make new laws. We all need
    to work together to save our planet.


