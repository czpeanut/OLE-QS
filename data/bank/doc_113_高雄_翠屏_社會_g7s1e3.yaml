  - label: D
    content: 追求性別平權。
  group_stem: '請閱讀下列短文並回答問題。

    位在花蓮縣 光復鄉 馬錫山山腳的馬太鞍部落，因當地的阿美族人平日以vata''an 樹豆為主要糧食，族人以樹豆名vata''an 為部落名稱，也就是現在的「馬太鞍」。由於馬太鞍是一處天然沼澤溼地，擁有多樣化溼地生態，且阿美族人在這片溼地上發展出獨特的「Palakaw」巴拉告生態捕魚法，魚便會在其間繁衍長大，鱸鰻、土虱也就自動入網，讓族人大豐收，足見阿美族人文化中的生活智慧。西元2017
    年12 月18 日花蓮縣 光復鄉 馬太鞍部落舉行部落會議成立大會，希望透過部落會議，自主討論部落發展，並決議部落事務，例如：傳統領域的宣告、馬太鞍智慧創作智慧權等。'
