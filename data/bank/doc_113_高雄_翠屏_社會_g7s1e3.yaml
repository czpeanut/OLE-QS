    | 21.5 | 17.9 | 23.0 |

    | 最高氣溫（℃） | 19.1 | 19.6 | 22.1 | 25.7 | 29.2 | 32.0 | 34.3 | 33.8 | 31.1 | 27.5
    | 24.2 | 20.7 | 26.6 |

    | 最低氣溫（℃） | 13.9 | 14.2 | 15.8 | 19.0 | 22.3 | 24.6 | 26.3 | 26.1 | 24.8 | 22.3
    | 19.3 | 15.6 | 20.4 |'
