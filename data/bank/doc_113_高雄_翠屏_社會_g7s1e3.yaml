  section: 3
  number: 55
  type: single
  page: 8
  stem: 花蓮縣 光復鄉 馬太鞍部落的阿美族人，發展出獨特的「Palakaw」巴拉告生態捕魚法，此種捕魚法顯現原住民族部落的何種生活智慧？
  options:
  - label: A
    content: 重視永續發展
  - label: B
    content: 維護人性尊嚴
  - label: C
