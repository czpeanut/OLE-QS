    (2)西元2001 年到2003 年，「花蓮縣青少年公益組織」協同「花蓮縣德魯固族文化發展協會」，接續辦理太魯閣戰役紀念研討會，會中以族老口述方式，藉以釐清太魯閣族的抗日史事。

    (3)西元2004 年，太魯閣族正名運動推動八年後成功正名，成為臺灣原住民第十二族，花蓮縣內太魯閣族人受到正名成功的鼓舞，內部產生凝聚能量，在傳統祭典重建，或太魯閣抗日戰史的追溯上，帶來嶄新的局面。'
