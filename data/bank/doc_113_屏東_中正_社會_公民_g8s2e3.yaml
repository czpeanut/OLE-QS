  section: 1
  number: 11
  type: single
  page: 2
  stem: '阿東研究某一主題後，寫下關於這個主題的相關法規：

    ✽刑法第 339 條

    1 意圖為自己或第三人不法之所有，以詐術使人將本人或第三人之物交付者，處五年以下有期徒刑、拘役或科或併科五十萬元以下罰金。

    2 以前項方法得財產上不法之利益或使第三人得之者，亦同。

    ✽兒童及少年福利與權益保障法第 49 條

    1 任何人對於兒童及少年不得有下列行為：

    一、遺棄。

    ……

    十五、其他對兒童及少年或利用兒童及少年犯罪或為不正當之行為。

    ✽兒童及少年福利與權益保障法第 97 條

    違反第四十九條第一項各款規定之一者，處新臺幣六萬元以上六十萬元以下罰鍰，並得公布其姓名或名稱。

