  section: 1
  number: 12
  type: single
  page: 1
  stem: 附圖是清帝國雍正5 年(西元1727 年)，一位在臺灣開墾的漢人經歷，他所經歷的改變是受到下列哪一事件的影響？
  options:
  - label: A
    content: 鄭氏降清
  - label: B
    content: 朱一貴事件
  - label: C
    content: 林爽文事件
  - label: D
    content: 戴潮春事件。
