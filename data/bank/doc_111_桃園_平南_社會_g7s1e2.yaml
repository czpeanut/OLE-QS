- id: doc_111_桃園_平南_社會_g7s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 西元1652 年臺灣南部發生了一起事件，大量漢人慘遭殺害，嚴重打擊臺灣農業發展，迫使統治當局改變統治策略。請問：該起事件應是下列何者？
  options:
  - label: A
    content: 麻豆社之役
  - label: B
    content: 大肚王叛變
  - label: C
    content: 郭懷一事件
  - label: D
    content: 新港社叛變。
- id: doc_111_桃園_平南_社會_g7s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 小玉到爺爺家玩，看到爺爺家中有一張清代的古地契。爺爺跟她說，這張地契，俗稱「番仔契」，這種土地契約的特色是雙語對照，有一半使用漢文撰寫，另一半則是使用羅馬拼音的新港文書。請問：新港文應是由何人創立的文字？
  options:
  - label: A
    content: 葡萄牙人
  - label: B
    content: 西班牙人
  - label: C
    content: 荷蘭人
  - label: D
    content: 漢人。
- id: doc_111_桃園_平南_社會_g7s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '附表為西元1659 年，臺灣南部的西拉雅族各社熟諳教理的信徒比例。請問：「熟諳教理的信徒」，是指熟悉哪一種宗教的教義？


    | 西拉雅族 | 比例 |

    | :--- | :--- |

    | 新港社 | 83% |

    | 麻豆社 | 51% |

    | 目加溜灣社 | 76% |'
  options:
  - label: A
    content: 伊斯蘭教
  - label: B
    content: 佛教
  - label: C
    content: 天主教
  - label: D
    content: 基督教。
- id: doc_111_桃園_平南_社會_g7s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 鄭氏治臺時期，曾有中部地區的原住民族以武力反抗鄭氏統治。請問：這是指哪一個原住民族群？
  options:
  - label: A
    content: 大肚王
  - label: B
    content: 馬賽人
  - label: C
    content: 麻豆社
  - label: D
    content: 新港社。
- id: doc_111_桃園_平南_社會_g7s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 清帝國擊敗鄭氏政權後，康熙皇帝曾說「臺灣僅是彈丸之地，得之無所加，不得亦無所損。」但下列何人強調臺灣具有國防戰略價值，建議將臺灣納入清帝國版圖？
  options:
  - label: A
    content: 施琅
  - label: B
    content: 吳沙
  - label: C
    content: 劉銘傳
  - label: D
    content: 沈葆楨。
- id: doc_111_桃園_平南_社會_g7s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 有關清帝國統治初期的治臺政策，下列的描述何者正確？
  options:
  - label: A
    content: 積極治臺，鼓勵漢人來臺開墾
  - label: B
    content: 推動「開山撫番」政策
  - label: C
    content: 鼓勵漢人和原住民通婚
  - label: D
    content: 嚴禁漢人入侵「番界」。
- id: doc_111_桃園_平南_社會_g7s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 清帝國時期，臺灣社會移民衝突事件很頻繁，原因在於「羅漢腳」過多，他們無家室、無房地產、無固定工作，隻身一人在臺謀生。請問造成這種社會問題的原因為何？
  options:
  - label: A
    content: 海禁政策
  - label: B
    content: 渡臺禁令
  - label: C
    content: 劃界封山政策
  - label: D
    content: 禁止漢、番通婚政策。
- id: doc_111_桃園_平南_社會_g7s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 西元1684 年(康熙23 年)，清廷將臺灣納入版圖後，設置行政區一府三縣。當時管轄這三個「縣」的地方政府是下列何者？
  options:
  - label: A
    content: 臺灣省
  - label: B
    content: 臺北府
  - label: C
    content: 臺灣府
  - label: D
    content: 臺南府。
