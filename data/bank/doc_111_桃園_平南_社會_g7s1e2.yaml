- id: doc_111_桃園_平南_社會_g7s1e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: '十九世紀後期，清帝國遭逢多次外力的挑戰，臺灣也受到波及，下列表格是與臺灣相關的兩場事件的重點整理，哪一選項的敘述不正確？


    | 選項 | 日軍侵台 | 清法戰爭 |

    | :--- | :--- | :--- |

    | (A)導火線 | 牡丹社事件 | 越南問題 |

    | (B)地點 | 恆春半島 | 基隆、淡水、澎湖 |

    | (C)來台官員 | 劉銘傳 | 沈葆楨 |

    | (D)影響 | 喪失琉球 | 臺灣建省 |'
  options:
  - label: A
    content: (A)導火線
  - label: B
    content: (B)地點
  - label: C
    content: (C)來台官員
  - label: D
    content: (D)影響
- id: doc_111_桃園_平南_社會_g7s1e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 英法聯軍之役後，清帝國開放臺灣的四個通商口岸。請問：這四個港口中，哪一個位置在最南方？
  options:
  - label: A
    content: 安平
  - label: B
    content: 打狗
  - label: C
    content: 淡水
  - label: D
    content: 雞籠。
- id: doc_111_桃園_平南_社會_g7s1e2_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 2002年中華民國制定□□法，期望促進兩性工作權的平等，消除性別歧視、促進性別地位實質平等，下列哪個事件適用於上述法律？
  options:
  - label: A
    content: 小黃運將在排班時，酒醉伸手對路過女子襲臀
  - label: B
    content: 小方想請假陪懷孕的老婆產檢，卻遭到老闆刁難
  - label: C
    content: 一對夫妻當街爭執，夫情緒失控狠甩妻子巴掌，命令妻子當街下跪認錯
  - label: D
    content: 小明在教室大講黃色笑話，讓班上同學覺得很噁心、很不恰當
- id: doc_111_桃園_平南_社會_g7s1e2_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: '附圖是小明一家人到南部旅遊的飯店房間分配情況。若小明的房間兩旁，分別住了自己的旁系血親和姻親，根據圖中內容判斷，他最可能是住在下列哪一個房間內？


    | 爺爺、奶奶 | 甲 | 叔叔 | 乙 | 堂妹 |

    | :--- | :--- | :--- | :--- | :--- |

    | 哥哥 | 丙 | 姑丈 | 丁 | 爸爸、媽媽 |'
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
- id: doc_111_桃園_平南_社會_g7s1e2_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 「3 歲看大7 歲看老」，從腦科學的角度來看，從0歲開始，腦神經細胞不斷增生。腦神經細胞數量在3 歲~4 歲時達到高峰，10 歲以後就「定型」了。所以這段時間是腦部發展關鍵期，更是強化潛能的黃金期。由此可知，下列何者是塑造個人發展最重要的場所？
  options:
  - label: A
    content: 醫院
  - label: B
    content: 社區
  - label: C
    content: 學校
  - label: D
    content: 家庭
- id: doc_111_桃園_平南_社會_g7s1e2_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 「不要只給錢，請關心我！」小玲高中時被父母送到英國唸書，三年間衣食無憂，想買什麼買什麼，根本不用擔心錢不夠。花了父母近百萬，但父母從不主動聯絡或視訊，發訊息給家人，跟發進垃圾箱沒有區別，沒有人回復，發生了什麼他們都不知道也不關心，請問：家人可能忽略了下列哪個家庭功能？
  options:
  - label: A
    content: 生育
  - label: B
    content: 經濟
  - label: C
    content: 教育
  - label: D
    content: 保護與照顧
- id: doc_111_桃園_平南_社會_g7s1e2_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 依據「民法」的規定，下列何人與阿平沒有民法上的親屬關係？
  options:
  - label: A
    content: 阿平的姨丈
  - label: B
    content: 阿平的岳父
  - label: C
    content: 阿平大嫂的妹妹
  - label: D
    content: 阿平老婆的姐夫
- id: doc_111_桃園_平南_社會_g7s1e2_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: 灰姑娘和父母住在一個漂亮的大房子，一家人幸福的生活，但母親不幸病逝，父親要到遠方工作，擔心她無人照顧，於是父親與村里一位有兩個女兒的寡婦再婚，沒想到灰姑娘卻遭到繼母及繼母的兩個親生女兒欺負，請問在故事中，灰姑娘不曾經歷過何種家庭模式？
  options:
  - label: A
    content: 兩地家庭
  - label: B
    content: 隔代教養家庭
  - label: C
    content: 單親家庭
  - label: D
    content: 繼親家庭
- id: doc_111_桃園_平南_社會_g7s1e2_s1_24
  section: 1
  number: 24
  type: single
  page: 2
  stem: 越南大學畢業的阮氏青河來台灣工作，在科技廠擔任操作員，期間遇到了現在的丈夫，結婚後在先生的支持下重拾書本，取得碩士、博士學位。目前受聘於成大教授越語，更自編越語教學書籍。根據文中敘述，阮氏青河的家庭屬於何種家庭型態？
  options:
  - label: A
    content: 跨國婚姻家庭
  - label: B
    content: 大家庭
  - label: C
    content: 兩地家庭
  - label: D
    content: 繼親家庭
- id: doc_111_桃園_平南_社會_g7s1e2_s1_25
  section: 1
  number: 25
  type: single
  page: 2
  stem: 配偶間如果發生家暴行為，被害人可以依據《家庭暴力防治法》的規範尋求協助。以下何者不屬於《家庭暴力防治法》中規範的處理方式？
  options:
  - label: A
    content: 要求加害人搬離被害人的住所
  - label: B
    content: 要求雙方結束婚姻關係
  - label: C
    content: 禁止加害人對被害人進行騷擾、跟蹤或其他非必要的聯絡行為
  - label: D
    content: 提供被害人24小時緊急救援、協助驗傷、採證及緊急安置
- id: doc_111_桃園_平南_社會_g7s1e2_s1_26
  section: 1
  number: 26
  type: single
  page: 2
  stem: 阿偉的媽媽重度失智，爸爸也剛罹患失智症，他一肩扛起照顧的責任，但一家人只靠他每天12小時大夜班賺來的薪水度日。沒日沒夜的照顧和工作，「很累」兩個字說盡了他的無力和疲憊。下列政府推行的政策中，何者可協助上述家庭的困境？
  options:
  - label: A
    content: 發放幼兒托育補助
  - label: B
    content: 設置公共托育中心
  - label: C
    content: 實施長期照顧制度
  - label: D
    content: 成立家庭教育中心
- id: doc_111_桃園_平南_社會_g7s1e2_s1_27
  section: 1
  number: 27
  type: single
  page: 2
  stem: 在平權家庭的觀念下，下列何者的認知是正確的？
  options:
  - label: A
    content: 父母為所有子女安排完全相同的才藝課程
  - label: B
    content: 即使是幼齡的孩子，父母仍認真傾聽其意見
  - label: C
    content: 看電影、買早餐，夫妻都必須斤斤計較，各自付費
  - label: D
    content: 若是離婚，子女的親權依夫妻的最佳利益決定
