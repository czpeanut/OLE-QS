- id: doc_111_桃園_平南_社會_g7s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 1
  stem: 附圖為臺灣歷史最早期的火車票。請問：假如你生活在清帝國治臺時期，這張車票應該是你往返哪兩地區的火車票？
  options:
  - label: A
    content: 臺北、基隆
  - label: B
    content: 臺北、臺中
  - label: C
