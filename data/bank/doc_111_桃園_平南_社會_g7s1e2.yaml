- id: doc_111_桃園_平南_社會_g7s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 荷蘭治臺時期，駐臺長官會將刻有荷蘭聯合東印度公司標幟的藤杖，授予原住民部落中有地位的人士，這些人每年集會一次，接收荷蘭長官的政令，並報告各部落內的情形。請問上述「有地位的人士」應是指下列何者？
  options:
  - label: A
    content: 神父
  - label: B
    content: 傳教士
  - label: C
    content: 巫師
  - label: D
    content: 長老。
