- id: doc_113_台中_居仁_社會_公民_g8s1e1_s2_24
  section: 2
  number: 24
  type: single
  page: 3
  stem: 美國總統擁有國家的行政權，依據文中內容判斷，美國目前的執政黨是哪一政黨？
  options:
  - label: A
    content: 民主黨
  - label: B
    content: 共和黨
  - label: C
    content: 民主黨與共和黨皆是
  - label: D
    content: 無法判斷
  group_stem: "【二】\n    2024 年的美國總統大選即將在 11 月 4 日舉行，九月中的總統候選人直播辯論會，共和黨候選人、前美國總統川普，以及民主黨候選人、現任美國副總統賀錦麗，兩人針對美國經濟、移民、戰爭等議題交鋒。過程中雙方公平激辯，並闡述自己的政見。\n\
    \    電視辯論會結束後，CNN 新聞公布的最新民調顯示，有 63%的受訪者認為賀錦麗在辯論中的表現優於川普，僅有 37%的人認為川普表現較佳。流行音樂天后泰勒絲也透過社群媒體表示，支持賀錦麗競選總統，並呼籲選民可以自己做研究和做選擇，引起許多人關注。\n\
    \    面對大選倒數階段，賀錦麗和川普提各式政見盼獲得選民的青睞。例如〔甲：在提升國內製造業的競爭力上，賀錦麗把焦點放在增加美國製造業的投資，以應對與中國等國家的競爭；川普也做出類似承諾，但主要是對外國進口商品徵收全面關稅的計畫〕。再者〔乙：兩方都有提出減輕家庭經濟負擔的相關政見，尤其賀錦麗主張讓中低收的新生兒家庭在孩子出生的第一年，能獲得\
    \ 6000 美元補助，這幾乎是拜登(現任民主黨籍美國總統)上任首年的兩倍。〕\n    不過這些多數的政見要能在選後實踐，都需要國會立法通過，因此就算勝選，推行新政還要該政黨能否在國會選舉中勝選，獲得多數的國會席次。"
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 公民
