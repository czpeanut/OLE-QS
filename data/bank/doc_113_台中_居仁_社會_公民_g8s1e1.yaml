  - label: C
    content: 保障基本人權
  - label: D
    content: 保衛國家安全
  group_stem: "【一】\n    2020 年日媒爆出日本國土被中國企業大量購買，此消息引起日方高度警惕。官方調查發現，日本軍事用地附近有 80 件土地交易和中國投資方有關，以及中國企業長期大量購買北海道森林、水源地、農地等土地的情況，可能成為安全保障的漏洞。\n\
    \    當時有媒體與民眾提出質疑，為何政府官員沒有事先下禁令，適時禁止外國企業購買日本土地，相關官員與學者事後對此回應，日本除了受國際法的限制，再者當時國內未有法律規定政府有權限干涉此交易行為，此外，對土地交易進行限制，也可能有侵犯憲法所保障人民財產權的疑慮。\n\
    \    但為加強國土的保衛，日本近年著手管控戰略土地的買賣，2021 年通過《土地利用規製法》，日本政府依法有權調查土地所有者，並且可對干擾國家設施功能的行為進行開罰。"
