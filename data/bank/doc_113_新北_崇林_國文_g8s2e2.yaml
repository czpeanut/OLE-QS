  stem: 「輕輕的我走了，正如我輕輕的來；我輕輕的招手，作別西天的雲彩。那河畔的金柳，是夕陽中的新娘；波光裡的艷影，在我的心頭蕩漾。……悄悄地我走了，正如我悄悄地來；我揮一揮衣袖，不帶走一片雲彩。」若要以一句現代詩句來表達〈再別康橋〉全詩的情感核心，下列何者最接近？
  options:
  - label: A
    content: 走過一場花事，攜一縷馨香，無聲離去
  - label: B
    content: 揚帆遠航，逆風而行，只求破浪前行
  - label: C
    content: 流光容易把人拋，紅了櫻桃，綠了芭蕉
  - label: D
    content: 舉杯高歌，為自由而戰，為榮耀而生。
