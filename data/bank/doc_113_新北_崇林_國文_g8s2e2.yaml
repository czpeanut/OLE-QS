  stem: 「臺灣原住民的布只有形制屬傳統或較現代的分別，像圓領的剪裁、鈕扣和棉布的使用等，都是受漢人影響而來。泰雅族的貝珠鈴衣，是貝珠串底下加銅鈴裝飾，銅鈴也是和漢人交易而來。日治時代的原住民服裝，還出現以漢人棉布做底、日本布做袖口、原住民圖案做主要裝飾的混搭法。」本段文字主旨，最可能是下列何者？(改寫111
    年會考)
  options:
  - label: A
    content: 文化交流能促成傳統與現代元素的融合
  - label: B
    content: 外來文化侵蝕了臺灣原住民傳統服飾
  - label: C
    content: 臺灣原住民服飾深刻影響漢人與日本人的穿著
  - label: D
    content: 不同族群服飾的觀察，有助於區分文化差異
