- id: doc_113_新北_崇林_國文_g8s2e2_s3_10
  section: 3
  number: 10
  type: single
  page: 1
  stem: 在行文時，作者常將某一種感官的感受，透過聯想，以另一種感官印象來表達，藉此讓文章的意象更為鮮活而豐富。請問下列哪個選項對於感官交錯表現方式的敘述正確?
  options:
  - label: A
    content: 「柚樹的葉影在緩緩地移動，移上我的臉頰的是幾朵擠碎的陽光，到這裡，它成了一種柔軟的撫摸。」這是用觸覺印象來表現視覺感受
  - label: B
    content: 「太陽又出來了，一片清新的空氣，鮮潔的色彩，彷彿聽見了貝多芬田園交響曲第四樂章牧羊人之歌。」這是用視覺印象來表現聽覺感受
  - label: C
    content: 「我低下頭去喊自己的名字，井水也大聲應和，連那回聲都彷彿有淡淡的餘香。」這是用視覺印象來表現嗅覺感受
  - label: D
    content: 「微風過處，送來縷縷清香，彷彿遠處高樓上渺茫的歌聲似的。」這是用聽覺印象來表現視覺感受。
