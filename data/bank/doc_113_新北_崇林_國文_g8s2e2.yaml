  stem: 送孟東野序:「草木之無聲,風撓之鳴。」句中兩個「之」字的詞性與字義分別爲何?
  options:
  - label: A
    content: 前者爲語助詞,無義;後者爲代詞,指草木
  - label: B
    content: 前者爲代詞,指草木;後者爲語助詞,無義
  - label: C
    content: 兩者皆爲代詞,皆指草木
  - label: D
    content: 兩者皆爲語助詞,皆無義
  group_stem: "送孟東野序  韓愈\n   大凡物不得其平則鳴(註1)：草木之無聲，風撓(註2)之鳴；水之無聲，風蕩之鳴。其躍(註3)也，或激(註4)之；其趨(註5)也，或梗(註6)之；其沸也，或炙(註7)之。金石之無聲，或擊之鳴；人之於言也亦然。有不得已者而後言，其歌也有思，其哭也有懷。凡出乎口而為聲者，耳皆有弗平者乎？\n\
    註：\n1 鳴：發出聲音。\n2 撓：ㄋㄠˊ，搖動。\n3 躍：跳躍，此處用以形容水面晃動的樣子。\n4 激：水勢受阻而噴濺。\n5 趨：此處指水往下奔流的樣子。\n\
    6 梗：阻塞。\n7 炙：以火燒之。"
