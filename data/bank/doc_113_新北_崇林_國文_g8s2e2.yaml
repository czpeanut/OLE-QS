- id: doc_113_新北_崇林_國文_g8s2e2_s3_23
  section: 3
  number: 23
  type: single
  page: 2
  stem: 「籤雖百首驗千般,凶吉分明不易刪;三筊(①)為憑靈指點，果開覺路出難關。」(①筊:筊杯通常用木頭或塑膠做成二片半月的形狀,擲至地面後, 視其俯仰以定吉凶。如有三次筊杯呈現一正一反視為聖筊。擲筊:求神問卜的儀式。)此作描寫了臺灣廟宇中抽籤詩的風俗,下列何者不符合內容所述?
  options:
  - label: A
    content: 百首籤詩驗證人們上千種可能遇到的情況
  - label: B
    content: 籤詩上所載吉凶禍福可透過祈福作法改變
  - label: C
    content: 抽完籤後要向神靈求得三聖筊才算得指示
  - label: D
    content: 對籤詩內容有所領悟便能突破人生的關卡。
