    共享行動電源租借站,讓手機恢復一線生機。


    ChargeSPOT 除了是台灣共享行動電源的品牌外,更是全球首家提供行動電源跨國租借服務的企業, 目前有在台灣、日本、香港、泰國等國家提供這項便利的服務。在行動電源的租借與歸還上,不只是能在同一個國家內有著甲借乙還的服務,選擇離自己最近的地方進行租借,並隨著行程移動地點後再到下一個地點歸還行動電源,還能在提供服務的國家間進行跨國租還,對旅客和商務人士來說是極為便利的服務。為提供更便利的服務,目前
    ChargeSPOT 在台灣已擁有超過9,000 個合作商戶及超過200 萬名用戶,更計劃朝向重點國際觀光城市擴展服務範圍。


    ChargeSPOT 的共享行動電源租借站,不但為那些需要時常穿梭於在異地間的人們提供強大的電力後盾, 也致力於推廣及建立環境永續發展的理念。「租借代替購買」的概念也能降低傳統電池及線材在生產及銷售上所產生的資源浪費,並提高電池使用率,而舊電池有統一回收的管道後，更能被集中管理以降低污染。以下為其收費規則與借電步驟：


