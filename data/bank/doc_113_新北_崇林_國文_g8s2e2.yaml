  type: single
  page: 5
  stem: 如果大榮以本文內容為主題至崇林國中演講, 下列何者適合印在學校宣傳海報上當作題目?
  options:
  - label: A
    content: 大家都喜歡你——處世圓融之方
  - label: B
    content: 吃苦當吃補——境隨心轉之法
  - label: C
    content: 終點就在前方——堅持不懈之技
  - label: D
    content: 傾聽心中鼓聲——自在自適之術
  group_stem: '「做自己」是一個圓：不要活在別人的眼裡，也不當傷人的利刃


    是否常常會覺得，做自己，其實是一件困難的事。


    總會有耳語、有眼光，阻擋在你的前頭，讓人窒礙難行。甚至有時，就連呼吸都無法自由。可是，自己追求的「做自己」又是什麼呢？所謂的「做自己」，講的其實不是毫無節制、為所欲為，而是一種伸展與舒適的狀態。


    人無法離開群居生活，但卻可以學習去篩選尖銳的言語、惡意的眼光，然後不對他人回以同樣的行為。


    「做自己」是一個圓，用溫柔包圍住自己，也圈住周遭的人。如果只是像利刃總是割傷身旁的人，這樣的「做自己」比較像是一種任性。日子是自己在過，自己也是自己的，在世界裡找到一種平衡，就是最好的做自己。


    一、不要讓別人的眼光決定你的樣子


    請不要讓別人的眼光決定自己活著的樣子，不要活在別人的話裡。

    人無法讓每個人都喜歡自己，也無法去討好每一個人，所以不要把最多的力氣拿去討好。事情有輕重緩急，人也是，你可以學著挑選什麼是對自己重要，而自己又該看重什麼。你只要讓重視的人喜歡自己就好。


    每個人經歷都不同，所以眼光就不同，更因為這樣，所以每個人要走的方向就不同，志同就同行，道不同也不要強求。你的姿態、你的盡心，都應該是要對得起未來的自己，都是希望現在的這個自己可以喜歡未來的，那個自己。


    二、找到讓自己好的方式，而不是依循別人的


    「逞強」跟「接受」是兩回事。 逞強，比較像是「自己並不認同，卻嘴上說對」；但如果是發自內心同意了、理解了，就不是逞強，而是一種了然。一種對自己好。


    每個人都有對自己好的方式，有自己看待事情的方式，有自己前進的方式，不管那是什麼，只要是可以讓自己更好，就可以。你找到自己的方法，去對自己好、讓自己更好，就很好。


    三、人生有苦有樂，但不要自找苦吃


    千萬不要相信「吃苦等於吃補」這句話，因為，要是可以過得好好的，幹嘛要吃苦？也不要相信「吃虧就是佔便宜」，因為，如果可以兩全其美，為什麼要浪費？你要知道這些都只是安慰人的話。


    人生很難，也有很多的不得不，學會苦中作樂很重要；人生也有各種滋味，學會去體驗各種滋味，唯一不要的，是千萬不要自討苦吃。別人給的苦，是一種不得不，但自己給自己的，就是自找的。


    四、在適當的時候放手，才是一種圓滿


    你不願自己是個無法堅持的人。


    就像當初曾經放棄過自己的那些人一樣，於是你要自己再多努力一下，再試一次，或許夢想就會成真。 只是，常常你找不到繼續的理由。但我想是，「你還愛著他」，這就是繼續下去的那個理由。


    不是非要心力交瘁、遍體鱗傷才罷休，而是要努力到無法再努力就該停止。任何事情都是一樣，過程要去努力盡心，但在適當時候，也請決定放過自己。                    (肆一《把星星都點亮》)'
