- id: doc_113_新北_崇林_國文_g8s2e2_s3_20
  section: 3
  number: 20
  type: single
  page: 2
  stem: '最近有消息指出：「經國際研究發現，每天喝豆漿會增加50%以上罹癌風險！」許多人在社群平台上轉發此訊息，但也有人質疑數據來源。小珊查詢了幾個官方與媒體資料，整理如下表：

    | 資料來源 | 內容摘要 |

    | --- | --- |

    | A. 社群平台流傳文章 | 引述「不具名醫生」說法，未附研究出處，指豆漿含某種「神秘成分」易致癌。 |

    | B. 國際癌症研究機構（IARC）報告 | 指出目前無確切證據顯示一般食用量的豆漿與癌症有直接關聯，且豆類攝取有助降低某些疾病風險。 |

    | C. 國內大報健康版專欄 | 訪問營養師，指出「任何食物過量食用都可能產生副作用」，但一般適量飲用豆漿無需過度擔心。 |

    根據上述情境與表格資料，小珊若要合理判斷這則訊息，以下何者最適合？'
  options:
  - label: A
    content: 因為A 項指出有危險性，即使未註明來源，也應優先停止飲用豆漿以保安全
  - label: B
    content: B 項報告和C 項專欄皆未完全否認豆漿可能風險，因此小珊應謹慎，並全面拒絕豆類製品
  - label: C
    content: 綜合B 與C 資料，小珊應理解適量飲用豆漿無礙健康，不應僅根據無來源訊息輕率改變飲食習慣
  - label: D
    content: 因為社群平台上的訊息更即時、數量多，小珊應以A 項資訊為依據，並提醒親友停止食用。
- id: doc_113_新北_崇林_國文_g8s2e2_s3_21
