  group_stem: '(55-56)

    Long time ago, there was a king and his rule was unique. He ordered his soldiers
    to set up a public arena, not for sports but as a place to judge those accused
    of doing something wrong through a game of chance.

    When an accused man entered the arena, he faced two doors. Behind one door was
    a mad and hungry tiger that would tear the man apart. Behind the other door was
    a woman, when the man chose that door, he would marry her right away. This game
    of fate made the king and his people excited.

    One day, the king learned that his daughter fell in love with a handsome young
    man. The king thought the man was not good enough to be his daughter’s husband.
    Therefore, the king put the young man in the prison and forced him to go to the
    arena. The man might either marry another woman or be eaten by a tiger. What’s
    worse, the woman was the one who the princess hated badly.

    After the princess knew what was behind the two doors. She had a hard time making
    decision. Could she watch the man she loved marry someone else, or see him being
    eaten by the tiger?

