    There are many kinds of animals on Earth. Some are cute and others are so strange
    that people don''t even know what they are. Here are two special animals for you
    to take a look at.

    Mangalica

    Mangalicas are pigs with thick and long coats of hair, and they look like sheep.
    This animal was “made” in 1833 by crossing the Hungarian Pig with the European
    Wild Pig. Soon after, Mangalicas quickly became popular in Hungary because of
    their ability to grow faster and produce more meat. Best of all, they don’t need
    people to give them special food or care. In the 1950s, Mangalicas were widely
    farmed, but the number began to drop in the late 1960s. By 1989, fewer than 200
    were left. However, thanks to some hard-working farmers, the number of Mangalicas
    has once again come back.

    Mangalica meat, known for its rich taste, is thought the best in the world. So,
    foods like sausages and hams made from the meat. Although they are from Hungary,
    Mangalicas can also be found in countries like the US, Canada, and the UK.

    Okapi

    Before 1900, people were not sure whether Okapis really lived on Earth or not.
    People talked about it, but no one knew what animal it was. In 1901, Okapis were
    discovered in Democratic Republic of the Congo, an African country. With special
    looks, Okapis look like horses, zebras, and giraffes. They have velvet-brown coats,
    white throats, and black-and-white lines.

    Unlucky, Okapis are found only in the rainforests of Congo. There are very few
    Okapis in the world now, and the number keeps dropping. Although Congo tried to
    save Okapis, the country is in war and it is too poor to do anything to help.
    So, the plan was not successful. Also, people keep killing Okapis for their meat
    and coats. If this goes on, they will be gone in the next 20 years.

     Hungarian 匈牙利的 known for 以…為聞名 Democratic Republic of the Congo 剛果民主共和國 velvet
    天鵝絨'
