- id: doc_113_新北_福和_英語_g9s1e3_s2_43
  section: 2
  number: 43
  type: single
  page: 3
  stem: 43. Why did Oxford Languages choose “brain rot” as the Word of the Year for
    2024?
  options:
  - label: A
    content: Because it is a new scientific term.
  - label: B
    content: Because it relates to the language.
  - label: C
    content: Because it shows the influence of online culture.
  - label: D
    content: Because it was used by a famous writer.
  group_stem: '(43-45)

    The Oxford Word of the Year for 2024 is “brain rot”. This term won because many
    people voted for it, and it highlights a common problem that we talk about today.

    So, what does “brain rot” really mean? It means our brains get weaker or less
    sharp when we spend too much time on mindless or simple online contents, such
    as funny videos and social media. In 2024, the term got popularity as a way to
    talk about the terrible effects on our minds. Some studies have showed a big increase
    in the use of this term this year.

    In fact, the term “brain rot” is not new. It first appeared in 1854 by the American
    writer Henry David Thoreau in his book Walden. Thoreau used the term to point
    out how people focused too much on small and unimportant things instead of nature,
    deep thinking, and self-improving. But now, young people on social media APPs
    like TikTok use it to joke about spending hours watching funny or strange videos.
    Besides, some people even use the term more seriously to discuss its effects on
    mental health.

    Oxford Languages chose “brain rot” because it shows that online culture has influenced
    our daily lives.The term also helps us think about how we use our time and what
    makes us happy or worried.

    So, the next time you find yourslef watching videos for hours, think about it:
    Are you having fun, or is it “brain rot”? Perhaps it’s time to take a break!

     mindless 無需動腦筋的 popularity 流行 increase 增加 mental 心理的 influence 影響'
