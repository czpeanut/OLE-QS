  stem: 41. What do we learn from the dialogue?
  options:
  - label: A
    content: Lens is the largest city in France.
  - label: B
    content: Ivan is good at taking pictures.
  - label: C
    content: Ruby has a hard time picking out a photo.
  - label: D
    content: The Louvre is the most important museum.
  group_stem: '(41-42)

    (At Ruby’s apartment)

    Ivan: How was your trip to France?

    Ruby: Couldn’t be better! I visited the Louvre, one of the world’s largest museums.

    Ivan: Did you know there’s another Louvre in the city of Lens, just two hours
    driving from Paris?

    Ruby: Yes, but I only stayed in Paris. Maybe I will visit Lens on my next trip.

    Ivan: I see. So, are these the photos you took in France?

    Ruby: Right. I’m trying to pick a photo to send to my foreign pen pal, but I can’t
    decide which one is the best.

    Ivan: How about this one?

    Ruby: Why do you like it?

    Ivan: Don’t you think you look prettier in it? In fact, most people look better
    when their left side faces the camera.

    Ruby: Really? How come?

    Ivan: A book I just read says that the left side of our face works harder than
    the right side when we cry or laugh. That’s why it is often our better side.

    Ruby: So that’s why Leonardo da Vinci painted Mona Lisa from that angle!

     pen pal 筆友'
