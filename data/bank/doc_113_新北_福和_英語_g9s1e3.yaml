  stem: 49. Why did Michelin brothers create the Michelin Guide at the very beginning?
  options:
  - label: A
    content: The French visit restaurants every weekend.
  - label: B
    content: Michelin brothers wanted to sell more tires.
  - label: C
    content: The French love to try tasty food everywhere.
  - label: D
    content: Michelin brothers encouraged the French to eat more.
  group_stem: '(49-50)

    Food plays an important role in French culture. People often say that French live
    to eat, but others eat to live. Therefore, the Michelin Guide, the world’s most
    famous food guide, comes from France.

    Michelin started as a tire company, founded by the Michelin brothers in 1889.
    At that time, not many people in France owned cars. To sell more tires, the brothers
    had an idea. Knowing how much French love food, they created a book listing good
    restaurants in different cities. This was how the Michelin Guide began. The idea
    encouraged people to drive more to try new foods, helping Michelin sell more tires.

    The Michelin Guide uses anonymous inspectors to decide if restaurants are good.
    These inspectors visit restaurants and taste the food without telling anyone who
    they are. After each visit, they write a report based on its food, service, and
    environment, and decide if a restaurant can get a Michelin star. Restaurants can
    have one, two, or three stars, but even getting one star is not easy and it is
    a big honor. Since 2018, 49 restaurants in Taiwan have received Michelin stars.
    Would you like to try them?

     found 創立encourage 鼓勵 anonymous 匿名的inspector 視察員receive 得到'
  ai_answers:
    gemini: B
    qwen: B
  answer:
  - B
  answer_status: ai_generated
  answer_source: ai:gemini+qwen
