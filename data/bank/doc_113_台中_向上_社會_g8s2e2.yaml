- id: doc_113_台中_向上_社會_g8s2e2_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: 「阿拉伯之春」是指自西元2010 年年底，在北非與西亞的阿拉伯國家和其他地區的一些國家，發生一系列以「民主」和「經濟」等為主題的反獨裁社會運動。這些運動多採取公開示威遊行和網絡串連的方式，其影響層面甚廣。請問：下列何者是與阿拉伯之春有關的事件？
  options:
  - label: A
    content: 以阿衝突
  - label: B
    content: 敘利亞難民潮大量逃往歐洲
  - label: C
    content: 伊拉克入侵科威特
