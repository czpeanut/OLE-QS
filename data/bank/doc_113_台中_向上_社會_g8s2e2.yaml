- id: doc_113_台中_向上_社會_g8s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 二戰以來，以色列與周圍鄰國經常發生衝突，大多數以國人無論男女都在 18 歲時被徵召從軍，男性的義務役將近三年、女性則是兩年。根據上文敘述，以色列如此高度重視軍事強度與戰爭動員的原因何者正確？
  options:
  - label: A
    content: 以色列因為缺乏石油，因此覬覦鄰國約旦油田想要介入爭奪
  - label: B
    content: 以色列佔領聖城麥加使阿拉伯諸國不滿
  - label: C
    content: 境內的庫德族居民因約旦河水源問題與以國經常發生衝突
  - label: D
    content: 與周圍鄰國民族及宗教信仰不同，加上爭奪巴勒斯坦領土引發紛爭。
