- id: doc_113_台中_向上_社會_g8s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 西亞與北非受制於嚴苛的自然環境，乾燥地區居民的食衣住行，皆與其他地區不同，文化形式獨樹一格。下列關於此地區的食、衣、住、行的敘述，何者與「自然環境」的關聯性「最低」？
  options:
  - label: A
    content: 椰棗甜度高，可補充熱量與其他營養，是此地區除了穀物之外，居民重要的糧食
  - label: B
    content: 阿拉伯女性外出時必須用頭巾或面紗覆蓋頭部，即使在運動比賽時亦不例外
  - label: C
    content: 此地區傳統屋頂多為平頂形式，牆壁較厚且窗戶開孔較小，並興建高於房子的通風塔
  - label: D
    content: 駱駝曾是西亞與北非重要的交通工具，除非必要，此地區的游牧民族不輕易宰殺牲畜。
