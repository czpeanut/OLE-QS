  stem: '以下三筆資料請依照中共政策實施時間先後順序排列:

    | 資料一 | ……初期，人們就像被灌注了過多的興奮劑，熱烈、瘋狂，更有些神經質的舉動！每天例行活動是對著毛澤東圖像，「早請示，中對照，晚彙報」。早上上工做什麼體操，當著樣像做……請示，中午吃飯的時候首先就自己的工作，在標語面前向來個對照，晚上彙報一天的成績和思想才能吃飯……
    |

    | --- | --- |

    | 資料二 | 這些土高爐主要用於煉鐵，但大多數地方並無鐵礦石，於是有千百計搜尋各種鐵器，甚至於老百姓家中鐵鍋、鐵鏟、鐵鎖甚至所有鐵器，都被做廢鐵投進了土高爐，煉結成根本不能用的鐵疙瘩。煉鋼煉鐵需要焦炭……發動男女老少上山找煤；找不到煤，就伐木拆房燒木炭代替……
    |

    | 資料三 | 按照土地改革法，地主的土地、耕畜、農具、多餘的糧食和住房都要沒收……但對著苦農民，特別是對貧雇農可以適當照顧，適當多分配一點，特別值得一提的是，對地主也要分給和農民一樣多的土地，讓他們一樣進行生產勞動。土改分配後，農民拿到田地證書和其他物品的證件，便開始安心地進行農業生產了……
    |'
