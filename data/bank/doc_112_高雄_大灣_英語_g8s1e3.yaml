    \ from going to school ever again.\n  Malala didn’t like this, so she did something\
    \ about it. She wrote about her life and women’s troubles in Pakistan. She told\
    \ the world her story, and the world listened. The Taliban was very angry. They\
    \ shot her, but she didn’t die. Two years later, she won the Nobel Peace Prize.\
    \ What an amazing woman!\n\n childhood 童年時期 group 團體 education 教育 trouble 困難；麻煩\
    \ shot 射中；射傷 die 死 prize 獎 amazing 令人驚喜的"
