  stem: 元太抽到《交通穿梭卡》上寫著：「明治 35 年（1902 年），開設打狗出發，經由基隆、門司、神戶到橫濱的橫濱打狗線。大正 14 年（1925 年），開設高雄橫濱線的直航路」，玩家經由此航道移動，並回答問題：「十六世紀初期，當時居住在高雄一帶的馬卡道族，為阻止倭寇及海盜的入侵，在家園四周圍種刺竹林（Takau），漢人音譯為『打狗』，並稱呼此地的馬卡道族為『打狗社』。打狗社在十七、十八世紀的英國、西班牙、荷蘭的文獻中，大抵寫為
    Tancoya，發音類似『銅（打）鼓仔』，根據民間說法，這是因為早期福建的漁民初到此地，遠眺山巒外形有如一面大鼓，稱此山為『打鼓山』（今壽山），打狗為打鼓兩字的轉音。日人在航海誌上，以和日音相近的『高砂』（日語發音為
    Takasago）記錄，因此，日人稱打狗為『高砂 Takasago』。後來將原本具鄉土氣息的地名『打狗』正式以『高雄』取代」。根據上述內容，下列哪一項因素與高雄地名的由來毫無關係？
  options:
  - label: A
    content: 地方產業
  - label: B
    content: 語言
  - label: C
    content: 地形
  - label: D
    content: 植物。
