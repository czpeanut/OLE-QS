  section: 1
  number: 20
  type: single
  page: 2
  stem: 根據彤彤日記的描述，她可能去哪個國家？
  options:
  - label: A
    content: 印尼
  - label: B
    content: 泰國
  - label: C
    content: 菲律賓
  - label: D
    content: 新加坡
  group_stem: "六、彤彤寒假與爸媽到東南亞某國旅遊，行前參考所學的地理教材，旅途中再透過導遊的解說，完成一趟很棒的知性之旅。下方是彤彤的旅遊日記，請回答下列問題：\n\
    \  第一天：剛下飛機就可以感受到當地溼熱的天氣，導遊說這裡接近赤道，全年高溫多雨，很常在午後下起雷陣雨。果真吃完中餐後，就下起滂沱大雨，下雨過後天氣也變涼爽了。\n\
    \  第二天：今天早上到首都的伊斯蒂克拉爾清真寺參觀，聽說這是東南亞最大的清真寺！中午到了餐廳吃飯，菜單上有明顯的 圖案，後來發現所有的零食也幾乎都有這標誌呢！\n\
    \  第三天：今天看到了壯闊的火山地形，路邊有一些小販在賣小花束，當地有把花丟進火山口祈福的習俗。愈接近火山口，硫磺的味道會愈來愈重，還可以聽到活火山轟隆隆的聲響。\n\
    \  第四天：回到首都附近後，參觀老城，發現很多歐式的建築，導遊說這個國家曾經為荷蘭殖民地，想到歷史老師說過臺灣也曾經被荷蘭統治過呢！"
