    片名：三個傻瓜

    故事大意：傳統的印度社會總認為子女未來當工程師或醫師，人生才是成功，主角們雖就讀頂尖理工學校，卻為自己興趣夢想努力的故事。

    片名：來自星星的傻瓜 PK（PK）

    故事大意：一名外星人來到地球並和一名記者成為朋友，對種種宗教迷信表示質疑。

    片名：我和我的冠軍女兒（Dangal）

    故事大意：主角瑪哈維亞訓練兩位女兒吉塔和芭碧塔成為摔角選手。'
  tags:
