  group_stem: "四、請閱讀下方文章回答問題：\n  瓦拉納西是印度著名的歷史古城，享有「印度之光」的稱號。信奉甲宗教的教徒們認為瓦拉納西死去，並在印度人視為「母親之河」的乙河河畔火化，能夠超脫生死輪迴的循環，獲得救贖。此外，他們也相信在這條河川沐浴後，即可洗滌汙濁的靈魂。\n\
    \  然而，由於絡繹不絕的信徒在該河川火化與沐浴，加上其他社會變遷，使河川遭受嚴重的汙染，並威脅居民健康，成為印度當局棘手的公共衛生難題。"
