  stem: 電影裡，主角們就讀的頂尖理工學校，其實是參考相當知名的印度理工學院而來。印度政府為了進一步扶植高科技產業，將航太總部設立在某城市，經過數十年努力耕耘，該城市也成為全印度的資訊科技中心。文中所提及的「某城市」最可能為下列何者？
  options:
  - label: A
    content: 孟買
  - label: B
    content: 新德里
  - label: C
    content: 邦加羅爾
  - label: D
    content: 瓦拉納西。
