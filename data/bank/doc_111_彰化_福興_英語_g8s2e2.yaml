- id: doc_111_彰化_福興_英語_g8s2e2_s8_5
  section: 8
  number: 5
  type: single
  page: 4
  stem: What did the school in Tokushima add to its pumpkin cola cakes?
  options:
  - label: A
    content: ground beef
  - label: B
    content: ground pork
  - label: C
    content: ground chicken
  - label: D
    content: ground cricket powder
  group_stem: '(2)

    The United Nations’ Food and Agriculture Organization (FAO) sees insects as a
    sustainable solution to the global food crisis because of their rich protein and
    low environmental impact. Yet, many still view insects as enemies, not food, making
    it difficult to overcome this psychological barrier.


    Despite this, some schools are bringing them into their lunch menus. One school
    in Tokushima added ground cricket powder to its pumpkin cola cakes to provide
    students with a nutritious meal. To make the insect more acceptable, it was ground
    into powder and added to the dish. Students were curious about the taste and reported
    that they couldn’t even tell it was made with cricket powder. The school said
    that it was up to the students to decide to eat it or not.


    The school’s decision to use cricket powder in its lunch program was part of its
    ongoing effort to study the potential of “circular food” – using food waste as
    an ingredient for new dishes. Insects, mostly crickets, are a protein-rich source
    of food with low environmental impact, and using them in this way helps reduce
    greenhouse gas emissions. However, not everyone thinks highly of circular food.
    Another high school in Tokushima got many complaints from parents after adding
    insects in their menu.


    Food and Agriculture Organization (FAO) 聯合國糧食及農業組織

    sustainable 可持續的 environmental 環境的 psychological barrier 心理障礙

    ground (grind) 碾碎 cricket 蟋蟀 nutritious 營養豐富的

    acceptable 可接受的 potential 潛在的 complaint 抱怨'
