- id: doc_111_彰化_福興_英語_g8s2e2_s8_3
  section: 8
  number: 3
  type: single
  page: 3
  stem: What can we learn about the drones from the reading?
  options:
  - label: A
    content: They come in different shapes and sizes.
  - label: B
    content: They might kill people.
  - label: C
    content: Some can stay in the air for hours.
  - label: D
    content: They are not just for fun.
  group_stem: '(1.) 生活英語


    Have you seen one like this? It is not a bird or an airplane. It is a drone, an
    unpiloted aircraft.

    With drones becoming more popular, their price has plummeted. They cost a lot
    of money before, but you are able to get a simple one for only some thousand NT
    dollars now. You can even buy one for only NT$1,500 on the Internet when they
    are on sale.

    Drones are sought after by not only players but also businesses. Take Amazon for
    example, For the past few years, the big company has been testing a new way to
    deliver packages by using drones. The “octocopters,” Amazon’s drones, can carry
    things up to 2.3kg. they are able to get packages to customers in only 30 minutes.
    In some ways, they are more earth-friendly than trucks because they do not need
    gas. Also, they are sometimes faster since the traffic in the sky is much less
    than that on the roads.

    However, there are some worries about delivering things with drones. For example,
    the drones might make too much noise, which will be troubling. What’s more, if
    the drones are out of order, they may not work well or safely. So, it might take
    a few more years before the sky is packed with delivering drones.

