- id: doc_112_高雄_林園_社會_公民_g7s1e3_s1_39
  section: 1
  number: 39
  type: single
  page: 1
  stem: '請閱讀下文，判斷大武部落重建，會為部落帶來什麼樣的改變與轉機？

    屏東縣霧台鄉的大武部落，位於海拔一千多公尺的山上，帄時只要遭逢豪雨沖刷，對外聯絡道路就可能受損而無法通行，部落就曾因為路毀而陷入斷糧危機，由空勤隊緊急空投物資救援才得以度過。民國98
    年的莫拉克風災，更是讓大武部落飽受摧殘，但部落族人決心回到家鄉，將聚落、產業、以及人與自然的關係都好好的重建。'
  options:
  - label: A
    content: 發展部落特色與文化，創造部落的永續發展
  - label: B
    content: 發展部落文化會帶來部落的衝突與競
  - label: C
    content: 政府會為此成立一個專責的機構保護
  - label: D
    content: 人口重新回流會讓部落文化難以維繫
  answer:
  - A
