    content: 若兩杯水溶液體積相等，以乙杯所含溶質之莫耳數較多
  - label: B
    content: 若兩杯之底面積相等，且甲、乙兩杯水溶液之高度比為3：2，則甲、乙兩杯之莫耳濃度比為9：4
  - label: C
    content: 若兩杯水溶液之重量相等，則甲、乙兩杯之重量百分濃度比為35：36
  - label: D
    content: 若兩杯水溶液體積比為3：2，則甲、乙兩杯之莫耳濃度比為6：7。
