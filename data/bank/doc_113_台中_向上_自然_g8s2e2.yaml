- id: doc_113_台中_向上_自然_g8s2e2_s1_39
  section: 1
  number: 39
  type: single
  page: 2
  stem: '請閱讀下列敘述後回答問題：

    在栽種植物時，為了補充不足的礦物質，通常會使用含有氮、磷、鉀的物質當作肥料。阿誠依重量百分濃度配製含有如下成分的水溶液，以作為栽種時所添加的肥料。

    硝酸銨（$NH_{4}NO_{3}$）………5％

    磷酸鈉（$Na_{3}PO_{4}$）………10％

    氧化鉀（$K_{2}O$）……………5％

    已知鉀的原子量為39，氧的原子量為16。則250 公克的肥料水溶液中約含有多少公克的鉀元素？'
  options:
