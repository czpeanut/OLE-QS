- id: doc_113_台中_向上_自然_g8s2e2_s1_40
  section: 1
  number: 40
  type: single
  page: 2
  stem: '實驗室裡有四個沒有標示的玻璃瓶，瓶子中都裝著白色的固體。老師說它們分別為NaOH、CaCl2、CaCO3 和Na2CO3，並要同學們用實驗方法確認這些藥品後，再貼上標籤。小蘭、小治、大炳和春花等四位同學將此四瓶分別編號為甲、乙、丙和丁，然後進行下列實驗操作，並將觀察到的結果記錄如表5：

    表5

    | 實驗操作 | 觀察到的結果: 甲 | 觀察到的結果: 乙 | 觀察到的結果: 丙 | 觀察到的結果: 丁 |

    | :--- | :---: | :---: | :---: | :---: |

    | 取1克藥品置於試管，加水10mL後搖盪試管 | 不溶 | 溶解 | 溶解 | 溶解 |

    | 滴兩滴酚酞指示劑於水溶液中 | ---- | 紅色 | 紅色 | 無色 |

    | 取1克藥品置於試管中，分別加入稀鹽酸 | 產生氣泡 | 產生氣泡 | 沒有氣泡 | 沒有氣泡 |

    (註：因甲不溶於水，故不作酚酞指示劑的試驗)

    小蘭、小治、大炳和春花等四位同學分別寫出甲、乙、丙和丁四個玻璃瓶的標示如下表6，根據實驗所觀察的結果，哪一位同學的標示正確？

    表6

    | | 甲 | 乙 | 丙 | 丁 |

    | :---: | :---: | :---: | :---: | :---: |

    | 小蘭 | $CaCO_{3}$ | $Na_{2}CO_{3}$ | NaOH | $CaCl_{2}$ |

    | 小治 | $CaCO_{3}$ | NaOH | $CaCl_{2}$ | $Na_{2}CO_{3}$ |

    | 大炳 | $Na_{2}CO_{3}$ | $CaCO_{3}$ | $CaCl_{2}$ | NaOH |

    | 春花 | $Na_{2}CO_{3}$ | $CaCl_{2}$ | NaOH | $CaCO_{3}$ |'
  options:
  - label: A
    content: 小蘭
  - label: B
    content: 小治
  - label: C
    content: 大炳
  - label: D
    content: 春花。
