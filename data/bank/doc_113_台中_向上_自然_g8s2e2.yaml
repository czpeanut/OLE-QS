    則此實驗遮住瓶底「十」字的物質是什麼？在停止計時的瞬間，遮住「十」字的量，哪一次產生最多？又若第3 次實驗中硫代硫酸鈉濃度改為0.25 M，其餘條件不變，則所測的數據較可能在上圖8
