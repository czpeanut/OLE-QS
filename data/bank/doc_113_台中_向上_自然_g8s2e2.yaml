  stem: 超夯變色飲料！由紫到藍漸層，看起來好夢幻。不過這麼鮮豔的顏色可別以為是加了色素，其實是這個叫做蝶豆花的植物在搞鬼。用水輕泡蝶豆花茶呈現藍色；但只要遇到檸檬汁呈酸性則變成紫色；如果加了鹼性物質時又變成綠色了。蝶豆花是天然植物，喝起來沒有味道，是大自然的酸鹼指示劑，可以利用它調配出像魔法般的夢幻飲品。若取一杯紫色的蝶豆花茶加水稀釋，則下列哪一個圖形可以表示其
