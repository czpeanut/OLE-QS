    content: 望周處藉此成就一番豐功偉業
  group_stem: '※請根據下文，回答7-8 題：


    周處年少時，兇彊俠氣，為鄉里所患。又義興水中有蛟，山中有邅跡虎，並皆暴犯百姓，義興人謂為三橫，而處

    尤劇。


    或說處殺虎斬蛟，實冀三橫唯餘其一。處即刺殺虎，又入水擊蛟，蛟或浮或沒，行數十里，處與之俱。經三日三

    夜，鄉里皆謂已死，更相慶，竟殺蛟而出。聞里人相慶，始知為人情所患，有自改意。


    乃自吳尋二陸，平原不在，正見清河，具以情告，並云：「欲自修改，而年已蹉跎，終無所成。」清河曰：「古人

    貴朝聞夕死，況君前途尚可。且人患志之不立，亦何憂令名不彰邪？」處遂改勵，終為忠臣孝子。


    （劉義慶  《世說新語．自新》）'
