    耀，感動無數人心。但，現實真的如此嗎？\n    在美麗的天燈施放過後，我們所看不到的，是隨之而來散落在各地的垃圾，不僅造成環境汙染，隨時可能引起的\n火災，也讓平溪周邊的民眾隨時處在警戒狀態。\n\
    \    根據環保局統計，每年過年至元宵節期間，光平溪當地就會製造超過二十噸的垃圾，翠綠山頭被五顏六色天燈所\n「點綴」，那畫面特別怪異且突兀。雖然說，平溪區公所每年都會加派人力清除周邊垃圾，也祭出獎勵辦法鼓勵居民幫\n\
    忙清掃，但隨時可能「降落」的垃圾，已讓許多居民不勝其擾。\n    天燈到底該不該放？也許要全面禁止，是件不可能的事。\n    新北市政府所舉辦的「平溪天燈節」，今年也邁入第21\
    \ 個年頭，不論在傳統文化意義與觀光經濟效益上，天燈都\n有不可或缺的重要性與代表性。\n    如果把「天燈」這個要素因為保護環境之故而從平溪取消，恐怕平溪線鐵道都有可能因為漸漸減少的人潮而黯淡，\n\
    不僅造成當地經濟效益的損失，連帶會影響國際觀光效益。\n    天燈，就好比平溪的命脈，它的重要性甚至被Discovery 評為「全世界最重要節慶」第二名（僅次於巴西嘉年華）、\n\
    CNN 也推薦為「世界上最值得參與的年度新鮮事」之一。\n\n（節錄自魯皓平  放天燈是傳統，還是為山林製造更多垃圾？）"
