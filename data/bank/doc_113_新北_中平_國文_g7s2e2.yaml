- id: doc_113_新北_中平_國文_g7s2e2_s5_13
  section: 5
  number: 13
  type: single
  page: 7
  stem: 如果平溪取消施放天燈，會產生什麼後果？
  options:
  - label: A
    content: 造成聚落人口外移
  - label: B
    content: 中華的傳統文化將消失殆盡
  - label: C
    content: 新北市政府會另覓其他地點施放天燈
  - label: D
    content: 因為人潮減少造成當地經濟效益的損失
  group_stem: "※請根據下文，回答13-15 題：\n\n元宵燈節是中華文化的傳統，台灣各地也因應各地區不同的風俗民情，在數百年的演化變遷下誕生出獨有的在地\n\
    特色。每到這個時節，鹽水人會齊聚放蜂炮，象徵祈求平安；台東會炸寒單爺，相傳是為替寒單爺取暖；提燈籠、吃\n元宵，更是一年一度的過節經典，而最受到觀光客歡迎的，當屬平溪天燈節莫屬。\n\
    \    放天燈很浪漫，人們可以在七彩的天燈表面上寫下自己的心願，再點燃火種，藉由熱空氣上升的原理，將願望上\n達天聽。在黑夜中閃爍的光影，彷彿人間最美麗的景象，幸福又美好。\n\
    \    近年來，由於天燈一整年皆可以施放，每年都吸引數十萬的觀光人潮與至少三億元的商機，為十分、平溪、菁桐\n等站帶來龐大的觀光效益。\n    特別是有許多日本、韓國與香港的觀光客從國外慕名而來ˇˇ平溪成了許多外國朋友來台體驗傳統文化的首選，\n\
    上千盞天燈同步冉冉上升的畫面，也是觀光局推廣台灣意象的主要宣傳象徵。\n    在元宵天燈活動時，主辦單位更會準備數千盞的天燈免費提供給民眾施放，那碩大與壯觀之美，就彷彿星空般閃\n\
    耀，感動無數人心。但，現實真的如此嗎？\n    在美麗的天燈施放過後，我們所看不到的，是隨之而來散落在各地的垃圾，不僅造成環境汙染，隨時可能引起的\n火災，也讓平溪周邊的民眾隨時處在警戒狀態。\n\
    \    根據環保局統計，每年過年至元宵節期間，光平溪當地就會製造超過二十噸的垃圾，翠綠山頭被五顏六色天燈所\n「點綴」，那畫面特別怪異且突兀。雖然說，平溪區公所每年都會加派人力清除周邊垃圾，也祭出獎勵辦法鼓勵居民幫\n\
    忙清掃，但隨時可能「降落」的垃圾，已讓許多居民不勝其擾。\n    天燈到底該不該放？也許要全面禁止，是件不可能的事。\n    新北市政府所舉辦的「平溪天燈節」，今年也邁入第21\
    \ 個年頭，不論在傳統文化意義與觀光經濟效益上，天燈都\n有不可或缺的重要性與代表性。\n    如果把「天燈」這個要素因為保護環境之故而從平溪取消，恐怕平溪線鐵道都有可能因為漸漸減少的人潮而黯淡，\n\
    不僅造成當地經濟效益的損失，連帶會影響國際觀光效益。\n    天燈，就好比平溪的命脈，它的重要性甚至被Discovery 評為「全世界最重要節慶」第二名（僅次於巴西嘉年華）、\n\
    CNN 也推薦為「世界上最值得參與的年度新鮮事」之一。\n\n（節錄自魯皓平  放天燈是傳統，還是為山林製造更多垃圾？）"
