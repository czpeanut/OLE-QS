  group_stem: '以下二則資料為不同時段有關鄭氏政權的資料，試閱讀後回答問題。

    資料一：「成功以海外彈丸地，養兵十余萬，甲冑戈矢堅利，戰艦以數千計…。我朝嚴禁通洋，片板不得入海，而商賈壟斷，厚賂守口官兵，私通鄭氏，以通廈門，然後通販各國。凡中國諸貨，海外人皆仰資鄭氏，於是通洋之利，惟鄭氏獨操之，財用益饒。」此為對鄭氏政權的評論。

    資料二：「本藩矢志恢復，念切中興。前者出師北討，恨尺土之未得；既而舳艫南還，恐孤島之難居。故冒波濤，欲闢不服之區，暫寄軍旅，養晦待時；非為貪戀海外，苟延安樂。自當竭誠，禱告皇天，並達列祖，假我潮水，行我舟師。」此為鄭成功征戰某地前的宣告。'
