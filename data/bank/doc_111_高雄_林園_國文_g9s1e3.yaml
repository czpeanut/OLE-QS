  group_stem: "我不在家，兒子便是你管束。要須長其忠厚之情，驅其殘忍之性，不得以為猶子而姑縱惜也。家人兒女，總是天地間一般人，當一般愛惜，不可使吾兒凌虐他。凡魚飧果餅，宜均分散給，大家歡嬉跳躍。若吾兒坐食好物，令家人子遠立而望，不得一沾唇齒；其父母見而憐之，無可如何，呼之使去，豈非割心剜肉乎！\n\
    \    夫讀書中舉中進士作官，此是小事，第一要明理作個好人。可將此書讀與郭嫂、饒嫂聽，使二婦人知愛子之道在此不在彼也。                 \
    \                   （節錄自 鄭燮 濰縣署中與舍弟墨第二書）"
