  section: 5
  number: 27
  type: single
  page: 4
  stem: 根據上文，關於在連橫所處時代臺灣人喝茶的習慣，下列敘述何者正確？
  options:
  - label: A
    content: 以凍頂烏龍茶為上品
  - label: B
    content: 喝烏龍茶時會加入白糖消暑
  - label: C
    content: 眾人喜歡喝新茶不喜歡喝舊茶
  - label: D
    content: 鐵觀音茶屬上品茶必須加糖沖泡
  group_stem: "武夷地區是中國產茶的重要區域之一，臺灣有名的烏龍茶即是輾轉由武夷茶移植過來的。武夷茶原本生長在山上，當地人稱之為「巖茶」，後來栽種面積逐漸擴大，終至福建全省，而稱閩茶。這種茶茶湯深濃如鐵鏽，明\
    \ 清之後為作區別，就幫它取了個名字叫「鐵觀音」。清代大量移民從安溪、泉州來到臺灣，順便把福建的茶種也帶來，但因土壤氣候的不同，自然演化出另外一個新的品種，便是我們俗稱的「烏龍茶」了。\n\
    \  直到清末民初，烏龍茶在臺灣的評價並不高。當時比較富裕的臺灣人喝茶喜歡把兩種以上的茶放在一起泡，形成一種很特殊的飲茶方式。連橫(1878~1936)《雅堂筆記·茗談》談到臺灣人當時的飲茶習慣說：「新茶清而無骨，舊茶濃而少芬，必新舊合拌，色味得宜，喚之而香，啜之而甘，雖歷數時，芳留齒頰，方為上品。安溪之茶曰鐵觀音，亦稱上品。然性較寒冷，不可常飲。若合武夷泡之，可提其味。」\n\
    \  連橫又說：「烏龍為北臺名產，味極清芬，色又濃郁，巨壺大盆，和以白糖，可以祛暑，可以消積，而不可以入品。」\n  連橫距離我們雖不遠，但時代改變、流行改變得太快。\n\
    (改寫自周志文〈茶與茶書〉）"
