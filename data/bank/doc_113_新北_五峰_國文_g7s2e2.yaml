- id: doc_113_新北_五峰_國文_g7s2e2_s5_29
  section: 5
  number: 29
  type: single
  page: 4
  stem: 作者在文中說：「『庖丁解牛』驚醒了文惠君藝術的假相，返回到生活現實，尋找真正的美。」下列何者最接近作者想要傳達的觀點？
  options:
  - label: A
    content: 許多抱怨著每天太長的人，卻又嫌生命太短
  - label: B
    content: 漫漫長途，何時迴轉？及時行樂，放浪形骸
  - label: C
    content: 桃源未必在深處，生活中的美好，俯拾即是
  - label: D
    content: 生活未必會給答案，所以跟同學借來抄更快
  group_stem: "莊子講美學，最動人的一段是「庖丁解牛」。「庖丁」是肢解牛的屠夫，在一般人的印象中，屠宰的工作，殺豬解牛，血淋淋的，似乎一無美感可言。\n\
    \  可是庖丁認真專注，在肢解牛的動作中，使當時上層階級的文惠君震動了。文惠君如果活在今天，大概是常常跑國家劇院國家音樂廳的「藝術愛好者」吧！某一天，他或許正看完了《歌劇魅影》，或聽完了柏林愛樂的演奏，走回家去，正好經過庖丁正在解牛的作坊，他沒有匆匆走過，他停了一下，仔細觀察庖丁的動作。他訝異極了！他發現庖丁在肢解牛隻時，乾淨俐落，有極美好的動作，可以比美「桑林之舞」；肢解牛隻時，也有極美的聲音，可以比美「咸池之樂」。用今天的話來說，文惠君竟然在屠宰場感覺到了比國家劇院或音樂廳更美、也更動人心魂的舞蹈與音樂。\n\
    \  如果我們不懂得在生活中感覺無所不在的美，三天兩頭跑劇院、音樂廳、畫廊，也只是鄙俗的附庸風雅吧！\n  「庖丁解牛」驚醒了文惠君藝術的假相，返回到生活現實，尋找真正的美。\n\
    \  庖丁其實是真正的藝術家，他告訴文惠君：剛開始到屠宰場，負責肢解牛的身體，他是用砍的、割的，弄得一手血淋淋，的確不美。\n  日復一日，經由一種專注，在工作中可以歷練出一種美。他告訴我們：牛的關節，看起來盤根錯節，其實可以理出頭緒。因為專注，他逐漸看不見整隻牛，他只專心在局部的骨節。\n\
    \  他說：骨節與骨節之間，有空隙，手中的刀刃，薄到沒有厚度，因此「以無厚入有間，遊刃有餘」。\n  「遊刃有餘」，我們今天還在用的成語，正是來自莊子的這段故事。\n\
    \  「遊刃有餘」是生命有了揮灑的自由，「遊刃有餘」是自己的身體感覺到了空間的自由。「遊刃有餘」是使自己從許多牽絆與束縛中解放出來，還原到純粹的自我。\n\
    \  「遊刃有餘」正是美的最純粹經驗。我們感覺不到美，做事就綁手綁腳。我們一旦感覺到美，做任何事，都可以遊刃有餘。\n(節錄自蔣勳《天地有大美》）"
