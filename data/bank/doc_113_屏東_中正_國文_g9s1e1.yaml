- id: doc_113_屏東_中正_國文_g9s1e1_s5_6
  section: 5
  number: 6
  type: single
  page: 4
  stem: 根據文意，文中所指的「山市」是哪一種物理現象？
  options:
  - label: A
    content: 慣性運動
  - label: B
    content: 山中回音
  - label: C
    content: 海市蜃樓
  - label: D
    content: 地心引力。
  group_stem: "（三）山市\n奐山山市，邑八景之一也，然數年恆不一見。孫公子禹年與同人飲樓上，忽見山頭有孤塔聳起，高插青冥，相顧驚疑，念近中無此禪院。無何，見宮殿數十所，碧瓦飛甍，始悟為山市。未幾，高垣睥睨，連亙六七里，居然城郭矣。中有樓若者，堂若者，歷歷在目，以億萬計。忽大風起，塵氣莽莽然，城市依稀而已。既而風定天清，一切烏有。\n\
    \                                                                            \
    \   (節錄自蒲松齡 山市）\n【註釋】\n① 甍：音ㄇㄥˊ屋脊"
