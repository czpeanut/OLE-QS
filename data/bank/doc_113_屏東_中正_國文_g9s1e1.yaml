  section: 4
  number: 1
  type: single
  page: 1
  stem: 下列各項「 」中的注音寫成國字後，何組的字形相同？
  options:
  - label: A
    content: 瀑布傾「ㄒㄧㄝˋ」／「ㄒㄧㄝˋ」露祕密
  - label: B
    content: 好高「ㄨˋ」遠／趨之若「ㄨˋ」
  - label: C
    content: 戰火「ㄖㄡˊ」躪／用手搓「ㄖㄡˊ」
  - label: D
    content: 河邊「ㄈㄢˋ」舟／「ㄈㄢˋㄈㄢˋ」之輩。
- id: doc_113_屏東_中正_國文_g9s1e1_s4_2
  section: 4
  number: 2
  type: single
  page: 1
  stem: 下列各項「 」中的字，何組的讀音相同？
  options:
  - label: A
    content: 凱「旋」歸來／「旋」風
  - label: B
    content: 天上宮「闕」／付之「闕」如
  - label: C
    content: 「間」不容髮／挑撥離「間」
  - label: D
    content: 妙趣「橫」生／飛來「橫」禍。
- id: doc_113_屏東_中正_國文_g9s1e1_s4_3
  section: 4
  number: 3
  type: single
  page: 1
  stem: 有關「詞」的體例，下列說明何者正確？
  options:
  - label: A
    content: 詞的格式自由，無須顧及平仄、押韻與字數
  - label: B
    content: 每首詞皆有調名，稱為詞牌，依據內容而定
  - label: C
    content: 詞依據分段多寡可分為小令、中調、長調
  - label: D
    content: 詞一首稱為「闋」，可分段，一段稱為「片」。
- id: doc_113_屏東_中正_國文_g9s1e1_s4_4
  section: 4
  number: 4
  type: single
  page: 1
  stem: 李清照武陵春與辛棄疾南鄉子登京口北固亭有懷兩闋詞的比較，下列敘述何者有誤？
  options:
  - label: A
    content: 前者詞作風格婉約派；後者詞作風格豪放派
  - label: B
    content: 前者寫作技巧藉景抒情；後者寫作技巧懷古抒情
  - label: C
    content: 前者上片寫暮春殘景，下片寫乘船散心；後者上片寫登高望遠，下片寫三國史實
  - label: D
    content: 前者抒發韶光易逝、美景凋零之嘆；後者抒發國無能人之愁。
  lesson_raw:
    title: 詞選
    basis: 比較李清照《武陵春》與辛棄疾《南鄉子 登京口北固亭有懷》
- id: doc_113_屏東_中正_國文_g9s1e1_s4_5
  section: 4
  number: 5
  type: single
  page: 1
  stem: 對於李清照和辛棄疾的簡介，下列何人的敘述完全正確？
  options:
  - label: A
    content: 大雄：「李清照，號易安居士，著有漱玉詞。」
  - label: B
    content: 胖虎：「李清照早期詞風蒼涼，後轉為清新婉約。」
  - label: C
    content: 靜香：「辛棄疾，號黃沙居士，有稼軒長短句傳世。」
  - label: D
    content: 小夫：「辛棄疾詞風以清新淡遠見長，與蘇軾並稱『蘇辛』。」
  lesson_raw:
    title: 詞選
    basis: 涉及李清照與辛棄疾生平簡介
