  stem: 讀完本文後，老師請同學用一句話解釋，文中所謂的「同溫層效應」。下列哪位同學的回答最恰當？
  options:
  - label: A
    content: 彥均：大氣層中平流層水平方向流動平穩的狀態
  - label: B
    content: 凱裕：身處在同一類氣候畫分的地理區域的現象
  - label: C
    content: 幼祥：人格系統中情緒行為表現充滿熱忱的現象
  - label: D
    content: 佑瑞：在想法相類似的社交圈中交流的舒適現象。
  group_stem: "（五）同溫層裡又暖又舒服，為什麼要刻意讓自己「認知失調」\n  社群網站興起後，由於個人化演算法的緣故，看到的多是與自己相同或相似的想法言論，因此很容易產生「同溫層效應」。這揭示出一個心理學上的問題：「為什麼大部分的人願意花更多的時間，接收與自己立場相同或相似的言論，並與之互動，而不是花更多的時間，去傾聽了解與自己不同甚至是對立的言論呢?」\n\
    \    這要從認知模式說起，每個人每天遇到的訊息浩如瀚海，但是腦袋的處理能力又極其有限，所以大腦需要一套框架設定好某些條件，來幫助我們處理這些資訊，這就是所謂「認知模式」。\n\
    \  認知模式是我們用來解釋這個世界的參考標準，雖然每個人都感覺平時看到的是「客觀」的事物，但實際上我們所認知到的，是經過認知模式過濾並加以詮釋過的。當我們遇到與自身認知模式矛盾或不利的資訊時，就會產生「認知失調」，它會破壞大腦的穩定狀態，讓我們下意識地想要消除之。若欲恢復到穩定狀態，大腦常用的方法有兩種：\n\
    一、忽略：選擇性忽略與過濾掉那些與我們認知模式矛盾或是不利的資訊，甚至乾脆不去理會。\n二、合理化：比起直接忽略，合理化則更常發生在各種不同同溫層的討論中，畢竟事實擺在眼前很難忽略，但卻可以用符合自身的認知模式重新「詮釋」它。\n\
    \  由此可見，要跨出自己的同溫層，才能更全面的思考問題。可試著朝以下兩點努力：\n一、擴大取得資訊的管道：由於人總是傾向忽略那些與我們認知模式矛盾的資訊，因此我們更需有意識的去尋求反面的觀點與論據。例如：強迫自己看一些與自己立場不同的媒體，或是追蹤與自己不同立場的人的動態。\n\
    二、抱持懷疑的態度：為了跳出自身的認知模式，應時時對自己的信念抱持懷疑的態度，詢問自己「這些相反的觀點，道理在哪裡?」「有沒有跟我的立場相反的客觀證據存在?」藉由不時敲打自己的信念，來打破同溫層的認知模式。\n\
    \  跨越同溫層很難，但是能夠容納矛盾觀點的心，才是一顆真正強大的內心。\n\n                      (節錄自關鍵評論網李坤翰同溫層裡又暖又舒服，為什麼要刻意讓自己「認知失調」?）"
