- id: doc_113_屏東_中正_國文_g9s1e1_s5_4
  section: 5
  number: 4
  type: single
  page: 3
  stem: 當船隻與鯨豚之間的距離由一百二十公尺變為四十公尺時，關於其船速的變化，下列何者最恰當？
  options:
  - label: A
    content: 速度節維持在五節
  - label: B
    content: 由四節轉為怠速
  - label: C
    content: 由八節轉為怠速
  - label: D
    content: 由十節降至五節。
  group_stem: "（二）賞鯨船船長自訂賞鯨自律規範\n一、船隻接近鯨豚群的減速約定\n  1.船隻接近鯨豚群至裸眼可見水面鯨豚身影時，船速必須降為十節以下。\n\
    \  2.船隻接近鯨豚二百公尺內，船速必須降為五節以下。\n  3.鯨豚群在船隻周圍五十公尺內，船隻必須怠速行駛，並且不可以突然改變船隻方向與速度。\n二、船隻行進方向的約定\n\
    1.若鯨豚群出現在船尾後方，船不可動，待鯨豚群往前，船隻再慢慢跟上。\n2.船隻行進或離開均不可切鯨豚群行進方向。\n3.若欲閃避或不大理船隻之鯨豚群，船隻應保持恰當距離觀察，不可強制迫近觀看。所有接觸以不干擾鯨豚群既有行為為原則。\n\
    三、船隻與鯨豚群近距離接觸時的航行約定\n  1.船隻主動離開鯨豚群時，應緩慢由鯨豚群左右後側方離開，不可與鯨豚群同方向或切鯨豚群離開（尤其是移動較為緩慢的中大型鯨）。\n\
    2.船隻與中大型鯨接觸，船隻應於五十公尺以外靜觀。若船隻停止狀態下，而鯨豚主動靠近，不在此限。\n3.遇大型鯨母子對，船隻應保持八十公尺以上距離。\n4.遇特定鯨豚群，例如：花紋海豚、熱帶斑海豚、瓜頭鯨、抹香鯨等，船隻應保持五十公尺外靜觀。\n\
    5.遇小型鯨豚群，船速應不超過鯨豚群游速。"
