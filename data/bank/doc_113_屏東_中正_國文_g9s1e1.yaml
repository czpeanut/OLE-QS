  - label: B
    content: 鄉村是寧靜舒適的，而都市是繁華熱鬧的
  - label: C
    content: 曲初以胡琴開端，柔順的旋律如上好的緞面
  - label: D
    content: 牽也牽不住的小雨絲哪，總在我心深處，挑著、刺繡著纏綿的鄉愁。
