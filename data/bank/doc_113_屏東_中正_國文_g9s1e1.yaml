  group_stem: "（一）詞三闋‧李煜\n（甲）往事只堪哀，對景難排。秋風庭院蘚侵階。一任珠簾閒不捲，終日誰來？   金劍已沉埋，壯氣蒿萊。晚涼天淨月華開。想得玉樓瑤殿影，空照秦淮。\
    \                                           （浪淘沙）\n                          \
    \                    \n（乙）春花秋月何時了？往事知多少？小樓昨夜又東風，故國不堪回首月明中。   雕闌玉砌應猶在，只是朱顏改。問君能有幾多愁？恰似一江春水向東流。\
    \                            （虞美人）\n          \n（丙）人生愁恨何能免？銷魂獨我情何限！故國夢重歸，覺來雙淚垂。\
    \    高樓誰與上？長記秋晴望。往事已成空，還如一夢中。                                                \
    \                   （子夜歌）"
