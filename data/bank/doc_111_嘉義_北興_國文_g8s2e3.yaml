  group_stem: '夢想與現實總是有一段不小的差距。蕭青陽真正接觸到音樂界後，發現臺灣的主流音樂界不喜歡獨立的創意設計，而是一窩蜂追求偶像流行。蕭青陽說，民國八十年代的流行錄音帶封面都要放上明星漂亮的大特寫，九十年代則是要展現出歌手的好身材，這些「流行風格」讓美術設計沒有發揮的空間。這讓對封面設計很有想法的蕭青陽，在此環境中顯得格格不入。

