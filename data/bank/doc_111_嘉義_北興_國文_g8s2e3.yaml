- id: doc_111_嘉義_北興_國文_g8s2e3_s4_33
  section: 4
  number: 33
  type: single
  page: 4
  stem: 本文為什麼認為蕭青陽替華人唱片設計界開創了嶄新的道路?
  options:
  - label: A
    content: 兼顧偶像形象塑造與藝術創作，從中取得理想與現實的平衡
  - label: B
    content: 藉由獨到的藝術眼光和人文內涵，突破市場取向的設計風格
  - label: C
    content: 勇於參加各項國際大賽，並與參賽者切磋，凝聚個人特色
  - label: D
    content: 和各種類型的歌手、唱片公司合作，準確抓住大眾的喜好。
  group_stem: '夢想與現實總是有一段不小的差距。蕭青陽真正接觸到音樂界後，發現臺灣的主流音樂界不喜歡獨立的創意設計，而是一窩蜂追求偶像流行。蕭青陽說，民國八十年代的流行錄音帶封面都要放上明星漂亮的大特寫，九十年代則是要展現出歌手的好身材，這些「流行風格」讓美術設計沒有發揮的空間。這讓對封面設計很有想法的蕭青陽，在此環境中顯得格格不入。

    進入職場不久的蕭青陽，為了堅持自己的設計理念，常常和上司交代的從眾風格有所爭執。在多次天人交戰後，他開始對自己「是否適合走這條路」出現了動搖。二十多歲年輕氣盛的他，心想：「既然無法改變大環境，是否就該離開自己最愛的設計領域？」

    有些自暴自棄的他，真的離開了最愛的美術設計領域，在某所學校門口擺了一個麵攤子，也開過自助餐廳。在轉行從事餐飲業的一年中，他無法割捨自己對唱片封面設計的熱情，於是決定重回唱片公司。但這次他轉而為非主流音樂界的獨立創作者，以及具特色的樂團等設計唱片封面。

    蕭青陽獨特的設計風格和這些獨立歌手及唱片公司的需求不謀而合，終於讓他成功地找到自己在設計領域中的定位。他充滿創意的理念和構想，更為臺灣唱片設計領域往後的發展帶來了全新的風貌和色彩。'
  tags:
    textbook: 八下 自學課三 進軍葛萊美的華人設計師──蕭青陽
