  section: 1
  number: 9
  type: single
  page: 1
  stem: 新北市勞工局自 105 年起，推出「新北勞動雲」網站，包括違法雇主查詢、勞資調解便利通、職訓補給站、資遣通報等多項線上申辦服務，轄內的勞工及事業單位皆可透過手機與行動裝置瀏覽使用。勞工局建議，盡量還是透過正規人力銀行平臺找工作較有保障，因為刊登在人力銀行的職缺，往來的企業至少有經濟部公司營業登記，客服人員會定期訪查，並有投訴管道，工作較有一定的保障。根據上文內容，下列敘述何者正確？
