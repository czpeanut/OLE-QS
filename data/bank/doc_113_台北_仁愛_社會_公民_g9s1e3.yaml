  stem: 關於土耳其的現況，以下何者描述錯誤?
  options:
  - label: A
    content: 該國民眾儲蓄的動機下降
  - label: B
    content: 銀行發行信用卡不易獲利
  - label: C
    content: 政府補助有助於減緩國家通膨
  - label: D
    content: 此時機適合出口商品到美國
  group_stem: '(三)以下為近年土耳其相關的新聞整理，請根據內容作答第48~50 題:

    2022 年俄烏戰爭爆發，加上國內錯誤的貨幣政策，土耳其國內的通貨膨脹率升破80%，一名月領2 萬薪水的員工，兩年內漲幅達到月領7 萬元，經濟情況的惡化程度也能從貨幣匯率直接反應出來，根據世界銀行數據，近年來土耳其里拉不斷走貶，2023
    年初至7 月底，里拉兌美元匯率從18.68 貶至26.77，相當7 個月左右的時間就貶值了30.2%，根據聯合國和土耳其政府在2023 年的報告，土耳其約有700
    萬名兒童生活在貧困中，占全國兒童三分之一。僅管土耳其的貧困家庭每個月都領補助金，但通膨高漲，許多家庭根本不夠基本開銷。有些兒童甚至要到酒吧、咖啡廳販賣紙巾及鮮花等貼補家用，被稱為土耳其「失落的世代」，11
    歲兒童沙辛就是其中一員，其父親以撿拾資源回收維生，再加上政府每個月6000 里拉(約台幣5600 元)的補助金，其實還是不夠生活開銷，僅管土國財政部長表示，每個月17000
    里拉(約台幣16000 元)的基本薪資並不低，但民眾普遍認為，高通膨率侵蝕了國家可以提供的任何補助。'
