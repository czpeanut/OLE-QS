  number: 8
  type: single
  page: 1
  stem: '許多人會擔任國際志工，在出國前可先至銀行兌換準備前往服務國家的外幣。由於各家銀行給的匯率不同，在兌換前可以先查看哪家最划算。盡量不要在機場兌換，因為機場匯率通常較差。如果是在國內先換好外幣帶在身上，就要注意各家銀行現金匯率。以附圖為例，若要換美金，1
    美金要用 30.985 元新臺幣兌換。依據上文推斷，下列敘述何者正確？


