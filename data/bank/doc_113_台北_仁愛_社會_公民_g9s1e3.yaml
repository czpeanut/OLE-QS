  section: 1
  number: 10
  type: single
  page: 1
  stem: 2010 年，一位日本人做了一個「比特幣」實驗，在電腦程式中放置固定數量的比特幣，利用虛擬帳本記錄交易。目前全球有許多協助建立帳本的人，這些人被稱為「礦工」，他們的電腦稱為「礦機」，彼此間的帳本互相流通。即不管在何處使用比特幣，只要有變動，電腦會互傳資料更新帳本。消費者只需要用手機或電腦
    APP 就可以使用比特幣來支付，只是帳本更新需要時間，會有交易速度緩慢和額外支付手續費的問題，不適合小額支付。而且比特幣不是商品貨幣，本身不具有價值，其價值取決於資料處理的速度和大眾願意花多少代價購買來做為交易的工具。根據上文內容，下列敘述何者正確？
