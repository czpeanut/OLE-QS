  stem: 2020 年，政府因應新型冠狀病毒，推出振興經濟的「振興三倍券」（下列簡稱為：三倍券），可以紙本或數位方式領取，當年年末截止使用，經濟部表示三倍券目的是要刺激消費，希望民眾購物能超過三倍券上的面額，而且有不能繳水電費、健保費、繳稅、找零錢等多種限制，只不過並沒有明確寫商家是否能將三倍券當零錢找給客人，若有造假情況，可依刑法的偽造有價證券罪嫌移送法辦。有關政府的三倍券使用說明，下列何項敘述較為正確？
  options:
  - label: A
    content: 現金比三倍券更好用於結帳
  - label: B
    content: 可使用三倍券來繳納所得稅
  - label: C
    content: 三倍券具有法定貨幣的所有功能
  - label: D
