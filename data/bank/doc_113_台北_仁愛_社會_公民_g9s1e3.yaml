  number: 6
  type: single
  page: 1
  stem: 2020 年因防疫需求，有些家庭成員需要居家辦公，與家人的相處時間增加，但也導致原本在家擔任家管者的休息時間被縮短，且繼續伺候著居家辦公的配偶，而伴侶的耐心、溫和大多給了同事，使得這種「可以給工作夥伴而不能給家人」的失望被喚起。然而家管向家庭成員表達不滿時，他通常被認為是一個「歇斯底里的人」，而不是一位「正在向老闆抗爭的工人」。根據上述文章，請問下列何者描述正確？
