    content: 比特幣與黃金的貨幣屬性相同
  - label: B
    content: 比特幣的價值來自於大眾的購買意願
  - label: C
    content: 比特幣屬於虛擬交易有利於小額支付
  - label: D
    content: 比特幣是由礦區的特殊礦物製成。
