- id: doc_112_桃園_中興_國文_g9s1e1_s2_31
  section: 2
  number: 31
  type: single
  page: 5
  stem: 關於首段的說明，下列何者正確？
  options:
  - label: A
    content: 中寮光復後改為中寮鄉，隸屬彰化縣
  - label: B
    content: 中寮的北邊是商業輻湊之地，較為繁榮
  - label: C
    content: 中寮的東邊是爽文七村，較為落後
  - label: D
    content: 中寮鄉地勢有利於發展農業，故居民以務農為主
  group_stem: '中寮在清代隸屬彰化縣，日據時期稱為「中寮庄」，改隸臺中州 南投郡，直至光復後才改為中寮鄉，全鄉就有十八個村，沿著山脊星羅散布在約一萬四千公頃的山坡地上。由於丘陵阻隔，南北交通不便，居民習慣上南北分隔，北邊永平十一村，是行政商業輻輳之地，地處南邊的爽文七村，就顯得較為落後，成為山城中的「後山」。

    中寮不但地理區遼闊，地方政經關係複雜，在九二一地震中受創極深，災情可謂十分慘重。由於中寮鄉土地以砂質壤土為多，屬順向坡的老崩塌區，構成區內的主要地質材料為崩積土層，加上農業利用加速風化及下游河道彎曲侵擾坡面，導致中寮成為環境地質的災害敏感區。驗證在這次地震中，全鄉一七九二八居民中共有一七九人死亡，幾乎每一百位住民就有一位死亡，是本次震災中罹難比例最高的一個鄉鎮。根據「全國民間災後重建聯盟」的統計資料顯示，全鄉總戶數四七八0
    戶，全倒、半倒房屋合計三九六六，佔總戶數的83 ％，也是屋倒比例最高的一個鄉。面對十八個村莊無一倖免的慘狀，《中寮鄉親報》要處理的地方議題，顯然經緯萬端，相當棘手。

