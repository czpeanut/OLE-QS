- id: doc_112_桃園_中興_國文_g9s1e1_s2_29
  section: 2
  number: 29
  type: single
  page: 5
  stem: 關於本文說明，下列何者正確？
  options:
  - label: A
    content: 成績和自信心成正比
  - label: B
    content: 成績好的人能夠修正自評分數
  - label: C
    content: 成績差的人可以經由比較發現自己的不足
  - label: D
    content: 所有人都可以藉由學習調整自己能力及覺察力
  group_stem: '「達克效應」是指一個能力不足的人會產生的謎樣自信，讓他們不僅無法認知自己的不足，還會錯誤地相信自己比實際表現還要優秀。

    這個概念源自1999 年，由社會心理學家達寧和克魯格提出，他們在研究中針對受試者進行了4 項測驗，發現那些實際上分數最低的受試者會過份高估自己的得分；表現最好的學生反而會低估自己的實際分數。

    在進一步研究裡，研究者讓「低估自己的高分者」比較自己和其他人的測驗答案後，發現他們會調整自評分數好貼近實際得分；而「高估自己的低分者」卻會持續對自己的表現抱持樂觀態度。換句話說，有這麼一群人，儘管能力不足，卻沒有辦法意識到自己不夠好，反而會深深陷在「我真不賴」的思維裡，這類人一旦陷入這種想法時，就更難聽取其他人的意見或有所進步。

    克魯格指出，我們每一個人可能都在某個時候經歷過或是正處於達克效應。不論我們有吃過多少鹽、走過多少路，我們終究還是有不知道或不擅長的事物，一旦人們得到知識後，總會習慣過度放大那點知識的重要性，得到一點知識就以為得到全世界。正因為如此，達寧認為每個剛接觸到新領域的人都應該特別謹慎，他說：「接觸新事物就是人們最不容易意識到他們不知道什麼的時候。」

    改寫自網路文章'
