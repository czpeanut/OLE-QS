  type: single
  page: 6
  stem: 本文出現許多「之」字，下列選項中的「之」，何者當代詞指的是「舉子」？
  options:
  - label: A
    content: 其人見「之」，北面再拜而去
  - label: B
    content: 必更求何氏診「之」
  - label: C
    content: 非藥石「之」所能治也
  - label: D
    content: 動以危苦「之」心
  group_stem: '明末高郵，有袁體庵者，神醫也。有舉子舉於鄉，喜極發狂，笑不止，求體庵診之，驚曰：「疾不可為①矣，不以旬②數矣，子宜急歸，遲恐不及也。若道過鎮江，必更求何氏診之。」遂以一書寄何。其人至鎮江，而疾已癒，以書致何，何以書示其人，曰：「某公喜極而狂，喜則心竅開張而不可復合，非藥石之所能治也。故動以危苦之心，懼之以死，令其憂愁抑鬱，則心竅閉，至鎮江當已癒矣。」其人見之，北面再拜而去。

    【注釋】①不可為：無法醫治。

    ②旬：十天。

    ③藥石：治病的藥和砭石。'
