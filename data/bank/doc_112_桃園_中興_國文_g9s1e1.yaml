    隨著AI 自動化時代來臨，未來可能將會有部分職業被AI 取代。 AI 的進步雖然一日千里，但也有AI 不擅長的領域，例如創造力和溝通技巧。雖然AI 能夠創造音樂，但卻不能理解怎麼感動人心。在與人溝通上，AI
