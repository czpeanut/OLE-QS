- id: doc_111_高雄_林園_社會_地理_g8s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 中國倡議「一帶一路」，主要的目的為何？
  options:
  - label: A
    content: 擴大經濟貿易範圍，掌握重要資源及戰略要地
  - label: B
    content: 改善國家形象，落實慈善事業
  - label: C
    content: 促進經濟轉型，發展知識經濟
  - label: D
    content: 加速投資西進，打入美洲市場。
  group_stem: "＊以下是有關中國一帶一路政策的兩篇報導。根據報導，回答下列問題：\n\n報導一\n    全長3,000 多公里的中巴經濟走廊就像是一條紐帶，北接絲綢之路經濟帶，南連二十一世紀海上絲綢之路。在搭建起中國與巴基斯坦之間經貿往來「橋樑」的同時，中巴經濟走廊也在不斷充實中巴命運共同體的內涵。巴基斯坦總理中巴經濟走廊事務特別助理哈立德•曼蘇爾曾表示：「中巴經濟走廊建設使巴基斯坦從電力短缺國變成電力富餘國，滿足了巴國能源需求，降低了巴國電力生產的成本及整體電價。」\n\
    \n報導二\n    因斯里蘭卡深陷中國「一帶一路」債務陷阱，境內經濟大亂，食物、燃料等必需品嚴重短缺、物價飆漲、斷電等問題導致民怨四起，近日該國各地爆發抗議活動要求總統和負責官員下臺。當地居民曾說：「我不認為這是（港口城）是一個好主意，因為（感覺）這個國家就像……賣給那些人（中國）。斯里蘭卡就是斯里蘭卡。整個國家都因為這個問題而受苦。經濟現在已經癱瘓。」"
  answer:
  - A
