- id: doc_111_桃園_中興_社會_公民_g9s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '「假設在其他條件不變時，若商品價格上漲，消費者會減少購買的數量；若商品的價格下降，消費者會增加購買的數量」

    以下哪些選項符合上面的敘述？

    (甲)法國名牌推出高價位限量新款皮包，吸引貴婦團爭相購買

    (乙)美味便當店慶祝新開幕，推出限量100 個10 元便當，吸引眾多消費者排隊搶購

    (丙)小鈺和男友到宜蘭遊玩，回程買名產時，聽到老闆大聲叫賣「牛舌餅買五送一」，於是多買了一些

    (丁)阿甘是知名大提琴演奏家馬友友的死忠樂迷，只要馬友友推出新的演奏專輯，阿甘皆會前往唱片行購買CD 珍藏'
