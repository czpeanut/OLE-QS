  type: single
  page: 4
  stem: '室溫下，當一可逆化學反應已達平衡時，則下列有關此平衡狀態的敘述何者正確？

    甲、屬於動態平衡

    乙、反應物完全耗盡

    丙、正反應和逆反應並非停止

    丁、反應物和生成物濃度必相等

    戊、正反應速率等於逆反應速率

    己、濃度、溫度、催化劑都會影響化學平衡'
  options:
  - label: A
