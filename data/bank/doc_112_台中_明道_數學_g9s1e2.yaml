  section: 2
  number: 1
  type: essay
  page: 7
  stem: '有一個地區政府為了推廣觀光，設計了一個心理測驗：

    「《 輕旅行－尋找專屬你的小幸運 》，找出自己的夢幻旅行地點吧！」


    ◇ 預知你即將到訪的縣市 ◇


    | < 測驗方法 > | < 測驗結果 > | | |

    | :--- | :--- | :--- | :--- |

    | 步驟1. 在1~9中選一個數字 | 1. 基隆市 | 8. 臺中市 | 15. 高雄市 |

    | 步驟2. 這個數字 $\times 3$ | 2. 新北市 | 9. 彰化縣 | 16. 屏東縣 |

    | 步驟3. 再 +3 | 3. 臺北市 | 10. 南投縣 | 17. 宜蘭縣 |

    | 步驟4. 再 $\times 3$ | 4. 桃園市 | 11. 雲林縣 | 18. 花蓮縣 |

    | 步驟5. 將十位數字與個位數字相加<br>(例：$32\rightarrow 3+2=5$) | 5. 新竹縣 | 12. 嘉義縣 | 19. 臺東縣
    |

    | 步驟6. 得到結果，請對應右邊縣市 | 6. 新竹市 | 13. 嘉義市 | |

    | | 7. 苗栗縣 | 14. 臺南市 | |


    (1) 依照上述方法完成測驗的結果推論，請問這個心理測驗是由哪一個縣市政府推出的？(2分)

    (2) 承小題，若選取 1~9 中其他數字，答案是否都會相同？請試著說明。(2分)（原卷有誤，已修正）'
