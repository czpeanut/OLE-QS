- id: doc_112_台中_明道_數學_g9s1e2_s2_2
  section: 2
  number: 2
  type: essay
  page: 8
  stem: '閱讀下列文章，並回答以下問題

    為了迎戰貧富差距、氣候變遷、性別平權等議題，2015年，聯合國啟動「2030永續發展目標」（Sustainable Development Goals, SDGs），提出17項全球政府與企業共同邁向永續發展的核心目標。其中，目標11、目標15提出，樹是實現永續發展目標不可或缺的要素，也會讓物種減緩滅絕危機及保護土地不被破壞。


    種樹是減碳、改善地球暖化與熱島效應最簡單的方法，許多國家和城市展現企圖心推動植樹抗暖的氣候行動。提高綠覆率可增加都市生態環境，提供人類較舒適的居住環境，亦可吸收二氧化碳，進而調節都市溫度及空氣品質等。

    美國威斯康辛大學麥迪遜分校研究顯示，一座城市要有40%的樹冠覆蓋率，才能抵銷柏油路發散的高溫，即便覆蓋率只有20%也足以為城市降溫；一般認為城市綠覆率達20%以上，是維持居住健康的指標，30%以上是城市綠化政策的理想值。

    -----環境品質文教基金會《我們只有一個地球》


    ☆ 城市綠覆率是指在一個區域內，樹冠覆蓋面積占區域土地總面積的百分比。

    ☆ 城市綠覆率計算公式：城市綠覆率＝樹冠覆蓋面積 $\div$ 土地總面積 $\times 100\%$


    台中市於都市永續發展計畫中，有一塊邊長為140公尺、250公尺、250公尺的三角形土地，將打造成綠色生態環境的都市森林公園。市府為了吸引民眾出外踏青親近自然，將都市森林公園塑造成森林迷宮感官體驗區，增添園區的趣味性。


    (1) 若這塊公園達到城市綠化政策的理想值，樹冠覆蓋面積應至少為多少平方公尺？(3分)

    (2) 若在這塊三角形公園中，設計最大面積的圓形森林迷宮，則迷宮面積是多少平方公尺？(3分)'
