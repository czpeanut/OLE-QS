  stem: '「在臺灣，言論自由是受到《憲法》保障的基本人權。但是這樣的權利卻時時受到侵害，特別是某大眾不同意某小眾的觀點時，而這種情況下，也特別容易出現嚴重的霸凌。人們都有絕對的權利表達自己的看法，網友們當然也有權利可以不同意他人的任何言論，但是網友絕對沒有權利在此時搜尋他人背景並公諸於世，以此當作一種攻擊的手段，這是一種暴力，也是十分幼稚的行為。當你不同意他人論述的同時，也請還以論述，針對相關議題進行『理性而符合邏輯』的討論。」

