- id: doc_113_台北_仁愛_國文_g8s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 以下為辦公室同仁對言語能造禍發表的議論，何者運用的成語有誤？
  options:
  - label: A
    content: 小王：雖然小華是清白的，但因為流言不斷，竟被炒魷魚，真是眾口鑠金
  - label: B
    content: 小明：大家沒調查清楚就攻訐別人，這根本是捕風捉影，毫無根據。
  - label: C
    content: 小華：我準備了許多證據，提出信口雌黃的報告，讓大家信服
  - label: D
    content: 小許：同事之間應該和睦相處，別老是搬脣弄舌，挑撥是非。
- id: doc_113_台北_仁愛_國文_g8s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 飛魚一文作者藉由描寫東海岸飛魚季的景象，最主要是為了表達下列何種意涵？
  options:
  - label: A
    content: 原住民族與自然海洋緊密連結的文化生命力
  - label: B
    content: 捕飛魚的過程驚險刺激，值得旅遊體驗
  - label: C
    content: 阿美族男人捕魚技巧高超，令人敬佩
  - label: D
    content: 飛魚是臺灣漁民重要的經濟來源。
  lesson_raw:
    title: 飛魚
    basis: 題目指名「飛魚一文」
- id: doc_113_台北_仁愛_國文_g8s2e3_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 飛魚一文的寫作特色說明，下列敘述何者錯誤？
  options:
  - label: A
    content: 人物描寫融入景象：「晚霞映照出男人黑黑、粗獷、極負自信的奕奕神采。」結合環境（晚霞）與人物（阿美族男人）的描寫，展現族人在飛魚季中的精神風貌
  - label: B
    content: 具象生動的自然描寫：「船尖破浪如在耕犁海洋，飛魚從船頭四散驚起，如田地犁頭邊驚飛的蚱蜢」，使用擬人法與動態描寫，使飛魚的飛翔充滿畫面感與詩意
  - label: C
    content: 情感與文化的交織：「飛魚帶給了阿美族男人豐年祭才有的光彩」，點出飛魚季不只是漁獲豐收，更是族群尊嚴與文化認同的象徵
  - label: D
    content: 哲思與疑問式結尾：「我們又為了什麼下海遨遊？」從飛魚的飛行回扣至人的行動，提升全篇格局，增添哲理意味。
  lesson_raw:
    title: 飛魚
    basis: 題目指名「飛魚一文」
- id: doc_113_台北_仁愛_國文_g8s2e3_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 關於管好舌頭一文的寫作手法，下列何者敘述正確？
  options:
  - label: A
    content: 作者多使用自身的經驗為例，因此感動眾多讀者
  - label: B
    content: 採用正反論述舉證點出主旨，是一篇層次分明的論說文
  - label: C
    content: 文章開頭先以譬喻、誇飾的手法引出主題，末段再次強調來呼應
  - label: D
    content: 以「凡事豫則立，不豫則廢」為全文主旨，歸結出「謹慎」的重要。
  lesson_raw:
    title: 管好舌頭
    basis: 題目指名「管好舌頭一文」
- id: doc_113_台北_仁愛_國文_g8s2e3_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: 「舌尖上沾一點蜜，讓滿口都是甜的；舌尖上沾一點愛，讓口邊都是春風」，此段話的涵義與下列何者相近？
  options:
  - label: A
    content: 書是音符，談話是歌
  - label: B
    content: 巧言如簧，顏之厚矣
  - label: C
    content: 好言自口，莠言自口
  - label: D
    content: 與人善言，暖於布帛。
  lesson_raw:
    title: 管好舌頭
    basis: 引用課文原句
- id: doc_113_台北_仁愛_國文_g8s2e3_s1_15
  section: 1
  number: 15
  type: single
  page: 1
  stem: 「夕陽薄暮，東海岸阿美族男人志興致勃勃地紛紛將小膠筏推下浪頭」、「天剛破曉，早餐店就開始忙碌起來。」請問「薄暮」及「破曉」依序大概相當於古代哪一個時辰？
  options:
  - label: A
    content: 酉時／卯時
  - label: B
    content: 申時／辰時
  - label: C
    content: 戌時／寅時
  - label: D
    content: 子時／未時。
- id: doc_113_台北_仁愛_國文_g8s2e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 老師教完空城計後，請同學歸納整理要點，下列哪位同學的要點有誤？
  options:
  - label: A
    content: 小亮：文官盡皆失色的原因是雙方兵力懸殊且糧草不足
  - label: B
    content: 小飛：劇情跌宕起伏、情節緊湊，擅長景物的描寫
  - label: C
    content: 小雲：司馬懿率領大軍來到西城，卻見孔明登樓彈琴，其反應從不信→大疑→畏懼
  - label: D
    content: 小備：展現孔明處變不驚、慎謀能斷，以險計退敵的情節故事
  lesson_raw:
    title: 空城計
    basis: 題目指名「空城計」
- id: doc_113_台北_仁愛_國文_g8s2e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 根據柳毅傳書結奇緣一文，下列敘述何者正確？
  options:
  - label: A
    content: 龍王對小龍女的遭遇憤憤不平，情急之下便請錢塘君討還公道
  - label: B
    content: 錢塘君辰時從洞庭湖龍宮出發，午時在涇陽殺薄情小龍，前後花費約四小時
  - label: C
    content: 柳毅雖然嚴詞拒絕錢塘君的提親，但內心對小龍女仍留有情意
  - label: D
    content: 化身為盧氏的小龍女最後坦承自己真實的身分，是因被丈夫發現端倪。
  lesson_raw:
    title: 柳毅傳書結奇緣
    basis: 題目指名「柳毅傳書結奇緣一文」
- id: doc_113_台北_仁愛_國文_g8s2e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 柳毅傳書結奇緣一文展現了「奇幻小說」的特色，下列文句敘述何者未符合？
  options:
  - label: A
    content: 只要找到洞庭湖南岸一棵大橘樹，在樹幹上敲三下，就會有人出來接應您
  - label: B
    content: 只見一條一千多尺長的紅色巨龍，兩眼射出閃電般的光芒，掙開頸上的金鎖飛了出去
  - label: C
    content: 最近他和天將不和，又水淹五嶽。玉帝顧念我平日的功勞，特別赦免他的罪過……
  - label: D
    content: 細看妻子，覺得她貌似小龍女，便和她談起傳遞書信的往事。
  lesson_raw:
    title: 柳毅傳書結奇緣
    basis: 題目指名「柳毅傳書結奇緣一文」
- id: doc_113_台北_仁愛_國文_g8s2e3_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 有關中國小說史的演變，下列何者說明正確？
  options:
  - label: A
    content: 可上溯至夏商時期的神話與寓言，如：后羿射日
  - label: B
    content: 至魏晉南北朝發展出結構完整，篇幅短小的筆記小說，可分兩類如：志人的世說新語及志怪的搜神記
  - label: C
    content: 至唐朝時，發展為唐傳奇，篇幅較長，情節曲折、人物形象鮮明，如：志怪類聊齋志異、豪俠類虬髯客傳
  - label: D
    content: 明清時發展為章回小說，屬分章分回的長篇小說，如：並稱四大奇書：水滸傳、三國演義、西遊記、金瓶梅。
- id: doc_113_台北_仁愛_國文_g8s2e3_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 「開卷詞」也叫做「卷首詞」，是指在小說的開頭放一闋詞，用來抒發作者的心志情感。請問下列節選的開卷詞和小說的配對，何者正確？
  options:
  - label: A
    content: 姑妄言之妄聽之，豆棚瓜架雨如絲；料應厭作人間語，愛聽秋墳鬼唱詩。──聊齋志異
  - label: B
    content: 滾滾長江東逝水，浪花淘盡英雄。是非成敗轉頭空，青山依舊在，幾度夕陽紅。──水滸傳
  - label: C
    content: 紛紛五代亂離間，一旦雲開復見天！草木百年新雨露，車書萬里舊江山。──三國演義
  - label: D
    content: 滿紙荒唐言，一把辛酸淚，都云作者癡，誰解其中味？──儒林外史。
- id: doc_113_台北_仁愛_國文_g8s2e3_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 下列各選項使用的禮貌用語，何者使用最正確？
  options:
  - label: A
    content: 昀亨婉拒啟睿贈送的籃球──留步
  - label: B
    content: 品聖打掃時，建廷破好擋住他的路──慢走
  - label: C
    content: 緗瑩和羽捷分別已久，終於有機會重聚──久仰
  - label: D
    content: 悅蓁到湘琪家作客，但因事必須中途離開──失陪。
- id: doc_113_台北_仁愛_國文_g8s2e3_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 「閒則能讀書，閒則能遊名勝，閒則能交益友，閒則能著書。」這段文字的涵義最接近下列何者？
  options:
  - label: A
    content: 讀書、遊名勝、交益友、著書是人生唯一有意義的事
  - label: B
    content: 生活萬不可無所事事，一定要把時間填滿
  - label: C
    content: 人生不可得閒，閒下來就會怠惰
  - label: D
    content: 閒的意義在於能做更有意義的事。
- id: doc_113_台北_仁愛_國文_g8s2e3_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: 下列散文佳句，哪一個選項文句字形完全正確？
  options:
  - label: A
    content: 夢想不是掛在嘴邊炫耀的空氣，而是需要認真的實諫
  - label: B
    content: 要真正了解一個人，只要看他怎樣利用餘瑕時光就好了
  - label: C
    content: 說幽默的人靈光一閃，繡口一開，聽幽默的人反應也要敏捷，才能接個正著
  - label: D
    content: 當我們面對一個害怕的人，一椿恐懼的事，一份使人不安的心境時，唯一刻服這種感覺的態度，便是面對它。
- id: doc_113_台北_仁愛_國文_g8s2e3_s1_24
  section: 1
  number: 24
  type: single
  page: 2
  stem: 下列文句中三國歇後語的使用，何者錯誤？
  options:
  - label: A
    content: 這份工作雖然穩定，卻缺乏挑戰性，他每天做得興趣缺缺，卻又捨不得辭掉，如同「曹操吃雞肋」
  - label: B
    content: 他在會議上講得頭頭是道，實際做起來卻漏洞百出，簡直是「馬謖用兵」
  - label: C
    content: 這次面對突如其來的稽查，他臨危不亂、沉著應對，竟然成功化解危機，好似「孔明大擺空城計」
  - label: D
    content: 他這次向我借東西時信誓旦旦說很快歸還，結果一拖再拖，真是「劉備得孔明」。
- id: doc_113_台北_仁愛_國文_g8s2e3_s1_25
  section: 1
  number: 25
  type: single
