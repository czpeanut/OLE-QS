  group_stem: "(三)\n  我在讀高中時，班上同學最喜歡說的一句就是：「那又怎麼樣呢？」我很討厭這句話，其實，認真生活的人都很討厭這句話。比如誰說自己報了補習班，誰開始學音樂、打籃球，誰下課去問老師問題，你聽到最多的話，就是另一群人不在意地說：「那又怎麼樣呢？」一開始，也有很多同學附和：「是啊，那又怎麼樣呢？」果然，一兩天，確實沒有怎麼樣。可是，一個月後，一年後，那些「怎麼樣」還真的挺有模有樣。一個同學因為來不及把古箏背回家，只好帶來教室時，許多同學笑著。這些笑聲一直持續了兩年，說著「那又怎麼樣呢？」直到這個同學後來考上了著名的音樂學院。一個個子不高的同學，每天晚上在操場練習投籃，被更多人說著「那又怎麼樣呢？」直到人家成了學校籃球隊的主力。\n\
    \  我從小到大最討厭的句子之一，就是那句「那又怎麼樣呢？」一個人不重視小事，才會有這種想法，不認為小事可以改變人的一生。而把一個人毀掉，讓一個人迅速進入玩世不恭的狀態，不在乎一切，最簡單的方式，就是在他最年輕的生命裡，植入這個思想：「沒怎麼樣呢！」\n\
    \  我上課時經常會問大家問題，有人回答得出來，有人回答不出來。你總能發現那些人無所謂的樣子又來了：「回答不出來還是在上課，知道這個單字說不定也不能過關，不知道又不會怎麼樣⋯⋯。」\n\
    \  是啊，不知道確實不會怎麼樣。可是你是否想過，如果每個問題你都這麼對待呢？如果每個單字你都這麼輕視呢？如果每個知識點你都這麼認為呢？如果每件小事你都這麼思考呢？人十分容易忽略小事，也總不願意在小事上追求卓越，久而久之，將就慣了，想要講究也就難了。\n\
    \  在時間的長河裡，小事是容易孵化成大事的。我們的生活是由一個個日子組成，日子又是由一件件小事構成，未來由一個個今天合成，你可以不相信任何事情，但你不能不相信因果。尤其是當你決定做一件大事時，一定要記住，所有偉大的事情，都取決於一些小事，取決於你對一件小事的態度。\n\
    (改寫自李尚龍 成就你或毀掉你的，都是那些你覺得雞毛蒜皮的小事！)"
