- id: doc_113_台北_仁愛_國文_g8s2e3_s2_34
  section: 2
  number: 34
  type: single
  page: 3
  stem: 依據(甲)文，下列敘述何者正確？
  options:
  - label: A
    content: 鏡子的價格與大小有關
  - label: B
    content: 作者手中的古鏡，鏡面皆被磨平
  - label: C
    content: 若小鑑要能全觀人面，需令鏡面微凹
  - label: D
    content: 鏡面凸起來的鏡子，照出來的臉比原本大。
  group_stem: '(二)

    (甲)古人鑄鑑，鑑大則平，鑑小則凸。凡鑑窪則照人面大，凸則照人面小。小鑑不能全觀人面，故令微凸，收人面令小，則鑑雖小而能全納人面。仍復量鑑之小大，增損高下，常令人面與鑑大小相若。此工之巧智，後人不能造。比得古鑑，皆刮磨令平，此師曠所以傷知音也。

    （沈括 夢溪筆談 曲面鏡成像）

    (乙)世有透光鑑，鑑背有銘文，凡二十字，字極古，莫能讀。以鑑承日光，則背文及二十字皆透，在屋壁上了了分明。人有原其理，以謂鑄時薄處先冷，唯背文上差厚後冷，而銅縮多。文雖在背，而鑑面隱然有跡，所以於光中現。予觀之，理誠如是。然余家有三鑑，又見他家所藏，皆是一樣，文畫銘字無纖異者，形制甚古。唯此鑑光透，其他鑑雖至薄者，皆莫能透。意古人別自有術。

    （沈括 夢溪筆談 透光鑑）'
