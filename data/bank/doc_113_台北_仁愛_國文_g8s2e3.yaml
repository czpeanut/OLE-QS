  - label: B
    content: 丙丁乙甲
  - label: C
    content: 丁丙乙甲
  - label: D
    content: 丁丙甲乙。
  group_stem: "(四)\n  我翻閱茶經，想像陸羽的面貌，\n\n甲、與血肉之軀融合之後的那股甘醇？\n乙、還是在品茗之中體會茶汁緩緩沿喉而下\n丙、因為喜歡喝茶？\n\
    丁、到底什麼樣的感動讓他寫下中國第一本有系統\n地介紹茶藝的書？\n\n  飲茶需要布局，但飲後的回甘，卻又破格，多麼像人生。同一個杯、同一種茶、同一式泡法，飲在不同的喉裡，冷暖濃淡自知，完全是心證功夫。有人喝茶是在喝一套精緻而考究的手藝；有人握杯聞香，交遞清濁之氣；有人見杯即乾，不事進德修業專愛消化排泄；有人隨興，水是好水、壺是好壺、茶是好茶。茶之一字，諸子百家都可以註解。\n\
    \  我終究不似陸羽的喝法。我化成眾生的喉嚨，喝茶。\n  平日逛街，看到茶店總會溜進去，平白叫幾個生張熟魏的茶名也很過癮。烏龍茶好比高人，喝一口即能指點迷津。花茶非常精靈，可惜少了點雍容氣度。冰的檸檬紅茶有點志不同道不合，可夏日炎炎，它是個好人。白毫烏龍耐品，像溫厚而睿智的老者。加味茶裡，薄荷最是天真可愛，英國皇家紅茶，恕我直言，鍍金皇冠。\n\
    \  好茶、劣茶怎麼分呢？喝好茶、喝劣茶怎麼說呢？前人茶書中備註了，凡有惡客、大宴、為人事所迫時不宜沏茶，會糟蹋佳茗清心；這話有道理，所以袋茶是最好的逐客令，一杯水打死客人，言外之意是，茶喝完了您請回。\n\
    \  若是薄雲小雨天氣，窗外竹樹煙翠，花含苞、人優閒，案頭小燈晶瑩，此時淨手沏茶，就算粗茶配了個缺角杯，飲茶，也格外耳聰目明。\n  所謂佳茗，在我看來，即是茶、壺、人一體。\n\
    \  所以，我隨心所欲飲茶。\n(節錄自簡媜粗茶淡飯)"
