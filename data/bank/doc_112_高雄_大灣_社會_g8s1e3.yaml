- id: doc_112_高雄_大灣_社會_g8s1e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: '2021 年8 月南韓與美國進行聯合軍事演習，北韓警告南韓將有安全危機，並不斷多次試射彈道飛彈激發南北韓緊張情勢。南北韓自韓戰後分治，兩國雖然位於同一個半島上，自然環境及現今產業發展卻有許多不同之處，關於兩國的比較何者錯誤？


    | 選項 | 南韓 | 北韓 |

    | :--- | :--- | :--- |

    | (A)地形 | 平原較廣，山脈位於東側 | 山地、高原為主 |

    | (B)氣候 | 溫帶季風氣候 | 溫帶季風氣候 |

    | (C)農業 | 冬季較溫暖，年可二穫 | 冬季寒冷，年僅一穫 |

    | (D)工業 | 勞力低廉，以加工出口業為主 | 礦產豐富，重工業發達 |'
  options:
  - label: A
    content: (A)
  - label: B
    content: (B)
  - label: C
    content: (C)
  - label: D
    content: (D)
  tags:
    chapter:
      publisher: 翰林
      book: 八上
