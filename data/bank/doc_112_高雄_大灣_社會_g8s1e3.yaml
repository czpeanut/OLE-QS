- id: doc_112_高雄_大灣_社會_g8s1e3_s1_34
  section: 1
  number: 34
  type: single
  page: 4
  stem: '不管是中國或是歐美國家，女權得以提升都是近代才發生的事情。西方的女權運動是在第一次世界大戰後才開花結果，英、美等國婦女獲得選舉權（參政權）。中國的女權運動則是在西方思潮的衝擊下，於清末開枝散葉。如果想了解清末女權運動的發展史，秋瑾的傳記值得參考。下表為秋瑾的生平事蹟，請問：關於秋瑾的敘述，下列何者正確？


    | 時 間 | 事 蹟 經 歷 |

    | :--- | :--- |

    | 西元1875 年 | 出生。幼時學習歷史、詩詞，善騎射。 |

    | 西元1896 年 | 奉父母之命與富紳之子（王廷鈞）結婚。 |

    | 西元1904 年 | 不顧家庭反對，赴日留學。參與集會宣揚革命理念與男女平權。<br>創辦《白話報》，鼓吹男女平等，提倡解放纏足，痛斥清廷腐敗。 |

    | 西元1905 年 | 加入反清革命組織光復會及中國同盟會。 |

    | 西元1906 年 | 先後於紹興女學堂、潯溪女校任教。 |

    | 西元1907 年 | 創辦《中國女報》。任大通學堂董事，主持校務。<br>光復會起義失敗，被捕處斬。 |'
  options:
  - label: A
    content: 秋瑾主張以溫和改革的方式使國力提升
  - label: B
    content: 秋瑾接受新式教育，為新時代女性代表
  - label: C
    content: 秋瑾的生平顯示清末女權意識逐漸衰弱
  - label: D
    content: 秋瑾終身未能突破中國傳統婚姻的束縛 。
