- id: doc_112_高雄_大灣_社會_g8s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 韓劇「財閥家的小兒子」以收視率26.9%坐收韓國播出電視台歷史第二高紀錄，而劇中爆紅的順洋集團會長陳養喆，其原型便是三星集團的第一代掌門人李秉喆，兩人之間有許多相同之處，像是兩人的名字裡都有「喆」字，且都是慶尚道人，也喜歡蒐集瓷器等等，而劇中財閥家族內鬥、財閥與財閥間互鬥的故事也十分引人入勝，請問：電視台之所以如此關注財閥家族的興衰史，甚至將其改編為電視劇，其背後反映了南韓什麼現象？
  options:
  - label: A
    content: 政府刻意扶植大型財閥，經濟生產由少數大企業支撐，造成財富過度集中
  - label: B
    content: 娛樂影視產業蓬勃發展，「韓流文化」行銷全球，帶動周邊產品在各國熱賣
  - label: C
    content: 自然資源雖不豐富，但是從戰後的加工出口業到近年來的高科技產業，其產品已成功行銷世界各國
  - label: D
    content: 南北韓政治分裂，目前仍以北緯38°為界，長期處於緊張對峙的狀態，為朝鮮半島經濟的重大威脅。
