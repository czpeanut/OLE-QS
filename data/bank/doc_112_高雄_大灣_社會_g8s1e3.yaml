  type: single
  page: 1
  stem: '北韓90 年代曾爆發大規模饑荒，當時有大約3 百萬人不幸餓死，聯合國最新報告指出，在近年的氣候變遷，加上國際制裁的影響下，北韓糧食產量減少，進出口又受到限制，約有40%的人民沒能吃飽，而南韓則決定對北韓伸出援手。請問:
    北韓之所以會缺糧除了受到政治制度外，與何項自然因素關係最密切？'
  options:
  - label: A
    content: 地處板塊的交界帶，地震活動頻繁
  - label: B
    content: 位於西南季風背風坡，年降水量少
  - label: C
    content: 夏、秋有颱風侵襲，造成嚴重水患
  - label: D
    content: 平原少、生長季短，作物年僅一穫。
