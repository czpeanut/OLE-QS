  stem: '下表是西元 1823〜1839 年間，中國白銀出口兩數及白銀兌換的錢數。從白銀出口兩數，可以觀察到與時俱增的現象；而一兩白銀可以兌換的銅錢數，也日漸增加。請問：造成這種現象的原因為何？


