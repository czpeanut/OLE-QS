- id: doc_112_高雄_大灣_社會_g8s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: '下表為小月規畫的日本大阪4 天5 夜的行程，根據此行程表，回答下列問題：


    | 項目 | 地點 | 行程重點 |

    | :--- | :--- | :--- |

    | 第一天 | 臺灣→關西機場→梅田購物 | 梅田空中展望臺看夜景 |

    | 第二天 | 黑門市場→大阪城→天王寺→溫泉大世界 | 到市場吃海鮮、生魚片、泡至少 10 種浴場 |

    | 第三天 | 環球影城 | 使用一日券 |

    | 第四天 | 海游館→心齋橋購物 | 吃一蘭拉麵、旋轉壽司 |

    | 第五天 | 臨空城 outlet 購物→關西機場搭機返臺 | 注意時間 |


    小月行程重點中，有許多吃海鮮、生魚片、壽司的項目，這與日本漁業發達有關。請問：日本漁業發達的條件為下列何者？'
  options:
  - label: A
    content: 日本半島四面環海
  - label: B
    content: 鄰近西北太西洋漁場
  - label: C
    content: 沖積平原多、海岸線平直
  - label: D
    content: 黑潮與親潮交會。
