  stem: '請閱讀以下資料，選出正確解讀的選項：


    梁啟超：「我認為國家積弱的根本，是因為中國婦女多半不受教育，故婦女受教育與否關係到國家強弱之根本。」


    傳教士林樂知：「凡奉基督教而立國者，必興辦女學以成就女子，使女人得以各就其所能獲得適切的發展，成為有用之材，更可能勝於男人，表明女子亦為可敬可重之人。」'
  options:
  - label: A
    content: 梁啟超比較強調中國婦女應走出家庭、謀求就業
  - label: B
    content: 林樂知強調中國應以基督教立國
  - label: C
    content: 梁啟超認為中國國力積弱，導致多數婦女未受教育
  - label: D
    content: 林樂知認為中國應該廣設婦女教育機構。
