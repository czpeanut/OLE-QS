- id: doc_112_高雄_大灣_社會_g8s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 到東京都的淺草，除了跟淺草寺的雷門燈籠合照，五月的時候還有另一個選擇，就是到淺草神社參加三社祭！五月的第3 周，在淺草神社會舉行三社祭，三社祭跟臺灣的大甲媽祖遶境很像，都有民眾一起扛著神轎遊行，日本的大人小孩都熱愛參加，每年也都吸引無數外國旅客一起湊熱鬧。請問:參加三社祭的五月時節不會遇到什麼樣的情景？
  options:
  - label: A
    content: 東南沿海迎著冷冽的西北季風
  - label: B
    content: 淺草寺外賣著日本特有的傳統拉麵
  - label: C
    content: 熱鬧的慶典中不乏來自中國、南韓、台灣的遊客
  - label: D
    content: 來此的遊客大多對日本古蹟、民俗文化感到興趣。
