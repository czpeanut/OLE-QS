  section: 2
  number: 33
  type: single
  page: 4
  stem: 下列有關鄉鎮市調解制度的敘述，何者正確？
  options:
  - label: A
    content: 調解成立即與確定判決具有相同效力，如果其中一方不履行調解內容時，另一方可直接向法院聲請強制執行
  - label: B
    content: 在法官、律師組成的調解委員協調下，當事人之間互相讓步，尋求一個大家都可以接受的解決方案
  - label: C
    content: 調解成立當事人就該事件不得再提起訴訟，可有效紓解訟源及減輕司法負擔
  - label: D
    content: 唯一缺點是調解失敗後，會影響訴訟的權利。
