  page: 3
  stem: '下列兩個案例，所採用的解決糾紛方式，其特點何者正確？

    案例一

    知名連鎖壽司店遭惡搞事件層出不窮，有一名女大生到店內用餐，竟將寵物守宮放在醬料碟上拍照打卡，照片在網路上瞬間瘋傳，店家立即全面消毒並向消費者致歉，同時女大生也遭到學校懲處並向店家表達歉意，但未積極表示如何彌補損害。因此店家委託律師向法院控告女大生，並求償20
    萬元。

    案例二

    台中一名女網友貼文指出，到北屯區的一間知名咖啡門市購買「冰芝麻抹茶那堤」，沒想到在喝到最後一口時，覺得口感非常怪異，仔細一看才發現吃到一隻「肚內滿是蛆的蒼蠅」，造成網友上吐下瀉就醫。女子認為店家後續處理不夠積極，也沒提到和解條件，於是對店家提告，預計求償60
    萬元。'
  options:
