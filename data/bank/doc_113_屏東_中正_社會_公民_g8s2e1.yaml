  stem: 英國倫敦有一間奇特的「黑暗餐廳」（Dans Le Noir），這家餐廳的所有客人必須在黑暗中用餐，由盲人服務生帶領入座，客人在伸手不見五指的餐廳中吃美食，只能靠味覺、嗅覺慢慢品嚐。除了吃飯時找不著食物、打翻杯盤等插曲外，有人甚至到結賬時都不知道自己究竟吃了什麼。為了維持餐廳的漆黑感，開啟手機螢幕、使用手電筒、甚至點燃香煙，都是被禁止的，「儘管用餐如此不便，仍有許多來自世界各地的客人預約訂位，來此進行一趟美食新體驗、感官新經歷」。請問：引號中的行為符合訂立契約的何種特性？
