  stem: '潘阿諺搭乘火車時，遇到站務人員和乘客之間的糾紛事件，兩人對話如下。潘阿諺根據兩人對話做分析，下列敘述何者正確？

    站務人員：「臺鐵規定坐過站，這段路程補票除了原票價外，還要罰5 成，等於是1.5 倍票價，而從坐過站再坐回預定抵達站，要再另外購票。」

    乘客：「為何要罰我票價，我從另一個月臺返回不行嗎？我要報警！」

    站務人員：「這不合乎規定，請補完票價，本站會與您解除運送契約，請您出站。」'
