  options:
  - label: A
    content: 委託律師提起訴訟
  - label: B
    content: 當事人提出有利自己的證據
  - label: C
    content: 法官查證事實審理
  - label: D
    content: 對判決結果不服提出異議。
  group_stem: （一）知名Youtuber「超哥」駕車不慎撞到一名男大生，事後男大生提告過失傷害罪，一審超哥被判拘役10天，男大生認為判決太輕上訴，並要求民事損害賠償200
    萬美金（約台幣6400 萬）。在男大生要求賠償的200 萬美金當中，除了有醫療費、日常交通費外，他因覺得自己能當上美國大聯盟選手，認為超哥毀了他的未來，因此以「未來」當上大聯盟選手平均年薪490
    萬美金的計算方式提出賠償。超哥認為金額不合理，且事發當下有立即下車查看男大生的狀況，確認對方身體無大礙，僅有牌照歪斜，便拿出6 千元修車費賠償給對方，現要求200
    萬美金是「獅子大開口」。由於男大生所提賠償金額過大，最終地方法院駁回男大生上訴。
