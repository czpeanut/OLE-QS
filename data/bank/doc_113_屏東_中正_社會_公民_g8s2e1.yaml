- id: doc_113_屏東_中正_社會_公民_g8s2e1_s3_36
  section: 3
  number: 36
  type: single
  page: 4
  stem: 根據此篇新聞報導內容判斷，胡瓜與民視的民事糾紛起因為何？
  options:
  - label: A
    content: 民視債務不履行
  - label: B
    content: 胡瓜債務不履行
  - label: C
    content: 民視過失侵害胡瓜權利
  - label: D
    content: 胡瓜故意侵害民視權利。
  group_stem: （二）「綜藝天王」胡瓜出道40 多年，在民視主持節目長達22 年，一向穩坐民視周六、周日8 點黃金時段的他，去年初在民視未先告知也未解約的情況下，將周六時段改由其他節目接手，讓當時剛遞交新節目企畫的他錯愕不已，決定訴諸法律途徑，對民視提出民事訴訟。最終在經過七個月三次協調庭後達成和解，胡瓜說：「他們提出合理的條件，我也給了適當回應，大家拿到自己該拿到的，以後就沒什麼恩怨了！」至於拿到多少賠償金？他表示雙方簽了保密條款，無法透露。
