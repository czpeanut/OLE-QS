  group_stem: 崇德考古遺址位於立霧溪河口的河階台地，距今約 1300 年前，有人在此從事冶鐵、煉金，此處甚至是全臺第一個發現金器的考古遺址。2023
    年花蓮縣考古博物館更在村民欲建蓋房舍的土地，進行考古試掘及搶救發掘，除發現地基一角疑似為墓葬遺跡，還出土罕見玻璃環殘件、瑪瑙珠及宋朝銅錢「熙寧元寶」等文物，令考古團隊相當驚訝。
