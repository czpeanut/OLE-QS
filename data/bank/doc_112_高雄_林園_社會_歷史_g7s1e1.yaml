  section: 1
  number: 22
  type: single
  page: 1
  stem: '歷史老師請同學以長濱文化為題，進行分組討論。以下是該組四位同學的意見，何者的看法較為正確？【習作】

    甲生：「長濱文化是臺灣新石器時代的文化類型。」

    乙生：「長濱文化位於臺灣的西部，屬於南島語族文化的一部分。」

    丙生：「自長濱文化出土後，迄今臺灣的石器文化遺址都是在海邊的洞穴出土。」

    丁生：「從長濱文化遺存可知，他們以採集、漁獵為主要的維生方式。」'
