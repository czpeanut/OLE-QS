- id: doc_113_台南_復興_國文_g7s1e2_s7_5
  section: 7
  number: 5
  type: single
  page: 6
  stem: '上文開頭採「一句話即一段」的寫法，通常這句話會以點到為止的方式預告下文內容。如果有讀者做了以下預想，何者無法於下文讀到？

    [在高雄，有一座澳洲想複製的城市礦山。]

    (A)下文會指出位在高雄什麼地點  (B)下文會提到澳洲有什麼作為  (C)下文會揭曉何種礦山竟位於城市  (D)下文會說明什麼具高度開發價值'
  options:
  - label: A
    content: 下文會指出位在高雄什麼地點
  - label: B
    content: 下文會提到澳洲有什麼作為
  - label: C
    content: 下文會揭曉何種礦山竟位於城市
  - label: D
    content: 下文會說明什麼具高度開發價值
  group_stem: "(三)\n    在高雄，有一座澳洲想複製的城市礦山。\n    臺灣約有 280 家廢車回收廠，但僅有 4 家處理廠，銘福是最大的一家。這裡不是車輛墳場，而是價值再創之地。一輛報廢車進來，平均十分鐘就能完全拆解，其中九成能回收再利用，僅一成是塑料垃圾。「我們計劃在臺南蓋汽電共生廠，最後一成廢料燃燒後，也可以『廢轉能』。」\n\
    \    1970 年代，因工業建設與拆船盛行，銘福創辦人陳福松做起廢五金回收生意。拆船業沒落後，廢棄車輛與家電取而代之。一輛廢車，拆下回收價值高的輪胎、引擎、電瓶後，重頭戲在車身。銘福自德國引進全臺第一條粉碎機產線，將報廢車體撞擊粉碎成粒，再以重量或磁性等物理特質，篩選出有價金屬，堪稱臺灣廢車回收先驅。\n\
    \    電動車促使鋰電池需求急升，但鎳、鈷等鋰電池關鍵原料開採不易，價格不斷飆漲。「目前看來，『城市採礦』是可行的解方。」銘福已預見臺灣 2025 年的電動車電池退役潮，正積極開發鋰電池回收煉金術。對於廢棄太陽能板將造成環境浩劫，銘福也請專家移轉回收技術。目前澳洲政府已核發銘福回收處理執照，歡迎銘福前往設廠。(改寫自林鳳琪〈銘福把廢車墳場變成貴金屬重生寶地〉)"
