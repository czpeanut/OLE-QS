- id: doc_113_台南_復興_國文_g7s1e2_s4_2
  section: 4
  number: 2
  type: fill
  page: 1
  stem: "古伊卡哇閱讀作家王溢嘉《論語不一樣》後，嘗試切分段落，畫出下列結構圖。請根據文章脈絡，填上引用自《論語》的適當原文。2%\n    言為心聲，他人通常會以我們說的話來判斷我們是什麼樣的人；但更重要的是，我們要以我們說的話來告訴別人我們是怎樣的一個人。如果你不想讓別人誤解你，那你就不言不由衷、裝腔作勢、自欺欺人；如果你想讓別人知道你是個表裡如一、言行一致的人，那你必須「言忠信，行篤敬」，絕對不能說大話、假話和空話，因為「其言之不怍，則為之也難」說話如果大言不慚，那麼要將他們付諸實現就會格外困難。而且「君子恥其言而過其行」，如果你想當君子，最好是「先行其言，而後從之」。\n\
    請填寫結構圖中的 (1)、(2)、(3)：\n主旨：說話的準則\n├─ 說話要真誠：不可言不由衷、裝腔作勢、自欺欺人 ─ 正向敘述：言忠信，行篤敬\n│ \
    \                                               └─ 反向敘述：(1)\n└─ 言行要一致 ┬─ 不能說大話、假話和空話\
    \ ─ 反向敘述：(2)\n                └─ 行於言之前 ┬─ 先做好再說 ─ 正向敘述：(3)\n                 \
    \             └─ 反向敘述：君子恥其言而過其行"
