    content: 事父母幾諫，見志不從，又敬不違，勞而不怨
  - label: B
    content: 色難！有事，弟子服其勞；有酒食，先生饌。曾是以為孝乎
  - label: C
    content: 父母在，不遠遊，遊必有方
  - label: D
    content: 曾子臨終，召門弟子曰：「啟予足！啟予手！《詩》云：『戰戰兢兢，如臨深淵，如履薄冰。』而今而後，吾知免夫，小子！」
