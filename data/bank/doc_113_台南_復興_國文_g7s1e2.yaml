  type: single
  page: 3
  stem: '在林百貨的頂樓看台南，並不因為它是盡收整座城市的至高之處，而是為了沒有那一道具隔音玻璃帷幕的阻隔與屏蔽，讓人感覺不只置身於一棟樂音輕柔的建築物裡，而是和整座城市，在一起。在這裡，我們可以任底下市街上川流的那些喧囂鳴響毫無節制地刮擦過我們的耳膜，可以感受到貼著皮膚吹過的南國燥熱的風，如果是夜晚，我們眼底的感光系統甚至可能在廣大的夜幕罩下搜尋到一輪明月，發動一下想像的引擎，那明月便彷彿伸手可掬了。(聯合文學〈文學台灣·台南篇5〉許正平)

    關於這段文字的寫作手法，下列敘述何者正確？'
