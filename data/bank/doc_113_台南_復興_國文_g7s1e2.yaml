- id: doc_113_台南_復興_國文_g7s1e2_s7_1
  section: 7
  number: 1
  type: single
  page: 5
  stem: 根據甲文，孔子想藉行軍之道戒勉子路什麼道理？
  options:
  - label: A
    content: 攻心為上，攻城為下
  - label: B
    content: 臨敵只可智取，不可力敵
  - label: C
    content: 鞠躬盡瘁，死而無悔
  - label: D
    content: 莫負才使氣，逞血氣之勇
  group_stem: "(一)\n甲  子謂顏淵曰：「用之則行，舍之則藏①，唯我與爾有是夫②！」子路曰：「子行三軍，則誰與③？」子曰：「暴虎④馮河⑤，死而無悔者，吾不與也。必也臨事而懼，好謀而成者也。」(《論語·述而》)\n\
    【注釋】①舍之則藏：舍，捨棄。藏，隱匿  ②夫：語氣詞，相當於「吧」③與：在一起\n        ④暴虎：空拳赤手與老虎搏鬥        ⑤馮河：無船而徒步過河\n\
    乙  孔子為這個弟子與眾不同的難馴感到驚訝。單是好勇厭柔，不少人也是如此，但像子路一樣輕蔑事物形式的人卻很罕見。「禮」雖然最終歸結於精神，卻必須從形式進入。「禮云禮云，玉帛云乎哉？樂云樂云，鐘鼓云乎哉？」當孔子這麼講時，他非常樂意傾聽，但一說明禮樂細則，他立刻顯得一臉無趣。一邊要與這種逃避形式主義的本能搏鬥，一邊又要傳授他禮樂，即使對孔子來說，也是困難重重。(改寫自中島敦〈弟子〉)"
