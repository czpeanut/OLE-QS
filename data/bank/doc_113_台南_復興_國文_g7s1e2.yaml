  stem: 若要依據 PDCA 理論來達成自己的目標，下列何者的做法最為適當？
  options:
  - label: A
    content: 小玉想提升段考成績，直接擬定目標分數，按照習慣的步調，該休息就好好休閒放鬆
  - label: B
    content: 花輪希望在運動會跑進決賽，制定計畫後每天執行，按週檢視體能狀況調整訓練內容
  - label: C
    content: 美環負責規劃園遊會，工作分配後同學提出困難，為了達成原定目標，堅持既定原則
  - label: D
    content: 丸尾和同學分組討論，為了有效提升效率，直接繞過檢核順序，請同學提出報告成果
