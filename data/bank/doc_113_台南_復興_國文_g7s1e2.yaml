- id: doc_113_台南_復興_國文_g7s1e2_s7_8
  section: 7
  number: 8
  type: single
  page: 7
  stem: 根據以上三段資料，以下敘述何者正確？
  options:
  - label: A
    content: 面對挫折，馬可·奧理略的理念與史蒂芬·柯維的中心思想大相逕庭
  - label: B
    content: 史蒂芬·柯維認為積極主動的人致力擴大「關注圈」內不可控的事物
  - label: C
    content: 依乙、丙文推論，要投注心力在「影響圈」，從外在環境找失敗原因
  - label: D
    content: 依甲、丙文推論，能用「可控制」與「不可控制」檢視目標是否可行
  group_stem: '(四)閱讀下文，回答 8～10 題

    甲  深受古希臘 斯多噶學派影響的古羅馬皇帝馬可·奧理略，在他的《沉思錄》一書中認為「你能夠掌握的就是你能控制的」，所以當面臨挫折時，可用「你能控制的」與「你不能控制的」二分法來分析問題：一邊寫下你能控制的事情，例如：願意付出的努力；另一邊寫下你不能控制的事情，例如：外在的升學制度。接著專心處理你能控制的事情，就算後來事與願違，也比較能坦然接受。

    乙  史蒂芬·柯維在《與成功有約》提出「關注圈」與「影響圈」的主張。「關注圈」是指你關心的範圍，例如：社會趨勢、學校制度，通常個人無力改變；「影響圈」是指在「關注圈」內你可以控制的事，例如：待人接物的原則、用功讀書的程度。消極被動的人習慣留意「關注圈」，將個人的失敗推給外在環境，為自己尋找失敗的藉口；積極主動的人則投注心力在「影響圈」，努力擴大自己「影響圈」的範圍，也試圖縮小「關注圈」內過去無能為力的事物。

    丙  PDCA（Plan-Do-Check-Act 的簡稱）循環式品質管理，指的是針對工作品質按規劃、執行、查核與行動來進行活動，以確保目標能達成，並進而促使品質持續改善。

    [圖說明: PDCA循環圖，P計畫、D執行、C查核、A行動]'
