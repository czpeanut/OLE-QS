  stem: 小新在科普閱讀時讀到了法國物理學家查爾斯·庫侖於1785 年發現的物理學定律-庫侖定律（Coulomb's law）。他想運用此定律，將兩靜止電荷之間原本大小為
    F 的靜電力，變為大小為 3F 的靜電力，請問他會採用下列哪個方法？（不考慮萬有引力）
  options:
  - label: A
    content: 兩電荷之電量及距離都變為 3 倍
  - label: B
    content: 兩電荷之電量都變為 3 倍，但距離不變
  - label: C
    content: 兩電荷之電量及質量都不變，但距離變為 3 倍
  - label: D
    content: 其中一電荷之電量變成 3 倍，但距離不變。
