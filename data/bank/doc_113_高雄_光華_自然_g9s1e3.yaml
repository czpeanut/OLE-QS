  section: 1
  number: 31
  type: single
  page: 4
  stem: 太陽系就像是個以太陽為中心的城市。地球住在蛋黃區、相當靠近市中心。最遠的行星是海王星。在海王星外還有很多各式各樣的小天體，稱作海王星外天體，大多分布在古柏帶。人們熟知的冥王星就是其中一顆。有關太陽系的敘述，下列何者正確？
  options:
