- id: doc_113_高雄_光華_自然_g9s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 西元1993 年，三個天文學者在宇宙中觀察到舒梅克-李維彗星(Shoemaker-Levy 9)在木星外圍繞木星公轉，其彗核被木星的重力撕裂成21
    個碎塊，最後這21 個碎塊在1994 年七月十六日開始陸陸續續撞向木星的南半球，也讓所有人欣賞到一千年才發生一次的「彗星撞木星」奇觀。科學家希望在這次的撞擊之中，能夠探測到木星表面的物質，試問木星的主要組成與下列何者不同
    ?
  options:
  - label: A
    content: 土星
  - label: B
    content: 天王星
  - label: C
    content: 海王星
  - label: D
    content: 金星。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 理化
      code: 2-4
      title: 圓周運動與萬有引力
      chapter: 第2章 力與運動
    textbook: 九上理化 2-4 圓周運動與萬有引力
    labeled_by: ai
- id: doc_113_高雄_光華_自然_g9s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 若將一個帶電的塑膠尺靠近一個不帶電的金屬時，會使得金屬內的正、負電荷分離，此種物體內的電荷因受外界電荷的影響而重新分布的現象稱為靜電感應，這個現象是由英國科學家約翰·坎通和瑞典科學家約翰·卡爾·維爾克分別在1753
    年和1762 年發現。請問其主要的原因為何？
  options:
  - label: A
    content: 靜電會移動
  - label: B
    content: 導體內的某些電子可以自由移動
  - label: C
    content: 帶電體的電量會減少
  - label: D
    content: 電子可從一物體移轉到另一個物體上。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 理化
      code: 4-1
      title: 電荷與靜電現象
      chapter: 第4章 電流、電壓與歐姆定律
    textbook: 九上理化 4-1 電荷與靜電現象
    labeled_by: ai
