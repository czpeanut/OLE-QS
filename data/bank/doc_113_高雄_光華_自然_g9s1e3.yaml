    e＝$1.6\times 10^{-19}$庫侖。羅伯特·密立坎因而獲得1923 年的諾貝爾物理學獎。風間重複該實驗，有甲、乙、丙、丁四個帶電的小油滴，今分別測量油滴上所帶的電量，在下列測量結果中，何者最可能是錯誤的？
