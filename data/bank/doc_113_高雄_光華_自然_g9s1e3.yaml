- id: doc_113_高雄_光華_自然_g9s1e3_s1_38
  section: 1
  number: 38
  type: single
  page: 5
  stem: '(甲)伏特（Alessandro Volta）；(乙)庫侖（Charles Auguste de Coulomb）；(丙)安培（Andre-Marie
    Ampere）；(丁)歐姆（Georg Simon Ohm）；(戊)愛因斯坦（Albert Einstein），五位科學家在科學方面都擁有顯著的成就與貢獻，且影響後世的發展甚鉅。有兩則科學的重大貢獻的內容分別如下：

    第一則：「兩帶電小球的靜電力與各自所攜帶的電量乘積成正比，與彼此間距離的平方成反比。」

    第二則：「同一金屬導線，在溫度一定的情況下，導線兩端電壓與導線上電流的比值為一定值。」

    請依序表示提出的科學家為何？'
  options:
  - label: A
    content: (甲)(丙)
  - label: B
    content: (乙)(丁)
  - label: C
    content: (丙)(戊)
  - label: D
    content: (甲)(戊)。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 理化
      code: 4-4
      title: 歐姆定律與電阻
      chapter: 第4章 電流、電壓與歐姆定律
    textbook: 九上理化 4-4 歐姆定律與電阻
    labeled_by: ai
