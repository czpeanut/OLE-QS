  group_stem: (三)國內房價飛漲，居住問題一直是政府推動國家建設時關注的重點。依照《住宅法》規定，主管機關及民間興辦之社會住宅，應提供至少40%以上比率出租給經濟或社會的弱勢者。在政府經費的支持下，與周遭房價相比，社會住宅的租金較為便宜，讓經濟能力低於標準的民眾也租得起，當申請人數多時，所有的人以<u>公開抽籤</u>方式決定入住者。從以前興建國宅出售到現在的社會住宅政策，都是希望達成民眾可以居住在適合的住宅，而且享有尊嚴的居住環境。請問：
