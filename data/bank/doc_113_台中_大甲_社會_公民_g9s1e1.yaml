  stem: '最帥氣服飾店想利用平常日中的一天舉辦廣告活動帶動買氣。在不考慮其他因素的情況下，假設來客數愈多，廣告活動宣傳的效果會愈好，依附表店內統計的平均來客數判斷，身為店長所做的考量，下列何者正確？

