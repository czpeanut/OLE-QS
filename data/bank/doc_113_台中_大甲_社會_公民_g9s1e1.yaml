  section: 1
  number: 12
  type: single
  page: 2
  stem: 由於中國政府抵制澳洲龍蝦進口，原本大量長期銷往中國的澳洲龍蝦，面臨市場需求的巨大改變，龍蝦價格因此暴跌三成，漁民也開始煩惱該如何應變。依靠捕龍蝦維生的漁民收入大為減少，面對漁民的困境，澳洲政府並未置身事外，除了減免漁業相關費用外，也協助開拓其他國家的銷售管道，希望漁民未來不需依賴中國的單一市場。漁民們努力的開始思考，現階段能採取的應對策略，以提高利潤、維持生存。請問：漁民若為提高利潤以維持生存，下列哪一項建議較有助益？
  options:
  - label: A
    content: 減少燃料費支出，與其他漁民合作輪流開船出海
  - label: B
    content: 購買新漁船，投資大型捕撈設備，增進捕撈技術
  - label: C
    content: 向政府申請擴大航行範圍，至較遠海域進行捕撈
  - label: D
    content: 大量招募新進漁工，累積人力資源以備不時之需。
