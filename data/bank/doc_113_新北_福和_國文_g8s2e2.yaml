- id: doc_113_新北_福和_國文_g8s2e2_s4_33
  section: 4
  number: 33
  type: single
  page: 6
  stem: 根據文中的圖與本文觀點，若要打破這樣的負面思考迴圈，下列哪個做法最能幫助大腦建立新的神經迴路？
  options:
  - label: A
    content: 找知心好友傾訴，讓對方認同自己的感受，並一起分析事情的來龍去脈
  - label: B
    content: 藉由一次次不斷接觸失敗經驗，來降低對失敗的恐懼感
  - label: C
    content: 出現負面想法，停下來自我覺察：「這是自我否定的想法，我正在感到挫折」
  - label: D
    content: 轉移注意力去做其他事情，讓大腦暫時忘記這些想法，等心情平復再處理
  group_stem: "五、\n    我們都會為自己塑造一個特定的故事，並不斷在心中重複。有時，這故事來自家人、朋友或老師的評價；有時則來源於我們對自己能力的懷疑或自我否定。不論來源如何，許多人每天都讓這樣的想法主導自己的生活。我們潛意識裡不斷強化這些想法，像是在腦海裡自言自語：「我就是不夠好。」事實上，大腦無法區分對與錯，只會加強你反覆思考的模式。\n\
    \    雖然大腦本來喜歡注意負面資訊，但研究顯示，大腦是有可塑性的，大腦可以形成新的突觸和調整既有的突觸來重組自己。你可以把大腦的健康想成硬體，心理的健康則像軟體。在升級軟體之前，硬體必須正常執行。一旦你學會瞭如何改變大腦的基礎知識，就能養成新的習慣，改變心態，進而改善不想要的行為，創造最好的自我版本。\n\
    神經可塑性是如何運作的呢？\n    神經可塑性指的是大腦根據經歷進行改變和適應的能力。隨著訊息的重複，神經元之間的連結會變得更強。所以當你不斷想著「我不夠好」時，這種想法會在大腦中加深，變得像背景音樂一樣不斷重複。\n\
    \    反芻思考過去的負面事件，會強化負面思考與擔憂的神經路徑。這些重複的想法，可能會對你的心理和情緒健康造成傷害，因為它們會增加壓力，阻礙我們解決問題的能力，擾亂睡眠並影響我們的身體健康。它們還會導致社交退縮，從而進一步加劇負面情緒。不過，我們是有能力改變這種負面的思考模式的。\n\
    如何管理負面情緒\n    首先，學會辨認自己的情緒，準確地為它們命名，可以幫助我們更清楚地瞭解自己的真實感受。研究發現，即使只是說出情緒的名字，也能讓我們感到對情緒有了控制，從而更好地處理它們。這是因為命名情緒需要動用大腦負責邏輯思考的部位，當情感高漲時，這部分通常會受到抑制。\n\
    \    擁有情緒覺察力非常重要，它可以幫助我們跳脫心中不斷重演的負面故事。當我們理解自己的情緒後，就能更好地處理那些基於情緒的消極想法。我們會意識到，自己對自己說的話不一定是事實，很多時候只是因為當下的情緒影響了我們的思考。\n\
    （節選並改寫自妮可．維諾拉《Rewire-神經可塑性》)"
