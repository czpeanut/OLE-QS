  group_stem: "四、\n    白民國，有乘黃①，狀如狐，背上有角，乘之壽三千歲。\n    君子國，人衣冠帶劍，使兩文虎。民衣野絲，好禮讓，不爭。土方千里，多薰華之草。民多疾②風氣，故人不番息③，好讓，故為君子國。\n\
    \    驩兜國，其民盡似仙人。帝堯司徒④。驩兜民常捕海島中，人面鳥喙。去南國萬六千里，畫似仙人也。\n    孟舒國民，人首鳥身。其先主為虞氏，馴百禽。夏后之世，始食卵，孟舒去之，鳳凰隨焉。\n\
    \    大人國，其人孕三十六年生，白頭，其兒則長大⑤，能乘雲而不能走，蓋龍類。去會稽四萬六千里。（選自《博物志》）\n\n註：①乘黃：傳說中的奇獸名。②疾：怕。\n\
    ③番息：繁殖增多。④司徒：官名，掌管土地和人民。\n⑤長大：身材高大。"
