- id: doc_113_新北_福和_國文_g8s2e2_s3_7
  section: 3
  number: 7
  type: single
  page: 1
  stem: 「你如愛花，這裡多的是錦繡似的草原。你如愛鳥，這裡多的是巧囀的鳴禽。你如愛兒童，這鄉間到處是可親的稚子。你如愛人情，這裡多的是不嫌遠客的鄉人，你到處可以掛單借宿，有酪漿與嫩薯供你飽餐，有奪目的鮮果恣你嘗新。」關於這段文字，下列敘述何者正確?
  options:
  - label: A
    content: 顯示作者不願獨享這些美好經驗，只想要與好友一人分享
  - label: B
    content: 文字中可以感受到作者敦親睦鄰，選擇鄉里仁厚之處居住
  - label: C
