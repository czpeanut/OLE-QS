- id: doc_113_新北_福和_國文_g8s2e2_s4_24
  section: 4
  number: 24
  type: single
  page: 4
  stem: 本文的「主旨」與下列何者最接近？
  options:
  - label: A
    content: 說明在處理權力不對等時，應適時妥協以換取自己所要的結果
  - label: B
    content: 探討成功說服的關鍵在於：立場轉換以及引導對方重新理解利害關係
  - label: C
    content: 強調合法執法比盲目服從上位者的命令更有利於社會
  - label: D
    content: 闡述張釋之處理政治衝突的智慧可作為現代談判典範
  group_stem: "二、\n    在當今這個人際關係複雜、互動頻繁的社會中，表達、溝通、說服和談判的能力變得非常重要。我們可以從這個角度來思考〈張釋之執法〉一文。\n\
    \    故事裡發生了一件讓皇帝非常震驚的事情，廷尉根據法律開出了罰金的判決。但這時，皇帝又高高在上，對於裁決感到非常不滿，甚至還很生氣。如果這種情況處理不當，廷尉和罪犯都可能會有大麻煩。在這樣危險的時刻，能冷靜地表達已經不容易，還要說服比自己權力大得多的人，這裡面的「說服」技巧值得我們學習。\n\
    \    馬東在《好好說話》一書中提到，說話其實是一種「權力的遊戲」，這裡的「權力」指的是在說話時所面對的關係。書中指出，說話是給別人聽的，說者和聽者之間會形成某種關係，在這種關係中，會出現誰主動、誰被動，誰需要爭取誰的問題。說服的重點在於「改變」，也就是讓對方接受我們的觀點，按照我們的想法來思考問題。書中談到「說服」是屬於「權力在對方」的溝通：\n\
    \    說服偏重「改變」，也就是將我們的觀點和立場直入對方心中，讓對方按照我們的預設來想問題，並且得出我們想要的結論。……說服的要義，是時刻提醒「權力在對方」……說服不是說教、不是洗腦，不是靠機械地強化暴力灌輸，而是以勸導方式讓對方自行生長出我們所要的論點……所有的說服都有一個基本的道理――不要一直強調我需要什麼，而是要想辦法找出對方需要什麼。」（以上見馬東《好好說話：粉絲破千萬！最強說話團隊教你新鮮有趣的話術精進技巧》）\n\
    \    在說服的過程中，首先要考慮對象是誰。例如，張釋之要說服的人是擁有生殺大權的皇帝，而且當時皇帝的情緒非常激動。他在說話時能保持分寸，讓皇帝知道他有權力做出決定，而自己只是在提供建議。他對皇帝說：「且方其時，上使立誅之則已」（幫廷尉O.S.一下：皇上啊！您絕對有權可以在事發當下殺了他，何必交給我審判，然後又要不滿而生氣？）整個說服過程，張釋之謹守君臣的分際，時刻提醒著「權力在對方」，自己僅提供可能性的參考作法，將最終的決定權交給皇帝。\n\
    \    接著看張釋之如何「想辦法找出對方需要什麼」：「今法如此而更重之，是法不信於民也……今既下廷尉，廷尉，天下之平也，一傾而天下用法皆為輕重，民安所措其手足？」這裡，張釋之用皇帝的視角來分析問題，對於一個賢君來說，天下治亂、百姓的信任度是其關心重點，他指出，如果法律不被百姓信任，那麼治理國家就會有困難，這樣的說法對皇帝來說非常重要，果然讓說服的效果增強。\n\
    \    這個說服成功的背後，其實是張釋之掌握了當時的局勢。秦朝的統治時間十分短暫，且在歷史上留下了「刑罰太苛，造成民怨」的印象，這是當時許多政治家熱議的話題。張釋之掌握此種時代氛圍，說服時切中要害，這是掌握時局讓「說服」奏效的關鍵之一。(節錄、改寫自〈法律之前，人人平等？透過國中課文〈張釋之執法〉學習換框思考的說服之道〉，《關鍵評論網》)"
