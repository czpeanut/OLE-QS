- id: doc_113_新北_福和_國文_g8s2e2_s3_14
  section: 3
  number: 14
  type: single
  page: 2
  stem: "根據下文，作者認為將食材製做成罐頭有什麼好處？\n\n    罐頭食物相當方便，不僅保存容易，也可以製成各種口味，鹹淡皆宜，隨時可食。相較之下，時下盛行的冷凍食品固然方便，卻受到電源及設備限制，野外活動時就沒有如此便利。罐頭問世約兩百多年，時間不長，卻足以改變人類的生產行為與飲食習慣。原本因保鮮問題無法大量出口的食材，一旦製成罐頭，便可飄洋過海，行銷世界。罐頭價格便宜，尤其受無產階級群眾的歡迎。當年在德國念書時，經常拿東歐牛肉罐頭，擱點五香、八角一燉，便是一鍋牛肉湯，麵條白菜同入，一頓飯就有著落，稱得上物美價廉。\
    \                                                            〈罐頭由來〉"
  options:
  - label: A
