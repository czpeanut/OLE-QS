- id: doc_113_新北_福和_國文_g8s2e2_s4_27
  section: 4
  number: 27
  type: single
  page: 5
  stem: 小瑞這週遇到許多煩心事：功課壓力大、與朋友冷戰、還被導師點名批評。他回家後上網查資料，發現自己最近總是心悸、注意力不集中、睡不好。他懷疑自己的「壓力荷爾蒙」可能出現問題，想進一步了解。根據你對皮質醇的了解，下列何者最能正確反映文章中的資訊，協助小瑞判斷身體狀況？
  options:
  - label: A
    content: 皮質醇分泌愈多，愈能幫助大腦提升思考與睡眠品質
  - label: B
    content: 想像中的壓力無害，不會對大腦造成與現實壓力相同的影響
  - label: C
    content: 當皮質醇持續過量時，可能出現注意力變差與睡眠障礙
  - label: D
    content: 皮質醇會導致短暫興奮感，但不會對身體產生實質傷害
  group_stem: "三、\n    「皮質醇」是壓力荷爾蒙，主要在警覺或受到威脅的時刻分泌。它的用處在於幫助我們透過「戰鬥或逃跑」機制來應對挑戰和威脅。\n\
    \    皮質醇分泌時會在身體中產生各種物理變化，為行動做好準備，這些表現有大家熟知的心跳過速、呼吸急促、出汗或顫抖。恐懼或威脅情況導致皮質醇飆升的其他跡象為:消化問題﹙便祕或腹瀉﹚、精神障礙、口乾或窒息感。\n\
    \    如果有人在街上追你、你面臨火災威脅等緊急狀況，皮質醇及其在身體中產生的變化就會很明顯地存在。除了這些顯而易見的情況之外，在久坐不動和無聊的現實生活中，某些時刻也會啟動人體的警覺狀態，例如:每天早上見到你不好相處的同事、跟你的伴侶關係不好時、擔心孩子時，或者出現一個讓你心煩意亂的健康問題等等。\n\
    \    然而頭腦和身體無法區分真正的威脅和想像中的威脅。面對生活中發生的物理事件或面對僅存於腦中的假設時，人會以非常相似的方式做出反應。\n    問題是，皮質醇雖然幫助我們對抗壓力，但如果一直太高，就會變成「皮質醇中毒」，造成身心健康的問題。皮質醇過多會讓大腦發炎，影響情緒，有時候甚至可能引發憂鬱症。有些研究指出，憂鬱症可能和大腦的慢性發炎有關。\n\
    \    現今的生活四處都是「發炎」的人，皮質醇中毒還可能造成：掉頭髮、胃痛、皮膚變差（如長痘痘、紅疹），甚至會讓記憶力變差、睡不好、容易緊張。如果長期處在這種壓力狀態，就會讓人變得很疲倦，甚至無法集中精神。皮質醇中毒也會帶來認知的改變，從注意力不集中到專注力或記憶力的問題。記憶區域海馬迴對皮質醇的增加很敏感，這就是為什麼在最痛苦的時刻，我們會發現記憶在捉弄我們。\n\
    \    童年經歷對皮質醇也有影響。如果小時候曾經遭受虐待、被霸凌，或常生活在緊張的家庭裡，長大後更容易出現情緒障礙或免疫系統的問題。\n    不過，我們不是毫無選擇的「情緒奴隸」！雖然身體的反應有時無法控制，但我們擁有兩個重要的能力：意志力和智慧。透過正確的情緒管理和思考方式，我們可以學會與壓力和平共處，不讓荷爾蒙控制我們的人生。\n\
    (改寫自《找到你的維他命人：人際關係中的痛苦、困惑、空虛，你不必自己承受》)"
