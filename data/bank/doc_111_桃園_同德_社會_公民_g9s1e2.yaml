- id: doc_111_桃園_同德_社會_公民_g9s1e2_s1_52
  section: 1
  number: 52
  type: single
  page: 2
  stem: 依據上文第一段敘述判斷，我國便利超商的市場競爭程度，下列何者錯誤？
  options:
  - label: A
    content: 廠商加入門檻高，導致缺乏競爭。
  - label: B
    content: 商品售價是由看不見的手決定。
  - label: C
    content: 參與廠商數量多，入門門檻較低。
  - label: D
    content: 善於利用各種行銷策略，使用價格、非價格競爭。
  group_stem: "在臺灣便利超商因為 24 小時的特性，加上販售商品可以說是相當齊全，因此超商購物已成為民眾生活的日常，更別說臺灣的超商密度更是全球第二，僅輸給南韓、高於日本。近日，就有網友貼出自己經過住家附近一個路口時，發現同個路口竟然有三間不同的超商，貼文掀起廣大迴響，有網友說表示，「三個願望一次滿足」、「買咖啡去全家，買熟食去\
    \ 7-11，領貨去萊爾富，完全滿足日常所需.....很幸福」。\n  而過去曾有統一、全家、萊爾富與 OK 等四大超商業者，宣稱鮮奶的成本價格，已超出負荷範圍，因此針對含奶類的咖啡系列飲品，每杯調漲\
    \ 5 元，平均漲幅約 10%。為了釐清相關事項，(甲)立案展開調查。結果發現，四大超商都未能具體說明調漲 5 元的合理事由，明顯違反(乙)的規定，涉及聯合調漲行為。因此決議裁罰四大超商，合計高達\
    \ 2,000 萬。"
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 公民
      code: 3-2
      title: 市場競爭方式與程度
      chapter: 第3章 市場與競爭
