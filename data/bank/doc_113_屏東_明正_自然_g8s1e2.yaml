  group_stem: '8. 如圖(二十四)，請在閱讀下列敘述後，回答下列問題：

    在太陽下走路，腳邊一定會有黑色的影子跟著，隨著太陽的方位不同，影子的方位、大小、甚至形狀也跟著不同。影子一定是黑色的嗎？看看圖片中的彩色影子，這是怎麼做出來的？

    我們已經學過，直線前進的光無法到達的地方，就是影子所在。觀察一下圖中彩色影子的顏色，對照三原色光的混合，可以想到正是不同色光一起造成了鮮豔的影子。

    根據所學過光與顏色的相關概念，推想一下如何用三原色光製造出這奇妙的彩影效果。'
