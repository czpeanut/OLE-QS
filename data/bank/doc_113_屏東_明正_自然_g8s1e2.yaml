- id: doc_113_屏東_明正_自然_g8s1e2_s2_22
  section: 2
  number: 22
  type: single
  page: 5
  stem: (1) 古代人潛望四周景象，需要用到水盆，判斷應該可用下列哪一物品取代水盆，仍可達到相同的效果？
  options:
  - label: A
    content: 透明的冰塊
  - label: B
    content: 平整光滑的紙張
  - label: C
    content: 光滑的金屬大碗
  - label: D
    content: 另一面大鏡。
  group_stem: '7. 如圖(二十三)，請在閱讀下列敘述後，回答下列問題：

    光束遇到平面鏡會發生反射現象，傳播方向發生改變，因此平面鏡除了可用來成像，讓人修整儀容外，還可以用來改變光路徑。

    約在公元前 2 世紀，中國古代的人就製成了世界上最早的潛望鏡。漢代初年成書的《淮南萬畢術》記述：「取大鏡高懸，置水盆於下，則見四鄰矣。」裝置如圖中所示，也就是將大面鏡子高掛在上方，放水盆在下方，就可以潛望四周的景象。近代潛艇所使用的潛望鏡，也是根據相同原理製造的。'
