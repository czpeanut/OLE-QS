  section: 1
  number: 19
  type: single
  page: 1
  stem: 現今的非洲許多國家已經慢慢脫離以往貧窮、落後、戰爭的刻板印象。面對全球化的浪潮，當然也不會缺席，繼中國、東南亞後，即將成為下一個具備競爭潛力的新興地區。請問：下列何者被列入非洲經濟發展的優勢條件的可能性最低？
  options:
  - label: A
    content: 便利的海運
  - label: B
    content: 豐富的原料
  - label: C
    content: 廣大的市場
  - label: D
    content: 充足的勞力。
