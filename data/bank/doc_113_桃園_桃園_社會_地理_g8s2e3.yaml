- id: doc_113_桃園_桃園_社會_地理_g8s2e3_s1_21
  section: 1
  number: 21
  type: single
  page: 1
  stem: 位於非洲西南端的開普敦，位於兩海域的轉折點是影響世界歷史的重要都市。在蘇伊士運河未開通以前，開普敦是歐洲通往東方的海路必經之地，1869 年蘇伊士運河開通後，大量從歐洲出發的船隻改走新的通航路線，進而使開普敦逐漸沒落。請問：若由歐洲出發，經由開普敦，前往亞洲，即是下列哪一組海域的航行順序？
  options:
  - label: A
    content: 紅海→地中海
  - label: B
    content: 地中海→紅海
  - label: C
    content: 印度洋→大西洋
  - label: D
    content: 大西洋→印度洋。
