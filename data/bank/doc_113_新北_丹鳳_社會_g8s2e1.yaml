  group_stem: '＊1900 年夏，蔡元培33 歲，原配夫人王昭病逝。消息傳出，媒人紛至沓來。蔡元培很反感，開始磨濃墨、鋪素箋、揮羊毫，寫了一張別開生面的徵婚啟事。宣布雙方擇偶的條件如下：

    第一，是不纏足的（女性），天足；

    第二，是識字的；

    第三，男子不得娶妾，不能娶姨太太；

    第四，丈夫死了，妻子可以改嫁；

    第五，意見不合，可以離婚。

