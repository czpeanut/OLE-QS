  group_stem: "＊Ａ:1904 年，四川留日學生首倡，經四川總督錫良奏請，在成都設立官辦的「川漢鐵路總公司」。股本來源除認購之股、官本之股和公利之股外，主要是「抽租之股」，也稱「租股」。租股辦法，一般是隨糧徵集，因此凡是納稅的四川農戶皆為公司股東\n\
