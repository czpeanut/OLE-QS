  section: 2
  number: 23
  type: single
  page: 2
  stem: 1950 年代，臺灣電影為配合政府政策，政府所屬片廠拍攝的電影，幾乎都是配合官方意識形態的政治宣傳工具。在 1970 年代經濟成長之下，愛情、武俠、功夫、喜劇等電影類型，也進一步走入民眾的休閒娛樂之中。1980
    年代前期，臺灣電影受到香港電影新浪潮的影響，進入「臺灣新電影」時期。「新電影」在劇本創作上融入鄉土文學的題材，也開始有意識的挑戰官方政治禁忌，因而受到相關單位的關切。根據上文所述，「新電影」發展之初，最可能以下列何者作為電影題材？
  options:
