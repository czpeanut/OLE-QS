  section: 3
  number: 39
  type: single
  page: 4
  stem: 今年二月底台灣各地醫院急診室出現嚴重壅塞，許多患者滯留急診，無法及時轉入病房。急診壅塞是因為醫護人力短缺導致病房關閉因而住院床位不足，以及高齡化社會導致慢性病患數量增加，醫護工作壓力大但薪資待遇低。台灣急診醫學會表示，情況前所未有嚴重，並直言擔憂醫護離職會影響患者安全及醫療品質。請問：為解決以上問題，政府最可能做出以下何種呼籲？
  options:
