    content: 降低急診掛號費讓大家能共享
  - label: B
    content: 非緊急病況先至社區醫療院所
  - label: C
    content: 向民間企業緊急募款提高薪資
  - label: D
    content: 鼓勵民眾自行到藥局購買成藥
