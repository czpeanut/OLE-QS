- id: doc_113_新北_五峰_社會_g7s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: '上述文章中所提到的都市，哪些是屬於直轄市？

    (甲)新北(乙)臺東(丙)馬祖(丁)桃園(戊)臺中；正確的是:'
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙丙丁
  - label: C
    content: 甲丁戊
  - label: D
    content: 丙丁戊
  group_stem: '◎「讓世界看見臺灣!」新北首創全臺獨一無二的「歡樂耶誕城」，讓一個沒有雪景的國度，擁有與歐美國家媲美的耶誕節慶，新加坡媒體更讚美其為「地表最大戶外慶典」。臺東每年舉辦的熱氣球嘉年華，成為國內外遊客爭相朝聖的地點。馬祖透過海洋美景「藍眼淚」，讓美國有線電視CNN
    讚譽為世界十五大此生必看奇景之一!臺中以七期為中心，透過都市設計，創造媲美國際大城的都市景觀，桃園市因鄰近臺北都會區，擁有眾多工業區設立，人口不斷增加，也是全臺灣東南亞國際移工人數最多的城市!臺灣的城市競爭，在這個地球村的時代，從島內的政治角力，擴展到國際盃賽局，城市競爭力已日趨國際化。請依據上文回答第9-10
    題:'
