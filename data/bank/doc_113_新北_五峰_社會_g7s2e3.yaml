  stem: 美國勞動部對玻璃天花板的定義為：基於一些態度上或組織的偏差所造成的人為障礙，使具備資格的個人無法在其組織中升遷至管理階層的職位。這種人為障礙包括雇用、升遷和發展機會的甄選標準，使女性在組織中擔任管理階層職位的機會降低，並被迫接受薪資較低的職位，因此經常用來隱喻女性升遷的無形障礙。下列何者符合其概念？
