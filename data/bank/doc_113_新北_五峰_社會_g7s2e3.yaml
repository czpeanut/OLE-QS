  section: 3
  number: 40
  type: single
  page: 4
  stem: 多數失能、失智者，由於身體機能衰退，日常生活照護需要部分或全部仰賴他人協助。許多照顧者因長年無休、困在家中，導致身心疲憊、精神耗竭。政府推出的長照2.0
    計畫，當中包括喘息服務，也就是家中主要照顧者若需要休息，可以申請該服務，讓長輩到日間照顧中心、巷弄長照站、住宿式機構，或是請照顧服務員到府協助照顧，幫助紓解長期照顧失智、失能家屬的壓力，使主要照顧者得以暫歇，提升照顧者與被照顧者的生活品質。請問：喘息服務與政府提供的哪一類社會福利措施有關？
  options:
