    content: 'NT$700. (7~9) Wombats live only in Australia. They have short legs and
      a short tail. They also have a big nose and small ears. They look small and
      cute in pictures, but they can grow to 100 centimeters. A mother wombat has
      a pouch to hold her baby in it. The baby wombat grows in the pouch before it
      is old enough to go into the world. The wombats are herbivores. They eat vegetables
      and fruits. What’s more, they usually sleep during the day and come out for
      food at night. Aren’t wombats special? Actually, they are some more special
      things about them: ◆Wombats are good at digging. Wombats’ legs are short, but
      they are very strong. They dig many holes in the ground to make homes. This
      made wombats “heroes” in the 2019 Australia fires. Many animals hid in these
      holes in the fires. ◆Wombats’ pouches face back. Wombats’ pouches are different
      from other marsupial animals’ : they face back. So, a mother wombat can dig,
      but doesn’t make her pouch and baby dirty. ◆Wombats have square poop. Only wombats
      can make square poop. Why can they make square poop? People don’t know the answer
      yet, but it may have something to do with the shape of their intestines. ★tail尾巴pouch育兒袋hold容納grow成長vegetable蔬菜during在...期間dig
