  group_stem: 'Squirrels in LinYuan Sinior High School

    Squirrels are special animals in Lin Yuan Sinior High School. They love to climb
    trees and play around in the field. Many students are interested in seeing these
    cute and lively creatures.

    Squirrels are like friends. They collect nuts and sometimes forget where they
    put them. This forgetfulness actually helps trees grow! When squirrels forget
    about their nuts, those nuts can turn into new trees. So, squirrels help make
    the trees greener and more beautiful!

    Next time you see the squirrels, keep an eye out for them. They might run and
    jump right in front of you. Just remember not to get too close or feed them, because
    they’re wild animals. Enjoy watching them from a safe distance and appreciate
    the wonders of nature in school.


