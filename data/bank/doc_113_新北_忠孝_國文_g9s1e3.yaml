- id: doc_113_新北_忠孝_國文_g9s1e3_s2_32
  section: 2
  number: 32
  type: single
  page: 3
  stem: 根據本文，如果月球真的碎裂了，對地球會有哪些重大的影響？
  options:
  - label: A
    content: 造成低溫與雪災
  - label: B
    content: 引發地震和海嘯
  - label: C
    content: 引起颱風與水災
  - label: D
    content: 發生乾旱與森林大火。
  group_stem: '有一位科學家發現，月球就要碎裂了，他要求見總統，當面解釋如果月球真的碎裂了，對地球會有哪些重大的影響。

    　　為了安定人心，不致引起恐慌，總統請他保密，並且尋求解決方案。科學家夜以繼日的計算和實驗，終於在月球碎裂之前，完成了一枚人造月球做為代替。至於真的月球則在引爆之後灰飛煙滅，消失在宇宙中。

    　　人們完全沒發現，雖然有人覺得月球似乎比過去更皎潔光亮。政府宣稱是因為新的環保政策生效，空氣品質提升的關係。

    　　科學家對於自己完成空前絕後的偉大任務，卻無人知曉感到忿忿不平。如果不是因為他，地球會出現地震和海嘯，造成嚴重的傷亡，劫後餘生的人從此再也看不到月亮。

    　　是他挽救了地球，為什麼卻不能讓別人知道？

    　　他開始一找到機會，就發表月球偽製論。情報局感到緊張，詢問總統是否要派人暗殺他。總統回答，由他去，那些自以為是又見不得別人好的科學家，自然會想方設法毀了他。

    　　科學家搶著在各種研討會發表論文，並且投書到報章雜誌，但是沒有人相信他。其他學者先是批評他狂妄，後來索性不理他。不被了解的他，更積極到處宣示，最後被送進精神病院。在醫護人員的扶持下，他高喊，月亮是假的，是我做的。這時候突然有一位白髮蒼蒼的老先生衝到他面前，兩眼閃著淚光，握住他的雙手，說，我終於找到明白人了，太陽也是假的，是我做的。

    　　科學家定神一看，說話的老人，正是十幾年前得到科學界至高榮譽獎，被譽為本世紀最偉大的科學家。原來，有人在他之前已經完成了人造太陽，他所到處宣揚的，其實只是微不足道的小小成就，這打擊比沒人相信他更大，科學家這一回真的瘋了。（改寫自楊明
    月亮是假的）'
