  group_stem: "燕地寒，花朝節後，餘寒猶厲。凍風時作，作則飛沙走礫。局促一室之內，欲出不得。每冒風馳行，未百步輒返。\n　　廿二日，天稍和，偕數友出東直。至滿井，高柳夾堤，土膏（１）微潤，一望空闊，若脫籠之鵠。於時冰皮始解，波色乍明，鱗浪層層，清澈見底。山巒為晴雪所洗，娟然如拭，鮮妍明媚。柳條將舒未舒，柔梢披風，麥田淺鬣寸許。遊人雖未盛，泉而茗者，罍（２）而歌者，紅裝而蹇者，亦時時有。風力雖尚勁，然徒步則汗出浹背。凡曝沙之鳥，呷浪之鱗，悠然自得，毛羽鱗鬣（３）之間，皆有喜氣。始知郊田之外未始無春，而城居者未之知也。\n\
    \                    （改寫自袁宏道 滿井遊記）\n【注釋】（１）土膏：肥沃的土地。（２）罍：音ㄌㄟˊ，此指喝酒。（３）毛羽鱗鬣：此泛指所有生物。鬣，音ㄌㄧㄝˋ。"
