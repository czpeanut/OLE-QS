  stem: 劉勰在文心雕龍中認為：「情以物遷，辭以情發，一葉且或迎意，蟲聲有足引心。」明白指出人們內心的感受常會受到外在景物所牽引，而詩文便是這些情感的抒發。下列詩詞，何者可印證此一現象？
  options:
  - label: A
    content: 何處望神州？滿眼風光北固樓。千古興亡多少事？悠悠，不盡長江滾滾流
  - label: B
    content: 少年不識愁滋味，愛上層樓。愛上層樓，為賦新詞強說愁
  - label: C
