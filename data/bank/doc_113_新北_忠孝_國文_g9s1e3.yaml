  stem: 本文中，顧客想要一個海鮮至尊披薩，店長基於何種理由給予不同的建議？
  options:
  - label: A
    content: 店內的營收考量
  - label: B
    content: 披薩的製作時間
  - label: C
    content: 海鮮的存貨數量
  - label: D
    content: 顧客的健康狀況。
  group_stem: '一家披薩店，外賣電話響了。

    　　店長：您好，請問有什麼需要為您服務的？

    　　顧客：你好，我想要一份披薩。

    　　店長：請問您是陳先生嗎？

    　　顧客：你怎麼知道我姓陳？

    　　店長：陳先生，因為我們聯機的系統對接通信  服務商，看到來電號碼就知道您貴姓了。

    　　顧客：原來如此。我想要一個海鮮至尊披薩。

    　　店長：陳先生，海鮮披薩不適合您，建議您另選一種。

    　　顧客：為什麼？

    　　店長：根據您的醫療紀錄，您有痛風症狀，建議您不要食用高普林的食物。您可以試試我們店最經典的田園蔬菜披薩，低脂、健康，符合您現階段的飲食要求。

    　　顧客：你怎麼知道我會喜歡這種？

    　　店長：您上週在網路書店買了一本低脂健康食譜，其中就有這款披薩。

    　　顧客：好吧。我要一個家庭特大號披薩，多少錢？

    　　店長：４９５元。這個足夠您一家六口吃了。但您母親應該少吃，她上個月剛做了心臟手術，還處於恢復期。

    　　顧客：好的，知道了。我可以刷卡嗎？

    　　店長：抱歉，陳先生，請您付現。因為您的信用卡已經透支了，您現在還欠銀行２５０００元，還不包括房貸利息。

    　　顧客：那我先去提款機取現金。

    　　店長：陳先生，根據銀行紀錄，您今天已經超過了日提款限額。

    　　顧客：算了，你們直接把披薩送來吧，家裡有現金。你們多久會送到？

    　　店長：大約３０分鐘。如果您不想等，可以自己來取。

    　　顧客：為什麼？

    　　店長：我這邊看到您家距離我們只有５分鐘的車程。您名下有一輛車號為ＸＸＸＸＸＸ的車子，這輛車目前正在距離您家不到兩分鐘車程的地方。如果您等不及，可以回家拿了現金開車來店裡取，這大概要１０分鐘，正好是一個披薩出爐的時間。這樣，您總共只需花１５至２０分鐘就可以將披薩拿回家，比我們送貨上門要快。

    　　顧客差點兒暈倒。（改寫自秦嫣 大數據點餐）'
