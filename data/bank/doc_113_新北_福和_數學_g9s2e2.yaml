- id: doc_113_新北_福和_數學_g9s2e2_s2_25
  section: 2
  number: 25
  type: single
  page: 4
  stem: 假設明華商店選擇「住商型簡易時間電價」的電費計價方式。在 2024 年 8 月當月份用電總度數為 2,300 度，(其中尖峰時間用電 1,300 度、離峰時間用電
    1,000 度)，則根據「住商型簡易時間電價」(兩段式時間電價)計價方式，請根據上表幫明華商店計算該月應付電費約為多少元？ (第一冊第一章)
  options:
  - label: A
    content: '8854'
  - label: B
    content: '8779'
  - label: C
    content: '8650'
  - label: D
    content: '8548'
  group_stem: '去年2024電費調漲！用電量越大，漲幅越多！台電在電費計算上提供了民眾兩種選擇：一種是「累進電價」，另一種則是「時間電價」。全國約 98%
    的用戶都使用「累進電價」，24 小時的電費都相同。這也就是我們一般比較直觀的「用越多電，每度電收的電費就會越高」的計費方式。「累進電價」的計算是採用累進的方式，也就是每一階層有固定的用電收費，超過這個階層用電額度的部分，則要用下一階層的用電收費來計算。「時間電價」則是提高尖峰用電價格，降低離峰價格（兩者價差可以高達
    3 倍以上），試圖用價格差異來引導用戶避開尖峰時間用電，抑低尖峰負載。也就是說如果用戶覺得自己在所謂「尖峰時間」用電反而比較少，那其實這種方案對用戶來說會是比較划算的！適合每月用電量較大的住宅，或商店評估選用，聰明用電省荷包。


    表(一):住商型簡易時間電價（二段式）

    | 尖峰/離峰時間 | | 夏季電費(6 月 1 日～9 月 30 日） |

    | --- | --- | --- |

    | 基本電費 | 按戶計收 | 75.00 元/戶 |

    | 流動電費 平日（週一～週五） | 尖峰 09:00~24:00 | 5.01 元/度 |

    | 流動電費 平日（週一～週五） | 離峰 00:00~09:00 | 1.96 元/度 |

    | 流動電費 假日 | 離峰 00:00~24:00 | 1.96 元/度 |

    | 每月用電總度數超過 2,000 度的部分 | | 加收 1.02 元/度 |

    ※若A戶選擇使用「住商型簡易時間電價」(兩段式時間電價)計價方式，每月應計電費包含基本電費及流動電費


    表(二):累進電價計價方式

    | 每月用電度數分段 | 夏季電費一度電多少錢（ 2024 新版) | 夏季電費一度電多少錢（2023 舊版） |

    | --- | --- | --- |

    | 120 度以下部分 | 1.68 元/度 | 1.63 元/度 |

    | 121~330 度部分 | 2.45 元/度 | 2.38 元/度 |

    | 331~500 度部分 | 3.70 元/度 | 3.52 元/度 |

    | 501~700 度部分 | 5.04 元/度 | 4.80 元/度 |

    | 701~1000 度部分 | 6.24 元/度 | 5.83 元/度 |

    | 1001 度以上部分 | 8.46 元/度 | 7.69 元/度 |

    ※若 B 戶選擇使用「累進電價」，2024 年 8 月用電度數為 450 度，

    則該月應付電費=1.68元×120度＋2.45元×(330度-120度)＋3.7元×(450度-330度)'
