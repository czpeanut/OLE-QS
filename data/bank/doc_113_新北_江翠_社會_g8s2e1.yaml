  section: 1
  number: 1
  type: single
  page: 1
  stem: 民國初年的學者梁漱溟認為，帝國主義、軍閥是中國人民的最大敵人。他在1930 年的一封信指出：「數年來的革命潮流中，大家所認為第一大仇敵是國際的資本主義，其次是國內的封建軍閥。」請問軍閥割據局面始於下列何事？
