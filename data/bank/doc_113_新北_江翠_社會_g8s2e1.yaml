  stem: 1913 年，中國舉行參、眾議院選舉，由國民黨贏得國會大選，當時的國民黨領導者效法歐美政黨領袖，搭乘火車四處旅行演說，強調內閣政治的重要。由於他可望擔任內閣總理，因而引來殺機，當他準備從上海火車站出發，前往北京與臨時大總統會面途中遭到槍擊，不久身亡。請問上述國民黨領導人遇害後，引發哪一事件的發生？
