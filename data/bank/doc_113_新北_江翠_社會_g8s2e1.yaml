  group_stem: 民國8 年，北京大學某位教授於《新青年》發表文章如下：『假使有人問：「何以要擁護德先生和賽先生便不能不反對國粹和舊文學呢？」答案自然是：「因為國粹和舊文學是同德賽兩位先生反對的」。…。據我個人的觀察，新思潮的根本意義只是一種新態度。這種新態度可叫做「評判的態度」。…這種評判的態度，在實際上表現時，有兩種趨勢。一方面是討論社會上、政治上、宗教上、文學上種種問題，一方面是介紹西洋的新思想、新學術、新文學、新信仰。前者是研究問題，後者是輸入學理。這兩項是新思潮的手段。』
