- id: doc_113_新北_江翠_社會_g8s2e1_s3_44
  section: 3
  number: 44
  type: single
  page: 4
  stem: 請問根據《民法》與補習班管理規定，下列何者是正確的判斷？
  options:
  - label: A
    content: 口頭約定具有完全效力，小華必須遵守補習班的口頭規則
  - label: B
    content: 契約內容須遵守法律規定，即使雙方口頭同意不退費，也不能違反退費標準
  - label: C
    content: 雖然雙方有交易行為，但因為沒簽書面契約，故無法主張消費權益
  - label: D
    content: 小華未事先詢問退費政策，表示接受補習班所有決定，無權要求退費。
  group_stem: "民眾要選擇補習班時，臺北市教育局提醒學生三大要點，包括「合格立案要查清」、「契約收據要簽訂」、「退費權益要辨明」，保護自身的權益。\n\
    「合格立案要查清」：最基本的是要確認補習班是否有合格立案，可透過班名、地址等資訊至「短期補習班資訊管理系統」查詢。\n「契約收據要簽訂」：一定要準備契約書，且格式、內容應符合教育部訂定的《短期補習班補習服務契約書應記載及不得記載事項》，繳費後索取收據。\n\
    「退費權益要辨明」：開課前退費針對不同時間提出，可以得到不同比例的退費。\n    小華報名了某間補習班，繳費後卻發現補習班並未提供正式契約，只用口頭說明上課時間和退費規則。補習班口頭表示：「繳費後概不退費」，並要求小華簽署「不退費聲明」。後來小華因個人因素無法繼續上課，想申請退費但補習班拒絕，理由是小華已簽署聲明同意放棄退費。更糟的是，補習班未事先告知，突然更改上課時間，導致小華原本能上的課程也無法配合。小華覺得不合理，於是向消保官申訴。"
