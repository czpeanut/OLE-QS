- id: doc_113_高雄_獅甲_英語_g9s2e2_s5_33
  section: 5
  number: 33
  type: single
  page: 4
  stem: What is the reading mainly about?
  options:
  - label: A
    content: When people start to dream.
  - label: B
    content: Why some people are blind.
  - label: C
    content: How people without sight dream.
  - label: D
    content: What dreams most people have.
  group_stem: "Many people around the world are affected by blindness. A small number\
    \ of them are almost blind and can’t see a thing, but \nmost of them still have\
    \ some sight. Some of those people are only able to tell whether there is light,\
    \ but others can see quite a bit \nmore. This leads people to think about the\
    \ question: Do blind people dream, and if they do, do they dream like sighted\
    \ people? \n    Dreams are made inside the brain, and they happen during REM sleep（快速動眼期）.\
    \ That means they are not directly \nconnected to people’s eyes or sight. So,\
    \ it’s no surprise that blind people do dream, and they dream just as much as\
    \ sighted people \ndo. What they dream about is a little different, though. That’s\
    \ because they experience smell, sound, and taste more, just as they do \nwhen\
    \ they are up. This is not to say that they don’t see when they dream. Some blind\
    \ people can and do dream in pictures.  \nHowever, if someone was born blind or\
    \ went blind before the age of five, they usually don’t see pictures in their\
    \ dreams. On the \nother hand, the later in life people lose their sight, the\
    \ more likely they can still see pictures in their dreams. \n affect 影響 blindness\
    \ 眼盲 sight / sighted 視力／看得見的 brain 頭腦 directly 直接地 connected 有關聯的   \nlikely 有可能的"
