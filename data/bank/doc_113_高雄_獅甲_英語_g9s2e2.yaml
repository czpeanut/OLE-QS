  group_stem: "(Tara, who comes from India, goes to senior high school in Taiwan.\
    \  She and Hsing-Chun are classmates.) \nHello Hsing-Chun, \n   I’ve been interested\
    \ in Taiwan for a long time. Thank you for sharing __21.__, and I’m going to share\
    \ mine with you through my \ncountry’s food. \n   First of all, not all Indian\
    \ food is spicy. Don’t let that thought __22.__ you away from trying it. Spices\
    \ which are used in Indian food \nare mainly from plants, such as flowers, leaves,\
    \ fruits, seeds, and roots.  In fact, some of them are very sweet.   \n   Second,\
    \ we Indians enjoy eating our food with our hands and believe __23.__. When eating,\
    \ only the right hand should be used. In \nIndian culture, the left hand is considered\
    \ the dirty hand, and therefore it’s not polite to eat with it. Although it takes\
    \ time to master the \nart of bringing food to your mouth with just your fingers,\
    \ you are just as welcome to eat with a spoon in an Indian restaurant. \n   What’s\
    \ more, McDonald’s does not sell beef or pork products in any of their restaurants\
    \ in India. Around 80% of Indians are \nHindus. __24.__ they consider the cow\
    \ to be a sacred symbol of life, most Hindus do not eat beef, and many are vegetarians.\
    \  Also, \n13% of Indians are Muslims, who eat beef but do not eat pork.   \n\
    \   Have you become more interested in Indian food? I hope now __25.__. If you\
    \ have not tried Indian dishes, it is time to give it a go. \nAll the best, \n\
    Tara  \n spicy 辛辣的  spice 香料  consider 認爲  master 精熟  sacred 神聖的  vegetarian\
    \ 素食主義者"
