- id: doc_113_台中_大業_社會_公民_g8s1e3_s1_43
  section: 1
  number: 43
  type: single
  page: 4
  stem: 「鐘擺效應」在描述人類情緒的高低擺盪現象，最常見於選後分析選民的心理狀態。當某陣營在一次選舉中大勝後，大敗的陣營較容易在下一次選舉中收復失地，就如同鐘擺向左擺後便會向右，因此有些國家經常出現執政黨輪替的情形。如果運用公共意見的特性來分析此一效應，請問：下列何者較符合上述內涵？
  options:
  - label: A
    content: 選民願意投票給選後能實踐競選支票的政黨候選人，這是發揮影響性的結果
  - label: B
    content: 政黨的候選人提出與生活利益有關的政策時，較能對選民產生議題性的效果
  - label: C
    content: 政黨選舉時並非固定推出同一組候選人，造成選民出現支持與反對的複雜性
  - label: D
    content: 選民對同一個政黨，會隨著時空改變是否支持的立場，顯示出變動性的情況。
