- id: doc_113_桃園_桃園_英語_g8s1e2_s1_28
  section: 1
  number: 28
  type: single
  page: 4
  stem: 28. What is the best(最好的) title for this article?
  options:
  - label: A
    content: How to Learn Tricking in 10 Days
  - label: B
    content: From 2016 to 2022, From 70 Million to 2 Billion
  - label: C
    content: Let’s Use Tricking in Action Movies
  - label: D
    content: A YouTuber Gets 10 Million Subscribers
  group_stem: '28.


    Hey , can you do a flip? If you want to learn, you need a good teacher. Luckily,
    you can see how to do it on YouTube. Some YouTubers teach how to do flips. It''s
    called "tricking." In fact, one tricker on YouTube recently reached 10 million
    subscribers. And he''s from Taiwan! That means he is the first Taiwanese YouTuber
    to reach 10 million subscribers. His name is Wu Chi-hsuan (吳奇軒), and his channel
    is called "Chi Hsuan Tricking."

    Watch his videos, and you can learn all amazing movements. In one video, he teaches
    a student how to do a cartwheel. First, he shows her wheeling onto his hands and
    back to his feet. Then, he teaches her the different steps of this motion. Last,
    he helps her when she tries the cartwheel herself.

    How does his channel become so popular? He got interested in tricking after it
    came to Taiwan from the US more than twenty years ago. In 2016, Chi-hsuan uploaded
    his first YouTube video. At first, he didn''t get many subscribers. That changed
    in 2022. He started making shorter videos and they went viral! Last year, his
    videos got more than 2 billion views and 70 million likes. Now he has 10 million
    subscribers. His fans are all over the world, especially in North America and
    Southeast Asia.

    So what is Chi-hsuan''s next step? He says he wants to be in action movies. He
    wants to use tricking to show the world that Taiwan has lots of action gifted
    people.


    flip 翻動 tricking 武術特技 subscriber 訂閱者 channel 頻道 movement 運動 cartwheel 側手翻


    Adapted from ICRT News Lunchbox 2024.04.04'
