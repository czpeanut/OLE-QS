  group_stem: 'The Frog and The Mouse

    Once upon a time, there were two close friends—the frog and the mouse. The frog
    often visited the mouse to share the food stocked by the mouse. One day, the frog
    asked the mouse to come to his house. The frog said, “Dear mouse, I come to your
    house all the time. Now, I invite you to my place.” The mouse said, “Your house
    is across the river. I don’t know how to swim. I''m scared of drowning.” The frog
    said, “Don’t worry. I have a beautiful plan for you. I can tie you to me with
    a rope. With this, you can safely cross the river. The mouse agreed to this and
    they both set out.

    Halfway across the river, the frog had a bad idea. He thought, “If I make the
    mouse drown, I can get all his stocked food and I don''t need to worry about being
    hungry for a long time.” So, the frog dived for the bottom of the river. When
    the mouse realized the dishonesty of the frog, he started crying for help. “Help
    me! Help me!” cried the mouse. A hawk saw this and flew down to help the mouse.
    The hawk held him with its beak and flew high in the sky. The frog tied to the
    mouse also flew away.

    In the end, the frog realized his mistake. In his greed to get more food, he not
    only lost the trust of his good friend but also put his own life in danger.


    stock 儲存 drown 溺水 rope 繩子 dive 潛水 realize 意識到

    dishonesty 不誠實 hawk 老鷹 greed 貪心 not only… but also 不僅…還有


    Source- https://www.vedantu.com/stories/the-frog-and-the-mouse'
