  group_stem: '台灣丘陵地出好茶，台灣人也愛喝茶，但是你知道嗎？台灣本土茶，根本不夠供應內需市場，因此，有將近 3/4 的茶葉，都必須仰賴東南亞或中國進口，低價的進口茶混充台灣茶銷售，不僅傷害國人健康，更嚴重打擊國產茶農的努力與信譽。

    台灣茶葉，本來就不夠國人需求，而且近年來，國人偏愛「高山茶」，海拔高、品質優，產量更加稀少，加上採茶工人不足，成本增加，台灣茶價格攀升，也連帶使得廉價進口茶備受青睞。

    茶農：「在地的茶農都比較老年化，而且婦女都是較高齡長者。」據統計，台灣本土茶產量，每年約 1.4 萬公噸，扣掉外銷近 4000 噸，還得仰賴外國進口 3 萬公噸，才足夠提供台灣內需市場。

    為了保護農民、保障消費者、維護國產茶的品牌形象，農委會主委指出：「近日預告實施『指定國產茶葉為應登錄溯源資訊之農產品及其應遵行事項』，要求所有國產茶皆需要有產銷追溯條碼（QR
    Code）、產銷履歷或有機標章等三者其中之一，如此才能夠在產品上標示『台灣』。」請回答 29-33 題：'
