  section: 1
  number: 1
  type: single
  page: 1
  stem: 民國 101 年屏東科技大學鳥類生態研究室接獲通報，發現死亡的黑鳶（老鷹）體內有劇毒農藥。田野調查後研判，是因為農夫種植紅豆時，為了避免鳥害而使用農藥，鳥類啄食後死亡，老鷹撿食死鳥間接中毒而亡。這個事件被收錄在「老鷹想飛」，生態紀錄片中，經過媒體的傳播，逐步受到重視，有農夫願意改變耕種方法，使用有機、無毒栽種，避免毒殺鳥類。這樣的改變感動了通路老闆，決定與農民合作，推出「老鷹紅豆」，讓有機紅豆可以在有穩定銷售的平臺，同時讓民眾更了解無毒農業的重要，並推廣友善環境的耕種觀念。其中使用「有機、無毒栽種」，是下列哪項臺灣農業轉型策略？
