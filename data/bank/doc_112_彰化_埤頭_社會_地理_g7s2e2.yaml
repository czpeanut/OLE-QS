  group_stem: '附圖為漁電共生先行區域分布圖

    「漁電共生」是將太陽能電廠蓋在魚塭的土堤上，養殖為主、發電為輔，新的果業合作模式，不僅增加土地利用率，且幫助漁民減輕負擔。太陽能板具有冬季擋寒風降低寒害，夏季遮太陽減少池水蒸發的功效，故漁民對漁電共生的接受度愈來愈高。部分企業也有意願購買再生能源，例如：Google
