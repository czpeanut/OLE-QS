  group_stem: 'When you are leaning a language, have you ever known that it’s also
    a good way to learn it from body language? Body language plays an important role
    to show what a person wants to say.

    Gestures mean a lot when we are talking. If you use the wrong gestures, you may
    become a joke, or even make a big mistake which may not be forgiven. For example,
    the V sign is popular used in the USA and in Taiwan. The V sign shows the meaning
    of victory in America. It’s common to see it when people win a basketball game.
    On the other hand, teenagers in Taiwan also love to use the V sign when they are
    taking pictures. They think it’s cute and it also shows their happiness. However,
    people may be hit in the UK if they use the V sign to other people. It is because
    the V sign means bad words and they will feel very terrible if they see it.

    Isn’t it very interesting? Different gestures mean differently in different countries.
    Understanding one’s culture is also helpful to learn a language. Next time, when
    you go to different countries, remember to understand their body language more.
    If you don’t, it may not be easy for you to make new friends.


