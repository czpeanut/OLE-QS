    content: 從上圖可以推判，尼伯特颱風中心登陸的時刻
  - label: B
    content: 尼伯特颱風通過前後，臺東測站的氣壓值有明顯變化，是因為颱風為低氣壓系統，中心氣壓低於周圍，故通過時的氣壓會先降低再升高
  - label: C
    content: 從上圖可以推判，尼伯特颱風中心最接近測站的時刻是在 7 月 8 日 5 時
