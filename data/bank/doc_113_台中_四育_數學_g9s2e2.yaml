- id: doc_113_台中_四育_數學_g9s2e2_s2_2
  section: 2
  number: 2
  type: calc
  page: 6
  stem: '(1)1ppm 即每1 百萬公克中含有1 公克。20 顆藍莓檢驗出白克列約0.3 毫克，試問是多少ppm？(1 公克=1000 毫克)

    (2)營養師建議藍莓食用量在100~150 公克之間，食用過量的膳食纖維，可能引起脹氣或腹瀉，應適量享用。試問，小翔腹瀉的原因較可能是食用過量藍莓或是藥物殘留造成？請說明原因。'
  group_stem: '2. 小翔為了獲得更健康的體位，跟營養師資料索取了健康飲食資訊。查閱到藍莓富含了20 種營養素，更具有12種功效，被譽為「21 世紀維他命」，還有超級水果的美稱。於是請了爸爸買了3
    盒藍莓，每盒約50 顆，不含盒子約重100 公克。

    小翔迫不急待就拿了2 盒，沒有清洗就全部吃了下去，造成了腹部不適拉肚子。爸爸就是科學研究實驗室的員工，懷疑是農藥殘留過量，於是拿出剩下一盒自行至公司檢驗。拿出其中20
    顆藍莓檢驗出含有殺菌劑成分的農藥白克列約0.3 毫克。


    | 名稱 | 蔬果名 | 容許量(ppm) | 用途 |

    | :--- | :--- | :--- | :--- |

    | 亞托敏 | 藍莓 | 5.0 | 殺菌劑 |

    | 白克列 | 藍莓 | 10.0 | 殺菌劑 |

    ※衛生福利部公告食品中殘留農藥檢驗標準'
