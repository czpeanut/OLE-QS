- id: doc_113_台中_順天_自然_g8s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: '有新聞報導如下：「<u>(一)海水因二氧化碳等非金屬氧化物的增加而酸化，嚴重影響珊瑚和其他分泌碳酸鈣的海洋生物生存。(二)因海水氫離子的濃度增加，這些海洋生物的碳酸鈣外殼可能會遭到分解。</u>」關於此報導畫底線處內容的判斷與解釋有下列4項，請問何者正確？

    (甲)(一)不合理，因為這些氧化物溶於海水中會使海水 $\mathrm{pH}$ 值上升

    (乙)(一)合理，因為這些氧化物溶於海水中會使海水 $\mathrm{pH}$ 值下降

    (丙)(二)不合理，因為這些海洋生物的碳酸鈣外殼不會與氫離子反應

    (丁)(二)合理，因為這些海洋生物的碳酸鈣外殼會與氫離子反應。'
  options:
