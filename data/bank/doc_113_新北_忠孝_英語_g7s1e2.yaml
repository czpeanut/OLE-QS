  group_stem: "(26~28)                                    Thanksgiving Day\nToday\
    \ is Thanksgiving Day, and everyone is helping with the big celebration.  The\
    \ family is \ngetting together to give thanks and enjoy a big meal.  In the kitchen,\
    \ Mom is cooking the \nturkey, and Dad is making potatoes.  Sophie is setting\
    \ the table, and James is placing colorful \npumpkins near the house.  The grandparents\
    \ are sitting on the sofa, watching the parade on \nTV.  People there are singing\
    \ and dancing.\nEveryone in the house is giving thanks.  Sophie is thankful for\
    \ her family, and James is \nthankful for his toys.  Mom is thankful for good\
    \ food, and Dad is thankful for a warm home. \nAfter sharing what they are thankful\
    \ for, the family is getting ready to eat turkey and celebrate \nthe day together.\n\
     celebration 慶祝 enjoy 享受 meal 餐 turkey 火雞 potato 馬鈴薯 set 擺設 parade 遊行 thankful\
    \ for 感謝 warm 溫暖 share\n分享"
