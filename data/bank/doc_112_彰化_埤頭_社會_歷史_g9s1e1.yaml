  stem: 西方歷史上有亞歷山大東征的英勇壯闊，亞洲歷史上有蒙古西征的雄壯豪邁，兩者皆留下史詩般歷史征伐的篇章。請問：如果將兩者比較，下列敘述何者錯誤？
