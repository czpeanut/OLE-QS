  stem: 「柯因泰語」（Koine），又稱「通用希臘語」，是大約發源於西元前四世紀的國際性語言。此一語言因帝國在政治上統一下愛琴海地區各希臘城邦，融合了該地區多種方言發展而成；其後又伴隨帝國對外武力征服，向埃及、西亞等地區擴散傳播，對於於後數百年間科學、文學和宗教的發展影響深遠。上述的「某帝國」，源自圖中何處？
