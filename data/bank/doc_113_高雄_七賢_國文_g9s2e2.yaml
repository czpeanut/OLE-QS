- id: doc_113_高雄_七賢_國文_g9s2e2_s2_31
  section: 2
  number: 31
  type: single
  page: 4
  stem: 根據本文，下列敘述何者最恰當？
  options:
  - label: A
    content: 張又新將天下的水按水質分成二十種
  - label: B
    content: 歐陽脩按水源的遠近和高低評定水質
  - label: C
    content: 在《煎茶水記》中，張又新反駁劉伯芻看法
  - label: D
    content: 依《茶經》論水的標準，揚子江優於虎丘井。
  group_stem: "(一)請閱讀以下短文，並回答下列各題：\n  陸羽《茶經》論水云：「山水上，石泉又上，江水次而井水下。」又「江水取去人遠者，井取汲多者。」其說止於此，未嘗品第天下之水味。張又新《煎茶水記》云劉伯芻謂水有七等，以揚子江為第一，惠山石泉為第二，虎丘井第三，淮水居末。又載羽為李季卿論水次第有二十種，江水居山水上，井水居江水上。二說皆與《茶經》不合。\n\
    \  水味有美惡而已，欲求天下之水一一而次第之者，謬說也。羽之論水，惡渟浸而喜泉源，故井取多汲者。江雖長，然眾水雜聚，故次山水。惟此說近物理云。\n（改寫自歐陽脩〈大明水記〉）\n\
    註：渟浸：水停止不動。"
  tags:
    textbook: 九下 自學課一 來龍去脈說掌故——歷代筆記小品選
