- id: doc_113_高雄_七賢_國文_g9s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 「晉 中行寅將亡，召其太祝簡欲加罪。曰：『子為我祝，齋戒不敬，使吾國亡。』太祝簡對曰：『今舟車飾，賦斂厚，民怨謗詛多矣。苟以為祝有益於國，則詛亦將為損。一人祝之，一國詛之，一祝不勝萬詛，國亡不亦宜乎，祝其何罪？』」文中太祝簡所言的主要涵義應為下列何者？（註：太祝：主管祭祀祈禱的官吏。吾「國」：在此指中行寅的封地。）
  options:
  - label: A
    content: 表達國之存亡繫於施政，非關祝者
  - label: B
    content: 辯解祝者力寡，禱詞難以上達天聽
  - label: C
    content: 批評主政者只重視享受，疏於齋敬
  - label: D
    content: 說明亡國乃因上位者迷信怪力亂神。
