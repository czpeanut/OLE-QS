  - label: D
    content: 兩文皆肯定張景不凡的文才。
  group_stem: "(三)請閱讀以下短文與表格，並回答下列各題：\n【甲】\n  柳開少好任氣，大言凌物。應舉時，以文章投於主考簾前，凡千軸，載以獨輪車。引試日，自擁車入，欲以此駭眾取名。其時張景能文有名，唯袖一書簾前獻之。主考大稱賞，擢景優等。時人為之語曰：「柳開千軸，不如張景一書。」\n\
    （改寫自沈括《夢溪筆談》）\n【乙】\n  張景，字晦之，江陵 公安人。幼能長言，嗜學尤力。貧不治產，往從柳開。開以文自名，而薦寵士類，一見歡甚，悉出家書予之，由是屬辭益有法度。開每曰：「今朝中之士，誰踰晦之者！」即厚饋，使如京師。後中進士。\n\
    （改寫自宋祁《故大理評事張公墓誌銘》）\n【丙】相關人物簡表\n| 姓名 | 西元生卒年 | 中舉年分 |\n| --- | --- | --- |\n|\
    \ 柳開 | 948～1001 | 973 |\n| 張景 | 970～1018 | 1000 |\n| 宋祁 | 998～1061 | 1024 |\n\
    | 沈括 | 1031～1095 | 1063 |\n\n註：凌物：傲視他人。\n  引試：面試。\n  張公：指張景。\n  墓誌銘：記錄死者生平事蹟的石刻文字。"
