- id: doc_113_高雄_七賢_國文_g9s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: '彭玉麟任江南巡按時，有人告訴他武昌知府靠逢迎拍馬才能升官。彭公聽了大怒，召知府來斥責，武昌知府恭謹地說：「卑職奉承的對象，都是喜歡被奉承的人，像大人您這樣公正嚴明，卑職再會奉承也沒有用啊！」彭公聽了得意地笑說：「我就知道你拍不了我的馬屁。」

    根據這則故事，關於彭公和武昌知府的敘述何者最不恰當？'
  options:
