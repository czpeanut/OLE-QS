- id: doc_113_高雄_七賢_國文_g9s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 「溝通包含了三要素：內容、語調、非語言行為。若某人說話時的語調、手勢、表情，和他所說的內容不一致或情境模糊時，人們比較容易受到語調和非語言行為的影響。」下列情境，何者最符合這段文字的內容？
  options:
  - label: A
    content: 說話用字過度簡潔，會讓人覺得沒有禮貌
  - label: B
    content: 同樣的內容，由嚴肅的老師說出來比較具有說服力
  - label: C
    content: 朋友收到禮物時臭著臉說「謝謝」，會覺得他其實並不開心
  - label: D
    content: 聽廣播時，因看不到主持人的表情、手勢，無法判斷內容的真實性。
