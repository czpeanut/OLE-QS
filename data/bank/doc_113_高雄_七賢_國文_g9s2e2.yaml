  stem: 「古之治天下，朝有進善之旌，誹謗之木，所以通治道而來諫者。今法有誹謗妖言之罪，是使眾臣不敢盡情，而上無由聞過失也。將何以來遠方之賢良？其除之。」文中「其除之」的「之」字所代稱的對象為何？
