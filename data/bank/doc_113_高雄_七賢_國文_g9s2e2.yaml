- id: doc_113_高雄_七賢_國文_g9s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 某戲臺有一副對聯：「此所謂現身說法，且看那善惡貞淫胥教誨；雖然是逢場作戲，難得他嬉笑怒罵皆文章。」這副對聯與下列何者的涵義最接近？（註：胥：皆、都。文章：隱微的涵義。）
  options:
  - label: A
    content: 傀儡登場，須知這臺上衣冠是假；痴人說夢，休認作眼前富貴為真
  - label: B
    content: 君子小人，才子佳人，登場便見；歡天喜地，驚天動地，落幕即空
  - label: C
    content: 假面登場有孝子忠臣，莫輕看過；新腔協律是晨鐘暮鼓，只管聽來
  - label: D
    content: 戲愈好，人愈多，看他抒意表情；曲彌高，和彌寡，聽我長腔短調。
