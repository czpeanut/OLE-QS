- id: doc_113_高雄_七賢_國文_g9s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '子曰：「管仲之器小哉！」或曰：「管仲儉乎？」曰：「管氏有三歸①，官事不攝，焉得儉？」「然則管仲知禮乎？」曰：「邦君樹塞門②，管氏亦樹塞門；邦君為兩君之好，有反坫③，管氏亦有反坫。管氏而知禮，孰不知禮？」

    根據上文孔子對管仲的評價，下列說明何者正確？（註：①三「歸」：處所。②塞門：屏風。③反坫：土築的平臺。互相敬酒後，把空酒杯放還在坫上，為周代諸侯宴會時的一種禮節。）'
  options:
  - label: A
    content: 管仲有三處家宅且僕傭很多，並不儉樸
  - label: B
    content: 管仲接待賓客守禮，仿照國君使用反坫
  - label: C
    content: 管仲使用屏風、反坫是為了讓百姓知禮
  - label: D
    content: 孔子認為管仲是一個器量狹小，但是儉樸的人。
  lesson_raw:
    title: 論語
    basis: 題幹引用《論語·八佾》篇文句
