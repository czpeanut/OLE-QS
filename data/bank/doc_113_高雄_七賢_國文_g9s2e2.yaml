- id: doc_113_高雄_七賢_國文_g9s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 「晏嬰擔任齊國的宰相時，有一天他坐車外出，車夫的太太從門縫中偷看她的丈夫，只見車夫駕車時趾高氣昂。車夫的太太等他回來後，便要求離婚。車夫不知原因為何，妻子說：『晏嬰身高雖然不到六尺，但他身為齊相名聞天下，今天晏嬰坐車時，神情猶似深謀遠慮，可是態度卻令人覺得謙卑有禮。但八尺有餘的你，不過只是駕車的車夫，卻一臉得意洋洋，我覺得很慚愧，不想跟你一起生活了。』車夫聽了之後，便收斂性情。晏嬰察覺後就問車夫發生了什麼事。車夫據實以告，於是晏嬰稱讚他。」根據上文，下列何者不能用來說明晏嬰的行事態度？
  options:
  - label: A
    content: 少思其長則務學
  - label: B
    content: 仁義在身而色無伐
  - label: C
    content: 盛滿易為災，謙沖恆受福
  - label: D
    content: 不傲才以驕人，不以寵而作威。
  tags:
