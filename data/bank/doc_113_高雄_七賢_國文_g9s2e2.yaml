  stem: 假設下圖是寓言中所指的洞穴，則根據寓言的內容，甲、乙、丙三處依序最可能是下列何者？
  options:
  - label: A
    content: 被鍊著的人／營火／舉雕像的人
  - label: B
    content: 被鍊著的人／舉雕像的人／營火
  - label: C
    content: 舉雕像的人／營火／被鍊著的人
  - label: D
    content: 舉雕像的人／被鍊著的人／營火。
  group_stem: "(四)以下是柏拉圖知名的「洞穴寓言」，請閱讀並回答下列問題：\n  有個洞穴中有一群人，他們的身子被鍊著，無法轉向，只能面向洞穴的內壁。他們無法看見身旁每一個人，亦無法看見身後的洞口。洞穴裡唯一的光源是一堆營火。有一道遮蔽物擋在這群人與營火之間，遮蔽物後有人高舉著人類和動物雕像來來往往。那些被鍊著的人看不見雕像，只能在內壁看到遮蔽物後雕像的影子，且這些黑影配合洞穴裡的回音舞動。對那些被鍊著的人來說，這些影子是真實的事物。他們無事可做，只能談論這些影子。\n\
    \  如果被鍊著的人中有一人被釋放，得以起身走出洞穴。陽光會讓這個人感到極大的痛苦，因為他只習慣於黑暗。等他習慣了光線，看見遮蔽物後真正發生的事情，他就能發現真相，得到啟蒙。\n\
    \  當這個人再回到洞內，試著告訴其他人外界的真相，其他人卻很可能無法理解並認為這個人是瘋狂的。就算這個人將他們釋放，想拉他們走出洞穴，他們依然只願相信內壁上的影子才是真實，甚至可能將這個人殺死。"
