  section: 1
  number: 3
  type: single
  page: 1
  stem: 偉辰在做自然研究時，覺得人類從感官經驗獲得的結論不一定是正確的，反而從基礎概念出發，並透過論證推理，才有可能得到一個可靠的結論。有關偉辰做研究時使用的科學方法，下列敘述何者錯誤？
  options:
  - label: A
    content: 這個科學方法出現的時代背景最有可能是在科學革命時期
  - label: B
    content: 這個科學方法認為做研究時應由通則出發，並透過嚴密的分析，對個別事實進行研判
  - label: C
    content: 這項知識的普及及應用，使科學研究獲得重大進展
  - label: D
    content: 這是英國人培根提出的歸納法。
  tags:
