  page: 1
  stem: 不管是體壇或音樂界，黑人總是占有一席之地，他們與生俱來的運動與音樂天賦，令人嘆為觀止。然而，在世界歷史中，他們的祖先曾有悲慘的遭遇。請問：這一段不幸的歷史是指下列何事？
