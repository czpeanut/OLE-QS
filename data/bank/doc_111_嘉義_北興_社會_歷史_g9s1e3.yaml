  section: 1
  number: 2
  type: single
  page: 1
  stem: 著名的思想家馬克思曾經如此形容印度：「他們被一個又一個入侵者侵略，他們就在這樣一無抵抗、二無變化下的消極基礎上生活著」。請問，下列關於十六世紀後印度的發展，何者敘述錯誤？
  options:
  - label: A
    content: 蒙古人的後裔建立蒙兀兒帝國，長期統治著印度
  - label: B
    content: 十九世紀時，英人協助印度脫離蒙兀兒帝國並助其獨立
  - label: C
    content: 英屬東印度公司趁蒙兀兒帝國衰微時，介入印度政治
  - label: D
    content: 十八世紀中期，英國擴張在印度的勢力。
