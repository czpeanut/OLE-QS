- id: doc_113_新北_江翠_數學_g9s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '如圖(一)，$\triangle ABC$ 中，已知 $\overline{BD}$、$\overline{CE}$ 分別為 $\overline{AC}$、$\overline{AB}$
    上的高，且 $\overline{BD}=\overline{CE}$。

    以下為小翠證明 $\triangle ABC$ 為等腰三角形的過程：

    在 $\triangle AEC$ 和 $\triangle ADB$ 中，

    ∵ $\begin{cases} \angle A = \angle A \text{ (共用角)} \\ \angle 1 = \underline{\quad\quad}
    (\overline{CE}、\overline{BD}\text{ 為高)} \\ \overline{CE} = \underline{\quad\quad}
    \text{ (已知)} \end{cases}$

    ∴ $\triangle AEC \cong \triangle ADB$ ($\underline{\quad\quad}$ 全等性質)，得 $\overline{AC}=\overline{AB}$
    (對應邊相等)，故 $\triangle ABC$ 為等腰三角形。

    試問空格依序應填入下列哪一個選項？（3-1 習）'
  options:
  - label: A
    content: $\angle 2$，$\overline{BD}$，AAS
  - label: B
    content: $\angle 2$，$\overline{BD}$，ASA
  - label: C
    content: $\angle 2$，$\overline{BC}$，AAS
  - label: D
    content: $\angle 2$，$\overline{BC}$，ASA
