  stem: '思綺在與球場打球後感到肚子餓，便帶著身上僅有的80 元，到附近的黃昏市場購買晚餐，而晚餐的選擇眾多，價格亦不同，最後她依對晚餐的喜好順序，並依此做出選擇，請問思綺此時購買晚餐的機會成本為何？


