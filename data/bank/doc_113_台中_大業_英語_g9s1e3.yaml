  group_stem: 'Gloria and Carlos like to travel around the world. This year, they
    chose to travel to Africa. The following is Gloria’s travel diary on her Instagram.


    Day1 Arriving in Namibia was an adventure in itself. After landing in Windhoek,
    I was greeted and taken to my place. Flying from summer in the Northern Hemisphere
    to winter in the Southern Hemisphere felt like stepping into a new world. Crossing
    the equator was exciting, and when we landed, the cool air and clear skies reminded
    me I was ready for the adventure ahead.

    Day2-3 We hit the road early, heading north to Etosha National Park, excited for
    the wildlife. We spent two days here driving in the national park, seeing animals
    like lions, elephants, and giraffes. Though we can see the animals in the zoo,
    seeing them in their natural habitat is far more exciting.

    Day5 We visited the Twyfelfontein rock engravings. These engravings, made over
    6,000 years ago, are pictures of animals and people that are carved into the rocks.
    They are one of the largest groups of rock art in Africa and help us learn about
    the past.

    Day6 Before reaching the big city of Swakopmund, we stopped at the Cape Cross
    Seal Colony, where you can see tens of thousands of seals resting by the ocean.
    The seals get together in large groups, making noise and giving off a strong smell.
    Though this was a special experience, I have to say it wasn''t the most pleasant.
    But that’s okay, this is a part of traveling!

    Day10 In Swakopmund, I joined several tours, including riding bikes through the
    desert, taking a boat trip on the Atlantic Ocean, and seeing seabirds. The tour
    I enjoyed most was seeing one of Namibia''s most famous sights—the place where
    the ocean meets the desert.

    Day11 We traveled south into the desert, climbing up the dunes and experiencing
    the breathtaking starry sky with no light pollution. It was a magical sight to
    see the sky full of stars.

    Day12 The morning was spent at Kolmanskop, a ghost town being taken over by the
    desert! It was once the richest town in the world, but now walking through its
    sand-filled buildings is really a moving experience.

    Day14 It was time for the long drive back to Windhoek. By late afternoon, we arrived
    in the city, bringing this unforgettable journey to an end.

     adventure 冒險、hemisphere(地球的)半球、remind 提醒、wildlife 野生動物、natural habitat 棲息地 engraving
    雕刻、carve 雕刻、seal 海豹、ocean 海洋、desert 沙漠、pollution 污染、dune 沙丘'
