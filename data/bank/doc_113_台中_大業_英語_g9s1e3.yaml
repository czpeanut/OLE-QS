- id: doc_113_台中_大業_英語_g9s1e3_s2_44
  section: 2
  number: 44
  type: single
  page: 8
  stem: 'The following is Zoe’s note of this reading, which may be the correct order?
     order 次序


    a. how the guide works b. Michelin stars in Taiwan

    c. food culture in France d. origins of the Michelin Guide'
  options:
  - label: A
    content: a→b→c→d
  - label: B
    content: c→d→b→a
  - label: C
    content: b→a→d→c
  - label: D
    content: c→d→a→b
  group_stem: 'Food is a big part of French culture. It is said that French people
    live to eat, and the rest of the world eats to live. That''s why the most famous
    food guide in the world, the Michelin Guide, is from France.

    Michelin is a tire company which the Michelin brothers started in 1889. At that
    time, not many people owned a car in France. To sell more tires, the Michelin
    brothers thought of an idea. Because French people loved food so much, the brothers
    decided to write a book that showed all the good restaurants in different cities.
    And that''s how the Michelin Guide was born. This way, people would drive more
    to try the food, and Michelin could sell more tires.

    To decide if a restaurant is good or not, the Michelin Guide has a team of inspectors.
    They''re always anonymous, so when they go to restaurants to taste the food, they
    won''t be treated differently. For each dining experience, the inspectors will
    write a report on their experiences and decide whether the restaurants should
    get a Michelin star. If a restaurant is excellent, the guide may give it one to
    three stars, and it''ll be put in the guide. However, getting even one star is
    not easy. That''s why it''s a great honor to be on the list.

    The Michelin Guide began in France but is now famous all around the world. Today,
    it lists restaurants in Europe, Asia, and the Americas, showing the different
    types and high quality of food around the world. In 2019, Taiwan became well-known
    when 24 of its restaurants got Michelin stars. Taiwan is now known as a great
    place for food, with everything from street snacks to fine dining restaurants
    that amazes both locals and visitors.

     rest 其餘、guide 指南、tire 輪胎、inspector 調查員、anonymous 匿名的、honor 榮譽、quality 品質、local
    在地人'
