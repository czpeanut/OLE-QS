  - label: D
    content: The melting sea ice causes big problems for polar bears but not for penguins
      because penguins can swim deep into the water to find food.
  group_stem: 'Polar bears and penguins are famous animals that live in very cold
    places. Even though they both live where it’s icy, they are very different and
    live on opposite sides of the Earth.

    Where They Live

    Polar bears are found in the Arctic, at North Pole, an area which is known for
    its ice and snow in the northern half of the Earth. They spend much of their time
    on sea ice, hunting seals, which are their main source of food. Penguins, on the
    other hand, live in the southern half of the Earth, especially Antarctica. They
    live near the ocean, where they eat fish and small sea animals.

    How They Look

    Polar bears are big, with white fur that helps them hide in the snow. Their white
    fur plays a very important part as a camouflage. They have strong legs to swim.
    Penguins are birds, although they cannot fly. They are smaller than polar bears,
    with black and white feathers that act as camouflage in the water. They cannot
    fly but their special wings make them good swimmers.

    How They Live

    Polar bears have thick fur and fat to stay warm. They live alone and use their
    nose to find food. Penguins have lots of feathers and fat to keep warm. They stay
    in large groups to help each other stay safe and warm.

    What They Eat

    Polar bears eat meat, mostly seals. They swim well but do not go too deep under
    the water. Penguins eat fish and other small sea animals. They are great at swimming
    into the deep water to find food.

    Big Problems

    Both polar bears and penguins have problems because the ice where they live is
    melting. Polar bears stand on sea ice to hunt for food. And this also makes it
    hard for penguins to find safe places to live.

    Size

    Polar bears are the largest bears; the largest polar bears can be about 3 meters
    long when standing on their back legs and weigh up to 700 kilograms. Emperor penguins,
    the largest penguins, are about 1.2 meters tall and weigh around 30 kilograms.

     opposite 另一邊的、fur（動物的）毛、seal 海豹、feather 羽毛、wing 翅膀、melt 融化'
