    New York City very special. One thing visitors notice is how fast people walk
    and talk. New Yorkers are always   36.  . They move quickly to catch the subway,
    get to work or buy a slice of pizza.

    New Yorkers love their pizza slices, and they like to fold the slices   37.   when
    they eat them. Another favorite food is the bagel, which is often eaten for breakfast
    with cream cheese. New York bagels are some of the best in the world. Why? Because
    the New York   38.   is just right for making them. New York hot dogs are a favorite
    snack for New Yorkers. You can find vendors on many street corners. People buy
    one and eat it   39.  !

    New Yorkers love their city because there are lots of   40.   things, such as
    tall buildings and bright lights. There is always something going on in New York.
    New Yorkers are also proud of their famous places like the Statue of Liberty,
    Central Park and the Empire State Building. New York City is crowded and busy,
    but many New Yorkers are ready to help their neighbors. This makes New York City
    a special place.'
