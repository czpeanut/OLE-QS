  stem: What did Iris Apfel love to do with her clothes?  designer 設計師 simple 簡單的
  options:
  - label: A
    content: Mixing different kinds of clothes together.
  - label: B
    content: Wearing clothes only made by famous designers.
  - label: C
    content: Choosing clothes of the same color.
  - label: D
    content: Wearing clothes in a simple way.
  group_stem: 'A Fashion Star Who Loved to Be Different


    Iris Apfel was a famous fashion star who loved to wear bold clothes and have fun.
    She died on March 1st, 2024, but people will always remember her special style.
    Iris showed us that it''s okay to be different and that clothes can be a way to
    express ourselves.

    Iris was born on August 29, 1921, in New York City. She always loved fashion and
    art. She went to art school and met her husband, Carl, who also loved fashion.
    They worked together and shared their love for beautiful things.

    Iris was known for her big glasses, colorful jewelry, and clothes that were a
    mix of different styles. She didn''t care about what was "in" or "out of” fashion.
    She just wore what she loved and made it look amazing! She showed everyone that
    you can be stylish at any age and that being confident is the most important thing.

    One of Iris''s favorite sayings was, "More is more, and less is a bore." She loved
    to wear lots of colors, textures, and patterns. She would mix old clothes with
    new clothes and make them look great. She inspired people to be creative with
    their own style. Iris was also very smart and funny. She said, "If you''re not
    interested, you''re not interesting." She loved to learn new things and travel
    to different places. She was always curious and open to new experiences.

    Another thing Iris said was, "You''ve only got one trip, you have to remember
    that." She meant that life is short and we should make the most of it. She lived
    life to the fullest and encouraged everyone to be brave and try new things. Iris
    wanted everyone to feel good about themselves and their style. She believed that
    fashion is for everyone, no matter how old you are or what you look like. She
    showed the world that being different is something to celebrate.

    When we think of Iris Apfel, we remember her amazing style, her funny personality,
    and her love for life. She taught us that being true to ourselves is the most
    important thing. She said, "I think if you have a little talent and a lot of enthusiasm,
    anything is possible." And she was right!


