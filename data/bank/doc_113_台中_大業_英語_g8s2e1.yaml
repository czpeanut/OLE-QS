  group_stem: '莎拉上週去百貨公司買新衣服。她需要一條牛仔褲。她看著貨架上的產品，發現有許多不同的款式：緊身、直筒和休閒款的牛仔褲。莎拉最喜歡緊身的牛仔褲。她挑選了一條中等尺寸的牛仔褲，然後走進試衣間穿上。褲子有點緊，所以她決定試試大一點的尺寸。大尺寸的牛仔褲穿起來很合適，也很好看。她對自己的選擇感到很高興。她買下了這條牛仔褲，離開商店，興奮地準備第二天穿上它們。

    Sarah went to the department store to buy new clothes last week. She needed a
    pair of   56.   . She looked at the products on the shelves. There were many different   57.  :
    skinny, straight, and relaxed. Sarah liked the skinny ones the most. She picked
    up a pair in a   58.   size. Then, she went to the   59.   and put them on. They
    were a little tight, so she decided to try the   60.   size. They fit her well
    and looked good on her. She felt happy with her choice. She bought them and left
    the store, excited to wear them the next day'
