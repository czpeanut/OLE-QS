  group_stem: 'Coffee Helps Power London’s Buses

    Get ready to ride a bus powered by your morning coffee! Starting on Monday, some
    London buses run on a special fuel made from used coffee grounds. A company called
    Bio-bean came up with a brilliant idea to turn used coffee grounds into biofuel.
    Instead of just throwing away the mountains of coffee grounds left over from people''s
    daily coffee, they saw a valuable resource.

    Bio-bean collects these used coffee grounds from coffee shops and factories all
    over London. They use special machines to extract the oil from the grounds, which
    is then mixed with diesel to create a biofuel called B20. This biofuel is a cleaner
    choice than regular diesel and helps reduce air pollution.

    Transport for London (TfL) was excited to try this new fuel. They''re always looking
    for ways to make the city''s transportation more environmentally friendly. London
    makes over 200,000 tons of coffee grounds every year, so there''s a lot of fuel
    to use. It takes about two million cups of coffee to make enough fuel to power
    one bus for a year. Bio-bean has already produced thousands of liters of coffee
    fuel.

    Arthur Kay, the founder of Bio-bean, is excited about this new project. He says,
    "It shows us that we can turn waste into something useful. We just need to think
    differently about what we throw away!"


