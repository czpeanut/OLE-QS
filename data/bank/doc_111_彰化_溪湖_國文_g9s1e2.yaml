  type: single
  page: 2
  stem: '依據下列框內資訊，關於斯卡羅族的敘述，最適當的是：


    斯卡羅族居住於海拔三百公尺以下，在清代已接觸較多漢人文化；在臺灣接受日本統治後，即以和平、合作的態度迅速成立國語傳習所。同化的程度越深，自我的認知越淡，族群離散也越快。


    據大正六年調查，斯卡羅族豬朥束社僅八十九戶，連同射麻里社十九戶、龍鑾社二十一戶、貓仔社十多戶，即使加上已經移往他鄉的族人，也不過二一〇戶，約一千人。到了昭和五年至七年臺北帝國大學調查時，只剩五百人左右。'
  options:
  - label: A
    content: 漢人文化對傳統習俗造成強烈衝擊，導致族人避居外地
  - label: B
    content: 低海拔地區的生活條件不良，使族人的向心力日益淡薄
  - label: C
    content: 族人響應日人政策設校學日語，間接導致族群日趨式微
  - label: D
    content: 大正六年，已有逾半戶數移住他鄉，且多遷居豬朥束社
