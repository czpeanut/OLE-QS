    content: 大地的主人。
  group_stem: "「群群的山巒如部部豐厚的卷冊 \n  迤邐復迤邐，連綿復連綿，在時間的長河中 \n  裸其奧義，隱其真髓，於大地之上 \n  我，乃是一個飢餓了很久的，讀者」\
    \ \n  我是常常去讀山的；遠遠的讀其蒼茫，近近的讀其清幽；粗讀其豪放，細讀其深沉。讀青、讀綠、讀和諧、讀靜謐。 \n  我常常去讀那些嶙峋崢嶸的巉岩；讀它們的容顏，讀它們的生活；讀它們的風貌，讀它們的歷史。讀它們是用一種什麼樣子的步子走出了洪荒；讀它們是以一種什麼樣子的姿態去承受億萬年的風風雨雨。然後，我也去讀它們的威武，也去讀它們的溫順。讀它們為什麼會耐得住永恆的寂寞，為什麼耐得住永恆的蹲坐；讀它們為什麼會有那麼好的氣度，可以容忍一些錯綜的根鬚在它們的身邊作蠻橫的盤纏。\
    \ \n（節錄自張騰蛟 讀山）"
