- id: doc_113_高雄_龍華_數學_g8s2e3_s1_25
  section: 1
  number: 25
  type: single
  page: 4
  stem: '義大利數學家費波那契(Leonardo Fibonacci)研究了一個獨特的數列，稱為

    「費波那契數列」(又稱費氏數列)。此數列在自然界赫赫有名，不論生物學、

    物理學，處處都有它的影子。此數列的特性為首項及第二項均為 1，從第三項

    開始，每一項都是前兩項的和，也就是 1、1、2、3、5、8…，如果從費氏數列

    中的第 14 項到第 25 項這 12 個數字中，任意取三個數字做為三角形的邊長，

    則可構成多少種不同的三角形？'
  options:
  - label: A
    content: '0'
  - label: B
    content: '3'
  - label: C
    content: '6'
  - label: D
    content: '9'
