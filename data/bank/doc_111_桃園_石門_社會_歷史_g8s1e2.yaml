- id: doc_111_桃園_石門_社會_歷史_g8s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 歷史課分組報告各朝代的特色，小喬這組負責介紹宋代的歷史和特色，組員們收集資料，最後由小喬負責做總整理。請幫助小喬核對下列哪幾項是正確的觀念，可以寫進報告裡？(甲)北宋首都：臨安，南宋首都：汴京。(乙)宋太祖曾有陳橋兵變、杯酒釋兵權等史事發生。(丙)宋代基本國策為強幹弱枝、文人政治。(丁)北宋曾有名將岳飛抗金的事蹟。(戊)南宋發生靖康之禍，徽、欽二帝遭俘虜北方。(已)宋代常以歲幣來維持和平，解決與外患的衝突。
  options:
  - label: A
    content: 六項
  - label: B
    content: 四項
  - label: C
    content: 三項
  - label: D
    content: 二項。
