  section: 1
  number: 5
  type: single
  page: 1
  stem: 元朝是蒙古人所建立，清朝則是滿洲人所創立，皆是外族入主統治整個中國的時期，然兩者統治的特色不同，造成這兩個朝代的發展有所差異。請根據所學，比較元朝與清朝這兩個朝代的特色，下列敘述何者正確？
  options:
  - label: A
    content: 元朝統治中國的時間較清朝來得長久
  - label: B
    content: 清初的統治手段，採用高壓與懷柔並行
  - label: C
    content: 元、清兩朝皆將種族分為四個等級來統治
  - label: D
    content: 元、清兩朝均實施文字獄，藉此控制漢人思想。
