- id: doc_111_彰化_埤頭_國文_g9s1e1_s3_45
  section: 3
  number: 45
  type: single
  page: 3
  stem: 根據甲、乙兩文推論，漢文帝時各種錢幣的重量依序最可能是下列何者？
  options:
  - label: A
    content: 四銖錢＞吳錢＞鄧通錢
  - label: B
    content: 四銖錢＝鄧通錢＞吳錢
  - label: C
    content: 吳錢＞四銖錢＞鄧通錢
  - label: D
    content: 吳錢＞鄧通錢＝四銖錢。
  group_stem: "請閱讀以下兩篇短文，並回答45～46 題：\n【甲】\n  文帝時，莢錢①益多，輕，乃更鑄四銖錢，上鑄「半兩」字樣，民亦得自鑄錢。故吳王就山鑄錢，富等天子，其後以此叛逆。又有名大夫鄧通者，亦以鑄錢富甲天下。故吳、鄧氏錢布天下，而後乃生鑄錢之禁。\
    \        ―改寫自《史記．平準書》\n【乙】\n  漢文帝時，鄧通得賜蜀銅山，聽得鑄錢，形制文字重量，皆與天子四銖錢同。時吳王亦有銅山鑄錢，故有吳錢，微重，形制文字，與天子錢不異。―改寫自《西京雜記》\n\
    【注釋】①莢錢：西漢初年所鑄銅錢，形如榆莢，故名。"
