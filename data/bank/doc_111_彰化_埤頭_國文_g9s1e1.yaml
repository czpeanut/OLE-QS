- id: doc_111_彰化_埤頭_國文_g9s1e1_s2_24
  section: 2
  number: 24
  type: single
  page: 1
  stem: 秦觀 鵲橋仙：「纖雲弄巧，飛星傳恨，銀漢迢迢暗度。金風玉露一相逢，便勝卻人間無數。  柔情似水，佳期如夢，忍顧鵲橋歸路。兩情若是久長時，又豈在朝朝暮暮。」這闋詞對於感情的看法，與下列何者相似？
  options:
  - label: A
    content: 不在乎天長地久，只在乎曾經擁有
  - label: B
    content: 只要是此情長在，無須要常相廝守
  - label: C
    content: 問世間情是何物，直教人生死相許
  - label: D
    content: 衣帶漸寬終不悔，為伊消得人憔悴。
