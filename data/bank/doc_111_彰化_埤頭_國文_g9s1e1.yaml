- id: doc_111_彰化_埤頭_國文_g9s1e1_s3_47
  section: 3
  number: 47
  type: single
  page: 3
  stem: 根據本文，下列何者屬於想像之筆？
  options:
  - label: A
    content: 危峰峭壁，紫翠錯落
  - label: B
    content: 花樹奇石茂林，蔚潤秀發
  - label: C
    content: 造物主匠心獨運撰出來的文章
  - label: D
    content: 我們遊黃山一半是受了雲海的吸引。
  group_stem: "請閱讀以下兩篇短文，並回答47～48 題：\n\n黃山是安徽省的大山，也可說是全中國罕有的一處風景幽勝之境。相傳我們的民族始祖黃帝 軒轅氏與容成子、浮丘公曾在此山修真養性並煉製以丹，這座山名爲黃山，是紀念黃帝的緣故。\n\
    \  民國二十五年夏，我約中學時代同學周蓮溪、陳默君共作黃山消夏之舉，遂得暢遊此山，並在山中住了半個月光景。於今事隔二十餘年，我也曾飽覽瑞士湖山之勝，義大利\
    \ 阿爾卑斯峰巒林壑之奇，法 西兩境庇倫牛司之險，但黃山的雲煙卻時時飄入我的夢境。我覺得黃山確實太美了，前人曾說黃山的一峰便足抵五嶽中之一嶽，這話或稍失之誇誕，但它欲把天下名山勝境濃縮爲一，五步一樓，十步一閣，盤旋曲折，愈入愈奇，好像造物主匠心獨運撰出來的文章，不由你不拍案叫絕。\n\
    \  黃山以雲海著稱，所以又名黃海。山前部分名「前海」，山後部分名「後海」，我們是由前海上去的。一路危峰峭壁，紫翠錯落，花樹奇石茂林，蔚潤秀發，已教人目不暇給。再過去，地勢陡然高了起來，有地名「雲巢」，又名「天梯」，不能乘轎，要攀援才能上。我們遊黃山一半是受了雲海的吸引，雲海並非日日有，見不見全憑運氣。那天在始亯峰頂，卻目擊到雲海的奇觀，可謂山靈對我們特别的優待了。\n\
    \  不過雲海有幾種：一種是白霧濛濛，漫成一片，那未免太薄相；一種是銀色雲，像一床兜羅棉被帄鋪空間，說是海亦未嘗不可，只是沒有起伒的波瀾，沒有深淺的褶紋，又未免太單調。那天我們在始亯峰頭所見，才是名實相符的雲海了。那海鋪成後，一望無際，受了風的鼓蕩，洪波萬疊，滾滾翻動，受了陽光的灼射，又閃躍藍紫光華，看去恍惚有吞天浴日的氣派，有海市蜃樓的變幻，有鯨呿鰲擲（鯨魚張口，海龜騰躍）的雄奇，誰說這不是真的大海？這和我赴歐途中所見太帄、印度、大西洋的形貌有何分别？我們只知畫家會模仿自然，誰知大自然也是位丹青妙手，高興時也會揮灑大筆，把大海的異景在高山中重現出來，供作欣賞哩！\n\
    \                            （蘇雪林 黃海遊蹤）"
