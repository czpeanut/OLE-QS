  - label: D
    content: 接待中心與美術館有一段距離。
  group_stem: "請閱讀以下短文，並回答43～44 題：\n  日本 美秀美術館（Miho Museum）有一種奇特的「烏托邦式美學」，首先是載客的白色電動車安靜地穿梭接待中心與美術館間，有如過去科幻電影中，關於未來烏托邦世界的描述。\n\
    \  白色電動車象徵著美秀美術館對於美學近乎潔癖的要求，電動車安靜地運作，不會干擾到青山綠水間的蟲鳴鳥叫，使得這座烏托邦式的美術館區，永遠呈現出一種寧靜的氛圍。更有趣的是，白色電動車的駕駛穿著白色制服，臉上表情肅穆，不禁令人懷疑這些駕駛是否為科幻片中的複製人或機械人？\n\
    \  不過我們不得不佩服美秀美術館的周到服務：雨天下電動車時，館方提供踏腳墊，以及擦去雨滴的白抹布。即便是貴婦人，仍然可以輕鬆地在美術館中喝下午茶。然後乾乾淨淨，一塵不染地離去。\n\
    \  當遊客在雨天蒞臨，美術館人員便會送來一整排赭紅色、印著MIHO 字樣的雨傘，並要求大家將自己的傘留在車上。其用意是不希望旅客花花綠綠的雨傘，破壞了烏托邦視覺上的統一美感。\n\
    \     ―改寫自李清志〈烏托邦美術館：美秀美術館〉"
