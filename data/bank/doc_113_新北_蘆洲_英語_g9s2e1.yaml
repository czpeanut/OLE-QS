  - label: D
    content: Humor grows with the number of new friends you make.
  group_stem: "(IV)\n    Having a sense of humor is so important to us humans that\
    \ we can already understand it when we’re\n just babies. Humor allows us to laugh,\
    \ and laughing helps build relationships and brings people together.\n　　A sense\
    \ of humor can bring joy, help us be smarter or healthier, and deal with difficult\
    \ problems. It can \nalso help us look at things wisely and even think outside\
    \ the box. It can teach us not to take things so \nseriously. It can also teach\
    \ us to laugh at ourselves. People who laugh a lot are not sad or sick very often.\
    \ \nWhen the mind is healthy, so is the body.\n    Children who have a sense of\
    \ humor seem happier. Those who can appreciate and share humor are \nalso often\
    \ more sociable and usually have more friends. But most of all, humor can make\
    \ life really fun. \n    A sense of humor is not something we’re born with, though.\
    \ It is something that we learn and grows with \nus. It also changes when we get\
    \ older. Things that we find funny as kids become too childish to \nmake us laugh\
    \ when we’re grown up. Babies, for example, don’t really understand humor yet.\
    \ They\n just laugh when something we do is funny to them. As children get older,\
    \ they turn to physical humor \nand do funny things to make either themselves\
    \ or others laugh.\n    Having a sense of humor is an important part of growing\
    \ up, and it should be encouraged. Parents should \nshow their kids early on that\
    \ laughing is fun and that it should be done a lot. \n    Make lots of jokes and\
    \ tell funny stories. A family that laughs together has lots of fun together!\n\
    \ relationship 人際關係  appreciate 欣賞  childish 幼稚的  physical 肢體的   encourage 鼓勵"
