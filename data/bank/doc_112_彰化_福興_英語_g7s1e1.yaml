- id: doc_112_彰化_福興_英語_g7s1e1_s4_1
  section: 4
  number: 1
  type: single
  page: 2
  stem: What does a tiger do at night?
  options:
  - label: A
    content: sleep
  - label: B
    content: jump into the water
  - label: C
    content: hunt
  - label: D
    content: swim
  group_stem: 'Do you like cats? How about big cats. A tiger is a cat. It is a really
    big cat and lives in the wild. A tiger is the biggest of all the cats.

    Most house cats do not like water, but tigers like water. When a tiger is hot,
    it will jump into the water.

    A tiger is a good swimmer. A tiger has a coat of fur on its body, just like a
    house cat. A tiger''s coat has stripes on it. The stripes help the tiger hide
    from other animals. The tiger hides in the grass or by trees when it is hunting
    for food.

    At night, a tiger hunts big animals like deer and wild pigs. Sometimes you will
    see a house cat hunt small bugs, a mouse, or even its toys. They like to hunt
    just like tigers hunt for food.'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
