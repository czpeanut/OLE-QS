  stem: 在室內空間設計中，設計者為了能清楚表達室內空間配置，常繪製平面設計圖。這種空照的概念，讓想買房子的人，可以馬上知道這間房子裡面的客廳、廚房、衛浴的位置及大小。也因為平面設計圖需要精準表達空間大小，因此圖上的比例尺是不可或缺的元素。圖(二)是高雄某知名建設公司的平面設計圖，圖中的為門，為窗，請問：「西晒」指的是房屋門窗開口朝向西邊，會造成太陽長時間照射的一種現象，容易造成屋內家具老化。依照設計圖所示，下列哪一個居家空間最容易受到西晒而須做好隔熱防護？
