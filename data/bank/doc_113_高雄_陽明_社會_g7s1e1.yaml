  stem: 早期臺灣社會常會有溝通不良時，就罵人是「生番」的情況，這是因為臺灣某時期統治者將原住民區分為「生番」與「熟番」。熟番通常是指跟漢人居住較近，逐漸受到漢人文化影響，且會納稅、服勞役；而生蕃是指不願意接受漢文化教育的原住民部落，也因為不接受漢人文化，所以漢人與生番常會有難以溝通的情況，這也讓「生蕃」一詞有了負面色彩。請問上述的統治者是指？
