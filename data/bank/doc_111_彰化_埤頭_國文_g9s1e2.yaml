- id: doc_111_彰化_埤頭_國文_g9s1e2_s2_25
  section: 2
  number: 25
  type: single
  page: 1
  stem: 「過去一個世紀中，醫學和農業的進展加在一起，對人類造成了巨大的影響：人口從不到二十億人增加到超過七十億人。人類花了二十萬年，才在１８４０年成長到十億人，現在每十二到十四年，就會多出十億人。在１９００年，美國男性與女性的預期壽命分別約為四十六歲和四十八歲。現在於公元２０００年出生的男性與女性，預期壽命分別為七十四歲和八十歲。與自然的變化相較，這種壽命在短時間中增加超過五成的現象，讓人目瞪口呆。」（西恩．卡羅爾
    生命的法則：在賽倫蓋蒂草原，看見大自然如何運作．前言）根據以上文字敘述，何者推論正確？
  options:
  - label: A
    content: 人類的數量不斷增加，主因是以農業的進展為主，改善了糧食問題
  - label: B
    content: 下一次人口若增多十億，就要花二十萬年的時間，與自然法則相近
  - label: C
    content: 壽命在短時間快速增加的現象發生，主要仍仰賴醫學和農業的發展
  - label: D
    content: 人類花了十二到十四年，終於能將每人的平均壽命增加三十歲以上。
