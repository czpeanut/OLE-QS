  group_stem: "(四)\n田饒謂魯哀公曰：「臣將去君而鴻鵠舉矣。」哀公曰：「何謂也？」田饒曰：「君獨不見夫雞乎？頭戴冠者，文（1）也；足傅距（2）者，武也；敵在前敢鬥者，勇也；見食相呼，仁也；守夜不失時，信也。雞雖有此五者，君猶曰瀹（3）而食之。何則？以其所從來近也。夫鴻鵠一舉千里，止君園池，食君魚鱉，啄君菽粟，無此五者，君猶貴之，以其所從來遠也。臣請鴻鵠舉矣。」\n\
