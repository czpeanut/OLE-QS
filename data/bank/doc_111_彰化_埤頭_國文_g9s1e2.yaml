  group_stem: "(一)\n    濃霧持續籠罩著基地營，我們所屬的國際聯攀隊把營地設立在基地營的最南側，那座山矗立在地圖的北方，我們得先邁過狹長的冰磧石地基，穿過一座一座村子似的鄰隊聚落，才會抵達雪原的起點。那裡是路跡隱沒之處，再過去尌是荒蠻統治的國度。\n\
    \  三人佇立在岩與冰的交界，忽然一陣強風從雪坡後方吹來，把濃郁的霧氣從視線裡撥開，眼前浮現出一張晶瑩透亮的雪毯，開展到一望無際的遠方。雪面在陽光照射下漾出柔和的光暈，我們尌像即將走入一張白色畫布，小心翼翼跨出腳步。\n\
    \  比較高的背影是元植，他穿天藍色夾克、灰褲子，背著一個特殊材質的白色背包。比較壯碩的背影是阿果，他穿灰底鑲黃邊的羽絨衣，背著一顆磨舊的藍背包。兩人一共外掛了四把冰斧，好像準備進到深處去斬四頭野獸。\n\
    \  三人徒步時隊形通常是元植先鋒，阿果殿後，我在中間，負責專心走路，這是培養了半個月的默契。今天一探入雪原區，他倆一個眼神同時繞到我身前，雙箭頭似的開始找路，鬆軟的雪面遍布著迷惑人的岔路，有迂迴的曲線，繞著冰湖延伸，有起伏的直線，陷落到冰丘前的深溝，我們其實是走在冰河的表層，走在沉默的水上。\n\
    \  每年攀登季開始前，喀喇崑崙山區的冰河並不會顯現這些縱橫交錯的線條，因為冬天的大雪會無情抹除掉所有路徑，讓冰河回復它原始的面容。而目光清澈的攀登者會在夏季初始候鳥般重新集結在這神與靈的疆域，他們的野心與燃燒的渴望，會召喚出那些湮沒的線條，讓它們再次顯影。（改寫自陳德政\
    \ 神在的地方：一個與雪同行的夏天）"
