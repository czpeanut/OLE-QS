  group_stem: '(三)

    一架飛機能在空中飛行，實在是件十分奇妙的事：藉著引擎推動仙飛機產生前進的速度，機翼因而產生升力承托飛機飛行。然而引擎動力和機翼所能產生的升力有限，機師在起飛及降落時必頇注意飛機的性能狀態，以配合機場的天氣與地理環境。如遇上跑道有順風或地面氣溫較高，或機場位於海拔數千呎時，則需要較長的跑道，而飛機的負載量亦要相對減少。以南非
    約翰尼斯堡機場為例，該機場海拔５５００呎（約１６７６公尺），空氣較地面稀薄，引擎所能發出的動力較接近海面高度時稍差；夏季時，地面氣溫可高達攝氏３４度，雖然該機場的跑道有１３０００多呎長，但一架波音７４７—４００型的飛機，即使用上了最大的起飛引擎動力，也只能負載３７０公噸左右的重量，比它的最大負載重量還少了約２０公噸。（改寫自馮志亮〈不同跑道環境的挑戰〉）'
