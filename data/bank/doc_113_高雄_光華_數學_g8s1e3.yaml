- id: doc_113_高雄_光華_數學_g8s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '解一元二次方程式 $(2x+1)(2x-3)=5(2x+1)^{2}$ 的步驟如下：

    第一步：等號兩邊同除以 $(2x+1)$，得 $(2x-3)=5(2x+1)$

    第二步：等號兩邊去括號，得 $2x-3=10x+5$

    第三步：利用移項化簡，得 $x=-1$

    試問哪個步驟開始發生錯誤？'
  options:
  - label: A
    content: 第一步
  - label: B
    content: 第二步
  - label: C
    content: 第三步
  - label: D
    content: 以上步驟都正確
