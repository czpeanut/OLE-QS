  group_stem: "（三）讀完文章，完成第38~40 題\n                                          ㄅ ㄆ ㄇ\
    \ 先 生 (節錄)\n    說起來劉老①真是一位深藏不露的人，跟他在一起，你隨時可以挖到寶，這和他豐富的人生閱歷有關，而豐富的人生閱歷則和他對待生命的態度有關。\n\
    \    劉老是學電機的，早年在公家機關擔任過工程師，也在大學兼課，出版過好幾本有關電機工程方面的專著。四十歲時，在一次觀賞朋友的畫展時，內心突然有一股想畫畫的衝動，因而觸發他在繪畫藝術的潛力，從而造就畫壇一位傑出的水彩畫家。\n\
    \    如果說劉老的畫是靠天分，那是不公平的，很少有人知道他背後的努力。不過，每逢有人當面推崇或讚賞，他就顯得十分不自在，非得用一些「胡言胡語」岔過去，說什麼「我很窮，畫畫是拿來騙錢的……」、「我不懂，隨便畫畫，騙人的……」之類的。\n\
    \    其實，劉老大部分的畫都捐給了公益團體義賣，其中伊甸基金會就前後接受過兩次捐贈。\n    二十五年前，他到越南擔任軍事工程師，竟然又開啟他內心另一扇門――到蠻荒之地探險。行腳②遍及非洲、中南美以及新幾內亞等地。\n\
    \    他不是去觀光，隨便走馬看花，而是和當地原住民實際生活在一起，研究他們的歷史、風俗、文化，做成記錄，寫成論文。這期間雖然拋棄文明生活的物質享受，經歷蠻荒野地諸多危險困難，甚至生命遭受威脅，他也甘之如飴③。\n\
    \    九十歲的老人了，一點也不肯安分，仍然忙著畫畫，為清寒學生奔走募款；忙著成立基金會，為長期推動藝術教育和生態保育而努力……至於他自己呢？他興致勃勃的計畫再有一次蠻荒探險……\n\
    \    對別人而言，劉老是一位畫家、作家、探險家、人類學家、自然生態保育家……可是對他自己來說，他只是一個對生命充滿強烈好奇心，永遠在探索，不停追求，而且永不服老的「老頑童」。\n\
    \    一個人把自己的本行經營的出色不說，猶有餘力涉獵其他，竟然也樣樣精采，斐然成家，這樣的人還真不多見，劉老是其中之一。\n註①劉老：劉其偉（1912~2002\
    \ 年），臺灣知名畫家兼人類學家，有畫壇老頑童之稱。②行腳：行蹤所到的地方。③甘之如飴：比喻樂意承擔艱苦的事情，或處於困境卻能甘心安受。\n       \
    \                                             （選自杏林子美麗人生的22 種寶典）"
