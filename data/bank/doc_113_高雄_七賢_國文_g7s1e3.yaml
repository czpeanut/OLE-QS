- id: doc_113_高雄_七賢_國文_g7s1e3_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: "春秋時，楚國的伯牙善於彈琴，每回彈琴時，好友鍾子期都能聽出他琴音裡想要表達的心意。\n    有一回，伯牙在彈琴時，想在琴音中展現的是高山的壯闊，鍾子期聽後說：「彈得真好！像泰山般高聳。」又有一次，伯牙想表達盛大的流水，鍾子期就說：「嗯！這琴聲有如江河般壯闊。」每次不論彈什麼，鍾子期都能聽出伯牙想藉由琴聲表達的意念，伯牙十分感動。\n\
    \    鍾子期死後，伯牙認為此生再也沒有人能這樣懂他的音樂了，於是將琴摔壞，終生不再彈琴。\n       這則故事，可用下列何者作為註解﹖"
  options:
