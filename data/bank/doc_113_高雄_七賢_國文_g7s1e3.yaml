    \    對別人而言，劉老是一位畫家、作家、探險家、人類學家、自然生態保育家……可是對他自己來說，他只是一個對生命充滿強烈好奇心，永遠在探索，不停追求，而且永不服老的「老頑童」。\n\
    \    一個人把自己的本行經營的出色不說，猶有餘力涉獵其他，竟然也樣樣精采，斐然成家，這樣的人還真不多見，劉老是其中之一。\n註①劉老：劉其偉（1912~2002\
    \ 年），臺灣知名畫家兼人類學家，有畫壇老頑童之稱。②行腳：行蹤所到的地方。③甘之如飴：比喻樂意承擔艱苦的事情，或處於困境卻能甘心安受。\n       \
    \                                             （選自杏林子美麗人生的22 種寶典）"
