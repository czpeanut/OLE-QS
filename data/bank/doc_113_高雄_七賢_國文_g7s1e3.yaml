  stem: 「一年一度的臺北國際書展將於2 月12 日登場。擁有斯洛伐克語言文學博士學位的梁晨是斯洛伐克駐臺代表博塔文的妻子。喜愛翻譯兒童文學的她，一年多前來到臺灣後，隨即著手翻譯臺灣、斯洛伐克的童書，盼促進雙邊兒童文學的交流。梁晨接受中央社記者訪問時，認為過去斯洛伐克駐臺辦事處曾參與臺北國際書展，不過，展出的作品種類比較雜，不同於以往，今年展示的書籍全是斯洛伐克童書，希望藉此讓更多臺灣的小朋友看到斯洛伐克的童書，也讓臺灣出版社有機會了解來自斯洛伐克的兒童文學作品。雖然這些童書都用斯洛伐克語寫成，不過每一本都會附上中文、英文的簡介。」關於這段文字，下列敘述何者不正確﹖
