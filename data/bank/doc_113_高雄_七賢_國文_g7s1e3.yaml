- id: doc_113_高雄_七賢_國文_g7s1e3_s2_36
  section: 2
  number: 36
  type: single
  page: 5
  stem: 「當你把生活『變有趣』後，再困苦的生活也會『變容易』。」下列何者可用來詮釋這句話？
  options:
  - label: A
    content: 研究是開啟學問之金庫的鑰匙
  - label: B
    content: 憤怒是危險的炸藥，將自己粉身碎骨
  - label: C
    content: 越是成功的人，越像稻穗一樣，越飽滿越彎腰
  - label: D
    content: 生活不是在乎如何在暴風雨中生存，而是如何在雨中起舞
  group_stem: "（二）讀完文章，完成第36~37 題\n    在美國堪薩斯市的班騰文法學校，有一天，一個調皮的工讀生在一早送完報紙後，打扮成林肯的模樣──頭上戴著用紙板做的黑色大禮帽，嘴邊黏著從戲服店買來的假鬍子，還圍著一條圍巾\
    \ ──來到了學校。\n    同學們都好奇地看著他，校長也發現了。校長問他：「這位同學，你為什麼打扮成這樣？」他回答：「今天是林肯的生日，我要背誦他在蓋茨堡的演講。」然後他到教室裡表演得唯妙唯肖，同學們都拍手叫好。校長一時興趣，就帶著他到每一班去「巡迴」演出，他也因此而樂不可支。\n\
    \    後來，他又和一位同學在學校的才藝表演中演出〈攝影藝廊內的趣事〉短劇：用一台特殊的照相機幫同學拍照，在按下快門時，照相機忽然噴出水來，將毫未提防的同學噴得一身濕，然後由他從照相機裡抽出一張那位受害同學的「寫真」──他事先畫好，藏在照相機裡的漫畫圖像。這個幽默而又極具創意的短劇當然也是贏得滿堂彩。他甚至和這位同學偷偷到堪薩斯市的「業餘者之夜」比賽裡演出短劇和喜劇。\n\
    \    他名叫華德．迪士尼，就是後來創辦迪士尼公司及迪士尼樂園的那個人。雖然他後來說：「一切都從一隻老鼠開始」(二十多歲時，因一隻老鼠給他靈感，而畫出了《米老鼠》卡通)，但在中學時，他已表現出這方面的才華，〈攝影藝廊內的趣事〉短劇即包含了他後來事業的三個基本元素：\
    \ 演藝、喜劇與漫畫。\n    他的假扮成林肯發表演說也許只是好玩，而校長柯亭漢對他的欣賞與鼓勵則讓他銘感五內；畢業多年後，他還每年寄耶誕卡給校長。一九三八年，他更邀請還在當校長的柯亭漢及母校所有學生免費觀賞他出品的《白雪公主與七矮人》卡通電影。\n\
    \    華德．迪士尼說：「只要你好奇，你就會發現有一大堆有趣的事可做。」少年時代的他為了生活，經常在凌晨三點半就要起床，挨家挨戶去送報紙，但他卻不以為苦，因為他用他的好奇心找到很多有趣的事，並在後來把歡樂帶給所有世人。\n\
    \    當你把生活「變有趣」後，再困苦的生活也會「變容易」。\n                                            \
    \                                             （王溢嘉青春第二課）"
