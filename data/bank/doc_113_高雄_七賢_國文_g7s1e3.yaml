- id: doc_113_高雄_七賢_國文_g7s1e3_s2_41
  section: 2
  number: 41
  type: single
  page: 6
  stem: 若要為上述段落訂一個標題，下列標題何者最適切？
  options:
  - label: A
    content: 禮教的承載──投壺
  - label: B
    content: 從民間到皇宮──投壺
  - label: C
    content: 投壺活動的興盛軌跡
  - label: D
    content: 投壺的精神與玩法介紹
  group_stem: "（四）讀完文章，完成第41~42 題\n     \n   「投壺」是把箭投入壺中的一項傳統活動，是中國古代六藝之一──射禮及射藝的延伸。兩者在形態、意趣、方法、規則等方面有諸多相似之處，如：立德正己、君子之爭、反求諸己等禮儀，但又具備獨特價值，可說是一種以矢代箭、以壺代侯的小型的射禮，是一種「筵席邊的射禮」。\n\
    \    兩千多年前已有文字記載「投壺」這項活動，主要流行於先秦各國君主、諸侯及士大夫等上流階層。士大夫喜以射禮於宴會上娛賓，但庭院較小，或賓客不諳箭術，故以手代弓，輪流將箭投入銅壺中代替射禮。至秦漢時期，投壺活動仍受禮教約束，投壺前，主客間要請讓、客套三次才開始，體現以禮數為旨，而非娛樂競技。\n\
    \    秦漢以後，投壺始普及於民間，逐漸演變為酒席宴會上的餘興節目，更發展出多樣花式；雖以禮教化的意味漸弱，但仍被視為雅緻的活動。至宋代大儒司馬光著《投壺新格》，重新將投壺的規則和花式以古禮規範起來，剔除一些「投機取巧」的花式，再次將投壺提昇為士大夫間之雅緻禮儀。中間幾經盛衰，至民國初年仍保有投壺的各種玩法。\n\
    \                                               （改寫自網頁資料，投壺，https://www.pnlnewsports.org/touhu）"
