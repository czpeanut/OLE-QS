  group_stem: "（一）讀完文章，完成第33~35 題\n                                          沈復初嘗蝦鹵瓜\
    \ \n    芸喜食芥鹵腐乳①，又喜食蝦鹵瓜②。此二物余生平所最惡者，因戲之曰：「狗無胃而食糞，蜣螂③團糞而化蟬。卿其狗耶？蟬耶？」芸曰：「腐取其價廉而可粥可飯，幼時食慣；至鹵瓜之味，到此初嘗耳。」余曰：「然則我家係④狗竇⑤耶？」\n\
    芸窘而強解曰：「夫⑥糞，人家皆有之，要在食與不食之別耳。腐不敢強⑦，瓜可扼鼻略嘗。」余笑曰：「卿陷我作狗耶？」\n芸曰：「妾作狗久矣。」以箸強塞余口。余掩鼻咀嚼之，似覺脆美，開鼻再嚼，竟成異味，從此亦喜食。\n\
    註①芥鹵腐乳：臭豆腐。②蝦鹵瓜：以鹹魚店的鹽汁醃製的小黃瓜。③蜣螂：音ㄑㄧㄤ ㄌㄤˊ，昆蟲名。④係：是。⑤竇：音ㄉㄡˋ，孔穴。\n  ⑥夫：音ㄈㄨˊ發語詞，常用於文言文中。⑦強：音ㄑ一ㄤˇ，迫使。\n\
    \                                                                            \
    \      （沈復 浮生六記．□□□□）"
