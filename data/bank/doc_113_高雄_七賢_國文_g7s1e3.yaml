  stem: 依據上文，劉其偉先生除了在專業領域上表現出色，在其他領域亦有亮眼的成就，造就他生命如此精采的原因為何？
  options:
  - label: A
    content: 天資聰穎，能輕鬆優游於不同領域
  - label: B
    content: 好奇看待生活萬物，勇於探索生命
