  section: 1
  number: 25
  type: single
  page: 3
  stem: 「在孩提時，生存的本身就是清新的喜悅，所有的事物都閃爍著新奇的魅力。早年對外在世界的直觀知識既有深度也很強烈，足能解釋為什麼童年時期的經驗，會在我們記憶中留下深刻的印象。我們在年輕的時候完全浸潤在周圍的環境中，沒有其他東西把我們的注意力拉開。我們把四周的事物，看作該類別中僅有的，好像其他東西都不存在似的。等到後來我們發現整個世界萬物競秀，這一初始的心境漸次消失，跟著消失的是我們的勇氣和耐心。」根據這段文字，下列何者最符合作者的觀點？
  options:
  - label: A
    content: 遺忘童年必須有勇氣和耐心
  - label: B
    content: 孩提的喜悅，是一種不切實際的存在
  - label: C
    content: 因為專注，童年的回憶反而清晰
  - label: D
    content: 隨著初始心境的消失，童年記憶也將跟著消失
  tags:
    textbook: 七上 第七課 兒時記趣
