- id: doc_113_台中_順天_自然_理化_g8s2e1_s2_31
  section: 2
  number: 31
  type: single
  page: 3
  stem: 根據圖中判斷，從正常狀態到形成「無水氨」，最可能經過下列何種過程？
  options:
  - label: A
    content: 吸熱蒸發水氣
  - label: B
    content: 氣體變液體放熱
  - label: C
    content: 將氣體氨濃縮成液態氨
  - label: D
    content: 吸熱的化學變化
  group_stem: '2. 請閱讀文章後，回答下列問題：

    美國德州一家化學肥料工廠發生大爆炸，疑似因為原料「無水氨」儲存不當而造成。如圖新聞畫面所示，「無水氨」在此處指的是液態的氨氣，硝酸銨在農業上主要作為高氮肥料使用，工業化生產涉及氨與硝酸的酸鹼反應：

    $HNO_{3}+NH_{3}\rightarrow NH_{4}NO_{3}$

    「無水氨」在高溫環境下突然汽化而產生高壓，或是遇到含硝酸根離子 $NO_{3}^{-}$ 的物質，都可能爆炸。

    $4NH_{4}NO_{3}\rightarrow 2N_{2}\uparrow +2N_{2}O+8H_{2}O+O_{2}\uparrow$'
