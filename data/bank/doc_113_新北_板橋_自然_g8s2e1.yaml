  group_stem: '新北市瑞芳區的黃金博物園區展出黃鐵礦和黃金兩種礦物，教導民眾分辨愚人金和黃金兩者的差異。黃鐵礦主要成分是二硫化亞鐵（$FeS_{2}$），帶有亮黃色的金屬光澤，很容易使人誤認為是黃金，故有「愚
    人金」之稱。黃鐵礦是提取硫和製備硫酸的主要礦物原料，其內的成分有含量不少的鐵，但是煉鐵多採用赤 鐵礦為原料，因為黃鐵礦在燃燒時，會產生大量的二氧化硫氣體，造成環境汙染，其反應式為：

