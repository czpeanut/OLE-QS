  stem: 「真金不怕火煉」在字面上的意思是指純正的黃金不怕被火烤。依上述對黃金性質的描述判斷，下列哪一類元素對氧的活性與黃金對氧的活性最接近？
  options:
  - label: A
    content: 鹼金屬放入水中能與水反應而產生氫氣
  - label: B
    content: 鹼土金屬在自然界中，多以氧化物狀態存在
  - label: C
    content: 鉑常常成為大家喜愛的飾品
  - label: D
    content: 煤焦在煉鐵過程中，可使氧化鐵還原成鐵元素。
  group_stem: '真金不怕火煉

    金子的熔點確實不高。但是金的化學穩定性很高，不容易與其他物質發生化學反應，不必擔心會氧化變色。即使是在熔融狀態下也不會氧化變色，但是銅鐵等其他金屬雖然熔點比金高，但化學穩定性就遠不如金子了，常溫下就會氧化，即使沒有達到熔化溫度，在高溫狀態氧化反應的程度就會大大增加。冷卻後肯定變色，去掉氧化物重量肯定不如燒之前了。

