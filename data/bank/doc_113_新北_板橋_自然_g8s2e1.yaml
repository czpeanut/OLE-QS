- id: doc_113_新北_板橋_自然_g8s2e1_s2_35
  section: 2
  number: 35
  type: single
  page: 4
  stem: 「塗層」為在管道表面塗上可防腐蝕的材料，下列何者最不適合作為塗層的材料？
  options:
  - label: A
    content: 銀
  - label: B
    content: 鋅
  - label: C
    content: 鋁
  - label: D
    content: 鎂。
  group_stem: '高壓油氣管道目前採用鋼材製造，無論是埋在地下還是水下鋪設都會面臨腐蝕的問題。腐蝕不僅會浪費金屬原料，還會使輸送的物料流失，汙染環境，甚至引發火災、爆炸、塌毀等災難性事故。

    目前管道的防腐蝕措施為「塗層」和「陰極防蝕(犧牲性保護法)」此兩種方法相互結合，

    「塗層」是指塗敷在金屬表面上使之與周圍介質隔離，以控制管道腐蝕的一種覆蓋層。具有優良的化學穩定性和耐腐蝕性，能耐化學品腐蝕，廣泛應用於各種需要抗酸鹼和有機溶劑的狀況。

    「犧牲性保護法」的原理是將管道與活性較大的金屬以銅線連接，利用活性較大的金屬容易失去電子，使得被保護金屬不容易失去電子，而達到減緩腐蝕之目的。'
