- id: doc_113_新北_板橋_自然_g8s2e1_s2_33
  section: 2
  number: 33
  type: single
  page: 3
  stem: 漂白粉成分中的次氯酸鈣,在漂白過程中有何功能?
  options:
  - label: A
    content: 塑化劑
  - label: B
    content: 催化劑
  - label: C
    content: 還原劑
  - label: D
    content: 氧化劑。
  group_stem: '家中漂白劑的原理是化學物品透過氧化還原反應改變汙垢的成分結構，達到漂白衣物、消除汙漬和殺菌消毒的功用。常用漂白劑分為氧化型和還原型兩大類，而氧化型漂白劑又可分為氯系漂白劑和氧系漂白劑兩類。

    氯系漂白劑的主要成分為次氯酸鈉(NaClO)，為一種黃綠色且具有刺激性臭味的液體，漂白粉的成分則為次氯酸鈣〔$Ca(ClO)_{2}$〕，兩者皆可產生含氯原子的強氧化劑，漂白效果極強，會破壞蛋白質分子，用在花色衣物容易導致全部褪色。氯系漂白劑會造成環境汙染、人體過敏等反應；不能用來清理尿漬，否則會產生有毒的氯氨和會爆炸的三氯化氮；也不能與含有鹽酸的廁所清潔劑混合使用，會產生有毒的氯氣。因此，使用氯系漂白劑時，一定要保持通風良好，並搭配口罩與手套。

    氧系漂白劑的主要成分為過氧化氫（$H_{2}O_{2}$），為無色、無味、無臭的液體，會釋放出含氧原子的氧化劑，漂白效果較溫和，常用在漂白頭髮及花色衣物，又稱為鮮豔漂白水；反應後產生水，對環境與人體的負擔較小。

    試回答第 33～34 題：'
