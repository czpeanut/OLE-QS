- id: doc_113_基隆_銘傳_自然_g9s1e3_s1_24
  section: 1
  number: 24
  type: single
  page: 4
  stem: '如右圖,當高壓電線斷掉觸地時,會以掉落的位置為圓心,改變周圍地表的電位,電位由電線掉落處開始向外遞減,直到一定的距離之外,電位才恢復成與原先的地表一致。右下圖中的曲線就是電位隨位置遞減的示意圖。

    **導體兩端的電壓就是兩端電位的差值。電流會由高電位流向低電位。**

    若小明站立時(雙腳併攏),身體**正後方**附近發生高壓電掉落的情況,小明考慮以下六種方案,那些方案才能**相對安全**的離開地表具有高壓電的區域?

    (甲) 殭屍跳的方式跳離(雙腳保持併攏向前跳,過程中沒有跌倒)

    (乙) 小碎步向前行,鞋子前緣之間的距離差極小(步幅很小)

    (丙) 大跨步快速離去,步幅(步伐距離)越大越好

    (丁) 超慢跑的型式大步離開,越慢越安全

    (戊) 學小寶寶一樣,四肢跪地爬行

    (己) 整個人趴在地上匍匐前進

    [提示] 可以假設人體表層的皮膚為定值,利用歐姆定律估算通過人體的電流。電流越小越安全。'
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 丙戊己
