    It was the Lion King’s birthday. All animals were going to the party. Taylor the
    Toad and Fred the Frog were on the way. It was raining. The road was wet and full
    of mud. Suddenly, they fell into a deep hole.

    Taylor and Fred were crying for help when a rabbit went by. The rabbit stood beside
    the hole and said, “Oh dear. You don’t jump like me. You can’t get to the party
    before it starts. It’s too difficult. Just give up.” And he jumped away.

    Taylor and Fred jumped over and over again. Later, two spiders passed by and said,
    “Oh dear. You don’t climb like us. You can’t get to the party before it starts.
    Don’t try anymore, _____ you could fall down to the bottom and die.” And they
    went away.

    At first, Taylor did not listen to them. But, after she tried many times, she
    believed them and gave up. Fred was also tired, but he was still trying. Many
    other animals saw them. “Look at you. You two are so helpless! You can’t get to
    the party before it starts,” they all said.

    Fred gave it another try, and he jumped out of the hole. He reached the party
    just in time. All the other animals were surprised. “How did you get out of that
    deep hole?” the snake asked. “Where is your friend?” the rabbit asked. Fred said
    nothing and typed a message on his cellphone. The message said, “I am deaf. I
    can’t hear you. You cheered me on when I was in the hole. I didn’t give up because
    of you. Thank you. But, my friend is still there. Who can help her?”

