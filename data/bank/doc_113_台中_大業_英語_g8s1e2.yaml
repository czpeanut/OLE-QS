  group_stem: '(36－37)

    Dear Mr. Mayor,

    I am writing to ask you for help. At seven o’clock yesterday morning, a scooter
    fell over and hurt my grandma’s leg when she was walking on the sidewalk. Now,
    she is in a wheelchair and has to go to the hospital once a week. The hospital
    is near her house, but it’s hard for her to get there.

    The problem comes from the scooters on the sidewalks. There is no space to move
    the wheelchair around. We often have to get off the sidewalks and use the roads.
    However, it’s really scary to walk on the roads with cars and buses.

    Aren’t sidewalks for people to walk on? Why are they now parking areas for scooters?
    Please help us. Thank you very much.

    Sincerely,

    Josh

    mayor 市長；scooter 機車；sidewalk 人行道；wheelchair 輪椅；parking area 停車區；sincerely 誠摯地'
