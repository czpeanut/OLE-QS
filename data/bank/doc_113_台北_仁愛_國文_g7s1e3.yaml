- id: doc_113_台北_仁愛_國文_g7s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 〈紙船印象〉一文中「盼望自己能以母親的心情，為子女摺出一艘艘未必漂亮但卻堅強的、禁得住風雨的船」，對比冰心〈紙船──寄母親〉「母親，倘若你夢中看見一隻很小的白船兒，不要驚訝它無端入夢。這是你至愛的女兒含淚疊的，萬水千山，求它載著她的愛和悲哀歸去。」下列何者正確？
  options:
  - label: A
    content: 前者自己以巧手為子女摺出堅強的紙船，後者媽媽以巧手為女兒摺出漂亮紙船
  - label: B
    content: 前者希望摺出未必漂亮但卻堅強的紙船，後者摺的是漂亮又好玩的紙船
  - label: C
    content: 前者是作者想像的，抽象的紙船；後者是作者所摺的，真正的紙船
  - label: D
    content: 前者是自己摺船給孩子，則是象徵傳承母愛；後者是女兒摺船給逝去的母親象徵思念。
  lesson_raw:
    title: 紙船印象
    basis: 題幹引用〈紙船印象〉
