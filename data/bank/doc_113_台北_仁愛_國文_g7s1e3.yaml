- id: doc_113_台北_仁愛_國文_g7s1e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 〈紙船印象〉中「而有一些事，像夏日的小河、冬天的落葉，像春花，也像秋草，似無所見，又非視而不見。」這段文字所指的事情，類似於下列何者？
  options:
  - label: A
    content: 第一次愛的人，他的壞他的好，卻像胸口刺青是永遠的記號(王心凌〈第一次愛的人〉)
  - label: B
    content: 有些人注定和寂寞相伴，少了那一夜短暫煙火，只能懷念剎那閃爍(戴佩妮〈兩難〉)
  - label: C
    content: 現在也只能欣賞唯一的合照一張，淡忘了的是那個街角，想念的是當時的微笑(梁靜茹〈如果有一天〉)
  - label: D
    content: 我知道太美的回憶像副手銬，越是掙脫越纏繞，我比你明瞭(倪安東〈散場的擁抱〉)。
