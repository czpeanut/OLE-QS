- id: doc_113_台北_仁愛_國文_g7s1e3_s2_37
  section: 2
  number: 37
  type: single
  page: 4
  stem: 關於本文說明何者正確？
  options:
  - label: A
    content: 本次空難除了韓國民眾外，還包含兩位泰籍乘客，是南韓有史以來傷亡人數最多
  - label: B
    content: 韓國總統尹錫悅跟濟州航空總裁金利培在事故發生第一時間就到現場致意
  - label: C
    content: 報導中指出調查時間會延誤，失事原因尚未能確定，是因為雖已尋獲黑盒子，但一個飛行數據記錄儀已損壞
  - label: D
    content: 機上罹難181名乘客中，僅有兩名機組人員生還。
  group_stem: "韓國濟州航空空難179死兩傷，全國哀悼七日\n一架濟州航空客機（航班編號7C2216）12/29在位於韓國西南部的務安（Muan）國際機場墜毀。韓國政府宣佈，即日起全國哀悼至2025年1月4日。據韓聯社報導，該航班在務安（Muan）國際機場降落時衝出跑道撞牆。\n\
    \    上週五才接任的韓國代理總統崔相穆抵達事發務安機場，宣布務安郡為特別災區，調配所有可用資源協助。濟州航空行政總裁金利培（Kim E-bae）就事故致歉。他指尚不清楚墜機原因，飛機沒有事故記錄，亦無故障徵兆，公司將與調查人員合作，以支持死者家屬作為首要任務。\n\
    泰國機場公司（Airports of Thailand）總裁克拉迪·基馬納瓦（ Kerati Kijmanawat）表示，飛機離開曼谷素萬那普機場（Suvarnabhumi\
    \ Airport）時沒有報告任何異常情況。當局表示已設置臨時太平間，車輛在外排隊停泊運走遺體。韓國消防部門表示，有兩名機組人員生還。兩名傷者被送往不同醫院治療，無生命危險。根據韓聯社報導，機上乘客包括173名韓國人和兩名泰國人。\n\
    \   墜機原因尚未清楚。但當地媒體稱，懷疑事故跟撞上鳥群有關；亦有當地電視台影片顯示，飛機在沒有展開起落架的情況下試圖降落，飛機在地面上打滑，撞牆後爆炸。韓聯社報導指，有現場目擊者稱飛機起落架出現了故障。當局已尋獲失事飛機的黑盒子，韓聯社引述交通部航空及鐵路事故調查委員會的一名官員說法，指其中一個飛行數據記錄儀在尋獲時已損壞，駕駛艙錄音機則完好無缺，或會進一步延誤調查時間。\n\
    \   當地交通部早前稱，機場控制塔發出鳥擊預警，一分鐘後，機長發出求救訊息，客機最終於9點3分左右在沒有放下起落架情況下以機腹著陸。\n   務安機場位於韓國首都首爾以南約178\
    \ 英里（288 公里）。韓國航空業被認為擁有良好的安全記錄，濟州航空是韓國最大的廉航之一，今次空難是成立於2005年的這家公司史上第一宗致命事故。根據韓國交通部數據，本次事故是1997年大韓航空801號航班關島空難以來，韓國航空公司發生的最嚴重空難，那次空難導致超過200人死亡。\n\
    －BBC NEWS 2024.12.29"
