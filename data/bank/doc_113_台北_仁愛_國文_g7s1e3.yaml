  options:
  - label: A
    content: 要慎選朋友，遠離好高騖遠之徒
  - label: B
    content: 愚公移山只是神話，萬不可仿效
  - label: C
    content: 做事要有決心、毅力，有志竟成
  - label: D
    content: 能互相扶持到老，才是真正朋友。
  group_stem: '昔有二翁，同邑而居。甚友善。甲翁之妻子到鄉① ，唯叟一人而已。一日，叟攜酒至乙翁第，二人對酌，不亦樂乎！乙翁曰：「向吾遠遊冀、雍，但未嘗登泰山，君有意同行乎？」甲翁曰：「是山余亦未登，然老矣，恐力不勝。」乙翁曰：「差矣，汝之言！曩者②
    愚公，年且九十而移山，今吾輩方逾六旬，何老之有？」甲翁曰：「甚善！」翌日，二翁偕往，越錢塘，絕長江，而至泰陰。夜宿，凌晨上山。乙翁欲扶之，甲翁曰：「吾力尚可，無需相扶。」自日出至薄暮，已至半山矣。──<二翁登泰山>

    【注釋】①到鄉:去世。②曩者：過去。'
