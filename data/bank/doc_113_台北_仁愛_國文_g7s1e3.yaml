- id: doc_113_台北_仁愛_國文_g7s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 下列關於〈兒時記趣〉一文的分析，何者最為正確？
  options:
  - label: A
    content: 本文節選自《浮生六記》，是作者沈復的自傳體散文，全書文字樸實，情感真摯，寫出對生活的感悟
  - label: B
    content: 作者發揮敏銳的觀察力，如「忽有龐然大物，拔山倒樹而來」等，以趣味眼光看待平凡事物
  - label: C
    content: 文體為記敘文，寫作手法多以視覺為主，故以「明察秋毫」為全文綱領，豐富了生活的情趣
  - label: D
    content: 以第一人稱為敘述立場，先分述三件趣味之事，再總結全文，採「先分後總」的寫作筆法。
  lesson_raw:
    title: 兒時記趣
    basis: 題幹提及〈兒時記趣〉
  tags:
    textbook: 七上 第七課 兒時記趣
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 七上
      subject: 國文
      code: 第七課
