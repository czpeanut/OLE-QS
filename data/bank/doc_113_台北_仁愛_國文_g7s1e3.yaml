- id: doc_113_台北_仁愛_國文_g7s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 〈兒時記趣〉一文中運用了「虛實錯間」的手法，把尋常事物幻想成新奇景象，化平凡為神奇。下列關於本課 「虛」與「實」的配對，何者正確？
  options:
  - label: A
    content: 「私擬作群鶴舞空，心之所向，則或千或百，果然鶴也」→把雪花紛飛的景象想像成群鶴於空中飛舞
  - label: B
    content: 「以叢草為林，蟲蟻為獸」→把叢生的小雜草當做樹林，把野獸當作昆蟲螞蟻
  - label: C
    content: 「忽有龐然大物，拔山倒樹而來」→將癩蝦蟆當作怪獸，如不速之客闖入自己的想像天地
  - label: D
    content: 「作青雲白鶴觀」→把自己想像成一群白鶴，在青雲裡怡然自得地飛舞。
  lesson_raw:
    title: 兒時記趣
    basis: 題幹提及〈兒時記趣〉
