  stem: '請問以下文句，正確順序為何？

    （甲）為之怡然稱快 （乙）使之沖煙飛鳴

    （丙）果如鶴唳雲端 （丁）作青雲白鶴觀

    （戊）徐噴以煙      （己）又留蚊於素帳中。'
  options:
  - label: A
    content: 戊己丙乙丁甲
  - label: B
    content: 己戊乙丁丙甲
  - label: C
    content: 己戊丙丁乙甲
  - label: D
    content: 丙乙戊丁己甲。
