  options:
  - label: A
    content: 「雨連下十天，半月，甚至一個月，……我也不抱怨。」強調作者對雨天的偏愛，下雨天的情景，勾起作者的回憶，這就是所謂的「相由心生」
  - label: B
    content: 「那些有趣的好時光啊，我要用雨珠的鍊子把它串起來，繞在手腕上。」表示童年時光如珠寶般珍貴，不能浪費
  - label: C
    content: 「我的啟蒙老師說菩薩慈眉善目，母親的長相一定就跟菩薩一樣。」描繪母親是個慈善的人，並表現出作者對母親的舐犢情深
  - label: D
    content: 「下雨天真好，有吃有玩，長工們個個疼我，家裡人多，我就不寂寞了。」這是「下雨天真好」之因，呼應主題。
