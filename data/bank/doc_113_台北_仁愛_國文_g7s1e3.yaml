- id: doc_113_台北_仁愛_國文_g7s1e3_s2_35
  section: 2
  number: 35
  type: single
  page: 4
  stem: 根據本文，下列敘述何者有誤？
  options:
  - label: A
    content: 村上春樹及安藤忠雄的成長過程中，皆面臨到美日文化的衝擊
  - label: B
    content: 作者將發亮大樓Kirin  Plaza 比喻成〈銀翼殺手〉裡的未來世界建築
  - label: C
    content: 英國導演雷利．史考特透過執導〈黑雨〉這部電影，表現美日文化的衝擊與碰撞
  - label: D
    content: 與日本其他城市比，大阪及東京皆存在較多西方文化。
  group_stem: "在英國導演雷利．史考特的眼中，大阪是一個五光十色的霓虹商圈，深夜黑社會份子暴走族橫行的奇特世界，在他1989年的電影〈黑雨〉中，麥可．道格拉斯扮演來自美國的警探，與高倉健飾演的日本警察合作辦案，電影中出現道頓堀那棟由建築師高松伸設計的發亮大樓Kirin\
    \ Plaza，猶如〈銀翼殺手〉裡的未來世界建築，〈黑雨〉也似乎有意指涉「黑船事件」強調美國文化與日本文化的直接衝突與碰撞。大阪這個海港城市的確是日本文化接觸外來文化的最前線，也因此呈現出不同文化混雜的城市文化狀態。\n\
    \    所以在神戶附近成長的村上春樹曾表示，很多日本人去東京會有一次對西方文化的「文化衝擊」，但是因為他成長的環境早就存在著大量的西方文化，爵士樂、美國食物、牛仔褲等都是他從小熟悉的事物，所以對他而言，長大後去東京，根本不覺得有什麼文化衝擊！\n\
    \    建築大師安藤忠雄是道地的大阪人，他熟悉大阪人的生活方式，他也跟許多大阪小孩一樣，總是在街頭打架鬼混，但是他的作品中卻顯現出一種大阪人在吵雜城市裡的自處之道。在混亂的城市裡，他的建築總是以清水混凝土牆將自己圍繞，像傳統的園林一般，創造自己亂世中的桃花源，可見大阪人雖然身處熱熱鬧鬧的城市，內心依然尋求一方寧靜，一個安身立命的空間。\n\
    節錄自李清志〈怪獸大阪〉"
