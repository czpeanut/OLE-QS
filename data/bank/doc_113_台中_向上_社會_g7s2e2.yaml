    乙:他任內時宣布終止動員戡亂，同時進行修憲與改選中央民意代表，之後更成為首位人民直選的總統。

    丙:他以行政院長之姿出掌國政，後於總統任內逝世，在擔任總統期間發布解嚴令，任用多位臺灣籍青年菁英擔任政府要職。

    丁:他當選總統後，完成了臺灣史上第一次政黨輪替，改變過去長期國民黨執政的政治環境，使台灣民主邁向新的里程碑。'
