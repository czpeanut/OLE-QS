  stem: 「九宮格內用細線界一井字，以均布字之點畫，凡字無論疏密斜正，必有精神挽結之處，是為字之中宮。然中宮有在實畫，有在虛白，必審其字之精神所注，而安置於格內之中宮。然後以其字之頭目手足分布於旁之八宮，則隨其長短虛實而上下左右皆相得矣。」這段文字所要說明的內容不包含下列何者？
  options:
  - label: A
    content: 強調墨色的層次變化
  - label: B
    content: 精究字體精神之所在
  - label: C
    content: 重視字體的均衡美感
  - label: D
    content: 指出筆畫的布局原則。
