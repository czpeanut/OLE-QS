- id: doc_111_桃園_中興_國文_g8s2e3_s2_34
  section: 2
  number: 34
  type: single
  page: 6
  stem: 依據文意脈絡，文中 ______ 內最適合填入的文句是：
  options:
  - label: A
    content: 考場中隱約瀰漫著一股高海拔的芬多精
  - label: B
    content: 試場中似乎吹拂著來自海洋的湛藍氣息
  - label: C
    content: 闈場內依稀湧動著一縷篝火的熾焰氣味
  - label: D
    content: 教室裡彷彿散發著遼闊原野的綠草香味。
  group_stem: "（五）\n    臺北是我出生、成長，居住了三十年的地方，卻不是我的家。因為，比起臺北人，他們更喜歡叫我原住民。\n    「107-2-8\
    \ 號。」監考人員盯著我的族語准考證，「請坐到那邊第三臺電腦。」捏著准考證，我逐步邁向祖靈的召喚。這是一間新穎的電腦教室，日光燈照亮了每一個本該陰暗的角落。側身越過喃喃背誦族語的考生，他們大部分是孩子，稚嫩的臉龐，埋藏著對繁華都市的無限想像。其中少數幾位，是看起來不大適應電腦設備的長輩，眼神中透露出一絲溫柔的倔強。雖然只是在七樓，\
    \ ，在這之前，我不曾在臺北遇過這麼多族人齊聚一堂，更從未在他們臉上看見如此戒慎恐懼的模樣。按監考人員指示，我坐入指定位置，左右張望，這所歷史悠久的女校，此刻被賦予傳承臺灣千年傳統文化的神聖使命，而呆坐在試場中心，戶籍設在臺北市的我，卻是整個歷史洪流中的盲點。\n\
    \    「請檢查桌上貼紙，確認是你的位置。」我是否在正確的位置？成長過程中，常有人問我「妳從哪裡來？」若誠實回答臺北，總不免換來「我指的是妳—真正—從哪裡來？」配上自認與我心有靈犀的挑眉。無奈的是，這類拒絕接受真相的提問總以千變萬化的形式反覆出現—「妳什麼時候過年？我指的是—真正—的豐年祭。」或是「妳叫什麼名字？我指的是妳—真正—的名字。」\n\
    \    「請戴上耳機測試麥克風，確認音量。」監考人員喚回我紛亂的思緒。\n    「Ciwas lalu mu.」我小心翼翼托著麥克風，謹慎地咬字。Ciwas\
    \ 是我「真正」的名字—真正沒人稱呼的名字。\n（改寫自游以德族語認證）"
  tags:
    textbook: 八下 自學課二 面對假訊息，其實我可以這麼做
