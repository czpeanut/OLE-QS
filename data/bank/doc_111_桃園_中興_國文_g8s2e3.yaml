  stem: '「不論是人還是山水，只要美，人就喜歡。有學者研究動物也有趨美厭醜的本能，不過與動物不同，人能將這種美感上升到感情，並形成一種定式，於是相應於景色的明暗便有心情的好壞，        。小石潭的淒清，荷塘月色的寧靜，范仲淹所謂物悲物喜，這就是意境。」（梁衡
    山水為何有美感）

