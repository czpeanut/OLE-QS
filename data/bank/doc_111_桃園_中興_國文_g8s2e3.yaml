    content: 三國時代的赤壁之戰，吳軍都督周瑜利用曹操生性多疑之病，行使反間計「借刀殺人」，殺了魏軍的名將蔡瑁、張允等人，使魏軍的水師戰力大為削弱
  - label: B
    content: 加高堤岸來防洪只是治標，唯有疏浚河道才是「打草驚蛇」的治本之道
  - label: C
    content: 十六世紀末，為爭奪海上霸權，西班牙的無敵艦隊遠渡重洋，長征英國。然而英國海軍早就做好萬全準備，「金蟬脫殼」，使得西班牙艦隊無功而返
  - label: D
    content: 蜀國丞相諸葛亮，為收服南蠻各族，刻意「直搗黃龍」，七擒蠻王孟獲，又縱其歸家。最終感化孟獲，並且贏得南蠻族人的支持。
