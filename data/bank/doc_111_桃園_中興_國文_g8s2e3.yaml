- id: doc_111_桃園_中興_國文_g8s2e3_s2_28
  section: 2
  number: 28
  type: single
  page: 4
  stem: 關於甲文最洽當的敘述是：
  options:
  - label: A
    content: 瓶鼻海豚的天性是溫馴、逗趣，親近人類
  - label: B
    content: 瓶鼻海豚經訓練後表情會以笑靨迎人
  - label: C
    content: 瓶鼻海豚擅長表現人類賦予的多種角色
  - label: D
    content: 瓶鼻海豚應有的生存空間並非是海洋育樂世界。
  group_stem: "（二）\n甲 奶油鼻子（指瓶鼻海豚）是海洋育樂世界裡常見的明星，在表演水池裡，牠們隨著訓練員的手勢及哨音，做各種花俏的跳躍及類似馬戲表演的高難度特技動作。每一個項目表演完成後，牠們會從訓練員手裡得到一條魚作為獎賞。\n\
    \    表演場裡，牠們是那樣溫馴、逗趣而且平易近人。\n    但是，當我在海上與牠們幾番接觸後，我深深覺得，牠們在水池子裡是戴著面具表演、是被迫扮演著不是自己的另一種角色，像歡場女子的笑靨往往只浮露在濃妝豔抹的表皮上。短暫表演過後，牠們就得在有限的空間裡徘徊躑躅。奶油鼻子似乎也懂得，那是不得不的生活。\n\
    （節錄自鯨生鯨世 奶油鼻子─瓶鼻海豚）\n乙 牠們在船邊倒翻肚腹，大片雪白肚子赤裸裸袒露在我們眼裡，長卵形大扇胸鰭優雅地緩緩拍水。\n    像是應觀眾要求，每番牠們落幕離開，都會因我們的喝采、追隨，而返頭回到舞臺再為我們表演一段。而且是那麼有耐心、那麼不厭其煩地一而再、再而三地賣力演出。\n\
    \    牠們高高舉起尾鰭，似在表演水中倒立特技；牠們拍打尾鰭，正著拍，仰倒著拍，拍出巨大掌聲樣的盡興水花；也曾交錯湧疊，如在表演水中疊羅漢；有一次高速側衝船舷，就在幾乎碰撞尖叫的剎那，又敏捷地側翻，如流星一樣劃一道弧線拋射離去……牠們是一群舞者，在這遼闊的舞臺為我們表演海上芭蕾。也只有海洋這樣的舞臺，才容得下牠們盡情盡興的演出。\n\
    （節錄自鯨生鯨世 黑與白─虎鯨）"
  tags:
    textbook: 八下 第六課 森林最優美的一天
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 八下
      subject: 國文
      code: 第六課
      title: 森林最優美的一天
      chapter: null
