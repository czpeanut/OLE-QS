  stem: 根據上文，下列何者不是文中所描寫的景象？
  options:
  - label: A
    content: 溪流水質清澈、水勢湍急
  - label: B
    content: 飛瀑直瀉，激起陣陣水花
  - label: C
    content: 溪水沿岸，怪石錯落堆疊
  - label: D
    content: 樹木、青竹叢生，餘蔭相疊。
  group_stem: "（一）\n    道州城西百餘步，有小溪。南流數十步，合營溪。水抵兩岸，悉皆怪石，欹嵌①盤屈，不可名狀。清流觸石，洄懸激注，佳木異竹，垂陰相蔭。\n\
    \    此溪若在山野，則宜逸民②退士之所遊處，在人間，則可為都邑之勝境，靜者之林亭。而置州以來，無人賞愛，徘徊溪上，為之悵然。乃疏鑿蕪穢，俾為亭宇，植松與桂，兼之香草，以裨形勝。為溪在州右，遂命之曰右溪。刻銘石上，彰示來者。\
    \ （元結 右溪記）\n【注釋】①欹嵌：不平貌。欹，傾斜不正。②逸民：節行超俗，遁世隱居的人。"
  tags:
