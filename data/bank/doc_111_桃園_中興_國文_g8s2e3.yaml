- id: doc_111_桃園_中興_國文_g8s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: "依據下文，最符合「康德看法」的敘述是：\n  有人天生熱愛助人，他們有慈悲心，因助人而得到快樂。康德(註)卻認為，出於慈悲心的行善，不論如何正確或如何溫柔敦厚，都沒有道德價值。這似乎違反一般見解。助人為快樂之本不是很好嗎？康德會說沒錯，他當然不覺得憑著慈悲心行事有何不對。他只是區別出助人的兩種動機，一是為了讓自己快樂，一是視為義務。康德堅持，只有視為義務的動機才具道德價值，助人為快樂之本的慈悲心是值得稱讚和鼓勵，卻不值得尊敬。\n\
    \                                                         (註)康德:為十八世紀德意志哲學家。\n\
    （改寫自邁可．桑德爾著、樂為良譯正義：一場思辨之旅）"
  options:
  - label: A
    content: 助人為樂具道德價值
  - label: B
    content: 只要行善助人就具有道德價值
  - label: C
    content: 出於慈悲心的行善不值得鼓勵
  - label: D
    content: 值得尊敬的行善動機是出於義務。
  tags:
    textbook: 八下 第一課 運動家的風度
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 八下
      subject: 國文
      code: 第一課
      title: 運動家的風度
      chapter: null
- id: doc_111_桃園_中興_國文_g8s2e3_s1_7
