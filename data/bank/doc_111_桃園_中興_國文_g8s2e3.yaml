  stem: '關於本詩的敘述，下列何者有誤？


    丞相祠堂何處尋？錦官城外柏森森。映階碧草自春色，隔葉黃鸝空好音。

    三顧頻煩天下計，兩朝開濟老臣心。出師未捷身先死，長使英雄淚滿襟。          杜甫 蜀相'
