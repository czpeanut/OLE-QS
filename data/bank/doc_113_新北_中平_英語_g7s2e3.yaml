  stem: How did Amy and her classmates go to Galata Island?
  options:
  - label: A
    content: They took a boat and an airplane.
  - label: B
    content: They drove a car and took a boat.
  - label: C
    content: They took a train and then flew there.
  - label: D
    content: They took a train and a bus.
  group_stem: 'A. A Weekend on Galata Island


    Last weekend, Amy and her classmates went on a trip to Galata Island. They traveled
    by train to the airport and then took a plane to the island. It was a little cold,
    but they were excited.


    During the trip, they stayed at a small hotel near the lake. They hiked up a hill
    and had a picnic there. They also rowed a boat in the lake and saw many plants
    in the rainforest nearby. Some students even climbed a small mountain!


    Amy was sad when she saw trash near the river and on the beach. "We need protect
    the environment," she said. So, her class picked up trash and planted some trees.
    The teacher said, “Little by little, we can make the world better.”


    At night, they went to a market and had dinner in a restaurant. It was a busy
    but fun weekend.


    pick up 撿；protect 保護；better 更好'
