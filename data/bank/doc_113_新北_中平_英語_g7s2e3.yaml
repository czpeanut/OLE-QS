  group_stem: 'B. Rima’s Rainforest – What Do Students Think?


    Rima is a 13-year-old girl from Indonesia. When she was 9 years old, she lived
    in the rainforest. The rainforest had many trees, animals, and birds. It was also
    a fun playground for Rima and her brother.


    One day, people from a big company came. They burned the forest and planted palm
    trees. They made a farm. The trees give palm oil. People sell the oil and make
    money, but there are no birds or animals now. There are only palm trees. Rima
    is not happy.


    Her teacher asked the class a question: “Do you prefer burning down the rainforest
    and making more money?

    Here is the class survey:


    A student also wrote this to show what he thought:


    My name is Andi. I am 13 years old and a classmate of Rima.


    When I was young, I knew there was a rainforest. It was full of tall trees, many
    animals, and beautiful birds. But one day, people came and cut down the forest
    to plant palm trees. They made a palm tree farm.


    Some people say this is bad because the animals lose their homes. I am sad about
    it, but I also know that the palm oil farms help many families. They give people
    jobs and money to buy food and help children to go to school.


    We need to find a way to take care of the rainforest and also help people make
    money. Maybe we can plant some palm trees but also keep some forest safe for animals.
    That way, we can have both the animals and good jobs.


    I hope one day we can still live in the forest and people have enough money, too.


