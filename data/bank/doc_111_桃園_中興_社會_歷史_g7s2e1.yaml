- id: doc_111_桃園_中興_社會_歷史_g7s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '根據以下資料，何者敘述正確？

    資料一：第一憨，種甘蔗予會社磅。

    資料二：1905 年 6 月臺灣總督府規定：為制止各製糖工廠間的原料爭奪，避免擾亂蔗價，各蔗作區畫定一定範圍的區域。此區域內的甘蔗未經許可，不得運出區域之外，或供作砂糖以外成品的製作原料。'
  options:
  - label: A
    content: 資料一的「會社」指的是外國人成立的洋行
  - label: B
    content: 資料二的規定，可保障日資糖廠，使其可低價收購甘蔗原料
  - label: C
    content: 這是在臺灣總督府實施「工業臺灣，農業南洋」政策下的措施
  - label: D
    content: 使臺資的舊式糖廠在政府補助下轉型為新式糖廠，帶動臺灣經濟發展。
