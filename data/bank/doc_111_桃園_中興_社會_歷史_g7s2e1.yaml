  section: 1
  number: 1
  type: single
  page: 1
  stem: 小宏在圖書館看到了一位日本學者的著作，其中一段文字描述著:「□對於日本統治臺灣，特別是對於臺灣經濟政策之推行有很大的影響。例如極為發達的產業道路與耕地防風林等，不得不歸功於該制度的實施，警察既然掌握了□，警察力就滲透了行政的底層，因此反而增加了警察的力量。總之講到統治臺灣不能忽視警察，講到警察不能忽視□。」請問：文中的□是指下列何者？
