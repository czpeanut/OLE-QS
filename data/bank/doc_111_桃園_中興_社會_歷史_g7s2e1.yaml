- id: doc_111_桃園_中興_社會_歷史_g7s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '近幾年每到夏日，臺灣常面臨到限電危機，對民眾生活和各行業皆帶來很大程度的影響。因此老師請同學在課堂上討論，「臺灣曾擁有亞洲第一大發電所，供全臺電力使用。1935
    年時臺灣地區電力總產能是 1931 年的 3 倍，產量也增加一倍。」以下是四位同學的看法，請問：何者的看法最符合史實？

    | (Ａ)昀昀 | 總督府為了發展農業與運輸而需要電力 |

    | --- | --- |

    | (Ｂ)澄澄 | 當時的總督府為了要發展鐵路電氣化，所以需要大量用電 |

    | (Ｃ)瑄瑄 | 總督府為了推廣閱讀，普遍裝設電燈，用電量因此大增 |

    | (Ｄ)茹茹 | 總督府判斷現有設施不足以應付工業成長，故新建電廠因應 |'
  options:
  - label: A
    content: 昀昀
  - label: B
    content: 澄澄
