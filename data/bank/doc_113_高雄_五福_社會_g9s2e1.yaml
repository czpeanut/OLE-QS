    | 昨天，12 月7 日─它將永遠成爲國恥日─美利堅合衆國遭到了日本帝國海空軍預謀的突然襲擊……夏威夷同日本相距甚遠，顯而易見這次進攻是許多天甚至數星期之前便精心策劃的。在此期間日本政府通過虛僞的聲明和希望維持和平的表示蓄意對美國進行欺騙……戰爭業已存在……我們信賴我們的武裝力量，依靠我國人民的無比堅強的決心，我們必將取得勝利。願上帝保佑我們。我要求國會宣佈，自1941年12
