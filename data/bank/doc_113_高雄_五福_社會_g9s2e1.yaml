- id: doc_113_高雄_五福_社會_g9s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 「廍」是某種農產品加工製造的工坊，臺灣有許多地方因設有這種工坊而以「廍」為地名，如廍仔、保長廍、桕腳廍等。美美統計各縣市以「廍」為地名數量後，發現數量最多的前五名縣市為台南、嘉義、雲林、高雄、屏東。請問：此工坊主要考量的工業區位為何？
