  section: 1
  number: 13
  type: single
  page: 2
  stem: 「某縣」地名的由來，起初源自入墾後的漢人，利用定居於這裡的原住民之族名為地名，後來再演變成現在的地名，圖六為該區的衛星影像示意圖，從圖六中的平原處遠眺外海，有因形似浮龜而得名的龜山島，傳說因巨大龜怪被鄭成功軍隊所殺，死後身體化為島嶼。請根據圖六，選出最正確的敘述？
  options:
  - label: A
    content: 「某縣」的舊地名為半線
  - label: B
    content: 圖的下方為東方
  - label: C
    content: 甲地為中央山脈
  - label: D
    content: 龜山島屬於大陸島。
