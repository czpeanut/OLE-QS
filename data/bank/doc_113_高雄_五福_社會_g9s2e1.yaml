- id: doc_113_高雄_五福_社會_g9s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 怡君蒐集到一份1830年代北臺灣的史料，指出：「淡（水）廳貨之大者，莫如油、米，次（其次）麻、豆，次（其次）糖、菁（染料），至茄藤、通草之屬，多出於內山，樟腦、茶葉惟淡北內港始有之。商人雇船裝載，擇內地可售之處，本省則運至漳、泉、福州，往北則運至寧波、上海，往南則運至澳門等處。」依據前述記載，怡君發現大溪（舊名：大嵙崁）是靠近樟腦、茶葉產地的考察地點，請問：下列何者最可能是怡君到當地會看到的地形特色？
  options:
  - label: A
    content: 河口三角洲
  - label: B
    content: 多為沙丘地形
  - label: C
    content: 海岸灣澳之處
  - label: D
    content: 陡峭坡面。
