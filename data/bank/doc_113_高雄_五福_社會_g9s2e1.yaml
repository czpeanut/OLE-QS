- id: doc_113_高雄_五福_社會_g9s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 地名有時也帶有時代的特徵，下列是臺灣的三個地名：（甲）臺北市「松山」（乙）花蓮縣「光復」（丙）高雄市「前鎮」。請問：上述引號之地名在歷史上出現的先後順序是：
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙丙甲
  - label: C
    content: 丙甲乙
  - label: D
    content: 甲丙乙。
  answer:
  - C
