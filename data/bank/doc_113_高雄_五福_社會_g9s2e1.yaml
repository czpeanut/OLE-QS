  page: 7
  stem: '史料一：希特勒，「通過《授權法》」，1933 年3 月23 日，對德國國會的演講

    「這項法律的通過將確保德國擺脫議會的無能與混亂，使政府能夠迅速執行必要的措施，以恢復秩序與民族團結。」

    史料二：墨索里尼，「向羅馬進軍」，1922 年《人民報》（Il Popolo d''Italia）社論

    「我們的行動是不可阻擋的。我們將向羅馬進軍，無論道路上有什麼障礙，我們都不會停止。我寧可被槍殺，也不願見到義大利繼續被無能的政客統治！」

    史料三：希特勒對猶太人的政策，1939 年1 月30 日，德國國會演講

    「今天，我再次作出預言：如果國際猶太人再次將世界拖入戰爭，結果將不是資本主義與共產主義的勝利，而是猶太人的徹底毀滅。」

    史料四：墨索里尼經濟政策，1934 年，法西斯大會演講

    「我們將建立一個企業國家，在這裡，工人與資本家不再對立，而是為國家的榮耀共同努力。經濟計畫將由國家監督，以確保義大利的繁榮。」

    史料五：摘錄自溫斯頓·邱吉爾《二戰回憶錄》（Memoirs of World War II）

    「1945 年 4 月 28 日，墨索里尼與他的情婦在義大利被游擊隊俘虜，並在科莫湖附近遭到處決。兩日後，希特勒在柏林的地堡內吞槍自殺，結束了他的統治。」

    根據所學，並參考上述史料，關於希特勒與墨索里尼的統治歷程，下列何者符合史實？'
