  group_stem: "閱讀題「年輕的伊莉莎白公主與戰爭的考驗」\n    當時的歐洲局勢急轉直下。最初，某個強權國家與另一個東方國家達成協議後，使人們擔憂戰爭一觸即發。果然，不久後，波蘭遭到急速的攻擊，導致英國政府不得不採取行動，對侵略者宣戰。\n\
    \    19XX 年，一場影響世界的大戰爆發，當時年僅13 歲的伊莉莎白公主與家人一起見證了國家的動盪。她的父親，喬治六世國王，試圖穩定國內局勢，而她的母親，伊莉莎白王后，則拒絕離開倫敦，選擇與人民共患難。\n\
    \    戰爭的進展令人震驚。短短幾個月內，一個強大的鄰國被迅速攻陷，迫使英軍大規模撤退。英國的軍隊雖然成功撤回，但敵軍並未停止擴張的腳步，很快將矛頭對準英國本土。當敵方軍隊開始對英國進行攻擊時，全國進入了緊急狀態。年輕的公主投入英國陸軍，加入女子地方輔助服務團，是英國史上第一位成為全職軍人的女性王室成員。伊莉莎白公主也透過廣播向全國兒童發表鼓舞人心的談話，此舉鼓舞民心奮戰，最終贏得戰爭勝利，也展現出她未來作為國家領袖的潛質。\n\
    \n資料來源：\n約翰·威勒（John Wheeler），《喬治六世傳記》，劍橋大學出版社，1985 年\n莎拉·布萊恩（Sarah Bryant），《伊莉莎白二世：從公主到女王》，牛津大學出版社，1998\
    \ 年\n溫斯頓·邱吉爾（Winston Churchill），《二戰回憶錄》， 1950 年"
