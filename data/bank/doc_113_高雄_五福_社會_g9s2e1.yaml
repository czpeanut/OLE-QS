- id: doc_113_高雄_五福_社會_g9s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '地名不僅具有標示定位的作用，更可忠實呈現地方風貌、地形特徵、宗族源流等各種事項。表一為小彬整理的地名命名緣由。請問：「甲」處應填入下列何者？


    【表一】

    | 命名緣由 | 地名 |

    | :--- | :--- |

    | 原鄉 | 「陸豐」、「潮州」 |

    | 植物 | 「茄苳」腳、鳥「松」 |

    | 原住民 | 「雞籠社」、「南投社」 |

    | 甲 | 「崙」頂、土地公「崎」 |'
  options:
  - label: A
    content: 屯墾
  - label: B
    content: 地形
  - label: C
    content: 歷史事件
  - label: D
    content: 動物。
  answer:
  - B
  tags:
