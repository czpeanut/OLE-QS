- id: doc_113_高雄_五福_社會_g9s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 「政府曾經以『吳鳳鄉』這個地名以紀念吳鳳，但經過學者專家研究發現，吳鳳捨身赴義的故事其實是後人所美化，用來作為教育原住民的教材。為了尊重臺灣原住民文化及歷史，因此在1989
    年將『吳鳳鄉』改名為『阿里山鄉』，教科書中也刪去相關的課文。」上文是小寶造訪嘉義縣阿里山鄉時，看到當地地名由來的介紹。文中「吳鳳鄉」改名為「阿里山鄉」，和下列哪個行政區改名原因相似？
  options:
  - label: A
    content: 三民→那瑪夏
  - label: B
    content: 打貓→民雄
  - label: C
    content: 諸羅→嘉義
  - label: D
    content: 桃仔園→桃園。
  answer:
  - A
