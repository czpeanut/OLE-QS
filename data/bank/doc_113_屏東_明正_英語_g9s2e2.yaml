  group_stem: "AI and Life\n  Do you know Artificial Intelligence (AI) might replace\
    \ some jobs in the future? AI is like a super-smart computer friend and it can\
    \ finish some jobs on its own. In the past, writing and making songs may take\
    \ a lot of time however, with the help of AI, they can be done in just a few seconds.\
    \ It is amazing and fast. However, it means that some jobs could be done by AI\
    \ robots soon. There are some changes.\n1. Boring Jobs: Robots can work on many\
    \ things at the same time, like grouping files or doing the same job over and\
    \ over without being tired. This means some boring jobs might be replaced by AI!\n\
    2. New Jobs: With robots taking care of different things, new jobs might come\
    \ out. Some people may work on making robots and fixing them in the future.\n\
    \  Although some jobs may be changed, some new jobs may be created at the same\
    \ time. Learning new skills is very important. People should have to learn new\
    \ things with AI. If you keep learning with AI, you will know how to work and\
    \ live peacefully with AI in your life.   (Adapted from Hanlin teaching material)\n\
    \nreplace 取代 skill 技能\npeacefully 和平地"
