    \ talks about daily life on the International Space Station (ISS).\n  For the\
    \ last few months, my home has been the International Space Station, orbiting\
    \ 400 km above the earth, at 25,000 km per hour. We took off in a Russian Soyuz\
    \ spaceship from Kazakhstan, and the flight to the Space Station took six hours.\
    \   36   I felt super excited.\n  There are two Americans, three Russians, and\
    \ me.  37   Luckily, we all get on well. The day starts for everyone at 7 a.m.\
    \ There's no gravity up here, so every morning I float through the cabin to take\
    \ part in our daily planning meeting.   38   It usually lasts a few minutes. After\
    \ it's finished, we speak to space centers around the world, like Houston (USA),\
    \ Munich (Germany) and Tsukuba (Japan).\n  Then we have breakfast: oatmeal, eggs\
    \ and coffee. In the past, astronauts had to suck food out of straws. Nowadays,\
    \ astronauts' food is kept in special personal boxes with covers.   39   Life\
    \ has become much easier for astronauts over the years.\n  Our dinner is at around\
    \ 7:30 p.m. My meals were prepared by an Italian cook on Earth before I left,\
    \ and they're delicious. However, I do exchange a lot of food with my three teammates\
    \ from Russia.\n   40   Their bean and vegetable soup are also really good. Of\
    \ course I miss fresh food, but a cargo spaceship comes once a month with fresh\
    \ fruit. When I get back down to Earth, I know I'll miss this place.   (Adapted\
    \ from Cambridge University Press)\n\n根據左欄文章上下文意，從(A)~(E)選出適當的答案，每個答案限用一次。\n(A)\
    \ I'm the only woman in this group.\n(B) This stops everything floating away while\
    \ we eat!\n(C) That's the meeting where we talk about what needs to be done during\
    \ the day.\n(D) They like my desserts, and they have a dark bread that I love.\n\
    (E) I'll never forget looking through the window and seeing it for the first time.\n\
    \nastronaut 太空人\norbiting 繞軌道運行\nper 每一    gravity 重力\nfloat 漂浮   cabin 船艙\ncargo\
    \ 貨物  oatmeal 麥片\nsuck 吸允   personal 個人的"
