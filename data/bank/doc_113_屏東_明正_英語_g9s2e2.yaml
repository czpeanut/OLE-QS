  group_stem: "Useful Tips to Understand Dogs\n  Understanding dog’s body language\
    \ is a good way to know your four-legged friends. When dogs are feeling happy\
    \ or try to be strong and brave, they will raise and wave their tails. When dogs\
    \ are curious about something, their ears will stand up.\n  However, when dogs\
    \ are feeling scared, they will push their bodies to the ground, and try to look\
    \ smaller. Their tails are hidden between their legs, and ears are low against\
    \ their heads.\n  If dogs roll over and show their bellies to you, it means they\
    \ like you. When dogs want to play, they might touch your hands or knees with\
    \ their noses. What’s more, they might push down the front part of their bodies\
