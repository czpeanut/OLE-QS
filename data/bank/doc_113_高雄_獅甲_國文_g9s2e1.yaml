  group_stem: '(甲)

    晴雲輕漾，薰風無浪，開樽避暑爭相向。映湖光，逞新妝。笙歌鼎沸南湖蕩，今夜且休回畫舫。風，滿座涼；蓮，入夢香。

    （薛昂夫 西湖雜詠）

    (乙)

    姑山寺北賈亭西，水面初平雲腳低。幾處早鶯爭暖樹，誰家新燕啄春泥。亂花漸欲迷人眼，淺草才能沒馬蹄。最愛湖東行不足，綠楊蔭裡白沙堤。

    （白居易 錢塘湖春行）

    (丙)

