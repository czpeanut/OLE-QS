  group_stem: '衛國是春秋初期中原北部的一個大國，西元前六六八年，衛懿公即位，他對國政漠不關心且生活奢侈糜爛，還有個特別的癖好，就是喜歡養鶴。鶴的羽毛潔白、身姿優美，讓懿公著迷不已。那些想求官邀寵的大小官吏便千方百計驅使百姓捕鶴，以討懿公歡心。當時宮中到處都養著鶴，宮苑不夠了，就不斷擴建，於是百姓負擔越來越重。

    更不可思議的是，衛懿公按鶴的品質、體姿冊封牠們為大夫或將軍等不同官階，並給予俸祿，甚至讓鶴乘坐華麗的車子，連養鶴的僕役也可得到很高的待遇。國家突然增加許多坐享俸祿的「鶴大夫」、「鶴將軍」，導致國庫日漸空虛，懿公只得下令向百姓強徵稅賦。百姓苦不堪言，餓死、逃走的與日俱增。

    懿公好鶴而荒廢政事、衛國民心離散的消息傳到北狄。北狄國君見有機可趁，於是在西元前六六○年率軍入侵。懿公驚慌失措，急忙備戰，卻發現城中許多百姓早已逃之夭夭，即便沒有逃走的臣民，也不願為他效命，甚至還有人嘲諷懿公說：「您的鶴大夫、鶴將軍享受朝廷的俸祿，叫牠們去打仗啊！我們窮得連飯都吃不飽，怎麼有力氣打仗呢？」

    衛懿公勃然大怒地說：「鶴怎麼能打仗呢？」百姓則悻悻地回應：「鶴既然不能打仗就是廢物，您如此疼愛這些廢物，卻對百姓不聞不問，直到敵人來襲才想起我們？」懿公慨嘆：「唉，都是我的錯！」就命人把所有的鶴放走，以平息百姓的怒氣，然後才整軍備戰，但由於軍士缺之訓練，衛軍與北狄一交戰，就被打得一敗塗地，懿公還慘死於亂刀之下，北狄軍衝入城中，不及逃避的臣民全遭殺害。懿公因好鶴成癖而疏於朝政，致使國破人亡，可說是玩物喪志的代表人物。

    （參考資料：左傳 閔公二年）

    註：①玩物喪志：指一味玩賞無益的器物，因而消磨人的壯志。'
