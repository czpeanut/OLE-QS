  stem: '如圖，$\triangle ABC$ 為正三角形，E 在 $\overline{BC}$ 上，且 $\triangle BDE$ 也為正三角形，試利用三角形全等的性質來說明
    $\overline{CD} ＝\overline{AE}$ 。(每格 1 分，共 5 分)


    說明：

    $\triangle ABE$ 與 $\triangle CBD$ 全等的條件是：

    $\angle ABE＝$【       】$＝$【      】度（$\triangle ABC$ 與 $\triangle BDE$ 皆為正三角形）

    $\overline{AB} ＝$【        】（$\triangle ABC$ 為正三角形）

    $\overline{BE} ＝$【       】（$\triangle BDE$ 為正三角形）

    根據 【       】全等性質，所以 $\triangle ABE \cong \triangle CBD$。

    所以 $\overline{CD} ＝\overline{AE}$ （對應邊相等）'
