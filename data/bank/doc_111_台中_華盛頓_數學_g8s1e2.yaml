  stem: '2. 森林之友

    小鹿、小象、小獅和小狼在森林裡聊天，討論著家裡面積大小：

    <u>小鹿</u>說：「我住在西北森林區，那裡的面積有$2x^{2}+3x+1$平方公尺。」

    <u>小象</u>說：「我住在西南湖區，那裡的面積有$6x^{2}-x-2$平方公尺。」

    <u>小狼</u>說：「我住在東北山區，那裡的面積有$x^{2}+3x+2$平方公尺。」

    <u>小獅</u>說：「我住在東南草原區，但我不知道面積的大小！」

    已知上述的四個區域均為矩形，邊長均為$x$的一次式，且係數與常數項均為整數。若此四個區域可排成一個大矩形，請幫小獅算出草原區的面積為多少平方公尺？(以$x$表示)(4分)'
