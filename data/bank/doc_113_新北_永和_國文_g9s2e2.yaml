  group_stem: '永和國中114 年4 月23 日世界閱讀節的活動以台灣文學做為企劃主軸，整理相關資料如下表所示，

    | 企劃名 | 鯤島踏浪：《裨海紀遊》時空之旅 |

    |---|---|

    | 時間設定 | 清代康熙年間，一位愛遊山玩水卻不得志的老秀才郁永河，穿越惡名昭彰的黑水溝，縱走台灣西部大半路徑，這段冒險旅程《裨海紀遊》，梳理當時台灣的樣貌，成為研究台灣民族學與地理史的參考文獻。
    |

    | 場景參考資料 | (1)：【ㄅ】又迂迴二三十里，至安平城下，復橫渡至赤崁城，日已晡矣。蓋鹿耳門內浩瀚之勢，不異大海；其下實皆淺沙，若深水可行舟處，不過一線，而又左右盤曲，非素熟水道者，不敢輕入……安平城旁，自一鯤身至七鯤身皆沙崗也。鐵板沙性重，得水則堅如石，舟泊沙上，風浪掀擲，舟底立碎矣。<br>(2)：【ㄆ】街市以一折三，中通車行，傍列市肆，彿彷京師大街，低隘陋耳。<br>(3)：番室仿龜殼為制，築土基三五尺，立棟其上，覆以茅，茅簷深遠，垂地過土基方丈，雨暘不得侵。其下可舂可炊，可坐可臥，以貯笨車、網罟、農具、雞棲、豚柵，無不宜。
    |

    | 風俗民情參考資料 | (1)：市中挽運百物，民間男婦遠適者，皆用犢車。故比戶多畜牛；又多蔗梢，牛嗜食之，不費芻菽。<br>(2)：【ㄇ】所見御車番兒，皆遍體雕青，背為鳥翼盤旋；自肩至臍，斜銳為網罟纓絡；兩臂各為人首形，斷脰猙獰可怖。自腕至肘，纍鐵鐲數十道，又有為大耳者。<br>(3)：台郡獨似富庶，市中百物價倍，購者無吝色，貿易之肆，期約不愆；【ㄈ】佣人計日百錢，趑趄不應召；屠兒牧豎，腰纏常數十金，每遇摴蒱，浪棄一擲間，意不甚惜。
    |

    | 註 | 暘：日照。脰：脖子。摴蒱：一種古代賭博的遊戲。投擲有顏色的五顆木子，以顏色決勝負。類似今日的擲骰子。 |'
