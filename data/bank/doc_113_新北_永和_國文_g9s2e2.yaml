    content: fh
  group_stem: '114 年永和國中小小說書人的說書劇本，將以韓信「明修棧道，暗度陳倉」為故事內容

    講稿：韓信奇謀定三秦

    漢王劉邦拜韓信為大將軍，決意東出巴蜀，收復關中。然而，通往關中的棧道已被燒毀，正面強攻勢必損失慘重。韓信命人招募了大量的腳夫(a)和苦力，聲勢浩大地開始修復棧道。每天，挑夫(b)們肩扛木材，往來於山谷之間，敲打聲、號子聲響徹雲霄，引得關中守將章邯派出的仵作(c)頻頻探查回報。

    章邯聽聞漢軍大舉修復棧道，心中暗笑劉邦愚蠢，沒有延請西席(d)賢達從長計議，竟然想從這天險之地進攻。他遂將主力部隊部署在棧道沿線，嚴加防守，卻不知漢軍的真正意圖。

    與此同時，韓信暗中挑選一支精銳部隊，避開大道，神速地翻越秦嶺的崇山峻嶺。韓信還安排一些看似普通的店小二(e)和茶房(f)，在沿途的偏僻小道上開設簡陋的茶棚，表面上是為過路客提供茶水歇腳，實際上卻是負責探路和傳遞情報。一旦發現可疑人物，這些眼線便會及時向後方捕快(g)出身的梨園(h)匯報。

    這日，部隊行至一處山谷，一名士兵不慎摔傷了腿。韓信連忙派人尋找附近是否有郎中(i)可以醫治。幸運的是，在一個偏僻的小村莊裡，找到了一位經驗豐富的老人家，為傷兵敷藥包紮。

    經過數日的艱苦跋涉，韓信的奇兵終於繞過了章邯的主力防線，神不知鬼不覺地出現在陳倉城下。陳倉守將萬萬沒想到漢軍會從這個方向出現，毫無防備。漢軍士氣高昂，在韓信的指揮下，迅速發起了猛烈的進攻。城牆上的秦兵慌亂應戰，但終究抵擋不住漢軍的攻勢。很快，陳倉城就被攻破。'
