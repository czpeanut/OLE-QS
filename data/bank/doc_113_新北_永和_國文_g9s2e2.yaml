  page: 5
  stem: 這篇文章主要想傳達的理念是：
  options:
  - label: A
    content: 多參與海洋活動，了解海洋生態
  - label: B
    content: 提高環保意識，以行動守護海洋
  - label: C
    content: 海洋汙染源自工業發展，無法避免
  - label: D
    content: 保護動物就是保護人類自身
  group_stem: '蔚藍的海洋是地球的寶藏，孕育無數生命，也是人類賴以生存的重要資源。然而，隨著塑膠污染日益嚴重、工業廢水傾倒、過度捕撈等問題，海洋正面臨前所未有的危機。漂浮的垃圾不僅傷害了魚群與海龜，也可能透過食物鏈回到人類餐桌，威脅我們的健康。

    我們應該從生活中培養環保意識，例如：減少使用一次性塑膠製品、自備購物袋與水壺、不亂丟垃圾。到海邊遊玩時，也要帶走自己的垃圾，甚至多撿幾件，讓大海多一分潔淨。

    此外，參加淨灘活動、關注海洋議題、選擇永續漁獲，都是實踐愛海行動的具體方式。每一個小小的選擇，都可能帶來大大的改變。守護海洋，其實不難，只要願意開始。

    讓我們從現在做起，用行動表達對大自然的尊重，為海洋注入希望，也為地球留下一片清澈湛藍的未來。

    ——〈守護海洋，從你我做起〉'
