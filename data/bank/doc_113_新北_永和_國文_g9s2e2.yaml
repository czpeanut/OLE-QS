  stem: 依照規則，牌卡盡出之後，第一關是哪一組最有可能成為冠軍？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 無人勝出
  group_stem: '永和國中詩人節舉國文知識闖關比賽，尋找永和國中的文學小天才


    詩句解碼 比賽規則

    ★三組決賽組必須通過兩關的測試，第一關是牌卡抽抽樂，第二關是韻文知識是非搶答題。

    第一關 牌卡抽抽樂 撥開詩文的迷霧，解鎖詩文裡的文學大家身份

    ❶隨機發放決賽各組2 張牌卡，關主依照第一張與第二張的順序秀出詩文牌卡，決賽各組判斷出關主牌卡所指涉的人物，在規定時間內，各組將自己所拿到的牌卡，找出與關主的牌卡詩文所指涉的人物相同，即可出牌相合，兩張牌卡都能夠相合，即為第一關的勝出者。

    ❷由於牌卡是隨機發放，此關亦有可能沒有任何組別勝出。

    第二關 是非搶答題

    ❶關主念出螢幕上的題目，各組進行搶答，回答正確者該組加1 分，回答錯誤者則扣1 分。

    ❷若是第一關勝出者，優先領取1 分，而是非搶答得分數最高者，即為本競賽活動的冠軍。


    第一關 牌卡抽抽樂

    關主所持有的牌卡

    | 關主牌卡 | 第一張 | 第二張 |

    |---|---|---|

    | | 惻隱之心，仁之端也；羞惡之心，義之端也；辭讓之心，禮之端也；是非之心，智之端也。 | 英傑那堪屈下僚？使栽門柳事蕭條。鳳凰不共雞爭食，莫怪先生懶折腰。
    |


    決賽各組被分到的牌卡情形如下

    決賽甲組：

    世上瘡痍，詩中聖哲；民間疾苦，筆底波瀾。

    千年前為秋風所破的茅屋／剩日下的竹影搖曳／我小立在那座新築新修的草堂／遙想當年你如何扶杖嘆息，忍聽／兒童抱茅的嬉鬧，下一刻／隨手將一襲蕭然的長衫／掛進唐詩富麗的書櫥裡


    決賽乙組：

    誰知我去魯十四年／都化作臨河的一句／長嘆／還不如歸去！修《詩》《書》／作《春秋》，含笑，栽植／那七十二株等待茂盛的杏樹

    功蓋三分國，名成八陣圖，江流石不轉，遺恨失吞吳。


    決賽丙組：

    那老子彭澤縣懶坐衙／倦將文卷押／數十日不上馬／柴門掩上，咱／籬下看黃花／愛的是青山綠水／見一個白衣人來報／來報五柳莊安靜煞！

    民為貴，社稷次之，君為輕。


    第二關 是非搶答題答題情形如下

    | | 搶答組別 | 問題 | 回答 |

    |---|---|---|:---:|

    | 1 | 乙 | 詞只有中調與長調會有上下片，小令因為字數少，故無下片。 | ○ |

    | 2 | 甲 | 漢代樂府詩與古詩皆可換韻，對仗與平仄皆沒有任何的限制。 | ╳ |

    | 3 | 丙 | 詞依照詞牌規定整首詞的對仗、平仄、押韻、字數，可入樂。 | ○ |

    | 4 | 乙 | 詞牌與曲牌相似，可以藉由詞牌了解該詞或該曲的內容主旨。 | ○ |

    | 5 | 丙 | 宋詞與元曲也稱樂府，格律押韻是沿用漢朝官署的規定而來。 | ○ |'
