  stem: '侍女將預備張貼的門聯「幽窗棋罷指猶涼」拿在手邊，卻不小心將另一聯，又與黛玉剛剛完成七律的其中三句弄混，未歸位的四個詩句分別是：秋閨怨女拭啼痕/寶鼎茶閒煙尚綠/月窟仙人縫縞袂/借得梅花一縷魂

    黛玉七律詩句如下：

    半卷湘簾半掩門，碾冰為土玉為盆。偷來梨蕊三分白，□□□□□□□。

    △△△△△△△，○○○○○○○。嬌羞默默同誰訴，倦倚西風夜已昏。

    試問依照詩作格律與門聯張貼的原則，下列何選項的做法是正確? 【對偶】'
  options:
  - label: A
    content: 由七律中的韻腳所判斷，△△△△△△△應為「借得梅花一縷魂」
