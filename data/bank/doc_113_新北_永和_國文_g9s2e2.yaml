  section: 2
  number: 31
  type: single
  page: 5
  stem: 下列對於本篇甲乙文，其文意說明何者正確？
  options:
  - label: A
    content: 【甲】文吳、越表達的是同舟敵國的概念，表示身為國君要知道自己是權力的最高核心，十分孤單，要時刻防備眾叛親離的情況，給予左右親信足夠恩惠賞賜，以防叛變
  - label: B
    content: 【乙】文中大家發現孫必振為金甲神轉世，眾人幫助孫必振登上小船，面對突如其來的風雨天譴，眾人發揮同舟共濟的精神展現，結局是其他人看見孫必振消失於茫茫大海
  - label: C
    content: 【甲】文比喻說明一舟之人皆心懷鬼胎，並用【乙】文同舟敵國的概念反思，眾人沒有等孫必振的回答，眾人將其推到相對安全的小船避難，充分展示人性的光輝動人之處
  - label: D
    content: 【乙】文說的是以【甲】文表達同舟共濟的概念反思，而因為同舟之人認為上天的指示，因而產生出一個出人意表的結局，而眾人與孫必振的命運強烈對比並以此發人深省
  group_stem: '【甲】《孫子‧九地》提到：「夫吳人與越人相惡也，當其同舟而濟，遇風其相救也如左右手。」有趣的是，另一個軍事家吳起也以舟為喻，說出另一番道理。吳起和魏武侯泛舟西河，魏武侯說：「你看，山河險固，何等壯麗！這是魏國之寶啊！吳起則認為，國家穩固「在德不在險」，他說：「若君不修德，舟中之人盡為敵國也。」吳起警告魏武侯，若不修德，最親近的同舟之人，都會變成仇敵。所以，共處一舟，到底是化敵為友，還是反目成仇，其實很難說。
    —— 香港《明報》洪若震教授專欄

    【乙】孫必振渡江，值大風雷，舟船蕩搖，同舟大恐。忽見金甲神①，手持金字牌，下示諸人。共仰視之，上書「孫必振」三字，甚真。謂孫：「必汝有犯天譴，請自為一舟，勿相累！」孫尚無言，眾不待其肯可②，視旁有小舟，共推置其上。孫既登舟，回首，則前舟覆矣
    ——《聊齋誌異‧孫必振》

    ①金甲神：穿金甲的神人，民間傳說中的護法神將。②肯可：贊成，同意。'
