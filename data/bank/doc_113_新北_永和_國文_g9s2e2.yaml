  stem: '閱讀以下詩句，先找出詩句與表格內的粗體字之文意的對應配對，再找出最能符應地理環境的景況與描寫當時社會現象的組合，請問下列哪一組選項的組合最為正確？

    【甲】雪浪排空小艇橫，紅毛城勢獨崢嶸。渡頭更上牛車坐，日暮還過赤崁城。

    【乙】蔗田萬頃碧萋萋，一望蘢蔥路欲迷。細載都來來，只留蔗葉餉群犀。

    【丙】 金錢靡費萬千償，何不存留備救荒？生渡方為舍人渡鬼總茫茫。

    【丁】文身舊俗是雕青，背上盤旋鳥翼形。一變又為蛇神牛鬼共猙獰。'
