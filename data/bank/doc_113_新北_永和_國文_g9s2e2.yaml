    content: 丫鬟們把「幽窗棋罷指猶涼」在瀟湘館大門的左邊謹慎黏貼起來
  - label: C
    content: 依照對仗規則，「寶鼎茶閒煙尚綠」與□□□□□□□是同一聯
  - label: D
    content: 「月窟仙人縫縞袂」與「幽窗棋罷指猶涼」應是門聯上下聯詩句
