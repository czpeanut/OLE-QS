  stem: 「此木以不材得終其天年」此句的核心思想是「無用之用，是為大用」，也就是說：看似無用，反而能成就最大的功用，因為它保全了自己、遠離禍害。下列哪一句與「此木以不材得終其天年」的意思最相近？
  options:
  - label: A
    content: 人無遠慮，必有近憂
  - label: B
    content: 塞翁失馬，焉知非福
  - label: C
    content: 反璞歸真，外圓內方
  - label: D
    content: 處下不爭，故無所敗
  group_stem: '莊子行於山中，見大木枝葉盛茂，伐木者止其旁而不取也。問其故，曰：「無所可用。」莊子曰：「此木以不材①得終其天年。」夫子出於山，舍於故人之家。故人喜，命豎子殺雁而烹之。豎子②請曰：「其一能鳴，其一不能鳴，請奚殺？」主人曰：「殺不能鳴者。」明日，弟子問於莊子曰：「昨日山中之木，以不材得終其天年，今主人之雁，以不材死；先生將何處？」莊子笑曰：「周將處乎材與不材之間。材與不材之間，似之而非也，故未免乎累。若夫乘③道德而浮游則不然，無譽無訾④，一龍一蛇，與時俱化，而無肯專為；一上一下，以和為量，浮游乎萬物之祖，物物⑤而不物於物，則胡可得而累邪！此神農、黃帝之法則也。若夫萬物之情，人倫之傳，則不然。合則離，成則毀；廉則挫，尊則議，有為則虧，賢則謀，不肖則欺，胡可得而必乎哉！悲夫！弟子志之，其唯道德之鄉乎！」
    ——《莊子 ‧ 山木》

    【注釋】①不材：謂不具備良材的質地。 ②豎子：僮僕。 ③乘：順。浮游：謂遊於至虛之境。 ④訾：毀謗，非議。⑤物物：視外物為物。物於物：為外物所役使。於，被。'
