  section: 1
  number: 47
  type: single
  page: 2
  stem: 所謂的「迷思」（myth）是指看似合理，實則不合理的錯誤想法。社會上對性騷擾、性侵害總是有許多迷思，造成受害者再一次的傷害。下列這些網友留下的評論，何者沒有對性騷擾、性侵害的迷思?
  options:
  - label: A
    content: 小玉：「性騷擾受害者穿著太暴露才會招致色狼靠近，他們自己應該要保護好自己。」
  - label: B
    content: 阿緯：「男性也會被性侵害，只是相較女性，大部分的男性受害者更不敢對外求助。」
  - label: C
    content: 宗瑞：「有時候對方只是為了表達欣賞才摸一下，沒有惡意。大家不應該過度反應。」
  - label: D
    content: 學恆：「會被性騷擾表示這個人的外貌條件不錯，受害者應該要因此覺得高興才對。」
