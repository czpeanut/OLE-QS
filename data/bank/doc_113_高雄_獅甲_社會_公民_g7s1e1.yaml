  stem: 2014 年，法國的布托市市長曾經在開學時送給每個小學生一份禮物，女孩獲得粉紅色背包，裡面裝著飾品DIY 的說明書，男孩則獲得藍色背包，裡面裝著機器人組裝的說明書。市長的一番好意後來竟遭來不少批評，下列哪一種批評所持的論點是最合理的？
