  stem: 在人類歷史中，許多暴力衝突與迫害都以種族為區分，造成對人權的嚴重侵害，因此世界各國組織了聯合國，並在1948 年發表了一份重要文件，以保障人權、維護世界和平。這份文件是什麼？
