  section: 1
  number: 44
  type: single
  page: 2
  stem: '儷雅應徵了許多工作，幸運地錄取了其中四家企業，但在考慮要去哪一家報到時，竟發現有多家企業的規定有性別歧視的疑慮，因此便選擇唯一沒有疑慮的企業去報到了。下列是這四家企業的規定，哪一家最有可能是儷雅去報到的企業？


    * 出外勤：指離開公司、辦公室等室內空間工作，例如外出拜訪客戶，或者外送、外出修繕等。'
  options:
