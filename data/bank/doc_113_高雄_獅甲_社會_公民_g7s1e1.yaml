  section: 1
  number: 40
  type: single
  page: 1
  stem: 在《性騷擾防治法》當中對「性騷擾」的定義是以明示或暗示的方式，從事不受歡迎且具有性意味或性別歧視的騷擾言詞或行為，或以性或性別有關的行為影響他人學習、工作的權益。從前述定義判斷，下列哪一種情況不屬於性騷擾？
  options:
  - label: A
    content: 教師安排打掃工作時，不考慮性別，要求男女都需掃廁所
  - label: B
    content: 學生在下課時間，故意當眾發出令人感到不舒服的呻吟聲
  - label: C
    content: 學生告白被拒絕後，仍鍥而不捨傳訊息給對方，要求回應
  - label: D
    content: 體育老師對不愛打球的男學生說：「這樣算什麼男人！」
