  section: 1
  number: 46
  type: single
  page: 2
  stem: 葉老師在公民課時，希望學生能透過課程了解到「積極參與公共事務」這項公民德性的重要性，所以他想在課堂中引用名人的名言，讓這個概念更具說服力。請問他應該引用下列哪一句名言？
  options:
  - label: A
    content: 耶林：「為權利而鬥爭，是所有具有權利的人所應盡的義務。」
  - label: B
    content: 伏爾泰：「我不同意你的説法，但我誓死捍衛你説話的權利。」
  - label: C
    content: 柏拉圖：「不關心政治的懲罰，就是將來會被糟糕的人統治。」
  - label: D
    content: 泰戈爾：「權力把受害者的百般苦惱看成是忘恩負義的表現。」
