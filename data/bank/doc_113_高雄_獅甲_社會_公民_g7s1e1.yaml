  stem: 一名具有獅甲國國籍的懷孕婦女到太乙國的領土範圍內生小孩。依據兩國的法律，她的小孩在出生時將呈現無國籍的狀態。由此判斷，獅甲國、太乙國的法律對國籍取得的規定，分別採取何種原則？
