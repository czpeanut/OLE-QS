  stem: 媒體報導，日本私立東京醫科大學在入學考試時竄改考生成績，將女性考生的成績扣分，並將男性考生的成績加分，以降低女性入學的比例。這樣對性別進行差別待遇的作法，若是發生在我國，已然違反某部法律規定。下列哪一個情況最可能違反與前述相同的法律？
  options:
