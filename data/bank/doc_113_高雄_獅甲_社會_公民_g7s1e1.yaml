  section: 1
  number: 48
  type: single
  page: 2
  stem: 教育部公布全國大專院校的「學生權利調查報告」，指出我國整體大專學生權利的平均指標高達94%，但多個學生團體認為這項調查報告背離現實。臺大身心障礙學生權益促進會的會長說，身障學生的食、住、行都因為校園內缺少站在使用者經驗思考的無障礙設施而顯得困難重重；臺大原住民學生反歧視行動小組成員也表示，就算保障學生有權利可以因為歲時祭儀*而請假，實際上原住民族學生還是會在請假時遭到刁難與歧視，而這些都是調查報告裡看不到的。從前述內容判斷，下列推論何者最合理？
  options:
  - label: A
    content: 該份報告的結果顯示，弱勢群體的人性尊嚴未能得到完整保障
  - label: B
    content: 促進會會長認為目前校園內的環境讓身心障礙學生覺得被排斥
  - label: C
    content: 原住民學生可以因為歲時祭儀而請假是法律給予原住民的特權
  - label: D
    content: 臺大是全國最不重視原住民族學生與身心障礙學生權益的大學
