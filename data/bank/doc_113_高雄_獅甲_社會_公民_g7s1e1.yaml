  section: 1
  number: 49
  type: single
  page: 2
  stem: 勞動部公布2024 年的同酬日，如圖（一）所示。所謂「同酬日」是指女性受僱者在前一年工作一整年之後，還需要額外工作幾天才能得到和男性前一年工作一整年相同的薪資。根據同酬日的定義與圖中內容，下列分析與因應策略何者最適切？
  options:
  - label: A
    content: 我國兩性勞動者在職場上的薪資報酬已日趨平等
  - label: B
    content: 顯示女性受僱者在職場上承擔的責任比男性還重
  - label: C
    content: 政府應提高女性受僱者的基本薪資以改善不同酬現象
  - label: D
    content: 企業應落實《性別平等工作法》以確保職場性別平權
