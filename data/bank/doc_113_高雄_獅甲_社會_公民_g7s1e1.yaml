  type: single
  page: 1
  stem: '臺灣同志諮詢熱線協會於2023 年公布臺灣同志*職場處境調查結果，雖然超過一半的同志受訪者會向同事出櫃*，但是因為擔心遭受職場霸凌或影響升遷，只有不到三成的受訪者願意向主管出櫃，這顯示同志在職場上仍然難以真正做自己。下列哪一個敘述最符合同志在職場上的處境？


    * 同志：非異性戀者。

    * 出櫃：向他人坦承性傾向。'
  options:
