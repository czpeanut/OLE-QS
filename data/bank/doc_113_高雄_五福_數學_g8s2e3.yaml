- id: doc_113_高雄_五福_數學_g8s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '乒乓一班，上完數學課，下課時熱烈討論著:

    大頭說:對角線等長的四邊形只有正方形與矩形；

    莎莎說:二條直線被一直線所截，會有同位角、內錯角、同側內角，同側內角相加一定是 180 度；

    小林說:有一雙對邊平行且等長四邊形一定是平行四邊形；

    甜甜說:等腰梯形的面積是 $\frac{1}{2}$（兩腰的中點連線段長 $\times$ 高）；

    東東說:箏形的面積是 $\frac{1}{2}$（對角線 $\times$ 對角線）；

    小昕說:對角線互相垂直平分的四邊形是菱形。

    請問這六人的說法，正確的有幾人?'
  options:
  - label: A
    content: 1 人
  - label: B
    content: 2 人
  - label: C
    content: 3 人
  - label: D
    content: 4 人
  tags:
    chapter:
      publisher: 翰林
