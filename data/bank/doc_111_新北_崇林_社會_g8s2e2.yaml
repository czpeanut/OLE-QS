    毫克，或血液中酒精濃度達0.05％以上，即觸犯公共危險罪，處2 年以下有期徒刑，得併科20 萬元以下罰金；之後修法增加為處三年以下有期徒刑，得併科三十萬元以下罰金。


    關於刑法第185-3 條之不能安全駕駛罪（公共危險罪章）的說明，下列敘述何者錯誤？'
