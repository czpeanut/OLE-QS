  section: 1
  number: 45
  type: single
  page: 5
  stem: 資料(ㄅ)美國總統羅斯福如此氣憤發表《國恥演說》主要是因為下列哪一個事件？
  options:
  - label: A
    content: 九一八事變
  - label: B
    content: 七七事變
  - label: C
    content: 西安事變
  - label: D
    content: 珍珠港事變。
  group_stem: '請根據下述資料回答45~48 題：

    (ㄅ)美國總統羅斯福《國恥演說》：「昨天◎◎─它將永遠成為國恥日─美利堅合眾國遭到了日本帝國海空軍預謀的突然襲擊。美國當時同該國處於和平狀態，而且應日本的請求，仍在同它的政府和天皇進行對話，以期維持太平洋的和平。……不論要用多長的時間才能戰勝這次預謀的侵略，美國人民興正義之師必將贏得徹底勝利。……我要求國會宣佈，自◎◎日本對我國無端進行卑鄙的進攻，美國同日本帝國之間已處於戰爭狀態。」

    (ㄆ)蔣中正發表〈告抗戰全體將士書〉：「這次□□事變，日本用了卑劣欺騙的方法，佔據了我們的北平、天津，殺死了我們的同胞百姓，奇恥大辱，無以復加，思之痛心。自從九一八以後，我們愈忍耐退讓，他們愈兇橫壓迫，得寸進尺，了無止境，到了今日，我們忍無可忍，退無可退了。我們要全國一致起來與倭寇拚個他死我活！」

    (ㄇ)《朝日新聞》特派記者今井正剛：『一眼望去，前面是由漆黑的屍體層層堆積起來的山。在屍體之間，有50 到100 個左右的人影在挪動，他們把屍體拖到江邊後扔進去。掙扎的呻吟，流淌的血，抽筋的手腳。不久，完成工作的「苦力們」在河岸被排成一列。「噠、噠、噠……」機關槍的槍聲響起。根據在場的某軍官的說法，僅僅這次的犧牲者數量就有「大約兩萬人左右」』。

    (ㄈ)《為抗日救國告全體同胞書》⋯⋯我國家我民族已處在千鈞一發的生死關頭。⋯⋯無論各黨派間在過去和現在有任何政見和利害的不同，無論各界同胞間有任何意見上或利益上的差異，無論各軍隊間過去和現在有任何敵對行動，大家都應當有「兄弟鬩於墻外禦其侮」的真誠覺悟，首先大家都應當停止內戰，以便集中一切國力（人力、物力、財力、武力等）去為抗日救國的神聖事業而奮鬥。'
