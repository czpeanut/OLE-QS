- id: doc_113_台中_居仁_社會_公民_g7s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 為了讓國際更了解我國文化，政府機關精選百名「青年大使」，由資深官員親自帶隊，各自前往不同的國家訪問及互動。這些青年大使在專家指導下，學習如何在各國面前進行各種演出，包括原住民、現代舞蹈、歌仔戲、電音三太子等，向全球積極介紹我國文化的美好及活力。下列有關上述「青年大使」出訪活動的敘述，何者最為適切？
  options:
  - label: A
    content: 進行各種演出能有使文化永續發展
  - label: B
    content: 與其他國家進行互動符合文化交流
  - label: C
    content: 到不同國家訪問對於文化創新不利
  - label: D
    content: 對他國進行訪問能夠避免文化衝突。
