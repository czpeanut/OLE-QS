  type: single
  page: 1
  stem: 在傳統社會觀念裡，打電動的孩子被認為是不愛唸書的不良少年，而被貼上負面標籤，而電競活動則被認為是青少年間流行的次文化。但到了今天，我國於2014 年開始發展電競教育，2022
