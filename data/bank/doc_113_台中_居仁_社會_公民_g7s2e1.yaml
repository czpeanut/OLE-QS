  stem: 歷經日治、國民黨統治，以及解嚴後的幾度政黨輪替，臺灣民眾在不同時代對「國語文」的認知相當錯亂。日本統治者欲消滅漢文，國民黨則是先禁說日語，後來又禁臺灣話（包括閩南語、客語及原住民語），而近來執政黨又大力推廣本土語言及母語教學。關於在不同執政階段的臺灣語言發展，下列敘述何者最正確？
  options:
