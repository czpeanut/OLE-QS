  section: 1
  number: 17
  type: single
  page: 2
  stem: 「艋舺青山王遶境」是臺北萬華地區重要的廟會活動，青山王原本是泉州惠安人的地方信仰，經過多年發展成為地方上重要的宗教活動，為了讓民眾真正了解此活動的內涵，有民間團體舉行收費式的導覽活動，讓參加導覽的成員能近距離接觸陣頭儀式、深入了解遶境文化，希望能達到此文化活動代代流傳的目的。關於上文所述，下列說明何者最正確？
  options:
  - label: A
    content: 遶境活動是弱勢文化的展現
  - label: B
    content: 導覽活動採取收費方式將會形成文化位階的現象
  - label: C
    content: 文中的導覽活動，是透過了解多元文化來落實文化傳承
  - label: D
    content: 廟會屬次文化活動，須透過文化位階提升才能成為主流文化。
