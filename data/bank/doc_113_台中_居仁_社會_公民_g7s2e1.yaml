- id: doc_113_台中_居仁_社會_公民_g7s2e1_s1_40
  section: 1
  number: 40
  type: single
  page: 4
  stem: "下文所提及「導致粽子供不應求」的原因最能凸顯文化具有何種特性？\n\n    每年因為端午節的到來，民眾都會應景買粽子吃，導致粽子供不應求。而粽子的口味也很多樣，有北部粽、南部粽，近幾年甚至還比創新，像是有糕餅師傅用麵包取代糯米，做出造型逼真的麵包粽。\n\
    註：供不應求是指供應不能滿足需求，形容某種事物的需求量很大，但供應不足的意思。"
  options:
