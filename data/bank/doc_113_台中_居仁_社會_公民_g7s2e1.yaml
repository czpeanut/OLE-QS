  stem: 請問：文中巫童悲劇的發生，主要反映出下列何種現象？
  options:
  - label: A
    content: 強勢文化導致文化位階
  - label: B
    content: 落後的文化會侵害人權
  - label: C
    content: 民眾行為會受社會規範影響
  - label: D
    content: 法律改變不合時宜的宗教信仰。
  group_stem: "非洲部分地區，有宗教團體灌輸民眾邪靈可能會附身於孩童的觀念，而被附身的孩子通常被稱為「巫童」，會為家庭帶來災難、貧困和疾病，信徒對此深信不疑。\n\
    \    一旦被當地宗教人士判定為巫童，不論年紀多小，都可能會遭遺棄而流落街頭，或由宗教人士向父母收取高額費用，為孩子舉行驅魔儀式。驅魔過程中，父母會被要求凌虐巫童，因為宗教人士認為巫童越痛苦、哭喊聲越大，就表示驅魔越成功。近年巫童問題受到國際關注，有些人權團體投入宣導及教育相關工作，希望藉由知識的推廣改正迷信行為，進而達成保護孩童的目的。"
