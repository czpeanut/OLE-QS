  stem: "立法院於2023 年通過《性別平等教育法》修正案，下列是一篇相關專題報導：\n    在傳統尊師重道觀念，以及要求教師恪守專業倫理下，師生戀被視為一種禁忌。隨著近年國內掀起\
    \ #MeToo 風潮，關於「師生戀」的倫理爭議再次浮出水面，政府決定修訂《性別平等教育法》，針對各界關注的師生戀，和未成年學生一律禁止，若是和成年學生，則明訂師長不得利用「不對等權勢」發展親密關係。\n\
    根據上文所述內容判斷，下列敘述何者最為正確？"
