- id: doc_113_台中_居仁_社會_公民_g7s2e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 早期我國《民法》規定，子女姓氏須隨父姓，後來改為「父母以書面約定子女從父姓或母姓」，以落實性別平等。但根據調查，現今我國多數夫妻仍以遵循傳統習慣讓子女從父姓居多，只有少數會讓子女從母姓。根據上述內容與社會規範概念判斷，有關我國子女姓氏的敘述何者正確？
  options:
  - label: A
    content: 社會生活方式的改變，僅依靠法律就足夠
  - label: B
    content: 《民法》的修改屬於器物層次的改變
  - label: C
    content: 此議題風俗習慣對人們的影響更甚於法律
  - label: D
    content: 國家以法律的強制力禁止子女從父姓。
  tags:
    chapter:
      publisher: 翰林
