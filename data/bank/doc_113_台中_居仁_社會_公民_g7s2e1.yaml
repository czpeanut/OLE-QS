  type: single
  page: 4
  stem: "蓉蓉在網路上查到一段資料：\n    在韓國，初次見面的第一個問題通常就是問對方幾歲，因為韓國人非常重視「長幼有序」，一定要同年出生才能稱為「朋友」。韓文中對於長輩或年紀比自己大的人要用敬語，但對晚輩、年紀比自己小的人則要用半語。\n\
    上述內容所展現出來的文化特性，與下列何者所代表的文化特性最相關？"
  options:
  - label: A
    content: 每個文化都有慶祝結婚的儀式
  - label: B
    content: 在台灣和日本參加婚禮，贈送的禮金袋顏色不同
  - label: C
    content: 到了現代除了紙本喜帖，也發展出電子喜帖
  - label: D
    content: 參加婚禮時，多數人會遵守包禮金給新人的習俗。
