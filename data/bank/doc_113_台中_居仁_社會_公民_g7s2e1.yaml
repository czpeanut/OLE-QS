  - label: A
    content: 第一組：「韓國--擁有壯麗的山脈與四季分明的氣候，結合現代都市與傳統韓屋村，展現獨特的韓流文化。」
  - label: B
    content: 第二組：「瑞士--以阿爾卑斯山的壯闊雪景聞名，湖泊與綠意盎然的草原交織成如童話般的風景。」
  - label: C
    content: 第三組：「美國--地貌多變，從大峽谷的壯觀岩壁到紐約的摩天大樓，展現無限可能與多元文化。」
  - label: D
    content: 第四組：「土耳其--擁有歐亞交匯的文化風情，奇幻的卡帕多奇亞熱氣球與伊斯坦堡藍色清真寺令人驚艷。」
