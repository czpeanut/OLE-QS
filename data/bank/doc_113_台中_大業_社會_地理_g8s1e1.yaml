- id: doc_113_台中_大業_社會_地理_g8s1e1_s2_44
  section: 2
  number: 44
  type: single
  page: 4
  stem: 標題中的兩個危機是指什麼？(甲)高齡化、(乙)少子化、(丙)性別比失衡、(丁)人口壓力大
  options:
  - label: A
    content: 甲、乙
  - label: B
    content: 乙、丙
  - label: C
    content: 丙、丁
  - label: D
    content: 甲、丁
  group_stem: "動搖中國國力的兩個危機正在共振\n  2016 年，中國正式實施一對夫婦最多可以生育兩個孩子的「全面二胎政策」，一時間的生育政策改變，使得當年中國的出生人口達1,786\
    \ 萬人(出生率12.95‰)，創下本世紀新高。然而，從隔年起出生人口即不斷下降，2017 年為1,723 萬人(出生率12.43‰)，至2021 年已下降至1,062\
    \ 萬人(出生率7.52‰)。若從更長的時間段來看，中國的出生人口在本世紀前20 年，比上一個世紀的最後20 年少出生了10,375 萬人，減少幅度約1/4。\n\
    \  然而，在中國出生人口與出生率不達預期的同時，老年人口比例及數量卻皆呈現上升的趨勢。2000 年中國老年人口比例達7%；到2022 年底中國65 歲以上人口將達到總人口的14%。中國人口老化的速度，遠快於世界許多主要的高度發展國家！\n\
    \  中國在人口老化加速的同時，人口出生數量也不斷降低。如果在未來幾年不能大幅提升生育，所導致的人口結構變動，或將造成勞動力日益不足，給整個中國的社會與經濟帶來巨大負擔。回答44～45\
    \ 題：\n參考來源：文龍(2020.07.22)。動搖中國國力的兩個危機正在共振。看中國。\nhttps://www.secretchina.com/news/b5/2020/07/22/940328.html"
