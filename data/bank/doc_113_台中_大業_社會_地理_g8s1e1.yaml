  group_stem: "尤溪聯合梯田\n 包含聯合、聯東、聯南、聯西、東邊、雲山、下雲、連雲等8 個行政村，面積達萬畝。所有梯田都修築在丘陵地上，綿延數十里，堪稱是中國五大魅力梯田之一。梯田除種植稻米外，更有美麗的茶園片片。冬季溫度約14℃，涼爽舒適，是適宜旅遊的地點。\n\
