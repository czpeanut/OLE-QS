- id: doc_113_新北_土城_國文_g9s1e1_s2_30
  section: 2
  number: 30
  type: single
  page: 3
  stem: 若要為本文下一個副標題，下列何者最能切合文意？
  options:
  - label: A
    content: 一定要學會的走路技巧
  - label: B
    content: 與跑步對話的入門書
  - label: C
    content: 有愛無礙的力量
  - label: D
    content: 快與慢平衡的生命。
  group_stem: "我提過好幾次古代東方有一種建築非常重要，就是亭子的「亭」。爬山不可能一口氣衝到山頂，所以「亭」是一個很重 要的提醒：就是你應該要停下來了，不要匆匆趕路。你用生命趕路其實是不值得的，因為生命應該停下來做很多的觀賞，體會很多的感受，留一些跟自己對話的空間。\n\
    \    我想人生就像馬拉松賽跑，需要儲蓄你的生命力量，才能跑得長久，撐到終點，如果衝太快大概很快就完蛋了。先進國家在城市裡特別設計出人行步道，來提醒我們、鼓勵我們、或者建議我們：你可以有車子，可是你也可以不開車子。這就是我提到的美學基本規則──你有，而你可以不用，才是美。我想特別強調，快不一定是美，有時候慢下來才是美。一個緩慢的心情，一種跟物質緩慢接觸的情感，才有可能變成我們自己重新在生活中找回美的一種態度。\n\
    （節錄自蔣勳〈行之美〉）"
