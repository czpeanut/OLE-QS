  - label: D
    content: 人飢己飢，人溺己溺。
  group_stem: '陳竹吟，嘗館一富室，有小女奴，聞其母行乞於道，餓垂斃，陰盜銀三千與之，為儕輩所發，鞭箠甚苦。富室樓有狐，借居數十年，未嘗為祟。是日女奴受鞭時，忽樓上哭聲鼎沸，怪而仰問，聞聲應曰：「吾輩雖異類，亦具人心，悲此女年未十幾，而為母受箠，不覺失聲，非敢相擾也。」主人投鞭於地，面無人色者數日。

    (紀曉嵐《閱微草堂筆記》)'
