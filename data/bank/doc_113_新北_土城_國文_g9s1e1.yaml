    \ 組，B 組預賽11月13 日開打，日本首戰在名古屋巨蛋與澳洲隊交手，臺灣隊首戰將於臺北大巨蛋迎戰韓國隊，接著14 日打多明尼加、16 日上演備「臺日大戰」、17\
    \ 日對澳洲、18 日與古巴交手。\n    賽事記者會公布票價資訊，臺北大巨蛋場次最貴票價為臺灣隊與日本、韓國的比賽，熱區票價3380 元，臺灣與日、韓比賽最便宜票價為內野一般區680\
    \ 元，臺灣隊其餘場次最貴票價3080 元、最便宜票價280 元。\n    另外推出大巨蛋限量套票13 日至18 日場次「就一起應援A 區」票價1 萬9080\
    \ 元、「內野中央區」套票票價1 萬2480元。大巨蛋限量套票中信卡友優先購於27 日中午12 時開賣，28 日中午12 時全面開賣，大巨蛋單場票卡友限區限量優先購10\
    \ 月3 日中午12 時開跑，10 月4 日中午12 時起全面開賣。\n（節錄自中央社〈一手新聞〉）"
