- id: doc_113_新北_土城_國文_g9s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 下列有關「宋詞」的選項，何者完全正確？
  options:
  - label: A
    content: 漢賦、今體詩、宋詞、元曲並稱為中國四大韻文。
  - label: B
    content: 詞可分為小令（五十八字以下）、中調（五十九至九十五字）、長調（九十六字以上）。
  - label: C
    content: 每闋詞的押韻是依詞牌規定，其對仗有一定限制。詞牌名則是根據詞的內容來做決定的。
  - label: D
    content: 詞產生在「曲子詞」之後，因為可以配樂歌唱，也稱「樂府」；又因句子長短不齊，所以又叫「長短句」。
  tags:
