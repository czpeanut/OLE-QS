- id: doc_113_新北_土城_國文_g9s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 「李清照是南渡前後的女詞人，是中國古典文學史上有崇高地位的天才女作家。她是遵守著詞的一切規律而創作的。她一面重視音律，精煉字句；同時，她的詞富於真實的性情與□□□□□。她生逢國變、家破人亡，她的筆下，雖沒有直接反映現實，但我們要知道她丈夫的死，她的流浪貧窮，她改嫁事件的受冤，都是那個亂離時代、封建社會直接給她的迫害。她正是當日一個受難者的代表；她的生活情感，也正是當日無數難民的生活情感。」《中國文學發展史》。下列各選項的描述，何者較適合填入空格處？
  options:
  - label: A
    content: 格律的要求
  - label: B
    content: 時代的眼淚
  - label: C
    content: 女子的才華
  - label: D
    content: 生活的表現。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 國文
      code: 第二課
      title: 詞選(一)虞美人(二)南鄉子登京口北固亭有懷
