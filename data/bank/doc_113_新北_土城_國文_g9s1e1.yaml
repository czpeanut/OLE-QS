- id: doc_113_新北_土城_國文_g9s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 「尋尋覓覓，冷冷清清，淒淒慘慘戚戚。乍暖還寒時候，最難將息。三杯兩盞淡酒，怎敵他，晚來風急。雁過也，正傷心，卻是舊時相識。滿地黃花堆積，憔悴損，如今有誰堪摘？守著窗兒，獨自怎生得黑？梧桐更兼細雨，到黃昏，點點滴滴。這次第，怎一個愁字了得。」對於李清照〈聲聲慢〉的解讀，何者錯誤？
  options:
  - label: A
    content: 這闋詞表現了作者內心的孤寂與愁苦之情
  - label: B
    content: 一開始連用疊字表達作者思鄉的心情
  - label: C
    content: 從詞句中可看出所描述的季節是秋天
  - label: D
    content: 「怎一個愁字了得」指「怎麼能用一個愁字說盡心中感情」
  tags:
    chapter:
      publisher: 翰林
      book: 九上
