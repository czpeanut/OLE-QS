  stem: '(甲) 車子已開出成都路／猶聞浣花草堂的吟哦不絕／再過去是白帝城，是兩岸的猿嘯／從巴峽而巫峽心事如急流的水勢／一半在江上／另一半早已到了洛陽。

    (乙) 少年英雄的末路／聽四面戰士的歌聲／使丈夫落淚／連年征戰的天下／眼前只是起舞的姬妾／虞姬啊虞姬／與江山與美人訣別／要聽一聽男子的高歌／最後一戰的悲歌／是霸王的寂寞／霸王的愛。

    (丙) 要流淚成湘水／載著漁父的俚歌／跟大家一起醉了／跟大家一起睡了／嘔吐的穢物／弄髒你滿是香花的衣裳／草木零落／眾芳汙穢／這身體啊／在凋零前／要化作永清的江水。

    (丁) 南朝的時候／我打此經過／寫了幾首詩／和女子調笑／他們戲稱我為／帝王。歷史要數說我／亡國的罪愆／但是／我的罪／何止亡國？

