  page: 1
  stem: 關於李煜〈虞美人〉及辛棄疾〈南鄉子〉的敘述，下列何者正確？
  options:
  - label: A
    content: 「春花秋月何時了」表達外在美景帶給李煜內心的喜悅
  - label: B
    content: 「年少萬兜鍪，坐斷東南戰未休」說明辛棄疾的年少有為
  - label: C
    content: 「恰似一江春水向東流」以水喻愁，使抽象的情感更具體。
  - label: D
    content: 「天下英雄誰敵手？曹劉」指辛棄疾的能力足以媲美曹操、劉備。
