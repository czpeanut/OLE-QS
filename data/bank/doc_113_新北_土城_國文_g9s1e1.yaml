- id: doc_113_新北_土城_國文_g9s1e1_s2_29
  section: 2
  number: 29
  type: single
  page: 3
  stem: 根據作者想法，文文在明年會考後選填志願時，選擇媽媽建議她的高職資處科而放棄自己喜歡的時尚造型科，較不可能會是什麼原因？
  options:
  - label: A
    content: 經由媽媽介紹而對高職資處科產生興趣
  - label: B
    content: 突然發現自己對時尚造型不太理解也根本不喜歡
  - label: C
    content: 為了避免造成家庭衝突而聽命行事
  - label: D
    content: 認同資處科所學對將來的生涯發展較有幫助。
  group_stem: "人生無處不選擇\n    先打電動還是寫作業？先念研究所還是就業？先買房還是買車？先救女朋友還是媽媽？……人的一生，大抵怎麼出生、生在誰家不能選擇外，活著的每一天，都有許許多多的事情，排隊等著我們做出選擇。有些選擇讓人左右為難，因為沒有標準答案，而且後果得自負，無法轉嫁。世人則會根據你的選擇結果評價「你是誰」？\n\
    \    人只要活著，無論外在環境如何險峻，選項如何被剝奪，只要願意，還是可以選擇，只要願意承擔選擇的結果。我們之所以放棄選擇，是因為多數時候，我們不敢或無力承擔後果，於是放棄自己想選的選項，接受他人的選項，並以「沒得選」說服自己。再者，每一個表面選項的背後，隱藏著其他需要考慮的價值。做了某個選擇，不代表同意表面的答案，卻可能是理解並且同意該選擇背後代表的意涵。\n\
    \    放學後先讀書，而非打電動，雖然是母親的規定(期望)，做孩子的貌似沒得選(不然會被懲罰)而屈服。其實，當孩子選擇讀書時，代表選擇了不要和母親起爭執，選擇了維持和母親的關係和諧，而非破壞親子關係這一個答案。否則的話，大可以堅持選自己想選的，跟母親鬧翻，讓親子關係陷入爭執與分裂，以此堅持自己的主張/選擇。或是選擇「不聽話」，人坐在書桌前，書打開著，就是不讀書。\n\
    \n選擇的背後\n    每一個選擇背後，都代表著一套價值觀與世界觀。\n    母親規定孩子放學後先讀書，也許是考慮到選項背後可能造成的生涯發展的差異，而這套生涯發展想法，則是受制於社會結構與母親既有的生命經驗。同樣的，放學回家想先打電動再讀書的孩子，在這個選項背後，也許也有一套自己的道理支撐其選擇。為上一整天課已經很累了，想先打一下電動，當作緩衝與休息、讓自己放鬆一下，之後再好好讀書。\n\
    \    不同的選項背後的價值觀與世界觀，貌似彼此矛盾或對立，但並非完全不可溝通、討論，無法取得共識。如果兩造雙方出現選項看法的分歧時，不妨試著先行說明自己的選擇的理由，向不同意見者解釋清楚自己的選項背後的考量。在選擇之前，將各種選項的理由陳述清楚，即便不一定能化解對立或說服對方接受，至少能讓彼此了解雙方的差異，而不是放任對方自行腦補、想像。\n\
    \n選擇未必能盡如人意，關鍵是向世人展現自我\n    選擇的結果，未必總能盡如人意，甚至常常是屈服於不滿意的選項。然而，只要記得一件事情：選擇最重要的事情，不是選出讓自己世界滿意的答案，而是透過選擇的過程，向世界他人展現自己是誰？我這樣的人想要什麼？想活成什麼樣子？在乎的事情價值信念是什麼？因為這些，所以我做了什麼選擇？\n\
    \    我們的選項未必能夠勝出，但是，不代表自己不能透過選擇，告訴世人我的主張、我的選擇！選擇是身而為人、不同意見的人群可以在社會上共同生存，最寶貴且重要的特質。\n\
    (節錄自王乾任〈選擇未必能盡人意，關鍵是展現自我〉)"
  tags:
