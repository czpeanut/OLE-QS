  stem: 鳳凰做壽，蝙蝠為何沒有前去賀壽？
  options:
  - label: A
    content: 蝙蝠只在黑夜活動，白天無法前來
  - label: B
    content: 蝙蝠不服鳳凰的領導，故意與之作對
  - label: C
    content: 蝙蝠自認屬於獸類，不屬於禽類
  - label: D
    content: 蝙蝠長著獸腳，怕被其他禽類排斥。
  group_stem: '鳳凰壽，百鳥朝賀，惟蝙蝠不至。鳳責之曰：「汝居吾下，何踞傲乎？」蝠曰：「吾有足，屬於獸，賀汝何用？」一日，麒麟生誕，蝠亦不至，麟亦責之。蝠曰：「吾有翼，屬於禽，何以賀歟？」麟、鳳相會，語及蝙蝠之事，互相慨嘆曰：「如今世上惡薄，偏生此等不禽不獸之徒，真個無奈他何！」

    《笑林廣記》'
