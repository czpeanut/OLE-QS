- id: doc_113_新北_土城_國文_g9s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 王國維《人間詞話》:「詞至李後主而眼界始大，感慨遂深，遂變伶工之詞而為士大夫之詞。」下列何者是所謂的「士大夫之詞」？
  options:
  - label: A
    content: 花明月暗飛幹務，今肖好向郎邊去，剗襪步香階，手提金縷鞋。畫堂南畔見，向偎人顫。奴為出來難，教君恣意憐。
  - label: B
    content: 無言獨上西樓，月如鉤。寂寞梧桐深院鎖清秋。剪不斷，理還亂，是離愁。別是一般滋味在心頭。
  - label: C
    content: 臨風誰更飄香屑，醉拍闌干情味切。歸時休放燭花紅，待踏馬蹄清夜月。
  - label: D
    content: 曉妝初過，沉檀輕注些兒個，向人微露丁香顆。曲清歌，暫引櫻桃破。
  tags:
