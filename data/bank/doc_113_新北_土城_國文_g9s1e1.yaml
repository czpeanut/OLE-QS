- id: doc_113_新北_土城_國文_g9s1e1_s2_37
  section: 2
  number: 37
  type: single
  page: 4
  stem: 根據本文，所謂的「物極必反」，指的是什麼？
  options:
  - label: A
    content: 抓太緊反而容易失去
  - label: B
    content: 凡事應反其道而行
  - label: C
    content: 不計較任何利害得失
  - label: D
    content: 真心對待換來絕情。
  group_stem: "想談戀愛，請先學會獨立\n    我們渴望愛與被愛，並從另一半身上找到歸屬感，同時也不希望另一半用單方面自以為是的愛，扼殺各自的自由及隱私。兩個人之所以能交往是因為我們感到自在、快樂、完整。如果不是，那麼兩個人只是充其量在相互折磨罷了，在一起又是為了什麼？\n\
    \    因此，你會想選擇一位你無法信任或不願相信你的人作為另一半嗎？你會選擇一段老是在爭吵、對方樣樣都要依賴你、凡事都要你報備、不允許你擁有個人隱私、干涉你自由的愛情嗎？你會願意千里迢迢地飛回來，利用你唯一的休假，只為了一段無法讓你感到自在快樂的愛情嗎？每當我在傾聽臺灣朋友們的愛情故事，看見的往往是太害怕失去、太害怕受傷，因此盲目地緊抓另一半、設限另一半，卻忘了物極必反的道理。\n\
    \   「愛情就像握在手裡的沙，抓得越緊流失得越快」，沒有任何人喜歡被干涉、被綑綁、被限制。當你決定踏入愛情的同時，也請用你希望被對待的方式，真誠地去對待另一半，並永遠記得：「強摘的果實不會甜，幸福是不會設限的。」\n\
    （節錄自李恬芳 〈生活報橘‧愛情觀大不同〉)"
