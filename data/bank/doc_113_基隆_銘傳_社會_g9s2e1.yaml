    出於報復心態，1919年第一次世界大戰結束後，法國特意於凡爾賽宮的鏡廳——當初威廉一世舉行加冕典禮之處，與戰勝國召開和平會議、討論並簽訂對德國的《凡爾賽條約》。如此一來一往，不僅未能解消兩國間的仇恨，更埋下第二次世界大戰的火種。'
