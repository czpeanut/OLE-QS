- id: doc_113_基隆_銘傳_社會_g9s2e1_s1_23
  section: 1
  number: 23
  type: single
  page: 3
  stem: 根據上文，有關1783年《巴黎條約》的簽訂背景與後續發展，下列敘述何者正確？
  options:
  - label: A
    content: 此條約解決了法國與殖民地間的衝突
  - label: B
    content: 簽訂此條約代表該獨立國家脫離法國統治
  - label: C
    content: 該獨立國家制定出世上首部成文憲法
  - label: D
    content: 玻利瓦為當時美洲勢力的主要領導者。
  group_stem: '◎請閱讀下列表章，回答第23至25題：

    位於法國巴黎郊區的凡爾賽宮（Chateau De Versailles）由法王路易十四親自設計督建，是當時歐洲最大、最豪華的宮殿建築，充分彰顯太陽王「朕即國家」的崇高地位。此座宮殿自1682年起作為法國君王與政府機構所在，見證許多重大歷史事件的發生。1783年，在此簽訂《巴黎條約》，美洲首個獨立國家因此誕生；1789年，在此發表《網球場宣言》，揭開法國大革命的序幕。

    法國王室被推翻後，凡爾賽宮逐漸轉型為外交場館及博物館，即使不再作為政治中心，凡爾賽宮在法國人心態中仍占有重要地位。1870年，由於對外戰爭失利，凡爾賽宮被普魯士軍隊佔領；隔年，普魯士國王威廉一世在此登基，德意志帝國正式成立，此事深深傷害了法國人的民族情感，因此仇視德國。

    出於報復心態，1919年第一次世界大戰結束後，法國特意於凡爾賽宮的鏡廳——當初威廉一世舉行加冕典禮之處，與戰勝國召開和平會議、討論並簽訂對德國的《凡爾賽條約》。如此一來一往，不僅未能解消兩國間的仇恨，更埋下第二次世界大戰的火種。'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
