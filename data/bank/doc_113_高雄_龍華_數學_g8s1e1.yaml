- id: doc_113_高雄_龍華_數學_g8s1e1_s1_3
  section: 1
  number: 3
  type: fill
  page: 1
  stem: '有四位同學想要算出 $8.5^{2}$ 的值，他們的方法如下：

    小瑛：$8.5^{2} = (8+0.5)^{2} = 8^{2}+2 \times 8 \times 0.5+0.5^{2}$

    小岳：$8.5^{2} = (\frac{17}{2})^{2} = \frac{17^{2}}{4^{2}}$

    阿日：$8.5^{2} = 8^{2}+0.5^{2}$

    阿融：$8.5^{2} = (9-0.5)^{2} = 9^{2}-2 \times 9 \times 0.5-0.5^{2}$

    如果這四人接下來都沒有計算或其他方面的錯誤，那麼答案正確的是誰? 答：【 ③ 】。'
