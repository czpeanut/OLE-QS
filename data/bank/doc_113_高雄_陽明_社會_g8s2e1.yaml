  - label: B
    content: 甲宗教為8 世紀時受阿拉伯人商業貿易活動傳入印度
  - label: C
    content: 乙河的名稱應為印度河
  - label: D
    content: 乙河向西流入孟加拉灣，每逢豪雨便洪水為患。
