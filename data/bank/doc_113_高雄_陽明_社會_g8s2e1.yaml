  stem: 2.法顯是魏晉南北朝時期的和尚，於 399 年從長安（今西安）出發，經由絲路前往天竺（今印度）求法，在天竺居住 10 年後，從恆河往南航行到獅子國（今斯里蘭卡）。413
    年，法顯從獅子國返回建康（今南京）。回國後，他將西行取經的見聞寫成佛國記，是現存最早關於中國與南亞海陸交通的文獻。圖(一)為法顯取經路線示意圖，請問下列敘述何者正確？
