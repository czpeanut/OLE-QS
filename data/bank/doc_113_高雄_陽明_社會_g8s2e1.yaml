  group_stem: '（一）5 億高中生命案，是2023 年發生在臺灣臺中市北屯區的一起命案。2023 年5 月4 日當天，夏男與賴姓高中生相約出門；找了不相識的兩名路人作為證婚人，至戶政事務所登記同性婚姻；兩人前往夏男位於臺中市北屯區某公寓，兩個小時後賴姓少年倒臥在樓下被人發現，送醫搶救無效死亡。

