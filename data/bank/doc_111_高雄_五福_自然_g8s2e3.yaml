  section: 1
  number: 49
  type: single
  page: 6
  stem: 根據文章判斷下列何者敘述錯誤？
  options:
  - label: A
    content: P 牌擦擦筆的感溫染料、顯色劑及溶劑皆為有機化合物
  - label: B
    content: 一般擦擦筆的溶劑熔點約在攝氏60 度以上
  - label: C
    content: 擦擦筆書寫有顏色是因為溶劑與感溫染料結合
  - label: D
    content: 當染料與顯色劑結合時，是一種化學變化
  group_stem: "【閱讀題】\n  坊間常見的擦擦筆是利用摩擦生熱，讓墨色遇到攝氏60 度以上高溫時，筆跡就會變透明，若再放到零下10 度的冷凍庫，筆跡就會還原恢復。\n\
    \  小華研究市售P 牌擦擦筆後，發現墨水內有三個重要的成分：(1)感溫染料、(2)顯色劑、(3)溶劑。他查資料發現擦擦筆的感溫染料成分為結晶紫內酯，是一種酸鹼指示劑，當遇到成分為有機酸的顯色劑時會與其作用而顯色。那為什麼擦擦筆的筆跡被摩擦之後顏色就會消失呢？這是因為擦擦筆墨水溶劑為高熔點的固態有機溶劑，在一般室溫下其溶劑為固態，此時顯色劑與感溫染料結合力較顯色劑與溶劑結合力大，所以墨水能顯現顏色；但若環境溫度超過溶劑熔點，當溶劑熔化後就會與顯色劑結合，此時顯色劑與感溫染料的結合力較顯色劑與溶劑的結合力弱，故染料失去了顯色劑而無法顯現顏色，也就是字消失的原理。"
