  stem: 市面咖啡杯蓋材質原本材質多為聚苯乙烯（簡稱PS），由苯乙烯（$C_{8}H_{8}$）聚合而成，但因為民眾擔心該材質有釋出致癌物質的可能，為免疑慮，已逐漸改成聚丙烯（簡稱PP），由丙烯（$C_{3}H_{6}$）聚合而成。PS
    和PP 都屬於熱塑性聚合物，只要符合規定，消費者正常使用，尚無安全疑慮。根據以上文字敘述，請問下列何者敘述錯誤？
