- id: doc_113_高雄_苓雅_社會_公民_g9s2e1_s1_55
  section: 1
  number: 55
  type: single
  page: 2
  stem: '某國網友在群組討論政府欲推動的新措施，依照對話內容判斷，該政策引發民眾不滿，應是認為其措施違反《憲法》保障人民的何種權利？

    安妮：變種病毒讓每天的確診數又提高了。

    雪寶：政府準備強制大企業員工接種疫苗和定期檢測病毒，違反者將會被罰款。

    愛莎：很多民眾認為政府的決議侵犯他們的工作權，所幸最高法院已經否決這項政策。'
  options:
  - label: A
    content: 平等權
  - label: B
    content: 自由權
  - label: C
    content: 受益權
  - label: D
    content: 參政權。
  tags:
