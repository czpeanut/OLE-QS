  stem: '霏霏瀏覽網頁時看到某個團體的介紹，由以下內容顯示志願結社對公共生活產生何種影響？

    由於對愛滋病的恐懼，社會大眾往往對感染者投以異樣眼光，甚至產生歧視心態和排斥行為，「社團法人臺灣你不是一個人實踐協會」的成立者，關切愛滋病感染者的身心健康，透過成立協會，提供醫療資訊與心理支持課程，讓他們知道自己並不孤單，並希望借助眾人力量和資源的集結，為臺灣的愛滋病患者爭取更多權益。'
