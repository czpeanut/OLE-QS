  stem: '深深參加一場座談會，以下為他記錄下的重點，根據內容判斷，下列何項敘述與其相符？

    ◎以操弄訊息的方式，破壞社會中原本和諧的互動關係，例如：釋放各種假消息、假新聞，讓社會成員彼此產生不信任感，進而引發對立衝突。

    ◎閱聽人可以利用「Cofacts 真的假的」、「MyGoPen」、「台灣事實查核中心」等網路平臺查詢手邊資訊的真偽，學習如何分析和判斷。'
  options:
  - label: A
    content: 資訊科技快速發展，閱聽人沒有能力解讀虛假訊息
  - label: B
    content: 閱聽人應善用訊息查核工具，避免被錯誤資訊引導
  - label: C
    content: 政府限制民眾使用網路的權利，減少假消息的流竄散播
  - label: D
    content: 由於媒體無法監督政府，社會治安惡化。
