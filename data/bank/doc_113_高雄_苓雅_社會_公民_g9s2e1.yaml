  section: 1
  number: 41
  type: single
  page: 1
  stem: '阿清上公民課時作的筆記錯誤百出，附表是他筆記的內容，其中何項正確？


    | 項目 | 說明 |

    | :--- | :--- |

    | (甲)告訴 | 針對犯罪行為，犯罪被害人或其家屬向偵查機關報案。 |

    | (乙)公訴 | 針對犯罪行為，檢察官偵辦後，認定被告涉嫌犯罪時向警察機關提出。 |

    | (丙)自訴 | 由被害人委任律師向檢察官提起訴訟，請求判決被告有罪。 |

    | (丁)告發 | 任何人只要發現犯罪事實時，均可向法院報案。 |'
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
