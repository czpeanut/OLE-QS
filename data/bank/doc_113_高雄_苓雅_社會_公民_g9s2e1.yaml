- id: doc_113_高雄_苓雅_社會_公民_g9s2e1_s1_42
  section: 1
  number: 42
  type: single
  page: 1
  stem: "韻華看到一則報導如下，從內容中可看出原住民族目前面臨的困境為何？\n  臺灣大學在二戰後接收了東京帝國大學演習林及臺北帝國大學山地農場，其分布全臺的校地總計340平方公里。山地農場與實驗林皆座落於原住民族地區，而臺大長期仰賴這些土地進行教學與實驗研究。\n\
    \  然而，臺大與原住民族的土地爭議層出不窮，其中位於南投縣仁愛鄉的臺大山地農場是近年來受到社會關注的案例。監察院也在 2019 年公布此案的調查報告，主張山地農場的用地取得侵犯原住民族土地、違背公地撥用目的，並向臺大提出糾正。"
  options:
  - label: A
    content: 部落經濟面臨的困境
  - label: B
    content: 無法恢復傳統領域
  - label: C
    content: 傳統文化與現行法律的衝突
  - label: D
    content: 傳統文化的無法繼續傳承。
  tags:
