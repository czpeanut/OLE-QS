  stem: 韓國演員金秀賢近日遭到網友指控與未成年女星交往，雖然他已公開否認並提起告訴，但此事件導致他主演的電視劇《山寨人生》無限期停拍，製作公司與合作方也面臨嚴重損失。請問：根據上述情境，關於金秀賢可能採取的法律行動，下列敘述何者正確？
  options:
  - label: A
    content: 如果金秀賢指控對方妨害名譽，屬於刑事案件，需由法院決定是否賠償損失。
