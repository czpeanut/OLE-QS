  type: single
  page: 3
  stem: "國文老師上課時進行跨領域教學，詢問同學「即使漢文帝很生氣，張釋之仍維持原判決，是因為張釋之遵守哪項原則？」，請問哪一位同學搶答正確？\n釋之為廷尉。上行，出中渭橋，有一人從橋下走出，乘輿馬驚。於是使騎捕，屬之廷尉。釋之治問。曰：「縣人來，聞蹕，匿橋下。久之，以為行已過，即出，見乘輿車騎即走耳。」廷尉奏當：一人犯蹕，當罰金。\
    \  \n文帝怒曰：「此人親驚吾馬，吾馬賴柔和，令他馬，固不敗傷我乎？而廷尉乃當之罰金！」  \n釋之曰：「法者，天子所與天下公共也。今法如此而更重之，是法不信於民也。且方其時，上使立誅之則已。今既下廷尉，廷尉，天下之平也，一傾而天下用法皆為輕重，民安所錯其手足？唯陛下察之。」良久，上曰：「廷尉當是也。」"
  options:
