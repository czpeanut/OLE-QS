- id: doc_113_台中_大業_社會_公民_g8s2e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 國中生小明在社群平台上，看到同班同學小偉的打卡貼文後，留言說：「這個人偷過東西，大家小心點！」其實小明只是聽別人亂講，並沒有親眼見過或查證。小偉發現後覺得名譽受損，向警方報案，並提起民事訴訟要求賠償。請問：以下關於小明可能要負的刑事、民事責任及舉證責任的敘述，何者正確？
  options:
  - label: A
    content: 小明沒有提告，只是留言，所以不會有任何刑事責任。
  - label: B
    content: 民事訴訟中，小明只要證明自己沒有惡意、只是開玩笑，就不必賠償。
  - label: C
    content: 刑事案件中，小偉必須證明小明真的「故意說謊」，才能讓法院判有罪。
  - label: D
    content: 小明可能成立刑法誹謗罪，民事上也可能須賠償小偉的精神損害。
  tags:
