- id: doc_113_台中_大業_社會_公民_g8s2e2_s1_34
  section: 1
  number: 34
  type: single
  page: 5
  stem: 除黃子佼外，近期還有多位藝人也有性騷擾案件判決確定。日前有其他藝人在採訪中聲援「給人留一口飯吃」、支持復出。另多位議員、網紅則公開發文譴責：根據判決書內容受害者為國小、國高中等未成年的年紀，並且皆是在非自願的情況被迫拍攝，和不少人先前誤以為的「只是看A片」完全不一樣，「這一些創意私房的影片，它不是A片，它是虐童片」、「我們不能再讓犯了這麼嚴重的錯、又還不認錯的人，繼續在社會上當意見領袖、當偶像明星」。關於上述藝人、網紅發言，我們應該如何理解？
  options:
  - label: A
    content: 即使是名人也適用「人非聖賢孰能無過」，只要能夠改過自新就好。
  - label: B
    content: 只要加害人表達悔意並服刑期滿後，即可視為無罪，不應再受譴責。
  - label: C
    content: 犯法不等於犯罪，既然只是違反兒童及少年性剝削防制條例，不是違反刑法，就不應該譴責。
  - label: D
    content: 既然兒童及少年性剝削防制條例以刑罰作為罰則，可以說這些行為屬於犯罪行為，應該譴責。
  group_stem: "臺灣臺北地方法院新聞稿\n    發稿日期：113 年12 月3 日\n    發稿單位：發言人室\n    連 絡 人：行政庭長 \
    \ 黃○○\n    連絡電話：02-2314○○○分機○○○  編號：113-56\n知名藝人黃子佼自民國103 年2 月12 日起，註冊加入「創意私房」網路論壇成為會員，並從論壇陸續購買兒童及少年性影像而持有數量達2259\
    \ 個，經查性影像的兒少人數為35 人，遭拍攝性影像時的年齡介於10 歲至17 歲，分別就讀國小至高中，並可輕易辨識其等之臉部、身體特徵，包含兒童或少年之學校制服、學生證、社群網站資料、手寫個人年籍等個人資料，且於論壇頁面及檔案標題介紹該等性影像之特色，甚且放置兒童或少年之社群網站、生活照、性影像截圖等資訊吸引會員購買，是該等性影像嚴重侵害兒童及少年身心健全發展，被告本案犯行所生危害重大，檢方依《兒童及少年性剝削防制條例》起訴。\n\
    被告及其辯護人請求給予緩刑，被告前雖未曾因故意犯罪受有期徒刑以上之宣告，然考量本案被告持有之兒童及少年性影像數量非微，且迄未與告訴人、被害人等達成和解，復被告於本院歷次準備程序、審理中仍否認犯行，難認有悔改之意。經本院斟酌上情及全案情節後，認本案並無暫不執行被告刑罰為適當之情事，爰不予宣告緩刑。處有期徒刑8\
    \ 個月，併科罰金新台幣10 萬元，罰金如易服勞役，以新台幣1000 元折算一日。存有本案兒童及少年性影像之硬碟，屬該等兒童或少年性影像之附著物，宣告沒收。"
