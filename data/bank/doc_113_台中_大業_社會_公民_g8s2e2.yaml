- id: doc_113_台中_大業_社會_公民_g8s2e2_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 炫富是高中三年級學生，雖然他已經可以投票選舉縣市首長，但卻不能像班上其他同學一樣，自己去通訊行申辦手機，必須由法定代理人代為執行。某天他走在路上時因為學測成績不理想，心情不好而沿途敲破停在路邊的車窗。請問：關於炫富的責任，以下敘述何者正確？
  options:
  - label: A
