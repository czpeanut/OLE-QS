  stem: '小霖在公園看到一位老先生突然倒地，疑似心臟病發。他立即撥打119並進行心肺復甦術（CPR），在施救過程中不慎造成老先生胸口瘀青，但老先生最終被成功救活。老先生家屬事後控告小霖要求損害賠償並提起過失傷害告訴。請問，依據我國現行法規及「善良撒馬利亞人法案」精神，下列哪一項敘述最為正確？

    刑法第24 條：因避免自己或他人生命、身體、自由、財產之緊急危難而出於不得已之行為，不罰。

    民法第150 條：因避免自己或他人生命、身體、自由或財產上急迫之危險所為之行為，不負損害賠償之責。

    緊急救護法第14-2 條：救護人員以外之人，為免除他人生命之急迫危險，使用緊急救護設備或施予急救措施者，適用民法、刑法緊急避難免責之規定。'
  options:
  - label: A
    content: 小霖在緊急情況下施救，即使造成損害，只要無重大過失，通常不需負民事賠償責任。
  - label: B
    content: 小霖因施救行為造成他人受傷，即使是出於善意，仍成立刑法上的過失傷害罪。
  - label: C
    content: 小霖雖然救人，但未經家屬同意施救，因此施救行為本身違法。
  - label: D
    content: 小霖因造成骨折，屬侵權行為，必須負完全損害賠償責任。
