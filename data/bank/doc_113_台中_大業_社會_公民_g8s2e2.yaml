  type: single
  page: 1
  stem: 公民課時，大家在討論「國家追訴、處罰犯罪程序」的相關規定，下列何者最為正確？
  options:
  - label: A
    content: 任何人知悉有犯罪嫌疑時，均可以向警察機關提出告訴。
  - label: B
    content: 只要發現犯罪事實檢察官或警察機關必須馬上進行偵查。
  - label: C
    content: 法官釐清事情經過及證據辯證後，才會依法判決。
  - label: D
    content: 在法官判決確定後，會交由警察機關執行該判決。
