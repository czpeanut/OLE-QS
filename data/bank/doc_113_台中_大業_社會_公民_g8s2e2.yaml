    content: 如果金秀賢提告毀謗，這屬於民事案件，由警方偵辦並決定是否起訴。
  - label: C
    content: 金秀賢若因名譽受損造成經濟損失，可同時提起刑事毀謗與民事求償。
  - label: D
    content: 公眾人物無法提告毀謗，因為社會大眾有知情權。
