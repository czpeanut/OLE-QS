- id: doc_113_台中_大業_社會_公民_g8s2e2_s1_39
  section: 1
  number: 39
  type: single
  page: 6
  stem: 國民法官制度於2023年正式施行，是為了加強司法透明與民眾參與，提升國民對司法審判的信賴感。國民法官參與審理的案件主要有：最輕本刑10年以上有期徒刑之罪（例如強盜、強制性交等），以及故意犯罪因而發生死亡結果之罪（例如酒駕致死），但會排除少年刑事案件與毒品危害防制條例案件。依據《國民法官法》規定，國民法官與職業法官共同組成合議庭，審理特定重大刑事案件。在審判過程中，國民法官擁有與職業法官同等的審判權，包括對事實認定及法律適用的判斷。請問：下列何者最有可能有國民法官參與審判？
  options:
  - label: A
    content: 少年持刀搶劫便利商店，未造成死傷。
  - label: B
    content: 成年人酒後駕車，撞擊行人致死後逃逸。
  - label: C
    content: 車手騙取高額金錢，被依詐欺罪起訴。
  - label: D
    content: 持有毒品，被依毒品危害防制條例起訴。
