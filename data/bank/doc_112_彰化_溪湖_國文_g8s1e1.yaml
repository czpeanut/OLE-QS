  - label: A
    content: 前二句解釋詩名為「慈烏夜啼」的原因
  - label: B
    content: 後二句表現慈烏對母親深切的舐犢之情
  - label: C
    content: 「哀」字帶有作者當時喪母的主觀情感
  - label: D
    content: 由「晝夜」到「經年」表達失母之痛。
