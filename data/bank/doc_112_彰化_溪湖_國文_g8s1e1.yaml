  page: 2
  stem: '「在我童年生活中，真真不希望下雨的只有一天，那就是我的生日，我的生日正是颱風季節。平時一逢有颱風，我就興奮地問大人：『大水什麼時候才漲到我們家後門口呢？』只有我生日那天，我就要拜菩薩，保佑不要下雨。一下雨，母親就不讓我穿新衣服，小朋友們也不會來吃我的『長壽麵』了。最糟的是老師只答應晴天才放我『生日假』，下雨天就照常上課。所以『晴天的生日』，對我是多麼重要！可是我的生日，多半在風雨中過去。」（琦君
    下雨天，真不好）

    關於前文這段話的主旨，下列說明何者正確？'
