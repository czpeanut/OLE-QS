  stem: 田園之秋選一文中：「一場為時一小時的大西北雨，到底下了幾公釐的水，雖然沒做過實驗，只覺好像天上的水壩在洩洪似的，是整個倒下來的。」這段文字主要在描寫西北雨的什麼特色？
  options:
  - label: A
    content: 雨珠細小，晶瑩剔透
  - label: B
