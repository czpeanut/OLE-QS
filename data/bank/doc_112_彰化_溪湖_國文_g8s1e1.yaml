  stem: 關於上述短文(甲)，下列敍述何者正確？
  options:
  - label: A
    content: 顧況對白居易說「長安百物貴，居大不易」是譏諷他無力負擔昂貴物價
  - label: B
    content: 顧況對白居易態度轉變的關鍵是其頗具詩才
  - label: C
    content: 顧況對白居易的態度是先消遣而後轉為斥責
  - label: D
    content: 由文中可知，顧況是位道貌岸然，對提攜後輩不遺餘力的人。
  group_stem: "(甲)樂天初舉，名未振，以詩謁①顧況。況睹姓名，謔之曰：「長安百物貴，居大不易。」及讀至賦得古原草送別詩，況嘆之曰：「有句如此，居天下有甚難！老夫前言戲之耳。」\n\
    (乙)賦得古原草送別 白居易\n    離離②原上草，一歲一枯榮。\n    野火燒不盡，春風吹又生。\n    遠芳侵古道，晴翠接荒城。\n    又送王孫③去，萋萋滿別情。\n\
    (改寫自五代 王定保 唐摭言 知己)\n【注釋】①謁：音一ㄝˋ，拜見。\n        ②離離：茂盛的樣子。\n        ③王孫：原指貴族子弟，此指遠行的友人。"
