    Ⓑ 四人一組，最快將季節詩句卡牌歸類完畢者獲勝，而歸類錯誤者，須處罰加抽三張卡牌。

    Ⓒ 每組的優勝者，可獲得國文罰寫的免寫金牌一面，有效期限一個月。

    阿信剩最後四張卡牌如下：

    ① 遙知兄弟登高處，遍插茱萸少一人

    ② 清明時節雨紛紛，路上行人欲斷魂

    ③ 不效艾符趨習俗，但祈蒲酒話升平

    ④ 七月七日長生殿，夜半無人私語時。

