  stem: 近年來，性別議題漸受重視，政府也透過法律的制定，具體落實性別平權。下列哪些情況符合「性別平權」的觀念？（甲）學校在課程設計須因性別不同而有差別待遇、（乙）建築設計應把女生廁所數量設定多於男生廁所、（丙）薪資高低應由工作表現來決定、（丁）女性上班時不可以哺乳、（戊）選舉採行婦女保障名額，促使有競爭力的女性願意參選、（己）雇主不得拒絕女性員工請生理假。
  options:
