  stem: 玻璃天花板（glass ceiling）是指在公司、企業和機關、團體中對某些群體（如女性、少數族裔）晉升到高級職位或決策層的潛在限制或障礙，正如玻璃一樣，這個障礙雖然不會明文規定，但卻是實實在在的存在。也有研究指出，各國的主管階層仍以男性為主。這顯示了下列何種意義？
  options:
  - label: A
    content: 性別工作平等是社會文化的問題，不需要政府立法介入。
  - label: B
