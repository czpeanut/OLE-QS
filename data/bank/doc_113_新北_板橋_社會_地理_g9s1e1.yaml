- id: doc_113_新北_板橋_社會_地理_g9s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 歐洲各國經過漫長的工業發展過程後，近年來致力於降低對不可再生能源的依賴，以及追求永續發展為目標，紛紛大力推動綠能工業。下列相關敘述何者有誤？
  options:
  - label: A
    content: 適合推動太陽能發電的國家主要在北歐地區
  - label: B
    content: 丹麥近年來從對石油的高度仰賴逐漸轉為風力發電，是積極善用了西風帶動的電力資源
  - label: C
    content: 瑞士近年來在水力發電的比例偏高，應是與位於阿爾卑斯山區的高低落差環境相關
  - label: D
    content: 早期荷蘭人利用西風將風車帶動運轉，把海水排乾後進行填海造陸，可以視為一種善用綠能資源的先驅之一。
