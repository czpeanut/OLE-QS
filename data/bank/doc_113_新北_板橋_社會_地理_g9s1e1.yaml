- id: doc_113_新北_板橋_社會_地理_g9s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 歐洲某地區的電視頻道曾流行「慢電視」，這類反傳統、反常規的電視節目在當時意外地創下高收視率。所謂慢電視（Slow TV）是一種馬拉松式全程直播某種普通事件的電視節目類型，其名稱來源是因為這類節目內容本身節奏緩慢，節目時間比一般電視還要長很多。該地曾推出的節目「全國柴火之夜」長達
    12 小時；「羊毛變毛衣」時間則為 12.5 小時。「慢電視」的受歡迎也許反映了當地人度過長冬的耐心，以及一種文化上的反擊。請問:這種「慢電視」受歡迎的地區最有可能為下列何者？
  options:
  - label: A
    content: 義大利
  - label: B
    content: 德國
  - label: C
    content: 芬蘭
  - label: D
    content: 瑞士。
