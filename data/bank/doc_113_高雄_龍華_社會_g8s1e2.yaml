  group_stem: 中國到底有多有錢呢？根據2015 年《經濟學人》統計，中國可以買下西班牙、愛爾蘭、葡萄牙和希臘等國的債務，解決這些國家當時的債務危機，甚至還有一半可隨時使用的資金。中國的吉利汽車於2010
