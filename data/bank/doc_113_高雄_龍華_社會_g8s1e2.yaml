  stem: 2010 年，深圳市聚集了上百家由臺商經營的玩具、紡織、家具和電子零件等工廠。然而，自2011 年起市政府提出了「騰籠換鳥」產業升級策略。市政府希望讓原有的外資廠商遷出，並吸引不同類型的外資工廠進駐。根據上述，下列何者為該政策最希望吸引進駐的產業類型？
