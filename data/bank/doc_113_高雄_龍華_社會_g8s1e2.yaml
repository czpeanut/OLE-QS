- id: doc_113_高雄_龍華_社會_g8s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 隨著全球化程度日益升高，中國作為世界工廠的地位面臨挑戰，其中勞工成本上升、國際政經局勢等因素，都影響企業在中國的投資意願。在此情勢下，下列哪一個事件最能展現國際局勢對中國經濟的衝擊？
  options:
  - label: A
    content: 2022 年《區域全面經濟伙伴協定》生效
  - label: B
    content: 2016 年中國收購美國企業在剛果經營的鈷礦礦場
  - label: C
    content: 2018 年美國針對部分中國商品提高關稅
  - label: D
    content: 2010 年中國成為僅次於美國的世界第二大經濟體。
