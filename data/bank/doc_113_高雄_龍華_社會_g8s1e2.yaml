  stem: 利瑪竇的傳教活動，是以西方人獨特的文化視角去解讀和詮釋儒家思想，並吸收前輩在中國傳教的經驗。他甚至不惜修改教規，以聖經附會四書五經，學中國禮儀、學漢語、著儒服，被馮琦在內的士大夫奉為「西儒」。請問利瑪竇做出許多努力，意圖在中國推廣是什麼宗教?
