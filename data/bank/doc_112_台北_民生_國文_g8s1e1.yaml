  group_stem: '梁上有雙燕，翩翩雄與雌。銜泥兩椽①間，一巢生四兒。四兒日夜長，索食聲孜孜。青蟲不易捕，黃口②無飽期。觜③爪雖欲敝④，心力不知疲。須臾十來往，猶恐巢中飢。辛勤三十日，母瘦雛漸肥。喃喃教言語，一一刷毛衣。一旦羽翼成，引上庭樹枝。舉翅不回顧，隨風四散飛。雌雄空中鳴，聲盡呼不歸。卻入空巢裡，啁啾終夜悲。燕燕爾勿悲，爾當反自思。思爾為雛日，高飛背母時。當時父母念，今日爾應知。

