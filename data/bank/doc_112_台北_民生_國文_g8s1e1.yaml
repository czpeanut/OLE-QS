- id: doc_112_台北_民生_國文_g8s1e1_s5_21
  section: 5
  number: 21
  type: single
  page: 4
  stem: 關於本文的內容，下列說明何者正確？
  options:
  - label: A
    content: 威爾斯在麻醉醫學的路上付出了不少心力，具有不畏流言的抗壓性
  - label: B
    content: 威爾斯在哈佛遇到挫折，從此一蹶不振，可見人生短暫，絕不可犯錯
  - label: C
    content: 笑氣今日成為醫療合法使用的吸入性麻醉劑，個人可自行持有或買賣
  - label: D
    content: 作者分析威爾斯在哈佛運用笑氣失敗的原因是受試者吸入笑氣的劑量不足
  group_stem: '如同往常一樣，病人吸了笑氣之後，漸漸昏沉，失去反應，雙眼鬆弛、雙手下垂……威爾斯顯得有些緊張，他抓緊拔牙鉗，伸進病人微張的嘴裡，臺下沒有一點聲音……

    　　「啊──」這時病人發出的一聲慘叫，打碎了威爾斯的夢想。學生先是愣住了，接著笑鬧成一片。幾分鐘以後，威爾斯在所有人的噓聲以及嘲笑中，落荒逃離哈佛。

    　　這一聲大叫，足足使麻醉以及外科技術的發展延後了兩年。身為一個麻醉醫師，以現代的麻醉知識，我可以很容易地發現：一、笑氣的濃度因為呼吸設備的關係，並不容易達到麻醉深度。二、在淺麻下，病人的反射動作可能比清醒時還要強烈。這些問題，其實都是很容易改正的錯誤，然而在當時卻不是簡單的事。威爾斯往後的日子幾乎都在悔恨之中度過。他認定示範的失敗導因於吸入氣體濃度不夠，因此重複地在自己身上做同樣的實驗。

    　　「明明有效啊！」他一再地質疑。

    　　大部分的病人都對他熱心推銷笑氣的瘋狂態度敬而遠之。威爾斯漸漸變得固執，不易接近。他唯一能做的事，是一再地以自己做實驗來印證最初的理念。然而，再也沒有人相信這種江湖郎中的把戲。

    　　過度的笑氣腐蝕了威爾斯的身心狀態。到了最後，他幾乎瀕臨崩潰狀態，不久，便沮喪而死，死時年僅三十三歲。

    　　威爾斯的夢並沒有因這樣而停止。當年在哈佛講堂上有一位叫莫登的學生，目睹了全部的情景，拾起威爾斯最初的構想，仍然不斷地去開發氣體麻醉的可能性。於是漸漸有了今日整個麻醉與外科的新領域和新天地。

    　　笑氣今日已經成了大部分手術麻醉必用的藥物。並非所有接受麻醉的病人以及施行麻醉的醫師，都知道威爾斯的夢想和熱情。但沒有威爾斯的堅持，或許今日的醫學仍然停留在十九世紀的風貌。

    　　人類因有夢想而偉大。威爾斯至死也許尚不知道，他所肩負的苦痛，事實上正是一個夢想，一個關於人類更美好未來的夢想。

    　　沒有一個夢想不需付出代價。夢想的代價有時十分悲慘，然而比這更悲慘的卻是沒有夢想。

    （侯文詠 夢想的代價節錄）'
