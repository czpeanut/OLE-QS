    content: 考、監的分立，有助於避免政府權力過度集中
  - label: D
    content: 考試委員人數縮減，已能減少其人事薪水支出
  group_stem: '我國長期實施五權分立體制，也是世界上唯一根據御史諫官制度獨立出監察權，依照科舉選才制度獨立出考試權的國家。然而近十年以來，無論是執政黨或在野黨，以及民間聲浪，都曾提出廢除考試院與監察院的意見。

    以考試權獨立受到質疑的部分來說，主要是遭質疑考用不合，考選出來的人才可能無法貼合實際職位的需求。也有人認為其考試委員，業務相較其他幾院少，但卻領取等同部長級的薪水，錢多事少，有浪費國家資源之虞。

    而在監察權受到質疑的部分，則是無有效制衡其他權力。以監督違法失職人員為例，更嚴重的違法行為將由檢察官負責調查，較輕微的失職行為也只能送交司法院，無法自行決定懲處。

    當然，隨著各方討論，有許多修正與嘗試。如考試院的考試委員名額從19 人縮減至7 至9 人，不僅減少人事薪水支出，更希望能改善其效率；監察院也增設專司人權保障的專門機構。總之，考、監存廢與否，仍然是各方爭論的議題。'
