questions:
- id: doc_113_台北_仁愛_社會_公民_g8s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 民主國家在規畫具有爭議性的政策時，經常會透過舉行公聽會廣納民意，了解各方意見以作為決策考量。請問：此舉是展現出民主政治的何項特色？
  options:
  - label: A
    content: 民意政治
  - label: B
    content: 法治政治
  - label: C
    content: 政黨政治
  - label: D
    content: 責任政治
- id: doc_113_台北_仁愛_社會_公民_g8s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 人民是國家的組成要素之一，現代國家會透過法律的制定，來規定何人具有該國的國籍。如果以我國《國籍法》的規定及下列各敘述內容判斷，哪一個人目前最可能為我國國民？
  options:
  - label: A
    content: 我明年歸化後就有參選的資格
  - label: B
    content: 我今年暑假要到台灣大學就讀
  - label: C
    content: 我在總統大選投票給心中理想的候選人
  - label: D
    content: 我今年從美國到台灣的英語補習班教書
- id: doc_113_台北_仁愛_社會_公民_g8s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 保羅在介紹其國家構成要素時，提及下列內容，請你指出其所提出的內容何者為國家組成要素？
  options:
  - label: A
    content: 美國國旗
  - label: B
    content: 白宮
  - label: C
    content: 自由女神像
  - label: D
    content: 美國國歌
- id: doc_113_台北_仁愛_社會_公民_g8s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 右列新聞引發小禾的關注，根據報導內容與國家組成要素判斷，文中阿布哈茲是否為國家的爭議，與下列何種國家組成要素最直接相關？
  options:
  - label: A
    content: 領土
  - label: B
    content: 主權
  - label: C
    content: 政府
  - label: D
    content: 人民
  assets:
  - key: s1_4_f1
    kind: figure
    file: doc_113_台北_仁愛_社會_公民_g8s1e1/s1_4_f1.png
- id: doc_113_台北_仁愛_社會_公民_g8s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 孫中山獨創五權分立學說，使我國成為全世界唯一採用五權分立的國家。下列何者最能用來說明孫中山將行政權與考試權各自獨立的理由？
  options:
  - label: A
    content: 考試權獨立有助於政府公正的聘用人才
  - label: B
    content: 避免行政機關把持行政權造成權力失衡
  - label: C
    content: 提高考試權的重要性避免立法權的專制
  - label: D
    content: 藉由行政權補足我國政府人力資源缺乏
- id: doc_113_台北_仁愛_社會_公民_g8s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '認真的廷宣正在製作公民課要報告的簡報，簡報的相關重點條列如下。請問：廷宣要介紹的主題應為下列何者？

    一、民主國家一切以民為主，人民是國家的主人。

    二、要有兩個以上政黨公平競爭，以形成政黨輪替。

    三、政府官員違法失職時要負起法律責任，接受法律的制裁。

    四、人民、政府皆要守法，除了政府要依法行政外，人民也要依法行事。'
  options:
  - label: A
    content: 民主政治應具備的特色
  - label: B
    content: 國家提供的福利與權益
  - label: C
    content: 現代民主國家存在目的
  - label: D
    content: 國家與政府之間的差異
  assets:
  - key: s1_6_f1
    kind: figure
    file: doc_113_台北_仁愛_社會_公民_g8s1e1/s1_6_f1.png
- id: doc_113_台北_仁愛_社會_公民_g8s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 政府的權力必須受到憲法和相關法律加以規範限定，以避免政府濫權而隨意侵犯人民的權利。從上述內容可見民主國家政府間運作的何種概念？
  options:
  - label: A
    content: 有限政府
  - label: B
    content: 主權在民
  - label: C
    content: 民意政治
  - label: D
    content: 定期選舉
- id: doc_113_台北_仁愛_社會_公民_g8s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 下列四位同學在下課時間討論公民與社會課中有關「法治」的內容，哪一位同學的說法是正確的？
  options:
  - label: A
    content: 國家的法律由民意代表制定，約束政府與人民
  - label: B
    content: 是指由統治者制定法律，而所有人都必須守法
  - label: C
    content: 國家的一切事物都交由法律治理，沒有統治者
  - label: D
    content: 能夠有效限制人民的權力，避免多數民眾濫權
- id: doc_113_台北_仁愛_社會_公民_g8s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 仲恩收看新聞報導，聽到主播說：「民主國家的法律除了要求人民必須遵守，政府權力也應被約束外，必須要同等的對待人民與政府。」根據題文內容，主播這段話要闡述的意思是什麼呢？
  options:
  - label: A
    content: 政府及人民都應遵守法律規範才符合法治政治
  - label: B
    content: 國家權力極大，人民不守法將會受到嚴厲處罰
  - label: C
    content: 民主國家制訂政策，應傾聽民意強調主權在民
  - label: D
    content: 政府施政若背離民意，應該負起責任辭職下臺
- id: doc_113_台北_仁愛_社會_公民_g8s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 下列是小禾和小東討論國家和政府關係的部分對話內容。若小禾要進一步回答小東的提問，則下列何項回答才正確？
  options:
  - label: A
    content: 國家不因選舉結果被取代
  - label: B
    content: 政府更替不影響國家存在
  - label: C
    content: 國家功能有賴政府具體實現
  - label: D
    content: 國家為具永久與持續性的整體
  assets:
  - key: s1_10_f1
    kind: figure
    file: doc_113_台北_仁愛_社會_公民_g8s1e1/s1_10_f1.png
- id: doc_113_台北_仁愛_社會_公民_g8s1e1_s2_11
  section: 2
  number: 11
  type: single
  page: 1
  stem: 2019 年蘇丹傳出軍事政變，執政長達30 年的巴席爾在軍隊包圍總統府的狀況下，宣布請辭。這起政變後，蘇丹轉由軍政府暫時接管。上述事件具有下列何種意義？
  options:
  - label: A
    content: 國家滅亡而主權消失
  - label: B
    content: 人民授權更換新政府
  - label: C
    content: 國家對內主權受影響
  - label: D
    content: 國家的邦交國家增加
- id: doc_113_台北_仁愛_社會_公民_g8s1e1_s2_12
  section: 2
  number: 12
  type: single
  page: 1
  stem: 阿斌和友人參加遊行活動，卻因推擠維持秩序的警察而遭到逮捕，遊行群眾紛紛質疑警察執法的合理性，認為有執法過當和侵害人權的爭議。遊行群眾的觀點，反映出現代民主國家的何種法治觀點？
  options:
  - label: A
    content: 人民必須遵守法律
  - label: B
    content: 政府必須遵守法律
  - label: C
    content: 警察擁有絕對權力
  - label: D
    content: 法律促進社會進步
- id: doc_113_台北_仁愛_社會_公民_g8s1e1_s2_13
  section: 2
  number: 13
  type: single
  page: 1
  stem: 新冠肺炎疫情期間，政府在處理確診者足跡上，曾有民眾因與確診者足跡重疊而被匡列進行隔離，所以強烈表示不滿。下列哪一項政府的回應，最符合法治國家的精神？
  options:
  - label: A
    content: 人民應建立守法的觀念，避免影響政府權力
  - label: B
    content: 政府的法律和政策，以保障人民權利為目的
  - label: C
    content: 多數人投票通過的法律，即可犧牲少數人權
  - label: D
    content: 政府推動政策保持彈性，才能有效發揮權力
- id: doc_113_台北_仁愛_社會_公民_g8s1e1_s2_14
  section: 2
  number: 14
  type: single
  page: 1
  stem: 當社會逐漸走向富裕之際，應避免資源分配不均，以免社會上的弱勢群體無法獲得公平競爭的機會。要達成上述目的，國家應加強下列哪個功能的發揮？
  options:
  - label: A
    content: 保衛國家安全
  - label: B
    content: 落實責任政治
  - label: C
    content: 發展社會福利
  - label: D
    content: 維持社會秩序
- id: doc_113_台北_仁愛_社會_公民_g8s1e1_s2_15
  section: 2
  number: 15
  type: single
  page: 2
  stem: 大仁國的漁船闖入小愛國的專屬海域內捕魚，而遭到扣押。大仁國漁船被扣押，是因為其侵犯了小愛國的何種國家組成要素？
  options:
  - label: A
    content: 人民、主權
  - label: B
    content: 主權、領土
  - label: C
    content: 領土、政府
  - label: D
    content: 政府、人民
- id: doc_113_台北_仁愛_社會_公民_g8s1e1_s2_16
  section: 2
  number: 16
  type: single
  page: 2
  stem: 秋瑾市有三個預售屋建案違反法規，樣品屋尺寸和實際施工圖不符，嚴重誤導購屋民眾，秋瑾市政府依法開罰。上述內容展現出民主政治的何種特色？
  options:
  - label: A
    content: 責任政治
  - label: B
    content: 法治政治
  - label: C
    content: 政黨政治
  - label: D
    content: 民意政治
- id: doc_113_台北_仁愛_社會_公民_g8s1e1_s2_17
  section: 2
  number: 17
  type: single
  page: 2
  stem: 2000 年的美國總統大選，共和黨的小布希與民主黨的高爾，彼此得票數十分接近，因此訴諸法院；美國最高法院作出判決，由小布希贏得總統大選。儘管高爾對此判決強烈不滿，但他還是作出讓步並接受結果，下列何者為高爾接受此一結果的主因？
  options:
  - label: A
    content: 聽取各界人士的民意
  - label: B
    content: 遵守法治政治的精神
  - label: C
    content: 維持政黨競爭的模式
  - label: D
    content: 落實應盡的政治責任
- id: doc_113_台北_仁愛_社會_公民_g8s1e1_s2_18
  section: 2
  number: 18
  type: single
  page: 2
  stem: 民間團體主張應適度調高菸品健康福利捐的金額，以降低吸菸人口。主管機關表示，目前規定的菸捐若欲調整，必須請立法院修改相關規定。主管機關的上述態度與下列何者有關？
  options:
  - label: A
    content: 法律旨在保障人民權利
  - label: B
    content: 政府施政必須依循法律
  - label: C
    content: 法規內容需能與時俱進
  - label: D
    content: 菸捐有助增加財政收入
- id: doc_113_台北_仁愛_社會_公民_g8s1e1_s2_19
  section: 2
  number: 19
  type: single
  page: 2
  stem: 目前大部分民主國家，均依照三權分立的精神，規畫其政府的組織與職權。關於三權分立學說，下列敘述何者正確？
  options:
  - label: A
    content: 由西方學者蘇格拉底與亞里斯多德所提出
  - label: B
    content: 將政府的權力分為行政、立法、司法三權
  - label: C
    content: 主張三種權力均由同一政府機關獨立行使
  - label: D
    content: 經由我國孫中山先生的五權分立簡化而成
- id: doc_113_台北_仁愛_社會_公民_g8s1e1_s2_20
  section: 2
  number: 20
  type: single
  page: 2
  stem: 幸福國首相請求該國女王於重大決策時，關閉國會5 個星期。此舉由最高法院判決，認為促請女王關閉國會，不僅缺乏合理理由、且嚴重影響國會行使民主職權，因此無效，國會須在最短時間內重新召開。下列何位學者在分析此事時，推論最為正確？
  options:
  - label: A
    content: 學者甲：該國實施五權分立的制度
  - label: B
    content: 學者乙：行政權出現效率低落問題
  - label: C
    content: 學者丙：法院解決立法權專制困境
  - label: D
    content: 學者丁：司法權制衡行政權的展現
- id: doc_113_台北_仁愛_社會_公民_g8s1e1_s2_21
  section: 2
  number: 21
  type: single
  page: 2
  stem: 依《就業服務法》規定，雇主不得詢問求職者與工作無關的隱私資料，但像是計程車司機、教保服務人員等職業，因為工作性質的考量，則可確認求職者是否有性犯罪前科。有關上述例外情形的規定，最可能是基於何種國家存在的目的？
  options:
  - label: A
    content: 保衛國家安全
  - label: B
    content: 促進經濟發展
  - label: C
    content: 發展社會福利
  - label: D
    content: 保障人民權利
- id: doc_113_台北_仁愛_社會_公民_g8s1e1_s2_22
  section: 2
  number: 22
  type: single
  page: 2
  stem: 南韓每五年舉辦一次總統大選，2022 年大選時在野的國民力量黨候選人尹錫悅，以不到百分之一差距，擊敗執政黨共同民主黨的候選人李在明，贏得本屆選舉。上述內容與下列哪一組概念最為相關？
  options:
  - label: A
    content: 公民資格與國籍認同
  - label: B
    content: 有限政府與法治政治
  - label: C
    content: 定期授權與政黨政治
  - label: D
    content: 國家主權與政府變動
- id: doc_113_台北_仁愛_社會_公民_g8s1e1_s2_23
  section: 2
  number: 23
  type: single
  page: 2
  stem: 根據我國《憲法》規定，考試院院長由總統提名，經立法院同意任命之。這樣的規定最能直接展現下列何種民主國家的政治概念？
  options:
  - label: A
    content: 以選舉實踐主權在民的精神
  - label: B
    content: 藉由分權制衡促成有限政府
  - label: C
    content: 透過法律保障人民消極權利
  - label: D
    content: 人治社會中的政治權力運作
- id: doc_113_台北_仁愛_社會_公民_g8s1e1_s2_24
  section: 2
  number: 24
  type: single
  page: 2
  stem: 阿偉聽了一場演講，講題為「現代法治社會的意義」，則阿偉最可能聽到下列哪項論述？
  options:
  - label: A
    content: 藉由法律以明確規定政府的權利與人民的權力
  - label: B
    content: 國家的法律具有強制力，主要在規範內在良知
  - label: C
    content: 現代民主國家中絕大部分都是以人治作為基礎
  - label: D
    content: 透過民意代表與法定程序來立法保障基本人權
- id: doc_113_台北_仁愛_社會_公民_g8s1e1_s2_25
  section: 2
  number: 25
  type: single
  page: 2
  stem: 愛唱歌卻不管時間的胖虎半夜在家中大聲高歌時，發生如右圖的情形。根據圖中所示與民主國家的相關概念判斷，下列敘述何者正確？
  options:
  - label: A
    content: 警察的做法有助發揮保障國家安全目的
  - label: B
    content: 胖虎的權益在法治國家不應受任何限制
  - label: C
    content: 警察欲以國家的公權力來保障胖虎權益
  - label: D
    content: 胖虎唱歌的權利行使須遵守法律的規定
  assets:
  - key: s2_25_f1
    kind: figure
    file: doc_113_台北_仁愛_社會_公民_g8s1e1/s2_25_f1.png
- id: doc_113_台北_仁愛_社會_公民_g8s1e1_s2_26
  section: 2
  number: 26
