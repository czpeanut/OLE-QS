  type: single
  page: 2
  stem: '計時的觀念，是日本統治臺灣後才帶進來的。總督府統治臺灣後實施「午砲報時」，也就是在正午十二點準時發砲，提醒人們中午休息時間到了，大家也慢慢習慣聽到午砲就是午餐時間，各公家機關、學校就開始午休或下課了。

