  page: 1
  stem: 阿甲到臺灣的農村訪問當地稻農，稻農們提到：「最近幾年，從整地、秧苗、農藥、肥料等樣樣漲價，成本提高。且10 多年前開始從國外進口農產品，他們的生產成本低，我們根本無法競爭。」請問：上述臺灣無法與國外低價農產品競爭的主因為何？
