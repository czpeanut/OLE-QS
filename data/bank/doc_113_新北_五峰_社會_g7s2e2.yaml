  section: 3
  number: 28
  type: single
  page: 3
  stem: 加拿大政府1883~1996 年間資助原住民族寄宿學校，寄宿學校的政策來自白人的價值觀─白人覺得自己優越於他人，便把視為野蠻民族的原住民小孩集中到基督教會管理的學校進行改造。這些原住民小孩必須和家人、村落分離，直到十多歲才能回來，回到社會後適應不良便用喝酒、嗑藥來面對生活壓力與創傷，他們的子女也變成被忽略的一群，傷害一代傳一代…。從文化特性的角度分析，加拿大白人政府資助原住民族寄宿學校的目的為何？
