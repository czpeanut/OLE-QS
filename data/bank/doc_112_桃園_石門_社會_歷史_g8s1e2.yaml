  stem: '小新在一篇歷史專題文章中看見下圖中的故事，對於故事中提到的「該國」十分好奇。根據內容判斷，有關「該國」與宋朝之間的關係，下列哪項敘述符合史實？


    | 契丹貴族以學詩為雅事，該國的皇帝與后妃之中擅長寫詩者亦不少。據說宋人張芸叟奉命出使該國，夜宿幽州（今北京）客館，發現牆上題有蘇軾的「老人行」，書店亦有販賣「大蘇小集」（將蘇軾的詩集結出版）。張芸叟便在牆上的「老人行」後面寫下：「誰題佳句到幽都，逢著胡兒問大蘇。」
    |'
