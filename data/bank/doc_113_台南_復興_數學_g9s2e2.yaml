- id: doc_113_台南_復興_數學_g9s2e2_s2_2
  section: 2
  number: 2
  type: calc
  page: 6
  stem: '(1) 某圖書館地板是長為 60 公尺、寬為 30 公尺的矩形。為預防普通火災，若採用滅火效能值「$A-3$, $B-10$, $C$」的滅火器，則至少需要設置多少支滅火器？

    (2) 時代商場平面面積為 10000 平方公尺，為了預防治油類火災，整個商場內設有兩種不同規格的滅火器，兩種滅火器的滅火效能值分別為「$A-1$, $B-4$,
    $C$」及「$A-3$, $B-10$, $C$」。若時代商場使用了這兩種的滅火器，且剛好符合各類場所所需之最低滅火效能值，則該商場至少設置了多少支滅火器？'
  group_stem: '火災往往都是從小火開始，在還沒延燒到其他可燃物時，只要能使用滅火器將小火熄滅，就可阻止災害擴大。當面對火災時，選擇適合的滅火器更是重要，不同類型的火災需要不同類型的滅火器才能有效撲滅，而滅火器上的標示提供了關於滅火器「適用的火災類型」和「滅火效能值」等相關訊息，其中滅火效能值指的是單支滅火器的性能指標，如圖(一)所示。


    已知各類場所潛在的火災風險不同，需視潛在的火災性質設置適當的滅火器，表(一)是各類場所滅火器設置所需之最低滅火效能值。例如：某電影院的一樓面積為 2000
    平方公尺，則所需之最低滅火效能值為 $2000 \div 100 = 20$ 單位。


    表(一)

    | 場所 | 所需之最低滅火效能值 |

    | :--- | :--- |

    | 電影院、商場 | 各層樓地板面積每 100 平方公尺（含未滿）應有 1 單位滅火效能值 |

    | 補習班、圖書館 | 各層樓地板面積每 200 平方公尺（含未滿）應有 1 單位滅火效能值 |

    | 廚房 | 地板面積每 25 平方公尺（含未滿）應有 1 單位滅火效能值 |'
