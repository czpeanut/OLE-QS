  type: single
  page: 4
  stem: '如右圖，四邊形 $ABCD$ 是一個正方形，今欲在平面上找一點 $P$，使得 $\triangle BDP$ 的面積是正方形 $ABCD$ 面積的一半，以下是林葳、王宇兩人的作法：

    （林葳）1. 作正方形 $CEFG$，使 $E$ 點在 $\overline{CD}$ 上、$G$ 點 $\overline{BC}$ 延長線上

    2. 連接 $\overline{CF}$，並在 $\overline{CF}$ 上取一點 $P$

    3. 連接 $\overline{BD}$、$\overline{BP}$ 和 $\overline{DP}$，則 $\triangle BDP$ 即為所求

    （王宇）1. 連接 $\overline{BD}$，以 $B$ 點為圓心，$\overline{BD}$ 為半徑畫弧，交 $\overline{DC}$ 延長線於
    $E$ 點（$D \neq E$）

    2. 連接 $\overline{BE}$，並作 $\overline{BE}$ 中點 $P$

    3. 連接 $\overline{DP}$，則 $\triangle BDP$ 即為所求

    對於兩人的作圖，下列判斷何者正確？'
