  stem: 漁夫辭去時，桃源中人語云：「不足為外人道也。」可見桃源中人並不希望桃花源曝光。下列詩作何者最能凸顯桃源中人自我保護，而不願外人闖入的情境？
  options:
  - label: A
    content: 是地從來無俗客，當年到此避強秦。洞天久與塵寰隔，不管人間秋復春
  - label: B
    content: 尋得桃源好避秦，桃紅又是一年春。花飛莫遣隨流水，怕有漁郎來問津
  - label: C
    content: 隱隱飛橋隔野煙，石磯西畔問漁船。桃花盡日隨流水，洞在清溪何處邊
  - label: D
    content: 此來種桃經幾春，採花食實枝為薪。兒孫生長與世隔，雖有父子無君臣。
  group_stem: "晉太元中，武陵人捕魚為業。緣① 溪行，忘路之遠近。忽逢桃花林，夾岸數百步，中無雜樹，芳草鮮美，落英② 繽紛，漁人甚異之。復前行，欲窮其林。\n\
    \    林盡水源，便得一山，山有小口，彷彿若有光。便捨船，從口入。初極狹，才通人。復行數十步，豁然開朗。土地平曠③ ，屋舍儼然④ ，有良田美池桑竹之屬。阡陌⑤\
    \ 交通，雞犬相聞。其中往來種作，男女衣著，悉如外人。黃髮垂髫⑥ ，並怡然自樂。\n    見漁人，乃大驚，問所從來，具答之。便邀還家，設酒殺雞作食。村中聞有此人，咸來問訊。自云先世避秦時亂，率妻子邑人來此絕境⑦\
    \ ，不復出焉，遂與外人間隔。問今是何世，乃不知有漢，無論魏晉。此人一一為具言⑧ 所聞，皆嘆惋。餘人各復延⑨ 至其家，皆出酒食。停數日，辭去。此中人語云：「不足為⑩\
    \ 外人道也。」\n    既出，得其船，便扶向路⑪ ，處處志⑫ 之。及郡下，詣⑬ 太守，說如此。太守即遣人隨其往，尋向所志，遂迷，不復得路。\n    南陽劉子驥，高尚士也，聞之，欣然規⑭\
    \ 往。未果⑮ ，尋⑯ 病終，後遂無問津⑰ 者。\n(陶潛〈桃花源記〉)\n注釋：\n① 緣：沿著，順著。② 落英：落花。③ 曠：開闊；寬闊。④ 儼然：整齊的樣子。⑤\
    \ 阡陌：田間小路。⑥ 黃髮垂髫：指老人和小孩。⑦ 絕境：與人世隔絕的地方。⑧ 具言：詳細地說。⑨ 延，邀請。⑩ 為：向、對。⑪ 便扶向路：就順著舊的路（回去）。⑫\
    \ 志：做標記。⑬ 詣：拜見。⑭ 規：計劃，打算。⑮ 果：實現。⑯ 尋：不久。⑰ 問津：問路，這裡是探訪，訪求的意思。"
