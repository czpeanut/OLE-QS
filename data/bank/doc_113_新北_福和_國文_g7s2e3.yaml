- id: doc_113_新北_福和_國文_g7s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 根據〈五柳先生傳〉的文句說明，下列何者錯誤？
  options:
  - label: A
    content: 「先生不知何許人也，亦不詳其姓字。宅邊有五柳樹，因以為號焉」──對生平輕描淡寫，暗示其隱士身分，不逐名利
  - label: B
    content: 「好讀書，不求甚解」──廣泛閱讀而博學強記，但不強求將各種知識或事物加以融會貫通、也不追求全面透徹的領悟
  - label: C
    content: 「既醉而退，曾不吝情去留」──凸顯五柳先生率真自得、不拘禮俗的個性
  - label: D
    content: 「常著文章自娛，頗示己志」──撰文寫詩不為展現文才，只求能抒發情志。
  lesson_raw:
    title: 五柳先生傳
- id: doc_113_新北_福和_國文_g7s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 〈五柳先生傳〉一文最後以「無懷氏之民歟！葛天氏之民歟！」作結尾，其用意是什麼？
  options:
  - label: A
    content: 佩服先王無懷氏與葛天氏有民胞物與的胸襟
  - label: B
    content: 暗喻自己逍遙自適，有如上古淳樸社會之人
  - label: C
    content: 感傷自己生不逢時，未遇賢君不能一展抱負
  - label: D
    content: 嘲諷當今掌權者不如無懷氏與葛天氏之賢德。
  lesson_raw:
    title: 五柳先生傳
- id: doc_113_新北_福和_國文_g7s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 「不戚戚於貧賤，不汲汲於富貴。」這句話所呈現的精神，與下列何者最不相同？
  options:
  - label: A
    content: 君子之道，居勞苦則能忍，處富樂則能謙
  - label: B
    content: 飯疏食，飲水，曲肱而枕之，樂亦在其中矣
  - label: C
    content: 食無求飽，居無求安，謀道不謀食，憂道不憂貧
  - label: D
    content: 一簞食，一瓢飲，在陋巷，人不堪其憂，回也不改其樂。
  lesson_raw:
    title: 五柳先生傳
- id: doc_113_新北_福和_國文_g7s2e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 黔婁死時，曾子前往弔喪。曾子看見黔婁的屍體僅用太小的布被蓋著，因此曾子說：「如果斜拉著，就可以全遮蓋了。」但黔婁的妻子卻說：「黔婁一生就是因為其人不斜（通「邪」），才能享有今天『賢者』之名。他活著的時候都不斜，死後卻要他斜，這不符他的心意。」曾子又問：「黔婁先生死了，要追封什麼諡號呢？」他的妻子說：「就以『康』為諡。」曾子說：「黔婁先生生前食不飽、穿不暖，死後連頭腳都遮蓋不全，又無酒肉來祭他，怎會樂意用『康』為諡呢？」他的妻子說：「黔婁先生在世時，國君曾要他當宰相，而他不接受，這已經夠尊貴了。曾賜他三十鍾的俸祿，但他推辭不要，也已經夠富有了。黔婁一生以天下淡味為美食，以天下卑賤的職位為安適，不戚戚於貧賤，不汲汲於富貴，求仁而得仁，求義而得義，如今以『康』為諡，不是很適當嗎？」曾子說：「只有黔婁這樣賢能的人，才有這樣賢慧的妻子！」關於這段文字，
    下列何者是黔婁之妻用來解釋黔婁適合以「康」為諡的理由？
  options:
  - label: A
    content: 曾允諾國君擔任宰相一職
  - label: B
    content: 樂於遍嘗天下美食
  - label: C
    content: 接受國君賞賜的豐厚俸祿
  - label: D
    content: 安立於天下的卑位。
- id: doc_113_新北_福和_國文_g7s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 〈五柳先生傳〉「贊曰：黔婁之妻有言：『不戚戚於貧賤，不汲汲於富貴。』極其言，茲若人儔乎？酣觴賦詩，以樂其志。無懷氏之民歟！葛天氏之民歟！」針對這段模仿史傳的評論中，使用的代詞其所指稱的對象，下列何者正確？
  options:
  - label: A
    content: 極「其」言──黔婁之妻
  - label: B
    content: 「茲」若人之儔乎──黔婁
  - label: C
    content: 茲「若人」之儔乎──五柳先生
  - label: D
    content: 以樂「其」志──黔婁。
  lesson_raw:
    title: 五柳先生傳
- id: doc_113_新北_福和_國文_g7s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 〈五柳先生傳〉中「造飲輒盡，期在必醉，既醉而退，曾不吝情去留。」描繪出五柳先生與朋友歡聚暢飲的神態，下列何者敘述的情境與此句相差最遠？
  options:
  - label: A
    content: 金樽清酒鬥十千，玉盤珍饈值萬錢。停杯投箸不能食，拔劍四顧心茫然
  - label: B
    content: 兩人對酌山花開，一杯一杯復一杯。我醉欲眠卿且去，明朝有意抱琴來
  - label: C
    content: 烹羊宰牛且為樂，會須一飲三百杯。岑夫子，丹丘生，將進酒，杯莫停
  - label: D
    content: 盤飧市遠無兼味，樽酒家貧只舊醅。肯與鄰翁相對飲，隔籬呼取盡餘杯。
  lesson_raw:
    title: 五柳先生傳
- id: doc_113_新北_福和_國文_g7s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: '〈五柳先生傳〉一文分成「傳」和「贊」兩部分。下表二者旨意彼此呼應的文句何者不正確？

    | | 傳 | 贊 |

    | :--- | :--- | :--- |

    | (A) | 先生不知何許人也 | 無懷氏之民歟！葛天氏之民歟！ |

