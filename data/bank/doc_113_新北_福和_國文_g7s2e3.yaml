- id: doc_113_新北_福和_國文_g7s2e3_s2_39
  section: 2
  number: 39
  type: single
  page: 6
  stem: 「做卑微的工作，樹高傲的自尊，變成了風氣以後，崢嶸的現象，有時是令人難以置信的。」請問這句話意味著將造成什麼樣的結果？
  options:
  - label: A
    content: 人人均從事卑微的工作，使社會變得無法相互信賴
  - label: B
    content: 唯有人人競爭互不相讓，社會才能得到長足的進步
  - label: C
    content: 人人皆願勤苦努力，社會必然呈現蓬勃發展的景象
  - label: D
    content: 人人刻苦自勵，社會必然因為競爭激烈而造成分裂。
  group_stem: "到此做工已半月，不像是做工，像是恢復了以前當兵的生活。如果我們中國還可以找出這樣緊張的工作，那只有在軍隊裡了。同事的有從韓國剛當過兵回來的，有遠從加州大學來的學生。我問他們，美國做工全這樣緊張嗎？他們異口同聲的說：「這裡可能是最清閒的。」\n\
    \    如不置身其中，可能怎樣也不容易說明白。在日光下整整推上八小時的草，或在小雨中漆上八小時的牆，下工以後，只覺得整個人已癱下來，比行軍八小時還要累得多。\n\
    \    今天下工後，已近黃昏，我坐在湖邊對著遠天遐想。這個環境美得像首詩，也像幅畫。大匠畫成這個「靜湖」，用的全是藍色。第一筆用淡藍畫出湖水；第二筆加了一些顏色，用深藍畫出山峰；第三筆又減去一些顏色，用淺藍畫出天空來。三筆的靜靜畫幅中，斜躺著一個下工後疲倦不堪的動物。我想整個美國的山水人物畫，都可以此為代表。\n\
    \    雖然眼前景色這樣靜，這樣美，但我腦筋中依然是日間同事們的緊張面孔與急促步伐的影子。我的脈搏好像還在加速的跳動。我昏沉沉的頭腦中得到一個結論：「這樣拚命的工作，這個國家當然要強。」\n\
    \    中學生送牛奶、送報，大學生做苦力、做僕役，已經是太習慣了的事，這些工作已經變成教育中的一部分。這種教育，讓每一個學生自然的知道了什麼是生活，什麼是人生。所以一個個美國孩子，永遠獨立、勇敢、自尊，像個「哲學家皇帝」。\n\
    \    希臘哲人想出一種訓練帝王的辦法，這種辦法是讓他「從生硬的現實上挫斷足脛再站起來，從高傲的眉毛滴下汗珠來賺取自己的衣食。」這是做一個帝王必經的訓練，可惜歐洲從未實行過這種理想。沒有想到，新大陸上卻無形中在實踐這句話，每一個青年，全在無形中接受這種帝王的訓練。\n\
    \    做卑微的工作，樹高傲的自尊，變成了風氣以後，崢嶸的現象，有時是令人難以置信的。耶魯大學有個學生，父親遺產三十萬美金，他拒絕接受。他說：「我有兩隻手、一個頭已夠了。」報紙上說：「父親是個成功的創業者，兒子真正繼承了父親的精神。」\n\
    \    青年們一切都以自己為出發，承受人生所應有的負擔，享受人生所應有的快樂。青年們的偶像不是叱咤風雲的流血家，而是勤苦自立的創業者。《富蘭克林自傳》是每個人奉為圭臬的經典。\n\
    \    我們試聽他們的歌聲，都是鋼鐵般的聲響的：\n人生是一奮鬥的戰場，\n到處充滿了血滴與火光，\n不要做一甘受宰割的牛羊，\n在戰鬥中，要精神煥發，要步伐昂揚！\
    \ ──朗法羅\n    我很欽佩在綠色的大地上，金色的陽光中，一個個忙碌得面頰呈現紅色的青年。然而，我在湖邊凝想了半天，我總覺得，這個美國青年畫幅裡面還缺少一些東西。什麼東西，我不太能指出，大概是人文的素養吧！我在此三、四個月的觀感，可以說：美國學生很少看報的，送報而不看報，這是令人不可思議的事。\n\
    \    「哲學家皇帝」，不僅要受苦，還要有一種訓練，使他具有雄偉抱負與遠大的眼光。可惜這一點，美國教育是忽略了，忽略的程度令人可哀。\n    愛因斯坦說：「專家還不是訓練有素的狗。」這話並不是偶然而發的，多少專家都是人事不知的狗，這種現象是會窒死一個文化的。\n\
    \    民主，並不是「一群會投票的驢」；民主，確實需要全國國民都有「哲學家皇帝」的訓練。在哲學家皇帝的訓練中，勤苦自立，體驗生活的那一部分，美國的教育與社會所賦與青年的，足夠了；而在人文的訓練，卻差得很多。\n\
    \    晚風襲來，湖水清澈如鏡，青山恬淡如詩，我的思想也逐漸澄明而寧靜。天暗下來，星星，一個一個的亮了。\n    民國四十四年七月二日於紐約州靜湖\n\
    （此篇選自陳之藩《旅美小簡·哲學家皇帝》）"
  lesson_raw:
    title: 哲學家皇帝
