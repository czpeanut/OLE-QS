    | (C) | 不慕榮利 | 不戚戚於貧賤，不汲汲於富貴 |

    | (D) | 性嗜酒，常著文章自娛，頗示己志 | 酣觴賦詩，以樂其志。 |'
  options:
  - label: A
    content: 如表 (A)
  - label: B
    content: 如表 (B)
  - label: C
    content: 如表 (C)
  - label: D
    content: 如表 (D)
  lesson_raw:
    title: 五柳先生傳
- id: doc_113_新北_福和_國文_g7s2e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 「白髮被兩鬢，肌膚不復實。雖有五男兒，總不好紙筆。阿舒已二八，懶惰故無匹。阿宣行志學，而不愛文術；雍、端年十三，不識六與七。通子垂九齡，但覓梨與栗。天運苟如此，且進杯中物。」（陶淵明〈責子詩〉）關於本詩的敘述下列何者正確？
  options:
  - label: A
    content: 作者對於五個孩子表現出無奈不滿、恨鐵不成鋼的心理
  - label: B
    content: 長子阿舒二十八歲，次子阿宣十五歲，都懶惰不愛讀書
  - label: C
    content: 雍、端這兩個雙胞胎都已十三歲了，對數字的概念很好
  - label: D
    content: 在飲酒微醺中，以輕鬆筆調帶出兒子們栩栩如生的形象。
- id: doc_113_新北_福和_國文_g7s2e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 〈五柳先生傳〉為陶淵明的自況，但為何陶淵明不直接以真實身分來寫自傳呢？
  options:
  - label: A
    content: 以虛擬人物，寄託自我的理想較能無所顧忌而顯得客觀
  - label: B
    content: 魏晉是重視門第的時代，作者家境貧寒，害怕受到歧視
  - label: C
    content: 策勵自己潔身自愛，不可如柳樹般枝條柔軟，隨俗浮沉
  - label: D
    content: 作者是名門世家之後，為了避免招忌故不透露真實身分。
  lesson_raw:
    title: 五柳先生傳
- id: doc_113_新北_福和_國文_g7s2e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 「結廬在人境，而無車馬喧。問君何能爾？心遠地自偏。采菊東籬下，悠然見南山。山氣日夕佳，飛鳥相與還。此中有真意，欲辯已忘言。」（陶淵明〈飲酒詩〉）關於「結廬在人境，而無車馬喧。問君何能爾？心遠地自偏。」這段話和下列何者相近？
  options:
  - label: A
    content: 譬如行遠必自邇，登高必自卑
  - label: B
    content: 大隱隱於市朝，小隱隱於山林
  - label: C
    content: 己欲立而立人，己欲達而達人
  - label: D
    content: 不戚戚於貧賤，不汲汲於富貴
- id: doc_113_新北_福和_國文_g7s2e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 陶淵明〈歸園田居〉「種豆南山下，草盛豆苗稀。晨興理荒穢，帶月荷鋤歸。道狹草木長，夕露沾我衣。衣沾不足惜，但使願無違。」下列何者敘述正確？
  options:
  - label: A
    content: 由「種豆南山下，草盛豆苗稀」一句可得知：作者擅長農務並且樂在其中
  - label: B
    content: 「晨興理荒穢，帶月荷鋤歸」一句旨在表示作者經常早出晚歸，體能優異
  - label: C
    content: 由「道狹草木長，夕露沾我衣」可知作者頗懂得忙裡偷閒、享受田野美景
  - label: D
    content: 「衣沾不足惜，但使願無違」可得知作者希望順遂心志，不在乎物質條件。
- id: doc_113_新北_福和_國文_g7s2e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 「人生無根蒂，飄如陌上塵，分散逐風轉，此已非常身。落地為兄弟，何必骨肉親？得歡當作樂，斗酒聚比鄰。盛年不重來，一日難再晨；及時當勉勵，歲月不待人。」（陶淵明〈雜詩〉）請問本詩的主旨為何？
  options:
  - label: A
    content: 感傷人生苦短，更應該及時行樂，今朝有酒今朝醉
  - label: B
    content: 人生聚散無常，四海皆兄弟，當愛惜光陰及時奮起
  - label: C
    content: 人生飄泊不定，相聚時賓主盡歡，酒逢知己千杯少
  - label: D
    content: 世態炎涼人情澆薄，豈能不識時務，只好隨波逐流。
- id: doc_113_新北_福和_國文_g7s2e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 「曾不吝情去留」句中「去留」二字的意思相反，但詞義只保留「去」的意思，稱為偏義複詞。下列選項「 」中的詞語，何者不是偏義複詞？
  options:
  - label: A
    content: 真正有效率的工作方法，是必須區分事情的輕重「緩急」
  - label: B
    content: 天有不測風雲，人有旦夕「禍福」，做事都必得小心謹慎
  - label: C
    content: 羅茱兩人殉情後，家人放下仇隙，過往「恩怨」一筆勾銷
  - label: D
    content: 對待部屬要公正無私，獎懲不能因個人好惡而有所「異同」。
- id: doc_113_新北_福和_國文_g7s2e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 陶公少時，作魚梁吏，嘗以一坩鮓餉母。母封鮓付使，反書責侃曰：「汝為吏，以官物見餉，非唯不益，乃以增吾憂也！」（劉義慶《世說新語·賢媛篇》）下列敘述何者為非？
  options:
  - label: A
    content: 陶公年輕的時候曾經擔任管理漁業的小官
  - label: B
    content: 陶母認為他這樣做是假公濟私，有損清廉
  - label: C
    content: 陶公親自送醃魚給母親，當面被母親痛罵
  - label: D
    content: 陶公當官後，就想要表達孝敬母親的心意。
- id: doc_113_新北_福和_國文_g7s2e3_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 「昔欲居南村，非為卜其宅；聞多素心人，樂與數晨夕。懷此頗有年，今日從茲役。敝廬何必廣，取足蔽床席。鄰曲時時來，抗言談在昔；奇文共欣賞，疑義相與析。」（陶潛〈移居〉）根據本文，下列敘述何者正確？
  options:
  - label: A
    content: 作者搬到南村來住的過程是即知即行
  - label: B
    content: 作者與鄰居時常往來且常大聲地吆喝
  - label: C
    content: 作者因為南村樸素天真的人多而搬家
  - label: D
    content: 和作者交遊往來的人應該大都是文盲。
- id: doc_113_新北_福和_國文_g7s2e3_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 請問洪愛珠〈摩登土產鳳梨酥〉一文的主旨，應是下列何者？
  options:
  - label: A
    content: 作者提倡以推廣臺灣美食鳳梨酥來帶動國民外交
  - label: B
    content: 作者關心食安議題，潛心研究鳳梨酥的內餡食材
  - label: C
    content: 作者感慨飲食習慣改變，鳳梨酥的口味大不如前
  - label: D
    content: 作者說明鳳梨酥的今昔變化與特色，並抒發感悟。
  lesson_raw:
    title: 摩登土產鳳梨酥
- id: doc_113_新北_福和_國文_g7s2e3_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 「土鳳梨酥本自成一格也就是了，不料傳媒追捧過頭，反過來清算傳統鳳梨酥內餡裡的冬瓜餡，對此多訕笑，得出『鳳梨酥中無鳳梨』的結論。幾十年資歷的鳳梨酥，一時倒成了贗品。」關於這段話的意旨，下列敘述何者正確？
  options:
  - label: A
    content: 媒體過度強調差別，導致食物都產生二元對立
  - label: B
