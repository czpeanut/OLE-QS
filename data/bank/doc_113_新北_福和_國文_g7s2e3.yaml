  stem: 愛因斯坦說：「專家還不是訓練有素的狗。」請問這句話的涵義為何？
  options:
  - label: A
    content: 專家要像狗一樣，必須經過長期的訓練，才能擔負重大的責任
  - label: B
    content: 只要施予長期的訓練，即使只是一隻狗，也一樣能夠成為專家
  - label: C
    content: 專家只知投入自己的研究，而比不上一隻狗對週遭事物的關心
  - label: D
    content: 專家只精於一藝，若欠缺人文素養，就與訓練有素的狗沒兩樣。
  group_stem: "到此做工已半月，不像是做工，像是恢復了以前當兵的生活。如果我們中國還可以找出這樣緊張的工作，那只有在軍隊裡了。同事的有從韓國剛當過兵回來的，有遠從加州大學來的學生。我問他們，美國做工全這樣緊張嗎？他們異口同聲的說：「這裡可能是最清閒的。」\n\
    \    如不置身其中，可能怎樣也不容易說明白。在日光下整整推上八小時的草，或在小雨中漆上八小時的牆，下工以後，只覺得整個人已癱下來，比行軍八小時還要累得多。\n\
    \    今天下工後，已近黃昏，我坐在湖邊對著遠天遐想。這個環境美得像首詩，也像幅畫。大匠畫成這個「靜湖」，用的全是藍色。第一筆用淡藍畫出湖水；第二筆加了一些顏色，用深藍畫出山峰；第三筆又減去一些顏色，用淺藍畫出天空來。三筆的靜靜畫幅中，斜躺著一個下工後疲倦不堪的動物。我想整個美國的山水人物畫，都可以此為代表。\n\
    \    雖然眼前景色這樣靜，這樣美，但我腦筋中依然是日間同事們的緊張面孔與急促步伐的影子。我的脈搏好像還在加速的跳動。我昏沉沉的頭腦中得到一個結論：「這樣拚命的工作，這個國家當然要強。」\n\
    \    中學生送牛奶、送報，大學生做苦力、做僕役，已經是太習慣了的事，這些工作已經變成教育中的一部分。這種教育，讓每一個學生自然的知道了什麼是生活，什麼是人生。所以一個個美國孩子，永遠獨立、勇敢、自尊，像個「哲學家皇帝」。\n\
    \    希臘哲人想出一種訓練帝王的辦法，這種辦法是讓他「從生硬的現實上挫斷足脛再站起來，從高傲的眉毛滴下汗珠來賺取自己的衣食。」這是做一個帝王必經的訓練，可惜歐洲從未實行過這種理想。沒有想到，新大陸上卻無形中在實踐這句話，每一個青年，全在無形中接受這種帝王的訓練。\n\
    \    做卑微的工作，樹高傲的自尊，變成了風氣以後，崢嶸的現象，有時是令人難以置信的。耶魯大學有個學生，父親遺產三十萬美金，他拒絕接受。他說：「我有兩隻手、一個頭已夠了。」報紙上說：「父親是個成功的創業者，兒子真正繼承了父親的精神。」\n\
    \    青年們一切都以自己為出發，承受人生所應有的負擔，享受人生所應有的快樂。青年們的偶像不是叱咤風雲的流血家，而是勤苦自立的創業者。《富蘭克林自傳》是每個人奉為圭臬的經典。\n\
    \    我們試聽他們的歌聲，都是鋼鐵般的聲響的：\n人生是一奮鬥的戰場，\n到處充滿了血滴與火光，\n不要做一甘受宰割的牛羊，\n在戰鬥中，要精神煥發，要步伐昂揚！\
    \ ──朗法羅\n    我很欽佩在綠色的大地上，金色的陽光中，一個個忙碌得面頰呈現紅色的青年。然而，我在湖邊凝想了半天，我總覺得，這個美國青年畫幅裡面還缺少一些東西。什麼東西，我不太能指出，大概是人文的素養吧！我在此三、四個月的觀感，可以說：美國學生很少看報的，送報而不看報，這是令人不可思議的事。\n\
    \    「哲學家皇帝」，不僅要受苦，還要有一種訓練，使他具有雄偉抱負與遠大的眼光。可惜這一點，美國教育是忽略了，忽略的程度令人可哀。\n    愛因斯坦說：「專家還不是訓練有素的狗。」這話並不是偶然而發的，多少專家都是人事不知的狗，這種現象是會窒死一個文化的。\n\
    \    民主，並不是「一群會投票的驢」；民主，確實需要全國國民都有「哲學家皇帝」的訓練。在哲學家皇帝的訓練中，勤苦自立，體驗生活的那一部分，美國的教育與社會所賦與青年的，足夠了；而在人文的訓練，卻差得很多。\n\
    \    晚風襲來，湖水清澈如鏡，青山恬淡如詩，我的思想也逐漸澄明而寧靜。天暗下來，星星，一個一個的亮了。\n    民國四十四年七月二日於紐約州靜湖\n\
    （此篇選自陳之藩《旅美小簡·哲學家皇帝》）"
  lesson_raw:
    title: 哲學家皇帝
- id: doc_113_新北_福和_國文_g7s2e3_s2_43
  section: 2
  number: 43
  type: single
  page: 7
  stem: 根據以上文章內容，下列何者說明不正確？
  options:
  - label: A
    content: 美國人習慣一人一份餐點，不習慣與他人分食
  - label: B
    content: 韓國人飲酒時若是把臉撇開表示非常不尊重人
  - label: C
    content: 臺灣人飲酒時喜歡一起玩喝酒遊戲，互動頻繁
  - label: D
    content: 法國人在用餐時習慣自己享用，不替長輩夾菜。
  group_stem: "「食衣住行育樂」是民生的六要素，「食」作為其中的第一項，可見吃飯對於人們生活的重要。「食」不只是維持人的生命機能，也能透過用餐習慣、餐桌禮節、食器等面向窺探一國文化面貌。\n\
    共享美味：不再獨享的「分食」新體驗\n    「我們會點很多菜一起分享，更有互動性！」政大國際傳播英語碩士學位學程學生 Austin 分享。今年已是他從美國來臺的第三年，談及在臺與朋友用餐時的文化差異，他馬上回答：「分食」。在美國通常是一人一份餐點，各自享用，不會分食。在Austin\
    \ 的印象中，只有小時候在家裡吃飯時，會做很多道菜一起分享，「在臺灣吃飯讓我想起童年。」\n    不過，對於來自韓國的廣播電視學系朴曙延來說，「分食」則是一件習以為常的事，因為韓國聚餐常以「大鍋菜」形式共餐。儘管「分食」本身並不是一項新體驗，不過「公筷母匙」觀念卻使他感到困惑與驚喜，「我一開始不懂為什麼要多放一雙筷子。」在韓國，基本上只有熟識的人才會一起吃飯，但即便與不熟的人吃飯，仍沒有使用「公筷母匙」共餐的習慣，「我們吃飯前會確認不用公筷是可以的。」\n\
    餐桌禮儀：感受差異、慢慢學習\n    不同文化下也有不同的餐桌禮儀，來自法國的交換學生Anna 分享，法國人用餐前會說一句祝福語「Bon appétit（祝你有好胃口）」。Anna\
    \ 來臺後將「Bon appétit」調整為臺灣版本，「我會改說『請慢用』，同時向我的朋友解釋什麼是『Bon appétit』。」\n    此外，Anna\
    \ 與Austin 對於臺灣人用餐時的「敬老」習慣都頗有心得。Austin 表示，在和朋友家人一起吃飯時發現，每當新菜上桌，朋友都會先替父母夾菜；Anna\
    \ 也有相同經驗，並分享與長輩吃飯時的內心掙扎：「我會不知道我應該先為他們（長輩）服務，還是像在法國時那樣，先幫自己就好。」Anna 則透過觀察別人在飯桌上的舉動，學習臺灣人用餐時的習慣，「我就像個小孩一樣，別人做什麼我就學起來。」\n\
    \    不同於Austin 與Anna 所受的文化衝擊，朴曙延對餐桌上的長幼關係則較習慣，因為韓國更強調彼此的輩分，「我們的輩分關係是用年來算，只要比我大一年，就算同屆，輩分也比我大。」他分享，在韓國與長輩用餐時，一定要等長輩動筷後，晚輩才能開始吃飯，對長輩講話也需使用敬語。\n\
    飲酒之道：人情、文化杯中見\n    除了吃飯外，飲酒也能展現一個地方的文化習慣。韓國的輩分關係在飲酒中實踐，替他人倒啤酒要留意不能有太多泡泡，更得用雙手為長輩斟酒，飲酒時也須將頭撇到一邊，不能直接面對著長輩。\n\
    \    Austin 則分享臺美飲酒互動的差異，在美國，大家通常是各自點自己的酒或飲品，按照自己的步調飲酒，只有舉杯致詞時才會互動；但臺灣人會以「小杯子」分酒後，再以「小杯子」乾杯，一邊吃飯、一邊玩喝酒遊戲。Austin\
    \ 很享受頻繁乾杯再為彼此倒酒的過程，「我覺得這樣很有趣，可以增加更多餐桌上的交流。」\n瑕不掩瑜：外籍生以「食」交流增感情\n    當問到最受不了臺灣人的吃飯習慣時，Austin、Anna\
    \ 與朴曙延都不約而同提到「吃飯發出聲音」，例如打嗝聲、清痰聲、咀嚼聲等。Anna 與臺灣人吃飯時注意到臺灣人吃飯會發出聲音，雖然有些不習慣，但也不至於不舒服。朴曙延則分享，韓國人在飯局中如果真的想打嗝，也會盡量不發出聲音，但臺灣人好像不太在意。Austin\
    \ 也表示，美國人吃飯時普遍會刻意不發出聲音、克制打嗝，但在臺三年，他也漸漸學起這個臺灣人的「習慣」，「我的室友對我很生氣，因為他不喜歡我這樣做！」\n \
    \   儘管在臺灣的餐桌上觀察到一些小缺點，但三人都認為，以「食」交流是非常好的互動。如同臺灣人會用「吃飽沒？」問候，朴曙延分享，韓國人也會將「吃飯」融入日常關心，會常問對方：「你吃飯了沒？」對朴曙延而言，吃飯本身就是一件互動較緊密的事，能幫助彼此增進感情。Anna\
    \ 則有感，臺灣的大圓桌比起法國的獨立小桌更適合也更容易在餐桌上交流；Austin 也說，在臺灣的三年間，在飯桌上他與許多朋友共同創造許多美好回憶，也喜歡藉由吃飯在各地交新朋友，「與朋友吃飯是我最喜歡的交流方式！」\n\
    吳冠緯〈從飯桌文化看世界：外籍生在臺的飲食體驗〉"
