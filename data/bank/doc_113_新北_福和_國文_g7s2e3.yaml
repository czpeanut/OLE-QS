  stem: 安妮將「保陸」聽成「豆乳」，將「聖旨」誤說成「槍子」，請問造成這種錯誤的原因是什麼？
  options:
  - label: A
    content: 安妮不諳臺語，將發音相近的字詞搞混，才鬧笑話
  - label: B
    content: 導演特地安排的橋段，凸顯安妮獨特的越南腔臺語
  - label: C
    content: 安妮來自越南，沒聽過這些專有名詞，才造成誤會
  - label: D
    content: 安妮初到異鄉，既陌生又恐懼，出現社交恐懼現象。
  group_stem: "本名阮氏映的安妮，正在舞臺上吟唱歌仔戲小調，紮實的表演身段、流利的臺語，任誰也猜不出她來自越南。\n離鄉背井的馬戲團人生\n    安妮的家鄉位於越南中北部的清化。某天，父親在電視上看到國家馬戲團甄選團員的廣告，一時興起要家中小孩嘗試看看。後來因為排行老大的姐姐功課成績太好，沒有興趣；弟弟年紀太小，不符報名資格。滿足父親願望的任務，落到了從小愛玩、愛跳舞、個性活潑的安妮身上。\n\
    \    經過三輪評選，年僅十歲的安妮從激烈競爭中脫穎而出，成為同期最年輕的入選者，開始越南國家馬戲團員的生活。「下腰、拉筋、平衡感，什麼都要學啊。」安妮說。最初對城市花花世界的好奇，隨即被訓練的辛苦取代。遠從家鄉隻身來到河內的安妮，平日生活只靠著團裡的一位阿姨照料，日子的難過辛苦沒有家人朋友可以傾吐。來到馬戲團第一年，安妮總是哭著想家。\n\
    \    正想放棄時，剛好有人退團，表演時少了一位團員，馬戲團要求安妮替補上場。年僅十一歲的她打破了經過三年培訓才能上臺表演的慣例，成為最年輕的一員，跟著前輩海內外四處表演。\n\
    遠渡重洋來臺，唱起歌仔戲\n二○○五年，十九歲的安妮跟著馬戲團來到嘉義藝都表演村，展開一年的表演。雜耍、後空翻、高空單人特技……高難度技巧的表演，總是引得觀眾一陣驚呼。而當時安妮並不曉得，未來的公公張金湖在舞臺下早已相中她，希望找來熟人牽線，介紹給兒子張芳遠認識。家中三代都是歌仔戲班的張芳遠，當時正在軍中服役，聽聞父親有意幫忙牽紅線，年紀尚輕的他一度有些排斥，直到見到安妮的單純認真，才決定展開追求。回憶起初交往時，總是說著破碎的中、英文，加上肢體動作才懂得彼此意思的光景，兩人都笑了。\n\
    \    嫁來臺灣後，忙著適應新生活、照顧出生的女兒，國、臺語聽說程度都還不好的安妮「以為頂多就是幫忙戲班打雜，或是翻翻觔斗、跑龍套。」但後來戲班人手不足，只會零星國語的安妮，只好硬著頭皮上臺。考慮到她的臺語不流利，戲班導演特地替安妮安排了丑角角色，負責串場、炒熱氣氛，臺詞說錯了也不要緊。但短短五句的臺詞，卻讓她吃足苦頭。為了初登場的表演，聽不懂臺語的安妮先是請先生教學，再用越文逐字逐句標記發音，「他說一句，我講一句，就像鸚鵡學舌一樣。」但因為全是硬背下來的，「我還是緊張到腦袋一片空白，全都忘光了！」安妮說。\n\
    \    隨著安妮的臺語越說越好，五年前，從戲班退休的資深演員相中她的表演潛力，特地邀請安妮擔任戲裡「女媧」一角。猶豫再三的她，想到過去每次克服挑戰後表現更上一層的經歷，決定答應。安妮雖然有過表演經驗，比起別人更具舞臺魅力、柔軟身段，但歌仔戲得說口白、吟曲調，臺上表演講究舉手投足的「腳步手路」更是絲毫馬虎不得。\n\
    \    更難的是，野臺演出時間不固定，安妮得在短短一週內學會整套戲路，身旁的先生、導演、戲班的資深前輩，全成了她的老師，「只要不會就問。」她說。儘管對自己首次擔綱主角的演出評價不差，但第二回上臺，「好不容易記下的臺詞又全忘光了。」她說。\n\
    苦練臺語，「吃苦當吃補」\n    初來乍到時，安妮曾因為不諳臺語鬧過不少笑話。正當她回想過去的「血淚史」時，旁人就已率先爆料，安妮昨日才剛把友人孫子「保陸」的姓名，誤聽為「豆乳」。此外，因為搞不清臺語發音的抑揚頓挫，把「聖旨」誤說成「槍子」的搞笑例子更是不勝枚舉。有時臺詞說錯了，若剛好遇上臺下觀眾只有三三兩兩，也就罷了，但若遇上爆滿觀眾，難免惹來一陣訕笑揶揄。「聽到有人在笑，就會難過，有時甚至氣到不想演了。」安妮說。好在小小年紀就離鄉背井、獨自生活的安妮，早已練就一身面對陌生環境的適應能力，就算遇到挫折，活潑開朗的她，也能馬上收拾好情緒。\n\
    \    從未想過成為歌仔戲演員的安妮坦言，戲班生活並不輕鬆。有著淡旺季之分的野臺歌仔戲，忙碌起來常是一整個月不間斷地連續演出，固定中午、晚上兩場表演結束後，戲班就得趕赴下個目的地。若幸運的話，表演地點就在嘉義附近，大夥兒還能抽空回家睡覺，但多數時候是戲團連夜趕車，在不同縣市間奔波。等到搭好戲棚可以入睡時，往往已經是凌晨時分。這樣的生活，安妮卻不以為苦。「吃苦當作吃補。」她用臺語說。\n\
    越南腔歌仔戲，贏得臺灣認同\n    跟著戲班南征北討，不少地方的鄉親都認識了安妮，每逢演出還會熱情為她送來紅包、水果，有時甚至指定由她主演。「就是要聽到我的越南腔啊。」安妮說。超乎預期的觀眾反應，讓她感到「足甘心耶。」\n\
    \    回想當年，當安妮告知父親自己即將嫁來臺灣，愛女心切的父親曾悶悶不樂。這幾年安妮的父親終於卸下了擔心，「因為他看到我現在的生活過得不錯啊！」安妮說。\n\
    （選自劉嫈楓《光華雜誌》）"
- id: doc_113_新北_福和_國文_g7s2e3_s2_37
  section: 2
  number: 37
  type: single
  page: 5
  stem: 下列格言，何者最不適合用來形容阮安妮「吃苦當吃補」的理念？
  options:
  - label: A
    content: 「就算現況看似無法翻轉，也千萬不能放棄戰鬥的意志，只要還撐著一絲力氣，就有勝利的可能！」(《進擊的巨人》)
  - label: B
    content: 「不管被打倒幾次都要站起來反擊，對戰士來說，能站到最後一刻的，就是贏家。」(《葬送的芙莉蓮》)
  - label: C
    content: 「當你陷入僵局時，要抗拒加倍努力的衝動。試著顛覆思惟框架，打破舊有模式，擁抱矛盾之處，重大突破就藏在那裡。」(萊斯莉．格蘭迪)
  - label: D
    content: 「就是因為一直身在谷底，才會比任何人都清楚底層的悲哀，但我還是無法捨棄爬上頂點的渴望。」(《我獨自升級》)。
  group_stem: "本名阮氏映的安妮，正在舞臺上吟唱歌仔戲小調，紮實的表演身段、流利的臺語，任誰也猜不出她來自越南。\n離鄉背井的馬戲團人生\n    安妮的家鄉位於越南中北部的清化。某天，父親在電視上看到國家馬戲團甄選團員的廣告，一時興起要家中小孩嘗試看看。後來因為排行老大的姐姐功課成績太好，沒有興趣；弟弟年紀太小，不符報名資格。滿足父親願望的任務，落到了從小愛玩、愛跳舞、個性活潑的安妮身上。\n\
    \    經過三輪評選，年僅十歲的安妮從激烈競爭中脫穎而出，成為同期最年輕的入選者，開始越南國家馬戲團員的生活。「下腰、拉筋、平衡感，什麼都要學啊。」安妮說。最初對城市花花世界的好奇，隨即被訓練的辛苦取代。遠從家鄉隻身來到河內的安妮，平日生活只靠著團裡的一位阿姨照料，日子的難過辛苦沒有家人朋友可以傾吐。來到馬戲團第一年，安妮總是哭著想家。\n\
    \    正想放棄時，剛好有人退團，表演時少了一位團員，馬戲團要求安妮替補上場。年僅十一歲的她打破了經過三年培訓才能上臺表演的慣例，成為最年輕的一員，跟著前輩海內外四處表演。\n\
    遠渡重洋來臺，唱起歌仔戲\n二○○五年，十九歲的安妮跟著馬戲團來到嘉義藝都表演村，展開一年的表演。雜耍、後空翻、高空單人特技……高難度技巧的表演，總是引得觀眾一陣驚呼。而當時安妮並不曉得，未來的公公張金湖在舞臺下早已相中她，希望找來熟人牽線，介紹給兒子張芳遠認識。家中三代都是歌仔戲班的張芳遠，當時正在軍中服役，聽聞父親有意幫忙牽紅線，年紀尚輕的他一度有些排斥，直到見到安妮的單純認真，才決定展開追求。回憶起初交往時，總是說著破碎的中、英文，加上肢體動作才懂得彼此意思的光景，兩人都笑了。\n\
    \    嫁來臺灣後，忙著適應新生活、照顧出生的女兒，國、臺語聽說程度都還不好的安妮「以為頂多就是幫忙戲班打雜，或是翻翻觔斗、跑龍套。」但後來戲班人手不足，只會零星國語的安妮，只好硬著頭皮上臺。考慮到她的臺語不流利，戲班導演特地替安妮安排了丑角角色，負責串場、炒熱氣氛，臺詞說錯了也不要緊。但短短五句的臺詞，卻讓她吃足苦頭。為了初登場的表演，聽不懂臺語的安妮先是請先生教學，再用越文逐字逐句標記發音，「他說一句，我講一句，就像鸚鵡學舌一樣。」但因為全是硬背下來的，「我還是緊張到腦袋一片空白，全都忘光了！」安妮說。\n\
    \    隨著安妮的臺語越說越好，五年前，從戲班退休的資深演員相中她的表演潛力，特地邀請安妮擔任戲裡「女媧」一角。猶豫再三的她，想到過去每次克服挑戰後表現更上一層的經歷，決定答應。安妮雖然有過表演經驗，比起別人更具舞臺魅力、柔軟身段，但歌仔戲得說口白、吟曲調，臺上表演講究舉手投足的「腳步手路」更是絲毫馬虎不得。\n\
