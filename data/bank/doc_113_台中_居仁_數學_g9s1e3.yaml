  stem: '如下圖，在矩形 $ABCD$ 中，$E$、$F$ 分別為 $\overline{CD}$ 與 $\overline{AB}$ 邊上的中點。已知矩形
    $ABCD \sim$ 矩形 $DAFE$，且 $\overline{BC}=1$，則 $\overline{BC}:\overline{AB} = \overline{AF}:\overline{DA}
    = \sqrt{2}:1$。請協助完成上述命題的證明。


    設 $\overline{AB} = x$，

    $\because$ 矩形 $ABCD \sim$ 矩形 $DAFE$

    $\therefore \overline{AB}:\overline{BC} = \overline{DA}:\overline{AF}$

    亦即____：____＝____：____，

    $\Rightarrow x^2=2$，得 $x=\pm \sqrt{2}$（負數不合），

    故 $\overline{AB}:\overline{BC} = \overline{DA}:\overline{AF} = \sqrt{2}:1$

    《課 P.179》'
