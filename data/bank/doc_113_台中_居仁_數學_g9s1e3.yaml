- id: doc_113_台中_居仁_數學_g9s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '如下圖，$\triangle ABC$ 為等腰三角形，其中 $\overline{AB} = \overline{AC}$，分別過 $B$、$C$
    兩點作兩腰上的高 $\overline{BD}$ 與 $\overline{CE}$，試證 $\overline{BD} = \overline{CE}$。以下兩種證明：

    (甲) $\because \triangle ABC$ 面積 $=\frac{1}{2} \times \overline{AC} \times \overline{BD}
    = \frac{1}{2} \times \overline{AB} \times \overline{CE}$ 又 $\overline{AB} = \overline{AC}$
    $\therefore \overline{BD} = \overline{CE}$。

    (乙) 在 $\triangle ABD$ 與 $\triangle ACE$ 中，$\because \overline{AB} = \overline{AC}$，$\angle
    A = \angle A$，$\angle ADB = \angle AEC = 90^\circ$ $\therefore \triangle ABD \cong
    \triangle ACE$ (AAS 全等性質) 故 $\overline{BD} = \overline{CE}$。

    對於甲、乙兩人的作法，下列敘述何者正確？《課 P.140》'
  options:
  - label: A
    content: 兩人皆正確
  - label: B
    content: 兩人皆錯誤
  - label: C
    content: 甲正確，乙錯誤
  - label: D
    content: 甲錯誤，乙正確。
