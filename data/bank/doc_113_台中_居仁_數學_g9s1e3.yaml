questions:
- id: doc_113_台中_居仁_數學_g9s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '請檢視下列證明，並挑出合適的答案選項。


    試證：偶數與奇數的和為奇數。

    證明：假設偶數為 $2a$，奇數為 $2a+1$，其中 $a$ 為整數。可得偶數+奇數=$2a+2a+1=4a+1$

    故為奇數 《課 P.147》'
  options:
  - label: A
    content: 上述證明過程正確。
  - label: B
    content: 上述證明過程錯誤，應該將偶數假設為 $2a$，奇數假設為 $2b+1$，且 $a \neq b$。
  - label: C
    content: 上述證明過程錯誤，$4a+1$ 不一定是奇數。
  - label: D
    content: 上述證明命題錯誤，偶數與奇數的和不一定是奇數。
  - label: E
    content: 以上皆非。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 數學
      code: 3-1
      title: 推理證明
      chapter: 第3章 推理證明與三角形的心
    textbook: 九上 3-1 推理證明
    labeled_by: ai
- id: doc_113_台中_居仁_數學_g9s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '已知銳角三角形 $ABC$ 中，$\overline{BC} > \overline{AB} > \overline{AC}$，甲、乙兩人想找一點
    $P$，使得 $\angle BPC$ 與 $\angle A$ 互補，其作法分別如下：

    (甲) 以 $A$ 為圓心，$\overline{AC}$ 長為半徑畫弧交 $\overline{AB}$ 於 $P$ 點，則 $P$ 即為所求。

    (乙) 作過 $C$ 點且與 $\overline{AB}$ 垂直的直線 $L$，作過 $B$ 點且與 $\overline{AC}$ 垂直的直線，交 $L$
    於 $P$ 點，則 $P$ 即為所求。

    對於甲、乙兩人的作法，下列敘述何者正確？'
  options:
  - label: A
    content: 兩人皆正確
  - label: B
    content: 兩人皆錯誤
  - label: C
    content: 甲正確，乙錯誤
  - label: D
    content: 甲錯誤，乙正確。
  tags:
