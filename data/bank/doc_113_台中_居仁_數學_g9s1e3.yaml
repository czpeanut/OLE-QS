- id: doc_113_台中_居仁_數學_g9s1e3_s1_5
  section: 1
  number: 5
  type: fill
  page: 1
  stem: '若數列 $a_1, a_2, a_3, \dots, a_{20}$ 為等比數列，公比為 $r$，試證：$a_2, a_5, a_8, a_{11},
    a_{14}$ 也是等比數列。《習 P.47》


    證明：因為 $a_1, a_2, a_3, \dots, a_{20}$ 為等比數列，首項為 $a_1$，公比為 $r$，因此 $a_2 = a_1 r,
    a_5 = a_1 r^4, a_8 = a_1 r^7, a_{11} = a_1 r^{10}, a_{14} = a_1 r^{13}$，

    又 $\frac{a_5}{a_2} = \frac{a_8}{a_5} = \frac{a_{11}}{a_8} = \frac{\Box}{\Box}
    = r^\Box$，

    故 $a_2, a_5, a_8, a_{11}, a_{14}$ 為等比數列。

    則上述證明中的空格應填入？'
