- id: doc_113_高雄_光華_自然_g9s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 關於表（一）的四種氣體，下列說明何者正確？
  options:
  - label: A
    content: 四種氣體有三種是有機化合物
  - label: B
    content: 四種氣體有兩種是無機化合物
  - label: C
    content: GWP 值最高的氣體是有機化合物
  - label: D
    content: GWP 值最低的氣體是無機化合物。
  group_stem: '溫室氣體能吸收地表輻射熱，使氣溫升高，排放過量會造成全球暖化。表（一）列出四種溫室氣體的全球暖化潛勢（GWP），這是指與 $\mathrm{CO_{2}}$
    相比，造成全球暖化的相對能力，例如將 $\mathrm{CO_{2}}$ 的 GWP 值設定為 1，$\mathrm{CH_{4}}$ 吸收熱為 $\mathrm{CO_{2}}$
    的 25 倍，則 $\mathrm{CH_{4}}$ 的 GWP 值即為 25，其餘以此類推。表（二）列出 2009 年和 2015 年 $\mathrm{CO_{2}}$
    排放量最多國家的前五名，以及這五個國家的人口數。


    表（一）

    | 溫室氣體 | 全球暖化潛勢 (GWP) |

    |---|---|

    | $\mathrm{CO_{2}}$ | 1 |

    | $\mathrm{CH_{4}}$ | 25 |

    | $\mathrm{N_{2}O}$ | 298 |

    | $\mathrm{SF_{6}}$ | 22800 |


    表（二）

    | 國家 | 2009 年 $\mathrm{CO_{2}}$ 排放量(億噸) | 2015 年 $\mathrm{CO_{2}}$ 排放量(億噸) | 2015
    年人口(億) |

    |---|---|---|---|

    | 中國 | 74.6 | 106.4 | 13.7 |

    | 美國 | 52.7 | 51.7 | 3.2 |

    | 印度 | 18.9 | 24.5 | 12.8 |

    | 俄羅斯 | 16.0 | 17.6 | 1.4 |

    | 日本 | 10.7 | 12.5 | 1.3 |'
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 地科
      code: 4-2
      title: 溫室效應與全球暖化
      chapter: 第4章 永續的地球
