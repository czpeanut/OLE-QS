  stem: 在 1851 年，英國物理學家麥可·法拉第(Michael Faraday)提出磁力線的概念。關於磁力線的敘述，下列何者錯誤？
  options:
  - label: A
    content: 磁力線是封閉的平滑曲線，任何兩磁力線絕不相交
  - label: B
    content: 磁力線在磁鐵內部的方向是從 S 極指向 N 極
  - label: C
    content: 磁力線的疏密程度代表磁場強度的強弱；磁力線愈密，磁場強度愈強
  - label: D
    content: 磁力線上任一點的切線方向是電荷在該點所受磁力的方向。
