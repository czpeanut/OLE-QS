  section: 1
  number: 33
  type: single
  page: 5
  stem: 有關人造雨的敘述下列何者錯誤？
  options:
  - label: A
    content: 緯度愈高的高空愈容易形成冷雲
  - label: B
    content: 冷雲中進行人造雨常在雲中噴灑水滴或食鹽
  - label: C
    content: 乾冰可以降低周圍環境的溫度
  - label: D
    content: 集水區上空雲量增多時適合人造雨。
  group_stem: 臺灣的雨量不均，容易引起乾旱，因此常在缺水時進行人造雨。人造雨是讓不會下雨的雲，增加雲量達成下雨的目的。要讓雲長大需要降低溫度和增加幫助水氣附著的固態微粒當作凝結核才行。雲分為「暖雲」和「冷雲」，人造雨的方式也有所差別。地面蒸發的水氣在高空凝結成雲後，若雲的溫度高於
    0 ℃，稱為暖雲。暖雲凝結的水滴太小，不會落到地面，所以需在雲層中噴灑水滴或食鹽，讓小水滴透過碰撞、合併的過程而成長，最終克服浮力而落下成為降雨。低於 0
    ℃ 的雲稱為冷雲，冷雲是由冰晶與未結冰的水滴組成，常利用地面造雨器燃燒碘化銀或飛機在雲中噴灑乾冰和碘化銀。乾冰可以降低雲的溫度，碘化銀可以作為凝結核，以達到增加雲量最後下雨的目的。試回答問題
    33.-34.：
