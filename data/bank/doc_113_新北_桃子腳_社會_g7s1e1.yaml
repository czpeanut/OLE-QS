  stem: '請閱讀以下原住民族資料，回答問題：

    【資料一】

    一位原住民耆老驕傲說著自己族裡的傳說：「早期族民為躲避洪水時逃難到玉山附近，而洪水發生的原因則是一條巨蛇堵住出水口導致溪水往陸地漲，最終動物與人都逃至最高的山
    Usaviah(玉山)。因山頂處無火且寒冷，剛好對面高山有火種，故先後派了 Kulpa 蟾蜍、Haipis 紅嘴黑鵯鳥等動物至對岸高山取火種，最終由 Haipis
    鳥成功取回火種，然也因而該鳥的嘴巴及雙腳因燒燙而變紅了。為表感謝，族人從此不獵取此鳥。」


    【資料二】

    一位原住民耆老，他說著：「先人早期來自南投縣仁愛鄉，往北循著中央山脈河川流域往下游建置家園，來到蘭陽溪流域的部落，族人稱此地為 Mnibu（大同鄉），而宜蘭縣大同鄉(Mnibu)最早形成的部落是南山部落(Piyanan)，其始祖為
    Kmomaw。Kmomaw 由此地發跡，數百年來，其後代陸續在蘭陽溪下游建置部落發展開來。」

    依據上述耆老說的事蹟，所代表的意義，下列何者是最適當的解釋方式？'
  options:
  - label: A
    content: 具有認識動物界演化發展的意義
  - label: B
    content: 這與泰雅族故事相符，口耳相傳可視為歷史資料
  - label: C
    content: 資料一與資料二都可解釋人類誕生的可能性
  - label: D
    content: 資料一與資料二都可作為原住民遷徙的參考資料。
  answer:
  - D
  answer_source: answer_key_vlm
