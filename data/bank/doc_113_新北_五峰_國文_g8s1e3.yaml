- id: doc_113_新北_五峰_國文_g8s1e3_s2_38
  section: 2
  number: 38
  type: single
  page: 4
  stem: 由本文可知，小燈教堂裡壁畫內容的人物姿態為何？
  options:
  - label: A
    content: 耶穌往前走，小男孩在後
  - label: B
    content: 小男孩往前走，耶穌在後
  - label: C
    content: 耶穌與小男孩彼此面對面
  - label: D
    content: 耶穌與小男孩彼此背對背。
  group_stem: "前些日子，我去了敘利亞南部，那裡有一個小村落，村落裡有一座小教堂。\n  教堂非常小，石頭砌起來的，在一個偏遠的山谷裡。這座教堂有一個很好聽的名字，叫做「小燈教堂」。兩千年來，這座教堂晚上必定點一盞燈。為什麼要整夜點一盞小燈，神父不知道，他說這是世世代代傳下來的傳統。\n\
    \  我在教堂裡四處張望，發現了一幅壁畫。這幅壁畫中，耶穌背著十字架往前走，有一個小男孩淚流滿面地拉著耶穌的衣服，他們好像在對話。畫下面有兩行字，神父替我翻譯，原來這兩行字是小男孩和耶穌的對話。\n\
    \  小男孩說：「耶穌不要走，你走了以後，誰會照顧我們窮小孩子？」耶穌說：「太陽下山的時候，回頭看！」\n  我問神父，這是什麼意思？他也不懂，但是他相信這一定是有意義的，所以這幅壁畫就永遠地被保存了下來。過幾年，他們總要修補一下。\n\
    \  我走出教堂，仍然想著這句話的意義。想來想去，想不通。天色已經昏暗，太陽快下山了。教堂建在一座小山上，山的一邊面對著海，一邊是一個很美，但很荒涼的山谷。我有了一種衝動，要到山頂上去看日落，因為山不高，我一下子就走到了，也看到了太陽在海平面上慢慢消失的景象。當時我忽然有點兒害怕，因為我發現我是在一個非常荒涼的地方，天黑了，我會不會完全迷路呢？\n\
    \  我想起了耶穌的話—「太陽下山的時候，回頭看！」我回過頭去，發現山谷中雖然沒有很多人家，但是家家戶戶都點起了燈，那所小燈教堂的燈也亮了。\n  我不害怕了。雖然太陽已經下山，但有那些人點燈，我就安全了。太陽將光和熱帶給了世界，但是太陽下山以後，仍然有一些小燈，用它們微弱的力量，帶給世界光和熱。\n\
    \  我終於懂了，耶穌在安慰這個窮小孩子，他可以放心，世界上一定會有一些善良的人，繼續做耶穌在世時所做的事：使這個世界有一些光，有一些熱。那位壁畫中的小男孩一定也有同樣的頓悟。他也一定四處勸告朋友，大家都要像一盞燈，無論燈光如何微弱，很多人都會靠這一盞小燈生活的。也許，這一座小燈教堂就是他造的。\n\
    \  我離開了敘利亞，我永遠不會忘記小燈教堂。我們都應該扮演小燈的角色，至少要使我們周遭的人不再害怕黑暗，不再感到寒冷。\n               \
    \    （李家同 太陽下山，回頭看）"
