  - label: D
    content: 秉持苦民所苦的精神。
  group_stem: "季文子相宣、成，無衣帛之妾，無食粟之馬。\n    仲孫它諫曰：「子為魯上卿，相二君矣，妾不衣帛，馬不食粟，人其以子為愛，且不華國乎！」文子曰：「吾亦願之。然吾觀國人，其父兄之食粗而衣惡者猶多矣，吾是以不敢。人之父兄食粗衣惡，而我美妾與馬，無乃非相人者乎？且吾聞以德榮為國華，不聞以妾與馬。」\n\
    \    文子以告孟獻子，獻子囚之七日。自是仲孫它之妾衣不過七升之布，馬餼不過稂莠。文子聞之，曰：「過而能改者，民之上也。」使為上大夫。\n（ 國語．魯語）\n\
    註：①愛：吝惜。\n    ②馬餼：馬糧。餼，音ㄒㄧˋ。\n    ③稂莠：音ㄌㄤˊ ㄧㄡˇ，雜草。"
