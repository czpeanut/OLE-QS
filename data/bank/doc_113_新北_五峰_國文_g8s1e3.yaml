  stem: 根據季文子自己的陳述，「相宣、成，無衣帛之妾，無食粟之馬」的主要原因，應是下列何者？
  options:
  - label: A
    content: 不想過度寵溺妾與馬
  - label: B
    content: 心性淡泊且不喜奢華
  - label: C
