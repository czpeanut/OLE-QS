  group_stem: "●請閱讀短文並回答問題。\n  奧賽利斯是冥界之神，與太陽神都是古埃及最重要的神明之一。在埃及神話中，奧賽利斯原是古埃及的賢君，但他的弟弟因為嫉妒而想要奪取王位。於是，他的弟弟用計殺害了奧賽利斯，又將他的屍體切成多塊，拋入尼羅河中。奧賽利斯的妻子克服各種困難，尋回奧賽利斯各部位的軀體，並製成木乃伊，讓他得以復活。眾神最後讓奧賽利斯在冥界，成為陰間之神，負責審判死者靈魂的工作。"
