  stem: 歷史課同學在玩古文明特色配對的遊戲，下列關於文化遺產、民族、活動地區的配對，哪些是正確的？(甲)祆教→波斯人—伊朗高原 (乙)《漢摩拉比法典》→巴比倫人—伊朗高原(丙)猶太教→希伯來人—地中海東岸(丁)六十進位法→蘇美人—兩河流域(戊)荷馬史詩→希臘→義大利半島
