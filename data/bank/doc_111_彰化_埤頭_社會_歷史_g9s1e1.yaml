  stem: 在某些印度較為傳統的地區，至今仍然性侵案頻傳，屢屢躍上國際新聞版面，當地學者認為，重男輕女與種姓制度是這股亂象的元凶，在錯誤觀念尚未被導正前，即使提高刑責也無法改變現狀。有關新聞中提及的「種姓制度」，具有下列哪一特色？
  options:
  - label: A
    content: 創造出平等和諧的社會，讓各階層的人能夠各司其職
  - label: B
    content: 與婆羅門教有密切關係，共同維護阿利安人的統治地位
  - label: C
    content: 分為貴族、平民、奴隸三階級，彼此之間不能通婚
  - label: D
    content: 平民可以藉由才能與努力成為貴族。
