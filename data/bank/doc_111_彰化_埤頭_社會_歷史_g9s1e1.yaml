  stem: '小銘在圖書館中查閱古代各著名法典，看到其中一個法典的內容如下，請由此法典的內容判斷，下列何者敘述正確？(甲)法典的原文應是由象形文字寫成 (乙)強調「以牙還牙」的報復原則(丙)為波斯國王漢摩拉比下令編訂(丁)
    由條文可見當時有階級概念

    196 條：如果一個人傷了貴族的眼睛，還傷其眼。

    197 條：如果一個人折了貴族的手足，還折其手足。

    203 條：如果貴族階層的人打了貴族出身的人，須罰銀一明納。

    205 條：如果任何人的奴隸打了自由民出身的人，處割耳之刑。'
