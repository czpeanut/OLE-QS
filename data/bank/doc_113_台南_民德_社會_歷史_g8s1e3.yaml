  type: single
  page: 2
  stem: 1910 年，四川巡警道的勸諭婦女放足白話告示中提到：「從前未禁纏足，以天足為醜。現在人人都是天足，各個都以纏足為醜，爾等再不放足，真是不知自醜。」下列何者是此種風氣形成後可能帶來的改變？
