  stem: 以下為研究某一主題的專家在研討會發表的文章：＜馬雅各將新式醫療引進台灣的貢獻＞、＜美國傳教士林樂知與萬國公報＞、＜利瑪竇在中國＞。請問從上述三篇論文可知這場研討會的主題為何？
  options:
