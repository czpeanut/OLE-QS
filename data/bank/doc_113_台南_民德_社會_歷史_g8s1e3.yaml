  group_stem: ※清末某知識分子在其著作論述：「故治天下之大本二，曰正人心，廣人才。而二者之本，必自蒙養(教育兒童)始；蒙養之本，必自母教始；母教之本，必自婦學始。故婦學實天下存亡強弱之大原也。……女學最盛者其國最強，不戰而屈人之兵，美是也；女學次盛者，其國次強，英、法、德、日本是也；女學衰，母教失，無業眾，民智少，國之所存者幸矣(國家得以生存出於僥倖)，印度、波斯、土耳其是也。……吾推極天下積弱之本，則必自婦人不學始。」請問：
