- id: doc_113_台南_民德_社會_歷史_g8s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: '《點石齋畫報》是清末創刊的畫報，以圖片為主、文章為輔的方式介紹西方新知。其中，＜賀婚西例＞介紹根據西方習俗，富有官宦人家慶賀新婚會給予的禮物。結婚後亦有依婚齡送禮，婚姻越長，則禮越貴重。

    請問：這篇畫報出現的背景應與下例何者有關？'
  options:
  - label: A
    content: 耶穌會傳教士東來，引進西式婚姻的形式。
  - label: B
    content: 開港通商後，畫報對於新思潮傳播的影響力。
  - label: C
    content: 八國聯軍後，政府推廣西式文化的成果。
  - label: D
    content: 「父母之命，媒妁之言」的傳統婚姻觀呈現。
