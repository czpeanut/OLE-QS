  section: 1
  number: 16
  type: single
  page: 2
  stem: '王夙是清末民初的知識分子，在宣統三年前，他曾大聲疾呼說：「我支持政府推行的君主立憲運動」，但在宣統三年時，他卻義憤填膺說：「我對立憲派太失望了，若要救國，非革命不可。」

