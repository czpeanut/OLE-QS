- id: doc_113_台南_民德_社會_歷史_g8s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 周瑩是光緒年間內陸省份-陝西省涇陽縣的女富商，前往上海尋找商機。當她抵達上海時，對上海的一切皆感到驚訝。請問下列哪一景象周瑩不會在上海看到？
  options:
  - label: A
    content: 周瑩接受友人接待，前往餐廳食用異國餐點。
