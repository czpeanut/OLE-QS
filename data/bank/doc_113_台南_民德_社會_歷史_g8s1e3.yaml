  section: 1
  number: 10
  type: single
  page: 1
  stem: 以下為清末的某份聲明：「此事件後，我們聽到政府與某國談判求和，不但讓朝鮮獨立，還開放更多口岸，任由外國在中國通商口岸設置工廠。我們要求政府立即變法圖強，持續抵抗。」關於這份聲明，下列敘述何者正確？
