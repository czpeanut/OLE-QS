  section: 1
  number: 11
  type: single
  page: 2
  stem: 一道平凡的菜餚,經過名人加持,亦能晉身為名菜之列。「道口燒雞」原是河南省道口的地方菜,適逢光緒二十六年發生的一場國際戰事,慈禧與光緒被迫逃離北京,途中經過道口,當地百姓拿出家常菜-燒雞,慈禧喜愛不已,並訂為貢品。請問:這場戰事對於中國造成的影響為何？
  options:
  - label: A
    content: 外國人的勢力從沿海進入中國內地。
  - label: B
    content: 中國喪失關稅自主權。
  - label: C
    content: 列強競相在中國劃定勢力範圍。
  - label: D
    content: 刺激中國展開庚子後新政。
