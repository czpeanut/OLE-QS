- id: doc_113_新北_五峰_社會_g8s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '新南向政策是近年來臺灣政府推動的外交與經濟策略之一，台商依產業投資的需求條件，評估各地的投資環境，選擇最佳利潤的國家。請問：哪些台商可能會獲得最大利潤？

    | 台商 | 產業類型 | 產業需求條件 | 選擇國家 |

    | :--- | :--- | :--- | :--- |

    | 甲 | 汽機車及零組件 | 1.內需市場需求度高，人均所得中等以上<br>2.基礎設備完善度中等以上<br>3.投資金額大，盡量避免天災損失與政治穩定度波動大
    | 菲律賓 |

    | 乙 | 清真食品加工廠 | 1.伊斯蘭教信仰為主<br>2.低廉工資<br>3.勞動人口比例超過60% | 印尼 |

    | 丙 | 晶圓生產 | 1.技術勞工<br>2.產業升級有大量資金需求<br>3.基礎設施完善度高<br>4.投資金額大，盡量避免天災損失與政治穩定度波動大
    | 新加坡 |

    | 丁 | 委外客服 | 1.低廉工資<br>2.勞動人口比例超過60%<br>3.英語系國家 | 柬埔寨 |

    | 戊 | 製鞋業 | 1.低廉勞工<br>2.勞動人口比例超過60%<br>3.經濟成長率維持在5%以上<br>4.政治穩定度中等以上 | 越南 |'
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲丙丁
  - label: C
    content: 乙丙戊
  - label: D
