  group_stem: "丙、\n孔明分撥已定，先引五千兵去西城縣搬運糧草。忽然十餘次飛馬報到，說司馬懿引大軍十五萬，望西城蜂擁而來。時孔明身邊並無大將，止有一班文官，所引五千軍，已分一半先運糧草去了，只剩二千五百軍在城中。眾官聽得這消息，盡皆失色。\n\
