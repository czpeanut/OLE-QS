  group_stem: '乙、（素養題）

    (一)

    唐 溫璋為京兆尹，勇於殺戮，京邑憚之。一日，聞挽鈴聲，俾看架下，不見有人。凡三度挽掣，乃見鴉一隻。君曰：「是必有人探其雛而訴冤也。」命吏隨鴉所在捕之。其鴉盤旋，引吏至城外樹間，果有人探其雛，尚憩樹下。吏乃執之送府。以禽鳥訴冤，事異於常，乃斃捕雛者而報之。

    孫光憲《北夢瑣言 卷十•為鴉申冤》

    (二)

    動物受虐就像人類遭到家暴一樣，需要到醫院驗傷證明受害程度，找出受傷原因。如果受虐動物不幸死亡了，也需要像將非正常死亡的人類送到法醫機構驗屍一樣，透過專業的動物法醫來確認死因，因此，動物法醫之於動物虐待案件，確實有其必要性。

    無論是處理人類的非正常死亡案件或動物虐待致死案件，遺體解剖都是其中非常重要的搜證環節，透過遺體解剖，可以從其身上的跡證還原受害經過，輔助法官判斷兇手的罪行是否成立。專家認為每個動物受虐致死案件都應解剖，才能強化「物證」、「受害者」、「凶手」及「現場」四項犯罪偵查要素的連結，確立犯罪事實，如此一來，即使行為人證詞反覆，也不用擔心被混淆事實。

    然而，法醫隸屬法務部，有《法醫師法》作為其權利與義務的依據，但動物法醫目前仍無相關法令依據，採證、分析的過程也缺乏可依循的標準流程。現況是動物法醫提出的證據公信力容易受質疑，法庭上也未必能被採用。

    此外，在法律認定上，當動物重傷或死亡時，動保案件就涉及刑事責任，這時才由警察介入調查。不過實務上，只要動檢員合理懷疑虐待案件涉及刑案，就可以找警方協助。但並不是每一次動檢員都和警察合作無間，如曾有受虐貓咪被困在房內，最後破門將貓救出的並非動檢員，也不是警察，而是民間愛貓人士。此案發生時雖有通報警察及動保處，但現場只有不得其門而入的警察，未見動保處相關人員。警方於現場聯繫動保處，得到的回應是動保處沒有權利破門，也不會到現場來。由於動保處和警察彼此是平行單位，因此動保處並不像檢察官可以指揮警察辦案。由於《動保法》同時涉及行政處分與刑罰，需要動保和司法兩種專業。因此學者認為設立動保警察是提高動保與警察合作效率的最佳方案。但是設立動保警察奉涉許多複雜問題，無論設置在農政或者是警政單位之下，都會涉及人力增補、經費增加，還有職權的調整等問題，其所耗費的人力、物力、財力都非常可觀，在政府預算有限的狀況下較雞以實現。此外，專業人才的養成也需要時間和教育成本，農政與司法分屬不同專業領域，養成系統也不同，實在難以要求農政體系出身的動檢員同時具備刑事調查技能，反過來要求司法人同時具備動保專業，也同樣強人所難。

    洪郁婷〈設立動物法醫及動保警察 為沉默的動物伸張正義〉

    （改寫自「窩窩wuowuo」網站2022.12.27）'
