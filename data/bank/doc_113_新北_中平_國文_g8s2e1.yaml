    \ 眾皆驚服，曰：「丞相玄機，神鬼莫測。若某等之見，必棄城而走矣。」孔明曰：「吾兵止有二千五百，若棄城而走，必不能遠遁。得不為司馬懿所擒乎？」言訖，拍手大笑，曰：「吾若為司馬懿，必不便退也。」\
    \ 羅貫中〈空城計〉"
