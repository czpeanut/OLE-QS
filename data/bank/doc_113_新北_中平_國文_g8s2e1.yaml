- id: doc_113_新北_中平_國文_g8s2e1_s5_8
  section: 5
  number: 8
  type: single
  page: 5
  stem: 請問以下何者並非空城計中，孔明為了欺敵的刻意安排？
  options:
  - label: A
    content: 先引五千兵去西城縣搬運糧草
  - label: B
    content: 孔明憑欄而坐，焚香操琴
  - label: C
    content: 軍士扮作百姓，灑掃街道
  - label: D
    content: 眾將旌旗，盡皆藏匿。
  group_stem: "丙、\n孔明分撥已定，先引五千兵去西城縣搬運糧草。忽然十餘次飛馬報到，說司馬懿引大軍十五萬，望西城蜂擁而來。時孔明身邊並無大將，止有一班文官，所引五千軍，已分一半先運糧草去了，只剩二千五百軍在城中。眾官聽得這消息，盡皆失色。\n\
    孔明登城望之，果然塵土沖天，魏兵分兩路望西城縣殺來。孔明傳令：「眾將旌旗，盡皆藏匿。諸軍各守城鋪，如有妄行出入及高聲言語者，立斬。大開四門，每一門上用二十軍士扮作百姓，灑掃街道，如魏兵到時，不可擅動，吾自有計。」孔明乃披鶴氅，戴綸巾，引二小童，攜琴一張，於城上敵樓前，憑欄而坐，焚香操琴。\n\
    \ 卻說司馬懿前軍哨到城下，見了如此模樣，皆不敢進，急報與司馬懿。懿笑而不信，遂止住三軍，自飛馬遠遠望之，果見孔明坐於城樓之上，笑容可掬，焚香操琴。左有一童子，手捧寶劍；右有一童子，手執麈尾。城門內外有二十餘百姓，低頭灑掃，旁若無人。\n\
    懿看畢，大疑，便到中軍，教後軍作前軍，前軍作後軍，望北山路而退。次子司馬昭曰：「莫非諸葛亮無軍，故作此態，父親何故便退兵？」懿曰：「亮平生謹慎，不曾弄險。今大開城門，必有埋伏。我軍若進，中其計也。汝輩焉知？宜速退。」於是兩路兵盡皆退去。\n\
    \ 孔明見魏軍遠去，撫掌而笑。眾官無不駭然，乃問孔明曰：「司馬懿乃魏之名將，今統十五萬精兵到此，見了丞相，便速退去，何也？」孔明曰：「此人料吾平生謹慎，必不弄險，見如此模樣，疑有伏兵，所以退去。吾非行險，蓋因不得已而用之。此人必引軍投山北小路去也。吾已令興、苞二人在彼等候。」\
    \ 眾皆驚服，曰：「丞相玄機，神鬼莫測。若某等之見，必棄城而走矣。」孔明曰：「吾兵止有二千五百，若棄城而走，必不能遠遁。得不為司馬懿所擒乎？」言訖，拍手大笑，曰：「吾若為司馬懿，必不便退也。」\
    \ 羅貫中〈空城計〉"
