    \ 卻說司馬懿前軍哨到城下，見了如此模樣，皆不敢進，急報與司馬懿。懿笑而不信，遂止住三軍，自飛馬遠遠望之，果見孔明坐於城樓之上，笑容可掬，焚香操琴。左有一童子，手捧寶劍；右有一童子，手執麈尾。城門內外有二十餘百姓，低頭灑掃，旁若無人。\n\
