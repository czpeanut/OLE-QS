  group_stem: "丁、\n 皚如山上雪，皎若雲間月。聞君有兩意，故來相決絕。今日斗酒會，明旦溝水頭。躞蹀(1)御溝(2)上，溝水東西流。\n 淒淒復淒淒，嫁娶不須啼。願得一心人，白頭不相離。竹竿何嫋嫋(3)，魚尾何簁簁(4)。男兒重意氣，何用錢刀(5)為。\n\
    〈白頭吟〉\n註：\n(1)躞蹀，音ㄒㄧㄝˋ ㄉ一ㄝˊ，小步慢行的樣子。\n(2)御溝，流經御苑或環繞宮牆的渠水。\n(3)嫋嫋，音ㄋㄧㄠˇ ㄋ一ㄠˇ，形容釣竿柔長而有節奏地擺動的樣子。\n\
