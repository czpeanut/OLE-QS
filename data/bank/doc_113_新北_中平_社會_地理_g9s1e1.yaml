  section: 1
  number: 46
  type: single
  page: 2
  stem: 請問：如要探訪奧林匹克運動會的發源地應前往下列何處？
  options:
  - label: A
    content: 伊比利半島
  - label: B
    content: 義大利半島
  - label: C
    content: 巴爾幹半島
  - label: D
    content: 斯堪地那維亞半島
  group_stem: "題組：請回答第46-50 題 [ 素養試題 ]\n第三十三屆奧林匹克運動會相關報導\n奧林匹克運動會通常在夏季及冬季舉辦，簡稱「夏奧」及「冬奧」。夏季奧運會規模較大，通常直接稱為「奧運會」。夏奧和冬奧以「相隔兩年」的方式交替舉行，今年夏奧已結束，2026\
    \ 年冬奧預計在義大利米蘭舉行，至於下一屆奧運會將在2028 年美國洛杉磯舉辦。\n 奧林匹克的標誌是由五個奧林匹克環組成，五環自左至右互相套接，顏色分為藍、黃、黑、綠及紅，五環的寓意是象徵五大洲友好團結，全世界的運動員在奧林匹克運動會上相聚一堂。\n\
    \ 第三陸屆夏季奧林匹克運動會於2024 年7 月26 號舉辦國當地時間晚上7 點30 分盛大開幕（當地為UTC+2，屬東2 時區）。 本屆奧運是有史以來第一次開幕式不在運動主場館舉辦，是由100\
    \ 多艘船載著近萬名選手進場，沿著河道穿越市中心，接受河岸邊數十萬名群眾歡呼。\n 本屆奧運將承襲東京奧運「環保減碳」的理念，達到比2012 年倫敦奧運減少55%的碳足跡為目標，因此決定打破傳統不蓋新場館，而是使用城市現有的體育場館，且在城市各地標旁搭建臨時場地，包括艾菲爾鐵塔前、戰神廣場、凡爾賽宮等地。\n\
    \ 此次奧運95%的競賽場地是既有的，選手村也是綠建築，100%使用再生能源，產生零廢棄物，未來可以轉型成為住宅與公共活動區域，預計可成為家庭、學生宿舍和銀髮老人的住宅使用。"
