    TEENAGERS AND THE WORKFORCE

    What Do U.S. Teens Want To Be When They Grow Up?

    by Florian Zandt, Oct 11, 2023


    What do you want to be when you grow up? This is a question that people often
    ask children and teenagers. In the past, the answers were different, but now,
    social media has changed things. Many people dream of becoming famous, and it''s
    not just about being in movies or on stage anymore.


    A 2021 survey in the U.S. asked teenage boys and girls about their dream jobs.
    12% of boys said they want to be a professional athlete, and 11% said they want
    to be an online content creator (like a YouTuber). Some boys still dream of being
    a musician (6%) or a doctor or nurse (5%).


    For teenage girls, 13% want to become doctors or nurses, and 11% dream of being
    an actress.


    Both boys and girls are now interested in becoming YouTubers, streamers, or vloggers.
    This shows how online personalities have become important. The market for influencers
    has grown a lot, reaching $16.4 billion worldwide in 2022.


