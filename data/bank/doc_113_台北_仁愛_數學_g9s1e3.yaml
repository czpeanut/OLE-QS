- id: doc_113_台北_仁愛_數學_g9s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: '秋瑾跟懷生同做一題證明題，題目及兩人證明過程如下，請問誰的證明過程是正確無誤的？。

    「如右圖，$ABDC$ 與$BDFG$ 是兩個全等的平行四邊形，以$\overline{CD}$及$\overline{DF}$ 為兩邊再作一個平行四邊形$CDFE$，連接$\overline{BF}$、$\overline{EG}$，試證：$\triangle
    BDF\cong\triangle EFG$。」

    秋瑾：

    $\angle BDF=360\div 3=120^\circ$

    $\angle CDF=360\div 3=120^\circ$

    $\angle EFG=\angle DFE+\angle DFG$

    $=(180-120)+(180-120)=120^\circ$

    $\therefore \angle BDF=\angle EFG$

    又$\overline{BD}=\overline{FG}$

    $\overline{CD}=\overline{DF}=\overline{EF}$

    故$\triangle BDF\cong\triangle EFG(\text{SAS})$

    懷生：

    $\overline{BD}=\overline{DF}=\overline{EF}=\overline{FG}$

    延長$\overline{DF}$ 與$\overline{AB}$ 交$P$ 點

    $\angle GFD=\angle BDP$、$\angle EFD=\angle CDP$

    $\angle EFG=\angle EFD+\angle GFD$

    $=\angle CDP+\angle BDP=\angle CDB$

    又$ABDC\cong BDFG$

    $\therefore \angle EFG=\angle CDB=\angle BDF$

    故$\triangle BDF\cong\triangle EFG(\text{SAS})$'
  options:
  - label: A
    content: 只有秋瑾正確
  - label: B
    content: 只有懷生正確
  - label: C
    content: 兩人皆正確
  - label: D
    content: 兩人皆錯誤
