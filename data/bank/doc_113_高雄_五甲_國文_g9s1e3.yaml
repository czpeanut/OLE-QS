  page: 3
  stem: 根據上文所述，房中出聲音，究竟是何物？
  options:
  - label: A
    content: 犬
  - label: B
    content: 宗達
  - label: C
    content: 韓氏嫗婦
  - label: D
    content: 受生之物。
  group_stem: "(二) 江浙之俗信巫鬼，相傳人死則其魄復還，以其日測之，某日當至，則盡室出避于外，名為避放。命壯僕或僧守其廬，布灰于地，明日，視其跡，云受生為人為異物矣。\n\
    \    鄱陽民韓氏嫗死，倩族人永寧寺僧宗達宿焉。達瞑目誦經，中夕，聞榲房中有聲嗚嗚然，久之漸厲，若在籪盎間，蹴蹋四壁，略不少止，達心亦懼，但益誦首楞嚴咒，至數十遍。天將曉，韓氏子亦來，猶聞物觸戶聲不已，達告之故，偕執杖而入。見一物四尺，首戴一甕，直來觸人。達擊之，甕即破，乃一犬呦然而出。蓋初閉門時，犬先在房中央，甕有糠，伸首舐之，不能出，故戴而號呼耳。\n\
    【註】：①以其日測之：以人去世的日子推測。②受生為人為異物：出生當人或當其他生物。③倩：請。④盎：音ㄤˋ，腹大而斂口的用器。⑤蹴蹋：音ㄘㄨˋ ㄊㄚˋ，踢、踏。⑥楞嚴咒：佛經的一種。⑦呦：音ㄧㄡ，叫聲。\n\
    《夷堅志·韓氏放鬼》"
