  group_stem: "(三) 蠹魚 吳沃堯\n    蠹魚蝕書滿腹，龐然自大，以為我天下飽學之士也。遂昂頭天外，有不可一世之想。\n    出外遊行，遇蜣螂，蜣螂欺之；遇蠅虎，蠅虎侮之。\n\
    \    蠹魚忿急，問人曰：「我滿腹詩書，自命為天下通儒，何侮我者之多也？」\n    人笑之曰：「子雖自命為滿腹詩書，奈皆食而不化者，雖多何用？」\n【註】：①蠹魚：音ㄉㄨˋ，蛀食衣、書的小蟲。②蝕：侵蝕，此隱喻「食」。③蜣螂：昆蟲名，俗稱運屎蟲、屎殼蟲。④蠅虎：形似蜘蛛，以蠅類為食的昆蟲。⑤通儒：學問淵博，貫通古今的人。"
