- id: doc_113_高雄_五甲_國文_g9s1e3_s3_1
  section: 3
  number: 1
  type: single
  page: 1
  stem: 「臺灣原住民的布只有形制屬傳統或較現代的分別，像圓領的剪裁、鈕扣和棉布的使用等，都是受漢人的影響而來。泰雅族的貝珠鈴衣，是貝珠串底下加銅鈴裝飾，銅鈴也是和漢人交易而來。日治時代的原住民服裝，還出現以漢人棉布做底、日本布做袖口、原住民圖案做主要裝飾的混搭法。」這段文字的主旨最可能是下列何者？【會考考古題】
  options:
  - label: A
    content: 不同文化的碰撞，可融合並產生新的火花
  - label: B
    content: 外來文化的入侵，讓在地的傳統文化日漸消失
  - label: C
    content: 臺灣原住民的文化，影響了漢人與日本人的穿著
  - label: D
    content: 觀察不同族群的服飾，就能了解不同文化的差異。
