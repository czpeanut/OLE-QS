- id: doc_113_高雄_五甲_國文_g9s1e3_s3_15
  section: 3
  number: 15
  type: single
  page: 2
  stem: 「人生就是這樣，年少時，怨恨自己年少，年邁時，怨恨自己年邁，這倒常常促使中青年處於一種相對冷靜的疏離狀態和評判狀態，思考著老人生怪異，然後一邊慰撫年幼者，一邊慰撫年老者。我想，中青年在人生意義上的魅力，就在於這雙向疏離和雙向慰撫吧。因雙向疏離，他們變得灑脫和沉靜；因雙向慰撫，他們變得親切和有力。但是，也正因為此，他們有時又會感到煩心和惆悵，他們還餘留著告別天真歲月的傷感，又遲早會產生暮歲將至的預感。他們置身於人生渦漩的中心點，環視四周，思前想後，不能不感慨萬千。」(余秋雨文化苦旅)根據這文字，下列對於「中青年」的敘述何者正確？
  options:
  - label: A
    content: 喜歡怨恨自己年少又埋怨自己年邁
  - label: B
    content: 總是一邊慰撫年幼要又一邊慰撫年老者
  - label: C
