- id: doc_113_高雄_五甲_國文_g9s1e3_s4_9
  section: 4
  number: 9
  type: single
  page: 4
  stem: 作者說「我沒有再哭，只感到一陣寒冷的悲哀。」原因是？
  options:
  - label: A
    content: 後母的冷嘲熱諷、毫不關心
  - label: B
    content: 自己的孤立無援、束手無策
  - label: C
    content: 弟弟的息事寧人、逃避現實
  - label: D
    content: 弟弟的冷漠無感、喪失自尊。
  group_stem: "(五) 我弟弟生得很美而我一點也不。從小我們家裡誰都惋惜著，因為那樣的小嘴、大眼睛與長睫毛，生在男孩子的臉上，簡直是白糟蹋了。長輩就愛問他：「你把眼睫毛借給我好不好？明天就還你。」然而他總是一口回絕了。有一次，大家說起某人的太太真漂亮，他問道：「有我好看嗎？」大家常常取笑他的虛榮心。\n\
    \    他妒忌我畫的圖，趁沒人的時候拿來撕了或是塗上兩道黑槓子。我能夠想像他心理上感受的壓迫。我比他大一歲，比他會說話，比他身體好，我能吃的他不能吃，我能做的他不能做。\n\
    \    一同玩的時候，總是我出主意。我們是金家莊上能征慣戰的兩員驍將，我叫月紅，他叫杏紅，我使一口寶劍，他使兩只銅錘，還有許許多多虛擬的伙伴。開幕的時候永遠是黃昏，金大媽在公眾的廚房裡咚咚切菜，大家飽餐戰飯，趁著月色翻過山頭去攻打蠻人。路上偶爾殺兩頭老虎，劫得老虎蛋，那是巴斗大的錦毛毯，剖開來像白煮雞蛋，可是蛋黃是圓的。我弟弟常常不聽我的調派，因而爭吵起來。他是「既不能令，又不受令」的，然而他實在是秀美可愛，有時候我也讓他編個故事：一個旅行的人為老虎追趕著，趕著，趕著，潑風似的跑，後頭嗚嗚趕著……沒等他說完，我已經笑倒了，在他腮上吻一下，把他當個小玩意。\n\
    \    有了後母之後，我住讀的時候多，難得回家，也不知道我弟弟過的是何等樣的生活。有一次放假，看見他，吃了一驚。他變得高而瘦，穿一件不甚乾淨的藍布罩衫，租了許多連環圖畫來看。我自己那時候正在讀穆時英的南北極與巴金的滅亡，認為他的口味大有糾正的必要，然而他只晃一晃就不見了。大家紛紛告訴我他的劣跡，逃學，忤逆，沒志氣。我比誰都氣憤，附和著眾人，如此激烈地詆毀他，他們反而倒過來勸我了。\n\
    \    後來，在飯桌上，為了一點小事，我又親打了他一個嘴巴子。我大大地一震，把飯碗擋住了臉，眼淚往下直淌。我後母笑了起來道：「咦，你哭什麼？又不是說你！你瞧，他沒哭，你倒哭了！」我丟下了碗衝到隔壁的浴室裡去，門上了門，無聲地抽泣著，我立在鏡子前面，看我自己的掣動的臉，看著眼淚滔涵流下來，像電影裡的特寫。我咬著牙說：「我要報仇。有一天我要報仇。」\n\
    \    浴室的玻璃窗臨著陽台，啪的一聲，一只皮球蹦到玻璃上，又彈回去了。我弟弟在陽台上踢球。他已經忘了那回事了。這一類的事，他是慣了的。我沒有再哭，只感到一陣寒冷的悲哀。\
    \ 張愛玲《流言·童言無忌—弟弟》"
