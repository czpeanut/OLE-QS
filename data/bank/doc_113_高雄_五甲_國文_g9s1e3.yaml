- id: doc_113_高雄_五甲_國文_g9s1e3_s4_7
  section: 4
  number: 7
  type: single
  page: 4
  stem: 根據本文敘述，珍珠奶茶美味的關鍵在於？
  options:
  - label: A
    content: 沖泡時間的長短
  - label: B
    content: 盛裝容器的材質
  - label: C
    content: 具備解腥去羶的功效
  - label: D
    content: 原料的來源是否天然。
  group_stem: "(四) 臺灣人在一九八〇年代發明了珍珠奶茶：冰紅茶摻入牛奶、糖，再加上粉圓。四十年來，形式變化甚微，倒是添增了不少口味，作為基底的茶品也多了綠茶、各式花茶和熱飲。\n\
    \    珍珠就是大顆的粉圓，乃黑糖漿、地瓜粉或木薯粉再製，傳統製法是地瓜粉和水拌勻，再搓揉成粒狀，然後以篩網篩出即成。\n    奶和茶的結合可能起源於唐代。當年文成公主下嫁松贊干布，帶去茶葉，傳授當地人烹茶技術，並用牛奶、羊奶熬煮茶葉，據說他們愛死了這種清香美味的奶茶，已經到了「寧可三日無糧，不可一日無茶」的地步。\n\
    \    不僅美味，其中還存在著養生的道理。中醫觀點認為奶茶能解腥去羶、清內熱。北方的游牧民族長期吃肉，體內維生素和無機鹽不足，導致營養失調、消化不良，喝奶茶剛好可以緩解這些現象。\n\
    \    清代的皇室祭祀，都要奉上一碗奶茶來表示敬意。宮廷筵席還把賜奶茶作為隆重的禮儀制度。為了敬重奶茶，乾隆皇帝有一只白玉鑲寶石的奶茶碗，專門在重要的筵席上自己喝奶茶或賜奶茶用的，這只碗使用完美無瑕的和闐玉製作，在碗外壁近底部和圈足表面，錯飾金片的花草，並用180顆紅寶石嵌成花瓣。\n\
    \    既是粉圓、奶茶連袂演出，美味的關鍵主要在兩者的品質，奶茶須新鮮香醇，避免用奶精、糖精；粉圓的口感講究彈勁，不可黏稠，更不可摻加工人合成塑化劑。\n\
    \    優質的珍珠奶茶，上面總是一層綿密的身泡，同時表現茶香和奶香，兩者又能快樂地平衡。它取悅味蕾如同一場優美的舞蹈。粉圓徜徉在茶湯中，吸吮入嘴，輕柔撫觸舌尖，滑動，像舌頭之外另一個舌頭。每一顆粉圓溜進嘴裡都像一次甜蜜的吻。\n\
    節錄自焦桐〈珍珠奶茶〉"
