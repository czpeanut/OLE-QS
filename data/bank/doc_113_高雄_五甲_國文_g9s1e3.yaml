  section: 3
  number: 7
  type: single
  page: 1
  stem: 「有覆於上者如天，載於下者如地，而百姓不知之。有恩信及一物，教化及一夫，民則歸之。其猶豐年與旱歲也：豐年之民，不知甘雨柔風之力，不知生育長養之仁，而曰：『我耕作以時，倉廩以實』。旱歲之民，則野枯苗縮，然後決川以灌之。然則一川之仁豈深於四時也哉？」下列何者最能與這段文字的意旨相呼應？【會考考古題】
  options:
  - label: A
    content: 對感情的得失順其自然，不執著強求
  - label: B
