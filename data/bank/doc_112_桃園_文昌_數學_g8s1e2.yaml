    有一天阿潤跟阿祐玩猜數字遊戲，阿潤對阿祐說：「你先拿計算機，將你心中所想的數字平方，加上這個數字的14 倍，接著再加上40，最後除以這個數字加4，然後告訴我你得到多少？例如，如果你想的數字是10，那麼$10^{2}+140+40=280$，$280\div(10+4)=20$，你就要告訴我是20。」阿祐回答：「那我算完的數字是79。」若阿祐沒有計算錯誤，請問阿祐心中想的數字是多少？'
