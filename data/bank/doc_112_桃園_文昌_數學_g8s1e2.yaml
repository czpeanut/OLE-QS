    如右圖，兩雙鄰邊分別相等的四邊形稱為「鳶形」（即$\overline{AB}=\overline{AD}$，$\overline{BC}=\overline{DC}$。）因為長得像風箏，所以又稱「箏形」。而鳶形的對角線會互相垂直（即$\overline{AC}$垂直$\overline{BD}$於$E$點），且其中一條對角線會平分另外一條對角線（即$\overline{BE}=\overline{DE}$）。已知右圖的鳶形中，$\overline{AD}=10$，$\overline{CD}=24$，$\overline{AC}=26$，請問$\overline{BD}=?$'
