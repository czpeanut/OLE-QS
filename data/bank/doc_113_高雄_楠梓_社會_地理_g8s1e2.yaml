  group_stem: "◆「中國製造」&「美國製造」\n川普再度贏下美國總統大選，勝選感言喊話「修復美國一切問題」，政策走向為強化美國本土製造，美國製造將再度成產業重點趨勢。自2018\
    \ 年針對「中國經濟侵略」簽署備忘錄，認定「中國偷竊美國智慧財產權和商業秘密」展開關稅制裁，「美中貿易戰」至今已第六年。從早先對中國鋼鐵、鋁產品加徵懲罰性關稅，接著將中國網通設備大廠華為列入「實體清單」，並禁止美國廠商及其供應商未經政府許可不可與之往來，貿易戰將其他國家也捲入戰火。\n\
