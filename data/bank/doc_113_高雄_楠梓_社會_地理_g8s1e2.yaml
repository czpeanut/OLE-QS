  stem: 東南沿海是中國經濟改革開放的火車頭，在中國廣東的眾多工廠裡，每年有400 萬雙手，生產銷往全球的400 億個玩具，聖誕樹、聖誕彩燈、聖誕花環和聖誕球等產品被裝滿貨櫃，從深圳港口出發，漂洋過海遠赴歐美各地。早期中國被稱為「世界的聖誕工廠」，最主要的原因是具有下列何種生產優勢？
