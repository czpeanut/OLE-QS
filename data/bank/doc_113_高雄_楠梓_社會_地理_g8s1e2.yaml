  stem: 下列何者不是一帶一路串連的區域？
  options:
  - label: A
    content: 東北亞
  - label: B
    content: 歐洲
  - label: C
    content: 非洲
  - label: D
    content: 東南亞
  group_stem: "◆「一帶一路」\n    中國於 2013 年提出「絲綢之路經濟帶和21世紀海上絲綢之路」，圖三為示意圖。近年來中國成為許多參與國的債權國，這些國家欠下對中國大筆債務，此策略被西方國家批評為『債務陷阱』。這是因為中國資助參與國大型基礎建設，並限定只能由中國企業執行，但後期大多無法償還債務，被迫將基礎建設租借給中國，使得中國在國際的影響力大增。2023\
    \ 年是此政策提出的十周年，學者指出中國「一帶一路」項目可能給沿途國家帶來的風險，包括（甲）侵害國家主權、（乙）龐大財務負擔、（丙）脫離當地經濟需求、（丁）當地環境破壞影響等。因此有愈來愈多的國家，特別是亞太國家，表示出對此政策可能帶來的風險憂心。有些國家甚至停止或縮減了「一帶一路」項目的規模，但是根據中國官網消息，目前中國已與\
    \ 126 個國家和 29 個國際組織簽署了 174 份共建合作文件，並指出很多國家自願加入，因為基礎設施建設將有助於提升貿易、增加就業、經濟多元化。請問："
  shared_asset: g1_57_60
