  - label: A
    content: 南京
  - label: B
    content: 北京
  - label: C
    content: 武漢
  - label: D
    content: 重慶。
  group_stem: '◆「西部大開發政策」

    中國為了均衡區域差距，促進西部地區的社會與經濟發展，2000 年提出西部大開發政策，希望通過政策和財政投入，加快中西部地區發展，主要項目包括:西電東送、西氣東輸、青藏鐵路、南水北調。自西元2001
    年起實施為期十年的「西部大開發」政策，2020 年宣布西部大開發政策再延續，進入第三個十年(西元2021～2030 年)階段。為鼓勵沿海地區產能向內陸遷移，臺商若進駐西部經濟帶將可享15%所得稅優惠、進口自用設備免關稅等優惠。請問：'
