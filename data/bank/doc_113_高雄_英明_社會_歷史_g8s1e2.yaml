  section: 1
  number: 26
  type: single
  page: 1
  stem: 《馬可波羅遊記》中記述著：「從汗八里城，有通往各省四通八達的道路。在每一條大路上，按照市鎮座落的位置，間隔四十或五十公里之間，都設有驛站，築有旅館，接待過往商旅住宿。每一個驛站，常備有四百匹良馬，供大汗信使來往備用，所有專使都可以有替班的驛馬，凡他們留下疲憊不堪的馬匹，可在這裡換上健壯的馬匹……。」請問：由上述遊記中的紀錄可知，驛站的建立對於蒙古有何影響？
