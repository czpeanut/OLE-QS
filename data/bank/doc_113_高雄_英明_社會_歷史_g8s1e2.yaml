  stem: 中國經常以「天朝」或「上國」自居，但當外族之力量強大時，中國迫於形勢，也會採取對等策略，以謀求和平。請問：北宋真宗在外族入侵時簽訂澶淵之盟，以換取和平。請問：下列關於澶淵之盟的內容何者正確？
  options:
