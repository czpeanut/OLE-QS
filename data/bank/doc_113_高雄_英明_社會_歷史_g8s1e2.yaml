  stem: 阿禹正在觀賞唐末五代時期的古裝劇，劇中中國北方的契丹族興起，建立了遼國，並取得哪一塊戰略要地，使得長城的屏障作用大為衰減，造成北方門戶洞開，日後宋與遼也常常發生衝突。請問：劇中戰略要地指的是下列何者？
