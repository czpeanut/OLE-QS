  stem: 理學，又稱新儒學。理學相信有「天理」，人生在世必須在各自的崗位上做事以完成理分，即盡本分。理學強調「敬」，敬是一種全神貫注的心理狀態，演變成中國社會的「敬業」精神。理學又強調勤勞勤學，愛惜光陰，認真把事做好，也有類似禪宗「一日不作，一日不食」的倫理觀念。請問：理學是將當時盛行的哪些思想融入儒家經典中而成？
  options:
  - label: A
    content: 佛教、道教
  - label: B
    content: 佛教、伊斯蘭教
  - label: C
    content: 天文、醫學
  - label: D
    content: 醫學、史學。
