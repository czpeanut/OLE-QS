- id: doc_111_高雄_大灣_社會_g9s1e2_s1_33
  section: 1
  number: 33
  type: single
  page: 3
  stem: 兩則資料認為許多戰士加入鄂圖曼帝國並建立強大的軍力，最主要的原因為何？
  options:
  - label: A
    content: 為伊斯蘭信仰奮戰
  - label: B
    content: 反對基督教信仰
  - label: C
    content: 追求崇高的統治權
  - label: D
    content: 獲得豐厚的戰利品。
  group_stem: '資料一

    鄂圖曼帝國對於有才能、野心的人提供許多機會，且不論他們的社會出身或宗教背景。鄂圖曼帝國總是歡迎各民族加入軍隊；從軍的前景是可以發財，也能為穆罕默德的信仰盡力，只要鄂圖曼軍隊繼續贏得戰爭，並自基督教世界中征服新的土地，就能不斷吸引東方的戰士加入，這些兵力也混有原本信仰基督教的戰士。鄂圖曼政府從未歧視非土耳其血統的人，等級是依職務與成就而定，而不是依據世襲模式，蘇丹的軍隊因此對有能者打開大門。

    資料二

    鄂圖曼得以長存的原因，長期被認為是追求「聖戰」的使命感，但近年重新探討研究發現，發現他們只是個「掠奪聯盟」，成員裡有穆斯林戰士，也有基督教戰士，他們的目標是「戰利品、財寶與奴隸，而非統治者嘴巴說出來美化過的修辭」。在此聯盟中，土耳其戰士只佔少數；征戰的快速節奏除意志力支撐外，還需要不分彼此，接納眾多基督徒進入這個鄂圖曼群體，以彌補國家的人力不足。'
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 歷史
      code: 3-3
      title: 伊斯蘭教的興起與擴張
      chapter: 第3章 普世宗教的發展
    textbook: 九上歷史 3-3 伊斯蘭教的興起與擴張
    labeled_by: ai
