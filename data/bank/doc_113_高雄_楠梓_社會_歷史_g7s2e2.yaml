  section: 1
  number: 25
  type: single
  page: 1
  stem: 日治時期某組織領袖指出：「日本是立憲國家，臺灣也應享有立憲政治之待遇。且臺灣情況特殊，不同於日本國內，有特別立法之需求，是以設立議會來為臺灣立法與預算審核是必要的。」從上述判斷，這最可能是下列何者的主張？
  options:
  - label: A
    content: 中國民主黨
  - label: B
    content: 臺灣地方自治聯盟
  - label: C
    content: 臺灣民眾黨
  - label: D
    content: 臺灣議會設置請願運動。
