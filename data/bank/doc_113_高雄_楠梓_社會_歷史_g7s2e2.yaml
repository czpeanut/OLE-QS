  section: 1
  number: 33
  type: single
  page: 2
  stem: 典型在夙昔，古道照顏色，在台灣，你不能不知道，誰是：林獻堂、蔣渭水、蔡培火、李應章、杜聰明、李友邦、吳三連、賴和、黃土水。一九二○年代，是文化協會的年代，也是台灣菁英狂飆的年代。請問:當時台灣菁英的努力催生下，臺灣民眾第一次行使投票權在何時得以實現?
