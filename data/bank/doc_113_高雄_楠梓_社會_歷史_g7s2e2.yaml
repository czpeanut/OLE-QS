- id: doc_113_高雄_楠梓_社會_歷史_g7s2e2_s1_36
  section: 1
  number: 36
  type: single
  page: 2
  stem: '遊戲廠商想推出一個有關臺灣歷史的解謎遊戲，身為遊戲測試員的小明，在遊戲中的某本日記裡發現下列內容，請閱讀後回答問題：


    內容一：真好笑，明明是人民應有的權利，現在卻被打壓成妖魔鬼怪，從今天起我也算是那些人口中的「黨外人士」了吧！希望這個島嶼真的能如雜誌社的名稱一樣美麗。


    內容二：雜誌社的同伴以紀念國際人權日為由，向高雄市政府警察局申請演講活動，但一直未獲准許。不過依照原定計畫，他們12 月10 日當天還是要去遊行，那天我剛好有事情無法參加，希望大家都能平安。


    內容三：雜誌社被警察查封了，也有許多同伴以「叛亂罪」為由被捕入獄，那些媒體根本是政府的走狗，說什麼我們是共匪、暴力分子……。


    由日記的內容判斷，這是在說明哪一個歷史事件？'
  options:
  - label: A
    content: 二林事件
  - label: B
    content: 二二八事件
  - label: C
    content: 野百合學運
  - label: D
    content: 美麗島事件
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 歷史
      code: 4-3
