  section: 1
  number: 30
  type: single
  page: 1
  stem: 麥麥為了研究二二八事件，決定訪問曾經歷過那個時期的耆老，在徵求同意並預約好時間後，他便前往採訪。在採訪過程中，麥麥有些恍神，導致有些地方記錄有誤。請問：下列何者最有可能是他記錄錯誤的地方？
  options:
  - label: A
    content: 陳奶奶：行政長官公署接收臺灣，但他們卻沒什麼作為，還亂用特權，甚至有不少官員貪汙
  - label: B
    content: 林爺爺：國民政府遷臺後，因不當查緝私菸誤傷民眾，引發全島衝突
  - label: C
    content: 曾婆婆：國軍從基隆登陸臺灣展開鎮壓，西部地區傷亡慘重
  - label: D
    content: 楊公公：臺灣省警備總司令部進行掃蕩清鄉，社會充滿恐怖氣氛。
