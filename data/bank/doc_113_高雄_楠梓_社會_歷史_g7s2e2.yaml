  stem: 上文中提到公佈戒嚴令的政府單位(甲)指的是下列何者?
  options:
  - label: A
    content: 臺灣省行政長官公署
  - label: B
    content: 總統府
  - label: C
    content: 臺灣省警備總司令部
  - label: D
    content: 臺灣議會
  group_stem: '民國38年5月19日，全臺各大報報導臺灣省政府及(甲)公告，自5月20日起，全臺戒嚴。實施戒嚴目的是維護社會治安，防止共黨滲透社會、煽動群眾運動。依據法令，戒嚴地區內最高司令官的權限如下：

    1.得停止集會、結社及遊行請願，並取締言論、講學、報章雜誌、圖書。

    2.得解散集會、結社及遊行、請願。

    3.禁止罷市、罷工、罷課、罷業，並得強制其回復。

    4.拆閱、扣留或沒收郵信電報。

    5.檢查交通工具及旅客等。

    6.限制或禁止宗教活動。

    7.不得已時，得破壞人民的不動產。

    8.檢查、禁運或徵收民糧和其他資源。

    在臺灣實行長達38年的戒嚴，直到民國76年7月15日零時正式解除。戒嚴期間，人民的基本權利受到相當多的限制。'
