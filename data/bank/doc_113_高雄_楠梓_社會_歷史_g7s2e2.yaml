  section: 1
  number: 35
  type: single
  page: 2
  stem: '一位法學家在著作裡寫了一段如附圖的內容。文中的「這項法條」所指為何？


    西元1948 年是中華民國風雨飄搖的一年，政府有鑑於中共叛亂日益擴大，遂制定這項法條，賦予總統緊急處分權，以因應國家重大變故。'
  options:
  - label: A
    content: 《動員戡亂時期臨時條款》
  - label: B
    content: 《戒嚴令》
  - label: C
    content: 《中華民國憲法》
  - label: D
    content: 《六三法》。
