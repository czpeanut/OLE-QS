- id: doc_113_高雄_楠梓_社會_歷史_g7s2e2_s1_37
  section: 1
  number: 37
  type: single
  page: 2
  stem: 國民政府原本於民國36 年就已公布《憲法》，之後卻因為哪一件事的發生，限制了《憲法》的施行？
  options:
  - label: A
    content: 中日戰爭爆發
  - label: B
    content: 進行清鄉掃除異議分子
  - label: C
