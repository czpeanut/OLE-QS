  section: 1
  number: 34
  type: single
  page: 2
  stem: 臺灣光復初期大陸人士以解放者自居，使無法得到政府工作的臺灣本土菁英更為難受，他們原本希望優先被考慮擔任政府的職務，也殷盼經濟能恢復到至少相當於日治時代的標準。然而，國民黨在過去十年已經精疲力竭，戰後又遭受到出人意料的逆境，難以提供有效率的、大規模的行政管理和迅速的經濟復原。請問:上文中提到的遭逢逆境指的是下列何事?
  options:
