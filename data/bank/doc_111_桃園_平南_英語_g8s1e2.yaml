- id: doc_111_桃園_平南_英語_g8s1e2_s5_41
  section: 5
  number: 41
  type: single
  page: 2
  stem: Why do some people think TV is bad for children?
  options:
  - label: A
    content: Because they can enjoy the world.
  - label: B
    content: Because they can go to school early.
  - label: C
    content: Because they can learn much from TV.
  - label: D
    content: Because they don’t have time to think.
  group_stem: 'Many people enjoy watching TV for fun because there are a lot of information
    on it – news, science, sports, and movies. Some people think it’s good for kids
    to watch TV because they can learn about the world before they go to school. However,
    some people think watching TV is not good for children. They found that more and
    more children have problems in reading, thinking, and concentrating on things.
    Moreover, watching too much TV is bad for eyes. When children spend much time
    watching TV, they don’t have enough time to think or communicate with other people.
    Next time, when you’re sitting in front of your TV, try to turn if off, go out,
    and enjoy the beautiful world.


    information 資訊 problem 問題

    concentrate 專心 communicate 溝通'
  tags:
    textbook: 第三冊（八上）第2次段考範圍
    labeled_by: ai
