  stem: '小董用紫色水性筆在圓形濾紙圓心畫一個紫色大原點，再用滴管在圓心滴水一段時間，此時色素向外擴散，然後停止滴水，發現形成外圈為藍色、內圈為紅色的同心圓，如圖所示。

