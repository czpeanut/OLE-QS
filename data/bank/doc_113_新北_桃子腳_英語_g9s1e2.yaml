  group_stem: 'Child Marriage: Gloria’s Story

    Gloria grew up in a poor village in Ambia. Every day, her parents went fishing
    to feed their large family. But some days,

    they didn’t catch enough fish, and the children went to bed hungry. After Gloria’s
    father died, her mother had to take care of her

    ten children alone.

    When Gloria was twelve, her family made her marry a 35-year-old man, and they
    hoped he would support them. However, he

    only gave them a single goat instead. Worse, Gloria had to leave school and lost
    her freedom.

    Gloria became pregnant soon after. She was afraid because she wasn’t ready to
    be a mother. Sadly, before the baby was born,

    her husband died in an accident. Then, her husband’s brother married her. Life
    became harder. Her new husband treated her

    terribly, and during a serious fight, Gloria lost her first baby.

    Years later, she was pregnant again, but her second husband also died and left
    her alone. Now, Gloria dreams of her child

    going to school and having a better future.

    “When children stay in school, their lives can be different,” Gloria said. “Early
    marriage is difficult. You lose your freedom

    and rights.”

