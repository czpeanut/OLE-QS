  section: 6
  number: 31
  type: single
  page: 3
  stem: 31. Why is the European Space Agency (ESA) thinking about a time zone for
    the moon?
  options:
  - label: A
    content: Because the moon is too far from Earth.
  - label: B
    content: Because time on the moon is the same as on Earth.
  - label: C
    content: Because there are more and more space missions to the moon.
  - label: D
    content: Because astronauts cannot tell the time on the moon.
  group_stem: 'The Moon Might Have Its Own Time Zone

    The European Space Agency (ESA) is thinking about creating a special time zone
    for the Moon. They believe this idea is

    helpful because there are more and more missions going on to the Moon.

    Right now, each country uses its own time zone to tell the time for Moon missions.
    This can make it hard for astronauts from

    different countries to work together. Scientists from around the world are discussing
    a “common Moon time” that everyone can use.

    They first talked about this idea in a meeting in the Netherlands last year. People
    at the meeting agreed it would be easier if all

    astronauts followed the same time on the Moon.

    However, there is one problem: clocks on the Moon run faster than clocks on Earth.
    Also, time on the surface of the Moon

    is different from time in the Moon’s orbit. The ESA is working on ways to fix
    these problems.

    In the future, we might even have time zones for other planets, like Mars. What
    do you think about having a “Mars Common

    Time”?

     time zone 時區 mission 任務 astronaut 太空人 surface 表面 orbit 軌道'
