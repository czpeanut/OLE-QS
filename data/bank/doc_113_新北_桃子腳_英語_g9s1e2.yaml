  stem: '33. This article is more likely to be found in the book: _______________.'
  options:
  - label: A
    content: How to Make the Most of Your Day by Sarah Collins, 2018
  - label: B
    content: How Cellphones Steal Our Time by James Harlow, 2016
  - label: C
    content: Successful Habits for Health by Dr. Linda Ray, 2020
  - label: D
    content: Simple Skills for Make Powerful Notes by Robert Lee, 2015
  group_stem: 'How to Get More Done

    Have you ever felt like there are not enough hours in the day? This can mean you
    don’t feel like you have enough time to

    finish everything you need to do!

    When you have too much to do, you may feel tired and lose energy. Here are some
    tips to help you work better and get more

    done!

    ⚫ Write Things Down

    Write down everything you need to do, like shopping, dates, and ideas. Writing
    down ideas can help clear your mind, even if you

    haven’t done any tasks yet. If you’d rather not use paper, try using your computer
    or phone to make a list instead.

    ⚫ Cut Out All Distractions

    For many people, technology is the biggest distraction, especially cell phones.

    If turning off notifications or placing your phone face-down doesn’t work, try
    tying your phone with a rubber band. This makes the

    screen harder to use and reminds you not to check it.

    ⚫ Plan Your Day

    Plan your day, including work hours, break times, and other activities. When you
    make this plan, think about when you feel most

    energetic. For example, maybe you feel more active after lunch, or maybe you start
    to feel tired at the end of the day. Use your

    energy wisely by doing easy work when you’re less focused and difficult work when
    you’re more focused. This way, you can

    make the best use of your time!

     instead 替代distraction 分心 technology 科技 notification 通知 rubber band 橡皮筋'
