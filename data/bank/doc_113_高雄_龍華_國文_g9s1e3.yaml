  section: 1
  number: 16
  type: single
  page: 2
  stem: 下列選項關於歷代古典文體的發展，何者敘述錯誤？
  options:
  - label: A
    content: 漢 司馬遷的《史記》善於把歷史事件和人物事蹟故事化，並開創了以「年代」為主的編年體文學
  - label: B
    content: 魏晉南北朝時期駢文興起，句法整齊、詞藻華麗、聲律和諧及善於用典，並有「駢四儷六」的名稱
  - label: C
    content: 唐 宋古文運動，效法先秦兩漢的質樸文風，以改革駢文忽略內容的弊端，三蘇是其中的重要作家
  - label: D
    content: 晚明提倡形式活潑自由、文字清麗、抒發性靈、獨創格調的小品文，張岱、袁宏道是其中代表作家
