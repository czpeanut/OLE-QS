    content: 先覺先知，為萬古倫常立極；至誠至聖，與兩間光化同流／夫子賢於堯 舜遠；至誠可與天地參
  - label: B
    content: 〈梁父吟〉成高士志；〈出師表〉見老臣心／功蓋三分國，名成八陣圖。江流石不轉，遺恨失吞吳
  - label: C
    content: 身入狼邦，壯志匹夫生死外；心存燕國，蕭寒易水古今流／心似已灰之木，身如不繫之舟。問汝平生 功業，黃州 惠州 儋州
  - label: D
    content: 明主憐才赦酒狂，不知力士賤文章。當其醉草〈清平調〉，肯信長安是夜郎／千古詩才，蓬萊文章建安骨； 一身傲骨，青蓮居士謫仙人
