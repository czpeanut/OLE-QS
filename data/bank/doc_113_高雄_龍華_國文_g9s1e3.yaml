  stem: 「我們之間的關係到底有多脆弱呢？我只要關掉電腦，關掉手機，可能這輩子你就再也聯繫不到我了。那些你看似近在咫尺的人，其實竟陌生地有些荒唐了！」請問以上這段文句主要是說明下列何者？
