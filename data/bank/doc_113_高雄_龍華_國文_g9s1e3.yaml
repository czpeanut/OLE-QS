  stem: 〈湖心亭看雪〉文中：「天與雲、與山、與水，上下一白」是以由上而下的運鏡方式寫景，請問下列哪個選項沒有使用這種寫作手法？
  options:
  - label: A
    content: 千山鳥飛絕，萬徑人蹤滅。孤舟簑笠翁，獨釣寒江雪（柳宗元〈江雪〉）
  - label: B
    content: 時夕陽在山，蒼翠欲滴，風葉露穗，搖蕩若千頃波（李慈銘〈越縵堂日記〉）
  - label: C
    content: 碧雲天，黃葉地，秋色連波，波上寒煙翠 （范仲淹〈蘇幕遮〉）
  - label: D
    content: 孤帆遠影碧山盡，惟見長江天際流（李白〈黃鶴樓送孟浩然之廣陵〉）
