- id: doc_113_高雄_龍華_國文_g9s1e3_s2_40
  section: 2
  number: 40
  type: single
  page: 7
  stem: 根據上圖與文字說明，下列選項何者為要表達的主題？
  options:
  - label: A
    content: 多元均衡，食在好健康
  - label: B
    content: 吃對營養，食在好簡單
  - label: C
    content: 三餐膳食，食在好順暢
  - label: D
    content: 順食養生，食在好當令
  group_stem: "【四】\n◆資料來源：\n     衛生福利部 國民健康署網站\n    當需要查看良辰吉日，或依照節氣旅行農事時，我們常依照《農民曆》記載行事。但你聽過《食民曆》嗎？\n\
    \    人們常說：「民以食為天」，食物是一切活力與生命的來源。《食民曆》顧名思義，可以大致猜想其內容與「食物」有關。《食民曆》一冊乃由衛生福利部 國民健康署與行政院\
    \ 農業委員會農業試驗所共同合作撰寫，讓民眾能夠瞭解多元食材與營養素，並搭配豐富美味的料理食譜，均衡攝取補充多元營養。而進入衛福部網站後另外還有搭配淺顯易懂的食譜影音，希望民眾更能在生活中落實均衡飲食，達到改善國人膳食營養攝取狀況的目標。\n\
    \    《食民曆》一冊除了對於食材與營養素有詳盡介紹，另極力推廣「吃在地、食當季」的飲食概念。透過選擇在地及當季食材，不但能支持本土農民，還能讓消費者直接食用最新鮮、價格實在的食物，更重要的是，減少的食物碳里程，可以為暖化的地球環境盡一份心力。\n\
    \    圖文並茂的《食民曆》，幫助我們了解氣候與節氣，認識食材與營養素，體認到萬物與自然運轉的時序與法則，除了能更珍視粒粒皆辛苦的「盤中飧」之外，也能替自己的健康把關。一起跟著《食民曆》來好好過生活，當個新世代聰明又智慧的「吃貨」吧！"
  shared_asset: g2_40_41
