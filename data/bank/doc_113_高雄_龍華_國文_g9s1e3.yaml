  stem: 下列選項關於「古典韻文」的敘述說明，何者完全正確？
  options:
  - label: A
    content: 樂府詩屬於「歌行體」，多為文人作品，以抒發感情為主，風格含蓄，不要求平仄與對仗
  - label: B
    content: 古體詩稱為「古風」，成熟於漢代，用韻有一定的限制，《古詩十九首》為其重要代表作品
  - label: C
    content: 近體詩可分為「絕句、律詩」，均須一韻到底，亦皆要求對仗。絕句共四句，律詩共八句。依寫作風格 可分為田園派、浪漫派、邊塞派、寫實派等
  - label: D
    content: 詞又稱為「曲子詞、長短句」，字數、句數、平仄、押韻皆依詞牌規定而作，北宋有豪放派蘇軾、南宋 有愛國詞人辛棄疾，兩人合稱「蘇 辛」
