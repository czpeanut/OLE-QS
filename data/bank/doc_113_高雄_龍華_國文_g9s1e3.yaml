  - label: A
    content: 竹枝詞本是流行於巴 渝一帶的民間歌謠，經宋代 朱熹等文人加以剪裁，而流傳於世
  - label: B
    content: 〈鹿耳門〉一首概述其特殊地理環境，讚嘆此自然屏障形成天險，敵人難以進犯撼動
  - label: C
    content: 〈蔗田〉此詩符合起承轉合結構，透過視覺與聽覺摹寫刻畫早期農業土地活躍的生命力
  - label: D
    content: 兩首詩皆從移民來臺後的觀察角度出發，記敘個人所見所聞，風格樸實、自然流暢
