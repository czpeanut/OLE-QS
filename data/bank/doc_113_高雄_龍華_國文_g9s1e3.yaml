  section: 1
  number: 14
  type: single
  page: 2
  stem: 下列選項關於「古典小說」的敘述，何者有誤？
  options:
  - label: A
    content: 《老殘遊記》，作者劉鶚，化身老殘四處行醫遊歷各地以抒發對時事的感慨，為當時四大譴責小說之一
  - label: B
    content: 《世說新語》，編者劉義慶，收錄東漢至東晉名士的言行軼事，反映當時品評人物風氣，為志人筆記小說
  - label: C
    content: 《紅樓夢》，作者曹雪芹，內容以賈府盛衰及賈寶玉、林黛玉的愛情為主軸，堪稱最高成就的古典言情小說
  - label: D
    content: 《三國演義》，作者羅貫中，根據史實有憑有據，描述魏 蜀 吳三國鼎立故事，為民間最流行的俠義小說
