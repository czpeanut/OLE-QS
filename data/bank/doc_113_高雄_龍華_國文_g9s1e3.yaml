  page: 3
  stem: 子京想要上網查閱關於「曲」的文體介紹，但資料繁瑣，請分辨下列資訊何者有誤？
  options:
  - label: A
    content: 曲又稱為「詞餘」、「樂府」，盛行於元代，與漢賦、唐詩、宋詞並稱為中國四大韻文
  - label: B
    content: 其曲調名稱為「曲牌」，與內容無關，僅代表音樂性，部分作者會另加題目以點出題旨
  - label: C
    content: 元曲分為散曲和雜劇，散曲有科、白，配合動作、說話來搬演故事情節，由主角獨唱
  - label: D
    content: 曲牌規定的字數之外增加的字為「襯字」，用以補足語氣或描摹情態，唯字數不得過多
