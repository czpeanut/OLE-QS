    content: 兩情若是久長時，又豈在朝朝暮暮
  - label: C
    content: 相恨不如潮有信，相思始覺海非深
  - label: D
    content: 曾經滄海難為水，除卻巫山不是雲
  group_stem: "【一】\n    1927 年，心理學家布爾瑪•契可尼讓受試者在時間限制下從事幾項簡單的工作，例如：算數、拼圖或串珠，並隨機打斷受試者，使他們無法完成所有任務，活動結束後，契可尼詢問受試者剛才做過哪些項目，發現受試者比較記得被打斷而未完成的工作，對已經完成的事情反倒容易忘記。這種對未完成的事情耿耿於懷的心理被叫做「契可尼效應」，套用到戀愛方面，契可尼解釋了人們為何對初戀無法忘懷，第一次戀愛往往是未完成的遺憾經驗，人們反射性認為那是最珍貴的，所以牢牢記住那段過往。"
