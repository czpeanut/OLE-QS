  stem: 道光 15 年，淡水廳同知李嗣鄴先後諭令粵籍姜秀鑾、閩籍林德修、周邦正合組成「金廣福墾號」，以此為據點組成龐大墾拓組織，金廣福公館即為當時之隘墾總部及指揮中心，姜秀鑾為金廣福第一代粵籍墾首。郁翔想要加入上述組織，他會發現臺灣先民開墾過程中有哪一現象？
