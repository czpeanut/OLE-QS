- id: doc_113_高雄_英明_社會_歷史_g7s1e3_s1_34
  section: 1
  number: 34
  type: single
  page: 2
  stem: '清領時期（西元1880 年），住福建省的敬杰想要到臺灣工作，他工作的地點是專門經營茶葉與樟腦貿易的洋行，他想要委託牙行（註）幫他找房子，但是無奈當時的牙行騙子很多，經常使用不實話術行騙，敬杰只好請住在臺北府的你幫忙判斷，請依據當時的時空背景，找出哪間房子的資訊正確，且適合敬杰？

    註：牙行：協助買賣雙方成交，從中抽取佣金的人或商號。'
  options:
  - label: A
    content: 地點：安平，一房一廳，牙行表示因為政府政策不能攜眷來臺，故而適合像敬杰這樣的單身漢
  - label: B
    content: 地點：淡水，三房兩廳，適合攜家帶眷的敬杰，而且是洋行商品的集貨地
  - label: C
