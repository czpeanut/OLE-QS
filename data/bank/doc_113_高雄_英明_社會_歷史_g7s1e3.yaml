  section: 1
  number: 31
  type: single
  page: 1
  stem: 「我在 1873 年第一次為人拔牙。有一天我和學生們離開竹塹時，被十幾個派來監視我們的士兵跟著，其中一個士兵因為蛀牙而疼痛不堪……。我第一套拔牙的工具很簡單，是請一位當地的鐵匠，按照我的吩咐打製而成。我也不需要椅子，因為當還有一百位牙痛的人在排隊等候時，任何精心高雅的工具都只是浪費時間。漢人們很勇敢，很能忍耐手術時的痛苦……。」上文敘述著一位傳教士在臺灣藉由提供醫療服務傳教的過程。請問：關於這位傳教士的敘述，下列何者正確？
