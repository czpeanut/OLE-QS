- id: doc_113_高雄_英明_社會_歷史_g7s1e3_s1_39
  section: 1
  number: 39
  type: single
  page: 2
  stem: 請問，上述的水圳應該位於右圖中的何處？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
  group_stem: '資料一：張達京於康熙年間來臺，娶了平埔族岸里社頭目女兒為妻，被稱為「番仔駙馬」，因為他精明幹練，被清朝政府賦予協調原漢糾紛，傳達政令之責。張達京又與岸里社合作，採取「割地換水」的方式興建水圳。雍正年間因中部平埔族群對清廷不滿，發生大規模抗官事件，張達京與岸里社人協助官兵平亂有功，被皇帝賜予七品官銜。


    資料二：平埔族後裔潘大和在書中如此寫道：「江湖郎中搖身一變為華佗再世：據一般史書稱張氏雀屏中選「番駙馬」乃本族感念其恩澤、醫療社內流行的瘟疫等。此與事實不符……張氏既於夜半三更在本族水源處放毒，致不少族人中毒後，張氏再將患者解毒，方大吹大擂華佗再世，本族憨直，一時不察，信以為真……張達京於登上本族土官阿藍之駙馬後，隨即反客為主，並利用職權，威脅利誘連續娶西勢尾、烏牛欄、麻裡蘭及上述舊社等六社之族長或土目之女為妾，為所欲為……見本族憨直且文盲，於雍正年間，行「割地換水」之計，將本族流血流汗長達十七年開墾的臺中盆地，幾乎侵佔殆盡。」'
