- id: doc_113_高雄_楠梓_國文_g8s2e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: "「象棋裏頭我覺得最『奧祕』的遊戲規則，就是『卒』。卒子一過河，就沒有回頭的路。人生中一個決定牽動另一個決定，一個偶然注定另一個偶然，因此偶然從來不是偶然，一條路勢必走向下一條路，回不了頭，我發現，人生中所有的決定，其實都是過了河的『卒』。」（龍應台《親愛的安德烈》）\
    \ \n根據內容，為什麼作者會認為人生中所有的決定是「過了河的『卒』」？"
  options:
  - label: A
    content: 天生我材必有用，無名小卒也能在社會上找到立足點
  - label: B
    content: 在危急之時，應該放棄不重要的而保留重要的
  - label: C
    content: 人生無法重來，所有抉擇皆環環相扣，足以影響全局
  - label: D
    content: 君子能坦蕩的以直道而行，即使面臨困頓也不會有所曲斜
  tags:
