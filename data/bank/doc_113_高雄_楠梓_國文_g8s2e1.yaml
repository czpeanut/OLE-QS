- id: doc_113_高雄_楠梓_國文_g8s2e1_s2_26
  section: 2
  number: 26
  type: single
  page: 3
  stem: 關於作者在文中所舉用的例子，下列說明何者正確？
  options:
  - label: A
    content: 舉呂布為例，強調「愈挫愈勇」的不敗精神
  - label: B
    content: 舉柯達公司為例，證明「無心插柳柳成蔭」的道理
  - label: C
    content: 以比爾．蓋茲的親身經歷，驗證「聰明反被聰明誤」的俗諺
  - label: D
    content: 舉曹操為例，說明「驕兵必敗」的道理
  group_stem: "【一】 \n高估自己、低估別人、錯估形勢，這三種錯誤通常都是結伴而來的。而會發生的時機都是在一個人最意氣風\n發，過度驕傲的時候。 \n\
    為什麼會如此？微軟創辦人比爾．蓋茲早就提出警告：「成功是最糟糕的導師，它誘使聰明人誤以為自己不會\n失敗。」 \n這三種錯誤息息相關，是有道理的。人會高估自己，就會低估別人，這是比較而來，當心生驕傲的時候，就容\n\
    易看不起人。通常在創業的路上一帆風順的創業者，犯錯的機率偏高，而高估自己、低估別人之後，接下來就會發\n生「錯估情勢」。 \n人在意氣風發的時候，很容易自我感覺良好，認為是因為自己太優秀太厲害了，才會眼光獨到，策略精準，人\n\
    才聚集，水到渠成，天縱英才，才會有今天成功的結果。所以用自己目前成功的經驗來評斷未來發生的一切，就顯\n得名正言順。 \n三國時代的曹操是何等聰明的人物啊，但由於在先前的戰事中一路高走凱歌，消減了袁紹、呂布等勢力之後，\n\
    內心開始驕傲自滿，太過於輕敵，疏於防範，以至於埋下赤壁之戰的大敗，將數十年的根基毁於一旦。 \n所以越成功的人越是要時常提醒自己，內心是否開始覺得自己偉大？當有這麼一絲絲自滿的時候，也就是驕傲\n\
    的開始。人說驕兵必敗，不是沒有道理的。驕傲的時候就會心生傲慢，看不到別人的優點，認為自己才是最強的，\n對手還遠遠的不及於自己，不必理會，所以就疏於防範，沒有提早準備，錯估了情勢。到最後犯下大錯的時候，發\n\
    現情勢早就不站在自己這一邊了。 \n不僅個人如此，企業和品牌也會如此。像發明世界第一臺數位相機，也是影像領導的世界級的柯達公司，最後\n竟然走向破產之路。只因為錯估了情勢，過於保守，抗拒趨勢，太晚投入數位相機的研發與生產，走上了破產的不\n\
    歸路，令人唏噓不已。 \n現在世界的變化太快，個人或企業或品牌一不小心就被趨勢所淘汰。在這充滿危機的世界局勢，作為領導者更\n要戰戰兢兢，靈敏應變。成功只是一時，必須求新求變，與時俱進，推陳出新，才能抓住客戶的心，因應這個變化\n\
    多端的世界。 \n                                                               （節選自「獨立評論＠天下」網站）"
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 國文
      code: 第一課
      title: 運動家的風度
      chapter: null
    textbook: 八下 第一課 運動家的風度
    labeled_by: ai
