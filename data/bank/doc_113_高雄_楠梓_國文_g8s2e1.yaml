- id: doc_113_高雄_楠梓_國文_g8s2e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 「船隻更接近些，幾隻鐮刀狀大背鰭出現在弗氏海豚群體四周，彷佛歷史重演，這是弗氏海豚和花紋海豚混成的大群體。我們也發現幾隻瓶鼻海豚在其中湊熱鬧。船隻靠近，花紋海豚不理不睬仍然慣常地泳動前進，弗氏海豚則顯得慌亂急躁了。」根據内容,下列敘述何者最恰當？
  options:
  - label: A
    content: 瓶鼻海豚的群居習性讓人易在海豚群中觀察到其蹤影
  - label: B
    content: 弗氏海豚與花紋海豚的共同特徵是鎌刀狀的大背鰭
  - label: C
    content: 花紋海豚對船隻毫不理睬是因為反感人類的活動
  - label: D
    content: 由弗氏海豚的反應,可看出其較敏感緊張的性格
