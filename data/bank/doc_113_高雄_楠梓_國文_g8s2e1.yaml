  - label: D
    content: 人生苦短，及時行樂
  group_stem: "【四】    短 歌 行       曹操 \n  對酒當歌，人生幾何？譬如朝露，去日苦多。慨當以慷，憂思難忘。何以解憂？唯有杜康。\
    \ \n  青青子衿，悠悠我心，但為君故，沉吟至今。呦呦鹿鳴，食野之苹。我有嘉賓，鼓瑟吹笙。 \n  明明如月，何時可掇(1)？憂從中來，不可斷絕。越陌度阡(2)，枉用相存(3)。契闊談讌，心念舊恩(4)。\
    \ \n  月明星稀，烏鵲南飛，繞樹三匝，何枝可依？山不厭高，海不厭深。周公吐哺，天下歸心。 \n 注釋： \n  (1)掇：拾取 \n  (2)越陌度阡：穿過縱橫交錯的小路\
    \ \n  (3)枉用相存：有勞前來探訪 \n  (4)契闊談讌：情意投合，一起談心宴飲 \n  (5)舊恩：往日的情誼"
