  section: 2
  number: 28
  type: single
  page: 4
  stem: 根據本文內容，下列何者為作者年輕時對顏回的看法？
  options:
  - label: A
    content: 認為顏回簞食瓢飲是在沽名釣譽
  - label: B
    content: 認為顏回居陋巷的貧困生活會影響學習
  - label: C
    content: 認為顏回應該可以一邊學習，一邊擔任小職位維持生活
  - label: D
    content: 認為顏回在貧困環境中應該不會快樂
  group_stem: "【二】 \n    余昔少年讀書，竊嘗怪顏子以簞食瓢飲，居於陋巷，人不堪其憂，顏子不改其樂。私以為雖不欲仕，然抱\n關擊柝尚可自養，而不害於學，何至困辱貧窶(1)，自苦如此。及來筠州，勤勞鹽米之間，無一日之休，雖欲棄\n\
    塵垢，解羈縶(2)，自放於道德之場，而事每劫(3)而留之。然後知顏子之所以甘心貧賤，不肯求斗升之祿以自\n給者，良以其害於學故也。 \n         \
    \                                                                   節錄自 蘇轍〈東軒記〉\
    \ \n注釋：(1) 窶：貧寒              (2) 羈縶：束縛                (3) 劫：阻礙"
