  group_stem: 'The California Roll: A Sushi Story               17-19 題組

    The California roll is a famous type of sushi enjoyed around the world. It’s made
    with rice, seaweed, crab, avocado, and cucumber. Unlike traditional sushi, which
    has seaweed on the outside, the California roll has rice on the outside and seaweed
    inside.

    Many people believe the California roll was invented in California, which is how
    it got its name. However, it’s not clear who made it first. Some say it was created
    in the 1960s by a sushi chef named Ichiro Mashita in Los Angeles. He used cooked
    crab instead of raw fish and placed the rice on the outside, which was a new idea.
    People in California liked this new sushi, and it became popular quickly.

    Others believe that the California roll was invented by a chef named Hidekazu
    Tojo in Vancouver, Canada. Tojo wanted to make sushi easier for people in North
    America to enjoy, especially those who didn’t like raw fish or seaweed.

    Even though it’s unclear who invented it, the California roll became very popular
    in the 1970s. People liked it because it was different from traditional sushi
    and easier to eat, especially for people who didn’t enjoy seaweed or raw fish.

    Today, the California roll is one of the most popular types of sushi worldwide.
    It shows how food can change and become popular in new places.

    seaweed 海苔、crab 蟹、avocado 酪梨、cucumber 小黃瓜、invent 發明、chef 主廚、raw 生的'
