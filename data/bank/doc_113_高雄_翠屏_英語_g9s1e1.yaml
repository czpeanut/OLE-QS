  group_stem: 'Tina : Check out this couch. I think it’s cool and very interesting.
    What do you think?

    Ivan : It’s not bad. I like that it’s leather, but I don’t think the color is
    right for us.

    Tina : That’s OK. We can check with the clerk and have him show us the other available
    colors.

    Ivan : Not so fast. I know that you like it, but I believe there is another problem.

    Tina : I haven’t really made up my mind yet. So, what’s wrong?

    Ivan : It’s too big. The space in our living room for the couch is not enough.

    Tina : That can’t be. It looks like it’s the right length.

    Ivan : I know for sure that it’s too big.

    Tina : That’s too bad. I thought it would go really well with all the other things
    in our living room.

