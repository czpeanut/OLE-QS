- id: doc_111_嘉義_北興_自然_g7s1e3_s4_31
  section: 4
  number: 31
  type: single
  page: 3
  stem: 依據本文，可推知「漸凍人」發生漸進性退化的構造可能為下列何者？
  options:
  - label: A
    content: 腦幹
  - label: B
    content: 肌肉
  - label: C
    content: 感覺神經元
  - label: D
    content: 運動神經元。
  group_stem: "(一)神經系統的疾病\n  「漸凍人」是源自脊髓、腦幹或大腦傳遞訊息至肌肉的神經元，發生漸進性退化的病症，比起單純的肌肉萎縮症，這種病變的肌肉萎縮更加快速，但患者大腦通常不受影響，智慧一如常人。患者可能會因肌肉無力出現口齒不清、吞嚥困難或是腿部無力等症狀，逐步蔓延至更多部位，甚至導致呼吸衰竭終使病患死亡。此病症多出現於中老年，目前未能治癒，病程相當快速。\n\
    \  而「植物人」主要是指大腦失去大半功能失去意識，但腦幹幾乎無損而存活的人，和昏迷病人較為不同的是植物人大多可自行呼吸，也有睡眠和覺醒的週期，實際上植物人並非都一動也不動，他們也會自行睜眼、眨眼、流淚、吞嚥與呵欠等的動作，甚至會發出聲響或呻吟，往往會讓家屬誤解為，患者終於能回應外界刺激，但其實並非如此，這些多半屬於反射而非有意識的行為。\n\
    \  當植物人狀態超過一個月以上，就被稱作「持續性植物人」，因缺氧導致腦損而昏迷超過六個月，或者是腦創傷後處於植物人狀態超過一年則稱作「永久性植物人」，昏迷時間越久復原的機率也就越低；不過，確實有少數的患者保有「最小意識狀態」，這類植物人的意識處在迷離閃爍的過渡階段，無法對外界刺激有效表達反應，雖然迷離狀態持續時間不等，但脫離該過渡階段後，患者就有機會漸漸步向康復之路。"
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 生物
      code: 5-2
      title: 神經系統
      chapter: 第5章 生物體的協調作用
    textbook: 七上生物 5-2 神經系統
    labeled_by: ai
