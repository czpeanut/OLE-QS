  - label: D
    content: 所有植物必須受到低溫刺激，才能引發開花。
  group_stem: "(二)植物開花的祕密\n  不同植物開花的習性不同，有些植物需要適當光照和黑暗環境的交替才能開花，例如：菠菜是長日照植物，必須連續超過\
    \ 14 小時的光照時間才會開花；大豆則是短日照植物，連續日照時間須短於 14 小時才會開花；而有些植物的開花則和光照似乎沒有直接關係。\n  科學家逐步發現植物的開花與日照光週期有關，而感應光週期的部位就位於葉部的組織，於是假設了一種能促使植物開花的激素——「開花素」的存在，在西元\
    \ 2005 年曾有植物家提出開花素是一種特殊核酸，雖然此研究曾被《科學》期刊列為植物生理學上的突破，但因缺乏可重複驗證性而備受質疑，最後該報告還是從期刊上被撤下；而到了西元\
    \ 2007 年，其他植物學家則提出植物葉子接收到日照週期的特定訊息之後，會產生特殊的蛋白質，並藉由韌皮部的運輸將此物質傳達至莖頂引發開花過程，也就是說該蛋白質可能才是扮演著開花素的角色。但是關於開花素的本尊與詳細作用機制，都尚在研究中未能完全確認。\n\
    \  除了光週期外，有些植物需要受到低溫刺激才能引發開花，此低溫刺激因此被稱為春化作用，植物學家也同樣假設了另一種因低溫刺激植物開花的激素——「春化素」，雖然也證明春化作用的感應部位主要在莖頂，然而春化素的提取和分離一直未能成功，就如同開花素一樣其機制依然尚不明瞭。"
