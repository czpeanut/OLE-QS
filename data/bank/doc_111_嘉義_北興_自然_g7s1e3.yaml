- id: doc_111_嘉義_北興_自然_g7s1e3_s4_38
  section: 4
  number: 38
  type: single
  page: 5
  stem: 依據本文，可知下列何種動物所排放的含氮廢物中，尿酸形式所佔的比例應該最少？
  options:
  - label: A
    content: 人類
  - label: B
    content: 麻雀
  - label: C
    content: 鯉魚
  - label: D
    content: 駱駝。
  group_stem: "(四)含氮廢物的排泄\n  當動物將蛋白質這類含氮養分代謝後，多會產生含氮廢物，排放的含氮廢物包括氨、尿素與尿酸三種形式，毒性強弱分別是氨＞尿素＞尿酸，毒性越強則動物體需要較多的水分來加以稀釋，所以生活在水中的生物排放含氮廢物形式大多會以氨為主；相反地，毒性較小的尿素與尿酸則可以不需要這麼多的水分，其中尿酸相較於尿素的排泄物可說是「更濃縮的尿」，毒性比尿素來得弱，因此排放尿酸的動物，可以省下較多用以稀釋用途的水分。\n\
    \  故居住在乾燥地區或沙漠的動物，排除含氮廢物的形式主要以尿酸為主，鳥類則由於飛行需要，演化出許多減重的構造和機制，含氮廢物以尿酸為主要的含氮廢物排除形式，身體不需攜帶太多的水；包括人類在內的大部分哺乳動物，主要以尿素的形式來排放含氮廢物，成人每日約由尿中排出\
    \ 30 g 的尿素，而我們排出的汗液也含有少許尿素，所以大量流汗而未妥善清潔時，可能會散發出類似尿液的味道。此外在流汗後應須盡速擦汗，避免讓有毒的物質停留在皮膚表面太久，造成毛孔堵塞或紅癢、汗疹等皮膚問題。"
  tags:
