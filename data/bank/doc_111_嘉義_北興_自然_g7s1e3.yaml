- id: doc_111_嘉義_北興_自然_g7s1e3_s4_36
  section: 4
  number: 36
  type: single
  page: 5
  stem: 依據本文，下列何項應不屬於支氣管的特色或功能？
  options:
  - label: A
    content: 讓肺內的空氣離開人體
  - label: B
    content: 為指狀構造，增加交換氣體的表面積
  - label: C
    content: 分泌黏液，過濾吸入的空氣
  - label: D
    content: 使經過的氣體變得溫暖而潮溼。
  group_stem: "(三)認識支氣管炎\n  支氣管是連接喉部氣管，並讓空氣進出肺部的管狀結構，其內部的黏膜會分泌黏性液體，並隨著管壁上的微細纖毛擺動，能夠過濾從外界吸入的空氣，並調節空氣的溫度與溼度。如果支氣管發炎的話，管壁就會腫大且黏膜會大量分泌黏液，這都會阻礙空氣的流通，使得病人出現咳嗽或呼吸困難等的症狀。\n\
    \  支氣管炎通常分為急性及慢性兩類。急性支氣管炎通常是病毒、細菌、黴菌或其他非生物等引起，工作環境中具有毒性刺激氣體，或是有著菸癮習慣的人較容易發病，初期可能會乾咳、胸悶、胸口不適或呼吸有雜音的症狀，有時還會輕微發燒並感到倦怠，如果出現呼吸困難和哮喘等的嚴重症狀時，就要注意有併發肺炎的可能性。\n\
    \  慢性支氣管炎的原因主要是如吸煙習慣、空氣品質等長期性因素，初期病情通常較緩，患者會較容易咳嗽有痰，但症狀可能隨著病情發展而逐漸嚴重，會開始出現劇烈咳嗽，咳出的痰也會呈現泡沫狀的黏液，慢性支氣管炎大多會重複發生，尤其在寒冷的冬季更易發作，然而，反復發作之急性支氣管炎若治療不當，也可能演變為慢性支氣管炎。支氣管炎若是延誤治療，可能導致嚴重的呼吸道疾病，傷害肺部甚至引起心臟衰竭，不可不慎。"
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 生物
      code: 6-1
      title: 呼吸與氣體的恆定
      chapter: 第6章 生物體的恆定
