  group_stem: "58-59 題組\n    媒體報導日本私立東京醫科大學在入學考試時竄改考生成績，將女性考生的成績扣分，並將男性考生的成績加分，以降低女性入學的比例。事件爆發後，日本社會批評該作法，且傷害了許多努力準備考試的女學生，迫使該校校長下臺負責。代理校長向社會公開道歉，並表示願意提出補救措施，也會配合檢調單位的調查。然而，許多醫師表示這不是唯一一間這麼做的學校，很多醫科學校多多少少都會這樣做，是醫科學校普遍現象。他們認為女性醫師未來可能會因為結婚生子的關係，而不會將重心放在工作上，或是會造成醫院人力短缺，因此藉由此作法以降低女性擔任醫師的可能性。"
