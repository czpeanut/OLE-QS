- id: doc_113_台南_民德_英語_g7s2e1_s5_1
  section: 5
  number: 1
  type: single
  page: 3
  stem: What is RoboCup?
  options:
  - label: A
    content: It is every four years.
  - label: B
    content: It’s a soccer game for junior and senior high.
  - label: C
    content: It can start by 2050.
  - label: D
    content: It is a soccer game with robots.
  group_stem: 'RoboCup is a soccer game in the world. It is in a different country
    every year. Many people come for their team. But there is something different—all
    the players are robots. RoboCup started in 1997. Scientists from different countries
    make teams of robots. The robots can move and pass the ball. The scientists work
    hard, and the robots get better every year In fact, the scientists think that
    the robots will beat professional human soccer players by 2050. Can they do it?
    Wait and see.

    RoboCup also has a junior league. School students like you can join it and make
    robots. The junior league is not only for soccer. Robot dance shows and robot
    rescue teams are also for junior and senior high school students. You can talk
    to your teachers to start a team. And good luck!


     country 國家 start 開始 scientist 科學家 pass 傳 better 更好 beat 擊敗 professional 職業的
    human 人類 league 聯盟 rescue 救援'
