- id: doc_113_新北_福和_自然_g7s2e2_s1_38
  section: 1
  number: 38
  type: single
  page: 4
  stem: 根據上述文章，請問下列何者為雄性個體？
  options:
  - label: A
    content: 蟋蟀（XX）
  - label: B
    content: 秀麗隱桿線蟲（XX）
  - label: C
    content: 蜜蜂（2n）
  - label: D
    content: 鳥類（ZZ）。
  group_stem: '【閱讀】請回答第38-39 題。(2-3)

    大部分動物都有雌雄兩個性別。很多時候，動物的遺傳物質決定後代的性別，但其實還有其他決定性別的方式，除了大部分哺乳動物是XX/XY 系統以外，還有下列各種方式：

    （1）ZZ/ZW 系統：鳥類和部分昆蟲，雄性的性染色體是（ZZ），雌性的性染色體是（ZW）。

    （2）XX/X0 系統：直翅目昆蟲（如蚱蜢和蟋蟀），雌性有兩條性染色體（XX），雄性只有一條性染色體（X0）。對秀麗隱桿線蟲來說，XX 則是雌雄同體，X0
    則是雄性。

    （3）套數性別決定系統 ：膜翅目昆蟲（如螞蟻、黃蜂和蜜蜂），未受精的卵子（n）會發育為雄性，受精卵（2n）則發育為雌性。

    （4）溫度-性別決定系統：在部分爬行動物中（如鱷魚、一些龜和喙頭蜥），性別受孵化溫度影響，有的種類溫度高的時候生母的，溫度低的時候生公的如斑龜，另一類則是太高溫或太低溫下生出來的是母的，介於中間的溫度生公的，如美洲短吻鱷。

    （5）對於小丑魚來說，同一群體內體型最大的雌魚為首領，其他個體較小的魚則為雄魚或不具生殖功能。當體型最大的雌魚死去，存活個體中體型最大的雄魚會轉換生殖系統變為雌魚。

    （6）海洋蠕蟲Bonellia viridis 在幼蟲時期如果接觸成年雌性個體，就會發育為雄性，反之則會發育為雌性個體。'
