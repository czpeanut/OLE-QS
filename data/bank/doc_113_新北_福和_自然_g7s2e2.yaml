- id: doc_113_新北_福和_自然_g7s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 白化症是一種體染色體隱性遺傳疾病，因為基因突變，使細胞無法將酪胺酸（一種胺基酸）轉化成黑色素，導致黑色素缺乏，因此白化症病友髮色、膚色以及眼睛顏色都較淡。某人患有白化症，而他的父母膚色都正常，下列相關敘述何者正確？（2-4）
  options:
  - label: A
    content: 他的父母膚色都正常，因此他的父母都沒有白化症等位基因
  - label: B
    content: 因為他患有白化症，因此他的父母雙方都有白化症等位基因
  - label: C
    content: 父母下一胎不會再生下有白化症的小孩
  - label: D
    content: 他的每個體細胞中只有一個白化症等位基因。
