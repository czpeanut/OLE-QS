- id: doc_113_新北_福和_自然_g7s2e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 色盲又稱色覺辨認障礙，是指能看見及辨別顏色的能力低於常人的狀況。色盲有可能造成生活和學習上的困難，例如購買水果、挑選衣物，及辨識交通號誌可能也會受到影響，這些障礙有時可以透過色彩通用設計排除。大多數患者的狀況並不嚴重，多半患者可以適應。其中紅綠色盲為X
    染色體隱性性聯遺傳疾病，也就是也就是在X 染色體上才有相關的隱性等位基因（以$X^a$表示），在Y 染色體上無此等位基因，今有一位男性的紅綠色盲患者（$X^aY$），請問下列敘述，何者正確？（2-4
    挑戰題）
  options:
  - label: A
    content: 此$X^a$ 來自於母親，所以母親一定也是紅綠色盲患者
  - label: B
    content: 此$X^a$ 來自於父親，所以父親一定也是紅綠色盲患者
  - label: C
    content: 這位男性將來生育時，此$X^a$必定會傳給其女兒
  - label: D
    content: 這位男性將來生育時，此$X^a$必定會傳給其兒子。
