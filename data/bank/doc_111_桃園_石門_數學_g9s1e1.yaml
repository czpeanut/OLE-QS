- id: doc_111_桃園_石門_數學_g9s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '以下敘述，正確的有幾個 ?

    (甲) 任意兩個等腰梯形必相似。

    (乙) 任意兩個邊數相同的正 $N$ 邊形，必相似。

    (丙) 將一個三角形縮放兩倍後，對應的角度相等，對應的邊長為原邊長的兩倍。

    (丁) 兩個任意多邊形(邊數> 4)的「對應角度相等」，或者「對應邊成比例」，則此兩個多邊形必相似。'
  options:
  - label: A
    content: '4'
  - label: B
    content: '3'
  - label: C
    content: '2'
  - label: D
    content: 1 個
