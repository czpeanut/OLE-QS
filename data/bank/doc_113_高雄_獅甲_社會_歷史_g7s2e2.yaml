  stem: 日本統治臺灣後，在各地設立 14 所國語傳習所，作為推廣日語之場所。1898 年，總督府頒布《臺灣公學校令》，將傳習所改稱公學校，明確規範就學資格、師資、修習科目等，足見總督府對臺灣教育之重視。請問：總督府在臺灣推動現代教育的目的為何？
