  group_stem: '-下列資料出自「科技部高瞻自然科學教學資源平台」。

    「將地表逕流流量隨時間變化繪製成圖，就是『水文歷線圖』，如『圖十五』所示。圖中呈現一地的都市開發前後，河川對降雨反應的變化。『a 曲線』為尚未被都市開發地區的河川，當大量雨水降落地表後，水土保持良好的土地有大量的可透水面積，能保住雨水滲入地底下，因此地表逕流流量增加的速度較慢，歷線的成長坡度平緩。『b
    曲線』則是河水漲退變化劇烈，這樣的情形通常發生在地表滲透性較差的地區，如被不透水的水泥路所覆蓋的都市。」'
