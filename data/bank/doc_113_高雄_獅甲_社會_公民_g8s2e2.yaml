  type: single
  page: 1
  stem: 美惠、佳羚、伯偉、麗玲在大學時是就讀法律系的好朋友，他們畢業後也都從事法院相關的工作。圖(二)是某天他們四人某天一大早在地方法院碰面時的對話，根據對話內容判斷，他們在民事法庭上的角色為何？
  options:
  - label: A
    content: 美惠是法官
  - label: B
    content: 佳羚是通譯
  - label: C
    content: 伯偉是律師
  - label: D
    content: 麗玲是書記官
