- id: doc_113_高雄_獅甲_社會_公民_g8s2e2_s1_42
  section: 1
  number: 42
  type: single
  page: 2
  stem: 高雄市某國中體育科導師在管教兩名起衝突的學生時，疑似情緒失控，竟持曲棍球棒將學生毆打成傷。若受傷學生的家長直接委任律師向法院提出刑事訴訟，那麼這段訴訟的流程中，最可能發生什麼事？
  options:
  - label: A
    content: 檢察官收到案件後便進行偵查
  - label: B
    content: 體育老師前往地檢署接受偵訊
  - label: C
    content: 家長的律師向法官要求判重刑
  - label: D
    content: 雙方最後在法官面前達成和解
