- id: doc_113_高雄_獅甲_社會_公民_g8s2e2_s1_44
  section: 1
  number: 44
  type: single
  page: 2
  stem: 臺中市一名人蛇集團的幹部，涉嫌以輕鬆賺取高薪的幌子，召募被害人上鉤，再將這些受騙的被害人賣到柬埔寨。甲部門掌握線索後，便指揮調查局、移民署等單位前往該名幹部窩藏的處所逮捕人犯；甲部門人員向乙機關聲請羈押人犯獲准。根據前述案情，下列敘述何者最合理？
  options:
  - label: A
    content: 甲部門是指地方法院
  - label: B
    content: 甲部門人員是指檢察官
  - label: C
    content: 乙機關是指地方檢察署
  - label: D
    content: 甲部門與乙機關皆隸屬同一個中央機關
