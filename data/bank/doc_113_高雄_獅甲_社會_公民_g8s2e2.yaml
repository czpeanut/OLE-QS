- id: doc_113_高雄_獅甲_社會_公民_g8s2e2_s1_46
  section: 1
  number: 46
  type: single
  page: 2
  stem: 玉英與芯翎某日發生口角，玉英當眾出言辱罵芯翎為「荊棘」、「狼牙棒」，芯翎打算向地檢署提告。已知公然侮辱罪屬於告訴乃論之罪，關於芯翎提起刑事訴訟的程序，下列何者最合理？
  options:
  - label: A
    content: 如果芯翎沒有提出告訴，檢察官就不會主動偵辦
  - label: B
    content: 公然侮辱罪依法只能提出自訴，芯翎無法提出告訴
  - label: C
    content: 若兩人在民事部分和解，檢察官就不需處理告訴
  - label: D
    content: 芯翎提出告訴後，芯翎亦可同時委任律師提出自訴
