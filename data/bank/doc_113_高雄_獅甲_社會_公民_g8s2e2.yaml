  section: 1
  number: 49
  type: single
  page: 2
  stem: 圖(四)是「我愛法律」官方帳號在 X 上所發布的一則貼文，貼文中的私下和解是指不經過訴訟而達成的和解。為何該帳號不建議私下和解？
  options:
  - label: A
    content: 私下和解後，將喪失聲請調解的權利
  - label: B
    content: 私下和解後，將喪失提起訴訟的權利
  - label: C
    content: 私下和解的契約內容不受法律的限制
  - label: D
    content: 私下和解的契約內容不能夠強制執行
