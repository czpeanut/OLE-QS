- id: doc_113_高雄_獅甲_社會_公民_g8s2e2_s1_39
  section: 1
  number: 39
  type: single
  page: 1
  stem: 「社會勞動制度」仿效歐美盛行已久的「社區服務」，僅限刑罰輕微的案件可以實施，如果宣告的刑罰為六個月以下的自由刑者，可聲請以此代替入監服刑，或者以此折抵罰金，也就是藉由提供一定時數的無償勞動或社區服務，包括清潔整理、淨山淨灘、社區巡守等工作，以便回饋社會。有關此項制度的說明，何者最合理？
  options:
  - label: A
    content: 可以適用在所有的違法行為
  - label: B
    content: 判處拘役者不適用此項措施
  - label: C
    content: 該措施將由檢察官監督執行
  - label: D
    content: 能落實刑罰的預防嚇阻效果
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 公民
      code: 3-2
      title: 刑罰與責任能力
      chapter: 第3章 刑法與刑罰
