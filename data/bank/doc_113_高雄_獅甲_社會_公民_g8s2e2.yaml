- id: doc_113_高雄_獅甲_社會_公民_g8s2e2_s1_40
  section: 1
  number: 40
  type: single
  page: 1
  stem: 刑事訴訟流程中的「告發」與「告訴」，雖然名稱相似，也都能啟動刑事訴訟的偵查程序，但其內涵卻大不相同。下列對這兩個概念的比較，何者正確？
  options:
  - label: A
    content: 犯罪被害人報案時，只能提出告訴，不適用告發的程序
  - label: B
    content: 任何人只要發現犯罪事實，都可以向偵查機關提出告發
  - label: C
    content: 告訴人在提出告訴後，成為刑事訴訟的原告並參與審判
  - label: D
    content: 告發人若對後續的偵查結果不服，可以請求檢察官追訴
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 公民
      code: 3-1
      title: 刑法的意義
      chapter: 第3章 刑法與刑罰
    textbook: 八下公民 3-1 刑法的意義
    labeled_by: ai
- id: doc_113_高雄_獅甲_社會_公民_g8s2e2_s1_41
  section: 1
  number: 41
  type: single
  page: 1
  stem: 新聞報導：「臺北市三名警員接獲線民情報，查緝一宗槍枝案件，沒想到兩年後竟遭該位線民反咬，聲稱當天警員同時也有發現毒品，卻『抓槍不抓毒』，將車內的毒品藏在排氣管，還私下通知線民去取走毒品，最後三名警員遭停職或調職，並遭判八個月至四年不等的徒刑。」前述新聞內容僅提及警員遭判徒刑，但實際查詢該案的判決書，三名警員還有被判處別的刑罰。新聞當中沒有提及的刑罰，最可能是下列何者？
  options:
  - label: A
    content: 勒戒
  - label: B
    content: 沒收
  - label: C
    content: 拘役
  - label: D
    content: 褫奪公權
