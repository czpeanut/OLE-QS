- id: doc_113_高雄_獅甲_社會_公民_g8s2e2_s1_37
  section: 1
  number: 37
  type: single
  page: 1
  stem: 「調解委員」類似所謂的「和事佬」、「公道伯」，他們多半熟悉地方事務，在地方上也具有一定的影響力，因此較能發揮調停糾紛的效益。關於前述角色及其提供的服務，下列敘述何者最為合理？
  options:
  - label: A
    content: 委員們會在各縣市政府提供調解的服務
  - label: B
    content: 委員接受民眾調解時，不會收取調解費
  - label: C
    content: 若調解成立，會作成調解書送交地檢署
  - label: D
    content: 若調解不成立，調解委員將會受到處罰
