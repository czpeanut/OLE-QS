- id: doc_113_高雄_獅甲_社會_公民_g8s2e2_s1_36
  section: 1
  number: 36
  type: single
  page: 1
  stem: 動畫《葬送的芙莉蓮》當中，芙莉蓮回憶以前的夥伴曾經因為對帝國國王出言不遜，差點要被國王處以極刑；後來芙莉蓮與其他同伴到了別的國家時，該國的貴族則說當地沒有「若對貴族不敬將會被處刑」的法律，因此即使芙莉蓮一行人曾經對該國的貴族做出不合禮數的事，也不會遭受處罰。這樣的情節，與下列哪一項敘述相呼應？
  options:
  - label: A
    content: 法官不能審判未經起訴的犯罪行為
  - label: B
    content: 權利的行使不得以損害他人為主要目的
  - label: C
    content: 行為的處罰，以行為時之法律有明文規定者為限
  - label: D
    content: 國家不會任意干涉私人之間的權利或義務的糾紛
