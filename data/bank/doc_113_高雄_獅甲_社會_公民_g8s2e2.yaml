- id: doc_113_高雄_獅甲_社會_公民_g8s2e2_s1_43
  section: 1
  number: 43
  type: single
  page: 2
  stem: 金門縣一名吳姓男子駕車時，疑似疲勞駕駛而偏移至對向車道，結果迎面撞上周姓女子的座車，雙方車輛嚴重損壞，且兩人都有擦傷、挫傷等情形。周女康復後自行將車修理完畢，並要求吳男賠償醫藥費與修車費，但吳男不予理會，因此周女打算對吳男提起民事訴訟。關於這樁糾紛，下列敘述何者最合理？
  options:
  - label: A
    content: 周女受損害部分皆已回復原狀，不應再提訴訟
  - label: B
    content: 周女提出訴訟之後，警方將前去逮捕吳男到案
  - label: C
    content: 依目前的訴訟規定，雙方都必須聘請律師協助
  - label: D
    content: 雙方若在訴訟當中和解，效力將等同法院判決
  tags:
