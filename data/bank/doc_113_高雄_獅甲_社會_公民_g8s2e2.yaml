- id: doc_113_高雄_獅甲_社會_公民_g8s2e2_s1_48
  section: 1
  number: 48
  type: single
  page: 2
  stem: 平秋年輕時經歷許多風浪，晚年向孫兒們講述自己年輕時犯下的許多錯事，希望孫兒們知所警惕，千萬不要學他。不過平秋年紀大了，且事隔久遠，有些情節描述已然與事實不符。下列平秋講述的這些陳年往事，哪一段情節是最合理的？
  options:
  - label: A
    content: 「我六歲時故意拿剪刀刺傷鄰居家的小孩，但我後來沒有被起訴。」
  - label: B
    content: 「十三歲時，我偷走雜貨店收銀機裡的錢。這次就乖乖去坐牢了。」
  - label: C
    content: 「十八歲時因為販毒被抓，但法官認為我還年輕，所以替我減刑。」
  - label: D
    content: 「後來四十歲時，做生意失敗欠錢，阿祖依法要負連帶賠償責任。」
  tags:
    chapter:
      publisher: 翰林
      book: 八下
