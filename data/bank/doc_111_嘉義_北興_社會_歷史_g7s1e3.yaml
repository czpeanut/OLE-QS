  stem: '唐山祖與開臺祖，都是清帝國時期臺灣移民社會的宗族組織，使漢人彼此間有共同祭祀的對象，成為互助合作的一股凝聚力。有關唐山祖與開臺祖的比較，下列何者正確？


    | 選項 | 唐山祖 | 開臺祖 |

    | :--- | :--- | :--- |

    | (A) | 盛行時間較晚 | 盛行時間較早 |

    | (B) | 根源於血緣關係 | 根源於地緣關係 |

    | (C) | 供奉原鄉神明 | 供奉共同信仰的神明 |

    | (D) | 祭祀原鄉同姓祖先 | 祭祀來臺第一代祖先 |'
  options:
  - label: A
    content: (A)
  - label: B
    content: (B)
  - label: C
    content: (C)
  - label: D
    content: (D)
