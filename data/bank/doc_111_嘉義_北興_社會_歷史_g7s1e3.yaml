- id: doc_111_嘉義_北興_社會_歷史_g7s1e3_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: '以下資料為清帝國統治時期，來臺傳教士所寫的日記。關於日記內容的敘述，下列何者正確。


    日記一：3 月12 日，天氣晴朗。今天從府城出發，走了八小時的路造訪原住民朋友，想要將福音傳播給他們，而我們人手不足，希望教會能增派人手來。但因為這裡全是高山，沒有低矮的丘陵，所以謹記派一個呼吸系統強健、沒有氣喘的兄弟來。


    日記二：5 月2 日，天氣多雲。今天試圖進入一陌生漢人聚落傳播福音，我像往常一樣，先找廟——那是人群最常聚集的地方之一。他們對我的外表品頭論足，非常感興趣，接下來，我記取上次因為直接傳播基督福音而被趕出村莊的教訓，沒有劈頭直接說明我的來意，而是先介紹自己來自發明鐵路及電報的英國。引起他們的興趣之後，再將光榮都歸於耶穌基督，果然順利多了。'
  options:
  - label: A
    content: 傳教士的主要傳教對象是原住民族而非漢人
  - label: B
    content: 比起原住民族，漢人更容易接受基督的福音
  - label: C
    content: 在臺傳教有許多困難，傳教士必須有足夠的體力與聰明的頭腦
  - label: D
    content: 到漢人聚落傳教往往要跋山涉水；到原住民族部落傳教則必須用新奇的東西吸引人群。
