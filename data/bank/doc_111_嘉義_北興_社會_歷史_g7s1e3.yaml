  group_stem: '(五) 請閱讀資料回答下列問題。


    老葉與阿淇趁春節前到臺北市迪化街採買年貨，順便參觀香火鼎盛的霞海城隍廟，廟內展示許多珍貴的歷史圖片和當年大稻埕市街圖，以及霞海城隍廟的創建過程：「……霞海城隍信仰在道光年間，隨著福建泉州府同安人渡臺，原奉祀於艋舺八甲庄同安人聚落。……後因咸豐3
    年(西元1853年)的頂郊(晉江、惠安、南安三縣移民)和下郊(同安人移民組成)因為糾紛發生械鬥事件，同安人大敗，艋舺同安人遂奉城隍遷移至荒蕪的大稻埕地區發展，初時安奉於陳浩然所經營的糕餅鋪中；

    至咸豐6 年由陳姓族人和地方善信共同發起建廟，並於三年後落成。近一百五十年來，霞海城隍廟成為大稻埕地區的信仰中心，也見證了大稻埕地區的發展。……」其實，該廟不但是迪化街的觀光重點之一，也於西元2005
    年成為臺北市的直轄市定古蹟。請問：'
