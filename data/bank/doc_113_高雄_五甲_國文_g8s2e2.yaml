    content: 文中引用陸游的詩句，除了凸顯作者享樂的悠閒，同時也稱讚自己「附庸風雅」的瀟灑
  - label: B
    content: 「『春！』這勝利的晴空彷彿在你的耳邊私語。『春！』你那快活的靈魂也彷彿在那裡回響。」句中表達了尋春人驚訝喟嘆的心情
  - label: C
    content: 「你如愛花……。你如愛鳥……。你如愛兒童……。你如愛人情……。」以「你」代替「我」，顯得親切熱情，且連用四個「你如愛」，彷彿津津樂道地向讀者介紹春日野遊之樂，這是作者在康橋所享受到的「雙輪舞」的快樂
  - label: D
    content: 「剎那間在我迷眩了的視覺中，這草田變成了……，不說也罷，說來你們也是不信的！」這是作者辭溢乎情的表現，因為心靈的感受只可意會不可言傳
