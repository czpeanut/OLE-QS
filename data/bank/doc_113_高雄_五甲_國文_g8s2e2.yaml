    content: 新一：橫式信封的寫法是收件人的資料要寫在左上角，寄件人的資料要寫在正中央，郵票則是貼在右上角
  - label: B
    content: 平次：書信中常用「抬頭」表示尊敬，分成挪抬與平抬，前者是換行頂格書寫，後者是在原行空一格書寫
  - label: C
    content: 柯南：遇到人名或其字、號，應書寫在同一行，不宜分寫成兩行；且須留意「單字不成行，單行不成頁」
  - label: D
    content: 基德：明信片的寫法與一般書信相同，因此在收件人的名字後面用「啟」，在寄件人的名字後面則用「緘」
