  section: 5
  number: 10
  type: single
  page: 1
  stem: '我是天空裡的一片雲，

    偶爾投影在你的波心——

    你不必訝異 更無須歡喜——

    在轉瞬間消滅了蹤影

    你我相逢在黑夜的海上，

    你有你的，我有我的，方向。

    你記得也好，最好你忘掉，

    在這交會時互放的光亮！」(徐志摩偶然)

    關於這首詩，下列敘述何者正確？'
  options:
  - label: A
    content: 詩中「互放的光亮」是指互相激盪的智慧火花
