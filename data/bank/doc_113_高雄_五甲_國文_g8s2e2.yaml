- id: doc_113_高雄_五甲_國文_g8s2e2_s6_3
  section: 6
  number: 3
  type: single
  page: 3
  stem: 孟子梁惠王上：「數罟不入洿池，魚鱉不可勝食也；斧斤以時入山林，材木不可勝用也。」這段文字所傳達的生態觀念，與下列何者相去最遠？【注釋 數罟：細密的網】
  options:
  - label: A
    content: 「水源為什麼不大？這裡的老獵人說：『那是因為這麼一點點的水就已足夠讓在這裡工作、狩獵的人飲用了。』這是自然定理，也是老獵人的約定。兒子，夠用就好了。」(亞榮隆·撒可努水神的指引)
  - label: B
    content: 「牠是這座山最後的山豬，也是最凶猛的。」老獵人自言自語般，繼續說下去：「勇敢、智慧與愛就是一個好獵人的全部財產。」老獵人戲謔地補充說：「何況山裡只有這一頭勇猛的山豬，你獵到了，以後泰雅的小孩要獵什麼？」(瓦歷斯·諾幹獵人)
  - label: C
    content: 飛魚季期間，嚴禁捕其他的魚，若不幸網到其他的魚時，務必放生。同樣的，飛魚季之後，如果捉到飛魚的話，你們也要放生。倘若你們族人之中不遵守這約定、規則的話，天神將處罰你們來年沒有飛魚可捕，使你們飢餓。(夏曼·藍波安飛魚神話)
  - label: D
    content: 雖然大家不再以欣賞的眼光尊敬獵人的行業，巴尚·達努依舊把獵得的山肉，分食給親友。上山前必須觀看西麗克鳥的行徑，判定吉凶。雖然不愛看電視，但只要他帶一把番刀和火柴，在森林待多久都餓不死。(瓦歷斯·諾幹來到部落的文明)
