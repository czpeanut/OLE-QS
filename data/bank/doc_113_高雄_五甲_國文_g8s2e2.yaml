  stem: 「長慶年間，劉禹錫與元稹、韋楚客等一起在白居易寓舍歡宴，席間談論南朝興廢，十分相得，於是約定各賦金陵懷古詩。劉禹錫滿引一杯後，賦成西塞山懷古詩。白居易讀後為之罷唱。全唐詩話卷三：『白居易覽詩曰：「四人探驪龍，子先獲珠，所餘鱗爪何用耶？」於是罷唱。』」關於上文的說明，何者正確？
