- id: doc_113_高雄_五甲_國文_g8s2e2_s5_16
  section: 5
  number: 16
  type: single
  page: 2
  stem: '我不喜歡一般所謂的觀光。六年前到法國旅行，在巴黎街上來回奔走尋找名勝，好像被誰逼著一站一站往前趕，突然醒悟這樣觀光庸俗又荒謬。為什麼總是要跟別人的腳步走？為什麼凡事必得一窩蜂？我不要看大家都看，「非看不可」的東西。我要看我想看喜歡看的，以自己的方式，自己的步調。我要以自己的神經自己的思維，去感知周遭這陌生的種種。我理想中的旅行是慢，是體會而不是觀光。---節選自張讓〈旅人的眼睛〉

