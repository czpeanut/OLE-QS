  section: 6
  number: 1
  type: single
  page: 3
  stem: 根據上下文判斷，文中「我家絕無書信」的意思與下列何者最接近？
  options:
  - label: A
    content: 無人可以幫忙送信回家
  - label: B
    content: 很久沒有收到家中音訊
  - label: C
    content: 斷絕了寫信回家的念頭
  - label: D
    content: 家人絕對沒有寫信給我
  group_stem: '陸機少時，頗好遊獵。在吳豪盛，客獻快犬名曰黃耳。機後仕洛，常將自隨。此犬黠慧，能解人語。又嘗借人三百里外，犬識路自還，一日至家。機羈旅京師，久無家問，因戲語犬曰：「我家絕無書信，汝能齎書馳取消息不？」犬喜搖尾作聲應之。機試為書，盛以竹筒，繫之犬頸。

    犬出驛路，疾走向吳，飢則入草噬肉取飽。每經大水，輒依渡者，弭耳掉尾向之，其人憐愛，因呼上船。纔近岸，犬即騰上，速去如飛。徑至機家，口銜筒作聲示之。機家開筒取書，看畢，犬又向人作聲，如有所求；其家作答書內筒，復繫犬頸。犬既得答，仍馳還洛。計人程五旬，而犬往還纔半月。

    【注釋】「齎」書---音ㄐㄧ，拿、持

    弭耳---貼垂雙耳

    改寫自任昉《述異記》'
