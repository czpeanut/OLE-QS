  stem: 鄭開祥《街屋臺灣》：「可能因為臺灣地狹人稠及美學素養尚待加強，每當漫步各地街頭時，常可見到色彩對比強烈、造型誇張零亂的招牌、加蓋鐵皮屋貼了塑膠浪板補丁、雜亂的電線與違建充斥等紛雜的街景。這樣的畫面的確讓人覺得零亂，___________。我不想畫新穎的大樓或雄偉的豪宅，卻對一般人以為『醜』的建築感到醉心。」根據文意脈絡，句中畫線缺空處填入下列何者最恰當？
