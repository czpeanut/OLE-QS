  page: 4
  stem: 康有為在其遊記中寫著：「七月八日晚七時，汽車自挪威行，九日晨抵瑞典京士多貢。始以為瑞、挪同，國小民貧，必不足觀。驗行李訖，甫出汽車場，流觀道路之廣潔，仰視樓閣之崇麗，周遭邂逅士女之昌豐妙麗，與挪威幾有仙鬼之判。豈止挪威不及，乃可稱為冠冕歐洲，雖英、法亦遠遜焉。」根據這段文字，下列有關康有為遊歐的敘述何者正確？(士多貢：瑞典首都，今譯為斯德哥爾摩)
