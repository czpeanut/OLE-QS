  stem: 「北朝民歌，產生於黃河流域，有的反映戰爭和北方人民的尚武精神，有的反映人民的疾苦，有的反映婚姻愛情生活，有的描寫北方特有的風光景色。整體而言，詩歌內容豐富，語言質樸，風格豪放。」根據上文所描述的北朝民歌特色，下列何者為北朝民歌？
  options:
  - label: A
    content: 月落天欲曙，能得幾時眠。淒淒下床去，儂病不能言。
  - label: B
    content: 敕勒川，陰山下。天似穹廬，籠蓋四野。天蒼蒼，野茫茫，風吹草低見牛羊。
  - label: C
