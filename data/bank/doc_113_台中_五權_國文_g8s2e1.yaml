- id: doc_113_台中_五權_國文_g8s2e1_s2_36
  section: 2
  number: 36
  type: single
  page: 4
  stem: 依據文意，□□中應填入的節日是？
  options:
  - label: A
    content: 上元
  - label: B
    content: 中元
  - label: C
    content: 中秋
  - label: D
    content: 清明
  group_stem: "(二)\n    我十三歲那年□□節前夕，父親騎摩托車從羅東回家，暗夜途中被一輛大卡車撞倒、拖行。那是我生命也是全家命運陷入黑暗的轉捩點，它真的發生了。天地間沒有魔法能倒溯時間阻止那場剎那間發生的車禍，也沒有人能回答為什麼兩個身強力壯的男子相撞，致命的是我們的爸爸，而非另幾個孩子的父親。總之，深夜，遭醫院拒絕被抬回家的父親躺在客廳臨時鋪設的門板上等著斷氣，他一直掙扎、呻吟，忽強忽弱，血流全身。那是我第一次毫無準備地目睹死亡，正確地說應該是，近六個小時目睹自己父親那極緩慢、極痛苦、絕不甘心的死亡過程。我唯一為他做的是，捧一盆水用毛巾擦拭他身上的汙血及之後噴吐而出的腦漿——我不記得是誰叫我做的，擦不止的血水後來成為我長期的暗夜惡夢。□□節清晨，他走了。\n\
    \    幾日後，道士帶我們到事故現場招魂，農曆七月大太陽下，我戴著「頭白」（1）跪在路邊草叢，看到草地上散著紅通乾癟的小卷，我忽然明白那是父親車禍的見證者，當時從他的竹編魚籃飛出來的。腥臭的小卷刺激我的感官，使連日以來麻木呆滯的我忽然想吞食那些臭小卷說不定就從這場惡夢醒來，幾乎只要意念再往前一小步我就會伸手，幸好還有最後一絲理智綁住我，這意謂著，我知道這惡夢是真實的。\n\
    \    從此，小卷從我的食物單消失。\n（1）頭白：喪禮時頭綁的白巾，為一種喪禮服制。\n節錄自簡媜《吃朋友．第七宴》"
  tags:
    textbook: 第四冊（八下）第1次段考範圍
    labeled_by: ai
