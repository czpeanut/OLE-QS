  stem: 某學者在演講時提到：根據統計推估，全臺有約3 萬2 千名未成年人曾遭私密影像外流，其中四成六外流的影像是由兒少自身拍攝所產生，近七成的兒少是在被誘騙、要脅的狀況下，自拍照片後傳給加害人。2023
    年，更爆出知名藝人向非法網站購買未成年性影像，引發社會譁然，紛紛要求立委補破網。立法院遂於2024 年7 月12 日三讀修正通過《兒童及少年性剝削防制條例》部分條文，將「重製」（即下載）、「持有」、「支付對價」兒少性影像，納入性剝削行為樣態，嚴懲持有兒少性影像者，處1
    年以上、7 年以下有期徒刑。根據上述，學者在接下來的演講內容應不會提到下列何者？
  options:
  - label: A
    content: 持有兒少性影像要依《兒童及少年福利與權益保障法》懲處
  - label: B
    content: 引誘兒少自拍私密照或性影像皆是犯罪行為
  - label: C
    content: 持有或購買兒少性影像要負刑事責任
  - label: D
    content: 兒少要具備法治觀念，懂得保護自己，也不成為散布性影像的幫兇。
