  page: 1
  stem: '下列是四位同學正在討論關於「救濟途徑」的對話，哪些人的觀念正確？

    甲：刑事案件若是由被害人委任律師所提起的訴訟，稱為自訴。

    乙：人民只要不服行政機關的處分，一律直接到法院提出行政訴訟。

    丙：對於不當的行政處分，人民可以向立法機關提起訴願。

    丁：當私人間發生權利義務糾紛時，人民可提起民事訴訟。'
