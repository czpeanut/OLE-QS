- id: doc_113_基隆_銘傳_國文_g7s2e1_s3_5
  section: 3
  number: 5
  type: single
  page: 1
  stem: '《說文解字》：「指事者，視而可識，察而見意」，又言：「會意者，比類合宜，以見指撝。」以下關於指事與會意的說明，何者錯誤？


    | | 指事 | 會意 |

    | :--- | :---: | :---: |

    | (A) 文字 | 屬於「文」 | 屬於「字」 |

    | (B) 定義 | 用簡單的符號表示某概念 | 由兩個或以上的文字組成，藉以表達此字的意思 |

    | (C) 比較 | 與「象形」相比，多為具體事物 | 與「形聲」相比，多無聲音關係 |

    | (D) 舉例 | [圖] 本，木下日本 | [圖] 闢，馬出門貌 |'
  options:
  - label: A
    content: 文字：指事屬於「文」，會意屬於「字」
  - label: B
    content: 定義：指事用簡單的符號表示某概念，會意由兩個或以上的文字組成，藉以表達此字的意思
  - label: C
    content: 比較：指事與「象形」相比，多為具體事物，會意與「形聲」相比，多無聲音關係
  - label: D
    content: 舉例：指事如本（木下日本），會意如闢（馬出門貌）
