- id: doc_113_基隆_銘傳_國文_g7s2e1_s6_25
  section: 6
  number: 25
  type: single
  page: 4
  stem: 根據本文，為何包給長輩的紅包要逐年增加？
  options:
  - label: A
    content: 有替長輩增福添壽的意涵
  - label: B
    content: 長輩對晚輩的祝福與期許
  - label: C
    content: 晚輩對長輩最基本的尊重
  - label: D
    content: 有「壓歲錢」的涵義存在。
  group_stem: '（一）、

    　　每到過年，總需要發紅包給長輩或晚輩討個吉利。然紅包到底該包多少？又有哪些習俗及禁忌呢？

    ●　過年紅包習俗

    　　長輩給晚輩的紅包稱為「壓歲錢」，有期望與祝福的含義在。過年紅包常見的金額通常為200、600、800結尾，只因傳統認為雙數才吉利。同時，新年新氣象，包新鈔也象徵有新的開始。

    ●　包給長輩的紅包

    　　晚輩包給長輩的則稱「添歲錢」。主要是祝福長輩能夠長命百歲。而包給長輩的金額但切記要遵守一個原則：紅包的金額要一年比一年多，有祝願長輩的福氣越來越多之意。

    ●　包給父母、長輩的紅包金額

    一、多數人的包給父母金額，大概落於6,000到10,000元不等，也有不少人會選擇6,600元或8,000元等帶有喜氣的數字。剛出社會的新鮮人或小資族可以包3,600表示心意。

    二、祖父母或外公外婆則會選擇包3,600元到6,600元的金額。

    ●　包給自己小孩的紅包金額

    家中若有兩個以上年紀不同的孩子，可選擇包一樣的金額，但也可選擇依照年紀包不同的金額。

    一、國小、國小以下：800元—1200元

    二、國、高中：1,200元—2,600元

    三、大學：2,600元——3,600元

    ●　包給親友小孩的紅包金額

    親戚晚輩通常包600元、800元討個吉利。若是鄰居、朋友小孩或剛出生的嬰兒會選擇包200元、600元讓孩子沾沾喜氣，熟悉的親友金額可能往上增加。

    ●　過年紅包禁忌

    一、須使用新的紅包袋不能使用去年或用過的。

    二、紅包不可以包單數（100、300、500、1000），有「孤單」之意，只有喪禮才會包單數。

    三、因諧音緣故，要避開帶有「4」的金額。

    四、不要給空紅包袋，此為詛咒對方空空如也。

    五、紅包裡的錢不能對折，有錢財受阻之意。


    ——改寫並節選自《天下雜誌‧2023紅包行情過年紅包包多少？8大習俗禁忌一次看》'
