  stem: 根據上述內容推測，人口呈現負成長的主要可能原因是甚麼？
  options:
  - label: A
    content: 出生人數減少
  - label: B
    content: 死亡人數攀升
  - label: C
    content: 移出人數增加
  - label: D
    content: 移入人數減少。
  group_stem: '※請閱讀下文，回答16～17 題：

    根據內政部統計，台灣總人口已經連續13 個月負成長。2025 年1 月的出生人數為9,495 人，較去年12 月減少3001人，這也是繼去年2 月後，單月出生數再度跌破萬人；而死亡人數達15,018
    人，較去年12 月減少2427 人。1 月遷入的人口數為70,495 人，較去年12 月減少1 萬6025 人；移出的人口數為69,143 人，較去年12
    月減少1 萬5003 人。此外，台灣的老年人口（65 歲以上）已接近總人口的20%，即將進入「超高齡社會」。

    由於人口結構的變化所帶來的各種問題，政府亟須採取行動，因為這些挑戰不僅影響經濟發展，也會對社會福利、醫療資源以及退休制度帶來壓力，因應這些人口議題，政府更應該積極推動相關政策的發展，以確保社會穩定與國家長遠發展。'
