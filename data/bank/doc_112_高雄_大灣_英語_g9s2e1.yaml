  group_stem: 'Fake news is something that is not true. It is usually shown as real
    news on the Internet and used to hurt the reputation of a person or a country.
    Though fake news has existed for thousands of years, it is still difficult for
    most modern people to tell whether news is fake or not. For example, when some
    countries were fighting the pandemic, a lot of fake news said there was not enough
    rice on the market because farmers in some rice-growing countries could only stay
    home all day long. Some totalitarian countries sent the fake news with several
    pictures to worry people who live in free countries and made them not believe
    in their own countries. Free countries made it clear that it was fake news right
    away, but it was still not useful because millions of people read it on the Internet.
    Many countries try to catch those who make fake news, but the best way to fight
    fake news is to teach people to spot fake news. First, we have to check the writer
    and the date. Check if the writer is real, and remember old news is not always
    relevant to what you see now. Second, don’t let your bias make you believe the
    fake news, which means you need to think twice after reading any stories on the
    Internet. Third, ask people who have knowledge about what you are not sure of.
    Taking these actions may not make fake news die, but more people will be able
    to fight fake news successfully.

