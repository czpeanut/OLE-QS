- id: doc_113_台中_大業_國文_g9s2e1_s2_46
  section: 2
  number: 46
  type: single
  page: 5
  stem: 作者認為世界上最富有的人是誰？
  options:
  - label: A
    content: 隨時在微笑的人
  - label: B
    content: 生活富足的人
  - label: C
    content: 身體健康的人
  - label: D
    content: 人際關係良好的人
  group_stem: '隨時在微笑的人們，是世界上最富有的人。他們不必在擁有任何東西後，才「決定」要快樂。

    最廉價的愉悅，像每個氧分子一樣活躍在空氣中。像我這樣一個「積重難返」的現代人，想要不自欺欺人地放下一切、反璞歸真是很困難的。但是他們的微笑總在提醒我：回來啊！回到生活的本質，不要只把眼睛放在世事的表殼上。

    難免「心事纏繞」的時刻，我總想到他們的微笑。這時，我也忍不住拉開兩頰的肌肉，送給自己一個微笑。從此，憂愁很難停留太久。

    你說吧，世上最值得珍藏的寶石，可比得上夕陽餘光中在沙灘上流金閃爍的海水一滴？再美的雕塑真品，可有我們在原野奔跑後，脈搏如彈奏音樂般地怦然跳躍與肌膚彷若渴愛般的呼吸？

    最貴重的愉悅，最容易取得。只是常常被忘記。

    吳淡如〈廉價的愉悅〉'
