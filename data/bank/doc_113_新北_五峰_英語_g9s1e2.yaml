  section: 3
  number: 34
  type: single
  page: 3
  stem: According to the reading, what did pink NOT express?
  options:
  - label: A
    content: People’s support for the blind.
  - label: B
    content: The power of women leaders.
  - label: C
    content: Some people’s pride.
  - label: D
    content: The true color of rock.
  group_stem: "(34-35) PINK\nThe Meaning Behind Pink\n    How do you feel about the\
    \ color of pink? Is it just for girls and women? Or, can it also be for boys or\
    \ men? Also, what does pink express about someone or something when you see it.\n\
    \    People see pink in different ways. In 19th-century England, men wore red\
    \ uniforms because the color showed power. So, boys wore pink because boys were\
    \ little men and pink was a pale red.\n    Then, in the mid-1940s, pink started\
    \ to become a color for girls and women. The color was soft and made them look\
    \ cute and pretty. Big department stores in the US promoted that idea. Famous\
    \ women like actress Marilyn Monroe helped spread it, too. Soon, girls everywhere\
    \ were wearing pink.\n    The meaning of pink kept changing. In the 1970s and\
    \ 80s, pink became the favorite color of punk bands like The Clash. For them,\
    \ pink was the true color of rock. At the same time, pink became a symbol of pride\
    \ for other people.\n    For many people, pink expressed the value of women. They\
    \ were good and took care of others. Because of that, people started to wear pink\
    \ to show their support for women with breast cancer.\n    In the early 21st century,\
    \ women leaders wore pink to show their power in a quiet way. Besides, women of\
