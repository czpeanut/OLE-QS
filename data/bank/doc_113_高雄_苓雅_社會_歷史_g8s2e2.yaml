- id: doc_113_高雄_苓雅_社會_歷史_g8s2e2_s1_25
  section: 1
  number: 25
  type: single
  page: 1
  stem: 國民政府於民國17 年完成北伐後，象徵著中國從過往的軍政時期走向訓政的階段，也代表著告別過往軍閥亂政的現象，開啟建設國家的新局面。下列關於「訓政」時期的敘述，何者正確？
  options:
  - label: A
    content: 訓政時期以《中華民國訓政時期約法》作為法源依據
  - label: B
    content: 「訓政」為蔣中正建國理念的最終階段時期
  - label: C
    content: 訓政階段初期，國民政府致力於與中國共產黨合作，一齊為國家所努力
  - label: D
    content: 訓政時期國民政府開放多元政黨參與國家統治的討論，共同規畫國家的未來。
