  stem: 西元1949 年10 月1 日為中華人民共和國建立的日子，這一天也成為該國的建國紀念日。中華人民共和國建國後，曾推行一連串的政策，以符合其「共產主義」的理念。請問：下列的敘述當中，哪一個是中共建國初期沒有推行過的政策？
