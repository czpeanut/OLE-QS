- id: doc_113_高雄_左營_數學_g7s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '下列直角坐標的敘述，請問正確的有幾個？

    ①坐標平面上，如果數對 $(m,n)$ 表示 $P$ 點的位置，則 $m$ 稱為 $P$ 點的 $x$ 坐標或橫坐標，$n$ 稱為 $P$ 點的 $y$ 坐標或縱坐標。

    ②在坐標平面上有一點 $A(a,b)$，則 $A$ 點到 $x$ 軸的距離是 $|a|$、$A$ 點到 $y$ 軸的距離是 $|b|$。

    ③ $x$ 軸上任意一點的坐標可用 $(0,a)$ 的形式來表示；$y$ 軸上任意一點的坐標可用 $(b,0)$ 的形式來表示。

    ④坐標平面上兩點 $P(3,-6)$、$Q(-2,-6)$，則 $P$、$Q$ 兩點的距離$=5$ 。'
  options:
  - label: A
    content: '1'
  - label: B
    content: '2'
  - label: C
    content: '3'
  - label: D
    content: 4 個
  tags:
