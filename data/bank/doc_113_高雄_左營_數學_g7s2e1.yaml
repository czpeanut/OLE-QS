  section: 1
  number: 8
  type: single
  page: 2
  stem: '姐姐跟小翊說：「5 年前，我的年齡是你的年齡的 2 倍；而 3 年後，我的年齡的 2 倍比你的年齡的 3 倍少 2 歲」。

    請問小翊今年幾歲？

    假設小翊今年 $x$ 歲，姐姐今年 $y$ 歲，則下列哪一個二元一次聯立方程式可以用來表示上面題目中的數量關係？'
  options:
  - label: A
    content: $\begin{cases} y-5=2(x-5) \\ 2y=3x-2 \end{cases}$
  - label: B
    content: $\begin{cases} y=2x \\ 2y=3x-2 \end{cases}$
  - label: C
    content: $\begin{cases} y=2x \\ 2(y+3)=3(x+3)-2 \end{cases}$
  - label: D
    content: $\begin{cases} y-5=2(x-5) \\ 2(y+3)=3(x+3)-2 \end{cases}$
