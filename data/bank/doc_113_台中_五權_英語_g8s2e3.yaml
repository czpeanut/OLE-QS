  - label: C
    content: The AI robots are coming.
  - label: D
    content: AI robots are dangerous.
  group_stem: "(題組38.~40.)  \nA lot of people want AI robots to help us with our work.\
    \ It's happening, but it may be more of a bad dream. We hope AI robots can do\
    \ our work, so we can have more playtime. But when an AI robot gets a job, someone\
    \ might lose his or her job and has to find a new one quickly. People say that\
    \ AI robots can do more and more jobs soon. By 2030, AI robots can do 45% of jobs\
    \ in the USA. This means AI robots could do lots of different jobs. For example,\
    \ they may soon be working as nurses, teachers, clerks, cleaners, and even writers.\
    \ Computers already write some news. You may find some on the Internet.\nWhen\
    \ we get used to AI robots’ help, we may ask “ What does it mean for jobs and\
    \ people's lives?” AI robots’ help might sound good, but it brings bad things,\
    \ too. For example, we will need to pay more to take care of someone if AI robots\
    \ take his or her job in the future. After all, we all want to live happily with\
    \ AI robots.       \n                       (get used to 習慣於 after all 畢竟 effect\
    \ 影響)"
  tags:
    textbook: 第四冊（八下）第3次段考範圍
