- id: doc_113_台中_五權_英語_g8s2e3_s1_26
  section: 1
  number: 26
  type: single
  page: 2
  stem: What is the main idea of the reading?
  options:
  - label: A
    content: Watching TV helps students take a break.
  - label: B
    content: Freedom means doing good things.
  - label: C
    content: Self-discipline helps people live a better life.
  - label: D
    content: Playing games brings good results.
  group_stem: '(題組26-29)

    Discipline Brings Freedom

    Many people think freedom means doing anything at any time. They watch TV, play
    games, or go out with friends before finishing their work. This kind of life may
    feel fun at first. Later, it brings worries and bad results. For example, a student
    plays video games for hours and studies for a short time. On the test day, the
    student feels worried and does not do well.

    A student with self-discipline finishes homework first. Then the student can take
    a break. This student feels ready for tests and enjoys playtime without worry.
    Self-discipline also helps in other parts of life. A runner practices every morning
    and gets faster. A person saves money each month and buys things with care. These
    people work hard and enjoy the results.

    Self-discipline is not always fun or easy. People need to say no to some things.
    They also need to keep good habits every day. But over time, their lives get better.
    They feel happy and free. They can do more because they finish important things
    first.

    (self-discipline 自律  discipline 紀律  freedom 自由)'
  tags:
    textbook: 第四冊（八下）第3次段考範圍
    labeled_by: ai
