    The Ugly Truth Behind Beautiful Clothes

    Are you a fan of fast fashion? 43. Thanks to fast fashion, people now can buy
    new clothes with nice designs at a low price. However, the truth behind those
    beautiful clothes can be really ugly.

    To keep the prices low but still make money, fast fashion companies will do anything.
    44. Those workers work long hours for very low pay. In some countries, a worker
    makes only about 2.5 NT dollars for an hour’s work. What''s more, most companies
    use polyester to make clothes because it is cheap. However, the polyester comes
    off the clothes little by little when you wash them. 45.

    By hiring cheap workers and using polyester, those fast fashion companies can
    make clothes at a low cost in a short time. 46. Next time, when you want to buy
    clothes from these companies, stop for a second and think about the cost to the
    environment and poor workers. Maybe you don’t need to buy them at all.

     polyester 聚酯纖維；尼龍 hire 雇用


