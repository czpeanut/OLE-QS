    Hello! I’m J-10, Nick’s old smartphone. I have some friends here with me at Nick’s
    house. Let me tell you more about our story.

    First is the camera. 1.它是房子裡最老舊的機器，而且它不再運作了。 2.它曾經(...used to...)幫 Nick 的爸爸拍攝很多照片。
    Every photo has a story to tell, and every story is a sweet memory.

    Next is the computer. It helped Nick’s dad save many large files. 3.在他中學的時候，它對他來說是很有用的。

    And then it’s an MP3 player. 4. Nick 的爸爸用它來聽音樂和錄音。 Sadly, they don’t work anymore,
    either.

    The newest machine in the house is smartphone J-15. It is Nick’s new smartphone.
    5. 它取代了我的位置因為我沒有足夠的空間存放新軟體。 It is also the busiest machine in the house. Nick
    uses it to take photos, surf the Internet, and play games. Look at it—the poor
    thing works all day with no rest! It really needs to take a break!'
