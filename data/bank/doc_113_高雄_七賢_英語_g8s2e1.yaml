  group_stem: 'Festivals in Thailand

    Each year, Thailand celebrates the Thai New Year through the world’s biggest water
    fight, Songkran. This water splashing festival takes place from the 13th to the
    15th of April every year. Its purpose is to wash all of the bad luck away and
    give everyone a fresh start for the New Year. People in other countries also celebrate
    Songkran, such as Myanmar, Laos, and Vietnam.

    Thailand also has two very popular lantern festivals: Loy Krathong and Yi Peng.
    People celebrate them on the day of the full moon in November. For example, in
    2022, Loy Krathong was on November 9th across Thailand, while Yi Peng, the north
    part of Thailand, especially in the big city, Chiang Mai, was from November 8th
    to 9th. The main difference between them is the type of lanterns. During Loy Krathong,
    people can see lanterns with candles and flowers floating on a river. And during
    Yi Peng, paper lanterns are flying in the evening sky. It is a festival very similar
    to Taiwan’s Lantern Festival.

     splash 灑 purpose 目的 lantern 燈籠 main 主要的 difference 區別 float 漂浮 similar 相似的'
