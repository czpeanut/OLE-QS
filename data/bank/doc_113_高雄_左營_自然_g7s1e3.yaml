    \ 年3 月15 日過世，享壽76 歲。漸凍人症是一種與肌肉連接的神經元退化、喪失的疾病，會逐漸造成全身肌肉萎縮、無力。通常初期會從身體某一部位開始，如手、腳、口咽，但患者意識清醒，智力思想不受影響。\n\
    \    漸凍人症目前無藥可治癒，只能用藥延緩病程惡化速度。漸凍病友能不能維持生命的關鍵是口咽吞嚥功能不好、呼吸動作缺乏肌肉帶動，導致營養匱乏、缺氧、全身器官損害、肺炎。\n\
    \    從台灣統計資料發現，漸凍人從確診到死亡品質，就算功能喪失，病人的生命仍相對能延長。\n請根據上文回答第47-48 題："
