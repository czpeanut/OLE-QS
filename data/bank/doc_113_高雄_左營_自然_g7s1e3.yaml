  group_stem: '西元2018 年資深藝人孫越因慢性阻塞性肺病急性發作，送進加護病房插管治療，後來併發多重器官衰竭，病逝於臺大醫院。「慢性阻塞性肺病」英文縮寫為
    COPD，根據世界衛生組織在 西元2017 年的統計，全球每年約 300 萬人死於 COPD，是導致人類死亡的第四大病症。

    吸菸是導致慢性阻塞性肺病的主要原因，其他次要的因素還包括空氣汙染、二手菸和遺傳 等。長期暴露在空氣品質不佳的環境下，會使肺部出現發炎反應，例如「慢性支氣管炎」，症狀為支氣管腫大而通道變窄，同時因空氣中的顆粒刺激腺體細胞產生痰液，阻礙了空氣的進出，導致病人常出現呼吸困難或咳嗽等症狀。另外，也可能發生「肺氣腫」，症狀為肺的彈性與伸縮
    功能被破壞，其中的肺泡容積變大、氣體交換表面積減少，使氣體容易進入、不容易出肺泡，導致病人會有呼吸急促或氣喘的現象。

