  stem: 右圖（【圖一】）是日治臺灣時期臺灣最高領導人上班的廳室建築，該建築完工於1919 年，是仿「後期文藝復興式」的歐洲風格建築。關於該建築的人與事，何者敘述正確？
  options:
  - label: A
    content: 完工於「無方針主義時期」，當時因鎮壓抗日採武官總統制
  - label: B
    content: 該建築沿用清時巡撫官府增建而成，建於臺南府城
  - label: C
    content: 日治時臺灣最高長官為臺灣總督，擁行政、立法、軍事大權
  - label: D
    content: 該建築曾在一戰期間遭到美軍轟炸毀損。
