- id: doc_113_新北_福和_社會_歷史_g7s2e1_s2_31
  section: 2
  number: 31
  type: single
  page: 2
  stem: 請問，前述一波波糾結相連的抗日行動，在臺灣日治時期的歷史上有何定位？
  options:
  - label: A
    content: 事件之後，漢人覺得武裝抗日機會渺茫，改以非武裝政治社會運動爭取權益
  - label: B
    content: 該事件呼應世界民族自決的浪潮而起，引發國際伸援
  - label: C
    content: 甲仙志士與玉井抗日勢力的領袖莫那魯道聯合，事件後日方對山區改採較溫和與安撫的政策
  - label: D
    content: 事件後，殖民者實施「五年理蕃計畫」，加重原住民區域的管理。
  group_stem: '題組（一）：閱讀文章，並請完成31～32 題

    高雄甲仙平埔族人曾於1915 年群起抗日，後遭阿里關派出所、甲仙埔支廳、十張犁派出所聯合壓制，甲仙志士後來逃竄至臺南玉井（噍吧哖）山區，與當地的抗日勢力結合，燃起日治時期牽涉人數最多的武裝抗日事件。此事件連帶使臺南玉井、楠西、南化、左鎮及周邊地區村莊遭日軍毀滅式屠村與滅村，是抗日事件中牽連極廣、死亡人數最多的一次。事件之後，執政者豎立「紀念殉難警察官之碑」表揚遇害警察，同時也定位甲仙平埔族人為土匪後代，這些族人後裔因為背負土匪後代的污名，人們都刻意與這些族人保持距離。

    ※改寫自2017 年12 月25 日 《聯合報》對罹難後裔的採訪報導'
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 歷史
      code: 1-2
      title: 日本治臺政策的演變
