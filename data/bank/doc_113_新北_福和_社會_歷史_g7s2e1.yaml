  section: 1
  number: 27
  type: single
  page: 1
  stem: 日治臺灣時期，民間有所謂「第一憨，種甘蔗予會社磅；第二憨，食薰歕風；第三憨......」的俗諺（註：「會社」即指日文「会社（かいしゃ」,kaisha）」，中文意思是「公司」；「食薰」是指抽煙（香菸、鴉片煙等），「歕風（pûn
    hong）」指嘴噴煙。）請問，為何「種甘蔗送到糖業公司秤重」是讓人覺得荒謬愚蠢？
  options:
  - label: A
    content: 種甘蔗與「工業臺灣，農業南洋」的殖民政策不符，不受到政府獎賞，收入不多
  - label: B
    content: 糖業公司指定區域收購，收購價低，蔗農被迫委屈賣出
  - label: C
    content: 聰明的蔗農選擇甘蔗賣給洋商出口，利潤比賣給日本會社划算得多
  - label: D
    content: 聰明的蔗農使用糖業鐵路運輸甘蔗，笨的蔗農用牛車運。
  tags:
    chapter:
