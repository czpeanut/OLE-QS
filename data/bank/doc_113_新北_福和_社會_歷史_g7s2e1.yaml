- id: doc_113_新北_福和_社會_歷史_g7s2e1_s1_18
  section: 1
  number: 18
  type: single
  page: 1
  stem: 外籍記者報導：「3 月，日軍登陸淡水，日軍放行搭船離開臺灣的民眾，民眾從淡水發散逃難，隨即傳來澎湖戰敗而被佔領的消息。5 月23 日臺灣民主國成立，但臺北的日常無大波動。有些分不清是清朝士兵還是臺灣民主國的軍人，帶著雨傘、鍋盆、包袱群聚在各區，不久傳來日軍進入基隆的消息。然後，6
    月6 日臺北城陷入無政府狀態的混亂，總統府內已無總統，打劫、放火頻傳，外籍人士夥同商人辜顯榮協助日軍入城以安定城民......。」關於這段史事，其過程的描述，何者正確？
  options:
  - label: A
    content: 該報導的澎湖之役是指甲午戰爭
  - label: B
    content: 報導內各事件的年份是1895 年，時值乙未年
  - label: C
    content: 原應在總統府坐鎮的總統是丘逢甲
  - label: D
    content: 日軍先從臺灣南方接收臺灣，劉永福率先離台。
