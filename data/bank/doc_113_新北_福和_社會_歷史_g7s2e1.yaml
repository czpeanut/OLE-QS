  stem: 藝術電影院舉行重拍版本電影兩片聯映，小春拿到免費優待票，看完沈悶第一片電影昏沉入睡，再醒時，第二片播映的分鏡片頭浮出由小漸大的標題字接替寫出：「這不是傳說，是真實的歷史。」、「1930年，一段悲壯的史詩」、「臺灣山林部族的吶喊與復仇」、「來自荒野的尊嚴，對抗文明的傲慢」，請問，該片應是哪個題材的電影？
