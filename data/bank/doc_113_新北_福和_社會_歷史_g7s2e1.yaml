  stem: 利和國中732 班同學搭區間車遊南臺灣，火車過嘉義後因逢平原路段，車速飛快，大家在臺南隆田火車站下車。該站宜欣賞1902 年完工的縱貫線鐵路小站建築，也可踏勘多線糖鐵匯集的遺跡。同學驚奇發現「臺灣好行」的公共巴士可到烏山頭水庫。學霸說：「我們到烏山頭水庫找一個水利工程師的銅像！」有人問：「是誰？」學霸笑而不語。請你來答：
