  stem: 1923 年以臺灣人為觀點的《臺灣民報》曾是讀者眾多的漢文報紙，但後來為了因應中日戰爭局勢，《臺灣民報》被迫改名為《臺灣新民報》，政府言論控制增加，但仍保留部分漢文。後來該報再被迫與其他報紙合併為《臺灣新報》，這時，《臺灣新報》已算是全日文報紙了。請問，報紙轉向全日本版，是在哪個時期？
  options:
  - label: A
    content: 武裝抗日時期
  - label: B
    content: 無方針主義時期
  - label: C
    content: 內地延長主義時期
  - label: D
    content: 皇民化運動時期。
