- id: doc_113_新北_蘆洲_自然_g8s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 當物質發生化學反應時，會產生新物質，並產生下列四個常見的現象：產生氣體、產生沉澱、顏色變化、產生光和熱。下列四個選項中，針對四個常見的化學反應現象舉例，請問哪一個例子錯誤？
  options:
  - label: A
    content: 產生氣體：乾冰昇華產生二氧化碳
  - label: B
    content: 產生沉澱：澄清石灰水中通入二氧化碳
  - label: C
    content: 顏色變化：無水硫酸銅加水產生藍色水溶液
  - label: D
    content: 產生光和熱：蠟燭燃燒。
