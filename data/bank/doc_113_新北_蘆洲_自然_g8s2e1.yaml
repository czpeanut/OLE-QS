  group_stem: '請閱讀以下文章，回答以下問題：


    信口雌黃的由來

    雌黃（$As_{2}S_{3}$）為橙黃色礦物，在古代時候常做顏料或塗改文字，因為古代所使用的紙張中會加入防蟲的成分，使紙張的色澤偏黃，因此採用成黃色的雌黃塗改，「口中雌黃」是指有如口中含著雌黃，能隨時改正錯誤或不通順的字句，後來演變為「信口雌黃」，比喻不顧事實真相隨口亂說或妄加批評。

    雄黃（$As_{2}S_{2}$）為橙紅色的礦物，常與雌黃共生，常研磨成粉末撒在房屋周圍驅蟲。在端午節時也會引用雄黃製作的雄黃酒辟邪除蟲，但因雄黃具有毒性，且加熱氧化後會形成劇毒的砒霜（$As_{2}O_{3}$），故飲用雄黃酒的習俗已漸漸消失。'
