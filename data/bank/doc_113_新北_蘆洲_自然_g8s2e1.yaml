- id: doc_113_新北_蘆洲_自然_g8s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 根據以上的實驗，則下列化學式何者錯誤？
  options:
  - label: A
    content: 氯化鈣：$CaCL_{2}$
  - label: B
    content: 碳酸鈉:$Na_{2}CO_{3}$
  - label: C
    content: 雙氧水：$H_{2}O_{2}$
  - label: D
    content: 鹽酸：$HCl$。
  group_stem: '【實驗題組，第 3~9 題】

    實驗室準備空的錐形瓶和試管及軟木塞，秤得三者總質量為500 公克。同學們將依實驗裝置，如圖所示，在試管內裝甲溶液，錐形瓶內裝乙粉末或溶液。

    步驟一：將瓶口用軟木塞拴緊，如圖（一）使溶液不會漏出，秤其質量為 $a_1$。

    步驟二：將錐形瓶倒轉使兩種物質充分混合，如圖（二）所示，秤其質量為 $a_2$。

    步驟三：將軟木塞旋出鬆開一些些開口，但仍在錐形瓶上，稱其質量為 $a_3$。


    分別依照表格內需要的物質放入器材內開始操作實驗並且記錄及觀察結果

    | 組別 | 第一組 | 第二組 | 第三組 |

    | --- | --- | --- | --- |

    | 甲 | 碳酸鈉溶液 | 30 ml（36g）鹽酸 | 雙氧水 |

    | 乙 | 氯化鈣溶液 | 20g 大理石（碳酸鈣） | 二氧化錳粉末 |'
