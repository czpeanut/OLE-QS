- id: doc_113_新北_蘆洲_自然_g8s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 右圖為許多食品或藥品包裝內常見的脫氧劑，主要成分為鐵粉，可以延長食品或藥品的保存期限。關於脫氧劑的敘述，下列何者錯誤？
  options:
  - label: A
    content: 脫氧劑中的鐵粉會與包裝內的氧氣反應，降低氧氣濃度，防止食品因氧化變質
  - label: B
    content: 鐵粉會與包裝內的氧氣反應時會產生熱
  - label: C
    content: 脫氧劑的作用原理屬於氧化還原反應
  - label: D
    content: 脫氧劑吸收氧氣後仍可重複使用，持續保持食品新鮮
