- id: doc_113_高雄_左營_社會_g8s2e3_s6_48
  section: 6
  number: 48
  type: single
  page: 7
  stem: 在引文內容中，甲與乙分別代表了哪個國家？
  options:
  - label: A
    content: 美國、蘇聯
  - label: B
    content: 美國、德國
  - label: C
    content: 英國、蘇聯
  - label: D
    content: 中國、蘇聯
  group_stem: '(二)第二次世界大戰結束後，原先的極權勢力接連瓦解，冷戰隨即展開。


    1940 年代之後，兩大強國基於政治意識型態的差異，都想在世界版圖中拉攏更多的國家。甲方宣揚自己代表自由，指出乙方將所屬集團關入鐵幕；乙方則說自己代表人類最美好的社會，指出甲方將所屬集團納入自身的帝國殖民主義中。

    「不結盟運動」的首次會議，於 1961 年 9 月在南斯拉夫召開，通過《不結盟國家的國家和政府首腦宣言》。第二次首腦會議於 1964 年 10 月在埃及開羅舉辦，成員國已達
    47 個。

    1970 年代後，中華民國在國際上的重要性逐漸降低，但面對當時中南半島上因政治戰亂產生的難民事件，臺灣各界也響應勸募活動，甚至有許多中小學生，也都紛紛自發捐款。這些行動，表現中華民國始終在承擔國際責任，不曾因地位的變化而缺席。

    直至 1990 年代，兩強結束了漫長的競爭。但在這段期間，仍爆發過數次區域性的衝突。有學者樂觀的表示，各區域之間的整合與靠攏，表示世界性的大戰在未來出現的可能微乎其微。'
