  group_stem: '(一)中共建國 70 餘年後，整體國力提升，但內部卻仍存著許多未解的問題：


    1949 年，中華人民共和國成立。10 年之後，毛澤東冒進的產業革命造成自然環境的破壞，原本脆弱不堪的經濟與社會結構，幾乎被完全打碎，堪稱人類史上少有的人為浩劫。毛澤東為挽救自身領導地位，又發動一場思想革命，讓中國的傳統文化遭受重大打擊。

    1980 年代以來，中國富裕了起來，人民的教育素養提升不少，然而考量人口過剩，卻嚴格制定不符合人性的生育政策，試圖控制人口，引發今日人口結構的重大問題。因為有了較好的教育與經濟，讓人民對民主與權利要求更多，終在1980
    年代末，群眾走上街頭。為此，政府實施戒嚴、宵禁等政策，結果爆發流血衝突。'
