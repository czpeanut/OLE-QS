  stem: 下列關於論語和孟子兩書的比較，何者正確？
  options:
  - label: A
    content: 論語是由孔子弟子及再傳弟子編纂而成；孟子是由孟子與其弟子共同編纂而成
  - label: B
    content: 兩書的篇名，皆取各篇首章開頭二、三字而訂，與篇章的思想內容有關
  - label: C
    content: 論語的篇幅短小，言詞犀利，雄辯滔滔；孟子的篇幅較長，語言精練，意涵深刻
  - label: D
    content: 論語以義為中心思想，提出有教無類、因材施教的教育理念；孟子提出性善論，主張民貴君輕
