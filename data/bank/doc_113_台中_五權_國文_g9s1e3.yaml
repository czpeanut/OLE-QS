  - label: D
    content: 時光飛逝，意志也會隨著消散
  group_stem: '夫君子之行，靜以修身，儉以養德。非澹泊無以明志，非寧靜無以致遠。夫學須靜也，才須學也，非學無以廣才，非靜無以成學。慆慢則不能勵精，險躁則不能冶性。年與時馳，意與日去，遂成枯落，多不接世，悲守窮廬，將復何及！

