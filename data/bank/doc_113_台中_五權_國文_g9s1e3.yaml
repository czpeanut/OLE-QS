- id: doc_113_台中_五權_國文_g9s1e3_s2_33
  section: 2
  number: 33
  type: single
  page: 3
  stem: 「盛衰之理，雖曰天命，豈非人事哉」這文句中，作者想要表達什麼？
  options:
  - label: A
    content: 人的行為可以完全改變命運
  - label: B
    content: 盛衰完全由天命決定，無法改變
  - label: C
    content: 雖然天命重要，但人的努力也有影響
  - label: D
    content: 盛衰是一種偶然現象，無需追問
  group_stem: '嗚呼！盛衰之理，雖曰天命，豈非人事哉！原莊宗之所以得天下，與其所以失之者，可以知之矣。

    書曰：「滿招損，謙得益。」憂勞可以興國，逸豫可以亡身，自然之理也。故方其盛也，舉天下之豪傑，莫能與之爭；及其衰也，數十伶人困之，而身死國滅，爲天下笑。夫禍患常積於忽微，而智勇多困於所溺，豈獨伶人也哉！

    節選自歐陽脩五代史伶官傳序'
