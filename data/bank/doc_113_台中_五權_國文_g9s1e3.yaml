- id: doc_113_台中_五權_國文_g9s1e3_s2_31
  section: 2
  number: 31
  type: single
  page: 2
  stem: 根據文章的上下文，三段內容的排列，何者正確？
  options:
  - label: A
    content: 丙乙甲
  - label: B
    content: 甲乙丙
  - label: C
    content: 乙丙甲
  - label: D
    content: 乙甲丙
  group_stem: '現代西方教育上有「嘗試錯誤」的理論，認為學習就是要不怕錯誤去嘗試，才有機會成功，於是有「自古成功在嘗試」的說法。其實在五百年前的明朝人沈君烈，早有「誤亦為學地」的見解，提出「終日學終日誤，終日誤終日學」的口號，一生的學問，就靠在錯誤的地方得力。


    (甲)由此也可以想起潛虛上的一句名言：「項羽日勝而亡，高祖日敗而王。」日勝反而滅亡，就是缺少學習改進的機會，自始至終只有一套僵硬的戰略。日敗反而稱王，就是失敗之中，有許多可資學習策勵的地方。

    (乙)反觀劉邦的成功，全是在錯誤處注意學習，有人當面指責他不應該一面洗腳一面和長者說話；有人暗暗踩他一腳，告訴他不該在韓信求封齊王的使者面前發脾氣；有人當他迷戀於各國佳麗時教他趕快遷都回關中去……他都會在錯誤中立即幡然改圖，每次是在錯誤中學得最多，所以沈君烈說劉邦雖不讀書，一生學問全在錯誤中得力。

    (丙)楚漢相爭時，項羽的失敗，乃在與在自己不發現錯誤。每次有所主張，左右總是連聲稱「善」，欽佩拜伏，所以到死都認為是「天之亡我，非戰之罪」。平時在百戰百勝中越來越自負，大難臨頭了，還在高唱「力拔山兮氣蓋世」，自己很難從自負的巔峯走下來，放不下身段，結果無顏委屈地回江東去，只有死路一條。


    「在錯誤中學習」當然不限於政治人物，古語早有「學書紙費，學醫人費」的說法，指出從事藝文工作，也無不如此。

    節選自黃永武在錯誤中學習'
