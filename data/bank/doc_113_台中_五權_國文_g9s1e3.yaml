  group_stem: '以人為可愛，而我亦可愛矣；以人為可惡，而我亦可惡矣。東坡一生覺得世上沒有不好的人，最是他好處。愚兄平生謾罵無禮，然人有一才一技之長，一行一言之美，未嘗不嘖嘖稱道。橐中數千金，隨手散盡，愛人故也。至於缺陒欹危之處，亦往往得人之力。好罵人，尤好罵秀才。細細想來，秀才受病，只是推廓不開，他若推廓得開，又不是秀才了。且專罵秀才，亦是冤屈。而今世上那個是推廓得開的？年老身孤，當慎口過。愛人是好處，罵人是不好處。東坡以此受病，況板橋乎！老弟亦當時時勸我。

