- id: doc_113_高雄_光華_英語_g8s2e3_s2_47
  section: 2
  number: 47
  type: single
  page: 6
  stem: 47. The Kavalan Tribe uses banana plants in many ways. Which is NOT said according
    to the passage?
  options:
  - label: A
    content: To make mats
  - label: B
    content: To wrap food for cooking
  - label: C
    content: To make clothes
  - label: D
    content: As medicine
  group_stem: 'Did you know that banana plants can produce more than just delicious
    fruit? Other parts of the plant can be used for many things. The fibers from the
    stalk can be made into banana silk. It is strong and soft, so things such as clothes,
    hats, bags and wallets can be made from it. Using the fibers of the plant instead
    of throwing them away is also better for the environment.

    Creating banana silk and banana silk products is an important skill in the Kavalan
    Tribe (噶瑪蘭族). Each new generation learns it from the older one. They are the only
    tribe in Taiwan who knows how to do this. And they don''t want to lose the skill.

    The banana plant is very important to the Kavalan people. They use every part
    of the plant in their lives. They eat the fruit and use the fresh leaves as mats
    and for cooking and medicine.

    To make banana silk, the Kavalan start by cutting and cleaning the banana stalks
    to get the fibers. The fibers are then soaked and dried. Then they are made into
    yarn, which is woven into cloth. The weaving is often done by older women who
    learned the skill as young women from their mothers and grandmothers. The cloth
    is then used to make many products. Making and using the silk is an important
    part of Kavalan culture.


    Word Bank

    fiber 纖維

    stalk 莖，稈(植物的)

    generation 一代(人)

    yarn 紗線

    weave 紡織'
