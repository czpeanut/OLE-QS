- id: doc_113_高雄_光華_英語_g8s2e3_s2_43
  section: 2
  number: 43
  type: single
  page: 5
  stem: 43. What is the Baishatun Mazu Pilgrimage about?
  options:
  - label: A
    content: A race with a goddess.
  - label: B
    content: A walk to follow a sea goddess.
  - label: C
    content: A big party to celebrate a goddess’ birthday.
  - label: D
    content: A trip to a goddess’ home.
  group_stem: 'The Baishatun Mazu Pilgrimage is a special event in Taiwan. Many people
    walk for days to follow Mazu, a sea goddess. This year, over 320,000 people signed
    up, and more than 500,000 people may join. The walk will begin on the night of
    May 1.

    During the event, people travel and eat, and they create a lot of trash. To help
    the Earth, the Tongxiao Farmers’ Association and the Green Dining Guide started
    a plan called “Plastic-Free Pilgrimage.” They ask people to bring their own chopsticks,
    bowls, and cups, so they don’t use plastic.

    They also made a new kind of rice ball called the “Rainbow Corn Rice Cracker Onigiri.”
    Instead of plastic bags, the rice ball is wrapped in a rice cracker made of corn
    and rice, so you can eat the whole thing! It has two flavors: pork with pickled
    vegetables, and meat-free option. It is tasty and creates no waste.

    On May 11, when Mazu returns, 2,000 rice balls will be given out. This is a fun
    and kind way to care for both faith and the Earth.


