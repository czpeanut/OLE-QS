- id: doc_113_高雄_光華_英語_g8s2e3_s2_41
  section: 2
  number: 41
  type: single
  page: 4
  stem: 41. Tim sees a dog. The dog is showing its teeth and growling. What should
    Tim do?
  options:
  - label: A
    content: Feed the dog with hot dogs.
  - label: B
    content: Keep away from the dog.
  - label: C
    content: Stare at the dog.
  - label: D
    content: Take away the dog's food.
  group_stem: 'Dogs have long been seen as humans’ best animal friends. While most
    dogs are friendly and get along well with humans, some have an aggressive nature
    that makes them less easygoing than others. For example, a pit bull terrier may
    act aggressively toward humans, especially if someone purposely tries to make
    it angry.

    To protect ourselves from being attacked by an aggressive or angry dog, we must
    understand a dog’s body language. When a dog shows signs like growling, baring
    its teeth, raising its hackles, or tucking its tail, it is best to leave it alone.

    The following are some things that we should not do when we’re around dogs:

    • Stare directly into their eyes

    • Move quickly or making loud noises

    • Interrupt them while they’re eating or sleeping

    • Take away their food

    • Pull their tails or ears

    • Invade their territory

    Remember, dogs—like humans—have boundaries. If we don’t respect them, they may
    become angry and feel the need to attack.


