- id: doc_113_高雄_光華_英語_g8s2e3_s2_39
  section: 2
  number: 39
  type: single
  page: 3
  stem: 39.What happened to the man in the kayak?
  options:
  - label: A
    content: The whale ate his kayak.
  - label: B
    content: The whale pushed him away.
  - label: C
    content: The whale pulled him inside its mouth.
  - label: D
    content: The whale played with him.
  group_stem: 'Recently, a video from Chile went viral. It showed a man kayaking when
    a huge whale suddenly came up from the water. Before he could react, the whale
    opened its mouth and pulled him inside. After a few seconds, both the man and
    his kayak came out again. He was not hurt but felt very shocked. Experts say the
    whale was probably feeding and did not see him. The man’s father recorded the
    whole event, and many people were surprised by the video.

    Scientists explain that most whales cannot swallow a human because their throats
    are too small. They eat small sea animals like fish and krill by taking in water
    and pushing it out while keeping the food inside. However, sperm whales are different.
    National Geographic says that sperm whales have big throats and can swallow a
    person. Since they dive deep into the ocean to hunt giant squid, they rarely come
    near people. The chance of a whale swallowing a human is extremely low, so there
    is no need to worry.

    Whales do not care much about people, but people try to get close to them. It
    is important to keep a safe distance when watching whales. By respecting their
    space, we can enjoy watching these amazing creatures without putting ourselves
    or them in danger.


