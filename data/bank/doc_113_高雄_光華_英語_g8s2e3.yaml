  group_stem: 'Babies wear diapers every day to stay dry and comfortable. But once
    used, they usually end up as trash. In Taiwan, people throw away about 1,300 tons
    of used diapers every day. If we bury them in the ground, they can stay there
    for 500 years before they break down. These diapers are full of water. When they
    are burned, they turn into a sticky mess. This makes them harder to burn and can
    damage trash-burning machines. As a result, most trash burner avoids burning them
    because it is expensive.

    To fix this problem, a factory was built to recycle used diapers. First, the diapers
    are washed very carefully. Then, they are taken apart to separate the plastic,
    paper, and water-absorbing polymer inside. The water-absorbing polymer is especially
    useful — it can help clean dirty water. The plastic can be made into new things,
    such as floor tiles or parts of a house. The paper can be recycled into new paper
    products.

    By turning used diapers into useful materials, this factory is not only solving
    a big trash problem but also helping the Earth in a smart and sustainable way.


