  group_stem: "(39~40)\nDo you know the world’s smallest penguins? Here are some facts\
    \ about them.\n1. What is the name of the smallest penguin in the world?\n  People\
    \ in New Zealand call the penguins the Little Blue Penguins. People in Australia\
    \ call them the Fairy Penguins. The name comes from their small body, and the\
    \ color of the plumage.\n2. How big is the smallest penguin?\n  They are about\
    \ 33 centimeters tall and only weigh about one kilogram. Male penguins are bigger\
    \ than the female ones.\n3. How long can the smallest penguin live?\n  They can\
    \ live 6 to 7 years.\n4. Breeding\n  Little Blue Penguins can give birth to 4\
    \ baby birds one time. The parents are very busy taking care of their babies.\
