  section: 2
  number: 44
  type: single
  page: 5
  stem: 根據本文，下列關於游牧民族奶茶文化的敘述，何者錯誤？
  options:
  - label: A
    content: 遊牧民族奶茶屬於鹹味奶茶
  - label: B
    content: 會讓客人通常負責煮奶茶
  - label: C
    content: 是北方游牧民族的日常飲品，被稱為草原奶茶
  - label: D
    content: 若喝飽了不想再喝，就把手掌蓋在碗上並說「我喝夠了」。
  group_stem: "奶茶是中國北方游牧民族的日常飲品，蒙古族、哈薩克族和柯爾克孜族都有燒煮奶茶的飲食習慣，游牧民族喝的奶茶，又被稱為「草原奶茶」。草原奶茶和一般我們熟知的甜奶茶有什麼區別？在味覺上，因使用的茶葉不同使得它帶有鹹味；在功能上，它作為日常飲品被人們飲用，除了三餐皆以奶茶為輔以外，一天之中還有午茶和晚茶時間，「ｔｅａ\
    \ ｔｉｍｅ」對於初入田野的人類學學生而言，是個絕佳的文化觀摩與實際操練的機會。\n   在牧區氈房中，給予奶茶的順序是按照座位尊卑來進行，尊貴的客人或長者坐在餐布的頂邊，也就是氈房的最裡面，接著挨著餐布坐，到最靠近門口的位子通常是女主人，即負責燒茶、倒茶的人。\n\
    \   我剛進入田野時，喝茶時總是坐在上位，同時也是眾人關注的焦點，我拿起一塊饢（１）或是剝開一顆核桃都能引來關愛的眼神，而在我還沒習得「若喝飽了不想再喝就把手掌蓋在碗上並說『我喝夠了』」這項技能以前，我通常都是鼓著肚子、喝撐了爬下餐布的—在你沒有明確做出上述行為拒絕續茶以前，你的茶碗不會有空著的時候，不讓客人喝足茶再離開是主人的過錯。\n\
    \   有一次家裡來了客人，因為人多便在氈房裡支起長板桌，我和一位從哈薩克斯坦回來探親的阿姨並肩而坐，阿姨許久不曾回國，漢語便說得不怎麼利索（２），我們便用微笑和肢體交流。我在家人們的交談間偶爾會捕捉到幾個和我有關的漢語關鍵字，例如「北京」、「臺灣」、「研究生」等等，但因為聽不懂便全程埋頭苦喝。在我有模有樣的從碗裡抓起一把炒米放進奶茶裡、再將饢浸入奶茶中略微浸泡後送入口中、最後將手指上的麵包屑抖進奶茶碗裡之後，我聽見身邊的阿姨輕輕笑了，然後用哈薩克語向家人們說了一句話，接著大家爆出友善的笑聲。我有點疑惑，男主人對我說，「她說你感覺很適應，是個好姑娘。」從喝茶這個日常性活動中，我第一次體驗到人類學研究方法中所謂「同吃同住同勞動」的真正意涵。（梁瑜\
