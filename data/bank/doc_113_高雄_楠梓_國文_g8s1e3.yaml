  section: 2
  number: 47
  type: single
  page: 6
  stem: 由本文可知，荷花具有多種價值，下列何者不包括在內？
  options:
  - label: A
    content: 可食用
  - label: B
    content: 可觀賞
  - label: C
    content: 可嗅聞
  - label: D
    content: 可編織。
  group_stem: "自荷錢（１）出水之日，便為點綴綠波。及其莖葉既生，則又日高日上，日上日妍（２）。有風既作飄搖之態，無風亦呈嬝娜（３）之姿，是我于花之未開，先享無窮逸致（４）矣。迨至（５）菡萏（６）成花，嬌姿欲滴，後先相繼，自夏徂（７）秋，此則在花為分內之事，在人為應得之資（８）者也。及花之既謝，亦可告無罪于主人（９）矣。乃復蒂（１０）下生蓬，蓬中結實，亭亭獨立，猶似未開之花，與翠葉並擎（１１），不至白露為霜（１２），而能事不已（１３）。此皆言其可目（１４）者也。\n\
    \   可鼻，則有荷葉之清香，荷花之異馥（１５），避暑而暑為之退，納涼而涼逐（１６）之生。至其可人之口者，則蓮實與藕皆並列盤餐，而互芬齒頰者也。\n（節錄自李漁\
    \ 芙蕖）\n\n 【注釋】（１）荷錢：初生的荷葉，小如銅錢，所以稱荷錢。（２）日上日妍：一天比一天好看。妍，豔麗、美好。（３）嬝娜：姿態柔美的樣子。（４）逸致：悠閒的情趣。（５）迨至：等到。迨，及、等到。（６）菡萏：荷花的別名。（７）徂：至、及。（８）應得之資：應該得到的享受。資，資財，此處指獲得的享受。（９）可告無罪于主人：可說不辜負主人了。（１０）蒂：果實與枝莖相連的部分。（１１）擎：高舉、支撐。這裡指聳立。（１２）白露為霜：指到了秋天霜降時候。（１３）能事不已：所擅長的本領不會呈獻完畢。能事，擅長的本領。不已，不止。（１４）目：看，這裡有觀賞的意思。（１５）馥：香氣。（１６）逐：跟隨。"
