- id: doc_113_高雄_楠梓_國文_g8s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 在描述事物時，用形象的語言移轉感官感受，將某一感覺(視、聽、嗅、味、觸)的主觀感受移轉到另一感覺上，是所謂「移覺」，可使意象更活潑、更新奇。如<田園之秋>一文中，「終於雷聲愈來愈遠，電光只在遙遙的天邊橫掃。太陽又出來了，一片清新的空氣、鮮潔的色彩，彷彿聽見了貝多芬田園交響曲第四樂章牧羊人之歌。」此段是「以聽覺印象來描寫視覺印象」。下列句子也都用了感覺移轉的摹寫方式，請判斷何者說明正確？
  options:
  - label: A
    content: 水面無波，四周靜謐，只有閃亮的螢光是唯一的聒噪，看著看著，人都彷彿在光裡醉了：以視覺印象描寫聽覺印象
  - label: B
    content: 我低下頭去喊自己的名字，井水也大聲應和，連那回聲都彷彿有淡淡的餘香：以嗅覺印象描寫聽覺印象
  - label: C
    content: 星星是靜靜的掛在空中，卻好像帶著聲音，是早晨的幽遠之鐘，也是靜夜中雄渾的鼓聲，有著清脆的節奏與閃耀的聲息：以視覺印象描寫聽覺印象
  - label: D
    content: 柚樹的葉影在緩緩的移動，移上我臉頰的是幾朵擠碎的陽光，到這裡，它成了一種柔軟的撫摸：以視覺印象描寫觸覺印象
  lesson_raw:
    title: 田園之秋
    basis: 引文引用〈田園之秋〉
  tags:
