  group_stem: 某天夜裡，唐代皇帝武則天忽然興致大發，要遊覽皇家花園。當時大雪遍地，樹木凋零，根本無花可賞。臣子給皇帝出了個主意，建議皇上下一道聖旨，命令花神第二天上午必須滿園百花齊放，迎接聖駕。於是，皇帝寫了<臘日宣召幸上苑>一詩作為詔書，然後派人到花園焚香祝禱，報知花神。傳說第二天，寒冷的花園裡果然萬紫千紅，百花齊放，唯獨牡丹沒有開花。皇帝認為牡丹自詡是百花之王卻膽敢傲慢違抗天命，故將牡丹逐出京城，「貶」去洛陽；沒想到牡丹花絕跡於京師，卻在洛陽極其繁茂。皇帝聽說後，便下令火焚牡丹以示懲罰，誰知來年春天那些被火燒焦的牡丹變成了新的品種，今人稱為「焦骨牡丹」
    。
