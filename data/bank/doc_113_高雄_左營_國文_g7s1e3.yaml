- id: doc_113_高雄_左營_國文_g7s1e3_s2_47
  section: 2
  number: 47
  type: single
  page: 6
  stem: 有關元宵節「偷燈」的習俗，下列敘述何者錯誤？
  options:
  - label: A
    content: 偷燈可生男丁，是取「燈」與「丁」諧音的原因
  - label: B
    content: 「觀燈」是古代婦女元宵節出門的正當理由
  - label: C
    content: 偷燈是生男之兆，象徵著生育兒子
  - label: D
    content: 送燈給無子家庭祝願他們添子孫的習俗，民國以後已不多見。
  group_stem: "(四)\n   其實，元宵節不是一個孤立的節日，它是春節的一部分。\n  春節從除夕關門守歲開始，到元宵節，是一個人們不斷擴大活動範圍、人際關係不斷得到擴大的過程。初一給家長拜年，初二回娘家拜年。以後逐步擴大拜年範圍到一般親戚朋友。在這個時段，人們的活動範圍局限在熟人之間。初五，農活可以開始幹，商店可以開門了。這個時段，社會開始正常運作。到了正月十五，不分男女老幼都加入到節日活動中。\n\
    \  元宵節也是一個求子的節日。宋代 陳元靚 歲時廣記解釋當時人在元宵節偷燈的原因時說：「一云，偷燈者，生男子之兆。」這裡「燈」諧音「丁」，就是男丁。這樣一來，偷燈就象徵著生育兒子。根據同樣的道理，觀燈也具有求子的含義。於是，古代婦女出門觀燈有了這個理由，就名正言順了。一直到民國時代，各地多有送燈給那些無子家庭的習俗，祝願他們添子孫。\n\
    \  元宵節現代人又賦予湯圓以新的解釋，那就是甜甜蜜蜜，團團圓圓，象徵一家團圓，幸福美滿。它很符合人們的內心希望。元宵節因此獲得了新的文化意義。     \
    \                             （節選自陳連山 元宵節的文化意義）"
  tags:
    chapter:
      publisher: 康軒
      book: 七上
      subject: 國文
      code: 第十課
      title: 鬧元宵
      chapter: null
    textbook: 七上 第十課 鬧元宵
    labeled_by: ai
