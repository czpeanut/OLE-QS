- id: doc_113_高雄_左營_國文_g7s1e3_s2_43
  section: 2
  number: 43
  type: single
  page: 5
  stem: 「這是一個帶有『改革』色彩的節氣。」作者所謂的「改革」是指什麼？
  options:
  - label: A
    content: 萬物從沉睡中被喚醒
  - label: B
    content: 萬物被動等待的狀態
  - label: C
    content: 時令準確的吻合對應
  - label: D
    content: 擾人清夢的初始雷鳴。
  group_stem: "(二)\n    二十四節氣令我們驚嘆叫絕的，除了它的與物候、時令的奇異吻合與準確對應，還有一點，即它的一個個東方田園風景與中國古典詩歌般的名稱。\n\
    \  「驚蟄」，兩個漢字並列一起，即神奇的構成了生動的畫面和無窮的故事。你可以遐想：在遠方一聲初始的雷鳴中，萬千沉睡的幽暗生靈被喚醒了，牠們睜開惺忪的雙眼，不約而同，向太陽敞開了各自的門戶。這是一個帶有「改革」色彩的節氣，它反映了對象的被動、消極和等待狀態，顯現出一絲善意的冒犯和介入，就像一個鄉村客店老闆凌晨輕搖他的諸事在身的客人：客官，醒醒，天亮了，該上路了。\n\
    \  彷彿為了響應這一富有「革命」意味的節氣，連陰數日的天況，今天豁然晴朗了。溝壑和道路兩旁，青草破土而出，連片的草色已似報紙頭條一樣醒目。柳樹伸出了鳥舌狀的葉芽。在田裡，我注意到有十幾隻集群無規則的疾飛鳴叫的小鳥；牠們如精靈，敏感、多動，忽上忽下。可愛的稚態、新生的活力、上升的氣息，此時整個田野很像一座太陽照看下的幼兒園。\n\
    \  到了驚蟄，春天總算坐穩了它的江山。                                                （節選自葦岸 驚蟄）"
  tags:
    chapter:
      publisher: 康軒
      book: 七上
      subject: 國文
      code: 第九課
      title: 下雨天，真好
