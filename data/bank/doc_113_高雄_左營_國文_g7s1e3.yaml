  stem: 下列敘述，何者不是「蚊子被雨滴擊中瞬間的行為」？
  options:
  - label: A
    content: 蚊子會與雨滴融為一體，順應雨滴的趨勢落下
  - label: B
    content: 蚊子會向被擊中的那一側傾斜，好讓雨滴滑落
  - label: C
    content: 雨滴擊中身體，蚊子會跟著下落，再側向微調
  - label: D
    content: 蚊子被雨滴擊中時會先進行抵擋，再伺機而動。
  group_stem: "(三)\n    人們所謂的毛毛雨，在蚊子看來，不亞於一輛輛甲殼蟲汽車從天而降。但是，蚊子卻能夠毫髮無損，這是什麼原因呢？\n  美國\
    \ 佐治亞理工學院的胡立德教授與美國疾控中心合作，對雨中飛舞的蚊子進行了高速攝影，以觀察蚊子被雨滴擊中瞬間的行為。\n  他們發現，蚊子不會因遭到雨滴的衝擊而受傷，祕密之一就在於蚊子體重極輕。\n\
    \  原來，蚊子被雨滴擊中時並不進行抵擋，而是與雨滴融為一體，順應它的趨勢落下。如果雨滴擊中蚊子的翅膀或腿部，牠會向擊中的那一側傾斜，並通過「側身翻滾」的高難度動作，讓雨滴從身體一側滑落；當雨滴正中蚊子身體時，牠先順應雨滴強大的推力與之一同下落，隨之迅速側向微調與雨滴分離並恢復飛行。\n\
    \  蚊子在雨中安然無恙的另一個祕密，是覆蓋牠們全身的細毛具有疏水性。這種防水的細毛使得蚊子與打在牠身上的雨滴保持分隔狀態，從而使蚊子能夠迅速擺脫雨滴重新飛起，在雨滴將牠們砸落地面造成致命傷害前成功逃生。\n\
    \     （改寫自網路文章）"
