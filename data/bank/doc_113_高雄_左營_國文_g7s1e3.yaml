  options:
  - label: A
    content: 大多數的人都聽過「天之驕子」
  - label: B
    content: 大部分的人都說過「古之君子」
  - label: C
    content: 北方的胡人都尋過「魚米之鄉」
  - label: D
    content: 南方的漢人都學過「孔孟之道」。
  group_stem: "(五)\n【甲】    \n    那時候，是二千年前，他們還沒有開始用文字寫歷史——對，那時候世界上大多數的民族還沒有文字——然而我們的史記和漢書卻仔細地記錄了他們的金色童年。\n\
    \    那時候，他們的名字是匈奴。說得更含混一些，便是「胡」。\n    __________________，但很少人知道這句話是指北方的異族——對漢宮裡儒雅的君臣而言，他們只好形如自己是上天乖順安靜的孩子，但老天卻不知怎的在北方又生出那麼一個古怪強悍的孩子。他們的不足裡沒有孔子\
    \ 孟子，沒有屈原或司馬相如。然而他們跨馬兒來，揚塵千里。漢民族在體能上，不是他們的對手。漢人食穀，胡人食肉，漢人養牛助耕，胡人養馬備戰。漢人和土地之間可以百年廝守，胡人的家卻背在馬背上，可以向地球任一個點上落腳。\n\
    \    我們無話可說，只好承認他們是上天恃寵而驕的另一個孩子。                        （張曉風 星星都到齊了）\n\n【乙】  \
    \  \n    其明年，單于①遣使遺漢書云：「南有大漢，北有強胡。胡者，天之驕子也，不為小禮以自煩。今欲與漢闓②大關，取漢女為妻，歲給遺我糱酒③萬石，稷米五千斛，雜繒④萬匹，它如故約，則邊不相盜矣。」\n\
    \     （漢書 匈奴傳）\n【注釋】①單于：漢時匈奴君長的稱號。②闓：音ㄎㄞˇ，開啟。③糱酒：此只以酒麴釀製的酒。糱，音ㄋ一ㄝˋ，釀酒的酵母。\n  \
    \     ④繒：音ㄗㄥ，絲織品的總稱。"
