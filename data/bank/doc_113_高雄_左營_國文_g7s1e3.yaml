  stem: 「春天是戲劇性的季節，總是在花開得最熱烈的時候，雨就開始下了。花在雨中凋零，輾為塵化為泥，活得燦爛，死得淒涼，春天就是這樣令人心痛。這時就該撐把傘，去看無邊的細雨如何化為點點愁思，看花兒跌落時是否摔疼了？檢查小草又長高幾分？撐把傘，把自己站成天地間最溫柔的地帶，去與春天同在，細雨同在。」（周芬伶
