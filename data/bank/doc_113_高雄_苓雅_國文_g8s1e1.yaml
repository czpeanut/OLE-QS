  group_stem: "______________________，因此棉被上可能會有祖父小時候、父親小時候的尿漬，蓋起來總是冷冷硬硬的，不是軟綿綿熱呼呼的。「別說買新棉被了，連在舊棉被裡添新棉花，在當時都是一樁大事。」吳敏顯說：有一年天氣很冷，祖父覺得收成還不錯，走了好幾里路，還搭了渡船到宜蘭河\
    \ 北門口 十六坎去訂製棉被。好不容易把新棉被帶回家了，全家人都很高興，大家圍著這條棉被邊摸邊讚嘆，有人直呼棉被好軟好舒服，有人則是把手插進棉被裡說好暖和，但祖父卻二話不說把棉被綁在屋梁掛在半空中……「於是，我父親說，幾個兄弟們就議論紛紛，說老爸怎麼回事？棉被買回來是掛在房裡看的？他到底哪時候才要蓋呀？」眾人耳語讓祖父聽見了，祖父便喚兄弟們前來問道：「天那麼冷外面都下霜了，你們知道我為什麼不蓋這條棉被嗎？」兄弟們搖搖頭，祖父正色說：「我若少蓋一年，你們就可以多蓋一年……」\n\
    \    這件事，吳敏顯是透過父親口述才知道的，「看到棉被，我就會想起祖父，我想那是一個慈愛老人的模樣。」\n（改寫自京秋找尋樂趣的貧苦平原生活）"
