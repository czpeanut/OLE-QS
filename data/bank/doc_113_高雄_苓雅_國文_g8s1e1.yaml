- id: doc_113_高雄_苓雅_國文_g8s1e1_s4_11
  section: 4
  number: 11
  type: single
  page: 2
  stem: 「立秋時節，社區中庭的土芭樂，有幾顆果實逐漸轉黃了。此後大約有兩個月的成熟期。若不摘食，就得等到明年夏天。看它生長十幾年，今年不知為何，比往年都結實纍纍。白露時愈發熾烈，每天都有乳黃的果實，掉落下來。」下列哪一項訊息無法從上文得知？
  options:
  - label: A
    content: 夏天是土芭樂成熟的季節
  - label: B
    content: 土芭樂樹因時近白露而頻繁掉果
  - label: C
    content: 土芭樂熟成的果實呈乳黃色
  - label: D
    content: 社區中庭的土芭樂已生長多年。
  lesson_raw:
    title: 土芭樂
    basis: 引用劉克襄〈土芭樂〉課文
