- id: doc_113_高雄_苓雅_國文_g8s1e1_s5_26
  section: 5
  number: 26
  type: single
  page: 3
  stem: 根據本文，關於番石榴的敘述，下列何者正確？
  options:
  - label: A
    content: 雖不常見，但因味道普通乏人問津
  - label: B
    content: 別名眾多，部分與環境氣味相關
  - label: C
    content: 為臺灣原住民栽種，故當時以「番」命名
  - label: D
    content: 果皮與果肉的色澤單一，皆為淺綠色。
  group_stem: "焦妻娘家有一株番石榴，可能是味道一般、長相不佳，成熟食滿地落果卻乏人問津。那褐色樹皮呈鱗片狀，常大片脫落，顯得光滑，彷彿有些努力要記得的事物脫皮剝落了，遺忘了。可能這水果太普遍，市面上隨處可購，何勞採摘？她過世後我不敢再去岳家，那番石榴樹、樹旁的農舍、稻田、鄉村小徑，都是傷情的景物。\n\
    \    番石榴屬熱帶、亞熱帶的水果，原產於中南美洲，因外形像石榴，卻自外地引進而得名。其別名甚多，諸如：芭樂、桃金娘、菝子、奈菝、酸石榴、番桃、吉卜賽果、秋果、金罌……\n\
    \    從前臺灣的奈菝不受青睞，多散植於住厝、雞寮之旁，因果實染上些許臭味，故又有雞屎果、雞屎菝之俗名。\n    番石榴的果皮粗糙，多呈淺綠色，也有紅色或黃色者；果肉厚，有白、紅、黃、綠多種；口感多脆爽，甜的果肉供食用，酸澀的則加工製成果汁、果醬、果脯，或藥用。在臺灣落地生根三百多年來，又陸續引進眾多外來種，衍生出不少品種。\n\
    \    我愛吃的珍珠芭樂果肉甜脆、個頭大，以燕巢、彰化為主要產地，去年產季，老同學宅配了一箱燕巢菝來，如今常常懷念那滋味。番石榴之味有一種崇高感，清芬，甘甜，內斂到極點的澀，含蓄的果酸，展現果糖的深刻。它令太甜的水果顯得輕浮。\n\
    （改寫自焦桐〈番石榴〉）"
