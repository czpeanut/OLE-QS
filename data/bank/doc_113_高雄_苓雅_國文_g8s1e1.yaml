  options:
  - label: A
    content: 今是昨非，萬分愧疚
  - label: B
    content: 閱歷增長，豁然開朗
  - label: C
    content: 痛定思痛，幡然悔悟
  - label: D
    content: 如夢初醒，似真似假。
  lesson_raw:
    title: 土芭樂
    basis: 引用劉克襄〈土芭樂〉課文
