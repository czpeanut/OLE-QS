  group_stem: "【題組三】請閱讀以下文章，回答 46-48 題\n    金庸著作《神鵰俠侶》以宋朝為故事背景，主角楊過（14 歲）與其師父小龍女（18\
    \ 歲）日久生情，發展為「楊龍戀」。當時楊過的監護人為大俠郭靖與黃蓉，皆反對「楊龍戀」，認為他們違反世俗師徒之常規。然讀者群中，對「楊龍戀」多懷同情與理解，信其情真意切。\n\
    \    時至今日，我們對於師生戀的看法是否有所改變？有學者分析教師與學生之間的關係。教師握有權力，能影響學生成績、學分、比賽機會等，學生順從、討好、仰慕教師的情況，不是單純的愛情。親密關係的本質是「權力對等」，但師生關係的本質是「權力不對等」。因此立法院三讀通過性別平等教育法修正條文，學校師長不得與未成年學生發展親密，若為成年學生，校長或教職員工不得利用不對等權勢關係發展親密關係。"
  answer:
  - B
  answer_source: answer_key_vlm
