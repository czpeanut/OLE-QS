  stem: 「美國公共衛生局發出警告，認為社群媒體可能對青少年的發育及心理健康造成傷害風險。青少年的身心發展危機引起社會大眾的重視。去年年底，澳洲國會通過社群媒體最低年齡門檻法案，成為全球第一個立法禁止
    16 歲以下青少年使用社群媒體的國家。此法案引起國際間的高度關注，但其立法過程卻充滿爭議，例如：阻止年輕世代登入社群媒體的「合理措施」具體為何？年齡審查機制是否會引發對限制網路言論自由的憂慮？將青少年隔離於社群媒體之外，究竟是「大人們脫離科技現實」的落後想像，還是防堵「數位健康危機」失控蔓延的遲來防火牆？」上述事件與文化的三個層次間的關係，何者說明最適當？
  options:
  - label: A
    content: 社群媒體的發明屬於制度層次
  - label: B
    content: 社群媒體最低年齡門檻法案是理念層次
  - label: C
    content: 社群媒體形塑青少年的價值觀是理念層次
  - label: D
    content: 關於立法的爭議是制度層次影響器物層次
  answer:
  - C
  answer_source: answer_key_vlm
