  group_stem: "【題組四】請閱讀以下兩則資料，回答 49-50 題\n    資料一：根據聖經記載，是以色列的先知摩西向以色列民族頒佈的律法中的首要的十條規定「十誡」是猶太人的生活和信仰的準則，在基督教中也有很重要的地位。「十誡」的內容為：一、只能崇拜耶和華上帝；二、不可崇拜偶像；三、不可濫用耶和華的名；四、謹守安息日；五、要孝敬父母；六、不可殺人；七、不可通姦；八、不可偷竊；九、不可作假見證；十、不可貪婪。\n\
    \    資料二：五戒，為佛教的五種基本戒，即不殺生、不偷盜、不邪淫、不妄語、不飲酒。五戒本是印度沙門傳統中普遍接受的道德信念和行為標準，佛陀沿用並發展其中的內涵，作為佛教修行者的最根本戒律。"
  answer:
  - A
  answer_source: answer_key_vlm
