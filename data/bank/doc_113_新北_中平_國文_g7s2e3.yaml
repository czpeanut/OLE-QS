- id: doc_113_新北_中平_國文_g7s2e3_s2_37
  section: 2
  number: 37
  type: single
  page: 6
  stem: 關於甲、乙兩首詩的比較,說明錯誤的選項為何？
  options:
  - label: A
    content: 甲詩以「饕餮王孫」自嘲，而「潑」、「擂」二字俗極而傳神，恰是食用此物之人迫不及待的狂態
  - label: B
    content: 甲詩最後化用蘇軾「自笑平生為口忙,老來事業稱荒唐」之句，說明自己願為口腹之美而一生忙碌
  - label: C
    content: 乙詩極力稱讚此物特性，以其不管道路縱橫方向，只知一味前行，鼓勵他人應堅定心志，不要因外在環境而動搖
  - label: D
    content: 乙詩用詞較為端凝穩重，桂花、桐葉結成了霧靄秋蔭，好吃貪饞者在樹下舉杯自飲，日夜盼著食用此物的最佳時令。
  group_stem: "【甲】\n持螯更喜桂陰涼，潑醋擂薑興欲狂。饕餮王孫應有酒，橫行公子竟無腸。\n臍間積冷饞忘忌，指上沾腥洗尚香。原為世人美口腹，坡仙①曾笑一生忙。\n\
    【乙】\n桂靄桐陰坐舉觴，長安涎口②盼重陽。眼前道路無經緯③，皮裡④春秋⑤空黑黃。\n酒未滌腥還用菊，性防積冷定須薑。於今落釜成何益，月浦⑥空餘禾黍香。 \n\
    \ （選自曹雪芹《紅樓夢》）\n注釋：\n① 坡仙：蘇東坡        ② 長安涎口：京城的好吃貪饞者        ③ 經緯：縱橫\n④ 皮裡：肚子裡\
    \        ⑤ 春秋：顏色不同                    ⑥ 月浦：有月光的水邊"
