  stem: 甲、乙二文對於古廟和教堂空間的描寫角度，何者說明正確？
  options:
  - label: A
    content: 皆依照作者行走的動線安排行文敘述的次序
  - label: B
    content: 皆具體提及廟宇或教堂附近的花草植物名稱
  - label: C
    content: 皆以信徒的喃喃祈願聲烘托空間的宏偉巨大
  - label: D
    content: 皆對建築物室内和外觀顏色進行詳盡的描寫
  group_stem: "【甲】\n青澀的歲月常常是人一生最緬念的歲月。未必都是密樹濃蔭、遠山含翠的金粉記憶:也許是一個看雲的心願在嚴師的書齋裡破滅，也許是一次黃昏的約會在聽雨的殘荷邊落空，幾十年後對著飄霜的兩鬢細細回想，心中塵封的懊恨一瞬間竟給冉冉飄起的暖意蓋掉了。那其實是近乎淺薄庸俗的意興，經歷了一代一代人的渲染，中外追憶幼年往事的不少創作，卻依然打破時空撩起無盡的感動。\n\
    \    那所破舊的古廟建在小城郊區的山坡上。是熱帶南洋天氣，山色長年蒼翠，雨季染多了一層迷濛的水墨，遠遠看去，更見縹緲。廟邊一條蜿蜒的小河，潺潺的水聲像三五村姑壓低了嗓子議論旖旎的流言。我兒時常跟大人拎著水果鮮花到廟裡燒香拜佛，年前還寫過一段隨筆追憶昔日景象。龕燈微弱，爐煙裊裊，古若沉檀的雕佛滿身是歲月的蛛塵。後堂供奉的觀音大士金容慈悲，永世低眉諦聽堂内的人語和堂外的風聲。逢年逢節，穿梭膜拜的善男信女有的像孔乙己，有的像周樸園，有的像祥林嫂，有的像陳白露。\n\
    \    稚童跟著大人喃喃祈願，求的總是菩薩保佑大小平安，順風順水。昏暗的佛堂已然陰森，偏門裡冷不防邁出一兩個披著袈裟的和尚，孩子們都嚇得趕緊躲在一旁。苦苦等到鐘魚無聲，香燈漸燼，進香的人紛紛跨出古廟的門檻，暮色已經初合，廟前幾株晚香玉飄起幽幽的花氣。\
    \                                                            \n(董橋〈古廟〉)\n【乙】\n\
    \    沿著鳳凰木夾道的馬路走下去，出了校門，往左轉，很快就到天主堂了。那天主堂是墨西哥式建築，一個西班牙神父的設計。自從雷神父到大度山以後，這教堂就一直那麼美好。它有紅色和黄色的廊柱，有菩提樹，有紫藤花，有黃椰，還有低低的杜鵑花。七彩的石板鋪在草地上，像童話裡的小宮殿。我們在那兒澆過水，那時我才十九歲，我喜歡教堂，喜歡它的色澤和彌撒：而且我喜歡雷神父，他是一個高大的憂鬱面孔的法國人。\
    \                        \n（楊牧〈教堂外的風景〉）"
