  stem: 根據詩意判斷，甲、乙兩首詩所描述的對象為何？
  options:
  - label: A
    content: 螃蟹
  - label: B
    content: 蚌殼
  - label: C
    content: 田螺
  - label: D
    content: 龍蝦。
  group_stem: "【甲】\n持螯更喜桂陰涼，潑醋擂薑興欲狂。饕餮王孫應有酒，橫行公子竟無腸。\n臍間積冷饞忘忌，指上沾腥洗尚香。原為世人美口腹，坡仙①曾笑一生忙。\n\
    【乙】\n桂靄桐陰坐舉觴，長安涎口②盼重陽。眼前道路無經緯③，皮裡④春秋⑤空黑黃。\n酒未滌腥還用菊，性防積冷定須薑。於今落釜成何益，月浦⑥空餘禾黍香。 \n\
    \ （選自曹雪芹《紅樓夢》）\n注釋：\n① 坡仙：蘇東坡        ② 長安涎口：京城的好吃貪饞者        ③ 經緯：縱橫\n④ 皮裡：肚子裡\
    \        ⑤ 春秋：顏色不同                    ⑥ 月浦：有月光的水邊"
