  stem: 根據本文，下列何者敘述正確？
  options:
  - label: A
    content: 乙文對教堂的描寫有採用視覺摹寫，但未用到嗅覺及聽覺摹寫
  - label: B
    content: 甲文對古廟的描寫採用聽覺摹寫的有「水聲、村姑閒聊聲、祈願聲」等
  - label: C
    content: 從乙文中作者對場景與人物的書寫可看出「大度山後方的天主堂是墨西哥式建築,色彩繽紛,花草皆非常繁盛」
  - label: D
    content: 甲文作者認為以幼年往事為主題的創作能打破時空，撩起無盡感動是因為「人們總是不喜歡面對蒼老枯黃的未來，想要藉由閱讀找回年輕的感覺」。
