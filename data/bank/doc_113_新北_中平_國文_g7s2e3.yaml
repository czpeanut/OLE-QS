    |---|---|---|---|---|---|

    | 安哥拉貓 | 安哥拉 | 肥胖 | 笨拙 | 軟弱、天真、懂得感恩圖報 | 過著享有美食的舒適生活，即使挨打、失去自由也不在乎。 |

    | 老公貓 | 不明 | 瘦高 | 敏捷 | 熱心、堅強、睿智、自尊心高、瀟灑 | 享有自由，即使生活艱辛也樂在其中。 |'
  options:
  - label: A
    content: 安哥拉貓認為天堂需要「自由與艱辛」，老公貓認為天堂是「美食與安穩」，體現相反的價值觀
  - label: B
    content: 兩者外形差異（肥胖 vs 瘦高）導致個性不同：肥胖者軟弱，瘦高者自尊心強，與生存方式無關
  - label: C
    content: 老公貓因品種不明而外形瘦高、動作笨拙；安哥拉貓因品種純正而肥胖笨拙。兩者個性均依賴人類
  - label: D
    content: 安哥拉貓個性軟弱天真，滿足於被豢養的舒適生活；老公貓個性熱心堅強，更嚮往自由而非物質享受。
