- id: doc_113_新北_中平_國文_g7s2e3_s2_32
  section: 2
  number: 32
  type: single
  page: 5
  stem: 根據本文，下列何者敘述正確？
  options:
  - label: A
    content: 從「故鄉雖然永遠可以回去，但回不去那段缺席的時光。」可知「父母因長年在外，被迫與孩子疏離。」
  - label: B
    content: 「臨行前，他們向觀音菩薩點香，向四面佛頌念，向阿拉真主叩首」是在描寫移工離鄉背井的辛苦與犧牲
  - label: C
    content: 讓移工們願意離鄉背井到臺灣工作的主要原因是：臺灣雇主遠比家鄉的雇主親切，對待移工與本國勞工一視同仁
  - label: D
    content: 「小孩被時間偷走，换來陌生的青少年，回鄉時相顧無言，誰也不認識誰。」意指「小孩因為母親只把溫柔給別人家的寶貝，而心有疙瘩。」
  group_stem: "臺灣人的世界只有美國、歐洲、日本、韓國，反而不認識這些近在咫尺的鄰居。唱歌、吃飯、聊天，說母語時才不用屏氣凝神，他們來這裡深呼吸，放聲大笑，吃好料打牙祭。\n\
    \    很累呀，真的。他們彎腰擦地、洗碗，哄小孩乖乖吃飯，幫老人換尿布。他們進工廠、入工地，上船捕獲臺灣人冰箱中的海魚。手機用久了都要充電，移工當然也需要休息。\n\
    \    不管他們家鄉在哪，全被叫外勞。在臺灣人眼裡，外勞全差不多，其實他們差超多的。不，沒有人的名字叫外勞。 他們可能叫瑪利亞，來自菲律賓，目標是蓋房子，好讓成群兒女不用再拿碗公接雨水；可能叫阮國安，來自越南的離島，在漁船上如履平地；可能叫媧洋，來自印尼，排行老大，希望供弟妹上學；可能叫通，泰國農村的綠手指，擠在工廠宿舍，仍種了兩盆蘭花，偷偷崇拜美麗。\n\
    \    他們有20 多歲的強健體魄，30 多歲的耳聰目明，從破敗凋零的鄉下村子出走，第一次坐飛機就飛到這個島嶼，第一次出國就久得讓人嘆氣。女人把滿腔溫柔留給別人家的寶貝，忙著推別人爸媽的輪椅，男人填補了工廠、農田、工地、漁船上空蕩蕩的位置。\n\
    \    故鄉雖然永遠可以回去，但回不去那段缺席的時光。他們用生命換取金錢，金錢卻買不回生命，小孩被時間偷走，換來陌生的青少年，回鄉時相顧無言，誰也不認識誰。他們賺來的血汗錢用來付學費、養生送死、治病療傷，盤算多時，買這買那，剩下的錢，偶而來第一廣場吃一碗牛肉丸或河粉湯。\n\
    \    雇主的一念，可以是天堂，也可以是地獄。 媧洋照顧的老阿嬤可能不認得兒女的臉，但仍一心掛念媧洋不吃豬肉。國安的船東或許對他的創傷不聞不問，任他感染發炎，痛苦哀號。臺灣人似乎刻意跟他們隔著一段距離以保護自己，保護自己免於什麼呢？\n\
    \    我想，或許是貧窮吧。不好意思，他們既然身在這裡，就無法隱形。總不能只要勞動力，卻不要勞工吧？他們默默無聲，嘴裡吐不出幾句話，但心中歡聲盼望過開齋節、聖誕節、潑水節、農曆春節。他們的行李很\
    \ 輕，裡面只裝著夢想而已。沒有人想離鄉背井，除非遠方充滿希望。\n    臨行前，他們向觀音菩薩點香，向四面佛頌念，向阿拉真主叩首，輕聲細語，要求從來不會很多。說到底，他們和你我一樣，為了家人，為了一口飯，終日奔忙。唯一不同，就是他們來自異國他鄉。\n\
    （節選自張健芳〈移工的虛擬故鄉〉）"
