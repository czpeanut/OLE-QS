  group_stem: '有樵者山行遇虎，避入石穴中，虎亦隨入。穴故嵌空而繚曲①，輾轉內避，漸不容虎，而虎必欲搏樵者，努力強入。樵者窘迫，見旁一小竇②，僅足容身，遂蛇行而入，不意③蜿蜒數步，忽睹天光，竟反出穴外。乃力運數石，窒④虎退路，兩穴並聚柴而以焚之。虎被熏灼，吼震巖谷。不食頃⑤，死矣。此事亦足為當止不止之戒也。

    （清 紀昀〈樵者遇虎〉，選自《閱微草堂筆記》）

    注釋：

    ① 嵌空而繚曲：幽深而曲折繚繞。            ② 竇:音ㄉㄡˋ，孔穴。              ③ 不意:沒想到。

    ④ 窒:阻塞。                               ⑤ 不食頃:不到一頓飯的功夫。'
