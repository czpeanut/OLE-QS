- id: doc_113_新北_中平_國文_g7s2e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 「面對歐式蛋糕、日式和菓子的引進，傳統糕餅已臻於精緻化，並融合各國特色。以結婚喜餅而言，歐式禮盒搭配傳統大餅、滿月油飯搭配長崎蛋糕、廣式月餅搭配臺式綠豆凸，均展現糕餅有著無國界、易於融合的特色。廣式月餅皮包著濃郁的日式抹茶，生日蛋糕夾著臺灣芋頭，不停的創新口味亦須立足於對傳統的堅持。」這段文字的重點在於強調傳統糕餅的何種現狀？
