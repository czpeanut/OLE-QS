- id: doc_113_新北_中平_國文_g7s2e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 「現代人要保有自己的頭腦清醒，自處之道除了要積極『找回心中那把正確的尺』外，還應拒絕媒體那些五花八門、令人眼花撩亂的『顏色』渲染，拒絕名嘴逞口舌之快的『口水』雜音，拒絕不斷加料加味以博取收視的節目內容。只有少看少聽少接觸那些以誇大渲染為能事、以揭人隱私為賣點、以攻訐謾罵為樂事的報導與節目，我們才能耳根清淨，永保耳聰目明，在亂世中做個不受真假所惑的人。」上文提醒我們面對假以亂真的各種消息時，該如何應對？
  options:
  - label: A
    content: 最好眼不見為淨
  - label: B
    content: 不論是非對錯
  - label: C
    content: 公正合理的判斷
  - label: D
    content: 清者自清，濁者自濁。
  tags:
