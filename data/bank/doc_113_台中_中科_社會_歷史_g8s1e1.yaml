  section: 2
  number: 49
  type: single
  page: 4
  stem: 根據前文，我們可以概括出，大約在哪個時代，學術自由就已經受到打擊？
  options:
  - label: A
    content: 東周早期
  - label: B
    content: 東周晚期
  - label: C
