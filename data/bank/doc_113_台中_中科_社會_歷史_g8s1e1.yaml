  - label: D
    content: 漢代初期。
  group_stem: 東周以來，百家爭鳴，被視為是學術思想上的黃金時代，九流十家各有自己的擁護者。各國因富國強兵的政策，延攬各國士人效力，並且加以禮遇，平民有機會透過才能獲得晉用。但到了晚期，秦國已經率先下達逐客令，表示對游走各國士人的不滿；秦統一天下後，實施挾書律，進一步打擊學術自由，直到漢朝建立後才廢除。不過隨後由於漢武帝尊崇儒術，並以精通儒家經典作為入仕當官的標準，毫無疑問對學術又是一次打擊。漢代的選官方式，促成東漢末的累世經學、經學世家出現，到了魏晉之後，平民想要再透過才能當官已難過登天。請回答下列問題。
