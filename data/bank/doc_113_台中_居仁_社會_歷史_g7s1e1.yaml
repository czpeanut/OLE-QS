  type: single
  page: 4
  stem: 舊香蘭遺址應可以做為下列哪個時代的代表？
  options:
  - label: A
    content: 歷史時代
  - label: B
    content: 舊石器時代
  - label: C
    content: 新石器時代
  - label: D
    content: 金屬器時代。
  group_stem: "（三）請閱讀以下文章並回答問題：\n    杜鵑颱風經過臺灣恆春以南海域，巨浪將舊香蘭\n海岸沙丘侵蝕掉大半，得以露出史前遺址的一隅。考\n\
    古隊發現了陶片、石器、骨角器、玻璃珠、鐵器、青\n銅器等等，特別的是，還有少見的黃金碎屑。舊香蘭\n遺址的地理位置接近海邊，出土了大量的捕魚工具：\n各式各樣的魚鉤、數千件的魚骨、魚牙（大白鯊），\n\
    其數量是全臺考古遺址最高的，可見對海洋資源的依\n賴。\n    其中最關鍵性的是舊香蘭人可能已掌握「製造」\n金屬器的能力，遺址中發現到：大量鐵器、鐵渣、未\n\
    製作完畢並纏捲著玻璃材料的鐵棒等現象，且數量眾\n多。除此之外，舊香蘭遺址與原住民文化之間的淵\n源，可以從陶器上的百步蛇紋飾看出連結，就連石\n刀、骨角製品上都有蛇形的圖案，令人驚嘆。\n\
    \  參考資料：《穿越時空的考古台灣 ── 蒐尋、解謎與保存》"
