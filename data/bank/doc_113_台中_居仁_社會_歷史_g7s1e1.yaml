  group_stem: "（二）請閱讀以下短文並回答問題：\n  1697 年（康熙 36 年），郁永河奉命來臺採集硫\n磺，他帶領工人由府城安平沿岸北上。他觀察到此處\n\
    少壯未婚的男子都居住在一間比較大的住屋，叫做\n「公廨」，這是村民們平常議事的場所。\n  郁永河歷經艱苦後終於抵達目的地—現今的臺\n北北投地區，他僱用當地原住民，讓原住民以獨木舟\n\
    載運土到他的工寮換取布匹，再由漢人工人展開提煉\n硫磺工作。"
