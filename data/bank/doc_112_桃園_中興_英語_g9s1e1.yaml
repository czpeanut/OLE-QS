    \ and meaningful uses for LINE.\n  To begin with, LINE can save your life when\
    \ you are in serious danger. For example, in 2016, a Taiwanese man almost died\
    \ after his boat turned over in the ocean. Luckily, he was saved because he sent\
    \ a message to his friend on LINE before he fell into the water.\n  LINE can also\
    \ be used to raise money for those in need. Take the people in Kumamoto（熊本市）for\
    \ example. Their town was hit hard by two earthquakes in April 2016, and it needed\
    \ a lot of money to recover from them. Therefore, a set of cute LINE stickers\
    \ was created. When anyone bought the stickers, the money went to those in need\
    \ in Kumamoto.\n  As you can see, LINE is more than just an app for sending messages\
    \ and stickers. It can also save lives and raise money when it is used wisely.\n\
