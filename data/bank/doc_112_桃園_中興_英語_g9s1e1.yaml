  - label: D
    content: How to start talking with people.
  group_stem: "(A)\n  Making new friends may be easy for some people, but for others,\
    \ it can be the worst part of being in a new place. Luckily, there are a few easy\
    \ tricks that can help you make friends.\n  Most of the time, we show how we feel\
    \ on our faces without knowing it. This means that if we’re feeling nervous, we’ll\
    \ probably look that way, too. We should try to show our best side. For example,\
    \ if we smile, people will think that we’re friendlier.\n  Self-confidence is\
    \ also important for making new friends. One of the best ways is to wear clothes\
    \ that both show the real you and make you feel comfortable. Of course, you shouldn’t\
    \ wear pajamas on your first day of school! Just be yourself—in your favorite\
    \ clothes.\n  If you don’t know how to talk with people you’ve just met, try asking\
    \ them some questions about themselves. People usually enjoy talking about themselves.\
    \ Ask the lady next to you how long she’s been at the company. Ask the guy behind\
    \ you in class what his favorite subject is.\n  It can take a while for deep friendships\
    \ to form. Just enjoy the process of making friends.\n nervous 緊張的 self-confidence\
    \ 自信心 pajamas 睡衣 while 一段時間\nfriendship 友誼 form 形成 process 過程"
