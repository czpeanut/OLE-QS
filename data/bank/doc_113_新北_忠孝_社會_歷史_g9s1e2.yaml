- id: doc_113_新北_忠孝_社會_歷史_g9s1e2_s1_38
  section: 1
  number: 38
  type: single
  page: 2
  stem: 莫斯科大公國為斯拉夫民族所建立的國家，在某任國王迎娶西方某帝國的末代公主後，自稱為「第三羅馬」，以強調自己在歷史及文化傳承的地位，也意圖想復興某個政權的輝煌歷史與版圖，建立一個強大的政教合一國家。請問：莫斯科大公國之所以會自稱為「第三羅馬」是因為下列何種原因？
  options:
  - label: A
    content: 滅亡羅馬帝國後佔領羅馬帝國領土
  - label: B
    content: 自拜占庭帝國傳承希臘正教的信仰
  - label: C
    content: 與西羅馬同樣使用拉丁文為主要文字
  - label: D
    content: 國王由羅馬教宗加冕並聽從教宗指揮。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
