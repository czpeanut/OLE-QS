- id: doc_113_新北_忠孝_社會_歷史_g9s1e2_s1_37
  section: 1
  number: 37
  type: single
  page: 2
  stem: 歐洲因宗教因素，常有許多頗具特色的古建築，其中，在歐洲的某地有著絕無僅有的「穆德哈爾式（Mudéjar）」建築。穆德哈爾式建築是揉合了伊斯蘭建築裝飾元素與基督教建築風格的建築，並從12
    世紀起開始盛行於該地。請問：「穆德哈爾式建築」最可能是下列何地的建築特色？
  options:
  - label: A
    content: 西班牙哥多華
  - label: B
    content: 埃及開羅
  - label: C
    content: 英國倫敦
  - label: D
    content: 法國巴黎。
  tags:
