- id: doc_113_新北_忠孝_社會_歷史_g9s1e2_s1_39
  section: 1
  number: 39
  type: single
  page: 2
  stem: 右圖為歐洲某時期之諷刺畫，圖中將一干位高權重的教士醜化為禽獸，如將方濟各會修士穆納畫成貓，將知名神學家埃姆瑟、埃克、萊普畫成象徵邪惡、貪婪和走狗的山羊、豬及狗，而作者更將當時教宗利奧十世畫成象徵反基督的獅子，並在標題諷刺教宗竟用企圖以錢財和紅衣主教的寶座換取其他神職人員的服從。請問：該諷刺畫最可能畫於何時、何地？
  options:
  - label: A
    content: 10 世紀的法蘭西
  - label: B
    content: 14 世紀的義大利
  - label: C
    content: 16 世紀的日耳曼
  - label: D
    content: 18 世紀的西班牙。
