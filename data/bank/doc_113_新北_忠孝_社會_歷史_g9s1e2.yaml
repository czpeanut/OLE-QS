- id: doc_113_新北_忠孝_社會_歷史_g9s1e2_s1_34
  section: 1
  number: 34
  type: single
  page: 1
  stem: 蓉蓉偶然看到路上車輛畫有一特殊符號如右圖，詢問歷史老師後才知道該符號為「耶穌魚」（ΙΧΘΥΣ）。該符號之所以出現，是因基督徒為避免被當時政府抓捕，以耶穌「五餅二魚」的故事為發想，發明該符號作為暗號，以確認彼此身份；教徒往往先隨意畫出一條弧線，若對方亦為教徒，則應能完成符號的另一半。請問：這個「耶穌魚」的符號最可能發源於何時？
  options:
  - label: A
    content: 前二世紀
  - label: B
    content: 二世紀
  - label: C
    content: 五世紀
  - label: D
    content: 十一世紀。
