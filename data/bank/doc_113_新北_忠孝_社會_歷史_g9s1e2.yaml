- id: doc_113_新北_忠孝_社會_歷史_g9s1e2_s1_40
  section: 1
  number: 40
  type: single
  page: 2
  stem: "以下是歐洲三個時期對宗教的不同論述\n資料一：某位皇帝曾說：「我們的願望是：凡在我們寬大統治下的人民都該繼續崇奉聖彼得傳授給我們羅馬人的宗教……，我們命令，凡信奉這道理的應有『公教基督徒』之稱；其他眾人，依我們的判斷，既是狂妄不羈的人，我們命令應以『異端者』之汙名來稱呼他們；他們的聚會所不得擅稱教堂；他們將要遭受到的，不僅是天主的懲罰，而且是『依天主旨意』我們法律的制裁」。\
    \ \n資料二：當時的人們，強調的是信仰而不是理性，重視的是來世而不是現世；他們不太計較現世的成就，期盼的是來世的和平與安詳。社會的一切都圍繞著基督教運轉。\n\
    資料三：在某位皇帝任內，政府曾發布命令：「我們教導大家崇敬諸神，卻使基督教徒陷於危險和苦難之中，甚至有人喪失性命，許多人至今不能公開參加他們的宗教活動。我們應本著寬大宗旨，開恩處理這件事。今後，他們可以自由表達想法，不受干擾的自由集會但得尊重法律和政府。」\n\
    根據資料所述內容，上述資料出現的時間先後順序為何？"
  options:
  - label: A
    content: 資料一 → 資料二 → 資料三
  - label: B
    content: 資料二 → 資料三 → 資料一
  - label: C
    content: 資料一 → 資料三 → 資料二
  - label: D
    content: 資料三 → 資料一 → 資料二。
  tags:
