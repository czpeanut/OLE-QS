- id: doc_113_新北_忠孝_社會_歷史_g9s1e2_s1_31
  section: 1
  number: 31
  type: single
  page: 1
  stem: 有一位父親在妻子懷孕時向上帝祈禱：「我希望他生來不僅有才智、美好的身材與容貌，而且還要具備優雅的氣質與一種在他人一見之下有親切與傾心之感的特質。他的心靈之美不亞於軀體之美，在教育方面他不僅要接受古典文學教育，還要用心學習本國語的寫作。」請問：這位父親最可能生活在哪個時代？
  options:
  - label: A
    content: 8 世紀的巴格達
  - label: B
    content: 11 世紀的耶路撒冷
  - label: C
    content: 13 世紀的君士坦丁堡
  - label: D
    content: 15 世紀的義大利。
