- id: doc_113_新北_忠孝_社會_歷史_g9s1e2_s1_28
  section: 1
  number: 28
  type: single
  page: 1
  stem: 在某個帝國擴張下，戰事不斷，打斷了東、西方的貿易橋梁，使西歐往東方的交通不時受阻；該帝國在此時開始向過境商人徵收高額稅捐，造成原產於東方的香料、茶葉等商品價格越發昂貴，而這豐厚的商業利潤成為了西歐各國尋找東方新航路的主要誘因之一，導致了歐洲大航海時代的來臨。請問：此帝國最可能是哪個帝國？
  options:
  - label: A
    content: 阿拉伯帝國
  - label: B
    content: 拜占庭帝國
  - label: C
    content: 塞爾柱土耳其帝國
  - label: D
    content: 鄂圖曼土耳其帝國。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 歷史
      code: 4-2
      title: 大航海時代的開展
      chapter: 第4章 近代歐洲與多元世界
