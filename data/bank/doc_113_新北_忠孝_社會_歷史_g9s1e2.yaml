    labeled_by: ai
- id: doc_113_新北_忠孝_社會_歷史_g9s1e2_s1_36
  section: 1
  number: 36
  type: single
  page: 1
  stem: 在某篇文獻中提到關於某個民族對世界文化的貢獻：「中世紀時，他們利用地處東西方之間的有利位置，吸收各種文明的養分並加以創新。又因宗教經典中提到：『學者的墨水比殉道者的血更神聖』，故即使與歐洲多數地區因宗教差異而時有衝突，但仍積極修訂、增補和翻譯古希臘、羅馬經典，替歐洲保存了不少經典，他們的貢獻，最終也成為西歐文藝復興的重要基石。」請問：文中的「他們」是指下列哪個民族？
  options:
  - label: A
    content: 斯拉夫人
  - label: B
    content: 阿利安人
  - label: C
    content: 阿拉伯人
  - label: D
    content: 日耳曼人。
