- id: doc_113_新北_忠孝_社會_歷史_g9s1e2_s1_32
  section: 1
  number: 32
  type: single
  page: 1
  stem: 2020 年，土耳其政府發布一份新聞稿：1934 年的「聖索菲亞清真寺轉換為博物館」決議無效。因此，原本以博物館的身份對外開放參觀的聖索菲亞大教堂（Hagia
    Sophia）將恢復成「清真寺」。消息一出，立刻引起土耳其輿論與國際社會的反彈聲浪，因為事實上，聖索菲亞大教堂中保存了許多東正教與伊斯蘭教的文物，也見證了當地曾被不同政權統治的歷史，無論從歷史角度、國際觀感或實質觀光收入來看，取消聖索菲亞大教堂的博物館身份，對土耳其來說有害無益。請問：聖索菲亞大教堂見證了當地被那些政權統治的歷史？
  options:
  - label: A
    content: 羅馬帝國、阿拉伯帝國
  - label: B
    content: 亞歷山大帝國、阿拉伯帝國
  - label: C
    content: 拜占庭帝國、塞爾柱土耳其帝國
  - label: D
    content: 拜占庭帝國、鄂圖曼土耳其帝國。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 歷史
      code: 3-3
      title: 伊斯蘭教的興起與擴張
      chapter: 第3章 普世宗教的發展
    textbook: 九上歷史 3-3 伊斯蘭教的興起與擴張
    labeled_by: ai
- id: doc_113_新北_忠孝_社會_歷史_g9s1e2_s1_33
  section: 1
  number: 33
  type: single
  page: 1
  stem: 十四世紀某位拜占庭學者由於自身國家受到外族侵擾，決定由海道逃到鄰近地區講學，不久便聲名大噪，還因此被聘為當地大學指導希臘文的教授，一時之間許多人慕名而來，自各處蜂湧而至，引發一波古典文化研究熱潮。請問：此位學者教授希臘文的大學會是位在哪個城市？
  options:
