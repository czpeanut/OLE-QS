- id: doc_113_新北_忠孝_社會_歷史_g9s1e2_s1_35
  section: 1
  number: 35
  type: single
  page: 1
  stem: 在明朝萬曆年間，有位來自歐洲的傳教士─利瑪竇來到了中國，他積極地向中國人傳遞著他的信仰，並且認為「經驗告訴我們，神父們應該像高度有教養的中國人那樣裝束打扮，他們都應該有一件在拜訪官員時穿的綢袍，在中國人看來，沒有它，一個人就不配和官員、甚至和一個有教養的階層的人平起平坐。」請問：在利瑪竇的傳教過程中，最可能傳遞何種信念？
  options:
  - label: A
    content: 重視紀律與素質，人們應過清貧的生活
  - label: B
    content: 為方便信徒閱讀聖經，積極教導拉丁文
  - label: C
    content: 認為努力工作、有所成就是上帝的榮耀
  - label: D
    content: 透過贖罪券，死後可以消除罪過得永生。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 歷史
      code: 5-1
      title: 宗教改革
      chapter: 第5章 近代歐洲的變革
