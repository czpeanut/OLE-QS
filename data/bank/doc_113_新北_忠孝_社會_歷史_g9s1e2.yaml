    labeled_by: ai
- id: doc_113_新北_忠孝_社會_歷史_g9s1e2_s1_29
  section: 1
  number: 29
  type: single
  page: 1
  stem: 右圖為2016 年某國際組織會員國分布圖，圖中深色區域為會員國的位置。該國際組織在相同淵源之下，為促成會員國間經濟、社會和文化等方面的合作而組成此國際組織。請問：此國際組織會員國的組成原因最可能是與何相同的淵源有關？
  options:
  - label: A
    content: 曾為阿拉伯帝國統治過的地區
  - label: B
    content: 為東亞文化圈漢文化的傳播地
  - label: C
    content: 皆以伊斯蘭教為國家主要信仰
  - label: D
    content: 早期以拉丁文為主要書寫文字。
