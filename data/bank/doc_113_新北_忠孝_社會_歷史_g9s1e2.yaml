- id: doc_113_新北_忠孝_社會_歷史_g9s1e2_s1_30
  section: 1
  number: 30
  type: single
  page: 1
  stem: 十七世紀時，一批荷蘭的傳教士跟隨著荷蘭商船來到台灣，並在台灣以新港文向原住民傳教，除了以《聖經》作為教材，更強調努力工作、勤勞節儉才能榮耀上帝，藉此要求原住民積極狩獵並上繳鹿皮。請問：這些荷蘭傳教士最可能屬於下列哪一個教派？
  options:
  - label: A
    content: 路德教派
  - label: B
    content: 喀爾文教派
  - label: C
    content: 耶穌會
  - label: D
    content: 英國國教派。
