  group_stem: "(46~48) (每題3 分)\nHow to Know Your Feelings\nSometimes, we feel sad\
    \ or bad and don’t want to have these feelings. We may play on our phones, play\
    \ games, eat snacks, or watch TV to forget them. But the feelings are still there\
    \ when we hide them. We feel bad sometimes. Here is a good way to help. Sit down\
    \ and ask, “What do I feel in my body?” Maybe your hands are cold or your heart\
    \ beats fast. Don’t fight the feelings. Just look at them. Take slow, deep breaths\
    \ and just let the feelings stay there.\nYou don’t need to change your feelings\
    \ fast. Just look at how you feel. Do this every day, and you can feel calm and\
    \ strong. It also helps you know yourself.\nHere are four easy ways:\n1. Look\
    \ at feelings – Check if you are happy, sad, or afraid.\n2. Stop before talking\
    \ – Take a deep breath or count to ten if you feel angry.\n3. Talk when calm –\
    \ Talk at a good time.\n4. Listen and ask – Listen carefully and ask, “How do\
    \ you feel?”\nThese ways can help you feel better and do the right things. Parents\
    \ and teachers can help, too.\n   feel 感覺 forget 忘記ask 問 beat 跳動 breath 呼吸 stay\
    \ 停留calm 冷靜 better 比較好"
  shared_asset: g3_46_48
  ai_answers:
