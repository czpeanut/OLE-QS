- id: doc_113_新北_忠孝_英語_g7s2e3_s3_36
  section: 3
  number: 36
  type: single
  page: 3
  stem: Why do some young people in Taiwan want to be K-pop stars?
  options:
  - label: A
    content: They want to travel the world.
  - label: B
    content: They love music, dancing, and singing.
  - label: C
    content: They want to work in big offices.
  - label: D
    content: They like to meet many people.
  group_stem: '(36~39) (每題2 分)

    Do You Want to Be a K-pop Star?


    Do you know Blackpink? Some young people in Taiwan want to be K-pop stars like
    the girls in Blackpink. They love music, dancing, and singing in front of people.
    To do this, they become trainees. Trainees learn to sing, dance, and act every
    day. Some need to take a test to join the training. Trainees often practice ten
    hours a day. They also go to special schools and take tests every month. If they
    do not do well, they can''t be stars. The company may want them to leave.


    The girls in Blackpink trained for many years. Jennie trained for about six years.
    Lisa came from Thailand (泰國) , but she practiced in Korea for many years. Their
    hard work helped them become great stars on stage. The “10,000-hour rule” said
    that if you practiced a lot, you could become an expert. Some trainees were kids,
    and some were in high schools. They trained for 5 to 10 years before they stood
    on the stage. Years ago, companies gave them food and a place to live. Trainees
    got a little money, and some companies were not nice to them. They slept only
    a few hours a day and practiced for a lo11ng time.


    Now, there are new ways in training. These ways help trainees not work too much
    and be safe. Becoming a K-pop star is not easy. It needs a lot of work, time,
    and sometimes a little luck.


     became 成為 trainee 實習生act 演戲 training 訓練 if 如果leave 離開expert 專家'
  shared_asset: g3_36_39
  ai_answers:
    gemini: B
    qwen: B
  answer:
  - B
  answer_status: ai_generated
  answer_source: ai:gemini+qwen
