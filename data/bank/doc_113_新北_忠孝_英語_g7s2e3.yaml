  group_stem: "(40~42) (每題3 分)\n\nThe Met – A Famous Art Museum\n\nThe Met (The Metropolitan\
    \ Museum of Art) is a big and famous museum in New York City. It opened in 1870.\
    \ Today, there are about four million pieces of art from many places in it. It\
    \ is one of the famous museums in the world. Every year, many people visit the\
    \ Met to see art from different times and places.\n\nAt the Met, you can see old\
    \ but famous things or paintings by famous artists like Van Gogh and Monet. One\
    \ very cool place at the Met is the Temple of Dendur. It is an old temple from\
    \ Egypt. People moved it to New York and put it inside the museum. Many visitors\
    \ like to see it. The garden on the top of the Met is also great. From there,\
    \ you can see Central Park and the tall buildings of New York. It is open in warm\
    \ months and is a nice place to rest.\n\nThe Met is a great place to learn about\
    \ art. If you visit New York, don’t miss it! But if New York is too far, don’t\
    \ worry. This summer, the National Palace Museum in Taiwan will show 81 real works\
    \ from the Met. The show is from June 14 to October 12, and it is open from 9\
    \ a.m. to 5 p.m. This summer, maybe you can go and learn more about the world.\n\
    \n metropolitan 大都會的 million 百萬 artist 藝術家 Egypt 埃及 move 搬garden 花園 \nfar 遠 National\
    \ Palace Museum 故宮博物館 will 將"
