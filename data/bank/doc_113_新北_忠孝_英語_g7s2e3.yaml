  group_stem: "(43~45) (每題3 分)\nDo Plants Talk?                   ICRT News for Kids\
    \ 5/23\nSome of us talk to our plants. Did you know that plants talk, too? But\
    \ they don't talk like we do. And we can't hear them talk. So how do we know that\
    \ plants talk? Scientists studied two groups of plants: healthy plants and stressed\
    \ plants. Some stressed plants needed water. Some were cut!\nThe scientists put\
    \ microphones next to the plants. These microphones found sounds we can’t hear.\
    \ The scientists made the sounds louder with a computer. They heard clicks and\
    \ pops! They studied the sounds. What did they find? Healthy plants made almost\
    \ no sounds. But stressed plants could make up to forty sounds in one hour!\n\
    The scientists said maybe the clicks and pops tell other plants there is danger.\
    \ They said maybe animals and insects can hear the plants. So maybe the animals\
    \ won’t eat the stressed plants. Maybe the insects won’t lay eggs on them. The\
    \ scientists think farmers can use microphones one day. Then farmers will know\
    \ which plants need help. \nLook at the plants around you. Do they need water?\
    \ They might be trying to tell you!"
  ai_answers:
