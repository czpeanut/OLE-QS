- id: doc_113_台中_向上_國文_g8s2e1_s2_1
  section: 2
  number: 1
  type: single
  page: 2
  stem: 根據本文，植物能夠朝向陽光生長的主要原因是什麼？
  options:
  - label: A
    content: 植物對水分的需求
  - label: B
    content: 生長素在植物內部移動
  - label: C
    content: 植物能聽見光線的聲音
  - label: D
    content: 植物的根部會自動向上生長。
  group_stem: "(一)植物的感知能力  \n    你或許認為植物是沒有感知能力的，因為它們不會像動物一樣移動或發出聲音。然而，科學研究顯示，植物其實能夠感知環境的變化，甚至做出反應。\
    \ \n    首先，植物能夠感知光線的方向，這就是為什麼植物會朝向陽光生長。這種現象稱為「向光性」，主要由植物中的生長素控制。當某一側接受到較少光線時，生長素會移動到那一側，促使細胞生長，使植物彎向光源。\
    \ \n    其次，植物也能「聽見」聲音。有研究發現，某些植物的根部會對特定頻率的聲波作出反應。例如，豆類植物的根會朝向播放水流聲的地方生長，顯示它們能夠感知並尋找水源。\
    \ \n    此外，植物還能「聞到」其他植物發出的化學信號。當植物受到昆蟲攻擊時，會釋放出特定的化學物質，提醒附近的植物提高防禦能力，分泌讓昆蟲討厭的物質或吸引天敵來幫助驅趕害蟲。\
    \ \n    這些研究結果顯示，雖然植物沒有神經系統，它們仍然能夠透過不同的方式感知環境，並作出適應性的反應，確保自己的生存與繁衍。"
  tags:
    textbook: 八下 第六課 迷途羔羊──弗氏海豚
    labeled_by: ai
    chapter:
      publisher: 康軒
      book: 八下
      subject: 國文
      code: 第六課
      title: 迷途羔羊──弗氏海豚
      chapter: null
