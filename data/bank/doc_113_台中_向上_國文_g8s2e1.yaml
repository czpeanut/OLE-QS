    content: 「萬里赴戎機，關山度若飛」寫行軍快速，出征之後節節勝利
  - label: B
    content: 「朔氣傳金柝，寒光照鐵衣」藉天氣嚴寒，描寫北方征戰生活的艱辛
  - label: C
    content: 「策勳十二轉，賞賜百千強」用誇張手法寫天子對木蘭的厚賞。
  - label: D
    content: 「兩兔傍地走，安能辨我是雄雌?」以兔為喻，提醒世人眼見不一定為憑。
