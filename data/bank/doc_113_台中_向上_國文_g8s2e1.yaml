  section: 1
  number: 18
  type: single
  page: 1
  stem: 關於樂府詩與古體詩的特色，下列何者錯誤？
  options:
  - label: A
    content: 樂府詩與古體詩的格律較為自由，不像近體詩有嚴格的平仄與對仗規則
  - label: B
    content: 樂府詩與古體詩兩者都是以五言、七言為主，亦有雜言。
  - label: C
    content: 古體詩內容以抒情為主，多寫個人感懷，表達離情別愁、對生命的哀傷；樂府詩因承襲民歌傳統，較常描寫社會現實與民生疾苦
  - label: D
    content: 樂府詩名稱起源於漢代的樂府機構，原為配樂歌唱的詩歌，而古體詩則是相對於近體詩而言的泛稱。
