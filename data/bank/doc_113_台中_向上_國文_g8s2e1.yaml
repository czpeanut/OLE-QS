  stem: 關於〈一棵開花的樹〉的寫作手法，下列敘述何者正確?
  options:
  - label: A
    content: 將「五百年」的漫長與「遇見」、「走過」的短暫相互映襯，凸顯女子被忽視的失落心情
  - label: B
    content: 全詩採用誇飾及譬喻手法，描寫女子的殷切期盼
  - label: C
    content: 寫實筆法掌握精準，藉由開花的樹刻畫女子對感情的殷切期盼
  - label: D
    content: 詩中透過敘述一棵樹從種子發芽到開花的自然過程，細緻描繪愛情的成長歷程。
