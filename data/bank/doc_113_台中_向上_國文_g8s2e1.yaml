  section: 1
  number: 10
  type: single
  page: 1
  stem: 下列文句，何者錯字最少?
  options:
  - label: A
    content: 光晞冷寞的走開，令慕橙的心如落花般凋零迨盡。這墓深具炫染力，令觀眾為之動容，也為他們的愛情感到遺撼不已。
  - label: B
    content: 〈木蘭詩〉敘述木蘭代父出徵，遠赴沙場英勇憤戰，最後凱玄規國的故事，成功的朔造出木蘭巾幗英雄的形象。
  - label: C
    content: 看到海豚破水跳耀的順間，我總要深吸一口氣，事實上也沒有絲豪間隙讓人喘氣，牠總是那樣急躁、驚荒，甚至是歇斯底里。
  - label: D
    content: 這是欣寧的第一次約會，為此，她嗔重的穿上新買的洋裝，雖然緊張得全身擅抖，但她仍用心准備，期代能給心怡的對象留下一個好印象。
