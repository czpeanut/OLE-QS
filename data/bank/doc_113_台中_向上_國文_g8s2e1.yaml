  section: 1
  number: 9
  type: single
  page: 1
  stem: 考古學家在絲綢之路遺址發現了一首詩歌殘篇，經比對後，哪一句最可能來自北朝樂府？
  options:
  - label: A
    content: 門前一株棗，歲歲不知老。阿婆不嫁女，那得孫兒抱？
  - label: B
    content: 始欲識郎時，兩心望如一。理絲入殘機，何悟不成匹。
  - label: C
    content: 秋風入窗裡，羅帳起飄揚。仰頭看明月，寄情千里光。
  - label: D
    content: 採蓮南塘秋，蓮花過人頭。低頭弄蓮子，蓮子青如水。
