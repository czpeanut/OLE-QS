  stem: 舒華看到了一張捐血招募文宣（如右上圖），文宣上畫著捐血者手臂以長管連接著捐血袋。後來舒華去參加捐血活動，在捐血之前，醫護人員先在她的手臂上半部綑綁橡皮軟管（如右下圖），說這樣可以讓抽血的過程更加順利。根據血液循環的概念，下列敘述何者錯誤？
  options:
  - label: A
    content: 軟管的綑綁可以讓回流心臟的血液受阻，使得累積在手臂下半部（橡皮軟管至手掌之間）的血量增加
  - label: B
    content: 捐血過程中，是從靜脈內抽取血液
  - label: C
    content: 血液回流如果受阻，就有更多血液流入捐血袋，能夠更快收集到足量血液
  - label: D
    content: 捐血之後可補充鈣質含量較高的食物，幫助造血
