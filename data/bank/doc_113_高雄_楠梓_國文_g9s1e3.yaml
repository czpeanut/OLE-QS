  stem: 「這年頭到底什麼是主食，什麼是零食？小時候媽媽總是說，正餐之前不可以吃零食（其實正餐之後和之間也不行），但是這條原本清楚嚴明的分界線，現在逐漸變得漫漶模糊，甚至互相錯位了。」請問誰對這段話的理解是正確的？
  options:
  - label: A
    content: 金田一：以往媽媽的管教過於嚴格，現今教育比較民主開放
  - label: B
    content: 柯南：隨著時代變遷，人們分辨主食、零食的標準逐漸不同
  - label: C
    content: 小五郎：現今的零食貨架上，商品五花八門，令人目不暇給
  - label: D
    content: 福爾摩斯：零食的營養成分高，取得較方便，可以取代主食
  lesson_raw:
    title: 我們的饕餮時代
    basis: 引用課文《我們的饕餮時代》
