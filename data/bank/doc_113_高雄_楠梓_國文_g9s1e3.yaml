  section: 1
  number: 10
  type: single
  page: 1
  stem: 設問中的「提問」，是心中已有定見，透過一問一答的方式，將答案敘述出來。下列何者屬於「提問」？
  options:
  - label: A
    content: 君自故鄉來，應知故鄉事。來日綺窗前，寒梅著花未？
  - label: B
    content: 春眠不覺曉，處處聞啼鳥。夜來風雨聲，花落知多少？
  - label: C
    content: 結廬在人境，而無車馬喧。問君何能爾？心遠地自偏。
  - label: D
    content: 學而時習之，不亦說乎？人不知而不慍，不亦君子乎？
