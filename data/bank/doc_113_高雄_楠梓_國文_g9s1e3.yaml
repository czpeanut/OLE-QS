    揀盡寒枝不肯棲，寂寞沙洲冷。」關於此詞的敘述，何者正確？'
  options:
  - label: A
    content: 借孤鴻自況，表述自我隱居山林、不問世事的悠然豁達
  - label: B
    content: 由「有恨無人省」反襯自己力爭上游、不甘寂寞的意志
  - label: C
    content: 透過「漏斷」、「疏桐」、「沙洲」等營造溫暖明亮的意象
  - label: D
    content: 藉「揀盡寒枝不肯棲」表明自己有所為有所不為的節操
