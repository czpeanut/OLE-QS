  section: 1
  number: 18
  type: single
  page: 2
  stem: 下列何者最能展現劉鶚善於鎔鑄新詞，描畫景物的特色？
  options:
  - label: A
    content: 看那大門裡面楹柱上有副對聯，寫的是「四面荷花三面柳，一城山色半城湖」
  - label: B
