    content: 嗜吃甜點、炸雞、燒烤類的老饕大多為超級味覺者，BMI 通常略低於無感味覺者
  group_stem: '超級味覺者在舌頭上擁有更多乳突，具備更多味蕾及味覺細胞，導致對各種味覺感受強烈，因此對甜食及油膩的食物較快感到厭煩，身體質量指數（BMI）通常稍微低於無感味覺者。

    女性超級味覺者多於男性，且亞洲人的比例大於其他種族，廚師也比較可能是超級味覺者，因為他們的味覺世界較強烈。味覺除了左右職業生涯走向外，也會影響其他行為，而且並非都是有益的。

    超級味覺者不喜歡各種多葉綠色蔬菜，因此對蔬菜敬而遠之。主要因為多葉綠色蔬菜富含生物鹼，而生物鹼嘗起來是苦的。但是，蔬菜攝取量不足是癌症的危險因子之一。康乃迪克大學醫學教授發現，在接受例行大腸鏡檢查的老年男性中，超級味覺者具有較多大腸息肉，而大腸息肉正是大腸癌的先兆。在老年女性的婦科癌症方面，也觀察到類似的狀況。

    另一個與味覺者狀態相關的行為是酗酒。無感味覺者在酗酒者中占的比例，高於一般味覺者與超級味覺者。由於酒精嘗起來有苦味，為了喝酒必須克服對苦味的厭惡感，但若對苦味不怎麼敏感，需要克服的地方就比較少，因此可輕易地喝更多的酒。

    （改寫自瑞秋．赫茲著、李曉筠譯氣味的奇幻力量）'
