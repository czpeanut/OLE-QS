    content: 由網路銀行發行的一種法定貨幣，使用之後會留下紀錄
  group_stem: "什麼是「電子貨幣」和「虛擬貨幣」？\n◎什麼是「電子貨幣」？\n  從琥珀、貝殼、珍珠，到黃金、白銀，以及現在我們生活中會使用的硬幣、紙鈔，或是信用卡、手機等，錢的型態不斷演變。\n\
    \  也許你會好奇：「如果錢看起來一點都不像是錢，甚至我們根本看不到它，那麼錢還能算是錢嗎？」其實，「電子貨幣」代表的仍然是等值的法定貨幣，但不同的是運用電子化的方式，透過電腦系統把錢從一家銀行轉到另一家銀行，從這個人的帳戶移到另一個人的帳戶。換句話說，貨幣並沒有真的消失，只是換了一種形式－－電子化了。\n\
    \  當然，拿一張沒有儲值的悠遊卡或隨便一張塑膠卡片，是沒有辦法跟商店買東西的。但是從實體的紙鈔、硬幣到電子貨幣，除了更加便利之外，差別並不是那麼的大。\n\
    ◎什麼是「虛擬貨幣」？\n  「虛擬」是在描述一種不是具體存在的狀況，你既看不見也摸不著，完全是模擬出來的。現在有愈來愈多的「虛擬貨幣」被創造出來，這種貨幣並不是由國家發行的法定貨幣，通常也沒有實體化的鈔票或硬幣，是由某些人或群體所創造。\n\
    \  虛擬貨幣在運作上也跟傳統貨幣一樣，每一枚虛擬貨幣都是一串特殊編碼，當你使用後會留下紀錄，所以未來就不再能用同一枚虛擬貨幣去購買東西。這就像是真的錢一樣：一旦花用了，就不見了！當世界上有愈來愈多人相信它所代表的價值，就可以用它們來購買真實的貨品或是勞務。\n\
    ◎什麼是「比特幣」？\n  目前在虛擬貨幣中最盛行的是「比特幣」。比特幣是用電腦運算而產生和儲存，用戶可以使用自己的電腦，運用某些運算來換取比特幣，這樣的過程被暱稱為「電腦挖礦」。\n\
    \  用來存放比特幣的撲滿就是電腦、手機或其他電子載具。比特幣的交換會採取一組保密的特殊編碼，用來預防被複製或被竊取。比特幣並不屬於特定的銀行或機構，透過比特幣所進行的交易或金錢移轉是不受各國政府監管的。\n\
    \  這樣的貨幣可靠嗎？與一般國家發行的貨幣相比，虛擬貨幣當然是具有較高風險的，如果有一天大家突然不再相信這種虛擬貨幣的價值，虛擬貨幣就會突然崩跌，甚至變得一文不值。\n\
    （節選自《為什麼我不能把錢花光？──一起學習個人理財》親子天下）"
