    \ 年寧海縣的疫病，便是當地人食用海鰍所致。\n  當疫病流行，政府通常令翰林院醫官、太醫局派人巡診賜藥，如紹興26 年，臨安疫，宋高宗令醫官配製小柴胡湯醫治患者。改善環境衛生也是一項作為，如真德秀任職泉州時，見城內溝渠淤塞，蒸為癘疫，乃下令清理。為防止疫情擴散，政府也採取隔離病人的措施，如元祐4\
    \ 年，杭州因乾旱而發生大疫，蘇軾設立專門的「病坊」來收治患者。蘇軾在杭州的賑災抗疫，不僅蘇轍在其兄的墓誌銘有具體記載，明代醫也說蘇軾以「聖散子」這帖藥方為滿城病患施救。後來，政府以「安濟坊」為名在地設置這類病坊，持續推行「以病人輕重而異室處之，以防漸染」。\n\
    （改寫自韓毅 宋代政府應對疫病的歷史借鑒）\n\n(乙)明年方春，即減價糶常平米，民遂免大旱之苦。公又多作饘粥、藥劑，遣吏挾醫分坊治病，活者甚眾。公曰：「杭，水陸之會，因疫病死比他處常多。」乃裒羨緡得二千，復發私橐得黃金五十兩，以作病坊，稍蓄錢糧以待之。\n\
    （蘇轍 東坡先生墓誌銘）\n註：①糶：音ㄊㄧㄠˋ，出售穀物。        ②裒：音ㄆㄡˊ，聚集。\n  ③羨緡：盈餘款項。緡：音ㄇㄧㄣˊ。    ④橐：音ㄊㄨㄛˊ，袋子。"
