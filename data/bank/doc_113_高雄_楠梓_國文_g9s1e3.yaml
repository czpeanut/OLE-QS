  - label: D
    content: 以耳代口，辨察食物
  group_stem: '何謂耳餐？耳餐者，務名之謂也。貪貴物之名，誇敬客之意，是以耳餐非口餐也。不知豆腐得味，遠勝燕窩；海菜不佳，不如蔬筍。余嘗謂雞、豬、魚、鴨，豪傑之士也，各有本味，自成一家；海參、燕窩，庸陋之人也，全無性情，寄人籬下。嘗見某太守宴客，大碗如缸，白煮燕窩四兩，絲毫無味，人爭誇之。余笑曰：「我輩來吃燕窩，非來販燕窩也。」可販不可吃，雖多奚為？若徒誇體面，不如碗中竟放明珠百粒，則價值萬金矣，其如吃不得何！

    （袁枚 隨園食單 戒單）'
