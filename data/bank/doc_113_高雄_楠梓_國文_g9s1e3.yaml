  options:
  - label: A
    content: 好奇
  - label: B
    content: 自信
  - label: C
    content: 恆心
  - label: D
    content: 天賦
  group_stem: '下列四個框內中的圖形，哪一個性質與其他三個不同？

    A B C D


    對於上面這個問題，你是怎麼回答的呢？要是你選擇的是B，那就恭喜你答對了。因為圖形B 是唯一   甲  的圖形。

    不過，也許有人會選擇圖形C。因為   乙   的圖形只有C 一個，所以會被認為與其他圖形不同。確實如此，這也是正確答案。答A 也是可以的。因為A 是唯一   丙   的圖形，所以A
    也是正確答案。那麼，D 又怎樣呢？這是唯一一個   丁   的圖形，因此D 也是正確答案。換句話說，由於看圖形的角度不同，四種答案全都正確。

    「正確答案只有一個」這種思維模式，在我們頭腦中已不知不覺地根深柢固。事實上，若是某種數學問題的話，說正確答案只有一個是對的。麻煩的是，生活中大部分事物並不像某種數學問題那樣。生活中解決問題的方法並非只有一個，而是多種多樣。由於情況的變化，原來行之有效的方法，到了現在往往不靈了。正因為如此，如果認為正確答案只有一個的話，當你找到某個答案以後，就會止步不前。因此，不滿足於一個答案，不放棄探求，這一點非常重要。

    然而，尋求第二種答案，或是解決問題的其他路徑和方法，有賴於創造性的思維。那麼，創造性的思維又有哪些必須的要素呢？

    有人是這樣回答的：「富有創造性的人總是孜孜不倦的汲取知識，使自己學識淵博。從古代史到現代技術，從數學到插花，似乎不精通各種知識就會一事無成。因為這些知識隨時都可能進行組合，形成新的創意。這種情況可能出現在六分鐘之後，也可能在六個月之後，六年之後。但當事人堅信它一定會出現。」

    我對此完全贊同。知識是形成新創意的素材。但這並不是說，光憑知識就能擁有創造性。發揮創造力的真正關鍵，在於如何運用知識。創造性的思維，必須有探求新事物，並為此活用知識的態度和意識，在此基礎上，持之以恆的進行各種嘗試。

    這方面的典型代表，首推約翰尼斯．古騰堡。他將原來毫不相關的兩種機械－－葡萄榨汁機和硬幣打製器組合起來，開發了一種新產品。因為葡萄榨汁機用來把葡萄榨出汁，所以它在大面積上均等加力。而硬幣打製器的功能則是在金幣之類的小平面上打出印花來。有一天，古騰堡半開玩笑的自言自語道：「是不是可以在幾個硬幣打製器上加上葡萄榨汁機的壓力，使之在紙上列印出印花來呢？」由此發明了印刷機和排版術。

    另一個例子是羅蘭．布希內爾。一九七一年的一天，布希內爾邊看電視邊這麼想：「光看太沒意思了。能不能把電視接收器作為試驗物件，看能產生什麼反應？」此後不久，他就發明了互動式的乒乓球電子遊戲，從此開始了遊戲機的革命。

    不過，這種創造性的思維是否任何人都具備呢？是否存在富有創造力和缺乏創造力的區別呢？某心理學專家小組，以實際從事創造性工作的人與不從事此類工作的人為對象，進行了調查研究，並得出如下結論：「富於創造力的人，認為自己具有創造力；缺乏創造力的人，不認為自己具有創造力。」

    認為「我不具備創造力」的人當中，有的覺得創造力僅僅是貝多芬、愛因斯坦以及莎士比亞他們的，從而自我限制。不言而喻，在創造的宇宙裡，貝多芬、愛因斯坦、莎士比亞是光輝燦爛的明星，然而在大多數情況下，即便是他們，也並非輕而易舉就能獲得如此非凡的靈感。相反，這種非凡的靈感，往往產生於這樣的過程：關注極其普通、甚至一閃念的想法，並對它反覆推敲，逐漸充實。

    由此看來，區分一個人是否擁有創造力，主要根據之一是：擁有創造力的人留意自己細微的想法。即使他們不知道將來會產生怎樣的結果，但他們很清楚，小的創意會打開大的突破口，並堅信自己一定能使之變為現實。

    任何人都擁有創造力，首先要堅信這一點。關鍵是要經常保持好奇心，不斷積累知識，不滿足於一個答案，而去探求新思路，去運用所得的知識。一旦產生小的靈感，相信它的價值，並鍥而不捨地把它發展下去。如果能做到這些，你一定會成為一個富有創造性的人。

    （羅迦．費．因格事情的正確答案不只一個）'
