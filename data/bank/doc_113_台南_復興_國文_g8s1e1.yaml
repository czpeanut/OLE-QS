- id: doc_113_台南_復興_國文_g8s1e1_s4_2
  section: 4
  number: 2
  type: fill
  page: 1
  stem: '娘家門口有棵小樹，雖然瘦弱，但纍纍青果把整樹的枝椏都給拉彎，青果的重擔壓得她只能低垂著頭又彎腰駝背，彷彿在為自己無用的多產而羞愧。沒有人知道這滿樹青果有何用處。

    幾年前，有位嫁到附近村莊的越南姑娘向母親要青果。這被越南姑娘稱為「橄欖」的青果，是越南橄欖，是東南亞常見的果樹。青綠的生果酸澀不已，卻能做菜、軟化肉質，切絲涼拌則不輸泰國青木瓜沙拉，還可製成蜜餞、果醬，當小孩的零嘴。

    知道果實能吃後，樹就有了用處，於是也得到愈來愈多的關愛眼神。我們不只自己摘來吃，也送給親朋好友，大家都很喜歡，等不及的甚至會自己來採，現在我們想吃都不容易有。

    小樹身世成謎之時，纍纍青果累得她彎腰低頭，真相大白後，被人識得用處，果兒給摘得精光，她於是能抬頭挺胸，在同排果樹中，活出樹的尊嚴，但同時又要承載人的期望，不停的產出青果。

    無用時，馱背自身生命的重擔；有用時，受他人的期望剝削。不知道哪一種比較累？

    ——改寫自王書緋〈青果之累〉

