  stem: 根據本文，目與鏡的關係為何？
  options:
  - label: A
    content: 目可見他物，鏡須仰賴目，因而鏡不如目
  - label: B
    content: 目不可見己面，須求助於鏡方可省視自身
  - label: C
    content: 目比鏡更為珍貴，無須藉由鏡來肯定自我
  - label: D
    content: 目與鏡價值相等，可從二者中擇一來助己
  group_stem: '(四)

    　　五官莫明於目。面有黑子①，而目不知，烏②在其為明也？目能見物，而不能見吾之面，假於鏡而見焉。鏡之貴不如目，鏡不求目，而目轉求助於鏡。然世未嘗以鏡之助目，而咎目之失明。鏡何負於目哉！

    　　客有任目③而惡鏡者，曰：「是好苦我④。吾自有目，烏用鏡為⑤？」久之，視世所稱美人，鮮當意者⑥，而不知己面之黑子，泰然謂：「美莫己若⑦。」左右匿笑⑧，客終不悟。悲夫！

    (錢大昕〈鏡喻〉)

    【注】①黑子：黑痣。 ②烏：何，怎麼。 ③任目：順任眼睛。 ④是好苦我：這(鏡子)是喜歡為難我。 ⑤烏用鏡為：何必要用鏡子呢？ ⑥鮮當意者：很少有中意的。
    ⑦莫己若：即「莫若己」，沒有人比得上自己。 ⑧匿笑：暗地裡笑。'
