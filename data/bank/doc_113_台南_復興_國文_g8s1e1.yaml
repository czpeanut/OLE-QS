- id: doc_113_台南_復興_國文_g8s1e1_s7_6
  section: 7
  number: 6
  type: single
  page: 7
  stem: 根據本文，「我」開始頻繁登山的原因為何？
  options:
  - label: A
    content: 想要逃避現實，登山尋找新的生活目標
  - label: B
    content: 因害怕失去一切，想找到真正的 Kevin
  - label: C
    content: 由於之前山難失憶，想藉登山恢復記憶
  - label: D
    content: 刻意要疏遠安，以免被她發現真實身分
  group_stem: '(三)

    　　「今天不用咖啡嗎？」

    　　我在便利商店結帳櫃檯愣住，搖了搖頭。

    　　我不知道店員把我認成誰了，我從沒有來過這家店，我甚至沒有來過這個城鎮。我只是因為站名琅琅上口，才選擇在這裡下火車。

    　　我因為某些原因離家，決定找一個地方展開新生活。

    　　走在路上的時候，有輛車搖下車窗，駕駛對我揮手大喊 Kevin，但我根本不叫 Kevin。

    　　半小時後，我又聽見有人喊我 Kevin，這次是一個朝我奔來的陌生女人。她撲進我懷中，臉上都是淚水。我沒有推開她，我從沒見過這麼美的女人。

    　　女人叫安。她問了我許多問題，我都無法回答，但她卻自己找了解釋，她說我一定是山難創傷太深，失去了記憶。

    　　我從安口中慢慢拼湊出來龍去脈。她的老公 Kevin 一年前登山失蹤，她雇了許多專家上山找人，卻都沒有結果。正當她打算放棄的時候，我就出現了。

    　　安帶我回家，我一看到牆上的婚紗照就明白了，Kevin 長得跟我一模一樣，不可思議地相像。

    　　安讓我戴 Kevin 的名錶，聽 Kevin 的百萬音響，開 Kevin 的跑車，希望能喚起我的記憶。我當然什麼都想不起來，但我不再堅持她認錯人了。

    　　我成為 Kevin，五間連鎖餐廳的老闆，一個擁有豪宅名車和漂亮妻子的成功男人。

    　　我彷彿活在天堂，日日過著夢想中的生活。我這輩子從來沒有這麼幸福，也從來沒有這麼害怕。我怕真正的 Kevin 會回來。

    　　我不顧安反對，開始一個人登山。我像是著魔般三天兩頭就往山裡去，我沒辦法控制我自己，我必須要親眼確認，我要找到 Kevin 的屍體，才能將我從恐懼的惡夢中解放出來。

    　　我因為登山疏遠了安，我們的情感情出現裂痕。餐廳的擴店計畫我也都擺爛，投資人的抱怨越來越多。但我相信這些都只是暫時的，只要找到 Kevin，我就可以回來專心當
    Kevin，搞定這些鳥事。

    　　我花了十三個月，幾乎把整座山都走遍了，卻什麼也沒找到。

    　　有天我終於受夠了，提早下山，走進家門卻聽見奇怪的聲響。我打開臥室，看見安和一個男人在一起。

    　　幸福徹底瓦解了。安搬了出去，離婚協議書和餐廳貸款違約文件一起寄來，房屋被強制抵押，我流落街頭，瞬間失去了一切，跌入最深最黑的地獄。

    　　我坐上火車，回到家鄉。

    　　我離開家鄉的時候，從沒想過有一天會再回來。當年我一邊在夜市賣羊肉湯，一邊照顧生病的妻子，每天睡不到三個小時，被生活壓得喘不過氣，好幾次都想自我了結。

    　　不知為何，過去我天天嫌棄妻子，現在竟然無比想念她。

    　　我走進一家氣派餐廳，點了最便宜的料理，打算吃飽再回家。等待上菜的時候，隔壁桌大媽的談話聲傳入我耳中。

    　　她們說這家餐廳原本只是夜市一個沒人光顧的羊肉湯攤位，態度很差的老闆有天不知為何消失，只靠生病的老婆苦撐。結果有天老闆回來了，卻像變了一個人，不僅做事認真態度親切，料理也變好吃了。傳說老闆消失那段時間出了意外，整個人失憶，性格才會一百八十度轉變。

    　　「妳看，那就是老闆和老闆娘。」大媽說。

    　　我不敢相信，一個跟我長得一模一樣的男人正和我的妻子有說有笑，摟摟抱抱。

    　　我發現妻子容光煥發，病似乎養好了，看起來美極了。

    　　我終於明白了，明白為何我把整座山都翻遍也找不到 Kevin，因為 Kevin 一直都在這裡。

    　　我去大賣場購買繩索、汽油和刀，來到餐廳旁的暗巷中等待，等待 Kevin 落單的時刻。

    　　每個人都該有第二次機會，這次我保證不會再搞砸了。

    (改寫自東澤〈第二人生〉)'
