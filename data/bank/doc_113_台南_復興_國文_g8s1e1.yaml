  stem: 根據本文，下列敘述何者正確？
  options:
  - label: A
    content: 落花生的好處包含美味、可製油、價廉，既有用又兼具美學價值
  - label: B
    content: 落花生可製成各種食品，經濟效益大，作者認為應多加推廣發揚
  - label: C
    content: 由於全家五人分工合作，共同種植落花生，才促成此次茅亭集會
  - label: D
    content: 父親期望孩子們如同落花生般，含蓄地累積實力，成為有用之人
  group_stem: '(二)

    　　我們屋後有半畝隙地。母親說：「讓它荒蕪著怪可惜，既然你們那麼愛吃花生，就闢來做花生園罷。」我們姊弟幾個都很喜歡，——買種的買種，動土的動土，灌園的灌園；過不了幾個月，居然收穫了！媽媽說：「今晚我們可以做一個收穫節，也請你們爹爹來嘗嘗我們的新花生，如何？」我們都答應了。

    　　母親把花生做成好幾樣食品，還吩咐這集會要在園裡的茅亭舉行。那晚上的天色不大好，可是爹爹也到了，實在很難得！爹爹說：「你們愛吃花生嗎？」我們都爭著答應：「愛！」「誰能把花生的好處說出來？」姊姊說：「花生的氣味很美。」哥哥說：「花生可以製油。」我說：「無論何等人都可以用賤價買它來吃，都喜歡吃它。這就是它的好處。」

    　　爹爹說：「花生的用處固然很多，但有一樣是很可貴的。這小小的豆不像那好看的蘋果、桃子、石榴，把它們的果實懸在枝上，鮮紅嫩綠的顏色，令人一望而發生羨慕的心；它只把果子埋在地下，等到成熟，才容人把它挖出來。你們偶然看見一棵花生瑟縮的長在地上，不能立刻辨出它有沒有果實，必得等到你接觸它，才能知道。」我們說：「是的。」母親也點點頭。爹爹接下去說：「所以你們要像花生，因為它是實用的，不是偉大、好看的東西。」我說：「那麼人要做有用的人，不要做偉大、體面的人了。」爹爹說：「這是我對於你們的希望。」我們談到夜闌才散，所有的花生食品雖然沒有了，然而父親的話現在還印在我心版上。

    (許地山〈落花生〉)'
