  stem: 依據本文的內容詮釋，何者正確？
  options:
  - label: A
    content: 曹某為捉鬼而堅持下榻於友人書屋
  - label: B
    content: 女鬼以「吊死鬼」及「無頭鬼」的面目出現
  - label: C
    content: 曹某對鬼的態度是先禮敬，後恐嚇
  - label: D
    content: 曹某見女鬼變不出新花樣因此感到非常掃興
  group_stem: '曹司農竹虛言：其族兄自歙往揚州，途經友人家。時盛夏，延坐書屋，甚軒爽，暮欲下榻其中。友人曰：「是有魅，夜不可居。」曹強居之。夜半，有物自門隙蠕蠕入，薄如夾紙。入室后，漸開展作人形，乃女子也。曹殊不畏。忽披髮吐舌作縊鬼狀，曹笑曰：「猶是髮，但稍亂；猶是舌，但稍長，亦何足畏?」忽自摘其首置案上。曹又笑曰：「有首尚不足畏，況無首耶！」鬼技窮，倏然滅。及歸途再宿，夜半，門隙又蠕蠕，甫露其首，輒唾曰：「又此敗興物耶?」竟不入。

    清‧紀昀《閱微草堂筆記》'
