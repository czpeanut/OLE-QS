- id: doc_113_台南_民德_國文_g9s2e1_s2_4
  section: 2
  number: 4
  type: single
  page: 1
  stem: 「鐵板沙連到七鯤，鯤身激浪海天昏。任教巨舶難輕犯，天險生成鹿耳門。」詩中首句「鐵板沙連到七鯤」的「連」字，在視覺上予人何種印象？
  options:
  - label: A
    content: 來自遠方的波濤到了岸邊變得澎湃洶湧
  - label: B
    content: 鹿耳門由天然屏障形成的防線非常穩固
  - label: C
    content: 鯨豚在鹿耳門外海自在浮沉的獨特景致
  - label: D
    content: 鹿耳門周遭的綺麗風光讓遊人流連忘返
  tags:
    chapter:
      publisher: 南一
      book: 九下
      subject: 國文
      code: 第六課
      title: 水神的指引
      chapter: null
