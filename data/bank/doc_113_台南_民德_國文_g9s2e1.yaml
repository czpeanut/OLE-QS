- id: doc_113_台南_民德_國文_g9s2e1_s2_15
  section: 2
  number: 15
  type: single
  page: 2
  stem: 「元曲包括散曲與雜劇，作家在形式、音調與精神上，展拓了豐富的創造性，賦予了強韌的新生命，堪稱是元代的靈魂。因為元代是蒙古人統治的時代，漢人受異族歧視，讀書人更是沒有出路，形成一個價值錯亂、是非顛倒的世界，原有的秩序和尊嚴，都不復存在。要在這樣的時代生存，勢必要突破傳統的思維，才能開創生機；士人的地位一落千丈，當他們融入平民生活後，看到的世界更真實，體會到的生命更真切，所以作品呈現的內涵就更多姿多采了。」關於這段文字，下列敘述何者錯誤？
  options:
  - label: A
    content: 元曲的流行使得當時的價值觀錯亂、是非顛倒，原有的秩序和尊嚴，都不復存在
  - label: B
    content: 散曲與雜劇之所以堪稱元代靈魂，是因為形式、音調與精神拓展了豐富的創造性
  - label: C
    content: 元代作品呈現的內涵之所以更多姿多采，源自於漢人受歧視，讀書人沒有出路
  - label: D
    content: 散曲與雜劇在形式、音調與精神上，展拓了豐富的創造性，賦予了強韌的新生命
