  section: 3
  number: 10
  type: single
  page: 6
  stem: 根據本文描述煉製硫磺的過程，下列說明何者正確？
  options:
  - label: A
    content: 開始就將油料與硫土裝滿大鍋子
  - label: B
    content: 攪拌過程須由一個工人持鐵鍬為之
  - label: C
    content: 攪拌過程中需視情況加油或加土
  - label: D
    content: 煉製好壞的成果可以差千倍以上
  group_stem: '煉法：槌碎如粉，日曝極乾，鑊中先入油十餘觔，徐入乾土，以大竹為十字架，兩人各持一端攪之。土中硫得油自出，油土相融，又頻頻加土加油，至於滿鑊。約入土八九百觔，油則視土之優劣為多寡。工人時時以鐵鍬取汁，瀝突旁察之，過則添土，不及則增油。油過不及，皆能損硫。土既優，用油適當，一鑊可得淨硫四五百觔，否或一二百觔乃至數十觔。關鍵處雖在油，而工人視火候，似亦有微權也。

    注釋：觔，同「斤」

    郁永河《裨海紀遊》'
