- id: doc_113_台南_民德_國文_g9s2e1_s3_1
  section: 3
  number: 1
  type: single
  page: 4
  stem: 依據上文，Ⅰ、Ⅱ兩件作品中，何者是羅馬人？
  options:
  - label: A
    content: 甲、丙
  - label: B
    content: 甲、丁
  - label: C
    content: 乙、丙
  - label: D
    content: 乙、丁。
  group_stem: '「強擄薩賓婦女」以大理石雕成，高410 公分，是詹博洛尼亞完成於1583 年的名作。整座雕塑從底端的薩賓男人到頂端的被擄婦女，如螺旋般盤伸向上，環繞一周，方能從不同角度欣賞這件作品的全貌。婦女試圖掙脫與張口呐喊的驚駭、羅馬士兵抱起婦女且指頭掐入婦女背部的強悍、蹲地男子激烈反抗卻無力阻止的痛苦，栩栩如生，讓觀者彷彿身歷其境。

    傳說中，由母狼撫養長大的羅穆盧斯是羅馬城的創建者，他雖號召許多移民前來羅馬，但這些來自四面八方的異鄉人多是男性，若沒有女性，便無法繁衍後代，壯大城邦。於是他邀請鄰近部族薩賓人到羅馬參加宴會，待薩賓男人酒醉後，羅馬人發動奇襲，擄走七百多名薩賓婦女做他們的妻子。

    薩賓男人嚥不下這奇恥大辱，秣馬厲兵數年，向羅馬人宣戰，想奪回家人。但薩賓女人已在羅馬落地生根，手心手背都是肉，當然不願任何一方受傷。這時，已是羅穆盧斯妻子的薩賓國王之女赫西莉亞，率領薩賓婦女帶著兒女衝入戰場。最終兩軍和解，同意融為一體，共創羅馬的未來。

    畫家路易‧大衛的「薩賓婦女」，描繪的就是這關鍵時刻。握緊利劍的是兒女的舅舅，高舉長矛的是兒女的父親，儘管她手無寸鐵，仍堅毅的張開雙臂，力阻雙方互鬥。身處十八世紀末法國大革命時期的大衛，眼見他所屬的雅各賓黨為掃除政治異己而走向極端，遂在獄中以這幅畫借古諷今，表達慨歎。

    古羅馬記述這個傳說的史家多認為：羅穆盧斯的劫掠計畫，一是為了讓羅馬生生不息，二是製造羅馬人和薩賓人建立關係的機會，藉婚姻形成政治聯盟。薩賓人曾輕視剛起步的羅馬人，羅馬人乃藉此證明自己是□□□□□□□，值得周遭勢力認真對待。'
