- id: doc_113_台南_民德_國文_g9s2e1_s3_4
  section: 3
  number: 4
  type: single
  page: 5
  stem: 依據甲文，關於白居易租屋購屋的敘述，何者正確？
  options:
  - label: A
    content: 授官後任職下邽縣，就近於金氏村購置「渭北莊園」
  - label: B
    content: 婚後十餘年仍輾轉於長安常樂、宣平、昭國等坊租屋
  - label: C
    content: 曾租屋於長安新昌坊，是購屋時選擇該坊的原因之一
  - label: D
    content: 為購得柳宗元岳父的園林宅院，乃自請調職東都洛陽
  group_stem: "【甲】\n  白居易29 歲進京考中進士，32 歲經吏部銓選，授秘書省校書郎（九品）。剛上班收入有限，白居易選擇租屋。當時的長安，商人、官員、考生等來來去去，人口流動大，租屋盛行，而且房價極高，一般人根本買不起。白居易36\
    \ 歲結婚時，年薪約臺幣150 萬，仍是無殼蝸牛。\n  上班隔年，白居易因母親前來投靠，在下邽買了第一間房──這個「渭北莊園」對他一直有重要意義，但自己仍賃居長安。35\
    \ 歲，白居易任盩庢縣尉，隔年，回長安任左拾遺（八品），兩年後改任京兆府戶曹參軍（七品）。44 至49 歲，白居易外放江州司馬、忠州刺史，50 歲又重返長安。此時，白居易由主客郎中知制誥升遷中書舍人（五品），終於在京城買房。他選擇新昌坊，除了地段熟悉，也與妻子娘家在隔街的靖恭坊有關。\n\
    \  新宅住約一年半，白居易任杭州刺史。53 歲回來時，自請調職東都洛陽，在履道坊買到柳宗元岳父曾擁有的宅院，「竹木池館，有林泉之致」，令他「識分知足，外無求焉」。\n\
    \n【乙】\n元和二年五月一日，韓城縣人白居易向黃○○賃取   中〔   〕堂舍。價每月銀錢捌拾文，並於一、十五日各與錢肆拾文。立契後，一年內不得悔，先悔者罰銀錢捌拾文，入不悔人。兩和立契，畫指為驗。\n\
    舍  主 黃○○\n賃舍人 白居易（左拾遺）\n保  人  楊○○（中書舍人）\n知見人 吳○○\n\n【丙】\n| 唐代堂舍營繕上限表 | 面寬（間） |\
