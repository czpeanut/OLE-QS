- id: doc_113_台南_民德_國文_g9s2e1_s2_5
  section: 2
  number: 5
  type: single
  page: 1
  stem: 作者曾針對〈鹿耳門〉詩中的「鐵板沙」加以說明：「鐵板沙性重，得水則堅如石，舟泊沙上，風浪掀擲，舟底立碎矣。牛車千百，日行水中，曾無軌跡，其堅可知。」根據這段文字，下列敘述何者正確？
  options:
  - label: A
    content: 牛車順著軌道走，久而久之，軌道也被磨平
  - label: B
    content: 風浪有時會掀起沙石，打碎停泊在沙上的船隻
  - label: C
    content: 成千上百的牛車載著鐵板沙走在水中卻不留痕跡
  - label: D
    content: 鐵板沙質地很特殊，吸水後會變得更加堅硬
  tags:
    chapter:
      publisher: 南一
      book: 九下
      subject: 國文
      code: 第六課
      title: 水神的指引
      chapter: null
    textbook: 九下 第六課 水神的指引
    labeled_by: ai
- id: doc_113_台南_民德_國文_g9s2e1_s2_6
  section: 2
  number: 6
  type: single
  page: 1
  stem: 「蔗田萬頃碧萋萋，一望蘢蔥路欲迷。綑載都來糖廍裡，只留蔗葉餉群犀。」關於這首詩的寫作手法，下列敘述何者正確？
  options:
  - label: A
    content: 呈現蔗田占地廣闊，阻礙人車通行，經常導致迷路
  - label: B
    content: 第一、二、四句押韻，形似唐詩七絕，但比七絕嚴謹
  - label: C
    content: 先寫蔗田廣袤，再寫農人收割，最後由人及物，展現豐收之樂
  - label: D
    content: 詳細敘述甘蔗採收的情形，展現傳統文人深厚的文學底蘊
  tags:
