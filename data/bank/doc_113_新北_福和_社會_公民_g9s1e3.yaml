  stem: '甲訊息 : 社群媒體中有會員上傳訊息:「二手嬰兒推車，有需要的人，可拿2 盒口罩來換」。

    乙訊息 : 國際局勢動盪、物價上漲，人們購買黃金以備必要時做為交易的工具，以致黃金價格飆漲。

    丙訊息 : 我國貨幣有強制清償的效果，不論支付的金額大小，收款人都不得拒絕接受。


    35、瑩瑩在網路上看到有關貨幣的三則訊息。依她近日所學課程內容加以分析，下列敘述何項最適當？ L5'
