  type: single
  page: 2
  stem: 49、對外籍移工及中高齡者的說明，何項最為恰當？ (素養題) L6
  options:
  - label: A
    content: 家庭幫傭和中高齡者都是屬於失業者
  - label: B
    content: 家庭看護和中高齡就業者都是屬於無酬勞動
  - label: C
    content: 65 歲以上繼續工作的勞工為非勞動力
  - label: D
    content: 由移工擔任家庭幫傭看出家務勞動的市場化
  group_stem: "我國因少子化、勞動力短缺等現象，政府為解決缺工問題，大量引進外籍移工並積極推動中高齡就業，以解決缺工問題。\n 措施一:2025 年台灣即將邁入超高齡社會，長照體系的人力缺口居高不下，外籍移工的重要性與日俱增。據統計，在台灣移工人數，已達80\
    \ 萬人。但「家庭幫傭」和「家庭看護」則是歸在《就業服務法》的規範中，不受《勞動基本法》的保障。因此，沒有基本工資、工時限制、休假、薪資等保障，薪資在市場上的行情大約落在21,000\
    \ 元左右，只有基本工資的三分之二。\n 措施二:政府鼓勵業者聘僱中高齡及二度就業的銀髮族，以弭補勞動力的缺口，截至今年9 月已協助超過15 萬人重返職場。立法院也修改「勞動基準法」，若勞雇雙方經協商同意延後勞工的退休年齡，雇主不得對65\
    \ 歲以上繼續工作的勞工，"
