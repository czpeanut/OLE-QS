- id: doc_113_新北_福和_社會_公民_g9s1e3_s2_46
  section: 2
  number: 46
  type: single
  page: 2
  stem: 46、根據上文，若美國提高進口關稅，對物價產生影響，美元的價值將如何改變？(挑戰題、素養題) L5
  options:
  - label: A
    content: 美元價值不變，同金額的錢所能買到的東西不變
  - label: B
    content: 美元價值不變，同金額的錢所能買到的東西變少
  - label: C
    content: 美元貶值，同金額的錢所能買到的東西越來越少
  - label: D
    content: 美元升值，同金額的錢所能買到的東西越來越多
  group_stem: '根據《紐約時報》(The New York Times)分析，美國下一任總統川普的經濟政策，為倡導美國優先，把保護本國産業放在首位，提出實施「全面關稅政策」，對所有外國進口商品徵收10%～20%的關稅，對中國的商品則徵收60%或更高關稅
    。

    對進口商品10 倍的徵稅，必然會導致美國物價攀升，美國家庭每年需多支付2,350 美元，並增加貧困家庭和中產階級的經濟負擔，尤其是對底層60%的人口影響最大；最終將導致通貨膨脹，失業率上升。

    世界各國為減少貿易逆差，將採取貨幣貶值的作法，以因應川普高關稅的政策，如人民幣、印度盧比、日圓、韓圜貶值…，來提升該國商品出口的競爭力，抵銷關稅提高的影響力。相對的，美元走強將使美國的進口商品較便宜，但也使美國出口的產品在全球市場上的價格上升，美國製造的商品在國際市場的競爭力進而下滑
    。

    2024 年第一季美國首次超越中國，成為台灣最大出口國，主要為AI 伺服器的出口，若台灣以貨幣貶值方式因應美國高關稅的政策，勢必對進出口造成影響 。'
  tags:
