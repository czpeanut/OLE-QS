  type: single
  page: 4
  stem: 請同學思考：為何民國以來，北京民眾傾向於在天安門廣場上抗議示威？
  options:
  - label: A
    content: 因為自清朝以來，天安門廣場一直是國家領導人的避暑勝地，深具歷史涵義
  - label: B
    content: 因為天安門廣場是北京民眾平日運動休閒的場所，較熟悉親切
  - label: C
    content: 因為天安門廣場是大陸樓層最高的建築物，能見度最高
  - label: D
    content: 因為天安門廣場是距離國家權力象徵最近的廣場。
