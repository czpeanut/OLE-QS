- id: doc_111_嘉義_北興_社會_歷史_g8s2e3_s2_49
  section: 2
  number: 49
  type: single
  page: 4
  stem: 自中華人民共和國成立以來，天安門廣場曾見證那些歷史事件的發展？ (甲)五四運動 (乙)建國大典 (丙)文化大革命 (丁)六四事件。
  options:
  - label: A
    content: 甲乙丙丁
  - label: B
    content: 甲乙丙
  - label: C
    content: 乙丙丁
  - label: D
    content: 乙丁。
  group_stem: "請同學閱讀文章，應用課堂上所學知識，完成文章中「 」處內容，並回答下列問題。\n  中共推動「甲」以後，經濟成長快速，中國大陸人民的生活水準也逐漸提升，但因官員貪汙腐化、物價上漲，社會瀰漫著一股對現實生活的不滿。西方的民主思潮也隨著該政策而在中國廣泛傳播，許多民間知識分子開始提出「乙」。\n\
    \  西元「丙」 年 4 月，因一位聲望高，又同情民主人士的前總書記過世，北京的學生以悼念為由，聚集於天安門廣場。批評中共的施政與社會問題，要求中共進行民主改革，解決官員貪汙腐化的問題。學生的舉動獲得民眾的同情與支持，情勢一發不可收拾，除了北京，上海、天津、武漢等大城市，也都出現群眾抗議的運動。起初，中共高層試圖與天安門廣場的學生代表溝通，但學生卻提出要讓「丁」下臺的主張，雙方難以達成共識。\n\
    \  5 月 20 日，中共宣布戒嚴。6 月 4 日，中共領導人下令軍隊進入天安門廣場，以武力鎮壓群眾運動。這場鎮壓，經過各國媒體報導震驚了全世界，中國的民主運動受到嚴重的挫折。\n\
    改寫自：BBC 新聞中文版"
