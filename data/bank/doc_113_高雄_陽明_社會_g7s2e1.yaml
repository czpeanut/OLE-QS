- id: doc_113_高雄_陽明_社會_g7s2e1_s1_48
  section: 1
  number: 48
  type: single
  page: 8
  stem: '法務部預告修正《刑法》墮胎罪，包括將孕婦墮胎的罰鍰由3000 元提高至8 萬元。對於此議題，以下是兩名學者的看法

    甲學者：法務部的修法是大開性平倒車，可能讓台灣的女性權益倒退四十年

    乙學者：現行法配偶同意權尚未廢除時，加重對婦女的處罰，十分不當

    上述兩位學者的看法，最能表現出哪一種公民素養？'
  options:
  - label: A
    content: 重視自身權益，善盡國民義務
  - label: B
    content: 參與公共事務，積極監督政府
  - label: C
    content: 遵守法律規範，維護倫理道德
  - label: D
    content: 熱心社會公益，經常回饋社會
  group_stem: '題組

    《刑法》墮胎罪修法爭議

    法務部針對《刑法》墮胎罪擬提高罰金，婦女新知基金會、台灣女人連線等婦女團體發動連署，不到五天就有五十二個團體逾四千多人反對，婦女團體帶著連署書赴立法院，呼籲法務部撤回提高《刑法》墮胎罪罰金的修法草案，並呼籲應積極推動廢除墮胎罪，與衛福部研議將人工流產相關事宜於《優生保健法》一併規範。婦女團體高呼「廢除墮胎罪、還我生育自主權」，「子宮不自主就是不民主」等口號，建議法務部修法應符合《消除對婦女一切形式歧視公約（CEDAW》精神，廢除終止懷孕的所有刑罰，《優生保健法》應正名為《生育保健法》，刪除配偶同意權等。並表示「法國國會已將墮胎權納入憲章，歐洲議會也將其納入歐盟基本權利憲章，我國政府卻無法跟上國際潮流和進步價值。」法務部回應表示，此修法內容因社會無共識，因此撤回修法提案。'
