- id: doc_113_高雄_陽明_社會_g7s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: '關於表（二）中臺灣人口成長三階段的說明，下列何者正確？

    表（二）

    | | (A)時間 | (B)自然增加特色 | (C)社會增加特色 | (D)推行的節育政策 |

    | :--- | :--- | :--- | :--- | :--- |

    | 1920年代前 | 成長停滯階段 | 出生率與死亡率皆高 | 社會增加率增加主要來自於福建、廣東移民 | 婚後三年才生育 |

    | 1920~1990年代 | 快速成長階段 | 死亡率下降，與出生率的差距拉大 | 民國38 年軍籍併入戶籍造成社會增加率大增 | 兩個孩子恰恰好 |

    | 1990年代後 | 緩慢成長階段 | 出生率下降，與死亡率接近 | 新冠肺炎並未對社會增加率造成影響 | 男孩女孩一樣好 |'
  options:
  - label: A
    content: 時間
  - label: B
    content: 自然增加特色
  - label: C
    content: 社會增加特色
