  section: 1
  number: 17
  type: single
  page: 4
  stem: '下表是臺灣多元族群與文化特色的整理，請問何者最為正確？

    | | 原住民 | 漢人 | 新住民 |

    | :--- | :--- | :--- | :--- |

    | (A)分布 | 目前以居住在花蓮縣與桃園市的人口最多 | 是臺灣人數最多的族群 | 移工以中國、越南、印尼籍居多 |

    | (B)飲食 | 傳統食材多取自大自然，如檳榔心 | 閩北小炒以油、鹹、香為特色，口味較重 | 越南火鍋加入多樣香料，調味豐富 |

    | (C)語言 | 母語屬於南島語 | 主要講國語、閩北語、客家語 | 許多地方都能看到越南、印尼等東南亞文字的標示 |

    | (D)宗教 | 透過祭典儀式維繫部落傳統文化 | 以村落廟宇做為居民的活動中心 | 信奉伊斯蘭教的印尼移工以清真寺為信仰中心 |'
