  type: single
  page: 5
  stem: 亞硫酸鹽類被廣泛用於食品保存，其主要作用為何？
  options:
  - label: A
    content: 與食品中的氧氣反應，使食品更耐存放
  - label: B
    content: 破壞細菌細胞，完全抑制細菌生長
  - label: C
    content: 提供氧化性，使食品顏色更鮮艷
  - label: D
    content: 防止食品中的分子變質，減緩顏色與風味的改變。
  group_stem: '二氧化硫是什麼？為什麼會出現在食物裡？食品中的二氧化硫來自於食品添加物：亞硫酸鹽類，如亞硫酸鈉($\mathrm{Na_{2}SO_{3}}$)、亞硫酸鉀($\mathrm{K_{2}SO_{3}}$)等。這些添加物具有「還原性」，可漂白食品，也能防止食物中的分子變質、腐敗，導致顏色、味道改變。像是果乾或蔬菜乾等常見乾貨，也會添加亞硫酸鹽來保存和維持顏色。在如食品等富含水分的環境中，亞硫酸鹽類的部分分子會轉變為二氧化硫，便可被檢測到。因此，檢驗單位利用食品中所含二氧化硫的量，以回推添加劑的使用量，並做出限制規範。

    在選購醃漬或乾燥蔬菜等產品時，應盡量避免購買顏色過白或是有刺激性氣味的食品。在料理或食用前，別忘了「泡、洗、煮」3 步驟，先將醃漬或乾燥蔬菜以清水沖洗或浸泡處理，利用亞硫酸鹽類與二氧化硫都易溶於水的特性，可減少其殘留。烹調時打開鍋蓋煮沸，也可使二氧化硫揮發。'
