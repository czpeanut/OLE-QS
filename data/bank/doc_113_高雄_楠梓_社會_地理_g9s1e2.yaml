  group_stem: '這4 年來，台灣的鴻海與電子五哥：英業達、緯創、廣達、和碩、仁寶，全部都在墨西哥北部增建新廠，以動輒一座大安森林公園的面積，在這片「仙人掌王國」中建立它們在北美洲的製造業灘頭堡。

    過去許多台商與台青的淘金地，是一海之隔的中國；現在，當全球供應鏈重整、企業分散布局，有前景與潛力的工作地，極可能是越南、印度跟墨西哥。這一頁新歷史，不只改變了供應鏈的地貌分布，也將影響你我的就業路。'
