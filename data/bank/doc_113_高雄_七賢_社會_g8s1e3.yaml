- id: doc_113_高雄_七賢_社會_g8s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 根據「史料一」的資料，可以判斷出是中國哪一場改革運動，改革的原因又是因為何場戰爭？
  options:
  - label: A
    content: 自強運動、鴉片戰爭
  - label: B
    content: 戊戌變法、甲午戰爭
  - label: C
    content: 自強運動、英法聯軍
  - label: D
    content: 庚子後新政、八國聯軍。
  group_stem: '★題組：請根據以下三段史料(皆已白話選譯)回答10-12 題。-


    | 中國史料一 | 籌議海防摺一文中提到：「洋人表面上與中國友好，實際上卻想吞併中國，這實在是『數千年來未有之變局』。西方所以強盛，是因為他們快速的輪船、電報、精巧的軍械機器、以及無堅不摧的炮彈」
    |

    | 中國史料二 | 變法通議一文中提到：「變法的根本在於培育人才，人才要興盛必須辦學校，而學校的建立在於科舉制度的更易，一切要妥善完備必須改革官制。……今天各學館為何人才不出？這是因為他們學技藝而不學政治、制度方面的學問」
    |

    | 日本史料三 | 福澤諭吉在勸學一文中提到：「環顧世界各國，有的因為文明開化，成為富強的國家，有的因為蒙昧沒有開化，成為貧弱的國家。一般而言，歐美國家富強，亞非國家貧弱。…如果我們從此立志求學、充實力量，先謀個人獨立，再求國家富強，洋人的勢力又何足懼？
    |'
