  - label: B
    content: 促進科技研發與創新
  - label: C
    content: 擴大觀光產業
  - label: D
    content: 提高傳統製造業的競爭力
  group_stem: '◎閱讀下列選文，回答第 13~15 題


    台灣科學園區


    臺灣的產業轉型並非偶然，政府面臨傳統工業競爭力下滑、國際科技浪潮興起，極需推動技術升級。當時全球電子產業蓬勃發展，時任行政院長的孫運璿提出「科技立國」策略，並借鏡美國矽谷經驗，成立全臺首座科學工業園區——新竹科學園區。


    時任園區管理局長回憶:「選址新竹，因鄰近清華大學、交通大學等學術重鎮，可整合產學研發能量。園區內提供租稅減免、單一窗口行政服務，並規劃完善的水電與交通設施，吸引國際大廠進駐。」


    新竹科學園區的成功，奠定臺灣「半導體王國」的基石。成立初期即吸引台積電、聯電等關鍵企業，至2000年，園區年產值突破兆元台幣，促使政府擴建臺南、臺中科學園區，形成南北科技廊帶。'
