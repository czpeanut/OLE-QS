  group_stem: '◎閱讀下列選文，回答第 9~10 題


    2025年4月6日，宜蘭蘇澳籍「全昌隆168號」延繩釣漁船在釣魚台海域捕獲一尾重達216公斤的黑鮪魚。這不僅是蘇澳今年第一尾黑鮪魚，由於比同一天其他漁船更早進港報關，也成為全國第一鮪。船長林宣俊表示，他們於4月2日出港，先在花蓮外海作業未果，後轉往北方海域。4月6日上午7時左右，發現有大魚上鉤，經過5分鐘的合力拉扯，成功將活魚拉上船。4月7日上午，這尾黑鮪魚被吊上岸，經蘇澳區漁會鑑定，符合蘇澳第一鮪的4大要件:重量達216公斤、活魚上鉤、蘇澳籍延繩釣漁船捕獲，以及在4月1日之後捕獲。儘管同日其他漁船也有捕獲黑鮪魚的紀錄，但「全昌隆168號」搶先進港報關，最終成為2025年台灣第一鮪。'
