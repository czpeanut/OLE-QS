- id: doc_113_台中_清水_社會_地理_g7s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 若政府欲制定配套措施緩解 2025 年全面免關稅衝擊，下列何者最符合「公平競爭」訴求?
  options:
  - label: A
    content: 建立「100%本土鮮乳」認證標章與溯源制度
  - label: B
    content: 限制超商與手搖飲店使用進口乳品
  - label: C
    content: 補貼酪農購買紐西蘭乳牛提升產量
  - label: D
    content: 對進口液體奶加徵環保稅
  group_stem: '◎閱讀下列選文，回答第 11~12 題


    免關稅鮮乳來勢洶洶


    台灣與紐西蘭於 2013 年七月於威靈頓正式簽訂「台紐經濟合作協定」，並於同年十月經立法院通過生效。其中對酪農業影響最大的是逐年開放鮮乳進口配額與關稅遞減，並於
    2025 年後液體奶來台全面免關稅。協定簽訂當時手搖飲與超商咖啡盛行，造成國內自產鮮乳已不敷使用，因此從 2013年開始，國外乳品逐漸以冰磚等還原乳型態進口來台，一步步攻佔超商、飲料店、餐廳等用乳量大的「業務用奶」。至今，台灣大部分企業對企業(
