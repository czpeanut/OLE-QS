- id: doc_113_台中_清水_社會_地理_g7s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 臺灣紅藜的傳統種植活動，屬於圖四中何種產業類型?
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 都不是
  group_stem: '◎閱讀下列選文，回答第 7~8 題


    臺灣紅藜:從原民作物到營養寶藏


    被譽為「穀類紅寶石」的臺灣紅藜，是原住民族百年傳統作物，與藜麥同科卻更勝一籌。這種台東雜糧三寶(小米、樹豆、紅藜)成員，蘊含超越稻米的豐富營養:

    ✓ 高蛋白質與必需胺基酸

    ✓ 礦物質鉀鈣鎂鐵磷全包

    ✓ 膳食纖維+抗氧化植化素

    ✓ 無麩質、低升糖指數

    特別適合素食者與麩質過敏族群，每年12-4月成熟期時，金黃轉豔紅藜麥田宛如天然紅毯，成為台東獨特景觀。從傳統糧食到現代超級食物，紅藜正用它的營養實力驚豔世界。'
