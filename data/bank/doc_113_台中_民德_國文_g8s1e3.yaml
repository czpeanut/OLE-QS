    content: （桓公）欲倍其約。
  group_stem: "曹沫①者，魯人也，以勇力事②魯莊公。莊公好力。曹沫為魯將，與齊戰，三敗北。魯莊公懼， \n乃獻遂邑③之地以和。猶復以為將。 \n  齊桓公許與魯會于柯而盟。桓公與莊公既盟於壇上，曹沫執匕首劫齊桓公，桓公左右莫敢動，而\n\
    問曰：「子將何欲？」曹沫曰：「齊強魯弱，而大國侵魯亦甚矣。今魯城壞即壓齊境，君其圖④之。」\n桓公乃許盡歸魯之侵地。既已言，曹沫投其匕首，下壇，北面⑤就群臣之位，顏色不變，辭令如故。\
    \ \n桓公怒，欲倍⑥其約。管仲曰：「不可。夫貪小利以自快，棄信於諸侯，失天下之援，不如與之。」於\n是桓公乃遂割魯侵地，曹沫三戰所亡地盡復予魯。   \n\
    \ \n①曹沫：魯莊公時力士。         ②事：為某人做事。             ③遂邑：魯國的地名。 \n④圖：考慮。            \
    \    ⑤北面：古時臣子面向北方朝見天子，故以北面代替臣子的地位。 \n⑥倍：通「背」，背棄。 \n                          \
