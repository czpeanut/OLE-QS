    乙.本詩是一首抒情詩，描述少女追求愛情時的心路歷程。

    丙.使用第一人稱觀點敘述，描述少女對愛情的熱烈執著，卻事與願違。

    丁.用小說般的布局推展情節，製造波瀾，扣人心弦'
