  stem: '《世說新語》描繪了許多名士的風貌，根據下列人物的典故簡述，哪一個選項最為恰當？

    ①郝隆於七月七日袒腹仰臥庭中，自稱晒腹中書。

    ②王戎有好李，常賣之，恐人得其種，恆鑽其核。

    ③王藍田為人晚成，時人乃謂之癡。王丞相以其東海子，闢為掾，常集聚。王公每發言，眾人競讚之。述於末坐曰：「主非堯舜，何得事事皆是？」丞相甚相嘆賞。'
