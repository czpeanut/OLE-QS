  stem: "閱讀以下詩句，請問有關此詩的解讀最不適當的選項是？\n完全不愛了的那人坐在對面看我 \n像空的寶特瓶回收不易消滅困難 夏宇〈秋天的哀愁〉"
  options:
  - label: A
    content: 原本應是「愛人」，如今卻寫成「那人」，暗示了心靈的距離與情感的消逝。
