  type: single
  page: 4
  stem: '依心理學的觀點，壓力會影響個人表現。研究顯示：壓力太小或太大都無法有最好的表現，適度的壓力與焦慮對人是有益的，此外，因為壓力的強度是由主觀和客觀因素交互作用所造成，所以每一個人都有最適合自己的壓力水平。壓力太小將無法引起鬥志或決心，於是表現的成效不高；適度的壓力可以提升成效，這就是俗話說的「遇強則強，遇弱則弱」；反之，如果壓力太高，就會讓個體疲於奔命無法應付，導致成效降低，甚至表現失常。

