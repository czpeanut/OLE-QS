- id: doc_112_高雄_大灣_社會_g7s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 小富是一名在臺協助農民，進行農事生產的越南籍移工。已知臺灣的鄉村地區多從事第一級產業，而第一級產業則大量仰賴移工的協助。請問:下列哪些敘述是導致這些產業必須仰賴移工的主要因素？(甲)產業需耗費大量的勞動力
    (乙)大量的壯年人口移出鄉村 (丙)鄉村地區勞動力嚴重老化 (丁)都市人口的飲食習慣改變
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲乙丁
  - label: C
    content: 甲丙丁
  - label: D
    content: 乙丙丁。
  group_stem: "關心部落產業發展與原住民族文化傳承，昔日行政院長林全前往臺東縣金峰鄉嘉蘭村，了解紅藜(ㄌ一ˊ)\n產業現況，林全表示，東部地區人口外流，政府致力改善經濟結構失衡、增加偏鄉地區就業機會，希望平衡城\n\
    鄉差距吸引年輕人返鄉。原住民族是東部地區的重要特色，希望在兼顧原民文化、產業及生活前提下，做好地\n方基礎建設，並提升農業及在地經濟的附加價值。\n  紅藜原本就是部落珍貴的農糧作物，隨著近年紅藜價格的不斷攀升，也讓農民獲得更多的收益，臺東南迴\n\
    四鄉鎮豐沛多元的原住民文化特色，除了人文資源特色顯著完整、自然生態環境秀麗，加上鄰近溪流流域的溫\n泉脈，相當具有發展原住民特色產業的潛力，並達到青年返鄉就業的目標與願景。今年年初，水保局臺東分局\n\
    推動「臺東紅藜季」主題活動，協助南迴線五處原鄉村落栽培紅藜可食地景，遊客年節前往可賞可食，也與國\n立臺灣史前文化博物館合作，在後花園栽下上萬株紅藜苗，打造唯一紅藜文化地景，並推出「藜」不開你文化\n\
    特展與紅藜套裝遊程。"
