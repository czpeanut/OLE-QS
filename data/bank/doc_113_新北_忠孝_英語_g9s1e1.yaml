  group_stem: "Dear Kevin,\n    I’m a student from Zhong Xiao Junior High School.\
    \ I’m in class 910. I wonder if you could help me with a problem. I really don’t\
    \ know what to do with my grades. I got a bad score on my mock test last month.\
    \ My mom wanted me to stop drawing, but I don’t want to. She wants me to go to\
    \ a great senior high school. How can I make her understand that drawing is important\
    \ to me? I really need your help.\n    I am good at drawing pictures. My dream\
    \ is to became a wonderful designer one day. It takes me lots of time to draw\
    \ in different ways lately, so I haven’t had much time for studying. Actually,\
    \ I’m also worried about my big test. Besides, it still needs more efforts to\
    \ reach my goal. I still try working hard every day. However, my mom didn’t think\
    \ so. She thought that I have spent too much time on drawing, and she even threw\
    \ away my paintings. Therefore, we had a serious fight last night. She broke my\
    \ heart. I don’t know how to do. I felt really sad.\n    I know I need to study\
    \ harder, but it’s really difficult to give up my interest. Drawing is everything\
    \ to me. How can I talk my mom into letting me follow my dream? What should I\
    \ do? Can you help me? Thank you for reading my letter. I hope to hear from you\
    \ soon.\n                                                                    \
    \                    Best wishes,\n                                          \
    \                                              Nancy\n\n mock test 模擬考efforts\
    \ 努力"
