    \ Night Market at 17 percent. But hold up, there's lots of love for places outside\
    \ of Taipei too.\n    Down south in Kaohsiung, Liuhe Night Market takes the fourth\
    \ spot. It's the most popular night market outside of Taipei, attracting almost\
