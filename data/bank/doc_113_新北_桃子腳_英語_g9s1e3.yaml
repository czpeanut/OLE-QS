  group_stem: '(47-50)

    Old Book Turns Pennies into Thousands

    Imagine finding something wonderful in a place you would never expect. Sometimes,
    things that appear common can turn out to be very valuable.

    Almost 30 years ago, a person bought a special book from a second-hand shop in
    south London. It wasn’t an ordinary copy of Harry Potter and the Philosopher''s
    Stone, the first book about the famous young wizard, Harry Potter. This book was
    a “proof copy.” A proof copy is an early version of a book made to check for mistakes
    before it was sold in stores. The most surprising part? The book was bought for
    just a few coins. Along with two other books, the total price was only about 15
    NT dollars!

    For many years, the person didn’t know the book was special. It stayed quietly
    on a bookshelf like any other book. But later, she heard that some Harry Potter
    books were being sold for a lot of money. She decided to take her proof copy to
    an auction to see how much it could sell for.

    At the auction, something great happened. This old book, which was bought for
    just a few coins, sold for 11,000 British pounds! That’s almost 45,400 NT dollars.
    A secret buyer from the U.K. bought it. He believed this proof copy was very important
    because it helped bring the Harry Potter magic to readers around the world.

    Interestingly, there was even a small mistake in the book. The writer’s name was
