    Lito: The Japanese Artist Giving a New Life to Leaves

    What happens to the leaves that fall from trees in autumn? Some fly into rivers,
    others are blown away by the wind, or they end up in trash cans. However, a Japanese
    artist, Lito, uses them to make art.

    Lito is famous for his leaf designs. He creates tiny, careful pictures, like a
    frog with an umbrella, fish in water, and even a picture that looks like the famous
    Japanese painting, The Great Wave Off Kanagawa.

    First, Lito prepares the leaves with a special liquid. Then he draws small pictures
    on them and cuts them carefully with a knife. Each leaf takes about eight hours
    to finish. He usually works at night when he can pay better attention to his work.

    The 38-year-old artist started sharing his work online in 2020. His designs quickly
    became popular. Lito says his art helps him with ADHD, a condition that makes
    it hard to pay attention. He learned he had ADHD when he was 30 and understood
    why he always saw things differently from others.

    Lito has also written books and held art shows in Japan. He says, “If my art makes
    people happy, I want to keep creating more.”

