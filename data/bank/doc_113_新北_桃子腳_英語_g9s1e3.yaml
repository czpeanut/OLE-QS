    Rage-Baiting: Why People Get Angry Online

    Some people post things online just to make others angry. This is called "rage-baiting."
    It is a way to get many views and make money.

    Winta Zesu, a YouTuber in the U.S., made $150,000 last year by posting videos.
    She makes herself look like the "prettiest girl" in New York, and her videos get
    millions of views because people leave hate comments. "Every popular video I have
    is because of hate comments," she said. Another creator, Ryan Gawlik, also uses
    rage-baiting. In one video, he ate a huge chocolate bar without breaking it into
    pieces. Many people got angry at this video, which got 5 million views.

    But why does this work? Annabel H., a marketing manager, says anger is a strong
    feeling. When people feel angry, they want to say something back. This makes the
    post more popular.

    However, rage-baiting can cause problems. Dr. William Brady says it became more
    common before the 2024 U.S. election. Some people use it to share fake news or
    ideas that might lead to wars. Too much negative news online can also make people
    feel tired or upset. Some may stop reading the news altogether.

    Rage-baiting is a way for people to get attention, but it may have bad effects
    on others.

