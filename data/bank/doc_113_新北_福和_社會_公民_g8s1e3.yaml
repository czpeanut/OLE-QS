- id: doc_113_新北_福和_社會_公民_g8s1e3_s2_49
  section: 2
  number: 49
  type: single
  page: 3
  stem: 在2018 年公投綁大選的投開票當日，許多民眾因搞不清楚各項公投議案與自己能投哪些票而造成投開票所大排長龍的現象，若以「新北市永和區」符合法定投票資格的民眾而言，除了公投票以外，還可以投哪些票？（L6）
  options:
  - label: A
    content: 市長、市議員、區長
  - label: B
    content: 總統、立委、里長
  - label: C
    content: 市長、市議員、里長
  - label: D
    content: 市長、市議員、市民代表
  group_stem: '【題組二】請回答第49～50 題

    　　《公民投票法》自2003 年上路以來歷經多次演變與爭議，直到2017 年修法後，才大幅降低公投提案與通過門檻，並將「公投綁大選」慣例明文入法，不過到了2018
    年時，因修法後門檻降低，導致公投提案數量大增，當年共有高達10 件公投案與九合一地方大選合併舉行，讓投開票日當天選務大塞車，甚至出現「邊開票邊投票」亂象。為防混亂重演，立院2019
    年再度修法，將公投日期固定為2021 年起每2 年舉行一次，錯開選舉年，將公投與大選拆開來。

    　　但後來公投與選舉是否合併爭議頻傳，故將此議題回歸民意，於2021 年推動「公投綁大選」公民複決，讓符合法定資格的公民投票決定，使公投爭議由公投解決，最後以41%投票率，19.9%同意票、20.8%不同意票，在同意票數少於不同意票數，且票數未達過關門檻的情況下，提案最終並未通過。而直至2024
    年，國民黨與民進黨立委及台灣民眾黨團等人，分別再針對《公投法》提出修正草案，而其目前仍在立院審議當中。

    資料來源：公視新聞網https://news.pts.org.tw/article/722589'
