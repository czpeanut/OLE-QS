- id: doc_113_新北_福和_社會_公民_g8s1e3_s1_41
  section: 1
  number: 41
  type: single
  page: 1
  stem: 不在籍投票制度是為了讓投票人無須回到戶籍地即可參與投票，此項制度也是近年來台灣討論的議題之一。而大部分有設置此制度的民主國家，都將不在籍投票視為政府應提供給選民的一種基本服務，以方便選民履行其投票參政權利。但不在籍投票最大的困難點在於信任度及公正性的問題，因此以可行性等層面考量，仍由選民本人親自在投票當日前往投票所投票的實施方式，較能被國人接受。請問以上敘述談及的意涵，為下列何項投票公平原則？（L6）
  options:
  - label: A
    content: 普通原則
  - label: B
    content: 平等原則
  - label: C
    content: 直接原則
  - label: D
    content: 無記名原則
