- id: doc_113_新北_福和_社會_公民_g8s1e3_s2_46
  section: 2
  number: 46
  type: single
  page: 2
  stem: 根據文章底線處及附圖所示，請問其呈現出公共意見的何種特性？（L5）
  options:
  - label: A
    content: 議題性
  - label: B
    content: 複雜性
  - label: C
    content: 影響性
  - label: D
    content: 變動性
  group_stem: '【題組一】請回答第46～48 題

    　　2024 年1 月13 日為中華民國第16 任總統、副總統選舉，在正式大選前有不少針對此次大選的民意調查，其中一項民調更是直接詢問民眾「是否支持這次總統大選帶來新的政黨輪替執政？」，調查出的結果包含了
    59.4% 的支持意見、 34.1% 的反對意見 等，如右圖所示。而根據中選會於本次選舉的開票結果，2024 年總統、副總統選舉人人數為1954 萬8531
    人，投票數超過1400 萬人，投票率為71.86％。

