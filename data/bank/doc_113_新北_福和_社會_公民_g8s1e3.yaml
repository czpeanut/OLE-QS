- id: doc_113_新北_福和_社會_公民_g8s1e3_s1_35
  section: 1
  number: 35
  type: single
  page: 1
  stem: 近年代孕生殖的議題引發社會討論，而行政院衛生福利部在提出《人工生殖法》修法案前，開過多場專家會議，基於各界對前述修法議題正、反意見均有，故於113
    年2 月及3 月分別召開公聽會，廣徵各界意見，以作為提出《人工生殖法》修法案之參考。根據上述內容，請問以下何者正確？（L5）
