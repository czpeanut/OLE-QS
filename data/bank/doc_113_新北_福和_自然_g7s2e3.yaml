    | ❶ 野生石斑<br>野生石斑屬於食物鏈高層的生物，不只數量稀少，成長也較為緩慢，一但大量捕撈，會需要長時間才能恢復族群數量<br>👉 建議減少食用生長時間較長的魚類
    | ❶ 虱目魚：<br>✔ 虱目魚是符合永續發展的養殖魚類，也是解決糧食問題的優良魚種<br>臺灣虱目魚養殖技術也在永續漁業上扮演重要角色 |

    | ❷ 康氏馬加鰆（土魠）<br>康氏馬加鰆目前已經被過度捕撈，也造成野生資源銳減<br>👉 建議選擇其他養殖類的漁產，才不會影響野生魚種的生態 | ❷ 巴鰹（煙仔）：<br>✔
    這類小型鰹魚資源豐富，屬於可持續捕撈魚類 |

    | ❸ 鸚哥魚<br>色彩繽紛，是珊瑚礁生態系重要的魚種，比起單次性消費的食用，發展生態觀光更能永續長久！<br>👉 建議不購買魚身有斑點或鮮豔花色的小型魚
    | ❸ 臺灣鯖魚：<br>✔ 在地海鮮的碳足跡較低，對於環境較為友善 |

    | ❹ 胡椒鯛<br>胡椒鯛又稱打鐵婆，捕撈的方式有破壞棲地與混獲的問題存在<br>👉 建議選擇捕撈方式較為友善環境的魚類購買 | ❹ 白帶魚：<br>✔
    野生的資源量還尚稱豐富 |

    | ❺ 大法螺<br>大法螺數量稀少，且作為棘冠海星的天敵，可有效化解棘冠海星大量增殖的生態危機<br>👉 可以選擇臺灣本地的鳳螺，也很美味好吃！ | ❺
    鎖管（透抽/小卷/中卷）：<br>✔ 屬於食物鏈的中、底層生物，族群數量恢復的速度較快 |

    | ❻ 鮪魚<br>鮪魚是大型掠食性魚類，生長周期長，容易累積高濃度重金屬，過度捕撈也對資源造成壓力<br>👉 建議減少食用大型魚類，多選擇生長快速的小型魚種
    | ❻ 鬼頭刀：<br>✔ 為洄游性的生物，數量及分布範圍較廣 |'
