  section: 3
  number: 45
  type: single
  page: 4
  stem: '右圖A~E 點是直角座標上的點，代表地圖上的一個位置，這些點的不同條件如下: A 點(-2，4)及B 點(7，3)有許多花朵讓黑頰蜂鳥取食，C 點(-3，5)有庫氏鷹的巢，D
    點(5，5)有蒼鷹的巢，E 點(1，1)有墨西哥叢鴉的巢，且不論是庫氏鷹或蒼鷹其盤旋俯衝範圍皆以自己的巢為圓心向外兩單位的圓形範圍(圖中X 及Y 軸一單位距離皆相同)，除上述各點之不同外，其餘條件皆相同。參考文章，判斷A~D
    點哪個是最適合黑頰蜂鳥築巢的位置，請將答案劃記在答案卡上。'
  group_stem: '【一】選巢的策略

    買房最重要的是「Location」，地段好就穩賺不賠，這個道理黑頰蜂鳥也懂。

    黑頰蜂鳥喜食花蜜，但要小心墨西哥叢鴉的獵捕。墨西哥叢鴉則要小心庫氏鷹或是蒼鷹會在巢附近盤旋搜尋、俯衝捕捉它，因此墨西哥叢鴉怕被這兩種鷹捕捉，在鷹巢附近活動時會飛得比平常還要高，在鷹俯衝範圍內更是不敢靠近。但鷹這些猛禽對於體重跟自己相差快200
    倍且動作又快的黑頰蜂鳥，則不會大費周章抓來吃，所以對於黑頰蜂鳥來說，最佳的選巢地點應該是離食物最近且又不易被天敵捕捉的地方。(取自 喔!原來如此 有趣的鳥類學
