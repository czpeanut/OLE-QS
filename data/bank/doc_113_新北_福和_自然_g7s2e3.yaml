- id: doc_113_新北_福和_自然_g7s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 最近日本的研究團隊，發現了一種迷你細菌(Minisyncoccus archaeiphilus)，之所以很迷你，是因為這種細菌只有一般常見細菌15%的體積。研究者發現這隻菌一定要跟一隻甲烷古菌(Methanospirillum
    hungatei)一起培養才長得起來。研究團隊研究它的基因體發現，這隻迷你細菌不知道是不是因為太小了，竟然缺少了很多必備的代謝途徑，包括能量代謝及合成物質的途徑，需要古菌提供這些缺乏的能量與物質。研究團隊發現這隻迷你細菌會附著在古菌的特定位置，導致古菌的細胞壁變形，另外與迷你細菌共培養的甲烷古菌，不僅生長速度變慢、連甲烷產生速率也降低。(文章摘錄自葉綠舒網路文章)。依文章所述，迷你細菌與甲烷古菌的交互作用應為下列何者？
  options:
  - label: A
    content: 掠食
  - label: B
    content: 競爭
  - label: C
    content: 片利共生
  - label: D
    content: 寄生。4-2
