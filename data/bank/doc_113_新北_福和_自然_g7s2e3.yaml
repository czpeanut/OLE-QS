- id: doc_113_新北_福和_自然_g7s2e3_s3_49
  section: 3
  number: 49
  type: single
  page: 6
  stem: 根據文章所述，下列何者不是造成石虎族群遺傳多樣性降低的原因？
  options:
  - label: A
    content: 活動範圍與人類重疊
  - label: B
    content: 石虎被大量狩獵
  - label: C
    content: 食物中毒
  - label: D
    content: 流浪貓的攻擊。
  group_stem: "【三】石虎(Prionailurus bengalensis)的基本資料\n物種分布\n    日據時期曾普遍分布於臺灣全島低海拔的丘陵地區，在1970\
    \ 年代以前受到極大的狩獵壓力而逐漸消失。現在主要族群分布在苗栗、臺中及南投，不僅分布侷限且數量稀少。近年在其他地區如新竹、彰化、雲林及嘉南亦有零星的石虎發現紀錄。\n\
    環境與棲地\n    主要分布在臺灣海拔1,000 公尺以下的淺山地區，但海拔2000 公尺以上的山區也有分布的紀錄。偏好覆蓋度高的天然林，其次為非天然林、草生地及農墾地，森林覆蓋度高的環境能提供為白天休息時遮蔽的場所。\n\
    威脅因素\n    石虎棲息地受到人類開發而喪失、路殺、非法捕殺、流浪狗攻擊是直接造成石虎傷亡的因素。另外還有傳染性疾病、農藥及老鼠藥的使用、與遊蕩犬貓的食物競爭以及遺傳多樣性低…等可能會對石虎生存造成威脅，需要持續關注。\n\
    主要食物\n    要食物為鼠類，也會取食其他小型哺乳動物、鳥、青蛙、蜥蜴、魚及昆蟲等，是臺灣淺山生態系食物網的頂級消費者。但慣行農業為減少病蟲草鼠害，大量使用農藥、除草劑及滅鼠藥，導致石虎的食物中累積了大量的毒素，此舉對生態系統帶來極大的負面衝擊。"
