- id: doc_113_新北_中平_自然_g9s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 一塊大石頭 10 kgw 放在地上，若阿偉用 8 kgw 的力量往上抬，石頭仍然沒動。請問下列敘述何者正確？
