    \ 5 弱，全臺均感受到強烈搖晃。\n 緊接著在 8 時 34 分、8 時 40 分又發生規模 6.4、5.2 的餘震，震源深度 21.3 公里、25 公里；這是恆春百年來最強烈的地震，相當於\
    \ 6 顆原子彈爆炸的威力，因為未達 7.0 的規模，因此未發布海嘯警報。\n 接連三起強震，全臺民眾均感受到地震的威力，紛紛奪門而出；高雄左營、楠梓地區及屏東車城電話中斷；恆春也傳出兩棟民房半倒，有\
    \ 6 人一度受困。這起 6.7 的大地震，震斷好幾十條太平洋海底國際電纜，使太平洋沿岸多國，包括香港、日本、南韓、東南亞，甚至美國都受到波及，電話打不通，金融交易受到影響，香港金融界預估，至少有數百萬美金的損失。這次的電信故障事件就像是「科技海嘯」，掀起全球災情。"
