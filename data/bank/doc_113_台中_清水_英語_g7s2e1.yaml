  stem: Which can be the title (標題) of the reading?
  options:
  - label: A
    content: The Story of Singing
  - label: B
    content: Making Songs with AI
  - label: C
    content: How to Be a Great Teacher
  - label: D
    content: A Music Teacher for Everyone
  group_stem: 'Do you like music? Now, AI can help you write and sing songs! ChatGPT
    and Suno are AI tools. These tools listen to your ideas and make them into songs.

    How does it work? First, you use ChatGPT to write song lyrics. You can write about
    school, love, or your lunch. ChatGPT gives you ideas and makes the lyrics better.
    Next, put the lyrics into Suno. It makes a melody and sings the song for you.

    Some teachers use Suno, too. They make the words in the textbook into songs. This
    makes learning English fun and easy. So, do you want to make a song with AI tools?

     tool 工具 idea 想法 lyrics 歌詞 better 更好的 melody 旋律'
