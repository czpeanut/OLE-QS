  stem: 《民法》規定「關於父母對於未成年子女權利之行使意思不一致時，由父行使之。」此規定與《憲法》規定「人民無分男女在法律上一律平等」的意旨不符，碰到這種狀況，請問：下列哪一項敘述是正確的？
