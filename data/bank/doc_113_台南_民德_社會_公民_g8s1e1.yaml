  section: 1
  number: 32
  type: single
  page: 3
  stem: 根據上文，中國所發射的衛星是否有入侵我國領土範圍的疑慮，其根據的理由為何？
  options:
  - label: A
    content: 有，衛星直接穿越我國領陸
  - label: B
    content: 有，我國的領空亦屬領土範圍
  - label: C
    content: 沒有，因衛星高度已高過領空範圍
  - label: D
    content: 沒有，因為衛星沒有穿越領陸上空。
  group_stem: '國家級警報

    2014 年1 月中國發射衛星，飛越臺灣上空，國防部在總統大選之前大動作發布國家級警報，不過，警報內容錯誤百出，導致行政院長口誤，將衛星說成飛彈，外交部長更是在全球媒體前，離譜地表示，衛星是飛越「越南」上空，請大家不用擔心。

    至於大選之前，引發恐慌或被質疑「賣芒果乾」（亡國感），國防部則嚴正否認，強調無意影響選舉。在野黨立委候選人質疑此一警報不僅時間上有落差，。在野黨立委候選人質疑此一警報不僅時間上有落差，高度上也讓人費解，國防部公布該衛星運載火箭通過臺灣上空時高度是500
    公里，達到大氣層，領空高度有國際規範，如果飛越高度500 公里這麼高的衛星都要發警報，那麼所有在外太空飛過臺灣垂直上空的所有衛星 ，難道都要發警報？質疑有讓國家級簡訊淪為選舉操作的疑慮，不能維持行政中立，國防部長應為此下台'
