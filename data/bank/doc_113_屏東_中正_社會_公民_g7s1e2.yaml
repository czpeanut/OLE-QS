  stem: 根據2022 年世界展望會的調查，該組織服務的孩童中，有2,813 名孩子的家人無法提供孩子生活費，這些孩子必須去打工來養活自己，甚至有超過300
    名未滿18 歲的孩子，必須負擔全家的生活費用，未成年就必須工作賺錢。上文主要在探討家庭的何種功能需要協助？
