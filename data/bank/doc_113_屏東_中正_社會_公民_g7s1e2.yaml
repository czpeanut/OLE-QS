  section: 2
  number: 21
  type: single
  page: 3
  stem: '一名網友在社群媒體的公共論壇發文如下，下列選項何者最符合內容所述？


    周遭很多朋友不結婚，或者不生小孩，這也意味著老年生病、失能時，家裡可能沒有成員擔任照顧者的角色，因此現在有保險業者販售「長期照顧險」，在年輕時投保，日後有需要時領取保險金給付，可用來僱用人力照護者。我國全民健保給予的保障是世界第一，或許政府可以沿用成功的經驗開辦「全民長期照顧險」，利用公共化的資源，讓所有的國民都不用擔心老了之後無人可靠。'
  options:
  - label: A
    content: 經濟衰退導致收入銳減，許多家庭不願意生育子女
  - label: B
    content: 我國邁入高齡社會後，壯年人口扶養老人負擔減輕
  - label: C
    content: 社會變遷使高齡者倚賴家庭成員照顧的可能性降低
  - label: D
    content: 疾病傳播迅速，讓政府在醫療資源上面臨沉重壓力。
