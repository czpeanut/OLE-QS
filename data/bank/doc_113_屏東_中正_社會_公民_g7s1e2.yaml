- id: doc_113_屏東_中正_社會_公民_g7s1e2_s2_13
  section: 2
  number: 13
  type: single
  page: 2
  stem: '《民法》隨著時代變遷，歷經多次修法，其中部分規定修改如下表。表中內容的修改，最有可能是為落實下列何者？

    | 項目 | 修改前 | 修改後 |

    | :--- | :--- | :--- |

    | 未成年子女姓氏 | 從父姓 | 由父母雙方協議，可書面約定從父姓或從母姓 |'
  options:
  - label: A
    content: 由政府來打造性別平權的家庭
  - label: B
    content: 肯定女性擔負家務勞動的價值
  - label: C
    content: 以法律確保擬制血親的繼承權
  - label: D
    content: 保障兒童人權並強調親子平權。
