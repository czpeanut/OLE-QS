- id: doc_113_屏東_中正_社會_公民_g7s1e2_s2_9
  section: 2
  number: 9
  type: single
  page: 1
  stem: '聯合國提出「2030 永續發展目標」，期待在2030 年前達成17 項核心目標，當中第5 項為性別平權，小蘭發現我國多年來致力於修訂相關法律，促進家庭平權，以下是她在網路上搜尋到的資料，但撰寫者錯漏百出，只有何者符合我國現行法律的規定？


    現代家庭夫妻雙方都投入工作職場，(甲)男性必須負擔多數的家庭生活費，由於男性經濟基礎較佳，因此(乙)夫妻財產依法由丈夫管理。若生育子女，(丙)未成年子女的的姓氏從父姓，但若丈夫允許，可從母姓。而(丁)未成年子女的親權則是由夫妻共同行使。'
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
- id: doc_113_屏東_中正_社會_公民_g7s1e2_s2_10
  section: 2
  number: 10
  type: single
  page: 1
  stem: 柯南針對台灣近幾年的家庭結構進行報告，報告中列出下列四點結論，卻被阿笠博士指出有錯誤，請幫柯南找出哪一點不正確？
  options:
  - label: A
    content: 離婚率的提高，直接或間接促使單親家庭、兩地家庭、重組家庭、頂客家庭的增加
  - label: B
    content: 三代同鄰的居住型態除了能讓三代彼此間就近相互照應，又可保持距離減少生活上的衝突
  - label: C
    content: 現代社會多為小家庭，兒童及長者的照顧問題，需仰賴政府政策的幫助
  - label: D
    content: 雙薪家庭的增加，使得親子之間互動時間減少，也縮減了保護與照顧的功能
- id: doc_113_屏東_中正_社會_公民_g7s1e2_s2_11
  section: 2
  number: 11
  type: single
  page: 2
  stem: 「這世界上沒有人比我更適合當他的媽媽！」台中6 歲男童柴柴罹患罕病等多重障礙，出生不久，因父母不當照顧昏迷送醫，治療他的38 歲小兒科醫師王杏安一路照顧，萌發母愛決定收養，一起面對多次生死關頭，即使她單身、後來陸續生了3
    個孩子，仍堅持初衷，歷經三年多的聲請，終於成功收養，成為柴柴的合法媽媽。下列相關敘述何者錯誤？
  options:
  - label: A
    content: 柴柴與王醫師所生的3 個孩子，在法律上與王醫師皆有相互撫養義務及繼承權利
  - label: B
    content: 王醫師與柴柴是透過法律程序建立的親子關係
  - label: C
    content: 王醫師成功收養柴柴後，即視同自然血親，無法終止
  - label: D
    content: 王醫師和柴柴的關係為養母與養子，又稱為擬制血親。
