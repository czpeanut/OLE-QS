  group_stem: （一）1993 年，一起殺夫案震驚全臺，22 歲的鄧如雯趁丈夫林阿棋熟睡時，拿鐵鎚、水果刀將丈夫殺死。而在此之前，鄧如雯從15 歲起就飽受林阿棋長期性侵、言語羞辱、肢體暴力等迫害行為，卻礙於當年社會風氣，不敢站出來，也沒有法律可以幫助她。殺夫案不僅僅只是改變了鄧如雯的一生，同時也是臺灣扭轉家暴觀念一個非常重要的轉捩點，婦女團體四處的奔走起草《家庭暴力防治法》，終於打破了法不入家門。在民國87
    年，《家庭暴力防治法》公布實施，臺灣成為亞洲地區第一個擁有「保護令」制度的國家。
