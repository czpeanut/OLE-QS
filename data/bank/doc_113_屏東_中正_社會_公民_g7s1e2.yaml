  section: 2
  number: 15
  type: single
  page: 2
  stem: 行政院性別平等處發布「2024 年性別圖像」，統計2012～2022 年申請育嬰留職停薪件數及男性比率，如下圖。相關敘述何者正確？
  options:
  - label: A
    content: 依《勞動基準法》的規定，受僱者不論性別，皆可在任職滿六個月後，子女滿 3 歲前，提出育嬰假申請
  - label: B
    content: 2022 年育嬰留職停薪津貼男性申請比例達25.2%，意味著在家務分工上，男性投入的時間高於女性
  - label: C
    content: 以人數來看，2022 年育嬰留職停薪津貼初次核付件數，男性與女性的申請比例趨近平衡，顯示性別平權
  - label: D
    content: 當育嬰留職停薪津貼提高、職場文化及家務分工更友善平等，將更能夠提高男性請假育兒的意願。
  assets:
  - key: s2_15_f1
