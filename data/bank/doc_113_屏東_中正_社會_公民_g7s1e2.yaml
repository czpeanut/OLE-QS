- id: doc_113_屏東_中正_社會_公民_g7s1e2_s2_16
  section: 2
  number: 16
  type: single
  page: 3
  stem: 為了使親子間能夠相互扶持生活，我國《民法》明確規範親子間的權利義務關係。台北市一名父親個性暴躁，經常在全家人面前砸東西洩憤，還時不時打罵妻子，甚至持刀追砍孩子，離婚後也對妻孩漠不關心，放任妻子獨自一人撫養一雙兒女。
    針對上述案例，相關敘述何者正確？
  options:
  - label: A
    content: 父親是基於「親權」的規定，在合理範圍內對子女施以適當的管教
  - label: B
    content: 父母有保護教養子女之權利義務，但絕不可懲戒子女
  - label: C
    content: 子女成年後可向法院聲請免除或減輕對父親的扶養義務
  - label: D
    content: 孩子是獨立的個體，當子女成年有收入時，並無奉養父母的責任。
- id: doc_113_屏東_中正_社會_公民_g7s1e2_s2_17
  section: 2
  number: 17
  type: single
  page: 3
  stem: 黎巴嫩詩人紀伯倫在《先知》詩集中談到，「你的孩子並不是你的，你是弓，而你的孩子是從弦上射發的生命的箭矢」，父母要做的是盡力將弦張滿，讓孩子可以像箭般的疾馳遠射。下列敘述何者最能符合上文所要傳達的重點？
  options:
  - label: A
    content: 親子之間的關係不只是法律上的權利義務，彼此的支持與陪伴才是幸福的根源
  - label: B
    content: 父母的相處方式會使子女耳濡目染受到影響，不可不慎
  - label: C
    content: 家庭功能的發揮有助於社會的穩定發展，政府應協助家長教育子女
  - label: D
    content: 家長要培養出能夠獨立的孩子，必須先懂得尊重孩子是獨立個體。
