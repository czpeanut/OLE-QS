  group_stem: "58-60 題組\n    旻哲從國中畢業已經 5 年了，今年他想在中秋節舉辦同學會，連繫同學間的感情。以下是旻哲和同學間的對話，請根據對話內容回答下列問題：\n\
    旻哲：各位，從國中畢業後已經好幾年沒見了，難得聚會又適逢中秋節，點心就吃蛋黃酥吧！市面上販售的蛋黃酥太油太甜了，所以我想自己製作低糖少油的蛋黃酥給大家吃。\n\
    雅萱：旻哲願意做，我們覺得很好。但你計算過自己製作會花多少錢嗎？\n旻哲：我之前做過一次，食材需要麵粉、奶油、砂糖、蛋黃及內餡，製作 15 個蛋黃酥約 600\
    \ 元。\n譽碩：我覺得划不來，而且有些成本你沒計算到吧。你製作的時間拿去打工也可以賺 480 元。\n雅萱：第二次製作，也沒有辦法太熟練，應該會搞得手忙腳亂。附近店家的蛋黃酥一顆才\
    \ 30 元，口味選擇也較多，我們可以買不同的口味吃吃看。\n旻哲：好吧！你們說的也是有道理。"
