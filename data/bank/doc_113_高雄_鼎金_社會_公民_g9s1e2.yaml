  stem: 根據文中畫雙底線處的描述，依據交易的對象與內容，對於饕客而言，魚市場是屬於下列何種市場？
  options:
  - label: A
    content: 勞動市場
  - label: B
    content: 商品市場
  - label: C
    content: 無形市場
  - label: D
    content: 有形市場。
  group_stem: "55-56 題組\n    請閱讀下列文章後，回答問題：\n  清晨時分，多數人正在夢鄉時，位在基隆的崁仔頂魚市才揭開序幕。剛從漁港載滿漁獲的卡車陸續駛進，將新鮮的漁獲一籃籃擺上攤位；北臺灣地區的魚販、海鮮餐廳經營者，或是喜愛生鮮漁獲的饕客們也魚貫進入，整個魚市場裡熱鬧滾滾，讓人見識到傳統叫賣市場的震撼力。這裡的交易方式，是採拍賣方式，以前一日的成交價格為底價，再漸漸往上加價，直到有買主決定購買為止，因而交易時間從凌晨持續到早上\
    \ 6～7 點，造成崁仔頂「不夜城」的特殊景觀。（資料來源：改寫自崁仔頂魚市，基隆市政府，2020/12/15。）"
