- id: doc_113_高雄_英明_社會_公民_g7s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 文章中的世界衛生組織對政府的建議，最主要的目的是什麼？
  options:
  - label: A
    content: 保障精神疾病患者的基本人權
  - label: B
    content: 限制患者參加社會活動的機會
  - label: C
    content: 減少精神疾病患者的醫療資源
  - label: D
    content: 強制企業為患者提供特別福利。
  group_stem: '題組一：根據下文回答以下三題(9~11)

    根據世界衛生組織（WHO）的統計數據，全球約有2.8 億人罹患抑鬱症，抑鬱症已成為全球主要的失能原因之一。此外，焦慮症、雙相情感障礙等其他精神健康問題也廣泛存在，影響著患者的日常生活和工作能力。精神健康問題不僅給患者本人帶來痛苦，還對社會和經濟產生巨大負擔。

    在許多國家，精神疾病患者常因病情而遭受歧視和排斥，尤其是在職場上，他們往往被認為無法勝任高壓或高難度的工作。世界衛生組織呼籲各國政府制定相關法律政策，保障精神疾病患者的基本人權，並提供必要的心理支持和社會保障，確保這些患者能夠平等參與社會和職場活動。'
  tags:
