  group_stem: '題組二：根據下文回答以下二題(12~13)

    《世界人權宣言》明確規定，每個人都應享有基本權利和尊嚴，不應因國籍、種族或社會地位而受到歧視。台灣有許多外籍移工在工廠、建築工地以及家庭照護等行業中工作，但他們經常面臨工時過長、薪資偏低以及被限制行動自由的問題。一些雇主甚至沒收移工的護照，進一步侵犯了他們的人權。人權團體呼籲，台灣應制定更多法律來保障這些移工的基本權利，確保他們在工作中不受剝削，並能享有與本國勞工相同的待遇和尊嚴。'
