- id: doc_113_台中_大業_國文_g8s2e3_s2_34
  section: 2
  number: 34
  type: single
  page: 4
  stem: 「認識了一群漁民朋友，羨慕他們早已成為了一條魚。」這句話的意涵為何？
  options:
  - label: A
    content: 隨興所之，如魚得水
  - label: B
    content: 追求自我，揚眉吐氣
  - label: C
    content: 熱愛海洋，物我合一
  - label: D
    content: 抓住機會，把握當下。
  group_stem: '認識了一群漁民朋友，羨慕他們早已成為了一條魚。

    跟著他們航行出海，學習當一條魚。我發現他們在海上和陸地上有明顯的性格差異，在海上他們沉默不愛講話，心思細膩，像一隻敏銳的貓隨時隨刻在感覺潮水變化，感覺海洋的呼吸脈動；上了岸，說話大聲粗獷，沒有一刻靜得下來。

    航行大半年後，我懷疑起海洋是否拒絕了讓我當一條魚的承諾。除了當全身力氣用盡癱倒在甲板上像一條死魚，大半年來我不曾感覺自己是一條魚。我暈船、嘔吐；當浪頭挺立在船尾如一道高聳危牆，當船隻傾側擦浪眼看著就要翻覆，我害怕、驚惶；當夜晚孤苦漂流凍得渾身發抖，我會懷念遙遠岸上一盞穩固溫暖的燈火。

    船隻出航的鳴笛聲已然消失不見，每次離岸，我都帶著淒苦的心情。

    有一次拉完一簍漁繩，天剛剛破曉，我站在舷邊看望火球升起，我再次聽到了嘩啦啦的日出禮讚，看到曙光踏著波浪穿越船舷後，再射向岸上，我驚覺到自己是日出的場景之一，不再是個觀眾。我看到船尖犁出一群飛魚撲翅飛翔。

    海岸是一道界線，海面也是一道界線，穿越這些界面需要些試煉和考驗吧。我看見了旗魚水面張帆；看到了海豚朋友們友善靠船；聽見了漁民兄弟如波峰波谷精彩的海上生活故事；渾身發抖和一頭龐碩醜陋的巨鯨海上併游，我感受到海上伙伴間人世難得的真情……我有著歷經波折後被接受的喜悅……我擁有了這輩子不曾有過的感動和幸福。

    海洋漸漸向我展露她的精髓寶藏。 (廖鴻基 走不完的海灘路)'
