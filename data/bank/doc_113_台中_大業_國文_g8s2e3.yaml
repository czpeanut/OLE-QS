  group_stem: '江浙之俗信巫鬼，相傳人死則其魄復還，以其日測之①，某日當至，則盡室出避於外，名為「避放」。命壯僕或僧守其廬，布灰於地，明日，視其跡，云受生為人為異物②矣。

    鄱陽民韓氏嫗死，倩③族人永寧寺僧宗達宿焉。達瞑目誦經，中夕，聞嫗房中有聲嗚嗚然，久之漸厲，若在甕盎④間，蹴蹋四壁，略不少止，達心亦懼，但益誦首楞嚴咒⑤，至數十過。天將曉，韓氏子亦來，猶聞物觸戶聲不已，達告之故，偕執杖而入。見一物四尺，首戴一甕，直來觸人。達擊之，甕即破，乃一犬呦然⑥而出。蓋初閉門時，犬先在房中矣，甕有糠，伸首舐之，不能出，故戴而號呼耳。
    （洪邁夷堅志‧韓氏放鬼）

