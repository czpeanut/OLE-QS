  section: 1
  number: 10
  type: single
  page: 1
  stem: 參觀故宮博物院展覽，發現鐵劍嚴重的鏽蝕，而銅劍則只有稍微產生鏽蝕，然而鐵劍問世的時間比銅劍晚，下列關於會導致這個現象的解釋，何者正確？
