  group_stem: '染色體「X 檔案」解密！——談談女性「X 染色體去活化」機制

    賴昭正

    X 染色體相當大，約含 1300 個基因；這些基因在大腦功能上佔了不成比例的重要性，在卵巢或睾丸形成的各個階段、以及雄性和雌性的其他生育能力上也扮演了許多必要的角色。而
    Y 染色體則特別小，只含 40–50 個基因而已：當然其中許多是雄性生殖所必需的。

    就性別決定而言，Y 染色體中最重要的是一個稱為 SRY 的基因；SRY 蛋白激活胚胎中決定睾丸的途徑，促使產生最重要之「男性」睾丸激素，使胚胎男性化。萬一
    Y 染色體內缺少了 SRY 基因或 SRY 基因受損，則該男性的外表將出現女性化。而如果父親的精子在形成過程中，Y 染色體中的 SRY 基因的一小部分「不小心」地轉移到
    X 染色體上，則性染色體為 XX 染色體的孩子，也會出現男性的特徵。

    前面提到，X 染色體中的基因在大腦功能上佔有相當重要的地位。因此亞當可能會反對為什麼上帝只賜給他一個 X 染色體，但卻給夏娃兩個！還好生物學家發現染色體多並不是好現象！事實上除了編號為
    21 的染色體外，任何其它多一條染色體的胚胎都沒辦法正常發展，只有胎死腹中一途！而多了一條 21 號染色體的胚胎呢？那正是出生後患有「唐氏病」（Down’s
    syndrome）的原因！

    由此看來，細胞的基因表現上，一對染色體中多 50% 顯然不是什麼好事，那麼女性的 X 染色體比男性的 X 染色體整整地多了一倍，那上帝不是在故意給夏娃找麻煩嗎？

    沒有 X 染色體當然是不行，但顯然太多也不是福。在 1960 年代初期，英國遺傳學家瑪莉‧里昂（Mary Lyon）提出了 X 染色體「劑量補償」（dosage
    compensation）的假設。 她預測：


    1.正常雌性的細胞僅含一條活性（active）X 染色體；

    2.另一條 X 染色體在早期胚胎發展過程中就被「去活化」（inactivation）了；

    3.被去活化的 X 染色體可能是父親或母親的版本，在每個細胞內個別隨機發生；

    4.發生在「體細胞」內的去活化是不可逆的，隨細胞分裂一代一代地傳下去。


    經過半個世紀多的研究，這些預測現在被證明是完全正確的，因此有些教科書稱此一「去 X 染色體活性」為「里昂化」（Lyonization）⎯⎯不少生物學家、細胞學家、遺傳學家認為里昂有資格獲得諾貝爾獎。看來上帝還是公平的：夏娃雖然有兩條
    X 染色體，但只有一條具有活性，另外一條看來只是裝飾用的。


