    由於 X 染色體與其他染色體有所不同，我們的身體顯然有特別辨識及計數的機制，如前面所介紹的，除了 21 號染色體外（唐氏症），多出任何其它染色體的胚胎都沒辦法正常發展。因為這個辨識、計數、及去活化的機制，多條
    X 染色體的胚胎常常可以生存下來，只是生理機能上會出現某些缺陷！


    節錄自【泛科學－染色體「X 檔案」解密！——談談女性「X 染色體去活化」機制】'
