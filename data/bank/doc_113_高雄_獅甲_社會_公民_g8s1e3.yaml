- id: doc_113_高雄_獅甲_社會_公民_g8s1e3_s1_48
  section: 1
  number: 48
  type: single
  page: 2
  stem: 根據全文內容，下列對日本的政府官員之敘述，何者最合理？
  options:
  - label: A
    content: 天皇是內閣的最高領導者
  - label: B
    content: 內閣總理大臣至少都年滿 30 歲
  - label: C
    content: 國務大臣至少都年滿 25 歲
  - label: D
    content: 日本首相與我國行政院長的產生方式相同，皆由國家元首直接任命
  group_stem: '雖然同樣是民主國家，但日本的政府體制與我國差異甚大。日本擁有皇室制度，天皇卻不是日本的最高行政首長，而僅僅只是象徵性的國家元首，不具任何政治實權。日本政府體制為內閣制，其國會分為參議院與眾議院，內閣由全體國會議員組成。內閣具體的組成過程是由全體國會成員推舉一名國會議員為內閣總理大臣，也就是我們所熟知的「首相」，亦即日本的最高行政首長。這名推選出來的內閣總理大臣在經過天皇形式上的任命程序之後，他會再從國會成員裡尋找閣僚，並任命這些人為國務大臣。最後天皇在認證內閣總理大臣所任命的人選之後，組閣便告完成。


    關於日本的選舉規定可以追溯至 1889 年，當時規定 25 歲以上且繳納國稅在 15 日元以上的男性才擁有選舉權，後來逐步取消了納稅的限制，二戰之後更進一步讓滿
    20 歲的男女都獲得選舉權。1950 年時，日本正式頒布《公職選舉法》，除了舊有的年齡限制外，增加了選民需要在選舉區居住 3 個月以上才可以投票的規定。2015
    年時該法修正，投票年齡於 2016 年降低至 18 歲。


    倘若想要從政，日本對於參選的年齡門檻限制也與我國不同。參選眾議院議員、市町村長（相當於我國的市／鎮／鄉長）、地方議員，都需年滿 25 歲；參選參議員、都道府縣知事（相當於我國的縣市長）則需年滿
    30 歲。'
  tags:
    chapter:
      publisher: 康軒
      book: 八上
      subject: 公民
      code: 4-1
      title: 我國的中央政府如何組成
      chapter: null
    textbook: 八上公民 4-1 我國的中央政府如何組成
    labeled_by: ai
