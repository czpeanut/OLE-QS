  group_stem: '安可與晨威在討論外帶咖啡的塑膠杯蓋會釋出致癌物質嗎？下列為網路上找到大家關心的一則問與答：


    問：外帶咖啡的塑膠杯蓋會釋出致癌物質，是真的嗎？

    答：過去咖啡杯蓋的材質多為聚苯乙烯（簡稱PS），由苯乙烯（$C_{8}H_{8}$）聚合而成，相關單位已對此材質訂出使用規範，確保安全。為免疑慮，市面咖啡杯蓋材質已逐漸改成聚丙烯（簡稱PP），由丙烯（$C_{3}H_{6}$）聚合而成。PS和PP都屬於熱塑性聚合物，只要符合規定，消費者正常使用，尚無安全疑慮。'
