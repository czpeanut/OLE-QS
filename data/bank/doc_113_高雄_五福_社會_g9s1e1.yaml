  options:
  - label: A
    content: 預期心理
  - label: B
    content: 自由財
  - label: C
    content: 人力資源
  - label: D
    content: 經濟財。
  group_stem: '三、 題組題(請回答27~29 題)


    日本富士山靠山梨縣側的吉田口登山步道今天起開放。縣府首度祭出限制單日入山人數及開徵「通行費」等措施，希望解決「觀光公害」問題，鑒於近年登山客持續增加，政府從今天起限制從吉田口登山步道攀登富士山的人數，宣佈啟用「富士山登山線上預約系統」，單日登山上限人數4000
    人，並徵收每人2000 日圓「通行費」。（中央社富士山1 日綜合外電報導2024/7/1 https://www.cna.com.tw/）

    根據《每日頭條》報導，僅管富士山已經被視為是日本的代表之一，這座山的海拔3360 公尺以上其實都不是政府所有，而是屬於市宮町淺間神社的私人所有地。為了維持這座山的完整開放，日本政府甚至每年都必須向神社方繳交一筆龐大「租用金」。(節錄自Ettoday
    https://www.ettoday.net/)

    民眾登上富士山上若要使用廁所須要「額外收費」，支付日幣100 至300 不等。值得注意的是，由於部分收費廁所並無管理人，大多探取投幣的形式。(改寫且節錄自https://www.hk01.com/)'
