  page: 4
  stem: 疫後機票飆漲，日本熱門航線漲幅超過5 成，機場又重回門庭若市，雖然機票變貴了但民眾還是趨之若鶩，因為無法增加航班，航空公司只好用這種「以價制量」的方式達到維持旅遊品質的效果，請問下列何者符合畫線中的敘述?
  options:
  - label: A
    content: 需求法則~價格高消費者少買
  - label: B
    content: 供給法則~價格低供給者少賣
  - label: C
    content: 需求法則~價格低消費者多買
  - label: D
    content: 供給法則~價格高供給者多賣。
  group_stem: '一、 題組題(請回答18~22 題)


    疫情後機票價格高漲，日本熱門航線漲幅超過5 成，解封已逾一年，機場又重回門庭若市、大排長龍的熟悉景象，許多民眾展開久違的旅程，除了期待與雀躍，一定都明顯感受到「機票變貴了」。疫後機票飆漲，關鍵來自供應不足、成本居高不下，航空業者指出3
    大具體因素，第一是「需求大於供給」、第二是「油價居高不下」、第三為「人力流失」。

    未來機票走勢如何，航空高層均預測，「高票價的趨勢不變，會成常態」，甚至認為「今年機票只會上不會下」，來自航空所有成本都上漲，而隨著永續議題發燒，未來生質燃油的添加、碳費的加徵，勢必還是會帶動機票價格上揚。(節錄自2024.02.09
    中央社工商時報https://www.ctee.com.tw/)'
