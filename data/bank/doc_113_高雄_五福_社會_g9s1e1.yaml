  section: 1
  number: 49
  type: single
  page: 7
  stem: '印度夏天的雨季很長，早期印度托缽遊化的佛教僧人需要找地方躲雨，而且一躲就是好幾個禮拜。僧人不太有錢，只能找天然的山洞、石窟安居修行。在石窟裡得住一段時間，僧人就造佛像、佛塔來禮拜，或是造禪修的小房，在石窟裡發展出佛教藝術，然後這習慣隨著佛教傳播而進入中亞和中國甚至遠到南亞、東南亞、日本、韓國。

    改編自「在石窟找歷史的背包客」──顏娟英


    上文為中研院史語所顏娟英博士提及為研究佛教石窟藝術走訪多國的歷程，可以得知佛教相關發展下列何者正確？(甲)釋迦牟尼為了打破婆羅門教階級觀念而創立佛教(乙)佛教主張善有善報、惡有惡報，行善者死後靈魂必通過審判而復活(丙)石窟藝術從印度進入中亞、中國遠到日本、韓國，是因為阿育王派遣高僧向外弘法(丁)僧侶主張神愛世人，與種姓制度社會階級觀念不合，而屢遭印度政府迫害。'
  options:
  - label: A
    content: 甲丙
  - label: B
    content: 乙丁
  - label: C
    content: 甲丁
  - label: D
    content: 乙丙。
