- id: doc_113_高雄_五福_社會_g9s1e1_s1_47
  section: 1
  number: 47
  type: single
  page: 7
  stem: '西元一世紀前後的人類歷史，在東方與西方不同的時空背景發展下，竟然出現類似的巧合。當時東方強權為中國的秦漢帝國，而西方則是偉大的羅馬帝國，兩者的發展巧合如下：

    巧合一：秦漢帝國以及羅馬帝國最主要的的外患皆來自於北方。

    巧合二：兩帝國在後期皆陷入了分裂的局面。

    巧合三：東西方的文化成就皆相當高且影響至今。


    我們可以用何者佐證巧合三的說法？'
