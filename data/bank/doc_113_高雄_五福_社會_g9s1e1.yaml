  stem: 東歐的烏克蘭位處歐洲大平原，土壤肥沃，是全球主要糧食出口國之一，每年向全球市場供應約4,500 萬噸糧食。依其所在自然環境判斷，哪個農產品會是烏克蘭主要出口品項？
  options:
  - label: A
    content: 稻米
  - label: B
    content: 可可
  - label: C
    content: 小麥
  - label: D
    content: 葡萄。
  group_stem: '【題組二】

    俄烏戰前，烏克蘭90%以上的糧食出口都是通過海運。2022 年2 月俄國入侵烏克蘭後，烏克蘭臨黑海的港口遭俄羅斯封鎖，烏克蘭試圖使用卡車、火車或河運，由鄰國港口出口盡可能多的農產品(圖七)，但出口量遠比海運要低很多。

    《黑海穀物協議》是由聯合國、俄羅斯、烏克蘭和土耳其四方達成的倡議，該倡議允許經由黑海「海上人道主義走廊」，從烏克蘭南部的三個主要港口向世界各地出口穀物和其他食品。2022
    年7 月22 日，四方在土耳其國境內達成倡議並舉行簽署儀式。2023 年7 月，俄羅斯宣布中止此項倡議，烏克蘭農產品出口再度面臨危機。'
