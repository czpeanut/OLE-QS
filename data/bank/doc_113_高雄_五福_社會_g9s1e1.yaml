- id: doc_113_高雄_五福_社會_g9s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '2024 年1 月某雜誌舉辦經濟論壇，其中有位曾擔任臺灣某高科技公司執行長多年的演講者認為，未來十年臺灣資訊及通訊硬體製造產值仍佔全球極大比重，表一是該演講者分析未來臺灣此類廠商須注重海外布局的國家或地區，請分析表中這四個國家或地區共同的工業發展優勢為何?


    表一

    | 國家或地區 | 特色 |

    | --- | --- |

    | 東南亞 | 自中國遷移過來的工廠多，可配合政府新南向政策 |

    | 東歐 | 可多注重捷克、匈牙利等東歐國家，以進一步拓展歐洲市場 |

    | 印度 | 數理資訊教育發達、使用英語人口多 |

    | 中國 | 臺商較早進駐的國家，近年內需市場擴大，值得關注 |'
  options:
  - label: A
    content: 皆為EU 的成員國，彼此享有關稅減免優惠
  - label: B
    content: 皆簽屬申根公約，產品及人員流動不受國界限制
  - label: C
    content: 皆具有薪資較低的優勢，適合納入產業供應鏈
  - label: D
    content: 皆位於低緯度地區，適合太陽能發電，能源供應無虞。
