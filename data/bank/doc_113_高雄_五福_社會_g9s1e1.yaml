- id: doc_113_高雄_五福_社會_g9s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 克羅埃西亞於2013 年加入歐盟，並於2023 年1 月1 日正式加入申根區及歐元區，克羅埃西亞民眾對於成為申根區及歐元區後，國家經濟發展的利弊存在正反兩面的意見。部分民眾認為有助於國家經濟發展，部分反對的民眾認為僅有法國、德國等大國可從中獲益。抱持正面看法的民眾提出的論點應包含下列何者？
