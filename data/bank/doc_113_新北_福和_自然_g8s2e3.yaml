- id: doc_113_新北_福和_自然_g8s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 大福將自己的獎狀拿去文具店護貝，店員將獎狀放進一台會加熱的機器中，不久後，獎狀外層就包上了一層光滑透明的膜，防水又防皺。大福查了關於護貝膜的資料，護貝膜常見的成分有聚酯（PET），透明、有強度，加熱會軟化，冷卻後會硬化。EVA（乙烯-醋酸乙烯酯共聚物），有彈性，熱黏合性好，通常是護貝膜的「膠層」，受熱時可以熔融黏合到紙張上。根據上述資料，請問
    PET 和 EVA 何者是熱固性聚合物？
  options:
  - label: A
    content: 只有 PET
  - label: B
    content: 只有 EVA
  - label: C
    content: 兩者都是
  - label: D
    content: 兩者都不是。
  answer:
  - D
  answer_source: answer_key_vlm
