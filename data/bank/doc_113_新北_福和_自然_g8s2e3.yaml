  section: 1
  number: 1
  type: single
  page: 1
  stem: 有關乾餾和分餾的敘述下列何者錯誤？
  options:
  - label: A
    content: 乾餾是將物質在空氣中加熱使其分解產生更小的分子
  - label: B
    content: 分餾是利用混合物中各成分沸點不同的特性，經加熱使其部分蒸發，並經由分餾塔分離出各成分的過程
  - label: C
    content: 乾餾的過程因為有產生新的物質，所以屬於化學變化
  - label: D
    content: 分餾的過程則是沒有新物質生成，只是將原來的物質分離，屬於物理變化。
  answer:
  - A
  answer_source: answer_key_vlm
