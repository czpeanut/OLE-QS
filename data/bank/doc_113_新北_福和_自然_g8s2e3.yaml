  stem: '以下是一段文章摘要：蜘蛛絲由絲蛋白構成，蛋白質為含有碳、氫、氧、氮、硫元素的大分子化合物。研究指出，其結構內部具有規律的摺疊層，使蜘蛛絲比鋼更強韌，並具極佳延展性。研究人員嘗試人工製造「仿蜘蛛絲材料」，希望用於製作降落傘繩與醫療縫線。這些材料需具備高強度、輕量且可拉伸的特性。

    根據上列摘要，下列推論何者合理？'
  options:
  - label: A
    content: 蜘蛛絲具有彈性，可能適合作為生物醫材
  - label: B
    content: 蜘蛛絲與鋼鐵一樣，屬於無機物
  - label: C
    content: 絲蛋白由許多脂肪酸聚合而成
  - label: D
    content: 絲蛋白不含氮元素。
  answer:
  - A
  answer_source: answer_key_vlm
