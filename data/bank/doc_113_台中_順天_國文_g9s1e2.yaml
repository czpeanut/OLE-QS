- id: doc_113_台中_順天_國文_g9s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: '公孫丑問：「您要是在齊國掌權，像管仲、晏嬰那樣的功績，能夠再現嗎？」<u>　甲　</u>，<u>　乙　</u>，<u>　丙　</u>。

    上文畫線處，應加入甲、乙、丙三句，才是一段完整的文句。請根據文意，判斷下列選項的排序，何者最恰當？

    (甲)「有人曾經問曾西：『您與管仲相比，誰的德行更好呢？』曾西很生氣的回答：『你怎能把我與管仲相提並論！他深得齊桓公信任，長期執掌大權，但功績卻是微不足道的。你為何讓我與他相比？』」

    (乙)孟子說：「你真不愧是個齊國人，就只知管仲、晏嬰時的盛況罷了。」

    (丙)孟子接著說：「管仲那一套，曾西都看不上他，你以為我會學他嗎？」'
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙甲丙
  - label: C
    content: 丙甲乙
