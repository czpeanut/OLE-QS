    content: 僅取自騶奭所言「群言雕龍」之意
  group_stem: '夫文心者，言為文之用心也，昔涓子琴心，王孫巧心。心哉美矣，故用之焉。古來文章以雕縟①成體，豈取騶奭之群言雕龍②也。

    夫宇宙綿邈③，黎獻④紛雜，拔萃出類，智術而已；歲月飄忽，性靈不居，騰聲飛實⑤，製作而已。夫有肖貌天地，稟性五才⑥，擬耳目於日月，方聲氣乎風雷，其超出萬物亦已靈矣。形同草木之脆，名踰金石之堅，是以君子處世，樹德建言，豈好辯哉，不得已也。

