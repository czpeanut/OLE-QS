- id: doc_113_台中_順天_國文_g9s1e2_s2_33
  section: 2
  number: 33
  type: single
  page: 4
  stem: 根據上文判斷，下列何者不是大師兄的書暢銷的原因？
  options:
  - label: A
    content: 文句有溫度，真實傳遞心靈的感受
  - label: B
    content: 用輕鬆的筆觸描繪沉重的死亡議題
  - label: C
    content: 生活經驗的真切分享，讓人感同身受
  - label: D
    content: 分享從人生谷底走向成功的經驗，激勵人心
  group_stem: '34 歲的大師兄自稱肥宅，每當提到死亡的話題，他總自嘲：「我知道自己的體型，我說不定很容易心肌梗塞。」果然是見過上千百具遺體的人，談論死亡，百無禁忌。

    大師兄何許人也？他是以接體員身分在 PTT Marvel 版（網路平台）撰寫「接體員的大故事」系列文章爆紅的匿名作家，最為人知的便是分享他在殯儀館擔任接體員期間的工作點滴，以及他所看到活人與亡者間的各種故事。接體員，是指接送遺體、管理冰櫃的工作人員，「有時我在殯儀館等遺體送來，然後讓家屬和死者好好說話，有時我要出去把無名屍體帶回來，我的工作，就是讓他們有地方好好休息，」大師兄說。

    他的第一本著作你好，我是接體員 2018 年推出就迅速登上銷售排行榜第一名，就連他自己也覺得不可思議。「我就只是寫自己的感受啦，沒什麼特別的。」「愛哭、太重感情」是作家好友敷米漿對他的評價，「他常常跟我講著家屬的故事講著講著就掉眼淚，用盡生命的力氣去寫故事，對自己的情緒負擔太大了，」敷米漿說。例如他曾服務過一位老奶奶，看著家屬哭著送別她的場景，大師兄也跟在家屬後面掉著眼淚，哭到讓禮儀師誤會他也是家屬之一，還安慰他：「人死不能復生。」

    處女作熱賣後，他接連又出了兩本書。火來了，快跑講述他從冰庫轉調火葬場後的工作見聞。好友林立青形容大師兄最過人之處是「幽默」，無論際遇好壞，都能讓人笑出來，例如聊起死亡，大家沉默不語時，他會突然說：「但肚子餓了雞排還是該吃！」眾人忌諱的死亡百態，到大師兄面前彷彿都是一幕幕黑色喜劇。

    「坦白說，我一路以來都不知道自己要做什麼，」大師兄做過超商店員、開過雞排店、運鈔車，還當過照服員，最後來到殯儀館，這一串的職涯軌跡隨意而凌亂，他的父親似乎是推手，將年輕的大師兄，推入了沒有未來的無助感裡。

    「我的爸爸很好賭，從小就欠了很多債，」大師兄嘆了口氣。他的爸爸曾是工地工頭，收入雖然不錯，但偏偏嗜賭，賺再多也抵不上輸掉的債，為此媽媽只能不斷向親戚借錢。

    儘管現在他還是沒賺什麼大錢的大師兄，但他卻說自己是個快樂的肥宅。肥宅的快樂秘訣是什麼？答案很簡單，平安活著。

    送走爸爸後過著沒有債務、有穩定工作的平穩人生，當然快樂。雖過不上大富大貴的生活，但大師兄卻把財富視為浮雲，「我昨天在火葬場才幫一個在科技業工作的年輕人撿骨，年薪百萬到我面前就是一堆骨頭，」他搖了搖頭，說他不想這樣。

    最後問他對死亡有什麼看法？「當然是活一天賺一天啊！」看見他的笑容，那爽朗興奮的神情，彷彿自己中了樂透頭獎。的確，看多了死生，會知道平安有多奢侈，平日平安活在世上的我們，都是頭獎得主。

    節選自親子天下 人物特寫'
