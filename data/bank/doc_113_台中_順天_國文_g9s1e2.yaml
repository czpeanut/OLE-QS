- id: doc_113_台中_順天_國文_g9s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 「劉勰文心雕龍中，依照對偶句法的內容，提出：『言對為易，事對為難；反對為優，正對為劣。』言對是指上下聯兩相對偶的文句，都不用典故；事對，是指上下聯人事對舉，都有人事地物，可以徵驗；反對，是指事理表面看似相反，但是旨趣是相合的；正對，是指上下文句，事情雖然不同，但意義卻是完全一樣的。」依照上文，請問下列選項中，何者屬於劉勰所謂「優」的對偶？
  options:
  - label: A
    content: 王燦登樓賦：「鍾儀幽而赴秦，莊舄顯而越吟。」
