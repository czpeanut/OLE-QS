  type: single
  page: 2
  stem: '「字」通常由「名」衍生而來，字與名往往有特定的聯繫。可分為：

    一、同義互剖：這是說名與字的意義相同，或者可以互相解釋。

    二、反義相對：這是說名與字的意義相反。

    三、相關聯想：有些「名」、「字」並不一定相同或相反，而是有因果關係或連屬的關係。

    四、原名變化：這是單純把原有的名作一些簡單的變化，而這種變化是不規則的。

    請判斷下列表格中「名與字的關係」，何者錯誤？


    | | 字 | 名與字的關係 | 說明 |

    |---|---|---|---|

    | (A) 胡適 | 適之 | 原名變化 | 「適」有「往」之意；加虛詞「之」意則不變 |

    | (B) 班固 | 孟堅 | 同義互訓 | 「固」與「堅」兩字，皆具有結實、堅硬的意思。 |

    | (C) 楊過 | 改之 | 反義相對 | 取「知過能改」之意，知道自己「犯錯」，而能「改正」。 |

    | (D) 趙雲 | 子龍 | 相關聯想 | 「龍」起生雲，同類事物能互相感應。 |'
