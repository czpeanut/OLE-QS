- id: doc_113_台中_四育_英語_g9s1e3_s4_47
  section: 4
  number: 47
  type: single
  page: 4
  stem: In the past history, obesity was thought to be _______ .
  options:
  - label: A
    content: unhealthy
  - label: B
    content: sick
  - label: C
    content: ugly
  - label: D
    content: pretty
  group_stem: '( 47-48 )

    Doctors say that obesity is the serious problem of the 21st century. But what
    is obesity? A person who is obese is too heavy. The problem of being overweight
    is caused by building up too much fat. Research shows that obesity may cause different
    diseases, such as cardiovascular diseases, sleep apnea, certain types of cancer,
    gout, and osteoarthrits. Obesity has also been found to reduce a person’s life
    expectancy.

    A person’s “BMI”(body mass index) can show if a person is obese. BMI is calculated
    by dividing an individual’s weight in kilograms by the square of his or her height
    in meters. Someone who weighs 80 kilograms and is 1.6 meters tall will have a
    BMI of 31.25. A BMI of between 18.5 and 24 is said to be healthy. If it’s more
    than 30, the person is probably obese.

    In the past, it was thought to be beautiful to be heavy, because it meant you
    had enough food. Now, obesity has become a serious public health problem. Between
    the 1980s and today, the number of obese people in the USA has jumped. For the
    first time in human history, there are now more overweight problems than people
    who are starving. Obese people may need medical care more than people with a healthy
    weight, so obesity is very expensive for socities.

    Why are so many people obese? There are many reasons, but generally, we eat too
    much food and don’t exercise enough. The types of food we eat also have an impact.
    Sugary, processed foods give us a rush without actually providing much nutrition.
    They can also be addictive. It’s also hard to exercise when the junk food we eat
    doesn’t give us energy and makes us tired.

    But we can take control. As individuals and societies, we should take a hard look
    at our choices and make some changes.

      cardiovascular diseases 心血管病  sleep apnea 睡眠呼吸中止  life expectancy 壽命 individual
    個人 processed foods 加工食物  impact 影響  nutrition 營養'
