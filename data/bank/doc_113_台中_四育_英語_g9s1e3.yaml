- id: doc_113_台中_四育_英語_g9s1e3_s4_43
  section: 4
  number: 43
  type: single
  page: 3
  stem: What is the purpose of the e-mail?
  options:
  - label: A
    content: To invite someone to a party at school.
  - label: B
    content: To thank someone for what he or she had done.
  - label: C
    content: To say sorry for what happened at dinner.
  - label: D
    content: To thank someone for a gift he or she got.
  group_stem: "( 43-44 )\nFrom: Maya Barack (m_barack@mail.net)\nTo: Phillip Glass\
    \ (pglass@mail.net)\nSubject: Thank You!\nDear Phillip,\n    What you did in the\
    \ playground at the school this afternoon was amazing, and I can’t thank you enough.\
    \ I’m sorry I didn’t tell you right after it happened, but I just wanted to get\
    \ away from there as quickly as possible. I hope you can understand that.\n  \
    \  About an hour before you came along, I had just started running on the track.\
    \ I saw some people playing basketball and others doing the same thing as me.\
    \ However, unlike me, they had headphones on. I had run for about 30 minutes when\
    \ I saw those guys enter the back gate. They were making a lot of noise and pushing\
    \ each other around for fun. I didn’t worry too much about them because I thought\
    \ they’d just pass through. Instead, they found a place to sit, and that was when\
    \ it all began. Every time I passed them, they shouted comments about my body\
    \ and what they’d like to do to me. It made me very uncomfortable. I was just\
    \ about to leave when you showed up and gave them a piece of your mind. I could\
    \ tell by the looks on their faces what you said really made them take their actions\
    \ more seriously.\n  Nobody has ever done that for me! To show my appreciation,\
    \ I’d like to treat you to dinner. Just let me know when is good for you.\nMany\
    \ thanks,     Maya                                         track 跑道  headphones\
    \ 耳機  comment 評論"
