  - label: C
    content: Breaking a mirror.
  - label: D
    content: Finding a coin on the ground.
  group_stem: "( 45-46 )\nIn every culture, many people have different superstitions.\
    \ In Taiwan, people wear red clothes to bring good luck. During Chinese New Year,\
    \ people also give red envelopes for good luck. As for numbers, Taiwanese don’t\
    \ like the number “four” because it sounds like “death.”\nIn Ireland, people believe\
    \ at the end of every rainbow, they can find a pot of gold. There are other ways\
    \ to have good luck in other Western countries. For example, finding a coin on\
    \ the ground brings good luck. People even believe children born on the first\
    \ day of the month will have good luck in their whole lives. It is easy to have\
    \ bad luck as well. For example, people in America don’t walk under a ladder.\
    \ They can’t break mirrors because it may bring seven years of bad luck. Also,\
    \ they don’t open umbrellas inside their houses.\n                       superstition\
    \ 迷信  Ireland 愛爾蘭  coin 硬幣"
