- id: doc_113_屏東_中正_國文_g8s2e3_s6_7
  section: 6
  number: 7
  type: single
  page: 4
  stem: 下列是學員們根據搜尋的資料所提出的判讀，但錯誤頗多，唯一正確的是何者？
  options:
  - label: A
    content: 在亮度上織女星＞牽牛星＞太陽
  - label: B
    content: 七夕時織女星與牽牛星較近銀河，織女、牛郎可由此光帶相會
  - label: C
    content: 牽牛星的表面溫度、體積都大於織女星
  - label: D
    content: 天津四與牽牛星、織女星號稱秋季大三角。
  group_stem: '(三)

    文學天文營：學校在暑假時舉辦了「文學與科學交會的光芒」研習營，探討牛郎、織女星宿的相關議題。希望在七夕來臨前引領「追星族」一探星空的神祕與美好。以下是同學們蒐羅、分享的相關資料：

    Ａ文學組

    1. 七夕與乞巧節傳說

    古人認為「七」為吉數，有圓滿之意，且「七七」之夜是月亮較近銀河的時候，更便於觀星。又因牛郎 織女的故事深植人心，織女就被當成天神中巧婦的代表。婦女們七夕祭拜織女星，期盼自己有一隻能穿針引線、織布縫衣的巧手，故「七七」就成了「乞巧節」。此習俗的文字記錄最早可追溯至漢代，到了唐代已極為盛行。

    2. 杜牧 秋夕

    銀燭秋光冷畫屏，輕羅小扇撲流螢。

    天階夜色涼如水，臥看牽牛織女星。

    此詩又名七夕，寫宮中女子七夕時觀看牽牛星、織女星的情景。詩中不帶一愁字、淚字，卻透露出深藏在宮女心中的哀怨與孤寂。全詩含蓄蘊藉，寓情於景。

    Ｂ科學組

    1. 牽牛星和織女星是兩顆能自己發光發熱的恆星。牽牛星的直徑約為太陽的1.6 倍，亮度約為太陽的10 倍，是整個夜空中亮度排第十二的恆星。它的表面溫度可達七千度，距離地球約16
    光年（一光年約等於十萬億公里）。織女星的直徑約為太陽的3.2 倍，亮度約為太陽的50 倍，是整個夜空中亮度排名第五的恆星，在北半球排名第二。它的表面溫度可達八千九百度，距離地球約26
    光年。

    2. 在銀河西北邊最亮的一顆星就是織女星，在織女星的南方偏東，即銀河的東南邊，就是牽牛星（又名河鼓二）。這兩顆恆星加上另一顆恆星天津四，組成了夏季夜空中最亮也最容易看到的「夏季大三角」。

    3. 牽牛星屬於「天鷹星座」，織女星屬於「天琴星座」。兩顆星中間有一條從東北向西南方向劃開的光帶，就是所謂的「銀河」。在銀河裡有許多白色粉末般的小光點，一顆白色粉末就是一顆巨大的恆星，銀河就是由無數恆星構成的，其中的牽牛星與織女星相距約16
    光年。因此，據現代天文觀測及測算結果，他們每年的「七夕相會」，是絕不可能發生的。

    ◎科學組參考資料：泛科學網站刊載臺北天文館發布七夕小常識—牛郎織女的真面目。

    請根據上述資料，回答下列各題。'
