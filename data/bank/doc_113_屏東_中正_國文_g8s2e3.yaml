- id: doc_113_屏東_中正_國文_g8s2e3_s5_1
  section: 5
  number: 1
  type: single
  page: 1
  stem: 恩恩上網搜尋有關「銘文」的特色，並做出重點摘錄。請問其中哪項重點不需要做修正?
  options:
  - label: A
    content: 「銘」本義為記錄，古人常將文字刻在金屬、碑石上
  - label: B
    content: 銘文主要特色為文辭精煉且寓意深刻
  - label: C
    content: 「銘」後來演變為一種文體，用來警惕、或評判人物
  - label: D
    content: 銘文ㄧ般篇幅長，多以韻語表達 。
  tags:
    textbook: 八下 第七課 陋室銘
    labeled_by: ai
    chapter:
      publisher: 康軒
      book: 八下
      subject: 國文
      code: 第七課
      title: 陋室銘
      chapter: null
- id: doc_113_屏東_中正_國文_g8s2e3_s5_2
  section: 5
  number: 2
  type: single
  page: 1
  stem: 有關〈陋室銘〉一文的敘述，何者最正確？
  options:
  - label: A
    content: 全篇文章為作者自傳式，表現個人遠大抱負
  - label: B
    content: 以「斯是陋室」為敘寫核心，貫串全文
  - label: C
    content: 全篇句型均為對偶，一韻到底，展現音韻之美
  - label: D
    content: 以「何陋之有」自信才德能使「陋室」不陋 。
  lesson_raw:
    title: 陋室銘
    basis: 題幹提及〈陋室銘〉一文
  tags:
