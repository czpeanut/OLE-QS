- id: doc_113_屏東_中正_國文_g8s2e3_s6_9
  section: 6
  number: 9
  type: single
  page: 5
  stem: 依據本文中的文章分析，何者正確？
  options:
  - label: A
    content: 現今會考趨勢，記憶背誦能力已式微
  - label: B
    content: 辨識力與闡釋力兩者間存在衝突關係
  - label: C
    content: 國文段考與會考的準備方法異中存同
  - label: D
    content: 文言轉譯能力更重於白話長文理解力。
  group_stem: '(四)

    國中國文怎麼讀？

    知彼篇

    •段考國文

    命題範圍：課文大意、習作、作者介紹、形音義、注釋、成語、詩詞、語文與國學常識、課外閱讀理解。

    準備方法：熟悉段考考試範圍，提升文言文轉譯、白話長短文閱讀理解等能力。

    •會考國文

    命題範圍：形音義、成語、詩詞、語文與國學常識、課外文言文、白話文閱讀理解。

    準備方法：累積詞彙量、成語量、語文與國學常識，提升文言文轉譯、白話長短文閱讀理解、非連續文本解析等能力。

    知己篇

    •基本認知力：

    段考或會考都有憑認知能力可判斷的基本題數，即所謂的記憶性考題。若肯再花些時間於記憶背誦，拿到這部分的分數可謂輕而易舉。除非粗心、看錯題目、畫錯答案卡！

    •準確辨識力：

    在訊息裡，發現明確關鍵詞語的能力，有助於文本識讀。辦識力的準確度顯著影響詮釋、重組文意的表現。唯有學會判讀關鍵訊息，才能真正提升閱讀能力！

    •轉譯闡釋力：

    能夠掌握圖表與長篇敘述，轉譯文章意涵，推敲言外之意。比如：「這句話在告訴我們什麼道理？」、「這句話所傳達的態度和下列何者最接近？」若先學會擷取正確關鍵語句，學習掌握文句關聯性，有助由選項中做合理解讀及闡釋。

    百戰百勝篇

    •提升國文語感，掌握關鍵詞句，熟悉解題技法，便能左右逢源，得心應手！

    （改寫自網路文章）'
