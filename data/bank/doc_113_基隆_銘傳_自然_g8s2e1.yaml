- id: doc_113_基隆_銘傳_自然_g8s2e1_s5_41
  section: 5
  number: 41
  type: single
  page: 4
  stem: 關於漂白的原理，下列敘述何者正確？
  options:
  - label: A
    content: 通過物理方法改變物質的顏色
  - label: B
    content: 通過氧化或還原反應改變染料分子結構
  - label: C
    content: 只能使用氯進行漂白
  - label: D
    content: 只能在高溫條件下進行。
  group_stem: '漂白是一種用來去除物質顏色的過程，通常應用於衣物、紙張、牙齒或其他物品。漂白的原理是通過氧化或還原反應來分解或改變物質中染料分子結構，使其失去顏色。這通常涉及到強氧化劑或還原劑，它們能破壞染料分子中的共價鍵或其他關鍵結構。氧化漂白劑通常利用強氧化劑（如氯、過氧化氫）將染料分子中的化學鍵打破，從而消除顏色；這也最常見的漂白方式。還原漂白劑（如硫化物）則可以將染料分子中的某些化學鍵還原，使顏色變得不明顯或消失。

    常見的漂白方式如下：


    | 漂白方法 | 優點 | 缺點 | 主要應用範圍 |

    | --- | --- | --- | --- |

    | 過氧化氫漂白 | 反應溫和、對環境友好，能有效去除有機物的色素 | 過程中需要控制濃度和時間，否則可能損傷材料 | 牙齒漂白、紙張漂白、衣物漂白 |

    | 氯漂白 | 漂白效果強，適用於大量物品的處理 | 氯氣有毒；對某些材料（如某些染料）可能有損害 | 衣物漂白、工業清潔 |

    | 氧化漂白 | 適用範圍廣，能有效去除多種顏色的染料 | 可能會對某些天然纖維（如羊毛、絲綢）造成損傷 | 衣物、紙張漂白 |

    | 還原漂白 | 適用於特定的染料，對某些染料顏色改變有顯著效果 | 主要限於還原型染料，處理時可能氣味難聞 | 某些染料的去色，部分食品的漂白 |'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
  tags:
