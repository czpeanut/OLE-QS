  stem: 在中國近代史上，此處的租界開闢最早，為對外開港時間最早的港口之一，經濟的發展快速，對周邊地區的近現代歷史發展也產生了深遠影響，成為中國人接觸西方文化的一個重要窗口，上述的「此處」應該是指何者？
  options:
  - label: A
    content: 上海
  - label: B
    content: 北京
  - label: C
    content: 天津
  - label: D
    content: 南京
- id: doc_113_新北_中平_社會_歷史_g8s1e3_s1_31
  section: 1
  number: 31
  type: single
  page: 2
  stem: 《新民叢報》是清朝末年深具影響力的報紙，由逃亡到日本的梁啟超所主編。有學者曾如此評論：「梁啟超不但批判中國傳統文化，亦將日本流行的西方近代學術思潮傳輸到國內，形成對思想界的強大衝擊。」請問：下列何項觀念有可能出現在《新民叢報》中？
  options:
  - label: A
    content: 唯有仿效西方器物才能救亡圖存
  - label: B
    content: 成立總理各國事務衙門有效管理國際外交事務
  - label: C
    content: 婦女應受教育才能積極提升中國全體國民素質
  - label: D
    content: 推翻滿清政府才能挽救中國頹勢
- id: doc_113_新北_中平_社會_歷史_g8s1e3_s1_32
  section: 1
  number: 32
  type: single
  page: 2
  stem: 約翰是清末往返歐洲與中國貿易的英商。受到當時中英兩國之間的政局影響，他的貿易範圍如附圖黑點處所示。下列何者是約翰有可能出現的生活體驗？
  options:
  - label: A
    content: 聽聞英國特使因跪拜禮儀的爭議造成和談無功而返
  - label: B
    content: 目睹外國傳教士在中國內地傳教時與當地居民衝突
  - label: C
    content: 到臺灣進行貿易時須經由日本政府同意
  - label: D
    content: 若不幸因貿易糾紛殺傷中國人時可不受中國法律管束
