  group_stem: "燕昭王收破燕後即位，卑身厚幣，以招賢者，欲將以報讎①。故往見郭隗先生……郭隗先生曰：「臣聞古之君人，有以千金求千里馬者，三年不能得。涓人②言於君曰：『請求之。』君遣之。三月得千里馬，馬已死買其首五百金反以報君。君曰：『所求者生馬，安事死馬而捐③五百金!』涓人對曰：『死馬且買之五百金，況生馬乎？天下必以王為能市馬，馬今至矣。』於是不能期年，千里之馬至者三。今王誠欲致士，先從隗始；隗且見事，況賢於隗者乎？豈遠千里哉？」\
    \  （《戰國策‧燕策》）\n   注：①讎：音ㄔㄡˊ，通「仇」。\n②涓人：古代掌管宮中清潔灑掃事宜的人；或指君王的近臣。「涓」音ㄐㄩㄢ。\n③捐：捨棄、拋棄，在此引申為花費。"
