- id: doc_113_高雄_楠梓_國文_g9s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 有關元曲的說明，下列敘述何者正確？
  options:
  - label: A
    content: 曲可配樂歌唱，且句子長短不一，故又稱「樂府」、「長短句」
  - label: B
    content: 「曲牌」是填詞所用的曲調，和內容無關，也無固定格律
  - label: C
    content: 元曲分為散曲和劇曲兩類，劇曲有曲、科、白，「科」是指宮調
  - label: D
    content: 為補足語氣或描摹情態，可於句首或句中添加襯字。
- id: doc_113_高雄_楠梓_國文_g9s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 下列關於 馬致遠 天淨沙 秋思的敘述，何者最恰當？
  options:
  - label: A
    content: 馬致遠生逢太平盛世，以創作散曲、雜劇為樂，天淨沙一曲渾然天成，被譽為「秋思之祖」
  - label: B
    content: 天淨沙 秋思一曲，前三句形成互為對偶的「鼎足對」，勾勒出深秋寂寥蕭瑟的畫面
  - label: C
    content: 「古道西風瘦馬」一句描寫沿路旅途所見，表達近鄉情怯的忐忑不安
  - label: D
    content: 「夕陽西下，斷腸人在天涯」二句由情轉景，情景交融，烘托人物心緒。
  lesson_raw:
    title: 天淨沙 秋思
    basis: 題幹提及馬致遠 天淨沙 秋思
- id: doc_113_高雄_楠梓_國文_g9s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 馬致遠在天淨沙 秋思一曲中所描寫的心境，與下列何者不同？
  options:
  - label: A
    content: 渭水東流去，何時到雍州？憑添兩行淚，寄向故園流
  - label: B
    content: 新筍已成堂下竹，落花都上燕巢泥，忍聽林表杜鵑啼
  - label: C
    content: 多情卻似總無情，唯覺樽前笑不成。蠟燭有心還惜別，替人垂淚到天明
  - label: D
    content: 獨在異鄉為異客，每逢佳節倍思親。遙知兄弟登高處，遍插茱萸少一人。
  lesson_raw:
    title: 天淨沙 秋思
    basis: 題幹提及馬致遠在天淨沙 秋思
