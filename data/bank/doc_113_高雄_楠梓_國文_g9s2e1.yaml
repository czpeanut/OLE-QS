  stem: 下列各組「」中的國字，何者讀音前後相同？
  options:
  - label: A
    content: 形貌「昳」麗／金石「佚」文
  - label: B
    content: 「齟」齬／「齲」齒
  - label: C
    content: 大腹「便」便／「便」宜行事
  - label: D
    content: 口頭誹「謗」／吏卒多被「榜」笞。
