- id: doc_113_高雄_楠梓_國文_g9s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 「任何一種文體，不論唐詩、宋詞或元曲，之所以能大放異彩，都不可能是從天而降，而是水到渠成。 比起唐詩和宋詞，元曲更貼近庶民的生活和心情。宋詞發端於唐，到宋而達登峰造極。然而，到了宋末，已經不再能吟誦歌詠，文人所追求文字極致的美，也讓它逐漸和現實脫離，不再有著蓬勃的朝氣。因為偏重於形式的雕琢，講格律、重技巧、鋪陳堆砌，加上意境的艱深難懂，束縛太多，失去活力，也少了真摯的情感，於是逐漸被新興的文學——曲所替代。」根據這段文字，下列敘述何者正確？
  options:
  - label: A
    content: 詞的發展肇始於宋，無法吟誦歌詠
  - label: B
    content: 文人對於文字之美的追求，讓宋詞更加蓬勃發展
  - label: C
    content: 元曲偏重於形式之美，更貼近庶民的生活和心情
  - label: D
    content: 文體的發展有其脈絡可循。
