  page: 2
  stem: 關於來龍去脈探掌故―—歷代小品文賞讀的相關敘述，下列何者正確？
  options:
  - label: A
    content: 「只許州官放火，不許百姓點燈」中的「放火」是指放煙火
  - label: B
    content: 安祿山回答玄宗：「我肚中別無他物，只有滿滿的忠心啊!」玄宗於是更加寵信他，這是因為唐玄宗喜歡聽阿諛奉承的話
  - label: C
    content: 錢若賡 斷鵝一文中，錢若賡下令給鵝準備紙與筆硯，讓牠們寫供狀，是因為他有信心店主終究會招供
  - label: D
    content: 戴高帽一文中，「吾高帽一百，今止存九十九矣」，這段話的意思是戴別人高帽可以取悅對方，應多多益善。
- id: doc_113_高雄_楠梓_國文_g9s2e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 「呂蒙正以寬厚為宰相，太宗尤所眷遇。有一朝士，家藏古鑑，自言能照二百里，欲因公弟獻以求知。其弟伺間從容言之，公笑曰：『吾面不過碟子大，安用照二百里？』其弟遂不復敢言。聞者嘆服，以為賢於李衛公遠矣。_______，昔賢之所難也。」依據此段文字，畫線處最適合填入下列何者？
  options:
  - label: A
    content: 蓋寬厚而不恃傲才者
  - label: B
    content: 蓋儉嗇而不耗錢財者
  - label: C
    content: 蓋精明而不侮慢他者
  - label: D
    content: 蓋寡好而不為物累者。
- id: doc_113_高雄_楠梓_國文_g9s2e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 有關諺語的使用，下列何者不恰當？
  options:
  - label: A
    content: 「只許州官放火，不許百姓點燈」，豈能讓下屬心服口服
  - label: B
    content: 晴子因為一時口快，不小心傷了同學，事後她誠懇地向同學道歉，這樣的行為符合「解鈴還須繫鈴人」
  - label: C
    content: 「防民之口，甚於防川」，人民的言論若不加以規範，比水患還可怕
  - label: D
    content: 「行百里者半於九十」，事情越接近成功越困難，我們要再接再厲，堅持到底。
- id: doc_113_高雄_楠梓_國文_g9s2e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 下列詩詞所描述的節日，何者與「火樹銀花合，星橋鐵鎖開」代表的節日相距最近？
  options:
  - label: A
    content: 千門萬戶瞳瞳日，總把新桃換舊符
  - label: B
    content: 清明時節雨紛紛，路上行人欲斷魂
  - label: C
    content: 國亡身殞今何有，只留離騷在世間
  - label: D
    content: 平分秋色一輪滿，長伴雲衢千里明。
- id: doc_113_高雄_楠梓_國文_g9s2e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 「昔者有餽魚於鄭相者，鄭相不受。或謂鄭相曰：『子嗜魚，何故不受？』對曰：『吾以嗜魚，故不受魚。受魚失祿，無以食魚；不受得祿，終身食魚。』(新序 節士)」根據上面這段文字，下列何者最符合鄭相的行為？
  options:
  - label: A
    content: 兩害相權，則取其輕
  - label: B
    content: 失之東隅，收之桑榆
  - label: C
    content: 焚林而獵，竭澤而漁
  - label: D
    content: 臨淵羨魚，不如退而結網。
- id: doc_113_高雄_楠梓_國文_g9s2e1_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 根據上面這一則故事，可推知鬼官的心態為何？
  options:
  - label: A
    content: 留戀人世間的官位權勢而不知已死
  - label: B
    content: 想裝腔作勢，嚇跑生人
  - label: C
    content: 想完成生前未竟的職責
  - label: D
    content: 意圖使後人記得他。
  group_stem: "相傳南陽府有明季太守某歿於署中，自後其靈不散，每至黎明發點時，必烏紗束帶，上堂南向坐。有吏役叩頭，猶能頷之，作受拜狀。日光大明，始不復見。\n\
    \    雍正間，太守喬公到任，聞其事，笑曰：「此有官癖者也，身雖死，不自知其死故耳。我當有以曉之。」乃未黎明即朝衣冠，先上堂南向坐。\n    至發點時，烏紗者遠遠來，見堂上已有人佔坐，不覺趑趄不前，長吁一聲而逝。自此怪絕。\n\
    註 趑趄：音ㄗ ㄐㄩ，想前進又不敢前進。                                     (新齊諧·官癖)"
- id: doc_113_高雄_楠梓_國文_g9s2e1_s2_21
  section: 2
