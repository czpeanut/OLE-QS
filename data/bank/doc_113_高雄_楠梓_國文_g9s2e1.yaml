  - label: D
    content: 貓仔捕鼠、護書有功，但因為主人家貧，無法給予貓仔任何獎賞。
  group_stem: "【甲】   鹽裹聘貍奴①，常看戲座隅。時時醉薄荷，夜夜占氍毹②。\n          鼠穴功方列，魚餐賞豈無。仍當立名字，喚作小於菟③。\
    \                   (陸游 贈貓其一)\n          注：①鹽裹聘貍奴：鹽裹，一包鹽。貍奴，古人對貓的暱稱。古代習俗，主人向鄰居或商販討要貓仔時，往往要用相對貴重的鹽或小魚來交換，以表示對小生靈的重視。\n\
    \              ②氍毹：音ㄑㄩˊ ㄩˊ，毛織的地毯。 ③小於菟：小老虎。\n【乙】   裹鹽迎得小貍奴，盡護山房萬卷書。慚愧家貧策勳①薄，寒無氈坐食無魚。\
    \   (陸游 贈貓其二)\n          注：①策勳：此指薪資待遇。\n【丙】\n       「……習俗上，及一般用語上，通常將寵物之法律上所有人，稱為該寵物之「主人」。惟對於該所有人而言，其與寵物相互間，經常超越民法上「所有人」與「所有物」之「權利主體」與「權利客體」法律關係，而係另有非其他人所能感受之「情感關係」。\n\
    \       詳言之，家中飼養寵物者，不僅行政登記之「所有人」將其「寵物」視同子女，或孫子女（例如本件聲請人與Juby)；全家人亦大都視該寵物為「家中成員之一」。一般民眾亦已習慣將「寵物狗」稱為「毛小孩」，將「寵物貓」稱為「喵小孩」，且將所謂之「主人」，稱為「剷（鏟）屎官」。從前，嬰兒車上，躺著或坐著者，必為嬰幼兒；現在，經常是「汪/喵星人」。又，向飼養寵物貓或寵物狗之人詢問其寵物之性別時，不宜稱「公的或母的？」，而應稱「男生或女生？」。\n\
    \       前述將寵物擬人化的現象，在在彰顯寵物已非單純之「動物」，而毋寧係「視為自然人」。甚且，不必諱言，許多年輕人，特別是未婚者，關切其所飼養之貓、狗、兔等寵物，常遠甚於對自己父母之關心。\n\
    \       綜上，在觀念丕變之現代，加上少子化之推波助瀾，法律上，對於寵物，確實已不應再如以往，單純以「物」及屬於主人之「動產」視之。姑且不論是否應將寵物或動物之保護入憲，僅從所有人與其寵物之「身分關係」著眼，關於寵物遭受不法侵害時，其所有人得否請求慰撫金，在案例日增而立法者長期不聞不問之情形，於所有人聲請釋憲時，憲法法庭不應再沈默不語。\n\
    \                     (節錄自詹森林大法官提出憲法法庭111 年憲裁字第595 號裁定˙部分不同意見書)"
