  stem: 關於鄒忌諷齊王納諫的文句說明，下列何者正確？
  options:
  - label: A
    content: 「忌不自信」指出鄒忌因為貌不如人而沒有自信
  - label: B
    content: 「吾孰與徐公美？」是一句倒裝句
