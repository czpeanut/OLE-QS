- id: doc_113_高雄_楠梓_國文_g9s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 「宮婦左右，莫不私王；朝廷之臣，莫不畏王；四境之內，莫不有求於王。由此觀之，王之蔽甚矣!」對於上述文句的說明，下列何者錯誤？
  options:
  - label: A
    content: 宮婦左右偏愛齊王，因此無法客觀地勸諫齊王
  - label: B
    content: 朝廷大臣因為有求於齊王，故蒙蔽良心屈從齊王
  - label: C
    content: 依親疏遠近的關係，敘述齊王遭受蒙蔽的情形
  - label: D
    content: 君王的地位最高，被蒙蔽的程度往往最為嚴重。
  lesson_raw:
    title: 鄒忌諷齊王納諫
    basis: 引用鄒忌諷齊王納諫課文原句
