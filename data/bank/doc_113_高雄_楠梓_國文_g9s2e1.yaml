- id: doc_113_高雄_楠梓_國文_g9s2e1_s2_27
  section: 2
  number: 27
  type: single
  page: 4
  stem: 下列內容，哪一項未在本文中提及？
  options:
  - label: A
    content: 整潔的環境是重視細節的表現
  - label: B
    content: 科學的進步在於創新與改變
  - label: C
    content: 好習慣的養成需要後天的要求與訓練
  - label: D
    content: 教授對學生犯錯的要求是「不貳過」。
  group_stem: "從生活中訓練做事的態度          洪 蘭\n        有位研究所的學長最近來台訪問。我早上接他去演講時，發現他西裝筆挺地蹲在地上用小刀刮一個黑黑的東西。看到我，他抬頭說，「馬上就好，這些口香糖黏得真緊，不刮下不來。」然後有點歉意地說，「老習慣，改不過來，看到了非除去不可。」我大笑說，「你真不愧是我們教授的嫡傳弟子。」\n\
    \        我們的指導教授是個一絲不苟的人，治學嚴謹，對我們生活的要求尤其嚴格，所有東西用完一定要物歸原位，沒有歸位的若被他抓到，第一次原諒、第二次就要離開實驗室。他堅持做實驗要有最高的自我要求，所有的細節都要注意，嚴格執行每一個標準流程，他的口頭禪是「不允許第二次錯誤」，因為人生常常沒有第二次機會。他從生活細節中訓練我們做實驗的態度，他說科學要求的是精準，一是一，二是二，沒有「隨便」這兩個字。\n\
    \        他討厭骯髒，因為骯髒代表馬虎、不徹底的態度，曾有學長跟他抱怨，「老師，我們又不是要在地上吃飯。」他正色說，「人在不潔的環境中工作，會因環境的隨便而態度隨便，一不仔細就會出錯。做實驗每一個細節都很重要，一出錯就是一個動物的生命。」的確，這位學長做的是把探針插入老鼠的杏仁核中單細胞紀錄的實驗，他的馬虎態度的確弄死了好幾隻老鼠。\n\
    \        不可諱言的，在乾淨的環境中工作，的確心情愉快，效率好像也比別的實驗室高。這個自我要求的工作態度被訓練出來後，在人生的路上對我幫助很多。"
