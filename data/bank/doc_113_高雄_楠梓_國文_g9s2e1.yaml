  type: single
  page: 1
  stem: 下列關於白樸 沉醉東風 漁父詞的文句剖析，何者敘述有誤？
  options:
  - label: A
    content: 「黃蘆岸白蘋渡口，綠楊堤紅蓼灘頭」描述所處環境的色彩繽紛且生機盎然
  - label: B
    content: 「雖無刎頸交，卻有忘機友」，作者的「忘機友」是指白鷺、沙鷗
  - label: C
    content: 「點秋江白鷺沙鷗」一句與「飄飄何所似？天地一沙鷗」所呈現的意境相同
  - label: D
    content: 「傲殺人間萬戶侯，不識字煙波釣叟」二句所表達的心態與「紅顏棄軒冕，白首臥松雲」相近。
  lesson_raw:
    title: 沉醉東風 漁父詞
    basis: 題幹提及白樸 沉醉東風 漁父詞
