  page: 2
  stem: 學生對老師說：「天下不喜戴高帽如吾師者，能有幾人歟？」語氣最可能是下列何者？
  options:
  - label: A
    content: 憤怒
  - label: B
    content: 奉承
  - label: C
    content: 疑惑
  - label: D
    content: 驚喜
  group_stem: '其人曰：「某備有高帽一百，逢人則送其一，當不至有所齟齬也。」師怒曰：「吾輩直道事人，何須如此！」

    其人曰：「天下不喜戴高帽如吾師者，能有幾人歟？」師頷其首曰：「汝言亦不為無見。」其人出，語人

    曰：「吾高帽一百，今止存九十九矣。」'
- id: doc_113_高雄_五福_國文_g9s2e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 文中呈現安祿山極力阿諛諂媚以取得寵愛的各種言行舉止，不包含下列何者?
  options:
  - label: A
    content: 安祿山不拜皇太子，表明心中只有玄宗一人
  - label: B
    content: 主動請求貴妃太真收他為兒子，拜貴妃為娘
  - label: C
    content: 玄宗要求安祿山減重，因此祿山狂練旋轉舞
  - label: D
    content: 上奏表明自身平凡卻被寵愛，願用生命回報
  group_stem: '玄宗春秋漸高，托祿山心膂之任。祿山常因內宴承歡，奏云：「臣蕃戎賤臣，受主寵榮過甚，臣無異材

    為陛下用，願以此身為陛下死。」玄宗私甚憐之，因命皇太子見之。祿山見太子不拜，左右曰：「何為

    不拜？」祿山曰：「臣蕃人，不識朝儀，不知太子是何官？」玄宗曰：「是儲君。朕百歲之後，傳位於太

    子。」祿山曰：「臣愚，只知陛下，不知太子，臣今當萬死。」左右令拜，祿山乃拜。玄宗尤嘉其純誠。

    時貴妃太真寵冠六宮，祿山遂請為養兒。每對見，先拜太真，玄宗問之，奏曰：「蕃人先母後父耳。」

    玄宗大悅。祿山恩寵寖深，上前應對，雜以諧謔，而貴妃常在座。晚年益肥，腹垂過膝，自秤得三百五

    十斤。每朝見，玄宗戲之曰：「朕適見卿腹幾垂至地。」祿山每行，以肩膊左右抬挽其身，方能移步。

    玄宗每令作胡旋舞，其疾如風。'
