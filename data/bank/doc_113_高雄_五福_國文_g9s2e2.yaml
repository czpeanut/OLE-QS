  group_stem: "（一）因台灣的氣候以及成本考量，我們看到的櫻桃大部分都是進口的。櫻桃的產季在夏天，因產地、\n季節的關係，台灣一年中會有兩次吃櫻桃的機會，分別可以吃到來自北半球和南半球的櫻桃喔！\n\
    \n      夏季櫻桃：產季約在05 月～8 月，主要來自「北半球」的美國和加拿大。\n      冬季櫻桃：產季約在12 月～2 月，主要來自「南半球」的紐西蘭、智利和澳洲。\n\
    \n世界５大櫻桃品種\n| 品種 | 英文 | 產季 | 顏色 | 口感 | 風味 |\n| :--- | :--- | :--- | :--- | :---\
    \ | :--- |\n| ＃1 布魯克斯櫻桃 | Brooks | 四月中至六月中 | 紅至紅黑皆有 | 脆口 | 甜酸皆高 |\n| ＃2 賓櫻桃 |\
    \ Bing | 五至七月 | 暗紅色 | 扎實 | 香氣足 |\n| ＃3 蘭伯特櫻桃 | Lambert | 七月中旬至下旬 | 心形 | 濃郁 | 酸甜適中\
    \ |\n| ＃4 白櫻桃櫻桃 | Rainier | 六月下旬至七月上旬 | 粉黃漸層 | 細膩 | 甜度最高 |\n| ＃5 黑櫻桃 | Kordia\
    \ | 七月第二週 | 深紅色 | 飽滿 | 香氣足 |\n\n◎價格上由於北美的加州櫻桃、南美的智利櫻桃的產量較大、價格較為實惠，因此也是最受大眾歡迎\n\
    \  的產地。加拿大和紐西蘭櫻桃則較為高貴，有特殊的甜味及口感，因此價位上比較不親民。\n◎櫻桃大多數是紅色黑色，只要色澤越深就代表甜度越甜。\n  但白櫻桃則是相反，色澤越黃甜度才是最高的。\n\
    ◎要辨別櫻桃新不新鮮最簡單的方法是看蒂頭、梗，鮮綠色是新鮮度的保證。\n  也可以看色澤，若是表面光滑甚至會反光，就保證品質很好。\n  此外，櫻桃越脆越好吃，摘下來的時間久、日照長、碰水等原因讓果實變軟。\n\
