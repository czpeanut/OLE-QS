- id: doc_113_高雄_五福_國文_g9s2e2_s2_50
  section: 2
  number: 50
  type: single
  page: 7
  stem: 元雜劇《灰闌記》是一部劇本，本文呈現包拯斷案的過程，下列何者解讀正確？
  options:
  - label: A
    content: 街坊老娘作證是馬爺爺打死了婦人
  - label: B
    content: 包待制所設計的灰闌，考驗的是人性常情
  - label: C
    content: 張海棠和張千的關係是兄長和胞妹
  - label: D
    content: 馬員外之妻為圖財產而使力拽出親養的孩兒
  group_stem: '（三）

    包待制云這張林說是你的哥哥。是麼。張林云張海棠是小的妹子。

    包待制云兀那婦人。這孩兒是誰養的。搽旦云是小婦人養的。

    包待制云兀那街坊老娘。這孩兒是誰養的。眾云委實大娘子養的。

    包待制云張千。取石灰來。在階下畫個闌兒。着這孩兒在闌內。着他兩個婦人。拽這孩兒出灰闌外來。

    若是他親養的孩兒。便拽得出來。不是他親養的孩兒。便拽不出來。

    搽旦做拽倈兒出闌科，旦拽不出科

    包待制云兀那婦人。我看你兩次三番。不用一些氣力拽那孩兒。張千。選大棒子與我打着。

    正旦云望爺爺息雷霆之怒。罷虎狼之威。妾身自嫁馬員外。生下這孩兒。十月懷胎。三年乳哺。嚥苦吐

    甜。煨乾避濕。不知受了多少辛苦。方纔擡舉的他五歲。不爭為這孩兒。兩家硬奪。中間必有損傷。孩

    兒幼小。倘或扭折他肐膊。爺爺就打死婦人。也不敢用力拽他出這灰闌外來。只望爺爺可憐見咱。

    包待制云律意雖遠。人情可推。古人有言。視其所以。觀其所由。察其所安。人焉廋哉。人焉廋哉。你

    看這一個灰闌。倒也包藏着十分利害。那婦人本意要圖佔馬均卿的家私。所以要強奪這孩兒。豈知其中

    真假。早已不辯自明了也。

    李潛夫《灰闌記》'
