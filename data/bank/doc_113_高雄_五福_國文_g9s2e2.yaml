  group_stem: '有鄉人持鵝入市，寄店中他往。還，索鵝，店主賴之，云：「群鵝，我鵝也。」鄉人訟於郡。公令人取

    店中鵝，計四隻。各以一紙，給筆硯，分四處，令其供狀，人無不驚訝。已退食，使人問鵝供狀否？答

    曰：「未。」少頃出，下堂視之，曰：「狀已供矣。」因指一鵝曰：「此鄉人鵝。蓋鄉人鵝，食野草，糞

    色青；店鵝食穀粟，糞色黃。」店主伏罪。'
