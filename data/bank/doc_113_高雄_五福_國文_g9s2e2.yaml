  - label: D
    content: 將球擊出的難度勝過投球
  group_stem: "（四）\n    從小開始在打擊的部分一路受到明確的指導，我想也因此學會了自己找出正確答案的感覺。但是投\n球的部分幾乎沒有受到指導，是自己自學而來的，有強烈的想法但有沒辦法克服的笨拙。\n\
    \    投球上是無法蒙騙過去的，而且精準度要更高，然後還要保持一貫性。比起對戰打者，自己投球動\n作上的困難還是有的，隨著成長，手腳和身體長大長高，控制身體上變得很困難。\n\
    \    打者是要操控球棒，投手是要操控球。投球要控制的是較小的東西，但身體變得越大投球動作就會\n變得越難。打擊的話是相反，動身體揮擊是簡單的，但難度是顯現在要應對小東西(球)的技術上。靠最\n\
    後的反射速度去做奮力一擊，在這上面可以蒙騙過去的是打擊，在那最後一刻騙不過去的是投球。很微\n妙的不同，打擊和投球有這種感覺上的不同。\n（石田雄太 Number1094.1095\
    \ 雜誌  大谷翔平訪談2024  Showy Love 的沙龍網站）"
  shared_asset: g2_52_53
- id: doc_113_高雄_五福_國文_g9s2e2_s2_54
  section: 2
  number: 54
  type: single
  page: 8
  stem: 關於文中末段的比喻，何者解讀正確？
  options:
  - label: A
    content: 可以靠岸的碼頭→比喻回到老家
  - label: B
    content: 碎浪、暗流→比喻作者舊疾復發
  - label: C
    content: 船隻泊好、錨繩拴好→比喻工作完成
  - label: D
    content: 平靜無波→比喻內心安適
  group_stem: "（五）\n    庭長那天陪我說話直到天黑，窗外安平港的燈桿與起重機安靜發亮，標示出海的邊界與範圍。要離\n開前，他跟我說，還有什麼想說的、今天來不及說的，隨時可以再過來。不要自己一個人悶著。\n\
    \    「不要客氣，隨時再來。」這種話通常是客套，但看到庭長又是揮著手、又是篤定地望著我，我也\n就此把它當真了。在接下來的日子，每當焦慮的生理反應出現、回去宿舍躲起來的念頭無法遏止的時候，\n\
    我就會上樓敲開庭長辦公室的門。\n    「傾聽」如果存在一個比較級的詞彙，那應該就是「理解」；而如果比「理解」還更高級的話，我\n會說，是「保護」。被保護時，不論對方是誰，你會敢於放心地直視他的眼神。當我不再是頭低低地、\n\
    怯怯地坐在庭長面前以後，我發現窗邊座位的他，正好會把刺眼而西斜的太陽擋住。這種時候，視野便\n不會過曝，而只是單純的明亮。外頭天空的藍、海水的藍，都因此清晰可見。\n\
    \n    「這世界、這工作，有很多地方和你想像的是不一樣的。」\n    「我不會和你說『醒醒吧、不要這麼傻又這麼天真』這種話，但也不會真的想要看到你們任何一個\n\
    人踢到鐵板或嘗到苦頭。」\n    「當老師能做的，就只有看著你，然後讓你用自己的方式去認識這個世界。頂多在你危險的時候出\n現在你身邊、把你拉住這樣。」\n\
    \    「不要覺得占用我的時間很抱歉。我知道這些事對你來說很重要，可是對我來說也是。」\n    庭長看著我，堅定卻又親人的眼神，打從我第一次進到他辦公室時起，便始終如一。\n\
    \n    如果沒有那些話、沒有那些午後，不知道現在的我會是什麼樣子。\n    直到今天，我對安平的海都還是抱著一種特殊的情感，且那不是單純因為久住久待所能建立或複製\n\
    而來。像是找到了、擁有了一個可以靠岸的碼頭。岸邊還是有碎浪有暗流，可是船隻泊好、錨繩拴好之\n後，遠遠看去，也終將如同平靜無波。\n翁禎翊〈你在暗中守護我〉"
