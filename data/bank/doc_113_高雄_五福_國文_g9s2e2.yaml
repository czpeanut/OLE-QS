  group_stem: '陳述古嘗知建州 浦城縣。富民失物，捕得數人，莫知為盜者。述古乃紿之曰：「某廟有一鐘，能辨盜，

    至靈！」使人迎置後閣祠之，引群囚立鐘前，自陳：「不為盜者，摸之則無聲；為盜者，摸之則有聲。」

    述古自率同職，禱鐘甚肅。祭訖，以帷圍之，乃陰使人以墨塗鐘。良久，引囚逐一以手入帷摸之，出乃

    驗其手，皆有墨，一囚獨無墨，訊之，遂承為盜。蓋恐鐘有聲，不敢摸也。'
