  group_stem: '楊祭酒敬之愛才，公心嘗知江表之士項斯。

    贈詩曰：「處處見詩詩總好，及觀標格過於詩。平生不解藏人善，到處逢人說項斯。」'
- id: doc_113_高雄_五福_國文_g9s2e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 常州官員張貼元宵節花燈遊賞公告時，為什麼要寫「本州依例放火三日」？
  options:
  - label: A
    content: 擔心觸犯現任州官的禁忌
  - label: B
    content: 暗示活動將會點亮整個城市
  - label: C
    content: 配合元宵節的猜燈謎活動
  - label: D
    content: 提醒民眾注意安全小心用火
  group_stem: '田登作郡，自諱其名，觸者必怒，吏卒多被榜笞。於是舉州皆謂燈為火。上元放燈，許人入州治游觀。

    吏人遂書榜揭於市曰：「本州依例放火三日。」故語云：「只許州官放火，不許百姓點燈。」本此。'
- id: doc_113_高雄_五福_國文_g9s2e2_s1_15
  section: 1
  number: 15
