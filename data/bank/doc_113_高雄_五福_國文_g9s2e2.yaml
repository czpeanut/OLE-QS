  - label: C
    content: 應該要避諱和父親名字相近的活動
  - label: D
    content: 兒子素行不良，應端正品行後再報名
  group_stem: "（二）愈與李賀書，勸賀舉進士。賀舉進士有名，與賀爭名者毀之，曰賀父名晉肅，賀不舉進士爲是，\n勸之舉者爲非。聽者不察也，和而唱之，同然一辭。\n\
    \    父名晉肅，子不得舉進士，若父名仁，子不得爲人乎？曾參之父名晳，曾子不諱昔。周之時有騏期，\n漢之時有杜度，此其子宜如何諱？\n    凡事父母，得如曾參，可以無譏矣；作人得如周公、孔子，亦可以止矣。今世之士，不務行曾參、\n\
    周公、孔子之行，而諱親之名，則務勝於曾參、周公、孔子，亦見其惑也。\n  韓愈〈諱辯〉"
