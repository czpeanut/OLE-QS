  stem: "爺爺七十歲生日即將到來，小明想寫張賀卡表達心意，以下是卡片中的文字：\n\n親愛的爺爺：\n 近來好嗎？很想念 您。雖然您\n即將邁入古稀之年，但精神奕奕、老當\n\
