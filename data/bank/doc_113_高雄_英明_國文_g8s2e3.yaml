- id: doc_113_高雄_英明_國文_g8s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 「達悟人對飛魚的觀察十分細膩，會根據其到來時間、數量多寡、體型大小等性質決定捕食方法。如白鰭飛魚最早到、最喜光；紅斑緒飛魚鰭上有黃褐色斑點，孕婦不可以吃，否則會生出易長痱子的嬰兒，但其體型小，適合小孩吃；黑鰭飛魚數量不多，最珍貴，夜間要用火把捕捉，不可以用火烤，否則會使肌膚生瘡；紫斑鰭飛魚，白天用蝦、蟹肉餌釣，數量最多，是族人的最愛。」關於上文，下列何者說明正確？
  options:
  - label: A
    content: 飛魚是達悟族人的主食，無論男女老少捕到就吃，沒有任何限制與禁忌
  - label: B
    content: 飛魚是達悟族人的最愛，最適合用火烤來吃
  - label: C
    content: 達悟族和飛魚的關係密不可分
  - label: D
    content: 達悟族人捕捉飛魚，僅限於夜間誘捕。
  tags:
