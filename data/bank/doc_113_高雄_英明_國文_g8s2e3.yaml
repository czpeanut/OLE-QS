- id: doc_113_高雄_英明_國文_g8s2e3_s1_31
  section: 1
  number: 31
  type: single
  page: 5
  stem: "唐德宗 貞元七年九月，東平郡人淳于棼（ㄈㄣˊ）與友人在自家門前的大槐樹下飲酒，他因為喝了太多而醉得不醒人事。被兩個朋友送回家後，恍惚中作了一個夢。在夢中他被大槐安國國王招為駙馬，當了南柯郡太守，廣受人民愛戴，不但享盡了榮華富貴，顯赫一時，子女也都有很好的發展和歸宿。後來公主因病過世，於是淳于棼罷去南柯郡太守的職位回到國都。過了一段時間，國王察覺他心中悶悶不樂，於是要他回家鄉探望親人。淳于棼回到家後，發現自己竟仍舊睡在東廂房。送他回來的兩個紫衣使者於是大聲呼喚他的名字，他才從夢中清醒過來。醒來後，看到家裡的僕人拿著掃帚在打掃庭院，之前送他回來的兩個朋友正在洗腳，太陽還沒有下山，喝剩的酒也還放在東窗下，一切都沒有改變。沒想到才作一會兒夢，卻好像經歷了一輩子，於是他將剛才的夢境告訴了兩個朋友，並且回到大槐樹下。他們發現樹下有個蟻穴，挖開一看，穴中布置竟如同夢裡所見的大槐安國一般。自此他從這個夢，領悟到榮華富貴的虛浮，和人世的變化無常。\n\
    \ 下列何者的感悟與此最近似？"
  options:
  - label: A
    content: 與其追求功名利祿，不如快意隱居山野
  - label: B
    content: 少年得志大不幸，千金難買少年窮
  - label: C
    content: 沒有理想的人生，如同迷航的船隻
  - label: D
    content: 繁華總有落盡時，悲歡往事轉眼亦成空。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 國文
      code: 自學課一
      title: 軼事瑣聞大觀園──唐宋筆記選
      chapter: null
    textbook: 八下 自學課一 軼事瑣聞大觀園──唐宋筆記選
    labeled_by: ai
