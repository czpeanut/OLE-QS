  stem: 「卻說魯肅私自撥輕快船二十隻，各船三十餘人，並布幔束草等物，盡皆齊備，候孔明調用。第一日卻不見孔明動靜；第二日亦只不動。」此段文字主要在描寫孔明的何種態度？
  options:
  - label: A
    content: 從容沉著
  - label: B
    content: 機智過人
  - label: C
    content: 精明能幹
  - label: D
    content: 器度不凡。
  group_stem: "用奇謀孔明借箭（節錄） 羅貫中\n 肅領命來見孔明。孔明曰：「吾曾告子敬，休對公瑾說，他必要害我。不想子敬不肯為我隱諱①，今日果然又弄出事來。三日內如何造得十萬箭？子敬只得救我！」肅曰：「公自取其禍，我如何救得你？」孔明曰：「望子敬借我二十隻船，每船要軍士三十人，船上皆用青布為幔，各束草千餘個，分布兩邊。吾別有妙用。第三日包管有十萬枝箭。只不可又教公瑾得知；若彼知之，吾計敗矣。」肅允諾，卻不解其意，回報周瑜，果然不提起借船之事；只言：「孔明並不用箭竹、翎毛、膠漆等物，自有道理。」瑜大疑曰：「且看他三日後如何回覆我！」\n\
    \ 卻說魯肅私自撥輕快船二十隻，各船三十餘人，並布幔束草等物，盡皆齊備，候孔明調用。第一日卻不見孔明動靜；第二日亦只不動。至第三日四更時分，孔明密請魯肅到船中。肅問曰：「公召我來何意？」孔明曰：「特請子敬同往取箭。」肅曰：「何處去取？」孔明曰：「子敬休問，前去便見。」遂命將二十隻船，用長索相連，逕望②北岸進發。是夜大霧漫天，長江之中，霧氣更甚，對面不相見。孔明促舟前進，果然是好大霧！\n\
    \ 當夜五更時候，船已近曹操水寨。孔明教把船隻頭西尾東，一帶擺開，就船上擂鼓吶喊。魯肅驚曰：「倘曹兵齊出，如之奈何？」孔明笑曰：「吾料曹操於重霧中必不敢出。吾等只顧酌酒取樂，待霧散便回。」\n\
    \ 卻說曹操寨中，聽得擂鼓吶喊，毛玠、于禁二人慌忙飛報曹操。操傳令曰：「重霧迷江，彼軍忽至，必有埋伏，切不可輕動。可撥水軍弓弩手亂射之。」又差人往旱寨內喚張遼、徐晃各帶弓弩軍三千，火速到江邊助射。比及號令到來，毛玠、于禁怕南軍搶入水寨，已差弓弩手在寨前放箭；少頃，旱寨內弓弩手亦到，約一萬餘人，盡皆向江中放箭：箭如雨發。孔明教把船調回，頭東尾西，逼近水寨受箭，一面擂鼓吶喊。待至日高霧散，孔明令收船急回。二十隻船兩邊束草上，排滿箭枝。孔明令各船上軍士齊聲叫曰：「謝丞相箭！」比及③曹軍寨內報知曹操時，這裡船輕水急，已放回二十餘里，追之不及。曹操懊悔不已。\n\
    \ 卻說孔明回船謂魯肅曰：「每船上箭約五六千矣。不費江東半分之力，已得十萬餘箭。明日即將來④射曹軍，卻不甚便？」肅曰：「先生真神人也！何以知今日如此大霧？」孔明曰：「為將而不通天文，不識地利，不知奇門⑤，不曉陰陽⑥，不看陣圖，不明兵勢，是庸才也。亮於三日前已算定今日有大霧，因此敢任三日之限。公瑾教我十日完辦，工匠料物，都不應手，將這一件風流罪過⑦，明白要殺我。我命繫於天，公瑾焉能害我哉！」魯肅拜服。\n\
    \ 船到岸時，周瑜已差五百軍在江邊等候搬箭。孔明教於船上取之，可得十餘萬枝。都搬入中軍帳交納。魯肅入見周瑜，備說孔明取箭之事。瑜大驚，慨然歎曰：「孔明神機妙算，吾不如也！」後人有詩讚曰：「一天濃霧滿長江，遠近難分水渺茫，驟雨飛蝗來戰艦，孔明今日伏周郎。」\n\
    \n註：①隱諱：隱瞞。 ②逕望：直向。 ③比及：等到。比，音ㄅㄧˋ。 ④將來：拿來。\n ⑤奇門：「奇門遁甲」的簡稱，古代一種迷信的術數，可以預知吉凶禍福。\n\
    \ ⑥陰陽：此處指「星相」、「占卜」等預知吉凶的術數。\n ⑦風流罪過：無端加上不相干的罪名，有意羅織出來的過失。"
