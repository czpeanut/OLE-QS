- id: doc_113_高雄_英明_國文_g8s2e3_s1_14
  section: 1
  number: 14
  type: single
  page: 3
  stem: 「鮪魚喜歡較溫暖的海水，常利用洋流洄游。鮪魚的食物來源包括小魚、糠蝦、小型魷魚及小型甲殼類等海中動物。牠們性喜群居，經常成群結隊穿梭於各海域。紡錘體的流線身形，讓鮪魚成為游泳高手，泳速可達時速70
    公里以上。以黑鮪魚為例，牠的瞬間泳速甚至高達時速160 公里。」根據這段文字，下列關於鮪魚的敘述何者正確？
  options:
  - label: A
    content: 以壯碩體型來嚇阻敵人，不以泳速取勝
  - label: B
    content: 生活海域廣闊，在南、北極常見到牠們
  - label: C
    content: 食物來源多樣，以較小的海中動物為主
  - label: D
    content: 喜歡獨自悠游於海洋中，利用洋流洄游。
  tags:
