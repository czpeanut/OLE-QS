- id: doc_113_高雄_英明_國文_g8s2e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 「那條鯨於太陽沉落在海峽彼端時進入近海海域，不久之後就迷航了。夜色十分平靜，是真正的熱帶景觀，空中瀰漫著澄澈的霧，在月亮四周形成一大圈柔和而完整的光暈，大海只因海水升漲而微有動蕩。牠繼續曲折前進，眼前是一片閃爍的海波，不久月亮隱去了，天海之間是神祕而可怖的黑暗。終於海風大起，吹散了雲霧，長列的浪頭一個接一個咆哮著向牠翻滾而來，噴濺著泡沫的浪脊一次次地把牠裹捲進去，向著島腳推移。潮水越漲越高，淹沒了沙礁，大洋神祕的語音有時像大炮轟鳴，有時像森林呼嘯，激攪得海濤怒立，擊向岸邊的石磯，水花舐著岩壁，昏黑而紛亂的海面上，牠的龐然大軀在忽上忽下、忽左忽右地與大夜和狂濤搏鬥，不知道自己一步步躓向死亡的門楣。」（節錄自鄭寶娟
    黑鯨記）關於上文的敘述，下列何者「有誤」？
  options:
  - label: A
    content: 由寧靜的氛圍漸入動心駭目的描摹
  - label: B
    content: 由太陽沉落寫到朝陽升起
  - label: C
    content: 文中大量運用轉化修辭
  - label: D
    content: 海濤怒立、轟鳴呼嘯象徵「黑鯨」生存環境愈加險惡。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 國文
      code: 第十課
      title: 科幻極短篇選(一)深藍的憂鬱(二)替代死刑
      chapter: null
    textbook: 八下 第十課 科幻極短篇選(一)深藍的憂鬱(二)替代死刑
