- id: doc_113_高雄_英明_國文_g8s2e3_s2_41
  section: 2
  number: 41
  type: single
  page: 8
  stem: 根據文意，第二段缺空處應填入下列何者最恰當？
  options:
  - label: A
    content: 智謀
  - label: B
    content: 果決
  - label: C
    content: 謹慎
  - label: D
    content: 武略。
  group_stem: '小時候讀三國演義，對諸葛亮崇拜得五體投地。但隨著不斷地管理不同規模的企業，自己做了十年ＣＥＯ、並成為企業的創始人之後，愈來愈感受到諸葛亮不是一個好的ＣＥＯ，反應在以下三點。

    第一在選人用人方面。三國留下一句老話：「蜀中無大將，廖化作先鋒。」「蜀中無大將」是發生在諸葛亮擔任ＣＥＯ之後。在劉備擔任ＣＥＯ時，旗下五虎上將，謀士如雲，考慮最多的是如何吸引優秀的人才。而諸葛亮對團隊發展，卻不重視人才。他親自選的接班人姜維，採用了選馬而不是賽馬的機制來挑選，這樣的機制造成了姜維接班後沒多少年，蜀國就像一個破落的公司一樣，被別的企業併購而消亡了。

    第二在風險控制方面。三國中多次提到，諸葛亮旗下的大將魏延對北伐提出不同戰略。他多次和諸葛亮說：「給我三千精兵，出奇兵就能直取長安。」但諸葛亮認為風險太大，寧可帶著三十萬大軍步步為營，還留下一句名言：「諸葛一生唯□□。」做為公司ＣＥＯ，控制風險當然是重要的，但如果失去發展機遇，才是公司最大的風險。諸葛亮沒有同意用類似風險投資的方法去嘗試新戰略，錯失了彎道超車的機會。

    第三在分級授權方面。諸葛亮最後累倒，病逝於五丈原。原因正如他的對手司馬懿所指出的：諸葛亮幾十萬大軍中，處罰二十軍棍以上的決定，都要親自批准，這反應了諸葛亮沒有很好的授權機制。一個好的ＣＥＯ必須制定很好的授權機制，才能聚焦做大事。而諸葛亮事無巨細，凡事都親自過問，不僅把自己累死了，也把蜀國斷送了。

    （衛哲 諸葛亮為什麼不是一個好的ＣＥＯ？）'
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 國文
