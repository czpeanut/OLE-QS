- id: doc_113_高雄_英明_國文_g8s2e3_s1_16
  section: 1
  number: 16
  type: single
  page: 3
  stem: "天一樣長的霞火燒著橘色\n是遠方有人在喊你\n在遠方喊你的回聲嗎？\n晚飯的時候了，討海人\n荒涼而顛簸的水路，何處\n才是你順風的回程？\n一條小漁船的胸脯\n\
    要承受滿海滾滾的浪頭\n向黑潮的深處去索討\n一網又一網的生鮮活跳\n——若是網重而魚多\n滿艙的豐收該慶賀，為你\n若是網輕呢，唉，也該慶幸\n又逃過了一劫，為魚\n\
    （余光中討海人）\n 關於本詩的說明，下列何者錯誤？"
  options:
  - label: A
    content: 詩中傳達出討海人捕魚的艱辛以及孤獨
  - label: B
    content: 詩人對於討海人能逃過一劫也感到慶幸
  - label: C
    content: 漁民滿載而歸，是詩人為其慶賀的原因
  - label: D
    content: 由詩中可看出作者具有悲天憫人的胸懷。
