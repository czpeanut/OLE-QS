  type: single
  page: 3
  stem: 上文中，MeToo 風潮，凸顯下列何者長期受到歧視的問題?
  options:
  - label: A
    content: 宗教
  - label: B
    content: 國籍
  - label: C
    content: 種族
  - label: D
    content: 性別。
  group_stem: "(三)西元2006 年由美國社運人士塔拉納伯克（Tarana Burke）開始使用「MeToo」（我也是），向那些受性侵害、性騷擾的女性們表達同理，並站出來替她們發聲。西元2017\
    \ 年，好萊塢的明星製片哈維韋恩斯坦（Harvey Weinstein）一連串的性醜聞被揭發，好萊塢女星艾莉莎米蘭諾（Alyssa Milano）因此在推特發起「#MeToo」標籤運動，鼓勵有類似經驗的人們勇敢站出來。短短一天，就有20\
    \ 萬人於社群平台上使用「#MeToo」響應，而該運動也迅速從美國蔓延至全世界，各國的受害者們紛紛挺身而出，要求終結此類性騷或性侵行為。西元2023 年，臺灣版\
    \ MeToo 運動從政壇延燒到包括學術與藝文各界，越來越多人開始在社群媒體上說出相關經歷，並引發了大量討論，並有相關法律的修正。\n     #Me too\
    \ 運動背後也掀起「教育」的問題，從家庭、學校到社會教育，我們需要從小告訴孩子，「你的身體就是你的權利，沒有人可來侵犯你；當遇到侵犯者就必須大聲說：『我不要』。」我們要「主動宣示身體的自主性」。沒有人有權力觸碰我的身體，觸碰前必須取得同意，讓身體主體性拉回自己身上。請問:"
