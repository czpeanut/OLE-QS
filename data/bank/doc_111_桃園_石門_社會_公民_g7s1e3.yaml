  group_stem: 1996 年亞特蘭大奧運開幕主題曲傳揚的歌聲來自臺東阿美族郭英男夫婦吟唱的〈老人飲酒歌〉。德國某一樂團在未經授權之下，竟截取郭英男夫婦的部分原聲使用在自己的作品中，而後被選為奧運開幕主題曲，郭英男先生得知後，進行跨國訴訟，除了要求對方給予原唱者的尊重，最主要的用意是希望讓大家知道，這段美麗的音樂來自臺灣阿美族，這首歌曲因此廣為人知，也被阿美族人稱為「奧運歌」。原住民族傳唱許多這類美麗歌謠，由於原住民族大多沒有文字，此類的傳唱歌謠便成為記錄部落生活百態的工具。
