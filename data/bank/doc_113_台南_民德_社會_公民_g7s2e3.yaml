  section: 1
  number: 7
  type: single
  page: 1
  stem: 社會保險、社會津貼與社會救助各自發揮不同的功能，使社會福利制度更完整。關於三者的比較，何者正確？
  options:
  - label: A
    content: 社會救助、社會津貼都是為維持基本生存權，社會保險是為社會共助
  - label: B
    content: 社會保險的對象為特定者，另外兩者則以全民為主
  - label: C
    content: 社會保險需繳保費才能享有給付，另外兩者以稅收為財源
  - label: D
    content: 社會津貼不需資產調查，另外兩者則需要資產調查。
