  page: 1
  stem: 下課時，幾位同學討論社會福利的內涵與發展歷程，根據以下的對話內容，何者的說法完全正確？
  options:
  - label: A
    content: 小民：「近代社會福利是指政府負責整合社會資源，以保障全民應有的生活權益」
  - label: B
    content: 小德：「檢視社會福利的發展歷程可以發現，政府是最早提供相關資源的機構」
  - label: C
    content: 小國：「工業革命期間，社會福利著重透過政府具體作為提升全民的生活福祉」
  - label: D
    content: 小中：「現行的社會福利注重弱勢群體的權益保障，實施對象不包括一般民眾」。
