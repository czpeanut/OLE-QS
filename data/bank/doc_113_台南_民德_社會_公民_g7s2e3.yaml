  stem: 在美國所謂的邊緣戶家庭，又稱作「愛麗絲家庭」（英文縮寫 A.L.I.C.E.，意指家庭資產不多、收入有限、雖有工作但處於貧窮狀態 Asset Limited,
    Income Constrained, Employed）。根據聯合勸募基金會的觀察，「愛麗絲家庭」在美國的現實情況是，因為年平均收入沒有在貧窮線之下，卻因不符所有州政府社會局處補助資格，所有社福體系的資源都無法取得，而政府將資源大量集中在中低收入戶家庭，造成一種弔詭的社會現象：與「愛麗絲家庭」相比，某些中低收入戶在三餐與物質條件上過得其實更好。根據上述，我們可以將「愛麗絲家庭」其歸類為哪一種社會不公平因素所造成的？
