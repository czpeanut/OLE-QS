- id: doc_113_新北_五峰_英語_g8s1e3_s3_35
  section: 3
  number: 35
  type: single
  page: 3
  stem: Which of the following would be the best title for this reading? ※title 標題
  options:
  - label: A
    content: Why Switzerland Isn’t Cheap
  - label: B
    content: Pricy Places Around the World
  - label: C
    content: How to Live in Expensive Cities
  - label: D
    content: Cars in pricy cities
  group_stem: 'Life in a big, rich city can be expensive. Groceries, entertainment,
    clothes, and eating out can cost a lot, and even water and power aren’t cheap.
    In some places, you pay a lot for a house. If you drive a car, the gas and parking
    could cost a lot of money, too!

    Every year, over a hundred and fifty cities in the world are compared to see which
    ones are the most expensive. In 2023, two cities, one in Asia and one in Europe,
    share the first place. They were Switzerland’s Zurich, and the “City of Lions”,
    Singapore City.

    Another pricy Asian big city, Hong Kong, came in at number five. As for North
    America, three US cities, New York, LA, and San Francisco, were also very high
    up on the list. Can you guess other top ten cities?


    ※groceries 食品雜貨 ※entertainment 娛樂

    ※be compared 被比較 ※most 最 ※pricy 價格高的

    ※power 電力'
