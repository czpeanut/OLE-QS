- id: doc_113_高雄_五甲_英語_g9s1e2_s2_16
  section: 2
  number: 16
  type: single
  page: 5
  stem: 16. What can we infer (推論) from the reading?
  options:
  - label: A
    content: It's better not to use words to communicate with people.
  - label: B
    content: Babies can't talk, so they can't communicate.
  - label: C
    content: Most people communicate only by using pictures.
  - label: D
    content: Sometimes pictures can say more than words.
  group_stem: '(五)

    We speak and write with words. But have you thought that we can communicate without
    them? As babies, we can understand and be understood through both sounds and body
    language. We cry when we are hungry, or smile when we hear our mother''s voice.
    When we grow up, we still use body language to express ourselves. We shake our
    head to say "No," and nod to mean "Yes."

    We also often use pictures to communicate. For example, traffic signs tell us
    what to do while we are driving. And some pictures we use in e-mail and text messages
    can tell others how we are feeling. That''s why people say that sometimes a picture
    can say more than words!


    📖 communicate 溝通 understood 被了解 express 表達 text message 簡訊'
