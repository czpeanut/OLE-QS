    生活中的許多小型可攜式電子產品，例如：手機、數位相機、錄影機、平板電腦……等，帶給我們使用上的實用性與方便性。然而，電子產品若要充電時，各式充電器便散布在電源的插座或擴充式插座上，電線雜亂且配對麻煩。如果只要一個充電器，把這些電子產品放到充電器上就能開始充電，將能解決這惱人的問題，所以無線充電器就在大家力圖擺脫電線糾纏的煩惱中應運而生，不僅能簡化使用條件，更能避免產生過多的電子垃圾。

    無線充電器的工作原理，即是利用法拉第定律的電磁感應，當電流通過線圈便會產生新的磁場；因新的磁場變化量便會產生感應電流，有了感應電流便可以充電。無線充電器通過初級和次級線圈而感應產生電流，從而將能量從發射端轉移到接收端，就是這樣能擺脫一般電線的束縛了。

    無線充電技術不斷提升應用後，未來我們將只需要一個充電器，就能給所有的設備進行充電。在我們生活、居住、工作的每個地方，可以很便利地進行無線充電，甚至可以在機場、火車站、捷運站、百貨公司、量販店、超商……等場所來設置無線充電站，
    我們就不必再隨身攜帶任何電線，即可隨時隨地為自己的電子產品進行充電。

    文章出處:《科學少年》2014 年12.1 月號'
