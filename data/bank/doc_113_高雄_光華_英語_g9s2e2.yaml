  page: 4
  stem: What helps bees live in heavy rain?
  options:
  - label: A
    content: Their ability to fly fast.
  - label: B
    content: Their hairy bodies that avoid water.
  - label: C
    content: Their ability to hit the ground.
  - label: D
    content: Their ability to work together.
  group_stem: 'Skills of Bees in Heavy Rain

    Sometimes when heavy rain falls, it can feel uncomfortable for us. But have you
    ever noticed how bees deal with raindrops? A 2012 study shows that when raindrops
    hit a bee, it’s like being hit by a heavy object. Surprisingly, bees are hit by
    raindrops about once every 30 seconds. So why don’t we see many dead bees after
    it rains heavily? A bee is about the size of a raindrop, but it is really light—only
    weighing about 0.1 gram. This lightness helps bees continue to live. Because they
    are so light, when a raindrop hits a bee, the force isn’t strong enough to harm
    it seriously. The study also found that when a bee is hit by a raindrop, it gets
    pushed and falls with the drop. However, bees have hairy bodies that avoid water,
    so they don’t get wet easily. After falling for a short distance, around 4 centimeters,
    they can shake off the raindrop and fly away. But this isn’t always safe. If a
    bee happens to be flying very low when hit by a raindrop, it might not have enough
    time to recover and fly away. In such cases, the bee could hit the ground and
    face danger.'
