  stem: According to Bar Chart A, which is right?
  options:
  - label: A
    content: The higher the temperature is, the more birds migrate.
  - label: B
    content: Over 95% birds will migrate when the summer temperature is high.
  - label: C
    content: Birds need to migrate in winter, and so do all animals.
  - label: D
    content: Annual range of temperature has an effect on the bird migration.
  group_stem: 'Some animals have special ways to live in winter when there is no food.
    They either sleep for a long time or move to another place. Hibernation is the
    state in which animals sleep all winter. Migration is when animals move to a new
    place. Animals hibernate or migrate because they can’t find food in the cold months.

    Hibernation can be different for each animal. Some animals sleep so deeply that
    they can’t be woken up, while others wake up sometimes to eat. Bears, for example,
    sleep lightly and take long rests in winter. Before hibernation, animals eat extra
    food and store it as body fat. This fat helps them get energy during their sleep.
    When animals hibernate, their body temperatures get lower, their hearts beat more
    slowly, and they use less energy. If it gets warmer in winter, they might wake
    up too early and use up their energy without food.


    【Bar Chart A】

    Some animals migrate instead of hibernating. Many birds fly far away to escape
    the cold. Some birds fly from the south to the north, while others go from east
    to west. Some animals move to find a good place to raise their babies. During
    the day, birds use the sun to help them find their way, and at night, they use
    the stars. However, storms, bad weather, pollution, tall buildings, and getting
    tired can make migration harder for birds.

    In conclusion, animals hibernate or migrate to live in winter. Even though they
    do different things, they have the same goal: to find food and stay alive in the
    cold months.

    📖 Annual range of temperature 年溫差

    temperature 溫度 bar chart 長條圖 heart rate 心率'
