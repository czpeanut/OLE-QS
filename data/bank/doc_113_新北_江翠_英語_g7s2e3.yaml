- id: doc_113_新北_江翠_英語_g7s2e3_s5_30
  section: 5
  number: 30
  type: single
  page: 3
  stem: What is the main idea of the article?
  options:
  - label: A
    content: What farms do to help the forest.
  - label: B
    content: How people can protect the rainforest.
  - label: C
    content: Why animals don't like meat.
  - label: D
    content: How to plant a rainforest.
  group_stem: 'Rainforests are very important to our world. They help keep our climate
    safe, but they are in danger. When we hurt the rainforests, it''s like hurting
    our home. Many animals and plants live in the rainforests, and we need to protect
    them.

    One big problem is that people cut down trees in the rainforests. This is called
    deforestation, and it makes it hard for animals to live there. Sometimes, people
    burn the trees to make farms. But we can help by eating less meat and choosing
    foods that don''t hurt the rainforests.

    We can also help by buying things that are made in a good way. Some companies
    cut down trees, but others are careful. We can ask our parents to buy things from
    companies that protect the rainforests. Also, we can ask the people in charge
    to help the rainforests.

    It''s important to remember that even small actions can make a big difference.
    By choosing to protect the rainforests, we help save the animals, the trees, and
    our planet. We can all do our part to keep the rainforests safe and healthy.

     climate 氣候 safe 安全 in danger 處於危險中 protect 保護 burn 燃燒 less 比較少的

    in charge 負責 remember 記得'
