- id: doc_113_新北_江翠_英語_g7s2e3_s5_33
  section: 5
  number: 33
  type: single
  page: 4
  stem: How do Indian people greet each other?
  options:
  - label: A
    content: They shake hands and say “Hello”.
  - label: B
    content: They wave and say “Goodbye”.
  - label: C
    content: They put their hands together and say "Namaste".
  - label: D
    content: They bow and say “ Thank you”.
  group_stem: 'India has a very old and special culture. It is made up of many different
    things like languages, religions, and food. India is a big country with many people.
    The culture is different in different places.

    One important part of Indian culture is religion. Many people in India are Hindu.
    Hinduism teaches about doing good things and being kind. Some people in India
    are also Muslim, Sikh, or Christian. They all live together in the same country.

    Families are very important in India. Sometimes, big families all live together
    in one house. They share everything and help each other. In India, they respect
    their guests and treat them like they are very special. They say "Atithi Devo
    Bhava," which means a guest is like God.

    Indian people have special ways of greeting each other. They often put their hands
    together and say "Namaste". This is a way of saying hello and showing respect.
    India also has yummy food. Each place has its own special dishes. Indian culture
    is full of fun and interesting things.

     culture 文化；language 語言；religion 宗教；country 國家；guest 客人；respect 尊重；greet 打招呼；

    interesting 有趣的'
