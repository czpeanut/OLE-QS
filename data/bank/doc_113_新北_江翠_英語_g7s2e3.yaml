  group_stem: 'Long time ago, there (26) two good friends in a small village. They
    both liked going hiking in their free time with each other, (27) in the forest
    together. One day, when they were walking in the forest, a bear appeared in front
    of them.

    These two men were scared and didn’t know what to do. At that time, one of the
    men climbed up and (28) in the tree right away. But his good friend just stood
    under the tree because he couldn’t climb a tree. Luckily, he thought that “People
    say that a bear doesn’t touch a dead body.”, so he lay down and played dead by
    holding his breath.

    The bear came to the man and sniffed him all over his body. After that, it left
    him and went away. Later, the man climbed down from the tree and asked his good
    friend, “What did the bear whisper in your ear just now?”

    “ (29) ,” his good friend answered.

