  group_stem: '題組(二)：34～37題

    2023 年底新北市發生校園割頸案，15 歲的郭生為替「乾妹」林生出氣，持彈簧刀朝隔壁班的楊生連刺 10 刀，造成楊生送醫不治死亡，引發社會譁然。

    之後，許多網友紛紛替楊生喊冤，郭生與林生遭到肉搜，逐一被社群平台曝光。衛福部表示，若是傳播未成年者的姓名、照片等資料，依(甲)法規定要負(乙)法律責任，可開罰新臺幣
    3 萬元以上 15 萬元以下罰鍰；而網友肉搜的記事、照片等資料及相關行為已違反(丙)法。由於犯案的郭生已年滿 14 歲，且犯下最輕本刑五年以上的重罪，所以經(丁)調查後裁定以(戊)案件移送偵辦。

    去年 9/30 一審判決結果出爐，判處行凶的郭生 9 年有期徒刑、教唆的林生 8 年有期徒刑，可上訴。被害者楊生的父親針對判決結果發表書面聲明指出(己)法太過於寬容，殺人者竟然只被判處
    9 年有期徒刑、8 年有期徒刑，比起貪汙罪還輕，難道司法認為人命不值錢？他表示一定會上訴。'
