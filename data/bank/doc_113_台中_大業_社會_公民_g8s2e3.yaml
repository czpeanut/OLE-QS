    臺中市一名國小六年級生今年 3 月與體育老師發生衝突，學生持樂樂球棒打老師腳部，事發後老師為給學生一個警惕而報警處理，學生於警方到場後才肯向老師道歉，老師隨即向警方表明目的已達成，不想對學生提告傷害。不過警方認定已受理少年犯罪報案，因此依《甲法》處理程序，將老師與學生帶往警察局，並通知家長到場陪同製作筆錄。

    事件曝光後引發各方議論，有律師指出依《乙法》規定，處理少年相關事務時，應保障其權益、增進其福利，以少年最佳利益為優先考量；此外，該名國小生出現傷害的行為，後續應依據相關法律處理，而警方帶走學生在程序上也未符合法律的要求。對此，警方也承認執法程序不夠周延，有所疏失，並對負責處理的員警申誡懲處。'
