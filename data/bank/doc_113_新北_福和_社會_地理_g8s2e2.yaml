- id: doc_113_新北_福和_社會_地理_g8s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 坎井是西亞與北非傳統維生方式中重要的水利設施，生活用水及農業灌溉都必須依賴它。圖四與圖五為敘利亞的地形圖及坎井分布圖，兩圖上線條為河流。請從圖中資訊判斷，下列敘述何者正確？
  options:
  - label: A
    content: 坎井水源以地下水為主
  - label: B
    content: 坎井的出現與河川相關
  - label: C
    content: 坎井數與植被量成正比
  - label: D
