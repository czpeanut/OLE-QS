- id: doc_113_新北_福和_社會_地理_g8s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 聯合國從1990 年開始發布「人類發展指數」，其數值根據出生時的平均壽命、受教育年限、人均國民總所得三項指標計算，用以衡量各國社會經濟發展程度。圖一為西亞北非地區2021
    年之人類發展指數圖，圖上顏色愈深代表此指數愈高。下列對於甲區的敘述何者正確？
  options:
  - label: A
    content: 長期受歐美國家控制與剝削，使經濟發展程度較低
  - label: B
    content: 石油資源改變原有經濟活動，成為資本雄厚的國家
  - label: C
    content: 庫德族獨立聲浪再起，但受到周邊各國的聯合抵制
  - label: D
    content: 透過商業貿易、國內外戰爭，成為西亞信仰中心。
