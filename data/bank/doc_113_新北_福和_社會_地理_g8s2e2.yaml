  section: 1
  number: 10
  type: single
  page: 1
  stem: 全球石油產區遍布各地，產量與品質有所不同，在進入自由競爭時代後，產量與品質達到一定水準的產區，常成為制定價格的參考指標，目前全球油價的參考指標主要有三個：第一為已經活躍數十年、品質較佳的WTI，產區主要在美國；其次是歐洲北海的布蘭特原油(Brent
    Crude)；此外就是杜拜原油(Dubai Crude)。請問台灣向哪個產區購買石油時，其最短路徑須經過蘇伊士運河？
