- id: doc_113_新北_福和_社會_地理_g8s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 星月符號是清真寺頂端常見的建築裝飾，也是部分穆斯林國家國旗上的主要符號。在伊斯蘭傳統中，強調星星與月亮是指引人類方向的重要象徵。對太陽、月亮、星星的迷信與崇拜是世界上很多民族曾經有過的現象，但在西亞北非地區，對月亮的重視就更明顯，例如：伊斯蘭曆以新月初升作為每月第一天的開始。請問下列哪項條件與西亞北非地區萬里無雲、適合觀察星月有關？
  options:
  - label: A
    content: 氣候宜人，四季分明
  - label: B
    content: 農業為主，仰賴自然
  - label: C
    content: 水源匱乏，偶有衝突
  - label: D
    content: 高壓壟罩，氣流沉降。
