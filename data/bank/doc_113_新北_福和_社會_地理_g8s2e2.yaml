- id: doc_113_新北_福和_社會_地理_g8s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 每年的6 月20 日為世界難民日，藉此喚起全球支持難民的行動。逃難和移民之路是充滿危險的，往往伴隨著飢餓、病痛、不可預知的暴力。很多逃亡者甚至付出了生命，國際移民組織（IOM）統計2014
    年到2022 年間有5 萬人在逃難途中死亡或失蹤，這些死亡與失蹤案例，一半以上發生在地中海。請問由西亞出發的難民船其船頭多朝向哪個方位？
