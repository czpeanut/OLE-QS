  group_stem: '自1948 年起，以色列與巴勒斯坦的緊張關係持續至今，2023 年已是第6 次爆出大規模軍事衝突。

    巴勒斯坦激進組織哈瑪斯（Hamas）對以色列發動突襲，規模為50 年來最大的一次，也讓加薩地區陷入戰火，已經造成多人傷亡，並且以色列包含平民和士兵，有許多人遭到哈瑪斯劫持。哈瑪斯成立之初，主張以武力消滅以色列和巴勒斯坦的猶太復國主義者，並且反對與之談判或和平共處，更一度以「讓以色列消失」為目標，其附屬武裝「卡桑旅」（Al-Qassam
    Brigades）經常以火箭炮、迫擊炮及小型武器襲擊以色列地區，也曾發起多次自殺式襲擊。

    哈瑪斯和傾向談判手段的「巴勒斯坦解放組織」因為立場不同也常有衝突，2007 年哈瑪斯在一系列衝突中獲勝，取得加薩走廊的控制權。自哈瑪斯接管加薩走廊後，以色列就開始對該地區實行嚴格物資封鎖，長達16
    年的物資限制策略導致當地近一半人口失業，也有許多巴勒斯坦人被迫離開，因此更加深了巴勒斯坦人對以色列的仇恨。

    由於經常對以色列進行武裝襲擊，也曾製造多起自殺性爆炸事件或是綁架、暗殺以色列居民，因此哈瑪斯被以色列和許多西方國家視為恐怖組織，不過也有人考量到歷史淵源和脈絡，再加上以色列過去對加蕯地區的壓迫，而持保留態度。'
