  stem: '有關植物「向地性」與「觸發運動」的比較，請問下表中的敘述何者正確？


    | | 向地性 | 觸發運動 |

    | :--- | :--- | :--- |

    | (A)刺激來源 | 地球引力 | 光線 |

    | (B)反應速率 | 較慢 | 較快 |

    | (C)觀察到的現象 | 莖朝地面生長 | 小葉閉合、葉柄下垂 |

    | (D)能否恢復原狀 | 能 | 不能 |'
  options:
  - label: A
    content: 刺激來源：向地性為地球引力，觸發運動為光線
  - label: B
    content: 反應速率：向地性較慢，觸發運動較快
  - label: C
    content: 觀察到的現象：向地性為莖朝地面生長，觸發運動為小葉閉合、葉柄下垂
  - label: D
    content: 能否恢復原狀：向地性能，觸發運動不能
