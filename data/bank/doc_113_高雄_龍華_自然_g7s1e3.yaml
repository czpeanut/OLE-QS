  section: 1
  number: 20
  type: single
  page: 3
  stem: 請問文中的「Ｘ器官」最有可能指的是何者？
  options:
  - label: A
    content: 腦幹
  - label: B
    content: 膀胱
  - label: C
    content: 腎臟
  - label: D
    content: 輸尿管
  group_stem: 飲酒後，血液中的酒精會抑制抗利尿激素的作用，讓「Ｘ器官」產生大量尿液，喝下一杯酒，身體卻能排出三到四杯的尿液，這是為什麼飲酒後容易感到口渴，如果不注意補充水分，若身體其他器官偷搶大腦的水分來用，就會進而產生頭痛的症狀。此外，酒精對中樞神經系統也會有一定的破壞，急性酒精中毒初期症狀包括：異常興奮、雙頰發紅、心跳加速、步態不穩、容易跌倒、情緒搖擺不定、說話含糊不清、自我克制能力喪失等。隨著血液中酒精濃度升高，會出現中樞神經系統抑制的症狀，如神經反射降低、呼吸抑制、血壓下降而導致昏迷，甚至死亡。而慢性酒精中毒則是長期飲酒而加速中樞神經系統退化，如酒精性失智症即為因長期飲酒造成認知功能受損，長期下來會發現抽象思考能力會變差。雖說十二、十三歲的你們尚未到達能夠飲酒的年紀，也請未來的你能夠記得提醒自己【飲酒過量，有害健康】。
