    content: 解方程式 $\frac{2x}{3}+1=-\frac{x}{2}+5$，可利用等量乘法公理將方程式化成 $4x+1=-3x+5$
  - label: D
    content: 方程式 $57-x\div 6=3$ 的解法為$x=(-3-57)\times 6$
