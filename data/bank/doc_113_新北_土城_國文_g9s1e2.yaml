  group_stem: "【甲】\n    田子方見老馬於道，喟然，有志焉。以問其御曰：「此何馬也？」其御曰：「此故公家畜也。老疲而不為用，出而鬻之。」田子方曰：「少而貪其力，老而棄其身，仁者弗為也。」束帛以贖之。罷武聞之，知所以歸心矣。\n\
    \                                     ――《淮南子》\n【乙】\n    宋陳諫議家有劣馬，性暴，不可馭，蹄齧傷人多矣。一日，諫議入廄，不見是馬，因詰僕：「彼馬何以不見?」僕言為陳堯咨售之賈人矣。堯咨者，陳諫議之子也。諫議遽召子，曰：「汝為貴臣，家中左右尚不能制，賈人安能蓄之？是移禍於人也!」急命人追賈人取馬，而償其值。戒僕養之終老。時人稱陳諫議有古仁之風。\n\
    \                                 ――〈陳諫議教子〉"
