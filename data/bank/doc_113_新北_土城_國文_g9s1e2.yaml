  group_stem: "成都自上元至四月十八日，遊賞幾無虛辰。使宅後圃名西園，春時縱人行樂。\n  初開園日，酒坊兩戶各求優人①之善者，較藝於府會，以骰子置於合子中撼之，視數多者得先，謂之「撼雷」。自旦至暮，唯雜戲一色②。坐於閱武場，環庭皆府官宅看棚。棚外始作高凳，庶民男左女右，立於其上如山。每諢③一笑，須筵中鬨堂，眾庶皆噱④者，始以青紅小旗各插於墊上為記，至晚較旗多者為勝。若上下不同笑者，不以為數也。\n\
