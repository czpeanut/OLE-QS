  section: 6
  number: 1
  type: single
  page: 2
  stem: What’s the main idea of the reading?
  options:
  - label: A
    content: The scientists found that sleeping time is the key for heart health.
  - label: B
    content: We can’t sleep well because of our body clock.
  - label: C
    content: Eating less sugar and doing exercise often are important.
  - label: D
    content: Many people try to go to bed earlier to get fewer heart problems.
  group_stem: "Everyone knows that going to bed early is good for our body. A study\
    \ shows that the healthiest time to go to bed is between 10 p.m. and 11 p.m. It\
    \ could be the key for our heart health.\n     The study started about six years\
    \ ago. The scientists chose 88,000 healthy volunteers. To know their habit of\
    \ sleeping time, all of the volunteers had to wear a special watch seven days\
    \ a week. During six years, the scientists kept checking the volunteers’ health.\
    \ At the sixth year, the scientists found that 3,172 of them had a heart problem.\
    \ In fact, there was a surprising fact: Most of them went to bed earlier than\
    \ 10 p.m. or later than 11 p.m. As for the volunteers who fell asleep from 10\
    \ p.m. to 10:59 p.m., they had the fewest heart problems.\n     What did the scientists\
    \ think about the findings of the study? Some of the scientists said that our\
    \ body clock is important for heart health. If we go to bed too early or too late,\
    \ our body clock will not work as well. We might not fall asleep easily or have\
    \ a good night’s sleep. The others of the scientists said that besides sleep,\
    \ some other things, like eating less sugar or doing exercise often, are also\
    \ important. Sleeping time, eating or exercise habits all matter for heart health.\n\
    \        scientist 科學家；volunteer 志願者；habit 習慣；  \n             surprising 驚人的"
