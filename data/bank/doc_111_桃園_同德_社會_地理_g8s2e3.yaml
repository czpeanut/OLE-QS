  group_stem: "◎閱讀文章回答問題 \n  《亞果出任務》是班艾佛列克自導自演的著名好萊塢電影，改編自發生於某國的人質危機事件。並入圍八項2013 年奧斯卡金像獎，並獲得最佳影片、最佳原著改編、最佳剪輯的獎項。\
    \ \n  此次人質危機的背景，是出於當時美國一直是該國國王巴列維的主要支持者，甚至幫助他發動政變推翻了後來選上的首相。前後共有八位美國總統為巴列維國王提供大量軍事和經濟援助，以換取此國的石油供應。但巴列維早先曾許諾自由及改革卻食言，也和其親信中飽私囊，奢侈地按西方的生活方式生活，令保守人士十分憤怒，在國內便爆發了革命推翻了巴列維政權。\
    \ \n  爾後新的領導人稱美國為「伊斯蘭的敵人」，此一反美言論極富號召力，許多人在美國大使館周圍進行抗議活動，甚至在一次騷動中占領了大使館，大部份使館人員被扣留。其中六名館員成功脫逃並在一幢公寓躲藏起來，並在加拿大和瑞典大使館獲得庇護，最後得以順利離開。《亞果出任務》即以此事件改編出一部節奏緊湊的政治驚悚片，獲得不錯的票房和迴響。"
