- id: doc_111_桃園_平南_社會_g8s1e2_s1_50
  section: 1
  number: 50
  type: single
  page: 4
  stem: '我國若要採行下述方式來降低二氧化碳排放量，須經中央政府某院同意後方可執行。下列何者也是該院的職權？〔101.基測〕

    畜牧大國紐西蘭於 2004 年起，向農民徵收牛、羊、鹿的「放屁稅」，希望能藉此處理溫室氣體排放的問題。我國為降低二氧化碳的排放量，也思考過是否制定相關稅法來課徵綠色稅，但許多業者擔心競爭力會因此下降，引發反彈聲浪。業者的擔心雖不無道理，但政府仍應思考課徵綠色稅的可行性，讓使用者反省能源的使用方式，提高能源的使用效率，進而達成節能減碳的目的。綠色稅是否課徵，各有其利弊得失，如何選出最佳方案，考驗著執政當局的智慧。'
