  group_stem: "【B】\n    Comic cons are big events where people who are interested\
    \ in comic books, movies, TV shows, and pop culture can come together to celebrate.\
    \ It’s like a big party for fans. These events are held in many cities around\
    \ the world, and they’re filled with exciting activities. The number of people\
    \ joining comic cons has grown. The largest events, like San Diego Comic-Con,\
    \ New York Comic Con, and Comiket, have all seen more people joining.\n    A new\
    \ study shows some Americans    45    in comic cons. In the same study, 39% of\
    \ men and 25% of women show interest. Age plays a big part, too. Younger adults,\
    \ aged 18-34, are the most interested. The picture on the right shows how the\
    \ age groups of visitors have changed. From this picture, there are more and more\
    \ visitors    46     joining comic cons from 2021 to 2024.\n        47    It’s\
    \ not only about comic books. Movies and TV shows are at the top of the list.\
    \ Toys, anime, and customs or handmade items also attract people to join comic\
    \ cons.    48   , people have the chance to meet actors, writers, and creators\
    \ from their favorite movies, TV shows, and comics. For many, it’s a dream come\
    \ true to shake hands with the people who bring their favorite characters to life.\
    \ Whether it's an actor from a superhero movie or a writer of a comic book, these\
    \ moments make the experience unforgettable.\n attract 吸引   creator 創作者"
