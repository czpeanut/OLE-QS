- id: doc_113_新北_永和_英語_g9s1e3_s4_54
  section: 4
  number: 54
  type: single
  page: 5
  stem: 54  What should sports managers focus on when employing coaches?
  options:
  - label: A
    content: Players’ interests.
  - label: B
    content: The team’s history.
  - label: C
    content: The coach’s pay.
  - label: D
    content: Skills and experience.
  group_stem: "【C】\n Why Aren’t More Women Coaching Sports Teams?\nWhen you think\
    \ of a coach for a winning sports team, do you see a man or a woman? Most people\
    \ probably imagine a man, but why? Men are not always better teachers or leaders.\
    \ In fact, women can be amazing leaders in politics, business, and many other\
    \ areas. So why are there so few women leading sports teams?\nIn the U.S., 60%\
    \ of women’s college sports teams are coached by men, but only 3% of men’s teams\
    \ are coached by women. This is very unfair. People still believe men are better\
    \ at coaching, even though this is not true.\nA Great Example: Pat Summitt\nIf\
    \ you think women can’t coach as well as men, let’s talk about Pat Summitt. She\
    \ was an amazing basketball player who won a silver medal at the Olympics. Later,\
    \ she became one of the best college basketball coaches in U.S. history. Her team\
    \ won over 1,000 games—more than any other college coach, male or female, at the\
    \ time.\nA Bigger Problem\nThis problem isn’t just about sports. Women are treated\
    \ unfairly in many parts of life. For example, women often earn less money than\
    \ men for the same work. They also get fewer chances to be leaders in business,\
    \ politics, and other areas. When women are kept out of coaching jobs, it sends\
    \ a message that women don’t belong in leadership roles. This doesn’t just hurt\
    \ women—it also affects young girls who look up to them. If girls don’t see women\
    \ as coaches, they might think they can’t do it, either.\nWhat Needs to Be Changed?\n\
    Sports managers need to take a good look at their biases. They should choose coaches\
    \ because of their skills and experience, not just because they’re men. This kind\
    \ of change can also inspire the next generation. When girls see women as strong\
    \ coaches and leaders, they’ll believe they can do amazing things, too. Leaving\
    \ women out of coaching isn’t just unfair—it’s bad for teams, players, and even\
    \ society. It’s time to take away the biases and make sports as a fair place for\
    \ everyone.\n generation 世代     fair 公平的"
