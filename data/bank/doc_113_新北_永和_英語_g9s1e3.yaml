  group_stem: '【B】

    Banksy is a famous street artist from the UK, but no one knows who he really is.
    He’s known for creating powerful art in public places, like on streets, walls,
    and buildings. But he keeps himself as a secret, which makes people even more
    interested in his works.

    Banksy’s works often talks about problems in the world, like war and politics.
    His art can be funny, but it always makes people care more about the problem.
    One of his most famous pieces is “Girl with a Balloon,” which shows a young girl
    tried to reach for a red balloon flying away. The balloon is often seen as hope
    or freedom. In 2018, this artwork was sold for over a million dollars, but right
    after, it was cut up into pieces in front of people by itself. This shocked everyone
    and made people think about how art is sold and treated.

    Also, Banksy fights for freedom and justice. Because of the death of Floyd, who
    was held down by a white police officer and then died, Banksy was on the side
    of the Black Lives Matter Movement and posted on Instagram, “At first, I thought
    I should just listen to black people about this. But why would I do that? It’s
    not their problem. It’s mine…” Below the post is a painting of a candle burning
    a flag. As we can see, the artist always cares about the world through his works.

    Even though people have tried to find out who Banksy really is, that has not stopped
    him from becoming one of the most famous artists. Whether it’s a person or a group,
    Banksy will keep creating art that inspires deep thoughts.

     balloon 氣球   justice 正義   flag 旗幟    inspire 啟發'
