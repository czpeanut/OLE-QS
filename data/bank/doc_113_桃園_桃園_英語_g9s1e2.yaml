  group_stem: 'Mark Twain is a famous American writer. He wrote the classic novels
    about Tom Sawyer and Huckleberry Finn. He also gave speeches around the world,
    and many of his funny jokes and wise sayings are still popular today.

    Twain also liked to tell humorous stories, and he wasn’t afraid to boast about
    his achievements. One time he was on a train from Maine to New York. Twain just
    spent three weeks in Maine hunting and fishing. Though the official fishing season
    ended in Maine, Twain still decided to fish there anyway, and he enjoyed great
    success.

    To boast about how many fish he caught, Twain went to the train’s lounge car to
    find someone to listen to his fishing stories. He sat down next to a man and happily
    told a stranger about all of the fish he caught in Maine. The man, however, was
    not impressed with Twain’s boasting. In fact, the more the man listened to Twain,
    the angrier he became.

    Twain did not give up. He kept talking about his fishing in Maine, but the man
    didn’t smile or praise him.

    Finally, Twain couldn’t stand it any longer. “By the way,” he said, “who are you,
    sir?” “I am the game warden of Maine,” said the man. “And fishing season ended
    three weeks ago! Who are you?” Twain stopped for a second, but then he began to
    smile, “Well, to be honest, warden, I’m the biggest liar in the whole United States.”


