  group_stem: "Once there lived a poor man who never went to school, and most people\
    \ thought that he was stupid. But this man knew a magic trick that let him feed\
    \ himself. If he stood under a mango tree and spoke out magic words, the tree\
    \ would grow fruit right away. The man could eat mangoes until he was full, and\
    \ he would give the rest away.\n    One day, a young man, Keshav, saw what the\
    \ man did and begged to learn the trick. The man agreed to teach him but warned,\
    \ “If I teach you, you must never be greedy, and you must always tell the truth.\
    \ The magic will stop working if you tell a lie.”\n    Keshav learned the magic\
    \ and went home. He did the trick several times every day, and he made a fortune\
    \ by selling mangoes in the market. When the king learned of this, he summoned\
    \ Keshav and had him explain where he learned the magic.\n    Keshav was proud\
    \ and didn’t want to tell the king that he learned something from a man who was\
    \ thought to be stupid by everyone. So he lied and said he learned it from a wise\
    \ magician in a forest.\n    The king wanted to see the trick and ordered Keshav\
    \ to show the magic for him. Everyone watched as Keshav stood under the king’s\
    \ mango tree. He said the magic words, but nothing happened, just as the man warned—Keshav\
    \ told a lie. Seeing he had no choice, Keshav told the king the truth. The king\
    \ was angry at him and killed him for being so proud and for lying. The magic\
    \ never worked again because Keshav used it for his own greed.\n\n beg 乞求 warn\
    \ 警告 greedy 貪心的 fortune 財富 explain 解釋 summon 召見 magician 魔術師 repay 回報 moral 寓意"
