  group_stem: 'Have you ever heard a debate in class? David’s class has a debate on
    different topics every month. Here is what some of his classmates said in the
    debate on November 5th .


    Team One

    Sally : Newspapers open the world for us. By reading the newspapers every day,
    we can get more useful knowledge, which is good for our mind.

    Molly : Reading the newspapers helps me become a better writer. The more I read,
    the better I write because I can get good story ideas from the newspapers.

    Tommy : I like reading the comics in the newspapers especially after a long tiring
    day from school. I always feel relaxed and happy after doing that.


    Team Two

    Eva : Not everything in the newspaper is true. What’s worse, some are misleading.
    For example, last week one newspaper said Bingo Department Store would close down
    on October 31st . However, it isn’t true at all. So, the newspapers are not as
    good as many people think.

    Sandy : I don’t think the newspapers are interesting enough for us junior high
    school students. In fact, reading the newspaper brings no fun to me. With the
    Internet, there are a lot of smart ways to get information. As for me, I like
    watching the news on my cellphone better.

