- id: doc_113_高雄_翠屏_國文_g7s2e1_s5_28
  section: 5
  number: 28
  type: single
  page: 4
  stem: 為什麼文章中的民宿女主人不喜歡蒼鷺？
  options:
  - label: A
    content: 牠的排泄物會汙染環境
  - label: B
    content: 牠時常攻擊客人
  - label: C
    content: 牠常偷吃民宿養的錦鯉
  - label: D
    content: 牠的叫聲難聽刺耳
  group_stem: "當大鳥來敲門（節錄） 劉克襄 \n  暮春某日，下榻一綠建築概念落成的新民宿。大清早醒來，特別外出觀看。才推開下榻的大門，一隻如鶴的大鳥，從旁邊的草岸展翅飛離。從身影羽色，我研判是隻蒼鷺。蒼鷺是臺灣最大的鷺鷥科，殊少出現這等環境。若非水塘寬廣足夠，想要吸引這種大鳥落腳，還真不容易。\
    \ \n  牠飛到對面的水岸棲息，露出高聳的脖子。我慢慢沿湖邊散步，接近那兒時，牠再起飛，降落適才下榻的民宿屋頂，一如巨大的風信雞佇立，繼續注意我的動靜。根據自己長時的觀鳥經驗，這隻蒼鷺應該是此一水塘的常客。我不禁觀看水塘周遭，有一二排泄的糞便，水塘裡則是無數色彩絢爛、大小不一的錦鯉四處游晃。當我再靠近岸邊，還有一群游靠過來，彷彿在等餵食。難怪蒼鷺會一早來此岸邊，對牠而言，這裡簡直是最棒的buffet\
    \ 了。 \n  走進餐廳用餐時，我特別選擇靠臨窗口的位置，只見遠山雲霧縹緲，近看多棵宜梧盈盈煥發。那隻蒼鷺又飛降岸邊，在草地散步了。女主人過來打招呼時，我特別指著蒼鷺，興奮地告知，水塘有一貴客。怎知她一看，面露哀苦之情。原來，女主人並不喜歡牠。……女主人繼續抱怨，有時還會有第二隻出現，日後可能會愈來愈多。我安慰她，水塘不大，若以蒼鷺的習慣，雖然多了一隻，應該是意外。一般說來，這種民宿環境，應該就是這麼單隻生活。這兒是牠的地盤，不可能隨便讓其它蒼鷺接近。更何況，蒼鷺是候鳥像遊客，只在秋天到來，春末便回到北方繁殖下一代。\
    \ \n  我覺得此一民宿和蒼鷺的互動，是樁有趣的生活故事，可以溫暖地突顯，人和鳥類如何化敵為友，共存共榮的最佳案例。其它地方想求此佳話，還未必有這等福氣。女主人離去後，我繼續獨自在餐廳喝咖啡，難以想像偏鄉之區，竟有此綺麗。我正陷入美好情境時，只見一高大灰色身影，拎著紅色彩帶，掠過岸邊花朵盛開的菖蒲叢。我再定睛細瞧，原來是那隻蒼鷺又出現，嘴裡咬著近二十分公的紅色錦鯉。彷彿釣翁捕得碩大的溪魚，滿足地要離去。當下，我不禁莞爾，了然女主人的生氣，但也因這畫面更覺得生態之美好。如果我還會再來，還不一定是為了這間隱藏版的典雅民宿，而是懷念這隻蒼鷺呢！"
  tags:
