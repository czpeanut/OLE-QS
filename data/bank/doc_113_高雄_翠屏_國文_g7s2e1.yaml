- id: doc_113_高雄_翠屏_國文_g7s2e1_s5_30
  section: 5
  number: 30
  type: single
  page: 4
  stem: 下列何者無法用以形容「那一餐吃得美味豐盛，將面前的芒果布丁一掃而空的時候，我認為世界上不會有更幸福的境界了」的心情？
  options:
  - label: A
    content: 舔嘴咂舌
  - label: B
    content: 大快朵頤
  - label: C
    content: 酒足飯飽
  - label: D
    content: 味如雞肋
  group_stem: "初夏荔枝祭  張曼娟 \n  我吃過神奇的糯米荔枝，是在好幾年前去香港，父親的朋友請我們吃飯，那一餐吃得美味豐盛，將面前的芒果布丁一掃而空的時候，我認為世界上不會有更幸福的境界了。作東的主人卻又端來一盆玻璃盅，裡面裝滿荔枝，用冰塊冰鎮著。大家都說吃飽了，再吃不下了。「這是糯米荔枝啊，臺灣吃不到的。」主人說。我從冰塊的潮溼冷凍中取了一顆荔枝，它的表皮凹凸特別顯著，握在指間甚至有些刺痛。剝出雪白的果肉，送進齒間一咬，汁水淋漓中，我有一種欲望的錯愕感。知道它是甜的，卻沒想到是這樣沒有雜質的純粹；知道它是柔軟的，卻沒有想到是這樣的滑膩與細緻。微微地，想要落淚的情緒湧起來，到達飽滿的程度，那是在遇到出乎意料的美味時，常有的生理反應。\
    \ \n  記得那時也是夏天，餐廳窗外高架橋上，大小車輛呼嘯而過，我問了一句：「這就是楊貴妃吃的荔枝嗎？」沒有人能夠回答。後來每年夏季過港，總要買一些糯米荔枝，卻總是上了當，又或者是真正的糯米荔枝，裝在圓筒形的玻璃罐子裡，買到的時候果皮已經風乾了，果肉變韌了，顏色像是儲存過久的白色絲綢，泛了黃。"
