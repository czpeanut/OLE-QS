  stem: 右圖為馬桶儲水槽的「部分裝置」示意圖，AOB 為槓桿裝置，A 點（轉鈕）為施力點，B 點為抗力點，其中活塞因受到水的壓力而將出水口堵住。當壓下轉鈕時堵住出水口的活塞被拉起，使得槽內的水沖入馬桶中。下列有關轉鈕設計的敘述，何者正確？
  options:
  - label: A
    content: 此槓桿為省力的機械裝置
  - label: B
    content: 在相同的位置及角度壓下轉鈕拉起活塞，滿水位時會比低水位時費力
  - label: C
    content: 當壓下轉鈕拉起活塞時，槓桿的順時針力矩大於它的逆時針力矩
  - label: D
    content: 當壓下轉鈕拉起活塞時，槓桿的施力臂等於它的抗力臂
