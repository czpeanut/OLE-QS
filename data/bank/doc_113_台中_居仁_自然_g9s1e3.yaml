  section: 1
  number: 1
  type: single
  page: 1
  stem: 生活中有許多物品都是簡單機械的應用，幫助我們能更方便的完成事情，下列關於各種物品應用的原理描述何者正確？
  options:
  - label: A
    content: 斜面搬運的距離較長，無法省力
  - label: B
    content: 釘書機是槓桿的應用，可以省力
  - label: C
    content: 喇叭鎖是螺旋的應用，可以省力
  - label: D
    content: 寶特瓶蓋是輪軸的應用，可以省力
