  section: 2
  number: 8
  type: single
  page: 2
  stem: 將一顆裝在絕緣支架的不帶電金屬球，以感應起電方式使金屬球帶正電，如右圖。若接著再以手輕觸金屬球使其接地，金屬球的帶電情形及其原因最可能為下列何者？
  options:
  - label: A
    content: 帶負電，因地球的電子經由手流向金屬球，使金屬球內負電荷總數多於正電荷
