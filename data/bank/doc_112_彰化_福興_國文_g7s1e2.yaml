- id: doc_112_彰化_福興_國文_g7s1e2_s4_26
  section: 4
  number: 26
  type: single
  page: 4
  stem: 作者認為「朽木可雕」的原因最接近下列何者？
  options:
  - label: A
    content: 船到橋頭自然直
  - label: B
    content: 天生我才必有用
  - label: C
    content: 一人不敵眾人智
  - label: D
    content: 情人眼裡出西施。
  group_stem: '在保守者的眼中，朽木是低能的符號，是無用的象徵，是放棄的對象，不值得付出心力雕琢，也不可能出現逆轉奇蹟。於是，「朽木不可雕也」成為雕琢者冠冕堂皇的藉口，成為「朽木」們自暴自棄的理由。

    羅丹說：「生活中不缺少美，缺少的是發現美的眼睛。」朽木亦此。較良木而言，它更像一塊試金石，考量雕琢者乍現的靈感和回春的技巧。

    朽木可雕，從理論上說，朽木也是一種材質，只要化腐生肌，就能煥發新的活力；即便無藥可救，只要停止腐朽的進程，便只是一段記憶的縮影。

    朽木可雕，從實踐上看，百草治百病，百人有百用，朽木有朽木的特質與不群。

    新木生葉，朽木生芝。相信它有用，置於有用之地，讓它做有用之事，才是關鍵。沒有信心，縱是金玉良材，也與廢柴無異。

    朽木不是廢木。朽木可雕，金貴的是眼光，重要的是技巧，關鍵的是信心。（馬宇彤 朽木可雕）'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
