- id: doc_113_台南_民德_英語_g9s1e3_s2_27
  section: 2
  number: 27
  type: single
  page: 4
  stem: What is the main idea of the passage?
  options:
  - label: A
    content: The difference in diets between Asian and African elephants.
  - label: B
    content: How elephants use their trunks and make wrinkles.
  - label: C
    content: The ways of how elephants talk with each other.
  - label: D
    content: Why elephants are left- or right-handed.
  group_stem: "Did you know that elephants, like humans, can be left- or right-handed?\
    \ For elephants, we call this being left- or right-trunked. Scientists discovered\
    \ this by studying the wrinkles on their trunks. An elephant’s trunk is an amazing\
    \ tool. It is used for many purposes, such as picking up food, drinking water,\
    \ and even sending messages to other elephants. The muscles and wrinkles on the\
    \ trunk play an important role in helping it move well and freely.\n Elephants\
    \ often bend their trunks to one side when putting food into their mouths. Over\
    \ time, the side they use more becomes more wrinkled than the other. This is how\
    \ scientists can tell if an elephant is left- or right-trunked.\n Interestingly,\
    \ Asian elephants and African elephants have differences in their trunks. Asian\
    \ elephants appear to have more wrinkles on the top of their trunks than African\
    \ elephants. This is because of the way they use their trunks. African elephants\
    \ have two finger-like body part at the end of their trunks, which help them pick\
    \ things up easily. On the other hand, Asian elephants only have one. To pick\
    \ things up, they wrap their trunks around things more often, and it leads to\
    \ more wrinkles on the top of their trunks.\n These differences show how elephants\
    \ adapt to their environments and needs. Whether left- or right-trunked, elephants\
    \ cannot live without their trunks and it shows just how special these animals\
    \ are.\n trunk 象鼻 wrinkle 皺紋 muscle 肌肉 bend 彎曲 wrap 包裹住 adapt to 適應"
  ai_answers:
    gemini: B
    qwen: B
  answer:
  - B
  answer_status: ai_generated
  answer_source: ai:gemini+qwen
