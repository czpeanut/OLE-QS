  group_stem: '請將以下 A、B、C、D 四個選項填入30~33 空格中(不可重複)


    A. that showed all the good restaurants in different cities

    B. why it''s a great honor to be on the list

    C. if the restaurants should get a Michelin star

    D. that French people live to eat


    Food is a big part of French culture. It is said (30) , and the rest of the world
    eats to live. That''s why the most famous food guide in the world, the Michelin
    Guide, is from France.

    Michelin is a tire company the Michelin brothers started in 1889. At that time,
    not many people owned a car in France. To sell more tires, the Michelin brothers
    thought of an idea. Because French people loved food so much, the brothers decided
    to write a book (31) . And that''s how the Michelin Guide was born. This way,
    people would drive more to try the food, and Michelin could sell more tires.

    To decide whether a restaurant is good or not, the Michelin Guide has a team of
    inspectors. They''re always anonymous, so when they go to restaurants to taste
    the food, they won''t be treated differently. For each dining experience, the
    inspectors will write a report on their experiences and decide (32) . If a restaurant
    is excellent, the guide may give it one to three stars, and it''ll be added to
    the guide. However, getting even one star is not easy. That''s (33) . In 2022,
    thirty-eight restaurants got the Michelin honor in Taiwan. Would you like to try
    them?

     rest 其餘 guide 指南 tire 輪胎 inspector 巡視員 anonymous 匿名的 honor 榮譽'
