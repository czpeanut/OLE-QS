- id: doc_113_新北_板橋_英語_g9s2e2_s4_45
  section: 4
  number: 45
  type: single
  page: 5
  stem: Why couldn’t the writer sleep well last night?
  options:
  - label: A
    content: The writer couldn’t stop thinking about having a fun day at Disneyland.
  - label: B
    content: The hotel room was so noisy that it kept waking the writer up.
  - label: C
    content: The writer was too excited about going to Disneyland to stop thinking
      about all the fun things to do.
  - label: D
    content: The writer was sick and couldn’t fall asleep because of a cold.
  group_stem: "I.  Today, I am going to Tokyo Disneyland with my family and my best\
    \ friend, Amy. Last night, I packed my bag. I put my clothes, a hat, a camera,\
    \ and some snacks inside. I was so happy that I couldn’t sleep well!\n  Early\
    \ this morning, we went to the airport. We arrived two hours before our flight.\
    \ After checking in, we waited at the gate, turned off our cellphones and then\
    \ took the airplane to Japan. The flight took about three hours. When we landed,\
    \ we took a bus to our hotel and left our bags there.\n   Now, we are on our way\
    \ to Disneyland! When we arrive, the first thing we will do is to take pictures\
    \ in front of the beautiful castle. Amy wants to ride the fastest roller coaster,\
    \ but I feel a little scared. Maybe I will try it! After that, we will explore\
    \ the park and go on different rides, like the flying elephants and the pirate\
    \ ship. We will also try some special Disney snacks, like Mickey-shaped pancakes\
    \ and colorful drinks. In the afternoon, we will watch the Disney parade, and\
    \ if we are lucky, we might take a picture with Mickey Mouse. At night, we will\
    \ enjoy the amazing fireworks, and the sky will be full of bright colors. Before\
    \ leaving, we can buy not only some cute toys but also keychains to remember this\
    \ special day. I am sure today will be the best day ever!\n\n\U0001F4D6 roller\
    \ coaster 雲霄飛車 explore 探索 pirate 海盜 parade 遊行"
