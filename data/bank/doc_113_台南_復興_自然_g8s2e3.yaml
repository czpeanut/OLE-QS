- id: doc_113_台南_復興_自然_g8s2e3_s1_44
  section: 1
  number: 44
  type: single
  page: 5
  stem: 依據本文描述，請問潛水員在海面下進行深潛活動時。以在海面下15m的深度活動為例，若此時未攜帶裝備潛水員的體積為$V_{人}$、質量為$M_{人}$、密度為$D_{人}$，而潛水員在穿著攜帶所有裝備後的總體積為$V_{潛}$、而所穿著攜帶的裝備總質量為$M_{裝}$，海水的密度為$D_{海}$。若忽略活動時因呼吸所排出體外之氣體，則哪一關係式的情況下，可讓潛水員在此時的海面下15m的深度，維持以「中性浮力」活動？
  options:
  - label: A
    content: $V_{人} \times D_{海} = M_{人}$
  - label: B
    content: $(V_{人} + V_{潛}) \times D_{海} = M_{人}$
  - label: C
    content: $V_{潛} \times D_{海} = M_{人} + M_{裝}$
  - label: D
    content: $V_{人} \times D_{人} + V_{潛} \times D_{海} = M_{人} + M_{裝}$。
  group_stem: '【閱讀題組44~45題】

    水肺潛水是一項由潛水員攜帶氣瓶(內含壓縮空氣的鋼瓶)，在海面下所進行的活動。潛水員會穿上一種可充氣或放氣的背心，藉由氣瓶對背心的充放氣來改變背心的體積大小，調整潛水員在海中的浮力大小。若在背心內多充入一些空氣，潛水員可在不施力划水的情形下，自然向海面浮起。若從背心中多放出一些空氣，潛水員可在不施力划水的情形下，自然向海底下沉。若背心的充氣量調整適當，潛水員可在不施力划水的情形下，於海面下維持同樣的深度。此種調整背心的充氣量，而能夠在海面下維持同樣深度的技術，稱為「中性浮力」。水肺潛水需要找同伴一起進行活動，可以互相照顧，每次潛水前也都要有適當的規劃，潛水後也要做紀錄。底下圖表為一位潛水員的潛水時間與潛水深度的紀錄，就可根據紀錄了解潛水過程的狀況。而台灣也有許多水肺潛水愛好者，所發起的公益活動，主要聚焦於海洋保育、海底垃圾清除及珊瑚復育等領域。甚至近年來積極參與海岸及海洋塑膠垃圾清除活動，不僅提升了公眾對海洋環境保護的意識，也鼓勵更多人參與潛水相關的公益行動，共同守護台灣的海洋生態。'
  shared_asset: g1_44_45
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_台南_復興_自然_g8s2e3_s1_45
  section: 1
