  stem: 若不考慮海水的流動，依據本文中的潛水紀錄，有關此潛水員在開始潛水後，回到海面上休息的過程中，下列何者正確？
  options:
  - label: A
    content: 在0～15分鐘過程中，該員一直下潛，所受海水壓力逐漸增加
  - label: B
    content: 在第20分鐘時，所處位置的海水壓力最大
  - label: C
    content: 在25～30分鐘過程中，該員可透過從背心中多放出一些空氣，讓自己可以不費力進行水中活動
  - label: D
    content: 在30～40分鐘過程中，屬於「中性浮力」活動。
