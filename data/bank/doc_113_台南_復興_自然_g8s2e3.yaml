  stem: 在2022卡達世足賽，所多參賽國家的球衣，是由台灣廠商藉由回收海洋塑膠廢棄物，所製成的機能性布料球衣。這些環保材質有助於減少海洋污染，並提升球衣性能。這些海洋塑膠廢棄物主要有，寶特瓶(聚對苯二甲酸乙二酯，簡稱PET)、塑膠袋(聚乙烯，簡稱PE)等。依上述內容，下列何者正確？
