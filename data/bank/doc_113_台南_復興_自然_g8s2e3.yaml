  stem: 上游泳課時，同學討論有關浮力與力的平衡相關問題時，各自述說如下。甲生：我在泳池中可以浮起來，代表我體重較輕。乙生：當我靜止浮在水面上時，我就不會受到浮力作用。丙生：我雖然不會游泳，但是我把腳泡在水中就會有浮力。丁生：當我在水中雙手抱膝維持水母漂時，我所受的浮力恰好等於我的體重。以上哪些觀念是錯誤的？
