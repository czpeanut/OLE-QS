  stem: 佩佩發現一幅有趣漫畫，臭鼬為擺脫大野狼的威脅，會釋出臭氣嚇退敵人！經她查證文獻發現臭鼬驚嚇時所排氣體，竟含有硫酸和硫醇的混合物，不僅奇臭無比，甚至可能會讓敵人窒息和暫時失明。已知硫醇指的是醇類分子(如$C_{2}H_{5}OH$)中的氧原子被硫原子取代的化合物(如$C_{2}H_{5}SH$)。若僅依據上述有提及的物質，判斷臭鼬所釋出的臭氣混合物成分，則下列說明何者合理？
  options:
  - label: A
    content: 含醇類和有機酸類
  - label: B
    content: 含醇類和無機化合物
