- id: doc_113_台南_復興_自然_g8s2e3_s1_42
  section: 1
  number: 42
  type: single
  page: 5
  stem: 有關「酯化」和「皂化」反應，下列何者錯誤？
  options:
  - label: A
    content: 有機酸和油脂反應能產生酯類
  - label: B
    content: 酯化反應是可逆反應，以濃硫酸當催化劑加快反應
  - label: C
    content: 皂化後生成物可透過飽和食鹽水進行分離
  - label: D
    content: 肥皂以石蕊測試會呈藍色。
  group_stem: '【閱讀題組42~43題】

    考古發現，西元前29世紀古巴比倫遺跡中，就有「將油脂與灰燼一起加熱煮沸」，產生的物質可洗淨衣物的記載，這是肥皂最早的製作方式。而在20世紀初的二戰期間，因油脂物料短缺，才開發出以石油副產品為原料的合成清潔劑，結果發現不僅清潔效果好，且不會在硬水中產生皂垢。

    常見肥皂(脂肪酸鈉)化學式為$C_{17}H_{35}COONa$，可由天然脂肪加鹼液製成。雖易與硬水所含$Ca^{2+}$、$Mg^{2+}$產生沉澱(皂垢)，但因脂肪乃動植物體內之脂肪酸和甘油進行反應所生之三酸甘油酯，所以可生物分解、可再生，對環境較為友善。而常見合成清潔劑，如十二烷基苯磺酸鈉(LAS)化學式為$C_{18}H_{29}SO_{3}Na$，是石油裂解後的產物經硫酸鹼化後，與鹼液反應產生。它在結構上與肥皂類似，都具可親油的長碳鏈端，及可溶水的親水端。且與硬水中的$Ca^{2+}$、$Mg^{2+}$結合時，也不會產生沉澱物。但它結構複雜而穩定，不易被生物分解，且易形成泡沫有礙水中溶氧量，對環境與生物不利！'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
