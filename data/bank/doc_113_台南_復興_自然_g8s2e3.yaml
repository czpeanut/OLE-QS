  stem: '將附圖中的甲、乙、丙、丁四個不同材質的實心正立方體，分別放入1000ml純水中。已知四種物體皆不與水發生化學反應，且不吸水也不溶於水，則根據附表判斷，當靜止平衡後，哪一個物體在液面下的體積最大？

    | 物體 | 甲 | 乙 | 丙 | 丁 |

    | :--- | :--- | :--- | :--- | :--- |

    | 體積($\text{cm}^{3}$) | 40 | 30 | 20 | 10 |

    | 密度($\text{g/cm}^{3}$) | 0.5 | 1.0 | 2.0 | 3.0 |'
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
