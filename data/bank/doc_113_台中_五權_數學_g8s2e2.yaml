  section: 1
  number: 6
  type: single
  page: 1
  stem: '以下是「過線外一點作垂線」的尺規作圖步驟：

    ① 已知直線 $L$ 與線外一點 $P$，先以 $P$ 點為圓心，適當長為半徑畫弧，弧與直線 $L$ 交於 $A$、$B$ 兩點。

    ② 分別以 $A$、$B$ 為圓心，大於 $\frac{1}{2}\overline{AB}$ 的相同長度為半徑，分別畫出兩弧交於 $Q$ 點

    ③ 連接 $\overleftrightarrow{PQ}$

    小翊、小妍和小美對於此作圖的說法如上。試判斷他們的說法何者正確?'
  options:
  - label: A
    content: 小翊正確
  - label: B
    content: 小妍正確
  - label: C
    content: 小美正確
  - label: D
    content: 三人皆正確
