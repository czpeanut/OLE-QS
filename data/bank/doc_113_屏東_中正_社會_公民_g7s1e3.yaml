  stem: 開班會時，班長說明在禮堂聆聽「對性騷擾說不！」演講的班級位置。榮璿突然踢了至祥的桌子，至祥隨即往榮璿身上丟去整包衛生紙。曉晴發現就舉手提出臨時動議，請求露比處理。稍後，要表決採用何種教室布置用紙時，露比請同學先表決後提議的"海報紙"，曉晴聽見又舉手提出臨時動議，請求露比處理。依上文，下列哪一個選項是正確的呢？
