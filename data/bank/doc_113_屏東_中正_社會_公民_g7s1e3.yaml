    第三十二條第一項

    獎懲會審議學生懲處事件及學校之特殊管教措施之決定，經校長核定後，學校應作成管教或懲處事件審議決定書，記載主旨、事實、理由、法令依據及不服管教或懲處決定之救濟方法、期間及受理機關，並以可供存證查核方式，書面通知受懲處學生及其法定代理人或實際照顧者。'
