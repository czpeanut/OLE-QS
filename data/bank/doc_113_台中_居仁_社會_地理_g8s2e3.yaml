  section: 2
  number: 38
  type: single
  page: 4
  stem: 導致以巴衝突發生的因素不包含下列何者?
  options:
  - label: A
    content: 族群
  - label: B
    content: 宗教
  - label: C
    content: 石油資源
  - label: D
    content: 河川水源
  group_stem: "在2023 年10 月初，西亞地區爆發了以巴衝突。巴勒斯坦哈馬斯組織對以色列發動大規模攻擊，從加薩地區發射大量火箭及派遣武裝分子跨越國界進入以色列領土。以色列隨後發動猛烈反擊。\n\
    \  以巴衝突造成彼此境內人員傷亡外，農作物的產量也大受影響。此外，因葉門的胡塞組織為聲援巴勒斯坦，襲擊多國與以色列利益相關的商船，胡塞組織宣稱對航運的襲擊「將持續下去，直到侵略停止、對加薩走廊的圍困解除」。而衝突也影響了全球船運主要航道－蘇伊士運河，光2024\
    \ 年前幾個月，通過蘇伊士運河的交通量比同期下降了30%，已經嚴重衝擊到仰賴收取蘇伊士運河通行費的國家。而臺灣貨櫃三雄長榮、陽明、萬海也陸續宣布暫停通行某海域，改繞到非洲南端的好望角，避免台灣商船遭受戰事波及。"
  shared_asset: g2_38_42
