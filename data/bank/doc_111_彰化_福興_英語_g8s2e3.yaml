- id: doc_111_彰化_福興_英語_g8s2e3_s8_1
  section: 8
  number: 1
  type: single
  page: 2
  stem: ( ) 1.What does clever mean in the reading?
  options:
  - label: A
    content: Smart.
  - label: B
    content: Ugly.
  - label: C
    content: Stupid.
  - label: D
    content: Crazy.
  group_stem: 'Coffee Helps Power London''s Buses

    Air pollution is getting serious in every part of the world. Buses and cars that
    run on gas make the problem worse. Because of the dirty air, many people get sick
    or die.

    In London, a new kind of biofuel that is made from coffee waste has been used
    to help power some of the city''s buses. The following is how the biofuel is made.

    (1) Coffee waste is collected from coffee shops, restaurants, and coffee factories.

    (2) The waste is dried and processed to get oil from it.

    (3) The coffee oil is blended with fuels to make biofuel.

    Using coffee oil to make biofuel is a clever idea because as long as people drink
    coffee, there will always be coffee waste. Besides, buses that run on such biofuel
    are more friendly to the Earth than those that run on gas.

    Clean fuels, like coffee oil, may widely be used to fix the air problem in the
    future, Until then, many more studies and tests are still needed.

    pollution 污染 biofuel 生物燃料 waste 廢棄物 Process 加工 blend 混合'
