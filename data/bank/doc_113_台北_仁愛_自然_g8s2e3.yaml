- id: doc_113_台北_仁愛_自然_g8s2e3_s1_33
  section: 1
  number: 33
  type: single
  page: 4
  stem: 由上文可以得知，何謂塑膠微粒？
  options:
  - label: A
    content: 所有塑膠製品都屬於塑膠微粒
  - label: B
    content: 只有天然來源的塑膠纖維才是塑膠微粒
  - label: C
    content: 尺寸小於 5 毫米的塑膠碎片
  - label: D
    content: 塑膠袋才會產生塑膠微粒
  group_stem: "什麼是塑膠微粒呢？根據美國海洋暨大氣總署（NOAA）的定義，塑膠微粒是指尺寸小於5 毫米的塑膠碎片，包含初級和次級兩種來源：初級來源是指為了特定目的而生產的塑膠顆粒，一開始就製成微小尺寸，例如洗面乳中的塑膠柔珠；次級來源則是從日常生活普遍使用的塑膠製品分解而來，包括由聚乙烯（PE）、聚丙烯（PP）、聚苯乙烯（PS）、聚對苯二甲酸乙二酯（PET）或與聚乳酸（PLA）混合而成的可分解塑膠等，另外石油提煉產品所生產的布料、人造纖維（如：聚酯纖維、Nylon尼龍纖維）清洗過程中產生的碎屑顆粒，也屬此類。\n\
    \     至於，民眾討論度頗高的「可分解餐具」，主要的原料是「PLA」﹔純PLA 製成的餐具在高濕高溫的條件下，會分解成無毒的乳酸、水及二氧化碳，重返自然。因為無毒、可塑性高，故很快就成為塑膠的替代品，但其缺點是超過攝氏60\
    \ 度使用時會軟化變形，因此不適合裝熱食。為了提高PLA 餐具的耐熱性，有些廠商會混合PLA 和PP，但這種「混合塑膠」就失去完全分解的特性了，變成不能回收的廢棄物，最後還得送進焚化爐處理；但這類「混合塑膠」如果被隨意丟棄，也會因碎化，成為次級塑膠微粒的來源。另外，還有一種PE\
    \ 材質的可分解塑膠袋，雖然添加了澱粉或碳酸鈣，可以加速碎化，乍看似可分解，實際上只是澱粉的部分被細菌分解掉，PE 分子並不會自然分解消失，最後還是得碎解成小塑膠片，成為次級塑膠微粒的來源，危害環境。\n\
    \                             摘錄自<科技大觀園>"
