    content: 9 hours a day.
  group_stem: 'Both Mr. and Mrs. Joseph are English teachers from the UK. Benson,
    who chose Chinese as his second language after school, is their son. Two years
    ago, the Josephs moved to Taiwan together. Mr. and Mrs. Joseph teach English in
    a few elementary schools in Taiwan. As for Benson, he studies at a junior high
    school beside the apartment they live in.

    Before moving to Taiwan, the Joseph family lived a simple life in their hometown(家鄉).
    They used to work or study from 9:00 a.m. to 3:00 p.m. And then, Benson’s parents
    exercised in a gym beside a supermarket with many parking spaces. They could park
    their car there for free for the first hour on weekends. Benson’s second language
    school which gave him 3 Chinese classes every afternoon was just on the top floor
    of the supermarket.

    In early 2022, all of them started their new life in Taiwan. They would like to
    experience how people in Taiwan spend their days. They have lived like Taiwanese.
    They start their days with having breakfast at the breakfast shops which most
    Taiwanese get their first meals from. At lunch time, they have lunch at school.
    It is hard for them to believe that schools in Taiwan have prepared lunch for
    students since tens of years ago. After school, the Josephs usually go home with
    dinner.

    In the UK, the Josephs seldom ate out. They used to bake or cook at home. Yet,
    they have tried dozens of restaurants and hundreds of meal boxes in Taiwan. They’ve
    made videos to introduce(介紹) the food they’ve tried and the places they’ve visited
    to their friends.

    On April 3rd, 2024, while the Josephs were taking a trip to Hualian, an earthquake
    happened seriously. Besides the earthquake which they never experienced in the
    UK, the terrible traffic in Taiwan worries them a lot. They are too scared to
    stay in Taiwan. That’s why they are planning to move back to the UK next spring.
    Before that, they have to sell their scooters and bikes which are their main vehicles(交通工具).

    After getting the news, Benson’s classmates are planning to do something for Benson
    to remember the days in Taiwan.'
