  stem: The grapes below were left on Christina’s table after she ate the ones she
    needed to welcome a lucky 2025. Guess how many grapes at least did Christina have
    before the 12 clock strikes?
  options:
  - label: A
    content: '8'
  - label: B
    content: '12'
  - label: C
    content: '20'
  - label: D
    content: '2025'
  group_stem: 'New Year’s Celebration

    “Las doce uvas de la suerte” is a sentence of Spanish. It means “the twelve grapes
    of luck” in English. At midnight of the New Year, eating 12 grapes has been a
    Spanish tradition(傳統) . To finish 12 grapes from the first strike to the twelfth
    strike could bring people good luck. People get together to eat the grapes: at
    home or in the main square in their town.

    This year, “Las doce uvas de la suerte” was popular with the young in Taiwan.
    Young guys around Taiwan were busy buying grapes before New Year’s Eve. All the
    grapes in Taiwan were almost sold out. What a crazy tradition from Spain!

    In the Philippines(菲律賓), round shapes have been believed to bring good luck and
    money. To welcome the new year, many people wear clothes with dots and put 12
    round fruits on the table. Each of the fruits stands for each month. What’s more,
    people there turn on all the lights on New Year’s Eve to welcome a bright new
    year.

    *strike 敲鐘n. v.(strike-struck-struck)'
