  group_stem: 【題組三】你知道雨來菇不是菇嗎？雨來菇的學名是葛仙米藻（Nostoc commune），是一種單細胞生物。它與植物一樣含有葉綠素，卻沒有真正的細胞核。雨來菇常出現在潮濕的山區或溪邊，乾燥時會縮成薄片，遇雨則迅速膨脹變得柔軟透明，其外層包覆膠質，有助於保濕與抵抗乾旱。部分細胞還能特化成「異形細胞」(如圖六)，固定空氣中的氮氣，提供土壤養分，有益生態。目前在屏東滿洲等地已有人工栽培，未來有望成為具經濟與生態價值的天然資源。
