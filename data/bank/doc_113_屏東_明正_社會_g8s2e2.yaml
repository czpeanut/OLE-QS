  group_stem: '【題組二】

    19 歲的阿忠想要換最新型的iPhone 16，但沒有錢購買。便夥同自己年僅15 歲的死黨阿孝，利用夜晚潛入阿仁開的手機行，翻箱倒櫃拿走了兩台最新的iPhone
    16 和抽屜裡的5 萬多元，離開手機行時，被出門要買消夜的小愛看到，兩人為避免形跡敗露，隨手拿起路旁的鐵條棒打小愛後隨即離開，受重傷的小愛躺在血泊中，直到幾分鐘後，有路人經過趕緊打電話報警並叫救護車。

    警方到場後馬上進行蒐證工作，並通知手機行老闆阿仁，調閱監視器一看，馬上認出竊賊其中一人是自己小孩的同學阿孝。而阿忠和阿孝兩人將犯案得手的5 萬多元拿去吃喝玩樂，但還沒來得及花完，就被警方循線逮捕。警方通知阿孝的家屬和手機行老闆阿仁到警局，阿孝的父親一見到老闆阿仁立刻下跪，哭著說自己老來得子，只有阿孝這個小孩和自己相依為命，懇求老闆原諒阿孝。

    老闆阿仁被阿孝的父親感動到，決定原諒阿孝，請警察不要將阿孝移送法辦，警察搖搖頭說沒辦法，依規定還是要移送法辦，隨即押解兩人上警車，移送到地檢署。現場只聽到阿孝的父親哭倒在地，讓旁人看了都不勝唏噓。

    經調查後，阿忠和阿孝犯罪嫌疑重大，被提起公訴求處重刑。地方法院審審理後，兩人都被判有期徒刑。

    請根據短文回答第63 題～第66 題'
