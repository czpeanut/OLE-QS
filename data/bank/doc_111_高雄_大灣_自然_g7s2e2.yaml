- id: doc_111_高雄_大灣_自然_g7s2e2_s1_47
  section: 1
  number: 47
  type: single
  page: 4
  stem: 關於植物界的描述，下列何者錯誤？
  options:
  - label: A
    content: 皆為多細胞
  - label: B
    content: 皆具有細胞壁
  - label: C
    content: 皆具有葉綠體
  - label: D
    content: 皆具有細胞核。
  group_stem: "植物給人們的印象通常可行光合作用，為自然界中的生產者，但是有些植物卻並無光合作用的能力，今天就來認識以下兩個特別的植物。\n    在優美的古詩裡，菟絲被形容為柔弱依附的婦女，然而真實植物世界裡，她卻是威力無比的植物殺手。菟絲子缺乏根與葉，所以無法行光合作用製造養分，也無法從土壤裡吸取水分，因而利用爬藤狀的莖攀附在其他植物上，以吸器刺入寄主體內吸收養分，台灣菟絲子生活周期較長，9～11\
    \ 月間始有花苞形成，10～2 月間陸續結花苞及開花，12～5 月間陸續結果且全株逐漸枯萎，種子約 5～9 月間萌芽。\n    另有些植物既無葉綠素，也沒寄主，而是吸收腐植土中的養份存活，水晶蘭即是如此。一般人見到水晶蘭，容易誤認為蕈類，或因其名稱誤以為是單子葉的蘭花，其實水晶蘭是一種雙子葉植物，靠著真菌分解腐植質所產生的養份存活，水晶蘭偏好生長在\
    \ 1500~3300 公尺的中高海拔潮濕的環境中，春到夏季為水晶蘭花期，其花朵呈鐘形，微微下垂，在紅檜及冷杉林下、或是陽光不直接照射的潮濕處都有機會發現她潔白透明的身影。\n\
    節選自科學人~失去綠色的植物－水晶蘭\n節選自環境資訊中心~日本菟絲子入侵大台北"
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 生物
      code: 3-4
      title: 植物界
      chapter: 第3章 生物的演化與分類
    textbook: 七下生物 3-4 植物界
    labeled_by: ai
  ai_answers:
