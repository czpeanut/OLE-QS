    10 多年來牛樟芝在各方面的療效漸受學界肯定，加上商業廣告宣傳，使得牛樟芝聲名大噪，助長了牛樟芝的盜採與牛樟的盜伐，導致牛樟樹越來越稀少。」根據上述，附表中，牛樟樹和牛樟芝生物特徵的比較，哪些正確？


