    content: 以上皆是。
  group_stem: "2019 年 12 月起中國湖北武漢市發現不明原因肺炎群聚，疫情初期個案多與武漢華南海鮮城活動史有關，中國官方於 2020 年 1 月\
    \ 9 日公布其病原體為新型冠狀病毒。此疫情隨後迅速在世界各地擴散，並證實可有效人傳人。世界衛生組織（WHO）於 2020 年 1 月 30 日公布此為一公共衛生緊急事件，2\
    \ 月 11 日將此新型冠狀病毒所造成的疾病稱為 COVID-19（Coronavirus Disease-2019），國際病毒學分類學會則將此病毒名定為\
    \ SARS-CoV-2。冠狀病毒(CoV)的最外層有一層外套膜，外表為圓形，在電子顯微鏡下可看到類似皇冠的突起因此得名。\n    新冠病毒的潛伏期一般可多達\
