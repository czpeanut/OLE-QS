  stem: Look at the calendar.（日曆） When is Thanksgiving this year?
  options:
  - label: A
    content: On November twenty-seventh.
  - label: B
    content: On the fourth Tuesday in November.
  - label: C
    content: On the third Thursday in November.
  - label: D
    content: On November twentieth.
  group_stem: 'B.

    Thanksgiving is a special holiday in the USA. It is on the fourth Thursday of
    November every year. On this day, families come together to give thanks for the
    good things in their lives.

    The first Thanksgiving was in 1621. The Pilgrims came from England to America.
    Their first winter was very hard, and many people got sick or died. The next year,
    Native Americans helped the Pilgrims grow crops and hunt local animals. In the
    fall, they had a big meal together to thank God for the harvest. This was the
    first Thanksgiving.

    Today, people in the U.S. celebrate Thanksgiving in many ways. The most important
    part is eating dinner with family and friends. The main food is roast turkey.
    People also eat mashed potatoes（馬鈴薯泥）, sweet potatoes, stuffing（餡料）, cranberry
    sauce（紅莓醬）, and pumpkin pie. It is a big and delicious meal!

    Many people also watch the Thanksgiving Day Parade on TV. It has big balloons,
    music, and fun shows. Some people play football or watch football games. Others
    help people in need by giving food or money.

    Thanksgiving is a happy time. People feel thankful for their family, friends,
    home, and food. It is a day to remember the past and enjoy the present.

