  number: 1
  type: essay
  page: 5
  stem: 您工作仍然很忙碌嗎？
  group_stem: 'Dear Mom,

    How are you doing in Singapore? 1. 您工作仍然很忙碌嗎？ Dad and I miss you a lot.

    We are fine here. Don’t worry about us. 2. 我和爸爸一起閱讀和運動。 We do the housework, too.

    3.爸爸每天拖地，而我洗碗盤。（……day.） Dad is a great cook. 4. 他真地把我照顧得很好。

    In my eyes, Dad is a superdad, and you are a supermom.

    Today is May thirteenth, and it is also Mother’s Day. Happy Mother’s Day!

    Love,

    John'
