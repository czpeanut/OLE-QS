  type: single
  page: 4
  stem: Why are more children near-sighted?
  options:
  - label: A
    content: They don’t wear glasses very often.
  - label: B
    content: They use technology too much.
  - label: C
    content: They study hard all the time and learn fast.
  - label: D
    content: They don’t eat enough vegetables or fruit.
  group_stem: 'C.

    Today, many children use technology like phones, tablets, and computers. These
    things help kids learn fast. They can also look for information by themselves.
    Some kids even study without（沒有） a teacher by watching videos or reading online.

    But using these things for a long time can hurt their eyes. More and more children
    are near-sighted. About 30% of kids in elementary school have eye problems now.
    Many parents are worried and want to help their children protect their eyes.

    There are some good ways to help. First, kids should go outside more often. Playing
    outdoors and look-ing at far places are good for the eyes. Second, they should
    not use phones or computers too long. Third, they should take a short rest every
    30 minutes when using their eyes a lot. Also, going to a doctor to check their
    eyes is important. If there is a problem, the doctor can fix it.

    Electronic things are helpful and important to many young people. However, children
    should enjoy technology and also care about their eyes.


