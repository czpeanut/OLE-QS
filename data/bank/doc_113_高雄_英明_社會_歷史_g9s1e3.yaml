- id: doc_113_高雄_英明_社會_歷史_g9s1e3_s1_30
  section: 1
  number: 30
  type: single
  page: 1
  stem: 在科學革命的推展下，新技術和新發明不斷湧現。到了18 世紀中期後，就有了活塞式的蒸汽機問世，並且在不斷的改進下，讓機器運作更加穩定，帶領人類進入了生產效率不斷提高的「工業革命」時代。請問：下列關於「工業革命」的敘述正確？甲、洛克改良蒸汽機，不僅有助紡織業的發展，也促成交通的革新。
    乙、英國當時政治穩定，且煤礦蘊藏豐富，成為工業革命的發源地。丙、城市的就業機會多，吸引大量人口湧入，帶來治安與環境問題。丁、資本家忽視勞工福祉，造成勞資對立，衍生出社會主義等思想。
