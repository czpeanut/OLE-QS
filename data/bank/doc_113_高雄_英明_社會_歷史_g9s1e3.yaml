  stem: 西元1848 年，馬克思與恩格斯發表了《共產黨宣言》，至1917 年俄羅斯發生革命，《共產黨宣言》已發行數百種版本。它可以說是繼法國大革命《人權宣言》之後，影響世界深遠的政治文獻。請問：「共產主義」思想之所以興起和下列哪一事件有關？
