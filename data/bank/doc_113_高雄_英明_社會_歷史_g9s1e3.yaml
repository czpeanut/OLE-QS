- id: doc_113_高雄_英明_社會_歷史_g9s1e3_s1_29
  section: 1
  number: 29
  type: single
  page: 1
  stem: 印度著名的古蹟「泰姬瑪哈陵」是蒙兀兒帝國第五代皇帝沙迦罕為了紀念他已故的愛妻而興建的白色大理石陵墓，西元1983 年被聯合國教科文組織列為世界遺產。該建築不僅展現帝國的國力，也將統治者的甲信仰與印度、波斯等文化結合，反映帝國在文化上的包容。然而在歐洲的海外擴張進逼之下，帝國最後一任統治者被歐洲強權乙流放，印度也淪為歐洲強權的殖民地。請問：上述內容中的甲、乙，分別是指？
