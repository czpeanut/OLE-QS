  section: 1
  number: 24
  type: single
  page: 1
  stem: 提出「我思故我在」的法國哲學家笛卡兒，被視為第一個強調運用理性於自然科學發展的思想家，其主張也影響中國民初著名學者胡適的「大膽假設，小心求證」的治學方法。請問：下列關於笛卡兒的敘述，何者正確？
  options:
  - label: A
    content: 他提倡演繹法，主張知識可藉由推理獲得
  - label: B
    content: 他曾資助法王路易十四成立法蘭西科學院
  - label: C
    content: 他透過改良的望遠鏡發現月球表面的坑洞
  - label: D
    content: 他主張透過觀察、實驗歸納出普遍的原則。
