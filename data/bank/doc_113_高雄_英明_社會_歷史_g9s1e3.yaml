  stem: 2019 年爆發的新冠肺炎，於2020 年初迅速擴散至全球各國，最後變成一場造成多人傷亡的大瘟疫。回顧16 世紀時，天花、麻疹…等傳染病也隨歐洲人來到他們發現的「新世界」，造成不少居住於墨西哥與祕魯的原住民染病而死。有學者因此認為歐洲人能征服「新世界」，與病毒有關，所以病毒是「新世界」真正的征服者。關於上文所描述的情況，與下列何者最有關係？
