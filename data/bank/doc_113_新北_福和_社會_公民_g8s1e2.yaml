- id: doc_113_新北_福和_社會_公民_g8s1e2_s1_43
  section: 1
  number: 43
  type: single
  page: 2
  stem: '台灣曾對於酒後駕車的處罰相對較輕，許多民眾抱持僥倖心態，導致酒駕事故頻傳，政府為了遏止酒駕行為，於民國 88 年增定相關罰則，大幅提高酒駕的法律責任，並增設相關配套措施，下列哪些敘述最能體現依法行政精神？L3

    甲、政府必須依據新的法律規定對酒駕行為進行處罰 乙、政府可以根據行政命令對酒駕行為進行處罰

    丙、必須明確規定酒駕犯罪行為相關罰則，避免國家濫用刑罰權 丁、警方有權根據自身判斷是否對酒駕者加重處罰。'
