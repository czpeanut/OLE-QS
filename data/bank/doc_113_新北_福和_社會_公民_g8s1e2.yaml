- id: doc_113_新北_福和_社會_公民_g8s1e2_s1_37
  section: 1
  number: 37
  type: single
  page: 1
  stem: 以往我國《刑法》認為，從事業務之人，比一般人對該業務更專業、更熟悉，因此一旦對他人造成傷害，就應該承擔更重的刑責。不過西元 2019 年 5 月立法院通過修正案，認為不應該依個人從事何種職業，來判斷造成傷害時所要負擔的刑責，故刪除相關罪名規定；另外，將傷害、重傷、傷害致死、過失傷害等罪名刑度全面提高，讓法官可以依照過失情節，有較大的空間來決定刑度。請問：依據上文與罪刑法定原則，下列何者行為在修法後的刑度加重？L3
  options:
  - label: A
    content: 醫生開刀時造成病患受傷
  - label: B
    content: 因停車糾紛而互毆傷人
  - label: C
    content: 餐廳讓消費者吃壞肚子
  - label: D
    content: 計程車搭載客人發生車禍。
