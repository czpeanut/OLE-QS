- id: doc_113_新北_福和_社會_公民_g8s1e2_s1_38
  section: 1
  number: 38
  type: single
  page: 1
  stem: '刑事案件由刑事訴訟程序進行，確認國家對被告是否可依法處罰，以避免人民在國家追訴犯罪的過程當中，受到公權力的不當干擾與侵害，下列有關刑事訴訟過程的敘述，何者是正確的？L4

    甲、偵查：依據法律程序蒐集案件相關刑事證據，過程中得公開所取得資料

    乙、起訴：國家對犯罪的追溯方式，包括「公訴」和「告訴」，當足以證明有犯罪嫌疑時，即可提起訴訟

    丙、審判：法官必須超出黨派，依法獨立審判，判決被告有罪或無罪，以及須承擔的刑責

    丁、執行：判決確立後，移交檢察署針對受刑人執行該項判決'
  options:
  - label: A
    content: 甲丙
  - label: B
    content: 乙丁
  - label: C
    content: 甲乙
  - label: D
    content: 丙丁。
