- id: doc_113_新北_福和_社會_公民_g8s1e2_s1_35
  section: 1
  number: 35
  type: single
  page: 1
  stem: 在一個名為「和諧村」的社區裡，居民們原本過著和平安定的生活。然而，近期卻有人在公園裡隨意破壞公共設施，有人在深夜製造噪音擾民，還發生了幾起小偷竊盜的案件。這些事件不僅影響了生活品質，也讓大家開始擔心社區的治安問題。面對這些情況，居民們召開緊急會議，討論如何解決這些問題。有人提議加強社區巡邏，有人建議安裝監視器，還有人認為應該制定更嚴格的社區規範。請問在這些討論中，如果沒有國家所賦予的「刑罰權」，社區居民們最可能面臨什麼樣的困境？[素養題]
    L3
  options:
  - label: A
    content: 無法有效推動社區的發展計畫，導致社區經濟停滯
  - label: B
    content: 無法有效管理社區內的公共資源，導致資源分配不均
  - label: C
    content: 無法有效參與地方政府的決策，導致社區權益受損
  - label: D
    content: 無法有效解決社區內的紛爭，可能導致私刑報復的出現。
