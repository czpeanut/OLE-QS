- id: doc_113_新北_福和_社會_公民_g8s1e2_s1_36
  section: 1
  number: 36
  type: single
  page: 1
  stem: '日常生活中，人與人之間難免發生糾紛，導致權利受到不法侵害，身為現代公民，可以運用各種方式來維護自己的權益，右表哪一個人的說法最為適當？L4


    | 人物 | 說 法 |

    | :--- | :--- |

    | 小康 | 相關事情全權交給律師處理就好，我們不需要了解。 |

    | 小許 | 採取私力救濟的手段比訴諸法律更能保障個人權利。 |

    | 小簡 | 對法律有多一點了解，就能適時透過法律保障自身權益。 |

    | 小方 | 個人權利要獲得保障，必須先與法官建立良好的關係。 |'
  options:
