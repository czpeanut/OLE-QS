  section: 2
  number: 47
  type: single
  page: 2
  stem: 郭男和彭男分別被判處 5 個月及 6 個月徒刑，均可易科罰金，請問有關於刑罰的敘述，何者正確？L3
  options:
  - label: A
    content: 有期徒刑與褫奪公權同屬主刑
  - label: B
    content: 有期徒刑不可獨立科處
  - label: C
    content: 有期徒刑與拘役均為剝奪自由的刑罰
