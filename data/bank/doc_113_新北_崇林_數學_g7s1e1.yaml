- id: doc_113_新北_崇林_數學_g7s1e1_s1_12
  section: 1
  number: 12
  type: fill
  page: 1
  stem: '天文單位（英語：Astronomical unit，縮寫的標準符號為 AU）是天文學上的長度單位，曾以地球與太陽的平均距離定義。2012 年 8
    月，天文學家以無記名投票的方式，根據 NASA 最新消息，把天文單位固定為 149, 597, 870, 700 公尺。新的天文單位以公尺來定義，而公尺的定義來源於真空中的光速，也就是說，天文單位現在不再與地球與太陽的實際距離掛鉤，而且也不再受時間變化的影響（雖然天文單位最初的來源就是日地平均距離）。天文單位
    149, 597, 870, 700 公尺約為 149600000000 公尺，將 149600000000 公尺以科學記號表示，可紀錄為_________________________公里。(1
    公里為=1000 公尺)

    資料來源 https://zh.wikipedia.org/zh-tw/%E5%A4%A9%E6%96%87%E5%96%AE%E4%BD%8D)'
