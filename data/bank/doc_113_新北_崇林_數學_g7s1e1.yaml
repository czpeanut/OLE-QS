- id: doc_113_新北_崇林_數學_g7s1e1_s3_2
  section: 3
  number: 2
  type: calc
  page: 4
  stem: '崇林國中實施學生榮譽卡制度，希望鼓勵學生有好的表現，為了方便統計學生榮譽卡的結果，榮譽卡正面有六十格，以「+」表示加卡，背面有 90 格，以「-」表示扣卡
    ，皆以老師簽名作認證，例如:正面 11 格有老師簽名，就記為「+11」，背面有 2 格有老師簽名，就記為「-2」，1 加卡可抵銷 1 扣卡。請回答下列問題

    (1) 小瑟同學的榮譽卡正面 16 格有老師簽名，背面沒有任何老師簽名，可記為___________(1 分)

    (2) 小麗同學的榮譽卡正面沒有任何老師簽名，背面 3 格有老師簽名，可記為___________(1 分)

    (3) 小玉同學正面 35 格有老師簽名，背面 8 格有老師簽名，可記為___________(1 分)

    (4) 小宇、小旭、小寧、小淋四位同學的榮譽卡記錄如下表：


    | 座號 | 小宇 | 小旭 | 小寧 | 小淋 |

    | :--- | :---: | :---: | :---: | :---: |

    | 加卡 | +53 | +44 | +39 | +41 |

    | 扣卡 | -23 | -12 | -1 | -5 |


    請問榮譽卡經加扣卡扺銷後的加卡數，最多的是哪一位?加卡數是多少？(2 分)'
