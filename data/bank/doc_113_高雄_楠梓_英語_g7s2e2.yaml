- id: doc_113_高雄_楠梓_英語_g7s2e2_s6_48
  section: 6
  number: 48
  type: single
  page: 5
  stem: Which kind of energy is NOT mentioned (提到)?
  options:
  - label: A
    content: Wind.
  - label: B
    content: Sunlight.
  - label: C
    content: Water.
  - label: D
    content: Fire.
  group_stem: 'Reading III.


    Green Power

    Green power is energy that comes from nature. It includes sunlight, wind, and
    water. These kinds of

    power are clean and do not hurt the Earth, so they are good for the Earth.

    Sunlight can be used to make solar energy. Solar panels on rooftops collect sunlight
    and turn it into

    electricity. Wind power comes from the wind. Big windmills, called wind turbines,
    turn in the wind to make

    power. Water from rivers, dams or oceans can also be used to make electricity.

    Green power is important because it does not make dirty air. It helps keep our
    planet clean. Also, green

    power does not run out like oil or gas.

    Many countries are using more green power now. In the future, we may only use
    green power to help the

    Earth.'
