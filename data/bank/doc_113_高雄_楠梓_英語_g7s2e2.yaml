  stem: What kind of water is NOT okay to use during Songkran?
  options:
  - label: A
    content: The water we drink.
  - label: B
    content: The water we use for cooking.
  - label: C
    content: The water that is not clean.
  - label: D
    content: The water that is not hot.
  group_stem: "Reading II.\nTaboos for Songkran\nSongkran is a fun and happy holiday\
    \ in Thailand. People enjoy splashing water, dancing, and\nspending time with\
    \ family. However, there are also some taboos during Songkran that people should\n\
    remember.\nOne taboo is not to wear too little clothing. Even though people get\
    \ wet, it is important to dress\npolitely. Wearing swimsuits in public is not\
    \ respectful in Thai culture. Another taboo is not to use dirty\nwater in water\
