- id: doc_113_高雄_楠梓_英語_g7s2e2_s6_41
  section: 6
  number: 41
  type: single
  page: 4
  stem: What can AI help a robot do?
  options:
  - label: A
    content: Eat food.
  - label: B
    content: Answer questions.
  - label: C
    content: Fly in the sky.
  - label: D
    content: Sleep at night.
  group_stem: "Reading I.\n\nWhat is AI?\n   AI means “Artificial Intelligence.” It\
    \ is a kind of smart computer technology. AI helps machines do things\nthat usually\
    \ need human thinking. For example, AI can help a robot talk, play music, or answer\
    \ questions.\n   Today, we can see AI in many places. Smartphones use AI to understand\
    \ your voice. Online stores use AI\nto show things you may want to buy. Some cars\
    \ can even drive by themselves with the help of AI.\n   AI learns by looking at\
    \ data. If you show it many pictures of dogs, it will learn what a dog looks like.\
    \ Then\nit can find dogs in new pictures. This is called machine learning.\n \
    \  AI is growing fast. In the future, it may help doctors find sickness or help\
    \ students learn better. But we also\nneed to be careful. Something bad can happen\
    \ if we use AI in the wrong way. People must use AI in a smart\nand safe way.\n\
    \                                   Artificial Intelligence 人工智慧   computer technology\
    \ 電腦科技\n                                        machine 機器   learn 學習   data 資料\
    \   careful 小心的"
