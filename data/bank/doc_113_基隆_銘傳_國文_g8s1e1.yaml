  section: 3
  number: 6
  type: single
  page: 1
  stem: 下列「　」中的成語，何者運用不正確？
  options:
  - label: A
    content: 只要擬訂計畫，認真投入，每個學生的能力都「不容小覷」。
  - label: B
    content: 警察辦案需要講求證據，不可以在毫無線索的情形下「捕風捉影」。
  - label: C
    content: 在工作上遭遇挫折之後，王先生決定「克紹箕裘」，接手父親留下來的公司。
  - label: D
    content: 原本吵得很厲害的好朋友，經過老師調解，終於「破鏡重圓」，恢復友誼。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_基隆_銘傳_國文_g8s1e1_s3_7
  section: 3
  number: 7
  type: single
  page: 1
  stem: 下列各句何者沒有錯別字？
  options:
  - label: A
    content: 早上突如其來的一場頃盆大雨，看著急著上班的行人在雨中掙札，令人不忍。
  - label: B
    content: 妹妹終於查覺媽媽的用心，於是眼中泛起晶盈的淚光。
  - label: C
    content: 家裡養的寵物不幸往生，使我們頓時體會生命無常的道理。
  - label: D
    content: 新的教室十分寬傚，乾淨的環境令人心懷忡怡。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_基隆_銘傳_國文_g8s1e1_s3_8
  section: 3
  number: 8
  type: single
  page: 2
  stem: 下列文句，何者文意最為順暢，沒有冗言贅字？
  options:
  - label: A
    content: 地震發生當下，霎時須臾地面晃動不止，房屋傾倒，滿目瘡痍的景況令人感嘆。
  - label: B
    content: 琦君懷念兒時的雨天樂趣，即使離開家鄉外出求學，也捨不得忘記。
  - label: C
    content: 王藍田個性急躁，為了吃到雞蛋而不擇手段方法，最後什麼也沒有得到。
  - label: D
    content: 為人子女應該懂得奉養反哺父母，才算是盡了孝道。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_基隆_銘傳_國文_g8s1e1_s3_9
  section: 3
  number: 9
  type: single
  page: 2
  stem: 以下關於作者的敘述，哪一位不正確？
  options:
  - label: A
    content: 陳冠學自教職退休之後，歸隱田園，致力於寫作，作品充滿對鄉土的關愛之情。
  - label: B
    content: 白居易，字樂天，晚號醉吟先生、香山居士，詩作風格強調山居田園生活之樂，是晚唐著名詩人。
  - label: C
    content: 琦君的散文享譽文壇，作品風格溫柔敦厚，以懷舊散文最為著名。
  - label: D
    content: 南朝劉宋皇族劉義慶召集文士合力編撰《世說新語》，內容反映東漢到東晉上層社會的生活面貌。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_基隆_銘傳_國文_g8s1e1_s3_10
  section: 3
  number: 10
  type: single
  page: 2
  stem: 關於〈田園之秋選〉的文句說明，何者正確？
  options:
  - label: A
    content: 以「摘了一整天的番薯蒂。」開始，點明作者的職業並強調工作辛勞，以至於無力躲避西北雨。
  - label: B
    content: 「霎時間，天昏地暗，抬頭一看，黑壓壓的」強調下雨的時間在天色昏暗的傍晚時分。
  - label: C
    content: 「大雨滂沱，霹靂環起」所描述的景象類似於「暴雨逐驚雷，從風忽驟來。」
  - label: D
    content: 「終於雷聲愈來愈遠，電光只在遙遙的天邊橫掃。」強調大雷雨的餘威猶存，讓人仍感恐懼。
  lesson_raw:
    title: 田園之秋選
    basis: 題幹提及〈田園之秋選〉
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_基隆_銘傳_國文_g8s1e1_s3_11
  section: 3
  number: 11
  type: single
  page: 2
  stem: 國文老師為了測試學生是否有認真上課，在整理〈田園之秋選〉課文中作者所描寫的景物時，故意放入一個錯誤，請問是哪一個？
  options:
  - label: A
    content: 像天上的水壩洩洪似的：雨勢盛大。
  - label: B
    content: 惡魔與妖巫之出世：烏雲密布。
  - label: C
