- id: doc_113_基隆_銘傳_國文_g8s1e1_s4_29
  section: 4
  number: 29
  type: single
  page: 5
  stem: 依據本文，作者針對生活中「傘」的思考不包括下列哪一項？
  options:
  - label: A
    content: 疑惑社會上對於兩性之間的刻板印象。
  - label: B
    content: 分析兩性之間愛情發生的可能性。
  - label: C
    content: 分享身邊朋友因「傘」而發生的愛情故事。
  - label: D
    content: 冷靜接受人生面對失去的時刻。
  group_stem: '乙. 傘，海角天邊

    　　我喜歡傘，因為傘骨總親暱的靠在一起，撐開來又有着那樣美麗的圓弧形狀。小時候穿著雨衣的我，為了解有一天可以撐傘，期待長大。唸中學開始，我擺脫了濕淋淋氣味酸腐的雨衣，書包裡放著一把摺疊傘，很有些沾沾自喜。幾年之後，漸漸不耐煩帶傘出門了，有一次和一群同學從視聽教室出來，準備搭公車回家，豆大的雨點落下來，將廊簷敲得叮噹響，我們都沒帶傘，擠在簷下避雨。忽然一位學長說：「妳們這些女生怎麼搞的？竟然一把傘也沒帶？」其他的男生一起附和，身邊的女同學很不意思的解釋，說是出門時沒想到會下雨嘛……沉默的我有着小小的困惑與不平：誰說帶傘是女人的責任？

    　　如果下雨時，有個男人體貼的為我撐傘，我想，我一定會愛上他。

    　　這想法很快就面臨挑戰了。大學裡有個男生常常會在我上課的教室附近晃蕩，有時候託人送來一粒蘋果，或者是一包蜜餞，當然，也送來他的詩，那些詩有時候還會登在校刊上。當我在台上排戲的時候，他坐在台下發獃似的盯著我看，那晚排完戲，下起大雨來，我照例沒有帶傘，他撐一把黑傘，在禮堂門口等著送我去搭車。我不肯和他一起走，他不肯我淋雨，僵持之中他忽然將傘塞進我的手中，很快的跑開，消失在黑夜裡。我託同學將傘還給他，並且請他不要再等我了。過了一段時間，校刊上他的詩這樣寫著：「為妳撐傘／卻當我是有毒的蘑菇。」從那時候我就明白，並不是一把傘，就能讓我愛上一個男人。事情絕不會那麼簡單。

    　　傘，也讓我學會比較坦然的面對失去—人的一生到底得丟幾把傘呢—我們丟掉傘又撿到傘，許多傘在不同的手中流轉。「管它是誰的？能遮雨就好。」我不撿別人的傘，甚至在下雨時還會想念我曾經擁有過的那些傘。某個階段我特別喜歡摺疊式的小傘，輕便好攜帶，不下雨的時候也不會顯得多餘。我偏愛一把質材很輕，內裡與外表的花色完全不同的摺傘，我撐著它去上課，將它放在講台旁晾乾，學生常常會歆羨地讚歎：「好漂亮的傘！」那把傘有一次被我遺忘在教室裡，就此遺失，學生們都有種歉疚感，彷彿未盡監督之責。

    　　我還遇過一把金黃色的歐風長柄傘，手把處像一個花苞，鑲嵌著一顆紅寶石似的琉璃，像一柄寶劍，當我帶著它總會吸引不少目光。從此我愛上長柄傘，不僅是裝飾，還可以防身，這傘跟了我很多年，最終還是遺失了，令我好生惆悵。然而，惆悵何止於此，曾經我和一個男人進行著一場秘密的愛戀，我們到異地旅行。遇雨，我挑了一把傘，他付了錢。他希望我帶傘回家，而我堅持不肯，他不明白一個女人在愛情裡怎會有這麼多的忌諱？我不明白為什麼我們那麼小心翼翼還是散了？那柄傘依舊在他的辦公室，我們卻各自流轉到不同的愛情裡了。（張曼娟）'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
