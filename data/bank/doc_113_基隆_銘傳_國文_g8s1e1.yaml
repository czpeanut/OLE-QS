  stem: 下列選項「　」中的注音寫成國字後，何組字形不同？
  options:
  - label: A
    content: 「ㄕˋ」死如歸／「ㄕˋ」若無睹／一「ㄕˋ」同仁。
  - label: B
    content: 「ㄜˊ」角方正／「ㄜˊ」外支出／「ㄜˊ」首稱慶。
  - label: C
    content: 「ㄕㄨ」情歌曲／身心「ㄕㄨ」暢／「ㄕㄨ」解旱象。
  - label: D
    content: 立時「ㄆㄛˋ」殺／勢如「ㄆㄛˋ」竹／天打雷「ㄆㄛˋ」。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_基隆_銘傳_國文_g8s1e1_s3_2
  section: 3
