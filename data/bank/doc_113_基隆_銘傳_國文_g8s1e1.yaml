  section: 3
  number: 5
  type: single
  page: 1
  stem: 下列「　」中的字，何組字義完全相同？
  options:
  - label: A
    content: 未「盡」反哺心／二蟲「盡」為所吞／「盡」其所能。
  - label: B
    content: 四「顧」無人／三「顧」茅廬／「顧」此失彼。
  - label: C
    content: 相「去」復幾許／曾不吝情「去」留／大「去」之期不遠矣。
  - label: D
    content: 雞子「於」地圓轉未止／留蚊「於」素帳中／生「於」戰亂之中。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
