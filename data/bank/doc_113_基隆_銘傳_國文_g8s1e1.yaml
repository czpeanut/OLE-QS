- id: doc_113_基隆_銘傳_國文_g8s1e1_s4_35
  section: 4
  number: 35
  type: single
  page: 6
  stem: 關於文中徐文長的個性與遭遇，以下說明何者正確？
  options:
  - label: A
    content: 即使才華出眾，也不免感嘆造化弄人，有「大道如青天，我獨不得出」之嘆。
  - label: B
    content: 盡情展現能力，即使得不到賞識，也有「此處不留爺，自有留爺處」的灑脫。
  - label: C
    content: 有才華的人如同砂礫裡的珍珠，只要耐心等候，終有「會當凌絕頂，一覽眾山小。」的霸氣。
  - label: D
    content: 為人應該低調樸實，凡事切勿高談闊論，追求「我自不開花，免撩蜂與蝶。」的境界。
