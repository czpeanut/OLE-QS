- id: doc_113_基隆_銘傳_國文_g8s1e1_s4_32
  section: 4
  number: 32
  type: single
  page: 6
  stem: 文章中作者對「洛陽」的看法，未提及以下哪一點？
  options:
  - label: A
    content: 在歷史意義與地理位置上具有關鍵的重要性。
  - label: B
    content: 從建築的盛衰可以看出天下太平或是動亂的徵兆。
  - label: C
    content: 提醒為官者不可為自己私欲而忘記天下蒼生。
  - label: D
    content: 藉歷史事件記錄唐朝由盛轉衰的主要原因。
  group_stem: '丙.《洛陽名園記》後記（節錄）

    　　洛陽處天下之中，挾崤、澠之阻，當秦、隴之襟喉，而趙、魏之走集，蓋四方必爭之地也。天下當無事則已，有事，則洛陽先受兵。予故嘗曰：「洛陽之盛衰，天下治亂之候
    1. 也。」方唐貞觀、開元之間，公卿貴戚開館列第 2. 於東都者，號千有餘邸。及其亂離，繼以五季之酷，其池塘竹樹，兵車蹂躪，廢而為丘墟；高亭大榭，煙火焚燎，化而為灰燼，與唐俱滅而共亡，無餘處矣。予故嘗曰：「園囿之廢興，洛陽盛衰之候也。」且天下之治亂，候於洛陽之盛衰而知；洛陽之盛衰，候於園囿之廢興而得。則《名園記》之作，予豈徒然哉？嗚呼！公卿大夫方進於朝，放乎一己之私以為自為，而忘天下之治忽，欲退享此樂，得乎？唐之末路是矣。（北宋‧李格非）


    注釋：1. 候：徵兆；2. 開館列第：建造官邸。'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
