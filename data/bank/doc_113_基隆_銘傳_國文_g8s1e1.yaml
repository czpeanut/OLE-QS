  page: 6
  stem: 文章中對於徐文長個性與經歷的描述，未提及下列哪一點？
  options:
  - label: A
    content: 名聞鄉里，屢獲肯定。
  - label: B
    content: 才氣縱橫，豪放不羈。
  - label: C
    content: 下筆成章，言之有物。
  - label: D
    content: 勤奮向學，文武兼備。
  group_stem: '丁.〈徐文長傳〉（節錄）

    　　徐渭，字文長，為山陰諸生，聲名藉甚 1.。薛公蕙校越時，奇其才，有國士 2. 之目。然數奇 3.，屢試輒蹶。中丞胡公宗憲聞之，客 4. 諸幕。文長每見，則葛衣烏巾
    5.，縱談天下事，胡公大喜。是時公督數邊兵，威鎮東南，介冑 6. 之士，膝語蛇行 7.，不敢舉頭。而文長以部下一諸生傲之，議者方之劉真長、杜少陵云。會得 7.
    白鹿，屬文長作表，表上，永陵喜。公以益奇之，一切疏計，皆出其手。文長自負才略，好奇計，談兵多中，視一世事無可當意者，然竟不遇。（明‧袁宏道）


    注釋：1. 藉甚：很盛；2. 國士：國家人才；3. 奇：音ㄐㄧ，命運不佳；4. 客：聘請；5. 葛衣烏巾：平民服飾；6. 介冑：戰士；7. 膝語蛇行：跪著說話，伏地而行，比喻敬畏佩服；8.
    會得：捕獲。'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
