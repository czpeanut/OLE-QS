  type: single
  page: 1
  stem: 下列各選項「　」中的詞語，何組意思兩兩相同？
  options:
  - label: A
    content: 晝夜不飛去，「經年」守故林／「經年」累月的操勞，終於讓人吃不消。
  - label: B
    content: 妹妹在「手腕」上帶起新買的串珠鍊子，十分開心／因為他的「手腕」高明，許多人事問題迎刃而解。
  - label: C
    content: 遭閃電與霹靂「左右」夾擊／做人如果沒有原則，就容易被人「左右」。
  - label: D
    content: 媽媽的新髮型，令人「耳目」一新／首領的「耳目」眾多，幫忙蒐集消息。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
