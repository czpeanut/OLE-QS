- id: doc_113_基隆_銘傳_國文_g8s1e1_s5_1
  section: 5
  number: 1
  type: essay
  page: 7
  stem: '測驗說明：

    　　這是本校國文科段考作文測驗題目卷，僅有一題，提供寫作稿紙一張，共2頁。測驗時間從15:10至15:55，共45分鐘。作答時間開始與結束以學校鐘聲為主（或依監考老師現場指示），作答時請從第1頁右邊第1行開始作答。


    題目：自訂某個生活經驗為題目，例如：「一場西北雨」（請自訂題目並寫在稿紙第一行）


    引導語：

    　　在「田園之秋選」一文中，作者陳冠學以西北雨的過程為例，運用「以事喻事」的寫作技巧，將大自然比喻成一場戲劇。下雨前的鳥雲與雷電是這場大戲的序幕，傾盆大雨是這齣戲最精彩的高潮，最後雨過天青則再度回歸寧靜，使作者彷彿聆聽貝多芬田園交響曲第四樂章。

    　　你／妳的生活中是否有某個經驗，使你／妳覺得像「田園之秋選」一樣，用另外一件截然不同的事情來比喻？例如：「升學就像一場馬拉松」，將升學的開始比喻成起跑槍聲，升學的過程如同跑步考驗我們的耐力與毅力，通過教育會考就如同衝刺終點線，征服升學這件事的考驗。

    　　其實只要用心感受生活，許多習以為常的生活經驗用不同的事情來比喻之後，會使原本平淡無奇的過程變得興味盎然，出現更多驚喜。現在就請你／妳挑選一個生活經驗，詳細說明開始、過程、結果，並依據這個生活事件的特性找一個適當的例子來加以比喻。


    測驗注意事項：

