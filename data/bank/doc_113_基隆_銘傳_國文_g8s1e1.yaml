  type: single
  page: 1
  stem: 下列選項中的注音寫成國字後，何組字形完全相同？
  options:
  - label: A
    content: 瓜熟「ㄉㄧˋ」落／取「ㄉㄧˋ」違規／專注「ㄉㄧˋ」聽。
  - label: B
    content: 食物發「ㄇㄟˊ」／有夠倒「ㄇㄟˊ」／不勝「ㄇㄟˊ」舉。
  - label: C
    content: 「ㄐㄧㄝˋ」哉嗚呼／目不暇「ㄐㄧㄝˋ」／昭然若「ㄐㄧㄝˋ」。
  - label: D
    content: 烏雲「ㄉㄨㄛˋ」罩／「ㄉㄨㄛˋ」鳥檻猿／猛獸出「ㄉㄨㄛˋ」。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
