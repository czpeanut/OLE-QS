- id: doc_113_基隆_銘傳_國文_g8s1e1_s4_26
  section: 4
  number: 26
  type: single
  page: 4
  stem: 根據上文對於「數位足跡」的說明，以下何者正確？
  options:
  - label: A
    content: 提供教育機構作為學生是否出現憂鬱傾向的參考資料。
  - label: B
    content: 分析「數位足跡」可以知道學生較喜歡使用哪一種社群媒體。
  - label: C
    content: 證明貼文數與按讚數是造成學生出現憂鬱傾向的主要原因。
  - label: D
    content: 線上行為只要加以控制不會影響使用者的個性。
  group_stem: '甲. 社群媒體上憂鬱與孤獨的痕跡

    　　來自韓國的人際互動研究團隊觀察到我們在社群媒體上留下的「數位足跡」，也許可以成為一個幫助學校早期發現憂鬱傾向的學生並且積極介入提供幫助的管道。當人感到憂鬱的時候並不一定會察覺到自己的憂鬱狀態，因此很容易錯過獲得幫助的時機。如果社群媒體的數位足跡能夠讓我們發現有憂鬱傾向的人具有的特別活動模式，就能夠提供社會支持給正感到憂鬱或孤獨的人們。

    　　為了瞭解人們的憂鬱與孤獨是否能從社群媒體的活動推斷出來，研究者們邀請了234位大學生使用他們開發的臉書應用程式，並且在APP中讓他們填寫憂鬱症量表。在徵求他們同意後，有124位參與者同意讓研究者們搜集並分析他們在參與這個研究開始前半年所有臉書上的數位足跡，包含他們按讚的行為、貼文底下的留言、動態貼文。接著研究者根據憂鬱症量表的得分把這些參與者分為沒有憂鬱傾向組（80%）以及憂鬱傾向組（20%）。

    　　分析這群實驗參與者的朋友圈人數與他們憂鬱量表分數的關係，相關分析結果發現憂鬱傾向越高的人，朋友圈的人數也相對較少；進一步分析參與者們按讚或留言的行為，發現憂鬱傾向組別的人在每篇貼文中接受到的按讚數比非憂鬱組別來得少，不過憂鬱組別的人在朋友圈裡主動留言的頻率跟非憂鬱組差不多，然而不同的地方在於，當研究者進一步分析主動互動（按朋友讚、主動留言）與被動接受（收到讚與留言）的比例之後，發現憂鬱傾向組別的人主動給出的按讚數與留言數比自己接收到的來得多。

    　　另一方面，研究者們也意外發現相較於非憂鬱組別，憂鬱組別的人發佈的貼文比較多，而且原先研究者們預期會看到憂鬱組別會頻繁在深夜發布貼文，然而讓人意外的是，憂鬱組發布貼文的時間多在白天（中午12點左右與下午六點左右）。後續針對憂鬱組的訪談發現兩個可能的原因來解釋這個現象，一個是憂鬱的人們沒有足夠的精力與其他人進行面對面的社交互動，所以轉為線上社交；另一個原因則是憂鬱的人們缺乏足夠的社會支持，所以取而代之的是透過線上跟別人的互動來彌補自己感到的孤獨。

    　　這個研究透過人們在社群媒體上跟朋友圈互動所留下的數位足跡來發現憂鬱與孤獨的痕跡，當然憂鬱狀態所展現出來的行為有千百種，這裏只是初步給出了幾個明顯的觀察，每天發文或臉書朋友不多也並不表示自己一定是憂鬱或孤獨，但是在知道這個研究發現後，我們就多了一個線索可以去觀察了解自己的線上行為。（楊期蘭）'
