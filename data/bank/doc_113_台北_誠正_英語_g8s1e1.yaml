  group_stem: "Moon Festival is a big holiday in many Asian countries. It \ntakes\
    \ place in the middle of autumn. That’s why it’s also called \nMid-Autumn Festival.\
    \ During Moon Festival, people gather \nwith their family and friends. They enjoy\
    \ good food, eat \nmooncakes, and look at the full moon. However, in Cambodia,\
    \ \npeople do things in a little different way. There, Moon Festival \nis in November.\
    \ It takes place over three days, and there is a big \nboat race in the first\
    \ two days. In South Korea, Moon Festival \nis like Thanksgiving. People wear\
    \ traditional clothes and go \nback home. They have a special service with their\
    \ family. It’s \nfor their ancestors."
