  stem: "44. On which website(網站) do you most likely(最可能) see the  \n   reading?"
  options:
  - label: A
    content: "Things about camping/ Camping Tips \nHow do you build a fire? How do\
      \ you cook your meals? \nLet's learn about it."
  - label: B
    content: "Birds, Trails, and Mountains/ Music Box \nGrace Chen's new music, Birds,\
      \ Trails, and Mountains will \nbe out tomorrow. Go and get it."
  - label: C
    content: "Nature Trails Guide/ Camp Southend \nWant to find great trails to walk\
      \ in nature? Want to see the \nbeautiful birds? Camp Southend will be the best\
      \ for you."
  - label: D
    content: "Southend City Zoo/ Animal Lovers \nMeet wonderful animals and take cool\
      \ pictures of them. \nPlan your next trip to make animal friends here."
  group_stem: "CAMP SOUTHEND is a fun place for nature lovers to visit! \nThe camp\
    \ has a long 120-km trail. Along the trail, you can walk \nby pretty lakes, cross\
    \ rivers, and go through hills and mountains. \nIt’s a great spot to see birds,\
    \ and you can also visit the Southend \nMuseum and two cool castles, Edward Castle\
    \ and Sloan Castle. \nIt’s a good idea to walk just one part of the trail each\
    \ day. You \nshould start early in the morning because each part takes about \n\
    seven hours to finish. If you don’t like walking, you can ride a \nbike, but on\
    \ the main trail because the smaller trails are not wide \nenough for bikes. \n\
    At Camp Southend, there are two ways you can stay at night. \nIn summer, many\
    \ people like to camp here. But if you don’t \nwant to camp, there are also hotels\
    \ in towns near Camp \nSouthend. Some of them have yummy breakfast, too! \ntrail\
    \ 步道smaller 較小的"
