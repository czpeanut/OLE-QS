  group_stem: "Tom: I really don’t like having a cold. What do you think is the \n\
    worst part? \nAmy: For me, it’s the headache. When my head hurts, I can’t \nthink\
    \ or do anything. \nTom: Really? I think a sore throat is terrible. Every time\
    \ I drink, \nit feels like someone cut my throat.  \nAmy: But with a headache,\
    \ you can’t do anything! Even \nwatching TV or surfing the Internet is hard. \n\
    Tom: That’s true, but with a sore throat, it still hurts even after I \ntake medicine.\
    \ \nAmy: Hmm, that’s bad, but with a headache, it feels like your \nwhole head\
    \ is pounding or someone keeps hitting your head. It \njust won’t stop and you\
    \ can’t do anything! \nTom: You know, I agree with you now. A headache makes \n\
    everything hard to do. At least with a sore throat, you can still \nthink. Headaches\
    \ are the worst! \n worst 最糟糕的At least 至少"
