  stem: "43. What can you infer(推測) about Saint-Saëns according to the \nreading?"
  options:
  - label: A
    content: He only wanted to write serious music.
  - label: B
    content: He didn’t care what people thought of him.
  - label: C
    content: He was afraid of playing music in front of people.
  - label: D
    content: "He liked to have fun, but was also worried about how    \n   others\
      \ saw him."
  group_stem: "You may know the famous music piece Le Carnaval des \nAnimaux (The\
    \ Carnival of the Animals) by Saint-Saëns, but do \nyou know the stories behind\
    \ it? \nOne story is that Saint-Saëns wrote it as a joke. He loved \nmaking funny\
    \ music for his friends. He wrote Le Carnaval des \nAnimaux to make them laugh\
    \ by using different animals as \nmusic characters. You can hear a lion, a turtle,\
    \ elephants, and \neven a kangaroo! His friends enjoyed the piece so much, but\
    \ \nSaint-Saëns decided not to share it with the public. \nAnother story is that\
    \ Saint-Saëns was worried people might \nnot see him as a serious music writer\
    \ if they heard Le Carnaval \ndes Animaux. He was famous for writing more serious\
    \ pieces, so \nhe kept Le Carnaval des Animaux a secret for a long time. \nPeople\
    \ didn’t know the piece for many years after he wrote it. \nThe public could not\
    \ hear this fun music until after Saint-Saëns \ndied in 1921. Now, Le Carnaval\
    \ des Animaux becomes one of \nSaint-Saëns’ most famous works. \nThere’s one thing\
    \ we do know: Le Carnaval des Animaux \nmakes people at all ages smile. \npiece\
    \ 作品  character 角色  public 大眾"
