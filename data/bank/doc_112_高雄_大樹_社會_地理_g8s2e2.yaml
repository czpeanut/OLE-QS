  stem: 「阿拉伯之春是指從西元2010 年底，在西亞與北非發生一系列以『民主』和『經濟』為議題的社會運動，這些運動多採取公開示威遊行和網路串連的方式，其影響之深、範圍之廣，吸引了全世界的高度關注。這場運動以北非國家突尼西亞的政權被民眾抗議推翻為肇始，長期執政數十年之久的政權接二連三的倒臺。」依據上文敘述，下列何者跟阿拉伯之春關係最大？
