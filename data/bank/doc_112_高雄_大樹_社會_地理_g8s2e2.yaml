  section: 2
  number: 35
  type: single
  page: 4
  stem: 阿卡德帝國是美索不達米亞平原地區的第一個古代帝國，其建立了中央政府與官僚系統，統治範圍廣達現今伊拉克、敘利亞，以及一部分的伊朗及土耳其中部等地；然而這持續了兩百多年的帝國，卻在西元前二十二世紀滅亡。根據科學家研究，此帝國的滅亡可能跟當地某種天氣災害息息相關。西亞地區常有強烈的西北風，當地稱之為「夏馬風」，當強勁的「夏馬風」颳起時，加上當地乾燥的環境，很容易引發此種天氣災害發生，導致農地無法種植作物，進而引發饑荒、大規模的社會動盪等；加上外敵的侵略，造成帝國頹微消亡。請問：上述中所提及的某種天氣災害，最可能是下列何者？
