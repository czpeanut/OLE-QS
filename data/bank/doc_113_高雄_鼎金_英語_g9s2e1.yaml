    .  However , typhoons brought much rain for Taiwan in October last year. Though
    people prepared for the typhoons, it was not enough because most of them didn’t
    understand how serious the typhoons were. Thousands of farmers couldn’t grow rice
    well because there was too much rain. The heavy rain also brought landslides in
    several mountains, which made drivers unable to drive home safely.

    It is not possible for us to change the climate, but we can cut down on carbon
    emissions as soon as possible to make the climate go from bad to worse more slowly
    . About 40% of the carbon emissions in Taiwan come from factories, but more than
    half of the enterprises don’t have any future plans for cutting down on carbon
    emissions because they don’t know how to start it.

