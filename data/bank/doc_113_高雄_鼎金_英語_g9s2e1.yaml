  section: 4
  number: 48
  type: single
  page: 4
  stem: 48.What will happen if there is a landslide?
  options:
  - label: A
    content: It will be dangerous to walk in the mountains.
  - label: B
    content: Cutting down on carbon emissions will be much easier.
  - label: C
    content: Driving home will be safe and quick.
  - label: D
    content: Shipping products will save more money.
  group_stem: 'E.

    The climate of Taiwan has been strange for the past twenty years. In the past,
    typhoons usually came close to Taiwan and brought much rain in July and August
    .  However , typhoons brought much rain for Taiwan in October last year. Though
    people prepared for the typhoons, it was not enough because most of them didn’t
    understand how serious the typhoons were. Thousands of farmers couldn’t grow rice
    well because there was too much rain. The heavy rain also brought landslides in
    several mountains, which made drivers unable to drive home safely.

    It is not possible for us to change the climate, but we can cut down on carbon
    emissions as soon as possible to make the climate go from bad to worse more slowly
    . About 40% of the carbon emissions in Taiwan come from factories, but more than
    half of the enterprises don’t have any future plans for cutting down on carbon
    emissions because they don’t know how to start it.

    In fact, cutting down on carbon emissions is not as difficult as it sounds. Several
    enterprises in the US have started shipping products by train, which cuts down
    on more carbon emissions than shipping by truck. Though it may make their products
    more expensive, a lot of people in the US still enjoy buying these Earth-friendly
    products. To reduce carbon emissions successfully, more people should know how
    important cutting down on carbon emissions is.

    📖enterprise 企業 climate 氣候 carbon emission 碳排放 ship 運送 product 產品'
