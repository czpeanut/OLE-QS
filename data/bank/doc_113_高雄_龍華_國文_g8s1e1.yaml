  section: 3
  number: 6
  type: single
  page: 1
  stem: 陳冠學以貝多芬 田園交響曲的牧羊人之歌表達雨過天青的視覺印象，這種「以聽覺表現視覺」的寫作手法與下列哪一選項相同？
  options:
  - label: A
    content: 香菸攤老李的二胡，把我們家的巷子，拉成一綹長長的濕髮
  - label: B
    content: 山寺剛做完一場荒涼的夢，晨鐘便以潑墨的方式一路灑了過去
  - label: C
    content: 飽滿得不能再飽滿的晴天，敲上去會敲出音樂來的稀金屬的晴天
  - label: D
