- id: doc_113_高雄_龍華_國文_g8s1e1_s4_28
  section: 4
  number: 28
  type: single
  page: 6
  stem: 「快樂啊憂傷啊，是我的擔子我都想承受。」作者引用了席慕蓉的詩句，是因為他有什麼樣的領悟？
  options:
  - label: A
    content: 男兒有淚不輕彈，有艱苦也要往肚裡吞
  - label: B
    content: 以天下興亡為己任，置個人生死於度外
  - label: C
    content: 無論是悲或喜，敞開胸懷接納生命境遇
  - label: D
    content: 認為萬事皆空，任他風浪起都與己無關
  group_stem: "這幾天接連著夢到學生時代的生活，回顧當年，最難忘為何？該是追憶起曾有那麼一張年輕氣盛的臉，未經風霜的心，一如現在回首荒唐的學生生涯一般，又是自傲，又是心疼吧……\n\
    \    古人有云：「去國十年，老盡少年心。」有時候真的會猜想，若再回到校園，會是哪種心境？\n曾刻過一個印章，一面是「人不痴狂枉少年」，另一面是「晝短苦夜長，何不秉燭遊」，這是對年少的一種嚮往吧！的確，家庭、子女、事業、種種責任感、忙碌不堪的生活，把我們綑得動彈不得，唯有看到老朋友，看到意氣風發的學弟，一如當年的我們，才會勾起幾許唏噓。\n\
    \    記得讀大學當時剛出版的席慕容的《七星香》（一九八三年左右吧），其中的一首〈塵緣〉寫著：\n    這人世的一切我都希求 / 快樂啊憂傷啊 / 是我的擔子我都想承受\
    \ / 明知道總有一日/所有的悲歡都將離我而去/我仍然竭力的搜集/搜集那些美麗的糾纏著的/值得為她活了一次的記憶\n    我是個貪心的人，「這人世的一切我都希求」，好多好多東西都想接觸，都想學，都想看。\n\
    到書店轉一圈，除了覺得自己的渺小與對浩瀚知識的悵然，看到許多自己在不同階段所醉心的範疇：自然科學、社會科學、歷史文化、教育、哲學、文學……各類熟悉的書籍，曾經是那麼狂熱過，其中有許多還是很想進一步研讀，但是，可能嗎？\n\
    \    我也是個感恩的人。「快樂啊憂傷啊，是我的擔子我都想承受」，曾經在我生命的歷程中，留下痕跡的事事物物、點點滴滴，不管好的、壞的，愉快的、痛苦的，我都充滿了感激。因為珍惜，因為我知道，任何境遇，這都將是我一生中僅有的一次，僅有的一件。\n\
    \    因此，很難忘記，高中時在元旦的小隊露營，半夜下大雨，水將帳篷「漂」起來；也忘不了，大學時在寒冷的冬天半夜二、三點，才穿著實驗衣從大體解剖室摸回宿舍；甚至在馬祖全副武裝跑五千公尺的肉體痛苦都成為甘美的回憶；偶爾，小學時和同學一起做功課、畫壁報的情景也會浮現腦海。\n\
    \    回想年輕時代，最可貴、最溫馨的，就是那些仍記得的往事，而往事，總是與當時在一起瘋狂，一起做事，一起笑鬧的朋友糾纏在一起。因此，所謂回憶，大概就是一個又一個的朋友留下的聲形影貌。\n\
    \    現在想起十年、二十年前，那時當然是年輕，但是十年、二十年後回顧今天，今天又何嘗不是年輕？因此，應該把這句話擺在案頭，隨時提醒自己：\n    當你走過，\n\
    \    請展露你最多的笑容，\n    因為你只能走過一次。\n    日本作家大江健三郎在他的書裡這麼寫著：「現在已經到了老人年紀的我，再回到故鄉的森林裡，如果遇到是小孩子的我，該說些什麼話才好呢？」他這麼告訴年輕的自己：「你長大之後，也要繼續保持現在心中的想法唷！只要用功念書，累積經驗，把它伸展下去。現在的你，便會在你長大之後的身體裡活下去。而你背後的過去的人們，和在你前方的未來人們，也都會緊密連結著。」\n\
    \    親愛的朋友，若是你真的遇到了年輕的你，你會跟他說什麼呢？\n                                          \
    \                    (李偉文〈再一次，遇見年輕的自己〉)"
