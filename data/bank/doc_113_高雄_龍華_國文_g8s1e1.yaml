- id: doc_113_高雄_龍華_國文_g8s1e1_s4_34
  section: 4
  number: 34
  type: single
  page: 8
  stem: 依據本文，琦君的母親製作許多粽子送給乞丐，下列選項何者可用來形容她的作為？
  options:
  - label: A
    content: 大智若愚，深藏不露
  - label: B
    content: 溫文儒雅，能柔能剛
  - label: C
    content: 沽名釣譽，好大喜功
  - label: D
    content: 古道熱腸，扶危濟困
  group_stem: "端陽是個大節，也是母親大忙特忙、大顯身手的好時光。想起她靈活的雙手，裹著四角玲瓏的粽子，就好像馬上聞到那股子粽香了。母親的粽子，種類很多，蓮子紅棗粽只包少許幾個，是專為供佛的素粽。葷的豆沙粽、猪肉粽、火腿粽可以供祖先，供過以後稱之謂「子孫粽」。吃了將會保佑後代兒孫綿延。包得最多的是紅豆粽、白米粽和灰湯粽。一家人享受以外，還要布施乞丐。母親總是為乞丐大量的準備一些，美其名曰「富貴粽」。\n\
    \    我最最喜歡吃的是灰湯粽。那是用旱稻草燒成灰，鋪在白布上，拿開水一衝。滴下的熱湯呈深褐色，內含大量的鹼。把包好的白米粽浸泡灰湯中一段時間（大約一夜晚吧），提出來煮熟，就是淺咖啡色帶鹼味的灰湯粽。那股子特別的清香，是其他粽子所不及的。我一口氣可以吃兩個，因為灰湯粽不但不礙胃，反而有幫助消化之功。過節時若吃得過飽，母親就用灰湯粽焙成灰，叫我用開水送服，胃就舒服了。完全是自然食物的自然治療法。母親常說我是從灰湯粽里長大的。幾十年來，一想起灰湯粽的香味，就神往同年與故鄉的快樂時光。但在今天到哪裡去找旱稻草燒出灰來沖灰湯呢？\n\
    \    端午節那天，乞丐一早就來討粽子。乞丐常常高聲地喊：「太太，高升點（意謂多給點）。保佑你大富大貴啊！」母親總是從廚房裡出來，連聲說：「大家有福，大家有福。」乞丐去後，我問母親：「他們討飯吃，有什麼福呢？」母親正色道：「不要這樣講。誰能保證一生一世享福？誰又能保證下一世有福還是沒福？福要靠自己修的。時時刻刻要存好心，要惜福最要緊。他們做乞丐的，並不是一個個都是好吃懶做的，有的是一時做錯了事，敗了家業。有的是上一代沒積福，害了他們。」母親的話，在我心頭重重地敲了一下。\n\
    \    每年的端午節來臨時，我很少吃粽子，更無從吃到清香的灰湯粽。母親細嫩的手藝，和瑣瑣屑屑的事，都只能在不盡的懷念中追尋了。\n(節錄自琦君〈粽子裡的鄉愁〉)"
