  stem: 有人假託愛因斯坦說：「如果蜜蜂從地球上消失，人類只能再活四年」，依據上文，此說成立的原因為何？
  options:
  - label: A
    content: 蜜蜂能為人類撲殺致命的害蟲
  - label: B
    content: 蜂蜜提供人類防治病菌的物質
  - label: C
    content: 蜂蜜提供人類不可或缺的營養素
  - label: D
    content: 蜜蜂能使人類食物供應鏈不致中斷
  group_stem: "一個早晨，紐森走到果園，打開第一個蜂箱，很納悶為什麼只有一些蜜蜂在家；再打開下一個，一隻蜜蜂也沒有。他養蜂二十五年，從沒發生過這種事──難道蜜蜂全體動員採蜜去了？半路什麼事耽擱了？還是迷路了回不來？\n\
    \    紐森的遭遇並非特例。美國境內 2007 年約有八十萬個、2008 年則有約一百萬個蜂群神秘失蹤；而且不只在美國，南美、歐洲、亞洲都有大群蜜蜂消失不見。\n\
    \    這現象被名為「蜂群衰竭失調症」，它的起因，有研究指向是某種農藥損害了蜜蜂的記憶和溝通能力；也有昆蟲學家認為，可能是一種突變後的病毒使蜜蜂的免疫系統崩潰；還有學者懷疑蜂農管理不善、蜂群奔波過勞才是元兇。除上述較可信的解釋之外，手機電磁波干擾蜜蜂的導航系統、恐怖組織想要摧毀美國農業等，也都是曾出現的離奇之說。\n\
    \    如果世界再也沒有蜜蜂，多數人的第一個反應可能是：「真可惜！土司沒有蜂蜜可塗了」、「真好！少了一種會叮我的蟲子」。然而，沒有蜜蜂為牛和猪吃的農作物授粉，餐桌上將沒有牛排、培根、乳酪、牛奶；早餐只有一成不變的清粥白飯、麥片，沒有新鮮果汁，也沒有豆漿；超市裡的蔬菜只剩下幾種，海鮮應該還在，但由於蛋白質來源剩沒幾種，水裡可吃的恐怕被劫掠一空。此外，我們可能也得改變穿著的選擇，因為棉花產量大減，棉製衣服將貴得不像話。\n\
    \                                     (改寫自Alison Benjamin、Brian McCallum《蜜蜂消失後的世界》)"
