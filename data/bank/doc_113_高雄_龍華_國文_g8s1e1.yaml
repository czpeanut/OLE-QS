  group_stem: "田家少閒月，五月人倍忙。夜來南風起，小麥覆隴黃。婦姑荷簞食，童稚攜壺漿，相隨餉田① 去，丁壯在南岡。足蒸暑土氣，背灼炎天光，力盡不知熱，但惜夏日長。復有貧婦人，抱子在其旁，右手秉遺穗②\
    \ ，左臂懸敝筐。聽其相顧言，聞者為悲傷。家田輸稅盡，拾此充飢腸。今我何功德？曾不事農桑。吏祿三百石，歲晏③ 有餘糧，念此私自愧，盡日不能忘。\n補充注釋：①\
    \ 餉田：給在田裡勞動的人送飯。② 遺穗：指收穫農作物後遺落在田的麥穗。③ 歲晏：一年將盡的時候。\n           ④ 刈：割。\n       \
    \                                                             (節錄自白居易《觀刈④ 麥》)"
