questions:
- id: doc_113_台南_復興_社會_公民_g7s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 文聖公園裡，一群國中生正在討論原住民族部落的意義，下列何人的認知較為正確？
  options:
  - label: A
    content: 影山：部落的領袖及領導組織是由政府單位指派
  - label: B
    content: 翔陽：一個部落通常由多個原住民族共同組成
  - label: C
    content: 潔子：成員彼此間的權利義務關係由法律規定
  - label: D
    content: 黑尾：部落是依其傳統規範、共同生活結合而成的團體。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_台南_復興_社會_公民_g7s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 開班會時，楊康威脅楊過一定要針對自己的提議附議，否則就要修理楊過，楊過由於無法認同楊康的提議，便未加以理會，楊康的提議因而未能成立。楊康憤而當場對楊過拳打腳踢，頓時場面混亂，此時，有同學提出動議，請主席處理。針對上述內容，下列說明何者正確？
  options:
  - label: A
    content: 同學針對班上騷動提出的動議，應該是權宜問題
  - label: B
    content: 即使楊過附議，楊康提案未經兩人以上附議仍不成立
  - label: C
    content: 針對楊康的肢體威脅，楊過可以透過「學生申訴評議委員會」解決
  - label: D
    content: 楊康威脅楊過的行為，主要侵害楊過的受教育權。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_台南_復興_社會_公民_g7s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 學生自治讓學生有機會學習處理公共事務，其先決條件是要遵守政府法令及學校規定。請問：學生自治實施的第一步，應為下列何者？
  options:
  - label: A
    content: 發現共同問題
  - label: B
    content: 成立自治組織
  - label: C
    content: 訂定自治活動
  - label: D
    content: 導師制定自治規範。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_台南_復興_社會_公民_g7s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 要開班會了，小丸子是這一次的主席，但小丸子不是很了解開會的流程，請告訴小丸子下列開會的流程，何者是正確的？ (甲)臨時動議 (乙)散會 (丙)宣布開會(丁)討論事項
    (戊)報告事項
  options:
  - label: A
    content: 丙戊丁甲乙
  - label: B
    content: 丙戊甲丁乙
  - label: C
    content: 丙丁戊甲乙
  - label: D
    content: 丙甲丁戊乙。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_台南_復興_社會_公民_g7s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 因時代變遷，許多原住民族部落的年輕人外流，使得原住民文化面臨傳承的困境。由上述可知，原住民族委員會的政策應注重下列何者？
  options:
  - label: A
    content: 鼓勵原住民族認同漢人社會文化
  - label: B
    content: 致力於讓全體國民認同原住民族的文化
  - label: C
    content: 喚醒原住民族對自身文化的關注
  - label: D
    content: 推動傳統文化改革以順應社會變遷。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_台南_復興_社會_公民_g7s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 小虹資訊課上課後，忘了登出帳號，被下一節上課的小綠盜用帳號，冒名發「000是笨蛋」攻擊文，小綠又將攻擊文大肆渲染、告訴其他同學，小虹遭到辱罵、排擠，身心受創。請問：小綠盜用小虹帳號發攻擊文的行為，已經使得小虹哪些方面的權利受到嚴重侵犯？
    (甲)身體方面 (乙)財產方面 (丙)學習方面 (丁)名譽隱私方面
  options:
  - label: A
    content: 甲乙丙丁
  - label: B
    content: 甲乙丙
  - label: C
    content: 丙丁
  - label: D
    content: 甲丁。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_台南_復興_社會_公民_g7s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 羅賓今年剛進入國中就讀，看到國中課表中安排了一節「班會」。請問：關於「班會」的功用，下列敘述哪些正確？(甲)可以決定校園中所有的事務，保障學生權利
    (乙)可以養成理性溝通與協調的能力 (丙)可以學習民主議事的程序 (丁)可以管理關於學生的任何公共事務。
  options:
  - label: A
    content: 甲乙丙丁
  - label: B
    content: 甲乙丙
  - label: C
    content: 乙丙
  - label: D
    content: 乙丁。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_台南_復興_社會_公民_g7s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 屏東縣政府原住民處處長表示，有些部落工藝家及創作者對於計畫撰寫及產品行銷較不熟悉，創作及發展停滯，地方創生人才培育出來的部落經紀人專業訓練已完成，日後可讓這群經紀人結合原鄉工藝家及創作者開發產品與銷售並爭取更大的產值，以達部落地方創生目標，也讓返鄉創業青年，多一種選擇。從上文可看出該地區的原住民族目前面臨何種困境？
  options:
  - label: A
    content: 部落的自治基礎改變，由長老會議轉變為部落會議
  - label: B
    content: 原住民離開故鄉尋找工作，造成傳統文化消失
  - label: C
    content: 部落的經濟發展停滯，需要專人協助
  - label: D
    content: 原住民的祖靈信仰消失，全面信奉基督教及天主教。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_台南_復興_社會_公民_g7s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 媒體報導：南部某醫學大學附設醫院遠距健康照護中心蕭姓主任遭到女研究生指控性騷擾。此醫學大學回應表示，第一時間啟動調查停聘當事人，調查也認定其行為構成性騷擾，學校對於性別平等與學生安全問題高度重視，並始終秉持「零容忍」態度處理。根據以上報導，下列敘述何者？
  options:
  - label: A
    content: 蕭姓主任嚴重侵犯女研究生的受教育權
  - label: B
    content: 女研究生的身體自主權受到侵害
  - label: C
    content: 蕭姓主任的行為侵害女研究生的學習權
  - label: D
    content: 該案應是由校長做出申評決定書。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_台南_復興_社會_公民_g7s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 在美國、日本、中國行之有年的林下經濟概念，利用林地內的生態和環境特性，在林蔭下種植耐陰性的森林副產物，例如藥材、食用菇類、水果、堅果等高價值經濟作物，建立一種混農林業的經營型態。如此一來，可以在不砍伐樹木的情況下增加林農的短期經濟收入，透過當地特殊的地理、氣候條件發展出具有地區特色產物。請問：原住民可以利用林下經濟的方法解決下列哪一項問題？
  options:
  - label: A
    content: 傳統領域的爭議
  - label: B
    content: 傳統文化的斷層
  - label: C
    content: 部落經濟的停滯
  - label: D
    content: 文化與法律的衝突。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_台南_復興_社會_公民_g7s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 由於食安爭議日益受到重視，復興國中一年38班學生決定班會討論事項是班長在開會前進行的提案--「如何確保合作社食品的安全」。本週一年38班開班會時，在主席及班級幹部進行工作報告時發生一件小插曲，娜美舉手發言要求進入臨時動議，討論班服顏色議題，後經主席裁決處理完畢。接下來的開會，老師適時提醒主席會議規則，例如：議題在表決之前必須先進行討論，表決順序也應依照規定，最終在臨時動議提出班服顏色議題，表決結果班服選擇黃色，這次會議順利結束。請問：上文中該討論事項的提案流程，應為下列何者？
  options:
  - label: A
    content: 以口頭提出「動議」，經老師「附署」後成立
  - label: B
    content: 以口頭提出，並經過一位以上出席人「附議」
  - label: C
    content: 以書面呈現，開會時依「多數決」通過後成立
  - label: D
    content: 以書面呈現，並經過一位以上出席人「附署」。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_台南_復興_社會_公民_g7s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 根據第11題題目敘述，開會時發生的小插曲，主席裁決處理的方式應與下列何種狀況相同？
  options:
  - label: A
    content: 提議班服顏色時，同學發生衝突
  - label: B
    content: 議題未經討論，主席即宣布進行表決
  - label: C
    content: 會議進行到一半，突然發生地震
  - label: D
    content: 小新不滿意表決結果，大聲叫嚷抗議。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_台南_復興_社會_公民_g7s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 社區屬於公共生活的領域，是居民生活、工作和休閒息息相關的地方。下列對於社區的相關敘述，哪一項正確？
  options:
  - label: A
    content: 社區是基於共同需求或關係而建立起來
  - label: B
    content: 社區屬於法定組織，必須依法登記
  - label: C
    content: 居民因職業相同，而產生對社區的認同感
  - label: D
    content: 社區是居民彼此接觸而形成的政治組織。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_台南_復興_社會_公民_g7s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 幸福小鎮鎮長在觀察小鎮周遭的環境之後表示：「我們小鎮位置靠近市中心，周邊缺少公園綠地。假如可以活化鎮內已廢校的某私立科技大學，變成大家的文化中心或休閒場所，則附近居民就可以藉由使用學校的資源，進一步提升生活品質。」在鎮長與熱心居民協力下，在此科技大學內開辦各種學習成長活動，而鎮上民眾參與度也都很高。請問：文中提到將已廢校的某私立科技大學變成民眾的文化中心或休閒場所，象徵下列何種哪種意義？
  options:
  - label: A
    content: 推行國家的教育政策
  - label: B
    content: 促進社區產業發展
  - label: C
    content: 學校空間與社區結合
  - label: D
    content: 推動社區環境的改造。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_台南_復興_社會_公民_g7s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 以前，學校老師可能會以學生或是校園安全等理由，不定期搜查學生的身體或個人物品，此舉也曾引發許多爭議。教育部為了維護學生在校園的基本權利，因此修改相關法規，校方除非是有相當理由或足夠的證據，認定有特定學生攜帶違禁物品，否則就不能搜查該學生的身體或個人物品。如果校方一定要搜查，則必須全程錄影，在宿舍或者是對特定學生進行檢查的時候，也必須要有學生或家長等代表陪同。依據上述內容判斷，以前學校老師不定期搜查學生個人物品的行為，最可能侵犯到學生在校園中什麼方面的權利？
  options:
  - label: A
    content: 學習方面
  - label: B
    content: 身體方面
  - label: C
    content: 平等方面
  - label: D
    content: 隱私方面。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_台南_復興_社會_公民_g7s1e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 復興國中50周年校慶活動，一年38班開班會討論事項的主題是選出校慶園遊會販賣的物品項目。請問：下列關於開會過程的敘述，哪一項正確？
  options:
  - label: A
    content: 司儀宣布班會開始
  - label: B
    content: 主席以先提議先表決的方式，請同學們表決校慶園遊會販賣的物品項目
  - label: C
    content: 導師主持會議，賦予參加學生發言地位
  - label: D
    content: 小明擔任紀錄，說明會議名稱和開會目的。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_台南_復興_社會_公民_g7s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 學生自治可以培養學生參與管理與學生有關的公共事務。下列哪一項屬於學生自治的範圍？
  options:
  - label: A
    content: 訂定班級生活公約
  - label: B
    content: 是否參加校外教學活動
  - label: C
    content: 聯絡簿是否請家長簽名
  - label: D
    content: 取消週三升旗活動。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_台南_復興_社會_公民_g7s1e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 一位原住民族人參與第28屆聯合國氣候變遷大會時指出，原住民族不僅擁有與大自然和諧共存的智慧，面對部落的公共事務，所有族人於當下進行溝通，商討如何解決，政府應向原住民學習，在制定攸關生態環境的氣候政策時，納入當地原住民族的聲音，不該因為族群身分而有差別待遇。根據上述內容判斷，該位原住民族人的訴求應與下列何者最為符合？
  options:
  - label: A
    content: 原住民族有特定的政治制度，應由部落領袖主導公共事務
  - label: B
    content: 政府應協助開發原住民族傳統領域，促進部落文化的傳承
  - label: C
    content: 原住民族應參與國際活動推動觀光，有助於振興部落經濟
  - label: D
    content: 政府推動政策應尊重原住民族的意見，並保障其基本權益。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_台南_復興_社會_公民_g7s1e3_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 身為社區一分子的國中生，可以透過擔任志工，清潔打掃或是關心社區中的老人來達成下列何者？
  options:
  - label: A
