  group_stem: '1855 年，美商威廉士洋行的商船航行至臺灣府安平外海，並派人上岸詢問是否能在當地貿易。經過安排，船長和臺灣道裕鐸在打狗會面，裕鐸在會談中告知船長，外國商船如果直接在安平停泊，並不符合規定，臺灣道將受到朝廷處罰，但裕鐸和打狗地方官員可以私下允許外國商船，停靠遠離政治核心的打狗進行貿易。然而，實際上官員後來往往放任外國商船停靠安平，未能嚴格執行禁令。

    過了數年，新任的臺灣道孔昭慈於1859 年，又要求外國商船「不准像之前一樣在安平附近起卸貨物」。有位英國商人分析：「這並非臺灣道刻意禁止外商在臺灣府貿易，而是因為府城當地泉州人組成的商人團體，跑去向福建巡撫告狀，指控外國商船收購物產，造成物價上漲，影響了本地商人的生意。」'
