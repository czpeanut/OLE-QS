  section: 1
  number: 16
  type: single
  page: 1
  stem: '新聞報導一起住宅火警，屋內鐵製品、銅製品等器皿、家飾皆燒光了，但從灰燼中找出了變形的金飾。好奇的子恒查詢了鐵、銅以及金的資料，並整理如附表，請問他應該如何解釋這個現象背後的科學原理呢？


    | 金屬 | 熔點 | 對氧活性 |

    | :--- | :--- | :--- |

    | 鐵 | 1535℃ | 大 |

    | 銅 | 1083℃ | 中 |

    | 金 | 1064℃ | 小 |'
  options:
  - label: A
    content: 金的熔點很高，用火加熱不會熔化
  - label: B
    content: 金加熱後，其表面生成緻密的氧化物，可防止內部的金氧化
  - label: C
    content: 溫度越高反應越快，金的熔點比較低，所以反應速率很慢
  - label: D
    content: 金的活性很小，加熱比較不會與氧反應。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 理化
      code: 2-1
