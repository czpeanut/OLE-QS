  stem: 小和很喜歡閱讀文學作品，她在圖書館翻到《金水嬸》的書目介紹寫著：「本書描述漁民生活的貧困、刻苦及堅韌的生命力，反映漁民的迷信、愚昧、無知、自私、無奈，刻劃教育界、知識份子或上階層人物的私慾、醜陋的行徑，表現了處於工商社會拜金主義下個人的感傷及人性的扭曲。王拓寫《金水嬸》，細譜臺灣鄉鎮母親永恆的形象，更為臺灣文學開拓一個新方向，肇生了鄉土文學運動，是寫實文學的一個新里程……」請問下列哪一事件與此書的創作年代相符？
