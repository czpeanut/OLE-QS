- id: doc_113_新北_福和_社會_歷史_g7s2e3_s1_18
  section: 1
  number: 18
  type: single
  page: 1
  stem: "小福做歷史報告時用手機查到一段歷史資料：（挑戰題）\n1949 年，中國共產黨取得大陸政權後，自1950 年後進入朝鮮投入韓戰，並以軍事及政經力量支援北越赤化越南。美國無法獨力遏止國際共產主義勢力蔓延亞洲，東南亞各國驚恐會發生像美國總統艾森豪所提出的「骨牌效應」那樣，即一個個變為共產國家。於是，美國出面說服英國和法國，號召與東南亞具有利害關係的「自由世界國家」，共同研議組織一個類似歐洲「北大西洋公約組織」的集體安全保障機關。……\n\
    在東南亞公約組織會議上，英國、法國、菲律賓和巴基斯坦等國都表示反對中華民國加入公約組織，美國國務卿杜勒斯只能放棄將中華民國編入條約適用範圍。1954 年9\
    \ 月8 日，《東南亞公約組織條約》簽訂。\n   請問這段資料最可能在談論哪一事件的時空背景？"
  options:
  - label: A
    content: 中華民國與美國建交
  - label: B
    content: 美國國會準備制定臺灣關係法
  - label: C
    content: 中美共同防禦條約的簽訂
  - label: D
    content: 美國提供對臺美援。
