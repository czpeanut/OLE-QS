  group_stem: '【題組一】

    中華民國總統府 民國113 年11 月29 日新聞稿

    感謝英國國會通過聯合國2758 號決議不涉台案 臺灣將繼續與國際民主社會站在一起 為全球民主與繁榮貢獻心力

    有關英國國會昨（28）日通過聯合國2758 號決議不涉台案，總統府發言人郭雅慧表示，誠摯感謝英國國會及英國政府對臺灣的支持，該案明確駁斥了中國曲解聯合國2758
    號決議文內涵，以及北京打壓臺灣國際空間的企圖。決議更強調臺灣作為國際社會一員，應該享有公平且有意義的參與機會，對此，我國政府表達感謝之意。

    郭雅慧表示，英國國會的這項決議，不僅彰顯國際社會對聯合國決議原意的正確認識，更展現支持臺灣民主價值與國際參與的堅定立場。臺灣願意與民主同盟國家站在一起，共同捍衛彼此共享的自由、民主與人權等核心價值。

    郭雅慧表示，日前澳洲、荷蘭、歐洲議會及加拿大等國會也都陸續通過相關決議案，表達各國對此議題的高度重視，也共同拒絕中國政府對臺灣地位的錯誤詮釋。臺灣政府與國人之表達誠摯感謝，我國也將繼續與國際民主社會站在一起，為全球民主與繁榮貢獻心力。'
