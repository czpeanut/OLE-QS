- id: doc_113_新北_福和_社會_歷史_g7s2e3_s2_33
  section: 2
  number: 33
  type: single
  page: 2
  stem: 根據上述採訪內容，請問李登輝所提出「特殊的國與國的關係」是屬於哪一種外交方式的核心精神？
  options:
  - label: A
    content: 務實外交
  - label: B
    content: 彈性外交
  - label: C
    content: 鞏固外交
  - label: D
    content: 政治對峙。
  group_stem: "【題組二】\n回顧：李登輝1999 年接受德國之聲專訪節錄（記者：Günter Knabe）\n    1999 年7 月9 日，時任臺灣總統的李登輝在臺北接受德國之聲前亞洲部主任\
    \ Günter Knabe 採訪時表示，臺灣當局已將兩岸關係定位在「國家與國家，至少是特殊的國與國的關係」。採訪播出後引起巨大反響。北京政府對李登輝的言論進行了強烈抨擊，甚至發出了採取軍事行動的威脅。本台中文部成立50\
    \ 周年之際，我們一起來回顧這一具有歷史意義的採訪。（以下節錄）\n德國之聲：香港1997 年夏從英國回歸以及澳門今年12 月從葡萄牙回歸後受到的\"特別行政區\"\
    待遇可能會被大陸看作有朝一日和平回歸的預演。這對其它國家而言，不失為一個解決中國問題，避免造成區域危機的可行方案，不是嗎？\n李登輝：中國問題影響區域安全的根本原因並不是香港和澳門回到中國，臺灣不回到中國。實際上我這裡要特別強調的問題是，中華民國在臺灣並不是哪一個國家的殖民地。香港和澳門是英國和葡萄牙的殖民地。這是完全不一樣的。現在問題所在就是中國大陸過分強調民族主義，在制度上沒有實行民主，大陸不僅針對我們文攻武嚇，而且從來沒有放棄以武力犯臺，並在國際上處處打壓我方。大陸對港澳承諾的一國兩制模式對臺灣沒有絲毫的吸引力，主要就是一國兩制互相矛盾，同時就是我說的，臺灣是一個有主權獨立的國家，從來和香港、澳門都是不大一樣的。"
