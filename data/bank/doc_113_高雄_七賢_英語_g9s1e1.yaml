- id: doc_113_高雄_七賢_英語_g9s1e1_s4_1
  section: 4
  number: 1
  type: essay
  page: 5
  stem: 殭屍路跑很令人興奮因為跑者可能會被殭屍殺掉。
  group_stem: 'Zombie Runs are usually held around Halloween.

    ① When they are running, hungry zombies hunt for them everywhere. ② To stay alive,
    the runners have to keep the life flags. The zombies do their best to pull off
    the flags.

    ③ However, if the runners don’t lose all their flags, they get a medal.

    ④ But in a fun run, you can really run for fun.


    殭屍路跑通常在萬聖節前後舉行。①殭屍路跑很令人興奮因為跑者可能會被殭屍殺掉。當他們在跑步時，飢餓的殭屍們會到處獵殺他們。②整路上都可以聽到喊叫與尖叫聲。為了存活，跑者們必須保有他們的生命旗。殭屍會努力地把旗子拉走。③如果一名跑者的旗子全都被拿走的話，則該名跑者就得離開競賽。然而，如果跑者們沒有失去所有的旗子，他們會得到一個獎牌。④對某些人來說，「路跑」和「趣味」這兩個字不共存。但是在趣味路跑中，你真的可以為了趣味而跑。'
  shared_asset: g4_1_4
  tags:
    textbook: 九上 英語 對話與情境應答
    labeled_by: ai
    chapter:
      publisher: null
      book: 九上
      subject: 英語
      code: R2
      title: 對話與情境應答
      chapter: 綜合
