  group_stem: 'Charles Dickens was born in England in 1812 and became one of the most
    famous writers of his time. When he was young, his life was tough. His father
    was sent to prison when Dickens was just 12 years old. To help his family, Dickens
    had to leave school and work in a factory. Even though he didn’t finish school,
    he wrote his first book when he was 24. He went on to write 14 more books before
    he died in 1870.

    Dickens used his own life as inspiration for his stories. His characters often
    faced the same problems as he did. His books, like Great Expectations, Oliver
    Twist, A Tale of Two Cities, and etc., show the hard lives many people had in
    those days, and they have been loved by readers for more than 180 years.

    Many of Dickens’s books have been turned into movies. One of them is A Christmas
    Carol, a story that many families still enjoy watching together during the holiday
    season.

     prison 監獄'
