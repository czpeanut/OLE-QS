  group_stem: 'The wind blew in from the ocean as Christmas lights shone in every
    window of Jenny’s house in Point Roberts. Point Roberts, a tiny 4.9-square-mile
    exclave of Washington State, sits at the tip of a Canadian peninsula, cut off
    from the US by the sea. To do anything outside the town, people there have to
    cross two borders—first into Canada, then back into the U.S to be home.

    Jenny and her family made their yearly Christmas trip that morning, crossing through
    Canada to reach a nearby shopping center. They came home with bags of gifts and
    funny stories, like how Jenny''s brother talked the border police into believing
    that his new sweater was a Christmas gift and shouldn’t be taxed.

    That night, they gathered around the fireplace, drinking hot cocoa and chatting.
    The town was quiet but for the sound of waves on the beach. As midnight neared,
    Jenny looked out the window and smiled. Maybe Santa Claus didn’t need a passport
    to cross the border after all—because he didn’t forget small, magical places like
    Point Roberts. Thanks to her loving family, though Point Roberts was cut off from
    the rest of the U.S., Jenny never felt left behind.

     peninsula 半島 border 邊境 tax 徵稅'
