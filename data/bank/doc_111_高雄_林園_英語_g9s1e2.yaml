  group_stem: "Once upon a time, there was an old horse. He was too old to work, so\
    \ he was going to be thrown out by his owner. The horse decided to run away. On\
    \ the road, he found a crying dog. The dog was too old to hunt, so he was going\
    \ to be killed by his owner. The horse then asked the dog to join him. Later,\
    \ they saw a sad cat. She could no longer catch mice because her teeth weren't\
    \ sharp. She was going to be dropped into the river by her owner. She didn’t know\
    \ where she should go and the horse invited her to join them. Finally, the three\
    \ friends met an old chicken. She was going to be cooked for her owner's dinner\
    \ the next day. The chicken was then invited to come along with the group.\n At\
    \ last, they saw a house. Inside the house, there was warm fire and delicious\
    \ food on the table, but a thief lived there. At night, the four animals entered\
    \ the room. They started to fight. The thief's eyes were scratched by the cat.\
    \ His leg was bitten by the dog. His stomach was kicked by the horse, and the\
    \ chicken made loud noise. The thief thought there was an evil monster. He never\
    \ went back to the house again. The four friends stayed and lived happily ever\
    \ after.\n\nthief 小偷 scratch 抓傷 evil 邪惡的 monster 怪物"
  tags:
    textbook: 第五冊（九上）第2次段考範圍
    labeled_by: ai
