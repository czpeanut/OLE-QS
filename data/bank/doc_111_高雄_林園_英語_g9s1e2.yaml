  group_stem: 'Online Shopping Customer Service


    https://shoes4u.com


    Thank you for shopping at shoes4u.com. We hope you like your new shoes! However,
    if there’s a problem with your order, please let us know. We’ll try to fix it
    as soon as possible.


    What’s the problem?

    Q: I made an order, but my shoes didn’t arrive.

    A: Send us an email(help@shoes4u.com). Tell us your name and order number, and
    we’ll send you another pair.

    Q: I ordered the wrong size.

    A: Just return the shoes to us within 14 days, and we’ll send the correct size.
    The address is at the bottom of this page.

    Q: I changed my mind. I want my money back.

    A: Sorry; we can’t give your money back! But you can choose a different pair of
    shoes from our website.

    For any other problems, call us at 080-000-123. Someone will be happy to help
    you.


