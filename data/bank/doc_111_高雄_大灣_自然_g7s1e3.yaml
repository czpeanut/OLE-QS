  page: 1
  stem: 有關人類呼吸運動的敘述，下列何者正確？
  options:
  - label: A
    content: 吸氣時，肋骨上舉及橫膈下降，使胸腔體積縮小，造成肺內壓力變大，導致空氣自外界引入肺中
  - label: B
    content: 呼吸中樞主要是偵測血液中的氧氣濃度來控制呼吸頻率
  - label: C
    content: 平靜狀態下，成人的呼吸運動每分鐘約15~18 次
  - label: D
    content: 大腦是呼吸運動的控制中樞。
