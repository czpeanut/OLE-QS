- id: doc_111_高雄_大灣_自然_g7s1e3_s1_32
  section: 1
  number: 32
  type: single
  page: 3
  stem: 梅西就醫後確認罹患生長激素缺乏症，試問生長激素是由下列哪個腺體分泌？
  options:
  - label: A
    content: 腦垂腺
  - label: B
    content: 腎上腺
  - label: C
    content: 甲狀腺
  - label: D
    content: 副甲狀腺。
  group_stem: "＊閱讀下列敘述後，試回答32～38 題：\n    35 歲的阿根廷足球球王梅西（Lionel Messi）率領國家隊奪下2022 卡達世界盃冠軍，完成最偉大足球球員的最後一塊拼圖，領獎時親吻獎盃的一幕讓全球球迷感動不已。身高雖只有169\
    \ 公分的梅西，無損他的表現，根據外電報導，梅西從5 歲起就展現過人的足球天分，7 歲越級入選當地球隊。他個頭小卻靈活異常，還有「小跳蚤」的綽號。直到10\
    \ 歲，家人意識到他的生長發育似乎異於常人，10、11 歲時身高停在125-130 公分左右，就醫後確認罹患生長激素缺乏症，要不是在球團資助下持續接受生長激素Human\
    \ Growth Hormone（ＨＧＨ）治療，他的身高或許就此停在140 公分，球迷們說不定無緣見到梅西在場上的身影，但是，振興醫院小兒科主任級醫師喻永生指出，對於缺乏生長激素的患者來說，趁著發育黃金時期、持續施打三年半，長高三十公分是有可能。但一般兒童若單純遺傳因素造成的相對矮小，單靠生長激素，別預期身高能夠多長三十公分！\n\
    \    正常的兒童，可以如何促進長高？對於正常的兒童，可以經由以下方式刺激生長激素自然分泌，促進長高：\n        ＊良好的營養：均衡飲食，避免高糖飲料，多攝取蛋白質及多喝牛奶、曬太陽以利鈣質和維生素D\
    \ 吸收。\n        ＊充足的運動：心跳超過每分鐘120 下，持續20 分鐘以上的有氧運動，多做些跳繩、打籃球等跳躍性運動。\n        ＊充足的睡眠：最好在晚上10\
    \ 時前熟睡，夜間連續睡眠8 小時。\n                                            節選自生長激素建功！ 梅西從「侏儒」變足壇「小巨人」-\
    \ 自由時報電子報\n節選自阿根廷球王梅西也罹患，如何診斷「生長激素缺乏症」？兒童內分泌科醫師圖解\n節選自馬偕紀念醫院兒童內分泌科衛教資訊"
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 生物
      code: 5-3
      title: 內分泌系統
      chapter: 第5章 生物體的協調作用
    textbook: 七上生物 5-3 內分泌系統
    labeled_by: ai
