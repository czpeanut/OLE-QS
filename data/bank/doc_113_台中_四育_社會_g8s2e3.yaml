- id: doc_113_台中_四育_社會_g8s2e3_s3_59
  section: 3
  number: 59
  type: single
  page: 6
  stem: 根據上文判斷，琳琳的父母可能觸犯哪項法律？
  options:
  - label: A
    content: 民法
  - label: B
    content: 性別平等教育法
  - label: C
    content: 兒童及少年性剝削防制條例
  - label: D
    content: 兒童及少年福利與權益保障法。
  group_stem: "二、\n    琳琳的父母白天都須外出工作維持生計，將5 歲的她留給祖母來照顧。某天，琳琳的祖母腹痛，緊急到臨近診所看病，而將琳琳獨自留在家中。她因為無聊開始玩家裡的電話，結果誤撥打了「113」，值班人員開始詢問琳琳問題，發現她只有5\
    \ 歲後，基於職責便將實際情形向上級官員報告，上級立即派員前往琳琳家訪視。\n    訪視人員告知琳琳父母，獨留未滿6 歲兒童在家，已觸犯到法律規定。該法規定，父母、監護人或其他實際照顧兒童及少年之人，不得使6\
    \ 歲以下兒童或需要特別看護之兒童及少年獨處或由不適當之人代為照顧。一旦違反規定，疏忽照顧琳琳的人需接受親職教育輔導。不接受親職教育輔導或拒不完成其時數者，處新臺幣3\
    \ 千元以上3 萬元以下罰鍰；經再通知仍不接受者，得按次處罰至其參加為止。\n    有關兒童不能獨留在家的規定，各國的年紀規範各不相同，例如：加拿大大多數的省是以未滿12\
    \ 歲為規定，美國的伊利諾州是以未滿14 歲為規定，而我國則是以未滿6 歲為規定。\n（資料來源：改寫自葉雪鵬，6 歲以下兒童，不可獨自在家，臺灣法律網，2017/08/07。）"
  tags:
