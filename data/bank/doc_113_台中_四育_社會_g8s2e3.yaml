  stem: 知名紀錄片《看見臺灣》，以直升機空拍的創新手法拍攝，讓觀眾深受震撼與感動，許多民眾也起而效法想運用空拍機來記錄生活的點滴，使得空拍機一時成為市場上的熱銷商品。空拍機自由飛行、突破地表障礙的特性雖然迷人，但最近因有民眾使用空拍機時，違反了《民用航空法》而遭到主管機關開罰，此一事件引發社會大眾關切空拍機可能侵犯隱私、失控墜落、影響飛安等問題，也凸顯現有法令尚未完備，因此各界呼籲中央政府機關應盡速通過三讀程序，修訂相關法律加以規範。關於文中遭開罰者「所應負起之責任類型」與「權利救濟方式」的搭配，下列何者正確？
