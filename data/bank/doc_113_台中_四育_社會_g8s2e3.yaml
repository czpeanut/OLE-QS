  stem: '資料一：內戰期間，鄔滄萍在美國拿了兩個碩士學位。1951 年，他響應內戰勝利者的號召，返國參加建設。可是他在美國辛苦學到的東西，在新時代根本派不上用場。他回憶說：「那時候……在政治上是完全的『一邊倒』向蘇聯，連英文都認為沒用。」、「……回來以後我們都學了俄文，學得很快，能隨便看書。」

