  stem: 30. Why does Eric worry about the idea?
  options:
  - label: A
    content: He thinks poor people may feel bad to ask.
  - label: B
    content: He doesn’t like coffee.
  - label: C
    content: He believes coffee is too expensive.
  - label: D
    content: He wants to help more people.
  group_stem: 'Pay It Forward Coffee

    Josh: Do you know about “pay it forward coffee” at Flora Café?

    Eric: You mean you pay for a cup of coffee for someone poor to have it later?

    Josh: Yeah. A cup of coffee is not much, but on cold winter days like today, it
    might warm them up a little. And maybe their hearts too.

    Eric: But will Flora Café really give this cup of coffee to someone later?

    Josh: Come on. I’ve known the shopkeeper well. He’s an honest man. He’s got a
    blackboard in the shop that says how many cups are paid for and how many have
    been given out.

    Eric: But how will they know who to give? Anyone can ask for it even if they’re
    not poor.

    Josh: True, but then I guess they’ll just have to believe in people.

    Eric: Perhaps. But will poor people go and ask for a free coffee? Won’t they worry
    about losing face?

    Josh: Why do you always say things like that?

    Eric: Well, it may happen.

    Josh: Yeah, I know, but I still think it’s a good thing to do, and it gets people
    to care about others.'
