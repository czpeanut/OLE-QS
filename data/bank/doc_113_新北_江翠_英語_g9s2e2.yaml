  group_stem: 'It''s election time at our school, and everyone is excited to vote
    for the new class leader. Our teacher has reminded us to be respectful and kind
    to each other''s opinions. She encouraged us to focus on the positive sides of
    our preferred candidates, emphasizing their strengths and what they can bring
    to the role.

    During the activity, students actively share their reasons for supporting specific
    candidates. They work hard to highlight their chosen candidate''s best qualities
    and explain why they would make a good leader. The election is just around the
    corner, and we''re all looking forward to making our voices heard by voting for
    the person we believe will best represent our class.

    On election day, we''ll go to the voting booth to receive our ballots. It''s important
    to carefully read and follow the rules before marking our choice with a stamp.
    After we''ve cast our votes, we''ll return to our classrooms and wait for the
    results. Once the votes are counted, we will be told the winner, and we''ll all
    have the chance to support our new leader as they work for the class.

