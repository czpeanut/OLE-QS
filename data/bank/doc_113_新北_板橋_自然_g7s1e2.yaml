    \    一般常聽到的「小中風」指的是短暫性腦缺血（或稱暫時性腦缺血）。林口長庚紀念醫院腦中風中心主任吳秀娟醫師表示，患者會出現類似中風的症狀，例如肢體單側無力或麻木、口齒不清、失明等。相關症狀可能持續幾分鐘至幾個小時，並於\
    \ 24 小時內完全恢復。「短暫性腦缺血是即將中風的警訊！」吳秀娟醫師說，「約有 1／3 的短暫性腦缺血患者會發生中風，尤其在短暫性腦缺血發生後 48 小時內的風險最高。有研究指出，在短暫性腦缺血發生後\
    \ 1 週內，中風復發的機會高達 10% 。」\n    短暫性腦缺血的危險因子包括高血壓、糖尿病、心臟病、心房顫動、抽菸等。如果出現短暫性腦缺血的症狀，一定要盡快就醫，即使症狀自行消失，也不能掉以輕心。很多人出現短暫症狀時，可能會懷疑自己是太累了或是出現幻覺，而錯過治療的時機。\n\
    \    請記住「FAST」口訣，「F」是 Face，患者可能出現臉部不對稱如嘴角下垂、眼皮下垂；「A」是 Arm，患者會肢體無力，無法維持兩隻手臂在平舉的狀態；「S」是\
    \ Speech，患者說話會變得含糊不清、胡言亂語，可能無法聽懂別人說的話；「T」是 Time，請務必把握時間，立刻送醫。\n採用雙抗治療，預防二次中風\n\
    \    發生短暫性腦缺血後，即使症狀消失，也必須接受治療，以降低二次中風的風險。吳秀娟醫師說，短暫性腦缺血的患者會在急性期馬上使用抗血小板藥物，除非有不能吃藥的理由。根據台灣腦中風學會治療指引，非心因性高風險暫時性腦缺血（ABCD2\
    \ score ≥ 4）或急性輕微缺血性腦中風（NIHSS ≤ 3）發作 24 小時內，會使用雙重抗血小板治療，也就是阿斯匹靈搭配另一種抗血小板藥物，至少\
    \ 21 天。抗血小板藥物能夠避免血小板凝集，雙抗治療是使用兩種不同機轉的抗血小板藥物，進一步避免血栓形成。\n除了積極接受治療外，日常生活中請務必好好控制血壓、血糖、血脂，飲食方面要少油、少鹽，最好維持理想體重、規律運動、正常作息，請務必戒菸、避免過度飲酒。藥物治療與非藥物的治療，都同等重要！"
  answer:
  - C
