  stem: 下列關於空氣汙染的敘述，何者錯誤？
  options:
  - label: A
    content: 當空氣品質不佳時，應減少在戶外活動的時間，或是配戴口罩
  - label: B
    content: PM$_{2.5}$ 的懸浮微粒直徑小於 PM$_{10}$ 的懸浮微粒的直徑
  - label: C
    content: PM$_{2.5}$ 的顆粒直徑大約是 2.5 x 10$^{-9}$ m ，因為顆粒很小，若吸入後可能會累積在肺部，對人體影響很大
  - label: D
    content: 戴口罩可阻擋空氣中部分的有害物質，其原理就像用撈網將煮熟的水餃從沸水中撈起。
