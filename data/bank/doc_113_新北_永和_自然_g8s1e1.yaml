  - label: A
    content: 甲烷
  - label: B
    content: 臭氧
  - label: C
    content: 細懸浮微粒
  - label: D
    content: 二氧化氮。
  group_stem: "空氣汙染\n    當空氣中存在一些有害人體或生態的物質，就稱為空氣汙染。空氣中有許多類似灰塵的漂浮粒狀物，被稱為懸浮微粒(Particulate\
    \ Matter)；這些懸浮微粒充斥在我們每天呼吸的空氣裡。雖然相當微小甚至肉眼難以辨識，但仍有尺寸上的差異。其中，粒徑小於 2.5 微米的懸浮微粒被稱為細懸浮微粒，也就是我們常聽到的「PM$_{2.5}$」。由於\
    \ PM$_{2.5}$ 無法被呼吸道中的纖毛和黏液過濾，一但吸入便可直達並積累在肺部。長期吸入或暴露在高濃度 PM$_{2.5}$ 的環境下可能會引起過敏、氣喘、心血管疾病和提高死亡的風險，對於過敏族群的影響也更為顯著。\n\
    \    空氣品質指標為依據監測資料將當日空氣中臭氧($O_{3}$)、細懸浮微粒(PM$_{2.5}$)、懸浮微粒(PM$_{10}$)、一氧化碳(CO)、二氧化硫($SO_{2}$)及二氧化氮($NO_{2}$)濃度等數值，以其對人體健康的影響程度，分別換算出不同污染物之副指標值，再以當日各副指標之最大值為該測站當日之空氣品質指標值。\n\
    \n| 空氣品質指標 | 0~50 | 51~100 | 101~150 | 151~200 | 210~300 | 301~500 |\n| --- |\
    \ --- | --- | --- | --- | --- | --- |\n| 對健康的影響 | 良好 | 普通 | 對敏感族群不健康 | 對所有族群不健康\
    \ | 非常不健康 | 危害 |\n| 活動建議 | 正常戶外活動。 | 正常戶外活動。 | 若有不適者應考慮漸少戶外活動。 | 若有不適者應減少體力消耗，特別是減少戶外活動。\
    \ | 應減少戶外活動。 | 應避免戶外活動，室內應緊閉門窗，必要外出應配戴口罩作為防護。 |\n\n參考資料：環境部空氣品質監測網、台南市政府環境保護局"
  answer:
  - A
  answer_source: answer_key_vlm
