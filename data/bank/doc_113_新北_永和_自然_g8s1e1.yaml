    小睿：稀釋濃硫酸時應將手擦乾，並將濃硫酸緩緩加入水中

    碧晨：製備氧氣時，應以湯匙取用二氧化錳，並避免同一湯匙取用不同藥品

    晨宇：試管可於酒精燈上直接加熱，而加熱量筒時必須搭配陶瓷纖維網才能受熱均勻

    上列敘述，哪幾位說法符合實驗室安全守則？'
