- id: doc_113_新北_永和_自然_g8s1e1_s3_45
  section: 3
  number: 45
  type: single
  page: 5
  stem: 某一材料經測量後，長度約為 100 奈米，約為多少公分？
  options:
  - label: A
    content: '0.0001'
  - label: B
    content: '0.00001'
  - label: C
    content: '0.000001'
  - label: D
    content: 0.0000001。
  group_stem: "奈米是什麼？\n    奈米是一公尺的十億分之一，約為一根頭髮直徑的十萬分之一。在這麼小的尺度下，物質有著迥異於巨觀尺度的物理和化學性質，可用來製作具有特殊功能的材料，例如由碳元素所組成的石墨，因硬度小而被用來製作成鉛筆筆芯，但與石墨結構相似的奈米碳管，強度卻遠高於不鏽鋼，還具有良好的彎曲彈性，因此成為顯微探針及微電極的絕佳材料。\n\
    \  所謂的奈米科技即是運用我們對奈米特性的了解，將原子或分子設計組合成新的奈米結構，並以其為「基本組件」（building block），加以製作、組裝成新的材料、元件或系統。奈米科技已經被公認為\
    \ 21 世紀最重要的產業之一，從民生消費性產業到尖端的高科技領域，都能找到與它相關的應用，例如蓮葉和蝴蝶翅膀表面的天然奈米結構，具有抗水防塵的自潔功能。利用此特性製作的奈米塗劑，可運用於自潔玻璃及奈米馬桶等民生用品，也能改善高科技戰機的防汙問題。\n\
    \  在醫藥領域上，正研究利用奈米微小的特性創造出奈米醫用裝置，可以較容易進出人體，以進行檢測、治療與給藥。\n奈米科技的興起為我們的世界帶來重大改變，其影響廣泛而深遠，因此許多國家都在進行相關的研究開發。\n\
    \                                                                  (出處：康軒版國民中學自然科學課本第三冊)"
  answer:
  - B
  answer_source: answer_key_vlm
