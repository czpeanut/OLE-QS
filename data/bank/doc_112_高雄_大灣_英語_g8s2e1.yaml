    content: The Most Famous Food in Taichung.
  - label: D
    content: The Most Popular Food in Tainan.
  group_stem: "Not long ago, people in Taiwan were talking about the most delicious\
    \ food here. Most of the people on the Internet think that the Taiwanese snacks\
    \ in Tainan are the most famous. However, people in other cities say it is wrong.\n\
    \    A few days ago, there was a piece of news. One of the officers in Taichung\
    \ said, “Our food is the best of all.” For example, there are a lot of different\
    \ local snacks in both the night markets and the morning markets in Taichung.\
    \ Besides, there are more and more foreign restaurants in Taichung. These foods\
    \ are popular with the foreign tourists around the world.\n    All the food in\
    \ Taiwan is special. The taste of food is different from person to person. The\
    \ most delicious food should be in everyone’s mind.\nsnack (點心)   officer (官員)\
    \    local (當地的)"
