- id: doc_112_高雄_大灣_英語_g8s2e1_s5_4
  section: 5
  number: 4
  type: single
  page: 4
  stem: Why was the bushfire in 2019 and 2020 worse than before?
  options:
  - label: A
    content: The weather in 2019 was much hotter.
  - label: B
    content: The rain in 2019 was much less than before.
  - label: C
    content: More people moved to Australia in this year.
  - label: D
    content: There were fewer rainy days in Australia in 2019.
  group_stem: "From September, 2019 to March, 2020, Australia experienced the worst\
    \ bushfires in modern history. The bushfire season, the Black Summer, in Australia\
    \ usually starts in August. But the situation was worse in 2019 because 2019 was\
    \ the hottest year for Australia on record.\n  During the Black Summer in 2019\
    \ and 2020, there were hundreds of fires across Australia. The fires killed at\
    \ least 34 people and three billion animals, and burned down over nearly 2,500\
    \ houses. The hot, dry and windy weather was the main cause of the fires, an official\
    \ said.\n  It was a bad dream to all Australians. After the fires, the land looked\
    \ terrible, and the air smelled awful. It will take years for Australians to rebuild\
    \ their homes, but the lost lives will never come back.\nexperience ( 經歷)  bushfires（叢林野火）\
    \ history（歷史） situation（狀況） record（留有紀錄的） nearly(幾乎)\ncause（原因） official（官員） Australians（澳洲人）\
    \ awful（糟糕的）. rebuild（重建）"
