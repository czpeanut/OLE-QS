    (乙)半徑為 $x$ 公分的圓，圓面積為 $y$ 平方公分。

    (丙)半徑為 $x$ 公分的圓，圓周長為 $y$ 公分。

    (丁)底為 $x$ 公分，高為 3 公分的三角形，其面積為 $y$ 平方公分。

    (戊)一天 24 小時，有 $x$ 小時為白天、$y$ 小時為夜晚。

    (己)若車子的行駛距離固定，速率為每小時 $x$ 公里，駕駛時間為 $y$ 小時。

    (庚)若車子的行駛速率固定，駕駛時間為 $x$ 小時，駕駛距離為 $y$ 公里。

    (辛)沉沉的身高為 $x$ 公分，體重為 $y$ 公斤。'
