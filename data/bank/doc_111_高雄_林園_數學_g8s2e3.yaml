- id: doc_111_高雄_林園_數學_g8s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '下列有甲、乙、丙、丁、戊 5 個有關平行四邊形的性質，請問正確的敘述有哪些？

    甲：任一條對角線均可將平行四邊形分成兩個全等的三角形。

    乙：兩組對角分別相等。

    丙：兩組對邊分別等長。

    丁：兩條對角線互相平分。

    戊：兩條對角線將平行四邊形面積四等分。'
  options:
  - label: A
    content: 乙、丙、丁、戊
  - label: B
    content: 甲、丙、丁、戊
  - label: C
    content: 甲、乙、丁、戊
  - label: D
    content: 甲、乙、丙、丁、戊。
  answer:
  - D
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 數學
      code: 4-2
      title: 平行四邊形
      chapter: 第4章 平行與四邊形
    textbook: 八下 4-2 平行四邊形
    labeled_by: ai
