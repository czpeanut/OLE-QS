- id: doc_111_高雄_林園_數學_g8s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '如下圖(1)，在$\triangle ABC$中，$\angle CAB$的角平分線交$\overline{BC}$於 D 點，甲、乙兩人想作菱形
    AEDF，使得 E、F 兩點分別在$\overline{AB}$、$\overline{AC}$上，他們的作法如下：

    甲：分別作$\overline{DE} // \overline{AC}$交$\overline{AB}$於 E 點，$\overline{DF} // \overline{AB}$交$\overline{AC}$於
    F 點，則四邊形 AEDF 即為所求。

    乙：作$\overline{AD}$的中垂線分別交$\overline{AB}$、$\overline{AC}$於 E、F 兩點，連接$\overline{DE}$、$\overline{DF}$，則四邊形
    AEDF 即為所求。

    對於甲、乙兩人的作法，下列判斷何者正確？'
  options:
  - label: A
    content: 甲、乙皆錯誤
  - label: B
    content: 甲、乙皆正確
  - label: C
    content: 甲正確、乙錯誤
  - label: D
    content: 甲錯誤、乙正確。
  assets:
  - key: s1_5_f1
    kind: figure
    file: doc_111_高雄_林園_數學_g8s2e3/s1_5_f1.png
  answer:
  - B
