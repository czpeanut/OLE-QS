  section: 1
  number: 29
  type: single
  page: 5
  stem: '29.「在臺灣的客家人，由於族群遷徙的歷史背景，加上較為艱苦的生活環境，發展了以勤儉精神來保存食物、物盡其用的飲食文化，例如以醃漬來保存容易腐壞的蔬菜，再以醃菜搭配肉類做出特色的客家料理。臺灣客家人以芥菜作為醃菜的材料，可謂表現得淋漓盡致。首先，利用稻作休耕期間來種植芥菜，就展現了勤儉精神。等芥菜收成後，再以傳統的醃漬方法，依不同時間的發酵、日晒和風乾，依次可以做成：酸菜、福菜、梅乾菜。」

    依據這段文字的內容，客家人以醃漬的方式保存芥菜的原因，最可能是下列何者：'
  options:
  - label: A
    content: 芥菜是傳統祭祀的必需品，需長期保存
  - label: B
    content: 天性勤儉，捨不得丟掉生產過剩的食材
  - label: C
    content: 生活艱苦，發展出保存食物的飲食文化
  - label: D
    content: 醃漬能提高香味及營養，使其更加可口。
  tags:
    textbook: 七下 第八課 摩登土產鳳梨酥
