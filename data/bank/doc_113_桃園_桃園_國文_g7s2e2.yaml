  stem: 37.依照文章中提到的作法，下列哪個方法無法減少洋蔥刺激的氣味？
  options:
  - label: A
    content: 皮卡丘：將洋蔥預先冷藏
  - label: B
    content: 大蔥鴨：將洋蔥剁成碎末
  - label: C
    content: 卡比獸：將洋蔥加熱烹調
  - label: D
    content: 三地鼠：將洋蔥絲泡冰水。
  group_stem: '每次票選「十大最不喜歡的蔬菜」排行榜，有幾種蔬菜總是榜上有名，這其中有沒有你愛吃或者是不喜歡的呢？以下挑選出其中四種排行榜上的蔬菜，揭開它們為何惱人的原因，以及克服它們的小技巧。

    【青椒】

    你也像蠟筆小新一樣害怕青椒嗎？在兒童討厭的蔬菜中，青椒不僅位列前3，甚至連許多大人也因為青椒的特殊氣味，而對它避之唯恐不及。青椒的特殊氣味來自果實內的槲（ㄏㄨˊ）皮素，由於青椒是垂直生長，因此平常料理時的橫向切法，容易破壞青椒的細胞壁，讓槲皮素釋放得更快，使青椒有濃濃的菜味。不過只要改切成直條，或是把整條青椒直接烤，就可以減少青椒的怪味。

    如果真的害怕青椒味，你也可以改吃與青椒不同顏色的兄弟姐妹——紅椒與黃椒。當青椒成熟時，果實內的茄紅素、類黃酮素增加，槲皮素發生變化，外觀會變成紅色或黃色，味道則會變得鮮甜。

    【洋蔥】

    你是否也在切洋蔥的時候流過眼淚？就算沒有親手切過洋蔥，洋蔥嗆辣的氣味，也讓許多人拒它於千里之外。這樣的刺激性來自於洋蔥當中的硫化物成分，當我們將洋蔥切開時，洋蔥當中的蒜酶與含硫的胺基酸會混合在一起，形成「催淚因子」，讓眼睛因它的刺激而流淚。這其實是植物的自我保護機制，對於昆蟲、黴菌或寄生蟲來說這種成分則具有毒性。

    儘管具有一定的刺激性，這類物質對於人體來說有許多好處，像是刺激食慾、幫助消化、抵禦病毒、穩定血糖等的效果。想要獲得這種營養素，最好的方式就是涼拌生吃。如果想要減輕洋蔥的嗆味，製作時可以先將洋蔥泡在冷水或是冰在冰箱10～15
    分鐘，或者將切絲後的洋蔥泡在冰水中，以減少催淚因子的形成，讓你不再為洋蔥流淚。此外，用燉煮的料理方式，除了能夠減少洋蔥嗆味，還可以將洋蔥內的成分轉化成能有效降低膽固醇的營養素，也是攝取洋蔥營養的好選擇。

    【苦瓜】

    多數人們對苦瓜的印象都是：「好苦！怎麼會有人想吃？」它不僅是兒童最討厭蔬菜的第1 名，許多人長大後也還是接受不了苦瓜。其實，苦瓜主要的苦味來自苦瓜子中的奎寧、瓜囊含有的葫蘆素，以及果肉含有的苦瓜素，在烹煮時苦瓜素會釋放出苦味，這也是為什麼苦瓜料理吃起來會苦苦的原因。

    不過，這些讓人感到苦不堪言的成分，具有很好的抗氧化能力，可以減緩老化。此外，苦瓜還含有多種的維生素和膳食纖維，可幫助腸胃蠕動，具有美白效果的維他命C 含量更是瓜類蔬菜中的冠軍，可說是愛美人士的最佳飲食選擇。如果想要減少苦味，記得將苦瓜的瓜囊與其中的種子刮除乾淨，並在烹調前將苦瓜浸泡在鹽水裡30
    分鐘，可以去除苦澀味。在烹調前先將苦瓜汆燙10～15 秒，則可以降低苦味還能保持苦瓜脆度。

    除此之外，通常苦瓜表面突點越細、顏色越綠的，味道就會越苦。而透過人為篩選遺傳性狀，人們培育出了顏色更淺、表面突點更大、更光滑的苦瓜，這類的苦瓜一樣擁有豐富的營養素，但能讓你不用吃得苦中苦，也可以攝取營養素，變得更健康。

    【香菜】

    每當老闆端上一碗灑了滿滿香菜的羹湯上桌，你有什麼想法呢？是覺得「哇～太美味了！」還是「噁～簡直要吐了！」在提到香菜時，這樣兩極的反應總是特別多，為什麼有些人就是討厭香菜？

    根據研究指出，人體有一種名為「OR6A2」的嗅覺受器基因，當該基因的核苷酸排列順序產生變異時，會使得嗅覺器官對於醛類化合物的氣味特別敏感，而香菜正是含有特別多這種化合物的植物，因此有些人一聞到香菜就覺得氣味強烈。再加上像是肥皂、臭蟲也都有許多的醛類化合物，這也導致人們在聞到香菜味時，會直接聯想到這些東西，使大腦認為香菜不能吃而排斥。所以有些人討厭香菜可說是「天生」的喔！

    不過香菜其實具有許多好處，不僅具有豐富的維他命成分和礦物質，還有助於清除體內的有毒重金屬。如果想吃香菜又害怕它的氣味的話，可以將香菜加熱或是切碎，這樣可以破壞香菜的氣味來源「癸稀醛」的結構，降低那惱人的氣味。

    ⟨你挑食嗎？——那些你討厭的蔬菜⟩'
