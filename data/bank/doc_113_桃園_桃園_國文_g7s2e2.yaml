  - label: B
    content: 手機必須繳交由導師保管，放學時才能領回
  - label: C
    content: 未依規定使用手機，經查獲由師長保管，學生可自行於放學向師長領回
  - label: D
    content: 學生可將手機放於制服口袋中，但不得使用
  group_stem: '桃花源國中學生手機使用管理辦法

    一、目的:

    (一)維護上課安寧與秩序，營造良好學習環境。

    (二)為順應學生實際需要，便於家長緊急聯絡。

    (三)預防不當使用，造成師生困擾。

    二、管制細則：

    (一) 學生到校應繳交手機，由導師統一收齊保管，每天放學領回。

    (二) 使用時機：經導師或學務處同意後，於辦公室使用，其餘時間不得開機(含震動)。

    (三) 行動電話不得外露於校服、書(背)包外等。

    (四) 定期考試、模擬考試時，行動電話不可置於抽屜或身上，違者再依桃花源國中考試規則、獎懲實施要點補充規定處理。

    (五) 禁止使用行動電話作為聚眾滋事之聯繫工具，違者依獎懲實施要點補充規定論處。

    (六) 與學習無關 3C 用品例如：平板電腦、掌上型電玩、隨身聽等，嚴禁攜帶到校。

    (七) 在校期間(進入校門)禁止使用手機、耳機等 3C 用品，上下學途中請勿使用手機或聽音樂，注意交通安全。

    三、罰則：

    (一) 未依規定使用手機，一經查獲由導師或學務處代為保管至放學，並記小過乙次（依據校規第二十七條第一項）並通知家長領回手機。

    (二) 未經同意，以手機從事妨害他人自由及自主權之行為者，則提送學校獎懲委員會論處。

    (三) 其餘未訂定之事項，教職員均有教育學生責任，應通知導師或學務處處置。'
