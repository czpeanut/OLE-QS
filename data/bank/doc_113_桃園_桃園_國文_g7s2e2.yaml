  stem: 14.下列關於新詩及唐詩格律的說明，何者正確？
  options:
  - label: A
    content: 新詩的平仄不限，形式自由，故稱為自由詩。又盛行於民國以後，故稱為近體詩
  - label: B
    content: 新詩中的「小詩」篇幅極短。要求偶數句要押韻，可以換韻。字數、句數都不限
  - label: C
    content: 唐詩中的絕句和律詩都要求對仗。且這種詩體只流行於唐代，現在已經沒有人在創作了
  - label: D
    content: 唐詩中的絕句每首四句，律詩每首八句。每句字數分五言和七言。全詩一韻到底，不可換韻。
  tags:
    textbook: 七下 第五課 近體詩選(一)登鸛雀樓(二)聞官軍收河南河北(三)過華清宮其一
