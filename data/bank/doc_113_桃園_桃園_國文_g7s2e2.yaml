- id: doc_113_桃園_桃園_國文_g7s2e2_s2_33
  section: 2
  number: 33
  type: single
  page: 6
  stem: 33.上文中提到身分大相徑庭的「公務員考生」，指的應該是何種差異？
  options:
  - label: A
    content: 祖上籍貫
  - label: B
    content: 社會階級
  - label: C
    content: 啟蒙年齡
  - label: D
    content: 專攻典籍。
  group_stem: '唐代以大一統帝國之姿拉開歷史的新頁，文學上的成就也同樣輝煌，孕育出古代詩歌最鼎盛的時代。中國詩歌的長河匯聚至盛唐，復以全新的形式——近體詩奔流而出，其中承先啓後的兩位中流砥柱，就是你我都熟悉的李白、杜甫。

    李 杜活躍的唐代社會，民族以胡漢融合、文化以兼容並蓄著稱。唐代皇室本身就帶有胡人血緣，因此不強調中國自古以來「華夷對立」的立場，為了淡化「夷族」出身，皇室更自稱是本名「李耳」的老子後代。在這樣的政策下，繁榮的民間交流造成長安城中處處可見「外國人」的景象。胡樂、胡服等外來文化傳入，魏晉以後佛
    道思想深植人心，以及經濟治安相對穩定，市民得以有餘力追求風雅娛樂，這些因素都替盛唐文學的發展創造了適合的大環境。到了唐玄宗時期，已出現許多風格鮮明的詩人，如以田園詩出名的王維、以邊塞詩名聞天下的王之渙，或是浪漫詩流傳千古的詩仙李白。

    唐代實施科舉，這種選拔制度雖不如今日國家考試公平，但仍是平民翻身的一大機會。當時科舉中最難考的是「進士科」，考試內容「以詩賦取士」，也就是必須創作詩文，比起以背誦為主的「明經科」困難許多，但一朝考上，未來發展則不可限量。因此讀書人多勤於作詩，這一大群身分大相徑庭的「公務員考生」也讓寫詩不再只是上層階級的活動。龐大的寫詩人口促使近體詩快速興起，也為我們留下唐人生活群像的第一手資料。

    前人文學改革的成果到唐代已經時機成熟，也成為孕育近體詩發展的一大助力。魏晉以來發展的的駢體文、宮體詩，前者好用浮誇的修辭、典故，後者專門描寫淫靡的主題，以現今說法就是「腥羶色」，讓部分文人感到不滿。上至隋文帝、唐太宗等帝王，下至初唐四傑、陳子昂等文人都曾提出改革主張，但風氣的轉變只能在一次次失敗的經驗中累積，直到盛唐，「近體詩」終於撐起眾人對清新、質樸文學的期待，更以嚴格的格律創造文字的韻律感，很快席捲了文壇。

    在李白生存的年代，唐詩的發展已逐漸興盛，但李白將其推向另一個高峰。初唐詩人陳子昂主張回歸秦 漢、建安時代① 質樸剛健、慷慨悲涼的文風以改正淫靡風氣，而李白接下陳子昂的復古大旗，將此詩風發展到頂點。李白的作品中有不少歌行、古詩，如著名的⟨將進酒⟩，呈現他對復古主義的推崇。在近體詩的作品中，李白也擅長融合古典的特色與自己豐富的想像力、神道思想等等，可說李白是《詩經》、《楚辭》、樂府一脈詩歌傳統的最後傳人。

    不同於李白繼承古典傳統，杜甫始終關注現實，使近體詩的發展變得更加成熟。杜甫從古代傳統承襲的是樂府的「敘事」特色和建安文學② 的寫實精神，他以詩作紀錄安 史之亂前後的社會現況，因而被稱作「詩史」。對於寫詩，不像李白妙筆一揮就能成篇，杜甫曾說「讀書破萬卷，下筆如有神」，他畢生勤奮作詩、嘗試各種題材、鑽研字句和聲律，因此內容多元和格律工整成為杜詩的特徵。但杜甫詩中最為人景仰的是他對社會的關懷，一句「安得廣廈千萬間，大庇天下寒士俱歡顏」道出他對社會的責任感和同理心。唐代中期以後杜詩被大力推崇，如宋詩的主流「江西詩派」即以杜甫為祖，宋人學習杜甫的精鍊文風，更視他的儒家關懷為典範，杜詩因此對文壇影響深遠，成為近體詩發展的里程碑。

    中國文學發展的長河到南北朝疲弊已久，幸好有許多文人的耕耘，加上唐代社會環境的支持，使文風為之一變。李白和杜甫，一個把酒吟詩，承接古典詩歌的慷慨激昂；一個勤奮創作，把近體詩的境界拓得更寬廣，兩人不只生年一前一後，更是背靠著背撐起了詩歌發展的一片天。

    ⟪品學堂•唐詩的盛世⟫

    註① 建安時代：是東漢皇帝漢獻帝劉協的第五個年號，共計25 年。建安時代在政治上是個衰世，但在文學上卻蓬勃發展，取得很豐碩的成果。

    註② 建安文學：建安文學富時代精神，充分反映出當時的社會現實，是歷代文人稱許和學習的對象。'
