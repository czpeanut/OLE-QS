    content: 秦始皇統一六國後，為使文字規範化，經丞相李斯等人加以整理，以大篆為官方字體
  - label: B
    content: 行書是漢字定型的轉折點，擺脫圖畫性而成為純粹的符號，為近兩千年的方塊漢字奠定基礎
  - label: C
