  group_stem: "(三)                                         Words May Kill \n“We have\
    \ the freedom of speech on the Internet.” We may hear these words every day and\
    \ everywhere. On the Internet, with \nanonymity, people think they can say anything\
    \ freely and safely because they can use other names. Some people may say something\
    \ bad \nto hurt other people. What may happen after that? They never think about\
    \ it. \nWords may kill people. We can see some examples from the news reports.\
    \ Some famous people in Taiwan or other countries got \nthese hurtful words on\
    \ Facebook or Instagram. Everyone may have this kind of experience. Besides, there\
    \ would be some terrible \neffects. People may start to be afraid of seeing their\
    \ fans, friends, and family. They may feel lonely and sad. Even worse, some may\
    \ even \nend their lives. \nOf course, we have freedom of speech in Taiwan. But\
    \ it doesn’t mean we can use it to hurt people. How could these words make  \n\
    a person lose his/her life? We would never know. If we don’t think more before\
    \ we use words, something bad may happen. Will these \nwords hurt people? What\
    \ will they do if these words hurt them? Will they end their lives? Next time\
    \ when you are going to press the \n“ Enter Key,” think more carefully. Also,\
    \ what should we do when other people hurt us online? Ask your teacher, family,\
    \ or friends to \nhelp you. At the same time, believe you are good and don’t hurt\
    \ yourself. \n freedom of speech 言論的自由 ; hurtful 傷人的 ; effects 影響 ; lonely 孤單的\
    \ ; press 按 ; Enter Key 輸入鍵"
