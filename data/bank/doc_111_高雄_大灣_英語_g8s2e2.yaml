  group_stem: "(二)                                         Afternoon Tea \n  Many\
    \ people in Taiwan like afternoon tea, served from 2 p.m. to 5 p.m. in restaurants.\
    \ They can enjoy many kinds of dishes, \nsnacks, cakes, drinks, and coffee on\
    \ high chairs at a high table comfortably. But do you know when and where the\
    \ traditional afternoon \ntea began ?  \n    The story about it began back in\
    \ the mid 1800s in the UK. In those days, lunch was served at noon, but dinner\
    \ was not ready until 8 \nor even 9 o’clock at night. One day, Anna Maria Russell,\
    \ Duchess of Bedford, felt hungry during the long afternoon. She began to have\
    \ \ntea, sandwiches and cake served at a coffee table in her room in the afternoon.\
    \ Then, she invited her friends to enjoy the meal with her, \nand it became the\
    \ “in-thing” for the upper-class women in the country. The boring, hungry afternoon\
    \ became their everyday happy time. \nTherefore, they had Low Tea and also called\
    \ it Afternoon Tea, a light meal served between 3:30 p.m. and 5 p.m.\n    When\
    \ Low Tea became the upper-class people’s favorite, the working people tried to\
    \ follow them. However, they couldn’t have \n“tea” until 6 p.m. after work. People\
    \ called it High Tea because they enjoy it at high dining tables while Low Tea\
    \ was at low coffee \ntables. The foods were different from those at Low Tea,\
    \ too. The workers would have meat pies, fish, bread with butter, and some tea\
    \ or \ncoffee. \n   serve(d) 提供 ; traditional 傳統的 ; Duchess of Bedford 貝德福德公爵夫人\
    \ ; upper-class 上層階級 ; therefore 因此"
