  - label: D
    content: They visited their grandma and gave some fruit to her.
  group_stem: 'Rick took a three-week vacation with his family this summer. The day
    before they went out, the whole family helped to prepare for the vacation. Rick’s
    father asked their neighbor, Mr. Chang, to check the mailbox for them every day
    and take out all the letters. Mr. Chang also helped to water the plants in the
    backyard. After lunch, Rick’s mother took all the leftover food out of the kitchen
    and did the dishes.

    As for the children, Rick put some cans of the dog food in a bag and took their
    pet dog to his friend’s house. Bella, Rick’s sister, cleaned the house. Scott,
    Rick’s brother, mopped the floor and took out all the trash in the rooms. That
    evening, Rick and his family ate at a restaurant. Before going home, they visited
    their grandma and brought her some fruit. At the end of the day, they started
    to pack for the vacation!

