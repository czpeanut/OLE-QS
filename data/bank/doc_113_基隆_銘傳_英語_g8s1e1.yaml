  type: single
  page: 3
  stem: Which of the following about the writer is NOT TRUE?
  options:
  - label: A
    content: She started playing on basketball at the age of two.
  - label: B
    content: Her grades of the tryout were good because she practiced so hard.
  - label: C
    content: All her family went to the school with her to check the team list.
  - label: D
    content: Her brother can play basketball, too.
  group_stem: 'It is my dream to play on the school basketball team. I began playing
    basketball when I was in the second grade. My older brother taught me to play.
    He is three years older than I am. He practices with me every afternoon and always
    watches my games with my parents. This year, I started the sixth grade. MCJH Basketball
    Team announced its tryouts last month. After I knew that, every day my brother
    helped me practice for the team tryouts. The tryouts were last Saturday morning.
    Forty-three students from my grade tried out for the team.

    The team only has spaces for five students. I know how hard I worked for the tryouts.

    I did a good job at the tryouts, but I was still worried on Saturday night and
    Sunday morning, waiting for MCJH to announce the list. On Sunday morning, my family
    took me to the school to see who made the team. I was so happy when I saw my name
    on the list. It is wonderful to be a part of MCJH Basketball Team. When we left
    the school, my parents took us to Pizza Hut. It was just a little celebration
    for my hard work. My parents were very proud of me, too. However, they told me
    many times to keep my grades up and do my homework on time every day. They do
    not need to worry about those things because I am sure to work very hard to stay
    on the team.

     grade 年級/成績 older than 比…年長 space 空位 announce 宣布 tryout 選拔賽 list 名單 celebration
    慶祝 proud 驕傲的'
