  section: 7
  number: 50
  type: single
  page: 3
  stem: According to the reading, what grade may the girl’s brother be in?
  options:
  - label: A
    content: In the second grade.
  - label: B
    content: In the seventh grade.
  - label: C
    content: In the sixth grade.
  - label: D
