  stem: 阿寯在溫室種植彩色甜椒，但種植後開始出現蚜蟲等害蟲，影響彩色甜椒的產量。阿寯與專家合作，利用瓢蟲與蚜蟲的交互關係，在溫室裡放入瓢蟲，幾個月後發現蚜蟲的數量減少了，而彩色甜椒的產量也恢復正常。由上述可推論下列何者正確？
