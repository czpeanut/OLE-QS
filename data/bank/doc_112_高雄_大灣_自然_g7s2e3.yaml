  stem: '下表有關環境特色、生物族群與生態系的配對，何者正確？


    | 選項 | 環境特色 | 生物族群 | 生態系 |

    | :--- | :--- | :--- | :--- |

    | (A) | 雨量稀少、日夜溫差大 | 仙人掌、蛇、長耳狐 | 草原生態系 |

    | (B) | 水位、鹽分變化大 | 水筆仔、黑面琵鷺、網紋招潮蟹 | 淡水生態系 |

    | (C) | 溫度低、降水稀少 | 地衣、蘚苔、北極熊 | 凍原生態系 |

    | (D) | 氣候溫暖降雨豐富中低海拔高度 | 獨角仙、五色鳥、穿山甲、台灣獼猴 | 針葉林生態系 |'
