- id: doc_112_高雄_大灣_自然_g7s2e3_s1_37
  section: 1
  number: 37
  type: single
  page: 4
  stem: 關於棲地破碎化的相關敘述，下列何者錯誤？
  options:
  - label: A
    content: 區塊分散可能降低生物基因交流的機會，影響遺傳多樣性
  - label: B
    content: 導致路殺發生機率提高
  - label: C
    content: 對於高度依賴特定棲地環境的物種，影響較小
  - label: D
    content: 石虎是受此影響的物種之一。
  group_stem: "※閱讀文章，試回答37~38 題：\n    路殺指的是野生動物在路上被車輛撞擊死亡的現象，簡單來說其實就是發生在動物身上的車禍。人類的開發，逐漸由平地走向山林，道路是開發中不可缺少的一環，但這對野生動物的棲地來說是個非常嚴重的傷害。你一定聽過生物多樣性，但路殺跟生物多樣性有什麼關係？當然有，你覺得當這些動物一直在馬路上死去，對一個族群的生存會沒有影響嗎？我們的糧食、醫藥、衣物、建材等生活所需的物品，絕大部分都是來自各類的生物，因此生物多樣性之於人類的重要性是比你想像中來得大的。\n\
    \    你也許會困惑，一條路的面積又不大，為什麼會對野生動物造成如此大的威脅？當生態系環境受到外界影響，被切割、分裂變小，形成破碎的島狀區塊，這種現象就稱為棲地破碎化，又可稱為棲地分割效應。各個物種對於棲地破碎化的反應有所差異，然對於棲地領域需求大、高度依賴特定棲地環境的物種，便會有明顯劇烈的反應，當棲息地遭受切割破壞時，導致物種數量減少，嚴重者更瀕臨滅絕危機。許多人為因素，舉凡為土地管理方式、耕作型態、道路開發工程、溝渠建設等，在過度或不當的方式下，加速縮減生物的自然棲地，造成棲地破碎化的情況。棲地破碎化一來會增加邊緣效應對生物的干擾，邊緣效應涵蓋人為耕作、觀賞遊憩的\
    \ 干擾、共棲物種的驚擾、掠食者的出現等壓力；再者，零星區塊分散生物繁殖期領域，降低基因交流的機會，促使區塊內的族群容易縮小，使得單一物種走向絕種，漸漸地物種數量減少；三者，分散成數個零碎棲地，致使生物個體在不同區塊之間移動的過程，增加路殺等意外發生的機率，如墾丁陸蟹產卵期間必須從陸上棲息地跨越省道至海中產卵，及台灣僅存本土貓科動物石虎皆因穿越道路而造成路殺事件發生。\n\
    \    墾丁國家公園海岸林是陸蟹棲息地和孵育場，是陸蟹多樣性最高地區，為降低抱卵母蟹過馬路到海邊釋幼遭「路殺」，墾管處連續10 多年在台26 線香蕉灣至砂島路段交管，公路局去年設首座供陸蟹穿越生物廊道，設置184\
    \ 處箱涵及涵管供陸蟹穿越。今年陸蟹廊道改善工程，改成用在地咾咕石鋪設，也是陸蟹最適應材料，營造友善陸蟹環境，希望抱卵母蟹通過，能用陸蟹廊道平安到海邊釋幼，讓生態永續經營。但有民眾認為像是「天堂路」怕摔車受傷。墾管處表示，相關路段都要遵從速限，該廊道對陸蟹來說是很好的自然素材，能保護牠們的生命，後續用自然演替，讓草慢慢長出來，恢復在地生態。\n\
    \    目前還有較成功的案例是「國道讓蝶道」，國道3 號251k 附近是紫斑蝶穿越的熱點，但當他們提升飛行高度時，只比路面高出一些，因此常常被直接撞擊而死。在這個路段就做了一些措施：架起防護網、紫斑蝶尖峰時段封閉部分車道、橋下放置燈管導引紫斑蝶，這些措施可以讓紫斑蝶的飛行高度再增加，或直接改走橋下，都可以避免被車輛撞擊。其他還有像是設置警示牌、架設圍籬等。\n\
    \     宏觀面而言，則設置自然保留區、自然保護區、規劃野生動物重要棲息地以及國家公園，更能完整性保護生物的棲息地，我國至今成立9 座國家公園，希望透過完整性的規劃與措施，讓動物的棲地得以保育長存。"
