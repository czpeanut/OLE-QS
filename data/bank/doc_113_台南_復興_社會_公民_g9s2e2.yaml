- id: doc_113_台南_復興_社會_公民_g9s2e2_s1_53
  section: 1
  number: 53
  type: single
  page: 4
  stem: 根據上述文章內容，下列對於日本跨國勞動力的相關敘述，何者較為正確？
  options:
  - label: A
    content: 移工同事間的心理相互支持，實現了人性尊嚴
  - label: B
    content: 經濟全球化現象，將增加文化間的交流與衝突
  - label: C
    content: 移工可獲得日本無限期居留，屬於非金錢誘因
  - label: D
    content: 日本引進外籍勞工，旨在增加生產的機會成本
  group_stem: '日本近年對於國外勞動力積極招手，據7-Eleven、全家、Lawson三大超商統計，全日本80萬名員工中，外籍員工已達10%，其中都會地區外籍店員佔比更高。外籍移工選擇在日本當地超商工作，因工作環境優於工廠，服務業能接觸更多人群，且還能藉此「學日文」。調查資料也顯示，若同事裡有同鄉，除了能提供較強的心理支持外，也使得工作學習速度增快，且缺勤率較低。此外，許多東南亞籍移工選擇日本，其生活成本比美國和歐洲主要城市便宜，也是主要的原因之一。

    日本計劃於2027年實施「育成就勞制度」，將放寬外籍工作者居留的限制並放寬工作轉換限制，到職1~2年便能換工作，若獲得特定產業的高階技能認證，將可以無限期在日本居留，並准許家眷申請依親居留，更增加外籍勞動力赴日工作的意願。

    面對鄰近國家積極招募跨國勞動力，我國行政院勞動部表示，政府如果現在不調整因應，未來包括：製造業、營造業等勞力產業，都可能會出現人力短缺的問題，本部將與相關部門進行討論研擬政策並提請（甲）機關修法。'
