- id: doc_113_台南_復興_自然_g7s2e2_s2_14
  section: 2
  number: 14
  type: single
  page: 5
  stem: 有關幹細胞的敘述，何者正確？
  options:
  - label: A
    content: 只能在母體血液中發現
  - label: B
    content: 可分化為各種特定的組織器官
  - label: C
    content: 比其他體細胞含有更多遺傳物質
  - label: D
    content: 進行細胞分裂時不須染色體複製
  group_stem: '「臍帶血」就是嬰兒出生時，臍帶和胎盤中的血液。臍帶血富含「幹細胞」，它是一群在胚胎發育早期的未分化細胞，具有自我更新和增殖分化的潛力，是形成各種組織器官的起源細胞，培養成為人體組織與細胞的最原始「原料」。

    幹細胞也是血液及免疫系統的主要製造來源，如紅血球、白血球、淋巴球等，可以治療血液、免疫系統引起的疾病，像熟知的白血病、海洋性貧血症、淋巴瘤、紅斑性狼瘡等，都有良好的療效，甚至可以取代骨髓移植，可做為基因療法及複製療法之用。

    幹細胞目前在應用上有幾項優點：①來源容易、②含有較多的造血幹細胞、③採集容易、④帶有傳染病原和病毒的可能性低、⑤移植後不容易發生排斥現象、⑥兄弟姊妹間的臍帶血移植，適合機率高達50%。因此近年來正積極發展這項生物技術。

    不過，臍帶血移植也面臨一些限制：1. 如果成年人需要臍帶血移植，現今會面臨臍帶血量不足的問題。2. 較無區分好壞細胞的能力。臍帶血移植的病人雖比較不會有排斥的問題，但和成體幹細胞相比，臍帶血幹細胞比較不成熟，比較沒有區分好的細胞或腫瘤細胞的辨別能力，也許在對抗癌症、腫瘤細胞時，能力會較差，需要多關注後續的復發問題。

    請以此短文，回答 14—15 題：'
