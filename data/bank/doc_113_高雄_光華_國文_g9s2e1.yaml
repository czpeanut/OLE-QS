    (乙)

    姑山寺北賈亭西，水面初平雲腳低。幾處早鶯爭暖樹，誰家新燕啄春泥。亂花漸欲迷人眼，淺草才能沒馬蹄。最愛湖東行不足，綠楊蔭裡白沙堤。

    （白居易錢塘湖春行）

    (丙)

    疏林紅葉，芙蓉將謝，天然妝點秋屏列。斷霞遮，夕陽斜，山腰閃出閑亭榭。分付畫船且慢者。歌，休唱徹；詩，乘興寫。

    （薛昂夫山坡羊西湖雜詠）'
