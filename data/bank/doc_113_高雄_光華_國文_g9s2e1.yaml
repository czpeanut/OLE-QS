- id: doc_113_高雄_光華_國文_g9s2e1_s4_9
  section: 4
  number: 9
  type: single
  page: 5
  stem: 作者認為鳳凰木在春天時做什麼？
  options:
  - label: A
    content: 在蟬聲嘶鳴裡如血點般盛開
  - label: B
    content: 焦慮、著急等待花季
  - label: C
    content: 儲蓄自己的生命能量
  - label: D
    content: 在每朵花前停留佇足。
  group_stem: '春分到清明，苦楝、杜鵑、白流蘇、木棉、刺桐，都陸續盛放，奼紫嫣紅，今年的春天是特別繽紛的。

    河岸邊只有一棵大鳳凰木還是上一個冬天枯枝杈枒的模樣，有點孤淒。

    這一株高大的鳳凰木，花開時應該已經到夏天七、八月了吧。最近幾日它也感覺到春天來了，在彎垂又向上仰起的枝梢頂端冒出了一簇綠色新葉，迎向曙光，彷彿從長長的睡眠中開始慢慢甦醒了。

    我們有時會忽略沒有開花的樹，花期還沒有到，看到別的花燦爛奪目，可以不焦慮，不著急，安安靜靜，沉穩內斂，儲蓄自己的生命能量。

    要有多麼充足飽滿的自信，才能懂沉默安靜，安靜等待自己花季的時刻。不招搖，不張揚，這棵鳳凰木一定對自己七、八月將要來臨的花季充滿信心吧。

    我很愛鳳凰花，它是島嶼夏日的盛豔之花，在炎熱蟬聲嘶鳴裡如血點般灑開，美麗而壯烈。

    然而現在還不是它的季節。

    春天百花爛漫，卻似乎都不及鳳凰花如火焰般的燃燒熠燿。每一種花都有屬於自己的花季，到每一朵花前停留佇足，學習花季更迭的秩序，讚嘆開花的華美喜悅，也學習不開花時孤獨的靜默。

    夏天，我會回來，看這一棵大鳳凰木的盛大燦爛。

    （蔣勳安靜等待自己花季的時刻）'
