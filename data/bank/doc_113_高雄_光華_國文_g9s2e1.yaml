- id: doc_113_高雄_光華_國文_g9s2e1_s3_7
  section: 3
  number: 7
  type: single
  page: 1
  stem: 「鄭人游於鄉校（鄉校是指西周春秋時設在鄉的學校，也是國人議論政治的地方），以論執政。然明謂子產曰：『毀鄉校何如？』子產曰：『何為？夫人朝夕退而游焉，以議執政之善否。其所善者，吾則行之；其所惡者，吾則改之，是吾師也。若之何毀之？我聞忠善以損怨，不聞作威以防怨。豈不遽止？然猶防川，大決所犯，傷人必多，吾不克救也。不如小決使道；不如吾聞而藥之也。』」（左傳
    子產不毀鄉校）子產以防川為喻，旨在說明？
  options:
