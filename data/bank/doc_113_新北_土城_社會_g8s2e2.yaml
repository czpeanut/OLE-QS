- id: doc_113_新北_土城_社會_g8s2e2_s1_39
  section: 1
  number: 39
  type: single
  page: 4
  stem: 依據文章附圖判斷，下列何者最能說明文中主辦國的地理環境？
  options:
  - label: A
    content: 可控制北非運往亞洲的油輪航道
  - label: B
    content: 位於波斯灣沿岸，附近蘊藏石油
  - label: C
    content: 為溫帶地中海型氣候，種植葡萄
  - label: D
    content: 麥加位於境內，屬穆斯林朝聖地。
  group_stem: '地理題組題三

    卡達於 2022 年主辦第 22 屆的世界盃足球比賽，然 而，卡達在爭取主辦世界盃的過程中，引來許多爭論。主要的原因是卡達的人口規模以及國土太小，對於承辦
    世界盃會有很大負擔，對於經濟也沒有太大的助益，由於卡達所處的地理環境特性（見附圖），使其蘊含豐富的「資源」，成為世界上最富有的國家之一，因此卡達不需要藉由舉辦世界盃來振興經濟規模。卡達爭取主辦世界盃的原因主要是為了助長位在伊斯蘭世界的話語權。

    卡達背後所代表的其實是整個阿拉伯世界，甚至是全球超過 15 億人口的穆斯林族群。當卡達在爭取主辦權以 14 比 8 的成績擊敗美國時，伊斯蘭教法學者表示，這是全世界穆斯林對美國的勝利。然而，足球運動在伊斯蘭世界應該是一項「被禁止」
    的運動，因為其違反伊斯蘭教的基本教義，並且是由西方社會傳進來的運動，但許多穆斯林國家都「有條件」允許足球運動。此種由西方傳進來的運動，又成為伊斯蘭世 界對抗西方的武器，因此在足球場上的勝利，可以對外彰顯國家實力，對內凝聚國族
    認同。許多人認為，卡達世界盃也許可以做為伊斯蘭世界與西方世界新的出入口，因 為許多問題都經過折衷與妥協。大量的非穆斯林湧入伊斯蘭世界，使生活以及文化上發生衝突與交流，必然會醞釀以及發酵出新的世界觀。'
  shared_asset: g1_39_40
  tags:
