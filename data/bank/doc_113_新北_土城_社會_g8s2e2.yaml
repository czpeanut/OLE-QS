  stem: 前立委帥化民曾說：「效用不彰的政戰系統早就不該單獨存在」。政戰系統是從黃埔建軍以來便存於國軍體制內，但此系統卻不見於國軍仿效的美國軍事體系之中。政戰系統是在什麼政策下參考哪一個國家的軍事體制？
