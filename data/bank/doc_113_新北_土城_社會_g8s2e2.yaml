  stem: 印度政府計劃遣返居住於其控制的喀什米爾地區約六千名羅興亞難民，引發難民恐慌。羅興亞人原居緬甸，因宗教信仰不同且長期遭受緬甸政府的排擠、歧視與迫害，缺乏法律身分及基本權利，被迫逃離家園。他們主要前往孟加拉、巴基斯坦、喀什米爾等地，或渡海至印尼、馬來西亞尋求庇護，期盼未來能返回緬甸。印度此舉使這些無處可去的難民處境更加艱難。上文首段提及羅興亞難民違法居住的地區應位於附圖中何處？
