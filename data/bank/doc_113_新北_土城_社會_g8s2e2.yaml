- id: doc_113_新北_土城_社會_g8s2e2_s1_61
  section: 1
  number: 61
  type: single
  page: 6
  stem: 根據文章內容，所謂的「太平洋戰爭」，起因於日軍所發動的哪一事件?
  options:
  - label: A
    content: 皇姑屯事件
  - label: B
    content: 珍珠港事件
  - label: C
    content: 九一八事件
  - label: D
    content: 南京大屠殺。
  group_stem: '跨科整合題。請閱讀以下文章回答第61~65題：

    為了獲取維持戰爭機器所需的戰略資源，尤其是在石油和橡膠方面，日本在第二次世界大戰期間將目光投向了資源豐富的東南亞地區。這些資源對日本的戰爭行動至關重要。1941
    年12月，日軍發動太平洋戰爭，隨後迅速入侵東南亞各國，其中包括當時盛產石油的荷屬東印度（今印尼）以及擁有豐富橡膠資源的馬來亞（今馬來西亞）。

    東南亞之所以擁有豐富的橡膠資源，與其豐富的降水量和適宜的氣候條件非常適合橡膠樹的生長息息相關。橡膠是重要的工業原料，尤其在戰爭時期，被廣泛應用於製造輪胎、軍用設備等。此外，東南亞也是重要的石油產地，而石油在現代戰爭中是不可或缺的能源。因此，日軍對東南亞的入侵，不僅體現了其對資源的掠奪，也反映了地理環境對戰爭資源分布的影響。

    在佔領東南亞後，日軍對當地資源進行了大規模的掠奪，嚴重損害了當地人民的利益。這種行為違反了國際法中關於戰爭時期不得掠奪佔領區資源的規定，也侵犯了當地人民的生存權和發展權
    。第二次世界大戰後，國際社會對這種戰爭罪行進行了審判和譴責，強調尊重各國主權和人民的權利。

    面對日軍的佔領，東南亞各國人民進行了各種形式的反抗。這些反抗運動，一方面是為了維護自身的權益和尊嚴，另一方面也是為了爭取民族獨立。許多東南亞國家在二戰後擺脫了殖民統治，這與二戰期間的反抗運動有著密切的關係。這也體現了人民為了抵抗侵略和爭取民族自決而展現出的力量
    。

    歷史學家在研究二戰期間日本對東南亞的侵略時，不僅要分析其軍事行動和經濟掠奪，也要關注戰爭對當地環境造成的破壞，以及對戰後東南亞各國政治、經濟發展的長期影響。這提醒我們，戰爭不僅是國家之間的衝突，也會對地理環境、人民生活和社會發展產生深遠而複雜的影響。'
