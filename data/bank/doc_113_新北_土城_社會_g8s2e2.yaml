  stem: 自2023年10月哈瑪斯襲擊以色列後，以色列反擊引發加薩人道危機。葉門「青年運動」為報復以色列，襲擊紅海及亞丁灣的曼德布海峽商船。為避風險，多家航運公司改道非洲好望角，導致蘇伊士運河，其商船吞吐量大幅減少42%。繞道使航程增加約6480公里、運輸時間增長約15天，運輸成本飆升。紅海危機嚴重衝擊全球航運與經濟。請問：依據上文下列何者為正確敘述？
