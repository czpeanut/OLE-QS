- id: doc_113_新北_土城_社會_g8s2e2_s1_33
  section: 1
  number: 33
  type: single
  page: 3
  stem: 依照印尼政府的計畫，遷都努山塔拉後，仍以雅加達為經濟中心，可見雅加達經濟地位的重要性。事實上，雅加達自大航海時代開始，即承擔該地區熱帶經濟作物出口的重責大任。請問：下列哪一個城市在歷史發展軌跡上與雅加達最相似？
  options:
  - label: A
    content: 尼泊爾加德滿都
  - label: B
    content: 以色列耶路撒冷
  - label: C
    content: 菲律賓馬尼拉
  - label: D
    content: 印度新德里。
  group_stem: "地理題組題一\n印尼目前正計畫將首都從位於爪哇島的雅加達遷往婆羅洲的努山塔拉。雅加達作為荷蘭殖民時期稱為「巴達維亞」的首都，現在面臨著人口過度稠密、基礎設施不堪負荷、交通擁堵、汙水及垃圾問題等嚴峻挑戰。此外，由於大多數居民仰賴地下水，雅加達也是全世界下沉速度最快的城市，且頻繁遭受洪水侵襲。為了解決這些問題並降低地震、海嘯和火山等災害風險，時任印尼總統佐科威在西元2019\
    \ 年宣布遷都計畫。\n  新首都努山塔拉位於人口稀疏的婆羅洲雨林區，面積約2,600平方公里，是雅加達的四倍。努山塔拉的目標是成為淨零碳排的綠色「全球十大宜居城市」，其建城計畫分為五個階段，原定於西元2020\
    \ 年至2045 年完成。然而，由於居民安置、環境保護需求和新冠疫情等因素，工程延遲至西元2022 年8 月才正式開工，預算也從290 億美元增加至320~450\
    \ 億美元。目前，由於投資前景不明以及新政府是否會繼續該計畫仍是未知數，印尼政府在執行遷都計畫方面更加依賴中國的投資資金，這也為遷都計畫帶來了許多變數。"
