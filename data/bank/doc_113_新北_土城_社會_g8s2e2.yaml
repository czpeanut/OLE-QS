- id: doc_113_新北_土城_社會_g8s2e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 關於這三次國際會議對中國的影響，下列敘述何者最準確？
  options:
  - label: A
    content: 巴黎和會和開羅會議都維護了中國的領土完整和主權
  - label: B
    content: 巴黎和會損害了中國的權益，開羅會議和雅爾達會議則維護了中國的權益
  - label: C
    content: 巴黎和會和雅爾達會議都不同程度地損害了中國的權益，而開羅會議則明確支持中國收回失地
  - label: D
    content: 這三次會議都與中國的利益無關，只是大國之間權力分配的結果。
  group_stem: '請閱讀以下敘述，回答17-18 題:

    第一次世界大戰結束後，戰勝國於1919 年召開巴黎和會，討論戰後世界秩序的安排，其中關於中國的議題主要涉及德國在山東的權益轉讓給日本，引發中國強烈不滿。1943
    年，中、美、英三國在開羅召開會議，發表《開羅宣言》，明確表示戰後日本必須歸還其自中國奪取的所有領土，包括東北、台灣、澎湖列島等。1945 年，二戰接近尾聲，美、英、蘇三國在雅爾達召開會議，討論對日作戰及戰後遠東安排，其中一項決議是在蘇聯對日宣戰的條件下，蘇聯將恢復其在日俄戰爭中失去的在中國東北的某些特權。'
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 歷史
      code: 4-1
      title: 中日戰爭
      chapter: 第4章 現代國家的變局
