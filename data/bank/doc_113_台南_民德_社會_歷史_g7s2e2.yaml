  group_stem: "(二) 你可曾聽聞，臺南女中操場旁的金龜樹下，有著一段特別的故事？\n   丁窈窕生於1927 年，日治時期就讀台南州立台南第二高等女學校（原校址為現今中山國中），後來第一、二高女合併，即現在的台南女中。丁窈窕畢業後，任職台南郵局，她不過是提醒好友別和心術不正的人交往，結果被心有不甘的人檢舉誣陷涉入「台南市委會郵電支部案」為匪宣傳，後被當時的國民黨政權押進牢獄。\n\
    \    當時這位被羅織罪名，不得已在獄中產下幼女養育，在獄中長大的小女兒，似乎知道呼喊某人名字出來，就是赴死一去不返。當丁窈窕被獄中管理人員叫出來時，她緊抱著媽媽大聲哭叫「我媽媽不是壞人，你們不要槍斃她！」，但聲嘶力竭仍扺不過殘酷，母女親情硬被扯斷，丁窈窕被押在槍桿底下結束青春生命。\n\
    \    她在關牢期間，她意外碰到昔日摯友郭振純。當時他被依「連續參加叛亂之集會罪」遭判無期徒刑。丁窈窕自知難逃一死，輾轉將訣別的話與一撮頭髮交給他。郭振純遭遇拔指甲等酷刑都未招供，最後被判處無期徒刑，一直到特赦出獄後，他將丁窈窕的頭髮用紙袋裝好，埋在臺南女中操場旁的一棵金龜樹下。"
