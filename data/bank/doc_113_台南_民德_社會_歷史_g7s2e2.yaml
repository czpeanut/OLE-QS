- id: doc_113_台南_民德_社會_歷史_g7s2e2_s1_39
  section: 1
  number: 39
  type: single
  page: 4
  stem: 蔡阿信的繼父知道她天生就是讀書的料，就把她送到了大稻埕的學校繼續學習，請問她就讀的學校可能是下列何者？
  options:
  - label: A
    content: 公學校
  - label: B
    content: 醫學校
  - label: C
    content: 小學校
  - label: D
    content: 國語學校。
  group_stem: "(一)臺灣第一位受過現代醫學訓練的女醫師，培養無數助產士的台中之母——蔡阿信。作家東方白曾以她為原型， 寫下《浪淘沙》這部小說。請閱讀完後，回答下列問題:\n\
    \    蔡阿信出生於1899年，五歲時生父去世，她被送作童養媳，卻兩次從領養家走回生母家，所以母親後來就帶著她和妹妹改嫁， 慶幸的是，繼父很疼她，怕她痛而不讓她纏足，知道她天生就是讀書的料，在她8歲送到了大稻埕的學校學習，只是在日治初期，能上學的人很少，能上學的女生更少，全校只有阿信一個女生。\
    \ 18 歲從淡水女學校畢業的阿信，在老師的強力推薦、以及疼愛她的繼父死於肺結核的雙重動力下，不顧周圍「女孩子不用念這麼多書」的聲音，隻身一人到內地醫校進修，考上了東京女子醫科大學。1921年，她返回臺灣後，先是在臺大醫院的眼科實習，後來到臺中和丈夫一起開了「清信醫院」，並秉持著「貧者少收，赤貧免費」的標準，拯救了許多貧苦人們的生命。雖然她的醫術受到大眾肯定，但她發現，在臺灣婦女生產還是依靠產婆較多，很多產婆沒有受過專業訓練，導致婦女生產的死亡率居高不下。於是她在醫院底下附設清信產婆學校，並親自教學，教出了300\
    \ 位產婆，又被稱作「臺中之母」，因為當時臺中至少有一半的人是由阿信或她教出的產婆接生的。」"
