  group_stem: "(三) 請閱讀短文並回答問題:\n    1921 年，臺灣總督在日本貴族院院會表示：帝國統治的方針，不像英國讓殖民地設置獨立議會、制定法律、議定預算的殖民地政策，而是當作正在施行帝國憲法的地方，和內地同樣自然處理，提升其文化，使之與內地相同。如果做此形容，如同內地延長主義的型態。但本件請願\
