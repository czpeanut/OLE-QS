- id: doc_113_高雄_光華_英語_g8s2e1_s5_37
  section: 5
  number: 37
  type: single
  page: 6
  stem: (37) Why did Medusa want to visit the south part of Greece?
  options:
  - label: A
    content: Medusa wanted to meet new people. They were more fun than the people
      in the north.
  - label: B
    content: Medusa wanted to show everyone. She was the most beautiful girl.
  - label: C
    content: Medusa thought the south was more fun than the north where she lived.
  - label: D
    content: Medusa believed she could find a different goddess, and this goddess
      would be smarter than Athena.
  group_stem: 'C.

    Medusa and Athena

    Once upon a time in Greece, there was a very beautiful girl. Her name was Medusa.
    She had a lovely face, and her hair was more beautiful than any other girl’s.
    No one could forget how pretty Medusa was because she was as charming as a goddess.
    Medusa was not a common human. She was born to a Greek god and goddess. She lived
    with her family in a land far away in the north of Greece. One day, she became
    more interested than before. She wanted to visit the south because she thought
    it was more interesting than the place she lived. But as a member of the gods’
    family, she had to ask the powerful goddess Athena if it was okay. Athena was
    wiser than any other goddess.


    When Medusa asked, Athena said no. Medusa felt unhappier than ever before. She
    thought Athena did not want her to go because Athena was less beautiful than she
    was. Medusa believed she was the most beautiful girl of all. When Athena heard
    what Medusa said, she became much angrier than ever before. Athena wanted to punish
    Medusa. She changed Medusa’s hair into the scariest snakes. People didn’t ever
    see them before. Medusa became uglier than all the other animals. From then on,
    anyone looking at Medusa would turn to stone.


    A few years later, Perseus, a Greek hero, was braver than most fighters. He cut
    off Medusa’s head and ended her saddest life.


    ☕ Greece 希臘/ charming 迷人的/ goddess 女神/ born 出生/ punish 懲罰/ brave 勇敢的'
