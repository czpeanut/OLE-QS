  stem: (34) In the reading, Labrador Retrievers are the one of the most popular hunting
    dogs in America. This is because they are stronger and faster than many other
    breeds, and they also have a skill. This skill makes them useful for hunters.
    What is this special skill in hunting?
  options:
  - label: A
    content: Labrador Retrievers have soft fur. This fur helps them stay warm in very
      cold weather, and it makes them perfect for hunting in snowy forests. Other
      dogs may not stay long in these places, but Labrador Retrievers can.
  - label: B
    content: Labrador Retrievers have a strong skill to follow their owners’ orders.
      This is why hunters can easily train them to bring back small animals.
  - label: C
    content: These dogs like working alone without depending on humans. This helps
      them be very good at finding their own food and living in the wild without help.
  - label: D
    content: This breed is famous for its friendly nature. This makes it easy for
      them to live lightly with other dogs and animals. It is a great pet for people.
      They like nice and kind pets at home.
  group_stem: 'B.

    Dogs have always been important in human life. They are as loyal as any other
    pet, and their history goes back a long time. Scientists believe that wolves and
    dogs have the same ancestors. Today, there are more than 150 breeds of dogs, and
    each breed is special in its own way.


    Some breeds are stronger than others because they were bred for hunting. For example,
    the Labrador Retriever is one of the most popular hunting dogs in America. It
    is faster and stronger than many other breeds. Besides, it follows orders more
    easily than most other dogs. But not all dogs were bred for hunting. Some are
    smaller and cuter because people wanted friendly pets to stay with them. Of all
    small dogs, the Pomeranian is one of the most popular. It is as fluffy as a little
    cloud, and it is also lighter than many other breeds. That’s why people like to
    hold it on their laps at home.


