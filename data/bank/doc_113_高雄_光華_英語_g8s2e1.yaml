- id: doc_113_高雄_光華_英語_g8s2e1_s5_31
  section: 5
  number: 31
  type: single
  page: 4
  stem: (31) What does “cat got your tongue” mean in the story about Team Taiwan?
  options:
  - label: A
    content: The team spoke a lot and was sure of themselves during the game.
  - label: B
    content: The team couldn’t speak because they were too tired.
  - label: C
    content: The team was excited and kept cheering each other on.
  - label: D
    content: The team was quiet and didn’t know what to say during a difficult moment.
  group_stem: 'A.

    The Taiwan baseball team entered the 2024 WBSC Premier12 full of hope. Many fans
    were excited to see their team play. Some people said that Team Taiwan was all
    bark and no bite because they talked a lot about winning the games, but their
    past games didn’t seem to show they could win the top teams. Team Taiwan wanted
    to show the people who said these things were wrong.


    In the first few games, Team Taiwan faced some strong teams. It was like herding
    cats. Each player needed to pay attention and work hard, but they had different
    ideas about how to win. It wasn’t easy, but they tried their best. Sadly, the
    weather wasn’t helpful. It rained cats and dogs during one of their biggest games,
    making the field wet and slippery. The players were very tired, but they kept
    playing, not giving up.


    After the rain stopped, Team Taiwan finally won their next game. The team played
    very well, and the fans were cheering loudly. The players were no longer afraid
    to show their skills, and they were more confident. It was clear that they had
    more confidence. From that moment on, they played better than ever before, and
    they were ready to face any challenge.


    However, they still had one hard game to play. They knew the challenge would be
    difficult, and there were moments when they felt worried. Sometimes, it felt like
    they had cat got your tongue because they couldn’t say anything, but in the end,
    they overcame their fear and played their best game. Team Taiwan finished the
    games proud of their efforts, and everyone could see they did their best.


