    and brings people from different countries. The expo will be one of the (26) events
    in Japan’s recent history, attracting millions of visitors from around the world.
    The main idea of this big event is "Designing Future Society for Our Lives." It
    talks about fixing global problems and making life (27) for everyone.


    The Osaka Expo will take place on Yumeshima, a man-made island in Osaka Bay. This
    location is (28) than many other expo sites because it is designed to be both
    modern and eco-friendly. Many countries will build their own buildings to show
    their newest technology and culture. Visitors can look around a lot of amazing
    shows, experience in person, and try delicious food from different parts of the
    world.


    Of all the attractions, Japan’s building is going to be (29) in the expo. It will
    show the country’s most high-level technology, like robots and man-made smarts.


    My friend and I are very happy because we will visit the expo with (30) families.
    We can’t wait to see what the future will look like!


