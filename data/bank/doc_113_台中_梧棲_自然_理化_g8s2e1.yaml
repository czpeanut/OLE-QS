    content: 二氧化硫
  - label: C
    content: 次氯酸鈉
  - label: D
    content: 過氧化氫
  group_stem: 食品中的二氧化硫來自於食品添加物：亞硫酸鹽類，如亞硫酸鈉（$Na_{2}SO_{3}$）、亞硫酸鉀（$K_{2}SO_{3}$）等。這些添加物具有「還原性」，可漂白食品，也能防止食物中的分子變質、腐敗，導致顏色、味道改變。像是果乾或蔬菜乾等常見乾貨，也會添加亞硫酸鹽來保存和維持顏色。在如食品等富含水分的環境中，亞硫酸鹽類的部分分子會轉變為二氧化硫，便可被檢測到。因此，檢驗單位利用食品中所含二氧化硫的量，以回推添加劑的使用量，並做出限制規範。
