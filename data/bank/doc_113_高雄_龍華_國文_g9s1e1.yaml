  stem: 以下是小銘對甲文寫作手法的分析，下列分析何者最恰當：
  options:
  - label: A
    content: 以反面著手，表達對秦嘉的來信以及贈物的感謝
  - label: B
    content: 接著從正面著墨，以不同意丈夫來信有關贈物的告誡，令人不解作者心思
  - label: C
    content: 而後揭曉謎底，並引用歷史典故，娓娓道來因丈夫不在身旁而沒有動力打扮的幽微心事
  - label: D
    content: 文末用對比手法描寫遠別對彼此造成的痛苦程度和思念之情，暗暗昭示兩人若永別以後的發展
  group_stem: '閱讀甲、乙兩文，回答 38-40 題。

    甲

    既惠音令①，兼賜諸物②。厚顧殷勤，出於非望。鏡有文采之麗，釵有殊異之觀，芳香既珍，素琴益好。惠異物於鄙陋，割所珍以相賜，非豐恩之厚，孰肯若斯。覽鏡執釵，情想髣髴③。操琴詠詩，思心成結。敕④以芳香馥身，喻以明鏡鑑形，此言過⑤矣，未獲我心也。昔詩人有「飛蓬」之感⑥，班婕妤有「誰榮⑦」之嘆。素琴之作，當須君歸；明鏡之鑑，當待君還。未奉光儀⑧，則寶釵不設也；未侍帷帳，則芳香不發也。（徐淑〈又報嘉書〉）

    注釋：①音令：書信 ②諸物：丈夫秦嘉所贈之鏡、釵、香料、素琴四物 ③髣髴：同「彷彿」 ④敕：告誡 ⑤過：錯 ⑥「飛蓬」之感：出自《詩經》，指婦人在家無心修飾打扮自己
    ⑦誰榮：為誰打扮 ⑧光儀：丈夫漂亮的儀容

    乙

    若夫銀鉤鐵畫，固屬難窺。儷白妃青，亦非易事。余因停機教子之餘，調藥助夫之暇，竊慕管夫人之墨竹，紙上生風；敢藉陶彭澤之黃花，圖中寫影。庶幾秋姿不老，四座流芬，得比勁節長垂，千人共仰，竟率意而鴉塗，莫自知其鳩拙云爾。（張李德和〈畫菊自序〉）'
