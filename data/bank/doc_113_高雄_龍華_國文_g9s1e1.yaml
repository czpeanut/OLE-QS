- id: doc_113_高雄_龍華_國文_g9s1e1_s2_43
  section: 2
  number: 43
  type: single
  page: 8
  stem: '新北市立圖書館在 2014 年 8 月 14 日舉辦「真人圖書館」的啟動儀式，邀請在各個領域、不同生命經驗的「真人圖書」，和民眾面對面溝通分享。「真人圖書館」的借閱規則如下：

    (1)採預約制，需於一週前預約，已預約之讀者憑借閱證至圖書館服務臺登記後始能借書，每人每次限借 1 本書，最多可以 10 人同時借閱一本「真人圖書」。

    (2)12 歲以下讀者不得單獨借閱「真人圖書」，需由家長陪同借閱。

    (3)每次借閱時間以 30 分鐘為限，必要時得延長至 45 分鐘。

    (4)若無他人預約，在書本與讀者雙方同意之下，可向館員辦理續借一次。

    (5)「真人圖書」限館內閱讀，不提供外借服務。

    (6)「真人圖書」有權利選擇隨時終止借閱。

    (7)「真人圖書」借閱完畢後，必須回圖書館服務臺辦理還書手續，並結束雙方關係。

    依據上文，下列敘述何者符合新北市的「真人圖書館」的借閱規則？'
  options:
  - label: A
    content: 及川與「真人圖書」相談甚歡三小時，並一路從圖書館聊到咖啡廳
  - label: B
    content: 小學生翔陽閱讀「真人圖書」時，媽媽在一旁共讀，兩人皆受益良多
  - label: C
    content: 月島熱衷與「真人圖書」對話，一次預約了三本「真人圖書」同時訪談記錄
  - label: D
    content: 影山當天隨意選了一本「真人圖書」，與之暢所欲言，於結束時預約了下次借閱時間
