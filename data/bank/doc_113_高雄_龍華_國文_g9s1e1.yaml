- id: doc_113_高雄_龍華_國文_g9s1e1_s2_36
  section: 2
  number: 36
  type: single
  page: 6
  stem: 根據本文，下列何者不是好吃的蛋黃酥應具備的條件？
  options:
  - label: A
    content: 蛋黃表面要有一圈圈漣漪般的紋路
  - label: B
    content: 蛋黃要在內餡的正中央
  - label: C
    content: 內餡要滑潤綿密、甜而不膩
  - label: D
    content: 餅皮要鬆軟不乾澀、入口即化
  group_stem: 早期從淡水到關渡一帶河岸，養鴨人家多，皆擅長製作鹹鴨蛋。只要以鹽、紅土包覆鴨蛋，再加上長時間醃漬，便能製成。因此，淡水河兩岸的糕餅師傅從五、六○年代就開始用鹹鴨蛋做糕餅，這種鹹中帶甜，噴香油潤的滋味，很快風靡全臺。蛋黃酥是正港臺灣味，外觀是油皮包酥皮，類似綠豆椪、芋頭酥。反覆摺疊出層次，再刷上蛋黃烘烤，是臺式糕餅常用的揉麵技巧。對比近幾年來新一代的蛋黃酥，餅皮有紅麴、芝麻、紅蘿蔔、抹茶等，五顏六色熱鬧繽紛。內餡則有如地方采風錄，文山包種茶、觀音山綠竹筍、雙溪山藥、淡水吻仔魚、八里文旦柚、山野櫻花葉等都被請進蛋黃酥裡。老師傅傳承製餅技術，年輕師傅則回饋創意巧思。如用碎蛋黃與南瓜餡料重新組合，或用蛋黃粉拌合豆沙餡，讓品嘗蛋黃酥變得輕盈許多。好吃的蛋黃酥要具備以下條件：餅皮金黃有光澤、香酥且層次多而分明，鬆軟而不乾澀，入口即化。蛋黃要毫無腥味、鹹味適中，表面要細緻光滑，不可以有一圈圈漣漪般的雜質。內餡則要滑潤綿密、甜而不膩。而鹹蛋黃要在內餡的正中央，要讓每一口都可以吃得到甜中帶鹹的滋味。總而言之，餅皮、蛋黃、內餡三者比例要均衡，內餡與蛋黃口味融合，不互相搶味。蛋黃酥是純手工糕餅，沒有模型，無法用機器代勞，一顆顆純粹是師傅雙手的記憶，累積成靈活忘我的技藝。每顆蛋黃酥都留有師傅手心的溫度，從揉麵粉、擀油皮、做層次、包內餡，雙手輪流轉動，形塑出完美球體。手的輕重勁道早就決定蛋黃酥的質地口感，繁複費工，是最能代表臺灣道地食材與傳統手工製餅藝術的糕餅，堪稱可食用的手工藝術。(趙敏夙〈蛋黃酥〉)
