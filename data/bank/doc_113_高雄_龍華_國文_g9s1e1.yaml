  stem: 關於本文的敘述，下列何者正確？
  options:
  - label: A
    content: 臺灣於二○一一年，由臺北市率先引進「真人圖書館」，引起一陣風潮
  - label: B
    content: 「真人圖書館」為實體機構，讀者登記後能與「真人圖書」面對面交談
  - label: C
    content: 羅尼．艾柏格因親身經歷族群糾紛，而有了執行「真人圖書館」的概念
  - label: D
    content: 「真人圖書館」概念自音樂節成形，羅尼．艾柏格邀請七十五本真人圖書現身說法
  group_stem: '一、簡 介

    「真人圖書館」（Living Library）並不是真的圖書館，而是用一種幽默且創新的方法，促進人與人之間的對話、增進彼此理解、打破刻板印象與偏見，進而消除歧視與暴力。就像真的借書程序，讀者登記後，可依主題借出「真人圖書」，面對面交談三十至四十五分鐘，通常這樣的活動會在校園內、圖書館、書展、校慶等各種場合舉辦，由於發展超過十年，這些「書本」的內容也更多元化，從早期的受歧視者，現在加入更多令人好奇的職業，例如記者、警察、殯葬業者、政治圈人物、身障人士等，藉此促進人權及社會凝聚，尊重多元文化。

    二、源 起

    一九九三年，一位居住在丹麥的混血青年羅尼．艾柏格，因為看到朋友因族群糾紛遇刺重傷，震驚之下，他和朋友們開始思考種族衝突的議題。他發現許多暴力其實是由於不了解而造成誤會，進而產生衝突，唯有彼此理解，才能相互包容。二○○○年，艾柏格跟朋友們受邀籌辦丹麥羅斯克爾德音樂節，以「反暴力」為主題，透過音樂作媒介，讓參加的民眾透過面對面的溝通，消弭對彼此的誤解。「真人圖書館」的概念由此萌芽成形。同年他舉辦真人圖書館活動，邀請了七十五本真人圖書，他們大多是身分易受爭議或歧視的人，例如：變性人、同性戀者、愛滋病患、遊民。「真人圖書館」由此應運而生，艾柏格的創作理念是︰「我們活在一個需要對話的時代，隨著理解帶來的是寬容。暴力與攻擊源於人們彼此的不了解，Living
    Library 讓原本不可能見面的人進行對話，並打破一般人對某些特定人的刻板印象或偏見。」他積極推廣這個理念，甚至到世界各地「打書」，目前已擴及全球三十多國，而臺灣也於二○一一年由高雄市政府率先引進。

    三、真人圖書

    （一）難民─瑪密特．那哈帝阿尼

    瑪密特．那哈帝阿尼是一位房地產商，但他曾經是個不良少年。六歲那年，他和家人從伊朗來到丹麥難民營，上學時總是遭到同學聯手霸凌，他始終不知道同學們欺負他，是因為他的膚色、宗教、身材瘦小、太窮酸，還是以上皆是。八歲時他坐公車，一位老婦人竟然對他說︰「滾回你的國家去！」這句話對他的殺傷力非常大，他除了傷心以外，也感到憤怒。這樣的憤怒在他成長過程中不斷累積，於是他開始結夥鬧事，直到他效法由難民當上牙醫的母親，重拾書本，才以成功證明自己。他認為社會大眾對移民總是質疑，希望改變世界對人的看法，所以成為真人圖書館中的一本書。

    （二）穆斯林─亞斯敏．羅札葉．歐斯德

    亞斯敏．羅札葉．歐斯德是丹麥人，十八歲時，她決定遵循父親的穆斯林信仰。她原本跟一般女孩一樣，染髮、化妝，打扮自己，直到她看了《古蘭經》︰「不要將你的美貌給人看，你才能分辨他們愛的是你，而不是你的長相。」她認為十分有道理，於是開始戴起頭巾。但從她戴頭巾的這天起，旁人對她的態度卻有了極大的轉變。因為頭巾，她得接受跟著「穆斯林女性」而來的刻板印象與歧視。例如她被問：「你有上學啊？」因為大部分人以為穆斯林女性是「受男性欺壓，連學校都不能上」、「你應該結婚了吧？」因為穆斯林女人應該沒受教育，而且早早結婚生子去了。正念護校、也是足球隊員的亞斯敏說，剛開始面對這些標籤，她簡直要瘋了，但她明白，偏見是因為「他們不知道」。所以她加入「真人圖書館」，成為可借閱的「活書」，希望透過溝通與對談，讓人們互相理解。

    四、結 語

    每個人都是一本書，而且開卷有益，當我們跟真人圖書面對面坐下，問出平常看不慣或不易啟齒的問題，聆聽答案，理解對方的想法，我們也就閱讀了他的人生，吸收了他的智慧。也許我們會因此改變我們固有的成見與想法，當愈來愈多人都願意跟不同身分的人相互交流時，相信整個社會上的偏見、歧視與衝突，也會愈來愈少。(〈真人圖書館，你去過了嗎？〉)'
