  stem: 有關豐樂亭「命名」的原因，下列敘述正確的是：
  options:
  - label: A
    content: 此地歲物豐收，人民得享豐年之樂，故以「豐樂」命名
  - label: B
    content: 「豐樂」為當代皇帝之年號，以此命名乃在歌頌皇恩浩蕩
  - label: C
    content: 此地原為貧瘠之地，藉「豐樂」之名祈求人民生活安定
  - label: D
    content: 「豐樂」為歐陽脩之自號，此亭又為他所建，故以此命名
  group_stem: '今滁介江、淮之間，舟車、商費、四方賓客之所不至。民生不見外事，而安於畎畝衣食，以樂生送死，而孰知上之功德，休養生息，涵煦於百年之深也！

    脩之來此，樂其地僻而事簡，又愛其俗之安閒。既得斯泉於山谷之間，乃日與滁人仰而望山，俯而聽泉。掇幽芳而蔭喬木，風霜冰雪，刻露清秀，四時之景，無不可愛。

    又幸其民樂其歲物之豐成，而喜與予遊也。因為本其山川，道其風俗之美，使民知所以安此豐年之樂者，幸生無事之時也。

    夫宣上思德，以與民共樂，刺史之事也。遂書以名其亭焉。（節選自歐陽脩〈豐樂亭記〉）'
