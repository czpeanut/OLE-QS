  stem: 詞可大略分為婉約派與豪放派兩種風格，哪一個選項最不接近豪放派詞風？
  options:
  - label: A
    content: 黯鄉魂，追旅思，夜夜除非，好夢留人睡。明月樓高休獨倚，酒入愁腸，化作相思淚
  - label: B
    content: 靖康恥，猶未雪；臣子恨，何時滅？駕長車踏破賀蘭山缺。壯志飢餐胡虜肉，笑談渴飲匈奴血。待從頭、收拾舊山河，朝天闕
  - label: C
    content: 千古江山，英雄無覓，孫仲謀處。舞榭歌臺，風流總被，雨打風吹去。斜陽草樹，尋常巷陌，人道寄奴曾住。想當年，金戈鐵馬，氣吞萬里如虎
  - label: D
    content: 大江東去，浪淘盡，千古風流人物。故壘西邊，人道是、三國周郎赤壁。亂石崩雲、驚濤裂岸，捲起千堆雪。江山如畫，一時多少豪傑
