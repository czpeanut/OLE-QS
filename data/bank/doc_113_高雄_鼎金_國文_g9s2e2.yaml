    content: 保護自然生態。
  group_stem: "臺灣紫斑蝶每年冬季集中在臺灣南部山谷過冬，春季則在春分日前後開始北遷到臺灣中北部地區，其遷徙路線會穿越國道三號林內段。為引領紫斑蝶安全遷徙，交通部\
    \ 高公局史無前例地為紫斑蝶研擬「高速公路疏運計畫」，這是世界首見的搶救蝴蝶大作戰。\n  高公局表示，為引導紫斑蝶從橋下通行，避開高速公路車流，將在林內段、清水溪橋下加裝紫外線燈管，希望趨光性的紫斑蝶往下飛，避開車輛。另外，國道三號斗六交流道至竹山交流道間部分路堤，將加裝\
    \ 200 公尺長、2.5 公尺高的防護網，讓飛越高速公路的紫斑蝶「飛高一點」，避免被車撞。\n  紫斑蝶經過林內段主要在三月中旬至四月中旬，預判尖峰期為三月二十六日至四月六日，時段在每天上午九時至中午十二時。當觀察到一分鐘有二千隻紫斑蝶同時通過時，高公局將封閉\
    \ 251.7 公里至 252.3 公里林內段北上外側車道，共 600 公尺，封閉時間為一至三天。高公局也提醒用路人，行經國道三號林內路段時，如果碰到滿天蝴蝶飛舞，不要放慢速度，維持原有車速，絕對不要突然減速或停車觀賞，以免危及行車安全。"
