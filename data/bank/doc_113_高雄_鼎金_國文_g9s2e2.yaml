  stem: 「醉里挑燈看劍，夢回吹角連營。八百里分麾下炙，五十弦翻塞外聲。沙場秋點兵。    馬作的盧飛快，弓如霹靂弦驚。了卻君王天下事，贏得生前身後名。可憐白髮生！」關於這闋詞的分析，下列敘述何者錯誤？
  options:
  - label: A
    content: 上闋描繪出酒醉後夢中勇往直前的將軍形象
  - label: B
