  stem: 「風急天高猿嘯哀，渚清沙白鳥飛回。無邊落木蕭蕭下，不盡長江滾滾來。萬里悲秋常作客，百年多病獨登台。艱難苦恨繁霜鬢，潦倒新亭濁酒杯。」關於這首詩的說明，下列敘述何者最恰當？
  options:
