- id: doc_113_高雄_鼎金_國文_g9s2e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 「言由心生，心裡真的尊重別人才會有善言，這和虛偽是不一樣的。見過太多打著『直率』的旗號，對自己的言語不負責任的人。這才不是什麼真性情，才不是什麼單純率真，更不是什麼坦誠直率。這只是一個自私的人，說話不經大腦，無視他人感受，不克制情緒，不顧忌影響，肆無忌憚地只圖自己痛快。」下列情境，何者最符合這段文字內容？
  options:
  - label: A
    content: 真心好友可以隨意開玩笑
  - label: B
    content: 家人間溝通不必說好聽的話
  - label: C
    content: 與上司對話應該巧言令色
  - label: D
    content: 與人說話應時刻保持謹慎。
