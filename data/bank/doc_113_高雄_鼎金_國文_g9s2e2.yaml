    | (B) | 你是否同意政府應全面禁止進口含有萊克多巴胺之乙型受體素豬隻之肉品、內臟及其相關產製品？ | 應禁止進口含萊克多巴胺豬肉 | 同意 |

    | (C) | 你是否同意公民投票案公告成立後半年內，若該期間內遇有全國性選舉時，在符合公民投票法規定之情形下，公民投票應與該選舉同日舉行？ | 綁大選有助投票率
    | 不同意 |

    | (D) | 您是否同意中油第三天然氣接收站遷離桃園大潭藻礁海岸及海域？（即北起觀音溪出海口，南至新屋溪出海口之海岸，及由上述海岸最低潮線往外平行延伸5
    公里之海域） | 不應選在有千年生態價值的大潭藻礁海域 | 不同意 |'
  options:
