- id: doc_113_高雄_鼎金_國文_g9s2e2_s2_27
  section: 2
  number: 27
  type: single
  page: 4
  stem: 根據這則新聞，下列何者敘述正確？
  options:
  - label: A
    content: 雪季期間，要登玉山得事先申請入園許可
  - label: B
    content: 使用雪地三寶就不用擔心滑落或墜谷事件發生
  - label: C
    content: 兩名山友不幸墜谷是因為拍照沒有注意懸崖
  - label: D
    content: 登山受困可以尋求幫助不用受罰。
  group_stem: "玉山積雪2 山友不幸墜谷，未帶「雪地三寶」\n最重罰禁入園3 年\n中央社    追蹤2025-03-23   瀏覽數 17,900\n\
    \    【編按】別被好天氣與美麗雪景騙了！週末傳出兩名山友登玉山不幸墜谷，國家公園署與玉管處特別發出警告，表示玉山冰晶美景步道暗藏危機，民眾應改期登山或備妥「雪地三寶」等安全措施，否則將加以裁罰。\n\
    \    近期雪山、玉山積雪，陸續有山友攀登時發生山難。國家公園署說，3 月31 日前仍在公告雪季期間，如未取得入園申請許可，或未依規定帶雪地裝備等導致影響安全及耗費社會資源，將依違反國家公園法裁罰或最高禁止入園3\
    \ 年處分。\n    國家公園署今天透過新聞稿表示，強烈冷氣團助威，近期雪山、玉山等國家公園都有明顯降溫、冰凍現象，但卻陸續發生山友滑落、墜谷、或受困失溫等山難。\n\
    \    國家公園署說，目前高山積雪稍融，導致結冰易滑，就算有冰爪、冰斧也非常危險，呼籲民眾不要被山下好天氣騙；還沒上山者建議改期，已在山上者請正確使用雪地三寶「岩盔、冰爪、冰斧」，並專注腳步，以免滑落墜谷，影響生命安全及救援資源。\n\
    \    國家公園署提出4 大安全建議，包括穿著防寒衣物、保暖手套及防滑鞋，如屬於高山雪地攀登活動，請符合自身能力及攜帶雪地裝備，可優先考量改期；出發前先查詢山區天氣與道路狀況，隨時保持警覺；駕駛時注意道路結冰及霧氣，保持低速並謹慎行駛；避免接近懸崖或有落石危險的區域。\n\
    \    國家公園署呼籲，民眾在體驗山林之美前，務必確實做好體能評估、擬訂行前計畫及緊急狀況應變等，多方掌握資訊，做好萬全準備，維護自身安全也避免受罰。"
  shared_asset: g2_27_29
