  stem: '高雄市政府活動宣傳新聞。根據內容，下列敘述何者正確？

    去年締造3 日11 萬人次的「法國生活節在高雄」，2025 年5 月23 日至25 日即將再度重返駁二！高雄市政府行政暨國際處長張硯卿表示，市府再度攜手法國在台協會與台灣法國人協會，以「法國蔚藍海岸」為主題，邀請法國知名插畫家操刀主視覺，透過藝術文化、美食與科技，以更盛大規模打造沉浸式台法文化體驗，更倡議海洋保育，「邀請大家一起享受這場精采可期的台法盛宴！」'
  options:
  - label: A
    content: 活動主題是海洋環保
  - label: B
    content: 沒有告知活動地點
  - label: C
    content: 「法國生活節」高雄不是第一次舉辦
  - label: D
    content: 操刀的意思是現場有廚師烹調食物。
