  stem: '(楚)成王厚遇重耳，重耳甚卑(1)。成王曰：「子即反國，何以報寡人？」重耳曰：「羽毛齒角玉帛，君王所餘(2)，未知所以報。」王曰：「雖然，何以報不穀(3)？」重耳曰：「即不得已，與君王以兵車會平原廣澤，請辟(4)王三舍(5)。」(註：1
    卑：謙卑。2 餘：意旨很多。3 不穀：古代君王自謙之詞。4 辟：通「避」，避讓之意。5 舍：古代度量單位，一舍三十里。)

    根據這則故事，下列敘述何者最恰當？'
  options:
  - label: A
    content: 重耳承諾成王，日後兩國發生戰爭，我方軍隊後退以報恩
  - label: B
    content: 成王被重耳威脅日後若征戰，楚國得奉獻三座屋舍
  - label: C
    content: 成王禮遇重耳是真心不求回報
  - label: D
    content: 重耳用稀世珍寶感謝成王的厚愛。
