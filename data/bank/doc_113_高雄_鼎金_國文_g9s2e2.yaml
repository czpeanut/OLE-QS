  options:
  - label: A
    content: 襤褸荷校──還魂者衣服破爛，還戴著刑具
  - label: B
    content: 不覺握手太息曰──得流行病死去的還魂者不自覺握住老朋友的手嘆息說
  - label: C
    content: 生前有功德者，至此何嘗不富貴耶？──活著的時候多認真努力賺錢，來地府怎麼會不富貴呢？
  - label: D
    content: 善哉斯言，勝於謂富貴皆空也──善意的欺瞞呀！勝過說富貴都是虛空泡影。
  group_stem: '有疫死還魂者，在冥司遇其故人，襤褸荷校(1)。相見悲喜，不覺握手太息曰：「君一生富貴，竟不能帶至此耶？」其人蹙然(2)曰：「富貴皆可帶至此，但人不肯帶耳。生前有功德者，至此何嘗不富貴耶？寄語世人，早作帶來計可也。」李南澗曰：「善哉斯言，勝於謂富貴皆空也。」

    （紀昀《閱微草堂筆記‧陰陽富貴》）註：1 校：古代刑具。2 蹙然：憂愁貌。'
