  stem: 「蕭敬騰因為有閱讀障礙，不是很愛念書；在學生時期是個典型的不良少年，抽菸、打架、霸凌同學樣樣來，讓老師和家人很頭痛。直到有一天，他因緣巧合接觸到打鼓，發現自己在打鼓時，心可以靜下來，因而萌生對音樂的熱愛。隨著這分熱情，他戒掉了菸，收斂起衝動的個性，開始專心走音樂的道路。」根據本文，蕭敬騰可以改變的原因，下列何者最符合？
  options:
  - label: A
    content: 他對音樂的熱愛讓他戒除壞習慣
