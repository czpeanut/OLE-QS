  stem: '《原子習慣》採用的策略是把任務變簡單，讓習慣是輕而易舉能完成的，也就是不用「跳出舒適區」而是透過日積月累，讓「舒適區變大」。一如書中所說的，每天都進步百分之一，一年後，你會進步三十七倍；每天都退步百分之一，一年後，你會弱化到趨近於零！

    關於這段文字與下列選項的文意配對，何者最恰當？'
  options:
  - label: A
    content: 駑馬十駕，功在不舍
  - label: B
    content: 為樂當及時，何能待來茲
  - label: C
    content: 寧可做過，不可錯過
  - label: D
    content: 習慣形成性格，性格決定命運。
- id: doc_113_高雄_鼎金_國文_g9s2e2_s2_25
  section: 2
  number: 25
  type: single
  page: 4
  stem: 對於人格測驗MBTI 的描述，何者正確？
  options:
  - label: A
    content: 這項測驗從十六個向度來分類性格，藉此可以將子女塑造成心目中的理想模樣
  - label: B
    content: 這項測驗比星座分析更加準確，成為現今人格參考的唯一方式
  - label: C
    content: MBTI 將人格分為16 個二元對立的維度
  - label: D
    content: 這項測驗能使父母對子女的個性有進一步的認識與了解。
  group_stem: "MBTI 將個人的偏好分成4 個二元對立維度，包括內外向類型（外向E／內向I）、感知偏好（感覺S／直覺N）、判斷事物傾向（思考T／情感F），以及生活模式的認知（判斷J／知覺P）。將這4\
    \ 個維度組合起來後，便形成了16種不同的人格類型，例如提倡者型（INFJ）、企業家型（ESTP）。人格類型的不同，除了意味着每個子女有不同個性，亦有着不同的學習模式，而家長亦可與子女有不同的相處和溝通方式。\n\
    \    1.認識子女的個性：筆者校內的學生也有不同面向：有些同學比較安靜，喜歡坐在課室內看書，另有些同學喜歡跑跑跳跳、與人聊天和玩耍，這正反映了兩個不同的維度——內向（I）與外向（E）。因此，家長可以透過知道子女的人格特徵，了解子女的優點和缺點，從而更掌握他們的需要。\n\
    \    2.掌握子女的學習模式：不同人格類型的小朋友所適合的學習方法也不一樣。透過MBTI，家長可以了解子女的學習模式，從而為子女設計適當的學習方法，因材施教，讓他們學得更好。\n\
    \    3.促進親子溝通和相處：家長往往會與子女發生衝突，而了解子女的MBTI 正好讓家長「投其所好」，掌握他們的溝通風格和喜好，從而建立有效溝通，促進彼此關係。針對孩子不同的特性，父母可以用不同方式與他們相處，減少衝突，理性溝通。\n\
    \    儘管MBTI 能讓家長能更了解子女性格，但還是只供參考，畢竟每個小朋友都獨一無二。親子教育需要個別化和靈活，父母還是要根據子女的實際需要和情况給予適當的反應，因此父母多陪伴子女，多與他們溝通，陪伴着他們成長，這才是最好的親子教育。\n\
    (黃偉立，〈蒲公英教室：MBTI 與親子教育〉節錄)"
