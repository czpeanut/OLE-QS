  stem: '大翅鯨是大型鬚鯨，廣泛分布在全球海域，但冬天和夏天棲息的地點不同，冬天主要在赤道周遭海域繁殖哺育仔鯨，夏天則遷徙至極區覓食。根據研究，西太平洋的小笠原群島、沖繩群島、馬里亞納群島和台灣東南海域是大翅鯨的夏季繁殖區，每年一到三月大翅鯨就會啟程遷徙到北極附近覓食。這也是為什麼花蓮和台東海岸有機會發現大翅鯨的原因。

    根據本文，下列關於大翅鯨的敘述，何者最恰當？'
  options:
  - label: A
    content: 大翅鯨冬天要遷徙到赤道附近繁殖
  - label: B
    content: 每年夏天，大翅鯨起程至極地哺育下一代
  - label: C
    content: 這是第一次在花蓮和台東發現大翅鯨
  - label: D
    content: 大翅鯨只分布在西太平洋及台灣東南海域。
