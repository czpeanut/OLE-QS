  group_stem: "小小一支釘子，被榔頭敲入牆壁後，竟能掛住比它重百倍的畫或櫃子，多麼奇妙！信心與意志力也有相同的作用，它是我們人生的釘子與榔頭，能掛住夢想，實現願望。當我們欣賞一幅畫或看到別人牆上的掛櫃時，很少翻看背後用什麼釘子掛的；同理，對於他人的成功，總是驚嘆、羨慕或生出不是滋味的嫉妒，也很少探問釘在他們背後的那根釘子有多粗多長，是何等深入地敲進身體才能掛住龐大的夢想！\n\
    \  我希望你把自己的釘子、榔頭收好，不要丟棄，以自信與意志力迎接成長過程的每一場挑戰，不要畏縮、驚慌、逃避，遇事不可自我打擊：「我不行，我做不到……」何不換個角度想：「我要給自己一個機會嘗試，不難，一定可以做到……」即使當你嘗試時，四周傳來嘲笑，你也要為自己展現更強大的信心與意志，不可敗陣下來成為一生的痛苦回憶。（簡媜〈媽媽送你九樣禮〉）"
