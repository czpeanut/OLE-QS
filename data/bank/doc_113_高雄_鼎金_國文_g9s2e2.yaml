  stem: '屋子裏攏著爐火，/老爺吩咐開窗買水果，/說「天氣不冷火太熱，別在它烤壞了我。」/

    屋子外躺著一個叫化子，/咬緊了牙齒對著北風喊「要死」！/

    可憐屋外與屋裏，/相隔只有一層薄紙！(劉半農〈相隔一層紙〉)

    根據本文，「喊「『要死』！」的原因最可能是下列何者？'
  options:
  - label: A
    content: 爐火火太旺，快把屋裡老爺烤焦
  - label: B
    content: 乞丐躺在寒風中，即將凍死
  - label: C
    content: 北風從紙糊的窗吹進屋內，老爺被冷到
  - label: D
    content: 買水果得出外，僕人凍僵而哀號。
