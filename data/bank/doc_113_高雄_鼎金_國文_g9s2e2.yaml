  stem: 根據本文，下列何者是高公局研擬「高速公路疏運計畫」最主要的原因？
  options:
  - label: A
    content: 疏解交通壅塞
  - label: B
    content: 促進觀光發展
  - label: C
    content: 避免連假塞車
