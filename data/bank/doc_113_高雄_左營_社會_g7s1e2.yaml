    設備非常重要。若不慎在山區迷路，務必保持冷靜，切忌任意亂走或下切峽谷，在臺灣高聳又複雜的地形裡，往往是一層層的瀑布，萬一走錯或是跌倒，通常很難有體力再往上回到原本的地方。儘量留在步道範圍，增加救援的機會。」'
