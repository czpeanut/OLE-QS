  group_stem: '題組四 閱讀選文，回答第47.-50.題：

    「Formosa Trail is coming.」臺灣最大及最多國外選手共襄盛舉的戶外活動－福爾摩沙古道越野賽，即將在11 月下旬盛大展開，這項位於南投山林的盛事，是由來自捷克的登山、越野跑好手，臺灣人稱「跑山獸」的羅培德（Petr
    Novotny）與其妻子羅勃・依婉（Eva）共同創辦。福爾摩沙古道越野賽起、終點皆位於埔里鎮的營地，全部賽程路線的地形剖面圖如【圖四】所示，選手們可挑選適合自己體能的級別進行挑戰，其中困難度最高的戰士路徑是跑完全部賽程，參賽者必須在28
    小時內完成總長104km、總爬升高度5700m 的挑戰。


    而有登山界網紅之稱的「跑山獸」羅培德，最為臺灣人所熟悉與敬佩之處，在於其強大的山區救援能力。2015 年，羅培德聽聞朋友在新北市烏來區的福山失蹤，便偕同一位俄國友人上山搜救，並成功在深山中找到已經受困2、3
    天的登山客。2019 年因山林解禁政策，上山人數增多，諸多登山意外事件也讓羅培德經常受到委託，他為加速搜救行動，在自己的電腦上存有密密麻麻最新且即時的地形圖，並在上面畫滿信號足跡。搜救經驗豐富的他說：「安全是自己的責任！登山前一定要做足功課，除了調查清楚天氣、山區路況，備妥必要裝備外，下載離線地圖與準備GPS
    設備非常重要。若不慎在山區迷路，務必保持冷靜，切忌任意亂走或下切峽谷，在臺灣高聳又複雜的地形裡，往往是一層層的瀑布，萬一走錯或是跌倒，通常很難有體力再往上回到原本的地方。儘量留在步道範圍，增加救援的機會。」'
