- id: doc_113_高雄_五甲_國文_g7s2e2_s4_7
  section: 4
  number: 7
  type: single
  page: 5
  stem: 根據本文，讀書人與統治者的關係，下列敘述何者正確？
  options:
  - label: A
    content: 建安文人多數成為有權的府主
  - label: B
    content: 中唐文人多在華貴階級中作客
  - label: C
    content: 五代文人以文章推翻世族社會
  - label: D
    content: 北宋文人以寫詩晉身統治階層。
  group_stem: '(四)

    從建安①時期開始，文人多數是在朝做侍從供奉，或在外作一薄宦，或靠府主為生。這個情形，到了唐代更甚。唐代的社會是貴族的社會，唐代的政治掌握在門閥手中。中唐以來，地方割據的勢力瓜分朝廷的政權，各節度使又每成一個小朝廷，能養清客。這時候的書生多出身於清門，他們卻多在華貴的社會中作客，譬如：李白只是朝中權貴的客，杜甫只是地方節度使的客。中、晚唐詩人的作客生活尤其表顯這情形，直至五代不曾改。經五代之亂，世族社會式微，到了北宋以後，文人每以射策②登朝，致身將相，所以文風從此一變，直陳其事，求以理勝者多。詩風從此一變，以作散文的手段作詩，而直說自己的話。以前讀書人和統治者並非一事，現在差不多是一類了；以前的詩人寄居在別人的社會中，現在可以過自己的生活了；以前詩人說話要投別人的興趣，現在可以直接說自己的話了。總而言之，以前的詩多是文飾其外，現在的詩可以發揮其中了。以前是客，現在是主了。社會組織之變遷影響及於文人的生活，文人的生活影響及於文章之風氣。

    改寫自傅斯年 文人的職業

    【注釋】①建安：東漢獻帝的年號

    ②射策：宋代科舉時，考生針對皇帝的策問，提出應對之方略'
