- id: doc_113_高雄_五甲_國文_g7s2e2_s3_15
  section: 3
  number: 15
  type: single
  page: 2
  stem: '傳說唐代詩人杜甫有一首四喜詩：「久旱逢甘霖，他鄉遇故知。洞房花燭夜，金榜題名時。」清代學子紀曉嵐給此詩加了八個字：「十年久旱逢甘霖，千里他鄉遇故知。和尚洞房花燭夜，狀元金榜題名時。」這樣加字一改，就把五言絕句改成七言絕句，而且也不是一般的喜歡，而是更加調皮詼諧、喜出望外了。

    後來，有一位秀才，鄉試沒有考中，途中在旅館歇腳，下了一陣小雨，傍晚時分，店旁邊的院裡傳來唷吶聲，原來有人娶親。到了晚上，秀才睡不著覺，聯想到自己的處境和見聞，很是悲怨，他也給四喜詩加了八個字：「久旱逢甘霖——幾滴，他鄉遇故知——仇敵。洞房花燭夜——隔壁，金榜題名時——落第。」這樣加字一改，使四大歡喜事變成一場空歡喜。

    幽默的話題讓人忍俊不禁，悲哀的心情卻躍然紙上。

    人間福報

    文中秀才修改四喜詩的用意何在？'
