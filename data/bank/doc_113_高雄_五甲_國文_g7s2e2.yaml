- id: doc_113_高雄_五甲_國文_g7s2e2_s3_23
  section: 3
  number: 23
  type: single
  page: 3
  stem: '對三國歷史稍有了解的人都知道赤壁之戰，然而赤壁最初在李白、杜甫詩中，不過是一個地名。「折戟沉沙鐵未銷，自將磨洗認前朝。東風不與周郎便，銅雀春深鎖二喬。」杜牧這首赤壁最早將赤壁之戰與銅雀臺連結，並賦予「赤壁」具體的形象與情感。「赤壁」自此取代銅雀臺，支配了人們對三國的想像，直至今天。

    赤壁開篇看似平直，卻涵藏深刻。眼前古戟因經歷實戰而折斷，「折」字傳達出戰爭的暴力。杜牧磨洗戟，並非如兵士般用以傷敵，而是為辨認前朝。於是，戟由「武」的工具變成了「文」的載體。詩的後半藉「東風」引入虛設的情境：若周瑜未得到偶然助力，二喬姊妹將被魏俘虜而禁錮在銅雀臺。首句的未銷之「鐵」，在末句做為囚禁二喬的鐵鎖重現。「春深」表示草木茂盛，與「折戟」所象徵的受挫欲望，形成對比。赤壁為杜牧在黃州任官時所寫，以磨洗折戟，強調了與歷史的相遇是個人性的，通過與古物直接接觸而實現。

    下列敘述，最符合本文對杜牧 赤壁寫作特色說明的是：'
  options:
