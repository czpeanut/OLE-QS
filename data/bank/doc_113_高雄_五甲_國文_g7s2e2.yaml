- id: doc_113_高雄_五甲_國文_g7s2e2_s4_9
  section: 4
  number: 9
  type: single
  page: 6
  stem: 根據本文的結語，齊奄所養的這隻貓，最適當的稱呼為下列何者？
  options:
  - label: A
    content: 貓
  - label: B
    content: 龍貓
  - label: C
    content: 雲
  - label: D
    content: 鼠貓。
  group_stem: '(五)

    齊奄家畜一貓，自奇之，號於人曰「虎貓」。客說之曰：「虎誠猛，不如龍之神也，請更名曰『龍貓』。」又客說之曰：「龍固神於虎也。龍升天，須浮雲，龍豈尚於雲乎？不如名曰『雲』。」又客說之曰：「雲靄蔽天，風倏散之，雲故不敵風也，請更名曰『風』。」又客說之曰：「大風飆起，維屏以牆，斯足蔽矣。風其如牆何？名之『牆貓』可。」又客說之曰：「維牆雖固，維鼠穴之，牆斯圮矣。牆又鼠何？即名曰『鼠貓』可也。」

    東里丈人嗤之曰：「噫嘻！捕鼠者固貓也，貓即貓耳，故為自失本真哉？」

    劉元卿 賢奕編'
