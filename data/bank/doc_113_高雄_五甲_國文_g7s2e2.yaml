- id: doc_113_高雄_五甲_國文_g7s2e2_s4_3
  section: 4
  number: 3
  type: single
  page: 5
  stem: 根據乙文文意，下列何者為正確的排列？
  options:
  - label: A
    content: (3)(2)(1)(4)
  - label: B
    content: (4)(1)(2)(3)
  - label: C
    content: (3)(4)(2)(1)
  - label: D
    content: (4)(3)(1)(2)。
  group_stem: '(二)

    (甲)

    凡人好傲慢小事，大事至，然後興之務之，如是，則常不勝夫敦比①於小事者矣。是何也？則小事之至也數，其懸日②也博，其為積也大；大事之至也稀，其懸日也淺，其為積也小。

    荀子 強國

    【注釋】①敦比：盡心處理

    ②懸日：延續的時日

    (乙)

    2003年，英國自行車協會僱用戴夫·布萊爾斯福德為國家隊教練，從而一新車隊過往的紀錄。


    (1)他們測試並找出能讓肌肉最快恢復的按摩油，找來醫師為選手進行衛教以降低感冒機率，為選手量身訂做枕頭、床具以達到最佳睡眠，甚至將後勤卡車內裝漆白，以便檢查出細小灰塵，避免影響到已校整好的比賽用車。

    (2)布萊爾斯福德說：「觀念在於細分自行車的方方面面，將每個面向都加強百分之一，加總起來就會是可觀的成果。」

    (3)自1908年開始，英國的自行車選手只拿過一面奧運金牌；而在環法自行車賽中，英國的表現更糟——百年內沒有一位英國選手在這項賽事中拔得頭籌。

    (4)布萊爾斯福德被聘僱的理由，便是要重整英國自行車協會。跟先前教練最大不同的是，他異常投入他所謂的一套哲學——找到每件事情中的微小的進步空間。


    當這些微小的進步空間加起來的成果，就是英國自行車隊的改頭換面。五年後，英國自行車隊在二〇〇八年的北京奧運，拿下六成的金牌，一鳴驚人。四年之後的倫敦奧運，他們創下九項奧運紀錄與七項世界紀錄。'
