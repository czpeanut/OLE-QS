  type: single
  page: 2
  stem: '圖(八)與表(一)是大葉旅行社推出的漠南非洲旅遊行程及地圖。學完非洲地理的你（妳），判斷這些行程的區域與說明是否有錯誤？

    表(一)

    | 區域 | 行程說明 |

    | :--- | :--- |

    | 甲 | 沿著地表最大傷疤縱走，欣賞裂谷壯闊美景 |

    | 乙 | 遠眺非洲第一高峰，一睹赤道雪山的真面目 |

    | 丙 | 深入熱帶雨林，探索各種動植物的生態之美 |

    | 丁 | 造訪世界最大沙漠，騎著駱駝去布希曼人家 |'
  options:
  - label: A
    content: 四個行程說明皆正確
  - label: B
    content: 四個行程說明皆錯誤
  - label: C
    content: 甲、丙行程說明錯誤
  - label: D
