- id: doc_113_台中_大業_社會_地理_g8s2e3_s2_38
  section: 2
  number: 38
  type: single
  page: 4
  stem: 衣索比亞位於圖(十一)中何處？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
  group_stem: '（四）閱讀下列文章內容後，回答38～40 題：

    三年前，衣索比亞南部的阿瓦薩紡織工業園區，仍是一片荒田。如今，一百三十公頃的土地上，長出了五十多棟的龐大廠房，有上萬人在園區裡工作。其中有三棟廠房，是宏遠興業的成衣廠。「我們跳過東南亞，直接來非洲設成衣廠，」以布廠起家跨入成衣產業，宏遠總經理葉清來用了僅僅一年的時間，就讓衣索比亞的成衣廠正式投入生產。過去幾年，宏遠跑遍世界各地，尋找適合的國家設立成衣廠，最後他們選擇了非洲的衣索比亞。原因有二：衣索比亞銷往美國與歐洲都享有零關稅；第二，衣索比亞人口有一億人，是全世界人口的第十二大國，近三成的人口，現在年紀介於十五到二十九歲之間，可提供大量廉價與年輕的勞動力，正適合仰賴大量廉價勞動力的成衣廠落腳。'
