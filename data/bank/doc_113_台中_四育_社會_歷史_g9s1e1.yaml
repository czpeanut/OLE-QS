  stem: 西亞古文明中，有一部法典，人民被分為數種階級：自由人、次等人、下等人及奴隸。當罪刑發生時，若受害者為自由人，法律則判定對方必須被報復；若受害者是下等人時，則被定以金錢賠償了事。此為極不合乎人權平等的觀念，且強調報復的原則。請問：此應為下列哪一法典的精神？
