  group_stem: "（一）\n  汝有田舍翁，家資殷盛，而累世不識之乎。一歲，聘楚士訓其子。楚士始訓之搦管[1]臨朱[2]，書一畫訓曰「一」字，書二畫訓曰「二」字，書三畫訓曰「三」字。其子輒欣欣然擲筆，歸告其父曰：「兒得矣，兒得矣，可無煩先生，重費館穀[3]也，請謝去。」其父喜而從之。具幣謝遣楚士。逾時，其父擬徵召姻友[4]萬氏姓者飲，令子晨起治狀，久之不成。父趣[5]之，其子恚[6]曰：「天下姓字夥矣，奈何姓萬？自晨起至今，纔完五百畫也。」初機[7]士偶一解，而即訑訑[8]自矜有得。殆類是已。\n\
    (明·劉元卿《應諧錄》)\n註釋：[1]搦管：握筆。搦，音ㄋㄨㄛˋ [2]臨朱：描紅，指老師以紅墨水寫好字後學童再臨摩。 [3]館穀：學費。\n[4]姻友：親戚朋友\
