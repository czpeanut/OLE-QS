  stem: 「近年來，社群媒體成為人們獲取資訊的重要來源，但也出現許多未經查證的假消息。為了避免被誤導，我們應該培養媒體識讀能力，學會判斷訊息的來源是否可靠、內容是否合理，以及是否有其他權威來源可以佐證。唯有如此，我們才能做出正確的判斷，不輕信、不轉傳錯誤資訊。」根據上文，下列敘述何者理解正確？
  options:
  - label: A
    content: 所有網路資訊都是可靠的，可以直接轉傳
  - label: B
    content: 媒體識讀能力是只用於閱讀新聞報導的技巧
  - label: C
    content: 若訊息來自親友，就不需要懷疑其真實性
  - label: D
    content: 判斷訊息真偽前，應先確認來源與查證內容。
