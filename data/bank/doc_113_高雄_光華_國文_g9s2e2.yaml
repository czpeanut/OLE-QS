  group_stem: "（三）\n  國際貨幣基金（IMF）22 日發布最新報告，將全球今年經濟成長預測維持於3.2％不變，但明年從3.3％下調0.1個百分點至3.2％。IMF\
    \ 讚許各國央行在抑制通膨的同時未讓經濟陷入衰退，亦警告須留意戰爭與貿易保護主義帶來的風險正在加劇。\n  至於台灣今年經濟估成長3.7％，優於去年1.3％的成長率。預估明年的成長率為2.7％。\n\
