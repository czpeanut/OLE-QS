  stem: "甲：怒髮衝冠，憑闌處、瀟瀟雨歇。抬望眼，仰天長嘯，壯懷激烈。三十功名塵與土，八千里路雲和月。莫等閒、白了少年頭，空悲切。\n  靖康恥，猶未雪，臣子恨，何時滅？駕長車，踏破賀蘭山缺。壯志飢餐胡虜肉，笑談渴飲匈奴血。待從頭、收拾舊山河，朝天闕！\n\
    ――南宋．岳飛〈滿江紅〉\n乙：死去原知萬事空，但悲不見九州同。王師北定中原日，家祭無忘告乃翁。\n――南宋．陸游〈示兒〉\n     關於以上兩首作品，下列敘述何者最恰當？"
