- id: doc_113_高雄_光華_國文_g9s2e2_s2_46
  section: 2
  number: 46
  type: single
  page: 7
  stem: 以上文字只是全文的一部分。請問，依此敘述內容與脈絡，這段文字該屬於全文的哪個部分？
  options:
  - label: A
    content: 前言
  - label: B
    content: 正文
  - label: C
    content: 結語
  - label: D
    content: 內容摘要。
  group_stem: "（五）\n  「廣告文案到底要怎麼寫才會有人看？」\n  相信這是許多工作者的疑惑，尤其在這個競爭激烈的銷售市場中，你是否也經常會思考：明明都是廣告文案，為什麼人家的廣告文案引發話題、而我的卻沒人提起？\n\
    \  其實，要完成一篇優質的廣告文案並沒有那麼難，接下來我將跟你分享5 大廣告文案的架構撰寫訣竅+範例，讓你也可以透過廣告文案把產品賣得嚇嚇叫！一起來看看一篇好的廣告文案到底要具備哪些條件吧！\n\
    \  在閱讀這篇文章之前，我想先與你達成一個共識：「廣告文案在現代的社會中，已經是一種必備技能」，你認同嗎？為什麼這麼說呢？\n  其實答案很簡單，因為文案是所有的賺錢工具中，成本最低、產出最簡單、使用性最高、影響力最廣的管道。\n\
    不管是線下（報章雜誌、傳單、燈箱、看板…）還是線上（電商、課程、活動、社群媒體…）每個地方、每個渠道，基本上沒有用不到文案的地方！\n  毫不誇張的說，只要人們還在使用文字的一天、文案就有存在的價值和必要性。\n\
    \  那你可能會好奇，所謂的「廣告文案」到底跟一般的文案有什麼差異呢？\n  其實廣告文案最大的特色就是：會讓看完的人採取你想讓他採取的行為。聽起來可能有點饒口，最簡單的說法就是讓消費者看完文案後心甘情願掏錢出來購買！所以如果你仔細觀察就會發現，廣告文案撰寫比起一般的文案來說，通常會讓消費者更有急迫感、行動力。但了解歸了解、相信大家在廣告文案撰寫時一定還是會碰到這些大大小小的問題……\n\
    \  ●辛苦寫出來的廣告文案沒人點\n  ●消費者點進來後不把廣告文案看完\n  ●消費者看完廣告文案後無感、不行動\n  天啊，不要說遇到了，即使你沒碰過，這些畫面光用想像的就讓人感到無力，對吧？\n\
