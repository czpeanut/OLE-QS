- id: doc_113_高雄_光華_國文_g9s2e2_s2_43
  section: 2
  number: 43
  type: single
  page: 6
  stem: 依據文章內容，下列對「殖民地文學」的理解，何者最為貼切？
  options:
  - label: A
    content: 是指殖民統治下，反映權力壓迫與文化抵抗的文學
  - label: B
    content: 是殖民政府鼓勵創作、表現地方風情的文學
  - label: C
    content: 世界上只有台灣這塊土地才有殖民地文學
  - label: D
    content: 是以娛樂為目的的文學類型，與政治無關。
  group_stem: "（四）\n  台灣新文學運動的展開，是在一八九五年台灣淪為日本殖民地之後才發生的。……台灣社會的傳統漢文思考，也正是受到整個大環境營造的改變而逐漸式微，而終至沒落。取而代之的，是現代化知識的崛起，以及資本主義的擴張與再擴張。就是由於這種新世紀的到來，台灣新文學才開始孕育釀造。\n\
    \  台灣新文學是二十世紀的產物，也是長期殖民統治刺激下的產物。站在二十世紀的終端，回首眺望整部文學史的流變軌跡，彷彿可以看到這個傷心地的受害歷史，也好像可以見證島上住民的奮鬥歷史。從最初的荒蕪未闢到今天的蓬勃繁榮，台灣文學經歷了戰前日文書寫與戰後中文書寫的兩大歷史階段。在這兩個階段，由於政治權力的干預，以及語言政策的阻撓，使得台灣新文學的成長較諸其他地區的文學還來得艱難。考察每一歷史階段的台灣作家，都可發現他們的作品留下了被損害的傷痕，也可發現作品中暗藏抵抗精神。從這個角度來看，要建構一部台灣新文學史，就不能只是停留在文學作品的美學分析，而應該注意到作家、作品在每個歷史階段與其所處時代社會之間的互動關係。\n\
    \  朝向一部文學史的建立，往往會牽涉到史觀的問題。所謂史觀，指的是歷史書寫者的見識與詮釋；任何一種歷史解釋，都不免帶有史家的政治色彩。史家如何看待一個社會，從而如何評價一個社會中所產生的文學，都與其意識形態有著密切的關係。因此，在建構這部文學史時，對於台灣社會究竟是屬於何種的性質，就成為這項書寫過程的一個重要議題。台灣既然是個殖民的社會，則在這個社會中所產生的文學，自然就是殖民地文學。以殖民地文學來定位整個台灣新文學運動，當可清楚辨識在歷史過程中殖民者與被殖民者之間的權力消長關係；也可看清台灣文學從價值壟斷的階段，如何蛻變成現階段多元分殊現象；更可看清台灣作家，如何在威權支配下以雄辯的作品進行抵抗與批判。\n\
    （選自陳芳明《台灣新文學史．台灣新文學史的建構與分期》）"
