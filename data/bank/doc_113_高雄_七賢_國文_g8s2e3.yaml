    content: 封閉的社會型態資訊不透明。
  group_stem: "「驚！全糖珍珠奶茶與半糖的熱量只差一百大卡？」 \n  「嚇！麻疹致死率是流感的千倍！」 \n  媒體資訊是現代人獲取資訊的重要來源。資訊的吸收不僅決定我們的知識量，也會決定我們的生活品質。對現代人來說，「資訊封閉」也是一種風險，所以，與其一味批評「新聞很腦殘」，或者是抱著「絕不相信」的態度，還不如提早培養對「科學訊息」的判讀力。\
    \ \n  以上述第一則新聞為例，某健康食品平臺發布了「珍珠奶茶熱量大揭祕」的圖片，馬上被傳來傳去，製造不少恐慌，但它既沒有測量方法，也沒有說明是由哪個單位檢測的，雖然標示糖分與熱量的對照關係，然而奶茶裡加的是鮮奶還是奶精，珍珠大小也沒有說明，這些都該細究，才能得到客觀結論。至於第二則新聞，雖然引述了某醫師的說法，指出麻疹致死率約為百分之五到百分之十，流感則小於百分之零點一，但兩者比數並非千倍。這是基礎的計算錯誤，更不該在嚴謹、認真的報導中出現。\
    \ \n  這類看似具備科學知識，其實悖離科學規律與邏輯的報導，都可統稱為偽科學新聞，不但不可信，還往往引發民眾恐慌、社會失序。偽科學新聞通常有著以下三點特色：一、非客觀印證：只傳達主觀印象，缺乏可信的科學證據；二、偏執否定：否定其他理論或可能，凸顯窄化該領域科學知識；三、以偏概全：只以單一個案或少量現象作為報導主體，且誇大渲染神奇的色彩。\
    \ \n  閱讀者如果了解這些特色，只要秉持「理性思考」的科學精神，就能輕易破解這些似是而非的訊息，思考重點如下：一、確認消息來源；二、釐清報導邏輯；三、報導是否精確。偽科學新聞報導往往使用恐嚇性字眼、單一的權威消息，以及瑣碎不精確的描述，無遠弗屆的網路使查找資料遠比過去方便，我們應該努力成為能主動驗證、尋求解答的閱聽人，也試著教導下一代，學習科學實驗方法，了解依證據推導結論的邏輯，以科學精神查驗訊息，增強媒體識讀，在破解科學新聞的同時，也養成縝密的思考，作出判斷。\
    \                       \n                                                   \
    \                            （國立屏東大學 科普傳播學系 張耀仁 鍛鍊思辨力破解偽科學資訊）"
