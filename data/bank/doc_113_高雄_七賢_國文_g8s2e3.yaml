- id: doc_113_高雄_七賢_國文_g8s2e3_s2_39
  section: 2
  number: 39
  type: single
  page: 5
  stem: 根據上文，下列關於「忍者」的敘述何者不正確？
  options:
  - label: A
    content: 忍者使用很多特殊武器和道具，如：手裡劍、苦無、木遁術
  - label: B
    content: 忍者為了從事閒諜活動而使用的特殊技能，通常稱為「忍術」
  - label: C
    content: 忍者是指古時使用忍術等，隱身潛入敵軍、城堡的間諜
  - label: D
    content: 忍者在近代登上了武俠劇、歷史小說的舞臺，也有不少以描寫忍者為題材的電影和漫畫。
  group_stem: "<變身忍者> \n  忍者在動漫、電影中頻頻登場，現已聞名於世，人氣甚高。有不少人慕名來到日本，就是希望能夠穿上忍者的裝扮，體驗忍者的修行。真正的忍者究竟是怎樣的呢？現在就進入忍者的世界，親身感受忍者的無窮魅力吧。\
    \ \n<忍者使用的忍術和武器> \n  忍者是指古時使用忍術等，隱身潛入敵軍、城堡的間諜。他們最活躍的時期是15世紀末到16世紀末，是全國各地武將爭霸天下的戰國時代。忍者喬裝成路人或閒人等、使用手段欺騙對方，從事忠於主人的間諜活動。\
    \ \n  忍者為了從事閒諜活動而使用的特殊技能，通常稱為「忍術」。忍術的內容非常豐富，包括使用設法逃走的武術掩眼法、躲避對手攻擊的格鬥術、間諜活動中不可或缺的蒐集情報能力、化裝成別人的易容術、蒙騙敵人的心理戰術、潛入敵軍的潛入術、在荒山野嶺生存的野戰本領，以至調製藥品以製成毒藥、療傷藥和火藥的藥學知識等都包括在內。\
    \ \n  另外，忍者使用很多特殊武器和道具，例如「手裡劍」（又稱飛鏢）是一種專用於投擲的小型刀劍；隨身攜帶的「苦無」則是一把形狀如鐵製雙刃刀，用途與求生刀相同；穿上踏雪鞋托「水蜘蛛」，便可以行走於水上。在東京鐵塔、淺草商業街等著名的觀光地，特產店中有售忍者道具的模仿品。觀光的同時，順道逛逛這些特產店，別有一番風味。\
    \ \n<風靡世界的小說和電影中的忍者> \n  忍者不但在近代登上了武俠劇、歷史小說的舞臺，同時也有不少以描寫忍者為題材的電影和漫畫。以小朋友為對象的漫畫（已有動畫版和電影版）忍者小靈精（主角是伊賀流忍者服部半藏的子孫）和美國出產的超級英雄忍者龜等都非常出名。另外，在日本的少年漫畫雜誌中連載的火影忍者\
    \  \n──鳴人（Naruto）等受到全世界喜愛的人物，也為數不少。 \n  在小說、電影等虛構世界裡，忍者頻頻登場，他們使用各種人類無法想像的「妖術」（魔法般的奇幻之術）\
    \  \n──\n身手敏捷地迷惑對方，例如瞬間分身成數人的「分身術」；使用火藥放出煙霧的「火遁術」；口裡含著呼吸用的空心管潛入池塘、沼澤等的「水遁術」；用迷彩布包裹全身隱藏的「木遁術」等等。\
    \ \n<參觀忍者的故鄉，變身為忍者吧！> \n  日本各地存在著各種忍術流派，其中甲賀地方（現在的滋賀縣東南部）和伊賀地方（現在的三重縣西部）被譽為「忍者的故鄉」。在這裡修練的忍者被稱為「甲賀忍者」和「伊賀忍者」。在與忍者頗有淵源的這片土地上，至今還有很多「忍者屋敷」（忍者的房屋），以及不少可以體驗忍者修行的表演。\
    \                              \n                                            \
    \                       （節選自：日本政府觀光局官方網站）"
