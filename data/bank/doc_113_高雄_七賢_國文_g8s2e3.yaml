    \ \n  閱讀者如果了解這些特色，只要秉持「理性思考」的科學精神，就能輕易破解這些似是而非的訊息，思考重點如下：一、確認消息來源；二、釐清報導邏輯；三、報導是否精確。偽科學新聞報導往往使用恐嚇性字眼、單一的權威消息，以及瑣碎不精確的描述，無遠弗屆的網路使查找資料遠比過去方便，我們應該努力成為能主動驗證、尋求解答的閱聽人，也試著教導下一代，學習科學實驗方法，了解依證據推導結論的邏輯，以科學精神查驗訊息，增強媒體識讀，在破解科學新聞的同時，也養成縝密的思考，作出判斷。\
    \                       \n                                                   \
    \                            （國立屏東大學 科普傳播學系 張耀仁 鍛鍊思辨力破解偽科學資訊）"
