  - label: D
    content: 破解迷信而獲得眷顧。
  group_stem: "在中國 唐朝時代，有一處歷陽縣，該縣裡有一位老太婆，非常地善良，平時樂於行善助人。有一天，有一名少年路過她的家門，上門乞討飲食。老太婆不但沒有輕視少年，甚至還熱情地款待他，將家中最好的飲食給他享用。\
    \ \n  少年飽餐一頓後，臨去前，對老太婆說：「非常感謝您的招待，為了報答您的恩情，我必須警告您，你們這個地方沒多久就會發生大災難，從現在起，您每天都到縣市中心的衙門，去看衙門的門檻上有沒有血跡，一旦發現有血跡出現，您就趕緊躲到高山上去避難。」少年說完話，便逕自離去。\
    \ \n  老太婆的個性很單純，她不疑有他，每天按時都到衙門前看門檻，衙門裡的官員見狀，好奇地問她在幹什麼，老太婆便將少年跟她說過的話都告訴了官員。 \n\
    \  官員當然不信，甚至視老太婆為迷信的愚婦，為了戲弄老太婆，便以雞血塗在衙門的門檻上。第二天，老太婆一見血跡，二話不說立刻返家，將家中的財產及雞籠打包好，全搬到高山上。\
    \ \n  當晚，整個縣市在完全無預警的情況下全都塌陷入地底深處，整個地面變成一片汪洋大湖，就是今日和州的歷陽湖。                    \
    \                                              （節錄自喬正一譯李亢 獨異志）"
