  group_stem: "諸葛亮去江東聯吳抗曹的時候，機關重重，原來不只舌戰群儒而已，還有一段與周瑜脣槍舌劍，精彩萬分的故事： \n  當時魯肅請了諸葛亮赴宴，周瑜藉故與他對詩，協定了誰輸便要殺對方的頭！\
    \ \n  周瑜高興的先說：有水也是溪，無水也是奚，去掉溪邊水，加鳥便是雞，得志貓兒雄過虎，落毛鳳凰不如雞。 \n  諸葛亮知道周瑜是在諷刺自己，於是回應：有木也是棋，無木也是其，去掉棋邊木，加欠便是欺，龍游淺水遭蝦戲，虎落平陽被犬欺。\
    \ \n  周瑜聽後大怒，魯肅替其打圓場，也吟上一首：有水也是湘，無水也是相，去掉湘邊水，加雨便是霜，各人自掃門前雪，休管他人瓦上霜。\n  一場風波過去了。周瑜又換了內容：有木也是杻，無木也是丑，去掉杻邊木，加女便是妞，隆中女子生得醜，百里難挑一個妞。\
    \ \n  諸葛亮見他嘲笑自己娶了個醜媳婦，便回應：有木也是橋，無木也是喬，去掉橋邊木，加女便是嬌，江東美女大小喬，曹操 銅雀鎖二嬌。 \n  周瑜聽見他奚落自己的夫人，將酒杯扔在地上，伏兵立即一齊衝出將諸葛亮圍住，魯肅連忙拉住周瑜，立刻引詩解圍：有木也是槽，無木也是曹，去掉槽邊木，加米便是糟，當今之計在抗曹，龍虎相殘事更糟。\
    \ \n  周瑜頓時醒悟過來，命令刀斧手退下，不想再加害諸葛亮了！                 （節錄自網路故事瑜亮對詩）"
