  type: single
  page: 5
  stem: 文章提到實施「急診檢傷五級分類」最主要的目的是什麼？
  options:
  - label: A
    content: 避免醫療設備不足引發醫療糾紛
  - label: B
    content: 利於醫護人員判斷病患是否需要住院
  - label: C
    content: 使家屬提前預約，避免長時間等候
  - label: D
    content: 根據病情輕重，安排優先處理順序。
  group_stem: '「我先來的耶!為什麼是後面來的先看？」「我真的很不舒服，為什麼他可以插隊？」

    許多國人還不了解所謂的「急診檢傷五級分類」，只要遇到急症習慣前往大醫院急診，以為這樣就能較快獲得醫療服務，致使過多輕症病患至大醫院急診就醫，造成大醫院急診過度壅塞與不必要的醫療資源。

    本文將介紹急診檢傷分類，並期待民眾開始重視醫療問題，並從自身做起，不濫用，不浪費，讓大醫院急診恢復原本應該有的角色，共同提升社會福祉。

    急診檢傷分類依病患病情危急程度，建立病患優先就診的順序，以即時搶救重症病患生命。急診檢傷分類原則如下：

    急診五級檢傷分類基準

    第一級（復甦急救，立即處理）－病況危急生命或肢體，需立即處理。如：心跳、呼吸停止、肢體及嘴唇發青、發紫，體溫高於41 度或低於32 度，無意識或意識混亂、持續抽搐且無意識。

    第二級（危急，可能等候時間10 分鐘）－潛在性危及生命、肢體及器官功能，需快速控制與處理。如：急性意識狀態改變、持續胸悶、胸痛且冒冷汗、低血糖(<40mg/dl)、外傷造成之大量出血，頭頸軀幹骨盆部位血流不止、高處墜落、車禍(乘客被拋出車外)、頭部撞擊後曾失去意識等。

    第三級（緊急，可能等候時間30 分鐘）－病況可能持續惡化，需急診處置；病人可能伴隨明顯不適症狀，影響日常生活。如：無法控制的腹瀉或嘔吐、外傷後肢體腫脹變形疑似骨折/脫臼、高血壓(收縮壓>200mmHg
    或舒張壓>110mmHg)且沒有任何症狀等。

    第四級（次緊急，可能等候時間60 分鐘）－病況可能為慢性病及急性發作，或某些疾病之合併症相關，需在1 至2 小時做處置避免惡化。如：局部蜂窩性組織炎、急性咳嗽但沒有發燒、發燒但無其他不適、反覆性疼痛或暈眩等。

    第五級（非緊急，可能等候時間120 分鐘）－病況非緊急，需做鑑別性診斷或轉介門診。如：慢性噁心、嘔吐或打嗝、輕微擦傷，瘀青，軟組織受傷、螫傷或咬傷，但無發燒或疼痛不適、輕微腹瀉，無脫水現象等。'
