  group_stem: '崇禎二年中秋後一日，余道鎮江往兗①。日晡②，至北固，艤③舟江口。月光倒囊入水，江濤吞吐，露氣吸之，噀④天為白。余大驚喜，移舟過金山寺，已二鼓矣。經龍王堂，入大殿，皆漆靜。林下漏月光，疏疏如殘雪。余呼小僕攜戲具，盛張燈火大殿中，唱韓蘄王⑤金山及長江大戰諸劇。鑼鼓喧填，一寺人皆起看。有老僧以手背采眼翳，翕然⑥張口，呵欠與笑嚏俱至。徐定睛，視為何許人，以何事何時至，皆不敢問。劇完，將曙，解纜過江。山僧至山腳，目送久之，不知是人是怪是鬼。

    選自張岱《陶庵夢憶》


    注釋：①兗：音：ㄧㄢˇ，兗州，位於山東省。②日晡：傍晚時分。③艤：停船。④噀：噴灑。⑤韓蘄王：韓世忠，字良臣，兩宋之際名將，與岳飛、張俊、劉光世並稱為「中興四將」死后被追封為蘄王。⑥翕然：突然。'
