    content: 強迫妻妾出外營生。
  group_stem: '齊人有一妻一妾而處室者，其良人出，則必饜酒肉而後返。其妻問所與飲食者，則盡富貴也。其妻告其妾曰：「良人出，則必饜①酒肉而後返。問其與飲食者，盡富貴也，而未嘗有顯者來。吾將瞷②良人之所之也。」

    蚤③起，施④從良人之所之。遍國中無與立談者。卒之東郭墦間⑤之祭者，乞其餘，不足，又顧而之他──此其為饜足之道也。

    其妻歸，告其妾曰：「良人者，所仰望而終身也。今若此！」與其妾其良人，而相泣於中庭。而良人未之知也，施施⑥從外來，驕其妻妾。

    由君子觀之，則人之所以求富貴利達者，其妻妾不羞也，而不相泣者，幾希⑦矣！

    注：①饜：飽、滿足。②瞷：窺視。③蚤：通「早」。④施：斜曲而行。 ⑤東郭墦間：城外東郊墳場。

    ⑥施施：喜悅自得的樣子。⑦幾希：很少。'
