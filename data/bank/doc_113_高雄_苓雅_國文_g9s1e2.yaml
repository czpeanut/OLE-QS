  stem: 「重岩疊嶂，隱天蔽日，自非亭午夜分，不見曦月」根據此句可知，在此地的什麼時辰，最有機會看見太陽或月亮？
  options:
  - label: A
    content: 卯時、酉時
  - label: B
    content: 辰時、寅時
  - label: C
    content: 午時、子時
  - label: D
    content: 未時、亥時。
  group_stem: '三峽

    自三峽七百里中，兩岸連山，略無闕處；重岩疊嶂，隱天蔽日，自非亭午夜分①，不見曦月②。至於夏水襄陵③，沿溯阻絕。或王命急宣，有時朝發白帝，暮到江陵，其間千二百里，雖乘奔御風，不以疾也。春冬之時，則素湍綠潭，回清倒影。絕巘④多生怪柏，懸泉瀑布，飛漱其間，清榮峻茂，良多趣味。每至晴初霜旦，林寒澗肅，常有高猿長嘯，屬⑤引淒異，空谷傳響，哀囀久絕。故漁者歌曰：「巴東三峽巫峽長，猿鳴三聲淚沾裳。」

    酈道元《水經．江水注》


    注釋：①亭午夜分：正午與半夜。②曦月：日月。③襄陵：水勢浩大，漫過山陵。襄，上、登越。

    ④巘：音ㄧㄢˇ，山峰、山頂。⑤屬：音ㄓㄨˇ，連續，動詞。'
