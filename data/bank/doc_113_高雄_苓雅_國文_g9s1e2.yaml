  stem: 關於本文的敘述下列何者正確？
  options:
  - label: A
    content: 徒手扭鬥發源於民間，後來在戰場上發揚光大
  - label: B
    content: 角抵鬥士需練習花巧的體操動作，增加節目的可看度
  - label: C
    content: 古代的軍隊的戰服多以猛獸毛皮製作，用以嚇阻敵人
  - label: D
    content: 化人的演出形式，類似於近代的摔角、角力與魔術表演。
  group_stem: '徒手扭鬥是戰場短兵相接時當見的情況，也是必習的技能。甲骨文的鬥字作二人徒手相互扭門之狀。其節目如同今日之摔角或角力，秦時稱為「角抵」。到了漢代算是相當受歡迎的節目。不但在民間流行，連皇帝饗宴四夷也以之為娛樂的節目。有時為了增加刺激及提高觀眾的興趣，鬥士各自裝扮成虎、熊等猛獸的樣子。偽裝成野獸的形象以接近野獸是打獵的手法之一，為了驚嚇敵人，戰士有時也會扮成猛獸。故以虎、豹等猛獸的毛皮作為軍裝，也是古時所常見。以虎獸形象相鬥既是常見的，人們就以此來娛樂他人。它可雜以歌舞，具有生動的內容，所以，就用「角抵」作為雜戲的總稱。

    甲骨文的「化」字，作一人正立與一人倒立之狀。化的意義為變化、變幻。〈列子穆天子篇〉的「化人」，表演種種的變幻之術，即今之魔術師。這些「化人」，在漢代經常與雜技同團演出，以求節目更加豐富出彩。倒立是體能訓練變化出來的花巧動作，奧運的「體操」項目就是著重這一類技巧的表演。……從甲骨文的「化」字，似乎可推測商代已有以娛樂他人為職業的專業雜技表演了。'
