  stem: 以下對文章內容的說何者正確：
  options:
  - label: A
    content: 作者受邀於龍王殿粉墨登場，獲得滿堂喝采
  - label: B
    content: 夜間金山寺林間殘雪點點，美景令人驚嘆不已
