- id: doc_113_高雄_苓雅_國文_g9s1e2_s2_42
  section: 2
  number: 42
  type: single
  page: 7
  stem: 關於〈前赤壁賦〉的說明，下列何者正確？
  options:
  - label: A
    content: 書於黃州時期，為蘇軾與友人同遊赤鼻磯後的共同創作
  - label: B
    content: 文章內容肯定了孫權在赤壁之戰中以寡敵眾的英雄氣概
  - label: C
    content: 〈前赤壁賦〉、〈後赤壁賦〉分別被列入新舊課綱的推薦選文
  - label: D
    content: 從藝術觀點而言，其獨到的運筆法方式開創了北宋書法的新局。
  group_stem: '文化部2024 年1 月3 日公告，故宮典藏的7 件書畫指定為國寶，其中包括日前以「浮海一粟」引爆話題的〈蘇軾書前赤壁賦〉。〈蘇軾書前赤壁賦〉為蘇東坡手書〈赤壁賦〉的唯一真跡，以蘇大文豪跟〈赤壁賦〉在中國詩詞中的地位，此帖早該跟〈寒食帖〉、〈江上帖〉等蘇軾真跡同列為國寶，卻因缺乏展出機會無法送審，始終無法獲得文資身分，如今終於揚眉吐氣。

    2005 年，文建會依新修訂的文資法，將古物分為國寶、重要古物與一般古物三級，年底故宮即完成院內古物的暫行分級，2008 年起分批提報文資審議，由文資局古物審議委員進行實勘與審議。擁有國寶地位的書畫多為脆弱紙質，為了保護文物，往往要等到提件展覽時，才請古物審議委員配合實勘。〈蘇軾書前赤壁賦〉因為太珍貴，上一次展出(2006
    年)是文建會啟動古物分級審議前，審議會啟動後不曾展出也無法送審，延緩登上「國寶」寶座的時機，這一等便是16 年。

    其他六件被公告為國寶的包括：〈元趙孟頫書禊帖源流〉、〈唐吳彩鸞書唐韻〉、〈集古名繪宋李唐大江浮玉〉、〈明陳洪綬畫隱居十六觀〉、〈清傳綮寫生〉、〈元吳鎮嘉禾八景〉。還有兩件被指定為重要古物：〈明趙左秋山紅樹圖〉、〈明陳淳設色花卉〉。

    元豐五年（1082）7 月16 日，蘇軾與友人乘舟遊覽黃州城外赤鼻磯，寫下千古名作〈前赤壁賦〉，表達對宇宙及人生看法。同年10 月重遊，又寫了一篇〈後赤壁賦〉，
    兩文後世傳誦不絕，不論新、舊課綱都列入推薦選文。

    文化部 文資局的指定理由表示，此卷為蘇軾親筆所書文學名作〈前赤壁賦〉，跋語中透露被謫貶黃州的困境與無奈。無論從書家本人到此文寫作緣起、傳說、流傳與對後世影響等，皆堪稱史上不朽經典。

    在藝術成就方面，文資局指出，相較蘇軾傳世率性隨意行書，此卷行楷作風流露精心書寫態度，筆法上變化萬千，結構亦別出心裁。透過不同起筆方式，搭配合適運筆與收筆，能於楷體較多限制下出變化；書寫過程中，蘇軾亦能隨意地加入許多細膩動作，帶著些微顫動獨特線條，細賞卻又不顯刻意，反而成為其色用筆。書寫上亦開創出「我書意造本無法」新觀念，成就有宋一代尚意書風。晚明
    董其昌譽此卷為「坡公之蘭亭也」，不僅是個人傳世行楷書代表傑作，亦是北宋書學成就展現。'
