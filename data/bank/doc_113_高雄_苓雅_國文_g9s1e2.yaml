  group_stem: '王文正太尉氣贏①多病。真宗面賜藥酒一注缾②，令空腹飲之，可能和氣血，辟③外邪。文正飲之，大覺安健，因對稱謝。上曰：「此蘇合香酒也。每一斗酒，以蘇合香丸一兩同煮。極能調五臟，卻腹中諸疾。每冒寒夙④興，則飲一盃。」因各出數榼⑤賜近臣。自此臣庶之家皆仿為之，蘇合香丸盛行於時，此方本出《廣濟方》，謂之「白術丸」，後人亦編入《千金》《外臺》，治疾有殊效。餘於《良方》敘之甚詳。然昔人未知用之。錢文僖公集《篋中方》，「蘇合香丸」注云：「此藥本出禁中⑥，祥符中嘗賜近臣。」即謂此也。

