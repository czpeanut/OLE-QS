  group_stem: 丙、「渭水春風」是一部以日本統治臺灣時期，倡導非武裝抗日領袖蔣渭水為藍本的音樂劇。其內容訴說醫學院畢業的蔣渭水，與志同道合的朋友，善盡知識分子應有的義務，啟蒙臺灣人民的自主意識，找回對民族與文化的自覺。蔣渭水針對日本統治時期的臺灣社會開立診斷書，認為臺灣患了智識營養不良，須以大量的文化教育來醫治。
