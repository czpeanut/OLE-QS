  stem: 1921 年，臺灣總督在日本貴族院院會表示：「帝國統治的方針，不像英國讓殖民地設置獨立議會、制定法律、議定預算的殖民地政策，而是當作正在施行帝國憲法的地方，和內地同樣自然處理，提升其文化，使之與內地相同。如果做此形容，如同內地延長主義的型態。……但本件請願
    ……卻希望制定將施行於臺灣的特別法律及臺灣預算的議決權賦予該議會的法律。這完全違背了帝國統治臺灣的大方針……像這種做法斷然不應容許。」敘述中臺灣總督反對此請願案的主因為何？(甲)希望自日本統治下獨立  (乙)違背「內地延長」的施政方針  (丙)設立獨立議會  (丁)要求擁有制訂法律的權力
