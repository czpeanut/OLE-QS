  group_stem: '僰①人養猴，衣之衣而教之舞，規旋矩折②，應律合節。巴童觀而妒之，恥己之不如也，思所以敗之，乃袖茅栗③以往。筵張而猴出，眾賓凝眝④，左右皆蹈節。巴童佁然⑤揮袖而出其茅栗，擲之地。猴褫衣而爭之，翻壺而倒案。僰人呵之不能禁，大沮。

    郁離子曰:「今之以不制之師⑥戰者，蠢然⑦而蟻集，見物則爭趨之，其何異於猴哉！」

    (劉基《郁離子．卷七》

