  options:
  - label: A
    content: 關注社會脈動，主動爭取勞工福利
  - label: B
    content: 試著融入社會，當一個新臺灣人
  - label: C
    content: 參與子女校園生活，避免他們被歧視
  - label: D
    content: 走出家庭當志工，積極化解文化衝突。
  group_stem: 知道自己外籍新娘的身分在台灣是一個買賣標的。她如何可以把這些視為生命中的石頭，彎下身撿起丟掉，成為一個讓人尊敬的大學老師？「我剛到台灣時，看到到處貼的『外籍新娘
    20 萬』，我看到我這個身分是別人用買賣方式來評斷……」陳凰鳳用流利的中文一邊講一邊擦眼淚，引起很大的迴響。剛到台灣時飽受歧視，她為了怕孩子也被歧視，因此反而努力的參與孩子校園的生活。為了融入台灣社會當一個新台灣人，陳凰鳳要比一般人更努力。結婚第七年，夫妻倆決定帶著稚齡兒女回台定居，她一心想當個賢妻良母專心持家，但看著其他新住民帶著母國文化來到台灣，兩方文化衝突產生誤會與悲劇，陳凰鳳決定去當志工，也因此得知更多悲傷的故事。
