    content: 「造飲輒盡，期在必醉，既醉而退，曾不吝情去留」表現出五柳先生的率真個性
  - label: C
    content: 「好讀書，不求甚解」指五柳先生讀書不拘泥字句，重在領會旨趣
  - label: D
    content: 「無懷氏之民歟！葛天氏之民歟！」點出五柳先生是上古時代的人
