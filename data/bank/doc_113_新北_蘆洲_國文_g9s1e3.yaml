  stem: 「檯面上表達或是檯面下溝通，要看交情、場合以及你期待的結果。如果未來不會想相見，那麼檯面上指證並撕破臉是最快的；但如果知道未來依舊需要合作，那麼檯面下溝通則是最合宜的。尤其在組織溝通中，不是每個錯誤都可以搬到檯面上來談，有些時候沒有正確閱讀空氣反而成為決裂關鍵。」這段文字的主旨與下列何者最接近？
  options:
