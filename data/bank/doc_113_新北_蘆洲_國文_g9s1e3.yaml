    content: 在職場中，私下溝通永遠是最佳選擇
  - label: B
    content: 明智的溝通策略取決於關係的延續性
  - label: C
    content: 直接表達想法才能解決所有問題
  - label: D
    content: 避免衝突是維持和諧的不二法門。
