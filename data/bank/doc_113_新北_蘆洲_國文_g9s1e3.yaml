  stem: '柳宗元貶放永州，日子過得孤寂而荒涼。親族朋友不來理睬，地方官員時時監視。災難使他十分狼狽，一度蓬頭垢面，喪魂落魄。但是，災難也給了他一份寧靜，使他有足夠的時間與自然相晤，與自我對話。於是，他進入了最佳的寫作狀態，也讓中國文化史擁有了永州八記。

