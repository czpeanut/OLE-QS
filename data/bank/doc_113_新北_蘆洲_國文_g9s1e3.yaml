- id: doc_113_新北_蘆洲_國文_g9s1e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 蘇軾 定風波：「莫聽穿林打葉聲，何妨吟嘯且徐行。竹杖芒鞋輕勝馬，誰怕？一蓑煙雨任平生。 料峭春風吹酒醒，微冷，山頭斜照卻相迎。回首向來蕭瑟處，歸去，也無風雨也無晴。」下列何者最能展現本詞的意旨？
  options:
  - label: A
    content: 及時行樂，把握青春年華
  - label: B
    content: 知足常樂，安於平淡生活
  - label: C
    content: 曠達豁達，超越外在環境
  - label: D
    content: 閒適恬淡，享受田園生活。
- id: doc_113_新北_蘆洲_國文_g9s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 蘇軾 臨江仙：「夜飲東坡醒復醉，歸來彷彿三更。家童鼻息已雷鳴，敲門都不應，倚杖聽江聲。 長恨此身非我有，何時忘卻營營？夜闌風靜縠紋平，小舟從此逝，江海寄餘生。」（註：縠紋：縐紗似的細紋。比喻水波之細。縠，音ㄏㄨˊ。）根據本詞內容，下列敘述何者正確？
  options:
  - label: A
    content: 作者外出喝酒，一直喝到快天亮才回家
  - label: B
    content: 「何時忘卻營營」指不忍心再指責家童
  - label: C
    content: 本闕詞主旨主要是表達開懷暢飲的心境
  - label: D
    content: 「小舟從此逝」是作者嚮往自由的想望。
- id: doc_113_新北_蘆洲_國文_g9s1e3_s1_18
  section: 1
  number: 18
  type: single
  page: 3
  stem: 「好好說話，好好表達。你可以表達憤怒，但不要憤怒的表達！老實說，不容易，但若能自我覺察，就能提醒自己。」請問這句話的涵義，與下列何者最接近？
  options:
  - label: A
    content: 凡事三思而後行，避免做錯事
  - label: B
    content: 時時反省檢討，改正自己過失
  - label: C
    content: 經常保持警惕，預防意外發生
  - label: D
    content: 察覺情緒狀態，調整表達方式。
- id: doc_113_新北_蘆洲_國文_g9s1e3_s1_19
  section: 1
  number: 19
  type: single
  page: 3
  stem: 「日子很忙，但對你永遠有空。」關於這段文字的寫作手法，下列敘述何者正確？
  options:
  - label: A
    content: 引用他人言論增加說服力
  - label: B
    content: 使用排比句式加強語氣
  - label: C
