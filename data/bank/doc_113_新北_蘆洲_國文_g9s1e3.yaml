- id: doc_113_新北_蘆洲_國文_g9s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 今天是比奇堡一年一度的「狀聲詞大賽」，只要用對「狀聲詞」就可以贏得頭獎「美味蟹堡十年份」，全比奇堡的人們都躍躍欲試，大家使出渾身勁。請問下列哪一個人可以得到獎品？
  options:
  - label: A
    content: 海綿寶寶：坐著遊船，遊船擦過初枯的蓮葉「牙牙」價響
  - label: B
    content: 派大星：遊船驚動了休憩的鳥兒，撲動翅膀「格格」價飛
  - label: C
    content: 珊迪：在我德州的家鄉，鳶鷹往來盤旋，「呱呱」長鳴
  - label: D
    content: 章魚哥：看到蹦進船裡的蓮蓬，我感到飢腸「滔滔」。
- id: doc_113_新北_蘆洲_國文_g9s1e3_s1_15
  section: 1
  number: 15
