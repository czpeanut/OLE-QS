- id: doc_113_新北_蘆洲_國文_g9s1e3_s1_20
  section: 1
  number: 20
  type: single
  page: 3
  stem: 「常常鼓勵自己、認真努力勇敢的做自己，執著一個理想始終不渝，就是勇者。」這段文字最主要說明下列何者？
  options:
  - label: A
    content: 勇氣來自於持續的自我激勵
  - label: B
    content: 真正的勇者必須具備堅定的意志力
  - label: C
    content: 做自己比追求理想更需要勇氣
  - label: D
    content: 勇者的定義在於對理想的堅持與自我實現。
- id: doc_113_新北_蘆洲_國文_g9s1e3_s1_21
  section: 1
  number: 21
  type: single
  page: 3
  stem: '許多人對讀書有誤會，認為讀書就是告訴自己不知道的，補充自己的不足；不是的。

    讀書完全就是 AI 訓練，你是 AI ，你選的書是訓練材料，材料給你的不只是知識，也包括神經連結所關連到的演算權重。讀書為什麼要思考，因為思考才會把新材料「刻入」原有的神經網絡，產生有價值的「智慧」，以後你的輸出才會更「好」。

    把你自己當 AI ，你的經驗、課業、人際互動、讀書、臉書發廢文，都是你自己自我訓練的材料，目標是重組hacking 你的大腦。

    關於作者對讀書的觀點，下列說明何者最恰當？'
  options:
  - label: A
    content: 讀書是單向的知識吸收，應著重補充生活所需
  - label: B
    content: 讀書類似電腦程式編寫，需要遵循固定的學習模式
  - label: C
    content: 讀書如同AI 訓練過程，透過思考建立多元連結
  - label: D
    content: 讀書主要在培養解決問題的能力，不需過度思考。
- id: doc_113_新北_蘆洲_國文_g9s1e3_s1_22
  section: 1
  number: 22
  type: single
  page: 3
  stem: 「生活中,我們總是很羨慕那些，既做著自己喜歡的工作，又能把喜歡的工作做到擅長的人。而我們自己，作為『普通的大多數』，卻似乎只能在『喜歡』和『擅長』二者之間糾結、試探想要找到一個最佳答案。其實，最重要的，是先嘗試過，再去做出判斷；想要變強，靠的從來不是『想』而是『做』，先讓自己奔跑起來，跑著跑著，總會跑出個結果出來的。」根據內容，可以推知下列何者？
  options:
  - label: A
    content: 做自己不喜歡但擅長的工作較容易成功
  - label: B
    content: 大多數人都能同時找到喜歡且擅長的工作
  - label: C
    content: 只要開始行動，就能找到適合自己的方向
  - label: D
    content: 思考比實際行動更容易找到人生方向。
- id: doc_113_新北_蘆洲_國文_g9s1e3_s1_23
  section: 1
  number: 23
  type: single
  page: 4
  stem: 「遭遇考驗其實是人生常態，你該做的不是唉聲嘆氣、怨天尤人。每一件事情發生都有原因，每一個問題都帶著一份禮物給你。你可以選擇當作一場災難，或是當作一份禮物，這個選擇將決定你的人生是個成功的故事，或是一齣大型的肥皂劇。」這段文字最主要說明下列何者？
  options:
