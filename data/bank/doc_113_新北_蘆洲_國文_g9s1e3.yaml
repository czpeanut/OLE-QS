  stem: 「這一道點心的製作過程可謂是一門藝術，傳統上是以糖漿為基底，經過不斷拉扯和摔打，形成細如絲線的糖絲。然而，隨著時代的變遷，現代的廚師製作此道點心時通常會加入一些新穎的材料，例如堅果或是水果乾，讓口感更加豐富多樣。」以上所形容的是臺灣哪一道美食？
  options:
  - label: A
    content: 龍鬚糖
  - label: B
    content: 牛軋糖
  - label: C
    content: 棉花糖
  - label: D
    content: 黃金糖。
