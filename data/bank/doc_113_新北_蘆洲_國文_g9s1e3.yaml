  section: 2
  number: 35
  type: single
  page: 6
  stem: 根據文章對切仔麵的描述，下列觀點何者最接近文意？
  options:
  - label: A
    content: 切仔麵因為經濟考量，所以完全不放肉類食材
  - label: B
    content: 切仔麵最重要的特色是油蔥和店家特製醬汁
  - label: C
    content: 切仔麵的麵條形狀是刻意設計成布丁狀
  - label: D
    content: 切仔麵一定要加入韭菜和豆芽菜才算完整。
  group_stem: "乙.\n    切仔麵並不是大家一般想像中的擔仔麵或陽春麵，它的內容物與台南擔仔麵最大的不同是，前者加的是「肉燥」，而切仔麵加的則是「油蔥」，這是因為以前台灣人環境並不富裕，因此要吃很多肉並不容易，因此古時就是以大骨、三層肉去熬煮，最重要的事，它不加味素。因此切仔麵的獨特之處是在於它的油蔥和各店家的獨家「醬汁」，而看店家的喜好再加入韭菜或豆芽菜，增加口感。\n\
    \    另外它的形狀與命名也很特別。外型呈現一個布丁形狀，原因是煮麵時勺子的形狀，再加上煮麵過程中為了要熟，必須得不停的攪拌麵條，因此才成為此形狀。老闆會將麵裝至此勺子抖動擠下，發出「切切」的聲響，因此用台語發音就是「切仔麵」。"
