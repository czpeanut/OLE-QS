  stem: 「生活本來就有好有壞。一個人就是一個完整的、有優缺點的整體，接納自己不可能只要好的部分，不要壞的部分。接納『不夠好』的自己，才能發掘『更好的』自己。」下列何者最切合本文的主旨？
