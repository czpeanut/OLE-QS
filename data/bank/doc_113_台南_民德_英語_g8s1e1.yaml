- id: doc_113_台南_民德_英語_g8s1e1_s3_3
  section: 3
  number: 3
  type: single
  page: 3
  stem: When did Emily go to Mexico?
  options:
  - label: A
    content: On Tuesday.
  - label: B
    content: On Thursday.
  - label: C
    content: On Saturday.
  - label: D
    content: On Sunday.
  group_stem: 'Dear Eva,


    I came to Mexico three days ago to visit my relative, Aunt Julie. We prepared
    food and costumes for the Day of the Dead today. People here painted their faces
    and dressed up in special costumes. During the festival, they danced at a street
    party. It was so interesting and different from the Tomb Sweeping Day in Taiwan.
    When we went back to Aunt Julie’s house, there were flowers and candles on the
    table. They celebrate the festival in a special and lively way. My cousin, Potter,
    shared a few stories of their dead relatives with me. For people in Mexico, the
    Day of the Dead is all about love, not fear.

    Can you come here with me next time? I have to cook dinner with Aunt Julie. See
    you next time in Taiwan, bye.


    Emily

    November 1, Sunday'
