  page: 3
  stem: Who looked after Jaden after his parents passed away?
  options:
  - label: A
    content: His grandmother
  - label: B
    content: His aunt
  - label: C
    content: His father
  - label: D
    content: His uncle
  group_stem: Jaden Hayes’ father passed away when he was 4 years old. A few months
    later, his mother passed away, too. Jaden’s aunt looked after him. Everyone around
    Jaden was sorry about his parents’ death. But Jaden didn’t want to live a sad
    life; he wanted to make some changes. He asked his aunt to buy some toys for him,
    and he gave the toys to strangers on the street or at the park. He wanted to see
    people smile and remember his parents in a special way. When people got his toys,
    he didn’t ask anything in return, he just needed a warm hug. Jaden’s story was
    not a happy one, but he tried to be brave and live his life in a lively way. His
    parents were not with him, but they still lived in his memory.
