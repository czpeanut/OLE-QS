  section: 4
  number: 28
  type: single
  page: 1
  stem: 今天上完課後，綺綺發現目前最早的漢字是刻在龜甲、獸骨上的書體，接著變成刻在青銅器上的書體。秦始皇統一天下後，又命令李斯制定官方字體，但實在過於繁複，於是逐漸演變成相較官方每一轉折都要寫成弧形，更為簡單的、較為扁的字體，但此字體最後也漸漸被取代，現今則使用更易書寫與辨認，較平直勻稱的書體。請問下列何者是正確的字體演變？
  options:
  - label: A
    content: 甲骨文→金文→小篆→隸書→楷書
  - label: B
    content: 大篆→金文→小篆→楷書→隸書
  - label: C
    content: 金文→大篆→草書→楷書→隸書
  - label: D
    content: 甲骨文→小篆→楷書→草書→行書
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
