  - label: B
    content: 昂首觀之，項為「之」強
  - label: C
    content: 又留蚊於素帳中，徐噴以煙，使「之」沖煙飛鳴，作青雲白鶴觀
  - label: D
    content: 果如鶴唳雲端，為「之」怡然稱快
