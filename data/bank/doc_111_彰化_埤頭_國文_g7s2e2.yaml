- id: doc_111_彰化_埤頭_國文_g7s2e2_s5_38
  section: 5
  number: 38
  type: single
  page: 2
  stem: 本文主旨，與下列何者句意較相近？
  options:
  - label: A
    content: 這世界不是缺少美，而是缺少發現美的眼睛
  - label: B
    content: 未來的想像與期待，源自於生命的高度
  - label: C
    content: 人若心存善念，則看任何事物皆是美好
  - label: D
    content: 充實自我內涵，能使得生命更多采多姿
  group_stem: '(一)請依據下列文章，回答第38-39題


    人們總是習慣想得太遠，將目標投向難以到達的遠方，卻忘了去留意身旁美好的事物。急於加快腳步的我們，錯過了漫步的平靜；急促的喘氣聲，讓我們忘了體會路途中的感動，這樣使我們無法感受真正的美好，而那些美好，也失去了存在的意思以及價值。


    記得在我小學一年級時，某天一場午後雷陣雨，巨大的雨滴不斷落下，擊打著鐵製的遮雨棚，砰砰作響，那時的我身軀奮力跳躍著，想要看看雨點降下的情景。在那時，我發現自己喜歡下雨的聲音，那是我第一次喜歡一種聲音，有一點新奇，雖然小時候的我不懂那是什麼感受，只知道自己好喜歡。


    隨著年紀增長，我的生活多了許多新的事物，不僅學業壓力增加了，在人際關係與交友上，也必須付出許多心力……我開始對未來有了想像和期待。


    充實的日子使我的生活更加多采多姿，卻也使我逐漸忽略了許多平凡而樸實的美好。某個下雨的夜晚，我聽見許久沒細聽的雨聲，細碎的滴答聲，我彷彿看見兒時純真笑容的自己，同時也憶起那段平凡而簡單的美好。這場雨，甜甜的，像焦糖口味的爆米花。


    （節錄自 人間福報）'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
