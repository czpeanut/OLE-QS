  - label: C
    content: 以為無福消受，落嘆而已
  - label: D
    content: 用滾湯灌殺也
  group_stem: '(二)請依據下列文章，回答第40-42題


    及長，愛花成癖，喜剪盆樹。識張蘭坡，始精剪枝養節之法，繼悟接花疊石之法。花以蘭為最，取其幽香韻致也，而辦品之樹堪入譜者不可多得。蘭坡臨終時，贈荷瓣素心春蘭一盆，皆扁平心闊，莖細瓣淬，可以入譜者，余珍如拱璧，值余兼溺於外，妄能親為灌溉，花葉瀕歿，不二年，旦忽萎死，起根視之，皆白如玉，且蘭芽勃然，初不可解，以為無福消受，落嘆而已，事後始悉有人欲分不允，故用滾湯灌殺也。從此誓不植蘭。


    （節錄自沈復 閒情記趣）'
