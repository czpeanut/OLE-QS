  stem: 依據文章內容，下列哪道菜最有可能使用孟宗竹筍料理？
  options:
  - label: A
    content: 豆瓣醬梅花肉炒筍筍
  - label: B
    content: 冬筍燉土雞
  - label: C
    content: 涼拌竹筍沙拉
  - label: D
    content: 桂筍炒肉絲
  group_stem: '(三)請依據下列文章，回答第43-44題


    高經濟價值─孟宗竹


    孟宗竹原產於中國，約西元1750年自閩南地區引入臺灣。主要分布在中部南投、嘉義、雲林，其中又以南投鹿谷鄉的產量最多，佔全臺七成以上，是臺灣重要的經濟竹種。


    孟宗竹的名稱來自中國二十四孝的故事「孟宗哭竹」。孟宗為了年邁生病的母親在寒冷的冬天苦尋竹筍，最後因為孝心感動蒼天，筍從地面迸了出來。雖然「哭竹出筍」在生活中不太可能實現，但故事中可以發現孟宗竹的兩個特點，一是孟宗竹筍動態拔上，二是孟宗竹能在冬天生長。


    孟宗竹筍為圓錐狀，分為冬筍和春筍。春筍的產期是2至5月，冬筍則是11-2月。冬筍長在地下表下，挖出後會發現，竹筍被一層金黃色絨毛包住，色澤亮麗；春筍則生長於立春之後，表皮呈黑褐色，有針刺般的絨毛，雖然生長速度比冬筍快，但味道比不上冬筍味美甘甜、肉質細嫩。再加上冬筍數量少，因此冬筍價格通常會比較貴。一般會以炒燴、煮燉等方式食用。


    此外，孟宗竹也具有其它應用價值，由於表面平滑，節低、肉厚，常使用在鷹架、家具、膠合材（即是將孟宗竹剖成約2公分的竹板，再接合起來）上，並能做為景觀造景之用。因為孟宗竹有特別強的「毒他作用」，會使周遭植物無法生存，形成大面積的竹林，有許多美麗的竹林步道多是由孟宗竹生成。


    （節錄自食農教育整合平臺 萬能竹和筍 好處一籮筐）'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
