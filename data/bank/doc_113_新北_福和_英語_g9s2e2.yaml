- id: doc_113_新北_福和_英語_g9s2e2_s2_57
  section: 2
  number: 57
  type: single
  page: 7
  stem: 57. Why was Pacekelj named as a living "national treasure"?
  options:
  - label: A
    content: She created a new style of Western weaving.
  - label: B
    content: She teaches Paiwan culture with oral teachings.
  - label: C
    content: She shows the connection between the nature and the land.
  - label: D
    content: She keeps the professional weaving skills of Paiwan culture.
  group_stem: 'A 72-year-old weaver, Ljumiyang Pacekelj, is from the Paiwan indigenous
    group in Pingtung County. She was named a living “national treasure” by the Ministry
    of Culture. This is because her amazing weaving skills help keep Paiwan culture
    alive. She is one of only eight national treasures in the county.

    Pacekelj is the only person in Taiwan who knows most of the traditional Paiwan
    weaving skills. She won the National Craft Achievement Award and is also a local
    master of traditional crafts. When she was young, she learned weaving by listening
    to her father''s oral teachings and remembering everything he said from a young
    age.

    In the last few decades, traditional Paiwan fabric almost disappeared. To protect
    this culture, Pacekelj uses the old weaving ways to make modern and fashionable
    clothes. This helps more people see Paiwan culture in today’s world.

    Pacekelj hopes to pass on Paiwan weaving culture to the next generation by teaching
    students of all groups and sexes and also publishing books on Paiwan weaving skills
    and ideas. The designs in Paiwan cloth show pictures, such as taro, a food Paiwan
    people eat often, and animal tracks. These designs show how close Paiwan people
    are to nature and the land.

