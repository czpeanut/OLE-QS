    computer nearby to move the robot. But why is this new type of surgery becoming
    more popular?

    One reason is that Da Vinci surgery has several good points over traditional ones.
    The robot has a very high-tech camera     43.     and lets doctors see inside
    the patient’s body clearly. What’s more, the robot can move in very small spaces,
    so it only needs to make very small cuts. Because of this, patients usually feel
    less pain, get better faster, and have smaller scars.

    However, Da Vinci surgery is not perfect. It also has some problems. One big problem
    is the high cost. So, not many hospitals have enough money to buy this expensive
    machine. Even so, some hospitals still try to get it because it helps patients
    get better faster. Besides, doctors also need a lot of practice to use the robot
    well. In fact, it really takes much time to learn. Whether the surgery is successful
    or not depends on   44.  .

    Although Da Vinci surgery is still not used in every hospital, it shows us how
    technology can change the way we take care of patients. As more doctors use the
    robot and as machines become cheaper, Da Vinci surgery might become normal in
    the future.

