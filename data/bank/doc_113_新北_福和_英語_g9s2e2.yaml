  group_stem: 'Election is not only interesting to many people, but it also brings
    many part-time jobs. For example, some people write ads for candidates, help at
    events, make phone calls, or hand out flyers. These jobs pay well, so many young
    people do them to make extra money. They can make NT$60 more than the basic hourly
    pay, which is now NT$190.

    But as the voting day gets close, part-time workers need to follow the rules.
    First, people can’t share polling results like who is winning or losing ten days
    before the election. So, it’s better to stop working on polls during this time.
    Also, on election day, no campaign events are allowed. That’s why most jobs end
    the night before the election. If someone breaks the rules, they can be fined
    from NT$200,000 to NT$2 million.

    There are other rules to make sure the election is fair. For example, you can’t
    show any signs or pictures of a candidate inside the voting place. Even hand signs
    like "YA" for number 2 or "OK" for number 3 are not allowed. In 2018, one person
    was fined NT$500,000 for making a “1” hand sign in a voting place. That’s a lot
    of money to lose just for one small action!

     ads 廣告  flyers 傳單  results 結果  campaign 活動'
