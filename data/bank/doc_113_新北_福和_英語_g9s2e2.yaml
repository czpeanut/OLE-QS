  section: 2
  number: 51
  type: single
  page: 6
  stem: 51. Why do some people worry about when students use AI?
  options:
  - label: A
    content: Students might stop using traditional methods.
  - label: B
    content: Students could lose their ability to think critically.
  - label: C
    content: AI tools are too difficult for students to use.
  - label: D
    content: Teachers might not have jobs in the future.
  group_stem: 'Artificial intelligence (AI) has been widely discussed in education.
    Many people believe AI helps students learn better. For example, AI can answer
    questions right away, explain difficult ideas in simple ways, and even point out
    mistakes in homework. Students find AI helpful because it allows them to learn
    at their own pace and find information quickly. Besides, some say AI tools can
    be helpful for English and writing. They can help teachers come up with interesting
    ideas for their classes and make sentences easier for students with poor English
    skills.

    However, others see AI as problematic. One problem is that students might count
    on it too much and stop thinking critically. Also, AI collects information from
    many websites on the Internet, and some of it may be wrong. So, it sometimes may
    share fake information. What’s more, an answer may be biased because of the information
    it uses. For example, the views, knowledge, and experiences of smaller groups
    of people are often not counted.

    Even with these problems, many teachers agree that blocking AI tools is not the
    solution. Instead, we should teach students how to use it in the right way. Students
    should be guided to understand the pros and cons of AI. Learning how to evaluate
