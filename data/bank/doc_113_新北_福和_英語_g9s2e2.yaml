  - label: D
    content: To suggest that more companies should build AI chatbots like Daisy.
  group_stem: 'Scammers often try to trick people, especially older adults. But now,
    there is a smart Artificial intelligence (AI) chatbot called Daisy that fights
    back!

    Daisy, also spelled “dAIsy”, was made by a British phone company called Virgin
    Media O2. She talks to scammers on the phone to waste their time, so they don’t
    have time to trick real people. Daisy sounds like a kind old lady. She tells funny
    stories, talks about her cat, and never gives out personal information.

    Because Daisy is AI, she never gets tired. She can talk for hours and make scammers
    feel frustrated. One scammer was shocked and said, “It has been an hour!” and
    Daisy sweetly answered, “Oh, time flies!”

    The company trained Daisy with the help of police officers who catch scammers.
    According to the company, she has already wasted "hundreds and hundreds of hours"
    of scammers'' time.

    An AI grandma alone can’t foil scammers, of course, but Daisy is a valuable tool
    to slow them down. The company also asks people to report scam calls and messages.
    Maybe one day, more AI grandmas like Daisy will help protect people from scams!

