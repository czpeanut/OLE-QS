- id: doc_113_新北_忠孝_社會_公民_g8s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: '從下文畫線處可以印證權力使人腐化。若是在我國，下列相關權力的敘述，何者正確﹖

    唐代宰相魏徵曾云:「以銅為鏡，可以正衣冠；以史為鏡，可以知興替；以人為鏡，可以知得失。」歷史就像一面鏡子，可以幫助我們不要再犯過去的錯誤，但可惜的是人類很少會從前人錯誤中避免自己的錯誤。中國過去的歷史中，不斷看到許多皇帝擁有很大的權力，無人敢反抗，造成其荒淫無道，導致國家衰敗滅亡，所幸，這種獨攬大權於一身的極權制度，現今已甚少存在。而我國為亞洲第一個民主共和國，採取五權分立的制度。'
  options:
  - label: A
    content: 分為積極權利和消極權利
  - label: B
    content: 政府賦予人民統治的權力
  - label: C
    content: 政府可行使公權力對違法民眾開罰
  - label: D
    content: 指法律保障人民所應享有的生活利益。
  tags:
    chapter:
      publisher: 翰林
