  section: 1
  number: 11
  type: single
  page: 2
  stem: '針對下文中立法院審議並決議准予備查之法規，下列敘述何者正確?

    萊克多巴胺是什麼？ 萊克多巴胺是一種藥物，用以助長豬、牛等飼養動物生出瘦肉，減少脂肪，是瘦肉精中最常見的一種藥物。2020年12月我國立法院審議「動物用藥殘留標準」、「美國及加拿大牛肉及其產品之進口規定」、「散裝食品標示規定」等九項有關萊克多巴胺美豬進口行政命令，決議這些行政命令予以備查，開放來自美國等含有萊克多巴胺的豬肉進口，並於
    2021年1月1日起施行，而衛生福利部食品藥物管理署也發表臺灣豬貼紙，要求賣場、超市或餐飲店，都須標示豬肉產地，違者將依法開罰新台幣3萬至300萬元，標示不實開罰4萬至400萬元。'
  options:
  - label: A
    content: 屬於憲法，條文內容簡明、扼要
  - label: B
    content: 屬於法律，因此由立法院負責制定
  - label: C
    content: 屬於命令，且不可牴觸憲法和法律
  - label: D
    content: 屬於國際條約，具有國內法約束力。
