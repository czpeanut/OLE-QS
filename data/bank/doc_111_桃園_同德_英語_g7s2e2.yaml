  group_stem: 'Amelia: What are you doing, Emma?

    Emma: I’m writing a card to my father. What about you? What are you going to do
    for Father’s Day?

    Amelia: Father’s Day? Isn’t that card for your father’s birthday?

    Emma: No, it’s for Father’s Day next week. Don’t you know Father’s Day is next
    week?

    Amelia: No, it’s on August eighth.

    Emma: In Canada, we celebrate Father’s Day on the third Sunday of June. Why is
    Father’s Day in Taiwan on August eighth?

    Amelia: The pronunciation of August eighth sounds like “papa” in Chinese, so we
    celebrate Father’s Day on that date.

    Emma: I see. By the way, I never see your father. Doesn’t he live with you and
    your mother?

    Amelia: No, he works in Thailand now, and he comes home only three times a year.
    So, it’s hard for you to see him. He’s not around very much.

    Emma: Oh! Your mother is great. She also plays the role of father to you.

    Amelia: You can say that again. I love my mom very much.


