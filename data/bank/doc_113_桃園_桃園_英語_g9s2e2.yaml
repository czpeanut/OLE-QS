  type: single
  page: 6
  stem: What is the main idea of the reading?
  options:
  - label: A
    content: Companies are working together to make the quality of their products
      better.
  - label: B
    content: Consumers are tricked into buying products more often.
  - label: C
    content: The light bulb industry is the only example of planned obsolescence.
  - label: D
    content: New laws have successfully stopped planned obsolescence from happening.
  group_stem: "The Lies behind the Products\nSurely you have experienced this: Right\
    \ after the warranty ended, your earphones stopped working. You took them back\
    \ to the store, and the shopkeeper told you, “It’s cheaper to get new ones.” You\
    \ didn’t think too much and got a new pair. This, however, could be a trick by\
    \ big companies.\n\n\U0001F4D6 warranty 保固 earphones 耳機 customer 顧客 light bulb\
    \ 燈泡 replacement 替換 faulty 有瑕疵的\n Some companies’ products are designed and made\
    \ not to last for a long time. This way, their old customers have to keep buying\
    \ their products. This action is called planned obsolescence. One of the most\
    \ famous examples happened in 1925. A few light bulb companies had a meeting and\
    \ decided to work together. They all agreed to cut down the life of their light\
    \ bulbs from 2,500 hours to 1,000 hours, so people had to buy them more often.\n\
    Planned obsolescence is still happening today. Although there are laws to stop\
    \ it now, most companies can just make an excuse and get away with it. In the\
    \ end, more of our money goes into their pockets, and we don’t even know it."
