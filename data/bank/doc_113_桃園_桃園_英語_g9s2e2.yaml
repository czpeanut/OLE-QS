    \ information on the Internet,” he said. “Everything was hard because I had to\
    \ create everything by myself. It was indeed a lot of trial and error along the\
    \ way.” He used ice that came from local lakes to make musical instruments. “You\
    \ can buy perfect ice from factories around the world, but it will not have any\
    \ sound,” Isungset said, “It’s nature that decides the sound of the instrument.”\n\
    In 2006, Isungset held the first Ice Music Festival Norway in Europe. Every year,\
    \ musicians play inside a unique space built out of ice and snow. Almost everything\
    \ at the Ice Music Festival is frozen. When the show is over, Isungset invites\
    \ the audience to give the ice instruments back to nature.\n Isungset is a drummer,\
    \ but he makes many instruments including ice chimes, drums, and horns. Some of\
    \ Isungset’s instruments are based on standard ones, and some are his inventions.\
