  section: 1
  number: 10
  type: single
  page: 1
  stem: 過去，臺灣農業主要以自給自足為主，有時搭配牧業為副業，以供應大家庭所需；之後隨著經濟與產業的發展，許多地區陸續發展專業生產區，產品走向商品化。請問：對於農產品商品化的發展，何者不正確？
