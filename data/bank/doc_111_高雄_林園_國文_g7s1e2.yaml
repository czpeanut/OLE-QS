  group_stem: 「類風溼關節炎」是一種免疫細胞異常導致慢性發炎的疾病，患者以中年女性為 主，又以具相關家族病史、肥胖、抽菸甚至嗜食碳酸飲料者患率較高。罹患類風溼關節炎的患者，常於早晨感到關節僵硬疼痛，好發部位以手部為主。由於體內長期處於慢性發炎及免疫失調，除了造成關節不可逆的破壞，亦可能引發關節病變以外的併發症，損害心臟、肺、腎臟、肝臟、肌肉、眼睛、淋巴腺等，造成貧血、脾臟腫大、肺部病變等後續症狀。
