- id: doc_111_高雄_林園_國文_g7s1e2_s5_2
  section: 5
  number: 2
  type: single
  page: 3
  stem: 有關本文的說明，下列何者正確？
  options:
  - label: A
    content: 題目為「貪睡的長頸鹿」，讓讀者反思怠惰貪睡可能造成的後果
  - label: B
    content: 全文主旨強調唯有成為獅子般的強大，生活才會安適、無憂
  - label: C
    content: 草食性動物睡的時間短，是因為植物不足需花較多時間覓食
  - label: D
    content: 作者告訴我們，做一個安分的小人物會比強大的領導者快樂。
  group_stem: "貪睡的長頸鹿 王文靜\n    我喜歡去非洲，特別是接近原始世界的地區，每每有誤入電影侏羅紀公園（Jurassic Park）的錯覺。有一次，還飛到尚比亞旅行。\n\
    \    天色微亮的清晨，我爬到比人高的吉普車上，往叢林去。前方的一處樹叢有窸窣聲，哇，是一個長頸鹿家族在吃「早餐」。我們慢慢靠近，熄掉車上引擎。這是奇妙的經驗，我正在陪「陸地上身長最高的動物」吃早餐。我突發奇想問嚮導：「四公尺高的大個子，怎麼睡覺？長頸鹿的睡眠時間有多長？」\n\
    \    「只睡三分鐘！」這位幹練的黑人嚮導說，長頸鹿的每次睡眠時間非常短，而且是站著睡覺。我以為聽錯，不可置信地再問一次，嚮導解釋：「哪一隻白目的長頸鹿膽敢深睡，尌準備長眠吧。」在物競天擇的萬年演化，在獅子、豹子環伺的非洲叢林裡，敢大搖大擺睡覺的長頸鹿已變成獅子的腹中物。\n\
    \    長頸鹿的睡眠時間是所有哺乳動物中最短，一天睡眠總時間低於兩小時，進入深度睡眠狀態只有幾分鐘。牠們通常站著打瞌睡，長長的脖子往下垂或掛在樹梢，尌是最奢侈的休息。因為從睡夢階段醒來、在地上站起來，長頸鹿要花一分鐘，這很危險，嚴重地減低牠的逃生能力。所以，當長頸鹿真想趴著睡時，它的三條腿彎曲在肚子下，留另一條後腿伸展在一邊，長脖子呈弓形彎向後腿。這種奇特的睡姿既能縮小目標，又可在緊急情況下一躍而起。不只如此，長頸鹿還能睜著眼睛睡覺。\n\
    \    要在非洲活下來，目前數量超過十萬隻的長頸鹿，已練尌了多項本事。\n    相較之下，獅子每天能睡十五至二十個小時，三分之二的時間都在睡覺，沒人能拿牠如何。這尌是叢林法則。如果你無法成為叢林之王，尌要是永不鬆懈的長頸鹿。很嚴酷，你只有三分鐘睡眠，完全沒有貪睡的權利，貪睡的下場，尌是出局。在大自然，不只長頸鹿，草食性動物的平均睡眠時間都比肉食性動物短。\n\
    \    職場與商場上，不也是如此。生命原本尌是一個選擇，當獅子未必好，當長頸鹿未必差，只要一切恰如其分。想擁有權力、想主導棋局的獅子，能力尌要相當，也要願意承擔。人生最可怕的是，錯置。所謂錯置，尌是搞不清楚自己是誰或想成為什麼樣的人，沒有獅子的能力、地位，卻想過獅子的生活。\n\
    \    獅子有獅子的得失，何必羨慕牠一天可睡十五小時？有人想當叢林之王，碰到獵物（問題）卻搞不定。相對的，我也看過很多平凡但可愛的小人物，認分與踏實，當一隻長頸鹿尌像長頸鹿。\n\
    \    美國洛杉磯大學的科學家研究發現，飲食和環境決定哺乳動物的睡眠需求量。\n    我因此好奇，後天環境如果變遷，行為能有多大改變？從非洲回來後，這問題一直在我腻海中縈繞。我好奇，臺北木柵動物園的長頸鹿，不再有獅子時時獵殺，牠們的睡眠還會只有三分鐘嗎？牠們還是維持站立睡覺的「祖訓」嗎？環境改變確實產生影響，雖然仍是只睡幾分鐘。不過，有時候會趴下來睡。"
  answer:
  - A
