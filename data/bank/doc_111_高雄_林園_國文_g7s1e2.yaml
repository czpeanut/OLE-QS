  page: 1
  stem: 下列對於孔子的敘述，何者不正確？
  options:
  - label: A
    content: 孔子是春秋魯國人，是儒家思想的代表人物。除了精讀詩書，還學習射箭、駕馭馬車。
  - label: B
    content: 洙泗在山東曲阜，尌在孔子故鄉，所以可以用「洙泗高風」來讚美老師。
  - label: C
    content: 孔子身為老師，我們還可以稱呼他為「夫子」、「先生」、「教席」、「西席」。
  - label: D
    content: 首開私人講學之風，教育方針是有教無類、誨人不倦，因為對教育界貢獻巨大，所以被稱為「亞聖」。
  answer:
  - D
  answer_source: answer_key_vlm
