- id: doc_113_新北_桃子腳_自然_g8s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 阿璁採用三峽碧螺春茶葉泡成甲、乙兩杯「不同溫度」的茶，混合後達到熱平衡。在達到熱平衡的過程中，假設甲杯茶放出的熱量為H甲，乙杯茶吸收的熱量為H乙，系統散失的熱量為H丙，請問下列關係何者正確？（H甲、H乙、H丙皆為正值）
  options:
  - label: A
    content: H甲＋H乙＝H丙
  - label: B
    content: H甲＋H丙＝H乙
  - label: C
    content: H乙＋H丙＝H甲
  - label: D
    content: H甲＝H乙
