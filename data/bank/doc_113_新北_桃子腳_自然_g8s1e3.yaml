- id: doc_113_新北_桃子腳_自然_g8s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 家杰想要研究熱對物質的影響，他嘗試把汽水加熱，嘗試把冰塊加熱，嘗試把麵包放烤土司機加熱，觀察結果後他會發現以下哪些結果?
  options:
  - label: A
    content: 物質溫度改變
  - label: B
    content: 物質狀態改變
  - label: C
    content: 物質顏色改變
  - label: D
    content: 以上皆是
  tags:
