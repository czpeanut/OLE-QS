- id: doc_113_新北_桃子腳_自然_g8s1e3_s2_38
  section: 2
  number: 38
  type: single
  page: 5
  stem: 根據福德的說法，熱的傳遞與以下哪個現象相關？
  options:
  - label: A
    content: 物體狀態改變
  - label: B
    content: 物體溫度下降
  - label: C
    content: 物體質量減少
  - label: D
    content: 分子運動加快
  group_stem: '【閱讀文章】熱是物質還是能量？請閱讀以下文章，並依序回答38~39題。

    瓦節：我認為熱是一種物質，因為熱可以在不同物體之間轉移，而且熱素不會憑空產生或消失。

    福德：我認為熱是由物體內部分子的運動所產生的，所以熱是一種能量，而不是物質。

    瓦節：但如果熱是能量，那麼如何解釋熱的傳遞過程呢？當物體吸收或釋放熱素時，會導致其溫度變化。這種流動性使得熱可以從高溫物體轉移到低溫物體，這就表明熱元素的存在，它也能夠解釋為什麼某些物質在加熱時會變得更輕或更重。

    福德：我發現當分子運動加快時，物體的溫度就會上升，這顯示熱能量的轉移。譬如近期研究在低溫下摩擦冰塊溫度會上升，然而低溫環境不可能有「熱素」存在，所以熱應該是能量，而不是一種獨立的物質。能量在不同形式之間轉換，但總能量不變，這與熱的本質相符。

    瓦節：我們應該考慮到歷史上對熱素的觀察和實驗結果。

    福德：科學是隨著新證據而不斷演進的，我們必須接受現代科學對熱的理解。'
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 理化
      code: 5-2
      title: 熱量
      chapter: 第5章 溫度與熱
    textbook: 八上理化 5-2 熱量
    labeled_by: ai
