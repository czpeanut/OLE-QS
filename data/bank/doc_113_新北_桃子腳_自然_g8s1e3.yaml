  section: 1
  number: 4
  type: single
  page: 1
  stem: '小宥取質量100公克、溫度均為20℃的水、銅、銀和鉛四種物質，其比熱值如下表所示。若以穩定供應的熱源分別加熱，則哪一種物質的溫度最先到達 80℃？


