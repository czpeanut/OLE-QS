- id: doc_113_新北_桃子腳_自然_g8s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 下列有關比熱之敘述，何者正確？
  options:
  - label: A
    content: 任一物質的比熱，定義為使一公克的該物質溫度升高 1℃所需的熱量
  - label: B
    content: 以同樣之熱量加熱於質量相等的不同金屬塊，則比熱較大者，溫度上升的較多
  - label: C
    content: 燒熱一大壺水比燒熱一小壺水困難，可以推知大壺中的水比熱較大
  - label: D
    content: 銅比銀容易傳導熱
