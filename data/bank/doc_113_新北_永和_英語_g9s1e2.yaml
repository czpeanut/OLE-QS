    content: A smartphone.
  - label: B
    content: A VR headset.
  - label: C
    content: The Internet.
  - label: D
    content: Technology.
  group_stem: '【C】

    Technology plays an important part in our everyday life. From smartphones to the
    IoT, technology has had a deep impact on the way we work, think, and even share
    information with others. After using the VR headset in the art class, Kevin wanted
    to know more about modern technology. He surfed the Internet and found it has
    made our world more convenient but also more dangerous. He made a table about
    some information on the web page.


    | Get Information Easily | Sleeping Problems |

    | :--- | :--- |

    | 6.3 million searches are made every minute on Google. | Staying up too late
    or the light of the screens makes it hard for people to get a good night’s sleep.
    |

    | **Make Learning Easier** | **Little Exercise** |

    | Online learning lets anyone learn without leaving their home. | The more time
    we spend hanging out on YouTube and Instagram, the less time we spend outside
    doing other things. |

    | **Make Everyday Cleaning Easier** | **Too Much Information** |

    | Robot cleaners make clean floors faster. | People see more than they need. |

    | **Creating New Jobs** | **Health Problems** |

    | There are more than 133 million jobs about these new types of work. | People
    have more neck and back pain, as well as eye problems. |


    Kevin learned technology has greatly made our living space better. Although technology
    has dug too much from Mother Nature, it still shouldn’t be given up because it
    will help us a lot in taking care of some problems, for example by creating new
    things in a more sustainable way.

