    content: No one knows who the “new friend” is.
  - label: B
    content: The “new friend” is a toy for the father’s child.
  - label: C
    content: The father can hold the “new friend” in hands.
  - label: D
    content: The father plays music, videos and games for the “new friend”.
  group_stem: '【B】

    Dad’s New Friend

    Dad, look.

    I drew a picture of you today.

    Dad is not listening,

    But playing with his new friend.


    Dad, look.

    I got first place in the race.

    Dad is laughing crazily,

    But not even looking at me.


    The small thin black friend,

    With music, videos, and games,

    From breakfast to night in bed.

    Dad has the world when he holds it in his hands.


    When we take Dad''s new friend away,

    Dad looks like he is dead.

    His love for the new friend is a mystery.

    No one can explain.


    Now, I see no light in Dad''s eyes.

    I miss the good old times,

    We had great fun under the blue sky.

    How can I bring Dad''s soul back,

    And again make life bright?


     mystery 謎 (adapted from112 康軒模考)'
