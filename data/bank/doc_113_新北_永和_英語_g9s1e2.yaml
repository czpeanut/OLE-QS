- id: doc_113_新北_永和_英語_g9s1e2_s2_61
  section: 2
  number: 61
  type: single
  page: 6
  stem: '61. There are four important points in the reading:

    a. The problems of long-term care.

    b. What do the countries need to do for long-term care?

    c. Why is long-term care important?

    d. Aging countries and long-term care.

    In what order does the writer put the points in the reading?'
  options:
  - label: A
    content: b→a→c→d
  - label: B
    content: c→b→a→d
  - label: C
    content: a→c→d→b
  - label: D
    content: d→c→a→b
  group_stem: '【D】

    In many countries, people live longer and longer. This is called an “aging country.”
    (See Picture 1) So, there is a growing need for long-term care(LTC) with everyday
    activities. These activities are like bathing, dressing, eating, and moving around,
    and the seniors may get the help at home or in special care centers.

    As people get older, it may be hard for them to take care of themselves. Some
    people may have trouble with memory, eyes, or moving. Long-term care helps these
    people live more comfortably and safely. For example, caregivers can remind them
    to take their medicine, help them with walking, or prepare their meals. According
    to a 2022 report by the WHO (See Picture2), more and more people over age 65 needs
    long-term care. This need will grow fast in the coming years.

    Long-term care is important, but it can also be challenging. First, long-term
    care services are often expensive. Families may not afford the cost of caregivers
    or care centers. What’s more, there aren’t often enough caregivers to help them.
    Another challenge is how long-term care impacts family members. When family members
    are the caregivers, it can be stressful and take a lot of time. Family caregivers
    often need to balance their jobs and their lives when helping their loved ones.

    To solve these problems, some countries are trying to make their long-term care
    better and better. They are training more caregivers and providing families with
    help. Also, technology is helping, with tools like health devices and apps to
    remind people to take their medicine. It’s the key to understanding how important
    long-term care is if countries prepare to do more in the future.


     long-term 長期 challenge 挑戰 afford 可負擔 device 裝置'
