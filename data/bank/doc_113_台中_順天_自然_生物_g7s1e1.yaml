- id: doc_113_台中_順天_自然_生物_g7s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '探討生活中的科學現象時，常可依序用「觀察$\rightarrow$提出問題$\rightarrow$提出假設性的答案$\rightarrow$設計與進行實驗」的步驟來得到結論。小琳要研究渦蟲的行為，列出了甲、乙、丙、丁四個敘述，如附表所示。若以上述探討科學現象的步驟排列甲、乙、丙、丁，下列何者正確？

