  group_stem: '翻開台灣歷史，會發現台灣人的無奈之處，就是台灣人從未當過自己的主人。

    從荷蘭時代、鄭氏時期、清領時期、日治時期、中華民國遷台，每一個都是由外來的政權所統治，常常是一個條約，就要換政府了，而台灣人民只能接受。

    但台灣人一向不會忍氣吞聲，為了自身的權益，必要的時候還是會有許多人走上街頭、加入抗爭，(39題)都是台灣人爭取自身權益的案例，台灣今日的成就，是許多人的犧牲換來的。

    台灣過去的另一個問題，是族群間的衝突，(40題)都是曾有過的案例，可是台灣人的本性是善良的，是富有包容心的，長久下來已經沒有族群分別，我們已經將這裡當作共同的故鄉，我們都自認為是台灣人。

    現在的台灣，是民主的燈塔，我們照亮自己過去的黑暗，也吸引的世界的目光。我們要將這份包容心、這份不屈服、這辛苦得到的民主精神，一個一個點亮下去，台灣人會一起傳承這些寶藏，就像蔣渭水所說「同胞要團結，團結真有力」！'
