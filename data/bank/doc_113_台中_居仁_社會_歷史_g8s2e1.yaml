    問：當時袁世凱就任的職位

    應為何者？'
  options:
  - label: A
    content: 正式大總統
  - label: B
    content: 臨時大總統
  - label: C
    content: 中華帝國皇帝
  - label: D
    content: 清廷內閣總理
