- id: doc_113_台中_居仁_社會_歷史_g8s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '郝華為民初的新知識分

    子，也為新文化運動的支持者，在他的經歷中最不可

    能出現下列何者？'
  options:
  - label: A
    content: 認同共產主義加入共產黨
  - label: B
    content: 主張恢復傳統文化才能救國
  - label: C
    content: 關注兒童教育翻譯西方書籍
  - label: D
    content: 投入思想文化的改革行動
- id: doc_113_台中_居仁_社會_歷史_g8s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '二十世紀全紀錄一書中，對於民國6 年的北京，最可

    能有何記載？'
  options:
  - label: A
    content: 學生對巴黎和會之決議發起抗議行動
  - label: B
    content: 國民黨取法俄國革命經驗
  - label: C
    content: 溥儀復辟帝制重現
  - label: D
    content: 此年雖為民國6 年但也曾經是洪憲元年。
- id: doc_113_台中_居仁_社會_歷史_g8s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '紀念幣圖像往往為當時政治形

    勢的呈現。請問：右圖這個紀

    念幣的出現應與下列何者最有

    關係？'
  options:
  - label: A
    content: 軍閥割據
  - label: B
    content: 武昌起義
  - label: C
    content: 復辟事件
  - label: D
    content: 袁世凱帝制
  assets:
  - key: s1_6_f1
    kind: figure
    file: doc_113_台中_居仁_社會_歷史_g8s2e1/s1_6_f1.png
- id: doc_113_台中_居仁_社會_歷史_g8s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: '民國初年，中國出現如圖所示各

    地分別由不同軍閥掌控政權狀況，彼此間為爭奪權力戰

    爭不斷，北京政府的

    掌控者更是不斷更

    替。這種局面的出現，

    主要是因為何人逝世

    所引發之效應？'
  options:
  - label: A
    content: 孫中山
  - label: B
    content: 袁世凱
  - label: C
    content: 宋教仁
  - label: D
    content: 慈禧
  assets:
  - key: s1_7_f1
    kind: figure
    file: doc_113_台中_居仁_社會_歷史_g8s2e1/s1_7_f1.png
- id: doc_113_台中_居仁_社會_歷史_g8s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: '下列何事之後，中國的知識份子開始提出「鼓吹君主

    立憲以救國」、「武力革命改為共和體制」等多樣的救

    國途徑？'
  options:
  - label: A
    content: 日俄戰爭
  - label: B
    content: 五四運動
  - label: C
    content: 甲午戰爭
  - label: D
    content: 武昌起義
- id: doc_113_台中_居仁_社會_歷史_g8s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: '中華民國建立後，根據臨時政府組織大綱，採行「總

    統制」，但卻在不久後即變更為「內閣制」，其變化的

    主要原因為何？'
  options:
  - label: A
    content: 二次革命爆發
  - label: B
    content: 五四運動的影響
  - label: C
    content: 段祺瑞毀棄約法
  - label: D
    content: 牽制袁世凱作為
- id: doc_113_台中_居仁_社會_歷史_g8s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: '「軍閥割據，各地將領私募軍隊，掌控地方財政，控

    制地方政權，進而爭奪中央政權。」中國這種分裂局

    面，在何事之後終於解決重歸統一？'
  options:
  - label: A
    content: 辛亥革命
  - label: B
    content: 二次革命
  - label: C
    content: 護法運動
  - label: D
    content: 北伐行動
- id: doc_113_台中_居仁_社會_歷史_g8s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: '有本民初白話文小說中寫著:「這歷史沒有年代，歪

    斜的每頁都寫著『仁義道德』幾個字，我仔細看了半

    夜才從字縫中裏看出字來，這些文字都是吃人的妖

    怪』! 」請問：這小說表現的形式與所反應的想法最可

    能得到何人的支持？'
  options:
  - label: A
    content: 陳獨秀
  - label: B
    content: 梁啟超
  - label: C
    content: 孫中山
  - label: D
    content: 袁世凱
- id: doc_113_台中_居仁_社會_歷史_g8s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: '「北京大學歷史悠久，民國初年提倡自由學風的校

    長，除尊重原來學者之外，更延攬許多思想先進的前

    輩在學校任教，帶進許多西方新觀念新思想，培養出

    日後對中國政局影響深遠的人物。」關於這段話之內

    容，下列敘述何者正確？'
  options:
  - label: A
    content: 提倡自由學風的校長為蔣中正
  - label: B
    content: 思想先進的前輩為張學良等人
  - label: C
    content: 新觀念包括民主與科學等
  - label: D
    content: 促使北京大學成革命運動重鎮
- id: doc_113_台中_居仁_社會_歷史_g8s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: '「在袁世凱逼迫下，清帝溥儀退位，結束兩千多年的

    帝制，隨後中華民國臨時政府於南京成立，亞洲第一

    個民主共和國誕生。」郝家在認為這段敘述中有錯

    誤，請問他的證據應為何者？'
  options:
  - label: A
    content: 民國建立時，清帝國尚在北方掙扎
  - label: B
    content: 亞洲第一個民主共和國為日本
  - label: C
    content: 中華民國臨時政府成立於北京
  - label: D
    content: 溥儀因段祺瑞的逼迫而退位的
- id: doc_113_台中_居仁_社會_歷史_g8s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: '「民國初年北京府院政爭，總統為調解政爭，反引狼

    入室，帝制再度出現，時間雖短，卻讓野心軍閥趁機

    掌權，政局更為混亂。」上文中所言的短暫帝制後，

    中國出現何變化？'
  options:
  - label: A
    content: 參加一次大戰
  - label: B
    content: 出現三處中國政府
  - label: C
    content: 中國共產黨成立
  - label: D
    content: 二次革命爆發
- id: doc_113_台中_居仁_社會_歷史_g8s2e1_s1_15
  section: 1
  number: 15
  type: single
  page: 1
  stem: '「在中國，有一段時期，社會各階層紛紛以罷工、罷

    市、罷課等各種行動，展開向政府及國際爭取國家主

    權的行動，最終獲得政府回應拒簽和約。」請問這個

    時期應為何時？'
  options:
  - label: A
    content: 袁世凱專政時期
  - label: B
    content: 一次大戰結束後
  - label: C
    content: 革命軍北伐時期
  - label: D
    content: 國共合作時期
- id: doc_113_台中_居仁_社會_歷史_g8s2e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: "甲資料：「1917-10-12. 北京僞政府亂國盜權之\n罪，本日通令宣布全國，查段祺瑞實爲首逆，梁啓\n超、湯化龍爲主謀，………，著各路司令一體進勦」\
    \ \n乙資料：「1917-09-29. 孫文等通電全國，僭稱非常國\n會，設立軍政府，舉孫文爲大元帥，並立各部總長、\n總參謀、都督諸名目……其爲謀覆政府，紊亂國憲，逆\n\
    跡實已昭著……著各軍民長官一體嚴緝，拿交法庭」 \n關於此兩段資料的內容，下列何者錯誤？"
  options:
  - label: A
    content: 甲資料為孫中山立場
  - label: B
    content: 當時中國呈現兩個政府南北分裂狀況
  - label: C
    content: 兩份資料的出現與臨時約法的恢復與否有關
  - label: D
    content: 乙資料公告時的總統應為袁世凱
- id: doc_113_台中_居仁_社會_歷史_g8s2e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: '民國19 年的日曆，在五月九日這天，以紅字標註著

    「國恥日」，若就歷史發展判斷，此安排所欲提醒眾人

    的為何歷史教訓？'
  options:
  - label: A
    content: 巴黎和會不公平對待
  - label: B
    content: 德國奪佔山東勢力範圍
  - label: C
    content: 北京政府被迫接受二十一條要求
  - label: D
    content: 袁世凱改國號為中華帝國
- id: doc_113_台中_居仁_社會_歷史_g8s2e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: '象徵國家的旗幟變化可反應政治的轉換，20 世紀初

    期代表中國的旗幟從「黃龍旗」轉變為「五色旗」，這

    變化所代表的意義為何？'
  options:
  - label: A
    content: 軍閥亂政到國家統一
  - label: B
    content: 君主專制到民主共和
  - label: C
    content: 洪憲帝制的帶來的體制改變
  - label: D
    content: 國共衝突的政權分裂
- id: doc_113_台中_居仁_社會_歷史_g8s2e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: '「傾覆滿洲專制政府，鞏固中華民國，圖謀民生幸

    福，此國民之公意；文實遵之，以忠於國，為眾服務。

    至專制政府既倒，國內無變亂，民國卓立於世界、為列

    邦公認，斯時文當解臨時大總統之職。謹以此誓於國

    民。」此為某位政治人物就職誓詞，但日後其解職卻是

    因政府與何人的妥協所致？'
  options:
  - label: A
    content: 袁世凱
  - label: B
    content: 孫中山
  - label: C
    content: 段祺瑞
  - label: D
    content: 日本帝國
- id: doc_113_台中_居仁_社會_歷史_g8s2e1_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: '「北洋軍將領，民國初建時被稱為軍閥，對內割據地

    方，對外犧牲國家利益以求取外援，使民國雖建立，

    但國家仍處於動盪不安的局面，成為列強眼中的獵

    物。」關於文中的「北洋軍」，下列敘述何者正確？'
  options:
  - label: A
    content: 出現於自強運動時
  - label: B
    content: 屬於袁世凱所編練的新式軍隊
  - label: C
    content: 為國民黨的主要組成分子
  - label: D
    content: 隨洪憲帝制失敗而消失
- id: doc_113_台中_居仁_社會_歷史_g8s2e1_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: '民國建立後，共和體制曾兩次被破壞，但均為曇花一

    現，存在時間極短。此二次帝制存在時間極短的原因

    最可能為下列何者？'
  options:
  - label: A
    content: 俄國革命成功經驗的啟發
  - label: B
    content: 民主共和宣揚民眾反感帝制
  - label: C
    content: 巴黎和會外交失利刺激
  - label: D
    content: 五四運動思潮影響
- id: doc_113_台中_居仁_社會_歷史_g8s2e1_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: '歷史上許多影響重大的政治事件，往往緣起於政府對

    政策施行的輕忽。如1911 年的中國，當時政府以為單

    純的一項政策，卻引發大規模群眾抗爭，進而導致政

    府的垮台。例子所舉的1911 年政府決策應為何者？'
  options:
  - label: A
    content: 鐵路國有政策
  - label: B
    content: 接受二十一條要求
  - label: C
    content: 參加一次世界大戰
  - label: D
    content: 修法擴大總統職權
- id: doc_113_台中_居仁_社會_歷史_g8s2e1_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: '「驅逐韃虜，恢復中華，創立民國，平均地權」為

    綱領的組織，應為何者？'
  options:
  - label: A
    content: 中國共產黨
  - label: B
    content: 廣州護法政府
  - label: C
    content: 中國國民黨
  - label: D
    content: 中國革命同盟會
- id: doc_113_台中_居仁_社會_歷史_g8s2e1_s1_24
  section: 1
  number: 24
  type: single
  page: 2
  stem: '民國13 年1 月20 日，國民黨第一次全國代表大會

    開幕，孫中山以國民黨總理身分擔任大會主席。出席

    大會的代表共165 人，包括了李大釗、毛澤東等20 位

    共產黨員。之所以會在此次大會中會出現共產黨員的

    狀況，應與以何為目的的決策有關？'
  options:
  - label: A
    content: 與軍閥抗衡
  - label: B
    content: 與列強爭國家主權
  - label: C
    content: 結束滿清帝制
  - label: D
    content: 討袁護國
- id: doc_113_台中_居仁_社會_歷史_g8s2e1_s1_25
  section: 1
  number: 25
  type: single
  page: 2
  stem: '國父孫中山先生一生為國家民族奮鬥，民國14 年過

    世時仍憂慮著國家的未來，臨終前在病榻上仍叮囑著

    「革命尚未成功，同志仍須努力」。請問：國父臨終當

    時，希望同志達成的革命目標為何？'
  options:
  - label: A
    content: 共產黨的武裝抗爭
  - label: B
    content: 自列強手中收回租借地
  - label: C
    content: 結束軍閥亂政局面
  - label: D
    content: 國民政府分裂局面
- id: doc_113_台中_居仁_社會_歷史_g8s2e1_s1_26
  section: 1
  number: 26
  type: single
  page: 2
  stem: '民國16 年中華民國「國民政府」定都於南京，請

    問：此國民政府最初的出現應與下列哪一組織有關？'
  options:
