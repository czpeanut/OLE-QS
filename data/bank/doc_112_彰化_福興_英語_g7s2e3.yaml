  group_stem: "3. The Olympics(奧運) are a big event in the world of sports. They take\
    \ place(舉辦) every four years, and cities around the world want to host(主辦) them.\
    \ They are proud to do so and work hard to get everything ready for the big event.\
    \ Thousands of athletes come from around the world to be at the games.\n The first\
    \ Summer Olympics was in Athens, Greece, in 1896, and the first Winter Olympics\
    \ were in Chamonix, France, in 1924. London hosted the Summer Olympics three times\
    \ --- in 1908,1948, and 2012. The Summer Olympics is coming in Paris, France this\
    \ July. It is its third time.\n The athletes can't wait to join the Olympics.\
