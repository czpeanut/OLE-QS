  group_stem: "1. The forest is home to many living things, big and small. In the\
    \ forest there are plants. There are trees growing big and tall. There are flowers\
    \ growing bright and small. There are grasses growing thick and green.\n In the\
    \ forest there are lots of animals. There are big animals like bears and deer.\
