    母親也十分忌諱在臘月間打破器物，如果不慎失手打碎了盤碗，必要說一句：「歲歲平安。」

    這些小時候不十分懂，大了以後有一點厭煩的瑣細的行為，現今回想起來是有不同滋味的。

    遠離故土的父母親，在異地暫時安頓好簡陋的居處，稍稍歇息了久經戰亂的恐懼不安，稍稍減低了一點離散、饑餓、流亡的陰影，他們對於過年的慎重，他們許多看來迷信的禁忌，他們對食物刻意豐盛的儲備，今天看來，似乎都隱含著不可言說的辛酸與悲哀。

    蔣勳〈無關歲月〉'
