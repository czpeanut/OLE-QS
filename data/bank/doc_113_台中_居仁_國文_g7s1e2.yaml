  group_stem: '(丁)在父母的觀念中，過年是一件了不得的大事。民國四十年許，我們從大陸遷臺，不僅保留了故鄉過年的儀節規矩，也同時增加了不少本地新的習俗；我孩童時代的過年便顯得異常熱鬧忙碌。

    母親對於北方過年的講究十分堅持。一進臘月，各種醃臘風乾的食物，便用炒過的花椒鹽細細抹過，浸泡了醬油，用紅繩穿掛了，一一吊曬在牆頭竹竿上。

    用土罈封存發酵的豆腐乳、泡菜、糯米酒釀，一缸一甕靜靜置於屋簷角落。我時時要走近去，把耳朵俯貼在罎面上，彷彿可以聽到那平靜厚實的穩重大缸下醞釀著美麗動人的聲音。

    母親也和鄰居本地婦人們學做了發粿和閩式年糕。碾磨糯米的石磨現在是不常見到了。那從石磨下汩汩流出的白色米漿，被盛放在洗淨的麵粉袋中，紮成飽滿厚實胖鼓鼓的樣子，每每逗引孩子們禁不住去戮弄它們。水分被擠壓以後凝結的白色的米糕，放在大蒸籠裡，底下加上徹夜不熄的熾旺的大火，那香甜的氣味，混雜著炭火的煙氣便日夜彌漫我們的巷弄。放假無事的孩童，在各處忙碌的大人腳邊鑽竄著，驅之不去，連那因為蒸年糕而時常引發的火警、消防車噹噹趕來的急迫和匆促，也變成心中不可解說的緊張與興奮。

    早年臺灣普遍經濟狀況並不富裕的情況下，過年的確是一種興奮的剌激，給貧困單調的生活平添了一個高潮。

