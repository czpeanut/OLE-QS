  page: 3
  stem: '| 美國、日本、希臘 | 6 月第三個星期日 | 送紅玫瑰給在生的父親，白玫瑰獻給仙逝的父親；並為他準備早餐與送上父親節卡片。 |

    | 德國 | 復活節後 40 天 | 全國男士全天都可以放肆喝啤酒，父親們會推著裝滿啤酒的大木桶與其他人同歡。 |

    | 西班牙、義大利等天主教國家 | 3 月 19 日 | 又稱作「聖約瑟夫日」，紀念耶穌世間的父親聖荷西（Saint Joseph）；除了跟父親們致敬，也要跟耶穌世間的養父
    Saint Joseph 致敬，因此當天，若遇到有叫「Joseph」的人，都要問好以表敬意。 |

    | 泰國 | 12 月 5 日 | 父親節會定這日，是因此日為泰王「拉瑪九世—普美蓬．阿杜德」生日；全國人民當天須穿著黃衣至寺廟祈福、家家戶戶掛上黃燈籠。
    |

    | 臺灣 | 8 月 8 日 | 又稱「八八節」，為了紀念在抗日戰爭犧牲的軍人，當中大部分已是爸爸，後來，臺灣將父親節訂於 8 月 8 日，取其諧音「爸爸」。
    |

