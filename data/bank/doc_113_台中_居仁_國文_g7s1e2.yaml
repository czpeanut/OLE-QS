- id: doc_113_台中_居仁_國文_g7s1e2_s5_8
  section: 5
  number: 8
  type: single
  page: 4
  stem: 根據無關歲月一文，下列說明何者正確？
  options:
  - label: A
    content: 用生動對話表現父母感恩不忘本的形象
  - label: B
    content: 在臺灣過年和當年在大陸習俗截然不同
  - label: C
    content: 舉打破碗盤當例子說明他對母親迷信行為的讚賞
  - label: D
    content: 藉細節描寫，呈現母親儲備食物及注重禁忌的情形
  group_stem: '(丁)在父母的觀念中，過年是一件了不得的大事。民國四十年許，我們從大陸遷臺，不僅保留了故鄉過年的儀節規矩，也同時增加了不少本地新的習俗；我孩童時代的過年便顯得異常熱鬧忙碌。

    母親對於北方過年的講究十分堅持。一進臘月，各種醃臘風乾的食物，便用炒過的花椒鹽細細抹過，浸泡了醬油，用紅繩穿掛了，一一吊曬在牆頭竹竿上。

    用土罈封存發酵的豆腐乳、泡菜、糯米酒釀，一缸一甕靜靜置於屋簷角落。我時時要走近去，把耳朵俯貼在罎面上，彷彿可以聽到那平靜厚實的穩重大缸下醞釀著美麗動人的聲音。

    母親也和鄰居本地婦人們學做了發粿和閩式年糕。碾磨糯米的石磨現在是不常見到了。那從石磨下汩汩流出的白色米漿，被盛放在洗淨的麵粉袋中，紮成飽滿厚實胖鼓鼓的樣子，每每逗引孩子們禁不住去戮弄它們。水分被擠壓以後凝結的白色的米糕，放在大蒸籠裡，底下加上徹夜不熄的熾旺的大火，那香甜的氣味，混雜著炭火的煙氣便日夜彌漫我們的巷弄。放假無事的孩童，在各處忙碌的大人腳邊鑽竄著，驅之不去，連那因為蒸年糕而時常引發的火警、消防車噹噹趕來的急迫和匆促，也變成心中不可解說的緊張與興奮。

    早年臺灣普遍經濟狀況並不富裕的情況下，過年的確是一種興奮的剌激，給貧困單調的生活平添了一個高潮。

    在忙碌與興奮中，也夾雜著許多不可解的禁忌。孩子們一再被提醒著不准說不吉祥的話。禁忌到了連同音字或一切可能的聯想也被禁止著，單方面的禁止孩子，便不生什麼實際的效果，母親就乾脆用紅紙寫了幾張「童言無忌」，四處張貼在我們所到之處。

    母親也十分忌諱在臘月間打破器物，如果不慎失手打碎了盤碗，必要說一句：「歲歲平安。」

    這些小時候不十分懂，大了以後有一點厭煩的瑣細的行為，現今回想起來是有不同滋味的。

    遠離故土的父母親，在異地暫時安頓好簡陋的居處，稍稍歇息了久經戰亂的恐懼不安，稍稍減低了一點離散、饑餓、流亡的陰影，他們對於過年的慎重，他們許多看來迷信的禁忌，他們對食物刻意豐盛的儲備，今天看來，似乎都隱含著不可言說的辛酸與悲哀。

    蔣勳〈無關歲月〉'
