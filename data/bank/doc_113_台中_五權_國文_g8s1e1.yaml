- id: doc_113_台中_五權_國文_g8s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 「風箏」在文學作品中有各種不同的意涵。下列哪個選項中所描述的「風箏」和「細細一線，卻想與整座天空拔河」的意涵相近?
  options:
  - label: A
    content: 風箏在藍天中翱翔，彷彿帶著無數夢想，隨風而行，自由無拘無束
  - label: B
    content: 即使風箏被樹枝卡住，我依然努力拉扯。這份堅持讓我明白，放飛夢想的路途充滿挑戰，但也更顯珍貴
  - label: C
    content: 每當春風吹起，手中的風箏不斷高飛，童年的笑聲伴隨著風聲，成為最美的記憶
  - label: D
    content: 那根細線不僅牽著風箏，也牽著我和父親的心，讓我們在每一次放風箏中共享無言的默契
  tags:
    textbook: 八上 第一課 田園之秋選
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 八上
      subject: 國文
      code: 第一課
      title: 田園之秋選
      chapter: null
