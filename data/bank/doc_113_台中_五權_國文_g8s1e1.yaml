  page: 1
  stem: 下列選項關於詩人之描述何者有誤?
  options:
  - label: A
    content: 白靈:積極開拓網路創作與數位文學，題材多元，想像力豐富，是當代重要女詩人
  - label: B
    content: 艾青:年少時於巴黎學畫，開始接觸現代派詩歌。經流放及勞改仍創作不輟，詩作能反映社會現實
  - label: C
    content: 楊喚:年幼時母親即離世，童年生活並不幸福。長大後卻能以文學熱忱創作出多首純真可愛的童詩，為台灣兒童文學之先驅
  - label: D
    content: 蓉子:台灣詩壇「永遠的青鳥」。早期詩風多抒情，風格柔美細膩，後期作品開始走向知性及意象的形塑
