- id: doc_113_新北_江翠_國文_g7s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 「粗」和「糙」都有「不光滑、不細緻」的意思，「粗糙」一詞就稱為「同義複詞」。下列「 」中的詞語，何者不是同義複詞？
  options:
  - label: A
    content: 桂花開得最「茂盛」時，能香聞十里
  - label: B
    content: 幼時雨天的時光特別讓人「眷戀」
  - label: C
    content: 形形色色的紙船或比肩齊步，或互相「追逐」
  - label: D
    content: 我們所「得到」的是真正的快樂
