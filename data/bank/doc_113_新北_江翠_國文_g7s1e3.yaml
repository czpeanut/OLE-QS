  stem: 畫線處最適合填入的句子為何?
  options:
  - label: A
    content: 君子遠庖廚
  - label: B
    content: 君子不重則不威
  - label: C
    content: 君子之交淡如水
  - label: D
    content: 君子不可不學
  group_stem: 孔子謂子路曰：「汝何好？」子路曰：「好長劍。」孔子曰：「非此之問也，請以汝之所能加之以學，豈可及哉？」子路曰：「學豈益哉？」孔子曰：「夫人君無諫臣則失政，士無教交則失德，狂馬不釋其策，操弓不返於檠，木受繩則直，人受諫則聖，受學重問，孰不順成？毀仁惡士，且近於刑，________」子路曰：「南山有竹，不揉自直，斬而用之，達於犀革，以此言之，何學之有？」孔子曰：「括而羽之，鏃而礪之，其入不亦深乎？」子路再拜曰：「敬而受教。」                                            (《孔子家語》)
