- id: doc_113_新北_江翠_國文_g7s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 「學而時習之，不亦說乎?」答案就在問題的反面，此為設問修辭中的「激問」，下列何者也是？
  options:
  - label: A
    content: 問君能有幾多愁？恰似一江春水向東流
  - label: B
    content: 來日綺窗前，寒梅著花未？
  - label: C
    content: 何以解憂？唯有杜康
  - label: D
    content: 不入虎穴，焉得虎子？
- id: doc_113_新北_江翠_國文_g7s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 下列文句，何者沒有語病?
  options:
  - label: A
    content: 你再不乖，就要被挨揍了
  - label: B
    content: 我小時候的時候，最愛跟著媽媽去市場
  - label: C
    content: 從高空仰觀，所有景物都變得非常渺小
  - label: D
    content: 他大學畢業後，便遠渡重洋，負笈法國
- id: doc_113_新北_江翠_國文_g7s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 同一個中文詞語經常能表達不同意思，例如：「風光」有「風景」及「榮耀」兩個意思，請問下列詞語的解釋何者正確？
  options:
  - label: A
    content: 我們要當心個人言行，以免遭人「指點」/指示、引導
  - label: B
    content: 遇到朋友有難時，他總是願意「慷慨」解囊 / 義氣激昂
  - label: C
    content: 這孩子的言談舉止，「儼然」小大人 / 好似
  - label: D
    content: 此次聚會，大家無不喝得酣暢「淋漓」 / 溼透的樣子
- id: doc_113_新北_江翠_國文_g7s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 下列對於作家之敘述，何者有誤？
  options:
  - label: A
    content: 李潼：以海洋文學為主要創作，為知名之民歌作詞家
  - label: B
    content: 洪醒夫：以鄉土小說聞名，作品多為關懷台灣農村中的小人物
  - label: C
    content: 琦君：散文多為懷舊主題，以平易之文字表達真實之情感
  - label: D
    content: 張曼娟：開設「張曼娟小學堂」，致力於中國文學之傳承
- id: doc_113_新北_江翠_國文_g7s1e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 關於〈牛背上的呀喝〉一文之分析，下列何者有誤?
  options:
  - label: A
    content: 作者以第一人稱立場敘事
  - label: B
    content: 以倒敘法寫他的童年往事
  - label: C
    content: 以騎牛前想像的風光場景和實際騎牛的狼狽情景對比
  - label: D
    content: 活用改造之詞語，增添騎牛之趣味感
  lesson_raw:
    title: 牛背上的呀喝
    basis: 題幹提及〈牛背上的呀喝〉
- id: doc_113_新北_江翠_國文_g7s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 〈牛背上的呀喝〉一文，作者體會到的道理與何者最不相近？
  options:
  - label: A
    content: 書到用時方恨少，事非經過不知難
  - label: B
    content: 親身下河知深淺，親口嘗梨知酸甜
  - label: C
    content: 紙上得來終覺淺，絕知此事要躬行
  - label: D
    content: 不識廬山真面目，只緣身在此山中
  lesson_raw:
    title: 牛背上的呀喝
    basis: 題幹提及〈牛背上的呀喝〉
- id: doc_113_新北_江翠_國文_g7s1e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 下列關於《論語》之敘述，何者正確?
  options:
  - label: A
    content: 由孔子及其弟子記錄編輯而成
  - label: B
    content: 為孔子與弟子及當時人物談論應答之紀錄
  - label: C
