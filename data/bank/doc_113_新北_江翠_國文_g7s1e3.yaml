- id: doc_113_新北_江翠_國文_g7s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: '爺爺的生日宴會上，久違的親戚互相自我介紹，請問以下五人依年齡由大到小排列，下列何者正確？


    | 軒軒： | 我今年已經到了志學之年了。 |

    | --- | --- |

    | 恩恩： | 我今年正值二八年華。 |

    | 阿哲： | 我今年剛過而立而尚未結婚。 |

    | 昇仔： | 我明年打算慶祝花甲之年生日。 |

    | 小明： | 我剛行過弱冠之禮。 |'
  options:
  - label: A
    content: 昇仔、阿哲、小明、恩恩、軒軒
  - label: B
    content: 軒軒、恩恩、小明、阿哲、昇仔
  - label: C
    content: 阿哲、昇仔、恩恩、小明、軒軒
  - label: D
    content: 恩恩、昇仔、小明、軒軒、阿哲
- id: doc_113_新北_江翠_國文_g7s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 下列「 」中的成語，何者使用最恰當?
  options:
  - label: A
    content: 時空閱讀館的藏書如「九牛一毛」，要多加利用
  - label: B
    content: 空污嚴重，每次下雨都不撐傘，屆時「牛山濯濯」可就後悔莫及了
  - label: C
    content: 若能養成好的讀書習慣，段考對他而言便如「泥牛入海」啊
  - label: D
    content: 校慶園遊會竟邀請到五星級飯店主廚操刀，未免也太「風馬牛不相及」吧
