  lesson_raw:
    title: 論語選
    basis: 題幹提及《論語》
- id: doc_113_新北_江翠_國文_g7s1e3_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 〈紙船印象〉文中提到「只盼望自己能以母親的心情，為子女摺出一艘艘未必漂亮但卻堅強的、禁得住風雨的船，如此，便不致愧對紙船了。」句中「禁得住風雨」意謂作者希望他的子女成長以後能夠如何？
  options:
  - label: A
    content: 記得母親早年吃的苦
  - label: B
    content: 承受生活的挫折和磨鍊
  - label: C
    content: 懂得知錯能改，更上層樓
  - label: D
    content: 發揮己長，進一步貢獻於社會
  lesson_raw:
    title: 紙船印象
    basis: 題幹提及〈紙船印象〉並引用課文句子
- id: doc_113_新北_江翠_國文_g7s1e3_s1_20
  section: 1
  number: 20
  type: single
  page: 3
  stem: 「譬如為山，未成一簣，止，吾止也。」其涵義與何者不同？
  options:
  - label: A
    content: 掘井九仞而不及泉，猶為棄井也
  - label: B
    content: 行百里者半九十
  - label: C
    content: 鍥而不捨，金石可鏤
  - label: D
    content: 為山九仞，功虧一簣
  lesson_raw:
    title: 論語選
    basis: 引用《論語》課文原句
- id: doc_113_新北_江翠_國文_g7s1e3_s1_21
  section: 1
  number: 21
  type: single
  page: 3
  stem: 關於〈紙船印象〉與〈故鄉的桂花雨〉的比較，下列說明何者錯誤？
  options:
  - label: A
    content: 前者的「紙船」與後者的「桂花」，均可代表作者童年的回憶
  - label: B
    content: 兩者都是藉由「雨天」追憶童年的種種往事
  - label: C
    content: 皆以第一人稱書寫，情感流露，真摯自然
  - label: D
    content: 兩者文中所描述的母親形象都是辛勤而溫柔的
- id: doc_113_新北_江翠_國文_g7s1e3_s1_22
  section: 1
  number: 22
  type: single
  page: 3
  stem: 有關〈紙船印象〉的文意分析，下列何者正確？
  options:
  - label: A
    content: 「在童年的無三尺浪的簷下水道航行」指無憂無慮的童年歲月
  - label: B
    content: 「也許那雨一下就是十天半月，農作物都有被淋壞、被淹死的可能」指對母親綿長的愛與思念
  - label: C
    content: 「這些紙船都是有感情的」指母親為孩子犧牲作物也在所不惜
  - label: D
    content: 「我們得到的是真正的快樂」指玩紙船是童年唯一的回憶
  lesson_raw:
    title: 紙船印象
    basis: 題幹提及〈紙船印象〉
- id: doc_113_新北_江翠_國文_g7s1e3_s1_23
  section: 1
  number: 23
  type: single
  page: 3
  stem: 〈紙船印象〉提到：「它們大都出自母親的巧思和那雙粗糙不堪、結著厚繭的手」，又說：「這種美麗的感情要到年事稍長後才能體會出來」請問與下列者意思相同？
  options:
  - label: A
    content: 不孝有三，無後為大
  - label: B
    content: 虎毒不食子
  - label: C
    content: 幼吾幼以及人之幼
  - label: D
    content: 養兒方知父母恩
  lesson_raw:
    title: 紙船印象
    basis: 題幹提及〈紙船印象〉並引用課文
- id: doc_113_新北_江翠_國文_g7s1e3_s1_24
  section: 1
  number: 24
  type: single
  page: 3
  stem: 歌德：「正確地了解一件事並實踐它，比起做一百件事情卻半途而廢，更能給我們高度教養。」其涵義與何者最相近？
  options:
  - label: A
    content: 事之難易不在大小，務在知時
  - label: B
    content: 人一能之己百之，人十能之己千之
  - label: C
    content: 憂勞可以興國，逸豫可以亡身
  - label: D
    content: 心心在一藝，其藝必工，心心在一職，其職必舉
- id: doc_113_新北_江翠_國文_g7s1e3_s1_25
  section: 1
  number: 25
  type: single
  page: 3
  stem: 「如果你真能嘈嘈如急雨地那般壯闊，那你就去充當大弦，如果你只能切切如私語那般清婉，便不妨去充任小弦的角色。」顧鴻翔〈志存高遠〉，這段話揭示了何種人生態度?
  options:
  - label: A
    content: 八面玲瓏
  - label: B
    content: 量力而為
  - label: C
    content: 謙沖自牧
  - label: D
    content: 行不由徑
- id: doc_113_新北_江翠_國文_g7s1e3_s1_26
  section: 1
  number: 26
  type: single
  page: 3
  stem: 柏拉圖：「聰明人說話，是因為有話要說，蠢人說話，是因為要說些話。」其涵義與何者最相近？
  options:
  - label: A
    content: 來說是非者，便是是非人
  - label: B
    content: 古者言之不出，恥躬之不逮也
  - label: C
    content: 君子之言寡而實，小人之言多而虛
  - label: D
    content: 人之將死，其言也善
- id: doc_113_新北_江翠_國文_g7s1e3_s2_27
  section: 2
  number: 27
  type: single
  page: 3
  stem: 根據上文，關於金桂和銀桂的說明，下列何者正確？
  options:
  - label: A
    content: 以開花狀態做比較，銀桂較為茂盛壯觀
  - label: B
    content: 以花色作比較，金桂比較鮮明亮麗
  - label: C
    content: 以葉色作比較，銀桂比較暗沉深綠
  - label: D
    content: 以花香作比較，金桂比較濃郁芬芳
  group_stem: 桂花有銀桂、金桂二種。銀桂又名木樨，是一年到頭月月開的，所以也稱月月桂。花是淡黃色的，開得稀稀落落的幾撮，深藏綠葉之中，散發著淡淡的清香，似有若無。與銀桂完全不同的是金桂，開的季節卻是中秋前後。金黃色的花，成串成球，非常茂密，與深綠色的葉子相映照，顯得很壯觀。但是開得快，謝得也快。一大陣秋雨，就紛紛零落了。（改寫自琦君〈桂花滷、桂花茶〉)
