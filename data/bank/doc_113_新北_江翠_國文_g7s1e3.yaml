  stem: 四個弟子同樣問孝，孔子的回答不同，此教育理念與何者最接近?
  options:
  - label: A
    content: 有教無類
  - label: B
    content: 因材施教
  - label: C
    content: 一以貫之
  - label: D
    content: 溫故知新
  group_stem: '(甲)孟懿子問孝，子曰：「無違。」樊遲御，子告之曰：「孟孫問孝於我，我對曰無違。」樊遲曰：「何謂也？」子曰：「生，事之以禮，死，葬之以禮，祭之以禮。」

    (乙)孟武伯問孝，子曰：「父母唯其疾之憂。」

    (丙)子游問孝，子曰：「今之孝者，是謂能養，至於犬馬，皆能有養，不敬，何以別乎？」

    (丁)子夏問孝，子曰：「色難，有事弟子服其勞，有酒食先生饌，曾是以為孝乎？」      (〈論語・為政篇〉)'
