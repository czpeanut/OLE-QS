- id: doc_111_桃園_石門_數學_g8s2e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: '阿源伯出了一個題目：給 $\angle ABC$，請以尺規作圖畫出平行四邊形 ABCD。兩位同學作法如下：

    詩綺：分別以 A、C 為圓心，$\overline{BC}$、$\overline{AB}$ 為半徑畫兩弧。兩弧交於 D 點即可。

    思穎：連接 $\overline{AC}$ 並找出中點 M，連接 $\overrightarrow{BM}$，在 $\overrightarrow{BM}$
    上找 $\overline{BM} = \overline{MD}$ 即可找到 D 點。

    請問哪位同學說的才正確？'
  options:
  - label: A
    content: 詩綺
  - label: B
    content: 思穎
  - label: C
    content: 兩人皆不正確
  - label: D
    content: 兩人皆正確
