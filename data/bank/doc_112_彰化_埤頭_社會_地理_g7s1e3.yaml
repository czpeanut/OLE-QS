- id: doc_112_彰化_埤頭_社會_地理_g7s1e3_s1_35
  section: 1
  number: 35
  type: single
  page: 3
  stem: 請問台灣水資源大多直奔大海，留不住水，請問與下列哪個原因無關？
  group_stem: '【題組】閱讀文章，回答35-39題

    降雨豐富的台灣，有八成水資源不是蒸發就是直奔大海，加上全球倒數第二低的水價，讓人均用水量年年攀升。氣候變遷威脅之下，今年的嚴重乾旱，農業損失超過80億、中南部地區長達202天的限水措施。所幸夏、秋兩季的①雨、夏季②雨及夏季的③季風帶來豐沛雨量，儘管紓解了乾旱災情，但雨災卻緊接著到來。台灣中南部的雨量季節差異大，雨來了，我們能夠留住多少水？

    2018年台灣實際利用的總水量約167億噸，僅佔總降雨量的19%。其中70億噸引用河川水、54億噸取用地下水、淡水庫存取的約42億噸，但台灣水庫整體的有效庫容不足20億噸，即便所有水庫裝滿2次，也不足供應全年所需。

    [修改自2021/8/9環境資訊中心記者張文駱報導]'
