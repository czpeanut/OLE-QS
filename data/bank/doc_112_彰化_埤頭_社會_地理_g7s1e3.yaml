      file: doc_112_彰化_埤頭_社會_地理_g7s1e3/1_32_optD.png
  group_stem: '【題組】閱讀下文，回答32-34題

    臺灣鹽歷起始於明鄭，而臺灣南部自古即為曬鹽要地。在這些鹽地帶，由於具有廣大平坦的灘地，加上降雨季節集中在夏季，冬季日照充足，蒸發量大，且季風強速，因此非常適合曬鹽。從第一畝鹽田在明永曆19年開闢於瀨口，到日治時期為戰事大量擴場，再到光復初期的鹿港、布袋、北門、七股、臺南、烏樹林六大鹽場，直至民國91年臺灣停止曬鹽，這些變遷全寫在臺灣南部沿海的土地上。'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
