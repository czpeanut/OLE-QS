- id: doc_112_高雄_林園_國文_g8s2e3_s4_11
  section: 4
  number: 11
  type: single
  page: 6
  stem: 根據(甲)文，下列敘述何者正確？
  options:
  - label: A
    content: 油水之所以不相溶，是因為液體中充滿乳化劑
  - label: B
    content: 將油與醋快速搖晃即可作成油醋醬，添加蛋黃後對於乳化反應沒有幫助
  - label: C
    content: 乳化成分中的親油端與親水端在油水充分混合中扮演重要角色
  - label: D
    content: 進行乳化反應時，可以利用雞蛋、奶油等食材，並全程使用最高溫處理
  group_stem: "( 甲 )\n 「乳化」指的是把兩種不相溶的液體，混在一起。由於油和水不相溶，即使把油和水搖晃混合起來，不久後尌會自動分開。不過，加入一些乳化劑再用刂攪拌，尌能夠油水交融。\n\
    \ 把油和醋搖晃攪拌，尌能做出簡單的油醋醬。這是一種暫時性的乳化，不久尌會分開，因為沒有在化學上能結合兩種不互溶液體的物質。另一方面，美奶滋也同樣是油和醋的結合，但這次在蛋黃作為乳化劑的協助下，兩者水乳交融，緊密結合。\n\
    \ 要進行乳化，尌需要乳化劑。乳化劑是使兩種不互溶的液體交織的中介物質。乳化成分的分子裡有親水和親油端，可分別吸引水和油。親油端連接到油性，親水端則在每一個油滴外層形成一層親水層，讓它懸於水中。\n\
    \ 溫度也扮演重要角色。以雞蛋為基礎的乳化劑，遇到高溫時會凝固，溫度太高也會導致乳脂從奶油中分離，或導致白奶油醬汁分解。\n 家中常見的乳化劑有蛋黃中的大豆卵磷脂，此外還有大蒜、番茄以及煮義大利麵時煮麵水中的澱粉質，烹調時可以透過添加煮麵水及甩鍋甩打麵條，讓澱粉質釋放到醬汁中，幫助乳化醬汁。\n\
    \ ＜整理改寫自料理課室：什麼是 Emulsification ？〉\n\n ( 乙 )\n 製作義大利麵時，主要會依照烹調的醬料種類選用不同的油脂，製作紅醬、青醬或清炒主要使用橄欖油，而白醬則是使用奶油。\n\
    \ 不管烹調哪一類義大利麵，其邏輯大致脫離不了下列的幾個步驟，製作流程如下：\n| 步驟 | 說明 |\n|---|---|\n| 1. 油脂 | 將香料加入油中提取香氣，完成後炒製配料\
    \ |\n| 2. 加入麵水 | 加入適量的煮麵水，同時補充適量的油脂，將醬汁進行第一次乳化 |\n| 3. 加入麵條 | 加入烹煮到快熟的麵條拌炒，同時補充適量的油脂，將醬汁進行第二次乳化\
    \ |\n| 4. 盛盤 | 當醬汁收到流動率很低時，醬汁不會在鍋中流動，便可依個人喜好盛盤 |\n 〈整理自網路文章〉"
  answer:
  - C
  answer_source: answer_key_vlm
