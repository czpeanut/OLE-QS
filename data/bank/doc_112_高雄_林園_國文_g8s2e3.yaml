- id: doc_112_高雄_林園_國文_g8s2e3_s4_8
  section: 4
  number: 8
  type: single
  page: 5
  stem: 根據本文，下列針對此種動物疾病的呼籲何者最不適切？
  options:
  - label: A
    content: 小成：一旦發現受感染的鹿，尌要追蹤與留意病況，避免疫情惡化
  - label: B
    content: 小華：目前還沒有證實人類是否有感染風險，但仍要小心防疫
  - label: C
    content: 小可：傳染的範圍有持續擴散的趨勢，即便不是在美國也要小心
  - label: D
    content: 小明：動物園應幫鹿群施打預防針，避免疫情跨國擴散
  group_stem: "〈有著海綿腦的殭屍鹿〉\n 毛皮失去光澤、四肢瘦弱，甚至身上還帶著大大小小潰爛的傷口……有著這樣古怪特徵的鹿，尌像是殭屍一般，在美國黃石國家公園出沒，官方立即警告遊客，暫且調整路線避開野生動物出沒區域。而這種特殊的疾病，事實上最初於20世紀80年代在美國的懷俄明州被發現，接著漸漸蔓延，但直到2023年3月才首次在黃石國家公園的一隻雄鹿身上發現，捕獲後裝上GPS追蹤器，驅趕活動區域周圍的野生動物，最後於當年度10月時死亡。\n\
    \ 這是一種被稱為「鹿慢性消耗病」的病毒，又被稱為「狂鹿症」，是罕見的神經系統疾病。因為普利昂蛋白在鹿腦堆積，在大腦中形成海綿狀孔洞，造成神經受損，而表現出一系列神經系統異常的症狀，例如：生病的鹿可能會常跌倒、提不起精神、食欲下降、唾液分泌增加、耳朵下垂、頭部不尋常地顫抖、頻繁磨牙、體重下降等病症，也會導致鹿出現強烈攻擊性的行為，由感染到死亡的歷程迅速。同種由普里昂蛋白所引發的疾病還包括克雅氏病和狂牛症。\n\
    \ 根據美國疾病控制與預防中心的報告，這種殭屍病症的「狂鹿症」已在美國31個州和3個加拿大省份被發現，而過去在挪威、瑞典、芬蘭和韓國也曾有相關疾病的報告。而目前針對這個疾病，尚未有預防與治療的藥物，甚至有研究報告顯示這種疾病可能會傳播給鹿以外的野生動物。雖然到目前為止還沒有感染人類的情況，但關於是否會對人類構成風險的疑慮仍在討論中，美國疾病控制與預防中心在2021年的一份報告中提到這種病可能對某些靈長類動物構成威脅，但也有學者指出雖然尚不能確定是否有感染風險，但仍要留意與病鹿的接觸並避免食用未經檢疫的肉品。\n\
    \ 在新冠疫情之前，各國尌已有發現相關病症，而在疫情後面對感染範圍擴大的現況，為避免持續擴散與傳染給其他種野生動物，國際的相關單位正在高度追蹤與研究這群「殭屍鹿」出沒的行蹤。"
  answer:
  - D
