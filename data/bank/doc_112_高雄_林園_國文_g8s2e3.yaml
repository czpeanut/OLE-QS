  stem: '「達人」本來是中國的詞彙，漢書賈誼傳便曾提到「達人大觀，物亡不可」，在此，「達人」是指不受局部影響，而能全面檢視整個事件，不會出現錯誤判斷的人。傳入日本後，「達人」被引申為「依據其豐富的經驗及長年的鍛鍊，進而心領神會該領域真髓的專家」。「達人」之所以受到尊重，不在於成尌事業的大小，而是自我造詣的精進與獨具的生活智慧。

