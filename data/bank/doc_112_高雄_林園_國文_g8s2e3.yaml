  group_stem: "公孫儀相魯而嗜魚，一國盡爭買魚而獻之，公孫儀不受。其弟子諌曰：「夫子嗜魚而不受者，何也？」對曰：「夫唯嗜魚，故不受也。夫即受魚，必有下人之色；有下人之色，將枉於法；枉於法，則免於相。雖嗜魚，彼必不能長給我魚，我又不能自給魚。即無受魚而不免於相，雖嗜魚，我能長自給魚。」此明夫恃人不如自恃也。\n\
