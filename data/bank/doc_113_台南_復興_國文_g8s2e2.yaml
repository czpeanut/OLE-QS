  stem: 關於上文文句的解讀，何者正確？
  options:
  - label: A
    content: 「我是一隻沒籠頭的野馬，我從來不曾站定過」說明作者喜好四處野遊、欣賞美麗風景
  - label: B
    content: 「在我，這靈魂的冒險是生命核心裡的意義，我永遠在無形的經驗的巉巖上爬著」說明作者想要位居高位，就得不怕冒險
