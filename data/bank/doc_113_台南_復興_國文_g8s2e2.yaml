    content: 拜為上卿
  - label: B
    content: 不肯與會
  - label: C
    content: 被甲上馬
  - label: D
    content: 遂不召。
  group_stem: '【甲】

    　　既罷歸國，以相如功大，(A)拜為上卿，位在廉頗之右。廉頗曰：「我為趙將，有攻城野戰之大功，而藺相如徒以口舌為勞，而位居我上，且相如素賤人，吾羞，不忍為之下。」宣言曰：「我見相如，必辱之。」相如聞，(B)不肯與會。相如每朝時，常稱病，不欲與廉頗爭列。

    （改寫自《史記・廉頗藺相如列傳》）

    【乙】

    　　趙以數困於秦兵，趙王思復得廉頗，廉頗亦思復用於趙。趙王使使者視廉頗尚可用否。廉頗之仇郭開多與使者金，令毀之。趙使者既見廉頗，廉頗為之一飯斗米，肉十斤，(C)被甲上馬，以示尚可用。趙使還報王曰：「廉將軍雖老，尚善飯。然與臣坐，頃之三遺矢1矣。」趙王以為老，(D)遂不召。


    註:1.矢通「屎」

    （改寫自《史記・廉頗藺相如列傳》)'
