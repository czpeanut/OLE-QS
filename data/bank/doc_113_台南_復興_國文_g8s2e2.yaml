  section: 4
  number: 2
  type: fill
  page: 1
  stem: '以下為「資訊失序」三種類型圖和說明：


    | 訊息類型 | 說明 |

    | --- | --- |

    | 惡意訊息 | 是指分享真實資訊卻造成傷害。 |

    | 造謠訊息 | 是指故意分享虛假資訊，並造成傷害。 |

    | 錯誤訊息 | 是指分享虛假資訊，但未造成傷害。 |


    請依圖示和表格說明去判斷(甲)(乙)(丙)各是何種類型的訊息？（請將答案，寫於答案卷中）

