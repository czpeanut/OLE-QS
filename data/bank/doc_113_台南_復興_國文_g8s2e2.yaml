  section: 5
  number: 10
  type: single
  page: 2
  stem: '朝陽是難得見的，這初春的天氣，但它來時是起早人莫大的愉快。頃刻間這田野添深了顏色，一層輕紗似的金粉糝上了這草，這樹，這通道，這莊舍。頃刻間這周遭瀰漫了清晨富麗的溫柔，頃刻間你的心懷也分潤了白天誕生的光榮。「春！」這勝利的晴空彷彿在你的耳邊私語。「春！」你那快活的靈魂也彷彿在那裏回響。


    有關上文的分析，何者正確？'
  options:
  - label: A
    content: 「但它來時是起早人莫大的愉快」句中的「它」指的是「初春的天氣」
  - label: B
    content: 文中連用三個「頃刻間」表現出尋春人大聲高呼的樣子，呈現出雀躍歡喜之情
  - label: C
    content: 「這勝利的晴空彷彿在你的耳邊私語」句中「勝利的晴空」指暖春戰勝寒冬，帶來晴朗天空
  - label: D
    content: 文中連用兩個「春！」傳達出春的氣息無所不在，無須特意探察，就能深切感受得到
