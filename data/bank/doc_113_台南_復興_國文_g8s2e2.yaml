  stem: 根據上下文意推測，【甲】處應填入何者最適宜？
  options:
  - label: A
    content: 人因漁而顧此而失彼也
  - label: B
    content: 人天性本無憫魚之情也
  - label: C
    content: 人漁於池時心有不專也
  - label: D
    content: 人知魚之無所逃於池也
  group_stem: '漁於池者，沉其網而左右縻(1)之。網之緣(2)出水可寸許，緣愈狹，魚之躍者愈多。有入者，有出者，有屢躍不出者，皆經其緣而見之。

    　　安知夫魚之躍之出者，不自以為得耶？又安知夫躍而不出與躍而反入者，不自咎其躍之不善耶？而漁者觀之，忽(3)不加得失於其心。

    　　嗟夫！【 甲 】，其魚之躍者，可悲也！然則人之躍者，何也？


    【注釋】(1)縻:束縛。(2)網之緣:指魚網的粗大纜索。(3)忽:漠視。


    ——梅曾亮〈觀漁〉'
