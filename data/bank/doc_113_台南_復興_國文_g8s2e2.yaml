  section: 7
  number: 4
  type: single
  page: 6
  stem: 本文以《史記》為例的用意，最可能是下列何者？
  options:
  - label: A
    content: 暗示太史公刻意留下疑點，以提供後世研究
  - label: B
    content: 強調史料若未經過驗證，易流於空泛的懷疑
  - label: C
    content: 證實太史公看過的史料，現今都還保存完整
  - label: D
    content: 說明真實的歷史無法還原，但可以逐步接近
  group_stem: '所謂的「歷史」，是「過去人類的所有活動」；而所謂的「歷史學」，是「從史料（包括文獻、考古）所能復原過去人類的所有活動」。從各種史料中，不斷進行研究和比較，逐步接近真實，這就是歷史學的本色，也是歷史學家所從事的工作。因為這世上從來無法得到「真實的歷史」，我們所能得到的只有「歷史的真實」。

    　　有人問：「《史記》中那麼多人對話，太史公是如何得知？」基本上，古人記載事情許多沒有附上出處，但不代表前人所記都是捏造。太史公如何得知前人的對話，因為在他之前的人是這麼記載或傳說的。若不能找到更可靠的證據，那就只能選擇記載下來，頂多寫下可能的疑點，留給後世的史學家再來研究。

    　　歷史學講究「持之有故，言之成理」，從許多《史記》的內容來看，太史公所記都有其根據。有些他根據的史料，今日還能見到，可以驗證這一點。只是太史公時代的書籍，已經有太多亡佚，因此有更多的記事，今天已經無法得知出處為何。我從不認為《史記》上的記載「絕對」可信，但若你不相信古人所記的史事，請拿出更可靠的證據。唯有如此，歷史學才能不斷進步，不致流於虛無的懷疑。


    ——改寫自呂世浩《帝國崛起：一場歷史的思辨之旅2》'
