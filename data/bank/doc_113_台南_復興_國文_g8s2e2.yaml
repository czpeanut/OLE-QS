- id: doc_113_台南_復興_國文_g8s2e2_s5_18
  section: 5
  number: 18
  type: single
  page: 3
  stem: '張芬曾為韋南康親隨行軍，曲藝過人，力舉七尺碑，定雙輪水磑(1)。常於福感寺蹋鞠(2)，高及半塔。彈弓力五斗，為製弓，常揀向陽巨筍，織竹籠之，隨長旋培，常留寸許，度竹籠高四尺，然後放長；秋深方去籠伐之，一尺十節，其色如金。每塗牆，方丈彈成「天下太平」字。

    【注釋】(1)磑:石磨，碾去穀物外皮的農具。(2)蹋鞠:古代軍中習武之戲，類似今之足球運動。

    ——《酉陽雜俎・卷五》


    以上文字中關於張芬的敘述，何者完全正確？'
  options:
  - label: A
    content: 能以響亮無比的歌聲，止住轉動的雙石磨
  - label: B
    content: 常在福感寺踢球，且身材約達半塔腰高
  - label: C
