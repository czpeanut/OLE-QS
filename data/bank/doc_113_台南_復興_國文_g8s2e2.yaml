  stem: '我是天空裡的一片雲，／偶爾投影在你的波心——／你不必訝異，／更無須歡喜——／在轉瞬間消滅了蹤影。／你我相逢在黑夜的海上，／你有你的，我有我的，方向。／你記得也好，／最好你忘掉，／在這交會時互放的光亮！

