    | --- | --- |

    | | 交枝的榆蔭，透露著漠楞楞的曙色 |

    | | 當前是平坦的原野，望見了村舍、初青的麥田 |

    | | 更遠三兩個饅形的小山掩住了一條通道 |

    | | 村舍與樹林是這地盤上的棋子 |'
