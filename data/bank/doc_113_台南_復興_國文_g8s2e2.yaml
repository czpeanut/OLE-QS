  - label: D
    content: 「我決不指著黑影說這是陽光，指著雲霧說這是青天，指著分明的惡說這是善」說明作者一絲不苟，富正義感
  group_stem: '我是一隻沒籠頭的野馬，我從來不曾站定過。我，人是在這社會裡活著，我卻不是這社會裡的一個。像是有離魂病似的，我這軀殼的動靜是一件事，我那夢魂的去處又是一件事。我是一個傻子：我曾經妄想在這流動的「生」裡發現一些不變的價值，在這打謊的世上尋出一些不磨滅的「真」；在我，這靈魂的冒險是生命核心裡的意義，我永遠在無形的經驗的巉巖上爬著。

    　　冒險——痛苦——失敗——失望，是跟著來的。存心冒險的人，就得打算他最後的失望；但「失望」並不是「絕望」，這分別很大。我曾經遭受過「失望」的打擊，我的頭是流著血，但我的脖子還是硬的；我不能讓「絕望」的重量壓住我的呼吸，不能讓悲觀的慢性病侵蝕我的精神，更不能讓厭世的惡質染黑我的血液。厭世觀與生命是不可並存的。我是一個生命的信徒，起初是的，今天還是的，將來我也敢說是有的。我決不容忍性靈的頹唐，那是不可救藥的墮落，同時卻繼續軀殼的存在；在我，單這開口說話，提筆寫字的事實，就表示背後有一個基本的信仰，完全的沒破綻的信仰。否則我何必再做什麼文章，辦什麼報刊？

    　　但這並不是說我不感受人生遭遇的痛創；我，決不是那童呆性的樂觀主義者；我決不指著黑影說這是陽光，指著雲霧說這是青天，指著分明的惡說這是善；我並不否認黑影、雲霧與惡，我只是不懷疑陽光與青天與善的實在，暫時的掩蔽與侵蝕不能使我們絕望，這正應得加倍的激動我們尋求光明的決心。前幾天，我覺得異常懊喪的時候，無意中翻著尼采的一句話，極簡單的幾個字卻涵有無窮的意義與強悍的力量，正如天上星斗的縱橫與山川的經緯，在無聲中暗示你人生的奧義，祛除你的迷惘，照亮你的思路。他說：「受苦的人沒有悲觀的權利。」我那時感受一種異樣的驚心，一種異樣的激悟。……

    　　人生到底是什麼？我得先對我自己給一個相當的答案。人生究竟是什麼？為什麼這形形色色的，紛擾不清的現象——宗教、政治、社會、道德、藝術、男女、經濟？我來是來了，可還是一肚子的不明白，我得慢慢的看古玩似的，一件件拿在手裡看一個清切再來說話，我不敢保證我的話一定在行，我敢擔保的只是我自己思想的忠實，我前面說過我的學識是極淺陋的，但我卻並不因此自餒，有時學問是一種束縛，知識是一層障礙，我只要能信得過我能看的眼，能感受的心，我就有我的話說；至於我說的話有沒有人聽，有沒有人懂，那是另外一件事我管不著了——「有的人身死了才出世的」誰知道一個人有沒有真的出世那一天？

    　　是的，我從今起要迎上前去！生命第一個消息是「活動」，第二個消息是「搏鬥」，第三個消息是「決定」。……


    ——節選自徐志摩《自剖》'
