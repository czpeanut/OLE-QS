- id: doc_113_台北_仁愛_國文_g9s1e2_s2_16
  section: 2
  number: 16
  type: single
  page: 1
  stem: '16.劉得華在大巨蛋舉辦演唱會，演唱〈笨小孩〉一曲：「向著天空拜一拜呀，別想不開，老天愛笨小孩。」他引用了孟子的經典名言說明作詞的緣由，鼓勵遭遇挫折的歌迷，在憂患中必定有成長與收穫。請問下列何組排序才是正確說法？


    （甲）故天將降大任於是人也

    （乙）行拂亂其所為

    （丙）所以動心忍性，曾益其所不能

    （丁）餓其體膚，空乏其身

    （戊）必先苦其心志，勞其筋骨'
  options:
  - label: A
    content: 甲乙戊丁丙
  - label: B
    content: 戊乙丁甲丙
  - label: C
    content: 乙戊甲丁丙
  - label: D
    content: 甲戊丁乙丙。
  lesson_raw:
    title: 生於憂患死於安樂
    basis: 引用了孟子的經典名言〈生於憂患死於安樂〉
- id: doc_113_台北_仁愛_國文_g9s1e2_s2_17
  section: 2
  number: 17
  type: single
  page: 1
  stem: 17. 關於〈與宋元思書〉一文，下列何者說法完全正確？
  options:
  - label: A
    content: 大郎：「風煙俱淨，天山共色」可看見出遊時應是風和日麗，薄暮冥冥的天氣
  - label: B
    content: 二郎：「從流飄蕩，任意東西」二句所表現的心境與「無絲竹之亂耳，無案牘之勞形」相近
  - label: C
    content: 三郎：「水皆縹碧，千丈見底。游魚細石，直視無礙。」可知河水清澈湍急，具有動態感
  - label: D
    content: 五郎：「鳶飛戾天者，望峰息心；經綸世務者，窺谷忘返」呈現作者灑脫自在，優游美景的人生。
  lesson_raw:
    title: 與宋元思書
    basis: 題目寫了課名〈與宋元思書〉
- id: doc_113_台北_仁愛_國文_g9s1e2_s2_18
  section: 2
  number: 18
  type: single
  page: 1
  stem: 18. 音乃木坂學校的學生看完〈與宋元思書〉，老師讓他們上台發表意見，哪一位發表的內容有誤？
  options:
  - label: A
    content: 穗乃果：本文雖是書信體裁，但卻沒有書信的格式
  - label: B
    content: 琴梨：是駢文小品，通篇文章皆以四字句為主，對偶工整
  - label: C
    content: 郭郭：採多種角度著筆描寫山水，整篇文章有聲有色有感
  - label: D
    content: 真姬：以「奇山異水」為綱要，先概括說明，再分論水之異、山之奇。
  lesson_raw:
    title: 與宋元思書
    basis: 題目寫了課名〈與宋元思書〉
- id: doc_113_台北_仁愛_國文_g9s1e2_s2_19
  section: 2
  number: 19
  type: single
  page: 1
  stem: 19. 有關〈一家手語餐廳的誕生〉一文的說明，下列何者說明正確？
  options:
  - label: A
    content: 文中手語餐廳受歡迎是因為人們喜歡新體驗
  - label: B
    content: 開業後，老闆最欣慰的是顧客反應餐點美味
  - label: C
    content: 作者特別加入自身造訪餐廳經驗，抒發感懷
  - label: D
    content: 藉此呼籲台灣也要多為弱勢者開設專屬餐廳。
  lesson_raw:
    title: 一家手語餐廳的誕生
    basis: 題目寫了課名〈一家手語餐廳的誕生〉
- id: doc_113_台北_仁愛_國文_g9s1e2_s2_20
  section: 2
  number: 20
  type: single
  page: 2
  stem: '20.有關《論語》和《孟子》兩書的比較說明，下列何者正確？


    | | 論語 | 孟子 |

    | :--- | :--- | :--- |

    | (A)作者 | 孔子、弟子與再傳弟子 | 孟子及弟子 |

    | (B)思想 | 以仁為本 | 民貴君輕 |

    | (C)特色 | 言詞犀利，言簡意賅 | 氣勢雄健，說理透徹 |

    | (D)其他 | 從書中得知孔子有教無類、因材施教的主張 | 善用誇飾與寓言說理，反映人性本善的主張 |'
  options:
  - label: A
    content: 作者：論語（孔子、弟子與再傳弟子），孟子（孟子及弟子）
  - label: B
    content: 思想：論語（以仁為本），孟子（民貴君輕）
  - label: C
    content: 特色：論語（言詞犀利，言簡意賅），孟子（氣勢雄健，說理透徹）
  - label: D
    content: 其他：論語（從書中得知孔子有教無類、因材施教的主張），孟子（善用誇飾與寓言說理，反映人性本善的主張）
- id: doc_113_台北_仁愛_國文_g9s1e2_s2_21
  section: 2
  number: 21
  type: single
  page: 2
  stem: 21. 下列有關孟子 〈生於憂患死於安樂〉一文的說明，下列何者說明正確？
  options:
  - label: A
    content: 以開門見山法起始，點明主旨，再舉例說明，最後歸納重點。
  - label: B
    content: 六位賢者實例說明「勞心者治人，勞力者治於人」，營造文章磅礡氣勢
  - label: C
    content: 「入則無法家拂士，出則無敵國外患者，國恆亡」啟示「多難興邦」的道理
  - label: D
    content: 文末以個人若過於安逸將「死於安樂」作結，採取正面論述，使人印象格外鮮明。
  lesson_raw:
    title: 生於憂患死於安樂
    basis: 題目寫了作者孟子與篇名〈生於憂患死於安樂〉
- id: doc_113_台北_仁愛_國文_g9s1e2_s2_22
  section: 2
  number: 22
  type: single
  page: 2
  stem: 22. 關於〈大明湖〉一文中描寫的景物說明，何者正確？
  options:
  - label: A
    content: 「秋山紅葉，老圃黃花」可見濟南處處丹楓菊花，秋季景象蕭索不堪
  - label: B
    content: 「彷彿宋人趙千里的一幅大畫，做了一架數十里長的屏風」比喻千佛山景色之美及氣勢雄偉
  - label: C
    content: 「忽聽一聲漁唱，低頭看去，誰知那明湖業已澄淨得同鏡子一般」從俯瞰轉為仰視，帶出千佛山倒影
  - label: D
    content: 「一片白花映著帶水氣的斜陽，好似一條粉紅絨毯」指荷花被夕陽染紅，成為千佛山與倒影的墊子。
  lesson_raw:
    title: 大明湖
    basis: 題目寫了課名〈大明湖〉
- id: doc_113_台北_仁愛_國文_g9s1e2_s2_23
  section: 2
  number: 23
  type: single
  page: 2
  stem: 23. 關於劉鶚與《老殘遊記》，下列敘述何者正確？
  options:
  - label: A
    content: 劉鶚化身為老殘，藉行醫各地所見所聞，揭發當時吏治黑暗，反映民生疾苦，是中國著名的譴責小說
  - label: B
    content: 《老殘遊記》以日記體形式寫成的章回小說，記敘主角鐵英遊歷大江南北，行俠仗義的故事
  - label: C
    content: 《老殘遊記》擅長寫物寫景，〈大明湖〉一篇，可見其對趙千里的大畫、千佛山的梵宇僧樓刻畫細膩
  - label: D
    content: 因緣際會下，劉鶚蒐羅、整理刻寫於龜板上文字，進一步著成中國第一本鐘鼎文研究專書《鐵雲藏龜》。
  lesson_raw:
    title: 大明湖
    basis: 題目考劉鶚與《老殘遊記》（〈大明湖〉之作者與出處）
- id: doc_113_台北_仁愛_國文_g9s1e2_s2_24
  section: 2
  number: 24
  type: single
  page: 2
  stem: 24. 「好鳥相鳴，嚶嚶成韻」句中「嚶嚶」為形容鳥鳴的狀聲詞，請問下列「 」的詞語，何者不是狀聲詞？
  options:
  - label: A
    content: 蛾兒雪柳黃金縷，笑語「盈盈」暗香去
  - label: B
    content: 無邊落木「蕭蕭」下，不盡長江滾滾來
  - label: C
    content: 聞蛩「唧唧」夜綿綿，況是秋陰欲雨天
  - label: D
    content: 「關關」雎鳩，在河之洲。窈窕淑女，君子好逑。
- id: doc_113_台北_仁愛_國文_g9s1e2_s2_25
  section: 2
  number: 25
  type: single
  page: 2
  stem: 25. 下列成語皆典出《孟子》，下列哪個「 」中的成語使用正確？
  options:
  - label: A
    content: 三星臨危不亂，展現「匹夫之勇」，帶領員工一起度過難關
  - label: B
    content: 萬聖節當天，處處可見小朋友「摩頂放踵」沿街討糖情景
  - label: C
    content: 吳康任既有演技，又有人脈，在台海兩岸大享「齊人之福」
  - label: D
    content: 澎澎天天上網玩手遊，卻想考上建中，簡直是「緣木求魚」。
- id: doc_113_台北_仁愛_國文_g9s1e2_s2_26
  section: 2
  number: 26
  type: single
  page: 2
  stem: 26.桃樂比參加校慶闖關活動，在國文關卡中，必須選出用字正確的成語才能闖關成功，下列哪一組成語用字完全正確？
  options:
  - label: A
    content: 人謀不臧∕一傅眾咻∕惻隱之心
  - label: B
    content: 離鄉背景∕涅而不錙∕羞赧不已
  - label: C
    content: 冒險患難∕美食老饕∕殷憂啟聖
  - label: D
    content: 百廢待舉∕門可羅雀∕桀鰲不馴。
- id: doc_113_台北_仁愛_國文_g9s1e2_s2_27
  section: 2
  number: 27
  type: single
  page: 2
  stem: 27. 有關章回小說回目名稱與書名的結合，下列何者配對錯誤？
