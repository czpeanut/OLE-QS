  page: 4
  stem: 39. 以下〈滿井遊記〉各句的說明，何者正確？
  options:
  - label: A
    content: 「一望空闊，若脫籠之鵠」：脫籠之鵠比喻作者寂然的心境
  - label: B
    content: 「鱗浪層層，清澈見底，晶晶然如鏡之新開而冷光之乍出於匣也」：以誇飾法寫水面的清澈
  - label: C
    content: 「山巒為晴雪所洗，娟然如拭」：動態筆法寫出山巒被晴天融化的雪水洗過，美好的山色如剛擦拭過一樣
  - label: D
    content: 「柳條將舒未舒，柔梢披風」：柳條迎風伸展極致的姿態，美不勝收。
  group_stem: "廿二日天稍和，偕數友出東直，至滿井。高柳夾堤，土膏微潤，一望空闊，若脫籠之鵠。於時冰皮始解，波色乍明，鱗浪層層，清澈見底，晶晶然如鏡之新開而冷光之乍出於匣也。山巒為晴雪所洗，娟然如拭，鮮妍明媚，如倩女之靧①面而髻鬟之始掠也。柳條將舒未舒，柔梢披風，麥田淺鬣②寸許。遊人雖未盛，泉而茗者，罍而歌者，紅裝而蹇者，亦時時有。風力雖尚勁，然徒步則汗出浹背。凡曝沙之鳥，呷浪之鱗，悠然自得，毛羽鱗鬣之間皆有喜氣。始知郊田之外未始無春，而城居者未之知也。\
    \ \n    夫不能以遊墮事而瀟然于山石草木之間者，惟此官也。而此地適與余近，余之遊將自此始，惡③能無紀？己亥之二月也。 \n             \
    \                  （袁宏道〈滿井遊記〉） \n①靧︰ㄏㄨㄟˋ，洗臉 ②鬣︰原指動物頸上的毛，這裏指麥苗 \n③惡︰如何、怎麼。"
  lesson_raw:
    title: 滿井遊記
    basis: 短文選自袁宏道〈滿井遊記〉
