- id: doc_113_台北_仁愛_國文_g9s1e2_s3_44
  section: 3
  number: 44
  type: single
  page: 4
  stem: 44.下列句中「」的古今詞語，何者意思解釋錯誤？
  options:
  - label: A
    content: 「輿圖」：地圖
  - label: B
    content: 「郎中」：醫生
  - label: C
    content: 「庖丁」：茶房
  - label: D
    content: 「良人」：丈夫。
  group_stem: "單身時我與一男子（今之良人）相約蘆洲吃麵，蘆洲古名鷺洲，是在清代輿圖中，如謎的台北湖底，一塊時隱時現的濕地。白鷺鷥成群起飛的煙水迷濛沙洲。據日治時期統計，彼時九成住民，都是祖籍福建的同安鄉人。故切仔麵中的麵，是嫩黃色福建油麵。製麵時加鹼水，出廠已燙熟，拌食油防沾黏。\
    \ \n  只見小店庖丁熟練的將熟麵下在滾水裡迅速漉過即可食。「切」字是動態。是聲音，也是工具。閩南語發音為「搣」。長柄的麵簍子叫「麵搣阿」，從前以竹片編製，現在多改用金屬。竹編搣阿易生霉，但扣出麵來，形狀甚優美。搣阿在沸水裡邊漉邊摔出聲，起鍋費勁甩乾水分，吭一聲倒扣在瓷碗裡。淺黃麵條，編織成橢圓山形，熱湯澆上，一碗霧氣氤氳的微山水。\
    \ \n  長年吃麵，同伴有消有長。兒時是整個家族一起去。長大後，一個人去得多。如今加上眼前這位郎中，就有兩人。兩人吃切仔麵，總是比一個人好。此說非是基於感性，是講實情。世上許多麵都適合獨食，但說到切仔麵，人數愈伙，就愈好吃。\
    \ \n（改寫自洪愛珠〈吃麵的兆頭〉）"
