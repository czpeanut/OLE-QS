  stem: '我國制定《勞動基準法》以規定勞動條件最低標準，進而保障勞工權益，下列何者已違反《勞動基準法》的規定？

    (甲)雇用15 歲的國中畢業生擔任建築工地的工人

    (乙)餐廳老闆聘用正職員工，並給予法定基本工資

    (丙)公車業者讓司機連續工作八小時，無休息時間

    (丁)因業務緊縮，雇主與勞工協議每月一日無薪假'
  options:
  - label: A
    content: 甲、乙
  - label: B
    content: 甲、丙
  - label: C
    content: 乙、丁
  - label: D
    content: 丙、丁
