  section: 1
  number: 41
  type: single
  page: 1
  stem: 下列有關於貨幣的主要功能，何者正確？
  options:
  - label: A
    content: 交易媒介：貨幣能夠用來儲存財富，以便在未來使用。
  - label: B
    content: 價值衡量：貨幣可以用來評估商品和服務的價值，並將其標價。
  - label: C
    content: 價值儲存：貨幣的最主要功能，並且具有普遍接受性。
  - label: D
    content: 債務清償：貨幣只能用來支付消費時的費用，無法用來償還債務。
