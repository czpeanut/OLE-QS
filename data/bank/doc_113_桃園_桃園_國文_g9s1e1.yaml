  group_stem: '以下兩段文字為不同機構提出的兒少資助計畫，請根據下列兩段文字回答問題

    （甲）

    生活在貧瘠地方的孩子，在他們的世界中

    總是處於「被動」的生命，

    被放棄、被忘記、被不好的對待，


    然而，這一次，

    她明白，她不再是被動地接受環境的安排。

    她知道，在遠方有許多人在支持她和她的家人。

    她相信，她永遠有機會做出「選擇」。


    當兒童選擇屬於自己的資助人，

    他們重新看見未來的希望。


    Chosen 兒童資助計畫

    讓脆弱孩子從 #選擇資助人 開始，

    找回屬於他們的力量。


    從「選擇」開始，他們能明白

    人生不只是被動的接受環境給予的，

    而是，永遠有機會去追求心所嚮往的。


    （乙）

    2024 年8 月，

    我們所扶助的兒少來到44,405 名(不含手足、家長與其他重要關係人)

    感謝許多助養人的協助，

    讓我們可以幫助家庭度過重重難關。


    各級學校陸續開學，所有孩子是否就學，

    學雜、生活費用是否能順利支應，

    尤其是支出頗高的高等教育學子，

    是我們近期頗為關注的焦點。


    為了讓孩子可以繼續追逐夢想，

    我們發起「助養人召集令」，

    除了能夠及時填補兒少中斷的認養費，

    更是我們推展其他兒少服務的重要經費。


    每月300 元，即可成為助養人，與我們守護家庭

    誠摯邀請您一同來參與'
