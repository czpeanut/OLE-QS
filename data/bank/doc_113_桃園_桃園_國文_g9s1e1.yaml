  - label: C
    content: 因為「打樁式入水」能夠確保入水時的速度和角度，適合進行深水區的搜索任務
  - label: D
    content: 因為「打樁式入水」這種入水方式可以在救援時同時兼顧救援的效率與入水的美觀。
  group_stem: "海巡署長室 Coast Guard\n8月29日下午4:44 · \n\n「選手從跳台上ㄧ躍而下，再次使出水花消失術！」\n「10分！10分！10分！評審們給出一致好評！」\n\
    前陣子全民瘋奧運，其中跳水項目總是能吸引眾人目光\n看著選手站在高台的邊緣準備起跳，內心的懼高症也微微顫動了起來\n隨著選手落水的那一刻，大家一同讚嘆起水花怎能如此之小\n\
    這是一項高度專業的比賽，誰入水的水花最小、空中轉體最多圈就贏了\n而我們海巡其實也出了不少跳水高手，事實上，所有的海巡同仁都經過專業的跳水訓練\n只是我們練習的是「打樁式入水」，是以頭上腳下從高處入水的方式，專門用於救生救難時使用的跳水法\n\
    因為碼頭高度有時距離水面會高達3至5公尺，我們需要一邊注意溺者位置、一邊確保自身安全，所以採用打樁式入水是最穩當的\n雖然這種跳水法在比賽中可能無法拿下高分，但若能拿下1分的動作難度、1分的水花高度及8分的人員安全，這樣對我們來說就夠了，畢竟大家的安全才是我們的首要任務\n\
    從高處跳水有其危險性，請大家不要輕易嘗試，如果發生緊急救生救難案件，請撥打「海巡118報案專線」，讓專業的海巡人員來跳給你看就好\n#海巡118報案專線"
