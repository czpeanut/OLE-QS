  type: single
  page: 1
  stem: 我國自2019年起實施十二年國民教育政策，以強化舊有的九年國民義務教育。此後每個適齡學生都有權接受高中教育，但國中生畢業也可以選擇不升學直接就業。對於這樣的現象，以下何者的觀點最為適切？
