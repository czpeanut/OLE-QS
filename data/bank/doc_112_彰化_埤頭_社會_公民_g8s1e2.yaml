    2024 選舉登記已熱烈開始，名單正陸續更新中，而登記最重要的就是不能忘了「選舉保證金」。中選會之前於11月16日公告總統、副總統與立法委員選舉候選人登記日期與必備事項，總統候選人申請登記時，要繳納1500萬元保證金；立委候選人申請登記時，每一候選人應繳20萬元保證金。

    若候選人得票數未達規定標準，則保證金將會被沒收，這保證金制度就是為了確認報名參選人是認真對待選戰，避免有人藉參選或選務上的困擾、甚至達到干擾選情的目的。選罷法中有關選舉保證金有另一項特別規定，就是繳納現金不得以硬幣為之。之前未增列此規定，2006年時，柯賜海登記參選台北市長繳交200萬元保證金，是使用50萬元的1元硬幣，以及150萬的50元硬幣，重達3051公斤。

    據現行《總統副總統選舉罷免法》第31條，登記為總統、副總統候選人時，各組應繳納保證金新臺幣一千五百萬元。前項保證金，應於公告當選人名單後三十日內發還，但得票數不足選舉人總數百分之5者，不予發還。'
