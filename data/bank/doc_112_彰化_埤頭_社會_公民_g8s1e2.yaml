- id: doc_112_彰化_埤頭_社會_公民_g8s1e2_s4_38
  section: 4
  number: 38
  type: single
  page: 2
  stem: 依據我國憲法及憲法增修條文的規定，當選總統者對於下列哪一種職權的行使不但有合法性且具正當性？
  options:
  - label: A
    content: 解散監察院
  - label: B
    content: 審查中央政府總預算
  - label: C
    content: 決定國家安全大政方針
  - label: D
    content: 對審計長提名人行使同意權。
  group_stem: '◎ 2024 年總統大選在即，民進黨總統參選人已經登記完成，但國民黨、民眾黨「藍白合」卻卡關成了「藍白拖」，雖然彼此目標一致，都是政黨輪替、下架民進黨，並深知最後若仍落入三腳督，不僅白忙一場，政黨票也會流失，如今已至最後關頭，藍白合仍情勢不明。請問：


    總統、副總統與立委參選保證金門檻


    | 公職名稱 | 參選保證金 | 退還門檻 |

    | :--- | :--- | :--- |

    | 總統、副總統 | 1500萬 | 得票數達該選舉區選舉人總數的5% |

    | 立法委員(區域) | 20萬 | 得票數達該選區選民總數應選人數的10% |

    | 立法委員(不分區) | 20萬 | 當選即發還 |


    資料來源／中央選舉委員會、全國法規資料庫

    聯合新聞網製表


    2024 選舉登記已熱烈開始，名單正陸續更新中，而登記最重要的就是不能忘了「選舉保證金」。中選會之前於11月16日公告總統、副總統與立法委員選舉候選人登記日期與必備事項，總統候選人申請登記時，要繳納1500萬元保證金；立委候選人申請登記時，每一候選人應繳20萬元保證金。

    若候選人得票數未達規定標準，則保證金將會被沒收，這保證金制度就是為了確認報名參選人是認真對待選戰，避免有人藉參選或選務上的困擾、甚至達到干擾選情的目的。選罷法中有關選舉保證金有另一項特別規定，就是繳納現金不得以硬幣為之。之前未增列此規定，2006年時，柯賜海登記參選台北市長繳交200萬元保證金，是使用50萬元的1元硬幣，以及150萬的50元硬幣，重達3051公斤。

    據現行《總統副總統選舉罷免法》第31條，登記為總統、副總統候選人時，各組應繳納保證金新臺幣一千五百萬元。前項保證金，應於公告當選人名單後三十日內發還，但得票數不足選舉人總數百分之5者，不予發還。'
