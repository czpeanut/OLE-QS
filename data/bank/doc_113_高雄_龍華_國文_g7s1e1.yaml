  section: 3
  number: 5
  type: single
  page: 1
  stem: 下列關於〈夏夜〉一詩的說明，何者正確？
  options:
  - label: A
    content: 作者楊喚透過兒童的口吻，發揮想像力，描繪夏天夜晚的景象
  - label: B
    content: 藉由各種景象的描述帶出時間的轉移，並寄託深刻的人生道理
  - label: C
    content: 以擬人化的名詞，描寫夏夜的寧靜溫馨，呈現活潑熱鬧的氛圍
  - label: D
    content: 屬於「現代詩」，「現代詩」也稱「新詩」、「近體詩」、「白話詩」
  lesson_raw:
    title: 夏夜
    basis: 題幹討論課文〈夏夜〉
