  type: single
  page: 1
  stem: 〈夏夜〉一詩中，由「提燈的螢火蟲」可知季節為夏季。下列文句，何者描寫的季節也是夏季？
  options:
  - label: A
    content: 在流金鑠石的時節裡，南風徐徐吹來，田野裡時常有著整片蛙鳴
  - label: B
    content: 湖畔楓葉染上了深紅色，輕輕的漂到湖面，隨著水流展開了旅行
  - label: C
    content: 木落水盡，大自然的妙手畫家，將遼闊大地繪成了一幅銀白畫作
  - label: D
    content: 時光飛逝，斗杓又東指了，百花再度吐艷，蝴蝶、鳥兒翩翩起舞
  lesson_raw:
