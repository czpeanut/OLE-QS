  stem: 〈夏夜〉：「撒了滿天的珍珠和一枚又大又亮的銀幣。」句中「銀幣」所比喻的事物，與下列「 」所指稱的對象不同？
  options:
  - label: A
    content: 小時不識月，呼作「白玉盤」
  - label: B
    content: 凝碧初高海氣秋，「桂輪」斜落到江樓
  - label: C
    content: 「金烏」海底初飛來，朱輝散射青霞開
  - label: D
    content: 照他幾許人腸斷，「玉兔」銀蟾遠不知
