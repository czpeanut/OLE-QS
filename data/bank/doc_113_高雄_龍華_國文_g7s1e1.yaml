  section: 3
  number: 9
  type: single
  page: 2
  stem: 〈無心的錯誤〉：「只怕那無心，就會惹下那天大的麻煩。」下列何人的說法，使這句話的意思改變了？
  options:
  - label: A
    content: 柚子：無心，往往是招來天大麻煩的主因
  - label: B
    content: 橘子：天大的麻煩，常會因為無心而招致
  - label: C
    content: 花爸：只要無心，惹上的麻煩常不會太大
