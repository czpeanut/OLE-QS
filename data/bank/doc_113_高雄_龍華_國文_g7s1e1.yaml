- id: doc_113_高雄_龍華_國文_g7s1e1_s5_39
  section: 5
  number: 39
  type: single
  page: 6
  stem: 關於本文敘述，下列何者正確？
  options:
  - label: A
    content: 「哥布林模式」一詞自2022 年被創造後，社群討論度逐年上升
  - label: B
    content: 歷年年度詞彙是由大眾投票選出最能反映過去一年的社會議題
  - label: C
    content: 傳說哥布林生活在黑暗的地下世界，在怪物界的等級冠絕群倫
  - label: D
    content: 哥布林模式解放了必須在社交平台上展示完美自我的表現心態
  group_stem: "英國牛津大學出版社近日公布，「哥布林模式」（Goblin Mode）以34 萬票成為《牛津英語詞典》2022 年度代表字，強壓第二名元宇宙（Metaverse）及第三名\
    \ #IStandWith(#我支持)。年度詞彙通常是為了反映過去一年的整體社會風氣、人們的情緒以及關注的議題，今年的年度關鍵詞則首度由大眾投票選出。\n\
    \ 哥布林(Goblin)是一種傳說的「類人類」的生物，以綠色的皮膚、尖耳、鷹勾鼻和金魚眼為主要形象。他們主要生活在黑暗的地下世界，個性貪婪且卑劣，可以說是最弱的怪物。在《魔戒》、《哈利波特》裡，都有哥布林的身影。「哥布林模式」據稱最早自\
    \ 2009 年出現在 Twitter 上，直至今年 2 月在社群的討論度開始上升，隨後傳到報紙和雜誌上。根據牛津大學的解釋，此詞指毫不保留、不帶歉意地自我放縱、懶惰邋遢，甚至是貪婪享樂的行為，並表現出一種拒絕社會規範或期待的態度。\n\
    \ 公布結果的聲明稿中寫道，隨著疫情陸續解封，許多國家限制開始鬆綁，人們也更經常外出，回歸日常生活，也因而在2022 年可以見到愈來愈多人使用哥布林模式。\n\
    \ 牛津大學出版社總裁Casper Grathwohl 表示：「大眾對這項活動的參與程度完全超出我們預期。考慮到我們剛經歷的一年，哥布林模式和我們曾為此感到不知所措的人有所共鳴。承認我們並不總是鼓勵在IG或是TikTok\
    \ 上展示那種過度理想化、精心策畫的自我，這讓人鬆了一口氣。」\n 「人們正在擁抱內心的哥布林，並告訴我們這個概念可能會一直持續下去。」\n ──改寫自網路文章"
