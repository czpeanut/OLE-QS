- id: doc_113_高雄_龍華_國文_g7s1e1_s5_37
  section: 5
  number: 37
  type: single
  page: 5
  stem: 根據本文，宮崎駿如何創作如《龍貓》、《風之谷》、《天空之城》等精彩的動畫電影？
  options:
  - label: A
    content: 淬鍊濃縮往昔的美好經驗
  - label: B
    content: 依循套用具邏輯的成功法則
  - label: C
    content: 嘗試尋找內心的真實感受
  - label: D
    content: 靜心等待靈感的自然湧現
  group_stem: "「拍電影不能靠邏輯，或者說如果你換個角度看，任何人都可以用邏輯拍電影，但是我的方式是不用邏輯的，我試圖挖掘自己的潛意識，在那個過程中的某個時刻，思維之泉被打開，各式各樣的觀點和想法奔湧而出。」宮崎駿作品的結構失衡，雖然有很多評論者都指出過，但很少有人對此做出批判。他的弱點，反而被視為他作品的一種風格體現──「即使憑藉感覺創作，依然能夠創作出滿足觀眾觀影生理快感的電影，這體現出了宮崎駿非凡的才能。」\n\
    \ 《龍貓》是宮崎駿所有作品中最具童趣的故事，沒有《風之谷》的糾結迷思，沒有《天空之城》的探險刺激，甚至連複雜的情節都沒有，就是內心純真的小梅和皋月姊妹與傳說中的森林守護神「龍貓」邂逅，結下了似夢似幻的緣分。影片的高潮，是姐妹倆在龍貓的幫助下，乘坐奇幻的貓巴士半夜探視了住院的母親。它呈現的就是淡淡的日常溫情，孩子們內心的單純明澈，以及關於神祕大自然的猜想和期盼。\n\
    \ 「我也沒有想太多、想太難，只是覺得我們從小生長在日本，因此很想對自然說，『雖然我們做了許多過分的事，但是承蒙您照顧了』。這是一種愛的呼喊，我想借由那片森林來表達這種感覺。」《龍貓》證明了越簡單越精彩，一九八八年上映之後獲得壓倒一切的好評，拿下了日本國內當年所有的電影獎，動畫片打敗了故事片，這作為日本電影界有史以來的一件大事被載入史冊。\n\
    \ ──葛維櫻〈用力活在當下〉"
