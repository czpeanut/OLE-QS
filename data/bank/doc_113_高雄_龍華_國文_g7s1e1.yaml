    四、 以下社團成員不必選填社團意願：弦樂團、直笛團、數理人文社、資優班、田徑隊、游泳隊。\n五、 換社時間：09/05(四)10:00～09/06(五)16:00。選上第一志願的同學，不可換社。\n\
