  section: 3
  number: 7
  type: single
  page: 2
  stem: 關於〈夏夜〉一詩的分析，下列何者正確？
  options:
  - label: A
    content: 「當街燈亮起來向村莊道過晚安」──此句承上啟下，給人親切之感，宣告黃昏的正式到來
  - label: B
    content: 「蝴蝶和蜜蜂們帶著花朵的蜜糖回來了」──透過愉悅的動態景觀，反襯黑夜來臨前的寂寥
  - label: C
    content: 「來了!來了／從山坡上輕輕地爬下來了」──以「爬下來」的動作，描寫夜色由近而遠逐漸擴散
  - label: D
    content: 「只有窗外瓜架上的南瓜還醒著／伸長了藤蔓輕輕地往屋頂上爬」──點出靜謐的夏夜仍然充滿生機
