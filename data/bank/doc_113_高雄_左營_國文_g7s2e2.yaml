  group_stem: '甲

    艾子有孫年十許，慵劣不學，每加榎楚①，而不悛②。其子僅有是兒，恆恐兒之不勝杖而死也，責必涕泣以請。艾子怒曰：「吾為若教子不善邪？」杖之愈峻，其子無如之何。一旦雪作，孫摶③雪而嬉，艾子見之，褫其衣使跪雪中，寒戰之色可掬④。其子不復敢言，亦脫其衣跪其旁。艾子驚問曰：「汝兒有罪，應受此罰，汝何與焉？」其子泣曰：「汝凍吾兒，吾亦凍汝兒。」艾子笑而釋之。

    【解釋】

    ①榎楚：古代教師責罰學生的戒尺。

    ②悛：悔改。

    ③摶：抓取。

    ④掬：情態顯露於外，似可用手抓取。

    （改寫自陸灼《艾子後語》)


    乙

    有一天吃晚飯的時候，太太跟我開玩笑，隔著飯桌，用筷子在我頭上敲了一下（我居然沒閃開，被她敲中）。接著就聽見啪一聲，我的兒子胳臂上被奶奶打了一巴掌。「奶奶！你為什麼打我？」兒子吃驚地問。八十歲的老奶奶一笑：「你媽打我兒子，我就打她兒子。」

    （節錄自劉墉《教你幽默到心田‧有來有往》)'
