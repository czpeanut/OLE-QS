  stem: 依據上文，以下哪一情境最符合「資訊迴避」的現象？
  options:
  - label: A
    content: 智旻聽聞公司即將裁員，內心不安，在求職網站搜尋職缺待遇
  - label: B
    content: 柾國懶得閱讀長篇文字，只透過手機觀看短影音獲取生活資訊
  - label: C
    content: 泰亨收到健康檢查報告，因擔心結果不佳，遲遲不敢拆閱信件
  - label: D
    content: 玧其為了專題實作課程不要被當掉，努力上網搜尋報告的資料
  group_stem: '在資訊爆炸的時代，許多人選擇忽略甚至逃避資訊，這種現象被稱為「資訊迴避」。即使這些資訊可能對我們有益，我們仍常因害怕面對而選擇逃避。比如，害怕看到體重計上的數字，或拒絕檢視投資虧損的財務報表，我們也可能迴避朋友的真實回饋，以免打擊自尊。

    資訊迴避的原因複雜，主要來自情緒與認知偏差。逃避負面情緒是常見的動機，例如焦慮或恐懼。心理學研究顯示，人們對損失的厭惡遠大於對收益的喜悅，因此當預期某些資訊可能是壞消息時，往往選擇不去面對。此外，我們更容易受到記憶中鮮明但未必正確的例子影響，高估壞消息的可能性，進一步強化了資訊迴避的傾向。

    經濟學提到「支付意願」的概念，意指消費者為了某樣事物，所願意支付的最高價格，這無法完全解釋資訊迴避的現象。有時人們願意花錢獲取重要資訊，有時卻不惜付出代價避免接觸壞消息，可能讓人們更在意當下的舒適感，即使這意味著放棄長期的利益。

    雖然資訊迴避能帶來短暫的平靜，但長期來看可能導致錯失重要資訊並做出不利決策。忽視健康風險可能延誤治療，避開真反饋則可能影響自我成長。研究顯示，人們實際承受壞消息的負面情緒往往比預期中輕微，因此過度迴避並無助於問題解決。要在資訊洪流中作出明智選擇，需要提升資訊素養，學會辨別資訊真偽與來源；同時覺察自身的認知偏差，反思面對資訊的反應，避免落入迴避陷阱。'
