  group_stem: '文公之時，宰人①上炙而髮繞之。文公召宰人而譙②之曰：「汝欲寡人之哽邪？奚為以髮繞炙？」宰人頓首再拜請曰：「臣有死罪三：援礪砥刀，利猶干將③也，切肉，肉斷而髮不斷，臣之罪一也；援木而貫臠而不見髮，臣之罪二也；奉熾爐，炭火盡赤紅，而炙熟而髮不燒，臣之罪三也。堂下④得無微⑤有疾臣者乎？」公曰：「善。」乃召其堂下而譙之，果然，乃誅之。

    【解釋】

    ①宰人：古代主管膳食的官吏。

    ②譙：責備，譴責。

    ③干將：春秋 吳國人，與其妻莫邪同為鑄劍大師，曾為吳王鑄造「干將」、「莫邪」雌雄二劍。後人遂以「干將」泛指利劍。

    ④堂下：殿堂下的人，指侍從。

    ⑤微：隱蔽，暗中。

    (《韓非子‧內儲說下》)'
