  group_stem: '＊資料一、改寫自趙玉君《為什麼要學物理》

    提起棉花糖，人們都會說好吃，那種無法咀嚼但又入口即化、甜滋滋的味道確實令人回味無窮。可是，當你吃著非常「大」的棉花糖的時候，不知你有沒有發現，這麼大的棉花糖只用了很少的白砂糖，而且，製糖師傅只要將很少的白砂糖倒入機器的旋轉小洞，然後就能得到大大、甜甜的棉花糖了。

    那麼，為什麼很少的白砂糖卻能夠加工出來「大大」的棉花糖呢？假如在機器的旋轉小洞裡放上少許的鹽，是不是也能加工出來「棉花鹽」呢？

    其實，棉花糖機器是比較特殊的，中間承載白砂糖的部分是網狀漏斗容器，而且這個容器還是有一定溫度的，當一小勺白砂糖進到容器中後，就會在「高溫」下迅速熔化，進而成為糖漿。但是，由於漏斗容器是放在離心機上，而且在白砂糖熔化的過程中，離心機還在飛速轉動，這就導致網狀漏斗容器在它的帶動下也飛速旋轉，於是，網狀漏斗容器中的已經成為黏液的糖液就會被容器從孔洞處甩出去。由於糖液有一定的黏性，在被甩出去的時候就會成為絲線狀(與拔絲相同)，然而，被甩出去的糖液溫度高於環境溫度，它在空氣中，會自然散熱、冷卻，由於糖在常溫下是以固體狀態出現的，所以，這些被甩出來的線狀糖液就會成為固體的「棉花絲」，這時，只要用一根竹籤將糖絲黏起來，就能得到鬆軟、香甜的一大團棉花糖了。

    此外，由於糖的形狀是會隨著溫度的變化而發生變化的，而棉花糖的出現又是離不開糖的最佳黏性的，所以，在加工棉花糖的時候就應該掌握好溫度，比如，溫度較低，白砂糖無法充分熔化為糖漿，這種「糖漿」是很難拉出「絲」來的，因此，一小勺糖就不可能得到一大團的棉花糖；溫度較高，糖就會很快焦化，很難拉出「絲」，即便能夠拉出「絲」，由於已「焦」，糖絲也不可能是白色，這就無法將其稱作「棉花糖」。


    ＊資料二、某甜點師傅對於糖在不同溫度之下的狀態描述

    | 溫度 | 糖 的 狀 態 |

    | :--- | :--- |

    | 90°C | 仍能看見一顆顆的糖粒，並未出現糖漿狀態 |

    | 100°C | 開始呈現糖漿狀態，將湯匙浸泡糖漿中，糖會薄薄地附著於湯匙表面 |

    | 120°C | 用拇指和食指沾取糖漿，再放入冰水之中，兩指之間會形成糖絲 |

    | 130°C | 用湯匙沾取糖漿，並拉到空中，糖漿會形成糖絲 |

    | 160°C | 糖漿開始變色，形成淺琥珀色，沾取出的糖漿在室溫下呈現板狀 |

    | 170°C | 此時的糖漿是褐色的焦糖，略帶焦味與甜味，是製作甜點的最佳溫度 |'
