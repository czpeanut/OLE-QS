    content: 「那位賣蝦仁羹的歐巴桑的叫賣聲恐怕是最平板無奇的，但還沒看到她就拿著大碗小碗衝出來的大人小孩，每天不知凡幾」：說明蝦仁羹叫賣聲平凡，攤位前經常門可羅雀
  - label: B
    content: 「昨天晚上你也許還吃著燒仙草，今天你突然聽到他改叫『冷豆花哦』」：這一叫所告訴我們的季節應同於「隨風柳絮輕，映日杏花明」
  - label: C
    content: 作者認為這些小販的叫賣聲，就像「陽光、綠野、花一樣，是這有活力的城市，有活力的人間，不可或缺的色彩」：比喻這些叫賣聲使人如置身在大自然般美妙
  - label: D
    content: 「你甚至擔心他是不是太老了，太累了，生病了，以至於不能出來賣了。但就在你懷疑、納悶的時候，那熟悉的聲音也許又出現了」：說明偶爾才出現的小販叫賣聲，引人好奇
