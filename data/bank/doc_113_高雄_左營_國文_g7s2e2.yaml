    content: 馬爾地夫對於景氣的好壞能洞見觀瞻
  - label: B
    content: 馬爾地夫是候鳥遷徙的重要路徑之一
  - label: C
    content: 馬爾地夫提醒世人經濟發展的重要性
  - label: D
    content: 馬爾地夫能敏銳覺察自然環境的變化
  group_stem: '馬爾地夫環礁由潟湖與珊瑚沙島交錯組成，遊客爭相目睹海島風情，為當地帶來豐富的財源。根據馬爾地夫 觀光部的統計，平均一年有六十萬名遊客，比當地居民人數多了兩倍。每一位遊客一天大約製造三點五公斤的垃圾，並且消耗五百公升的水。垃圾分類是一則隱憂，垃圾量是另一個問題。馬爾地夫人以海為家，以捕魚維生，過著樂天知命的生活。但當海水自腳踝處逐漸向上蔓延，甚至抹去了海岸線之後，家，又會在何方？

    春江水暖鴨先知，蕞爾小島對於天候的變化格外敏感。工業革命推動了現代化，是否也將地球加速推向了衰暮？馬爾地夫在環境議題上，是全人類的一個指標，它的淹沒，暗示著其他地方的劫難。聯合國人居署長
    提拜朱卡在一場會議上重申：海水只消上升一公尺，許多濱海大城，如紐約、東京、上海等，亦將岌岌可危。

    （居芮筠〈最後一瞥馬爾地夫：觀光島的未來〉）'
