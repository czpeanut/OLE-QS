    三、儀器外面對準東、南、西、北和東南、西南、東北、西北八個方向鑄有八條龍，每條龍嘴裡都銜著一只銅球，龍嘴下方又各有一隻蛤蟆，張著嘴，正可接住銅球。\n四、在銅柱和八條龍嘴之間各有機械連接，哪個方向發生了地震，當地震波到達時，都柱就會倒向發生地震的方向，機械對準那個方向的龍嘴打開，龍嘴裡的銅球就落到蛤蟆的嘴裡，並發出「噹啷」聲響。\n\
