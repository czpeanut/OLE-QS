- id: doc_111_嘉義_北興_社會_公民_g8s2e3_s2_25
  section: 2
  number: 25
  type: single
  page: 4
  stem: 文中有關《兒童及少年福利與權益保障法》相關敘述，下列何者正確？
  options:
  - label: A
    content: 該法所稱的「兒童」年齡和聯合國《兒童權利公約》中所指的兒童年齡相同
  - label: B
    content: 媒體若違反該法第69 條時可向該事業主管機關處以罰金並命其限期改正
  - label: C
    content: 媒體不得報導或記載兒少姓名及足以辨識身分的資訊屬於對兒少的保護措施
  - label: D
    content: 《兒童及少年福利與權益保障法》對媒體無相關罰則只有《刑法》明文規定。
  group_stem: '題組（四）

    媒體洩漏兒少個資可檢舉

    西元2020 年高雄發生少女失蹤案，引發社會關注討論，多個婦女、兒少團體聯合聲明指出，警方在偵辦過程中，不斷更新偵查進度及細節，也將未成年被害人攻堅片段提供媒體，部分媒體報導時更未遮蔽未成年人的長相輪廓，並在少女返回高鐵站時全程跟拍等，對未成年人保護不周，呼籲警方嚴守「偵查不公開」原則，媒體也應自律。根據《兒童及少年福利與權益保障法》第69
    條，媒體不得報導或記載兒少姓名及足以辨識身分的資訊，然而部分媒體在報導高雄少女失蹤事件時，未完全遮蔽當事人及其親屬長相，足以使不特定大眾辨識或猜測當事人身分，恐造成當事人受媒體干擾或遭不特定人追問遇害細節，而受到二度傷害。且當事人獲救後，家屬便向媒體表達希望下架少女照片及後續案情，但媒體仍持續跟拍，造成當事人心理壓力，實屬不妥。

    此外，報導中詳盡敘述被害人、案件偵辦進度，也有違反《犯罪被害人保護法》第30-1 條之虞。該條規定媒體於報導犯罪案件或製作相關節目時，應注意被害人或其遺屬之名譽及隱私。被害人或其遺屬如認為媒體之報導有錯誤時，得於該報導播送或刊登之日起15
    日內要求更正。被害人或其遺屬因媒體報導受到損害，媒體與其負責人及有關人員應依相關法律規定負刑事及行政等責任。'
  tags:
    chapter:
      publisher: 翰林
