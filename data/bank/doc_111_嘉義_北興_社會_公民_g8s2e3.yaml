- id: doc_111_嘉義_北興_社會_公民_g8s2e3_s2_18
  section: 2
  number: 18
  type: single
  page: 3
  stem: 依上文內容判斷，「ＯＯＯ法」最有可能為下列何者？
  options:
  - label: A
    content: 刑法
  - label: B
    content: 民法
  - label: C
    content: 少年事件處理法
  - label: D
    content: 兒童及少年福利與權益保障法
  group_stem: '題組（三）

    1. 拿夾娃娃店無人皮夾 國中生直說好後悔

    陳姓男子到選物販賣機夾娃娃，因疏忽而將皮夾放在機臺上，折返回店內看到皮夾還放在機臺上，卻發現裡面一千多元現金不見了，通知店家調閱監視器並向警方報案。經警方調查，當時兩名學生看見被害人離開時遺忘皮夾，隨即靠上前假裝夾娃娃，並以身體阻擋監視器拍攝，拿走皮夾內的現金後快步離開。事隔6
    小時，兩名13 歲的國中生由老師陪同，到派出所承認犯罪，直說很後悔，老師也不斷對兩人訓誡。因犯嫌未成年，已聯繫家長製作筆錄，訊後以侵占遺失物罪函送少年法庭審理。

    2. 12 歲以下觸犯《刑法》，不再移送少年法庭審理

    過去12 歲以下的兒童只要觸犯《刑法》，都是通知家長和學校接手處理，移送少年法庭，但很容易讓孩子被貼上標籤。西元2019 年《ＯＯＯ法》修法，內容包括7 歲以上未滿12
    歲兒童若有觸犯《刑法》行為，不再移送少年法庭，而是回歸到社福、學校等機構輔導與安置。西元2020 年 6 月19 日相關條文施行後，少年法庭還在調查、審理或是執行的兒童保護事件，皆全部結案，退出司法程序。此次修法，也將「虞犯少年」改為「曝險少年」，期能透過輔導、遠離危險環境，真正從根本幫助他們。兒少的犯罪預防除了從法律面、警政面著手，更要重視個案的後續關懷，才能讓防護網更綿密。'
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 公民
      code: 6-2
      title: 少年犯罪行為的處理
      chapter: 第6章 兒少權益的維護
    textbook: 八下公民 6-2 少年犯罪行為的處理
    labeled_by: ai
