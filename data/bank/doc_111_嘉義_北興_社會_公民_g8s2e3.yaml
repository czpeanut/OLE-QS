- id: doc_111_嘉義_北興_社會_公民_g8s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 根據《警察職權行使法》的規定，警察行使職權時，應著制服或出示證件表明身分，並應告知事由，警察未依此規定行使職權者，人民得拒絕之。上述內容最主要在強調下列何種法治觀念？
  options:
  - label: A
    content: 法律規範政府的作為，而人民權利受到法律保障
  - label: B
    content: 法律制定生效後，對於違法者即產生約束的作用
  - label: C
    content: 行政機關修改不合時宜的命令，以保障人民權利
  - label: D
    content: 法律是由民意代表所制定，也是人民意思的展現。
