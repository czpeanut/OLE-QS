- id: doc_111_嘉義_北興_社會_公民_g8s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 鎮宇喜歡和朋友高歌一曲紓解壓力，某日鎮宇在家裡忘我的唱歌直到深夜，嘹亮的歌聲在社區中迴響，鄰居不堪其擾而向警方報案，警方到場制止鎮宇並科以罰鍰。針對此狀況，下列相關敘述何者正確？
  options:
  - label: A
    content: 在家唱歌是鎮宇的自由權，警察不得處罰
  - label: B
    content: 警察對鎮宇科以罰鍰已違反依法行政原則
  - label: C
    content: 警察對鎮宇科的罰鍰是給鄰居的金錢賠償
  - label: D
    content: 警察須依照法律規定才能對鎮宇科以罰鍰。
