- id: doc_111_嘉義_北興_社會_公民_g8s2e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: '違反法律將受到公權力的處罰。請問：下表為拘役與拘留兩種處罰的比較，何者錯誤？


    | | 拘役 | 拘留 |

    | --- | --- | --- |

    | （Ａ）責任屬性 | 刑事責任 | 行政責任 |

    | （Ｂ）執行 | 行政機關執行 | 法院判決 |

    | （Ｃ）有無前科 | 有前科紀錄 | 無前科紀錄 |

    | （Ｄ）依據 | 依據刑法 | 依據社會秩序維護法 |'
  options:
  - label: A
    content: 責任屬性：拘役為刑事責任，拘留為行政責任
  - label: B
    content: 執行：拘役為行政機關執行，拘留為法院判決
  - label: C
    content: 有無前科：拘役為有前科紀錄，拘留為無前科紀錄
  - label: D
    content: 依據：拘役依據刑法，拘留依據社會秩序維護法
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 公民
      code: 3-2
      title: 刑罰與責任能力
      chapter: 第3章 刑法與刑罰
    textbook: 八下公民 3-2 刑罰與責任能力
    labeled_by: ai
- id: doc_111_嘉義_北興_社會_公民_g8s2e3_s2_13
  section: 2
  number: 13
  type: single
  page: 2
  stem: 關於本文提及的「童工」，以我國法律規定，以下敘述何者正確？
  options:
  - label: A
    content: 童工要從事危險工作前，雇主必須取得家長同意書
  - label: B
    content: 童工一日工作超過8 小時後的加班費，須依法計算
  - label: C
    content: 我國對於童工是專指15 歲以上未滿16 歲的工作者
  - label: D
    content: 童工不能從事夜班，早上5 點營業的早餐店早班很適合童工
  group_stem: '題組（一）

    苗栗一名15 歲少年國中剛畢業，暑假期間經由台中一家仲介公司介紹，到金屬工廠打工，沒想到才上工第一天就受傷，導致左手食指截肢，媽媽指控工廠跟仲介業者，非法雇用童工從事危險工作。

    媽媽說15 歲兒子國中剛畢業，7 月經由台中某仲介公司介紹，到神岡一家金屬工廠打工，沒想到才上工不到20 分鐘，手指就疑似被液壓機壓碎，送醫治療截肢。

    媽媽質問仲介公司，為什麼沒有取得「同意書」，就讓15 歲童工打工，甚至違法讓他從事危險工作，而且工廠根本沒有清楚教導機台操作方式，第一天上工就受傷，之後還沒有報警叫救護車。

    台中勞工局表示讓童工從事危險工作已經觸法，將會調查仲介業者跟工廠過失，還給少年家屬一個公道。'
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 公民
      code: 6-1
      title: 保護兒少權益的法律
      chapter: 第6章 兒少權益的維護
    textbook: 八下公民 6-1 保護兒少權益的法律
    labeled_by: ai
