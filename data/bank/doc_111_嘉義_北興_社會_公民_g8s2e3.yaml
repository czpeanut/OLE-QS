  stem: 根據上文，下列敘述何者正確？
  options:
  - label: A
    content: 要求公開場所不得吸菸是政府的行政管制
  - label: B
    content: 依照菸害防制法開罰的金錢，稱作罰金
  - label: C
    content: 負責開罰不守菸害防制規範的是法院法官
  - label: D
    content: 提供菸品給16 歲少年，最高可處一萬元罰款
  group_stem: '題組（二）

    《菸害防制法》經過15 年終於修法完成，原本就規定公開場所不能抽菸，也擴大了許多禁菸場所。新規定有提高吸菸年齡，也全面禁止電子煙和納管加熱菸。提醒民眾修法後會「加重罰則」且使用者也會受罰，只要違規使用電子煙或未經健康風險評估加熱菸，行政機關可處2,000
    元至1 萬元罰款。

    關於禁菸年齡的規定，現在提高到20 歲，民眾不得提供菸品、指定菸品和必要組合元件給未滿20歲者，也不得強迫、引誘吸菸，違者可處1 萬到25 萬元。販菸場所也應標示警示圖文。'
