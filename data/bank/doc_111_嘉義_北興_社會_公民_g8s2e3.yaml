- id: doc_111_嘉義_北興_社會_公民_g8s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 行政法又稱為活的憲法，因為憲法對於人民權利的保障只是概括性的規定，需要由行政法的補充，才能將國家機關的組織與職權以及人民權利義務的規範具體化，並藉以要求政府依法行政，才能避免政府濫權並確實保障人民的權益。下列何者最符合上述的意涵？
  options:
  - label: A
    content: 行政行為必須有法律的依據或授權
  - label: B
    content: 行政機關應制定法律作為職權依據
  - label: C
    content: 此行政機關以命令限制立法機關作為
  - label: D
    content: 行政機關應以命令修正憲法的規定。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 公民
      code: 5-1
      title: 行政法規的內涵
      chapter: 第5章 行政法規與行政救濟
