  section: 1
  number: 6
  type: single
  page: 1
  stem: 中國政府為了解決區域發展不均的問題，根據各區域現況，畫分為四大經濟區，再依其經濟面臨的問題，擬訂不同的政策。圖（三）為四大經濟區分布圖，關於各區域與其發展策略的敘述，何者正確？
  options:
  - label: A
    content: 甲：為中國傳統重工業中心，以此區成功的發展經驗，帶動其他區域成長
  - label: B
    content: 乙：人口眾多但近年工資上揚，善用其對外交通便利的優勢引進國際移工
  - label: C
    content: 丙：以較低廉的工資與豐厚的自然資源，吸引外國資金投入，發揮承東啟西的優勢
  - label: D
    content: 丁：大量輸出天然資源至中國東部與國外，如西氣東輸、西電東送為主要發展項目。
