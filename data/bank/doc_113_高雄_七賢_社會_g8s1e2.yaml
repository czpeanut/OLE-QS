- id: doc_113_高雄_七賢_社會_g8s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 上海市成為經濟發達且具影響力的城市，與何項發展條件無關？
  options:
  - label: A
    content: 位於珠江水運端點
  - label: B
    content: 居中國海岸線中點
  - label: C
    content: 腹地廣大深入內陸
  - label: D
    content: 陸、海、空運發達。
  group_stem: 上海市是中國經濟、金融和貿易之核心，其GDP 占全中國的3.8％，為該國最富裕的城市。同時其也是全球最大貨櫃港口、第四大國際航空樞紐、第三大股市，匯集中國內外之資金和人才。2022年4月，上海全面封城，不但造成全球半導體、汽車業、蘋果手機等製造業發生斷鏈危機，物流業更面臨貨櫃塞在上海港、拖延交期之難題。這造成各國物價上漲和消費萎縮，使全球糧食價格更加飆漲，益增全球經濟衰退之風險。其經濟衝擊遠超過2020年「武漢封城」和2021年「中國大限電」，被視為「新冠疫情」爆發以來最嚴重的打擊。回答第10至11題：
