  stem: 西元2019年底，特斯拉電動車在中國上海的超級工廠僅花一年時間就完工。其生產線已經高度自動化，從料件運輸，到沖壓、組裝，車身產線的自動化已經高達95%，工廠裡幾乎只能看到一座座的機器人手臂。特斯拉上海廠傾向建立本土化自主供應鏈，不過不見得全以中國本土廠商為主，未來部分關鍵零組件，仍有可能由臺灣廠商替代。由前文可知，中國經濟發展的同時，也積極推動產業逐漸轉型為何種性質的產業為主？
