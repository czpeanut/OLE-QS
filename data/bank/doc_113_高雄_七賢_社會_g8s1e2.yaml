- id: doc_113_高雄_七賢_社會_g8s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 關於一帶一路路線的敘述，何者正確？
  options:
  - label: A
    content: 可串聯亞州、歐洲、非洲與大洋洲進行貿易
  - label: B
    content: 一帶經由新疆維吾爾自治區進入中亞、西亞
  - label: C
    content: 一路由東南沿海出發依序經過印度洋、大西洋
  - label: D
    content: 一帶與一路於歐洲地中海沿岸國家希臘交會。
  group_stem: '中國的「一帶一路」政策旨在建構其與鄰近大洲及周邊海洋的互聯互通網絡，發掘區域市場潛力，促進投資和擴大消費，以創造需求和就業機會，同時促進人文和文化交流，營造政治、經濟與文化的利益共同體。

