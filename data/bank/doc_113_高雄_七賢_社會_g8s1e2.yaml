  - label: A
    content: 立法院通過對總統、副總統彈劾案後，由司法院審理
  - label: B
    content: 司法院掌理全國公務人員懲戒事宜，對違法官員提出彈劾
  - label: C
    content: 行政院院長及各部會首長須至司法院報告，接受質詢
  - label: D
    content: 司法院院長由總統直接任命，大法官須經立法院同意後才能由總統任命。
