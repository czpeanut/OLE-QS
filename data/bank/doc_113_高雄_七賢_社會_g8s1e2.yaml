  number: 49
  type: single
  page: 6
  stem: 立院三讀通過的國會職權條文修正案昨日送抵行政院，今日行政院宣布，經研議後認定條文窒礙難行。人事同意權的行使也可能影響《憲法》法定機關職權行使；藐視國會罪的規定則違反民主、法律明確性原則、比例原則，以及正當法律程序等窒礙難行之處。以下何者可能為行政院所採取的行動？
