  stem: 中國水資源總量多，但人均水資源量不足世界平均值三分之一，為世界上缺水嚴重之國家。圖（一）為中國水資源短缺省區市圖，根據此圖呈現的內容判斷，哪項敘述正確？
  options:
  - label: A
    content: 水資源短缺的地區主要分布在黃河下游一帶
  - label: B
    content: 水資源嚴重短缺的地區是因農業用水需求大
  - label: C
    content: 廣東省水資源短缺的主要原因為重工業發達
  - label: D
    content: 政府為改善此情況而將珠江水源輸送至華北。
