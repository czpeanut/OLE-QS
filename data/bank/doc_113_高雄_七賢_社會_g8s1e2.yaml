  stem: 如圖（十五）網路人物介紹：1945年，日本戰敗。許世賢與當時多數人一樣，為「回歸祖國」感到開心，隔年更直接加入國民黨，選上市參議員。許世賢終其一生爭取女性權益，鼓勵女性參與政治。1950年開放地方自治時，雖然縣市議會的女性保障名額有5名，她怎麼找都只有4名女性願意參選。根據以上內容判斷，下列相關敘述何者正確？
  options:
  - label: A
    content: 男女皆能參選，屬於受益權的保障
  - label: B
    content: 選擇加入政黨，屬於參政權的行使
  - label: C
    content: 婦女保障名額，是平等權的落實
  - label: D
    content: 女性參選意願低落是自由權受到限制。
