  stem: 司法院為國家最高司法機關，院長綜理院務及監督所屬機關。司法院院長、副院長同時出缺時，依據司法院組織法第7條第5項規定，由總統就大法官中指定一人代理院長，代理期間至繼任院長、副院長經立法院同意，總統任命之日為止。請問：我國中央機關的互動關係，下列何者敘述正確？
