  group_stem: '滿清以少數民族的身分入主中原，為了加強對多數漢人的控制，曾制訂許多手段來駕馭臣民。請根據下列資料，回答第30至31題：

    資料一：戴名世在其《南山集》中記述了南明的歷史，表達了對南明永曆帝的同情之意。永曆帝是明朝滅亡後的南明最後一位皇帝，清朝視南明的殘餘勢力為反清力量，因此極為忌諱相關內容。戴名世在《南山集》中，稱永曆皇帝為「明昭宗」，表達出某種程度的尊敬，這種稱謂被清廷解讀為「不忠」和「大逆不道」。此案不僅牽連到他自己，也波及他的家人、門生、友人。其弟子、家屬和出版商甚至印刷工人等均受到懲罰。當時的出版人和戴名世的好友吳仕陽被判絞刑，其他一些人則被流放或罰服苦役。

    資料二：乾隆皇帝親自指導《四庫全書》的編纂，並任命重臣主持，展現對傳統漢文化的重視，意圖讓士人覺得滿清是「中華文化的保護者」，進而促使他們支持清朝的統治。'
