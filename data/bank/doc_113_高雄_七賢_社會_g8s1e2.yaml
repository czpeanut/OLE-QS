  stem: 媒體識讀是當今社會所必備的能力，閱聽人應該要具備一定的素養去判斷媒體內容。以下為四則報紙新聞標題，根據你的公民知識判斷，何者是正確無誤的報導標題？
  options:
  - label: A
    content: 修憲案最終並未通過，監察院院長責無旁貸
  - label: B
    content: 立法院未審查行使同意權，司法院正副院長出現懸缺
  - label: C
    content: 明年公務員退休金可望調漲，審計部對此做出回應
  - label: D
    content: 《職業安全衛生施行細則》通過，將由司法院公布。
