    content: Cooking with a lot of chili pepper.    chili pepper 辣椒
  - label: D
    content: Putting twice vinegar in the food.    vinegar 醋
  group_stem: 'You are on a plane and ready to take your first bite of airplane food,
    but it doesn’t taste as good as it does on land. So, why do food and drinks on
    airplanes taste different?


    In fact, we tell flavors through our senses of smell and taste. Sadly, those two
    senses become less strong when we fly 30,000 feet above the Earth. The humidity
    level in the air is only 12%, and the air pressure is really low. As a result,
    our noses don’t work so well. When our noses don’t work well, our sense of taste
    doesn’t, either. That is because 80% of our sense of taste comes from our sense
    of smell. Therefore, salty and sweet flavors go down by about 30%. Besides, the
    loud noise from the plane makes the problem even worse. Luckily, we can still
    taste bitter, sour, and spicy flavors.


    Now, you know what changes the taste of food and drinks on airplanes. So, next
    time you are on a plane and taste something bad, the problem may not be with the
    cooks.

     flavor 風味 sense 知覺 feet 英尺 humidity level 濕度 air pressure 氣壓

    salty 鹹的 bitter 苦的 sour 酸的 spicy 辣的'
