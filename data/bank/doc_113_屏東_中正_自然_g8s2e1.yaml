- id: doc_113_屏東_中正_自然_g8s2e1_s1_47
  section: 1
  number: 47
  type: single
  page: 4
  stem: 關於自煮火鍋的發熱包中的化學反應式，下列何者正確？
  options:
  - label: A
    content: $\mathrm{Ca(OH)_{2} \rightarrow CaO + H_{2}O}$
  - label: B
    content: $\mathrm{2Ca(OH)_{2} \rightarrow 2CaO + H_{2}O}$
  - label: C
    content: $\mathrm{2CaO + H_{2}O \rightarrow Ca(OH)_{2}}$
  - label: D
    content: $\mathrm{CaO + H_{2}O \rightarrow Ca(OH)_{2}}$。
  group_stem: '【題組】

    最近市面上推出了一種無須用電、火，便能快速煮好的火鍋，被稱為「自煮火鍋」。自煮火鍋主要利用化學反應自行發熱蒸煮，使用時將發熱包置於外鍋容器，並加冷水浸泡，再將食材鍋放置於上方即可。發熱包內含有生石灰（CaO）、金屬粉、活性炭、鹽等成分，加入冷水浸泡後，生石灰與水發生化學反應，產生氫氧化鈣（$\mathrm{Ca(OH)_{2}}$）及大量的熱能，使水沸騰產生蒸氣，便可將食物煮熟。然而，便利的背後仍有必須留意的安全事項，例如：發熱包反應後的溶液為鹼性，具有腐蝕性，對人體肌膚會造成傷害，且若隨意傾倒至河川，也會導致水汙染破壞生態，必須謹慎處理；而自煮火鍋的包裝材質多使用塑膠，若將塑膠容器長時間高溫加熱，也可能會溶出有害物質並將其吃下肚，須多加留意。'
