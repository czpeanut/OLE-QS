    受到新冠肺炎疫情影響，非洲觀光業受到嚴重打擊，但全球飯店連鎖集團卻仍然看好非洲的觀光業，計畫繼續擴張。國際知名飯店集團萬豪國際、麗笙、雅高均表示，會維持非洲地區既定的發展策略。業者表示撒哈拉以南的非洲地區，在飯店市場的發展規模目前仍處於低度開發階段，有很大的發展空間，一旦疫情降溫，商務和休閒旅遊的需求將重現成長。由於
    2020 年新冠肺炎疫情導致許多獨立飯店倒閉，大型連鎖飯店趁機收購這些小型、獨立飯店，加速在非洲地區的產業擴張。

    （資料來源：https://ctee.com.tw/bookstore/world-news/367653.html）'
