- id: doc_113_新北_江翠_自然_g7s2e2_s2_39
  section: 2
  number: 39
  type: essay
  page: 4
  stem: 紅綠色盲屬於哪一種遺傳方式？ (2分)【2-3】
  group_stem: '色盲是一種無法正確分辨部分或全部顏色的視覺異常，屬於常見的遺傳性眼科疾病之一。根據患者缺乏或異常的視覺感光細胞類型不同，可分為紅色盲、綠色盲、藍色盲，以及較少見的全色盲。其中，以紅綠色盲最為普遍。色盲不會造成視力模糊或失明，但會使患者在辨認交通號誌、地圖、圖表，或從事某些職業（如電工、設計師、飛行員）時遇到困難。多數患者自幼便生活在與他人不同的色彩感知世界中，卻往往毫無察覺。通常直到入學或成年後，因與他人對顏色的描述出現落差，或在健康檢查中接受色盲測驗時，才發現自身的色彩辨識與他人不同。人類眼睛的視網膜上含有兩種主要的感光細胞：視錐細胞與視桿細胞。視錐細胞在明亮光線下負責感知顏色，協助我們辨認色彩；視桿細胞則主要在昏暗光線下運作，負責感知明暗與光線強度，讓我們在夜間仍能看見物體。這兩種細胞相互配合，使我們能在各種光線條件下清晰看見周遭世界。

    色盲是由基因突變引起的。由於紅綠色盲的致病基因位於X染色體上，男性只有一條X染色體，因此若該染色體上帶有致病基因，便會直接表現出色盲特徵；而女性有兩條X染色體，必須兩條染色體上都帶有致病基因時，才會發病。目前色盲尚無法透過藥物或手術治癒，但大多數患者能逐漸適應視覺差異，並學會運用其他線索（如物體形狀、位置、明暗程度或文字標示）來輔助辨識顏色。此外，也有一些輔助工具，如色盲濾鏡眼鏡或手機應用程式，能幫助患者在特定情境中改善辨色能力，提升生活便利性與自信心。【本篇文章改自PanSci
    泛科學】'
