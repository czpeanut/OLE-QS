- id: doc_113_新北_江翠_自然_g7s2e2_s1_29
  section: 1
  number: 29
  type: single
  page: 3
  stem: 毛豆腐的發酵過程中，毛黴菌的菌絲在豆腐表面生長。下列哪項不是毛黴菌的特徵？【3-3】
  options:
  - label: A
    content: 主要由單一細胞構成
  - label: B
    content: 毛黴菌從外界獲得養分
  - label: C
    content: 毛黴菌具孢子
  - label: D
    content: 毛黴菌有細胞壁。
  group_stem: '毛豆腐是一種經過發酵處理的豆腐，其表面會長出一層白色絨毛般的菌絲，主要來自毛黴菌屬。這些菌絲不僅無害，還能將大分子的蛋白質分解成較小的胜肽或胺基酸，使營養更容易被人體吸收，並釋放出特殊的香氣與風味，因此使毛豆腐具有獨特的口感與氣味。它在中國東南部，尤其是安徽黃山地區最為有名，也在台灣部分地區被視為一道傳統且富有地方特色的發酵食品。

    毛豆腐的製作通常選用質地較為緊實的板豆腐，經過壓制排水後，將豆腐平鋪在潔淨的竹篾或竹墊上，並置於控制良好的溫濕度環境中進行發酵。此時會以人工或自然的方式接種毛黴菌，讓菌絲在豆腐表面生長，約數日後便會形成一層均勻、白色如絨毛般的菌絲，完成發酵階段。完成初步發酵後的毛豆腐，常會經過油煎或烘烤處理，使表皮酥脆、內部柔軟，帶有淡淡的發酵香與豆香。在不同地區，毛豆腐也會搭配蒜泥、辣椒醬或香菜等佐料，增添風味。其整體風味介於臭豆腐與藍起司之間，對熟悉這種味道的人來說，極具吸引力。'
