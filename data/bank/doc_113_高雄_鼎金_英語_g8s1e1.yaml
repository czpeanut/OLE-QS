    31. How did Mike feel when he got his English test paper?'
  options:
  - label: A
    content: Sad
  - label: B
    content: Angry
  - label: C
    content: Happy
  - label: D
    content: Surprised
  group_stem: 'Mike got a zero on his English test. He went to his teacher and asked
    her why she gave him a zero. Mike was angry because most of his answers were correct.
    The teacher told him, “I think you copied Jerry’s answers.” “How do you know about
    this?” Mike was very surprised. He thought nobody would know it. The teacher smiled
    and said, “Well, your answers and Jerry’s are almost the same. Look at your answer
    to Question Five. The question is “What can’t you do?” Jerry wrote “I can’t dance.”
    and you wrote “I can’t dance, either.”

