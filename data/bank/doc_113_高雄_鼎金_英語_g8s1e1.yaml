  group_stem: 'Welcome to Rose Restaurant

    Are you tired of the busy life in a big city? Are you tired of the unfriendly
    people around you? Visit Rose Restaurant now! It’s far away from the noisy city,
    and people here are friendly. They make you feel at home.

    You can enjoy the delicious meals and take a walk in the lovely rose fields behind
    our restaurant. All you have to do is to slow down and enjoy a peaceful, romantic
    moment.

    ★Open hours: 11 a.m.~9 p.m. From Monday to Saturday.

    ★Classes for making rose cookies: 2 p.m. ~5 p.m.

    ★Call 04-24561234

    ★Coffee/ Afternoon tea: NT$150

    ★Meal: NT$350

    be tired of 對…感到厭倦 rose 玫瑰花 field 田園 peaceful 平和的 romantic 浪漫的'
