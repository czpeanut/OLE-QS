- id: doc_113_高雄_鼎金_英語_g8s1e1_s2_34
  section: 2
  number: 34
  type: single
  page: 3
  stem: 34. What did Ben and Joe play at the night market?
  options:
  - label: A
    content: Soccer
  - label: B
    content: Basketball
  - label: C
    content: Ring toss
  - label: D
    content: Baseball
  group_stem: '(In the classroom)

    Rex: How was your weekend?

    Joe: Great! Last Saturday, I went to the night market with my brother, Ben. We
    ate a lot of food and won a basketball.

    Rex: Wow! How did you win a basketball?

    Joe: Ben and I played the ring toss, our favorite game at the night market. Ben
    wanted to win the basketball and I wanted to win the radio. Ben didn’t win anything
    after he threw all of his rings and he was sad. I wanted to help Ben win the basketball.
    At first, I didn’t win anything, either. After I threw the last ring, it stopped
    in front of the basketball. We jumped up and down because we were very happy.

    Rex: How lucky you are! How much did you pay for the ring toss?

    Joe: Fifty dollars for a basket of rings. We threw two baskets of rings to win
    a basketball.

    Rex: Maybe I can try this game next time.

    ring toss 套圈圈   after 在…之後  threw 丟 pay 付錢'
