  page: 5
  stem: '(1) 下表為戶外有日曬的甲地與室內的乙地在中午時所測量到的各種溫度。根據上文，甲地、乙地在中午時熱傷害風險等級分別為何？(4%)


    | | 甲地 | 乙地 |

    | :--- | :--- | :--- |

    | $T_W$ | 25℃ | 20℃ |

    | $T_G$ | 32℃ | 24℃ |

    | $T_d$ | 28℃ | 24℃ |'
  group_stem: '為了降低中暑的機會，近年來部分國家會使用綜合溫度熱指數 WBGT（℃）作為判斷熱傷害風險的指標，而 WBGT 的計算方式如下：


    在戶外有日曬時，$WBGT = 0.7T_W + 0.2T_G + 0.1T_d$

    在戶外無日曬或室內時，$WBGT = 0.7T_W + 0.3T_G$

    $T_W$：自然濕球溫度（℃），用以反映水分揮發的難易度

    $T_G$：黑球溫度（℃），用以反映太陽輻射的效應

    $T_d$：乾球溫度（℃），用以反映單純空氣溫度


    依 WBGT 數值大小可將熱傷害風險區分為五個等級，如下表所示。


    | WBGT 數值 | < 21 | 21～25 | 25～28 | 28～31 | $\geq 31$ |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 風險等級 | 安全 | 注意 | 警戒 | 高度警戒 | 危險 |


    ※21～25 代表 21 以上（含），未滿 25，其他依此類推


