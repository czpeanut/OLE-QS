- id: doc_113_新北_福和_自然_g9s2e2_s1_40
  section: 1
  number: 40
  type: single
  page: 5
  stem: 為什麼白噪音聽起來像「一道聲音牆」，能夠有效掩蓋其他環境雜音？
  options:
  - label: A
    content: 因為白噪音的音量忽大忽小，讓人無法專注其他聲音
  - label: B
    content: 白噪音的高音成分特別強，能壓過其他聲音
  - label: C
    content: 因為白噪音包含各種頻率，而且每個頻率的音量幾乎一樣
  - label: D
    content: 白噪音會讓耳朵進入休眠狀態，不再接收任何聲音。
  group_stem: '【白噪音是什麼？】

    你聽過白噪音嗎？其實白噪音就在我們的生活周遭，每個人每天都會聽到！白噪音（White Noise）也可以稱為白雜訊，是一種混雜的聲音，當中包含了「所有人耳可聽到的頻率範圍」，而人耳可聽的頻率範圍通常是從20
    Hz 到20,000 Hz（赫茲），你可以想像成同時播放 20,000 種音調。最特別的是，雖然白噪音是由各種不同頻率的聲音組成，但每個不同頻率的聲音發出來的強度都一樣（聽起來一樣大聲），而且會持續一段時間，變得像是一道牆，把其他雜音都擋在外面，讓人聽起來感到相當平穩、舒服。

    看到這裡，你可能對於白噪音的認識還是有些抽象，讓我們舉例來說，白噪音，生活中常可以聽到的風聲、雨聲、海浪聲，還有像是電風扇、吹風機發出的「沙沙」、「嗡嗡」聲或是電視沒訊號時發出的「嘶嘶」聲，都可以算是白噪音，這些聲音的共通點就是很規律、沒有變化，可以蓋住周遭的吵雜聲，例如：窗外的人車聲、同床伴侶的打呼聲，這也是為什麼有些人在下雨天會比較好睡，因為下雨聲相當的規律，掩蓋了其他突發的聲音，讓人在睡眠時，比較不會受到干擾。或是當我們在吹頭髮時，常聽不到旁人說話的原因。白噪音的好處，包括幫助入睡、提高專注力、減少嬰兒哭鬧，科學家研究發現，嬰兒處在有此種白噪音的環境下，會比較容易入睡，白噪音的響度與頻率的關係如右圖。'
