  stem: 肇純在假日到河邊釣魚時，因岸邊石頭濕滑不小心滑倒掉入水中，幸好隨身腰間配戴一款會自動充氣的救生腰帶（充氣後如圖），入水後救生腰帶會在3 秒內自動充氣，使他安全漂浮在水面上。已知肇純在入水前整體的重量為50kgw，救生腰帶在充氣後可額外排開水的體積為5000cm³，水的密度為1
