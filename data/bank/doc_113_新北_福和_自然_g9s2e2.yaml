  stem: '新北市 金山珍貴的百年文化活動「蹦火仔」又稱磺火捕魚如右圖，漁民利用電石（當地俗稱磺石）加水產生某種氣體X，並在「蹦」的一聲下瞬間點燃火炬，氣體X
