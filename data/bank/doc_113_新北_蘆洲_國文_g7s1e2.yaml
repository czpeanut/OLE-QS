- id: doc_113_新北_蘆洲_國文_g7s1e2_s2_42
  section: 2
  number: 42
  type: single
  page: 5
  stem: 文中看見有毒的樹，出現四種不同的心態及行為，請問哪一種人對社會的貢獻力最大？
  options:
  - label: A
    content: 第一種人
  - label: B
    content: 第二種人
  - label: C
    content: 第三種人
  - label: D
    content: 第四種人。
  group_stem: "一棵有毒的樹矗立在路旁。\n 第一種人大老遠看見了，趕緊繞路而行，他們一點也不願接近，深怕不小心會中毒。\n 第二種人來到了樹邊，看見這棵樹，馬上就想到它的毒素，急著要砍掉它，以免有人受害。\n\
    \ 第三種人有著不同的心態，願意帶著慈悲心去思索：這棵樹也有生命，不可輕易地毀掉。於是在樹旁圈上籬笆，註明有毒，以此避免危害到路人。\n 至於第四種人在看見這棵樹的時候，會說：「喔！一棵有毒的樹，太好了，這正是我要的！」他們開始研究樹的毒性，提煉了毒素，與其它成分混合，製成了可以救人的藥材。\n\
    \ 我們對人生的詮釋，其實也就是內在潛意識的外在表現，自然也就活出那種型態的生命形式。\n 於是我們看到，有些人終其一生，始終扮演著苦情哀怨的主角；有些人雖然會賺錢，但卻始終留不住錢；有些人最擅長演出的就是悲劇英雄……。\n\
    \ 「人生永遠是朝著你所思考的方向前進」，就像故事中的那棵樹，你用不同的方式對待，就會導致不同的結果。 (改寫自田彩虹 生命的問句)"
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 國文
      code: 語文常識(二)
      title: 閱讀導航——策略運用與資訊檢索
