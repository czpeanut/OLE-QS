  group_stem: '一、子曰：「古者言之不出，恥躬之不逮②也。」 (論語 里仁篇)

    二、子曰：「飯疏食③，飲水，曲肱④而枕之，樂亦在其中矣。不義而富且貴，於我如浮雲。」 (論語 述而篇)

