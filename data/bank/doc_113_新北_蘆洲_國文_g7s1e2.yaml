- id: doc_113_新北_蘆洲_國文_g7s1e2_s2_44
  section: 2
  number: 44
  type: single
  page: 5
  stem: 海葵的獵食活動需仰賴小丑魚，主要原因是什麼？
  options:
  - label: A
    content: 小丑魚能分泌出毒液
  - label: B
    content: 海葵本身難以移動
  - label: C
    content: 小丑魚是牠的守護神
  - label: D
    content: 海葵的觸手不夠機敏。
  group_stem: "小丑魚和海葵，共同生長在海底岩石邊。小丑魚撿食海葵吃剩的殘渣，而海葵則靠小丑魚清除口中的廢物。附著在岩石上的海葵，用如花瓣似的觸手捕捉獵物，分泌毒液將之麻痺，然後吞食。海葵難以移動，只能靜待獵物上門，而小丑魚就成了誘敵上鉤的餌：牠在海葵伸開來的漂亮觸手間游來游去，引誘其他小魚，使牠們對海葵不存戒心，想到其中嬉戲，結果就成了海葵的餐點。小丑魚也以海葵為避難所，在遇到敵人時，牠就逃到海葵的觸手間甚至口中躲避，海葵卻不會對牠施放毒液。\n\
    \ (節錄自王溢嘉 動物啟示錄)"
