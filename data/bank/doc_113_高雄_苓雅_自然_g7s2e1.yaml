- id: doc_113_高雄_苓雅_自然_g7s2e1_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 有一種鳥的鳥喙形狀有兩種表徵，一種為筆直狀，另一種為彎月狀。顯性遺傳因子以Ｅ表示。科學家將純品系的筆直狀雄性親代與純品系的彎月狀雌性親代交配，生下第一子代全為彎月狀。則下列敘述何者正確？
  options:
  - label: A
    content: 第一子代鳥喙基因型為EE
  - label: B
    content: 可以確定筆直狀雄性親代的基因型為ee
  - label: C
    content: 可以確定彎月狀雌性親代的基因型為Ee
  - label: D
    content: 第一子代互相交配生下的第二子代無法出現筆直狀鳥喙的子代
