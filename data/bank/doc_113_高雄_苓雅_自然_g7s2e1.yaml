- id: doc_113_高雄_苓雅_自然_g7s2e1_s1_26
  section: 1
  number: 26
  type: single
  page: 3
  stem: 果蠅的翅膀有兩種表現型，長翅(R)對短翅(r)為顯性。若親代皆為長翅，交配後產下60 顆受精卵，其中有16 個子代是短翅，其他則都是長翅，若沒有突變發生，下列有關此結果的敘述，以下哪一個推論是正確的？
  options:
  - label: A
    content: 子代中不可能出現短翅，應是實驗錯誤所致
  - label: B
    content: 這一對親代若再交配，仍然有25%的機會生出短翅子代
  - label: C
    content: 長翅子代中，基因都是RR
  - label: D
    content: 親代的遺傳因子組合應是RR×Rr。
