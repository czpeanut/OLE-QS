questions:
- id: doc_113_台中_五權_社會_公民_g8s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 高雄輕軌全線通車後帶來便捷的公共運輸系統，但違規駕駛闖入輕軌路口的案件頻傳，不僅影響行車安全，更可能導致刑責。高雄市政府警察局指出，汽機車違規進入輕軌專用道或路口，不僅違反《道路交通管理處罰條例》，更可能觸犯《刑法》第184
    條第3 項「過失妨害舟車行駛安全罪」，最高可處2 年有期徒刑或20 萬元罰金，提醒駕駛人切勿心存僥倖，以免後悔莫及。請問：有關「罰鍰」、「罰金」的相關說明，下列何者正確？
  options:
  - label: A
    content: 罰鍰由法院宣告，罰金由行政機關依法科處
  - label: B
    content: 罰款金額不同，罰金較高而罰鍰較低
  - label: C
    content: 罰金屬刑事制裁，罰鍰則屬行政處罰
  - label: D
    content: 罰金補償給受害者，罰鍰則繳給政府。
- id: doc_113_台中_五權_社會_公民_g8s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 彰化勵志中學是一所少年矯正學校，是全台收容人數最多，且唯一有收女生的矯正學校。進入該學校的少年，均須接受教育訓練，以矯正不良習性，促其改過自新，適應社會生活。請問：該校少年所接受的是哪一種保護處分？
  options:
  - label: A
    content: 安置輔導
  - label: B
    content: 感化教育
  - label: C
    content: 保護管束
  - label: D
    content: 假日生活輔導。
- id: doc_113_台中_五權_社會_公民_g8s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 關於行政處分的敘述，下列何者正確？
  options:
  - label: A
    content: 行政處分的內容對人民有利也有不利
  - label: B
    content: 行政處分是由立法機關對特定人民直接發生法律效果的行為
  - label: C
    content: 學校頒發畢業證書不屬於行政處分
  - label: D
    content: 罰金、罰鍰都是行政處分的範圍。
- id: doc_113_台中_五權_社會_公民_g8s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 今年國三剛畢業的阿明準備畢業後前往家裡附近的便利商店打工賺取上高中的學費。阿明如果要去打工，應該注意下列哪些事情？(甲)不能從事有危險性質的工作 (乙)必須徵求父母同意
    (丙)每週工作時間不得超過8 小時 (丁)不得在例假日工作。請問：上述哪些為正確？
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲丙丁
  - label: C
    content: 乙丙丁
  - label: D
    content: 甲乙丁。
- id: doc_113_台中_五權_社會_公民_g8s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 關於少年犯罪事件相關的法律規定，下列何者的說明最正確？
  options:
  - label: A
    content: 少年犯罪的處罰，一律適用《刑法》處理
  - label: B
    content: 《少年事件處理法》適用12 歲以上未滿16 歲之少年
  - label: C
    content: 少年刑事案件將由檢察官偵查起訴並由少年法庭審理
  - label: D
    content: 若少年犯罪罪刑較重大，則改由少年保護事件處理。
- id: doc_113_台中_五權_社會_公民_g8s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '根據我國相關法律規定判斷，下列有關甲至庚的年齡大小排列，請選出正確答案？

    > 《兒童權利公約》的兒童：指未滿 甲 歲

    > 《少年事件處理法》中的少年： 乙 歲以上，未滿 丙 歲

    > 《刑法》中的限制責任能力者： 丁 歲以上，未滿 戊 歲

    > 《勞動基準法》的童工： 己 歲以上，未滿 庚 歲'
  options:
  - label: A
    content: 庚>丁>乙
  - label: B
    content: 丁=己>乙
  - label: C
    content: 甲=丙=庚
  - label: D
    content: 戊>丁>己。
- id: doc_113_台中_五權_社會_公民_g8s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 依照《兒童及少年福利與權益保障法》規定，父母、監護人對兒少應負保護的責任，若是父母、監護人未善盡職責，可能會受到什麼處罰？(甲)罰鍰 (乙)沒收 (丙)親職教育輔導
    (丁)褫奪公權
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 甲丁
  - label: D
    content: 甲丙。
- id: doc_113_台中_五權_社會_公民_g8s2e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 比特犬攻擊事件頻傳，屏東街頭有比特犬當街攻擊柴犬，台北市街頭則有比特犬兩度跳出車窗攻擊機車騎士，其實農業部早已公告自111 年3 月1 日起，比特犬被列為「指定禁止飼養或輸入之動物」，現有比特犬飼主須在期限內辦理申報備查，並遵守配套管理規定，才可以繼續飼養。若違法飼養，最重可開罰25
    萬元，並可沒入犬隻。綜上所述，下列何者正確？
  options:
  - label: A
    content: 管制措施僅會限制人民的權利
  - label: B
    content: 申報備查的規定屬於行政救濟
  - label: C
    content: 法院會給予違反規定者行政罰
  - label: D
    content: 政府以行政管制防治犬隻傷人
- id: doc_113_台中_五權_社會_公民_g8s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 新北某私立學校舉辦「單車環台成年禮」活動時，車隊在彰化縣遭汽車逆向衝撞，導致7 名學生輕重傷送醫。有網友發現，汽車逆向行駛只要罰600 元，但在捷運手扶梯上逆向的罰鍰卻高達7500
    元，甚至連在捷運上喝水也同樣會被罰7500 元，罰金高出12.5 倍，在網路上引起熱議。請問：汽車逆向行駛應負的法律責任，與下列何者相同？
  options:
  - label: A
    content: 占用大眾運輸的博愛座被網路譴責
  - label: B
    content: 在公共場所吸菸被開單處罰
  - label: C
    content: 攜帶爆裂物進入校園而被檢警究辦
  - label: D
    content: 不小心打破他人的車窗被要求賠償。
- id: doc_113_台中_五權_社會_公民_g8s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 霸凌事件一再發生，然而許多霸凌別人的青少年直到警方找上門來，才知道已經觸法，必須負起法律責任。請問：下列關於少年的犯罪行為，何人的認知是正確的？
  options:
  - label: A
    content: 甲：「未滿14 歲的少年犯罪，不會受到任何處分。」
  - label: B
    content: 乙：「曝險少年，依《兒童及少年福利與權益保障法》來處理。」
  - label: C
    content: 丙：「輕微的犯罪行為，可以用保護處分來代替刑罰。」
  - label: D
    content: 丁：「觸犯較重的罪時，父母須負起連帶的刑事責任。」
- id: doc_113_台中_五權_社會_公民_g8s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 下列哪位國中生的行為不屬於「曝險少年」？
  options:
  - label: A
    content: 施用毒品咖啡包尚未觸犯刑罰法律的阿國
  - label: B
    content: 和朋友計畫偷竊便利商店物品的小中
  - label: C
    content: 無正當理由經常帶危險刀械到學校的阿升
  - label: D
    content: 無照騎乘機車還闖紅燈的阿昱。
- id: doc_113_台中_五權_社會_公民_g8s2e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 小晴正在整理「少年刑事案件」的處理流程，下列何者為正確的流程？
  options:
  - label: A
    content: 年滿12～18 歲且犯罪情節輕微→少年保護官起訴→少年法院（庭）審理→處以刑罰
  - label: B
    content: 年滿14～18 歲且犯罪情節重大→檢察官起訴→少年法院（庭）審理→處以刑罰
  - label: C
    content: 年滿18 歲且犯罪情節重大→少年保護官起訴→少年法院（庭）審理→處以保護處分
  - label: D
    content: 未滿14 歲且犯罪情節輕微→檢察官起訴→少年法院（庭）審理→處以保護處分。
- id: doc_113_台中_五權_社會_公民_g8s2e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 新聞報導：「警察局破獲販毒集團，25 歲主嫌銷售以咖啡袋包裝的毒品，銷售對象包括青少年。警方表示，家長除了定期關心孩子外，發現異常行為也能撥打專線請求協助。」請問：根據內容判斷，下列敘述何者正確？
  options:
  - label: A
    content: 文中青少年可能會面臨保護管束
  - label: B
    content: 文中青少年須負損害賠償責任
  - label: C
    content: 販毒的主嫌屬於限制責任能力人
  - label: D
    content: 警方強調家庭生育功能的重要性。
- id: doc_113_台中_五權_社會_公民_g8s2e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 關於「行政訴訟」的敘述，下列何者正確？
  options:
  - label: A
    content: 這是針對行政處分不當或違法，而使自己權益遭受損害時所提出的行政救濟
  - label: B
    content: 對行政訴訟結果不服，才可以提出訴願
  - label: C
    content: 可對立法機關或法院提出救濟
  - label: D
    content: 人民須向司法機關提出「訴願」，請求救濟。
- id: doc_113_台中_五權_社會_公民_g8s2e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 王律師發現近來觸法的少年有逐年增多的趨勢，因此搜尋「少年保護事件」的相關案例，作為其向青少年法律宣導的資料。請問：王律師最可能將下列哪項違法行為，列為宣導資料中？
  options:
  - label: A
    content: 夥同犯罪集團擄人勒贖
  - label: B
    content: 無照騎乘機車駕駛且未戴安全帽
  - label: C
    content: 網路散布謠言誹謗同學
  - label: D
    content: 積欠同學財物尚未歸還。
- id: doc_113_台中_五權_社會_公民_g8s2e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 網路為你我的生活帶來了許多的刺激與樂趣，但同時也需要提高警覺、學習自我保護。某檢察官提及曾偵辦過的一件案子，「某成年男子透過手機通訊軟體誘騙15 歲少女傳裸照。」請問：根據上文，檢察官應依下列哪一部法律對嫌犯提起公訴？
  options:
  - label: A
    content: 《性別平等教育法》
  - label: B
    content: 《兒童及少年性剝削防制條例》
  - label: C
    content: 《性侵害犯罪防治法》
  - label: D
    content: 《兒童及少年福利與權益保障法》。
