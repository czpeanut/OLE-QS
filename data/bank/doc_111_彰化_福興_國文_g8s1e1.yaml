- id: doc_111_彰化_福興_國文_g8s1e1_s3_31
  section: 3
  number: 31
  type: single
  page: 3
  stem: 依本文，為什麼作者要在開頭表達「春花秋月何時了，髮落知多少？」
  options:
  - label: A
    content: 作者感嘆歲月流逝，頭髮斑白
  - label: B
    content: 影射老先生的頭髮稀疏
  - label: C
    content: 感嘆秋美理髮店的老闆娘年華老去
  - label: D
    content: 表達秋美理髮店如同春花秋月般的榮枯
  group_stem: '自有其榮枯的週期。最熱鬧的時候，四張椅子上刀剪齊動，老闆娘幽雅地坐在沙發上安撫等候的客人。但最近一兩年卻常看到老闆娘一人獨撐大局，因為急來愈少人願意到這種單純的理髮店工作了。

    前後冬天去，正好碰到老闆娘在幫一位頭髮禿得只剩中間一小握的老先生理髮，我坐在一旁等候，聽到老先生跟老闆娘說：「你們這間店真不錯，每次來你們都知道我要理什麼頭髹。」老闆娘說：「歐吉桑，我從你少年幫你理到老，怎麼不知道？」我抬頭看一看看鏡中這位看似老長大的中年老闆娘，差一點笑出來。她的女兒剛好從門外走進來，向我說：「老師好！」她拿著一瓶香水要送給她媽媽。多年前，她還在我們國中的英語班上，現在站在她媽媽身邊真像年輕時候她媽媽的模樣。我心裡想著：看著你們長大的應該是我！

    春美，秋美；髮的速度是時間的速度。

    陳黎〈髮的速度〉'
