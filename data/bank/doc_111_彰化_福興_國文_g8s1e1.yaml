  section: 3
  number: 33
  type: single
  page: 3
  stem: 有關「吾能別香臭」句中的「別」字，下列解釋何者正確？
  options:
  - label: A
    content: 訣別
  - label: B
    content: 辨別
  - label: C
    content: 告別
  - label: D
    content: 增別
  group_stem: '眉、眼、口、鼻四者，皆有神也。

    一日，口為鼻曰：「爾何能，而位居吾上？」鼻曰：「吾能別香臭，然後方可食，故吾位居汝上。」

    鼻為眼曰：「子有何能，而位在我上也？」眼曰：「吾能觀美惡²，望東西，其功不小，宜居汝上也。」

    鼻又曰：「若然，則眉有何能，亦居我上？」眉曰：「我也不能與諸君相爭得⁴。我若居眼鼻之下，不知你一個面皮安放哪裡？」

    羅燁〈醉翁談錄〉

    註：1為：音ㄨㄟˋ，跟、與。

    2美惡：指美醜。

    3不解：不明瞭、不清楚。

    4爭得：爭能。'
