  group_stem: '題組四(32) What is a foodie?

    A foodie loves food very much. They don’t just eat when they are hungry. They
    believe eating is a fun hobby. A foodie likes to try new food and learn about
    food. A foodie spends day and night planning what to eat.

    The word “foodie” started being used in the 1980s. It is a way to say someone
    likes food but is not a great chef. A foodie doesn’t eat too much. They just really
    enjoy good food.

    Now, many people are foodies. There are even phone apps to help foodies take pictures
    of their food. These apps have fun filters to make the food look delicious. Foodies
    like to share photos of their food with their friends.

