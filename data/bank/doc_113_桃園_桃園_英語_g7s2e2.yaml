  group_stem: '題組三(29~31) How to Make a Banana Pie with Rice Paper

    What you need :

    | 2 bananas | 1 egg | 2g salt | 20g butter | 2 pieces of rice paper |


    What you do :

    1. Cut the bananas into small pieces.

    2. Add the egg, salt, and half of the banana pieces to a bowl. Mix until it becomes
    batter.

    3. Add butter to a hot pan. After the butter melts, add one piece of rice paper.

    4. Put the batter on the rice paper.

    5. Put the other piece of rice paper on the batter.

    6. Fry both sides of the rice paper with batter inside.

    7. Wait until the rice paper is brown on both sides.

    8. Put the other half of the banana pieces on the rice paper.

    9. You can also add other fruits to make it more delicious.

