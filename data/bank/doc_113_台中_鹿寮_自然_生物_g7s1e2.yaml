  section: 2
  number: 14
  type: single
  page: 1
  stem: 酵母菌含有可以將糖分解為二氧化碳與酒精的酵素。小茹等四人準備製作饅頭，需要二氧化碳讓麵團膨脹，做成鬆軟的饅頭。四人將糖、麵粉與水混合後，各自發表意見，則哪位的說法才是正確的？
  options:
  - label: A
    content: 小茹：酵素必須在酵母菌體內才具有分解的能力。
  - label: B
    content: 小中：加入酵母菌後直接加熱蒸熟，就可以有足夠的二氧化碳做出鬆軟饅頭。
  - label: C
    content: 小怡：把酵母菌磨碎後，裡面的酵素混入麵粉團也可以發揮作用。
  - label: D
    content: 小敏：將糖分解為二氧化碳與酒精的酵素也可分解脂質。
