  stem: 公民監督國會聯盟是以持續監督國會，提出評鑑報告，淘汰不適任立委，改善國會生態為目標的民間團體。每個會期都會藉由統計立委出席率、提案數等資料，提出優秀及待觀察的立委名單讓民眾參考。根據上文，公民監督國會聯盟能對社會產生影響，與下列何者最相關？
