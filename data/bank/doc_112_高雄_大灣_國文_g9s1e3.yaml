- id: doc_112_高雄_大灣_國文_g9s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 對於下列鄒忌諷齊王納諫文句的說明，下列何者正確？
  options:
  - label: A
    content: 「宮婦左右，莫不私王；朝廷之臣，莫不畏王；四境之內，莫不有求於王。由此觀之，王之蔽甚矣！」 朝廷大臣因有求於齊王，故蒙蔽良心屈從齊王
  - label: B
    content: 「令初下，群臣進諫，門庭若市」從「門庭若市」可以得知，諸侯各國前來朝貢的人非常多
  - label: C
    content: 「燕、趙、韓、魏聞之，皆朝於齊。此所謂戰勝於朝廷。」從鄰國「皆朝於齊」的現象可以得知齊 威王治國有很好的成效
  - label: D
    content: 「期年之後，雖欲言，無可進者。」「無可進者」是指因為沒有賞金，所以沒有臣民願意進諫。
  lesson_raw:
    title: 鄒忌諷齊王納諫
    basis: 題幹提及「鄒忌諷齊王納諫文句」
- id: doc_112_高雄_大灣_國文_g9s1e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 以下對於永不滿足，長保傻勁的敘述，何者正確？
  options:
  - label: A
    content: 本文的寫作特色是援引歷史名人事例，來做為自身成功之道的佐證
  - label: B
    content: 賈伯斯說：「我沒有大學文憑，現在大概是我最接近大學畢業典禮的一刻！」此段話流露出唏噓感嘆 的心態
  - label: C
    content: 賈伯斯認為「被蘋果炒魷魚反而是人生中最棒的一件事」，其原因是能學習面對現實，不再受人 情世故牽絆
  - label: D
    content: 賈伯斯以「永不滿足，長保傻勁」為演講主題，其用意是勉勵學子熱愛學習，堅持理念，不計得失。
  lesson_raw:
    title: 永不滿足，長保傻勁
    basis: 題幹提及「永不滿足，長保傻勁」
