- id: doc_112_高雄_大灣_國文_g9s1e3_s1_39
  section: 1
  number: 39
  type: single
  page: 6
  stem: 根據上文，下列選項何者說明正確？
  options:
  - label: A
    content: 「蹲下」這份禮物的主要意義是遠離與意見相左的人
  - label: B
    content: 在第二份禮物「堅定」中提到的藍佩嘉老師的話主要強調不在乎社會不正義，要關注個人安定
  - label: C
    content: 「溫柔」這份禮物的主要目的是讓我們看到背後的傷害和錯過
  - label: D
    content: 我們需要保持「堅定」是因為我們需要一步一步地努力。
  group_stem: '親愛的畢業生，允許我嘗試將這些我所看見的光，轉化為對你們的幾堂「畢修課」，或者就說是「畢業禮物」吧！

    第一份禮物，我把它叫做「蹲下」。

    環視我們四周，從我們日常的決定到最近各樣的社會議題中，我們都常常碰到乍看之下好像跟自己來自全然不同的世界、甚至好像是平行時空、講不同語言的人。有時候真的會覺得很挫折，自己明明就是有道理的、是有批判思考能力的，卻無法被理解與接受，甚至要被攻擊、撕裂。這幾年，我好幾次覺得曾經有的熱情就要被消磨殆盡。

    如果，未來，你也有這樣覺得有點「高處不勝寒」的時候，我希望你願意試試這份名叫「蹲下」的禮物。甚至，就找個意見與你極盡不同的人，蹲下來，暫時閉上嘴巴，用好奇取代先入為主，好好地聽、再好好地說。這中間一定會有很不舒服的時候，但我渴望你會像我一樣，慢慢地體會這份禮物的美好：蹲下來，允許我們暫時放下指責與抗拒，創造真實的連結。在連結中，我們或許就會發現，其實我們沒有想像中那麼不一樣：我們都是人，都有恐懼、有期待、有要保護的、也有害怕失去的事物。蹲下來，放下一些自己，我們才能有新的眼光看待彼此。蹲下來，不要放棄對話，因為拆毀是簡單的，建造才是困難的。多一點信任，我們這個世代才有機會建造更包容的社會，帶領更多人一起往前走。

    第二份禮物，我把它叫做「堅定」。

    有人說，年輕的代名詞是勇敢，因為只有年輕的時候，我們敢不顧他人眼光地為我們所看到的不公不義大力地發出聲音。很多人跟我說，等到你年紀大一些就會懂，撞得頭破血流也無法改變社會的巨大結構，還不如找份安定的工作，不要管太多。

    我真切地希望，不論畢業多久，我們永遠不會對不正義無感，勇敢不該只是年輕的代名詞。但我們確實會受傷，現實也確實會澆熄許多人心中曾經有的火，包括我自己在內。在這些時候，老實說，選擇不在乎或把事情當成是別人的責任，真的會好受很多。

    若有一天，你也感到無力的時候，我希望你願意考慮拿出這份名為「堅定」的禮物。藍佩嘉老師在臺大社會系的畢業典禮上說的：

    「如果結構像是一道牆，這道牆之所以被築起，是因為每個人都貢獻了一塊磚。改變絕非一蹴可幾，但絕對是可能的，讓我們一塊一塊磚頭地來吧。」

    「堅定」這份禮物，是為了讓我們可以正視我們的痛與失望，卻不致冷淡與絕望。

    第三份，也是最後一份禮物，我把它叫做「溫柔」。

    這份禮物，建議要常常與「堅定」搭配使用。如果只有「堅定」，我們可能會不小心把自己看作是正義的化身，被善與惡、對與錯的二分法框住，而看不見，在「惡行」的背後，時常也有大結構中層層的傷害與誤解，更看不見，自己身上可能也有刺。當我們與惡的距離越近，我們可能會在心碎中產生更多困惑。如果有一天，你也遇到了這個困惑，我希望你願意拿出「溫柔」這份禮物。溫柔不等於示弱，更不是要削弱我們的堅定。

    馬丁路德．金恩博士在帶領群眾對抗種族歧視的時候，常對跟隨他的人們大聲疾呼：

    「我們要用我們每一分每一寸的力氣，我們只要還活著一天，就要堅定對抗這些不公平，沒有任何事可以讓我們妥協。但是在此過程中，我們更不能妥協的，是我們愛人的義務。黑暗不能驅走黑暗，只有光能夠驅走黑暗。如果我們也加入仇恨的行列，我們只會成為黑暗的一部分。沒有任何人所做的任何事，值得讓我們允許仇恨進入我們的心。因此，讓我們斥責歧視的行為，卻要愛那些歧視我們的人，因為一顆溫柔愛人的心是我們改變人最重要的武器。」

    到今天，我都深深珍藏這份名為「溫柔」的禮物，尤其當我感到憤怒，我會打開這份禮物，提醒我自己：一個人不該只是因為已經證明了他的價值才被看見，而更是因為在最脆弱、最醜陋、在什麼都還不能回報的時候仍然被看見，才能活出自己真正的價值。

    甚至，對於在懸崖邊的人，這份「溫柔」可能是挽救一生的訊息。

    今天，在最後，我想傳承我的媽媽最喜歡的一句話來祝福你們：「患難生忍耐，忍耐生老練，老練生盼望。」

    ─節錄自劉安婷（非營利組織「為臺灣而教」基金會創辦人）3 份畢業禮物─2019 國北教大畢典致詞'
