  stem: (甲) 十指如枯筍，和袖捧金尊。搊煞銀箏字不真，揉癢天生鈍。縱有相思淚痕，索把拳頭搵。(乙) 茅簷低小，溪上青青草。醉裡吳音相媚好，白髮誰家翁媼？
    大兒鋤豆溪東，中兒正織雞籠。最喜小兒亡賴，溪頭臥剝蓮蓬。(丙) 渡遠荊門外，來從楚國遊。山隨平野盡，江入大荒流。月下飛天鏡，雲生結海樓。仍憐故鄉水，萬里送行舟。(丁)
    江南可採蓮，蓮葉何田田。魚戲蓮葉間，魚戲蓮葉東，魚戲蓮葉西，魚戲蓮葉南，魚戲蓮葉北。(戊) 今朝郡齋冷，忽念山中客。澗底束荊薪，歸來煮白石。欲持一瓢酒，遠慰風雨夕。落葉滿空山，何處尋行跡？以上文句內容依古體詩、樂府詩、近體詩、詞、曲順序排列應為下列何者？
