- id: doc_112_高雄_大灣_國文_g9s1e3_s1_35
  section: 1
  number: 35
  type: single
  page: 5
  stem: 太宗提到自己對弓矢的瞭解，是用來說明什麼？
  options:
  - label: A
    content: 嫻熟治國之道，更勝於運用弓矢
  - label: B
    content: 在年少時即能體悟弓矢的妙理
  - label: C
    content: 對弓矢製作的技藝有疑問
  - label: D
    content: 對治理國家的要領還不足。
  group_stem: '貞觀初，太宗謂蕭瑀曰：「朕少好弓矢，自謂能盡其妙。近得良弓十數，以示弓工，乃曰：『皆非良材也。』朕問其故，工曰：『木心不正，則脈理皆邪；弓雖剛勁，而遣箭不直，非良弓也。』朕始悟焉。朕以弧矢定四方，用弓多矣，而猶不得其理。況朕有天下之日淺，得為理之意固未及於弓，弓猶失之，而況於天下乎？」自是詔京官五品以上，更宿內省。每召見，皆賜坐與語，詢訪外事，務知百姓利害、政教得失焉。

    ─改寫自吳兢貞觀政要'
