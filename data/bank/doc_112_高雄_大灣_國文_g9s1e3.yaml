- id: doc_112_高雄_大灣_國文_g9s1e3_s1_37
  section: 1
  number: 37
  type: single
  page: 5
  stem: 根據上文，下列選項何者說明正確？
  options:
  - label: A
    content: 作者對於使用電腦的態度起初是感到焦慮和淒涼
  - label: B
    content: 作者通過使用電腦學到了香港鏞記鵝肝腸的各種調理之術
  - label: C
    content: 作者老的時候不得不使用電腦的原因是無紙閱讀是環保的趨勢
  - label: D
    content: 作者自稱「今之古人」的原因主要是喜愛用筆寫字。
  group_stem: '我是很晚才使用電腦的那種今之古人。四十歲以前，我總覺得電腦的便利之中，寓含了管控與剝削，看見許多人如蝙蝠掛在網上，長夜不寐，更多人打開電腦的第一件事，便是刪除垃圾信函、回覆電子郵件，MSN、即時通……，電腦無謂地損耗現代人許多時間！我極力抗拒電腦，一直到工作需要實在緊迫，我必須去瞭解網路書店的時刻。

    那種感覺很怪異，我像個負嵎頑抗的西楚霸王─或者說，一個老兵，舉世皆用槍炮之時，猶持刀劍。當工作聯繫的訊息已幾乎全部電郵往返，當書籍的行銷通路已有一大區塊依賴網路之時，我懷著蒼涼的心境，踏進「1」和「0」所編碼的世界，不免也回想起，多年前傳真給白先勇先生，收到他電子郵件賜覆時的訝然。

    現在的我，選擇在網路上和同事、工作對象分享資訊，並參與討論，慢慢變成了每日的例行習慣。有一次電腦中毒，三天無電腦可用，我居然坐立難安，甚至悵然若失。我知道，電腦已然成為我生活、生命的一部分了！電腦修好之後，我如盲者重見光明，在網路通訊上，更心甘情願的接受另一種秩序。

    網路也有便捷和意外的驚喜。香港鏞記鵝肝腸的各種調理之術，蔡珠兒透過電子郵件一一為我說分曉，朋友的美文佳作也常因此盡覽無遺。或許，我還可以找到別的理由：減低儲存空間、無紙閱讀是環保等等，終究，網路另創了一個世界：快捷、無遠弗屆，但也充斥舛誤和謠言。

    喜歡用筆寫字，所以收藏了一些紙鎮，玉石、琉璃、水晶、銅鐵、木竹皆有之。春節之前，幫幾位朋友寫春聯，隨興而書，感覺甚是舒暢，其中一對聯：「一心皎月接雲漢，滿天星斗納懷中」。

    我還記得在書案前審視、摩挲那些紙鎮，看著自己親手寫的字，心有戚戚焉。

    當我老的時候，也許這些紙鎮，早已無紙可鎮了，而我手指只會鍵盤輸入，早已忘了筆畫順序橫豎撇捺。

    但願那個時代，不要早早到來。

    ─改寫自許悔之寫字的迷戀'
