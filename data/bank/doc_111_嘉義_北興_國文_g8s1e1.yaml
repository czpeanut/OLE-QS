  - label: D
    content: 七夕當天在小孩的床邊祭拜織品，可以保佑孩子健康長大。
  group_stem: '七夕這天在各個傳說裡面，都跟仙女有著密不可分的關係，民間傳統中又被稱為「七巧節」，就像日本有女兒節一樣，台灣則有七巧節，都是家裡有女兒才會過的節日。

    傳說這天是七仙女的生日，七仙女非常喜歡小孩子，因為她很照顧人間的小孩，又被稱為「七娘媽」。為了希望女兒能長得跟七仙女一樣美麗、擁有跟七仙女一樣會織布的好手藝，只要家裡有未滿16歲的女兒，就會在這天準備油飯、麻油雞酒、糖粿和三牲，來拜「七娘媽」。還會準備好乾淨的水盆、毛巾、鏡子及胭脂水粉，讓七娘媽可以洗臉打扮。從古至今，用化妝品討好女孩子，準沒錯的概念，你家也有七夕拜拜的習慣嗎？

    台灣在七夕的另一個習俗是「拜床母」，傳說床母是孩子的守護神，希望孩子晚上好好睡覺、平安長大就要拜床母，七月七日也剛好是床母的生日，這天要準備鮮花、水果、糕點，在小孩子的床上，或是床邊拜拜，請床母幫忙照顧孩子，有的傳說認為，床母就是七仙女的化身哦！只能說七夕這天跟仙女，果然有著密不可分的關聯啊！  （節選自方格子父權還是虐戀？！七夕傳說百百種）'
