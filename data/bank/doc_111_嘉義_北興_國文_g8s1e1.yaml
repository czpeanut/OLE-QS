- id: doc_111_嘉義_北興_國文_g8s1e1_s4_1
  section: 4
  number: 1
  type: essay
  page: 5
  stem: "一、題目：無題目，請直接依說明完成寫作。\n二、說明：琦君寫了一篇「下雨天，真好」，又有一篇「下雨天，真不好」，分明是一樣的雨天，但由於情境的差異，看待角度不同，就對下雨天有了截然不同的評價。吳起在歷史上雖有不孝、殺妻、苛刻等惡名，但在軍事理論和政治改革上，卻是赫赫有名的典範。王羲之批評王藍田性急而「無一豪可論」，但同時的王導、謝安卻讚賞王藍田正直率真。\n\
    \     由以上例子可知，當我們從不同角度看待人、事、物時，常能有不同的體會。請你就自己的經驗省思，是否也有類似由於「角度」不同，而有不同「見解、感受」的狀況呢？對於這種狀況，你又有什麼樣的感想？\n\
    三、注意事項：1.文中不可洩露自己的身分。2.請勿使用詩歌及小說形式寫作。3.使用「黑色筆」書寫，勿用鉛筆。4.文章必須分段，並使用新式標點符號。\n四、評分換算標準：六級分-１０分\
