  group_stem: 我國現有六直轄市山地原住民區乃經多方爭取後，才於西元 2014 年通過修正條文，於《地方制度法》中增列專章規範「直轄市山地原住民區」，明定其為地方自治團體。其規格相當於鄉鎮市，自治內容也較相近，不僅能選舉區長、區民代表；也具立法權，區民代表可以訂定區的法令，無須全部遵循直轄市法令；經費來源與運用皆獨立運作，並自行編列預算，直轄市只能監督經費運用是否合法；行使行政權與人事權時，也能自主決定，直轄市僅能做合法性的監督。
