  stem: 有關「霧凇沆碭，天與雲、與山、與水，上下一白。湖上影子，惟長堤一痕、湖心亭一點，與余舟一芥、舟中人兩三粒而已」的空間書寫，下列何者正確？
  options:
  - label: A
    content: 以簡約之筆刻畫人與物的空間
  - label: B
    content: 透過水平視線描寫周遭的景物
  - label: C
    content: 以「痕、點、芥、粒」四個量詞來凸顯場景的廣大空間。
  - label: D
    content: 天空、雲層、湖水均籠罩於晨曦中，故稱「上下一白」
  group_stem: '湖心亭看雪　張岱

    崇禎五年①十二月，余住西湖。大雪三日，湖中人鳥聲俱絕。

    是日，更定②矣，余拏③一小舟，擁毳衣④、爐火，獨往湖心亭看雪。霧凇⑤沆碭⑥，天與雲、與山、與水，上下一白。湖上影子，惟長堤一痕、湖心亭一點，與余舟一芥⑦、舟中人兩三粒而已。

    到亭上，有兩人鋪氈⑧對坐，一童子燒酒，爐正沸。見余大喜，曰：「湖中焉得更有此人！」拉余同飲，余強飲三大白⑨而別。問其姓氏，是金陵人客此⑩。及下船，舟子⑪喃喃曰：「莫說相公⑫痴，更有痴似相公者。」（節錄自陶庵夢憶）

    注釋

    ①崇禎五年：西元一六三二年。崇禎，明思宗的年號。

    ②更定：已經是初更了，指晚上七點至九點。

    ③拏：牽引，此指乘坐。

    ④毳衣：細毛大衣。毳，鳥獸的細毛。

    ⑤霧凇：霧氣因天寒而結成的白色結晶。

    ⑥沆碭：白茫茫的樣子。

    ⑦一芥：在此形容船像小草般微小。芥，小草。

    ⑧氈：毛毯。

    ⑨三大白：三大杯。白，指酒杯。

    ⑩客此：到這裡作客。

    ⑪舟子：船夫。

    ⑫相公：舊時對讀書人的敬稱。'
