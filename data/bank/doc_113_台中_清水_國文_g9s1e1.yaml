  stem: '南朝 梁 昭明太子蕭統是個文學家，一生愛好山水風景。他在花園中修建了亭臺樓閣，常常約請朝野名士前往遊覽。有一次，他與幾位名士泛舟遊賞的時候，蕭統盛讚景色之美，又說：「要是再有藝伎奏奏音樂就好了。」蕭統吟起了左思招隱詩的名句：「『何必絲與竹？山水有清音。』」


