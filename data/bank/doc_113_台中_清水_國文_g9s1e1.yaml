  stem: '我們生命中的一切所願，其實不應該用「追求」，而應該用「吸引」。曾經，有一個人為了得到美麗的蝴蝶，便買來一雙跑鞋、一隻網子，穿上運動服，追逐奔跑了許久，終於在氣喘吁吁、滿頭大汗中抓到幾隻。可是蝴蝶在網子裡恐懼掙扎，絲毫沒有美麗可言，一有機會蝴蝶就會飛走，這就叫「追求」。另一個人也很喜歡蝴蝶，他買來幾盆鮮花放在窗臺，然後靜靜地坐在沙發上品著香茗，望著蝴蝶翩翩而來，心情猶如吸蜜的蝴蝶，這就叫「吸引」。「花若盛開，蝴蝶自來；人若精彩，天自安排。」


