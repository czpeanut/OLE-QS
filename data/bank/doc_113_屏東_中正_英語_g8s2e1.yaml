  group_stem: "(三)\n    Are you always trying to keep up with the latest fashion?\
    \ If so, you could be hurting our planet without even knowing it. Think about\
    \ the impact of one cotton T-shirt. Making one cotton T-shirt gives off about\
    \ 5kg of CO2. It also uses about 2,700 kg of water. The water is enough for one\
    \ person to drink at least eight cups every day for three-and-a-half years. That’s\
    \ partly because cotton needs lots of water to grow. Coloring the T-shirt also\
    \ needs water. The problem doesn’t end there. Fibers in the T-shirt that come\
    \ off in the washing can make their way to the oceans to kill fish and end up\
    \ on our plates.\n    Our dangerous love for fast fashion is killing the planet.\
    \ When we get to buy new clothes at lower prices, we don’t take care of our clothes.\
    \ After wearing them just a few times, we simply throw them away either because\
    \ we can’t stand wearing the same clothes again and again or because they are\
    \ out of fashion and we need to make room for new items. What happens then is\
    \ that 20,000 pounds of unwanted clothes are burned or trashed every second. If\
    \ there is not any change by 2050, fashion will take up a quarter of the world’s\
    \ carbon budget. It’s time for us to stop turning a blind eye to the costs of\
    \ fast fashion. Start to buy less, choose well, and make our clothes last.\n \
    \       impact 衝擊 cotton 棉花 fiber 纖維 dangerous 危險的 simply 簡單地 carbon budget 碳預算\
