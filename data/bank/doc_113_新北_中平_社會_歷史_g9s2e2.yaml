    | --- | --- | --- |

    | 開始參戰的原因 | 支援「斯拉夫兄弟」 | 德國毀約攻打國土 |

    | 結束參戰的原因 | ？ | 德國投降 |'
  options:
  - label: A
    content: 簽署凡爾賽條約，戰敗投降
  - label: B
    content: 國內共產政權成立，向同盟國議和
  - label: C
    content: 美國反對無限制潛艇政策，援助協約國
  - label: D
    content: 美國投下原子彈，敵國投降
- id: doc_113_新北_中平_社會_歷史_g9s2e2_s1_28
  section: 1
  number: 28
  type: single
  page: 2
  stem: 本文最可能被下列哪本書籍引用？
  options:
  - label: A
    content: 冷戰後的俄羅斯
  - label: B
    content: 俄國與共產革命
  - label: C
    content: 計畫經濟的前景
  - label: D
    content: 二次大戰與蘇聯
  group_stem: '※請閱讀短文後回答問題：

    蘇聯解體前，民生物資匱乏、貨幣超發嚴重，導致貨幣貶值，幾乎所有商品都出現短缺。

    蘇聯解體後，歷經兩次經濟轉型的陣痛。2004 年起，俄羅斯聯邦經濟開始起飛；2011 年，GDP 增長4.3％。擺脫了共產計畫經濟的俄羅斯人民，解放了生產力，並取得驚人的經濟發展成績。然而，近年出現不斷下滑的趨勢、多年出現負增長。故此後，經濟問題是俄羅斯政府在國內面臨的主要挑戰。

    （資料來源：改寫自陸南泉，俄羅斯經濟轉型30 年評析，2021 年。）                                【素養導向】'
