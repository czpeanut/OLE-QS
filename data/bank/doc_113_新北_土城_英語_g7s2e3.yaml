  group_stem: '(53~ 55)

    Cindy and Ken are Tucheng Junior High School teachers. They’re talking about school
    clubs.

    Cindy: Our basketball club is always popular with students. This year, about 80
    students join the basketball club.

    Ken: That’s nice, but __(53)__.

    Cindy: Why? Isn’t Mars a great coach?

    Ken: Mars can’t teach 80 students at the same time. That’s too hard and tiring.

    Cindy: I see. By the way, about 40 students are in the board game(桌遊) club. Sometimes
    they fight over some games.

    Ken: That’s too bad! We should teach them these board games are not going to make
    them fight but to help them _(54)__.

    Cindy: You can say that again. You know what? Students in the basketball club
    and the board game club make up half of our students.

    Ken: Wow, these two clubs are popular. We should get the cooking club ready quickly.
    Many students tell me they can’t __(55)__ to join it.

    Cindy: This is really good news.'
