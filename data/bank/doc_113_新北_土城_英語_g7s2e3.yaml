  group_stem: "(51~ 52)\n    King Midas was a powerful but greedy king. He spent his\
    \ day counting his gold, and at nights, he often dreamed of being richer. No matter\
    \ how much gold he had, it was never enough.\n    One day, when he was walking\
    \ in his beautiful garden, he met a satyr. The satyr was lost, so Midas took him\
    \ to his big house, treated him some food and took care of him. The next day,\
    \ Dionysus, the God of Wine, heard about this and let Midas make one wish because\
    \ Midas helped the satyr, his teacher and friend. The king said, “Gold! I want\
    \ everything I touch to turn into gold.”\n    The God of Wine didn’t think that\
    \ was a good idea, but he still gave him the power. King Midas couldn’t wait to\
    \ test out his new power. He then touched almost everything he saw in the castle,\
    \ and the things all turned into gold. He was so happy because he could be the\
    \ most richest man in the world.\n    However, something terrible happened. As\
    \ he sat down at the dining table to have a meal, the chair, the table, the drink,\
    \ the food turned into gold with his touch, too. “Oh, no!” cried the king. “I’ll\
    \ starve to death.” The worst of all, his daughter gave him a hug, and suddenly\
    \ she became gold, too. He then cried out, “Dionysus, please take away my power\
    \ and save my daughter!” The God heard this and made his second wish come true.\n\
