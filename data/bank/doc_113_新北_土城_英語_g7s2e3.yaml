  group_stem: '(48 ~ 50)

    Betty: Our teacher asked us a question today, “Should junior high schools ban
    cellphones?” What do you think?

    Freddy: In my opinion, students can’t use their phones at school.

    Betty: Do you mean during class or for the whole shool day?

    Freddy: The whole school day, I think. Students should hand in their phones in
    the morning and get them back when they go home.

    Betty: Why do you think so?

    Freddy: This way, students can focus better in classes. They also have more face-to-face
    interaction with classmates during breaks.

    Betty: But, what if they need to get hold of their parents?

    Freddy: Then, they just need to get permission, or teachers can make a phone call
    for them.

    Betty: I think it’s more important to treat students more like adults. After all,
    they are learning self-control in school life.

    Freddy: Well, in perfect condition, everyone would control themselves. But I think
    it’s hard for students to put down games and social media!

    Betty: That’s true. It’s not easy at all!

    ➢ ban 禁止 / hand in 繳交 / focus 專注 / interaction 互動 / permission 許可/ message 訊息
