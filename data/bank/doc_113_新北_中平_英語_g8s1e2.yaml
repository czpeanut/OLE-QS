  group_stem: '【29~31】

    Ever heard sleepwalking? People get up and walk around when they are still asleep.
    We called it sleepwalking. It is strange because their bodies are moving, but
    their minds are still asleep. Most people don''t have an experience of it but
    have interesting or scary imagination about it. So, what is sleepwalking and why
    does it happen?


    | When | What | Why | How |

    | :--- | :--- | :--- | :--- |

    | Sleepwalking usually happens in the first few hours of the night when a person
    is in a deep sleep. | People stop to talk, sit up, or even do simple tasks, but
    they are not awake. Many people don’t remember sleepwalking the next morning.
    | It’s not always clear to know the reason of sleepwalking, but it may be because
    of stress, poor sleep, or family history. | To prevent sleepwalking, people should
    try to relax before bed, stop using screens early, and have a safe and quiet sleep
    space. |


     scary 可怕的 imagination 想像 reason 理由stress 壓力space 空間'
