    is in a deep sleep. | People stop to talk, sit up, or even do simple tasks, but
    they are not awake. Many people don’t remember sleepwalking the next morning.
    | It’s not always clear to know the reason of sleepwalking, but it may be because
    of stress, poor sleep, or family history. | To prevent sleepwalking, people should
    try to relax before bed, stop using screens early, and have a safe and quiet sleep
    space. |


