  section: 2
  number: 37
  type: single
  page: 5
  stem: 從上文推測，在1936 ∼ 1967 年黑人旅行綠皮書發行期間，非裔美國人的處境為何？
  options:
  - label: A
    content: 消費能力不足
  - label: B
    content: 沒有工作的權益
  - label: C
    content: 旅行的自由受到限制
  - label: D
    content: 無法取得美國國民的身分。
  group_stem: '（三）

    2019 年奧斯卡獎最佳影片「幸福綠皮書」的上映，意外使1936∼1967 年間幫助非裔美國人旅行的黑人旅行綠皮書一書重見天日。

    美國在結束內戰、廢除奴隸制之後，仍有很多地方存在種族隔離的現象，黑人在這些地區駕車旅行會遇到各種麻煩，例如：旅館拒絕入住、車行拒絕修車、不准進入白人的公用廁所等。

    在此背景下，紐約郵遞員格林發動各地的郵遞員，提供黑人可以安全進出的旅店、餐館、商店等訊息。他將這些資訊集結成冊，為黑人旅行者提供安全的資訊，這本「綠皮書」成了每位非裔美國人出門必備的旅行指南。

    黑人旅行綠皮書一開始只有10 頁，原本提供的訊息只有紐約，後來逐漸擴大到全美國，甚至延伸到一些鄰國。1950 年代，全書頁數增加到80 頁，每年還會更新資訊。

    格林在1948 年版的綠皮書中寫道：「不久的將來，會有那麼一天，綠皮書停止發行的那一天，從那時起，我們這個種族在美國將享有平等的機會和權益。」'
