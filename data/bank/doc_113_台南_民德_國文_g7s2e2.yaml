  stem: 關於甲、乙兩首詩的內容，下列敘述何者最恰當？
  options:
  - label: A
    content: 兩首詩都是從第一人稱角度來陳述自身悲慘的狀況
  - label: B
    content: 兩首詩都以細膩的抒情手法描寫個人內心情緒變化
  - label: C
    content: 兩首詩都以對比手法呈現對社會現象的觀察和反思
