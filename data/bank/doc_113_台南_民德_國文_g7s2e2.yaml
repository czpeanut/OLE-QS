  group_stem: '(三)

    甲、「朱門酒肉臭，路有凍死骨。榮枯咫尺異，惆悵難再述」

    （注①朱門：借代為富貴人家。②榮枯：比喻人事的興衰、窮通。）

    （節選自杜甫〈京赴奉先縣詠懷五百字〉）

    乙、「我走在黑暗的小巷／沒有人看我一眼／我蹲在閃爍的陽光下／沒有人看我一眼／我躺在公園的椅子上／沒有人看我一眼／我暴斃在一家店鋪的門口／卻吸引成群看熱鬧的人」。

    （節選自鄭烱明 乞丐）'
