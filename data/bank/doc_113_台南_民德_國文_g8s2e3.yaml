  group_stem: "(四) 閱讀下文，回答第8-9 題\n\n①王黃門教子有方 ②坐客好議他人之短\n③王子敬少言謹慎 ④謝安深諳觀人之術\n  王黃門兄弟三人俱詣謝公，子猷、子重多說俗事，子敬寒溫而已。既出，坐客問謝公：「向三賢孰愈？」謝公曰：「小者最勝。」客曰：「何以知之？」謝公曰：「吉人之辭寡，躁人之辭多。推此知之。」\n\
    \  ——《世說新語．品藻》"
