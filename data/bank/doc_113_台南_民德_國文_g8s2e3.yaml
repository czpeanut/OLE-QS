- id: doc_113_台南_民德_國文_g8s2e3_s4_3
  section: 4
  number: 3
  type: single
  page: 5
  stem: 根據上文內容，下表為人數多寡與兵力強弱的的用兵原則，下列何者正確？
  options:
  - label: A
    content: '用兵法則：包圍敵軍 | 我軍 V.S. 敵軍：1 : 1 (相當)'
  - label: B
    content: '用兵法則：分散敵軍 | 我軍 V.S. 敵軍：1+1 : 1 (多1 倍)'
  - label: C
    content: '用兵法則：進攻敵軍 | 我軍 V.S. 敵軍：10 : 1 (10 倍)'
  - label: D
    content: '用兵法則：伺機力戰敵軍 | 我軍 V.S. 敵軍：5 : 1 (5 倍)'
  group_stem: "(二) 閱讀下文，回答第3-4 題\n\n    凡用兵之法，全國為上，破國次之；全軍為上，破軍次之；全旅① 為上，破旅次之；全卒②\
    \ 為上，破卒次之；全伍③ 為上，破伍次之。是故百戰百勝，非善之善者也；不戰而屈人之兵，善之善者也。\n    故上兵伐謀，其次伐交，其次伐兵，其下攻城。攻城之法，為不得已。修櫓④\
    \ 轒轀⑤ ，具器械，三月而後成；距闉⑥ ，又三月而後已。將不勝其忿，而蟻附之，殺士三分之一，而城不拔者，此攻之災也。\n    故善用兵者，屈人之兵，而非戰也；拔人之城，而非攻也；毀人之國，而非久也。必以全爭於天下，故兵不頓，而利可全，此謀攻之法也。\n\
    \    故用兵之法，十則圍之，五則攻之，倍則分之，敵則能戰之，少則能逃之，不若則能避之。故小敵之堅，大敵之擒也。\n注釋:① 旅:軍隊。 ② 卒:古代軍隊的編制，百人一組為卒。\
    \ ③ 伍:古代軍隊的編制，五人一組為伍。\n④ 櫓:古代的兵器。即大盾、大戟。 ⑤ 轒轀:音ㄈㄣˊ ㄨㄣ，古代攻城所用的四輪車。\n⑥ 距闉:積土為闉，以登城攻敵。闉，音一ㄣ，城門。\n\
    \               ——節錄自孫武《孫子兵法》"
