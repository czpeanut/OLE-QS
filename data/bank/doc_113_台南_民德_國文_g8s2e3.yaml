  - label: D
    content: 丁
  group_stem: "(五) 閱讀下文，回答第10 題\n\n  與其鼓吹建構美好的家庭圖像，不如積極鼓勵在不同樣貌的家庭型態中成長的成員述說自己的成長經驗、與家人相處的點點滴滴，以及家庭對於他（她）的意義、他（她）對家庭型態的體會。畢竟，特定的家庭結構已不再是家庭定義中最重視的要件，相互扶持、陪伴相依才是家庭的建構基礎，當家庭成員一起面對家庭中的事物，相互尊重、共同成長，這就是一個健康的家庭。\n\
    \                                                                            \
    \                           ——教育部《性別意識成長數位學習課程手冊》"
