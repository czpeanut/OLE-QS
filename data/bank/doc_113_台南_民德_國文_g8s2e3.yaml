  page: 6
  stem: 依據(乙)文，下列觀點的敘述，何者最恰當？
  options:
  - label: A
    content: 《紅樓夢》的療妒湯藥方，仍具有一定程度合理性
  - label: B
    content: 嫉妒是一種病態心理，應當研究發展相關藥方
  - label: C
    content: 人之所以嫉妒，乃源於父權社會中性別不平等
  - label: D
    content: 嫉妒最大的好處是能捍衛個人應有的權益
  group_stem: "(三) 閱讀下文，回答第5-7 題\n\n(甲)  寶玉道：「我問你，可有貼女人的妒病的方子沒有？」王一貼聽了，拍手笑道：「這可罷了！不但說沒有方子，就是聽也沒有聽見過！」寶玉笑道：「這樣還算不得什麼。」王一貼又忙道：「這貼妒的膏藥倒沒經過。有一種湯藥，或者可醫，只是慢些兒，不能立刻見效的。」寶玉道：「什麼湯？怎麼吃法？」王一貼道：「這叫做『療妒湯』，用極好的秋□一個，二錢冰糖，一錢陳皮，水三碗，□熟為度。每日清晨吃這一個□，吃來吃去就好了。」寶玉道：「這也不值什麼，只怕未必見效。」王一貼道：「一劑不效，吃十劑；今日不效，明日再吃；今年不效，明年再吃。橫豎這三味藥都是潤肺開胃不傷人的，甜絲絲的，又止咳嗽，又好吃。吃過一百歲，人橫豎是要死的，死了還妒什麼？那時就見效了。」說著，寶玉、焙茗都大笑不止，罵：「油嚼的舌頭。」王一貼道：「不過是閒著解午盹罷了，有什麼關係？說笑了你們就值錢。告訴你們：「連膏藥也是假的。我有真藥，我還吃了做神仙呢！有真的，跑到這裡來混？」\n\
    \                                                 ——《紅樓夢》／第八十回〈王道士胡謅妒婦方〉\n(乙)「嫉妒」一般認為是情感的獨占，具有排他性時的心理狀態，在權利、財富、榮譽、地位等面向，都不願讓別人超過自己。漢代鄒陽曾說：「女無美惡，入宮見妒；士無賢不肖，入朝見嫉」，這種心理男女都有，但解構「嫉妒」字詞，可從偏旁與字義，見其指涉多是女人病痛、帶有毒害，存在父權社會對女性不公，隱含男尊女卑的社會性。\n\
    \  「妒」既由慾而起，當私人慾望得不到滿足，慾火越燒越旺，如不能及時克制，烈焰升騰，往往會形成嚴重後果。有鑑於此，古人很早就想用藥物來消除這種病態心理。《山海經》曾舉不少療妒之品，「鴿鷓」（即黃鸝）便是其中一種藥方，唐代楊夔在〈止妒〉提及南朝梁武帝曾試用此方，「妒果減半」，但後世無人再用，應不足為憑。不過「醫者，意也」，所謂「意」就是醫生審症立方的思路，「療妒湯」表面上雖是王道士胡謅，卻仍可見《紅樓夢》作者斟酌尋思，用心良苦。「妒」乃因心想占有、求之不得而起，故使情緒鬱結不解，導致慾火薰心。既然心火熾熱，勢必消爍肺金，所以治法應滋潤心肺，解散鬱結。\n\
    \                                              ——改寫自常佃樵〈「療妒湯」是怎樣「胡謅」出來的〉"
