  group_stem: "二0 二五年幸福國中赴日本 埼玉縣春日部教育旅行活動說明暨報名表\n    一、目的：\n      (一)帶領學生教育旅行、體驗他國歷史文化、學習環境的差異性、增進學生國際視野。\n\
    \      (二)增進本校與埼玉縣春日部中學校姐妹校情誼。\n    二、參訪時間：預定114 年1 月25 日(六)至1 月30 日(四)，六天五夜。\n\
    \    三、報名辦法:\n      (一)報名對象：本校一、二年級學生，對本活動有興趣且能配合團體活動及行前課程。\n      備註：行前課程集合時間多在午休及課餘時間。\n\
    \      (二)領取報名表：幸福樓三樓教務處外領取，或本校網站下載。\n      (三)繳交地點：填寫完畢並請家長與導師簽名後，交至幸福樓三樓教務處。\n\
    \      (四)報名時間：即日起至113 年9 月13 日(五)12:40 止。\n    四、甄選：\n      (一)甄選日期與時間另發個別通知。\n\
    \      (二)甄選方式為口試(中、日、英文日常對話)。\n      (三)錄取：依口試成績擇優錄取(同分時二年級優先)。\n      (四)預計招收二十名學生，錄取名單公告教務處外並發紙本通知。\n\
    \    五、行程規劃:\n       (一) 暫定由桃園＜---＞東京(成田機場)進出。\n       (二) 參訪本校日本姊妹校：埼玉縣春日部中學校，並進行交流活動與入班學習。\n\
    \       (三) 行程包含：滑雪體驗、東京大型樂園，詳細行程以招標完成的行程為準。\n    六、注意事項：\n       (一)本活動為自費參與行程，費用約為五萬元（實際金額待招標後確定）。\n\
