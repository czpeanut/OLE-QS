  group_stem: "甲  少學琴書，偶愛閒靜，開卷有得，便欣然忘食。見樹木交蔭，時鳥變聲，亦復歡然有喜。常言五六月中，北窗下臥，遇涼風暫至，自謂是羲皇上人。意淺識罕，謂斯言可保。日月遂往，機巧好疎。緬求在昔，眇然如何！\n\
    \    疾患以來，漸就衰損，親舊不遺，每以藥石見救，自恐大分將有限也。汝輩稚小家貧，每役柴水之勞，何時可免？念之在心，若何可言！          \
    \                          ──節錄陶淵明〈與子儼等疏〉\n*小字典：羲皇上人：泛指上古時代的人。          意淺：思想單純。識罕：見識稀少。\n\
    \          機巧：逢迎取巧。疎:通「疏」，不熟悉。  眇然：渺茫的樣子。眇，音ㄇㄧㄠˇ。\n          大分：自然的分限，指壽命。\
    \            若何可言：有什麼話可說呢\n\n乙  葉公問孔子於子路，子路不對。子曰：「女奚不曰：『其為人也，發憤忘食，樂以忘憂，不知老之將至云爾。』」\
    \                                                         ──選錄《論語．述而》\n*小字典：葉公：楚國的大夫，封地在葉城，所以叫葉公。\
    \    不對：沒有回答。     奚不：何不。"
