    \    此次獲獎的《彼岸花盛開之島》是一部人類歷史反思的新作，以失去記憶的少女漂流到陌生的島嶼為起點，日本和臺灣間一個架空島嶼為舞臺,島上的文化與語言揉合日本與臺灣，由女性負責宗教祭祀、政治事務並司掌歷史，並存在僅有女性才能習得的語言。而李琴峰的其他作品中，也同樣有語言、國界、文化及性少數這幾個她所關切的核心主題。關於這本書,李琴峰說，她在創作中思考，有沒有可能幻想出一種跟當今政治體制等完全不同的一個世界，由女性的邏輯、由女性司掌的世界。她希望\
    \                                   。\n    李琴峰說，「彼岸花盛開之島」，彼岸花具有雙重意思，它是不會讓人感覺疼痛的麻醉劑，同時也是在加工後可變成毒品賣錢的，因此是雙重隱喻。同樣的道理，這座島嶼有光明面，也有其陰影的一面，將男性排除在宗教、政治體制這一點就是陰影面。\n\
    \    她說：「歷史不可能完美、人類所建構出的社會制度也不可能完美，包括我們現在生活的這個世界都不斷地在尋求改善或變革的契機，這座島嶼也走在變革的路上，雖然現在不那麼完美。」\n\
    \    這小說故事結局是光明的或灰暗的？她說，由讀者自由想像這座島嶼未來會是什麼樣子。\n                              ──參考自〈史上第一位獲獎的臺灣人：李琴峰《彼岸花盛開之島》〉"
