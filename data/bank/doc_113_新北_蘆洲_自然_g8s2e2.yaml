  section: 1
  number: 1
  type: single
  page: 1
  stem: 實驗室中有一瓶未知氣體，經測試發現該氣體的性質如下：甲：無色，乙：比空氣輕，丙：易溶於水，丁：可使溼潤的石蕊試紙呈藍色。試問該未知氣體最有可能是是什麼下列哪一種？
  options:
  - label: A
    content: $CO_{2}$
  - label: B
    content: $NH_{3}$
  - label: C
    content: $NO_{2}$
