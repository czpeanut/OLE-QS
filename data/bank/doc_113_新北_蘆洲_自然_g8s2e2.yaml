  section: 1
  number: 8
  type: single
  page: 1
  stem: '室溫下，小明分別配製甲、乙、丙三杯濃度皆為 0.1 M 的水溶液，其溶質種類與說明，如表所示。這三杯水溶液 pH 值的大小關係，應為下列何者？


    | 水溶液 | 溶質 | 說明 |

    | :---: | :---: | :---: |

    | 甲 | HCl | 強酸 |

    | 乙 | $NH_{3}$ | 弱鹼 |

    | 丙 | NaOH | 強鹼 |'
  options:
  - label: A
    content: 丙＞乙＞甲
  - label: B
    content: 甲＝乙＞丙
  - label: C
    content: 丙＝乙＞甲
  - label: D
    content: 甲＞乙＞丙。
