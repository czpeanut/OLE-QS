  type: single
  page: 2
  stem: 阿貴欲以下圖的方式進行酸鹼中和實驗，他以酚酞作為指示劑，將鹽酸溶液先置於錐形瓶中，再以滴管吸取氫氧化鈉水溶液進行實驗。則下列有關此實驗的敘述何者正確？
