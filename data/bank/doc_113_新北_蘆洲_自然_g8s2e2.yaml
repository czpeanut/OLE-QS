    labeled_by: ai
- id: doc_113_新北_蘆洲_自然_g8s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 關於濃硫酸的特性，下列何者不正確？
  options:
  - label: A
    content: 稀釋時為放熱反應
  - label: B
    content: 沸點高、腐蝕性強的無色液體
  - label: C
    content: 具有強脫水性，可使碳水化合物失去水分，形成黑色的碳
  - label: D
    content: 打開濃硫酸的瓶蓋時，常可看見白色煙霧狀的酸霧。
