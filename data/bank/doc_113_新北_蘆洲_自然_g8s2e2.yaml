- id: doc_113_新北_蘆洲_自然_g8s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: '桌上有三杯無色溶液甲、乙、丙，已知其中有酸性溶液、鹼性溶液及酚酞指示劑。小明取出部分溶液做了以下測試，結果如下表，則可推測丙溶液應為下列何者？


    | 混合溶液 | 甲＋乙 | 甲＋丙 | 乙＋丙 |

    | :--- | :---: | :---: | :---: |

    | 溶液顏色 | 紅色 | 無色 | 無色 |'
  options:
  - label: A
    content: 酸性溶液
  - label: B
    content: 鹼性溶液
  - label: C
    content: 酚酞指示劑
  - label: D
    content: 無法推斷。
