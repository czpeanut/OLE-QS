- id: doc_113_新北_蘆洲_自然_g8s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 將大理石碎塊投入盛有稀鹽酸的燒杯中，會發現有大量氣泡冒出，同時碎塊漸漸變小。關於此現象的敘述，下列何者正確？
  options:
  - label: A
    content: 收集所冒出的氣體以點燃的線香試驗，會燒得更旺盛
  - label: B
    content: 大理石消失在鹽酸中為溶解的現象，是一種物理變化
  - label: C
    content: 將冒出的氣體通入澄清石灰水中，澄清石灰水會變成白色混濁狀
  - label: D
    content: 這些冒出的氣體，主要成分是氫氣。
  tags:
