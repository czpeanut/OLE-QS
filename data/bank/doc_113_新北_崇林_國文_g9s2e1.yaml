- id: doc_113_新北_崇林_國文_g9s2e1_s2_21
  section: 2
  number: 21
  type: single
  page: 2
  stem: 「你的靈魂是一本書，你的行為像是寫東西。除了好的話之外，不要寫別的東西在你的靈魂上。因為筆在你的手裡。」這段文字在期許我們什麼？
  options:
  - label: A
