  group_stem: '成王與唐叔虞燕居①，援梧桐葉以為珪②，而授唐叔虞曰：「余以此封汝。」叔虞喜，以告周公。周公以請③曰：「天子其封虞邪？」成王曰：「余一人與虞戲也。」周公對曰：「臣聞之，天子無戲言。天子言，則史書之，工誦之，士稱之。」於是遂封唐叔虞於晉。周公旦可謂善說矣，一稱而令成王益重言，明愛弟之義，有輔王室之固。

