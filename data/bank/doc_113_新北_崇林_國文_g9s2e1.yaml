  section: 2
  number: 20
  type: single
  page: 1
  stem: 根據上文，下列敘述何者正確？
  options:
  - label: A
    content: 富和尚對窮和尚說：「子何恃而往？」帶有羨慕讚嘆的語氣
  - label: B
    content: 「吾一瓶一缽足矣。」這句的主語是富和尚
  - label: C
    content: 窮和尚最終能到達南海，證明了篤志力行事能成的道理
  - label: D
    content: 富和尚證明了社會階級是無法被改變的道理。
  group_stem: 蜀之鄙有二僧，其一貧，其一富。貧者語於富者曰：「吾欲之南海，何如？」富者曰：「子何恃而往？」曰：「吾一瓶一缽足矣。」富者曰：「吾數年來欲買舟而下，猶未能也。子何恃而往！」越明年，貧者自南海還，以告富者，富者有慚色。西蜀之去南海，不知幾千里也，僧之富者不能至而貧者至焉。人之立志，顧不如蜀鄙之僧哉?
  lesson_raw:
    title: 為學一首示子姪
    basis: 選自清代彭端淑〈為學一首示子姪〉
