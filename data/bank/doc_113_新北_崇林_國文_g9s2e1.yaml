  - label: D
    content: 熱氣球飛行的原理之一是加熱球皮內空氣，使氣體分子受熱後密度增加，便會產生浮力。
  group_stem: "請閱讀下面文章，並回答45～46 題：\n  1782 年，法國造紙商孟戈菲兄弟發明了熱氣球。他們的靈感從何而來？1777 年，孟戈菲兄弟在火爐上晾乾衣服時，發現衣服會不斷鼓起並且翻騰向上。而後，他們便開始嘗試製作熱氣球。\n\
    \  首先，他們用木條編成長方體籃子，並於四周貼上綢緞，於底部點火後，籃子便上升至天花板。接著，他們開始製作更大型的熱氣球，這次，依然成功升空，而後，他們持續加大其體積，並且改變形狀，從原先的長方形變成球狀。1783\
    \ 年，成功將體積 790 立方公尺的熱氣球升上兩千公尺的高空，同年 9 月，他們成功讓一顆更大的熱氣球升到 5 百公尺高，並在空中停留了 8 分鐘之久，甚至當時熱氣球上還裝載著羊、鴨子與公雞，這個升空實驗證明了\
    \ 5 百公尺的高空並無缺氧之虞，可以利用熱氣球載著人類飛行。\n  今日的熱氣球飛行的原理究竟是什麼呢？其實正是透過飛行員間歇性的操作燃燒器來加熱球皮內空氣、產生上升的動力來源。當氣體分子受熱，體積膨脹、密度減少，便會產生浮力。\n\
    \  然而熱氣球並不是能被人為「駕駛」的，而僅僅是「隨風飛行」。正因如此，熱氣球飛行的氣候條件十分嚴苛，倘若風速過快、下雨、天氣太熱等等，都不適合熱氣球飛行。一般而言，地面風速小於\
    \ 7 節，無雨，溫度不超過攝氏 32 度以上，會比較適合熱氣球飛行。\n~改寫自泛科學〈人類首次熱氣球飛行〉"
