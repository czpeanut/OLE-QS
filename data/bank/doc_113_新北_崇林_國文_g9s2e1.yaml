  section: 3
  number: 41
  type: single
  page: 3
  stem: 根據甲文，下列句子的主語判斷何者正確？
  options:
  - label: A
    content: 請問姓氏─狐仙
  - label: B
    content: 禹步作咒─秀才
  - label: C
    content: 入室取用─秀才
  - label: D
    content: 頗懟其誑─狐仙。
  group_stem: '請閱讀下面文章，並回答41～44 題：

    (甲)

    濱州一秀才，讀書齋中。有款門者，啟視，則皤然①一翁，形貌甚古。延之入，請問姓氏。翁自言：「養真，姓胡，實乃狐仙。慕君高雅，願共晨夕。」秀才故曠達，亦不為怪。遂與評駁今古，翁殊博洽，鏤花雕繪②，粲於牙齒③;
    時抽經義④，則名理湛深，尤覺非意所及。秀才驚服，留之甚久。

    一日，密祈翁曰：「君愛我良厚。顧我貧若此，君但一舉手，金錢宜可立致。何不少為周濟？」翁默然，似不以為可。少間，笑曰：「此大易事。 但須得十數錢作母」。生如其請。翁乃與共入密室中，禹步⑤作咒。俄頃，錢有數十百萬，從梁間鏘鏘而下，勢如驟雨，轉瞬沒膝；拔足而立，又沒踝。廣丈之舍，約深三四尺餘。乃顧語秀才：「頗厭君意否？」曰：「足矣。」翁一揮，錢即驟然而止。乃相與扃戶出。秀才竊喜，自謂暴富。頃之，入室取用，則滿室阿堵物皆為烏有，惟母錢十余枚寥寥尚在。秀才失望，盛氣向翁，頗懟其誑。翁怒曰：「我本與君文字交，不謀與君作賊！便如秀才意，只合尋梁上君交好得，老夫不能承命！」遂拂衣去。

    ~《聊齋志異‧雨錢》

    注釋：

    ① 皤然：鬚髮皆白的樣子。 ② 鏤花雕繪：比喻藻飾詞語。

    ③ 粲於牙齒：意謂談吐美雅，如百花粲麗。

    ④抽經義：闡發儒家經書的義理。⑤禹步：跛行，作法的步法

    (乙)

    河津 暢體元，字汝玉。為諸生時，夢人呼為「五羖大夫」，喜為佳兆。及遇流寇之亂，盡剝其衣，閉置空室。時冬月，寒甚，暗中摸索，得數羊皮護體，僅不至死。值明，視之，恰符五數。啞然自笑神之戲己也。後以明經授雒南知縣。畢載績先生志。

    ~《聊齋志異‧五羖大夫》'
