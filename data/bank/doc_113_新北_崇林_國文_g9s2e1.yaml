- id: doc_113_新北_崇林_國文_g9s2e1_s3_49
  section: 3
  number: 49
  type: single
  page: 4
  stem: 根據上文，下列敘述何者最恰當？
  options:
  - label: A
    content: 伯牙最喜歡於高山上和流水旁彈琴，鍾子期總能共赴山水同樂
  - label: B
    content: 當伯牙從大自然聲音汲取靈感創作，鍾子期就會與之唱和
  - label: C
    content: 不論伯牙彈奏任何一首曲子，鍾子期每一次都能猜中曲名
  - label: D
    content: 伯牙彈琴時所表達旳情感，鍾子期總能解其意，是伯牙的知音。
  group_stem: '請閱讀下面文章，並回答49～50 題：

    伯牙善鼓琴①，鍾子期善聽。伯牙鼓琴，志在登高山，鍾子期曰：「善哉！峨峨②兮若泰山！」志在流水，鍾子期曰：「善哉！洋洋③兮若江河！」伯牙所念，鍾子期必得之。伯牙游於泰山之陰，卒④逢暴雨，止於巖下，心悲，乃援琴而鼓之。初為霖雨之操⑤，更造崩山之音。曲每奏，鍾子期輒窮其趣。伯牙乃舍琴而嘆曰：「善哉!善哉!子之聽夫！志想象猶吾心也。吾於何逃聲哉？」

    ~《列子‧湯問》

    注釋：

    ① 鼓琴：彈琴。② 峨峨：高聳的樣子。

    ③ 洋洋：水勢盛大的樣子。④卒：突然。⑤操：琴曲。'
