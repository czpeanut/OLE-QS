- id: doc_111_新北_崇林_社會_g8s2e1_s1_18
  section: 1
  number: 18
  type: single
  page: 3
  stem: 根據上述四則資料得知：
  options:
  - label: A
    content: 剛開始接觸西方觀點的人們，為鼓勵兒童探索內心世界，多翻譯關於美學與藝術哲學的作品
  - label: B
    content: 周作人翻譯 「賣火柴的女兒」，以白話文寫作，搭配新式標點符號，並加入自己的想法
  - label: C
    content: 當時的兒童文學翻譯雖仍以「成人本位」為主，但不失為現代兒童文學的發展與創作打下良好基礎
  - label: D
    content: 周作人的作品大都刊登於《新青年》，他認為兒童是「縮小的大人」
  group_stem: '資料一

    隨著清末民初「成人本位」兒童觀的鬆動，人們「發現」了兒童的重要性，認為他們是國家民族的希望與未來，其「未來國民」身份得到充分肯定。由於兒童觀的轉變，兒童從「縮小的成人」成為「未來國民」，人們在關注成人文學的同時也將目光投向「未來國民」，開始有目的地翻譯介紹外國兒童文學作品。

    資料二

    清末民初的兒童文學翻譯在主觀上並不是為滿足兒童閱讀需求，而是為了實現向其灌輸愛國主義思想、啟發童智…等目的。這一時期，蕩漾著愛國熱情和崇尚民族氣節的兒童文學翻譯作品非常盛行。這些作品多鼓勵兒童樹立遠大志向，極力鞭策其愛國之心，企圖把救國重任寄託於朝氣蓬勃的兒童身上。此外，當時的先進人士還鼓勵兒童學習科學知識，1900～1907
    年掀起了一股科學小說翻譯介紹的熱潮，迎合了當時「啟發童智」之民族文化心理。

    資料三

    周作人是最早介紹安徒生作品給中國讀者的翻譯家之一，且非常認真研究兒童心理與兒童文學，認為童話翻譯不是為了傳統的「文以載道」，而是為了他所提倡的「承認兒童的世界」。民國
    8 年 1 月，周作人在《新青年》發表安徒生童話名作「賣火柴的女兒」（今譯《賣火柴的小女孩》），以白話文呈現，搭配新式標點符號，內容力求忠實，譯者不擅自加入自己的意見。  【註：文以載道—文章是用來闡述聖賢之道的】

    資料四

    民國9 年10 月26 日周作人於北京孔德學校演講〈兒童的文學〉，後發表於《新青年》，內容提到：「以前的人對於兒童多不能正當理解，不是將他作縮小的成人，拿『聖經賢傳』盡量的灌下去，便將看作不完全的小人，說小孩懂得什麼？一筆抹殺，不去理他。」，周作人有意識地宣揚「兒童」的發現與認識，為這場兒童文學改革拉開序幕。'
