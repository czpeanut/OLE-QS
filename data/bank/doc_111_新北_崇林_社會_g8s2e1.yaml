- id: doc_111_新北_崇林_社會_g8s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: '袁世凱的野心，使清朝加速滅亡，但也開啟混亂的民初時期。袁世凱過世時，有人寫了副輓聯：「袁世凱千古，中華民國萬歲」。上下聯字數不同，其寓意為袁世凱『對不起』中華民國。     【註：千古—哀悼死者的話，為永別的意思。】

    請問：請問：此對聯主要在譴責袁世凱的哪一項行為？'
  options:
  - label: A
    content: 解散國會，廢除臨時約法
  - label: B
    content: 鎮壓革命黨，逼迫溥儀退位
  - label: C
    content: 破壞民主，妄圖洪憲帝制
  - label: D
    content: 可能指使暗殺國民黨代理理事長宋教仁
  tags:
