- id: doc_111_新北_崇林_社會_g8s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: '……本雜誌所說的都是極平常的話，社會卻八面非難。要擁護那德先生，便不得不反對孔教、禮法、貞節、舊倫理、舊政治。要擁護那賽先生，便不得不反對舊藝術、舊宗教；……只因為擁護德先生和賽先生，才犯了破壞孔教，破壞國粹的大罪。……我們現在認定只有這兩位先生可以救治中國政治、道德、學術、思想上一切的黑暗。若因為擁護這兩位先生，一切政府的迫害，社會的攻擊笑罵，就是斷頭流血，都不推辭。

    根據上文分析判斷，請問：下列那篇文章不可能刊登在此本雜誌裡？'
  options:
