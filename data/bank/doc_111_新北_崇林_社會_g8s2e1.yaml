- id: doc_111_新北_崇林_社會_g8s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: '《國父們》一書中提到，除了孫中山以外，新中國的創立還需要仰賴許多人的努力。論才，當屬宋教仁；論功，當屬黃興。倘若沒有他們深謀遠慮、運籌帷幄，則新中國不可能誕生。最後在這群人拋頭顱灑熱血的貢獻下，我們才能看到一個有別於過往的新中國的出現。這群國父們最初在討論新中國的革命應該從中國何地開始，當時有三種方案：

    第一，直搗黃龍從北京開始；第二，從長江流域開始，拿下中國富庶的經濟命脈；第三，從邊陲開始，先拿下兩廣，也方便革命志士運送軍火及人員物資。

    請問：最後，歷史的走向為引文中哪一方案？'
  options:
  - label: A
    content: 第一種
  - label: B
    content: 第二種
  - label: C
    content: 第三種
  - label: D
    content: 非文中的三種方案
  tags:
