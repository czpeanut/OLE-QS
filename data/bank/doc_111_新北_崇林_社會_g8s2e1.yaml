  type: single
  page: 2
  stem: '我孫文雖暫時旅居海外，但依然對中國的情勢感到憂慮，如果袁氏繼續堅持下去，則中華民國將不保。我既然主張討伐，正在和其他的革命友人一起積極尋找一個有效的辦法，能阻止這件事的發生。

    請問：此事件的發展為何？'
