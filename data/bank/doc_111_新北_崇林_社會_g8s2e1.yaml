- id: doc_111_新北_崇林_社會_g8s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 下面四位同學的敘述中，何者不符合清末民初『新女性』的特質？
  options:
  - label: A
    content: 芳芳 陳麗華、張佩芬和趙君默三人，在北京創立了中國女子商業儲蓄銀行，以提倡女子職業、促成女子經濟獨立為宗旨
  - label: B
    content: 小梅 年輕時的張幼儀嫁給徐志摩後，恪守婦女的三從四德，在夫家奉養公婆、相夫教子。
  - label: C
    content: 惠惠 參與天津學生聯合會的鄧穎超，帶領女同學參加五四運動大遊行請願。
  - label: D
    content: 小真 「鑑湖女俠」秋瑾離婚後，赴日本留學並加入革命組織，回國後創辦《中國女報》與明道女子學堂。
