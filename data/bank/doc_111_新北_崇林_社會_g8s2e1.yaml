  stem: '中國代表之拒絕簽約，曾正式通告路透社。在巴黎和會中未受人注意的中國代表團發文解釋，不簽字之理由，是關於□問題之解決殊欠公允。中國向各國出席代表提出抗議，和會決議將□的權益讓與○繼承，已引起全國抗議，中國政府為輿情一致反對之故，被迫拒絕接受和約之□條款。（巴黎二十八日路透社電）

    有關此篇報導下列哪些敘述錯誤？ (ㄅ)此篇報導的背景為一戰結束 (ㄆ)中國政府因東北問題而拒絕簽約 (ㄇ)內文中提及的全國抗議是指五四運動 (ㄈ)還我青島、打倒孔家店，成為當時輿論的重要訴求(ㄉ)和會決議將□的權益讓與日本。'
  options:
