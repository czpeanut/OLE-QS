- id: doc_111_新北_崇林_社會_g8s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '我翻開歷史一查，這個歷史沒有年代，歪歪斜斜的每頁都寫著「仁義道德」幾個字，我橫豎睡不著，仔細看了半夜，才從字縫裡看出字來，滿本都寫著兩個字是「吃人」！
    資料來源:節錄自《狂人日記》

    有關這段文字，何者敘述正確？'
  options:
  - label: A
    content: 這是陳獨秀發表於《新青年》的白話文小說
  - label: B
    content: 此書的內容與當時流行的口號「打倒孔家店」正好相互矛盾
  - label: C
    content: 此書應成書於清末時期，暗諷許多參與革命的狂人行徑
  - label: D
    content: 此書諷刺中國傳統的「仁義道德」是「吃人」的禮教
  tags:
