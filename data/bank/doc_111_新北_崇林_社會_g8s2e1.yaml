- id: doc_111_新北_崇林_社會_g8s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 下面四位同學的發言，誰描述的時代背景最早？
  options:
  - label: A
    content: 阿宏 國家對外居然不能爭取主權，放任列強將我國領土割讓給日本，我們要上街抗議政府如此無能。
  - label: B
    content: 耀耀 我主張找回各種留學西方、日本的專業教師，如胡適、李大釗、辜鴻銘等來到學校任教，並以「德先生」、「賽先生」作為辦學宗旨。
  - label: C
    content: 寧寧 中國已經被萬惡的儒家思想綁架數千年，應該要引進其他西方思想，像共產主義就頗適合在中國嘗試。
  - label: D
    content: 小毅 日本利用世界戰爭的局勢趁機對德宣戰並侵占我國領土，實在可惡。
