- id: doc_111_新北_崇林_社會_g8s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 清末，朝野人士面對外力的衝擊，提出不少意見。下面那個標語最有可能是「梁啟超」的言論？
  options:
  - label: A
    content: 治國之道，在乎自強，而審時度勢，則自強以練兵為要，練兵又以制器為先。
  - label: B
    content: 驅逐韃虜，恢復中華，創建民國，平均地權。
  - label: C
    content: 民主革命善於破壞，中國已有東亞病夫之名，不堪服猛劑以招危亡。英、日兩國皆以君主立憲而強，可資借鏡。
  - label: D
    content: 不甘心滿州人滅我們的國，主我們的政，定要撲滅他的政府，光復我們的民族國家。
