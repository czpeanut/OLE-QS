  type: single
  page: 2
  stem: '物的花色是由一對等位基因所控制，黃色為顯性，白色為隱性。依照孟德爾的遺傳法則預測其子代可能出現的表現型，整理成附表，在不考慮突變的情況下，表中哪一組的預測最不合理？


    | 組別 | 親代表現型 | 子代表現型的預測 |

    | :---: | :---: | :---: |

    | 甲 | 黃花 $\times$ 黃花 | 白花 |

    | 乙 | 白花 $\times$ 黃花 | 黃花 |

    | 丙 | 黃花 $\times$ 白花 | 白花 |

    | 丁 | 白花 $\times$ 白花 | 黃花 |'
  options:
  - label: A
    content: 甲
