- id: doc_113_台北_仁愛_自然_g8s1e3_s1_39
  section: 1
  number: 39
  type: single
  page: 4
  stem: 鑀的同位素多達19 種，在這些同位素中，何者存留時間最長、最穩定，半衰期為471.7 天？
  options:
  - label: A
    content: $^{252}_{99}\mathrm{Es}$，原子序為99，中子數為153
  - label: B
    content: $^{252}_{99}\mathrm{Es}$，原子序為99，電子數為153
  - label: C
    content: $^{253}_{99}\mathrm{Es}$，原子序為253，中子數為99
  - label: D
    content: $^{253}_{99}\mathrm{Es}$，原子序為253，質子數為99
  group_stem: '西元1952 年，美軍進行第一次大規模氫彈試爆，在這次的爆炸殘骸中，發現了第99 號元素「鑀」（Einsteinium）。

    鑀元素位於元素週期表第七週期的錒系元素，為一種柔軟的銀白色金屬，是第七個超鈾元素。超鈾元素指的是原子序大於92（鈾）的重元素，皆具有放射性，由於半衰期較短（某些原子經過放射性衰變之後，其數目減半所需的時間），在自然界中穩定存在的量不多，大多都是以人工合成的方法發現的，僅有少數原子序較小的超鈾元素是自然生成，例如：鈽、錼、鉲等。直至今日人們對鑀的理解仍然不深，已知鑀共有19
    種同位素（週期表中，具有相同的原子序，卻有不同質量數之原子），其中鑀-252（$^{252}_{99}\mathrm{Es}$）是存留時間最長、最穩定的同位素，半衰期為471.7
    天；鑀-253（$^{253}_{99}\mathrm{Es}$）半衰期為20.47 天。

    鑀元素不能像鈾礦一樣可由自然物質裡取得，其人工合成製程也十分困難，標準的作法是使用大量中子撞擊鋦原子，進行一連串核融合以合成鑀。因為鑀原子非常不穩定，沒多久就會衰變為原子序較小的元素，因此科學家要合成夠多的鑀原子，須在鑀元素衰變前進行所有實驗。'
  answer:
  - A
  answer_source: answer_key_vlm
