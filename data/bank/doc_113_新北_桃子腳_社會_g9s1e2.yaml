- id: doc_113_新北_桃子腳_社會_g9s1e2_s2_26
  section: 2
  number: 26
  type: single
  page: 3
  stem: 文中所敘述的生態危機，現今也發生在下列哪些地區？(甲)南洋群島(乙)阿拉伯半島(丙)剛果盆地(丁)日本群島
  options:
