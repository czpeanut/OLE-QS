    content: 甲乙
  - label: B
    content: 丙丁
  - label: C
    content: 甲丙
  - label: D
    content: 乙丁
  group_stem: '【題組一】請閱讀下文，回答26 題至27 題：

    近年來，巴西境內的亞馬孫雨林頻繁發生大火，尤以2018 年為甚，至少有100 萬公的雨林地毀於大火，不但波及鄰國，例如玻利維亞、委內瑞拉，雨林內的特有動植物也面臨浩劫。根據研究，亞馬孫雨林的大火多數是人禍而非天災導致，追求經濟利益乃是禍首。

    中南美洲各國現今仍有不少國家，仰賴大量出口單一農產品及礦產獲利。雨林內的珍貴物種，例如桃花心木、巴西紫檀等，因在國際市場上深受喜愛而盜伐猖獗。盜伐者將樹幹伐走後，隨地留下沒有經濟價值的枝葉，一旦發生火災，乾枯的枝葉便成為助燃物。

    此外，畜牧業也是中南美洲許多國家的經濟命脈之一，阿根廷與巴西均為世界肉類重要出口國；為了尋求牧地或擴大規模，畜牧業者在亞馬孫雨林開闢了規模動輒數十萬公頃的牧場，而放火燒林是最快速的整地方式。而巴西農民也開闢遼闊的雨林種植大豆及其他作物。農牧場業者富甲一方，政商關係良好，濫墾濫伐，導致雨林面臨消失的危機。'
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 地理
      code: 4-1
      title: 自然環境
      chapter: 第4章 中南美洲
    textbook: 九上地理 4-1 自然環境
    labeled_by: ai
