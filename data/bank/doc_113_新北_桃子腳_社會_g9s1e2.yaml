  stem: 真好喝飲料店生意興隆，店門口大排長龍，老闆因此決定將每項飲品調漲10 元。價格調漲後，許多客人轉而買其他家的飲料，銷售量大幅衰退，老闆只好推出折扣優惠，變相恢復原價。下列何項敘述最能反映此一現象？
