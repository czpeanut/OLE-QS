- id: doc_113_新北_桃子腳_社會_g9s1e2_s2_49
  section: 2
  number: 49
  type: single
  page: 5
  stem: 關於電動車產業，下列敘述何者正確？
  options:
  - label: A
    content: 美國在電動車產業，相較中國更具有優勢
  - label: B
    content: 美國廠商生產電動車的機會成本比中國廠商高
  - label: C
    content: 中國的電動車市場大打價格戰，對消費者有利
  - label: D
    content: 若依新的關稅政策進口中國電動車，美國消費者將能買到更便宜的產品
  group_stem: '【題組五】請閱讀下文，回答49-50 題

    華爾街日報：拜登有「綠色產業夢」

    華爾街日報的社論中指出，作為一個經常不遵守全球規則的對手，針對中國偷竊智慧財產權等作法實施針對性的貿易政策有其道理。不過值得注意的是，名列拜登提升關稅清單的大多數中國商品並非國防所需、也不構成安全風險，拜登的主要目的是為了減輕氣候政策所造成的經濟和政治損害。或者換個更形象的說法，拜登的關稅政策是為了實現他的「綠色產業夢」。

    以電動車來說，習近平利用補貼等作法將中國變成世界領先的電動車生產大國，但電動車的產能過盛造成國內市場大打價格戰，歐美國家更擔憂中國會將低價電動車傾銷國外，打擊本土電動車產業。當前美國對電動車的需求出現疲軟，這導致美國的製造商縮減生產規模，如果此時對中國的低價電動車門戶大開，已經被迫裁員、甚至每造一輛電動車就虧10
    萬美元的美國電動車產業恐怕不妙。

    〈解析美中貿易戰：拜登川普的關稅壁壘有何不同？〉，《風傳媒》'
