- id: doc_113_新北_桃子腳_社會_g9s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: '有一首打油詩可以讓大家快速的認識這一位人物：「結婚六次，一死一活，兩個離婚，兩個砍頭。」他的婚姻危機也是點燃英格蘭宗教改革的大火。自立為宗教領袖，宣布自己原本的婚姻無效；在經歷六段婚姻後，終於產下王位繼承人；請問此人是？

    (本題內容選自桃子腳中圖國際館藏，吳宜蓉《歐美近代史原來很有事》一書，P96)'
