  type: single
  page: 2
  stem: 迦納是全球僅次於象牙海岸的可可豆產國，供應量占全球的1/5，每年靠出口可可豆創造20億美元營收，但與全球巧克力市場營收超過1千億美元相比連1/50都不到。迦納副總統巴伍米亞（Mahamudu
    Bawumia）表示：「石油輸出國組織（OPEC）只控制全球30％到40％的石油供應量，卻能主導油價。假設產油國有OPEC，我們也該有COPEC（可可豆輸出國組織）。」（工商時報2019.12.29）
    請問：為何西非國家控制世界70%的可可豆生產，農民卻依舊貧困？
  options:
  - label: A
    content: 西方大企業操控產品價格
  - label: B
    content: 可可豆的價值極低
  - label: C
    content: 缺乏生產巧克力關鍵技術
  - label: D
    content: 戰亂頻繁生產量少。
