- id: doc_113_屏東_明正_自然_g7s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 郝明正的阿嬤因牙齒不好喜歡吃豬肉中的肥肉，並且常常吃很多肥肉，把瘦肉渣吐出,造成營養攝取不均衡。這樣會造成哪種營養素攝取過多?哪種過少？
