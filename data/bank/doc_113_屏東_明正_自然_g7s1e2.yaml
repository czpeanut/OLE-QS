  - label: A
    content: 醣類、蛋白質
  - label: B
    content: 蛋白質、脂質
  - label: C
    content: 脂質、醣類
  - label: D
    content: 脂質、蛋白質。
  group_stem: ※ 郝明正最喜歡吃了，這一天吃到飽的樹葉火鍋店開幕五折優惠，明正一家人趁機去吃午餐，店裡蔬果肉類應有盡有，大家吃到很高興。明正也趁機複習食物和上課有關養分、消化和循環的內容，接下來便是一連串的相關問題。請同學們仔細閱讀題幹，選出最適合的答案。
