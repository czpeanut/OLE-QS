  stem: '閱讀下列敘述後，回答問題：中國古代的計算方法是「籌算」，籌算的計算工具叫「算籌」，之後發明算盤，其計算方法稱為「珠算」。明代之前，中國數學的計算方法主要還是以籌算為主，到了明代，數學家程大位著算法統宗，書中詳述了算盤的操作口訣，再加上當時著重商業算術，且算盤在攜帶和操作上都比算籌方便，因此逐漸取代了算籌，後來珠算便成為主要的計算方法。


