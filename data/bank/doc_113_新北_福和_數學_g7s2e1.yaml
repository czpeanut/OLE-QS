- id: doc_113_新北_福和_數學_g7s2e1_s1_20
  section: 1
  number: 20
  type: single
  page: 3
  stem: '自 2019 年起，美食外送服務平臺興起，後來隨著新冠疫情逐漸擴散，外送員在社會中扮演的角色就更加重要，他們滿足了人們對食品和貨物的便利需求。外送員的收入主要是以送單的數量與獎勵金為主，根據
    2023 年人力銀行公布，外送員每月的收入大約落在 3 萬到 4 萬之間。


    有一個外送平臺以外送件數來計薪，且收入每週結算一次，以下是此外送平臺的計薪方式：


    | 訂單件數 | 每件訂單薪資（元） | 每件訂單獎勵金（元） |

    | :--- | :---: | :---: | :--- |

    | 第 1 件到第 50 件 | 30 | 0 |

    | 第 51 件到第 100 件 | 30 | 10 |

    | 第 101 件到第 200 件 | 30 | 15 |

    | 第 201 件以上（含） | 30 | 20 |


    若小夫上週總共送了 120 件訂單，我們來計算他上週的收入是多少元？

    120 件訂單的薪資為

    $120 \times 30 = 3600$（元）

    120 件訂單的獎勵金為

    $100 - 50 = 50$

    $50 \times 10 = 500$（元）

    $120 - 100 = 20$

    $20 \times 15 = 300$（元）

    因此，小夫上週的收入為

    $3600 + 500 + 300 = 4400$（元）。


    如果此外送平臺將每件訂單薪資與每件訂單獎勵金調整如下表，


    | 訂單件數 | 每件訂單薪資（元） | 每件訂單獎勵金（元） |

    | :--- | :---: | :---: |

    | 第 1 件到第 100 件 | $x$ | 0 |

    | 第 101 件以上（含） | $x$ | $y$ |


    若宗賢上週共送了 200 件訂單，領到 18000 元；念慈上週共送了 160 件訂單，領到 14000 元，求每件訂單的薪資為何？(1-3)'
