  - label: D
    content: 天天不時、地不利，非不善戰。
  group_stem: '拿破崙西征俄羅斯時遇到兩股無法征服的力量，一是俄羅斯的嚴冬，二是與嚴冬同樣無情的俄羅斯人民，他們不屈不撓、誓死捍衛疆域，這股蠻勁連同寒冬都孕育自俄羅斯這塊土地，唯有真正的強者，才能熬過成千上百個俄羅斯的寒冬。安東尼·伯吉斯的小說拿破崙交響曲，就是描寫俄羅斯的隆冬如何打敗法國的皇帝，伯吉斯憑著一枝令人自嘆弗如的健筆，寫活了俄羅斯的氣候與地景；那片廣袤的大地既不能給人安慰也不能讓人掩蔽，那一片望無垠的空蕩感逼著來犯的敵軍，縱使驍勇如拿破崙也只能撤軍。

    （節錄自教你讀懂文學的27堂課）'
