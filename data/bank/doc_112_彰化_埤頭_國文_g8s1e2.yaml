  group_stem: '余少時，聞曹敞在吳章門下，往往好斥人過，或以為輕薄，世人皆以為然。章後為王莽所殺，人無有敢收葬者。弟子皆更易姓名，以從他師。敞時為司徒掾，獨稱吳門弟子，收葬其尸，方知亮者不見容於冗輩中矣。

