  stem: '「「吳人有養猿於籠十年，憐而放之，信宿（1）而輒歸，曰：『未遠乎？』昇（2）而舍（3）諸大谷。猿久籠而忘其習，遂無所得食，鳴而死。」（劉基 郁離子）【注釋】(1)信宿：連宿兩夜。(2)昇：音ㄕㄥ，拾舉、扛抬。(3)舍：放下。通「捨」。

