    content: 全文以倒敘法的方式寫成。以一則留學生的新聞帶出話題，並且點出主題
  - label: B
    content: 劉墉的妻子告訴劉墉，留學生開玩笑要劫機卻遭逮捕一事，其用意是擔憂丈夫乘坐飛機，會遇上劫機而有生命危險
