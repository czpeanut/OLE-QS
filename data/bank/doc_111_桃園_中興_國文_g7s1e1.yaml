    content: 「酒醉駕車釀成車禍是有心殺人嗎？……考試時受不住朋友請託而傳個紙條的是惡意犯規嗎？」劉墉連續提問，其用意要兒子警惕：生活處處有陷阱，要隨時提高警覺
  - label: D
    content: 「今天你還小，如果當你長大之後，還不能慎交朋友，就會惹下天大的麻煩」由此可知「染於蒼則蒼，染於黃則黃」的道理。
