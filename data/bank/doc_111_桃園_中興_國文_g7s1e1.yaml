  type: single
  page: 3
  stem: 第一段主要想傳達甚麼訊息？
  options:
  - label: A
    content: 描述《精靈寶可夢 GO》的熱門風潮
  - label: B
    content: 說明《精靈寶可夢 GO》行銷策略
  - label: C
    content: 介紹《精靈寶可夢 GO》的發想緣由
  - label: D
    content: 指出《精靈寶可夢 GO》的遊戲限制。
  group_stem: "風靡世界的手機遊戲——《精靈寶可夢 GO》，上市不到一個月，下載已經破億，玩家數更是知名手機遊戲《Candy Crash》的十倍，成為全球使用率最高的手機應用程式。\n\
    \    《精靈寶可夢GO》運用地理位置服務(LBS)、擴增實境(AR)兩種高科技，使玩家有身歷其境的感受。前者透過 GPS 定位來確認使用者的所在；後者藉由相機的辨識技術和電腦運算，將虛擬物件與真實環境結合。這是此款遊戲吸引玩家的賣點之一。\n\
    \    《精靈寶可夢 GO》到底有何吸引力？根據英國心理學家分析，遊戲難易度、設定互動、上市時間點都是遊戲成功的關鍵因素。《精靈寶可夢 GO》的遊戲背景有別於其他遊戲的創新背景故事。許多人小時候就接觸過寶可夢的動畫或遊戲，因此當此款遊戲推出時，人們心中的回憶一一湧出，當時懷抱著成為寶可夢大師的夢想，隨著寶可夢遊戲的發行有了一線曙光。在捕捉寶可夢的過程中，不只能獲得捕捉與訓練的雙重成就感，玩家甚至能因捕捉寶可夢，探索特殊建築或景點，發現生活中的美。玩家所馴養的寶可夢，可與其他玩家進行對戰，使玩家間也能有所互動，促進人際交流，再加上此款遊戲是在網路、行動載具普及的世代推出，玩家能快速、方便的進行遊戲。這些特色皆是《精靈寶可夢\
    \ GO》能廣受全球玩家歡迎的原因。\n(網路文章)"
