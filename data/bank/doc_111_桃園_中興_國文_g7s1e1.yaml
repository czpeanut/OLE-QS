  group_stem: "把話說到心窩裡，最重要的就是要「有情」。如果你是付出情的人，你只能做、不能說，你要讓對方自己去感受。你只要一說，那就不再是純純的情。\n\
    \    相對地，如果你是接受情的人，你在接受的同時，也要說出心中的感激。因為你能鼓起勇氣，說出來，就已經是很好的報答。你感謝的言語，必能獲得對方更多的關愛。\n\
