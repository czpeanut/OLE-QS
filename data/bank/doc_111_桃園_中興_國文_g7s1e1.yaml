- id: doc_111_桃園_中興_國文_g7s1e1_s2_31
  section: 2
  number: 31
  type: single
  page: 5
  stem: 根據本文，下列敘述何者正確?
  options:
  - label: A
    content: 外國人不信風水，認為是無稽之談
  - label: B
    content: 風水寶地不可強求，有德之人方能得之
  - label: C
    content: 不善待心宅之人終究無法活得安閒自在
  - label: D
    content: 中國老祖宗的風水之學皆能符合時代的潮流。
  group_stem: "中國人大概是世界上最講究風水的民族，不但活人的「陽宅」，要講究位置座向，死人的「陰宅」，也要堪輿以利子孫。\n  其實什麼叫做風水，最好的解脫應該是適合人類生活的環境，至於風水之學，則是人類經過幾千萬年，由生活的實際經驗中歸納出來。譬如大家最常說的好風水:「左青龍，右白虎，前朱雀，後玄武。」翻成白話是「左邊有河，右邊有路，前有廣場，後有山陵。」這種地方，誰不喜歡呢？不必風水先生指點，人人都可以看得出。所以風水與生活是息息相關的，風水改變可以影響生活，生活方式的改變，也足以影響風水的說法。\n\
    \    舊時的風水家常說：廚房不宜建在屋子的西南側，屋子北面牆有缺損要立刻修好，南邊則無妨。這理論乍聽有些玄，實際因為中國位於北半球，西南邊的房子最受陽光，舊時沒有冰箱，食物容易壞，所以不宜做廚房。至於北方的牆有洞，是因為冬天颳北風，所以應該修好。相反地，南方受夏天的暖風，則可以不急。說穿了，根本是衛生，避免人吃壞東西及受寒。問題是如果有了冰箱、冷氣，或在南半球，這風水的定理，是不是就得改了呢？\n\
    \    「山南為陽、山北為陰；水南為陰、水北為陽」，我們從小就知道這地理與陰陽的關係。但是如果有一天搬到澳洲、南美或非洲去居住，這陰陽的定理是不是就得全盤調反了呢？如果山水陰陽都改。那古人的風水之說能不變嗎？\n\
    \    前人說「擇吉而居」，這吉應該解釋為方便、舒適，只要住得安穩、進出順當，就是好風水。古人又說「福人福宅」，這福應該解釋為善良、喜樂。能事事泰然，逆來順受，住哪裡，哪裡就是福宅。\n\
    \    最重要的：人們只知活著的時候，房子是宅；死了之後，墓穴是宅。豈知道，生時，身體是心的宅院；死後，宇宙是靈的宅院。不注意修身與環境的保護，只曉得今天改一門，明日動一窗，後日懸一鏡，這是自私，也是捨本逐末，哪裡能算得懂風水呢？\n\
    (劉墉 現代風水)"
