- id: doc_111_桃園_中興_國文_g7s1e1_s2_28
  section: 2
  number: 28
  type: single
  page: 4
  stem: 以下對先秦寓言的說明，何者最正確？
  options:
  - label: A
    content: 以真實生動的故事表達抽象的道理
  - label: B
    content: 諸子寓言主要用來傳達政治理想和主張
  - label: C
    content: 論語、孟子、莊子、列子、韓非子、呂氏春秋中，能看到許多精彩的寓言故事
  - label: D
    content: 當情節豐富的小說出現後，寓言就消失了。
  group_stem: "寓言具有故事性，是中國小說的前身。讀寓言除了要欣賞故事的趣味性，更要留意其背後所隱含的旨意，以及作者寫作的目的。\n    「寓言」是「寄託之言」。作者把抽象的道理或觀念寄託在一個生動的故事中，讓讀者更易領悟和接納，以達到勸喻或諷諫的作用。先秦的史傳戰國策，以及諸子典籍孟子、莊子、列子、韓非子、呂氏春秋中，都能看到許多精彩的寓言故事，堪稱寓言創作的黃金時期，這些都是中國傳統文學的瑰寶，可與大約同期出現於古希臘的伊索寓言遙相媲美。\n\
    \    戰國策中有許多寓言，大多是謀士用來遊說諸侯或諷諫君王的，如「鷸蚌相爭，漁翁得利」正是燕國謀士蘇代用來勸諫趙惠王的一則著名寓言:\n    趙且伐燕，蘇代為燕謂惠王曰：「今者臣來，過易水，蚌方出曝，而鷸啄其肉，蚌合而拑其喙。鷸曰：『今日不雨，明日不雨，即有死蚌！』蚌亦謂鷸曰：『今日不出，明日不出，即有死鷸。』兩者不肯相舍。漁者得而並禽之。今趙且伐燕，燕、趙久相支，以弊大眾，臣恐強秦之為漁父也。故願王之熟計之也。」惠王曰：「善。」乃止。\n\
    \    蘇代藉鷸蚌相爭的故事，讓惠王及時醒悟而解除了燕國被攻打的危機。後來，人們便以「鷸蚌相爭，漁翁得利」比喻「當雙方堅持不肯退讓，往往會兩敗俱傷，讓第三者從中獲利」。\n\
    \     先秦時代，許多思想家善用寓言來宣揚自己的主張或理念。韓非是戰國時代法家思想集大成的重要人物，主張君王要用嚴刑峻法來統御臣民，「濫竽充數」便是他藉以說明自己政治理念的寓言之一：\n\
    \    齊宣王使人吹竽，必三百人。南郭處士請為王吹竽，宣王説之，廩食以數百人。宣王死，湣王立。好一一聽之，處士逃。\n    此則寓言藉兩位齊王聽竽的演奏，來強調國君考核下屬要確實，才不會讓臣下有欺騙矇混的機會。後人便用「濫竽充數」來比喻「沒有真才實學的人，卻混在行家中充數，或比喻拿不好的東西充場面。有時也用來當作自謙之辭，比喻自己才德不足」。\n\
    \    寓言雖然不是小說，但它的故事富有小說意味，其中某些重要的藝術手法，為後來小說創作提供了不少借鏡，因此有學者認為寓言可視為小說的先河。\n(改寫自穿越時空讀故事)"
