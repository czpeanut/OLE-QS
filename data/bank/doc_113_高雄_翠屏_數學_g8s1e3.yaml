- id: doc_113_高雄_翠屏_數學_g8s1e3_s3_2
  section: 3
  number: 2
  type: calc
  page: 3
  stem: '古希臘的數學家發現，當長方形的長與寬的比值符合一個固定比例時，稱為「黃金矩形」。他們認為符合這個比例的矩形是最具美學的矩形，古希臘的一些建築(如帕德嫩神殿、雕塑、、等)都有使用到黃金矩形。

    黃金矩形的定義是有一矩形 ABCD，將正方形 ABFE 切掉後，形成另一矩形 CDEF，當 $\overline{AD}:\overline{AB}=\overline{CD}:\overline{DE}$
    時，矩形 ABCD 稱為「黃金矩形」。如右圖。

    假設 $\overline{AB}=1$，$\overline{AD}=x$，請利用上述比例式，算出 $x=$？(5 分)'
  assets:
  - key: s3_2_f1
    kind: figure
    file: doc_113_高雄_翠屏_數學_g8s1e3/s3_2_f1.png
    crop:
