  section: 1
  number: 1
  type: single
  page: 1
  stem: '如下(甲)～(己)中是一元二次方程式的有幾個？

    (甲) $2x-5=0$

    (乙) $2x^{2}+5x-2=-2$

    (丙) $2x^{2}+6x+9$

    (丁) $3x^{2}=y$

    (戊) $(x-4)(x+3)=(x+1)(x-2)$

    (己) $(x-5)^{2}-2(x-5)-3=0$'
  options:
  - label: A
    content: '1'
  - label: B
    content: '2'
  - label: C
    content: '3'
  - label: D
    content: '4'
- id: doc_113_高雄_翠屏_數學_g8s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: $x=3$ 不是下列哪一個方程式的解？
  options:
  - label: A
    content: $3(x-3)=0$
  - label: B
    content: $x^{2}-2x=3$
  - label: C
    content: $(x-3)(x+3)=0$
  - label: D
    content: $x^{2}-x+3=0$
- id: doc_113_高雄_翠屏_數學_g8s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '下列為李傑解方程式 $x(3x+5)=2x(x-1)$ 的步驟：

    步驟1：兩邊同除以 $x$，得 $3x+5=2(x-1)$

    步驟2：$3x+5=2x-2$

    步驟3：$3x-2x=-2-5$

    步驟4：$x=-7$

    哪一個步驟開始發生錯誤？'
  options:
  - label: A
    content: 步驟1
  - label: B
    content: 步驟2
  - label: C
    content: 步驟3
  - label: D
    content: 步驟4。
