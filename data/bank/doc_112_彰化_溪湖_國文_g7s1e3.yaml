  group_stem: "(四)  芽子捨不得娘。臨走那天，芽子不要他娘送，可是他娘還是忍不住到碼頭，看到雜在隊伍中矮人一頭的芽子，急急跑過來，伸手就想抱他。芽子一驚，穿上軍裝，就是革命軍人，男子漢大丈夫，大庭廣眾之間，\
    \ 怎能像娘兒們一樣摟摟抱抱，再加上袍澤們一旁似笑非笑的看他，便推開母親，不耐煩的說：「回去啦！叫你別來，還來！」說完，頭也不回跑了。這一跑就是四十五年，娘在他走後第三年過世，小芽子成了老芽子，仍是孤寡一人，住在榮民之家。有一年，老夥伴們買了個蛋糕為他慶生，慫恿他許願。望著閃爍不定的燭花，他哽咽的說：「我想我娘，我想我娘抱抱我……」這一說，四周的老兵哭成一片。\n\
    \    我們總有太多的來不及。我們總以為時間會等我們，容許我們從頭再來，彌補缺憾。\n                                 \
    \      (改寫自杏林子)"
