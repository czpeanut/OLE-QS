  group_stem: "(一)  騰訊正式推出臉部辨識系統「零點巡航」，其功能旨在對於夜間遊戲超過一定時間、實名為成年人的帳號進行人臉重點審查，凡是拒絕或是未通過人臉驗證，將被視為未成年人，納入騰訊遊戲健康系統的防沉迷監管並且踢下線。\n\
    \   騰訊指出，騰訊遊戲於旗下少數產品對「零點巡航」功能進行了小規模的測試。在完成相關技術優化後，「零點巡航」功能目前已在旗下《王者榮耀》、《和平菁英》等超過60\
    \ 款產品上線，未來將逐步覆蓋其他更多款遊戲。\n    此外，在騰訊遊戲未成年人保護體系中的成長守護平台上，針對孩子可能盜用家長手機修改守護方案的情況新上線了「守護鎖」功能。在家長開啟守護鎖後，每次設定與修改都需要進行人臉辨識，確認是否為家長本人，防止被孩童私自修改。\n\
