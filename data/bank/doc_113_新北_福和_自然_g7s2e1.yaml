    組織培養蕉苗雖確保農民栽種的種苗是健康種苗，卻只能延緩發病速度，無法降低蕉園染上黃葉病的風險，因為土壤若過於酸化或排水不好等，即便是新農田仍有可能感染黃葉病。

    與此同時，蕉農間逐漸練就出一番與黃葉病共存的管理技術。旗山區蕉農郭文明指出，以前化學肥料都撒很重，其中的硫酸鹽和氯會讓土壤酸化、硬化，黃葉病喜歡待在這種環境，所以選擇一些比較鹼性的肥料或是有機肥料，調整土壤酸鹼值，大概拉到6
    或5.5 以上，蕉園罹病率比較不會那麼高。他會特別在罹病植株的土壤周圍下功夫，調整酸鹼值，讓病原菌不好生存。(改寫自 郭琇真。2018。農傳媒網路文章https://www.agriharvest.tw/archives/14614)'
