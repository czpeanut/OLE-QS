- id: doc_113_新北_福和_自然_g7s2e1_s2_46
  section: 2
  number: 46
  type: single
  page: 6
  stem: 依文章內容，請問COVID-19 病毒的遺傳物質是下列何者？
  options:
  - label: A
    content: DNA
  - label: B
    content: RNA
  - label: C
    content: 脂質
  - label: D
    content: 蛋白質。
  group_stem: '(圖組六) 請依以下文章內容回答46-47 題

    新冠病毒（COVID-19）是一種能夠感染人體並引起疾病的病毒。它的正式名稱是 SARS-CoV-2，是一種冠狀病毒，因為在顯微鏡下，它的表面有許多突起，看起來像「皇冠」一樣。

    COVID-19 病毒的基本結構和其他病毒類似，主要由以下幾個部分組成：

    1. 刺突蛋白（S 蛋白）：這些蛋白質突起像鑰匙一樣，能夠幫助病毒與人體細胞結合，讓病毒進入細胞內部。

    2. 脂質膜（外膜）：病毒外面包覆著一層由脂質（油脂類物質）組成的膜，這層膜可以保護病毒，但也使病毒容易被肥皂或酒精破壞，因此勤洗手可以幫助消滅病毒。

    3. 核衣殼（蛋白質殼）：這是一層蛋白質構造，保護病毒內部的重要遺傳物質。

    4. 遺傳物質（RNA）：COVID-19 病毒的核心是一條 RNA（核糖核酸），決定了病毒如何複製和感染人體。

    COVID-19 是一種 RNA 病毒，它的遺傳物質是 RNA，而不是人類細胞內的 DNA。它的基因容易改變，這就是為什麼會出現不同的變異株，例如 Alpha、Delta
    和 Omicron。

    病毒本身無法自行繁殖，當病毒進入人體後，它的 RNA 會指揮細胞製造病毒蛋白和新的病毒 RNA，這些成分組裝起來，變成更多的病毒，繼續感染其他細胞。

    由於 COVID-19 會透過飛沫（如咳嗽、打噴嚏）或接觸感染，因此做好防疫措施很重要：

    1.勤洗手：用肥皂洗手至少 20 秒，可以破壞病毒的脂質膜，使其失去活性。

    2.戴口罩：減少病毒進入呼吸道的機會。

    3.保持社交距離：避免與他人過於接近，降低感染風險。

    4.接種疫苗：疫苗可以幫助身體建立對抗病毒的免疫力，減少重症和感染的風險。'
