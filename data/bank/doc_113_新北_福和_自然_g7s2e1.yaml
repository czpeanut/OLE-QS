  - label: B
    content: 只有乙丙
  - label: C
    content: 只有甲乙
  - label: D
    content: 只有甲。
- id: doc_113_新北_福和_自然_g7s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 查克在寶箱中找到一本關於「如何進行組織培養」的古書，但他很快就發現只有部分記載是正確的，請問下列何者才是正確的描述？
