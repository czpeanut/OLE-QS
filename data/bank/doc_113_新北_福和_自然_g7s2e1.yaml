- id: doc_113_新北_福和_自然_g7s2e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 起司，又稱為乾酪，添加在食物中，增添食物的營養與美味，起司的原料是生乳，經加熱殺菌再冷卻後，加入乳酸菌進行醱酵作用，讓酸度上升後，加入凝乳酶(酵素)就能使生乳中的蛋白質凝固，形成豆花或豆腐狀，去除水分後加入鹽並壓實，形成塊狀的乳酪。後續的加工就會形成不同種的起司，例如莫札瑞拉起司會在製程中放入冰水，以增加延展性；高達起司會封上一層蠟，避免空氣接觸可長時間熟成；藍紋起司會再加入青黴菌，菌絲在乳酪內生長，形成特別的藍紋與風味，關於藍紋起司製造過程中相關的生物，下列敘述何者錯誤？
  options:
  - label: A
    content: 乳酸菌行發酵作用會產生二氧化碳
  - label: B
    content: 乳酸菌屬於細菌，是單細胞的原核生物
  - label: C
    content: 青黴菌是原生菌類，由菌絲組成，是多細胞生物
  - label: D
    content: 青黴菌也可以利用來提煉盤尼西林，用來治療細菌感染的疾病。
- id: doc_113_新北_福和_自然_g7s2e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 人類會利用一些細菌或黴菌來加工食品。例如：乳酸菌是某群細菌的統稱，這些細菌可將葡萄糖代謝成乳酸，也是乳酸飲料不可或缺的材料；某些沒有毒性的黴菌則可用來製作醬油或豆腐乳；保健食品中宣稱具有抗癌以及加強免疫功能的「多醣體」，是來自某些酵母菌或蕈類（如靈芝）細胞壁的成分。前述文章所提及的各種細菌、黴菌、酵母菌、蕈類等生物體，各有不同的特質，下列選項何者是這些生物的共通點？
  options:
  - label: A
    content: 都有細胞核
  - label: B
    content: 都有細胞壁
  - label: C
    content: 都是單細胞生物
  - label: D
    content: 都由菌絲構成。
