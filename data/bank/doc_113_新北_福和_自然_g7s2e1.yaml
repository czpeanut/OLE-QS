  type: single
  page: 1
  stem: 瘋狂的法師為了阻止探險隊前進，用魔法加速了馬鈴薯的生長繁殖速度，必須要破壞馬鈴薯營養器官繁殖的構造才能解除魔法，請問下列何者才是馬鈴薯進行營養器官繁殖的主要構造？
