- id: doc_113_新北_福和_自然_g7s2e1_s2_48
  section: 2
  number: 48
  type: single
  page: 6
  stem: 依文章內容，請問早期香蕉的無性繁殖是以下列何種構造進行？
  options:
  - label: A
    content: 根
  - label: B
    content: 莖
  - label: C
    content: 葉
  - label: D
    content: 毬果
  group_stem: '(圖組七) 請依據以下文章內容，回答48~50 題

    香蕉絕症黃葉病在臺落地生根50 多年，這是一種由真菌感染所造成的疾病。臺灣從事香蕉研究的領頭羊，台灣香蕉研究所屢創世界先例，研發組織培養蕉苗和多項香蕉抗病品種，專業蕉農們則練就一番改造土壤，與病共存的種植技術。據統計，目前全臺灣蕉園黃葉病罹病率平均約降到15%。

    香蕉因為採無性繁殖，其球莖會長出許多吸芽，過去農民多半會將吸芽苗挖出，再行種植。台灣香蕉研究所發現，若蕉農自感染黃葉病的蕉園挖吸芽苗再種，會讓病原菌傳播得更快，如果是種在新農田，有極大機率也跟著遭殃，於是他們在1983
    年創世界首例，研發出「組織培養蕉苗」。

    所謂的組織培養蕉苗是先在田間挑選優良植株，取其吸芽苗帶回無菌室分切，吸芽苗中間會有生長點，切開生長點可產生不定芽，便可放入培養瓶內進行培養和馴化。1 瓶培養瓶會有10
    個以上不定芽，分別經過室內馴化室及室外馴化場馴化後，就可移植到苗圃栽種，等到蕉苗約長至15 公分高便可賣給農民。從吸芽苗開始繼代增殖，每階段需時1 個月，再加上馴化、苗圃種植，整體蕉苗製作時間約8～10
    個月。

    組織培養蕉苗雖確保農民栽種的種苗是健康種苗，卻只能延緩發病速度，無法降低蕉園染上黃葉病的風險，因為土壤若過於酸化或排水不好等，即便是新農田仍有可能感染黃葉病。

    與此同時，蕉農間逐漸練就出一番與黃葉病共存的管理技術。旗山區蕉農郭文明指出，以前化學肥料都撒很重，其中的硫酸鹽和氯會讓土壤酸化、硬化，黃葉病喜歡待在這種環境，所以選擇一些比較鹼性的肥料或是有機肥料，調整土壤酸鹼值，大概拉到6
    或5.5 以上，蕉園罹病率比較不會那麼高。他會特別在罹病植株的土壤周圍下功夫，調整酸鹼值，讓病原菌不好生存。(改寫自 郭琇真。2018。農傳媒網路文章https://www.agriharvest.tw/archives/14614)'
