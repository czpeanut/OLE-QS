  group_stem: '(題組四)

    小皮整理課本上植物界的內容，自製一個植物界的檢索表，接著調查家裡食品櫃裡的食材與陽台的盆栽中的生物，找到下列七種生物，利用自製檢索表進行檢索：

    [小皮家中找到的7 種生物]：

    紫菜、竹蓀、白果、綠豆、稻米、土馬騌、鹿角蕨

    [小皮製作的植物界的檢索表]：表二

    小皮在跟家人去滿月圓國家森林遊樂區爬山時，發現步道旁一棵樹下的土壤，冒出一根根紅色菇狀的生物，用手機拍照記錄(如圖九、十、十一)。

    小皮很好奇這些到底是什麼生物，便將照片用google[以圖搜尋]，比對照片後在台灣生命大百科的網站上(https://taieol.tw/)，找到最符合特徵的生物是筆頭蛇菰，學名為Balanophora
    harlandii，屬於蛇菰科的生物，但網站只有照片與名稱，並沒有描述特徵，小皮便以[筆頭蛇菰]，還有學名[Balanophora harlandii]為關鍵字再搜尋，最後統整出來：

    筆頭蛇菰寄生於木本植物的根部，不具葉綠素和氣孔，植株呈紅色，直立的莖上有鱗片狀的葉，植株高約 2.5~9 公分；每年9~11 月為其繁殖期，繁殖時會開花，雌雄異株，雄株的雄花有三枚雄蕊，三片細小的花瓣，雌株的花細小，無花瓣，雌蕊的子房黃色，授粉後形成果實，內部種子呈球形，附著在果皮上。

    依據小皮的紀錄與蒐集到的資料，請協助小皮回答下列問題：'
