    寄居蟹身體分節，頭胸部有堅硬的外骨骼，但是腹部僅有膜質化的表皮，沒有外殼、質地柔軟，因此會藉由螺類死亡後留下的殼來保護脆弱的腹部，寄居蟹生長的過程除了需要蛻皮，也需要持續替換更大的螺殼。寄居蟹有五對步足，第一對是螯，用來攝食、爬行、防護，當他們躲進螺殼裡，螯也可以做為螺殼的「封口」；第二、三對步足用來步行；第四、五對步足隱藏在殼內，用來勾住螺殼，平時不會露出螺殼外，所以容易誤以為寄居蟹好像只有三對步足。

    寄居蟹在繁殖季節時，雄蟹會等待雌蟹蛻皮後，迅速地將精夾投放到雌蟹的腹部裡面，當卵受精後，受精卵會從雌蟹的生殖孔排出，吸附在腹肢上，雌蟹會利用腹肢擺動產生水流，直到幼體孵化出來，剛孵化出來的幼體稱為蚤狀幼體(Zoes)，必須經過數次的蛻皮變態才能成為具有生殖能力的成體。

    [節錄自 寄居蟹研究室https://tonycoenobita.com/]'
