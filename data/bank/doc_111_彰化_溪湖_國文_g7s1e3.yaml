- id: doc_111_彰化_溪湖_國文_g7s1e3_s2_44
  section: 2
  number: 44
  type: single
  page: 4
  stem: 根據本文報導，下列敘述何者正確？
  options:
  - label: A
    content: 由於以升學為導向的文化背景，以及網路及智慧型手機普及率高，導致亞洲學生易在網路世界宣洩壓力
  - label: B
    content: 目前意識到「網路成癮」問題嚴重性而立法管制的，皆為亞洲國家
  - label: C
    content: 「數位海洛因」意指青少年因為網路遊戲成癮，而增加吸食毒品的機會
  - label: D
    content: 現在年輕人被「數位海洛因」侵襲，導致人口大幅下降，削弱國家競爭力。
  group_stem: "（四）\n    世界衛生組織在國際疾病分類中，已經正式將「網路遊戲成癮」視為一種「病」，與酒精、菸草、咖啡因、毒品和藥物濫用並列，都是上癮的精神疾病。依照世界衛生組織對「網路遊戲成癮」症狀的定義為：「無法控制自我地打電玩，生活中愈來愈以電玩為優先，而忽略其他日常活動，即使知道有負面影響，仍持續增加打電玩的時間，以致嚴重影響個人日常生活正常運作，包括健康、家庭、學校、工作等層面，且症狀持續至少\
    \ 12 個月才能確診。」「上癮」會發生哪些不良後果？除了早期探討最多是因為長時間且近距離使用，影響視力不佳等問題外，高雄醫學大學的研究發現：「網路成癮者在功能性磁震造影（FMRI）上的大腦活化反應顯示，成癮者有易於渴求喚起，以及衝動控制不良的問題。」伴隨著網路遊戲成癮而來的，還有孩子的專注力不集中、情緒問題、焦慮和過動等共病出現，更惡化了成癮的嚴重性。臨床上發現，網路成癮十年前約占就醫者的六分之一，而今是一半左右，盛行率整整提升約\
    \ 2 倍，同時約有三分之一者，帶有焦慮或過動等情形。\n韓國是全球第一個從政府面向，將電玩視為「疾病」管理的國家。意識到「成癮」問題嚴重性的，不只有網路普及率高的亞洲國家，法國參議員也審議批准法案規定：「除了校園內明確規定的地點和條件外，禁止學生在幼兒園、小學和初中校園內使用手機。」美國\
    \ 有線電視新聞網 CNN 則用「數位海洛因（Digital Heroin）」報導此現象。目前臺灣在網路成癮政策上，根據兒少法第 43 條，明訂兒少持續使用\
    \ 3C 產品，不得超過合理時間，實際上卻很難實施執行。\n經濟合作暨發展組織的一份跨國調查顯示，網路遊戲成癮最嚴重的幾個國家與地區為香港、韓國、臺灣、新加坡與中國。網路及智慧型手機普及率高，以及亞洲國家以升學為導向的文化背景，讓青年學子容易在網路世界宣洩壓力。「數位海洛因」侵襲著國家未來主人翁的大腦，也削弱國家競爭力。需要政府跨部會管制，並落實到第一線執行面，不然五年後弊端就會浮現：不是年輕人力缺乏，而是素質不好，這才是真正的動搖國本。在現在科技推陳出新的時代，政府、學校、家長面對孩子網路遊戲成癮這一役，相信還有許多漫長之路要走。\
    \                      （改寫自今周刊）"
