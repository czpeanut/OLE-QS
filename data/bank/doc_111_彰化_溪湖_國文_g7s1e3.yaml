  stem: 麥可．喬丹說：「在我的職業生涯裡，有超過九千次的投籃不中，我失敗的場次幾乎快到了三百場，有二十六次，我被信任在比賽中進行最後一擊，但是我失敗了，在我們人生裡，我不斷又不斷的失敗，但，這就是我為什麼會成功。」這段話可以用下列哪一名言來詮釋？
