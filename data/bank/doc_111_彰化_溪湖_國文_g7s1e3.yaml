  section: 1
  number: 28
  type: single
  page: 2
  stem: 「神話是民族的夢。遠古的神話，出自先民的集體創作，由口頭傳說到文字記載。神話雖然是虛構的，卻植根於現實生活的基礎上，反映了先民對於自然現象的解釋和想像，同時又顯現了先民對抗大自然的搏鬥精神、對幸福自由的渴望和追尋，以及偉大愛情的歌頌等。神話不僅為後世的文學藝術提供豐富的美麗題材，更是民族文化的寶藏。」根據這段文字，下列關於神話的敘述何者最恰當？
  options:
  - label: A
    content: 神話呈現先民面對大自然的種種心態與想望
  - label: B
    content: 文學藝術作品為神話提供了豐富的靈感與素材
  - label: C
    content: 神話的可貴在於它如實保存了先民生活的樣貌
  - label: D
    content: 先民集體創作的神話是由文字記載發展為口頭傳說。
