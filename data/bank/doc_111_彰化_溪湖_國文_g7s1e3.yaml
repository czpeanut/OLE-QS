- id: doc_111_彰化_溪湖_國文_g7s1e3_s1_16
  section: 1
  number: 16
  type: single
  page: 1
  stem: 「朋友如金錢，沒錯。不過，倒不如改為朋友如硬幣更貼切：你不用時滿口袋都是，一旦急著要打電話時，翻遍了口袋，卻一個也找不著。」由此推論，一般人缺乏的是哪一種朋友？
  options:
  - label: A
    content: 泛泛之交
  - label: B
    content: 總角之交
  - label: C
    content: 患難之交
  - label: D
    content: 忘年之交。
- id: doc_111_彰化_溪湖_國文_g7s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 1
  stem: 下列何者不是 朋友相交一文中作者在交友時所抱持的觀點或主張？
  options:
  - label: A
    content: 期望以誠信與朋友相交，多結善緣，談得來則多交往，談不來則緘默
  - label: B
    content: 朋友的好壞之分不能以「人生階段」來論斷，而在於「人的本質」
  - label: C
    content: 以「相交滿天下，知心有幾人？」感嘆朋友只求愈多愈好，不必在乎彼此心意是否契合
  - label: D
    content: 認為「君子之交淡如水」，友情要像水一樣清純無雜質，不帶有目的性，才能長久。
  lesson_raw:
    title: 朋友相交
    basis: 題幹提及「朋友相交一文中」
- id: doc_111_彰化_溪湖_國文_g7s1e3_s1_18
  section: 1
  number: 18
  type: single
  page: 1
  stem: 李白 黃鶴樓送孟浩然之廣陵：「故人西辭黃鶴樓，煙花三月下揚州。孤帆遠影碧山盡，唯見長江天際流。」關於這首詩的理解，下列何者正確？
  options:
  - label: A
    content: 第一句敘述李白即將要遠行，老友孟浩然前來送別
  - label: B
    content: 第二句點出路程遙遠，須歷時三個月才能抵達揚州
  - label: C
    content: 第三句描繪碧綠的青山邊，江上僅有一艘船要出發
  - label: D
    content: 第四句以眼前的長江水來表現內心綿綿不盡的離愁。
- id: doc_111_彰化_溪湖_國文_g7s1e3_s1_19
  section: 1
  number: 19
  type: single
  page: 1
  stem: 「薄暮蚊雷震耳聾，火攻不用用煙攻。腳爐提起團團走，燒著清香路路通。」根據詩意，何者說明正確？
  options:
  - label: A
    content: 天亮時，蚊子眾多擾人清夢
  - label: B
    content: 夏天蚊子不怕火燒只怕煙熏
  - label: C
    content: 孩童拿出香爐點燃蚊香驅蚊
  - label: D
    content: 最後只好點香祈求神明保佑。
- id: doc_111_彰化_溪湖_國文_g7s1e3_s1_20
  section: 1
  number: 20
  type: single
