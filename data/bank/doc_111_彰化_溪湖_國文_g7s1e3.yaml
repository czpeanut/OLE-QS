- id: doc_111_彰化_溪湖_國文_g7s1e3_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 林慶昭 漢字詞語有意思：「古文字的『友』字，像兩隻同時伸出來的右手，兩手相交表示握手，所以甲骨文的『友』字還特意用橫畫把兩隻手連在一起。握手是為了表示友好，就像現在常見的老友重逢，大家都伸出右手緊緊相握，以表達親密好友之情。因此，『友』字的本意就是我們現在所說的『朋友』。不過在古代，『朋』和『友』的含意是有區別的：『同門為朋』，即跟從同一個老師學習的人稱為『朋』；『同志為友』，即是說志同道合的人才能稱為『友』。」有關此段話的敘述，下列何者正確？
  options:
  - label: A
    content: 「朋友」一詞從古至今皆為同義複詞
  - label: B
    content: 古人所謂的「朋」與「同學」、「同窗」意同
  - label: C
    content: 在古代，要能為「友」，必先為「朋」
  - label: D
    content: 可推知「友」的古字應作：「」
    asset:
      key: optD
      file: doc_111_彰化_溪湖_國文_g7s1e3/1_21_optD.png
- id: doc_111_彰化_溪湖_國文_g7s1e3_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 「一人留客午飯，其客已啖盡一碗，不見添飯。客欲主人知之，乃佯言曰：『某家有住房一所要賣。』故將碗口向主人曰：『椽子也有這樣大。』主人見碗內無飯，急呼使童添之。因問客曰：『他要價值幾何？』客曰：『於今有了飯吃，不賣了。』」（註
    椽子：支撐房頂與屋瓦的木條）（笑林廣記）文中主人的態度可用何者形容？
  options:
  - label: A
    content: 小心眼
  - label: B
    content: 白瞪眼
  - label: C
    content: 勢利眼
  - label: D
    content: 實心眼。
- id: doc_111_彰化_溪湖_國文_g7s1e3_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: 呂氏春秋：「有過於江上者，見人方引嬰兒而欲投之江中，嬰兒啼。人問其故，曰：『此其父善游。』其父雖善游，其子豈遽善游哉？」根據此段文字敘述，其寓意為何？
  options:
  - label: A
    content: 遇到事情要循序漸進處理，勿操之過急
  - label: B
    content: 要掌握處理事情的方法，成效才快速
  - label: C
    content: 處理事情時要了解實際情況，不能依照自己的想法來推論
  - label: D
    content: 要有同情心，不要殘害小孩子。
- id: doc_111_彰化_溪湖_國文_g7s1e3_s1_24
  section: 1
  number: 24
  type: single
  page: 2
  stem: 「有些人才，只是放錯了位置，就成了庸才。」這句話的涵義，與下列何者最接近？
  options:
  - label: A
