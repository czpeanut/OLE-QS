  stem: 「世界上只有兩種人：一種是樂於提起自己有什麼夢想，然後如何讓美夢成真的人。一種是說自己沒有什麼夢想的人，他們說他們並不渴望成功，也從未曾想過要出類拔萃，他們寧可做個平凡的人。但這多半是自欺欺人，因為他們一事無成，羞於提起自己曾經有過的夢想，最後只好忘懷或否定他們。」（王溢嘉）上文中的「沒有夢想的人」與下列何者最接近？
