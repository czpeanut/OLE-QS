  type: single
  page: 2
  stem: 巴勒斯坦地區因歷史上的糾葛，使猶太人和阿拉伯人皆認為是其固有領土，勢力消長如附圖(九)，長達70年的衝突至今未歇，其中被以色列、巴勒斯坦皆視為首都的耶路撒冷，更是世界各國不願碰觸的紅線。直到西元2020年，美國將以色列大使館遷至耶路撒冷，讓國際間長期保有的默契失去平衡，導致衝突再起。以巴衝突是西亞與北非地區動盪的縮影，除了強權國家的介入，區域內部的矛盾更是衝突主因。關於兩大族群的矛盾主因為下列何者？
