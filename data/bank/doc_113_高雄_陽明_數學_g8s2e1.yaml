- id: doc_113_高雄_陽明_數學_g8s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '判斷下列敘述正確的有幾個？

    (甲) 因為 7，13，5，6，28 沒有規律，所以這不是數列。

    (乙) 數列 3，6，9，12，15 是一個公差為 3 的等差數列。

    (丙) 數列 2，4，8，16 中，因為 $4 - 2 \neq 8 - 4$，所以 2，4，8，16 不是一個數列。

    (丁) 若有一個等差數列，將每一項都加上 5，則得到的新數列也會是一個等差數列。

    (戊) 若有一個等比數列，將每一項都乘上 5，則得到的新數列也會是一個等比數列。

    (己) $\frac{1}{2} + \frac{1}{4} + \frac{1}{6} + \frac{1}{8}$ 是一個級數，但不是等差級數。

    (庚) 0，0，0，0，0 不是一個等差數列，也不是一個等比數列。

    (辛) 6 是 -4 與 -9 的等比中項。'
  options:
  - label: A
    content: 4 個
  - label: B
    content: 5 個
  - label: C
    content: 6 個
  - label: D
    content: 7 個
