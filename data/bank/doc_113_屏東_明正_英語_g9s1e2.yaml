    time. Bow became famous because of movies such as It (1927).


    1990s

    • It girls are beautiful female stars or fashionable young women. Take Tamara
    Beckwith, for example. She has been seen on many TV shows, so she was often called
    an It girl by people in the UK in the 1990s.


    2000s

    • Paris Hilton is another It girl. She was an important person in the fashion
    business in the 2000s.


    Therefore, it is easy to see that “It girl” is often used to describe some famous
    stars and other public figures.

