- id: doc_113_屏東_明正_英語_g9s1e2_s6_3
  section: 6
  number: 3
  type: single
  page: 3
  stem: According to the reading, which of the following choices is true about paper
    straws?
  options:
  - label: A
    content: They can be reused many times.
  - label: B
    content: They are not much better for the environment than plastic straws.
  - label: C
    content: Germs can grow inside them.
  - label: D
    content: They end up in oceans every year.
  group_stem: 'B. (3~4)

    The war on straws is growing as many people want to stop the use of plastic straws.
    Schools, offices and fast-food restaurants are working to reduce plastic waste.
    McDonald''s and Starbucks have stopped giving customers plastic straws. Eco-friendly
    alternatives are around people, but many of them have other problems.

    Plastic straws are bad for the earth because they cannot be used again. There
    are about eight million tons of plastic trash that end up in our oceans every
    year. Sea turtles are being found with straws stuck up their noses. Two of the
    most common straw alternatives are paper and metal.

    Paper straws are still used once only and are not much better for the environment
    than plastic straws. Metal straws are also hard to clean as germs can grow inside
    the straw. The best choice is to go strawless. In other words, people try not
    to use straws anymore. That way, people will save the earth by reducing waste.

     reduce 減少 alternatives 替代品 ton 公噸 stuck 卡住 metal 金屬'
