- id: doc_113_屏東_明正_英語_g9s1e2_s6_5
  section: 6
  number: 5
  type: single
  page: 4
  stem: What happens to animals if they are endangered?
  options:
  - label: A
    content: The number of the animal is growing.
  - label: B
    content: They are caught by people.
  - label: C
    content: People may not see them in the future.
  - label: D
    content: They are found by researchers.
  group_stem: 'C. (5~7)

    You may not know the name "mikado pheasant," but you see the animal quite often
    because it is on your one thousand-dollar note. A mikado pheasant is a large bird
    with a round body and long tail. "Mikado" means king in Japanese because it looks
    like the king of the birds. They were found by a bird researcher from the UK.
    He was very interested in the feathers that Tsou people put on their heads when
    he came to Taiwan. He brought the feather back to his country and learned that
    it was a new species to Europeans.

    The mikado pheasant is known as the bird of Taiwan. They live in the high mountains
    of Taiwan. They usually eat plants on the ground, but they also eat bugs and ants
    when there are not enough plants to eat in the winter. It''s easy to find them
    in the mountains. They are so shy that they always hide from people. The mikado
    pheasant is also an endangered species. A lot of trees in the mountains were cut
    down. The places they lived in were taken away. There were only a few thousand
    of them in 1986. Luckily, the number of mikado pheasants keeps going up. There
    are more than ten thousand of them now. People have been doing a good job saving
    this big beautiful bird.

    note 紙幣 researcher 研究員 feather 羽毛 Tsou people 鄒族 species 物種 European 歐洲人'
  shared_asset: g6_5_7
