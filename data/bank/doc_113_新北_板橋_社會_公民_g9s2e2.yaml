  stem: 一名16 歲少年無照騎乘機車，不慎擦撞路邊汽車。汽車車主表示修復費用需要5 萬元，但少年無力承擔。雙方到公所調解，但未能達成共識。對此車主提起訴訟希望能獲得合理賠償。對於上述案件，下列解讀何者正確？
