  section: 1
  number: 39
  type: single
  page: 1
  stem: 台積電創辦人張忠謀於近期的專題演講中提到，過往IBM(美國的跨國企業)的執行長收入包含紅利大約是基層人員的40 倍，現在大公司的職業經理人和基層人員的收入差距約400
