  stem: 北韓領導人金正恩認為穿著緊身牛仔褲、留著流行性強的狼尾頭，都是西方時尚文化影響年輕人的思想作為，終究會撼動其權威性。為此，北韓政府青年軍還組成「時尚警察」，專門監視民眾的穿著打扮，並規定人們只能剪官方指定的15
