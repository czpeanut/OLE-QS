    | 鋁 | 2.70 |

    | 血液 | ≒1.06 |

    | 水 | 1.00 |

    | 冰 | 0.92 |

    | 酒精 | 0.79 |

    | 二氧化碳 | 0.00198 |

    | 空氣 | ≒0.0012 |

    | 氫氣 | 0.00009 |'
