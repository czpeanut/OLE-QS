  section: 1
  number: 28
  type: single
  page: 1
  stem: 阿中勤奮好學，飽讀詩書，欲入朝為官，施展抱負，為民謀福。請設想阿中若是身處不同時代，下列何項敘述可能為阿中受選拔任官的情形？
  options:
  - label: A
    content: 若阿中是東周時代的平民，可以出色的才幹與謀略受到國君重用為官
  - label: B
    content: 若阿中為漢代經學世家的成員，可透過參與科舉取得出任官員的資格
  - label: C
    content: 若阿中為曹魏時期的儒家學子，可能因成績優異受地方長官薦舉任官
  - label: D
    content: 若阿中是唐代的世族子弟，有可能依據九品官人之法受選出任上品官員。
