  section: 1
  number: 22
  type: single
  page: 1
  stem: 封建制是由共主或中央王朝給宗室成員、王族和功臣分封領地的一種政治模式。「封建」即「封土建國」，分封是讓他們建立封國和軍隊，協助統治。西元前221 年，秦始皇統一天下，廢除封建制度、編列戶口、推行郡縣制度。請問：這一連串的改革是為了什麼？
  options:
  - label: A
    content: 促進經濟
  - label: B
    content: 文化交流
  - label: C
    content: 中央集權
  - label: D
    content: 發展科技。
