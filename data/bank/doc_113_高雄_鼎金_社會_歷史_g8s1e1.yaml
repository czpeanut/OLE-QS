  section: 1
  number: 31
  type: single
  page: 1
  stem: 「絲路」起源於漢代，從中國出發，途經中亞、最終到達大秦(羅馬帝國)，這條道路是古代中西交流相當重要的一條路徑。請問：有關絲路的敘述，下列何者正確？
  options:
  - label: A
    content: 這條道路開通於東漢
  - label: B
    content: 張騫出使西域，使漢人更了解中亞等地
  - label: C
    content: 當時中國最受西方歡迎的商品是茶葉
  - label: D
    content: 基督教、音樂、繪畫都是透過絲路傳入漢朝。
