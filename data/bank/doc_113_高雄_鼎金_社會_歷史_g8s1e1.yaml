  section: 1
  number: 27
  type: single
  page: 1
  stem: 曹魏時期創制的「九品官人之法」，是中國歷史上曾經實施很久的特殊選才制度。如果想要了解九品官人之法，下列哪項敘述較合乎史實？
  options:
  - label: A
    content: 獲選的品位數字愈大，代表官位愈高
  - label: B
    content: 一直以來都重視家世、才能與品德三個層面的評比，所以普遍而言是客觀的選才方式
  - label: C
    content: 「上品無寒門，下品無世族」是九品官人之法的優點
  - label: D
    content: 評選官員經常偏重士人的家世背景，導致制度出現流弊。
