- id: doc_113_新北_崇林_國文_g9s1e2_s3_43
  section: 3
  number: 43
  type: single
  page: 5
  stem: (   ) 關於「震動幻視」現象，下列理解何者最恰當？
  options:
  - label: A
    content: 發作的時候會伴隨眩暈症
  - label: B
    content: 在每個人的生活中都可能發生
  - label: C
    content: 會自行排除故不需特別就醫
  - label: D
    content: 看報紙時最容易產生此現象。
  group_stem: "(二)請閱讀以下短文，回答第43～44 題：\n    在臨床上，常常會聽到患者在問：「醫師，我邊走路邊看東西時，會覺得景物在震動，靜坐時就不會，有人說我是內耳不平衡，可是我又沒有頭暈的感覺，而且我聽力很好……」其實，患者所描述的，確實不是眩暈或頭暈，其實是一種稱為「震動幻視」的現象，主因為視覺影像在視網膜上出現多餘的移動，造成一種視覺妄想和平衡錯覺，好發於有頭痛、眩暈及睡眠障礙的人身上。\n\
    \    正常眼球在穩定地轉動時，視網膜所能偵測到景物漂移的範圍是每秒 0.1 度，目的在於能據此微調眼球轉動，使目標影像精準地落在視野的中央；當眼球轉動動作不穩定時，任何目標景物在視網膜上的漂移就很容易超過這個範圍，當漂移的速度超過每秒\
    \ 2.5~4 度時，視力會快速變差。例如，當多人一起閱覽同一台平板上的文字時，如果有人突然滑動畫面，其他仍緊盯螢幕者便會感到不適，這就是一種人為的震動幻視。\n\
    \    醫學上判定「震動幻視」最準確的辦法莫過於攝影記錄眼振電圖，患者在測試時往往無法精準地盯住目標紅點，特別是在目標紅點移動或患者左右轉頭時會更為明顯。另外，還有一個能提供給讀者的簡易自我診療法：（1）固定頭頸姿勢，雙手攤開報紙，緊盯著某條新聞標題，如果這時就已感到不適時，比較傾向是頭暈或眩暈症狀；（2）如果只有在雙手上下左右移動報紙畫面才會感到不適時，才是震動幻視。\n\
    \    倘若震動幻視只是暫時性的，最常見的病因就是偏頭痛發作或是睡眠不足，使管理平衡的前庭功能較平常差一點，而頭部外傷後腦震盪、感冒時發燒或眼鏡散光度數不佳也會出現暫時的震動幻視現象；倘若震動幻視是持續性的，最常見的病因就是帕金森氏病、多發性硬化症或眼肌陣攣等神經疾病，進而影響到眼球的運動反射系統。\n\
    \    因此，患者若有震動幻視時，應回顧最近是否有睡眠不足、偏頭痛發作、感冒、發燒等現象；但若是持續性時，宜迅速、正確就醫。\n改寫自聯合新聞網《科普好健康》"
