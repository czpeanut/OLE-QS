  stem: (   )  請根據文本推論，排列出正確的段落順序？
  options:
  - label: A
    content: 子   丑   寅
  - label: B
    content: 丑   子   寅
  - label: C
    content: 寅   丑   子
  - label: D
    content: 丑   寅   子。
  group_stem: "(四) 請閱讀以下短文，回答第49～50 題：（請注意前三段須重組）\n\n【子】\n    但我們不是。我們不會跟好友一樣殷勤探問，不會跟情人一樣常相廝磨，不會跟夫婦一樣同船共渡。所謂□□，就是家常日子平淡過，各自有各自的工作和生活、各自做各自的抉擇和承受。我們聚首，通常不是為了彼此，而是為了父親或母親。聚首時即使促膝而坐，也不必然會談心。即使談心，也不必然有所企求——\
    \ 自己的抉擇，只有自己能承受，在我們這個年齡，已經了然在心。有時候，我們問：母親也走了以後，你我還會這樣相聚嗎？我們會不會，像風中轉蓬一樣，各自滾向渺茫，相忘於人生的荒漠？\n\
    \n【丑】\n    多麼奇特的關係啊！如果我們是好友，我們會彼此探問，打電話、發簡訊、寫電郵、相約見面，表達關懷。如果我們是情人，我們會朝思暮想，會噓寒問暖，會百般牽掛，因為，情人之間是一種如膠似漆的黏合。如果我們是夫妻，只要不是怨偶，我們會朝夕相處，會耳提面命，會如影隨形，會爭吵，會和好，會把彼此的命運緊緊纏繞。\n\
    \n【寅】\n    然而，又不那麼簡單，因為，和這個世界上所有其他的人都不一樣，我們從彼此的容顏裡看得見當初。我們清楚地記得彼此的兒時——老榕樹上的刻字、日本房子的紙窗、雨打在鐵皮上咚咚的聲音、夏夜裡的螢火蟲、父親念古書的聲音、母親快樂的笑、成長過程裡一點一滴的羞辱、挫折、榮耀和幸福。有一段初始的生命，全世界只有這幾個人知道，譬如你的小名，或者，你在哪棵樹上折斷了手。\n\
    \n    南美洲有一種樹，雨樹，樹冠巨大圓滿如罩鐘，從樹冠一端到另一端可以有三十公尺之遙。陰天或夜間，細葉合攏，雨，直直自葉隙落下，所以葉冠雖巨大且密，樹底的小草，卻茵茵然蔥綠。□□，不是永不交叉的鐵軌，倒像同一株雨樹上的枝葉，雖然隔開三十公尺，但是同樹同根，日開夜闔，看同一場雨直直落地，與樹雨共老，挺好的。\n\
    ――節錄自龍應台共老"
