  stem: (   ) 下列有關〈無關歲月〉的文句分析，何者正確？
  options:
  - label: A
    content: 作者引用「抽刀斷水水更流」指出時間不停流逝，人無法留住時間的腳步
  - label: B
    content: 如果不慎失手打碎了碗盤，必要說一句：「歲歲（碎碎）平安。」原因是習俗中打碎碗盤象徵舊的不去，新的不來
  - label: C
    content: 「饅頭蒸好，打開蒸籠蓋的一刻，母親特別緊張」原因是母親想起小時候過年接連兩個月重複吃除夕饅頭的往事
  - label: D
    content: 「這些小時候不十分懂，大了以後有一點厭煩的瑣細行為，現今回想起來是有不同滋味的」意指作者經歷豐富的人生歷練後，對許多在意的事物不再執著。
