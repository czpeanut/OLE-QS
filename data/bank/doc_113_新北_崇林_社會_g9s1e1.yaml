- id: doc_113_新北_崇林_社會_g9s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 小林哼著一首歌：「古□□□王頒布了漢摩拉比法典/刻在黑色的玄武岩/距今已經三千七百多年/妳在櫥窗前/凝視碑文的字眼/我卻在旁靜靜欣賞妳那張我深愛的臉......我給妳的愛寫在西元前/深埋在美索不達米亞平原/幾十個世紀後出土發現/泥板上的字跡依然清晰可見......。」請問：根據你所學過的內容判斷這首歌提到的歷史背景何者有誤？
  options:
  - label: A
    content: □□□是繼蘇美人後建立政權的民族
  - label: B
    content: 漢摩拉比法典強調「以牙還牙，以眼還眼」的報復原則
  - label: C
    content: 碑文上的字應是通行當地的象形文字
  - label: D
    content: 此歌曲的創作靈感是來自於西亞古文明。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 歷史
      code: 1-1
      title: 西亞古文明
      chapter: 第1章 西亞與非洲的古文明
