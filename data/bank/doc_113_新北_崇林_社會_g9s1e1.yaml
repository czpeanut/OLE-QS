    content: 他生前費心打造屬於自己的金字塔，祈求有來生得以復活
  - label: C
    content: 使用楔形文字記錄生活中的點點滴滴
  - label: D
    content: 遇到波斯大軍征服埃及，結束了埃及王國的政治發展。
