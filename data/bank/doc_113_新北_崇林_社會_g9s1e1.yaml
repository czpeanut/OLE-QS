  stem: I see,I come,I conquer.(我見，我來，我征服。)原文為拉丁文，時態為第一人稱完成式，顯示征戰過後的情境。但是經過千年，堅持原時態已無意義，所以英文就改用現在式，成為諺語。這句名言來自一位歷史人物，他是世界上一流的戰略政治家，曾征服許多地區，卻因個人權力過於集中，違背了共和精神，因此在政爭中遇刺身亡。請問這位歷史人物應是何人？
