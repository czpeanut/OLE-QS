- id: doc_113_新北_崇林_社會_g9s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 亮亮想要寫一位希臘哲學家的專題報告，以下這四個人物的介紹，何者才是完全正確，可以放入他的報告裡面？
  options:
  - label: A
    content: 蘇格拉底─主張「無知的知」，認為人人其實都能理解真理，卻被自己的主觀與無知蒙蔽，需透過發問與反詰，使人們體認到自己的無知
  - label: B
    content: 歐幾里德完成的《幾何原本》不僅是西方流傳最廣的數學教科書，更曾經被傳教士利瑪竇和中國官員共同合譯此書，將幾何學傳入了中國
  - label: C
    content: 柏拉圖─以波希戰爭為題材，著有《歷史》一書，曾說過：「埃及是尼羅河的贈禮。」
  - label: D
    content: 亞里斯多德─是希臘三哲人之一，更是蘇格拉底的知名學生，被譽為「古希臘哲學的集大成與西方哲學的奠基者」。
