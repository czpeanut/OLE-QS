    藉由以盆聚水、以繩滴灌的設計，提高植樹存活率。

    １５公升儲水量，可幫助樹苗度過最需守護的階段，以回收再生紙漿與天然可分解材料融合製作的樹盆，

    兼具蓄水力與防護力，可不斷蓄接雨水，呵護樹苗可長達一年，

    盆體可完全生物分解於土壤中，只為環境~留綠意、不留負擔！'
