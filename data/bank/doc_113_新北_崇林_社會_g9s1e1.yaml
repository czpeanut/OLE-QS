- id: doc_113_新北_崇林_社會_g9s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 「條條大路通羅馬」、「羅馬不是一天造成的」等諺語說明了羅馬建城的不容易及羅馬人的成就非凡，請問以下有關羅馬的歷史發展，何者敘述有誤？
  options:
  - label: A
    content: 西元前8世紀，拉丁人在義大利半島中部的臺伯河畔建立了羅馬城
  - label: B
    content: 羅馬的政治發展先後歷經了王政、共和與帝國三個時期
  - label: C
    content: 直到帝國時期，積極向外擴張，版圖正式橫跨歐、亞、非三大洲
  - label: D
    content: 承襲了希臘化文化，運用希臘化時代的科學知識興建許多公共建築，例如公路、競技場等。
