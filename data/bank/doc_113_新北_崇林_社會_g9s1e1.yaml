    labeled_by: ai
- id: doc_113_新北_崇林_社會_g9s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 叮噹聽著一首歌唱著:「你說要我/死了這顆心/最好永遠/存放在□□/像木乃伊/保持著神秘/敲也敲不破 連時間都忘記……木乃伊的心在燒/金字塔裡悶到老……木乃伊的心在跳/抱著希望慢慢熬/我鼓起/最後的一分力/撐下去/相信真愛/就在我醒來的新世紀。」請問：根據你所學過的內容判斷這首歌提到的歷史背景何者有誤？
  options:
  - label: A
    content: 這歌曲的創作靈感跟埃及古文明有關
  - label: B
    content: 金字塔是法老的陵墓，因為法老是以太陽神之子的身分統治人間，所以金字塔大多數都建造在河流的西岸，象徵太陽東升西落
  - label: C
    content: 當地發明遵循太陽週期的曆法是為了推算河流氾濫的時間，掌控農業的生產
  - label: D
    content: 因為崇拜太陽神相信人死後能復活，所以將屍體製作成木乃伊，以便復活時靈魂能和身體結合。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 歷史
      code: 1-2
      title: 埃及古文明
      chapter: 第1章 西亞與非洲的古文明
    textbook: 九上歷史 1-2 埃及古文明
    labeled_by: ai
- id: doc_113_新北_崇林_社會_g9s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 動畫《埃及王子》劇情中提到，摩西帶領族人離開埃及，想擺脫悲慘的奴隸生活重獲自由。在他們來到紅海之濱時，法老率領了軍隊前來追擊，正當大家陷入恐慌之際，上帝出現從天上投下火焰將埃及的軍隊阻擋在後。此時摩西將手杖插入海水中分開了紅海，大家便安全通過，然而在後追趕的埃及軍隊則被復原的海水淹沒。最後在摩西的帶領之下，一行人來到上帝的應許之地展開了新生活。請問：以下有關這部電影的歷史背景敘述，正確的有：(甲)摩西及其族人是希伯來人(乙)他們以上帝耶和華為唯一真神(丙)應許之地是指巴勒斯坦地區(丁)這就是世上唯一的一神信仰─猶太教的誕生
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙丙丁
  - label: C
    content: 甲乙丁
  - label: D
    content: 甲乙丙丁。
