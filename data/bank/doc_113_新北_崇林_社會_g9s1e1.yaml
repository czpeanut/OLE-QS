  type: single
  page: 2
  stem: 雅典的民主精神被後世效法，被視為民主政治的起源。請問若將雅典和今日的臺灣民主政治相比較，兩者共同的地方為？
  options:
  - label: A
    content: 不分性別，成年公民皆有參政權
  - label: B
    content: 以投票為主要選舉方式
  - label: C
    content: 官員皆有一定的任期
  - label: D
    content: 行政機關指的是內閣，須對人民負責。
