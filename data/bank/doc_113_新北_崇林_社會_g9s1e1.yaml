- id: doc_113_新北_崇林_社會_g9s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 「他們認為，人的身體中，最神聖的部位是嘴巴，因為食物從這裡進入，還可以讚頌經典；從神的口中出生的就是婆羅門；嘴巴下是強壯的手臂，他們負責戰役或是治理國家，也就是剎帝利；再下來就是腿的部分，這不是很好的部位，因為要支撐身體，所以吠舍要認真工作為上面的階級服務；最底下的是腳，每天都與泥巴髒污在一起，首陀羅就只能從事體力勞動和服務工作，缺乏社會地位和權利。」根據文中敘述，該制度的形成和特色，何者有誤？
  options:
  - label: A
    content: 這是人數較少的阿利安人為了維持統治地位，根據婆羅門教而發展出來的種姓制度
  - label: B
    content: 他們相信因果報應和靈魂輪迴，各種姓之間身分和職業是世襲而來
  - label: C
    content: 各個階級之間互不通婚，若不同階層通婚的子女，則會被排除在種姓之外，也就是賤民
  - label: D
    content: 婆羅門是最高階層，指的是祭司、僧侶等人，釋迦摩尼原本就是屬於此一階級。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 歷史
      code: 3-1
      title: 佛教的創立與傳播
      chapter: 第3章 普世宗教的發展
    textbook: 九上歷史 3-1 佛教的創立與傳播
