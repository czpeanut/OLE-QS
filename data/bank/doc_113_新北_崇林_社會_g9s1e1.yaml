- id: doc_113_新北_崇林_社會_g9s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 電影《特洛伊：木馬屠城記》劇情改編自史詩伊里亞德，背景是希臘城邦間的特洛伊戰爭，傳說這場戰爭起於三位女神爭論誰是最美麗的女人一事，後來因為特洛伊王子選擇了愛神，愛神便以斯巴達的王后回報他，讓兩人陷入了愛河。後來斯巴達的王后與特洛伊王子因相戀而私奔，導致希臘各城邦組成聯軍出兵特洛伊，此戰役打了持續十年之久。請問：根據你所學過的內容判斷以下有關此電影的歷史背景，何者敘述有誤？
  options:
  - label: A
    content: 著名的史詩伊里亞德是荷馬的作品
  - label: B
    content: 希臘神話中諸神和人一樣都有喜怒哀樂，成為西方文藝創作的重要靈感源頭
  - label: C
    content: 斯巴達以勇武著稱，重視紀律與服從因此武力強大
  - label: D
    content: 希臘聯軍出兵特洛伊時，會經過希臘文明的源頭─地中海。
  tags:
