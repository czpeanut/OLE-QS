- id: doc_113_新北_崇林_社會_g9s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 右圖甲~丁是四大古文明的位置，有關這些文明的敘述，何者有誤？
  options:
  - label: A
    content: 甲地因為有黃河和長江流域，水源充足、地勢平坦利於農耕，因此孕育了燦爛的文化成就
  - label: B
    content: 乙地因為多山、地形崎嶇，不利於統一所以形成許多城邦
  - label: C
    content: 丙地因地形平坦，缺乏天然的屏障，因此政權交替頻繁，從而創造出多元豐富的文化內涵
  - label: D
    content: 丁地雖然位於乾燥沙漠氣候，幸好有定期氾濫的河流可帶來肥沃的淤泥，因此有利於文明的進展。
  group_stem: 根據圖(一)回答第14~16題：
  shared_asset: g1_14_16
  tags:
    chapter:
