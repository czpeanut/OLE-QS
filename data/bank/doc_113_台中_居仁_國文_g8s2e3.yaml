  section: 6
  number: 57
  type: single
  page: 5
  stem: 下列何句最接近本文主旨？
  options:
  - label: A
    content: 自我是一種主觀意識，例如我喜歡什麼、我要什麼等
  - label: B
    content: 有自我才能活得有意義，不管做什麼都要活得有自我
  - label: C
    content: 一般人常常扭曲自我的概念，所以自我探索是必經之路
  - label: D
    content: 不論做什麼都要有自我，但須先掌握自我，再保有自我
  group_stem: "婚姻中該保有自我嗎？「自我」是一種內在、真實、統合的需求與感覺，我要什麼、感覺什麼、喜歡什麼、認為什麼是對錯是非，這個有主觀意識的東西就叫做自我。自我是一個人活得有意義的根本，在婚姻裡要有自我；當了父母也要有自我；不管做什麼都要有自我。\n\
    \  問題是，很多人堅持的東西並不是自我，反而是搞不清楚自我所以才那樣堅持。一個人想要掌握自我，需要經過許多的自我開發、修練、調整、探索。我們在做內在分析、精神分析，做自我的整合，有時是二、三十年的工作。一般人沒有去開啟這種心靈之旅，以為你想的東西就是自我，以為你要什麼就是自我，卻常常是一些扭曲和防衛。\n\
    \              （鄧惠文 婚姻中的自我矛盾）"
