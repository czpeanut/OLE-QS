  - label: D
    content: 認為評價人物的標準應該要一致
  group_stem: "太湖有漁戶嫁女者，舟至波心，風浪陡作，舵師失措，已欹側欲沉。眾皆相抱哭。突新婦破簾出，一手把舵，一手牽篷索，折戧①飛行，直抵婿家，吉時猶未過也。洞庭人傳以為奇。或有以越禮譏者，惠叔曰：「此本漁戶女，日日船頭持篙櫓，不能責以必為宋伯姬②也。」\n\
    \               ――節選自紀昀《閱微草堂筆記•太湖漁女》\n【注釋】①折(ㄕㄜˊ)戧(ㄑㄧㄤ)：船逆風揚帆行駛  ②宋伯姬：襄公三十年記載，宋國大火，宋伯姬嚴守婦女夜間不出室的禮法,終被燒死。"
