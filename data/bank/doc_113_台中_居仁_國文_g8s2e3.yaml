  - label: D
    content: 由專人監督製造，確保釀酒品質
  group_stem: '「仲冬之月，乃命大酋，秫稻必齊(ㄑㄧˊ) ①，麴蘖(ㄋㄧㄝˋ)②必時，湛熾③必潔，水泉必香，陶器必良，火齊(ㄐㄧˋ)④必得。兼用六物，大酋監之，毋有差貸(ㄊㄜˋ)⑤。」

    【注釋】

    ①齊：完備  ②麴蘖：釀酒中稱酒母，用來發酵

    ③湛熾：指釀酒時浸漬蒸煮米麴之事④火齊：火候  ⑤差貸：失誤'
