- id: doc_113_台中_居仁_國文_g8s2e3_s4_26
  section: 4
  number: 26
  type: single
  page: 1
  stem: 依據上文，劉基欲藉此寓言表達的旨意為何？
  options:
  - label: A
    content: 諷刺世人不識貨，徒將美玉當瑪瑙之愚昧無知
  - label: B
    content: 刻劃世人貪念的行徑，欲以偽亂真以滿足私慾
  - label: C
    content: 諷刺為政者無識人辨才之明，固執己見的心態
  - label: D
    content: 悲憫人無自知之明，常錯亂自己的角色與定位
  group_stem: "犁冥①之梁父之山，得瑪瑙焉，以為美玉而售之。人曰：「是瑪瑙也，石之似玉者也，若以玉價售，徒貽人笑，且卒不克售，胡不實之，雖不足爾欲，售矣。」弗信，則抱而入海。將之燕，適海有怪濤，舟師大怖，遍索於舟之人曰：「是必舟寶，而龍欲之耳。有則亟獻之，無惜，惜，胥②沒矣。」犁冥拊膺而哭，問其故，曰：「予實有重寶，今將獻之，不能不悲耳。」索而視之，瑪瑙也。舟師啞然，忘其怖而笑曰：「龍宮無子，不能識此寶也！」\n\
    \                             ――劉基《郁離子‧犁冥》\n【注釋】①犁冥：人名。「犁」通「黎」，意為黎明；「冥」即晚上。②胥，當副詞，「都、皆」之意。"
