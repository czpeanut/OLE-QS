  section: 6
  number: 51
  type: single
  page: 4
  stem: 由這篇短文中，以下哪個選項用來詮釋孔明的人物形象最為貼切？
  options:
  - label: A
    content: 裝神弄鬼
  - label: B
    content: 神機妙算
  - label: C
    content: 體弱多病
  - label: D
    content: 貪生怕死
  group_stem: 三國時期，諸葛亮六出祁山，北伐中原，但一直未能成功，終於在第六次北伐時，積勞成疾，在五丈原病死於軍中。為了不使蜀軍在退回漢中的路上遭受損失，諸葛亮在臨終前向姜維密授退兵之計。姜維遵照諸葛亮的吩咐，在諸葛亮死後，祕不發喪，對外嚴密封鎖消息。他帶著靈柩，祕密率部撤退。司馬懿派部隊跟蹤追擊蜀軍。姜維命工匠依諸葛亮模樣，雕了一個木人，羽扇綸巾，穩坐車中。並派楊儀率領部分人馬大張旗鼓，向魏軍發動進攻。魏軍遠望蜀軍，軍容整齊，旗鼓大張，又見諸葛亮穩坐車中，指揮若定，不知蜀軍又耍什麼花招，不敢輕舉妄動。司馬懿一向知道諸葛亮「詭計多端」，又懷疑此次退兵乃是誘敵之計，於是命令部隊後撤，觀察蜀軍動向。姜維趁司馬懿退兵的大好時機，馬上指揮主力部隊迅速安全轉移，撤回漢中。等司馬懿得知諸葛亮已死，再進兵追擊，為時已晚。
