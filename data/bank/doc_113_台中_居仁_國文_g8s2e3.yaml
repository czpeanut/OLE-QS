- id: doc_113_台中_居仁_國文_g8s2e3_s4_28
  section: 4
  number: 28
  type: single
  page: 2
  stem: 依據文本，下列文句的說明，何者正確？
  options:
  - label: A
    content: 「無麴即佳米珍黍，空造不成」，此指沒有好的米和珍貴的黍是無法釀製好酒的
  - label: B
    content: 「遂至失傳，則并蘗法亦亡」，用蘖釀造的方法一併失傳，是因以蘖釀製太繁瑣
  - label: C
    content: 「其入諸般君臣與草藥」，此處指麴藥中各種材料的配伍，麴藥為君，稻秸為臣
  - label: D
    content: 「南北不同，其義則一」，是指南北的釀酒方式雖然有不同，但原理則是一致的
  group_stem: "凡釀酒，必資麴蘖成信。無麴即佳米珍黍，空造不成。古來麴造酒，蘖造醴。後世厭醴味薄，遂至失傳，則并蘗法亦亡。凡麴，麥、米、麵隨方土造，南北不同，其義則一。凡麥麴，大、小麥皆可用。造者將麥連皮井水淘淨，曬乾，時宜盛暑天。磨碎，即以淘麥水和作塊，用楮葉包紮，懸風處，或用稻秸罨黃①，經四十九日取用。\n\
    \    造麵麴用白麵五斤、黃豆五升，以蓼汁煮爛，再用辣蓼末五兩、杏仁泥十兩，和踏成餅，楮葉包懸，與稻秸罨黃，法亦同前。其用糯米粉與自然蓼汁溲和成餅，生黃收用者，罨法與時日亦無不同也。其入諸般君臣與草藥，少者數味，多者百味，則各土各法，亦不可殫述。近代燕京則以薏苡仁為君，入麴造薏酒。浙中寧、紹則以綠豆為君，入麴造豆酒。二酒頗擅天下佳雄。\n\
    \                      ――宋應星《天工開物．酒母》\n【注釋】①罨黃：罨，音ㄧㄢˇ，覆蓋，捂蓋。罨黃，即捂蓋使其生出黃毛。"
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 國文
      code: 自學課一
      title: 軼事瑣聞大觀園──唐宋筆記選
