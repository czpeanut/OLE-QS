  section: 4
  number: 29
  type: single
  page: 2
  stem: 下列何者為作者行文的主要目的？
  options:
  - label: A
    content: 抨擊新婦拋頭露面的行為，極為可恥
  - label: B
    content: 鼓勵女子走出閨閣，展現一己之長
  - label: C
