- id: doc_113_台中_居仁_國文_g8s2e3_s4_27
  section: 4
  number: 27
  type: single
  page: 1
  stem: 下列敘述，何者並非文中孫泰所展現的風範？
  options:
  - label: A
    content: 樂善好施，不奪人所愛
  - label: B
    content: 安貧樂道，好行俠仗義
  - label: C
    content: 真誠磊落，不貪求意外財貨
  - label: D
    content: 娶妻不以貌取人，重義輕色
  group_stem: "孫泰，山陽人也，頗有古賢之風。泰妻即姨妹也。先是姨老矣，以二子爲託，曰：「其長①損一目，汝可娶其女弟。」姨卒，泰娶其姊。或詰之，泰曰：「其人有廢疾，非泰不可適。」\n\
    \    嘗市鐵燈臺而命洗刷，卻銀也。泰亟往還之。將家義興，用緡錢二百千置一別墅。於時睹一老嫗立新居前，長慟數聲。泰驚悸，召詰之。嫗曰：「老婦嘗事翁姑於此，子孫不肖，爲他人所有，故悲耳。」泰憮然久之，因紿②曰：「吾適得京書，已別除官③，不可住此，所居且命爾子掌之。」\n\
    \              ――改寫自李昉《太平廣記•卷第一百一十七》\n【注釋】\n①其長：大女兒\n②紿：音ㄉㄞˋ，欺騙\n③除官：授職、任官"
