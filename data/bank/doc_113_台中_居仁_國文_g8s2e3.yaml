- id: doc_113_台中_居仁_國文_g8s2e3_s6_59
  section: 6
  number: 59
  type: single
  page: 5
  stem: 本文所要傳達的主旨為何？
  options:
  - label: A
    content: 說明日本在生活中的便利與舒適
  - label: B
    content: 說明日本的歷史文化與細緻的產業分工
  - label: C
    content: 介紹日本人生活的富裕和鋪張
  - label: D
    content: 介紹在日本上洗手間的舒適感及尊嚴感
  group_stem: "第三次再見，我的感覺是：在日本，人活得很有尊嚴。這個國家提供了一切生活中可能需要或不需要的舒適和便利。生活中每一個細節，都有人，或是一種產品打點。這裡，你不需\n\
    要很有錢，也可以感覺被寵愛、被照顧。在這個極度產業化的社會，你卻很少感到膚淺或低俗。\n  就拿我和日本結緣的馬桶來說。在飯店，我見識到二十世紀的超級馬桶。馬桶上有各種按鈕和燈光，就像高級轎車的儀表板。我坐上去之前猶豫再三，深怕會觸電。向上沖水這種功能不在話下，有一個鈕一按，「馬桶蓋」會變成溫熱的。什麼樣的社會和思維，會覺得馬桶蓋必須在某些時刻是溫熱的？\n\
    \  當然，超級馬桶可能僅限於飯店，但就算在一般的公共場所，上洗手間也像上美容院，出來後你神氣得像剛剛得到加冕。在東京灣旁新開發的購物中心臺場的廁所裡，洗手臺上的肥皂管一壓，擠出來的竟是像整髮慕絲一樣的肥皂泡。這是什麼驚天動地的發明？不是！但擠出一坨慕絲，鼻子一下就聞到香味，手心立刻感到溫暖，洗手也就突然變得好玩。打開水龍頭，水源源不斷。不需要用力壓兩下，只流出兩滴水來。這樣的慷慨，自然讓人覺得愉快。手洗完了，怎麼弄乾？不是用會丟得滿地的紙巾，不是用噴風猛烈的烘乾機，而是用「烤」的。手放進烤箱槽中，暖空氣溫柔的把你的手烤乾，你有一種別人幫你修指甲的快感。\
    \        （王文華 我不是木村拓哉）"
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 國文
      code: 自學課二
      title: 面對假訊息，其實我可以這麼做
      chapter: null
    textbook: 八下 自學課二 面對假訊息，其實我可以這麼做
    labeled_by: ai
