  group_stem: 'Sleep Tight, Mr. Groundhog!

    Ms. Snake

    Hi, I''m Ms. Snake.

    I need the sun because I cannot keep my body warm. If I cannot see the sun, I
    spend the winter sleeping or resting. I often curl up under leaves or in the holes
    in the ground.

    Mr. Turtle

    Hi, I''m Mr. Turtle. Like my friend, Ms. Snake, I have to hibernate in winter,
    too. I stay at the bottom of the pond. I''ll stop eating before I fall asleep.
    But I''ll drink lots of water to keep my body at 4℃ to 5℃, or I may die.

    Mr. Groundhog

    Hi, I''m Mr. Groundhog. I start getting some sleep from late fall for about three
    months. I do not often have a deep sleep. Only when my body temperature drops
    to about 5℃, can I be in a deep sleep. So, I wake up quite often in winter!

    Miss Ladybug

    Hi, I''m Miss Ladybug. I hibernate in winter because it''s hard to find food.
