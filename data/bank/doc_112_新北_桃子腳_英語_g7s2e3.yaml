  stem: 49. What is recommended to people who want to visit the festival?
  options:
  - label: A
    content: Using the free festival bus service.
  - label: B
    content: Visiting the festival on the weekend.
  - label: C
    content: Entering Satyr’s Park from Fox Street.
  - label: D
    content: Parking in Garden Square and walking to the festival.
  group_stem: "(49-50)\nINFORMATION ABOUT THE 2021 GREEN FESTIVAL \n1. The 2021 Green\
    \ Festival will be held at Satyr’s Park from April 1 to May 31. \n2. You are welcome\
    \ to take the Free Festival Bus at the Goat Street Station to the festival. \n\
    3. You can also go to the festival by metro (get off at the Koala Street Station\
    \ or the Turtle Street Station) or  \nby bus (take No. 28, 103, 125, 157, 259,\
    \ 505, 908, or 1086). \n4. During the festival, Fox Street is closed; no cars\
    \ can enter the street. \n5. Garden Square won’t be open for car parking; there\
    \ will be a farmers’ market at the square during the festival. \n6. During the\
    \ festival, Faun’s Weekend Flower Market will be open every day from 8 a.m. to\
    \ 2 p.m. \n      enter 進入 recommend 推薦"
