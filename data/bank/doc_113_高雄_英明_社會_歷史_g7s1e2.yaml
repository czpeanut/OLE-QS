- id: doc_113_高雄_英明_社會_歷史_g7s1e2_s1_37
  section: 1
  number: 37
  type: single
  page: 2
  stem: 對於南島語族起源的看法，下列敘述何者正確？
  options:
  - label: A
    content: 資料一可看出南島語族是從菲律賓群島開始擴散
  - label: B
    content: 資料二可看出臺灣並非是南島語族擴散唯一途徑
  - label: C
    content: 資料一、二顯示出南島語族起源均與臺灣無直接關聯
  - label: D
    content: 資料三顯示南島語族的遷移路線與構樹分布沒有關聯。
  group_stem: '※以下是三則有關南島語族起源的資料。請回答37-38 題：

    資料一：南島語族從何處起源，多數的看法是大約五千年前，才開始從臺灣南下擴散到菲律賓群島，然後到婆羅洲、印尼東部，時間大約是在四千五百年前接著往東、西兩方擴散，東至馬利安那群島（關島、塞班島一帶）及南太平洋部分地區，時間約在三千二百年前，最後才擴散到中太平洋美拉尼西亞區域的加洛林群島一帶。

    資料二：中國社科院考古專家發現，海南島東南部海岸新石器時代遺址與臺灣同時期遺址十分相似，說明南島語系的起源和擴散應該涵蓋福建以南到南海北部灣沿海地區，即南島語系可能通過中國南方到中南半島，再擴散至太平洋諸島嶼，這為「南島語系多元路徑擴散論」提供了更多証據。

    資料三：臺灣俗稱「鹿仔樹」的構樹是東亞及中南半島常見的植物，而在近代文明傳入大洋洲島嶼前，南島語族在太平洋遍植構樹以取其樹皮經拍打製成「樹皮布」。構樹的分布，也標記出南島語族，構樹栽培與使用者的起點與遷移路線：從臺灣出發，沿著海路經過印尼、新幾內亞到大洋洲地區。'
  tags:
