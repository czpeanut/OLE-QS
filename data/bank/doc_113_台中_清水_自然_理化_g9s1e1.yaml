  section: 1
  number: 6
  type: single
  page: 1
  stem: 下列敘述，何者為洗衣機脫水原理？
  options:
  - label: A
    content: 利用旋轉產生的離心力，使水份向外沿離心方向濺射離去
  - label: B
    content: 水份與衣服的附著力提供旋轉時的向心力，當附著力不足以供應向心力時，水份無法維持圓周運動而沿切線方向離去
  - label: C
    content: 旋轉時，水份對衣物施以向內的向心力，於是衣物給予水份向外的反作用力，使水份離去
  - label: D
    content: 旋轉時，水份對衣物產生向內的摩擦力，於是衣物對水份產生向外的反作用力，逼迫水份離去
