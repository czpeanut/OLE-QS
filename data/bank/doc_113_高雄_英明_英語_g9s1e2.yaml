  group_stem: 'Formosa’s Newest Metro Line and Stations


    From August 1, New Formosa Metro (NFM) customers will be able to start using a
    new line. It includes four

    new stations: Hunter Square, Spring Hill, Sunny Park, and Formosa Airport. Besides,
    to make travel easier and

    faster for customers, there will be 15 trains in an hour at all stations during
    peak hours from August 1. After the

    new line and stations are open to the public, it will take just 10 minutes to
    travel from the airport to the park,

    about 15 minutes from the airport to Center Market, and 50 minutes from the airport
    to the train station, where

    customers can connect to other train lines.


    ◎NOTICE

    From August 1, the NFM Red Line will branch into two. The Red Line will

    provide a line from Formosa Train Station (R01) to Formosa Airport (R14)

    without switching trains at an interchange station. To customers who want to go
    to

    Brook Beach (R10), please make sure to switch trains at Center Market (R07).


