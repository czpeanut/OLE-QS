  group_stem: "Tortoises and Turtles \nHere is the picture of a tortoise and a turtle.\n\
    \nWhen looking at the picture, many people cannot tell tortoises and turtles.\
    \ People may think they \nlook just like each other. In fact, tortoises are turtles,\
    \ but not all turtles are tortoises. They are \nvery different in many ways.\n\
    \n| Living Places | Shell and Legs |\n|---|---|\n| Tortoises live on land and\
    \ most of them can be found in Asia and Africa. However, turtles live in salt\
    \ water, and people found them in Africa and America. One interesting thing is\
    \ that both turtles and tortoises lay eggs on the ground. | Tortoises have large\
    \ dome shaped shells and their shells are heavier, while turtles have flat, streamlined\
    \ and light shells. Light shells help turtles increase swimming speed. A tortoise's\
    \ legs are short and bent instead of being straight. A turtle's legs are webbed\
    \ and have long claws. |\n| **Diet** | **Lifespan** |\n| Most tortoises are herbivores.\
    \ They have plants and fruits for lives, while turtles can be both herbivores\
    \ and carnivores. Turtles eat fruits, vegetables, and small fish or shrimps. |\
    \ Tortoises can live about as long as humans, around 60-80 years. Some tortoises\
    \ can live for over 150 years. The longest living tortoise is 326 years. Unlike\
    \ tortoises, turtles can only live 20-40 years. According to the record, the oldest\
    \ turtle was 86 years. |\n\n**More to Know...**\nBoth are kept as pets, though\
    \ small turtles are more common to be pets. Tortoises are actually easier to care\
    \ for, but more expensive to own. Both of them need careful owners to take care\
    \ of them and the owners should be willing to keep them lifelong time.\n\nlay\
    \ 產卵 dome 半球形 shell 殼 streamlined 流線型的 bent彎曲的；不直的 webbed 有蹼的"
