  group_stem: "The other day, Renata felt a little weak and sick. She didn’t think\
    \ that staying home was the right thing to do, \nso she went to a doctor near\
    \ her apartment. \nThere were a lot of people there that day, but it didn’t take\
    \ Renata long to see the doctor. When the doctor \nasked her what was wrong with\
    \ her, she told him she had a bad cough, a headache, and a fever. After that,\
    \ he \nchecked her out and told her not to worry. At last, he gave her some medicine.\
    \ \n               Here is what it says on the bottle.  \n                 1.\
    \ Take one pill with water after each meal and before going to bed. \n       \
    \          2. Do not take the medicine with coffee, tea, milk, or other drinks.\
    \ \n                 3. If you suffer any side effects or don’t feel well after\
    \ taking the medicine, see your doctor    \n                   right away. \n\
    \                 4. If there is no change in how you feel after two days, talk\
    \ to your doctor and get his or her  \n                   help. \n        ➢Don’t\
