- id: doc_113_高雄_英明_英語_g9s1e2_s2_33
  section: 2
  number: 33
  type: single
  page: 3
  stem: 33. What does “strengthen” mean?
  options:
  - label: A
    content: To make something strong.
  - label: B
    content: To make something strange.
  - label: C
    content: To make something popular.
  - label: D
    content: To make something comfortable.
  group_stem: "Studies show that sleeping helps strengthen memories. When you learn\
    \ something new, the best way to \nremember it is to sleep on it. When you fall\
    \ asleep, your brain goes back through memories and decides what to \nkeep and\
    \ what not to keep. During a night of sleep, you go through light sleep, deep\
    \ sleep, and Rapid Eye \nMovement (REM). These stages happen about every ninety\
    \ minutes. Memories become stable during the deep \nstages of sleep. After that,\
    \ REM plays a role in saving and putting together all the memories. That is why\
    \ you \nmight come up with a plan to fix a problem after a full night of sleep.\
    \ Next time when you don’t know how to \nwork out a problem, just sleep on it.\
    \ \nHow to Have a Good Night’s Sleep \n \n    1.  Go to bed and get up at the\
    \ same time every day.            brain 大腦    REM 快速動眼期    \n2.  Sleep in a dark,\
    \ quiet, and comfortable room.                  stable 穩定 \n3.  Don’t use your\
    \ cellphone before bed. \n4.  A warm bath or reading before bed might help. \n\
    5.  Do exercise every day, but not right before bedtime. \n6.  Don’t eat a heavy\
    \ meal before bed."
