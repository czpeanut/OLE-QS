  section: 4
  number: 3
  type: single
  page: 2
  stem: Which does the poem NOT talk about?  poem 詩
  options:
  - label: A
    content: How the moon gets the light.
  - label: B
    content: A young girl's love for life.
  - label: C
    content: A mother's love for her daughter.
  - label: D
    content: Why the moon looks different at night.  why 為什麼
  group_stem: 'A girl asks her mom,

    "Why does the moon look different at night?

    One day, I see a bright moon like a round plate;

    Another day, I see a moon like a half pie.

    One day, the moon looks like a banana.

    And today, I cannot see it in the sky."


    Her mom says,

    "The moon is a shy princess.

    She doesn''t have any light of her own;

    She gets the light from the sun.

    She moves around the earth.

    Her places between the sun and the earth

    Give her different faces."


    The girl says, with a smile on her face,

    "I want to be like the moon.

    One day I can be a student,

    Another day I will be a lawyer,

    And someday I will be a mother like you."


    The mom says,

    "I''ll be your sun in the daytime,

    Giving you my warm heart.

    I''ll be stars around you in the nighttime,

    Watching you with my eyes."


     round 圓的 plate 盤子 shy 害羞的 princess 公主

    light of her own 她自己的光線 earth 地球 smile 微笑 lawyer 律師'
