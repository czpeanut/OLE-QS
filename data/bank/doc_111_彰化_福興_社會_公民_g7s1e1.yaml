  group_stem: ※閱讀以下文章：『……澳洲原住民是最早居住於澳洲的族群，但在白人移居澳洲後，以法律的形式推行「白澳政策」，將10萬名原住民兒童從父母親身邊強行帶走，送往白人的收容機構和寄養家庭，這種作法讓許多原住民家庭飽受骨肉分離的痛苦，被強行帶走的原住民兒童稱為「被偷走的一代」。20世紀以來，澳洲原住民一直飽受醫療、就業等不公平對待，直到新政府上臺後，才以國家名義向原住民道歉。此舉最重要的，是讓澳洲白人能正確認識，他們祖先曾經加諸原住民的不公不義，唯有誠心道歉，才有化解澳洲
