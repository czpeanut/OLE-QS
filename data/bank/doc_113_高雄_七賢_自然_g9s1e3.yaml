- id: doc_113_高雄_七賢_自然_g9s1e3_s1_48
  section: 1
  number: 48
  type: single
  page: 5
  stem: 關於驗電器，請問下列敘述何者正確？
  options:
  - label: A
    content: 當帶負電的塑膠棒靠近驗電器時，正電荷會往上端導體移動，負電荷會往下端金屬箔片移動
  - label: B
    content: 若將帶電體直接碰觸驗電器使驗電器帶電，兩金屬箔片會張開
  - label: C
    content: 以帶正電或帶負電的帶電體靠近不帶電的驗電器，兩金屬箔片張開和閉合的狀況剛好相反
  - label: D
    content: 將驗電器的金屬箔片換成塑膠薄膜，因重量更輕，帶電體靠近時打開的角度會更明顯。
  group_stem: "請閱讀下列文章後，回答問題48-50題：\n        驗電器是一種檢測物體是否帶靜電以及粗略估計帶電量大小的儀器，它的構造如附圖所示，最上端是導體電極（一般為金屬），在玻璃罩內部的最下端裝有兩片很輕的金屬箔片。若驗電器不帶電，且沒有帶電體靠近上方導體時，兩金屬箔片會呈現閉合的狀態（夾角=0°），當拿帶電體靠近上方導體時，驗電器上端導體與下端金屬箔片會產生不同電性的電荷分布，兩個箔片因所帶電荷的電性相同產生排斥，會呈現張開的狀態（夾角＞0°）兩箔片間排斥的靜電力愈大，張開的夾角愈大而將帶電體移開後，箔片又會恢復閉合。小毅以毛皮摩擦過的塑膠棒靠近驗電器做實驗，測量兩金屬箔片張開的角度，實驗結果如附表所示。\n\
    \n| 實驗編號 | 甲 | 乙 | 丙 | 丁 | 戊 |\n| :--- | :---: | :---: | :---: | :---: | :---:\
    \ |\n| 毛皮和塑膠棒摩擦次數(次) | 5 | 10 | 20 | 5 | 5 |\n| 塑膠棒和驗電器的距離(公分) | 15 | 15 | 15\
    \ | 10 | 5 |\n| 兩金屬箔片張開的夾角(°) | 5 | 9 | 12 | 7 | 10 |"
  shared_asset: g1_48_50
  tags:
    chapter:
      publisher: 翰林
      book: 九上
