- id: doc_113_新北_永和_國文_g7s2e3_s5_6
  section: 5
  number: 6
  type: single
  page: 2
  stem: 關於〈謝天〉ㄧ文，下列敘述何者正確？【L9】
  options:
  - label: A
    content: 本文運用夾敘夾議的寫作手法，文中主旨和「不經一番寒徹骨，焉得梅花撲鼻香」相同
  - label: B
    content: 藉由與同事貝索的討論，提出「為何要謝天」疑問，全文在反覆思辯中重新詮釋「謝天」涵義
  - label: C
    content: 創業的人都會自然而然的想到上天，是因為體會到「盡人事聽天命」的道理
  - label: D
    content: 生活中便利、成功的果實，都來自於眾人的協助與合作，即「一日之所需，百工斯為備」
  lesson_raw:
