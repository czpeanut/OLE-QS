  group_stem: "※請閱讀以下作品，並回答36 ～ 37 題：\n完美的湯瑪士迴旋[1]來自堅持苦練\n  西元二O 二三年八月，成都世大運男子競技體操鞍馬項目，\
    \ 二十七歲的臺灣「鞍馬王子」李智凱以15.500 分，\n第三度贏得金牌，也創下世大運鞍馬三連霸紀錄。鞍馬在上場時間只有幾十秒鐘，他卻苦練超過二十年，付出了無\n\
    數汗水、淚水。\n  李智凱六歲時，被教練林育信發掘，開始學習體操。接受訓練後，每當跟媽媽在市場賣菜時，他常展示體操動作\n吸引顧客，被暱稱為「菜市仔凱」。二OO\
    \ 五年上映的紀錄片翻滾吧！男孩，記錄了李智凱和同學在國小體操隊訓練\n的故事。\n   體操訓練極為艱苦，不僅是流汗，拉筋痛到流淚，各種翻滾動作練習時不慎造成瘀青、破皮、挫傷、摔傷，更\n\
    是常有的事。在二O 一六年里約奧運前不久， 二十歲的李智凱還因受傷骨裂，必須打上鋼釘。但傷癒後，他立即\n回到訓練場上。\n   運動員要長期維持最佳狀態，是很困難的事。多年以來，李智凱每週訓練六天。即使新冠疫情期間，許多賽事\n\
    停辦，他仍毫不鬆懈，不斷練習以湯瑪士迴旋為基礎的高難度動作。\n   正因如此， 二十年來的堅持，使他成為臺灣最傑出的體操選手之一。他的招牌動作湯瑪士迴旋，被國際體操總\n\
    會列為教案。二O 二一年，他在東京奧運贏得的鞍馬銀牌，是臺灣第一面奧運體操獎牌。二O 二三年，還創下世大\n運三連霸紀錄。同年九月，他不負眾望，再度勇奪杭州亞運金牌。\n\
    \   李智凱以積年累月的鍛鍊和自我挑戰、追求卓越的態度，只為了在場上的幾十秒內能展現超完美動作，這正是\n體操選手堅毅不屈的精神。           \
    \                                              ----改寫自國語日報\n注釋：[1]湯瑪士迴旋：以美國知名體操運動員庫爾特·湯瑪斯（Kurt\
    \ Thomas)所展現的鞍馬姿勢命名。此方式有別於傳統鞍\n         馬項目，不以併腿為主，而是分腿全旋擺動，仰賴手臂和腰部力量支撐大幅擺動的身體。"
