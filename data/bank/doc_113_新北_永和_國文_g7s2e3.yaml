- id: doc_113_新北_永和_國文_g7s2e3_s4_2
  section: 4
  number: 2
  type: essay
  page: 1
  stem: "2.陳之藩〈謝天〉一文中，作者體悟到「功成不居」的道理，請根據下列題目回答相關問題。\n  題目：小明在校慶運動會中，以關鍵的棒次幫助班上拿下接力賽第一名。賽後同學們都大聲歡呼，小明卻只是笑著\n\
    \        說：「感謝天，我終於追回落後的距離﹗」\n（1）題目中小明說的「感謝天」是想表達什麼態度？（  4  ）\n  \n（2）小明「雖然成功，但不驕傲」，請將適合形容這種態度與精神的成語或句子，寫出一句即可（\
    \  5  ）"
  lesson_raw:
    number: 第9課
    title: 謝天
    basis: 題目明確提到陳之藩〈謝天〉
