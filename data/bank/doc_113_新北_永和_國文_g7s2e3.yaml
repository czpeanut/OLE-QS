  group_stem: "※請閱讀以下短文，並回答 30 ～ 31 題：\n   齊人有好詬[1]食者，每食必詬其僕，至壞器[2]投匕[3]箸，無空日。館人[4]厭之，忍弗言。將行，贈之以狗，曰：\n\
    「是能逐禽，不腆[5]以贈子。」行二十里而食，食而召狗與之食。狗嗥[6]而後食，且食而且嗥，主人詬於上，而狗嗥\n於下，每食必如之。一日，其僕失笑，然後覺。郁離子曰：「『夫人必自侮而後人侮之。』又曰：『飲食之人，則人賤之。』\n\
    斯人之謂矣。\n注釋：[1] 詬：責罵。[2] 至壞器：甚至摔壞容器。[3] 匕：音ㄅㄧˇ，湯匙。[4] 館人：負責招待賓客食宿的人，指旅館\n主人。[5]不腆：不豐厚。通常為贈人禮物的謙詞。[6]嗥：吼叫。"
