- id: doc_113_新北_永和_國文_g7s2e3_s5_23
  section: 5
  number: 23
  type: single
  page: 3
  stem: 「專家指出：先天就具有某方面特殊才能的人並不存在，就如同沒有人是一生下來就可以當上總裁、投資高手或棋王的道理一樣，這樣的豐功偉業，背後不但需要長期的心力投入，還要特別的堅忍與毅力。巴菲特就是一個很典型的例子，若沒有花費大量時間研讀目標投資公司的財務報表，就不可能成就他著名的投資法則。」這段文字的含義與下列何者最接近？【綜合】
  options:
  - label: A
