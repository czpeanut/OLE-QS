  number: 4
  type: single
  page: 1
  stem: 下列選項「     」中的成語，何者運用最恰當？【綜合】
  options:
  - label: A
    content: 他對流浪動物毫不關心，視之如「白雲蒼狗」，不屑一顧
  - label: B
    content: 兩軍對陣「天馬行空」，人人臉上盡是肅殺之氣，激戰恐難以避免
  - label: C
    content: 飛機航班因故取消，我才躲過當地大地震的劫難，真是「事在人為」
  - label: D
    content: 他每次發表意見總是滔滔不絕，又「不容置喙」，我看沒人勸得了他
