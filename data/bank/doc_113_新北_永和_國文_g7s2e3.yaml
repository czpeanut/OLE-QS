    content: 吾嘗終日而思矣，不如須臾之所學也
  - label: C
    content: 學而不思則罔，思而不學則殆
  - label: D
    content: 學然後知不足，教然後知困
  group_stem: "※請閱讀以下作品，並回答 28 ～ 29 題：\n甲、行衢道者不至，事兩君者不容。目不能兩視而明，耳不能兩聽而聰。螣蛇[1]無足而飛，鼫鼠[2]五技而窮。\
    \   \n                                                                       \
    \            ——荀子〈勸學〉\n乙、心理學家艾瑞克森研究發現，沒有疏於練習就能成為頂尖好手的天生演奏家。真正的專精，至少必須經過一\n萬小時的修練。從「平凡」到「超凡」，關鍵字就是「一萬個小時」。\n\
    \     「一萬小時成功論」不只用在一般人，連「神童」莫札特也不例外。歷史記載他六歲就會作曲，天才的解析\n書中指出：莫札特最早的七首鋼琴協奏曲，大抵是改編其他作曲家的作品而成，而能展現他原創精神最早的\n\
    一首經典作，是他二十一歲時寫的第九號鋼琴協奏曲，雖然看起來很年輕，其實當時他也持續創作協奏曲長\n達十年了。                       \
    \             ——〈career 職場情報誌 一萬小時：成功的秘密數字〉\n注釋：[1] 螣蛇:在中國古代文獻中泛指能飛行的蛇，能興霧乘雲，為中國古代的神獸之一。\
    \ [2] 鼫鼠:即梧鼠。"
