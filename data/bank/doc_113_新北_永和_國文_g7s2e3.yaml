  number: 2
  type: single
  page: 1
  stem: 下列各組「 」中的字音，何者讀音兩兩相同？【綜合】
  options:
  - label: A
    content: 在「詢」問事故原因後，大家對「殉」職的英雄充滿敬意
  - label: B
    content: 他寫文章總是反覆修改，字「斟」句酌，如還有冗詞贅字真是情何以「堪」
  - label: C
    content: 巡「弋」飛彈在空中拖「曳」尾焰，猶如流星直奔向目標
  - label: D
    content: 這首樂曲經由魯賓斯坦的詮「釋」，演「繹」出全新風格
  tags:
