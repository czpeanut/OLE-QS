  section: 5
  number: 5
  type: single
  page: 2
  stem: 根據〈記承天夜遊〉，當時蘇軾和張懷民最有可能看到下列何種景色？【L7】
  options:
  - label: A
    content: 月光與池水相互輝映成趣，波光粼粼
  - label: B
    content: 竹子和柏樹在夜風中搖曳，引人入勝
  - label: C
    content: 弦月高掛夜空，滿天星斗閃爍如珍珠
  - label: D
    content: 明月映照窗櫺，孟冬夜色如潑墨山水
