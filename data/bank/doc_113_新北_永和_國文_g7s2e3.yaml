    content: 纏綿病「ㄊㄚˋ」／糟「ㄊㄚˋ」糧食
  - label: B
    content: 夙夜匪「ㄒㄧㄝˋ」／沆「ㄒㄧㄝˋ」一氣
  - label: C
    content: 如虎添「一ˋ」／神采「一ˋ」「一ˋ」
  - label: D
    content: 怒不可「ㄜˋ」／「ㄜˋ」止犯罪
