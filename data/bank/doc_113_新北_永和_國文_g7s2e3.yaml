    content: 己所不欲，勿施「於」人／苛政猛「於」虎
  - label: B
    content: 脫「穎」而出／聰「穎」絕倫
  - label: C
    content: 「嶄」新生活／「嶄」露頭角
  - label: D
    content: 念無「與」樂者／相「與」步於中庭
