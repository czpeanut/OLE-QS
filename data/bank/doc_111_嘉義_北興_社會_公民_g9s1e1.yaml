  stem: '「以胰島素來說，為何完全一樣的藥在加拿大的售價是美國的十分之一？」美國聯邦參議員伯尼．桑德斯指出美國胰島素歷年來的價格變化，並譴責藥廠的貪婪。根據美國雜誌的調查，美國有
    58.5％的破產主因是醫藥花費，44.3％是疾病導致工作損失，總計有六成的破產原因與醫療疾病相關。因此，桑德斯在 2016 和 2020 年的總統大選，都把可負擔的醫療保健政策做為競選主軸，呼籲大家關注不合理藥價的議題。（資料來源：美國胰島素貴10
    倍桑德斯怒斥藥廠貪婪，中央廣播電臺，2019/07/29。）

    假設：美國國會通過法令要求胰島素的價格應該降低為原價格的十分之一，則廠商願意生產的胰島素數量應該會產生何種變化？（★愈多表示數量愈多）'
