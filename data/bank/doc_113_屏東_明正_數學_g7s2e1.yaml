  stem: (1) 高雄打狗與台北天龍的勝差為何？(2 分)
  group_stem: '1. 勝差或稱勝場差，是一種體育術語，常見用來反應一支領先團隊（或個人）和另一團隊（或個人）之間的成績差距方式，以半場為一單位。

    計算公式為：

    勝差＝[（球隊 A 的勝場數－球隊 B 的勝場數）＋（球隊 B 的敗場數－球隊 A 的敗場數）]∕2

    例如：甲隊 46 勝 20 敗 乙隊 45 勝 23 敗 丙隊 39 勝 29 敗

    甲隊與丙隊的勝差＝ [（46－39）＋（29－20）]∕2＝8

    今某職業運動排名前兩名跟後兩名戰績如右：


    | 排名 | 隊名 | 出賽場次 | 勝 | 敗 |

