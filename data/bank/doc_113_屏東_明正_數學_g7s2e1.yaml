    | 2 | 高雄打狗 | 82 | 52 | 30 |

    | | …………中間省略………… | | | |

    | 7 | 苗栗石虎 | 82 | 25 | 57 |

    | 8 | 台北天龍 | 82 | 21 | 61 |


    試求:'
