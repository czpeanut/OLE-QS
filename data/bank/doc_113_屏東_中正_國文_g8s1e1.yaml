- id: doc_113_屏東_中正_國文_g8s1e1_s5_1
  section: 5
  number: 1
  type: single
  page: 4
  stem: 根據本文，下列何者是作者認為看待每一次輸贏應有的態度？
  options:
  - label: A
    content: 知己知彼，屢敗屢戰
  - label: B
    content: 自信滿滿，每戰須捷
  - label: C
    content: 力求表現，恃才傲物
  - label: D
    content: 盡己之能，俯仰無愧
  group_stem: "人生就像一個戰場，我們得時時面對不同的考試與挑戰，你怎樣看待每一次的輸贏呢？\n    這是美國著名的足球教練比爾．伯倫特在紐約的一所大學擔任足球教練時發生的故事。有一次比爾帶領該校球隊參加州際盃大賽，由於該校的足球並不強，因大家並不看好該球隊，就連球員本身也沒有信心。\n\
    \    有球員在賽前對他說：「教練，所有的球隊都說我們會輸掉比賽。」\n    一旁的另一位球員也說：「對啊！昨天還有一位體育記者自信滿滿地說，我們至少會輸五分以上，否則他會自殺謝罪。」\n\
    \    比爾並沒有說什麼，催促大家早早入睡以儲備體力。\n    凌晨一點多，比爾叫醒所有球員而會議廳集合。比爾雙手握拳，聲音有力地說：「大家是不是都聽到了種種對我們嘲笑的消息？甚至說我們至少輸五分以上。」球員們都點頭表示聽到了\n\
    \    比爾接著說：「但我偏不信邪，讓我們用比賽好好去教訓一下那些人，大家贊同嗎？」大家聽了後都熱血沸騰，一致點頭同意。全隊充滿了從未有過的戰鬥意志。\n\
    \    你是不是急著想知道，「那麼比賽的結果如何？」\n    比爾的球隊還是輸了，但只輸三分，他們雖然還是輸了比賽，但卻贏得許多人的讚賞與自我的自信心，換個角度來說，他們就是勝利者！\n\
    \                                                               （節錄向網路文章〈輸贏之間〉）"
  tags:
    textbook: 八上 第六課 不要放棄你的夢想
    labeled_by: ai
    chapter:
      publisher: 康軒
      book: 八上
      subject: 國文
      code: 第六課
      title: 不要放棄你的夢想
      chapter: null
