    任何一個早年離鄉的遊子在思鄉時都有一種兩重性：他心中的家鄉既具體又不具體。具體可具體到一個河灣，幾棵小樹，半壁蒼苔。若僅僅如此，焦渴的思念完全可以轉換成回鄉的行動。然而真的回鄉又總是失望，天天縈繞我心頭的一切原來是這樣的嗎？就像在一首朦朧的名詩後突然看到一幅逼真的插圖，詩意頓消。因此，真正的遊子是不大願意回鄉的，即使偶爾回去一下也會很快出走，走在外面又沒完沒了地問自己，家鄉究竟在哪裡。

