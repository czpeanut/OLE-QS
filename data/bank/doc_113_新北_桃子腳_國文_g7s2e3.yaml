  stem: 關於本闋詞的文意說明，下列敘述何者有誤？
  options:
  - label: A
    content: 「莫聽穿林打葉聲，何妨吟嘯且徐行」的「莫聽」、「吟嘯」，隱含著作者坦然面對人生橫逆的豪情
  - label: B
    content: 「竹杖芒鞋輕勝馬」意謂即便只有拄著竹杖，穿著草鞋，走在雨中的泥地上卻比騎馬還要輕快
  - label: C
    content: 從「雨具先去，同行皆狼狽，余獨不覺」和「誰怕？一蓑煙雨任平生」兩處中的「余獨不覺」和「蓑」字，可知東坡具有「未雨綢繆」的智慧
  - label: D
    content: 「回首向來蕭瑟處，歸去，也無風雨也無晴」隱含東坡經歷人生風雨後，心境已昇華到忘懷得失的境地。
  group_stem: '丙、

    三月七日，沙湖(1)道中遇雨。雨具先去，同行皆狼狽，余獨不覺。已而遂晴，故作此。

    莫聽穿林打葉聲，何妨吟嘯且徐行。竹杖芒鞋輕勝馬，誰怕？一蓑煙雨任平生。料峭(2)春風吹酒醒，微冷，山頭斜照卻相迎。回首向來蕭瑟處，歸去，也無風雨也無晴。

