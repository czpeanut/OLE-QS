    以海洋潮間帶及水深十多米處為生長地的寄居蟹，已經越來越難生存了，台北市動物園自然生態保育調查小組最近到海岸線觀察生態狀況時，意外在墾丁海邊，發現寄居蟹以漂白水瓶蓋、酒瓶瓶蓋、烤肉醬瓶蓋當成新家，而且寄居蟹的數量比起五年前明顯少了許多。

    台北海洋館表示，這情形確實很普遍，許多民眾到沙灘撿拾貝殼後，如果發現寄居蟹，有的就會把寄居蟹帶回去養，結果只有鹽跟水混合的水，沒有其他海洋物質的環境，很快就讓寄居蟹「玩完」了。

