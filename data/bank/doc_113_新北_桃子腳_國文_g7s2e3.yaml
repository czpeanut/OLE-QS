  group_stem: '庚、

    在寒假的一個清晨，我和朋友背起背包，踏上了前往泰國首都曼谷的自助旅行之路。這是我第一次離開亞洲的華語圈國家，也是第一次嘗試自己安排所有行程、住宿與交通。心情既興奮又忐忑，但更期待在這座被稱為「微笑之都」的城市裡，找到屬於自己的旅行節奏。


    第一站：在廟宇與歷史中穿梭

    我們的行程從曼谷最經典的大皇宮與玉佛寺開始。清晨的陽光灑落在金光閃閃的屋頂與尖塔上，映出一種莊嚴又神秘的氣息。穿著長裙與袖子的我們，在炙熱的氣溫中慢慢參觀，但內心卻無比充實。接著，我們步行到臥佛寺，看見那尊金色巨大的臥佛，靜靜地躺在長廊中，彷彿在訴說著泰國人對佛教的虔誠。


    第二站：市集、街頭與在地生活

    在曼谷，自助旅行最吸引人的部分，莫過於市集與街頭美食。我們來到了洽圖洽市集，那是一個彷彿永遠逛不完的購物迷宮。從手工藝品、古著衣服、香氛皂、泰式點心，到可愛的貓咪咖啡廳，應有盡有。午餐我們選擇在市集內的路邊攤點了一碗船麵，湯頭香濃、份量剛好，只花了30
    泰銖，便宜又好吃。

    晚上，我們搭乘嘟嘟車前往唐人街覓食，途中被司機載得七拐八拐，雖然有點迷路，但也因此意外發現幾家當地人才知道的甜品店。熱熱的芒果糯米飯配上冰冰的椰奶，成了這趟旅程中我最懷念的味道之一。


    第三站：摩登與傳統的交會點

    除了古蹟與市集，曼谷的現代面貌也令人驚艷。我們造訪了王權瑪哈納功大廈，那座有著「不規則玻璃切角」設計的摩天樓。走上SkyWalk 玻璃觀景台，整座城市盡收眼底，遠方的昭披耶河緩緩流過，車水馬龍與高樓林立之間，有一種混亂卻迷人的節奏。

    晚上回到住宿的沙吞區，我們在巷弄間找到一間隱密的泰式按摩店，讓疲憊的雙腳好好放鬆。自助旅行最棒的，就是能依自己的步調安排一切，累了就休息，餓了就吃，沒有壓力、沒有催促。


    旅行的意義，在於感受當下

    短短五天四夜的曼谷之旅，在笑聲與汗水中畫下句點。回想這趟自助旅行，雖然曾迷路、也曾因語言不通手忙腳亂，但更多的是與朋友的默契配合、與當地人的真誠互動，以及對異國文化的深刻體會。


    曼谷，這座融合了佛教傳統與現代節奏的城市，用它的多元與熱情，給了我一段難忘的記憶。而我，也在這場自由的旅行中，學會了更勇敢地面對未知，更自在地走出自己的道路。

    （ChatGPT

    微笑之都的自由節奏──我的曼谷自助旅行記）'
