- id: doc_113_新北_桃子腳_國文_g7s2e3_s2_39
  section: 2
  number: 39
  type: single
  page: 5
  stem: 依據甲文，大江健三郎對老師的定義，可以和乙文文句中哪一句互相呼應？
  options:
  - label: A
    content: 生而知之
  - label: B
    content: 傳道
  - label: C
    content: 受業
  - label: D
    content: 解惑。
  group_stem: '戊、

    【甲】

    所謂的老師，本來，至少如柏拉圖的米諾以來所認定，並不是一個知道怎麼去教未知者的人，而是可以把學生心中的某個問題，重新再創造出來弄清楚，以此為工作的人。為了達到這個目的，他的策略是把學生無法用言語說清楚但是知道的事情，由他來再作確認。他們所專擅的事情是把人們心中壓抑著，阻礙對真知更了解的各種力量，將之破壞。這就是為何老師要比學生問更多問題的理由。

    （節錄自大江健三郎 為什麼孩子要上學）

    【乙】

    古之學者(1)必有師。師者，所以傳道、受業、解惑也。人非生而知之者，孰能無惑？惑而不從師，其為惑也(2)終不解矣！

    生乎吾前，其聞道也，固先乎吾，吾從而師之(3)；生乎吾後，其聞道也，亦先乎吾，吾從而師之。吾師道(4)也，夫庸知其年之先後生於吾乎(5)？是故無貴無賤、無長無少，道之所存，師之所存也。

    （節錄自韓愈 師說）

    【注釋】

    (1)學者：此指學習的人。

    (2)其為惑也：指那些疑惑的問題。

    (3)吾從而師之：我跟從他學習。

    (4)師道：學習道理。

    (5)夫庸知其年之先後生於吾乎：指何必過問他們年齡比我大或小呢？'
