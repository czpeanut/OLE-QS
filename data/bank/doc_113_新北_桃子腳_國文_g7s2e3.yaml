- id: doc_113_新北_桃子腳_國文_g7s2e3_s2_31
  section: 2
  number: 31
  type: single
  page: 4
  stem: 依據文意，許多人依賴寵物的主因為何？
  options:
  - label: A
    content: 總有許多批評
  - label: B
    content: 獲得許多支持
  - label: C
    content: 不懂與人交往
  - label: D
    content: 可以隨心所欲。
  group_stem: '甲、

    朋友的寵物死了，哀痛逾恆，幾乎不能工作，有一個嘴快的朋友勸她說：「不要這麼難過，不過是隻狗而已。」她大怒，拂袖而去。朋友不解地對著我們說：「我錯了嗎？我錯了嗎？難道大黃不是一隻狗嗎？」

    許多養寵物的人的確把寵物當孩子看待，連對牠們講話的方式都相似，但是最主要的是寵物無條件的接納與效忠主人。朋友說，她一下班，還未進門，大黃的尾巴就搖得像電風扇一樣，待她一進門，大黃就撲上前來歡迎她，舔她的手，圍著她轉，讓她知道牠是多麼高興她回來了；她心情不好時，大黃會靜靜地偎著她聽她訴苦，不會跟她說：「我早就告訴過妳了，誰叫妳不聽我的話。」她出門時更不會嫌她穿著不得體，化妝太濃……換句話說，大黃給她的只有支持，沒有批評。其實，我們應該要好好檢討一下為什麼人不如狗，我們眼中常常只看到別人的缺點，不能全心全意去接受別人對我們的好，更不能全心全意去回報人家。

    美國現在有許多州用狗來幫助閱讀有障礙的孩子，效果非常好，雖然狗不識字，不能糾正孩子的錯誤，但是狗兒靜靜地聽孩子朗誦課本，一遍，兩遍，三遍，絲毫不露出不耐煩的表情，更不會因為孩子犯錯而吹鬍子瞪眼睛，讓孩子心生恐懼。一個孩子說得好：「狗狗不會咬牙切齒地罵我為什麼這麼笨。」

    孩子是很敏感的，大人臉上細微的不耐煩表情，他們馬上可以感受到。孩子其實像寵物一樣，都很希望取悅大人，或許我們應該反省一下，為什麼我們對跟自己有血緣關係的子女的接納程度，會不及一個沒有血緣關係的寵物？

    （節錄自洪蘭 為什麼人不如狗）'
