  stem: 胡適和陳之藩是忘年之交：「陳之藩打算出國留學，可是缺乏旅費和保證金，胡適當時在美國得知此事，便匯來兩千四百美元。陳之藩赴美後，兩年內分期還清了這筆錢。胡適收到錢後說：「我借出的錢，從來不盼望收回，因為我知道我借出的錢總是『一本萬利』，永遠有利息在人間。」由文中可知兩人的友誼，胡適最後說的這句話，主要意涵為何？
