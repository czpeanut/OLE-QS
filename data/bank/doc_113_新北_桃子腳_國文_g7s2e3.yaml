  section: 2
  number: 37
  type: single
  page: 5
  stem: 「經過如此嚴苛的挑選，能夠倖存的印第安孩子，當然個個身強體壯，驃悍過人。……藉由這樣殘酷成年禮的鍛鍊，而成為族中公認的真正勇士。」依此段文字，無法推知下列何者？
  options:
  - label: A
    content: 印第安人對於剛出生的孩子較為仁慈
  - label: B
    content: 想成為公認的勇士，就必須通過成年禮考驗
  - label: C
    content: 考驗孩子與勇士的方法基本上都以能否存活為主
  - label: D
    content: 這樣挑選下一代的方式決定了印第安族的驃悍強壯。
  group_stem: '丁、

    印第安人的種族之所以能夠驃悍強壯，與他們挑選下一代的方式有極大的關係，也就是流傳於印第安人部落中的「土法優生學」。

    據說，印第安人部落中，若是有嬰兒出生，這個嬰兒的父親會立即將孩子攜至高山上，選擇一條水流湍急，而且水溫冰冷的河流，將嬰兒放在特製的搖籃當中，讓嬰兒及搖籃隨著河水漂去。而這個新生兒的父親及族人們，則在河流的下游處等候，待放著嬰兒的特製搖籃漂到下游時，他們會檢視籃中的嬰兒是否仍然活蹦亂跳。

    如果嬰兒還活著，證明他的生命力堅強，具備成為他們族人的條件，便將之帶回部落中妥善養育成人。若是籃中的嬰兒禁不起這般的折騰，發生不幸，他們則將嬰兒及搖籃放回河流當中，任其漂流而去，形同河葬。經過如此嚴苛的挑選，能夠倖存的印第安孩子，當然個個身強體壯，驃悍過人。

    這只是印第安一般族人的篩選方式，至於印第安人部落中勇士的挑選，則要更為嚴厲。印第安人有所謂的成年禮，當一個印第安男孩成長到合適的年齡時，族人會為他舉行成年禮，在狂歡舞蹈慶賀之後，這個男孩將會被族人親手綁在森林中的一棵大樹上，獨自一人度過成年禮的夜晚。

    森林中多的是毒蛇猛獸，即將成為印第安勇士的男孩在成年禮的這個夜晚，必須面對各種各樣的危險，藉由這樣殘酷成年禮的鍛鍊，而成為族中公認的真正勇士。

    大自然的法則是「弱肉強食，適者生存」。印第安人的「土法優生」雖然殘忍，但也是強化民族素質的一個手段。

    （節錄自名言佳句小百科 適者生存）'
