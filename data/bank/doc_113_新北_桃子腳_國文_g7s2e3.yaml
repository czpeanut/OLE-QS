- id: doc_113_新北_桃子腳_國文_g7s2e3_s2_42
  section: 2
  number: 42
  type: single
  page: 6
  stem: 下列何者最能概括本文的主旨？
  options:
  - label: A
    content: 教師轉職潮讓教育體系煥然一新
  - label: B
    content: 傳統學校應全面被補習與AI 取代
  - label: C
    content: 家長普遍支持教師罷工，教育不再重要
  - label: D
    content: 沒有學校老師的社會，帶來了難以預料的問題。
  group_stem: '己、

    那天是小島人生中第一個小學開學日，她興奮地牽著我的手，問著關於學校的問題——有幾個同學？能玩跳繩嗎？有沒有圖書館？

    但我卻說不出話。因為那所學校，已經空了。不只那所，是全國的校園都空了。

    一場全台教師罷工，讓所有學校停課。起初，社會上竟是一片掌聲：

    「早就想轉補習班了！」

    「AI 老師取代真人更有效率！」

    「終於不用再忍受那些不適任老師！」

    留言區裡，有家長控訴老師罵學生，有人說補教名師才是真專業。不久，補習班爆滿，家長排隊卡位。有人搶不到，抱怨安親班漲價、名額難求，雙薪家庭更是焦頭爛額。

    「本來以為可以不用再面對學校老師，現在才知道補習班也有教不好的時候。」

    補教老師因為人手不足而快速招募，教學品質參差不齊。孩子一整天從早到晚被塞滿課程，卻沒有人蹲下來說：「你今天累了沒關係。」

    有人問：「那你們家怎麼自學？」

    回答是：「我們時間自由，有點積蓄，也準備很久。」

    大家沉默了，因為這樣的條件，不是多數人能擁有。

    與此同時，老師們轉行了——成為工程師、教材編輯、創業者……沒有人再回教室。

    政府開始慌張，釋出高薪、放寬聘任，但已經太遲。社會才開始反省：

    「我們是不是罵老師罵過頭了？」

    有家長公開道歉，有學生發現沒人陪伴情緒，有人說：「我一個孩子都教不動，才明白老師有多難。」

    科技公司推出AI 老師，語氣溫和、功能齊全，但孩子說：

    「他不是在看我，只是在說話。」

    「我罵他他也不能怎樣，好好笑。」

    教育變成一種操作流程，沒人真正「看見」孩子。

    最終，課程還在進行，但教育，已經停了下來。。

    （改寫自臉書理話島希x Adhd 崩潰現場

    一個沒有學校老師的世界）'
