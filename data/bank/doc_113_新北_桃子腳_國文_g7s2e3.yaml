  section: 2
  number: 33
  type: single
  page: 4
  stem: 根據本則故事，最後狙公為什麼會死？
  options:
  - label: A
    content: 發生饑荒無糧食可吃
  - label: B
    content: 沒有猴子服役、摘果
  - label: C
    content: 遭到猴子背叛而絕食
  - label: D
    content: 罹患重病而無法進食。
  group_stem: '乙、

    楚國有個養獼猴為生的人，楚人稱他為「狙公」。天亮時，狙公必定在院子裡分派工作給猴子們，讓老猴率領眾猴到山中採摘野果，狙公徵收十分之一的果實來養活自己。有的猴子不交，狙公就鞭打牠。猴子們都畏懼鞭打之苦，不敢違抗命令。

    某一天，有隻小猴問眾猴：「山上的野果，都是狙公栽種的嗎？」眾猴說：「不是，是自然生長的。」小猴再問：「沒有狙公的命令就不可以採摘嗎？」眾猴回答：「不是，誰都可以摘。」小猴說：「那麼，我們為何還要依賴狙公，而為他做勞役呢？」話還沒說完，猴子們都醒悟了。當晚，牠們趁狙公睡著後，打破柵欄、毀壞籠子，取走倉庫積存的果實，就跑入山林中，不再回來。狙公最後就餓死了。

    （改寫自劉基 郁離子楚人養狙）'
