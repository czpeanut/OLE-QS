  stem: 下列為一群觀賞完《芭比Barbie》的影迷在爭吵誰才是芭比達人的對話內容，依據本文資訊判斷，何者是其中最不符合「芭比達人」頭銜的人呢？
  options:
  - label: A
    content: 米姬：在劇中芭比世界的所有女性角色都叫做芭比，是因為芭比娃娃的設計涵蓋了各種不同的職業與身分。
  - label: B
    content: 肯尼：電影中場景無論是車、建築還是服裝，都使用了大量的粉紅色元素，從這一點來看是非常還原芭比粉的理想世界。
  - label: C
    content: 薩沙：劇組選角時，為了要找到與傳統芭比體態完全一致的女演員花了許多時間，才終於找到現在的這名演員飾演的女主角。
  - label: D
    content: 艾倫：除了較接近完美形象的女主角芭比之外，還有各種膚色與體型的芭比角色在電影中，還原了如今更多元體態的芭比款式。
