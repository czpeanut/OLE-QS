- id: doc_113_屏東_明正_國文_g9s1e1_s5_10
  section: 5
  number: 10
  type: single
  page: 4
  stem: 下列選項何者符合本文的第一段寫作手法？
  options:
  - label: A
    content: 由「已知」的生活事件誘發「期待」，再由「未知」引發「好奇」
  - label: B
    content: 由「未知」的生活事件誘發「期待」，再由「已知」引發「好奇」
  - label: C
    content: 由「已知」的生活事件誘發「好奇」，再由「未知」引發「期待」
  - label: D
    content: 由「未知」的生活事件誘發「好奇」，再由「已知」引發「期待」。
  group_stem: "關於芭比Barbie，你該知道的事 \n2023 年《芭比Barbie》的上映，締造全球票房奇蹟，由經典玩具「芭比娃娃」為構想的復古時尚、甜美風格世界觀為電影院迎來疫情之後遲來的春天。關於這個陪伴我們逾六十年熟悉的「芭比」玩具，又有什麼樣的歷史與奇聞故事是我們不知道的呢？\
    \ \n1959 年由美泰兒（Mattel）公司的創辦人蘿絲漢德勒（Ruth Handler）於美國玩具展推出了世界第一個芭比，將高度女性化時尚的象徵元素放在孩子們的玩具中，芭比成為了各種職業與身分的女性。由此開始芭比風潮感染了全世界，在全球150\
    \ 個國家售出超過1,000 萬個芭比，其中有超過九成的12 歲以下美國女孩，擁有至少一個芭比娃娃。而這種深而明亮的玫瑰色成為芭比娃娃的代表色，甚至還在美泰兒的申請下受版權保護，也就是Pantone\
    \ 色調的「219 C」——人稱芭比粉（Barbie pink），在高級時裝界中時常以此作為發想，開創了一系列的「芭比風」穿搭，引發不少名人爭相效仿。 \n\
    而芭比的誕生也被指責為「讓女權倒退」的現象，如果我們把經典芭比變成真人，她的身高會是175 公分，胸圍39 英寸，腰圍18 英寸，臀圍33 英寸，穿3 號鞋，這是在解剖學上不可能存在或被驗證的荒謬數字，芭比這樣的「完美體態」被抨擊為強化兒童及青少年有不健康的身體價值觀，引導著「纖細」才是符合主流價值框架的「美女」。而這樣的爭議，也隨著1965\
    \ 年推出「節食芭比」更被放大討論，除了穿著粉色睡衣芭比外，它還附帶了體重為110 磅的浴室秤、一本封面寫著《不准吃》的書，此款芭比被許多婦女團體所韃伐，進而下架。\
    \ \n回憶起大家所熟悉的芭比，是個擁有完美妝容、髮型設計、服裝風格的美人，從頭到腳都非常完美的芭比，被許多人所喜愛，也被學習著。時至今日隨著時代演進，美泰兒也推出有高矮胖瘦之別及不同膚色的多元芭比，甚至還推出首款「唐氏症芭比娃娃」，盼望促進孩子的理解和同理心，至此傳統芭比形象被解放，芭比的身材不再是她的包袱，也使年輕女孩追求更健康的身體形象。"
