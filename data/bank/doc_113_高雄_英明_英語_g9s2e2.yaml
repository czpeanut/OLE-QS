  group_stem: '(31-33)

    The Tarahumara:

    “The Running People”

    The Tarahumara, also called the Rarámuri, are an indigenous group of people who
    live in the mountains of Chihuahua, an area in northern Mexico. They are most
    famous for their strong ability to run for long time. People often call them “the
    running people.”

    Tarahumara people run for many reasons. They run to travel, for fun, and even
    as part of their festivals and traditions. Men, women, and even children can run
    for many hours. They run on mountain roads, through rivers and rocky land. Some
    runs can be over 100 kilometers long!

    They don’t wear modern running shoes. Instead, they wear simple sandals called
    huaraches. These are made from old tires and thin ropes. Even with these simple
    shoes, the Tarahumara can run very fast and very far.

    Why can they do this? Many scientists believe the answer is their lifestyle. The
    Tarahumara eat healthy food like corn and beans. They don’t sit all day or play
    video games. They move their bodies a lot. Walking, running, and working outside
    in nature are parts of their daily lives.

    The Tarahumara show us that we don’t need expensive or modern tools to be healthy
    and strong. We just need to enjoy life and keep moving.

    ◎ indigenous 原住民 tradition 傳統 rocky 充滿岩石的 sandal 涼鞋 tire 輪胎'
