  group_stem: '(37-40)

    Blue Cows?

    It’s almost night-time in the Indian countryside. Here, in this part of Rajasthan,
    farm workers are very busy. No, they are not planting their fields; they are busy
    trying to scare away animals. The animals are called nilgai, which means "blue
    cow” in their local language. These animals eat the crops that farmers need to
    feed their families and sell at the market. Farmers try to scare the nilgai away
    by making loud noises and chasing them from their fields every night. To protect
    their crops, some farmers even sleep in their fields to watch for nilgai, staying
    up all night to keep them away from farmers’ lands. However, the nilgai often
    come at night and eat the crops before the farmers can stop them. This makes it
    very hard for farmers to grow enough food. Is there any solution for this kind
    of animal problem?

    You may think that’s not difficult to solve the problem. Why not killing some
    of them to save the crops? Actually, the problem is not that easy because "gai"
    means "cow" in the local language, and cows are seen as holy in Hinduism, the
    main religion in India. People respect cows and are not allowed to harm them.
    Since nilgai means "blue cow," farmers can get in trouble if they hurt the animals,
    even though nilgai are actually a type of antelope. In fact, antelopes don’t belong
    to any cow or sheep family. This makes it hard for farmers to keep the number
    of nilgai down.

    Years ago, farmers in another area called Punjab had the same problem. They came
    up with a smart idea: they changed the name of the nilgai to "nilgodha," which
    means "horse." Horses are not holy animals, so the farmers were then allowed to
    kill nilgai to save their crops. Now, some farmers in Rajasthan want to do the
    same thing, hoping that a new name will allow them to protect their crops from
    the "blue cows" and save their livelihoods.

    ◎ crop 農作物 Hinduism 印度教 holy 神聖的 antelope 羚羊 livelihood 生計'
