  group_stem: '(27-30)

    (Below is the preface of Sabrina Weston’s new book My Super Service Dog.)

    When I came into this world, I was born with a rare disease. It left me without
    the use of my legs. Besides, attacks caused by the disease make it impossible
    to move my own body. Because of these things, I am almost not able to live alone,
    but that all changed when Riley came into my life.

    Riley is my best friend, and she’s also a yellow Labrador. Since she was a little
    puppy, she had been trained to be a guide dog for the blind, but that didn’t work
    out in the end. Lucky for me, though, her trainer thought that she would make
    a good service dog because she was very gentle and could feel when something was
    wrong. It turns out that Riley did, and she is.

    In the following pages are how I met her for the first time, how she became a
    part of my life, and all that she does for me with and without asking. All I can
    say is that someone up there was looking out for me when they put Riley and me
    together. For that, I will always be very thankful. I hope you have as much fun
    reading our story.

    ◎ preface 序言 rare disease 罕見疾病 attack 發作 gentle 溫和的'
