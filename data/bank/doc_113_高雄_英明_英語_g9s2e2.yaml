  group_stem: '(24-26)

    I saw it fly the kites high

    And blow the birds around the sky;

    And I heard it pass,

    Like ladies’ skirts across the grass-

    O it blows all around,

    O it sings so loud!


    I saw the different things it did,

    But I didn’t know where it hid.

    I felt it push, I heard it call,

    I could not see it at all-

    O, it blows all day long,

    O, it sings so loud!


    O it is so strong and cold,

    O is it young or old?

    Is it a beast of field and tree,

    Or just a stronger child than me?

    O, it blows all day long,

    O, it sings so loud!

    (adapted from a poem by Robert Louis Stevenson)

