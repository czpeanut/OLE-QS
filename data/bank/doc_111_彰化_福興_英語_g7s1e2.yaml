- id: doc_111_彰化_福興_英語_g7s1e2_s7_1
  section: 7
  number: 1
  type: single
  page: 3
  stem: What is this reading mainly about?
  options:
  - label: A
    content: People are scared of helpful bugs.
  - label: B
    content: Ladybugs are different from bees.
  - label: C
    content: Bees and ladybugs are helpful bugs.
  - label: D
    content: Aphids are the food for ladybug and bees.
  group_stem: 'A (1-2)

    Helpful Bugs


    Do you like bugs? Some people are scared of bugs. Some people think bugs are creepy!
    But some bugs are very helpful.


    Ladybugs are helpful bugs. Ladybugs are red and black. They can also be orange
    and black. Ladybugs eat aphids. Aphids are bad bugs. Aphids eat the leaves and
    stems on plants. This is not good. When ladybugs eat aphids, they are helping
    people keep their plants looking nice.


    Bees are other helpful bugs. Bees are yellow and black. Bees can be big. Bees
    can be small. Bees sip nectar from plants. Bees make honey from the nectar. This
    is helpful because people like honey for food. But watch out! Bees can sting!


    Do you know any other bugs that are helpful?'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
  answer:
