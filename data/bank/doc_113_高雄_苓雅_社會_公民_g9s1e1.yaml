  section: 1
  number: 55
  type: single
  page: 2
  stem: 妮妮上網購買一臺(甲)遊戲主機，順帶加購一款(乙)遊戲光碟，到貨當天，她外出逛商場看到(丙)一片熱門遊戲光碟正在特價，於是付錢購買，回家後，她先將兩片遊戲光碟拆封，在閱讀紙本說明書後，發現自己買錯了，想要將全部商品退回，因此準備使用法律保障的
    7 天猶豫期權益。請判斷上文畫雙線處的商品是否適用猶豫期的法律保障？
  options:
  - label: A
    content: 甲、乙、丙均適用
  - label: B
    content: 甲、乙、丙均不適用
  - label: C
    content: 甲適用，乙、丙不適用
  - label: D
    content: 甲、乙適用，丙不適用。
- id: doc_113_高雄_苓雅_社會_公民_g9s1e1_s1_56
  section: 1
  number: 56
  type: single
  page: 2
  stem: '某機關希望縮短使用者的停車時間，提高停車場車位的流動率，使車位能讓更多洽公民眾使用，因此設計新的停車費率，如附表所示。該機關設定表中停車費率所運用的經濟學概念，與下列何者最相似？


    | 停車時間 | 收費金額 |

    | :--- | :---: |

    | 20 分鐘內離場 | 0 元 |

    | 第一個小時 | 40 元 |

    | 第二個小時起 | 每小時 100 元 |'
  options:
  - label: A
    content: 慶祝擴大營業，全店半價促銷
  - label: B
    content: 物價持續上漲，貨幣價值降低
  - label: C
    content: 提高銷貨收入，增加公司利潤
  - label: D
    content: 香蕉價格下跌，種植農民變少。
