  section: 1
  number: 50
  type: single
  page: 1
  stem: 雅雅公司在銷售報告中提到，某產品的販售所得利潤高於生產成本，而生產成本中又以薪資最高，土地租金最低。若附圖為銷售報告中該產品的銷貨收入比例圓餅圖，根據上述內容判斷，薪資成本應標示於附圖中哪一區塊？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
  assets:
  - key: s1_50_f1
    kind: figure
    file: doc_113_高雄_苓雅_社會_公民_g9s1e1/s1_50_f1.png
- id: doc_113_高雄_苓雅_社會_公民_g9s1e1_s1_51
  section: 1
  number: 51
  type: single
  page: 1
  stem: '小登的學校提供了三種畢業旅行方案供學生選擇，附表為他對此三種方案的偏好順序。根據表中內容判斷，小登選擇不同方案的機會成本，其高低順序應為下列何者？


    | 方案 | 行程 | 偏好順位 |

    | :---: | :---: | :---: |

    | 甲 | 花東逍遙遊 | 第三喜歡 |

    | 乙 | 墾丁戲水樂 | 第一喜歡 |

    | 丙 | 澎湖浮潛趣 | 第二喜歡 |'
  options:
  - label: A
    content: 乙＞丙＞甲
  - label: B
    content: 甲＞丙＞乙
  - label: C
    content: 乙＞丙＝甲
  - label: D
    content: 甲＝丙＞乙。
- id: doc_113_高雄_苓雅_社會_公民_g9s1e1_s1_52
  section: 1
  number: 52
  type: single
  page: 2
  stem: 附圖為財經節目對房市的討論，針對來賓發言的內容判斷，下列敘述何者正確？
  options:
  - label: A
    content: 生產者資源有限，必須審慎決定資源分配
  - label: B
    content: 產品的生產數量是由生產成本高低來決定
  - label: C
    content: 生產者提高產品價格才能吸引消費者購買
  - label: D
    content: 政府推動獎勵政策影響生產者的生產意願。
  assets:
  - key: s1_52_f1
    kind: figure
    file: doc_113_高雄_苓雅_社會_公民_g9s1e1/s1_52_f1.png
- id: doc_113_高雄_苓雅_社會_公民_g9s1e1_s1_53
  section: 1
  number: 53
  type: single
  page: 2
  stem: '下列四家航空公司的宣傳標題，何者是透過價格因素來提升消費者的購買意願及數量？


    甲 你買去程機票，回程交給我們買單！本航空讓你出國無負擔！

    乙 現在訂票，可憑票根使用貴賓室及專屬快速通道，讓你出國盡享尊榮！

    丙 本公司的飛機座位不僅寬敞，更結合時下最新潮的漫畫作品做為機身彩繪！

    丁 本航空特別與知名燒肉店合作，讓各位貴賓在 35,000 呎的高空也可以一享口福！'
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
- id: doc_113_高雄_苓雅_社會_公民_g9s1e1_s1_54
  section: 1
  number: 54
  type: single
  page: 2
  stem: '附表是春節期間，夜市裡四個攤位的販售內容和營業情形。在不考慮其他條件的情形下，哪一個攤位的平均單日營業利潤最高？


    | 項目 | 射氣球 | 撈魚 | 甜湯 | 烤香腸 |

    | :--- | :---: | :---: | :---: | :---: |

    | 生產總成本（萬） | 9 | 11 | 15 | 14 |

    | 營業總收入（萬） | 19 | 20 | 24 | 25 |

    | 營業總天數（日） | 20 | 15 | 25 | 20 |'
  options:
  - label: A
    content: 射氣球
  - label: B
    content: 撈魚
  - label: C
    content: 甜湯
  - label: D
    content: 烤香腸。
