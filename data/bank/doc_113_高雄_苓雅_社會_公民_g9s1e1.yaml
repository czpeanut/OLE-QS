- id: doc_113_高雄_苓雅_社會_公民_g9s1e1_s1_41
  section: 1
  number: 41
  type: single
  page: 1
  stem: 市場運作模式有如一隻「看不見的手」，會引導買賣雙方做出對自身最有利的選擇，而某因素為重要考量。上述因素是指下列何者？
  options:
  - label: A
    content: 價格
  - label: B
    content: 生產成本
  - label: C
    content: 個人偏好
  - label: D
    content: 利潤。
- id: doc_113_高雄_苓雅_社會_公民_g9s1e1_s1_42
  section: 1
  number: 42
  type: single
  page: 1
  stem: '曉鈴的研究報告是探討民眾從事消費行為時，會受到某項因素的影響，由以下的例子可知，此因素最可能為何者？

    ◎百貨公司週年慶前，顧客來客量少了許多

    ◎資訊展前，販賣電腦的商家門可羅雀

    ◎媒體報導油價可能調漲，加油人潮大增'
  options:
  - label: A
    content: 個人偏好
  - label: B
    content: 商品促銷
  - label: C
    content: 預期心理
  - label: D
    content: 收入多寡。
- id: doc_113_高雄_苓雅_社會_公民_g9s1e1_s1_43
  section: 1
  number: 43
  type: single
  page: 1
  stem: 一新決定和朋友合資開店，站在經濟學的角度思考他們開店的過程，下列何項敘述正確？
  options:
  - label: A
    content: 開設服飾店的獲利會比模型店高—生產什麼
  - label: B
    content: 以直播方式賣給喜歡網路購物的消費者—如何生產
  - label: C
    content: 資金少應選擇生產成本低的產品—為誰生產
  - label: D
    content: 自己製作還是購買現成產品—何時生產。
- id: doc_113_高雄_苓雅_社會_公民_g9s1e1_s1_44
  section: 1
  number: 44
  type: single
  page: 1
  stem: '幾名朋友合夥栽種觀葉植物販售，因生產條件有限，只能選擇一種植物種植，原本的產品是龜背芋，他們準備參考市場售價決定下一季的產品，根據附表所示，下列何人的意見最能反應價格對生產者的影響？


    | 產品 | 龜背芋 | 蔓綠絨 | 鹿角蕨 |

    | :--- | :---: | :---: | :---: |

    | 價格（元／株） | 60 | 150 | 99 |'
  options:
  - label: A
    content: 一心：若繼續種龜背芋是最適合的選擇
  - label: B
    content: 一德：應該挑選市場上價格最低的栽種
  - label: C
    content: 恭祝：放棄龜背芋，改種鹿角蕨較有利
  - label: D
    content: 工藤：蔓綠絨在三者之中銷貨收入最高，應是最佳選擇。
- id: doc_113_高雄_苓雅_社會_公民_g9s1e1_s1_45
  section: 1
  number: 45
  type: single
  page: 1
  stem: 便利商店為了刺激消費者的購買欲望，每天固定會針對某些商品推出「同款商品第二件六折」的促銷活動。上述做法是採取下列哪一種策略？
  options:
  - label: A
    content: 提升商品功能
  - label: B
    content: 降低商品價格
  - label: C
    content: 增加商品種類
  - label: D
    content: 改變消費型態。
- id: doc_113_高雄_苓雅_社會_公民_g9s1e1_s1_46
  section: 1
  number: 46
  type: single
  page: 1
  stem: 國內蛋價飛漲，陳先生準備開設養雞場收取雞蛋販售，正在猶豫是以雞舍飼養還是放養在開放空間。根據上述，下列說明何者正確？
  options:
  - label: A
    content: 陳先生面臨「生產什麼」的課題
  - label: B
    content: 向銀行貸款買設備應當支付利息
  - label: C
    content: 使用自家土地不須算入生產成本
  - label: D
    content: 陳先生生產的產品屬於無形的勞務。
- id: doc_113_高雄_苓雅_社會_公民_g9s1e1_s1_47
  section: 1
  number: 47
  type: single
  page: 1
  stem: 媒體報導：「過去不管是台塑化和中油涉嫌聯合漲油價，還是超商調整咖啡價格，主管機關都因為舉證不足，開罰遭到撤銷，因此，立法院通過修法，幫主管機關『裝虎牙』，抓聯合漲價業者的不法行為。」根據上文所述，其所指的法律應該是下列何者？
  options:
  - label: A
    content: 《民法》
  - label: B
    content: 《公平交易法》
  - label: C
    content: 《消費者保護法》
  - label: D
    content: 《刑法》。
- id: doc_113_高雄_苓雅_社會_公民_g9s1e1_s1_48
  section: 1
  number: 48
  type: single
  page: 1
  stem: '在國際村的時代，許多民眾會選擇至國外求職，千愛應徵了四份國外的工作，如附表所示，在不考慮其他因素的情況下，單以每個月扣除交通費後可獲得的生活費來衡量，千愛選擇至乙國就職的機會成本應為下列何者？


    | | 甲國 | 乙國 | 丙國 | 丁國 |

    | :--- | :---: | :---: | :---: | :---: |

    | 薪水（美元） | 1,700 | 1,900 | 1,800 | 2,200 |

    | 交通費用（美元） | 400 | 500 | 200 | 700 |'
  options:
  - label: A
    content: 1,300 美元
  - label: B
    content: 1,400 美元
  - label: C
    content: 1,500 美元
  - label: D
    content: 1,600 美元。
- id: doc_113_高雄_苓雅_社會_公民_g9s1e1_s1_49
  section: 1
  number: 49
  type: single
  page: 1
  stem: 右圖為大華與小年住家附近的地圖，甲、乙二商店均販賣大華與小年想購買的某項商品，且該商品在甲商店的售價比乙商店高。若大華僅想就近買到商品，而小年卻只想以便宜的價格購買，則對此二人而言，到哪一間商店購物的機會成本較低？
  options:
  - label: A
    content: 皆為甲商店
  - label: B
    content: 皆為乙商店
  - label: C
    content: 大華：甲商店，小年：乙商店
  - label: D
    content: 大華：乙商店，小年：甲商店。
  assets:
  - key: s1_49_f1
    kind: figure
    file: doc_113_高雄_苓雅_社會_公民_g9s1e1/s1_49_f1.png
