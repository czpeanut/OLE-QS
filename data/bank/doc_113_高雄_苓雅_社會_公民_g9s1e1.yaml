  section: 1
  number: 57
  type: single
  page: 2
  stem: '佑聖每天開小麵包車販售餐食，每種品項提供 40 份，為維持新鮮度，當天產品即使沒賣完也會直接作廢。根據今日附表的銷售狀況，下列何者敘述正確？


    | 品項 | 生產成本（每份） | 產品價格（每份） | 銷售量（份） |

    | :--- | :---: | :---: | :---: |

    | 鮭魚壽司 | 80 元 | 180 元 | 30 |

    | 綜合壽司 | 120 元 | 250 元 | 25 |

    | 味噌湯 | 10 元 | 25 元 | 40 |'
  options:
  - label: A
    content: 味噌湯的銷貨收入為 400 元
  - label: B
    content: 鮭魚壽司的利潤為 2,200 元
  - label: C
    content: 今天的總利潤是 6,850 元
  - label: D
    content: 綜合壽司的總成本較鮭魚壽司為低。
- id: doc_113_高雄_苓雅_社會_公民_g9s1e1_s1_58
  section: 1
  number: 58
  type: single
  page: 2
  stem: '璟大工廠評估三種營運策略的收支情況，如附表所示。若僅考量利潤，該工廠的最佳選擇是「維持現狀」，且此選擇的機會成本是「增產乙產品」。根據上述內容判斷，表中「★」處的數值，最可能為下列何者？


