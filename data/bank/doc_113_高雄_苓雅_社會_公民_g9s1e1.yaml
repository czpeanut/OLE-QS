    | 增產乙產品 | 105 | ★ |

    | 維持現狀 | 80 | 40 |


    單位：萬元∕月'
  options:
  - label: A
    content: '50'
  - label: B
    content: '60'
  - label: C
    content: '70'
  - label: D
    content: 80。
- id: doc_113_高雄_苓雅_社會_公民_g9s1e1_s1_59
  section: 1
  number: 59
  type: single
  page: 2
  stem: 由上文推斷，在看到市場狀況後，部分旅館業者向政府提出申請的做法，可以下列何項敘述來解釋？
  options:
  - label: A
    content: 當產品價格低時，生產者會停止產品的提供
  - label: B
    content: 當產品價格高時，生產者會減少產品的提供
  - label: C
    content: 當產品價格低時，生產者會增加產品的提供
  - label: D
    content: 當產品價格高時，生產者會增加產品的提供。
  group_stem: 在新型冠狀病毒疫情肆虐期間，所有入境我國者均須隔離 14 天，不少民眾選擇到防疫旅館隔離，但當遇到入境人數增多，房間數卻面臨不敷使用的狀況，即使住宿費偏高，還是被搶訂一空，一房難求。為避免造成疫情破口，政府規定，必須提前預約入住旅館，確認有房時才能入境。觀察到市場上的狀況之後，部分旅館業者決定向政府申請成為防疫旅館，以便在疫情重傷觀光業時，能維持高住房率，穩定獲利。相照之下，位於旅遊地區的旅館業者，在疫情緊繃時，即使推出買一晚送一晚，或是低至一折的優惠，民眾依舊不敢上門。請依照上面敘述回答第59
    及60 題：
- id: doc_113_高雄_苓雅_社會_公民_g9s1e1_s1_60
  section: 1
  number: 60
  type: single
  page: 2
  stem: 根據上文，關於疫情緊繃時，旅館推出優惠方案所產生的效果，下列何項說明正確？
  options:
  - label: A
    content: 優惠方案愈划算，入住人數愈高
  - label: B
    content: 民眾搶訂低價房，促銷方案奏效
  - label: C
    content: 民眾擔心價格太低影響服務水準
  - label: D
    content: 金錢誘因未能吸引民眾入住消費。
  group_stem: 在新型冠狀病毒疫情肆虐期間，所有入境我國者均須隔離 14 天，不少民眾選擇到防疫旅館隔離，但當遇到入境人數增多，房間數卻面臨不敷使用的狀況，即使住宿費偏高，還是被搶訂一空，一房難求。為避免造成疫情破口，政府規定，必須提前預約入住旅館，確認有房時才能入境。觀察到市場上的狀況之後，部分旅館業者決定向政府申請成為防疫旅館，以便在疫情重傷觀光業時，能維持高住房率，穩定獲利。相照之下，位於旅遊地區的旅館業者，在疫情緊繃時，即使推出買一晚送一晚，或是低至一折的優惠，民眾依舊不敢上門。請依照上面敘述回答第59
