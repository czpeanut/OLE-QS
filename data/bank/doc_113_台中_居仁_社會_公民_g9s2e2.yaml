  stem: 文中畫底線的團體，透過主辦或協辦同志遊行，除了提供性別多樣群體公開發聲的平台，並持續倡議政府制度改革。這項行動最能反映志願團體如何參與公共生活？
  options:
  - label: A
    content: 運用商業活動宣傳，提升群體形象
  - label: B
    content: 擴大個人影響力並推動政府施政改變
  - label: C
    content: 協助政府以法律途徑解決所有社會問題
  - label: D
    content: 提供醫療資源，促進社會福利平等
  group_stem: '2012 年「臺灣彩虹公民行動協會」成立，負責處理同志遊行相關事宜。每年也都有數百位關心性別議題的志工，投注心力籌辦遊行，希望能提供公開現身的發聲平台；希望社會大眾看見每個人的不同，尊重、理解並接納多元的性別樣貌；希望政府的施政對象裡，包含這些因為性傾向、性別認同或性別氣質的不同，而缺乏制度保障的人們，讓社會更加公平、人人自在。

    2019 年同性婚姻專法通過，同志們得以有一定程度的法律保障，但專法仍有諸多不足、尚待努力；同時，專法之外還有許多性╱別議題，需要性多樣社群持續地關注與爭取

    2024 年10 月舉辦的第22 屆臺灣同志遊行呼籲邁向共融回應不同社群需求，強調共融應是「尊重並保有每個人的差異，讓所有人都可以無所畏懼，成為自己；而非變成消弭多樣性、價值單一化的熔爐。」遊行當天，

    台灣露德協會、愛滋感染者權益促進會及臺灣感染誌協會等協辦團體也將聯合多個愛滋團體組成「愛滋遊行陣線」，呼籲社會大眾儘管愛滋感染者達到「U=U」（測不到病毒=不會傳染）的狀態，但社會歧視仍然存在，應正視愛滋議題，共創友善社會；台灣同志家庭權益促進會也將舉辦「同志家庭彩虹寶寶迷你遊行」，希望大家能看見同志家庭生育的需求。'
