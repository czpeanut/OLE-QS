  group_stem: "How to develop your sense of humor?\n    Having a good sense of humor\
    \ helps us build better relationships. We have all seen these people that make\
    \ others laugh; these are the people we want to be with because we know we will\
    \ have a good time. However, the problem is that being funny is not something\
    \ we can push. Don’t worry now. In this reading, the writer shares the ideas about\
    \ having a sense of humor and getting closer with others.\n1. Speak in a clear,\
    \ confident way.\nWhen you are feeling confident and happy, you are much more\
    \ interesting than you are sad or worried. Just say what you find funny.\n2. Be\
    \ a good listener and learner.\nYou are probably not the person who was born with\
    \ a sense of humor, but you can be a good learner. When you are in a group, take\
    \ some time to listen to others and learn how they can say things in a funny way.\
    \ Watching funny videos and reading funny books are also good ways to build up\
    \ humor.\n3. Be polite and respectful.\nWhat you want is to make people laugh\
    \ without making them feel bad. Never make fun of the points that people really\
    \ care about, like age or looks. If you don’t know what to say, just say something\
    \ neutral such as weather and traffic.\n4. Laugh at yourself.\nIt’s also called\
    \ hate-me humor. The easiest way to have good humor is to laugh at yourself! Laughing\
    \ at yourself means you won’t take things too seriously, and this makes people\
    \ enjoy your talking more.\n    Remember, people will usually not remember what\
    \ you said, but they will remember how you made them feel.\n develop 開發 sense\
    \ 知覺 relationship 關係 confident 自信的 respectful 尊重的 neutral 中立的"
