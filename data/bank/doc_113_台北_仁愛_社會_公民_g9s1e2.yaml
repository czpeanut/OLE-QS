  group_stem: 為達成非核家園願景，能源轉型是政府重點政策之一。為此，行政院推動離岸風電設置和發電。過去，風電生產聚落都在歐洲，為了讓歐洲廠商願意來臺灣設廠，行政院副院長參訪德國時，專程造訪波蘭，促成全球機電系統供應商KK
    Wind Solutions 在臺灣設立工廠。目前離岸風電已分別於臺北港、臺中港、興達港形成產業聚落，也吸引國際風力機系統商在臺灣設廠，除了大幅降低業者的運輸風險及時間成本，更帶動周邊各項零組件製造商機。經濟部表示，政策推動迄今已創造產值超過新臺幣600
    億元、近兩年新增1,300 個就業機會。
