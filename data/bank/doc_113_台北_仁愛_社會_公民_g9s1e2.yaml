- id: doc_113_台北_仁愛_社會_公民_g9s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 請問：旻哲自行製作蛋黃酥，平均每個蛋黃酥的機會成本為何？
  options:
  - label: A
    content: 40 元
  - label: B
    content: 50 元
  - label: C
    content: 80 元
  - label: D
    content: 90 元。
  group_stem: '旻哲從國中畢業已經5年了，今年他想在中秋節舉辦同學會，連繫同學間的感情。以下是旻哲和同學間的對話，請根據對話內容回答下列問題：


    旻哲：各位國中畢業以後好幾年沒見了，難得聚會又適逢中秋，我想自己製作低糖少油的蛋黃酥給大家吃。

    旻哲：我之前做過一次，食材需要麵粉、奶油、砂糖、蛋黃及內餡，製作 15 個蛋黃酥約750 元。

    譽碩：我覺得划不來，而且有些成本你沒計算到吧？你製作的時間拿去家教也可以賺600 元。

    雅萱：第二次製作，也沒有辦法太熟練，應該會搞得手忙腳亂。附近店家賣的蛋黃酥一顆才35 元。口味選擇也較多。我們可以買不同的口味吃吃看。

    旻哲：好吧!你們說得有道理。我們還是買現成的比較划算。'
  tags:
