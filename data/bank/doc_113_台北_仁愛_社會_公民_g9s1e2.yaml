- id: doc_113_台北_仁愛_社會_公民_g9s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: '2020 年受疫情影響，各種商品價格連帶受挫，而栽種檸檬的果農也受到影響。國內有對夫妻對生態環境相當重視，返鄉務農後申請產銷履歷驗證，以無農藥殘留方式種植，成功栽培出符合市場需求的「ND」（未檢出農藥）的檸檬。「ND」檸檬果皮外觀翠綠，只要手一搓就有一股檸檬香飄出來，因此該對夫妻成功和廠商訂定好的價格，以及建立穩定的銷售通路，不怕受疫情影響。（資料來源：改寫自1.商社男，便利商店首位爭奪戰，Medium，2020/07/21。2.陳弘逸，夫妻退休種「ND」檸檬，成功在疫情與價格戰中突圍，聯合報，2020/07/20。）

    請問，根據上文內容，下列敘述何者正確？'
  options:
  - label: A
    content: 這對夫妻考量的生產課題是「生產什麼」
  - label: B
    content: 受疫情影響，檸檬市場的需求量隨之降低
  - label: C
    content: 「ND」檸檬採重視生態的非價格競爭
  - label: D
    content: 「ND」檸檬是以市場最低價賣出的檸檬。
