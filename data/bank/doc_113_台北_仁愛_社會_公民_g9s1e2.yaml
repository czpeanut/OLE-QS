  stem: 清晨時分，多數人正在夢鄉時，位在基隆的崁仔頂魚市才揭開序幕。剛從漁港載滿漁獲的卡車陸續駛進，將新鮮的漁獲一籃籃擺上攤位；北臺灣地區的魚販、海鮮餐廳經營者，或是喜愛生鮮漁獲的饕客們也魚貫進入，整個魚市場裡熱鬧滾滾，讓人見識到傳統叫賣市場的震撼力。這裡的交易方式，是採拍賣方式，以前一日的成交價格為底價，再漸漸往上加價，直到有買主決定購買為止。根據上文敘述，下列何者正確？
