  group_stem: '題組一:請根據文章回答第 40 至42 題


    斯里蘭卡從2019 年起面臨自1948 年獨立以後最嚴重的經濟危機，造成危機的主要原因包括轉向有機農業的政策、債務危機及新冠疫情等因素。

    茶葉是斯里蘭卡最主要的出口產品，每年可帶來超過12.5 億美元的外匯收入，但是因為政府推行100%有機肥種植的政策，全面禁止化學肥料進口，農民將面臨無化肥可用的情況，少了化肥，茶芽和綠葉生長受影響，每年平均3
    億公斤的茶葉產量將大減；此外有機茶生產成本高出10 倍，而且市場有限，茶商收入勢必也跟著銳減，最後虧損過大，只能倒閉收場，茶園關閉，受影響的人數將達300
    萬人，也重創斯里蘭卡經濟。

    除了有機肥種植的政策，新冠疫情也重挫國家經濟，物價上漲比率高達11.1%，並欠下伊朗2.5 億美元石油債務，斯里蘭卡與伊朗達成協議，每月運送價值500 萬美元茶葉的方式償還債務。為了因應不斷上漲的食物、乳製品成本，許多民眾一日三餐減到一日兩餐，晚餐餐桌上的奶茶變成了只加了點糖的「甜茶」，改變了消費模式。【註：「外匯」是指外國的貨幣。】'
