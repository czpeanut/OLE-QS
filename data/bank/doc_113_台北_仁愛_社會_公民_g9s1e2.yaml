  stem: 依據文章內容，下列何者正確？
  options:
  - label: A
    content: 併購案不需要遵守《公平交易法》的規定
  - label: B
    content: Uber Eats 和Foodpanda 是運用非價格競爭吸引會員加入
  - label: C
    content: 市占率愈高則愈有利新進業者參與競爭
  - label: D
    content: 公平會會依市占率高低考量企業間是否能合併。
  group_stem: '題組二:請根據文章回答第43 至45 題


    臺灣目前有三家主要的外送平台，平台資料如《資料一》所列。今年5 月，優食公司（Uber Eats）的母公司Uber Technology Inc.宣布，購併Delivery
    Hero 旗下的Foodpanda 台灣業務。目前此案子送公平會審查中，部長回應此案子必須先開公聽會再審查。

    公平會判斷兩家企業能否合併的重點在於：「各自在市場中所佔的份額為多少，再來檢視兩者結合後的市占率，是否會形成獨佔或優勢地位，進而影響消費者的利益。」。

    相較錢櫃與好樂迪KTV 的合併案。公平會指出兩者市占率相加超過45%，且互為主要競爭對手，結合後對消費者弊大於利，因此禁止合併。錢櫃因為此決定甚至狀告公平會，但在西元2020
    年遭(甲)單位判決敗訴。

    《資料來源：文章摘錄自商業周刊1929 期《Uber、foodpanda 真能合併？公平會會通過嗎？外送費漲定了？》


