  stem: 捷克原有利用舊地築壩涵養濕地的計畫，工程因故延宕七年，卻因為河裡的河狸利用石頭、啃斷的樹木和泥土等築壩，此舉不僅有助河狸的生存，也為許多物種提供棲地，還為人們提供了有效控制洪水的設施，並為捷克政府省下約台幣四千萬元的築壩經費，雖然農民曾因啃斷的樹木壓壞農地而抱怨…。依上文所述，以下敘述何者正確？
