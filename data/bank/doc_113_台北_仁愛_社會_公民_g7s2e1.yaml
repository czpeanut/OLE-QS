  stem: 近年來政府積極推廣新住民多元文化，舉辦培力課程及訓練多元文化講師，邀請新住民擔任講座，分享多元文化觀點，建立新住民與家人之間愛的橋梁。政府官員表示，不只是新住民夫妻可以學習彼此的語言幫助溝通，新住民第二代若能學習父母輩之間不同的語言，也可提升未來接軌國際的競爭力。上述內容顯示推廣多元文化具有下列哪種重要性？
