  section: 3
  number: 41
  type: single
  page: 4
  stem: 穆斯林女性外出需要穿著罩袍戴頭巾包覆頭臉，只露出眼睛部位，有不少歐洲國家針對此種蒙面穿著發布禁令，認為在公共場所與他人互動卻遮住頭臉，是不尊重他人的行為，也是一種女性遭父權壓迫的象徵，但部分人權團體認為，這樣的禁令歧視穆斯林，侵害他們的人身自由。依據上文，請判斷哪兩種規範發生衝突？
