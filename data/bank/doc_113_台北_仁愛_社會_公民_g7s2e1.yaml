  section: 3
  number: 36
  type: single
  page: 3
  stem: 位於瑞典的噁心食物博物館，展出來自全球80 多種特色食物，有蒙古的傳統解酒飲料「羊眼球汁」，用番茄汁和醋調製而成的汁液上浮著一顆羊眼球；有來自廣東，用剛出生的小老鼠泡製的藥酒，據說可以補血抗衰老；也有我們熟知的皮蛋…，他們全都是各地方常見的日常食物，並非嶄新或創意的發明，博物館希望大家去思考「何謂噁心」，並藉此機會去了解每一樣食物背後的意義與故事。關於上文，請問以下敘述何者正確？
  options:
  - label: A
    content: 因為噁心食物的特殊氣味或視覺衝擊會讓人不適，所以屬於次文化
  - label: B
    content: 不同的地方都有特殊食物，顯現了文化的累積性
  - label: C
    content: 用理解食物故事的角度看待較能破除噁心的迷思
  - label: D
    content: 食物給人感受不同，蘊含著文化位階的意義
