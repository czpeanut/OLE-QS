- id: doc_113_台北_仁愛_社會_公民_g7s2e1_s3_44
  section: 3
  number: 44
  type: single
  page: 4
  stem: 依據上文，請判斷下列敘述何者符合文章內容？
  options:
  - label: A
    content: 詐騙財損金額最高的前三名是：假投資、網路購物、假買家騙賣家
  - label: B
    content: 少年車手常遭到利用是因為無需負擔刑責
  - label: C
    content: 目前對詐欺犯的最高罰金是100萬元
  - label: D
    content: 政府制定不只一種具有強制力的社會規範
  group_stem: '下方表格是內政部警政署「165 打詐儀錶板」的統計資料，顯示了114 年1 月份「受理的詐騙案件數、財產損失金額與詐騙案件數前五名」的內容：


    | 114 年1 月詐騙手法統計 | |

    | :--- | :--- |

    | 詐騙受理案件數 | 1 萬3,120 件 |

    | 財產損失金額 | 95 億4562.9 萬元 |

    | **詐騙受理案件數前五名類型 及 財損金額** | |

    | 1 假投資 | 3453 件 63 億7833.6 萬 |

    | 2 網路購物 | 1861 件 6350.5 萬 |

    | 3 假買家騙賣家 | 1148 件 1 億2203 萬 |

    | 4 假交友(投資詐財) | 1110 件 13 億1259.7 萬 |

    | 5 假中獎通知 | 612 件 6175 萬 |


    為了打擊詐騙犯罪，政府也製作了早安圖、各種破解詐騙手法的漫畫等加強宣導，希望教導民眾認識詐騙手法，培養民眾的防詐意識。


    在層出不窮的詐騙案件中，發現一個令人擔憂的現象，就是少年車手的數量急遽增加，這些少年都知道當車手是非法的，卻又覺得關幾年就能出獄，在金錢的利誘下鋌而走險，導致詐騙集團鎖定少年，將這些少年車手當免洗筷一般，用完就丟，政府於是在113
    年制定《詐欺犯罪危害防制條例》，補強《刑法》詐欺罪的處罰，希望能生遏止之效。

    《刑法》詐欺罪：

    處1~7 年有期徒刑，得併科最高100 萬罰金

    《詐欺犯罪危害防制條例》

    加重詐欺獲利達500 萬元：處3~10 年有期徒刑，得併科3000 萬元罰金

    加重詐欺獲利達一億元：處5~12 年有期徒刑，得併科3 億元罰金'
