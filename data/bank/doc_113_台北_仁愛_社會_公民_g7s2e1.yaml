- id: doc_113_台北_仁愛_社會_公民_g7s2e1_s3_42
  section: 3
  number: 42
  type: single
  page: 4
  stem: 依據上文，請判斷下列敘述何者符合文章意旨？
  options:
  - label: A
    content: 移工朋友皆信仰伊斯蘭教
  - label: B
    content: 齋戒月白天不能進食，僅能喝水
  - label: C
    content: 日落後食用封齋飯可以補充所需體力
  - label: D
    content: 穆斯林的行為受到齋戒月的規範
  group_stem: 台灣穆斯林人口高達30 萬人，3 月適逢穆斯林最神聖的「齋戒月」，伊斯蘭信徒會在太陽升起前食用封齋飯，並在白天時間禁止飲食、喝水、不能娛樂、抽菸，保持心靈平靜，反省自己的過錯，一直到太陽下山，才會食用開齋晚餐，為了響應穆斯林的齋戒月文化，有超商在其App
    推出「東南亞友善地圖」，方便移工朋友以母語查找所需商品，進一步推出晚間六點到清晨六點，百款清真友善商品特價優惠，並採購新鮮椰棗做成飲品，椰棗對穆斯林而言，是具有宗教、文化與營養多重意義的生命之果，飲品可以迅速補充體力，做為穆斯林日落後進食的開齋晚餐，提供穆斯林在齋戒月期間更便利多元的飲食選擇。
  tags:
