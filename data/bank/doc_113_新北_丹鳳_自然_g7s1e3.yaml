  stem: '美美進行測定植物呼吸作用產生氣體的實驗，在錐形瓶內置入已萌芽的綠豆，蓋上瓶蓋，是為實驗組，另外以乾燥綠豆放入相當裝置作為對照組，靜置三小時後，由上方漏斗倒入清水。請問實驗檢測何種物質？而你推測實驗組和對照組最終有何結果為何？


