- id: doc_113_台中_四育_國文_g8s2e2_s4_30
  section: 4
  number: 30
  type: single
  page: 5
  stem: 「用手一摸，原來兩邊著了兩條滴滑的冰。初起不懂什麼緣故，既而想起，自己也就笑了。原來就是方才流的淚，天寒，立刻就凍住了」根據本文，下列何者最有可能是作者流淚的主因？
  options:
  - label: A
    content: 對自己遭小人迫害的感懷
  - label: B
    content: 對雪月交輝景象的崇敬
  - label: C
    content: 對地區生活苦寒的憐憫
  - label: D
    content: 對現今國家局勢的擔憂。
  group_stem: "2.\n回到店中，吃過晚飯，又到堤上閒步。這時北風已息，誰知道冷氣逼人，比那有風的時候還利害些。\n抬起頭來看見南面的山，一條雪白，映著月光，分外好看；一層一層的山嶺，卻不大分辨得出。又有幾片白雲，夾在裡面，所以看不出是雲是山。及至定神看去，方才看出那是雲，那是山來。雖然雲也是白的，山也是白的；雲也有亮光，山也有亮光；只因為月在雲上，雲在月下，所以雲的亮光，是從背面透過來的，那山卻不然，\
    \ 山上的亮光，是由月光照到山上，被那山上的雪反射過來，所以光是兩樣子的。然只稍近的地方如此；那山往東去，越望越遠，漸漸的天也是白的，山也是白的，雲也是白的，就分辨不出什麼來了。\n\
    老殘對著雪月交輝的景致，想起謝靈運的詩，「明月照積雪，北風勁且哀」兩句。若非經歷北方苦寒景象，那裡知道「北風勁且哀」的個「哀」字下的好呢？這時月光照得滿地的亮，抬起頭來，天上的星一個也看不見，只有北邊，北斗七星開陽搖光，像幾個淡白點子一樣，還看得清楚。那北斗正斜倚在紫微垣的西邊上面，杓在上，魁在下。心裡想道：「歲月如流，眼見斗杓又將東指了，人又要添一歲了。一年一年的這樣瞎混下去，如何是個了局呢？」又想到詩經上說的「維北有斗，不可以挹酒漿。」──「現在國家正當多事之秋，那王公大臣只是恐怕擔處分，多一事不如少一事，弄得百事俱廢，將來又是怎樣個了局，國是如此，丈夫何以家為！」想到此地，不覺滴下淚來，也就無心觀玩景致，慢慢回店去了。一面走著，覺得臉上有樣物件附著似的，用手一摸，原來兩邊著了兩條滴滑的冰。初起不懂什麼緣故，既而想起，自己也就笑了。原來就是方才流的淚，天寒，立刻就凍住了，地下必定還有幾多冰珠子呢。悶悶的回到店裡，也就睡了。\n\
    \                                                            ~~（黃河結冰記（節錄）劉鶚）\n\
    注：\n１.紫微垣：中國古代劃分恆星的分組方式。 ２.杓：北斗七星的柄，指第五到第七顆星。\n３.魁：星名。北斗七星的第一星。         ４.挹：舀取。"
