  type: single
  page: 6
  stem: 本文中「宰相肚裡好撐船」的意思是比喻人胸襟度量寬大，請問下列何詞語的意思與其「不同」？
  options:
  - label: A
    content: 斗筲之人
  - label: B
    content: 休休有容
  - label: C
    content: 豁達大度
  - label: D
    content: 氣宇宏深 。
  group_stem: "4.\n    有一個日本畫家在一幅很大的畫布上畫了一幅畫。在畫布一角，他畫了一棵樹，樹枝上有幾隻鳥，但是其餘的畫布都是空的。有人問他是不是要在空白上再畫一些東西，他說：「不，我必須替這些鳥留下一片飛翔的空間。」\n\
    \ 鳥兒要有自由飛翔的空間，人心也要有迴旋自如的廣闊園地。俗語說：「宰相肚裡好撐船。」這是說，氣度寬宏，胸懷灑脫，不爭一時之氣，不計「一箭之仇」的人，才能居高位，成大事。\n\
    \ 胸襟狹窄的人如果沒有知識，往往坐井觀天，剛愎自用；如果是知識分子，常常自命不凡，自以為不可一世，「老子天下第一」，他們普遍的缺點是眼界不廣，胸襟不寬。既不肯忘記別人的無禮，也不願原諒別人的過錯，仇恨腐蝕他們的良心，他們好像跟歡笑無緣，這是孔子所說的「小人長戚戚」。\n\
    \                                                        \n                  \
    \                                    ~~(留出寬闊的空間（節錄）黃驤)"
