- id: doc_113_台中_清水_國文_g7s2e3_s1_31
  section: 1
  number: 31
  type: single
  page: 3
  stem: 奈米是度量什麼的單位?
  options:
  - label: A
    content: 時間
  - label: B
    content: 速度
  - label: C
    content: 溫度
  - label: D
    content: 長度
  group_stem: '<奈米>

    近年來奈米科技經常在日常生活中出現,奈米到底是什麼?難道是生魚片「沙西米」?還是新品種的冠軍米?都不是,奈米是一種單位,一奈米(Nanometer)等於十億分之一公尺(10-9公尺),約為頭髮直徑的十萬分之一。近年來奈米技術廣泛運用在醫學、藥學、美容保養,甚至日常生活用品當中,可說是21世紀最重要的產業之一。

    實際上,自然界早就使用奈米技術了,例如爬牆不會掉下來的壁虎神功、蜜蜂體內有奈米磁石而可以自動導航、蓮花的出淤泥而不染等皆是。而奈米技術只是我們應用了自然界中原有的技術來改善或便利我們的生活。例如,我們利用了蓮花出淤泥而不染的「蓮花效應」(Lotus
    Effect,由於荷葉表面的奈米結構而具有抗水防塵的功能),而製造了防水環保塗料、防水防塵布料、自潔玻璃以及奈米防汙馬桶等民生用品。

    改寫自佛布茲學蜘蛛人趴趴走'
