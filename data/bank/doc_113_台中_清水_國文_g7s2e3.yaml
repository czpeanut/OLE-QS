- id: doc_113_台中_清水_國文_g7s2e3_s1_27
  section: 1
  number: 27
  type: single
  page: 3
  stem: 從雞捲的發明,我們可以看到臺灣傳統民眾的什麼特質?
  options:
  - label: A
    content: 自命不凡
  - label: B
    content: 故步自封
  - label: C
    content: 簡樸惜物
  - label: D
    content: 憂國憂時
  group_stem: '<臺灣小吃魅力無窮>

    臺灣小吃是許多人共同的記憶,去國多年的遊子,一碗香噴噴的滷肉飯或許最能暫解鄉愁。據觀光局的統計,這幾年來,聚集小吃的夜市幾乎成了觀光客來臺的必遊行程,英國廣播公司(BBC)的報導也證實,臺灣夜市的小吃取代了故宮的「翠玉白菜」,成為外國觀光客的最愛,可見臺灣小吃的魅力無人可擋。

    在琳瑯滿目的小吃中,什麼是最受歡迎的呢?根據遠見雜誌的民調,「最能代表臺灣十大小吃」的榜首是蚵仔煎,用鮮蚵、番薯粉漿、雞蛋、青菜煎成,再淋上番茄醬、辣豆瓣醬、味噌、糖等調製成的粉紅色沾醬,滋味果真教人難以抗拒。排名第二的是珍珠奶茶,這可是臺灣人發明的特產哦!濃郁的奶茶、彈牙的珍珠,讓人喝一口就再也抗拒不了,難怪名聲響遍海內外。還有蚵仔麵線、臭豆腐、肉圓、肉粽、擔仔麵、滷肉飯、四神湯、米粉湯、魷魚羹、鹽酥雞、雞捲……臺灣小吃豐富多樣,人人都可以找到自己的最愛。

    臺灣小吃除了美味外,有的背後還有充滿人情味的故事。據說,肉圓發源於清代的彰化北斗,有一次水災,當地寺廟把番薯粉加水揉成團狀蒸熟,發給災民食用,後來包入豬肉、筍乾等配料,發展成今日讓人垂涎三尺的肉圓。

    你知道雞捲的主要材料不是雞肉嗎?舊時因生活刻苦,人們捨不得將剩菜丟棄,就用豆腐皮將剩菜捲起來,放入鍋中油炸,變成一道新的菜餚。雞捲的意思是「多出來的捲」,閩南語的「雞」與「加」諧音,所以後來把「加捲」寫成了「雞捲」。

    華燈初上,夜市裡處處飄香,三五好友找個位置坐下來,來一客喜歡的小吃,隨你狼吞虎嚥、細細品嘗,包準你心滿意足、賓主盡歡,臺灣小吃真是我們無價的資產。'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
