- id: doc_113_新北_福和_社會_地理_g8s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 精準灌溉技術正在重塑日本未來的農業。利用物聯網和感測器，農民能夠有效監控土壤水分和氣候條件，準確地灌溉部分農地。搭載感測器的無人機可確保水資源根據不同區域的需求合理分配。根據日本農林水產省的資料，這種方法能夠有效節省15－20％用水，同時提高5－10％作物產量。從上述精準灌溉的介紹，以下推論何者有誤？【6-1】
  options:
  - label: A
    content: 技術的誕生起源於日本勞動力充沛
  - label: B
    content: 屬於投入大數據分析之智慧型農業
  - label: C
    content: 有效避免農業生產過程的資源浪費
  - label: D
    content: 精準灌溉將使農地生產的產量提高
