- id: doc_113_新北_福和_社會_地理_g8s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '「櫻花前線地圖」是日本氣象廳每年公告的觀光訊息之一。當一處地點氣溫達標，櫻花首次開放之日，就會被視為該地的「初綻日」。由於各地花期有異，氣象廳繪製地圖，提醒民眾於初綻日後前往，才能欣賞到櫻花勝景。附表一是四處地點櫻花初綻日資料，若只考慮緯度對氣溫的影響，四處地點正確分布位置為何？
    【5-1】

    表一

    | 地點 | 櫻花初綻日 |

    | --- | --- |

    | 秋田 | 4 月11 日 |

    | 稚內 | 5 月7 日 |

    | 鳥取 | 3 月21 日 |

    | 富山 | 3 月30 日 |'
