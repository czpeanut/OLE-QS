  group_stem: '圖三為南韓行政區圖。請閱讀下列短文，回答第 15 至 17 題 【5-1、5-2、5-1】

    　　2024 年12 月3 日深夜，南韓總統尹錫悅以「反癱瘓國家勢力」為由頒布戒嚴令，旋即引發該國政治動盪。然而，這項政令卻在六小時內被國會多數議員否決，被形容為最短命的戒嚴令。此後，國會於數日內發起彈劾，要求將總統停職查辦。大批民眾走上街頭表達政治立場：近二十萬名群眾聚集國會議事堂外，支持國會舉動，有學生席地而坐，邊寫作業邊等待表決結果；同時，三萬多名總統的擁護者則聚集在景福宮南面的光化門外，反對國會的舉措。民眾頂著低溫，徹夜未眠，守在首爾街頭。事發當下，許多大城市或周邊的人口聚集區都有不同規模示威活動，警方不敢大意，檢視警力佈署，避免各地衝突升級。最終國會通過總統彈劾案，尹錫悅遭到停職。'
