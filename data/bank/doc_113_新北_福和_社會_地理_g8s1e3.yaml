- id: doc_113_新北_福和_社會_地理_g8s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 某網路新聞報導：「在1980 年代後期，隨著全球化進程，日本松下電子（Panasonic）將許多家電與影音設備製造部門遷往中國及東南亞等生產成本較低的地區，降低企業開銷並提升產品的國際競爭力。然而，這導致日本國內的工廠縮減規模甚至關閉，引發就業機會減少及經濟結構失衡等問題。」新聞作者針對上述案例討論，下列何者是最適當的評論？【6-1】
  options:
  - label: A
    content: 松下電子轉移至海外的部門較擅長精密研發工作
  - label: B
    content: 松下電子移轉部門後續效應屬於產業空洞化現象
  - label: C
    content: 日本將迎來更多中國與東南亞籍移工至該國工作
  - label: D
    content: 日本政府應鼓勵國人至海外投資以減少社會問題
  tags:
