- id: doc_113_新北_福和_社會_地理_g8s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '中國華北、東北一帶製造商在2000 年就開始與鄰近的北韓假睫毛工廠合作。例如，山東青島轄下的平度市被譽為「世界睫毛之都」，是供應鏈的關鍵節點，佔全球假睫毛產量70%。這些假睫毛通常由北韓製造並出口，大量經由兩國接壤處銷往平度市包裝，隨後外銷至世界各地。綜合上述資訊與國家基本背景，下列有關北韓之敘述，何者正確？【6-2】

    ※節點：貨物運輸的起、終點或轉運中間點。'
  options:
  - label: A
    content: 首都平壤市位於國境北側高原上
  - label: B
