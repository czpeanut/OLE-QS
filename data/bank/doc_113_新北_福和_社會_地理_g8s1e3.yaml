  group_stem: '請閱讀以下氣象新聞，回答第 12 至 14 題【5-1、5-1、6-1】

    　　2024 年12 月5 日，日本氣象廳發布「大雪相關早期天氣資訊」，由於來自「 X 地」 的冷空氣在經過「 Y 山」 一帶分流後，至日本海上匯聚並加強，導致雪雲快速發展。氣象廳強調北陸、近畿位在日本海一側降雪量可能達到平常的三倍以上，全國將迎來嚴寒，北海道地區最低氣溫預計降至零下攝氏度。太平洋一側雖多為晴天，但東京最高氣溫僅約10
    度，寒意明顯。此外，未來三個月，位於日本海一側的冬季冷空氣將持續增強。降雪可能引發突如其來的交通混亂，建議民眾提前做好防雪及交通應對準備，預防極端天氣帶來的不便。'
