- id: doc_113_新北_福和_社會_地理_g8s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: '某氣候學家分析中國天津、南韓首爾、日本仙台三地氣候資料，做出下方資料一、二之歸納。部分文字卻因電腦當機緣故而輸出錯誤，迷糊的學者憑印象找回原本記錄。下列代號與底線文字中，最正確的概念為何？【5-1】

    　資料一：就絕對位置而言，三地的 子 經度座標 很接近，理應有相同的氣溫特徵，但發現三者年溫差卻 丑 由西向東遞增。

    　資料二：分析結果顯示，三地由於地理位置特徵不同，如天津位處大型陸塊， 寅 缺乏水氣調節 ，較為乾燥，因此雨量少，年溫差大；仙台則是 卯 位於半島地形之上，因靠近海域而有洋流調節，雨量較豐沛，年溫差也比較小。'
  options:
