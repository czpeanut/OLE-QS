  section: 1
  number: 13
  type: single
  page: 2
  stem: '小怡一群人浮潛完又餓又累，來到海產店共點了一份生魚片、三杯烏賊圈、炸鮮蚵、川燙鮮蝦、絲瓜蛤蜊、海帶豆腐湯及一份招待水果西瓜，他們趁餐點還沒上桌前討論起菜單中的生物分類，對話如下。

    小寶：烏賊是一種魚類。 大寶：蝦子有殼保護柔軟的身體，屬於軟體動物。

    小鮮：鮮蚵與蛤蜊屬於同一門動物。 大鮮：絲瓜及西瓜都有果實會開花，海帶則是蕨類植物。

