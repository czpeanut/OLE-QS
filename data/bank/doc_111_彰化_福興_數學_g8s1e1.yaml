  section: 1
  number: 1
  type: single
  page: 1
  stem: '下列四位同學想算出$(19.5)^{2}$的值，他們的方法如下：

    小佑：$(19.5)^{2}=(20-0.5)^{2}=20^{2}-2\times20\times0.5-0.5^{2}$

    阿家：$(19.5)^{2}=(\frac{39}{2})^{2}=\frac{39^{2}}{4}$。

    莎莎：$(19.5)^{2}=19^{2}+(0.5)^{2}$

    小恩：$(19.5)^{2}=(19+0.5)^{2}=19^{2}+2\times19\times0.5+0.5^{2}$

    若這四人都沒有其它計算上的錯誤，則有多少人的答案是對的？'
  options:
  - label: A
    content: 1 人
  - label: B
    content: 2 人
  - label: C
    content: 3 人
  - label: D
    content: 4 人
