- id: doc_113_新北_江翠_國文_g7s2e1_s3_3
  section: 3
  number: 3
  type: single
  page: 1
  stem: 一個詞在不同的語句中意義往往不同，請問下列詞語的解釋何者正確？
  options:
  - label: A
    content: 春日無邊「光景」令人心曠神怡——情形、境況
