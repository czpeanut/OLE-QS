    content: 年紀「老大」，常感時光荏苒不再——排行第一
  - label: C
    content: 這記三步上籃的動作真「漂亮」——精彩、出色
  - label: D
    content: 他的舉止「形容」怪異可笑——描述、描寫。
- id: doc_113_新北_江翠_國文_g7s2e1_s3_4
  section: 3
  number: 4
  type: single
  page: 1
  stem: 《視力與偏見》：「我這才發現，我視力良好，因此我偏見猶在，多麼不幸的事！」這段話在說明什麼道理？
  options:
  - label: A
    content: 視力良好的人，比較容易產生偏見
  - label: B
    content: 憑藉良好的視力，可以克服偏見的產生
  - label: C
    content: 察覺自己用外觀評斷人，造成偏見的謬誤
  - label: D
    content: 對於對方的不幸，自己感同身受。
  lesson_raw:
    title: 視力與偏見
    basis: 題目引用《視力與偏見》課文文句
