  section: 3
  number: 22
  type: single
  page: 3
  stem: '根據主計處調查，十五歲到六十四歲的上班族媽媽，每天花在顧小孩和煮飯抹地等料理家務的時間，超過三個半小時。難怪每個上班族媽媽會像陀螺一樣轉不停，身心俱疲，而且付出那麼多，犧牲了自我，生活依舊亂糟糟。在美國，甚至出現了專門為上班族父母調整生活步調的親職諮商師，隨時為混亂的家庭生活，提供即時的電話救火服務。

    心理醫師陳俊欽曾分析，夫妻其中一方若為家庭過度犧牲與忍耐，婚姻的不穩定度便提高。因為有犧牲就有痛苦，有痛苦就希望獲得代價；犧牲者犧牲得愈徹底，家庭就會愈混亂。

    上文是某一篇報導的開頭，請問本報導的標題最有可能是以下何者？'
  options:
  - label: A
    content: 婚姻和諧家庭和樂的最大關鍵在於互相包容
  - label: B
    content: 婚姻的不穩定來自夫妻之間爭吵不斷
  - label: C
    content: 職業婦女在婚姻中感受幸福的錦囊妙計
  - label: D
    content: 讓上班族媽媽身心崩潰的罪魁禍首。
- id: doc_113_新北_江翠_國文_g7s2e1_s3_23
  section: 3
  number: 23
  type: single
  page: 3
  stem: '咖啡除了提神、利尿、具抗氧化能力、防癌，美國國家衛生研究院和美國退休人協會研究發現，喝咖啡能延年益壽。常喝咖啡的人比不常喝的人活更久，攝取適量咖啡因也能預防阿茲海默症。

    只是從中醫角度來看，咖啡性辛溫，體質燥熱、嘴破、痔瘡者不適合。同時，咖啡對胃的刺激性較強，最好別空腹喝，最佳飲用時間為早餐後與下午2 點前，也別飲用過量，免得上癮、心悸、失眠等負面效果統統來，就浪費咖啡的好處了。

    且記得，喝咖啡時別加太多糖、糖漿或奶油球，過多的調味品或油脂將降低咖啡本身的好處，讓熱量大增。一杯約450cc 的黑咖啡熱量僅14 卡，加了牛奶的拿鐵咖啡卻要211
    卡。

    根據上文所述，以下何者是喝咖啡的正確指南？'
  options:
  - label: A
    content: 咖啡的刺激性強，吃完早餐再喝比較不傷胃
  - label: B
    content: 咖啡可以防癌利尿，好處說不盡，因此多喝不傷身
  - label: C
    content: 以中醫的角度來看，咖啡性辛溫，體質寒涼或燥熱者皆不適合飲用
  - label: D
    content: 拿鐵咖啡熱量低於黑咖啡，最適合減重者飲用。
