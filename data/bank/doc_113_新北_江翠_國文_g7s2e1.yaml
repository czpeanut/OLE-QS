    content: 荷塘周邊的林木蓊蓊鬱鬱，綠意盎然
  - label: B
    content: 荷塘的遠處是層層疊疊的山巒，月色下清晰可見
  - label: C
    content: 小路旁夜裡的路燈，明亮照人與月光呼應
  - label: D
    content: 蟬聲與蛙聲此起彼落，熱鬧非凡，與作者的心境相同。
