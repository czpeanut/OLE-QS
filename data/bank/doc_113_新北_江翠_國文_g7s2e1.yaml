- id: doc_113_新北_江翠_國文_g7s2e1_s3_12
  section: 3
  number: 12
  type: single
  page: 2
  stem: 根據《土芭樂的生存之道》一文，請問作者認為珍珠芭樂或是泰國芭樂的市場優勢為何？
  options:
  - label: A
    content: 果形圓潤，口感軟糯
  - label: B
    content: 香氣濃郁，口感清脆
  - label: C
    content: 價格低廉，老少咸宜
  - label: D
    content: 體型碩大，果實飽滿。
  lesson_raw:
    title: 土芭樂的生存之道
    basis: 題目出自《土芭樂的生存之道》
- id: doc_113_新北_江翠_國文_g7s2e1_s3_13
  section: 3
  number: 13
  type: single
  page: 2
  stem: 《土芭樂的生存之道》一文，作者了解兒時對土芭樂的無奈，其實都是其生存策略。請問下列領悟何者正確？
  options:
  - label: A
    content: 樹身滑溜：難以攀爬採摘，延長果實成熟時間
  - label: B
    content: 不同時間成熟：分散風險，避免被一次吃光
  - label: C
    content: 果實半硬半熟：減少被動物採食的機會
  - label: D
    content: 籽特別多：吸引更多鳥類覓食。
  lesson_raw:
    title: 土芭樂的生存之道
    basis: 題目出自《土芭樂的生存之道》
- id: doc_113_新北_江翠_國文_g7s2e1_s3_14
  section: 3
  number: 14
  type: single
  page: 2
  stem: '「委婉詞」是以其他詞語代替負面意涵的詞語，使語言優雅有禮貌的用法。以下何者運用了委婉詞？

    (甲)小江：國中畢業後，多年不見，你肯定日子過得無憂順心，身材發福了呢

    (乙)小翠：還可以啦，幾年前一場大病，當時以為命在旦夕，還好最終沒要了我的老命

    (丙)小江：還好如今都痊癒了，現在在那兒高就啊？

    (丁)小翠：經過那一場病，我工作辭了，如今在家享清福呢！'
  options:
  - label: A
    content: 丁
  - label: B
    content: 丙
  - label: C
    content: 乙
  - label: D
    content: 甲。
- id: doc_113_新北_江翠_國文_g7s2e1_s3_15
  section: 3
  number: 15
  type: single
  page: 2
  stem: 下列選項關於「會意」、「形聲」的說明，何者正確？
  options:
  - label: A
    content: 二者皆是「獨體」文
  - label: B
    content: 「會意」字有「形符」與「聲符」
  - label: C
    content: 「形聲」為合併兩個以上的字，並將它們的字義匯聚成新的字義的造字法則
  - label: D
    content: 「形聲」字數量最多，占漢字比例80%以上。
