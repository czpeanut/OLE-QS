  group_stem: '陳康肅公善射，當世無雙，公亦以此自矜①。

    嘗射於家圃，有賣油翁釋擔②而立，睨③之，久而不去。見其發矢④十中八九，但微頷⑤之。

    康肅問曰：「汝亦知射乎？吾射不亦精乎？」翁曰：「無他，但手熟爾⑥。」康肅忿然曰：「爾安敢輕吾射⑦！」翁曰：「以我酌油知之。」乃取一葫蘆置於地，以錢覆其口，徐以杓酌⑧油瀝之，自錢孔入而錢不濕。因曰：「我亦無他，惟手熟爾。」康肅笑而遣之。

    注釋：①矜：誇耀②釋擔：放下擔子③睨：斜著眼睛看④發矢：射箭⑤頷：點頭⑥手熟爾：技術熟練而已

    ⑦爾安敢輕吾射：你怎麼敢輕視我的射箭技術⑧酌：舀起液體倒入容器中

    歐陽脩 《賣油翁》'
