  number: 6
  type: single
  page: 4
  stem: 請問文中並未提到土芒果何種特色？
  options:
  - label: A
    content: 顏色
  - label: B
    content: 香氣
  - label: C
    content: 口感
  - label: D
    content: 加工。
  group_stem: '香港的芒果來自菲律賓，與台灣芒果的滋味有些不同。我個人的鑑賞經驗是，菲律賓芒果特別適合做成布丁啦、西米露什麼的，因為它的香味很濃烈，可能香港人也感受到了，所以，他們稱芒果為香芒。至於台灣的芒果，就很適合捧起來一口一口，汁水淋漓的啃食了。不斷改良使得芒果肉越來越豐厚，芒果核越來越單薄，芒果的甜度越來越高，而確實有些什麼是已經失去了的。我到香港才發現，就是那股香氣。

    小時候只有土芒果的年代，綠皮芒果成熟之後，那股甜香是充滿誘惑的。南部親戚家的院子裡常常就會種上幾棵芒果樹，鳥吃勝的就輪到人來吃了。我們採下幾顆還沒全熟透的果實，放在窗櫺上暖暖的日照裡，兩天之後，香氣逼人。那時候吃芒果其實是有點惆悵的，小小一顆芒果剝開來，啃個幾口，就是鼓鼓的果核了，果肉又都是絲絲，纏在將換未換的乳牙上，好難清理。吃完了連核也捨不得扔掉，將果核上殘留的絲絲刷白，畫上眼睛鼻子，就成了一張臉，可以玩一個暑假。吃過芒果的手指，被芒果染成黃色，也被芒果的香氣包裹著，這就是夏天。

    張曼娟 《染上香芒色》'
