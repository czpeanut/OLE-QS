- id: doc_113_新北_江翠_國文_g7s2e1_s3_7
  section: 3
  number: 7
  type: single
  page: 1
  stem: 《背影》一文中，作者用父親的「背影」象徵父愛，文中多處行為描述或具體事物，都和情感巧妙地聯繫在一起，賦予其更深層的意義，以下敘述何者正確？
  options:
  - label: A
    content: 父親把橘子一股腦兒放在作者的皮大衣上，代表了父愛的毫不保留
  - label: B
    content: 朱紅的橘子代表父子之間互動熱絡，情感沸騰
  - label: C
    content: 父親買橘子回來作者趕緊去攙扶，是因為想快點吃到橘子
  - label: D
    content: 父親買完橘子撲撲衣上的泥土很輕鬆似的，是為了掩飾經濟的窘迫。
  lesson_raw:
    title: 背影
    basis: 題目引用《背影》一文內容
- id: doc_113_新北_江翠_國文_g7s2e1_s3_8
  section: 3
  number: 8
  type: single
  page: 1
  stem: 國文課後，老師請飛雄教翔陽抄筆記，翔陽對《視力與偏見》一文的理解錯誤百出，下列哪一項筆記總算寫對了？
  options:
  - label: A
    content: 「任何白人和黑人結婚都會使父母蒙辱」——表達老人早年的種族觀點，認為白人的社會地位高於黑人
  - label: B
    content: 「我看不出人是白人，還是黑人，對我來講，我只知道他是好人，還是壞人」——表示老人因失去視力，感受比他人敏銳
  - label: C
    content: 「我們保留拒絕任何人的權利」——表達老人年輕時因為自己的膚色，拒絕與所有人交往
  - label: D
    content: 「可是我最苦惱的是，我弄不清楚對方是不是黑人」——老人感嘆因膚色而受歧視並遭遇不幸。
  lesson_raw:
    title: 視力與偏見
    basis: 題目探討《視力與偏見》課文內容
- id: doc_113_新北_江翠_國文_g7s2e1_s3_9
  section: 3
  number: 9
  type: single
  page: 2
  stem: 「倒反」是言詞表面的意義和作者內心的真意相反的修辭法，以下文句，何者沒有使用倒反修辭？
  options:
  - label: A
    content: 今天真是太幸運了，一沒帶傘就下雨了
  - label: B
    content: 你的開車技術真令人不敢恭維，倒車竟然開到安全島上？
  - label: C
    content: 你真是寫字高手，整篇文章沒一個字看得懂
  - label: D
    content: 胖虎的歌喉實在太高明了，演唱會上，所有的人都會昏倒。
- id: doc_113_新北_江翠_國文_g7s2e1_s3_10
  section: 3
  number: 10
  type: single
  page: 2
  stem: 關於《背影》一文中的寫作手法，下列何者說明正確？
  options:
  - label: A
    content: 作者多次提到自己「聰明」，其實是自責沒能幫父親去買橘子
  - label: B
    content: 以「現在―過去―現在」的倒敘法完成文章
  - label: C
    content: 詳細描述父親攀爬月臺吃力買橘子的過程，暗笑父親是個胖子，因而動作不靈活
  - label: D
    content: 紫毛大衣與父親的黑色系衣帽形成強烈對比，表現出父子的衣著品味不同，呼應前面形容父親的「迂」。
  lesson_raw:
    title: 背影
    basis: 題目分析《背影》寫作手法
