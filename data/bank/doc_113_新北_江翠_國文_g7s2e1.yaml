  section: 4
  number: 3
  type: single
  page: 4
  stem: 根據本文，勇者、勇怯半者、怯者跳躍淵谷的動力，依序是以下何者？
  options:
  - label: A
    content: 名譽/金錢/性命
  - label: B
    content: 尊嚴/權力/勇氣
  - label: C
    content: 恥辱/金錢/榮譽
  - label: D
    content: 權力/利益/威勢。
  group_stem: '今有三人焉，一人勇，一人勇怯半，一人怯。有與之臨①乎淵谷者，且告之曰：「能跳而越此，謂之勇，不然為怯。」彼勇者恥怯②，必跳而越焉，其勇怯半者與怯者則不能也。又告之曰：「跳而越者予千金，不然則否。」彼勇怯半者奔利，必跳而越焉，其怯者猶未能也。須臾，顧③見猛虎暴然④向逼，則怯者不待告，跳而越之如康莊⑤矣。然則人豈有勇怯哉？要在以勢驅⑥之耳。

    蘇洵 《勇怯論》


    注釋：①臨：來到 ②恥怯：以怯懦為恥辱 ③顧：回頭看 ④暴然：兇惡的樣子

