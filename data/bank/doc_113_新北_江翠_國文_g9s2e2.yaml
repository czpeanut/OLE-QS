- id: doc_113_新北_江翠_國文_g9s2e2_s2_29
  section: 2
  number: 29
  type: single
  page: 4
  stem: 根據上文，「王大怒，立欲誅偃師」主要原因是？
  options:
  - label: A
    content: 假人過於生動逼真，穆王受到驚嚇
  - label: B
    content: 假人撩撥穆王妻妾，踰越禮制
  - label: C
    content: 穆王以為假人為真人，擔心其叛變
  - label: D
    content: 穆王不相信假人的能力，認為偃師欺君。
  group_stem: '周穆王西巡狩，越崑崙，不至弇山。反還，未及中國，道有獻工人名偃師。穆王薦之，問曰：「若有何能？」偃師曰：「臣唯命所試。然臣已有所造，願王先觀之。」穆王曰：「日以俱來，吾與若俱觀之。」

    翌日偃師謁見王。王薦之，曰：「若與偕來者何人邪？」對曰：「臣之所造能倡(1)者。」穆王驚視之，趨步俯仰，信人也。巧夫！領其顱，則歌合律；捧其手，則舞應節。千變萬化，惟意所適。王以為實人也，與盛姬內禦並觀之。技將終，倡者瞬其目而招王之左右侍妾。王大怒，立欲誅偃師。偃師大懾，立剖散倡者以示王，皆傅會(2)革、木、膠、漆、白、黑、丹、青之所為。王諦料之，內則肝膽、心肺、脾腎、腸胃，外則筋骨、支節、皮毛、齒髮，皆假物也，而無不畢具者。合會復如初見。王試廢其心，則口不能言；廢其肝，則目不能視；廢其腎，則足不能步。穆王始悅而嘆曰：「人之巧乃可與造化者同功乎？」詔貳車載之以歸。
    ──列子〈偃師造倡〉

    注釋：(1)倡：倡優，藝人。這裡作動詞，指歌舞戲謔(2)傅會：同「附會」，湊合'
