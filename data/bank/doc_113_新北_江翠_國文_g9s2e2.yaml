    content: 並善待我此生所鍾愛呵護的家人。
  group_stem: "這天終將來臨──在一所出生和死亡接踵而來的醫院內，我的身軀躺在一塊潔白的床單上，床單的四角整齊的塞在床墊裡。在某一時刻，醫生將確診我的大腦已經停止思維，我的生命實際上已經到此結束。\n\
    \ 當這一時刻來臨時，請不必在我身上裝置起搏器，人為的延長我的生命。請不要把這床叫做臨終之床，把它稱為生命之床吧。請把我的軀體從這張生命之床上拿走，________________。把我的雙眼獻給一位從未見過一次日出、從未見過一張嬰兒的小臉蛋或者從未見過一眼女人眼中流露出的愛情的人；把我的心臟獻給一位心肌失能、心痛終日的人；把我的鮮血獻給一位在車禍中倖免死亡的少年，使他也許能看到自己的子孫盡情嬉戲；把我的腎臟獻給一位依靠人造腎臟週復一週生存艱難的人。拿走我身上的每一根骨頭，每一束肌肉，每一絲纖維，把這些統統拿盡，絲毫不剩，想方設法能使跛腳的小孩重新行走自如。\n\
    \ 探究我大腦的每一個角落。如有必要，取出我的細胞，讓它們生長，以便有朝一日一個啞兒能在棒球場上歡呼，一位聾女能聽到雨滴敲打窗子的聲音。\n 將我身上的其餘一切燃成灰燼。將這些灰燼迎風散去，化為肥料，滋潤百花。\n\
    \ 如果你一定要埋葬一些東西，就請埋葬我的缺點、我的膽怯和我對待同伴們的所有偏見吧！\n 把我的罪惡送給魔鬼，把我的靈魂交付上帝。\n 如果萬一你想記住我，那麼就請你用善良的言行去幫助那些需要得到你幫助的人們吧！假如你的所作所為無負我心，我將與世長存。\n\
    \ ── 羅伯特∙泰斯特〈記住我〉"
