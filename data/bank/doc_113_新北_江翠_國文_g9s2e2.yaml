- id: doc_113_新北_江翠_國文_g9s2e2_s2_31
  section: 2
  number: 31
  type: single
  page: 4
  stem: 第一段為點出下棋之樂趣所在，作者生動描繪出下棋雙方的不同反應，並提到若是被對方所窘，應表現出下列何種情態？
  options:
  - label: A
    content: 氣定神閒
  - label: B
    content: 趾高氣揚
  - label: C
    content: 尖酸刻薄
  - label: D
    content: 莫測高深。
  group_stem: "有一種人我最不喜歡和他下棋，那便是太有涵養的人。殺死他一大塊，或是抽了他一個車，他神色自若，不動火，不生氣，好像是無關痛癢，使得你覺得索然寡味。君子無所爭，下棋卻是要爭的。當你給對方一個嚴重威脅的時候，對方的頭上青筋暴露，黃豆般的汗珠一顆顆的在額上陳列出來，或哭喪著臉作慘笑，或抓耳撓腮(1)\
    \ ，或大叫一聲，或長吁短嘆(2) ……種種現象，不一而足，這時節你「行有餘力」便可以啜一碗茶，靜靜的欣賞對方的苦悶的象徵。我想獵人困逐一隻野兔的時候，其愉快大概略相彷彿。因此我悟出一點道理，和人下棋的時候，如果有機會使對方受窘，當然無所不用其極，如果被對方所窘，便努力作出不介意狀，因為既不能積極的給對方以苦痛，只好消極的減少對方的樂趣。\n\
    \ 笠翁(3) 閒情偶寄說弈棋不如觀棋，因觀者無得失心(4) ，觀棋是有趣的事，如看鬥牛、鬥蟋蟀一般，但是觀棋也有難過處，觀棋不語是一種痛苦。喉間硬是癢得出奇，思一吐為快。看見一個人要入陷阱而不作聲是幾乎不可能的事，如果說得中肯，其中一個人要厭恨你，暗暗的罵一聲「多嘴！」另一個人也不感激你，心想「難道我還不曉得這樣走！」如果說得不中肯，兩個人要一齊嗤之以鼻，「無見識的奴才！」如果根本不說，憋(5)\
    \ 在心裡，受病。 ──梁實秋〈下棋〉\n注釋：(1) 抓耳撓腮：抓抓耳朵，搔搔臉頰。形容人在喜悅、生氣、焦急或苦悶時的神情。 (2) 長吁短嘆：嘆息不已。表示非常憂戚。\
    \ (3) 笠翁：李漁，字笠翁，清代戲曲家。 (4) 得失心：在乎是非成敗的思慮、謀畫。 (5) 憋：音ㄅㄧㄝ，壓抑、強忍著。"
