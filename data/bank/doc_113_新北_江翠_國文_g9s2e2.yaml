questions:
- id: doc_113_新北_江翠_國文_g9s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 下列各項「 」中的注音寫成國字後，何組字形相同？
  options:
  - label: A
    content: 散失亡「ㄧˋ」／形貌「ㄧˋ」麗
  - label: B
    content: 坐南「ㄔㄠˊ」北／皆「ㄔㄠˊ」於齊
  - label: C
    content: 弦歌不「ㄔㄨㄛˋ」／低聲「ㄔㄨㄛˋ」泣
  - label: D
    content: 毛遂自「ㄐㄧㄢˋ」／「ㄐㄧㄢˋ」不容髮。
- id: doc_113_新北_江翠_國文_g9s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列「 」中的詞語經替換後，何者意思改變？
  options:
  - label: A
    content: 面「刺」寡人之過→指責
  - label: B
    content: 「旦日」客從外來→翌日
  - label: C
    content: 水到「渠」成→蓄水池
  - label: D
    content: 眾所「周」知→全、都。
- id: doc_113_新北_江翠_國文_g9s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 下列選項「 」中的字，何組讀音兩兩相同？
  options:
  - label: A
    content: 四季更「迭」／「喋喋」不休
  - label: B
    content: 審時「度」勢 ／「度」日如年
  - label: C
    content: 人工「畜」養／人「畜」共通
  - label: D
    content: 依山「傍」水 ／ 正氣「磅」礴。
- id: doc_113_新北_江翠_國文_g9s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 下列各選項「 」的字義，何者前後相同？
  options:
  - label: A
    content: 王之「蔽」甚矣 ／ 不「蔽」風日
  - label: B
    content: 天下獨「絕」／猿則百叫無「絕」
  - label: C
    content: 曾「益」其所不能／延年「益」壽
  - label: D
    content: 防民之口，甚「於」防川/莫不有求「於」王。
- id: doc_113_新北_江翠_國文_g9s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 魏晉南北朝的第一美男子潘安，每次外出，都引來不少少女圍著他，又向他的車子投擲水果，堪比現代受女生粉絲愛戴的偶像。後來人們就以「潘安之貌」來形容男子俊美。下列各選項中，哪一個成語不是用來形容美男子的？
  options:
  - label: A
    content: 明眸皓齒
  - label: B
    content: 器宇軒昂
  - label: C
    content: 玉樹臨風
  - label: D
    content: 風度翩翩。
- id: doc_113_新北_江翠_國文_g9s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 〈鄒忌諷齊王納諫〉一文中，鄒忌以為「吾妻之美我者，私我也；吾妾之美我者，畏我也；客之美我者，欲有求於我也。」根據這段文字敘述，下列何者最適合說明鄒忌性格？
  options:
  - label: A
    content: 臨淵履薄，戒慎恐懼
  - label: B
    content: 剛愎自用，自視甚高
  - label: C
    content: 勇於納言，心胸寬闊
  - label: D
    content: 善於分析，洞察事理。
  lesson_raw:
    number: L4
    title: 鄒忌諷齊王納諫
    basis: 題目引述〈鄒忌諷齊王納諫〉課文
- id: doc_113_新北_江翠_國文_g9s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 在<鄒忌諷齊王納諫>一文中，「令初下，群臣進諫，門庭若市；數月之後，時時而間進；期年之後，雖欲言，無可進者。」有關本段的說明，下列何者正確？
  options:
  - label: A
    content: 從「門庭若市」可以得知，諸侯各國前來朝貢的人非常多
  - label: B
    content: 「無可進者」是指因為沒有賞金，所以沒有臣民願意進諫
  - label: C
    content: 齊國得以步入正軌而大治的關鍵因素是齊王願意接納諫言
  - label: D
    content: 「時時而間進」一句可說明臣民已經不再熱衷於進諫齊王。
  lesson_raw:
    number: L4
    title: 鄒忌諷齊王納諫
    basis: 題目引述〈鄒忌諷齊王納諫〉課文
- id: doc_113_新北_江翠_國文_g9s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 關於＜鄒忌諷齊王納諫＞一文，下列何者敘述正確？
  options:
  - label: A
    content: 主旨為鄒忌勸諫威王應當重用賢臣，施行仁政
  - label: B
    content: 鄒忌以自身例子成功勸服齊王廣開言路，改善朝政
  - label: C
    content: 文末「戰勝於朝廷」指齊王善於用兵，故能在詭譎多變的世局中獲勝
  - label: D
    content: 文中大量運用排比、層遞句法，並以對話、動作、獨白來描寫齊王內心世界。
  lesson_raw:
    number: L4
    title: 鄒忌諷齊王納諫
    basis: 題目探討〈鄒忌諷齊王納諫〉文章內容
- id: doc_113_新北_江翠_國文_g9s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 「群臣吏民，能面刺寡人之過者，受上賞；上書諫寡人者，受中賞；能謗議於市朝，聞於寡人之耳者，受下賞。」這段話的涵義與下列何者最接近？
  options:
  - label: A
    content: 己所不欲，勿施於人
  - label: B
    content: 同心之言，其臭如蘭
  - label: C
    content: 豁達大度，納諫如流
  - label: D
    content: 蓼蓼者莪，匪莪伊蒿。
  lesson_raw:
    number: L4
    title: 鄒忌諷齊王納諫
    basis: 題目引述〈鄒忌諷齊王納諫〉課文
- id: doc_113_新北_江翠_國文_g9s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: (甲)一甲子(乙)一旬(丙)一世紀(丁)一刻(戊)一季。以上時間詞語，從時間長至短排列，何者順序正確？
  options:
  - label: A
    content: 丙甲戊乙丁
  - label: B
    content: 丙戊丁乙甲
  - label: C
    content: 丙丁甲戊乙
  - label: D
    content: 丙甲乙丁戊。
- id: doc_113_新北_江翠_國文_g9s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: ＜鄒忌諷齊王納諫＞：「燕、趙、韓、魏聞之，皆朝於齊。此所謂戰勝於朝廷。」其中「戰勝於朝廷」與下列何者涵義最為接近？
  options:
  - label: A
    content: 戰無不勝
  - label: B
    content: 天人交戰
  - label: C
    content: 不戰而勝
  - label: D
    content: 脣槍舌戰。
  lesson_raw:
    number: L4
    title: 鄒忌諷齊王納諫
    basis: 題目引述〈鄒忌諷齊王納諫〉課文
- id: doc_113_新北_江翠_國文_g9s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 有關〈永不滿足，長保傻勁〉的敘述，下列何者正確？
  options:
  - label: A
    content: 從學業、事業、愛情三方面作為主軸來進行論述，是一篇演講稿
  - label: B
    content: 以自己輟學的經驗勉勵學子們：應有始有終地完成學業方能有成
  - label: C
    content: 藉罹癌的經歷說明人生苦短，應把握當下及時行樂，方不枉此生
  - label: D
    content: 賈伯斯以「永不滿足，長保傻勁」來期許自己，也以此期勉學子。
  lesson_raw:
    number: L5
    title: 永不滿足，長保傻勁
    basis: 題目提及〈永不滿足，長保傻勁〉
- id: doc_113_新北_江翠_國文_g9s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 關於賈伯斯〈永不滿足，長保傻勁〉一文中主軸三個故事的說明，下列敘述何者錯誤？
  options:
  - label: A
    content: 藉輟學後轉而不受拘束的學習經驗，來闡釋許多不經意的學習成果都可能成為未來的資產
  - label: B
    content: 被自己創立的公司解雇一事，體悟到危機就是轉機，只有堅持理想、熱愛工作，方能克服重重困難
  - label: C
    content: 坦然面對癌症及死亡威脅，並從自己親身經歷體悟到：要堅持自己的直覺並勇往直前，才能活出自我
  - label: D
    content: 從自己被藍領階級領養的經歷，發現不受教條束縛、不隨波逐流才能活出真正自我。
  lesson_raw:
    number: L5
    title: 永不滿足，長保傻勁
    basis: 題目提及賈伯斯〈永不滿足，長保傻勁〉
- id: doc_113_新北_江翠_國文_g9s2e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 〈永不滿足，長保傻勁〉是一篇翻譯文學，文中的地名、人名都採用音譯方式，是外來語。下列文句「 」中的詞語，何者也是外來語？
  options:
  - label: A
    content: 她整天在家上網，真是標準的「英英美代子」
  - label: B
    content: 這個「便當」要五百元，一般人家吃不起
  - label: C
    content: 老吳又「出搥」了，事情又搞砸了
  - label: D
    content: 造勢會場，「凍蒜」的聲音此起彼落。
  lesson_raw:
    number: L5
    title: 永不滿足，長保傻勁
    basis: 題目提及〈永不滿足，長保傻勁〉
- id: doc_113_新北_江翠_國文_g9s2e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 〈永不滿足，長保傻勁〉一文中，賈伯斯認為「被蘋果炒魷魚反而是人生中最棒的一件事」，以下那一選項的情況與此不同？
  options:
  - label: A
    content: 疫情衝擊，致時裝店停業，荷蘭某一精品時尚店推出「私人購物」方案，以包場方式，讓顧客可獨自在規定時間內享受購物，提供給顧客頂級服務
  - label: B
    content: 數位時代來臨，紙本書籍漸被網路電子書所取代，面臨倒閉窘境。某實體書店規劃空間，加入餐飲區，提供讀者一個能享受閱讀、享受美食的去處
  - label: C
    content: 掉入古井裡的老驢子，在面臨困境時奮力掙扎、哀號求救，希望有人發現並加以救援
  - label: D
    content: 李奕翰當初在甄選畢業作品時落敗，轉而花心思重新將外國名劇和當今社會的情感及環境串連，作為畢業發表，此舉使得果陀劇場製作人提出合作邀約。
  lesson_raw:
    number: L5
    title: 永不滿足，長保傻勁
    basis: 題目引述〈永不滿足，長保傻勁〉
- id: doc_113_新北_江翠_國文_g9s2e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 賈伯斯說：「我沒有大學文憑，現在大概是我最接近大學畢業典禮的一刻！」此段話流露出何種語氣或心態？
  options:
  - label: A
    content: 自我調侃
  - label: B
    content: 忐忑不安
  - label: C
    content: 夜郎自大
  - label: D
    content: 唏噓感嘆。
  lesson_raw:
    number: L5
    title: 永不滿足，長保傻勁
    basis: 題目引述賈伯斯〈永不滿足，長保傻勁〉演講詞
- id: doc_113_新北_江翠_國文_g9s2e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 「一個人怎麼會被自己創辦的公司開除呢？當蘋果日益擴大……」句中使用「設問」修辭中的「提問」，與下列何者相同？
  options:
  - label: A
    content: 兩兔傍地走，安能辨我是雄雌
  - label: B
    content: 你一個人與陌生網友見面不危險嗎？
  - label: C
    content: 什麼是幸運？就是會掌握機會力求表現
  - label: D
    content: 喬丹如果沒有日積月累的努力，又怎麼會成功呢？
  lesson_raw:
    number: L5
    title: 永不滿足，長保傻勁
    basis: 題目引述〈永不滿足，長保傻勁〉課文句子
- id: doc_113_新北_江翠_國文_g9s2e2_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 「生命就像一只皮箱，雖然裝得不多，卻能擠得很扎實。」針對這句話的分析，下列何者最恰當？
  options:
  - label: A
    content: 人生的路雖然漫長艱辛，但還是要不斷向前衝
  - label: B
    content: 我們無法控制生命的長度，卻能拓展它的寬度
  - label: C
    content: 將回憶裝進皮箱，在生命的旅途中快樂遨遊
  - label: D
    content: 要走進人群，才能感受到關懷與生命的溫暖。
- id: doc_113_新北_江翠_國文_g9s2e2_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 下列文句，何者沒有語病?
  options:
  - label: A
    content: 人為刀俎，我為魚肉，我們各取所需，有什麼不好呢
  - label: B
    content: 現代人寫的作文，遣詞立意之差，實在令人嘆為觀止
  - label: C
    content: 她負笈國外多年，每次想到母親的拿手菜，不免流連忘返
  - label: D
    content: 我置身於花園幽徑，洗滌一身的疲憊。
- id: doc_113_新北_江翠_國文_g9s2e2_s1_20
  section: 1
  number: 20
  type: single
  page: 3
  stem: 「橫溢的天才一如沃土，如果不加耕耘，也可能產生一些莠草。」此句話的含義，與何者相同？
  options:
  - label: A
    content: 行百里者半九十
  - label: B
    content: 要怎麼收穫，先那麼栽
  - label: C
    content: 理想如種子，落地生根長芽才有價值
  - label: D
    content: 成功者是一分的天賦，加上九十九分的努力。
- id: doc_113_新北_江翠_國文_g9s2e2_s1_21
  section: 1
  number: 21
  type: single
  page: 3
  stem: 李清照 如夢令：「常記溪亭日暮。沉醉不知歸路。興盡晚回舟，誤入藕花深處。爭渡！爭渡！驚起一灘鷗鷺。」關於這闋詞的內容，下列何者正確？
  options:
  - label: A
    content: 這是一首回憶之作，懷想舊日上午赴溪畔亭子遊玩之事
  - label: B
    content: 因為飲酒過多，身子昏沉不適，所以當日提早返家休憩
  - label: C
    content: 作者賦歸行水路，因船夫駛錯路線，延宕了到家時辰
  - label: D
    content: 船兒誤入荷花叢裡，故奮力划槳，嚇得水鳥紛紛飛起。
- id: doc_113_新北_江翠_國文_g9s2e2_s1_22
  section: 1
  number: 22
  type: single
  page: 3
  stem: 下列「 」中的詞語，何者運用不當 ？
  options:
  - label: A
    content: 這起案件有如羅生門般「撲朔迷離」，不知道誰是真正凶手
  - label: B
    content: 你別嫉妒他的業績「扶搖直上」，這可是他平日努力的成果
  - label: C
    content: 這場棒球總決賽非常精彩，雙方的守備簡直是「無懈可擊」
  - label: D
    content: 那個「天花亂墜」的花卉展覽會場，使人宛如置身仙境之中。
- id: doc_113_新北_江翠_國文_g9s2e2_s1_23
  section: 1
  number: 23
  type: single
  page: 3
  stem: 「文帝嘗令東阿王七步中作詩，不成者行大法 。應聲便為詩曰：『煮豆持作羹，漉菽以為汁，萁在釜下燃，豆在釜中泣，本是同根生，相煎何太急。』帝深有慚色。」這是曹植在哥哥曹丕威脅下，在七步內作詩的故事，此故事最可能出自＜世說新語＞的那一篇？
  options:
  - label: A
    content: 文學
  - label: B
    content: 捷悟
  - label: C
    content: 賞譽
  - label: D
    content: 政事。
