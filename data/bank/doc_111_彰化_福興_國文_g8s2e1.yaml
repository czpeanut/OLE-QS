  group_stem: '晉惠帝 永康元年，京師得異鳥，莫能名①。趙王倫使人持出，周旋城邑，匝以問人②。即日③，宮西有一小兒見之，遂自言曰：「服留鳥。」持者還白倫。倫使更求，又見之。乃將④入宮。密籠鳥⑤，并閉小兒於戶中。明日往視：悉不復見。

