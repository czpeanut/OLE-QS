  stem: 根據本詩，下列敘述何者正確？
  options:
  - label: A
    content: 第一、二句透過對比，暗指懷憂度日的不智
  - label: B
    content: 第三、四句點出生命短暫，應努力建功立業
  - label: C
    content: 第五、六句說明如果沉迷享樂，未來將會一無所成
  - label: D
    content: 第七、八句批判愛財者對社會毫無貢獻，將為後代所恥笑
  group_stem: '生年不滿百，常懷千歲憂。

    晝短苦夜長，何不秉燭遊？

    為樂當及時，何能待來茲①？

    愚者愛惜費②，但為後世嗤③。

    仙人王子喬④，難可與等期⑤。

    《古詩十九首・生年不滿百》

    【注釋】①來茲：將來。②愛惜費：吝惜錢財。③嗤：音ㄔ，譏笑。④王子喬：神話傳說的仙人，相傳為周靈王的兒子。⑤等期：相同的壽命。'
