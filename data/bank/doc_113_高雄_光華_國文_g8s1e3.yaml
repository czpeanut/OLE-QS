  stem: 靜香想要把本文所述畫成油畫，草擬了四個構圖方向，下列哪個構圖的想法最符合文中情境?
  options:
  - label: A
    content: 菱角田中，菱角農穿著短裤汗衫採菱角
  - label: B
    content: 在菱角田中，雄鳥護著雌鳥和同類爭戰
  - label: C
    content: 雄水雉從巢中站起，露出底下四隻雛鳥
  - label: D
    content: 在一片綠意盎然的菱角田中菱農採菱角。
  group_stem: '臺南官田由於埤塘密度居臺灣最高，而成為菱角産量最大的地方，號稱「菱角故鄉」。每到秋冬，菱農划著小舟或穿著連身雨衣褲，泡在水中菱田採收，形成獨有的風光。採紅菱是秋冬景象。至於春天呢？沒有紅菱可採的菱角田更熱鬧，因為水雉鳥來下蛋了。

    水雉依菱角田而生，所以又被稱為「菱角鳥」，牠們會築巢在薄薄的菱角葉上，每年四到九月是牠們的繁殖期。水雉雌鳥的體型比雄烏大，在縶殖期間，雌烏會打鬥爭奪地盤，雄鳥則在家帶孩子。雌鳥只負責生蛋，一窩下完四個蛋後，便交給雄鳥養育，自己將另尋新歡。雄水雉是很負責的奶爸，如果離巢覓食，回巢後會先數一數蛋的數量是否正璀，再用嘴把蛋推進翅膀底下，不讓蛋外露。

    冬天時因菱角田枯萎，水雉會移居到其他溼地覓食；等到春天，綠意重新回到水塘，水雉才會再回來。菱角田上的水雉是官田獨有的春色，季節限定，也是區域限定。然而屬於二級保育鳥的水雉，曾經由於環境驟變，使得族群數量銳減到五十隻。經過多年的復育，現在恢復到一千隻以上。

    改寫自王文靜〈春天・菱角田上的鳥界武則夭〉'
