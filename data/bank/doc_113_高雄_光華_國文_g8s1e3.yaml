  section: 2
  number: 49
  type: single
  page: 8
  stem: 關於「送行」一事，下列何者最符合作者的想法?
  options:
  - label: A
    content: 即便平日不相往來，對其印象不佳，仍然必須禮貌的應酬送別
  - label: B
    content: 對於知己摯友的送行最好省略,因為難以承受依依不捨之傷痛
  - label: C
    content: 「餞行」是我輩重視的禮節，應發揚光大，使遠行人感到溫暖
  - label: D
    content: 遠行者沒有親友送行，亦有著「千山我獨行不必相送」的灑脫。
  group_stem: '在現代人的生活裡，送行是和拜壽送殯等一樣的成為應酬的禮節之一。「揪著公雞尾巴」起個大早，迷迷糊糊的趕到車站碼頭，擠在亂哄哄人群裡面，找到你的對象，扯幾句淡話，好不容易耗到汽笛一叫，然後鳥獸散，吐一口輕鬆氣，噘著大嘴回家。這叫做周到。在被送的那一方面，覺得熱鬧，人緣好，沒白混，而且體面，有這麼多人捨不得我走，斜眼看著旁邊的沒人送的旅客，相形之下，尤其容易起一種優越之感，不禁精神抖擻，恨不得對每一個送行的人要握八次手，道十回謝。悄然而行似是不大舒服，如果別的旅客在你身旁耀武揚威的與送行的話別，那會增加旅中的寂寞。

    送行既是人生中所不可少的一件事，送行的技術也便不可不注意到。如果送行只限於到車站碼頭報到，握手而別，那麼問題就簡單，但是我們中國的一切禮節都把「吃」列為最重要的一個項目。一個朋友遠別，生怕他餓著走，餞行是不可少的，恨不得把若干天的營養都一次囤積在他肚裡。我想任何人如有遠行而消息外露（多半還是自己宣揚），他有理由期望著餞行的帖子紛至沓來，短期間家裡可以不必開伙。還有些思慮更周到的人，把食物攜在手上，親自送到車上船上，好像是你在半路上會要挨餓的樣子。

    我不願送人，亦不願人送我，對於自己真正捨不得離開的人，離別的那一剎那像是開刀，凡是開刀的場合照例是應該先用麻醉劑，使病人在迷蒙中度過那場痛苦，所以離別的苦痛最好避免。一個朋友說：「你走，我不送你，你來，無論多大風多大雨，我要去接你。」我最賞識那種心情。

    節選自梁實秋〈送行〉'
