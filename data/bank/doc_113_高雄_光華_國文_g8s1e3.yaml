  stem: 文中的戲劇實際上是由下列何者所演出?
  options:
  - label: A
    content: 賓客
  - label: B
    content: 道士
  - label: C
    content: 狐精
  - label: D
    content: 童子。
  group_stem: '龔集生言：「乾隆己未，在京師寓靈佑宮，與一道士相識，時共杯酌。一日觀劇，邀同往，亦欣然相隨。薄暮歸，道士拱揖曰：「承諸君雅意，無以為酬，今夜一觀傀儡可乎？」入夜，至所居室中，惟一大方几，近邊略具酒果，中央則陳一棋局，呼童子閉外門，請賓四面圍几坐。酒一再行，道士拍界尺一聲，即有數小人長八九寸，落局上，合聲演劇。呦呦嚶嚶，音如四五歲童子；而男女裝飾，音調關目，一一與戲場無異。一出(齣)終，瞥然不見。又數人落下，別演一出。眾且駭且喜。暢飲至夜分，道士命童子於門外几上置雞卵數百，白酒數罌。戛然樂止，惟聞哺啜之聲矣。詰其何術。道士曰：「凡得五雷法者，皆可以役狐。狐能大能小，故遣作此戲，為一宵之娛。然惟供驅使則可。若或役之盜物，役之祟人，或攝召狐女薦枕席，則天譴立至矣。」眾見所未見，乞後夜再觀，道士諾之，次夕詣所居，則早起已攜童子去。

    紀昀 〈閱微草堂筆記卷十五〉'
