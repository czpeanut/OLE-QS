  type: single
  page: 3
  stem: 從上文以及你的歷史知識判斷，請問：下列敘述何者正確？
  options:
  - label: A
    content: 文中提到 1917 年的那場戰爭是指第二次世界大戰
  - label: B
    content: 1991 年烏克蘭共和國的建立與戈巴契夫的改革有關
  - label: C
    content: 「蘇聯」是列寧在二月革命時推翻沙皇後所建立的
  - label: D
    content: 希特勒佔領烏克蘭開啟第二次世界大戰的歐洲戰場
  group_stem: 2022 年2 月俄烏開戰，從此俄烏戰爭成為國際注目焦點。然而烏克蘭這塊土地，原是俄羅斯帝國的領土。1917 年，俄羅斯帝國因為戰爭而崩解，烏克蘭在敵對國家的扶持下，短暫獨立了半年。隨後就因為戰爭結束，又回歸俄羅斯。此後烏克蘭跟俄羅斯等國，共同創立一個新的國家聯盟，史稱「蘇聯」。後來希特勒曾經佔領烏克蘭全境，但兩年後烏克蘭就把侵略者驅逐，從此烏克蘭與俄羅斯同屬於蘇聯，直到1991
    年。1991 年8 月24 日烏克蘭政府發表《國家獨立宣言》，正式宣布獨立，改國名為烏克蘭共和國。俄烏開戰的原因複雜，其中原因之一是因俄羅斯反對烏克蘭加入A
    組織。俄羅斯認為，烏克蘭加入此組織將對其國家安全造成威脅，因為此組織是一個軍事同盟，其成員國承諾會互相保護，一旦烏克蘭加入此組織，相當於歐美的軍事部署與俄羅斯接壤，俄羅斯將面臨著更加緊張的國境局勢。
  answer:
  - B
  answer_source: answer_key_vlm
