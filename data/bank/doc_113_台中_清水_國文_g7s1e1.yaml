    content: 難以相信
  group_stem: '人本來是生自自然的，只是因為如今生存存在現代文明的牢籠裡，遠離了自然。人一旦進入自然環境之中，就會像回到故鄉一樣的快樂；一草一木都像闊別多年的老朋友，自有一番情趣。

    自然之趣到處都有，並不限於名山大川。如果你把所居的城市看成你的家，那麼植物園就是你家的後院。坐在自己後院，看到春天透過新葉的陽光，任微風送來花香，都可以怡然自得。

    植物園近在咫尺，自然之趣，不必遠求。'
