  group_stem: '〈自然的微笑〉 劉大白

    隱隱的曙光一線，在黑沉沉的長夜裡，突然地破曉。

    霎時烘成一抹錦也似的朝霞，彷彿沉睡初醒的孩兒，

    展開蘋果也似的雙頰，對著我微笑。

    黃昏一片淺藍天，一半被魚鱗似的白雲籠罩。

    冉冉地吐出一彎鉤也似的明月，

    彷彿含羞帶怯的新婦，

    只露出一些兒眼角眉梢，對著我微笑。

    鏡也似的平湖，映著胭脂也似的落照。

    忽然幾拂輕風，皺起紗也似的波紋，

    彷彿曲終舞罷的女郎，

    把面罩籠著半嬌半倦的臉兒，對著我微笑。'
