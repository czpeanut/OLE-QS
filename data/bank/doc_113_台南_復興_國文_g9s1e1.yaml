- id: doc_113_台南_復興_國文_g9s1e1_s4_5
  section: 4
  number: 5
  type: single
  page: 8
  stem: 依據【甲】文，下列敘述，何者最恰當？
  options:
  - label: A
    content: 「世傳虹能入溪澗飲水，信然」表達孫彥先認同世俗之說
  - label: B
    content: 「使人過澗，隔虹對立」虹欲人接近，但他們只敢對立相望
  - label: C
    content: 「自西望東則見——蓋夕虹也」作者發現太陽與彩虹方位相對
  - label: D
    content: 「次日行一程，又復見之」作者所見的彩虹其出現持續了一天。
  group_stem: '【甲】〈異事異疾附‧虹〉

    　　世傳虹能入溪澗飲水，信然。熙寧中①，予使契丹，至其極北黑水境永安山下卓帳②。是時新雨霽，見虹下帳前澗中，予與同職扣③澗觀之，虹兩頭皆垂澗中。使人過澗，隔虹對立，相去數丈，中間如隔綃穀④。自西望東則見——蓋夕虹也；立澗之東而西望，則為日所鑠，都無所睹。久之，稍稍正東，逾山而去。次日行一程，又復見之。孫彥先⑤云：「虹乃雨中日影也，日照雨則有之。」

    ——改寫沈括《夢溪筆談》

    📖①熙寧中：熙寧，宋神宗趙頊年號。 ②卓帳：豎起帳篷。 ③扣：靠近。

    　④綃穀：泛指輕紗之類的絲織品。 ⑤孫彥先：孫思恭，字彥先，北宋進士，精通天文曆算。

    【乙】東邊下雨西邊晴 超美雙彩虹午後現身大臺北

    　　大臺北地區雖未下雨，午後卻出現美麗的雙彩虹，市區街道兩旁吸引不少民眾駐足欣賞。氣象局預報員林定宜指出，今天受東北季風影響，僅大臺北東部山區下雨，而西邊的市區卻陽光普照，一雨一晴，才會出現難得的雙彩虹美景。每到冬季東北季風來襲，臺北東部往往迎風面，而下起地形雨；到了下午，太陽西移，臺北西邊反而有陽光露臉。當陽光以不同角度照射這些小水滴時，會在水滴內產生折射與反射等光學作用。

    　　依據氣象署資料，陽光在水滴內經過折射與反射後，出射光線與入射陽光夾角在 $40^{\circ}\sim 42^{\circ}$ 的反射強度最大，因此在觀察者視線與地平面呈
    $42^{\circ}$ 左右的仰角時，可以觀察到虹（Primary Rainbow）的形成，這是陽光在水滴內經過一次反射及兩次折射的結果。由於不同波長光線對水滴的折射率不同，使得紫色光偏折的角度最大，紅色光偏折的角度最小，所以虹的色彩排列是內紫外紅。

    　　霓（Secondary Rainbow）的成因與虹相同，都是陽光通過小水滴時被色散而成；但形成霓的陽光在水滴裡是經過兩次反射及兩次折射，所以霓出現的角度比虹稍高（仰角約
    $50^{\circ}$ 左右），其寬度約為虹的兩倍，而且由於多一次反射，所以強度（明顯度）只有虹的十分之一，色彩排列則與虹相反，為內紅外紫。

    　　虹與霓是觀察者看見的一種光學現象，因此會隨著觀察者的位置而改變。太陽必須由觀察者的後方以低角度照射，才有機會觀察到虹與霓，如果太陽的角度太大（如正午直射），則大部分的虹將落於地平面以下而無法被我們觀察到。完整的虹與霓為正圓形，觀察者必須在高空才有機會看到，在地面上由於受到地形與角度的關係，所以我們見到的虹與霓是弧形的。此外，小水滴的大小決定了虹與霓的色彩強度與寬度；水滴越大，則色帶寬度越窄，但色彩越鮮明；反之，則色帶寬度越寬而色彩黯淡。

    ——改寫《自由時報》'
