    雖然網路有助於群眾看到更多元化的資訊，但是社群媒體獨有的運算機制，依據先前的網路足跡，像是按讚、點擊和搜尋紀錄等，運算出個人可能感興趣或認同的內容，稱為「過濾氣泡現象」（Filter
    Bubble）。除了數據演算之外，訊息偏好選擇也正在縮縮對社會的認知範圍，產生「回聲室效應」（Echo Chamber）。意指在相對封閉的環境中，觀點相近的聲音有如回聲不斷重複，加深自身單一信念的認同。無論是過濾氣泡現象或是回聲室效應，都易令人以為這是社會的全貌。若出現意見相左的訊息，就會產生認知衝突。'
