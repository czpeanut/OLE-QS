- id: doc_113_台南_復興_國文_g9s1e1_s4_1
  section: 4
  number: 1
  type: single
  page: 6
  stem: 下列關於本文的說明，何者正確？
  options:
  - label: A
    content: 罹癌的母親特地向作者傳授滷肉作法，讓她可以時時重溫懷念的菜色
  - label: B
    content: 出身商人家庭的母親為求效率，豬肉飛水後加水與佐料並煮節省時間
  - label: C
    content: 母親很重視肉的品質，會先用 LINE 向肉販預約俗稱「太興」的帶皮肩胛肉
  - label: D
    content: 當作者遭遇挫折，常烹煮母親所教的滷肉，再邀請家人品嘗，回味往昔時光。
  group_stem: '滷肉是我家老菜，也是許多臺灣家庭的家常菜色，從前天天都吃。如今一家之中，滷肉的人剩下我，倒成了難得的菜。媽媽癌末時期，最後一道從頭到尾手把手教我的菜，也是滷肉。有時聽聞別人說，想念家裡某某從前燒的什麼菜，但人沒了，菜也一起沒了，就心生警惕。我的經驗是，若有什麼一生持續想念的菜色，趕得及，就應該設法學會。逝者喚不回，如果連菜也丟了，味覺以後就再也無處可泊岸。

    　　媽媽癌症病中，站立三分鐘都疲勞不堪，但滷肉的開場，將豬肉煸炒到必須程度，需十幾分鐘，她全程站著，為了讓我見到應有醬色。她逐步解釋，我凝神狂記，記下的全數緊握不放。

    　　滷肉有兩派主流做法。一種是豬肉飛水後，加水和佐料一起燉煮，另一種是我家這種先炒後燉的，不知是否因為商人家庭講效率，我家燉什麼肉，都先煎炒過。炒了再燉很有好處，油都煸出來了，肥肉也不膩，且能定形，肉軟而形不散。

    　　豬肉必須是本地溫體黑豬，我媽指定部位，不是常見的三層肉，而是閩南語發音的「太興」，帶皮肩胛肉，豬頸以下胸上這塊。肉味濃郁，久燉不爛。太興量少而暢銷，前一天要先跑一趟市場，請肉販預留。而我慣去一家中山市場的肉販，現已開放用
    LINE 預約。

    　　我自己的版本，一塊太興，會多混一塊三層肉同鍋燉，有時候加豬皮一塊，取其油豐膠厚。大鍋滷肉更美，肉少熬不出足夠膠質，連皮帶肉切厚方塊。

    　　熱鍋，鍋底只下薄油，豬肉入鍋，皮烙到起泡見痕，豬肉本身的油脂，滋滋地冒出來。要耐性，炒足時間，直到每一塊肉都上色，微帶焦痕。將肉撇到鍋子一側，或是另取大碗先盛起來。此時鍋底已積了不少豬油，入一整碗的紅蔥頭薄片，和兩瓣大略拍過的蒜，轉小火，將紅蔥在豬油裡炸酥，幾乎成了油蔥，小心不能焦，瀝油盛起來。油裡再炒糖色。

    　　油裡炒糖，轉化成焦糖的狀態，我媽總是用閩南語說：「炒糖鳥。」從來不講華語的「炒焦糖」或是「炒糖色」。我媽留下來的筆記，所有滷水，成分裡都有「糖鳥」二字。臺式滷肉不同於江浙菜中的紅燒肉，顏色燒起來比較淺，亮棕色。顏色紅，像下了色素，其實靠的是糖鳥。

    　　糖融化後轉成糖鳥，糖色一轉，速將肉傾回鍋中翻拌，肉裹上糖，速在鍋邊嗆半碗米酒，再嗆醬油。我媽交代，醬油和酒一定在鍋邊燒過，不能直接澆在肉上，醬油遇鍋熱，滋一聲瞬沸起來，才出烈香。最後兌清水，醃過肉，油蔥也入鍋，嘗嘗味道，比喝湯略鹹，就轉中小火，加蓋燉煮。

    　　我家滷肉，不太愛放五香或是滷包。香料僅有兩種，中藥行的上好白胡椒，一到兩枚八角。肉用上好的，醬又炒得香，就足了。過程中，撇掉浮沫，直火燉煮到軟。

    　　母後至今，如遇困難，無端端孤兒意識滋長起來的時候，就滷肉。慢慢切件、翻炒、滷一大鍋，趁熱下肚，以治心堵。當香氣開始流淌在小公寓裡，就回去和兒時那個完整無缺的家族團圓。

    ——改寫自洪愛珠〈滷肉之家〉'
