  group_stem: '【甲】

    　　虎丘去城可六七里，其山無高岩深壑，獨以近城，故簫鼓樓船，無日無之。凡月之夜，花之晨，雪之夕，遊人往來，紛錯如織，而中秋為尤勝。每至是日，傾城闔戶，連臂而至。衣冠仕女，下至郤屋①，莫不靚妝麗服，重茵累席，置酒交衢間。從千人石上至山門，櫛比如鱗，檀板②丘積，樽罍③雲瀉。遠而望之，如雁落平沙，霞鋪江上，無得而狀。

    📖①郤屋：指貧苦人家，郤，音ㄑㄧˋ。②檀板：檀木製的拍板。③樽罍：酒器

    ——節錄自袁宏道〈虎丘記〉

    【乙】

    　　夫舉天下之至美與其樂，有不得兼焉者多矣。故窮山水登臨之美者，必之乎寬閒之野、寂寞之鄉，而後得焉。覽人物之盛麗，跨都邑之雄富者，必據乎四達之衝、舟車之會，而後足焉。蓋彼放心於物外而此娛意於繁華二者各有適焉然其為樂不得而兼也。

    　　今夫所謂羅浮、天臺、衡岳、洞庭之廣，三峽之險，號為東南奇偉秀絕者，乃皆在乎下州小邑，僻陋之邦。此幽潛之士，窮愁放逐之臣之所樂也。若四方之所聚，百貨之所交，物盛人眾，為一都會，而又能兼有山水之美，以資富貴之娛者，惟金陵、錢塘。然二邦皆僭竊於亂世，及聖宋受命，海內為一，金陵以後服見誅。今其江山雖在，而頹垣廢址，荒煙野草，過而覽者，莫不為之躊躇而淒愴。獨錢塘，自五代始時，知尊中國，效臣順；及其亡也，頓首請命，不煩干戈，今其民幸富完安樂。又其俗習工巧，邑屋華麗，蓋十餘萬家。環以湖山，左右映帶，而閩商海賈①，風帆浪舶，出入於江濤浩渺、煙雲杳靄②之間，可謂盛矣。而臨是邦者，必皆朝廷公卿大臣。若天子之侍從，四方遊士為之賓客，故喜占形勝，治亭榭③，相與極遊覽之娛。然其於所取，有得於此者，必有遺於彼。獨所謂有美堂者，山水登臨之美，人物邑居之繁，一寓目而盡得之。蓋錢塘兼有天下之美，而斯堂者，又盡得錢塘之美焉。宜乎梅公之甚愛而難忘也。

    📖①閩商海賈：指福建一帶的商人。②杳靄：雲氣繁盛的樣子。③榭：建築在臺上的房屋。

    ——改寫自歐陽脩〈有美堂記〉'
