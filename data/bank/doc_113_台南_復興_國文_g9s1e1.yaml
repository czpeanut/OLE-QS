  stem: '下列選項，何者無法從本文中得知臺灣花磚的相關訊息？

    臺灣老花磚在百年前刻畫出臺灣人對家的情感：花磚上桃子紋樣代表祈求長輩長壽，蘋果紋樣代表平安，香蕉鳳梨紋樣則期盼來年豐收，石榴紋樣渴望家族多子多孫。這些花磚會被鑲在房子最顯眼的地方，在展示富貴與品味之餘，祈求保祐一家平安，於是花磚成了一種類似家紋般的存在。

    然而這些珍貴的花磚因為手工繁複及產地因素，只出現在 1915 至 1935 年，且因二戰爆發而停產，雖然流行短短不到二十年的時間，卻因數千棟花磚古厝皆是融合了臺灣在地的建築藝術，如剪黏、泥塑、紅磚等，而讓臺灣的花磚文化成為亞洲最具特色的代表。2016
    年，臺灣花磚與世界各地花磚文化被法國艾克斯馬賽大學領銜提送聯合國教科文組織「非物質文化遺產」申請。'
