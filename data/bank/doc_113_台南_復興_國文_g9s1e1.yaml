    文化部為鼓勵數位閱讀、促進出版業數位轉型，規劃首年投入一億元，於112年9月推出「擴大推動電子書計次借閱服務」，滿3個月後，各縣市總計人數成長達2.6倍！

    擴大電子書計次借閱，帶來的改變？

    共創讀者、圖書館與出版創作利益

    讀者透過「電子書計次借閱服務」每借閱一次，圖書館將支付3元給平台、9元給出版社及作者，形成閱讀與出版創作的正向循環。

    此外各縣市若加碼購買電子書計次借閱點數，將獲得政府額外補助：直轄市最高增加2倍、縣市最高9倍的點數投入。

    讀者可享有？

    112年9月起，與文化部合作之20縣市公共圖書館可享：(臺北市、彰化縣未加入)

    ☑計次平台無借閱點數上限

    ☑隨時借閱想看的書籍

    ☑免排隊、零額外付費

    借閱計次電子書操作懶人包

    1 進入常去電子書借閱平台

    2 登入圖書館借閱證帳號

    3 開始瀏覽、借閱感興趣的書籍

    常見平台登入方式

    台灣雲端書庫登入步驟：1. 點選頁面右上角的「登入」鍵 2. 輸入借閱證帳密，點「登入」

    HyRead ebook登入步驟：1. 點開頁面右上角的「三」符號 2. 點選「登入」鍵 3. 輸入借閱證帳密，點選「登入」

    Read ebooks登入步驟：1. 點選頁面右上角的「登入」鍵 2. 於「單位類型」點選公共圖書館，再點選單位名稱 3. 輸入借閱證帳密，點選「登入」

    借閱規則 Q&A

    1. 如尚未擁有任一圖書館借閱證，可洽各所在地圖書館臨櫃或網路辦證。

    2. 每個讀者單一平台書庫中可以同時有10本書，一次可借閱14天，如提前閱讀完畢，可手動歸還(須至少閱讀1天後)，即可再借閱其他電子書。

    3. 借閱14天到期系統會自動歸還，不會有逾期的問題。但為避免資源浪費，如歸還時電子書檔案均未被開啟，系統將提醒，如累計5本以上，將停止該讀者計次借閱權限1個月。'
