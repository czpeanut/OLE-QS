- id: doc_113_台中_中港_英語_g8s2e2_s4_34
  section: 4
  number: 34
  type: single
  page: 4
  stem: Why did Tom have to work in a factory?
  options:
  - label: A
    content: His family needed money.
  - label: B
    content: He wanted to go to school.
  - label: C
    content: He did not like school.
  - label: D
    content: The factory owner asked him to.
  group_stem: 'Tom was only ten years old, but he had to work in a factory every day
    instead of going to school. Every morning, he woke up and walked to the factory
    before the sun rose. The air inside was hot and dusty, and the machines were loud.
    Tom''s job was to carry heavy boxes and clean the machines. His hands were rough,
    and his back hurt from holding things all day. He often felt tired, but he had
    no choice.


    Tom wanted to study like other children, but his family was very poor. His parents
    did not have enough money for food and clothes, so Tom had to work to help them.
    Every day, he watched other children walk to school with books in their hands,
    and he wished he could join them. He dreamed of sitting in a classroom, reading
    stories, and writing with a pencil instead of carrying heavy boxes.


    One day, a man from an organization visited the factory. He told the owner that
    children should not work and should be in school. At first, the owner didn''t
    want to listen, but after some time, he agreed to stop hiring children. Tom was
    finally free, and he could go to school at last.


    Now, Tom spends lots of time studying because he wants a better future. However,
    many children around the world still work in factories, farms, or mines. Every
    child should have a chance to learn, play, and build a bright future. People must
    work together to stop child labor and give kids a better life.

     instead of 而不是  carry 運送  rough 粗糙的  choice 選擇  wished 希望  organization 組織  hiring
    雇用  labor 勞工'
