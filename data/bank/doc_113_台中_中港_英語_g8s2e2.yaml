- id: doc_113_台中_中港_英語_g8s2e2_s4_26
  section: 4
  number: 26
  type: single
  page: 2
  stem: Which city sometimes gets snow in winter?
  options:
  - label: A
    content: Tokyo.
  - label: B
    content: Taipei.
  - label: C
    content: Sydney.
  - label: D
    content: Bangkok.
  group_stem: 'Weather in Four Major Cities


    Weather changes in different cities. Tokyo, Taipei, Sydney, and Bangkok have different
    temperatures and rainfall throughout the year. Let''s look at how their weather
    is different.


    Tokyo has four seasons. Winter is cold, with temperatures around 5°C. Summer is
    hot, reaching 30°C. Tokyo has a rainy season in June and sometimes snow in winter.
    Taipei is warm and humid. Winter is around 15°C, and summer is about 30°C. It
    rains a lot, especially during typhoon season from June to September.


    Bangkok is hot all year, usually between 25°C and 35°C. It has a dry season and
    a rainy season. Most rain falls from May to October. Sydney is in the Southern
    Hemisphere, so its seasons are opposite to those in Tokyo, Taipei, and Bangkok.
    Summer is from December to February, with temperatures around 25°C. Winter is
    cool, around 10°C. Rain falls mostly in the first half of the year.


    These cities have different weather. Some have four seasons, while others are
    warm all year. If you visit, check the weather before you go!

