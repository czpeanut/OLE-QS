- id: doc_113_新北_中平_數學_g9s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '老師問：「在 $\triangle ABC$ 和 $\triangle DEF$ 中，若 $\overline{AC}:\overline{DF}=\overline{BC}:\overline{EF}=2:3$，如果要證明
    $\triangle ABC\sim \triangle DEF$ 應該要加上哪一個條件？」

    甲生:使用 SSS 相似，應加條件 $\overline{AB}:\overline{DE}=2:3$

    乙生:使用 SAS 相似，應加條件 $\angle B＝\angle E$

    丙生:使用 RHS 相似，應加條件 $\angle A＝\angle D=90^{\circ}$，

    則甲生、乙生、丙生敘述中正確的有：'
  options:
  - label: A
    content: 只有乙生
  - label: B
    content: 只有甲生、乙生
  - label: C
    content: 只有乙生、丙生
  - label: D
    content: 只有甲生
