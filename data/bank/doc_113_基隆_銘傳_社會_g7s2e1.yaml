  stem: 日本統治臺灣的期間，天皇家族訪臺巡查是場十分重要的政治活動。西元 1923 年裕仁皇太子(日後的裕仁天皇)抵臺參訪，行程由北而南，且跨海至澎湖後，再轉回臺北，於各地參訪共計
    12 天，日本稱之為「臺灣行啟」。這是百年前轟動全臺的大事。為了宣傳治臺政績，並強調將臺灣視為內地的一部分，在裕仁皇太子抵訪各處時，皆安排攝影師隨團拍攝，以影像詳細紀錄下這段過程。西元
    2023 年國家攝影文化中心首度公開典藏的百年照相簿「行啟紀念寫真帖」，以線上攝影展曝光這場百年前的政治大秀。根據上述判斷，此行程期間臺灣最可能出現的情景為何？
  options:
  - label: A
    content: 一方面尊重臺人的風俗習慣，一方面鎮壓各地的武裝抗日
  - label: B
    content: 總督府推動皇民化運動，強化臺人的愛國心
  - label: C
    content: 霧社事件爆發，日人派軍警鎮壓
  - label: D
    content: 標榜「日臺合一」。
