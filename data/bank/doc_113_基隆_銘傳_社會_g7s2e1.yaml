  group_stem: '◎ 19 世紀末期，在首都北京，一群從各地前來應考科舉的考生們聚集在浮雲客棧，討論著中國因戰敗被迫簽署的條約。當中來自臺灣的考生阿昱甚至一度因情緒激動而昏厥。清醒後在眾人的連番勸說之下，阿昱決定立即返家與家鄉眾人協議如何救國。返家後阿昱在稟明父母，與好友們一同北上參與由當時的臺灣巡撫所領導的反抗行動。無奈敵軍登陸後，他們遭到自家領袖逃回中國的打擊，加上雙方兵力武器相差懸殊，只得先回家鄉另起爐灶。

    等待 20 年後，阿昱受宗教力量的慫恿，響應在他的鄉下老家發起的反抗行動，可惜最後同伴幾乎全遭殺戮。逃過一劫的阿昱最後選擇與新婚妻子阿欣離開臺灣。

