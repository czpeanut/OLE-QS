  group_stem: '◎ 1920 年代，阿昱與其他同學回到臺北，由於受到當時國際間獨立運動的風潮，他們便轉而投入於社會運動。而當時的政府為了避免再度爆發武裝反抗事件，決定將統治政策做了調整，來安撫臺灣人。透過與當時的兩大領導人物合作，他們辦了報紙，推廣文教，也領導農工運動進行抗爭。

