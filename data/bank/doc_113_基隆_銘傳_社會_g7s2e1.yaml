  page: 5
  stem: 下列何者最有可能是上文的主題？
  options:
  - label: A
    content: 印度社會制度的普遍性。
  - label: B
    content: 英國與印度文化的差異性。
  - label: C
    content: 印度法律的發展歷程。
  - label: D
    content: 印度社會規範的演變。
  group_stem: '題組一、

    　　一般認為印度種姓制度是西元前 1500 年左右出現，雅利安人進入印度後，開始在印度實施的統治制度，原始的古印度文明的繼承者反倒成為低階的種姓，而征服者雅利安人被歸為高階種姓的人。「瓦爾那」是印度教經典中解釋種姓制度的概念，其內涵主要見於《摩奴法典》與《瞿曇法經》等早期婆羅門教的經典。經典中根據一些原則區分四種階層(如右圖)，並明確規範彼此的權利義務。根據種姓制度，一個人的社會地位由出生時所屬的種姓決定，這影響了他們一輩子在社會中的角色和地位。

    　　但是印度從脫離英國殖民後，1949 年制定《印度憲法》，其中第 15 條規定:「任何人不得因種姓、宗教、出生地而受歧視」。為了保證低種姓人和賤民的教育和求職權利，印度還實施了著名的「保留政策」，不僅在議會兩院為他們保留一定比例的席位，在所有政府機構和國營企業中也為他們保留
    27%的名額。另外，還給低種姓出生的學生一定比例的升學名額。現在，印度人的身分紀錄裡不再有任何關於種姓的記載。請問:'
