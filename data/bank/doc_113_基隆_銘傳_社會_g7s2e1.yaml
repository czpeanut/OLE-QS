    2014 年成為付費會員以後，持有多達 2259 個兒少性剝削影片，觸犯兒童及少年性剝削防制條例第 39 條第 1 項無正當理由持有兒童或少年之性影像罪，而被判處有期徒刑八個月、併科新台幣
    10 萬元。部分演藝圈人士在記者訪問時對黃子佼表示的支持，並發表期待他重回演藝圈的言論，受到各界抨擊，民眾紛紛上網撻伐，其中知名公視節目「一字千金」便在民眾的輿論壓力下宣布撤換主持人曾國城，以展示對於兒少權利保障的重視。請根據上文回答下列問題:'
