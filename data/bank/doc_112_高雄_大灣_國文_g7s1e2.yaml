  - label: C
    content: 宰予
  - label: D
    content: 閔子騫
  group_stem: "（二）  聽說學生蹺課情形嚴重，教務處要求教授認真點名，這份通知書孔子也收到了一份。 \n  孔子這幾年在一所私立學院做講師，但是講師證書（亦即教書這一行的合法營業執照）還沒有拿到手，自己既沒有學位，也沒有「論文」。當然春秋、繫辭是不算的，至於論語，他連著作權都沒有，就算有，也不是論文，不能通過「資格評審委員會」。沒奈何，只好採勤能補拙政策，希望學校看在一番苦勞的分上，准予續聘。\
    \ \n  話說孔子這天早晨奉公守法點起名來： \n  「宰予！」 \n  「他沒來。」 \n  「他幹嘛去了！」 \n  「他昨天打橋牌，打個通宵，現在才剛上牀。」\
    \ \n  「子貢！」 \n  「子貢到公館一帶擺地攤去了。」 \n  ………… \n  「顏回總在吧！」 \n  「顏回請公假去看飯燒熟了沒有，他這個月當選伙委。」\
    \ \n  「子路，子路到哪裡去了？」 \n  「子路是班代，他們今天開『大學生如何關心社會參與』的會。」 \n  「那子游﹑子夏呢？」\n  「他們到圖書館去『追尋自我』去了。」\
