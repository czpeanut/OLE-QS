- id: doc_112_高雄_大灣_國文_g7s1e2_s4_34
  section: 4
  number: 34
  type: single
  page: 6
  stem: 根據禪宗的說法，何謂「幸福」？
  options:
  - label: A
    content: 活在當下，做好本分
  - label: B
    content: 吃完飯後﹐自己洗碗
  - label: C
    content: 和最愛的人一起 touch
  - label: D
    content: 憂傷時倚靠家人的肩膀
  group_stem: "（三）禪宗裡面常常有個小沙彌，一直問師父：「什麼是佛法大義？」就像我們現在一直在問：「什麼是幸福？」老和尚回他：「你今天吃飯了沒有？吃了，就去洗碗啊。」\
    \ \n這是禪宗。其實是告訴你，把此時此刻該做的事情做好，就是幸福。點點滴滴的生活裡，最平凡的細節加起來，才是幸福。 \n現在，我們看到一點風吹草動，就覺得活不下去。\
    \ \n好多人在說歐債危機、金融風暴，竹科停車位愈來愈多，日子該怎麼辦？  \n一個特別焦慮的竹科企業老闆，要我幫他卜卦，我用錢幣丟一個爻出來，好死不死是個損卦，他臉都白了。\
    \ \n其實，《易經》沒有所謂好跟不好。因為損卦後面的卦，就是益卦。損卦裡說「損其疾，使遄1有喜，無咎2」，意思是你可以趁這個機會，把個人和企業的弊病減損掉。\
    \ \n所以，損不是說損失，而是減損。卜到損卦時，誠信很重要。裁員也好、減薪也好，要讓人信服，就能度過。 \n幸福不是分數或排名的問題，而是怎麼回到「敬」這個字，讓我們尊重所有的物跟人。\
    \ \n人類數千年文明中，從沒有像現在這樣濫用物質。 \n我看到上一代對物質都很珍惜。我們家六個小孩，衣服都是媽媽親手做的。衣服大哥穿過換我穿，再換弟弟穿，破了就做抹布。釦子都會剪下來，我媽媽就放在一個瓶子裡面，因為她認為什麼東西都不能丟掉。我覺得這裡面真的有幸福感。\
    \ \n現在，很多小孩子玩touch（觸控）手機，幸福不是只有在touch 機器。你要知道你最愛的人，跟他touch也很幸福。但現在人跟人之間很害怕touch，不太敢用觸感。\
    \ \n生命裡忘不掉、捨不得，都是幸福的開始，不是一直要有新的東西，然後把舊的丟掉，這樣不會有記憶。幸福，就是從這些事情慢慢建立的。 \n在這世上，如果有一個人是你關心的，那你就為他做一點事，給他一點溫暖。當他憂傷時，讓他靠著你的肩膀，這絕對是最重要的幸福感來源。\
    \ \n（節選自《天下雜誌‧人物專訪‧蔣勳：忘不掉、捨不得，是幸福的開始》） \n註1：遄，音ㄔㄨㄢˊ，疾速。      註2：咎，音ㄐㄧㄡˋ，災禍。"
