- id: doc_113_新北_蘆洲_自然_g8s2e3_s1_23
  section: 1
  number: 23
  type: single
  page: 3
  stem: '下列為網路上大家關心的一則問與答：

    問：外帶咖啡的塑膠杯蓋會釋出致癌物質，是真的嗎？

    答：過去咖啡杯蓋的材質多為聚苯乙烯（簡稱PS），由苯乙烯（$C_{8}H_{8}$）聚合而成，相關單位已對此材質訂出使用規範，以確保安全。為免疑慮，市面咖啡杯蓋材質已逐漸改成聚丙烯（簡稱PP），聚丙烯是由丙烯（$C_{3}H_{6}$）聚合而成。PS
    和PP 都屬於熱塑性聚合物，只要符合規定，消費者正常使用下，尚無安全疑慮。

    關於PS 或PP 的敘述，下列何者正確？'
  options:
  - label: A
    content: PS 和PP 都屬於網狀聚合物
  - label: B
    content: PP 是由碳水化合物聚合而成
  - label: C
    content: PP 是由十多個丙烯分子所組成
  - label: D
    content: PS 是由數千個以上的原子所組成。
