- id: doc_113_新北_蘆洲_自然_g8s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 有兩艘外觀、構造完全相同的船停泊在海面上。甲船是空船，吃水較淺；乙船則載滿乘客，吃水較深，如附圖所示，有關甲、乙兩船所受的力，下列敘述何者正確？
  options:
  - label: A
    content: 由甲船吃水較淺可知，甲船受到的浮力較乙船大
  - label: B
    content: 由乙船吃水較深可知，乙船受到的浮力小於船與乘客的總重量
  - label: C
    content: 甲、乙兩船在水中秤得的重量皆等於零
  - label: D
    content: 甲、乙兩船皆為浮體，因此所受到的浮力相等。
