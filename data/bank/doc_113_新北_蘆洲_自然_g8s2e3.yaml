- id: doc_113_新北_蘆洲_自然_g8s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 蟑螂主要是靠體節上的小孔呼吸，而且他們的體表覆有一層蠟與油脂，因此蟑螂即使掉入水中，仍得以逃生；然而蟑螂若掉入含清潔劑的水溶液中，則會在短時間內死亡。請依據上述內容推測下列何者為蟑螂最合理的致死原因？
  options:
  - label: A
    content: 清潔劑具腐蝕性，溶解蟑螂
  - label: B
    content: 清潔劑溶解蠟與油脂，造成呼吸孔進水，窒息而死
  - label: C
    content: 清潔劑具有毒性，毒死蟑螂
  - label: D
    content: 蟑螂的密度比清潔劑大，所以沉入水中，窒息而死。
- id: doc_113_新北_蘆洲_自然_g8s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 關於熱塑性聚合物與熱固性聚合物的敘述，下列何者正確？
  options:
  - label: A
    content: 電路板需耐高溫，故常用熱塑性聚合物作為材料
  - label: B
    content: 寶特瓶是熱塑性聚合物
  - label: C
    content: 熱固性聚合物受熱會軟化
  - label: D
    content: 熱固性聚合物又稱為鏈狀聚合物。
- id: doc_113_新北_蘆洲_自然_g8s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '日常生活中常見的飲料瓶常是由塑膠製成，已知回收標誌中1∼6 類的塑膠加熱後皆容易軟化變形，請問這些塑膠屬於甲∼戊中的哪幾個類別？

    甲.有機聚合物；乙.天然聚合物；丙.合成聚合物；丁.鏈狀聚合物；戊.網狀聚合物'
  options:
  - label: A
    content: 甲乙戊
  - label: B
    content: 丙丁戊
  - label: C
    content: 乙丙丁
  - label: D
    content: 甲丙丁。
