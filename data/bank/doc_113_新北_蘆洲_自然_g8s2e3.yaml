- id: doc_113_新北_蘆洲_自然_g8s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 蘋果等水果中所含有的蘋果酸成分，化學式為$C_{4}H_{6}O_{5}$，分子中含有兩個—COOH原子團，是蘋果的酸味來源，常作為食品添加劑。關於蘋果酸的說明，下列何者正確？
  options:
  - label: A
    content: 屬於有機化合物，也是電解質
  - label: B
    content: 屬於有機化合物，也是非電解質
  - label: C
    content: 屬於無機化合物，也是電解質
  - label: D
    content: 屬於無機化合物，也是非電解質。
- id: doc_113_新北_蘆洲_自然_g8s2e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 市面上販售的萘丸，其主要成分為「萘」，可用來驅蟲。已知萘是一種有機烴類化合物，下列何者所含有的原子種類與萘完全相同？
  options:
  - label: A
    content: $CO_{2}$
  - label: B
    content: $CaCO_{3}$
  - label: C
    content: $CH_{4}$
  - label: D
    content: $CH_{3}COOC_{2}H_{5}$。
- id: doc_113_新北_蘆洲_自然_g8s2e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 木糖醇是一種可以代替蔗糖的食品添加物。若要知道木糖醇是否和乙醇一樣都是醇類，應查詢木糖醇的何項資訊？
  options:
  - label: A
    content: 分子量
  - label: B
    content: 組成的原子總數是否超過1000 個
  - label: C
    content: 組成的原子種類與排列方式
  - label: D
    content: 氫和氧的原子數目比是否為1：1。
