  section: 1
  number: 9
  type: single
  page: 1
  stem: '仁哥看到一則資料如下：

    大英博物館裡有一道特別的「聖旨」，是由中國的乾隆皇帝寫給當時的英王喬治三世（George III），聖旨內容約莫如下：「我們是天朝上國應有盡有，無須與你們通商。假若你們喜歡絲綢、瓷器等來自我國的商品，我每年都可以賞賜你們一點，你們在蠻荒之地，不用年年進貢，只要心裡向著大清即可。」

    請問：關於仁哥看到的資料，下列解讀何者正確？'
  options:
  - label: A
    content: 清朝願與英國平等往來
  - label: B
    content: 英國當時為清帝國藩屬
  - label: C
    content: 清帝國需要與英國通商
  - label: D
    content: 清朝天朝上國觀念濃厚
