  section: 5
  number: 24
  type: single
  page: 4
  stem: 文章中提到的嘉義火雞肉飯特色，下列何者為非？
  options:
  - label: A
    content: 火雞肉飯店家幾步一家，簡直比手搖飲料店還要密集
  - label: B
    content: 當地人對火雞肉飯傾注關愛，且共同推舉出代表店家
  - label: C
    content: 火雞肉是由外國引進的食材，火雞肉飯發展迄今未滿百年
  - label: D
    content: 火雞肉採燜浸法製作，再依各店家配方加上豬油、雞油、油蔥、淋汁等佐料。
  group_stem: "嘉義火雞肉飯雖聞名遐邇，其實發展時間不過短短數十年，據說是二戰後由駐守當地的美軍引進此食材，就此開啟此道常民小食的光輝盛世。\n 頂尖火雞肉飯的講究，在於藉由燜浸方式使肉質滑潤多汁、不柴不澀；且同時使用雞油與豬油，才能肥腴清香兼具。至於火雞肉之粗細厚薄、油蔥放或不放，以至淋汁的配方等等，就各有追求、各見所長了。\n\
    \ 而這不做他想穩居第一的嘉義代表美食的威力，早從行前和在地識食懂吃朋友請益之際，就已開始感受到：「火雞肉飯是嗎？你有多少時間？想在哪些時段、哪個區域吃？想吃幾家？」\n\
    \ 招架不住這連珠炮詢問的我登時傻眼：「欸，不能就直接告訴我，你覺得最厲害是誰，我直接專程去就好嗎？」\n 友：「不行不行，好的實在太多，各有特色，通通不一樣，怎麼可能隨便扔一家！我想，你停留時間也不長、也不是光只吃這一味，這樣吧，等你其他想吃該吃的小吃通通嚐過後，我再帶你去一家。吃飽後再吃，你才會知道火雞肉飯有多好吃！」他加重語氣如是說。\n\
    \ 好大的口氣！半信半疑心情下，乖乖遵從叮囑，一輪大飽後，捧著滿脹的肚子隨他來到據說是從小吃到大的店家，飯上桌當口，原本還覺這下應該只能淺嚐、不可能吃完吧？結果碗才端起，一個回神已經唏哩呼嚕三兩下扒光光。\n\
    \ 當下折服，開始有點兒懂得朋友的話。\n 回程路上，我開始回想，從現在到過往曾在嘉義吃過的火雞肉飯，次數雖不多，但確實是碗碗精采，肉質柔嫩細滑，肉汁肉脂鮮醇甘芳，豐澤飽滿卻一點不濃膩，襯得潤得底下的白飯益發噴香；而且是的，每一家每一碗都各見丰姿、通通不一樣。\n\
    \ 不過就是簡至極致、單單就是火雞和米飯的組合，卻能展現出這樣的高度與風華。此中答案無他──人在嘉義，火雞肉飯店家之多委實令人咋舌：幾乎是每走幾步、舉頭便可見一家，簡直比手搖飲料店還密集；且當地人人都有一本經，各有所擁所愛，不知該聽誰信誰才好。\n\
    \ 是與在地歷史、風土、食材、生活方式關連緊密，最重要是，傾全城之關注熱愛、日日飲食裡長年涵泳淬鍊成就的美味，這能量，於是非凡強大。\n 非靠短期炒作，也用不著任何美食節或比賽的煙火式推廣行銷；只要人們依然日常裡生活裡如是真心喜愛依賴──當然，歷史與特色類型脈絡之耙梳整理、記錄傳述更不可少，相信現在未來，定然還是會如是繼續發熱發光。\
    \ （節選改寫自葉怡蘭滿城盡是火雞肉飯）"
