  group_stem: '【甲】

    王戎有好李，賣之，恐人得其種，恆鑽其核。

    王戎女適裴頠，貸錢數萬。女歸，戎色不說。女遽還錢，乃釋然。 （皆世說新語）


    注釋 恆：經常。 適：女子出嫁。 遽：就，於是。

    【乙】

    王戎幼時很聰明，喜愛深思。一次，他和鄰居的一群小孩跑到村外去玩。沿著大路走著時，忽然看見路旁有一棵李子樹，樹上結實纍纍，果實把樹枝都壓彎了。小孩們見狀一聲歡呼，爭先恐後地爬上樹摘李子，唯獨王戎一個人站在路邊不動。小孩們喊他：「你怎麼不來採呢？」王戎說：「這棵樹就長在人來人往的大道旁，卻掛滿成熟果實，一定是苦的。」小孩們嚐了幾口，李子果然又酸又苦。'
