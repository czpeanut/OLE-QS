- id: doc_112_台北_北興_國文_g8s1e1_s3_1
  section: 3
  number: 1
  type: essay
  page: 1
  stem: '新臺幣由中央銀行發行，紙鈔正面為臺灣人文活動圖案，背面圖案則以自然景觀與動植物為主。

    現行新臺幣背面出現的主要動物圖案及介紹如下表。

    請問：根據表中的動物介紹，三種動物對應新臺幣紙鈔金額，最有可能是根據什麼條件決定？

    為什麼你如此推論？


    | 伍佰圓紙鈔 | 壹仟圓紙鈔 | 貳仟圓紙鈔 |

    | --- | --- | --- |

    | 梅花鹿 | 帝雉 | 櫻花鉤吻鮭 |

    | 過去曾分佈於臺灣海拔500 公尺以下、低海拔的草生地及森林交界處，但因棲地受到破壞，現經由復育，主要棲息在海拔200 公尺以下的平原地區。 | 主要棲息於中、高海拔的山區，東部地區在海拔
    1000 公尺左右，而西部地區則必須到海拔 1800 公尺以上的山區才有。 | 經由復育棲息於雪霸國家公園的高山溪流中。生存條件必須在海拔2000 公尺處，水溫最高溫不超過17
    度，冬天必須在10度左右的低溫，且溪水未受汙染、水源充足，才符合臺灣櫻花鉤吻鮭的生存條件。 |


    （表格圖案及簡介資料來源：中央銀行官網、Home Run Taiwan 粉絲團）'
