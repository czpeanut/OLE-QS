  stem: '請先閱讀以下資訊，並按題意引導完成一篇文章。


    國中公民課本定義：「外部成本指一個人行為的結果，不僅對自己、也對他人造成壞的影響。例：汙染、菸害、工廠廢水、大聲喧鬧、攤販製造髒亂。」

    換句話說，當一個人做了某件事，造成別人感覺困擾、不便，甚至遭受更嚴重的損害，就是所謂的「外部成本」。

    比如麵包店顧客盈門，導致周遭道路違停嚴重；在公共場合抽菸的癮君子，罔顧別人的健康；住家在門前道路擺放盆栽等物品，佔據了行車空間；鄰居播放影片或音樂聲量過大，影響其他住戶寧靜；或者你的同學在上課時喧嘩吵鬧，導致你無法好好聽課等等，都是外部成本的一種。


    你在生活中是否也曾發現「外部成本」的現象？其中令你最印象深刻的例子是什麼？請寫下你的觀察和想法，並盡可能提出改善的建議。


