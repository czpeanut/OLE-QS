    content: 英法戰爭
  group_stem: "題組(二)，請回答24、25題\n      2005 年開始由基隆地方自發性發起的活動，在每年農曆七月四日的鷄籠中元祭裡，市定古蹟法國公墓會舉辦一場為了普渡「外國人」的祭祀法會，內容物有法國麵包、巧克力、法國葡萄酒和影印自歐元鈔票的外國紙錢，並邀請法國在台協會人員共同參加普渡。今年是該戰爭140\
    \ 周年紀念，這場中元普渡儀式不僅僅是一個祭祀活動，更是一個促進文化交流的平臺，透過這樣的活動，基隆市向世界展示了它的文化多樣性和包容性，同時也讓更多人瞭解到這段被遺忘的歷史。"
