- id: doc_113_屏東_中正_社會_歷史_g7s1e2_s1_21
  section: 1
  number: 21
  type: single
  page: 4
  stem: 請問羅大春應該是誰的部下，負責開發北路 ?
  options:
  - label: A
    content: 沈葆楨
  - label: B
    content: 丁日昌
  - label: C
    content: 劉銘傳
  - label: D
    content: 邵友濂
  group_stem: "題組(一)，請回答21-23題\n    宜蘭蘇澳到花蓮的蘇花古道，開通於同治13年，原稱北路，與中路八通關古道、南路崑崙坳古道，同為清代開山撫番政策下主要完成的道路。北路主要由羅大春負責。羅大春在自己寫下的《臺灣海防並開山日記》中訴說生番的困擾，「前途斗史社番凶悍殊異」、「突有凶番數十出擾」、「蘆葦中突出生番狙擊」。除此，地形艱困，羅大春決定「大南澳山腰再闢一路，旁通新城，一以避海濱懸崖之險，一以塞凶番歧出之途」。羅大春文中已預言道路毀損的必然性，「蓋山麓俱墾泥為級，闡以橫木，左右各釘木樁，非如石確堅固。且須盤旋曲折，否則人馬俱難陡上。而砂土性鬆，一遇大雨，山溜直下，泥級即有崩塌之虞」。"
