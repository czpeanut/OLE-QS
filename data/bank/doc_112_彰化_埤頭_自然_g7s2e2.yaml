  group_stem: 偏側蛇蟲草菌又被稱為「喪屍真菌」，此菌感染如弓背蟻等特定種類的螞蟻，利用螞蟻作為營養的來源，菌絲漸漸在螞蟻體內形成，然後圍繞在肌肉細胞周圍，影響螞蟻的行為，被感染的螞蟻就像殭屍身不由己，離開蟻巢並走到適合菌生長環境。螞蟻緊緊得咬住樹葉或枝條而後死亡，是被感染的特徵，而蟻屍的外殼將會保護偏側蛇蟲草菌的生長，之後從蟻屍的某些部位長出菌柄，如附圖所示，待成熟後即釋放孢子，繼續感染附近的螞蟻。請回答下列問題：
