  stem: '小漩與小萱在野外採集時找到一隻緊咬住枝條而死的螞蟻，帶回學校後，找老師、翻圖鑑，確定螞蟻屬於弓背蟻，但體表沒發現菌絲的構造。小漩與小萱對於此螞蟻是否被偏側蛇蟲草菌感染，分別提出了自己的觀點。

    小萱：「如果螞蟻體內有菌絲的構造，則螞蟻被感染。」

    小漩：「如果螞蟻體內具有細胞壁構造，則螞蟻才有被感染。」你認為小漩與小萱兩人的推論，何者較合理？'
