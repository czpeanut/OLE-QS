  group_stem: '柚子進行完「蕨類植物的觀察」活動，將觀察紀錄和收集到的資料做成一份報告，請依此報告回答下列問題：


    一、蕨類的外形與構造


    二、蕨類植物簡介

    蕨類植物是植物中比較原始的類群，也稱為羊齒植物。蕨類植物，沒有花、果實和種子，以孢子繁殖，成熟的葉多呈羽狀複葉。古代蕨類植物中的鱗木、蘆木都很高大，死亡後埋在地層中有機會形成煤炭，而現存的蕨類植物，只有筆筒樹、桫欏等少數蕨類擁有直立且高大的莖，其餘幾乎都缺乏此特徵。

    蕨類植物的用途很廣，很多種類可供食用，如鳥巢蕨（又稱山蘇花）的嫩芽可作蔬菜，觀音座蓮重達20～30公斤的地下根莖也可供食用，滿江紅、槐葉萍等則為飼料及肥料。而在陽明山夢幻湖的特有種台灣水韭，外形雖像單子葉植物，卻屬於水生蕨類植物'
