- id: doc_113_台南_民德_國文_g7s1e2_s4_5
  section: 4
  number: 5
  type: single
  page: 5
  stem: 同樣問孝，孔子總有不同的回答，是因為孔子重視什麼？
  options:
  - label: A
    content: 有教無類
  - label: B
    content: 貴賤有別
  - label: C
    content: 因材施教
  - label: D
    content: 誨人不倦
  group_stem: '(一)子夏問孝。子曰：「色難①。有事，弟子服其勞；有酒食，先生饌②。曾是以為孝乎？」

    (二)子曰：「父母之年，不可不知也。一則以喜，一則以懼。」

    (三)子曰：「父母在，不遠遊；遊必有方。」

    （論語）

    注：①色難：孝順父母，最難得的是臉色和悅。

    ②饌：享用。'
