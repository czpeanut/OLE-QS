- id: doc_113_台南_民德_國文_g7s1e2_s4_8
  section: 4
  number: 8
  type: single
  page: 5
  stem: 餐廳主人最初設立愛心冰箱的動機，為下列何者？
  options:
  - label: A
    content: 以剩食幫助他人
  - label: B
    content: 解決社會問題
  - label: C
    content: 為自己的餐廳製造話題
  - label: D
    content: 引導左鄰右舍行善
  group_stem: '有一天，印度 科欽市的居民驚奇的發現，他們的街頭出現了一臺裝滿食物的冰箱，而且沒有上鎖。這並不是惡作劇或是人性考驗的花招，而是一個女人充滿愛心的善舉。她是一家餐廳的主人，某天晚上，她發現一位無家可歸的女人正在垃圾桶裡翻找食物。這一幕深深觸動了她：大家都在睡覺的時候，這個女人卻被飢餓喚醒，不得不去骯髒的地方尋找食物。

    餐廳主人陷入了沉思，決定做點什麼。她想到自己的餐廳中，每天都有大量的剩菜丟掉，如果把這些剩菜給予那些需要的人，豈不是一舉兩得？於是她每天把剩下的飯菜裝進冰箱，再將冰箱放在餐廳門口的大樹旁。餐廳主人還為自己的愛心冰箱取了一個名字「nanma
    maram」，也就是「善意之樹」的意思。冰箱全天候二十四小時開放，任何需要食物的人都可以隨時來這裡拿取，不會有人找你麻煩。

    當地居民受到餐廳主人的影響，也開始往冰箱裡放置食物。但她會要求他們在包裝上寫上食物放入的日期，這樣人們在取食的時候，就可以知道這些食物放了多久。事實上，這些食物在冰箱裡並不會待太久，因為每天都有許多需要它們的人前來取食。後來，有人甚至會特意花錢買食物放進冰箱，非常的慷慨。不過餐廳主人表示，並不鼓勵大家這樣做，她希望人們是將自己吃不完的食物拿來放。避免浪費，才是她致力於做這件事的初初心。

    就這樣，這些本該被丟棄的食物，被賦予了另一個使命──帶著關懷，溫暖了處於困境中的人。之後在世界各地陸續出現類似的愛心冰箱，像西班牙、中國、德國、臺灣，也都出現所謂的分享冰箱、共享冰箱、社區冰箱、溫暖冰箱等，這種惜食分享的作法，象徵著人間處處充滿了愛心與溫情。

    （改寫自新聞報導）'
