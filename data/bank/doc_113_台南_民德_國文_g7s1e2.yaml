- id: doc_113_台南_民德_國文_g7s1e2_s4_3
  section: 4
  number: 3
  type: single
  page: 4
  stem: 由文中可判斷顏回是個怎樣的人？
  options:
  - label: A
    content: 熱情豪爽
  - label: B
    content: 誨人不倦
  - label: C
    content: 好學不倦
  - label: D
    content: 待人謙和
  group_stem: '顏淵、季路侍①。

    子曰：「盍各言爾志②？」

    子路曰：「願車、馬、衣、裘③，與朋友共④，敝之而無憾⑤。」

    顏淵曰：「願無伐善，無施勞⑥。」

    子路曰：「願聞子之志。」

    子曰：「老者安之，朋友信之，少者懷之⑦。」

    （論語 公冶長篇）

    注：①盍，何不。爾，你。 ②裘：皮衣。

    ③共：分享、合用。 ④敝之而無憾：就算破舊、損壞了，也不覺得遺憾。

    ⑤無伐善無施勞：不誇耀自己的才能或優點，不張揚自己的功勞。

    ⑥「老者安之」三句：老人能得到奉養並享受安樂，朋友能以誠信交往，少年人能得到關懷愛護。'
  lesson_raw:
    title: 論語選
    basis: 選自《論語》篇章
