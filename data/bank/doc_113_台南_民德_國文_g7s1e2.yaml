  type: single
  page: 3
  stem: 「心理學『遺忘曲線』的實驗結果發現，在學習後兩天，記憶喪失比率為66%，學習的內容倏忽即逝。實驗同時也發現，不論如何沒有脈絡可循的文字，只要重複的次數愈多，記憶喪失比率就愈低，由66%大幅降至10%，且愈能進入長期記憶。」根據上文，下列敘述何者正確？
  options:
  - label: A
    content: 參加遺忘曲線實驗，能降低記憶喪失比率
  - label: B
    content: 愈沒有脈絡可循的文字，記憶喪失比率就愈高
  - label: C
    content: 學習內容進入長期記憶後，記憶喪失率為10%
  - label: D
    content: 只要重複的次數愈多，愈能有效讓學習內容進入長期記憶
  tags:
