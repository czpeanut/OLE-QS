  page: 1
  stem: '以下是甲、乙兩人證明$\sqrt{3}＋\sqrt{5}＞\sqrt{8}$ 的過程：

    (甲)因為$(\sqrt{3}＋\sqrt{5})^{2}＝(\sqrt{3})^{2}＋2\times \sqrt{3} \times \sqrt{5}
    ＋(\sqrt{5})^{2}＝3＋2\sqrt{15} ＋5＝8＋2\sqrt{15}$

    $(\sqrt{8})^{2}＝8＜8＋2\sqrt{15} ＝(\sqrt{3}＋\sqrt{5})^{2}$

    所以$\sqrt{3}＋\sqrt{5}＞\sqrt{8}$

    (乙)因為$\sqrt{3}＞\sqrt{1}＝1$，$\sqrt{5}＞\sqrt{4}＝2$ 所以$\sqrt{3}＋\sqrt{5}＞1＋2＝3$

    且$\sqrt{8}＜\sqrt{9}＝3$ 所以$\sqrt{3}＋\sqrt{5}＞3＞\sqrt{8}$

    對於兩人的證法，何者是正確的？'
