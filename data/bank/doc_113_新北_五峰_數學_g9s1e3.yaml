    乙：作$\angle B$ 的角平分線交$\overline{AC}$ 於$E$，過$E$ 點作$\overline{DE}$ // $\overline{BC}$
    交$\overline{AB}$ 於$D$，即為所求，如圖(三)

    就上述甲、乙的作法，下列敘述何者正確？'
