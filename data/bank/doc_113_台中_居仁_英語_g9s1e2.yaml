- id: doc_113_台中_居仁_英語_g9s1e2_s6_1
  section: 6
  number: 1
  type: single
  page: 4
  stem: (  ) 1.According to the passage, what is Imperfect Foods’ goal?
  options:
  - label: A
    content: To encourage people to eat food that is healthier.
  - label: B
    content: To lower the amount of food that goes to waste.
  - label: C
    content: To grow food that is delicious to consumers.
  - label: D
    content: To improve the appearance of food that is sold.
  group_stem: 'A.

    People around the world are coming together to fight climate change. In this difficult
    battle, everyone is searching for ways they can do more to make a difference.
    Imperfect Foods is a company that aims to get people to reduce their food waste.
    That’s because few people are aware that food waste is one of the biggest contributors
    to greenhouse gases and climate change.


    The company delivers fruits and vegetables that would have been thrown away to
    its customers’ homes. The crazy thing is that this food is all safe and healthy
    to eat. However, for years it was rejected because it was ugly.

    The owners of Imperfect Foods came up with this idea after studying the food market
    in the US and Canada. They learned that millions of tons of food were tossed out
    by farmers because the food was labeled as imperfect due to its appearance. This
    included fruits and vegetables that were considered too large, too small, or strangely
    shaped. In fact, about 30% of all food grown in the US gets thrown out every year.
    The wasted food sits in landfills and releases carbon dioxide and methane as it
    begins to rot. This company not only hopes to reduce the growth of climate change
    but also provides an excellent service where no food goes to waste.'
