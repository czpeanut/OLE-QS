  group_stem: 'B.

    During the COVID-19 pandemic, wearing a mask became the new normal for many people.
    Wearing masks can help prevent people from getting or spreading viruses. One mask,
    though, was designed to make communication easier while also serving the purpose
    of social distancing.

    Called the C-Face and made in Japan, it was the first “smart mask.” Since it offered
    no protection against viruses, it was meant to be worn over a standard mask. With
    a chip built into the mask, it could connect to smartphones up to 10 meters away
    via Bluetooth. The mask could record conversations and then turn them into text.
    It could also translate speech into eight different languages. Most importantly,
    it could make the voice of the person wearing it louder, which enabled people
    to clearly understand the wearer’s speech when practicing social distancing.

    In fact, the company had planned to develop a robot, but the project was put on
    hold due to the pandemic. To help the company survive, the engineers came up with
    the idea of the smart mask. Their funding for the product went through the roof.
    In the future, more products can be expected to not only meet modern challenges
    but also make our lives easier.'
