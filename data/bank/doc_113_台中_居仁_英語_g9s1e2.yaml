  group_stem: "Since the Covid-19 pandemic started, people ___①___(begin)“social distancing”—keeping\
    \ a safe space between you and anyone you don’t live with. Though it has been\
    \ a very popular topic this year, social distancing__②____. In fact, it __③____(use)\
    \ in the U.S. in the flu pandemic in 1918. But how well did it work? The Americans’\
    \ experience can tell us whether it really saved lives.\nNew York started social\
    \ distancing earlier than the other three cities. This helped the city keep the\
    \ number of deaths down. Besides taking early action, keeping the action long\
    \ enough was also important in fighting the pandemic. Portland and Denver did\
    \ well in the first few weeks. However, both cities stopped social distancing\
    \ too soon, and the numbers of deaths climbed again.\nPortland also used several\
    \ ways of social distancing at the same time to deal with the pandemic. __④___,\
    \ sick people were kept away from healthy ones; schools were closed; public activities\
    \ were not allowed. All these were useful in keeping people safe.\nThe lessons\
    \ of the 1918 pandemic bring us hope. While we __⑤____(learn) to fight Covid-19,\
    \ social distancing may be the best way to get us through the dark days, at least\
    \ for now.\n                 (113.會考改寫)"
