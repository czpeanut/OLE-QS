  group_stem: 宋詞發展到蘇軾時代，變革歌詞創作，「以詩為詞」。蘇軾擴大了反映生活的領域，做到「無意不可入，無事不可言也。」在蘇軾現存三百餘首詞裡，諸如詠史、遊仙、悼亡、惜別、登臨、宴饗等題材，無所不包。此外，山川風光，田園風光，參禪悟道，哲理探討等，也都一一納入筆下。經過蘇軾的創作，人們才真正看到詞可以反映廣闊的生活內容。蘇軾的做法，在北宋響應者寥寥。金兵入侵，北宋覆亡。南宋小朝廷，始終籠罩在外族入侵的陰影之下。南宋所有的文學體裁，無不受這歷史巨變的影響。概覽南宋詞壇，詞亦不得不走出哀怨之途，把目光投向更廣闊的社會現實。蘇軾豪放詞，在此時於是發揮了廣泛的影響。南宋詞創作的新傾向，逐漸彙集成巨大的創作流派，這就是以辛棄疾為代表的愛國詞派。辛棄疾詞數量眾多，涉及面廣泛。辛棄疾一生都是矢志不移的抗金戰士，北伐大業始終是他關注的焦點，因此，辛棄疾創作了大量的愛國詞。（諸葛憶兵
    宋史可以這樣讀）
