  stem: 作者認為宋詞發展到蘇軾時代有了改變，下列何者正確？
  options:
  - label: A
    content: 以詞為詩，變革歌詞創作
  - label: B
    content: 縮小聚焦於反映生活的領域
  - label: C
    content: 題材廣泛多元，無所不包
  - label: D
