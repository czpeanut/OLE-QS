- id: doc_112_彰化_埤頭_國文_g9s1e1_s3_43
  section: 3
  number: 43
  type: single
  page: 3
  stem: 根據本文，下列說明何者正確？
  options:
  - label: A
    content: 視覺學習者擅長處理大量知識
  - label: B
    content: 聽覺學習者重複背誦預防衰老
  - label: C
    content: 動覺學習者只願意進行勞力活
  - label: D
    content: 綜合學習是每個人應努力的方向
  group_stem: '學習風格有哪些類型？

    1. 視覺

    視覺學習者喜歡看到畫在黑板上的、各種紙本的資訊，因此對地圖、圖表等視覺化資料特別敏感。他們在理解新事物時，喜歡塗塗寫寫，將資訊視覺化，如做樹狀圖或是心智圖等。視覺化的資料能幫助他們組織腦中的概念和想法，知識也會記得更清楚、更長久。

    2. 聽覺

    聽覺型學習者喜歡口頭的指示，他們在理解的過程中，習慣問問題，詢問到底要理解為止，並會使用重複背誦或大聲朗誦的方式來記憶。因為對聽覺敏感，他們可以輕易地回憶起別人說的話，並喜歡與他人談論複雜的話題。聽覺型學習者可以通過聲音來回憶聲音代表的意思，並且因為喜歡問問題、討論，很適合時常需要團體開會激發創意、需要傾聽問答等社交技能。

    3. 動覺

    動覺學習者喜歡通過「體驗」來處理訊息，因此喜歡親自動手做東西。當他們在閱讀時，也習慣透過身體，比方說站起來四處走動、透過表演、展示，來滾動記住訊息。動覺學習者喜歡觸摸和感覺物品，特別適合「勞力活」，尤其是那些能讓他們動手作的工作。

    每個人學習和保留新訊息的方式不同。花點時間想想最後一次學到新東西的時候，你更喜歡如何接受新訊息，並且如何記得更長久？學習方式並不會限制你，但將適合自己的學習風格融入，將會事半功倍。

    （經理人）'
