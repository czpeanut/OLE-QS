- id: doc_112_彰化_埤頭_國文_g9s1e1_s3_45
  section: 3
  number: 45
  type: single
  page: 3
  stem: 根據本文，身為父親的作者，認為現在在長的反教養難題為何？
  options:
  - label: A
    content: 孩子能接收到的訊息量不足
  - label: B
    content: 如何選擇時事作為與孩子討論的素材
  - label: C
    content: 協助孩子從眾多資料中提取有用的訊息
  - label: D
    content: 老師要求孩子回家和家長討論社會話題
  group_stem: '女兒上高中後，學校某些科目的老師會在課堂上提及一些新聞議題，有時候甚至要她們以雜誌的封面故事來做專題報告。於是她們逐漸關注起目前的社會話題，通常也會詢問一下我的看法。也就是在跟她們討論的過程中，發現她們理解與解讀新聞的能力很弱；同時也發現，老師雖然以這些時事為素材，但也沒有好好分析，不知道是時間不夠，還是本身缺乏相關的背景知識。

    常常很感慨，現代人從早上起床到晚上睡覺為止，醒著的時間幾乎無時無刻不被無所不在的資訊包圍，從原先的電視、廣播，到如今的電腦網路、智慧型手機，現在家長的反教養難題已不是害怕孩子訊息不足，反而是如何協助他們培養不被媒體左右的判斷力，並且在紛亂的資料當中，獲得真正有用的訊息。

    這是個複雜的世界，幾乎所有的事情都沒有簡單或終極的解答，偏偏現代從網路到傳統媒體的報導，都朝向「輕薄短小」，不可避免的碎片化且零碎化。現代人已經沒有時間也沒有能力，去了讀事情為什麼會這樣？前因後果是如何？對我們會有那些影響？

    於是從兩年前的春天開始，每個星期假日，我會利用早、午或晚餐的時間，正式為她們上課，進行我們家的「媒體識讀」教育。通常以雜誌的專題或專題報導，報紙的社論或專論等影印為教材，各持一兩篇相關文章為一個主題，至少講解討論一個小時左右。總之，我希望她們能把問題看得深一點，也希望從這些攸關每個人生活的事作裡，引起她們追求知識的動機。經過這樣的訓練後，後來在女兒上下學間隙翻閱每天報紙的短短時間裡，也會交換一下意見。

    任何一個會引起社會普遍關注的新聞，一定會帶著社會當下集體的意識，或許是憂慮，或許是恐懼，都很值得父母帶著孩子進一步探索。（李偉文 為孩子的「媒體識讀素養」扎根）'
