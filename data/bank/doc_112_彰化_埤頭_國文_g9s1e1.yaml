    content: 孔融讓梨
  - label: D
    content: 精衛填海
  group_stem: '我們都只有一生，選了這個，很可能就永遠失去了那個。如同我的學生所說，他假使選擇美術系，今天可能不是成功的大老闆，而是偉大的畫家。

    所以，你永遠在選了梨之後，都可以猜如果挑蘋果，會更好。也可以在大家都讚美蘋果的時候，毫無遺憾地說：「我仍然相信我的選擇最正確。」

    只是，當那些已經嚐過各種水果，有許多人生閱歷，又深愛你的人，對你說：「挑蘋果吧！不會錯的。」

    你是不是該聽他的？還是堅持自己、始終無悔？

    （劉墉 你是否能成為另一個比爾蓋茲）'
