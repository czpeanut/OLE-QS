  section: 1
  number: 36
  type: single
  page: 4
  stem: '有關下文中三倍券使用者經驗分享的部分，下列何項推論較為正確？


    2020 年，政府因應新型冠狀病毒，推出振興經濟的「振興三倍券」（下列簡稱為：三倍券），可以紙本或數位方式領取至12 月31 日截止使用。以下有二則使用者經驗分享：

    | 現金加油找錢竟給券 | 拿了現金去加汽油，沒想到工讀生找給他的是鈔票和一張200 元的三倍券，讓他收到後很傻眼。 |

    | 券不能找錢不得結帳 | 拿了一張面額200 元的三倍券要結帳時，店員告知根據政府要求是不能找零，該名消費者表示只需要找一元，乾脆不用找，但店員則堅持還有一元不能找，會出現對帳的問題。最終該名消費者改現金付款。
    |


    經濟部表示三倍券目的是要刺激消費，希望民眾購物能超過三倍券上的面額，而且有不能繳水電費、健保費、繳稅、找零錢等多種限制，只不過並沒有明確寫商家是否能將三倍券當零錢找給客人。另外，內政部提醒，由於三倍券是「有價證券」，如同餐廳的禮券，若有造假情況，可依刑法的偽造有價證券罪嫌移送法辦。（資料來源：改寫自新聞傳播處，「振興三倍券」壹仟變參仟蘇揆：「三好一溫暖經濟加速轉」，行政院網站，2020/06/02。）'
