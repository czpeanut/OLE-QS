- id: doc_113_台北_仁愛_國文_g8s2e2_s4_5
  section: 4
  number: 5
  type: single
  page: 1
  stem: 將某一種感官的感受，透過聯想，以另一種感官印象來表達，就是感覺移轉。下列句子也都用了感覺移轉的摹寫方式，請判斷何者說明正確？
  options:
  - label: A
    content: 星星是靜靜的掛在空中，卻好像帶著聲音，是早晨的幽遠之鐘，也是靜夜中雄渾的鼓聲，有著清脆的節奏與閃耀的聲息──以視覺印象描寫聽覺印象
  - label: B
    content: 水面無波，四周靜謐，只有閃亮的螢光是唯一的聒噪，看著看著，人都彷彿在光裡醉了──以聽覺印象描寫視覺印象
  - label: C
    content: 水溝旁的惡臭形成了砲聲隆隆，不斷攻擊我的神經──以觸覺印象描寫嗅覺印象
  - label: D
    content: 早晨的一杯拿鐵咖啡，使我的舌尖響起數千隻獅子奔跑的腳步聲──以味覺印象寫聽覺印象
  tags:
    textbook: 八下 第四課 我所知道的康橋
    labeled_by: ai
