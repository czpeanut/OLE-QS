  stem: 依據甲、乙二文，藉由紋身文化可以印證的知識，最適當的是：
  options:
  - label: A
    content: 確認語系與族群的發展是緊密相關的
  - label: B
    content: 建立族群歷史觀，用以考察君王封號
  - label: C
    content: 了解「文」的字形結構和字義的演變
  - label: D
    content: 認識圖紋生物的習性，用以避免災禍
  group_stem: "（四）甲 「文」（甲骨文寫作，），即紋身，指人們在出生、成人、死喪之時舉行的儀式。要聖化即將進入靈界之人，方法是在胸部加上紅色符號，其形狀就稱作「文」。此一符號描畫的是生命象徵──心臟的形狀，心臟之形又常省略為像「V」、「X」等。為求聖化而加上的紋身之美，也可以理解為人們內在德行的象徵。因而，在稱呼神聖的祖靈時，用文祖、文考，頌美祖靈之德則稱作文德。殷朝的王名中，有冠上文字的，如文丁。\
    \  （改寫自白川靜 漢字百話）\n乙 排灣族圖紋內涵分成兩個部分，其一是圖紋本身的圖案元素，其二是這些元素的排列方式。前者在早期的研究文獻和目前的排灣族耆老身上都還能訪得，散佚的主要是後者。圖紋有男女、社會階級之別，女孩子的手部圖紋會依年齡、是否生過小孩，而有不同的圖紋排列方式，因此圖紋意義比男生的複雜。目前許多年輕女孩紋在手背的圖案僅靠互相模仿，或只知有哪些基本圖案，而不知正確的排列順序。男生多半是以百步蛇象徵祖靈，用來保佑自己，並表徵自己的社會地位。對於圖紋本身的圖案元素，可以請部落耆老回憶，畫出圖紋來；對於圖紋已經散失的部落，頭目或可召開會議，決定屬於該部落的社會階級圖紋。這可能是頭目在復興傳統圖紋上應扮演的角色。若要恢復紋身的傳統精神，年輕人得回去將家族歷史弄清楚，以確認他的身分和階級，如貴族還是平民，確認好圖紋，才執行紋身。紋身前，家族的人會拿出祖先骨灰的陶甕，跟祖靈報告，並邀請祖靈來觀看。\n\
    \  臺灣做為南島語系族群的起源，語言和太平洋諸島嶼有相符之處，而紋身也是。臺灣和其他國家的南島語族一樣，有深厚豐富的紋身文化，只可惜尚未被世界看見。\n\
    （改寫自阿桂 將族群歷史寫在身上）"
