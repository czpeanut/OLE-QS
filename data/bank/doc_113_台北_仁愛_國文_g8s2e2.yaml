- id: doc_113_台北_仁愛_國文_g8s2e2_s4_33
  section: 4
  number: 33
  type: single
  page: 4
  stem: 根據本文，下列說明何者有誤？
  options:
  - label: A
    content: 「你真的好優秀喔」結尾加上表情符號，可以輔助文字外的訊息
  - label: B
    content: 早期的顏文字，只能用現有的字母和標點符號來組成人臉的表情
  - label: C
    content: 後期的顏文字，不再只有臉部表情，還包含其他身體部位與元素
  - label: D
    content: 美式表情符號的表情區別主要在眼睛；日式顏文字則以嘴巴分辨
  group_stem: '（三）在心理和傳播學界有個著名的「7%法則」，指的是人類在進行口語溝通時，只有7%的意義是藉由語言表達，剩下的93%則是透過語調和肢體動作。這個7%法則其實凸顯了多數人溝通時，從口中說出的話不見得能充分傳達自己的想法，很多時候必須仰賴其他「信號」，例如語調和表情，來表現與理解某些細微的資訊與感受。

    今天如果有人對你說「你真的好優秀喔」，對方的語調和表情，可能都會形塑你對這句話的詮釋，甚至影響你和這個人之間的關係。這也是為什麼在網路上很容易誤解彼此的語氣和意圖，因為那些語言文字以外的資訊，都要靠我們自己「腦補」。

    為了要彌補這一點，不同時代與文化的人們都不斷嘗試用傳播媒介發展出新的符碼工具，以模擬或逼近人類實際面對面互動時的經驗，其中「顏文字」或是「表情符號」就是一套有趣也重要的系統。顏文字這個詞來自日文「顔文字」（kaomoji），顧名思義就是「臉」的「（文）字」，最經典常見的如^_^、T_T，表示「微笑」和「哭泣」的表情。

    這套系統起源自1980 年代中葉的日本，如果有用過早期BBS 或其他古老系統的讀者就知道，當時的電腦與網路技術，無法支援現代人常用的emoji（絵文字）和貼圖，只能用現有的字母和標點符號來組成人臉表情。儘管顏文字長得並不完全像人臉，使用的人大致也就望文生義，約定成俗了。

    大約在同一個時期，美國 卡內基 美隆大學的電腦科學家也在其校內線上系統的訊息中，開始使用字母與標點符號組成像是人臉表情的圖案，稱作emoticon，中文翻譯為「表情符號」，例如:-)和:-(，或是沒有鼻子的:P
    和XD。讀者會發現，美式表情符號和日式顏文字不只角度不一樣──前者的臉大多是倒下的，後者則是正的──主要表達情緒的部分也不一樣。美式表情符號的差別通常在嘴巴，而日式顏文字的重點則是在眼睛，這樣的差異與文化心理學的發現恰恰吻合：西方白人通常是靠圖中人物的嘴巴來分辨照片裡的情緒，而日本人則往往是看眼睛，雖然都是判別表情，卻有文化上的差異。

    隨著顏文字的發展與傳播，其面貌也有越來越多的變化，從單純的臉部表情，逐漸擴展成包含其他身體部位或元素的表意圖像，例如攤手¯\_(ツ)_/¯、土下座<(_ _)>。

    臺灣也曾流行過用生冷字「囧」作為表情符號，呈現無奈窘迫的樣子，這個字甚至被用到如囧男孩、人在囧途等華語影視作為標題裡，重新以新的意義回到中文當中。

    雖然顏文字和表情符號乍看之下是很具體的圖像，但在網路溝通當中，顏文字和表情符號通常是用來表達較為抽象與功能性的意義，例如可以緩和語氣、營造一種戲謔、友善的氣氛，或是傳達文字語句中不明講或講不清的意圖。如前面所說的例子「你真的好優秀喔:)」、「你真的好優秀喔:P」、「你真的好優秀喔T_T」和「你真的好優秀喔^_^」，上述四句話的文字訊息都一樣，只是在結尾皆使用了顏文字或表情符號，讀起來就沒有那麼嚴肅，又各自傳達出善意稱讚、開玩笑、表達羨慕或若有似無的嘲諷。

    無論如何，儘管語言文字在我們溝通中所占的重要性，絕對遠遠超過7%，但仍有不少「弦外之音」無法精準傳達。顏文字的故事告訴我們，在無法看見、聽見彼此的數位平台上，人類也能夠發揮創意，利用媒介與科技提供給我們的支應性，建構與協商出更細微完整的意涵，甚至創造出新的概念。
    （改寫自顏文字的前世今生 謝承諭）'
