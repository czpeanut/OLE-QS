  group_stem: '（二）鄭人遊於鄉校，以論執政。然明１謂子產曰：「毀鄉校何如？」子產曰：「何為？夫人朝夕退而遊焉，以議執政之善否。其所善者，吾則行之，其所惡者，吾則改之，是吾師也，若之何毀之？我聞忠善以損怨，不聞作威以防怨，豈不遽止？然猶防川，大決所犯，傷人必多，吾不克救也；不如小決使道，不如吾聞而藥之。」然明曰：「蔑也今而後知吾子之信事也。小人實不才，若果行此，其鄭國實賴之，豈唯二三臣？」仲尼聞是語也，曰：「以是觀之，人謂子產不仁，吾不信也。」（左傳）

