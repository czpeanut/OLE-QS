  number: 8
  type: single
  page: 1
  stem: 王老師請同學們分析我所知道的康橋一文中，作者在文中隱含的巧思。請問下列何者的說明是正確的？
  options:
  - label: A
    content: 先用六個「關心」觀察康河的風光，呈現對春光明漫的殷切企盼，再用譬喻法描寫百花齊放的景象
  - label: B
    content: 用三個「頃刻間」傳達夕陽西下的瞬息萬變，感嘆人生苦短，時光易逝，應及時行樂
  - label: C
    content: 用四個「你如愛」，津津樂道此處洋溢著人文與自然風光，也拉近和讀者的距離
  - label: D
    content: 文中引用陸游的詩句，說明康橋開啟他的自我意識，讓他了解自己的愛國情操
