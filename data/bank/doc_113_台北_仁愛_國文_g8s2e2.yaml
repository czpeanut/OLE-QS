  type: single
  page: 1
  stem: '下列引文皆為徐志摩的名句，請依文意推敲，判斷□中依序最適合填入的選項是：

    甲、我知道總有一種愛超脫於紅塵的牽絆，卻不知道有沒有一種癡纏的等待終於紅塵之外！我終究是你千年的白狐，灰飛煙滅後，我會等待下一次的□□。

    乙、我像一個□□，悄悄收藏起時光的底片，讓它變成陳年的私釀，然後在那個夏日的午後，晾曬出任何與你有關的畫面。

    丙、□□是最殘忍的遊戲，彼此追逐卻有永恆的距離。'
