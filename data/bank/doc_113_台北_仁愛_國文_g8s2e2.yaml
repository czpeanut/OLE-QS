  section: 4
  number: 13
  type: single
  page: 2
  stem: 下述是芙莉蓮對水神的指引一文的理解，請問哪一項的內容描述正確？
  options:
  - label: A
    content: 「祖父曾說過：『自然從未啞過，只是我們一直在背離她而已，我們不敢用真實去面對她，我們脫離了與她的歸屬感，讓自己獨享一切。』」說明族人嚮往都市繁榮而離開故鄉，而讓自然感到寂寞
  - label: B
    content: 「老獵人為了讓附近的人知道這裡有水流出，就在水滴落的地方放了一塊石板，石板下挖空，讓水的滴落聲能起共鳴，讓人來到這裡取水。」強調自然的生生不息，而人類卻無能為力
  - label: C
    content: 「兒子，別小看這麼一點點的水量，她是很彌足珍貴，就如你口乾後芋葉上的那個水滴一樣，在這麼大的獵場裡，也就只有這裡有水源，在附近耕作或打獵的人都來這裡用水，這裡是獵場裡唯一的水源區。」將抽象的珍貴性具體化，強調水源雖小，卻是唯一
  - label: D
    content: 「這條山徑，是父親付出勞力和血汗的最好證據，由採藤心的次數來換算他對我們付出的辛苦，我們的生活費、學費，就是從這條山徑走出來的。」看到父親無悔的付出，作者對父親的舐犢之情又更深了
  lesson_raw:
    title: 水神的指引
    basis: 題目指明水神的指引
