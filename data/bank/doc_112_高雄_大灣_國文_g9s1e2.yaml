- id: doc_112_高雄_大灣_國文_g9s1e2_s2_37
  section: 2
  number: 37
  type: single
  page: 5
  stem: 根據上文，下列何者是作者認為人類避免感染蝙蝠身上病毒的方法？
  options:
  - label: A
    content: 研發能抑止的新型有效疫苗
  - label: B
    content: 活動範圍避開蝙蝠棲息地
  - label: C
    content: 增進人體適應環境的免疫力
  - label: D
    content: 定期到蝙蝠洞噴灑殺毒藥劑
  group_stem: "(四)\n立白、伊波拉、MERS、SARS，這些都是世界上最危險的病毒。像伊波拉這一類出血性傳染病，會殺死90％的受感染者。這些惡名昭彰的病毒都是近50\
    \ 年來才出現在人類中，而攜帶這些病毒的，都是蝙蝠。\n蝙蝠這物種極其特殊，牠身上攜帶的、對人類致命的病毒種類和數量，超過絕大多數的動物，一個主要原因是蝙蝠喜歡群居，不同種類的蝙蝠，會大量聚集在擁擠閉塞的空間裡，使得病毒在蝙蝠之間你傳我、我傳你。\n\
    那麼為什麼大多數受感染的蝙蝠不會死亡，還到處飛行傳播病毒呢？一般來說，會飛的動物，絕大部份不是哺乳類，因為飛行需要大量的能量，哺乳類動物沒有辦法在不產生損害DNA\
    \ 的副產品下飛行，但蝙蝠就可以。當蝙蝠在空中飛行的時候，反而會增強飛行時DNA 的修復能力和產生其他防護作用，這些變化能夠抑制入侵者的特殊細胞，讓蝙蝠就能百毒不侵。\n\
    病毒又是怎麼樣在蝙蝠體內生存的呢？很多病毒儘管惡名昭彰，其實它們的生存條件十分挑剔，它們需要體內溫度有著精密控制的陸地動物。而當蝙蝠飛行的時候，他的體溫上升到40℃左右，一般病毒是難以承受這種高溫的，但少數堅強的病毒進化到能夠承受這種熱度，也就是說，它們進到人體細胞內之後，人的免疫系統對它發動戰爭，引發發燒，但發燒的溫度對他們來講只是小菜一碟。\n\
    當人類的活動侵入蝙蝠棲息地，也就消除了人類與蝙蝠的生存界線；除非人類限縮活動範圍，否則人與蝙蝠身上病毒的戰爭，永無休止。\n               \
    \                          (節錄陳祖晴 蝙蝠為什麼這麼神奇 身上有百毒卻百毒不侵？)"
  tags:
