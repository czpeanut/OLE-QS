  section: 2
  number: 35
  type: single
  page: 4
  stem: '根據本文下列哪些成語可用來形容王小玉說書的聲音？

    (甲)六馬仰秣 (乙)三月不知肉味 (丙)珠圓玉潤 (丁)朱脣皓齒 (戊)餘音繞樑 (己)冰清玉潔'
  options:
  - label: A
    content: 甲乙丙丁
  - label: B
    content: 甲丙丁戊
  - label: C
    content: 甲乙丙戊
  - label: D
    content: 甲丙丁己
  group_stem: "(三)\n王小玉便啟朱脣，發皓齒，唱了幾句書兒。聲音初不甚大，只覺入耳有說不出來的妙境，五臟六腑裡，像熨斗熨過，無一處不伏貼；三萬六千個毛孔，像吃了人參果，無一個毛孔不暢快。唱了十數句之後，漸漸的愈唱愈高。忽然拔了一個尖兒，像一線鋼絲，拋入天際，不禁暗暗叫絕。哪知她於那極高的地方，尚能迴環轉折；幾轉之後，又高一層，接連有三四疊，節節高起，恍如由傲來峰西面攀登泰山的景象：初看傲來峰削壁千仞，以為上與天通；及至翻到傲來峰頂，才見扇子崖更在傲來峰上；及至翻到扇子崖，又見南天門更在扇子崖上；愈翻愈險，愈險愈奇。那王小玉唱到極高的三四疊後，陡然一落，又極力騁其千迴百折的精神，如一條飛蛇，在黃山三十六峰半中腰裡盤旋穿插，頃刻之間，周匝數遍。從此以後，愈唱愈低，愈低愈細，那聲音漸漸的就聽不見了。滿園子的人都屏氣凝神，不敢少動。\n\
    \                                                                           (劉鶚\
    \ 明湖居聽書)"
  lesson_raw:
    title: 明湖居聽書
    basis: 題組選文為劉鶚〈明湖居聽書〉
