  group_stem: "(二)\n 讀書以過目成誦為能，最是不濟事。眼中了了，心下匆匆，方寸無多，往來應接不暇，如看場中美色，一眼即過，與我何與也。\n 千古過目成誦，孰有如孔子者乎？讀易至韋編三絕，不知翻閱過幾千百遍來，微言精義，愈探愈出，愈研愈入，愈往而不知其所窮，雖生知安行之聖，不廢困勉下學之功也。東坡讀書不用兩遍，然其在翰林讀阿房宮賦至四鼓，老吏苦之，坡灑然不倦。豈以一過即記，遂了其事乎！\n\
