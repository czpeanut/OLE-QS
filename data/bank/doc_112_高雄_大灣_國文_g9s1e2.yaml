  group_stem: "(五)\n你多久沒看書了？時間是否久到連自己都想不起來？但你却可能剛剛才看過「臉書」！這一個人手一機的「滑世代」，也是五個人中就有兩個人整年沒看過書的「不讀時代」。一整年都沒看過紙本書的受訪者中，高達32.3%的人最近一次看紙本書已是1\
    \ 到3 年前，甚至有19%表示超過10 年沒讀書；平均而言,上一次看紙本書已是7 年多前。如果不包括教科書和漫畫等，有高達65%的受訪者整年沒買書。\n\
    \    傳統社會賦予「讀書」太多功利目標，讀「書」被局限於念課本和應付考試，難培養孩子閱讀的興趣，一旦出了社會、不須考試，便失去拿起書本的動力。學生不是不讀，是習慣目標達成式的閱讀，像近年國高中大考考题題幹長，須具備靜下來閱讀的能力，才能拿到高分，就是種功能性閱讀的培養。\n\
    \    現代社會誘惑太多，許多人「只讀手機不讀書」，前文中那些沒碰書的人並非完不讀，是只讀「訊息」。但這些訊息因為太短,無法累積成知識,造成人們對所有政治社會人生的反應都變成立即性、反射式，較少沉澱、延伸成系統性的思考，所有問題都只剩下標題,長久下來恐使臺灣「淺碟化」。\n\
    \                                                                        (改寫自聯合報願景工程)"
