- id: doc_113_新北_崇林_國文_g7s1e1_s5_37
  section: 5
  number: 37
  type: single
  page: 4
  stem: 關於本文的文意解讀何者正確？
  options:
  - label: A
    content: 爭執導致關係破裂，就像茶葉蛋上的裂痕，遭受傷害就不能再回到圓滿
  - label: B
    content: 茶葉蛋裂痕越多越入味，意味人生的挫敗傷痕都是使人生更深刻的歷程
  - label: C
    content: 茶葉蛋蛋殼脆弱易碎，就像人的生命，禁不起意外的碰撞
  - label: D
    content: 人生就如烹煮的茶葉，略帶苦澀，苦中帶甘，意指人生無奈、苦不堪言。
  group_stem: "茶葉蛋流傳甚廣，幾乎遍布大中華。在臺灣，這種庶民小吃更緊密連接著生活，甚至成為許多數據的指標，如最近調漲的基本工資，換算後約是每天一顆茶葉蛋，清楚明瞭。尤有甚者，便利商店都賣茶葉蛋，每家店皆備有電鍋，鍋內不斷冒出蒸氣，一顆顆滾燙的茶葉蛋顯現不規則裂痕。超商的茶葉蛋價格是物價指標，據說，單統一超商一年即可賣出四千萬顆茶葉蛋，是為「黑蛋傳奇」。\n\
    \    有時旅行異域，在酒店內早餐吃水煮蛋，原味，撒點鹽就很美。茶葉蛋則必須入味，類似滷蛋的美學原理，令茶湯滷汁有效地滲入蛋白及蛋黃，干涉其味道；異於滷蛋的是帶殼製作，滲透之道乃依賴蛋殼裂縫。那裂縫乍看似毀壞，似傷痕，其實是茶葉蛋之宿命。人生本來就不缺乏損傷與苦澀。既選擇入味，就注定回不去水煮蛋的時光，回不去年輕時光；那些裂痕，那深褐紋路的表皮像歲月的皺紋，像生活的歷程，深刻，實在，飽滿著記憶之味。既選擇茶葉蛋，就必須割捨滷蛋的可能；既然從事文學工作，不免就喪失了當科學家的抱負。\n\
    \    人生果然像茶葉蛋，偶有傷痕與毀壞，像烹煮的茶葉，略帶苦澀；苦中帶甘，苦中作樂。微笑中閃著淚光。茶葉蛋表現一種入味美，唯裂痕越多越能入味，雞蛋久煮後蛋殼龜裂，茶葉之香循著裂紋滲入蛋內，蛋白彈牙，蛋黃綿密，帶著輕淡的醬味和茶香。蛋殼上的裂痕是一則隱喻。人生的傷痕亦然。\
    \                                                 節錄自焦桐〈茶葉蛋〉"
