- id: doc_113_新北_崇林_國文_g7s1e1_s5_39
  section: 5
  number: 39
  type: single
  page: 4
  stem: 杏林子去醫院進行身體檢查時，最有可能發現何種症狀？
  options:
  - label: A
    content: 關節酸痛僅持續三天
  - label: B
    content: 紅血球沉降速率降低
  - label: C
    content: 免疫系統失調把自己的關節當成攻擊的目標
  - label: D
    content: 侵犯的關節數目一個。
  group_stem: "什麼是類風濕關節炎？\n  類風濕關節炎是一種全身性自體免疫疾病，所謂自體免疫疾病是指免疫系統把自己的組織當成外來的敵人來攻擊，類風濕關節炎的病人本身免疫系統失調把自己的關節當成攻擊的目標，造成關節的發炎，進而關節破壞，甚至變形。類風濕關節炎發病的年齡屬於中壯年，因此對病人本身以及家庭社會，不論經濟上、身體上、心理上、均有重大的影響。\n\
    \  如何診斷類風濕關節炎？\n  類風濕關節炎的表現是一種慢性多發性關節炎。所謂的慢性，是指症狀必須持續超過六週以上。所謂多發性，是指侵犯的關節數目超過四個以上。理學檢查可發現類風濕結節。實驗室檢驗可發現貧血，血小板低下，類風濕因子呈現陽性，紅血球沉降速率增加，C\
    \ 反應蛋白（即發炎指數）增加。X 光有特異性的表現，例如：骨頭侵蝕、關節間隙變小、關節脫位等。類風濕關節炎的診斷有時不是很容易，有很多疾病會表現關節炎，也不是關節酸痛就是類風濕關節炎，另外類風濕因子陽性也不是代表就是類風濕關節炎，因此關節發炎在診斷有問題時最好找風濕科專科醫師。\
    \                             節錄自奇美醫院衛教文章"
