  section: 3
  number: 3
  type: single
  page: 1
  stem: 「撒了滿天的珍珠和一枚又大又亮的銀幣」一句所描繪的星空，與下列何者最接近？
  options:
  - label: A
    content: 守了一夜的星星漸漸閉上眼睛，最後消失在晨空中
  - label: B
    content: 幾顆赤裸的星星可憐巴巴的挨著凍，瑟瑟發抖
  - label: C
    content: 流星劃過，留下一道美麗的長弧，原來流星也是美的
  - label: D
    content: 星星像寶石一般鑲嵌在夜空中，彷彿無數隻小眼睛注視著我
