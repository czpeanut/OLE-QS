- id: doc_111_彰化_溪湖_國文_g7s1e1_s3_4
  section: 3
  number: 4
  type: single
  page: 1
  stem: 「蝴蝶和蜜蜂們帶著花朵的蜜糖回來了，羊隊和牛群告別了田野回家了，火紅的太陽也滾著火輪子回家了。」這段詩句描寫的時間點，與下列何者相同？
  options:
  - label: A
    content: 皎潔的月，光芒萬丈，似乎有將整個天空照亮的雄心壯志
  - label: B
    content: 天邊露出魚肚白，漸漸的愈來愈明了，由魚肚白色轉為橘黃色
  - label: C
    content: 那火紅的夕陽就像剛誕生的娃娃一樣掛在半山腰，將一天的殘暉毫無保留的撒向大地
  - label: D
    content: 當空的太陽如熊熊燃燒的一團火焰，向大地噴射著過量的光和熱，於是大地都像快要燃燒起來
  lesson_raw:
    title: 夏夜
    basis: 引用夏夜課文原句
