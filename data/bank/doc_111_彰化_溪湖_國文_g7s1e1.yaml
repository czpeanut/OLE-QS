    content: 院子裡遍布著搖曳生姿的瓜葉
  - label: B
    content: 花園裡的池塘長滿挺立的荷葉
  - label: C
    content: 布滿星星、螢火蟲的夏夜景致
  - label: D
    content: 颱風來襲，院子裡淹水的情景。
  group_stem: 2. 我還記得那些夏天的晚上，啊！那必然是我生命中最美的一段記憶。星星、螢火蟲、隔壁小孩的笑鬧……園中的小路成了一個島，四周是南瓜的浪潮。風來的時候，南瓜葉如浪般翻滾，交頭接耳地傳遞它們的祕密。即使在無風的時候，葉子也驕傲地揚著頭，若有若無地擺動。颱風天的午後，我們坐在走廊裡。院子漲滿了水，更像一片長滿了挺立的荷葉的池塘。
