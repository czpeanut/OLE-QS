  options:
  - label: A
    content: 總會驚醒些什麼／至少是／落在好土裡的／種子
  - label: B
    content: 沒有太陽的光芒／沒有月亮的柔美／但黑暗中的點點閃爍／是你對光明的忠誠
  - label: C
    content: 提著琉璃宮燈的嬪妃們／幽幽的渡過天河／一個名叫彗的姑娘／呀的一聲滑倒了
  - label: D
    content: 螢幕上幽浮來又幽浮走的／是個壞球／下墜球會到香港／上飄球則入蘇杭／當門窗都吹成口哨／螺旋早把臺灣捲入瘋狂。
