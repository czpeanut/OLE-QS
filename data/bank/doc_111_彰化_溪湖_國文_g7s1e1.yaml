- id: doc_111_彰化_溪湖_國文_g7s1e1_s3_33
  section: 3
  number: 33
  type: single
  page: 3
  stem: 下列敘述，何者無法看出母親收到作者親手織就的毛衣時，捨不得穿的珍惜之情？
  options:
  - label: A
    content: 母親望著女兒的畢業照片，含著眼淚
  - label: B
    content: 下廚房怕上灰
  - label: C
    content: 只有早晚才套一下
  - label: D
    content: 姨媽把毛衣交給我時，看看還是嶄新的
  group_stem: '3. 回到上海，我馬上買了一磅道地的蜜蜂牌藏青毛線。我開了幾個夜車，一口氣就織起一件前面釘扣子、套在襖子外面的毛衣，趕著郵寄回家。據姨媽告訴我，母親收到毛衣真是興奮，她穿在身上摸著、照著，讓所有的親戚朋友看她女兒的傑作。可是她並沒有穿多少次，她捨不得穿，下廚房怕上灰，晒太陽怕掉色，只有早晚才套一下。難怪那時姨媽把毛衣交給我時，看看還是嶄新的，這些年來，倒是我自己把它穿舊了。我沒有了母親，只保留了這件紀念品。以後每年冬天，我總穿著它，母親的愛，好像仍舊圍繞著我，我不能不怨姨媽和叔叔，為什麼不把母親病危的消息告訴我。他們說那是母親的意思，她不讓我在畢業考試的時候分心，況且那時交通阻隔，單身女孩子繞路回家太危險。她不願她唯一的女兒為她冒這樣大的險。可是她心裡是多麼想我回家見最後的一面，她望著女兒的畢業照片，含著眼淚說：「若不是打仗，她考完就好回來了。」

    （改寫自琦君毛衣）'
  tags:
    textbook: 七上 第五課 背影
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 七上
      subject: 國文
      code: 第五課
      title: 背影
      chapter: null
