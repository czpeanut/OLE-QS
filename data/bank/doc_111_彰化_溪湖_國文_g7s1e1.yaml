    content: 「輕薄」的話可別再說了／這款手機「輕薄」短小
  - label: B
    content: 「廣漠」的田野裡滿是金黃色稻穗／在「廣漠」的人海裡混了許多年
  - label: C
    content: 這篇文章旨意不夠「完全」／他的話我「完全」同意
  - label: D
    content: 父親走路的「腳步」很大／做人處事要站穩「腳步」。
