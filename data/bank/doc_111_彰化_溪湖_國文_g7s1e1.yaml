  page: 2
  stem: 「從前，有一個孩子，在學校的功課極差，老師說他的智力有問題，孩子們不和他一起玩。他經常一個人在花園裡很長時間地看著花草小蟲，自得其樂。他的父親教訓他：『你將來會有辱你自己。』他的姐姐也看不起這個兄弟。但是他的母親憐憫他。母親耍了一個小心機，她對孩子們說：『比一下吧，看誰從花瓣上先認出這是什麼花？』兒子總是比他的姐姐認得快，母親每次都吻他一下。這對他來說，是多麼令人興奮的一件事。對於孩子母親的做法，她的丈夫始終覺得不可理喻。但是，這位醉心於花草的孩子，多年後成為了生物學家。他就是十九世紀英國最偉大的生物學家達爾文。」（改寫自馮志遠醉心花草之中的孩子）關於母親耍小心機的目的，下列敘述何者正確？
