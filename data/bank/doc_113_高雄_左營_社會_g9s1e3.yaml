  group_stem: "【網路新聞】\n    大巨蛋吸引周杰倫、張惠妹等華語天王巨星相繼登場，引爆演唱會經濟學，帶動住宿、餐飲、零售等周邊消費市場的繁榮。業者分析，每場巨星演唱會都會吸引數萬名來自全台各地、甚至國外的歌迷，這些人不僅會購票看演出，還會提前預訂酒店、參觀景點、並在當地餐廳消費，形成了一條龐大的經濟鏈。\n\
    \    台北君悅酒店表示，大巨蛋帶來的效益顯著，以今夏為例，君悅飯店首次結合中華職棒推出棒球住房專案，提供酒店至大巨蛋乘車金、贈送周邊商品及館內餐飲優惠，推出後創造了超高討論度，兩個月銷售約50筆訂房，每晚平均1萬2千元。請根據內容回答第6-12題："
  uncertain_spans:
