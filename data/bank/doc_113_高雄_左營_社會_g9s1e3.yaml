- id: doc_113_高雄_左營_社會_g9s1e3_s5_45
  section: 5
  number: 45
  type: single
  page: 6
  stem: 中世紀後期大平原的貿易主要由圖中何處商人居間控制？
  options:
  - label: A
    content: 乙
  - label: B
    content: 丙
  - label: C
    content: 丁
  - label: D
    content: 戊
  group_stem: "對人類而言，歐亞大平原是陸地上的海，……這種無水的海也有其穿著乾鞋的船和無碼頭的港口。大平原的大帆船就是駱駝，……大平原的港口就是商隊的集中點。……偉大的革命就是技術革命，西方靠它發了財，超過了其他文明，並強制將之聯合成一個單一社會。\n\
    \    西方這個有革命意義的大發現，使海洋取代大平原作為世界交通的主要通道。首先是帆船、接著是蒸汽船，利用海洋作通道，使西方把居住著人口的和可以居住人口的整個世界統一起來。\n\
    摘錄自 阿諾德﹒湯恩比《考驗中的文明》(紐約：牛津大學出版社，1948)"
  shared_asset: g5_45_47
