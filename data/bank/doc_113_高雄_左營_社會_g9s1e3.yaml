- id: doc_113_高雄_左營_社會_g9s1e3_s5_48
  section: 5
  number: 48
  type: single
  page: 6
  stem: 上文敘述的文明應位於圖中何地？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
  group_stem: "此文明有神聖曆和太陽曆兩套曆法。神聖曆用於占卜，而太陽曆主要用於農業，如預測雨季、旱季時間，將一年分為18個月，每月20日，年末5日被稱為「無用日」，共365日。每月開端此文明會舉行不同的慶典，並以慶典名稱為月份命名。\n\
    \    此文明相信必須用人的鮮血供奉太陽，祂才有力量每天從東邊升起，他們也相信農作物要有好收成也得依靠祭祀鮮血，故活人獻祭品數量非常可觀。\n    1520~1521年一場疾病爆發，席捲都城特諾奇蒂特蘭，疾病使外族輕易於1521年8月攻破都城。在都城廢墟上墨西哥城被建立起來，歐式建築逐漸取代古文明的建築。"
