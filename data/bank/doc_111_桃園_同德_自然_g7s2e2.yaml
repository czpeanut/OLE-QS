- id: doc_111_桃園_同德_自然_g7s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 小鼠性別決定機制與人類相同，但視覺僅能看見黃、藍和灰色。若將人類感光色素基因成功轉殖至許多小鼠受精卵的 X 染色體之特定位置，則由此發育的小鼠可分辨紅綠燈的顏色，關於上述成功轉殖的這群小鼠，下列推論何者最合理？
  options:
  - label: A
    content: 屬於親代行無性生殖所產生的子代
  - label: B
    content: 若為雄性則其所產生的精子皆具此基因
  - label: C
    content: 全身的體細胞皆具有人類感光色素基因
  - label: D
    content: 互相繁殖出的下一子代皆無法分辨紅綠色。
