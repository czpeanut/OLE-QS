- id: doc_111_桃園_同德_自然_g7s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 小童家人買了「硅藻土」腳踏墊跟「珪藻土」皂盒,他覺得兩樣商品材質、功能很類似,上網以「硅藻土，珪藻土差異」為關鍵詞進行搜尋,發現不論硅藻土或是珪藻土,其實就是課本上寫的「矽藻土」,三者本質皆相同,是矽藻殘骸經地質作用,在地表上開採而得,具多孔隙、強吸水性。矽藻有關的知識,何者最可能有誤?
  options:
  - label: A
    content: 陸地上開採取得矽藻土,可以推論此地點過去可能是水域環境。
  - label: B
    content: 矽藻殘骸堅硬部分經過地質作用保存下來,可能是矽藻的細胞壁。
  - label: C
    content: 矽藻是多細胞藻類,形態多樣,沒有真正的根莖葉構造。
  - label: D
    content: 矽藻與石蓴都是原生生物界的生物。
