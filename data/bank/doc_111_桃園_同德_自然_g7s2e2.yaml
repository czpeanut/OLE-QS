  section: 2
  number: 41
  type: single
  page: 5
  stem: 蟲草(Cordyceps sinensis )在分類上應屬於哪一界的生物？
  options:
  - label: A
    content: 原生生物界
  - label: B
    content: 真菌界
  - label: C
    content: 植物界
  - label: D
    content: 動物界。
  group_stem: '4. ★請閱讀完下列文章:

    冬蟲夏草(學名：Cordyceps sinensis) 簡稱蟲草。是中國傳 統的名貴中藥材，它是由肉座菌目麥角菌科蟲草屬的冬蟲夏草菌寄生於高山草甸土中的蝙蝠蛾幼蟲，使幼蟲僵化，在適宜條件下，夏季由僵蟲頭端抽生出長棒狀的子囊座而形成(即冬蟲夏草菌的子實體與蝙蝠蛾幼蟲屍體構成的複合體)。它主要產於中國青海、西藏、四川、雲南、甘肅、貴州等省及自治區的高寒地帶和雪山草原。真正的冬蟲夏草均為野生，生長在海拔
    3000 米至 5000 米的高山草地灌木帶上面的雪線附近的草坡上。夏季，蟲子卵產於地面，經過一個月左右孵化變成幼蟲後鑽入潮濕鬆軟的土層。土裡的一種蟲草菌孢子侵襲了幼蟲，在幼蟲體內生長。經過一個冬天，到第二年春天來臨，菌絲開始生長，到夏天時長出地面，外觀象一根小草，這樣，幼蟲的軀殼與菌絲共同組成了一個完整的「冬蟲夏草」。'
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 生物
      code: 3-3
      title: 原核、原生生物及真菌界
      chapter: 第3章 生物的演化與分類
    textbook: 七下生物 3-3 原核、原生生物及真菌界
    labeled_by: ai
