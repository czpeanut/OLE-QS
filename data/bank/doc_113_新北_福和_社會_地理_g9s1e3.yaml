  stem: 附圖為2020 年澳州政府公布的起火點分布圖，若根據圖片判斷，森林大火對於人類影響最嚴重的區域最有可能受到下列哪個行星風系的影響？
  options:
  - label: A
    content: 東南信風帶
  - label: B
    content: 副熱帶高壓
  - label: C
    content: 赤道低壓帶
  - label: D
    content: 西風帶。
  group_stem: '澳洲森林大火是澳洲炎熱乾燥季節頻繁發生的野外火災。每年有大面積的土地都會被破壞，並且造成財產損失和人員傷亡，但這次從2019 年9 月開始持續延燒的大火，已創下數十年來最慘重的災情。

    野外火災通常是由閃電引起，或有人為疏忽和故意縱火引起，而這次澳洲森林大火的主因，被認為是從 2019 年12 月中旬開始的熱浪，以及已長達3 年的乾旱所造成。極端高溫、乾旱及強風不僅成為助長火勢的元素，使野火燃燒後形成的有害霧霾蔓延並壟罩各重要都市多日，空氣品質飆升到對人體有害的危險等級。'
