  stem: 大溪地（如圖三）為法國位於南太平洋的領土，是著名的旅遊勝地。由於法國本土7、8 月風平浪靜，並不適合衝浪，2024 巴黎奧運的衝浪項目並不在法國舉行，而在距離巴黎1
