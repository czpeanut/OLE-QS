  group_stem: "1.   \nJenny: Hi, Lily! I’m thinking about buying some new clothes.\
    \ Do you want to come shopping with me? \nLily: Sure! That sounds fun. What are\
    \ you looking for? \nJenny: I need a new jacket for the fall. Something warm but\
    \ not too expensive. \nLily: I know a good store, and it has sales right now.\
    \ Their jackets are around $50. Is that okay for your budget? \nJenny: That sounds\
    \ good for me. I was hoping to spend less than $100. Do you think they have different\
    \ styles? \nLily: Yes, they have a lot of choices. Some are casual, and some are\
    \ more formal. What style are you looking for? \nJenny: I like something casual,\
    \ but I want it to look a little stylish too. \nLily: Great! I think you’ll find\
    \ something new and beautiful there to match your skirt. What color do you like?\
    \ \nJenny: I like dark colors, like black or blue. They’re also easy to match\
    \ with my jeans, and shoes. \nLily: Good choice! Let’s go check out the store\
    \ this weekend. I would like to get some clothes, too. \nJenny: Sounds great!\
    \ Thanks for helping me decide. \nLily: No problem! Shopping is always more fun\
    \ together! \n \nbudget 預算less than 少於 / 不超過casual 休閒formal 正式stylish 時尚的 / 有型的\
    \  match 搭配 / 匹配"
