  group_stem: "4.  \nElizabeth I was born on September 7, 1533. Her father was King\
    \ Henry VIII, and her mother was Anne Boleyn. Elizabeth had a \nhard start in\
    \ life. When she was only two years old, her mother was dead, and Elizabeth lost\
    \ her place as the next queen. Her life \nbecame very difficult, but she later\
    \ became one of England’s greatest queens. \nIn 1558, when Elizabeth was 25, she\
    \ became queen after her half-brother and half-sister ruled and passed away. England\
    \ was \nfacing many problems. The country was in debt, but other European countries\
    \ were strong and rich. Elizabeth was smart and \ncareful, so she chose loyal\
    \ advisors to help her to make England strong. \nOne special thing about Elizabeth\
    \ was that she chose not to marry. She stayed single for her life. Many people\
    \ thought she \nneeded a husband to help her, but Elizabeth wanted to be independent.\
    \ People called her the “Virgin Queen” because she stayed \nsingle and it could\
    \ let her rule and make her own decisions. \nElizabeth loved the arts, and during\
    \ her time, writers like William Shakespeare became famous. This time, called\
    \ the \nElizabethan Age, was one of the most creative in English history. She\
    \ also let explorers like Sir Francis Drake to find new lands \nand bring wealth\
    \ back to England. \nIn 1588, Spain, a powerful country, sent ships to attack\
    \ England. Elizabeth gave a famous speech, saying she had “the heart and \nstomach\
    \ of a king.” With her leadership, England won the fight with the Spanish Armada.\
    \ \n \nElizabeth ruled for 45 years, (50) _________________________________________________\
    \ \n \nruled 統治  passed away= died   in debt 負債  European 歐洲的 loyal advisor 忠臣\
    \  decision 判斷  creative 有創意的  \nexplorer 探險家 wealth 財富 leadership 領導力\n\nconclusion\
    \ 結論 \npeace 和平 \nstrength 力量 實力"
