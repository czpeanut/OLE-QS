    (     )

    What transportation should you take from Heathrow Airport to Paddington Station?'
  options:
  - label: A
    content: The Tube
  - label: B
    content: A local bus
  - label: C
    content: Heathrow Express
  - label: D
    content: Docklands Light Railway (DLR)
  group_stem: "3.  Five-Day Travel Plan for London \nDay 1: Arriving and City Tour\
    \ \nStart your trip by flying into Heathrow Airport. After arriving, take the\
    \ Heathrow Express to Paddington Station. From Paddington, \nuse the London Underground\
    \ (or \"Tube\") to travel. Buy an Oyster card and it lets you travel easily on\
    \ the Tube and buses. For the \nfirst day, visit the London Eye for a great view\
    \ of the city. End the day by visiting Trafalgar Square; it’s free to walk around!\
    \ \n \nDay 2: Historic Sites \nOn the second day, start with Buckingham Palace\
    \ to see the Changing of the Guard. It’s free to watch, but arrive early for a\
    \ good \nview. Then take a short Tube ride to Westminster Abbey to see the beautiful\
    \ building and history. Next, walk to the Houses of \nParliament and Big Ben.\
    \ Both are iconic sights, and when you can’t go inside, they’re great for photos.\
    \ For lunch, try a local pub \nmeal. \n \nDay 3: Museums and Culture \nToday,\
    \ visit London’s famous museums. Start at the British Museum; it is free to go\
    \ into the museum, and it has amazing artifacts \nlike the Rosetta Stone. Then,\
    \ take the Tube to Tate Modern for modern art—it’s also free. In the afternoon,\
    \ visit Covent Garden, \nwhere you’ll find shops, street performers, and cafes.\
    \ \n \nDay 4: Shopping and Markets \nIn the morning, head to Oxford Street for\
    \ shopping. You’ll find everything from high-street fashion to luxury brands.\
    \ Next, visit \nCamden Market for gifts, food, and street art. Lunch at Camden\
    \ Market gives a lot of choices. In the evening, go to Piccadilly \nCircus to\
    \ see the lively streets and bright lights. \n \nDay 5: Day Trip to Greenwich\
    \ \nOn the last day, take the DLR (Docklands Light Railway) to Greenwich. Here,\
    \ visit the Royal Observatory to see the Prime \nMeridian, the line dividing the\
    \ eastern and western hemispheres. Next, visit the Greenwich Market for gifts\
    \ and snacks. After \nreturning to central London, take a rest, and have a farewell\
    \ dinner at a local restaurant before leaving. \nEnjoy your trip to London! \n\
    iconic 代表性的 / 象徵性的  artifacts 文物 / 工藝品 luxury brands 奢侈品牌  dividing 分隔 / 劃分eastern\
