  group_stem: "2.  \nSophie is a fashion designer, and she loves making beautiful\
    \ dresses. Today, she is working on a special plan: making a new \ndress for a\
    \ fashion show. She wants the dress to look beautiful and catch everyone’s eye.\
    \ \n \nIn the morning, Sophie starts with some drawings. She sits at her desk,\
    \ takes out her pencils and paper, and begins to draw. She \ntries many shapes,\
    \ colors, and styles. After an hour, she finds the perfect look: a long, flowing\
    \ dress with a fitted top and a wide \nskirt. She decides to use dark blue cloth\
    \ because it looks beautiful. \n \nNext, Sophie goes to a store to buy the things\
    \ she needs. She picks soft, high-quality cloth and some small shiny things to\
    \ put \non the dress. She wants the dress to shine under the light on the runway.\
    \ \n \nBack at her workplace, Sophie starts cutting the cloth and sewing it. It\
    \ takes a lot of time and care to make it look perfect. She \nalso puts the shiny\
    \ things on the top of the dress, one by one. \n \nAt night, Sophie finishes the\
    \ dress. She looks at it with pride. It is just like what she thinks—beautiful\
    \ and ready for the show. \nShe can’t wait to see a model wearing it on the runway.\
    \ Sophie smiles, feeling happy and excited about her work as a fashion \ndesigner.\
    \ \nperfect 完美的  fitted top 合身上衣  pick 挑選  soft 柔軟的  high-quality 高品質  sew 縫 \
    \ pride 驕傲"
