  stem: '以往《民法》規定子女從父姓、婚後必須住在夫家等，現在《民法》的規定大不同。下表是比較《民法》修法前後所做的表格，請問何項敘述正確？


    | 比較內容 | 以前的規定 | 現在的規定 |

    | :--- | :--- | :--- |

    | (甲)姓氏 | 子女應從父姓 | 子女應從母姓 |

    | (乙)住所 | 妻以夫的住所為住所 | 夫以妻的住所為住所 |

