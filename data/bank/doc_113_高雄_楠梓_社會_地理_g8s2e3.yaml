  section: 1
  number: 43
  type: single
  page: 1
  stem: 非洲的西部及中部各國內部政治衝突時有所聞，擁有『非洲之鷹』封號的奈及利亞是非洲地區足球常勝軍，國內就有三大民族－豪薩族、約茹巴族及依柏族相互敵對，造成政治不安。請問：造成奈及利亞動亂的主要根源為何？
  options:
  - label: A
    content: 地形崎嶇
  - label: B
    content: 區域發展不均
  - label: C
    content: 天氣太熱脾氣差
  - label: D
    content: 區域劃分不當
