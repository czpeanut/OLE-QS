  type: single
  page: 1
  stem: 根據今年 9 月報導，行動支付平台 M-Pesa 的用戶超過5500 萬人，雄霸非洲行動支付市場，也反映民眾使用手機的生活習慣。下列何者是造成非洲上述現象的主要原因？
