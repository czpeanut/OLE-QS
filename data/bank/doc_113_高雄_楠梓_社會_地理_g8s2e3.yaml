  group_stem: '◎M-Pesa：2007 年推出，只需要一隻2G 的低階手機，就能輕易地以簡訊發送（SMS）的方式，付款給對方。可以進行匯款、轉帳、支付等金融方面交易的行動支付服務。此服務名稱當中，「M」是行動，「Pesa」則代表「錢」。此服務最初是在肯亞當地營運，之後廣泛獲得非洲民眾接受使用，成為最成功的手機平台金融服務之一。請問:'
