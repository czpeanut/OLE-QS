- id: doc_113_高雄_楠梓_社會_地理_g8s2e3_s2_46
  section: 2
  number: 46
  type: single
  page: 1
  stem: 剛果民主共和國蘊藏大量的鈳鉭鐵礦，主要與下列哪一因素有關？
  options:
  - label: A
    content: 板塊與火山運動
  - label: B
    content: 張裂與變質作用盛行
  - label: C
    content: 多沉積岩的地質結構
  - label: D
    content: 古老的結晶岩層
  group_stem: ◎鈳鉭(ㄎㄜ  ㄉㄢˋ) （Coltan）鐵礦是目前全世界爭奪最激烈的電子原料，主要用於製造手機、電玩、電腦及家用電器的電阻器不可或缺的原料。位於非洲中部的剛果民主共和國，鈳鉭鐵礦更佔了世界上的八成。佔據當地的武裝勢力、軍閥，便將這些礦產納為己有，脅迫當地居民採礦、搬運，從中牟取暴利，而這些賺來的錢，唯一的用途便是買武器，以武器脅迫良民、發動戰爭。雖然每50
    公斤的鈳鉭鐵礦可賣得1,300 美元，但剛果礦工卻在徒手開採搬運下，一天僅賺2 美元，讓此礦獲得「血礦」之惡名。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 地理
