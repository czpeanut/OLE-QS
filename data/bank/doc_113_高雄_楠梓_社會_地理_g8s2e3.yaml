- id: doc_113_高雄_楠梓_社會_地理_g8s2e3_s1_44
  section: 1
  number: 44
  type: single
  page: 1
  stem: 「舊鞋救命」是一個臺灣發起的民間組織，主要是捐出家中的舊鞋來幫助非洲地區的孩子，讓他們免於腳上被沙蚤寄生。母沙蚤穿透人體表皮進行寄生與產卵，導致皮膚紅腫潰爛，嚴重時甚至影響性命。感染沙蚤症的病人通常習慣赤腳行走，家中地板或住家附近為沙土路。因此穿上能夠完整包覆腳部的鞋子是最能有效預防沙蚤寄生的方式。根據上述，沙蚤症在非洲奈及利亞盛行的主因為下列何者？
  options:
  - label: A
    content: 當地基礎設施不足，公共衛生差
  - label: B
    content: 母體直接傳染給嬰兒
  - label: C
    content: 當地居民喪禮活動會擁抱或親吻屍體
  - label: D
    content: 喜歡共享食物造成互相傳染
