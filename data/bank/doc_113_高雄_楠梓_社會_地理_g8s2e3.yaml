- id: doc_113_高雄_楠梓_社會_地理_g8s2e3_s1_41
  section: 1
  number: 41
  type: single
  page: 1
  stem: 「赤道雪山」位於漠南非洲的坦尚尼亞和肯亞交界處，距離赤道僅300 多公里，高度為5,892 公尺，山腳的氣溫有時高達29℃，而峰頂平均溫度約為零下12℃，但可能因下雪或強風而下降到零下25℃，故有此稱號。但由於森林砍伐、氣候變遷和全球暖化等原因，該山上的冰雪正在加速融化。按照這個速度，到了2033
    年，山上的絕大部分冰雪都會消失，赤道雪山可能要成為一個過去的傳說了。根據文中內容判斷，「赤道雪山」最有可能是下列哪座山？
  options:
  - label: A
    content: 安地斯山
  - label: B
    content: 喜馬拉雅山
  - label: C
    content: 吉力馬札羅山
  - label: D
    content: 阿爾卑斯山
