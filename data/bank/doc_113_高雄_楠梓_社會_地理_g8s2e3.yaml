  section: 2
  number: 56
  type: single
  page: 2
  stem: 請問西非這些國家由沿海向內陸的氣候型態，依序為圖中何者？
  options:
  - label: A
    content: 甲→丁→乙
  - label: B
    content: 甲→乙→戊
  - label: C
    content: 丙→丁→戊
  - label: D
    content: 丙→丁→乙
  group_stem: ◎象牙海岸、布吉納法索與貝南在法國殖民時期皆有興建鐵路（附圖），獨立後尼日希望鐵路能從布吉納法索的瓦加杜古延伸至尼日的尼阿美，再延伸至貝南，形成西非環線鐵路，但因各國缺乏資金，難以施行計畫。西非各國獨立後經濟發展卻逐漸成為「依賴式經濟」，所謂依賴式經濟是指這些地區大多生產或開採單一物產，並以出口為主，其價格極易受國際市場波動的影響。2018
    年5 月24 日布吉納法索與我國斷交，氣候有乾溼二季，河川呈間歇河狀態，無法航運，亦缺乏水利灌概，農業生產力低落，不易自給自足，而唯一的鐵路是通往象牙海岸。2018
    年時貝南、尼日總統宣布將與中國合作，由中國提供貸款與技術支援，興建貝南至尼日段鐵路，也讓西非環線鐵路不再是空談。請問：
