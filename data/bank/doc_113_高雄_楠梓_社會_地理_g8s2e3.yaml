  section: 1
  number: 42
  type: single
  page: 1
  stem: '非洲是全球經濟成長速度飛快的地區，過去十年的GDP 平均成長率高達5.5%。Facebook、Google、Uniqlo、騰訊等跨國企業，都在非洲布局創投或直接建廠。請問：各企業公認目前非洲現存的有下列哪些經濟優勢？

    (甲)人口紅利優勢；(乙)技術性人才；(丙)豐富的農礦原料；(丁)健全的殖民地式經濟；(戊)龐大的市場潛力。'
  options:
  - label: A
    content: 甲乙丁
  - label: B
    content: 甲丙戊
  - label: C
    content: 乙丙戊
  - label: D
    content: 丙丁戊
