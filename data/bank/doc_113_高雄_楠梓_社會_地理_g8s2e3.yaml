- id: doc_113_高雄_楠梓_社會_地理_g8s2e3_s2_49
  section: 2
  number: 49
  type: single
  page: 1
  stem: 依據文中所述，東非國家得以成為歐洲花卉的供應地，具有諸多優勢。請問：這些優勢並不包括下列何者？
  options:
  - label: A
    content: 接近市場減少碳排放
  - label: B
    content: 交通運輸設備革新
  - label: C
    content: 氣候涼爽適合種植
  - label: D
    content: 充足且廉價的勞力
  group_stem: ◎從婚喪喜慶到人情送禮、感情表達都有花卉的蹤影。世界最大阿斯梅爾鮮花拍賣市場（Flower Auction Aalsmeer），全球最大宗花卉買家位於歐盟和美國，最大的花卉產地則來自南美及非洲，以東非的肯亞與衣索比亞最具盛名。英國曾於2009
    年以「榨乾肯亞的血玫瑰」為題，呼籲歐洲各國對肯亞花卉產業造成的各項問題，給予關注並解決。包括灌溉、肥料、農藥、汙水處理造成的環境衝擊，產銷通路必須透明化以達成公平交易，使農民獲取合理收益，以及英國脫歐後，如何訂定新的協議等。由於花卉是高價值經濟作物，一收成就要馬上包裝運輸，全程須低溫、保溼，具高度時效性。肯亞首都奈洛比的機場甚至有一整個航站完全用於輸送花卉，可避開繁忙的阿姆斯特丹機場，頗具優勢。但運輸過程所產生的碳排量，卻成為另一項新的課題。下次買花時不妨留意一下產地，了解一下你手中的鮮花到底到底經歷多少旅程與冒險。
  tags:
    chapter:
