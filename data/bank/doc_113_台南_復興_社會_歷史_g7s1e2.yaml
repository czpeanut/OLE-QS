  stem: 右表為臺灣原住民族曾遇過的外來政權，請問：表中甲、丙兩個政權分別為何？
  group_stem: '(一)艾莉在整理歷史課的筆記，發現臺灣在十七世紀，曾有不同的外來政權與原住民產生互動，她將吸收到的知識做成右表。


    | | 對待原住民的方式 | 勢力範圍 |

    |---|---|---|

    | 甲政權 | 先武力征服，後用宗教教化 | 以現今臺南地區為主，向北拓展 |

    | 乙政權 | 以武力降服，並宣揚宗教信仰 | 臺灣北部 |

    | 丙政權 | 先武力征服，並推行漢化 | 臺灣中南部 |'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
