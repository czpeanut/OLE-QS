- id: doc_113_台南_復興_社會_歷史_g7s1e2_s1_30
  section: 1
  number: 30
  type: single
  page: 1
  stem: 清代臺灣行政區劃的變更，主要是因為發生民變或受外力入侵後，基於治安、國防需要，才陸續增設。請問：在清帝國時期的臺灣行政區中，何者自康熙到嘉慶年間始終存在？
  options:
  - label: A
    content: 諸羅縣
  - label: B
    content: 鳳山縣
  - label: C
    content: 彰化縣
  - label: D
    content: 淡水廳。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
