  section: 1
  number: 33
  type: single
  page: 2
  stem: 古蹟的保存，使後人可以從其保留下來的物件中，去感受當時的重大變遷或現象。基隆的「海門天險」與臺南的「億載金城」均為國定古蹟，這兩處古蹟的興建，反映當時有下列何種需求？
  options:
  - label: A
    content: 進行開山撫番
  - label: B
    content: 杜絕外力侵擾
  - label: C
    content: 防止百姓械鬥
  - label: D
    content: 掃蕩反清勢力。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_台南_復興_社會_歷史_g7s1e2_s1_34
  section: 1
  number: 34
  type: single
  page: 2
  stem: 「1884年，這位清帝國官員奉派來臺籌辦軍務，之後並著手相關建設，但因受限於財政條件缺乏，只能先開辦基礎建設並增加稅收。他動用大批軍力繼續『開山撫番』，清丈全臺田賦，以期就地為防務及新政開拓財源。然而，在推行這些新政的過程中，因財政負擔大增，或政策規劃欠妥、官員貪污等問題，引發人民反抗。不久，他被迫去職，結束在臺六年的治理。」下列對這位官員與他推動的建設之描述，何者正確？
  options:
  - label: A
    content: 他是沈葆楨，來臺協防後，成為臺灣首任巡撫
  - label: B
    content: 他興建西部縱貫鐵路
  - label: C
    content: 他修築三條通往東部的道路
  - label: D
    content: 他在臺北府成立郵政總局。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
