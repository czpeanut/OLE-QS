  section: 1
  number: 28
  type: single
  page: 1
  stem: 荷蘭聯合東印度公司與鄭氏政權先後在臺展開統治，請問：這兩個政權經營臺灣的方式，有何相似之處？
  options:
  - label: A
    content: 均以派軍人屯墾的方式開發土地
  - label: B
    content: 皆對原住民宣揚基督教的福音
  - label: C
    content: 皆從中國轉運香料到東南亞
  - label: D
    content: 均重視對日本與東南亞的貿易。
