- id: doc_113_台南_復興_社會_歷史_g7s1e2_s1_29
  section: 1
  number: 29
  type: single
  page: 1
  stem: 劉銘傳治臺時，曾經大力推行許多現代化建設。而當時住在臺北的居民，可能會有怎麼樣的生活經驗？
  options:
  - label: A
    content: 打電報給在臺南的親友
  - label: B
    content: 坐火車到臺中遊覽
  - label: C
    content: 曾目睹西班牙人占領臺灣北部
  - label: D
    content: 禁止進入原住民居住的地區。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
