- id: doc_113_台南_復興_社會_歷史_g7s1e2_s1_32
  section: 1
  number: 32
  type: single
  page: 2
  stem: 清帝國初期，對閩粵移民渡臺抱持禁止的態度，但來臺移民仍源源不斷，因而出現以下的政策與報告。(甲)應當廢除渡臺禁令，進一步開闢臺灣後山，放寬漢人進入番界的限制；(乙)噶瑪蘭地區因漢人移居增加與海盜問題，建議設置治理單位；(丙)在諸羅縣境內另設新縣，割舊虎尾溪以北、大甲溪以南之地，增設彰化縣。上述三個政策，若依實施的時間先後排序，何者正確？
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙甲丙
  - label: C
    content: 丙乙甲
  - label: D
    content: 甲丙乙。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
