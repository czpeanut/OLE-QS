- id: doc_113_台南_復興_社會_歷史_g7s1e2_s1_23
  section: 1
  number: 23
  type: single
  page: 1
  stem: 鄭氏在臺期間規劃了許多措施，對臺灣的發展影響深遠。下列有關鄭氏的經營，何者敘述正確？
  options:
  - label: A
    content: 設立西式炮臺，鞏固沿海防禦力
  - label: B
    content: 推行開山撫番，征討中部原住民勢力
  - label: C
    content: 積極發展國際貿易，輸出茶、糖、鹿皮
  - label: D
    content: 與英、日通商，取得所需要的軍用物資。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
