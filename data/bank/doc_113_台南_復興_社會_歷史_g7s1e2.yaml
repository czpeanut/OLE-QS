  section: 1
  number: 25
  type: single
  page: 1
  stem: 乾隆10年起，官員奏准的邊防改革，包括撥派熟番協守沿山隘口，並設置望樓，由熟番與漢民輪流巡邏。圖(二)是乾隆年間《重修鳳山縣志》「縣境南界圖」之局部，以此判斷，圖中「隘口」、「望樓」的設置目的應為下列何者？
  options:
  - label: A
    content: 實施開山撫番促進漢原互動
  - label: B
    content: 預防移民發起抗官事件
  - label: C
    content: 查驗渡臺者是否領有許可證
  - label: D
    content: 避免漢人與原住民接觸。
