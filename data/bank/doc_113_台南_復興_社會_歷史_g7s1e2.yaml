  section: 1
  number: 27
  type: single
  page: 1
  stem: 臺灣進入大航海時代後，原住民受到外來勢力的入侵，改變了他們原有的生活型態。請問：在面對外來勢力的衝擊，下列哪個原住民族受到的影響比較小？
