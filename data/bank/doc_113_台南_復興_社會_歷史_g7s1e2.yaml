  section: 1
  number: 22
  type: single
  page: 1
  stem: 圖(一)是十七世紀開始，臺灣西南部人民所使用的文字形式，其內容是《馬太福音》的第一章第一節，譯文為：「亞伯拉罕的後裔，大衛的子孫，耶穌基督的家譜。」請問：下列哪份史料最有可能使用這種形式的文字書寫？
  options:
  - label: A
    content: 十七世紀西班牙在臺傳教所用的《聖經》
  - label: B
    content: 十七世紀聯合東印度公司從巴達維亞寄往大員的書信
  - label: C
    content: 十八世紀原住民與漢人簽訂的土地買賣契約
  - label: D
    content: 十九世紀傳教士馬偕創辦學校裡所使用的教材。
