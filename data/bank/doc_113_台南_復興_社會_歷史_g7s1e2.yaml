- id: doc_113_台南_復興_社會_歷史_g7s1e2_s1_19
  section: 1
  number: 19
  type: single
  page: 1
  stem: 清政府為了打擊某一勢力，曾在中國東南沿海實施長達20多年的遷界令，如1661年強令沿海居民內遷三十里，1664年再下令內遷三十里，且原有村莊、田宅皆須燒棄，直到1683年康熙皇帝才下令廢除遷界令，正式展開並恢復海運、漁業。根據上述內容判斷，清政府實施遷界令與下列何者有關聯？
  options:
  - label: A
    content: 防止倭寇劫掠東南沿海
  - label: B
    content: 切斷鄭氏糧食補給資源
  - label: C
    content: 避免荷蘭再度強占澎湖
  - label: D
    content: 配合日本鎖國政策。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_113_台南_復興_社會_歷史_g7s1e2_s1_20
  section: 1
  number: 20
  type: single
  page: 1
  stem: 十九世紀後期，某國軍隊在攻佔基隆後，遲遲無法攻下淡水，於是改變戰略——封鎖臺灣周邊海域，導致臺灣熱銷商品茶葉和樟腦無法出口。但隨著某國在越南與臺海戰事的受挫，他們只能攻佔澎湖作為軍艦封鎖海域的指揮中心。最後某國在衡量情勢後，解除封鎖，並與清帝國簽訂條約，結束這場戰事。請問：上述攻占基隆的應該是哪個國家？
  options:
  - label: A
    content: 日本
  - label: B
    content: 西班牙
  - label: C
    content: 法國
  - label: D
    content: 荷蘭。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
