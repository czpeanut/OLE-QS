- id: doc_113_新北_丹鳳_英語_g9s1e3_s6_43
  section: 6
  number: 43
  type: single
  page: 5
  stem: 43. What is the best title of this article?
  options:
  - label: A
    content: Who Wants to Be a King
  - label: B
    content: The Frogs Who Asked for a King
  - label: C
    content: God Doesn’t Know Who Is the Best King
  - label: D
    content: Who Likes April Fool’s Day
  group_stem: '(4)

    The frogs hoped they could have a king, just like the bees and the ants. The king
    could keep them busy doing something together. They thought that they did nothing
    but sit around croaking every day just because they had no king. They kept talking
    to God about asking for a king.

    God said, “What a fool the frog is!” To keep them quiet and make them think they
    had a king, he threw down a giant log, which fell into the water and made a big
    sound. The frogs felt scared and hid behind the grass. They thought their new
    king was a terrible guy. But they soon found how friendly the king log was. In
    a short time, the younger frogs used “him” for a jumping place. The older frogs
    made “him” a meeting place on which they complained loudly to God about the new
    king.

    To teach the frogs a lesson, God now sent a crane to be the king of the Frog-land.
    The crane flew down. He ate the poor frogs right away and left.

    Now, the frogs understood that they made a very big mistake. All of the frogs
    prayed loudly again for God to take away the terrible king before they were all
    eaten up.

    "What!" cried out God, "Are you never satisfied? You already got the thing that
    you asked for. You shouldn’t want more"


