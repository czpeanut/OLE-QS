- id: doc_113_新北_丹鳳_英語_g9s1e3_s6_40
  section: 6
  number: 40
  type: single
  page: 4
  stem: 40. What does “ catharsis” mean“?
  options:
  - label: A
    content: The thing that can make people rich.
  - label: B
    content: The thing that can make people feel better.
  - label: C
    content: The thing that can make people thank more.
  - label: D
    content: The thing that can make people think a lot.
  group_stem: '(3)

    If sad movies only make people sad, why do they still go to the theater for enjoying
    the movies? It is believed that sad stories have the power of “ catharsis”.

    It can take away the sadness and make people feel better. This release of sadness
    usually can improve people’s spirits and then the sadness will disappear little
    by little. What’s more, the energy that has been brought away by sadness can come
    back. Then the sad people can start to resolve their trouble.

    Besides, sad movies make us know what will happen before we really meet the trouble
    by ourselves. When we see the sad movies, we can experience the trouble as the
    characters do in the movies. That can make us think a lot. We can prepare for
    the trouble in the future, at least in our minds.

    The sad movies can make us thankful for all we have now when we saw the character
    in the movie have a worse life than us.

    With some good things that sad movies bring, next time when you feel down, you
    can try to watch sad movies and feel the power of catharsis that the movies provide.


    release 釋放  spirits 精神  energy 能量  resolve 解決'
