  stem: 36. What’s true about Rachmaninoff ?
  options:
  - label: A
    content: He didn’t know how to play the piano.
  - label: B
    content: He could play the piano with covering his eyes.
  - label: C
    content: He was good at playing the piano.
  - label: D
    content: He liked to lie ahead of the piano in the party.
  group_stem: '(1)


    Rachmanioff was a very famous piano-player. He liked to tell this story about
    himself.

    “When I was a little boy. One day, I performed at a party for a nobleman. I was
    only eight years old then. But I have played the piano for several years. And
    I played it very well, especially the music by Beethoven.”

    But in his music, as you know, there are several very long rests. During each
    of these rests, I put down my hands from the piano and waited. To me, this was
    my special style. However, it appeared that the mother of the nobleman thought
    in another way. Finally, during one of these rests, she came over to me. She touched
    me on the head kindly and said, “My boy, why don’t you play something that you
    know.”


    nobleman 貴族  especially 尤其是'
