  type: single
  page: 1
  stem: 依據上文敘述，有關我國選舉權的年齡議題，下列何者正確？【習作】
  options:
  - label: A
    content: 依據我國憲法規定，凡是中華民國國民都有選舉權
  - label: B
    content: 為與多數民主國家接軌，我國投票年齡應維持在20 歲
  - label: C
    content: 為擴大參政權基礎，促進青年參政，投票年齡愈大愈好
  - label: D
    content: 我國國民素養提升，為符合社會現狀，投票年齡應下修至18 歲
  group_stem: '36-37 為題組。請閱讀下列文章，回答36-37 題。


    全球民主國家中，僅剩少數國家投票年齡仍維持在20 歲以上。我國憲法明定，「中華民國國民年齡滿20 歲者，有依法選舉之權」，現行規定已超過70 年未修改，與現今多數民主國家年滿18
    歲即可行使投票權的趨勢不符。為擴大參政權基礎，促進青年參政，立法委員提出修憲。臺灣青年民主協會理事長指出，我國已多次透過選舉選任總統、縣市長等，已具備成熟民主制度，且教育普及、科技發達，社會型態有別過往，國民民主素養不可同日而語，因此對於公民選舉的年齡限制，實應下修以符社會狀況。

    (資料來源：改寫自關鍵評論，立法院一讀通過國民黨「18 歲投票，20 歲被選舉」修憲案，各政黨也有各自版本，2020/03/27)'
  answer:
  - D
  answer_source: answer_key_vlm
