  stem: '公民老師打算週末要去看一場電影，正考慮看哪部影片時，看到一部影片很吸引人，以下是這部影片簡介：


    在戰爭期間，德國商人辛德勒原本為了省成本，而僱用較廉價的猶太勞工。他的工廠生產軍用品，因為戰爭而大發橫財，但直到親眼目睹猶太人慘遭大屠殺，而自己工廠的勞工一夕之間全消失，才驚覺納粹黨濫殺無辜的行為，於是他決定幫助受苦的猶太人，他的工廠因此成為當時猶太人的避難所。最後他耗盡所有財產，拯救了約1,100
    名猶太人。


    上述影片中的辛德勒在目睹屠殺後，轉變為以救人為志業，正說明下列何種理念？【習作】'
  options:
  - label: A
    content: 不論是哪一種種族，人的生命是平等的
  - label: B
    content: 以性別為區分，各性別的人都應受到尊重
  - label: C
    content: 人的財富可以兌換生命，財富愈多，壽命愈長
  - label: D
    content: 大屠殺的發生會造成工廠虧損，為了減少虧損必須要救人
  answer:
  - A
  answer_source: answer_key_vlm
