  section: 3
  number: 45
  type: single
  page: 5
  stem: 在臺灣，像阮國非這樣的外籍移工，據政府統計逾七十萬名，這些外籍移工在工作或居住的地區會聚集成互相打氣、免於思鄉之情的團體，其所形成的文化，可用下列哪個概念稱之？
  options:
  - label: A
    content: 強勢文化
  - label: B
    content: 次流文化
  - label: C
    content: 次文化
  - label: D
    content: 主流文化
  group_stem: '2017 年發生的「阮國非事件」轟動全台。5 年後，就在世人快淡忘這個事件時，導演蔡崇隆決定在大銀幕上還原事發現場，推出電影作品《九槍》，且他用的方式非常直接──公開警方密錄器內容給大家看。

    當時27 歲的越南失聯移工阮國非吸毒飲酒後，在新竹縣鳳山溪畔損毀民眾的小貨車、機車，年輕員警陳崇文與兩位民防獲報到場圍捕，阮國非心生恐懼之下以石塊丟擲對方、甚至一度打開警車車門試圖進入車內。陳崇文為了阻止阮國非，以警用手槍朝他連續射擊9
    發子彈，阮國非身中多槍後送醫不治死亡。

    當一般人對失聯移工貼上標籤，曾為記者目前身為導演的蔡崇隆歸納過往採訪經驗指出，那些跑到山邊海角的移工，往往是受到高額仲介費的剝削，想要儘早還債擺脫財務壓力、支持家計；另外，不能自由轉換雇主，也讓他們難以脫離不善待勞工的老闆，若想自由只能跑。「標籤本身對他們不公平，跑給警察追，也是不得已的，他們跑掉只是為了賺更多錢，不是作奸犯科。」

    曾獲金馬獎最佳紀錄片的導演蘇哲賢，將阮國非案改編為短片《九發子彈》，他在專訪中提到自己對於此事的論點，認為「殺死阮國非的，不是那九發子彈，而是我們的意識形態。」意即是存在於臺灣人潛在意識裡的歧視允許陳崇文開槍，「如果阿非是一個金毛的外國人，你會射他嗎？」，這是《九發子彈》中主角阿非的義務律師質問開槍員警的話，也是真實事件裡擔任阮國非家屬律師的邱顯智曾問過陳崇文的問題，導演蘇哲賢認為如果今天是白人那麼結果可能就不一樣了。'
