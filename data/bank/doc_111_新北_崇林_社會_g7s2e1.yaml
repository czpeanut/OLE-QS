  number: 2
  type: single
  page: 1
  stem: 西元1896 年，日本國會通過並公布《法律第六十三號》(簡稱六三法)，六三法第一條：「臺灣○○在其管轄區域內，得發布具有法律的效力之命令」，簡單來說就是賦予○○「律令制定權」，請問○○應該是下列何人？
  options:
  - label: A
    content: 總督
  - label: B
    content: 保正
  - label: C
    content: 甲長
  - label: D
    content: 警察。
