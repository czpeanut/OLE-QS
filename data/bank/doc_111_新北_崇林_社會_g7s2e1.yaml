  section: 3
  number: 50
  type: single
  page: 5
  stem: 對於文化差異，我們「不應」有以下何種觀念？
  options:
  - label: A
    content: 差異即為不一樣，所以要消除差異才不會有衝突出現在
  - label: B
    content: 文化不該由其他文化觀點來判斷，只有從該文化本身的標準及價值出發，才能了解其全貌
  - label: C
    content: 每個文化都是特定時空環境與特定人群交互影響下的產物，都應獲得尊重和保護
  - label: D
    content: 多多了解，才能避免不必要的紛爭與誤解
