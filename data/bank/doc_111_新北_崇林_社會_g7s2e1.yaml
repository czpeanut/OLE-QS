  type: single
  page: 1
  stem: 第一次世界大戰結束後，帝國主義國家多遭逢殖民統治的困境，其中包括如何面對殖民地蓬勃發展的民族運動，以及如何繼續利用殖民地的資源以擴張經濟。請問：針對上述局勢，當時的統治者在臺灣採取下列何項措施？
