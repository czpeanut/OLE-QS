  page: 1
  stem: 【圖一】是1924 年，日本國內及其統治下的朝鮮、臺灣，每名警察的管轄人數。請問：臺灣警察管轄人數較少的原因為何？
  options:
  - label: A
    content: 因為臺灣總人口數較少，所以警察所管轄的人數也較低
  - label: B
