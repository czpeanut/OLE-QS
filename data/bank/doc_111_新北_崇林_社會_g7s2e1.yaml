- id: doc_111_新北_崇林_社會_g7s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 西元1895 年，臺灣民主國《臺民布告》：「我臺灣隸大清版圖二百餘年。近改行省，風會大開，儼然雄峙東南矣。乃上年日本肇釁，遂至失和。……今已無天可籲，無人肯援。臺民惟有自主，推擁賢者，權攝臺政。事平之後，當再請命中國，作何辦理。倘日本具有天良，不忍相強，臺民亦願顧全和局，與以利益。」請問：下列關於「臺灣民主國」的敘述何者「正確」？
  options:
  - label: A
    content: 《臺民布告》的公告是因為牡丹社事件造成臺灣、澎湖被割讓
  - label: B
    content: 臺灣民主國成立是因為臺灣人民想要建立現代民主共和國
  - label: C
    content: 臺灣民主國由巡撫唐景崧與士紳丘逢甲等人成立
  - label: D
    content: 《臺民布告》發布後，臺灣成功擺脫日本殖民統治。
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 歷史
      code: 1-1
      title: 殖民體制的建立
      chapter: 第1章 日治時期的政治
    textbook: 七下歷史 1-1 殖民體制的建立
    labeled_by: ai
- id: doc_111_新北_崇林_社會_g7s2e1_s1_2
