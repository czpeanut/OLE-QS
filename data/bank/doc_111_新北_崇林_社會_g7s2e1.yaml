  number: 5
  type: single
  page: 1
  stem: 臺灣新文學之父賴和《不如意的過年》：「查大人這幾日來總有些憤慨。因為今年的歲暮，照例的御歲暮(禮物)乃意外減少，而且又是意外輕薄。……查大人憤憤之餘，似覺有恢復他的威嚴的必要，這是就這幾日來對於〈行商人取締的峻嚴，一動手就是人倒擔頭翻；或是民家門口，早上慢一點掃除，就被告發罰金；又以度量衡規矩的保障，折斷幾家店舖的『稱仔』。〉」請問：賴和筆下的「查大人」應該是下列哪種身分的人？
