  section: 1
  number: 4
  type: single
  page: 1
  stem: 日治初期，總督府因鎮壓抗日分子支出浩繁，日本逐漸認為殖民臺灣是一種負擔，國會也出現以一億日圓將臺灣賣給法國的《臺灣賣卻論》。請問：後來總督府採取了哪些措施，使得臺灣財政收入提高，減少日本的經濟負擔？(甲)樟腦專賣
    (乙)廣設郵電通訊 (丙)鴉片專賣 (丁)土地與林野調查 (戊)修築縱貫鐵路
  options:
  - label: A
    content: 甲丙丁
  - label: B
    content: 甲乙戊
