  group_stem: '新北市平溪區每年元宵節舉辦平溪天燈節，與臺南鹽水蜂炮齊名，素有「北天燈、南蜂炮」之稱。此節日深受國內外觀光客歡迎，曾被Discovery
    頻道及CNN 等國外媒體選為「全球必去節慶之一」。

    2023 年新北市平溪天燈節共舉辦2 場大型天燈施放活動：2/5 在十分廣場是以「愛在元宵兔給樂」為主題，有百盞以上的四呎兔影天燈供民眾施放；2/11 元宵節當天在平溪國中則是以「情定平溪Yes,
    I do.」為主題，用巨型愛心造型的天燈營造情人節浪漫氛圍。想要參與平溪天燈節，可在活動當天到會場排隊領取天燈施放券，新北市警局交通大隊表示活動期間將實施交通管制，呼籲參加民眾多利用接駁公車和大眾運輸工具。

    傳統天燈底座是以竹筐及鐵線構置而成，但每個月至少三萬盞天燈燃放可能帶來環境負荷與火災隱憂，對水質、森林、野生動物棲息地產生一定影響。然而回收一個傳統天燈可換八元，在當地從五、六歲的孩子到八、九十歲都是依靠回收天燈及觀光維生（據統計天燈回收率高達95%）。有些人卻還是認為：「天燈這麼不環保，禁放就好啦！」，這麼做無疑是造成在地與環境更多的衝突。因此後來有一群交大畢業生集資研發環保天燈，是由紙漿製成的底座，一個售價約350~400
    元（傳統天燈一個150 元），另外，還有數位LED 許願天燈，民眾能將寫在明信片上的內容交由工作人員掃描後，就可以在數位天燈升空。

    天燈被稱作「孔明燈」，據說是在三國時代諸葛亮為了傳遞軍中訊息所製作，之後，天燈文化也被惠安胡氏家族帶入十分寮，為防止強盜侵擾，放天燈也開始有警示、報平安等作用。泰國也有類似平溪的天燈節，但在意義上，臺灣會在天燈寫上祝福和願望，因為臺灣人相信天燈會把願望送到天堂；泰國的天燈（泰文是Khom
    Loi)是用來把問題和煩惱送走，一般不會在上面寫東西。'
