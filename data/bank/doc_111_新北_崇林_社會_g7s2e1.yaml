  stem: 《南進台灣：國策記錄映画》為總督府於1939 至1940 年間，為了宣傳日本統治臺灣成為「南國的夢想寶島」所拍攝的紀錄片，影片介紹到中南部時提出日本建設許多輔助工業的設施，如：港口、大圳及電力所，提供水、電力等基礎能源。請問：水力、電力等基礎能源建設是為了配合哪一個政策？
