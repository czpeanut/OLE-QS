- id: doc_111_新北_崇林_社會_g7s2e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 日治時期擔任民政局長的後藤新平認為治理臺灣需要採取「生物學原則」—先了解臺灣人的習性，再訂出一套管理辦法，因此成立「臨時臺灣舊慣調查會」調查台灣人的舊有習慣。有人稱讚他奠定日後臺灣發展基礎、也提高人民的生活水準，但是也有人批評他發布的「匪徒刑罰令」以極為嚴厲的手段鎮壓武裝抗日。請問：後藤新平為了有效治臺，推動舊慣調查的目的有哪些？(甲)保存良善制度
    (乙)訂定治臺政策 (丙)推行日本制度 (丁)禁絕舊有習慣
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙丙丁
  - label: C
    content: 甲乙丁
  - label: D
    content: 甲丙丁。
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 歷史
