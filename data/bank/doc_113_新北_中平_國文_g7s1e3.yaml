    content: 武陽君「惡」殺生：害怕
  - label: B
    content: 鳥巢「去」人太遠：距離
  - label: C
    content: 而能「馴擾」：騷擾
  - label: D
    content: 信「於」異類也：在
  group_stem: '（二）

    【甲】

    吾昔少年時，所居書室前，有竹、柏、桃、雜花，叢生滿庭，眾鳥巢其上。武陽君惡殺生，兒童婢僕，皆不得捕取鳥雀。數年間，皆巢於低枝，其鷇可俯而窺也。又有桐花鳳四五，日翔集其間，此鳥羽毛至為珍異難見，而能馴擾，殊不畏人。閭里間見之，以為異事。此無他，不忮之誠，信於異類也。有野老言：「鳥巢去人太遠，則其子有蛇、鼠、狐、貍、鴟、鳶之憂；人既不殺，則自近人者。欲免此患也。」由是觀之，其時鳥雀巢不敢近人者，以人為甚於蛇鼠之類也。「苛政猛於虎」，信哉！

    （蘇軾記先夫人不殘鳥雀）

    武陽君：蘇軾的母親。

    鷇：ㄎㄡˋ初生的小鳥。尚須由母鳥餵哺之幼鳥。

    閭里：ㄌㄩˊ ㄌㄧˇ鄉里，泛指民間。

    不忮：指不嫉妒。忮，ㄓˋ嫉妒。

    苛政猛於虎：比喻繁苛殘酷的政令比老虎還凶猛可怕。


