  group_stem: '（四）

    走進《大美不言》典藏精粹特展

    梵克雅寶X 國立故宮博物院X 巴黎裝飾藝術博物館by La Vie 2024-10-29

    「天地有大美而不言，四時有明法而不議，萬物有成理而不說。」《莊子．知北遊》中曾如此寫道，而在千年後的如今，百年珠寶品牌梵克雅寶（Van Cleef & Arpels）也攜手國立故宮博物院、巴黎裝飾藝術博物館（Musée
    des Arts Décoratifs），以《大美不言》為名，展演共逾260 件不言而喻的大美之作，2024 年9 月26 日至12 月29 日於故宮北院展出；2025
    年1 月23 日至4 月20 日，移師至嘉義故宮南院展出。

    為了讓更多人沉浸在裝飾藝術超越時空的魅力裡，耗時七年策劃的《大美不言》典藏精粹特展，帶來包含陶瓷、玉石、傢飾、瓷器、服飾、雕塑、平面藝術、珠寶與鐘錶等共逾260
    件裝飾藝術巨作，並將全展分為「自然萬物」、「動靜有形」、「奇幻仙境」、「神祕莫測」和「五彩繽紛」五大主題，邀請人們悠遊自然與仙境，也穿越古今，一窺古往今來最傑出的匠人、設計師、藝術家如何窮究複雜工藝、虔心藝術創新，開創出一件件令人屏息的曠世之藝。而在眾多展品之中，最受矚目的藝術瑰寶當屬國立故宮博物院典藏的〈洋彩玲瓏轉旋瓶〉、〈雕橄欖核舟〉；巴黎裝飾藝術博物館的〈布洛瓦帶蓋長頸壺〉、〈百花香花瓶〉以及由Van
    Cleef & Arpels 梵克雅寶典藏的〈Zip〉項鍊和〈Varuna 遊艇〉。'
