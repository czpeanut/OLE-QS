  stem: '依照展覽訊息作成筆記，以下說明何者錯誤？

    | (Ａ)展覽標題 | 以莊子的名言「大美不言」為展覽標題，詮釋大自然的美麗事物，對應展品物件之美，將給予參訪者帶來無垠想像、不言而喻 |

    | :--- | :--- |

    | (Ｂ)展覽地點 | 2024 年9 月26 日至12 月29 日於嘉義故宮南院展出；2025 年1 月23 日至4 月20 日，移師至故宮北院展出 |

    | (Ｃ)展覽主題 | 分為「自然萬物」、「動靜有形」、「奇幻仙境」、「神祕莫測」和「五彩繽紛」5 大主題 |

