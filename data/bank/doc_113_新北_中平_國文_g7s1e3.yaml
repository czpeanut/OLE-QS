    很小的時候，阿姨總叮嚀我：「只要乖，媽媽就會在半夜，從天上來跟夢中的你說話……」阿姨說得都是真的，從小到大，只要我聽話，媽媽三不五十就會到我床前來。天上的媽媽總是在很深的黑夜裡，沿著天梯而下，而且很快就在我眼前，媽媽知道我想她，她會摸摸我的頭，然後像很多媽媽一樣抱著我或者拍拍我的背，她也會哼著搖囝仔歌，「嬰啊嬰嬰睏，一暝大一寸。嬰啊嬰嬰惜，一暝大一尺」、「搖啊搖、惜啊惜」，跟阿姨一樣唱得很好聽，可是一醒來就什麼都沒有了。媽媽那麼好聽的聲音，如果能餘音繞樑，那該多好。媽媽哼哼唱唱的嘴型我記得，聲音就模模糊糊，始終抓不準。愈長愈大，媽媽就愈少進入我的夢鄉了。

    每天早上起床，當我打開眼睛的第一刻，我總是不自覺的走到書桌面前，去看一看這位天下最美麗女人的照片。媽媽年輕清純，秀髮披肩，眼窩深邃，兩顆秋水般的眼眸像射出的箭，高雅的氣質很吸引人；樱桃小嘴，笑起來兩邊嘴角微微上挑，齒如白貝，十分優雅；鵝形略大的臉樣兒，搭上平整的鼻面，自然透露著良善的溫柔。阿姨說媽長得漂亮，這是千真萬確的。……這張老照片歷歷分明，逼在眼前，可是她又是多麼遙遠；這張照片清朗明麗，多麼具體，可是她又是多麼的不真實……

    在一個偶然的機會，我來到了人間生命的工廠。依稀彷彿聽到別人的媽媽，正在為新生命的誕生而備受煎熬。有的在呻吟、有的在痛哭、有的在哀號、有的在漫罵──「都是你害的……」，聲聲動人心扉，哪一個聲符最像您，您能告訴我一聲嗎？媽媽，你是聽見我哇哇大哭後才放心走的呢？還是模模糊糊中離開人間？

    我可以想像得到：當天下的媽媽，在經過人間最大的痛苦之後，就為家人帶來了笑聲，帶來了生命的喜悅，成就了天倫之樂，同時也偉大了自己。

    不幸的是，媽媽！十八年前當我這個新生命呱呱落地的那一刻，卻也是媽媽你結束人生的一刻。媽媽！我這個從小就沒娘的孩子，對你有好深好深的歉意。如果沒有我的來到人間，也許你就不用賠上一條無辜的生命。

    媽媽！可是我總是比別人少了一個母親。媽媽，你知不道，我已經十八歲了，這十八年來我想看的看不到，我想聽的聽不著，這一趟是最接近你的一刻，但是，我依然落空了。此時此刻，忽然間我有一個強烈的渴望，如果可以，我真的好想好想……結結實實的聽一次……媽媽的聲音……。


    我焦急地打手機給資優班導師：

    「蠟黃母親不在了？」

    「是，聽說生他難產，走了！」

    「父親呢？」

    「他很小就不在了。」

    「跟誰住？」

    「阿公、阿嬷、還有沒嫁人的阿姨。」

    「他洗腎多久了？」

    「來建中前就有了。」

    記得當時，蠟黃我教了近三年，都快畢業了，文章寫不長，很少超過四百字，作文分數也沒有上過七十分，唯一的印象是他始終沒遲交缺交過作業。我為我的小器與對他的冷落，十分自責。

    第二天我急急把他喚到走廊。

    「蠟黃，你很能寫文章。以後可以遲交，補交也不扣你分。」

    「老師我真的很不會寫作文，可是媽媽我很愛寫。」

    冬陽陰弱，我近乎枯竭的老淚，正七彩沸騰中。

    「你娘一直都在，你聽得到她的聲音。」我拍一拍他羸稚的肩膀。

    他笑得快哭了，蠟黃的兩排牙也是蠟蠟黃黃地。

    （林明進媽媽的聲音）'
