  stem: 依照上文，以下何者敘述正確？
  options:
  - label: A
    content: 〈聲音──一次聆聽聲音的感受〉一文作者蠟黃為洗腎的資優生，旨在表達對母親的舐犢情深
  - label: B
    content: 〈聲音──一次聆聽聲音的感受〉一文作者運用了夾敘夾議法，說明「樹欲靜而風不止，子欲養而親不待」的道理
  - label: C
    content: 〈媽媽的聲音〉一文作者是蠟黃的班導師，師生之間經常相互問答，情誼深厚，令人動容
  - label: D
    content: 〈媽媽的聲音〉一文作者為老師，透過一次作文的批改經驗呈現蠟黃勇敢面對失怙失恃，默默承受身心磨難的形象
  group_stem: '（三）

    我教過一位洗腎的資優生，臉色蠟黃，個兒萎頓瘦弱，洗腎洗出他的堅韌與勇銳。蠟黃是他的綽號，每周上醫院洗三次，同學笑謔說他：「你連心都洗得乾乾淨淨了。」他不以為忤。跟他熟要到高三以後，印象中沒別的，只有他沒缺交過作文。

    資優班一班只有三十人，個個都有來頭，頭上都閃著奧林匹亞金牌的光芒，數理化生物資訊地科，十八般武藝都有高手，蠟黃的成績較弱，國文亦然，他的專長在電腦資工。導師說蠟黃洗腎時間長，很耗精神，要我作業給他寬緩些。老夫規定作文遲交扣五分，紅樓才子沒放在眼裡，蠟黃卻從不缺交作業。

    印象中他不太能寫，文章寫不動，字數也多不起來，蠟黃蠟了兩年半依舊黃，我沒特別跟他深談，人家作文都準時交了，你還想怎樣？

    高三上，我出了一個作文題目「聲音」，副標題──「一次聆聽聲音的經驗」或「一次聆聽聲音的感受」。資優生們意興闌珊，普遍寫得不理想。我狠狠面斥他們一頓：「上天是公平的，給你們數理『資優』，就給你們作文『資憂』！」老夫下令重寫，才子們吐大氣，心沉了下來。

    湊巧熟識某私人婦產科醫院院長，喬了半天，勉強同意我安排一個校外教學，讓學生在待產室外，隔著門聽一聽孕母待產的聲音，自以為是個特殊的經驗，學生會喜歡。四個四個很快接近指定位置又很快離開，我隨機做了生命教育，並洋洋得意地說：「這就是聲音的好素材，你們可以選這個，也可以選上回或別的材料，但是必須要去現場傾聽，回來再寫。」一周後交作業，我問全班，除了最會寫作文的阿督仔和蠟黃外，沒人選這個素材。老夫十分沮喪，顯然是個失敗的安排。

    阿督仔文字曼妙，彷彿天上來，是他一貫優質的筆調，見多不奇，沒覺得他寫得精采。那天晚上，我依慣例第一本就改到蠟黃，他是一號。吃完冬至湯圓，肚子暖烘烘地，記得我是站著一口氣看完的……


    聲音──一次聆聽聲音的感受

    聆聽媽媽的聲音應該是一次美麗的經驗，這種經驗只應天上有，這種經驗只能夢裡尋。天上的媽媽怕路途敻遠，捨不得我神往，所以幽渺高古的世界我並不熟悉，夢境是我最好的期待。

    很小的時候，阿姨總叮嚀我：「只要乖，媽媽就會在半夜，從天上來跟夢中的你說話……」阿姨說得都是真的，從小到大，只要我聽話，媽媽三不五十就會到我床前來。天上的媽媽總是在很深的黑夜裡，沿著天梯而下，而且很快就在我眼前，媽媽知道我想她，她會摸摸我的頭，然後像很多媽媽一樣抱著我或者拍拍我的背，她也會哼著搖囝仔歌，「嬰啊嬰嬰睏，一暝大一寸。嬰啊嬰嬰惜，一暝大一尺」、「搖啊搖、惜啊惜」，跟阿姨一樣唱得很好聽，可是一醒來就什麼都沒有了。媽媽那麼好聽的聲音，如果能餘音繞樑，那該多好。媽媽哼哼唱唱的嘴型我記得，聲音就模模糊糊，始終抓不準。愈長愈大，媽媽就愈少進入我的夢鄉了。

    每天早上起床，當我打開眼睛的第一刻，我總是不自覺的走到書桌面前，去看一看這位天下最美麗女人的照片。媽媽年輕清純，秀髮披肩，眼窩深邃，兩顆秋水般的眼眸像射出的箭，高雅的氣質很吸引人；樱桃小嘴，笑起來兩邊嘴角微微上挑，齒如白貝，十分優雅；鵝形略大的臉樣兒，搭上平整的鼻面，自然透露著良善的溫柔。阿姨說媽長得漂亮，這是千真萬確的。……這張老照片歷歷分明，逼在眼前，可是她又是多麼遙遠；這張照片清朗明麗，多麼具體，可是她又是多麼的不真實……

    在一個偶然的機會，我來到了人間生命的工廠。依稀彷彿聽到別人的媽媽，正在為新生命的誕生而備受煎熬。有的在呻吟、有的在痛哭、有的在哀號、有的在漫罵──「都是你害的……」，聲聲動人心扉，哪一個聲符最像您，您能告訴我一聲嗎？媽媽，你是聽見我哇哇大哭後才放心走的呢？還是模模糊糊中離開人間？

    我可以想像得到：當天下的媽媽，在經過人間最大的痛苦之後，就為家人帶來了笑聲，帶來了生命的喜悅，成就了天倫之樂，同時也偉大了自己。

    不幸的是，媽媽！十八年前當我這個新生命呱呱落地的那一刻，卻也是媽媽你結束人生的一刻。媽媽！我這個從小就沒娘的孩子，對你有好深好深的歉意。如果沒有我的來到人間，也許你就不用賠上一條無辜的生命。

    媽媽！可是我總是比別人少了一個母親。媽媽，你知不道，我已經十八歲了，這十八年來我想看的看不到，我想聽的聽不著，這一趟是最接近你的一刻，但是，我依然落空了。此時此刻，忽然間我有一個強烈的渴望，如果可以，我真的好想好想……結結實實的聽一次……媽媽的聲音……。


    我焦急地打手機給資優班導師：

    「蠟黃母親不在了？」

    「是，聽說生他難產，走了！」

    「父親呢？」

    「他很小就不在了。」

    「跟誰住？」

    「阿公、阿嬷、還有沒嫁人的阿姨。」

    「他洗腎多久了？」

    「來建中前就有了。」

    記得當時，蠟黃我教了近三年，都快畢業了，文章寫不長，很少超過四百字，作文分數也沒有上過七十分，唯一的印象是他始終沒遲交缺交過作業。我為我的小器與對他的冷落，十分自責。

    第二天我急急把他喚到走廊。

    「蠟黃，你很能寫文章。以後可以遲交，補交也不扣你分。」

    「老師我真的很不會寫作文，可是媽媽我很愛寫。」

    冬陽陰弱，我近乎枯竭的老淚，正七彩沸騰中。

    「你娘一直都在，你聽得到她的聲音。」我拍一拍他羸稚的肩膀。

    他笑得快哭了，蠟黃的兩排牙也是蠟蠟黃黃地。

    （林明進媽媽的聲音）'
