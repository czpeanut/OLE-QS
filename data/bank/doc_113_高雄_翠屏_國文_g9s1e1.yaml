  group_stem: "(三)\n（甲）＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿  \n幸福是一種心靈的感受，所謂幸福感，就是本身的欲望得到滿足的時候，所體會的喜悅之感。人的一生，都在企求幸福，都在企求快樂，希望自己和自己所愛的人都能快樂平安地活下去。\
    \  \n希望無法達成，人就會認為自己是不幸的。過分意識自己的不幸，便會遠離幸福。經常認為自己是不幸的人，才是真正的不幸。      \n世上只有少數人，是真正不幸的人，其他的絕大多數的人，該是屬於「身在福中不知福」的那些悲觀者。\
    \  \n本來，天國原在你心中，你已經在福中，卻仍一味向外尋求，世上多少煩惱事，無非由這種「騎驢覓驢」貪婪心理所 致。宋朝清遠禪師還有一句「騎驢不肯下」提醒你：你自己知道騎在驢背上，可是由於你過分迷戀牠，反而會失去牠。\
    \  \n湯瑪士．摩敦修士也曾經提出類似的忠告說：「你不能有所求，也不能有所戀，更不能有所取；你一想到占有，便會 失去你的樂園。」  \n然而，人為了追求幸福，總是在現實生活中徬徨、摸索，往往捨近求遠，殊不知幸福必須求之於內，而不可求之於\
    \ 外。比利時劇作家莫里斯．梅特林克在他獲得諾貝爾文學獎的名劇青鳥中，描述吉吉兒和米吉兒兄妹倆如何四處尋找 理想中的青鳥，找遍整座森林，也未曾找到，於是垂頭喪氣地回到家，才發現他們所飼養的那一隻鳥，就是藍背的小鳥──青鳥。\n\
    有一首小詩，是最能表示這種「青鳥」，也就是「真寶」只在家中就可獲得：  \n（乙）「＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿ 」  \n如果你不知自己身邊有寶而向外尋求，將永無快樂幸福可言。人生真正的喜悅，就是肯定自己，信任自己能做到：內足自立，外無他求。\
    \  \n我總覺得，走在悠悠人生路上，各人有各人的走法。不要迷失自我地跟著別人的步調，也不必急急忙忙地往前追趕趕。只要沿著正確的路徑，悠然自得地一步一步往前走，總會抵達理想的目的地。\n\
    最後再度強調：「青鳥」就在自己身邊，而且經常在振翅飛翔，這象徵著真正的幸福應該是一種肯定而堅實的幸福， 只有腳踏實地的人才能得到。"
