  section: 3
  number: 4
  type: single
  page: 1
  stem: 瞬宥與同學玩文字接龍遊戲，規則是上句尾字與下句首字的造字法則相同，可以晉一級。下列四組接龍，何者不得晉級？
  options:
  - label: A
    content: 看家本領→鍥而不捨
  - label: B
    content: 捨本逐末→下情上達
  - label: C
    content: 破釜沉舟→衣錦還鄉
  - label: D
    content: 樂觀進取→救命之恩。
