  group_stem: "(四)\n一年重陽，蘇東坡邀請才子秦觀同往秋香亭飲酒賞菊。酒至半酣，蘇學士問：「賢弟才貌並秀，何以遲遲不擇佳偶？」秦觀笑道：「弟非草木，豈能無情。吾心中久慕一位窈窕淑女，只是難以啟齒。」\
    \ \n秦觀沉吟片刻，回答道：「待小弟打一字謎，請仁兄一猜。」說罷，即賦一詞：「園中花，化為灰，夕陽一點已西墜。相思淚，心已醉，空聽馬蹄歸，秋日殘紅螢火飛。」"
