  type: single
  page: 2
  stem: 下列關於李清照武陵春一詞的說明，何者敘述錯誤？
  options:
  - label: A
    content: 「風住塵香花已盡」一句，描寫仲春衰殘的景象，藉此象徵青春年華老去
  - label: B
    content: 「日晚倦梳頭」一句，顯現李清照喪夫之後的孤單落寞，太陽已升起，但仍懶得梳洗打扮
  - label: C
    content: 「欲語淚先流」意謂心中的悲痛無法用言語來形容，只能用眼淚來宣洩之
  - label: D
    content: 「只恐雙溪舴艋舟，載不動許多愁」，以舴艋舟的輕小是載不動的，來凸顯愁的重與多，是形象化的用法。
