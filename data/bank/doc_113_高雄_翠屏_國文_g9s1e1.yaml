- id: doc_113_高雄_翠屏_國文_g9s1e1_s3_8
  section: 3
  number: 8
  type: single
  page: 1
  stem: 「□□為秦代統一字體，線條圓轉曲折；□□則平直方折，是開展楷書的基礎。二者和楷、行、草的線條又全不一樣，入筆不同，收筆也不同，因之言筆法相異。」根據這段文字，缺空處依序填入下列何組字體最恰當？
  options:
  - label: A
    content: 小篆／隸書
  - label: B
    content: 大篆／隸書
  - label: C
    content: 小篆／金文
  - label: D
    content: 大篆、鐘鼎文。
