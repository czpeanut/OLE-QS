- id: doc_113_高雄_翠屏_國文_g9s1e1_s3_2
  section: 3
  number: 2
  type: single
  page: 1
  stem: 廟裡有四位信眾拜拜求籤，恰巧都抽中了同一支籤，但籤詩沒有標點符號，四人只好各自解讀。請問哪個人解讀的結果最吉利？
  options:
  - label: A
    content: 冠杰：此地安，能久居；其人好，不悲傷！
  - label: B
    content: 宇澄：此地，安能久居？其人，好不悲傷！
  - label: C
    content: 為握：此地安能──久居；其人好不──悲傷！
  - label: D
    content: 丞恩：此地安能久居？其人好不悲傷！
  tags:
