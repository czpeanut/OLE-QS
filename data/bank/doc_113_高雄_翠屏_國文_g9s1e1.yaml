  section: 3
  number: 1
  type: single
  page: 1
  stem: 下列有關電影鬼滅之刃的簡介，句中的標點符號，何者運用最正確？
  options:
  - label: A
    content: 少年竈門炭治郎是家中長子、父親去世後，他便肩負起了家中生計。
  - label: B
    content: 一隻惡鬼凶殘的屠戮了炭治郎家滿門；倖存的妹妹禰豆子變成食人鬼。
  - label: C
    content: 炭治郎經歷了幾年的鍛鍊，千辛萬苦通過嚴苛考試，成為鬼殺隊成員。
  - label: D
    content: 一路上：他與很多人，或者善良的鬼結緣──也找到了結伴向前的好夥伴。
  tags:
