- id: doc_113_高雄_翠屏_國文_g9s1e1_s3_3
  section: 3
  number: 3
  type: single
  page: 1
  stem: 老師上課教導大家學習「漢字的結構」，圓圓將課文條列出幾項重點，但粗心大意的他，竟然寫錯了一項，請問是哪一項？
  options:
  - label: A
    content: 會意和形聲都是字形可以再加以分析的合體，稱為「字」
  - label: B
    content: 六書中的轉注、假借是文字構造的基本法則
  - label: C
    content: 形聲字占漢字總數的百分之八十以上，成為漢字的主體
  - label: D
    content: 東漢的許慎所寫的說文解字，是第一部系統完整的文字研究專書。
  lesson_raw:
    number: 語文常識
    title: 漢字的結構
