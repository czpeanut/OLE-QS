  group_stem: "(五)\n    貞觀二年，公卿奏曰：「依禮，季夏之月，可以居臺榭。今夏暑未退，秋霖方始，宮中卑溼，請營一閣以居之。」太宗曰：「朕有氣疾，豈宜下溼？若遂來請，糜費良多。昔漢文將起露臺，而惜十家之產，朕德不逮於漢帝，而所費過之，豈為人父母之道也？」固請至於再三，竟不許。\
