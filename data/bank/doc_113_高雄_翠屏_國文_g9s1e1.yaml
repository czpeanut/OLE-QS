- id: doc_113_高雄_翠屏_國文_g9s1e1_s4_29
  section: 4
  number: 29
  type: single
  page: 4
  stem: 「南宋之初，李清照遭遇家與國的雙重不幸。」根據本文，關於李清照所遭遇的不幸，下列說明何者正確？
  options:
  - label: A
    content: 與她的丈夫趙明誠離異分居
  - label: B
    content: 李清照因亂而逃難來到金華
  - label: C
    content: 南宋因金兵攻入而遷都汴京
  - label: D
    content: 發生靖難之變導致宋室南遷。
  group_stem: "(一)\n父親聽說我要去金華，向我說：「李清照的武陵春就是客居金華時所作，詞有名，但那段時間，對李清照而言，可不是段好歲月啊。」\n\
    \  我登上李清照避難金華時也曾登過的八詠樓，登樓時她寫下：「千古風流八詠樓，江山留與後人愁。」但是在她的詞作中，更廣為人知的應該是：「只恐雙溪舴艋舟，載不動許多愁。」則是她遊雙溪時寫的，也就是父親提起的武陵春。雙溪和八詠樓都在金華城內，南宋之初，李清照遭遇家與國的雙重不幸，先是與她感情極好的丈夫趙明誠去世，後又發生靖康之變，宋朝不得不遷都臨安，就是今日的杭州，當時金華成為南宋士人匯聚的地方之一，李清照便逃難來到金華。\n\
    \  李清照的詞寄情於景，然而實則使她惆悵的不是金華，是個人的命運，和時代的動蕩。\n  無奈國勢日弱，生於北宋的李清照，南宋時一路逃難的心情自是倉皇。遭逢喪夫之痛，變幻莫測的局勢中，她不得不帶著與先夫共同收藏的器物書畫南下，每一件都有著他們共同的記憶，她努力想要留住這些收藏，卻因為種種原因，一路失去，所剩無幾。當趙明誠生前整理的金石錄後來得以出版時，李清照附錄的後序中，寫著她倉皇失措無力守護的心情。經歷與張汝舟痛苦的第二次婚姻，李清照對人生更感絕望，為了離婚，她險些入獄，還好有趙明誠的表哥綦祟禮營救，才幸免於牢獄之災。雁過也正傷心，卻是舊時相識，滿地黃花堆積。聲聲慢是我最早讀過的李清照作品，秋天蕭瑟，也高爽啊，李清照的蒼涼心境，卻是江南的淒楚，年少初讀時，只覺得美，作者心中的悲愴竟渾然不察。\
    \    楊明 酸甜江南"
