    content: 漢武帝一開始就知道寶物的神奇之處
  - label: B
    content: 集弦膠必須加水弄溼後才能順利使用
  - label: C
    content: 以膠黏合後的弓弦拉力比之前還要差
  - label: D
    content: 吉毛光裘以神馬的毛皮製成呈現青色
  group_stem: "(丙)請閱讀以下短文，並回答30～31 題：\n    漢武帝天漢三年，帝巡東海，祠恆山，王母遣使獻靈膠四兩、吉光毛裘。武帝以付外庫，不知膠、裘二物之妙也，以為西國雖遠，而貢者不奇，使者未遣之。\n\
    \    帝幸華林苑，射虎兕，弩弦斷。使者時隨駕，因上言：「請以膠一分，以口濡其膠，以續弩弦。」帝驚曰：「此異物也。」乃使武士數人，對牽引之，終日不脫，勝未續時也。\n\
    \    膠青色，如碧玉。吉光毛裘黃白，蓋神馬之類。裘入水終日不沉，入火不焦。帝悟，厚賂使者而遣去。集弦膠出自鳳鱗洲，洲在西海中，地面正方，皆一千五百里，四面皆弱水遶之。上多鳳鱗，數萬為群。煮鳳喙及鱗角，合煎作膠，名之「集弦膠」，一名「連金泥」。弓弩已斷之弦，刀劍已斷之鐵，以膠連續，終不脫也。\
    \                                                         錄自〈李昉‧太平廣記神仙四〉"
