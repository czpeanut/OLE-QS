  - label: B
    content: 發生森林大火時，松果的鱗片會闔上，以保護種子不被燒死
  - label: C
    content: 松果的鱗片受空氣濕度高低影響，使松果外形出現開闔變化
  - label: D
    content: 松果開闔的機制可調節空氣中的濕度，是森林中的重要物種
