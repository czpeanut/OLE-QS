    「女性專用車輛」，男性勿上車。 |

    | 印度 | ※視左手為不潔，吃飯、傳東西都用右手<br>※信奉印度教(不吃牛、豬)、伊斯蘭教(不吃豬)。<br>※禁摸小孩的頭。 |

    | 尼泊爾 | ※不可以觸摸他人的頭部，不可用腳指人或物。<br>※不握手，以雙手合十打招呼。<br>※女性忌穿著暴露，入寺廟時不可穿短褲、短裙，鞋子要脫掉。<br>※習慣以「搖頭」表示同意，以「點頭」表示否定。<br>※視牛為國獸，忌食牛肉。<br>※左手代表不潔，傳遞物品時要用右手。
    |'
