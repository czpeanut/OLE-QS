    content: 陳小潔到韓國用餐時，因為懶惰，連碗都不想捧，直接以口就碗，結帳時還直接將錢放在店員手上
  - label: B
    content: 柯小哲到尼泊爾出差時，竟帶了一堆鼎泰豐的牛肉麵當作見面禮
  - label: C
    content: 在印度他看見謝小邑假裝自己是活佛，觸摸一群貧童的頭，為他們灌頂
  - label: D
    content: 張小佐到日本泡溫泉時，為了與眾不同，將浴衣穿成右上左下
  group_stem: '(丁)請閱讀以下資訊，並回答32～33 題：：

    | 國家 | 規矩與禁忌 |

    | --- | --- |

    | 英國 | ※比「V」手勢時，手掌不可向內，那含有挑釁、侮辱的意思。<br>※不送人百合花，因為意味著死亡。 |

    | 韓國 | ※搭車、地鐵，博愛座不可以隨便坐。<br>※買東西時，要將錢放到店員手上。<br>※手吃飯不能捧碗，碗要擺在桌上，頭低下去吃。 |

    | 日本 | ※與日本人交談切忌用手抓頭這意味著「不滿」。<br>※浴衣與和服的穿法是左上右下，右上左下是過世者的穿法。<br>※需要服務生時，只要把手臂向上伸，手掌向下，擺動手指，不用付小費。<br>※電車上要求安靜、禁止交談。有些電車是屬
    「女性專用車輛」，男性勿上車。 |

    | 印度 | ※視左手為不潔，吃飯、傳東西都用右手<br>※信奉印度教(不吃牛、豬)、伊斯蘭教(不吃豬)。<br>※禁摸小孩的頭。 |

    | 尼泊爾 | ※不可以觸摸他人的頭部，不可用腳指人或物。<br>※不握手，以雙手合十打招呼。<br>※女性忌穿著暴露，入寺廟時不可穿短褲、短裙，鞋子要脫掉。<br>※習慣以「搖頭」表示同意，以「點頭」表示否定。<br>※視牛為國獸，忌食牛肉。<br>※左手代表不潔，傳遞物品時要用右手。
    |'
