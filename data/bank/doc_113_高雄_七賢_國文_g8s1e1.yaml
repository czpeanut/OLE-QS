      key: optD
      file: doc_113_高雄_七賢_國文_g8s1e1/5_34_optD.png
  group_stem: "（戊）請閱讀以下短文，並回答34～35 題：\n    智慧型手機龍頭蘋果公司自2007 年推出首款iPhone 以來，隨後推出了一代又一代的新款手機，真到今天iPhoneIS\
    \ 即將問世，每一次的推陳出新都是手機技術的突破。事實上電話革命不僅存於iPhone 系列中，最早可追溯至有線電話的誕生，一直到移動電話、手持式電話以及現今的智慧手機。\n\
    \    關於有線電話的誕生，主流說法以1876 年被授予電話發明美國專利的亞歷山大‧格拉漢姆‧貝爾為發明人，也有人認為是1854 年發明類似電話通訊設備的安東尼奧．穆齊，無論如何電話的起源可推估於\
    \ 19 世紀，當時的電話需要在固定的地點才能使用。而這樣定點式的有線電話，一直到麥克‧法倫成功將有線電話裝設於車內做使用，產生了第一個移動電話，開始能隨著汽車的移動進行更大範圍的訊息傳遞。接著在\
    \ 1973 年摩托羅拉（Motorola）公司推出了第一款手持式手機，人們開始可以不依賴地點或其他移動式交通工具，僅憑手機「一機在身」就能撥打電話。由於手持式電話的出現，1980\
    \ 年代有了第一代手機運行所必需的移動網路（1G），第二代（2G）則是於1991 年間世，並於2001 年出現了第三代（3G）、2009 年第四代（4G），以及自\
    \ 2018 年以來，我們所熟悉的第五代（SG）網路，訊號的傳輸速度隨著移動網路的革命愈加快速且便利，手機成為了響應省時、即時時代需求的通訊設備。\n  \
    \  隨著2007 年首款iPhone 的發布，一切都發生了變化。網頁Internet 瀏覽、電子郵件、音樂播放、拍照、遊戲娛樂集結於單個設備中，甚至現在文件處理、開會、購物與交易都能透過手機完成，手機不再只是撥打電話與傳遞資訊的工具，而是一項充滿智慧的生活工具，幾乎所有功能都可以藉由智慧型手機達成。第一代iPhone\
    \ 的3.5 吋螢幕成為了早期蘋果系列的特色，目的是好攜帶、符合人體工學使用。關於螢幕大小這項標誌性的設計一直到iPhone5 的4 吋螢幕推出，首次重大改造開始進入iPhone\
    \ 系列，隨之而來的是4.7 吋的 iPhone6、5.5 吋的iPhone 6 Plus、6.1 吋的iPhone 11 、6.7 吋的iPhone 14\
    \ ProMax，蘋果追隨市場趨勢，指向更大的手機螢幕。而首款採用「Touch ID」指紋解鎖的iPhone 6S、「Face ID」臉部解鎖的iPhone\
    \ X 與可以戴著口罩解鎖的iPhone12，則推進了手機感應解鎖的技術。從一開始的單顆鏡頭、Plus 系列的雙鏡頭及iPhone 11 Pro 有了第三個廣角鏡頭，則呈現出手機攝影技術的演進。\n\
    電話的革命迄今已經過逾150 年，然而智慧型手機的技術卻在iPhone 推出後短短20 年間有了跳躍式的進步，專家更指出iPhone 15 有多達6 項的設備與功能升級，可能是未來某個技術革命的前奏。\n\
    \                                                                  〈科技放大鏡：手機進化史〉"
