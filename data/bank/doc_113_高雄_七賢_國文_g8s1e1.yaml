  stem: 「松果的鱗片會感受空氣中的濕度，當空氣乾燥時，松果的鱗片會收縮，松果便會打開，讓種子容易飛散出來；相反的，如果空氣中飽含水份，松果的鱗片會膨脹，松果便會闔上。松果透過這樣的機制來保護種子，也幫助種子在發生森林大火時可以飛到遠處，避免被燒死。」根據這段文字，下列敘述何者正確？
  options:
  - label: A
