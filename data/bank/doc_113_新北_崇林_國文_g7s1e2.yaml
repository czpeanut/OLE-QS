  - label: D
    content: 要為腹中兒子進行胎教
  group_stem: （丙）孟子少時，東家殺豚。孟子問其母曰：「東家殺豚何為？」母曰：「欲啖汝。」其母自悔而言日：「吾懷妊是子，席不正不坐，割不正不食，胎教之也。今適有知而欺之，是教之不信也。」乃買東家豚肉以食之，明不欺也。
    （韓嬰 孟母教信）
