  type: single
  page: 1
  stem: 「子貢問曰：『有一言而可以終身行之者乎？』子曰：『其恕乎！己所不欲，勿施於人。』」根據這段文字，下列敘述何者正確？
  options:
  - label: A
    content: 子貢向孔子請教如何增進人際關係
  - label: B
    content: 孔子以肯定的語氣提出「恕」可作為做人的準則
  - label: C
    content: 「恕」指推己及人，以同理心對待人
  - label: D
    content: 「己所不欲，勿施於人」指自己不能達成的目標，也不要期待別人幫你完成
  lesson_raw:
    title: 論語選
    basis: 引述《論語》子貢與孔子對話課文
