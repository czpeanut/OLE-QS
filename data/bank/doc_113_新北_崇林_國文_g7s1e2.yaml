- id: doc_113_新北_崇林_國文_g7s1e2_s4_8
  section: 4
  number: 8
  type: single
  page: 2
  stem: 根據《呂氏春秋．慎行論．察傳》的記載：子夏有一次到晉國，經過衛國時，聽到有人在讀記載歷史的書，其中有一句是：「晉師三豕涉河」，他聽了就說：「應該不是『三豕涉河』，而是己亥涉河』吧！」到了晉國一查，果然是「晉師己亥涉河」，是說晉國軍隊在己亥那一天渡過黃河。因為「己亥」和「三豕」的古文字形很相近，所以才會造成這個錯誤。（引自教育部《成語典》）文中傳抄此段歷史的作者態度，所造成的結果，可以用下列何者來形容？
  options:
  - label: A
    content: 失之毫釐，差之千里
  - label: B
    content: 愚者千慮，必有一得
  - label: C
    content: 知過能改，善莫大焉
  - label: D
    content: 舉一反三，慎思明辨
- id: doc_113_新北_崇林_國文_g7s1e2_s4_9
  section: 4
  number: 9
  type: single
  page: 2
  stem: 言語表面的意思和內心本意相反的技巧稱為倒反法。下列何者沒有運用倒反技巧？
  options:
  - label: A
    content: 你真是太勇敢了，連一隻螞蟻都能讓你嚇得尖叫起來。
  - label: B
    content: 他帶活動很幽默，學員們的笑聲都快要把活動中心的屋頂掀開了。
  - label: C
    content: 爺爺摟著小孫子寵溺地笑說：「你真是個小討厭！」
  - label: D
    content: 你開車技術的確一流，這麼大一棵樹也能對著它直衝過去。
- id: doc_113_新北_崇林_國文_g7s1e2_s4_10
  section: 4
  number: 10
  type: single
  page: 2
  stem: 〈那默默的一群〉：「這真是默默的一群，默默的表現著一個勞動者那種敦厚樸實的風範，她們的名字不會被人知道，可是在我的心目中，她們是有資格被稱之為『人物的一群』。」根據這段話，可看出作者對於清道婦哪一方面的肯定？
  options:
  - label: A
    content: 隱姓埋名的生活風格
  - label: B
    content: 溫柔文雅的處事性情
  - label: C
    content: 默不作聲的待人方式
  - label: D
    content: 一絲不苟的工作態度
  lesson_raw:
    title: 那默默的一群
    basis: 題目指名〈那默默的一群〉並引用課文
- id: doc_113_新北_崇林_國文_g7s1e2_s4_11
  section: 4
  number: 11
  type: single
  page: 2
  stem: 下列何者最合乎孔子所說的「恕道」？
  options:
  - label: A
    content: 要知道別人的鞋子合不合腳，穿上別人的鞋子走一英里。
  - label: B
    content: 我們向來概括承受這個現實世界呈現給我們的任何樣貌。
  - label: C
    content: 內心強大的人會道歉，但要更強大的人才懂得原諒。
  - label: D
    content: 如果别人朝你扔石頭，不要扔回去，留著做你建樓高的基石吧。
  lesson_raw:
    title: 論語選
    basis: 孔子思想與《論語》恕道概念
- id: doc_113_新北_崇林_國文_g7s1e2_s4_12
  section: 4
  number: 12
  type: single
  page: 2
  stem: 「我向默默耕耘者學習等待，也向堅持不懈者學習勇敢；我從高傲的人身上學會了彎腰，也從奢靡的人身上了學到簡樸。」這段文句最能呼應《論語》中的哪一段話？（108
    會考）
  options:
  - label: A
    content: 學而時習之，不亦說乎
  - label: B
    content: 人之過也，各於其黨。觀過，斯知仁矣
  - label: C
    content: 三人行，必有我師焉。擇其善者而從之，其不善者而改之
  - label: D
    content: 君子不重則不威、學則不固。主忠信，無友不如己者
  lesson_raw:
    title: 論語選
    basis: 考查《論語》選文句子對應
- id: doc_113_新北_崇林_國文_g7s1e2_s4_13
