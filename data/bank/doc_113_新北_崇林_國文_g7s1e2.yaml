  number: 13
  type: single
  page: 2
  stem: 請根據下列孔子對四位弟子的評論推測，何者為孔子最欣賞的人？
  options:
  - label: A
    content: 顏淵：回也，其心三月不違仁，其餘則日月至焉而已。
  - label: B
