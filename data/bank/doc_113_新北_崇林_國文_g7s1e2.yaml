  stem: 關於本文內容，下列敘述何者正確？
  options:
  - label: A
    content: 楊容蓮女士獻身於表演工作，其敬業精神讓人敬佩
  - label: B
    content: 作者以楊容蓮女士為偶像，是因為她本是不平凡的人，卻願意做平凡的工作
  - label: C
    content: 楊容蓮女士是首位以茶水工身分獲得香港電影金像獎肯定的人
  - label: D
    content: 香港電影金像獎頒發了「專業精神獎」給她，是因為她能依每位明星的喜好，準備不同的甜點
  group_stem: '（甲）我的偶像 竹圍高中（國中部）葉紫瑜

    我的偶像是一位在片場倒茶水的工人：楊容蓮女士。因為她把一個最平凡的工作做到不平凡。

    雖然是茶水工，但她卻很尊重自己的職業。無論劇組幾點開拍，她必定提早一個小時到拍攝現場做好準備工作。原本只需要為主要演員倒茶水，她卻一視同仁，為所有工作人員準備茶水，甚至依不同的季節準備冷熱飲和甜點。她的責任感和溫柔體貼不僅讓我感動，也值得我學習和尊敬。

    她的「敬業」感動了幕前、幕後的工作人員。因此，香港電影金像獎頒發了「專業精神獎」給她，頒獎典禮上所有的明星為她起立鼓掌三分鐘，看似和電影無關的茶水工作，卻史無前例地獲獎，全都是因為她出色的工作表現得到了大家的認可。

    約翰•加德納說：「無論從事任何正當的工作，只要盡力而為，這本身就是一種可嘉的獻身精神。」楊容蓮女士，她的敬業精神實在讓人敬佩。 （錄自新北市113 年國民中學品德教育聯絡簿選文）'
- id: doc_113_新北_崇林_國文_g7s1e2_s5_2
  section: 5
  number: 2
  type: single
  page: 4
  stem: 若要為本文下個標題，下列何者最適合？
  options:
  - label: A
    content: 高中（含）以下學生網路使用行為調查分析
  - label: B
    content: 台灣學生網路成癮調查分析
  - label: C
    content: 中小學生智慧型手機使用情形調查
  - label: D
    content: 網路安全現狀調查結果
  group_stem: '（乙）教育部最新調查，逾7 成國中小學生上網最常玩遊戲，高中生則以使用社群網站比率最高；但也有逾6 成中小學生會以學習為目的，上網找資料或影片。

    為瞭解中小學學生網路使用情形，教育部委託陽明交通大學人文與社會科學研究中心執行112 年台灣中小學學生網路使用行為調查報告，於112 年3 月至4 月期間，針對北、中、南、東、離島等地區的國小4
    至6 年級、國中7 至9 年級、高中1 至3 年級學生進行分層隨機抽樣調查，有效問卷數共4937 份。

    調查結果顯示，國小、國中、高中生有智慧型手機的比率分別為59.7%、87%、91.8%；國小、國中、高中生有平板電腦（含筆記型電腦）的比率分別為46.5%、49%、57.2%。

    至於上網最常進行的活動，國小和國中生皆以玩智慧型手機遊戲（含線上遊戲）比率最高（國小79.7%、國中77.6%），高中生以使用社群網站比率最高（85.6%）；國小、國中、高中生以學習為目的上網找資料或影片（每週至少1
    次）的比率分別為61.1%、60%、70.8%；國小、國中與高中生首次接觸網路的時間，皆為國小3 至4 年級階段最多。

    為瞭解學生網路沉迷傾向的趨勢，調查採用台大心理系教授陳淑惠的「陳氏網路成癮量表」，發現112 年國小生與高中生在網路沉迷的傾向比106 年調查有微幅上升；另外，針對學生的學習管理能力分數與網路沉迷傾向分數進行分析，調查也顯示，學習分心程度與網路沉迷傾向呈現正相關，學習管理能力愈高的學生，網路沉迷傾向愈低。

    在網路知能方面，調查指出，學生對網路安全知能分數非常高，且隨年級增加而有所提升；學生對資訊安全的意識，也隨著年級上升而增加。 （引自中央社報導）'
