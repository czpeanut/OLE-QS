  stem: 上文中，我國《農藥管理法》有規定除草劑使用範圍，而「農藥使用管理」是地方權責。上述劃分中央與地方權限之依據，應填入下列何者最為合理？
  options:
  - label: A
    content: 事務性質
  - label: B
    content: 全國一致
  - label: C
    content: 因地制宜
  - label: D
    content: 地方自治
  group_stem: (三)除草劑能夠殺死特定植物，常被用來清楚土地雜草，但長期噴灑不但會破壞生態，甚至有害人體健康。行政院農委會表示違反《農藥管理法》規定除草劑使用範圍，例如馬路邊坡、公園、校園、墳墓，檳榔園以及水產養殖池邊都不得使用，違者可處新臺幣1
    萬5 千元以上15 萬元以下罰鍰。但「農藥使用管理」是地方權責，宜蘭縣制定《除草劑管理自治條例》，規定都市計畫範圍內、農業區以外土地禁用除草劑，民眾違法噴灑除草劑可處5
    千至5 萬元罰鍰。繼宜蘭縣之後，臺北市於2016 年通過《臺北市除草劑管理自治條例》，規定農藥業者只能將除草劑賣給「農民身分者」，除農業區及保護區做為農業生產之土地，其餘區域均禁用除草劑；而高雄市也在2018
    年通過《高雄市除草劑管理自治條例》，未限制購買身分，同樣禁止非農業區範圍內使用除草劑。
