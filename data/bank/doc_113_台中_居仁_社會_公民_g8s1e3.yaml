  stem: 依照《地方制度法》，下列關於中央政府與地方政府，及地方政府彼此之間互動的敘述，何者正確？
  options:
  - label: A
    content: 新竹縣長與新竹市長簽署合作備忘錄，未來一同規劃推動輕軌計畫，此屬於「執行上級委辦事項」。
  - label: B
    content: 擴大秋冬國民旅遊獎助方案，交通部提供旅遊補助，地方政府審查民宿業者補助事宜，是屬於「跨區域自治事項」。
  - label: C
    content: 石頭里里長罷免案，石頭里通過罷免，應再行補選里長，此屬於地方政府「自治事項」。
  - label: D
    content: 各縣市協助辦理全國性選舉，是屬於「監督下級機關」。
