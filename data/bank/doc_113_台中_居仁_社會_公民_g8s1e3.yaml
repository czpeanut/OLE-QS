- id: doc_113_台中_居仁_社會_公民_g8s1e3_s2_37
  section: 2
  number: 37
  type: single
  page: 4
  stem: 政府以「民俗文化根、傳統國際化」為目標，將元宵節提燈籠的傳統民俗活動，改變為大型的觀光盛會。每年交通部規畫臺灣燈會的主辦地，由地方政府執行燈會的相關活動。關於上文敘述，下列何者正確？
  options:
  - label: A
    content: 屬於中央集權
  - label: B
    content: 屬於垂直分權
  - label: C
    content: 屬於三權分立
  - label: D
    content: 屬於水平分權。
  group_stem: "(五)臺灣燈會是由交通部觀光署以及全台各地方政府共同主辦。每年的燈會都吸引成千上萬的民眾前往參觀，亦帶動周邊的商機，不管是燈會現場或當地的名勝觀光地，為政府或民間各方面都帶來大量的觀光效益。\n\
    \   「2025 台灣燈會」將在桃園舉行，燈藝作品將遍及「主燈展演場」及「光的遊戲場」週邊場域，結合工藝、竹藝、互動科技及傳統燈藝等多元手法，同時搭配桃園國際機場國境之門地理位置及在地中華職棒樂天桃猿棒球隊，巧妙地運用「航空」及「棒球」等元素納入本次燈會策展概念，透過各式燈組映照出桃園多元的城市樣貌。\n\
    \    為迎接2025 燈會在桃園，市議員在市政總質詢中，要求做好各項亮點計畫及交通接駁及停車問題。○○表示已研擬完善交通疏運方案，燈會期間將提供約8 千個停車位，並鼓勵民眾選擇大眾運輸前往，並派警察執行違規停車開單。請問:"
  shared_asset: g2_37_40
