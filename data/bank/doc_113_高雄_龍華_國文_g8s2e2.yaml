  group_stem: "臨江之人，畋得麋麑① ，畜之。入門，群犬垂涎，揚尾皆來。其人怒撻之。自是日抱就犬，習示之② ，使勿動，稍使與之戲。積久，犬皆如人意。麋麑稍大，忘己之麋也，以為犬良我友，抵觸偃仆，益狎。犬畏主人，與之俯仰甚善，然時啖其舌。\n\
    \  三年，麋出門，見外犬在道，甚眾，走欲與為戲。外犬見而喜且怒，共殺食之，狼藉道上，麋至死不悟。\n                          \
