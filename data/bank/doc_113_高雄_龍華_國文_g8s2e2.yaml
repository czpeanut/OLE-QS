  group_stem: "西湖最盛，為春為月。一日之盛，為朝煙，為夕嵐。\n  由斷橋至蘇堤一帶，綠煙紅霧，瀰漫二十餘里。歌吹為風，粉汗為雨，羅紈之盛，多於堤畔之草，豔冶極矣。\n\
