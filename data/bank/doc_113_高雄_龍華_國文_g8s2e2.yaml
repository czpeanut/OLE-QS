- id: doc_113_高雄_龍華_國文_g8s2e2_s4_26
  section: 4
  number: 26
  type: single
  page: 4
  stem: 依據本文，法拉的話點出獵人看山林的角度，可知其面對山林的態度為下列何者？
  options:
  - label: A
    content: 恐懼憂患
  - label: B
    content: 謙虛謹慎
  - label: C
    content: 勇於挑戰
  - label: D
    content: 害怕逃避
  group_stem: "豐富、多樣性的原民文化是臺灣的珍貴寶藏和傲人資產，我們應該致力於蒐集獨有的文化智慧財產，從了解、到認同、再到承傳，這樣才能鞏固我們的土地資源權。許多年長的原民長輩一旦離開了原鄉，常常就會斷絕了生命的養分，可見土地和生命的深深連結。現在持續在狩獵的獵人並不多，但是真正的狩獵文化和獵人精神，仍然是原民文化和土地的重要內涵。\n\
    \  狩獵文化是在地知識的體現，例如對於環境生態的智慧，只有在地人最清楚，而獵人因為和生態之間的互動、適應、觀察與經驗累積，建立了珍貴而難得的在地知識與技能，這就是獵人精神。真正的獵人了解動物行為，也會尊重動物的繁殖，不會趕盡殺絕，例如從腳印、排遺、棲息窩可以判別動物的出沒；還有像是水鹿喜歡到某種水源區去棲息及生育，所以獵人不會去打擾牠們，而讓牠們好好繁殖。\n\
    \  真正的獵人，是博物學家。對於植物、地質、地形與氣象都要了解，例如哪些植物有毒、哪些植物可食用或作為工具、哪些植物是獵物愛吃的……等。此外，他們也具有永續利用自然環境的理念規範，不但傳承傳統狩獵文化，也遵守祖先留下來的禁忌，可說是動物保育的管理員。獵人累積的生態知識可使狩獵文化更加精緻，而他們對環境變化的觀察，也可提供環境管理策略參考，有效協助自然資源的研究。\n\
    \  老獵人都知道，驕傲必然導致失敗，只有承認害怕，才能更加謹慎。但就算怕，也沒有逃避的可能，不面對恐懼走進山裡就可能餓死。獵人的守則裡，恐懼和行動必須並存。法拉：「我希望用獵人的角度，告訴外面來玩的客人，讓他們能夠先了解認識山林之後，他們才會漸漸地愛護這片山林，然後保護山林之後，他知道山林真正的美與價值。」\n\
    \  山林是老師，不勇敢走進去，就學不到任何事。這過程一定辛苦，但他們相信有意義。辛苦過後，靠自己雙手得來的獵物能讓親友共享。而克服恐懼與緊張，享受平淡實在的喜悅，便能在面對山野和其他生命時，更謙虛、更謹慎。\n\
    \                                                   （改寫自吳幸如 <狩獵文化與獵人精神>）"
