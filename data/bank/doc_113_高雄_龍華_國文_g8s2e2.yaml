  section: 4
  number: 28
  type: single
  page: 5
  stem: 根據本文，作者認為人類生活暗慘的病根在於「忘本」。其原因最可能是下列何者？
  options:
  - label: A
    content: 遠離了大自然
  - label: B
    content: 忘記了自己的本分
  - label: C
    content: 遠離了文明社會
  - label: D
    content: 忘記父母對我們的養育之恩
  group_stem: "但不滿意的生活大都是由於自取的。我是一個生命的信仰者，我信生活絕不是我們大多數人僅僅從自身經驗推得的那樣暗慘。我們的病根是在「忘本」。人是自然的產兒，就好比枝頭的花與鳥是自然的產兒；但我們不幸是文明人，入世深似一天，離自然遠似一天。離開了泥土的花草，離開了水的魚，能快活嗎？能生存嗎？從大自然，我們取得我們的生命；從大自然，我們分取得我們繼續的滋養。哪一株婆娑的大木沒有盤錯的根柢深入在無盡藏的地裡？我們是永遠不能獨立的。有幸福是永遠不離母親撫育的孩子，有健康是永遠接近自然的人們。不必一定與鹿豕遊，不必一定回「洞府」去；為醫治我們當前生活的枯窘，只要「不完全遺忘自然」，一張輕淡的藥方，我們的病象就有緩和的希望。在青草裡打幾個滾，到海水裡洗幾次浴，到高處去看幾次朝霞與晚照—你肩背上的負擔就會輕鬆了去的。\n\
    \                                                      （節錄自徐志摩 <我所知道的康橋>）"
  tags:
    chapter:
      publisher: 翰林
