  group_stem: 'Brain Teaser

    What is a brain teaser? The answer doesn’t always come easily, and you even have
    the wrong guess sometimes. But one interesting thing is that when you get the
    correct answer, you feel stupid about yourself, but __(1)__. In fact, you know
    you learned something interesting and that makes you happy.

    A brain teaser comes in different forms. Some brain teasers play with your mind.
    For example, Mary''s father has five children: Nana, Nene, Nini, Nono. What is
    the name of the fifth child? Many people would answer __(2)__ without thinking
    because they see each of the four names has one vowel letter(a, e, i, o, u). Wrong!
    The answer was at the very start of the question (Mary''s father has five children...).

    __(3)__. Here is an example: What do you see in the picture at first look? Some
    people see a young woman, and others see an old lady. In fact, you can see both
    a young woman and an old lady in the same picture. A brain teaser is a fun game
    for people of all ages. It is also a great way to kill time __(4)__. If you are
    interested in learning more about brain teasers, visit *Brain Teaser Central*
    at www.brainteasercentral.com. You will have no problem choosing your favorite
    brain teaser to share with your family and friends.

