- id: doc_113_高雄_五甲_英語_g8s1e1_s5_5
  section: 5
  number: 5
  type: single
  page: 4
  stem: What does the news story say about the Yangs’ food truck?
  options:
  - label: A
    content: What people love about their food.
  - label: B
    content: What made them start their business.
  - label: C
    content: How they made delicious fried chicken.
  - label: D
    content: How they fixed their business problems.
  group_stem: 'Big Apple News

    Taiwanese Bian-dang in Manhattan, New York City

    5/30/ 2014 by Eva Schmidt


    During lunch time, on 53ʳᵈ Street, you''ll see a long line of people in front
    of a Taiwanese food truck for their “bian-dang,” a Taiwanese word for “lunch box.”
    On the menu you can find fried chicken with rice, pork dumplings, tea eggs, and
    other popular Taiwanese dishes.

    The owners of the food truck are Thomas and Diana Yang, two Taiwanese-Americans.
    This brother-sister team started their business in 2009. Back then, there were
    a few Taiwanese restaurants in the city and several thousand food trucks, but
    the Yangs were the first to sell Taiwanese food on a food truck.

    At first, business was slack. People thought they were just another Chinese food
    truck, and the food truck’s name, “Cravings,” often made people think of desserts,
    not lunch. Few people would stop by and try their food. “I couldn’t even give
    away free food,” said Thomas. To 6 , they painted their truck blue, and drew Taiwan’s
    national flower, the plum blossom, on it. They also changed the food truck’s name
    to “bian-dang.” Soon people started to notice them, and business finally got better.
    Now on a good day, they can sell about 150 bian-dangs in about two hours.

    So what’s next for Thomas and Diana? Well, they hope one day there will be a block
    with Taiwanese food in the city, just like there is a Chinatown, a Korea Town,
    and a Little Italy. And their bian-dang food truck might just help to make that
    happen.


    📖 thousand 千 slack 冷清 cravings 渴望 national 國家的 plum blossom 梅花 notice 注意'
  shared_asset: g5_5_7
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
