  stem: Iren will join Little Scientist this winter. What will she learn at the camp?
  options:
  - label: A
    content: Drawing skills.
  - label: B
    content: Knowledge about food.
  - label: C
    content: Cooking.
  - label: D
    content: Writing skills.
  group_stem: 'Dear parents,

    Thank you for joining our winter camp. We have a lot of fun activities for your
    children this winter.

    1. Little Scientist

    We will group your children into small groups. They have to work together to do
    many food science experiments. It’s fun and educational.

    ~From January 15th to January 31st~

    2. Little Artist

    Our art teachers will teach your children to draw. They will also visit many art
    museums. They will learn drawing skills and gain knowledge about art at the camp.

    ~From February 1st to February 15th~

    3. Little Writer

    It’s not difficult to write in English. Our teachers will teach your children
    lots of writing skills. Your children will also work in groups to write a short
    story.

    ~From February 16th to February 28th~


