    \ it can also hurt us.\nTo clean up the beach, we need a few important tools:\
    \ gloves to protect our hands from sharp objects, a bucket to collect trash, and\
    \ sunscreen and sunglasses to protect us from the sun.\nBesides joining a beach\
    \ cleanup, we can help the Earth every day by remembering the Six Rs:\n1. Reduce\
    \ – Use fewer disposable plastic items.\n2. Reuse – Use things again, like refilling\
    \ a water bottle.\n3. Recycle – Turn old items into something new.\n4. Rethink\
    \ – Choose better options for the environment.\n5. Repair – Fix broken items instead\
    \ of throwing them away.\n6. Refuse – Say no to things that are bad for the planet.\n\
    \nIf we do just a little bit, we can make the world a better place. You don’t\
    \ have to wait for someone else—you can be a protector of the Earth today!\n\n\
