  section: 1
  number: 12
  type: single
  page: 2
  stem: 非洲某國是漠南非洲經濟發展最均衡的國家，並憑藉著金、鑽、銅等礦業作為外貿收入，但政局社會長期紛擾不斷；直到90 年代初期，該國一位政治人物在演說中呼籲：「我國的未來只能是一個在不分膚色的基礎上，通過民主選舉而產生的機構來決定，也就是建立一個民主、不分膚色和統一的國家，白人壟斷政權的狀況必須結束。」該政治人物的演說的內容，反應何種不公？
  options:
  - label: A
    content: 英國統治下的種族隔離政策
  - label: B
    content: 獨裁專政的社會福利制度
  - label: C
