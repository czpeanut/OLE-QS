  stem: 家中如有車輛出廠超過 5 年，每年驗車 1 次；超過 10 年以上，每年驗車 2 次。政府委託民間代檢廠辦理驗車，但為維持品質，代檢公司有每日驗車車額限制，不依限期參加檢驗者，將被監理所依道路交通管理處罰條例處分根據上文所述，有關汽車檢驗的說明，何者正確？
