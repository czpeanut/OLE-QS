  stem: 「漠南非洲境內主要以(甲)高原地形為主，相當堅硬的(乙)古老板塊蘊藏豐富的金屬礦產，成為今日發展的有利條件。但該地區由於(丙)海岸水淺淤沙，再加上北方的(丁)撒哈拉沙漠阻隔，因此外人不易入內，所以開發較晚，被稱為黃金堆上的乞丐。」上述內容中何者有誤？
