- id: doc_113_高雄_龍華_社會_g8s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 智利的捕霧網（Fog-catching nets）是一種創新的水資源收集技術，這些網子能夠捕捉濃霧中凝結成的水滴。當霧流經網子時，水滴凝結在網子上，並滴落到下方的集水器或容器中。這項技術有效地利用了大氣中的水分，提供了乾旱地區居民所需的淡水來源。下列哪一個地區也適合推廣此技術？
