- id: doc_113_高雄_龍華_社會_g8s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: '「奈及利亞的石油產品占出口總額約 90％以上，早在英國殖民奈及利亞的後期，各石油公司就開始進駐，榨取石油資源。殼牌是非洲最大的跨國石油公司，自 1956
    年開始在奈及利亞的三角洲探勘石油，幾十年來，殼牌在當地已發生數不清的漏油事件，每年的漏油量估計約為 24 萬桶，源源不絕的石油幾十年間不斷入侵奈及利亞的溪流、河流、大海，讓依靠農耕和養殖產業維生的居民飽受石油摧殘，生態環境岌岌可危」。請問下列哪幾項為正確敘述？

    (甲)石油產業使尼羅河下游的生態遭受嚴重破壞

    (乙)石油多依賴臨近大西洋的港口出口

    (丙)跨國石油公司進駐後投資糧食，使得糧產大增

    (丁)該國經濟易受國際市場價格變動影響。'
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 甲丁
  - label: C
    content: 乙丙
  - label: D
    content: 乙丁。
