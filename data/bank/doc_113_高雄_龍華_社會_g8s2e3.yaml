- id: doc_113_高雄_龍華_社會_g8s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 非洲三分之二的國家為糧食淨進口國，預計隨著非洲人口持續增長以及國際戰事波及影響，糧食的貿易逆差將日趨擴大，令非洲經濟雪上加霜。非洲缺糧與高度發展熱帶栽培業密切相關，請問下列關乎非洲熱帶栽培業的敘述何者「有誤」？
  options:
  - label: A
    content: 出口單一化經濟作物，糧食仰賴進口
  - label: B
    content: 熱帶栽培業作物收購價掌握在歐美跨國公司
  - label: C
    content: 非洲農民收入微薄，難以翻轉社會階級
  - label: D
    content: 西非地區生產可可聞名，東非地區生產橄欖著稱。
- id: doc_113_高雄_龍華_社會_g8s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 美國哈佛商學院著名的戰略管理學家邁克爾．波特提出「鑽石理論模型」，他認為國際上的競爭力主要受到「生產要素、需求條件、相關產業、企業競爭策略」等因素決定。若依據上述因素分析漠南非洲的工業發展，下列敘述何者正確？
  options:
  - label: A
    content: 生產要素：低廉勞力加上原料豐富
  - label: B
    content: 需求條件：消費市場大且消費力強
  - label: C
    content: 相關產業發展：研發技術與加工產業結構完整
  - label: D
    content: 企業競爭策略：政局穩定有利於長期發展計
