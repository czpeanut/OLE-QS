  stem: 「風煙俱淨，天山共色，從流飄蕩，任意東西。」是指從舟中眺望遠景，勾勒出一幅明淨渾融的畫面，並點出作者在舟中賞山玩水，心情逍遙自在，下列哪個選項亦表露出作者悠閒的心境？
  options:
  - label: A
    content: 絕域從軍計惘然，東南幽恨滿詞箋；一蕭一劍平生意，負盡狂名十五年
  - label: B
    content: 不信芳春厭老人，老人幾度送餘春？惜春行樂莫辭頻，巧笑艷歌皆我意，惱花顛酒拚君瞋，物情惟有醉中真
  - label: C
    content: 明月別枝驚鵲，清風半夜鳴蟬。稻花香裡說豐年，聽取蛙聲一片。七八個星天外，兩三點雨山前，舊時茆店社 林邊，路轉溪橋忽見
  - label: D
    content: 獨有宦遊人，偏驚物候新；雲霞出海曙，梅柳渡江春。淑氣催黃鳥，晴光轉綠蘋，忽聞歌古調，歸思欲霑巾。
