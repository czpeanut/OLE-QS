- id: doc_112_高雄_大樹_國文_g9s1e2_s6_7
  section: 6
  number: 7
  type: single
  page: 6
  stem: '(甲)神鵰俠侶 (乙)天龍八部 (丙)鹿鼎記 (丁)射鵰英雄傳。

    以上四部金庸的作品，其發表時間從早到晚依序排列，何者正確?'
  options:
  - label: A
    content: 丁-＞甲-＞丙-＞乙
  - label: B
    content: 丙-＞乙-＞甲-＞丁
  - label: C
    content: 丁-＞甲-＞乙-＞丙
  - label: D
    content: 乙-＞丙-＞甲-＞丁
  group_stem: "第四則\n 若問當今華文作家中擁有讀者最多的是誰，大概人們會異口同聲地回答：「金庸！」\n 金庸作品造就了千千萬萬個「迷」，也帶來了許許多多個「謎」。\n\
    \ 金庸小說最初發表在報紙上，就已擁有大量讀者。自出版 36 冊一套的單行本以來，到 1994 年止，正式印行的已達 4000 萬套以上。如果一冊書有五人讀過，那麼讀者就達兩億。必須注意的是，金庸小說無論在台灣還是在內地都有許多盜印本。這些盜印本的總數，可能不在正式出版數以下。1991\
    \ 年我曾在史坦福大學的東亞圖書館作過一點調查。他們館藏的金庸小說，幾乎都借出過幾十次、上百次，「借書日期」、「還書日期」欄內蓋的戳子密密麻麻。許多書都已被翻看得陳舊破爛。圖書館工作人員告訴我，他們已買過兩種版本的金庸小說，結果都相似，因為借閱的人實在太多。\n\
    \ 我曾經以為男性青年學生才喜歡金庸小說。誰知一調查，許多女學生照樣愛讀。而且他們的父母親和許多上了年紀的華人也同樣喜歡讀。\n 「金庸熱」之所以構成一種奇異的、令人注目的閱讀現象，不僅由於擁有讀者之多，還因為它具有下述下列幾點突出的特點：\n\
    一、 是持續時間長。\n 射鵰英雄傳最初在報紙上連載時，許多人爭相傳告，報紙發行量一下子增加很多。從那個時候起，可以說港澳地區就出現了「金庸熱」。而且隨著神鵰俠侶、天龍八部、笑傲江湖等作品依序出現，到\
    \ 1972 年鹿鼎記連載結束，「金庸熱」還是長盛不衰。1998 年，就有三個金庸小說研討會在美國、中國和台灣分別舉行。\n二、 是覆蓋地域廣。\n 金庸的讀者不但在海峽兩岸和東亞地區，而且延伸到了北美、歐洲、大洋洲的華人社會，可以說全世界有華人處就有金庸小說的流傳。1991\
    \ 年我到新加坡參加國際漢學會議，坐在計程車上，聽到的就是鹿鼎記的華語廣播。我還看到過一個材料，說 70 年代初越南國會議員們吵架，一個罵對方「是搞陰謀詭計的左冷禪」，對方就回罵\
    \ 說：「你才是虛偽陰狠的岳不群」。可見連笑傲江湖裡這些人物在當時的越南也幾乎到了人所共知的地步。據韓國學生告訴我，金庸小說在韓國早有譯本，並且相當風行。\n\
    \ 除讀者閱讀狀況非常值得注意之外，金庸小說本身還包含著一系列難以索解的有趣現象。舉例說，金庸小說雖然產生在香港商業化環境中，卻沒有舊式武俠小說那種低級趣味和粗俗氣息。又例如，武俠小說一般都以神奇、曲折來吸引人，可是金庸小說同時卻又相當貼近生活、貼近人生，相當生活化。諸如此類，金庸小說似乎充滿了許多不易詮釋之謎。\n\
    \ 上述種種現象，每一項都可能潛藏著有待發掘的豐厚內涵，足以發人深省，啟迪人們去思考和研究。科學地揭示現象背後的諸多原因，深入地探討金庸作品魅力之所在，解開謎底，把金庸小說放到中國文學發展的背景上加以考察，從而評價其在文學史上的地位，正是金庸研究者們共同面對的課題和任務\n\
    ＜改寫自嚴家炎 中華讀書報 華人金庸熱＞"
  answer:
  - C
  answer_source: answer_key_vlm
