  group_stem: "第二則﹕董永\n 干寶\n 漢 董永，千乘人。少偏孤①，與父居，肆力②田畝，鹿車③載自隨。父亡無以葬，乃自賣為奴，以供喪事。主人知其賢，與錢一萬，遣之。永行三年喪畢，欲還主人，供其奴職。道逢一婦人曰：「願為子妻。」遂與之俱。主人謂永曰：「以錢與君矣。」永曰：「蒙君之惠，父喪收藏。永雖小人，必欲服勤致力，以報厚德。」主曰：「婦人何能？」永曰：「能織。」主曰：「必爾者，但令君婦為我織縑④百疋⑤。」於是永妻為主人家織，十日而畢。女出門，謂永曰：「我，天之織女也。緣君至孝，天帝令我助君償債耳。」語畢，淩空⑥而去，不知所在。\n\
