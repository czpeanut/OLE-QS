- id: doc_113_新北_福和_社會_地理_g9s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '歐洲兩大河流藉由某一運河相互連結，以提升河流的航運價值。甲港口為該河運上重要的轉運樞紐，附表為2022 兩條河流流域內各國與甲港口之間的船舶貨運量。

    | 國家 | 船舶貨運量（公噸） |

    | :--- | :--- |

    | 荷蘭 | 110,358 |

    | 德國 | 70,418 |

    | 比利時 | 52,816 |

    | 奧地利 | 34,998 |

    | 匈牙利 | 9,793 |

    | 法國 | 7,515 |

    | 斯洛伐克 | 6,067 |

    | 羅馬尼亞 | 932 |

    | 總計 | 292,887 |

    註：船舶貨運量為各國以船舶運抵甲港口及從甲港口運至各國的貨運量總和。

    由表中資訊判斷，該河流是哪一條？又該河流應是注入哪個海域？'
  options:
  - label: A
    content: 萊茵河、北海
  - label: B
    content: 易北河、波羅的海
  - label: C
    content: 多瑙河、黑海
  - label: D
    content: 頓河、黑海。
