  section: 1
  number: 4
  type: single
  page: 1
  stem: 歐洲某半島的龐貝古城是一座背山面海的中小城鎮，於西元79 年8 月因維蘇威火山爆發而滅亡，其被覆於火山灰之下的遺跡成為現代考古學家研究2000 年前羅馬帝國的重要依據，近日考古學家在龐貝古城第九區發現「披薩祖先」的壁畫，發現地點是一處住宅、毗鄰麵包店。儘管龐貝考古團隊認為壁畫中食物「不是披薩」，因為沒有最經典的番茄和馬札瑞拉起司，但指出其可能是現代披薩的遠祖。有關上文的敘述，下列何者為正確選項？
  options:
  - label: A
    content: 某半島是希臘半島
  - label: B
    content: 火山爆發是因板塊的擠壓
  - label: C
    content: 當時的主要風向為西風
  - label: D
    content: 文中面海是指面臨大西洋。
