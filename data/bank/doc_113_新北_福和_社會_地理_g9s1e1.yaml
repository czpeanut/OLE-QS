  group_stem: "新舊世界葡萄酒\n    新世界與舊世界葡萄酒最早是從釀酒歷史上區分的。“舊世界”主要指法國、意大利、西班牙、葡萄牙、希臘等有著幾百年歷史的傳統葡萄酒釀造國家。而“新世界”則指美國、阿根廷、南非、澳大利亞等新興的葡萄酒釀造國家。他們大多位於南、北緯30—42\
    \ 度之間，擁有十分適合釀酒葡萄種植的自然條件。冬暖夏涼、雨季集中於冬春而夏秋乾燥的氣候以及優質的土壤等自然條件，讓這些國家在葡萄酒種植和釀造上佔有先天的優勢。從法國、義大利、西班牙三國葡萄酒年產量近乎占世界葡萄酒生產總量的60%便可見一斑。\n\
    \    在釀酒歷史悠久而又注重傳統的舊世界產區，它們崇尚傳統，從葡萄品種的選擇到葡萄的種植、採摘、壓榨、發酵、調配到陳釀等各個環節，都嚴守詳盡而牢不可破的規矩，尊崇著幾百年乃至上千年的傳統，甚至是家族傳統。舊世界葡萄酒產區必須遵循政府的法規釀酒，每個葡萄園都有固定的葡萄產量，產區分級制度嚴苛，難以更改，用來釀制銷售的葡萄酒更只能是法定品種。正由於處處受法規的檢驗，舊世界葡萄酒才一直深受大眾肯定與喜愛。\n\
    \  “舊世界”中論品質，法國是老大，名牌較多，常是炒酒投資人關注的主角；論數量，義大利酒佔據霸主地位，因為官方容許的每畝地葡萄產量可以很高，葡萄汁濃度可以相應降低。"
