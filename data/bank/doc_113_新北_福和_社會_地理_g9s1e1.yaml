  type: single
  page: 2
  stem: 西伯利亞鐵路是世上最長的鐵路，全長9,288 公里，橫跨歐亞大陸。從首都莫斯科色彩繽紛的東正教教堂到遠東地區太平洋岸的夫拉迪沃斯托克港，途中極致的景色是有號稱「湛藍之眼」的貝加爾湖，一站站的美景吸引著遊客的心，使它成為旅人心目中的夢想鐵道。請問：乘坐這條鐵路從歐洲出發，經過俄羅斯甲～丁的主要工業區，如(圖四)依序為何？
