  stem: 台灣是歐盟電動輔助自行車的第一大進口國家，看好電動車的銷售前景，美利達公司策畫部門認為相較於傳統自行車，電動自行車更符合短鏈供應的就地生產，因為很多零組件在歐洲，當地生產可縮短供應鏈之外，也因為接近市場，生產完成後，隔天就可配送到當地店家。台灣的自行車業者若考量到勞力成本且近歐洲市場，右圖(七)中何處是最佳設廠地點？
