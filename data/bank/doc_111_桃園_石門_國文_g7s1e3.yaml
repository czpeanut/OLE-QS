  stem: 對本文的理解，下列何者最正確?
  options:
  - label: A
    content: 英國直至葡萄牙公主嫁入並帶來茶葉後，英國人才認識茶葉
  - label: B
    content: 茶葉貿易受東印度公司壟斷，使得其他國家無法與英國競爭
  - label: C
    content: 為解決茶葉稅額高昂的問題，英國人決定在全國栽種茶樹
  - label: D
    content: 英國茶起初專屬於上流社會，至十九世紀後才開始普及化。
  group_stem: "英國茶文化緣起\n 雖說現在英國幾乎和紅茶畫上了等號，但真要說起來，他們其實是歐洲最後一批認識茶葉的國度。16 世紀末，茶葉第一次藉由英國東印度公司水手之手被帶至英國本土。但當時茶葉仍算是珍奇玩意，等到17\
    \ 世紀，當葡萄牙公主嫁至英國，事情才有了轉變，在她的帶領與眾人的追捧之下，茶葉瞬間成為「英國上流社會」最夯飲品，並被納入東印度公司的進口貿易項目中。不過因為高昂的稅，初期茶葉大抵仍是中上層社會專屬，勞工階層若想一品茶的味道，只能尋求其他途徑，於是茶葉走私一度成為當時英國最熱門的行業之一。為了解決這問題，英國首相便在1874\
    \ 年調整茶葉稅稅額，加上英國在殖民地印度與斯里蘭卡大規模栽種茶樹，紅茶正式走入平民階層，並以飛快速度普及至整個英國社會，創造了驚人的飲用量，甚至成為英國優雅生活象徵之一，時至今日，許多英國人仍深信茶葉具有「療癒」效果，能有效舒緩生理、心理上的各種不適。"
  answer:
  - D
  answer_source: answer_key_vlm
  tags:
