  section: 1
  number: 25
  type: single
  page: 2
  stem: 針對民初的政治發展，蔣中正曾感慨說：「這是我國民革命過程中一大頓挫。八年剿匪之功……幾全毀於一旦。而西北國防交通、經濟建設，竭國家社會數年之心力，經營敷設，粗有規模，經此叛亂，損失難計。」請問：蔣中正感慨哪一事件帶來的損失？
  options:
  - label: A
    content: 八年抗戰爆發
  - label: B
    content: 九一八事變
  - label: C
    content: 西安事變
  - label: D
    content: 溥儀成立滿洲國。
