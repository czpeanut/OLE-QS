  type: single
  page: 2
  stem: 中華民國政府建立於西元1912 年，中間歷經了內憂與外患，遲至西元1947 年才頒行憲法。西元1948 年，在國民大會的選舉下，國家終於有了第一位行憲後的總統。請問：中華民國的第一任正式大總統與行憲後的首任總統分別為何人？
