  type: single
  page: 1
  stem: 中國共產黨展開「兩萬五千里長征」，意思是他們撤離原本的根據地，到新的據點繼續發展。請問：為何中國共產黨需要發動這樣的「兩萬五千里長征」？
  options:
  - label: A
    content: 因為西安事變後需與國民黨聯合抗日
  - label: B
