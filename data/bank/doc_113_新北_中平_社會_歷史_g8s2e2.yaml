  stem: 「多米諾骨牌理論」（domino theory）是由美國政府於冷戰時期所提出的國際關係理論。現在用於比喻時，「多米諾骨牌效應」通常指一系列的連鎖反應，即「牽一髮而動全身」，小小的變動最終導致一個巨大的結果。就右圖剪報內容而言，何者「不是」推動此事件發生的骨牌變因？【閱讀素養題】
