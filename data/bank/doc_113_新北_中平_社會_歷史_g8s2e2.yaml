  section: 1
  number: 31
  type: single
  page: 2
  stem: 在《我的前半生》這本自傳中，一位歷史人物自白：「這時占據著我全心的，不是這塊土地的老百姓死了多少人，不是日本人要用什麼辦法統治這塊殖民地，要駐多少兵，要採什麼礦，我一概不管，……日本人利用我，我也利用日本人。」請問：這位歷史人物應為何者？
  options:
  - label: A
    content: 蔣中正
  - label: B
    content: 溥儀
  - label: C
    content: 張作霖
  - label: D
    content: 毛澤東。
  tags:
    chapter:
      publisher: 翰林
      book: 八下
