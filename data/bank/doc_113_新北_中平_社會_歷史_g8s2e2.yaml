- id: doc_113_新北_中平_社會_歷史_g8s2e2_s1_30
  section: 1
  number: 30
  type: single
  page: 2
  stem: 在抗戰結束後，國共衝突再起並且日益嚴重，國民政府原本擁有軍事優勢，而中共最終卻能由劣勢轉為優勢，請問：最可能原因為何？
  options:
  - label: A
    content: 中共喊出「中國人不打中國人」的口號得到大多數人認同
  - label: B
    content: 國民政府宣布動員戡亂，限制人民自由引起人民反感
  - label: C
    content: 中共的土地改革政策獲得地主的經濟支持
  - label: D
    content: 國民政府官員貪汙，加上嚴重的通貨膨脹大失人心。
