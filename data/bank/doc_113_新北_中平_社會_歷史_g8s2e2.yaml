- id: doc_113_新北_中平_社會_歷史_g8s2e2_s1_27
  section: 1
  number: 27
  type: single
  page: 2
  stem: 在描述「中日戰爭」這段歷史的時候，我們可以依據戰爭局勢的發展，將戰爭分成前期、後期。在戰爭前期，中國獨自對日本作戰，政府遷往大後方；戰爭後期，中國終於取得奧援，獲得勝利不再遙不可及。依照上述，中日戰爭最可能以哪一個歷史事件作為前、後期的分水嶺？
  options:
  - label: A
    content: 南京大屠殺
  - label: B
    content: 珍珠港事變
  - label: C
    content: 開羅會議
  - label: D
    content: 美、英取消在華特權。
