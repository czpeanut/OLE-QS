  stem: 「九一八」歷史博物館始建於西元1991 年5 月，於「九一八」事變六十週年之際正式對外開放，原本館名為「九一八」事變陳列館，主體建築即為如今博物館標誌性建築-殘歷碑。西元1995
    年第一次擴建，西元1999 年新館落成並對外開放，同時更名為「九一八」歷史博物館。如欲實地參觀這個博物館，應前往附圖中的何處？【閱讀素養題】
