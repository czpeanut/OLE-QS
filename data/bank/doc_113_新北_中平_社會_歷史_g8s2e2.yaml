- id: doc_113_新北_中平_社會_歷史_g8s2e2_s1_26
  section: 1
  number: 26
  type: single
  page: 2
  stem: 東亞與日本的近現代歷史發展，關係密不可分且交互影響。因此，老師希望同學針對日本的發展史進行討論，下列哪一位同學的說法「錯誤」？
  options:
  - label: A
    content: 甲生：日本因為工業化發展，為了取得更多資源，促成了軍國主義的興起
  - label: B
    content: 乙生：日本之所以能崛起，主要是因為明治維新後國力漸強
  - label: C
    content: 丙生：第二次世界大戰前，日本經濟己經高度發展，沒有受到經濟大恐慌影響
  - label: D
    content: 丁生：日本在東亞取得了很多殖民地，像是臺灣、澎湖跟朝鮮等。
  tags:
