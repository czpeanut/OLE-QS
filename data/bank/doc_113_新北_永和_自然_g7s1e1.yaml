- id: doc_113_新北_永和_自然_g7s1e1_s2_40
  section: 2
  number: 40
  type: single
  page: 4
  stem: 文章中呈現的現象(甲)，應會牽涉到下列何種現象原理？ 【2-3】
  options:
  - label: A
    content: 鹽的擴散作用
  - label: B
    content: 水的滲透作用
  - label: C
    content: 鹽的分解作用
  - label: D
    content: 脂肪的合成作用
  group_stem: '(四)

    減肥迷思~易胖體質，連喝水都會胖？

    水是六大養分之一，卻常被人忽視它的重要性。人體每一個細胞都包含著水並被水環繞，體內水平衡是攸關性命的大事，倒不是因為水比起其他養分來得重要，而是因為人體沒有足夠儲存水分的地方。

    喜歡吃重鹹或重口味的人，經常會遇到喝水會胖的窘境，主要是因為吃太多鹽分，人體內的細胞常需要避免體內鹽分濃度過高而保留水分，這樣的結果，常常會導致身體出現水腫的現象(甲)，然而，這不是真的「肥胖」。但如果您喝的是「有熱量」的水，就會因為增加熱量攝取造成體重上升，例如：含糖飲料、含油湯汁、酒、加糖或奶精咖啡、果汁等。

    肥胖是許多慢性疾病發生的危險因子，因此，減肥常成為重要的健康議題。然而，喝水和減肥有什麼關係呢？水約佔人體體重的50％～75%，是維持人體新陳代謝必需的重要物質，而喝水也能增加脂肪代謝，並促進細胞消耗脂肪而產生能量(乙)。一般而言，飲用白開水能提高靜止代謝率（身體在完全靜止狀態時所需的最低代謝率）；若餐前30
    分鐘喝水，有助於增加飽足感與降低飢餓感，從而減少進食量、幫助體重控制，而喝夠水也能預防便秘發生，因此，若想要瘦下來，喝水真的太重要了！

    改寫自 臺安醫訊第304 期《我好想瘦！減肥要喝多少水？》

    請回答第40.至42.題。'
