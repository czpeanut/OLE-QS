- id: doc_113_新北_永和_自然_g7s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 已知氧氣在血液中的運輸，絕大部分是依賴紅血球。紅血球內具有血紅素，能夠與氧氣結合，並藉此帶到身體各部位的組織細胞。依據成熟紅血球的細胞構造特性，其內血紅素與氧氣結合的反應，應是發生在紅血球細胞的何處？
