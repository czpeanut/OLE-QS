  stem: 依據阿維的實驗設計與觀察紀錄，應可推知下列何項為其實驗的控制變因？ 【1-2】
  options:
  - label: A
    content: 水溫
  - label: B
    content: 光照的顏色
  - label: C
    content: 水蘊草的重量
  - label: D
    content: 產生氣泡的體積
  group_stem: '(五)

    阿維的科學小研究

    阿維知道水蘊草進行光合作用會產生難溶於水的氧氣。他便思考有哪些因素影響光合作用的效果，經過許多變因的測試，他整理可能影響實驗的變因之後，便依據實驗目的設計實驗，將來源、重量、葉片數等皆相同的水蘊草，放入裝有池水的四根試管（甲、乙、丙、丁），再用試管塞塞緊（如圖十三），接著對各試管持續照光1
    小時，並維持相同的光照強度。試管內池水pH 值在實驗前皆為6.5（pH 值小於7 為酸性，數字越小表示酸性越強），阿維並將實驗變因操控與結果整理如表四。

    請回答第43.至47.題。


    表四

    | 組別 | 甲 | 乙 | 丙 | 丁 |

    | :--- | :---: | :---: | :---: | :---: |

    | 光照前水溫控制 | 30℃ | 30 ℃ | 30 ℃ | 20 ℃ |

    | 照射各試管的色光種類 | 紅光 | 綠光 | 藍光 | 紅光 |

    | 產生氣泡體積 | 3 毫升 | 0.1 毫升 | 2.2 毫升 | 1 毫升 |

    | 實驗後試管內池水 pH 值 | 7.2 | 6.6 | 7.0 | 6.8 |'
  shared_asset: g2_43_47
