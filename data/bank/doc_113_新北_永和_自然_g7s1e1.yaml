- id: doc_113_新北_永和_自然_g7s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 阿泰發現白蘿蔔塊在不同溶液中浸泡一段時間，有的會膨脹，有的會皺縮。於是他假設「白蘿蔔塊浸泡在濃度較高的溶液，會出現皺縮的情形」，若要驗證他的假設是否合理，下列何種實驗設計的方式，結果較無法用來驗證他的假設？
    【1-2】
  options:
  - label: A
    content: 實驗設計1：從同一條白蘿蔔切出大小相同的兩個白蘿蔔塊，一塊浸泡在濃食鹽水，另一塊浸泡在稀食鹽水。
  - label: B
    content: 實驗設計2：從同一條白蘿蔔切出大小相同的兩個白蘿蔔塊，一塊浸泡在食鹽水，另一片浸泡在純水。
  - label: C
    content: 實驗設計3：從同一條白蘿蔔切出大小相同的兩個白蘿蔔塊，一塊浸泡在濃糖水，另一塊浸泡在純水。
  - label: D
    content: 實驗設計4：取大小相同的白蘿蔔塊和馬鈴薯塊各一，將白蘿蔔塊與馬鈴薯塊分別浸泡在不同濃度的食鹽水。
