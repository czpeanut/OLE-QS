- id: doc_113_新北_永和_自然_g7s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 關於生物圈的描述，下列何者較適當？ 【1-1】
  options:
  - label: A
    content: 生物圈為一恆定的範圍
  - label: B
    content: 生物圈內的物體皆能表現生命現象
  - label: C
    content: 生物圈僅含海洋與陸地
  - label: D
    content: 目前生物圈的範圍厚度約為20000 公尺
- id: doc_113_新北_永和_自然_g7s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 自虎克首度描述生物細胞之後，歷經顯微鏡的性能改良，科學家們發展出細胞學說，其重要內容為下列何項所述？ 【2-1】
  options:
  - label: A
    content: 細胞是生物體構造與功能的基本單位
  - label: B
    content: 動、植物細胞皆能表現所有的生命現象
  - label: C
    content: 細胞的生長發育皆需要陽光、空氣、水
  - label: D
    content: 生物細胞皆具細胞核、細胞質與細胞膜
- id: doc_113_新北_永和_自然_g7s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 小玲設計實驗想要驗證「植物的莖會朝有光的方向生長」的想法；則其實驗中的操作變因最可能為下列何項？ 【1-2】
