- id: doc_113_新北_永和_自然_g7s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: '表一為複式顯微鏡的目鏡與物鏡組合，若是以四種組合觀察同一個玻片標本，在皆不調整其它構造的條件下，下列何項描述較適當？ 【實驗1-1】


    表一

    | 組別 | 目鏡 | 物鏡 |

    | :---: | :---: | :---: |

    | 甲 | 10X | 10X |

    | 乙 | 10X | 4X |

    | 丙 | 15X | 4X |

    | 丁 | 15X | 40X |'
  options:
  - label: A
    content: 甲組視野所看見的實際範圍最廣
  - label: B
    content: 乙組視野的亮度最小
  - label: C
    content: 丙組視野中的細胞數目最多
  - label: D
    content: 丁組視野中的細胞最大
