- id: doc_113_新北_永和_自然_g7s1e1_s2_48
  section: 2
  number: 48
  type: single
  page: 5
  stem: 「多顏色活細胞標誌」這項技術較可能是處理在細胞的何種構造？ 【2-2】
  options:
  - label: A
    content: 細胞核
  - label: B
    content: 粒線體
  - label: C
    content: 細胞壁
  - label: D
    content: 液胞
  group_stem: '(六)

    神奇的斑馬魚

    2022 年4 月，一篇發表在《自然》雜誌上的論文，提出了一種新的細胞分裂方式：無合成分裂。研究人員以斑馬魚作為實驗材料，透過一種名為「多顏色活細胞標誌」的技術，將其遺傳物質進行改造，使得目標組織的每一顆細胞，能隨機表現出不同的顏色，從而能追蹤、分辨不同的細胞，用來探討個體成熟或組織再生等涉及大量細胞的動態過程。

    斑馬魚的皮膚和人類的皮膚基本構造類似，唯一的不同是人類的皮膚外層是死細胞，而斑馬魚皮膚的外層是活細胞。經由縮時攝影，研究團隊觀察到斑馬魚幼魚身體表面，具有許多能夠進行細胞分裂的表皮細胞，這些表皮細胞沒有經過遺傳物質的複製，就直接進行分裂，故稱為無合成分裂，並且，一個表皮細胞最多會分裂２次，變成４個細胞。

    研究團隊推測，此種分裂是為了因應幼魚快速成長而存在，以簡易有效率的模式產生足夠的表皮細胞，並且，無合成分裂會根據身體的需求進行調整，具大量表皮細胞需求的部位，能分裂產生較多的細胞。然而，斑馬魚如何啟動無合成分裂？目前仍未清楚，但團隊發現似乎和皮膚所受到表面張力的變化有關，而斑馬魚皮膚細胞的細胞膜，具有偵測張力變化的蛋白質通道，當施加藥物影響這些通道而干擾某種特殊物質的進出時，該分裂也會受到影響，但詳細機制仍不明。請回答第48.至50.題。'
