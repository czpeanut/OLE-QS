- id: doc_113_新北_永和_自然_g7s1e1_s2_31
  section: 2
  number: 31
  type: single
  page: 3
  stem: 依據本文，下列何種構造是細菌細胞中產生能量的構造？
  options:
  - label: A
    content: 細胞質
  - label: B
    content: 粒線體
  - label: C
    content: 細胞膜
  - label: D
    content: 細胞壁
  group_stem: '(二)

    你知道「________」嗎？

    原核生物包含一般細菌以及可行光合作用的藍菌，它們絕大多數都是單細胞生物。這類生物的細胞大小約為1～10 微米（$\mu$m），由於缺乏核膜，故不具細胞核，可以說是遺傳物質位於細胞質內；此外，這類生物的細胞中缺乏各種由膜構成的微小構造，如液胞、粒線體或葉綠體等；更特別的是，它們的細胞膜除了能夠控制物質進出，也能將養分轉換為細胞所需的能量，而在細胞膜的外側，還有著和植物細胞同樣具有的細胞壁構造，只是二者的細胞壁成分不同而已。

    而植物、動物以及部分單細胞生物等，這些生物的細胞大小約為10～100 微米（$\mu$m），並具有細胞核與各種有膜的微小構造，便稱為真核生物。然而，真核生物包括的生物種繁多，生物體組成也相當複雜，單就細胞的層級而論，真核生物的細胞也不一定都具有細胞壁或葉綠體等構造。請回答第31.至33.題。'
