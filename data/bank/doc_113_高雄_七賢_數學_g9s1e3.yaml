  stem: 下列敘述何者不一定正確？
  options:
  - label: A
    content: 若 $a$ 為奇數，則 $a^{2}$ 亦為奇數。
  - label: B
    content: 若有三個整數成等差數列，則此三數的和必為3的倍數。
  - label: C
    content: 已知 $a$、$b$ 為任意數，若 $a^{2} > b^{2}$，則 $a > b$。
  - label: D
    content: 若 $a > 0$，$b > 0$，則 $\sqrt{a} + \sqrt{b} > \sqrt{a + b}$。
  answer:
  - C
