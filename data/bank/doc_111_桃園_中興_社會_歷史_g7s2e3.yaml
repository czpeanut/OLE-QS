- id: doc_111_桃園_中興_社會_歷史_g7s2e3_s1_22
  section: 1
  number: 22
  type: single
  page: 3
  stem: 太武新村是臺灣本土少數能連結某場戰役的歷史景點，因此園區裡設有戰爭故事館；根據上述資料，這個故事館應該是什麼名稱？
  options:
  - label: A
    content: 二二八故事館
  - label: B
    content: 八二三故事館
  - label: C
    content: 古寧頭故事館
  - label: D
    content: 韓戰故事館
  group_stem: "資料一：\n    太武新村建於民國 53 年，是軍方將戰爭中落在金門的砲彈變賣興建而成，建築特色為獨門獨院、單幢四拼、二層樓磚造平屋頂的建築，是仿美軍顧問團宿舍的美式風格，為桃園地區少見的眷村建築，並以金門地標太武山為名，以為紀念，眷舍主要是配給曾駐防金門，而且參與過戰爭的陸軍將校級軍眷；於民國98\
    \ 年登錄為歷史建築，經桃園市政府文化局於109 年9 月將僅存3 幢10 戶修復開放。\n    太武新村位於大溪區河西地區，距離大溪老街約2 公里遠；戰爭故事館開館後，內部為常設展示空間，藉助專業史學研究，梳理太武新村與金門之近代史，從軍旅及其家眷尋常生活的角度，將嚴肅的政治軍事史轉化為動人的故事。\n\
    （改寫自桃園觀光導覽網）\n資料二：\n    桃園市的眷村有86 處，數量僅次於台北與高雄，全國名列第三。市府有意保留眷村的文化與歷史記憶，幾乎每年舉辦眷村文化節，如太武新村眷村文創園區、馬祖新村眷村文創園區與憲光二村，打造為桃園眷村鐵三角，是認識桃園眷村文化的指標地點。\n\
    \    太武新村眷村文創園區的前身為太武新村，是一處提供給駐防金門並參與戰爭的高階軍官及其眷屬居住，以金門最高峰太武山命名。太武新村建於1964 年，仿美軍宿舍格局，為獨門獨院、單棟四拼的兩層樓磚造建築。眷村原有25\
    \ 棟建築共計100 戶，現僅留存7 棟28 戶，2009 年登錄為歷史建築，2020 年將其中3 棟整修後對外開放，也就是目前園區的模樣。\n（改寫自網路文章）"
