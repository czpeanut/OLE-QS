- id: doc_111_桃園_中興_社會_歷史_g7s2e3_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 從上面資料可知，臺灣麵食文化的興起，和「亞洲情勢丕變」有關，請問指的應該是下列哪一歷史事件？
  options:
  - label: A
    content: 國共內戰
  - label: B
    content: 古寧頭戰役
  - label: C
    content: 韓戰
  - label: D
    content: 八二三炮戰
  group_stem: "早期臺灣以米食為主，以麵粉製成的糕、餅，只被當作點心；臺灣從原本米食為尊型態，蛻變成米麵共食的習慣，歷經美國的推波助瀾。民國39 年6\
    \ 月，亞洲局勢丕變，美國提供臺灣軍事與經濟援助，輸入麵粉與小麥、黃豆等農產品。許多民眾便將美援麵粉製成麵條，烹煮食用，緩解物資匱乏的狀態。\n    民國42\
    \ 年，政府出於策略考量，停止從美國進口麵粉，直接輸入小麥，同時發展民生工業，鼓勵各界設置麵粉廠，本地麵粉產量呈現直線上升，必須設法推廣麵食，鼓勵消費麵粉。後來試圖改變民眾飲食習慣，與美方及麵粉業者成立麵麥食品推廣指導委員會、麵麥食品推廣執行委員會，大力宣揚麵食營養價值高過稻米，還有助身體健康。委員會在各地舉辦各類麵食示範表演會，當場製作西餐、饅頭、花捲、水餃、小籠包、蔥油餅等；再安排專業師傅巡迴講授製作方法與技巧，並且廣設麵食課程，成立烘培技術訓練班，傳授西點麵包、蛋糕與各類麵食的製作技術。這些麵食推廣活動受到廣大迴響，也讓臺灣麵食風氣歷久不衰。\n\
    （改寫自關鍵評論網－飲食習慣重大轉折：臺灣民眾如何從「唯米是糧」到「米麵共食」？）"
