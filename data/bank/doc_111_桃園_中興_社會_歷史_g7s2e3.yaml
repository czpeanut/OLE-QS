  group_stem: '資料一：

    「黑暗觀光」（dark tourism）一詞在民國85 年提出，曾在歐美地區興起一段時間。「黑暗觀光」是指人們在曾發生過戰爭、災難、屠殺等黑暗事件的地點，進行旅遊活動。這種旅遊型態，因其旅行地點的「特殊」，因而成為吸引觀光客的賣點，更為觀光地區帶來可觀的收入。（資料來源：林潤華，傷痛與觀看：淺談「黑暗觀光」）

    資料二：

    位於金門縣古崗村古崗湖東南方的翟山坑道，全長有101 公尺、寬約6 公尺、高約3.5 公尺，裡頭的水道呈A 字型。翟山坑道建立於民國50 年，因應當時的兩岸情勢而建，提供登陸小艇搶灘運送補給用，全程人工開鑿而成，共耗時5
    年才完成，坑道內還有設計讓船隻停泊的碼頭。（資料來源：金門縣政府觀光處）'
