    （改寫自桃園觀光導覽網）\n資料二：\n    桃園市的眷村有86 處，數量僅次於台北與高雄，全國名列第三。市府有意保留眷村的文化與歷史記憶，幾乎每年舉辦眷村文化節，如太武新村眷村文創園區、馬祖新村眷村文創園區與憲光二村，打造為桃園眷村鐵三角，是認識桃園眷村文化的指標地點。\n\
    \    太武新村眷村文創園區的前身為太武新村，是一處提供給駐防金門並參與戰爭的高階軍官及其眷屬居住，以金門最高峰太武山命名。太武新村建於1964 年，仿美軍宿舍格局，為獨門獨院、單棟四拼的兩層樓磚造建築。眷村原有25\
    \ 棟建築共計100 戶，現僅留存7 棟28 戶，2009 年登錄為歷史建築，2020 年將其中3 棟整修後對外開放，也就是目前園區的模樣。\n（改寫自網路文章）"
