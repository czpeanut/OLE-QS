  group_stem: '請在閱讀完下列短文之後，回答43.~44.題：

    祁家威先生是我國的性別平權運動者。在我國同性婚姻合法化之前，他曾經多次嘗試透過各種程序與同性結婚。1986 年，他到臺北地方法院公證結婚遭拒，於是他便向立法院提出(甲)，表達希望立委能修改法規，讓同性可以結婚，卻仍遭拒絕。2013
    年，他與男伴到臺北市的戶政機關登記結婚，結果被以「結婚必須一男一女」為由，再度遭到拒絕。祁家威認為戶政機關的處分決定讓他權益受損，遂向臺北市政府提出(乙)，遭到駁回，他再向法院提起(丙)，可惜最後判決的結果依然讓他失望。

    不過祁家威並不因此氣餒，2015 年，他在民間團體與律師們的協助下，向司法院聲請釋憲。2017 年，司法院受理他的聲請，並在5 月24 日作出釋字第七四八號解釋。該解釋認為，當時某部法律只規範讓不同性別的二人之間得以締結婚姻，卻未讓相同性別的二人得以締結婚姻，與《憲法》保障平等權的意旨有違，因此認定該法律相關規定違憲。該解釋要求立法機關應該要在兩年內處理，以便保障同性伴侶的權益。

    兩年後，立法院三讀通過《司法院釋字第七四八號解釋施行法》。自稱「等這天等了四十一年多」的祁家威以及同志族群們，終於可以和心愛的人結婚了。'
