- id: doc_113_高雄_陽明_社會_g9s2e2_s3_45
  section: 3
  number: 45
  type: single
  page: 9
  stem: 45. 依據上文第二段之內容，京都當局為杜絕旅客隨意進入私人土地，最終採用下列何種手段解決此問題？
  options:
  - label: A
    content: 刑罰制裁
  - label: B
    content: 民事賠償
  - label: C
    content: 行政管制
  - label: D
    content: 保護處分。
  group_stem: '請在閱讀完下列短文之後，回答45.~47.題：

    日本素有觀光大國的美稱，但隨著疫情後國際旅遊復甦、以及(甲)日圓匯率走勢等影響，大量觀光客湧入，已在多個旅遊勝地釀成觀光公害的亂象。所謂「觀光公害」，意指因旅客湧入觀光勝地，導致該地區無法負荷，引發當地生活品質下降、對環境或文化遺址造成破壞等負面影響。

    充滿文化與藝術氣息的京都祇園，至今仍(乙)保留傳統的日本藝伎文化，然而許多外國遊客會在未經許可下持續騷擾、跟拍藝伎，或擅自闖入屬於當地居民私人土地的「私道」，失禮行為大大影響舞伎們的人身安全與地區居民的安寧。剛開始，京都當局僅在京都祇園主要街道以(丙)張貼宣導海報的方式，勸導遊客不要隨便闖入私人土地、任意對藝伎拍照，然而卻始終無法阻止旅客的越界行為。為了保障藝伎和當地居民的安全和隱私，當局不得不祭出新規範：自2024
    年4 月起，祇園私道將全面禁止遊客進入。

    另一日本名勝富士山，每年7 至9 月登山季總吸引大量登山客拜訪，但隨之而來的植被毀損、垃圾清運、廁所超負荷等環境壓力問題，促使山梨縣議會通過新條例，於2024
    年7 月起，對每位登山客收取2000日圓的入山費。然而此措施卻造成不少登山客與海外遊客改由免費入山的靜岡縣路線攀爬富士山，讓靜岡縣為了救助登山客而疲於奔命；因此靜岡縣為了保證登山客安全與遏止攀登亂象，宣布於2025
    年也開始徵收入山費，每人必須繳4000 日圓才能進入富士山。

    此外，日本首座被列為世界文化遺產的姬路城，每年吸引國內外觀光客造訪，卻也因此產生古蹟毀損的隱憂。2024 年姬路市市長召開會議對外表示，未來觀光客門票將調漲四倍，由7
    美元調漲至30 美元，希望減少過多的遊客，並運用門票收入維護歷史古蹟。

    (丁)在面對龐大觀光商機的同時，觀光公害問題卻也層出不窮，顯示日本政府也正苦思如何取得平衡，避免引起當地居民的民怨，以及減少對環境的破壞。'
