  type: single
  page: 10
  stem: 48.嘉鴻依第二則新聞內容及我國中央政府組織職權作出下列相關之推論，何者有誤？
  options:
  - label: A
    content: 報導中之法規修正案，是由立法院三讀通過
  - label: B
    content: 行政院向立法院提出覆議案，須經總統核可
  - label: C
    content: 在野黨多數優勢，是指在國會中佔多數席次
  - label: D
    content: 若覆議失敗，行政院長得呈請總統解散國會。
  group_stem: '請在閱讀完下列短文之後，回答48.~50.題：

    2024 年我國國會職權修法引發大眾關注，嘉鴻為了更瞭解此政治議題之發展始末，蒐集了相關新聞報導資料，並依時間先後作了以下摘要整理：


    | 序號 | 內容摘要 |

    | :--- | :--- |

    | 第一則新聞 | 《立法院職權行使法》、《刑法》等部分條文修正案於5 月28 日三讀通過，明定藐視國會罪、總統國情報告常態化、出席聽證會不得虛偽陳述，以及不得反質詢、被質詢人不得拒絕答覆或拒絕提供資料等。
    |

    | 第二則新聞 | 行政院6 月6 日宣布，5 月底通過之《立法院職權行使法》及《刑法》條文修正案，經研議後認定條文窒礙難行，將提出覆議案。但在野黨多數優勢下，恐難覆議成功。
    |

    | 第三則新聞 | 立法院於6 月21 日表決行政院對國會職權修法提出的覆議案，場外分別有「青鳥行動」和「藍鷹行動」支持民眾集結到場聲援，青鳥行動表達支持覆議案，藍鷹行動則力挺國會改革。
    |

    | 第四則新聞 | 國會職權修法在歷經覆議失敗後，憲法法庭於10 月25 日做出113 年憲判字第9 號判決，關鍵條文多屬違憲或部分違憲。其中牽涉總統國情報告、調查權和聽證會的罰則等法條皆失其效力。
    |'
