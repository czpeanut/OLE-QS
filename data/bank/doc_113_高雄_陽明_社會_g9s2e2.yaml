  stem: 1.在古代，船舶航行於茫茫大海中，常需要一些外觀、位置不會時常改變的固定物來幫助辨識方向，此類固定物稱為海標，其中，在中國較特殊的海標便是佛塔，圖一即是以佛塔作為海標的航海示意圖。根據圖一內容判斷，若該圖的右側是北方，有一艘船看到位於正前方的佛塔後，當航行至甲的位置時，便知道該準備向左轉以駛入進港航道，此時位於甲的該船應注意避開哪個方位的礁石？
