  stem: '以下是有關原住民正名運動的報導：

    原住民是臺灣原來的主人，卻被冠以「蕃」、「山胞」等帶有歧視的名稱，日治時代甚至在官方文件出現「生蕃」、「熟蕃」字眼。西元 1984 年12 月29 日，一群原住民知識分子成立「原住民族權利促進會」，掀起原住民擺脫汙名、捍衛權益的第一波浪潮，希望作為自我認同與擺脫汙名的開始，進而要求社會接受原住民族才是這塊土地的主人。

