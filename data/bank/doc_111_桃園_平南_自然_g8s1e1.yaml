  group_stem: 氮的液態稱為液態氮，在一大氣壓，溫度-196℃以下會形成液態氮；若對氮氣加壓，就可以在更高的溫度下形成液態氮。人體在沒有保護措施的狀態下接觸液態氮，皮膚會有嚴重凍傷的危險。液態氮可用來低溫保存臍帶血、精子、卵子或其他活體組織，也可以用來迅速冷凍製造冰品，還可以用來除滅紅火蟻。
