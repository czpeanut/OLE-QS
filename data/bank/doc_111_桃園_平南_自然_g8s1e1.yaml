    content: 黑糖溶解質量:A<B=C
  - label: B
    content: 黑糖溶解度:A<B=C
  - label: C
    content: 黑糖重量百分率濃度:A<B<C
  - label: D
    content: 黑糖溶液顏色深度:A<B<C。
