- id: doc_111_桃園_平南_自然_g8s1e1_s1_1
  section: 1
  number: 1
  type: tf
  page: 1
  stem: （1）擴散現象
  options:
  - label: A
    content: 正確
  - label: D
    content: 錯誤
  group_stem: 放學一進家門，柯吉霸就聞到廚房傳出來煮水餃的香味，原來是晚餐要吃酸辣湯餃。柯吉霸想到這就是老師課堂上說的：『（1）擴散現象』。擴散現象是粒子會從（2）溫度高的區域移向溫度低的區域，慢慢的整個房間都聞到煮水餃的香氣了。媽媽說等到水餃浮起來，代表水餃熟了，就可以用撈勺(或濾網)撈起來。妹妹聽到了覺得很好奇，為何水餃會浮起來﹖柯吉霸說這是因為煮熟的水餃（3）體積變大，（4）密度也變大造成的。柯吉霸認為用濾網撈水餃就跟（5）加熱蒸發結晶的實驗原理一樣，都是利用（6）水受熱氣化的原理。不一會兒，熱騰騰的水餃出爐了。伴隨著酸辣夠勁的湯頭，全家一起大飽口福，享用媽媽特製的美味晚餐。
