  stem: 承 19，實驗發現；水溫越高，可以溶解的黑糖越多。若將 19 題所述黑糖溶液稱為 A 狀態；將 A 狀態溶液加熱到 40℃(假設水未蒸發)，發現沉澱下來的黑糖恰好完全溶解，此時稱為
    B 狀態；將 B 狀態溶液繼續加熱到 60℃(假設水未蒸發)稱為 C 狀態。請問，關於 A、B、C 狀態之敘述，下列何者正確﹖
  options:
