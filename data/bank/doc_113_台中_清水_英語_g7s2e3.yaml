  group_stem: 'On a December evening in 1955, Mrs. Rosa Parks made a change in the
    lives of black people in the USA. That day, she was tired from work. She took
    the bus home and sat in the seats for "people of color." At that time, the seats
    near the front were all for white people, and the back seats were for people of
    color.

    Later, the bus stopped at a theater. A few white people came on, but there weren''t
    enough seats for them. So, the bus driver went to Rosa and three other African
    Americans and said to them, "Let me have your seats." The three African Americans
    stood up and walked to the back, but Rosa didn''t. Then the police came and took
    her to the police station.

    In those days, people of color might lose their lives because they didn''t follow
    the rules of the "white" world. But Mrs. Rosa Parks stood up and fought for her
    rights. After that, many African Americans followed Rosa and stood together for
    their rights, too. Rosa Parks really made a change in the lives of African Americans.

