  type: single
  page: 3
  stem: Which is NOT true about Hsinbyume Pagoda?
  options:
  - label: A
    content: It is a black temple.
  - label: B
    content: It is a special temple.
  - label: C
    content: It is a famous temple.
  - label: D
    content: It is a beautiful temple.
  group_stem: 'Hsinbyume Pagoda is a temple in Myanmar. It''s well known around the
    world because it''s beautiful and special—it''s all white.

    Besides the building, the story behind the Hsinbyume Pagoda is beautiful, too.
    The building''s name comes from Hsinbyume, the first wife of Prince Bagyidaw.
    They fell in love in 1808, but sadly, Prince Bagyidaw lost her just four years
    later. He was very sad, so he built the temple for the love of his life.

    In 1838, an earthquake damaged the temple, and King Mindon repaired it in 1874.
    The building now may have a different look from the old one, but the love story
    behind it never changes.

