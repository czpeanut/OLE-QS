  stem: 根據上文，可以推測伴隨這波強降水，衍生出的下列各種災害，何者錯誤？
  options:
  - label: A
    content: 淹水
  - label: B
    content: 土石流
  - label: C
    content: 森林大火
  - label: D
    content: 通訊中斷。
  group_stem: ◎2021 年 7 月中旬西歐出現破百年紀錄的降水量，萊因河、默茲河、阿爾河等河川決堤，造成比利時、德國、荷蘭與盧森堡等地區災情四起，其中以德國西部受損最為嚴重。該極端災害的發生是由於地球南北兩極溫度上升的速度，是赤道的兩到三倍，這削弱中緯度地區的高速氣流（Jet
    Stream），基本上這些氣流都在歐洲上空。尤其在夏、秋兩季，高速氣流的減弱會產生連鎖反應，導致移動速度較慢的暴風雨於西歐上空滯留數日。(地理圖四)為歐洲
    7 月 11 日至 17 日累積雨量與該周長期平均雨量的百分比，請問：(14~15 題)
  shared_asset: g1_14_15
  answer:
