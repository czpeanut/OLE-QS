- id: doc_113_高雄_苓雅_社會_公民_g7s2e1_s1_45
  section: 1
  number: 45
  type: single
  page: 1
  stem: 小浩參加學校的公民知識競賽，競賽的主題是「社會文化」，他選擇「說明強勢文化與弱勢文化的關係」這道題目。由小浩的選題判斷，他應該如何回應才恰當？
  options:
  - label: A
    content: 弱勢文化比強勢文化更具有經濟資源的優勢
  - label: B
    content: 強勢文化通常會逐漸擴張，使弱勢文化式微
  - label: C
    content: 弱勢文化的位階通常會高於強勢文化的位階
  - label: D
    content: 強勢文化容易對自我傳統文化產生認同危機。
- id: doc_113_高雄_苓雅_社會_公民_g7s2e1_s1_46
  section: 1
  number: 46
  type: single
  page: 1
  stem: 每個人都希望能生活在有秩序的社會中，因此發展出各種社會規範來約束個人的行為。下列針對「風俗習慣」的相關敘述，哪一項內容有誤？
  options:
  - label: A
    content: 風俗習慣是社會中相沿成習的慣例
  - label: B
    content: 成年禮、葬禮等各種生命儀式屬於風俗習慣
  - label: C
    content: 違反時會受到良心的譴責及社會輿論的批評
  - label: D
    content: 風俗習慣具有強制力，可約束人的外在行為。
- id: doc_113_高雄_苓雅_社會_公民_g7s2e1_s1_47
  section: 1
  number: 47
  type: single
  page: 1
  stem: 關於文化的敘述，下列何者完全正確？
  options:
  - label: A
    content: 每個社會中的文化不盡相同，但卻擁有完全相同的生活習慣
  - label: B
    content: 每個社會中皆有「主流文化」與「次等文化」，可增加文化多樣性
  - label: C
    content: 來到臺灣定居的新住民帶來新的文化，使臺灣的文化內涵更多元
  - label: D
    content: 在不同文化中，完全無法找出共通點。
- id: doc_113_高雄_苓雅_社會_公民_g7s2e1_s1_48
  section: 1
  number: 48
  type: single
  page: 1
  stem: '同學在討論自己平常聽的音樂，由以下他們的聊天內容，可觀察到何種文化現象？

    小龍：南韓音樂就是厲害，女團跳舞都很好看。

    小葉：韓劇配的主題曲超好聽，很多首我都會唱。

    小柔：大家都在聽韓文歌，聽臺語歌、客家歌謠的應該是異類吧。'
  options:
  - label: A
    content: 在地傳統文化產生抵抗反擊
  - label: B
    content: 強勢文化藉媒體或商品行銷
  - label: C
    content: 文化位階透過殖民方式強化
  - label: D
    content: 異國文化在本地較難進行交流接觸。
