- id: doc_113_高雄_苓雅_社會_公民_g7s2e1_s1_42
  section: 1
  number: 42
  type: single
  page: 1
  stem: '附表是慈慈在學習文化相關議題時整理的比較表，甲、乙為主要的概念，根據內容判斷，此議題最可能為下列何者？


    | 概念 | 甲 | 乙 |

    | :--- | :--- | :--- |

    | 特點一 | 資源豐沛 | 資源較少 |

    | 特點二 | 強調其優越感，容易造成文化不平等現象 | 產生對自我傳統文化的認同危機 |

    | 舉例 | 美國電影 | 臺灣電影 |'
  options:
  - label: A
    content: 強勢文化與弱勢文化的關係
  - label: B
    content: 生活背景對文化差異的刺激
  - label: C
    content: 文化制約對社會秩序的影響
  - label: D
    content: 主流文化與次文化的並存。
