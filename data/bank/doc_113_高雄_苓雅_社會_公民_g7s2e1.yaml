- id: doc_113_高雄_苓雅_社會_公民_g7s2e1_s1_50
  section: 1
  number: 50
  type: single
  page: 1
  stem: '傑凱未詳查引用的資訊，因此撰寫的主題報告錯誤百出，如附圖所示，其內容當中只有哪一畫雙底線處完全正確？

    主題：次文化

    (甲)次文化是指被社會上多數人認同的價值、信仰和規範等，(乙)次文化的「次」是代表次等的意思，(丙)與主流文化有高低優劣的分別。(丁)青少年次文化是指這個年齡層獨具的文化，例如：青少年共通的流行語等。'
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
- id: doc_113_高雄_苓雅_社會_公民_g7s2e1_s1_51
  section: 1
  number: 51
  type: single
  page: 2
  stem: 科技發展能使資訊的傳播與獲取更有效率，但如濫發垃圾郵件、個人隱私外洩、不實資訊充斥等都會造成個人及公眾利益的損害。由上述科技發展所產生的利與弊，顯示當前社會應更注重下列哪一層面的提升？
  options:
  - label: A
    content: 尊重多元文化
  - label: B
    content: 推動性別平權
  - label: C
    content: 保障人性尊嚴
  - label: D
    content: 遵守科技倫理。
- id: doc_113_高雄_苓雅_社會_公民_g7s2e1_s1_52
  section: 1
  number: 52
  type: single
  page: 2
  stem: '三位同學看見路邊有人在虐待流浪狗，分別從不同社會規範的觀點出言制止，以下是他們的說法：

    大翰：「這樣子很殘忍，難道你希望別人也如此對待你嗎？」

    小晉：「別欺負小狗，否則會受因果報應，下輩子輪迴後換你被欺負！」

    阿登：「你再繼續這樣做，我就要報警讓你接受刑罰的制裁。」

    關於三位同學的說法，下列何項敘述最適當？'
  options:
  - label: A
    content: 大翰提及的社會規範內容限制了人民的權利
  - label: B
    content: 小晉提及的社會規範內容屬於道德層面的約束
  - label: C
    content: 阿登提及的社會規範內容是經由立法院三讀通過
  - label: D
    content: 三人提及的社會規範皆可透過公權力約束人民。
- id: doc_113_高雄_苓雅_社會_公民_g7s2e1_s1_53
  section: 1
  number: 53
  type: single
  page: 2
  stem: 在青菜國的博物館裡，正在展示來自世界各地的藝術品，並且特別設立了一個區域展示本地的傳統藝術，使本土文化能夠讓世界認識。博物館裡特別設立傳統藝術展示區，其主要目的為何？
  options:
  - label: A
    content: 減少文化衝突
  - label: B
    content: 肯定自我文化
  - label: C
    content: 維護文化多樣性
  - label: D
    content: 增加文化對立。
- id: doc_113_高雄_苓雅_社會_公民_g7s2e1_s1_54
  section: 1
  number: 54
  type: single
  page: 2
  stem: 在臺灣，泰雅族、賽德克族等民族的傳統習俗中，「文面」代表成年及其成就的標記，族人若沒有文面，將無法得到其他族人的尊敬及認同，更無法論及婚嫁。下列何者是以欣賞的態度，對傳統習俗提出評價？
  options:
  - label: A
    content: 文面就是刺青，是古代犯人被刑罰的象徵
  - label: B
    content: 少數團體的次等文化，會對漢人造成威脅
  - label: C
    content: 文面是具特色的文化，讓臺灣文化更豐富
  - label: D
    content: 此類文化已不符主流價值，應該加以淘汰。
