- id: doc_113_高雄_苓雅_社會_公民_g7s2e1_s1_57
  section: 1
  number: 57
  type: single
  page: 2
  stem: '鈴婕看到以下的新聞報導，下列敘述何者較符合他所接收到的意涵？

    快報摘要  總統接見伊斯蘭教團體時表示，我國尊重不同宗教的自由與發展，臺灣社會持續努力增進友善伊斯蘭教教徒的措施與環境，例如：增設祈禱室供教徒使用、有超過
    300 家的餐廳通過清真認證，讓教徒安心飲食，希望透過宗教文化與全世界的穆斯林朋友互相交流、深化感情。'
  options:
  - label: A
    content: 伊斯蘭教為我國信仰的主流文化，民眾深受影響
  - label: B
    content: 外來宗教須入境隨俗，更改教義與傳統儀式
  - label: C
    content: 本土宗教應肯定自身價值，注重文化的傳承
  - label: D
    content: 多元社會包容不同文化，維護文化的多樣性。
- id: doc_113_高雄_苓雅_社會_公民_g7s2e1_s1_58
  section: 1
  number: 58
  type: single
  page: 2
  stem: '瑄瑄在社群媒體看到以下的評論，可以用來解釋為什麼需要社會規範的存在。根據內容判斷，下列何者最符合她想表達的論點？

    颱風假   每到颱風季節，地方首長最頭痛的就是要決定「放不放颱風假？」。以前颱風來時，如果雇主要求勞工上班，勞工拒絕可能會被扣薪水，或是必須折抵一天休假，因此經常造成勞資爭議。但現在颱風假上班或不上班已經制定明確的規定和標準，只要宣布放颱風假，勞工沒有出勤的話，雇主不得視為曠工、扣獎金或是將其解僱。若前往上班者，雇主必須加付工資，並且提供交通工具的津貼。'
  options:
  - label: A
    content: 減少文化間的差異，以防產生文化位階
  - label: B
    content: 破除刻板印象，避免歧視行為的發生
  - label: C
    content: 保障工作權益，有利於促進性別平權
  - label: D
    content: 建立共同遵循的準則，能夠減少紛爭。
- id: doc_113_高雄_苓雅_社會_公民_g7s2e1_s1_59
  section: 1
  number: 59
  type: single
  page: 2
  stem: '以下為慈慈在社群網站的留言，根據內容判斷，下列何者可以解釋劇情中所發生的情節？

    臺劇分享：○○養成記    前幾天看了一部連續劇，劇情提到女主角讀國小的時候，跟班上同學講臺語，結果被班長記名處罰的往事。我媽媽說，那也是她小時候的記憶，為了遵守當時政府的規定，大家都要說國語，如果說其他母語就好像是做了什麼錯事，感覺很羞愧、很丟臉。'
  options:
  - label: A
    content: 多數社會只推崇單一文化的延續
  - label: B
    content: 強勢文化擴張造成文化位階
  - label: C
    content: 風俗習慣使得文化之間存在差異性
  - label: D
    content: 人類社會的文化有高低優劣之分。
- id: doc_113_高雄_苓雅_社會_公民_g7s2e1_s1_60
  section: 1
  number: 60
  type: single
  page: 2
  stem: "以下為珊珊報告的部分內容，根據內容判斷，她想表達的應是臺灣社會呈現出的何種現象？\n  在臺灣能夠感受到聖誕節的溫馨、齋戒月的神聖、豐年祭的熱鬧盛大、元宵節鹽水蜂炮的刺激。\n\
    \  在臺灣可以跳嘻哈街舞、可以手舞布袋戲、可以用二胡拉一曲德國作曲家帕海貝爾的卡農。\n  在臺灣吃得到客家粿仔條、美式漢堡、印度烤餅、越南生春捲、韓式泡菜口味的比薩。"
  options:
  - label: A
    content: 少數族群文化面臨式微
  - label: B
    content: 傳統文化缺乏創新動力
  - label: C
    content: 對外來文化持刻板印象
  - label: D
    content: 維護世界文化的多樣性。
