  stem: 關於本文，下列說明何者有誤？
  options:
  - label: A
    content: 「得失利病，萃於一官」：所有的得失利弊，聚集在諫官身上
  - label: B
    content: 「當志其大，舍其細」：應該記著重大事情，而捨棄細微末節
  - label: C
    content: 「彼汲汲於名者，猶汲汲於利也，其間相去何遠哉」：追逐名利者和諫官的品行是天差地遠
  - label: D
    content: 「嘉祐八年，刻著於石」：自嘉祐八年，諫官開始把不肖者的名字刻在石上，做為後世警惕
  group_stem: "古者諫無官，自公卿大夫至於工商，無不得諫者。漢興以來，始置官。夫以天下之政，四海之眾，得失利病，萃於一官。使言之，其為任亦重矣。居是官者，當志其大，舍其細；先其急，後其緩；專利國家，而不為身謀。彼汲汲於名者，猶汲汲於利也。其間相去何遠哉！\n\
    \    天禧初，真宗詔置諫官六員，責其職事。慶曆中，錢君始書其名於版。光恐久而漫滅，嘉祐八年，刻著於石。後之人將歷指其名而議之曰：「某也忠，某也詐，某也直，某也曲。」嗚呼！可不懼哉！\n\
    （司馬光〈諫院題名記〉）"
