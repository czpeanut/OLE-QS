- id: doc_113_新北_崇林_國文_g9s1e1_s2_49
  section: 2
  number: 49
  type: single
  page: 6
  stem: 關於本文，下列說明何者最恰當？
  options:
  - label: A
    content: 自2018 年起，事實查核組織數量的成長幅度遠遠低於前幾年，顯現其成長逐漸趨緩
  - label: B
    content: 2019 年後，事實查核組織的新增數量大幅衰退。活躍組織多數經營時間都在六年內
  - label: C
    content: 2020 年之前，非洲、亞洲和北美洲事實查核組織的數量皆呈現顯著成長
  - label: D
    content: 土耳其、埃及、寮國、緬甸、菲律賓的新聞自由皆被評比為「非常嚴重」
  group_stem: "數位時代，資訊的製造與傳播皆極為快速，事實查核也變得格外重要。美國杜克大學記者實驗室（Duke Reporters’ Lab，以下簡稱記者實驗室）日前發布2023\
    \ 年〈全球事實查核組織調查報告〉。該報告指出，綜觀過去十多年，事實查核組織的數量顯著增加。從2008 年僅有11 個組織，到2022 年增加至424 個組織；2023\
    \ 年則有417 個活躍的事實查核組織。記者實驗室認為，即使世界各國愈來愈擔心被各種政治或媒體勢力操弄，導致危險騙局與謠言，然而過去十五年來事實查核領域的進展卻已趨緩，且變得更加艱難。\n\
    \n2023 年世界各國活躍的事實查核組織數量大致與前兩年相同。\n2019 年的新增查核組織數量有66 個，2022 年新增11個，2023 年截至6 月則僅新增1\
    \ 個。\n    從地區的角度來看，2020 年之前，非洲、亞洲、歐洲和南美洲的事實查核組織出現了顯著成長。與此同時，北美洲的事實查核開始趨緩。從那時起，事實查核運動在世界大部分地區趨於穩定。然而，在世界的一些重要角落，仍然很難獲得真實新聞訊息。\n\
    \    無國界記者組織公布〈2023 年世界新聞自由指數（World Press Freedom Index）〉將31 個國家的新聞狀況評為「非常嚴重」，也就是最缺乏新聞自由的國家。其中的15\
    \ 個國家沒有任何事實查核機構。分別是科威特（Kuwait）、寮國（Laos）、尼加拉瓜（Nicaragua）、北韓（North Korea）、俄羅斯（Russia）、葉門（Yemen）等。另一方面，「非常嚴重」名單上中還有印度、中國、土耳其、巴基斯坦、埃及和緬甸等，即便擁有多個事實查核機構，但由於新聞自由受到限制，這些國家的事實查核機構必須在其他地區工作，並選擇匿名或以外籍人士的身分進行查核，以保護自己或家人。\n\
    \  事實查核組織如嬰兒潮般大幅成長的時代已經過去了。自2019 年66 個事實查核組織大量上線以來，每年新組織的數量都在逐漸下降。2021 年的新組織數量為19\
    \ 個，成長率與三年前相比下降了71%。疫情可能是導致成長趨緩的重要因素。記者實驗室指出，事實查核領域中，有幾乎一半的組織已經活躍了五年或更長時間；而其中大約50\
    \ 個組織，甚至已經有十年或更長時間的歷史。但整體而言，活躍的事實查核組織平均經營不到六年，不活躍的139 個組織甚至不到三年就關閉。\n（改寫自卓越新聞電子報〈假訊息持續蔓延，全球事實查核成長卻已趨平緩〉2023\
    \ 年07 月）"
