  - label: B
    content: 多情自古傷離別，更那堪，冷落清秋節！今宵酒醒何處？楊柳岸，曉風殘月。→絕句
  - label: C
    content: 相見時難別亦難，東風無力百花殘。春蠶到死絲方盡，蠟炬成灰淚始乾。→古詩
  - label: D
    content: 蛾兒雪柳黃金縷。笑語盈盈暗香去。眾里尋他千百度。驀然回首，那人卻在，燈火闌珊處。→律詩
