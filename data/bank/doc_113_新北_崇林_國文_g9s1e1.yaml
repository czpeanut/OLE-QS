- id: doc_113_新北_崇林_國文_g9s1e1_s2_44
  section: 2
  number: 44
  type: single
  page: 5
  stem: 文天祥初見杜如風時說：「可是奉命殺我麼？我早已準備好了，下手吧」一語，下列何者最可呼應文天祥心境？
  options:
  - label: A
    content: 化了浮萍也是愁，莫向天涯去
  - label: B
    content: 壯志飢餐胡虜肉，笑談渴飲匈奴血
  - label: C
    content: 王師北定中原日，家祭無忘告乃翁
  - label: D
    content: 粉骨碎身渾不怕，要留清白在人間
  group_stem: "下文改寫自倪匡《夜遁》，描寫南宋末年，杜如風與眾豪俠深入元軍營救文天祥的過程。請閱讀後回答下列問題：\n\n    只見內室十分小，一個人，背對門而坐，正在燈上展卷讀書，神態安詳，杜如風忙叫道：「文大人！」那人鎮定地道：「可是奉命殺我麼？我早已準備好了，下手吧！」\n\
    \  杜如風見到了文丞相，激動得身子都在發抖，他忙道：「大人，小民杜如風，是特地來帶大人出險的！」文天祥緩緩轉過身來，望著杜如風，微笑著道：「原來是杜義士，久仰大名。」杜如風忙道：「大人快走，稍遲恐來不及了！」\n\
    \  文天祥撩衣起立，杜如風挽住了他的手，兩人從內室中，退了出來，也就在此際，只聽得外面鼓噪了起來，有人叫道：「大家小心，有人混了進來，已有四位兄弟遭了毒手！」杜如風一驚，忙道：「宋大叔，你們一出去，就帶著文大人上樓，爬上屋面，沿繩子爬回去，我來擋敵人！」\n\
    \  就在杜如風向前衝去之際，鍾登天、宋進，擁著文大人，和白月明、宋玉兒，轉上了樓梯。他們一上了樓，立時從窗中，攀了出去，向對屋迅速移去。\n  在甬道中，杜如風長劍霍霍，已經刺死了三人，可是他的腿上，卻也吃了一刀。而且，敵人也已聞訊趕來，吶喊之聲響徹全宅，連已經到了對面屋中的幾個人，也全可以聽到。他們略呆了一呆，大力負起了文天祥，迅速地從園子的另一邊牆中攀了出去。\n\
    \  杜如風還在血戰，他已經傷了好幾處，可是長劍揮動，還是沒有人能近他身。弓箭手自四面八方，湧了過來，箭如雨下，杜如風像受了傷的猛虎一樣，一面揮劍格擋著，一面衝向前去，身中了十餘箭之多。\n\
    \  他兀立著，喘著氣，身子挺得很直，手中仍然握著劍，鮮血順著劍尖，一滴滴向下跌來。圍住他的數十人，明知他受了重傷，但是卻沒有人敢近他的身。"
