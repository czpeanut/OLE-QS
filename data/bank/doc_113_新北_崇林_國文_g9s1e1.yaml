  group_stem: "【甲】碧雲天，黃葉地。秋色連波，波上寒煙翠。山映斜陽天接水，芳草無情，更在斜陽外。\n   黯鄉魂，追旅思，夜夜除非，好夢留人睡。明月樓高休獨倚，酒入愁腸，化作相思淚。\
    \ （范仲淹〈蘇幕遮〉\n【乙】燎沉香，消溽暑。鳥雀呼晴，侵曉窺檐語。葉上初陽乾宿雨，水面清圓，一一風荷舉。\n   故鄉遙，何日去？家住吳門，久作長安旅。五月漁郎相憶否？小楫輕舟，夢入芙蓉浦。\
