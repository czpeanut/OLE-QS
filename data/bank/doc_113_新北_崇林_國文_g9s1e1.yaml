    \  就在杜如風向前衝去之際，鍾登天、宋進，擁著文大人，和白月明、宋玉兒，轉上了樓梯。他們一上了樓，立時從窗中，攀了出去，向對屋迅速移去。\n  在甬道中，杜如風長劍霍霍，已經刺死了三人，可是他的腿上，卻也吃了一刀。而且，敵人也已聞訊趕來，吶喊之聲響徹全宅，連已經到了對面屋中的幾個人，也全可以聽到。他們略呆了一呆，大力負起了文天祥，迅速地從園子的另一邊牆中攀了出去。\n\
    \  杜如風還在血戰，他已經傷了好幾處，可是長劍揮動，還是沒有人能近他身。弓箭手自四面八方，湧了過來，箭如雨下，杜如風像受了傷的猛虎一樣，一面揮劍格擋著，一面衝向前去，身中了十餘箭之多。\n\
    \  他兀立著，喘著氣，身子挺得很直，手中仍然握著劍，鮮血順著劍尖，一滴滴向下跌來。圍住他的數十人，明知他受了重傷，但是卻沒有人敢近他的身。"
