- id: doc_112_彰化_埤頭_社會_公民_g8s2e1_s2_11
  section: 2
  number: 11
  type: single
  page: 1
  stem: 阿美和阿俊在逛街時，指著名牌包跟阿俊說要買，阿俊也隨口答應了下次再買給阿美，但其實只是隨便答話，並沒有要買的效應。但若要追究法律責任，下列對阿俊的法律責任的敘述何者正確？
  options:
  - label: A
    content: 若阿俊未成年，即不須負侵權行為責任
  - label: B
    content: 若阿俊有過失，即無須損害賠償
  - label: C
    content: 屬於履行約定，須負起債務不履行責任
  - label: D
    content: 屬侵權行為，須負起損害賠償責任。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
- id: doc_112_彰化_埤頭_社會_公民_g8s2e1_s2_12
  section: 2
  number: 12
  type: single
  page: 1
  stem: 與房客在簽訂契約時，房東會要求不可以破壞屋內結構和家具，否則扣房客押金。租期結束，房客會將租屋整理好後退還給房東，但房客正常使用所造成的耗損是房東需負擔的成本，因此房東不可因牆面退色要求房客補刷。房東不直接扣房客押金，而是先退讓房客整筆金額賠償原則。此原則是基於何種民事相關概念？
  options:
  - label: A
    content: 遵守買賣契約
  - label: B
    content: 金錢賠償原則
  - label: C
    content: 解除租賃契約
  - label: D
    content: 回復原狀原則。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
