    content: 依契約自由原則，該契約是成立且可執行
  - label: B
    content: 依誠信原則，安東尼奧應履行該契約
  - label: C
    content: 該契約的內容違反公序良俗，故契約無效
  - label: D
    content: 因該契約攸關人命，故須要以要式契約簽約才行。
