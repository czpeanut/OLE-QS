  section: 2
  number: 21
  type: single
  page: 2
  stem: 小花網購衣服，但網站一直顯示未接受訂單，經過詢問後才知道，兩年前他曾下單卻又未取貨，被店家列入黑名單。關於上述事件，下列敘述何者正確？
  options:
  - label: A
    content: 小花兩年前下單卻未取貨，須負起契約不履行責任
  - label: B
    content: 店家未接受小花網購的訂單，是因為契約違背公序良俗
  - label: C
    content: 網購店家不接小花的訂單，須負侵權行為的責任
  - label: D
    content: 在網路上購物必須等到收取貨並付款完成後，契約才成立。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
