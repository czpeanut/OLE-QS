  number: 18
  type: single
  page: 1
  stem: 莎士比亞著名著作《威尼斯商人》中主角安東尼奧向高利貸的商人夏洛克借款 300 枚金幣，雙方並約定若日後安東尼奧還不出 300 枚金幣，就要割下身上一磅肉作為抵償。若上述內容發生在我國，依照民法規定，下列敘述何者正確？
