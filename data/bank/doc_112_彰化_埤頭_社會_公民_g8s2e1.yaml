  section: 2
  number: 13
  type: single
  page: 1
  stem: 阿國在某部落客網誌看到一則貼文：某買家的父母想要退回孩子在一年前偷買的高級音響，他們主張自己的孩子僅 15 歲，思慮未周詳……。此貼文的留言部分出現網友正反兩方的論戰，由內容來看，下列說明何者正確？
  options:
  - label: A
    content: 該名家長可依法要求退貨
  - label: B
    content: 該客戶是屬於無行為能力人
  - label: C
    content: 買家購買時有取得家長同意
  - label: D
    content: 該名客戶是未成年單身人士。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
