  stem: '以下是某戲劇的大綱，依據我國民法規範的類型判斷，對於文中(甲)～(丁)的性質，下列敘述何者正確？

    男主角家境貧困，為了償還父母(甲)背負的債務，進入財閥工作。後來捲入財閥(乙)家族親屬之間對於(丙)繼承遺產的紛爭，不幸遭到暗殺。後來輪迴轉世為財閥家的幼子，卻保留前世的記憶。為了找出謀害前世自己的兇手，長大後他開始(丁)收購各個家族成員持有的公司股票，逐步掌控整個財閥。'
