- id: doc_112_彰化_埤頭_社會_公民_g8s2e1_s2_10
  section: 2
  number: 10
  type: single
  page: 1
  stem: 由於金錢的借貸可採取口頭的方式成立契約，但遇到對方不還錢，沒有紙本資料很難有證據證明，因此如果不想傷感情的話，盡量以轉帳或匯款的方式，留下金流紀錄，可做有利證據。前文提到證據，主要是與借貸屬於下列何種概念有關？
  options:
  - label: A
    content: 書面契約
  - label: B
    content: 一般契約
  - label: C
    content: 消滅時效
  - label: D
    content: 誠實信用原則。
