  section: 2
  number: 17
  type: single
  page: 1
  stem: 一名新娘不滿協助化妝的新娘秘書（簡稱新祕）提醒她要提供新祕團隊在婚宴時的午餐，覺得被強迫請客，因此直接要求新祕退費，打算另外找新的新祕合作，並傳一張警察局的照片，表示不退費就報警的意思。如果你是新娘的朋友，下列何種建議較符合法律觀念？
  options:
  - label: A
    content: 趕快報警，給那個新祕一個教訓
  - label: B
    content: 這是消費糾紛，警察不主動介入
  - label: C
    content: 不退錢就拖他們去調解委員會
  - label: D
    content: 直接告上法院，能很快得知結果。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
