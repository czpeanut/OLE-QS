  stem: '以下是阿國整理民事糾紛解決方法的比較表，其中哪些項目是正確的？

    | 項目 | 調解 | 和解（訴訟外和解） | 和解（訴訟上和解） |

    | :--- | :--- | :--- | :--- |

    | 運作 | 公正第三人居中調解，作成調解書，送(甲)民事契約 | 雙方溝通後達成(乙)民事契約 | (丙)當事人在一起法官前達成和解協議 |

    | 效力 | (丁)結果無法強制執行 | 確定判決 | (戊)等同確定判決 |

    | 執行 | (己)判決結果無法強制執行 | 若不履行可，提起訴訟 | 可以強制執行，不能再提訴訟 |'
