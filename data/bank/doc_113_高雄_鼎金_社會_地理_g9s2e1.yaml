  type: single
  page: 1
  stem: 全臺近8成的草莓都種在苗栗大湖(種植面積約600公頃)，大湖可以說與草莓畫上了等號，又稱為「草莓之鄉」。關於大湖地名的由來，清咸豐7年(西元1857年)銅鑼鄉農墾戶吳氏父子倆，赴法雲寺西南觀音山山區狩獵，站在高崗遠眺四面山嶺環繞，山谷間平疇綠野，雲霧飄渺，茅草、蘆葦隨風搖曳恰似一湖波浪滔滔，甚為壯麗。吳氏父子稱此地為窩湖，後稱「大湖」。請問：根據以上的敘述，「大湖」的等高線型態最接近下列何者？
