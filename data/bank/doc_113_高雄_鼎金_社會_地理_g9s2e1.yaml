- id: doc_113_高雄_鼎金_社會_地理_g9s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 「中正路」、「中山路」為全臺灣最常見的路名之二，截至2023年初，臺灣共有316條中正路。中正路與中山路的命名，得回溯到國民政府遷台初期，為紀念國家偉人、宣揚政權意識並同時消除日本統治色彩，遂重新命名些許地區。請問：下列哪一個地名更改的時代與中正路、中山路相似？
  options:
  - label: A
    content: 「半線」改為「彰化」
  - label: B
    content: 「錫口」改為「松山」
  - label: C
    content: 「打狗」改為「高雄」
  - label: D
    content: 「三塊厝」改為「三民區」。
