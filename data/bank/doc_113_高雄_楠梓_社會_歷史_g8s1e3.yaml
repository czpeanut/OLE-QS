  section: 1
  number: 26
  type: single
  page: 1
  stem: "下圖為西元1902 年法國的政治諷刺漫畫。圖中圈起來的人物代表新興的某國，右方為該國當時重要思想家的言論。請問：該國思想家言論中的□□、○○不應該填入下列何者？\n\
    \n該國思想家的言論：\n  作為當今之策，我國不應猶豫，與其坐等鄰國的開明，共同振興亞洲，不如脫離其行列，而與西洋文明國共進退。對待□□、○○的方法，也不必因其為鄰國而特別予以同情，只要模仿西洋人對他們的態度方式對付即可……我們要從內心謝絕亞細亞東方的壞朋友。"
  options:
  - label: A
    content: 清國
  - label: B
    content: 朝鮮
  - label: C
    content: 琉球
  - label: D
    content: 以上皆非
