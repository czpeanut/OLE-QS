  stem: 「歷史學之父」希羅多德在這部作品中，追求真實，實地勘察許多地方，記載人的事蹟，而非寫成一部神話般的傳說故事。他描繪了他所認為的當時整個已知世界，這不僅是對一場戰爭的描寫，而是描述兩種不同類型的社會之間的衝突，即城邦與亞洲帝國之間，是一場自由與專制的對抗。有關這部作品的敘述，下列何者正確？
