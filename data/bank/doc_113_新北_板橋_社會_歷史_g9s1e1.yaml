  - label: A
    content: 雅典的民主政治是由公民抽籤，輪流擔任城邦官員
  - label: B
    content: 現代的民主政治強調主權在民，人民皆能參與投票
  - label: C
    content: 雅典的民主政治無分男女或奴隸，均有權議決政事
  - label: D
    content: 現代的民主政治，婦女、外來人口皆無法表達意見
