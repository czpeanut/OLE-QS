    個月，每月30 天，年末加上5 天。這種遵循太陽週期的曆法，依自然現象將一年分為『阿赫特』、『佩雷特』、『夏矛』三個季節，有別於同時期兩河流域的月亮週期曆法。」根據上文，「此地區」的發明最可能與下列何者有關？
