  number: 19
  type: single
  page: 1
  stem: 西亞古代某部法典中有以下條文：「任何房屋失火，前來救火之自由民貪取屋主之財物者，此人應投於該處火中；若自由民損毀任何自由民之眼，則應毀其眼；若自由民損毀自由民奴隸之眼，則應賠償其買價之一半。」關於此法典的敘述，下列何者正確？
  options:
  - label: A
    content: 法典為《聖經》
  - label: B
    content: 強調法律之前人人平等的觀念
  - label: C
    content: 與中國「以德報怨」的理念相通
  - label: D
    content: 制定者是巴比倫的國王。
