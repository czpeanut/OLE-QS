- id: doc_111_彰化_福興_社會_公民_g7s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 主辦方舉辦這場活動邀請民眾參與，可視作何種公共意見特性的展現？
  options:
  - label: A
    content: 公開性
  - label: B
    content: 不穩定性
  - label: C
    content: 影響性
  - label: D
    content: 差異性
  group_stem: 『…為拒絕特定媒體散布假消息，破壞台灣民主與社會和諧，民意代表與知名部落客共同合作，舉辦遊行，號召民眾踴躍參與，訴求立法院儘速修法規範，國家通訊傳播委員會亦應嚴格執法。政府相當重視此次遊行代表的民意，承諾將通過相關法規限制此類行為。而不認同這場遊行的反對者則認為，遊行的主張已干涉媒體的監督權，未能以中立立場表達實際現況…』
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
