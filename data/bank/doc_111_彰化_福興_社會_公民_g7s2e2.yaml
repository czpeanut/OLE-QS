  - label: D
    content: 成員缺乏自由意志
  group_stem: '『…長榮空服員2019年罷工，時間長達17天，長榮航班被迫停擺，損失相當慘重，長榮航空向工會12位工會幹部提告，求償3400萬元，台北地院25日判決出爐，認定長榮航空無求償理由，工會及幹部勝訴免賠。工會成員跟律師，聽完判決結果步出地方法院歷經兩年半的審理，總算鬆一口氣也還他們一個公道。

    桃園空服員職業工會監事會召集人胡曉萱：「我從來沒有想過，會被一間這麼大的公司提告3400萬的求償，從我們罷工到現在，我從來沒有懷疑過，我們罷工的合法性，然後今天的宣判結果也證實我們的罷工是合法的。」108年為了爭取提高外站津貼等權益，長榮空服員站出來歷經17天的抗爭，沒人出勤航班被迫停擺，取消了1439架次，影響旅客近28萬人次長榮損失至少30.2億元，長榮損失相當慘重，因此向桃職工會跟12名幹部提告，要求賠償3400萬元不過台北地院審結，判決長榮航空敗訴，全案可再上訴…』'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
