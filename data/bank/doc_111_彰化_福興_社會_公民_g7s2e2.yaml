- id: doc_111_彰化_福興_社會_公民_g7s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 上文中提及的調查，可用來說明公共意見具備的何種特性？
  options:
  - label: A
    content: 差異性
  - label: B
    content: 影響性
  - label: C
    content: 不穩定性
  - label: D
    content: 公開性
  group_stem: 『…政府為保障身心障礙者權益於交通運輸工具設置博愛座，民眾也已培養讓座老弱婦孺的觀念。但近年來，「到底誰能坐博愛座」的爭議卻一再發生，新聞時有報導，部分身體不適的民眾坐上博愛座之後，受到其他乘客嚴厲譴責與驅趕，甚至發生肢體衝突。社群網路和媒體所做民調顯示，許多民眾認為博愛座的設置有廢除或改革的必要，因此許多政府單位開始宣導，博愛座人人可坐，只要是有需要者都能坐…』
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
