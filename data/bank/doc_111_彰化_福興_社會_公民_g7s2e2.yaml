- id: doc_111_彰化_福興_社會_公民_g7s2e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 世界各國的語言之間，存在文化位階的現象，尤以英語最明顯。請問：英語為何在全球取得強勢的地位？
  options:
  - label: A
    content: 英語是最好聽的語言
  - label: B
    content: 英語是最簡單的語言
  - label: C
    content: 以英語為母語的人口最多
  - label: D
    content: 英語國家的政經勢力強大
  group_stem: '『…英美文化在國際間產生主導的作用，不只在台灣，其他各國也可以感受到這樣的一種力量。同時，沒有人能夠忽視或否定挾帶強勢文化的語言力量，美國承襲昔日大英帝國的地位，成為全球的超級強權，它的語言當然也就取得強勢的地位；由此可見，當英語團體的政治、經濟勢力強大時，語言也會脫穎而出；即使就目前的國際現勢來看，美國雖不再居於世界領先地位的絕對優勢，但是它仍然是政治和文化上的強權，而它的語言勢力仍持續在世界各地蔓延。

    台灣人民對於英語強大勢力的回應不一。由於目前英語學習是一股熱潮，對於熱中英語學習者來說，此一現象並非壞事；而對於另一群人而言，語言霸權感受便十分明顯，國內有些非英語教師無奈地表示，在這樣的語言霸權，自己成為一種弱勢。雖然他們急欲在這種語言權力關係中，掙得一席之地，但終究不敵社會文化對英語學習的渴望…』'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
