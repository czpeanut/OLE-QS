- id: doc_111_彰化_福興_社會_公民_g7s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 傳統的新聞媒體，如何傳遞訊息給閱聽人？
  options:
  - label: A
    content: 主要擔任政府的擴音器直接傳達訊息給大眾
  - label: B
    content: 篩選訊息內容，製播新聞給大眾觀看
  - label: C
    content: 由閱聽人自己選擇新聞內容觀看新聞
  - label: D
    content: 由閱聽人製播新聞，再次傳播給大眾
  group_stem: '『…傳統的新聞媒體獲得大量資訊後，經編輯、篩選與刪減，製成新聞傳播給閱聽人。面對大量的資訊，媒體要如何做選擇？由於媒體的主要收入來自於廣告，因此能吸引閱聽人的題材，就是媒體偏好的素材，而媒體的定位和資源也會影響新聞主題的選擇，例如：若媒體受財團控制，就有可能為財團服務，選擇性的傳遞訊息。

    在科技快速發展下，傳統新聞媒體式微與自媒體興盛。從資訊自由化與多元化的角度而言，網路爆料、網路紅人與不限主題的直播，或許是一種進步，但假新聞、不實爆料、網路霸凌、網路公審等有違傳播倫理的行為，不禁讓人質疑「人人都是媒體」的說法，究竟是時代的進步，還是傳播科技引發的新災難？

    傳統新聞媒體的新聞和評論，都要以經過查證的事實為基礎，每則訊息都要對閱聽人負責，然而卻僅有少數的媒體能發揮自律。於是，資訊管制的機制崩壞了，傳播倫理的問題更嚴重。這讓我們不得不省思，在新媒體時代，所謂「新聞」或「評論」是否需要符合傳統新聞專業倫理的要求…』'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
