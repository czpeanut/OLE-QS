  group_stem: 『…網際網路盛行，人與人之間的互動關係也產生新的形態，民眾在社群網站上可隨意加入或退出數個團體，以滿足不同的情感需求，例如買賣物品、遊戲討論、分享生活等等，部分團體會舉辦聚會，成員們見面交流，增進彼此情誼。有些團體會特意訂出規範，必須是理念一致的人才能加入…』
