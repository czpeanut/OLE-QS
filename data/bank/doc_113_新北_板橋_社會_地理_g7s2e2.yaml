  stem: 根據上述，烈嶼位於圖三中何處？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
  group_stem: 「烈嶼的對外交通非常不方便，從台灣要到烈嶼，得經過陸海空三關才能抵達，搭車、坐飛機，再搭船，沒有親自跑一趟，不會知道有多困難。烈嶼島上是沒有24
    小時醫院或診所，一但有醫療緊急狀況只能往大金門送，但往往都只能靠船舶，受到天候影響就無法開船。就算立刻開船送過去，把人再從船上扶上車，到署立金門醫院，至少也要一小時，一條命就只剩半條命了。甚至連烈嶼女性生小孩也得挑時間，若碰到天候狀況不佳船隻無法開，那真的是說不上來的困境。」
