- id: doc_113_基隆_銘傳_社會_g8s1e2_s1_32
  section: 1
  number: 32
  type: single
  page: 4
  stem: 上述哪一資料，作者的立場可能支持基督教在中國傳播？
  options:
  - label: A
    content: 資料一
  - label: B
    content: 資料二
  - label: C
    content: 資料三
  - label: D
    content: 無法判斷。
  group_stem: '資料一：1616年，明朝官員沈㴶的〈參遠夷疏〉

    我聽說他們欺騙迷惑小老百姓，常說：「不必祭祀祖宗，只要尊奉天主，就可以上天堂，不會下地獄。」天堂地獄的說法，佛教、道教都有，但是這兩教都主張人要孝順父母、對兄弟友愛，並用天堂地獄的說法來警告不孝順、不友愛、造惡業的人。現在，傳教士勸人不祭祀祖先，是讓老百姓不孝順，這是把中國歷代相傳的倫理道德社會秩序給整個推翻。

    資料二：1616年，明朝官員徐光啟的〈辯學章疏〉

    我一直跟傳教士研究討論學術，知道他們的道理正確，操守嚴格，學問淵博。他們學說以昭示上帝、以保救身靈為切要，以忠孝慈愛為功夫，以遷善改過為入門，以懺悔滌除為進修，以升天真福為作善之榮賞，以地獄永殃為作惡之苦報。一切誠訓規條，都符合中國的天理人情。西洋三十幾個國家都奉行這個信仰已一千多年，國家統治穩定，治安良好。

    資料三：1664年，清朝人楊光先的〈闢邪論〉

    按照他們的道理，耶穌是天主，怎會在瑪利亞的肚子懷胎呢？世界上只有禽獸知道母親而不知道父親，看來他們都不知道自己父親是誰囉？他們的教義說信奉的人上天堂，不信的人下地獄。鼓勵人懺悔的佛教，也沒有說悔過之後，罪惡就全消失了啊！如果今天信奉的都是壞人，不信的都是好人，所以作姦犯科的人都可以上天堂嗎？天堂不就都是壞人了？

    ◎ 請根據上列資料，回答第32-34題：'
