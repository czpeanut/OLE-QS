- id: doc_113_新北_土城_社會_g9s1e3_s2_61
  section: 2
  number: 61
  type: single
  page: 6
  stem: 玉米是阿根廷重要的出口品，每年為阿根廷創造出可觀的收入，玉米源自於美洲，但現在卻是大家常常可以吃到的食物，玉米的傳播與哪件歷史事件有關?
  options:
  - label: A
    content: 工業革命
  - label: B
    content: 大航海時代
  - label: C
    content: 宗教改革
  - label: D
    content: 科學革命
  group_stem: "世界盃奪冠能讓人民更幸福嗎?\n      2022 年國際足球總會世界盃於12 月18 日落幕，阿根廷國家隊拿下了最後的冠軍，阿根廷在奪冠後舉國狂歡，但等狂歡的熱潮過後，阿根廷的人民可能又得面對嚴峻的現實。\n\
    \      根據阿根廷政府統計的數據，2022 年全國有30%以上的人民生活在貧窮線之下，全國有將近10%的人口處於失業狀態，雖然人民薪資較前一年提升50%，但同時民生用品的物價也上漲了90%，更糟糕的是，這種情況已經持續了數年。\n\
    \      阿根廷得益於優良的天然環境，能產出高品質且數量可觀的農產品，出口量世界排名第一的大豆，世界排名第二的玉米，世界排名第五的牛肉，為阿根廷賺取可觀的貿易收入，但阿根廷的經濟嚴重依賴出口，易受國際物價漲跌與匯率變動所影響。2016\
    \ 年1 美元能換15 元的阿根廷披索，到了2022 年世界盃開打時已經是1 美元兌換160 元的阿根廷披索。阿根廷農作物所需的化學肥料仰賴國外進口，在匯率的變動下，大幅削減了農產品出口所得的利潤。阿根廷政府雖已在2022\
    \ 年初嘗試控制進口商品以及控管匯率，但仍無法阻止國內的物價飆漲。\n      阿根廷上一次在國際足球總會世界盃奪冠是1986 年，當時的奪冠帶動了阿根廷經濟成長，國內就業人口大幅提升，阿根廷人也希望這次的奪冠，能扭轉阿根廷當前的頹勢。\
    \              資料來源:南一書局 社會雙享報"
