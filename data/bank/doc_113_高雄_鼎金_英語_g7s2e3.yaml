  stem: What is the reading about?
  options:
  - label: A
    content: Opening a coffee shop in a city.
  - label: B
    content: Making money by taking care of cats
  - label: C
    content: A halfway house for cats can help
  - label: D
    content: Taking care of cats is easy.
  group_stem: 'Do you know “Halfway House” for cats? The place gives care and help
    to cats ___(32)___ they have a new home to move in.

    Each day in Taiwan, there are over 100 cats sent to animal shelters and then a
    sad 12-day time starts. If no one wants the cat, it will be killed. Some people
    just can’t stand it, so they started halfway houses for cats. They take care of
    the cats and look for good homes for them.

    In New Taipei City, four women opened a coffee shop as a halfway house. You can
    have a cup of coffee and snacks and enjoy the feelings of cute cats rubbing your
    feet. If someone loves the cat, they can take it home. The four women don’t make
    much money, but they don’t care. They only care if the cats have a warm and safe
    place to sleep.

    We all should love our animal friends and treat them well.


    if 假如

    sent 被送到

    shelter 庇護所

    kill 殺死

    rub 摩擦

    safe 安全的

    treat 對待'
