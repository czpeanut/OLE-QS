  page: 2
  stem: What is the reading about?
  options:
  - label: A
    content: How to ride a bike in the water.
  - label: B
    content: Underwater biking around the world
  - label: C
    content: People need water in an exercise.
  - label: D
    content: Underwater biking is good for people.
  group_stem: 'Do you know the idea of riding a bike in the water? In fact, it is
    not clear who started the exercise, but it is sure Esther Gauthier brought it
    to the USA.

    So ___(27)___ do people ride a bike in the water? Is it a game for people to have
    fun? Of course not. People do it when they are hurt in playing sports. In the
    exercise, a bike is usually 150 centimeters deep in the water. Riding it becomes
    difficult thanks to water resistance, but it gives a massage to the muscle.

    The idea of underwater biking is simple but useful. It can help people become
    healthy again. It will get popular in a lot of countries in the near future.


    clear 清楚的

    hurt 受傷的

    resistance 阻力

    massage 按摩

    muscle 肌肉

    healehy 健康的'
