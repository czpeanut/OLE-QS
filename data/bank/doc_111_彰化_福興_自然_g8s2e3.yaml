- id: doc_111_彰化_福興_自然_g8s2e3_s1_26
  section: 1
  number: 26
  type: single
  page: 3
  stem: '下列為網路上大家關心的一則問與答：

    問：外帶咖啡的塑膠杯蓋會釋放出致癌物質，是真的嗎？

    答：過去咖啡杯蓋的材質多為聚苯乙烯（簡稱PS），由苯乙烯（$\text{C}_{8}\text{H}_{8}$）聚合而成，相關單位已對此材質訂出使用規範，以確保安全。為免疑慮，市面咖啡杯蓋材質已逐漸改成聚丙烯（簡稱PP），聚丙烯是由丙烯（$\text{C}_{3}\text{H}_{6}$）聚合而成。PS和PP都屬於熱塑性聚合物，只要符合規定，消費者正常使用下，尚無安全疑慮。

    關於PS或PP的敘述，下列何者正確？'
  options:
  - label: A
    content: PS和PP都屬於網狀聚合物
  - label: B
    content: PP是由碳水化合物聚合而成
  - label: C
    content: PP是由十多個丙烯分子所組成
  - label: D
    content: PS是由數千個以上的原子所組成
