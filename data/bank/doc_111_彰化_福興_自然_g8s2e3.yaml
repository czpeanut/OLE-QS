- id: doc_111_彰化_福興_自然_g8s2e3_s1_30
  section: 1
  number: 30
  type: single
  page: 4
  stem: 界面活性劑是「具有連結兩種不同物質」的物質總稱，界面活性劑有很多類型，每種類型性質各異，適用於不同的目的，包含清除污垢、使無法混合的物體保持充分混合的狀態等，例如：沙拉醬裡的油和醋不能互相混合，所以可以添加蛋黃中的卵磷脂作為界面活性劑，使兩者可以順利的混合。上述的卵磷脂屬於天然界面活性劑，因此可以自然分解，相較於石化界面活性劑而言，可以大幅減少對大自然的影響。根據上文中的界面活性劑的介紹，判斷下列何者錯誤？
  options:
  - label: A
    content: 肥皂分子在清潔油汙時，便是作為水與油之間的界面活性劑
  - label: B
    content: 添加卵磷脂之後，油和醋會在容器中分層，密度小的物質在上
  - label: C
    content: 卵磷脂的分子結構應該有親油端及親有機酸端
  - label: D
    content: 界面活性劑可依來源分為天然與石化
