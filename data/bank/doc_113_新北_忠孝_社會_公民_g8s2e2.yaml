- id: doc_113_新北_忠孝_社會_公民_g8s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '立法院於2024年7月中三讀通過《詐欺犯罪危害防制條例》（俗稱「打詐專法」），艾克和曉風針對該條例部分內容的討論如附圖。其中，艾克提到「需要承擔刑責，但可以減輕刑責」的情況，最可能是幾歲？

    艾克：那個打詐專法有新增「窩裡反條款」，未來犯罪者自首後，如果自動繳交所有犯罪所得，可減輕或免除其刑，若使警察得以扣押全部犯罪所得，查獲主持操縱者，可免除其刑。

    曉風：如果犯罪者尚未成年，需要承擔刑責嗎？

    艾克：如果犯罪者是限制責任能力人，還是需要承擔刑責，但可以減輕刑責。'
  options:
