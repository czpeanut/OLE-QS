- id: doc_113_新北_忠孝_社會_公民_g8s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 傳統上對於「正義」的概念，往往是藉由刑罰的方式達成的「應報式正義」，或是藉由補償社會的「賠償式正義」。《修復式正義》不同於此，目標並不是在給予加害人痛苦，而是希望加害人在修復過程中，了解被害人的傷痛；《修復式正義》強調要先看到事件中各方的「人」，提供一個安全、平等、尊重的對話空間，討論如何修補傷害。在國外的研究，與傳統刑事訴訟相比較，協議的履行率比較高，受害人可以更快撫平傷痛，而行為人再犯率明顯的降低。請問：上述內容，比較接近制定刑罰的哪一個目的？
  options:
  - label: A
    content: 管制
  - label: B
    content: 處罰
  - label: C
    content: 矯正
  - label: D
    content: 嚇阻。
  tags:
