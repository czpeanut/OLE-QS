- id: doc_113_新北_忠孝_社會_公民_g8s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '新聞報導：元旦時，中部某一路段出現大約30輛車聚集，還有駕駛在匝道附近飆車競速，警方逮到2名飆車的駕駛，因觸犯《刑法》第185條，分別被判處4個月和2個月徒刑。下列選項為大雄對此報導涉及的處分分析，何項正確？

    刑法第185條（節錄）

    1.損壞或壅塞陸路、水路、橋樑或其他公眾往來之設備或以他法致生往來之危險者，處5年以下有期徒刑、拘役或1萬5千元以下罰金。

    2.因而致人於死者，處無期徒刑或7年以上有期徒刑；致重傷者，處3年以上10年以下有期徒刑。'
  options:
  - label: A
    content: 徒刑屬於剝奪生命的刑罰
  - label: B
