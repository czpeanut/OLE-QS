- id: doc_113_新北_忠孝_社會_公民_g8s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 為防止國家刑罰權任意發動，確保人民之基本人權，我國援引拉丁法諺「無法律，無犯罪」「無法律，無刑罰」之精神，揭示：犯罪之成立要件及其法律效果，均須預先明確訂定於法律上，凡行為當時之法律無明文者，任何行為均不構成犯罪，對該行為人亦不得科處刑罰。根據上述內容，此段文字主要在說明下列哪一項基本原則？
  options:
  - label: A
    content: 無罪推定原則
  - label: B
    content: 罪刑法定原則
  - label: C
    content: 誠實信用原則
  - label: D
    content: 不告不理原則。
