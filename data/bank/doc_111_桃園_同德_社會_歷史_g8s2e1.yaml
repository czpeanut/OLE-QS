- id: doc_111_桃園_同德_社會_歷史_g8s2e1_s1_24
  section: 1
  number: 24
  type: single
  page: 1
  stem: 民國元年(1912 年)，中華民國臨時政府在南京成立，但就在同年，政府首都隨即遷往北京。請問：民國元年的遷都，與下列何者最為相關？
  options:
  - label: A
    content: 孫文成為正式大總統
  - label: B
    content: 北伐結束，中國統一
  - label: C
    content: 滿清帝制取代共和
  - label: D
    content: 袁世凱成為臨時大總統。
