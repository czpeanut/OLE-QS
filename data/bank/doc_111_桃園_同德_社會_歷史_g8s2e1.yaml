- id: doc_111_桃園_同德_社會_歷史_g8s2e1_s1_22
  section: 1
  number: 22
  type: single
  page: 1
  stem: 某電視節目提到一段歷史：「…清廷宣布將民間集資興建的鐵路收歸國有。針對民間已投資的部份，所提出的補償措施，在湖南、湖北，投資金額全數償還；在廣東，僅償還60％，其餘則由政府股票支付；在四川，政府僅發給股票作為補償。這種處置引起四川士紳激憤，朝廷為控制動亂，將部分湖北的軍隊調往四川平亂。不料，竟促成了武昌起事。…」根據上文推斷，武昌一地應位於下列哪一個省份境內？
  options:
  - label: A
    content: 四川省
  - label: B
    content: 廣東省
  - label: C
    content: 湖北省
  - label: D
    content: 湖南省。
