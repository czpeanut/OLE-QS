  section: 1
  number: 25
  type: single
  page: 1
  stem: 民國初年，中國許多傳統觀念逐漸產生了變化。請問：下列何者可以反映出民國初年的社會變遷現象？
  options:
  - label: A
    content: 以文言文創作的兒童故事書大量出現
  - label: B
    content: 勞動人口流向城市，城鄉差距越來越大
  - label: C
    content: 通過科舉成為進士的人數越來越多
  - label: D
    content: 婦女高倡「男主外、女主內」主張。
