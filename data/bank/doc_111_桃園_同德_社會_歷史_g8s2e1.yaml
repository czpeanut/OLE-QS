  stem: 「民國成立之後，中國局勢仍然動盪不安，尤其是在〇〇死後，各地的將領擁有軍隊，割據一方，不斷以武力爭奪地盤。他們沒有國家的意識，只有自己的利益，他們甚至以列強作為靠山，利用列強的資助爭奪中央政府的控制權。」請問：根據上述內容判斷，下列哪一件事與上述提及的〇〇最為相關？
