  stem: 小夫同學閱讀《國父們：被遺忘的中國近代史》一書，得知中國有一群以推翻滿清為目標，默默流血流汗的革命志士。請問：根據史實，下列何者的救國之道屬於「革命派」？(甲)康有為
    (乙)袁世凱 (丙)孫文 (丁)宋教仁
  options:
