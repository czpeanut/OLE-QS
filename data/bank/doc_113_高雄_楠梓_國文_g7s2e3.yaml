  - label: B
    content: 德國父母和北歐父母都認為孩子需要大量的戶外活動時間
  - label: C
    content: 土耳其父母認為讓嬰兒不停地哭泣，是匪夷所思的行為
  - label: D
    content: 芬蘭父母相當信任孩子，完全放手讓孩子從小為自己負責。
  group_stem: "（甲）\n    從成為父母的第一天開始，隨著孩子的成長，每一天都是不同的挑戰。我們總是擔心為孩子做得不夠多、做得不夠好，當面對種種教養的疑惑和難題，我們不禁好奇，其他國家的父母會怎麼做呢？\n\
    \    我發現了北歐人認為小孩應該睡在戶外的理由（因為他們認為新鮮空氣和盡量在戶外活動對小孩很好），法國人教剛會走的小孩坐在餐桌前好好吃飯的原因（因為他們希望小孩盡早學會欣賞和感謝食物），還有美國的小兒科醫師為何強調寶寶最好睡在嬰兒床裡（因為他們認為這麼做不只最安全，對小孩的獨立也很重要）並建議家長唸書給小孩聽（以培養小孩的認知和口語能力）。\n\
    \    有時我問家長的問題完全超乎他們的經驗和文化之外，以致於他們一開始根本無法理解我的問題。這是訪談中最有趣、也最發人深省的時刻。一名德國母親感嘆她的小孩幾乎沒時間到戶外活動，其實她的小孩每天有兩小時在戶外玩，大約是美國孩童的十七倍，但在德國家長眼中根本不夠。\n\
    \    我曾經問一名土耳其母親會讓嬰兒哭多久，結果她一臉困惑望著我，因為在她的文化裡，嬰兒必須隨時有人抱著和安撫。我費了一段時間才明白日本家長說我對孩子好像朋友的時候，其實不一定是讚美，因為他們覺得我混淆了朋友（日本人不認為父母親應該是孩子的朋友）和引導者的角色。我應該以孩子的最高利益為考量，指導他們該怎麼做。\n\
    \    每一次訪談都像發現一小塊拼圖，不知道最後會拼出什麼圖案。但我終究還是看出了其他國家和美國到底有哪裡不同。\n── 改寫自克莉絲汀‧葛羅斯-駱 教養無國界導讀\n\
    （乙）\n    不同的文化，形成不同的教養方式。教養沒有極限，更不分國界，只要適合孩子，就值得所有父母學習效法！\n◆瑞典父母相信：與父母同睡不但不會影響孩子的自主性，孩子長大後還會變得更獨立、更有安全感。\n\
    ◆法國父母相信：為孩子準備各種食物，可以開發孩子的味覺，幫助孩子建立享受食物的正確態度，最重要的是不偏食。\n◆德國父母相信：孩子足夠堅強，可以接受好的或壞的批評，這些實話不會壓垮他們，反而能讓他們下次做得更好！\n\
    ◆日本父母相信：過量的物質享受，會對孩子的未來造成極大傷害，簡約與分享才能讓孩子更懂得珍惜所擁有的一切。\n◆芬蘭父母相信：讓孩子成功的方式就是信任，在能力範圍之內，盡可能讓他們為自己的人生負責，而且從小就開始學著這麼做。\n\
    ── 克莉絲汀‧葛羅斯-駱 教養無國界書摘"
