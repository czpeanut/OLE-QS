- id: doc_113_高雄_楠梓_國文_g7s2e3_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 「愛因斯坦想盡量給聽眾一個印象：即他的貢獻『不是』源於甲，『就是』由於乙，與他本人不太相干似的。」句中的「不是……就是……」為連詞，其作用是指在幾件事物當中，審定取捨其一，帶有比較的意思。下列何者不是這樣的用法呢？
  options:
