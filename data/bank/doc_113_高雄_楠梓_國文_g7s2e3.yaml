- id: doc_113_高雄_楠梓_國文_g7s2e3_s3_42
  section: 3
  number: 42
  type: single
  page: 7
  stem: 從文章判斷，下列何者可能是竊賊內部不合的原因？
  options:
  - label: A
    content: 認為有人報警出賣朋友
  - label: B
    content: 認為有人是警方的臥底
  - label: C
    content: 認為有人獨吞翠玉戒指
  - label: D
    content: 認為有人獨吞所有畫作。
  group_stem: "博物館被偷了！幾件鎮館的寶貝，都不翼而飛。\n    這絕不是一個人幹的，而且必定都是行家，破壞警鈴、開保險鎖、車子接應，加上在中途換車，據推算最少五個人才幹得了。\n\
    \    政府開始懸賞，博物館的館長也接受了電視訪問。他顫抖著說：「十三件全是精品，尤其那個翠玉戒指，更是舉世無雙，愛珠寶的人，千萬不能收藏，遲早會被發現的！」他瞪大了眼睛說：「因為那戒指太好了，什麼人都一眼就看得出，是價值連城的寶貝！」\n\
    \    果然，沒多久就破了案。\n    一群竊賊雖然計畫周詳，沒留下任何線索，卻因為內部不合，兩派開火，而被發現。受傷的竊賊，躺在床上吐露了實情：「當時由我和另外一個人進去，我們只偷了十二幅畫，沒有拿什麼翠玉戒指，可是外面的幾個人不信，非要我們把戒指交出來，後來連我朋友，都認為是我獨吞了。」他大聲喊著：「我沒有拿！我沒有拿！你們要相信我！」\n\
    \    「我相信他！」博物館館長在檢收十二幅畫之後，笑道：「感謝上天，十二幅畫完整無缺地回來。至於翠玉戒指，唉！我們館裡何曾有過翠玉戒指啊？是我一時糊塗，亂說的！」\n\
    ── 劉墉 國寶失竊記"
