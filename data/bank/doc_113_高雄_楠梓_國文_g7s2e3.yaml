  - label: B
    content: 由「東歸」、「為守東行數輛車」可判斷作者是離開東部
  - label: C
    content: 「歸路無煩汝寄書，風餐露宿且隨予」句中的「汝」是指「黑犬」，「予」指的是作者自己
