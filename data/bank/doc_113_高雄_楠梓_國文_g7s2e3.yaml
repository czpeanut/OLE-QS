  stem: 在負荷這首詩中，吳晟表現出為子女甘願付出、無怨無悔的態度。下列皆是吳晟的詩句，請問何者也表達出同樣的意涵呢？
  options:
  - label: A
    content: 孩子啊！阿爸多麼希望／你有什麼話要說／就披肝瀝膽地說出來／不要像阿爸畏畏縮縮
  - label: B
    content: 我不和你談論人生／不和你談論那些深奧玄妙的思潮／請離開書房／我帶你去廣袤的田裡走走
  - label: C
    content: 阿爸偶爾寫的詩／沒有繽紛耀眼的光彩／也沒有華麗迷人的詩句／只是一些些／安分而無甜味的汗水
  - label: D
    content: 任何對阿爸的喝采之聲／也不如你們的笑語更動聽／任何恩恩怨怨／也不如你們的未來／更令阿爸掛心。
