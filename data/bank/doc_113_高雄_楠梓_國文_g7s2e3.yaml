    content: 「他人稍近，輒怒齧」可看出黑犬天性兇惡。
  group_stem: "（甲）\n    余在烏魯木齊，畜數犬，東歸時，一黑犬曰四兒，戀戀隨行，揮之不去，竟同至京師。途中守行篋①甚嚴，非余至前，雖僮僕不能取一物。他人稍近，輒②怒齧③。一日，過山丘，車四輛，半在嶺北，半在嶺南，日已黑，不能全度。犬乃獨臥嶺巔，左右望而護視之，見人影輒馳視。\n\
    \    余為賦詩一首曰：「歸路無煩汝寄書，風餐露宿④且隨予。夜深奴子酣眠後，為守東行數輛車。」紀其實也。\n── 改寫自紀昀 閱微草堂筆記\n【注】①行篋：出門旅行用的箱子、行李袋\
    \   ②輒：即、就   ③齧：啃、咬   ④風餐露宿：形容野外生活或行旅的艱苦\n（乙）\n    一個人在山路上撿到一隻幼小的獅子，便抱回家餵養。他對獅子□□□□，給牠餵以精緻的食物，為牠梳毛，幫牠洗澡。獅子對他也親密無間，趴他的肩膀，舔他的手腳，陪他散步，和他戲耍。獅子在他的懷中漸漸長大，長成一隻威猛的雄獅，也溫順得如一隻家犬。\n\
    \    有一天他忽發奇想：騎著獅子旅遊。於是他騎上了獅子，踏上了旅程。一路上獅子很聽話，平穩地馱著他。所到之處人們對他夾道喝采，他更神氣了。\n    路上有人問他：「獅子不會吃你嗎？」他說：「那怎麼可能呢！」\n\
    \    路上有條狗問獅子：「你怎麼不吃他？」獅子說：「那怎麼可能呢！」\n    一天，他們要穿過一片沙漠，路上遇到了風沙，水和食物都被強風捲走了。他在痛心之時跳下來步行，還去安慰獅子：「朋友忍著點，等過了沙漠，我讓你飽吃一頓。」一日過去了，獅子餓得圍著他打轉；兩日過去了，獅子餓得舔他的手腳；三日過去了，獅子對他進行輕輕地撕咬；四日過去了，獅子向他□□□□；第五日，飢餓的獅子向他瞪起了血紅的眼睛；在他正要上前撫摸牠時，獅子奮力一縱將他撲倒，瞬間把他撕成碎片。至死他都不明白，獅子怎麼會吃了自己呢？\n\
    ── 甄琴 致命的友誼"
