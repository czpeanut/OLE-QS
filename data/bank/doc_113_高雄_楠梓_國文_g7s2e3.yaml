  section: 3
  number: 40
  type: single
  page: 6
  stem: 根據內容，下列文句的主語說明，何者正確？
  options:
  - label: A
    content: 茸生鴨毛，觸之則痛：鴨子
  - label: B
    content: 須得失者罵，毛乃可落：盜鴨者
  - label: C
    content: 生平失物，未嘗徵於聲色：某甲
  - label: D
    content: 其病良已：鄰翁。
  group_stem: '邑①西白家莊居民某，盜鄰鴨烹之。至夜，覺膚癢。天明視之，茸生鴨毛②，觸之則痛。大懼，無術可醫。

    夜夢一人告之曰：「汝病乃天罰。須得失者罵，毛乃可落。」而鄰翁素雅量，生平失物，未嘗徵③於聲色。某詭④告翁曰：「鴨乃某甲所盜。彼甚畏罵焉，罵之亦可警將來。」翁笑曰：「誰有閑氣罵惡人。」卒不罵。某益窘⑤，因實告鄰翁。翁乃罵，其病良已。

    ── 蒲松齡 聊齋誌異‧罵鴨

    【注】①邑：城市   ②茸生鴨毛：長出一身柔密的鴨毛   ③徵：顯現   ④詭：欺詐   ⑤窘：困頓的、為難的'
