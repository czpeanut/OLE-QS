- id: doc_113_新北_板橋_數學_g7s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '(甲)不論 a 是什麼數字，一定是 $-a < 0$

    (乙)兩個相異數字 a、b 比大小，一定是 $a < b$ 或是 $a > b$

    (丙)若 $a > b$ 且 $a > c$，則一定是 $b > c$

    (丁)正數取絕對值會是原來的數字，負數取絕對值會是原來的相反數

    以上各選項的敘述，那些是正確的？'
