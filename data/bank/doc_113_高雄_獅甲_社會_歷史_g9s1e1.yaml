- id: doc_113_高雄_獅甲_社會_歷史_g9s1e1_s1_21
  section: 1
  number: 21
  type: single
  page: 1
  stem: 古希臘文明中，雅典和斯巴達是城邦文明的代表城市，因自然條件的差異，兩者在政治、經濟、社會等方面都有極大的差異性。請問：有關雅典與斯巴達的比較，下列敘述何者正確？
  options:
  - label: A
    content: 斯巴達注重教育，有全希臘學校的美稱
  - label: B
    content: 雅典的民主與今日相似，成年男女皆可參政
  - label: C
    content: 雅典實行陶片流放制是為了維護民主制度的發展
  - label: D
    content: 斯巴達帶領其他城邦打贏波希戰爭。
