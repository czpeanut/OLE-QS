  section: 1
  number: 24
  type: single
  page: 1
  stem: 西元前27 年羅馬進入帝國時期，往後兩百年，羅馬進入全盛時期，成為歐洲最強大的政權。請問：有關羅馬帝國的相關敘述何者正確？
  options:
  - label: A
    content: 開啟帝國的第一位皇帝為凱撒
  - label: B
    content: 當時在中國的朝代是東漢
  - label: C
    content: 狄奧多希皇帝曾建立東都拜占庭
  - label: D
    content: 屋大維正式稱帝後進入帝國時期。
