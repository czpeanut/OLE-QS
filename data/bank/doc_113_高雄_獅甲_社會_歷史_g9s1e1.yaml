  section: 1
  number: 25
  type: single
  page: 1
  stem: 北魏孝文帝曾大力推行漢化政策，改漢姓、說漢語、穿漢服、遷都洛陽，在其政權殞落後，其帶來的文化融合卻持續性在中國發酵，致使隋、唐皇帝對外來文化的接受程度也跟著提高。請問：下列哪一時期也發展出類似北魏漢化政策的民族與文化融合，進而出現文化新風貌？
  options:
  - label: A
    content: 印度種姓制度
  - label: B
    content: 波希戰爭
  - label: C
    content: 希臘化文化
  - label: D
    content: 怛羅斯之役。
