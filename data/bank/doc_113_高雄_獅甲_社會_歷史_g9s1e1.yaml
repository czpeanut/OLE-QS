  section: 1
  number: 33
  type: single
  page: 2
  stem: 古希臘文學、史學、哲學都相當興盛，其中在史學界頗具盛名的西羅多德，完成一本描述戰爭的重要史書，被尊稱為西方史學之父。請問：有關西羅多德的相關敘述何者正確？
