  section: 1
  number: 28
  type: single
  page: 2
  stem: 當今信仰人口前三名之一的佛教，是西元前六世紀發源於印度，其與印度本有的婆羅門教有諸多相同之處，也有一些不同的主張。有關印度婆羅門教與佛教的相關敘述何者正確？
  options:
