  section: 1
  number: 29
  type: single
  page: 2
  stem: 印度的種姓制度如同身分證，標示著每一個人的社會階級，根深蒂固的烙印於印度人的日常身活中，至今仍很難完全脫離古印度種姓觀念，也致使印度社會存在許多動盪不安的因子。請問：有關種姓制度的相關敘述何者正確？
  options:
  - label: A
    content: 國王屬於剎帝利等級
  - label: B
    content: 祭祀工作屬於首陀羅等級
  - label: C
    content: 吠舍地位最低
  - label: D
    content: 婆羅門指一般平民。
