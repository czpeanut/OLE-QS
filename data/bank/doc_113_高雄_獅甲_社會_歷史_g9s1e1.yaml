  section: 1
  number: 31
  type: single
  page: 2
  stem: 四大古文明被視為世界文明起源地的代表，不僅時間距今深遠，每個地方的文化也各具特色，引領世界文化的發展。請問：有關四大古文明的相關敘述何者正確？
