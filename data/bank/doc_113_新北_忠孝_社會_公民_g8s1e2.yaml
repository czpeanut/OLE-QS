questions:
- id: doc_113_新北_忠孝_社會_公民_g8s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 我國中央政府中的行政與立法部門，對重大政策出現歧見時，可以採取提出覆議、不信任案等方式來因應，這些制度的設計最符合下列何項的意涵？
  options:
  - label: A
    content: 權力分立
  - label: B
    content: 主權在民
  - label: C
    content: 政黨政治
  - label: D
    content: 人治社會
- id: doc_113_新北_忠孝_社會_公民_g8s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 小朱失業半年，他的朋友鼓勵他可以去就業服務站諮詢相關訊息，並告訴他這也是屬於人民的基本權利之一。請問：上述的權利是指何項基本權利？
  options:
  - label: A
    content: 平等權
  - label: B
    content: 自由權
  - label: C
    content: 受益權
  - label: D
    content: 參政權
- id: doc_113_新北_忠孝_社會_公民_g8s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 小平在路上邊走邊吃早餐，遭到警察上前盤查。小平認為自己並沒有舉止怪異或攜帶危險物品，無犯罪行為，因此拒絕出示證件，後來卻遭到警察上銬帶回警察局。請問：上述內容中，小平的何項基本權利受到侵犯？
  options:
  - label: A
    content: 平等權
  - label: B
    content: 自由權
  - label: C
    content: 受益權
  - label: D
    content: 參政權
- id: doc_113_新北_忠孝_社會_公民_g8s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 我國中央政府體制依《憲法》採五權分立的架構，關於其所主張的理由，下列敘述何項正確？
  options:
  - label: A
    content: 行政機關兼掌立法權，易生國會專制的弊端
  - label: B
    content: 立法機關兼掌考試權，易生國會專制的弊端
  - label: C
    content: 監察權從立法權獨立出來，以避免濫用私人
  - label: D
    content: 考試權從行政權獨立出來，以避免濫用私人
- id: doc_113_新北_忠孝_社會_公民_g8s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 監察權包含監督政府施政的權力，監察委員調查發現立法院前祕書長在任內涉及以職權壟斷立法院電腦資訊採購收賄，且違法失職事證明確，情節重大，依法監察委員通過「甲」案，並移送懲戒法院。請問：「甲」為下列何項？
  options:
  - label: A
    content: 彈劾
  - label: B
    content: 糾舉
  - label: C
    content: 糾正
  - label: D
    content: 罷免
- id: doc_113_新北_忠孝_社會_公民_g8s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '下列是妮妮在課堂舉例說明某一概念時的部分內容，根據內容判斷，這應該是在探討憲法中的哪項人民基本權利？


    | 舉例1.小致關心政治議題，經常在社群網路發表對公共意見的看法。 |

    | 舉例2.霏霏加入職業工會，並參與街頭遊行，以實際行動捍衛自己的權利。 |'
  options:
  - label: A
    content: 平等權
  - label: B
    content: 自由權
  - label: C
    content: 受益權
  - label: D
    content: 參政權
- id: doc_113_新北_忠孝_社會_公民_g8s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 小賢所任職的中央政府機關最近在審理法律是否違反憲法的裁判案。請問：下列哪件事也屬於該機關的職權？
  options:
  - label: A
    content: 罷免民選首長
  - label: B
    content: 審理政黨違憲的解散案
  - label: C
    content: 負責公務人員的銓敘案
  - label: D
    content: 對總統提名的官員行使人事同意權
- id: doc_113_新北_忠孝_社會_公民_g8s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 為了解五院的職權，老師請各個同學扮演五院院長，下列哪一位同學扮演的角色是「監察院院長」？
  options:
  - label: A
    content: 小如：本院擁有憲法修正案的提案權
  - label: B
    content: 小甫：本院設有懲戒法院
  - label: C
    content: 小婷：本院可審計中央政府的決算
  - label: D
    content: 小為：本院主管國家政策的規畫與執行
- id: doc_113_新北_忠孝_社會_公民_g8s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 我國中央政府的五權分立體制相當強調權力間的制衡，其中以行政院和立法院的互動最為明顯。請問：下列關於兩院的互動何項正確？
  options:
  - label: A
    content: 行政院可對立法院提出覆議案
  - label: B
    content: 行政院可對立法院長提出不信任案
  - label: C
    content: 立法院負責審計行政院的決算
  - label: D
    content: 立法院可就行政院長的任命行使同意權
- id: doc_113_新北_忠孝_社會_公民_g8s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 總統在國家或人民遭遇緊急危難或財政經濟重大變故得發布緊急命令。請問：下列關於緊急命令的敘述何項正確？
  options:
  - label: A
    content: 需經立法院會議之決議才可發布
  - label: B
    content: 總統發布後需經立法院之追認
  - label: C
    content: 若立法院不同意，可向總統提出覆議
  - label: D
    content: 若行政院不同意，可向總統提出不信任案
- id: doc_113_新北_忠孝_社會_公民_g8s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 西方有句法諺：「有權利，必有救濟」。我國《憲法》亦有規定：「人民有請願、訴願及訴訟的權利」。下列關於請願和訴願的敘述，何項正確？
  options:
  - label: A
    content: 訴願是指人民對於政策或利益，向民意機關陳述願望
  - label: B
    content: 請願是人民針對政府違法或不當的行政處分提起救濟
  - label: C
    content: 訴願是向行政機關或民意機關提出自身建議或表達訴求
  - label: D
    content: 請願屬於人民積極要求國家有所作為，而享受特定利益的權利
- id: doc_113_新北_忠孝_社會_公民_g8s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 公民課時，老師請同學舉例五院重要官員的產生方式，請問：下列哪位同學的說明正確？
  options:
  - label: A
    content: 家明：行政院院長由人民直接選出
  - label: B
    content: 小珍：司法院院長由總統直接任命
  - label: C
    content: 晴晴：教育部部長由行政院長提請總統任命
  - label: D
    content: 小翊：立法院長由總統提名，立委同意後任命
- id: doc_113_新北_忠孝_社會_公民_g8s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 針對我國行政院與立法院間的關係，當立法院提出不信任案並順利通過時，行政院院長依法可以如何進行制衡？
  options:
  - label: A
    content: 經總統核可，移請立法院覆議
  - label: B
    content: 經司法院院長核可，移請立法院覆議
  - label: C
    content: 提出辭職，並自行宣布解散立法院
  - label: D
    content: 提出辭職，並得呈請總統解散立法院
- id: doc_113_新北_忠孝_社會_公民_g8s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: 假設身為立法委員的阿哲，在某段期間看到媒體揭露的四則新聞報導如下。根據阿哲的職權判斷，表中哪一則新聞的報導對象，最可能被他提出彈劾？
  options:
  - label: A
    content: 現任總統疑似洩漏國家機密，影響國家安全
  - label: B
    content: 中央政府部會首長涉嫌官商勾結，從中舞弊
  - label: C
    content: 民調顯示，民眾對於內閣官員的滿意度大幅下滑
  - label: D
    content: 幫派分子製毒，警方破獲史上最大毒品販賣集團
