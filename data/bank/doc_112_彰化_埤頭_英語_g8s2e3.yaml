  section: 2
  number: 52
  type: single
  page: 3
  stem: Which of the following activities is the LEAST likely(最不可能) to be true?
  options:
  - label: A
    content: Women can give birth to their children.
  - label: B
    content: Women can vote for the presidents.
  - label: C
    content: Women make more money than men.
  - label: D
    content: Women keep fighting for their rights.
  group_stem: 'Women make up half of the world''s population. They do everything from
    having babies to traveling in space. The world wouldn''t be the same without women.

    However, in many places around the world, women are still not equal to men. Women
    get less pay, although they do the same work as men. People treat women differently
    if they work in a "men''s" field. In some places, women can''t drive cars or have
    jobs without permission. They can''t even have an opinion. Sadly, somewhere they
    have no rights.

    In the early 1900s, women started working to change their lives. They began fighting
    for their rights. They wanted to be able to work, vote, become government officers,
    and more. In 1911, the first International Women''s Day took place. Over one million
    women and men in four European countries took part. Soon, it became a common event
    everywhere.

    Today, people celebrate International Women''s Day on March 8 every year. They
    celebrate women''s success throughout history. Most importantly, they keep fighting
    to make women equal in the world.

     population 人口 equal 平等的 permission 允許 opinion 意見 government officer 政府官員'
