  stem: Whose gift did Prince Paris choose?
  options:
  - label: A
    content: Hera’s.
  - label: B
    content: Athena’s.
  - label: C
    content: Aphrodite’s.
  - label: D
    content: God’s.
  group_stem: 'A long time back, way before,

    Gods and heroes, stories way far.

    A golden apple, a big debate,

    Goddesses argued, couldn’t wait.


    Three goddess, all so bright,

    To a prince, they gave a sight.

    Hera gave power, Athena showed victory,

    Aphrodite sang a lovely song.


    Prince Paris had to choose one,

    Aphrodite’s beauty, he thought, was fun.

    This choice sparked a war so wild,

    Fighting and wars, like a stormy tide.


    Helen’s beauty, like a star,

    Started a big, loud war.

    Gods picked sides, fought above,

    People fought too, so much to prove.


    Troy was strong, walls so high,

    But the Greeks had a plan, oh my!

    A wooden horse, a sneaky way,

    Troy fell, sad to say.


    The horse got in, soldiers at night,

    Troy’s sad end, out of sight.

    A golden apple, horse’s surprise,

    Trojan War’s story never dies.


    Gods and humans, all in books,

    Passed through time, like a clock.


     debate 辯論 argue 爭論 victory 勝利 spark 觸發 prove 證明 sneaky 狡猾的'
