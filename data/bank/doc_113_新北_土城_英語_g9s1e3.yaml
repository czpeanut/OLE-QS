- id: doc_113_新北_土城_英語_g9s1e3_s3_56
  section: 3
  number: 56
  type: single
  page: 4
  stem: In which chapter of the book can you find an introduction to the 16 types
    of people?
  options:
  - label: A
    content: Chapter 1.
  - label: B
    content: Chapter 2.
  - label: C
    content: Chapter 3.
  - label: D
    content: Chapter 4.
  group_stem: 'To Know Who You Are: A Simple Guide to MBTI

     Chapter 1: What is MBTI?

    Find out how MBTI helps us know ourselves better. Learn where it comes from and
    why it is good for understanding how we like things.

     Chapter 2: How We Act

    Find out four pairs of ways we act: Do we like being with lots of people (Extraversion)
    or being alone (Introversion)? Do we make decisions by seeing real information
    (Sensing) or thinking about the ideas in our mind (Intuition)? When choosing,
    do we use our brains (Thinking) or our hearts (Feeling)? How do we deal with life---with
    a plan (Judging) or going with the flow (Perceiving)?

     Chapter 3: Different Types

    Those four pairs grow into sixteen special types of people. Find out each type’s
    strengths and ways of acting. For example, ENFPs are known for coming up with
    fun ideas and ISTJs are good at paying attention to small things. Read about each
    type, what they are good at, and how they act. You might find a type like you!

     Chapter 4: Better Relationships

    See how MBTI can make friendships and family connections stronger. Learn how to
    talk to different types for happier relationships.

     Conclusion: MBTI and You

    Finally, remember that MBTI is a tool, and we are all special. By using it to
    help understand ourselves and others, we can be happier and make life better.


     chapter 章節 strength 優點 flow 思緒流暢 relationship 關係 connection 連結'
