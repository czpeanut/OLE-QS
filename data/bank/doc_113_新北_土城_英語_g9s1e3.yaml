    7. The first English dictionary was written in 1755.

    8. The oldest English word that is still in use is “town.”

    9. More English words begin with the letter “s” than with any other letter.

    10. A pangram is a sentence that has all 26 letters. Just like this one: The quick
    brown fox jumps over the lazy dog.

