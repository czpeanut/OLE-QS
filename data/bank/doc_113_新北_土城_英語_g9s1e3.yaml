  group_stem: 'About 980 million people speak English as their first or second language.
    English is spoken all over the world. If you are learning English, here are some
    interesting facts about English for you.

    1. The shortest, oldest, and most used word is “I.”

    2. The letter “e” can be seen almost everywhere in English.

    3. “Good” is the most common adjective used in English.

