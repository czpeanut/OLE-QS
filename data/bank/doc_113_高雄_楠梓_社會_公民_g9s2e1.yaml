  section: 1
  number: 13
  type: single
  page: 2
  stem: '俄羅斯2022 年入侵烏克蘭後，造成了歐洲自二戰以來最大的難民危機。另外，先前美國選舉時對於有關移民政策的議題，參選的候選政營和民眾們也有不同想法，請問：下列圖表為有關難民與移民的定義與依據法規，何者正確？


    | 項目 | 難民 | 移民 |

    | :--- | :--- | :--- |

    | 定義 | (甲)大多是為改善生活，因工作、教育等社會經濟因素而遷移到外國居住的人，而非受直接迫害或人身安全威脅 | (乙)因種族、宗教或政治立場等因素遭受迫害、戰爭或暴力而被迫離開自己國家的人
    |

    | 依據法規 | (丙)依照國際公約規定，難民身分可在其他國家尋求多方面的保護 | (丁)移民身分必須得到移入國的移民法令批准，才被允許進入該國居住 |'
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丁
  - label: C
    content: 甲丙
  - label: D
    content: 丙丁。
  tags:
