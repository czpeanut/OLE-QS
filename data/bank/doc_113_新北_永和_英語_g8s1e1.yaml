  group_stem: 'B.

    (51-54)

    Kenji had heard so much about Taiwan’s famous night markets. Therefore, when he
    finally had the chance to visit Taiwan for the first time, he knew it was something
    he couldn’t miss.

    One evening, Kenji made his way to Shi-lin night market in the city. Soon Kenji
    noticed something different from the markets in Japan. In Japan, night markets
    are usually small and quiet. People stand in line politely, and vendors speak
    softly.

    However, Taiwan’s markets were full of people, noise, and the smells of delicious
    food. Some vendors even shouted to catch customers’ eye. That was new to Kenji.

