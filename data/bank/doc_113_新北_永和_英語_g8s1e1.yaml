  section: 7
  number: 49
  type: single
  page: 4
  stem: 49. What is the main idea of this report?
  options:
  - label: A
    content: Ms. Lin makes dough figurines and is a famous folk artist.
  - label: B
    content: Sun Wu Kong is one of Ms. Lin’s most popular figurines.
  - label: C
