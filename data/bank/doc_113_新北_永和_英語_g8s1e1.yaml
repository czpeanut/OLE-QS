  - label: D
    content: Dough figurines is part of our culture and it’s now a dying art.
  group_stem: "A.\n(49-50)\nDough figurine\nDough figurines have a long history. In\
    \ the beginning, people used sticky rice powder to make some small balls. They\
    \ rolled and pressed them into different shapes, and in the end, they cooked and\
    \ ate them. Over time, there were more and more different shapes of the small\
    \ balls, and they got their name – dough figurines. Today, dough figurines are\
    \ considered a kind of toy and they are more beautiful than before. Many folk\
    \ artists make dough figurines with chemical materials to save them for longer\
    \ time. So, we don’t usually eat dough figurines anymore. It’s an interesting\
    \ art but now fewer and fewer artists are making dough figurines. We can say that\
    \ it’s a dying art.\n   The note above is from today’s art class. Our teacher\
    \ wanted each group to interview a folk artist of dough figurine and make a report\
    \ as our homework for this class. Janet, Sam and I looked for the information\
    \ online and decided to interview Mrs. Lin. After the interview, we made the following\
    \ report.\nFolk Artist of the Dying Art –Dough Figurine\nFolk artist: Mrs. Lin\n\
    Experience:\nShe makes dough figurines for over thirty years, and she is very\
    \ famous for her pieces of art.\nMaterials to make dough figurines:\nMain materials:\
    \ sticky rice flour, water\nOther: some chemicals materials (to save them longer)\n\
    Tools: Bamboo tool\nCharacters of her dough figurines:\nFrom old stories (like\
    \ Sun Wu Kong) and modern cartoons (like Pikachu and Doraemon)\nSteps: (1) Mix\
    \ the sticky rice flour and water together.\n           (2) Roll and press the\
    \ dough with her hands.\n           (3) Use the bamboo tool to shape the body\
    \ parts of dough figurines.\n           (4) Wait until they are dried and stronger.\n\
    Reflections:\n    This folk art is really surprising, and we can see it takes\
    \ some time and a lot of skills to make dough figurines from the interview. At\
    \ the end of the interview, Ms. Lin told us that she is not the last folk artist\
    \ to make dough figurines. She said there were many folk artists like her thirty\
    \ years ago, but now there aren’t many left. This makes us even more certain that\
    \ making dough figurines is a dying art. We learned a lot from this interview\
    \ and decided to tell some stories behind these beautiful and cute dough figurines\
    \ to people. We want more people to know about this amazing but dying art through\
    \ our report. We hope this report inspires your interest in part of Taiwan’s culture\
    \ –– dough figurines. Hope you like this folk art as much as we do.\n consider\
    \ 認為     chemical 化學的      save 保存     above 上面的       certain 肯定的  inspire 激起"
