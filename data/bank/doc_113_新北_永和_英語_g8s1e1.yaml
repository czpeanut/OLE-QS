    \ Taiwan, everyone she knows uses LINE. Lisa used it every day to talk to her\
    \ friends and family. She loved sending cute stickers, voice messages, and pictures.\
    \ For her, LINE was the most convenient way to stay in touch with others.\nThis\
    \ year, however, Lisa moved to Europe to study abroad. When she arrived, she quickly\
    \ learned that most of her new friends didn’t use LINE. Instead, most of them\
    \ used WhatsApp. Therefore, she also downloaded WhatsApp to connect with them.\
