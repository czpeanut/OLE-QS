  section: 1
  number: 14
  type: single
  page: 2
  stem: 請問下列有關髮菜(Nostoc flagelliforme)和海髮菜(Bangia atropurpurea)的敘述，何者正確?？
  options:
  - label: A
    content: 皆屬於原生生物界
  - label: B
    content: 皆有細胞核
  - label: C
    content: 皆有葉綠體
  - label: D
    content: 皆可行光合作用，製造養分。
  group_stem: '小翰在營養午餐的教育月刊上讀到關於髮菜的介紹:「髮菜」因諧音與「發財」二字相似，使得它成為傳統年夜飯討吉利的食材之一；目前常食用的 「髮菜」主要有兩種，一種來自沙漠，也就是我們傳統認知的「髮菜」，另一種則來自於海洋，常又被叫做
    「海髮菜」。「髮菜」(Nostoc flagelliforme)」又稱髮狀念珠藻，屬於藍綠菌類(Cyanobacteria)生物，因其細長而黑色，很像人類的頭髮因而得名，具有耐高溫、寒冷與抗乾旱的生長特性，多生長在乾燥貧瘠的沙漠地區，不僅可為土壤保水，更扮演著固沙、減緩沙漠化的重要角色。而另一種海髮菜(Bangia
    atropurpurea)」，又名「紅毛苔」，在生物學的分類屬於紅藻門(Rhodophyta)」的水生藻類。生長的環境多是在浪花衝擊拍打的海邊礁石上，在台灣北部、東北部沿海、澎湖區域同樣能見到這種海髮菜的身影。請回答第
    14-15 題:'
