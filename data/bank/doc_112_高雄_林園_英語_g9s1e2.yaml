  - label: D
    content: The job is dangerous, but both men and women can do it well.
  group_stem: "(II)\n            It’s very common that people stereotype jobs by gender.\
    \ For example, many people think that driving a truck is a man’s job and taking\
    \ care of children is a woman’s. However, stereotyping jobs can make it difficult\
    \ for the right person to get the right job.\n          Many studies show that\
    \ gender stereotypes often affect a boss’s decision when a company is looking\
    \ for the right person for a job. If the boss thinks men are better for the job,\
    \ it would become a lot more difficult for women to get it. On the other hand,\
    \ men can experience this, too. Many feel men are not good teachers for young\
    \ children because they are not as patient as women.\n          Stereotyping jobs\
