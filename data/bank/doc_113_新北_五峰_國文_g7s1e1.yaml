  section: 5
  number: 26
  type: single
  page: 3
  stem: 客訴結束後還持續追蹤，所求不包含下列何者？
  options:
  - label: A
    content: 讓客訴永遠不會再發生
  - label: B
    content: 希望客戶能繼續光臨消費
  - label: C
    content: 擬定更完善的客速處理方案
  - label: D
    content: 作為日後經驗及參考依據
  group_stem: '處理客訴五步驟

    (１)□：不須搶著解釋，先聆聽客人的抱怨，有助於將事實明確化。

    (２)□：及時表達歉意是最有效的止血動作，並有助於確認客人抱怨的用意。

    (３)□：在互動過程中理解客戶是否有進一步需求，有助於確定處理方針。

    (４)□：若事態比較棘手，就需要提供具體的解決方案，有助與客戶達成共識。

    (５)□：了解客訴真正原因，並考慮提供客戶補償措施，藉以維持客情，有助於事後追蹤檢討並做出有效長遠的解決方法。

    （節錄自聯合利華飲食策畫）'
