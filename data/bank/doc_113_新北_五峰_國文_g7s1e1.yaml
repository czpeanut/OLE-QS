- id: doc_113_新北_五峰_國文_g7s1e1_s5_29
  section: 5
  number: 29
  type: single
  page: 4
  stem: 文中真耶穌要求看門人聽到什麼都不能說的原因為何？
  options:
  - label: A
    content: 隨意發言，破壞形象
  - label: B
    content: 因偽裝不可洩露身分
  - label: C
    content: 一切都是最好的安排
  - label: D
    content: 有求必應，無須多言
  group_stem: "北歐一座教堂裡，有一尊耶穌被釘在十字架的苦像，因為有求必應，因此專程前來祈禱膜拜的人特別多。教堂裡有位看門人，看十字架上的耶穌每天要應付這麼多人的要求，覺得於心不忍，他希望能分擔耶穌的辛苦。\n\
    \  有一天，他祈禱時，向耶穌表明這份心願。意外地，他聽到一個聲音，說：「好啊！我下來為你看門，你上來釘在十字架上。但是，不論你看到什麼、聽到什麼，都不可以及說一句話。」這位看門人覺得，這個要求簡單。於是耶穌下來，看門人上去，像耶穌被釘十字架般地伸張雙臂，依照先前的約定，靜默不語，聆聽信友的心聲。\n\
    \  有一天，來了一位富商，祈禱完後竟然忘記手邊的錢便離去。他看在眼裡，真想叫這位富商回來，但是，他只能憋著不說。接著來了一位三餐不繼的窮人，他祈禱耶穌能幫助他渡過生活的難關。正要離去時，發現先前那位富商留下的袋子，一打開，發現裡面全是錢。窮人高興得不得了，只覺得耶穌真好，有求必應，萬分感謝地離去。\n\
    \  十字架上偽裝耶穌的看門人看在眼裡，想說這不是你的。但是，因有約定在先，他仍然憋著不說。接下來有一位將出海遠行的年輕人來到，他是來祈求耶穌護佑他平安。正要離去時，富商衝進來，抓住年輕人的衣襟，要年輕人還錢，年輕人不明就裡，兩人便吵了起來。這個時候，十字架上偽裝耶穌的看門人終於忍不住，開口說出真相。既然事情弄清楚了，富商便去找冒牌耶穌所形容的窮人，而年輕人則匆匆離去，生怕搭不上船。\n\
    \  偽裝成看門人的耶穌出現，指著十字架說：「你下來吧！那個位置你沒有資格了。」看門人說：「我把真相說出來，主持公道，難道不對嗎？」耶穌說：「你懂得什麼？那位富商並不缺錢，可是對那窮人，卻是可以挽回一家大小生計；最可憐的是那位年輕人，如果富商一直糾纏下去，延誤了他出海的時間，他還能保住一條命，而現在，他所搭乘的船正沉入海中。」\n\
    \  這是一個聽起來像笑話的寓言故事，卻透露出：在現實生活中，我們常自認為怎麼樣才是最好的，但事與願違，使我們意不能平。我們必須相信：目前我們所擁有的，不論順境、逆境，都是對我們最好的安排。若能如此，我們才能在順境中感恩，在逆境中依舊心存喜樂。人生的事，沒有十全十美。但是，我願認真活在當下。\n\
    \n（節錄自網路文章）"
