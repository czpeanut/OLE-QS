  section: 4
  number: 5
  type: single
  page: 1
  stem: 在語文中，將關於事物的聲音、顏色、形體、情狀等的各種感受，透過作者的主觀加以形容描述，這種修辭技巧稱為摹寫。下列運用摹寫的句子，何者說明正確？
  options:
  - label: A
    content: 烤地瓜出爐了，我迫不及待伸手去拿，地瓜燙得都拿不住──視覺摹寫
  - label: B
    content: 稻香撲人，真有點醺然欲醉的味道──味覺摹寫
  - label: C
    content: 北風呼嘯得更猖狂，呼呼，裂裂，裂裂，呼呼──觸覺摹寫
  - label: D
    content: 小販手上持有鈴鐺，一路騎來，串串鈴鐺聲響徹街頭巷尾──聽覺摹寫
  tags:
    chapter:
      publisher: 康軒
      book: 七上
      subject: 國文
      code: 第一課
      title: 夏夜
      chapter: null
    textbook: 七上 第一課 夏夜
