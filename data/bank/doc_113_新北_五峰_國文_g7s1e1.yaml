    (２)□：及時表達歉意是最有效的止血動作，並有助於確認客人抱怨的用意。

    (３)□：在互動過程中理解客戶是否有進一步需求，有助於確定處理方針。

    (４)□：若事態比較棘手，就需要提供具體的解決方案，有助與客戶達成共識。

    (５)□：了解客訴真正原因，並考慮提供客戶補償措施，藉以維持客情，有助於事後追蹤檢討並做出有效長遠的解決方法。

