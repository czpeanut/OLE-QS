  section: 6
  number: 34
  type: single
  page: 6
  stem: 文中引用揚雄的話：「仲尼多愛，愛義也；子長多愛，愛奇也。」，下列敘述何者最符合作者的觀點？
  options:
  - label: A
    content: 司馬遷根據自己的偏好點評人物，不顧社會階級制度
  - label: B
    content: 司馬遷偏好儒家典範人物，與孔子的理念不謀而合
  - label: C
    content: 相較於孔子愛「義」，司馬遷更欣賞人物的生命熱情
  - label: D
    content: 揚雄評論司馬遷只記錄怪異無用之人，不具備史學價值。
  group_stem: '《史記》作為史學經典，能夠「跨界」到文學領域，既有其內在原因，也有外部的諸多因素。《史記》被譽為「不虛美，不隱惡」的「實錄」著作，但司馬遷的審美觀有「愛奇」傾向。揚雄《法言·君子篇》：「仲尼多愛，愛義也；子長多愛，愛奇也。」司馬遷的愛奇，不只是記載神話傳說，更深層次的是司馬遷選擇了大量的奇特之人和奇特事件。魯迅認為《史記》的創作目的是要「傳畸人於千秋」。「畸人」，即「奇人」，即司馬遷所說的「倜儻非常之人」。「愛奇」的審美觀不只是史學家在搜求歷史資料，也是文學家通過資料發現自己認為美的對象，能體現生命力的人和事，而且不受他人約束，這就使《史記》不同於一般的歷史著作，所寫的奇特之人都是「有故事的人」，有熱呼呼的生命，具有文學的傳奇色彩、故事特徵和審美享受。

    《史記》能進入文學領域，也是由於它本身具有文學的形象性和感染力，刻畫人物具有典型化、個性化的特徵。《史記》描繪典型環境，讓人物在矛盾衝突中表現自己；用人物自己的語言和行動去表現人物的性格；用細節描寫來充實人物的個性；多側面寫人，使人物由平面化轉向立體化；運用對比描寫，顯示人物個性等等。這些手法的運用，使《史記》插上了文學的翅膀，避免了單純的客觀敘述和呆板的生平介紹。尤其是個性化的語言，這是歷史跨入文學的一道檻；由於司馬遷的努力創造，《史記》終於邁過了這道檻。從某種意義上說，典型化、個性化是文學的靈魂和生命，因為這是經過對生活的深入挖掘而產生的。

    《大英百科全書》在談傳記文學時指出：「作為一個傳記藝術家的成就，在很大程度上將取決於：他是否能夠在表現出年代的範圍和歲月的跨度的同時，又能夠著重突出表現一個人的外貌和內心的主要行為模式。」成功的傳記，不僅要展現人的生命過程，更重要的是要揭示出這個過程的內動力。另外，司馬遷秉筆直書，褒善貶惡，愛憎分明，加之他深刻的人生體驗，使《史記》中灌注著他強烈的感情色彩，魯迅稱之為「無韻之《離騷》」。司馬遷將個人情感滲透在字裡行間，這也是《史記》邁入文學殿堂的一個標誌，也是《史記》區別於其他歷史著作的一個重要方面。由於典型化、個性化、抒情化以及想像、心理刻畫等手段，《史記》具有了文學的感染力，成功引起讀者的共鳴。

    ──節錄自張新科〈《史記》何以是『跨界』文學? 〉'
