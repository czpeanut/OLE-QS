- id: doc_113_新北_永和_國文_g8s2e2_s5_24
  section: 5
  number: 24
  type: single
  page: 4
  stem: '于仲文曾任北周時安國太守。他任太守時，有任、杜兩家各失其牛。後來任家得到一頭牛，兩家都說是自己家的牛，各執一詞，州郡長期不能斷決。益州有一位官員說：「于太守必有主意。」于仲文接手此案後，他令兩家各把自己的牛群驅至郡衙前，又令人把要認領的牛放出來，結果要認領的牛走入任家的牛群。于仲文先前又令屬吏悄悄微傷要認領的牛，藉此觀察兩家的反應，任家見到後心疼不已，而杜家則無所謂。於是于仲文便據此下判，將牛斷給任家，杜氏服罪而去。

    ──《隋書·卷六于仲文傳》


    由上面的故事看出，于仲文在案件中做出的判斷方式是什麼？'
  options:
  - label: A
    content: 運用科學判案的手法，在牛身上做記號
  - label: B
    content: 無視雙方證詞，依照法律條文做出裁定
  - label: C
    content: 依據兩家的口供，做出理智的裁決
  - label: D
    content: 通過巧妙的觀察和心理測試來判斷案件。
