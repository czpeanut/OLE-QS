  stem: '閱讀下文，□內依序應填入的是︰


    西湖的俗化真是□□□□，我每回去總添一度傷心：雷峰也羞跑了，斷橋折成了汽車橋，哈得①在湖心裡造房子，某家大少爺的汽油船在三尺的柔波裡□□□□，工廠的煙替代了出岫的□，大世界以及什麼舞臺的鑼鼓充當了湖上的啼鶯，西湖，西湖，還有什麼可留戀的！

    註解︰①猶太人，一位富翁。

