- id: doc_113_新北_永和_國文_g8s2e2_s6_30
  section: 6
  number: 30
  type: single
  page: 5
  stem: 根據上文，作者通過「晨光→正午→暮色→星夜」的時間軸描寫沙漠，主要在表達甚麼？
  options:
  - label: A
    content: 旅行者必須掌握沙漠生存的時間規律
  - label: B
    content: 強調沙漠區生態鏈中生物的依存關係
  - label: C
    content: 展現沙漠如同生命體的情感與多樣性
  - label: D
    content: 沙漠風暴會突如其來毀掉我們的記號。
  group_stem: '大漠的晨光來得突兀。魚肚白才浮上天際，轉瞬間金色陽光已潑墨般浸染沙海。赤足踩上沙丘，細沙從腳趾縫溢出，帶著夜的最後一絲涼意。遠處沙脊如凝固的波浪，在晨光中投下深深淺淺的陰影，恍若大地均勻的呼吸。我的足跡不過是沙粒間轉瞬即逝的凹痕，未及行至下個沙丘，來路已被風撫平。

    正午的沙漠露出猙獰面目。烈日將空氣烤得扭曲變形，遠處景物在水氣中搖曳，幻作蜃樓。沙粒滾燙，連蜥蜴都蜷在駱駝的陰影裡喘息。裹著厚重頭巾，仍覺陽光如針刺膚。此刻方知，人類精心織就的布料，竟不如蜥蜴的鱗甲實用。熱風捲過，細沙飛舞，打在臉上隱隱作痛。抬手遮擋時，指縫漏下的沙粒在陽光下閃爍如金粉──這美麗的幻象，原是沙漠驅逐入侵者的武器。

    暮色中的沙漠忽然溫柔。沙丘先染玫瑰金，繼而轉為暗紅。溫度驟降，踩上去不再灼人。我喜歡坐在高處，看自己的影子被拉得很長很長，最終融入漸濃的暮色。遠處駝鈴聲清脆，讓我想起白日遇見的遊牧民族──他們騎著駱駝的身影在熱浪中搖晃，如同沙漠孕育的生命幻影。當他們消失於沙丘背後，我突然明白：在這片連時間都會迷失的疆域，人類的來去不過是風中一粒微塵的起落。

    當最後一縷陽光消失，沙漠便屬於星空。銀河橫貫天際，繁星幾乎要墜落。躺在尚有餘溫的沙地上，夜風送來遠處沙丘移動的細響，似沙漠的夢囈。仰望時，忽見北斗勺柄正指向我白晝堆的石堆──這為防迷路而作的記號，在星空尺度下不過是沙海中的芥子。我們精密的儀器不如駱駝蹄印可靠，繪製的地圖轉眼被流沙改寫。但閉目感受沙粒流動，聆聽遠古吹來的風時，卻又奇妙地與這片荒原融為一體──彷彿我們本就是沙漠在某個黃昏，隨意呼出的一口氣息。

    ──改寫自網路文章〈沙之魅影〉'
