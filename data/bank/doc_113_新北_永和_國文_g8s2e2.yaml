- id: doc_113_新北_永和_國文_g8s2e2_s4_1
  section: 4
  number: 1
  type: fill
  page: 1
  stem: '在司馬遷〈張釋之執法〉一文中，張釋之如何說服漢文帝接受他的判決？(依課文原文回答，全對才給分)


    | 切入視角 | 律法詮釋 | 課文線索(依課文原文回答) |

    | :--- | :--- | :--- |

    | 司法的公平正義 | 蘊含「法律之前，人人平等」、「王子犯法與庶民同罪」的觀念。 | (1) |

    | 司法的公平正義 | 點明執法須名正言順、勿枉勿縱，才能取信於民。 | (2) ， (3) |

    | 司法的公平正義 | 廷尉，是天下執法的準則。 | 廷尉，天下之平也 |

    | 司法的公平正義 | 執法標準只要一有偏差，天下執法人員所下的判斷就會偏私不公正，這樣要百姓如何是好呢？ | (4) ， (5) ？ |'
  lesson_raw:
    title: 張釋之執法
    basis: 題目指明司馬遷〈張釋之執法〉
