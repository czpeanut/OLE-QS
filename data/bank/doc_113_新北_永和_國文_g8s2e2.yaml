  section: 5
  number: 19
  type: single
  page: 3
  stem: 在〈我所知道的康橋〉一文中︰「遠近的炊煙，……，在靜定的朝氣裡漸漸地上騰，漸漸地不見，彷彿是朝來人們的祈禱，參差地翳入了天聽。」徐志摩用聽覺印象來表達視覺感受，這是藉用具體形象化將某種感官的感覺移植到另一種感官上的修辭，稱為「移覺」。下列哪一個選項也是用「聽覺」來表現「視覺」？
  options:
  - label: A
    content: 那縷蟬歌，在夜西門的喧囂中，如一絲細蠶吐出的幽光，自亂線中徐緩抽出，愈抽愈長，於空中纏綿回繞，不絕如縷
  - label: B
    content: 那口檸檬冰沙的酸味，像突然炸開的冰晶，尖銳而清涼，從舌尖一路蔓延到耳膜，彷彿能聽見『叮』的一聲，像玻璃風鈴被夏風輕輕撞響
  - label: C
    content: 夕陽餘暉斜斜地穿過百葉窗，在地板上投下金黃的格子，彷彿有人用指尖輕輕彈奏著鋼琴的黑白鍵，流淌出一段溫暖的即興曲
  - label: D
    content: 那王小玉唱到極高的三、四疊後，陡然一落，又極力騁其千迴百折的精神，如一條飛蛇，在黃山三十六峰半中腰裡盤旋穿插。
