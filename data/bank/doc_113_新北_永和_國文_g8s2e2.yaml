- id: doc_113_新北_永和_國文_g8s2e2_s6_28
  section: 6
  number: 28
  type: single
  page: 5
  stem: 根據上文，關於「隼死宮廷」的事件，何者敘述正確？
  options:
  - label: A
    content: 孔子根據一支箭推測其為敵國陰謀
  - label: B
    content: 此事件為虛構，用以神化陳湣公
  - label: C
    content: 此為肅慎國對陳國的戰爭警告
  - label: D
    content: 由一隻隼引出陳國封建的歷史淵源。
  group_stem: '有隼(ㄓㄨㄣˇ)集於陳國宮廷而死，楛矢貫之，石砮矢長尺有咫。陳湣公使使問仲尼。仲尼曰：「隼來遠矣，此肅慎人之矢也。昔周武王克商，通道九夷百蠻，使各以其方賄來貢，使無忘職業。於是肅慎人貢楛矢石砮，長尺有咫。先王欲昭其令德，以肅慎矢分其長女大姬，配虞胡公，而封諸陳。分同姓以珍玉，展親；分異姓以遠職，使無忘服。故分陳以肅慎矢。」試求之故府，果得之。

    ──改寫自司馬遷《史記．孔子世家》'
