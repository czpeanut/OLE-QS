  section: 6
  number: 26
  type: single
  page: 4
  stem: 關於上文的說明，下列何者正確?
  options:
  - label: A
    content: 石崇的牛跑得比較快是因為時常訓練牛
  - label: B
    content: 王愷照著馭人的話終於贏得勝利
  - label: C
    content: 王愷因為知道秘密，後來被石崇殺了
  - label: D
    content: 豆粥很快完成是因為前一天先做好再封存起來。
  group_stem: '石崇為客作豆粥，咄嗟便辦。恆冬天得韭蓱齏。又牛形狀氣力不勝王愷牛，而與愷出遊，極晚發，爭入洛城，崇牛數十步後，迅若飛禽，愷牛絕走不能及。每以此三事為搤腕。乃密貨崇帳下都督及御車人，問所以。都督曰：「豆至難煮，唯豫作熟末，客至，作白粥以投之。韭蓱齏是搗韭根，雜以麥苗爾。」復問馭人牛所以駛。馭人云：「牛本不遲，由將車人不及制之爾。急時聽偏轅，則駛矣。」愷悉從之，遂爭長。石崇後聞，皆殺告者。

    ──劉義慶《世說新語》'
