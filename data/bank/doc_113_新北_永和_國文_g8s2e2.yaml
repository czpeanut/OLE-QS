  number: 18
  type: single
  page: 3
  stem: 根據〈張釋之執法〉的內容，推測張釋之在犯蹕事件中的執法觀念對後世之影響，最可能是下列何者？
  options:
  - label: A
    content: 在沒有確實證據證明一個人有罪之前，應該先假設他是無罪的
  - label: B
    content: 司法制度應該獨立運作，不應該受皇帝或最高統治者的干涉
  - label: C
    content: 刑罰不能加諸於地位尊貴的大夫，禮儀也不適用於地位低下的庶民
  - label: D
    content: 設立刑罰的目的，是通過刑罰威懾預防犯罪，甚而以教化消除犯罪根源。
