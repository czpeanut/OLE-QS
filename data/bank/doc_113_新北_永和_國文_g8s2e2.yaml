  stem: 甲、乙兩則醫案，共同揭示的醫學觀點是？
  options:
  - label: A
    content: 傳統偏方比起醫生開藥有效
  - label: B
    content: 急症應當優先採用參類補藥
  - label: C
    content: 醫生也應該多聽家屬的意見
  - label: D
    content: 名醫亦有局限，視病需審慎。
  group_stem: '甲  葉天士治金某患嘔吐者數年，用泄肝安胃藥年餘幾殆①。徐靈胎診之，謂是蓄飲②，為製一方，病立已。

    （見徐批《臨證指南》）

    乙  薛生白治蔡輔宜夏日自外歸，一蹶不起，氣息奄然，口目皆閉，六脈俱沉。少妾泣於傍，親朋議後事，謂是痰厥③，不必書方，且以獨參湯灌，眾相顧莫敢決。有符姓者，常熟人，設醫肆於楓橋，因邀之入視。符曰：「中暑也，參不可用，當服清散之劑。」眾以二論相反，又相顧莫敢決，其塾師馮在田曰：「吾聞六一散能祛暑邪，盍先試之？」皆以為然。即以葦管灌之，果漸蘇④。符又投以解暑之劑，病即霍然⑤。

    （見徐晦堂《聽雨軒雜記》）

    夫葉、薛為一代良醫，猶不免有失，況其他乎？知醫之不可為矣。然如符姓，素無名望，而能治良醫誤治之疾，則醫固不可為而可為也。

    ──節錄自清代陸以湉《冷廬醫話》


    注釋

    ①幾殆︰極度危險。

    ②蓄飲︰沒有吸收的胃水積囤在胃裡。

    ③痰厥︰病人因痰多堵住呼吸道，而短暫喪失意識或跌倒。

    ④蘇︰甦醒。

    ⑤霍然︰病情好轉。'
