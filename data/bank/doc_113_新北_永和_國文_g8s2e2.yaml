  stem: 根據文中引述《大英百科全書》對傳記文學的看法，下列何者最能反映《史記》在人物描寫上的文學成就？
  options:
  - label: A
    content: 《史記》雖詳實記錄人物生平，但僅止於事件陳述，較少挖掘行為背後的心理動機
  - label: B
    content: 《史記》依照時間順序為主軸，對人物描寫僅用簡潔筆法，避免給予褒善貶惡
  - label: C
    content: 《史記》在傳記描寫上強調人物的英雄形象，因此多採誇張描寫而忽略史料真偽
  - label: D
    content: 《史記》不僅重現時代背景，還透過語言與細節描寫，揭示人物行為的內在因素。
