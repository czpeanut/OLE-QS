  group_stem: '有隼(ㄓㄨㄣˇ)集於陳國宮廷而死，楛矢貫之，石砮矢長尺有咫。陳湣公使使問仲尼。仲尼曰：「隼來遠矣，此肅慎人之矢也。昔周武王克商，通道九夷百蠻，使各以其方賄來貢，使無忘職業。於是肅慎人貢楛矢石砮，長尺有咫。先王欲昭其令德，以肅慎矢分其長女大姬，配虞胡公，而封諸陳。分同姓以珍玉，展親；分異姓以遠職，使無忘服。故分陳以肅慎矢。」試求之故府，果得之。

