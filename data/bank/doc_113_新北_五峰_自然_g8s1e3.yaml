  number: 5
  type: single
  page: 1
  stem: 楊同學的好朋友劉同學總是喜歡違反學校規定穿全便服來學校，他喜歡的穿著是白色棉褲或黑色風褲，上半身搭配大遠百買的淡藍色牛仔外套。有關這三件衣物與熱的傳播的敘述，下列何者正確？
