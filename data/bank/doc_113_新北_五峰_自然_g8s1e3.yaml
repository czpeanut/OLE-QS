    content: 班上同學可自由訂定$^{\circ}\text{Love}$的基準點，在$^{\circ}\text{Love}$可與攝/華氏互相轉換後，即可以此溫標作為班上量測溫度的單位
  - label: D
    content: $^{\circ}\text{Love}$可為溫度單位，亦可為熱量單位。
