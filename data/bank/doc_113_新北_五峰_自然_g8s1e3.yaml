  stem: 八年級公認最帥的楊同學日前收到了第46位女生的告白信，為了慶祝這一刻，全班同學為他創立了新溫標$^{\circ}\text{Love}$，有關此溫標的敘述，下列何者正確？
  options:
  - label: A
    content: 將$^{\circ}\text{Love}$設立一個基準點，如$46^{\circ}\text{Love}=0$℃，即可推算其它溫度。
