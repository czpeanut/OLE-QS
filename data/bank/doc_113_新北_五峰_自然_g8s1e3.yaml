    content: 若白色褲子與黑色褲子材質完全相同，僅顏色不同，則黑色褲子較保暖。
  - label: B
    content: 白色棉褲中使用膨鬆的棉絮，可以減少熱傳導。
  - label: C
    content: 白色褲子在三件衣物中最容易吸收及放出輻射熱。
  - label: D
    content: 黑色風褲若只有一層，可以減少熱對流和熱傳導。
