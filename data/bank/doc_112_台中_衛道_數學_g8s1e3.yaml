  number: 1
  type: calc
  page: 2
  stem: '$\alpha$、$\beta$ 為一元二次方程式 $ax^{2}+bx+c=0(a\neq 0)$ 兩根，可推得 $\alpha+\beta=-\frac{b}{a}$，$\alpha\times\beta=\frac{c}{a}$。

    若 $\alpha$、$\beta$ 為 $x^{2}+3x-5=0$ 的兩根，則以 $\alpha+\frac{1}{\beta}$、$\beta+\frac{1}{\alpha}$
    為兩根的方程式為＿＿＿＿＿＿(二次項係數為 5)'
