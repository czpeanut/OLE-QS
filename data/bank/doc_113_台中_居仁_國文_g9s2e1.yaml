    從前從前，有個小女孩常戴一頂紅帽子，大家都叫她「小紅帽」。有一天，小紅帽的外婆生病了，媽媽對她說：「小紅帽，妳把這一籃食物帶去給外婆，幫她早點康復……」

    這時，聽故事的小朋友打岔了：「小紅帽的籃子裡裝了哪些食物？」

    今天的台灣父母可能會根據童話的邏輯，回答道：「有麵包、雞蛋、水果啊！」德國十九世紀格林兄弟會說：「有一個蛋糕、一瓶酒。」法國十七世紀的佩羅則會告訴你：「裡面裝了一罐奶油、一塊餅。」這些細節並不影響故事的發展，
    ____________ 。

    法國的飲食文化在十七世紀中期經過重大轉變，之前與之後的面貌相差甚多，且影響力波及整個歐洲。但真正切身感受到這場革命的，僅為權貴與富裕階層。長達幾個世紀中（十四至十八世紀末，即下文涵蓋的範圍），鄉村的食材、烹調方式或用餐習慣均無明顯的斷層。

    比如平民用餐的次數一直大同小異，基本上固定一天三餐，明顯異於上流社會的一日兩餐。當時民間日出而作，日落而息的勞動者不可能空腹出門，他們早上習慣切一塊麵包、倒一碗酒，用麵包沾著酒吃。到了十八世紀，從東非進口的咖啡深入廣大的鄉村，躍升為大眾飲料，取代了傳統的早餐酒。直到今天，很多法國人不管早餐吃的是麵包或可頌，都習慣拿來在咖啡或茶裡涮一下才入口。

    自古以來，奶油僅普及於歐洲若干區域，屬於典型的平民食材，並不符合上流社會的口味。貴族階級一直等到上述的飲食大革命之後，才真正發現奶油的滋味。後來咖啡一炮而紅，有人發現牛奶能減少咖啡的苦味，跟著讓牛奶大翻身。奶製品也隨之人氣暴漲，成為餐桌上不可或缺的食品。

    印象中，法國人自古以來餐桌的必備食物一定是麵包。但社會地位越高的人，麵包食用量越少，而窮人飲食中，高達百分之七、八十的卡路里來自麵包。遑論富人的麵包細白鬆軟，貧民吃的則粗糙緊密。由於烤爐需耗用大量柴火，小型村鎮一、兩周才集體開一次公用爐，阿爾卑斯山區甚至一年只開兩次，因此鄉村人民不常吃到新鮮麵包。因平民的麵包經常又乾又硬，且麵包裡不放鹽（除了無鹽稅的英格蘭與沿海區域），吃起來不帶半點鹹味，食用時需搭配飲料、醬汁或菜肴。

    古代的歐洲人酷愛香辛料（薑、肉桂、胡椒、丁香……），但這些進口產品只有貴族才吃得起。鄉間平行發展出另一種飲食口味，多以洋蔥、大蒜、酸葡萄汁和醋作為基本調味料。平時最常見的主餐是大鍋湯，食材以蔬菜、豆類為主，有時也加添肉類。用餐時先在淺碗底放一片麵包，再把菜肉湯水直接盛進碗裡，澆在麵包上；也有先盛湯，再把麵包泡進湯裡的作法。由於這是典型的晚間食物，所以直到今天，「湯」之於法國人仍屬晚間飲食，一般餐廳中午並不供應湯。

    除麵包外，古代民間還有一種更廉價的主食：粥。其原料和麵包差不多，都由穀物製成，但既不必進磨坊磨成粉，又無須大量柴火烘烤，只要加水煮爛即成。把吃剩的粥攤平下鍋，可煎成厚餅或薄餅，兩種都很方便白天攜帶外食。小紅帽帶給外婆的那塊餅，可能就是用類似方法製成的。

    (節自 韓璞〈小紅帽的籃子〉)'
