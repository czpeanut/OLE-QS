  stem: 根據本文，下列句意說明何者正確？
  options:
  - label: A
    content: 百舍重繭：長路奔波，腳底磨起了厚繭
  - label: B
    content: 吾欲藉子殺王：我想要借你之手殺楚王
  - label: C
    content: 是不殺少而殺眾：這是不殺年少者而要殺大批民眾
  - label: D
    content: 臣以王吏之攻宋：我將派用楚王的官吏前往攻打宋
  group_stem: '(一)

    公輸般為楚設機，將以攻宋。墨子聞之，百舍重繭，往見公輸般，謂之曰：「吾自宋聞子。吾欲藉子殺王。」公輸般曰：「吾義固不殺王。」墨子曰：「聞公為雲梯，將以攻宋。宋何罪之有？義不殺王而攻國，是不殺少而殺眾。敢問攻宋何義也？」公輸般服焉，請見之王。

    墨子見楚王曰：「今有人於此，舍其文軒，鄰有弊輿而欲竊之；舍其錦繡，鄰有短褐而欲竊之；舍其梁肉，鄰有糟糠而欲竊之。此為何若人也？」王曰：「必為有竊疾矣。」

    墨子曰：「荊之地方五千里，宋方五百里，此猶文軒之與弊輿也。荊有雲夢，犀兕麋鹿盈之，江、漢魚鱉黿鼉為天下饒，宋所謂無雉兔鮒魚者也，此猶梁肉之與糟糠也。荊有長松、文梓、楩、楠、豫樟，宋無長木，此猶錦繡之與短褐也。臣以王吏之攻宋，為與此同類也。」王曰：「善哉！請無攻宋。」

    《戰國策‧宋衛策》'
