- id: doc_113_台中_居仁_國文_g9s2e1_s6_4
  section: 6
  number: 4
  type: single
  page: 4
  stem: 根據本報導，下列推論何者最恰當？
  options:
  - label: A
    content: 因為空汙嚴重，所以駱駝演化出長睫毛與濃密鼻毛過濾髒空氣
  - label: B
    content: 相較於「VAL105 型」，擁有「ILE105 型」基因的人更能抗汙染
  - label: C
    content: 肺功能發育比較差的孩子，到中年時也將出現肺功能快速下降
  - label: D
    content: 孕婦體內調控免疫、解毒的基因會造成胎兒早產或低出生體重
  group_stem: '(二)

    除了源於自然，如野火、火山爆發等，人類工業和科技發展，使全球許多國家都有空汙問題，台灣也不例外！台北榮總基因醫師張家銘提到許多人好奇一個問題：「空汙這麼嚴重，人類會不會像沙漠裡的駱駝一樣，慢慢演化出長長的睫毛，或更濃密的鼻毛，好幫助過濾髒空氣呢？」這聽起來很像科幻小說，張家銘醫師直言，雖然目前還未觀察到明顯的外型變化，但不代表人類的身體完全沒反應，我們內在的基因、細胞如同工廠機器，其實已經開始篩選出「比較能抗汙染的人」。

    那究竟誰比較能抗汙染呢？醫師表示，在這場空汙時代的「隱形適應戰」裡，有個名為GSTP1 的基因，它正成為關鍵角色！這個基因負責生產一種叫「谷胱甘肽-S-轉移酶P1」的酵素，幫助分解、排除空氣中的毒物，如：柴油廢氣裡的多環芳香烴（PAHS）、氮氧化物（NOX）等。但並不是每個人的工廠效率都一樣，因為GSTP1
    基因有不同的形態，有些人天生工廠機器比較強，稱為「ILE105 型」，在面對汙染時，解毒速度快且受傷害也輕；有些人體內的工廠機器性能較差，稱為「VAL105
    型」，處理汙染物比較慢，受損也更嚴重。

    除了基因，我們每天接觸空氣的器官有肺和皮膚，它們也都在悄悄變化。住在空汙嚴重地區的孩子，肺功能發育比較差，長大後可能比別人更容易喘；中年人肺功能下降的速度，比住在空氣好的地方還快。皮膚長期暴露在細懸浮微粒和廢氣下，容易發炎、長斑、提早老化；眼睛、鼻子也變得越來越脆弱，過敏性鼻炎、乾眼症，幾乎成了現代都市人的「標配」。

    對空汙的「適應」，其實不只是在成年人身上發生。研究發現，孕婦若長期暴露在空汙中，胎兒不只是早產、低出生體重的機率變高，連基因表達、肺功能發育，可能都和空氣乾淨地區的嬰兒不一樣。有些孩子還沒出生，他們的肺，可能就已經比別人「輸在起跑點」。這些變化，或許不會讓人一眼看出這個孩子長得跟別人不一樣，但他們體內調控免疫、解毒的基因，可能已開始朝著「應付汙染」的方向微調。

    人們常說：「環境在改變！」其實人類自己也在變，包括我們的肺、我們的皮膚、我們的基因，甚至我們的下一代，都在這場空汙時代的「微型適應」中悄悄調整。張家銘醫師表示：「我們的身體一直在想辦法幫我們適應這個變化的環境。而我們能做的，不只是被動接受，還可以透過保養、鍛鍊、保護自己，讓我們活得更久、更健康。這是我們與環境共存的韌性，也是我們對自己和下一代的希望。」

    (改寫自記者張雅筑20250225 報導)'
