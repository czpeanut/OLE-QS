  group_stem: '【甲】

    管仲 夷吾者，潁上人也。少時常與鮑叔牙游，鮑叔知其賢。管仲貧困，常欺鮑叔，鮑叔終善遇之，不以為言。已而鮑叔事齊公子小白，管仲事公子糾。及小白立為桓公，公子糾死，管仲囚焉。鮑叔遂進管仲。

    《史記‧管晏列傳》

    【乙】

    管仲有病，桓公問之，曰：「仲父之病病矣，可不諱云，至於大病，則寡人惡乎屬國而可？」管仲曰：「公誰欲與？」公曰：「鮑叔牙。」曰：「不可。其為人絜廉善士也，其於不己若者不比之，又一聞人之過，終身不忘。使之治國，上且鉤乎君，下且逆乎民。其得罪於君也，將弗久矣。」

    《莊子‧徐無鬼》'
