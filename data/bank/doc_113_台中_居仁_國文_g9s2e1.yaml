  group_stem: '起家以祿位①，歷數職而進一階。才高位下，免責而已。天子不知，公卿不識。四十五十，而無聞焉。於是退歸，以酒德游於鄉里。往往賣卜②，時時著書。行若無所之，坐若無所據。鄉人未有達其意也。嘗耕東皋③，號東皋子。身死之日，自為銘焉。

