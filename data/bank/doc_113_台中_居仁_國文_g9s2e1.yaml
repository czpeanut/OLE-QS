    太宗謂侍臣曰：「朕聞西胡愛珠，若得好珠，劈身藏之。」侍臣咸曰：「貪財損己，實為可笑。」太宗曰：「勿惟笑胡，今官人貪財不顧性命，身死之後，子孫被辱，何異西胡之愛珠耶！帝王亦然，恣情放逸，勞役無度，信任群小，疏遠忠正，有一於此，豈不滅亡？隋煬帝奢侈自賢，身死匹夫，亦為可笑。」魏徵對曰：「臣聞魯哀公謂孔子曰：『有人好忘者，移宅乃忘其妻。』孔子曰：『又有好忘者甚於此，丘見桀
    紂之君，乃忘其身。』」太宗曰：「朕與公等既知笑人，今共相匡輔，庶免人笑。」

    (王方慶《魏鄭公諫錄．卷三》)'
