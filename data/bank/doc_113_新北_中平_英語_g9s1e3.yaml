- id: doc_113_新北_中平_英語_g9s1e3_s2_34
  section: 2
  number: 34
  type: single
  page: 3
  stem: 34.(    ) Which of the following is true about lab-grown meat?
  options:
  - label: A
    content: It is made from plants in a lab.
  - label: B
    content: It helps the environment by producing less carbon dioxide.
  - label: C
    content: It has been sold in the United States for many years.
  - label: D
    content: One animal cell makes only a small amount of meat.
  group_stem: 'How ''lab-grown'' meat could help the planet and our health                  素養題

    Cultivated meat is real meat which is made from animal cells grown in a lab. It
    is a new way to make meat that is better for the environment because it makes
    fewer gases like carbon dioxide that cause global warming. Scientists use special
    ways to grow this meat without needing to raise or kill animals.

    In Singapore, people can eat this kind of meat for the first time. This idea is
    still new and has only been worked on for about 10 years. It will take more time
    before people in the United States can find and buy this kind of meat in stores.

    Josh Tetrick, a leader in this work, says one animal cell can be used to make
    a very large amount of meat—enough to feed many people. This way of making meat
    might also use less water which helps keep the land and oceans away from the problems
    that are often caused by everyday farming methods. People in Singapore are trying
    a new type of food that could change how meat is made in the future.                                   
    lab 實驗室  cell 細胞'
