- id: doc_113_新北_中平_英語_g9s1e3_s2_47
  section: 2
  number: 47
  type: single
  page: 6
  stem: 47. Why doesn't Scrabble require players to know the meaning of words?
  options:
  - label: A
    content: The tiles have different point values in English and Spanish.
  - label: B
    content: Players only need to know which letter combinations(組合) can be used in
      the game.
  - label: C
    content: Scrabble is about understanding the meanings.
  - label: D
    content: Scrabble is an interesting game, so meanings are not important.
  group_stem: "Spanish Scrabble Winner Does Not Speak Spanish\nA New Zealand man recently\
    \ won an international Spanish Scrabble contest although he does not speak Spanish.\
    \ Scrabble is a board game in which players form words from letters to get points.\
    \ Nigel Richards is a professional Scrabble player. He holds five English-language\
    \ world championships in the board game. But in November, he won the Spanish world\
    \ Scrabble championship in Granada, Spain. In the competition, he lost one game\
    \ out of 24. Many people are wondering how Richards could win without speaking\
    \ Spanish. Liz Fagerlund is a New Zealand Scrabble official and a friend of Richards.\
    \ She recently told the Associated Press that Richards started memorizing the\
    \ Spanish language Scrabble word list one year ago. Playing Spanish Scrabble required\
    \ some different methods to win. The wooden pieces, or tiles, used in the word\
    \ game have different values in English and Spanish Scrabble. Richards also had\
    \ to consider thousands of additional seven-, eight- and nine-letter words in\
    \ the Spanish language.\nHis victories are famous in the Scrabble world. Tens\
    \ of thousands of people have watched and analyzed his games in YouTube videos.Scrabble\
    \ does not require players to know the meanings of words. Players only need to\
    \ know what combinations of letters can be used in the game.     \n      professional\
    \ 專業的  championship 錦標賽  competiton 競賽  wondering 覺得奇怪的  memorizing 記憶  tiles\
    \ 牌"
