- id: doc_113_新北_中平_英語_g9s1e3_s2_43
  section: 2
  number: 43
  type: single
  page: 5
  stem: 43. Which of the following is true about the reading?
  options:
  - label: A
    content: Teens spend most of their day on social media.
  - label: B
    content: Social media is always bad for teens.
  - label: C
    content: Social media can help teens make friends and learn new things.
  - label: D
    content: Social media causes no problems for teens.
  group_stem: 'Social Media and Teenagers: Good and Bad Points


    Social media is a big part of teenagers'' lives. On average, teens spend about
    1.6 hours each day on social media. It helps teens connect with friends, share
    their thoughts, and learn new things. It can make them feel part of a group and
    provide support. However, it also has bad points. About 44% of teens have bad
    experiences online, like getting hurtful messages or feeling bad. Too much social
    media can cause stress, worry, and trouble sleeping.

    Some governments are trying to protect teens. For example, social media is banned
    for children under 16 in Australia, the first country in the world to do so. The
    kids who are under 16 must get permission from their parents when they want to
    use social media.

    Parents are important in helping teens use social media safely. Moreover, they
    should set clear rules for using it and teach good online habits.

    Social media can be helpful when it is used in the right way. You can make friends,
    learn new things, and get support on it. The most important thing is how to use
    it wisely.                                 average 平均 ban 禁止'
  shared_asset: g2_43_46
