- id: doc_113_高雄_陽明_國文_g8s1e1_s3_39
  section: 3
  number: 39
  type: single
  page: 6
  stem: 根據上文，匠人石如何判斷神樹的「無用」呢？
  options:
  - label: A
    content: 神樹的木材質地太硬，刀斧難以砍伐
  - label: B
    content: 神樹生長在祭壇上，受到人們的保護
  - label: C
    content: 神樹的木材不適合用於製作任何物品
  - label: D
    content: 神樹外形不佳，無法滿足匠人的需求。
  group_stem: '話說有一位名叫石的木匠，看到一棵被世人崇拜的櫟樹。這棵櫟樹的樹冠大到可以遮蔽數千頭牛，用繩子量一量樹幹，足足有十多丈粗，樹梢高過了山巔，離地面八十尺處才開始分枝，用它來造船可造十多艘。

    前來觀賞這棵神樹的人絡繹不絕，但這位匠人經過的時候，連正眼都不看一眼，直接走了過去。而他的徒弟站在樹旁看了很久，然後跑過來問匠人石說：「自我拿起刀斧跟隨先生，從來不曾見過這樣壯美的樹木。可是先生卻不肯看一眼，腳步都不停地往前走，這是為什麼呢？」匠人石回答說：「算了，不要再說它了！這是一棵沒什麼用的樹，用它做成船，船會沈；用它做成棺材，棺材會很快朽爛；用它做成器皿，器皿也一定會很快毀壞；用它做成屋門，一定不會合縫；用它做成屋柱，一定會被蟲蛀掉。這是不能取材的樹，正因為它沒什麼用處，所以它才能這麼長壽，長這麼大。」

    匠人石回到家裡，晚上夢見這棵神樹對他說：「你怎麼能用這些東西，跟我相提並論呢？你拿那些可用之木來跟我相比，比如楂、梨、橘、柚都屬於果樹，果實成熟就會被打落在地，打落果子以後，枝幹也就會遭到摧殘，大的枝幹被折斷，小的枝幹被拽下來。這就是因為它們能結出鮮美果實，才苦了自己的一生，所以常常不能終享天年，而會半途夭折。

    萬物都是這樣，我尋求無用的辦法，已經很久很久了，幾乎被砍死，這才保全住性命，無用也就成就了我最大的用處。假如我真的是有用，那還能夠獲得，『延年益壽』這一最大的用處嗎？況且你和我都是『物』，你這樣看待事物怎麼可以呢？你不過是幾近死亡的沒有用處的人，又怎麼會真正懂得沒有用處的樹木呢！」

    ——改寫自莊子〈人間世〉'
