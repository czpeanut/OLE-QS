  type: single
  page: 5
  stem: 根據本文內容說明何者最為正確？
  options:
  - label: A
    content: 義興「三橫」之中，又以白額虎為首害
  - label: B
    content: 周處和蛟龍在水中搏鬥，最後周處力盡而死
  - label: C
    content: 從首段已透露出鄉人「忌憚周處」的心理狀態
  - label: D
    content: 可由本文印證出「獨善其身」的生命智慧。
  group_stem: '周處年少時，兇強俠氣，為鄉里所患。又義興水中有蛟①，山中有白額虎，並皆暴犯②百姓。義興人謂為「三橫③」，而處尤劇。人說服處殺虎斬蛟，實冀④三橫唯餘其一。

    處即刺殺虎，又入水擊蛟。蛟或浮或沒，行數十里，處與之俱。經三日三夜。鄉里皆謂已死，更相慶。竟殺蛟而出，聞里人相慶，始知為人情所患，有自改意。

    ——劉義慶《世說新語》

    【注釋】

    ①蛟：古代傳說中獨角如龍的動物，民間相傳牠興風作浪，能發洪水。②暴犯：禍害侵犯。③橫：「橫」有乖違之義，故猶言三害。④冀：希望。'
