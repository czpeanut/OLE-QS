  stem: 根據〈華王優劣〉一文的說明何者錯誤？
  options:
  - label: A
    content: 華歆的猶豫，是來自擔心逃難速度延遲
  - label: B
    content: 旨在說明行善助人也需考慮周詳、講求厚道
  - label: C
    content: 劉義慶模仿史官文筆，對王朗做出批判指責
  - label: D
    content: 王朗先主張同意共同乘船，後卻輕諾寡信。
  group_stem: '〈華王優劣〉

    華歆、王朗俱乘船避難，有一人欲依附，歆輒難之。朗曰：「幸尚寬，何為不可？」後賊追至，王欲舍所攜人。歆曰：「本所以疑，正為此耳。既已納其自託，寧可以急相棄邪？」遂攜拯如初。世以此定華、王之優劣。

    ——《世說新語》〈德行〉


    〈王藍田食雞子〉

    王藍田性急。嘗食雞子，以筯刺之，不得，便大怒，舉以擲地。雞子於地圓轉未止，仍下地以屐齒蹍之，又不得，瞋甚，復於地取內口中，齧破即吐之。王右軍聞而大笑曰：「使安期有此性，猶當無一豪可論，況藍田邪？」

    ——《世說新語》〈忿狷〉'
