  number: 11
  type: single
  page: 2
  stem: 哥吉拉正在蒐集關於國文課「古體詩」的簡報資料，請問何者所述可作為正確的參引資料？
  options:
  - label: A
    content: 金崗：古體詩，亦簡稱「古歌」，是相對於南北朝的近體詩而言
  - label: B
    content: 金鋼郎：南宋詩人也常運用這種體裁作詩，如白居易的〈慈烏夜啼〉
  - label: C
