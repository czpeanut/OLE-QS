  group_stem: '少司命祠前臨汩羅江處搭起一座高臺，高臺對岸是祭壇，人群圍在四周恭敬奉上祭品。兩邊樓船各一，左為男巫，右為女巫。羋月與黃歇各自上了樓船。當羋月換衣，頭戴蘭冠，樓船已駛近高臺。

    羋月率眾女爬梯而上，對面黃歇也率眾男登臺，原本遙遙相對的羋月與黃歇，在眾人簇擁下緩緩走近，長袖相合，四目含情，當真是「獨與余兮目成」。人群中，秦王駟也遠遠看著。他雖來得晚些，卻正趕上「滿堂兮美人，忽獨與余兮目成」這一節。他沒想到九公主跳祭舞竟有神靈附體般的魔力，與先前判若兩人，萬物彷彿因她而失色。

    ——改寫自蔣勝男《羋月傳》'
