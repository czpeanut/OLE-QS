questions:
- id: doc_113_高雄_七賢_社會_g8s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 中國曾經歷了東周(春秋、戰國)、魏晉南北朝紛亂不已的分裂時期，請問：結束二個分裂時期的朝代「分別」是？
  options:
  - label: A
    content: 漢、唐
  - label: B
    content: 秦、隋
  - label: C
    content: 秦、唐
  - label: D
    content: 商、三國。
- id: doc_113_高雄_七賢_社會_g8s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 位於中國北方的長城，是人類歷史上最大型的建築物之一。請問：關於長城的敘述何者正確？
  options:
  - label: A
    content: 長城最早興建於秦始皇
  - label: B
    content: 長城最初興建是為了抵抗匈奴
  - label: C
    content: 長城被視為是西域和中國本土的分水嶺
  - label: D
    content: 長城最初興建是為了顯現國力。
- id: doc_113_高雄_七賢_社會_g8s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 殷墟出土的甲骨文證明商朝已進入有冊有典的歷史時代。隨之興起的周，打敗商紂王後成為新的統治者。請問：關於商、周的敘述，何者錯誤？
  options:
  - label: A
    content: 商、周在政治上皆採行分封的概念
  - label: B
    content: 商、周皆起源於黃河一帶
  - label: C
    content: 商王與各地分封勢力關係緊密，控制力強
  - label: D
    content: 周以宗法血緣強化對分封勢力的控制。
- id: doc_113_高雄_七賢_社會_g8s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 七賢園遊會有攤位在賣「新疆胡餅」，這種中間薄、邊緣厚的燒餅，同學看了都覺得很神奇。聽老師說胡餅傳入中國的歷史悠久，現今已是中國北方主要的食物之一。請問：「胡」餅最有可能是從什麼途徑傳入中國？
  options:
  - label: A
    content: 中亞絲路貿易
  - label: B
    content: 南亞海上貿易
  - label: C
    content: 北方草原貿易
  - label: D
    content: 東亞沿海貿易。
- id: doc_113_高雄_七賢_社會_g8s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 某學者指出，西元前二世紀因為漢代君王的政策，使得比較完備的入仕途徑得以形成，並影響中國日後的選官制度。請問：這裡的「比較完備的入仕途徑」是指？
  options:
  - label: A
    content: 推舉孝廉
  - label: B
    content: 九品官人法
  - label: C
    content: 封建世襲
  - label: D
    content: 科舉制度。
- id: doc_113_高雄_七賢_社會_g8s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 以下有三句與任官選才制度有關的俗語：(甲)上品無寒門，下品無世族、(乙)遺子黃金滿屋，不如教子一經、(丙)十年寒窗無人問，一舉成名天下知。請問：此選才制度實施時代的先後，正確依序為？
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙丙甲
  - label: C
    content: 丙甲乙
  - label: D
    content: 乙甲丙。
- id: doc_113_高雄_七賢_社會_g8s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 中國某個朝代認為能消滅前朝，是因為該朝君王依恃天命進行統治，故又稱「天子」。這個朝代最有可能是下列何者？
  options:
  - label: A
    content: 商
  - label: B
    content: 周
  - label: C
    content: 秦
  - label: D
    content: 漢。
- id: doc_113_高雄_七賢_社會_g8s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 「大化」在日語的意思是偉大的變化，同時也是孝德天皇的年號。「大化革新」對於日本制度有很多影響，請問下列敘述何者錯誤？
  options:
  - label: A
    content: 在學習中國的佛法和文化
  - label: B
    content: 欲學習封建制度加強天皇權力
  - label: C
    content: 是一場唐化運動，以唐制度為藍本
  - label: D
    content: 文字也屬於漢字文化圈之一。
- id: doc_113_高雄_七賢_社會_g8s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 小柱到高雄佛光山觀光時，才得知這是臺灣最大的佛教道場。他馬上回想起歷史課曾學習佛教在中國的發展。請問：關於佛教對中國影響的敘述，以下何者錯誤？
  options:
  - label: A
    content: 漢代經由絲路傳入中國
  - label: B
    content: 發展至唐代最顛峰，而玄奘貢獻良多
  - label: C
    content: 雲岡石窟展現出魏晉時期佛教也甚為流行
  - label: D
    content: 唐代文成公主曾到新羅大力宣揚佛教。
- id: doc_113_高雄_七賢_社會_g8s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 小彬的歷史報告決定以「唐太宗」作為主題。請問：他上網蒐集的資料中，何者可以放進報告中？
  options:
  - label: A
    content: 強調儒家的重要性
  - label: B
    content: 積極推行漢化政策，鼓勵胡漢通婚
  - label: C
    content: 消滅東突厥，被尊稱為「天可汗」
  - label: D
    content: 首創中國皇帝制度。
- id: doc_113_高雄_七賢_社會_g8s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 八世紀中期，唐朝的軍隊與大食交戰於怛羅斯。請問：此戰爭造成下列何種影響？
  options:
  - label: A
    content: 伊斯蘭教傳入
  - label: B
    content: 絲路的構成
  - label: C
    content: 造紙術西傳
  - label: D
    content: 佛教經典傳入。
- id: doc_113_高雄_七賢_社會_g8s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 上歷史課時，老師用右圖的變化來說明君主在統一國家後的改革。關於此項改革的社會背景敘述，何者正確？
  options:
  - label: A
    content: 確立中央集權體制
  - label: B
    content: 建立選拔人才標準
  - label: C
    content: 促使社會經濟的整合
  - label: D
    content: 穩固儒家思想的重要性。
  assets:
  - key: s1_12_f1
    kind: figure
    file: doc_113_高雄_七賢_社會_g8s1e1/s1_12_f1.png
- id: doc_113_高雄_七賢_社會_g8s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 承上題，實施此項政策的君主是？
  options:
  - label: A
    content: 唐太宗
  - label: B
    content: 漢武帝
  - label: C
    content: 秦始皇
  - label: D
    content: 隋文帝。
  group_stem: （第 12 題）上歷史課時，老師用右圖的變化來說明君主在統一國家後的改革。關於此項改革的社會背景敘述，何者正確？
- id: doc_113_高雄_七賢_社會_g8s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: 周王室東遷之後，天子的地位日漸低落，各諸侯國都力求變法富國強兵，以避免被他國兼併，而強調厲行法治，並實施編列戶籍政策，使其國家成功統一天下的改革者是？
  options:
  - label: A
    content: 孔子
  - label: B
    content: 張騫
  - label: C
    content: 玄奘
  - label: D
    content: 商鞅。
- id: doc_113_高雄_七賢_社會_g8s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 元稹是唐代著名詩人，寫出「曾經滄海難為水，除卻巫山不是雲」等淒美詩句。依據學者考證，元稹祖先原本出自北魏皇室，後來因國家推動漢化政策，才改為漢姓「元」。請問：元稹的家族最初應該屬於哪個民族？
  options:
  - label: A
    content: 鮮卑
  - label: B
    content: 匈奴
  - label: C
    content: 犬戎
  - label: D
    content: 突厥。
- id: doc_113_高雄_七賢_社會_g8s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 承上題，關於此漢化政策的敘述，何者錯誤？
  options:
  - label: A
    content: 推動者為北魏孝文帝
  - label: B
    content: 將首都從平城遷移到洛陽
  - label: C
    content: 有效促進了胡漢文化融合
  - label: D
    content: 穩定了北方的經濟重心地位。
  group_stem: （第 15 題）元稹是唐代著名詩人，寫出「曾經滄海難為水，除卻巫山不是雲」等淒美詩句。依據學者考證，元稹祖先原本出自北魏皇室，後來因國家推動漢化政策，才改為漢姓「元」。請問：元稹的家族最初應該屬於哪個民族？
