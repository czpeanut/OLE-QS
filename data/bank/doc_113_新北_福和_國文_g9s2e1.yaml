  stem: '40.依照以下「中央氣象局地震震度分級表」，蒲松齡 《聊齋志異．地震》一文所描述的地震，應屬於哪一種震度？

    | 震度分級 | 屋內外情形 |

    | --- | --- |

    | 0 級 | 無感 |

    | 1 級 | 微震 |

    | 2 級 | 輕震 懸掛物微搖晃，靜止的汽車輕輕搖晃，類似卡車經過，歷時短 |

    | 3 級 | 弱震 碗盤門窗發出聲音，懸掛物、電線搖擺。靜止的汽車搖動。 |

    | 4 級 | 中震 電線明顯搖晃，少數牆磚剝落，少數未固定物品傾倒掉落，少數傢俱移動 |

    | 5 級 | 強震 部分牆磚剝落，部分未固定物品傾倒，少數傢俱移動或翻倒，部分牆壁產生裂痕。 |

    | 6 弱 | 烈震 鬆軟土層出現噴沙噴泥現象。門窗扭曲變形。部分地區電力、自來水、或通訊中斷 |

    | 7 級 | 劇震 山崩地裂，地形地貌改變，建築物損壞或倒塌。大範圍水電、通訊中斷，鐵軌彎曲 |'
