  type: single
  page: 2
  stem: '18.唐詩、宋詞、元曲這三種不同的體裁，除了在形式上各有不同規定之外，就內容而言，文學評論界向來有「詩莊、詞媚、曲諧」之論。下列編號甲、乙、丙、丁、戊的韻文，將之歸類為「近體詩、詞、曲」，請問哪個選項統計的總數正確?

    | 編號 | 韻文作品 |

    | --- | --- |

    | 甲 | 喇叭，嗩吶，曲兒小腔兒大。官船來往亂如麻，全仗你擡聲價。軍聽了軍愁，民聽了民怕。哪裏去辨甚麼真共假？眼見的吹翻了這家，吹傷了那家，只吹的水盡鵝飛罷！
    |

    | 乙 | 雲鬢亂，晚妝殘，帶恨眉遠岫攢。斜托香腮春筍嫩，為誰和淚倚闌干﹖ |

    | 丙 | 清溪一葉舟，芙蓉兩岸秋。采菱誰家女，歌聲起暮鷗。亂雲愁，滿頭風雨，戴荷葉歸去休。 |

    | 丁 | 淒涼寶劍篇，羈泊欲窮年。黃葉仍風雨，青樓自管絃。新知遭薄俗，舊好隔良緣。心斷新豐酒，銷愁鬥幾千。 |

    | 戊 | 舊酒沒，新醅潑。老瓦盆邊笑呵呵。共山僧野叟閒吟和。他出一對雞，我出一個鵝，閒快活。 |'
  options:
