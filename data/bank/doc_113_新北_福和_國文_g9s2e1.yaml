- id: doc_113_新北_福和_國文_g9s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '3.「桎」本義是古代刑具的一種，即腳鐐；「梏」本義也是古代的刑具。「桎梏」合起來則衍生為「束縛」的意思。請問下列解說欄中敘述正確的有幾個？

    | 編號 | 解說 |

    | --- | --- |

    | 甲 | 「陶鑄」與「陶冶」都具有「塑造化育」之義。 |

    | 乙 | 準：檢驗水平與否的工具。繩：檢驗垂直與否的工具。「準繩」與「圭臬」同義。 |

    | 丙 | 規：畫圓形的器具。矩：畫方形的器具。「規矩」衍生義為法度、準則。 |

    | 丁 | 砥：細的磨刀石。礪：粗的磨刀石。「砥礪」衍生出粗糙不平之義。 |

    | 戊 | 跋：在陸地行走。涉：徒步渡水。「跋涉」衍生為旅途艱辛之義。 |'
  options:
  - label: A
    content: 二個
  - label: B
    content: 三個
  - label: C
    content: 四個
  - label: D
    content: 五個
