  section: 1
  number: 29
  type: single
  page: 4
  stem: "29. \n「沙鯤漁火」是清代臺灣八景之一，指的是臺江內海的沙洲旁有夜間的漁船燈火，與星光相互輝映之美景。 \n  「沙鯤」為臺江內海上的七個沙洲，由於在海平面上形似鯤魚身體而稱之，位於今日臺南市安平區與南區的海岸地帶。一鯤身在安平古堡附近；二鯤身即億載金城一帶；三鯤身即漁光島；四鯤身位於南區鯤鯓里。五、六、七鯤身則說法不一，其位置約在今南區喜樹、灣裡以及高雄市茄萣區白砂崙一帶，換言之「沙鯤漁火」的場域約在今臺南安平至高雄白砂崙之間。\
    \                          (改寫自臺南市政府文化局網站) \n下列關於本文的敘述，何者較為正確？"
