  section: 1
  number: 43
  type: single
  page: 7
  stem: 43.根據文章中的敘述，安迪為何能知道瑪吉撒謊呢？
  options:
  - label: A
    content: 安迪識破瑪吉說的伯爵照片其實是名人照片
  - label: B
    content: 瑪吉曾經愛過伯爵，但因為傷心過度而選擇隱瞞真相
  - label: C
    content: 安迪暗中調查瑪吉過去情史的來龍去脈
  - label: D
    content: 瑪吉的言詞前後矛盾，讓安迪察覺異樣。
  group_stem: "「你不肯說，我還不想聽。」瑪吉道，「無非是政治上的事，可是你對我沒有笑臉不應該。」\n  過了一會安迪才說：「瑪吉，妳對我的感情有沒有對費爾南多伯爵的深？」\n\
    \  他等了很久，瑪吉沒有回答，後來，她突然靠到他肩上哭起來，泣不成聲，緊抓著他的手，眼淚流溼了黑縐紗布衣裳。「得啦，得啦，得啦！」安迪拋開自己的煩惱，安慰道：「有什麼大不了的事呢？」\n\
    \   瑪吉抽噎著說：「安迪，我對你說了謊，你是不會願意與我結婚，不會再愛我了。不過我覺得應該把實情告訴你。安迪，伯爵這個人根本就沒有過，除了你以外，我從來沒有過情人。但是別的姑娘都有，而且愛掛在嘴邊說，她們越說越叫人不好受。你知道，安迪，我穿黑衣服顯得漂亮，所以我到一家賣照片的商店買了那一張，還翻拍了一張小的放進我項鏈的相盒裡，編造了遇上伯爵、後來他又死了的一套謊話，要不然我不能穿上這身黑衣服。說謊的人沒誰愛，你會不要我，安迪，我也沒臉見人，我沒喜歡過別的人，只喜歡你，就是這麼回事。」\n\
    \   然而，安迪沒有鬆開手臂，反而把她摟得更緊了。她一看，只見他臉上沒有了愁容，卻笑了。「安迪，你能……你能原諒我嗎？」\n 「當然能。這事算什麼！」安迪說，「把伯爵的事忘了吧！瑪吉，妳把事實真相全告訴了我，原來我也只是希望妳別拖到婚禮後說，寶貝！」\n\
    \   瑪吉知道她已經得到了原諒，紅著臉一笑說：「安迪，原來你相信真有那麼個伯爵嗎？」「不太相信。」安迪伸手摸出煙盒，「因為妳那相盒裡的照片是名人邁克•沙利文的。」\n\
    (歐．亨利〈伯爵和婚禮的客人（節錄）〉)"
