  section: 1
  number: 31
  type: single
  page: 5
  stem: 31.下列關於《聊齋志異選．種梨》的分析，何者正確?
  options:
  - label: A
    content: 塑造鮮明人物形象:道士熱心慷慨，肆中傭保者我行我素，賣梨者器量狹小
  - label: B
    content: 透過第一人稱角度敘事，呈現人物的言語、行為、心理，讓讀者如臨其境
  - label: C
    content: 採順敘法，依序述:乞梨→贈梨→種核→芽成樹→贈梨→伐樹→察覺失梨的過程
  - label: D
    content: 藉真實歷史事件，勉人須多為人設想，才能廣結善緣，寓有深意。
  group_stem: "《聊齋志異選．種梨》 蒲松齡\n有鄉人貨梨於市，頗甘芳，價騰貴。有道士破巾絮衣，丐於車前。鄉人咄之，亦不去，鄉人怒，加以叱罵。道士曰：「一車數百顆，老衲止丐其一，於居士亦無大損，何怒為？」觀者勸置劣者一枚令去，鄉人執不肯。\n\
    \  肆中傭保者，見喋聒不堪，遂出錢市一枚，付道士。道士拜謝，謂眾曰：「出家人不解吝惜，我有佳梨，請出供客。」 或曰：「既有之，何不自食？」曰：「吾特需此核作種。」於是掬梨大啗，且盡，把核於手，解肩上鑱，坎地深數寸，納之而覆以土，向市人索湯沃灌。好事者於臨路店索得沸瀋，道士接浸坎處。萬目攢視，見有勾萌出，漸大。俄成樹，枝葉扶疏，倏而花，倏而實，碩大芳馥，纍纍滿樹。道士乃即樹頭摘賜觀者，頃刻向盡。已，乃以鑱伐樹，丁丁良久，乃斷，帶葉荷肩頭，從容徐步而去。\n\
    \  初，道士作法時，鄉人亦雜眾中，引領注目，竟忘其業。道士既去，始顧車中，則梨已空矣。方悟適所俵散，皆己物也。又細視車上一靶亡，是新鑿斷者，心大憤恨。急跡之，轉過牆隅，則斷靶棄垣下，始知所伐梨本，即是物也。道士不知所在，一市粲然。"
