- id: doc_113_新北_福和_國文_g9s2e1_s1_49
  section: 1
  number: 49
  type: single
  page: 8
  stem: 49.以下文句皆省略主語，請判斷下列文句的主語配對何者正確？
  options:
  - label: A
    content: 晒乾可作茶──愛玉凍
  - label: B
    content: 每往來嘉義，辦土宜──同安人
  - label: C
    content: 掬而啜之──水面
  - label: D
    content: 出凍以賣──糖。
  group_stem: '臺灣為熱帶之地，三十年前無賣冰者，夏時僅啜仙草與愛玉凍。按《臺灣府誌》謂︰「仙草高五、六尺，晒乾可作茶，能解暑毒。煮爛絞汁去渣，和粉漿再煮成凍，和①糖泡水，飲之甚涼。」而愛玉凍則府、縣各誌均未載。聞諸②故老，謂道光初有同安人某，居府治媽祖樓街，每往來嘉義，辦土宜③。一日，過後大埔，天熱渴甚，赴溪飲。見水面成凍。掬而啜之，冷沁心脾。自念此間暑，何得有冰？細視水上，樹子錯落，揉之有漿，以為此物化之也。拾而歸家。子細如黍，以水絞之，頃刻成凍，和糖可食。或合兒茶少許，則色如瑪瑙。某有女曰愛玉，年十五，長日④無事，出凍以賣，人遂呼為「愛玉凍」。                                          （連橫〈愛玉凍〉）

    【注釋】：①和：攪拌、混合。②諸：「之於」的合音。③辦土宜：採買土產。④長日：夏季的白天。'
