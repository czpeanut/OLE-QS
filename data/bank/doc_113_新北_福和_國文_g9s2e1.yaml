  section: 1
  number: 45
  type: single
  page: 7
  stem: 45.本文中提到農夫對待牛的立場，與下列何者最接近？
  options:
  - label: A
    content: 保護野生動物，人才能與自然共存
  - label: B
    content: 農夫認為牛是財產，因此只在必要時才餵養與照顧
  - label: C
    content: 出於對牛的疼惜，農夫選擇夜間較涼爽時讓牛拉車，以減少負擔
  - label: D
    content: 順從自然界的規律，保持生態平衡。
  group_stem: "郁永河來到臺灣，夜裡會聽見什麼？看見什麼呢？\n 郁永河在他的自注說：「牛車挽運百物，月夜車聲不絕。蝘蜓音偃忝，即守宮也。臺灣守宮善鳴，聲似黃雀。」顯然，郁永河在夜裡聽到牛車聲和壁虎的叫聲。那想必是一個繁華的城市，在夜裡，商旅仍駕著牛車在運輸貨物。我臆測：當今我們熟悉的夜市是不是在十七世紀就存在了？也許郁永河所聽到的牛車聲是夜市商人結束一夜的辛勞後快樂回家的聲音。然而，父親說：「臺灣的夜市是我中年以後才出現的。牛車在夜裡運輸貨物，是往昔臺灣社會中很普遍的現象。如果沒有月光，人們也會在牛車上掛一盞燈。」「為什麼要在晚上？」我問。父親的答案讓我感動良久：「因為牛白天的時候怕熱，主人疼惜牠，所以利用晚上比較涼爽的時候讓牛來拉車。」沒有人用鞭去策牛走在炎炎烈日下，拖拉重重的一車貨。父親說：城裡的商人懂農夫的惜牛之情，所以配合在晚上才進行農作物進貨的工作。有時，清晨三、四點也有牛車在送貨。而在大家都同樣愛牛、惜牛的臺灣農村社會裡，月夜裡的確會有許多牛車行走在街道上的情形。\n\
    \ 那個屬於郁永河的旅夜，月光似流水，流洩一城的清輝。一輛又一輛的牛車絡繹於途，軋軋，達達。一條條街上，人們正在卸貨、進貨。這是清領臺灣的第十四年，也是荷蘭人在臺灣建城後的七十年，臺灣在繁忙中。而郁永河顯然是被這樣的聲音嚇著了，在睡夢中，猛然驚醒，他以為那是中國古老詩詞中的夜行軍，以為自己身處戰地，號角已經響起，馬車正奔赴一場生死之戰。\n\
    \ 擾他清夢的還不只這牛車聲，還有壁虎的叫聲。讀到這裡，你是不是會莞爾一笑呢？原來，臺灣的壁虎早在十七世紀末就在許多人的床頭鳴叫著。牠，留名於裨海紀遊，而且贏得「善鳴」之譽，郁永河還說那聲音像黃雀呢！\n\
    \ 有此一說：臺灣的壁虎在濁水溪以南才會叫，濁水溪以北的區域是聽不到壁虎的叫聲的，即使你看見壁虎在壁上。\n 那麼，這個夜晚，郁永河顯然還沒渡過濁水溪。\n\
    \ 他，夜眠在南臺灣，一個繁忙的都市裡。             （李靜修 〈夜眠臺灣〉）"
