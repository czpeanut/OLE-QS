  stem: 38.四位記者想向大眾介紹上文這場大地震，擬定的新聞報導標題如下。可惜只有一則標題符合新聞求「真」的條件，請問該標題是下列何者呢?
  options:
  - label: A
    content: 康熙七年暮夏魯中地區地震，災後民眾議論紛紛，竟未察自己赤身裸體！
  - label: B
    content: 震前聞巨響!百姓警覺地震將臨，速躲案几下，因而未被傾覆酒杯所傷
  - label: C
    content: 稷下數聲傳:樑柱斷裂聲、屋牆傾塌聲、隕石墜地聲、孩童號哭聲、雞狗鳴聲
  - label: D
    content: 蒲松齡故鄉大震！井傾無法汲，河水倒灌、山體裂，沂水陷落一洞達數畝廣。
  group_stem: "康熙七年六月十七日夜，地大震。余做客於稷下①，方與表兄李篤之對燭飲。忽聞有聲如雷，自東南來，向西北去。眾駭異，不解其故。俄而几案擺簸，酒杯傾覆，屋梁椽②柱，摧折有聲。眾人相顧失色。久之，方知地震，各疾趨出。見樓閣房舍，仆③而復起，牆傾屋塌之聲，與兒啼女號，喧如鼎沸。人眩暈不能立，坐地上，隨地轉側④。河水傾潑丈餘，雞鳴犬吠滿城中。逾一時許，始稍定。視街上，則男女裸聚，競相告語，並忘其未衣也。\n\
    後聞某處井傾仄⑤，不可汲；某家樓臺南北易向；棲霞⑥山裂；沂水⑦陷穴，廣數畝。此真非常之奇變也。\n                            \
    \        （改寫自蒲松齡 《聊齋志異．地震》）\n【注釋】①稷下：地名，此指臨淄，位於山東省中部，山東省，簡稱魯。\n      ②椽：音ㄔㄨㄢˊ，古代建築中用以支撐房頂與屋瓦的木條。\n\
    \      ③仆：音ㄆㄨ，傾斜。\n      ④轉側：移換方位。\n        ⑤傾仄：傾斜。仄，通「側」。\n        ⑥棲霞：縣名。今屬山東省。\n\
    \        ⑦沂水：縣名。今屬山東省。"
