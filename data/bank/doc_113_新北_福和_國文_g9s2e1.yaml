  stem: 34.下列「」中的字義，何者前後相同？
  options:
  - label: A
    content: 老衲止丐其一，「於」居士亦無大損/好事者「於」臨路店索得沸瀋，道士接浸坎處。
  - label: B
    content: 於居士亦無大損，何怒「為」？ /如今人方為刀俎，我為魚肉，何辭「為」？ 於是遂去。(《史記．項羽本紀》)
  - label: C
    content: 又細視車上一靶「亡」，是新鑿斷者，心大憤恨/樂以迎來，哀以送往，雖祭 「亡」如在。(《後漢書．肅宗孝章帝紀》)
