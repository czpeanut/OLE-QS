  group_stem: "康熙七年六月十七日夜，地大震。余做客於稷下①，方與表兄李篤之對燭飲。忽聞有聲如雷，自東南來，向西北去。眾駭異，不解其故。俄而几案擺簸，酒杯傾覆，屋梁椽②柱，摧折有聲。眾人相顧失色。久之，方知地震，各疾趨出。見樓閣房舍，仆③而復起，牆傾屋塌之聲，與兒啼女號，喧如鼎沸。人眩暈不能立，坐地上，隨地轉側④。河水傾潑丈餘，雞鳴犬吠滿城中。逾一時許，始稍定。視街上，則男女裸聚，競相告語，並忘其未衣也。\n\
