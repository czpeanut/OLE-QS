    content: 靠近太陽時，會產生背離太陽的彗尾
  - label: D
    content: 彗核的主要組成為氣體，與土星相似。
  group_stem: "2. 請在閱讀下列敘述後，回答下列問題：\n  鹿林彗星是第1 顆由臺灣的望遠鏡所發現的彗星，是西元2007 年鹿林天文台的望遠鏡在進行小行星觀測所發現的新天體，並發現此天體具有彗星特徵，國際彗星組織將其編號為C/2007\
    \ $N_{3}$，並命名為鹿林（LULIN） 【如附圖(二十一)】。\n  鹿林彗星的主體「彗核」是冰塊與塵埃混合而成，大小約數公里，彗星靠近太陽時，會產生背離太陽的彗尾。鹿林彗星最特殊之處在於它偏綠的彗尾，與一般常見的藍色彗尾不同。而彗尾的發光顏色與組成的成分有關，一般見到的藍色彗尾，是因為含有較多的一氧化碳離子（$CO^{+}$），但鹿林彗星的彗尾卻呈綠色，經分析發現，是雙原子碳（$C_{2}$）發出的螢光輻射。\n\
    \  鹿林彗星在科學研究上很有價值，例如藉由彗尾研究彗星的結構、化學成分等，可以探知太陽系的過去，加上鹿林彗星在太陽系生成之際即被拋出太陽系外，因此受太陽輻射影響少，故能保留更多太陽系形成之初的樣貌。"
