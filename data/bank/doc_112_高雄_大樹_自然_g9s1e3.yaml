  type: single
  page: 5
  stem: '(2) 附表為黃雨萱報告中所記錄的電流值，若根據圖(二十三)來判斷表中$I_{\text{甲}}>I_{\text{乙}}$ 是否合理，下列的判斷與論述何者最適當？


    | 安培計代號 | 電流 |

    | :---: | :---: |

    | 甲 | $I_{\text{甲}}$ 200 mA |

    | 乙 | $I_{\text{乙}}$ 100 mA |'
  options:
  - label: A
    content: 合理，因為負極為電子流流出端，而甲較靠近電池負極，所以 $I_{\text{甲}}>I_{\text{乙}}$ 合理
  - label: B
    content: 合理，因為甲測得的電流值應為流過丙與丁的電流值相加，所以 $I_{\text{甲}}>I_{\text{乙}}$ 合理
  - label: C
    content: 不合理，因為正極為電流流出端，而乙較靠近電池正極，所以 $I_{\text{乙}}>I_{\text{甲}}$ 才合理
  - label: D
    content: 不合理，因為乙測得的電流值應為流過丙與丁的電流值相加，所以 $I_{\text{乙}}>I_{\text{甲}}$ 才合理。
  group_stem: "3. 請閱讀下列敘述後，回答下列各題：\n  圖(二十二)為兩個安培計、兩個電阻器、一個電池與數條導線，其中的電阻器為符合歐姆定律的導體，圖(二十三)為一電路圖。老師要求黃雨萱將圖(二十二)中的器材依據圖(二十三)組裝，並將兩個安培計測得的電流值記錄於實驗報告中。"
