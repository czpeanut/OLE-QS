  group_stem: "新北市三重區傳出一名外籍看護工作者從住處下樓倒垃圾後，在路邊和朋友講電話卻無故遭員警盤查，因其身上無證件，警察竟扣押其手機，還將其上銬帶回派出所，後發現她不是非法逃逸移工，也不將其載回住處，竟將其「丟包」在路旁，該移工因不認得路，只能靠著手機導航哭著走回家。\n\
    \    台灣整體社會時常將「逃逸移工」與「治安亂源」劃上等號，不少移工團體提醒，社會大眾應理解外籍移工逃離雇主的兩大原因，主要是「勞力剝削」和「惡劣的勞動條件」。近年來，行政院勞動部從源頭強化管理，針對非法雇主與非法仲介，加重處罰，提升國內移工勞動條件及權益保障，以改善移工的失聯情形。"
