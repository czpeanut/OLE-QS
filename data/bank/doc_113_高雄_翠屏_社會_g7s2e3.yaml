- id: doc_113_高雄_翠屏_社會_g7s2e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: "新加坡是一個都市國家，只有郊區沒有鄉村。新加坡位處熱帶雨林氣候區，終年高溫多雨，但 7～8 月的氣溫，卻沒有像臺北這麼炎熱，很大的原因，要歸功都市綠化成功。\n\
    \  新加坡規畫道路時，預留很大的空間，種植行道樹。不只是綠化，地狹人稠的新加坡還設立自然保護區，推動都市的生物多樣性。\n  另外，位於郊區的新市鎮，透過完善規畫的大眾交通工具與市區聯絡，降低民眾開車需求，並透過收取高額汽車稅及汽車牌照管制等措施，減少汽車數量，解決塞車問題並降低空氣汙染。創造一個人民生活與生態保育兼顧的「花園都市」。\n\
    你覺得「只有都市、郊區，沒有鄉村」的新加坡，可能會缺乏下列哪一項鄉村能提供的產品或服務？"
  options:
  - label: A
    content: 教育
  - label: B
    content: 醫療
  - label: C
    content: 農產品
  - label: D
    content: 就業機會。
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 地理
      code: 5-3
      title: 都市化與都市擴張
      chapter: 第5章 聚落體系與都市發展
    textbook: 七下地理 5-3 都市化與都市擴張
    labeled_by: ai
