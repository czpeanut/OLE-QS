- id: doc_113_新北_中平_數學_g8s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '甲、乙兩人計算 $\sqrt{2} \times (\sqrt{48} + \sqrt{12})$ 之值

    甲：

    $\sqrt{2} \times (\sqrt{48} + \sqrt{12})$

    $= \sqrt{2} \times (\sqrt{48 + 12})$

    $= \sqrt{2} \times \sqrt{60}$

    $= \sqrt{2} \times (\sqrt{2 \times 2 \times 3 \times 5})$

    $= 2\sqrt{30}$

    乙：

    $\sqrt{2} \times (4\sqrt{3} + 2\sqrt{3})$

    $= \sqrt{2} \times 6\sqrt{6}$

    $= \sqrt{2} \times 6 \times \sqrt{3} \times 2$

    $= 12\sqrt{3}$'
  options:
  - label: A
    content: 甲、乙兩人均正確
  - label: B
    content: 甲、乙兩人均不正確
  - label: C
    content: 只有甲正確
  - label: D
    content: 只有乙正確
  answer:
  - '甲、乙兩人計算 √2 × (√48 + √12) 之值

    甲: 乙:

    √2 × (√48 + √12) √2 × (4√3 + 2√3)

    = √2 × (√48 + 12) = √2 × 6√6

    = √2 × √60 = √2 × 6 × √3 × 2

    = √2 × (√2 × 2 × 3 × 5) = 12√3

    = 2√30

    (A) 甲、乙兩人均正確 (B) 甲、乙兩人均不正確 (C) 只有甲正確 (D) 只有乙正確'
  tags:
