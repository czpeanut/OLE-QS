  stem: 根據2022 年的英國人口普查資料表示，只有42％的人自認是基督教徒，6.5％為穆斯林，1.7％為印度教徒，而多達37％為無宗教信仰者，顯示今日英國民眾的宗教信仰與過去相較，產生相當大的變化，信仰更加多元。而在過去的歐洲，宗教信仰的不同曾導致流血衝突。請問:直到哪個事件後，歐洲國家才逐步確定宗教寬容的原則？
