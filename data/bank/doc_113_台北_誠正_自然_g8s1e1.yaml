    content: 甲：性質穩定，常用在高溫焊接金屬時，以阻絕金屬與氧氣反應
  - label: B
    content: 乙：具有助燃性，化學性質活潑，為生物呼吸所需的氣體
  - label: C
    content: 丙：為混合氣體，包含有二氧化碳、氫氣等氣體
  - label: D
    content: 丁：不可燃也不助燃，常用於填充食品包裝，以避免氧化腐敗。
