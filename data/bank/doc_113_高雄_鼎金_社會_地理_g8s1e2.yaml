- id: doc_113_高雄_鼎金_社會_地理_g8s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 棉花喜熱、好光、耐旱、忌漬，適宜於在疏鬆深厚土壤中種植。2021 年新疆棉花事件，是於2021 年3 月起在中國爆發的抵制運動。源於2021 年3
    月24 日，瑞典時裝公司H&M 因維吾爾人被強迫勞動的相關報導和指控而於2020 年9 月發布一份聲明稱「不與位於新疆的任何服裝製造工廠合作，也不從該地區採購產品或原材料」所引起的一系列爭議。中國是世界最大棉花消費國、第二大棉花生產國。新疆是中國大陸棉花的主要產地，截至2020年，當地棉花產量已經占到中國全國產量的87%，世界棉花產量的20%。請問：有關以下對於新疆的敘述，何者有誤？
  options:
  - label: A
    content: 新疆棉花依賴高山夏季融雪灌溉
  - label: B
    content: 2010 年中國在新疆增設廈門經濟特區
  - label: C
    content: 新疆屬於中國四大經濟區的西部經濟區
  - label: D
    content: 新疆位於一帶一路政策往歐洲方向鐵路必經之地。
- id: doc_113_高雄_鼎金_社會_地理_g8s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 白象是一種罕見的蒼白大象，在泰國等國家被視為聖物。白象也被稱為負擔之獸，需要精心的照顧和餵養。在傳說中，暹羅（泰國的舊稱）國王會將白象作為禮物贈送給那些他厭惡的人，接受者往往因昂貴的飼養成本而破產。因此，在現代用法中，「白象」常被用來指代花費巨大卻難以產生利潤或價值的資產。「某政策」十年後，許多建設卻變成「白象工程」，讓多國背上巨額債務，帶來的效益卻相當有限，許多建設不是爛尾，就是淪為蚊子館，被認為是中國設下的「債務陷阱」。根據上述的情形，文中的「某政策」最有可能是下列哪一項？
  options:
  - label: A
    content: 一帶一路
  - label: B
    content: 改革開放
  - label: C
    content: 振興東北老工業基地計畫
  - label: D
    content: 區域全面經濟夥伴協定。
