- id: doc_113_高雄_鼎金_社會_地理_g8s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 改革開放由中國共產黨第二代中央領導集體核心鄧小平提出和創立改革，鄧小平著名的貓論(不管黑貓白貓，能捉到老鼠就是好貓)。說明無論計劃經濟還是市場經濟，都只是一種資源配置手段，與政治制度無關；資本主義可以有計劃，社會主義也可以有市場。開放是中國歷史上的重大決策和轉折過程，使中國經濟高速發展。1990
    年上海證券交易所、深圳證券交易所相繼成立，中國大陸資本市場誕生。中國並於1991 年加入亞太經濟合作組織、2001 年加入世界貿易組織，2010 年國內生產總值（GDP）超越日本、成為全球第二大經濟體。請問：中國經濟改革先在東部沿海設置經濟特區，以利吸收外資與技術，下列哪一城市為經濟特區之一？
  options:
  - label: A
    content: 廣州
  - label: B
    content: 深圳
  - label: C
    content: 上海
  - label: D
    content: 香港。
