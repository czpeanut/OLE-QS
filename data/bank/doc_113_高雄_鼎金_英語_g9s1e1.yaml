  group_stem: 'The year 2020 is the beginning of the 5G era. It is a big change for
    us. For example, in the 4G era, people usually had to spend about half an hour
    downloading a two-hour long movie on the Internet. However, it’ll take us just
    a few seconds to do so in the 5G era.

    The 5G era also means a lot to the gamers. In the 4G era, they sometimes got into
    trouble when they played computer games because the Internet was not fast enough.
    It might take two or three seconds to make an attack in the game. This slowed
    down the game and ruined the fun. In the 5G era, the gamers won’t need to wait
    so long.

    The 5G era brought some changes to the hospitals as well. Sometimes, doctors need
    the help of the machines and the Internet to do delicate surgery. 5G makes the
    surgery faster and more accurate. It saves the doctors a lot of time, and they
    can do a better job than before.


    From 1G to 5G

    1G: The cellphone were large and heavy. People could only make phone calls with
    these big cellphones.

    2G: People could make phone calls and sent short messages with only a few words
    with their cellphones.

    3G: People could send words, voices, and pictures at the same time with their
    cellphones.

    4G: People could upload and download pictures, videos, and all kinds of information
    on the Internet with their cellphones.

    5G: People can upload and download pictures, videos, and all kinds of information
    on the Internet with their cellphones in much shorter time.

    📖 era 時代 delicate surgery 精細的手術 accurate 精確的'
