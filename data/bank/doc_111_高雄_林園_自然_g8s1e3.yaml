  group_stem: '素養題：熱輻射是物體利用電磁波的方式把熱能向外發散，因此不需依賴任何物質來傳熱。任何物體的表面都會持續不斷的輻射熱能，同時也會吸收周圍環境中物體所傳來的輻射熱能。如果物體表面吸收較多熱輻射，則物體本身的溫度會上升，反之則下降。物體輻射熱能的多寡和物體的表面溫度、表面積、顏色及粗糙程度有關，表面溫度愈高、表面積愈大，輻射出的熱能愈多。表面黑色的物體容易吸收熱輻射，也容易散發熱輻射；表面光滑的物體則容易反射熱輻射。

