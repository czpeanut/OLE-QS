  section: 1
  number: 18
  type: single
  page: 1
  stem: 上述這兩種說法最可能出現在哪個時代？(習作P15-8-3)
  options:
  - label: A
    content: 拿破崙大軍壓境後的俄國
  - label: B
    content: 獨立戰爭獲勝後的美國
  - label: C
    content: 維也納會議後的歐洲
  - label: D
    content: 經歷工業革命的英國。
  group_stem: '*下列兩則資料是關於十九世紀歐洲政局的評論，請閱讀後回答問題。

    資料一

    現在社會大亂，那些人毫不尊重傳統，他們瘋狂的想法，只想著要破壞一切。這時候，君主們應該團結一致，鞏固政權，向世界證明，王室的存在才能確保歐洲和平。


    資料二

    我們的祖輩在革命中爭取的最高原則，就是「人民主權」、「人民就是國家」，每個人都該有平等的政治權利。但如今，法國國王不尊重憲法，不把人民看在眼裡。因此，我們要重申人民就是一切，我們的目標便是拯救他們脫離貧窮和痛苦。


    資料來源：改寫自

    1. Prince Klemens von Metternich: Political Confession of Faith, 1820. From: Memoirs
    of PrinceMetternich, 1815-1829, ed. Prince Richard Metternich (New York: Howard
    Fertig, 1970), Vol. 3.

    2. Alexander Ledru-Rollin: Speech to the Electors of Sarthe, 1841. From R. W.
    Postgate, Revolution from 1789 to 1906 (London: 1920).'
  answer:
  - C
  answer_source: answer_key_vlm
  tags:
    chapter:
