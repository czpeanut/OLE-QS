  stem: 一位學者回憶說道：「西元1834 年來臨時，是多麼愉快，我的邦國受到世界貿易的讚美。一長列的馬車停在主要道路上等待關稅障礙的解除。當午夜一過，每輛馬車都順暢而快速的通過邊境，每一個人都感受到：『一個偉大的時刻，已經來臨。』」此段話是在說明當時邦民對「關稅同盟」的期待，上文的學者應是哪一邦國的人民？
  options:
  - label: A
    content: 塞爾維亞
  - label: B
    content: 普魯士
  - label: C
    content: 法國
  - label: D
    content: 薩丁尼亞。
