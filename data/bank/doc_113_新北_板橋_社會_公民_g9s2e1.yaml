- id: doc_113_新北_板橋_社會_公民_g9s2e1_s1_36
  section: 1
  number: 36
  type: single
  page: 1
  stem: '惠真看到一則新聞報導如下，若對照我國《民法》對親屬的規定加以理解，下列敘述何者正確？

    戰爭前線

    以色列和巴勒斯坦爆發激烈武裝衝突，世界各國紛紛從當地撤僑。一名加拿大公民表示，加拿大的撤僑政策協助加拿大公民與其家屬離開，只包括配偶、子女及孫子女，但父母、兄弟姊妹和姻親都不包含在內，由於他的雙親不具有加拿大國籍，無法跟他一起走，為此他抨擊加國政府造成許多加拿大公民與親人面臨分別的痛苦。'
  options:
  - label: A
    content: 無法撤離的家屬均屬於自然血親
  - label: B
    content: 所有旁系血親均不符合撤僑規定
  - label: C
    content: 撤離的家屬沒有出生的直接關係
  - label: D
    content: 配偶的父母符合加拿大撤僑規定。
