  stem: '學校登山社提供幾項戶外參訪方案讓社員選擇。社員琦琦僅以滿足程度作為選擇方案的依據，在甲乙兩方案中，她選甲方案的機會成本為80 單位，選擇乙方案的機會成本為90
    單位；她另將乙、丙方案與甲、丙方案分別比較，整理如右表。根據表中資訊判斷，三個方案的滿足程度高低關係應為下列何者？


    | 選擇比較的方案 | 最佳選擇的機會成本 |

