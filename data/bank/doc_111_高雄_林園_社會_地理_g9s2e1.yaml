- id: doc_111_高雄_林園_社會_地理_g9s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 校園內常常看到的四維八德校訓，多是讓學生能夠明白做人處事的基本道理，而現今臺灣地名中也有不少以此進行命名，希望藉此教化人心。下列哪一個地名與此有關？
  options:
  - label: A
    content: 基隆市暖暖區
  - label: B
    content: 臺北市松山區
  - label: C
    content: 臺中市和平區
  - label: D
    content: 高雄市左營區。
  answer:
  - C
  answer_source: answer_key_vlm
- id: doc_111_高雄_林園_社會_地理_g9s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 台灣有許多地名叫「水底寮」，過去人們會利用乾旱期在野溪上搭建簡易工寮，方便種植西瓜、蔬菜等。這些中南部早期先民利用乾涸河床從事開墾，最有可能是在哪一個季節較利於耕種？
  options:
  - label: A
    content: 春末夏初
  - label: B
    content: 梅雨季節
  - label: C
    content: 盛夏時節
  - label: D
    content: 冬末春初。
  answer:
  - D
  answer_source: answer_key_vlm
- id: doc_111_高雄_林園_社會_地理_g9s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 早期臺灣的甘蔗製糖非常發達，因此出現與舊式製糖場所「糖廍」有關的地名。若依據臺灣的甘蔗主要栽種區來判斷，下列哪一個地區之地名中，有「廍」的比例最高？
  options:
  - label: A
    content: 宜蘭平原
  - label: B
    content: 中央山脈
  - label: C
    content: 嘉南平原
  - label: D
    content: 桃園台地。
  answer:
  - C
  answer_source: answer_key_vlm
- id: doc_111_高雄_林園_社會_地理_g9s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 臺南市六甲區地名之由來，主要是鄭成功參軍駐軍在此開墾荒地，最初依據開墾面積取名為二甲、六甲、七甲等村。六甲位居中心，故取名為「六甲」。請問：下列哪一個地名的命名之因，與上述例子相近？
  options:
  - label: A
    content: 前鎮
  - label: B
    content: 羅東
  - label: C
    content: 新屋
  - label: D
    content: 玉井。
  answer:
  - A
  answer_source: answer_key_vlm
- id: doc_111_高雄_林園_社會_地理_g9s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 地理課堂上，老師指導同學上資訊服務網查詢「壢、崠、窩」的地名（如地理圖四），此類地名主要分布在哪裡？
  options:
  - label: A
    content: 臺北基隆
  - label: B
    content: 桃竹苗地區
  - label: C
    content: 高屏地區
  - label: D
    content: 花東地區。
  group_stem: ◎《台灣的舊地名》一書中提到：臺灣的地名受三個因素交互影響，一是先天地形複雜、景觀多變，二是移墾人口與原住民間的族群眾多，三是政權更迭頻仍，西洋、日本、中國政權互有更替。在三大因素交相作用下，台灣地名的豐富多元，在世界各地中少見。請回答第11~12
    題：
