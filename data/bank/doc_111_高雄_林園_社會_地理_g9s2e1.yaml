- id: doc_111_高雄_林園_社會_地理_g9s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 地理圖一是法國人杜赫德在1735 年（雍正年間）所繪製的東亞地圖局部。請問地圖上，臺灣島西半部與山脈交界處有出現「TAI-OUAN」一詞，下列敘述何者正確？
  options:
  - label: A
    content: 是美麗之島的意思
  - label: B
    content: 讀音與「大員」相近
  - label: C
    content: 範圍僅限於今日桃園一帶
  - label: D
    content: 「TAI-OUAN」一詞源自於日治時期。(習作)
  assets:
  - key: s1_1_f1
    kind: figure
    file: doc_111_高雄_林園_社會_地理_g9s2e1/s1_1_f1.png
  answer:
  - B
  answer_source: answer_key_vlm
- id: doc_111_高雄_林園_社會_地理_g9s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 「溪底寮」是臺灣常見的聚落名稱，源於早期民眾利用河川枯水期在乾涸河床從事開墾，並在該地搭建簡單的工作寮房。「溪底寮」地名的空間分布，最可能是地理圖二中的哪一張？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙。(習作)
  assets:
  - key: s1_2_f1
    kind: figure
    file: doc_111_高雄_林園_社會_地理_g9s2e1/s1_2_f1.png
  answer:
  - C
  answer_source: answer_key_vlm
- id: doc_111_高雄_林園_社會_地理_g9s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 「屋」是客家族群稱呼房子之意，例如：四座屋、黃屋、新瓦屋。客家人稱傳統三合院或四合院為「伙房屋」，與閩南語的「古厝」同義。「屋」地名的空間分布，最可能是是地理圖二中的哪一張？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙。(習作)
  answer:
  - B
  answer_source: answer_key_vlm
- id: doc_111_高雄_林園_社會_地理_g9s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 地名被視為一個地區的名稱，其形成常受該地的地理、歷史、民族和語言所影響，是社會發展的產物，亦被稱為一種「活化石」，保留下當地的發展和變遷。請問：關於「地名」的描述，下列哪些正確？
    (甲)地名是一種有形的文化景觀 (乙)地名可視為居民對其生活環境的認知 (丙)地名所包含的空間範圍不變 (丁)臺灣的地名可表現出多元族群的樣貌
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 甲丙
  - label: D
    content: 乙丁。
  answer:
  - D
  answer_source: answer_key_vlm
- id: doc_111_高雄_林園_社會_地理_g9s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 清朝康熙年間，郁永河的《裨海紀遊》將今日的高雄稱為打狗仔港，直至西元1920 年才改為「高雄」一名。請問：此一更名主要是受到下列哪一項因素的影響？
  options:
  - label: A
    content: 日治時期日語發音
  - label: B
    content: 政府賦予道德教化
  - label: C
    content: 倚靠自然地形起伏
  - label: D
    content: 日本人希望這個城市「又高又雄」。
  answer:
  - A
  answer_source: answer_key_vlm
- id: doc_111_高雄_林園_社會_地理_g9s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 地理圖三的甲～丁為台灣的四個直轄市，請問：哪一個直轄市其命名的方式和其他三者不同？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
  assets:
  - key: s1_6_f1
    kind: figure
    file: doc_111_高雄_林園_社會_地理_g9s2e1/s1_6_f1.png
