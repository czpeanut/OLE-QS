- id: doc_111_高雄_林園_社會_地理_g9s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 臺灣有許多地名有「崙」字，例如：崙仔、崙背等，這些地名和沙丘地形的關係密切。由此判斷，此類地名應該是分布在哪一個地區較普遍？
  options:
  - label: A
    content: 東北角海岸
  - label: B
    content: 恆春半島
  - label: C
    content: 西南沿海
  - label: D
    content: 東部海岸。
  group_stem: ◎臺灣的地名多變化，有許多是以地形特徵來命名，如「崙」、「崎」、「坪」、「埔」、「坑」、「潭」等；依照該地形對當地所產生的影響來進行地名的命名，同時也反映了一地所在的空間位置或地形特徵。請回答第13~15
    題：
