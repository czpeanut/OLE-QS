  section: 1
  number: 11
  type: single
  page: 1
  stem: '下表是櫻木在上課分組報告時，以製表舉例的方式，來說明他對「影響消費者需求因素」的了解與看法。根據內容判斷，哪些敘述是正確的？


    | 選項 | 影響消費者需求因素 | 日常生活中的實例 |

    | :--- | :--- | :--- |

    | 甲 | 商品價格變動 | 最近國際黃金價格一路狂飆，使得人們對金飾買氣大減。 |

    | 乙 | 所得水準改變 | 農曆春節前許多公司發年終獎金，使得民眾購買力明顯增加。 |

    | 丙 | 主觀偏好變動 | 新聞報導汽油明天凌晨將要調漲，使得傍晚過後排隊加油的人變多了。 |

    | 丁 | 預期心理改變 | 判斷吸菸會嚴重有害身體健康，使得民眾對香菸需求減少。 |'
  options:
  - label: A
    content: 甲、乙
  - label: B
    content: 丙、丁
  - label: C
    content: 甲、乙、丙
  - label: D
    content: 甲、乙、丙、丁
