  stem: 根據圖22，假設原始的風速$v_{1}$ 為15m/s，通過發電機後，最後的風速$v_{2}$ 為多少時，會接近最大的$C_{P}$ 值？
  options:
  - label: A
    content: '3.3'
  - label: B
    content: 4.7 m/s
