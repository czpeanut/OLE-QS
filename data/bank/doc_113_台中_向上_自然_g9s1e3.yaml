  section: 1
  number: 35
  type: single
  page: 2
  stem: 根據上述的資訊，下列有關$C_{P}$ 的敘述，何者最合理？
  options:
  - label: A
    content: 風力發電機葉片由風力獲得能量的比例愈高，$C_{P}$ 值會愈大
  - label: B
    content: 風力發電機葉片由風力獲得能量的比例愈高，$C_{P}$ 值會愈小
  - label: C
    content: 風力發電機葉片轉動的速率愈快，$C_{P}$ 值會愈大
  - label: D
    content: 風力發電機葉片轉動的速率愈快，$C_{P}$ 值會愈小。
  group_stem: '※臺灣西部海岸建構多部風力發電機，透過風力發電機可以將風能轉換為電能，而在轉換過程中，能量無法百分之百轉換。科學上會使用功率係數$C_{P}$
    來呈現發電機葉片由風力獲取能量的效率，可表示如下：

    $C_{P} = \frac{\text{發電機葉片由風力中獲取的功率}}{\text{通過發電機前風力原始的功率}}$

    圖21 為風力發電過程的示意圖，原始的風速為$v_{1}$，在通過發電機後，最後風速變為$v_{2}$，德國科學家貝茲通過理論計算，獲得理想情形下$C_{P}$與$\frac{v_{2}}{v_{1}}$的理論關係，其關係圖如圖22
    所示。$C_{P}$ 與$v_{1}$、$v_{2}$ 的關係式如下：

    $C_{P} = \frac{1}{2}\left[1-\left(\frac{v_{2}}{v_{1}}\right)^{2}\right]\left[1+\left(\frac{v_{2}}{v_{1}}\right)\right]$

    請依據上文回答第35 及36 題：'
