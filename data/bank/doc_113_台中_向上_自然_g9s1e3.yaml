  group_stem: ※天文學家觀察了天體運行的變化後，發現了「恆星日」與「太陽日」的差別。若位於地球上A 點的人在第一天對準太陽的同時，也對準了極為遙遠的一顆恆星X，而隨著地球的自轉與公轉，位於地球上A
    點的人第二天再度對準恆星X 的同時，卻無法對準太陽，此時地球需再繼續自轉1 度，位於A 點的人才能再度對準太陽。造成這1 度之差的原因，是因為地球繞日公轉時，每天大約移動1
    度距離。因此，若以地球每小時自轉15 度計算，則第二天再度對準恆星X 後，需再經過4 分鐘才能對準太陽。故第一天中午12 點看到太陽和恆星X 皆位在天頂，則第二天中午11
    時56 分恆星X 到達天頂時，太陽需在中午12 點時才能達到天頂。此即天文學上把恆星日訂為23 時又56 分，太陽日訂為24 小時的原因了。請依據本文回答第41
    及42 題：
