- id: doc_113_台中_四育_社會_g8s2e1_s2_39
  section: 2
  number: 39
  type: single
  page: 4
  stem: 富國島在近幾年被旅人封為「越南版馬爾地夫」。根據此稱號,下列何者最可能出現在旅客的旅遊項目中?
  options:
  - label: A
    content: 火山探險
  - label: B
    content: 採茶體驗
  - label: C
    content: 浮潛體驗
  - label: D
    content: 走訪清真寺。
  group_stem: '二、越南富國島春節擠滿人 台灣1天10架次航班輾壓其他國家

    春節期間前往越南富國島的遊客中,有75%是外國人,每天接待的國際航班達40架次創紀錄,光是1月27日台灣飛往富國島的航班就高達10架次,居所有國際航班之冠。根據富國島國際機場數據,1月25日春節長假第一天,富國島共接待54架次航班,其中國際航班38架次,佔當日所有航班的70%。《越南快訊》報導,富國島專業導遊協會會長張功心(音譯)表示,每天接待38至40架國際航班,這是富國島自開通國際航線以來從未有過的數字。1月27日,國際航班上升至40架次,其中10架次來自台灣,其次是南韓,有9架次航班,其餘國際航班則來自馬來西亞、泰國及新加坡等地。根據Mustgo數據,富國島90%的住宿已被預訂,其中大部分是四星級和五星級飯店。一些高級飯店,如富國島Wyndham
    Grand Phu Quoc,已停止接待客人直至2月1日。'
