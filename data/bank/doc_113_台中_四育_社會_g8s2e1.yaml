- id: doc_113_台中_四育_社會_g8s2e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 根據上文,宋教仁被刺殺後,中華民國的歷史發展有何變化?
  options:
  - label: A
    content: 孫中山重掌臨時大總統位置
  - label: B
    content: 袁世凱仍是遵守臨時約法的規定
  - label: C
    content: 孫中山號召二次革命討伐袁世凱,但未成功
  - label: D
    content: 袁世凱繼續擔任臨時大總統總到他過世。
  group_stem: '【閱讀素養題】19-20題

    1911年的10月10日,武昌起事爆發後,宋教仁隨即帶著厚厚的法制文獻前往武昌,參與制定《鄂州臨時約法草案》。這個草案中,人人平等、人民選舉等諸多法令第一次出現在中國的法律之中,是中國首次公布帶有憲法性質的文件。他又馬不停蹄地前往南京,參與並制定《中華民國臨時約法》,他依照文獻資料,參照西方的實際政治體制,將中國設計成責任內閣制。宋教仁倡導責任內閣制,主要是在面對袁世凱專權之時,只需要宋教仁的政黨在議會中獲得大多數的席位,宋教仁便可以組織責任內閣,而袁世凱的元首地位則會被架空,沒有太多實權。

    然而,1913年3月20日,宋教仁、黃興、于右任以及廖仲愷等人正準備前往北京參加4月的國會開會禮之時。車站中的一聲槍響,宋教仁中槍了。

    此次案件也成為了一個導火線。孫中山自日本趕回上海,決定發動「二次革命」討伐袁世凱。而在孫中山二次革命失敗之後,袁世凱成了典型的獨裁總統,並且在民主化道路上愈走愈遠,甚至一度復辟了帝制。'
