  group_stem: '【題組】57-60題

    一、請閱讀下列文章後,回答問題:

    黃男被吳女開車撞傷,提出民事損害賠償訴訟,列出許多與車禍無關的醫療、生活用品、營養品支出單據,求償新臺幣近2千萬元。吳女認為,求償金額太高,且黃男未依規定行走於行人穿越道上,應負過失責任,賠償金額應為2萬4千元。

    法院審理後指出,「損害賠償」並非當事人主觀上對於權利行使的一種想像,而任意主張許多與本件侵權事實沒有因果關係的請求。因此,法院判決吳女僅須賠1萬6千元,並表示損害賠償不是中樂透,不能將生活成本要求對方負責。(資料來源:改寫自損害賠償不是中樂透,男求償1999萬判賠1.6萬,中央通訊社,2021/4/19。)'
