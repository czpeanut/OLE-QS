  group_stem: '【閱讀素養題】37-40題

    一、臺印度視訊簽署勞工合作備忘錄(MOU),對於台灣勞動市場是福是禍?!

    臺灣與印度政府為強化雙邊勞務合作關係,歷經多年協議,已於113年2月16日由我國駐印度代表處葛葆萱大使及印度台北協會葉達夫會長視訊簽署MOU,雙方後續將依程序完成換文,並儘速召開工作層級會議,持續討論未來開放行業及數額、移工來源地區、聘僱資格及招募方式等細節。

    然而,網路不實謠言稱將引進10萬名印度移工,多數臺灣人民對此紛紛反對,雖然勞動部已發布新聞稿指出,移工引進會依程序進行,10萬名純屬虛構。但此消息一出立馬在各論壇上引起熱烈討論,就有一名網友發出疑問,為什麼不是其他國家,而是印度?網友在Dcard論壇上以「為什麼不多引進泰越尼的移工而選擇印度?」為題發出提問,原PO稱「說真的,泰國、越南、印尼的知識水平、品性好很多,為什麼一定要多增加印度的移工近來,搞得大家人心惶惶,更不用說女性」。原PO進一步表示用這種方式解決缺工問題真的沒有用,只會造成民眾的恐慌。'
