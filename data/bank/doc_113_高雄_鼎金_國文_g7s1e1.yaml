  group_stem: "(一) 公孫龍在趙國的時候，曾對弟子們說：「一個沒有本事的人，我公孫龍是不會與他來往的。」一天，有位身穿粗布衣，腰圍著粗繩的客人來拜見公孫龍，並說：「我的聲音很響亮，能夠大聲呼喊。」公孫龍回頭問眾弟子：「你們當中有能大聲喊叫的人嗎？」弟子們回答：「沒有這樣的人。」公孫龍便說：「我決定收他為徒。」\n\
