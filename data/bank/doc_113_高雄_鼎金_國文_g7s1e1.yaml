  - label: D
    content: 能以自身可以達成的目標來代替不能實現的願望。
  group_stem: "(三) 第一隻狐狸來到葡萄架下，發現葡萄架遠遠高出牠的身高。牠想了一會兒，發現葡萄架旁邊的梯子，回想農夫曾經用過它。因此，牠也學著農夫的樣子爬上去，順利的摘到了葡萄。\n\
    \  第二隻狐狸來到葡萄架下，牠發現以牠的個頭這輩子是無法吃到葡萄了。因此，牠心裡想，這個葡萄肯定是酸的，吃到了也很難受，還不如不吃。於是，牠心情愉快的離開了……。\n\
    \  第九隻狐狸來到葡萄架下，同樣是吃不到葡萄。牠心想，聽別的狐狸說，檸檬的味道和葡萄差不多，既然我吃不到葡萄，何不嘗一嘗檸檬呢？因此，牠心滿意足的離開去尋找檸檬了……。\n\
    \  第十一隻狐狸來到葡萄架下，牠也面臨著相同的問題。牠轉了一下眼睛，把幾個同伴騙來，然後趁牠們不注意，用鐵鍬將牠們擊昏，將同伴疊起來，踩著同伴的身體吃到了葡萄。\
    \   （改寫自十八隻狐狸吃葡萄）"
