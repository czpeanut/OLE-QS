  section: 4
  number: 34
  type: single
  page: 4
  stem: 根據本文，題目「七夜流動一次的河」指的是下列何者？
  options:
  - label: A
    content: 夜市裡攤販及熱鬧遊走的人龍
  - label: B
    content: 傍晚時天空出現的晚霞
  - label: C
    content: 夜空中無光害的美麗銀河
  - label: D
    content: 山野間緩慢流動的長河。
  group_stem: "(五) 夕陽倦了，忍不住咕咚栽進山背。夜色便偷偷摸摸、骨碌著賊眼、躡手躡腳、匍匐進來，以迅雷不及掩耳的速度，把山川房舍、田野菜苗、紅瀲瀲神氣巴拉的聖誕紅，全都掃進烏黑的口袋。\n\
    \  一陣陣吆喝隨著卡車的煞車聲，爾後是搬運貨物、鋪攤、架燈桿。人影綽綽舞動，愈來愈多的人聲、摔物聲、以及燈光，把整條街燃燒起來。一條光燦燦的蛇劈開黑暗，緩緩的游移。\n\
    \  近觀時，只見四方湧來的人頭攢動，香水、脂粉、汗水、油煙、食物的五味雜陳，構成最富人間氣息的寫真。一切關於夜的神話和故事便都不再有吸引力。遠處，幾隻青光閃閃的鬼眼在窺伺人間的熱鬧。\n\
    \  然而這僅僅是前奏。當擴音器以高分貝開始拍賣小鎮的寧靜，小販合力用超級的肺活量把一條沉睡的花蛇叫得活蹦亂竄時，才體會到上帝賦予人類的舌根子是如斯奇妙的恩賜。你聽：「要買要快，三個五十塊！」（還押韻哩！老闆真不是蓋的，敢情是隱於江湖的落第秀才？）\
    \                       （鍾怡雯 七夜流動一次的河）"
