- id: doc_113_高雄_鼎金_國文_g7s1e1_s4_32
  section: 4
  number: 32
  type: single
  page: 4
  stem: 下列文句，何者可以說明文中各個音樂家的成功歷程？
  options:
  - label: A
    content: 因害怕失敗而不敢放手一搏，永遠不會成功
  - label: B
    content: 消磨時間者，亦必消磨事業
  - label: C
    content: 沒有岩石的阻擋，哪能激起美麗的浪花
  - label: D
    content: 勇於開始，才能找到成功的路。
  group_stem: "(四) 想起蟬，就想起蟬的生命。蟬的幼蟲時期非常長，有十幾年的光陰是蟄伏在泥土裡，然後鑽出地面，蛻為蟬，飛上枝頭，化為一首歌，唱出夏之戀。當秋風乍起，桂子飄香，牠們也悄悄結束了短暫的生命，有如一位盡瘁於舞臺的藝術家。何以蟬必須忍受十幾年暗無天日的生活，只為了造就一季的輝煌？多麼奇特的成長過程。\n\
    \  蟬的故事也讓我想起那些有名的音樂家們，如巴哈、貝多芬、舒伯特、韓德爾、莫札特、普西尼等等，幾乎都曾經歷過一段黯淡的時光；或出身寒微，或少年坎坷，或身有殘疾，長期掙扎於貧困與潦倒之間。但不幸的命運、惡劣的環境反而驅使他們將全部的生命傾注於藝術的創造，充分發揮他們的天分與才華。\n\
    \                                                                           （杏林子\
    \ 蟬的故事）"
