    content: 夢想破滅，有如「鏡花水月」，令他唏噓不已
  - label: B
    content: 爺爺人品高潔，「光風霽月」，受到許多人景仰
  - label: C
    content: 時光飛逝，「日月如梭」，轉眼間，新的一年又到了
  - label: D
    content: 以前的空地如今已蓋了高樓，真是「眾星拱月」，人事已非。
