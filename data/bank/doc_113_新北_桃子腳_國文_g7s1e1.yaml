  - label: D
    content: 這個花瓶經過專家再三「參考」，已被確認是明朝宮廷的寶物。
- id: doc_113_新北_桃子腳_國文_g7s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 「我寧願去品嚐辛辣的憤怒，憤怒潑辣中仍不失狂放的熱情□我也寧願去深深咀嚼苦味，苦味中還有深沉的傷痛與悲哀，可以痛定思痛，有猛省的作用□唯獨酸腐，只有餿臭敗壞一途，是生命最無意義的浪費啊□」文中缺空處，依序填入下列哪一組標點符號最恰當？
  options:
  - label: A
    content: ， ： ！
  - label: B
    content: ， ； ……
  - label: C
    content: ； 。 ！
  - label: D
    content: ； ， ？
- id: doc_113_新北_桃子腳_國文_g7s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 根據下文，作者在文中對於回家一事，其婚前、婚後的轉折應是何者？
  options:
  - label: A
    content: 等待／被等待
  - label: B
    content: 給予者／接受者
  - label: C
    content: 享受呵護／享受付出
  - label: D
    content: 點亮家中燈光／迎向家中燈光。
  group_stem: '「婚前回家，無論早晚，我知道燈光亮著，母親在家，那使人願意愉悅地啟門而入；婚後成家，我每每在忙碌過後，匆匆趕回，為的是要為丈夫孩子，亮起一盞等待的燈光，張羅起未必豐盛，卻十分新鮮的飯菜。我喜歡聽回家的人那熟悉的開門、翻信箱、上樓的種種聲音，我更喜歡聽稚兒被奶媽用小車車推到窗下，焦急而甜蜜的喚著『媽媽──媽媽──』。只有女人，才有這個權利，只有母親，才有如此幸福吧？」

    （廖輝英 燈光依舊亮）'
- id: doc_113_新北_桃子腳_國文_g7s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 這首詩作中，作者以充滿想像力的筆法描述冬天的寒冷，冬天非但未帶來寒意，反而帶著童心展現熱情。下列何者表達出冬天「任性」的一面？
  options:
  - label: A
    content: 我不歡迎，／趕快躲到屋裡去
  - label: B
    content: 我不喜歡，／立刻把雙手藏進口袋裡
  - label: C
    content: 我不願意，／趕緊用圍巾裹住
  - label: D
    content: 把我的鼻子，／捏的又紅又痛。
  group_stem: '冬天想和我遊戲，

    我不歡迎，

    趕快躲到屋裡去。

    冬天想和我握握手，

    我不喜歡，

    立刻把雙手藏進口袋裡。

    冬天想摸摸我的脖子，

    我不願意，

    超緊用圈巾裹住。

    冬天生氣了吧！

    把我的鼻子，

    捏的又紅又痛！

    （黃基博 冬天）'
- id: doc_113_新北_桃子腳_國文_g7s1e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 「沙灘上撒滿了閃亮的貝殼，像是掉了一地的繁星。那孩子撿起一個貝殼看看，隨手就把它丟棄。他已經尋找了一個下午，始終沒有找到他心目中那最美麗、最稀罕的貝殼。當夕陽把海和天渲染成一片深深的紫時，他仍孤獨地拖著長長的影子，手中的籃子仍然空著。」（趙雲
    不要讓籃子空著）這篇短文的主旨可用下列何者說明？
  options:
  - label: A
    content: 堅持到底，夢想必能實現
  - label: B
    content: 沒有目標的人生，將是一無所成
  - label: C
    content: 忽略別人的長處，常造成自己的狹隘
  - label: D
    content: 若執意追求最完美的，反而容易成空。
- id: doc_113_新北_桃子腳_國文_g7s1e1_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 臥虎藏龍的李慕白說：「緊握拳頭，裡頭什麼也沒有；打開雙手，你擁有的是一切。」下列何者可與其相呼應？
  options:
  - label: A
    content: 同時追兩隻兔子，將一無所獲
  - label: B
    content: 保持樂觀積極，不在意是否犯錯
  - label: C
    content: 唯有放下執念，才得以有寬廣的胸襟
  - label: D
    content: 不認為自己是幸福的人，永遠享受不到幸福。
- id: doc_113_新北_桃子腳_國文_g7s1e1_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 「人們常喜歡把登頂成功比喻為『征服』一座山。」「但我從來沒有征服一座山的慾望。山豈又是人所能征服的？我排除萬難登頂，為的只有一件事：征服自己的局限，征服自己的狹隘與怯懦。」（高銘和
    九死一生：高銘和聖母峰登頂記）這段文字的意思與下列何者最接近？
  options:
  - label: A
    content: 自己往往是人生最大的敵人
  - label: B
    content: 只要立定目標，沒有克服不了的困難
  - label: C
    content: 人生應該要及時行動，才能完成夢想
  - label: D
    content: 我們常畏懼大自然的力量，卻又相信人定勝天。
- id: doc_113_新北_桃子腳_國文_g7s1e1_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 「有的只是點頭之交，平淡而疏離；有的可以相伴一程，留下許多美麗的回憶；有的是同好，有的甚且可以憂戚與共，莫逆於心。」請問這句話主要是在表達什麼？
  options:
  - label: A
    content: 擇友的條件
  - label: B
    content: 擇友的方法
  - label: C
    content: 朋友的可貴
  - label: D
    content: 朋友的類型。
- id: doc_113_新北_桃子腳_國文_g7s1e1_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: 「生命之美不在目的，而在歷程。為一個崇高理想全力以赴，原是件神聖的事。但萬不可忽略了生命的內涵包含了別的意義。一個只顧低頭趕路的人，永遠領略不到沿途的風光。」（杏林子
    歷程）這段話的涵義與下列何者有異曲同工之妙？
  options:
  - label: A
    content: 生命的價值即是追求永恆的美
  - label: B
    content: 沒有波折的人生，將平淡無味
  - label: C
    content: 欲窮千里目，得要更上一層樓
  - label: D
    content: 活在當下，才能細細品味人生。
- id: doc_113_新北_桃子腳_國文_g7s1e1_s1_24
  section: 1
  number: 24
  type: single
  page: 2
  stem: 下列文句，何者用字最為精簡？
  options:
  - label: A
    content: 我心中暗自祈禱，希望大家都平安無事
  - label: B
    content: 進到店裡隨便隨意掃了一眼，轉身便離開
  - label: C
    content: 看著可憐的小孩，情不自禁忍不住地落下眼淚
  - label: D
    content: 他抬頭仰著臉質問上天，為何對他這麼不公平。
- id: doc_113_新北_桃子腳_國文_g7s1e1_s1_25
  section: 1
  number: 25
