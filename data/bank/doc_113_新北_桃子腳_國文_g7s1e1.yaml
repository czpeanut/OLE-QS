  group_stem: '丁、

    隨著夏季來臨，許多人開始思考如何度過炎熱天氣。有些人準備了水床、風扇等工具，也有人腦洞大開，想要建造冰屋來避暑。說起冰屋，大多數情況是出現在寒冷的地

    區，對此很多人也有疑問：在本來就寒冷的地方住進冰屋，難道不會更冷嗎？為什麼冰屋能夠保存熱量不融化？

    談到冰屋，我們不得不提及因紐特人。因紐特人住在北極圈內，當地常年冰雪覆蓋，溫度極低，因此，他們發展出了極具耐寒特性的體質與生活方式。冰屋的保溫效果實際上是他們能在極地生存的主因。冰屋雖然看起來寒冷，實際上保溫效果非常出色，即使屋外零下幾十度，屋內卻仍能維持在零度至十幾度的溫度，這在極地地區已算是非常溫暖了。

    冰屋建造之前，首先要選擇一塊適合的場地，劃開雪層，切割出一塊塊雪磚。接下來，圍著取走雪磚所產生的凹槽，砌築一圈雪磚，再把雪磚削成斜面，以螺旋上升的方式往上堆砌，並使雪磚一層層逐步向內傾斜，漸漸合攏形成圓頂。最後，用雪填補雪磚之間的縫隙，一座保暖的冰屋就完成了。

    人體產生的熱量會在冰牆來回反射，但這種熱量並不足以影響冰屋。一般屋內屋外溫度差距過大，屋內人體呼出的水蒸氣就會在牆上凝華，從而抵消冰牆耗散出去的熱量，所以如果要使屋內保溫，前提是冰屋內要有人，或者放一盆水，而屋內的人或家具等一切東西要與牆面保持一定距離，這樣才會保持溫度，適合人類生存。

    雪在零度以上是會融化的，不過因為冰屋外的溫度一般都在零下幾十度，即使屋內出現融化狀況，但屋外的冰凍速度絕對會超過融化速度，這就是冰屋不會融化的原因。除此之外，因紐特人還會在冰屋內掛獸皮來隔熱，所以冰屋可以保溫且不融化，這也是因紐特人生存的關鍵。

    （改寫自王和 為什麼冰屋可以保暖）'
