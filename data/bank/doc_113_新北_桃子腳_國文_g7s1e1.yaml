- id: doc_113_新北_桃子腳_國文_g7s1e1_s2_35
  section: 2
  number: 35
  type: single
  page: 4
  stem: 依據上文，下列何者說明最適當？
  options:
  - label: A
    content: 本文寫作手法中，使用最多的修辭方式是轉化法中的擬人法
  - label: B
    content: 本文屬於散文中的飲食文學，作者最喜歡的香腸種類是美式熱狗
  - label: C
    content: 文中對糯米腸的製作有詳細描寫，並且點出作者覺得邊走邊吃有種快意江湖的豪爽感
  - label: D
    content: 人工合成腸衣用植物膠、牛皮提煉，做的糯米腸會口感不好，但因便宜，也深受作者喜愛。
  group_stem: "丙、\n大腸包小腸是在台灣發展出的獨特小吃：糯米腸、香腸分別炭烤，再切開體積較大的糯米腸，夾入香腸，形式有點像美式熱狗。兩種東西都先分別製作，事先蒸煮熟的糯米腸和香腸一起炭烤，供應速度快，很適合發展成中式快餐。\n\
    蒸過再烤的糯米腸，切開，夾入也是剛烤好的台式香腸和蒜片，像緊緊相擁的戀人。\n灌米腸之前，糯米先浸水兩小時，然後用爆香過的紅蔥頭，加入糯米、胡椒粉、鹽調味，一起拌炒。腸衣須用豬大腸，仔細清洗掉黏液、去油脂，再灌入炒好放涼的糯米。糯米腸先蒸煮備用，再烤熱；利用豬大腸的脂香和彈勁，豐富糯米飯之口感。\n\
    此物營業門檻低，一輛攤車即可做生意。全台夜市皆不乏大腸包小腸，諸如逢甲夜市「官芝霖」「百膳工坊」「味珍香」，清大夜市「小洞天」、台大公館商圈「大學口」……逛夜市或廟會，常見人手一組，當街大啖。可惜大部分商家多用合成腸衣製作糯米腸，令人洩氣。人工合成腸衣用植物膠、牛皮提煉，口感差，成本低，吃一口就意志消沉。\n\
    我對米腸最基本的要求是腸衣須採用天然新鮮的豬大腸，如六腳鄉蒜頭市場那老攤，其糯米用花生、肉臊炒過，包覆在脂香中等待，以五香、肉桂調味的香腸和自醃生薑片，十分美妙。北斗「台灣寶」的大腸包小腸很美，那香腸裡絕大部分是瘦肉，糯米腸亦用心製作。淡水「半坪屋糯米腸」雖無香腸，所製糯米腸卻相當精彩，外帶一份，邊吃邊眺望觀音山和淡水出海口，感動得想唱歌。\n\
    香腸中我尤鍾愛台式口味：用豬後腿肉切丁，以鹽、糖、胡椒粉、肉桂乃至高粱酒調味灌製，風味絕佳。高明的烤香腸除了美味，咬下去還能噴肉汁；獃子才會把香腸烤得乾澀。\n\
    ……\n這種小吃可以坐下來慢慢品嚐，也不妨邊走邊吃。我很喜歡可以邊走邊吃的東西，只要不在意吃相，莫在意別人不屑的眼光，總是帶著快意江湖的豪爽感。\n……\n\
    \                  （節錄自焦桐 大腸包小腸）"
