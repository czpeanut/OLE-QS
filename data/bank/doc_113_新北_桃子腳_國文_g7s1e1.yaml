  stem: 根據本文，下列敘述何者正確？
  options:
  - label: A
    content: 作者走路緩慢怕跌倒的原因，是因為年紀太大
  - label: B
    content: 作者能保持樂觀，弟妹們的熱鬧陪伴也是功不可沒
  - label: C
    content: 作者在家中蝸步的時候，家人們都閃得遠遠的因怕害作者跌倒，自己惹上麻煩
  - label: D
    content: 因為走一小段路，就把自己搞得精神緊張，神經兮兮，所以後來作者就不再自己走路，改坐輪椅。
  group_stem: "乙、\n以前我還可以行走，只是走得很緩慢，很艱難。\n因為腳和膝蓋的關節都告變形，走起路來姿勢古怪，重心不穩；而醫生又一再警告我，要提防跌倒。病久了，不僅骨質鬆脆，缺乏膠質，而且好幾個關節都己僵化，無法靈活彎曲，摔下去毫無緩衝餘地，骨頭摔斷了很難復原。因此，走路時我都是扶著桌子或牆壁，小心翼翼，緊張萬分。\n\
    家裡的空間小，人又多，我既怕別人衝撞到我，也怕自己的蝸步的妨礙了交通，真是眼觀四面，耳聽八方。特別是家中有了小孩時，那更是提心弔膽，如臨大敵。還沒站起來之前，就大呼小叫，要大家讓路，把小孩子趕到別的房間去，我經過的地方，如有擋路的物品，也要趕快挪開，一家人都被我弄得精神緊張，神經兮兮！\n\
    一定是我那副樣子太可笑了，弟妹們就不時拿我尋開心，故意搶在前面替我「開道」，作勢敲鑼狀，口中還大聲吆喝著：「噹！噹！大人出巡了，肅靜，迴避，噹！噹！噹！」\n\
    多虧有他們，給我病中生活平添無限熱鬧。\n       （杏林子 大人出巡）"
