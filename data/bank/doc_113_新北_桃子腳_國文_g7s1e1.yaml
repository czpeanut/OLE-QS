- id: doc_113_新北_桃子腳_國文_g7s1e1_s2_39
  section: 2
  number: 39
  type: single
  page: 5
  stem: 根據本文，下列敘述何者最恰當？
  options:
  - label: A
    content: 作者小學一年級時都用竹片子、黃麻稈、粗草紙、衛生紙來擦屁股
  - label: B
    content: 二年級老師要求保持個人衛生，但多數學生因家長衛生觀念不普及敷衍了事
  - label: C
    content: 台北表弟和作者的相似之處，是家中都有建廁所，而且都喜歡看四郎真平漫畫
  - label: D
    content: 當時大人和小孩多半都在水溝、牆角、甘蔗田以及任何可以蹲下來的地方上廁所，也沒人覺得奇怪。
  group_stem: "戊、\n開始唸小學那一年，我第一次看見衛生紙，至於正式使用，是在二年級的時候，在這之前，解手後都是用竹片子或黃麻稈一揩了事。大人們的廁所在房間內，用花布簾圍住壁角，裡邊放著馬桶；小孩子們沒有限制，水溝、牆角、甘蔗田以及任何可以蹲下來的地方，統統是廁所。\n\
    在學校裡，老師天天交代我們：要穿鞋子，要常洗頭髮，要買衛生紙，不要隨地大小便。我回家跟爸說要買鞋子，爸說沒那麼「好命」；我提起衛生紙的好處，媽說那太浪費，小孩子不懂賺錢的辛苦；我又引用老師的話，說用竹片子揩屁股會生痔瘡，爸生氣了，他說老師一定瘋了，因為他從一歲到二十多歲都是這樣，也沒生過痔瘡；我小聲地說，應該有廁所，祖父說，奇怪，水溝不是很多嗎？最後爸解釋說，衛生紙太薄，容易破，揩不乾淨。這以後，媽准許我用粗草紙，那是大人們用的，不過，我還是寧可用竹片子，粗草紙就帶到學校讓老師檢查，我們班上有過半以上的同學都和我一樣，老師也不再要我們買衛生紙了。\n\
    二年級下學期，三姑帶著表弟從台北來我家玩，吃過中飯，表弟說要上廁所，我帶他到門前的水溝邊，他很驚訝，硬是不肯脫下褲子，說是沒有東西擋著他拉不出來，我帶他到豬舍旁邊，他蹲在地上，不時看著我，然後站起來，說他拉不出來，我只好走開，隔一陣子就喊：「好了沒有？」表弟苦著臉走出來對我說沒有，我拉起他跑到學校，他急忙衝進廁所，出來之後，滿頭大汗。在回家的路上，他一直問我：為什麼廁所裡沒有水箱子？為什麼有很多很多白白小小的蟲？還有，在水溝裡拉屎，警察為什麼不管？我說警察的兒子也和我們一樣，他就說，回台北以後要報告老師，叫老師來抓警察，我聽了感到很生氣，跟他說，警察和真平、四郎一樣偉大，不能抓，他不相信，還說校長可以管老師，老師可以管警察，真平和四郎跟總統一樣大，不是跟警察一樣大。我氣極了，不再理他。\n\
    ……\n去年暑假，我回家鄉，找六叔聊天，聊起有關廁所的事。我對六叔的幾個孩子說，你們命好，我們小時候連廁所都沒有呢，他們不太相信。我說不但這樣，解手後都用竹片子揩屁股哪，他們說我欺騙兒童。六叔說，這是真的。八歲的小堂弟說，他要去報告級任老師，爸爸和堂哥愛撒謊；十歲的堂妹說，最好報告校長，因馮校長比較「匈奴」，一定會打堂哥屁股……最後，他們聯合問我們一個問題：用竹片可以揩得乾淨嗎？六叔說大概可以，我說差不多啦。\n\
    【注釋】\n真平、四郎：葉宏甲的四郎真平漫畫是台灣老一輩人的共同回憶。\n                       (節錄自阿盛 廁所的故事)"
