- id: doc_113_新北_桃子腳_國文_g7s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 梁實秋先生說過：「如果想在有生之年做點什麼事，學點什麼學問，充實自己，幫助別人，使生命有意義，不虛此生，那麼就不可浪費光陰。」上述內容告訴我們什麼道理？
  options:
  - label: A
    content: 讀書可變化氣質
  - label: B
    content: 要多加善用時間
  - label: C
    content: 助人為快樂之本
  - label: D
    content: 人要立志做大事。
- id: doc_113_新北_桃子腳_國文_g7s1e1_s1_14
  section: 1
  number: 14
