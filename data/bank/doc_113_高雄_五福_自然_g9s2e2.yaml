- id: doc_113_高雄_五福_自然_g9s2e2_s1_28
  section: 1
  number: 28
  type: single
  page: 3
  stem: 此喇叭是因『電流流入線圈後與永久磁鐵產生吸引或排斥』，連帶使紙杯底部震動而產生聲音。試問上述『 』中的現象主要是應用何種原理?
