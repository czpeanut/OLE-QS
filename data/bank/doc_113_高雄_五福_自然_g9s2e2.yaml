- id: doc_113_高雄_五福_自然_g9s2e2_s1_38
  section: 1
  number: 38
  type: single
  page: 5
  stem: '臺灣因為地質與氣候的特性，使得山區常有山崩、土石流發生，並造成生命財產的損失。下列造成臺灣常有山崩或土石流的可能條件及其原因配對，何者錯誤？


    | | 條件 | 原因 |

    | :--- | :--- | :--- |

    | (A) | 風化嚴重 | 岩層破碎，提供土石來源 |

    | (B) | 砂頁岩互層的順向坡，且坡腳被挖除 | 岩層無坡腳支撐 |

    | (C) | 豪雨 | 增加土體重量且減少摩擦力 |

    | (D) | 氣候乾燥炙熱，地下水面下降太多 | 因地下水減少，岩層間的摩擦力也變小 |'
  options:
  - label: A
