  options:
  - label: A
    content: 電磁感應
  - label: B
    content: 電流磁效應
  - label: C
    content: 庫侖定律
  - label: D
    content: 靜電感應
  group_stem: "【題組3】請在閱讀下列敘述後，回答 33~35 題：\n    聽力受損的人，大多需配戴助聽器輔助日常生活，但當接收到的聲音是來自廣播系統和小蜜蜂等電子設備，助聽器將這些經過處理的「機械音」再次放大時，可能會因為聲音在數次的轉換過程中失真，音效品質因此大打折扣。在此狀況下，若環境中還有其他干擾的噪音，聽損人士就更不容易聽清楚。\n\
    \    這種時候，使用 T 線圈（Telecoil）就能幫助聽損人士聽得更清晰！多數助聽輔具都有 T 線圈，是由銅線纏繞在磁性材料的棒子上所組成。只要在有鋪設聽力／電磁感應線圈系統的環境中，開啟輔具「T\
    \ 功能」，系統會將目標音源訊號轉換成變動磁場，T 線圈便會產生交流電，電訊號再轉換成聲音並放大，避免數次的聲音處理、噪音及距離等因素影響，讓使用者能夠聽到清楚又純粹的聲音。無論是演講、表演、會議等場合，這樣的系統能夠提供聽損者更好的聲音品質！"
