  stem: 對於文章內容的解析，下列何者正確？
  options:
  - label: A
    content: 濟南府捕得的盜匪通常都處以極刑
  - label: B
    content: 盜匪認識此快刀士兵，拜託他手下留情
  - label: C
    content: 文中「好快刀！」是圍觀行刑者發出的讚語
  - label: D
    content: 人物刻劃鮮明、場景變化多端是本文最大特色
  group_stem: '明末，濟屬①多盜。邑各置兵，捕得輒殺之。章丘盜尤多。有一兵佩刀甚利，殺輒導窾②。一日，捕盜十餘名，押赴市曹③。內一盜識兵，逡巡④告曰：「聞君刀最快，斬首無二割。求殺我！」兵曰：「諾。其謹⑤依⑥我，無離也。」盜從之刑處，出刀揮之，豁然頭落。數步之外，猶圓轉而大讚曰：「好快刀！」                      蒲松齡《聊齋誌異‧快刀》

    ① 濟屬：濟南府所屬地區。

    ② 殺輒導窾（ㄎㄨㄢˇ）：意謂殺即順竅，一刀便斷頭。窾，空處。

    ③ 市曹：市口通衢，常為古代行刑之處。

    ④ 逡巡：遲疑徘徊。此謂吞吞吐吐，難以出口。

    ⑤ 謹：謹慎小心，此處有注意留心之意。

    ⑥ 依，依傍，靠著。'
