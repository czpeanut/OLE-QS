  group_stem: "賈逵年五歲，明惠過人。其姊韓瑤之婦，嫁瑤無嗣而歸居焉，亦以貞明見稱。聞鄰中讀書，旦夕抱逵隔籬而聽之。逵靜聽不言，姊以為喜。至年十歲，乃暗誦六經。姊謂逵曰：「吾家貧困，未嘗有教者入門，汝安知天下有《三墳》、《五典》而誦無遺句耶？」逵曰：「憶昔姊抱逵於籬間聽鄰家讀書，今萬不遺一。」乃剝庭中桑皮以為牒，或題於扉屏，且誦且記。期年，經文通遍。於閭里每有觀者，稱云振古無倫。門徒來學，不遠萬里，或襁負子孫，舍於門側，皆口授經文，贈獻者積粟盈倉。或云：「賈逵非力耕所得，誦經口倦，世所謂舌耕也。」\n\
