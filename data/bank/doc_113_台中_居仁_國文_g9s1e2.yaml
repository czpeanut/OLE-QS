  group_stem: "先公言：與閻二丈①詢仁赴省試，遇少年風骨竦②秀於相國寺。及下馬去毛衫，乃王元澤③也。是時盛冬，因相與於一小院中擁火。詢仁問荊公出處，曰：「舍人何久召不赴？」答曰：「大人久病，非有他也。近以朝廷恩數至重，不晚且來。雱不惟赴省試，蓋大人先遣來京尋宅子爾。」詢仁云：「舍人既來，誰不願賃④宅，何必預尋？」元澤答曰：「大人之意不然，須與司馬君實⑤相近者，每在家中云：『擇鄰必須司馬十二，此人居家事事可法，欲令兒曹⑥有所觀效焉。』」\n\
    \  王銍⑦〈王荊公⑧擇鄰〉\n① 閻二丈：閻詢仁，本文作者王銍是他的晚輩，故尊稱他「丈」。\n② 竦：音ㄙㄨㄥˇ，挺拔。\n③ 王元澤：即王雱，王安石之子。\n\
    ④ 賃：音ㄌㄧㄣˋ，租借。\n⑤ 司馬君實：即司馬光，堂兄弟中排行十二，故稱司馬十二。\n⑥ 兒曹：兒輩。\n⑦ 王銍：字性之，汝陰人。\n⑧ 王荊公：即王安石。"
