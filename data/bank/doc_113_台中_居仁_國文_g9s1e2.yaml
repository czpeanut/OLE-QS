  type: single
  page: 3
  stem: 下列選項中的文字，旨在強調求學必須先立定志向。依據文意判斷，何者斷句最恰當？
  options:
  - label: A
    content: 夫學者之欲至於聖賢猶射者，之求中夫正鵠也。不以聖賢為準的而學者是，不立正鵠而射者也。
  - label: B
    content: 夫學者之欲至於聖賢，猶射者之求中夫正鵠也。不以聖賢為準的而學者，是不立正鵠而射者也。
  - label: C
    content: 夫學者之欲，至於聖賢猶射者之求中。夫正鵠也，不以聖賢為準的，而學者是不立正鵠而射者也。
  - label: D
    content: 夫學者之欲至，於聖賢猶射者之求。中夫正鵠也不以聖賢為準，的而學者是不，立正鵠而射者也。
