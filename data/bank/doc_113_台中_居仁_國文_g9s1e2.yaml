  stem: 根據上文，下列敘述何者正確？
  options:
  - label: A
    content: 芙渠與各類草本的花都是無根的樹、一年一生
  - label: B
    content: 小荷葉長出水面時，便已妝點綠波，顯現風姿
  - label: C
    content: 「有風既作飄搖之態，無風亦呈裊娜之姿」寫荷花之美
  - label: D
    content: 「過而不問之秋」、「自夏徂秋」的「秋」，意思相同
  group_stem: "芙蕖與草本諸花似覺稍異，然有根無樹，一歲一生，其性同也。\n    群葩①當令時，只在花開之數日，前此後此，皆屬過而不問之秋矣。芙蕖則不然：自荷錢②出水之日，便為點綴綠波；及其莖葉既生，則又日高日上，日上日妍；有風既作飄搖之態，無風亦呈裊娜之姿。是我於花之未開，先享無窮逸致矣。迨③至菡萏成花，嬌姿欲滴，後先相繼，自夏徂④秋。\n\
    節錄自李漁〈芙蕖〉\n① 葩：音ㄆㄚ，花。\n② 荷錢：指初生的小荷葉，因其形如錢，故名。\n③ 迨：音ㄉㄞˋ，等到。\n④ 徂：音ㄘㄨˊ，至、及。"
