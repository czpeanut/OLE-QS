- id: doc_113_台中_居仁_國文_g9s1e2_s6_8
  section: 6
  number: 8
  type: single
  page: 5
  stem: 根據文意，下列對於蘇軾的敘述，何者正確？
  options:
  - label: A
    content: 早年即父母雙亡，獲罪之後馬上告知蘇轍
  - label: B
    content: 個性剛直、好發議論，偶爾難免言行不一
  - label: C
    content: 思慮不周，憑恃天地的寬容而未謙抑敬畏
  - label: D
    content: 任職杭州、密州時，不敢輕率創作新作品
  group_stem: "臣早失怙恃①，惟兄軾一人，相須為命。今者，竊聞其得罪逮捕赴獄，舉家驚號，憂在不測。臣竊思念，軾居家在官，無大過惡，惟是賦性愚直，好談古今得失，前後上章論事，其言不一。陛下聖德廣大，不加譴責。軾狂狷②寡慮，竊恃天地包含之恩，不自抑畏。頃年通判杭州及知密州日，每遇物托興，作為歌詩，語或輕發，向者曾經臣僚繳進，陛下置而不問。軾感荷恩貸，自此深自悔咎，不敢復有所為。但其舊詩已自傳播。……\n\
    臣竊哀其志，不勝手足之情，故為冒死一言。昔漢 淳于公得罪，其女子緹縈，請沒為官婢，以贖其父。漢文因之，遂罷肉刑。今臣螻蟻之誠，雖萬萬不及緹縈，而陛下聰明仁聖，過於漢文遠甚。臣欲乞納在身之官，以贖兄軾，非敢望末減其罪，但得免下獄死為幸。\n\
    \      節錄自蘇轍〈為兄軾下獄上書〉\n① 失怙恃：父母雙亡。\n② 狂狷：過於激進與過於保守的人。"
