- id: doc_113_台中_居仁_國文_g9s1e2_s6_1
  section: 6
  number: 1
  type: single
  page: 4
  stem: 關於上文內容，下列說明何者正確？
  options:
  - label: A
    content: 鰻魚屬洄游性魚類，逆流到河的上游產卵，然後死亡
  - label: B
    content: 在日本，捕撈野生鰻苗的成本大約在台幣100 元出頭
  - label: C
    content: 1973 年日本成功地用人工孵化鰻魚卵且幼鰻存活率高
  - label: D
    content: 2024 年日本突破養殖鰻魚苗成本，降到約日幣400 元
  group_stem: "每年冬天(十一月到隔年二月)，漁民們會聚集在花蓮溪、蘭陽溪甚至淡水河口， 捕撈他們稱之為「白金」的鰻苗， 你有沒有想過為什麼漁民大多數都是捕鰻苗而非直接從魚卵開始養殖鰻魚？\n\
    \    要了解這個原因，我們要先了解鰻魚（以下所述之鰻魚以日本鰻Anguilla japonica 為主）複雜的生命之旅。鰻魚和鮭魚一樣，都屬於洄游性魚類，不同的是鮭魚是逆流而上到河的上游產卵，鰻魚則是從河游入海產卵，而且產卵的地點也不簡單，母鰻經過千里跋涉來到太平洋最深的馬里亞納海溝附近產卵後死亡。在深海中孵化後的鰻苗會長成兩側扁扁的柳葉鰻樣態，這個外型讓牠可以隨著黑潮進行長距離漂流，接近大陸棚時則變態成為流線型的玻璃鰻或線鰻，這也是漁民捕撈到鰻苗的真實樣態。\n\
    \    捕獲鰻苗後，鰻魚長大之路才要開始，這些來自台灣東部或東北部的鰻苗們很快又會被千里跋涉，帶到台灣西南部進行養殖，花半年時間從一隻0.2g 的小小鰻苗養殖到一隻250g\
    \ 的成體鰻魚，就可以販售成為鰻魚飯的材料了。\n    由於鰻苗的出沒很受到海流影響，台灣周遭的沿岸海流又非常複雜，因此每年漁民能捕到鰻苗的情況相當不一，歉收時曾創下一隻100\
    \ 至200 元，單位重量價格可能超越黃金，因此才有「白金」之美名。\n    然而，過度捕撈和人為對棲息地的破壞正導致野生鰻魚資源不斷下降，雖然農業部早於2013\
    \ 年就開始執行冬季以外季節禁止捕撈鰻苗、溪流禁捕成鰻等政策來永續鰻魚資源，但往往造成冬季大量漁民湧入，近年甚至出動鰻苗船搶捕等現象，因此，科學家開始思考，我們何不從零開始養殖鰻魚直到成鰻呢？\n\
    \    這個技術叫做「完全養殖」，四面環海的台灣，有70-80種海產已達成完全養殖，如石斑魚、草蝦等。然而，鰻魚的生活史太過於複雜，不同生長階段對環境條件要求不同。從卵到鰻苗，再到成鰻，每個階段需要特定的水溫、鹽度和氧氣濃度等條件。這些條件的微小變化都可能對鰻魚的生長產生重大影響。如何在人工環境中精確控制這些變數，是實現完全養殖的關鍵。\n\
    \    即使如此，嗜吃鰻魚如命的日本人對完全養殖充滿了幹勁。早在1973 年，日本科學家就成功人工孵化鰻魚卵，回顧一下，鰻魚卵原本可是在馬里亞納海溝等級的深海才能孵化，研究團隊如何人工模擬出這種環境實在是不簡單，而由於對幼鰻生態有太多未知，導致孵化出的幼鰻死亡率極高，讓如何養出鰻魚苗這點卡關，直到2016\
    \ 年才突破，但一尾鰻苗的成本高達台幣8700 元（40000 日圓）。即使如此，科學家並不氣餒，透過育種、獨特配方的飼料等方式，持續提高量產可能性，今年（2024）7\
    \ 月，日本水產廳研究機關公開新突破，養殖鰻魚苗成本降到約400 元（1800 日圓）左右，距離野生捕撈的鰻苗100 元出頭（500-600 日圓）已經不遠，配合原本就成熟的成鰻養殖技術，終於讓鰻魚的「完全養殖」成為可能。\n\
    \    完全養殖技術的成功，不僅能繼續滿足我們對鰻魚飯的口腹之慾，更讓野生饅魚族群獲得喘息的空間，期待將來有一天，溪口的玻璃鰻不再被圍捕，而能夠安心洄游成長，再踏上前往馬里亞納海溝的旅程。\n\
    \  郭毓璞〈鰻魚完全養殖〉"
