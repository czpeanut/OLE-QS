- id: doc_113_屏東_明正_英語_g8s1e3_s6_11
  section: 6
  number: 11
  type: single
  page: 3
  stem: Who will be interested in the reading?
  options:
  - label: A
    content: People who want to save money when having a trip in the city.
  - label: B
    content: People who plan to go hiking to Mount Hatley.
  - label: C
    content: Beginners who never go hiking before.
  - label: D
    content: People who want to play in the snow.
  group_stem: '(三) Every year, about 250,000 people from all around the world come
    to hike Mount Hatley. It is open to hikers from early July to late September because
    the mountain is usually free of snow during those months.

    There are four trails, with different starting points. Hikers usually go to the
    starting points by bus. Trail-4 is the most popular hiking trail because it is
    easy for people to get there from the city.


    | Trail-1 | | |

    | :--- | :--- | :--- |

    | Level | ★ | |

    | Up | 5km | 5hrs |

    | Down | 5km | 3hrs |

    | Hikers (2020) | 70,319 | |

    | Huts | 8 | |


    | Trail-2 | | |

    | :--- | :--- | :--- |

    | Level | ★★★ | |

    | Up | 12km | 8hrs |

    | Down | 9km | 4hrs |

    | Hikers (2020) | 18,411 | |

    | Huts | 4 | |


    | Trail-3 | | |

    | :--- | :--- | :--- |

    | Level | ★★ | |

    | Up | 7.5km | 6.5hrs |

    | Down | 6.2km | 3hrs |

    | Hikers (2020) | 23,475 | |

    | Huts | 12 | |


    | Trail-4 | | |

    | :--- | :--- | :--- |

    | Level | ★ | |

    | Up | 7.5km | 6hrs |

    | Down | 7.6km | 3hrs |

    | Hikers (2020) | 172,657 | |

    | Huts | 18 | |


    To most hikers, it usually takes two days to go up and down Mount Hatley. They
    rest at a mountain hut and begin at night to reach the summit in time to watch
    the sunrise.

    Staying at one of the mountain huts costs $80, and a hot meal is $10 for a person.
    Also, there are no “free” restrooms on Mount Hatley. It will cost you $2 to use
    the restrooms each time.

    Finally, Mount Hatley is not an easy mountain to hike at all. Please train before
    your trip. Good luck and happy hiking!


     trail 步道 starting point 起點 level 程度 hut 山屋 sunrise 日出 meal 餐'
