- id: doc_113_屏東_明正_英語_g8s1e3_s6_1
  section: 6
  number: 1
  type: single
  page: 2
  stem: Why did Uncle Joe write the letter?
  options:
  - label: A
    content: To ask Lisa to bring a gift to him.
  - label: B
    content: To give Lisa an idea about Pingtung.
  - label: C
    content: To tell Lisa more about the family trip.
  - label: D
    content: To share his plans for visiting Lisa’s family.
  group_stem: '(一) Dear Lisa,

    Your father talked about visiting Pingtung so many times. Finally, it’s happening.
    I believe we will have a great time in Pingtung. Aunt Susan, your cousins and
    I will take you guys to some interesting places. Now, let me tell you about our
    plan.

    On the first day, you will take the THSR to Kaohsiung, and then go to Pingtung
    by train. You will spend three hours getting here. We will pick you up at the
    train station. In the afternoon, we will go to Shengli Star Village. There are
    a lot of Japanese houses there for us to look around. We’ll visit the bookstore
    and have a cozy afternoon tea at the café there. We don’t have to be hurried,
    just enjoy a comfortable afternoon there. On the second day, we are going to take
    you to Fangliao, a fishing harbor, which is just beside Fang-Liao Station. We
    can enjoy the beautiful view of the sea and walk across the blue lover’s bridge.
    We will also have the delicious seafood there. On the third day, we’re going to
    Chaozhou. We will visit the Taiwanese Opera and Puppet Museum. We can learn about
    the history of the Taiwanese Puppet and enjoy the special, “hot and cold ice.”
    At night, we can do some shopping. On the last day, we’ll visit the Pingtung 1936
    Tobacco Culture Base. It’s one of Pingtung’s must-see museums. Won’t that be great?

    By the way, remember to bring a hat and sunscreen because the summer here is very
    hot. We can’t wait to see you in August.

    Love,

    Uncle Joe


    comfortable (a)舒服的 harbor (n)港口 seafood (n)海產 puppet (n)木偶 sunscreen (n)防曬乳'
