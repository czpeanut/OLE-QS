  group_stem: '(二) Mona: Honey, can you go to the photo shop and print out two more
    sets of these photos for my parents?

    Chad: But it looks like rain now! Why don’t you just call Easy-Snap? It takes
    them only five minutes to get here from Gemmy Road.

    Mona: But that’ll be very expensive!!

    Chad: OK, OK. Then I’ll go to the photo shop next to the café. I heard it’s having
    a sale.

    Mona: You mean Nice-Shoot? Too late. Yesterday was the last day. There’s a new
    shop called Plus-Pic across from the station. I’ve checked the photo shops in
    town. It costs the least to print out two sets of photos at Plus-Pic.

    Chad: But it’s the farthest from us! How about Quick-Foto? It’s a lot nearer,
    and not that expensive!

    Mona: It’s closed today. Come on! You don’t have anything important to do this
    afternoon, do you?

    Chad: I... all right. You win.

    111 年教育會考補考題


     print 沖印 set 組 the least 最少的 the farthest 最遠的'
