    b. The houses were so charming(迷人的). I felt like walking into the past time. I
    like the coffee there. It tasted(嚐起來) great.

    c. It was such a wonderful way to end the trip by visiting the important museum
    in Pingtung.

    d. The view of the sea was so beautiful. We took a lot of photos on the bridge.
