- id: doc_113_台北_仁愛_社會_公民_g7s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: (   )2011 年一群服務街友的第一線人員組成芒草心慈善協會，初期以國際交流為主，和日本、香港、南韓等地服務人員交流經驗，互相學習。2014 年以更實務的角度協助無家者及貧困者，除了實際規畫執行無家者自立方案，例如：街友導覽（街遊）、起家工作室、自立支援中心等，自
    2014 年開始帶著遊客探索臺北的另一面，規劃「街遊城市導覽員計畫」。導覽員是曾有流浪經驗的民眾，不僅帶著遊客一探臺北街頭，也在這過程中看見他們的人生故事。透過導覽員的敘說，遊客得以從無家者的角度重新認識臺北。導覽員透過更多人際互動，更有自信及得到改善生活的機會，例如導覽收入改善生活。希望透過這些活動，能夠創造不同群體可以自在對話的環境，才有機會化解偏見，打造一個更有包容性的社會。根據上述內容，芒草心慈善協會推動「街遊──城市導覽員」計畫，主要目的為下列何者？
  options:
  - label: A
    content: 從事營利目的
  - label: B
    content: 提供社會救助
  - label: C
    content: 配合政府政策
  - label: D
    content: 協助街友自立。
