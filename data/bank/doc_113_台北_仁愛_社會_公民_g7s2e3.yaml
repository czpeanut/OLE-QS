    content: 家庭資源分配不均的結果
  group_stem: '(二)請根據以下的介紹內容，回答問題：

    兒童台語繪本《無公平》，是一本講述凡事都講公平的小獅子的故事，故事中小獅子和鴨子玩跳繩的時候，小獅子表示「不公平，你有翅膀。」，和兔子比賽跳遠的時候，表示「不公平，你本來就比較會跳。」點心時間時，一人一份點心，看起來很公平，但小獅子還是覺得不公平，自己體型比較高大，竟然跟大家分量相同，最後委屈得大哭了起來，小老鼠因為食量小，為了安慰獅子，便把自己的麵包分了一半給獅子，動物們也一起討論怎麼相處才會讓大家都覺得「公平」。

    在團體生活中，兒童常常因為覺得「不公平」而產生許多不安與衝突情緒，但透過可愛又溫暖的情節，溫柔化解掉這些情緒。主題圍繞著「到底什麼是真正的公平？真的有公平的時候嗎？」令人覺得有趣又可多加思考。'
