- id: doc_113_台北_仁愛_社會_公民_g7s2e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: (   )在東京奧運獲得羽球銅牌的印度女選手辛度，是印度史上第一位獲得 2 枚奧運獎牌的女性。但是許多印度人民關心的並非是她的成就，而是她出身的「種姓」階級。種姓制度在印度是根深蒂固的觀念，直接以一個人的出身決定其身分貴賤與社會階級。雖然印度已正式以法律廢止種姓制度，但仍難以改變這固有的觀念。根據印度媒體報導，在辛度奪牌後，印度網友搜尋她種姓的次數是平時的
    7 倍，大家更在意「她是貴族還是平民」，這往往讓不少運動員的努力被忽略，為此辛度曾主動投書媒體，希望女性不要因此阻礙夢想，並期望月事汙名化的現象在印度社會能早日消失。根據上文所描述的內容判斷，下列哪項敘述是正確的？
  options:
  - label: A
    content: 種姓制度雖然已經廢除但是仍影響印度民眾
  - label: B
    content: 在辛度的努力下印度男尊女卑的情況已改善
  - label: C
    content: 印度社會對於個人後天努力的成就較為重視
  - label: D
    content: 辛度兩度獲得奧運獎牌與她的出身背景有關。
