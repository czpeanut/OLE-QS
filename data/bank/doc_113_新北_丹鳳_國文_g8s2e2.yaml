  section: 3
  number: 27
  type: single
  page: 3
  stem: '「廬山可以證明，中國文人的孤獨不是一種脾性，而

    是一種無奈。廬山與其說是文人的隱潛處，不如說是歷

    代文人渴望超拔俗世而達到跨時空溝通的寄託點。於是

    李白、白居易、歐陽脩、蘇東坡、陸游、唐寅等等文化

    藝術家紛來沓至，周敦頤和朱熹則先後在山崖雲霧之間

    投入了哲學的沉思和講述。」根據上文，眾多文化藝術

    家紛紛來到廬山的原因為何？'
  options:
