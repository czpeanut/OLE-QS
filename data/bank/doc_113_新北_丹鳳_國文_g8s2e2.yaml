  number: 5
  type: single
  page: 1
  stem: 下列「 」的字義比較，何者意思相同？
  options:
  - label: A
    content: 從橋下「走」出／見乘輿車騎即「走」耳
  - label: B
    content: 「是」法不信於民也／廷尉當「是」也
  - label: C
    content: 於是「使」騎捕／上「使」立誅之
  - label: D
    content: 從橋「下」走出／今既「下」廷尉。
