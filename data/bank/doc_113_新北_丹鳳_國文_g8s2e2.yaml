- id: doc_113_新北_丹鳳_國文_g8s2e2_s4_30
  section: 4
  number: 30
  type: single
  page: 4
  stem: '下列關於徐志摩〈再別康橋〉一詩的意象說明，何者

    正確？'
  options:
  - label: A
    content: 以「沉澱著彩虹似的夢」來形容康河上康橋的倒影
  - label: B
    content: 以「水底招搖的青荇」比擬自己
  - label: C
    content: 以「河畔的金柳」來描寫夕陽中嬌美的新娘
  - label: D
    content: 以「波光裡的豔影」來形容西天雲彩的倒影。
  group_stem: '〈再別康橋〉徐志摩

    輕輕的我走了， 正如我輕輕的來；

    我輕輕的招手， 作別西天的雲彩。

    那河畔的金柳， 是夕陽中的新娘；

    波光裡的豔影， 在我的心頭蕩漾。

    軟泥上的青荇， 油油的在水底招搖；

    在康河的柔波裡， 我甘心作一條水草！

    那榆蔭下的一潭， 不是清泉，是天上虹，

    揉碎在浮藻間， 沉澱著彩虹似的夢。

    尋夢？撐一支長篙， 向青草更青處漫溯，

    滿載一船星輝， 在星輝斑斕裡放歌。

    但我不能放歌， 悄悄是別離的笙簫；

    夏蟲也為我沉默， 沉默是今晚的康橋！

    悄悄的我走了， 正如我悄悄的來；

    我揮一揮衣袖， 不帶走一片雲彩。'
  lesson_raw:
    title: 再別康橋
    basis: 題組詩文為徐志摩〈再別康橋〉
