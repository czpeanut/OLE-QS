- id: doc_113_新北_丹鳳_國文_g8s2e2_s4_28
  section: 4
  number: 28
  type: single
  page: 4
  stem: 根據文意，文中畫線最適合填進入下列何者？
  options:
  - label: A
    content: 發現異鄉陽光充足土地肥沃，竟與故鄉幾乎一致
  - label: B
    content: 因與阿媽並肩耕作，竟發展出平等的類友誼關係
  - label: C
    content: 獲得額外收入之後，就不再想要逃離雇主的監控
  - label: D
    content: 從中獲得實質的成就感，及部分脫逃的自在空間。
  group_stem: '二○○五越南看護工阿草順利來到台灣南部，在高雄鄉下照顧中風的阿媽。阿媽脾氣不好，但身體殘了，能動肝火指揮阿草的有限，她的子女若不在大城市就是出國了，住得稍近的，一二個月來探望一次。

    阿媽節儉，錢捨不得花，也不肯對兒孫開口，每個月留給阿草的買菜錢實在不夠用，有時還要阿草在早市收攤前匆匆去搶買降價求售的萎爛蔬果。後來阿草在院子裡試著翻土、播種一些好長的蔬菜，這才驚覺台灣南部的土地真肥沃，土地自我復元得豐沛，種子一撒就欣然冒生，從他處移植來的苗木，也落地就生了根。

    栽種除草多半在清晨阿媽還沒起床前完成，既沒妨礙阿草既有的工作，也沒花到雇主的錢，後來阿草愈種愈多，一主一僕才有更多的菜色可供挑選。阿草栽植有成，滿園綠意，香蕉和木瓜都吃不完，絲瓜、大陸妹、高麗菜……全是城市人最愛的有機農作。阿媽的子女們假日來探親，臨走時採走一車子的農作收成。

    「阿草你太厲害了！這沒灑農藥，真正的有機蔬菜。」阿媽的大女兒說，過年時，額外給阿草一個大紅包。

    她於是有了更多正當性可以待在菜園。其實，阿草從來不愛農作，在鄉下種菜，主要是逃離愛發脾氣的阿媽，讓阿草尋得一個喘息的空間，不必受到阿媽無時無刻的監看。阿媽雖能生活自理，但見不得下人閒著沒事，如今阿草種了菜，不但生活花費少了，子女還在收成時期更頻繁返家，明顯是雇主獲利得多。種植最終成為勞雇關係間的平衡點，阿草       。

    「那個土真好，那個陽光和雨水，真是好好種。」阿草說，相較於故鄉農地的乾瘠、雨量不可掌握，高雄的沃土簡直有不勞而獲的錯覺。

    人不親土親。而今想來，種菜竟是阿草在台灣最美好的回憶。青草遍野，生機盎然。

    （節錄改寫自顧玉玲〈青草遍野〉）'
