  section: 3
  number: 4
  type: single
  page: 1
  stem: '大雄近日得到一幅司馬遷畫像，希望在畫上題詩文。

    下列句子，何者最恰當？'
  options:
  - label: A
    content: 祖述堯 舜，憲章文武；德參天地，道冠古今
  - label: B
    content: '兩表一對，鞠躬盡瘁酬三顧；鼎足六出，威德咸孚

      足千秋'
  - label: C
    content: '匹馬斬顏良，河北英雄皆喪膽；單刀會魯肅，江南

      名士盡低頭'
  - label: D
    content: '剛直不阿，留將正氣沖霄漢；幽愁發憤，著成信史

      照塵寰。'
