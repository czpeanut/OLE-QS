  section: 3
  number: 25
  type: single
  page: 3
  stem: '在描述事物時，用形象的語言移轉感官感受，將某一

    感覺(視、聽、嗅、味、觸)的主觀感受移轉到另一感覺上，

    是所謂「移覺」，可使意象更活潑、更新奇。如〈我所知

    道的康橋〉一文中，「遠近的炊煙，……在靜定的朝氣裡

    漸漸地上騰，漸漸地不見，彷彿是朝來人們的祈禱，參

    差地翳入了天聽。」此段是「以聽覺印象來描寫視覺印

    象」。下列句子也都用了感覺移轉的摹寫方式，請判斷何

    者說明正確？'
  options:
  - label: A
    content: '星星是靜靜的掛在空中，卻好像帶著聲音，是早晨

      的幽遠之鐘，也是靜夜中雄渾的鼓聲，有著清脆 的

      節奏與閃耀的聲息：以視覺印象描寫聽覺印象'
  - label: B
    content: '我低下頭去喊自己的名字，井水也大聲應和，連那

      回聲都彷彿有淡淡的餘香：以嗅覺印象描寫聽覺印

      象'
  - label: C
    content: '水面無波，四周靜謐，只有閃亮的螢光是唯一的聒

      噪，看著看著，人都彷彿在光裡醉了：以視覺印象

      描寫聽覺印象'
  - label: D
    content: '太陽又出來了，一片清新的空氣、鮮潔的色彩，彷

      彿聽見了貝多芬《田園交響曲第五樂章牧羊人之

      歌》：以視覺印象描寫聽覺印象。'
