  section: 3
  number: 2
  type: single
  page: 1
  stem: "（甲）爺爺的壽宴∕松柏長青 \n（乙）歌唱比賽優勝∕口若懸河 \n（丙）新書發表會∕文采斐然 \n（丁）服飾店開幕∕美輪美奐 \n（戊）書店開幕∕學無止境\
    \ \n（己）王主任生了兒子∕弄璋之喜 \n（庚）李伯伯嫁女∕妙選東床 \n（辛）當選民代∕為國育才。 \n以上題辭的配對，何者使用正確？"
  options:
  - label: A
    content: 甲丁己辛
  - label: B
    content: 甲丙己庚
  - label: C
    content: 乙丁戊庚
  - label: D
    content: 乙丙戊庚。
