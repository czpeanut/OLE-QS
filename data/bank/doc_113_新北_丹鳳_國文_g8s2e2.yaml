  section: 3
  number: 24
  type: single
  page: 3
  stem: '「孝昭皇帝，武帝少子也。母曰趙婕妤，武帝末，戾

    太子敗，燕王 旦，廣陵王 胥行為驕縱，後元二年，武

    帝病，立昭帝為太子，年八歲。後武帝崩，昭帝即位，

    帝姐鄂邑公主益湯沐邑，封長公主。追尊趙婕妤為皇太

    后。」關於文中人物，何者說明正確？'
