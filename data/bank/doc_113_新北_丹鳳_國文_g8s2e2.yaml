  section: 3
  number: 23
  type: single
  page: 3
  stem: 關於〈我所知道的康橋〉一文，下列敘述，何者正確？
  options:
  - label: A
    content: '「我心頭頓時感著神異性的壓迫，我真的跪下了，對

      著這冉冉漸隱的金光。」作者跪下的理由是因為篤信

      宗教神蹟的執著與熱誠'
  - label: B
    content: '「『春！』這勝利的晴空彷彿在你的耳邊私語。『春！』

      你那快活的靈魂也彷彿在那裡回響。」句中表達了尋

      春人驚訝喟嘆的心情'
  - label: C
    content: '「頃刻間這田野添深了顏色，一層輕紗似的金粉糝上

      了這草、這樹、這通道、這莊舍。頃刻間這周遭彌漫

      了清晨富麗的溫柔，頃刻間你的心懷也分潤了白天誕

      生的光榮。」連用三個「頃刻間」表現春曉景色瞬息

      萬變，令人目不暇給'
  - label: D
    content: '「你如愛鳥，這裡多的是巧囀的鳴禽。你如愛兒童，

      這鄉間到處是可親的稚子。你如愛人情，這裡多的是

      不嫌遠客的鄉人……」，這段文字使用三次「你如

      愛」，給人繁華熱鬧，無拘無束的感覺。'
