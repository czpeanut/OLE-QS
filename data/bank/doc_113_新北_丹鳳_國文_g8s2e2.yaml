  page: 2
  stem: 關於〈我所知道的康橋〉一文，下列說明何者錯誤？
  options:
  - label: A
    content: '「村舍與樹林是這地盤上的棋子，有村舍處有佳蔭，

      有佳蔭處有村舍」：描述的是村舍與樹林相互錯落

      的景象'
  - label: B
    content: '「我心頭頓時感著神異性的壓迫，我真的跪下了，

      對著這冉冉漸隱的金光」：「神異性的壓迫」是指

      宇宙萬物的偉大與莊嚴，令人產生了虔誠的情緒'
  - label: C
    content: '「關心石上的苔痕，關心敗草裡的鮮花，關心這水

      流的緩急，關心水草的滋長，關心天上的雲霞，關

      心新來的鳥語」：連續使用六個「關心」，顯示出

      作者熱忱地覓尋且期盼春天的來臨的心境'
  - label: D
    content: '「陸放翁有一聯詩句：『傳呼快馬迎新月，卻上輕

      輿趁晚涼。』這是做地方官的風流。我在康橋時雖

      沒馬騎，沒轎子坐，卻也有我的風流」：引用陸游

      詩句闡述騎自行車比騎馬更能享受馳騁的快意。'
  lesson_raw:
    title: 我所知道的康橋
