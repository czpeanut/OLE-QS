- id: doc_113_新北_丹鳳_國文_g8s2e2_s3_3
  section: 3
  number: 3
  type: single
  page: 1
  stem: "以下各「之」字，有幾個代詞？ \n（甲）於是使騎捕，屬「之」廷尉 \n（乙）且方其時，上使立誅「之」則已 \n（丙）今法如此而更重「之」，是法不信於民也\
    \ \n（丁）久「之」，以為行已過 \n（戊）唯陛下察「之」 \n（己）廷尉，天下「之」之平也。"
  options:
  - label: A
    content: 五
  - label: B
    content: 四
  - label: C
    content: 三
  - label: D
    content: 二 個。
