  number: 20
  type: single
  page: 2
  stem: '「軍用罐頭於焉問世，但初期因飲食習慣改變不易，

    使用時並不方便，並非廣受歡迎。當時罐頭形制沒有規

    範，也尚未發展出開罐工具。罐頭一旦交到士兵手中，

    還得要費一番功夫，刺刀、斧頭全都用上，罐中的食物

    才能到口。」這段文字所要傳達的訊息，不包含下列何

    者？'
  options:
  - label: A
    content: 士兵訓練有素，懂得利用手邊的工具順利開罐
  - label: B
    content: 初期罐頭食用不便，必須費盡心力才能打開
  - label: C
    content: 罐頭問世初期，形式多樣，規格並未統一
  - label: D
    content: 因習慣所致，人們對罐頭的接受度不高。
