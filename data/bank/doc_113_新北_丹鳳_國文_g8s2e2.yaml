  options:
  - label: A
    content: 趙王在廉頗和藺相如二人的陪伴下，與秦王相會
  - label: B
    content: 秦以咸陽一城，換得趙國十五城，並沒有占到便宜
  - label: C
    content: 澠池之會是一場由秦國所策畫的不懷好意的會面
  - label: D
    content: 趙王鼓瑟，秦王擊缻，會中樂音裊裊，氣氛融洽。
  group_stem: '秦伐趙，拔石城。明年，復攻趙，殺二萬人。

    秦王使使者告趙王，欲與王為好會於西河外澠池。趙王畏秦，欲毋行。廉頗、藺相如計曰：「王不行，示趙弱且怯也。」趙王遂行，相如從。廉頗送至境，與王訣曰：「王行，度道里會遇之禮畢①，還，不過三十日。三十日不還，則請立太子為王。以絕秦望。」王許之，遂與秦王會澠池。秦王飲酒酣，曰：「寡人竊聞趙王好音，請奏瑟。」趙王鼓瑟。秦御史前書曰「某年月日，秦王與趙王會飲，令趙王鼓瑟」。藺相如前曰：「趙王竊聞秦王善為秦聲，請奏盆缻②秦王，以相娛樂。」秦王怒，不許。於是相如前進缻，因跪請秦王。秦王不肯擊缻。相如曰：「五步之內，相如請得以頸血濺大王矣！」左右欲刃相如，相如張目叱之，左右皆靡③。於是秦王不懌④，為一擊缻。相如顧召趙御史書曰「某年月日，秦王為趙王擊缻」。秦之群臣曰：「請以趙十五城為秦王壽。」藺相如亦曰：「請以秦之咸陽為趙王壽。」秦王竟酒，終不能加勝於趙。趙亦盛設兵以待秦，秦不敢動。           (節選自《史記
    ．廉頗藺相如列傳》)

    注釋

    ①度道里會遇之禮畢：估計從路上行走一直到會見完畢。道里，路程。

    ②請奏盆缻秦王：請允許獻盆缻給秦王敲擊。

    ③左右皆靡：侍從皆害怕得退下來。

    ④不懌：不高興。'
