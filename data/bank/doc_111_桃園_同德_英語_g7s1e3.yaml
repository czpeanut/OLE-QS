  group_stem: '(40~42)

    (In reading class, Jill’s teacher is talking about ORID.)

    ORID is a good way to help students to learn or think well. In ORID method, there
    are four parts.

    “O” means facts. For example, what do you see? What do you hear?

    “R” means heart. For example, what do you like? How do you feel?

    “I” means head. For example, what do you learn from something?

    “D” means action. For example, what are you going to do?

    ORID is not just for leaning. It is also a way for people to talk, to write, and
    to read.

    It is a good way for everybody.


    (It’s practice time.)

    Jill is writing an article about Chimei Museum. Here are Jill’s questions and
    answers with ORID.

    O: 41.

    Wen-Long Shi (許文龍) is the founder of Chimei Museum.

    R: Is it fun in Chimei Museum?

    Yes, it’s a place of joy.

    I: What does Chimei museum mean to me?

    It’s a museum for all. Everyone can find his/her favorites in the Chimei museum.

    D: Will I go to Chimei museum?

    Yes, I want to go there.

    Here is Jill’s article.


    The Chimei Museum is a famous place in Tainan, Taiwan. Wen-Long Shi (許文龍) is the
    founder.

    When he was a kid, he made a wish. “I want to build a museum for all,” he said.
    After 80 years, his dream

    comes true.

    The Chimei museum is a great place. Inside the museum, there are many artworks.
    Artworks have

    magic. In front of them, people can find joy or peace. Outside the museum, there
    is a bridge and a

    beautiful meadow. On the bridge, people love taking pictures. In the meadow, people
    can sit or go for a

    walk, and enjoy the sunshine.

    The Chimei museum is really a place of joy. Everyone here is happy. It’s a museum
    for all. Everyone

    can find their favorites in the Chimei museum.


    📖 well 很好地 method 方法 practice 練習 article 文章 wish 願望 build 建造 come true 實現 peace
    平靜 sunshine 陽光'
