- id: doc_113_高雄_英明_國文_g9s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 蘇軾曾自云：「作文如行雲流水，初無定質，但常行於所當行，止於所不可不止。」請問蘇軾此段話的重點為何？
  options:
  - label: A
    content: 反應靈敏，處事練達，人際進退遊刃有餘
  - label: B
    content: 文章創作不拘格式，收放自如
  - label: C
    content: 仕途官運如飄雲流水，遷黜不定
  - label: D
    content: 性格自由成性，不喜歡受到拘束。
  lesson_raw:
    number: 自學選文一
    title: 蘇東坡突圍
    basis: 題幹討論蘇軾的寫作觀點
- id: doc_113_高雄_英明_國文_g9s1e3_s1_8
