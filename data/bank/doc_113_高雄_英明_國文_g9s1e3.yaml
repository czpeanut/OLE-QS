- id: doc_113_高雄_英明_國文_g9s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 以下是同學們複習完我們的饕餮時代一文後的對話內容，請問何者所述有誤？
  options:
  - label: A
    content: 媗媗：「全文內容的主旨是在說明零食的魅力無窮，令人無法抗拒」
  - label: B
    content: 小丞:「文末連續提出三個問題，讓我們思考食物的成分及食用方式」
  - label: C
    content: 昕昕：「文中提出多項數據，闡述零食已嚴重影響人們的身體健康」
  - label: D
    content: 小恩：「文章篇名以貪吃的饕餮為喻，凸顯人們對零食的無法抗拒」。
  lesson_raw:
    number: 第8課
    title: 我們的饕餮時代
    basis: 題幹提及課名「我們的饕餮時代」
- id: doc_113_高雄_英明_國文_g9s1e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 「以脂肪窒息焦慮，用糖漿淹死憂傷；酗可樂、酗咖啡直到醺醺然，在口腔的滿足快感裡暫忘現實，讓強烈的甜蜜或者辛辣麻痺所有感覺。」這段話說明了什麼現象？
  options:
  - label: A
    content: 吃了過多零食可能會導致諸多疾病的產生
  - label: B
    content: 人們藉由零食滿足口腹之欲，同時紓解日常壓力
  - label: C
    content: 透過美食盛饌能讓人們的生活更加多采多姿
  - label: D
    content: 零食中潛藏著許多添加物，容易傷人於無形之中。
  lesson_raw:
    number: 第8課
    title: 我們的饕餮時代
    basis: 引用《我們的饕餮時代》課文原句
- id: doc_113_高雄_英明_國文_g9s1e3_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 我們的饕餮時代一文中，提到「反對垃圾食物」的社會運動，下列說明何者錯誤？
  options:
  - label: A
    content: 主張規管兒童零食廣告
  - label: B
    content: 期望政府對食物都抽重稅
  - label: C
    content: 認為不健康的食物造成毒食環境
  - label: D
    content: 文中凱力·布朗奈的呼籲未受所有人認同。
  lesson_raw:
    number: 第8課
    title: 我們的饕餮時代
    basis: 題幹提及課名「我們的饕餮時代」
- id: doc_113_高雄_英明_國文_g9s1e3_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 「大部分廣告所創造出的口碑，都只圍繞在廣告本身，與產品無關。可能因此加強了知名度，卻不是可信度。事實上，甚至可能失去可信度。」根據這段文字，下列敘述何者正確？
  options:
  - label: A
    content: 知名度高的產品，未必真的受到青睞
  - label: B
    content: 廣告知名度越高，產品品質越好
  - label: C
    content: 產品知名度與可信度相輔相成
  - label: D
    content: 廣告口碑來自於知名度與可信度。
- id: doc_113_高雄_英明_國文_g9s1e3_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: '甲：美酒可以重倒，生命不能重遊。桌上的一杯酒，輪下的離別愁。

    乙：這幸福時刻催化氛圍玉液瓊漿，在駕車時可能就是葬送幸福的罪惡毒汁。


    關於兩則標語的分析，下列敘述何者正確？'
  options:
  - label: A
    content: 均以財物損失的觀點勸人不要喝酒
  - label: B
    content: 均以諧音雙關說明酒駕後果
  - label: C
    content: 甲句告誡人飲酒應該淺嘗輒止
  - label: D
    content: 乙句由樂極生悲的結果達到警告效果。
- id: doc_113_高雄_英明_國文_g9s1e3_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 以下關於老殘遊記一書的簡介，何者正確？
  options:
  - label: A
    content: 老殘遊記是劉鶚以遊記形式寫成的筆記小說
  - label: B
    content: 主角老殘，別號鐵英，是位醫生，同時也是劉鶚的好友
  - label: C
    content: 內容藉老殘行醫各地的見聞，反映政治腐敗及民生疾苦
  - label: D
    content: 老殘遊記最擅長平鋪直述的描寫，用詞雖然毫無新意，但卻淺顯易懂。
  lesson_raw:
    number: 第7課
    title: 大明湖
    basis: 題幹提及《老殘遊記》（第7課《大明湖》出處）
- id: doc_113_高雄_英明_國文_g9s1e3_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: 根據大明湖的內容，下列選項中，哪一段話最能呈現風景壯闊之美？
  options:
  - label: A
    content: 正在嘆賞不絕，忽聽一聲漁唱，低頭看去，誰知那明湖業已澄淨得同鏡子一般。那千佛山的倒影映在湖裡，顯得明明白白
  - label: B
    content: 進了大門，正面便是鐵公享堂，朝東便是一個荷池。繞著曲折的迴廊，到了荷池東面，就是個圓門
  - label: C
