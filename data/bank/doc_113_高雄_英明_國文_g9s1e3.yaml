- id: doc_113_高雄_英明_國文_g9s1e3_s2_45
  section: 2
  number: 45
  type: single
  page: 6
  stem: 下列各句皆有省略主語，何者省略的主語不是樵者？
  options:
  - label: A
    content: 避入石穴中
  - label: B
    content: 輾轉內避
  - label: C
    content: 努力強入
  - label: D
    content: 不意蜿蜒數步。
  group_stem: '(六)

    有樵者，山行遇虎，避入石穴中，虎亦隨入。穴故嵌空而繚曲，輾轉內避，漸不容虎，而虎必欲搏樵者，努力強入。樵者窘迫，見旁一小竇(1)，僅足容身，遂蛇行而入。不意蜿蜒數步，忽睹天光，竟反出穴外。乃力運數石，窒虎退路，兩穴並聚柴以焚之，虎被燻灼，吼震岩谷，不食頃(2)，死矣。此事亦足為當止不止之戒也。
    (閱微草堂筆記)

    注釋：(1)竇：孔穴 (2)食頃：吃一頓飯的功夫，形容時間很短'
