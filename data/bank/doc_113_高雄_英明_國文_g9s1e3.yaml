    Tea」。

    傳統的英式下午茶是在下午三點半至四點半進行，矮桌上會十分講究地準備優質的紅茶，並隨茶附上奶罐，可隨個人喜好調成香醇的奶茶，並用專屬的三層架擺放各式各樣的精緻茶點，由下至上、由鹹至甜按照順序吃，點心佐好茶，享受不同風味與愜意。

    但對於一般人來說，要工作的下午並沒有悠閒的時光，只能在一天忙碌過後才有時間享用茶與茶點。他們多半是坐在家中廚房或飯廳裡享用，因此，比起貴族們使用的下午茶茶几，餐桌的高度相對比較高，所以稱為「High
    Tea」。不僅桌子高低差別，享用的心情也不大相同。當時晚餐一般在八點以後，而傍晚五點到七點下班收工時容易感到飢餓勞累，因此會吃一些較有飽足感的小食來加滿體力，其實也近似於晚餐，也因此Tea
    除了茶的意思，也是指傍晚五點到七點的一餐。

    (改自樂飲誌 午後的茶知識 英式下午茶不是High Tea)'
- id: doc_113_高雄_英明_國文_g9s1e3_s2_49
  section: 2
  number: 49
  type: single
  page: 7
  stem: 根據本文，下列哪一種方式無法消弭在生活中累積的忿怒？
  options:
  - label: A
    content: 試著理解忿怒無法扭轉不好的處境
  - label: B
    content: 盡量站在他人立場，體會對方的處境和想法
  - label: C
    content: 了解對方也有做不到的事，並接受現況
  - label: D
    content: 忍住忿怒的情緒，讓它隨時間漸漸地散去。
  group_stem: '(八)

    忿怒可以分很多層次，最輕的一端是出現在生活中累積的挫折不滿，最嚴重的另一端則是我們平常說的「抓狂」，所謂的自戀之怒。

    當周邊環境沒辦法符合期待時，我們會忿怒，不過所謂的修養是可以處理這些不如意的。修養可說是廣義的「同理心」——可以理解對方的處境，了解對方的有所不能。像塞車或是孩子賴床、不想上學都是莫可奈何的事，甚至是當然會發生的事，接受了這些存在也就少了一分的忿怒。除了這樣的同理心之外，其實當我們能理解忿怒對事情毫無助益，自然而然的，可以消弭對周邊人或事的不滿。

    另一種自戀之怒就不同了。每個人的心底深處都有根本且必要的安全感和尊嚴，一旦被碰觸到，就會引發近乎狂風暴雨的情緒。有人形容說，忿怒之火會把理智全燒光，指的正是這種自戀的忿怒，因為根本的尊嚴被傷到了，所以用幾近於崩潰的狀態來反撲。自戀之怒的殺傷力很強，不論是對自己或親密的人，都會造成傷害。

    事實上，我們如果理解自己在乎什麼，進一步再了解怎麼做才能達到改變時，就能從這樣的理解來開始行動。行動愈多，忿怒就會愈少。一再壓抑忿怒，忿怒並不會消失。

    (改自王浩威 忿怒。抑鬱的白雪公主)'
