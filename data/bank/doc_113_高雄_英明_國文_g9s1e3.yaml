- id: doc_113_高雄_英明_國文_g9s1e3_s2_47
  section: 2
  number: 47
  type: single
  page: 7
  stem: '根據本文，下列對於英國貴族階級喝下午茶的說明，何者正確？


    | | 文化稱呼 | 茶的調製 | 喝茶地點 | 茶點的安排 | 享用的心情 |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | (A) | High Tea | 自行處理 | 客廳 | 肉類冷盤 | 填飽肚子 |

    | (B) | High Tea | 專人服務 | 飯廳 | 麵包糕點 | 加滿體力 |

    | (C) | Low Tea | 自行處理 | 茶廳 | 頂層放水果塔 | 優雅愜意 |

    | (D) | Low Tea | 專人服務 | 廚房 | 下層放鹹點迷你三明治 | 等待晚餐 |'
  options:
  - label: A
    content: (A)
  - label: B
    content: (B)
  - label: C
    content: (C)
  - label: D
    content: (D)
  group_stem: '(七)

    一說到下午茶，總會聯想到裝扮優雅的女子，使用精緻的陶瓷茶杯、細細品飲每一口茶，氛圍充滿High-class 的氣息，因此，人們多半以為「High Tea」就是正統英式下午茶。

    然而，享用午茶的方式不只一種，其中可分為High Tea 與Low Tea，這樣的命名由來其實是源自桌子的高度，桌子高低的不同所呈現的下午茶文化也大不同。

    下午茶「Afternoon Tea」源自英國上流社會，而喝下午茶的地方通常是在客廳或專門招待客人的茶廳，有舒舒服服的扶手沙發椅坐著，為配合椅子的高度，放置茶與甜點的桌子也就相對較為低矮，所以又稱「Low
    Tea」。

    傳統的英式下午茶是在下午三點半至四點半進行，矮桌上會十分講究地準備優質的紅茶，並隨茶附上奶罐，可隨個人喜好調成香醇的奶茶，並用專屬的三層架擺放各式各樣的精緻茶點，由下至上、由鹹至甜按照順序吃，點心佐好茶，享受不同風味與愜意。

    但對於一般人來說，要工作的下午並沒有悠閒的時光，只能在一天忙碌過後才有時間享用茶與茶點。他們多半是坐在家中廚房或飯廳裡享用，因此，比起貴族們使用的下午茶茶几，餐桌的高度相對比較高，所以稱為「High
    Tea」。不僅桌子高低差別，享用的心情也不大相同。當時晚餐一般在八點以後，而傍晚五點到七點下班收工時容易感到飢餓勞累，因此會吃一些較有飽足感的小食來加滿體力，其實也近似於晚餐，也因此Tea
    除了茶的意思，也是指傍晚五點到七點的一餐。

    (改自樂飲誌 午後的茶知識 英式下午茶不是High Tea)'
