- id: doc_113_高雄_英明_國文_g9s1e3_s2_43
  section: 2
  number: 43
  type: single
  page: 6
  stem: 根據文意，下列段落排序何者最恰當？
  options:
  - label: A
    content: 乙→甲→丙
  - label: B
    content: 乙→丙→甲
  - label: C
    content: 丙→甲→乙
  - label: D
    content: 丙→乙→甲。
  group_stem: '(五)

    燒烤是古老的烹調，任憑時代流轉，始終盛行不衰，那種煙燻火炙的原始刺激，早已鑲嵌在我們的基因裡，現代人聞到烤肉香的衝動渴望，可能和遠古老祖宗沒什麼兩樣。

    【甲】 露天的明火燒烤，除了汙染空氣，讓我這種公寓小民深感苦惱，還大量消耗木炭，加速摧毀雨林，惡化溫室效應，至於那焦酥噴香的碳氫化合物更可怖，總之損人又不利己，非常之要命。

    【乙】 不過千百年來，我們的生存環境型態，已經幾度滄海桑田，原始燒烤和現代社會因而扞格矛盾，滋生出許多難題。

    【丙】 可是又那麼迷人。燒烤不僅為吃，更因為那氣氛情境，把我們帶回遠古的野地篝火，部落聚會共享獵物，歡慶戰功祭典，盡情吃喝恣意作樂，酒足肉飽後，在燦麗的星空下圍坐在營火邊，絮絮說故事和神話，綿綿引發奇幻的夢想。

    在那原始的人間煙火裡，沒有狹稠的城市，沒有環保和癌症，沒有破裂的臭氧層，唉，何等美好。

    (蔡珠兒 紅燜廚娘 火宅之人)'
