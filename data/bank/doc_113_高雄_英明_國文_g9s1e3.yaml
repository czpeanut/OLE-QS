  group_stem: '(二)

    小石城山記 柳宗元


    自西山道口徑北，踰黃茅嶺而下，有二道。其一西出，尋之無所得。其一少北而東，不過四十丈，土斷而川分，有積石橫當其垠。其上為睥睨梁欐之形，其旁出堡塢，有若門焉，窺之正黑，投以小石，洞然有水聲，其響之激越，良久乃已。環之可上，望甚遠。無土壤，而生嘉樹美箭，益奇而堅，其疏數偃仰，類智者所施設也。


    噫！吾疑造物者之有無久矣。及是愈以為誠有，又怪其不為之中洲，而列是夷狄，更千百年不得一售其伎，是故勞而無用，神者倘不宜如是，則其果無乎？或曰：「以慰夫賢而辱於此者。」或曰：「其氣之靈，不為偉人，而獨為是物。故楚之南，少人而多石。」是二者，予未信之。'
