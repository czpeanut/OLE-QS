- id: doc_113_高雄_英明_國文_g9s1e3_s2_41
  section: 2
  number: 41
  type: single
  page: 5
  stem: 根據本文可知，「咖啡館」對於作者有何影響？
  options:
  - label: A
    content: 咖啡館濃郁的香氣激發作者源源不絕的靈感
  - label: B
    content: 咖啡館公共的氛圍施加作者專心工作的壓力
  - label: C
    content: 咖啡館裡聚集的青年們攪亂作者平靜的思緒
  - label: D
    content: 咖啡館疏冷的時光淡化作者忙於工作的苦悶。
  group_stem: '(四)

    對我這樣習慣在家工作的人而言，咖啡館是常規的退路，是避難所，是不得已的短暫流亡。有時候是因為住家大樓或後巷子施工打牆，有時候是因為自己的屋子有意外狀況，但更多的時候其實是出自某種溫和的逼迫和鞭策——再這麼混下去實在不行，我得找個沒有閒書沒有床沒有冰箱的公共場所，以公眾的壓力約束自己，不胡亂上網，好好做事。


    我需要一張好桌子牢牢的鎮住我，我需要一方結界像透明膠囊那樣把自己閉鎖起來。


    可是我的運氣非常差，稍微熟一點的咖啡館都滿座，店老闆總以某種彬彬有禮的絕望和抱歉說，剛好……沒有位置了。這實在太像章回小說常見的情節，醫生診了脈，客氣有禮的對家屬說，這，就要看醫緣了。意思是，沒辦法，他救不了你，這是緣分。


    有次幾個認識多年的老朋友回臺灣，晚上九點約在某知名咖啡館。我曾聽聞那是文人聚集之地，售有幾種不錯的紅酒。那晚眾人大肆喧譁，非常不堪，直鬧到咖啡館打烊。之後我再也沒臉走進那家咖啡館了，正是一夜孽緣。


    我後來終於找到可固定長坐的咖啡館了。


    能找到它也是個緣分。去年和前輩相約，不巧就約在那個我不敢再去的孽緣館。因是前輩指定，我不敢說不，只好心中忐忑羞愧的赴約了。豈知到了門前，發現它當天歇業，我大喜，真是老天憐我。我們便轉進另外一條巷子，看見一清亮的前院和落地大窗，裡面空落落幾張大桌，燈光明亮，一隻大白狗趴著。前輩說：「咦，上星期經過都還沒有這家店呢。」噢，我們何其幸運，遇上新的咖啡館。


    還有什麼比新的咖啡館更令人期待的呢，這比新鑄的錢幣或美麗的少女更清新可喜。它輕易就賦予城市生活一點生氣和希望，它等著我們將生命浪費給它，等著我們消磨它，以話語、文字、咖啡渣和麵包屑灑它、滋養它；它還沒有歷史，還沒有任何一只杯子或夢想在這裡打破，還沒有磨損任何靠墊和青春。它像剛出爐的馬德連小甜餅，只有飽滿的未知和好奇的香氣，它很願意喚起或成為任何人的—部分。


    我便推門進去。它的光線、音樂和桌椅的高度都剛好，桌椅厚實沉重不是夾板而是實木。它非常寬敞，很大器的閒置空間。咖啡上來之後我就知道，是了是了就是它了，這是我一直在找的地方。它的咖啡特別濃釅，正合我意。


    幾個大雨刷白的午後，安然坐在靠窗的桌邊看水花四濺，無聊又平靜。午後在咖啡店內閒閒張望的心情，事不干己的看往來路人，一段都市裡無謂、疏冷、清淡而簡單的時光。

    (柯裕棻 咖啡館)'
