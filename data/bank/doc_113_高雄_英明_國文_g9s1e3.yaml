- id: doc_113_高雄_英明_國文_g9s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 「缺月掛疏桐，漏斷人初靜。誰見幽人獨往來？縹緲孤鴻影。 驚起卻回頭，有恨無人省。揀盡寒枝不肯棲，寂寞沙洲冷。」(蘇軾 卜算子) 下列關於這闋詞的解析，何者有誤？
  options:
  - label: A
    content: 下片三、四句表現高潔自許及不與世俗同流的精神
  - label: B
    content: 上片三、四句指自己形單影隻，猶如飄忽不定的孤雁身影
  - label: C
    content: 下片一、二句表達自己內心充滿憂恨而無人能理解
  - label: D
    content: 全詞借孤雁為喻，表達被貶後泰然自若的心境。
  lesson_raw:
    number: 自學選文一
    title: 蘇東坡突圍
    basis: 引用《蘇東坡突圍》提及之蘇軾詞作
- id: doc_113_高雄_英明_國文_g9s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 「莫聽穿林打葉聲，何妨吟嘯且徐行。竹杖芒鞋輕勝馬，誰怕？一蓑煙雨任平生。 料峭春風吹酒醒，微冷，山頭斜照卻相迎。回首向來蕭瑟處，歸去，也無風雨也無晴。」(蘇軾
    定風波) 關於本闋詞的文意說明，下列敘述何者有誤？
  options:
  - label: A
    content: 「回首向來蕭瑟處，歸去，也無風雨也無晴」隱含蘇軾經歷人生風雨後，心境已昇華到忘懷得失的境地
  - label: B
    content: 「莫聽穿林打葉聲，何妨吟嘯且徐行」的「莫聽」、「吟嘯」，隱含作者坦然面對人生橫逆的豪情
  - label: C
    content: 「誰怕？一蓑煙雨任平生」由其中的「蓑」可知蘇軾具有「未雨綢繆」的智慧
  - label: D
    content: 「竹杖芒鞋輕勝馬」意謂只有拄著竹杖，穿著草鞋，走在雨中泥地都比騎馬還輕快。
  lesson_raw:
    number: 自學選文一
    title: 蘇東坡突圍
    basis: 引用《蘇東坡突圍》提及之蘇軾詞作
- id: doc_113_高雄_英明_國文_g9s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 以下是同學們在考前複習到和蘇軾相關的內容，請問敘述中何者有誤？
  options:
  - label: A
    content: 廷廷：屬於唐宋古文八大家之一，其他七人為韓愈、柳宗元、歐陽脩、曾鞏、王安石和蘇洵、蘇轍
  - label: B
    content: 阿竣：蘇軾才氣縱橫，學識淵博，散文、詩詞、書畫俱佳，他的寒食帖有「天下行書第三」的美譽
  - label: C
    content: 小池：可憐的蘇軾仕途坎坷，一生中歷經了許多次的貶謫，先後被貶到黃州、惠州、廣州三個地方
  - label: D
    content: 鵬鵬：蘇軾無論在寫詩或寫詞上，都有著豪放的風格顯現於作品中，更藉由此風格提高了宋詞的境界。
  lesson_raw:
    number: 自學選文一
    title: 蘇東坡突圍
    basis: 考察蘇軾文學常識與生平
- id: doc_113_高雄_英明_國文_g9s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 「風雪中的紐約州，華航在世界日報刊登巨幅廣告：『別人吃火雞，我們回家吃湯圓。』豔紅圓仔閃著溫潤光澤，我彷彿回到昏黃燈光下，家人歡聚搓湯圓的情景。我痴望藍天：搭上飛機，就可以回家。」根據這段文字流露的心情，與下列何者最相近？
  options:
  - label: A
    content: 洛陽親友如相問，一片冰心在玉壺
  - label: B
    content: 故園東望路漫漫，雙袖龍鍾淚不乾
  - label: C
    content: 忽見陌頭楊柳色，悔教夫婿覓封侯
  - label: D
    content: 醉臥沙場君莫笑，古來征戰幾人回。
- id: doc_113_高雄_英明_國文_g9s1e3_s1_15
  section: 1
  number: 15
