  - label: C
    content: 引用蘇東坡詞句，表達他雖處困厄卻不願隨俗的堅持
  - label: D
    content: 文末連用排比句詮釋所謂的「成熟」，節奏明快、鏗鏘有力。
  lesson_raw:
    number: 自學選文一
    title: 蘇東坡突圍
    basis: 題幹提及課名「蘇東坡突圍」
