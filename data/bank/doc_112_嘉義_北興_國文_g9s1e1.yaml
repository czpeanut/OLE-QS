  stem: 根據本文，關於「銀桂」與「金桂」的說明，下列何者正確？
  options:
  - label: A
    content: 就花色而言銀桂較鮮明
  - label: B
    content: 就香味而言，金桂較濃郁
  - label: C
    content: 作者的父親對銀桂的評價比較高
  - label: D
    content: 作者本身更喜愛可吃的金桂。
  group_stem: '桂花有銀桂、金桂二種。銀桂又名木樨，是一年到頭月月開的，所以也稱為月月桂。花是淡黃色的，開得稀稀落落的幾撮，深藏綠葉之中，散發著淡淡的清香，似有若無。


    老屋正廳庭院中與書房窗外各有一株。父親於誦經吟詩之後，總喜歡命我端把藤椅坐在走廊上，聞聞木樨的清香，說是有清心醒脾之功。所以銀桂的香味在我心中留下特別深刻的印象。在台北時，附近巷子裡有一家院牆裡有一株，輕風送來香味時，就會逗起我思念故鄉與親人。


    與銀桂完全不同的是金桂，開的季節卻是中秋前後。金黃色的花，成串成球，非常茂密，與深綠色的葉子相映照，顯得很壯觀。但開得快，謝得也快。一大陣秋雨，就紛紛零落了。


    母親不像父親那樣，她可沒空閒端把椅子坐下來聞桂花香，她關心的是金桂何時盛開，瀟秋雨，何時將至。母親稱之為秋霖，總要搶在秋霖之前搖下來才新鮮。因為一被雨水淋過，花香就消失了。不像銀桂，雨打也不容易零落，隔天太陽一照，香氣又恢復了。


    所以父親說木樨是堅忍的君子，耐得起風雨；金桂是趕熱鬧的小人，早盛早衰。母親卻不願委屈金桂，她說銀桂是給你聞的，金桂是給你吃的，不是一樣的好嗎？什麼君子小人的？！


    琦君〈桂花滷．桂花茶〉'
  tags:
    textbook: 第五冊（九上）第1次段考範圍
    labeled_by: ai
