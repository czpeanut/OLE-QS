  stem: 由文中「一路秋山紅葉，老圃黃花」點出作者遊大明湖「季節」，與下列何者的季節相同?
  options:
  - label: A
    content: 清明時節雨紛紛，路上行人欲斷魂
  - label: B
    content: 黃梅時節，江南細雨淅淅瀝瀝
  - label: C
    content: 金風玉露一相逢，便勝卻人生無數
  - label: D
    content: 鶴唳中天寒夜月，猿啼溪畔朔風時。
  group_stem: '老殘動身上車，一路秋山紅葉，老圃黃花，頗不寂寞。到了濟南府，進得城來，家家泉水，戶戶垂楊，比那江南風景，覺得更為有趣。


    到了小布政司街，覓了一家客店，名叫高陞店，將行李卸下，開發了車價酒錢，胡亂吃點晚飯，也就睡了。


    次日清晨起來，吃點兒點心，便搖著串鈴，滿街踅了一趟，虛應一應故事。午後便步行至鵲華橋邊，僱了一隻小船，盪起雙槳，朝北不遠，便到歷下亭前。下船進去，入了大門，便是一個亭子，油漆已大半剝蝕。亭子上懸了一副對聯，寫的是：「歷下此亭古，濟南名士多。」上寫著「杜工部句」，下寫著「道州何紹基書」。亭子旁邊，雖有幾間房屋，也沒有甚麼意思。


    復行上船，向西盪去，不甚遠，又到了鐵公祠畔，你道鐵公是誰？就是明初與燕王為難的那個鐵鉉。後人敬他的忠義，所以至今春秋時節，土人尚不斷的來此進香。——到了鐵公祠前，朝南一望，只見對面千佛山上，梵宇僧樓，與那蒼松翠柏，高下相間；紅的火紅，白的雪白，青的靛青，綠的碧綠；更有一株半株的丹楓，夾在裏面，彷彿宋人趙千里的一幅大畫，做了一架數十里長的屏風。


    選自劉鶚老殘遊記'
