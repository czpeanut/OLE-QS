  section: 1
  number: 11
  type: single
  page: 2
  stem: 若人民對政府行政作為有疑慮時，可以透過大法官審議法律是否違憲。先前連續 5 次闖關失敗的《憲法訴訟法》終於在 107 年底三讀通過，正式施行之後，大法官在處理違憲案件時採法庭形式，當事人可以到場陳述自己的意見，審理過程變得透明化，人民權益因而獲得更大保障。請問：文中提及人民要求審議法律，在憲政精神的實踐上，應該如何理解？
  options:
  - label: A
    content: 政府具有管理公共事務的權力，是基於君權至上的精神
  - label: B
