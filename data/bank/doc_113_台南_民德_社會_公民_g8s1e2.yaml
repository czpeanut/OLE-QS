- id: doc_113_台南_民德_社會_公民_g8s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: '艾克頓爵士曾言：「絕對的權力，會造成絕對的腐化」，因此，分權制衡是現代民主政治的內涵之一。著名的分權理論有二：  三權分立與五權分立。請問：下列何者正確？

    (甲) 三權分立 → 孫中山提出；五權分立 → 孟德斯鳩提出

    (乙) 將監察權從立法權中獨立出來，可以杜絕國會專制

    (丙) 三權分立→分權制衡；五權分立→分權制衡

    (丁) 將考試權從行政權獨立出來，容易造成行政權萎縮、權力受限'
