  stem: （ ）觀察(地理圖一)，切．格瓦拉所經過的路線中，甲乙丙丁依序會見到何種景致？
  options:
  - label: A
    content: 草原—沙漠—雨林—梯田
  - label: B
    content: 梯田—草原—沙漠—雨林
  - label: C
    content: 雨林—梯田—草原—沙漠
  - label: D
    content: 草原—沙漠—梯田—雨林。(習作)
  group_stem: '◎請閱讀文章後，回答下列問題：

    切．格瓦拉（1928～1967 年），出生於阿根廷，為著名的革命者。他大學攻讀醫學系時，與友人騎著摩托車遊歷中南美洲。兩人從故鄉阿根廷出發，途經智利、秘魯、哥倫比亞與委內瑞拉等國。他在旅途過程中目睹各種社會不平等待遇，體會到中南美洲國家在世界的處境，也留下他日後發動革命的契機。'
  shared_asset: g1_1_3
  answer:
  - D
  answer_source: answer_key_vlm
