  - label: D
    content: 反法聯軍
  group_stem: '以下文章摘錄自法國作家都德（Alphonse Daudet）所寫的最後一課（The Last Class），描述發生於亞爾薩斯和洛林一間法國學校的故事。請閱讀並回答第31～32題：

    1870年的某一天，韓麥爾先生說：「我的孩子們，柏林已經來了命令，亞爾薩斯和洛林的學校以後只准教德語。新老師明天就到。今天是你們最後一堂法語課，我希望你們多多用心學習。」

    韓麥爾先生說法語是世界上最美的語言，最清晰，最合理輯；又說，我們必須把它記在心裡，永遠別忘了它。那一天，韓麥爾先生發給我們新的字帖，字帖上都是美麗的圓體字：「法蘭西」、「亞爾薩斯」、「法蘭西」、「亞爾薩斯」。

    忽然教堂的鐘敲了十二下。「我的朋友們，」韓麥爾先生說，「我……我……」他哽咽了，他說不下去了。他轉身朝著黑板，使出全身的力量，寫了幾個大字：「法蘭西萬歲！」然後他頭靠著牆壁，話也不說，只向我們做了一個手勢：「放學了……你們走吧。」'
