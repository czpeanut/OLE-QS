  section: 1
  number: 9
  type: single
  page: 1
  stem: 明華在平日需經由國道高速公路開車前往上班地點，若晚上下班到家時，他發現今日在高速公路開車總共累積了 60 公里，請問明華在這一天需繳交多少元的通行費？
  options:
  - label: A
    content: 24 元
  - label: B
    content: 36 元
  - label: C
    content: 48 元
  - label: D
    content: 54 元
  group_stem: '※請閱讀下列敘述後，回答第9題和第10題


    高速公路的養護經費是依「取之於路、用之於路」原則，藉由開徵「通行費」，並撥用部分「汽車燃料使用費」，將此作為高速公路財務的來源。明華查詢到國道高速公路的收費分成一般時段、連續假期兩種時段，以不同方式計費，如下表所示。已知
    $x$ 表示當日行駛總里程(公里)，$y$ 表示通行費(元)，且 $y$ 與 $x$ 成線型函數關係，其圖形如右圖所示，其中直線 A 和直線 B 分別代表一般時段和連續假期兩種時段的通行費率。


    | 一般時段 | 如果是一般平日或假日，也就是非連續假期的時段，收費費率採「每日每車優惠里程 20 公里」。 |

    | 連續假期 | 如果碰到連續假期，國道採用單一費率計算，取消 20 公里優惠與長途優惠里程。 |'
