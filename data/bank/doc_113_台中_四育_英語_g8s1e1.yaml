- id: doc_113_台中_四育_英語_g8s1e1_s5_8
  section: 5
  number: 8
  type: single
  page: 4
  stem: 8. What did Cody mainly talk about in the postcard to Jamie?
  options:
  - label: A
    content: Street food.
  - label: B
    content: British English.
  - label: C
    content: People in Britain.
  - label: D
    content: The traffic in Britain.
  group_stem: "(C)\nDear Jamie,\n  How are you doing? My family and I are in Britain\
    \ now. We visited many places and ate a lot of food. It was fun. People in Britain\
    \ speak English, so I can practice English. But, I can’t understand them sometimes.\
    \ It’s not because my English is not good, but because people here speak English\
    \ in a strange way. You know, we all learn American English in Taiwan, but in\
    \ Britain, they don’t really speak that way. For example, Americans say candy\
    \ and cookies, but British people say sweets and biscuits. When I ordered cookies\
    \ in a shop, the clerk said to me, \"What do you mean? We only sell biscuits here.\"\
    \ When I said to an old lady on the street, \"Where’s the metro? Can you show\
    \ me the way? \"She couldn’t understand the meaning of metro because people here\
    \ call it “tube.” Anyway, American English is really different from British English.\n\
    How was your trip to Australia? Did you have a good time there? See you soon.\n\
    Your friend, Cody\nBritain 英國for example 例如British 英國的meaning 意思mainly 主要地"
