- id: doc_113_高雄_七賢_數學_g8s1e1_s3_1
  section: 3
  number: 1
  type: calc
  page: 2
  stem: '都市裡建築物林立，如果建築物之間不強制預留空間，採光及通風就會受到影響，也會產生嚴重的空間壓迫感及日照不足，甚至還有消防、地震安全的疑慮，對於都市的景觀與規畫更是一大破壞，所以政府執行都市計畫時都會實施建蔽率(建蔽率$=\frac{\text{建築投影面積}}{\text{基地面積}}$)的管制，如圖
    1。

    若某地將被開發為社區住宅，該建案的賣點為中庭花園，圖 2 是該建案的平面設計圖的簡化版本，其中斜線面積即為建築投影面積，已知基地為邊長 100 公尺的正方形，住宅建築外圍為邊長
    92.5 公尺的正方形，花園為邊長 57.5 公尺的正方形，若政府規定此地建蔽率不可高於 50%，試回答下列問題：

    (1) 計算建築投影面積為多少平方公尺？

    (2) 承(1)，請你幫忙檢查，該建案的設計有沒有違反建蔽率的規定。(沒有算式不給分)？'
