- id: doc_113_台北_仁愛_社會_公民_g8s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 公共意見能影響政府的施政，在民主政治中扮演重要的角色。就公共意見的意義來看，下列敘述何者正確？
  options:
  - label: A
    content: 公共意見是指多數人的意見，因此是超過半數以上民眾的共識
  - label: B
    content: 公共意見必須由政黨匯集民眾的意見才能形成，並具備公信力
  - label: C
    content: 民主社會中公共意見是多元的，因此可以和國家公共事務無關
  - label: D
    content: 公共意見屬於民眾公開表達的意見，也是個人言論自由的展現
  tags:
