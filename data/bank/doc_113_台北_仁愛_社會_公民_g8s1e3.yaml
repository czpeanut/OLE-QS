  section: 2
  number: 15
  type: single
  page: 2
  stem: '死刑到底該不該廢除，一直備受爭議，下表是我國民眾對此議題的意見：

    | 項目 | 理由 |

    |---|---|

    | 反對廢除死刑 | 1.如果不處死，可能再次危害社會<br>2.安撫被害人或親屬的不平 |

    | 贊成廢除死刑 | 1.國家應保障生命權，不能剝奪生命<br>2.犯罪者可用勞務收益賠償被害人，更加有利 |

    根據表中訊息判斷，民眾對於死刑存廢的公共意見，具有下列何種特性？'
  options:
  - label: A
    content: 我國民眾對此一議題的看法，具有複雜性
  - label: B
    content: 民眾對死刑存廢的意見具有變動性
  - label: C
    content: 可以從表中的不同意見歸納出民眾對此議題建立漸趨一致的共識
  - label: D
    content: 可得知支持者與反對者之間的看法已形成影響性。
