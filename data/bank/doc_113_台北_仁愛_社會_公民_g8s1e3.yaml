  section: 2
  number: 14
  type: single
  page: 2
  stem: '公民課時，老師介紹政黨與利益團體的差異，並作了比較分析表，附表為小仁抄寫的內容，其中哪一個項目完全正確？

    | | 政黨 | 利益團體 |

    |---|---|---|

    | (A)成立目的 | 影響政府政策 | 取得執政權 |

    | (B)關注議題 | 較單一 | 較多元 |

    | (C)參與途徑 | 陳情遊說 | 推派候選人 |

    | (D)舉例 | 人民最大黨 | 台北市導遊職業工會 |'
  options:
  - label: A
    content: 成立目的：政黨 影響政府政策，利益團體 取得執政權
  - label: B
    content: 關注議題：政黨 較單一，利益團體 較多元
  - label: C
    content: 參與途徑：政黨 陳情遊說，利益團體 推派候選人
  - label: D
    content: 舉例：政黨 人民最大黨，利益團體 台北市導遊職業工會
