  - label: D
    content: 不穩定性、議題性
  group_stem: '西元2014 年桃園市觀音海邊設立藻礁群野生動物保護區，近期因政府拋出觀塘天然氣接收站環評過關，讓長期備受到關注的藻礁環保議題引發熱議。環保團體控訴，藻礁保育應求完整範圍，不認為官方提出的方案能完全迴避影響生態。下列為各方的意見陳述：

    甲學者：桃園藻礁歷經7000 年才形成，是珍貴的自然資源，也引來稀罕的白海豚出沒，此種自然遺產應該要保留給後代子孫，天然氣接收站的工程會導致飄沙淹沒藻礁。

    乙民眾：在核能發電廠陸續除役後，需要尋找階段性的替代能源，燃氣比燃煤減少一半的碳排放，所以我們需要天然氣接收站來提供足夠電力，才能發展經濟。

    丙政黨：電力來源可評估納入太陽能風力等再生能源支應，自然資源的可貴與民眾的用電需求不必然衝突，政府應仔細評估接收站的必要性與對環境的衝擊是需要的。'
