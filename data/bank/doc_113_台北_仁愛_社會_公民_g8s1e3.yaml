  group_stem: '《總統副總統選舉罷免法》與《公職人員選舉罷免法》原本規定受監護宣告者無選舉權，民國112 年修法刪除該規定，民國113 年總統大選，全台共有兩千多名受宣告監護人首度行使投票權。身心障礙聯盟秘書長表示，很多受監護宣告的當事人仍有意識，應該開放受監護宣告者也有投票權，這樣可讓候選人重視身心障礙者的處境，進一步保障其權利。

    此外，精神障礙者可能因為沒有辦法控制自己的情緒而亂花錢，任意消耗自己的財產，因此他必須接受監護宣告，但這並非表示他不知道自己想要投給哪個候選人，或是不知道哪個候選人的政策對他是好的，思考政治的事情跟思考自身的財務事情，是兩個完全不同層次的事，應該給予他們對公共事務的表達權利。'
