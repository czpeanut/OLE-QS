- id: doc_113_台北_仁愛_社會_公民_g8s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '同學們正在討論「民主國家的政府在制定政策前，為什麼必須以舉辦座談會或公聽會等方式，和民眾溝通與協調政策的內容？」之問題。下列哪些人的發言可以作為上述問題的答案？

    奈奈：適時調整政策內容以符合民眾的意見，作為推動政策的依據。小希：在會議中向多數民眾宣導政策理念，並呼籲應該支持執政者。 小愛：了解不同民眾的想法與需求，並且盡力調和不同族群的利益。瑞瑞：希望增加民眾對政策的認識，藉以形成支持政策的公共意見。'
  options:
  - label: A
    content: 奈奈、小希、小愛
  - label: B
    content: 小希、小愛、瑞瑞
  - label: C
    content: 奈奈、小愛、瑞瑞
  - label: D
    content: 奈奈、小希、瑞瑞
