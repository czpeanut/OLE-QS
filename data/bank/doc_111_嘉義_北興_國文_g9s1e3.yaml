  stem: 上述文章片段中，作者心聲中所流露的是下列何者？
  options:
  - label: A
    content: 作者父母戰亂後回到故鄉，藉著在過年時祭祀來表達感恩
  - label: B
    content: 作者父母飽經戰亂流離，禁不起一丁點迷信禁忌帶來的恐懼
  - label: C
    content: 儘管時代變遷，慎重過年仍是每一代的共同回憶
  - label: D
    content: 作者感到辛酸與悲哀，因為父母平常得囤積食物才能心安。
  group_stem: 遠離故土的父母親，在異地暫時安頓好簡陋的居處，稍稍歇息了久經戰亂的恐懼不安，稍稍減低一點離散、飢餓、流亡的陰影，他們對於過年的慎重，他們許多看來迷信的禁忌，他們對食物刻意豐盛的儲備，今天看來，似乎都隱含著不可言說的辛酸與悲哀。
