- id: doc_111_嘉義_北興_國文_g9s1e3_s3_26
  section: 3
  number: 26
  type: single
  page: 3
  stem: 這篇文章最有可能的標題是下列何者？
  options:
  - label: A
    content: 搞笑藝人之突擊你家垃圾桶！
  - label: B
    content: 倒垃圾好吃驚！
  - label: C
    content: 那些垃圾教我的事
  - label: D
    content: 從垃圾看你的流年運勢。
  group_stem: 原來從垃圾袋也可以看出一戶家庭的經濟狀況！日本「最有名的清潔員」、同時也是搞笑藝人的瀧澤秀一表示，透過他的長期觀察，發現窮人家和有錢人家的垃圾袋有幾點差別，讓清潔員可以一眼看出這個人的貧窮是習慣所致。首先，貧窮人家的垃圾袋中經常發現一些發票或零錢，不論是不知情還是明明看到卻懶得撿起來，都經常發生在窮人身上；反觀有錢人明明更有本錢揮霍，卻不會糟蹋有價值的物品。其次，窮人家丟的經常是超商付費買的袋子，且很多垃圾都是超商食品。瀧澤表示超商食品通常較貴，精打細算的人會選擇去超市及賣場購買，窮人則沒有這種觀念，更何況丟的還是要額外付費買的購物袋，可見他們毫無省錢規劃。最後瀧澤指出，窮人經常倒垃圾一丟就是好幾袋，感覺是囤積很久的垃圾，顯示出他的生活習慣繁忙，或是拖延懶得清理。反觀有錢人垃圾都會整理好，定時定點的傾倒，不會讓垃圾囤積太久，就是兩者之間的差別。    （網路新聞改寫）
  tags:
    textbook: 第五冊（九上）第3次段考範圍
    labeled_by: ai
    chapter:
      publisher: null
      book: 九上
      subject: 國文
      code: null
      title: null
      chapter: null
- id: doc_111_嘉義_北興_國文_g9s1e3_s3_27
  section: 3
  number: 27
  type: single
  page: 3
  stem: 從這篇文章我們可以知道哪些正確資訊？
  options:
  - label: A
    content: 作者從清潔員轉職後成為搞笑藝人出道
  - label: B
    content: 用超商購物袋當垃圾袋省錢又環保
  - label: C
    content: 有錢人常常比你更精打細算
  - label: D
    content: 有錢人家有清潔人員幫忙整理垃圾。
  group_stem: 原來從垃圾袋也可以看出一戶家庭的經濟狀況！日本「最有名的清潔員」、同時也是搞笑藝人的瀧澤秀一表示，透過他的長期觀察，發現窮人家和有錢人家的垃圾袋有幾點差別，讓清潔員可以一眼看出這個人的貧窮是習慣所致。首先，貧窮人家的垃圾袋中經常發現一些發票或零錢，不論是不知情還是明明看到卻懶得撿起來，都經常發生在窮人身上；反觀有錢人明明更有本錢揮霍，卻不會糟蹋有價值的物品。其次，窮人家丟的經常是超商付費買的袋子，且很多垃圾都是超商食品。瀧澤表示超商食品通常較貴，精打細算的人會選擇去超市及賣場購買，窮人則沒有這種觀念，更何況丟的還是要額外付費買的購物袋，可見他們毫無省錢規劃。最後瀧澤指出，窮人經常倒垃圾一丟就是好幾袋，感覺是囤積很久的垃圾，顯示出他的生活習慣繁忙，或是拖延懶得清理。反觀有錢人垃圾都會整理好，定時定點的傾倒，不會讓垃圾囤積太久，就是兩者之間的差別。    （網路新聞改寫）
