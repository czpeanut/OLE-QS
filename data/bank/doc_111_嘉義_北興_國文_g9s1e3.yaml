    \ 年世界盃、及15、16 年美洲盃連三年屈居亞軍，阿根廷國人對梅西的不滿鋪天蓋地而來，不但聚眾街頭燒毀國家隊10 號球衣，破壞他的雕像，還指責他遠赴西班牙聯賽為職業隊贏取所有榮耀，卻不願為國犧牲奉獻，從未替國家拿下任何一項冠軍。阿根廷人無視梅西在國家隊時，因為陣容缺陷，讓出了原本最具攻擊威脅性的前鋒角色，改任不擅長的組織中場位置，他為了球隊獲勝而配合團隊，在場上來回奔波而耗盡精力，在體力不支而趴地嘔吐時，還得備受質疑，指責他在球場上散步。阿根廷人總愛拿同樣穿著10\
    \ 號球衣的馬拉度納來挑剔梅西過於溫和，說他不夠狂野、不夠奔放、不夠「Pibe」，意味著不夠「阿根廷」，他們懷念的民族英雄，是在數億人觀看的1986 年世足賽八強戰，靠著一己之力獨演「上帝之手」及「世紀最佳進球」，將死敵英格蘭淘汰出局的小巨人，因為馬拉度納，阿根廷人在1982\
    \ 年福克蘭群島戰役慘敗於英國後，舉國的低迷終於有了情緒宣洩的出口。他們奉性格粗野、脾氣暴躁又常身陷醜聞的馬拉度納為神明，因為他在1986 年世足決賽後高舉大力神盃。阿根廷人嫌棄梅西，卻忘記馬拉度納本人欽點，不論在身材或是球技上，梅西都是最肖似他的接班人。\
    \ \n    2016 年美洲盃再度失利，梅西心灰意冷宣布退出國家隊，阿根廷人這才驚覺大勢不妙，在總統馬克里的帶領下，發起了挽留梅西重回國家隊的運動，舉國重新省思是否過分依賴，而非助他突破困境。曾經失去了最強球星後，阿根廷隊試圖靠著其他球員突破重圍，企圖再現往日足球霸權。然而梅西缺席的賽程裡，他們甚至無法取得2018\
    \ 年世界盃的出賽權，差點中斷世界盃的連續出場紀錄，最後還是靠著當時31歲的梅西隊長挺身而出，在攸關晉級的厄瓜多之戰，連進三球大演帽子戲法，逆轉得以參加俄羅斯世足賽。只不過當年幸運女神仍未眷顧，阿根廷在十六強賽早早遇上兵強馬壯的冠軍法國隊，以三比四遭到淘汰。這一次，阿根廷人終於不再責怪梅西。世足賽再次失利，昔日隊友斯卡洛尼走馬上任擔任國家隊總教練，一改過去「看梅西如何解決困境」的風氣，全力組建一支新世代的年輕球隊，這批新隊友，幾乎都視梅西為偶像，從小看著他踢球而長大，前鋒阿瓦雷茲12\
    \ 歲時與他合照過，中場費南德茲15 歲時曾寫信求他重披藍白條紋戰袍，守門員馬丁尼茲甚至表示願意奉獻生命，只盼能為梅西帶回完美足球生涯的最後一塊拼圖——世界盃冠軍。\
    \ \n    成功整合年輕一代與中生代迪巴拉、老將迪馬利亞等人後，全隊凝聚一心，努力獲得了回報。年輕小將們秉持信念，讓梅西保留體力在組織進攻上展現創意，他們則奮力衝搶防守，只為了將球傳給在中前場「漫遊」的老大哥發揮。阿根廷在2021年終於贏得美洲盃冠軍，梅西在奪得國家隊首冠後淚灑球場。2022年則是梅西第五度參與世界盃，也是他在這戰場的最後一舞，儘管阿根廷小組賽第一場就爆冷輸給沙烏地阿拉伯，但全隊將士用命，背水一戰連勝六場，決賽擊敗企圖衛冕的法國隊，在睽違36年後，第三次將冠軍獎盃獻給阿根廷。今後阿根廷戰袍上將多標記上一顆冠軍之星，為藍白條紋的代表性10號球衣，再添一頁傳奇的篇章。"
