- id: doc_111_嘉義_北興_國文_g9s1e3_s3_23
  section: 3
  number: 23
  type: single
  page: 3
  stem: 「山川之美，古來共談。高峰入雲，清澈見底。兩岸石壁，五色交輝。青林翠竹，四時俱備。曉霧將歇，猿鳥亂鳴；夕日欲頹，沉鱗競躍，實是欲界之仙都，自康樂以來，未復有能與其奇者。」（陶弘景〈答謝中書書〉）關於這段文字的理解，請選出正確的敘述。
  options:
  - label: A
    content: 是一封以山水之樂回覆友人的書信
  - label: B
    content: 指出白天四個時辰之內，能夠欣賞樹叢竹林的各種姿態
  - label: C
    content: 同時觀賞魚兒競躍與聆聽猿啼鳥囀，讓人心曠神怡
  - label: D
    content: 文末感嘆謝康樂雖來此遊樂，卻不能領略山水之美，尤為可惜。
  lesson_raw:
    title: 答謝中書書
    basis: 引用陶弘景〈答謝中書書〉全文
