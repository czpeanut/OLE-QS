- id: doc_111_嘉義_北興_國文_g9s1e3_s3_25
  section: 3
  number: 25
  type: single
  page: 3
  stem: 梁實秋曾說：「要翻譯《莎士比亞全集》必須具備三個條件。第一，他必須沒有學問。如有學問，他就去做研究、考證的工作了。第二，他必須不是天才。如是天才，他就去做寫小說、詩和戲劇等創意工作了。第三，他必須能活得相當久，否則就無法譯完。很僥倖，這三個條件我都具備，所以我才完成了這部巨著的翻譯。」這一段話告訴我們什麼？
  options:
  - label: A
    content: 梁實秋自謙無才無學，只是馬齒徒長活得比較久
  - label: B
    content: 沒有學問的人可以去做研究考證的工作
  - label: C
    content: 寫小說、戲劇的難度凌駕於研究考證與翻譯
  - label: D
    content: 翻譯《莎士比亞全集》需要學問與天才才能維持不輟。
