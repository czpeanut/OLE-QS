- id: doc_111_嘉義_北興_國文_g9s1e3_s3_29
  section: 3
  number: 29
  type: single
  page: 3
  stem: 關於這篇文章的內容解讀，請選出正確者
  options:
  - label: A
    content: 慎終追遠的觀念已然陳腐，應該隨舊時代淘汰
  - label: B
    content: 近幾年葬禮習俗以將骨灰罈納入靈骨塔為主流
  - label: C
    content: 環保自然葬的優點在於早日廢除清明掃墓的繁文縟節
  - label: D
    content: 先人樹葬後可以將辦喪事的錢省下來購買土地。
  group_stem: "清明掃墓的隨想    李偉文 \n    慎終追遠是美好的傳統，但是隨著時代變遷，有家族墓園的家庭愈來愈少，就像以前講「入土為安」，但是現代人已經沒有多少人在用土葬，幾乎全改成火化入塔，甚至這幾年從政府到民間開始推動環保自然葬、也就是將骨灰回歸大地，不管是在公墓內的樹葬、花葬、灑葬或者在一般林園裡的植存，乃至於將骨灰撒入海洋的海葬，年年幾乎倍數成長。\
    \ \n    雖然在清明連假前，早早就跟親戚們約好掃墓時間，但是對於我們這一代自身的葬禮，倒是跟孩子們講了，要用環保自然葬的方式，甚至我還想約集喜好大自然的朋友，把辦葬禮的錢省下來，一起合買一塊自然棲地，只要把地買下來當樹葬園區，當地就不會開發，就能為後代子孫留住一塊美麗的大地。"
