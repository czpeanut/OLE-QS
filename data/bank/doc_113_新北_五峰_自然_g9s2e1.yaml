- id: doc_113_新北_五峰_自然_g9s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: '關於氣團的發展條件和性質，以下敘述正確的有哪些？

    (甲)在水平方向上氣溫和氣壓均勻相似的一大團空氣

    (乙)需長期停留在廣大平坦且地形單純的區域發展

    (丙)氣壓值越高的氣團，代表空氣越冷

    (丁)臺灣夏季盛行西南季風主要是太平洋暖氣團所致

    (戊)梅雨季節源自冷、暖氣團互相抗衡所致'
