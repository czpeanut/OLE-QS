  section: 5
  number: 1
  type: fill
  page: 1
  stem: '大雄上課打瞌睡，漏抄了一部分〈愛蓮說〉的課堂筆記，請幫他補上缺漏的部分：


    | 出處 | 《周濂溪先生全集》 | 藉本文說明喜愛蓮花的原因 |

    | --- | --- | --- |

    | 作者 | 北宋 周敦頤 | 開創了融合佛、道思想的儒學，被尊為宋代【 1 】之祖 |

    | 重點摘要 | 蓮的特質和君子品格相通，如：不受惡劣環境影響，能潔身自愛 | 對照原文：予獨愛蓮之【 2 】 |

    |  | 以三種花象徵三種人格特質 | 對照原文：【 3 】；【 4 】；【 5 】。<br>(需依序作答，寫出包含花朵及人格特質的完整「原文」文句) |'
