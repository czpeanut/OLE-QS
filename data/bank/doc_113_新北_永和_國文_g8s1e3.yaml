  stem: '阿優依據下文撰寫了內容重點大要，請你幫他選出正確的敘述：

    「合鴨農法」是指將養殖鴨和耕稻同時進行的有機農業方法，此方法已實踐千年以上，是全球重要的農業文化遺產，臺灣、日本和越南仍可見。「合鴨農法」也稱為「稻鴨共生」，因為稻田內的雜草、害蟲可做為鴨子的食物，不需噴灑除草劑和殺蟲劑；且鴨子活動踩踏時，可幫助植物根部吸收肥料、氧氣；鴨子的排泄物可作農作物肥料，不用化學肥。臺灣早期養鴨人家利用稻作收成由南至北收穫的特性，遊牧菜鴨或蘆鴨，此方式稱為「逃冬」、「淘冬」或「討冬」，鴨隻則稱「淘冬鴨」，此趕鴨人家與養蜂人家，同為臺灣農業的遊牧民族。稻鴨共生曾在農藥大量使用後式微，因1990
    年代防治福壽螺而再興，福壽螺由於繁殖速度極快，並喜歡啃食植物的嫩莖與幼葉，難以使用農藥根治且影響農作物收成，故專家學者建議以鴨、魚或昆蟲等生物，防治福壽螺所造成的農業危機。                                                                             黃學文〈合鴨農法〉'
  options:
  - label: A
    content: 「合鴨農法」是存於西方的農業工法，能完整顧及農田生物鏈
  - label: B
    content: 「稻鴨共生」因養殖鴨子的成本過高，所以維護成本所費不貲
  - label: C
    content: 「稻鴨共生」曾經因為「福壽螺」大舉入侵的關係而漸漸式微
