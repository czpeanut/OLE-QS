- id: doc_113_新北_永和_國文_g8s1e3_s7_33
  section: 7
  number: 33
  type: single
  page: 6
  stem: 依據甲文，下列敘述何者正確？
  options:
  - label: A
    content: 螢幕閱讀的優勢在於能夠提供更多的地景指標，幫助讀者理解和記憶文本
  - label: B
    content: 使用螢幕閱讀時，讀者的注意力容易分散，且容易在閱讀過程中從事其他事務
  - label: C
    content: 讀者在使用平板或筆記型電腦時，能夠更長時間集中注意力，且不易感到眼睛疲勞
  - label: D
    content: 讀者在閱讀電子書時，能夠輕鬆地記住文本的具體位置，且能夠隨時快速翻閱回去
  group_stem: "甲 \n根據過去20 年來的研究顯示，人們透過紙本閱讀，比使用螢幕更容易理解與記憶文本。在大多數例子裡，紙本書會比螢幕上的文本提供更明顯的地景指標。讀者翻開紙本書，立刻會看到清楚分開的兩塊疆界——左頁和右頁，共有八個角落可用來記住位置。相較之下，大部分數位載具反而會妨礙文本的直覺式瀏覽，讓讀者不易在心裡描繪出閱讀歷程。一般而言，使用螢幕閱讀在認知與生理上耗費的資源比紙本閱讀來得多。除了捲動需要持續的意識外，平板與筆記型電腦的液晶顯示器直接對著人臉發光，容易造成眼睛疲勞與頭痛。\
    \ \n另外則有越來越多研究強調，使用螢幕閱讀可能分散注意力，根據研究，使用螢幕閱讀的人中途會岔出去做很多事——他們會花較多時間進行瀏覽、掃描和搜尋關鍵字，相較之下，閱讀紙本的人比較能一氣呵成。\
    \ \n為了讓更多人使用電子書，設計者努力讓電子書閱讀器或平板電腦的閱讀經驗，盡可能貼近紙本書籍。然而目前廠商研發大多著重在美學，並非那麼實用，且當讀者想起先前讀到的某個句子時，他們仍然無法隨性地在電子書上快速往前瀏覽，也無法輕易翻到前面的章節。\
    \                                       《科學人雜誌》 \n乙 \n紙本書和電子書雖具有相同的內容，但兩者提供不同的服務形式。對喜歡紙墨氣味的人而言，書的裝幀與美感是很重要的。許多人愛用電子書閱讀器看長篇小說，但對記憶力不好的讀者而言，常常要回頭翻查人名與情節，紙本書在翻閱上較快速。\
    \ \n但對書滿為患的人而言，電子書可以減少藏書的負擔，也能在旅途中享受無負擔的閱讀樂趣。數位載具的特性，能夠讓電子書整合文字、聲音、影像，以及配合個人需求調整字體大小等，我尤其喜歡其具備檢索、註記、書籤等功能。\
    \ \n在購買電子書時，有時會看到「流動版面」和「固定版面」的字眼。顧名思義，前者是能夠隨著載具自動調整版型的檔案，如ePub；後者一般則是指版型固定、無法隨時縮放字體的PDF\
    \ 檔案。前者對於我來說，閱讀上較為便利。很多人以為看電子書需要網路環境，其實不然。購入電子書之後，只要先下載到相關載具，之後即使沒有網路，也可以閱讀。 \n\
    我喜愛在旅行時候使用電子書。除了易於查詢、不必連網路的優點外，電子書還有其他長處： \n第一，電子載具可以隨身攜帶上千上百本書，讓你永遠可以根據當時情況，找出當下想讀的書：火車上或許你想讀詩集，或想讀長短篇小說，都可購置電子書將它們下載到閱讀器裡，完全不會增加行李箱的重量。\
    \ \n第二，即使人在異國，也可以立刻購買當時想看的中文書。譬如人在韓國，突然很想了解韓國文化，卻又看不懂當地書店所販售的韓文書，便可上網路書店，買一本《最陌生的鄰居：韓國》，立刻可下載存入手機、平板或者電子閱讀器。\
    \                                                                沈如瑩《Openbook\
    \ 閱讀誌》"
