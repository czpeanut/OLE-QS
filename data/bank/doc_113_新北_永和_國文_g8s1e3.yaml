  options:
  - label: A
    content: 甲、乙二文都強調電子書的閱讀體驗較紙本書更直觀且能讓讀者更容易理解和記憶，並且認為電子書在這方面的表現超過紙本書
  - label: B
    content: 甲、乙二文皆指出，電子書的閱讀對眼睛造成更多疲勞，並且會增加讀者的身體負擔，因此電子書的使用對生理功能會有一定的影響
  - label: C
    content: 甲文強調紙本書的閱讀能幫助讀者提高集中力，特別是在記憶文本的過程中，而乙文則著重於電子書在閱讀上的便捷性，能減輕攜帶和存儲書籍的負擔
  - label: D
    content: 乙文認為紙本書在閱讀時會提供更多的情感體驗和感官享受，除了易於查詢、不必連網路的優點外，並且比電子書在攜帶和收藏方面更加方便和具優勢
