- id: doc_113_新北_永和_國文_g8s1e3_s6_22
  section: 6
  number: 22
  type: single
  page: 3
  stem: "依據下文，下列何者敘述最可能為作者欲表達的文章意旨？\n  文化？它是隨便一個人迎面走來，他的舉手投足，他的一顰一笑，他的整體氣質。他走過一棵樹，樹枝低垂，他是隨手把枝折斷丟棄，還是彎身而過？一隻滿身是癬的流浪狗走近他，他是憐憫地避開，還是一腳踢過去？如果他在教室、電視螢幕的公領域裡大談民主人權和勞工權益，在自己家的私領域裡，他尊重自己的妻子和孩子嗎？他對家裡的保姆和工人以禮相待嗎？\n\
    \  獨處時，他，如何與自己相處？所有的教養、原則、規範，在沒人看見的地方，他怎麼樣？\n  文化其實體現在一個人如何對待他人、對待自己，如何對待自己所處的自然環境。在一個文化厚實深沉的社會裡，人懂得尊重自己——他不苟且，因為不苟且所以有品味；人懂得尊重別人——他不霸道，因為不霸道所以有道德；人懂得尊重自然——他不掠奪，因為不掠奪所以有永續的智能。\
    \                  龍應台〈文化是什麼〉"
  options:
  - label: A
    content: 文化是人類社會的靈魂，可稱作自我與自然物我合一的生活體驗
  - label: B
