    \ \n兩隻小石虎集寶和集利逐漸長大，個性也逐漸有了明顯差異。公石虎集寶就像過動兒一樣，好奇心強、精力旺盛，不只會和媽媽搶奪食物，學會捕獵技巧後，更是躍躍欲試，小雞、小鼠甚至小鳥都難逃牠的利爪。母石虎集利相對害羞、文靜許多，不只活動力低，對於獵食的興趣也沒這麼高，大多喜歡靜靜的躲在巢箱內休息。\
    \ \n小石虎長得稚氣、可愛，但由人類飼養長大的動物，可能會出現過度親近，甚至依賴人類的狀況，但若帶著這樣的習性回到野外，不只容易遭人攻擊、捕捉，    \
    \ 。考量到未來希望能野放，因此，在照養的過程中，必須有意識的避免小石虎與人員接觸。野放訓練的項目還包含了躲藏、野外覓食、運動和環境適應等項目，由負責的人員安排訓練的進度和項目，同時進行評估、驗收，確認動物具備所有在野外生存能力。進行訓練的同時，研究人員也密集地與國內專家討論，決定適合野放的時間和地點。也特地飛到日本訪問從事西表山貓研究的伊澤雅子教授以及中西希博士，希望借鏡西表山貓保育成功的案例，找到石虎保育的出路。\
    \ \n羅奕儒〈石虎集寶之死——野外，回不去的家鄉。〉"
