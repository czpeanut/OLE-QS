  number: 6
  type: single
  page: 2
  stem: 下列對於〈愛蓮說〉一文的文句理解，何者敘述錯誤？
  options:
  - label: A
    content: 「濯清漣而不妖」象徵親切清新、平易近人
  - label: B
    content: 「中通外直，不蔓不枝」形容正直端正，不攀附權貴
  - label: C
    content: 「香遠益清，亭亭淨植」說明品德高潔，芬芳遠播
  - label: D
    content: 「牡丹之愛，宜乎眾矣」暗寄褒貶，感嘆世人汲汲於富貴
