  stem: "閱讀本文後，請問下列敘述何者推論最正確？\n  狐做為「妖境」的代表，牠在人類聚居之處經常出沒，具有知過去未來、點石成金的超能力。在「變形」故事中，中國人有著野獸可以「昇華」為人類的思考模式，西洋人卻認為人類極可能會「墮落」成野獸，這種思路上的南轅北轍頗堪玩味。一如中國之「妖狐」，西方也有「狼人」的變形故事，但當你看到一個像人又像狼的「過渡形貌」時，牠意味的是人正在「淪落」成狼，而非狼在「提昇」為人。西方的狼人故事恐怖而且血淋淋，一個人若吃了被狼咬過的羊肉，喝了被狼污染的水或被狼咬過，就可能會在月圓之夜變形成毛茸茸、尖牙利嘴的嗜血狼人。\
    \       \n王溢嘉〈妖狐與狼人——中西變形觀初探〉"
  options:
  - label: A
    content: 西方認為狼可以藉由修練以獲得人形，人也會因為與獸群居而墮落
  - label: B
    content: 東方認為「過渡形貌」是人類透過修練漸漸有異能力與野獸的形貌
  - label: C
    content: 西洋狼人的形成是人類因為失去人性而墮落，變形成為怪物
  - label: D
    content: 東西方的鬼怪觀念迥異，但都有「人會墮落成野獸」的憂懼
