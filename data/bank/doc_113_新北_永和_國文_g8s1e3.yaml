- id: doc_113_新北_永和_國文_g8s1e3_s6_5
  section: 6
  number: 5
  type: single
  page: 1
  stem: 「噫！菊之愛，陶後鮮有聞。蓮之愛，同予者何人？ 牡丹之愛，宜乎眾矣！」從這段話可以知道作者的感嘆為何？
  options:
  - label: A
    content: 懷才不遇，未能受到君主賞識重用
  - label: B
    content: 世風日下，人心不古，只能獨善其身
  - label: C
    content: 知音難尋，潔身守正者已不復多見
  - label: D
    content: 君子不懼出身低，只怕無法堅守志節
