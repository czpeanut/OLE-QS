  section: 2
  number: 38
  type: single
  page: 2
  stem: 若要參觀上文提及的「郊行博物館」應前往右圖(五)中的何地？
  options:
  - label: A
    content: 甲地
  - label: B
    content: 乙地
  - label: C
    content: 丙地
  - label: D
    content: 丁地。
  group_stem: '(二)請閱讀下列資料，並回答第38〜40 題問題：

    「郊行博物館」座落在今日鹿港老街狹窄、寧靜的巷弄裡，古樸的閩南式紅磚牆，與內部陳列的歷史文物，都展現了清代鹿港獨特的商貿文化。遊走其間，不難窺探當年千帆入港的繁華景象。

    「郊行」是與同一地區從事貿易，或經營相同性質商品的商業組織。1815年的鹿港就以「鹿港八郊」遠近馳名。其商號有：泉郊「金長順」、廈郊「金正順」、布郊「金振萬」、糖郊「金永興」、𥴊郊「金長興」、油郊「金洪福」、染郊「金合順」、南郊「金進益」。這些郊商組織對鹿港的在地生活與文化發展，具有相當大的影響力。  註：𥴊郊經營日用雜貨、染郊經營染布貿易。'
