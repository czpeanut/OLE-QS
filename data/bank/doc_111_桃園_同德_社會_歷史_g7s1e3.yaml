  group_stem: '(一)請閱讀下列資料，並回答第35〜37 題問題：

    自十九世紀開港通商後，臺灣的經濟、社會、文化各方面有了顯著的變化。例如：西方人在通商港口設立洋行，將臺灣的商品銷往海外，國際貿易快速發展。另外，西方的宗教與文化，也再度傳入臺灣，帶動了臺灣西方醫學與新式教育的發展。'
