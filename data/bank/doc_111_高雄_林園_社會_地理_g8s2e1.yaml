- id: doc_111_高雄_林園_社會_地理_g8s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 請問文中所說的某國，應該是位於地理圖四中的哪一國？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
  group_stem: '※請閱讀以下短文，並依短文內容回答第10、11 題

    ※地理圖四是南亞簡圖，請依題意參照回答問題


    某國軟體產業風生水起近十年，產業日臻成熟，軟體公司水準也趨於一致。這時候要搶國外大客戶，比的就是「人」的競爭力。業界的競爭既激烈又現實，這種氛圍，也早已滲入校園。


    美國《商業週刊》，曾報導某國最頂尖的科技學院「最恐怖的教授」。他給全班最高分者A，第二高分者B，剩下的全部是C、D、E。教授告訴學生：「今日我用這樣的方式磨練你們，就是要你們未來遇到競爭者，絕不可以被比下去。」

    為什麼願意長期在高壓下苦讀？動力是什麼？「為了錢，」一個學生直截了當地說。在當地，一個軟體工程師的薪水，是平均國民所得的十倍以上。功課好的，可以進知名大公司，薪水更翻升三、四倍。


    但值此同時，某國卻有70％的文盲，完全活在另一個世界。

    就像林蔭幽深、一棟棟新式大樓聳立的大學，幾步之遙卻是當地最大的貧民窟，同樣諷刺且令人觸目驚心。某國政府希望藉金字塔頂端2％人口的力量，帶動下面98％的平民。可不可行，就待時間驗證。'
  shared_asset: g1_10_11
  answer:
  - A
  answer_source: answer_key_vlm
