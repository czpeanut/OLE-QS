  section: 1
  number: 56
  type: single
  page: 2
  stem: '下表是宬赫在上完公民課多元支付的方式後，所整理的比較表，請問何處的重點整理有誤？


    | | 信用卡 | 儲值卡 |

    | :--- | :--- | :--- |

    | (A)特性 | 先消費後付款 | 先儲值再消費 |

    | (B)相關說明 | 交易時由發卡銀行代付費用，繳費時間截止後再用現金支付費用 | 根據《民法》的規定，此卡是消費者與業者簽訂的一種契約，業者須負履約保證責任
