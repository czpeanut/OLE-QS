    | :--- | :--- | :--- |

    | (甲)人口密度 | 高 | 低 |

    | (乙)土地面積 | 大 | 小 |

    | (丙)人口數量 | 多 | 少 |

    | (丁)教育資源 | 多 | 少 |'
