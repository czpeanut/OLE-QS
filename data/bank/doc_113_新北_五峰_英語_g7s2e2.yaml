  group_stem: 'On 28 March 2025, a strong earthquake hit Myanmar. Wufeng Junior High
    School is going to have an event for collecting things for children in Myanmar.
    Here is the poster for the party.


    Let’s Show Our Love for Kids in Myanmar!

    Date: May 17, 2025 (Sat.)

    Time: 9:00 ~ 13:00

    Place: Wufeng Junior High School Basketball Court

    (Free food and drinks)


    Dos & Don’ts:

    ＊DO come with your things, old or new.

    ＊DO go to the right classroom for your things.

    ＊DON’T give us money.

    ＊DON’T give us books. Children in Myanmar can’t read Chinese books.


    | Class 701-703 | Class 704-706 | Class 707-709 |

    |---|---|---|

    | Dolls & Toys | Stationery | Sports Shoes |

    | Class 710-712 | Class 713-715 | |

    | Rice & Noodles | New Blankets | |


     earthquake 地震 Myanmar 緬甸 event 活動 poster 海報'
