- id: doc_113_新北_五峰_英語_g7s2e2_s3_24
  section: 3
  number: 24
  type: single
  page: 2
  stem: What is toast art?
  options:
  - label: A
    content: A picture made on toast.
  - label: B
    content: A book about food.
  - label: C
    content: A new kind of bread.
  - label: D
    content: A game on the phone.
  group_stem: 'Toast Art

    Toast art is a fun and easy food. It turns bread into a small work of art. You
    can make it at home with your family.


    What do you need?

    You need bread, cream cheese, a plate, a brush, and spreads of different colors.


    What do you do?

    1. First, get a piece of bread.

    2. Second, toast the bread.

    3. Third, mix the cream cheese with the spreads on your plate. Now you have colorful
    "paint."

    4. Last, use the brush to paint a picture on your toast. You can paint a flower,
    a face, or anything you like.


    Toast art is great for everyone. You can eat your art when you are ready. It is
    yummy and fun!


     toast 吐司、烤(麵包) cream cheese 奶油乳酪 brush 刷子 spread 抹醬'
  shared_asset: g3_24_25
