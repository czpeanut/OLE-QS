- id: doc_113_新北_中平_自然_g8s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 「紅外線熱顯像儀」利用紅外線熱感測元件擷取目標物溫度，並透過數位影像處理技術將溫度以影像方式呈現。不受任何光源及天候影響，可穿透濃煙、雲霧探測溫度，目前在消防救災勤務時使用率增加，方便消防人員入室迅速找到火點，協助研判災害現場危害性。請問上述的測溫方法和何種溫度計的原理相同？
  options:
  - label: A
    content: 液晶溫度計
  - label: B
    content: 酒精溫度計
  - label: C
    content: 耳溫槍
  - label: D
    content: 固體溫度計
