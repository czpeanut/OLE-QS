  page: 1
  stem: 怡君操作溫度計測量的實驗，她取甲、乙兩相同的錐形瓶，插上玻璃管，甲瓶玻璃管比乙瓶粗。在20 ℃時兩瓶水面等高，將乙瓶放入100℃的沸水中後，結果如圖所示。關於此實驗過程，下列敘述何者錯誤？
  options:
  - label: A
    content: 可在水中滴入藍墨水以方便觀察
  - label: B
    content: 此實驗是利用體積熱脹冷縮的原理
  - label: C
    content: 作溫度計使用時，乙測量結果較為準確
  - label: D
    content: 將甲瓶放入100℃的沸水中，液面高度會高於12 公分。
