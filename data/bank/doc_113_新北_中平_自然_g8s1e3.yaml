  type: single
  page: 1
  stem: 妙妙看到一則新聞標題「手機電池也會怕冷」，好奇查詢米果官網的資料，資料顯示手機適宜存放的溫度為 -4℉~113℉的環境中，如果存放在極端情況可能會暫停使用。因此官網建議存放的環境溫度對應到攝氏溫度範圍為何？
