- id: doc_113_新北_中平_自然_g8s1e3_s1_39
  section: 1
  number: 39
  type: single
  page: 4
  stem: 根據上文描述，將有關物質組成整理成概念圖如下，下列敘述何者錯誤？[素養題]
  options:
  - label: A
    content: 戊為夸克
  - label: B
    content: 乙為原子核
  - label: C
    content: 粒子質量大小關係為原子>乙>丙>戊
  - label: D
    content: 只有夸克稱為基本粒子
  group_stem: '【閱讀題】


    1968 年美國加州SLAC 實驗室，以高速電子撞擊質子的實驗中，本以為質子內部為均勻分布的正電荷物質所組成，但實驗數據卻顯示，質子內部電荷分布並不均勻，而是有點狀似的結構，也就是說質子內部有更緊密、更微小帶有電荷的粒子存在，這個粒子被稱為「夸克」，並且質子內部含有3
    個夸克。


    若以高速電子撞擊中子，也會得到類似結果，發現中子內部也是由3 個夸克所組成。直至今天，在實驗上我們還未發現夸克及電子是由更微小的部分所組成，故稱電子與夸克為「基本粒子」。《節錄自翰林版高中物理課本》'
