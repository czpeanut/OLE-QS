- id: doc_113_新北_中平_自然_g8s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '小家和小正在討論理化題，題目如下框：


    初溫皆為20 ℃的甲、乙、丙三個不同金屬固體，在同一熱源上加熱，其溫度與加熱時間的關係如附圖所示，假設熱源供給的熱量完全被吸收。


    小家說：「丙的比熱最大，因為升溫較為緩慢。」

    小正說：「因為質量未知，所以無法判斷比熱。」

    關於比熱的概念，何者敘述正確？'
