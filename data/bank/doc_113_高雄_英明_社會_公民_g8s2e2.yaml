- id: doc_113_高雄_英明_社會_公民_g8s2e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: '姍姍在社群通訊軟體上分享今天的學習心得，如下所示。請問，畫底線部分中哪一項出現錯誤？

    動態更新

    在十幾年前，盜用他人的帳號密碼，取得、刪除或變更他人的電磁紀錄，這些行為都不會被處罰，當時的(甲)《刑法》第一條規定，行為的處罰，以行為時的法律有明文規定者為限。所以如果沒有制定刑罰來處罰的行為就不能罰，這就是有名的(乙)「罪刑法定原則」。後來，(丙)立法院修法增訂了(丁)「公共危險罪」，往後這樣的行為就構成犯罪，而且能依法處罰。'
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
  tags:
