- id: doc_113_高雄_英明_社會_公民_g8s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 在日常生活中，個人行為如果違反法律稱之為「違法行為」。但是有些行為，因為侵害國家、社會或個人法益，會形成「犯罪行為」。請判斷以下何項行為屬於「犯罪行為」？
  options:
  - label: A
