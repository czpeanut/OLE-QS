- id: doc_113_高雄_英明_社會_公民_g8s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 小瑛正在研究兩起汽車毀損案件，一起為大雄因騎腳踏車不小心碰撞到鄰居的轎車；另一起為胖虎因不滿阿福說他唱歌難聽而刮傷阿福的特斯拉轎車。她發現大雄只需要負擔民事責任，而胖虎卻遭到刑事究責。請問：下列有關兩起事件的說明，何者正確？
  options:
  - label: A
    content: 毀損若是過失行為，不須負擔任何責任
  - label: B
    content: 故意毀損屬於刑法所規定的犯罪行為
  - label: C
    content: 被害人沒有提告，所以大雄只負民事責任
  - label: D
    content: 胖虎不需要負擔民事責任，但有刑事責任
