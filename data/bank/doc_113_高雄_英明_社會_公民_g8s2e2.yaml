  section: 1
  number: 17
  type: single
  page: 2
  stem: 媒體報導，梁姓毒販因長期吸毒，為了滿足自己毒品的需求，進而開始販毒，最終被逮捕並判處有期徒刑十年，且沒收所有被查獲的毒品及犯罪所得。請問：以下敘述何者正確？
  options:
  - label: A
    content: 所判處的主刑為有期徒刑，是剝奪自由刑
  - label: B
    content: 沒收毒品和犯罪所得，是屬於從刑的一種
  - label: C
    content: 判處有期徒刑十年，是屬於刑法的從刑
  - label: D
    content: 沒收不得單獨科處，需要有主刑一同宣判
