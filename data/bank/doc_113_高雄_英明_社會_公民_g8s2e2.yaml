- id: doc_113_高雄_英明_社會_公民_g8s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '阿忠正在學習《刑法》，他嘗試解讀下列新聞內容，下列敘述何者正確？

    社會案件前線

    阿勇因爭風吃醋，前往情敵小鍾家樓下企圖放火，幸而被鄰居發現後報警，被移送法辦後法院判決阿勇「公共危險罪」。'
  options:
  - label: A
    content: 阿勇的行為雖違法但不屬於犯罪
  - label: B
    content: 阿勇若只有16 歲，依刑法規定可不處罰
  - label: C
    content: 公共危險罪是侵犯了社會法益
  - label: D
    content: 本案件無人傷亡，故不符合罪刑法定原則
