  stem: '右列是一則新聞報導，文中的(甲)、(乙)兩部份，分別與何種刑事訴訟程序有關？

    針對某政治人物的論文涉嫌抄襲，受害人選擇(甲)自行聘請律師提告。因為(乙)若向檢察官按鈴申告的話，法律有偵查不公開的規定，證據掌握在檢方手中，將無法查知對方如何答辯。'
