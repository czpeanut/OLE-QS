  type: single
  page: 1
  stem: 我國對於收賄的公務員，可處十年以上有期徒刑，但民間企業員工出現同樣的行為，卻常以刑罰較輕的背信罪處罰。上述相同的行為，會因犯罪者身分不同而受到不同懲罰的情況，與下列何種原則的關係最密切？
  options:
