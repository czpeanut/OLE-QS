- id: doc_113_高雄_英明_社會_公民_g8s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: '公民老師列出下列三條刑事訴訟程序，請同學排列出正確的敘述。請問，下列排序何者正確？

    甲、根據起訴內容，法官依法審判被告是否構成犯罪及其量刑。

    乙、調查有無犯罪事實、蒐集與案件相關行政證據的法律程序。

    丙、偵查、蒐集證據後，檢察官若認為構成犯罪則提起公訴。'
  options:
  - label: A
    content: 甲→乙→丙
  - label: B
    content: 乙→丙→甲
  - label: C
    content: 乙→甲→丙
  - label: D
    content: 丙→乙→甲
  tags:
    chapter:
      publisher: 康軒
      book: 八下
      subject: 公民
      code: 4-2
      title: 犯罪追訴和處罰過程
      chapter: null
    textbook: 八下公民 4-2 犯罪追訴和處罰過程
    labeled_by: ai
- id: doc_113_高雄_英明_社會_公民_g8s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 有些大學生為了節省開銷而使用盜版教科書，嚴重影響圖書業者的權益，因此某圖書協會向政府陳情，希望能修法將盜印書籍的行為，由告訴乃論改為非告訴乃論。根據上述內容判斷，下列敘述何者正確？
  options:
  - label: A
    content: 圖書協會建議修改的法律為民法
  - label: B
    content: 修法通過前，盜印書籍者只需要負起民事責任
  - label: C
    content: 修法通過後，被害人可以在和解或協商後撤告
  - label: D
    content: 修法通過後，盜印書籍就不能再以調解解決
