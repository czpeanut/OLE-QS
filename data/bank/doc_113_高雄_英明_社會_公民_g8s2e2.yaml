  stem: 剛通過國家考試的晴子，在受訓完成後分發到某政府機關上班，她的第一件任務即為到現場調查疑似縱火案的證據，並將證據交由櫻木判斷是否要代表國家追究此一犯罪行為。依據上文敘述，下列說明何者正確？
