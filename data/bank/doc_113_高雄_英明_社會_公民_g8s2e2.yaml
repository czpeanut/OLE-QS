- id: doc_113_高雄_英明_社會_公民_g8s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 我國刑事案件起訴的方式，可依照被害者的選擇區分成自訴或是公訴兩種制度。請問：以下有關自訴及公訴的說明，何者正確？
  options:
  - label: A
    content: 法官蒐集到具體犯罪證據便可直接提出公訴
  - label: B
    content: 妨害名譽或過失傷害必須由檢察官提出公訴
  - label: C
    content: 被害人委任律師向法院提起訴訟稱之為自訴
  - label: D
    content: 被告可自行選擇自訴或公訴，是偵查流程之一
