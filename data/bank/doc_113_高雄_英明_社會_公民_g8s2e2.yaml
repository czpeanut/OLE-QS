    content: (甲)=告訴、(乙)=公訴
  - label: B
    content: (甲)=自訴、(乙)=公訴
  - label: C
    content: (甲)=自訴、(乙)=告訴
  - label: D
    content: (甲)=告訴、(乙)=告發。
