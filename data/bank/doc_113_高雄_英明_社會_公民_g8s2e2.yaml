- id: doc_113_高雄_英明_社會_公民_g8s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 前直轄市市議員遭控關說市政府不要拆民眾的違建，並收取民眾30 萬元的報酬。法院審理後認定他以議員身分涉入此案件使違建可繼續使用，依貪汙治罪條例(甲)判處有期徒刑6
    年，(乙)褫奪公權3 年，(丙)沒收30 萬元犯罪非法所得。關於上述刑罰(甲)~(丙)的敘述，何者正確？
  options:
  - label: A
    content: 甲、乙是可以單獨科處的主刑
  - label: B
    content: 乙、丙是需依附於主刑的從刑
  - label: C
    content: 甲是剝奪生命，乙是剝奪資格
  - label: D
    content: 丙不必有主刑，即可單獨宣告
