  section: 1
  number: 19
  type: single
  page: 3
  stem: 請問文中提及農民所處理的耕地最可能是要種植下列那一種作物？
  options:
  - label: A
    content: 棉花
  - label: B
    content: 油棕
  - label: C
    content: 甜菜
  - label: D
    content: 小麥
  group_stem: 「燒芭，原義是指焚燒芭蕉樹，這是一種傳統的原住民農耕文化，現今是指山民在茂密的森林中放一把火把植物覆蓋地燒出一塊空地以用於耕作，植物燃燒的灰燼則作為天然肥料。由於山民的無休止耕作，若干年後土地將轉為貧瘠，山民便棄之，另尋他處持續“燒芭”行為。“燒芭”被環保人士稱為“地球的傷疤”。自上世紀
    90 年代以來，印尼每年 6、7 月份都會出現大面積森林大火。除了天氣乾旱引發林火之外，農民或種植園公司為了闢地，“燒芭”也是主要原因之一，而長達數月的火災也嚴重破壞印尼和鄰國的生態環境。」
    （說明：「燒芭」指以火焚燒耕地。）
