- id: doc_111_桃園_同德_社會_地理_g8s2e2_s1_17
  section: 1
  number: 17
  type: single
  page: 3
  stem: 英國人將取得的茶樹樹苗帶至印度種植，途中會經過哪一個海峽？
  options:
  - label: A
    content: 津輕海峽
  - label: B
    content: 對馬海峽
  - label: C
    content: 巴士海峽
  - label: D
    content: 麻六甲海峽
  group_stem: '紅茶雖然起源於中國（福建），卻在國外受到更大的歡迎，尤其是英國。自 17 世紀英國人接觸到紅茶後，三百年來逐步發展出一套優雅的紅茶文化，並成為世界紅茶文化的主流。

    紅茶的誕生，解決了茶葉因長途運輸而香味走失的難題。清朝是中國茶葉最鼎盛的時期，當時，由於英國乃至歐洲皇室貴族的需求日益增加，滿載茶葉的歐洲商船遠航在世界各地，在全盛時期，中國輸出品中有六成都是紅茶。由於英國人每年至少消費
    3 磅茶葉，因此茶價貴於歐洲其他國家。於是，英國透過擴大通商和戰爭掠奪從中國獲得茶葉，並且將其樹苗帶至氣候近似中國的印度阿薩姆地區嘗試種植。後來，英、法等歐洲國家開始從印度阿薩姆地區及錫蘭等地區購茶。經過歲月的磨礪和時間的沉澱，時至今日，產自印度兩大著名產區的上等紅茶，早已成為世界上最好的“英國紅茶”。'
