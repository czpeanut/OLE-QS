  stem: 請問文中第一段雙底線的部分，可彰顯部落何種重要性？
  options:
  - label: A
    content: 生產分配中心
  - label: B
    content: 基本政治組織
  - label: C
    content: 傳統信仰重心
  - label: D
    content: 重視文化傳承
  group_stem: "達魯瑪克部落（Taromak）意為「我們的家」，同時有勇士團結的意味，位在台東縣卑南鄉東興村是台東縣內唯一的魯凱族聚落。此部落在7 月時舉辦了「收穫祭獵獲分享聚」，他們表示傳統狩獵都是以部落群體為單位，族人們協力捕獲獵物並分擔辛苦的背負工作，將「團獵」的成果與全族人共同分享，希望藉此體現傳統部落組織分工互助的生活方式，同時也讓年輕一代的族人有機會認識自己的傳統領域。\n\
    \    而該部落因為擁有得天獨厚的自然風景，因此在2016 年時進行了一場「百分百綠能部落」的實驗，這場實驗透過環保團體、部落主席的催生下誕生，過程中不乏召開多次部落會議以進行討論，最終成立臺灣第一座由居民集資建立的「公民電廠」，靠部落的天然資源太陽、河川、生質能發電，更甚至隔年即成立了「達魯瑪克綠能電力公司」，成為全臺第1\
    \ 個公民發電部落，以此展現出對環境的重視與部落自主的決心。\n    除此之外當地的達魯瑪克民族實驗小學附設沉浸式族語教學幼兒園也很值得一提，主要推手名為陳秀紅，她本身具有原住民的身分並致力於教育，原先國小一週一小時的族語課程學習效果恐不彰顯，因此著手將學習族語這件事放置幼兒園來推行，原因是因為她希望孩子從小就能接觸母語，學習民族精神，以期能培育出健全人格的基礎。因此沉浸式族語教學的宗旨即是將自身語言文化融入日常生活中，其中最特別的是陳秀紅帶著孩子們到部落的文化健康站進行老幼共學，讓阿公阿嬤用族語和孩子們溝通，除非孩子們聽不懂老師才會介入，否則會讓他們透過互動過程來彼此分享知識、傳遞經驗，藉由老幼共學的方式發揚魯凱族美麗的文化與語言。"
