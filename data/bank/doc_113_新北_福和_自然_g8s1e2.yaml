- id: doc_113_新北_福和_自然_g8s1e2_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 當斷層錯動引發大地震動時，從震源開始以波的形式向四面八方傳遞，稱為地震波；震源處會同時產生P 波與S波往外傳播，P 波是縱波帶給人的感受是上下方向的震動，通常是地震發生後，最早被地震儀偵測到的波，其波速約9
    公里/秒；而S 波是橫波帶給人的感受是水平方向的振動，其波速約5 公里/秒。一觀測站在某次大地震時測得P 波抵達後再經16 秒，S 波也抵達，若這兩種波沿著同一直線路徑由震源傳到觀測站，則震源與觀測站的距離約為多少公里？(震源：地震發生時能量釋放處)
  options:
  - label: A
    content: 64 公里
  - label: B
    content: 84 公里
  - label: C
    content: 112 公里
  - label: D
    content: 180 公里。
