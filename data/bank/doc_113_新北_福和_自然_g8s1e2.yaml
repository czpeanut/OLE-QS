- id: doc_113_新北_福和_自然_g8s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 每年台北101舉辦跨年煙火秀時總是吸引眾多人潮，小武和君君不想和群眾人擠人，便相約前往福和橋上欣賞遠處的煙火秀，結果發現看見燦爛的煙火後，再經過大約14秒才聽到微弱的煙火爆炸聲傳到，若當時的聲速是340公尺/秒，光速為30萬公里/秒，試問：煙火爆炸處距離福和橋大約多少公尺，下列算式何者較合適？
  options:
  - label: A
    content: 340X14÷2
  - label: B
    content: 340X14
  - label: C
    content: (340X14+30X14)÷2
  - label: D
    content: 340X14+30X14 。
