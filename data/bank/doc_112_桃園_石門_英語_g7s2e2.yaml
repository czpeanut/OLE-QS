    On April third, there was an earthquake. It was the strongest one in Taiwan in
    the past 25 years. The earthquake happened near Hualien (花蓮). Lots of people got
    hurt, and some even lost their lives. The earthquake was so strong that nearby
    countries, like China and Japan, could feel.

    The American scientists found that the center of the earthquake was about eighteen
    kilometers south of Hualien City. After the earthquake, there were also warnings
    about big waves (tsunamis) in places like Japan and the Philippines, but those
    warnings didn''t go long.

    It''s really important for people to help each other after something like this
    happens. Earthquakes can be scary, but many people are working hard to keep everyone
    safe.

