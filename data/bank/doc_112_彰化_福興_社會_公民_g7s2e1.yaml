  section: 1
  number: 8
  type: single
  page: 1
  stem: 每年農曆7月在客家庄會舉辦「神豬大賽」習俗，近年此項活動遭到動物保護團體批評，認為飼養神豬時會強迫豬隻灌食，導致豬隻因肥胖而無法正常排泄和站立，在公開宰殺過程中，神豬也會承受極大的壓力和痛苦。農委會表示，依據《動物保護法》管理精神，如果有強制灌食、鐵架壓身，已構成違法行為，建議依照動物福利標準來飼養以避免活動失焦。客委會表示，神豬大賽是多年的傳統文化，希望各界給予尊重，但同時也表達反對虐養行為。請從上文中判斷，各方立場為何？
  options:
  - label: A
    content: 飼養神豬者：法律必須仰賴習俗發揮效力，才能約束行為
