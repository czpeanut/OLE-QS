- id: doc_112_彰化_福興_社會_公民_g7s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 英國殖民時期的語言政策呈現出何種特色？
  options:
  - label: A
    content: 藉由制定法律落實保障多元文化
  - label: B
    content: 發展一致文化形塑國家認同
  - label: C
    content: 有計畫性的進行文化交流與創新
  - label: D
    content: 形成文化位階導致權力分配不均
  group_stem: 多元文化種族的新加坡，在英國殖民時期，政府刻意設限學習英語者的資格，僅少數人因英語優勢享有優惠利益，在不均等的英語教育下，造成語文教育發展上的失衡。受到英語之外的語文教育而成長的年輕一代對英國殖民主義產生厭惡與痛恨，成為反殖民主義與國家建立的先驅。西元1959年新加坡成立自治政府後，提出教育重大整頓與改革：平等對待英語、華語、馬來語和淡米爾語四種不同語文的教育。採取的雙語政策是，學校教授英語作為第一語言，每位學生皆須學習；其他3種官方語言(即華語、馬來語及淡米爾語)，所有學生須按其種族學習一種母語。多元種族下的新加坡藉由該項政策既保護、延續自己種族的傳統、價值觀，也達到社會不同種族間高度的溝通整合。請回答下列問題：
