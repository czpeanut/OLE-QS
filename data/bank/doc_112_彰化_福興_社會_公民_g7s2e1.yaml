  stem: 在印度街頭，汽車、人力車、單車、牛和行人橫衝直撞，按喇叭就成了每個印度駕駛的生存技能。印度俗諺提到若想在印度好好開車，你需要「好車、好眼力、好運氣和好喇叭！」但這也讓街頭充滿喇叭噪音，讓人無法忍受，因此，印度孟買警察想出一個「你愈叭，紅燈愈長」的計畫：在幾個交通特別繁忙的路口，立起印有「你愈叭就等愈久」的警語，此一計畫也引起印度其他城市官員的響應。關於上述在印度開車按喇叭一事，下列哪一個看法比較貼切？
  options:
  - label: A
    content: 印度俗諺呈現出該社會長時間所累積而成的社會規範
  - label: B
    content: 孟買警察的計畫顯示社會規範改變會受到外來文化影響
  - label: C
    content: 官員想藉由當地印度教宗教信仰的推崇來達到社會輿論批評具有的制裁力
  - label: D
    content: 俗諺與警察計畫呈現的社會規範，彼此內涵相牴觸
