- id: doc_113_高雄_五甲_社會_g9s1e1_s2_18
  section: 2
  number: 18
  type: single
  page: 3
  stem: '我國《刑法》的基本原理原則有以下幾點：


    一、應報理論：「以牙還牙、以眼還眼」的觀念，用刑罰的痛苦衡平犯罪之惡害。

    二、正義理論：刑罰係針對犯罪之惡害所為之公正報應，而實現公平正義之理念。

    三、絕對理論：刑罰為解除罪責的唯一方法，科刑的本身就是目的。

    四、贖罪理論：刑罰是對於犯罪人所為之不法行為的贖罪。


    請問：我國《刑法》的哪一項基本原理，最接近《漢摩拉比法典》的核心精神？'
