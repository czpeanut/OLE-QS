  section: 2
  number: 21
  type: single
  page: 3
  stem: '某地區的秤心儀式如右表：


    死者穿著潔白的亞麻布衣服，來到奧塞利斯面前進行審判。奧塞利斯有一具天平，天平兩端，一邊放著死者的心臟，一邊放著代表正義公理的羽毛。阿努比斯正在調撥著天平，檢查是否平衡，如果天平平衡，表示死者生前善良公正，將可通過正義之神瑪特的審判，取得奧塞利斯的信任。如果心臟一端沉重，不能平衡，代表死者貪婪多欲，作惡多端，他的心臟將被取出，丟給在一旁等候的怪獸阿敏吃掉。


    請問：這段敘述呈現該地區的何種宗教觀？'
