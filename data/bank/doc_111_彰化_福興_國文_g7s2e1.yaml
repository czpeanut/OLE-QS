    \ L. Cater)博士認為父母跟孩子要常討論,哪些事、在哪些範圍內,是孩子可以自己決定的。第二步是界線以外的事情,不是父母直接幫忙決定,而是____,因為在這個過程中,孩子可以跟父母討論影響決定的因素以及價值觀。在決定前,大家可以先討論不同抉擇要承擔的後果,如何彌補這個決定的壞處、有哪些替代方案等,讓孩子學習做「資訊充分」的決定。第三步,容忍錯誤。做決策不是一件容易的事,大人也有決策錯誤的時候。父母也要練習容忍孩子的錯誤,讓他們從中學習,並且一起討論,下次還可以怎麼做得更好。"
