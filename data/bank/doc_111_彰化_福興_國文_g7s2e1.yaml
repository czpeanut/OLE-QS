    content: 學問之道無他,求其放心而已矣
  - label: B
    content: 知之為知之,不知為不知,是知也
  - label: C
    content: 書到用時方恨少,事非經過不知難
  - label: D
    content: 學而不思則罔,思而不學則殆。
