- id: doc_113_台中_沙鹿_英語_g9s1e2_s4_8
  section: 4
  number: 8
  type: single
  page: 2
  stem: What will happen if people don't protect their eyes?
  options:
  - label: A
    content: Things might not be clear to them.
  - label: B
    content: Their eyes might become smaller.
  - label: C
    content: Their brain will be damaged.
  - label: D
    content: They might have trouble sleeping.
  group_stem: "Eyes are one of the most important parts of our bodies. People use\
    \ eyes to do a lot of things. For example, we use them to watch movies, see beautiful\
    \ scenery, and study. Without it, it might be difficult to do things that people\
    \ are doing every day.\n    However, people have to protect（保護）their eyes because\
    \ they are easily damaged. If people don't take a rest after using their eyes\
    \ for some time, they might be nearsighted（近視的）. In other words, they can't see\
    \ things as clearly as before. Some people even become blind. When parts of their\
    \ eyes don't work, the information can't be sent to the brain（大腦）. Therefore,\
    \ blind people can't see what is showing to them.\n    There are some ways to\
    \ protect the eyes. First, use them for thirty minutes and take a rest for ten\
    \ minutes. People can follow this rule when they are playing video games or studying.\
    \ Second, get some exercises. Exercising can help people's eyes relaxed（放鬆的）."
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
