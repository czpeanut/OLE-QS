- id: doc_113_新北_土城_社會_g9s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 安妮的日記這樣記載著：「1942 年 7 月 9 日，我們必須保持安靜，盡量不要發出任何聲音，因為樓下的人不應該知道我們在這裡。這就是為什麼瑪格特和我大部分時間都待在房間裡，而爸爸媽媽則在客廳裡。」安妮一家人在這個狹小且與外界隔絕的空間裡躲藏了兩年多，以躲避某政權對他們的迫害，直到
    1944 年 8 月被蓋世太保發現並逮捕。根據以上資訊，下列何者最有可能是安妮一家人的經歷？
  options:
  - label: A
    content: 擔任德國政府的軍事要角
  - label: B
    content: 支持以色列建國計畫
  - label: C
    content: 在天主教教堂中虔誠禱告
  - label: D
    content: 躲藏期間接受聯合國援助。
