- id: doc_113_新北_土城_社會_g9s2e2_s4_61
  section: 4
  number: 61
  type: single
  page: 6
  stem: 根據文章所述，罐頭發明後，最早可以應用於與哪一場戰爭中？ 【歷史】
  options:
  - label: A
    content: 普法戰爭
  - label: B
    content: 英法聯軍
  - label: C
    content: 抵禦反法聯盟
  - label: D
    content: 獨立戰爭。
  group_stem: '古羅馬軍事家曾言：「飢餓往往比戰爭更能摧毀一支軍隊。」這句話點明了在戰爭中，確保軍隊糧食供應是致勝的關鍵。西元1800 年，為了滿足戰爭的需求，拿破崙懸賞徵求一種「成本低廉、便於運輸且能保存營養」的食物保存方法。最終，一位名叫阿佩爾的糕點師傅贏得了這份獎金。他發現，將食物密封在玻璃瓶中，再經過沸水加熱處理，可以保存長達一個月，罐頭這種食品就此誕生。

    阿佩爾之後，德國化學家李比希發明了從牛肉中提取濃縮肉汁的技術，這項技術隨後被應用於製作鹹牛肉罐頭。最初，這種鹹牛肉罐頭主要在歐洲銷售。後來，英國為了其在非洲爭奪殖民地的軍隊提供口糧，大量採購鹹牛肉罐頭，這使得罐頭開始傳播到歐洲以外的地區，並逐漸被大眾所接受。隨著英國在亞洲、非洲、紐西蘭和澳洲等地建立殖民地，罐頭也被帶到了世界各地。

    到了 19 世紀，新型交通工具的出現極大地改變了運輸方式，這也促進了罐頭成為國際貿易商品。此外，洲際交通路線的變化，使得英國和法國以外的歐洲罐頭產品也加入了這個新興市場的競爭。例如，義大利的蔬果出口商
    CIRIO，憑藉南義大利優越的農產品資源，在義大利統一後成為歐洲最大的農產品加工廠，各種蔬菜水果和橄欖油都以罐頭的形式，透過新的航線銷售到世界各地。如今，罐頭已逐漸不再只是為了戰爭而存在，反而成為人們體驗異國風味最便捷的方式。

    文章改寫自：生活時事這麼讀'
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 歷史
      code: 1-2
      title: 法國大革命
      chapter: 第1章 現代國家的建立
    textbook: 九下歷史 1-2 法國大革命
    labeled_by: ai
