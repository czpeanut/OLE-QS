  section: 1
  number: 19
  type: single
  page: 2
  stem: 請問文中所提及的印度統治勢力衰落，指得是哪一個統治政權？
  options:
  - label: A
    content: 波斯帝國
  - label: B
    content: 蒙兀兒帝國
  - label: C
    content: 荷蘭東印度公司
  - label: D
    content: 孔雀王朝。
  group_stem: '英國東印度公司的興衰：從貿易到殖民霸權

    1600 年，一群英國商人組建了英國東印度公司，這是一家股份制貿易公司，最初旨在開拓東方貿易。公司不僅致力於印度，也曾與台灣島上的政權簽署貿易協定。東印度公司最初在印度建立了一些貿易據點；18
    世紀，印度統治勢力逐漸衰落，東印度公司則巧妙地利用當地各勢力的矛盾與紛爭，逐步擴張在印度的影響力。

    東印度公司成為了統治印度的實質力量，掌握龐大的政治、經濟和軍事權力，並依照英國單方面的需求來管理印度，對當地的經濟、社會和環境都產生了深遠的影響。1857
    年，印度爆發大規模民族起義，英國政府藉此事件正式解散東印度公司，結束了其在印度兩個多世紀的統治，直接接管印度。'
