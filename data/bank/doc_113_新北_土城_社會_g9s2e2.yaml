  section: 1
  number: 8
  type: single
  page: 1
  stem: 喬治·歐威爾的《動物農莊》是一本諷刺小說，描述農莊裡的動物們因為無法忍受人類的虐待，所以在豬的帶領下起來反抗，成功推翻了人類的統治。然而，豬卻變成了新的統治者，牠們訓練小狗監視其他動物，使得被統治者遭受的痛苦比以前更嚴重。請問：這部小說最可能是為了諷刺哪一場革命？
  options:
  - label: A
    content: 美國獨立運動，豬象徵英軍
  - label: B
    content: 法國大革命，豬代表共和政府
  - label: C
    content: 俄國的十月革命，豬代表共產黨員
  - label: D
    content: 工業革命，豬象徵資本家。
