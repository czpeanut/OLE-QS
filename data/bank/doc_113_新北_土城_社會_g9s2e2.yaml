  section: 1
  number: 9
  type: single
  page: 1
  stem: 在冷戰時期，許多新興獨立國家不願選邊站，希望保持中立，並致力於推動彼此之間的合作與發展。請問下列哪一項行動或組織，最能體現這些國家追求獨立自主、不依附於任何超級強權的意願？
  options:
  - label: A
    content: 成立北大西洋公約組織（NATO），以對抗共產主義擴張
  - label: B
    content: 發起華沙公約組織，作為對抗西方軍事聯盟的回應
  - label: C
    content: 召開萬隆會議，反對殖民主義和強權政治的決心
  - label: D
    content: 參與馬歇爾計畫，協助西歐國家戰後經濟復甦。
