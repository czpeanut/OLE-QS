  section: 1
  number: 14
  type: single
  page: 2
  stem: 19 世紀初，拉丁美洲各地紛紛爆發獨立運動，美國總統門羅在 1823 年發表了一項宣言，宣稱「美洲是美洲人的美洲」，反對歐洲列強干涉美洲事務。歷史老師請學生分析拉丁美洲獨立運動與門羅主義之間的關聯性，請問下列哪位同學的論述何者最符合史實？
  options:
  - label: A
    content: 光榮：門羅主義是拉丁美洲獨立運動的思想先驅，激發了當地人民的民族意識
  - label: B
    content: 柏宇：門羅主義支持拉丁美洲的獨立運動，目的是與歐洲列強爭奪亞非殖民地
  - label: C
    content: 晨祐：門羅主義的提出創造了有利的國際背景，使美國得以擴大在美洲的影響力
  - label: D
    content: 鴻源：門羅主義直接導致了拉丁美洲各國的獨立，並建立了區域性的政治聯盟。
  tags:
