- id: doc_113_新北_土城_社會_g9s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 法西斯主義與共產主義皆為「極端主義」的代表，分別位於政治光譜的極右派與極左派，兩者原本應是相互對立。然而，在西元 1939 年，兩者卻跌破眾人眼鏡地達成了合作。請問：題幹中提到的「合作」是指下列哪一項？
  options:
  - label: A
    content: 「東南亞公約組織」的成立
  - label: B
    content: 《慕尼黑協定》的簽訂
  - label: C
    content: 「北大西洋公約組織」的成立
  - label: D
    content: 《德蘇互不侵犯條約》的簽訂。
