- id: doc_113_新北_土城_社會_g9s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 以下是一段關於 1948 年柏林的新聞報導：「蘇聯軍政府宣布，自即日起，所有進入柏林的鐵路運輸均無限期中斷。此舉震驚了西方各國，被視為對戰後秩序的嚴重挑戰。美國總統杜魯門發表聲明，誓言將不惜一切代價，確保西柏林人民的自由。」西方國家採取了大規模的空運行動，向西柏林運送物資，最終迫使蘇聯解除封鎖。請問：這場事件反映出冷戰的哪一項特徵？
  options:
  - label: A
    content: 美蘇意識形態的對立
  - label: B
    content: 美蘇軍事力量的均衡
  - label: C
    content: 美蘇避免直接衝突的態勢
  - label: D
    content: 美蘇爭奪殖民地的矛盾。
