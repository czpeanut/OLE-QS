  section: 4
  number: 4
  type: single
  page: 1
  stem: 讀完陳冠學對西北雨的描述後，瓔絡自己也上網搜尋到一些相關資訊及民間俗諺。請問下列哪一選項對照說明有誤？
  options:
  - label: A
    content: 西北雨的雨滴顆粒大且猛烈─俗諺有「一粒雨擲死人」
  - label: B
    content: 西北雨影響區域具局部性─民間有「西北雨落不過田畔」、「東邊下雨西邊晴」的說法
  - label: C
    content: 西北雨來得快也去得快，降水強度大─有「獅豹雨」、「三八雨」之稱
  - label: D
    content: 西北雨是在夏季午後、「太陽落西北」時發生的─又稱之為「及時雨」。
  lesson_raw:
    title: 田園之秋選
    basis: 題幹提及陳冠學對西北雨的描述
