- id: doc_112_高雄_林園_國文_g8s1e1_s5_5
  section: 5
  number: 5
  type: single
  page: 5
  stem: 根據上文，「順式番茄紅素」與「反式番茄紅素」最大差異為何？
  options:
  - label: A
    content: 分子量不同
  - label: B
    content: 分子形狀不同
  - label: C
    content: 分子組成不同
  - label: D
    content: 分子大小不同。
  group_stem: '提到番茄的營養成分，相信大家一定會想到「茄紅素」。茄紅素又稱為「番茄紅素」，能夠防止日晒對番茄的傷害，對番茄而言具有保護的功能。一般人認為，愈少加工處理的食物，對健康愈好，然而根據研究，番茄中的番茄紅素反而是經過烹煮後對人體幫助愈大。深究其原因，是因為番茄中的番茄紅素絕大部分是屬於「反式番茄紅素」，必須要轉化成「順式番茄紅素」才能被
    細胞好好吸收，而轉化的最好方法就是加熱。或許有人會問，為何反式番茄紅素無法吸收？其實，細胞對於物質的吸收是受到細胞膜上的受器所控制，這些受器只接受特定形狀的分子，反式番茄紅素與順式番茄紅素的差別，就是分子形狀不同。當番茄紅素變成順式時，形狀被細胞膜上的受體所接受，所以能夠順利被吸收，至於反式番茄紅素，則會直接通過消化系統，排出體外。由此可知，要由番茄中攝取番茄紅素，必須要先將番茄煮過才是。

    （節錄生活化學 快問妙答）'
  answer:
  - B
  answer_source: answer_key_vlm
