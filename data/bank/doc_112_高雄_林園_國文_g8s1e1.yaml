  stem: 在田園之秋選中「一片清新的空氣，鮮潔的色彩，彷彿聽見了貝多芬田園交響曲第四樂章牧羊人之歌」所使用的修辭是用聽覺印象表達視覺效果，與下列何項不同？
  options:
  - label: A
    content: 巷子深處，有孤獨的鞋聲響起，蕭瑟如秋天的落葉，緩緩飄墜
  - label: B
    content: 塘中的月色並不均勻，但光與影有著和諧的旋律
  - label: C
    content: 三粒苦松子，沿著路標一直滾到我的腳前，伸手抓起，竟是一把鳥聲
  - label: D
    content: 有人看到一排啞然的街燈，在風中唱了起來。
  lesson_raw:
    title: 田園之秋選
    basis: 題幹指名田園之秋選並引用課文
