  - label: D
    content: 先斥責後讚美。
  group_stem: '白樂天初舉①，以詩謁②顧況③。況睹姓名，謔④之曰：「長安百物貴，居大不易。」及讀至賦得古原草送別詩曰：「離離⑤原上草，一歲一枯榮。野火燒不盡，春風吹又生。」（古原上的野草茂盛，每年一度枯萎一度繁榮，任憑野火焚燒也燒不盡，春風吹來又蓬勃地滋生）況嘆之曰：「有句如此，居天下有甚⑥難！老夫前言戲之耳。」

    （改寫自五代王定保唐摭言知己）

    注釋:

    ①初舉：初次參加科舉考試。      ②謁：拜見。           ③顧況：中唐詩人，曾任著作郎。

    ④謔：開玩笑。                  ⑤離離：茂盛的樣子。   ⑥甚：什麼。'
