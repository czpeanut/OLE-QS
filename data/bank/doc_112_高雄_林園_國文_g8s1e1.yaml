  stem: 以下誇飾用法何者正確？
  options:
  - label: A
    content: 苻將軍自認兵多將廣，足以「投鞭斷流」，無堅不摧，不料在敵軍奇襲之下，竟然吃了大敗仗。
  - label: B
    content: 這一帶工廠密集，煙囪林立，放眼望去「七竅生煙」，嚴重汙染環境，導致百姓群起抗議。
  - label: C
    content: 王經理精明幹練，應變力極佳，此次公司面臨重大危機，幸虧他「一手遮天」，才能化險為夷。
  - label: D
    content: 這家餐飲店料好實在，服務優良，因此口碑極佳，經顧客的「眾口鑠金」，生意蒸蒸日上。
  answer:
