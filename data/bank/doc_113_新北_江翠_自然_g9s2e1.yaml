- id: doc_113_新北_江翠_自然_g9s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 如果8 月4 日這白天有艘大船要經過此步道區域，因大船吃水較深，需在水位最高點才能通過，則下列哪個時間最合適？
  options:
  - label: A
    content: 05：30
  - label: B
    content: 12：10
  - label: C
    content: 17：20
  - label: D
    content: 22：00。
  group_stem: '請在閱讀下列敘述後，回答第12-15 題：

    摩西分紅海是聖經裡神蹟顯現的經典故事，而在澎湖的奎壁山（約23.5°N），也可以看到這樣的奇景。每逢退潮之際在澎湖本島與對面赤嶼間，海水會慢慢往左右兩邊退出，露出一條玄武岩質的礫石踏浪步道。配合潮汐時間，每日分海步道的安全通行時段約為滿潮後3
    小時至乾潮後2 小時期間，天黑後封閉。另外，此處也是看日出的好地方，有不少人會選擇日出時刻搭上分海之際，感受大自然創造出的美景。

    阿翰想於暑假期間到澎湖觀賞分海，他至中央氣象署網站查詢該地的相關資料，整理如下表：


    | 109 年查詢日期 | 日出日落時刻 | 潮汐時刻 ||||

    |---|---|---|---|---|---|

    | 國曆 (月/日) | 農曆 (月/日) | 日出 | 日落 | 第一次乾潮 | 第一次滿潮 | 第二次乾潮 | 第二次滿潮 |

    | 八 / 4 | 六 / 1 | 05:39 | 18:33 | 05:28 | 12:10 | 17:38 | 23:42 |'
  shared_asset: g1_12_15
  tags:
