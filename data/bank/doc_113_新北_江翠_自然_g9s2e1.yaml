  stem: 下列有關電池的敘述，何者正確？(1-3)
  options:
  - label: A
    content: 鋰離子電池及鎳氫電池為常見的一次電池
  - label: B
    content: 鹼性電池以氫氧化鉀為電解液，使用壽命較碳鋅電池短
  - label: C
    content: 碳鋅電池，又稱乾電池，利用電流的化學效應產生能量
  - label: D
    content: 鉛蓄電池需要定期檢查硫酸水溶液高度，屬於二次電池。
