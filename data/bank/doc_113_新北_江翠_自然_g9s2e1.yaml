  page: 2
  stem: 有關於此步道與潮汐的敍述，何者正確？
  options:
  - label: A
    content: 此道路每天約有至少3 次的機會可以露出海面
  - label: B
    content: 此處潮差愈小，能露出海平面的寬度會愈寬
  - label: C
    content: 此道路每天都會在中午12 點左右露出海面
  - label: D
    content: 此道路是潮間帶的範圍。
  group_stem: '請在閱讀下列敘述後，回答第12-15 題：

    摩西分紅海是聖經裡神蹟顯現的經典故事，而在澎湖的奎壁山（約23.5°N），也可以看到這樣的奇景。每逢退潮之際在澎湖本島與對面赤嶼間，海水會慢慢往左右兩邊退出，露出一條玄武岩質的礫石踏浪步道。配合潮汐時間，每日分海步道的安全通行時段約為滿潮後3
    小時至乾潮後2 小時期間，天黑後封閉。另外，此處也是看日出的好地方，有不少人會選擇日出時刻搭上分海之際，感受大自然創造出的美景。

    阿翰想於暑假期間到澎湖觀賞分海，他至中央氣象署網站查詢該地的相關資料，整理如下表：


