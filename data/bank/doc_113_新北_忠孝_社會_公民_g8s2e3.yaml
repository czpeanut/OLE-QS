questions:
- id: doc_113_新北_忠孝_社會_公民_g8s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 某城市空氣品質惡化，市政府為改善空污問題，發布命令要求特定車齡以上的柴油車輛不得於高污染時段進入市區，違者將開罰。許多運輸業者抗議此舉影響生計，並質疑該政策未充分聽取民意，程序不當。下列關於此事件的分析，何項最符合行政法的觀點？
  options:
  - label: A
    content: 政府限制老舊柴油車進入市區，構成行政處分，違者受罰正屬行政管制不當擴權
  - label: B
    content: 此措施屬於行政管制，目的為保護多數人的環境權，雖限制部分人的權利，仍具正當性
  - label: C
    content: 行政管制屬於立法院職權，市政府無權進行限制車輛行駛的命令或處分
  - label: D
    content: 因為政府目的是保護大眾健康，因此其命令即使未符合法定程序，亦應被視為合法有效。
- id: doc_113_新北_忠孝_社會_公民_g8s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 近期多起青少年於捷運車廂、博物館等公共空間進行高分貝直播、跳舞拍攝短影音，引發其他乘客與民眾不滿。地方政府為維護秩序，依《社會秩序維護法》對相關行為人開罰，並公開部分違規者姓名，部分民眾質疑此舉有過度懲罰與侵害個資之虞。根據上述事件與課文觀點，以下敘述何項最為正確？
  options:
  - label: A
    content: 政府公布違規者姓名屬行政罰中之必要手段，不涉任何法律爭議
  - label: B
    content: 行政機關針對公共場所喧鬧進行裁罰是違憲行為，因限制人民言論自由
  - label: C
    content: 行政處罰雖為依法實施，但若手段過當或程序違失，仍可能違反依法行政原則
  - label: D
    content: 所有行政管制措施均可由行政機關裁量決定，無須受到具體法律拘束，只要目的是維護公共利益。
- id: doc_113_新北_忠孝_社會_公民_g8s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 請問下列有關「請願」與「訴願」的敘述，何項最正確？
  options:
  - label: A
    content: 請願與訴願皆屬於人民向立法機關請求救濟的手段，性質與程序相同
  - label: B
    content: 對政府具體行政處分不服，應先請願，再經訴願程序始能提起行政訴訟
  - label: C
    content: 請願主要是表達意見或請求改進措施，訴願則是針對行政處分主張權利受損
  - label: D
    content: 請願只能提出一次，訴願則沒有限制提出的次數。
- id: doc_113_新北_忠孝_社會_公民_g8s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 某地方政府為加速都市更新，強制拆除部分居民住宅，儘管部分居民正在尋求救濟程序，政府仍以「加速公共利益推動」為由逕行拆除。此舉引發社會爭議與抗議。請問：關於本案中權益受損的人民依法應有的救濟程序，下列何項判斷最為正確？
  options:
  - label: A
    content: 因都市更新屬公共利益事項，人民若不服處分，僅能向立法院陳情，無法訴願或訴訟
  - label: B
    content: 住戶如認為行政處分違法，應先向原處分機關提起訴訟，再決定是否訴願
  - label: C
    content: 人民如不服行政處分，應依序先提訴願，再提行政訴訟，以爭取權利救濟
  - label: D
    content: 行政處分只要是政府發布，依法即屬有效，人民不得對其提起法律爭訟。
- id: doc_113_新北_忠孝_社會_公民_g8s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 為維護人民的健康權益，某市政府依據《菸害防制法》對一名民眾在餐廳內吸菸開罰10,000元。上述機關對違法民眾的處罰，與下列何項受到的處罰的類型相同？
  options:
  - label: A
    content: 政府對供應不實有機農產品的廠商處以罰鍰
  - label: B
    content: 小華因超速駕駛導致車禍，被法院判處3個月有期徒刑
  - label: C
    content: 小強在網路詐騙，法院判決賠償被害人新臺幣50萬元
  - label: D
    content: 小美拒絕歸還向同事借的相機。
- id: doc_113_新北_忠孝_社會_公民_g8s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 2024年底，一名未成年少年騎乘未掛牌的電動自行車，在人行道上高速行駛，不慎撞傷一名孕婦，導致孕婦住院兩週，胎兒也受影響。警方發現少年無照駕駛、車輛未依規定掛牌，並將其家長列為連帶調查對象。受害者提出刑事告訴，並準備提起民事訴訟索賠醫療與精神損害費用。請問：針對此事件，下列關於涉案少年可能須負的法律責任與對應法律依據之敘述，何項最為正確？
  options:
  - label: A
    content: 少年屬未成年人，依法不得處罰，因此不需負任何法律責任
  - label: B
    content: 少年無照駕駛屬於違反交通法規，應負行政責任，撞傷孕婦則涉及刑事與民事責任
  - label: C
    content: 少年撞人行為屬於民事爭議，應交由交通局處理，並不涉及刑事問題
  - label: D
    content: 本案屬個人不慎，無人死亡即可免除所有責任，僅須道歉即可。
- id: doc_113_新北_忠孝_社會_公民_g8s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 知名網紅家長在社群平台上經常直播其子女的生活，包括他們在哭鬧、吃飯、甚至上廁所的片段，引起大量觀看與訂閱。但部分畫面被認為可能侵犯兒童隱私權與人格尊嚴。後續有民眾向主管機關檢舉，要求調查是否涉及對兒少的不當對待或未遵守《兒童及少年福利與權益保障法》的保護原則。請問：依據《兒童及少年福利與權益保障法》的精神，對此事件的分析何項最為正確？
  options:
  - label: A
    content: 因父母為法定監護人，直播子女內容屬私人家庭行為，不受法律規範
  - label: B
    content: 兒童隱私權非法律保護重點，只要未涉及菸酒與分級內容即不違法
  - label: C
    content: 該事件可能涉及父母未善盡保護兒少之責，應由主管機關調查是否違反相關規定
  - label: D
    content: 該行為屬創作自由，父母擁有完全決定子女網路曝光的權利，不須負法律責任。
- id: doc_113_新北_忠孝_社會_公民_g8s2e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 某國中生與交往對象互傳裸露自拍影像，分手後對方將這些影像上傳至匿名論壇，迅速在網路上擴散。該學生情緒受創，家長報警提告。請問：針對本事件，下列何項最符合《兒童及少年性剝削防制條例》之法律判斷？
  options:
  - label: A
    content: 因當事人是自願拍攝，散布者不構成性剝削罪
  - label: B
    content: 雖為自拍，但只要散布者未成年，就不會構成犯罪
  - label: C
    content: 只要影像未用於營利，不構成法律責任，屬私人糾紛
  - label: D
    content: 散布兒少裸露影像即構成性剝削，不論是否自願拍攝。
- id: doc_113_新北_忠孝_社會_公民_g8s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 近年來，許多青少年加入網路直播平台進行遊戲實況、才藝表演或販售商品，部分平台與未滿16歲者簽訂「合作分潤契約」，要求每日直播超過8小時，且安排深夜時段吸引觀眾。針對此情況，哪一選項最符合《勞動基準法》的規定？
  options:
  - label: A
    content: 只要是線上工作且非實體勞動，不受童工相關規定限制
  - label: B
    content: 若以合約合作名義進行直播，不屬勞工，不適用《勞基法》
  - label: C
    content: 雖為合作形式，若實質具備僱傭關係，仍應依《勞基法》規範童工工作時段與性質
  - label: D
    content: 直播屬娛樂性質，不需受工作時間與危害性工作規定限制。
- id: doc_113_新北_忠孝_社會_公民_g8s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 某國中發現數名學生在廁所集體吸食「能量咖啡包」，經檢驗後確認其中含有第三級毒品成分。雖然學生聲稱不知道內容物，也未造成他人傷害，家長與學校震驚不已。根據《少年事件處理法》，下列對於這些學生法律處置的判斷，何項最正確？
  options:
  - label: A
    content: 因學生未滿18歲又未觸犯刑法，不適用任何法律規範
  - label: B
    content: 因學生未實施犯罪行為，應由學校處理即可，無需報警或通報
  - label: C
    content: 吸食毒品咖啡包屬個人行為，法律無權干預
  - label: D
    content: 該行為屬於施用毒品而尚未觸法，應認定為「曝險少年」，依法進行輔導處置。
- id: doc_113_新北_忠孝_社會_公民_g8s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 某校學生於社群上貼文揚言「明天帶刀去學校教訓某人」，雖事後並未實施，警方仍前往家中搜索，發現其藏有開山刀與簡易爆裂物材料。學生家長辯稱：只是情緒發洩，並未實際傷人，不該動用法律。請問：根據《少年事件處理法》的精神，下列何項正確？
  options:
  - label: A
    content: 若未實施暴力，不論準備何種器械，都不屬法律管轄
  - label: B
    content: 雖未觸法，但因屬於犯罪預備行為，仍可依曝險少年處理原則輔導介入
  - label: C
    content: 預備犯罪僅在成人適用，少年不適用少年事件處理法
  - label: D
    content: 少年言論自由受憲法保障，網路發言不得限制。
- id: doc_113_新北_忠孝_社會_公民_g8s2e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 一名15歲少年涉嫌與兩名成年人合謀擄人勒贖，雖然未造成傷亡，但整起案件社會關注度極高。少年表示受同夥脅迫才參與。根據相關法律規定，法院處理此案時可採取下列何種做法？
  options:
  - label: A
    content: 因年滿14歲又涉及重大罪行，法院可考量是否交由檢察官起訴，接受刑事處罰
  - label: B
    content: 因少年受到脅迫，不構成犯罪，應無須送法院
  - label: C
    content: 只要同夥為成年人，少年可主張無責任能力免刑
  - label: D
    content: 少年為初犯且無傷亡，不符合移送檢察官條件。
- id: doc_113_新北_忠孝_社會_公民_g8s2e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: '下列幾個人是參與暑期科學營的同學，他們正在描述自己年齡的狀態，若不考量其他條件，單純只考慮年齡情形，這四個人年紀從大排到小的正確順序為下列何者？

    小春：雖然我現在犯罪，依刑法不必處罰，但還是會以『少年事件處理法』審理。

    小夏：下個月我就是完全責任能力人了，犯了罪要負責，舉止上要更加謹言慎行。

    小秋：明年的此時，我的年紀就符合完全行為能力人了，可以自行簽訂打工契約。

    小冬：今天過完生日以後，我就可以參與公民投票了，行使我公民上的參政權利。'
  options:
  - label: A
    content: 小冬、小秋、小夏、小春
  - label: B
    content: 小冬、小夏、小秋、小春
  - label: C
    content: 小夏、小冬、小春、小秋
  - label: D
    content: 小春、小秋、小夏、小冬。
- id: doc_113_新北_忠孝_社會_公民_g8s2e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 近年來社群平台盛行，一名年僅15歲的少年在TikTok上追求點閱率，模仿網路上的「超商挑釁影片」，在便利商店內對店員辱罵並推擠，過程中造成店員輕傷，該影片被網友轉發引起社會關注。警方依法偵辦，少年被依傷害罪與公然侮辱罪移送少年法院審理。請問，根據《少年事件處理法》以及對少年犯罪行為的相關規定，下列哪一項對該少年可能的司法處理方式最正確？
  options:
  - label: A
    content: 少年行為涉犯刑法，將依成人程序起訴，並可判處有期徒刑或拘役
  - label: B
    content: 若家長監護失職，法院將以連帶責任處罰其父母，並追究刑責
  - label: C
    content: 因少年行為嚴重，法院可直接判決入監服刑，以起警惕作用
  - label: D
    content: 法院可裁定保護管束或安置輔導，並視情節給予訓誡或感化教育。
