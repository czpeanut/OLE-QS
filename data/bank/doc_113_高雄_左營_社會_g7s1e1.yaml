  stem: 請問，何者為「自由之家」主要關心的議題？
  options:
  - label: A
    content: 經濟發展
  - label: B
    content: 文化傳承
  - label: C
    content: 人權保障
  - label: D
    content: 消費權益
  group_stem: "美國非政府組織「自由之家」（Freedom House）公布2024 年全球自由報告指出，全球自由度連續18 年下降，有缺陷的選舉與武裝衝突造成日益嚴峻的損害。台灣仍以94\
    \ 分居亞洲第2，僅次於96 分的日本；中國則仍以9分列「不自由」。\n    針對201 個國家與地區人民的政治權利與公民自由進行評比。報告指出，2023\
    \ 年，全球自由度連續第18 年下降，影響全球1/5 人口。52 個國家政治權利與公民自由被削弱，僅21 個國家有所改善。選舉普遍存在的暴力、操縱等問題，導致權利與自由惡化；武裝衝突與獨裁侵略威脅使世界變得更不安全、更不民主；在有爭議領土上的政治權利與公民自由剝奪，拖累相關國家自由；多元主義受到攻擊，但仍是社會的力量來源。報告顯示，選舉操縱是2023\
    \ 年全球自由度下降的主因之一，26 個國家因此而自由度下降。選舉操縱不僅普遍，且形式多元，其中最令人震驚的是事後推翻選舉結果。長期存在的選舉操縱為反對派創造不公平競爭環境，仍是對民主的嚴重威脅。"
