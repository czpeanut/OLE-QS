- id: doc_113_高雄_左營_社會_g7s1e1_s5_48
  section: 5
  number: 48
  type: single
  page: 6
  stem: 請問，上文中的「甲法」為何？
  options:
  - label: A
    content: 性騷擾防治法
  - label: B
    content: 性別平等工作法
  - label: C
    content: 性別平等教育法
  - label: D
    content: 校園性別事件防治法
  group_stem: "從事服務業的阿如（化名），趕在龍年計畫懷孕，希望生個龍寶寶，並希望孩子出生後，自己能親自在家照顧，因此向公司申請一年的留職停薪育嬰假，沒想到主管卻以「請假時間太長，造成其他同事困擾」為由拒絕。阿如向主管解釋，請育嬰假是她的權利，公司拒絕是違法行為，主管只好不甘不願地同意，卻附加但書，表示阿如銷假回來上班後，將調任降職，不可能擔任同樣的職位，並要求阿如簽下同意書才准假。\n\
    \    在職場上，類似阿如的女性不在少數，而且大多為了保住工作而選擇隱忍，不願意申訴，因此揭露的個案還只是冰山一角。儘管《勞動基準法》與《甲法》等法條都明訂雇主應給予產假及育嬰假，但多數的工作環境對懷孕女性依然相當不友善。甚至還有企業主私下抱怨，女性員工「假太多」，有生理假、婚假、產假、育嬰假，僱用女性「很麻煩」，因此只願意僱用男性。\n\
    \    在性別平權法律制度面漸趨完備的今日，台灣的性別歧視卻「化明為暗」，依然存在於社會的各個角落，特別是內化在許多傳統習俗中的重男輕女觀念，更是陰魂不散。學者陳昭如指出，雖然保障女性的法律制度存在，但卻難以落實到現實層面，「法律上的平等」不等於「社會上的平等」。。"
  tags:
    chapter:
      publisher: 康軒
      book: 七上
      subject: 公民
      code: 2-1
      title: 性別不平等的現象與影響
