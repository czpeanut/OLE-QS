- id: doc_113_高雄_左營_社會_g7s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 由文中小水鴨夏季繁殖季節所在地區可知，夏季時，小水鴨的棲息地在緯度大約幾度？
  options:
  - label: A
    content: 70 度
  - label: B
    content: 50 度
  - label: C
    content: 20 度
  - label: D
    content: 10 度。
  group_stem: '◎下文為小水鴨生活習性的介紹，請根據內文回答13~14 題：


    小水鴨是來自西伯利亞的冬候鳥，每年夏秋之際，從高緯度的西伯利亞往臺灣飛行，以躲避當地嚴寒的冬天。許多鳥類都有季節性遷移的特性，夏季時這些鳥在溫帶地區地方繁殖，冬季時在熱帶地區過冬

    小水鴨是雜食性動物，以水生植物、藻類、螺類、小魚小蝦或浮游為生。喜歡群聚生活在河口、沼澤、溼地、沙洲、湖泊等水域地帶。'
