  options:
  - label: A
    content: 臺灣位於亞洲大陸和太平洋的交界處，同時擁有海洋與陸地兩種不同的環境
  - label: B
    content: 橫跨熱帶與溫帶的環境，適合動植物生長
  - label: C
    content: 北回歸線橫貫台灣，許多生物在季節轉換時會來到臺灣，比如說夏季由南方北上而來的黑面琵鷺
  - label: D
    content: 因為山地多，地勢起伏落差很大，臺灣擁有不同氣候的生態
