- id: doc_113_高雄_左營_社會_g7s1e1_s2_23
  section: 2
  number: 23
  type: single
  page: 4
  stem: 請問：(甲)事件的發生的背景與下列哪一事件較有關聯？
  options:
  - label: A
    content: 日本政府實施鎖國政策
  - label: B
    content: 明朝將領防守澎湖
  - label: C
    content: 清朝政府實施海禁政策
  - label: D
    content: 西班牙人佔領雞籠、淡水。
  group_stem: '題組三 請配合對話，回答第23~26 題：

    十七世紀，發生(甲)事件後，臺灣走進國際貿易的舞臺，同時也是臺南建城的起點。臺南市政府在2024 年推出「臺南建城400 年」系列活動，邀請民眾一同認識古都的歷史。

    發貴：「聽說這次『臺南400 馬拉松』主辦單位要帶我們一起穿越時空！」

    小鷗：「簡介說賽道會途經新營、舊營(鹽水)、下營、中營、柳營等地，跑完還有獎金耶！」「原來這些地名都與某段歷史有關(乙)……。」

    發貴：「這次LOGO 的設計，據說參考『當地平埔族』的十字繡、安平夕照和熱蘭遮城的元素繪成的。今年古蹟的門票也都換成限定款的圖案。妳去孔廟的門票借我看啦！」

    小鷗：「首學孔廟留百芳，明鄭永曆府城創，禮門義路大成坊，頂簷燕尾小花窗……。」「上次我考蘭花培育執照前去拜拜，剛好聽到這首詩的作者在分享。當時是陳永華建議(丙)創設孔廟，積極辦學。」'
  shared_asset: g2_23_26
  tags:
