  stem: 領空飛越權指允許他國班機不著陸的情況下，飛越本國領空的權限。若雙方協議後，外籍班機須繳交過境航路服務費。外籍班機通過臺灣一次收一萬元。由於臺灣飛日、韓和菲律賓、越南、馬來西亞、新加坡等國平均不到4
