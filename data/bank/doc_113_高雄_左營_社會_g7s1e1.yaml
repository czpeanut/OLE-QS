  group_stem: '題組二 請配合資料及圖(三)，回答第19~22 題：

    左左學生劇團彩排年度大戲《1652》。本劇是(甲)發生於1652 年臺南赤崁的一場人民抗爭事件。劇中(乙)人物有臺灣原住民、中國漢人、荷蘭人、日本人、西班牙人、東南亞原住民……。在這一年，(丙)臺灣這片土地上，有多元的族群與多元的聲音，在激烈的碰撞下，(丁)演繹著一段為求生存而無奈、艱辛且悲傷的故事，這也考驗演員們的演技。

    柏于：「我扮演漢人的領班，也是該劇的男主角。上方圖(三)是漢人同胞要在劇中發放的傳單道具。」

    靜純：「為了製作當時國際貿易的地圖作為道具，我們可以去請教歷史老師是否有合適的素材。」'
