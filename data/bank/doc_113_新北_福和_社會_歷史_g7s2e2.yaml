- id: doc_113_新北_福和_社會_歷史_g7s2e2_s1_31
  section: 1
  number: 31
  type: single
  page: 2
  stem: 有關上述台北帝國大學的設立，下列敘述何者正確？
  options:
  - label: A
    content: 台北帝國大學二戰期間設立（1930 年代）
  - label: B
    content: 日治時期的高等教育政策主要培養台灣人自治
  - label: C
    content: 以實用為原則，偏重職業教育
  - label: D
    content: 在升學上只有少數台灣人能接受高等教育。
  group_stem: "大正7 年的「大學令」公布，在20 世紀初期日本共有包括東京、京都、東北、九州和北海道等五所帝國大學。京城帝國大學（在今日韓國首爾）是第六所，而昭和4\
    \ 年成立的台北帝國大學則是第七所。帝國大學的目的是十分清楚的，即「育成國家需要的人才」。 \n做為日本殖民地的台灣和朝鮮，在日本殖民初期的的教育方針是施予實業教育，避免給予高等普通教育。亦即認為殖民地教育應該加以限制，以免殖民地人民萌生自覺意識，是典型的愚民主義的教育主張。"
  tags:
