  stem: 有位歷史人物一生經歷過三個不同政權的統治。1895 年的乙未之役，他忍受喪國之痛；之後以仕紳的身分出面領導台灣政治社會運動。有學者評論他：「由於其良好的家世、學養及人格，又具有傳統士大夫的時代使命感，熱心參與地方事務，使這位人物進一步成為台人的共同領袖。」針對這位歷史人物事蹟下列敘述何者正確？
  options:
  - label: A
    content: 透過洋行買辦的工作，一躍成為大稻埕巨商
