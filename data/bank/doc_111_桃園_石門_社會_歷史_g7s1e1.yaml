    content: 道卡斯族。。
  group_stem: △台北捷運淡水線有「唭哩岸」一站，「唭哩岸」為該地的舊地名，原指「某個原住民族」語「Ki-Lrgan」的譯音，是「海灣」的意思。根據研究，此族的語言與菲律賓塔卡羅克語有許多一致之處。菲律賓西北有一海灣稱為「Bahialrigan」其「lrigan」與「唭哩岸」有類似之音。此外，該站附近的陽明大學於2003
    年興建大樓時，曾進行地質鑽探，挖出含有鹹水貝殼的「唭哩岸石」，證明臺北盆地內曾經是鹹水湖或海域，「唭哩岸」意涵「海灣」也因此獲得證實。
