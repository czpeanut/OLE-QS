- id: doc_113_台南_復興_社會_公民_g7s2e2_s1_50
  section: 1
  number: 50
  type: single
  page: 1
  stem: '在資訊爆炸的時代，許多年輕族群在網路世界中發展出獨特的表達方式與價值觀，例如：使用迷因梗圖溝通、不拘泥傳統規範、流行語不斷更新等。這些現象屬於「次文化」的一種展現，下列哪些敘述正確說明次文化的意涵與特性？

    甲：次文化通常來自人數較少的群體，其表現方式應避免與主流文化有所衝突。

    乙：次文化的產生會受到年齡、職業、族群、宗教等因素的影響。

    丙：「次文化」是相對於主流文化而言的分支，並非指內容或價值較低的文化。

    丁：次文化有可能也成為主流文化'
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲丙丁
  - label: C
    content: 甲乙丁
  - label: D
    content: 乙丙丁。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
  answer:
