  stem: 社群媒體興起後，許多西方娛樂與價值觀快速傳入臺灣，並逐漸成為主流。關於優勢文化與弱勢文化的互動與影響，哪一項說法最符合文化研究的觀點？
  options:
  - label: A
    content: 強勢文化的快速傳播，有助弱勢文化重建自信與影響力
  - label: B
    content: 弱勢文化因文化本質不足，容易被淘汰或自然消失
  - label: C
    content: 強勢文化多具語言、科技與制度優勢，易邊緣化其他文化
  - label: D
    content: 弱勢文化透過市場操作，通常能逆勢取代強勢文化。
  group_stem: 阿豪在學校的多元文化週中，發現同學們對韓流文化如數家珍，卻對原住民文化或新住民語言相對陌生。他開始思考：為什麼有些文化特別容易傳播、被接受？而有些文化則面臨保存與認同的挑戰？
