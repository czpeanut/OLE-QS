  stem: 隨著現代社會型態的轉變，有越來越多家庭選擇將年邁長輩送至專業機構照顧。有一位子女因忙於事業與家庭，將行動不便的雙親安置在安養中心。該子女認為此舉能提供父母更好的照護品質，此決定雖然不涉及「刑法」的遺棄罪，卻也在親友間引起兩極評價。針對上述情境，若從社會規範的觀點進行分析，以下哪兩項規範間的緊張關係最能解釋這樣的社會反應？
  options:
  - label: A
    content: 法律與倫理道德
  - label: B
    content: 法律與風俗習慣
  - label: C
    content: 宗教信仰與風俗習慣
  - label: D
    content: 風俗習慣與倫理道德。
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
  answer:
  - A
  answer_source: answer_key_vlm
