  stem: 關於飛瀑一詩中的詩句解讀，何者正確？
  options:
  - label: A
    content: 「不是失足更不是自盡」：說明懸崖的出現是出乎意料之外
  - label: B
    content: 「乘著最透徹的一刻」：表達出對自己追求的目標，了然於胸
  - label: C
    content: 「已往和未來斷然一割」：隱含「前事不忘，後事之師」的道理
  - label: D
    content: 「那一堆獰怪的亂石／全都在那下面等我」：說明人生奮鬥的路上有朋友相伴。
