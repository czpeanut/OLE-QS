  page: 1
  stem: 關於苗栗明德水庫與飛瀑二詩的說明，下列何者正確？
  options:
  - label: A
    content: 透過苗栗明德水庫的內容，我們可知作者遊歷該地的時間應為風光明媚的早晨
  - label: B
    content: 苗栗明德水庫中，作者以動襯靜的手法與詩句：「蟬噪林逾靜，鳥鳴山更幽」有異曲同工之妙
  - label: C
    content: 飛瀑開頭，作者連用兩個肯定句式，反襯水流的義無反顧、勇往直前的精神
  - label: D
    content: 飛瀑的作者以懸崖象徵人的生命目標，而水流則是表示自身對於目標的追尋歷程。
