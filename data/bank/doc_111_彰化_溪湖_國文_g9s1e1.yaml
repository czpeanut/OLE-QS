  stem: 「藉由閱讀或聆聽，這瞬間的『偶遇』，會讓詩篇重新『活』起來。」這段話的意思為何？
  options:
  - label: A
    content: 詩人的意志具有穿越時空的力量
  - label: B
    content: 詩歌中的意境常深遠感人
  - label: C
    content: 詩歌能喚起讀者心中相同的情感
  - label: D
    content: 詩歌中有其不朽的價值。
  group_stem: "詩歌除了訴諸美感之外，更訴諸情感，這是與其他藝術不同之處。經由文字傳遞，詩人的悲愁喜樂可以穿越時空，直接叩擊讀者心靈，激發迴響。藉由閱讀或聆聽，這瞬間的「偶遇」，會讓詩篇重新「活」起來。畢竟，人的情感千百年來並沒有太多改變，愛別離、怨憎會、求不得、貪嗔痴……，古人今人並無不同，這正是科技與人文的大分野。\n\
    \ （節錄自方瑜 不隨時光消逝的美）"
