  section: 1
  number: 15
  type: single
  page: 1
  stem: 南鄉子一詞傳達了對國家的熱切關懷。請問下列詩句，何者亦有此種情懷？
  options:
  - label: A
    content: 渭城朝雨浥輕塵，客舍青青柳色新。勸君更盡一杯酒，西出陽關無故人。
  - label: B
    content: 寒夜客來茶當酒，竹爐湯沸火初紅。尋常一樣窗前月，才有梅花便不同。
  - label: C
    content: 死去原知萬事空，但悲不見九州同。王師北定中原日，家祭毋忘告乃翁。
  - label: D
    content: 去年今日此門中，人面桃花相映紅。人面不知何處去，桃花依舊笑春風。
  lesson_raw:
