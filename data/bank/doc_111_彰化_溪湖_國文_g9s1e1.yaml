  stem: 關於辛棄疾   南鄉子的敘述，下列何者有誤？
  options:
  - label: A
    content: 「何處望神州？滿眼風光北固樓。」：抒發山河改易之嘆
  - label: B
    content: 「千古興亡多少事？悠悠，不盡長江滾滾流」：意近「大江東去浪淘盡，千古風流人物」的感嘆
  - label: C
    content: 「年少萬兜鍪，坐斷東南戰未休」：讚頌孫權年少有為，統領眾多軍馬
  - label: D
    content: 「生子當如孫仲謀」：期望兒子能繼承己志，成就光復神州大業。
