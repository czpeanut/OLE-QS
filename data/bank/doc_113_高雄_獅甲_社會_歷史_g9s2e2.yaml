questions:
- id: doc_113_高雄_獅甲_社會_歷史_g9s2e2_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: 美國獨立戰爭與法國大革命是近代史上影響深鉅的兩件大事，比較兩者的相似之處，何者錯誤？
  options:
  - label: A
    content: 兩者都是因為稅收問題引發抗爭
  - label: B
    content: 兩起事件都體現啟蒙運動的影響
  - label: C
    content: 兩者都激發拉丁美洲的獨立風潮
  - label: D
    content: 兩起事件皆是對王政統治的挑戰。
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 歷史
      code: 1-2
      title: 法國大革命
      chapter: 第1章 現代國家的建立
    textbook: 九下歷史 1-2 法國大革命
    labeled_by: ai
- id: doc_113_高雄_獅甲_社會_歷史_g9s2e2_s1_15
  section: 1
  number: 15
  type: single
  page: 1
  stem: 在19 世紀，世界上多個地區興起民族主義運動，影響了許多國家的統一。下列哪一個歷史事件最能體現民族主義的影響？
  options:
  - label: A
    content: 英國工業革命的開始
  - label: B
    content: 波士頓茶葉事件的爆發
  - label: C
    content: 義大利統一運動的推動
  - label: D
    content: 中華民國的軍閥混戰。
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 歷史
      code: 1-4
      title: 德國與義大利的建國
      chapter: 第1章 現代國家的建立
    textbook: 九下歷史 1-4 德國與義大利的建國
    labeled_by: ai
- id: doc_113_高雄_獅甲_社會_歷史_g9s2e2_s1_16
  section: 1
  number: 16
  type: single
  page: 1
  stem: 1994 年，非洲國家盧安達爆發嚴重內戰，交戰雙方為胡圖族與圖西族，過去在殖民時期，統治者刻意分化族群，將權力交與較少數的圖西族，激化兩族間的矛盾。盧安達建國後，胡圖族掌權，兩族間矛盾持續加深，終於在1994
    年爆發嚴重內戰，演變成盧安達大屠殺。請問：此一情況，應是下列何者所遺留的負面影響？
  options:
  - label: A
    content: 帝國主義
  - label: B
    content: 軍國主義
  - label: C
    content: 共產思想
  - label: D
    content: 民族自決。
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 歷史
      code: 2-1
      title: 19世紀帝國主義
      chapter: 第2章 帝國主義與第一次世界大戰
    textbook: 九下歷史 2-1 19世紀帝國主義
    labeled_by: ai
- id: doc_113_高雄_獅甲_社會_歷史_g9s2e2_s1_17
  section: 1
  number: 17
  type: single
  page: 1
  stem: 在近代歐洲歷史中，巴爾幹半島因頻繁發生衝突，被稱為「歐洲的火藥庫」。關於此現象的成因，何者正確？
  options:
  - label: A
    content: 巴爾幹半島位於歐洲邊緣地區，強國管理不易
  - label: B
    content: 巴爾幹半島鄰近亞非，宗教與民族性高度複雜
  - label: C
    content: 巴爾幹半島的國家大多是激進的軍國主義路線
  - label: D
    content: 因為經濟大恐慌的衝擊，使此地頻繁爆發衝突。
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 歷史
      code: 2-2
      title: 第一次世界大戰
      chapter: 第2章 帝國主義與第一次世界大戰
    textbook: 九下歷史 2-2 第一次世界大戰
    labeled_by: ai
- id: doc_113_高雄_獅甲_社會_歷史_g9s2e2_s1_18
  section: 1
  number: 18
  type: single
  page: 1
  stem: 第一次世界大戰結束後，列強於1919 年齊聚巴黎凡爾賽宮召開和平會議，期望藉由重新劃分國際秩序，以保持持久和平。然而，歐洲卻於20 年後再度陷入戰火，顯示巴黎和會未能達到其預期效果。下列何者最可能為該會議成效不彰的關鍵原因？
  options:
  - label: A
    content: 美國因門羅主義，拒絕出席巴黎和會
  - label: B
    content: 巴黎和會並未對戰敗國進行嚴厲制裁
  - label: C
    content: 戰敗國不能出席，被迫承擔巨額賠款
  - label: D
    content: 和會路線保守，只注重保守王朝的重建。
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 歷史
      code: 2-3
      title: 巴黎和會與國際聯盟
      chapter: 第2章 帝國主義與第一次世界大戰
    textbook: 九下歷史 2-3 巴黎和會與國際聯盟
    labeled_by: ai
- id: doc_113_高雄_獅甲_社會_歷史_g9s2e2_s1_19
  section: 1
  number: 19
  type: single
  page: 1
  stem: 1929 年，美國股市崩盤，進而引發全球性的經濟大恐慌，導致各國面臨嚴重失業與社會動盪，面對這場危機，不同國家出現了各種政治與社會變化。請問：下列有關這場經濟危機影響的敘述，何者正確？
  options:
  - label: A
    content: 致使俄羅斯爆發革命，建立史上第一個共產國家
  - label: B
    content: 美國股市崩盤經濟衰退，失去國際強權地位
  - label: C
    content: 許多國家因此走上極端激進路線，如日本與德國
  - label: D
    content: 導致帝國主義抬頭，亞非許多地區遭到殖民。
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 歷史
      code: 3-1
      title: 戰間期的政經發展
      chapter: 第3章 戰間期與第二次世界大戰
    textbook: 九下歷史 3-1 戰間期的政經發展
    labeled_by: ai
- id: doc_113_高雄_獅甲_社會_歷史_g9s2e2_s1_20
  section: 1
  number: 20
  type: single
  page: 1
  stem: 英國前首相邱吉爾曾在1930 年代，抨擊當時政府的對外政策：「在戰爭與屈辱之間，你選擇了屈辱，但屈辱之後，你仍將面對戰爭。」此言論主要針對當時政府所採取的何種外交方針提出批評？
  options:
  - label: A
    content: 孤立主義
  - label: B
    content: 姑息政策
  - label: C
    content: 共產主義
  - label: D
    content: 門羅宣言。
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 歷史
      code: 3-2
      title: 第二次世界大戰
      chapter: 第3章 戰間期與第二次世界大戰
    textbook: 九下歷史 3-2 第二次世界大戰
    labeled_by: ai
- id: doc_113_高雄_獅甲_社會_歷史_g9s2e2_s1_21
  section: 1
  number: 21
  type: single
  page: 1
  stem: 第二次世界大戰結束後，蘇聯在東歐與東亞的影響力迅速擴張，不僅建立多個親蘇政權，也在亞洲地區取得重要戰略利益。此一局勢的形成，與戰時同盟國之間的協議密切相關。請問：促成蘇聯戰後勢力範圍大幅擴張的最主要會議是下列何者？
  options:
  - label: A
    content: 雅爾達會議
  - label: B
    content: 巴黎和會
  - label: C
    content: 維也納會議
  - label: D
    content: 開羅會議。
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 歷史
      code: 3-2
      title: 第二次世界大戰
      chapter: 第3章 戰間期與第二次世界大戰
    textbook: 九下歷史 3-2 第二次世界大戰
    labeled_by: ai
- id: doc_113_高雄_獅甲_社會_歷史_g9s2e2_s1_22
  section: 1
  number: 22
  type: single
  page: 1
  stem: 第二次世界大戰後，國際局勢逐漸形成兩大強權主導的對峙狀態，雙方在軍事、外交、經濟、科技等各領域相互競爭，卻又避免直接爆發全面戰爭。這段長期緊張對立的時期，被稱為「冷戰」。關於冷戰局勢的相關敘述，下列何者正確？
  options:
  - label: A
    content: 是共產制度與帝國主義的對抗
  - label: B
    content: 雙方均握有核武因此不敢輕易開戰
  - label: C
    content: 以美國與中國為首形成兩大陣營
  - label: D
    content: 美國以北大西洋公約組織防堵敵方。
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 歷史
      code: 4-1
      title: 冷戰時代
      chapter: 第4章 第二次世界大戰後的國際局勢
    textbook: 九下歷史 4-1 冷戰時代
    labeled_by: ai
- id: doc_113_高雄_獅甲_社會_歷史_g9s2e2_s1_23
  section: 1
  number: 23
  type: single
  page: 1
  stem: 第二次世界大戰爆發前，日本、德國與義大利組成了軍事聯盟「軸心國」，號稱要讓世界以東京、柏林與羅馬為軸心運轉。請問：下列何者是促成三國結盟的背景原因之一？
  options:
  - label: A
    content: 三國都是民主國家，希望共同發展經濟
  - label: B
    content: 三國希望加入國際聯盟以維持世界和平
  - label: C
    content: 三國長期合作，共同參與第一次世界大戰
  - label: D
    content: 三國都反對共產主義，並有對外擴張的野心。
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 歷史
      code: 3-2
      title: 第二次世界大戰
      chapter: 第3章 戰間期與第二次世界大戰
    textbook: 九下歷史 3-2 第二次世界大戰
    labeled_by: ai
- id: doc_113_高雄_獅甲_社會_歷史_g9s2e2_s1_24
  section: 1
  number: 24
  type: single
  page: 1
  stem: 第二次世界大戰結束後，世界各地仍有多次區域性戰爭，例如韓戰、越戰、中東衝突等。這些戰爭背後，常見意識形態對立與軍事援助的影子，學者稱之為「代理人戰爭」，時至今日朝鮮半島、中東地區，依舊持續發生對立與衝突。請問：上述情形的成因，應為下列何者？
  options:
  - label: A
    content: 社會達爾文主義的遺留
  - label: B
    content: 法西斯主義的作祟
  - label: C
    content: 經濟大恐慌的衝擊
  - label: D
    content: 冷戰局勢的影響。
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 歷史
      code: 4-1
      title: 冷戰時代
      chapter: 第4章 第二次世界大戰後的國際局勢
    textbook: 九下歷史 4-1 冷戰時代
    labeled_by: ai
- id: doc_113_高雄_獅甲_社會_歷史_g9s2e2_s1_25
  section: 1
  number: 25
  type: single
  page: 2
  stem: 1954 年，美國為了防堵共產勢力擴張，在東南亞成立東南亞公約組織，但成員國中卻僅有泰國與菲律賓為東南亞國家，其餘國家皆未加入，導致組織效力不彰，於1977
    年解散。而印尼、馬來西亞等五國則在1967 年另外成立了東南亞國家協會，強調區域穩定與互助，並拒絕東南亞以外國家加入。請問：從東南亞公約組織的失敗，到東南亞國協的成立，可以看出下列何者的影響？
  options:
  - label: A
    content: 孤立主義
  - label: B
    content: 冷戰局勢
  - label: C
    content: 不結盟運動
  - label: D
    content: 共產主義。
  tags:
    chapter:
      publisher: 翰林
      book: 九下
      subject: 歷史
      code: 4-1
      title: 冷戰時代
      chapter: 第4章 第二次世界大戰後的國際局勢
    textbook: 九下歷史 4-1 冷戰時代
    labeled_by: ai
- id: doc_113_高雄_獅甲_社會_歷史_g9s2e2_s1_26
  section: 1
  number: 26
  type: single
  page: 2
  stem: 東德一位民眾在1989 年日記中寫道：「今天在電視上看到波蘭自由選舉的消息，朋友說捷克也開始有人走上街頭。匈牙利的邊界似乎也開始開放了。聽說蘇聯這次不會出兵，我們真的有可能看到改變嗎？」這段文字反映出當時東歐共產政權開始瓦解的現象。請問：造成上述局勢出現，與哪一位蘇聯領導人的政策最密切相關？
  options:
  - label: A
    content: 史達林
  - label: B
    content: 列寧
  - label: C
    content: 普丁
  - label: D
    content: 戈巴契夫。
  tags:
