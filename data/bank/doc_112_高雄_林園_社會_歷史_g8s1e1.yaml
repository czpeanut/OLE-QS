- id: doc_112_高雄_林園_社會_歷史_g8s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 1
  stem: 中國長城為世界文化遺產之一，它在中國歷史上，與北方草原民族互動中扮演相當重要的角色。下列關於「長城」的敘述，何者正確？ (習作)
  options:
  - label: A
    content: 秦朝時為防禦北方匈奴族的入侵，增築城牆成「長城」
  - label: B
    content: 「長城」是漢武帝時連結秦代所修的城牆，增築而成的
  - label: C
    content: 漢朝時期，「長城」完全發揮抵禦草原民族入侵的功能
  - label: D
    content: 「長城」是依秦朝疆域而修築，以防禦四周的草原民族
  answer:
  - A
  answer_source: answer_key_vlm
- id: doc_112_高雄_林園_社會_歷史_g8s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 1
  stem: 周王朝的貴族依據身分差異可分為不同階層，各階層使用的音樂、舞蹈及儀仗隊等方面，都有明確的限制及規定，不同身分的貴族也遵守不同的禮樂規範，請問：周王朝制訂此規範的目的何在？
    (習作)
  options:
  - label: A
    content: 提供貴族享樂的機會
  - label: B
    content: 解決地方封土的爭議
  - label: C
    content: 確保封建秩序的穩固
  - label: D
    content: 避免地方動亂的爆發
  answer:
  - C
  answer_source: answer_key_vlm
- id: doc_112_高雄_林園_社會_歷史_g8s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 1
  stem: 周朝建立統治政權以來，除了承認友好國家外，統治者為管理新取得的疆土，便賜予以同姓和姻親為主的貴族土地及治理地方的權力，藉此穩固統治。上述所指的統治措施應為何者？
    (習作)
  options:
  - label: A
    content: 推舉孝廉
  - label: B
    content: 實施封建
  - label: C
    content: 設置郡縣
  - label: D
    content: 推行科舉
  answer:
  - B
  answer_source: answer_key_vlm
- id: doc_112_高雄_林園_社會_歷史_g8s1e1_s1_19
  section: 1
  number: 19
  type: single
  page: 1
  stem: 林園中學的校園矗立著一尊孔子塑像，小明想起歷史第一課有提到孔子是第一個把教育帶到民間的人，在教學上強調「有教無類」、「適材而教」，在政治上主張國君應行「仁政」。請問孔子是哪家學術思想的代表人物？
  options:
  - label: A
    content: 法家
  - label: B
    content: 儒家
  - label: C
    content: 墨家
  - label: D
    content: 道家
  answer:
  - B
  answer_source: answer_key_vlm
- id: doc_112_高雄_林園_社會_歷史_g8s1e1_s1_20
  section: 1
  number: 20
  type: single
  page: 1
  stem: 秦王嬴政滅六國統一天下，建立史無前例的大一統國家，推行了很多制度，可惜歷史評價大都是負面的評斷，下列哪一個是秦王嬴政所建立的事蹟?
  options:
  - label: A
    content: 創立科舉制
  - label: B
    content: 獨尊儒術
  - label: C
    content: 統一文字
  - label: D
    content: 行封建制度
  answer:
  - C
  answer_source: answer_key_vlm
- id: doc_112_高雄_林園_社會_歷史_g8s1e1_s1_21
  section: 1
  number: 21
  type: single
  page: 1
  stem: 張騫原本為了聯合草原民族出使西域，結果卻意外的讓中國開始重視經營西域，開通了一條東西貿易往來的絲路，西漢末年哪一個普世宗教傳入中國，甚至傳進東北亞影響亞洲民族的信仰？
  options:
  - label: A
    content: 道教
  - label: B
    content: 基督教
  - label: C
    content: 伊斯蘭教
  - label: D
    content: 佛教
  answer:
  - D
  answer_source: answer_key_vlm
- id: doc_112_高雄_林園_社會_歷史_g8s1e1_s1_22
  section: 1
  number: 22
  type: single
  page: 1
  stem: 中央集權的政治制度更需要建立選才制度輔佐執行，選才制度也在歷史上造就了世族的興起。哪一個選才制度造成「上品無寒門，下品無世族」的弊端？
  options:
  - label: A
    content: 推舉孝子、廉吏
  - label: B
    content: 九品官人之法
  - label: C
    content: 科舉考試制度
  - label: D
    content: 身分世襲制度
  answer:
  - B
  answer_source: answer_key_vlm
- id: doc_112_高雄_林園_社會_歷史_g8s1e1_s1_23
  section: 1
  number: 23
  type: single
  page: 1
  stem: 紙是一種非編制薄片，傳統上是由處理過的植物纖維和紡織纖維組合而成，主要用於書寫、藝術創作和包裝，通常呈白色。大約在公元前3000 年，古埃及人就開始使用莎草紙，並將這種特產出口到古希臘等古代地中海文明地區，甚至遙遠的歐洲內陸和西亞。莎草紙消亡以後，製作莎草紙的傳統技術也因缺乏記載而失傳。
    根據中國史料記錄，中國地區最早的造紙工藝見於東漢時期（公元25-220 年），歸功於宮廷官員蔡倫。本來中國獨佔製造紙張的秘密，卻因唐朝與何國作戰失敗，造成造紙術西傳？
  options:
  - label: A
    content: 大食
  - label: B
    content: 大秦
  - label: C
    content: 新羅
  - label: D
    content: 吐蕃
  answer:
  - A
  answer_source: answer_key_vlm
- id: doc_112_高雄_林園_社會_歷史_g8s1e1_s1_24
  section: 1
  number: 24
  type: single
  page: 1
  stem: 元稹是唐代著名詩人，他與另一位詩人白居易同科及第，兩人結為終生詩友，世稱「元白」。依據學者的考證，元稹的祖先原本出自皇室，後來因為朝廷推動漢化的關係，才改為漢姓「元」。請問元稹的祖先之所以更改姓氏，應該是遵守何人的命令？
  options:
  - label: A
    content: 秦始皇
  - label: B
    content: 漢武帝
  - label: C
    content: 唐太宗
  - label: D
    content: 北魏孝文帝
  answer:
  - D
  answer_source: answer_key_vlm
- id: doc_112_高雄_林園_社會_歷史_g8s1e1_s1_25
  section: 1
  number: 25
  type: single
  page: 1
  stem: 今日臺灣的國民一出生就得要通報戶口，依此製作戶口名簿與戶籍謄本，每位國民也都擁有身分證。在男性成年之後，政府也會依戶口資料徵調男性國民服兵役，同時也會根據各人所得明細徵稅。其實這種概念在東周時代便已有紀錄，當時的各國也依人口調查資料徵調勞役或是徵兵，兩個時代之間的概念十分類似。在東周時何人大力推行編列戶籍制度？
  options:
  - label: A
    content: 商鞅
  - label: B
    content: 嬴政
  - label: C
    content: 張騫
  - label: D
    content: 劉邦
  answer:
  - A
  answer_source: answer_key_vlm
