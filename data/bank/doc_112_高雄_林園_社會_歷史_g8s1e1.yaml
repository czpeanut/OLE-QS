  stem: 蘇秦師從鬼谷子，四處求仕未果，便苦讀兵法，疲累時刺股提神（懸樑刺股由來）。 蘇秦學成後遊歷諸國，在秦國遭拒後，轉而遊說諸國抗秦，主張「合眾弱以攻一強」，掌六國相印風光一時，是「布衣卿相」的代表。請問：蘇秦是下列哪一個時代的代表人物？
