  stem: 中華文化號稱歷史五千年，掌權的統治者常以歧視的眼光看待異族文化，引來異族不滿甚至叛變。西晉末年發生何項事件，導致西晉最後國勢衰落滅亡也讓中國經濟重心逐漸南移？
