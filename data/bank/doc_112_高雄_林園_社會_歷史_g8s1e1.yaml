  stem: 歷史老師上課時教唱著朝代歌，歌詞中「秦後是兩漢魏晉南北朝」其中的漢就是象棋棋盤中「楚河漢界」裡面的漢王，他體恤百姓歷經秦末大亂的勞苦，建立漢朝，下令減輕賦役讓百姓休養生息。請問下列何者是漢王？
