  stem: 福原愛（日語：福原 愛／ふくはらあい）日本宮城縣仙台市人，前日本女子桌球運動員，國際桌球總會世界排名單打最高為第4 名（2015 年10 月）與同是桌球台籍選手婚後定居高雄，原本的神仙眷侶近年卻為了監護權大打跨海官司鬧上國際新聞版面。福原愛的名字和中文的相似度極高，日本曾在七世紀時推行何項運動，以中國的典章律令為藍本？
