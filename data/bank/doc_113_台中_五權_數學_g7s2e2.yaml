  stem: '2025 年白沙屯媽祖前往北港進香活動，味丹企業和金門酒廠今年再攜手白沙屯媽祖推出A、B、C 三款紀念酒，向媽祖的溫暖慈悲及勇腳們無所懼的精神致敬。

    A 款:「戰酒黑金龍特窖陳高．白沙屯媽祖紀念酒—乙巳」容量500 毫升，酒精度49.9 度，每盒售價1980 元。

    B 款:「戰酒黑金龍．白沙屯媽祖勇腳紀念酒」容量500 毫升，酒精度49.9 度，每盒售價 1980 元。

    C 款:「戰酒黑金龍．白沙屯媽祖勇腳紀念酒—乙巳」 容量600 毫升，酒精度46 度，每盒售價 590 元。


    (1) 金門酒廠所生產的58 度高粱酒，表示100 毫升的高粱酒含有58 毫升的酒精，請問瓶裝600 毫升46 度的C 款紀念酒含有多少毫升的酒精？(3 分)

    (2) 穿普和朋友合購此三款紀念酒，A 款買X 盒，B 款買Y 盒，C 款買2 盒，共花了28900 元，且X：Y＝3：4，請問共買了幾盒B 款紀念酒？(3
    分)'
  answer:
  - (1) 276 毫升
  - (2) 8 盒
