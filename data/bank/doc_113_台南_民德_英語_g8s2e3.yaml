  group_stem: "Two Interesting Jobs\n    “What do you want to be in the future?” Students\
    \ in the last year of junior high school are often asked this question. Here are\
    \ two jobs students may be interested in.\n    The first job is a pet communicator\
    \ who can understand pets’ needs and make them happy and comfortable. They can\
    \ go to the owners’ houses to deal with their pets’ problems. Although no studies\
    \ show pet communicators are able to “talk” with pets, many owners still pay money\
    \ for the service. Popular pet communicators can make NT$2,000 every hour. Before\
    \ being pet communicators, people need to take training lessons for months and\
    \ pass several tests. These lessons cost money and take time. If you want to be\
    \ a good pet communicator, having great patience is a must. After all, pets can’t\
    \ really “talk.” Pet communicators have to focus on them all the time.\n    The\
    \ other job is a professional organizer who helps people to keep their places\
    \ tidy and clean. They give your house or office a makeover. They know throwing\
    \ things away is difficult for some people. Their training helps them talk those\
    \ people into feeling comfortable to say goodbye to useless things. To be a professional\
    \ organizer, people also need to be trained for months and pass several tests.\
    \ A full-time professional organizer makes NT$100,000 every month. Even those\
    \ who work only on weekends can make NT$20,000 to $30,000.\ncommunicator 溝通師 focus\
    \ 專注 professional organizer 居家整理收納師 makeover 改造"
