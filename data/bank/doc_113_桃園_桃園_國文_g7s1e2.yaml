    \    當我們動手指頭就能與世界連線，國際交流再也不是耗費鉅額機票的奢侈品，而是校校都能嘗試、既便利又頻繁的課程類型。反過來看，交流機會變多以後，若還只是反覆和國外學生進行形式上寒暄，一而再介紹珍珠奶茶、臭豆腐，有點可惜。\n\
    \    那麼，好的國際教育該怎麼做？\n    多年來投入其中的教育部退休參事、《中小學國際教育白皮書2.0》主要規劃者邱玉蟾這麼說：美國、澳洲等國都已把國際教育放入課綱，教育部推出首份《中小學國際教育白皮書1.0》至今也十多年，多校對「如何將國際融入課程」已有一定認知基礎。如何不讓國際教育徒具形式，而是培養真正的國際觀，是下一步值得關注的事。\n\
    \    國際教育的本質是體驗，把學生放到體驗式情境學習，最後得到素養。如果只是單純出國旅遊，不一定能得到素養。體驗是需要設計的，老師和學校最重要的工作，就是理解國際教育本質，接著設計一適當的體驗學習、課程目標，然後用對的執行方式，有效引導學生在過程中觀察和反思。\n\
    \    這樣的體驗教育，和教育學家杜威（John Dewey）一九一六年在著作《民主與教育》提及內容、一〇八課綱強調的探究與實作，都有一樣的精神。\n \
    \   聯合國提出十七項永續發展指標SDGs 後，不少學校的做法，是一學期內帶到全部十七項，落實接軌國際的精神很好，但學生是否真的能吸收？學校可以因地制宜，譬如山裡的學校，不一定要帶海洋教育，在更貼近學生生活的項目多著墨，他們能學更多。\n\
    \    真實且有深度的國際教育，能為學生帶來四個好處，首先語言能力確實變強；再來是拓展國際視野，眼界更開闊；接著能提升國際包容力，尊重不一樣的人；最後是變勇敢，更願意跨出舒適圈，不畏懼走向世界。\n\
    \                                                    \n摘錄自 《翻轉教育網站》潘乃欣採訪整理"
