  group_stem: "(二)\n    顏淵、季路侍。子曰：「盍各言爾志？」子路曰：「願車、馬、衣、輕裘，與朋友共。敝之而無憾。」顏淵曰：「願無伐善，無施勞。」子路曰：「願聞子之志。」子曰：「老者安之，朋友信之，少者懷之。」\n\
    \    讀論語我特別喜歡這一篇。每次讀到、教到這篇，心中都不自主浮現兩個問題：為何孔子會在身旁只有這兩位學生時問這個問題？孔子難道不是事先預料到子路會反問自己？\n\
    \    顏回、子路二人都是孔夫子的得意門生，卻也是兩種不同的典型：一個是超級好學生、一個是調皮惹人愛。或許老人家是想看看二人的志向是否與其個性相關。再者，依照對子路個性的了解，順便利用子路的勇於發問，而向兩位得意門生說說自己的志向也不無可能。\n\
    \    從搶著回答的子路所說的話來看，我們的確可以看出其直爽的個性！我相信，能做到「車馬、衣輕裘，與朋友共」的人其實不在少數。但能做到「敝之而無憾」的人可能就是少數了。當然，這一點我對子路是有信心的。因為這是個性！\n\
    \    至於「無伐善，無施勞」，多數人將之視為顏回謙虛的本性。這點我就有不同的意見了。因為，我實在懷疑謙虛是否可能是人的「本性」？孔子並不奢望世間有太多的聖人，而是希望「經由後天的學習」成為君子。「伐善」與「施勞」才是人的天性，顏回看見自己的（也是所有人的）天性，他才會「願」無伐善，無施勞。我認為這也正是孔子欣賞顏回的原因。\n\
    \    相較於兩位得意門生，孔子的回答就顯得境界更高了。子路的回答展現出自己直爽的個性，顏回的回答為自己立下一個修養的目標，但，這二人的「志」都還是以自身為出發點。孔夫子的「老者安之，朋友信之，少者懷之」則反映出其淑世的終極目標。或許，他老人家對兩位高徒了解甚深，想要藉由這「刻意」的對話中，讓子路與顏回理解自己的「志」之所在，也藉此讓他們可以更上一層樓。\n\
    \                                                 \n 〈那場刻意的對話〉  國文老師"
