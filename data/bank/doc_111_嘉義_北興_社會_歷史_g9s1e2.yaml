  section: 1
  number: 1
  type: single
  page: 1
  stem: 請問上面新聞所述的主角教宗方濟各(Pope Francis) ，應該是哪一個教派的領袖？
  options:
  - label: A
    content: 猶太教
  - label: B
    content: 天主教
  - label: C
    content: 希臘正教
  - label: D
    content: 英國國教。
  group_stem: 梵蒂岡樞機主教團8 月29 日起在羅馬舉行兩天閉門會議。由於85 歲的教宗方濟各(Pope Francis)近年受到一些健康問題困擾，之前也曾透露不排除會考慮退位。因此，外界認為，這次會議可能有如選舉新教宗的彩排。世界各地的樞機主教在8
    月27 日聚集梵蒂岡召開樞機主教會議(consistory)，教宗方濟各這次擢升了20 位新樞機主教(紅衣主教)。接著在29 日登場的兩天樞機主教閉門會議更受到關注。分析家認為，這場閉門會議可能會為教宗密選會議(conclave)進行彩排，以便在方濟各去世或辭職後，選擇繼任者。
  tags:
    chapter:
      publisher: 翰林
      book: 九上
      subject: 歷史
      code: 3-2
      title: 基督教的起源與傳布
