    在臺灣，以69 所學校中三、五、七年級學生為樣本進行統計，發現有9%的孩子是ADHD。這些孩子們日常學習及生活中會面臨到許多的問題，如成績低落、情緒控管、與同學的互動關係及家庭親子相處等。甚至使用酒精或藥物、吸菸、網路成癮等方式來逃避人生。

