- id: doc_113_台中_大業_自然_g7s1e3_s1_38
  section: 1
  number: 38
  type: single
  page: 5
  stem: 下列何種狀況較不會是ADHD 表現出來的行為特徵？
  options:
  - label: A
    content: 難以調節自己的情緒
  - label: B
    content: 過動、衝動，無法靜下來
  - label: C
    content: 忘了該完成的事或責任，導致功課沒有完成
  - label: D
    content: 完全無法與外界溝通。
  group_stem: '請閱讀下列敘述後，回答38~40 題：

    ADHD（注意力不集中過動症）常出現的行為有：①注意力缺損，做事做到一半容易分心，一旦被其他事打斷，就忘了該完成的事。因此，大眾往往會認為他們缺乏自我監控、沒有時間觀念等。②過動與衝動，此為他們抑制能力的缺損所導致，行為上會出現愛插話、靜不下來、做決定很匆促、不考量後果為何，以及自我情緒調節出現問題等。

    在臺灣，以69 所學校中三、五、七年級學生為樣本進行統計，發現有9%的孩子是ADHD。這些孩子們日常學習及生活中會面臨到許多的問題，如成績低落、情緒控管、與同學的互動關係及家庭親子相處等。甚至使用酒精或藥物、吸菸、網路成癮等方式來逃避人生。

    神經心理學分析ADHD 行為表徵了解認知表現出了什麼問題，再研究相對應的腦神經網絡，發現幾個問題，例如：認知行為的控制及專注力，可能和大腦的前額葉及同屬於中樞神經系統的紋狀體神經迴路整合有關；又如：時間觀念的掌控能力，則關係到大腦的前額葉及小腦的迴路。

    在治療時所使用的藥物，常見的有methylphenidate 和atomxetine，前者改善抑制功能問題，後者主要改善專注力。利用MRI(磁振造影檢查)對腦部做觀察，發現兩者對大腦改善的部位真的不一樣。而在藥物治療的過程中，醫生也要密切留意患者的表現有無改善，以及腦的迴路是否改變，才可有效進行。'
