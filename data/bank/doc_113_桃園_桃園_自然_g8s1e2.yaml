  stem: '附表為兩種動物所能聽見聲音的頻率範圍。在空氣中聲波波速為 340 m／s 的環境下，若發出波長為 100 cm，且音量足夠大的聲波，則參閱表中的資訊，下列有關此兩種動物是否能聽到此聲波的敘述何者最合理？


    | 動物 | 聽覺頻率範圍（Hz） |

    | --- | --- |

    | 大象 | 16～12000 |

    | 兔子 | 360～42000 |'
  options:
  - label: A
    content: 都聽得到此聲波
  - label: B
    content: 都聽不到此聲波
  - label: C
    content: 大象聽得到，而兔子聽不到
  - label: D
    content: 兔子聽得到，而大象聽不到
  tags:
