- id: doc_113_桃園_桃園_自然_g8s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '班上有四個同學在討論波的課程內容

    小明：手擺動得愈慢，週期愈大，頻率愈小。

    小華：大聲喊叫的聲音比小聲交談的聲音傳得更遠。

    小新：相同環境下，頻率高和頻率低的聲波，其傳遞波的速率不同。

    小傑：回聲的波長、頻率、波速皆不變，但振幅會改變。

    關於四個同學的討論正確與錯誤，選出適合的選項'
  options:
  - label: A
    content: 小明正確、小華正確、小新正確、小傑正確
  - label: B
    content: 小明錯誤、小華正確、小新正確、小傑錯誤
  - label: C
    content: 小明正確、小華正確、小新錯誤、小傑正確
  - label: D
    content: 小明正確、小華錯誤、小新錯誤、小傑錯誤
  tags:
    chapter:
      publisher: 翰林
      book: 八上
      subject: 理化
      code: 3-3
      title: 多變的聲音
      chapter: 第3章 波動與聲音
    textbook: 八上理化 3-3 多變的聲音
    labeled_by: ai
