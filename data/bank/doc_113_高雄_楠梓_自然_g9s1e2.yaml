  - label: B
    content: 動脈、食道、大腸
  - label: C
    content: 靜脈、大腸、小腸
  - label: D
    content: 動脈、食道、小腸。
  group_stem: '在臺灣，常常可以看到許多攤販、小吃店在招牌上寫著大大「黑白切」三字，店家案頭前會放著很多不同的內臟與肉類部位，點餐單上甚至還會有許多神秘的名詞：「脆管」、「脆腸」和「粉腸」等。這些彷彿黑話的名詞，聽起來好像差不多，但其實都代表著不同的解剖部位，吃進嘴裡的口感與滋味也有很大不同。

    我們一起來揭秘幾種黑白切菜單上、五花八門的常見名稱，逐一認識對應的器官部位。

    ★脆管：脆管的管壁由三層膜組成，除了肌肉組織外，大部分是由彈性纖維和少量的膠原纖維組成，與心臟相連，因需要承受血壓最大，所以具有非常強的彈性與韌性。

    ★軟管：因口感較軟，故稱為軟管。在軟管一端，與咽相連，另一端，則與胃相接。

    ★粉腸：粉腸內有許多絨毛，以增加吸收的表面積，是許多養分被消化與吸收最主要的場所。'
  shared_asset: g2_34_35
  answer:
  - D
  answer_source: answer_key_vlm
  tags:
