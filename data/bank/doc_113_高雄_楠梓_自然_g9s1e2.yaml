  section: 1
  number: 4
  type: single
  page: 1
  stem: '奇奇取了四支試管，加入等量的受質後，再依下表添加不同量的酵素、置於不同的環境溫度中，一小時後記錄產物重量如下表所示，請依下表選出錯誤的敘述為何？


    | | 酵素量 | 環境溫度 | 產物 |

    | :-: | :-: | :-: | :-: |

    | 試管甲 | 2 mL | 40 ℃ | 20 g |

    | 試管乙 | 2 mL | 80 ℃ | 5 g |

    | 試管丙 | 4 mL | 25 ℃ | 10 g |

    | 試管丁 | 4 mL | 40 ℃ | 20 g |'
