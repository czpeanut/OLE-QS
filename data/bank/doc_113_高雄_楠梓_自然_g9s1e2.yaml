- id: doc_113_高雄_楠梓_自然_g9s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '(甲)一種酵素能催化多種化學反應；(乙)酵素為生物體內的催化劑，可以加快反應速率；(丙)酵素由細胞本身產生，可在生物體內或體外發揮作用；(丁)酵素具專一性，一個酵素只能與單一反應物作用；(戊)酵素主要成分為蛋白質，遇高溫會破壞結構而失去作用，即使再調降溫度仍無作用；(己)只要控制好溫度，酸鹼值不會影響酵素活性；(庚)一個酵素只能作用一次，不能重複作用。

    上述有關酵素特性的敘述，哪些是正確的？'
  options:
  - label: A
    content: 甲乙丁
  - label: B
    content: 乙丙戊
  - label: C
    content: 乙丙丁戊庚
  - label: D
    content: 乙丁戊己庚
  answer:
  - B
  answer_source: answer_key_vlm
