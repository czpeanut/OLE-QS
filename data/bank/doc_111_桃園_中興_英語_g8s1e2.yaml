  group_stem: "Most people know that fruit and vegetables are very important for a\
    \ healthy diet. However, to keep good eating \nhabits is hard for some people.\
    \ They may be too busy, and they only eat fast food. Here are some tips to help\
    \ you to eat \nenough fruit and vegetables.  \n     First, try a glass of juice\
    \ rather than milk tea for breakfast. It is healthier to eat sandwiches with some\
    \ tomatoes or \nlettuce. Use your snack time to enjoy a fruit or veggie salad\
    \ with fat-free yogurt. For lunch, have a bowl of tomatoes or \nveggie soup, or\
    \ a pizza with many vegetables on it. Before you cook dinner, prepare a bowl of\
    \ fresh veggies and then put \nit on the table with dinner. You may be surprised\
    \ how easy it is to eat enough vegetables and fruit this way.  \n     Sweet fruit\
    \ can be a kind of dessert. You can have it with yogurt, ice cream, or all by\
    \ itself. If you follow these tips, \nyou can easily keep good eating habits.\
