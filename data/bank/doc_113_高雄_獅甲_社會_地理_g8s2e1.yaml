  stem: 西元 2021 年新聞報導：「印度宗教盛事『大壺節』，在新冠肺炎(COVID-19)疫情中還是照常舉行，第一天就擁入 70 萬人朝聖，現場人山人海。大壺節的由來相傳是神明和群魔為爭奪一個裝有長生不老藥的壺而大打出手，結果把壺打翻，4
