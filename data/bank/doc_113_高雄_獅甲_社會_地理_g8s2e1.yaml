- id: doc_113_高雄_獅甲_社會_地理_g8s2e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 在一帶一路政策下，中國將國內高鐵系統技術對外輸出，雖然中國興建高鐵的技術已相當純熟，但在印尼興建仍需克服當地環境不同而有所調整，下列何種因素是雅萬高鐵興建評估過程中最不需要考慮的？
  options:
  - label: A
    content: 因應強降水的排水系統
  - label: B
    content: 山坡滑動偵測系統
  - label: C
    content: 增強抗震係數
  - label: D
    content: 除雪設施
  group_stem: '一帶一路金字招牌 ―― 印尼「雅萬高鐵」

    東南亞第一條高速鐵路「雅萬高鐵」於 2016 年破土動工，原訂在 2019 年通車，但數次推遲後工期延至 2023 年 10 月正式營運。該建設連接印尼首都雅加達及第四大城萬隆，全長
    142 公里，共設有 4 站，開通後兩地之間的交通時間從 3 小時縮短到 45 分鐘左右，其路線及站點如附圖所示。

    搭乘印尼雅萬高鐵的乘客常會產生一種在中國搭高鐵的錯覺，高鐵車廂內不僅可見簡體中文字，設備與服務也類似於中國國內的高鐵。事實上，雅萬高鐵是由中國承攬建設，也是中國高鐵第一次「全系統、全要素、全產業鏈在海外落地」，象徵中國高鐵系統輸出到東南亞，更被中國形容為兩國在「一帶一路」外交戰略中成功合作的金字招牌，也為基礎設施和產能領域的國際合作樹立新的標竿。

    但光鮮亮麗的背後，印尼當地的專家學者及環保倡議團體也勇於揭露雅萬高鐵興建過程中對當地環境破壞、施工過程對居民造成損害等問題，如：高鐵隧道切斷山泉水源、隧道爆破震裂房屋、鐵路沿線徵地產生爭議、興建過程不善導致水災及土石流等。

    依據上文，請回答第16、17 題：'
