- id: doc_113_高雄_陽明_數學_g8s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '(A)在一平面上，若有相異兩條直線同時垂直於另一條直線，則這兩條直線一定互相平行。

    (B)在一平面上，相異兩直線被另一直線所截的同位角會相等、內錯角會相等、同側內角會互補

    (C)在一平面上，相異兩直線被另一直線所截的任一組同位角相等時，則這兩條直線會互相平行

    (D)平行四邊形的任一對角線將原平行四邊形分成兩個全等的三角形。

    (E)平行四邊形的對角相等，鄰角也相等。

    (F)如果有一個四邊形的一組對邊互相平行，另一組對邊等長，則這個四邊形必為平行四邊形。

    (G)菱形的對角線互相垂直平分。

    以上正確的有幾個？'
  options:
  - label: A
    content: '4'
  - label: B
    content: '5'
