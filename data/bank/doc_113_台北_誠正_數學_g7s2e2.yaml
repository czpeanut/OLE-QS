- id: doc_113_台北_誠正_數學_g7s2e2_s3_1
  section: 3
  number: 1
  type: calc
  page: 2
  stem: '如右圖，坐標平面上有$L:y=ax+b$、$M:y=-x-1$、$N$三個圖形，已知直線$N$平行$y$軸，直線$L$與直線$N$的交點坐標為$(1,7)$，直線$L$與$y$軸的交點坐標為$(0,5)$，求：

