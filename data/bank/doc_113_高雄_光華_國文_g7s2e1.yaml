- id: doc_113_高雄_光華_國文_g7s2e1_s2_9
  section: 2
  number: 9
  type: single
  page: 5
  stem: 根據本文，故事的最後，主角手中拿著何物？
  options:
  - label: A
    content: 沒有任何東西
  - label: B
    content: 傘
  - label: C
    content: 傘蓋
  - label: D
    content: 傘柄。
  group_stem: '時盛暑赫日，持傘自覆。忽值大風，飛石拔木，卷其傘蓋而去，唯持傘柄。行數十步，雲雨大至，方憂濡溼，忽有飄席至其所，因取覆之。俄而雷震地，道傍數家之中，卷一家屋室，向東北而去。頃之遂霽，其居蕩然，無復遺者。老幼十餘，皆聚桑林中，一無所傷。舍前有足跡，長三尺。誠又西行數里，遇一人，求買所覆席，即與之。又里餘，復遇一人，求買所持傘柄。誠乃異之，曰：「此物無用，爾何為者而買之？」其人但求乞甚切，終不言其故。隨行數百步，與之乃去。

    （太平廣記 李誠）'
