- id: doc_113_高雄_光華_國文_g7s2e1_s2_7
  section: 2
  number: 7
  type: single
  page: 5
  stem: 根據本文，下列關於鱟的敘述，何者正確？
  options:
  - label: A
    content: 鱟卵孵化之後會直接到較深海域生活
  - label: B
    content: 鱟在夏秋之間交配產卵，冬天會冬眠
  - label: C
    content: 夏季大潮清晨或傍晚可能抓到夫妻鱟
  - label: D
    content: 鱟一年脫皮一次，鱟卵孵化前不脫皮。
  group_stem: "灘地上活化石——鱟\n 鱟從4 億多年前至今仍保留原始的樣貌，故有「灘地上活化石」之稱，不僅在生物史上具有象徵意義，在生物醫學也有相當價值；鱟的血液呈藍色，一公升約價值美金一萬五千元，有人稱「藍金」。鱟血中萃取的「鱟素」，可用來檢測、移除醫療用品或合成藥物遭細菌的內毒素汙染。\n\
    鱟的生活史\n 成鱟出現於每年5 月到8、9 月間（產卵季節），東北季風起，即會遷徙至20～30 公尺深海域越冬。出現季節時母鱟及雄鱟於大潮清晨或傍晚，集體游上潮間帶高潮線附近的沙洲產卵。卵孵化之後，漂至高潮線附近的泥灘地，經脫殼變態下來，過底棲的生活，以泥灘上之細小生物或碎片為食。長大至4～5\
    \ 公分隨水流逐漸遷移到以沙為主的地區，至10 公分上下就離開潮間帶到較深海域生活。\n鱟的脫殼\n 鱟如同其他的節肢動物，是以脫殼而後成長的。由一次的脫殼而長大約之前體型的1.3～1.4\
    \ 倍，但死亡率也高，是一種搏命的成長。鱟的卵於孵化前在卵膜內就脫皮四次，因此仔細觀察回轉卵，卵中就有如仙女的羽衣狀薄紗的殼，回轉卵此時的胚體已經成了像鱟的體形。在剛孵化出的第一齡幼生，由其形態看，與成體的鱟很相似，而在第一齡幼生時沒有的尾劍，在第二齡幼生時期也明顯的長出來。\n\
    \ 抽完血後，鱟被野放回大海，卻未必每隻都能存活，動物學家表示，有10％到25％的鱟會在遭到大量抽血後的幾天內死亡。\n 日本已經將鱟列入瀕危動物名單，中國列入名貴珍稀水生動物，根據臺灣國家公園網站資料，鱟的棲地遭到破壞，在臺灣本島幾乎已經絕跡，分布在金門、馬祖的數量也愈來愈少。\
    \ （改寫自網路新聞）"
