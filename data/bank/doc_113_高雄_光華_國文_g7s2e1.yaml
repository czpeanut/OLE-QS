  group_stem: "如何解決現代焦慮？\n 要解決現代人的煩惱、焦慮，需要改變我們面對壓力的方式。\n①認識壓力公式：鄭石岩教授在多的諮商經驗中發現，人的壓力，可以用一個公式表現，壓力＝負載／自我能力。負載等於是卡車上所載的東西，自我功能就好像這部卡車的承載能力。如果上面負載的東西並沒有增加，可是你現在很難過，這就表示有幾個可能，一是你的自我功能減弱了，一是你在上面加了太多別的東西、太多垃圾。例如，在辦公室跟同事處不好，回家後跟家人處不好，這些壓力、這些情緒，全都加到工作上去，就變成垃圾負載。這些衝突、情緒，其實跟你的工作並沒有關係，但都全部被加到你的工作裡面去。\n\
    ②減輕垃圾負載：對於這些人來講，鄭石岩教授並不主張馬上把他們原來的主題負載減少，要減少的是他們的垃圾負載。根據這個壓力公式來分析，鄭石岩教授開了三個處方。\n\
    \ 第一個處方是運動。因為運動可以刺激腦下垂體分泌腦內啡，使人的心情變好。第二個處方是儘量表現出開心的樣子。深深吸一口氣，裝一裝，假裝高興，感覺自己的胸口鬆開，把眉毛揚一揚，很高興，振作起來，並且要記得跟人打招呼。鄭石岩解釋，一旦你經常這樣作，行為影響情緒，人真得會變得比較快樂。第三樣處方是笑。因為笑的時候可以產生內臟按摩。而且笑的時候通常都會深呼吸，也會刺激身體產生令人舒服、愉快的分泌物。\n\
    （節錄自Eric 勵志網站：人生經營論壇 面對壓力）"
