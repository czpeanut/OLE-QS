- id: doc_113_台南_民德_國文_g8s1e1_s4_6
  section: 4
  number: 6
  type: single
  page: 5
  stem: 右圖是桃源谷及其登山路線的地圖，根據上述日記，圖中❶～❹的標示何者正確？
  options:
  - label: A
    content: ❶：灣坑頭山
  - label: B
    content: ❷：石觀音廟
  - label: C
    content: ❸：啞口
  - label: D
    content: ❹：番薯寮山
  group_stem: "以下為大雄某一天的旅行日記：\n【113 年9 月22 日】秋 天氣晴\n    今天和朋友到新北貢寮的桃源谷，進入桃源谷共有四條主要路線，分別是草嶺線、石觀音線、內寮線和大溪線。行前，我們為了要走哪一條登山路線而爭論不休。\n\
    \    靜香說：「我想走草嶺線，從啞口進入，途中會經過灣坑頭山。」胖虎說：「可是那條路線途中都沒有廁所，還是走石觀音線吧，中程有涼亭和廁所可以休息。」小夫說：「既然都來了，不如就挑戰路程最長的大溪線，接近3000\
    \ 個石階，途中還會經過番薯寮山。」哆啦A 夢說：「不如我們上山走內寮線，在登山口的蕭家莊就能上廁所，下山走石觀音線，順路參拜石觀音廟。」最後，我們採用了哆啦A\
    \ 夢的計畫。\n    從內寮線出發，沿途枝葉扶疏，大約30 分鐘就登上了桃源谷。遼闊無際的綠皮地毯，在起伏的山稜間鋪綴開來，金風徐徐吹拂，宛如一隻大手捧著每個人愉悅的的臉龐。走上最高處俯瞰萬物，白茫茫的芒花如嬌媚的舞者，舞著微風，也舞著登山客。這真是一場美好的饗宴！"
