- id: doc_113_台南_民德_國文_g8s1e1_s4_4
  section: 4
  number: 4
  type: single
  page: 4
  stem: 「心極靜極沉，像一只熟得恰好的紅柿，一串黃到巔峰的香蕉，水分飽脹的秋梨，滿樹棲止的黃葉，我亦化身秋物，在短暫的秋裡憩息。」請問文中「紅柿」、「香蕉」、「秋梨」、「黃葉」的共同特色並不包括下列何者？
  options:
  - label: A
    content: 都是秋天的景物
  - label: B
    content: 都是作者的最愛
  - label: C
    content: 都有沉靜的氛圍
  - label: D
    content: 都代表已然成熟
  group_stem: "時序入秋，我便開始恍惚。年年這樣，在飄浮狀態中緩緩滑入冬季，緩緩被寒流喚醒。秋收冬藏，秋天於我往往卻是一事無成的閒散季節。上課之外，大部分時間對著金黃陽光出神，腦海裡似什麼都沒有，也似什麼都有，心極靜極沉，像一只熟得恰好的紅柿，一串黃到巔峰的香蕉，水分飽脹的秋梨，滿樹棲止的黃葉，我亦化身秋物，在短暫的秋裡憩息。\n\
    \    剛來臺灣時不很明白，為什麼單只秋季如此？馬來西亞四季如夏，我的情緒從未因季節的牽引而波動。某日清晨，我躺在地上練瑜伽，沁涼空氣中飄來隱約的熟甜之氣。嗅聞一陣，旋即發現蹲在小客廳矮几上的文旦成熟了。中秋節前跟鄰居買的，一大麻袋兩百八十元，算算一顆十元左右，是鄰居的父親在苗栗山上老家所種，它們如今在矮几上排排坐，一放轉眼一個半月。\n\
    \   起先，它們揮發一種青果之味，微酸微澀，清香而已。放著放著，酸澀隨著水分蒸發，突然有一天，轉為甜熟之味。\n   是了，這是秋天。天地間盈滿一種甜的，專屬於秋的成熟氣息。\n\
    \   從文旦以後，我的味蕾發現時蔬瓜果皆散發著金秋的溫潤好味道。夏天易爛的葉菜類存放時間變長了，根莖類如蘿蔔、蓮藕、馬鈴薯變得更甘脆。切白蘿蔔時忍不住邊切邊吃。很難拒絕蘿蔔那辛辣中的清甜誘惑，生吃尤顯滋味，常常吃著便不由得要感恩。偶爾上傳統市場買點水果和肉類，蔬菜則由瑜伽班同學代買，一星期送一次貨，一次十幾種鮮蔬滿滿一大袋。這家有機蔬菜把我的味蕾養刁了，傳統市場的菜蔬再怎麼新鮮就是少了大地的風味。特別是經過南風加持之後，我心甘情願墜入只動感官不傷腦筋的安逸生活，吹著涼風浴暖陽，再品嘗秋天賜予的好禮，忍不住要嘆，哎！這人生。一年之中就數這個季節天時地利最適合享樂，奈何韶光短促，奈何手邊總有丟不掉的煩雜事。\n\
    \    這幾日秋陽愈發橙黃，跟紅柿一樣快達到它的成熟巔峰。矮几上的文旦漸漸少了，像用剩的秋日，而煩雜事卻愈堆愈高。時序立冬，最後一個屬於秋的節氣終於過完，我卻仍然眷戀著愉悅感官的，甜美的秋天況味。\n\
    ——鍾怡雯 秋之味"
