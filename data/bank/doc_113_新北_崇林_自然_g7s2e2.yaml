- id: doc_113_新北_崇林_自然_g7s2e2_s2_40
  section: 2
  number: 40
  type: single
  page: 4
  stem: G-6-PD 缺乏症的缺陷等位基因是出現在X 染色體上，請根據本文推論得知：
  options:
  - label: A
    content: 統計上，罹病者在男性和女性的比例相同
  - label: B
    content: 罹病的女孩，父親不是患者
  - label: C
    content: 爸爸會把蠶豆症的等位基因遺傳給兒子
  - label: D
    content: 爸爸和媽媽都沒被診斷為蠶豆症患者，但兒子可能罹病。
  group_stem: '【題組三】：請閱讀下列文章，並配合自然課程中學習到的知識，試回答第 40~44 題：

    「蠶豆症」全名是葡萄糖-六-磷酸脫氫酵素缺乏症，簡稱G-6-PD 缺乏症，患有此症的孩童因缺乏G-6-PD 酵素，因而失去了葡萄糖代謝過程中會產生的一種保護紅血球的物質，以對抗某些特別的氧化物，使病童一旦接觸此特別的氧化物，紅血球就容易受到破壞，導致溶血反應，如果程度嚴重就會發生「急性溶血性貧血」，甚至有生命危險。此症是屬於性聯隱性遺傳疾病，也就是基因的缺陷是出現在X
    染色體上，故女生需有2 個缺陷等位基因才會罹患此病，而男生只要X 染色體有此缺陷等位基因就會罹病，所以患者以男性居多；但有部分患者的產生是因個體本身染色體基因突變所致。G-6-PD
    缺乏症至今仍無藥可醫，但患者只要在日常生活中注意幾件事，包括：不隨意服藥，所有藥物均須經由醫師處方、生病時應主動告知醫護人員自己患有此病症、不吃蠶豆及其製品、受傷時不要使用紫藥水、衣櫥及廁所不放人工樟腦丸或奈丸，即可平安長大。

    出處：本文摘錄自網路文章'
