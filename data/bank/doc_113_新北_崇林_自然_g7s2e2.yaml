  group_stem: '【題組四】：請閱讀下列文章，並配合自然課程中學習到的知識，試回答第 45~48 題：

    (一)世界三大珍饈之一的「松露」（法語： Truffe）是西洋松露屬（Tuber）蕈類的總稱，大約有10 種不同的品種。生長在地表下方 1～2 公尺處的闊葉樹樹根旁，是極為珍貴的食用真菌，採集並不容易，只能由豬或狗嗅出生長位置並挖掘出來，因為它有著在科學上被稱為｢雄烯酮」的味道，此味在歐洲自古便有許多人為之著迷，因此，被歐洲人譽為「廚房裡的鑽石」。

    (二)「雨來菇」是恆春半島居民餐桌上的在地美食，口感介於黑木耳和海藻之間，雖名為「菇」，但其實被分類在藍菌念球藻類，藻體為多數球形的單細胞串連而成，多數為空心凝膠球狀，可以從大氣中抓取氮氣，因此可以生活在沒有含氮的土壤上、砂礫或潮溼岩石上，也能夠在極地和乾旱地區中發現，早年多在下雨後才現身於山林地表，林口區崇林國中的操場上也曾經出現過它的蹤跡，其栽培環境需要純淨的空氣與水源及充足的日照，因此業者美名為「情人的眼淚」。

    (三)最近馬祖爆紅的「藍眼淚」又稱夜光蟲或夜光藻，為一種在海中生存的非寄生甲藻，屬於甲藻門的單細胞原生生物，有些具鞭毛可擺動游泳，有文獻指出，它最愛吞噬矽藻；有些種類也能以光合作用生存，因此有雙鞭毛藻或雙鞭毛蟲的名稱，雖然目前尚未了解它發光目的，卻也讓爆發期3-9
    月的海洋夜晚帶來了一波賞藍光的人潮。

    出處：改寫自網路維基百科文獻'
