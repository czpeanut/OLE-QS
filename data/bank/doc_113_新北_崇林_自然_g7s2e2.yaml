- id: doc_113_新北_崇林_自然_g7s2e2_s2_49
  section: 2
  number: 49
  type: single
  page: 5
  stem: 根據本文，關於甲、乙、丙三區黑熊分布的推論，下列何者最合理？
  options:
  - label: A
    content: 櫟樹的棵數越多，黑熊的數量就較多
  - label: B
    content: 櫟樹的棵數會影響雌、雄黑熊所占的比例
  - label: C
    content: 櫟樹果實的結果量越多，黑熊的數量就較多
  - label: D
    content: 櫟樹的果實結果量會影響雌、雄黑熊所占的比例。
  group_stem: '【題組五】：請閱讀下列文章，並配合自然課程中學習到的知識，試回答第 49~50 題：


    黑熊分布的數量會因棲地的條件而有差異，研究發現黑熊秋冬季時會大量覓食櫟樹的果實。下表為某月分甲、乙、丙三個不同山區內櫟樹和黑熊的調查數量，以及櫟樹的果實結果量。在調查過程中，研究員收集黑熊的糞便，利用脫落在糞便中的腸壁細胞來分析細胞內的遺傳物質，以鑑定黑熊的性別及記錄數量。

    【改編自108 教育會考】


    | 山區 | 櫟樹植株 | 櫟樹果實結果量 | 黑熊雌性 | 黑熊雄性 |

    | :--- | :--- | :--- | :--- | :--- |

    | 甲 | 約250棵 | 大量果實 | 8隻 | 3隻 |

    | 乙 | 約300棵 | 果實稀少 | 2隻 | 1隻 |

    | 丙 | 約250棵 | 大量果實 | 3隻 | 8隻 |'
