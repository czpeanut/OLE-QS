  section: 1
  number: 20
  type: single
  page: 2
  stem: 科學家想要篩選出高產量的小麥品種，以解決糧食缺乏的問題，而利用放射線照射小麥的種子，你認為這種做法是否可行？為什麼？
  options:
  - label: A
    content: 不可行，因為放射線所引起的突變，都是對生物有害的
  - label: B
    content: 不可行，因為放射線會把所有的基因都破壞掉
  - label: C
    content: 可行，因為經由放射線處理過的種子，其子代一定能迅速繁殖而表現出高產量的特性，但仍要考慮生態系中物種的平衡
  - label: D
    content: 可行，因為利用少數的有利突變，可能可以篩選出符合需求的品種，但仍要考慮生態系中物種的平衡。
