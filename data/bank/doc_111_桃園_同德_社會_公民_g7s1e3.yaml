- id: doc_111_桃園_同德_社會_公民_g7s1e3_s1_55
  section: 1
  number: 55
  type: single
  page: 2
  stem: 我們從小到大都在投票，例如：選班長，選聚餐地點，選立委，選總統，幾乎都是「多數決」，也就是「少數服從多數，多數尊重少數」。不過，「多數決」並非萬靈丹，下列有關「多數決」的敘述，何者正確？
  options:
  - label: A
    content: 任何事情皆可用「多數決」的方式。
  - label: B
    content: 可以「多數決」來限制或剝奪少數人的基本權利。
  - label: C
    content: 決定有關團體的事務或人選時適用。
