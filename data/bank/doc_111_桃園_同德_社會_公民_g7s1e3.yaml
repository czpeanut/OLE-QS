  group_stem: '2015 年起，教育部逐步補助高中以下學校增設性別友善廁所，教育部強調：性別友善廁所應備四項條件，包括：

    1、各種便器都有完整隔間；2、廁所外須有完整概念說明；3、比以往更明亮、安全、友善與彈性的整體設計；4、要架設安全設備，來提升隱私性與安全性。

