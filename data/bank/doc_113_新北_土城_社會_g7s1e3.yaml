  group_stem: '慕谷慕魚，位於花蓮縣秀林鄉的銅門部落，現由太魯閣族居住在這邊。大約300 年前，原居住於現今南投縣仁愛鄉春陽溫泉的太魯閣族，翻山越嶺到此定居。因為當地產銅且位處能高越嶺古道的隘口，故取名為「銅門」，慕谷慕魚則是其中一個家族的名稱，現在變成對外的通稱。

    太魯閣族由於生活所需都是取自於大自然，太魯閣族人十分重視自然生態，認為山林中的水果、野菜、動物或河川內的魚蝦，都是上天給的禮物，十分珍貴。而且族人也信守祖靈的訓示：不過度拿取，夠用就好。當地耆老表示：「在山林中狩獵就是一種交換，每次獵物的取得都要付出代價，因此獵人架設陷阱時，會在下方放一個雞蛋，意思就是用我們養的牲畜和祖靈交換祂養在山裡的動物。」'
