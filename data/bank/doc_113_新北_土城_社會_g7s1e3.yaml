  group_stem: '(二)、請先閱讀以下《勸番歌》及敘述：(回答: 39～40 題)


    勸番歌

    勸番切莫去刣郎，刣郎不能當衣糧；

    刣得郎來無好處，是福是禍要思量。

    百姓刣你兄和弟，問你心傷不心傷；

    一旦大兵來剿洗，合社男女皆驚慌。

    東逃西走無處躲，戶屋燒了一片光；

    官兵大砲與洋槍，番仔如何能抵當？

    不拿兇手來抵命，看你跑到何處藏？

    若如你們不肯信，問問蘇魯馬邦邦。

    莫如歸化心不變，學習種茶與種田；

    剃髮穿衣做百姓，有衣有食有銀錢。

    凡有刣郎兇番仔，哪個到老能保全？

    你來聽我七字唱，從此民番無仇怨。


    刣郎：殺人的意思。

    蘇魯馬邦邦：因殺人而被官兵懲罰，族人已被屠戮殆盡的部落名稱。


    這首《勸番歌》的出處來自於清代《恆春縣志》卷五「招撫篇」中之內容，是官方下令在恆春一帶原住民社群中傳唱的歌謠。歌曲中意思極為清楚，是以恐嚇手段威嚇原住民不得出草殺人，不然就會使用西方人傳入的新式洋槍洋砲將部落剿洗乾淨，且燒光房屋。'
