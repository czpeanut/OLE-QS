  group_stem: '<C>

    Table Manners in India

    Many people visit India because of its delicious food. Some famous dishes, like
    masala chicken, nans, curry, are popular with

    visitors. However, there are some rules for everyone to follow when we eat in
    India.

    First, Indians eat with their right hands. This is because Indian people think
    the right hand is clean and the left hand is dirty. So,

    keep in mind that only use your right hand when you eat. Second, keep your left
    hand by your side, and do not put it on the table.

    Also, don’t pass food to people with your left hand. What’s more, touch your own
    food only, and never touch other people’s food.

    When you touch their food, it becomes dirty in their eyes.

    Follow these rules, and you can enjoy Indian food with Indians!

