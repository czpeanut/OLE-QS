  options:
  - label: A
    content: 山風總是把香味散播得很遠，也變得濃淡適宜，令人舒服——味覺
  - label: B
    content: 迎面而來的是許許多多雪片一般飛落的油桐花，飄蕩著、旋轉著——視覺
  - label: C
    content: 空氣因為注入了金銀花以及山黃梔花的濃香，變得有些黏稠——觸覺
  - label: D
    content: 迎面拂來微涼山風，飽含著各種野花的甜美香氣，還帶著一股五月的陽光味道——聽覺。
