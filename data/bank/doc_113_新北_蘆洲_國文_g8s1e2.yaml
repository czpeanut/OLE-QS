  stem: '某段時間，因淪落地獄者銳減，閻羅王緊急召集眾鬼，商討如何引誘人類下地獄。

    牛頭提議：「我告訴人類：『丟棄良心吧！根本就沒有天堂！』閻羅王考慮了一會兒，搖搖頭。

    馬面說：「我告訴人類：『為所欲為吧！根本就沒有地獄！』」閻羅王想了想，還是搖搖頭。

    不一會兒，旁邊有個小鬼說：「我去對人類說：『還有明天！』」閻羅王點了點頭。

    「還有明天」可以使人懶情頹廢，「還有明天」也可以讓人奮發向上。

