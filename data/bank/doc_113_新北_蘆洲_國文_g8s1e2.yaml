  group_stem: '乙.

    異族共生，相依為命(改寫)

    「同體共生」係建立在對生命意義的共同認知，這是發乎精神層面，進而對大環境產生期望中的理想境界，這就是人類以其高等智慧思考下的啟發而言；動物界也有不同族類共生的現象，這是進化過程演變而來的天性，不需思考，也沒有疑慮，動機比人類單純多了，只為――生存。

    在郷下，常見「烏秋」騎在牛背上，幫牛啄去身上的寄生蟲，既填飽了肚子，也幫牛隻清潔了身體。在印度，也有一種被稱為「剔食鳥」的牛鷺，專門停在犀牛身上啄食寄生蟲，同時也清潔了犀牛的身體。在淺海中，有一種叫「隱魚」的小魚，在遇到危險時，總是鑽進海參的內臟裡。如此一來，隱魚得到了保護，海參也從隱魚的排泄物中獲得養分。                     (人間福報)'
