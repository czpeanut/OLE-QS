- id: doc_113_新北_蘆洲_國文_g8s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 「菊之愛，陶 後鮮有聞。蓮之愛，同予者何人？牡丹之愛，宜乎眾矣！」這段文句主要的旨意為何？
  options:
  - label: A
    content: 希望君子除了自我修養，也能造福人群
  - label: B
    content: 貶責過著隱居生活的君子對社會奉獻不多
  - label: C
    content: 感嘆蓮花不論外表或香氣，都比不上牡丹
  - label: D
    content: 委婉地表示有道德理想的人極為稀少。
  lesson_raw:
    title: 愛蓮說
    basis: 引用愛蓮說課文原句
