  type: single
  page: 5
  stem: 根據上則文意，下列敘述何者較為正確?
  options:
  - label: A
    content: 酒香山因匿藏了長生不老仙酒而得名
  - label: B
    content: 漢武帝雖憤怒，但最終未誅殺東方朔
  - label: C
    content: 東方朔竊飲目的是為求證長生酒的真假
  - label: D
    content: 漢武帝和東方朔這君臣皆貪求長生不死。
  group_stem: "丁、\n        方朔竊酒                                                羅大經\n\
    岳陽有酒香山，相傳古有仙酒，飲者不死。漢武帝得之。東方朔竊飲焉，帝怒，欲誅之。\n方朔日：「陛下殺臣，臣亦不死；臣死，酒亦不驗。」遂得免。\n方朔數語，圓轉簡明。意其竊飲以發此論，蓋風武帝之求長生也。\n\
    【註釋】驗：靈驗。圓轉：婉轉。意：推測。風：音ㄈㄥˋ，通「諷」。"
