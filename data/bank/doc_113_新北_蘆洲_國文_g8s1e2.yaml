  stem: 關於周敦頤的愛蓮說，下列說法何者正確？
  options:
  - label: A
    content: 「濯清漣而不妖」指君子虛懷若谷，通達情理，端莊正直
  - label: B
    content: 「可遠觀而不可褻玩焉」說明君子人格高潔，讓人心生敬仰而不敢輕慢玩弄
  - label: C
    content: 「蓮之愛，同予者何人？」由此可見作者仁民愛物的胸襟
  - label: D
    content: 「牡丹之愛，宜乎眾矣！」以牡丹象徵世人追求世界大同的普世心願。
