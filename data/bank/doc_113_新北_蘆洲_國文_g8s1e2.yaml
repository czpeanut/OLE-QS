  section: 2
  number: 37
  type: single
  page: 5
  stem: 由本詩的内容來判斷，「自然的微笑」應該是指什麼？
  options:
  - label: A
    content: 指宇宙間一切事物所遵循的自然遞嬗法則
  - label: B
    content: 指人們發自內心、不矯情做作的甜美笑容
  - label: C
    content: 指天地間所集結令人不可思議的自然現象
  - label: D
    content: 指令人們為之神往、柔美瑰麗的自然美景。
  group_stem: "丙.\n    自然的微笑       劉大白\n隱隱的曙光一線，\n在黑沉沉的長夜裡突然地破曉， \n霎時烘成一抹錦也似的朝霞，\n\
    彷彿沉睡初醒的孩兒，\n展開蘋果也似的雙頰，\n對著我微笑。\n黃昏一片淺藍天， \n一半魚鱗似的白雲籠罩，\n冉冉地吐出一彎鉤也似的明月，\n彷彿含羞帶怯的新婦，\n\
    只露出一些兒眼角眉梢，\n對著我微笑。\n鏡也似的平湖， \n映著胭脂也似的落照，\n忽然幾拂輕風，\n皺起紗也似的波紋，\n彷彿曲終舞罷的女郎，\n把面罩籠著半嬌半倦的臉兒，\n\
    對著我微笑。"
