  section: 1
  number: 9
  type: single
  page: 1
  stem: 「籠子裡的鳥更不用說，常年的關在柵欄裡，……牠的苦悶，大概是僅次於黏在膠紙上的蒼蠅；牠的快樂，大概是僅優於在標本室裡住著罷？」關於這段文字，下列說明何者錯誤？
  options:
  - label: A
    content: 「標本室裡住著」暗喻死亡
  - label: B
    content: 句中雖然用「僅次於」、「僅優於」，其實是在說籠中鳥的處境與之相比好不了多少
  - label: C
    content: 呼籲人類不要因愛鳥而養鳥囚鳥
  - label: D
    content: 藉此強調自由的可貴，肯定宗教放生的意義。
