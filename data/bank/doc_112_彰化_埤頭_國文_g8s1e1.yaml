  group_stem: "2.\n    極偏僻又極佳美的小地方，往往沒有指南，尤其處於甚有名氣的國家。威尼斯的指南絕對太多，安徽涇縣則幾乎沒有書會提到。\n\
    \    這也就出了許多事。倘你要去極其個人、極其荒幽、極其不與他人共享的隱祕角落，完全別考慮指南。\n    假如指南寫到它，就別去。\n    指南的最壞情況是，毀滅了你的驚喜。\n\
    \    為了那些「祕密的花落」，很多作家只好在遊記中故意隱藏其名，以免觀光客蜂擁遊以致不堪。水上勉曾在京都四處一文中說及一株三百多年老的大櫻花樹，僻處於京都北面山村的古剎裡，須四人合抱，每年四月二十七、八日櫻花怒放。這樣的幽境，從無外人知道，僅村人得以享受，而村民也視若當然。水上勉只說在「北面山村的古剎裡」，乘車五十分鐘」，關於此刻我得保持保密」。\n\
    （改寫自舒國治再談旅行指南）\n〔101.基測〕"
