  stem: 「蟬噪林逾靜，鳥鳴山更幽。此地動歸念，長年悲倦遊。」（王籍入若耶溪）詩中以「蟬噪」、「鳥鳴」反襯夜的寂靜，下列何者也運用相同手法？
  options:
  - label: A
    content: 千山鳥飛絕，萬徑人蹤滅。孤舟蓑笠翁，獨釣寒江雪（柳宗元江雪）
  - label: B
    content: 移舟泊煙渚，日暮客愁新。野曠天低樹，江清月近人（孟浩然宿建德江）
  - label: C
    content: 眾鳥高飛盡，孤雲獨去閒。相看兩不厭，唯有敬亭山（李白獨坐敬亭山）
  - label: D
    content: 山光悅鳥性，潭影空人心。萬籟此俱寂，但餘鐘磬音（常建題破山寺後禪院）
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
