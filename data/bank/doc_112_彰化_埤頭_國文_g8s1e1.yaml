  - label: D
    content: 前者著重心靈享受，後者重視視覺刺激。
  group_stem: "1.\n    自然界的美是如此豐富，就看你會不會靜觀細賞，你如果到溪頭竹林去玩，一上山，就連山都不見了，只見山化成滿天的竹子；入竹林，就連天也看不見了，只見天化成滿山的綠意。有人試著用筆寫下來：上山不見山，山化一天竹；入林不見天，天化一山綠……在這鑑賞或創作的過程中，一點沒有望著竹子想吃筍的貪念，也沒有在竹林深處買棟別墅的野心，完全排除了功利的念頭，純然為一片綠色美景所感動，這就是審美觀照的愉快，也就是藝術的生活。\n\
    （節錄自黃永武藝術的眼光）"
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
