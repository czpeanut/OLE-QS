  group_stem: 新竹城隍廟口小吃管委會 17 家攤商成員經營滷肉飯、乾米粉、肉圓、蚵仔煎等小吃，透過該管委會居間連繫及 LINE 群組共同討論並決定聯合漲價，並於
    112 年 4 月間張貼公告表示「城隍廟廟口小吃於 5 月 1 日起全面漲 5 元正 廟口管委會 敬啟」，導致該等攤商一致於 112 年 5 月間共同漲價，日前◆◆◆◆決議，新竹城隍廟埕內
    17 家攤商聯合全面漲價 5 元之行為，已違反○○○○法中的聯合行為之禁止規定。經考量管委會不是依法設立的團體、觀光美食市集類型之攤商營業規模小且經營不易、並已撤除公告等因素，故決議予以警示處分而不處罰鍰。(源自：2024-11-08
