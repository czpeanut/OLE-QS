  section: 1
  number: 3
  type: single
  page: 1
  stem: 下列有關此新聞的相關說明，何者有誤？
  options:
  - label: A
    content: 業者會從中國進口的紅辣椒粉代表有利可圖
  - label: B
    content: 消費者拒用不良商品就可以解決此問題的發生
  - label: C
    content: 政府對於進口商品的檢驗機制及各項法規應該要更周全
  - label: D
    content: 不配合的團膳業者可能要負起民事責任
  group_stem: 2024 年 3、4 月期間，業者自中國進口的紅辣椒粉，被檢出蘇丹色素 3 號，下游流向全台的調味料、零食、咖哩粉等加工食品。問題調味料產品紛紛下架，當時全台校園午餐也暫停使用。事隔半年多，日前某牌特調咖哩粉又遭檢出有致癌疑慮的蘇丹色素
    1 號，衛生福利部食品藥物管理署初步鎖定是印度薑黃粉有問題，待進一步檢驗。因而台北市、新北市、台中市、桃園市、基隆市等縣市教育局處相繼公布，暫緩學校營養午餐使用辣椒粉及咖哩粉等調味料，至明年
    1 月 20 日學期結束，對於違反規定的團膳業者，最重可終止合約。(源自：2024.11.05 中央社)
