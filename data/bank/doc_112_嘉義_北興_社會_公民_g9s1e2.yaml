  type: single
  page: 5
  stem: 上文提及農業經濟發生的重大改變最可能為何？
  options:
  - label: A
    content: 低價商品進口迫使本國農民改變生產方式
  - label: B
    content: 農產品市場被高價且劣質的進口商品取代
  - label: C
