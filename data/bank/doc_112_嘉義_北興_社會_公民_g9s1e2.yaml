  - label: D
    content: 商店與外國廠商合作，抵制本土產品上市。
  group_stem: '(四)紀錄片《米香的孩子》是以客家農村的春耕到收割為背景，述說在瀕臨社會變遷與時代的衝擊下，對於農村文化價值的守護。片中除了探討食農教育的重要性，學習愛惜食物，建立正確的價值觀，也關心臺灣於
    2002 年加入 WTO 後，當時我國農業產生的具體變化，以及務農者在外國農產品強力競爭下的生存之道。臺灣開放外國農產品進口，農村發展受到巨大影響，部分農民甚至被迫放棄生產，只能前往都市謀生，但也有人留了下來，從事農業轉型或精緻化，堅持農村精神，希望繼續展現臺灣農業突破困境的實力。請問:'
