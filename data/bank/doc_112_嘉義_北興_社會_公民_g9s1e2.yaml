    content: 丙
  - label: D
    content: 丁。
  group_stem: '(三)日本知名迴轉壽司連鎖店(甲)主打平價壽司，受到眾多消費者的歡迎，餐廳不僅(乙)使用高級食材，重視烹調的美味程度，每年公司更精心(丙)研發數十款新口味菜單上架，吸引喜歡嚐鮮的客人。除此之外，為避免壽司長時間未被取用導致不新鮮，(丁)盤底黏貼晶片監測，定時回收。

    日前，媒體爆出一名日本青少年與友人前往用餐，刻意以唾液汙染公共使用的醬油，並將此行為拍成影片 PO 上網，造成各分店生意一落千丈，商譽嚴重受損。公司對此緊急做出處置，宣布改變送餐方式，裝設特定隔板，顧客訂購的餐點、調味料都將直接送至桌上，以避免受到汙染，希望顧客重拾信心，繼續給予支持。請問:'
