- id: doc_113_高雄_鼎金_英語_g7s1e1_s6_31
  section: 6
  number: 31
  type: single
  page: 2
  stem: What does NOT a horse have?
  options:
  - label: A
    content: a long face
  - label: B
    content: long ears
  - label: C
    content: small round eyes
  - label: D
    content: strong body
  group_stem: 'A.

    Horses VS. Donkeys

    Horses are different from donkeys. A horse has short ears, small round eyes, and
    a long face. A donkey has a short face and long ears. As for the body size, a
    donkey is about 31 to 63 inches tall, and a horse is about 56 to 64 inches. Horses
    are tall and strong. They are helpful on the farm. Although donkeys are smaller,
    they are strong and helpful, too.

     have/ has 有 round 圓形的 inch 英吋 helpful 有幫助的 although 雖然 smaller 較小的'
