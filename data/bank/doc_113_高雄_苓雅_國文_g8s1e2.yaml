  group_stem: "突破老街的枷鎖   劉克襄\n  幾乎所有攤販和商家也都懂得掛上五十年代、三十年代、古早厝這類字號的招牌，強調自己的舊味、原味，藉以吸引遊客的喜愛。仔細看販賣的物品，臺灣早年的農家用品還真不少，但大陸閩南搬運過來的東西也充斥了。後現代的旅遊是什麼？在此證明，竟是回到過去。\n\
    \  深坑的旅遊觀光已經超乎文史工作者，或是一般旅遊學者的想像。它有很多值得研究的地方。原本深坑老街是要拆除，建造大馬路的，後來被保留，主要係仗勢著當地父老強力的護衛，這和三峽老街的住戶不希望保存，截然有異。後來深坑老街也達到旅遊者觀光的功能。只是這個功能隨著遊客的湧入，小吃商家逐漸增加，老街的建築特色反而無人注意。\n\
    \  老街被保存後，旁邊出現了熱鬧的中正路，成為進出深坑的主要幹線。例假日時，車子一駛入，常動彈不得。現在，隨著北二高交流道出現，又有一條雙線幹道，不再進入深坑，而是從旁邊直接往石碇。中正路亦出現大樓式的停車場，俯瞰著脆弱的老街。\n\
    \  這樣的深坑現象讓人驚喜，卻也教人難過。喜的是老街果然有魅力，吸引了遊客的人潮。教人害怕的是，老街已經變質，除了豆腐，旅遊來此似乎已經看不到任何東西。\n\
    \  其實，深坑是一個走訪百年前茶園風貌的輻射中心。我會建議旅遊者，不妨過了中正橋，往裡面的山區，像早年的深坑人一樣，認識這個產茶的原鄉。\n  這裡有好幾條茶葉古道，都通往隱密的鄉野，或者通往筆架山。保持最完整的一條，可以通往適合水浴的四龍瀑布，以及明媚的百年小村炮子崙。在那兒邂逅古樸的三合院和土角厝，以及舊式的耕作方法，才能感受深坑鄉野的原味。\n\
    \  如果體力好的人，還可以穿過梯田，進入隱密的原始森林。像以前的深坑人，翻過猴山岳的稜線，走訪當地著名的茶園和土雞城，再到大廟指南宮拜拜、遊玩。\n  除了吃豆腐外，我想這是更認識深坑的最實質方法。"
