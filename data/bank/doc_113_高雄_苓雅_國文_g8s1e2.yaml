- id: doc_113_高雄_苓雅_國文_g8s1e2_s1_47
  section: 1
  number: 47
  type: single
  page: 6
  stem: 以下是苓雅國中某班的同學簡介，請依據MBTI 分類，選出說明最正確的選項
  options:
  - label: A
    content: 能言善道，八面玲瓏的及川屬於I 人
  - label: B
    content: 思想天馬行空、不受框架束縛的影山是N 人
  - label: C
    content: 擁有「人飢己飢，人溺己溺」精神的日向是T 人
  - label: D
    content: 深謀遠慮、按部就班完成任務的菅原是P 人。
  group_stem: "MBTI 人格測驗\n    MBTI 人格測驗已經在網路上風靡了很長的一段時間，但你是不是只粗淺地看過MBTI 的測試結果，並沒有進行深究？其實在快餐世代，人們活在繁忙的工作環境裡，下了班像沙丁魚一樣堵在擁擠的網路上，更多的是與上司溝通，與朋友溝通，與網友溝通……獨獨少了與自己的溝通。\n\
    \    MBTI 就是這樣的一個工具，不論你是剛開始探索自己的性格，還是希望更深入瞭解自己，MBTI 結果出來，你都可以從中找到與自己有更多連結的機會。\n\
    \    MBTI，全名為Myers-Briggs Type Indicator（邁爾斯-布里格斯性格分類指標），是由瑞士心理學家Carl Jung（卡爾·榮格）的心理類型學說而演變出來的。\n\
    \n    以下表格為MBTI 的四個維度介紹，每種維度都包括了2 種對立的風格，例如:\n個性外向的人是E 人，個性內向的人是I 人。\n務實具體的人是S\
    \ 人，直覺創意的人是N 人。\n    榮格認為，每個人都有不同的思維和行為模式，這些模式可以被分類和預測。經過MBTI 測試，從四個維度中，會分別找出一個對應自己個性的符號，這4\
    \ 個符號組合在一起(例如:ESTJ)，總共會形成16 種人格，這可以幫助人們更好地認識自己以及他人。\n\n| 維度1 | 特徵 |\n| :--- |\
    \ :--- |\n| 外向 (E) | 互動方式：喜歡和他人互動，從社交活動中獲得能量；<br>表現特徵：健談，喜歡參加聚會和活動，容易表達自己的想法和情感；<br>工作偏好：偏好團隊合作，喜歡動態的工作環境。\
    \ |\n| 內向 (I) | 互動方式：喜歡獨處，從內心世界中獲得能量；<br>表現特徵：沉靜，更喜歡深度交流而非表面交談，會在內心反思和計劃；<br>工作偏好：偏好獨立工作，喜歡安靜、少干擾的環境。\
    \ |\n\n| 維度2 | 特徵 |\n| :--- | :--- |\n| 感覺 (S) | 資訊處理：注重現實和具體的事實，依賴五官感知世界；<br>表現特徵：實際、務實，注重細節，喜歡循序漸進地處理事情；<br>工作偏好：喜歡有明確指引和具體步驟的工作。\
    \ |\n| 直覺 (N) | 資訊處理：注重未來和可能性，喜歡憑直覺感知世界；<br>表現特徵：創新、富有想像力，喜歡大局觀，傾向於思考抽象概念；<br>工作偏好：喜歡有創意和挑戰性的工作，善於應對變化。\
    \ |\n\n| 維度3 | 特徵 |\n| :--- | :--- |\n| 思考 (T) | 決策方式：依據邏輯和客觀標準做決定；<br>表現特徵：理性、分析能力強，重視公平和一致性；<br>工作偏好：偏好基於數據和事實的工作環境。\
    \ |\n| 情感 (F) | 決策方式：依據個人價值和人際關係做決定；<br>表現特徵：感性、同理心強，重視和諧和合作；<br>工作偏好：偏好有人情味和支持性的工作環境。\
    \ |\n\n| 維度4 | 特徵 |\n| :--- | :--- |\n| 判斷 (J) | 生活方式：喜歡計劃和組織，偏好有結構的生活；<br>表現特徵：有條理、守時，喜歡設定目標和期限；<br>工作偏好：喜歡有明確計劃和預測性的工作。\
    \ |\n| 知覺 (P) | 生活方式：喜歡靈活和即興，偏好即興發揮的生活；<br>表現特徵：靈活、適應能力強，喜歡保持選擇的開放性；<br>工作偏好：喜歡多變和自由度高的工作環境。\
    \ |\n\n      以上文章節錄自網路資料ProjectManager <MBTI 16 型人格特質、職場方向分析！最全中文指南>"
