  group_stem: "心靈雞湯一詞原本來自於傑克．坎菲爾德所撰寫的勵志書籍，因想起奶奶熬雞湯給他所帶來的溫暖，所以將書名取作「心靈雞湯」，後來受到這系列影響的啟發性文章也被稱為「雞湯文」。\n\
    \  然而現今有些讀者卻對雞湯文不買單，新的「毒雞湯」在網路上掀起熱潮，以現實而尖刺的話語扎著讀者的心。或許因為溫暖的雞湯已給人樂觀向上的能量，反而言辭犀利的毒雞湯一針見血地表達了人們的想法，成功地抒發了人們的壓力。\n\
