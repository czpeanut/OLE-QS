  group_stem: 'One day, Danty borrowed a big pot from his neighbor, Ali. The next
    day, he gave it back with a small one inside.

    “That’s not mine,” said Ali.

    “Yes, it is,” said Danty. “When your pot was with me, it had a baby.”

    One week later, Danty asked Ali to lend him the pot again. Ali happily agreed
    and waited to see if Danty would give him back two pots again. One week passed,
    then another. In the end, Ali lost patience and went to ask for his pot.

    “I’m sorry, but your pot died,” said Danty.

    “Died!” said Ali. “How can a pot die?”

    “Well, you believed me when I told you that your pot had a baby, didn’t you?"

