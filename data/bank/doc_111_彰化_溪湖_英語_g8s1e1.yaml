    content: November.
  - label: B
    content: September.
  - label: C
    content: April.
  - label: D
    content: February.
  group_stem: 'Good evening. Welcome to Good TV weather report. I’m Ken. Now in Taipei,
    it is 20°C. It will be rainy on the weekend. Be sure to take an umbrella with
    you when you go out for fun. In Kaohsiung, it will be neither hot nor humid on
    the weekend. It’s suitable for all of the family to have a picnic(野餐). In New
    York, it is already snowing. It will last for two weeks, so there will be a white
    Thanksgiving. Don’t forget to make a snowman if you are there. In Auckland, it
    will be hot and dry next week. It’s about 23-31°C. Enjoy your sunshine and put
    on your sunscreen so that you won’t get a sunburn at the beach. Thank you for
    watching Good TV weather report. Have a nice weekend. See you tomorrow.


    neither---nor---既不---也不   humid 潮濕的   suitable 合適的

    last 持續   dry 乾燥的   sunscreen 防曬霜   sunburn 曬傷'
