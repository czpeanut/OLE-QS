  stem: 「有位因倒閉破產而坐牢的男子，在出獄前夕寫了一封信給妻子，問她是否還願意接納自己？如果願意的話，就在家門前的老橡樹上繫一條黃絲帶。如果看不到老橡樹上繫有黃絲帶，他就會隨著巴士默默地離開。在返家路上，男主角的內心忐忑不安，既期待又怕受傷害。在車上他把自己的事告訴司機和同車的乘客，即將到家時他緊張得不敢睜開眼睛，便拜託司機幫他看一看橡樹上有沒有黃絲帶。」請問當巴士快開到家時，男主角的心情可以用下列哪個詞語形容？
  options:
  - label: A
    content: 如坐針氈
  - label: B
