- id: doc_113_新北_福和_國文_g7s1e3_s1_35
  section: 1
  number: 35
  type: single
  page: 4
  stem: "荀巨伯遠看友人疾，值胡賊攻郡，友人語巨伯曰：「吾今死矣，子可去。」巨伯曰：「遠來相視子令吾去，敗義以求生，豈荀巨伯所行邪？」賊既至，謂巨伯曰：「大軍至，一郡盡空，汝何男子，而敢獨止？」巨伯曰：「友人有疾，不忍委之，寧以我身代友人命。」賊相謂曰：「我輩無義之人，而入有義之國。」遂班軍而還，一郡並獲全。\n\
    \         關於本文的文意理解，下列何項正確？"
  options:
  - label: A
    content: 胡賊並未洗劫郡城，便全數撤退
  - label: B
    content: 荀巨伯的朋友病死在亂軍之中
  - label: C
    content: 荀巨伯一直等到朋友去世後才離開
  - label: D
    content: 荀巨伯犧牲了自己，救了友人一命。【綜合】
