  group_stem: '（甲）、請閱讀以下短文，並回答40～42 題：

    　　東安一士人善畫，作鼠一軸，獻之邑令。令初不知愛，漫懸於壁。旦而過之，軸必墜地，屢懸屢墜。令怪之，黎明物色，軸在地而貓蹲其旁。逮舉軸，貓則踉蹌逐之。以試群貓，莫不然者，於是始知________。

    ──曾敏行〈獨醒雜誌〉

    【注釋】：①邑令：縣令。②物色：察看。③踉蹌：形容貓跳躍捕捉的樣子。'
