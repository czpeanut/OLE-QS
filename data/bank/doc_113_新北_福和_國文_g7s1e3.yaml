- id: doc_113_新北_福和_國文_g7s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 「故人西辭黃鶴樓，煙花三月下揚州。孤帆遠影碧山盡，唯見長江天際流。」（李白〈黃鶴樓送孟浩然之廣陵〉）關於這首詩的內容，下列哪一選項敘述正確？
  options:
  - label: A
    content: 「煙花三月下揚州」點出送別季節在孟春時節
  - label: B
    content: 「唯見長江天際流」這句話的主語為孟浩然
  - label: C
    content: 「故人西辭黃鶴樓」點出送別地點與即將遠行者
  - label: D
    content: 「孤帆遠影碧山盡」是指碧綠的青山邊，江上只有一艘船在航行。【第八課】
  lesson_raw:
    number: 第八課
    title: 黃鶴樓送孟浩然之廣陵
    basis: 題目標註【第八課】且引用李白〈黃鶴樓送孟浩然之廣陵〉
- id: doc_113_新北_福和_國文_g7s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 「真摯的情誼也有如長江之水，浩浩蕩蕩，沒有止盡。」此句以不止息的長江水來表現朋友離別的深情。下列何者也使用相同的手法？
  options:
  - label: A
    content: 大江東去，浪淘盡，千古風流人物
  - label: B
    content: 過盡千帆皆不是，斜暉脈脈水悠悠
  - label: C
    content: 請君試問東流水，別意與之誰短長
  - label: D
    content: 日暮鄉關何處是？煙波江上使人愁。【第八課】
  lesson_raw:
    number: 第八課
    basis: 題目標註【第八課】
- id: doc_113_新北_福和_國文_g7s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 「誇飾」修辭為突出或強調某一事物，用誇張的手法加以描述，以強化表達效果，使文章更為鮮活、有趣，加深讀者印象的修辭技巧。請問下列哪個句子沒有使用「誇飾」修辭？
  options:
  - label: A
    content: 只要妹妹一哭，家裡就要淹水了
  - label: B
    content: 這人的熱情，足以將冰山融化
  - label: C
    content: 還是原來那個我，不過流掉幾公升淚所以變瘦
  - label: D
    content: 強烈寒流來襲，即使穿上厚大衣仍然冷到發抖。【第七課】
  lesson_raw:
    number: 第七課
    basis: 題目標註【第七課】
- id: doc_113_新北_福和_國文_g7s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 李白性格豪放率真，才思敏捷，詩歌創作題材廣泛，深受世人稱讚。請問下列何者所描述的對象為李白？
  options:
  - label: A
    content: 紅顏棄軒冕，白首臥松雲。高山安可仰，徒此揖清芬
  - label: B
    content: 昔年有狂客，號爾謫仙人。筆落驚風雨，詩成泣鬼神
  - label: C
    content: 詩聖憂天下，筆端泣血聲。茅屋秋風破，長安春草生
  - label: D
    content: 天推魯仲尼，周遊布典墳。遊遍七十國，不令遇一君。【第八課】
