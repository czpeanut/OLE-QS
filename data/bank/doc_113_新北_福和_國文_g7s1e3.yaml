- id: doc_113_新北_福和_國文_g7s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 〈朋友相交〉一文中，「至於像『友直、友諒、友多聞』，則更傾心以交，願能潛移默化。」根據這段話，作者期望結交益友能發揮下列何種功能？
  options:
  - label: A
    content: 讀書破萬卷，下筆如有神
  - label: B
    content: 在家靠父母，出外靠朋友
  - label: C
    content: 如入芝蘭之室，久而不聞其香
  - label: D
    content: 笨鳥先飛早入林，笨人勤學早成材。【第八課】
  lesson_raw:
    number: 第八課
    title: 朋友相交
    basis: 題目標註【第八課】且提及〈朋友相交〉
- id: doc_113_新北_福和_國文_g7s1e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 請根據下列各句上下文意，選出何句「  」內詞語運用錯誤？
  options:
  - label: A
    content: 在櫻木廢寢忘食的苦練之下，不僅球技大幅提升，甚至被知名球隊「網羅」
  - label: B
    content: 得知比賽輸了的消息之後，我們雖為此暗自「飲泣」，卻從未想過放棄努力
  - label: C
    content: 比起臨陣磨鎗，平日裡多與同學們互相切磋「琢磨」，才更有助於課業進步
  - label: D
    content: 實驗室中，這些「精湛」的儀器要價不菲，請同學們遵循使用規定小心使用。【第九課】
  lesson_raw:
    number: 第九課
    basis: 題目標註【第九課】
- id: doc_113_新北_福和_國文_g7s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 下列文句「 」中的成語，何者使用最不恰當？
  options:
  - label: A
    content: 我跟他不過是「泛泛之交」罷了，談不上什麼交情
  - label: B
    content: 他們本就是「金蘭之交」，如今又結成兒女親家，真是親上加親
  - label: C
    content: 志學之年的小黑的和知命之年的大白兩人一老一少，卻無話不談，可說是「忘年之交」
  - label: D
    content: 阿海和阿杉兩人是同事，因性格相近，興趣相合而結為「市道之交」。【第八課】
  lesson_raw:
    number: 第八課
    basis: 題目標註【第八課】
- id: doc_113_新北_福和_國文_g7s1e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 莎士比亞：「神給你一張臉，可是你自己重新塑造了另一張臉。」這句話的意思與下列何者最相似？
  options:
  - label: A
    content: 人的潛能有限，外貌改變成就無限
  - label: B
    content: 這世界上最神秘的化妝品就是自信
  - label: C
    content: 自然就是美，悅納自己才是有品味
  - label: D
    content: 外表是父母給的，價值是自己給的。【綜合】
- id: doc_113_新北_福和_國文_g7s1e3_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 「人生的道路很長，保持善良也要保留鋒芒，對錯誤的事情說不，對正確的事積極，明確表達自己的底線，爭取自己的權益，用善良去面對好人，用界線去拉開不禮貌的人。」老師在某位同學的期末評語中留下這段話，根據下列學生的特質判斷，應該是寫給何人的評語？
  options:
  - label: A
    content: 對同學要求總是來者不拒的丸尾
  - label: B
    content: 有正義感，常糾正同學錯誤的小夫
  - label: C
    content: 凡事得過且過，做事馬虎的的大雄
  - label: D
    content: 自我中心，多次要求同學配合他的胖虎。【第八課】
  lesson_raw:
    number: 第八課
    basis: 題目標註【第八課】
- id: doc_113_新北_福和_國文_g7s1e3_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 〈音樂家與職籃巨星〉一文透過夾敘夾議的論述闡明什麼道理？
  options:
  - label: A
    content: 勤練是成功的不二法門
  - label: B
    content: 不幸者才能禁得起磨難
  - label: C
    content: 興趣是學習的最佳導師
  - label: D
    content: 人算不如天算，勿強求。 【第九課】
  lesson_raw:
    number: 第九課
    title: 音樂家與職籃巨星
    basis: 題目標註【第九課】且提及〈音樂家與職籃巨星〉
- id: doc_113_新北_福和_國文_g7s1e3_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 在〈音樂家與職籃巨星〉一文中，作者舉名人事例闡發「積累苦練是成功的不二法門」的論點。老師請同學們將各個主題與名人事例進行配對，請問何者配對最不恰當？
  options:
  - label: A
    content: 小蘭：見賢思齊──義大利畫家達文西每天變換不同角度練習素描，紮穩基本功後才創作出世界名畫
  - label: B
    content: 柯南：儉省樸實──美國石油大亨洛克斐勒一生累積巨額財富，卻從不揮霍無度，只求物品夠用即可
  - label: C
    content: 小哀：珍惜時間──宋代文學家歐陽脩雖然政務纏身，仍把握「三上（馬上、枕上、廁上）」做學問
  - label: D
    content: 快斗：堅毅不屈──臺灣鞍馬王子李智凱每週訓練六天，從未鬆懈，只為了在場上展現完美的體操動作。【第九課】
  lesson_raw:
    number: 第九課
    title: 音樂家與職籃巨星
    basis: 題目標註【第九課】且提及〈音樂家與職籃巨星〉
