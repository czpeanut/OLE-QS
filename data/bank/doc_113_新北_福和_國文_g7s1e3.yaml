- id: doc_113_新北_福和_國文_g7s1e3_s1_39
  section: 1
  number: 39
  type: single
  page: 5
  stem: 關於這兩首詩的分析，下列敘述何者最恰當？
  options:
  - label: A
    content: 甲詩認為肉體的死亡即為真正的死亡
  - label: B
    content: 乙詩描寫死者面對死亡的瀟灑與坦然
  - label: C
    content: 兩詩都提及死者將以不同面貌陪伴生者
  - label: D
    content: 兩詩都交代生者不必特意照顧墳墓環境。【綜合】
  group_stem: '【甲】

    瑪麗・伊莉莎白・弗萊〈不要在我墳前哭泣〉：

    「不要在我墳前哭泣，

    我不在那裡；我沒有長眠不起。

    我是縷縷拂面的微風，

    也是雪花鑽閃閃的靈動，

    我是熟穀上的陽光，

    也是舒秋的雨茫。

    當你在寧晨甦醒，

    我是疾奮盤旋的輕鳥。

    也是溫柔的星光。

    不要在我墳前哭泣，

    我不在那裡；我沒有死去。」

    【乙】

    克莉絲蒂娜・羅塞蒂〈歌〉：

    「當我逝去的時候，親愛，

    你別為我唱悲傷的歌；

    我墳上不必安插薔薇，

    也無須濃蔭的柏樹：

    讓蓋著我的青青的草

    淋著雨也沾著露珠；

    假如你願意，請記得我，

    要是你甘心，忘了我。

    我再見不到地面的青蔭，

    覺不到雨露的甜蜜；

    我再聽不到夜鶯的歌喉

    在黑夜裡傾吐悲啼；

    在悠久的昏幕中迷惘

    陽光不升起也不消翳，

    我也許，也許我還記得你，

    我也許，把你忘記。」'
- id: doc_113_新北_福和_國文_g7s1e3_s2_40
  section: 2
  number: 40
  type: single
