    | :--- | :--- | :--- |

    | 魯賓斯坦 | (Ａ)詳述 | (Ｃ)透過對話讓魯賓斯坦現身說法，更具說服力。 |

    | 麥可・喬丹 | (Ｂ)簡述 | (Ｄ)透過敘事呈現麥可・喬丹奮鬥的歷程，說明即便資賦過人，具備生理優勢，也應苦練才能成功。 |'
  options:
  - label: A
    content: (Ａ)
  - label: B
    content: (Ｂ)
  - label: C
    content: (Ｃ)
  - label: D
    content: (Ｄ)
  lesson_raw:
