  stem: 下列「　」中的成語，何者運用正確？
  options:
  - label: A
    content: 該地區金屬污染極為嚴重，成為附近住戶「趨之若鶩」，避之唯恐不及的地方
  - label: B
    content: 凡事皆應打穩基礎，循序漸進的累積經驗，不可「好高騖遠」，妄想一步登天
  - label: C
    content: 這起韓國客機墜毀事件，事故現場宛如人間煉獄，看了不禁令人「嘆為觀止」
  - label: D
