  stem: 根據本文所述，下列關於 ChargeSPOT 提供的服務內容何者錯誤？
  options:
  - label: A
    content: 甲地乙還，可以選擇自己最近的地方租借
  - label: B
    content: 跨國租還，對旅客及商務人士為一大福音
  - label: C
    content: 目前在台灣、日本、韓國等國家可以租借
  - label: D
    content: 使用 ChargeSPOT 可以即時替手機充電。【綜合】【素養題】
  group_stem: '（丁）、請閱讀以下資料，並回答47～48 題：

    　　對於現代人而言，集結交通、行動支付、聯絡、衛星導航、翻譯與記事本功能於一身的手機，可說是相當重要，一旦手機忘了帶出門、沒有電了，便不由自主焦慮了起來。出門在外，當手機沒有電又沒有充電設備時，我們可以怎麼化解這場危機呢？這時不妨看看所在地周圍是否有
    ChargeSPOT 共享行動電源租借站，讓手機恢復一線生機。

    　　ChargeSPOT 除了是台灣共享行動電源的品牌外，更是全球首家提供行動電源跨國租借服務的企業，目前有在台灣、日本、香港、泰國等國家提供這項便利的服務。在行動電源的租借與歸還上，不只是能在同一個國家內有著甲借乙還的服務，選擇離自己最近的地方進行租借，並隨著行程移動地點後再到下一個地點歸還行動電源，還能在提供服務的國家間進行跨國租還，對旅客和商務人士來說是極為便利的服務。為提供更便利的服務，目前
    ChargeSPOT 在台灣已擁有超過 9,000 個合作商戶及超過 200 萬名用戶，更計劃朝向重點國際觀光城市擴展服務範圍。以下為其租借方法說明：

    租借方式

    　　在租借方式上，僅需下載 ChargeSPOT App 並完成註冊，即能搜尋鄰近點位，在掃瞄機台上QR code 後完成租借，並可在任何其他機台完成歸還不受限制。

    〈手機的一線生機：Charge SPOT 共享行動電源〉'
