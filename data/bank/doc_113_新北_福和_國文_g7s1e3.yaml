- id: doc_113_新北_福和_國文_g7s1e3_s2_45
  section: 2
  number: 45
  type: single
  page: 7
  stem: 關於本文，下列推論何者正確？
  options:
  - label: A
    content: 孤獨和寂寞最大的差別在於是否擁有投注熱情的對象
  - label: B
    content: 嬰兒已經有自我意識並可以感受到寂寞的心理狀態
  - label: C
    content: 從積極面來說寂寞代表個體從社會中解脫的自由奔放
  - label: D
    content: 主動接近孤獨且與世隔絕就能成就偉大工作。
  group_stem: "（丙）、請閱讀以下資料，並回答45～46 題：\n孤獨只是「分離的個體」，而寂寞則是「意識的孤島」，意識缺乏投注的對象，無依無靠。令你痛苦的是寂寞，而不是孤獨。「孤獨」是一種物理狀態，而「寂寞」則是一種心理狀態。很多動物是孤獨的，像你所說的鼴鼠，但並不會覺得寂寞。不少嬰兒是孤獨的，但也不會覺得寂寞。只有具備「自我意識」，能意識到自己「存在」的生物，才會有寂寞的體驗。我們的老祖宗說：「君子慎獨」，自古以來，孤獨一直被認為是讓人戒慎恐懼的曖昧狀態，但我想替孤獨說幾句話。\n\
    人總是會有孤獨的時刻，但有些人雖然孤獨，卻並不寂寞。陳子昂登幽州臺時，「前不見古人，後不見來者，念天地之悠悠，獨悵然而淚下」，這是他寂寞的心聲，因為他與周遭的一切缺乏存在的共享；隱居的莊子自覺「天地與我並生，萬物與我為一」，他雖然孤獨，但卻一點也不寂寞。\n\
    就更積極的意義來說，孤獨，其實代表著「自由」，一種暫時從他人與社會習俗的束縛中解脫出來的自由。有些人不僅渴望有孤獨的時間和空間，甚至因孤獨而成就他們的偉大。孤獨對他們來說，乃是生命中最珍貴的時刻。在科學界，愛因斯坦則坦承：「我是一匹獨繮的馬，我無法和其他馬拴在一起工作。」在藝術界，華格納說：「與世隔絕和完全的孤獨是我唯一的慰藉和救贖。」而歌德則說得更絕：「除非是絕對的孤獨，否則我根本無法寫任何東西」。\n\
    他們都孤獨而不寂寞，因為他們的意識有著熱情的投注對象。在無人打擾的孤獨中，他們心無旁騖地完成偉大的工作。\n    寂寞是被動的，它讓我們覺得無所歸屬，求人施捨而又受人摒棄；但孤獨卻可以是主動的。是我們認識另一世界，體驗另一種喜悅的契機。與其因恐懼孤獨而陷入寂寞的泥沼中，不如化被動為主動，積極地擁抱孤獨。\n\
    \                                         ──節錄自王溢嘉〈是寂寞，不是孤獨〉"
