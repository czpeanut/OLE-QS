  section: 1
  number: 25
  type: single
  page: 3
  stem: "（一）\n子貢曰：「君子之過也，如日月之食焉。過也，人皆見之；更也，人皆仰之。」\n（二）\n子夏曰：「小人之過也必文。」\n \n      \
    \ 根據上述，下列說明何者正確？"
  options:
  - label: A
    content: 君子犯錯時如日月一般散發光芒，小人則黯淡無光
  - label: B
    content: 君子一心只求達到目的，小人則綢繆甜蜜，遮掩偽飾
  - label: C
    content: 君子需要別人的鼓勵改正錯誤，小人則不需要他人的幫助
  - label: D
    content: 君子與小人犯錯時最大的差別在於前者承認錯誤，加以改正，後者則加以掩飾。【第八課】
