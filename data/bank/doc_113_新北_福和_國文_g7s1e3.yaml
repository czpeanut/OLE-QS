  stem: 「在高牆和撞向高牆的蛋之間，我永遠站在蛋這邊！」村上村樹此句話主要表達的旨意為何？
  options:
  - label: A
    content: 否定弱者淘汰，強者生存的觀點
  - label: B
    content: 對弱肉強食的社會現象表達憤怒
  - label: C
    content: 對於弱勢的人民表達關懷與支持
  - label: D
    content: 集眾多弱小的力量足以對抗強權。【自學】
  group_stem: "（戊）、請閱讀以下資料，並回答49～50 題：\n    地底的水如何成為生命之泉？要有井把水引上來。愛，如果沒有行動，如同藏在地底的水。\n\
    \    在加拿大肯普特維爾（Kemptville）的六歲男孩萊恩．赫傑克（Ryan Hreljac），他聽老師說：世界有些地方連乾淨的水都喝不到，居民為了取水，一天要走二十公里，而且是又髒又臭被汙染的水。小孩很容易生病，死亡率很高。但只要有七十塊加幣，就可以在非洲挖一口井，讓一村子的人有乾淨的水喝。\n\
    \    萊恩第一次知道，有人會因為沒有乾淨的水喝而死亡。從小他打開水龍頭就有水，要多少有多少，給狗狗洗澡、澆花、洗車……都是清潔的水，他做夢都沒想到，喝一口乾淨的水對有些人是像做夢一樣！\n\
    \    萊恩決定要行動。他跟爸媽要錢，想要捐去非洲挖一口井。爸媽稱讚萊恩有愛心，但建議孩子可以憑自己的力氣去賺這七十塊。\n    萊恩開始行動，幫爸爸洗車賺一塊、幫媽媽擦窗戶賺一塊、去爺爺家撿松果賺一塊、到鄰居家幫忙做東做西，一塊一塊賺，努力四個月，終於存到七十塊。\n\
    \    1998 年4 月下午，媽媽要帶萊恩去「澆水桶」Water Can 基金會捐錢，他們專門幫助貧窮國家建立安全的水資源。萊恩穿上最帥的衣服，還打上蝙蝠俠領帶。\n\
    \    上午他先跟媽媽去辦公室。幫忙削鉛筆、倒垃圾，媽媽的老闆捐給他五塊，他立刻收進放捐款的餅乾盒。下午，萊恩帶著餅乾盒到了「澆水桶」，才知道七十塊只夠買一個人工幫浦，挖一口井至少要兩千塊。\n\
    \    六歲的萊恩說：「喔，那我要再多做一些事！」他小小的腦袋，根本沒在計算這筆錢有多大他一心想的，就是多努力，早一天能在非洲挖井，當地的人就早一天能有乾淨的水喝。「澆水桶」把萊恩的心願公布在網站上。十元、二十元，一筆筆小額捐款像雨點從天而降，流向「澆水桶」。\n\
    \    一年後，在烏干達一口新開的井，冒出清澈乾淨的水。村民歡呼跳舞，這是萊恩為非洲開的第一口井。\n    2000 年7 月27 日，九歲的萊恩來到烏干達的艾桂村，親身看到他開的井，村民列隊在路\n\
    的兩旁，歡迎這個帶來希望的小英雄。兩條長長的人龍，一眼看不到盡頭。當地政府宣佈這\n一天從此為「萊恩日」。萊恩到現在，已經募集超過兩百萬加幣，在非洲、亞洲、南美洲十六\n\
    個國家，開鑿九百九十二口井，讓八十五萬人有乾淨的飲水。\n    2003 年5 月，溫哥華國際衛生會議請萊恩演說，談乾淨的水對開發中國家的重要。會議\n\
    還特別邀請萊恩在烏干達的筆友，跟他一樣十二歲的吉米．阿卡納（Jimmy Akana）來做見\n證。沒想到剛好烏干達發生內戰動亂。萊恩的爸媽替吉米要求加拿大給予人道救援。法院判\n\
    定吉米可以永久居留加拿大，他從此住在萊恩的家，等於被萊恩的爸媽收養。吉米在學校很\n用功，他說希望長大成為律師或老師，好幫萊恩一起改變世界。\n    六歲的孩子發願，果然改變世界，這當然是奇蹟。但這是天上掉下來的恩賜嗎？不是，是\n\
    萊恩爸媽的教育，培育了這個奇蹟。馬克和蘇珊教萊恩的是，愛不只要有心，還要有行動，要\n自己起而行動！\n    「在高牆和撞向高牆的蛋之間，我永遠站在蛋這一邊！」村上春樹好會說、說得好。我想每\n\
    一隻鳥，在牠張開翅膀前，都是一個蛋。蛋，很脆弱，要保護。我們不要叫蛋去撞高牆，而要\n孵化牠，讓牠翅膀長成，飛過高牆。\n \n             \
    \                          ──郝廣才〈行動的水滴才能匯流大河〉"
