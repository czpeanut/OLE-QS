  stem: 關於〈兒時記趣〉一文的文意，下列何者解讀最恰當？
  options:
  - label: A
    content: 能張目對日，明察秋毫──作者眼力佳，能明辨是非
  - label: B
    content: 以叢草為林，蟲蟻為獸──見證生命弱肉強食的一面
  - label: C
    content: 忽有龐然大物，拔山倒樹而來──營造出浩大的聲勢
  - label: D
    content: 捉蝦蟆，鞭數十，驅之別院──作者暴虐無道的性格。【第七課】
