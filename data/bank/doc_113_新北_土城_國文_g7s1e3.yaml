  group_stem: "蠹魚蝕書滿腹，龐然自大，以為我天下飽學之士也。遂昂頭天外，有不可一世之想。出外遊行，遇蜣螂，蜣螂欺之；遇蠅虎，蠅虎侮之。蠹魚忿急，問人曰：「我滿腹詩書，自命為天下通儒，何侮我者之多也？」人皆笑之曰：「子雖自命為滿腹詩書，奈皆食而不化者，雖多何用？」\n\
