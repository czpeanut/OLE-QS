  section: 1
  number: 21
  type: single
  page: 2
  stem: '伏筆是寫作時為下文預先安排情節發展線索的一種手法，可使前後文意互相映照、補足，製造令讀者恍然大悟的效果。關於〈玫瑰淚〉文中伏筆及相對應的情節，下列何者正確？


    | | 伏筆 | 後續相對應的情節 |

    | :--- | :--- | :--- |

    | (A) | 「我非常愛我的媽媽，真希望她不要離開我，但爸爸說她可能真的要去跟妹妹在一起了。」 | 小男孩的妹妹因為過世而無法收到禮物。 |

    | (B) | 「不可能了，耶誕老人不能去我妹妹待的地方……」 | 主角含著熱淚離開，並知道從此生活將會改變。 |

    | (C) | 「我想讓媽媽帶上我的照片，這樣她就永遠不會忘記我了。」 | 主角來到那位母親舉行追思禮拜的教堂，看見她躺在那裡，手中有一枝美麗的白玫瑰，懷裡有一個漂亮的洋娃娃和那個小男孩的照片。
    |

    | (D) | 這些玩具太廉價、太普通，我的孫兒們肯定看不上眼。 | 這時，我看到了一個大約五、六歲的小男孩，正抱著一個可愛的洋娃娃，不住地撫摸它的頭髮。
    |'
  options:
