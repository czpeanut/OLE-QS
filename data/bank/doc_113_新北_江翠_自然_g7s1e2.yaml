- id: doc_113_新北_江翠_自然_g7s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 同學們看到阿國將碘液滴入麵粉中，發現原本白色的麵粉變為紫紅色。依據上述現象，以下各同學所做的推論，何者正確？【實3-1】
  options:
  - label: A
    content: 小江：麵粉中含有澱粉
  - label: B
    content: 曉翠：麵粉中含有葡萄糖
  - label: C
    content: 俊中：麵粉中含有澱粉，但不含葡萄糖
  - label: D
    content: 大勇：麵粉中含有葡萄糖，但不含澱粉
