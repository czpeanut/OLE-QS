  - label: C
    content: 微血管
  - label: D
    content: 腸壁皺褶
  group_stem: 乳糜瀉，又稱麩質敏感性腸病，是指對人類對於含麩質的食物過敏而導致的一種腸道疾病，常見症狀包含慢性腹瀉、腹脹、食慾不振，以及生長遲緩等。患者攝取到麩質後，身體會生成抗體而影響許多器官，並引起發炎反應導致小腸的■萎縮(如圖所示)，進而引發營養不良、貧血等問題。目前認為對此病唯一有效的治療方式是讓病患採取嚴格的無麩質飲食。這樣可讓大多數患者腸道復原、症狀改善並降低產生併發症的風險。試回答下列問題。
  shared_asset: g2_25_27
