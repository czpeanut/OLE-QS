  - label: D
    content: 洗淨芹菜，避免病原體或髒汙影響實驗
  group_stem: '阿國在做完「植物體內水分的運輸」實驗後，在家重新設計了一套實驗。首先他準備四支粗細、長度相近的芹菜，分別編號甲、乙、丙、丁，並各自做不同處理如下：

    甲：不做任何處理

    乙：在葉片下表皮塗抹凡士林

    丙：在葉片上表皮塗抹凡士林

    丁：在葉片上下表皮均塗抹凡士林。

