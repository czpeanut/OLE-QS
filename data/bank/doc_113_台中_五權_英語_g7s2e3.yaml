- id: doc_113_台中_五權_英語_g7s2e3_s2_34
  section: 2
  number: 34
  type: single
  page: 3
  stem: Which season is this poem(詩) about?
  options:
  - label: A
    content: Spring.
  - label: B
    content: Summer.
  - label: C
    content: Fall.
  - label: D
    content: Winter.
  group_stem: 'The sky is getting clean and clear.

    The grass is wearing new and green.

    Winter is over, and a new season is here.

    The air smells fresh and sweet.

    The hot summer is far away;

    A little rabbit comes out to play.

    A bird is busy in a tree

    Waking a daisy from her sleep.


    Little daisy, little daisy,

    People call the flower the “day’s eye.”

    When she opens her eye,

    The season brings us joy and life.

    smell(s) 聞起來 Wake/Waking 醒來;喚醒 When 當…時候'
