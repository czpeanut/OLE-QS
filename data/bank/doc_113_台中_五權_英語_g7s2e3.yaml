- id: doc_113_台中_五權_英語_g7s2e3_s2_38
  section: 2
  number: 38
  type: single
  page: 4
  stem: According to(根據) the reading, which one is correct(正確的)?
  options:
  - label: A
    content: Dennis and Marco ride a donkey to school.
  - label: B
    content: Katy spends(花費) at least(至少) one hour when she goes to school.
  - label: C
    content: Dennis and his brother don’t go to school when it rains.
  - label: D
    content: Katy and his sister swim across the river to school.
  group_stem: "Kids around the world have different ways of going to school. Some\
    \ walk, some ride bikes, and some take buses. But for the kids in poor countries,\
    \ going to school can be very hard, just like Katy and her sister in Ecuador.\
    \ First, they need to walk for half an hour to the river. From there, they take\
    \ a canoe to school. It’s another half an hour. When they are inside the canoe,\
    \ they can’t move too much. They are afraid of falling into the river. The trip\
    \ is long, but they still have fun.\n    Then there’s Dennis and his brother in\
    \ Columbia. Dennis wakes up at 5:00 every morning. He and his brother, Dilan,\
    \ then ride their donkey, Marco, to school. The way to school is often bad, especially\
    \ when it rains. But they still want to study. They know it is the only way to\
    \ change their future.\n    Now, dear students, think about this. Are you looking\
    \ for excuses for not going to school? Is a ten-minute walk in the sun really\
    \ hard for you? Remember the will of Katy, Dennis and many other kids like them!\n\
    poor 貧窮的 Ecuador 厄瓜多(國家) afraid 害怕的 Columbia 哥倫比亞(國家) donkey 驢子 especially 特別是\
    \ change 改變 future 未來 excuses 藉口"
