- id: doc_113_新北_板橋_社會_公民_g8s2e2_s1_38
  section: 1
  number: 38
  type: single
  page: 1
  stem: '知名網紅周花花在社群網站上，公開指謫前男友在與她交往期間，多次劈腿，對感情不忠。刑法中並無處罰劈腿男女的規定，所以不能幫她處罰劈腿男，請問：此事件不符合哪個原則？

    選項：'
  options:
  - label: A
    content: 無罪推定原則
  - label: B
    content: 罪刑法定原則
  - label: C
    content: 妨害公序良俗
  - label: D
    content: 誠實信用原則
- id: doc_113_新北_板橋_社會_公民_g8s2e2_s1_39
  section: 1
  number: 39
  type: single
  page: 1
  stem: 16 歲的鎮安在教室嬉鬧，不小心把教室電腦的螢幕撞壞，學校請鎮安支付一筆修繕費用，請根據你所學的知識，分析以下何種情形最為可能？
  options:
  - label: A
    content: 該項行為是屬於侵權行為
  - label: B
    content: 鎮安的法定代理人無須負連帶賠償責任
  - label: C
    content: 賠償的方式是以金錢賠償為原則
  - label: D
    content: 因為是過失行為，所以無需承擔責任
- id: doc_113_新北_板橋_社會_公民_g8s2e2_s1_40
  section: 1
  number: 40
  type: single
  page: 1
  stem: 定禾為了讓自己網路遊戲的角色變強，於是盗用網友的帳號，將遊戲內的寶物與遊戲幣洗劫一空。請問:定禾的行為是否需要負法律責任?
  options:
  - label: A
    content: 不用，網路是虛擬的世界，因此現實生活的法律無法約束
  - label: B
    content: 不用，雖然盗用別人虚擬世界的財產是不對的，但是目前無法可管
  - label: C
    content: 需要，定禾的行為已經觸犯了《刑法》的「妨害電腦使用罪」
  - label: D
    content: 需要，定禾的行為雖未構成犯罪，但已經違法。
- id: doc_113_新北_板橋_社會_公民_g8s2e2_s1_41
  section: 1
  number: 41
  type: single
  page: 1
  stem: 櫻桃以犯罪被害人的身分，去警察局報案，請求追訴犯罪 的行為，是以何種方式尋求權利救濟？
  options:
  - label: A
    content: 自訴
  - label: B
    content: 告發
  - label: C
    content: 告訴
  - label: D
    content: 公訴
  group_stem: 現年26 歲的櫻桃在母親節當天與家人到宜蘭旅遊，不料在超商提款時，因專心帶著孩子，一時分神，操作完成後卻忘記將提領的5000 元現金取走，被在後方的16
    歲高一學生葡萄順手牽羊拿走；櫻桃返回店家時發現現金已遺失，決定要報警處理，警方循線找到葡萄，將她依侵占罪嫌送辦。
- id: doc_113_新北_板橋_社會_公民_g8s2e2_s1_42
  section: 1
  number: 42
  type: single
  page: 1
  stem: 根據刑法規定，侵占罪屬於非告訴乃論案件。櫻桃事後發 現對方年紀尚輕，同意只要對方私下返還金錢，即給予機會不再追究。請問：她可否去警局聲明撤回此案告訴？
  options:
  - label: A
    content: 不可以，依法此類案件只能透過訴訟方式處理
  - label: B
    content: 可以，因為案子尚未交由檢方接手
  - label: C
    content: 不可以，因為櫻桃屬於完全行為能力人，要對自己的提告行為負責
  - label: D
    content: 可以，因為葡萄屬於限制責任能力人
  group_stem: 現年26 歲的櫻桃在母親節當天與家人到宜蘭旅遊，不料在超商提款時，因專心帶著孩子，一時分神，操作完成後卻忘記將提領的5000 元現金取走，被在後方的16
    歲高一學生葡萄順手牽羊拿走；櫻桃返回店家時發現現金已遺失，決定要報警處理，警方循線找到葡萄，將她依侵占罪嫌送辦。
- id: doc_113_新北_板橋_社會_公民_g8s2e2_s1_43
  section: 1
  number: 43
  type: single
  page: 2
  stem: 某律政職人影集深受觀眾喜愛，劇中呈現不同法律職業的角色定位與功能。其中有一名角色，經常主導刑事案件的調查與起訴，並根據法律事實起訴被告進入審判流程。下列哪一項角色行為，最能具體反映檢察官的工作職責？
  options:
  - label: A
    content: 代表原告在法庭上為權益發聲
  - label: B
    content: 接受民眾報案後，指揮警方偵查犯罪事實
  - label: C
    content: 在法庭上為被告辯護以保障人權
  - label: D
    content: 聆聽雙方證詞後做出案件最終裁決
- id: doc_113_新北_板橋_社會_公民_g8s2e2_s1_44
  section: 1
  number: 44
  type: single
  page: 2
  stem: 附圖3 是宣導反賄選的海報，根據圖中內容判斷，關於賄選行為的處罰，與下列何者所應負起的法律責任類型相同？
  options:
  - label: A
    content: 拒絕償還積欠友人債務
  - label: B
    content: 打球不慎打破鄰居窗戶
  - label: C
    content: 無照駕駛違反交通法規
  - label: D
    content: 破壞橋梁導致公共危險。
