- id: doc_113_新北_板橋_社會_公民_g8s2e2_s1_47
  section: 1
  number: 47
  type: single
  page: 2
  stem: 阿正在連續劇中看到「打官司」的情節，進而和班上同學討論民事訴訟與刑事訴訟的相關內容。下列同學所提出的說法何者正確？
  options:
  - label: A
    content: 大華：「民事訴訟需繳訴訟費給檢察官。」
  - label: B
    content: 珍珍：「民事訴訟可提出損害賠償要求。」
  - label: C
    content: 阿丁：「刑事訴訟限由被害人才可提起。」
  - label: D
    content: 毛毛：「刑事訴訟若不服可再提起公訴。」
- id: doc_113_新北_板橋_社會_公民_g8s2e2_s1_48
  section: 1
  number: 48
  type: single
  page: 2
  stem: 有關《民法》和《刑法》的敘述，何者正確？
  options:
  - label: A
    content: 刑罰的種類包含死刑、無期徒刑、損害賠償等
  - label: B
    content: 若遭受家庭暴力，可依《刑法》規定剝奪不適任父母的親權
  - label: C
    content: 不小心踩碎同學的眼鏡，因為是過失，故不須負民事責任
  - label: D
    content: 根據《民法》借錢給他人，若長期未要求對方償還而過了時效，對方可以「消滅時效」理由拒絕還債
- id: doc_113_新北_板橋_社會_公民_g8s2e2_s1_49
  section: 1
  number: 49
  type: single
  page: 2
  stem: 近年來，許多重大刑事案件，法院的判決與國民的期待有很大落差，因此政府極力推動司法改革，希望透過國民參與決定被告有罪與否及刑期，藉此降低此一爭議。立法院於民國
    109 年三讀通過《國民法官法》，於民國 112 年上路實施。「國民法官」將參與下列哪一刑事訴訟程序？
  options:
  - label: A
    content: 偵查
  - label: B
    content: 起訴
  - label: C
    content: 審判
  - label: D
    content: 執行。
- id: doc_113_新北_板橋_社會_公民_g8s2e2_s1_50
  section: 1
  number: 50
  type: single
  page: 2
  stem: 下列何者是指由被害人委任律師直接向法院提起的訴訟？
  options:
  - label: A
    content: 自訴
  - label: B
    content: 自首
  - label: C
    content: 告訴
  - label: D
    content: 告發。
