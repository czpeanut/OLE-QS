- id: doc_113_新北_板橋_社會_公民_g8s2e2_s1_35
  section: 1
  number: 35
  type: single
  page: 1
  stem: 快樂市警方查獲多名未滿14 歲的少年以幫派名義在網路上散播招募訊息。雖然行為涉及犯罪，但根據我國《刑法》規定，這些少年不會受到《刑法》的處罰。這些少年的法律責任應為下列何者？
  options:
  - label: A
    content: 處以完全的刑罰
  - label: B
    content: 不會受到任何處罰
  - label: C
    content: 會處罰，但不宜用《刑法》處罰
  - label: D
    content: 可減輕刑罰
- id: doc_113_新北_板橋_社會_公民_g8s2e2_s1_36
  section: 1
  number: 36
  type: single
  page: 1
  stem: 附圖1 為四家律師事務所某年的業務資料,香香為其中一家事務所的員工,且該事務所當年接受的委託業務中,能以調解方式處理的件數總計為50 件。根據表中資料判斷,香香最可能在哪一家事務所工作?
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
