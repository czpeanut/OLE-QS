  type: single
  page: 4
  stem: What is NOT a motion of a tube man?
  options:
  - label: A
    content: Waving arms.
  - label: B
    content: Bowing to greet people.
  - label: C
    content: Dancing crazily.
  - label: D
    content: Jumping up and down.
  group_stem: 'III. (From ABC Magazine)

    Outside a new shop, you see a tall man waving his arms at you. He''s also bowing
    down and rising up to greet you. His crazy dancing motion is fun to watch. When
    you get close, you realize the man isn''t human. He''s a tube man. His body and
    arms are made of tubes of plastic fabric, and a fan blows air into them. Tube
    men are also called tall boys. The artist Peter Minshall created tall boys for
    the 1996 Summer Olympics in Atlanta, USA. His tall boys were 60 feet in height
    and had two legs instead of just a body. People loved his humanlike balloons,
    and soon tube men were everywhere.'
