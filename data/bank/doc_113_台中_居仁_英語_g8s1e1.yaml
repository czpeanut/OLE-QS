  section: 5
  number: 3
  type: single
  page: 3
  stem: Why were payphones useful in the past?
  options:
  - label: A
    content: They let (讓) people make a call on the street.
  - label: B
    content: They let people make free calls.
  - label: C
    content: They let people charge(充電) their cell phones.
  - label: D
    content: They let people sit for a break.
  group_stem: 'II. (From ABC Magazine)

    Before cell phones, people had to find a payphone if they wanted to make a call
    on the street. In London, payphones were easy to find because they were in red
    telephone boxes. The most famous model of the red telephone box is the K2. It
    was designed by Sir Giles Gilbert Scott and turned 100 in 2024. Sadly, these red
    phone boxes are losing their purpose these days. Only twenty thousand of the nearly
    one hundred thousand red phone boxes in the UK are still in operation. Thanks
    to a special program, people are giving new life to these phone boxes by changing
    them into libraries, art galleries, and more.

    ★thousand 千'
