  group_stem: '(No. 6 ~ No. 7)

    Long time ago, people in a small town wanted to hold a big party on Thanksgiving,
    but they didn’t have much juice. So a month before Thanksgiving, they put a huge
    container in front of the town mayor’s house. The town mayor wanted everyone in
    the town to pour a bottle of juice into the container, and then there would be
    enough juice to drink at the party.

    Ken, a person in the town, thought it would be a stupid idea to do this. Therefore,
    he poured water in it. He believed that nobody else would find out. On the night
    of the party, everyone in the town couldn’t wait to celebrate and enjoy the juice.
    To their surprise, they got only water from the container. People in the town
    all did the same thing, and they all laughed!

