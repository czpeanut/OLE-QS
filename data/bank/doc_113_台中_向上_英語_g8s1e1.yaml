  group_stem: "(No. 1 ~ No. 3)\nYou may not really know who Mozart is, but you must\
    \ know his famous children’s song “Twinkle, Twinkle, Little Star.” This great\
    \ musician was born in Austria in 1756. He started to like music very much when\
    \ he was little. His father was a musician and was really happy about this. When\
    \ Mozart was three, he learned to play the harpsichord. It is a musical instrument\
    \ that sounds and looks like a piano. He even wrote his first music at the age\
    \ of five!\n    Another amazing thing about Mozart is that he could write down\
    \ and play the music for listening just one time. One day, he picked up a violin\
    \ and played the music without any mistake. Everyone was surprised at that time.\
    \ No one taught Mozart how to play the violin before!\n   When Mozart grew up,\
    \ he became a music teacher. He had many students, but he wasn’t rich. Mozart\
    \ died in 1791. Due to the custom, few people went to Mozart’s funeral.\n musician\
    \ 音樂家/ born 出生/ musical instrument 樂器/ due to 因為/ custom習俗/ funeral 葬禮"
