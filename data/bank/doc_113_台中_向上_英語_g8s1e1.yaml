    content: Fish actually sleep like people do.
  group_stem: "(No. 8 ~ No. 10)\n   Do you keep fish as pets? If you do, do you know\
    \ how your fish sleep? You may see that fish seldom or never rest right on the\
    \ bottom of the fish tank. You might think your fish don’t sleep. This isn’t really\
    \ true, however. Fish need to rest, but unlike us, they do it in a special way.\
    \ If you look at your fish for a while, you may find that sometimes they don’t\
    \ move. That’s because they are taking a rest or sleeping. They don’t “lie down.”\
    \ They just float and look like staying at the same place. During this time, fish\
    \ are having their energy back.  \nThere is another different thing between fish\
    \ and people. When we sleep, we close our eyes. Fish don’t close their eyes when\
    \ they rest because they don’t have eyelids. By the way, if you see your fish\
    \ “lies down,” and its belly is on the top, it might be in danger or sick! Take\
    \ it out of the fish tank and go to the vet!\nbottom 底部/ fish tank 魚缸/ float\
    \ 漂浮/ eyelid 眼瞼/ belly 肚子/ vet 獸醫"
