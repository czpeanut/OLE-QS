  - label: C
    content: He used his skills to become rich.
  - label: D
    content: He didn’t make good use of the money.
  group_stem: '(No.4 ~ No. 5)

    Mr. Ellison was a rich man. He had two sons, Marcus and Jacob. Marcus was a very
    sweet person. He was nice and always said something good to his father, but Marcus
    wasn’t smart and didn’t have a skill. He wasn’t good at anything. Because of this,
    Mr. Ellison decided to give all his money to Marcus after he died. Then he knew
    this would be unfair to Jacob. Mr. Ellison loved both of his sons, so he asked
    many teachers to teach Jacob skills.

    After Mr. Ellison died, Marcus got all his money. Years later, Marcus became poor.
    He spent all the money and didn’t save any of it. On the other hand, Jacob became
    rich. He used his skills to make money. He helped Marcus learn some skills so
    that Marcus could make some money.

     decided 決定/ unfair 不公平的/ spent 花費/ on the other hand 另一方面'
