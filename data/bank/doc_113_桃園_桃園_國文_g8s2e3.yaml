  group_stem: '陳涉少時，嘗與人傭耕。輟耕之壟上，悵恨久之，曰：「苟富貴，無相忘。」傭者笑而應曰：「若為傭耕，何富貴也？」陳涉太息曰：「嗟乎！燕雀安知鴻鵠之志哉！」
    ──節錄自《史記》

    【注釋】：①之：至、到。 ②無相忘：不會忘記你們。 ③若：你。'
