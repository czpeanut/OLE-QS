  stem: 「在超級市場中，一個消費者可以全程不和任何人交談，人與人接觸的必要減至最低。」上述文字說明了什麼現象？
  options:
  - label: A
    content: 在超級市場裡，人與人之間缺少互動
  - label: B
    content: 消費過程如果遇到糾紛，將無從申訴
  - label: C
    content: 賣場商品擺設清楚，購物時可以迅速找到所需的商品
  - label: D
    content: 民眾進出毫無限制，超級市場沒有採取會員制管理。
  group_stem: '在超級市場中，一個消費者可以全程不和任何人交談，人與人接觸的必要減至最低，甚至連人與物的接觸也經由層層的包裝，減低手的碰觸和骯髒。你連它們的重量差異都難以感受，因為它們等重包裝。你只能以目光探視它們，以視覺做賭博，買回家拆封，發現另一面霉透了，只好自認倒楣。生鮮食品擺脫了血淋淋的動物狀態；青菜脫離了塵土；梨子和蘋果各自裹了玻璃紙和發泡棉，葡萄有葡萄形狀的透明塑膠盒，摸不著。你一個人在商品之間行走，它們環繞兩旁，形同一個組織嚴密、紀律嚴明的物體系，而且全副武裝，沒有一絲缺憾，無懈可擊。

    也許我是個太過在意「物質感」的人，對於摸不著的物品容易感到不確定，所以在超級市場裡，我總是想法將物品翻來翻去，想透過透明的薄膜感知它們的確實狀態。 ──柯裕棻〈疏離的超級市場〉'
  answer:
  - A
  answer_source: answer_key_vlm
  tags:
