  group_stem: "(4~5)\nAmsterdam is a bike-friendly city. Some people go to work by\
    \ bike, and others use it to take their children \nto school or walk their dogs.\
    \ Amsterdam is also a “city of water.” There are a lot of canals in this city.\
    \ Water is \npart of people’s life. Unavoidably, some bikes end up in the water.\
    \ They fall into the canals because of wind. \nHowever, most bikes are there because\
    \ people throw them in during the night. Therefore, the job of “bike fishing”\
    \ \nwas born.  \nBike fishermen don’t catch fish. They fish for bikes. Their job\
    \ is to keep the canals clean and safe for the \nboats. They go through the canals\
    \ and look for bikes on a boat. Then they use a great claw machine to pull bikes\
    \ \nout of the water. They even pull up other things like fridges and cars. Bike\
    \ fishermen fish around 15,000 bikes \nfrom the canals each year. The bikes end\
    \ up at a recycling center and become cans. \n \n  bike-friendly 對腳踏車友善的 canal\
