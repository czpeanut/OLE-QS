    content: '4'
  - label: B
    content: '91'
  - label: C
    content: '365'
  - label: D
    content: '1000'
  group_stem: 'Chichen Itza, Mexico

    Chichen Itza was an old city in Mexico. The Mayan people built it over years ago.
    It was a big city with many temples and ceremonies. Many people lived and worked
    there. The city was very important for the Mayans.

    El Castillo is a famous pyramid. It has 91 steps on each side. If you count all
    the steps, there are 365 steps in total. This number is the same as the days in
    one year. The Mayan people were very smart. They watched the sun and stars to
    learn about time and seasons.

    In spring and fall, the sun made a shadow on the pyramid. The shadow looked like
    a snake moving down the stairs. Many people came to watch this. The Mayan people
    had many ceremonies to thank their gods. Today, people around the world come to
    see the old buildings and learn about its history.

     Mexico 墨西哥 Mayan 馬雅的/馬雅人 ceremonies 儀式 pyramid 金字塔 shadow 影子'
