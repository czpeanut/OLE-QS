- id: doc_111_高雄_大灣_自然_g8s2e3_s2_33
  section: 2
  number: 33
  type: single
  page: 4
  stem: 伽利略溫度計內的透明液體為碳氫化合物，對溫度很敏感，當溫度上升時，體積膨脹，則密度下降。此種透明液體可以歸類為下列何者？
  options:
  - label: A
    content: 烴類
  - label: B
    content: 有機酸類
  - label: C
    content: 醇類
  - label: D
    content: 酯類。
  group_stem: 伽利略溫度計由密閉的玻璃圓筒、透明液體及一些掛有標示溫度的彩色玻璃球所構成，如右圖所示。透明液體為碳氫化合物，對溫度很敏感，當溫度上升時，體積膨脹，則密度下降。每個玻璃球內液體的重量和密度都有些微的不同，根據浮力原理，當透明液體的溫度上升時，其密度變小，彩色玻璃球排開液體的重量就會減少，即浮力減少，彩色玻璃球便會下沉；反之，彩色玻璃球就會上升。液體的密度隨著溫度改變，使得彩色玻璃球上下移動。每個彩色玻璃球都掛著刻有溫度的金屬圓盤，讀取溫度時，可找懸浮在液體中間的玻璃球；如果沒有浮在中間的玻璃球，可以取低處最上方和高處最下方溫度的平均值。試回答下列問題：
