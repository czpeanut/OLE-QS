- id: doc_113_桃園_桃園_數學_g8s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '以下是小桃、小園兩人說明$\sqrt{15}+\sqrt{8}$和$\sqrt{15+8}$的關係：

    小桃： 因為 $3<\sqrt{15}<4$，所以$\sqrt{15}$的整數部分是 3

    因為 $2<\sqrt{8}<3$ ，所以$\sqrt{8}$的整數部分是 2

    由上可知 $\sqrt{15}+\sqrt{8}>5$---(1)

    因為 $4<\sqrt{15+8}=\sqrt{23}<5$，所以$\sqrt{15+8}$的整數部分是 4---(2)

    由(1)、(2)可知 $\sqrt{15}+\sqrt{8}>\sqrt{15+8}$

    小園： 根據乘法公式 $(\sqrt{15}+\sqrt{8})^{2}=15+8+\sqrt{120}$

    且 $(\sqrt{15+8})^{2}=15+8$，因此 $\sqrt{15}+\sqrt{8}>\sqrt{15+8}$

    請問： 對於兩人的說法，誰的說法完全正確？ 。'
  options:
  - label: A
    content: 小桃正確
  - label: B
    content: 小園正確
  - label: C
    content: 兩人均正確
  - label: D
    content: 兩人均錯誤
  tags:
    chapter:
      publisher: 翰林
      book: 八上
