    labeled_by: ai
- id: doc_113_桃園_桃園_數學_g8s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '已知$2x^{2}$－x－10＝(2x－5)(x＋2)，請問下列敘述有哪些是正確的？ （課本）

    (甲) $2x^{2}$－x－10 是 (x＋2) 的倍式。

    (乙) (－x－2) 是3(2x－5)(x＋2) 的因式。

    (丙) $2x^{2}$－x－10 是3(2x－5)(x＋2) 的因式。

    (丁) (2x－5)(x＋2) 是 -5($2x^{2}$－x－10)的倍式。'
  options:
  - label: A
    content: 甲
  - label: B
    content: 甲、乙
  - label: C
    content: 甲、乙、丙
  - label: D
    content: 甲、乙、丙、丁
