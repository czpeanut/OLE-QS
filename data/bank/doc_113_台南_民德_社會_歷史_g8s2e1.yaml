  section: 1
  number: 11
  type: single
  page: 1
  stem: 儒家提到的『三綱』指的是『君為臣綱、夫為妻綱、父為子綱』，其意思是君為臣的表率，而人民為君主的附屬品，故無獨立自主的人格；父親為兒子的表率，則兒子是父親的附屬品，故無獨立自主的人格；丈夫為妻子的表率，則妻子為丈夫的附屬品，故無獨立自主的人格。中國人之所以缺乏獨立的人格，都是導因於『三綱』的說法。傳統上提到的盡忠、盡孝、守節，皆是讓人無法擁有獨立人格的道德規範。上述批判儒家的論點可能來自是何人？
  options:
  - label: A
    content: 宋教仁
  - label: B
    content: 段祺瑞
  - label: C
    content: 孫中山
  - label: D
    content: 陳獨秀。
