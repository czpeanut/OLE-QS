  section: 1
  number: 42
  type: single
  page: 4
  stem: 巴黎和會中，日本最有可能提出下列何種論點說服英法，認同日本擁有山東的主權？
  options:
  - label: A
    content: 馬關條約時早已割讓山東半島，後受列強逼迫而讓清朝贖回
  - label: B
    content: 日俄戰爭後，俄國轉讓山東主權，日本勢力正式進入中國山東
  - label: C
    content: 袁世凱早已簽認二十一條要求，承認日本擁有山東權利
  - label: D
    content: 中國參加第一次世界大戰屬戰敗國一方，無權要求收回山東權利。
  group_stem: '【乙】中國作為戰勝國之一受邀參加巴黎和會，政府派出了以陸徵祥等人為首的外交使團赴法參加會議，他們希望能為中國收回山東的權益，但英法卻主張將山東權利轉給日本。1919
    年6 月28 日是全體戰勝國在和約上簽字的最

    後一天，但作為戰勝國的中國代表沒有出席會議，拒絕簽字，山東問題成為懸案。之後召開的華盛頓會議上討論了山東問題，中國代表強烈要求收回山東主權和廢除「二十一條」，在美英斡旋下，中日兩國於1922
    年2 月4 日在會外簽訂了《解決山東懸案的條約》及其附約，成功收回山東權益。'
