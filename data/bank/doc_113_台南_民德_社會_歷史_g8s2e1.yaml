  stem: 《二十年來中國之革命戰爭》一書提到：「二次革命的失敗，導致國民黨在各省之武力，都被北洋軍所消滅。國民黨旣失其武力，其在議會及輿論之勢力，亦受壓迫。辛亥革命所成之事業，至此僅存中華民國之四字矣。」請問關於二次革命的敘述何者正確？
