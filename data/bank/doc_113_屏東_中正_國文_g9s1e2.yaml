- id: doc_113_屏東_中正_國文_g9s1e2_s5_7
  section: 5
  number: 7
  type: single
  page: 5
  stem: 本文中作者以「若脫籠之鵠」形容什麼？
  options:
  - label: A
    content: 脫下冬裝，如同剛換羽毛的天鵝一般輕鬆
  - label: B
    content: 心情像剛從籠子裡逃出的天鵝般開闊喜悅
  - label: C
    content: 受景色感動，想以天鵝般的姿態手舞足蹈
  - label: D
    content: 心情如同剛離巢的天鵝，極欲施展抱負。
  group_stem: '燕地寒，花朝節後，餘寒猶厲。凍風時作，作則飛沙走礫。局促一室之內，欲出不得。每冒風馳行，未百步輒返。

    廿二日，天稍和，偕數友出東直。至滿井，高柳夾堤，土膏（１）微潤，一望空闊，若脫籠之鵠。於時冰皮始解，波色乍明，鱗浪層層，清澈見底。山巒為晴雪所洗，娟然如拭，鮮妍明媚。柳條將舒未舒，柔梢披風，麥田淺鬣寸許。遊人雖未盛，泉而茗者，罍（２）而歌者，紅裝而蹇者，亦時時有。風力雖尚勁，然徒步則汗出浹背。凡曝沙之鳥，呷浪之鱗，悠然自得，毛羽鱗鬣（３）之間，皆有喜氣。始知郊田之外未始無春，而城居者未之知也。


    【注釋】（１）土膏：肥沃的土地。（２）罍：音ㄌㄟˊ，此指喝酒。（３）毛羽鱗鬣：此泛指所有生物。鬣，音ㄌㄧㄝˋ。

    （改寫自袁宏道 滿井遊記）'
