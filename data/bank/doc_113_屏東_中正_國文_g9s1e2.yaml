- id: doc_113_屏東_中正_國文_g9s1e2_s4_1
  section: 4
  number: 1
  type: single
  page: 1
  stem: 關於臺北‧淡水一文的分析，下列何者最為正確？
  options:
  - label: A
    content: 依空間順序，列舉多處景點以彰顯淡水的全新面貌
  - label: B
    content: 依時間順序，運用轉化修辭融合自然景觀與人文風情
  - label: C
    content: 以第一人稱的視角，描繪淡水的各種特殊景致及其可觀之處
  - label: D
    content: 不加入絲毫個人的感受，只客觀陳述淡水的地理環境與歷史
  lesson_raw:
    title: 臺北‧淡水
    basis: 題幹提及課名「臺北‧淡水」
  tags:
    textbook: 九上 第一課 臺北．淡水
    labeled_by: ai
    chapter:
      publisher: 南一
      book: 九上
      subject: 國文
      code: 第一課
      title: 臺北．淡水
      chapter: null
- id: doc_113_屏東_中正_國文_g9s1e2_s4_2
  section: 4
  number: 2
  type: single
  page: 1
  stem: 下列出自臺北‧淡水一文的文句，何者最能看出淡水仍保有懷舊氛圍？
  options:
  - label: A
    content: 微薄的船資，便能享受放逐他鄉的悲壯
  - label: B
    content: 從堤岸繼續往前走，是拍攝婚紗照的新人最常出沒處
  - label: C
