- id: doc_113_屏東_中正_國文_g9s1e2_s5_3
  section: 5
  number: 3
  type: single
  page: 4
  stem: 下列哪一句最能說明「站在盛唐的中心地位的，不是帝王，不是貴妃，不是將軍，而是這些詩人」的含意？
  options:
  - label: A
    content: 他們很把這種行為當作一件正事
  - label: B
    content: 腳在何處，故鄉就在何處
  - label: C
    content: 繡口一吐就半個盛唐
  - label: D
    content: 在山水間周旋，與大地結親
  group_stem: '在李白的時代，中華民族還不太沉悶，這些詩人在這塊土地上來來去去，並不像今天那樣覺得是件怪事。他們的身上並不帶有政務和商情，只帶著一雙銳眼、一腔詩情，在山水間周旋，與大地結親，寫出了一排排毫無實用價值的詩句，在朋友間傳觀吟唱，已是心滿意足。他們很把這種行為當作一件正事，為之而不怕風餐露宿，長途苦旅。結果，站在盛唐的中心地位的，不是帝王，不是貴妃，不是將軍，而是這些詩人。余光中
    尋李白詩云：

    酒入豪腸，七分釀成了月光

    剩下的三分嘯成劍氣

    繡口一吐就半個盛唐

    這幾句，我一直看成是當代中國詩壇的罕見絕唱。

    李白時代的詩人，既摰戀著四川的風土文物，又嚮往著下江的開闊文明，長江於是就成了他們生命的便道，不必下太大的決心就解纜問槳。腳在何處，故鄉就在何處，水在哪裡，道路就在哪裡。他們知道，長江行途的最險處無疑是三峽，但更知道，那裡又是最湍急的詩的河床。


    （余秋雨 文化苦旅節錄 ）'
