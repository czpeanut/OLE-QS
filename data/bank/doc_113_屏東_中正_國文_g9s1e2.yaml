- id: doc_113_屏東_中正_國文_g9s1e2_s5_1
  section: 5
  number: 1
  type: single
  page: 3
  stem: 作者在觀看阿里山上那株三千年的「神木」後，心生何種感觸？
  options:
  - label: A
    content: 樹是上帝的創造，人豈能貪天之功
  - label: B
    content: 震懾於參天大樹，得到精神上解放
  - label: C
    content: 樹老只剩下憔悴，人老也必將衰弱
  - label: D
    content: 神木能枯樹生花，印證莊子的寓言
  group_stem: '最近我到阿里山去遊玩，路邊見到那株「神木」，據說有三千年了，比起莊子所說的「以八千歲為春，以八千歲為秋」的上古大椿還差一大截子，總算有一把年紀，可是看那一副形容枯槁的樣子，只是一具枯骸，何神之有！我不相信「枯樹生華」那一套。我只能生出「樹猶如此，人何以堪」的感想。

    我看見阿里山上的原始森林，一片片，黑壓壓，全是參天大樹，鬱鬱蔥蔥。但與我從前在別處所見的樹木氣象不同，北平公園大廟裡的柏，以及梓橦道上的所謂張飛柏，號稱「翠雲廊」，都沒有這裡的樹那麼直那麼高。像黃山的迎客松，屈鐵交柯，就更不用提，那簡直是放大了的盆景。這裡的樹大部分是檜木，全是筆直的，上好的電線桿子材料。姿態是談不到，可是自有一種榛莽未除入眼荒寒的原始山林的意境。局促在城市裡的人走到原始森林裡來，可以嗅到「高貴的野蠻人」的味道，令人精神上得到解放。


    （梁實秋 樹）'
