- id: doc_113_屏東_中正_國文_g9s1e2_s4_20
  section: 4
  number: 20
  type: single
  page: 3
  stem: 陶弘景 答謝中書書：「山川之美，古來共談。高峰入雲，清流見底。兩岸石壁，五色交輝。青林翠竹，四時具備。曉霧將歇，猿鳥亂鳴；夕日欲頹，沉鱗競躍。實是欲界（人間）之仙都。自康樂以來，未復有能與其奇者。」根據本文，下列何人的理解有誤？
  options:
  - label: A
    content: 三井壽：首句即點出「山川之美」的主題，再進一步具體描寫自然景色
  - label: B
    content: 櫻木花道：透過「欲界之仙都」的讚嘆，暗示了作者心中羽化飛升的理想
  - label: C
    content: 宮城良田：作者對於一日時間的推移，主要著墨在清晨以及傍晚兩個時間段
  - label: D
