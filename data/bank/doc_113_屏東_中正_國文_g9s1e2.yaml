- id: doc_113_屏東_中正_國文_g9s1e2_s5_9
  section: 5
  number: 9
  type: single
  page: 5
  stem: 下列有關本文的敘述，何者最為正確？
  options:
  - label: A
    content: 作者和多數觀光客一樣，喜歡到七星潭海岸賞景遊玩
  - label: B
    content: 山與海的賦格曲中的山海指的是中央山脈與臺灣海峽
  - label: C
    content: 因為海洋的壯闊、石頭的聲響，讓作者有夏天的感覺
  - label: D
    content: 作者依序從晚上到清晨書寫海岸、機場、鐵道的景色
  group_stem: '每一次，我總會產生一種錯覺，以為火車出了隧道之後，便是來到了夏天，也因此，花蓮的太平洋是屬於夏天的，開朗、大器、大方，而白色的海浪捲動著光潔鵝卵石，發出了嘩啦啦的聲響，更讓人想起了孩子們天真的歡唱。來到花蓮，不僅海洋壯闊、澎湃，就連山巒，也展現出中央山脈雄偉的氣勢來。我往往必須得仰起脖子，將臉貼到火車窗戶的玻璃上，才能夠看見山壁高聳的頂端。

    左邊是海，右邊是山。這是一條被山與海所護衛著的鐵道。一首由山與海所組成的賦格曲。雲霧從山腰之處冉冉升起，或是從空中飄降，緩緩地，若有所思地，停駐在半山腰上。

    曾經，我在無人的午後，細細地獨自踩踏過這裡的海岸，尋找屬於我一人的祕密基地。而七星潭是屬於觀光客的，我更偏愛的，卻是位於七星潭北邊的一片被木麻黃林所庇護著小小的海灘，旁邊有一座小小的村落，以及一間小小的警察局。

    我曾經躺在這裡的石灘上，望向清水斷崖，還有頭頂上方藍到發白的天空，讓海風灌滿了自己的衣裳。數百隻烏鴉棲息在木麻黃林上，風一吹來，牠們便會迎風飛起，嘎嘎地大聲嚎叫，等到風一停住，牠們又會翩翩地、陸續地落回枝頭之上。

    花蓮的軍事基地就在不遠處，天空中，偶爾有戰鬥機起降，當機身緊貼著海水上方掠過之時，整個空氣都為之轟隆震動，朝向四面八方碎裂開來。而我躺在石灘上面，閉著眼睛，感受到身體也忍不住要隨之顫抖。

    顫抖，在山與海的交響之下。然後，太陽落下，黑夜悄悄地覆蓋了大地，月亮高掛在空中，在太平洋上形成了一道皎潔的光帶。海上生明月，而火車仍不停歇地在山與海的中間奔馳著，低吟著，日以繼夜，夜以繼日，就在島嶼邊緣的一條最美麗的鐵路之上。


    （郝譽翔 山與海的賦格曲節錄）'
