- id: doc_113_台北_誠正_社會_公民_g7s2e1_s2_31
  section: 2
  number: 31
  type: single
  page: 4
  stem: 在看完上文後，四位同學做出了以下評論，何者最適當？
  options:
  - label: A
    content: 小明：我覺得法律是最低底線的道德，不可以因為其他因素而修改
  - label: B
    content: 小美：兵役制度因為宗教信仰而修改，可見宗教信仰的地位是高於法律的
  - label: C
    content: 小花：未來任何不想進軍營當兵的人都應該利用這個制度，藉故轉服替代役
  - label: D
    content: 小德：不同的文化之間難免存在衝突，互相了解、找尋平衡點是非常重要的
  group_stem: '耶和華見證人

    中華民國於西元 2000 年起開始實施替代役制度，替代役有別於一般兵役須於各軍事連隊接受軍事訓練，而是在完成基礎訓練後，在各級政府或相關單位服務。雖然訓練內容不同，但仍舊屬於我國認定的兵役類別之一。

    替代役制度的起源與一群「宗教良心犯」有關，他們是「耶和華見證人」的信徒，教義中有要求他們不要與人爭鬥、不參與戰爭，故也不應拿起武器成為軍人。但由於我國法律規定，成年男性有服兵役的義務，所以這群有其信仰的人符合資格就會被徵召入伍，然而他們寧願違法入獄，也不願意違背信仰，而陸續成為「宗教良心犯」。

    他們曾經提起釋憲，認為服兵役的義務侵害了他們的信仰自由，但當時大法官認為兵役制度並無違憲。雖然如此，但他們的存在也加速了《兵役法》的修正，促成了我國的替代役制度建立。'
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 公民
      code: 1-3
      title: 尊重和包容文化差異
      chapter: 第1章 多元文化
