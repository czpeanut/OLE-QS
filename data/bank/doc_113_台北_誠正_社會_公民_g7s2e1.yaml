  section: 1
  number: 5
  type: single
  page: 1
  stem: 下列針對主流文化與次文化的敘述，何者正確？
  options:
  - label: A
    content: 因為台灣與國際盟友互動密切，所以台灣的主流文化就是盟友們的主流文化
  - label: B
    content: 主流文化與次文化的概念是相對的，一個社會中的主流文化，可能是另一個社會的次文化
  - label: C
    content: 一個健全的社會中，消弭文化差異很重要，文化越單一表示越進步
  - label: D
    content: 次文化是指專屬特定族群所擁有的文化，通常表示較進步且較為重要的價值
