  stem: 下列針對「文化位階」的敘述，何者有誤？
  options:
  - label: A
    content: 指強勢文化過度強調自身優越感，而對其他文化做出高低優劣區分的現象
  - label: B
    content: 是不同文化交流下必然發生的狀況，因此人們不需要注意文化位階所帶來的影響
  - label: C
    content: 強勢文化可能會透過強迫或非強迫的方式影響弱勢文化，加深文化位階的狀況
  - label: D
    content: 過去日本殖民政府和中華民國政府曾推行過的國語運動會加深文化位階的狀況
