- id: doc_111_高雄_林園_國文_g7s2e1_s4_4
  section: 4
  number: 4
  type: single
  page: 3
  stem: 依據本文內容，文中個缺空處，依序填入下列何者最恰當？
  options:
  - label: A
    content: 所有權／隱私權／文化遷移
  - label: B
    content: 肖像權／名稱權／文化融合
  - label: C
    content: 名稱權／所有權／文化抄襲
  - label: D
    content: 隱私權／所有權／文化創意。
  group_stem: '每個世代的美夢，有可能就是下一個世代的惡夢。賈伯斯（Steve Jobs）建立了一個巨大方便的網路世界，我們可以輕易跨國購物，輕易找到以前可能無法接觸到的全球資訊，也可以隨時跟朋友聯繫。但建立這些便利性的同時，各種不滿與疑惑也開始慢慢累積。當各種網路服務出現時，我們是不是因為震撼於服務的種種便利，因而「妥協地」接受了一些犧牲，最後我們滿足又抱怨地生活在現今GAFA（google、Apple、Facebook、Amazon）統治的世界中呢？

    A.妥協一:沒有□□□

    無論檯面上或者檯面下，各種社群平台都會以各種方式用客戶資料營利，只要想想為什麼這麼多廣告可以追著你，就算你不是在該廣告提供的網站上，他們的廣告照常出現。這正是因為他們經由cookie、pixel
    等各種追蹤設備，讓你無所遁形。這件事也是目前網路獲利最豐厚的來源：精準地追蹤你、精準地下廣告。用「個人資料換免費服務」是網路巨頭的潛規則，甚至也成為許多創業者現今設立的預設商業模式。

    B.妥協二:喪失□□□

    每註冊一個新服務，我們都會猛按「下一步」，各種沒人會細看的服務協定。一旦細看，我們常常會驚嚇萬分（我到底簽了什麼？）。比方說，曾經爭議一時但我們又馬上忘記的臉書協定：我們一旦貼文，就表示貼文中的圖文已經授權給臉書。再例如，我們gmail
    的信件也是理所當的讓google 電腦（非人）掃描，找出關鍵字、找出敏感字，讓google 找出適合你的廣告，然後在你的信箱旁邊出現，吸引你點擊

    C.妥協三:□□□□被平台嚴重剝削

    除了少數狠角色，網路時代帶給大部分文化人（特別是那些產品可以被數位化的文化人）都是悲劇。文化產業的特性是：前製成本高，複製成本低。而網路時代把複製跟傳輸成本都壓低，趨近於零。簡單說，一本費盡作者、編輯、設計心力所製成的書籍，在數位時代，只需要零秒零成本，就可以複製分享。因此衍生出來的「免費模式」及「訂閱模式」肥了平台，但大部分創作者收入依舊微薄。

    Apple 對於音樂產業的破壞與建立，如同Amazon 對書籍產業做的事情，訂閱制壓低了「專輯感」/「書籍感」與「創作者個人收益」，文化事業基本上已經無法脫離低薪的宿命。無論如何，遊戲規則都是掌控在大型科技公司所管理的平台手上，創作者慢慢淪為了平台運作的薪柴

    於是乎，許多人（烏托邦主義者）期待一個新的網路架構出現。不再是由GAFA 統治天下的網路世界。能保有網路的種種好處，但不要有那麼多肥了大公司的妥協。

    （節選自周易正 另一種元宇宙:烏托邦主義的metaverse）'
  answer:
  - D
  answer_source: answer_key_vlm
