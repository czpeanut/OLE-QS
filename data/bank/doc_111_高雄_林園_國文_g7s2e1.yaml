  stem: 「岩鰷魚」的「鰷」是一個形聲字，形符是「魚」，表示它是屬於魚類；聲符是「條」，表示此字讀做「條」。依照字形排列，屬於左形右聲。下列各形聲字皆出自本文，何者說明正確？
  options:
  - label: A
    content: 「聞」是屬於外形內聲的形聲字
  - label: B
    content: 「麝」的讀音同「設」，「射」是形符
  - label: C
    content: 「俯」的右形左聲的形聲字
  - label: D
    content: 「河」是屬於左形右聲的形聲字。
  group_stem: '你能想像有上百萬的小生物居住在山澗旁嗎？

    如果你能長到像巨人一樣高大，然後低下頭俯視那條曲曲折折的小溪，你就會明白，那山澗是一條生命之河。

    我就是那個巨人。仗著區區兩尺之軀，我像個小巨人般蹲踞在溪畔，仔細研究涓滴溪水流到低窪地方時迴旋而成的小池沼。青蛙在裡頭下了蛋，小小的黑點散布在膠狀的水晶球裡，正等待時機到來，咬破球兒投入溪水的懷抱。

    岩鰷魚不時跳出水面捕捉在溪流之間飛舞的麝香蟲。麝香蟲的味道實在很迷人，當你抓一隻放在手裡，你就能聞到一股濃郁的氣味從手中散發出來。

    （改寫自少年小樹之歌）'
  answer:
  - D
