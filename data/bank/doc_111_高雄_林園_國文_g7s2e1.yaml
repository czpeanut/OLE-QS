  group_stem: '田氏三兄弟是漢代京城人，某日他們商討家產分配事宜，將所有的家產平分後，只剩廳堂前的一棵紫荊樹還沒分妥，兄弟三人打算把紫荊樹也剖成三片。第二天到庭院準備砍樹時，發現紫荊樹竟然枯萎而死，形狀像是被火燒焦一樣。

    大哥田真前往查看，大為驚訝，便對兩個弟弟說：「紫荊樹原本是同根而生，聽說要被分成三片，便憔悴枯死。我們真是連草木都不如啊！」三人都自責、感傷不已，就決定不砍樹了，沒想到紫荊樹隨即枝繁葉茂了起來。三兄弟受到此事的感召，決定把家產聚合起來不分家了。最後田氏家族不僅以孝悌聞名，大哥田真還位居朝廷的高官。晉代文人陸機曾於詩中提及：「三荊歡同株。」意指：原本要被一分為三的紫荊樹，很高興能夠維持原貌。'
