- id: doc_111_高雄_林園_國文_g7s2e1_s4_1
  section: 4
  number: 1
  type: single
  page: 2
  stem: 關於定伯賣鬼的作法，下列何者正確？
  options:
  - label: A
    content: 透過人鬼間的對話，以推展情節
  - label: B
    content: 故事結尾以時人傳言，點出全文主旨所在
  - label: C
    content: 鬼兩度對定伯提出質疑，凸顯其精明謹慎
  - label: D
    content: 藉鬼瞬間變成羊的描述，表現出定伯法術高明。
  group_stem: '南陽有個叫宗定伯的人，年輕時有一次走夜路，途中遇到了鬼。當時冷風颼颼，背後不時傳來沙沙的聲音，定伯停下腳步，轉頭大喊：「誰？」對方回答說：「我是鬼！」接著問：「你又是誰？」定伯說：「我……也是鬼。」鬼問：「你要去哪？」定伯：「去宛市。」鬼很高興地說：「真巧！我也要去宛市，咱們一起走吧！」

    他們走了好幾里路，鬼說：「唉！走得好累喔！我們何不輪流背著對方走，這樣可以省點力氣。」定伯：「真是好主意！」鬼於是先背著定伯走了好幾里路。

    鬼說：「咦！怎麼這麼重，老兄，你不是鬼吧？」定伯回答：「我剛死沒多久，所以還很重，請多擔待些。」走了一段路後，換定伯背鬼，鬼輕得幾乎沒有重量，他們就這樣輪流互背了好幾次。途中定伯問鬼：「我是新鬼，不知道我們鬼最怕的是什麼？」鬼說：「最怕被人吐口水。」

    走著走著，來到了河邊。定伯請鬼先過河，鬼竟然沒有發出任何聲響就悄然過了河。等到定伯渡河時，卻發出嘩啦嘩啦的水聲。鬼說：「怎麼這麼大聲呢？」定伯：「不是才說過嗎？我剛死，還不懂怎麼渡河，請不要見怪！」

    快到宛市時，定伯一舉把鬼扛在頭上，並緊緊抓住他。鬼大吼大叫：「你要做啥？快放我下來！」定伯毫不理會，加快腳步直奔市集中，狠狠地把鬼往地上摔，瞬間鬼變成了一隻羊。定伯找個買家把羊給賣了，得了一千五百錢，但仍擔心鬼會耍花招，就朝他身上吐了好幾口口水，然後揚長而去。

    在當時有人流傳：「宗定伯賣鬼，賣得一千五百錢。」'
  answer:
  - A
  answer_source: answer_key_vlm
