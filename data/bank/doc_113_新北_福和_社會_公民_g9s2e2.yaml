  group_stem: "【題組二】請回答第52～54 題\n  「寫一封信，居然能改變一個人的生命！」─在每年12 月由國際特赦組織發起「寫信馬拉松」的活動，目標正是幫助各國人權受到侵害的對象，為他們進行聲援，活動舉辦至今已超過二十年，累計超過五千萬次行動，並在世界各地改變超過一百人的人生。\n\
    \  寫信馬拉松運作的方式是由國際特赦組織選出當年度有侵犯人權相關的案件，透過全世界各分會分享案件資訊、進行倡議，而(甲)世界各地願意主動參與的人們，都可以透過寫信馬拉松這個活動聚集聲援，透過寫信、社群媒體、電子郵件、傳真或連署行動聲援那些遭到騷擾、威脅、因不公審判而入獄的人們，國際特赦組織將聲援訊息和信件送達政府機關或個案本人，對政府、掌權者施加壓力，也為個案及其家人加油打氣，鼓勵他們繼續捍衛權益，並明確表達世界仍然關注著這起事件，而(乙)實際上每年也都有因為人們參與此聲援活動，讓政府改變對個案的判決，成功讓個案重獲自由。\
    \                                     （資料來源：國際特赦組織台灣分會）"
  shared_asset: g2_52_54
