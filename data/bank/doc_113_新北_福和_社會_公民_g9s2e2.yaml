- id: doc_113_新北_福和_社會_公民_g9s2e2_s1_37
  section: 1
  number: 37
  type: single
  page: 1
  stem: 新聞報導：緬甸於3 月28 日發生強震造成災情時，我國立刻組成搜救隊準備前往救援，但因緬甸政府未回應台灣的救援提議故無法成行，雖然如此仍有不少人對我國的人道精神表示感謝。請問我國欲以何種方式參與國際社會？（B6）
  options:
  - label: A
    content: 國際交流
  - label: B
    content: 國際合作
  - label: C
    content: 國際援助
  - label: D
    content: 國際衝突
- id: doc_113_新北_福和_社會_公民_g9s2e2_s1_38
  section: 1
  number: 38
  type: single
  page: 1
  stem: 右圖為杏紗在新聞上看到截至2023 年的上半年為止，針對台灣出生率的統計圖，若政府欲解決右圖的狀況，請問下列何項政策最合適？（B1）
  options:
  - label: A
    content: 增加長期照護中心數量
  - label: B
    content: 提高職場上的就業機會
  - label: C
    content: 提高幼兒教育補助門檻
  - label: D
    content: 提升托育機構服務品質
