    \  法醫的解剖報告指出賴男的死因符合「高處墜落」致死，而賴男母親懷疑此案並非單純意外，因賴男父親贈與，賴男名下有價值5 億元的土地資產，故認為夏男涉嫌謀財害命並提告殺人，但此案件仍在調查中。\n\
    \  至於假結婚案，法院審理後仍認定，夏男明知賴男仍是學生，卻趁其涉世未深、急於處理家族財產的心理，迅速辦理結婚登記，藉此介入賴家龐大的不動產資產，此舉不僅嚴重侵害婚姻登記制度，更違背社會道德，因此於2025\
    \ 年1 月判決定讞，對夏男判處有期徒刑1 年6 個月，且不得易科罰金。\n  而遺產繼承問題，若夏男因判決在民事訴訟上喪失對賴男的財產繼承權，賴母又因身分問題僅能分配賴男遺產200萬元，依繼承順位，賴男未來遺產可能將由伯父及姑姑繼承。\
    \ （資料來源：《今周刊》2025/1/24、《風傳媒》2025/2/3）"
