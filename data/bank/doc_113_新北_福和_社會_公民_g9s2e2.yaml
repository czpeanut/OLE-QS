- id: doc_113_新北_福和_社會_公民_g9s2e2_s1_39
  section: 1
  number: 39
  type: single
  page: 1
  stem: 雅賢看到一則新聞：「繼去年第一代米老鼠版權開放後，今年又有一個迪士尼角色「大力水手」版權保護期限到期（不含動畫及真人版電影），供大家自由使用…。」。針對此篇報導內容，以下敘述何者正確？（B6）【素養題】
  options:
  - label: A
    content: 版權必須向經濟部智慧財產局註冊才能取得
  - label: B
    content: 此開放提供社會大眾使用的權利為專利權
  - label: C
    content: 保障知名品牌圖樣之法源依據與其是一樣的
  - label: D
    content: 版權能自由使用代表已經超過其保障期限
- id: doc_113_新北_福和_社會_公民_g9s2e2_s1_40
  section: 1
  number: 40
  type: single
  page: 1
  stem: 今年是全民健保開辦第30 年，卻出現經費嚴重不足的危機，而此制度創立用意，是為了讓台灣民眾可享用較便宜但高品質的服務，但現在卻有許多民眾浪費醫療資源的狀況。根據上述提及之社會福利措施，下列敘述何者正確？（B2）
  options:
  - label: A
    content: 國民年金與全民健保屬同一類社會福利措施
  - label: B
    content: 針對對象僅為低收入戶、災民或急難變故者
  - label: C
    content: 全民健保目的是為了滿足人民基本生活需求
  - label: D
    content: 此措施可以依照人民自由意願選擇是否加保
