- id: doc_113_新北_福和_社會_公民_g9s2e2_s2_49
  section: 2
  number: 49
  type: single
  page: 2
  stem: 文中提及因假結婚案，夏男須負起的法律責任，與下列何者相同？（B4）
  options:
  - label: A
    content: 開車行進期間，因使用手機而被警察開罰單
  - label: B
    content: 與路人發生車禍導致車體毀損而被法院判處賠償
  - label: C
    content: 出借銀行帳戶給詐騙集團而被判處有期徒刑
  - label: D
    content: 看展覽時不慎將展覽品弄壞遭物主要求回復原狀
  group_stem: "【題組一】請回答第49～51 題\n  2023 年臺中市一名18 歲賴姓男高中生（賴男）與26 歲夏姓男子（夏男）相約至戶政事務所登記結婚，並在路上找了兩名路人作為證婚人，登記完即前往夏男家，但兩個小時後，賴男卻倒臥在樓下被人發現，送醫搶救無效死亡。\n\
    \  法醫的解剖報告指出賴男的死因符合「高處墜落」致死，而賴男母親懷疑此案並非單純意外，因賴男父親贈與，賴男名下有價值5 億元的土地資產，故認為夏男涉嫌謀財害命並提告殺人，但此案件仍在調查中。\n\
    \  至於假結婚案，法院審理後仍認定，夏男明知賴男仍是學生，卻趁其涉世未深、急於處理家族財產的心理，迅速辦理結婚登記，藉此介入賴家龐大的不動產資產，此舉不僅嚴重侵害婚姻登記制度，更違背社會道德，因此於2025\
    \ 年1 月判決定讞，對夏男判處有期徒刑1 年6 個月，且不得易科罰金。\n  而遺產繼承問題，若夏男因判決在民事訴訟上喪失對賴男的財產繼承權，賴母又因身分問題僅能分配賴男遺產200萬元，依繼承順位，賴男未來遺產可能將由伯父及姑姑繼承。\
    \ （資料來源：《今周刊》2025/1/24、《風傳媒》2025/2/3）"
