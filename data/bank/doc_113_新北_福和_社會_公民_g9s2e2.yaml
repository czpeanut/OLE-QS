  stem: 金明與媽媽、丈夫、弟弟、弟媳一起到餐廳用餐，剛好餐廳推出了家庭慶生方案如右圖所示，正巧金明是當月壽星，若依照右圖方案付款，請問結帳時，金明需付餐廳多少用餐費用？（B1）
