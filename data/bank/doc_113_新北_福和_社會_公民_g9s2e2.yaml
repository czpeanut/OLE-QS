- id: doc_113_新北_福和_社會_公民_g9s2e2_s1_42
  section: 1
  number: 42
  type: single
  page: 1
  stem: 以下是法官今日處理的案件說明「因15 歲的阿虎及13 歲的阿場相約潛入機車行偷一台機車，準備送給好友麥奇作為生日禮物，但在行竊的過程中被機車行老闆大郎發現，於是兩人情急之下以棍棒重擊大郎頭部，不料卻因此造成大郎不治身亡…」。關於此案件之敘述，以下何者較有可能是最後法官做成的判決內提及之刑責？（B4）【素養題】
  options:
  - label: A
    content: 因兩人為同一起案件之犯罪行為人，皆處有期徒刑10 年
  - label: B
    content: 阿虎雖犯殺人罪，但得減輕其刑；阿場則不以刑罰處罰
  - label: C
    content: 兩人因未滿18 歲，皆屬限制責任能力人，故得減輕其刑
  - label: D
    content: 阿虎因犯殺人罪，須負起完全刑事責任，但阿場可免責
