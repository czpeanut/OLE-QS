  stem: 立法院會去年原擬對⟪老人福利法⟫部分條文進行修正，引發各界討論，其中最大爭議的修法內容集中在「65 歲以上長者若所得稅率未達20%免繳健保費，改由中央政府全額補助」。反對者認為這項政策將直接衝擊青壯年人口負擔，健保收入高達七成來自青壯年人口繳付的薪資所得，預計至2070
    年，15 至64 歲青壯年勞動人力將短少920 萬人，而65 歲以上老年人口將增加248 萬人，這樣的分配方式將加劇世代不公平，更損害健保永續。而政府對於低收入或經濟困難者，已有社會福利補助保費，若再補助350
    億元為長者繳交健保費，將嚴重壓縮兒少、婦女、身心障礙者等弱勢群體的福利保障，更可能導致其他公共服務的資金短缺。由上文內容判斷，反對修法的主要理由為何？
