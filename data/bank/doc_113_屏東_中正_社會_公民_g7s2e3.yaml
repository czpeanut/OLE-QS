- id: doc_113_屏東_中正_社會_公民_g7s2e3_s2_17
  section: 2
  number: 17
  type: single
  page: 2
  stem: 交通部公路局自2016 年起積極推動及輔導地方政府結合有意願投入服務的在地民眾、團體及企業，提供彈性預約與固定班次並行的「幸福巴士」服務，滿足民眾就學、就醫、採買與文健站接送等多元需求。有部落長者表示，他的孩子都在外地工作，從前要就醫很麻煩，有了幸福巴士後，他不再擔心，一趟單程才新台幣10
    元，他又有敬老卡，等於不用錢，非常方便。交通部的上述政策，主要目的在解決下列何項問題？
  options:
  - label: A
    content: 社會流動機會受阻
  - label: B
    content: 偏鄉交通服務缺口
  - label: C
    content: 貧富差距日益擴大
  - label: D
    content: 性別不同差別待遇。
- id: doc_113_屏東_中正_社會_公民_g7s2e3_s2_18
  section: 2
  number: 18
  type: single
  page: 2
  stem: '以下是媒體刊登的兩則新聞報導，根據內容判斷，其就業政策或措施的實施，應是為了達成下列何項目的？


    ◎英國前首相卡麥隆為避免就業歧視的行為，推動一項政策，要求政府單位徵人時，不能事先詢問對方的姓名，以免非白人姓氏的求職者無法獲得前來面試的機會。

    ◎南韓前總統文在寅為了改善就業市場的風氣，宣布一項措施，當求職者應徵公家機關，在履歷表上可以不用填入學歷、出生地等資料，希望只以個人能力高低決定是否錄取。'
  options:
  - label: A
    content: 推動經濟產業轉型升級
  - label: B
    content: 確保所有人公平取得資源
  - label: C
    content: 防止社會地位發生流動
  - label: D
    content: 延長勞工在職工作年限。
- id: doc_113_屏東_中正_社會_公民_g7s2e3_s2_19
  section: 2
  number: 19
  type: single
  page: 3
  stem: 據衛福部疾病管制署監測資料顯示，近期腸病毒疫情呈現上升趨勢達近六年新高，因此教育部國教署請各地方政府教育局處積極與地方衛生行政機關合作，督導學校加強腸病毒及各項傳染病防治教育、宣導、通報及追蹤，共同為防治校園傳染病努力。上述政府的作為與下列何項社會福利政策屬於同一類型？
  options:
  - label: A
    content: 規定雇主須替員工投保勞工保險
  - label: B
    content: 給予經濟弱勢者醫療補助
  - label: C
    content: 就業服務站為民眾媒合工作
  - label: D
    content: 換季期間開放施打流感疫苗。
