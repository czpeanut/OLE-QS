- id: doc_113_屏東_中正_社會_公民_g7s2e3_s2_13
  section: 2
  number: 13
  type: single
  page: 2
  stem: 下列何種狀況，屬於社會中的不公平現象？
  options:
  - label: A
    content: 受僱者任職滿六個月後，於每一子女滿三歲前，得申請育嬰留職停薪，期間至該子女滿三歲止
  - label: B
    content: 六歲至十二歲之學齡兒童，一律受基本教育
  - label: C
    content: 所得稅課徵，經濟能力較優者承擔較高的稅負；經濟能力較差者，承擔較低的稅負
  - label: D
    content: 全國人民均須繳納健保費，不同區域卻無法享有相同的醫療資源。
- id: doc_113_屏東_中正_社會_公民_g7s2e3_s2_14
  section: 2
  number: 14
  type: single
  page: 2
  stem: 電影《鐘點戰》把時間比喻為金錢，不同階級的人所擁有的時間不同，有錢人擁有無限的時間可以揮霍生命，但貧困的人一旦時間用光，生命也到終點。這部電影的主題與「階級複製」有關，意即生於富貴之家的孩子有錢，生於貧苦之家的孩子大多窮困，難以改變。上述內容主要在探討哪一面向不符合公平正義的概念？
  options:
  - label: A
    content: 性別差異造成同工不同酬
  - label: B
    content: 國際移工未受尊重
  - label: C
    content: 城鄉差距逐漸擴大
  - label: D
    content: 社會流動機會不易。
- id: doc_113_屏東_中正_社會_公民_g7s2e3_s2_15
  section: 2
  number: 15
  type: single
  page: 2
  stem: 下列何種社會地位是經由個人努力才能獲得，是一種成就的表現？
  options:
