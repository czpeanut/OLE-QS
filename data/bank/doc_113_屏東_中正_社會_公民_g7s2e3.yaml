- id: doc_113_屏東_中正_社會_公民_g7s2e3_s2_6
  section: 2
  number: 6
  type: single
  page: 1
  stem: 大雄針對中正市「設計不良的公用設施」進行調查統計，這些設計包含：會引導盲人去撞樹的導盲磚、坡度超級陡峭的無障礙坡道和凹凸不平的人行空間等。大雄將此調查做成報告投遞市長信箱，希望政府在規畫公共設施時考量孕婦、小孩、老人及輪椅使用者等的真正需求，以解決使用上的困擾。下列何者敘述最符合大雄從事這些行為的主要理念？
  options:
  - label: A
    content: 其調查行為是為了落實遵守法律的公民德性
  - label: B
    content: 其作為可有效改善公平正義以促進社會流動
  - label: C
    content: 其調查動機是因注意到社會的城鄉差距問題
  - label: D
    content: 是為敦促政府改善各群體面臨的不公平處境。
- id: doc_113_屏東_中正_社會_公民_g7s2e3_s2_7
  section: 2
  number: 7
  type: single
  page: 1
  stem: 印度電影《廁所英雄》是由真實故事改編。對印度教來說，廁所代表汙濁，在家中建廁所對神靈不敬，所以印度女性需在夜裡或黎明結隊去野外如廁，也因此發生被男性侵犯的意外或可能被蛇、蟲攻擊。男主角為挽回妻子，不惜與父親及傳統印度觀念對抗，女主角的爭取改變六億印度女性的命運。電影中女性必須冒著生命危險去野外如廁，主要是下列何種現象所造成？
  options:
  - label: A
    content: 城鄉差距使偏鄉公共建設不足
  - label: B
    content: 種族主義造成民眾對特定族群的刻板印象
  - label: C
    content: 性別歧視而對女性有差別待遇
  - label: D
    content: 貧富差距擴大阻礙社會流動機會。
- id: doc_113_屏東_中正_社會_公民_g7s2e3_s2_8
  section: 2
  number: 8
  type: single
  page: 1
  stem: 我國《教育基本法》明載「人民無分性別、年齡、能力、地域、族群、宗教信仰、政治理念、社經地位及其他條件，接受教育之機會一律平等。對於原住民、身心障礙者及其他弱勢族群之教育，應考慮其自主性及特殊性，依法令予以特別保障，並扶助其發展。」由上述法條內容分析，下列何種做法最符合公平正義的教育方針？
  options:
  - label: A
    content: 所有人均可應試會考，並給予視障考生特殊考場
  - label: B
    content: 為求公平公正，所有人的體適能通過標準均一致
  - label: C
    content: 全國各校的課程與活動應統一規畫，不可有差異
  - label: D
    content: 因應遠距上課的需求，要求所有學生均購買平板。
- id: doc_113_屏東_中正_社會_公民_g7s2e3_s2_9
  section: 2
  number: 9
  type: single
  page: 2
  stem: 《做工的人》是臺灣的工地工程師兼作家林立青撰寫的散文集，書中有一篇章名為〈臺灣媳婦〉，描述中國籍新住民與丈夫在工地工作時遭受差別待遇。例如：工地警衛刻意使用臺語，捉弄她聽不懂，但其實她明白其中的嘲笑、惡意，為求溫飽她只能裝傻。上述內容反映出社會中存在何種不公平的狀況？
  options:
  - label: A
    content: 歧視特定族群
  - label: B
    content: 城鄉資源不均
  - label: C
    content: 性別刻板印象
  - label: D
    content: 薪資結構失衡。
- id: doc_113_屏東_中正_社會_公民_g7s2e3_s2_10
  section: 2
  number: 10
  type: single
  page: 2
  stem: '《商業周刊》曾經刊載了一個很有名的故事「一個台灣，兩個世界」：

    就讀私立復興小學六年級的豆豆，爸爸是科技公司董事長，他家在台北市敦化南路上的高級住宅區，放學後，媽媽為他安排了英文數學的補習、還要忙著參加科展比賽。除此之外，豆豆剛完成一本與媽媽共同創作的書，書名是「打造資優小富翁」。

    同一時間，南投名間鄉的小如，正準備跟爸爸去田裡工作。小如的父親因為一場大雨淹沒了農作，負債超過新台幣六百萬元。小如看到同年紀的堂兄弟都已經上學，也很想上學。爸爸告訴他，等鳳梨收割賣錢，才有錢給她上幼稚園。於是，她每天都看著鳳梨，告訴鳳梨要趕快長大。

    從《商業周刊》刊載的故事中凸顯了何種社會現象？'
  options:
  - label: A
    content: 貧富差距擴大將影響平等就業權利
  - label: B
    content: 性別角色的分工仍受傳統觀念影響
  - label: C
    content: 社會地位會影響個人取得資源的能力與機會
  - label: D
    content: 城鄉差距會加深刻板印象而造成機會不平等。
- id: doc_113_屏東_中正_社會_公民_g7s2e3_s2_11
  section: 2
  number: 11
  type: single
  page: 2
  stem: 在我國，原住民考大學的「加分政策」分成兩個部分，分別是「實際加分」跟「保障名額」。此制度讓許多人有不一樣的看法，整理如右圖。請由圖中內容推論，此意見整理最適合放在下列哪一份專題研究中？
  options:
  - label: A
    content: 原住民族的社會貢獻是否獲得肯定
  - label: B
    content: 人們如何由不同角度判斷是否公平
  - label: C
    content: 弱勢文化如何以教育造就文化位階
  - label: D
    content: 教育資源分配是否會擴大貧富差距。
  assets:
  - key: s2_11_f1
    kind: figure
    file: doc_113_屏東_中正_社會_公民_g7s2e3/s2_11_f1.png
