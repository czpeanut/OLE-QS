  stem: '除了政府或獎勵民間直接興建社會住宅之外，亦有「包租代管」的形式，辦理方式如下表。

    （一）包租：政府獎勵及補助租屋服務事業(以下簡稱業者)以市場租金8 折的價格承租住宅，由業者與房東簽訂3 年包租約後，於包租約期間內業者每月支付房租給該房東，再由業者以二房東的角色，將住宅轉租給經濟或社會弱勢(一定所得、財產以下及身分條件者)及就業、就學有居住需求房客，並管理該住宅。

    （二）代管：業者協助房東以市場租金9 折的價格出租住宅給經濟或社會弱勢(一定所得、財產以下及身分條件者)及就業、就學有居住需求房客，由房東與房客簽訂租約，業者負責管理該出租的住宅。

    分析上述包租代管的辦理方式，何者正確？'
  options:
  - label: A
    content: 由政府全權處理社會住宅事務
  - label: B
    content: 「包租」方式房東不需直接面對房客，業者責任較重
  - label: C
    content: 若遇房屋無法出租的空置期，「代管」方式的風險將由業者承擔
  - label: D
    content: 所有人都可以申請成為房客，經濟弱勢者可給予租金折扣。
