  page: 4
  stem: 生、老、病、死，原本是個人的事，為什麼許多國家卻執行社會福利政策，保障人民從「搖籃」到「墳墓」的基本生活？【甲】工業革命後，帶來經濟發展與財富累積，但競爭的日益激烈，人們對未來生活的不安全感也日益增加。週期性的不景氣和種種不可預知的因素，人們開始體認到貧窮的原因不能完全歸咎個人，社會也有責任。於是【乙】宗教組織制訂社會福利政策，透過保險、救助、服務，保障弱勢群體基本生活的條件。進入20
    世紀，人民對社會安全的期許更積極提升為 【丙】 ，【丁】由政府整合機構、團體與個人的力量共同建構安居樂業的生活。請選出正確敘述。
  options:
