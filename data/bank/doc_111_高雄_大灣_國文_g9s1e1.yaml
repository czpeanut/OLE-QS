  type: single
  page: 1
  stem: '與921 說再見：20 年的生命練習題是一篇採訪九二一大地震倖存者的報導文學，關於文中受訪者敘述內容所反映的心境，

    以下選項何者錯誤？'
  options:
  - label: A
    content: 「為什麼是我？為什麼你們都離開了，就丟下、剩下我一個人？就覺得很不公平。」─孤寂沉痛
  - label: B
    content: 「當然還是會感到難過，但我現在很努力的在生活，我沒有讓這場震災把我打倒。」─堅強悲傷
  - label: C
    content: 「與其說是和逝去的家人說再見，其實比較像是和過去的自己說再見，迎接新的自己。」─坦然接受
  - label: D
    content: 「我原本很排斥講出自己的事，怕會讓人覺得我很可憐，會不會讓別人用異樣眼光看我？」─振奮欣喜。
  lesson_raw:
    title: 與921說再見：20年的生命練習題
    basis: 題目指明課文《與921說再見：20年的生命練習題》
