- id: doc_111_高雄_大灣_國文_g9s1e1_s3_38
  section: 3
  number: 38
  type: single
  page: 4
  stem: 根據本文所述，唐傳奇之所以題材多元豐富，其原因最有可能為下列何者？
  options:
  - label: A
    content: 社會動亂下失意文人藉小說以抒志
  - label: B
    content: 因時代環境與社會風氣的孕育催生
  - label: C
    content: 累積歷代奇聞軼事至唐朝開花結果
  - label: D
    content: 朝廷當政者大力鼓吹民間從事創作。
  group_stem: "（三）\n  傳奇（小說）發展之初受到前代志怪影響頗大，出現一系列「奇幻」故事。而當讀書人皆執迷於科舉，日思夜想著高官厚祿，便有了點醒迷夢的「警世」小說。因著唐朝婚配制度特殊，標舉門第的價值觀，使青年男女更盼望能擁有自由的戀愛與婚姻，哪怕是與道統相抗衡亦無怨無悔，「愛情」故事如一首首哀婉的歌謠，餘音繚繞。唐人原本是尚武的，「安史之亂」後出現了藩鎮割據，加上國勢衰微，人民的苦痛日深，對於能解民於水火的豪俠之流心生嚮往，「俠義」小說的數量與品質皆有可觀。\n\
    \                           ──節錄自張曼娟柔軟的神殿：古典小說的神性與人性"
- id: doc_111_高雄_大灣_國文_g9s1e1_s3_39
  section: 3
  number: 39
  type: single
  page: 4
  stem: 根據上文，下列各文句的主語，何者說明正確？
  options:
  - label: A
    content: 急邀邏者來啟視──餓夫
  - label: B
    content: 坐階下看菊──紀昀
  - label: C
