- id: doc_111_高雄_大灣_國文_g9s1e1_s3_44
  section: 3
  number: 44
  type: single
  page: 5
  stem: 少婦以「小舟從此逝，江海寄餘生。」向縣官表明何種心意？
  options:
  - label: A
    content: 出海捕魚，將功贖罪
  - label: B
    content: 流放海外，洗心革面
  - label: C
    content: 江海擺渡，另謀出路
  - label: D
    content: 投江自盡，與世長辭。
  group_stem: '（六）昔有某婦，行竊失風，被押送至衙門，於縣堂應訊時，以詩詞回答。請同學閱讀完這段「口供」並回答下列問題。

    縣官問：「大膽刁婦，家居何處？」          少婦答：「我住長江頭。」

    縣官問：「汝丈夫何處？」              少婦答：「可憐無定河邊骨，猶是春閨夢裡人。」

    縣官問：「可有子女？」               少婦答：「綠樹成蔭子滿枝。」

    縣官問：「今汝家中光景如何？」           少婦答：「冷冷清清，淒淒慘慘戚戚。」

    縣官問：「汝賴何維生？」              少婦答：「鋤禾日當午，汗滴禾下午。」

    縣官問：「無人助汝？」               少婦答：「各人自掃門前雪，休管他人瓦上霜。」

    縣官問：「因何落魄失意？」             少婦答：「八月秋風高怒號，卷我屋上三重茅。」

    縣官問：「初次行竊為何時、何處？」         少婦答：「去年元夜時，燈火闌珊處。」

    縣官問：「失風被捕，有何想法？」          少婦答：「這次第，怎一個愁字了得。」

    縣官問：「可心存悔意？」              少婦答：「一失足成千古恨，再回首已百年身。」

    縣官問：「希望本官如何發落？」           少婦答：「小舟從此逝，江海寄餘生。」'
