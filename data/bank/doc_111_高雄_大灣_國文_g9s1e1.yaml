- id: doc_111_高雄_大灣_國文_g9s1e1_s2_20
  section: 2
  number: 20
  type: single
  page: 2
  stem: 「小樓昨夜又東風，故國不堪回首月明中。」一句表現出的情感與下列選項何者最接近？
  options:
  - label: A
    content: 多少恨，昨夜夢魂中。還似舊時游上苑，車如流水馬如龍，花月正春風
  - label: B
    content: 西塞山前白鷺飛，桃花流水鱖魚肥。青箬笠，綠蓑衣，斜風細雨不須歸
  - label: C
    content: 少年不識愁滋味，愛上層樓。愛上層樓，為賦新詞強說愁
  - label: D
    content: 眾裡尋他千百度，驀然回首，那人卻在，燈火闌珊處。
  lesson_raw:
    title: 虞美人
    basis: 引用李煜〈虞美人〉課文原句
- id: doc_111_高雄_大灣_國文_g9s1e1_s2_21
  section: 2
  number: 21
  type: single
  page: 2
  stem: '詹醫生找到右方表格內的對聯，想親自寫一副對聯貼在自家兒科診所門口。

    根據對聯的原則，下列選項，何者上、下聯的組合正確？

    甲、濟世良方祛邪扶正

    乙、熱寒表內濟世丹心

    丙、回春妙術固本清源

    丁、功齊相業調劑多方

    戊、涉水跋山尋方採藥'
  options:
  - label: A
    content: 上聯：甲／下聯：丙
  - label: B
    content: 上聯：甲／下聯：乙
  - label: C
    content: 上聯：戊／下聯：丁
  - label: D
    content: 上聯：丁／下聯：戊。
- id: doc_111_高雄_大灣_國文_g9s1e1_s2_22
  section: 2
  number: 22
  type: single
  page: 2
  stem: 下列句子，何者文意不順？
  options:
  - label: A
    content: 昨日一場惡火，使得工業區數十間廠房付之一炬
  - label: B
    content: 遁入空門的他穿起袈裟，誠心修行，擺脫紅塵俗世的牽絆
  - label: C
    content: 胡適幼年守寡，母親身兼父職，在母親細心的呵護下他平安長大
  - label: D
    content: 這次你們舉家移民澳洲，別時容易見時難，不知我們何時才能再相聚啊。
- id: doc_111_高雄_大灣_國文_g9s1e1_s2_23
  section: 2
  number: 23
  type: single
  page: 2
  stem: "文學體裁各有其特色，請將下列作品按照「古詩、樂府、近體詩、宋詞」的順序排列出來，正確的排序應為？\n甲、舍南舍北皆春水，但見群鷗日日來。花徑不曾緣客掃，蓬門今始為君開。\n\
    \    盤飧市遠無兼味，樽酒家貧只舊醅。肯與鄰翁相對飲，隔籬呼取盡餘杯。（杜甫客至）\n乙、明月別枝驚鵲，清風半夜鳴蟬。稻花香里說豐年，聽取蛙聲一片。 \
    \ 七八個星天外，兩三點雨山前。舊時茆店社\n    林邊，路轉溪橋忽見。（辛棄疾西江月夜行黃沙道中）\n丙、慈母手中線，遊子身上衣。臨行密密縫，意恐遲遲歸。誰言寸草心，報得三春暉。\
    \ （孟郊遊子吟）\n丁、李波小妹字雍容，褰裳逐馬如捲蓬。左射右射必疊雙。婦女尚如此，男子安可逢？（李波小妹歌）"
  options:
  - label: A
    content: 丙丁甲乙
  - label: B
    content: 丙甲丁乙
  - label: C
    content: 甲丙乙丁
  - label: D
    content: 丁丙甲乙。
- id: doc_111_高雄_大灣_國文_g9s1e1_s2_24
  section: 2
  number: 24
