- id: doc_111_高雄_大灣_國文_g9s1e1_s2_16
  section: 2
  number: 16
  type: single
  page: 2
  stem: 關於辛棄疾南鄉子登京口北固亭有懷的賞析，下列敘述何者錯誤？
  options:
  - label: A
    content: 「何處望神州？滿眼風光北固樓」－先就眼前景色點出國土淪喪之哀
  - label: B
    content: 「千古興亡多少事？悠悠，不盡長江滾滾流」－藉朝代的興衰更迭，抒發內心無盡的感懷
  - label: C
    content: 「年少萬兜鍪，坐斷東南戰未休」－大力稱讚孫權，且北宋地理、政治局勢與東吳相近，以今諷古
  - label: D
    content: 「天下英雄誰敵手？曹劉。生子當如孫仲謀」活用典故，藉曹操、劉備凸顯孫權的英雄形象，慨嘆朝中官員無能，也傳達了南宋臣民要求奮發圖強的時代呼聲。
  lesson_raw:
    title: 南鄉子登京口北固亭有懷
    basis: 題目指明辛棄疾〈南鄉子登京口北固亭有懷〉
