  section: 2
  number: 17
  type: single
  page: 2
  stem: 下列文句，何者用字最為精簡？
  options:
  - label: A
    content: 雙方對責任歸屬的看法差距相去甚遠，應試著理解彼此的立場
  - label: B
    content: 說話沒重點是許多青少年的毛病，不少成人也有這種問題
  - label: C
    content: 這場突如其來的傾盆大雨，究竟到底會下到何時呢
  - label: D
    content: 今天剛好適逢農曆十五日，圓滿的月亮高掛天空。
- id: doc_111_高雄_大灣_國文_g9s1e1_s2_18
  section: 2
  number: 18
  type: single
  page: 2
  stem: 下列關於韻文發展的敘述，何者正確？
  options:
  - label: A
    content: 樂府詩又稱古風，格律自由，不必押韻
  - label: B
    content: 古體詩多長短句，入樂可歌，多民間作品，內容以敘事為主
  - label: C
    content: 近體詩的字數、句數、平仄、對仗與用韻都有嚴格規定
  - label: D
    content: 詞又可稱為長短句、樂府，依詞牌分為小令、中調、長調。
