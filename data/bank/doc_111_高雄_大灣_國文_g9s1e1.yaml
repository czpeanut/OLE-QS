    \  昂首長跪，自言前兩夕乘暗闌入，伏匿此坑，冀夜深出竊。不虞二更微雨，夫人命移醃齏兩甕，置坑板上，遂不能出。尚冀雨霽移下，乃兩日不移，饑不可忍，自思出而被執，罪不過杖，不出則終為餓鬼，故反作聲自呼耳。\n\
    \  其事極奇，而實為情理所必至，錄之亦足資一粲也。\n①諦聽：細聽 ②廡：廂房 ③邏者：巡邏人員 ④闇然：幽暗不明顯的樣子。\n            \
    \                             紀昀 閱微草堂筆記"
- id: doc_111_高雄_大灣_國文_g9s1e1_s3_42
  section: 3
  number: 42
  type: single
  page: 5
  stem: '關於「都市傳說」，文中第二段提到「它們通常不會偏離現實世界太多，即便是鬼怪也可能在現實世界有對應的角色。」

    下列哪一個例子，最能符合這段文字的涵義？'
  options:
  - label: A
    content: 平時慈愛的父母，有一晚在夢境中化身為可怕的鬼怪
  - label: B
    content: 會把壞孩子帶走的侍者，在現實社會中可能是警察
  - label: C
    content: 每晚都在屋頂唱歌的小精靈，天一亮立刻消失無蹤
  - label: D
    content: 尾隨人們背後的幽靈，其實在尋找幫他完成心願的人。
  group_stem: "（五）\n  都市傳說就像古時的鄉野奇談，我們無法完全否定它的真實性。在去除神話色彩之後，我們依舊能從中理解當時人們的世界觀。\n \
    \ 都市傳說通常由一件不平凡的事情發展而來，再經過口耳相傳、層層渲染後，便覆上一層神祕色彩。也可能是一些家長為了便於管教孩子而羅織出來的故事，它們通常不會偏離現實世界太多，即便是鬼怪也可能在現實世界有對應的角色。整體來說，都市傳說也許聽起來荒誕，但它們卻如同神話般，透露了人們隱藏的心思。\n\
    \  隨著年紀老去，人的記憶也隨著時間沖刷越發模糊，然而，有些疼痛卻是不論歲月如何更迭，都難以真正地放下。因此，有些無法釋懷的人們下意識尋求「遺忘」，例如新聞上常見的創傷後壓力症，就是以失憶來面對過往。然而，如果連選擇遺忘的幸運都無法擁有，又該如何面對那些令人害怕的回憶？因此，出現了「記憶使者」的都市傳說。這個傳說最早來自廣島，因廣島是日本二戰中受創最嚴重的地方，當時美軍投下原子彈，帶來的傷害巨大且難以估計。失去家園，失去至親，以及國家光榮感的幻滅，都令人難以承受，這些創傷，成了發展都市傳說的溫床。記憶使者為人們抹去記憶，讓人們重拾面對明日的勇氣。然而，記憶使者將承受世界所有人的傷痛──＿＿＿＿＿＿＿＿＿＿＿＿＿。\n\
    \                                           ──改寫自記憶屋"
