- id: doc_111_高雄_大灣_國文_g9s1e1_s2_13
  section: 2
  number: 13
  type: single
  page: 1
  stem: '吳晟土：「至於揮汗吟哦自己的吟哦／詠嘆自己的詠嘆／無關乎閒愁逸致，更無關乎／走進不走進歷史」有關上述詩句的

    解釋，下列何者正確？'
  options:
  - label: A
    content: 作者寫詩是為了歷史留名
  - label: B
    content: 農人不像詩人懂得欣賞文學之美
  - label: C
    content: 農人勤勞地耕作，踏實面對生活
  - label: D
    content: 前二句描寫作者對農耕生活的悲嘆。
  lesson_raw:
    title: 土
    basis: 引用吳晟〈土〉詩句
- id: doc_111_高雄_大灣_國文_g9s1e1_s2_14
  section: 2
  number: 14
  type: single
  page: 2
  stem: 吳晟的土一詩中哪些句子可以看出農民傳承先人耕作的精神？
  options:
  - label: A
    content: 赤膊，無關乎瀟灑／赤足，無關乎詩意
  - label: B
    content: 如果開一些花、結一些果／那是獻上怎樣的感激
  - label: C
    content: 不掛刀、不佩劍／也不談經論道說賢話聖
  - label: D
    content: 也沿著祖先／滴不盡的汗漬／寫上誠誠懇懇的土地。
  lesson_raw:
    title: 土
    basis: 題目指明吳晟〈土〉一詩
- id: doc_111_高雄_大灣_國文_g9s1e1_s2_15
  section: 2
  number: 15
  type: single
