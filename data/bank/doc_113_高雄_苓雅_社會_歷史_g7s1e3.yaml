  group_stem: "以樂準備和家人去旅遊，在瀏覽觀光旅遊網時看見了以下資訊，請閱讀後回答34-36 題。\n  距今約兩百年前，臺灣中部的平埔族群因生活空間被壓縮，陸續移墾埔里盆地。其中，在盆地東北區的眉溪兩岸，以牛眠山、守城份、大湳、蜈蚣崙為最早建立的四個主要聚落，其祖先多來自台中市新社和東勢地區。在地人仍習慣自稱為「眉溪四庄番」。其中，眉溪北岸的守城份聚落，緊鄰海拔2,000\
