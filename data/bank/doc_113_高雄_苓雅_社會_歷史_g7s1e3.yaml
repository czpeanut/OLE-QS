- id: doc_113_高雄_苓雅_社會_歷史_g7s1e3_s1_21
  section: 1
  number: 21
  type: single
  page: 1
  stem: 阿明於清初開港通商前移民來臺灣，請問：他當時在臺灣可能會看到下列哪一景象？
  options:
  - label: A
    content: 馬偕在淡水創建了牛津學堂
  - label: B
    content: 英國人在臺南設立了德記洋行
  - label: C
    content: 荷蘭人以各社長老管理原住民
  - label: D
    content: 與米郊的商人到貿易地廈門一帶做生意。
- id: doc_113_高雄_苓雅_社會_歷史_g7s1e3_s1_22
  section: 1
  number: 22
  type: single
  page: 1
  stem: 瑄雅閱讀一份嘉慶年間的資料：「漢人郭百年召募一千多位壯丁進入水沙連地區(今南投縣埔里鎮)開墾，之後趁當地平埔族部落集合青壯年到山中打獵時，闖進部落進行掠奪，將數百頭牛隻、數百石稻穀，以及墳墓中的陪葬品掠奪一空。殘存的原住民無力抵抗下，只能遷往其他地區居住。造成上述平埔族人遷離故鄉的主因最可能是下列何者？
  options:
  - label: A
    content: 漢人開墾下的入侵
  - label: B
    content: 居住地爆發瘟疫
  - label: C
    content: 原住民爭奪地盤的內鬨
  - label: D
    content: 天災造成資源匱乏。
- id: doc_113_高雄_苓雅_社會_歷史_g7s1e3_s1_23
  section: 1
  number: 23
  type: single
  page: 1
  stem: 英國與臺灣的接觸由來已久，有關臺灣與英國貿易的敘述，下列何者正確？
  options:
  - label: A
    content: 英國人曾占領臺灣中部，與荷蘭人競爭激烈
  - label: B
    content: 英國在大航海時代與鄭氏家族有商業往來，曾賣軍用物資給臺灣
  - label: C
    content: 金廣福公館是英國人在清帝國時期於臺灣從事貿易時蓋的商務會館
  - label: D
    content: 臺灣開港通商後，英國向臺灣購買的物品以鴉片為最大宗。
- id: doc_113_高雄_苓雅_社會_歷史_g7s1e3_s1_24
  section: 1
  number: 24
  type: single
  page: 1
  stem: 楀絜閱讀到一段史料在介紹「頂下郊拼」：「十九世紀，艋舺的泉州移民漸多，並發展出下郊(同安人移民組成)與頂郊(晉江、惠安、南安三縣移民合組)兩大行郊。兩大商業團體為了爭奪艋舺碼頭的貨運，時常發生衝突。西元1853
    年，雙方發生激烈的械鬥，而後大稻埕建了霞海城隍廟，奉祀從械鬥中救出的城隍爺神像。請問：上述「頂下郊拼」發生的主要原因為何？
  options:
  - label: A
    content: 祖籍不同
  - label: B
    content: 爭奪田地
  - label: C
    content: 爭奪水源
  - label: D
    content: 商業競爭。
- id: doc_113_高雄_苓雅_社會_歷史_g7s1e3_s1_25
  section: 1
  number: 25
  type: single
  page: 1
  stem: 庭瑄觀察右圖清帝國時期番界的變化。根據此圖，下列何者敘述最為合適？
  options:
  - label: A
    content: 番界由南向北擴張，反應漢人在臺開墾的方向
  - label: B
    content: 番界逐漸往內陸擴張，反應平埔族勢力逐漸大於高山族
  - label: C
    content: 清帝國不斷重新界定番界，代表其非常重視劃界封山的政策，並且能有效防止漢人入山
  - label: D
    content: 番界是一條非常明確的界線，漢人與熟番生活在界內，生番則生活在界外，沒有混居的現象發生。
  assets:
  - key: s1_25_f1
    kind: figure
    file: doc_113_高雄_苓雅_社會_歷史_g7s1e3/s1_25_f1.png
- id: doc_113_高雄_苓雅_社會_歷史_g7s1e3_s1_26
  section: 1
  number: 26
  type: single
  page: 1
  stem: 清帝國時期，許多漢人入臺開墾，為提高農業產量，各地開發許多埤、塘、水圳等水利設施。下列有關清代各項水利設施的敘述，何者正確？
  options:
  - label: A
    content: 瑠公圳為郭錫瑠父子提倡興建，為清代灌溉面積最大的水圳
  - label: B
    content: 猫霧捒圳為原住民獨立開鑿興建而成的水利設施
  - label: C
    content: 官方主導興建的曹公圳以灌溉高雄地區為主
  - label: D
    content: 水圳的興築使得南部農產出口漸以茶葉及樟腦為重。
- id: doc_113_高雄_苓雅_社會_歷史_g7s1e3_s1_27
  section: 1
  number: 27
  type: single
  page: 1
  stem: '容禎看到一段《渡臺悲歌》為清帝國時期描述客家移民的詩歌，以下是該詩歌的部分內容：

    勸君切莫過臺灣，臺灣恰似鬼門關，千個人去無人轉，知生知死都是難。

    就是窖場也敢去，臺灣所在滅人山，臺灣本係福建省，一半漳州一半泉。

    一半廣東人居住，一半生番併熟番，生番住在山林內，專殺人頭帶入山。

    對於這首詩歌的理解，下列敘述何者有誤？'
  options:
  - label: A
    content: 渡海來臺的過程艱難辛苦
  - label: B
    content: 臺灣移民多來自福建、廣東
  - label: C
    content: 客家移民多來自漳州、泉州
  - label: D
    content: 生番、熟番都是指原住民。
- id: doc_113_高雄_苓雅_社會_歷史_g7s1e3_s1_28
  section: 1
  number: 28
  type: single
  page: 1
  stem: 右圖為西元1868〜1895 年臺灣進出口貿易統計圖。西元1878 年以後，臺灣貿易出現大反轉，出口值開始大於進口值，其主要原因為何？
  options:
  - label: A
    content: 國際市場對臺灣茶、糖、樟腦的需求增加
  - label: B
    content: 積極開發臺灣東部，增加稻米外銷
  - label: C
    content: 臺灣建省後，清廷補助大幅增加
  - label: D
    content: 日軍侵臺後，增加對鹿皮進口的需求。
  assets:
  - key: s1_28_f1
    kind: figure
    file: doc_113_高雄_苓雅_社會_歷史_g7s1e3/s1_28_f1.png
- id: doc_113_高雄_苓雅_社會_歷史_g7s1e3_s1_29
  section: 1
  number: 29
  type: single
  page: 1
  stem: '四位同學訪問了爺爺奶奶關於家族在清代移民到臺灣的故事，訪問完後，四個人各自整理了重點，請問：四人當中哪些人的說法正確？

    偉宏：我們的祖先除了原鄉的信仰外，也和其他地區來的人共同信仰媽祖與王爺。

    靖晨：初期來臺時，祖先們以中國原鄉的同姓祖先作為祭祀對象，稱為開臺祖。

    天偉：我們的祖先信仰開漳聖王，而鄰近的泉州地區的移民則信仰三山國王。

    柏任：從祭祀唐山祖轉變到祭祀開臺祖，代表移民的土地認同可能漸漸由中國原鄉轉移到臺灣。'
  options:
  - label: A
    content: 偉宏、靖晨
  - label: B
    content: 天偉、柏任
  - label: C
    content: 靖晨、天偉
  - label: D
    content: 偉宏、柏任。
- id: doc_113_高雄_苓雅_社會_歷史_g7s1e3_s1_30
  section: 1
  number: 30
  type: single
  page: 1
  stem: 西元1865 年，傳教士與隨行牧師、信徒數人在打狗登陸，往後數年於臺南、打狗一帶宣道行醫，並積極學習福佬話，使求醫者日增，開啟臺灣西洋醫學的黎明期。請問：上述傳教士進入臺灣傳教的背景為何？
  options:
  - label: A
    content: 中國實施海禁政策，歐洲人紛紛轉至臺灣傳教
  - label: B
    content: 英法聯軍臺灣開港通商，西方傳教士紛紛到臺灣傳教
  - label: C
    content: 日本鎖國導致傳教士轉往台灣傳教
  - label: D
    content: 台灣經濟生活改善，接受外來宗教，傳教士積極前來。
