    race and gets the gold medal. Her time is 27.10 seconds!


    Jet Grandma loves running. She already runs in many senior sporting events in
    Taiwan and other countries. She has a problem with her leg now, but she doesn''t
    give up. She trains every day because running is her dream. She wants to be strong
    and healthy.


