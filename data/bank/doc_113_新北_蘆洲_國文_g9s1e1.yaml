- id: doc_113_新北_蘆洲_國文_g9s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 3
  stem: 「我不和你談論詩藝/不和你談論那些糾纏不清的隱喻/請離開書房/我帶你去廣袤的田野走走/去看看遍處的幼苗/如何沉默地奮力生長/我不和你談論人生/不和你談論那些深奧玄妙的思潮/請離開書房/我帶你去廣袤的田野走走/去撫觸清涼的河水/如何沉默地灌溉田地……」《節錄吳晟
    我不和你談論》透過詩句表達的意思，下列敘述何者最接近？
  options:
  - label: A
    content: 作者認為讀者不懂文學與人生多說無益
  - label: B
    content: 本詩的主旨在於，要讀者多多外出運動
  - label: C
    content: 本詩強調走出書房，希望讀者親身體驗
  - label: D
    content: 這是一首諷諭詩，暗喻都市人不辨五穀。
  lesson_raw:
    number: 第2課
    title: 土
    basis: 作者為吳晟
- id: doc_113_新北_蘆洲_國文_g9s1e1_s1_19
  section: 1
  number: 19
  type: single
  page: 3
  stem: 「運動令你開心，美感令你悅心，信仰令你安心，親密令你會心，割捨令你清心。你能把握這幾個要素，精神能量自然會流入你的生活之中，讓你活得積極振作，歡喜自在。」根據本文，下列何人的做法，可以使精神充滿正能量？
  options:
  - label: A
    content: 三五好友聊八卦論短長
  - label: B
    content: 假日騎腳踏車尋幽訪勝
  - label: C
    content: 網路購物方便輕鬆自在
  - label: D
    content: 虔誠禱告拜佛求發大財。
- id: doc_113_新北_蘆洲_國文_g9s1e1_s1_20
  section: 1
  number: 20
  type: single
  page: 3
  stem: 「給我陽光，給我空氣，給我源源不絕的活水；給我愛情，給我智慧，給我綿綿無盡的信念與希望。但也請施我以風雨，以苦旱，以荊棘，以黑暗，以一切橫逆與打擊。我的生命，……」向陽這段短文，若要完成最後一句，下列何者最恰當？
  options:
  - label: A
    content: 只有向著陽光才偉大才有意義
  - label: B
    content: 只有源源不斷的活水才算完整
  - label: C
    content: 要在陽光和風雨的追逐中完成
  - label: D
    content: 豈能事事如意，只求無愧我心。
- id: doc_113_新北_蘆洲_國文_g9s1e1_s1_21
  section: 1
  number: 21
  type: single
  page: 3
  stem: 「尼采謂：『一切文學，余愛以血書者。』後主之詞，真所謂以血書者也。宋道君皇帝＜燕山亭＞詞亦略似之。然道君不過自道身世之戚，後主則儼有釋迦、基督擔荷人類罪惡之意，其大小固不同矣。」（王國維人間詞話）下列敘述，何者符合王國維的觀點？
  options:
  - label: A
    content: 後主詞以血書之，因為詞中多飽含慷慨激昂的生命鬥志
  - label: B
    content: 宋道君與後主二人詞風相似，王國維認為二者旗鼓相當
  - label: C
    content: 後主詞能反映世道人情的共感，具有宗教家的悲憫情懷
  - label: D
    content: 王國維認為文學須是自身身世反映，呈現個人特色為佳。
  lesson_raw:
    number: 第1課
    title: 宋詞選
    basis: 引用人間詞話評李煜詞
- id: doc_113_新北_蘆洲_國文_g9s1e1_s1_22
  section: 1
  number: 22
  type: single
  page: 4
  stem: 「鸚鵡能言不離飛鳥，猩猩能言不離禽獸。今人而無禮，雖能言，不亦禽獸之心乎？」（禮記･曲禮上）以下敘述，何者與上文主旨最接近？
  options:
  - label: A
    content: 識時務者為俊傑，看場合適當發言
  - label: B
    content: 好行小惠言不及義者，與禽獸無異
  - label: C
    content: 管好自己的舌頭，免得會失禮出錯
  - label: D
    content: 若不能明禮尚義者，類同沐猴而冠。
- id: doc_113_新北_蘆洲_國文_g9s1e1_s1_23
  section: 1
  number: 23
  type: single
  page: 4
  stem: 黑悟空 打怪又餓又累，到了山海經上所述的招搖山，山海經云：「招搖之山，臨於西海上，多桂，多金玉。有草焉，其狀如韭而青華，其名曰祝餘，食之不飢。有木焉，其狀如穀而黑理，其華四照，其名曰迷穀，佩之不迷。有獸焉，其狀如禺（一種長猿猴）而白耳，伏行人走，其名曰猩猩，食之善走。」請問下列何物能幫又餓又累的黑悟空解決問題？
  options:
  - label: A
    content: 迷穀、祝餘
  - label: B
    content: 祝餘、猩猩
  - label: C
    content: 猩猩、迷穀
  - label: D
    content: 金玉、祝餘。
- id: doc_113_新北_蘆洲_國文_g9s1e1_s1_24
  section: 1
  number: 24
  type: single
  page: 4
  stem: 「白描」是抓住事物的主要特徵，用簡練的文字來描寫。例如：「一陣大雨過了，那黑雲邊上鑲著白雲，漸漸散去，透出一派日光來，照耀得滿湖通紅。湖邊山上，青一塊，紫一塊，綠一塊；……」吳敬梓以白描筆法，描寫雨後的湖光山色，下列文句何者只使用白描手法？
  options:
  - label: A
    content: 高大建築物聳立，長方體、圓柱體、三角體，參差錯落，在藍天白雲的背景下，描繪出幾何圖形來
  - label: B
