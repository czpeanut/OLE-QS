  group_stem: '(一)

    湛藍是無邪的召喚，無量的包容。

    人間世界不免常常擠迫、排斥、抱歉地凌刑，人間法律容許的射殺、撲滅、絕斷。

    奇怪，為什麼我也時時感受到親密人群敵意的眼光，兇惡的斥喝，抱歉的凌刑，遺憾的誅殺？野生的獸，野生的草。

    出現在錯誤的時間錯誤的地點，「世人皆欲殺，吾意獨憐才」，大鱷魚的命運，白犀牛的命運，背後都隱藏了命運之神邪惡的狂笑！

    ．．．．

    唯有湛藍是無邪的召喚。

    無限的包容。

    湛藍的高空。

    湛藍的深海。

    透明湛藍的你我的影子，遨遊其中。野生的族群們！

    在無邊湛藍中消逝無蹤，也是好的。

    不用去考慮前生來世過去未來，在果實成熟中飽和，在花葉綻放中撕裂。森森細細的風過竹葉切磋之聲中，感受大自然的肺腑之言，而自我消解，合拍劃入虛空湛藍中。

    (洪素麗湛藍 )'
