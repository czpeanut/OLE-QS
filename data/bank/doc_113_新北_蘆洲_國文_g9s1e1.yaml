- id: doc_113_新北_蘆洲_國文_g9s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 「問君能有幾多愁？恰似一江春水向東流。」其中用具體的流水來比喻抽象的「愁思」。下列選項中的「流水」，何者不是用來比喻抽象的愁思？
  options:
  - label: A
    content: 過盡千帆皆不是，斜暉脈脈水悠悠
  - label: B
    content: 桃花盡日隨流水，洞在清谿何處邊
  - label: C
    content: 請君試問東流水，別意與之誰短長
  - label: D
    content: 孤帆遠影碧山盡，唯見長江天際流
  lesson_raw:
    number: 第1課
    title: 宋詞選
    basis: 引用李煜〈虞美人〉名句
- id: doc_113_新北_蘆洲_國文_g9s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 下列文句的敘述，何者說明正確？
  options:
  - label: A
    content: 「雕闌玉砌應猶在，只是朱顏改」表達了年老色衰的惆悵感
  - label: B
    content: 「春花秋月何時了，往事知多少」抒發了美好事物難以永恆的感慨
  - label: C
    content: 「天下英雄誰敵手，曹劉」透過憑弔英雄，反諷當朝缺乏人才
  - label: D
    content: 「生子當如孫仲謀」期望兒子能繼承己志，成就光復神州大業。
  lesson_raw:
    number: 第1課
    title: 宋詞選
    basis: 引用宋詞選課文文句（虞美人、南鄉子）
- id: doc_113_新北_蘆洲_國文_g9s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 下列關於宋詞作品中經典名句的運用，何者正確？
