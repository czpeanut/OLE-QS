  - label: D
    content: 阿源真是太天才了，竟然把事情搞到神仙也難以收拾的地步。
- id: doc_113_高雄_光華_國文_g7s1e2_s3_8
  section: 3
  number: 8
  type: single
  page: 1
  stem: 「每天早上，她們總是披著一身淡淡的夜色便開始工作。」運用了轉化修辭。下列句子，何者沒有使用此一技巧？
  options:
  - label: A
    content: 窗外是一片鳥囀，有時是獨奏，有時是合唱，簡直是一派和諧的交響樂
  - label: B
    content: 這些街道和巷弄才可以經常保有一張清潔的容顏
  - label: C
    content: 三年八班全體同學沐浴在鴨子老師的愛心裡
  - label: D
    content: 這家外觀樸實無華的店，卻有著令人驚豔的料理。
- id: doc_113_高雄_光華_國文_g7s1e2_s3_9
  section: 3
  number: 9
  type: single
  page: 2
  stem: 關於差不多先生傳的敘述，下列何者正確？
  options:
