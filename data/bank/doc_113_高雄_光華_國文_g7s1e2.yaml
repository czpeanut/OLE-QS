- id: doc_113_高雄_光華_國文_g7s1e2_s4_3
  section: 4
  number: 3
  type: single
  page: 4
  stem: 對「學校生活是『一場可帶走的盛宴』」一句的解讀，下列何者正確？
  options:
  - label: A
    content: 學校生活中學到的知識與技能，是將來重要的謀生能力
  - label: B
    content: 學校生活充滿繽紛多彩的回憶
  - label: C
    content: 學生時期交往的朋友，是人生最大的資源
  - label: D
    content: 在學校生活中培養的習慣與能力，會一輩子跟著你。
  group_stem: "（二）\n    當我說學校生活是「一場可帶走的盛宴」時，我指的絕非謀生知識的學習。為什麼我會這樣認為呢？有三個原因：\n  第一，在學期間是培養求知心最好的時候，換句話，你要把握機會多方面培養興趣，無論是文學、藝術、科學都行，這就是一種求知心。\n\
    \  第二，你必須培養學習的習慣，包括終身學習的習慣。如果年輕人在學期間既沒有培養求知心，又沒有培養學習的習慣，我認為他是在浪費時間，那麼就算他考試考得再好，教科書背得再熟，我都認為沒有用。\n\
    \  第三，培養「思考能力」。學習如果沒有經過內化的過程，去發展出自己的思想，那不叫思考。求知心及學習習慣是兩項基本能力，至於思考能力則是更進一步的能力，如果想做些與普通人不同的事，非具備此能力不可。\n\
    \n（改寫自張忠謀學習生涯如同一場可帶走的盛宴）"
