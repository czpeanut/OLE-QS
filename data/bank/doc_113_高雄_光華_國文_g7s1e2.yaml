  - label: D
    content: 灶腳通常設在家中最重要的位置，相當於人體心臟部位。
  group_stem: "（四）\n    灶腳，廚房之謂。灶腳供應全家的飲食，是家的心臟，生活的依賴。\n  家有灶腳，有灶腳就有灶王爺，舊俗臘月二十三更盡時，灶王爺上天言事，家家祭灶。灶王爺是家的守護神，對家人的喜怒善惡，觀察皆有考紀，準備上天稟報。但灶王爺並非鐵面無私，頗有人情味的。所以，祭灶那天將糖飴抹在灶王爺神像口中，使他上天口不能多言，或將酒糟塗於灶口，使他酒醉不能說長道短，只能「上天言好事，下地保平安」。\n\
    \  不過，自從大同電鍋上市，天然氣普遍使用後，灶腳的情況改變。使用大同電鍋，家庭主婦無須晨起引火，煲粥煮飯，只要將米淘妥，置於內鍋之中，然後外鍋添水覆蓋，最後，像彈鋼琴似的將鍵向下一按，即可。不必再擔心飯夾生或焦糊，是中國主食體系的粒食文化重大的超越與突破。中國人不可一日無飯，當年留學生出國，都抱了個大同電鍋飄洋過海，表示雖漂泊異域也不忘本。\n\
    （節選自逯耀東灶腳）"
