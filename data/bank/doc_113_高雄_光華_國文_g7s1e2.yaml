- id: doc_113_高雄_光華_國文_g7s1e2_s3_10
  section: 3
  number: 10
  type: single
  page: 2
  stem: 差不多先生「十字常常寫成千字，千字常常寫成十字」，這種處事態度所造成的結果，最適合用下列何者來形容？
  options:
