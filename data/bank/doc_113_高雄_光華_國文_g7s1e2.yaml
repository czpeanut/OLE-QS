- id: doc_113_高雄_光華_國文_g7s1e2_s3_6
  section: 3
  number: 6
  type: single
  page: 1
  stem: 下列文句「  」中的詞語，何組前後意義相同？
  options:
  - label: A
    content: 敵人「耳目」眾多，你做事要格外小心╱這張專輯音樂風格令人「耳目」一新
  - label: B
    content: 對於這件事你自己要有主見，別輕易受到他人的意見「左右」而動搖╱我們已距離目的地三十公里「左右」
  - label: C
    content: 這次公司大「換血」帶來新氣象╱加油站員工因性質不穩定而頻繁「換血」
  - label: D
    content: 大樓「出入」請隨手關門，確保安全╱嫌犯與證人間的筆錄內容「出入」甚多。
