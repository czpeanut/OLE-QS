    content: 人無遠慮，必有近憂
  - label: B
    content: 愚者千慮，必有一得
  - label: C
    content: 失之毫釐，謬以千里
  - label: D
    content: 塞翁失馬，焉知非福。
  lesson_raw:
    title: 差不多先生傳
    basis: 題目引用差不多先生傳課文內容
- id: doc_113_高雄_光華_國文_g7s1e2_s3_11
  section: 3
  number: 11
  type: single
  page: 2
  stem: 下列有關論語文句的說明，何者正確？
  options:
  - label: A
    content: 「學而時習之，不亦說乎」：以反詰語氣提示學習的方法，意近「日知其所亡，月無忘其所能」
  - label: B
    content: 「有朋自遠方來，不亦樂乎」：志同道合的朋友一起旅遊，彼此增廣見聞、開拓視野
  - label: C
    content: 「三人行，必有我師焉」：意近於「學無常師」，表現了孔子剛愎自用、好為人師的精神
  - label: D
    content: 「擇其善者而從之，其不善者而改之」：說明「選擇」的重要，並且我們應該設法讓不良善的人改變。
  lesson_raw:
    title: 論語選
    basis: 題目考查論語選課文文句
- id: doc_113_高雄_光華_國文_g7s1e2_s3_12
  section: 3
  number: 12
  type: single
  page: 2
  stem: 下列有關學習的論語篇章，何者內容說明不正確？
  options:
  - label: A
    content: 「學而不思則罔，思而不學則殆」：告訴人們學習應重視思辨的能力，盡信書不如無書
  - label: B
    content: 「學如不及，猶恐失之」：揭示求學的態度，要不斷精進自己所學
  - label: C
    content: 「譬如為山，未成一簣，止，吾止也；譬如平地，雖覆一簣，進，吾往也」：勉人為學應抱持持之以恆的態度，不可半途而廢
  - label: D
    content: 「知之者不如好之者，好之者不如樂之者」：以層遞法說明人的學習可以有不同境界，並藉此勉勵人為學要樂在其中。
  lesson_raw:
    title: 論語選
    basis: 題目考查論語篇章
- id: doc_113_高雄_光華_國文_g7s1e2_s3_13
  section: 3
  number: 13
  type: single
  page: 2
  stem: 「子貢問曰：『有一言而可以終身行之者乎？』子曰：『其恕乎！己所不欲，勿施於人。』」根據這段文字，下列敘述何者正確？
  options:
  - label: A
    content: 子貢向孔子請教如何增進人際關係的和諧
  - label: B
    content: 孔子以推測的語氣提出「恕」可作為做人的準則
  - label: C
    content: 「恕」指以德報怨，強調人要不計前仇，而以恩德回報他人
  - label: D
    content: 「己所不欲，勿施於人」指自己所無法達成的願望，也不要期待其他人可以完成。
  lesson_raw:
    title: 論語選
    basis: 引用論語選課文原句
- id: doc_113_高雄_光華_國文_g7s1e2_s3_14
  section: 3
  number: 14
  type: single
  page: 2
  stem: 「有朋自遠方來，不亦樂乎?」此句的意涵與下列何者相去最遠？
  options:
  - label: A
    content: 朋友就像是一本一本的好書
  - label: B
    content: 讀萬卷書，行萬里路
  - label: C
    content: 獨學而無友，則孤陋而寡聞
  - label: D
    content: 朋友能增長你的知識，擴充你的生活經驗。
  lesson_raw:
    title: 論語選
    basis: 引用論語選課文原句
- id: doc_113_高雄_光華_國文_g7s1e2_s3_15
  section: 3
  number: 15
  type: single
  page: 2
  stem: 子曰：「弟子入則孝，出則弟，謹而信，汎愛眾，而親仁。行有餘力，則以學文。」本文主要在說明什麼道理？
  options:
  - label: A
    content: 學好典籍知識後，就可懂得做人的道理
  - label: B
    content: 要謹記典籍知識，並運用在待人處世上
  - label: C
    content: 要先學習做人的道理，再學習典籍知識
  - label: D
    content: 博學多聞的人，才能獲得好的人際關係。
  lesson_raw:
    title: 論語選
    basis: 題目出自論語篇章
- id: doc_113_高雄_光華_國文_g7s1e2_s3_16
  section: 3
  number: 16
  type: single
  page: 2
  stem: 「己所不欲，勿施於人」是待人處事應該奉行的準則。下列實例，何者最符合這項準則？
  options:
  - label: A
    content: 硯晨不想去倒垃圾，所以叫弟弟去
  - label: B
    content: 瑜芊在專心作畫時討厭被人打擾，所以當她晚上聽音樂時必定控制音量，以免吵到鄰居
  - label: C
    content: 有人打珵哥的左臉，珵哥請他連右臉也均衡一下
  - label: D
    content: 姵蓁的弟弟效法「孔融讓梨」的精神，把好吃的海苔包飯留給姊姊吃。
  lesson_raw:
    title: 論語選
    basis: 引用論語選課文名句
