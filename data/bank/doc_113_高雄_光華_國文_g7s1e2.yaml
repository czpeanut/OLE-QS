- id: doc_113_高雄_光華_國文_g7s1e2_s4_9
  section: 4
  number: 9
  type: single
  page: 5
  stem: 下列選項，何者不是作者的觀點？
  options:
  - label: A
    content: 要得慢活，必須相信自己並持之以恆
  - label: B
    content: 慢活的人生需要行動加以完成
  - label: C
    content: 當慢活與生活相矛盾時，可以找人互相支持
  - label: D
    content: 了解植物的紋理脈絡是每一個慢活人都需具備的。
  group_stem: "（五）\n    「慢」顯然要敢與人不同，要放棄眾人的「快」，要敢與「快」對抗，此種對抗來自對「慢」的充分認知、不只想、還得付諸行動，要對自己的「慢」充滿自信、喜歡、並堅持「擇慢而固執之」。\n\
    \  但看來，「由快入慢之路」不能不有一些準備功課，不論是腳力、筆力、眼力，總得從簡單暗暗起步，當與「眾快」面對或打照面時，不退縮、不欣羨、不找理由放棄。而當自知起步之際「一慢」難敵「眾快」時，何妨先尋「數慢」一起行動，或躲入「眾慢」以藏拙？待自信建立，再出慢以敵快，亦不為遲。\n\
    \  有一位清瘦的我的學生，是步道解說員，動植物的知識廣博無比，有一次我請她為我社大學員到圓通寺解說花花草草。我們沿著寺外的小路往寺後山丘走去，前後不到三百公尺的路，竟走了一上午，卻至少還有一大半的路沒有走完。平日尋常所見路旁小花小樹叢小蟲子，在她的指點之間，成了充滿生機勃勃和趣味無限的小宇宙，學員們一個個拿著放大鏡探照人間「美境」，「哀叫」連連。許多花蕊花粉花苞葉脈葉刺葉孢，在十五至二十倍的目光放大下，精美如殿堂仙宮，令人目不暇給。這樣的天地唯「慢」可得。有一回她為了解說臺北植物園內的詩經植物，反覆查書和先行探訪，後來在那不到百坪大的圓屋園四周，也是「慢出一上午」，將古今植物的相關來源詳加解析，趣味無窮。我這位解說員學生，可真是「慢」的守門人。\n\
    \  古人所說，「萬物靜觀皆自得」，「靜觀」豈不是「慢觀」？\n（白靈「慢」是動詞）"
