- id: doc_113_高雄_光華_國文_g7s1e2_s4_1
  section: 4
  number: 1
  type: single
  page: 3
  stem: 第一則故事中的懶人，為何希望冥王將他變成白鼻貓？
  options:
  - label: A
    content: 因為白鼻貓受人喜愛，方便得到食物
  - label: B
    content: 因為他想用白鼻親近老鼠，與牠們交好
  - label: C
    content: 因為他想用白鼻當誘餌，吸引老鼠接近
  - label: D
    content: 因為他希望長得與眾不同，有別於一般的貓。
  group_stem: "（一）\n    一人素性最懶，終日偃臥不起。每日三餐，亦懶於動口，懨懨絕粒，竟至餓斃。冥王以其生前性懶，罰去輪迴變貓。懶者曰：「身上毛片，願求大王賞一全體黑身，單單留一白鼻，感恩實多。」王問何故，答曰：「我作貓躲在黑地裡，鼠見我白鼻，認作是塊米糕，貪想偷吃，潛到嘴邊，一口咬住，豈不省了無數氣力。」\n\
    ----------------------------------------------------------------------------------------------------\n\
    \    一婦人極懶，日用飲食丈夫操作。他只知衣來伸手，飯來張口而已。一日，夫將遠行，五日方回。恐其懶作挨餓，乃烙一大餅，套在婦人項上，為五日之需，乃放心出門而去。及夫歸，已餓死三日矣。夫大駭，進房門一看，項上餅只將面前近口之處吃了一缺，餅依然未動也。\n\
    （笑林廣記二則）"
