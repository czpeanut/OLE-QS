- id: doc_113_高雄_光華_國文_g7s1e2_s4_5
  section: 4
  number: 5
  type: single
  page: 4
  stem: 「他在清晨街角的騎樓下擺麵攤賣早點，簡簡單單的生財用具總是刷得乾乾淨淨，擺放得整整齊齊，他自己也是一個整齊乾淨、外表看來簡單普通的人。」本段話使用何種修辭技巧？
  options:
  - label: A
    content: 倒反
  - label: B
    content: 轉化
  - label: C
    content: 譬喻
  - label: D
    content: 摹寫。
  group_stem: "（三）\n    他在清晨街角的騎樓下擺麵攤賣早點，簡簡單單的生財用具總是刷得乾乾淨淨，擺放得整整齊齊，他自己也是一個整齊乾淨、外表看來簡單普通的人。然而，這樣一個小人物卻有他一套莊嚴的工作哲學。有一天，我聽他這樣說：「小生意，討個生活。可是說來見笑，在我這個攤子上，每天來的有學生、計程車司機、老師、公司老闆、上班的小姐先生，我照顧他們的肚子，讓他們吃飽了好讀書、做事。所以衛生我很注意，不是小事情吶！我有責任的。」\n\
    \  是的，一碗肉絲麵、餛飩湯化成了活力的「能源」，化成了各種工作的成果，從學生的成績到大老闆的業績，都有這賣麵人不可抹煞的貢獻。\n（郭麗華馳騁在思路上）"
