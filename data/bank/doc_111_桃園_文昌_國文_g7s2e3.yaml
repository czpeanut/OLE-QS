  group_stem: "（三）2018 年7 月10 日，約四個月大的「妹仔」與母熊走失，自此展開人間之旅。歷經280 天的安置與野化訓練，小熊終於要回家了。\n\
    \  4 月28 日上午，地面部隊徒步出發。29 日，野放前一天，我最後一次到野訓場餵牠─十七天沒見，想念，但不如不見。為了讓小熊回家前斷開與人的連結，野放前三週開始進行陌生人趨避訓練。每次我們都請不同人進場，製造巨響，甚至用辣椒噴霧，直到牠見人就懼怕逃躲為止。野放前兩週，野訓團隊也避不見牠，餵食只從籬外丟進。這樣的「斷捨離」，對牠和我們都是痛苦的過程。\n\
    \  30 日清晨，移進運輸籠的小熊從麻醉中醒來，準備搭機，地面部隊也在天亮前到達野放地點。7 點10 分，直升機飛抵目的地，地面部隊立即將運輸籠抬下。這個野放地點位在邊坡，周圍沒有陡峭地形，將是小熊新生活的起點。下午2\
    \ 點，四位獸醫一致同意，小熊可以野放了。我提起籠門，牠小心翼翼踏出步伐，流露遲疑和徬徨。當牠在樹林邊回眸，我示意夥伴點鞭炮擲向小熊─縱使臨別在即，也不能讓牠有一絲人類友善的想法。小熊驚慌跑開，爬上一棵大樹。這是逃避危險的典型反應。隔天，山下研究室回報小熊身上衛星發報器的定位點，牠已移動了1\
    \ 公里，在約兩千公尺高的山稜。\n  回營地後，下了一場大雨。願這場雨洗盡小熊身上的人間味，抹去我們在林子的足跡。今後，牠是牠，我是我。親愛的孩子，加油，回家快樂。（改寫自黃美秀《小熊回家：南安小熊教我們的事》）\n\
    \n黑熊野放的主要考量因素(表一)\n| 年齡 | 黑熊在1～2 歲時脫離母熊自行生活，故以11 到23 個月為宜。 |\n| --- | --- |\n\
    | 環境 | 區內熊隻不宜密集，以免過度競爭。 |\n| 季節 | 秋冬固為青剛櫟結果期，但熊隻活動密集。春末則山區野果充沛，野放個體在颱風季前，能有足夠時間探索環境。\
    \ |"
