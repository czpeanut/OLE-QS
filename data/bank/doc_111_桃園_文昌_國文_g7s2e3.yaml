  section: 1
  number: 13
  type: single
  page: 3
  stem: 文昌小學園打算辦一場人文講座，並邀請適合的作家來演講。請問下列作家與演講主題的搭配，何者最適當？
  options:
  - label: A
    content: '演講者：陶淵明

      主題：縱橫官場之道

      簡介：從陶淵明本人的仕途之路，作為演講主軸，分享其平步青雲的方法。兼及退休後的隱居生活，包括耕讀、飲酒與寫作的興趣培養。'
  - label: B
    content: '演講者：洪蘭

      主題：閱讀為教育之本

      簡介：洪蘭教授常發表文章，並應邀至各界演講，致力於閱讀教育的推廣。閱讀與創造力是同一個神經機制，透過閱讀可以激發出更多思考與想像。'
  - label: C
    content: '演講者：陳之藩

      主題：小說寫作秘訣

      簡介：陳之藩教授身兼科學家、工程師、博士和小說作家等多重身分。本次演講將分享其著名的小說作品《旅美小簡》，剖析其中的角色分析與情節經營。'
  - label: D
    content: '演講者：賴和

      主題：媚世隨俗生存法

      簡介：賴和將以被殖民者的角度，切入如何在被異族統治下，順應潮流攀附權貴，以保全自己，並創辦台灣文化協會，鞏固殖民者的威權統治。'
