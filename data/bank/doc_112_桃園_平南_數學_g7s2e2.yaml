  section: 1
  number: 5
  type: single
  page: 1
  stem: '關於甲、乙、丙、丁、戊五個敘述，$y$ 與 $x$ 成正比的有幾個？

    甲：$x$、$y$ 是不為 0 的數，滿足 $x:5=y:6$。

    乙：$x$、$y$ 是不為 0 的數，滿足 $x:3=(-7):y$。

    丙：三角形底為 $x$ 公分，高為 20 公分，面積為 $y$ 平方公分。

    丁：參考書以每本 $x$ 元的價錢，買了 $y$ 本，共花了 560 元。

    戊：以時速 $x$ 公里，花了 $y$ 小時，走完 40 公里。'
  options:
  - label: A
    content: '1'
  - label: B
    content: '2'
  - label: C
    content: '3'
  - label: D
    content: '4'
