- id: doc_113_彰化_丹鳳_社會_歷史_g8s1e1_s1_34
  section: 1
  number: 34
  type: single
  page: 2
  stem: '陳陳老師講完隋唐時期文化的外傳概況後，要同學以簡單的幾句話表達這個時期受影響國家的特色。

    威凱：「日本全力模仿中國的文字、曆法、儒學和佛教，因而有「君子國」之稱。。」

    鈞閎：日本展開唐化運動，史稱「大化革新」。

    宗澤：「文成公主嫁到大食，宣揚佛教思想，並將農業技術等帶入大食。」

    秉勳：「唐朝軍隊與大食交戰於怛羅斯，唐軍戰敗，造紙術西傳。」

    上述哪幾位同學的說法較為正確？'
