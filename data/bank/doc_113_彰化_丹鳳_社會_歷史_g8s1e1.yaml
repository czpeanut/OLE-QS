    | :---: | :---: | :---: |

    | 甲 | 西周 | 世襲 |

    | 乙 | 漢代 | 推舉孝廉 |

    | 丙 | 魏晉南北朝 | 平民任官 |

    | 丁 | 隋唐 | 科舉制度 |'
