  page: 1
  stem: '一個高度集權的國家，除了仰賴強而有力的賦稅制度維持運行之外，還必需仰賴環環相扣的人才選拔協助帝國的運作。請問：上表中關於各朝代人才選拔的制度，何者錯誤？


