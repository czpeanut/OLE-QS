    | :---: | :---: | :---: |

    | 中央地方 | 天子，名義上的共主諸侯國各國內政自主，天子無權過問。 | 皇帝，中央集權郡縣長官由朝廷任免，聽命中夾 |

    | 人民 | 人民效忠地方統治者，向其納稅、服勞役 | 人民效忠皇帝，向政府納稅、服勞役 |'
