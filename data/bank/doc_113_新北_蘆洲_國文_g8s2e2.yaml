- id: doc_113_新北_蘆洲_國文_g8s2e2_s2_35
  section: 2
  number: 35
  type: single
  page: 5
  stem: 下列對甲乙兩文內容的描述，何者最為正確？
  options:
  - label: A
    content: 甲文指出，女鬼形象強大源自於舊社會中不公平的對待
  - label: B
    content: 乙文中的女鬼夜中徘徊，尋夫沒有結果，化為簫聲消散
  - label: C
    content: 甲文指出金魅因違背家族規矩，被詛咒成為守護家庭的神靈
  - label: D
    content: 乙文以女鬼追逐復仇凌虐為主軸，展現女鬼心中強烈的怨恨
  group_stem: "(二)\n甲、厲鬼總是女生？(聽人說鬼話——臺灣妖魔怪文學展 節錄)\n    為什麼很多臺灣的民間傳說中，法力高強的厲鬼，幾乎都是女鬼？\n\
    \    因為過去在漢人傳統文化當中，女性的地位遠遠不及男性，甚至得不到應有的權利。多數的女性沒有機會讀書，甚至從小就會被送去當作童養媳（新婦仔），無法選擇自己的結婚對象，所以經常遇人不淑，或者感情上被男性欺騙、甚至被性侵犯等等，而沒有保護自己的能力。\n\
    \    所以女性在死亡之後，獲得另外一個世界的力量，才得以洗刷冤情、伸張正義。例如像李昭娘（林投姐）以及《周成過臺灣》的女鬼「月裡」等等，都是在清代中後期，臺灣與唐山跨海頻繁貿易的背景下，女性被來往兩岸的男性拋棄，走投無路，只好選擇自殺，後來變成厲鬼復仇的故事。\n\
    \    而椅仔姑以及金魅，雖然在其他國家也有類似傳說，如金魅代表的巫蠱文化等等。但是在臺灣民間流傳的版本，卻是小女孩被迫勞動、被凌虐致死的故事，這些或許都反應了古代社會人身買賣的陋習。因此這些民間傳說，不單純只是驚悚駭人的故事而已，更是一種警世的寓言。\n\
    (註：金魅是民間傳說中的一種小鬼，有些地方叫做「金蠶」，客家人則是叫做「家鬼」。金魅原本是一名大戶人家的童養媳，被女主人活活凌虐而死，死後化為鬼魂，仍然繼續幫主人做家事。不過讓金魅工作是有代價的，例如絕對不可偷看金魅工作、也必須定期提供活人血肉來獻祭等等，如果無法遵守承諾，該戶人家必定發生血光之災。)\n\
    \n乙、女鬼（二）洛夫\n她\n被一根繩子提升為\n一篇極其哀麗的\n聊齋\n\n循著簫聲搜尋\n每一個窗口都可能坐著\n\n她那位進京赴試的\n薄倖書生\n\
    \n風來無聲\n她閃身躍入\n剛閤攏的那本線裝書"
