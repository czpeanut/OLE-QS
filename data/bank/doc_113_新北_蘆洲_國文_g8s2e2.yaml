  - label: C
    content: 「八面玲瓏」在本文中意指多方觀察思考事物
  - label: D
    content: 由外望內、由內望外，空間交錯切換，景中有動有靜。
  group_stem: "(四)\n遊江 \t\t鄭燮\n    昨遊江上，見修竹數千株，其中有茅屋，有棋聲，有茶煙飄颺而出，心竊樂之。次日過訪其家，見琴書几席，淨好無塵，作一片豆綠色，蓋竹光相射故也。靜坐許久，從竹縫中向外而窺，見青山大江，風帆漁艇，又有葦洲，有耕犁，有饁婦，有二小兒戲於沙上，犬立岸傍，如相守者，直是小李將軍畫意，懸掛於竹枝竹葉間也。由外望內，是一種境地；由中望外，又是一種境地。學者誠能八面玲瓏，千古文章之道，不出於是，豈獨畫乎？\n\
    \    乾隆戊寅清和月，板橋鄭燮畫竹後又記。\n【注釋】\n❶饁婦：給耕田者送飯的婦人。饁，音ㄧㄝˋ。❷小李將軍：唐朝山水畫家李思訓。"
