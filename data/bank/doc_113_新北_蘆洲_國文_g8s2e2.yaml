    content: 陸放翁有一聯詩句：「傳呼快馬迎新月，卻上輕輿趁晚涼。」這是做地方官的風流。我在康橋時雖沒馬騎，沒轎子坐，卻也有我的風流
  - label: C
    content: 唐 人張謂有句這樣的詩：『看花尋徑遠，聽鳥入林迷。』那被嚶嚶鳥鳴所引渡而到達的迷離幻域，那因一朵花的呼喚而誤闖的桃源，才是上天更慷慨的福澤傾注
  - label: D
    content: 喜歡旅行的人多少都會把護照上的戳章當做一種旅行的印記，簡單的一個章同時紀錄旅程的時間、地點，但如果能在頁面上留下不同的護照戳章，又會是一種全然不同的成就感！
