  stem: '下表為清帝國統治臺灣初期所公布的法令，這應為下列何法令？(L4)

    一、欲渡航赴臺灣者，先給原籍地方之照單，經分巡臺廈兵備道之稽查，依臺灣海防同知之審驗許之，潛渡者處以嚴罰。

