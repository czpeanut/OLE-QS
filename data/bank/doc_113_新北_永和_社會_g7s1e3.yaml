  section: 3
  number: 51
  type: single
  page: 6
  stem: 請問上述景洋岡社區成立的(甲)組織，最有可能是下列何者？(L6)
  options:
  - label: A
    content: 社區管理委員會
  - label: B
    content: 社區發展協會
  - label: C
    content: 社區巡邏志工隊
  - label: D
    content: 社區文史工作室。
  group_stem: '請根據下文，回答第51 至54 題：

    就讀7 年級的武調霧一家人搬進景洋岡社區，社區有成立(甲)組織，該組織要求住戶每月要繳新臺幣1 萬元整的管理費。另外社區在每年中元普渡會舉行祭拜活動，而在端午節、中秋節也會舉行活動，武調霧都有參與，讓他逐漸展生我是社區一份子的認同感與歸屬感。武調霧的父親武崧有正義感，熱心參與社區公共事務，他發現社區面臨青年人口外移危機，因此成立(乙)組織，並向衛生福利部申請補助，以推動社區發展。武崧並結合當地的臺灣雲豹傳說，做成一系列臺灣雲豹的文創特色商品，拿到電商平台販售，並鼓勵年輕人返鄉創業生活。'
