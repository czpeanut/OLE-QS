  stem: '請閱讀下列資料，判斷「頂下郊拼」發生的主要原因為何？(L6)

    資料(一)：十八世紀後期，移民至艋舺的泉州人以從事海峽兩岸貿易維生。十九世紀，艋舺的泉州移民漸多，並發展出下郊(同安人移民組成)與頂郊(晉江、惠安、南安三縣移民合組)兩大行郊。兩大商業團體為了爭奪艋舺碼頭的貨運，時常發生衝突。

    資料(二)：西元1853 年，雙方發生激烈的械鬥，是為「頂下郊拼」。同安人遭到驅離，轉到大稻埕興建店街，利用淡水河從事貿易，而後在大稻埕建了霞海城隍廟，奉祀從械鬥中救出的城隍爺神像。'
