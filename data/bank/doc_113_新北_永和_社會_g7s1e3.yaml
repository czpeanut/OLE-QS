  group_stem: '請根據下文，回答第48 至49 題：

    電視劇《黑暗榮耀》描述主角文同珢的不幸起始於拒絕幫朴涎鎮掃廁所，面臨拳打腳踢、賞巴掌的對待。也因為她向警局報案遭到以朴涎鎮為首的霸凌五人幫報復，全身上下都是被電捲棒燙出來的傷痕，讓痛不欲生的她想要退學。遞交退學申請書時，卻因為在退學原因上寫「被朴涎鎮等人霸凌因此退學」，而導師卻因為怕這個原因會影響到他的教師評比，一怒之下打了文同珢，聲稱她說的霸凌只是同學之間的惡作劇。'
