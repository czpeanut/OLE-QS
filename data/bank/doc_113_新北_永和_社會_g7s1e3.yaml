  section: 3
  number: 57
  type: single
  page: 6
  stem: 根據上述報導，我國保障各固有族群的語言，為下列何者？(L6)
  options:
  - label: A
    content: 原住民族基本法
  - label: B
    content: 原住民族身分法
  - label: C
    content: 國家語言發展法
  - label: D
    content: 原住民族工作權益保障法。
  group_stem: '請根據下列新聞，回答第57 至58 題：

    原住民族語言研究發展基金會（原語會）日前發表「原住民族語言能力與使用狀況調查」結果，發現族人使用族語場合，大都以家庭為主，比例高於學校、教會等處。因此，原語會建議，未來可推動家庭來學習族語。學者建議，可思考如何改善，原住民到學校上課減少使用族語的問題。(摘要與改寫自2024/12/26
    知新聞，標題：原民語調查：4成在家先聽族語、日常僅3 成用 專家：上學後少用族語該加強。)'
