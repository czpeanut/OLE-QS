    content: Robots Can Do All Jobs for People.
  - label: C
    content: People Are Afraid of AI and Robots.
  - label: D
    content: It’s a Difficult Age.
  group_stem: "Are AI and robots on the way to work for us? About 50﹪of jobs will\
    \ be done by AI and robots in ten years. That’s because AI and robots are becoming\
    \ so good and almost any everyday work can be done by them.\n      It’s not something\
    \ new in history. In the early 19th century, when the workers lost their jobs\
    \ to machine. They couldn’t face it, and they fought back against the machines.\
    \ They called themselves the “Luddites.”\n      How will people deal with the\
    \ problem – AI and robots are taking all our jobs? In the age of AI, people cannot\
    \ keep working just like robots. What we can do differently is to show love, help\
    \ each other, and understand people around us. That’s what AI and robots can’t\
    \ do.\n     What do we students need to learn for the age of AI? We need to get\
    \ into the field where the AI is not good at. In this way, we may think the questions\
    \ carefully before we choose to study for the future.\n     Does this field need\
    \ to use social skills to work or act with others?\n     Does this field need\
    \ to use creative ideas to deal with any problems?\n     If your answer is “yes”,\
    \ you will have more chances of getting good jobs, and the jobs will not be taken\
    \ away by AI and robots.\n\n be done 被做   machine 機器    deal with 處理    understand\
    \ 了解   choose 選擇\nsocial skills 社交技巧   creative 創造性的"
