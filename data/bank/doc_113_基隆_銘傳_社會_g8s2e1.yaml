- id: doc_113_基隆_銘傳_社會_g8s2e1_s1_18
  section: 1
  number: 18
  type: single
  page: 3
  stem: '下列為兩位學者於西元 1915 年所發表的文章部分節錄，請閱讀後選出正確的選項。

    資料一：……中國數千年以來，習於君主專制體制，各地學校短缺，大多數之人民智識不甚高尚，人民更缺乏參與政治之能力，四年以前，由專制一變而為共和，此番變動太快，難望有良好結果……中國將來必因總統繼承問題「釀成禍亂」……如一時不立即撲滅禍亂，可能導致敗壞中國之獨立……中國如用君主制，較共和制為宜，此殆無可疑者也。

    資料二：夫國體本無絕對之美，而惟以已成之事實為其成立存在之根原；欲憑學理為主奴而施人為的取捨於其間，寧非天下絕痴妄之事？僅痴妄猶未足為深病也；惟於國體挾一愛憎之見，而以人為的造成事實，以求與其愛憎相應，則利害之中於國家將無已時。故鄙人生平持論，無論何種國體，皆非所反對；惟在現行國體之下，而思以言論鼓吹他種國體，則無論何時皆反對之。'
  options:
  - label: A
    content: 這兩篇文章出現的背景皆與中華民國第一任總統的作為有關
  - label: B
    content: 資料一最有可能為溥儀稱帝所使用
  - label: C
    content: 資料二很有可能節錄自古德諾的〈共和與君主論〉
  - label: D
    content: 當時國家的根本大法是臨時政府時頒布的《中華民國臨時約法》。
