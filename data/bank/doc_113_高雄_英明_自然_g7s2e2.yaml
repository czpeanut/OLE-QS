  stem: (   )44.下列關於氣喘的敘述，何者正確？
  options:
  - label: A
    content: 氣喘為一種慢性疾病，只會發生在孩童及青少年
  - label: B
    content: 使用除溼機讓環境溼度低於 70％，將可改善氣喘的發生率
  - label: C
    content: 臺灣環境潮溼多雨，黴菌孢子為引發氣喘發作的主要原因
  - label: D
    content: 氣喘兒家裡最好擺放絨毛娃娃，讓病童心情愉快，以儘早康復
  group_stem: "【題組】請回答下列問題44~45\n  氣喘是一種慢性疾病，氣喘的成因通常是呼吸道發炎或變窄，病人的氣管平滑肌會呈現肥大及收縮，基底膜增厚、黏膜腫脹及分泌物增加，組織則呈現發炎及損傷現象。\n\
    \  氣喘可能於任何年齡產生，而在孩童期具有過敏病存在者較易在青少年出現氣喘。容易引發氣喘發作的刺激物，包含寵物的毛髮、塵蟎、花粉、黴菌孢子、香菸、油漆及蟑螂等，其中以塵蟎為臺灣氣喘過敏的主要原因，塵蟎是一種八隻腳的小型節肢動物，屬於蛛形綱，喜歡生長在溫暖潮溼的環境中，適合生長的環境溫度為\
    \ 22～26℃、溼度為 70～80％，通常藏身在地毯、絨毛玩具或寢具中，而塵蟎所產生的糞便常會引發氣喘，因此應該儘可能保持居家環境的清潔，以減少氣喘病的發生。"
