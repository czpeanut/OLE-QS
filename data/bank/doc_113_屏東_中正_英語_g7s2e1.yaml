  group_stem: '(一).Adopt a Pet

    | Name: Meow

    Age: one year old

    ★ He is quiet, and he enjoys sleeping.

    ★ He doesn’t catch mice, but with him, they don’t come near your home. | Name:
    Coco

    Age: two weeks old

    ★ She is cute, but she chirps a lot every day.

    ★ When she becomes a hen, you can get an egg a day from her. |

    | Name: Lucky

    Age: three months old

    ★ He is energetic, and he likes to be with people.

    ★ He likes to play with balls. It is nice to walk him and play with him every
    day. | Name: Snow Ball

    Age: six months old

    ★ She is clean, and she loves apples.

    ★ She doesn’t like to stay in the cage. She likes to jump around. |


