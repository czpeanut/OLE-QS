  group_stem: '(四)

    THE GIRAFFE MANOR


    In the capital of Kenya, there is a famous hotel 一the Giraffe Manor. The hotel
    is actually an 87-year-old house with two floors and twelve bedrooms. There is
    something very special about this beautiful hotel—it has giraffes! People come
    from all over the world to see them. The giraffes are near the house and walk
    around the garden outside. The windows are very big, so you can see <u>them</u>
    from any room in the house.

    At lunch time, the giraffes line up at the open windows and join you! You can
    feed them some fruit like apples or bananas. There is no danger. The giraffes
    are awesome and don''t attack. You can take many selfies with them. Everyone can
    have a fun lunch.

    There is a forest near the house, too. A tour guide can take people for a walk
    in the afternoon. You can see many beautiful and colorful birds. The Giraffe Manor
    is not just a hotel. It is a wonderful place for nature lovers.

    📖capital 首都 Kenya 肯亞 actually 事實上 floor 樓層 tour guide 導遊 nature lover 大自然愛好者'
