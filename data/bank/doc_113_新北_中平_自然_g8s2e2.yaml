  - label: A
    content: 降低溫室溫度
  - label: B
    content: 增加土壤水分
  - label: C
    content: 提高植物光合作用效率
  - label: D
    content: 減少病蟲害滋生
  group_stem: '素養題組 (31~33)

    溫室栽培與二氧化碳的化學平衡調控

    在現代農業中，溫室栽培已廣泛應用於提高作物產量與品質。溫室內的環境控制不僅僅包含光照與溫度，二氧化碳濃度的管理更是關鍵。植物進行光合作用時需要二氧化碳、水與光能來製造葡萄糖與氧氣。在密閉溫室中，二氧化碳容易因為植物大量吸收而降低，進而影響光合作用效率。因此，農業技術人員會注入適量的二氧化碳，使光合作用保持在最佳效率。反應式:

    $CO_{2}+H_{2}O \rightleftharpoons H_{2}CO_{3}$

    這個反應在生物體內與溫室環境中都會發生。

    在溫室中，注入$CO_{2}$ 會暫時改變平衡，使反應偏向生成碳酸。然而，隨著$CO_{2}$ 被植物吸收，反應又會往反方向移動，釋放$CO_{2}$ 以補償下降的濃度，透過這樣的方式，溫室可以在$CO_{2}$
    控制與作物成長之間維持穩定狀態，展現出科學知識在農業實踐上的具體價值。'
