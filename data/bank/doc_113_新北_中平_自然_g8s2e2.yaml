- id: doc_113_新北_中平_自然_g8s2e2_s1_25
  section: 1
  number: 25
  type: single
  page: 3
  stem: 以下哪一種做法有助於中和反應進行更快？
  options:
  - label: A
    content: 使用冷水溶解氫氧化鈉
  - label: B
    content: 將反應物做成大塊固體
  - label: C
    content: 降低反應物的濃度
  - label: D
    content: 提高溫度並使用粉末狀物質
  group_stem: '題組 25~29

    成振宇是一名能進入異世界副本「化學迷宮」的獵人。他發現這個迷宮充滿了腐蝕性的酸霧與具毒性的鹼霧，許多冒險者都因無法應對而失敗。為了突破難關，他找來學霸隊友理化狂人，一起破解機關。

    他們發現，迷宮裡的酸霧其實是硫酸（$H_{2}SO_{4}$），而鹼霧則是氫氧化鈉（$NaOH$）。只要將兩者適量混合，就會發生反應，生成水與無害的鹽。但他們也注意到，如果反應速度太慢，仍會被毒霧傷害。

    理化狂人建議將氫氧化鈉粉末溶於熱水中再噴灑，能更有效地中和酸霧。

    最終，他們靠著化學知識打敗BOSS「酸鹼吞噬者」，成功取得S 級寶物「中和之杖」。成振宇感慨道：「沒想到升級的不只有我，連我的科學常識也進化了！」'
