- id: doc_113_新北_中平_自然_g8s2e2_s1_39
  section: 1
  number: 39
  type: single
  page: 5
  stem: 醫生偵測到病人細胞表面鹿角藻糖異常升高，可能與下列哪一項有關？
  options:
  - label: A
    content: 腫瘤或癌症前兆
  - label: B
    content: 紅血球內液壓異常
  - label: C
    content: 缺乏維生素C
  - label: D
    content: 血糖過高導致昏迷
  group_stem: '素養題組 ( 39~40)

    在化學發展的早期，科學家根據物質的分子式進行分類。他們發現許多天然中具有甜味的化合物，其分子式可以寫成$C_{n}(H_{2}O)_{m}$的形式，這看起來就像是「碳
    + 水」，於是被稱為「碳水化合物」。根據這個定義，只要化合物的比例符合這個形式，就會被歸類為糖類。因此，像甲醛($CH_{2}O$)這樣結構簡單的物質，曾一度被某些科學家視為最基本的糖類。

    隨著生物化學的研究進展，科學家逐漸發現這種分類方式存在重大問題。有些符合這個分子式的物質其實並不具有糖類應有的特徵與功能，例如甲醛無法在生物體中擔任糖類的角色。另一方面，一些明顯具有糖類功能的物質，像是鹿角藻糖($C_{6}H_{12}O_{5}$)，卻不符合這個通式。

    但是鹿角藻糖卻在生物體中發揮極為關鍵的功能。它常出現在細胞膜表面的糖蛋白或醣脂結構中，參與細胞辨識、訊號傳遞與免疫反應。舉例來說，血型抗原如 ABO 系統中的糖鏈末端，就含有鹿角藻糖。在某些腫瘤細胞表面，鹿角藻糖的濃度會異常升高，因此也被視為癌症診斷的重要生物標記。它還存在於母乳中的人乳寡糖中，是幫助新生兒建立腸道益菌與免疫防禦的重要成分。

    這使得學者開始重新檢視糖類的本質與定義……

    現代的糖類定義已脫離單純的分子比例判斷，而是著重於化合物的結構與功能。根據現行定義，糖類指的是具有三個或以上碳原子($n \geq 3$)，這些化合物最基本的型態稱為「單醣」，不能再水解為更小的糖，是所有醣類的基本單位。葡萄糖與果糖(兩者化學式相同但結構不同)就是常見的單醣。

    從甲醛的錯誤分類，到鹿角藻糖的深入研究，我們可以清楚看出：化學不是死背公式，而是要理解物質的結構、功能與應用。透過這些案例，我們也學到一個更深刻的科學觀念——科學知識會隨時間與證據演進，好的定義是會被修正與精進的。而糖類這個看似簡單的分類，其實隱含了豐富的歷史、應用與生命的奧秘。'
