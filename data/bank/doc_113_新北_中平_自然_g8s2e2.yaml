- id: doc_113_新北_中平_自然_g8s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 若想要配製出2M 的木醣醇水溶液400 毫升需要多少g 的木醣醇?
  options:
  - label: A
    content: 121.6g
  - label: B
    content: 124.6g
  - label: C
    content: 123.6g
  - label: D
    content: 127.6g
  group_stem: '素養題組 10~11

    無糖口香糖為什麼吃起來仍有甜味呢？

    主要是因含有木糖醇，分子式為 $C_{5}H_{12}O_{5}$，是一種天然的甜味劑。

    木糖醇因會抑制會易引起蛀牙的轉糖鏈球菌的生長，且本身不易被口腔中的細菌分解產生酸性物質，故不易危害牙齒表面，所以能預防蛀牙；且其甜度與蔗糖相當（約為蔗糖的
    90%），但熱量只有蔗糖的 60%（約 2.4 大卡／克），可被腸吸收代謝養體，因代謝時不需要胰島素就可直接進入細胞，並不會引起血糖快速升高，所以也常被糖尿病患者或減肥族群所使用。

    但過量攝入木糖醇可能會引起腹瀉；此外，木糖醇對狗具有毒性，含木糖醇的東西不可給狗食用。'
  tags:
    chapter:
      publisher: 翰林
      book: 八下
      subject: 理化
      code: 1-2
      title: 反應式與化學計量
      chapter: 第1章 化學反應
    textbook: 八下理化 1-2 反應式與化學計量
    labeled_by: ai
