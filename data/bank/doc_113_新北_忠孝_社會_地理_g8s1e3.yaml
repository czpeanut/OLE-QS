  section: 3
  number: 24
  type: single
  page: 1
  stem: '24.在經歷數十年不同的發展，南北韓在生活出現很大的差異，

    請問下列何項生活方式雙方的差異相對較小？'
  options:
  - label: A
    content: 民主的選舉制度
  - label: B
    content: 強調多元的價值
  - label: C
    content: 重視消費文化
  - label: D
    content: '泡

      菜的飲食習慣。'
  group_stem: '※朝鮮半島自古即位處於中日兩大國文化交流與利益衝突的東亞

    橋梁。二次大戰後，分成南韓和北韓兩個政治制度迥異，相互敵

    對的二個國家，可說是民主與共產兩大陣營對抗的前哨地。近年，

    北韓儘管經濟窮困，糧食不足，卻屢屢用武力威脅美日軍事強權；

    南韓也在經濟上官商緊密合作，力抗美日的大企業，展現一爭長

    短的氣勢。兩國發展差異雖大，但力圖成為強國的企圖心卻極為

    相似！'
  tags:
