  section: 1
  number: 15
  type: single
  page: 2
  stem: 依據上文的內容來判斷，文章的主題最有可能是下列何者？
  options:
  - label: A
    content: 伊斯蘭世界的生活準則
  - label: B
    content: 古希臘的學術成就
  - label: C
    content: 中古教會文化貢獻
  - label: D
    content: 阿拉伯的文明貢獻。
  group_stem: '統治伊斯蘭世界的阿拔斯王朝(西元750〜1258 年)，其前期是伊斯蘭文化發展的黃金階段，當時採取兼容並蓄的文化政策，在帝國境內招攬真才實學的有識之士，讓他們從事各種類型的學術研究，大批古代的重要著作被引進阿拉伯世界。西元830
    年，阿拔斯王朝的統治者為組織全國的翻譯和科學研究機構，下令在首都成立「智慧之家」，廣泛蒐集各種圖書，供學者研究和翻譯，並附設天文臺，可從事天文觀測及研究。「智慧之家」中學識淵博的語言學家，將幾百部典籍翻譯成阿拉伯文，其中包含古希臘著名的哲學家、數學家、醫學家、天文學家的相關著作，保存了古代文化的豐富遺產，更為燦爛的伊斯蘭文化奠定基礎。

    資料來源：高奇(2003。文明的歷程(上)。濟南：山東畫報出版社。'
  answer:
  - D
