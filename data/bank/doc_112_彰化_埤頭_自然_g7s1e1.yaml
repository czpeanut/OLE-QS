  group_stem: '（五）工作細胞

    日本科普動畫「工作細胞」是將人體比擬為一個小型社會，而體內各種型態、功能完全不同的細胞，例如紅血球、白血球、血小板、殺手T細胞等等都被擬人化，連同個性、工作等豐富的設定，塑造出各司其職、努力工作的細胞們，進而衍生出各種科普小故事。

    而這部漫畫其實是作者為了因背誦各種細胞與各種功能、特性而感到苦惱的妹妹而畫的，甚至出了動畫，因而家喻戶曉。

    可愛的紅血球小姐、帥氣的白血球先生、萌萌噠血小板朋友，都是本作品的當家角色，但在真實世界裡，他們的長相就不是如此了，紅血球直徑為 6~8 $\mu\text{m}$，顯微鏡底下像顆甜甜圈，白血球直徑約為
    9-12 $\mu\text{m}$，貌似顆粒煎好的荷包蛋，血小板直徑約為 2~4 $\mu\text{m}$，外型不規則。（改編自 PanSci 泛科學-工作細胞），請回答下列
    26-29 題：'
