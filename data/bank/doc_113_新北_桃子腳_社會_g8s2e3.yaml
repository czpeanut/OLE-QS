  group_stem: '【題組三】請閱讀下文，回答39 題至40 題：

    西亞地區的卡達是世界上人均GDP 最高的經濟體之一，在受到鄰國沙烏地阿拉伯和阿拉伯聯合大公國的制裁背景下，該國的經濟仍在增長。石油和天然氣是卡達經濟的基石，佔政府總收入的70%以上，佔國內生產總值的60%以上，以及大約85%的出口收入。石油的開採為卡達帶來巨大的財富，也因此經濟活動帶來許多就業機會，吸引許多各地民眾前往此區從事相關勞動。'
