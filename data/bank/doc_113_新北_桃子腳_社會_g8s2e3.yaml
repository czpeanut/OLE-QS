  stem: 在中國現代史上曾發生一場「乒乓外交」。1971 年在日本的國際桌球錦標賽─第一天賽程結束後，各隊的專車準備載他們回飯店休息，中國隊上車之後，突然上來一個外國人，原來是美國隊的柯恩上錯車！回飯店的車程大概15
    分鐘，氣氛很尷尬大概有十分鐘都沒人講話，後來中國隊的莊則棟看不下去，決定去找柯恩聊天，還拿禮物送他。據說，毛澤東後來知道這個消息的當下，從床上跳起來大叫：「我的莊爺爺啊！」請問如何解讀毛澤東的反應比較恰當？
