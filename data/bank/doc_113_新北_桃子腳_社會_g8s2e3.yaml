  stem: 行政院衛生福利部依傳染病防治法第三十七條第一項，要求與感染者接觸過的相關人員實行居家隔離。但有人民認為強制隔離之措施違反憲法保障的人身自由權，該法規應屬無效，故聲請大法官釋憲。請問衛生福利部之行為屬於下列哪一個概念？
  options:
  - label: A
    content: 依法行政
  - label: B
    content: 行政救濟
  - label: C
    content: 權力分立
  - label: D
    content: 權力制衡
  group_stem: '【題組五】請閱讀下文，回答49-50 題

    司法院釋字第690 號解釋文

    中華民國九十一年一月三十日修正公布之傳染病防治法第三十七條第一項規定：「曾與傳染病病人接觸或疑似被傳染者，得由該管主管機關予以留驗；必要時，得令遷入指定之處所檢查，或施行預防接種等必要之處置。」關於必要之處置應包含強制隔離在內之部分，對人身自由之限制，與憲法第八條（人民身體之自由應予保障）依正當法律程序之意旨尚無違背。

    曾與傳染病病人接觸或疑似被傳染者，於受強制隔離處置時，人身自由即遭受剝奪，為使其受隔離之期間能合理而不過長，仍宜明確規範強制隔離應有合理之最長期限，及決定施行強制隔離處置相關之組織、程序等辦法以資依循，並建立受隔離者或其親屬不服得及時請求法院救濟，暨對前述受強制隔離者予以合理補償之機制，相關機關宜儘速通盤檢討傳染病防治法制。'
