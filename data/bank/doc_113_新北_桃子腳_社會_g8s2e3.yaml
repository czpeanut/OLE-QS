  group_stem: '【題組二】請閱讀下文，回答37 題至38 題：

    對巴勒斯坦人而言，數百年來橄欖油一直是旅人的禮物、新娘的慰藉、秋天的餽贈、儲藏室的珍藏，還有家族的財富。然而，穆里．巴爾古提離開家鄉三十年，橄欖油不復見，院子裡的無花果樹也早已被砍去。1967
    年6 月5日， 穆里．巴爾古提正在開羅大學考大四最後的期末考，再考兩科他就能畢業。同時，以色列卻對巴勒斯坦開戰了。這場戰爭讓巴爾古提家的人四散各處，一年後才能在安曼（約旦首都）首次聚首。當時沒有人知道，他要再踏上巴勒斯坦的土地，也是30
    年後的事了。

    巴勒斯坦詩人穆里．巴爾古提在外流亡三十年後，1996 年終能回返家鄉，本書《回家：橄欖油與無花果樹的記憶》書寫了他回家與流亡的心路歷程。他在書中寫道：「如今我的定位模稜兩可、含糊不清，一切都模稜兩可、含糊不清。戴著圓頂小帽的士兵也不含糊，至少他的槍可是光可鑑人。他的槍也是我個人的歷史，我離散的歷史。他的槍從我們手上奪走了詩的領土，留給我們領土的詩。他的手中握著領土，我們的手上握著海市蜃樓。」'
