    土地開發優於土地正義──台南鐵路地下化政策從原軌到東移的轉彎關鍵

    2012 年台南市政府進行鐵路地下化的都市計畫時，340戶居住於鐵路東側的居民才知道，他們的土地與房子將被政府永久徵收作為地下化鐵路用地，而非原本的暫時徵用，同年8
    月就成立反台南鐵路東移自救會共323 戶加入，開啟長達8 年的抗爭。最終由交通部鐵道局進行強制拆除。

    自救會的辯護律師簡凱倫說：「鐵路地下化需要工程用地，甚至要伴隨土地開發，這都可以被理解；但整理完資料後發現，政府徵收私人土地，卻是以『土地開發挹注昂貴的工程經費』為優先選擇時，我沒辦法接受，就這樣投入到現在。」

    另一位辯護律師、環保署前副署長詹順貴談起這段過去，他坦言，每次遇到土地正義案件時，都試圖以（甲）的手段希望暫時中止進行中的工程，原因在於，「家園」拆掉就沒了，本案中法官以「南鐵東移案利益衡量並無瑕疵，也沒有違反比例原則」予以駁回。

    「而這也是行政部門的手段之一，交通部鐵道局搶在判決尚未出爐以前，在沒有徵收爭議的仁德區開始開挖動工，當工程都已經進行，就好像生米已經快煮成熟飯，逼著司法只能尊重行政裁量權的結果，」簡凱倫提出他對敗訴的見解。

    ——嚴文廷，《報導者》'
