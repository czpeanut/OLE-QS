  section: 1
  number: 2
  type: single
  page: 1
  stem: 1960 年代是一個社會內部衝突與對抗的年代。在此期間，美國種族衝突日益激烈，黑人民權運動在各地展開；中國則在「革命無罪、造反有理」的口號下，展開一連串的破壞行動；捷克領導人提倡改革，放寬經濟與政治的管制，受到廣大民眾的支持，但「老大哥」嚴厲禁止其改革並加以鎮壓。上文所述的「老大哥」，最可能是下列何者？(104
    會考)
  options:
  - label: A
    content: 蘇聯
  - label: B
    content: 美國
