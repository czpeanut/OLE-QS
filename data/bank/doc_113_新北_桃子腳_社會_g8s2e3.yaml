  stem: 土耳其伊斯坦堡曾是許多歷史名朝的首都，從歷史建築上也可以看見不同的宗教在此交會；其中最具代性的為聖索菲亞教堂。它是在西元六世紀所建築的基督教教堂，在十一世紀基督教分裂時成為希臘東正教的代表。然而在十五世紀時，信仰伊斯蘭教的土耳其人，將它改建成清真寺。二十世紀土耳其共和國為了避免因宗教再發生戰爭，將清真寺改成博物館，提供民眾參觀。到了2020
    年，埃爾多安總統正式宣佈聖索菲亞恢復為清真寺。請問，聖索菲亞的歷史沿革，突顯土耳其哪項地理特色？
