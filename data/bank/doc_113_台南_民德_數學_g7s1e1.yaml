- id: doc_113_台南_民德_數學_g7s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: '下列敘述正確的共有幾項？

    (1) $0$ 沒有相反數。

    (2) 最大的負數是 $-1$。

    (3) 一個數的絕對值必為正數

    (4) 如果 $a$ 是一個負數，則 $\mid a\mid =-a$。

    (5) 在數線上的點，若離原點愈遠，則表示這個數愈大。

    (6) 若 $a$、$b$、$c$ 為任意三個整數，且 $a$、$b$、$c$ 皆不為 $0$，則 $(a-b)-c=a-(b-c)$

    (7) 若 $a$、$b$、$c$ 為任意三個整數，且 $a$、$b$、$c$ 皆不為 $0$，則 $c\div (a-b)=c\div a-c\div b$'
  options:
  - label: A
    content: '3'
  - label: B
    content: '2'
  - label: C
    content: '1'
  - label: D
    content: '0'
  tags:
