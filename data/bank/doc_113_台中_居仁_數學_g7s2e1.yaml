- id: doc_113_台中_居仁_數學_g7s2e1_s2_2
  section: 2
  number: 2
  type: calc
  page: 3
  stem: '《古希臘文選》中記載一道“驢騾相爭”的數學問题。題目如下: 驢和騾肩並肩地在街上走,各自都馱著幾個包裹。驢抱怨主人給他壓的擔子太重,騾卻說: 「老兄,你的負擔並不算重!你瞧,假如從你背上拿一個包裹給我,我的負擔就是你的兩倍;
    而假如你從我背上取走一只包裹,你的負擔也不過和我相同。」 假定每個包裹重量相等,試問:驢和騾各馱著幾個包裹?(3分)'
- id: doc_113_台中_居仁_數學_g7s2e1_s2_3
  section: 2
  number: 3
  type: calc
  page: 3
  stem: '外送員在社會中扮演重要的角色,他們滿足了人們對食品和貨物的便利需求。外送員的收入主 要是以送單的數量與獎勵金為主。有一個外送平臺以外送件數來計薪,且收入每週結算一次,
    以下是此外送平臺的計薪方式: 訂單件數 每件訂單薪資(元) 每件訂單獎勵金(元) 第1件到第150件x 0. 第151件以上(含) x y若帛勳上週共送了250件訂單,領到14000元;梓瑞上週共送了170件訂單,領到8800元,求
    每件訂單的薪資與第151件以上(含)每件訂單的獎勵金。(4分)'
- id: doc_113_台中_居仁_數學_g7s2e1_s2_4
  section: 2
  number: 4
  type: calc
  page: 3
  stem: '一年26班欲舉辦戶外活動,老師建議四個地點:九族文化村、劍湖山、六福村、麗寶樂園,若: (1)想去六福村玩的人數是想去九族文化村的2倍; (2)想去麗寶樂園玩的人數是想去劍湖山的2倍多3人;
    (3)想去六福村玩的人數比想去劍湖山的人數多2人; 已知全班共有42位學生,設想去九族文化村有x人、想去劍湖山有y人, 請問:想去九族文化村、劍湖山、六福村、麗寶樂園的各有多少人?
    (4分) [試題結束] 3'
