  number: 3
  type: fill
  page: 1
  stem: '垣廷、俊夆、禹丞對於「坐標平面上一點 A( 5 ,－4 )」的說法如下，

    垣廷：A 點在坐標平面的第二象限內。

    俊夆：因為｜5｜＞｜－4｜，所以 A 點到 x 軸的距離比到 y 軸的距離大。

    禹丞：從原點出發，向下 4 單位，再向右 5 單位，可到達 A 點。

    請問：誰的說法正確？'
