  stem: '《古希臘文選》中記載一道“驢騾相爭”的數學問题。題目如下：

    驢和騾肩並肩地在街上走，各自都馱著幾個包裹。驢抱怨主人給他壓的擔子太重，騾卻說：

    「老兄，你的負擔並不算重！你瞧，假如從你背上拿一個包裹給我，我的負擔就是你的兩倍；

    而假如你從我背上取走一只包裹，你的負擔也不過和我相同。」

    假定每個包裹重量相等，試問：驢和騾各馱著幾個包裹？(3 分)'
