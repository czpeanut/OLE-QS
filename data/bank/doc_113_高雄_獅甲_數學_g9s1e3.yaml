  page: 2
  stem: '如右圖，已知 $\angle 1=\angle 2$，$\angle 3=\angle 4$。求證：$\overline{AC}=\overline{BD}$。

    證明的過程有下列四個步驟：

    (宜) $\overline{AC}=\overline{BD}$

    (昌) ∵ $\angle 1=\angle 2$，∴ $\angle DAB=\angle CBA$

    (國) $\triangle ABD \cong \triangle BAC$（ASA全等性質）

    (中) ∵ $\angle 3=\angle 4$，$\overline{AB}=\overline{AB}$，$\angle DAB=\angle CBA$

    請問證明的順序應為下列何者？'
  options:
