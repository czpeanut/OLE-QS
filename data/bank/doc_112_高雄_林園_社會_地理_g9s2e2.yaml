  stem: 地理圖二、圖三分別是世界主要基因改造作物種植面積及種植國家比例圖。以下對於基因改造農業的敘述何者正確？
  options:
  - label: A
    content: 基因改造作物種植面積前三名：黃豆、玉米、棉花，也是熱帶栽培業的主要作物
  - label: B
    content: 種植基因改造作物最高的國家，其農業特色是種植多樣性食物以提升單位生產面積
  - label: C
    content: 透過基因改造，使作物具有抗高(低)溫、耐旱、抗蟲害、抗病等特質
  - label: D
    content: 目前的研究已經證明食用基因改造作物對人體有害，我國已立法禁止農民種植基因改造作物
