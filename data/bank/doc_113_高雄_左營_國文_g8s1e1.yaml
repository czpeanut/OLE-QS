  group_stem: "（二）\n一九七四年，北京 東方紅石油化工廠在大葆台一帶勘測，因為這裡適合深層埋藏儲油罐。然而在過程中，一位地質人員發現，土層深處，居然埋有木頭和木炭。\n\
    \  這是不尋常的情形，考古人員馬上前往調查。當富有經驗的專家看到了現場的木炭、白膏泥和銅錢時，馬上就聯想到湖南長沙發現的馬王堆漢墓。白膏泥在大型漢代墓葬中是很常見的，功能就是防滲隔潮。當考古人員挖開夯土層後，又發現了一個奇怪的現象：這的確是古墓，整座墓室是由大量木頭層層壘起，木頭前端向內，形如木牆，南面正中有門。以往還從未發現過這樣的墓葬。而且墓室的木結構，完全採用插木榫和搭扣技術，沒有一根鐵釘，可看出古人高超的建築藝術造詣。\n\
    \  隨著越往下清理，木材越多，讓人驚訝的是，木料在二千多年後還散發著清香。經過清點，這座古墓僅木牆的用材之多，就相當於一座森林。大家對此一時十分茫然，雖然作了種種猜測，仍然沒有找到答案。\n\
    \    當時一位考古人員聽聞後非常興奮，回去之後，他當夜伏案查閱資料，提出大葆台漢墓的結構貌似為「黃腸題湊」，並提供了文獻中有關這方面的記述。「黃腸題湊」，指設在棺槨以外的一種木結構。這一詞出自《漢書．霍光傳》。霍光死後，皇帝賜他「梓宮、便房、黃腸題湊各一具」。它和梓宮、便房、外藏槨等構成了西漢最高級的葬制體系，不是每個人都能享受的，只有帝王、經過「特批」的皇室成員或地位極高的高級官員才能享受到如此安葬的待遇，也有利於棺槨的長期保護，使之不受損壞。\n\
    \  「黃腸」，指材料和顏色是黃心的柏木。這一詞見於顏師古註曰：「以柏木黃心致累棺外，故曰黃腸。木頭皆向內，所以為固也。」「題湊」，指木頭擺放的端頭向內。這一詞始見於《呂氏春秋．節葬篇》：「題湊之室，棺槨數襲，積石積炭，以環其外」，說明早在春秋戰國時期「題湊之制」已出現。「黃腸題湊」合在一起的意思就是指棺槨四周用黃心柏木堆壘起來的框型結構。\n\
    \    考古人員立即請林業專家進行鑒定，得到的答覆是這些木材均為柏木。為此，大家十分高興。這是「黃腸題湊」實物的首次發現，具有很高的學術價值。"
