  stem: 「貞觀十年，太宗謂侍臣曰：『帝王之業，草創與守成孰難？』尚書左僕射房玄齡對曰：『天地草昧，群雄競起，攻破乃降，戰勝乃克。由此言之，□□□□。』魏徵對曰：『帝王之起，必承衰亂，覆彼昏狡，百姓樂推，四海歸命，天授人與，乃不為難。然既得之後，志趣驕逸，百姓欲靜而徭役不休，百姓凋殘而侈務不息，國之衰弊，恆由此起。以斯而言，□□□□。』」根據文意推估兩位大臣的回答，並依照前後順序填入「□□□□」，下列選項何者正確？
