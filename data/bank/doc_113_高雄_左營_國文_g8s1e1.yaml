  group_stem: "（一）\n田家少閑月，五月人倍忙。夜來南風起，小麥覆隴黃。婦姑荷簞食，童稚攜壺漿。相隨餉田①去，丁壯在南岡。\n足蒸暑土氣，背灼炎天光。力盡不知熱，但惜夏日長。復有貧婦人，抱子在其旁。右手秉②遺穗，左臂懸敝筐。\n\
    聽其相顧言，聞者為悲傷。家田輸稅③盡，拾此充飢腸。今我何功德，曾不事農桑。吏祿三百石，歲晏有餘糧。\n念此私自愧，盡日不能忘。              \
    \                                    ——白居易〈觀刈麥〉\n    \n  注釋：①餉田：送飯給在田裡勞動的人   ②秉：拿\
    \   ③輸稅：繳納租稅"
