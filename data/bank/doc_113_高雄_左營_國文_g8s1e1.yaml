    content: 「力盡不知熱，但惜夏日長」指豐收的喜悅足以使農民忘記夏日的漫長與炎熱
  - label: B
    content: 本詩前段描寫農民暑熱割麥的辛苦，後段表達課徵稅賦的嚴苛，屬於古體詩
