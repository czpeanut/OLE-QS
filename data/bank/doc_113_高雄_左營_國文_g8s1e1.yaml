- id: doc_113_高雄_左營_國文_g8s1e1_s3_1
  section: 3
  number: 1
  type: fill
  page: 1
  stem: '（一）

    相見時難別亦難，東風無力百花殘。（     ），（     ）。（     ），夜吟應覺月光寒。蓬萊此去無多路，（     ）。

    （二）

    人生到處知何似？（    ）。（     ），鴻飛哪復計東西？老僧已死成新塔，（     ）。往日崎嶇還記否？（     ）。

    （三）

    （     ），干戈寥落四周星。山河破碎風飄絮，（     ）。惶恐灘頭說惶恐，（     ）。人生自古誰無死？（     ）。


    參考答案：

    春愁黯黯獨成眠   春蠶到死絲方盡   曉鏡但愁雲鬢改   骨肉流離道路中   獨宿江城蠟炬殘   身世浮沉雨打萍

    應似飛鴻踏雪泥   零丁洋裡歎零丁   泥上偶然留指爪   一夜鄉心五處同   蠟炬成灰淚始乾   辛苦遭逢起一經

    留取丹心照汗青   路長人困蹇驢嘶   青鳥殷勤為探看   鶯啼燕語報新年   壞壁無由見舊題   昨夜星辰昨夜風'
