- id: doc_113_高雄_左營_國文_g8s1e1_s4_15
  section: 4
  number: 15
  type: single
  page: 3
  stem: '〈田園之秋選〉中描述一場西北雨的過程，將其過程整理為下方表格，請問選項敘述何者正確？


    | 選項 | 西北雨過程 | 內容 |

    | --- | --- | --- |

    | （A） | 滿天烏雲 | 作者以第一人稱視角，順敘筆法寫一場西北雨，一開始，烏雲的湧動極快，如惡魔、如妖巫、如黑怪，詭譎多變。 |

    | （B） | 雷電交加 | 雖然雷電起初令人匍匐不能起，牛與羊亦驚嚇害怕，但最後人類還是克服恐懼站起來，作者想藉此意象表達人定勝天的理念。 |

    | （C） | 大雨滂沱 | 作者用「水壩洩洪」的雨量之多、「拇指大的雨粒」的雨勢之大，來強調滂沱大雨才是西北雨真正「無敵的大主宰」。 |

    | （D） | 雨過天青 | 全文以類似戲劇及音樂的方式寫作，從序幕起頭，結尾以〈牧羊人之歌〉的聽覺印象，呈現觸覺感官上雨後大地的乾淨涼爽。 |'
  options:
  - label: A
    content: 滿天烏雲：作者以第一人稱視角，順敘筆法寫一場西北雨，一開始，烏雲的湧動極快，如惡魔、如妖巫、如黑怪，詭譎多變。
  - label: B
    content: 雷電交加：雖然雷電起初令人匍匐不能起，牛與羊亦驚嚇害怕，但最後人類還是克服恐懼站起來，作者想藉此意象表達人定勝天的理念。
  - label: C
    content: 大雨滂沱：作者用「水壩洩洪」的雨量之多、「拇指大的雨粒」的雨勢之大，來強調滂沱大雨才是西北雨真正「無敵的大主宰」。
  - label: D
    content: 雨過天青：全文以類似戲劇及音樂的方式寫作，從序幕起頭，結尾以〈牧羊人之歌〉的聽覺印象，呈現觸覺感官上雨後大地的乾淨涼爽。
