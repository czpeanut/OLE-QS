  stem: 關於上文敘述，請問何者有誤？
  options:
  - label: A
    content: MBTI 只能測出一個人的心智傾向和價值觀，卻和智商與能力好壞沒有絕對關係
  - label: B
    content: 文中藉由引用專家的論述，可達到增強文章說服力與加深讀者對內容的信任程度
  - label: C
    content: 「性格」雖可定義為每個人天生的人格特質，但也許會受到環境與自身選擇的影響
  - label: D
    content: 人們可以透過MBTI 了解自己並發掘潛能，因此部分企業也將其納入面試標準之一
  group_stem: "（三）\n    MBTI（Myers–Briggs Type Indicator）是一項性格評量，全稱為麥布二氏心理類型量表，把人的性格分成\
    \ 16 種類型。麥布二氏公司（Myers-Briggs Company）指出，工作者可以透過 MBTI 16 型人格測驗的結果了解自己、發掘人格潛能、改善人際關係；部分企業人資也將此納入面試標準之一。\n\
    \    在 MBTI 測驗中，共有 4 大性格指標：\n     1. 能量態度：外向型（Extraversion）、內向型（Introversion）\n\
    \     2. 處理資訊：實感型（Sensing）、直覺型（iNtuition）\n     3. 決策思維：理性型（Thinking）、感性型（Feeling）\n\
    \     4. 生活方式：系統型（Judging）與彈性型（Perceiving）\n    每位受試者都會從 4 個指標中，得到其中一種傾向，組成特定性格，因此共有\
    \ 16 種（如 INFP、ESFJ 等）。MBTI 測驗結果適用在團隊發展，成員會發現 A 類型性格的人，有可能跟 B 類型性格的思考方式完全不同，需要彼此理解。不過\
    \ 16 型人格、4 大指標的測驗結果都只顯示出「性格傾向」，意即每個人面對指標時的偏好程度，所以可以想成慣用手，慣用右手的人，不代表不會用左手。\n  \
    \  「MBTI 只能測你的心智傾向，評量不出智商、能力好壞，以及價值觀。」百彥國際發展顧問公司創辦人、擁有國際 MBTI 施測師及講師認證的夏瑄澧說明，所謂的心智功能，指的是個人天生的傾向，像是有些人慣用邏輯分析、看到資訊就會蒐集並加以整合；有些人則因為傾向情感而較易受外界影響。\n\
    \    因此，得到結果後，也不應替自己、他人貼標籤，「只是當他處於最自然、最放鬆的狀態，可能還是傾向用感情思考，這就是性格的本質。」夏瑄澧比喻，就好比左撇子在練習後，也能用右手拿筷子，但是遇到危機，本能還是會使用左手。\n\
    \    「性格」可定義為我們天生的人格特質，但卻會受到環境與自身選擇的影響。故MBTI 測驗的結果並不希望讓人們認為所謂性格會完全二分的極端想法。總結來說，MBTI\
    \ 16 型人格測驗是一套輔助工具，使人們更了解自己的傾向，以及其他人的心智功能、思維模式。透過分析，它也可以幫助團隊優化溝通，彼此更加理解。"
  shared_asset: g5_31_32
