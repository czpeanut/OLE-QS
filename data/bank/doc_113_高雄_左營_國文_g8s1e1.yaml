- id: doc_113_高雄_左營_國文_g8s1e1_s4_9
  section: 4
  number: 9
  type: single
  page: 2
  stem: 《古詩十九首》非一時一人所為，一般認為創作於東漢末年。內容多寫夫婦朋友間的離愁別緒和士人的徬徨失意，有些作品表現出追求富貴和及時行樂的思想。語言樸素自然，描寫生動真切，在五言詩的發展上有重要地位。下列古詩文旨，何者與〈迢迢牽牛星〉最為接近？
  options:
  - label: A
    content: 人生非金石，豈能長壽考？奄忽隨物化，榮名以為寶
  - label: B
    content: 何不策高足，先據要路津。無為守貧賤，坎坷長苦辛
  - label: C
    content: 生年不滿百，常懷千歲憂。晝短苦夜長，何不秉燭遊
  - label: D
    content: 還顧望舊鄉，長路漫浩浩。同心而離居，憂傷以終老
  lesson_raw:
    title: 迢迢牽牛星
    basis: 題幹討論〈迢迢牽牛星〉與《古詩十九首》
- id: doc_113_高雄_左營_國文_g8s1e1_s4_10
  section: 4
  number: 10
  type: single
  page: 2
  stem: 關於〈下雨天，真好〉一文，下列敘述何者正確？
  options:
  - label: A
    content: 本文旨在抒發作者童年時的快樂以及多年後返回家中時近鄉情怯的情感
  - label: B
    content: 以「雨天」為背景、「真好」為主軸，寫幼時閒居之樂，展現作者爛漫天真的情懷
  - label: C
    content: 「母親一邊做飯，一邊聽（鼓詞兒），淚水掛滿了臉頰」表達母親對遠行父親的想念
  - label: D
    content: 文末「下雨天，我有一股淒涼寂寞之感」抒發作者生活孤單，心中苦樂無人可訴的悲傷
  lesson_raw:
    title: 下雨天，真好
    basis: 題目探討課文〈下雨天，真好〉
- id: doc_113_高雄_左營_國文_g8s1e1_s4_11
  section: 4
  number: 11
  type: single
  page: 2
  stem: 關於〈迢迢牽牛星〉一詩的敘述，下列選項何者錯誤？
  options:
  - label: A
    content: 以天上牛郎、織女兩星被銀河隔絕一事，含蓄抒寫相思的戀人，卻必須忍受長期分離的痛苦
  - label: B
    content: 此詩善用疊字增加節奏感與音律之美，反覆吟詠，且全詩極富想像力，充滿濃厚的浪漫氣息
  - label: C
    content: 此詩採用先敘事後寫景再抒懷的布局方式書寫，有兩組對偶句，出現在全詩開頭的一到四句
  - label: D
    content: 「終日不成章，泣涕零如雨」為全詩轉折處，探究不成章的原因，引出末四句心有所思的傷懷
  lesson_raw:
    title: 迢迢牽牛星
    basis: 題目探討課文〈迢迢牽牛星〉
