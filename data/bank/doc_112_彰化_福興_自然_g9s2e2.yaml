- id: doc_112_彰化_福興_自然_g9s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 臺灣的原住民們的傳說中，有著許多與大洪水相關的傳說，常會有許多以祭品來祈求全族平安或是該年的豐收相關的習俗。瑪雅是一位阿美族的原住民，請問她不可能會聽到哪些關於洪水的描述？
  options:
  - label: A
    content: 雪霧姊姊：「有一次下了很長時間的大雨，以至於溪水暴漲，將山坡都淹蓋了，而所有人都逃到山頂上，才逃過一劫。」
  - label: B
    content: 常功哥哥：「還記得那天晚上下大雨滂沱，不一會兒就讓住在平地上的我見到水鄉澤國，幸好，我們的高腳屋撐住了。」
  - label: C
    content: 阿怪叔叔：「當年的我在洪水來臨期間隻身游泳過洪水，前往其他地方尋求援助，讓村裡的人們能夠倖存下來。」
  - label: D
    content: 楊姥姥：「我年輕時，屋外放眼望去滿是一片汪洋，當時和隔壁村的小冬姐姐用鴿子傳遞訊息互報平安呢！」
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
