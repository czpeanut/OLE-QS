  - label: D
    content: 甲＝乙＝丙
  group_stem: '洋流攜帶大量海水和熱量，日復一日調節著全球氣候。洋流的流動受到風向與溫度的影響，赤道附近的海水受熱膨脹因而密度較低，高緯度的海水受寒收縮因而密度較高，因而產生水平與垂直方向的流動。

    依其洋流本身以及周旁海域的溫度差異又可以分為寒流和暖流，暖流增加溫度和濕度，寒流降低溫度和濕度。臺灣附近的洋流隨季節有所不同，也為臺灣氣候帶來不同影響。

    科學家相信，溫室效應加劇全球暖化，在冰川大規模融化後，大量冰冷淡水流進海裡，海洋輸送系統必定也產生變化，大氣溫度變化與洋流的交互作用，恐使未來極端氣候更形嚴重。試回答下列問題：'
