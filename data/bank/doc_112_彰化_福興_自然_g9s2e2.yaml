- id: doc_112_彰化_福興_自然_g9s2e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: '煤炭為很久以前植物的遺骸所組成，而植物會進行光合作用，將空氣中的二氧化碳吸收轉化為生物化學能儲存起來，這也就是煤炭可以作為能源的原因。下列為四位同學針對「若人類大量使用這些煤炭作為能源，則會使空氣中二氧化碳與氣溫產生甚麼變化」的回答，何者正確？

    小明：很久以前植物吸收的二氧化碳重新釋放到大氣中，大氣中二氧化碳增加。

    小鄭：用掉許多煤炭，所以植物會吸收更多二氧化碳來彌補煤炭消耗，大氣中二氧化碳減少。

    小華：用掉許多煤炭，代表把儲存在地層中的古老太陽能都釋放出來，大氣溫度將會上升。

    小皮：煤炭產生的能源我們用在蒸汽火車的前進動能上，所以大氣溫度不會上升。'
  options:
  - label: A
    content: 小明、小華
  - label: B
    content: 小明、小皮
  - label: C
    content: 小鄭、小華
  - label: D
    content: 小鄭、小皮
