- id: doc_112_桃園_石門_國文_g8s2e2_s4_32
  section: 4
  number: 32
  type: single
  page: 3
  stem: 依據本文，這張圖中的位置何者聽覺體驗最好？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
  group_stem: '（四）

    科普一下選座技能！

    挑選座位最保險的選擇，是在音樂廳內一樓距離舞臺約三分之二遠，或者二、三樓的前排座位，且中間為佳，要想獲得最好的聽覺體驗，需要買樓上的位子。一般人都嫌棄的樓上，其實聲音聚合效果最好。聲音是往上走的，樓上的座位會聽到更清晰的聲音。真正的音樂會好位子應該是後排和樓上中央，編制越大的曲目可以越往後往上坐，聲音絕對比較好。聽鋼琴演奏的選座也有學問，鋼琴最美的聲音是從尾端發出的，一般鋼琴的位置擺放，演奏者在左琴蓋的打開方向朝右，所以聽鋼琴演奏時音樂廳右邊座位的聲音比左邊的好，樓上右側比樓下右側的好。

    每個音樂廳的特點不同，不同的音樂廳也有不同的聽覺感受，大劇院稍往前坐，小劇院稍往後坐，一般來說沒有壞的座位，只有好和更好的座位。（改寫自〈聽音樂會，你會選座位嗎？最貴就是最好的？〉）'
