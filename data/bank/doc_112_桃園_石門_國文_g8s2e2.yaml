  group_stem: '（二）

    元豐二年，中秋後一日，余自吳興來杭，東還會稽。龍井有辨才大師，以書邀余入山。比出郭，日已夕，航湖至普寧，遇道人參寥，問龍井所遣籃輿，則曰：「以不時至，去矣。」是夕，天宇開霽，林間月明，可數毫髮。遂棄舟，從參寥策杖並湖而行。出雷峯，度南屏，濯足於惠因澗，入靈石塢，得支徑上風篁嶺，憩於龍井亭，酌泉據石而飲之。自普寧凡經佛寺十五，皆寂不聞人聲。道旁廬舍，或燈火隱顯，草木深鬱，流水激激悲鳴，殆非人間之境。行二鼓，始至壽聖院，謁辨才於朝音堂，明日乃還。

    【註】1 所遣籃輿：可供遣使的竹轎。2 不時至：沒有按時到達。 3 激激：水勢湍急的樣子。

