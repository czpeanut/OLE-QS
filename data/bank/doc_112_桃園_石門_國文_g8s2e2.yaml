  group_stem: '（五）

    走進美髮店裡，叮叮噹噹的風鈴聲迴盪在偌大的空間裡，午後沈悶的熱空氣，讓許多愛美的太太小姐們還未進門，店裡錯落的放置著幾盆綠色的植物，沖淡了幾許暑意，被安置在靠窗的一個位置，一位看來不過二十歲的少女，立刻拿著毛巾走來，熟練的在肩膀上來回按摩，並低下頭來問：「好嗎？」這原不過是一句再平凡不過的話，竟帶給我微微的震撼。原來少女雙耳自幼失聰，在自知無法順利求學後，便前往職訓中心習得一技之長，但儘管功夫再好，卻因失聰的緣故始終無法獲得老闆的重用，幾經流離，終於碰到愛才的新老闆，安定了下來。其它的少女，故事也大約是相同的。在與老闆聊天的過程中，幫我洗頭的少女一直沈浸在自己的歌聲中，外面的世界似乎與她並沒有太大的關係，由於失聰，少女的語音學習與一般人的發音有些出入，一時之間，我無法確切的聽出她到底在唱些什麼？開玩笑的和老闆說，已經好久沒看電視了，竟然聽不出來她到底在唱什麼歌？沒想到，老闆竟說：「你當然聽不出來，因為她唱的是山地歌啊！」我被這出乎意料之外的答案給楞住了，直覺的就問：「她是原住民嗎？」老闆傻傻地笑著說：「對啊！她說她是花蓮來的，好像是什麼阿美族的樣子。」我定下心來，想要仔細地聽聽她到底在唱些什麼？經過了約莫五分鐘的時間，我隱約地聽到她這樣唱著：「我的家鄉在大海邊，海浪準時每天敲門，海鷗學我唱歌，我是個快樂的阿美族！」少女的臉上洋溢著幸福的微笑，聽著聽著，不覺中也感染了歌聲中的思鄉之情。我試著與少女溝通，手勢加上文字，知道她是從遙遠的花蓮豐濱來的，小時候家就與大海比鄰，每天起床睜眼看到的就是亮晃晃的海平線，那幾乎快要成為兒時的惟一印象了。因為自出生即失去聽覺，她一直生活在無聲的世界中，直到快五歲才知道人是會說話的，社會對於生理有缺陷的人往往是殘酷無情的，少女在成長的過程中，無可避免的也遭受不少的打擊與挫折，「幸好我有個像海一樣的媽媽，她的心就如同我每天起床看見的海平線，沒有邊界，她為了要教我說話，每天都很辛苦的張大嘴巴講話，就是為了要讓我看清楚嘴形，有一次還因為太用力而下巴脫臼。」這短短的幾句話，她花了將近十分鐘的時間才清楚的讓我明白她在說些什麼，看著她因緊張、用心而微微出汗的臉，我已經沒有勇氣再與她繼續交談，拿來筆在紙上寫著：「我是屏東的排灣族。」少女睜著驚訝的雙眼，好不容易擠出了一句話：「除了阿美族以外，就是排灣族的歌最好聽了。」但她不是失聰嗎？換我出現了迷惑的表情，她立刻看出了我的質疑，辛苦的解釋：「是媽媽告訴我的，她常常唱歌給我聽，雖然我聽不到，但是我widget我知道媽媽唱歌的時候很快樂，看久了我的心情也會很好，所以我相信時常唱歌的人一定是很快樂的人，就像我們部落每年豐年祭時，全村的人都會在一起唱歌、跳舞，世界上還有誰會比豐年祭的阿美族更快樂呢？」阿美族是個快樂的民族，所有的煩憂似乎都可以在輕快的歌聲中一一淡化，失聰的少女雖然聽不到這個社會中其它紛擾的聲音，但是亙古以來的阿美族歌聲，在她的母親灌輸下，已深深植入少女的耳膜中，在毫無雜音的聽覺世界中，快樂的阿美歌聲必定是美麗又清澈的吧！
    （節錄自利格拉樂﹒阿𡠄〈愛唱歌的阿美少女〉）'
