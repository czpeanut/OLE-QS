- id: doc_113_台中_大業_社會_歷史_g8s2e3_s2_21
  section: 2
  number: 21
  type: single
  page: 4
  stem: 請問閱讀資料中的○○指的是什麼意思？
  options:
  - label: A
    content: 六四
  - label: B
    content: 五四
  - label: C
    content: 八九
  - label: D
    content: 七一。
  group_stem: '請依據閱讀資料回答下列第21~24 題：

    香港維多利亞公園（維園）從1990 年開始，每一年的這一天都會舉行燭光紀念晚會，與「七一遊行」同為香港最大規模的兩個集會活動。不過自2019 年反送中運動爆發、到2020
    年港版國安法正式上路後，此類集會已經變成港府重點打擊的目標，嚴禁各類「違法集會」發生。

    過去長年舉辦○○遊行和晚會的香港支聯會，被港府控「煽動顛覆國家政權罪」，最後迫於形勢而在2021 年解散，支聯會副主席鄒幸彤也被拘捕。隨著港版國安法的實施，累積30
    年的維園紀念晚會已不復存在，時至2025 年的這5 年間，每到○○的時候，維園還會加派警力巡邏，以防止有人「違法紀念」——但什麼樣的行為允許？什麼行為算違法？就連看似平凡的日常生活舉止，在這一天於這個地點，都有可能變成「破壞社會安寧」。

    以今年為例，港警仍部署了相當的警力於銅鑼灣維園一帶，而維園從6 月1 日開始就變成「家鄉市集嘉年華」的場地，一路辦到6 月5 日，但是在場地已移作他用的情形下，仍有一些零星的民眾自行發起紀念的行動。在香港的社群網路上，可以看到有學生手持白花行經維園、還有人直接身穿「平反○○」與民主女神圖樣的上衣，結果都被警方盤查後帶上警車。

    香港《獨立媒體》在維園也發現，有民眾當日冒著雨天，坐在維園噴水池附近的長椅上讀聖經，並且向記者表示「上帝一定是公義的」、「相信沒有人忘記」。另一位「張女士」則是在維園裡吃香蕉，根據《獨立媒體》採訪的說法，這位只是吃香蕉的女士後來也被港警上前盤查搜索、查驗其身分資料。張女士向《獨立媒體》表示：「吃香蕉啊，吃香蕉也不行？」張女士補充說明「香蕉容易消化，沒有特別意圖」，並且因為老人家消化不良的關係，需要「用36
    分鐘去食完一條蕉」。後來張女士說，警方查完她的身份後有「給她一個空間食蕉」。

    雖然「食蕉」一語在香港粵語中也有罵人之意（也可指發音近似的「保安」、或罵人食屎的粗口），但很難斷定張女士的用意為何，不過「用36 分鐘吃香蕉」說法，可能讓人聯想到今年的○○事件36週年。只是在現今嚴禁各類具有政治意涵活動的香港，光是吃香蕉也能被警方盤查，已是相當荒誕的社會現實。

    其他在維園活動的民眾也遭遇到類似的對待。根據《BBC》的報導，有店家因販售電子蠟燭，同樣被警方上門關切施加壓力；一名身穿黑衣的男子配戴「香港加油」字樣的口罩，晚間於銅鑼灣附近遛狗時也被警方帶走。另外是晚上9
    點多左右，一位男子身穿「社會主義核心價值觀」簡體字樣上衣出現於維園，隨即被駐守的港警包圍，男子和警方發生口角衝突，現場甚至拉起封鎖線，最後該名男子仍在大批警力包圍下被帶走。

    節錄自，〈吃香蕉有事、身穿社會主義核心價值被捕〉，轉角國際，2025/06/05'
