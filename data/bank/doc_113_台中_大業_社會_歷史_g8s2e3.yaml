- id: doc_113_台中_大業_社會_歷史_g8s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 相比於新冷戰情勢，請問歷史上最初的冷戰局勢是在何時展開的？
  options:
  - label: A
    content: 韓戰過後
  - label: B
    content: 越戰爆發
  - label: C
    content: 第一次世界大戰後
  - label: D
    content: 第二次世界大戰後。
  group_stem: '請依據閱讀資料回答下列第4~6 題：

    2024 年，中國同時追求兩個相互矛盾的目標。習近平將與其他共產黨國家尋求結盟機會，共同對抗以美國為首的世界秩序，迎接分裂時代與強權爭鳴的競技場，但對外依然會營造國際團結捍衛者的形象。

    為了實現第一個目標，中國領導人將會指責美國與其盟國煽動「新冷戰」，藉機將西方國家擠出全球舞台中心。這番批評的背後存在經濟因素。隨著全球與中國內部的經濟成長趨緩，北京當局將把矛頭指向美國和西方富國，抨擊他們築起保護主義壁壘，不僅阻礙自由貿易，還牽制全球化的未來發展。

    節錄自，〈2024 中美新冷戰 習近平的兩大盤算〉，天下雜誌，2023/12/10。'
