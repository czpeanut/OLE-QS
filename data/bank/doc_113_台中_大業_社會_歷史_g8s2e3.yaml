    新加坡舉辦的年度亞太安全峰會——香格里拉對話（Shangri-La Dialogue）5 月30 日如期登場，再度吸引全球目光。這場由英國智庫「國際戰略研究所」（IISS）主辦的防務論壇，匯聚亞太地區及全球主要國家的國防高官、學者與媒體，聚焦區域安全議題，與德國慕尼黑安全會議並列為全球兩大安全論壇。

    首次參加對話的美國國防部長赫格塞斯（Pete Hegseth）明確指出，中國對台灣構成「迫在眉睫」的威脅，更首度在會中以「共產中國」稱呼北京。有分析認為是美國代表在香格里拉對話史上「最強硬」的發言，彰顯川普（Donald
    Trump）政府意欲重建美國在亞太領導地位的意圖。不過，美國智庫大西洋理事會（Atlantic Council）研究員宋文笛向《BBC》向記者解釋，中國軍方高層的缺席，使本屆香格里拉對話成為赫格塞斯的獨角戲。

    中國問題專家葛來儀（Bonnie Glaser）認為，赫格塞斯的發言是歷任美國國防部長在香格里拉對話中最強硬的演說。她說，發言送出主要訊息：「川普希望透過實力達成和平，強化區域行動，以確保其任內不會發生中國動用武力的情形。」

    對此，奈吉（Stephen Nagy）教授認為，白宮正試圖集中美國及其盟友的戰略思維、外交資源與嚇阻能力，維護台海和平穩定。「目標是團結盟友與台海和平穩定的潛在支持者，集中所有資源，勸阻中國對台灣採取任何挑釁行動。」他告訴《BBC》。

    新加坡《聯合早報》指出，美中競爭的激烈程度，從赫格塞斯的發言可見一斑。赫格塞斯刻意將「中國」與「中共」作政治區隔，採取充滿意識形態的論述，「無疑會被北京視為充滿敵意」。

    換言之，赫格塞斯的演說將中國塑造成區域安全的首要挑戰，試圖凝聚盟友共識，特別是在日本、澳洲及菲律賓等國之間建立更緊密的防務合作。赫格塞斯發言表示：「在川普的領導下，美國致力以『實力換和平』的戰略維護國際安全，這是我們對全球、特別是印太地區的基本承諾。」因此，有分析認為，這反映川普對中國政策的轉向，試圖透過公開喊話，重申美國在印太地區的領導地位，並鞏固與盟友的合作關係。

    奈吉教授同意，台北需持續增強國內威懾能力，並創造性地融入國際機構，無論是世界衛生組織、世界貿易組織，或《全面與進步跨太平洋夥伴關係協定》（CPTPP）等大型貿易協定。透過正式或非正式方式將自身錨定於國際機構，台灣可使其命運對國際社會至關重要。「台灣位於第一島鏈，對維持和鞏固美國在印太地區的影響力至關重要，同時確保強勢的中國無法部署其潛艇和其他海軍能力，從而將美國排除在外，成為區域霸主，」他說。

    面對赫格塞斯與馬克宏對中國威脅的強烈言論，東協國家在2025 年香格里拉對話中保持相對沉默，分析稱背後蘊含深刻的戰略考量。奈吉教授向《BBC》表示，若赫格塞斯的目標，是團結盟友及台海和平穩定的潛在支持者，集中資源勸阻中國對台灣採取挑釁行動，這不太可能受到東協多數國家的歡迎。「因為它們不願激怒中國，或對美國表現任何形式的順從。但這或許會受到日本等國的歡迎，因為這些國家認為台灣的突發事件將直接對其安全產生負面影響。」

    事實上，東協長期以「非對抗」與「中立」為核心原則，致力在美中競爭中維持平衡，避免選邊站隊。例如，越南引以為傲的「竹子外交」（bamboo diplomacy），以靈活姿態遊走於美中博弈之間，維護河內的最大利益。

    節錄自，〈香格里拉對話後的疑問〉，BBC NEWS 中文，2025/06/06。'
