  group_stem: "請依據閱讀資料回答下列第25~27 題：\n不同地方的人對這場戰爭有著不同的記憶。在大多數甲國人記憶中，它是一場發生於一九六○～一九七○年代的戰爭，讓想要阻止共產黨向東南亞進軍的甲國軍隊深陷泥潭，與此同時深深割裂了甲國社會。\n\
    \    乙國的人記得的是，他們在一場歷時十載的衝突中失利，當時他們竭力想要保住其殖民帝國中的亞洲明珠，直到西元1954 年在一個叫奠邊府的地方敗北。\n\
    \    越南人則把它視為民族解放鬥爭或者內戰——至於究竟是什麼，要看他們處於哪一個陣營——在西元1975 年以一個陣營贏得勝利、另一個陣營遭逢不幸告終。但對越南人來說，它首先是一場跨越了30\
    \ 年的衝突，把種種直接或間接的對抗變成了殘酷的戰火，奪去了超過300 萬越南人的生命。"
