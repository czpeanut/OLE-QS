  stem: 根據資料一的說法，農民能夠從事「政府不管的行業」，致力生產水產與水果，與中國大陸推行的哪一項政策有關？
  options:
  - label: A
    content: 推行人民公社
  - label: B
    content: 進行土地改革
  - label: C
    content: 放寬市場管制
  - label: D
    content: 開放外國投資。
  group_stem: '請依據閱讀資料回答下列第1~3 題：

    資料一：農村這幾年成長最快的是水產業和水果業，這恰恰是我們計畫經濟沒計畫，政府基本不管的行業。

    資料二：以前，北京的老百姓為了大白菜天天排隊，由政府配發。但現在幾個批發市場一搞，大白菜緊缺排隊的現象就消失了。

    資料來源：恆豐資本研究院。鄧小平南巡講話。'
