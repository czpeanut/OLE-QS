  group_stem: '請依據閱讀資料回答下列第19、20 題：

    一位學者評論：「在朝鮮戰爭爆發後，中國國內也出現了社會動亂的因素。經歷多年內戰後經濟上百廢待興尚無恢復；社會出現動亂，地方上的國民黨殘餘勢力和土匪等紛紛起來搞破壞和暗殺行動；臺灣蔣中正也宣布要反攻大陸，整個政權處於危機之中。」在此情勢之下，中華人民共和國乃組成「中國人民志願軍」前往朝鮮半島參戰，許多人因此客死異鄉。

    資料來源：立行，BBC 中文網記者，〈分析：抗美援朝和志願軍的歷史爭議〉。'
