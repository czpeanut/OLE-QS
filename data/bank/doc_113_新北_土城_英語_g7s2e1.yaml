- id: doc_113_新北_土城_英語_g7s2e1_s6_37
  section: 6
  number: 37
  type: single
  page: 3
  stem: What color is the newborn dogs’ eyes?
  options:
  - label: A
    content: Blue.
  - label: B
    content: Gray.
  - label: C
    content: White.
  - label: D
    content: Brown.
  group_stem: 'Look at these amazing dogs! Some dogs have two

    different colored eyes. One eye might be brown, and the

    other eye is blue or gray. This is very special and beautiful!

    When dogs are born, their eyes are brown. Later, some

    dogs’ eyes can change to blue or gray. But sometimes,

    melanin doesn’t go into both eyes, and only one eye

    changes color. The other eye stays brown.

    These dogs with two different eye colors are called

    heterochromatic dogs. We often see this in Huskies,

    Australian Shepherds, and other white dogs.

    Dogs with two different colored eyes are normal and

    healthy. They can see just fine and never worry about them.


     might 可能 change 改變 stay 保持 call 稱為'
