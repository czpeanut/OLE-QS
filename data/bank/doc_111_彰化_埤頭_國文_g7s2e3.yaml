  group_stem: "寒號蟲\n    五臺山有鳥，名寒號蟲。四足，有肉翅，不能飛，其糞即五靈脂。當盛暑時，文彩絢爛，乃自鳴曰：「鳳凰不如我。」比至深冬嚴寒之際，毛羽脫落，索然如穀雛，遂自鳴曰：「得過且過。」\n\
