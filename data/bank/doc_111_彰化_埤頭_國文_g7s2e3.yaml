- id: doc_111_彰化_埤頭_國文_g7s2e3_s2_41
  section: 2
  number: 41
  type: single
  page: 3
  stem: 上文中，「極盡草率之能事」指的是什麼情況？
  options:
  - label: A
    content: 各行各業中不少人做事業非常苟且
  - label: B
    content: 各行各業的人盡力去完成他們的工作
  - label: C
    content: 工人把工作一肩挑起，盡了他最大的力量
  - label: D
    content: 機械、美術、航海、農業、法律等行業的人工作特別草率
  group_stem: "正確的生活  愛默生\n    我觀察一個人是不是快樂的方式，就是當我問到何謂成功，他會從工作中找，而不是從市場、他人的意見或恩惠中找到答案。而在各行各業，像是機械、美術、航海、農業和法律等行業中，都有為數不少的人只是像我們所說的，對工作敷衍了事，或是只要能勉強交差就可以，他們可以極盡草率之能事；也有些人把工作一肩挑起──他們熱愛工作、樂見工作妥善完成，而且是為了自己而盡力完成工作。人們常把勝利看作是一件幸運的事。工作就是勝利，只要工作完成，就能得到勝利。"
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
  tags:
    textbook: 七下 第九課 謝天
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 七下
      subject: 國文
      code: 第九課
      title: 謝天
