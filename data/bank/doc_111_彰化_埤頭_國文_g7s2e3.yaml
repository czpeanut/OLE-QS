  stem: 「商代人只在上、下午各吃一餐,因為農業社會耕作頗費體力,早上剛好補充精力,下午因太陽西下,無法再工作,不如早點起息,故不必吃得多。春秋晚期以來,隨著牛耕鐵器的廣泛使用,尤其是戰國時代鐵器的普及,生產力大大提高。社會的面貌發生了很大的變化,人們的生活內容漸漸豐富起來,許多人開始在夜間從事非生產性的工作,富人娛樂活動增加,便多一餐以補充體力。」根據這段文字,古代人從兩餐變成三餐的原因,與下列何者最不相關?
