  stem: 鋼琴家波奇，有一次在美國 密西根州的福林特演奏。當他面臨出場的一刻，才發現在座人數不到五成。他真的很失望，但他知道不能夠讓這場失望的情緒影響演出。於是他走向舞臺，向觀眾一鞠躬，然後對著觀眾說：「福林特這個城市一定很有錢！」觀眾紛紛好奇看著波奇，稍作停頓之後，波奇繼續說：「我看到你們每個人都買了三個座位的票！」請根據本文內容，選出與其主旨相同之選項。
