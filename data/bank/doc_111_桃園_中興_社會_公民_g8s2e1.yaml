  stem: 停車場業者以告示牌「公開明示」不同時段的停車費率，此即強調契約訂立的哪項原則？
  options:
  - label: A
    content: 消滅時效
  - label: B
    content: 公平正義原則
  - label: C
    content: 誠實信用原則
  - label: D
    content: 權利禁止濫用原則
  group_stem: '高雄市一間民營停車場原收費標準為「停車一小時80 元，平日沒有提供最高停車優惠，假日最高收費120 元。」蔡先生計畫在春節假日停5 天，停車費共600
    元，是他可接受的停車價格。

    但在春節前幾天，業者變更費率計算，改為「停車一小時80 元，平日最高收費200 元，假日沒有提供最高停車優惠。」蔡先生沒注意到費率更改，於是按照原定計畫在春節期間停車，停了近5
    天約116 個小時，等到繳費時，才發現停車費居然高達9,280 元。

    高雄市停管處經查，業者更改的內容，並沒有違規情況，呼籲消費者停車前，不要只看到價格而忽略文字訊息，要睜大眼睛看仔細，不然驚人的停車費，還比月租貴上好幾倍。

    （資料來源：改寫自好貴？ 停車費5 天收9280 元，車主繳費嚇壞，東森新聞，2022/02/14。）'
