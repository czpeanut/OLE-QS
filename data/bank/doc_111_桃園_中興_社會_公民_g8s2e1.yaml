  stem: 若買家惡意大量反覆退貨的棄單行為，導致賣家有運費損失或商品價值毀損損害，賣家可要求買家如何負起法律責任？
  options:
  - label: A
    content: 請求賠償運費損失及價值損害
  - label: B
    content: 強迫買家購買商品
  - label: C
    content: 要求商品價格10 倍的賠償金
  - label: D
    content: 無法請求賠償
  group_stem: '網路購物方便，手指一點就能輕鬆下單，但事後反悔，不願付款，損失卻讓賣家扛。律師說明，對於這樣的棄單行為，可依循民法解決。若賣家因惡意棄單有運費損失等，可向買家請求賠償損害。賣家已出貨，但買家不領取，導致商品或餐點被退回，可要求賠償運送及保管費用；若買家超時仍不取貨、遲延給付等，賣家可解除契約，並要求買家賠償在解除契約之前，已發生的運費或價值毀損損害。

    （資料來源：改寫自代購下單「惡意棄標」挨告，律師：恐構成詐欺，TVBS 新聞網，2019/10/24。）'
