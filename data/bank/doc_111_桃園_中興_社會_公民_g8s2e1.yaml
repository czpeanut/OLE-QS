  group_stem: '住宅租賃契約書

    立契約書人出租人陳志明,承租人李春嬌,茲為住宅租賃事宜,雙方同意本契約條款如下:

    第一條 租賃標的

    租賃住宅標示:

    1、門牌:桃園市中興好棒路1 號。

    2、車位:有。

    第二條 租賃期間

    租賃期間自民國 112 年1 月1 日起至民國112 年12 月31 日止。

    第三條 租金約定及支付

    承租人每月租金為新臺幣 5000 元整,每期應繳納 1 個月租金,並於每月 1 日前支付。

    第四條 違約金約定及返還

    違約金由租賃雙方約定為1 個月租金,金額為5000 元整。出租人或承租人若沒有第六條及第七條原因提前解約,需賠償違約金。

    第五條 租賃期間相關費用之支付

    租賃期間,使用租賃住宅所生之相關費用如下:

    (一)管理費:由承租人負擔。

    (二)水費:由出租人負擔。

    (三)電費:由承租人負擔。

    第六條 出租人提前終止租約

    租賃期間有下列情形,出租人得提前終止租約,且承租人不得要求賠償第四條之違約金:承租人遲付租金之總額達二個月之金額。

    第七條 承租人提前終止租約

    租賃期間有下列情形,承租人得提前終止租約,且出租人不得要求賠償第四條之違約金:承租人因疾病、意外產生有長期療養之需要。

