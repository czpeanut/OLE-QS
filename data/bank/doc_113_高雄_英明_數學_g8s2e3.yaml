- id: doc_113_高雄_英明_數學_g8s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 如圖，已知 $\angle ABC$，下列四種作圖方式中，何者無法作出一平行四邊形？
  options:
  - label: A
    content: 過 A 作一直線 L 平行 $\overline{BC}$，且在 L 上取一點 D，使得 $\overline{AD} = \overline{BC}$，則
      ABCD 為平行四邊形
  - label: B
    content: 連接 $\overline{AC}$，過 B 作一直線 $L \perp \overline{AC}$，且交 $\overline{AC}$
      於 O 點，並在 L 上取一點 D，使得 $\overline{BO} = \overline{DO}$，則 ABCD 為平行四邊形
  - label: C
    content: 過 A 作一直線 L 平行 $\overline{BC}$，過 C 作一直線 M 平行 $\overline{AB}$，設直線 L 與 M
      相交於 D 點，則 ABCD 為平行四邊形
  - label: D
    content: 連接 $\overline{AC}$ 並取 $\overline{AC}$ 中點 O，作一直線 BO 並在直線 BO 上取一點 D，使得
      $\overline{BO} = \overline{DO}$，則 ABCD 為平行四邊形
  assets:
