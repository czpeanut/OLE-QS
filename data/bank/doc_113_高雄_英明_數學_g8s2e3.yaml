- id: doc_113_高雄_英明_數學_g8s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '帥哥輝想在花園中，圍出一塊土地種玫瑰花，他以自己的位置為中心找出與他等距的甲、乙、丙三點，並測量此三點間的距離，紀錄如表。表中有部分為水漬所弄髒，使得丙到甲的距離無法辨識。已知弄髒的部分為一整數，則此數字可能是下列哪一個？


    | | 甲到乙 | 乙到丙 | 丙到甲 |

