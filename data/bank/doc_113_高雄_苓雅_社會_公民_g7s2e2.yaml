- id: doc_113_高雄_苓雅_社會_公民_g7s2e2_s1_42
  section: 1
  number: 42
  type: single
  page: 1
  stem: 颱風季節即將來襲，連日的豪大雨可能導致水患發生，臺南佳里區的社區與政府相關單位一同辦理防災演練。由於天災可能來得又快又急，在政府趕來救災之前，民眾必須立即做出反應，以避免生命財產受到損害。在這次演練期間，社區成員透過編組接受警員、消防隊員的指導，學習自主防災應變作為，並認知到「自己的家園須由自己來保護」的重大使命。根據上文，關於參與演練的社區，下列敘述何者最為合理？
