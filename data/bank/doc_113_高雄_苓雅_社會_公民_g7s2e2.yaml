  section: 1
  number: 53
  type: single
  page: 2
  stem: '以下為網友在社群網站上針對時事議題的討論，依照內容判斷，下列何人的回應最正確？

    時事

    聽說某電視臺節目的內容與主題，曾經受到特定政治立場的外籍人士主導，所以內容多所偏頗，但這則消息的真實性還不能確定。

    小愛：若有明確證據顯示媒體損害公共利益，可以交由 NCC 進行調查。

    小橋：NCC 並非政府機關，對於未善盡查證義務的媒體無法給予處罰。

    小宸：媒體工作者為了監督施政，可以基於個人主觀因素，適時的「帶風向」。

    小柔：為引起大眾關注公共事務，扭曲事實、創造話題是專業倫理的表現。'
