  group_stem: "水調數聲持酒聽，午醉醒來愁未醒。送春春去幾時回？臨晚鏡，傷流景，往事後期空記省。\n沙上並禽池上瞑，雲破月來花弄影。重重翠幕密遮燈；風不定，人初靜，明日落紅應滿徑。\n\
    （張先 天仙子）\n註：①水調：曲調，相傳為隋煬帝所製。\n  ②臨晚鏡：晚間對著鏡子。\n  ③流景：光景如水流，形容光陰過得快，等於似水年華。\n  ④後期：後，未來的期約。\n\
    \  ⑤記省：記憶。\n  ⑥並禽：成對的鳥兒，指鴛鴦兩者相伴不相分離，所以稱並禽。\n  ⑦花弄影：花搖影動。\n  ⑧落紅：落花。"
