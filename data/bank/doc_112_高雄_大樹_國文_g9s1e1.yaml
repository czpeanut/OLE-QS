- id: doc_112_高雄_大樹_國文_g9s1e1_s6_1
  section: 6
  number: 1
  type: single
  page: 4
  stem: 「請站開點，不要擋住我的陽光。」這是什麼樣的心境？
  options:
  - label: A
    content: 追求安逸閒散
  - label: B
    content: 珍惜光陰
  - label: C
    content: 心如陽光之溫暖
  - label: D
    content: 掌握當下的幸福。
  group_stem: "希臘有位哲人，當亞歷山大大帝去拜訪他時，他正坐在大木桶邊晒太陽，他告訴大帝說：「請站開點，不要擋住我的陽光。」是的，只要你願意，你就能擁有世界上最珍貴的東西陽光，任誰也搶不走。在宇宙間，太陽給予每個人平等的溫暖。切莫置身陽光中，猶身在福中不知福。\n\
    \  有人非山珍海味不飽，有人但求菜根香，青菜豆腐滋味長；有人非錦衾無安枕，有人木榻也美夢成酣。幸福是心安滿足，自得其樂，也就是辛辛苦苦地掙麵包，而快快樂樂地把它嚥下去。\n\
    \  記得故宮博物院裡有一幅畫，畫中是一個人坐在芭蕉樹下，膝上置有一琴而未彈，此畫上題詩云：「蕉下不生暑，坐生千古心；抱琴何須鼓，天地自知音。」知音何須遠求，以欣賞的眼光，讚美的心情，環顧周遭，雖夕陽芳草尋常物，亦莫不可寄情；善體大自然之天心，自能「萬物靜觀皆自得，四時佳興與人同。」幸福與知音本不待尋求，只要你懂得欣賞，你比誰都富有。"
  tags:
    textbook: 九上 第三課 人間好時節
    labeled_by: ai
    chapter:
      publisher: 康軒
      book: 九上
      subject: 國文
      code: 第三課
      title: 人間好時節
      chapter: null
