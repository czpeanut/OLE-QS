- id: doc_112_高雄_大樹_國文_g9s1e1_s4_4
  section: 4
  number: 4
  type: single
  page: 1
  stem: 「今年九月十五日『國際淨灘日』，已成為全球一百五十二個國家與地區共同守護海洋的重大行動之一。但在此同時，遠在離臺灣五千公里外的中途島，每年卻因成鳥誤將海面上的海洋廢棄物當作魚類餵食，導致每年有二十萬隻信天翁雛鳥因食用塑膠垃圾而死。可見海洋廢棄物問題是各國必須共同負擔的共業，也是臺灣不可迴避的問題。」（荒野保護協會）根據報導內容，請問下列何人的理解是正確的？
  options:
  - label: A
    content: 仕德：目前全球各國都有參與『國際淨灘日』此重大行動
  - label: B
    content: 仕筠：淨灘活動的範圍主要是針對內陸的河灘地
  - label: C
    content: 奕茹：過境臺灣的信天翁因為誤食太多塑膠垃圾而死亡
  - label: D
    content: 弈晴：臺灣應該也要重視海洋廢棄物的相關問題。
  tags:
    textbook: 九上 第四課 黑與白─虎鯨
    labeled_by: ai
    chapter:
      publisher: 南一
      book: 九上
