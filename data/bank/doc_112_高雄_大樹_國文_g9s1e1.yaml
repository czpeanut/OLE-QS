      title: 黑與白─虎鯨
      chapter: null
- id: doc_112_高雄_大樹_國文_g9s1e1_s4_5
  section: 4
  number: 5
  type: single
  page: 1
  stem: 「魚翅價格高、有龐大的消費族群，吸引世界各地漁民爭相獵捕鯊魚。不過因為鯊魚肉價值很低，因此漁民在捕鯊後，只會割下鯊魚鰭，而將鯊魚拋回海中，以保持漁船上更多空間存放價值更高的魚翅。然而這些被丟回海中的鯊魚並不會立刻死亡，而會因為沒有鰭失去游泳能力而死亡。臺灣荒野保護協會指出，光是太平洋海域，一年就有一百萬隻鯊魚遭到人類無情的殺害；世界自然保育聯盟（IUCN）則指出，全球有一百十一種鯊魚面臨絕種危機。」（玉山周報2011/06/23）根據上述報導，請判斷下列說明何者有誤？
  options:
  - label: A
    content: 由於市場有龐大的魚翅需求，致使漁民大量捕捉鯊魚
  - label: B
    content: 漁民捕捉鯊魚不僅要牠的魚鰭，還要牠的魚肉
  - label: C
    content: 許多鯊魚的致死原因是失去魚鰭而無法游泳
  - label: D
    content: 鯊魚遭人類大量捕殺，有瀕臨絕種的可能。
