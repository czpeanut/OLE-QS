  page: 2
  stem: 宋詞的風格，可分為「婉約」和「豪放」兩派，「婉約」派詞調含蓄蘊藉，「豪放」派詞調氣象恢宏。請依據上述宋詞風格的說明，判斷下列何者屬於「豪放」派之作？
  options:
  - label: A
    content: 鳳凰山下雨初晴。水風清，晚霞明。一朵芙蓉，開過尚盈盈
  - label: B
    content: 素面常嫌粉涴，洗妝不褪脣紅。高情已逐曉雲空，不與梨花同夢
  - label: C
    content: 想當年，金戈鐵馬，氣吞萬里如虎
  - label: D
    content: 泛泛東風初破五。江柳微黃，萬萬千千縷。
