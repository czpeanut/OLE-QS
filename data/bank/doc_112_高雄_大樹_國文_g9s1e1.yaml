- id: doc_112_高雄_大樹_國文_g9s1e1_s6_7
  section: 6
  number: 7
  type: single
  page: 4
  stem: 有關環境荷爾蒙的敘述，下列何者正確？
  options:
  - label: A
    content: 皆由生物體內的細胞分泌
  - label: B
    content: 會影響到生物激素的作用
  - label: C
    content: 只會干擾生殖器官的發育
  - label: D
    content: 在水域環境中才能夠發現。
  group_stem: '在環境中，存在一些化合物，當它進入生物體時，會產生像激素一樣的作用，干擾生物正常的生理機能，例如：有些土壤含有多氯聯苯、DDT（一種殺蟲劑），空氣含有戴奧辛，以及水中的TBT（三丁基錫）等，這些化合物稱為環境荷爾蒙。大約四十年前，美國生態學家發現DDT
    會使某些鳥類的卵殼變薄；最近我國的海洋學者發現TBT 會使多種雌性貝類產生雄性生殖器。

    TBT 常被添加於船舶油漆中，以防止貝類或藻類附著於船身；且由於它能殺菌，也常添加於工業用水中，甚至添加在衣物以防止汗臭。TBT 會微量溶於水中，而散布至其他地區。一旦TBT
    進入生物體內，將經由食物鏈轉移並累積。例如：蚵螺喜食牡蠣，而牡蠣會濾食水中的浮游生物，因此曾發現，在某些牡蠣及蚵螺體內含有相當高量的TBT。

    TBT 的汙染若持續下去，可能會加強雄化現象，使雌蚵螺變性成為雄蚵螺，以至於雌雄性別失去平衡，進而造成族群銳減甚至消失。目前我們還不知道TBT 對人體的影響為何，但世界糧食組織及世界衛生組織發出警告：TBT
    對人類可能造成傷害。某些國家已禁止使用TBT，我國也已公告TBT 為毒性物質，廠商必須申報才能製造、輸入及販賣'
  tags:
