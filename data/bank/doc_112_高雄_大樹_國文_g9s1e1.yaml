  page: 2
  stem: 余光中之詩歌，在技巧上融通古典與現代，在詩作星之葬中，「淺藍色的夜溢進窗來／夏斟得太滿／螢火蟲的小宮燈做著夢／夢見唐宮／夢見追逐的輕羅小扇」數句，是由以下何詩化出？
