- id: doc_112_高雄_大樹_國文_g9s1e1_s6_10
  section: 6
  number: 10
  type: single
  page: 5
  stem: 文中工之僑之所以將琴獻給太常，是因為他認為這是一張好琴。下列選項，何者是工之僑所認為的好琴的標準？
  options:
  - label: A
    content: 好的琴弦
  - label: B
    content: 好的音色
  - label: C
    content: 好的裝飾
  - label: D
    content: 好的樂工。
  group_stem: '工之僑得良桐焉，斫①而為琴，弦而鼓②之，金聲而玉應③。自以為天下之美也，獻之太常④。使國工⑤視之，曰：「弗古。」還之。

    工之僑以歸，謀諸漆工，作斷紋焉；又謀諸篆工⑥，作古窾⑦焉。匣而埋諸土，期年⑧出之，抱以適⑨市。貴人過而見之，易之以百金，獻諸朝。樂官傳視，皆曰：「希世之珍也。」

    工之僑聞之，嘆曰：「悲哉世也！豈獨一琴哉？莫不然矣！而不早圖⑩之，其與亡矣！」遂去，入於宕冥之山⑪ ，不知其所終。

    注釋:

    ① 斫：音 ㄓㄨㄛˊ，用刀斧砍削。

    ② 鼓：彈奏。

    ③ 金聲而玉應：指以鐘發聲，以磬附和。在此形容琴音鏗鏘動聽。金，鐘，古樂器。玉，磬，古樂器。

    ④ 太常：指太常寺，古代掌管祭祀禮樂之官府。

    ⑤ 國工：國內一流的樂師。

    ⑥ 篆工：刻字、刻圖紋的工匠。

    ⑦ 窾：音 ㄎㄨㄢˇ，同「款」，古代鐘鼎器物上鑄刻的文字。

    ⑧ 期年：一周年。期，音 ㄐㄧ。

    ⑨ 適：到、去。

    ⑩ 圖：打算。'
