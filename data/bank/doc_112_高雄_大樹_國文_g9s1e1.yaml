- id: doc_112_高雄_大樹_國文_g9s1e1_s4_1
  section: 4
  number: 1
  type: single
  page: 1
  stem: 「位於嘉義縣的國立故宮博物院南部院區已定於104 年12 月28 日開館試營運，前3 個月將透過預約開放免費參觀！南部院區是為『平衡南北‧文化均富』，並帶動臺灣中南部地區的文化、教育、社會、經濟發展而設置，定位為『亞洲藝術文化博物館』。策展以本院豐富的典藏為主，輔以國際借展，發揮現代博物館應有的典藏、研究、維護、教育、展示、育樂、休閒及文創等各項功能。」由本文可知，故宮為什麼要設置南部院區？
  options:
  - label: A
    content: 希望帶動中南部地區的文化、經濟等發展
  - label: B
    content: 有專門場館可提供亞洲的藝術家展出作品
  - label: C
    content: 本院藏品爆滿，需有分院分擔收藏、展覽
  - label: D
    content: 讓中南部民眾有免費參觀故宮國寶的機會。
  tags:
    textbook: 九上 語文常識 應用文──對聯
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 九上
      subject: 國文
      code: 語文常識
      title: 應用文──對聯
      chapter: null
- id: doc_112_高雄_大樹_國文_g9s1e1_s4_2
  section: 4
  number: 2
  type: single
  page: 1
  stem: 「玫瑰石以其色澤如玫瑰般豔麗而得名，屬矽酸鹽類的輝石群，其密度精緻，色澤宛如玻璃一般半透明甚至透明，在顏色上有玫瑰紅、粉紅或者棕色，並帶有黑色的氧化錳斑紋。雖然世界上很多地方都有玫瑰石礦區，不過仍以花蓮產的玫瑰石因受地層擠壓、氧化及變質影響，石紋褶曲呈現如山水畫般的意境，最為漂亮多變化。」根據這段文字，下列推論何者最恰當？
  options:
  - label: A
    content: 矽酸鹽類的輝石群都是因為色澤而得名
  - label: B
    content: 玫瑰石斑紋由矽酸鹽或氧化錳變質產生
  - label: C
    content: 想要購買最漂亮的玫瑰石就應該到花蓮
  - label: D
    content: 玫瑰石的漂亮多變化可說是勝過山水畫。
  tags:
    textbook: 九上 第四課 黑與白─虎鯨
    labeled_by: ai
    chapter:
      publisher: 南一
      book: 九上
      subject: 國文
      code: 第四課
      title: 黑與白─虎鯨
      chapter: null
- id: doc_112_高雄_大樹_國文_g9s1e1_s4_3
  section: 4
  number: 3
  type: single
  page: 1
  stem: 「別來春半，觸目愁腸斷。砌下落梅如雪亂，拂了一身還滿。雁來音信無憑，路遙歸夢難成。離恨恰如春草，更行更遠還生。」關於這闕詞的敘述，何者正確？
  options:
  - label: A
    content: 主要描寫在外征戰多年，懷念故鄉妻小
  - label: B
    content: 感慨人生苦多於樂，與其哀傷不如及時行樂
  - label: C
    content: 以茂盛的春草象徵離愁別恨之綿延不絕，永無盡期
  - label: D
    content: 「落梅如雪亂」一句表達出梅花與雪一同落下之美景。
  tags:
