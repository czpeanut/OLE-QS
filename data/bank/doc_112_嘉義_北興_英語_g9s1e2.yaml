  group_stem: 'Gender equality is the basic human right and everyone should receive
    the same treatment no matter their gender. However, it has taken years for women
    to get the rights that they have now. Very few women studied in college 50 years
    ago, and most women didn’t have the right to vote until the middle of 20th century.
    Today, there are still many things that need to be worked on, such as parental
    leave, the pay gap, and so on.

    Iceland is the model country for gender equality. At school, boys are not laughed
    at when they play with Barbie dolls or collect toys like Hello Kitty. Also, girls
    are encouraged to be strong and brave and become anything they want to be, even
    truck drivers and mechanics. Here people won’t doubt each other’s abilities because
    of gender. In 1980, Iceland also democratically elected the world’s first female
    president, Vigdís FinnbogadÓ ttir. Today, 65% of its college students and 41%
    of its ministers are female. What’s more, each pair of parents receives nine month’s
    paid leave to take care of their baby.

    However, being as equal as it is, Iceland has a long way to go, for women still
    earn around 14% less than men. The government hopes to close the gender pay gap
    by 2022, and women’s group keep putting pressure on companies. After all, it’s
    not fair that women get less money just because they are female.

    equality 平等 treatment 對待 vote 投票 parental leave 育嬰假 pay gap 薪資差異

    encourage 鼓勵 mechanic 技工 democratically elect 民主選舉 minister 部長 pressure 壓力'
