  group_stem: 'The act of seeing into a person’s future 36. fortune-telling. It has
    been in history for thousands of years.

    In different parts of the world, there are different ways to predict the future.
    For example, the fortune-tellers of Gypsy are well-known for seeing one’s future
    in a crystal ball. In some countries, fortune-tellers read a person’s palm. We
    call them palm readers. There are lines on our palms. One line shows a person’s
    lifespan. Another line tells a palm reader 37. . Other lines tell other things.

    Many Chinese use I Ching to find out the information about the future. First,
    a person asks a question, and then throws some coins. The fortune-teller looks
    at the way the coins fall and then read I Ching to find out 38. .

    It’s human nature 39. . That’s why fortune-telling is popular all over the world.
    However, do not believe only in what the fortune-teller says. You have to be the
    master of your own life and live life to the full, 40. ?

    predict 預測 crystal 水晶 palm 掌心 I Ching 易經

    lifespan 壽命 human 人類的 master 主人'
