  group_stem: 'When you talk on the chat room for the first time, suddenly you find
    the person you are talking to is gone after he says, “BRB”！Or you may feel perplexed
    when you see the “Orz” symbol you’ve never seen before. “BRB” and “Orz” are both
    keyboard language—a language which is used on the computer.

    Today the Internet has changed the way in which people live their lives since
    computers were invented. It has even changed the language people use. More and
    more people make friends or talk with friends on the computer, so a new language
    is invented. On the chat room, people use keyboard language to save time. For
    example, the letters “BRB” mean “Be right back.” Also, people use some symbols
    to show how they feel. For example, they use the symbol of ☺ when they are happy.
    Lately, teenagers like to show their feelings by using some letters, like “T_T”.
    “T_T” means someone is crying. It is fun, isn’t it?

    On the Internet, different groups have their own special ways they talk. Why not
    try to invent your own language on the Internet?

    invent 發明 symbol 符號 lately 近來 feelings 感情'
