    content: 皮皮：「我們利用這場戰爭壯大勢力，最後終於取得中國的政權。」
  - label: C
    content: 平平：「這次戰爭使我們建立大東亞共榮圈的夢想破滅，最後宣布投降。」
  - label: D
    content: 美美：「這場戰爭讓我們與各國另訂平等新約，各國紛紛放棄特權。」
