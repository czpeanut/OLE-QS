      title: 石滬
      chapter: null
- id: doc_112_高雄_林園_國文_g9s2e1_s4_2
  section: 4
  number: 2
  type: single
  page: 1
  stem: "關於〈蔗田〉這詩句的分析，下列敘述何者錯誤？\n「蔗田萬頃碧萋萋，一望蘢蔥路欲迷。\n 綑載都來糖廍裡，只留蔗葉餉群犀。」"
  options:
  - label: A
    content: 蔗田青翠茂盛，欣欣向榮，甘蔗作物高大遼闊，連路都看不見了
  - label: B
    content: 蔗田一望無際，數大便是美的景致令人著迷，但牛隻只能吃蔗葉，作者為動物的處境抱不平
  - label: C
    content: 豐收的甘蔗都用來製糖，可見甘蔗不是給農民直接食用
  - label: D
    content: 藉由甘蔗的生機盎然，表現農人豐收的忙碌與喜悅
  lesson_raw:
    title: 蔗田
    basis: 題目寫了課名
  answer:
  - B
  answer_source: answer_key_vlm
  tags:
    textbook: 九下 第二課 石滬
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 九下
      subject: 國文
      code: 第二課
      title: 石滬
      chapter: null
- id: doc_112_高雄_林園_國文_g9s2e1_s4_3
  section: 4
  number: 3
  type: single
  page: 1
  stem: 請選出語詞使用錯誤的句子
  options:
  - label: A
    content: 一畦畦農田連成一幅「青黃不接」的景象，壯闊的稻浪在風中搖曳生姿
  - label: B
    content: 學校的美術課、音樂課、表演藝術課的目標是為了「陶冶」學生的性情，豐富學生優美的情感
  - label: C
    content: 現在的台灣與四百年前相比，人民所能享用的物資、經濟的條件都是富足許多的，但要說是「物阜民豐」，就見仁見智了
  - label: D
    content: 在社群媒體推波助瀾下，許多人愛分享外貌的光鮮亮麗，炫耀美食與奢華，能「淡泊」物慾，超越誘惑，令人敬佩的
  answer:
  - A
  answer_source: answer_key_vlm
  tags:
    textbook: 九下 第二課 石滬
    labeled_by: ai
    chapter:
      publisher: 翰林
      book: 九下
      subject: 國文
      code: 第二課
      title: 石滬
      chapter: null
- id: doc_112_高雄_林園_國文_g9s2e1_s4_4
  section: 4
  number: 4
  type: single
  page: 1
  stem: "關於這二首竹枝詞，下列何者正確?\n「(一)山桃紅花滿上頭，蜀江春水拍山流。花紅易衰似郎意，水流無限似儂愁。\n (二)楊柳青青江水平，聞郎江上唱歌聲。東邊日出西邊雨，道是無晴卻有晴。」"
  options:
  - label: A
    content: 「花紅易衰似郎意」，紅花表示女生，女生的容貌容易衰老
  - label: B
    content: 女子感到無窮無盡的愁苦，如同江水不斷地流
  - label: C
    content: 「道是無晴卻有晴」，可見男女彼此間都很曖昧，互不表態
  - label: D
    content: 第一首不僅有視覺的景物，還兼寫聽覺；第二首只有描述視覺的景物。
  answer:
  - B
  answer_source: answer_key_vlm
  tags:
    textbook: 九下 第一課 元曲選(1)天淨沙秋思(2)沉醉東風漁父詞
