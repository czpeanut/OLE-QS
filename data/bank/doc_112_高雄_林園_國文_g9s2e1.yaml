  stem: 1.請寫出徐仁修闡述的「精采人生」是什麼? 2分
  group_stem: '(一)下文摘自〈月落蠻荒〉作者自序，作者徐仁修，新竹芎林鄉人，為作家、自然生態攝影家，創立荒野保護協會。畢業於屏東農專，曾於年輕時派駐尼加拉瓜，擔任農業技術員，初次踏上外國的山川大地----中美洲尼加拉瓜，深入熱帶叢林蠻荒探勘，因期間的豐富經驗，對未來人生有深刻啟發與體悟，並藉此鼓勵年輕人。


    把握熱情

    那時我第一次接出外國的山川大地

    不同的種族、文化、宗教、生活方式

    我以年輕的熱情

    投入這個熱帶國家

    或因工作需要，或利用餘暇

    我幾乎踏遍了這個國家的每一個角落.

    而今時光歲月儘管逝去，走過的腳印依然新鮮

    當年的熱情與感動，猶如昨夜

    那共舞的美麗異國姑娘或以垂垂老矣

    那熱淚盈眶相送的少年，也在內戰動亂中不知去向


    年輕時的我放棄了留學的機會及公務員的生涯，投入第三世界的人生之旅，從此展開了我不斷的探險、旅行。我去經歷、我去探索、我去過各種不同的生活。20年過去了，當年的同學、同僚，有的做了機關首長，有的富甲一方，更多的是默默無聞、平平淡淡。我也沒有什麼成功，成就也不多，但我覺得自己這輩子比起他們，更能向生命交代，因為我讓生命活得精彩。

    我把這些經歷紀錄結集，而今永遠流出版公司重新出版，是想把它們獻給現代的少年人、年輕人，希望他們從我的經歷中學習到----- 一個人可能不一定成功，但卻可以選擇活得開闊，活得喜悅，更可以活得精彩。

    精彩是什麼呢？-----是用歡喜的心去品嚐人生的各種滋味：酸、甜、苦、辣、悲、歡、離、合......，不只品嚐，還要懂得欣賞。記得!欣賞你所經歷的一切人、事、物。

    「知道」是一件事，去「經驗」又是另一件事，我們常在書中讀到多少動人的故事，多少真知灼見，像「情愛」、「寬恕」 、「慈悲」、「愛人如己」……，或許我們大多知道這些名詞，甚至完全瞭解它的涵意，但如果我們從來沒有去「做」，也就無法體會它可貴的真諦，所以人生的精彩是去做(實踐)，去經驗(品嚐)，我們才算完成。

    我祝福你，人生過得精彩，當你到了我這年紀，也有許多動人的經歷分享給來者。'
  answer:
  - 「用歡喜的心去品嚐人生的各種滋味：酸、甜、苦、辣、悲、歡、離、合......，不只品嚐，還要懂得欣賞。」或「去做(實踐)，去經驗(品嚐)」
