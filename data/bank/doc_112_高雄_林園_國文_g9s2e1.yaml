  stem: 2.根據上文，請問「定下目標」可以帶動哪3個連鎖反應? 全對得2分
  group_stem: '(二)下文摘自美國著名的人際關係學大師，戴爾‧卡內基著作〈圖解卡內基人際溝通〉，關於「快樂」、「成功」的分析

    由於人總是想要追求快樂的生活，獲得快樂被認為是追求成功最重要的動力。卡內基：「說想要追求快樂，就要給自己定下目標，使自己能集中精神，發揮能力，並燃起希望。快樂來自內心，來自全心全意投入某件事的過程。要得到快樂，就要讓自己對許多事情抱持更多的熱誠，成功無非就是完成自己所訂定的目標，當你訂下目標，並且努力完成，就是一種快樂。

    當然，在獲得成功之時，除了快樂，也伴隨著其他的報酬，或許是為數可觀的金錢，或許是千秋不墜的名聲，或許是愛人的溫柔擁抱。但這一切都比不上自我內心的滿足與愉悅，此乃成功最吸引人之處。'
  answer:
  - 集中精神、發揮能力、燃起希望
