- id: doc_112_高雄_林園_國文_g9s2e1_s4_1
  section: 4
  number: 1
  type: single
  page: 1
  stem: "關於〈鹿耳門〉這詩句的分析，下列敘述何者錯誤？\n「鐵板沙連到七鯤，鯤身激浪海天昏。\n 任教巨舶難輕犯，天險生成鹿耳門。」"
  options:
  - label: A
    content: 指出鹿耳門一帶有堅硬的鐵板沙，沙洲數量眾多
  - label: B
    content: 鹿耳門的海域因沙洲而波濤洶湧，航行不易
  - label: C
    content: 描寫鹿耳門外鯤魚戲水以致海浪滔天的景象，暗示鯤魚的體型巨大，可能帶來凶險
  - label: D
    content: 鹿耳門是天然形成的險要之地，任使巨大的船艦也難以輕易進犯
  lesson_raw:
    title: 鹿耳門
    basis: 題目寫了課名
  answer:
  - C
  answer_source: answer_key_vlm
  tags:
    textbook: 九下 第二課 石滬
    labeled_by: ai
    chapter:
      publisher: 翰林
