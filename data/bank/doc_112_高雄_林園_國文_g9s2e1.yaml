- id: doc_112_高雄_林園_國文_g9s2e1_s4_5
  section: 4
  number: 5
  type: single
  page: 2
  stem: '關於〈天淨沙 秋思〉下面選項何者錯誤?

    枯藤老樹昏鴉，小橋流水人家，古道西風瘦馬。夕陽西下，斷腸人在天涯。'
  options:
  - label: A
    content: 「天淨沙」是這首曲的曲調，跟內容無關；題目是「秋思」，內容寫的是秋天的情懷
  - label: B
    content: 「枯、老、昏、古、西、瘦、夕陽」這些用詞營造出秋天蕭瑟寂寥的情愁
  - label: C
    content: 整首曲全由靜景鋪陳，呈現出完整的畫面感
  - label: D
    content: 「斷腸人」因仕途受阻，壯志難伸而傷心至極
  lesson_raw:
    title: 天淨沙 秋思
    basis: 題目寫了課名
  answer:
  - D
  answer_source: answer_key_vlm
