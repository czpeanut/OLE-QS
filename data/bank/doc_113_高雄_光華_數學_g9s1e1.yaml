- id: doc_113_高雄_光華_數學_g9s1e1_s3_1
  section: 3
  number: 1
  type: calc
  page: 4
  stem: (1) 請根據文章內容，計算一名男性成人每日所應攝取的「蔬菜」、「水果」、「水」的重量連比。
  group_stem: '# 健康報報


    〔第1 則〕20 年前我國衛福部與台灣癌症基金會共同推廣「天天5 蔬果」概念，即為每天應至少攝取五份蔬菜及水果，並每日喝水2000c.c(1c.c=1 公克)。近年來為了追求更好的健康狀態，每天攝取五份新鮮的蔬菜水果已經不再足夠，因此「蔬果5
    7 9」是從中延伸，從原本每天要吃3 份蔬菜、2 份水果份量，調整根據個人的年紀、性別，攝取5、7、9 份適量充足的蔬果營養，在份數原則部分，分類方式如下表1.，每日所需要的不同蔬果量為蔬菜加上水果的總攝取量。以期望國人能夠飲食均衡，降低肥胖、罹患慢性病及癌症的發生機率。


    表1.

    | 不同年齡及性別之蔬果攝取份量 | 蔬菜份數 | 水果份數 | 總份數 |

    | :--- | :--- | :--- | :--- |

    | 兒童(12 歲以內) | 3 | 2 | 5 |

    | 女性 | 4 | 3 | 7 |

    | 男性 | 5 | 4 | 9 |

    | 備註 | 1.一份蔬菜的重量為生重100 公克。<br>2.一份水果約等同1 個拳頭的大小，重量為在120 公克。 | | |


    〔第2 則〕近期多位營養師進一步推薦「蔬果彩虹5 7 9」，意指蔬果的「5.7.9 攝取份數」與「彩虹攝食」原則，「彩虹攝食」是由美國抗癌協會所發明的一種健康飲食法，主張攝入多彩的蔬果食材，並建議以原型食物為主，避免過多的烹調，給予身體豐富的營養素。且醫學研究專題報導蔬果中的葉黃素為天然的抗氧化劑，可減少氧化後自由基的破壞，特別是在眼睛的視網膜及水晶體區域，預防白內障和黃斑部病變。但人體無法自行合成，我國衛福部建議正常人每天應攝取5
    毫克，葉黃素的攝取須長期從飲食攝入，才能感覺得到效果。常見的食用蔬菜其葉黃素含量如表2.所示，建議國人搭配日常飲食來攝取足量葉黃素。


    表2

    | 種類 | 每100 公克蔬菜中葉黃素含量(毫克) |

    | :--- | :--- |

    | 菠菜 | 12.2 |

    | 芥藍菜 | 10.0 |

    | 茼蒿 | 3.5 |

    | 地瓜葉 | 2.6 |

    | 綠花椰菜 | 1.4 |


    上述文章內容來源為衛福部、台灣癌症基金會、FB:程涵宇營養師'
