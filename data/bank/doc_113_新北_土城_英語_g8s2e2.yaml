  group_stem: '39.-40.

    Camping is a great activity in the summertime.  Do you know how to find a good
    place to camp?  Here are the tips!

    1. Check for danger

    When you find a campsite, look around for anything dangerous.

    • Broken tree branches can fall on your tent. Stay away from them.

    • Bee hives are hard to see, but if you find one, keep your distance.

    • If you see animal droppings, animals may come here. Bears might visit campsites,
    so be careful.

    2. Choose a good spot

    • Avoid low areas: If it rains, water can flood your tent.

    • Find flat ground: A tent needs a flat place. If the ground is too steep, you
    may fall.

    3. Clean the area

    • Remove rocks and trash so you can sleep well.

    • Do not keep food in your tent. It can [墨漬] bears looking for food.

    & branch 樹枝, hive 蜂窩, dropping 排泄物, tent 帳篷'
