- id: doc_113_新北_土城_英語_g8s2e2_s2_33
  section: 2
  number: 33
  type: single
  page: 3
  stem: 33. Which companies are mentioned(提及) as using black?
  options:
  - label: A
    content: Coca-Cola and McDonald’s.
  - label: B
    content: Amazon and BMW.
  - label: C
    content: Pizza Hut and Wendy’s.
  - label: D
    content: LV and DQ.
  group_stem: '33.-35.

    There are many ways to sell things, but choosing the right colors is easy and
    powerful.  Why are colors important? Different colors make people feel different
    emotions. Colors can make people like something, help them decide, and get their
    attention. If you want to know which colors make people buy things, keep reading
    to learn more!


    What does RED represent?

    Let’s talk about the color red. Many big companies, like Coca-Cola and McDonald''s,
    use red.  Why do they choose red? Red is a strong color. It makes people feel
    happy and excited. It also makes people feel hungry, so it is good for food companies.  McDonald''s
    uses red to make people want to eat. Coca-Cola uses red to make people feel excited
    about their soda.


    What does BLACK represent?

    Black is a special color. It can mean power, sadness, or elegance. Many companies
    use black, like Amazon and BMW. Black makes things look expensive and professional.


    Color choice and color combination are very important in business.  They help
    send a message and create a strong effect. Choosing the right colors is an easy
    and powerful way to influence people.  When businessmen use the right colors,
    customers will naturally feel the emotions connected to the product.  For example,
    black and purple feel mysterious. White and pink feel pure and innocent. Good
    companies use colors to make customers feel the right way.

    & represent 代表, emotion 情緒, attention 專注, elegance 優雅, professional  專業的, combination
    組合, effect 影響, influence 影響, connect 連結, mysterious 神秘的, innocent 天真的'
  shared_asset: g2_33_35
