    content: The main purpose (目的) of this game is to test throwing skills.
  - label: B
    content: We can usually watch the game at school sports days.
  - label: C
    content: Every player has three chances to throw the ball.
  - label: D
    content: If a player steps over the line when throwing, he/she can throw again.
  group_stem: '36.~38.

    Softball Throwing Competition

    The softball throwing competition is a fun and exciting sport. It is often part
    of school sports days. The goal is to throw a softball as far as possible.

    Softball throwing comes from track and field sports. It is similar to the shot
    put and javelin throw, but it uses a lighter ball. This makes it easier for children
    to play.

    The rules are simple. Each player gets three chances to throw the ball. The best
    distance is recorded. Players must throw from behind a line. If they step over
    the line, the throw does not count. The player who throws the farthest wins the
    competition.

    Softball throwing is great for all ages. It does not need special equipment, only
    a softball and an open field. Many schools and sports clubs include this event
    in competitions. It is a fun way to test throwing skills and build confidence.

    & competition 比賽, similar 類似, track and field sports 田徑運動, equipment 設備, confidence
