    | :--- | :--- | :--- |

    | (A) | 有一名子女之核心家庭 | 配偶、姻親 |

    | (B) | 有一名子女之折衷家庭 | 配偶、旁系血親、姻親 |

    | (C) | 有兩名子女之單親家庭 | 配偶、直系血親、旁系血親 |

    | (D) | 有兩個小家庭的大家庭 | 配偶、直系血親、旁系血親、姻親 |'
