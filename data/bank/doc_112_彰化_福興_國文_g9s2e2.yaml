  group_stem: '儉，美德也，而流俗顧薄之。

    貧者見富者而羨之，富者見尤富者而羨之。一飯十金，一衣百金，一室千金，奈何不至貧且匱也?每見閭閻之中，其父兄古樸質實，足以自給，而其子弟羞向者之為鄙陋，盡舉其規模而變之，於是累世之藏，盡廢於一人之手。況乎用之奢者，取之不得不貪，算及錙銖，欲深谿壑;其究也，諂求詐騙，寡廉鮮恥，無所不至;則何若量入為出，享恆足之利乎?

    且吾所謂儉者，豈必一切捐之?養生送死之具，吉凶慶弔之需，人道之所不能廢，稱情以施焉，庶乎其不至於固耳。

    李文炤 〈儉訓〉

    注釋：①「薄」之：輕視。 ②閭閻：音ㄌㄩˊ ㄧㄢˊ，鄉里。 ③古樸質實：樸拙有古風，敦厚不浮華。 ④錙銖：音ㄗ ㄓㄨ，形容極小的數目。 ⑤其「究」也：最後。
    ⑥諂求詐騙：諂媚貪求，欺詐騙取。 ⑦「捐」之：捨棄。 ⑧「稱」情：音ㄔㄣˋ，酌量。'
