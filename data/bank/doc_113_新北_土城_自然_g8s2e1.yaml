    \       ｗ$KClO_{3}$＋ｘ$S$ → ｙ$KCl$＋ｚ$SO_{2}$\n火柴燃燒產生的二氧化硫($SO_{2}$)溶於水中，形成亞硫酸根($SO_{3}^{2-}$)，與碘液結合後，被氧化為硫酸根($SO_{4}^{2-}$)，而黃褐色的碘液則是被還原為無色的碘離子。"
