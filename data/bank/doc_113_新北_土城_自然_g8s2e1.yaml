- id: doc_113_新北_土城_自然_g8s2e1_s2_29
  section: 2
  number: 29
  type: single
  page: 3
  stem: 文中關於火柴燃燒的的反應係數，ｗ＋ｘ＋ｙ＋ｚ＝？[1-3 習作]
  options:
  - label: A
    content: '4'
  - label: B
    content: '5'
  - label: C
    content: '8'
  - label: D
    content: 10。
  group_stem: "【題組 3】\n在客廳也能做的氧化還原實驗/科學月刊\n\n(1)準備兩個透明杯，一盒火柴與碘液，在其中一個杯子倒入少許清水，並滴入碘液使溶液呈現黃褐色。\n\
    (2)一手拿黃褐色溶液的透明杯和火柴盒，並用另一個空杯當作杯蓋，另一手點燃火柴，立即移入黃褐色溶液杯中，但是點燃的火柴切勿碰觸到溶液，避免提早熄滅(圖A)。\n\
    (3)以空杯的杯底蓋住第一個透明杯，然後搖動(圖B)，便可觀察到黃褐色的碘液褪為無色，如果碘液不褪為無色，重複上述步驟數次，直到無色為止。\n在這個實驗中，碘液是否能順利變成無色取決於收集點燃火柴產生氣體的技巧。已知火柴是以火柴頭與火柴盒側邊摩擦，產生熱能後，再促使火柴頭成分中的氯酸鉀($KClO_{3}$)和硫($S$)反應燃燒，反應式如下，其中ｗ、ｘ、ｙ和ｚ為反應式係數。\n\
    \       ｗ$KClO_{3}$＋ｘ$S$ → ｙ$KCl$＋ｚ$SO_{2}$\n火柴燃燒產生的二氧化硫($SO_{2}$)溶於水中，形成亞硫酸根($SO_{3}^{2-}$)，與碘液結合後，被氧化為硫酸根($SO_{4}^{2-}$)，而黃褐色的碘液則是被還原為無色的碘離子。"
