  stem: 承上題，由於鐵製品在空氣中會逐漸氧化鏽蝕，故會在鐵製品的表面鍍上一層鋁，以達成防鏽目的。關於防鏽作用的敘述，下列何者正確？[2-1 習作]
  options:
  - label: A
    content: 鋁氧化後會形成緻密氧化鋁，避免內部金屬繼續氧化
  - label: B
    content: 鋁不容易氧化，因此可隔絕氧氣，防止生銹
