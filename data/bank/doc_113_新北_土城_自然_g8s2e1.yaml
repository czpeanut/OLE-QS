  group_stem: "【題組 3】\n在客廳也能做的氧化還原實驗/科學月刊\n\n(1)準備兩個透明杯，一盒火柴與碘液，在其中一個杯子倒入少許清水，並滴入碘液使溶液呈現黃褐色。\n\
