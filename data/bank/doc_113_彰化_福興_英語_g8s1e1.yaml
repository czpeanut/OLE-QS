  group_stem: 'Liz''s Wishes

    One day, a rock fell from the sky. It hit Liz right on the head. Plunk!

    "Ouch!" said Liz. Liz rubbed her head. "What is this?" she asked herself. She
    picked up the rock.

    The rock was hard and blue. "What a pretty rock!" said Liz. Liz held the rock
    in her hand. All of a sudden the rock began to shake and jump. "Wow!" said Liz.
    "This must be a magic rock! I will make a wish and see what happens."

    Liz made a wish. Poof! In front of Liz was a big crown. She put the crown on her
    head. "Now, I am a princess!" Liz said.

    Liz made a second wish. Poof! In front of Liz was a big ring. She put the ring
    on. "Wow!" said Liz.

    Liz made another wish. Poof! In front of Liz was a coach. "Wow!" said Liz. She
    got into the coach and rode home. She just had to show her family all the wonderful
    wishes that had come true.'
