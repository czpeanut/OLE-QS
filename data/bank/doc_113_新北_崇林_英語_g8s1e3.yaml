    \ people line up for them. Not just a popular dessert, doughnuts played a part\
    \ in \nhistory and we even have a national doughnut day! \nSoon after America\
    \ joined World War I in 1917, the Salvation Army sent about 250 \nvolunteers to\
    \ help American soldiers in France. Those women volunteers gave the soldiers baked\
    \ \ngoods, coffee, and fixing old clothes or shoes for them. Two of them even\
    \ thought of the idea how \nto make doughnuts—at first, they fried them in soldiers’\
    \ helmets because they didn’t have the tools \nto make them. The soldiers loved\
    \ the doughnuts so much, and they became their favorite food. \nPeople called\
    \ these kind women “Doughnut Dollies”.  \nIn 1938, the Salvation Army started\
    \ National Donut Day, and people gave money for people \nin need. They did this\
    \ to honor the “Doughnut Dollies”. Today, it falls on the first Friday of June\
    \ in \nthe USA and some other countries. On this day, many bakeries and coffee\
