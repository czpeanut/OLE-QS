  options:
  - label: A
    content: 立法委員在開會時，有向總統及五院院長提出質詢的權力
  - label: B
    content: 考試院院長的提名權在總統身上，經過行政院會議同意之後任命
  - label: C
    content: 監察院所通過的彈劾案，接下來即向司法院的懲戒法院提出
  - label: D
    content: 行政院所做成的決算報告書，必須送至司法院審計部來審核
