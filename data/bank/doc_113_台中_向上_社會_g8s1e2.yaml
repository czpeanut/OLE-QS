- id: doc_113_台中_向上_社會_g8s1e2_s1_29
  section: 1
  number: 29
  type: single
  page: 2
  stem: 上文雙底線的殖民統治者為哪一國家？
  options:
  - label: A
    content: 荷蘭
  - label: B
    content: 日本
  - label: C
    content: 葡萄牙
  - label: D
    content: 西班牙
  group_stem: "※請閱讀以下內容，回答29-30 題：\n  位於菲律賓馬尼拉南部的塔爾鎮，有一間名為「凱薩賽聖母聖壇」的教堂，裡頭供奉著既是菲律賓人的聖母瑪麗亞，也是華人的媽祖娘娘。根據地方文獻記載，1603\
    \ 年神像被漁民撈起後，被當時殖民統治者安排供奉在當地法官遺孀家中，而後神像多次神秘失蹤，最後在井邊發現，神父認為聖母擇定此處現身應是喜愛該處，於是在此興建教堂。傳說聖母曾顯靈救活被殖民統治者處決的華人工匠，使得華人開始將聖母當成媽祖膜拜，並向凱薩賽聖母聖壇進香。1954\
    \ 年，神像獲教宗加冕，2003 年是神像被發現的400 週年，華人信徒舉辦道教儀式紀念。這尊具有雙重國籍的神像，究竟是聖母瑪利亞還是媽祖，儼然已不重要。"
