  options:
  - label: A
    content: 以鄰為壑，損人利己
  - label: B
    content: 天意難測，不計得失
  - label: C
    content: 當機立斷，急流勇退
  - label: D
    content: 心猿意馬，易失良駒
  group_stem: 宋 陳諫議家有劣馬，性暴，不可馭，蹄齧傷人多矣。一日，諫議入廄，不見是馬，因詰僕：「彼馬何以不見？」僕言爲陳堯咨售之賈人矣。堯咨者，陳諫議之子也。諫議遽招子，曰：「汝爲貴臣，家中左右尚不能制，賈人安能蓄之？是移禍於人也！」急命人追賈人取馬，而償其直。戒僕養之終老。時人稱陳諫議有古仁之風。
    【註】遽：就             (陳諫議 教子)
