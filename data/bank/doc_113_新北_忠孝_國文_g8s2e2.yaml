    \   居止次城邑，逍遙自閒止。坐止高蔭下，步止蓽門裡。\n   好味止園葵，大歡止稚子。平生不止酒，止酒情無喜。\n   暮止不安寢，晨止不能起。日日欲止之，營衛止不理。\n\
    \   徒知止不樂，未知止利己。始覺止為善，今朝真止矣。\n                                    (節選〈止酒〉)\n【註】止：居住。\
    \  止：句末助詞。  止：只、僅\n      止酒：停止飲酒，即戒酒。\n      營衛：營養的吸收和抵抗力。 不理：不順。\n    陶淵明身為長期飲酒者，他戒酒的第一手感覺是很鮮明的。\n\
    \    首先，他說停止喝酒後會感受不到快樂，這是因為長期飲酒導致多巴胺的分泌量少於常人許多，而多巴胺負責調節情緒與慾望，當分泌一減少，對外在的刺激就跟著減少，因此較為無感。\n\
    \    再來，長期飲酒者停止喝酒會有「酒精戒斷症狀」，包含心跳加速、血壓上升、容易煩躁、失眠等表現。陶淵明接著表示，他天天想要戒酒，但戒酒時整個人都不順。\n\
    \    從成癮醫學的角度來看，因為長期飲酒，腦部受傷了，受傷的地方影響了長期飲酒者的衝動控制、自我調節能力和決策能力，腦部受傷後，還要回頭用大腦負責的控制力來強迫自己停止喝酒，是比一般人更難的，難怪陶淵明在沒有人幫助下，想戒酒也無法達成目標。\n\
    （本文改寫自廖泊喬〈文豪酒癮診斷書．陶淵明帶大家一起對酒宣戰〉）"
