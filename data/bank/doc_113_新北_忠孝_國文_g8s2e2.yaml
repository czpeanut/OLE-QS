- id: doc_113_新北_忠孝_國文_g8s2e2_s3_13
  section: 3
  number: 13
  type: single
  page: 1
  stem: 藉用具體形象化的技法，將某種感官的感覺移植到另一種感官上的修辭格，就是摹寫的「移覺」。例如：「山與山之間／由蟬鳴拉起的棧道／歌聲／如山花般爆燃」就是以視覺印象表現聽覺感受。下列何者也是「以視覺印象表現聽覺感受」？
  options:
  - label: A
    content: 有人看到／一排啞然的街燈／在風中／唱了起來
  - label: B
    content: 早晨的一杯拿鐵咖啡，使我的舌尖響起數千隻獅子奔跑的腳步聲
  - label: C
    content: 馬蹄聲，孤獨又憂鬱的自遠至近，灑落在沉默的街上成白色的小花朵
  - label: D
    content: 髮香蜿蜒而來／如清泉流過唇際。
