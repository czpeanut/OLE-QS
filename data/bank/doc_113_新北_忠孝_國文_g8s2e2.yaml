- id: doc_113_新北_忠孝_國文_g8s2e2_s3_17
  section: 3
  number: 17
  type: single
  page: 2
  stem: 關於以下人物判別，何者正確？
  options:
  - label: A
    content: 他是黑夜中╱陡然╱迸發起來的╱一團天火╱從江東熊熊焚燒到阿房宮╱最後自火中提煉出╱一個霸氣磅礡的╱名字——秦始皇
  - label: B
    content: 江魚吞食了二千多年，吞不下你的一根傲骨！太史公爲你的投水太息，怪你爲什麼不游宦他國？ 他怎知你若是做了張儀，你不過流為先秦一說客！——屈原
  - label: C
    content: 曲奏霓裳，羽衣迴舞。唉，問玉人何處啊？玉人何處？如今啊！夕殿飛螢，孤燈獨對，舊情新恨共誰語？數更漏，淚如雨——王昭君
  - label: D
    content: 剛直不阿，留得正氣沖霄漢；幽愁發憤，著成信史照塵寰——文天祥
  tags:
    chapter:
      publisher: 翰林
      book: 八下
