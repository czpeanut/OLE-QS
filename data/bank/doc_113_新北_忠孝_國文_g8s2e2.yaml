  stem: 失敗為成功之母一文提到：「累積失敗的經驗，改正前番的缺點，開拓出成功的道理。」新一參加比賽失利，下列回應，何者最適合激勵他：「失敗是一時的，應好好準備面對下一次的挑戰」？
  options:
  - label: A
    content: 長風破浪會有時，直掛雲帆濟滄海
