- id: doc_113_新北_忠孝_國文_g8s2e2_s3_16
  section: 3
  number: 16
  type: single
  page: 2
  stem: 關於我所知道的康橋一文，下列敘述何者正確？
  options:
  - label: A
    content: 「關心石上的苔痕，關心敗草裡的鮮花，……關心新來的鳥語。」作者連續使用了六個「關心」表示對於春天的訊息遲遲未到而感覺憂心
  - label: B
    content: 「在靜定的朝氣裡漸漸地上騰，漸漸地不見，彷彿是朝來人們的祈禱，參差地翳入了天聽。」這是用視覺印象表達聽覺感受，將想像與現實的場景結合
  - label: C
    content: 「頃刻間這田野添深了顏色，一層輕紗似的金粉糝上了這草、這樹、這通道、這莊舍。」描繪出薄霧瀰漫的初春
  - label: D
    content: 「這草田變成了……，不說也罷，說來你們也是不信的！」表現出作者的心靈感受，只可意會而不可言傳，給予讀者其他想像空間
  lesson_raw:
    number: 第5課
    title: 我所知道的康橋
    basis: 題目指明《我所知道的康橋》
  tags:
