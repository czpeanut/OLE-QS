  group_stem: "小吳：大人，他砍傷我家的馬，害我只好把原本價值二十貫的馬，用十貫錢賣了。\n小周：大人，是他的惡犬先咬死我家的羊。雖然羊還是能賣得原本的價格十貫錢，但我實在是嚥不下這口氣。\n\
    \n一、殺害他人馬、牛者：笞七十，徒一年半。\n傷而不堪乘用：笞五十，賠減價。價未減者，笞三十。\n【註】減價：牲畜若原本值十貫，被殺後，只值兩貫，即減價八貫。\n\
    \  價未減者：牲畜雖被人殺傷，但仍值原價，傷畜者，判笞三十，無須賠償。\n二、殺傷他人豬、羊等畜者：賠減價。價未減者，笞三十。\n三、任犬殺傷他人畜產者：賠減價。價不減者，笞二十。"
