  number: 25
  type: single
  page: 2
  stem: Which may be electronic waste?
  options:
  - label: A
    content: The latest cellphone
  - label: B
    content: The picture you drew
  - label: C
    content: The old headphone
  - label: D
    content: The school uniform
  group_stem: "B.\nToo Much Electronic Waste\n    New products come out faster and\
    \ faster. One product is replaced with another while it is still not broken. Therefore,\
    \ people keep more unused electronics than they did four years ago. A report says\
    \ people kept about 20 items four years ago, but now it is about 30 items. Not\
    \ only fast fashion but also fast technology causes a lot of waste. The most popular\
    \ items are remote controls, cellphones, and hairdryers. The United Nations says\
    \ that there is more electronic waste than companies can recycle. The amount of\
    \ electronic waste is growing too fast. We are all responsible for this problem.\n\
    \    However, it is important to deal with electronic waste properly because there\
    \ are valuable materials in it. Using these materials again saves resources. Also,\
    \ sharing or fixing would make things last longer. The problem is that most products\
    \ are on the market for only a few years. It might not be possible to fix all\
    \ the broken items several years later because perhaps some parts won't be produced\
    \ or found anymore then. To reduce electronic waste, we should reuse unbroken\
    \ products and recycle broken ones.\n\ntechnology 科技 remote control 遙控器 United\
    \ Nations 聯合國 responsible 負責任的\nproperly 適當地 material 材料 resource 資源 reduce 減少"
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
