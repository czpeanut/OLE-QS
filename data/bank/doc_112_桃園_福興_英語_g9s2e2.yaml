  - label: C
    content: It makes them happy.
  - label: D
    content: It helps them exercise.
  group_stem: "C.\nWhy is Handwriting Important\n    These days, screens and keyboards\
    \ are becoming more and more common tools we use when we learn. We can record\
    \ almost everything by typing or by taking a picture. Learning on the screen appears\
    \ more convenient than handwriting, which makes fewer and fewer people take notes\
    \ by writing. However, experts say that handwriting is still needed. Writing often\
    \ is good for our memory and thinking.\n    Some studies show that handwriting\
    \ helps develop our brains, especially for young children. If you write well,\
    \ it can lead to better grades at school. Also, writing helps children connect\
    \ letters with sounds. Take English tests for example. A student is usually excellent\
    \ at both listening and speaking. In fact, listening, speaking, reading, and writing\
    \ are relatively helpful to one another. Research suggests that writing something\
    \ down improves working memory, which is something typing on a keyboard cannot\
    \ do. If you depend on typing information on the cellphone or on the computer,\
    \ you may forget things easily because you think you can always find anything\
    \ you have typed before on the electronic devices or on the cloud. Gradually,\
    \ you aren't able to remember things well. Therefore, for students, using pens\
    \ and paper may work better than learning on the screen.\n\nexpert 專家 connect\
    \ 連結 research 研究 suggest 建議 improve 改善"
