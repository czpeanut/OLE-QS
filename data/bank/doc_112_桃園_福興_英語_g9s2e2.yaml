  number: 33
  type: single
  page: 3
  stem: What is one of the benefits of eating insects?
  options:
  - label: A
    content: Farmers need less land to raise insects than to raise cows.
  - label: B
    content: Only the lacals in Thailand and Cambodia love to eat insects.
  - label: C
    content: Eating insects make us have more strength to save the earth.
  - label: D
    content: Insects make gases which smell better than other big animals.
  group_stem: "D.\nThe Taste of Insects\n    There are a lot of special dishes all\
    \ over the world. Some of them might be weird for those people in different cultures.\
    \ For example, in many parts of the world, people eat insects. That sounds terrible\
    \ to us, but they are a part of some people's diet. Insects are enjoyed not only\
    \ because of their taste, but they are also good for health and the earth.\n \
    \   In the western world, many people think that eating insects is disgusting.\
    \ However, in some Southeast Asian countries, such as Thailand and Cambodia, insects\
    \ are street food. In Thailand, fried crickets are sold everywhere. This snack\
    \ is very popular at the market, just like popcorn chicken in Taiwan. In Cambodia,\
    \ barbecued big spiders are served as food. Besides barbecuing them, they are\
    \ also boiled or fried. What's more, scientists say that meal worms are like meat.\
    \ They taste different if you cooke them differently. If you steam them, they\
    \ smell like sweetcorn. If you roast or fry them, they taste like shrimp.\n  \
    \  Insects as food have more benefits. They are full of nutrients and better for\
    \ the planet than meat. They need less land and water, and they don't make any\
    \ gases like cows and other big animals. To save the earth, are you willing to\
    \ eat insects?\n\ndisgusting 噁心的 Cambodia 柬埔寨 steam 蒸 shrimp 蝦 roast 烤\nbenefit\
