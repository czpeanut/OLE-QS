  - label: D
    content: They make Americans find peace in mind.
  group_stem: "E.\nSchool Bus Yellow\n    Each school day, yellow school buses transport\
    \ millions of American kids to and from school. The signature yellow color of\
    \ school buses isn't just for looks. It's also a matter of safety. In the past,\
    \ many children walked to school. Later, red, white, and blue buses took children\
    \ to support patriotism. Over time, most school buses in the US became the same\
    \ yellow color.\n    In 1939, a professor at Columbia University met with teachers,\
    \ engineers, and other experts. They wrote a document of forty-two pages that\
    \ was about school buses. Experts recommended to make the school buses yellow\
    \ because black letters on yellow can be seen easily. Also, yellow buses were\
    \ more noticeable in bad weather. Federal law in the United States requires that,\
    \ besides flashing lights and safety devices, school buses must be painted \"\
    school bus yellow.\" Before the standard school bus yellow color was developed,\
    \ school buses were a pure yellow, closer to the color of a lemon. School bus\
    \ yellow is neither pure yellow nor pure orange. Instead, it is a mix of the two,\
    \ similar to the color of the flesh of a mango. You may not find it in a box of\
    \ crayons, but school bus yellow is a real color.\n\ntransport 運輸 signature 標誌性的\
