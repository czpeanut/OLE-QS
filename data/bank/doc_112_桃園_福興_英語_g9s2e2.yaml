  group_stem: "A.\nTalking about Laughing\n    Do you laugh often? How many times\
    \ do you laugh a day? It is possible that you do not laugh enough. Studies show\
    \ that a 4-year-old kid usually laughs 300 times a day. However, when they get\
    \ older, they laugh less. A 40-year-old man or woman may laugh only four times\
    \ a day. If you do not laugh as often as you used to, open your mouth, and laugh\
    \ out loud every day because laughter is the best medicine. Ted Smith, a doctor\
    \ in New York, said that laughing exercises the heart as well some other parts\
    \ of our body. When you laugh, you feel better in many ways. For example, you\
    \ feel more relaxed. You also sleep better.\n    Helen Anderson, a hospital clown\
    \ in Boston, said that her job is to bring joy to children who are in poor health\
    \ or who have special needs. When she visits these children in the hospital, she\
    \ tells them interesting stories or jokes, plays music, or does magic to make\
    \ them laugh. \"My visits make them feel less scared, lonely, or bored. Some people\
    \ call me a 'clown doctor,' and they're right about that. I do my part to help\
    \ the children to heal,\" she said."
