  group_stem: 'A. 38-41

    Silo is the world’s first Zero Waste restaurant. It is in East London. It''s not
    like other restaurants because it creates no waste. The chef and owner, Douglas
    McMaster, wants to change how people think about food.

    At Silo, people don’t throw away anything. All the raw materials are reused. There''s
    no disposable packaging, and every part of the food ends up on the table. Douglas
    calls it "supernatural farmer’s food" because they use everything, just like farmers
    did in the past.

    Because nothing goes to waste, you can find interesting tastes in every part of
    the restaurant. This eco-friendly way of cooking is becoming popular. Michelin,
    a famous restaurant guide, now gives a Green Star award to those restaurants like
    them. Silo got this award in 2021.

    Other restaurants are also trying to be more eco-friendly. Another restaurant
    in London called Apricity focuses on seasonal, low-waste dining. Its owner, Chantelle
    Nicholson, tries to join the food with the high class environment.

    These chefs think that caring about the environment and enjoying good food can
    go together. They are very careful about where they get their materials and how
    they cook. For them, dining should be about joy, but also about respecting nature.
     raw material 未加工材料 disposable 一次性的 focus 聚焦 environment 環境 respect 尊重'
