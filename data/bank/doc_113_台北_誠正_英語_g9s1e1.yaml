  stem: What is this reading mainly about?
  options:
  - label: A
    content: The best time for a date.
  - label: B
    content: The best place for a date.
  - label: C
    content: The way to relax for a date.
  - label: D
    content: The way to dress for a date.
  group_stem: 'C. 45-47

    Imagine that you finally asked the girl or guy you like out on a date. They said
    yes, and you’re so excited to go out with them. But then, you start to get worried,
    “What should I wear ?”

    First of all, comfort is the most important thing. It’s hard to have confidence
    if you’re not wearing something comfortable. Secondly, think about where you’re
    going. If you’re going to a fine restaurant, of course, you’ll want to wear a
    suit or a nice dress. But you would never wear those things to a baseball game,
    would you? In that case, you might wear something a lot more casual, like jeans
    and a T-shirt.

    No matter what you decide to wear, though, give yourself enough time to think
    everything through. You don’t want to think about your clothes a few minutes before
    your date, do you? That stress will only make it harder to enjoy your time with
    your date. So, take your time, think about your dating place, and stay comfortable.

     imagine 想像 comfort 舒適 confidence 自信 suit 西裝 casual 休閒的 no matter 無論'
