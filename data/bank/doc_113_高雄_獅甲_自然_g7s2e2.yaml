    content: 植物界
  - label: B
    content: 菌物界
  - label: C
    content: 原核生物界
  - label: D
    content: 原生生物界
  group_stem: "1.請閱讀下列敘述後，回答問題：\n藻類成為抗癌食品\n  海帶、裙帶菜、昆布等為常見之食物，因含有大量的維生素及礦物質，常被視為補充營養的副食品。近年研究發現褐藻中含有褐藻糖膠（Fucoidan）。根據研究，褐藻糖膠是一種水溶性多醣類，具有抗病毒、調節免疫、抗癌等作用。其中在抗癌的作用中，可使新分裂增生的癌細胞無法製造新血管，癌細胞將無法獲得營養及氧氣的供應，進而阻絕癌細胞的轉移及擴散。"
