  type: single
  page: 2
  stem: 達文西《最後的晚餐》是文藝復興時期代表畫作之一，畫中描繪耶穌與他的十二門徒共進晚餐，耶穌在餐桌上宣布，他們之中將有人會背叛耶穌。達文西精確地描繪了每一位人物當下的反應與表情，這反映出文藝復興的藝術創作的何種特色？
  options:
  - label: A
    content: 強調宗教至上
  - label: B
    content: 以神為本的神本思想
  - label: C
    content: 注重來世的幸福追求
  - label: D
    content: 重視人性情緒的展現。
