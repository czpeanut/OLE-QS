  section: 1
  number: 30
  type: single
  page: 1
  stem: 「義大利作家但丁，文藝復興時代代表作家之一，被稱為至高詩人、義大利語之父，其所著長詩《神曲》，以托斯卡尼方言寫成，在日後形成義大利語和義大利文學的基礎。」由上述資料可知，文藝復興時期對歐洲有什麼樣的影響？
  options:
  - label: A
    content: 增進拉丁文的傳播
  - label: B
