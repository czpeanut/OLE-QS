  section: 1
  number: 21
  type: single
  page: 1
  stem: 「城邦」是古希臘文明相當特殊的政治體制，每座城市皆是獨立政權，既是城市又是國家，故稱城邦。形成這種政治體制的主因為何？
  options:
  - label: A
    content: 因希臘盛行民主制度
  - label: B
    content: 因希臘地區地形崎嶇
  - label: C
    content: 方便軍事制度治國
  - label: D
    content: 因希臘為中央集權國家。
