  section: 1
  number: 29
  type: single
  page: 1
  stem: 文藝復興顧名思義，是文學與藝術復甦的時代，對歐洲日後的文化發展有著不可磨滅的影響。分析文藝復興出現的原因，何者正確？
  options:
  - label: A
    content: 阿拉伯人掠奪拜占庭，文物典籍流入西歐
  - label: B
    content: 日耳曼人南下，帶來豐富學術思想
  - label: C
    content: 義大利北部商業興盛，商人支持文藝創作
  - label: D
    content: 西歐嚮往古代文明，主動追尋研究。
