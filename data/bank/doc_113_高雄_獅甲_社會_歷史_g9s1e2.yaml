- id: doc_113_高雄_獅甲_社會_歷史_g9s1e2_s1_28
  section: 1
  number: 28
  type: single
  page: 1
  stem: 阿拉伯人因所在的西亞地區氣候乾燥，無法發展農業，自古以來便四處游牧經商維生，接觸到各地不同民族。間接變成文化的傳播者。關於阿拉伯人對於文化交流的貢獻，何者正確？
  options:
  - label: A
    content: 將西方的造紙術傳到東方
  - label: B
    content: 保存古希臘羅馬文獻典籍
  - label: C
    content: 發明阿拉伯數字流傳歐洲
  - label: D
    content: 翻譯並傳播中國儒家思想。
