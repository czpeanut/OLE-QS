  section: 1
  number: 26
  type: single
  page: 1
  stem: 現今世界上，伊斯蘭世界與基督教世界經常發生對立與衝突，但其此二宗教有著諸多相似之處，甚至稱為兄弟也不為過，比較二者相似之處，何者正確？
  options:
