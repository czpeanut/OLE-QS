  section: 1
  number: 27
  type: single
  page: 1
  stem: 承上題，兩者間的衝突早在十一世紀已然發生，當時因信仰伊斯蘭教的某族群興起，嚴重威脅拜占庭帝國，羅馬教宗號召西歐基督教國家組成聯軍，前往東方討伐穆斯林，埋下對立的遠因。請問：當時這群威脅拜占庭的族群應是下列何者？
  options:
  - label: A
    content: 阿拉伯人
  - label: B
    content: 鄂圖曼土耳其人
  - label: C
    content: 日耳曼人
  - label: D
    content: 塞爾柱土耳其人。
