- id: doc_113_高雄_獅甲_社會_歷史_g9s1e2_s1_23
  section: 1
  number: 23
  type: single
  page: 1
  stem: 羅馬競技場是羅馬帝國遺留的偉大建築之一，它是當時人們在觀看勇士決鬥、或人類與猛獸搏鬥的場所，例如當時帝國若抓到躲藏的基督徒，便把他們丟進競技場與獅子搏鬥，屬刑罰的一種。請問：當時基督徒為何會受到帝國的追捕呢？
  options:
  - label: A
    content: 基督徒信奉一神，拒絕膜拜皇帝
  - label: B
    content: 基督教施行種族政策，違背帝國法律
  - label: C
    content: 基督教為多神教，違背羅馬傳統
  - label: D
    content: 基督徒號召人民試圖顛覆羅馬帝國。
