- id: doc_113_高雄_獅甲_社會_歷史_g9s1e2_s1_22
  section: 1
  number: 22
  type: single
  page: 1
  stem: 羅馬帝國國力強盛，文明輝煌，對後世歐洲產生深遠影響，在歐洲人記憶中留下崇高地位。下列何者是羅馬帝國時代的成就之一？
  options:
  - label: A
    content: 抵禦波斯人的入侵，維持西歐社會的和平
  - label: B
    content: 統治西亞、埃及與印度，刺激文化交流
  - label: C
    content: 以元老院決策公共事務，是民主制度起源
  - label: D
    content: 使用先進法律觀念與文字影響後世發展。
