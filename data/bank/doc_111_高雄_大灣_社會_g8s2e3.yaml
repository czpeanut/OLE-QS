- id: doc_111_高雄_大灣_社會_g8s2e3_s1_27
  section: 1
  number: 27
  type: single
  page: 3
  stem: 當初促使美國與中共建交的主要因素為何？
  options:
  - label: A
    content: 防止日本軍國主義再起
  - label: B
    content: 中共放棄一黨專政
  - label: C
    content: 中共聲援在越南的美軍
  - label: D
    content: 美國想聯合中國牽制蘇聯。
  group_stem: "西元1978 年，美國宣布與中華民國斷交，並自西元1979 年1 月1 日起，與中華人民共和國建交。一夕之間，美中臺關係風雲變色。中國在西元1978\
    \ 年底決定走向改革開放，讓人民初嘗到資本主義帶來的好處後，中國一年比一年更加開放，改革的腳步也隨之加快。\n    中國推動改革開放以後，經濟成長快速，人民的生活水準也逐漸提升，但因官員貪汙腐化、物價上漲，社會瀰漫著一股對現實生活的不滿。西方的民主思潮也隨著該政策而在中國廣泛傳播，許多民間知識分子開始提出民主、人權的觀念。\n\
    \    1989 年4 月，因一位聲望高，又同情民主人士的前總書記過世，北京的學生以悼念為由，聚集於天安門廣場，批評中共的施政與社會問題，要求中共進行民主改革，解決官員貪汙腐化的問題。學生的舉動獲得民眾的同情與支持，情勢一發不可收拾，除了北京，上海、天津、武漢等大城市，也都出現群眾抗議的運動。起初，中共高層試圖與天安門廣場的學生代表溝通，但學生卻提出要讓鄧小平下臺的主張，雙方難以達成共識。\n\
    \    5 月20 日，中共宣布戒嚴。6 月4 日，鄧小平下令軍隊進入天安門廣場，以武力鎮壓群眾運動。這場鎮壓經過各國媒體報導震驚了全世界，中國的民主運動受到嚴重的挫折，而美國基於人權理由，開始對中國實施經濟制裁。\n\
    \    西元2001 年，中國成為世界貿易組織的成員之一，西元2008 年奧運在北京舉行，西元2010 年中國超越日本，躍升為世界第二大經濟體，國力逐步增強的中國，在短短30\
