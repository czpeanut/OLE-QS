  group_stem: "今取人則不然，不問可否，不論曲直，非秦者去，為客者逐。然則是所重者在乎色樂珠玉，而所輕者在乎民人也！此非所以跨1 海內、制諸侯之術也。\n\
    \    臣聞地廣者粟多，國大者人眾，兵彊者士勇。是以泰山不讓土壤，故能成其大；河海不擇細流，故能就其深；王者不卻眾庶，故能明其德。是以地無四方，民無異國，四時充美，鬼神降福，此五帝三王之所以無敵也。今乃棄黔首以資敵國，卻賓客以業諸侯，使天下之士，退而不敢西向，裹足不入秦，此所謂藉2\
    \ 寇兵而齎3 盜糧者也。\n(節選自李斯＜諫逐客書＞)\n 愛心注釋：1.跨：統一。2. 藉：通「借」。3.齎：音ㄐㄧ，贈送。"
