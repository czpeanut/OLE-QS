  type: single
  page: 2
  stem: '關於「史記」、「戰國策」比較表格，何者有誤？


    | | 史記 | 戰國策 |

    | --- | --- | --- |

    | 作者（A） | 西漢 司馬遷 | 西漢 劉向 |

    | 異名（B） | 太史公記 | 國策、國事、短長、事語、長書、脩書 |

    | 體例（C） | 紀傳體 | 國別史 |

    | 起訖時代 | 黃帝至漢武帝太初年間，時間長達二千多年。 | 春秋之後，終於楚漢之起，總共二百四十五年。 |

    | 特色價值（D） | 1. 正史、通史之祖。<br>2. 「四史」之首、「六才子書」之一。<br>3. 其文雄深雅健，善敘事理。<br>4. 開創「不虛美、不隱惡」的史學精神。<br>5.
    魯迅以「史家之絕唱，無韻之離騷」來評論本書。 | 1. 保存部分戰國史實，司馬遷作史記多採其說。<br>2. 左傳、戰國策、世說為中國三部說話之寶典。<br>3.
    巧於比喻，善用寓言，富有啟發性。<br>4. 戰國策長於議論，影響三蘇（蘇洵、蘇軾、蘇轍）之文。 |'
