  stem: 方老師正進行第四課<鄒忌諷齊王納諫>課文賞析。請問他應該是針對本文哪項寫作特色進行闡述？
  options:
  - label: A
    content: 巧設比方，以理服人
  - label: B
    content: 善用排比、層遞，條理井然
  - label: C
    content: 人物描寫，繁簡得當
  - label: D
    content: 善引名言事例，既添文采，又具說服力
  group_stem: 文中細膩描寫鄒忌的聲貌：他詢問完妻、妾、客後，又「熟視」、「窺鏡」，繼而「暮，寢而思」，透過細節、對話和獨白的描述，鮮活地呈現其內心世界。而齊王的回應，只有兩處：「王曰：『善』」與「乃下令……」，明確地展現其雅量與決心，將賢君形象表現得十分傳神。
  lesson_raw:
    number: 第四課
    title: 鄒忌諷齊王納諫
    basis: 題目寫了「第四課<鄒忌諷齊王納諫>」
