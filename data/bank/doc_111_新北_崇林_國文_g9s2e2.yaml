  group_stem: "聯合國關心身心障礙者的人權，陸續公布相關言論，包括一九七一年的〈智能障礙者權利宣言〉、一九七五年的〈身心障礙者權利宣言〉、一九九三年的〈身心障礙者機會均等準則〉。二○○○年，五位國際身心障礙者呼籲所有的政府支持該準則。二○○一年墨西哥代表在聯合國大會上要求成立非常設委員會，整合出一個公約，全面推廣並保障身心障礙者的權利與尊嚴。之後由相關身心障礙者人權機構，擔任國際非常設身心障礙者幹部會議的整合單位，參與起草公約的過程。二○○六年聯合國通過《身心障礙者權利公約》（Convention\
    \ on the Rights of Persons with Disabilities, CRPD），二○○七年開放各國簽署，二○○八年生效。\n 《身心障礙者權利公約》共有五十條。前言、第一、第二條為一般規定；第三至第五條、第八至第九條為共通性原則；第六、第七條關注的是兒童與婦女；第十至第三十條為具體權利；第三十一至第三十三條為締約國的義務；第三十四至第五十條為聯合國公約監督機制及其他。除了《身心障礙者權利公約》本文外，聯合國身心障礙者權利委員會自二○一四年以來，陸續公布一般性意見，有助於締約國對《身心障礙者權利公約》的了解。\n\
    \  我國雖不是聯合國會員國，但為保障身心障礙者權益，立法院在二○一四年通過《身心障礙者權利公約施行法》，維護其權益，以及平等參與社會、政治、經濟、文化等的機會，並促進其自立及發展。所以《身心障礙者權利公約》所揭示保障身心障礙者人權的規定，具有國內法律的效力。\n\
    \ 不同於以往的醫療模式或社會模式，《身心障礙者權利公約》是基於人權模式訂定。強調所有人類固有尊嚴與普世價值，必須保障身心障礙者不受歧視的在與他人於平等基礎上，完整且有效的參與社會。「基於身心障礙的歧視」是指，以「身心障礙」為由區別、排斥或限制身心障礙者參與政治、經濟、社會、文化、公民或任何其他領域。基於身心障礙的歧視，包括所有形式的歧視，含拒絕提供合理調整。所謂的合理調整，是指在根據具體需要，於不造成過度或不當負擔的情況下，進行必要及適當的修改與調整，以確保身心障礙者在與其他人平等的基礎上，享有或行使所有人權和基本自由。合理調整的原則在於需求與調整間的相關性、比例性、可能性、可行性等。\n\
    \ 《身心障礙者權利公約》規定，國家的義務為尊重身心障礙者權利，保障身心障礙者的充分參與及自主與自立，讓身心障礙者（代表）能參與決策過程。同時還需要促進並實現《身心障礙者權利公約》所述及身心障礙者的各項具體權利。所以各級政府機關應確實依現行法規規定的業務職掌，負責籌畫、優先編列經費，逐步推動及執行公約所規定的事項。\n\
    \ 身心障礙者具體的權利包括：生命權、危險情況與人道緊急狀況、在法律之前獲得平等承認、獲得司法保護、人身自由與安全、免於酷刑或其他殘忍、不人道或有辱人格的待遇或處罰、免於剝削、暴力與虐待、保障人身完整性、遷徙自由與國籍、自立生活與融合社區、個人行動能力、表現與意見之自由及進用資訊、尊重隱私、尊重家居與家庭、教育、健康、適應訓練與復健、工作與就業、適足之生活水準與社會保障、參與政治與公共生活、參與文化、生活、娛樂休閒與體育活動。\n\
    \ 《身心障礙者權利公約》第二十四條所談的教育，是指融合教育，亦即不能以身心障礙為由，將身心障礙者拒於普通學校之外。身心障礙者有權，在與其他人平等的基礎上，獲得融合、優質的教育，並在學校內得到必要的援助，以及符合個人需要的合理調整。除此之外，應該促進盲人學習點字，替代文字，輔助和替代性通訊傳播方式、方法及格式、定向行動，並促進同儕支持與指導。促進聾人學習手語及和推廣聾人的語言認同。確保盲生與聾生能在最適合個人情況的語言溝通模式通訊傳播方式、方法，以及最有利於學業和社會發展的環境中接受教育。\n\
    文／張蓓莉（國立臺灣師範大學特殊教育學系教授）"
