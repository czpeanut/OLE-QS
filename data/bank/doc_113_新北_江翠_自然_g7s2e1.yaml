    \    既然稱為「無籽」，這些無籽水果又怎麼繁殖？植物有很多不用種子繁衍後代的方式，通稱「★★」。★★就是以根、莖、葉等營養器官來作繁殖，無須透過生殖器官花朵授粉產生種子而繁殖。柑橘類或者葡萄等果樹，也能用「無性繁殖」的「☉☉」方式增加植株數量。當出現能穩定生產無籽果實的果樹，取下健康的枝條，插到土裡重新長根，或者接到其他同種的果樹上繼續生長。透過這樣的方式，就讓果實無籽的果樹產生新個體。如果是無籽西瓜，因為育種用的父系和母系親本都有繁殖能力，只要保存好親本，就可以一直繁殖無籽後代。"
