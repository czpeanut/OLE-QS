- id: doc_113_新北_江翠_自然_g7s2e1_s1_30
  section: 1
  number: 30
  type: single
  page: 4
  stem: 根據文章，下列敘述何者錯誤？
  options:
  - label: A
    content: 早期對無籽柑橘的定義，只要一顆柑橘果實內不到五顆種子，就會定義是無籽
  - label: B
    content: 鳳梨因為花朵小而且呈現長筒狀，在台灣少有昆蟲協助授粉，所以沒有種子
  - label: C
    content: 無籽西瓜因在培育過程中加入「秋水仙素」，因此食用前要充分洗淨，避免秋水仙素藥劑殘留
  - label: D
    content: 尖蕉的果實內有明顯的黑色種子，不屬於無籽香蕉。
  group_stem: "※請先閱讀下列文章，再依文章內容回答第30~35 題：(1-1~1-3)\n\n無籽水果解密》鳳梨結果免交配，無籽西瓜是畸形兒？\n\
    摘自上下游・2022/09/26\n    無籽西瓜、無籽葡萄、無籽桶柑⋯⋯因為要吐籽麻煩，許多水果都出現無籽的品種，但是「無籽」的定義與原理，可能大相逕庭！柑橘與葡萄的「無籽」方式就不一樣，鳳梨看似無籽，其實早已不知不覺把種子吃下肚，而西瓜是因為生出「畸形兒」，才無法有種子！俗稱的無籽水果，可能還是含有小小的種子。廣義的果實無籽是指「不包含任何發育成熟的種子」，不一定完全沒有種子。像文旦與鳳梨，大多數無籽，或仍有少數退化縮小的種子，但種子皆已沒有繁衍能力。\n\
    \    像原本就多籽的芭樂，種子比例明顯減少的品系或品種，就會被稱為「無籽芭樂」。早期對無籽柑橘的定義，「一顆柑橘果實內不到五顆種子，就會定義是無籽」。不過現在育種技術發達，所以現在市售無籽桶柑、無籽柳丁果實內幾乎完全無籽。這些通常是自然環境產生無籽果實的植株，「人類發現後，藉由育種不斷強化這些特性，來穩定產出無籽果實」。\n\
    \    鳳梨因為花朵小而且呈現長筒狀，在台灣少有昆蟲協助授粉，所以沒有種子。但鳳梨依舊能長出果實，「是因為它有『單為結果』的特性」，植物通常經過授粉才會產生種子，種子會刺激果實發育變大。而能「單為結果」的植物，可以「跳過」授粉這個步驟，如同處女生子，雌蕊沒有受精也一樣能長出果實。因為沒授粉，不會產生受精卵，果實就不含種子。\n\
    \    不僅是柑橘與鳳梨，西瓜也有無籽品種。但它們是藉由藥劑處理父系或母系的親本，讓產出的子代果實沒有種子。多數植物的染色體是成對的「二倍體」，如果植株染色體數目不成對，「授粉時染色體就無法順利配對，產生種子」。普通西瓜的生殖細胞染色體組具有※個染色體，經雌雄花受精後的新個體，體細胞染色體即變成＊個，稱為2\
    \ 倍體，即是普通西瓜。\n    無籽西瓜是讓其中一個親本的染色體受「秋水仙素」等藥劑刺激，可以使體細胞的染色體加倍，從二倍體變成「四倍體」，再用4 倍體西瓜作為母本，2\
    \ 倍體西瓜作父本，雜交後可得3 倍體，以3 倍體種子培育出來的西瓜，因為染色體數目變成單數，並非成對，染色體不能進行正常分裂，產生的果實就沒有種子。\n\
    \    市售的香蕉也是因為三倍體而使種子萎縮，增加食用方便性。「如果仔細看香蕉中心的黑子，就是沒有染色體未成對而敗育的種子」。現在食用香蕉通常是三倍體的華蕉品種，都是自然選育而成，並無使用藥劑。如果是像尖蕉等野生種香蕉，因為是正常二倍體，果實內還是有明顯的黑色種子。西瓜只有親本需要用到藥劑誘導，消費者吃到的子代在栽培過程中，不會再施用藥劑，長出的果實自然會種子萎縮，所以不會有任何殘留問題。\n\
    \    既然稱為「無籽」，這些無籽水果又怎麼繁殖？植物有很多不用種子繁衍後代的方式，通稱「★★」。★★就是以根、莖、葉等營養器官來作繁殖，無須透過生殖器官花朵授粉產生種子而繁殖。柑橘類或者葡萄等果樹，也能用「無性繁殖」的「☉☉」方式增加植株數量。當出現能穩定生產無籽果實的果樹，取下健康的枝條，插到土裡重新長根，或者接到其他同種的果樹上繼續生長。透過這樣的方式，就讓果實無籽的果樹產生新個體。如果是無籽西瓜，因為育種用的父系和母系親本都有繁殖能力，只要保存好親本，就可以一直繁殖無籽後代。"
