- id: doc_113_新北_江翠_自然_g7s2e1_s1_28
  section: 1
  number: 28
  type: single
  page: 3
  stem: 根據文章，下列關於昆蟲生殖行為的敘述，何者正確？
  options:
  - label: A
    content: 龍蝨在雌性生殖器蓋上交配栓，可完全避免雌性與其他雄性交配
  - label: B
    content: 人類參考日本虎鳳蝶與薄翅白鳳蝶的生殖行為，發明出金屬製貞操帶
  - label: C
    content: 雄性舞毒蛾和鍬形蟲科的雄性甲蟲在交配後會有交配後保護行動
  - label: D
    content: 負蝗即使不處於交配狀態，雄性仍一直停在雌性背上。
  group_stem: "※請先閱讀下列文章，再依文章內容回答第28~29 題：(1-3)\n\n昆蟲的貞操帶\n摘自PanSci・2016/04/30\n \
    \   陸上生物多以交配方式體內受精，對這些生物的雄性而言，自己的交配對象（雌性）很可能再與其他雄性交配。當人類面對這種狀況，通常會以忌妒表達自己的不安，相對於此，動物就沒那麼麻煩，牠們的做法較為澈底。為了留下自己的基因，牠們會不擇手段達成目的。最直接的方法就是在自己交配後，不讓雌性與其他雄性交配。人類自古發明了金屬製貞操帶，利用上鎖的內褲避免女方紅杏出牆，事實上，昆蟲也會利用相同手法。\n\
    \    一到早春季節就會現身的日本虎鳳蝶與薄翅白鳳蝶等小型鳳蝶，雄性會在交配期間將精子送進雌性身體的同時分泌黏液，在雌性生殖器蓋上交配栓（交配囊）。如此一來，即可避免雌性與其他雄性交配。遇到這類蝴蝶時，可從外觀清楚辨識出交尾後的雌性。龍蝨科的龍蝨是一種水生甲蟲，雌性身上也有交配栓，但雌性會用腳將其取下；這個行為看在與雌性交配的雄性對象眼裡，可說是情何以堪。\n\
    \    此外，另一種避免雌性與其他雄性交配的方法，就是一直與對方交配。毒蛾科的雄性舞毒蛾與雌性交配，將精子送進雌性體內後，身體仍與雌性相連。這個方式可以避免雌性受到其他雄性引誘，與其他雄性發生關係。除了上述交配後保護行動外，還有其他類型，例如即使不處於交配狀態，雄性仍一直停在雌性背上的頭蝗科負蝗，大多數鍬形蟲科的雄性甲蟲在交配後，仍然一直停在雌性背上，避免其他雄性接近雌性。"
  tags:
