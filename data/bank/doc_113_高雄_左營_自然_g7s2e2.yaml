  type: single
  page: 5
  stem: 關於血友病，下列敘述何者有誤？
  options:
  - label: A
    content: 如果媽媽患有血友病，則兒子必定為血友病患者
  - label: B
    content: 爸爸不會遺傳血友病等位基因給女兒
  - label: C
    content: 爸爸不會遺傳血友病等位基因給兒子
  - label: D
    content: 若不小心接觸血友病患者，不會因此而傳染血友病。
  group_stem: '【題組五】

    血友病是一種缺乏凝血因子而引起的疾病。在正常情形下，血液中的 13 種凝血因子會幫助血液凝固。通常人們所稱的血友病是 A 型血友病──缺乏第八凝血因子而引起的，具有遺傳性，患者以男性為主。此病幾乎只影響男性，因為它的等位基因在
    X 染色體上。

    血友病的特徵是傷口流血時凝固非常緩慢；自發性的出血較少見，通常是由創傷或外科手術引發的。瘀斑流血情形嚴重時，會導致休克。尿液和糞便中也時常含有血液。血友病患者大量出血時，必須先給予輸血，然後才是注射病患所缺乏的凝血因子。凝血因子可經由靜脈注射，也可借助於輸血方式供給；但最有效的方法是預防出血的發生，建議患者不要從事運動或危險的職業。'
  answer:
  - B
