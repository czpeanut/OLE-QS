  stem: 有關本文內容的解讀，下列何者最為恰當？
  options:
  - label: A
    content: 衛人擅長養猴，燕王以俸祿厚待之
  - label: B
    content: 衛人假借說詞，試圖延遲騙局被拆穿
  - label: C
    content: 燕王派遣鄭人探查衛人言語的真偽
  - label: D
    content: 猴子不堪衛人的高壓訓練，趁機逃走。
  group_stem: "（二）\n    燕王好微巧，衛人請以棘刺之端為母猴1.。燕王說之，養之以五乘之奉2.。王曰：「吾視觀客為棘刺之母猴。」客曰：「人主欲觀之，必半歲不入宮，不飲酒食肉，雨霽3.日出，視之晏4.陰之間，而棘刺之母猴乃可見也。」燕王因養衛人，不能觀其母猴。鄭有臺下5.之冶者，謂燕王曰：「臣為削者6.也，諸微物必以削削之，而所削必大於削。今棘刺之端不容削鋒，難以治棘刺之端。王試觀客之削，能與不能可知也。」王曰：「善。」謂衛人曰：「客為棘刺之母猴也，何以治之？」曰：「以削。」王曰：「吾欲觀見之。」客曰：「臣請之舍取之。」因逃。\n\
    出處：《韓非子·棘刺雕猴》\n註釋：1.又叫沐猴、獼猴。  2.春秋戰國時田地的區劃，以封地的賦稅作俸祿。  3.音ㄐㄧˋ，雨停天晴。   \n4.晴朗。\
    \            5.為國君服雜役的奴僕。                       6.製造刻刀的人。"
