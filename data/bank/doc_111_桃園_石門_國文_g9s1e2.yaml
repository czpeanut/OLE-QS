- id: doc_111_桃園_石門_國文_g9s1e2_s4_27
  section: 4
  number: 27
  type: single
  page: 4
  stem: 文中「葦管書柿葉」與「滿山柿葉正堪書」的「書」字，其詞性與下列何者不同？
  options:
  - label: A
    content: 大「書」特書
  - label: B
    content: 奮筆疾「書」
  - label: C
    content: 焚「書」坑儒
  - label: D
    content: 旅夜「書」懷。
  group_stem: "（一）\n    九降風又起，把米粉吹乾，也把柿子吹紅了。我最愛看那紅紅火火的小燈籠，沿著臺三線點燈，指向穠麗的秋色，加上天高氣朗，藍天映得柿色分外亮眼，活脫脫是張風景明信片，像是在說：「願柿柿圓滿，事事如意。」\n\
    \    柿子家大業大，品種約莫上千種，雖難一一指認，但可從「是否脫澀」分為「甜柿」和「澀柿」，後者須經過人工脫澀方能食用。說它「葉大」也是有根據的，《新唐書》記載，詩書畫名家鄭虔年少家貧，買不起紙練字，此時他想起慈恩寺儲存了幾大簍的柿葉，便取紅葉練字，把寺院裡的柿子葉都寫完了；勤苦習字的身影感動了許多人，後世的蘇東坡、楊萬里都有相關詩詞，如「葦管書柿葉」、「滿山柿葉正堪書」等。有時看見客家庄的圍牆上，晒著長條形的「筆柿」，真的像是座天然筆架，不知誰要來潤筆，寫琳瑯詩篇？\n\
    \    不寫詩，可以作畫。三合院前成排的圓籃裡，正晾晒著黃澄澄的柿餅，從高處俯瞰，人間圓滿，正像一幅構圖壯觀、比例均衡的好畫，再換個角度，站在棚架下還可欣賞光影的表演。\n\
    \    缺乏創作天分也無妨，就一起大快朵頤吧！我較喜歡脆柿，外圍鮮脆，但接近核心處為果凍似的Ｑ彈口感，如相貌硬氣的人，往往藏著最溫柔的心思；若看到果皮表面有層灰白的凝結物，別急著丟掉，那是珍貴的「柿霜」，為乾燥過程中滲出的糖分結晶，味性甘甜，能清熱潤燥，若跟紅棗、枸杞、黃耆一起煮湯，就是最棒的「秋日饗宴」。\n\
    \    柿葉凌霜更紅，柿子結霜更甜，似乎都在暗示著某些大道理，但秋光正好，說這些未免辜負，不如到草地上野餐，聽促織唧唧，竹蛉嘀嘀；總之遇柿也好，無事也罷，蟲兒堅信「知足常樂」，好好唱自己的歌，而我於歌聲中聽見寂靜，無處不清幽。\n\
    節錄自〈柿柿圓滿 世事平安〉／林念慈《人間福報》2022.10.3"
