    content: 粉塵若為有機過氧化物，得需要助燃物才能引發爆炸
  group_stem: "請閱讀以下文章後，試回答41、42 題：\n       西元 2023 年九月下旬，屏東科技產業園區發生一起重大爆炸事故，傷亡極為慘重，造成多名消防人員殉職、員工死亡，還有逾百名人員受傷。這場駭人聽聞的爆炸事件，根據相關的調查與專業人士推論指出，應該與粉塵爆炸及超標存放有機過氧化物—「二叔丁基過氧環己烷」有關。粉塵爆炸有原發性和繼發性（二次）之分，這次事故造成的傷亡都是第二次大爆炸產生，推測起因為工廠內的金屬粉塵、橡膠粉塵和其他作業灰塵被揚起，在原發性爆炸起火後，大量的有機過氧化物高溫燃燒，導致如西元2015\
    \ 年八仙樂園事件再現的人間煉獄。究竟，粉塵爆炸的原因和條件是什麼呢？又該如何預防？\n一、粉塵爆炸的要素\n粉塵爆炸是指懸浮的可燃粉塵顆粒瞬間快速燃燒的現象。可燃物、助燃物、熱能、懸浮擴散和侷限空間為構成粉塵爆炸的五要素。可燃性粉塵的定義泛指粒徑小於或等於500μm（能通過美國編號35\
    \ 的標準篩網)的固體物質，依成分大致可區分為下面幾類：1 煤粉、無機粉塵（如硫磺、碳化矽）。2 金屬(如鎂粉、鋁粉)。3 農產品(如小麥、稻穀、棉花、菸草、飼料)。4\
    \ 合成材料(如塑料、染料)。當可燃性的粉塵懸浮在空氣中，一旦接觸熱源被點燃，就會產生閃火(FlashFire)，閃火火焰的傳播速度相當快，當其被侷限在某一空間裡，燃燒反應瞬間釋放大量的能量，使周圍氣體急遽膨脹造成壓力急速上升便會導致爆炸。\n\
    二、粉塵自身條件的因素\n粉塵自身所含水分多寡、粒徑大小等條件也會影響爆炸程度。含水分多的粉塵，較易凝聚成較大的粒子，反應較不活潑，故不易爆炸，即便爆炸，也會因水分吸收部分的熱量，而減緩爆炸激烈程度。粉塵粒徑愈小，則表面積與質量的比愈大，愈容易氧化生熱，發生爆炸的可能性愈大。另外，如果粉塵的化學成分包含有機過氧化物或硝基化合物，因為結構本身就自帶活性氧，即使在沒有氧氣的狀況下也有可能發生爆炸反應。\n\
    三、粉塵爆炸的過程\n粉塵爆炸大致可分成三個過程：1 懸浮的粉塵在熱源作用下迅速地氣化產生可燃氣體。2 粉塵或可燃氣體與空氣混合而燃燒。3 因燃燒而產生的熱能迅速從粉塵中心處向外傳播，擴大燃燒範圍與爆炸規模。這種快速劇烈的連鎖氧化反應，其反應速率愈來愈快，通過劇烈的燃燒，最後形成爆炸。\n\
    四、總結\n預防粉塵爆炸一直都是最重要的安全課題之一。需落實火源管理、避免粉塵堆積、注意作業場所保持通風與維持溼度避免太過乾燥。部分特殊行業，會在粉塵風險高的地方，利用氮氣、二氧化碳等不可燃氣體來抑制燃燒，但仍需注意氣體濃度，避免人員無法呼吸。"
  answer:
  - B
