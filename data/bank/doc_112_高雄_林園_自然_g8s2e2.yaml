  stem: 臺中火力發電發出的電供應全臺大部分的用電量，而發電廠運轉需要燃燒大量的化石燃料，該廠區在下雨時所收集到的雨水，會使下列何種指示劑保持透明無色？
  options:
  - label: A
    content: 酚酞
  - label: B
    content: 酚紅
  - label: C
    content: 石蕊
  - label: D
    content: 溴瑞香草藍
  group_stem: "請閱讀以下文章後，試回答44、45 題：\n    自然界的大氣環境存有大量的二氧化碳，因二氧化碳易溶於水，降雨時，二氧化碳會與雨水形成碳酸，因此，雨水呈現弱酸性。而火山噴發產生的二氧化硫與閃電產生的氮氧化物（NO、NO2）等，溶於雨水之後，會形成酸性更強的亞硫酸（$H_{2}SO_{3}$）、硝酸（$HNO_{3}$）等物質，在水中解離產生氫離子（$H^{+}$），提高雨水的酸性，使得雨水\
    \ pH 值降至 5.0 左右。而人類因為科技發達，生活所需使得汽、機車、工廠、火力發電廠等在運轉過程中排放出大量的氮氧化物氣體，這些氮氧化物遇到雨水後也會形成酸雨。\n\
    \  下圖是根據環境資源資料庫網站的資料彙整而成。圖形顯示鞍部觀測站從西元 2016 年 1 月至 2017 年 12 月，2 年期間雨水月平均 pH 值的變化關係。晏倫將常見的酸鹼指示劑在\
    \ pH 值變色範圍時的情形整理如下表。\n\n| 名稱 | 酸 | 鹼 | pH 變色範圍 |\n| :--- | :---: | :---: | :---:\
    \ |\n| 酚酞 | 無 | 紅 | 8.3～10.0 |\n| 酚紅 | 黃 | 紅 | 6.4～8.2 |\n| 石蕊 | 紅 | 藍 | 5.4～8.0\
    \ |\n| 溴瑞香草藍 | 黃 | 藍 | 6.2～7.6 |\n\n表：酸鹼指示劑的 pH 值變色範圍"
  shared_asset: g1_44_45
  answer:
  - A
  answer_source: answer_key_vlm
