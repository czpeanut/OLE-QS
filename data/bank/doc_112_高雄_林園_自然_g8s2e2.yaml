  stem: 「阿瑞尼斯的電離說一提出來以後，立即遭到許多知名化學家的嘲笑和堅決反對。他們認為食鹽水是很安定的水溶液，但氯是一種黃綠色有毒氣體，如果鹽水中有氯離子，為什麼鹽水是無色的，而且沒有毒？且鈉一遇到水就會發生強烈反應，如果鹽水中有鈉離子，為什麼一點反應也沒有？」以上敘述，關於原子與離子性質不同的原因應如何解釋？
