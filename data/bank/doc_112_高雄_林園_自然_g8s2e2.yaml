  section: 1
  number: 41
  type: single
  page: 4
  stem: 下列關於粉塵爆炸的敘述，何者正確？
  options:
  - label: A
    content: 寬廣的空間讓粉塵得以擴散、燃燒，是構成粉塵爆炸的要素之一
  - label: B
