- id: doc_111_彰化_埤頭_社會_歷史_g8s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: '《武媚娘傳奇》這部電視劇描述了一代女皇武則天的傳奇一生，下面是在劇中所看到唐代的日常生活，請問這可以說明唐代哪種現象？

    資料一：西域各國所特有的音樂、技藝源源不絕地傳入中國。甚至朝廷正式典禮所用的音樂也以胡樂為主。民間與宮廷流行的休閒娛樂有擊鞠、繩技、胡旋舞等。

    資料二：唐代與域外的文化交流，可從當時的長安及洛陽城內人們的生活看出，他們崇尚西域的風氣，如服飾裝束方面以西域各國的裝飾為美，崇外成為當時的潮流。'
  options:
  - label: A
    content: 利用武力征服周遭國家，強迫西域諸國接受唐代文化
  - label: B
    content: 派遣使者四處宣揚文化，並將西域納入儒家文化圈
  - label: C
    content: 以武力推動西方文化的傳布，形成兼容並蓄的文化
  - label: D
    content: 因能夠容納各種文化，而使唐朝文化呈現多元色彩。
