    content: 行政法規
  group_stem: 上個月胖虎剛滿 18 歲，積極地向監理站報考機車駕照考試，在順利通過考試後，監理站便發給胖虎機車駕照。拿到駕照的胖虎十分開心，便邀約好友們一同到台南漁光島遊玩，行車一時疏忽沒注意交通號誌，不小心闖了紅燈，還衝撞到過馬路的行人，導致路人與胖虎皆跌倒在地，機車也倒地受損。所幸，雙方僅是皮肉傷並無大礙，在警察抵達現場後依《道路交通管理處罰條例》對胖虎開出
    1800 元闖紅燈的罰單，依法登記違規點數 3 點。一想到後續還需要面對傷害與賠償等問題，胖虎無奈感嘆！唉…原來太開心、太隨便容易闖禍，是真的！
