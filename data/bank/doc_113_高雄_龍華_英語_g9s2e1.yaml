  stem: Which is NOT true about the chip-making market?
  options:
  - label: A
    content: Taiwan has the most engineers that design tools for making chips.
  - label: B
    content: A great chip is usually made by thousands of excellent engineers.
  - label: C
    content: Taiwan can make chips smaller than those made in South Korea and China.
  - label: D
    content: There are not enough experienced engineers in Taiwan by now.
  group_stem: 'Special Edition New York

    Taiwan News

    Magic Mountains That Protect Taiwan

    Taiwan is a special country famous for making chips that lead the market. Many
    of the chips used in Apple cellphones are produced in Taiwan, and even sports
    cars that are built around the world need these chips. For this reason, people
    in Taiwan believe that these chips work like magic mountains which protect their
    country.

    In fact, Taiwan is not the only country that can make chips. The USA is still
    the most important country in chip-making because most expert engineers and the
    special tools used to design chips come from there. Other countries, such as South
    Korea and China, are trying very hard to lead the chip market. So, is it possible
    for the magic mountains that protect Taiwan to hold this lead?

    The answer is yes. The cellphones become smaller, so we need smaller chips that
    use less energy. Taiwan is the country that can make the smallest and the most
    useful chips. Other countries try to poach engineers by offering much more money,
    but a great chip is usually made by thousands of expert engineers, not just two
    or three engineers.

    However, Taiwan still has a serious problem producing chips. There are not enough
    engineers with the experience and knowledge needed in chip-making. More than 36,000
    engineers need to be trained to help Taiwan stay on top of the market. Hundreds
    of schools across Taiwan are working hard for this goal, hoping that the magic
    mountains that protect Taiwan will continue to shine.

     chip 晶片 energy 能源'
