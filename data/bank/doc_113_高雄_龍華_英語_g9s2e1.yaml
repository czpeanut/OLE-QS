- id: doc_113_高雄_龍華_英語_g9s2e1_s2_49
  section: 2
  number: 49
  type: single
  page: 7
  stem: According to the comic, what is the most likely meaning of "talk turkey"?
  options:
  - label: A
    content: To know how to cook turkey.
  - label: B
    content: To speak straight and honestly.
  - label: C
    content: To use language to trick others.
  - label: D
    content: To talk to people during Thanksgiving.
  group_stem: '① Long time ago, there was a story about “Talk Turkey” in America.

    ② An Indian and a white man went hunting together. Let’s go halves on what we
    get.

    ③ After hours of working hard…

    ④ It’s getting dark. We should finish the hunting.

    ⑤ We got a bird and a turkey. It’s not too bad, right? Let’s go fifty-fifty. That’s
    what we’ve agreed.

    ⑥ I want to take the big fat turkey, but what should I do if he says no to me?
    Let me play the trick on the words to make him believe it’s a game.

    ⑦ Now, let’s put an end to this. It’s either you take the bird, or I take the
    turkey. Isn’t that a good idea?

    ⑧ I know there must be something wrong. I’m poor in English, but I’m not stupid.
    He should be honest and tell me what he is thinking about.

    ⑨ Ugh! You don’t talk turkey to me.

    ⑩ I won’t go hunting with you next time!

    ⑪ OMG. He got the drift. He won’t believe in me anymore.

    ⑫ This is one of the stories about the origin of Talk Turkey.

     Indian 印地安人 origin 來源'
  shared_asset: g2_49_50
