  group_stem: 'Chris is going to graduate from school. Before working in a company,
    he decides to get some work experience, and he is now thinking about getting a
    part-time job during the summer vacation. So, he asks his friends about their
    part-time jobs.


    Emily: Telephone staff at the cram school.

    - The job is easy but boring; you call someone and ask them, “Would you like to
    come to our cram school?” If they are interested, make an appointment for them
    to visit.

    - NT$170 per hour.

    - Three days a week and 5 hours a day.


    Sophia: A trainer at the gym in a five-star hotel.

    - You can exercise at the gym in the free time.

    - You can have free staff meals.

    - Good pay, NT$350 per hour, but you can only work for about 10 hours per week.

    - Speaking English well is very important.


    Edward: A kitchen helper at a hot pot restaurant.

    - Wash dishes only.

    - You can have free staff meals, either lunch or dinner.

    - NT$150 per hour, 20 hours a week.

    - You may have skin problems, such as peeling, from washing dishes for too long.


    Donald: The waiter at the sushi store, “Sushiro.”

    - NT$250 per hour, 15 hours a week.

    - Lead people to their seats.

    - Take orders.

    - Make sure everyone has a good experience.

    - Show your staff card, and you will get a 20% discount at the store.


     staff 員工 appointment 預約 per 每一 skin 皮膚 discount 折扣'
