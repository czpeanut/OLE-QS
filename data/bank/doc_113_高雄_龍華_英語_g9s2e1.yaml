  type: single
  page: 4
  stem: According to the reading, which of the following is the LEAST possible to
    be used to describe an “It girl”?  according 根據
  options:
  - label: A
    content: Cool.
  - label: B
    content: Beautiful.
  - label: C
    content: Famous.
  - label: D
    content: Common.
  group_stem: 'You have probably heard people call a female star an “It girl.” Do
    you know that “It girl” has existed in English for almost a hundred years? Look
    below and learn more about it.


    1920s: • It is believed that back in the 1920s, Elinor Glyn (1864–1943), an American
    screenwriter, coined “It girl” to describe American actress Clara Bow. Bow became
    famous because of movies such as It (1927).

    1990s: • It girls are beautiful female stars or fashionable young women. Take
    Tamara Beckwith, for example. She has been seen on many TV shows, so she was often
    called an It girl by people in the UK in the 1990s.

    2000s: • Paris Hilton is another It girl. She was an important person in the fashion
    business in the 2000s.


    Therefore, it is easy to see that “It girl” is often used to describe some famous
    stars and other public figures.

     female 女性的 exist 存在 screenwriter 電影編劇 coin 首次使用 describe 形容 figure 人物'
