  stem: （克漏字第36格）
  options:
  - label: A
    content: a study shows that it can be true
  - label: B
    content: many people think this idea is wrong
  - label: C
    content: no doctor has looked at this before yet
  - label: D
    content: other studies show different things
  group_stem: 'Memory Movie

    It is said that all of a person’s memories may show up like a movie or a TV program
    in their mind before they come to the end of their life. To our interest, 36 .
    Some doctors at Vancouver General Hospital took a closer look at the brain waves
    of an 87-year-old patient in the computer when he died of a heart attack. The
    team noticed a strongly working brain 30 seconds before and after his heart stopped.
    37 . The finding made the doctors guess that the man could have replayed his life
    memories. However, 38 . Even so, this finding still gave a good start for more
    studies on people’s death experiences. Perhaps it is sad to face the fact that
    our loved ones can’t be with us anymore, 39 .

     patient 病患 replay 重播'
