  group_stem: 'Bullying is a problem that many people face. It can hurt people for
    a long time. Today, bullying happens everywhere, mostly on the Internet. The following
    are some good habits you should build to keep yourself safe.

    First of all, don’t post your information online. Once you post it, 32 . Bad people
    can hurt you with a copy of that. Second, set up your privacy on social media.
    You should choose who can see what you post. Also, remember to only keep your
    password to yourself. 33 . Besides, don’t forget to log out when you finish using
    a public computer because your information can be shared all over. What’s more,
    don’t pay attention to bullies. Don’t let people who want to hurt you make you
    feel bad. If you don’t say anything to them, they will probably stop because you
    don’t fight back. 34 , you can call the police or tell someone you believe. You
    should let others know what is happening and ask for help. Also, 35 who are being
