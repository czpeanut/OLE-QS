- id: doc_113_新北_崇林_國文_g7s2e2_s4_6
  section: 4
  number: 6
  type: single
  page: 2
  stem: 「倒反」是言詞表面的意思和內心本意相反的技巧，下列選項的小說對白，何者使用了「倒反修辭」？
  options:
  - label: A
    content: 「說！他罵你們什麼？」余滄海冷聲道。「他說，他說我們是狗熊野豬，青城四獸。」就聽哐的一聲，茶杯被摔得粉碎。「真是豈有此理！哼！他岳不群教的好徒弟！」──笑傲江湖
  - label: B
    content: 張翠山長跪不起，道：「可是弟子的媳婦來歷不正。她……她是天鷹教殷教主的女兒。」張三丰仍是捋鬚一笑，說：「那有什麼關係？只要媳婦兒人品不錯，也就是了，便算她人品不好，到了咱們山上，難道不能潛移默化她嗎？」──倚天屠龍記
  - label: C
    content: 楊過說道：「我郭伯伯也叫柯公公照顧我，他卻差點殺了我……你既不想殺我，又沒有看不起我，對我也沒有壞心，沒有企圖。你還照顧我、救我，你對我當然是很好的，不是嗎，姑姑？」──神鵰俠侶
  - label: D
    content: 他擲出的勁道雖然不大，但使力恰到好處，江南六俠在一旁看了佩服得五體投地。黃蓉甚是得意，悄聲向郭靖道：「靖哥哥，我爹爹的功夫怎樣？」郭靖道：「令尊的武功出神入化，蓉兒，你回去之後，莫要貪玩，好好跟著學。」──射鵰英雄傳
  tags:
    chapter:
      publisher: 康軒
      book: 七下
