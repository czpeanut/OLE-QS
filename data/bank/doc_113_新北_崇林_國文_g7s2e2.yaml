  stem: 關於背影的文意，哪一個選項分析正確？
  options:
  - label: A
    content: 作者看到父親賣力攀爬月台買橘子的努力身影，因即將與父親分離而感傷落淚
  - label: B
    content: 「我那時真是聰明過分，總覺得他說話不大漂亮，非自己插嘴不可。」作者為自己舉動自豪不已。
  - label: C
    content: 作者說道：「爸爸，您走吧！」其父望車外看了看，說：「我買幾個橘子去，你就在此地不要走動」父親本可先行離去，但興起買幾個橘子去的念頭，是還想為兒子做點事，為他準備在路上吃的東西。
  - label: D
    content: 「信中說到：『我身體平安，惟膀子疼痛得厲害，舉箸提筆，諸多不便，大約大去之期不遠矣』，我讀到此處，在晶瑩淚光中，又看見黑布馬掛的背影。」作者在父親來信中感受父愛的溫暖，不禁喜極而泣。
