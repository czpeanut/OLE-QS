  section: 4
  number: 6
  type: single
  page: 1
  stem: "黑雲翻墨未遮山，\n白雨跳珠亂入船。\n卷地風來忽吹散，\n望湖樓下水如天。\n                        蘇軾〈望湖樓醉書〉\n\
    這是一首描寫暴雨的古詩，和〈田園之秋選〉文章內容比較後，下列選項中的分析何者錯誤？"
  options:
  - label: A
    content: 「黑雲翻墨」即是文章中的「無數黑怪」
  - label: B
    content: 「白雨跳珠」描寫的同是文章裡的「大雨」
  - label: C
