    (甲)己卯五月初三日夜，夢與人晤談，言讀書窮理，甚費精神，譬如磨刀，刀日犀利，然鏽去而鐵漸減。曰：「然則欲保養精神，將廢學乎？」曰：「不然。不磨則鏽日深，刀且斷爛，欲求其減，胡可得也？」

    (乙)臥病而起，靜坐調息，見日光斜入帳中，如二指許，因以息候之，凡再呼吸，而日光盡矣。因念逝者之速如此，人安可一息不讀書，安可一息不進德？為之情然太息。

    陸世儀〈札記二則〉'
