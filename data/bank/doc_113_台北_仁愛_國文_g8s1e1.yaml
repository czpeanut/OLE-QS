  type: single
  page: 1
  stem: 關於〈田園之秋選〉一文的敘述，下列何者正確？
  options:
  - label: A
    content: 「只覺得滿天無數黑怪，張牙舞爪，盡向地面攫來」：以黑怪來形容雷電的恐怖形象
  - label: B
    content: 「在荒野中的人，此時沒有一個不是被震懾得氣脫委頓，匍匐不能起的」：描寫烏雲密布，烘托西北雨的威勢
  - label: C
    content: 「牛群在原野上狂奔，羊群在哀哀慘叫，樹木在盡力縮矮，哪個敢把手舉得最高，頭伸得最長，定立時被劈殺」：強調豪大雨具備「一夫當關，萬夫莫敵」的威勢
  - label: D
    content: 「遇到這樣氣勢萬鈞的大西北雨前奏，誰也不能逞英雄，因為此時在天地之間除了它是英雄之外，不准有第二個人是英雄」：大自然的威力巨大，人更顯得渺小。
