  stem: 下列文句皆選自上文，何者所省略的主語並非是后羿？
  options:
  - label: A
    content: 斷修蛇於洞庭
  - label: B
    content: 置堯以為天子
  - label: C
    content: 殺九嬰於凶水之上
  - label: D
    content: 上射十日而下殺猰貐。
  group_stem: '帝俊賜羿彤弓素矰，以扶下國，羿是始去恤（1）下國之百艱。逮至(2)堯之時，十日並出，焦禾稼，殺草木，而民無所食。猰貐、鑿齒、九嬰、大風、封豨、修蛇，皆為民害。堯乃使羿誅鑿齒於疇華之野，殺九嬰於凶水之上，繳(3)大風於青邱之澤，上射十日，而下殺猰貐，斷修蛇於洞庭，擒封豨於桑林。萬民皆喜，置堯以為天子。


    選自《淮南子·本經訓》


    (1) 恤：救助。

    (2) 逮至：及、到了。

    (3) 音ㄓㄨㄛˊ，射出繫了生絲線的箭。'
