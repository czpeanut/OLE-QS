  stem: '下列表格是有關神話與寓言的比較，何者敘述正確？


    | | 神話 | 寓言 |

    |---|---|---|

    | (A) | 遠古人民的口頭創作 | 寄託之言 |

    | (B) | 把抽象的道理寄託在故事中 | 描述天地萬物的變化無常 |

    | (C) | 使人領悟，達到勸諭的效果 | 通過想像，解釋無法理解的現象 |

    | (D) | 〈濫竽充數〉比喻拿不好的東西來充場面 | 〈夸父追日〉就是其中之一，勸人切勿好高騖遠 |'
  options:
  - label: A
    content: 神話：遠古人民的口頭創作；寓言：寄託之言
  - label: B
    content: 神話：把抽象的道理寄託在故事中；寓言：描述天地萬物的變化無常
  - label: C
    content: 神話：使人領悟，達到勸諭的效果；寓言：通過想像，解釋無法理解的現象
  - label: D
    content: 神話：〈濫竽充數〉比喻拿不好的東西來充場面；寓言：〈夸父追日〉就是其中之一，勸人切勿好高騖遠
- id: doc_113_屏東_中正_國文_g7s1e1_s3_9
  section: 3
  number: 9
  type: single
  page: 2
  stem: 「摹寫法」是將對事物的各種感覺（如顏色、形狀、氣味、口感、聲音等感受），由作者主觀透過視覺、聽覺、嗅覺、味覺、觸覺等五種感官，以文字細膩描摹形容的修辭技巧。下列何者並非摹寫修辭？
  options:
  - label: A
    content: 荷塘四面長著許多樹，蓊鬱的路旁是楊柳和不知名的樹
  - label: B
    content: 日頭赤炎炎，來一瓶透沁涼的冰鎮飲料，既解熱又消暑
  - label: C
    content: 兩人在楊桃樹下，摘著果子一個一個嘗，發覺都是澀澀苦苦的
  - label: D
    content: 師父說過，若她這一生要過得平安順遂，務必「封眼不看、是非不聽」。
