- id: doc_113_屏東_中正_國文_g7s1e1_s4_1
  section: 4
  number: 1
  type: single
  page: 3
  stem: 下列詞語，何者最能描述上文中作者父親向阿樹伯借錢時的情形？
  options:
  - label: A
    content: 無言以對
  - label: B
    content: 羞於啟齒
  - label: C
    content: 借題發揮
  - label: D
    content: 轉移話題。
  group_stem: '有一年，我已經二十幾歲，在學校沒有認真讀書，沉迷賭博，積欠別人一千五百元的賭債，那時的一千五很大，恐怕相當於現在的五千元。我沒有弄錢的地方，回家去，騙父親說我要買書，父親低頭沉吟甚久，叫起我，說：「走吧！我們去向阿樹伯借！」


    我跟在他後面，那時太陽很大，我走在後面，看他不住的揮汗，背有點駝。到了阿樹伯家，他們一家人正在忙碌的工作，把剛晒乾的稻穀用風鼓吹去沙粒與壞穀，然後用布袋裝起來，滿滿的一個大晒穀場，恐怕有兩三百袋。阿樹伯問父親有什麼事，父親嘿嘿乾笑兩聲，欲言又止，看樣子很難啟齒，阿樹伯又追問一次，他說沒有什麼，就去幫他們的忙，也示意我一起幫著工作，工作中，父親出現好幾次欲言又止的場面，最後還是把話嚥了下去。一直到工作做完，天都黑了，父親背對著阿樹伯，才怯怯的把話說出來。


    我拿到那一千五百元，心都碎了，但仍然裝作若無其事。回家的路上，父親像做完一件大事似的，很輕鬆的講一些趣事。我把手插在褲袋裡，捏著那一千五百元，捏成一團，錢都被我的手汗弄溼了。


    回到家，我就說我要走了。父親看看我，說：「好，你要認真讀書，不要擔心錢的事！」說完，他從衣袋裡掏出三張老舊的卻摺疊整齊的十元鈔票，塞在我手裡，說：「阿爸只有三十元，你拿著，可以吃冷吃熱！」我說不必了，把他的手挪開，客客氣氣強忍著跟家人話別，然後轉身在黑暗中離開家門，一路走，一路哭，一直哭到車站。


    一直到今天，父親仍然不知道這件事，我也從未對誰說過，但我記得很是清楚，一點一滴，一枝一節，都歷歷在目，永難忘懷。回到學校，把錢還給人家，然後把自己關在斗室裡，從此變成另外一個人。


    改寫自洪醒夫〈父親大人〉'
