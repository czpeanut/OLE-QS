- id: doc_113_屏東_中正_國文_g7s1e1_s3_21
  section: 3
  number: 21
  type: single
  page: 2
  stem: '甲、如果我是一隻□□ / 我會放棄自由嬉戲 / 我選擇永不停息地把橄欖枝銜到戰爭國度。

    乙、我凡走過必留下痕跡 / 留下白白的腳印 /我以我的蒼白 / 為你們掩飾錯誤 /你們不但不感謝 /非得要我

    把五臟六腑掏空 / 才肯罷休。--□□□

    根據以上甲乙兩首新詩的詩意，猜猜看：在空格中，依序填入何者才是正確的？'
  options:
  - label: A
    content: 喜鵲 / 橡皮擦
  - label: B
    content: 鴿子 / 立可帶
  - label: C
    content: 鳳凰 / 白膠帶
  - label: D
    content: 麻雀 / 豆豆貼。
