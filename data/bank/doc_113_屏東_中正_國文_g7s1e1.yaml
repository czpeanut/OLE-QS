- id: doc_113_屏東_中正_國文_g7s1e1_s4_4
  section: 4
  number: 4
  type: single
  page: 4
  stem: 根據上文，最能享受甜蜜的兩人世界的是哪一個星座？
  options:
  - label: A
    content: 金牛座
  - label: B
    content: 天秤座
  - label: C
    content: 雙魚座
  - label: D
    content: 牡羊座。
  group_stem: '◎以下是部分星座運勢說明，請詳細閱讀並回答問題：


    【牡羊座】

    整體運★★★★★ 愛情運★★★★★

    事業運★★★★☆ 財富運★★★★☆

    今日短評：愛情平順，心花怒放。

    整體運分析：

    戀愛成熟者可望修成正果；已婚者有機會得與另一半約會，重溫戀愛時的浪漫與激情。有儲蓄的概念，中看不中用的物品不會抱回家，能夠節省不少支出。閒暇時看看關於理財方面的書籍，受益匪淺。


    【金牛座】

    整體運★★★★☆ 愛情運★★★★☆

    事業運★★★☆☆ 財富運★★★★★

    今日短評：伴侶小別勝新婚。

    整體運分析：

    情侶別後小聚，兩人彷彿又找到了當初戀愛時的那份心動與甜蜜；財運很好，賺得荷包滿滿，不妨拿出一部分邀約朋友，讓他們分享你的喜悅；和小朋友玩益智類遊戲，在童真中享受一段美好時光。


    【天秤座】

    整體運★★★☆☆ 愛情運★★☆☆☆

    事業運★★★☆☆ 財富運★★★★☆

    今日短評：吃喝玩樂機會多，易引起腸胃不適。

    整體運分析：

    約會、應酬是今天的主調，朋友相聚不亦樂乎，也讓你大飽了口福，不過，嘴巴過癮了，胃卻要受折騰，隨身攜帶幫助消化的藥物是明智之舉。感情會有小小波動，多是因為親信旁人的讒言，不信任另一半所造成。


    【雙魚座】

    整體運★★★☆☆ 愛情運★★★☆☆

    事業運★★☆☆☆ 財富運★★★★☆

    今日短評：運勢平順，有些小事情需要處理。

    整體運分析：

    今天是放鬆身心的日子，可以玩網路遊戲，讓你沉醉在遊戲的情節，有身臨其境的感覺；也可以看看經典的武俠小說，能喚起你心中成為英雄美女的夢想，讓你感懷生活，激發對美好明天的憧憬。'
