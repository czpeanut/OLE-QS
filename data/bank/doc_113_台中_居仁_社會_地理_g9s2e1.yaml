  stem: 某報導指出：「臺灣曾是日本香蕉的主要供應國，但輸日數量衰退，至 2014 年僅占日本市場 1%。主要原因之一是日本市場開始要求小包裝分切的香蕉時，臺灣沒有意識到跟隨日本市場變化加以調整。有一家美商公司因應日本客戶要求，在菲律賓種香蕉，提供小包裝產品。」此則報導內容，最可能反映出現代農業的哪些發展趨勢？（甲）糧食自給率低（乙）受市場需求影響大（丙）有機農業的盛行（丁）適地性的經營調整（戊）跨國產業的投資增加。相關正確的有：
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 丙丁戊
  - label: C
    content: 乙丁戊
  - label: D
    content: 甲丙戊。
- id: doc_113_台中_居仁_社會_地理_g9s2e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: '人口紅利是指一地在一個時期內出生率下降、勞動人口比例提高，且老年人口未達高比例之前，此時期國家的勞動力充足、壯年負擔較輕；統計上定義：扶養比小於
    50%為人口紅利時期，反之則為人口負利階段。右表 2 為 1990～2020 年四個國家的人口扶養比（%）資料，


    表 2

    | 國＼年代 | 1990 | 1995 | 2000 | 2005 | 2010 | 2015 | 2020 |

    |---|---|---|---|---|---|---|---|

    | 甲 | 48.7 | 49.9 | 49.5 | 50.1 | 50.9 | 57.8 | 62.4 |

    | 乙 | 90.6 | 85.1 | 81.4 | 80.1 | 79.1 | 80.9 | 78.7 |

    | 丙 | 71.7 | 68.6 | 64.2 | 59.9 | 56.0 | 51.6 | 48.7 |

    | 丁 | 62.0 | 64.4 | 59.7 | 53.8 | 49.5 | 45.6 | 46.9 |


    其中哪個國家經歷過人口紅利階段、又進入人口負利階段？'
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。
