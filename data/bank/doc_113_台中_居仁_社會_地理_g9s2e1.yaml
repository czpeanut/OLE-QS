- id: doc_113_台中_居仁_社會_地理_g9s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 臺灣某社區「包含了三個里，是農村也是漁村，早期還曾經是鹽村，進入這個社區映入眼簾的，除了縱橫遍布的引水溝渠，就是聚落房舍及屋外的剝蚵棚，簡單搭建的剝蚵棚裡，手腳俐落的居民熟練地將蚵殼剝開挑出牡蠣。社區信仰中心座落在社區中間一帶，每年農曆6
    月底廟會活動的前幾天，居民開始尋找合適的竹子、玻璃瓶和泥土自製火燈，活動當天晚上，居民一起舉著火燈跟著神明在村莊四周遶境，以祈求未來一年的平安順利。這個社區，其社區營造可說在百年前就已經開始…
    … 」社區附近有可能出現的地名有哪些？
  options:
  - label: A
    content: 竹子林、頭窩、店仔
  - label: B
    content: 過溝仔、塭仔、鹽地仔
  - label: C
    content: 坑子內、澳底、崎腳
  - label: D
    content: 松子腳、社尾城、栗子崙。
