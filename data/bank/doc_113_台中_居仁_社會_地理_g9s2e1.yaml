  number: 2
  type: single
  page: 1
  stem: 2019 年3 月彰化市一間名為「彰化百貨」的百貨行歇業，各媒體紛紛報導此事，並以「彰化市為什麼沒有百貨公司？」為題，訪問居住在當地的路人，近九成提到：彰化人比較常去臺中市區逛百貨公司。上述現象可以推斷（甲）彰化人的消費能力高於臺中（乙）臺中—彰化為共同生活圈（丙）臺中市區人口密度大於彰化市（丁）彰化市人口社會增加率為負值。正確的有：
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 丙丁
  - label: C
    content: 乙丙
  - label: D
    content: 甲丁。
