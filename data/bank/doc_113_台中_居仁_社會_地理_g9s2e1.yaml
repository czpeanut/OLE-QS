  stem: 有報導指出：「核能發電的成本較低，且排碳量低，被視為乾淨且有效率的能源，但也存在一些限制與不確定性。」政府在2014 年宣布封存核四，2021 年民眾也否決重啟核四的公投提案。若從臺灣自然環境特性的觀點，下列哪項是臺灣發展核能發電最主要的限制與不確定性因素？
