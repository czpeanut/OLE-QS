- id: doc_113_台中_居仁_社會_地理_g9s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 竹塹城曾是淡水廳的首府，根據《淡水廳志》:「重陽前後三四日忌九廟風，又名九降風。凡颶風多挾雨，九降恆不雨。」上述記載描述了落山的九降風具有風強乾燥，在地居民常利用此風從事米粉、柿餅的農產加工生產，下列哪些條件與此氣候現象的形成無關？
  options:
  - label: A
    content: 蒸發量較大
  - label: B
    content: 位於背風坡
  - label: C
    content: 地勢較平坦
  - label: D
    content: 位於臺灣海峽最窄處。
