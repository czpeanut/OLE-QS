  type: single
  page: 4
  stem: '當都市中的建築物高度（H）愈高，或是街道寬度（W）愈窄時，則低風速的問題會更加明顯。我們常以街道高寬比，即H/W，來描述密集都市中類似峽谷的街道幾何型態：H/W
    較高的稱為深街谷，較小的稱為淺街谷。當建築物間距很大時（如H/W=0.35），風可以順利流經兩棟建築之間，使氣流和建築物的接觸面積大，能夠有效將建築及空地上蓄積的熱量帶走。當建築物間距減少時（如H/W=1），屋頂上方的氣流會躍過建築而較難進入街道峽谷內，使風速降低。如果建築物極端緊密且棟距狹小（如H/W=4），風幾乎無法進入街谷之中，行人層將會呈現無風的狀態。

    以下為H/W 為4、1、0.65 與0.35 的街谷狀態圖，請問下列何者最有可能是H/W=0.65 的街谷狀態？'
