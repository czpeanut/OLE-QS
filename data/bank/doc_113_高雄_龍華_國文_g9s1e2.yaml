    content: 「無中生有／不止不休」——暗指李白有天馬行空的想像力
  - label: B
    content: 「而今黃河反從你的句中來」——李白寫黃河之句，成為現今許多人對黃河的印象
  - label: C
    content: 「你曾是黃河之水天上來」——點出黃河之名源自神話故事，帶有古老神祕的氛圍
  - label: D
    content: 「黃河西來，大江東去／此外五千年都已沉寂」——李白死後，就沒有關於黃河流域的優秀作品出現
