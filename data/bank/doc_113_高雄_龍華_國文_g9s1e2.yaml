  stem: '在臺灣現代主義運動的陣營裡，余光中用功之深，書寫之勤，似乎少有出其右者。能夠臻於如此境界的原因，乃在於他不只熟悉傳統與現代，也在於他同時能夠出入於東方與西方之間。他擅長做對位式的閱讀（contrapuntal
