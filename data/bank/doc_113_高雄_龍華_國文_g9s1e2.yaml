  stem: 網友常以諧音雙關的方式幽默回覆未知昆蟲的詢問，例如：「這是能蟲，能蟲屬於昆蟲綱鞘翅目，雜食凶殘，體內有病毒。在唐朝就已經出現，被劍客李白一劍殺死。有文獻記載：『要是能蟲來，我要選李白。』」這種方式看似正經，實則惡搞。下列哪一則回覆並非採用諧音雙關的手法？
  options:
  - label: A
    content: 這是會蟲，會蟲屬於昆蟲綱膜翅目，喜歡群體活動，經常出現在潮濕的地方。傳說中它們能預測天氣變化，有俗語說：「會蟲一出，風雨會來。」
  - label: B
    content: 這叫萬蟲，非常凶猛，常成群佔據山頭，猴子會用吼叫警告山上已被萬蟲佔據，提醒同伴趕快離開。因此有詩云：「兩岸猿聲啼不住，輕舟已過萬蟲山。」
  - label: C
    content: 這叫客蟲。屬於半翅目，獵捕時非常兇殘，用體內毒素慢慢殺死獵物，最早被唐朝詩人賀知章發現，並寫詩：「兒童相見不相識，笑問客蟲何處來。」
  - label: D
    content: 畫家林老先生平時善於畫佛像，已經到出神入化的境界，但奇怪的是只要供奉他畫的佛像都會長蟲，於是後人把這蟲稱為：林老入化蟲
