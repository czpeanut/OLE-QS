- id: doc_113_高雄_龍華_國文_g9s1e2_s2_36
  section: 2
  number: 36
  type: single
  page: 6
  stem: 文章結尾提到「只要她開心，就讓她開心吧！」這句話表現了作者的哪種情感轉變？
  options:
  - label: A
    content: 從控制母親到尊重母親的選擇
  - label: B
    content: 從對母親的反感到無奈的接受
  - label: C
    content: 從忽視母親到努力滿足她的需求
  - label: D
    content: 從不理解母親到完全體諒她的無奈
  group_stem: '你相信一道「宮保雞丁」改變了我對孝順的定義嗎？

    我的母親是一個已經九十七歲的孩子，在需要關注的同時，她也需要自由。老年人因器官、肌肉各方面的退化而引致的各種疼痛，常令身邊照顧的人十分無奈。我們察覺到她有時會稍稍誇大她的疼痛以博取注意和同情，但我們也明白活太老其實並非是件快樂享受的事。尤其是當老人家腦子依然清楚，但身體各方面跟不上的時候，憤怒、懊惱、害怕等等令日子更不好過的情緒一定是免不了的。

    白天母親需要有足夠的回籠睡眠，所以我在外工作也就不擔心。但到了太陽西下，她的血液流動正常，精力開始旺盛，我卻拖著疲憊身心出現在她面前，一見到我這張臉顯然令她不開胃。到底誰比誰值得同情？誰比誰辛苦？甚至誰比誰先死都經常成為我們母女之間最不愉快的聊天。

    以前總聽說人老了，看開了，脾氣沒有了，欲望也沒了。我家的老人可不如此，她對財務依舊精明，不時還提醒我：「你現在不年輕了，賺錢機會少了，要省著點，守著點。①」對於數字她清清楚楚，絕不馬虎，實在令人欽佩。她另一樣清清楚楚的事，就是對食物的挑剔，這對我是一大挑戰。她總說自己不挑剔，吃得簡單，但多年前她經歷一個大手術，去除了一個腎，之後醫生叮囑不可以吃雞肉、豆類、菇類、花椰菜、豆苗……這一連串禁食材料經常讓我在菜市場中兜兜轉轉，努力尋找靈感做一些既能吃得心安，又能兼顧美味和營養的菜式。如果端上桌的食物不合她胃口，她的雙眉一皺，我的胃也自動開始痙攣。

    我在國外工作時，會用監控設備查看幫傭在家中照顧母親的情況。終於有一次，我看到了真正的她。手機影像中的母親正指手畫腳地教幫傭如何做宮保雞丁，她臉上露出孩子般的笑容②，彷彿是趁爸媽出國逮到了自由的機會，打心底地開心。宮保雞丁證明了只要女兒不在家，雞肉是可以吃的，而且味道要爆得夠。她想吃什麼就可以吃什麼，想幾點睡就可以幾點睡，電視開多大聲都可以，誰也不會管！當然事實不會如此美好，最終管她的是她的身體：胃酸逆流令她必須停止她最愛的甜食。多少次了，我嚴重警告她不可以半夜吃餅乾或巧克力，但第二天幫傭打掃房間時總會發現垃圾桶裡的糖果紙和裝餅乾的塑膠袋；母親的衣櫃裡也會有各種中西式餅乾甜食，有些都過期了。為了不拆穿她私藏的行為，我只好請幫傭先處理過期的食物，一次還不可以丟太多，以免被察覺而抱怨我不尊重她的隱私。有一次她沒聽見我敲門，我一進房間就撞見她正在整理一整桌商場購買的奇華沙其馬和各式糕餅。她抬頭望見我，像小女孩被抓到偷抽菸似的，把所有糕餅掃到一個盒子裡然後用力蓋上，之後對著我傻笑③。應該是從那時候起，我和她對換了角色。

    「她到底愛不愛我？」偶爾我會這麼想。母親很少稱讚我或謝謝我，也很少擁抱我，牽牽我的手，或許這是傳統家庭的習慣，不直接表達情感，也不習慣有親密的身體接觸。但她總是打量我，然後像中醫一樣地告訴我：「你的眼圈發黑！你的氣色怎麼那麼差！」我明白其實這就是她關心女兒的方式，當然有時她也會說：「你最近臉色不錯，眼睛也有神了！」這時她臉上會露出放心的微笑。最近令她最開心的是她有天突然問我：「你今年七十歲了吧？」我回答：「媽，我七十一歲了！」母親忍不住大笑：「你也是老人了！」④能夠和女兒一起老去，讓她極為開心。我想此時，她是非常愛我的。

    如果我能繼續陪著母親老下去，如果宮保雞丁能夠令她快樂，那就宮保雞丁吧！我老公接著又微信我：「繼宮保雞丁之後，今天的菜單是紅燒栗子雞。」我告訴自己，只要她開心，就讓她開心吧！此時，我也相信我是非常愛她的！
    ──張艾嘉〈孝順〉'
