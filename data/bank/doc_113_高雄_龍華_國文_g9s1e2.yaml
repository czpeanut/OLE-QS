  group_stem: '萬章問曰：「敢問友。」孟子曰：「不挾①長、不挾貴、不挾兄弟而友。友也者，友其德也，不可以有挾也。孟獻子，百乘之家也，有友五人焉：樂正裘、牧仲，其三人，則余忘之矣。獻子之與此五人者友也，無獻子之家者也。此五人者，亦有獻子之家，則不與之友矣。非惟百乘之家為然也，雖小國之君亦有之。費惠公曰：『吾於子思，則師之矣；吾於顏般，則友之矣；王順、長息則事我者也。』

    非惟小國之君為然也，雖大國之君亦有之。晉平公之於亥唐也，入云②則入，坐云則坐，食云則食。雖蔬食菜羹，未嘗不飽，蓋不敢不飽也。然終於此而已矣。弗與共天位也，弗與治天職也，弗與食天祿也。士之尊賢者也，非王公之尊賢也。舜尚③見帝，帝館④甥⑤於貳室⑥，亦饗舜，迭為賓主，是天子而友匹夫也。用下敬上，謂之貴貴；用上敬下，謂之尊賢。貴貴、尊賢，其義一也。」
    ──《孟子．萬章下》

