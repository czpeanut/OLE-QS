  stem: 下列有關《孟子》書中名言的運用，何者正確？
  options:
  - label: A
    content: 「老吾老以及人之老，幼吾幼以及人之幼」，因此老人與小孩都應謹守本分，不可踰越禮法
  - label: B
    content: 「行有不得者，皆反求諸己」，我們要懂得博施濟眾，不吝於為他人付出，畢竟施比受更有福
  - label: C
    content: 「民為貴，社稷次之，君為輕」，早在先秦時期，孟子就提出超越時代的民本思想，著實令人敬佩
  - label: D
    content: 「有為者譬若掘井，掘井九仞而不及泉，猶為棄井也」，此句孟子提醒我們：做事應本於腳踏實地的精神，以免功敗垂成
