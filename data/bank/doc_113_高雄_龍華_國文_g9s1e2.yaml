  stem: "《袋魔往哉》（洋名《Pokémon Go》），電子遊戲也。是遊戲者，任天堂、袋魔公司授權，奈安蒂（洋名Niantic）發之。乙未年七月始佈，可於蘋果、安卓之便攜機玩之。及八月，下載者一億餘次，風行一時。內有坤輿地圖，戲者出走而行，以移地圖所在。有類乎主作者，有眾生物曰袋魔者於各地，可納球中。迨庚子年十二月，歷五代，可捕者凡五百五十八種，其形徵各異，亦有各異能以較強弱，又可遞化強之矣。亦有諸驛站、武館，以取物資，又可爭首、退敵矣。夫戲者遊走各地，可孵卵，以得諸獸；並以夥伴，亦可得飴，以強夥伴。今亦可交友、遺禮、易獸矣。\n\
