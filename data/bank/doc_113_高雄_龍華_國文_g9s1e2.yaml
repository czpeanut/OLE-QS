  stem: 以下關於（甲）（乙）兩文的差異描述何者正確？
  options:
  - label: A
    content: （甲）文中鬼魂送禮道謝，而（乙）文中鬼魂提供食物表達感謝
  - label: B
    content: （甲）文施針後將草人焚燒後埋葬，而（乙）文將施針後的草人投入流水
  - label: C
    content: （甲）文用米製作人形，而（乙）文用茅草製作人形
  - label: D
    content: （甲）文中鬼魂口頭道謝，而（乙）文中鬼魂在夢中道謝
  group_stem: "【甲】\n 南北朝 徐秋夫，鹽城人，仕至射陽令。工醫，善鍼灸，嘗夜聞鬼聲，呻吟甚苦，叱問之，曰：「身是斛律斯，雖死患腰痛。聞君善醫，求拯拔①。」秋夫曰：「汝鬼，術何從？」施曰：「以草束形，呼我名治之。」如其言，下二鍼，設祭埋之。夜聞鬼來謝云：「疾已愈。」時謂其術能通神。\
    \ ──《江南通志》\n【註】①拯拔：從困境中拯救或解脫。\n\n【乙】\n 錢塘 徐秋夫，善治病。宅在湖溝橋東。夜，聞空中呻吟，聲甚苦，秋夫起，至呻吟處，問曰：「汝是鬼邪？何為如此？饑寒須衣食邪？抱病須治療邪？」鬼曰：「我是東陽人，姓斯，名僧平。昔為樂游吏，患腰痛死，今在湖北。雖為鬼，苦亦如生。為君善醫，故來相告。」秋夫曰：「但汝無形，何由治？」鬼曰：「但縛茅作人，按穴鍼之，訖，棄流水中，可也。」秋夫作茅人，為針腰目二處，並復薄祭，遣人送後湖中。及暝，夢鬼曰：「已差。并承惠食，感君厚意。」秋夫\
    \ 宋 元嘉六年為奉朝請。 ──《續齊諧記》"
