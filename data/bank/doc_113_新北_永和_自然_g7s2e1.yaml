  stem: 依據上述想法，關於表中「第4組親代紫花是否為純品系個體」的描述，下列何項推論較合適？
  options:
  - label: A
    content: 第4組親代紫花是純品系，因為子代出現紫花
  - label: B
    content: 第4組親代紫花是純品系，因為純品系能產生紫花子代
  - label: C
    content: 第4組親代紫花不是純品系，因為子代出現白花
  - label: D
    content: 第4組親代紫花不是純品系，因為純品系不會產生紫花子代
  group_stem: '豌豆花色變幻莫測？

    孟德爾是生物學發展中的重要學者之一，他為了尋找生物特徵可能存在的遺傳原理，便花了8 年左右的時間。在進行豌豆實驗時，他發現到豌豆花朵的花色性狀表徵僅有紫色與白色兩種，並且，所觀察花色遺傳的現象與右表所示的結果相當類似。請回答第48
    題至第50題。※表中的「O」表示具有該表徵的子代，「X」表示不具有該表徵的子代【2-1】


    | 組別 | 親代配對 | 子代性狀表徵 紫花 | 子代性狀表徵 白花 |

    | :--- | :--- | :--- | :--- |

    | 1 | 白花 $\times$ 白花 | X | O |

    | 2 | 紫花 $\times$ 白花 | O | O |

    | 3 | 紫花 $\times$ 白花 | O | X |

    | 4 | 紫花 $\times$ 紫花 | O | O |

    | 5 | 紫花 $\times$ 紫花 | O | X |

    | 6 | 白花 $\times$ 白花 | X | O |


    透過種種的花色遺傳實驗與觀察，孟德爾推論並提出了幾個想法：

    ⚫ 紫花為顯性，白花為隱性，遺傳因子會控制豌豆花色的表現。

    ⚫ 控制豌豆為紫花的遺傳因子為P，控制豌豆為白花的遺傳因子為p，具P遺傳因子的豌豆，其花色表徵為紫花。

    ⚫ 豌豆花色性狀由一對遺傳因子控制而表現，純品系個體具有兩個相同遺傳因子。

    ⚫ 無論豌豆的遺傳因子組合形式為何，遺傳因子在生殖過程皆會分離與重組。'
