    患黑化症的美洲豹又稱黑美洲豹，主要分布在南美洲部分地區，一些證據指出，導致其黑化症之等位基因是顯性的。黑化的美洲豹毛色不像帶斑點的毛色那樣常見，但仍在野生的美洲豹中占6%左右，遠高於基因突變率。因此，該現象得到自然選擇理論的支持。美洲豹也會患白化症，被稱為白豹，然而白化症的美洲豹個體極為罕見，就像野外發生白化症的機率一樣，自然選擇使得白化機率和發生基因突變的機率一樣低。'
