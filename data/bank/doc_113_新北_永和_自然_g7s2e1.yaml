- id: doc_113_新北_永和_自然_g7s2e1_s3_37
  section: 3
  number: 37
  type: single
  page: 3
  stem: 文中(甲)期，應該指的是：【1-2】
  options:
  - label: A
    content: 受精
  - label: B
    content: 細胞分裂
  - label: C
    content: 減數分裂
  - label: D
    content: 染色體分離
  group_stem: '植物的「療傷大師」：癒傷組織的秘密

    當植物體的局部受到創傷刺激後，會在傷口表面新生一種叫做「癒傷組織（callus）」的特殊組織。是由活的薄壁細胞所組成，這類細胞是植物體任何器官與組織皆曾經有過的原始細胞。一開始，這些增殖的細胞會聚集在一起，形成一個無定形、無規則排列的細胞團；之後在適合的光照、溫度和一定的營養物質與激素等條件下，這些細胞可以根據植物的需要分化成不同的組織，例如木質部、韌皮部、表皮組織等，修復損傷部位，還可以更進一步發育成一棵完整的植株。

    統整癒傷組織的修復過程可以分為三個階段：1.(甲)期：細胞快速增殖，形成一個細胞團。2.細胞分化期：形成不同組織，例如表皮、維管束等。3.器官形成期：進一步分化形成根、莖、葉等器官，達到植物的再生。

    癒傷組織可說是植物應對損傷的“急救部隊”，也是農業上成功栽培植物的關鍵；藉此可以快速大量地繁殖遺傳性狀一致的植株，獲得大量的優良品種，更為我們揭示了植物生命的奧秘。'
