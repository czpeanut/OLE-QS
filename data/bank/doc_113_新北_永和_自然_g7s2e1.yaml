- id: doc_113_新北_永和_自然_g7s2e1_s3_40
  section: 3
  number: 40
  type: single
  page: 3
  stem: 若黑豹(黑花豹)和黑美洲豹的黑化症都是位於體染色體上的單個基因控制，黑豹黑化症的等位基因以A 和a 表示；黑美洲豹黑化症的等位基因以B 和b 表示。請問黑化症的黑豹和黑美洲豹之基因型分別為何？【2-1】
  options:
  - label: A
    content: 黑豹是aa；黑美洲豹是BB 或Bb
  - label: B
    content: 黑豹是aa；黑美洲豹是bb
  - label: C
    content: 黑豹是Aa 或aa；黑美洲豹是bb
  - label: D
    content: 黑豹是AA；黑美洲豹是BB
  group_stem: '嘿嘿！動物也會黑化耶！

    黑化（Melanism）是深色的黑色素在皮膚（或皮膚附屬物，如毛髮）中逐步建立的過程，黑化症是白化症(Albinism)相反，後者會讓動物的毛髮與皮膚顏色呈現白色，前者則因黑色素產生過多使其皮膚或是毛髮等變黑色。許多動物中都有一定比例的個體帶有黑化基因，例如黑豹和黑鹿等，烏骨雞也是人工選殖的黑化品系。黑化個體在有些情境下比其他個體更適應環境，如因為工廠排放汙染物造成樹幹變黑後，黑化的樺尺蠖蛾較不容易被天敵發現。

    貓科動物約有三分之一的物種有黑化症的紀錄，俗稱的黑豹即是花豹發生黑化現象，黑豹並非一個單獨的物種，而是因為具有黑化的隱性等位基因而使全身呈現黑色。黑豹幼崽和普通顏色的幼崽有可能混雜在同一胎中出生。一般的花豹具有黃色眼睛，而黑豹的眼睛常為灰綠色。雖然黑豹的顏色與眾不同，但在夜間捕食時全身黑色可能會是一個優勢。

    患黑化症的美洲豹又稱黑美洲豹，主要分布在南美洲部分地區，一些證據指出，導致其黑化症之等位基因是顯性的。黑化的美洲豹毛色不像帶斑點的毛色那樣常見，但仍在野生的美洲豹中占6%左右，遠高於基因突變率。因此，該現象得到自然選擇理論的支持。美洲豹也會患白化症，被稱為白豹，然而白化症的美洲豹個體極為罕見，就像野外發生白化症的機率一樣，自然選擇使得白化機率和發生基因突變的機率一樣低。'
  shared_asset: g3_40_42
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 生物
      code: 2-1
      title: 遺傳、染色體與基因
      chapter: 第2章 遺傳
