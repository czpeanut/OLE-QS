- id: doc_113_新北_永和_自然_g7s2e1_s3_43
  section: 3
  number: 43
  type: single
  page: 4
  stem: 右圖是人類的同卵雙生共用胎盤的示意圖，請問關於圖中各個構造的功能敘述，何者錯誤？
  options:
  - label: A
    content: 母體的養分經由甲乙傳遞給胎兒
  - label: B
    content: 丙為羊水，供應胎兒所需的水分
  - label: C
    content: 丙可以保護胎兒，防止受到震盪
  - label: D
    content: 人類胎兒從受精到出生需要38~40周
  group_stem: '小狗與小雞的同卵雙胞胎

    2016 年有報導指出，南非發現世界首對同卵雙胞胎小狗，由一隻愛爾蘭獵犬所產下。獸醫卡萊姆(Kurt de Cramer)同時幫狗媽媽連續接生了5 隻狗，皆為獨立胎盤。然而突然發生難產現象，子宮內出現不明隆起，原以為是羊水過多。但是把多餘液體放掉進行剖腹產後，赫然發現兩個胚胎位在同一個胎盤裡，且兩隻小狗性別一樣、身上的斑紋也十分類似，懷疑可能是罕見的同卵雙胞胎，基因鑑定後證實為真，成為科學紀錄中首對同卵雙胞胎狗狗。否則一般自然產的情況下，母狗會吃掉胎盤，是很難發現此一現象。

    2 隻小狗雖然是同卵雙胞胎，但外型上卻沒有完全相同。牠們的毛色花紋有著極小的差異，科學家認為這樣的情況十分正常，即使是人類的同卵雙胞胎，外觀也不見得會百分之百一樣。

    這個故事不禁讓人聯想，雙蛋黃的雞蛋如果同時受精，是否也會發育孵化出2 隻小雞呢？

    答案是否定的。為什麼？

    根據畜產報導月刊的專家說：人的兩個受精卵，可以生出雙胞胎，因為胚胎有母體供應養份，母親的子宮又可伸縮，不要說兩個，就是4 個也裝得下。但是雞蛋生下後，攜帶的養份有限是不足養活
    2 個雞胚胎；而且蛋殼又是硬的，大小不會變，裝不下多的一隻雞！所以，雙黃蛋是孵不出兩隻小雞的。【1-1+1-2+1-3】'
