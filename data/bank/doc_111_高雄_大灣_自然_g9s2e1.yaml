- id: doc_111_高雄_大灣_自然_g9s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '下列關於臺灣在冬季和夏季盛行的季風之敘述，哪些正確？

    甲.東北季風因為經過臺灣東北方的海面，為臺灣全島帶來豐沛的雨量；

    乙.夏季西南季風為臺灣帶來溼熱的天氣型態；

    丙.夏季季風主要源自於高氣壓，冬季季風主要源自於低氣壓；

    丁.西南沿海處於東北季風背風面，故主要在冬季晒鹽。'
  options:
  - label: A
    content: 乙、丁
  - label: B
    content: 甲、丙
  - label: C
    content: 甲、乙、丙
  - label: D
    content: 甲、乙、丁。
