  stem: 若將主要影響臺灣五、六月天氣的鋒面稱為鋒面甲，影響十一、十二月天氣的鋒面稱為鋒面乙，則下列敘述何者正確？
  options:
  - label: A
    content: 鋒面甲會造成過境地區降雨，鋒面乙則幾乎不會降雨
  - label: B
    content: 鋒面甲、乙都是氣團的交界處，只因氣團的強弱不同而形成不同鋒面
  - label: C
    content: 鋒面甲的移動速度較鋒面乙快，常於一、二天之內通過臺灣地區
  - label: D
    content: 鋒面甲和乙均會造成過境地區的氣溫驟降。
