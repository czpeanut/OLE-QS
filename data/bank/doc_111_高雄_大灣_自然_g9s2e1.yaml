- id: doc_111_高雄_大灣_自然_g9s2e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: '小雯媽媽準備晚餐時，請小雯幫忙用電鍋煮飯、微波爐解凍肉類，以及用烤箱烤馬鈴薯。已知廚房延長線的電流最大安全容量為15 A，且推算出電功率最大容量為1650
    W，電器的消耗功率如附表所示，則下列哪個流程，可讓小雯在最短時間內，安全的幫媽媽完成餐點？


    | 電器 | 電鍋 | 微波爐<br>解凍功能 | 烤箱 |

    | :--- | :--- | :--- | :--- |

    | 消耗功率（W） | 700 | 300 | 1000 |'
  options:
  - label: A
    content: 將電鍋、微波爐與烤箱全部插到延長線上煮，這樣可以最快完成
  - label: B
    content: 先用電鍋煮飯與微波爐解凍肉類，最後再用烤箱烤馬鈴薯
  - label: C
    content: 先用電鍋煮飯與烤箱烤馬鈴薯，最後再用微波爐解凍
  - label: D
    content: 一次只用一個電器，先用電鍋煮飯，接著換微波爐，最後才用烤箱。
  tags:
