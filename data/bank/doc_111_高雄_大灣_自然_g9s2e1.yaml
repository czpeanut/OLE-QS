  stem: 下列關於臺灣常見的災變天氣敘述，何者正確？
  options:
  - label: A
    content: 五～六月，太平洋暖氣團籠罩臺灣地區，形成梅雨
  - label: B
    content: 颱風主要發生在七～九月，常帶來強風、豪雨，甚至暴潮而引發災害
  - label: C
    content: 冬季寒流來襲，是受到強烈太平洋冷氣團的影響
  - label: D
    content: 臺灣的年平均降雨量比世界平均值高，所以不容易發生乾旱。
