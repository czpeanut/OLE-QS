  - label: A
    content: 放颱風假不用上班、上學，雖然在家休息很開心，但可能影響到工作或課程的進度，這是「機會成本」的概念
  - label: B
    content: 颱風來前許多人都會到市場搶購蔬菜，這是受到「預期心理」的影響
  - label: C
    content: 颱風過後若菜價太高，政府可以啟動穩定菜價的機制
  - label: D
    content: 颱風過後，菜價狂飆，這時消費者會增加需求量。
