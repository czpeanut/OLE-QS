- id: doc_113_高雄_楠梓_社會_公民_g9s1e1_s2_12
  section: 2
  number: 12
  type: single
  page: 2
  stem: 為了鼓勵民眾節約用電，台電也推出節電獎勵活動，一般住宅及中小學均可參加。活動期間內用戶每月用電節省 1 度，可獲得 0.6 元的獎勵金，獎勵金會從當期電費直接扣除。請問：下列相關敘述，何者錯誤?
  options:
  - label: A
    content: 節電提供獎勵金是為了提供正向金錢誘因
  - label: B
    content: 台電提供的誘因可能會影響參加者的用電行為
  - label: C
    content: 為了獲得獎勵金就必須節約用電，這就是機會成本的概念
