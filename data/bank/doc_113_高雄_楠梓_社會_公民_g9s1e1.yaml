- id: doc_113_高雄_楠梓_社會_公民_g9s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 每一種資源往往具備多種功能，因此我們在做選擇時須考慮機會成本的概念。請問：下列關於機會成本的概念何者錯誤？
  options:
  - label: A
    content: 當我們面臨選擇時，機會成本最低者就是行為者的最佳選擇
  - label: B
    content: 「魚與熊掌不可兼得」，任何一種經濟行為都須付出代價
  - label: C
    content: 將資源用於某一用途的機會成本就是「在其他條件不變的情形下，所放棄的選擇中，價值最高者所產生的價值」
  - label: D
    content: 機會成本是以金錢衡量代價，來幫助我們做出選擇。
  tags:
