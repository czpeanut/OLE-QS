  group_stem: 'Hi, everyone. Today''s English class is about homonyms. Let''s read
    a story first before we talk about homonyms.

    It was a cold and rainy night. Jasper was on his way home. There was an old man
    walking in front of him. "Watch out!" said Jasper to the old man when he saw a
    car. But, it was too late. The car hit the old man, and he lost his left arm and
    left leg. A few weeks later, Jasper saw the old man on the street again. "Hey,
    are you okay?" Jasper walked to the old man. "Well, I am all right now," said
    the old man. He showed Jasper his right arm and right leg.

    In the story, the "right" in "all right" and the "right" in "his right arm and
    right leg" are homonyms. They have the same spelling but different meanings. One
    is "fine" or "okay," and the other is "on the right hand side." Now, can you think
    of another example of homonyms?


