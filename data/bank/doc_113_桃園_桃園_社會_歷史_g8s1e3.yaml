- id: doc_113_桃園_桃園_社會_歷史_g8s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: '清朝曾和歐美列強協議訂約，將部分地區劃作「租界」，提供外國人居住或經商。租界在物質與文化等層面呈現中西交融現象；雖然在名義上領土仍屬於出租國，然租界內的外國人並不受中國政府的管轄，而是另外成立市政管理機構來行使行政、司法等權力。右表為歐美列強曾在中國設置的租界列表，關於各國租界的敘述，下列何者正確？

    | 國家 | 租界位置 |

    | :--- | :--- |

    | 英國 | 上海、廈門、天津、鎮江、漢口、九江、廣州 |

    | 法國 | 上海、天津、廣州、漢口 |

    | 美國 | 上海、天津 |

    | 德國 | 漢口、天津 |

    | 俄國 | 漢口、天津 |'
  options:
  - label: A
    content: 外國人得在租界行使完全司法權和片面最惠國待遇的簽訂有關
  - label: B
    content: 租界僅供外國人居住，所以外國人嚴禁中國人進入
  - label: C
    content: 清朝因簽訂不平等條約，割讓土地作為租界而對租界無行政權
  - label: D
    content: 租界形成於19 世紀中期以後，多設在沿江沿海的港口以利通商貿易
