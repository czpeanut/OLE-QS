  section: 1
  number: 4
  type: single
  page: 1
  stem: 圓O 的圓心為O 點，若$\overline{AB}$、$\overline{CD}$ 為圓O 的相異兩弦，且$\overline{OM} \perp
    \overline{AB}$ 於M、$\overline{ON} \perp \overline{CD}$ 於N，則下列敘述何者不正確？
  options:
  - label: A
    content: M 為$\overline{AB}$ 的中點
  - label: B
    content: 若$\overline{CD}$ 為直徑，則$\overline{ON} = 0$
  - label: C
    content: 若$\overline{AB} = \overline{CD}$，則$\overline{OM} = \overline{ON}$
  - label: D
    content: 若$\overline{AB} > \overline{CD}$，則$\overline{OM} > \overline{ON}$
  answer:
  - '圓 O 的圓心為 O 點,若 AB 、 CD 為圓 O 的相異兩弦,且 OM ⊥ AB 於 M、 ON ⊥ CD 於 N,

    則下列敘述何者不正確?

    (A)M 為 AB 的中點 (B) 若 CD 為直徑,則 ON =0

    (C)若 AB = CD ,則 OM = ON (D) 若 AB > CD ,則 OM > ON'
