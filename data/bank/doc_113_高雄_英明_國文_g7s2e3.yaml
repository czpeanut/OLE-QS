  group_stem: "愛因斯坦在普林斯頓大學任教時，學期終了，也要出些考題。某次考試前幾天，有位學生匆匆跑來找愛因斯坦：「教授，聽說您今年的考題跟去年一樣？」「沒錯。」愛因斯坦回答。學生立刻喜上眉梢，因為他已將考古題背得滾瓜爛熟。「\
    \              」愛因斯坦又加上一句。\n    人生，不斷提出各種問題，等待我們的回答。譬如「宇宙存在的目的是什麼？」、「生命的意義又是什麼？」問題雖然相同，但每個人的答案卻不一樣，每個時代的答案也都不一樣。問題不變，答案一直在變，因為回答的人一直在變。\n\
    \    對生命的諸般問題，如果我們現在的答案跟小時候一樣，那表示這麼多年來，我們的心靈和見識可能都沒有什麼成長。如果我們今年的答案是抄襲去年別人的答案，那表示在此朗朗乾坤，我們竟然是活在別人的陰影裡。\n\
    \    所有值得思索和探問的問題，都是沒有標準答案或終極答案的。「我想成為什麼樣的人？」、「我想過什麼生活呢？」自己找答案，而且，每隔一段時間就找到不同的答案。（王溢嘉答案不一樣）"
