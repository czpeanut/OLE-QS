  section: 2
  number: 49
  type: single
  page: 8
  stem: 請問【乙】表〈古代學霸的讀書方法〉，下列何人汲取或轉化知識的方法，最符合【甲】圖文中所說，能帶來最佳的學習效益？
  options:
  - label: A
    content: 董遇
  - label: B
    content: 魯迅
  - label: C
    content: 蘇東坡
  - label: D
    content: 董其昌。
  group_stem: '【甲】 我們可以說遺忘是常態──上課學到的內容、或是背了幾個單字，可能過了一會就忘了差不多，若是想要將這些內容記憶起來，就要靠大量的複習來恢復記憶。但是不同的學習方式所帶來的學習效益都不同，如下圖這張表格，這是在研究兩週後我們仍然記得多少，如我們看到的，實際做過這一件事遠比閱讀與聽講來的有效益。


    | 我們讀過 10% | 我們聽過 20% | 我們看過 30% | 我們聽過 並且看過 50% | 我們說過 70% | 我們說過 並且做過 90% |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 閱讀 | 聽講 | 看圖片 | 看影片<br>參與討論觀看<br>觀看示範說明 | 當場看到事情完成<br>參與討論<br>做非正式演講 | 正式演講且精彩<br>模擬實際經驗<br>實際做過
    |


    【乙】古代學霸的讀書方法


    | 利用三餘 | 讀書四到 | 七焚七錄 |

    | :--- | :--- | :--- |

    | 三國 魏 董遇說：「冬者歲之餘，夜者日之餘，陰雨者時之餘也。」教導學生充分運用三個餘暇時間(冬天、夜晚、陰雨天)來讀書。 | 宋 朱熹教人讀書要「三到」：心到、眼到、口到。而胡適則認為「讀書三到」的方法還不夠，又加了一個「手到」。
    | 明代文學家張溥讀書時，先把文章抄一遍，抄完後讀一遍，然後把抄的紙燒掉。再重新抄一遍，然後再讀，再燒，這樣反覆七遍，直到嫻熟才罷休。 |

    | 八面受敵 | 百家百遍 | 萬卷萬里 |

    | 宋代蘇東坡認為一本好書的內容豐富，從不同面向可以學習到不同的道理，所以每次只針對一個目的來讀，不要旁及其他。如能從多個面向反覆讀懂這本書，那就算八面受敵，被別人從不同角度考驗，也能應付自如。
    | 魯迅：「只看到一個人的著作，結果是不太好的，你就得不到各方面的優點。」必須如蜜蜂一樣，採過許多花，這才能釀出蜜來，倘若叮在一處，所得就非常有限，枯燥了。」讀百家之書，還要熟讀百遍。宋代朱熹曾說：
    「讀書百遍，其義自見。」 | 唐 杜甫說：「讀書破萬卷，下筆如有神。」讀過很多書後，寫作時便能文思泉湧，行文暢達。明代董其昌亦曾說：「讀萬卷書，行萬里路。」
    除了多讀書，還要到各地旅行，增廣見聞、親自體驗書本的內容，唯有透過身體力行，才能獲得更多經驗。 |'
