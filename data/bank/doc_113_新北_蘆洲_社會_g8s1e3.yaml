- id: doc_113_新北_蘆洲_社會_g8s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 日本 溫泉眾多，不僅人類喜歡泡溫泉，甚至還有人拍到連猴子在寒冷的天氣裡，也泡起了溫泉，成了有趣的畫面。但日本 的溫泉文化有一些需要遵守的禮儀，常提醒外國的觀光客要多注意，避免觸犯了禁忌。請問：日本
    擁有眾多溫泉的原因為何？
  options:
  - label: A
    content: 氣候炎熱，海水溫度高
  - label: B
    content: 黑潮洋流帶來的溫暖海水
  - label: C
    content: 地理位置位於板塊交界處
  - label: D
    content: 氣候嚴寒，人工加熱地下水所形成。
