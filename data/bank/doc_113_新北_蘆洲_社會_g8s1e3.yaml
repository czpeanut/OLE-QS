  number: 6
  type: single
  page: 1
  stem: BTS、BLACKPINK、TWICE……等「KPOP」流行音樂風靡全球許多地方，對於重工業發展受限的南韓來說，藉由這種文化軟實力創造出來的經濟產值是當地政府非常重要的收入來源。請問：相較於北韓來說，南韓重工業較不發達的原因是什麼？
  options:
  - label: A
    content: 勞力成本較高，產業外移
  - label: B
    content: 較缺乏發展重工業所需的礦產資源
  - label: C
    content: 與北韓簽訂協議，避免經濟競爭
  - label: D
