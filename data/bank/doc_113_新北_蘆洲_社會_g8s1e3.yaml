- id: doc_113_新北_蘆洲_社會_g8s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 如果要用一項食物來代表韓國，相信一定會有很多人第一時間就會聯想到『泡菜』，在韓國 的家庭常常會有一台額外冰泡菜的冰箱，而且一餐當中只要有泡菜就可以吃下好幾碗白飯。請問韓國
    的泡菜飲食文化主要是受到什麼原因影響？
  options:
  - label: A
    content: 韓戰時期保留下來的儲存食物習慣
  - label: B
    content: 夏天炎熱，重口味的泡菜可以增加胃口
  - label: C
    content: 山多平原少，從國外進口蔬菜後加以醃製儲存
  - label: D
    content: 緯度較高，冬季寒冷不利作物生長，把蔬菜先醃製以供食用。
  tags:
