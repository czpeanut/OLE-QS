  type: single
  page: 1
  stem: 小雯 打算利用寒假來趟日本樂園快閃之旅，她計畫第一天先到大阪的環球影城，第二天再到東京 迪士尼樂園，最後一天前往名古屋 的樂高樂園。而三個地方分別位在日本的三大平原，其依序為？
  options:
  - label: A
    content: 近畿平原→關東平原→濃尾平原
  - label: B
    content: 濃尾平原→關東平原→近畿平原
  - label: C
    content: 關東平原→濃尾平原→近畿平原
  - label: D
