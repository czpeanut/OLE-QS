- id: doc_113_新北_江翠_自然_g8s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: '四氧化二氮，是化學合成中一種非常有用的試劑。它與二氧化氮會形成平衡混合物（體系處於平衡狀態時，反應物和生成物的混合物稱為平衡混合物）。四氧化二氮是一種強氧化劑，與各種形式的肼（聯氨）接觸時會自燃，使得這種搭配成為火箭常用的雙基推進劑。室溫下會蒸發產生紅色二氧化氮氣體，具有毒性。

    請根據以上敘述，判斷下列哪個選項正確? (1-2)'
  options:
  - label: A
    content: 四氧化二氮化學式為 $N_{2}O_{4}$ ，分子量為 82
  - label: B
    content: 為減少四氧化二氮危害，應注意不要讓其接觸到各種形式的肼
  - label: C
    content: 四氧化二氮的化學式是 $N_{2}O_{4}$，也可以寫成 $2NO_{2}$
  - label: D
    content: 為妥善保存四氧化二氮，應將其儲放在低溫環境。
