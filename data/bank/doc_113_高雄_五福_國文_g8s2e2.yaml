  page: 4
  stem: '以下內容是有關作者張輔對司馬遷《史記》與班固《漢書》的看法

    「世人論司馬遷、班固，多以固為勝，余以為失。遷之著述，辭約而事舉(1)，敘三千年事，唯五十萬言。班固敘二百年事，乃八十萬言，煩省不敵(2)，固之不如遷一也。良史述事，善足以獎勸，惡足以監誡。人道之常，中流(3)小事，亦無取焉，而班皆書之，不如二也。毀貶晁錯，傷忠臣之道，不如三也。」。

    （張輔〈名士優劣論〉）

    【注釋】（1）事舉：提出事情的重點。（2）不敵：無法抗衡抵擋。（3）中流：普通、中等。

    根據上段文字所敘述，下列選項何者正確？'
  options:
  - label: A
    content: 《史記》詳實記載歷史事件，優於《漢書》的簡略記事。
  - label: B
    content: 《史記》取材去蕪存菁，優於《漢書》不論善惡大小皆記於其中。
  - label: C
    content: 《漢書》的用詞較質樸真誠，優於過度重視雕砌華麗詞藻的《史記》。
  - label: D
    content: 《漢書》的分類較簡約，優於《史記》將全書分成五種體例的繁雜。
