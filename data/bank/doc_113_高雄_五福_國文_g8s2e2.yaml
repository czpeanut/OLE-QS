  section: 5
  number: 7
  type: single
  page: 6
  stem: 根據本文，作者發現臺北出現《劍河倒影》一書時，他的感想為何？
  options:
  - label: A
    content: 因未被詢問出版意願而勃然大怒
  - label: B
    content: 因得到報社賞識而受寵若驚
  - label: C
    content: 因廣告風格與成書品質而心情低落
  - label: D
    content: 因未能參與編纂書籍的過程而深表遺憾
  group_stem: "最初的一兩個月，都是在看閒書，聊閒天中過去的。因為看到好多事都很新鮮，於是就一連寫了十篇\n「劍河倒影」寄給《中央日報》。嗣即接到好多朋友的信，其中有梁實秋先生的謬獎；林語堂先生的申論，\n\
    還有好多朋友說：太好了，你又提筆寫散文了。 \n但是十篇寫完以後，我就覺得不太明白劍橋，有「出口便錯」的危險。於是多看些再說，可是越看得\n多，越不敢寫。雖然我那時整天看閒書，聊閒天，並沒有看我本行的東西，也並沒有寫出散文來。\
    \ \n劍橋之所以為劍橋，就在各人想各人的，各人幹各人的，從無一人過問你的事。找你愛找的朋友，聊\n你愛聊的天。看看水，看看雲，任何事不做也無所謂。在一九七○的前半年，我幾乎沒有看一本本行的書。\n\
    好像壞學生放了假時的狀態。這時候，臺北卻出現了《劍河倒影》的集子，除了那十篇散文外，還找出我未\n出國以前的幾篇文章，可能是那位店東的剪貼簿罷，大登廣告，出版了。不經同意替我出書，倒在其次；使\n\
    人看來很不舒服的，是還寫了一段很輕浮的廣告，書裏面又是數不清的錯字別字。使我對那種無法無天的作\n風難過了好幾天。 \n（陳之藩〈劍河倒影序〉）"
