- id: doc_113_高雄_五福_國文_g8s2e2_s5_3
  section: 5
  number: 3
  type: single
  page: 5
  stem: 「這豈不是地平線上的『香格里拉』嗎？」，句中「香格里拉」的涵義為何？
  options:
  - label: A
    content: 海市蜃樓
  - label: B
    content: 空中樓閣
  - label: C
    content: 世外桃源
  - label: D
    content: 夢幻世界
  group_stem: "掙扎的陽光在海的呼喚聲中，終於掩不住歸去的衝動；漁舟在海鷗的目送下，使盡力氣的奔向小港灣的\n懷抱，留著西天的一片彩霞，孤零零地在期待著下落的夜幕……風，來自木麻黃的枝梢，輕煙似的迎面而\n\
    來，有種很古典的浪漫。為了尋覓理性的超然，在很多腳印串成的黃昏裡，我恬然沉默在浪潮的低語和紫貝\n殼的呢喃中。 \n一只貝殼繫著一串串長長的，屬於童年的憧憬；一個腳印託付著多少歲月的痕跡，那該是屬於夢想與現\n\
    實的分界。漁港散發著淡泊、靜謐、安然的氣息。純樸的漁民，健康的陽光，碧澄澄的天空，藍色的海洋，\n一切帶著自然性的豪獷與柔美，這豈不是地平線上的「香格里拉」嗎？\
    \ \n夕陽將乘著彩霞重返白雲的故鄉，風兒將踩著綠波回到海角，我也要尋著沙灘的盡頭歸去……，願浪花\n和諧的韻律伴著小漁村直到天明，迎向永恆的明天！ \n\
    （尤雲白〈漁村晚照〉）"
