- id: doc_113_高雄_五福_國文_g8s2e2_s5_10
  section: 5
  number: 10
  type: single
  page: 7
  stem: 根據文意，下列何者最符合孔子對於治民方式的看法？
  options:
  - label: A
    content: 須以德行與禮教教化人民，方能知恥向善。
  - label: B
    content: 以刑罰為主可減少犯罪，並養成德行。
  - label: C
    content: 法令嚴明即可令民知恥而不犯。
  - label: D
    content: 僅靠政令與刑罰便能建立良好社會風氣。
  group_stem: "孔子曰：「導之以政，齊之以刑，民免而無恥。導之以德，齊之以禮，有恥且格(1)。」老氏稱：「上德\n不德，是以有德；下德不失德，是以無德。」「法令滋章，盜賊多有。」\
    \ \n太史公曰：「信哉！是言也。」法令者治之具，而非制治清濁之源也。昔天下之網(2)嘗密矣，然姦偽萌\n起，其極也，上下相遁(3)，至於不振。當是之時，吏治若救火揚沸(4)，非武健嚴酷，惡能(5)勝其任而愉快\n\
    乎？言道德者，溺其職矣。故曰「聽訟，吾猶人也，必也使無訟乎。」「下士聞道，大笑之。」非虛言也。 \n漢興，破觚而為圜(6)，斲雕而為樸(7)，網漏於吞舟之魚(8)，而吏治烝烝(9)，不至於姦，黎民艾安。由是\n\
    觀之，在彼不在此。 \n（司馬遷〈史記·酷吏列傳〉） \n【注釋】(1)有恥且格：指人有知恥之心，則能自我檢點而歸於正道。(2)昔天下之網：此指秦時之法。\
    \ \n(3)遁：逃避。指欺瞞。(4)救火揚沸：比喻治標不治本，禍患難除。(5)惡能：何能。惡，音ㄨ。\n(6)破觚而為圜：指漢初除秦之苛法，使法治簡約渾厚。(7)斲雕而為樸：比喻抑制巧詐奸偽，使民\n\
    風返歸敦厚。斲，音ㄓㄨㄛˊ，砍、削木。(8)網漏於吞舟之魚：比喻法令寬大。 \n(9)烝烝：音ㄓㄥ，德業淳厚的樣子。"
