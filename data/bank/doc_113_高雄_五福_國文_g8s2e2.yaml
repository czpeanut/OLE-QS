  group_stem: "鄢陵縣吏陳滿射鳥，箭誤中直帥，雖不傷人，處法棄市(1)。承天議曰：「獄貴情斷(2)，疑則從輕。昔驚\n漢文帝乘輿馬者，張釋之劾以犯蹕，罪止罰金。何者？明其無心於驚馬也，故不以乘輿之重，加以異制(3)。\n\
    今滿意在射鳥，非有心於中人。按律過誤傷人三歲刑，況不傷乎？微罰可也。 \n（節錄沈約〈宋書·何承天傳〉） \n【注釋】(1)棄市：古時在鬧市執行死刑，並將屍體扔在大街示眾的刑罰。泛指死刑。(2)獄貴情斷：判案貴\n\
    在按實情論斷。(3)異制：不同制度。指和法律不同的判決。"
