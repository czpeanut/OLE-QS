  group_stem: 酒精（乙醇）在人體主要是由肝臟代謝，乙醇先由肝臟中的乙醇去氫酶代謝成乙醛，乙醛再由乙醛去氫酶代謝成乙酸，而後排出體外。乙醛對身體有毒性，會引起臉紅、心悸、噁心、嘔吐的症狀。所以喝酒容易醉的人，其實就是因為基因上的缺陷，使得乙醛去氫酶較少，導致乙醛的代謝緩慢，使其在體內存留較久的關係。請根據以上敘述回答30~31
