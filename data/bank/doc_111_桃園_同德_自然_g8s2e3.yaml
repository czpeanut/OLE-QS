  type: single
  page: 4
  stem: 關於測定辛烷值「標準油」的描述，以下何者正確？
  options:
  - label: A
    content: 屬於酯類物質
  - label: B
    content: 必為烴類的混合物
  - label: C
    content: 必為烴類的純物質
  - label: D
    content: 水溶性非常差。
  group_stem: 「 爆震 」（Knocking），是指引擎內發生不正常的燃燒而造成震動，由於會發出高頻率的金屬敲擊聲，又俗稱「敲缸」；若引擎連續的發生爆震，容易燒壞氣門、活塞等機件，嚴重則會使引擎毀損。汽油的辛烷值則是代表抗爆震的能力，測定方式是將「異辛烷($C_{8}H_{18}$)」與「正庚烷($C_{7}H_{16}$)」以不同比例混合成「標準油」，再將汽油與標準油的爆震強度做比對。其中，抗爆震高的「異辛烷」辛烷值為
    100，抗爆震低的「正庚烷」辛烷值為0。如果汽油的爆震程度，與「異辛烷」98% 加「正庚烷」2%混合的標準油相同，那麼這個汽油的辛烷值就是98；換句話說，98
    無鉛汽油就是與異辛烷含量98%的標準油，具有相同抗暴震能力的汽油。請根據以上敘述回答39~40 題：
