- id: doc_111_桃園_同德_國文_g7s2e2_s3_8
  section: 3
  number: 8
  type: single
  page: 1
  stem: 法國文學家福婁拜，一輩子艱苦卓絕的從事文學創作：「一個特異的意念，只有一個特異的字或字句可以表現。」，以他對作品字斟句酌的態度，和下列哪一位古人最接近？
