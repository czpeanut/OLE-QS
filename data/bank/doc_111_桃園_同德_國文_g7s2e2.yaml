    \    「還在忙？」丈夫探頭進來。\n    他還沒回話，就聞到撲鼻而來的飯香，肚子不禁咕嚕咕嚕的叫了。\n    「先吃點東西吧。哎，你知道嗎？剛剛新聞說，我們公司那邊發生槍戰，死了兩個人，一個警察，一個歹徒。」\n\
    \    「為什麼槍戰？」「抓毒吧。」\n    「嗯。」\n    他突然沒了胃口，但不確定基於什麼原因。他告訴丈夫，晚飯先放著吧，馬上去吃。\n   \
    \ 他一生經歷的法庭和判決多不勝數，大部分幫好人辯護，其中不乏以小搏大的案子。自從進入法律之門以來，他一路信奉的就是公平與正義。他常在好人們身上看到人性的光輝，如此卑微可愛，相形下政客財閥則顯得粗魯黑暗又無恥。可是今天這個案件所展現出來的衝突，彷彿挑戰著他認知的一切。\n\
    \    他捫心自問：世界上有沒有一種罪，在開庭前就已經被定奪？又有沒有一種罪人，在為自己辯護以前，就無法再為自己辯護？"
