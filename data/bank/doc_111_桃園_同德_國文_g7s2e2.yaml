- id: doc_111_桃園_同德_國文_g7s2e2_s3_1
  section: 3
  number: 1
  type: single
  page: 1
  stem: '「別人爬山的時候，你何不去看水。別人看水的時候，你何不去美術館。別人去美術館的時候，你何不去動物園。

    別人去動物園的時候，你何不去圖書館。在我們的城市裡，如果要有一句座右銘，就是──不要□□□。(隱地詩作)」

    由本詩的文意判斷，空格內應填入的詞語最貼切下列何者?'
  options:
  - label: A
    content: 一頭熱
  - label: B
    content: 一股腦
  - label: C
    content: 一把罩
  - label: D
    content: 一窩蜂
