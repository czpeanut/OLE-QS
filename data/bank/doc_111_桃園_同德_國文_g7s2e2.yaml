  section: 3
  number: 2
  type: single
  page: 1
  stem: 關於〈跳水〉與〈風箏〉兩首詩的寫作手法，下列敘述何者較不正確？
  options:
  - label: A
    content: 〈跳水〉以跳水前→跳水過程→跳水後的順序敘述
  - label: B
    content: 〈風箏〉著重描述童年遊戲，表達人生自由不受拘束
  - label: C
    content: 〈跳水〉由靜態至動態，並運用色彩營造生動畫面感
  - label: D
    content: 兩首詩都使用了象徵筆法，隱含著對美好理想的追求
