- id: doc_111_桃園_同德_國文_g7s2e2_s3_33
  section: 3
  number: 33
  type: single
  page: 6
  stem: 本文分別以四個主角的所見所想，鋪展成四個看似不同實則相互連貫的故事，依照文中給予的線索，下列推論何者正確?
  options:
  - label: A
    content: 文中屋主的妻子應該是個大腹便便的孕婦
  - label: B
    content: 竊賊決定偷完這間屋子就金盆洗手，與女友結婚
  - label: C
    content: 警察抵達意外現場時，竊賊已斷氣身亡
  - label: D
    content: 法官經過縝密的查證後，判丈夫為正當防衛，無罪釋放。
  group_stem: "1\n    夫妻倆從地下室搭電梯上樓，話題圍繞著剛剛豐盛的晚餐，和小孩出生後的生活。酒足飯飽，丈夫打了一個哈欠：今天安然過去，踏實且滿懷希望，距離新生命的到來又近一些。\n\
    \    到了家門口，他的神經突然緊繃起來。黑暗中瀰漫著危險的氣味，這是他訓練有素的直覺告訴他的。屋內漆黑一片，他要妻子靠著牆，沒錯，身後的那道牆，他說，站好，小心。他伸手去開燈，燈亮時他看到客廳好幾處顯得特別怪異。他知道，雖然不太留心家中的擺設，但這個景象並非出自妻子或自己的不經意。\n\
    \    房子很小，他很快看到反常關著的、從不掩上的浴室門，那一刻他的心臟彷彿觸火一般劇烈的顫動。他輕輕提起腳尖，輕輕放下，像一隻貓，彷彿回到8 年前的南臺灣營區，在那裡他曾是一名戰士。\n\
    \    「噓……」在碰上那暗暗生綠鏽的門把之前，他還特意回過頭。\n    他的視線穿過自己放在鼻尖的右手食指，射向門口牆邊焦慮的他。\n2\n    今年本應是個好年。年初，他才告別安身整整13\
    \ 年的牢房，回到所謂的人間。他一無所有，除了那些不足為外人道的技術，還有企圖。他打算轉換跑道，做一個正常人，但一顆心卻偶爾覺得不甘願：這一場把青春都賠進去的豪賭，是因為老天的虧待。\n\
    \    他先到新竹找工作，好不容易有人用他，在一家塑膠工廠當操作員。他整天盯著那些機器，放料、造粒、分袋，薪水也按月的流入他的戶頭。可是日子一久，他實在覺得無聊，無法說出這樣的日子最後是好還是壞，而當他想到過往那些恩恩怨怨，就臉頰發燙，脖子滲出汗來。\n\
    \    離開塑膠廠後，他果然還是忍不住走回老路。那些以前陪他「闖事業」的夥伴也一起來了。他們個個心想，此生再當頂天立地的大丈夫已經不可能了，起碼別虧待自己。只要不幹那些傷天害理的大事，哪怕到了陰曹地府，或許還比不上現在難受。\n\
    \    這天，他要那個年輕人把風，自己偷偷潛了進去。鑰匙是年輕人為他準備的，循著門牌指示，他進了那人的房子。空間不大，從擺設來看，屋主大概是一對年輕夫婦。\n\
    \    他翻到一對戒指，是夫妻倆人的婚戒。他看著晶瑩閃爍的鑽石，心想今年果然是個好年。\n    他一時忘了自己的處境，陷入了某種魔幻的沈思：自己如果也能找個人結婚，生個孩子，該有多好啊……。\n\
    3\n    浴室內一片狼藉，即使沒有鮮血，卻仍難掩一股肅殺的血腥味。他到場時，男人站在一旁問道：「要不要CPR？」他檢查了地上另一名男子的身體，雖然面部因為方才的打鬥、無法呼吸而成了紫青色，但脈搏尚在，於是對站著的男人說了聲「不用」。\n\
    \    隔天，他從同仁那裡聽說，昨天永和闖空門的竊賊去世了。他腦中立刻浮那名竊賊的臉，以及昨晚站在一旁的那名壯碩的男人。然而更揮之不去的，是他進入那戶屋子時首先看的那個男人的妻子茫然驚恐的神情。這時，他的太陽穴開始隱隱抽痛。\n\
    \    「防衛過當，法官又要傷腦筋了。」同事端著一杯咖啡，悠哉的在他身邊坐下來。\n    所內現在熱烈的忙碌了，他找到當事人的資料。死者45 歲，身高180\
    \ 公分，有多起竊盜前科，13 年前因強盜罪入獄，今年初獲假釋出獄。屋主34 歲，170 公分，海軍陸戰隊退伍，深諳格鬥搏擊技巧，房子是租的。屋主的妻子身懷六甲，將在下月臨盆。\n\
    \    他記起昨天男人話語中的焦躁以及女人眉間的憂愁。男人對他說：「如果我不這麼做的話，我的老婆、小孩怎麼辦？」他記得自己當時對這句話沒有什麼積極的反應，匆匆勘驗完，便回派出所準備下班。\n\
    \    如今，他想到深高冰冷的法庭，對於男人的問題，終於也有些心有戚戚的共感，但此時此刻，他依然不知道該怎麼回應他的話才好。\n4\n    「最好你家被入侵還可以這麼冷靜！」\n\
    \    「你認為屋主能承受妻兒受到傷害的後果嗎？犯罪就是犯罪，悽慘的背景不是脫罪理由！」\n    「下次最好是換你被搶、被砍、被殺！」\n    發表才短短6\
    \ 個小時，這篇文章已經湧進200 筆留言，這些針對他文章的情緒性留言他已司空見慣，但心裡仍是不太舒坦。這起永和屋主為保護家人、失手殺死闖空門竊賊的案件，網路輿論幾乎一面倒的認為屋主屬於正當防衛，指責竊賊與檢方的愚蠢。但他的專業知識和倫理卻有不同看法。畢竟，竊賊在他眼中依然是人，他的生命應也值得仔細審視。\n\
    \    他很難同意那些以「堡壘原則」支持屋主有絕對合理權力對竊賊動武的論調。歐美的堡壘原則是西方歷史演變而來的產物，屋主有權對於侵入自宅者使用武力。但台灣法律已有對侵入住宅罪的規定，他不認為網友的說法恰當。\n\
    \    關於「過度防衛」的案子他不是沒碰過，每一次，他都謹慎的蒐羅各種資料，加害者和被害者的身體條件如何？當時的現情況如何？加害者有沒有武器？有沒有其他常人在危急時刻可以考慮的替代方法？受害者有無考慮自己防衛手段的後果？但無論他考慮怎麼周全，他心中仍有一塊無法被證據觸及的地方，而往往是那塊地方，讓他備感煎熬與矛盾。\n\
    \    「還在忙？」丈夫探頭進來。\n    他還沒回話，就聞到撲鼻而來的飯香，肚子不禁咕嚕咕嚕的叫了。\n    「先吃點東西吧。哎，你知道嗎？剛剛新聞說，我們公司那邊發生槍戰，死了兩個人，一個警察，一個歹徒。」\n\
    \    「為什麼槍戰？」「抓毒吧。」\n    「嗯。」\n    他突然沒了胃口，但不確定基於什麼原因。他告訴丈夫，晚飯先放著吧，馬上去吃。\n   \
    \ 他一生經歷的法庭和判決多不勝數，大部分幫好人辯護，其中不乏以小搏大的案子。自從進入法律之門以來，他一路信奉的就是公平與正義。他常在好人們身上看到人性的光輝，如此卑微可愛，相形下政客財閥則顯得粗魯黑暗又無恥。可是今天這個案件所展現出來的衝突，彷彿挑戰著他認知的一切。\n\
    \    他捫心自問：世界上有沒有一種罪，在開庭前就已經被定奪？又有沒有一種罪人，在為自己辯護以前，就無法再為自己辯護？"
