  - label: D
    content: 能安全的生活並不屬於人性尊嚴的內涵
  group_stem: "(四)以色列1948 年建國後就開始面對四周阿拉伯國家圍攻和巴勒斯坦解放組織不斷攻擊，戰爭似乎是以色列常態，過往的衝突，以色列幾乎都能在短時間內戰勝或達成停火協議解決危機，西方國家尤其是美國，對以色列自建國以來面臨的戰爭提供支持。\n\
    \  然而自2023 年10 月7 日以色列遭巴勒斯坦伊斯蘭組織哈瑪斯（Hamas）突擊邊境，並發射數千枚飛彈，屠殺至少1200 名邊境社區居民，並挾持約240\
    \ 名包括高齡長者、幼童和婦女為人質，繼而引發持續至今的以哈戰爭。而隨著以色列持續的反擊行動，以色列由剛開始的受害者，逐漸轉變為美國校園和歐洲各國支持巴勒斯坦人的抗議行動對象。至今以哈戰爭已僵持近一年，不僅哈瑪斯未被消滅，還有133\
    \ 名人質被扣押，以色列人民對政府既失望又憤怒，另外政府內部對人質談判與是否繼續進攻也有分歧的意見，尚未達成共識。"
