  stem: 「早期美國法律界由男性主導，因此身為女性的金斯伯格，求學與求職之路並不順利，她在哈佛法學院入學時，院長直接不客氣問她：「為什麼要來占據男性的名額？」甚至還拒絕她進入圖書館。雖然她以優異的成績畢業，但找工作時，許多公司認為其女性身分要兼顧家庭，而拒絕錄用她。」根據上述內容，可以看出金斯伯格大法官的求學與求職之路受到哪方面的不平等對待？
