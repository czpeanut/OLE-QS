- id: doc_113_台北_仁愛_社會_公民_g7s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: "以下是一部與公民概念相關的影片簡介：\n  在戰爭期間，德國商人辛德勒原本為了省成本，而僱用較廉價的猶太勞工。他的工廠生產軍用品，因為戰爭而大發橫財，但直到親眼目睹猶太人慘遭大屠殺，而自己工廠的勞工一夕之間全消失，才驚覺納粹黨濫殺無辜的行為，於是他決定幫助受苦的猶太人，他的工廠因此成為當時猶太人的避難所。最後他耗盡所有財產，拯救了約\
    \ 1,100 名猶太人。\n後記：電影「辛德勒的名單」貫穿全片中心主旨即是電影經典臺詞「拯救一個人的性命，就是拯救整個世界」（Whoever saves\
    \ one life saves the world entire）。\n請問影片中的辛德勒在目睹屠殺後，轉變為以救人為志業，正說明下列何種理念？"
  options:
  - label: A
    content: 不論是哪一種種族，人的生命應是平等的
  - label: B
    content: 以性別為區分，各性別的人都應受到尊敬
  - label: C
    content: 幫助與自己相同的種族是比較有價值的
  - label: D
    content: 大屠殺的發生會造成工廠虧損，因此為了減少虧損必須要救人。
  tags:
    chapter:
      publisher: 翰林
      book: 七上
      subject: 公民
      code: 2-1
      title: 人性尊嚴與人權
      chapter: 第2章 人性尊嚴與人權保障
    textbook: 七上公民 2-1 人性尊嚴與人權
    labeled_by: ai
