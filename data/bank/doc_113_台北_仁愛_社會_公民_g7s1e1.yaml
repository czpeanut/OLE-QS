  group_stem: "(二) 「玻璃天花板」一詞可以用來表示，由於性別差異，女性的職業選擇和職務晉升過程中，容易因為女性的身分，在升遷或重大決策的過程中，被限制或被迫接受較低的薪資，或無法與同儕男性有公平競爭職位的機會。由於這樣的無形障礙是看不到的，但卻在一般公司、機關或企業確實存在，因此被稱為「玻璃天花板」。\n\
