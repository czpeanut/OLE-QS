- id: doc_113_台北_仁愛_社會_公民_g7s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 從上文的敘述來看，文中的□□應填入何種衝突？
  options:
  - label: A
    content: 性別
  - label: B
    content: 種族
  - label: C
    content: 年齡
  - label: D
    content: 宗教。
  group_stem: "請閱讀下列文章，並回答問題：\n  澳洲原住民是最早居住於澳洲的族群，但在白人移居澳洲後，以法律的形式推行「白澳政策」，將 10 萬名原住民兒童從父母親身邊強行帶走，送往白人的收容機構和寄養家庭，這種做法讓許多原住民家庭飽嘗骨肉分離的痛苦，被強行帶走的原住民兒童稱為「被偷走的一代」。\n\
    \  20 世紀以來，澳洲原住民一直飽受醫療、就業等不公平對待，直到新政府上臺後，才以國家名義向原住民道歉。此舉最重要的是，讓澳洲白人能正確認識，他們祖先曾經加諸原住民的不公不義，唯有誠心的道歉，才有化解澳洲□□衝突的空間。\n\
    （資料來源：改寫自人間福報，「失竊世代」的轉型正義，2008/2/15）"
  tags:
