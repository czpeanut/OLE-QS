- id: doc_111_桃園_同德_國文_g8s2e3_s2_33
  section: 2
  number: 33
  type: single
  page: 5
  stem: 關於海上駕駛船隻和陸地開車，作者有何看法？
  options:
  - label: A
    content: 陸地上開車比起海上駕駛船隻來得容易
  - label: B
    content: 海上行船比之陸地開車，更有瞬間肇事的可能
  - label: C
    content: 鬆掉油門，退掉引擎，不論車或船隻皆能即刻停止
  - label: D
    content: 船隻無法絕對靜止，前進、後退、轉彎亦無法十分明確。
  group_stem: '海面遼闊，海上駕駛船隻其實比起陸地上開車還容易。

    兩根操縱桿、一把舵柄，只要熟悉它們間的搭配功能，海上行船，並不像岸上開車那様有瞬間肇事的危險。但是，要把船隻操控得精準，讓船隻能夠作業，能夠戰風戰浪，則需要相當的海上經驗和本領。

    行船許多年，海湧伯不曾特地教我開船。關於如何操控船隻，他約略只說過一句話：「就她。」

    幾年後的今天，我在駕駛艙操船擺舵，海湧伯在船前收拉漁繩。破曉時分，船前暈黄燈光波浪搖晃，從水底拉起的漁繩隨海湧伯收繩律動，一陣陣耀閃出黄澄澄光熾。西南展風強盛，海流望北淘湧，我時而催拉油門，引擎一陣急躁；時而伸長左腳，將舵柄頂倒左舷，我得時刻探頭張望船前漁繩出水角度。那俯身單腳鶴立的操船姿態，應該像一隻張展翅膀單腳後揚伸懶腰的鶴。

    我得感覺風的指掌聳推船舷，也得感覺海潮的趾爪搔湧船身，我還得運用船隻引擎、油門及船舵，來平衡掉這些外力牽扯，讓船尖頂風逆流，海湧伯才可能拉得動漁繩。

    這麼多年後我終於明白，海湧伯說「就她」的真正意思。遷就船隻，遷就風，遷就海流，「就她」這兩個字，涵括海上操船的精確要領。

    船隻是漂浮著的，她在海上不時受風力及海流牽扯，不會有絕對的靜止。不像陸地開車，無論前進、後退、轉彎和停止全都相當明確。當船隻必須停止前進時，鬆掉油門，退掉引擎，海面並沒有足夠摩擦力讓船隻即刻停止，船隻其實仍在繼續滑進。

    岸上我們有剎車可以來停住車輛，海上的話，得大力倒俥，讓一陣急促的倒俥來平衡掉船隻的慣性滑進。

    多變的風向和海流，使海洋像一位脾氣拗扭善變的姑娘，漁人行船，得多方安撫遷就，像溫柔的丈夫體貼妻子。老討海人熟知女性的細膩情緒，熟知每個分秒風力及海流對待船隻的多變牽扯關係。

    難怪初初下海那年，我試著掌舵時，海湧伯經常問我：「有聽嘸？」

    那時，我一直以為海湧伯是問我有沒有聽懂或聽見他的指示。直到現在，我才恍然明白，海湧伯問的是：「有沒有聽見船隻、聽見海流、聽見海風。」

    廖鴻基〈行船〉'
