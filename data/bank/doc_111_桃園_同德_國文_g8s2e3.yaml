  stem: 文末御史公所言：「看此光景，拿時城隍不知，放時城隍不知，都是黑面皂隸詐錢作祟耳。誰謂陰間官清於陽間官乎！」下列何者最有可能是本段文字的作用？
  options:
  - label: A
    content: 說明李貴中邪的來龍去脈
  - label: B
    content: 對整件事情提出個人評價
  - label: C
    content: 解釋黑面皂隸的身分職責
  - label: D
    content: 強調此事為個人親眼見聞。
  group_stem: '常州 蔣用庵御史家廚李貴，取水廚下，忽中惡仆地。召巫視之，曰：「此人夜行衝犯城隍儀仗，故被鬼卒擒去。須用三牲紙錢禱求城隍廟中西廊之黑面皂隸①，便可釋放。」如其言，李果蘇。家人問之，曰：「我方汲水，忽被兩個武進縣黑面皂頭來拿去，說我衝犯他老爺儀仗，縛我衙門外樹上，聽候發落。我實不知原委，今日聽他二人私地說：『李某業已盡孝敬之禮，可以放他回去，不必稟官。』將我解去索子，推入水中，我便驚醒。」

    御史公聞之笑曰：「看此光景，拿時城隍不知，放時城隍不知，都是黑面皂隸詐錢作祟耳。誰謂陰間官清於陽間官乎！」

    （注釋：①皂隸:舊時衙門裡的差役。） 袁枚《子不語卷八．蔣廚》'
