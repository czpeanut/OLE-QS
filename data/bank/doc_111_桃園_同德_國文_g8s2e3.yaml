  section: 2
  number: 36
  type: single
  page: 6
  stem: 關於這段故事的敘述，下列何者錯誤？
  options:
  - label: A
    content: 王平曾給予馬謖建議，但未被馬謖採用
  - label: B
    content: 馬謖死後，孔明因痛失人才而悲從中來、淚流不止
  - label: C
    content: 蔣琬不贊同孔明的做法，盼孔明收回成命
  - label: D
    content: 劉備有識人之明，曾提醒孔明勿重用馬謖。
  group_stem: '孔明喝退，又喚馬謖入帳，謖自縛跪於帳前。孔明變色曰：「汝自幼飽讀兵書，熟諳戰法。吾累次叮嚀告戒街亭是吾根本，汝以全家之命，領此重任。汝若早聽王平之言，豈有此禍？今敗軍折將，失地陷城，皆汝之過也！若不明正軍律，何以服眾？汝今犯法，休得怨吾。汝死之後，汝之家小，吾按月給與祿米，汝不必掛心。」叱左右推出斬之。謖泣曰：「丞相視某如子，某以丞相為父。某之死罪，實已難逃，願丞相思舜帝殛鯀用禹之義①，某雖死亦無恨於九泉！」言訖大哭。孔明揮淚曰：「吾與汝義同兄弟，汝之子即吾之子也，不必多囑。」

    左右推出馬謖於轅門之外，將斬。參軍蔣琬自成都至，見武士欲斬馬謖，大驚，高叫留人，入見孔明曰：「昔楚殺得臣而文公喜②。今天下未定，而戮智謀之士，豈不可惜乎？」孔明答曰：「昔孫武所以能制勝於天下者，用法明也。今四方分爭，兵交方始，若復廢法，何以討賊耶？合當斬之。」須臾，武士獻馬謖首級於階下。孔明大哭不已。蔣琬問曰：「今幼常得罪，既正軍法，丞相何故哭耶？」孔明曰：「吾非為馬謖哭。吾思先帝在白帝城臨危之時曾囑吾曰：『馬謖言過其實，不可大用。』今果應此言，乃深恨己之不明，追思先帝之明，因此痛哭耳！」


    註：①舜帝殛鯀用禹之義：舜起初用鯀治水，因鯀治水失敗而殺之，再用鯀之子禹治水。禹治水大獲成功，後來舜帝將地位禪讓給禹。

    ②楚殺得臣而文公喜：春秋時代時晉 楚爭霸。晉文公於城濮大敗成得臣所率領的楚軍，卻因成得臣尚存而對後勢感到憂心。後成得臣因受到楚成王責備而羞愧自殺，晉文公才喜出望外，認為勝負已定。

    (節錄自《三國演義》九十六回)'
