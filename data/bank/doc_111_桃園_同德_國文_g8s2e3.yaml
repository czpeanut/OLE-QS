    月輪自海面昇舉，銀光粼粼，星光漸漸稀微，點點漁火熱鬧浮散在銀潔海面，天地宛如倒置，閃燦星辰全落在海面湧動。

    飛魚網淺淺浮在海面，網頭兩端各繫了一盞漁燈，村子裡的男人似乎都來了，燈火密密湧湧簡直如海上鬧市夜街。

    那天夜航到了漁場後，當水下燈垂入海面，才一、兩分鐘，舷邊就熱鬧地游聚了一群飛魚。牠們翅翼斜展抖擻，圍住水下燈停止游進，從船上看下去牠們不像是魚，倒像是一群被燈光懾怔住的大型蜻蜓。後斜抖顫的雙翼，使牠們看起來像是在吮吸燈光的能量。

    又一、兩分鐘過去，吸飽了燈光後，牠們便渾身是勁，瘋狂神經質地衝撞起來，光暈水影下，牠們化成一線線撇閃的影子，舷牆上乒乒砰砰一陣機關槍掃射的中彈聲，有的凌空飛落在甲板上顫動。外圍的飛魚又大批補進來光暈裡抖翼覓光，稍稍一陣後，又暴走散去。燈光彷彿是牠們的亢奮藥引！

    我俯下舷邊，手臂伸進水裡，燈泡邊還在充電靜止的飛魚，竟然允許我用指頭，如愛撫寵物般輕輕順撫牠的頭。

    隔天，白日行船，船尖破浪如在耕犁海洋，飛魚從船頭四散驚起，如田地犁頭邊驚飛的蚱蜢。

    牠們的下尾鰭比上尾鰭稍長，起飛剎那，尾柄急遽顫抖得模糊了形影，突出的下尾鰭像一根電動搖槳，快捷地點撥水面，海面暈出一圈圈牠的漣漪。窸窣拍水聲中，牠平展藕紫色長翅，凌空滑翔遠去。

    傍晚我們在海上尋鯨正要返航，無線話機傳來飛魚船通報—看見「大海翁」，噴水一丈高，三艘船不夠長—船長問明了方位，算算有十二浬遠，航程超過一個小時，還是決定轉航追蹤大海翁去。

    飛魚一路熱鬧相伴，離岸越來越遠。一種俗稱「深水烏」的飛魚被船頭掘起，牠有著黃色黑邊如彩蝶樣的美麗翅翼，也飛起一群蜜蜂大小的小飛魚，像一群飛灰蚊蚋飄在海面。

    牠們紛飛散去各奔西東，落水後如何相聚重逢？牠們飛起是無奈憋氣，抑或暢懷享受水面上的空氣？牠們飛起空中是竄逃？是遊戲？是苦？是樂？飛過蘭嶼飛到臺灣沿岸，牠們失落了什麼？

    牠們到底為了什麼飛在海面？這一連串沒有答案的問題相伴我們漫長的尋鯨水路。飛魚船亮起的漁燈遠遠在望，我們又為了什麼下海遨遊？

    「海翁在哪裡？」天色已昏，四處尋不著海翁，倒是飛魚熱情相伴相隨。

    回到岸上，天色已黑，又見阿美族男人興致勃勃推船去海上瘋狂飛翔。

    廖鴻基〈飛魚〉'
