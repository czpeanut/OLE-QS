  group_stem: '「聶隱娘者，唐 貞元中，魏博①大將聶鋒之女也。年方十歲，有尼乞食於鋒舍，見隱娘，悅之。云：「問押衙②乞取此女教。」鋒大怒，叱尼。尼曰：「任押衙鐵櫃中盛，亦須偷去矣。」及夜，果失隱娘所向。鋒大驚駭，令人搜尋，曾無影響。父母每思之，相對涕泣而已。後五年，尼送隱娘歸。告鋒曰：「教已成矣，子卻領取。」尼歘③亦不見。」

