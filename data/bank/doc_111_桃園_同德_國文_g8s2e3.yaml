  stem: 下列關於〈管好舌頭〉一文的分析，何者正確？
  options:
  - label: A
    content: 文中以對比、設問手法，說明舌頭是造福、造禍的器官，點出「如何管好舌頭」是個人成敗的關鍵
  - label: B
    content: 以蘇秦、張儀等人作為反襯，說明能言會辯之人縱然可為自己帶來財富，卻也導致歷史性的災禍
  - label: C
    content: 引用中外名言、俗諺，正面說明管好舌頭的好處，提醒我們多閱讀，以求言之有物，言之成理
  - label: D
    content: 本文旁徵博引，夾敘夾議，善用典故說理，並以自身事例說理，頗能彰顯作者濃厚的文學底蘊。
