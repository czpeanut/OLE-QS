  section: 1
  number: 6
  type: single
  page: 1
  stem: 清末婦女意識逐漸覺醒，以秋瑾為例，她曾奉父母之命結婚，但後來掙脫傳統婚姻的束縛，前往日本留學，最後甚至參加了革命運動。請問：下列哪一項女性應扮演的角色，較符合秋瑾的想法？
  options:
  - label: A
    content: 遵從父母之命，做個三從四德的女子
  - label: B
    content: 遵守「男主外，女主內」，扮演好賢妻良母的角色
  - label: C
    content: 接受新式教育，追求獨立自主
  - label: D
    content: 為家庭奉獻自己，照顧家庭成員。
