  section: 1
  number: 5
  type: single
  page: 1
  stem: 「自強運動」與「戊戌變法」都是中國近代非常重要的改革運動，清帝國試圖以它們來應付時勢的巨變。請問：關於這兩個改革的共同點，下列敘述何者「錯誤」？
  options:
  - label: A
    content: 兩皆因對外戰敗而展開
  - label: B
    content: 兩者皆被守舊派人士所反對
  - label: C
    content: 前者推動者有康有為，後者推動者有曾國藩
  - label: D
    content: 前者有派遣留美學生，後者有設立京師大學堂。
