  section: 1
  number: 4
  type: single
  page: 1
  stem: 清末以來，報刊雜誌成為中國境內流通廣泛且具有極重要意義的資訊來源，其所涉及的議題極廣且包含中外。請問：關於報刊雜誌在清末的發展，下列敘述有幾項正確？(甲)美國傳教士在上海創辦《萬國公報》
    (乙)《申報》是以商業、新聞為主題的漢文報紙 (丙)白話報刊與畫報帶動庶民文化的變化 (丁)知識分子透過報刊雜誌發表言論 (戊)報刊雜誌增進大眾對公眾事務的關心。
  options:
  - label: A
    content: 5 項
  - label: B
    content: 4 項
  - label: C
    content: 3 項
  - label: D
    content: 2 項。
