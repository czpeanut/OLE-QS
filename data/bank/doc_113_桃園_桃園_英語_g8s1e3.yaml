  group_stem: "Alicia’s Travel Plan\n     Alicia, an American visitor, plans to visit\
    \ Taiwan for seven days with her Taiwanese friend, Amy. On their first day, they\
    \ will get to the city library in Beitou, Taipei City, by taxi. It is a green\
    \ library, and many people enjoy reading and taking a walk there. After visiting\
    \ that library, they will enjoy a hot spring and have a good sleep in the hotel.\n\
    \       On the second day, they will take a train to Hualien and go hiking in\
    \ the mountains. It is comfortable to go around the Taroko Gorge National Park\
    \ and enjoy fresh air and wonderful natural scenery. They will stay in a church\
    \ there for one night. On the third day, it will cost them NT$1,500 for one person\
    \ to take a shuttle bus to Nantou. They need to take the bus at 9 a.m. from Taroko\
    \ Gorge. During the ride, they can get on and off at each stop. They’ll get to\
    \ Qingjing Farm around 3:30 p.m. On that night, they will stay in the hotel of\
    \ Qinjing Farm.\n       On the fourth day, they’ll visit Green Green Grassland\
    \ and watch the sheep-sheering show. Tasting local food and fruit and taking good\
    \ pictures of the tall mountains are very comfortable. Later that day, they’ll\
    \ take a bus to Changhua. On Day five, praying at a Matzu temple, the goddess\
    \ of Sea, may bring them joy and experiences of the past. Taking a bite of local\
    \ snacks and food is also a must.\n        Alicia and Amy will take a train from\
    \ Changhua to Tainan on the sixth day. In the old department store, Hayashi, people\
    \ can enjoy taking the elevator and experiencing the good time of the past. It’s\
    \ also nice for people to walk around and have delicious snacks and food on Guohua\
    \ Street. Having a plate of fresh fruit is a joy in Tainan. The next morning,\
    \ enjoying a bowl of beef soup and sticky rice dumplings in Tainan is wonderful.\
    \ Then, it will take only thirty minutes to take an airplane to Penghu. The one-way\
    \ ticket is about NT$1,590. There, they can ride a motorcycle around the island,\
    \ have some delicious seafood, and see a stone weir. At night, they can even go\
    \ night fishing.\n\n\U0001F4D6 sheep-sheering show 脫羊毛秀    local 在地的    goddess\
    \ 女神    elevator 電梯    stone weir 石滬"
