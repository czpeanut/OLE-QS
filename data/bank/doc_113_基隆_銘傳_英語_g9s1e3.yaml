  section: 5
  number: 46
  type: single
  page: 3
  stem: ( ) 46. What are SDGs?
  options:
  - label: A
    content: A set of rules for schools.
  - label: B
    content: Goals to help improve the world.
  - label: C
    content: A program for building new cities.
  - label: D
    content: A law created by governments.
  group_stem: 'What Are SDGs?

    The Sustainable Development Goals (SDGs) are 17 global goals set by the United
    Nations in 2015. These goals aim to solve problems like, hunger, and climate change
    by 2030. Some common SDGs include Education, Clean Water, and Climate Action.


    Why Are SDGs Important for Students?

    As junior high school students, you might think SDGs are for adults or governments,
    but they are important for everyone. For example, you can support Climate Action
    by using less plastic or riding your bike instead of taking a car. You can also
    help achieve Zero Hunger by avoiding food waste.


    How Can Students Take Action?

    There are many simple things you can do:

    1. Recycle your waste and save water to protect the environment.

    2. Volunteer in your community to help others in need.

    3. Share what you learn about SDGs with your friends and family.

    By taking small actions, students like you can make a big difference in creating
    a better world.

     climate 氣候 avoid 避免 achieve 達成 community 社區 government 政府'
