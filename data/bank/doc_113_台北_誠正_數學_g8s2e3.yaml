- id: doc_113_台北_誠正_數學_g8s2e3_s2_2
  section: 2
  number: 2
  type: calc
  page: 2
  stem: '若誠正國中附近要新規劃一條捷運線，從學校站出發，經過兩個中間站，最後到達深坑老街站，這條線有四個站點，依序為誠正國中站、$B$ 站、$C$ 站、深坑老街站，站點之間的距離（以公里為單位）分別是三段正整數長度，三段距離加起來剛好是
    15 公里。


    為了讓捷運線路設計合理，規定任兩站之間的距離和必須大於第三段距離，避免有一段距離過長，讓乘客覺得不方便。

    (1) 請將數字 15 拆成兩個正整數相加，寫出任意一種有可能的組合即可。

    (2) 找出四組符合規定的三段距離組合，並把每組數字由小到大排列，不同順序但相同數字的組合，只算一種。

    例如：(3，6，6)和(6，6，3)算同一種組合。'
