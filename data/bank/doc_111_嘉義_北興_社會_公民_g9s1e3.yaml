- id: doc_111_嘉義_北興_社會_公民_g9s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: (  )依據上文判斷，以本國貨幣兌換下列何國貨幣的匯率最高？
  options:
  - label: A
    content: 美金
  - label: B
    content: 港幣
  - label: C
    content: 英鎊
  - label: D
    content: 澳幣。
  group_stem: "許多人會擔任國際志工，在出國前可先至銀行兌換準備前往服務國家的外幣。由於各家銀行給的匯率不同，在兌換前可以先查看哪家最划算。盡量不要在機場兌換，因為機場匯率通常較差。\n\
    \  如果是在國內先換好外幣帶在身上，就要注意各家銀行現金匯率。以附圖為例，若要換美金，1 美金要用 29.75 元新臺幣兌換。\n  假如在國內沒有提供兌換該國貨幣的服務，可以先換取流動性較高的外幣，到當地再兌換。除了到時候兌換方便外，有些額外行程也可用美金來付款。而兌換時記得以大面額為主，因為到了當地銀行，面額大的匯率會比面額小的來得佳。假如要攜帶信用卡或是國際提款卡，一定要確認卡片已經開卡，也要確認可以在即將前往的國家消費或提款。\n\
    \n| 幣別 | 現金匯率-買入 | 現金匯率-賣出 |\n|---|---|---|\n| 美金 | 29.08 | 29.75 |\n| 港幣 | 3.647\
    \ | 3.851 |\n| 英磅 | 36.64 | 38.76 |\n| 澳幣 | 20.65 | 21.43 |\n| 日圓 | 0.2701 | 0.2829\
    \ |\n| 泰銖 | 0.8061 | 0.9961 |"
  tags:
