  group_stem: "經濟學者雷諾曾說：「什麼是失業人口？什麼是非勞動力？在調查過程中有不少盲點。何謂尋找工作？要努力到什麼程度才叫尋找工作？這個觀念也一樣含混不清。」求職者如果一週前還努力找工作，現在只是稍作休息，家人認為他是失業者，他自己也這麼認為，但政府卻會認定他是「想工作而未找工作」的非勞動力。這樣看來，非勞動力與失業者的距離，還真的只在一線之間。\n\
    \  如果有一份工作是徵求「營運總監」，要求全天候隨叫隨到，甚至沒有支付任何薪水時，有人會應徵嗎？但現實當中，就有人如此付出著，那就是專心處理家務的家庭主夫或家庭主婦，又可被稱作「家管」。然而家管向家庭成員表達不滿時，他通常被認為是一個「歇斯底里的人」，而不是一位「正在向老闆抗爭的工人」。\n\
    \  另外，2020 年因防疫需求，有些家庭成員需要居家辦公，家人的相處時間增加，卻導致原本的生活的平衡被打破。在家擔任家管者的休息時間被縮短，必須繼續伺候著居家辦公的配偶，而看到伴侶的耐心、溫和大多給了同事，從來沒有在家人之間的相處中呈現，使得這種「可以給工作夥伴而不能給家人」的失望被喚起。"
