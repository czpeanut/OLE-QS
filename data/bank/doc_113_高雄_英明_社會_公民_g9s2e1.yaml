  section: 1
  number: 13
  type: single
  page: 2
  stem: 中國企業比亞迪公司在巴西設立工廠，當地政府調查發現，該企業聘僱的中國籍工人薪資低廉，且居住與工作環境條件惡劣，引發社會關注。此事件最可能涉及全球化下的哪一項挑戰？
