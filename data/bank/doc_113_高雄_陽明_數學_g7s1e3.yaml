- id: doc_113_高雄_陽明_數學_g7s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '智晴解方程式 $\frac{3}{2}(3x+2)=2x+3$ 的步驟如下：

    步驟一：將兩邊同乘以2，得 $3(3x+2)=2(2x+3)$

    步驟二：將兩邊去括號，得 $9x+6=4x+6$

    步驟三：將兩邊同減6，得 $9x=4x$

    步驟四：將兩邊同除以 $x$，得 $9=4$

    智晴的做法得到錯誤的結論，請問智晴是從哪一個步驟開始發生錯誤？'
  options:
  - label: A
    content: 步驟一出錯
  - label: B
    content: 步驟二出錯
  - label: C
    content: 步驟三出錯
  - label: D
    content: 步驟四出錯
