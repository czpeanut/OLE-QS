- id: doc_113_高雄_獅甲_社會_公民_g9s2e2_s1_32
  section: 1
  number: 32
  type: single
  page: 1
  stem: 有關小農公司的敘述，下列何者正確？
  options:
  - label: A
    content: 所屬商品市場的加入門檻較高
  - label: B
    content: 薄利多銷是該公司的主打策略
  - label: C
    content: 市場競爭程度與手搖飲店相似
  - label: D
    content: 酪蛋白鮮乳是普遍常見的產品。
  group_stem: "市面上有多種牛奶品牌，鮮乳市場廠商眾多的情況下，有一家小農公司秉持著無成分調整、獸醫現場把關和公平交易的初衷，致力成為消費者與酪農間的橋梁。同時藉消費者的力量，形成各種「善的循環」，除了支持一個產業的改革，該公司更進行獸醫培訓、送愛至偏鄉等計畫。右表一為該公司的重要事件：\n\
    \    自2015 年，該公司總計捐贈了20 多間育幼院，並長期資助鮮乳補給品給宜蘭、花蓮和臺東等地的棒球隊。在銷貨通路上，不僅上架各賣場與超商等知名連鎖店，更於\
    \ 2020 年推出臺灣首支更容易被人體吸收「酪蛋白鮮乳」。（資料來源：改寫自林芷湲，市面乳品種類多！農委會「2 標章」教你分辨牛奶真偽，新頭殼，2020/07/02）\n\
    \n| 時間 | 事件簡介 |\n| --- | --- |\n| 2015 年 | 由創辦人暨乳牛獸醫成立。 |\n| 2018 年 | 獲得了英國的 SROI\
    \ 的認證：「每投入 1 元，能產出 4.05 元的社會影響力報酬」。 |\n| 2019 年 | 獲選為亞洲唯一米其林指定的乳品合作夥伴。 |\n| 2020\
    \ 年 | 攜手經濟部工業局，推出「全民鮮乳銀行智慧公益服務」，讓消費者可將自己的消費轉成愛心，捐贈至偏鄉等需要關懷的單位。 |\n\n表一"
