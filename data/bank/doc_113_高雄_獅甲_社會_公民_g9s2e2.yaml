    我國政府也致力建立更完善的法律制度來保障兒童權益，並以符合聯合國的標準為目標。例如，修訂《兒童及少年福利與權益保障法》，促使政府、社會大眾與家長正視兒童福利與虐待兒童的問題；修訂《教育基本法》，明文禁止校園體罰，藉由公權力保障學生不受體罰。政府的各種作法，目的是預防及保護兒童免於一切形式的暴力侵害，希望提供兒童更完善的成長環境。請回答36-38
    題：'
