- id: doc_113_高雄_獅甲_社會_公民_g9s2e2_s1_38
  section: 1
  number: 38
  type: single
  page: 2
  stem: 若文中傳統新聞媒體業者與社群網路平臺業者，二者間對於「新聞有價」的爭議事件發生在我國，下列哪一種方式可用來處理此類糾紛？
  options:
  - label: A
    content: 向檢察官提出告訴，遏止侵害新聞自由行為
  - label: B
    content: 向調解委員會聲請調解，協調民事侵權賠償
  - label: C
    content: 透過行政救濟管道，避免私人財產受到不法侵害
  - label: D
    content: 透過自由市場公平競爭，由閱聽人淘汰劣質媒體。
  group_stem: "近年來，由於網路科技的發展，閱讀紙本報章雜誌的讀者大幅減少，使得傳統新聞媒體的廣告收入大幅縮水。這是因為民眾獲取新聞的習慣逐漸由閱讀紙本改為線上閱讀，而被分享在社群網路平臺上的新聞連結也成為許多民眾獲取資訊的管道，廣告業主認為瀏覽量較多的社群網路平臺能帶來更高的曝光度，轉而將廣告資金投入瀏覽量較多的社群網路平臺。\n\
    \    澳洲當地的傳統新聞媒體業者認為，社群網路平臺僅是分享新聞連結，並沒有付出成本從事新聞產製工作，卻能獲得較多的廣告收入，因此傳統新聞媒體業者主張「新聞有價」，要求社群網路平臺為這些新聞內容付費。但社群網路平臺業者認為本身只是提供新聞曝光的平臺，反而還能增加新聞的瀏覽量，要求他們付費並不合理。\n\
    \    最後在澳洲當地傳統新聞媒體業者的遊說下，澳洲政府制定《新聞媒體與數位平臺強制議價法》，要求這些分享新聞連結的社群網路平臺，應與傳統新聞媒體業者達成付費協議。在澳洲政府通過此一法案後，其他國家政府也在觀望這個作法是否可行，未來可能會有更多的國家跟進，要求這些社群網路平臺對於所分享的新聞內容付費。"
