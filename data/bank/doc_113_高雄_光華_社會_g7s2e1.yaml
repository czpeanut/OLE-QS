  stem: 根據上文及觀察附圖中不同年分各州眾議員席次的變化情形，下列敘述何者「錯誤」？
  options:
  - label: A
    content: 席次僅有一席的州並未出現在南部
  - label: B
    content: 德州的席次逐年增加
  - label: C
    content: 加州席次最多表示人口均為正成長
  - label: D
    content: 整體而言，席次變化最小的是東北部。
  group_stem: 根據《美國憲法》，眾議院的435 席議員席次是按照各州人口數分配，而每10 年會依據人口普查結果重新分配席次，且每個州至少有1 個席次。附圖為不同年分各州眾議員席次的變化情形，每位眾議員平均代表的美國公民也從646952
    人變成761169 人。其中，僅有1 席的州為圖中標示斜線的區域，而席次最多的州皆為加州，在2020 年為52 席。臺灣現行的區域立委席次分配也採類似美國的方式，例如73
    位區域立委中，臺北市應選出8 人，雲林縣應選出2 人，請依據附圖回答11~12 題。
