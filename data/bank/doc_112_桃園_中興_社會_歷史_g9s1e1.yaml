  section: 1
  number: 8
  type: single
  page: 1
  stem: 歐西里斯是冥界之神，是古埃及最重要的神明之一。在神話中，歐西里斯原是古埃及的賢君，但他的弟弟因為嫉妒而想要奪取王位。於是，他的弟弟用計殺害了歐西里斯，又將他的屍體切成多塊，拋入尼羅河中。歐西里斯的妻子克服各種困難，尋回歐西里斯各部位的軀體，並製成木乃伊，讓他得以復活。眾神最後讓歐西里斯留在冥界，負責審判死者靈魂的工作。請問歐西里斯這位主宰循環再生力量的是哪位神明？(習作題)
