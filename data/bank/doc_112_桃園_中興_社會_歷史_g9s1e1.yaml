  section: 1
  number: 17
  type: single
  page: 1
  stem: 「公民的唯一職業就是戰士，從一出生就受戰爭的訓練。經過部族首領的檢查之後，病弱的孩子被棄置於荒野，較為強壯的孩子才能得到撫養。所有的男孩子都在軍營裡受訓，一直到二十歲為止。訓練的目的是要使他們堅強、不怕痛苦、服從紀律。文化教育或科學教育都被認為是無意義的事，唯一的目的就是要造就全心全意為了國家的好戰士。」由上文敘述可推測，這是上古時期哪一國家的公民？
