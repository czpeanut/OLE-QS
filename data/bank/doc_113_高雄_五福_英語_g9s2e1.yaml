    \ sauces, spices, or even beer.  It is eaten across the UK and likely doesn’t\
    \ come from Wales.\nWhy, then, is it called Welsh rabbit?  Well, the study shows\
    \ that it probably started as a joke.  This joke was\ndesigned to make fun of\
    \ the Welsh by saying that they were too poor to eat real rabbit meat.\nDutch\
    \ babies\nDutch babies are giant pancakes that are served with sweet treats like\
    \ honey and fruit or foods like bacon and\neggs.  Besides, they’re cooked in the\
    \ oven unlike other common pancakes.  This makes them light and fluffy.\nThey\
