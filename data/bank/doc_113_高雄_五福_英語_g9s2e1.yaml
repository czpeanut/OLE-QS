  group_stem: "(6-7)\nHave you ever heard the term elephant in the room?  This animal\
    \ metaphor means a clear problem that no\none wants to discuss.  Metaphors like\
    \ this make the ideas people don’t understand easier to understand.  Take\nfour\
    \ interesting animal metaphors, black swan, gray rhino, white elephant, and black\
    \ jellyfish, for example.\nBlack swan refers to an event that is unexpected and\
    \ has a great impact.   It comes from an incorrect\nbelief that was held by people\
    \ in the past.  A long time ago, people believed that all swans were white.  This\n\
    changed in 1697 when black swans were discovered in Australia.  Today, people\
    \ use this metaphor when\nsomething that people didn’t see coming happens.\nGray\
    \ rhino is another powerful metaphor.  It describes a threat that is ignored,\
    \ but it is both highly\nprobable and dangerous.  Gray rhinos are large, hard\
    \ to miss, and can lead to a lot of problems.  Therefore, this\nmetaphor helps\
    \ us think about the dangers that are right in front of us.\n     White elephant\
    \ refers to something that is more trouble or more expensive than its true value.\
    \  In the past,\nrare white elephants were expensive to care for.  Therefore,\
    \ this metaphor is used for things that are not useful\nand become expensive ones.\n\
    Black jellyfish is a newer metaphor, but it’s very interesting.  It describes\
    \ a problem that seems not\nimportant but truly has hidden dangers.  The term\
    \ refers to a jellyfish bloom.  One jellyfish on its own seems\npretty harmless,\
    \ but jellyfish blooms can lead to a lot of problems and have even been known\
    \ to shut down power\nplants by the coast.  So when a black jellyfish happens,\
    \ it means small changes lead to a big problem, but the\ntrue dangers of the changes\
    \ were not found at first.\nAnimal metaphors in English help us picture and understand\
    \ different meanings.  By learning about these,\nwe can come to know more about\
    \ a language and use them better in the everyday life.\n\n metaphor 隱喻   impact\
    \ 影響   describe 描述   ignore 忽視   value 價值   bloom 綻放"
