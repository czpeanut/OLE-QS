    Lisa: How about making a cake for her?

    Kay: I''m <u>lousy at</u> making cakes or cookies, but there is one thing for
    sure.

    Lisa: Haha! You like to eat, but you aren''t good at making cakes. Am I right?

    Kay: You''re really my cute sister. You understand me so well. By the way, what
