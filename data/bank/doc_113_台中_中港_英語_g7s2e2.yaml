- id: doc_113_台中_中港_英語_g7s2e2_s5_35
  section: 5
  number: 35
  type: single
  page: 4
  stem: Which holiday is on a different date every year?
  options:
  - label: A
    content: Easter.
  - label: B
    content: Christmas.
  - label: C
    content: Halloween.
  - label: D
    content: New Year's Day.
  group_stem: '(II)

    There are many holidays in a year. Some of them are on the same dates every year.

    For example, January first is New Year''s Day. February fourteenth is Valentine''s
    Day for lovers, October thirty-first is Halloween, and December twenty-fifth is
    Christmas.

    However, some of them aren''t on fixed dates. For example, Easter falls in late
    March or early April. Children find eggs in the garden on that day. Mother''s
    Day is on the second Sunday of May. Thanksgiving comes on the fourth Thursday
    of November. The day after Thanksgiving is Black Friday, a big shopping day in
    the USA.

    Each holiday has its own special meaning. People celebrate different holidays
    in different ways. And they always have a lot of fun on those holidays.

     fixed固定的 fall落在 celebrate慶祝'
