  - label: D
    content: 近期，台灣民眾更關注相關的 Me Too 事件，在各領域有越來越多受害者站出來分享自己的經歷，要求伸張正義，進而引起了人們對於台灣社會存在的性別歧視、權勢不平等等問題有了更進一步的關切
  group_stem: '※『…某報導：Me Too(我也是)最早起源於 2006 年美國非裔女權運動者塔拉納·伯克(Tarana Burke)在 Myspace
    上使用了「Me Too」這一短語，與當時的反性侵運動做連結；之後到 2017 年，好萊塢知名製片哈維韋恩斯坦(Harvey Weinstein)因利用權勢性侵多名明星及女性工作人員而陸續遭到指控，#Me
    Too 便成為在社交媒體上廣泛傳播的一個主題標籤。這股浪潮隨即席捲國際，不僅在數十個國家使用，在非英語地區甚至還有不同語言的對應標籤。「Me Too」這場全球性的社會運動，為性侵害倖存者提供了一個分享故事的平台，打破了圍繞著不當性行為的沉默和恥辱，它揭露加害者的罪行，在受害者之間建立一種圍結感，並倡導改變社會態度和制度。

    Me Too 運動成功地提高了人們的關注——其實在各行業和社會環境中「性騷擾」和「性侵犯」普遍存在，讓大家對這個問題有更深入的了解；它引發了公眾對話，並挑戰了容忍此類行為的社會潛規則，並引發改革的呼聲。此外，這個運動也挑戰了長期存在的、導致性騷擾和性侵害發生的不當態度和做法，促進了職場文化的轉變，更重要的是，它強調加害者必須完全對自己的行為負責，沒有人可以例外。

