- id: doc_112_桃園_中興_社會_公民_g8s1e1_s1_26
  section: 1
  number: 26
  type: single
  page: 4
  stem: '大法官在2021 年8 月20 日做出字807 號解釋：針對《勞動基準法》第49 條第一項規定:

    「雇主不得使女工於午後十時至翌晨六時之時間內工作。但雇主經工會同意，如事業單位無工會者，經勞資會議同意後，且符合下列各款規定者，不在此限：

    一、提供必要之安全衛生設施。

    二、無大眾運輸工具可資運用時，提供交通工具或安排女工宿舍。」

    宣告違反《中華民國憲法》第7 條保障性別平等意旨，並於解釋公布之日起立即失效。

    針對大法官做出的解釋，勞動部應受到司法院解釋的拘束，勞動部將檢視並提出後續修法規畫，對於保障懷孕、哺乳期間的婦女拒絕夜間工作的權利，勞動部也將提出保護措施。

    (參考資料：改寫自限制女性夜間工作違憲，勞動部3 個月內提修法規畫，中時新聞網，2021/9/14。)

    根據上文所述內容，主要說明《憲法》的何項特性？'
