- id: doc_112_桃園_中興_社會_公民_g8s1e1_s1_28
  section: 1
  number: 28
  type: single
  page: 5
  stem: '請閱讀下列文章後，回答問題：

    依據上文，立法院提出的疑慮，主要從何種角度來探討走私動物遭殺的爭議?'
  options:
  - label: A
    content: 人性嚴
  - label: B
    content: 法律位階
  - label: C
    content: 基本權利
  - label: D
    content: 人治精神
  group_stem: '2021 年海巡單位查獲100 多隻走私貓，2 天後全被安樂死，引發討論。事實上《海關緝私條例》與《動物傳染病防治條例》等法規，均無動物必須立即被銷毀的規定。

    查獲走私動物一律撲殺的慣例，是依據行政院農業委員會為處理「走私農產品」而訂定的《走私没入動物及其產品處理作業程序》。立法院對此，也提出疑慮，希望相關單位針對有關銷毁走私動物的程序及方式再進行研議。

    許多民眾不知道被走私的活體動物，依慣例會被安樂死，也因為這個事件，正視《走私沒入動物及其產品處理作業程序》已不合時宜。但無論是過去曾被銷毀的兔子、寵物鼠或是爬蟲動物。都一樣是被賦予生存權利的生命，不是人類附屬的產品。不應該因過時、有待修正的法規而無辜喪命。

    (資料來源：別讓154 隻貓咪慘劇造成的對立，模糊我們捍衛動物權利的初衷，風傳媒，2021/8/31)'
