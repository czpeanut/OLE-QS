- id: doc_112_桃園_中興_社會_公民_g8s1e1_s1_30
  section: 1
  number: 30
  type: single
  page: 5
  stem: 上文所稱的起義成功，是在哪裡發生的？
  options:
  - label: A
    content: 廣州
  - label: B
    content: 西安
  - label: C
    content: 南京
  - label: D
    content: 武昌
  group_stem: '國慶日舉國歡騰、人民喜樂，是國家的盛事。有些國家更賦予特殊意義的名稱，如美國稱為獨立日、如丹麥稱為憲法日，也有直接以國名加上日，如澳大利亞日…。

    我中華民國國慶日，又稱雙十節，是因為在1911 年10 月10 日，成功起義，各地革命活動陸續展開，各省紛紛響應，最終推翻滿清政府，建立中華民國。

    清朝末年，國政敗壞，國運如風中殘燭，屢屢為外人所欺凌、武力脅迫、恫嚇。人為刀俎，我為魚肉。國人亟思自強之道，當是時也，多數知識份子，想取法日本從「君主專制」成功過渡至「君主立憲」，期許能大強國力，史稱「立憲派」。

    唯獨  國父慧眼獨照，認為清廷不可能行憲，革命，才能改變全中國人的命運，遭遇多少次失敗，依然就是奉行革命，是為「革命派」。

    最後「立憲派」與「革命派」同心推翻滿清政府，開創新中國，即為中華民國。'
