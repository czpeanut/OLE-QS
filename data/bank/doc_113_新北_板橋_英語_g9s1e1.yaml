  group_stem: 'III


    Dear Amy,

    How have you been lately? Are you still busy preparing for the play? I am happy
    to know that you''ll act in the famous play, but on the other hand, I am worried
    about you, too. Your mom told me that you have been on a diet for two months because
    you want to be as slim as possible. She said that you only ate very little at
    each meal, and sometimes you even skipped meals. As your aunt, I really hope that
    you can lose weight in a healthy way. Our body needs different types of nutrients
    to work. If you don''t have enough nutrients, your body won''t be able to work
    well. You may also look weak and pale. You don''t want to look like that on stage,
    do you? Also, you may be surprised to hear this: Healthy fats are important to
    your body. If you are interested in getting slim in a healthy way, just give me
    a call. I''ll be happy to share some tips with you.

    Love,

    Tracy


