- id: doc_113_新北_永和_社會_g8s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '非洲為咖啡的發源地，自然條件非常適合咖啡樹的種植，且以生產高品質咖啡豆而聞名，下表為漠南非洲三個知名的咖啡生產國簡介。請問：下表的三個咖啡生產國，來自圖一哪一區？
    (L6)


    | 國家 | 敘述 |

    | --- | --- |

    | 衣索比亞 | 號稱「咖啡原鄉」，非洲咖啡出口最多的國家。其著名的咖啡產區有西達摩、哈拉爾、耶加雪菲等。 |

    | 坦尚尼亞 | 很早就深得歐洲人的喜愛，在歐洲還有「咖啡紳士」的別名。 |

    | 肯亞 | 莓果酸香非常明顯，常常可以嘗到黑加侖及番茄的香氣，「肯亞AA」是肯亞非常知名的咖啡豆。 |'
