- id: doc_113_新北_永和_社會_g8s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 圖二為公平貿易標章，公平貿易是一種有組織的社會運動，倡議消費者以合理價格向生產者購買貼有公平貿易標籤的商品。公平貿易不是施捨，而是提供生產者一種永續的方法來改善他們的生計，讓他們真正有機會脫離貧窮，不再需要依靠捐款者的援助。請問：此組織主要是想幫助非洲農民解決何項問題？
