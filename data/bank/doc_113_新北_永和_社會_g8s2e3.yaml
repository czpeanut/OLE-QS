  section: 1
  number: 12
  type: single
  page: 2
  stem: 圖四為漠南非洲某國家主要出口品項比例圖，從圖中資訊可知可可豆為該國占比最高的出口產品。請問：關於該國地理位置及產業發展狀況敘述，下列哪些正確？（甲）該國可能分布在西部非洲（乙）經濟結構具殖民式經濟特徵（丙）國內糧食生產充足且能出口（丁）對外貿易形成順差。
    (L6)
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 丙丁
