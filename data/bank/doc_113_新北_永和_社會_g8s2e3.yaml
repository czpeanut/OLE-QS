- id: doc_113_新北_永和_社會_g8s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 非洲過去40 年的人口迅速增長，尤以撒哈拉沙漠以南最為顯著，不僅開始超越其他大陸，龐大迅速的人口增加比例更超過了印度和中國，成為全球人口增長最快速的地區之一。這裡的嬰兒出生數從1990
    年後增加了21%，預計在2050 年將增至37%；估計2100 年世界人口數前10 名國家，將有4 國來自撒哈拉以南的非洲區域，非洲總人口數將暴增至今日的3
    倍。請問：非洲為何擁有高人口成長率？(甲)死亡率漸降(乙)高出生率(丙)糧食生產能力高(丁)教育程度低，節育工作不易推行。以上何者正確？ (L6)
