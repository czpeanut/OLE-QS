- id: doc_113_新北_永和_社會_g8s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 觀察非洲內部的行政區劃分，發現多國間常出現直線或直角國界，而不是常見的河川、山脈等自然界線。據統計，非洲國家邊界有 44% 是按經線或緯線劃分的；30%
    的邊界是用直線或曲線的幾何方法劃分的；僅有26% 是由河流、山脈等構成的自然邊界線。請問：上述現象與非洲哪項發展背景有關？ (L6)
  options:
  - label: A
    content: 用於分辨各國發展程度
  - label: B
    content: 政變頻繁導致內戰不停
  - label: C
    content: 曾被歐洲列強殖民統治
  - label: D
    content: 族群多元複雜爭執不斷。
