  type: single
  page: 2
  stem: 「那瑪夏鄉所屬區域，最早出現在文獻上的記載是荷蘭時期的《熱蘭遮城日誌》之紀錄cannacannavo(即卡那卡那富族)。清代史料《臺海使槎錄》對此地區有二種譯法：『簡仔霧社』及『干仔霧社』。日治時期稱為『瑪雅竣社』或『蚊仔只社』。民國37
    年改為直隸高雄縣政府瑪雅鄉，民國47 年瑪雅鄉改名三民鄉，民國97 年改名那瑪夏鄉。」由文中可知，那瑪夏鄉名稱的演變主要受下列哪些因素影響？
