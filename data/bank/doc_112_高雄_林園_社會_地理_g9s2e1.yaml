- id: doc_112_高雄_林園_社會_地理_g9s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 某篇文章段落對於現今臺南市麻豆區名稱演變的敘述如下：「麻豆的由來與當地早期的西拉雅族有關，為眼睛的意思。數百年前，當地屬於西拉雅族『蔴荳社』的舊聚落。故日治初期，地圖上的地名原寫作蔴荳，大正九年(西元1921
    年)改成麻豆，使用至今。」請問：下列何者最適合做為該文章段落的標題？ (習作)
  options:
  - label: A
    content: 地名為昔日舊地名簡化或雅化而來
  - label: B
    content: 地名是多個聚落地名重組合併而成
  - label: C
    content: 地名因為和其他的聚落同名而改名
  - label: D
    content: 地名是利用吉言佳字創造的新地名。
  answer:
  - A
