  stem: '根據 2016 年「聯合國氣候變化綱要公約」的資料顯示，地球上水的分布比及占總水量的百分比如下：海水：$97.5\%$，冰川：$1.74\%$，地下水：$0.75\%$，河水、淡水湖：$0.009\%$，則下列敘述何者正確?

