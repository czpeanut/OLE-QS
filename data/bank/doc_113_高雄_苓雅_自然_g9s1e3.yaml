- id: doc_113_高雄_苓雅_自然_g9s1e3_s1_49
  section: 1
  number: 49
  type: single
  page: 6
  stem: '參觀完之後，小明和小花各提出了一個解釋:

    小明:火星逆行的成因是因為火星跟地球公轉的軌道不同，所以才會看到這樣的現象。

    小花:火星逆行是火星每隔一段時間，公轉方向會從逆時針變成順時針，才會造成逆行的現象。

    請問誰說的比較正確?'
  options:
  - label: A
    content: 小明
  - label: B
    content: 小花
  - label: C
    content: 兩人都是對的
  - label: D
    content: 兩人都是錯的
  group_stem: '【第 48~50 題】

    古代的中國人有個占星用語稱為「熒惑守心」，就是火星（熒惑）逆行停留在天蠍座主星心宿二附近，由於這兩顆星體都是紅色的，接近在一起常被古人視為極端不祥徵兆，會引起戰爭、皇帝死掉，是個奪朝竄位的良好時機。熒惑守心是個實在太好用的不祥之兆，因此中國史上有記載的往往都是假的。

    小明和小花在看到這篇文之後對於火星逆行非常感興趣，於是相約去天文科學教育館，並獲得以下資料。'
