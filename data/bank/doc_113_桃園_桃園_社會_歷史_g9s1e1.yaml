- id: doc_113_桃園_桃園_社會_歷史_g9s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 亞歷山大在其轄地之內以政治及軍事的力量推行希臘文化，使得此後帝國境內呈現了何種風格？
  options:
  - label: A
    content: 希臘城邦高高在上，地位凌駕其他各邦之上
  - label: B
    content: 種族制度趨於嚴密，加深民族之間的對立
  - label: C
    content: 各文明之間首次出現共同的文化基礎與文字
  - label: D
    content: 各地區競相學習希臘人的城邦政治型態，不再出現領土跨洲的帝國。
  tags:
    chapter:
      publisher: 南一
      book: 九上
      subject: 歷史
      code: 2-2
      title: 希臘化世界
      chapter: null
    textbook: 九上歷史 2-2 希臘化世界
    labeled_by: ai
- id: doc_113_桃園_桃園_社會_歷史_g9s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '苡薰聽歌的時候，聽到周杰倫的歌曲－愛在西元前，第一段歌詞如下：

    古巴比倫王頒布了漢摩拉比法典

    刻在黑色的玄武岩 距今已經三千七百多年

    妳在櫥窗前 凝視碑文的字眼

    我卻在旁靜靜欣賞妳那張我深愛的臉

    請問，裡面提到的漢摩拉比法典，其強調的原則是以下哪一項？'
  options:
  - label: A
    content: 眾生平等
  - label: B
    content: 民貴君輕
  - label: C
    content: 以牙還牙
  - label: D
    content: 以和為貴
  tags:
