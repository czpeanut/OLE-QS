  page: 1
  stem: 小蘑菇看到電視裡面的釋迦牟尼覺得他提倡的眾生平等觀念很是佩服，於是查了一下書籍，發現釋迦牟尼居然是印度某國的王子。請問：在當時社會的分級，是屬於哪一個階級？
