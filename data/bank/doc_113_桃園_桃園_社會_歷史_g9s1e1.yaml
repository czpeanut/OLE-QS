    labeled_by: ai
- id: doc_113_桃園_桃園_社會_歷史_g9s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 馨尹正在複習有關中國商朝、埃及與西亞這三個古文化在文字上的發展，請問下列筆記何者正確？
  options:
  - label: A
    content: 埃及使用楔形文字在商業與文書上
  - label: B
    content: 西亞以象形文字與字母文字作為書寫型式
  - label: C
    content: 埃及的象形文字後來成為西方文字的基礎
  - label: D
    content: 商朝的甲骨文依舊停留在圖案階段。
  tags:
    chapter:
      publisher: 南一
      book: 九上
      subject: 歷史
      code: 1-2
      title: 埃及古文明
      chapter: null
    textbook: 九上歷史 1-2 埃及古文明
    labeled_by: ai
- id: doc_113_桃園_桃園_社會_歷史_g9s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 古埃及的測量、醫藥、曆法、文字等文明成就都相當卓越，即使已過了數千年，仍為後世讚嘆不已。請問：有關古埃及文化的敘述，何者正確？
  options:
  - label: A
    content: 為了要建造金字塔，與丈量氾濫後的土地，故測量技術發達
  - label: B
    content: 埃及位處熱帶，常有傳染病肆虐，為了防治因而醫藥學很先進
  - label: C
    content: 長期觀察河水氾濫的時間，並根據月球運行的週期，發展出陰曆
  - label: D
    content: 用削尖的蘆葦桿在溼軟的泥版上書寫，發明了楔形文字。
  tags:
    chapter:
      publisher: 南一
      book: 九上
      subject: 歷史
      code: 1-2
      title: 埃及古文明
      chapter: null
    textbook: 九上歷史 1-2 埃及古文明
    labeled_by: ai
- id: doc_113_桃園_桃園_社會_歷史_g9s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 潮葦一直不懂為什麼希臘會發展為各自獨立的小城邦，而不是一個大帝國。請問：希臘地區多為獨立城邦的原因為何？
  options:
  - label: A
    content: 水源充足，習慣散居
  - label: B
    content: 宗教差異，相互敵視
  - label: C
    content: 希臘多山，地形崎嶇
  - label: D
    content: 人種複雜，互不妥協。
  tags:
    chapter:
      publisher: 南一
      book: 九上
      subject: 歷史
      code: 2-1
      title: 古希臘的政治與文化
