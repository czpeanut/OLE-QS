- id: doc_113_桃園_桃園_社會_歷史_g9s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 西方歷史上有亞歷山大東征的英勇壯闊，亞洲歷史上有蒙古西征的雄壯豪邁，兩者皆留下史詩般歷史征伐的篇章。請問：如果將兩者比較，下列敘述何者正確？
  options:
  - label: A
    content: 前者將《幾何原本》傳入中國，後者將火藥傳入歐洲
  - label: B
    content: 兩者疆域皆橫跨歐、亞、非三洲
  - label: C
    content: 兩者都促進了東西方的文化交流
  - label: D
    content: 主要在歷史上的成就都是戰爭，隨帝國消失就失去影響力。
