- id: doc_113_桃園_桃園_社會_歷史_g9s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 歆雅來到義大利的羅馬旅行時，看到地上的渠蓋、公共設施的雕塑，都刻著四個字母—「SPQR」，它是一組文字的縮寫—「SENATVS POPVLVS QVE
    ROMANVS」，中文直譯是「元老院與羅馬公民」。請問：此組文字應是使用的哪種文字書寫而成？
  options:
  - label: A
    content: 波斯文
  - label: B
    content: 希臘文
  - label: C
    content: 埃及文
  - label: D
    content: 拉丁文。
  tags:
