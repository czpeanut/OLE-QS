- id: doc_113_桃園_桃園_社會_歷史_g9s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 詩芸看金庸小說《倚天屠龍記》裡，多次提到明教，他們崇拜聖火，喜歡穿白衣，最後張無忌的婢女－小昭為了頂替母親的罪，選擇回到宗教發源地代替母親擔任該教的聖女。故事中崇拜聖火儀式最有可能與何處的宗教有關？
  options:
  - label: A
    content: 兩河流域
  - label: B
    content: 阿拉伯半島
  - label: C
    content: 伊朗高原
  - label: D
    content: 小亞細亞。
