- id: doc_113_新北_福和_自然_g8s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '阿舞、小鄭和祥仔一起作熱學實驗，他們以同一熱源分別加熱不同質量$m_{1}$的水與$m_{2}$的甘油，已知水的比熱大於甘油。加熱3 分鐘後，水溫上升$\Delta
    T_{1}$，甘油則上升$\Delta T_{2}$，且$\Delta T_{2} >\Delta T_{1}$，若過程中物質的蒸發及散失熱量皆不考慮，他們根據上述資訊做出以下推論，請問誰的敘述是合理的？

    阿舞：$m_{1}$的質量比$m_{2}$的質量要大，因為一樣的時間$m_{1}$升溫比較慢。

    小鄭：水比熱較甘油還要大，所以質量$m_{1}$一定小於質量$m_{2}$。

    祥仔：這實驗的液體種類和質量均為控制變因，所以無法判斷。'
  options:
  - label: A
    content: 只有阿舞說的對
  - label: B
    content: 只有小鄭說的對
  - label: C
    content: 只有祥仔說的對
  - label: D
    content: 三人敘述皆錯誤。
  tags:
