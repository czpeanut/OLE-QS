- id: doc_113_新北_福和_自然_g8s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 3
  stem: '阿福、小和在室溫下將一支金屬湯匙及一支塑膠湯匙同時插入剛買來的冰淇淋兩側，如右圖所示。經過幾分鐘後，發覺金屬湯匙附近熔化的冰淇淋量較塑膠湯匙附近的多，關於此現象的發生的主要原因何者解釋正確？

    阿福：金屬材質比塑膠材質容易傳導熱，故金屬湯匙附近熔化的冰淇淋會較多。

    小和：金屬材質的比熱比塑膠材質較小，故金屬湯匙附近升溫快熔化較多冰淇淋。'
  options:
  - label: A
    content: 阿福說對，小和說錯
