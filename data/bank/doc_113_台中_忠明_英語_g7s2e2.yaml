    2. Second, send your invitations. Then guests can RSVP.

    3. Third, prepare lots of yummy snacks and drinks.

    4. Then put up party decorations.

    5. Next, plan some fun games such as charades.

    6. Last, prepare to welcome everyone and introduce guests.

    Then, you will have a wonderful party, Enjoy!

    Do you enjoy the show today? I''m Winnie. See you next Friday!

     host 主持人'
