- id: doc_111_桃園_同德_自然_g7s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 蚯蚓的構造如右圖所示，身體具有一節一節相似的構造，每段構造內可獨立自成簡單的血液循環系統。若橫向切斷蚯蚓，如果每段構造中的血液尚可循環，則有機會形成新的個體；若縱向切斷蚯蚓，則蚯蚓會因血液無法完成循環而死去。根據上述資訊，判斷下列關於蚯蚓的敘述何者正確？
  options:
  - label: A
    content: 身體柔軟，屬於軟體動物門
  - label: B
    content: 不具有脊椎骨，屬於無脊椎動物
  - label: C
    content: 身體分節，屬於節肢動物門
  - label: D
    content: 和海星一樣可利用斷裂的片段形成新個體，故兩者為同門生物。
