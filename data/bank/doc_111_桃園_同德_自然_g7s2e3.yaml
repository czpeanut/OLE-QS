- id: doc_111_桃園_同德_自然_g7s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 臺灣有三種原生鹿科動物：水鹿、梅花鹿、山羌，梅花鹿過去曾有大量族群生活於中低海拔的平原及丘陵地，而水鹿原本分布在中、高海拔區域，屬於保育動物，水鹿適應能力強，若非獵捕壓力，是不需要往高海拔移動的。有研究員想調查棲息在自然保留區內的水鹿數量，則下列哪一種方法較合適？
  options:
  - label: A
    content: 先捕捉定量的水鹿標記後放回，一段時間後再隨機捕捉，計算做標記與未做標記倍數後推算出水鹿的總數
  - label: B
    content: 捕捉每一隻水鹿並做編號，直到這一帶的水鹿都編號完成為止
  - label: C
    content: 在此自然保留區內選定小區塊為單位，並計算其中水鹿的數量，再測量總面積的個體數目的比例，並推算出總數
  - label: D
    content: 統計同時期水鹿交配的數量，推算出水鹿的總數。
  tags:
    chapter:
      publisher: 翰林
      book: 七下
      subject: 生物
      code: 4-1
      title: 族群、群集與演替
      chapter: 第4章 生物與環境
    textbook: 七下生物 4-1 族群、群集與演替
    labeled_by: ai
  ai_answers:
    gemini: A
    qwen: B
    gemini_high: A
  answer:
