- id: doc_111_桃園_同德_自然_g7s2e3_s1_48
  section: 1
  number: 48
  type: single
  page: 6
  stem: 台江國家公園內有多處溼地，下列何者並未包含在其範圍內？
  options:
  - label: A
    content: 四草溼地
  - label: B
    content: 許厝港濕地
  - label: C
    content: 鹽水溪口溼地
  - label: D
    content: 曾文溪口溼地。
  group_stem: "※ 請在閱讀下列敘述後，回答下列問題：\n    民國 98 年 10 月 15 日，行政院正式公告，宣布「台江國家公園」為臺灣第 8\
    \ 座國家公園。台江國家公園位於臺灣本島西南部，涵蓋陸域面積 4905 公頃，海域面積 34405 公頃，總面積合計為 39310 公頃，分為生態保護區、特別景觀區、史蹟保存區、遊憩區、一般管制區與海域一般管制區。\n\
    \  西元 17 世紀時，臺南沿海一帶稱為台江內海，本區域海岸地理景觀與土地利用的最大特色為海埔地，範圍內的重要溼地共計有 4 處：曾文溪口溼地、四草溼地、七股鹽田溼地和鹽水溪口溼地，其中曾文溪口和四草為國際級溼地。根據統計，台江國家公園的鳥種有近\
    \ 200 種，在國家公園的溼地裡，常可看到候鳥聚集、飛翔，是臺灣重要的候鳥棲息地區。瀕臨絕種的黑面琵鷺每年 9 月會從南韓和中國大陸飛抵此處渡冬，直到隔年\
    \ 3～5 月才會北返，回到北方進行繁殖。在臺灣渡冬的黑面琵鷺約占全球黑面琵鷺總量的 50％ 以上，為全球數量最大的渡冬族群。\n    台江國家公園除了生物資源豐富之外，也擁有漢人渡海移民重要的歷史文化資源，臺灣的漢人先民從\
    \ 17 世紀開始，陸續來到這裡建立家園，發展出漁、鹽等傳統產業文化，成為臺灣重要的歷史文化遺產。"
