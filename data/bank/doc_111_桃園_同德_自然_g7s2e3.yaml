- id: doc_111_桃園_同德_自然_g7s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '在燒杯中裝了許多黃豆，利用捉放法估算燒杯中黃豆的總數，操作流程如下：

    步驟一：從燒杯中取出40 顆黃豆，並以油性簽字筆作記號；

    步驟二：將有記號的40 顆黃豆放回杯中並混合均勻；

    步驟三：隨手抓取一把黃豆，清點共有39 顆；

    步驟四：39 顆黃豆中，共7 顆有記號；

    步驟五：利用右方的算式估算燒杯中黃豆總數

    $$\frac{\text{【空格 1】}}{\text{【空格 2】}} = \frac{\text{【空格 3】}}{\text{燒杯內黃豆總數}}$$

    為估算燒杯內黃豆總數，請選出空格1~3 中應填入的數字。'
  options:
  - label: A
    content: 空格1 填入40;空格2 填入7;空格3 填入39
  - label: B
    content: 空格1 填入39;空格2 填入40;空格3 填入7
  - label: C
    content: 空格1 填入39;空格2 填入7;空格3 填入40
  - label: D
    content: 空格1 填入7;空格2 填入39;空格3 填入40。
