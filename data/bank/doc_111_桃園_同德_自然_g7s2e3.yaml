- id: doc_111_桃園_同德_自然_g7s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: '「大火摧毀了樹木和植被，導致生物棲息地嚴重破壞。然而，火災也為某些植物提供種子散播的機會。隨著時間的推移，一些忍耐力強的植物開始重新生長，吸引了昆蟲和小型哺乳動物等生物返回。這些生物為土壤提供養分，促進了更多植物的生長。隨著時間的過去，森林逐漸復原，大型動物也返回並恢復棲息地。然而，復原過程可能需要數十年或數百年，取決於火災的嚴重程度和當地氣候條件。」

    請問這段文章是在描述下列何種現象？'
  options:
  - label: A
    content: 族群的遷移
  - label: B
    content: 群集中生物間的關係
  - label: C
    content: 消長或演替
  - label: D
    content: 森林景象四季的變化。
