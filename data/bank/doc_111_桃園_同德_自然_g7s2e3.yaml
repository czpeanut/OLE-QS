  stem: 宗教團體的放生行為，會造成以下哪些生態上的問題？(甲)放生的過程造成生物的死亡；(乙)外來物種的入侵；(丙)放生的生物造成生態失衡；(丁)因為商人認為有商機而大肆捕抓野外生物。
  options:
  - label: A
    content: 甲乙丙丁
  - label: B
    content: 乙丙丁
  - label: C
    content: 甲丙丁
  - label: D
    content: 甲乙。
  group_stem: "※ 閱讀以下新聞後，回答下列問題：\n    高雄市有民眾日前在美濃湖畔目睹疑似宗教團體進行放生儀式，成群菜鴨幼雛被人趕入湖中，甚至已有民眾發現幼鴨橫死水面，民眾將畫面貼在網路社群中，痛批這樣的善意已嚴重影響生態，水利局表示，將請委管業者加強巡視規勸。民眾放生如棄養行為，恐已違反《動物保護法》。據悉，我國每年被放生動物超過2\
    \ 億隻，甚至有民眾大量購買遭商人捕捉的野生動物放生，野生動物也因此活在「被捕捉，再放生」的循環中，物種涵蓋魚類、鳥類等各種動物，不僅嚴重影響生態平衡，也可能造成疾病傳播、危害其他野生動物的棲息。市場龐大的商機，讓少數業者願意挺而走險，從東南亞或大陸等禽流感疫區輸入鳥類，對國內生態環境無異是一大威脅。（2023-04-03）"
