  type: single
  page: 4
  stem: 上文中的「肱股之臣」的意思是指？
  options:
  - label: A
    content: 才華過人之臣
  - label: B
    content: 左右輔助之臣
  - label: C
    content: 封疆晉爵之官
  - label: D
    content: 清廉正直之官。
  group_stem: "5～7 為題組，請閱讀下文後回答問題\n◎劉鶚的《老殘遊記》與李伯元的《官場現形記》、吳趼人的《二十年目睹之怪現狀》、 曾樸的《孽海花》並稱為晚清四大譴責小說。這部小說的深刻之處，是揭露了過去文學作品很少揭露的「清官」的暴政。作者說：「贓官可恨，人人知之；清官尤可恨，人多不知。蓋贓官自知有病，不敢公然為非；清官則自以為不要錢，何所不可？剛愎自用，小則殺人，大則誤國。吾人親目所見，不知凡幾矣。試觀徐桐、李秉衡，其顯然者也。二十四史中，指不勝屈。作者苦心願天下清官勿以不要錢便可任性妄為也。歷來小說皆揭贓官之惡，有揭清官之惡者，自《老殘遊記》始。」\
    \ 胡適認為這段話是《老殘遊記》的中心思想。劉鶚筆下的「清官」，其實是一些「急於要做大官」而不惜殺民以邀功，用百姓鮮血染紅烏紗帽的劊子手。《老殘遊記》二十回\
    \ 只寫了兩個酷吏——前半寫一個玉賢，後半寫一個剛弼。玉賢是以「才能功績卓著」而補曹州知府的。在他任曹州知府不到一年的時間內，衙門前十二個站籠便站死了二千多人，其中十個倒有九個半是良民。于朝棟一家，因和強盜結冤被栽贓，玉賢不加調查，一口咬定是強盜，父子三人就斷送在站籠裡。一個雜貨鋪掌櫃的年輕兒子，由於酒後隨口批評了玉賢幾句，也被抓進站籠站死。老殘一針見血地指出：「我說無才的要做官很不要緊，正壞在有才的要做官。你想，這個玉太尊不是個有才的嗎？只為過於要做官，且急於做大官，所以傷天害理的，做到這樣。」小說中的剛弼，被稱作是「清廉得格登登」的清官，他曾拒絕巨額賄賂，但卻倚仗不要錢、不受賄，一味憑自己臆測斷案，枉殺了很多好人。他在審訊賈家十三條人命的巨案時，主觀武斷，定魏氏父母是凶手，嚴刑逼供，鑄成駭人聽聞的冤獄。山東巡撫莊耀是一位愛才欲渴的封疆大吏，卻如此不辨愚賢，把玉賢、剛弼那樣的酷吏視為肱股之臣。由於這班迂腐的官吏自信不要錢便可對上帝、質鬼神了，卻完全不講求那些搜求證據，研究事實，判斷是非的法子與手段；完全信任他們自己的意見，武斷事情，固執成見，所以「小則殺人，大則誤國」。劉鶚先生眼見玉賢、徐桐、李秉衡一班人，由清廉得名，後來都用他們的陋見來殺人誤國，怪不得他要感慨發憤，著作這部書，來大聲指斥「清官」的可恨可怕了。\n\
    \        （劉德隆《劉鶚小傳》）"
