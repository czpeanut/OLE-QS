  stem: '對偶有「正對」、「反對」之別。「正對」的特徵是事異義同，上下句意思雷同，例如「木受繩則直，金就礪則利」；「反對」的特徵是藉由異質或相反事物的並列對照，凸顯意旨，例如「棄燕雀之小志，慕鴻鵠以高翔」。下列對偶的歸類，完全符合上述定義的是：

    |  | 正 對 | 反 對 |

    | --- | --- | --- |

    | （Ａ） | 日星隱耀，山岳潛形 | 竭誠則胡越為一體，傲物則骨肉為行路 |

    | （Ｂ） | 物窮必變，慘極知悔 | 受任於敗軍之際，奉命於危難之間 |

    | （Ｃ） | 使天上銀河失色，叫滿湖碧水生輝 | 桃李春風一杯酒，江湖夜雨十年燈 |

    | （Ｄ） | 位卑則足羞，官盛則近諛 | 麝蘭芳靄斜陽院，杜若香飄明月洲 |'
  options:
  - label: A
    content: 正對：日星隱耀，山岳潛形／反對：竭誠則胡越為一體，傲物則骨肉為行路
  - label: B
    content: 正對：物窮必變，慘極知悔／反對：受任於敗軍之際，奉命於危難之間
  - label: C
    content: 正對：使天上銀河失色，叫滿湖碧水生輝／反對：桃李春風一杯酒，江湖夜雨十年燈
  - label: D
    content: 正對：位卑則足羞，官盛則近諛／反對：麝蘭芳靄斜陽院，杜若香飄明月洲
