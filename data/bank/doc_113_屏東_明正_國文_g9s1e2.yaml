- id: doc_113_屏東_明正_國文_g9s1e2_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: 「人生一場，學會和苦味同在，人生也就不那麼苦了。這些事一想明白，果然心靈就清澄了，說苦味可清心，竟然是生命頓悟的味道。」〈清心苦味〉中這段話所隱含的人生態度與下列何者最相近？
  options:
  - label: A
    content: 人總會去尋求自己喜歡的事物，每個人的看法或觀點不同，並沒有什麼關係，如果他能從這扇門望見日出的美景，你又何必要他走向那扇窗去聆聽鳥鳴呢？人與人之間，應該有彼此容忍和尊重對方的看法與觀點的雅量
  - label: B
    content: 人的一生，無論成敗都得自很多人的奉獻，成長的每一步，都有人指點；生活的每一天，都有人幫助。因為這樣，我們得以度過一個個難關，一步步走向成功，創造並享受著美好生活
  - label: C
    content: 幾年來自己的奔波，作了一些研究，寫了幾篇學術文章，真正做了一些小貢獻以後，才有了一種新的覺悟：即是無論什麼事，得之於人者太多，出之於己者太少
  - label: D
    content: 人生之路有平坦有崎嶇，平坦處微笑，崎嶇處更需要微笑，因為此時的微笑才真正有力量，也唯有帶著一份微笑的好心情去走，才能把這段崎嶇走出一番別有的風味。
  lesson_raw:
    title: 清心苦味
    basis: 題目寫了課名〈清心苦味〉
