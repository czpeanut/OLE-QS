- id: doc_113_屏東_明正_國文_g9s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '東東整理了有關《論語》與《孟子》的筆記，下列何者寫對了？

    | 選項 | 項目 | 《論語》 | 《孟子》 |

    | --- | --- | --- | --- |

    | （Ａ） | 時代 | 戰國 | 春秋 |

    | （Ｂ） | 篇章命名 | 每篇用篇首的幾個字當篇名，表達旨意 | 每篇用篇首的幾個字當篇名，表達旨意 |

    | （Ｃ） | 思想 | 性善，以仁為本 | 性惡，重利輕義 |

    | （Ｄ） | 特色 | 語錄體，篇幅短小，文字簡約 | 語錄體，篇幅較長，論辯詞鋒犀利 |'
  options:
  - label: A
    content: 時代：戰國（論語）／春秋（孟子）
  - label: B
    content: 篇章命名：每篇用篇首的幾個字當篇名，表達旨意（論語）／每篇用篇首的幾個字當篇名，表達旨意（孟子）
  - label: C
