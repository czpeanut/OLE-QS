    ⑤抃舞：鼓掌歡悅，表示非常快樂。抃，音ㄅㄧㄢˋ。\n【乙】\n    日本知名當代藝術家奈良美智的作品多給人一種顏色粉嫩、圓圓的、很可愛的印象，但他所描繪的人物，卻有種失落感、幻滅感，有時斜眼甚至帶著冷淡目光。不過在可愛的外表下，看似孤獨的感覺，卻讓許多人著迷，也得到世界的矚目。\n\
    \    近年來，奈良美智的創作聚焦在作品角色寧靜的精神意象，甜美而憂鬱的月光小姐便是這樣的作品。月光小姐是奈良美智在2020 年早春完成的作品，他曾說，這是「在沒有任何期待下，從沒有冀望中誕生的，最期待誕生的作品」。\n\
    \    事實上，自從2011 年311 大地震後，奈良美智有很長一段間無法作畫，甚至把2017 年的作品 Midnight Truth 看作是震災後「自我繪畫的高峰」。在大地震之後，他一邊苦惱著各種事情，最後以淡然的心情畫下月光小姐。月亮是奈良美智作品中重要的主題之一，幾乎總是在夜裡獨自在工作室創作的他，在這幅作品中畫了一位穿著鮮黃色衣服的少女，閉著眼沉思，暗夜中微微發光的小小身驅，帶來一種溫暖的感受，令人覺得很安心。他還透露，完成時，月光小姐彷彿對他說「已經可以休息了沒關係喔」，有種被幸福包圍的感覺，他甚至一度認為這是自己「繪畫的終點」。\n\
    \    過去總是面對自己而創作的奈良美智，受到節奏強勁的龐克音樂影響，讓他的畫作裡蘊涵叛逆與反抗的精神。311大地震之後，他曾一度傷痛到無法工作，但在這些年的尋根之旅，以及與許多人的相遇之後，他在創作月光小姐時，第一次想像人們看月亮的時候在想些什麼？然後畫下想像中的觀賞者畫像。從「畫自己」到「畫別人」，這也是奈良美智的一個重大轉換點。"
