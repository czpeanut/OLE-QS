- id: doc_113_屏東_明正_國文_g9s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 下列關於〈獵人〉一文中的各項敘述，下列哪一選項是正確的說明？
  options:
  - label: A
    content: 我迷迷糊糊地入睡，根本就忘了篝火熄滅的預言，只覺得徹夜出奇地溫暖—寫老獵人對作者的陪伴與守護
  - label: B
    content: 我揉亮眼睛，不錯，果真是牠，隨後還有三隻淘氣的小山豬……—刪節號的使用是寫出作者因為勢單力薄而放棄捕獵
  - label: C
    content: 疲憊地穿行山林間，可以感覺到似乎有一對眼睛審視著我—暗示山中的鬼魅正虎視眈眈，隨時準備取人性命
  - label: D
    content: 雅隆·諾基斯把命令像流星抛進我的耳朵裡，身影已像是蝙蝠飄然消逝在林子裡—寫老獵人動作速度快的像流星。
