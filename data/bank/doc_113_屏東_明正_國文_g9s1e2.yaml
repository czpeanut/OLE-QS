- id: doc_113_屏東_明正_國文_g9s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 以下關於〈清心苦味〉的文意解析，下列何者錯誤？
  options:
  - label: A
    content: 「真正過過苦日子的人，回頭一看，卻發現苦頭吃多了後就沒什麼怕苦之事，反而更懂得日子不苦就是甜的道理。」是因為人生苦過之後，更懂得享受珍惜不苦的日子
  - label: B
    content: 「甜過了頭的味道會變成苦的，但苦過了之後反而轉甜。」說明了「物極必反」與「苦盡甘來」的道理
  - label: C
    content: 「事後我十分不明白地問阿媽幹嘛要自找苦吃，阿媽說我小孩子不明白苦味對身體最好。」句中的「自找苦吃」有婉轉諷刺之意
  - label: D
    content: 「少年人要花時間才會習慣苦味，進而珍惜、喜歡苦味」和「有老靈魂的民族通常也懂得品嘗苦味。」兩者皆隱含著對苦味的接受需要經過歲月的歷練。
  lesson_raw:
    title: 清心苦味
    basis: 題目寫了課名〈清心苦味〉
