- id: doc_113_屏東_明正_國文_g9s1e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 〈大明湖〉一文中，「蒼松翠柏」即在描寫松柏的翠綠。但有些字詞若仔細研究，會發現並非真指顏色。請判斷下列各選項，何者全部實指顏色字，而且顏色相同？
  options:
