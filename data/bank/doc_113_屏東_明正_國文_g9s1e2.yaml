- id: doc_113_屏東_明正_國文_g9s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: '「事實上，我已年近三十，利用學校暑假的空檔，央求雅爸無論如何一定要替我完成泰雅成年禮的見證。國中畢業後，一直就在外地求學、服務，泰雅的子民卻無法親自領受傳統禮儀，一直是我心中的遺憾。雅爸邀請雅隆•諾基斯到家中述明我渴求的願望，年近八十的老獵人離去的時候，要我一早準備番刀和鹽巴就好。」

    文中可以得知，作者打算完成泰雅成年禮見證的年齡以及老獵人的年齡大約是？'
  options:
  - label: A
    content: 不惑之年／從心之年
  - label: B
    content: 而立之年／杖朝之年
  - label: C
    content: 知命之年／花甲之年
  - label: D
    content: 弱冠之年／古稀之年。
