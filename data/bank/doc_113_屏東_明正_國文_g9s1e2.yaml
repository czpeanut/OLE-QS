- id: doc_113_屏東_明正_國文_g9s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 「中國人的憂患意識特別強烈，由此種憂患意識可以產生道德意識。君子所憂的不是財貨權勢的未足,而是德性未修與學之未講。他的憂患，終生無已，而永在坦蕩蕩的胸懷中。」下列何者與上文沒有直接關聯?
  options:
  - label: A
    content: 君子有終身之憂
  - label: B
    content: 君子任重而道遠，死而後已
  - label: C
    content: 君子謀道不謀食
  - label: D
    content: 君子愛財，取之有道。
