- id: doc_113_屏東_明正_國文_g9s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 「開發了車價酒錢」的「酒錢」指的就是現今所稱的「小費」。林老師以此為例，要班上同學搜尋更多古今用詞語意有別的例子，請問下列何者提報的資料正確？
  options:
  - label: A
    content: 今日紅牌「演員」，就是昔日的「伶人」
  - label: B
    content: 古代所稱「仵作」，就是現代的「殺手」
  - label: C
    content: 所謂「捕快」，其實就是現在的「法官」
  - label: D
    content: 去名曰「宦官」，今日喚作「閣揆」。
  lesson_raw:
