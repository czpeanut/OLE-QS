- id: doc_113_屏東_明正_國文_g9s1e2_s2_4
  section: 2
  number: 4
  type: single
  page: 3
  stem: 以上這段文字的意旨，與下列說法何者最為接近：
  options:
  - label: A
    content: 濫用青春勝於虛度光陰
  - label: B
    content: 從別人的災難中學到睿智，這種人真是有福了
  - label: C
    content: 年輕人往往自作聰明，一如喝醉的人自以為清醒
  - label: D
    content: 讓年輕人在荊棘中留下一點羽毛，是有益健康的。
  group_stem: "◎在青春的路口，曾經有那麼一條小路若隱若現，召喚著我。母親攔住我「那條路走不得。」我不信。「我就是從那條路走過來的，你還有什麼不信？」「既然你能從那條路\
    \ 上走過來，我為什麼不能？」「我不想讓你走彎路。」「但是我喜歡，而且我不怕。」母親心疼地看我好久，然後嘆口氣：「好吧，你這個倔強的孩子，那條路很難走，一路\
    \ 小心。」上路後，我發現母親沒有騙我，那的確是條彎路，我碰壁，摔跟頭，有時碰得頭破血流，但我不停地走，終於走過來了。坐下來喘息的時候，我看見一個朋友，自然很年輕，正站在我當年的路口，我忍不住喊：「那路走不得。」她不信。「我母親就是從那條路上走過來的，我也是。」「既然你們都從那條路上走過來了，我為什麼不能？」「我不想讓你走同樣的彎路。」「但是我喜歡。」我看了看她，看了看自己，然後笑了：「一路小心。」我很感激她，她讓我發現自己不再年輕，已經開始扮演「過來人」的角色，同時患有「過來人」常患的「攔路癖」。在人生的路上，有一條路每一個人非走不可，那就是年輕時候的彎路。不摔跟頭，不碰壁，不碰個頭破血流，怎能煉出鋼筋鐵骨，怎能長大呢？\n\
    \                                                                          （張愛玲〈非走不可的彎路〉）"
