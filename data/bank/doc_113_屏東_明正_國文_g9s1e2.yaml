  - label: D
    content: 用大金，省大金—大金空調。
  group_stem: ◎相傳唐朝詩人王維隱居讀書時，偶染小病，至藥店買藥。見櫃檯內是一位衣著素雅的少女，便想一試其才氣。王維開口便說：「我要買『宴罷客何為？』。」少女微微一笑說：「宴罷酒酣客『當歸』，請問要抓幾錢？」王維說：「且慢，我二買『黑夜不迷途』。」少女說：「『熟地』不怕天黑夜，本店有的是。」話音剛落，王維說：「三買『豔陽牡丹妹』。」少女笑著說：「牡丹花妹『芍藥』紅，今天方到。」王維暗暗佩服這少女才思敏捷，對答如流，便繼續說：「四買『出征在萬里』。」少女說：「萬里戍疆有『遠志』。」「五買『百年美貂裘』。」少女說:「百年貂裘是『陳皮』。」「六買『八月花吐蕊』。」少女說：「秋花朵朵點『桂枝』。」面對少女一連串的妙答，王維只得連聲讚嘆。
