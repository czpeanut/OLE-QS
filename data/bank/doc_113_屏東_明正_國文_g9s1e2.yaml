- id: doc_113_屏東_明正_國文_g9s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 有關於〈大明湖〉一文的內容，下列何者說明正確？
  options:
  - label: A
    content: 歷下亭上的對聯：「歷下此亭古，濟南名士多」此對聯主要是寫歷下亭歷史悠久，濟南人才輩出。
  - label: B
    content: 「彷彿宋人趙千里的一幅大畫，做了一架數十里長的屏風」是作者藉千佛山讚嘆趙千里的畫風磅礴。
  - label: C
    content: 「紅的火紅，白的雪白，青的靛青，綠的碧綠。」是作者登上千佛山所感受到色彩鮮豔的美景。
  - label: D
    content: 「一盞寒泉薦秋菊，三更畫舫穿藕花」此對聯主要是描寫水仙祠祭祀情況與周遭清幽的環境。
  lesson_raw:
    title: 大明湖
    basis: 題目寫了課名〈大明湖〉
