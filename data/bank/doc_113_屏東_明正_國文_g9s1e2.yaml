  section: 1
  number: 10
  type: single
  page: 1
  stem: 下列文句「 」中的字，何者意義前後相同？
  options:
  - label: A
    content: 鐵公就是明初與燕王「為難」的那位鐵鉉／有一件「為難」事，老爺託我，我不得主意
  - label: B
    content: 老殘將行李卸下，「開發」了車價酒錢／今歲春雪甚盛，梅花為寒所勒，與杏、桃相次「開發」
  - label: C
    content: 阡陌「交通」，雞犬相聞／樊稠何故「交通」韓遂，欲謀造反？
  - label: D
    content: 這「早晚」，他爺兒三個恐怕要到了。／今兒老太太高興，這「早晚」就來了。
