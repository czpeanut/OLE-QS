- id: doc_113_屏東_明正_國文_g9s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 關於〈生於憂患死於安樂〉的文意理解，下列敘述何者正確？
  options:
  - label: A
    content: 「人恆過，然後能改」意近於「事非經過不知難」
  - label: B
    content: 「徵於色，發於聲，而後喻」說明常人好逸惡勞的習性
  - label: C
    content: 「入則無法家拂士，出則無敵國外患者，國恆亡」呼應「死於安樂」
  - label: D
    content: 「行拂亂其所為」的正確語序應該是「所為拂亂其行」。
