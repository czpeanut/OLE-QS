  stem: 「大明湖的西岸、北岸有明、清兩代的城牆遺址，至今尚保存雄偉的城門。湖的南岸有紀念南宋愛國詩人辛棄疾而建立的稼軒紀念祠，在古水仙祠裡也供奉著南宋女詞人李清照。」這段文字最適合用下列何者來形容？
  options:
