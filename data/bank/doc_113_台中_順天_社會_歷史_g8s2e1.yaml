- id: doc_113_台中_順天_社會_歷史_g8s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 儒家提到的「三綱」指的是「君為臣綱、夫為妻綱、父為子綱」，其意思是君為臣的表率，而人民為君主的附屬品，故無獨立自主的人格；父親為兒子的表率，則兒子是父親的附屬品，故無獨立自主的人格；丈夫為妻子的表率，則妻子為丈夫的附屬品，故無獨立自主的人格。中國人之所以缺乏獨立的人格，都是導因於「三綱」的說法。傳統上提到的盡忠、盡孝、守節，皆非讓人擁有獨立人格的道德規範。(資料來源：1916年。青年雜誌第1卷第5號。)請問：文章中論述的觀點來加以判斷，下列何人可能是此篇文章的作者？
