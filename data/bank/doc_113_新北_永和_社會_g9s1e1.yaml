  stem: 《漢摩拉比法典》是古巴比倫國王漢摩拉比約在西元前1750 年頒布的一部法律,是世界上最早的成文法典之一。法典基本原則是「以眼還眼、以牙還牙」,全文共收錄282
    條條文，範疇包括訴訟手續、損害賠償、租佃關係、債權債務、財產繼承、處罰奴隸等。這些條文被刻在一根高約2.25 公尺的黑色玄武岩圓柱上，現存於法國巴黎的羅浮宮博物館。請問對《漢摩拉比法典》的解說何者錯誤
