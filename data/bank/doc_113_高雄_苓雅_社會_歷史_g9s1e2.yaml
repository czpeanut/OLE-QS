  stem: 羅耀拉年幼時就立志當軍人。在 1521 年的一次戰役中,他腿部負了重傷,他無法再從事軍旅戎馬。在養病期間心中煩悶,開始研讀基督的一生及諸聖人列傳,立志作一個基督的精兵。以下何者是他對宗教的付出與貢獻?
