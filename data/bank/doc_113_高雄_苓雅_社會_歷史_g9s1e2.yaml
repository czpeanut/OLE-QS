  section: 1
  number: 32
  type: single
  page: 2
  stem: '文藝復興之所以興起是集結了眾多的因素,請問它的興起的背景有哪些?

    甲.義北地區貴族與富商支持文藝創作 乙.阿拉伯人翻譯許多古希臘羅馬典籍回傳歐洲

    丙.中世紀後期拜占庭學者為躲避塞爾柱土耳其人的騷擾,帶了許多珍貴的古代典籍避難西遷

    丁.巴爾幹半島留存許多珍貴遺跡引發研究古文化熱潮,成為文藝復興的起源地

    戊.造紙印刷術的普及,有助歐洲知識文化發展。'
