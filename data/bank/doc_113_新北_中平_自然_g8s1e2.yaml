  stem: 由文章的介紹得知當海嘯波由深水區傳遞到淺水區時，波速跟波長會發生什麼變化？
  options:
  - label: A
    content: 波速不變，波長變長
  - label: B
    content: 波速變慢，波長變短
  - label: C
    content: 波速變快，波長不變
  - label: D
    content: 波速不變，波長變長。
  group_stem: "大雄接著閱讀第2 篇，這是一篇介紹海嘯的文章。\n    引發海嘯的原因很多，海底火山爆發、海底山崩或隕石撞擊都可能引發，但較大的海嘯最主要還是海底地震所引起。我們假設一個強烈地震發生在某處深達3000\
    \ 公尺的海床上，並形成斷層，這個錯動就可能造成海嘯波向外傳送。海嘯波屬於淺水波的一種，淺水波不是水很淺的意思，意思是波長比水深大很多，所以水深相對於波長就顯得很淺。海嘯波的波長可達百公里，一般海面的波浪波長大概是數公尺到數十公尺，而颱風來時造成的湧浪可能達一、二百公尺，這二者都屬於深水波。\n\
    \    淺水波的波速和水深有關，水深越深波速愈快，我們以水深3000 公尺來看，海嘯波的波速約為每小時617 公里。國中時大家都學過波速為v=λf，其中λ\
    \ 為波長，f 為頻率，也就是周期(T)的倒數，海嘯波的周期約為20 分鐘～1 小時左右，我們以20 分鐘(1/3 小時)計算，則該海嘯波的波長為206 公里，而波高大多小於1\
    \ 公尺。海嘯波波長很長，所以向外傳遞時能量的衰減很慢，假設傳遞到水深200 公尺的海域，這時波速就降到約每小時159 公里，你也可以自己算一下這時波長的長度了！波長會由206\
    \ 公里縮減到53 公里，這時你可以想像一下，波長這樣縮短，但是能量不太減少，於是淺水區的波高就會迅速堆高（你可以想像一下把一個波形擠壓一下，長度縮短高度就變高了），如果水深到20\
    \ 公尺呢？這時水位就會疊得更高，可能高達10 到數十公尺，所以當這個淺水海域的海嘯波來的時候，由於水位迅速拉高遠超過海水的量體，這時更淺水區域的海水會迅速往後退以補充被拉高的波峰下方的海水，這時在海岸邊就會有大退潮現象發生，接下來海嘯就會排山倒海而來衝擊海岸，所以遇到海水大退潮無論如何要往陸地方向逃命要緊，千萬不要再逗留在海岸邊。\
    \      ※文章節錄自泛科學科普網"
