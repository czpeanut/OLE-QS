  group_stem: "大雄回想夢境中的種種，有感而發覺得：「原來眾人的知識與合作才是真正的寶藏。如果不是夢中的大家團結動腦解決一關關的考驗，單憑一個人根本不可能得到寶藏！」因此決心要奮發圖強，努力向上！於是走到書櫃前拿起一本中平科普百科全書翻閱。首先第一篇文章是關於彩虹的介紹。\n\
    \    下雨過後，雲層遠去、陽光重現，此時大氣中充滿無數球狀的小水滴，當陽光以不同角度照射這些小水滴時，會在水滴內產生折射與反射等光學作用。由於水的物理性質，陽光在水滴內經過折射與反射後，出射光線與入射陽光夾角在40°～42°的反射強度最大，因此在觀察者視線與地平面呈42°左右的仰角時，可以觀察到虹的形成，這是陽光在水滴內經過一次反射及兩次折射的結果。由於不同波長的光線對水滴的折射率不同，使得紫色光偏折的角度最大，紅色光偏折的角度最小，所以虹的色彩排列是內紫外紅。\n\
    \    虹是觀察者看見的一種光學現象，因此會隨著觀察者的位置而改變。太陽必須由觀察者的後方以低角度照射，才有機會觀察到虹，如果太陽的角度太大（如正午直射），則大部分的虹將落於地平面以下而無法被我們觀察到。完整的虹為正圓形，觀察者必須在高空才有機會看到，在地面上由於受到地形與角度的關係，所以我們見到的虹是弧形的。此外，小水滴的大小決定了虹的色彩強度與寬度：水滴越大，則色帶寬度越窄，但色彩越鮮明；反之，則色帶寬度越寬而色彩黯淡。\n\
    \                                                                          ※文章節錄自中央氣象署數位科普網"
