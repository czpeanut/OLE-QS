  stem: 大雄從野外帶回的螢光植物，資料說明需要照射波長為$10^{-8}$m 的電磁波才能發出美麗的螢光。參考下圖大雄應該使用什麼照射植物才能讓植物順利發光？【素養導向】
  options:
  - label: A
    content: 無線電
  - label: B
    content: 紅外線
  - label: C
    content: 紫外線
  - label: D
    content: 伽馬射線。
  group_stem: "繼續翻閱第3 篇文章，這是一篇介紹發光生物的發光原理。\n    生物螢光與生物發光儘管都為發出螢光，但機制卻有所不同，又以生物發光較為常見，如螢火蟲、藍眼淚（夜光藻）等。生物螢光是生物透過體內的螢光蛋白來吸收特定波長的光，然後發出另一波長的光。螢光蛋白吸收外來的能量，如紫外線，並發出螢光。\n\
    \    早期對於生物螢光的研究多半是在刺絲胞動物中發現，現今則觀察到越來越多不同物種也有此機制，從無脊椎動物到鳥類再到哺乳動物，遠比原先想像得還要更加普遍。研究團隊在森林觀察螢光的生物時，發現北美飛鼠在紫外線照射下肚子會發出粉紅色的光，於是便前往芝加哥菲爾德自然史博物館進一步確認，他們將存放在館內的飛鼠標本進行照射，證實牠們腹部的毛會散發粉紅螢光，並將研究成果發表於《哺乳類》期刊。\n\
    \    而發光蕈，發光的真菌，跟螢火蟲同樣是會發出冷光的生物。雖然有時候被稱為螢光蕈，但其實它的發光原理和螢光大不相同。有別於螢光需要用外來的光源激發，冷光則是由生物體內的化學反應來產生光。簡單來說，發光的過程是由一個被稱為螢光素酶的蛋白氧化一個稱為螢光素的化學分子，在這裡過程中產生了光子而發光。能夠產生冷光的生物，從陸地上的螢火蟲，叩頭蟲以及蕈類，到海洋中的弧菌屬以及雙鞭毛蟲門，甚至磷蝦都演化出冷光系統。以螢光素酶和螢光素產生冷光看起來似乎是個簡單的化學反應，但其實它沒那麼簡單。\
    \                                ※文章節錄自泛科學科普網"
