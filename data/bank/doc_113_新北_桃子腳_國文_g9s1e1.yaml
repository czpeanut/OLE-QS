- id: doc_113_新北_桃子腳_國文_g9s1e1_s3_34
  section: 3
  number: 34
  type: single
  page: 4
  stem: 根據上文內容，下列敘述何者正確？
  options:
  - label: A
    content: 人之所以渴望擁抱，是因我們都有「肌膚飢渴」
  - label: B
    content: 觸摸會使迷走神經活動活躍，讓人的精神亢奮
  - label: C
    content: 不當接觸會使自然殺傷細胞增多並攻擊免疫系統
  - label: D
    content: 感到壓力上升是心理因素，與肌膚接觸變少無關聯。
  group_stem: "皮膚飢渴（skin hunger），是神經系統學領域的現象，新冠疫情則加劇了肌渴的程度。它反映了人類渴望被觸摸的生理需求，所以新生兒重症監護室裡的嬰兒才要躺在父母赤裸的胸膛上。邁阿密大學觸摸研究所教授蒂芙尼．菲爾德（Tiffany\
    \ Field）說：「當你觸摸皮膚時，會刺激皮下壓力傳感器，進而向迷走神經發送訊息，當迷走神經活動越來越活躍時，神經系統會逐漸遲緩，心率和血壓會隨之下降，腦電波則顯示個體處於放鬆狀態，皮質醇等壓力荷爾蒙水平也會下降。沒有觸摸，人類的身體和精神狀況都會惡化。」\n\
    人類天生就是社會性動物，人類的大腦和神經系統，將被觸摸設定成為愉快的體驗。是大自然造就了這種感覺模式，以提升人類在社會環境中的幸福感。只有群居動物才如此，因為牠們需要聚在一起來提高族群的生存機率。\n\
    觸摸還會讓人體釋放催產素，將我們聯繫在一起。從生物學角度上說，人與人的接觸大有好處。被觸摸會讓人覺得更平靜、更快樂、更理智。菲爾德擔心新冠疫情時所提出的社交距離，因為觸摸有利於增強免疫功能，降低皮質醇水平。當皮質醇水平過高時，免疫系統就會衰竭：皮質醇會殺死自然殺傷細胞（幫助人類消滅病毒的白細胞）。已有證據顯示觸摸會令愛滋病及癌症患者的自然殺傷細胞增多。\n\
    觸摸會給人帶來安慰。當我們處於危險或焦慮狀態時，被觸摸有利於緩解不良情緒。缺乏接觸會增加壓力。研究表明，如果人們能先被拍拍後背的話，就能更好地完成任務。拍後背是一種安慰人的方式，可以追溯到孩提時代看護者的觸摸。養寵物也是很棒的事，因為通過撫摸動物及按摩（按摩師和顧客都能從按摩中獲益），你的皮膚得到了觸碰，也受到了刺激。而獨居的人則要盡可能地多動，在房間裡隨便走走就能刺激腳上的壓力感受器，或給自己做個頭皮按摩、或者在臉上塗抹潤膚霜，這些都是運動皮膚的不同方式。為了身心健康，從某種程度上說，你必須接受皮膚會飢渴的事實，從而適度地與他人身體接觸。\n\
    \         ──改寫自網路文章"
