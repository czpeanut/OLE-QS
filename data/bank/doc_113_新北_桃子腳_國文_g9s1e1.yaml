  type: single
  page: 2
  stem: 關於與921 說再見一文中受訪者敘述內容所反映的心境，以下何者不正確？
  options:
  - label: A
    content: 「我原本很排斥講出自己的事，怕會讓人覺得我很可憐，會不會讓別人用異樣眼光看我？」：封閉壓抑
  - label: B
    content: 「為什麼是我？為什麼你們都離開了，就丟下、剩下我一個人？就覺得很不公平。」：孤寂沉痛
  - label: C
    content: 「當然還是會感到難過，但我現在很努力地在生活，我沒有讓這場震災把我打倒。」：振奮欣喜
  - label: D
    content: 「與其說是和逝去的家人說再見，其實比較像是和過去的自己說再見，迎接新的自己」：坦然接受
  lesson_raw:
    number: 第三課
    title: 與921說再見
    basis: 題幹指明與921說再見一文
