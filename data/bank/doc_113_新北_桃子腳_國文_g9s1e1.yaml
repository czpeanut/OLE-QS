  stem: 請列舉文章中所提出的蛋黃酥爆紅三大原因。6%
  group_stem: "需用演場會售票系統訂購的陳耀訓蛋黃酥，開賣30 秒就被秒殺；十顆的黃牛價，也被炒作到新台幣2500 元。2023 年竟然還有另類操作。有人把蛋黃酥當作貨幣使用，例如，拿陳耀訓換陳奕迅演唱會，或者拿陳奕迅換陳耀訓！\n\
    蛋黃酥有多熱賣，從鴨蛋的銷售數字就可看出端倪。農委會統計，2022 年中秋節，全台灣的蛋黃酥用掉了大約1 億顆鴨蛋！我認為這波蛋黃酥熱，其實是台灣糕餅的復興，更是台灣味的發揚光大！蛋黃酥是真真正正在台灣被發明的糕餅，融合了漢餅的脈絡、日式菓子的思維和台灣的在地食材，就和我們台灣的身世一樣，是唯有在台灣才會誕生的糕餅。那麼，蛋黃酥是誰發明的呢？\n\
    有人說蛋黃酥在50、60 年代就出現，但沒有明確的資料佐證，目前，我認為比較完整的說法，是來自台中的百年餅舖陳允寶泉。陳允寶泉第五代接班人陳溢輝說，小時候與阿公陳增雄聊天時，阿公提到蛋黃酥是他研發的，還拿出1986\
    \ 年8 月烘焙食品資訊雜誌證明，阿公年輕時因為發現狀元餅包了鹹蛋黃很受歡迎，但消費者很難一個人一次吃完，所以引用過去開發小月餅的構想，縮小尺寸，順應蛋黃的半圓弧度，做成立體半圓型的蛋黃酥，不同於當時的扁型傳統月餅。\n\
    由此可以看出蛋黃酥是漢餅與日本菓子混血的產物。狀元餅，是台式漢餅裡的大餅，結婚、喜慶都常吃，內餡是綠豆餡或烏豆沙，以及鹹蛋黃、魯肉，變成縮小版的烏豆沙包鹹蛋黃，順理成章；再來，寶泉的第三代有開發小月餅的經驗在先，根據寶泉的官網，1976\
    \ 年陳增雄先生有感於當時的傳統月餅太大，遂以日式烘焙技術，研發大小適中，以白鳳豆及日本原料為餡的「宝泉小月餅」，而日本的技術由來是因為第2 代曾赴日本學習製菓並在東京開店，在這邊又可以看到日本的影響。\n\
    寶泉從哪一年開始賣蛋黃酥，我無法確認，只能推測是在1976 年小月餅誕生之後、1986 年雜誌報導之前，就算差不多有40 年的歷史好了。台灣人吃蛋黃酥也吃了40\
    \ 年，蛋黃酥是在爆紅什麼？\n首先是政府的因素。新北市曾經舉辦一系列蛋黃酥的推廣活動，2011 年是首屆新北市蛋黃酥嘉年華，隔年改名為新北市蛋黃酥節，持續舉辦到2018\
    \ 年為止。雖然沒有像台北市的台北國際牛肉麵節在2006 年前後造成的旋風，但也提升了一些老店的知名度，例如蘆洲的龍鳳堂餅舖、永和的王師父餅舖。\n蛋黃酥的爆紅，有美食界專家指向是因疫情，認為國境封閉造成伴手禮需求的轉變。美食作家陳靜宜曾受訪表示，以前烘焙業者都在賣鳳梨酥，遊客停訪後，國人買鳳梨酥的量也不足，市場空掉，就要找其他的商品填補缺額。鳳梨酥為台灣的糕餅打開了伴手禮與精品禮盒的市場，從台北開到日本與新加坡的微熱山丘就是好例子。但，為什麼從鳳梨酥手中接棒的是蛋黃酥呢？\n\
    這就要說到台灣烘焙職人的努力了。西點師傅在這幾年不約而同將目光投向蛋黃酥，幾位比較知名的人物，包括台北法朋的李依錫、台中堂本麵包店的陳撫洸、高雄莎士比亞的王鵬傑、以及高雄的吳寶春，當然還有賣蛋黃酥賣到要動用演唱會售票系統的陳耀訓。而前面四位更有「蛋黃酥四大天王」之稱。\n\
    他們從疫情前就開始研發販售蛋黃酥了，而這些職人有一個有趣的共通點──他們都不是做中式糕點出身，而蛋黃酥相對容易入門，因為中式的油皮、油酥做法和法式千層酥皮非常類似；再來，他們都希望為傳統的蛋黃酥注入新時代的脈動，不管是更加精選優質原材料，或者融入法式烘焙手法，都賦予蛋黃酥全新的精氣神。譬如，吳寶春用國王派的概念做酥皮；李依錫著重在紅豆沙的口感與比例；王鵬傑的外皮烤得特別酥脆；陳耀訓則強調奶油與鹹蛋黃的鴨油共譜的底部焦香。\n\
    我認為引爆蛋黃酥狂潮的關鍵人物，還是陳耀訓。2017 年獲得世界麵包大賽冠軍的他，2019 年從高雄落腳台北開設陳耀訓麵包埠，第一年中秋節賣蛋黃酥口碑就很好，被美食界譽為「蛋黃酥界愛馬仕」，第二年開始瘋狂排隊，2021\
    \ 年起就使用大型演唱會售票系統來賣蛋黃酥了。\n你比較想搶陳耀訓的蛋黃酥，還是陳奕迅的演唱會門票呢？\n                        \
    \   ──改寫自高琹雯專欄"
