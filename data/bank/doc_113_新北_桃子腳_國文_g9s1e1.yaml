  section: 3
  number: 36
  type: single
  page: 5
  stem: 根據本詩文意，「採收後的蔥仔蒜，泡好澡、理完髮／送預冷室吹冷氣，凌晨時打箱，坐上／北漂的運銷車，喊價批發，米其林餐廳／當牛排好朋友、歐式濃湯原料／落梅雨的產地插下一批新苗」想表達的意涵是什麼？
  options:
  - label: A
    content: 農民採收完蔥仔蒜的閒適
  - label: B
    content: 豐收使農民賺大錢的歡欣鼓舞
  - label: C
    content: 蔥仔蒜的嬌貴與在料理上的多元運用
  - label: D
    content: 藉由蔥仔蒜的運銷狀況來呈現城鄉差異。
  group_stem: "妳走進蔥蒜田裡，拉起鬆垮花褲管\n蹲下，翻出褐鏽斑斑的鐵蔥插\n「五株……六株……都可以！」\n老闆這樣吩咐，鳳眼的妳笑著揮手\n這麼告訴我──\n\
    \n「這是我第一次──種蒜！」\n剛來幫忙不久，前幾天穿不住外套的時候\n太陽大，不像現在涼涼\n都是拔──而已──\n「對喔妹妹，這是蔥，還是蒜呀？」\n\
    \n都不是、也都是\n伊是蔥仔蒜（tshang-á-suàn)，我嘀咕\n仔（á）：名詞後綴，有小的意思\n蔥在前小、蒜在後大，說起來\n還是偏蒜的一種吧？\n\
    \n大蒜：蔥蒜。批發代號SG4\n英文的Leek，德語的Pórree\n總得換成符碼才確認，好比\n身分證字號拼成我，而妳──\n「我同學的老婆啦，我請她來幫忙！」\n\
    \n「沒種蔥，沒種蒜，也沒有這個。」\n妳說，無颱風無地震的老家\n也務農，榴槤芒果蓮霧波羅蜜\n蔥仔蒜、沒有、第一次種\n「蔥怕熱啦！都被蟲蟲吃掉囉！」\n\
    \n採收後的蔥仔蒜，泡好澡、理完髮\n送預冷室吹冷氣，凌晨時打箱，坐上\n北漂的運銷車，喊價批發，米其林餐廳\n當牛排好朋友、歐式濃湯原料\n落梅雨的產地插下一批新苗\n\
    \n台灣的榴槤太貴，我說，妳咯咯\n笑了，滑開手機裡的相簿遞來\n家鄉那，弟弟剛採下滿室青綠刺果\n「機票錢啦機票錢！」妳說\n來台灣，蔬果都要坐飛機\n\n\
    「無人要做田啦！」膚色和妳同黑\n老闆撥開一把把蔥苗，乾裂的土噴濺\n「越南仔、越南仔（Ut-lâm-á）。」\n他們這樣喊，不過，姊姊，「這也是我\n第一次──種蔥仔蒜哦！」\n\
    \         ──王以安 蔥仔蒜田裡"
