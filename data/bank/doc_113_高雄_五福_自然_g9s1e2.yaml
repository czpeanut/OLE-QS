- id: doc_113_高雄_五福_自然_g9s1e2_s3_12
  section: 3
  number: 12
  type: single
  page: 6
  stem: 根據現今波斯灣地區的主要產油岩層年代，推測其岩層較難以找到下列何種生物化石？
  options:
  - label: A
    content: 三葉蟲
  - label: B
    content: 珊瑚
  - label: C
    content: 恐龍
  - label: D
    content: 菊石。
  group_stem: "中東波斯灣地區盛產石油，是臺灣原油進口的主要來源之一。你是否想過為什麼波斯灣地區有這麼多石油呢？這其實和地球板塊的運動歷史有關。\n\
    \    古生代時期，大陸地殼隨著板塊的運動而逐漸聚集，在大約2.5 億年前的時候，聚集成一個超級大陸，稱為盤古大陸。到了中生代時期，盤古大陸開始分裂，各陸塊逐漸移動到現今五大洲的位置，而各地的氣候等環境因素也隨之改變。\n\
    \    波斯灣地區在盤古大陸時期，曾是位於赤道附近的大陸棚淺水區，自古生代到中生代，幾乎都處於穩定的沉積環境中，除了有陸地帶來的大量沉積物之外，同時也有富含養分的海流經過，滋養了大量的浮游生物；而這些浮游生物死亡、下沉後，便會使得此處的沉積物富含有機物質（圖一）。\n\
    \    現今波斯灣地區所開採的石油，主要產自於厚達12 公里左右的中生代沉積岩層，其大多是富含孔隙的砂岩層和石灰岩層；除此之外，在這些儲油層上方，也有不透水的岩層可以封住油氣，以及褶皺構造可以聚集石油。因此，波斯灣地區擁有全世界最豐富的石油資源。\n\
    \    由於石油能源牽涉到龐大的利益關係，導致近年來波斯灣區域經歷了多次的戰爭，可見地球歷史與人類的歷史發展也是息息相關的。\n\n圖（一）約2.5 億年前的盤古大陸示意圖，黑色圈起的海灣區域，形成了現今中東波斯灣地區。"
