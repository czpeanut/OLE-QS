- id: doc_113_台中_向上_英語_g8s2e3_s4_36
  section: 4
  number: 36
  type: single
  page: 2
  stem: What do we know about Alice?
  options:
  - label: A
    content: It’s about a zoo.
  - label: B
    content: Judy Moore plays a role in it.
  - label: C
    content: When you watch it, you laugh all the time.
  - label: D
    content: People can watch it on TV now.
  group_stem: 'Judy Moore saved the movie. by Joe Johnson

    ☆☆☆╱5

    Reviews:

    It’s very hard to explain my thoughts on Alice. They are really polarized. There
    are some great things about it, but there are some terrible things, too. First
    of all, what a show from Judy Moore! She really brought her character to life
    and made me have the same feelings with her. However, the story appeared to be
    cheaply made for TV, and not the movie theater. My suggestion: Don’t spend money
    on this, and go watch The Zoo. At least it will make you laugh.


    What a deep story. by Sandy Shaw

    ☆☆☆☆╱5

    Reviews:

    I liked Alice. Sure, some of the characters weren’t played very well, but the
    story was really deep. Judy Moore did a great job, and she made it feel like that
    this could happen to any of our family, and that we need to do a better job to
    care for them.


    DO NOT WATCH! By Tony O’Nion

    ☆╱5

    Reviews:

    What a waste of my time! My kids can make better movies than this on their phones.
    I actually fell asleep in the middle of the movie, and my wife had to wake me
    up. Every one of the actors talked so quietly!

    DO NOT WATCH！


