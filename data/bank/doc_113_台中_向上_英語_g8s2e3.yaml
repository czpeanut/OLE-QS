  group_stem: 'New Changes for Free Tiger Train

    1. From June 1, 2019, there will be three more train services from Monday to Friday
    for the east line, which is between Maple City and Lego City. Besides, there will
    be five more services from Maple City to Lego City on Saturdays and six more services
    from Lego City to Maple City on Sundays. Besides stopping at Beach City, Barbie
    City and Dart City, an additional stop in Autumn City will be trialed from June
    1. We will also change the earliest train service that leaves at Maple City from
    7:30 am to 7:00 am on the weekdays.

    2. Train services will be expanded on the west line. Those who live in Pitt City
    will be able to take a train as two train services will stop at Pitt City every
