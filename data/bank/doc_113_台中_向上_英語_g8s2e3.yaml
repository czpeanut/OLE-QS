  group_stem: 'When it comes to 3D printing, most people may think of printing small
    things. But now 3D printers are doing more than that. In the USA, 3D printing
    is taking home building to a new height. That’s because engineers are building
    the first two-story house with a giant 3D printer. Maybe you can find many 3-D
    printed houses around the world. However, there have been no two-story houses
    so far.


    3D printers build things by putting down many layers of materials. The way to
    build a house is almost the same, but it uses concrete. The engineers began to
    build the two-story house in July 2022. It will take 330 hours to finish printing
    the house, and the 3D printer will do most of the hard work of building it. Besides,
    the engineers want to use the house as “a big lab” to learn more about 3D-printing
    houses. They hope 3D printers can help build the house more cheaply and quickly
    one day.


