  section: 4
  number: 44
  type: single
  page: 3
  stem: A reporter asked people living in Los Angeles about their feelings during
    the wildfires. Which answer is most likely from a person who experienced the fire?
  options:
  - label: A
    content: “We felt safe because the fire didn’t move very far, and we could stay
      at home.”
  - label: B
    content: “We were really scared. The fire grew so fast that we had to leave everything
      behind and find a safe place.
  - label: C
    content: “The firefighters stopped the fire quickly. It wasn’t as bad as we expected.”
  - label: D
    content: “The fire didn’t bring any trouble for us. It was easy to stay inside
      and wait for it to end.”
  group_stem: 'The USA is no stranger to wildfires. However, the wildfires in January
    2025 were one of the worst wildfires on record in Los Angeles. These dangerous
    fires moved fast because of hot and dry winds called the Santa Ana winds. The
    fires burned a large area of land-about half the size of Taipei City! At least
    24 people lost lives, and more than 180,000 people had to leave their homes to
    stay safe.

    Scientists say the dry weather is one of the main reasons for the wildfires. After
    a long, hot summer with little rain, the trees and plants in Los Angeles became
    very dry and burned easily. The strong Santa Ana winds made the fires grow bigger
    and harder to put out. Another reason for the wildfires is the growing number
    of homes built near the forests. When a fire starts, it moves to homes quickly
    because they are too close to trees. Firefighters are working hard to stop the
    fires, but the weather makes it very difficult. Wildfires don’t just hurt land;
    they hurt people’s health too. The smoke from wildfires can make the air dirty
    and hard to breathe. It can lead to sore throats, coughing, and headaches. People
    with breathing problems can feel even worse.

    The wildfires in LA are a tough nut to crack. Fighting them is not an easy job.
    But we can prepare by building safer homes, taking care of forests, and keeping
    our towns safe together.


    wildfire 野火；record 紀錄；scientist 科學家；forest 森林；breathe 呼吸；cough 咳嗽'
