  type: single
  page: 2
  stem: 林風國中對全體九年級學生做國文、數學成就測驗，琦豐的國文分數是 67 分，為第 3 四分位數，數學分數是 76 分，為第 1 四分位數。根據這些資料，下列敘述何者正確？[習作
    ch2]
  options:
