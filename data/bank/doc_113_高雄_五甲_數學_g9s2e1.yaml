    軸)，將原拋物線軌道做鏡像線對稱，形成一新軌道軌道，再以地面為對稱軸，做第二次鏡像線對稱，成為最終軌道。這樣可以跟原軌道無縫接軌，並造成軌道上、下倒置，更為刺激」

