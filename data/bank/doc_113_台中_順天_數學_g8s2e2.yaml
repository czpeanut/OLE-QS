  stem: '如圖，$\triangle ABC$ 為等腰直角三角形，其中 $\angle BAC=90^{\circ}$，且 $\overline{CE}$、$\overline{BD}$
    分別垂直過 $A$ 點的直線於 $D$、$E$ 兩點。


    (1) 在下列空格內填入適當的文字、線段或角(度)，完成 $\triangle ACE \cong \triangle BAD$ 的說明過程。

    說明：

    ∵ $\angle 1+\angle 2=$ [甲] 度。(1分)

    $\angle 3+\angle 2=$ [乙] 度。(1分)

    ∴ $\angle 1=\angle 3$

    在 $\triangle ACE$ 和 $\triangle BAD$ 中

    $\begin{cases} \angle AEC = \text{[丙]} = 90^{\circ} \text{ (1分)} \\ \angle 3 =
    \text{[丁]} \text{ (1分)} \\ \overline{AC} = \text{[戊]} \text{ (1分)} \end{cases}$

    ∴ $\triangle ACE \cong \triangle BAD$ ( [己] 全等性質)。(1分)


    (2) 若 $\overline{BD}=3$，$\overline{CE}=2$，則 $\triangle ABC$ 的面積為何？(3分)'
