    (丙) 甲午戰敗後，便有許多中國知識分子轉而支持革命，比如梁啟超

    (丁) 以武力推翻君主體制，建立民主共和國，是當時革命派的目標'
  options:
  - label: A
    content: 甲丁
  - label: B
    content: 乙丙
