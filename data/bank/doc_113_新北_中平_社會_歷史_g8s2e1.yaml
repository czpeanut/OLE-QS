- id: doc_113_新北_中平_社會_歷史_g8s2e1_s1_29
  section: 1
  number: 29
  type: single
  page: 2
  stem: 資料一與資料二都是針對當時中國某一政體所提出的看法，請問這個政體是？
  options:
  - label: A
    content: 民主共和制
  - label: B
    content: 君主立憲制
  - label: C
    content: 洪憲帝制
  - label: D
    content: 清朝帝制。
  group_stem: '閱讀下列資料，選出適合的答案：(閱讀素養題)

    資料一：「中國數年以來，習於君主專制政體。四年以前，中國由專制一變而為共和，由於變動劇烈，不能期望有良好結果。中國將來必因總統繼承問題釀成禍亂，…中國推行君主制，較共和制更合適。」

    (古德諾，《共和與君主論》)

    資料二：「忽而臨時總統，忽而正式總統，忽而制訂約法，忽而修改約法，……政府威信，掃地盡矣。在現行國體之下，而思以言論鼓吹他種國體，則無論何時皆反對之。」(梁啟超，《異哉所謂國體問題者》)'
- id: doc_113_新北_中平_社會_歷史_g8s2e1_s1_30
  section: 1
  number: 30
  type: single
  page: 2
  stem: 文章中的□□運動，可能是哪一場運動？
  options:
  - label: A
    content: 自強運動
  - label: B
    content: 新文化運動
  - label: C
    content: 五四運動
  - label: D
    content: 戊戌變法。
  group_stem: '閱讀下列文章，選出適合的答案：(第30~31題，閱讀素養題)

    民國初年，由於日本貨便宜又好用，而遍布中國各地。中國人民一早盥洗時，會用日本的牙刷、牙粉和瓷盆；出門穿著日本製的衣帽，學生揹的是日本書包，用的是日本文具；如果有小病痛，還喜歡服用「翹鬍子仁丹」等日製小藥丸。

    □□運動期間，各地愛國群眾打著「外爭主權，內除國賊」的口號，以「罷課、罷工、罷市」表示抗議之外，也想到：既然日貨無所不在，如果全民拒買，祭出「經濟絕交」的姿態，一定能打擊日本。抵制期間，反而提高了國貨的銷售，報章雜誌也常見宣傳國貨廣告標語。這場抵制運動不僅帶給日本貿易壓力，也給了中國本土製造業發展的機會。

    ( 改寫自課翰林版課本第二章課後閱讀，頁101)'
