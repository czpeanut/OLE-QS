  section: 1
  number: 18
  type: single
  page: 1
  stem: 兒童節(Children's Day)是為保障兒童的生存權、保健權、受教育權、撫養權等權利、改善兒童生活、反對虐待兒童毒害兒童而設立的節日。1931年，孔祥熙發起建立的中華慈幼協濟會提議，將4月4日定為兒童節。其理由為「時當春令，氣候相宜，又與往日之三三、五五、九九及今日之十十等節名互相輝映。」後來由教育部制定兒童節紀念辦法，並於隔年的4月4日實施。請問：下列何者並非民初重視兒童權利所帶來的影響？
  options:
  - label: A
    content: 用科學的方法，研究兒童心理和兒童教育
  - label: B
    content: 開始關注兒童問題，保障應有的各種權利
  - label: C
    content: 將義務教育年限向下延伸，涵蓋至幼稚園時期
  - label: D
    content: 透過兒童報刊的發行，開啟兒童文學的創作風氣。
