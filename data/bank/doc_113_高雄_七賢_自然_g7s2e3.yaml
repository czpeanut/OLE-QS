  section: 1
  number: 43
  type: single
  page: 4
  stem: 西元1956 年日本 水俁市許多民眾出現甲基汞中毒的現象，患者一開始手足麻痺，產生語言、智能障礙，後來神經錯亂、全身痙攣，最後死亡。而當地有一家肥料工廠，會排放含汞的廢水到海裡。請你推測下列敘述何者正確？
  options:
  - label: A
    content: 工廠表示他們是直接排放含汞的廢水，不是甲基汞，因此不是他們的廢水導致民眾生病
  - label: B
    content: 民眾採集了附近海域的藻類食用，是吃了大量藻類導致中毒
  - label: C
    content: 民眾可能使用到大量含有汞的海水，在體內自行轉化成甲基汞，才會導致中毒
  - label: D
    content: 民眾捕撈附近海域的魚類來食用，這些魚體內累積了大量的甲基汞，因此食用越多的人，中毒越嚴重。
