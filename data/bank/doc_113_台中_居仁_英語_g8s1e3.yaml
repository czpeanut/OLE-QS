  section: 6
  number: 51
  type: single
  page: 6
  stem: What is recommended to people who want to visit the festival?    █  recommend
    推薦
  options:
  - label: A
    content: Taking the free bus to the festival.
  - label: B
    content: Visiting the festival on the weekend.
  - label: C
    content: Entering Satyr’s Park from Fox Street.
  - label: D
    content: Parking in Garden Square and walking to the festival.
  group_stem: '(51-52)


    INFORMATION ABOUT THE 2021 GREEN FESTIVAL

    1. The 2021 Green Festival will be held at Satyr’s Park from April 1 to May 31.

    2. You are welcome to take the Free Festival Bus at the Goat Street Station to
    the festival.

    3. You can also go to the festival by metro (get off at the Koala Street Station
    or the Turtle Street Station) or by bus (take No. 28,103,125,157,259,505,908,
    or 1086).

    4. During the festival, Fox Street is closed; no cars can enter the street.

    5. Garden Square won’t be open for car parking; there will be a farmers’ market
    at the square during the festival.

    6. During the festival, Faun’s Weekend Flower Market will be open every day from
    8 a.m. to 2 p.m.


    █ held 舉辦        [113 會考]'
