  - label: D
    content: Share new ways to detect sounds.
  group_stem: '(36-37) From ABC Magazine

    The world’s seas are home to around 250,000 kinds of animals. Most people think
    they are quiet, but that’s not true. Many of these animals are anything but silent.
    They make noises when they eat, swim, and move. They also produce sounds to talk
    to each other. To learn from those, scientists are creating a library. The library
    will bring together existing sound recordings. It will also add new ones and share
    new ways to detect sounds. Now, that is music to many scientists’ ears.'
