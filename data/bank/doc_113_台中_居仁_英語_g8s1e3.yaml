- id: doc_113_台中_居仁_英語_g8s1e3_s6_44
  section: 6
  number: 44
  type: single
  page: 4
  stem: How many of the four people like using LINE?
  options:
  - label: A
    content: One.
  - label: B
    content: Two.
  - label: C
    content: Three.
  - label: D
    content: Four.
  group_stem: '(44-46)

    LINE is a new communication app. Do you use it? What do you think of it?


    | | |

    |---|---|

    | Eddie | LINE is great! Almost all my family and friends use LINE. With it, we
    can make voice and video calls without paying. It is very convenient to talk with
    friends on LINE. |

    | Allen | I don’t like LINE. I am an office worker. I only needed to work five
    days a week before, but now I get a lot of messages from my boss on weekends.
    I really want to take a rest after work. |

    | Bella | LINE is very popular with many people in Taiwan now. The number of LINE
    users is still growing. I can’t live without LINE because I can call my family
    or friends for free. I think LINE is a smart invention. |

    | Judy | LINE is terrible. I get messages all the time! If I read the messages
    but don’t answer them, my friends will be unhappy about it. Besides, I often see
    people chatting on LINE when they are with their family or friends in restaurants.
    Shouldn’t they talk with their family or friends sitting at the same table? |


    ■ communication app 通訊軟體  message 訊息  invention 發明  chat 聊天'
