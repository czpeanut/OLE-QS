  group_stem: '(38-40)

    Sometimes you go shopping and buy a lot of things, but you don''t really need
    them. What can you do? Take a look at these tips. Maybe they can help you. First,
    always think before you buy. Before you buy anything, stop for a second and think
    "Do I need it, or do I want it?" Don''t buy things just because you want them.
    Only spend money on necessary things. Second, make a shopping list before you
    go. Shopping with a list will keep you from walking around the store and buying
    unnecessary things. Those tips can''t help you? Try using the 30-day-rule. When
    you see something and you really want it, wait around a month before you buy it.
    Maybe after some time, you will not want it. Follow these tips and save money.'
