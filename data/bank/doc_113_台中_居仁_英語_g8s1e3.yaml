  group_stem: "(47-48)\nMy dear friends,\n    My family and I moved into our country\
    \ house one month ago. The kids are planning to give a party at our new house.\
    \ I hope all of you can come. The party will begin at 11:00 a.m. on Saturday.\
    \ You can enjoy lots of food and drinks.\n    Together with this letter is a map\
    \ to our house. After you get off the train, take the road in front of the station.\
