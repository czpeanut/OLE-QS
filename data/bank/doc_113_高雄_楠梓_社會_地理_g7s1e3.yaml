  group_stem: 曹公圳是道光17 年(1837)鳳山知縣曹謹發現民間苦於看天雨水之不穩定，果斷大力興築的水圳，同時是清代由官方主導的最大規模水利工程。整體工程進度分為兩階段，後世以此區分而名為舊圳和新圳，總共有90
    條圳路，網絡遍及高雄(包含鳳山)平原各地，灌溉面積達4,582.5 甲，乃是大高雄地區最重要的農田灌溉系統。水源取自下淡水溪，並以「壘石為門」的方式修建取水閘門，即為曹公圳圳頭，後歷經日治初期的修整而為今日樣貌。目前，水閘門以及紀念石碑，狀況良好，是一處緬懷先人與土地、河川對話的文化地景。請回答下列58~60.題：
