    content: 該社團由教師組成，並號召學生參與
  - label: B
    content: 該社團由一群愛護動物的同學自發組成
  - label: C
    content: 校方限制該社團活動，避免危害安全
  - label: D
    content: 結社自由適用於成年人，不適用國中生。
  group_stem: 板橋國中有一群喜歡小動物的學生自發組成了「愛小不點」社團。學校對於學生愛護動物的觀念非常認同，認為這是一個有愛心且有意義的社團，樂見更多學生參與。「愛小不點」社團近期在招募社員，歡迎熱愛校狗的同學加入，並分成清潔組、照護組、義賣組以及宣傳組，期望成立社團後可以讓更多人認識校狗，同時可以提供校狗衛生的環境。每個週末還有社員聚會活動，義賣自製的校狗校園日常卡片，並將義賣全數所得捐贈給流浪動物之家。
  answer:
  - B
