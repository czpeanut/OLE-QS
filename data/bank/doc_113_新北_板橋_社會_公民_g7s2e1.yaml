  stem: 精通多國語言的烏克蘭籍季安士神父來臺後，將大愛、無私的精神奉獻給臺灣，他走入社區、扶助弱勢者，對於教育、社會關懷都有卓越的貢獻，語言能力佳的他也常代表參與國際活動，爭取更多國際支持與關注。近期他取得中華民國國籍，並由高雄市苓雅戶政事務所協助取得身分證。請問季安士神父取得國籍的途徑為何？
