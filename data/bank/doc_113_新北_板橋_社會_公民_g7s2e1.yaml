- id: doc_113_新北_板橋_社會_公民_g7s2e1_s1_37
  section: 1
  number: 37
  type: single
  page: 1
  stem: 社會成員在參與公共事務的過程須具備公民德性，如同愛因斯坦曾說：「這個世界不會被那些作惡多端的人毀滅，而是那些冷眼旁觀、保持緘默的人。」由此可知我們遇到不對的事情發生時，應發揮公民德性，以避免憾事發生。請問下列何者不是參與公共事務應有的做法？
  options:
  - label: A
    content: 捍衛公平正義
  - label: B
    content: 尊重多元聲音
  - label: C
    content: 理性思考尊重
  - label: D
    content: 盲從不分是非。
