  group_stem: 'Do you always feel tired in the morning? Here are some tips for you.
    First, go to bed at the same time every night. When your body remembers the sleep
    schedule, you can wake up easily. Second, read a book or listen to calm music.
    Don’t use your phone or computer right before bed. The blue light makes you feel
    hard to get to sleep. Third, do some exercise after getting up. Then, drink water
    and have a healthy breakfast, like fruit or cereal. At last, try to get some sunlight
    in the morning. The light can help your body get ready for the day.

    *same 相同的 *sleep schedule 生理時鐘 *calm 平靜的

    *blue light 藍光 *hard 困難的 *cereal 穀物 *sunlight 陽光'
