  stem: 牛可以從植物的纖維素中獲得可吸收利用的養分，主要原因為何？
  options:
  - label: A
    content: 牛的胃可以分泌酵素，分解纖維素
  - label: B
    content: 牛反芻植物，再由唾液將纖維素分解
  - label: C
    content: 牛胃中的共生菌可以合成碳水化合物
  - label: D
    content: 牛胃中的微生物分泌酵素，分解纖維素。
  group_stem: '【文章二】請根據文章內容，回答44-46 題：

    牛胃由四個胃部組成，外觀與功能都有所差異。當食物從牛口通過食道，第一個抵達的胃部是最大的瘤胃，約佔牛隻腹腔75%的體積，可用來暫存食物，也可反芻回口腔再次咀嚼。瘤胃中有大量的微生物，這些微生物具有碳水化合物活性酶，有助於將植物中的纖維素分解，轉換成可被牛隻吸收利用的養分。

    第二個胃部是蜂巢胃，又稱網胃，外觀有一個一個六角形方格的蜂巢狀，與瘤胃相似的是，也有大量微生物來促使植物分解。蜂巢胃的特殊構造可以防止較硬、較大的食物直接進入後段的消化系統，並讓食物再返回瘤胃消化，或是回到口中重新咀嚼，也就是反芻。

    接下來是球形的重瓣胃，除了可以再次篩選食物，將太大的食物再次反芻之外，也能吸收水分，經過重瓣胃後，食物大多已成流質或稀狀，接著進入到皺胃。皺胃內含可分解蛋白質的酵素，也具有胃酸可以殺菌，因此被稱之為真胃，而後的消化道功能也都與人類差不多了。

    【文章修改自：牛雜湯裡各種奇形怪狀的「牛肚」到底是什麼？】'
