- id: doc_112_桃園_文昌_自然_g7s1e2_s3_41
  section: 3
  number: 41
  type: single
  page: 5
  stem: 請從文章的敘述中，推測【甲】器官應為何者？
  options:
  - label: A
    content: 膽囊
  - label: B
    content: 胰臟
  - label: C
    content: 肝臟
  - label: D
    content: 小腸。
  group_stem: '【文章一】請根據文章內容，回答41-43 題：

    我國嬰兒比西方嬰兒好發膽道閉鎖，若未能在小孩出生的60 天內完成手術，延遲治療會使膽汁逆流並鬱積於【甲】內，很容易會造成【甲】硬化，甚至需要換【甲】。因此寶寶出生後應仔細觀察皮膚及糞便的顏色，若寶寶的皮膚呈現黃疸現象，眼白變黃，就要更仔細觀察比對大便的顏色。由於膽汁的顏色為黃色或綠色，若膽汁能順暢排出，和大便混合後便會呈現出黃色或綠色大便，此為正常的狀況；如果膽汁滯留，糞便無膽汁混合下會呈現淡黃色或灰白色，此屬於不正常狀況，應趕快就醫。

    【文章修改自：寶寶手冊】'
