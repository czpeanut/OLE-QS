- id: doc_112_桃園_文昌_自然_g7s1e2_s3_47
  section: 3
  number: 47
  type: single
  page: 6
  stem: 若想檢測所採集的糖楓樹汁液含糖量多寡，可以利用下列哪一種方式？
  options:
  - label: A
    content: 樹汁滴加碘液後，如呈現藍黑色代表含糖量多
  - label: B
    content: 樹汁滴加碘液後加熱，如呈現藍黑色代表含糖量多
  - label: C
    content: 樹汁加本氏液後，如呈現淡藍色代表含糖量多
  - label: D
    content: 樹汁加本氏液後加熱，如呈現紅色代表含糖量多。
  group_stem: '【文章三】請根據文章內容，回答47-50 題：

    在加拿大，人們將楓糖漿視為國寶，楓糖漿有著「液體黃金」的響亮稱號。楓糖漿不只擁有甜而不膩的好滋味，更是具有高營養價值。早在 17 世紀時，北美大陸的印地安人就會將楓樹剖開或是鑿洞，藉此收集樹幹的汁液，並且將其加熱蒸煮，熬製成我們所熟知的楓糖漿。

    楓糖漿通常由糖楓、紅楓或黑楓的木質部汁液濃縮製成。以糖楓為例，汁液含糖量大多在 2~3 %，含糖量較高的樹汁液甚至可達10%。楓糖主要成分是蔗糖(醣類的一種)，也含有葡萄糖、胺基酸、維生素等等，各地的楓糖漿嘗起來有著不同風味，除了樹種的因素，也跟這些成分的比例不同有關。楓糖的產量往往取決於楓樹平時儲存了多少的糖，但科學家還發現，當楓樹的種子產量爆發時，隔年楓糖漿的產量都會下降！因此，如果把樹種、氣候與種子的產量都一起列入考慮的話，就能更準確預測楓糖漿的產量囉！

    【文章修改自：鬆餅好朋友！你知道甜滋滋的楓糖漿怎麼來的嗎？】'
