- id: doc_112_彰化_埤頭_英語_g9s1e1_s4_40
  section: 4
  number: 40
  type: single
  page: 2
  stem: What is the reading for?
  options:
  - label: A
    content: Getting people to visit a castle in a movie.
  - label: B
    content: Selling movie tickets to fans of a famous castle.
  - label: C
    content: Finding actors for a movie.
  - label: D
    content: Inviting people to a castle and watch a movie there.
  group_stem: 'A fan of *Last Autumn*? Then, you don''t want to miss Highland Castle,
    where the movie was made. Walking in the castle, you''ll feel like you are being
    taken back to those famous scenes (場景) - the back garden where Sir William and
    his future wife Lady Mary had their first kiss, the drawing room where Lady Mary
    lay in Sir William''s arms for the last time and never opened her eyes again....


    A true story of Sir Anthony Airyman (1758 – 1801), *Last Autumn* shows the happy
    days of his life in Highland Castle. Built in 1625, the castle was all Sir Anthony
    had after his wife, Lady Helen, was gone. It was kept as it had been to remember
    their life there until a fire burned down half of it.


    Sir Anthony died soon after, and the castle was passed down in the family until
    his great-great-grandson, Lewis Airyman, sold it to an American businessman, Charles
    Bass.


    Now, thanks to the big ticket sales of *Last Autumn*, Highland Castle has got
    back its old-time shine and will be opened for visits for the first time. On July
    5, 2020, actors from *Last Autumn* will be there for the opening. Join us!

    ☎ 0642-8854'
  shared_asset: g4_40_42
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
  source_ocr: true
