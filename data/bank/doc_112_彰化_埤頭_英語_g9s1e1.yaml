- id: doc_112_彰化_埤頭_英語_g9s1e1_s4_43
  section: 4
  number: 43
  type: single
  page: 2
  stem: What does the report NOT suggest (建議)?
  options:
  - label: A
    content: Having more parks for children.
  - label: B
    content: Changing opening hours for farmers' markets.
  - label: C
    content: Making plans to encourage people to do exercise.
  - label: D
    content: Changing students' lunch.
  group_stem: 'Time to Lose Weight

    Because of the high cost of health care, the mayor of Apple City decides to make
    some changes. Below is part of the report from his office workers.


    Middle-aged people between 40 and 60 have the most percentage (%) of obesity.
    So it would be better if we set up farmers'' markets to encourage people to eat
    more fresh fruits and vegetables. We should also have more parks in the city because
    both teenagers and children under 12 have the same percentage (%) of obesity.
    Besides, schools should give students healthy lunch but not junk food, such as
    French fries or ice cream.

    People over 60 years old take the second largest of percentage (%) though the
    average lifespan is 68 in the city. An interesting fact is that a lot of young
    people between 20 and 40 aren''t as fat as people older or younger than them.
    One third of them say that they go jogging with friends or families in the gyms
    or along the beach on the weekend. It might bring in more people to do exercise
    if we hold a running race every month.


    📖 mayor 市長 middle-aged 中年的 obesity 肥胖 encourage 鼓勵 junk food 垃圾食物 such as 例如 average
    lifespan 平均壽命'
  review_note: 掃描件：無文字層可驗證，內容為影像辨識
