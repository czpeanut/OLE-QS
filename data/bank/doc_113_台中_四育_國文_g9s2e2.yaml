    content: 和睦的家庭最後分崩離析，妻離子散
  - label: B
    content: 只要是取之有道，愛錢的人也沒有錯
  - label: C
    content: 所有的器物上、牆壁上都蒙上了灰塵
  - label: D
    content: 聚散之間，便成為了跌宕起伏的人生。
