  stem: 下列何者最適合做為「本文的標題」？
  options:
  - label: A
    content: 未來人類的宿命——憂鬱症
  - label: B
    content: 憂鬱症的新療法——自體治療
  - label: C
    content: 憂鬱症的事前預防——心理諮商
  - label: D
    content: 正視二十一世紀的威脅——憂鬱症。
  group_stem: "請閱讀以下短文，並回答38 ～ 39 題：\n 聯合國 世界衛生組織提醒：二十一世紀，憂鬱症將和癌症、愛滋病並列為危害人類健康的三大疾病。許多人不覺得憂鬱症需要專業的治療，認為這種病症只不過是心理上的困擾，勸患者「想開一點」就會改善。由於憂鬱症屬於精神疾病的一種，使大部分患者與家人感到罹患憂鬱症是一種恥辱，憂鬱症患者也因此被許多不明究理的人汙名化。\n\
    \ 引發憂鬱症的原因有很多，從生理因素來看，是因為大腦中的神經化學物質失去平衡；就心理因素而論，習慣用負面想法看事情的人格特質，總是悲觀地覺得自己很可憐，這也是形成憂鬱症的主因；社會因素則包括了孩提時的創傷經驗，以及生活的重大失落事件，像是長期重病、失業、負債、親人去世，還有挫折的人際關係等，這些事件都足以對個人造成嚴重打擊，可能引發憂鬱症。\n\
    \ 若要預防憂鬱症，其實每天做些可以放鬆身心的事情，有助於舒緩壓力與焦慮；此外，保持充足的睡眠，也可幫助人們度過低潮；而定期運動可以讓身體內分泌平衡，有助於改善憂鬱；最重要的是，如果您有心事或感到孤獨抑鬱，別忘了主動和他人分享，亦可求助於專業的心理諮詢服務，相信也會有很大的助益！"
