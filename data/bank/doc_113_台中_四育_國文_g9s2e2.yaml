  section: 2
  number: 30
  type: single
  page: 4
  stem: 作者認為，善於為生活打比喻的人，具有何種特質？
  options:
  - label: A
    content: 樂觀的生活態度
  - label: B
    content: 對於現實的逃避
  - label: C
    content: 對於人生的嘲諷
  - label: D
    content: 失敗者的自我安慰。
  group_stem: "請閱讀以下短文，並回答30 ～ 31 題：\n 朋友參加資格證考試，三戰三敗，次次都是失敗而歸，想想都覺得悲壯。這次失敗，我以為她一定會垂頭喪氣。沒想到她卻笑著對我說：「我就像個不倒翁一樣，倒下去了，又樂呵呵的自己站起來。」我被朋友逗笑了，把自己比成不倒翁，多麼生動精彩的比喻。\n\
    \ 我很欣賞善於為生活打比喻的人，他們有樂觀的生活態度，豁達而睿智，永遠用輕鬆幽默的姿態來看待問題和處理問題。生活中那些精彩的比喻，都是人們經驗的提煉，是生活的精華所在。\n\
    \ 我的一個同學，正處在創業的艱難階段。但他從來沒抱怨過創業不易，總是笑呵呵的對大家說：「我把現在的階段當成登山。登山很費力，每走一步都在消耗體力，但登山的過程也是一種享受。雖然累得汗流浹背，但看到了險崖怪石，參天古樹，山頂流雲，這收穫多大呀。我堅信，有一天我會登臨山頂，體驗到一覽眾山小的幸福！」那麼艱難的事，被他這樣一比方，讓人感覺到趣味橫生，充滿了希望。\n\
    \ 生動的比喻，還可以是一個巧妙的「反轉」，即使生活是灰暗的底色，也能讓你把它都變為明麗，一切都會生動起來。\n 關於生活與人生，從來都是個宏大的話題，似乎很難駕馭。但如果能為生活打個比喻，化大為小，會讓我們覺得可以掌控，這是一種難能可貴的智慧。很多人活得茫然，理不清思路，如果善於為生活打比喻，你會覺得自己忽然間活清醒了—一切不過就是那麼回事。\n\
    \ 我很喜歡一些關於人生的比喻：人生如棋，人生如戲，人生如水，人生是一趟旅程……很多話看似簡單，細品起來韻味無窮。\n 人生漫長曲折，生活撲朔迷離，為生活打個精采比喻，讓我們把人生經營得生動而豐盈，充滿智慧。\n\
    \ （馬亞偉 為生活打個精采比喻）"
