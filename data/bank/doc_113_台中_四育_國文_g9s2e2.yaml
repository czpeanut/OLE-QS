- id: doc_113_台中_四育_國文_g9s2e2_s2_34
  section: 2
  number: 34
  type: single
  page: 5
  stem: 文中提到逢考試時，「包粽（中）」取其諧音以求吉利，下列何者不屬於此種現象？
  options:
  - label: A
    content: 旅館、飯店之電梯樓層、房號會避免數字四
  - label: B
    content: 過年時不小心打破東西，長輩會說「歲歲平安」
  - label: C
    content: 送人禮物要避免送時鐘或雨傘
  - label: D
    content: 吃飯時，不可將筷子插在碗內的白飯上。
  group_stem: "請閱讀以下短文，並回答34 ～ 35 題：\n 每年六月，我媽都得包粽子，如果家中有人要考試，那就格外慎重其事，因爲是「包粽（中）」的關係。她包粽子最最講究竹葉的品質，所以早早就要向一位在山上種竹的老太婆買竹葉與草繩，說是能先挑到又大又厚又香的，然後一片一片的將竹葉洗淨、拭乾，然後分作兩疊，一邊是較靑較大的，當外層，一邊是較黃較小的，當内裡。我媽的粽子慣用兩張竹葉，說這樣才不會「露餡」，在她的家鄉話裡大概是「露出馬腳」的意思，彩頭不好，所以一定要大小兩葉，將豆沙、豬肉及糯米緊緊裹實，才好下鍋。\n\
    \ 我家早期的粽子只有甜鹹兩種，甜的是豆沙粽，鹹的是肉粽，所有的料都是自己動手，包肉粽的生糯米要用醬油稍微醃過，然後兩張竹葉摺成小小的斗狀，填入一半糯米，放上一精一肥兩片醃漬的豬肉，再覆上糯米，將粽葉摺妥綁牢就大功告成了。較之包了豬肉、蛋黃、蝦米、花生、香菇、紅蔥頭等豐實内料的「臺灣粽」，我媽的粽子顯得單調，不過卻有其特殊的清爽風味。這風味難以言喻，我在外面吃過的粽子，往往過鹹或是過油，而我看許多人吃粽子都要搭配五香粉或甜辣醬之類的作料，但我媽的粽子卻以平淡取勝，主要是吃那竹葉的清香，所以絕不用任何添加物，肉粽裡的那一片肥肉是所有油脂的來源，在煮熟的過程中，油脂很均勻的滲入糯米中，這是爽口卻不油膩的竅門。這隻帶著世外清香與無限餘韻的粽子，讓我總是覺得其中有一種幽趣與詩意，頗符合紀念大詩人屈原的情致。（徐國能\
    \ 媽媽的竹葉舟）"
