  type: single
  page: 1
  stem: 「金錢不會改變一切，但一切會在金錢的作用下發生改變。就像風從門縫裡吹進來，看上去，風沒有吹翻屋子裡的什麼，但時間久了， ______。這就是錢的作用。它無孔不入，影響無處不在。它既是溫暖的，又是冷酷的；既是柔軟的，又是堅硬的；它可以拯救，也可以摧毀；可以聚攏，也可以拆散。」（馬德
    對金錢最恰當的態度）根據這段文字，畫線處應填入下列何者？
