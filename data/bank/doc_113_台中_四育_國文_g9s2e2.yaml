  stem: "庚寅冬，予自小港欲入蛟川城，命小奚（１）以木簡束書從。時西日沉山，晚煙縈樹，望程二里許。因問渡者尚可得南門開否。渡者熟視（２）小奚，應曰：「徐行之，尚開也；速進則闔（３）。」予慍為戲。趨（４）行及半，小奚仆，束斷書崩，啼未即起。理書就束而前，門已牡下（５）矣。\n\
    \  予爽然（６），思渡者言近道。天下之以躁急自敗，窮暮而無所歸宿者，其猶是也夫！其猶是也夫！\n                            \
