  type: single
  page: 6
  stem: 關於甲篇中的人物，下列推論何者最恰當？
  options:
  - label: A
    content: 賈充是司馬昭陣營的人馬
  - label: B
    content: 陳泰為了救荀顗而見司馬昭
  - label: C
    content: 司馬昭與陳泰因權臣橫行而對泣
  - label: D
    content: 眾人認為陳泰應比荀顗早一步進宮。
  group_stem: "請閱讀以下短文，並回答44 ～ 45 題：\n 【甲】\n 司馬昭專權，帝欲殺之，反為賈充、成濟所害。昭入殿中，召群臣會議。尚書左僕射陳泰不至，昭使其舅尚書荀顗召之，泰曰：「世之論者以泰方於舅，今舅不如泰也。」子弟內外咸共逼之，乃入，見昭，悲慟，昭亦對之泣曰：「卿何以處我？」泰曰：「獨有斬賈充，少可以謝天下耳。」昭久之曰：「卿更思其次。」泰曰：「惟有進於此，不知其次。」昭乃不復更言。\n\
    （改寫自《資治通鑑•魏紀九》）\n【乙】\n 帝崩，內外喧譁。司馬昭問陳泰曰：「何以靜之？」泰云：「唯殺賈充以謝天下。」昭曰：「可復下此否？」對曰：「但見其上，未見其下。」\
    \ （改寫自《世說新語•方正》）"
