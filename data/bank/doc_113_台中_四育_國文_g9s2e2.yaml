  stem: 根據本文，下列敘述何者正確？
  options:
  - label: A
    content: 羆熊因不如獵犬敏捷，於是遭到撲殺
  - label: B
    content: 作者認為羆熊受制於犬，是遇到強敵
  - label: C
    content: 野豬是眾多猛獸中，爪子最為銳利的
  - label: D
    content: 在晉人眼中，獵犬並非羆熊的對手。
  group_stem: "請閱讀以下短文，並回答32 ～ 33 題：\n 晉人以犬獵，以五犬逐一羆（１）。羆鷙（２）而力，長於用大，所與敵者，皆天下強有力也；犬弱而捷，巧於用小，顧左而右，逐前而後，羆不能搏也。行不數十里，羆憊而後，犬更前而殺之。獸之鷙者，爪莫如虎，齒莫如豕，而羆食之。故稱勇力，必曰羆。羆如受制於犬者，遇非其敵，困於群也。詩云：「憂心悄悄（３），慍於群小。」羆之謂矣。\
