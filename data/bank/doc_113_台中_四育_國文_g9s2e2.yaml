  stem: 「錢，味甘，大熱，有毒。善療飢寒，解困厄之患立驗。能利邦國、汙賢達、畏清廉。貪者服之，以均平為良；如不均平，則冷熱相激，令人霍亂。如積而不散，則有水火盜賊之災生；如散而不積，則有飢寒困厄之患至。若服之非理，則弱志傷神，切須忌之。」（張說
    錢本草）根據這段文字，何者「對於吝嗇之人最具警惕作用」？
  options:
