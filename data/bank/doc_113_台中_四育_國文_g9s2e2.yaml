  stem: 有客語：「馬肝大毒，能殺人，故漢武帝云：『文成食馬肝而死。』」迂公適聞之，發笑曰：「客誑語耳，肝故在馬腹中，馬何以不死曰：「？」客戲馬無百年之壽，以有肝故也。」公大悟，家有畜馬，便刳其肝，馬立斃。公擲刀嘆曰：「信哉，毒也。去之尚不可活，況留肝乎？」根據這則笑話，下列敘述何者正確？
