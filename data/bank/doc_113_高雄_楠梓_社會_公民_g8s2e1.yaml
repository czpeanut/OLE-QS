  section: 1
  number: 7
  type: single
  page: 1
  stem: 平等權是指人民在相同的條件下，皆享有同等的權利並負擔相同的義務。平等權包括形式平等與實質平等，老師請同學舉形式平等的例子，下列哪一位同學的舉例「錯誤」？
