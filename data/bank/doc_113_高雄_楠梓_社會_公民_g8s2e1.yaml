  type: single
  page: 2
  stem: 志明與春嬌是一對新婚夫妻，兩人與建商簽訂契約購買了一棟透天厝，到了交屋時間時，建商卻以各種理由一再拖延，因此向建商要求賠償，但建商卻置之不理，兩人無處可去，只好另行租屋。來到租屋處發現房東隱瞞房子會漏水之事，真是雪上加霜。於是他們決定向法院提出訴訟，要求建商及房東負起法律上的責任。根據上文，下列敘述何者正確？
