  section: 1
  number: 17
  type: single
  page: 2
  stem: 根據上表內容，下列敘述何者正確？
  options:
  - label: A
    content: 梅路用去投票是在行使他的受益權
  - label: B
    content: 四位網友的年齡由小到大依序為曾可蓮、貴菲、慈希、梅路用
  - label: C
    content: 慈希為限制行為能力人
  - label: D
    content: 貴菲應是7歲以上，未滿20歲。
  group_stem: '※活潑的阿鴻IG上有四個網友，他對四人的年齡感到好奇，當他詢問時，四個人的回答如下表，請問：


    | 姓名 | 回答內容 |

    | :--- | :--- |

