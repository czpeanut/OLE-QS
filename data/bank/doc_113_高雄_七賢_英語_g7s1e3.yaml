  stem: What does they mean in the reading?
  options:
  - label: A
    content: Children’s parents.
  - label: B
    content: Students’ teachers.
  - label: C
    content: Books and blackboards.
  - label: D
    content: Boat schools.
  group_stem: 'A.

    In Bangladesh, there is too much rain in some places near the river. When there
    is too much water outside, kids can''t get to school for studying. People worry
    about that and think about some ideas to help children with that. What are the
    ideas?

    Shidhulai Swanivar Sangstha builds special boat schools! These are floating classrooms.
    They travel to different villages to pick up students from Monday to Friday. In
    this way, kids can study all the time. The boat schools are not big. There are
    no swings and slides for kids to play on, but there are books, blackboards, and
    teachers to help them learn. Teachers help kids with their reading and writing.
    Parents can also join in and support their children’s learning. The boat schools
    teach kids about nature, too! Boat schools make learning fun and easy. They help
    every child get a chance to read and write every day!


