- id: doc_113_高雄_七賢_英語_g7s1e3_s5_50
  section: 5
  number: 50
  type: single
  page: 5
  stem: What is wrong about being a good leader in the reading?  wrong 錯誤的
  options:
  - label: A
    content: Let everyone speak and talk about their ideas.
  - label: B
    content: Help, share, and create a good place.
  - label: C
    content: Be happy to see others try hard to do their best.
  - label: D
    content: Only be kind and caring to their friends.
  group_stem: 'B.

    A person can be a leader at any time. What is a leader like? What does a person
    do to be a leader? A leader helps people work together. They make sure everyone
    feels happy and safe. In a classroom, a leader can be a teacher or a student who
    helps others.

    Being a leader is not just about telling people what to do. It is about being
    kind and caring. Good leaders encourage others to do their best. They cheer for
    their friends when they try hard. However, good leaders take care of not only
    their friends but also other people. Good leaders listen to everyone’s ideas.
    They make sure everyone gets a turn to speak. Everyone can be a leader in small
    ways. We can help our classmates, share our toys, and be good friends. Now I guess,
    it is not hard to think about what a bad leader looks like. So please don’t be
    a bad leader when it’s your turn to lead.

    Everyone can be a leader, no matter how big or small! Let’s create a good place
    to learn.


