- id: doc_111_高雄_大灣_國文_g8s2e2_s1_39
  section: 1
  number: 39
  type: single
  page: 8
  stem: 根據上文，文明進入部落與什麼最有關？
  options:
  - label: A
    content: 交通的便利
  - label: B
    content: 外出學子的耳語
  - label: C
    content: 高樓大廈的建造
  - label: D
    content: 電視的出現。
  group_stem: '誰也不知道文明怎麼闖進部落的，總是與十三里外小鎮開來的客運車脫不了關係吧！在外面讀書的孩子開始耳語都市文明的奇異世界，二十層的高樓說得比八雅鞍部山脈還要高，害我們把脖子挺得快到背後；有人看到電視上出現的歌星在都會大廈活生生地演唱，這樣的消息似乎比獵人捕到山豬還令人興奮，雖然大家只是聽說！文明，似乎也真的帶給部落更加遼闊的世界哩！冰箱裡藏著一週前買的豬肉從來也不腐壞，錢幣的妙用帶來更多的享受和方便，大家顯然都在歌頌文明。

    奇怪的是，部落的巴尚‧達努從來並不喜歡文明的奇異。照常還是把斬下的山豬肉醃在竹筒內，像泰雅傳統的老人，津津有味地吃著酸酸的醃肉，每半個月就到八雅鞍部山脈看陷阱，雖然大家不再以欣賞的眼光尊敬獵人的行業，巴尚‧達努依舊把獵得的山肉，分食給親友。上山前必須觀看西麗克鳥的行徑，判定吉凶。雖然不愛看電視，但只要他帶一把番刀和火柴，在森林待多久都餓不死。我們很懷疑他並沒有上過高等教育的學校，卻對森林裡飛禽走獸、一草一木都熟悉得比生物博士還清楚。我們有時依舊愛聽巴尚‧達努的山林奇遇記，但還是忍不住問他：「為什麼還學著老泰雅般的生活？」巴尚‧達努摸摸我們的肩膀回答：「泰雅的孩子從來沒有瘦得像竹子般的手臂。」我們仍然不滿意他的回答。他又說：「孩子，想想看，電動玩具讓你們失去學習爬樹、打獵的時間，電視機慢慢模糊你們對森林的好奇，想想你們的夢想，有了文明並不需要忘了老泰雅啊！」

    啊！想到童年的夢想，似乎是文明的腳步也追不回來的，為什麼二十年後的夢想改變了呢？答案彷彿如疾風的訕笑！

    ──節選、整理自《來到部落的文明》'
