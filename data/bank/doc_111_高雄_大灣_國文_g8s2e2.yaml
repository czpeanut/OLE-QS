  - label: B
    content: 以第一人稱寫自己的見聞和感受外，使用許多第三人稱來表達，使文章顯得活潑熱情
  - label: C
    content: 善用排比，如六個「關心」句、四個「你如愛」，讓文章讀來活潑輕快
  - label: D
    content: 喜用華麗、生僻的詞彙營造詩化的語言，如「萬縷的金輝」、「富麗的溫柔」等。
