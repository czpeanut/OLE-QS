  - label: A
    content: 在飛魚季期間不能捕其他的魚，若網到其他的魚務必放生；而飛魚季之後，若捕到飛魚也要放生。如果你們不遵守規定的話，天神將處罰你們來年沒有飛魚可捕，使你飢餓
  - label: B
    content: 準備考試時，主要讀個大概，理解個七八成。因為不一定要考滿分，錄取資格 70 分，考 70、71 就夠，反正過了就是過了
