- id: doc_111_高雄_大灣_國文_g8s2e2_s1_37
  section: 1
  number: 37
  type: single
  page: 7
  stem: 根據上文，請問AI智慧根據什麼方式來分析一個人的內心狀態？
  options:
  - label: A
    content: 面部表情
  - label: B
    content: 說話速度
  - label: C
    content: 用詞習慣
  - label: D
    content: 以上皆是。
  group_stem: 'AI智慧的「火眼金睛」讀心術

    隨著科技的蓬勃發達，一個人的情緒、個性、參與度、領導力到社交溝通能力，都能夠透過AI智慧計算出來嗎？由清華大學 電機工程學系副教授李祈均所帶領的「BIIC
    LAB」（人類行為訊息暨互動計算實驗室），給予的答案是：YES！

    從一開口說個「嗯」字，你的表情、語調和肢體語言，透過影像拍攝，一言一行、一舉一動都難逃法眼的被記錄成數據。李祈均說：「我們說這個人怪怪的，都是形容詞，形容是無法被量化成數據的，但我們現在可以將討論講話次數、肢體互動、臉部表情變化量化。」看似簡單，其實複雜，因為要從一個人的行為訊號，來看出內心狀態，再根據管理學來做歸納分析，說白了就是「讀心術」理論化的體現，希望藉此打造臺灣自己的「情緒資料庫」。以下為AI製作個性報表（吳志華實測案例展現）


    | 社交能力（最高 5 分） | 項目 | 外向性 | 經驗開放性 | 情緒不穩性 | 盡責性 | 親和力 |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | | 分數 | 2 | 1 | 2 | 2 | 4 |

    | 個性（最高 5 分） | 項目 | 領導能力 | 強勢程度 | 親和力 | 積極度 | 競爭程度 |

    | | 分數 | 1 | 3.5 | 1 | 0.5 | 1 |

    | 表達能力 | 項目 | 插話次數 | 接話次數 | 被接話次數 | 根據管理學，插話次數達 22 次，在個性上顯得較強勢 |

    | | 次數 | 22 | 0 | 1 | |


    ※註：分數愈高，代表愈符合該項目之社交能力或個性；分數愈低，代表愈不符合該項目之社交能力或個性。

    每次的點頭、插話次數，背後都有意義，將這些互動行為，全部化作數據，成為個性分析的依據，並進行判讀，其中最困難的的點在於，在數據分析時，資料取得很多，但卻不一致，仍有可能導致最後錯誤的抉擇。'
