    content: 老鷹把跑得慢的鷓鴣抓走，跑得慢的鷓鴣就沒有機會生下和牠一樣跑不快的鷓鴣核子。老鷹也抓田鼠，這樣就不會有太多的鷓鴣蛋被田鼠偷吃。
