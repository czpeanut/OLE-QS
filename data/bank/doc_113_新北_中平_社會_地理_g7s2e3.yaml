- id: doc_113_新北_中平_社會_地理_g7s2e3_s1_48
  section: 1
  number: 48
  type: single
  page: 2
  stem: 請問，第一段的『            』內最適合填入下列哪一項？
  options:
  - label: A
    content: 城鄉發展不均
  - label: B
    content: 環境污染嚴重
  - label: C
    content: 農產品生產過剩
  - label: D
    content: 國際貿易逆差
  group_stem: "◎根據文章內容回答48 題至50 題(素養題)\n地方創生的定義是什麼？\n    「地方創生」的英文為Regional Revitalization，原來是日文漢字，是因應總人口減少、人口過度集中東京、地方經濟衰退等問題，由日本政府主導的一系列地域活性化政策。日本政府公布施行《城鎮、人、工作創生法》（まち・ひと・しごと創生法），並在實務面上，創造就業機會、推廣移居、支援年輕世代結婚及育兒等，希望幫助地方結合地理特色及人文風情，發展出最合適的特色產業及生活圈，讓青年回流、趨緩人口問題。希望地方發揮特色、並發展出最適合的在地經濟，讓人們不一定非得要在都市工作，能夠選擇其他鄉鎮或回到自己的故鄉，以改善『\
    \            』問題。\n    2020 年台灣人口首度出現負成長，死亡人數大於出生人數，根據內政部戶政司統計，2020 年僅有約16.5 萬人出生；而台灣目前已是「高齡社會」，預估2026\
    \ 年將成為「超高齡社會」。此外，目前六都人口占總人口比率約 7 成，青壯年人口不斷流往大都市，鄉村產業勞動力不足，城鄉差距逐漸擴大。\n    行政院將2019\
    \ 年宣誓為「台灣地方創生元年」，核定地方創生國家戰略計畫，透過提升在地文化、與新創結合、依地方特色發展產業、創造就業機會等方式，來緩和城鄉人口不均。\n\
    《天下雜誌・微笑台灣》"
