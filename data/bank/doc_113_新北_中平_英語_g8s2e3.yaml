  stem: What did people use to record information in ancient times?
  options:
  - label: A
    content: Paper made from wood pulp.
  - label: B
    content: Plastic and glass.
  - label: C
    content: Stone, bones, or bamboo.
  - label: D
    content: Metal and leather.
  group_stem: "(四)\n     In ancient times, people recorded information on materials\
    \ like stone, bones, or bamboo. These were strong but heavy and \ndifficult to\
    \ carry. Later, Egyptians began using papyrus plants to make an early form of\
    \ paper, which was lighter and easier to \nwrite on. In China, people improved\
    \ this idea by creating paper from mulberry bark and other plant fibers. Their\
    \ paper was thin, \nlight, and much more practical. \n     Over time, the skill\
    \ of making paper spread to the Islamic world and eventually to Europe. The invention\
    \ of the printing \npress in 1440 greatly increased the use of paper, especially\
    \ for books and education. Today, most paper is produced by machines \nusing wood\
    \ pulp. Although digital tools are common, paper still plays an important role\
    \ in daily life.\n       ancient 古代的material 物質bones 骨bamboo 竹Egyptian 古埃及papyrus\
    \ 紙草China 中國\n  \n mulberry bark 桑樹皮fiber 纖維spread 傳播Islamic world 伊斯蘭世界Europe\
    \ 歐洲\n         printing press 印刷機increase 增加produce 生產wood pulp 木漿digital tool\
    \ 數位工具"
