  type: single
  page: 2
  stem: 清末「殺豬斬羊圖」採用升堂問斬的題材，以豬代替「主」，稱天主教為「豬叫」，羊代表「洋人」，書中描繪了天主教以及傳教士在中國所犯下的種種的、「罪惡」等觀念。意圖明晰且通俗易懂，以此判斷，這幅漫畫的主旨，最接近下列何者？
