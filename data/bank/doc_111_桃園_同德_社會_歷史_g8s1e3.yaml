  type: single
  page: 2
  stem: 「科舉制度」是最為公平，也是歷時最久的選才制度，雖然這種辦法在清廷覆亡前正式廢除，不過，中華民國的政治分權採取五權分立，有別於西方三權分立，將考試權獨立出來，仍屬於科舉選才傳統的延伸。請問「科舉制度」在哪場改革中廢除？
