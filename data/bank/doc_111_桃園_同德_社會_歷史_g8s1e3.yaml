  section: 1
  number: 35
  type: single
  page: 2
  stem: '竹枝詞是中國一種詩體，取材包括民間風俗、城鄉生活等，成為研究社會現象的重要資料。右方是一首描述「上海」的竹枝詞，根據內容判斷，這首的創作的背景為何？


    電燈地火照更深，海市居然不夜城。

    四達通衢同白晝，紅男綠女逐宵行。

    雄開南北兩陽關，貨物雲屯積似山。

    萬國通商輸稅餉，滬江財富甲瀛寰。'
  options:
  - label: A
    content: 乾隆年間，上海因對外開放而公行林立。
  - label: B
    content: 自強運動時，特別重視電燈等基礎建設。
  - label: C
    content: 鴉片戰後，租界成為西方新事物的櫥窗。
  - label: D
    content: 戊戌變法廢除坊市制度，夜市逐漸興起。
