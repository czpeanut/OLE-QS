  section: 1
  number: 21
  type: single
  page: 1
  stem: 西方思想家馬克思曾說：當隔絕中的中國被迫面對世界時，如同「小心保存在密閉棺材裡的木乃伊一接觸新鮮空氣便必然要解體一樣。」文中「接觸到新鮮空氣」是指打破閉關自守局勢的哪一場戰爭？
