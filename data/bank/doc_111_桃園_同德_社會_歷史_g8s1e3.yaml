  section: 1
  number: 30
  type: single
  page: 1
  stem: 有位史學家說：「全國讀書人都覺得前功盡棄。他們費了多少心血，想從之乎者也裡面，升官發財，一旦廢八股，他們絕望，難怪他們罵康有為是洋奴漢奸。至於被裁的官員，更不要說，無不切齒痛恨。」這位史學家所敘述的是清末哪項改革運動？
