  section: 1
  number: 33
  type: single
  page: 2
  stem: 《孽海花》是清末民初的小說，其中有一段描述洋人軍隊進入北京城，清帝、太后西逃西安，命大臣李鴻章負責議和，李鴻章遂求助於名妓賽金花，使其向德軍統帥瓦德西疏通，終使條約的簽訂問題順利解決。但是，條約的內容竟讓中國賠款四億五千萬兩銀子，而且要分
    39 年才能付清，創下清末賠款最高的紀錄。請問，上文所述《孽海花》是以哪一個條約作為小說背景？
