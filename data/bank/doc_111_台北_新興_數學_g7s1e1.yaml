  stem: '從2009 年3 月起，臺灣護照持有人可以旅遊、探親、學生或商務訪客身分免簽證入境英國，最長不超過六個月。小瑛覺得現在遊英國正是好時機，於是她計畫前往找在倫敦工作的男朋友大偉，體貼的大偉怕小瑛不適應倫敦的天氣，因此提供了一份這星期倫敦地區每日的平均最高溫和最低溫
