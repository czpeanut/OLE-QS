- id: doc_113_新北_中平_國文_g8s2e2_s5_4
  section: 5
  number: 4
  type: single
  page: 4
  stem: 關於陸游〈釵頭鳳〉中的詞句意涵，何者表達正確？
  options:
  - label: A
    content: 「東風惡，歡情薄」：東風險惡吹散姻緣，以春和樂景寫哀，更見作者傷心寂寥
  - label: B
    content: 「一懷愁緒，幾年離索」：滿腔哀愁，在年歲銷磨中已漸漸消散
  - label: C
    content: 「山盟雖在，錦書難託」：誓言尚在，只能託付書信給彼此留念
  - label: D
    content: 「……錯錯錯……莫莫莫」：再次重逢已如陌路，切莫再藕斷絲連。
  group_stem: '乙、〈陸游與唐琬〉

    　　陸游和表妹唐琬從小青梅竹馬，對詩詞和文學都有研究。陸游二十歲時娶唐琬為妻，鶼鰈情深生活美滿。可是陸游的母親對媳婦非常不滿，逼迫陸游離婚。離婚後的唐琬，被迫改嫁給同郡的趙士程，而陸游則奉母命另娶王氏為妻。

    　　被強迫拆散的陸游甚是感傷，常自嘆與唐琬的婚姻太短暫。十年後，陸游到山陰的沈家花園玩賞，恰好遇見唐琬和趙士程也在遊園。唐琬得到趙士程同意為陸游送酒菜致意，陸游見到久別的唐琬，不禁悲從中來，將酒一飲而盡，並在沈園牆上題了一首令人鼻酸的〈釵頭鳳〉。一年後，唐琬在沈園看到，也和了一首〈釵頭鳳〉。回去之後唐琬抑鬱寡歡，沒多久就去世了。陸游直到老年，還念念不忘這段姻緣，數次前往當年相逢的沈家花園緬懷故人，對命運不勝唏噓。


    | 〈釵頭鳳　陸游〉 | 〈釵頭鳳　唐琬〉 |

    | :--- | :--- |

    | 紅酥手，黃縢酒，滿城春色宮牆柳。<br>東風惡，歡情薄。一懷愁緒，幾年離索。錯、錯、錯。<br>春如舊，人空瘦，淚痕紅浥鮫綃透。<br>桃花落，閒池閣。山盟雖在，錦書難託。莫、莫、莫！
    | 世情薄，人情惡，雨送黃昏花易落。<br>曉風乾，淚痕殘。欲箋心事，獨語斜闌。難，難，難！<br>人成各，今非昨，病魂常似鞦韆索。<br>角聲寒，夜闌珊。怕人尋問，咽淚裝歡。瞞，瞞，瞞！
    |'
