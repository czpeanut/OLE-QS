- id: doc_113_新北_中平_國文_g8s2e2_s5_1
  section: 5
  number: 1
  type: single
  page: 3
  stem: 「輕輕的我走了，正如我輕輕的來；我輕輕的招手，作別西天的雲彩。」表達了徐志摩什麼樣的心情？
  options:
  - label: A
    content: 故作瀟灑，實為不捨
  - label: B
    content: 滿心歡喜，迫不及待
  - label: C
    content: 雲水自在，物我兩忘
  - label: D
    content: 不念舊惡，怨是用希。
  group_stem: '甲、〈再別康橋　徐志摩〉

    輕輕的我走了，正如我輕輕的來；我輕輕的招手，作別西天的雲彩。

    那河畔的金柳，是夕陽中的新娘；波光裡的艷影，在我的心頭蕩漾。

    軟泥上的青荇，油油的在水底招搖：在康河的柔波裡，我甘心做一條水草！

    那榆蔭下的一潭，不是清泉，是天上虹；揉碎在浮藻間，沉澱著彩虹似的夢。

    尋夢？撐一支長篙，向青草更青處漫溯，滿載一船星輝，在星輝斑爛裡放歌。

    但我不能放歌，悄悄是別離的笙簫；夏蟲也為我沉默，沉默是今晚的康橋！

    悄悄的我走了，正如我悄悄的來；我揮一揮衣袖，不帶走一片雲彩。'
  lesson_raw:
    title: 再別康橋
    basis: 引述徐志摩〈再別康橋〉
