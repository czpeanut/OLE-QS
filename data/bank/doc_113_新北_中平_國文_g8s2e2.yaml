- id: doc_113_新北_中平_國文_g8s2e2_s5_7
  section: 5
  number: 7
  type: single
  page: 4
  stem: 從精衛鳥的文章所述來看，下列選項何者有誤？
  options:
  - label: A
    content: 「名曰精衛，其鳴自詨」：精衛鳥的叫聲，就像在呼叫自己的名字
  - label: B
    content: 「遊于東海，溺而不返」：炎帝的小女兒在東海沉溺於玩樂，流連忘返
  - label: C
    content: 「常銜西山之木石，以堙于東海」：經常叼著西山的樹枝石塊，用來填塞東海
  - label: D
    content: 「漳水出焉，東流注于河」：漳河發源於發鳩山，向東流去注入黃河。
  group_stem: '丙、〈山海經二篇　佚名〉

    　　又北二百里，曰發鳩之山，其上多柘木。有鳥焉，其狀如烏，文首、白喙、赤足，名曰精衛，其鳴自詨。是炎帝之少女，名曰女娃，女娃遊于東海，溺而不返，故為精衛，常銜西山之木石，以堙于東海。漳水出焉，東流注于河。

    柘木：ㄓㄜˋ，桑樹。　詨：ㄐㄧㄠˋ，呼叫。　炎帝之少女：炎帝的小女兒。　堙：填塞。


    　　夸父與日逐走，入日；渴，欲得飲，飲於河、渭；河、渭不足，北飲大澤。未至，道渴而死。棄其杖，化爲鄧林。

    入日：追到太陽落下的地方。　河、渭：黃河、渭水。　鄧林：桃林。'
