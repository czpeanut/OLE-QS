- id: doc_113_新北_中平_國文_g8s2e2_s5_13
  section: 5
  number: 13
  type: single
  page: 6
  stem: 根據文中所述，下列敘述何者不是作者用來比喻外籍看護的事物？
  options:
  - label: A
    content: 像答錄機或接線生之類，常被人忽視的存在
  - label: B
    content: 在湖畔的微風裡彷彿一排陽臺上安靜晒太陽的盆栽
  - label: C
    content: 跟在病人身後照料，像母親一般
  - label: D
    content: 彷彿是病房中一抹淡淡的異國香水。
  group_stem: '戊、〈懷恩文學獎學生組首獎  劉峻豪〉

    　　來咳！用力咳！接著是一連串急促的拍背聲。砰砰砰砰，砰砰砰砰。只開床頭小燈的病房內傳出規律而響亮的鼓點，在左肺拍完之後節奏稍歇，中間插入一小段翻身時布料摩擦床單的即興演奏，然後鼓聲趕上兩步，重新搶回主旋律。

    　　砰砰砰砰，咳咳，砰砰砰砰，咳────咳咳。拍痰聲與偶爾虛弱的咳嗽此起彼落，這是病房內常見的音樂會，像是部落祈神時的舞蹈，在火堆旁擊打胸膛，最原始的肢體碰撞，希望透過靈魂與肉體的撞擊，能夠逼出體內帶來厄運與災禍的鬼神。

    　　那些隱晦黏稠、散發著惡臭的，痰。

    　　拍痰是臥床病人長期照護的重點之一。死水般的分泌物窩居在幽暗的細支氣管內，日日夜夜蔓結蛛網，在病人的胸腔中 形成聚落，張牙舞爪地伸出觸手往外擴展。堆積的痰液又常是細菌的溫床，日久如滋生蚊蟲的池水，在Ｘ光片星空般的底色下爆出片片斑斕的肺炎之花。

    　　拍痰原多是看照的家屬輪班完成的，而許多人與其被打亂整個家族的生活步調，寧可找醫師開紙證明請個外籍看護代勞。也因此在醫院日日查房，可以看到除了病情進程之外的人情進展；從一開始擠滿張揚的水果花籃與噓寒問暖（但根本只有婚喪喜慶才會見面）的遠房親戚，幾個禮拜後只剩媳婦、女兒相陪，到最後連家屬都很少出現了，留了一個外籍看護。

    　　每一個病弱的老人，幾乎身旁都有一位黝黑的外籍看護。大眼、微胖，略捲的黑髮。我總是無法區分她們到底來自菲律賓、印尼，還是其他東南亞國家，只知道她們大多羞怯而細心，且總是把身形藏在陰影裡，彷彿她們只是病房中一抹淡淡的異國香水，沒有實質地位。而早起查房時會遇到的人卻總是她們。主治醫師拉開簾子，讓一聲爽朗的早安與晨間淡淡的陽光一股腦兒倒進病榻上，會問正睡眼惺忪從一旁陪客椅上掙扎著爬起來的她們說：阿公昨天吃得怎麼樣啊？有沒有帶他們出去走走？

    　　除此之外她們很少說話，一部分是因為中文還不太好，另外也是她們總被定位為家屬與醫師之間，像答錄機或接線生之類，常被人忽視的存在。醫師要解釋病情的時候，她會慌亂地拿出手機，小小聲地用不流暢的中文打給她的老闆，然後將手機交給醫師。

    　　在某些晴朗的黃昏，醫院外的湖邊常常聚集著還能坐輪椅出來的老人。在這治療都已結束，卻還不必急著回病房的時刻，常常可以看到湖畔輪椅排排坐晒太陽，上面癱著面無表情的病人，像是晴天時從櫥櫃深處拖出來晾的冬天厚棉被，散發著霉味與溼氣，他們身後母親般的外籍看護則把握一天中難得的悠閒時光，與同鄉用流暢的母語談笑，完全不似在病房時的那種緊張羞怯。

    　　偶爾下班時經過湖邊，黃昏金黃色的靜謐時光，老人們吊著點滴，或插鼻胃管，或做氣切，在湖畔的微風裡彷彿一排陽臺上安靜晒太陽的盆栽。他們的外籍看護就站在身後聊天，陽光斜斜打在她們臉上，深邃五官映出堅毅的影子，而她們臉上線條和緩，這是一天之中，難得不用拍痰、灌食或更換尿布的悠閒時光。

    　　她們喉中也卡著痰。她們遠渡異國，含著那塊濃痰，口音混濁地學習陌生的語言，手忙腳亂做醫師與家屬之間的橋梁，每天在醫院裡替另一個痰聲隆隆的老人拍背，過著呼吸少少新鮮空氣的生活。卻沒有人想要幫她們化痰。

    　　在這間醫學知識建構出來無比繁複的醫院裡，病床旁邊的醫師與家屬來去匆匆，留下床上的病人與他們的外籍看護，默默地在剩餘的緩慢時光中拍痰。比起醫護人員，只會拍痰的她們懂得最少，卻也懂得最多。'
