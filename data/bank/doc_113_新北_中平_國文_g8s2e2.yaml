- id: doc_113_新北_中平_國文_g8s2e2_s3_1
  section: 3
  number: 1
  type: fill
  page: 1
  stem: 〈我所知道的康橋〉一文，描會康橋春天的風光，傾刻萬變的晨景，冉冉炊煙、爛縵春光、消遙野遊，以及黃昏時的萬縷金揮，皆是作者視野所及、足跡所至，令其無比倦戀之美景。
  lesson_raw:
    title: 我所知道的康橋
    basis: 題目引述〈我所知道的康橋〉課文內容背景
- id: doc_113_新北_中平_國文_g8s2e2_s4_1
  section: 4
  number: 1
  type: single
  page: 1
  stem: 「摹寫」可分為視覺、聽覺、味覺、嗅覺、觸覺。〈我所知道的康橋〉一文中，將「冉冉上升的炊煙」譬喻成「翳入天聽的祈禱」，是以聽覺寫視覺，請問下列文句何者使用的表現方式一樣？
  options:
  - label: A
    content: 從窗外望出去，嘩啦嘩啦的陽光，灑在一望無際的蒼綠草原上
  - label: B
    content: 微風過處，送來縷縷清香，彷彿遠處高樓上渺茫的歌聲似的
  - label: C
    content: 呼嘯的摩托車聲劃過寧靜的黑夜，尖銳地在我耳膜上劃出一道傷口
  - label: D
    content: 聽她唱完這首歌，我五臟六腑裡像熨斗熨過，無一處不服貼，三萬六千個毛孔，像吃了人參果，無一個毛孔不暢快
  lesson_raw:
    title: 我所知道的康橋
    basis: 題幹引述〈我所知道的康橋〉文句
- id: doc_113_新北_中平_國文_g8s2e2_s4_2
  section: 4
  number: 2
  type: single
  page: 1
  stem: "「一大片望不到頭的草原，滿開著豔紅的罌粟，在青草裡亭亭地像是萬盞的金燈。」這段文字所呈現出的美感，與下列何者最相近？\n(甲)大海萬頃的波浪，戴著各式的白帽，在日光裡動盪著，起落著\n\
    (乙)葉子出水很高，像亭亭的舞女的裙，層層的葉子中間，零星的點綴著些白花 \n(丙)阿里山磅礡的雲海飄散於山巒之間，翻騰起伏，瞬息萬變，每一分每一秒都有不同的感動，有如置身蓬萊仙島\n\
    (丁)吹面不寒楊柳風，像母親的手撫摸着你"
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 甲丙
  - label: D
    content: 丙丁
  lesson_raw:
    title: 我所知道的康橋
    basis: 題幹引述〈我所知道的康橋〉課文
- id: doc_113_新北_中平_國文_g8s2e2_s4_3
  section: 4
  number: 3
  type: single
  page: 1
  stem: 「怯怜怜的小雪球是探春信的小使，鈴蘭與香草是歡喜的初聲，窈窕的蓮馨、玲瓏的石水仙、愛熱鬧的克羅克斯、耐辛苦的蒲公英與雛菊――這時候春光已是爛縵在人間，更不須殷勤問訊。」這段文字給人的印象最接近下列何者？
  options:
  - label: A
    content: 風和日麗，心曠神怡
  - label: B
    content: 百花盛開，春滿人間
  - label: C
    content: 人花交映，彼此憐惜
  - label: D
    content: 韶光易逝，把握當下
  lesson_raw:
    title: 我所知道的康橋
    basis: 題幹引述〈我所知道的康橋〉課文
- id: doc_113_新北_中平_國文_g8s2e2_s4_4
  section: 4
  number: 4
  type: single
  page: 1
  stem: 〈我所知道的康橋〉一文中，「你如愛花，這裡多的是錦繡似的草原。你如愛鳥，這裡多的是巧囀的鳴禽。你如愛兒童，這鄉間到處是可親的稚子。你如愛人情，這裡多的是不嫌遠客的鄉人，你到處可以掛單借宿，有酪漿與嫩薯供你飽餐」。請問下列敘述何者為非？
  options:
  - label: A
    content: 描寫康橋的人情之美
  - label: B
    content: 「你」指讀者，作者迫不及待想介紹人們去體驗
  - label: C
    content: 康橋秋季豐收的盛況
  - label: D
    content: 作者眉飛色舞，充滿熱情
  lesson_raw:
    title: 我所知道的康橋
    basis: 題幹提及〈我所知道的康橋〉
- id: doc_113_新北_中平_國文_g8s2e2_s4_5
  section: 4
  number: 5
  type: single
  page: 1
  stem: 〈我所知道的康橋〉一文中，引用陸放翁詩句：「傳呼快馬迎新月，卻上輕輿趁晚涼。」意思為何？
  options:
  - label: A
    content: 刻畫做地方官的辛苦
  - label: B
    content: 形容乘坐轎子夜晚賞月的閒適
  - label: C
    content: 詩人不喜歡騎馬而選擇乘轎
  - label: D
    content: 作者在康橋雖不騎馬坐轎，卻有騎自行車追逐夕陽的經驗
  lesson_raw:
    title: 我所知道的康橋
    basis: 題幹提及〈我所知道的康橋〉
- id: doc_113_新北_中平_國文_g8s2e2_s4_6
  section: 4
  number: 6
  type: single
  page: 1
  stem: 根據〈我所知道的康橋〉一文，下列配對何者正確？
  options:
  - label: A
    content: 滿開著豔紅的罌粟，在青草裡亭亭地像是萬盞的金燈／日出之美
  - label: B
    content: 嫵媚的康河也望不見蹤跡，你只能循著那錦帶似的林木想像那一流清淺／平坦原野
  - label: C
    content: 彷彿是朝來人們的祈禱，參差地翳入了天聽／朝霧上升
  - label: D
    content: 怯怜怜的小雪球是探春信的小使／河畔風光。
  lesson_raw:
    title: 我所知道的康橋
    basis: 題幹提及〈我所知道的康橋〉
- id: doc_113_新北_中平_國文_g8s2e2_s4_7
  section: 4
  number: 7
  type: single
  page: 2
  stem: 下列文句「 」中的詞語，何者運用正確？
  options:
  - label: A
    content: 您滑雪的技能，讓「閣下」讚嘆不已
  - label: B
    content: 「在下」說話不知輕重，請大家多包涵。承蒙招待，改日再訪貴府
  - label: C
    content: 主席在會議的結語：感謝各位提供的「淺見」，我們會審慎評估
  - label: D
    content: 對宴會的主人說：謝謝你準備的「薄酌」，讓大家非常滿足。
- id: doc_113_新北_中平_國文_g8s2e2_s4_8
  section: 4
  number: 8
  type: single
  page: 2
  stem: 下列選項「　」中的字，何者意思前後相同？
  options:
  - label: A
    content: 廷尉乃當「之」罰金」／今法如此而更重「之」
  - label: B
    content: 廷尉奏「當」／廷尉「當」是也
  - label: C
    content: 「唯」陛下察之／「唯」你是問
  - label: D
    content: 天下之「平」／譬如「平」地。
  lesson_raw:
    title: 張釋之執法
    basis: 引述〈張釋之執法〉課文句子
- id: doc_113_新北_中平_國文_g8s2e2_s4_9
  section: 4
  number: 9
  type: single
  page: 2
  stem: 〈張釋之執法〉一文中「而廷尉乃當之罰金！」這句話表現出文帝的憤怒不滿。下列文句何者語氣最相近？
  options:
  - label: A
    content: 聽好，你的家政報告必須在放學之前交給我
  - label: B
    content: 我已經說過很多次，你竟然還是屢勸不聽！
  - label: C
    content: 你在這裡要小心，別惹人說閒話
  - label: D
    content: 假如你段考前完整複習，就不至於考後懊悔。
  lesson_raw:
    title: 張釋之執法
    basis: 題幹提及〈張釋之執法〉
- id: doc_113_新北_中平_國文_g8s2e2_s4_10
  section: 4
  number: 10
  type: single
  page: 2
  stem: 「法者，天子所與天下公共也。」這句話的含義，與下列何者最相近？
  options:
  - label: A
    content: 嚴刑峻法，富國強兵
  - label: B
    content: 以牙還牙，以眼還眼
  - label: C
    content: 王子犯法與庶民同罪
  - label: D
    content: 沒有規矩，不能成方圓。
  lesson_raw:
    title: 張釋之執法
    basis: 題幹引述〈張釋之執法〉名句
- id: doc_113_新北_中平_國文_g8s2e2_s4_11
  section: 4
  number: 11
  type: single
  page: 2
  stem: 「廷尉，天下之平也，一傾而天下用法皆為輕重，民安所錯其手足？」這段話強調司法人員應該秉持何種執法態度？
  options:
  - label: A
    content: 謙沖自牧
  - label: B
    content: 守正不阿
  - label: C
    content: 從寬發落
  - label: D
    content: 徇私偏袒。
  lesson_raw:
    title: 張釋之執法
    basis: 題幹引述〈張釋之執法〉課文
- id: doc_113_新北_中平_國文_g8s2e2_s4_12
  section: 4
  number: 12
  type: single
  page: 2
  stem: 關於《史記》的說明，下列何者正確？
  options:
  - label: A
    content: 作者為司馬光，西漢人，曾任太史令
  - label: B
    content: 中國第一部編年體史書
  - label: C
    content: 中國第一部斷代史
  - label: D
    content: 除了史實的記載外，書中更加強了對人物的描寫。
- id: doc_113_新北_中平_國文_g8s2e2_s4_13
  section: 4
  number: 13
  type: single
  page: 2
  stem: 根據〈張釋之執法〉一文，下列敘述何者正確？
  options:
  - label: A
    content: 犯人在答話時，語氣短促，態度從容，不慌不忙
  - label: B
    content: 「是法不信於民也」指所有的法律依舊被人民信任
  - label: C
    content: 文帝不滿意張釋之的判決，決定立刻誅殺犯人
  - label: D
    content: 文帝最後從善如流，接受了張釋之的判決。
  lesson_raw:
    title: 張釋之執法
    basis: 題幹提及〈張釋之執法〉
- id: doc_113_新北_中平_國文_g8s2e2_s4_14
  section: 4
  number: 14
  type: single
  page: 2
  stem: 根據〈罐頭由來〉一文，下列何者為罐頭具備的優點？
  options:
  - label: A
    content: 玻璃瓶裝，輕巧耐撞
  - label: B
    content: 擁有專利，價格昂貴
  - label: C
    content: 保存容易，經濟實惠
  - label: D
    content: 營養豐富，可完全取代鮮食。
- id: doc_113_新北_中平_國文_g8s2e2_s4_15
  section: 4
  number: 15
  type: single
  page: 2
  stem: 「近代工業發展多先從輕工業做起，食品加工與紡織業算是兩個先行指標，逐漸帶動各種產業的發展。罐頭雖屬食品工業，起初的發展卻不見循此路徑，倒是與軍需工業有關。」這段文字主要在說明下列何者？
  options:
  - label: A
    content: 罐頭發展的緣起
  - label: B
    content: 罐頭對食品工業的貢獻
  - label: C
    content: 罐頭在輕工業的重要地位
  - label: D
    content: 罐頭改變人們的飲食習慣。
- id: doc_113_新北_中平_國文_g8s2e2_s4_16
  section: 4
  number: 16
  type: single
  page: 2
  stem: 「罐頭發展初期，售價不菲，也經常有中毒的意外事件傳出，社會大眾普遍不接受這種新式飲食，只有軍隊或是行旅才會購買，還得冒著生命危險。」根據這段文字，下列何者不是罐頭未被社會大眾接受的原因？
  options:
  - label: A
    content: 罐頭產品價格不便宜
  - label: B
    content: 罐頭產品品質欠佳
  - label: C
    content: 罐頭產品有衛生疑慮
  - label: D
    content: 罐頭產量僅夠供應軍隊或行旅。
- id: doc_113_新北_中平_國文_g8s2e2_s4_17
  section: 4
  number: 17
  type: single
  page: 2
  stem: '根據〈罐頭由來〉一文，罐頭的發展演進，何者為非？


    | | 項　目 | 發展前期 | 發展後期 |

    | :--- | :--- | :--- | :--- |

    |'
  options:
  - label: A
    content: '| 罐頭材質 | 玻璃瓶 | 鐵皮罐 |

      |'
  - label: B
