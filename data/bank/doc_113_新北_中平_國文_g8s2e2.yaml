  number: 10
  type: single
  page: 5
  stem: 依照文章所言，文帝原本想要如何處罰偷盜高祖宗廟玉環的犯人？
  options:
  - label: A
    content: 死刑棄市
  - label: B
    content: 欲致之族
  - label: C
    content: 逆順為差
  - label: D
    content: 赦宥其刑。
  group_stem: '丁、〈節錄張釋之馮唐列傳　司馬遷〉

    　　其後有人盜高廟座前玉環，捕得，文帝怒，下廷尉治。釋之按律盜宗廟服御物者為奏，奏當棄市。上大怒曰：「人之無道，乃盜先帝廟器，吾屬廷尉者，欲致之族，而君以法奏之，非吾所以共承宗廟意也。」釋之免冠頓首謝曰：「法如是足也。且罪等，然以逆順為差。今盜宗廟器而族之，有如萬分之一，假令愚民取長陵一抔土，陛下何以加其法乎？」久之，文帝與太后言之，乃許廷尉當。是時，中尉條侯周亞夫與梁相山都侯王恬開見釋之持議平，乃結為親友。張廷尉由此天下稱之。　　　棄市：死刑。　族：滅族。　　免冠頓首：脫帽叩頭。　一抔土：ㄆㄡˊ一捧土，很少。'
