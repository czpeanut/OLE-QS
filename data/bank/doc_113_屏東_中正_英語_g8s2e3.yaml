  - label: C
    content: Julie is left-eared, but right-eyed.
  - label: D
    content: One of them is left-handed.
  group_stem: "(三) \n    Most people write with their right hand and might also draw\
    \ pictures, throw a ball, or hold a spoon with the same hand.  \nHowever, some\
    \ people are left-handed.  Do you know our body is lopsided(不平衡的) in other ways,\
    \ too?  Studies show that \naround 40% of us are left-eared, 30% are left-eyed,\
    \ and 20% are left-footed.  But only 10% are left-handed. \n    Here are some\
    \ easy tests to find out how we naturally use eyes, ears, and feet. \nTest1: Write\
    \ your name on a piece of paper.  Which hand do you use? \nTest2: Choose a tree\
    \ far in front of you.  First, make a triangle(三角形).  Then close each eye in turn.\
    \  The eye that shows \nthe same view as the one you see with both eyes is your\
    \ stronger eye. \nTest3: Place a coin(硬幣) in front of you.  Then stand on the\
    \ coin.  Which foot do you use to stand on it? \nTest4: Ask someone to call you.\
    \  Which ear do you use to “listen”? \nTest5: Cut a piece of paper with a pair\
    \ of scissors(剪刀). Which hand do you hold the scissors when cutting the paper?\
    \ \nTest6: Stand at the bottom of stairs and begin to walk up the stairs.  Notice\
    \ which foot lands on the stairs first. \nTest7: Stand close to some and cover\
    \ each ear in turn with a paper cup.  Which ear hears more clearly when that person\
    \ is \ntalking? \nTest8: Ask someone to stand on the other side of the wall and\
    \ ask that person to talk to you.   Which ear do you put to the \nwall first?"
  tags:
    textbook: 第四冊（八下）第3次段考範圍
    labeled_by: ai
