  group_stem: "(二) \n    What do you think when it comes to Germans(德國人)?  Most people\
    \ think they are very serious and not funny.  While \nthat may be true, the German\
    \ language(語言) can be really fun when you translate(翻譯) it into English!  Here\
    \ are some \nexamples of interesting German words. \n●Kummerspeck \n    The word\
    \ “Kummerspeck” means “sad bacon(培根)” when it is translated into English, but\
    \ that does not make sense(有\n道理).  This word means the weight gained from overeating\
    \ because of sadness.  It is very normal for us to eat more when \nwe are down,\
    \ isn’t it? \n●Du bist das Gelbe vom Ei \n    This is the German way of saying\
    \ “You are the apple of my eye.”  But instead of apples, Germans like “the yolk(蛋黃)\
    \ \nof my egg” to tell that you are very important to them.  If one day someone\
    \ tells you that you are the yolk of his egg, don’t \nlook to surprised.  You\
    \ should be very happy! \n●Schnappsidee \n    This word “Schnappsidee” means “crazy\
    \ idea” when it is translated into English.  It is used to show an idea that you\
    \ \ndecide quickly without thinking and is often a stupid one.  Think carefully\
    \ before acting because a Schnappsidee will often \nlead to crazy thing!"
