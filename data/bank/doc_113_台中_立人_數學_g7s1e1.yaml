  stem: 請問點$A$和點$B$之間的距離為____(9)____
  group_stem: '<<素養題組>>

    溪口轟炸機是一位數學老師，他最喜歡用生活中的例子教女兒小彤數學。有一天，兩人一起去公園散步，途中發現公園前的廁所正在施工，無法通過。

    溪口轟炸機靈機一動，把這當成一個數學題目。他說:「我們現在站在數線上$A(-4)$的位置，而廁所在數線上$B(400)$的位置。我們需要知道這兩點之間的距離。你能用絕對值幫我算一下這段距離嗎?」小彤馬上說:「這就是簡單的數線問題!
    然後她順利算出答案。」

    溪口轟炸機點頭稱讚，於是又出了一道更複雜的題目:「假設我們從$A(-4)$要到$A$、$B$間的$C$涼亭，需要把$A$的數字加上6，但會經過有1個陽光照射的地方，這時我們就需要把整個算式7次方，才能算出$C$的位置。你能幫我用科學記號把答案寫出來嗎?」小彤這時若有所思地看著爸爸，不發一語…突然有點不想走路了，覺得來公園散步好累。

    <<你能幫助溪口轟炸機和小彤解開這些數學挑戰嗎?>>'
