    清乾隆五十一年（西元1786 年），臺灣發生甲事件。該事件是清代臺灣規模最大的民變，清廷派福康安率水師由福建崇武澳渡海來臺平亂。據傳說清軍於海途中忽遇颶風侵襲，海浪波濤洶湧，全軍譁然，於是虔禱媽祖，果得庇佑，一時風平浪靜。福康安於鹿港順利上岸後，相信是受媽祖的庇佑，於是奏請朝廷於臺灣府城及鹿港二地敕建天后宮。原本鹿港已有天后宮，此為雍正三年（西元1725
    年）由施世榜獻地遷建。而福康安又奏請新建，故原本天后宮稱為舊祖宮，新敕建天后宮稱為新祖宮。兩宮均有福康安敬獻之匾額，舊祖宮掛有「恩霑海國」，新祖宮則為「后德則天」。


