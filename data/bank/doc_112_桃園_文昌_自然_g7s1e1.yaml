  sections:
  - ord: 1
    name: 一、下列為常見的生命現象，請將正確的代號填入：(注意題號順序)
    count: 6
  - ord: 2
    name: 二、不同的細胞常具有不同的外型的功能，請參考文字敘述填入最適當的圖片：
    count: 6
  - ord: 3
    name: 三、下列為維持生命現象的四大條件，請將代號填入符合的敘述中：
    count: 4
  - ord: 4
    name: 四、下圖是常見的實驗器材，請根據題意選出適當的答案：
    count: 4
  - ord: 5
    name: 五、下圖為生物實驗室所使用的某種顯微鏡示意圖，試回答下列問題：
    count: 5
  - ord: 6
    name: 六、右圖為某種細胞的示意圖，請根據此圖回答下列問題：
    count: 3
  - ord: 7
    name: 七、蛋黃酥是中秋節應景熱門商品，其中最重要的材料莫過於鹹蛋黃，傳統的鹹蛋製作方式是泥土、鹽、草灰和黃酒混合成泥狀包裹在鴨蛋表面醃漬一個月，一般民眾在家中有更簡便的作法，將鴨蛋泡在濃度25%的濃食鹽水中約20~25天即可完成，已知鴨蛋表面的通透性質與細胞膜相近，示意圖如下，請回答下列問題：
    count: 2
  - ord: 8
    name: 八、昆蟲是世界上數量最多的動物，為了躲避敵害，演化出了多種不同的防禦方式，常見的方式包括下列幾種，請依照提示填入適當的代號：
    count: 4
  - ord: 9
    name: 九、人的肉眼能夠辨認的最短距離極限約為0.1mm，但透過光學儀器，可以將微小的物體放大後進行觀察，下列為光學儀器的放大倍率與適合觀察的尺度範圍，請回答下列問題：
    count: 3
  - ord: 10
    name: 十、中秋節烤肉是台灣特有的慶祝方式，今年中秋節老師到朋友家烤肉，採買清單上的部分食材如下：
    count: 8
  - ord: 11
    name: 十一、不鏽鋼皂是一種具有肥皂外型的不鏽鋼材質。業者宣稱當手上沾滿大蒜、洋蔥等傳統肥皂不易去除的味道時，一邊將手與不鏽鋼皂摩擦一邊以流水沖洗，可以消除部分氣味。小芸為了證實是否有效，設計實驗裝置如下：
    count: 2
  - ord: 12
    name: 十二、伯格曼法則（Bergmann’s Rule）是動物學中的一個經典理論，指同一類型的動物，其體型會隨著緯度或海拔增加而變大，例如生活在極地的北極熊就比生活在熱帶的馬來熊大上許多(如圖所示)，該理論由德國生物學家卡爾伯格曼(Carl
      Bergmann)提出，他主要研究不同生物體間構造的比較。試回答下列問題：
    count: 3
