    當你走累了／我願是夜晚／是路旁的客棧／有乾淨的枕席／供你睡眠／眠中有夢／我就是你枕上的淚痕

    我願是手臂／讓你依靠／雖然白髮蒼蒼／我仍願是你腳邊的爐火／與你共話回憶的老年／你是笑／我是應和你的歌聲／你是淚／我是陪伴你的星光

    當你埋葬土中／我願是依伴你的青草／你成灰／我便成塵／如果啊！如果――／你對此生還有眷戀／我就再許一願／與你結來世的姻緣 〈願〉蔣勳'
