- id: doc_113_屏東_明正_國文_g8s1e3_s6_9
  section: 6
  number: 9
  type: single
  page: 4
  stem: 小梅是位Instagram 愛好者，當家中長輩好奇為何IG 如此火紅時，小梅可根據本文如何準確解釋｢限時動態｣的特點呢？
  options:
  - label: A
    content: 可以跨越地區限制，了解到朋友們的動向，互動方便
  - label: B
    content: 發表後獲得讚或愛心，或與好友留言，能受到關注
  - label: C
    content: 是最新的社群媒體模式，要跟上潮流才能展現自我價值
  - label: D
    content: 有閱讀的時間限制，只能短暫存放，要隨時注意新動態。
  group_stem: "以往的社群媒體以將內容記錄並長時間存放為主，讓人們可以自行組織對自己有意義的生活經驗，然而過去曾有文章指出，長期使用Facebook\
    \ 會使人容易產生心理疾病，原因是因為看似單純分享的行為，背後更多的是自我呈現後被讚許和關心的渴望，讓使用者面對互動的有無及多寡容易患得患失。\n自從Instagram(以下簡稱IG)在2016\
    \ 年八月新增限時動態的新功能後，許多人養成隨時拍照、隨時發文的習慣。限時動態包含生活中大大小小的事件。也因為發布後只能保留24 小時的特色，讓其大受歡迎，使用者發布限時動態的頻率也已經高於普通發文。\n\
    隨著限時動態的出現並爆紅，例如閱後即焚的Snapchat 以及迅速跟進的Instagram，兩者都鼓勵使用者「隨時」分享生活中的每一個小片段，其過不久即自動銷毀功能的新穎性抓住年輕人的心，加上有別以往的永久記錄按讚（或是按愛心）、留言數字，限時動態彷彿解開束縛人們分享動機的枷鎖，能夠真正隨心所欲地展演也不必在乎是否有人回覆。\n\
    Facebook 也正式更新了Stories 限時動態功能，開始出現在動態時報的最上方。但是使用者真的有因為無拘束地傳送和接收限時動態而更快樂嗎？\n人與人之間的溝通形式有很大部分可以被記錄下來並永久保存，像是文字、聲音或者影像，讓製造訊息的人、接收者，甚至是未知將來的潛在觀眾都可以再次接觸到這些訊息。\n\
    相較之下，限時動態只能存放短時間，一旦錯過就像潑出去的水，永遠無法再觀看。此外，限時動態只能傳送「當下」的情境，這使得觀看者即使離傳者相隔遙遠，或是在發文後數分鐘、數小時之後才看到，仍有辦法感覺到彼此身處相近的時空。\n\
    限時動態兼具了不必同時在線也能接收和傳遞訊息的異步性，以及直播和網路電話的同步性，讓人們表達情緒更加容易，異步仍像同步，大幅提升了使用者經驗，彼此間的互動更有效率。\n\
    2016 年美國相關研究指出，在多種社交形式（包含Facebook、E-mail、傳發文字訊息、撥打電話以及面對面交談等等）上，限時動態帶給人的正面情緒比其他媒介還要佳，僅次於面對面的接觸。原因也是限時動態在呈現訊息上有著更多元有趣的型態，有風格多變的濾鏡、各式各樣的筆刷跟圖案、還有與觀看者互動的投票機制，這些功能促使朋友對自己的關注以及增加互動的樂趣。\n\
    但值得一提的是，限時動態看似沒有公開的數據給予發文者壓力，但如果自己所發的動態依舊沒有得到朋友的回應，還是會產生被忽略的負面情緒；同樣的，限時動態對觀看者其實也造成無形的壓力，因為害怕錯過朋友分享的生活點滴，而造成彼此的疏離感，所以每天瀏覽朋友的限時動態也成了鞏固人際關係的例行之事。\n\
    也就是說，若是一位好朋友上傳了今日的生活瑣碎，但是卻沒有被他所認為重要的人觀看或回應，可能會覺得不被重視，又比如說他的好朋友沒有在可觀看時間內瀏覽，也許會感到錯失了解對方的機會，於是限時動態成了催促人們隨時注意動態的推手。雖然對於人們來說是一種心理束縛，但從科技面來看，抓住了人性也是限時動態成功的原因。\n\
    \ 根據研究，上傳限時動態的人其實也忘記自己前一天發的內容，因為實在過於瑣碎而無法成為長期記憶。但是當人們除了自己份內的事情要顧及之外，閱覽他人動態成為了必須時常保持警覺的例行工作，參與即時動態互動也成了維繫關係的必要條件，這可能只會讓心理壓力逐漸增加，而無法帶來真正的快樂。\n\
    透過社群媒體的推陳出新，人與人之間的互動方式不斷被形塑又改變，我們不斷調適使用習慣和心態去適應各式各樣的平台，卻一再地易受到他人的期望或是回應影響。也讓我們開始反思，是否願意受其操控去經營感情，使得人與人之間的親密與否由第三者來定義？\n\
    改寫自洪叡珊 傳遞瑣碎的生活片段，社群媒體的｢限時動態｣能讓我們更快樂嗎？"
