  group_stem: '由AI 生成的歌曲，基本上是用開源的生成式語音訓練模型，運用一些語音素材進行訓練，簡單來說，就是透過AI 技術「音色轉換」加持實現的。

    以目前AI 模仿歌曲來說，主要是模仿音色，感情、技巧方面還是與真人有差，像是「AI 孫燕姿」唱〈挪威的森林〉，就有說不出的怪異感，唱〈髮如雪〉卻模仿不出周杰倫的唱歌技巧。

    歌手孫燕姿的聲音曾被拿來運用在AI，製作出多首歌曲的翻唱版本，包括〈下雨天〉、〈安靜〉、〈一場遊戲一場夢〉等其他歌手的歌曲，聲音逼真程度讓不少人驚呼AI 科技的技術，就連孫燕姿本人都發文感嘆科技進步，自認是冷門歌手，早已接受粉絲跳槽。

    儘管很多人認為，AI 創造的歌聲裡沒有情緒，也沒有音調變化，外界還是能分辨出來，但孫燕姿認為「很抱歉，我懷疑這只會是個非常短暫的反應」，在萬事萬物都可以被複製、創造出來的世代，AI
    技術很可能會有一種專門為你創作的獨特內容，「你並不特別，你已經是可預測的，而且不幸的是，你也是可塑的」。

    然而，不論是「AI 孫燕姿」、「AI 周杰倫」，這些歌曲創造高點擊率，卻也同時衍生創作版權的問題。當然也有人認為這些AI 歌手翻唱的老歌新曲，大家就是拿來「自己聽聽」，沒有進行商業性質交換，應該不算侵權。但若是明星的聲音可以用來「被訓練」，那一般人的聲音不就也有被利用的可能？

    面對AI 版權問題，2023 年5 月，知名串流平台Spotify 宣布，將陸續下架由AI 平台Boomy 生成的歌曲，以保障原創者的版權收入。環球唱片執行副總裁邁克爾·納什（Michael
    Nash）則指出「人工智慧音樂」正在稀釋市場，使原創作品更難找到，並侵犯藝術家獲得作品報酬的合法權利。

    金曲歌后陳珊妮2023 推出新單曲〈教我如何做你的愛人〉，她在記者會宣布這首歌的原唱其實不是她，而是由她擔綱製作人調教AI 產生的歌聲，是台灣首支最擬似真人AI
    單曲。

    對於利用AI 生成音樂，陳珊妮本人的態度很坦然，「現在AI 的趨勢是不可逆的，而且AI Vocal 不受限於時間、場地等限制，加上AI 是不會疲累的，若未來真的崛起，歌手的工作很有可能受到影響」。不過陳珊妮也說，因為
    AI 的配唱過程，仍需要由專業音樂製作人加入，以人類的美學和經驗去引導AI 擁有情感面，「音樂製作人的工作是無法被取代的」。 ──節選自｢今周刊｣網站 2023.05.25'
