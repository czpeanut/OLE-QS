  page: 2
  stem: 唐玄宗年間和大食的怛羅斯之役，對中外文化交流，產生什麼影響？
  options:
  - label: A
    content: 中國以絲絹、瓷器向大食求和，深受外國人歡迎，促進東西雙方的貿易。
