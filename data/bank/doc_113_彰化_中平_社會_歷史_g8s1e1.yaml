  type: single
  page: 1
  stem: 小明在第一關中，要為角色衛青找一個與他同時代的NPC 幫手，請問：他應該找哪一個NPC 才對？
  options:
  - label: A
    content: 商鞅
  - label: B
    content: 秦始皇
  - label: C
    content: 張騫
  - label: D
    content: 玄奘。
  group_stem: '閱讀文章後，請回答第18~21 題【閱讀素養題】

    小明最近迷上了一款新的線上遊戲「龍城飛將」，遊戲名稱取自唐代王昌齡的《出塞二首》「秦時明月漢時關，萬里長征人未還。但使龍城飛將在，不教胡馬度陰山」，「龍城飛將」是指某朝代征伐外族而鼎鼎大名的戰神-衛青，他的首次出征即奇襲龍城，揭開農業民族與草原民族戰爭反敗為勝的序幕，也曾七戰七捷，收復河朔、河套地區，擊破單于，為北部疆域的開拓做出重大貢獻。此役便是「龍城飛將」的由來。

    改寫自網址：https://kknews.cc/history/3egmzj3.html'
