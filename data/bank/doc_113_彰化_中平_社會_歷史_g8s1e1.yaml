  stem: 從周到唐，中國的經濟文化中心在北方，長安與洛陽成為帝王選擇首都的首選，原因主要在於此二地有地勢與軍事上的優點，或者易守難攻，或者兵家必爭。選長安為都的朝代有西周、秦漢、隋唐。選洛陽為首都的朝代有曹魏、西晉、北魏。但就帝王選擇首都的主要考量原因而言，下列哪一朝代的出發點，不同於其他三者？
