    | :--- | :--- |

    | 乙 | 宗法制度➔儒家成為學術思想的主流 |

    | 丙 | 科舉制度➔上品無寒門，下品無世族 |

    | 丁 | 科舉制度➔帶動讀書教育的風氣 |'
  options:
