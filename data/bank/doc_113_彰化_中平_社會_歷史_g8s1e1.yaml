  stem: 中國某朝代實行一種統治制度，造成社會有明顯的階級層次，統治階層身分世襲，享有諸多權利而有「刑不上大夫，禮不下庶人」之說。此制度使統治階層長期壟斷國家的統治權力，庶民只能安於本分，進行耕作、捕魚等基本的生產而無法參與政治。請問：某朝代最可能是下列哪一個？
