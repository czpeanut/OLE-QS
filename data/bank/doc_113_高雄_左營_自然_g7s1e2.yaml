- id: doc_113_高雄_左營_自然_g7s1e2_s2_43
  section: 2
  number: 43
  type: single
  page: 6
  stem: 本文是人體防禦作用的類比故事，富有國的城牆如同人體的什麼構造？
  options:
  - label: A
    content: 骨骼
  - label: B
    content: 肌肉
  - label: C
    content: 神經
  - label: D
    content: 皮膚。
  group_stem: "【題組六】閱讀文章後回答第43～47 題：\n    很久以前，有一個非常富有的國家，我們暫且稱他為「富有國」。富有國周圍圍繞著許多國家，一天到晚對富有國虎視眈眈，想掠奪他的資源。有一天，富有國東邊的「石頭國」按捺不住，派了三名士兵到富有國城牆外投了三個大石頭，想試探對方防護情況。富有國的民眾被石頭打中後，立即向國王報告石頭國企圖侵略，於是國王下令發給每人一頂鋼盔。果不其然在三個月後，石頭國大舉入侵，對著富有國投擲大量石塊。但因富有國人人已有防備，頭部都戴鋼盔，故未造成任何傷亡。\n\
    \    好景不常，西邊的「槍手國」也派三名先鋒士兵對富有國城牆的守衛開槍，導致三名守衛受傷。這狀況也立即通報了富有國國王，這次國王下令發給民眾一人一套防彈背心。在三個月後，如富有國所料，槍手國也派眾多士兵進攻富有國。但因富有國已人人都有防彈背心，所以未讓槍手國得逞，再次逃過一劫。沒過多久，南邊的「砲彈國」也來了！並對富有國發射三枚砲彈，富有國國王知道後下令趕快建造防空洞，三個月後砲彈國來襲，富有國的人民都躲進防空洞，雖然人民性命保住了，但地上建築物卻被炸彈全毀了。最後，北邊的「核彈國」也來湊熱鬧，「轟」的一聲，一枚核彈就把富有國給滅亡了！"
