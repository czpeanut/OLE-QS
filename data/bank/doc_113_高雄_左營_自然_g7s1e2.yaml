  group_stem: "【題組七】閱讀文章後回答第48～50 題：\n    對於植物而言，蒸散作用能加速根部水分的吸收，同時能協助維管束中其他營養物質的運送以供細胞使用，同時水分汽化的過程會吸收周遭熱量，能夠有效幫助植物體降溫，避免環境的高溫導致植物體灼傷甚至枯死，由於蒸散作用的降溫特性，人們常將綠色植物作為綠化的材料之一，減少建築物內能量的耗費（例如：減低使用空調設備等），但因為部分植物的根部可能會破壞建築物的結構，近年來使用上會較為審慎評估。"
