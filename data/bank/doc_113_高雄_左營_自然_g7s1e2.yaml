  section: 1
  number: 6
  type: single
  page: 1
  stem: 小德的爸爸想將住家後方的黃槐樹移到鄉下奶奶家。爸爸首先以電鋸將樹枝鋸掉一大部分後才移植。傳德看見後，問說：「為什麼爸爸將樹鋸得光禿禿的？這樣根本無法遮蔭！」請問，小德的爸爸為什麼這麼做呢？
