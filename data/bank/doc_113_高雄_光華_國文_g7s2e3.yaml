    content: 高山仰止，景行行止
  - label: D
    content: 曠達自適，淡泊名利。
  group_stem: "<丙>  三月七日沙湖道中遇雨，雨具先去，同行皆狼狽，余獨不覺。已而遂晴，故作此。\n    莫聽穿林打葉聲，何妨吟嘯①且徐行。竹杖芒鞋輕勝馬，誰怕！一蓑煙雨任平生。\
    \ 料峭②春風吹酒醒，微冷，山頭斜照卻相迎。回首向來蕭瑟處，歸去，也無風雨也無晴。                                    \
    \        ——蘇軾 定風波\n      【注釋】①吟嘯：吟詩與嘯呼。②料峭：形容風冷。"
