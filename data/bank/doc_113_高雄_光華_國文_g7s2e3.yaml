  section: 1
  number: 34
  type: single
  page: 3
  stem: 「專家指出先天就具有某方面特殊才能的人並不存在，就如同沒有人是一生下來就可以當上總裁、投資高手或棋王的道理一樣，這樣的豐功偉業，背後不但需要長期的心力投入，還要特別的堅忍與毅力。巴菲特就是一個很典型的例子，若沒有花費大量時間研讀目標投資公司的財務報表，就不可能成就他著名的投資法則。」以上這段文字的含義與下列何者最接近？
  options:
  - label: A
    content: 沒有人會只因年齡而衰老，是因放棄理想與熱情才使靈魂老化
  - label: B
    content: 成功不是將來才有的，而是從決定去做的那一刻起，持續努力累積而成
  - label: C
    content: 聰明的人是考慮現在和未來，根本無暇去想過去的事
  - label: D
    content: 沒有理想與目標的人，在思想上往往偏於保守，在行動上則想維持現狀。
