- id: doc_113_高雄_光華_國文_g7s2e3_s2_49
  section: 2
  number: 49
  type: single
  page: 6
  stem: 根據<己>篇文章內容，下列說明敘述何者正確？
  options:
  - label: A
    content: 馬丁為協助阿里報仇，所以教他練拳
  - label: B
    content: 阿里到警局報案，原因是腳踏車被破壞了
  - label: C
    content: 找到偷車賊後，阿里將他狠狠修理了一頓
  - label: D
    content: 阿里走上拳擊之路，可說是無心插柳柳成蔭。
  group_stem: "<己>    一個十二歲的少年滿臉悲憤地走進警察局，報案說他的腳踏車被偷了，他咬牙切齒地說：「我恨不得痛宰那個賊！」因為他的家境清寒，父親是個油漆工人，他自己也利用課餘在打工，腳踏車被偷對他來說實在是損失慘重。受理的警察名叫喬．馬丁，他瞧著少年說：「你要向人挑戰，得先自己有兩下子。你何不學拳擊？」馬丁會這樣說，因為他剛好是個拳擊教練，自己有家拳擊館，他覺得眼前這位少年是練拳的料子。\n\
    \        少年覺得這個主意不錯，於是開始到馬丁的拳擊館練習，後來更到格來士社區中心的史東納拳擊館接受更嚴格的訓練。他每天下午放學後，先到天主教學校的修女處打工，六點到八點在馬丁的拳擊館練習，八點到十二點又轉往史東納的拳擊館，勤練左快拳、右直拳、勾拳、躲閃等動作，每個動作都不停地做兩百次。\n\
    \        結果，他雖沒有痛宰那個偷車賊，但卻打敗州內的少年拳手，連續贏得六屆肯塔基州的金手套獎。他在校的成績奇爛無比，但他就讀的高中還是讓他順利畢業，該校校長有一次在教職員會議上說，這個學生將來「會使本校聞名遐邇」。他說對了，因為這個學生不久就在一九六○年的羅馬\
    \ 奧運上贏得次重量級的拳擊金牌，四年後更打敗當時的重量級拳王李斯頓，成為世界拳王。\n      他名叫卡修斯．克萊，皈依回教後改名為穆罕默德．阿里。阿里在成名後，提起他那不堪回首的學生生涯時，半開玩笑地說：「我說過我是最偉大的，但並不是最聰明的。」其實，條條大路通羅馬，誰說一定要聰明、一定要成績好才能有成就？阿里並非不學無術，他說過很多名言，而意味最深長的一句是：「如果能從發黴的麵包裡提煉出盤尼西林（抗生素），那從你身上也必然能找到什麼。」但不管那是什麼，都像阿里的拳頭，是苦練出來的。\n\
    （改寫自王溢嘉 腳踏車與拳頭）"
