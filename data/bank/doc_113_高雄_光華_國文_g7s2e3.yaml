  section: 1
  number: 35
  type: single
  page: 4
  stem: 某文人因罪被貶後，寫道：「得罪以來，深自閉塞，扁舟草屨（１），放浪山水間，與漁樵雜處，往往為醉人所推罵，則自喜漸不為人識。」根據以上這段文字，下列各選項對於此文人境況的描述，何者正確？【注釋】（１）草屨：草鞋。
