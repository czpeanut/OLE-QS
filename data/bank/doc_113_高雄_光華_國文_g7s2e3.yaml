  stem: 蘇軾〈記承天夜遊〉：「庭下如積水空明，水中藻荇交橫，蓋竹柏影也。」根據文本內容，其所描述夜遊所見的景象下列何者說明正確？
  options:
  - label: A
    content: 中庭的水池積水清澈透明，水中縱橫交錯的不是水草，而是竹柏的影子
  - label: B
    content: 月光照射在中庭，好像積水一般清澈透明，交錯在其中的不是水草，而是竹柏的影子
  - label: C
    content: 中庭就好像積了水一般，看來清澈透明，水中的水草交錯在一起，更有竹柏的影子覆蓋其上
  - label: D
    content: 月光照射在中庭，好像積水一般清澈透明，水中的水草被竹柏的影子覆蓋住，兩者縱橫交錯。
