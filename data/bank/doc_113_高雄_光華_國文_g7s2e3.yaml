- id: doc_113_高雄_光華_國文_g7s2e3_s1_33
  section: 1
  number: 33
  type: single
  page: 3
  stem: 「五○年初，陳之藩還是剛由大陸逃難來臺的窮學生，胡適從美回臺，見他沒錢出國，便用平信寄了一張二千四百元的支票給他出國留學。到美國後，他拚命打工賺錢，先還了出國保證金二千元，其後二年攢錢攢了很久，才還剩下四百元。當時，胡適卻說：『我借出的錢，從不盼望收回，因為我知道我借出的錢，總是一本萬利，永遠有利息在人間的。』」（吳錦勳
    陳之藩、童元方：幸福不能輕易說破）根據這段文字，下列何者最接近胡適的想法？
