    content: 脫離母體,獨立發展的自我期許
  - label: C
    content: 心靈上依歸與認同的所在
  - label: D
    content: 對自身血緣的追本溯源。
  group_stem: "<戊>  福樓拜一生與埃及的情緣讓人感動，我們對某些國家的思慕因此更深。打從青少年時代開始，福樓拜就堅持他不是法國人。他對法國和法國人民厭惡極深，諷刺的是他自己也是法國人。因此，他提出一個國籍認同的新方式:不是出生地，也不是家族來自的地方，而是最吸引一個人的地方。\n\
    \    「一個國家是不是指地圖上的一片土地，以紅色或藍色線條來與其他地方相隔之地？不是的。我的祖國就是我摯愛的地方，讓我有夢、有感覺的地方。如果說我是法國人，那麼說我是中國人也可以。阿拉伯人被擊潰，我一點歡喜之情都沒有，反倒覺得難過。我欣賞這個能吃苦耐勞、堅毅不拔的民族。他們是最後的原始人，日正當中躺在駱駝肚子下的陰影納涼，抽著土耳其長菸管，取笑我們那怒氣沖沖的文明......。」\n\
    \    「我可說是今之古人，法國人當中的中國人。如果說在地圖上一塊用紅色或藍色標示出來的地方就是祖國，其他用綠色或黑色畫出來的地方就是令人討厭的地方，那麼我覺得這種觀念偏狹、局促一隅，而且愚蠢之至。四海之內，所有的生物都是我的兄弟，包括長頸鹿和鱷魚。」\n\
    \     我們也是，在沒有選擇的餘地之下，在一地飄落、成長。但是就像福樓拜，我們長大成人之後，也有想像的自由，可以發現與我們心靈契合之地，重新創造自己的國籍。\
    \                               ——艾倫‧狄波頓 旅行的藝術"
