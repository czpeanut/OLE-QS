    content: 作者從小就被祖父母灌輸「謝天」的觀念，故在外國朋友家接觸到謝飯的儀式時即能入境隨俗
  - label: B
    content: 在普林斯頓時，作者瀏覽了愛因斯坦的著作，發現愛因斯坦不居功的表現竟與他從小對於「謝天」的領悟不謀而合
  - label: C
