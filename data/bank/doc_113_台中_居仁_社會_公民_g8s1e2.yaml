  group_stem: '新聞報導二：超思進口蛋爭議 農業部將送檢調查處！

    因應國內雞蛋需求，農業部2022 及2023 年委託畜產會，辦理進口蛋緊急調度計畫，向亮采及超思公司採購進口蛋，引發一連串爭議。例如:沒訂定相關洗選作業規範及有效日期計算方式等，導致爆發一連串違規爭議及食安問題；進口過多的雞蛋必須銷毀，銷毀又產生9130
    萬的銷毀成本。

    政府機關經過調查，今年8 月對農業部提出5 項糾正、6 項檢討改善意見，其中涉及短報進口稅款等問題的部分，也將交由檢調及財政部查處。對此，農業部表示會積極改進。'
