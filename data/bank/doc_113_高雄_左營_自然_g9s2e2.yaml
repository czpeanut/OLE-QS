  stem: '乙酸和乙醇在濃硫酸的催化下，可進行化學反應，生成產物 1 和水，如式(1)，假設乙酸與乙醇皆反應完全無殘留。氯化氫和氫氧化鈉的水溶液混合，可進行化學反應，生成產物
    2 和水，如式(2)。

    $\mathrm{CH_{3}COOH + C_{2}H_{5}OH \rightarrow}$ 產物 $1 + \mathrm{H_{2}O}$ ––式(1)

    $\mathrm{HCl + NaOH \rightarrow}$ 產物 $2 + \mathrm{H_{2}O}$ ⎯⎯式(2)

    比較這二類反應，試問下列敘述，何者正確？'
  options:
  - label: A
    content: 乙酸、乙醇、氯化氫與氫氧化鈉皆為電解質
  - label: B
    content: 產物 1 與產物 2 皆可溶於水
  - label: C
