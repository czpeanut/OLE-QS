  stem: 作者在文中透過「一薰一蕕，十年有臭」、「一暴十寒」及「一傅眾咻」等例子，說明下列何者對人的影響很大？
  options:
  - label: A
    content: 生活環境
  - label: B
    content: 天賦高低
  - label: C
