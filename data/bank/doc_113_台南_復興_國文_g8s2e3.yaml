  group_stem: '◎請閱讀以下文章，並回答 47～48 題

    一個美好的傍晚，小公務員切爾維亞科夫拿著望遠鏡坐在劇院第二排的座椅上，心情愉快地觀看著歌劇，越看越覺得幸福。可是突然之間，他不禁皺起臉、翻著眼，屏住了呼吸……於是他放下望遠鏡，低下頭就打了一個噴嚏。人都難免會打噴嚏，切爾維亞科夫自然也不例外，他打完噴嚏之後，不慌不忙地掏出小手絹擦了擦臉，然後有禮貌地看了看四周，希望他剛才打噴嚏沒有影響到別人。這一看他不由得慌張起來，因為他發現坐在他前面的一個小老頭正一邊嘟囔著什麼，一邊拿著手套在用力地擦他的光頭和脖子。這個小老頭不是別人，正是交通部的文職將軍，切爾維亞科夫認識他。

    「我的唾沫濺到他身上了！」切爾維亞科夫心想：「他雖然不是我的上司，而且跟我不在同一部門，可我還是應該向他賠不是。」於是切爾維亞科夫就清了清嗓子，把上身湊到將軍的耳朵旁邊，小聲說：「將軍，實在非常抱歉，我的唾沫濺到您身上了……我不是有意的……」將軍說：「不打緊，不打緊……」切爾維亞科夫說：「請您看在上帝的份上，寬恕我吧，我確實……我確實不是有意的……」將軍說：「唉，您請坐好！我要聽戲！」

    切爾維亞科夫心裏很慌亂，只好傻笑著朝舞台上望去。可是，剛才那種幸福感卻奇怪地消失了，他只覺得惶恐不安。幕間休息時，他在將軍身邊徘徊了好一會兒，終於克服了內心的膽怯，囁嚅著對將軍說：「將軍，我的唾沫濺到您身上了……請您務必寬恕我……我不是有意的……」將軍不耐煩地撇了撇嘴說：「哎呀，請別再說了……剛才那件事兒我已經忘記了，您就別再提它了！」切爾維亞科夫一邊想一邊懷疑地看著將軍，「他不想跟我說話，這表明他非常生氣。我應該再次向他表明我並不是有意的，並說這不是我能控制的，否則的話，他就會以為我是有意啐他的。也許他現在並不會這麼想，可是以後呢？以後誰能保證他不這麼想呢？」

    回到家之後，切爾維亞科夫就把自己在劇院失態的事告訴了妻子，但是他的妻子好像並不像他那樣重視這件事。剛開始時，她確實也被嚇住了，可是當她聽說將軍跟她丈夫不在同一部門時，她也就放心了。不過她說：「你最好還是親自去向他賠禮道歉比較好，否則，他會認為你的舉止不莊重！」

    第二天，切爾維亞科夫穿上新制服，還把頭髮理了理，然後就去拜訪將軍了，他要向將軍解釋清楚。將軍的接待室裡有很多人，這些人正圍著將軍，請求他幫忙做各種事情。將軍問過幾個人的請求之後，抬起了頭，目光在切爾維亞科夫臉上停留了一會兒。切爾維亞科夫說：「將軍，您還記得昨天在劇場里發生的事嗎？」「我打了一個噴嚏，沒想到唾沫星子濺了您一身……請您務必寬……」「簡直是胡鬧……這算什麼事兒呀！」將軍說完，把頭扭向了另一位請求他幫忙的人。

    「他不想願意跟我說話！」切爾維亞科夫滿臉發白地想，「看樣子他確實在生我的氣……我不能就這麼算了……我得好好跟他解釋一番……」將軍接待完最後一個請求他幫忙的人，然後向內室走去。切爾維亞科夫立刻跟上他，在他身後囁嚅著說：「將軍，如果我斗膽打攪了您，那麼務必請您原諒，我自己也很懊悔……我只是想讓您知道我確實不是有意的！」將軍哭喪著臉，對切爾維亞科夫擺了擺手，然後說：「先生，您簡直是在胡鬧！」接著，將軍就走進內室，並隨手關上了內室的門。

    「這怎麼是胡鬧呢？」切爾維亞科夫心想，「我根本沒有胡鬧！將軍怎麼這麼不明白事理呢？既然他這麼愛擺架子，那麼我也就沒必要再向他賠不是了，我再也不會親自來給他賠不是了，真的不來了！給他寫封信就足夠了！」切爾維亞科夫一邊這樣想著，一邊走回了家。他原本想回到家就給將軍寫信的，可是想來想去也不知道該如何寫才好，最終也沒有動筆，只好決定隔天再當面向將軍解釋清楚。

    「將軍，我昨天已經打擾過您了，」他看著將軍疑問的目光，囁嚅著說，「您說我在胡鬧，其實並不是這樣的，我是專門來給您賠不是的，因為我打噴嚏時把唾沫濺到您身上了……我絕對沒有胡鬧，再說了，我也不敢跟您胡鬧呀。如果我是在胡鬧的話，就表示我對將軍……對將軍您不夠尊重……」

    「快滾！」將軍渾身顫抖地大叫起來，他的臉氣得發青。

    「您說什麼？」切爾維亞科夫小聲地問，他被將軍的樣子嚇住了。

    「快滾！」將軍又大叫了一聲，同時跺了跺腳。

    切爾維亞科夫感到肚子裡好像有東西在往下掉。他對周圍的一切既不看也不聽，一步步退到門口，然後步履維艱地走在大街上……他回到家裡之後，連制服都沒脫就躺到了長沙發上，就這樣……死在了長沙發上。
    ——節選自契訶夫〈小公務員之死〉'
