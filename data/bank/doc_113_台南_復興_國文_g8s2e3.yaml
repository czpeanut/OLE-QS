  group_stem: '玉米是印地安人送給世界的禮物。歐洲人初抵美洲之際，那裡已有各型玉米作物。比起舊世界農作物，玉米恰好位於稻米和小麥的生長帶之間，在稻米嫌太乾或小麥嫌太濕的區域，皆有良好收成。玉米單位面積產量幾乎是小麥田兩倍。少有作物及得上玉米，短短一個生長季就能提供大量碳水化合物和脂肪。

    16世紀的歐洲有許多地方栽植玉米，但做為廣大地區的主食，大約已是下個世紀後期。到了18世紀，玉米已經成為法國南部飲食的基本元素。它曾在法國人口重新成長的過程扮演重要角色——18世紀前數十年，法國人口曾明顯衰減。西班牙人口曾在17世紀減少，18世紀開始回增；在波河谷地種植玉米的義大利，17世紀下半期人口也曾衰減，之後又回增。這些地中海地區人口的消長，應該和玉米有關。今日，玉米對東南歐的重要性更勝於西南歐。隨著人口增加，玉米及其他美洲作物如：馬鈴薯、南瓜的栽種也逐漸擴張。依賴玉米為主食的程度，正隨著人口壓力降低而一起減低，但過往的影響仍在。'
