- id: doc_113_台南_復興_國文_g8s2e3_s2_43
  section: 2
  number: 43
  type: single
  page: 6
  stem: 依據文意，「汨羅不是忘川、火鳥要不斷還魂。」這句話的意思，與下列何者相近？
  options:
  - label: A
    content: 詩魂傳承，後繼有人
  - label: B
    content: 前事不忘，後事之師
  - label: C
    content: 以牙還牙，以眼還眼
  - label: D
    content: 抑鬱而終，陰魂不散
  group_stem: '◎請閱讀以下文章，並回答 43～44 題

    對於許多人，端午意味的不外乎艾旗蒲劍、龍舟競渡和彩繩角黍①這些美麗繽紛的節目吧！然而每當我一思及端午，浮現在眼前的，卻是「鳳飛，鳥從以萬數」的奇情壯景！那一隻巨大的火鳥②以及那一群大小不等的火鳥，看見牠們從歷史黑沉沉的地平線上劃然飛出，在重重烏雲的包圍下光彩四射、變化飛騰，然而在地上忙於龍舟競渡的人們似乎並沒有看見牠們，也沒有聽見牠們。當晚霞滿天，龍舟散去，並沒有人看見這一群燃燒著的火鳥宛轉哀鳴地沒入了喃喃不已的晚天深處……

    面對這樣的端午，時常我感覺到無端的寂寞。

    詩人愁予曾問：「是誰傳下這詩人的行業？」/甲、劉勰說他「金相玉質，百世無匹③」，/乙、又說他「衣被詞人④，非一代也！」揆諸歷史，這是實情！/丙、在他沉江後一百年，洛陽少年賈誼特別過汨羅而投文祭弔他，/丁、太史公司馬遷鄭重地記下了這件事，/戊、我想，在中國，這人就是屈原了吧！這便是火鳥第一次光榮地復活了！秦漢以降兩千年，沒有一個詩人詞客、沒有一個文人學士在他們心底深處沒有一條潺潺不斷，喃喃不已的汨羅江！古今中外，從來沒有一個詩人能讓所有在他之後的詩人文人口服心服、口追心摹，仰慕認同一至於斯！屈原的偉大在這裡，辭賦的偉大也在這裡。他凝聚了一個民族的文心詩魂，他傳下的不止是一盞燈，乃是一道長虹，與天地並壽，與日月齊光！

    汨羅不是忘川、火鳥要不斷還魂。當賈誼面對鵬鳥時，他從鵬鳥陰鬱的凝視中看見自己。當杜甫低吟「飄飄何所似，天地一沙鷗」時，他在沙鷗的飄泊中看見自己的一生。陶淵明看見自己的「栖栖⑤失群鳥，日暮猶獨飛」。蘇東坡感嘆人生無常如雪泥鴻爪時，他在「縹緲孤鴻影」中窺見自己的影子。直到千載下執文學革命之先鞭的胡適、魯迅也都在烏鴉中發現自己天賦的使命——「寧鳴而死，不默而生」！這是范仲淹〈靈鳥賦〉裡的兩句名言，他向上向下回應了先後兩千年來詩人文人共同的心聲！
    ——節選自高大鵬〈汨羅江與桃花源〉

    【注釋】①彩繩角黍：綁粽子。②火鳥：有一種長生鳥叫鳳凰，牠每五百年會燃燒成灰燼，然後從灰燼中重生，再活五百年。③金相玉質，百世無匹：語出《楚辭》之〈王逸·離騷章句序〉，為王逸對屈原作品的思想內容和藝術形式給予完美的評價。④衣被詞人，非一代也：指屈原的作品對後代的賦體、駢文、五七言詩的形成，都發生了深遠的影響。⑤栖栖：孤寂零落的樣子。'
