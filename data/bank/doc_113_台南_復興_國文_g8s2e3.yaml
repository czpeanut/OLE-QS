  group_stem: '◎請閱讀以下文章，並回答 41～42 題

    成湯盤銘，著日新之規；武王①戶席②，題必誡之訓。仲尼革容③於欹器④，則先聖鑑戒，其來久矣。故銘者，名也，觀器必也正名，審用貴乎慎德。蓋臧武仲之論銘也，曰：「天子令德⑤，諸侯計功⑥，大夫稱伐⑦。」

    箴者，針也，所以攻疾防患，喻針石也。斯文之興，盛於三代。夏商二箴，餘句頗存。周之辛甲，百官箴闕⑧，唯〈虞箴〉一篇，體義備焉。迨至春秋，微而未絕。戰代以來，棄德務功，銘辭代興，箴文委絕。

    夫箴誦於官，銘題於器，名目雖異，而警戒實同。箴全御過，銘兼褒讚。其取事也必核以辨⑨，其摘⑩文也必簡⑪而深，此其大要也。然矢言⑫之道蓋闕，庸器⑬之制久淪，所以箴銘寡用，罕施後代，惟秉文君子，宜酌其遠大焉。
    ——節選自劉勰《文心雕龍·銘箴》

    【注釋】①武王：周武王。②戶席：即〈戶銘〉〈席四端銘〉。③革容：臉色因激動而變化。④欹器：欹ㄑㄧ，古代貴族宗廟中的一種巧器。空時重心在上，故傾斜；半滿時，重心在下，故位正；水滿時重心又在上，很易傾覆。⑤令德：稱頌天子美德。令，美。⑥計功：計數諸侯功績。⑦稱伐：銘其征伐之勞。⑧箴闕：針砭缺失⑨核以辨：確實而明白⑩摘：彳，鋪敘。⑪簡：簡要。⑫矢言：正直之言。⑬庸器：銘記功業的器物。'
