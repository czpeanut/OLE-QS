  stem: 「先生不知何許人也，亦不詳其姓字。宅邊有五柳樹，因而為號焉。」這段文字藉描寫五柳先生姓名不為人所知，暗指陶淵明歸隱的心志，下列哪一個詩作也表現出歸隱的心境？
