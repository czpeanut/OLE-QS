    content: 人物的性格細節有助於讀者了解歷史背景，進而喜愛歷史
  - label: B
    content: 司馬遷著重人物的性格、稟賦，這就是史記最精彩之處
  - label: C
    content: 詳細考證歷史人物的生平，使史記優於其他史書
  - label: D
    content: 司馬遷重視歷史人物的生活細節勝過歷史上的重大事件
  group_stem: '歷史人物的一些生活細節，本來都與歷史上的重大事件沒有什麼直接關係，但司馬遷卻看得很重，這可以說明他關注歷史自有不同於別人的側重點。現在常說「細節決定成敗」，司馬遷對歷史人物的關注就常常在於細節，不過不是無關緊要的細節，而是性格細節，這也是《史記》高出於「二十四史」中其他史著的地方之一。我們常說，性格決定命運。其實，從某種意義說，性格也決定歷史。司馬遷所寫的《史記》就告訴我們：歷史都是性格史。

    (張達 史記中的性格細節)'
