- id: doc_113_新北_忠孝_國文_g8s1e2_s6_12
  section: 6
  number: 12
  type: single
  page: 5
  stem: 文中王富和張祥打賭的事情是什麼？
  options:
  - label: A
    content: 挖開墳墓，打開棺材看屍體
  - label: B
    content: 帶著屍體渡河
  - label: C
    content: 深夜到墳場取走棺材蓋
  - label: D
    content: 將屍體移出棺材外
  group_stem: '嘉靖中，錫人王富、張祥俱有膽，素不畏鬼。夏日同飲溪上，日將晡，王曰：「隔溪叢冢中，昨送一新死人，汝能乘流而過出其尸於棺外乎?」張曰:「吾能黑夜出之。」王曰:「果爾，當輸臘釀一甕，吾先取來等汝。」俄日没，張遂過溪,見棺已離蓋，方疑之，忽棺中出兩手抱張頸。張懼而私祝曰:「汝少出，俟我賭勝，明日當奠而埋汝。」言畢，抱益緊。張大叫,聲漸微。溪旁人家聞聲，群持火來照，抱張頸者乃王也。蓋詭言取酒，從便處先渡，出尸而伏棺中耳。


    注解：晡：泛指下午或黃昏 冢：高大的墳墓尸：屍體臘釀：臘月釀的酒俄：須臾祝：祈求少：稍微

    俟：等待詭言：謊話伏：藏匿'
