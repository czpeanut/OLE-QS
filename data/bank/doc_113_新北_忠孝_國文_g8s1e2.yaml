  section: 5
  number: 5
  type: single
  page: 1
  stem: 有關〈田園之秋選〉一文，下列敘述何者正確？
  options:
  - label: A
    content: 「下午大雨滂沱，霹靂環起，若非蕃薯田在家屋邊，近在咫尺，真要走避不及。」描寫作者走避不及被淋成落湯雞，來凸顯西北雨迅雷不及掩耳
  - label: B
    content: 「本地原是山洪沖積成的沙石層，滲水極快，無論多大多長久的雨，縱使雨中行潦川流，雨一停，便全部滲入地下」因為西北雨的雨時短，所以即便雨勢大，水也很快便滲透進地下
  - label: C
    content: 「竹葉笠是要被打穿的，沒有蓑衣遮蔽，一定被打得遍體發紅」用生活經驗具體地表現西北雨雨勢的兇猛
  - label: D
    content: 「一片清新的空氣、鮮潔的色彩，彷彿聽見了貝多芬《田園交響曲》第四樂章〈牧羊人之歌〉」用視覺印象來表達聽覺效果，以悠揚樂聲刻劃雨過天青的平靜
  lesson_raw:
    title: 田園之秋選
    basis: 題幹提及〈田園之秋選〉
