    \n價格，無關乎價值，\n頭銜，非內涵。\n他的鞋子尺碼，非他所往之地，\n用以欺世盜名的身份。\n\n此外，再附張露出單耳的照片。\n    重要的是外在的形貌，不是聽力。\n\
