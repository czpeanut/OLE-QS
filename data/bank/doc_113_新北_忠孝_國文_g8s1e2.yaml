    content: 「常著文章自娛，頗示己志，忘懷得失，以此自終」寫五柳先生寫作文章表明心志，靜待時機，以期一展長才
  - label: C
    content: 「『不戚戚於貧賤，不汲汲於富貴』極其言，茲若人之儔乎？」以含蓄設問的方式，借黔婁之妻的話來讚美五柳先生安貧樂道的操守
  - label: D
    content: 「無懷氏之民歟！葛天氏之民歟！」感嘆生不逢時，未能趕上上古純樸的太平時代
