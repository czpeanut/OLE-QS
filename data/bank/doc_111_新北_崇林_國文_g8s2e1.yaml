- id: doc_111_新北_崇林_國文_g8s2e1_s5_8
  section: 5
  number: 8
  type: single
  page: 5
  stem: 根據文章內容，下列敘述何者錯誤？
  options:
  - label: A
    content: 海豚會透過各式各樣的聲音與同伴傳遞訊息，例如：辨識身分、求偶等等
  - label: B
    content: 為維持展示品質，動物園需不斷從野外捕捉動物，更糟的是，捕捉過程充滿血腥殺戮
  - label: C
    content: 動物園為合理化自己的存在，常以教育研究、生態保育、休閒娛樂為理由
  - label: D
    content: 因長期投入觀察與研究，因此人們對於鯨豚聲音的理解深刻而透澈，能夠充分掌握其中所代表的涵義
  group_stem: "(三)鯨豚悲歌                                                           \
    \      資料來源：張卉君《黑潮洶湧》\n    在人類有限的科學研究裡發現，鯨豚的聲音形式代表著各種不同的訊息。譬如齒鯨在群體中為了要「自我介紹」、標示自己是誰，發展出個體獨有的「簽名哨叫」，以在深海中和夥伴互相辨識；而鬚鯨類可以發出音頻較低的聲音，雄性大翅鯨甚至會「唱情歌」，發出有節奏且連續性的「鯨歌」來求偶。人類對於鯨豚聲音所代表的涵義充滿了好奇，若以蘋果比喻，人類能夠理解的程度大概比蘋果的皮還要薄，需要透過長時間在水下的調查與錄製，透過聲學與動物行為學的交互理解加以推測、判斷。對於社群結構較強、經常集體出現的齒鯨類而言，彼此之間透過音頻來溝通交流，是非常重要的社交或文化傳承模式。\n\
    \    相較於野外鯨豚之間透過不同的聲頻進行交流、傳達訊息的豐富及多樣性，受人工圈養的鯨豚被人類從野外捕捉、挑選，然後困養在侷促的水族館裡，每天都必須承受維生系統以及水質過濾系統在水下發出的低頻噪音影響，長久以來牠們的聽力變得遲鈍而麻痺；而一些在野外不可或缺、但在人工環境中則不具意義的功能和構造，則會隨著圈養日久而逐漸退化。例如在海裡相當重要的「回聲定位系統」，是齒鯨透過聲波的拋接來測量水下地景或和他者之間距離的重要探測功能，在空無一物的水池裡則不具意義。單調、重複、侷促的圈養環境並不需要探測，圓形而空蕩的池子讓聲音如同鏡面一般重複回射，動物在無止盡的重複之中受困，那樣絕望的寂寞日漸侵蝕著鯨豚高度靈敏的身心。\n\
    \    每當看到海洋公園肆無忌憚地透過野外捕捉、監禁動物、訓練動物表演來娛樂觀眾大肆牟利的圈養行為，都讓我感到非常悲傷。那些來自不同海域、不同族群的海豚，被人類捕殺、圈養在有限範圍的水池裡，只能無意識地重複繞圈、拍打玻璃，甚至出現互相啃咬、嘔吐食物等身心異常的「刻板行為」。其實這些被囚禁的鯨豚在高壓的環境下生活，普遍都有腸胃和消化系統的疾病，無可躲避的狹窄空間讓牠們進退維谷，生活無聊，身心卻高度壓迫。人們怎麼會想到，這些海豚看似面露微笑，彷彿生來快樂的外型，背後反而有著受盡人工圈養及表演訓練壓迫和折磨的真實血淚。\n\
    \    除了娛樂功能之外，保育、教育以及研究的功能是動物園最常拿來當作自身存在的合理化理由。然而，目前動物園界面臨最大的挑戰，是圈養動物的福利普遍低落及仍需不斷從野外捕捉動物來維持展示品質。當動物園普遍存在於人類的生活中，隨之而起的商業展演機構以馬戲團式的動物表演吸引遊客，在獵奇觀看的文化默許下，物種歧視根植人心。在動物表演看似歡樂的娛樂行為背後，是大多數人無法想像的野外捕捉、血腥殺戮過程。\n\
    \    我曾以攝影師的敏銳，觀察著每個遊客觀看動物表演的神情，有些人心不在焉地玩弄著手機，有些人意興闌珊有一搭沒一搭地抬眼看，當然也有些人為了海豚跳得高而興奮拍手大叫。表演結束後，幾乎沒有人再多逗留、多看看這些海豚，然後在下個表演開始前就馬上忘記那些剛剛看完的海豚的種類名稱了。有時候我會想，人究竟有多麼自大，竟誤以為自己是造物的主宰者，傲慢到以為自己可以在陸地上複製一座海洋。\n\
    \    每年成千上萬湧入海洋公園看動物表演的人群，有數不清的家庭、學校帶著孩子們在看台上圍坐著，一邊對被人們訓練乞食、表演、娛樂的動物們哈哈大笑。這是多麼荒謬的「教育」？觀看動物表演需要付出多少代價？一張門票，買的是動物的自由，買的是廉價的娛樂效果，還是孩子對痛苦麻木的心？而這真的是我們想要帶給下一代的生命價值嗎？當去看「動物表演」成為家長在假日帶孩子共同參與的休閒，當動物園成為學校戶外教學的安全選項時，我們該如何向敏感的孩子們解釋生命真正的自由？當孩子們無感地對動物丟擲食物、訕笑時，又該如何向他們傳達萬物平等，應予以尊重、謙卑的生命價值？那些粗糙虛假的造景、對動物冷酷殘忍地對待，不知不覺地影響了孩子們看待世界的角度──人類文化與教育的視野，取決於我們對待生命、對待他者的根本態度。"
  tags:
    chapter:
      publisher: 康軒
      book: 八下
      subject: 國文
