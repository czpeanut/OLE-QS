- id: doc_111_新北_崇林_國文_g8s2e1_s5_6
  section: 5
  number: 6
  type: single
  page: 4
  stem: 時至今日，子女的姓氏已經可由父母雙方自行約定從父或從母姓。據此，下列敘述何者錯誤？
  options:
  - label: A
    content: 剛生產完的婷婷老師對於寶寶的姓氏一直無法跟先生達成共識，因此他們決定到戶政事務所抽籤決定
  - label: B
    content: 達達的媽媽長期酗酒，生活上也多年沒有提供孩子任何照顧和保護。在此狀況下，爸爸可以向法院訴請變更孩子姓氏
  - label: C
    content: 華華的爸爸出海捕魚後音訊全無，至今已四年仍生死未卜。法院可依母女倆的請求，考量華華的利益來決定她從誰姓
  - label: D
    content: 滿二十歲的小傑原本從父姓，上個月為配合壽司促銷活動改成從母姓。這個月炸雞業者辦活動，他可以再改回從父姓
