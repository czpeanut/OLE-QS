- id: doc_111_新北_崇林_國文_g8s2e1_s5_4
  section: 5
  number: 4
  type: single
  page: 4
  stem: 根據文章內容，下列敘述何者錯誤？
  options:
  - label: A
    content: 「抽豬母税」是指母親沒有兄弟可以繼承家族香火，由父親入贅母親家庭
  - label: B
    content: 早期民法有明文規定，子女姓氏應從父姓，贅夫子女才能從母姓
  - label: C
    content: 民國74 年時，從父姓或從母姓會影響子女在法律中的繼承身份
  - label: D
    content: 強制子女從父姓是以父權為尊的價值觀
  group_stem: "(二)從子女姓氏談性別平權                             資料來源：臺灣女人──穿梭的記憶•臺灣女性流轉年華\n\
    \                                                               108年第47週內政統計通報_出生嬰兒從姓統計\n\
    \    子女跟誰姓，在漢人社會中帶有「傳承哪個家族香火」的意味。漢人子女多數從父姓，從母姓為例外。過去子女從母姓主要是因母親家族沒有兄弟，父親入贅母親家庭，俗話稱之為「抽豬母税」。早期民法明文規定子女姓氏從父姓，贅夫子女則從母姓。但為了解決母親家庭沒有兄弟造成香火無法延續的問題，民國74年時，修改為若是母親家中沒有男性可繼承，可以約定從母姓。無論是從父姓或從母姓，皆不影響子女在法律中的繼承身份。\n\
    \    隨著時代的進步，此種「父姓優先」的想法逐漸改變。婦女新知基金會提出修法版本，強調子女強制從父姓是以父權為尊的思考，剝奪了母親的權利，子女姓氏應改由父母雙方協議決定，才是符合性別平權的方式。2007年，立法院通過民法第1059條修改，子女姓氏不再強制從父姓，理應是性別平等的重要里程碑，但在該次修法中，卻為想改姓的家庭帶來更多挑戰。不僅子女的主體性不被重視（成年子女無法自行更改姓氏），且夫妻離婚後，若子女與監護人姓氏不同而要求改姓，必須取得雙方同意書或經由法院訴訟。單親媽媽們若希望孩子改從母姓，往往受到前夫的刁難，或被保守的法官要求提出「從父姓不利」的證據，相關證據又不被法官採信，子女更換姓氏這件事彷彿遙遙無期。在民間團體不斷努力下，2010年的修法正式將姓氏選擇權回歸成年子女，也將改姓時應提出「不利影響」，修改為考量「子女之利益」，真正落實性別平權的理念。\n\
    \    時至今日，子女的姓氏已經可由父母雙方自行約定從父或從母姓，若無法決定，還可於戶政機關抽籤決定。子女的姓氏變更也有更多自主權，成年後子女可以自行到戶政機關變更姓氏；若是未成年人欲變更姓氏，則由父母雙方書面約定同意即可。前二者方式使用次數以一次為限。若是父母雙方無法達成協議，則可在以下幾種情形時交由法院考量子女利益而決定：（1）父母離婚、（2）父母任一方死亡、（3）父母任一方生死不明滿三年、（4）父母一方未盡保護或教養責任。然而，即使法律已妥善保障子女姓氏選擇中的性別平權，但子女從母姓在目前仍不是常態。在呼籲性別平權的當代，如何打破傳統觀念的束縛，讓從母姓不再只是「家中已經有男孩從父姓」後的選擇，是台灣接下來必須持續努力的目標。\n\
    \n表一 出生嬰兒從姓統計 單位：%\n| | 從父姓 | 從母姓 |\n|---|---|---|\n| 104 年 | 95.53 | 4.43 |\n\
    | 105 年 | 95.30 | 4.65 |\n| 106 年 | 95.17 | 4.78 |\n| 107 年 | 94.99 | 4.95 |\n\
    | 108 年 | 94.94 | 5.00 |\n| 新北市 | 95.32 | 4.64 |\n| 高雄市 | 95.23 | 4.73 |\n| 雲林縣\
    \ | 95.11 | 4.89 |\n| 臺東縣 | 82.21 | 17.30 |\n\n表二  出生嬰兒從姓決定方式統計    單位：%\n| | 雙方約定從父姓\
    \ | 雙方約定從母姓 | 一方決定從父姓 | 一方決定從母姓 | 抽籤決定從父姓 | 抽籤決定從母姓 |\n|---|---|---|---|---|---|---|\n\
    | 104 年 | 98.06 | 1.90 | 1.30 | 98.51 | 17.36 | 82.64 |\n| 105 年 | 97.85 | 2.11\
    \ | 1.06 | 98.85 | 15.08 | 84.92 |\n| 106 年 | 97.78 | 2.18 | 1.10 | 98.70 | 15.97\
    \ | 84.03 |\n| 107 年 | 97.58 | 2.36 | 1.36 | 98.54 | 18.06 | 81.94 |\n| 108 年\
    \ | 97.55 | 2.39 | 1.37 | 98.40 | 18.32 | 81.68 |\n\n「一方決定」指的是在寶寶出生登記前，有下列情形：\n\
    1.父母一方死亡\n2.非婚生(不是在合法婚姻關係中受胎而生)，則依母姓登記"
