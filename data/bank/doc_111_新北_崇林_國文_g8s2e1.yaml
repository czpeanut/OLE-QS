  stem: 根據〈北狄〉一文，下列何者不是漢軍不適合與北狄開戰的主要原因？
  options:
  - label: A
    content: 漢軍紀律過於懶散安逸，氣勢怯弱；而北狄勇敢威猛，殺氣騰騰
  - label: B
    content: 漢軍追擊北狄時要攜帶糧餉和鎧甲，但北狄追擊漢軍時用戰馬就運載了所有的軍需品
  - label: C
    content: 漢軍一面耕作一面戰鬥，所以十分疲憊、虛弱
  - label: D
    content: 當爭奪較有利的地勢時，北狄的騎兵總是快於漢軍步兵，雙方速度懸殊很大
  group_stem: "(一) 諸葛亮 將苑\n文一 〈將器〉\n    將之器①，其用②大小不同。若乃察其奸，伺③其禍，為眾所服，此十夫之將；夙興夜寐，言詞密察，此百夫之將；直而有慮，勇而能鬥，此千夫之將；外貌桓桓④，中情烈烈⑤，知人勤勞，悉人飢寒，此萬夫之將；進賢進能，日慎一日，誠信寬大，閒⑥於理亂，此十萬人之將；仁愛洽於下，信義服鄰國，上知天文，中察人事，下識地理，四海之內視如家室，此天下之將。\n\
    \n▲注釋：①器：才能、能力    ②用：本領、作用    ③伺：暗中偵查    ④桓桓：威武勇猛的樣子，音ㄏㄨㄢˊ\n        ⑤烈烈：形容極端強烈，此指情感熱烈\
    \      ⑥閒：同「嫻」，熟習、通曉\n\n文二 〈北狄〉\n    北狄居無城郭，隨逐水草，勢利則南侵，勢失則北遁。長山廣磧①，足以自衛，飢則捕獸飲乳，寒則寢皮服裘，奔走射獵，以殺為務，未可以道德懷②之，未可以兵戎服之。漢不與戰，其略有三。漢卒且耕且戰，故疲而怯；虜但牧獵，故逸而勇。以疲敵逸，以怯敵勇，不相當也，此不可戰一也。漢長於步，日馳百里；虜長於騎，日乃倍之。漢逐虜則齎③糧負甲而隨之，虜逐漢則驅疾騎而運之，運負之勢已殊，走逐之形不等，此不可戰二也。漢戰多步，虜戰多騎，爭地形之勢，則騎疾於步，遲疾勢縣，此不可戰三也。不得已，則莫若守邊。\n\
    \n▲注釋：①磧：沙漠，音ㄑㄧˋ        ②懷：安撫、感化       ③齎：拿、持，此指攜帶，音ㄐㄧ\n        ④縣：同「懸」，遠、差距大"
