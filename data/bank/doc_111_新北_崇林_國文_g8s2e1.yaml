  stem: 北朝民歌的剛健豪放，南朝民歌內容則以男女情愛為主，風格委婉含蓄，常用雙關語。下列何者較符合南朝民歌的特點？
  options:
  - label: A
    content: 幽州馬客吟歌辭，快馬常苦瘦，剿兒常苦貧。黃禾起羸馬，有錢始作人
  - label: B
    content: 男兒欲作健，結伴不須多。鷂子經天飛，群雀兩向波
  - label: C
    content: 春蠶不應老，晝夜常懷絲。何惜微軀盡，纏綿自有時
  - label: D
    content: 遙看孟津河，楊柳郁婆娑。我是虜家兒，不解漢兒歌
