  number: 13
  type: single
  page: 2
  stem: '四位同學看完《仙履奇緣》電影故事後，依據人權與人性尊嚴的概念所做的說明。請問：哪些同學的說法正確？

    | 電影名稱 | 內容 |

    | :--- | :--- |

    | 迪士尼《仙履奇緣》 | 灰姑娘仙杜瑞拉是出生於一個貴族家庭的獨生女，可是她的母親於她童年時去世，她的父親認為她需要一位母親的照顧，於是他另娶同是寡婦的崔梅恩夫人。崔梅恩夫人有兩名為崔西里亞和安泰西亞的女兒，經常欺負她。當仙杜瑞拉的父親過世後，情況變本加厲，被當作奴隸般做著家中粗重的工作，事情沒有做完不准吃飯，漂亮衣服被搶走，還被趕到黑暗的閣樓居住，連她想參加皇宮舉辦的舞會時，繼母也因偏袒自己的女兒而百般阻撓，不准她參加…
    |

    小楠：雖然要做許多家事，但繼母還是提供仙杜瑞拉吃住，享有基本人權

    小梓：仙杜瑞拉所遭受的待遇與姊姊不同，基本人權並未受重視

    阿國：仙杜瑞拉被繼母和姊姊當作僕人使喚，人性尊嚴受到侵害

    阿中：仙杜瑞拉有表達想去舞會的意願，證明她的意見有被傾聽'
