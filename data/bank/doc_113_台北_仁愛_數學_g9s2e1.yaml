  section: 1
  number: 25
  type: single
  page: 4
  stem: '天氣瓶又稱風暴瓶，是一種歐洲曾在18 世紀~19 世紀時用於天氣預報的工具，依據外界溫度、天氣的改變，瓶內液體會展現出不同型態的結晶來預報天氣的變化；通常溫度高於
    28℃ 時，瓶內會是清澈的，但隨著溫度逐漸下滑，會開始慢慢落下凝結核，瓶中就像下雪一樣美麗，當溫度更低，則會有像羽毛、針狀等各式不同的結晶樣貌。

    上圖為小愛利用柱高12 公分的直三角柱形封閉容器所製作的天氣瓶，其底面為腰長5 公分、底邊長6公分的等腰三角形，原先直立擺放時液面高度為9公分，後來小愛將天氣瓶改成如圖所示的水平擺放，過程中瓶內的液體量未改變，若不計容器厚度，則液面高度變為多少公分？'
