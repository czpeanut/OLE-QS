- id: doc_112_彰化_福興_社會_地理_g7s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 「一九八〇年代，巴西由於地廣人稀，採取開放的移民政策，歡迎農業及技術人員前往，只要領有農業或技術證明，再出示一份由巴西公司開具的聘書，就可以成行。當時的巴西也有足夠吸引移民的條件，如公共建設宏偉、經濟自由開放、自然資源豐富。當年的台灣，物資缺乏、經濟發展也才剛起步，反觀巴西謀生之易和民情的淳厚，吸引了一波波的移民，加上巴西允許以集體方式移民，於是許多人呼朋引伴、攜家帶眷，甚至整個家族上百人都一起到這裡生根了。」上文摘自《台灣光華》雜誌刊載「台灣移民的失樂園——巴西」一文的內容。依據上文人口遷移的因素來說，下列何者正確？
  options:
  - label: A
    content: 台灣自然資源豐富，是一種拉力
  - label: B
    content: 台灣物資缺乏，是一種推力
  - label: C
    content: 巴西農業發達，是一種拉力
  - label: D
    content: 巴西的公共建設宏偉，是一種推力
