  type: single
  page: 2
  stem: '圖8為重力波之示意圖，雙星(以黑洞為例)以緊密而快速的模式互相環繞對方時，會產生以光速向外傳播的重力波。2017年物理諾貝爾獎頒給證實重力波存在的三位物理學家，他們在2015年偵測到一個來自雙黑洞系統產生的重力波訊號，如圖9所示，雙黑洞系統最主要會經歷旋近、合併、而歸於沉靜的過程，在它們彼此旋近過程所產生的重力波，波的振盪會由緩漸急、由弱漸強；而在快速合併的過程中，產生的重力波之頻率與能量則會漸增，最終合併為一時，重力波將歸於沉寂。

