  section: 3
  number: 31
  type: single
  page: 3
  stem: 海研船可以藉由聲納、岩芯採樣等設備，來發掘海底的寶物。而聲納是使用「超聲波」作為水下目標物定位與測量其距離的航海設備。則關於「超聲渡」的敘述，下列何者正確？
  options:
  - label: A
    content: 屬於能量很強的聲波
  - label: B
    content: 頻率高於20000Hz 的聲波，稱為超聲波
  - label: C
    content: 波速大於340m/s 的聲波，稱為超聲波
  - label: D
    content: 與原聲速的波源距離17m 以上所反射回來的聲波，稱為超聲波。
  group_stem: "【31~32 題為題組】\n 因應海洋研究需求，科技部打造三艘16 億的研究船「新海研1 號、2 號、3 號」投入海洋研究的行列。海研船載著先進的儀\
    \ 器，就像是海上的「 尋寶船」，可以藉由聲納、岩芯採樣等設備，來發掘海底的「  寶物」、揭開海平面下的秘密，無論是對天然海底資源的開採，或是海軍潛艦攻擊與防衛皆很重要。\n\
    \ 更厲害的是，海研船甚至能為國家擴大「海權」。根據《聯合國海洋法公約》規定：如果沿海圓的陸地領土有自然延伸的海床和底土範圍 (大陸棚範圍)，就算超過200\
    \ 海哩的專屬經濟區(BEZ)，該國仍有海底資源開發權。2012 年日本就曾向聯合國申請擴大31 萬平方公里的大陸棚面積，相當於其國土的82%，大大增加日本對海域探勘與資源開採權，可是讓韓國、中國氣得跳腳\
    \ ！                                 文章來源： PanSci  泛科學"
