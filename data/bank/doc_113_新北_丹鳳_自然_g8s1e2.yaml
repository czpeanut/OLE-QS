- id: doc_113_新北_丹鳳_自然_g8s1e2_s3_33
  section: 3
  number: 33
  type: single
  page: 3
  stem: 警察常用「聲紋比對」來鑑定罪犯，「聲紋比對」主要是比對聲音的哪一種特性？
  options:
  - label: A
    content: 頻率
  - label: B
    content: 波形
  - label: C
    content: 週期
  - label: D
    content: 振幅。
  group_stem: "【33~34題為題組】\n     聲音的DNA：聲紋辨識\n聲音跟指紋一樣，都有獨一無二的特定性，而在利用聲音的特性做辨識時，就稱為聲紋辨識。我們接到熟識親朋好友來電時，他們不用說他是誰，我們只要一聽到聲音就能辨識。這是因為每個人的說話特性不同，聽聲音就能辨識說話者。\n\
    \ 而我們的語音訊號中可供辨識的因素，主要可分為三個面向：發音器官的差異、說話方式的差異、說話內容的差異。上述的這些差異都可作為我們辨識說話者的依據。而其中說話方式和內\
    \ 容可能被他人學習、模仿，只有發音器官的差異是天生的，無法被模仿且再分析，所以許多辨識系統是採用發音的聲學特徵(acoustic features)，例如，聲音頻率、音色等特性都可作為辨識的依據。\n\
    文章來源：聲音的 DNA 聲紋辨識 － PanSci 泛科學"
