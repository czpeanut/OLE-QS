    content: 乙詩是作者因蓮花而有所感慨，想到自己的境況亦如此
  - label: D
    content: 乙詩中，作者認為在每個人在立身處世時應該謹慎小心。
  group_stem: '（二）

    甲、

    本無塵土氣，自在水雲鄉。楚楚淨如拭，亭亭生妙香。

    （唐 鄭允瑞 詠蓮）

    乙、

    汙溝貯濁水，水上葉田田。我來一長嘆，知是東溪蓮。

    下有青汙泥，馨香無復全。上有紅塵撲，顏色不得鮮。

    物性猶如此，人事亦宜然。託根非其所，不如遭棄捐。

    昔在溪中日，花葉媚清漣。今年不得地，憔悴府門前。

    （唐 白居易 京兆府新栽蓮）'
