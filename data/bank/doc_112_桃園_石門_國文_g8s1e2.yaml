- id: doc_112_桃園_石門_國文_g8s1e2_s2_13
  section: 2
  number: 13
  type: single
  page: 1
  stem: '（甲）失敗「為」成功之母／道不同不相「為」謀

    （乙）濯清漣「而」不妖／可遠觀「而」不可褻玩焉

    （丙）僅次「於」黏在膠紙上的蒼蠅／苛政猛「於」虎

    （丁）花「之」君子者／余獨愛蓮「之」出淤泥而不染

    以上「」中的字義，何者前後相同？'
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 甲丁
  - label: C
    content: 乙丙
  - label: D
    content: 乙丁。
