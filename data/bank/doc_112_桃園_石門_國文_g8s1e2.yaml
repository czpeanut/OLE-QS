- id: doc_112_桃園_石門_國文_g8s1e2_s3_37
  section: 3
  number: 37
  type: single
  page: 3
  stem: 采儒想要學習科學飼養倉鼠，請問以下哪一個方式是錯誤的？
  options:
  - label: A
    content: 提供多種不同的墊料，豐富環境
  - label: B
    content: 籠內墊料高度達到90公分以上
  - label: C
    content: 提供躲避屋、隧道等作為遮蔽物
  - label: D
    content: 放入蛇、蜥蜴等天敵激發其野性。
  group_stem: "（一）\n  相信飼養過倉鼠的人，大部分都看過「焦慮的倉鼠」，有咬籠子、吊單槓、飛簷走壁當蜘蛛人等雜技般的行為，然而，這些並非倉鼠想要取悅人類的動作，而是逐漸喪失自然天性的「刻板行為」。\n\
    \  「刻板行為」是指動物做出一成不變的動作，高頻率重複無目的性的行為，都屬於刻板行為。\n  為什麼動物會出現刻板行為呢？因為牠們逐漸喪失自然天性，失去其狩獵、採食的能力。當生活環境無法滿足動物的生理及心理需求時，就會出現刻板行為，在被圈養的動物中尤為常見。為了減少刻板行為，就需要為環境採取豐富化的布置、食物多樣性以及提供感官的變化。\n\
    \  對於倉鼠，不管你換成多大的籠子，都有可能表現出「刻板行為」，因為你的籠子絕不可能跟一顆地球、一片草原、一塊原野般大，所以我們飼養倉鼠必須盡量提供寬大籠具與豐富環境「降低刻板行為的頻率」。\n\
    \  在2005年K. Fischer的論文中，其研究雌性黃金鼠在不同尺寸的籠子內的表現，實驗從1800平方公分連續不間斷的底面積，提升到1萬平方公分，啃咬籠子的頻率與時長都逐漸下降。因此取得結論：建議黃金鼠能夠使用1萬平方公分或更大的籠子。\n\
    \  在2005年A. Hauzenberger的論文中表示：「將籠子作為倉鼠居住適宜性的唯一標準是不夠的，必須藉由環境激發倉鼠的自然行為」。在實驗數據中，在墊料達到40公分以上時，倉鼠才開始有打洞、築巢的行為，並且啃咬籠子的刻板行為頻率明顯降低。當墊料厚度達到80公分以上時，倉鼠咬籠的情況完全消失。\n\
    \  在我們達到倉鼠籠具的基礎飼養面積、厚鋪墊料之後，我們應該考量該如何使倉鼠能夠更貼近自然，使其可以探索周遭環境，還能躲避、攀爬、挖洞、獵捕、儲藏食物。\n\
    \  飼主可以設置不同分區的墊料，如：椰土、花草墊料、穀穗、苔癬等。以多樣化的籠內布置，帶給倉鼠新鮮感，減少無聊與不適。\n  因倉鼠在自然界中多為被捕食者的角色，且倉鼠為穴居動物，因此在環境布置上增加「躲避屋」、「多居室」會更符合倉鼠的習性。除了躲避屋外，也能夠使用葡萄藤、樹洞、隧道等作為遮蔽物，讓倉鼠可以自由探索。\n\
    （本文改寫自鼠餅芝士 10分鐘了解倉鼠科學飼養）"
