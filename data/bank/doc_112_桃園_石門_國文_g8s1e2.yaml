- id: doc_112_桃園_石門_國文_g8s1e2_s2_16
  section: 2
  number: 16
  type: single
  page: 1
  stem: 以下對於《森林最優美的一天》文本解釋，何者有誤？
  options:
  - label: A
    content: 「走近盛開的山黃梔，他的濃香令人嗆鼻，幸好在這片森林裡也不過兩株，而且長在山崖上，山風總是把香味散播得很廣很遠，也變得濃淡適宜」指距離產生美感，使嗆鼻花香變得舒適宜人
  - label: B
    content: 「迎面而來的是許許多多雪片一般飛落的油桐花，飄盪著、旋轉著，好像天女散花一般」作者以油桐花的色彩聯想到雪片，並以動態描寫油桐花飄落的情景，使讀者有「數大便是美」的感受
  - label: C
    content: 「這比歡迎國王或總統的紅地毯還要美麗、莊嚴、高貴，因為它只使用一次。我戰戰兢兢的地踩著落花前進，唯恐腳印破壞了這稀世白花地毯」作者以國王的紅地毯襯托油桐花白地毯的珍貴，也表現出作者對於大自然的虔誠與尊敬、珍視與愛護的態度
  - label: D
    content: 「我認為自己已丟棄了軀殼，正輕鬆自在又滿足地走上通往更高境界的地方」作者靈魂出竅，脫離肉體的拘束，僅以靈體探訪森林。
  lesson_raw:
    title: 森林最優美的一天
    basis: 題目指名《森林最優美的一天》文本解釋
