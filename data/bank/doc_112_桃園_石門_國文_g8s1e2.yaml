- id: doc_112_桃園_石門_國文_g8s1e2_s2_14
  section: 2
  number: 14
  type: single
  page: 1
  stem: '陶淵明曾在多首詩中提及菊花，如：「秋菊有佳色，裛露掇其英。」、「採菊東籬下，悠然見南山。」因此後世學者在提及菊花時便會聯想到陶淵明，除此之外也有其他例子。

    請判斷以下選項中提及的植物與配對人物何者正確？'
  options:
  - label: A
    content: 接天蓮葉無窮碧，映日荷花別樣紅──李太白
  - label: B
    content: 冰雪林中著此身，不同桃李混芳塵──林和靖
  - label: C
    content: 一騎紅塵妃子笑，無人知是荔枝來──王昭君
  - label: D
    content: 碧玉妝成一樹高，萬條垂下綠絲絛──蘇東坡。
  tags:
    textbook: 八上 第七課 愛蓮說
    labeled_by: ai
    chapter:
      publisher: 康軒
      book: 八上
      subject: 國文
      code: 第七課
      title: 愛蓮說
      chapter: null
