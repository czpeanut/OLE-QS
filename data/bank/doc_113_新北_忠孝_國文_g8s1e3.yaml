- id: doc_113_新北_忠孝_國文_g8s1e3_s2_34
  section: 2
  number: 34
  type: single
  page: 4
  stem: 關於本文希望傳達的概念，與下列何者相符？
  options:
  - label: A
    content: 以法律保護自然環境，以品德創建社會文明
  - label: B
    content: 心動不如行動，與其抱怨不如親身實踐綠色生活
  - label: C
    content: 綠建築有愛無「礙」，應儘速推廣以利整體發展
  - label: D
    content: 環保共識不分民族，重視生態的理念沒有國界
  group_stem: "(丁)「綠建築」在各國有不同的名稱，定義及內涵也略有差異。\n以鄰近的日本為例，其綠建築最早之發展稱「環境共生住宅」，其內涵包括「地球環境的保全」、「周邊環境的親和」、及「健康快適的居住環境」等三個層次，而綠建築在歐洲國家稱為「生態建築」或「永續建築」，主要強調生態平衡、保育、物種多樣化、資源回收再利用、再生能源及節能等永續發展課題。\n\
    而在美國、加拿大等國，即稱綠建築，主要講求能源效率的提升與節能、資源與材料妥善利用、室內環境品質及符合環境容受力等。\n由此可知，雖然「綠建築」的內涵，具有隨著各國能源、資源及環境條件不同而調整的特性，但整體而言，各國對建築開發行為的訴求，也都具有減少環境負荷，達到與環境共生共榮共利的共識。\n\
    因此，由上述綠建築的涵義得知，綠建築設計概念，即在強調由地球環保的角度出發，以全面化、系統化的環保設計作為訴求的永續建築設計理念，從積極面觀點，「綠建築」可定義為：「以人類的健康舒適為基礎，追求與地球環境共生共榮，及人類生活環境永續發展的建築設計」，因此綠建築評估系統必須依據氣候條件、國情等的不同，而有所調整，並不是一體適用的。\
    \ \n----<何謂綠建築>"
