  group_stem: "(己)雖然帳篷內充滿了嘈雜聲，卻只見一位老太太坐在入口前。見男人東張西望，於是老太太開口說道：\n「第一次來嗎？一小時一枚金幣。」\n\
    接著她將破破爛爛的黑色帳簿推到男人面前，帳簿的第一頁寫著「活著的圖書館使用守則」。\n 一、書即是人。\n 二、出借一小時為一枚金幣，只能延長一次。\n 三、借出的書籍只能在閱覽室閱讀，不能外帶。\n\
    \ 四、另外提供閱覽時所需的翻譯機，租借費用為一枚銀幣。\n 五、不可對書的內容表示不滿。無論在任何情況下，費用都不會歸還。\n 六、若有毀損書籍之情況，借書者必須負起民、刑事責任。\n\
    打開帳簿後即是目錄。第一個項目是「看守」，下方以小字寫著「在監獄看守罪犯長達十七年，目前正在接受酒精成癮治療，可預約出借。」下一章則寫有「騙子——不得借給十二歲以下兒童。」\n\
    \ 「這是什麼呢？」\n 「正如你看到的，借的是人書。」\n 「您說人是一本書？」\n 「是啊。」\n 「那要怎麼閱讀？用聊天的方式嗎？」\n 「嘖嘖，要真好奇的話就借書吧，不管你問什麼都會回答你的。」\
    \ （金李璟 活著的圖書館）"
