    content: 甲文善用白描手法；乙文善用誇飾手法
  group_stem: '(甲)、午睡在雷聲中醒來，脆急沈厚的聲音響在囚房外。一場大雨應該就會接著而來的；我聞得出雨的味道。若在家鄉盛夏的平原上，這必是一番壯闊的景象：涼風、奔馳的陰雲以及稻田間頓時高昂起來的蛙鳴，然後，父親可能就會穿起雨衣，扛著鋤頭，要掘水路去。
    （陳列《地上歲月》）


    (乙)、下午大雨滂沱，霹靂環起。若非蕃薯田在家屋邊，近在咫尺，真要走避不及。低著頭一心一意要把番薯蒂趕快摘完，霎時間，天昏地暗，抬頭一看，黑壓壓的，滿天烏雲，盤旋著，自上而下，直要捲到地面。這種景況，在荒野中遇到幾回。只覺滿天無數黑怪，張牙舞爪，盡向地面攫來。四顧無人，又全無遮蔽，大野中，孤伶伶的一個人，不由膽破魂奪。

    （陳冠學《田園之秋》）'
