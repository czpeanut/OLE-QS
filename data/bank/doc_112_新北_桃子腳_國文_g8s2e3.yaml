- id: doc_112_新北_桃子腳_國文_g8s2e3_s3_44
  section: 3
  number: 44
  type: single
  page: 6
  stem: '根據上面文章，圖表中鯨魚與海豚的比較，何者正確？


    | | (Ａ)<br>身體構造 | (Ｂ)<br>潛水能力 | (Ｃ)<br>游泳方式 | (Ｄ)<br>尾鰭組織 |

    | :--- | :--- | :--- | :--- | :--- |

    | 鯨魚 | 有一個噴氣孔，沒牙齒 | 潛得較淺，且時間較短 | 尾鰭左右搖擺以前進 | 含骨質的「硬鰭條」 |

    | 海豚 | 有兩個噴氣孔，有牙齒 | 潛得較深，且時間較長 | 尾鰭上下擺動以前進 | 無骨頭，內有堅韌纖維 |'
  options:
  - label: A
    content: (Ａ)
  - label: B
    content: (Ｂ)
  - label: C
    content: (Ｃ)
  - label: D
    content: (Ｄ)
  group_stem: "鯨和豚主要差異是體形大小，通常以 3～4.5 公尺的體長為區分基準，超過這個基準稱為鯨魚，小於這基準則稱為海豚。鯨目分齒鯨亞目和鬚鯨亞目。鯨魚屬於鬚鯨類，而海豚屬於齒鯨類。\n\
    \  鬚鯨有兩個噴氣孔，沒有牙齒，是使用鯨鬚攝食的濾食性動物。攝食方式是喝進一大口含小魚蝦的海水，閉上嘴巴後，透過鯨板空隙排掉海水，吃下擋住的小魚蝦；有些鬚鯨還能把下巴鬆脫，讓嘴巴張更大。齒鯨只有一個噴氣孔，有牙齒可咬並固定獵物，但無咀嚼功能。且牙齒數量與大小依食物種類而不同。\n\
    \  多數魚類全身多有鱗片，而鯨豚身上光滑無鱗片，也不像陸生哺乳類有毛皮。另外，魚的背鰭和尾鰭內有一條條細長含骨質的「硬鰭條」，而鯨豚的背鰭和尾鰭內沒有骨頭，只有堅韌的纖維組織。\n\
    \  鯨豚和魚最重要區別是游泳方式；魚類靠尾鰭左右擺動讓身體前進，鯨豚是藉尾鰭上下擺動，讓身體向前及向下，使經過身體向後流到尾鰭的水速度增加。所以鯨豚尾巴很有力，是其他哺乳動物十倍力道。\n\
    \  鯨豚用肺呼吸，魚用鰓在水裡呼吸。而原本長在鯨豚嘴巴前端的鼻孔，經過演化將噴氣孔往頭頂位置移動，就是現在看到鯨豚的噴氣孔在頭頂正上方，只要頭頂露出水面就能換氣呼吸。因特殊的呼吸系統和魚的鰓不同，所以鯨豚潛入水中時間不能太長。可以想像鯨豚用頭頂上的噴氣孔「噴氣」，就像人的鼻孔用力深呼吸，再潛到海裡。所以，當肺中的空氣在深海受強烈壓縮，壓縮的空氣經噴氣孔強力擴散，就形成我們看到的噴水錯覺。實際上噴出來的不是海水，是吐氣時噴出的蒸氣。\n\
    \  不同鯨豚潛水能力雖不同，卻都是靈巧的潛水者。觀察其潛水深度，以齒鯨潛得較深，約 3000 公尺深，每次潛入水中約可維持 1 小時；鬚鯨類卻只能潛約 350\
    \ 公尺，每次能在水中維持 10 至 15 分鐘。鯨豚有時一天可睡上整整 24 小時，要呼吸就得保持一個腦半球處於睡眠狀態，牠們會浮在水面上一邊游動一邊睡覺，這麼特殊的方式，鯨豚自然不會在睡覺時溺水，且不沉睡又能得到需要的睡眠呢！\n\
    \                             ──改寫自網路文章"
  tags:
    chapter:
      publisher: 翰林
      book: 八下
