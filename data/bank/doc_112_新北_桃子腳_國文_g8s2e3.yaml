  group_stem: "會影響我們對事情的看法。\n  坐在車裡望向窗外，公路遠方是蔚藍的海，映著晴天白雲，海是那樣的遼闊寧靜，美得像一幅鑲在框中的風景畫，我是一個悠然看畫的人。等到下了車，走上好長一段礫石小路，穿過矮小的灌木叢真正到了海邊，海是那樣洶湧混濁，潮浪將許多奇怪的廢棄物沖上沙灘，海還是很美，但那是力量與神祕之美，我此刻成了一個渺小的生物，心中充滿對海的敬畏。\n\
    \          修飾掉事物本來的特質，使人產生誤解。如久居城市裡的人，總以為在鄉下種田最快樂，殊不知烈日下揮鋤鬆地或彎腰拔草，其實非常辛苦。有些朋友看我整天坐在電腦前寫作，總說我的工作最輕鬆，但他們不明白有時我苦無靈感時心中的焦慮，經常難以成眠。因為\
    \        ，使我們永遠羨慕對岸的風景，忘了其實對岸的人也正對我們這充滿嚮往。\n           ──徐國能〈寫在課本留白處〉"
