- id: doc_112_新北_桃子腳_國文_g8s2e3_s3_37
  section: 3
  number: 37
  type: single
  page: 5
  stem: 根據本文，「里山」的定義最接近於下列何者？
  options:
  - label: A
    content: 原住民族的傳統部落
  - label: B
    content: 人跡罕至的原始荒野
  - label: C
    content: 有瀕危物種生存的森林
  - label: D
    content: 人類與自然交疊的地方。
  group_stem: "在台灣，我們生態學者總喜歡強調荒野，特別是沒有人的地方。這一天，我站在田埔的小米田中，望向遠方，的確看到了想像中的荒野。這裡面可能有檜木、扁柏、雲豹、黑熊、藍腹鷴、帝雉或是櫻花鉤吻鮭等瀕危的物種，這是國家公園與保育單位關注的重點，但是在這種荒野意象中，我們看不到人。\n\
    \    有趣的是，當我從荒野視角一回頭，在我身旁卻很輕易就看到部落的媽媽們，正在辛勤播種小米。這裡是家園與荒野交會的地方，用現在的流行語來說，這裡正是「里山」（Satoyama）。我跟著婦女們流暢的勞動節奏，一階一階地從低處的田地一路往上播種。婦女們並沒有分散在十塊田中去耕作自己的責任區，而是一區一區集體合作，一路由下往上種。\n\
    \    在勞動中，我的視野由遠而近、由下而上，跟著他們的節奏走進這個小米地景。我看到荒野中有人的腳蹤，他們跟周遭的森林、野獸、蟲魚不是截然二分的。這裡是「族鄉」（country），這裡有自然的節奏與人的勞動交織出的關係。我看他們或跪、或坐、或蹲、或是匍匐在土地上，煞是辛苦，但是在過程中因為合作與集體所帶來的成就，解除了許多身體的勞累，反而在心靈上得到許多滿足。\n\
    \    小米地景展現許多療癒的效果，不僅是身體上的，而是在社會關係與人地關係上，讓人與自然能更緊密互動。在這裡，荒野不荒，土地有情，於是成就了家園的重要內涵。我猜想是這樣的力量讓婦女願意靠近小米田，也讓他們得到療癒。\n\
    \        ──林益仁〈山櫻花綻放時的小米田〉"
