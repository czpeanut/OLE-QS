  stem: 請判斷下列文句，何者的主詞為工之僑？
  options:
  - label: A
    content: 使國公視之
  - label: B
    content: 抱以適市
  - label: C
    content: 易之以百金
  - label: D
    content: 不知其所終。
  group_stem: "工之僑得良桐焉，斫①而為琴，弦而鼓②之，金聲而玉應。自以為天下之美也，獻之太常③。使國工④視之，曰：「弗古。」還之。工之僑以歸，謀諸漆工，作斷紋焉；又謀諸篆工，作古窾⑤焉。匣而埋諸土，期年出之，抱以適市。貴人過而見之，易之以百金，獻諸朝。樂官傳視，皆曰：「希世之珍也。」\
    \ 工之僑聞之，嘆曰：「悲哉世也！豈獨一琴哉？莫不然矣！而不早圖之，其與亡！」遂去，入於宕冥之山，不知其所終。\n                    \
    \   ──劉基《郁離子》\n① 斫：音ㄓㄨㄛˊ，用刀斧砍削。\n② 鼓：彈奏。\n③ 太常：古代掌管祭祀禮樂之官府。\n④ 國工：國內一流的樂師。\n⑤\
    \ 窾：同「款」，古代鐘鼎器物上鑄刻的文字。"
  lesson_raw:
    title: 工之僑為琴
    basis: 引用劉基《郁離子》〈工之僑為琴〉
