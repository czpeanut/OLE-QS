    content: "小竹：《原住民族狩獵管理辦法》與《原住民族教育\n           法施行細則》兩者法律位階相同"
  - label: D
    content: "小菊：《原住民族狩獵管理辦法》及《原住民族基本\n           法》兩者法律位階相同。"
  group_stem: '林務局一連兩天針對修正《原住民族狩獵管理辦法》，

    舉辦座談會與說明會，其中有原民團體提出修正條文

    第3 條中規定，狩獵範圍要依照《原住民族基本法》

    所定的原住民族地區內，且非屬依法禁止獵捕動物或

    捕捉魚類的區域，但實際狩獵範圍常常和國家公園法

    產生衝突，希望能訂定相關條文做協調。'
