  type: single
  page: 1
  stem: 與 921 說再見：20 年的生命練習題一文的篇章結構和寫作手法，下列何者為非?
  options:
  - label: A
    content: 本篇為報導文學，除了著重記錄事實外，也還原受訪者的語言、語氣，讓讀者體會受訪者的心情與心境轉折。
  - label: B
    content: 敘事結構的安排，以阿倫的故事開頭，中間輔以其他失依兒的故事、社工的敘述，呈現這二十年來的工作過程
  - label: C
    content: 本文分為序言、歷經傷痛、面對傷痛、療癒過程、自我成長五大部分書寫而成。
  - label: D
    content: 末段以阿倫的口說描述其轉變歷程，首尾呼應，前後連貫。
  lesson_raw:
    title: 與921說再見：20年的生命練習題
