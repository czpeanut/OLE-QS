  type: single
  page: 3
  stem: 各國政府為了解決貧窮祭出許多政策。根據作者觀點，若依照有效程度排列，下列何者最恰當?
  options:
  - label: A
    content: 發放紓困金>延期償還貸款>提高最低生活薪資
  - label: B
    content: 延期償還貸款=提高最低生活薪資>發放紓困金
  - label: C
    content: 提高最低生活薪資>發放紓困金=延期償還貸款
  - label: D
    content: 提高最低生活薪資>延期償還貸款>發放紓困金。
  group_stem: 疫情造成許多民眾頓失工作，美國政府趕忙發放紓困金以解燃眉之急。其他國家也祭出一些紧急措施以紓解疫情災民的痛苦，最廣為採納的是債務宽減，延期償還貸款是提供快速且必要救濟的有效方法，這項措施已幫助了數百萬受因家庭。但上述這些政策措施充其量只能解暫時之急，無法一勞永逸根絕使他們陷入貧窮的結構性問題，釜底抽薪之道是提高最低「生活薪資」，提供足以維持生活的所得
    。----改寫自經濟日報
