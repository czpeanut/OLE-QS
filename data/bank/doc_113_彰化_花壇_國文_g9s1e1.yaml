  stem: 「悲歡離合總無情，一任階前點滴到天明」，此呈現出歷經滄桑、飽嘗憂患後的超脫、閒適，其意境不同於下列哪一項？
  options:
  - label: A
    content: 兩腳踢翻塵世浪，一肩擔盡古今愁
  - label: B
    content: 人間多少興亡事，不值青山一笑看
  - label: C
    content: 一壺濁酒喜相逢，古今多少事，都付笑談中
  - label: D
    content: 而今識盡愁滋味，欲說還休。欲說還休，卻道天涼好個秋。
  group_stem: "虞美人 聽雨 蔣捷\n 少年聽雨歌樓上，紅燭昏羅帳。壯年聽\n雨客舟中，江闊雲低，斷雁叫西風。\n 而今聽雨僧廬下，鬢已星星也。悲歡離\n\
    合總無情，一任階前點滴到天明。\n ①星星：頭髮花白的樣子。"
