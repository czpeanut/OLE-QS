- id: doc_113_彰化_花壇_國文_g9s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 「放下過去，你才能過得更幸福！努力地改變你的心態，調節你的心情。學會平靜地接受現實，學會對自己說聲順其自然，學會坦然地面對厄運，學會積極地看待人生，學會凡事都往好處想。」上述文句，是指要有怎樣的態度？
  options:
  - label: A
    content: 絕不向命運低頭
  - label: B
    content: 樂觀且勇於放下
  - label: C
    content: 勇於挑戰不可能
  - label: D
    content: 只力求無愧於心。
- id: doc_113_彰化_花壇_國文_g9s1e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 「少年不識愁滋味，愛上層樓。愛上層樓，為賦新詞強說愁。而今識盡愁滋味，欲語 還休。欲語還休，卻道天涼好個秋。」有關這一闕詞的敍述，下列選項何者不正確？
  options:
  - label: A
    content: 使用類疊，讀來自然流暢
  - label: B
    content: 使用映襯的手法，以凸顯心情的轉變
  - label: C
    content: 使用層遞的手法，以呈現時間的推移
  - label: D
    content: 使用頂真，透露出對時間飛逝的驚駭。
  lesson_raw:
    title: 醜奴兒
    basis: 引用辛棄疾〈醜奴兒·書博山道中壁〉
