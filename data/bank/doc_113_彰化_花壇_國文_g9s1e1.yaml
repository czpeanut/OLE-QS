- id: doc_113_彰化_花壇_國文_g9s1e1_s3_1
  section: 3
  number: 1
  type: single
  page: 3
  stem: 根據本文,關於「越南咖啡店」的特色，下列敘述何者有誤?
  options:
  - label: A
    content: 法國殖民六十年留下最大的影響
  - label: B
    content: 可以在這裡等待賽事或空餘時光。
  - label: C
    content: 藍領階級下班聚集的荼攤或酒館
  - label: D
    content: 因為缺煉乳於是改成加新鮮牛奶。
  group_stem: "在越南，法國殖民地近六十年留下最明顯的痕跡大概就是咖啡店吧。由於早期酪農業無法供應足夠的牛奶，法國的 cafe au lait 到了越南就變成咖啡和煉乳一比一再加入大量冰塊稀釋冰鎮的\
    \ cà phê dà。但令越南咖啡與眾不同的不只是煉乳。\n 和其他隨著現代化引進咖啡文化的亞洲國家不同，越南傳統的咖啡店通常不大，門口擺著幾張板凳，沒幾條街就是一家。車夫、小販、下了工的人三三兩兩聚在前頭喝咖啡聊天，一坐便是幾個小時，重要運動賽事時更可以看到滿坑滿谷的板凳排遍整路的盛況。\n\
    \ 巧妙的元素代换，像煉乳一樣濃稠 ,流動缓慢的時間，這就是在越南扮演著茶攤和小酒館角色的 cà phê dà 。\n ———改寫自南洋臺灣姊妹會 / 胡頎\
    \ 餐桌上的家鄉"
- id: doc_113_彰化_花壇_國文_g9s1e1_s3_2
