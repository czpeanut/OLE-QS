  section: 1
  number: 20
  type: single
  page: 2
  stem: 下列氣象主播播報的內容，哪個句子的敘述最合理?
  options:
  - label: A
    content: 凱米颱風的豐沛雨量，彈指間雨量累積已超過三十年來紀錄。
  - label: B
    content: 海葵颱風行進緩慢，迅速撲向台灣，氣象局已發布警報
  - label: C
