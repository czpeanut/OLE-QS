- id: doc_113_彰化_花壇_國文_g9s1e1_s2_3
  section: 2
  number: 3
  type: single
  page: 3
  stem: 什麼人容易出現創傷後壓力症候群？
  options:
  - label: A
    content: 家住彰化的喆凱，孑然一身到千里之外的英國劍橋大學當了半年交換生
  - label: B
    content: 一生仕途坎坷，屢遭貶謫的蘇軾
  - label: C
    content: 揮淚斬馬謖的諸葛亮
  - label: D
    content: 親身經歷民國103 年高雄氣爆的陳辰。
  group_stem: "認識「創傷後壓力症候群」\n 創傷後壓力症候群(Post-traumatic stress disorder，PTSD)是指在經歷一場重大事件後，一個人無法恢復正常的生活功能，並且出現下列症狀，維持時間超過一個月。\n\
    \ 最常見的症狀有三類，第一類是腦海中不時冒出慘痛事件的回憶，記憶片段經常無預警地出現，或變成夜裡揮之不去的夢魘，讓人寢食難安。\n 第二類症狀是逃避。患者會避免回到創傷發生的地點，拒絕與創傷相關的人見面，且不再從事與創傷有關的活動。當逃避的想法愈來愈深入，患者的行為表現將愈來愈麻木和冷漠，甚至會迴避任何熟識的人，連家人與朋友都不願相見。許多人亦會使用酒精或其他藥物來麻痺自己。\n\
    \ 第三類症狀是患者變成了驚弓之鳥，日常生活中時時刻刻都覺得心神不寧，無法專心且無法正常入睡，偶爾還會恐慌到心跳加速、冷汗直流。由於精神狀態過度警覺與緊繃，患者很容易受到驚嚇，也無法控制突如其來的怒氣。\n\
    \n透過與 921 說再見：20 年的生命練習題一文及認識「創傷後壓力症候群」上文敘述，完成下面提問:"
  lesson_raw:
    title: 與921說再見：20年的生命練習題
    basis: 與課文〈與921說再見：20年的生命練習題〉相關
- id: doc_113_彰化_花壇_國文_g9s1e1_s2_4
  section: 2
  number: 4
  type: single
  page: 3
  stem: 該如何正確面對創傷後壓力症候群？
  options:
  - label: A
    content: 解鈴仍需繫鈴人，旁人無須多事，患者要靠自己的力量去克服創傷後壓力症候群
  - label: B
    content: 面對傷痛的態度不是把創傷掩蔽，而是學習面對並與他一起前行。
  - label: C
    content: 為了避免患者聯想重大事件發生時的片段，盡量不要讓患者清楚認知，了解自己生理、心理的變化乃源自於重大事件的衝擊。
  - label: D
    content: 有時候患者可能需要服用藥物來改善焦慮、衝動、憂鬱及失眠等症狀，為避免患者創傷後壓力症候群發作，一定要持續性的服藥。
  group_stem: "認識「創傷後壓力症候群」\n 創傷後壓力症候群(Post-traumatic stress disorder，PTSD)是指在經歷一場重大事件後，一個人無法恢復正常的生活功能，並且出現下列症狀，維持時間超過一個月。\n\
