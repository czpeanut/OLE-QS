  - label: D
    content: 山陀兒颱風已登陸，中央氣象局提醒民眾一定要及早做好防颱準備。
- id: doc_113_彰化_花壇_國文_g9s1e1_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 「烏俄戰爭爆發之際，德國一家兒童新聞台製作不同專題的動畫，進駐烏克蘭邊境訪問難民，引導孩童及青少年了解這場戰爭的發生的原因，以及其所帶來的意義與影響，提供他們更切身感同身受的機會。」關於上文，下列何人說法最正確?
  options:
  - label: A
    content: '珍妮: 德國孩童及青少年只能觀看一家電視台'
  - label: B
    content: '呈答: 採用適當方式讓孩童及青少年了解世界'
  - label: C
    content: '儀瑄: 德國人認為烏克蘭和俄國對抗毫無意義'
  - label: D
    content: '梓忱: 讓孩童及青少年進駐戰場以了解其影響。'
- id: doc_113_彰化_花壇_國文_g9s1e1_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 洪蘭:「學校要教的並不是知識本身，而是教學習的方法，因為知識是會被推翻改變的。」關於上述的說明，下列哪個同學的說法正確?
  options:
  - label: A
    content: 逸臣:學校所教的知識有限，且往往會被推翻
  - label: B
    content: 芯宸習得學習方法，比熟記課程內容更為重要
  - label: C
    content: 澄茹:教導學生學習的方法，不如給予完整的學習內容
  - label: D
    content: 瑄毫:教授學習方法十分困難，為學校帶來許多衝擊。
- id: doc_113_彰化_花壇_國文_g9s1e1_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: '根據下段文字，下列敘述何者最恰當？

    一群畢業二十年的小學同學聚會，他們送了一方「眾望所歸」的匾額至襄純的辦公室。宏志：「恭喜老兄， 你當年的理想終於如願以償了。」襄純：「上個月嘉洋弄璋之喜，我未能親臨祝賀，真是過意不去。」嘉洋：「沒關係，衡義下個月喬遷之喜，到時候我們可得大肆慶賀一番！」衡義：「宏志如今廣栽桃李，享譽杏壇，也算是可喜可賀呢！」'
  options:
  - label: A
    content: 嘉洋喜獲千金
  - label: B
    content: 襄純投身政壇
  - label: C
    content: 衡義即將于歸
  - label: D
    content: 宏志行醫仁心仁術。
- id: doc_113_彰化_花壇_國文_g9s1e1_s2_1
  section: 2
  number: 1
  type: single
  page: 2
  stem: 下列詞的敘述，何者不當？
  options:
  - label: A
    content: 「少年聽雨歌樓上」表達出少年青春年華、歡樂無限的歲月
  - label: B
    content: 「壯年聽雨客舟中」意謂壯年時，為生活離鄉背井，到處奔波的無奈歲月
  - label: C
    content: 「而今聽雨僧廬下」告訴我們作者已參透世事，看破紅塵而出家為僧
  - label: D
    content: 由少年、壯年而晚年，層遞出人生的歷程。
  group_stem: "虞美人 聽雨 蔣捷\n 少年聽雨歌樓上，紅燭昏羅帳。壯年聽\n雨客舟中，江闊雲低，斷雁叫西風。\n 而今聽雨僧廬下，鬢已星星也。悲歡離\n\
    合總無情，一任階前點滴到天明。\n ①星星：頭髮花白的樣子。"
  lesson_raw:
    title: 虞美人 聽雨
    basis: 篇名蔣捷〈虞美人 聽雨〉
