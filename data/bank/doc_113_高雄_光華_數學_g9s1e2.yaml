- id: doc_113_高雄_光華_數學_g9s1e2_s3_2
  section: 3
  number: 2
  type: calc
  page: 3
  stem: '在公園有兩座垂直於水平地面且高度不一的圓柱，兩座圓柱後面有一堵與地面互相垂直的牆，且圓柱與牆的距離皆為 120 公分。宥宥觀察到高度 90 公分矮圓柱的影子落在地面上，其影長為
    60 公分；而高圓柱的部分影子落在牆上，如下圖所示。

    已知落在地面上的影子皆與牆面互相垂直，並視太陽光為平行光，在不計圓柱厚度與影子寬度的情況下，請回答下列問題：

    (1) 若宥宥的身高為 162 公分，且此刻他的影子完全落在地面上，則影長為多少公分？(3 分)

