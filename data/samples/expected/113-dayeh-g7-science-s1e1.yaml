# 題組 34~35 的共用閱讀短文
passages:
  - key: PASSAGE_1
    page: 4
    used_by: [34, 35]
    text: |-
      飲食均衡是維持健康的重要原則，目前醫學建議每天的飲食熱量來源以碳水化合物為主，佔 50% 到 60%；
      脂質佔 20% 到 30%；蛋白質佔 10% 到 20%。以下提供幾個重點：

      　　碳水化合物的部分，可以多選擇未精製的全穀雜糧。精緻的穀類或加工後的製品往往會添加過多的油和糖，
      比較不建議。未精製的全穀雜糧，像是糙米、麥片，不僅含有膳食纖維素可以幫助消化，
      還有含有豐富的維生素 B 群、維生素 E 和礦物質，都是大家容易缺乏的營養素。

      　　脂質方面，我們可以盡量選擇屬於不飽和脂肪酸的植物油，像是橄欖油、花生油、芥花油、苦茶油等，
      也可從堅果種子等補充脂質。

      　　蛋白質品質最佳的來源是蛋，而且蛋裡面還有豐富的維生素 A、維生素 B1、和維生素 B2，
      以及鐵與磷等礦物質，所以吃蛋的 CP 值很高。海鮮等水產提供的是動物性蛋白質，脂質量平均來說比肉類來得低，
      比紅肉來的理想。至於吃素的人就得多靠黃豆和黃豆製品來提供植物性蛋白質了。
      需注意：如果有腎臟病要與醫師或營養師了解適當的蛋白質攝取量，避免造成腎臟的負擔。
