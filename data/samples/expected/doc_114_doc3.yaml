  stem: 關於四種讀書的方法,何者說明最接近作者的觀點?
  options:
  - label: A
    content: 精讀強調逐字逐句的認真閱讀,可以精熟專業知識,詩詞、 哲理格言類的書籍最為適用
  - label: B
    content: 略讀的目的是為能快速掌握核心內容,專業本行領域和休閒 性質的書籍皆適合
  - label: C
    content: 重讀可以加深與書籍的情感連結,檢視自己的成長收穫
  - label: D
    content: 默讀的實行方式強調且讀且思,要在安靜的環境中念書才有 助於閱讀與反思書中的價值觀
  answer:
  - C
- id: doc_114_doc3_s3_10
  section: 3
  number: 10
  type: single
  page: 1
  stem: 關於傘一詩,下列敘述何者正確?
  options:
  - label: A
    content: 本詩為詠物詩,第一節著重描寫傘的「形」,運用映襯的方式, 對比出傘初開、半開、全開的形狀,其中「連」字的運用, 更使詩呈現動態之美
  - label: B
    content: 新詩可以不使用標點符號,第二節末使用刪節號,有延伸撐 傘行走移動的效果,也像不斷延展的路
  - label: C
    content: 運用譬喻、短句和重複的字,營造出傘的鮮明形象,強化撐 傘在雨中嬉戲的快樂
  - label: D
    content: 「一傘在握∕開闔自如」表達出「操之在己」的含義,暗示作 者「獨善其身」的心境
  answer:
  - B
