  section: 3
  number: 11
  type: single
  page: 1
  stem: 根據近體詩選中的詩句說明,何者分析有錯誤?
  options:
  - label: A
    content: 「千里江陵一日還」一句,以空間之遠對比時間之短,感受到 順水行舟的輕快
  - label: B
    content: 「即從巴峽穿巫峽,便下襄陽向洛陽」使用「從」、「穿」、「下」、 「向」貫串地名,讓人感覺歸程如飛,作者急切返鄉的心情
  - label: C
    content: 「兩岸猿聲啼不住,輕舟已過萬重山」運用聽覺和視覺摹寫襯 托出船行輕快,展現作者急欲歸隱的決心
  - label: D
    content: 「涕淚滿衣裳」、「愁何在」、「喜欲狂」都能感受到作者內心喜 悅,又驚又喜的情緒
  answer:
  - C
