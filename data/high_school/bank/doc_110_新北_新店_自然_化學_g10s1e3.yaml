    content: $Cu^{2＋}$為氧化劑，被還原
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A) $Cu^{2+}$為氧化劑；(B)失去2個電子；(C) Zn為還原劑；(D) $Cu^{2+}$為氧化劑，被還原，正確。故選(D)。
