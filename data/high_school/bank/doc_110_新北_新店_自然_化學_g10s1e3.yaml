  stem: 關於反應Zn(s)＋$Cu^{2＋}$(aq) → Cu(s)＋$Zn^{2＋}$(aq)，下列敘述何者正確？
  options:
  - label: A
    content: Cu為氧化劑，被還原
  - label: B
    content: Zn被氧化，得到兩個電子
