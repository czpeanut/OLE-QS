  answer_status: verified
  answer_source: answer_key
  explanation: 紫外光最適合當奈米二氧化鈦光觸媒的光源。故選(E)。
- id: doc_110_新北_新店_自然_化學_g10s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列有關水淨化的钕述，何者正確？
  options:
  - label: A
    content: 利用沉降法可以除去水中懸浮微粒
  - label: B
    content: 明礬可以當凝聚劑
  - label: C
    content: 曝氣是要提高水中溶氧量，增加臭氧的殺菌力
  - label: D
    content: $Cl_{2}$與$O_{3}$可當水的消毒劑，是因為它們的惰性
  - label: E
    content: 利用活性碳過濾床可除去水中的有機物質和無機物質
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)無法除去所有水中懸浮物；(B)正確；(C)無法增加臭氧殺菌力；(D)氧化力（活性大）；(E)只能去除不良氣味及顏色的有機物。故選(B)。
