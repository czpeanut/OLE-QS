- id: doc_112_台北_師大附中_社會_公民與社會_g10s1e1_s2_41
  section: 2
  number: 41
  type: single
  page: 11
  stem: 從過去到現在，政府面對不同語言所採取的政策，下列解釋何者較為恰當？
  options:
  - label: A
    content: 說國語運動將母語視為比華語更高的文化位階
  - label: B
    content: 說國語運動顯示當時華語族群具社會位置的優勢
  - label: C
    content: 說國語運動是當時政府採行的積極性平權措施
  - label: D
    content: 政府制定《國家語言發展法》恐形塑文化位階的產生
  group_stem: '1956 年，國民政府開始進行「說國語運動」。若小孩在學校講母語，更會受到公開的羞辱、懲罰，造成「講母語」一事變得羞恥與自卑。直到 2019 年，我國公布《國家語言發展法》，以法律明定臺灣固有族群使用之自然語言及臺灣手語都是國家語言，包含臺灣閩南語、客語、原民語、閩東語（馬祖）、臺灣手語五種。所有語言一律平等，不該受到限制與歧視。

    然而各語言的使用人口及保存狀況不太相同。根據 2020 年統計，臺灣民眾與他人溝通時，主要使用語言是華語的占 66.3 ％，其次是閩南語占 31.7 ％，再來是客語占 1.5 ％，其他語言則都低於 1 ％。雖然臺語的比例僅次於華語，但是客語及原民語的保存與發展已有政府專責的單位與預算，而且 70 歲以上主要使用語言是臺語的比例為 71.4 ％，但 26～35 歲的比例則降到 22.3 ％。若照聯合國瀕危語言六等級的標準來看，臺語的世代傳承是：祖父母會，但不常對兒童使用，因此較接近第三級「明確危險」等級。政府要如何分配資源在每一個語言上，將會是國家語言發展的一大難題。'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 因當時主政者的語言以華語為主，具有當權者的權力優勢，故推動「說國語運動」要讓全民用主政者熟悉的華語溝通，改變社會主流語言的使用習慣。(A)(C)說國語運動是將華語視為比母語更高的文化位階，且威權強制人民使用，罔顧多元文化的特質，並非平權措施。(D)政府制定《國家語言發展法》能顧及與維護多元文化，消弭文化位階的產生。
