  stem: 1938 年，臺灣總督府發起「寺廟整理運動」，拆毀媽祖廟等不同廟宇，還禁止媽祖遶境活動，但臺灣民間對媽祖信仰並未動搖。二次大戰結束後，眾人重建被毀的媽祖廟，也開始恢復遶境活動，其中以大甲媽祖遶境最負盛名。近年來，政府積極投入資源，結合在地力量，讓更多人了解媽祖遶境文化全貌，並與觀光活動結合，吸引遊客前來體驗。遊客常沿途拍照留念，不過若要區分照片分別在哪個行政區內拍攝，需要先取得這些行政區的面資料，並將照片內隱含的拍攝位置資訊轉換成 GIS 的經緯度坐標的點資料後，透過 GIS 分析步驟，才能將所有照片有效區分。有學者從分析信仰與統治間關係的角度主張：題文中媽祖遶境文化的變遷，反映出文化權能否受保障，與實現多元文化密切相關。上述說明最可能意指為何？
  options:
  - label: A
    content: 戰後陸續恢復的廟宇重建並且舉辦信仰活動，有助於推動臺灣多元文化
  - label: B
    content: 寺廟整理運動是一地方文化復興政策，使統治者得以有效推動特定文化
  - label: C
    content: 政府投注資源讓地方群體為自己文化發聲，有利不同文化之維護與傳承
  - label: D
    content: 媽祖信仰是臺灣文化核心，無論日治或現今統治者都利用此順遂其統治
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 政府投入資源、結合在地力量來推動當地的宗教信仰文化，能有效協助文化的維護與傳承。(A)恢復廟宇重建並且舉辦信仰活動，應是復興文化，而非推動多元文化。(B)寺廟整理運動將媽祖廟拆毀，此作為並無助於地方文化復興。(D)從上述可得知，日本總督府拆毀媽祖廟且禁止宗教活動，並未見其利用此來讓統治順遂。
