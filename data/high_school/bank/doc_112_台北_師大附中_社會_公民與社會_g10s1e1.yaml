  stem: 新冠疫情衝擊了我們的日常生活，民眾為了口罩而產生許多紛爭。當時 A 國政府十分重視疫情對人民的影響，在口罩發放政策上，欲落實公平正義的原則。針對 A 國的口罩政策，下列敘述何者正確？
