  answer_status: verified
  answer_source: answer_key
  explanation: 在臺的東南亞籍移工人數眾多，且多從事照護的社福工作，但部分臺灣人卻存有花錢僱用傭人的觀念，漠視外籍移工的勞動條件，休假時間不足。(A)《勞動基準法》中規範適用《勞動基準法》之事業單位，僱用勞工之勞動條件（如工資、工時、休假等），不分國籍一律適用《勞動基準法》規定。若違反《勞基法》的規定，不符合法治精神與公平正義原則。(C)形式平等為對任何人皆是相同作為，若要符合形式平等，則外籍看護工也應享有同等休假條件。(D)外籍移工雖是具備外國人身分，但在臺工作應以「勞動條件」作為考量，基於人權保障，也應讓移工適用我國勞動待遇。
