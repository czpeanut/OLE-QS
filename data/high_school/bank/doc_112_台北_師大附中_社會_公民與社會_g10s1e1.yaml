  stem: 中共中央宣傳部媒體監管局 2019 年 8 月發布新規定，要求省級以上新聞單位編採人員須通過「學習強國」APP 考試，才能申領或換發新版記者證。「學習強國」APP 是宣傳領導人習近平談話、思想的學習平臺，2019 年初推出後便要求中共黨員、全國公務人員下載學習，許多企業、學校教師也比照辦理，並有積分排名。無國界記者組織東亞辦事處執行長表示，這項考試目的顯然是要嚇阻新聞工作者，以杜絕異議聲音。請問依據上述內容，下列敘述何者正確？
