  stem: 根據上文，四位同學正討論對此議題的看法，關於同學們的言論，何者最為正確？
  options:
  - label: A
    content: 虎杖：臺灣人對外籍移工開直播就給予異樣眼光，是一種常見的微歧視行為
  - label: B
    content: 乙骨：從上文臺灣人的反應，可推知外籍移工的文化位階比臺灣還高所導致
  - label: C
    content: 伏黑：我國制定《國家語言發展法》，可以保障外籍移工也能傳承自己的母語
  - label: D
    content: 東堂：臺灣人與東南亞籍移工對開直播情境的認識不同，可能是一種文化差異
  group_stem: '疫情初期，中央流行疫情指揮中心宣布，第 32 例女移工因照顧案 27 例老翁而確診感染新型冠狀病毒。沒多久，媒體開始報導該名移工於隔離時直播，並形容她「搔首弄姿」、「暴露防疫隱私」等，引發輿論撻伐該位移工。

    確診隔離還玩直播，確實顛覆臺灣人認知，但究竟為何她需要直播？移工為何總是直播？直播不只是說自己過得很好的「報平安」方式，也是跟同鄉的朋友連結的管道。更重要的是，在異鄉一切不熟悉的環境之下，他們透過直播能夠說自己的語言。我們常常看到移工在直播，「外勞果然什麼都開直播呀！」、「500 外籍移工舞廳嗨翻，臉書開直播露餡！」、「女移工吃火鍋、唱卡拉 OK 都要直播，害自己 GG 了」、「臉書還開直播到處玩樂！」如果 Google 搜尋「移工直播」，總是得出這些字句和新聞標題，臺灣人可以直播；移工直播，就要被以異樣的眼光看待。

    據勞動部統計，截至 108 年 12 月，臺灣目前東南亞外籍移工人數接近 72 萬人，其中印尼移工人數占比最多，高達 27 萬 6 千人，從事社福工作者 72 ％，產業工 28 ％。在臺看護工不受勞基法保障，近九成外籍看護工無法固定休假，五成僅有「部分放假」，而且有三成四的看護工不曾放假。在這樣的工作環境下，移工人身自由受到限制，用手機直播，因而成為一個人際溝通、自我抒發的出口。

    當臺灣人看移工直播，我們常常想到他們暴露了被照顧者的隱私，或洩漏工廠的機密，有人還因為直播，被遣返回國。但其實移工直播，是因為那是連結，在直播裡舒服地說自己的語言，表現快樂、展現自由，和同鄉朋友在網路上互助支持。移工是孤鳥，孤鳥在飛行的時候，直播可以讓他們脫離現實，在網路的世界裡回巢、透氣呼吸。

    直播不一定代表自己真的過得很好。但是當移工直播的時候，他可以說話，表達自己。那一刻才終於不是一枚勞動力，而是個完整的人。因為在直播的世界裡，還有聲音。

    改寫自《外勞怎麼都在直播？—在直播的世界裡，還有聲音》'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 在數位資訊科技快速轉變的時代，直播已經是臺灣人很常見的生活日常，但針對外籍移工開直播卻給予負面評價，這已是一種對於外籍移工的微歧視行為。雖然微歧視是指傷害不大、輕微的歧視，但卻是主流社會中源自於對某族群的刻板印象而生。(B)從臺灣人的反應推斷，應是認為自身的文化位階高於外籍移工。(C)我國《國家語言發展法》中對於母語的傳承有條文規定，第 3 條「本法所稱國家語言，指臺灣各固有族群使用之自然語言及臺灣手語」，故並無保障外籍移工傳承自身的語言。(D)因當中涵蓋了對於外籍移工的異樣眼光，存有歧視意味。
