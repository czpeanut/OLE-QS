- id: doc_112_台北_師大附中_社會_公民與社會_g10s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 上文為某學者研究近年社會運動的發現，請問下列敘述何者正確？
  options:
  - label: A
    content: 資訊科技讓人民能在家就參與社會運動，不須走上街頭
  - label: B
    content: 資訊科技的發展，增加了人民參與公共事務的機會
  - label: C
    content: 參與公共事務僅限都市，鄉村人民因數位落差無法參加
  - label: D
    content: 太陽花學運是第一個透過網路串聯成功的社會運動
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從題文中敘述可得知，資訊社會中透過網路作為媒介，能夠高效率的找尋志同道合者進行串聯，打破地區上宣傳的阻礙發動社會運動。(A)文中提到網路為提升溝通、串聯的媒介，人們一樣走上街頭表達訴求。(C)公共事務雖然多在都市舉辦，但鄉村人民依然能透過網路而參與；然而，文中並未提及數位落差所造成的參與困難。(D)文中並無相關資訊。
