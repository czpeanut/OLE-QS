- id: doc_112_台北_師大附中_社會_公民與社會_g10s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 為防止媒體受到不當利益的干預，許多國家都由政府編列預算或公共基金提供資金，成立公共媒體。關於此類型媒體的特性，下列何者為「非」？
  options:
  - label: A
    content: 排除政治和商業力量干涉的獨立性
  - label: B
    content: 較能關注社會處境不利族群的事件
  - label: C
    content: 民眾權利與媒體利潤兼顧的均衡性
  - label: D
    content: 題材與內容呈現不同風貌的多樣性
  assets:
  - key: s1_1_f1
    kind: figure
    file: doc_112_台北_師大附中_社會_公民與社會_g10s1e1/s1_1_f1.png
    crop:
      page: 1
      rect:
      - 110.8
      - 206.15
      - 554.0
      - 341.55
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 由政府編列預算或公共基金提供資金的公共媒體，因不受政治立場或商業廣告收入的影響，較能夠站在社會上不同群體的角度來報導，提供給閱聽人了解事件的不同面貌。而且較無出資方的成本考量，題材選取與呈現上更為自由，可讓閱聽人接收多樣性的節目內容；同時，公眾可以就公共媒體的是否滿足自身群體的需求，提出批判或是改善意見。
- id: doc_112_台北_師大附中_社會_公民與社會_g10s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 以上是我國政府在原住民族文化保存的相關政策，請問規劃上列作法的目的，最可能為下列何者？
  options:
  - label: A
    content: 該政策為不同族群畫下界線，可以明顯區隔不同族群間的文化內容
  - label: B
    content: 政府對所有族群皆有相關法規，一視同仁的作法是實質平等的展現
  - label: C
    content: 政府為了鞏固政權，利用政策拉攏原住民族的選票，提升政府威望
  - label: D
    content: 撫平歷代殖民政權對原住民族的侵害，此項政策屬積極性平權措施
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 積極性平權指的是透過立法或行政創造積極政策或措施，保障並提升弱勢族群在各領域內的機會與權益，尤其是在傳統上對弱勢族群不利的領域。一般常見的作法是給予較優惠的對待，或者防止歧視行為，而達到各族群享有平等的權利，故選(D)。(A)(C)此為對原住民族的尊重與平權作法，並非是為了要進行族群間區隔或拉攏選票。(B)題文中並無指出各族群，僅有提及原住民族。
- id: doc_112_台北_師大附中_社會_公民與社會_g10s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 大法官釋字第 364 號：「○○係指一般民眾得依一定條件，要求傳播媒體提供版面或時間，許其行使表達意見之權利而言，以促進媒體報導或評論之確實、公正。例如：<u>媒體之報導或評論有錯誤而侵害他人之權利者，受害人即可要求媒體允許其▲▲</u>，以資補救。又如廣播電視舉辦公職候選人之政見辯論，於民主政治品質之提升，有所裨益。」請結合題述與下列選項，判斷哪一選項說明正確？
  options:
  - label: A
    content: ○○應填入媒體監督政府單位之「第四權」
  - label: B
    content: ▲▲應填入受害者對媒體的「使用權」
  - label: C
    content: 底線劃記處可與媒體「更正權」相呼應
  - label: D
    content: 底線處屬受錯誤報導者主動接近媒體之權
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)○○應為媒體近用權。(B)▲▲應填入媒體接近權。(D)媒體接近權屬於被動、有限的方式，在傳播媒體上表達言論、改變媒介內容，又可分為答辯權、更正權。
- id: doc_112_台北_師大附中_社會_公民與社會_g10s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 根據統計，臺灣新移民的社會屬性如下：大部分為女性、源於婚姻關係、主要來自中國大陸和東南亞各國。請問下列敘述何者最為正確？
  options:
  - label: A
    content: 新移民的跨國婚姻反映了全球政治與經濟架構下的人口流動
  - label: B
    content: 新移民與原住民族都是少數族群，因此享有相同的法律保障
  - label: C
    content: 新移民來自各國，我們沒必要對他們的社會文化有太多的瞭解
  - label: D
    content: 新移民為融入本地社會，應在臺灣文化和母國文化間做出選擇
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 全球化趨勢下，受到政治、經濟、文化間的流動影響，進而帶動人口的推力與拉力，增加跨國婚姻的數量。(B)新住民屬外國籍，需透過歸化方能取得我國國籍，享有國家保障，但在部分參政、服公職的權利上仍有所限制；然而，原住民族屬我國國民，其權利義務與全體國民相同。(C)心態上應以「多元文化主義」的思維去看待新移民，而非以我族中心主義的優越感排斥之。(D)新移民融入新生活本須適應期與社會資源的協助，應更為包容，而非讓他在兩者文化間做選擇。
- id: doc_112_台北_師大附中_社會_公民與社會_g10s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 所謂「置入性行銷」是媒體製作者將對自身或付費的委託者有利的特定訊息，包裝成新聞或節目流程的一部分。關於「置入性行銷」，以下敘述何者正確？
  options:
  - label: A
    content: 置入性行銷其實對觀眾有好處，因為觀眾可以很輕鬆地得到重要的生活資訊
  - label: B
    content: 「公民新聞」雖然經常報導主流媒體不感興趣的議題，但也屬於置入性行銷
  - label: C
    content: 執政者進行施政績效的置入性行銷，將降低民眾對政府績效的獨立判斷能力
  - label: D
    content: 因為閱聽大眾仍然可以自由選擇是否接受，故對置入性行銷的作為不必限制
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 置入性行銷意旨將行銷的商品以巧妙的手法置入媒體，使消費者在不知不覺中對產品產生印象，潛移默化中達到廣告效果。若執政者利用媒體進行政策、施政或績效的置入性行銷，則閱聽人可能因廣告效果的美化而失去獨立判斷能力。(A)觀眾雖然能夠得到置入性行銷商品的資訊，但缺乏比較，容易因節目中的置入行為有失對政府施政狀況的判斷。(B)「公民新聞」的報導議題較不傾向主流議題，能夠讓閱聽人得到更全面的資訊，並非置入性行銷。(D)若置入性行銷的行為完全不受限制，閱聽人所接收到的訊息會在不知不覺中有所偏誤，故須公權力介入管制。
- id: doc_112_台北_師大附中_社會_公民與社會_g10s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 以《正義論》聞名的羅爾斯認為「正義即公平」，要藉由公平程序來檢視社會制度是否符合社會正義，因此提出正義的兩項原則。請問下列哪些符合羅爾斯的正義論二原則？(甲)社會要符合大多數人的利益，因此「少數應要服從多數」(乙)社會中的個人與群體應享有同等的基本權利(丙)社會和經濟資源被不平等分配時，要優先滿足「處境不利者」的基本需求(丁)為「維護人權」，政府對侵犯人民權利的行為應加以限制
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 丙丁
  - label: D
    content: 甲丁
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 羅爾斯的《正義論》第一原則：平等權。每個人都有平等的權利，享有一完備體系下的各項平等自由權；而其所享有的自由與其他每個人所擁有同體系下的各項自由權相容。第二原則：機會平等及差異原則。社會及經濟的不平等必須滿足以下兩項條件：(1)各項職位及地位必須在公平的機會平等下，對所有人開放。(2)使社會中處於最劣勢的成員獲得最大利益，故選(B)。
- id: doc_112_台北_師大附中_社會_公民與社會_g10s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 不同類型的媒體若要進行合併，常引發社會各界正、反面意見的辯論。若從媒體識讀的角度來看，下列主張何者正確？
  options:
  - label: A
    content: 如果併購會造成媒體市場的集中，可能會帶來言論自由空間被限制的疑慮
  - label: B
    content: 如果併購導致只有一、二家媒體獨大之結果，最終將有助民主政治的效率
  - label: C
    content: 媒體經營者若能同時經營電子與平面媒體，更可保障閱聽人的媒體近用權
  - label: D
    content: 商業媒體的市占率一定要能達到獲利規模，才可能確保弱勢群體發聲管道
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 若不同類型的媒體，例如電視臺與平面媒體進行合併後，而合併結果造成媒體市場的集中，可能因市占率高、傳達出的言論相似，所帶出的風向影響廣大閱聽人。(B)若媒體獨大可能造成一言堂的現象，並不利於民主政治的發展。(C)媒體經營者若同時經營電子與平面媒體，可能同時左右不同媒體的報導方向，與保障閱聽人的媒體近用權無直接關聯。(D)商業媒體的市占率若達獲利規模，是因廣告收益高於成本，在仰賴廣告收益的過程中，勢必須迎合廣告方或播報以社會主流為主的內容，可能會忽視弱勢群體。
- id: doc_112_台北_師大附中_社會_公民與社會_g10s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 媒體製播的內容中，經常會出現「刻板印象」的圖文或劇情。下列媒體內容何者較<u>不會</u>引發「刻板印象」的批評？
  options:
  - label: A
    content: 外籍人士歸化入我國者以婚姻移民最多
  - label: B
    content: 女性較男性富同理心故適合護理工作
  - label: C
    content: 臺灣原住民屬酒量好、樂天知命的民族
  - label: D
    content: 都市人有自覺高尚的「天龍人」心理
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)該選項中主要是報導社會現實狀況。(B)(C)(D)這三者涉及性別、族群、地區上的刻板印象。
- id: doc_112_台北_師大附中_社會_公民與社會_g10s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 甲財團擁有一家報社、兩家電視臺，為了擴張事業版圖，再買下另一家有線電視系統，因此甲財團在平面和電子媒體的市占率，遠高於其他同業。依據上述內容，下列哪一種推論最可能發生？
  options:
  - label: A
    content: 併購後會增加各有線電視網之間的競爭
  - label: B
    content: 併購後恐使甲財團的媒體影響力過度集中
  - label: C
    content: 可聯合各有線電視網善盡媒體自律責任
  - label: D
    content: 讓更多人享有價格低廉的有線電視服務
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 併購後因甲財團的媒體影響力大，可能操控社會輿論方向。(A)因甲財團為擴張事業版圖擁有平面和電子媒體的高市占率，在擁有高比例媒體資源的狀況下，其他媒體影響力小，將使得媒體，有線電視網間的競爭力下降。(C)若甲財團擁有龐大媒體資源，無論任何作為都能發揮社會影響力，甲財團不太可能會聯合各媒體進行媒體自律的作為。(D)若甲財團擁有多家媒體壟斷市場，則在提供媒體服務上處於優勢地位，更可能成為價格決定者。
