  stem: '積極平權措施是否合理，社會上一直存在不同見解。我國在考試升學上給予原住民學生外加名額的升學保障，常引發部分民眾的質疑，有些人認為透過積極平權措施才能有效改善社會處境不利群體的困境；但也有人質疑差別對待基本上也是一種不公平，還可能會造成他們更不利的環境。針對升學保障制度獨厚特定族群的質疑，我們可以如何釐清並說明理由？

