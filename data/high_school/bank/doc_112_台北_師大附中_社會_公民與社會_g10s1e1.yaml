  answer_status: verified
  answer_source: answer_key
  explanation: 因網路上資訊眾多，且來源不明，網路使用者即便進行查證的動作，但仍須具備媒體素養方能判斷真偽，或是須留意資訊來源。(A) 107 年到 108 年的變化，透過網路查證者從 44.9 ％提升至 53 ％，查證的網路使用者比率增加。(B)雖然閱聽人對於判斷真假訊息的作為有所改變，但從圖表數據可得知，查證與不查證呈現兩個雙峰，雖有半數的網路使用者查證，但也有近半數的使用者不查證。(D)從圖表數據中顯示，向周圍請益的比例約兩、三成，未達選項中的四成。
