  stem: 新竹高中對過去非民主時期，因國家機器濫權而無法順利畢業的受難者補發畢業證書，是讓社會大眾認識過往校園中的不義事件，平反受難者的汙名，請問此舉主要是為了落實何種正義？
  options:
  - label: A
    content: 程序正義
  - label: B
    content: 分配正義
  - label: C
    content: 轉型正義
  - label: D
    content: 匡正正義
  group_stem: '在新竹高中第 75 屆畢業典禮中，頒「名譽畢業證書」給 70 年前因白色恐怖而無法順利在竹中畢業的學長們，也藉此讓學生了解過去的歷史創傷。1949 年後，臺灣在戒嚴體制下，透過法令對異議聲音進行查緝、逮捕，俗稱「白色恐怖」。竹中雖以自由學風著稱，也受到白色恐怖波及，並沒有躲過這場風暴。竹中表示，因涉及新竹市立新竹初級中學（今建華國中）教師黎子松的「社會主義青年大同盟案」，而被判刑的校友周賢農，以及高三時因閱讀當時的左傾禁書，捲入「銅鑼案」事件，於住家被帶走的校友劉家東。

    竹中指出，隨臺灣開放，讓大眾對過去於校園中的不義事件，能有更多的認識與平反，而竹中也透過與校友會合作，發現當年因政治因素而無法在竹中順利畢業的學生們。在畢業典禮中，竹中頒發給周賢農與劉家東這份遲到至少 70 年的「名譽畢業證書」，並對其他受難校友致敬。但因劉家東已身故，由兒子劉奕祥出席代表。竹中盼對歷經此事件的校友們，能有些微彌補並致意，也藉此讓竹中學生在面對過去的歷史創傷，並透過此事理解民主自由的可貴。'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 轉型正義是對於以前威權統治、獨裁政府錯誤施政的傷害，如侵犯人權、種族歧視等等作為進行補償。例如：政府成立委員會還原真相、改革不合理的制度、成立和解委員會等等。根據上述題文敘述，應選(C)。
