  stem: '已知 $NO_{3}^{－}$(aq)、$N_{2}$(g)、$MnO_{2}$(s) 的標準還原電位分別為

    $NO_{3}^{－}$(aq)＋$4H^{＋}$(aq)＋$3e^{－}$ → NO(g)＋$2H_{2}$O(l) E°＝0.960 V

    $N_{2}$(g)＋$5H^{＋}$(aq)＋$4e^{－}$ → $N_{2}H_{5}^{＋}$(aq) E°＝－0.23 V

    $MnO_{2}$(s)＋$4H^{＋}$(aq)＋$2e^{－}$ → $Mn^{2＋}$(aq)＋$2H_{2}$O(l) E°＝1.230 V

    有關各物質在標準狀態下的氧化力或還原力的比較，下列敘述何者正確？'
  options:
  - label: A
    content: 氧化力的強弱順序為 $MnO_{2}$(s)＞$N_{2}$(g)＞$NO_{3}^{－}$(aq)
  - label: B
    content: 氧化力的強弱順序為 $N_{2}$(g)＞$NO_{3}^{－}$(aq)＞$MnO_{2}$(s)
  - label: C
    content: 還原力的強弱順序為 $N_{2}H_{5}^{＋}$(aq)＞NO(g)＞$Mn^{2＋}$(aq)
  - label: D
    content: 還原力的強弱順序為 $Mn^{2＋}$(aq)＞NO(g)＞$N_{2}H_{5}^{＋}$(aq)
  - label: E
    content: 還原力的強弱順序為 NO(g)＞$N_{2}H_{5}^{＋}$(aq)＞$Mn^{2＋}$(aq)
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '氧化力：$MnO_{2}$(s)＞$NO_{3}^{－}$(aq)＞$N_{2}$(g)

    還原力：$N_{2}H_{5}^{＋}$(aq)＞NO(g)＞$Mn^{2＋}$(aq)'
