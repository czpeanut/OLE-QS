  stem: 工業上電解濃食鹽水，為何常在陽極與陰極間放置陽離子交換膜？
  options:
  - label: A
    content: 防止陰極的 NaOH 與陽極的 $Cl_{2}$ 起反應
  - label: B
    content: 保持溶液之 pH 值不變
  - label: C
    content: 作為鹽橋
  - label: D
    content: 只允許鈉離子進入陰極，增加鈉金屬之產率
  - label: E
    content: 提高電解液的滲透壓
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 鹼氯工業為製備 NaOH 與 $Cl_{2}$，應避免發生：$Cl_{2}$＋2NaOH → NaCl＋NaClO＋$H_{2}$O 而消耗。
