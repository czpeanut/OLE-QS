  stem: 甲、乙、丙為三種不同的金屬，已知甲乙電池、乙丙電池、甲丙電池的正極分別為乙、丙、丙，則甲、乙、丙氧化電位的大小順序為何？
  options:
  - label: A
    content: 甲＞乙＞丙
  - label: B
    content: 甲＞丙＞乙
  - label: C
    content: 乙＞甲＞丙
  - label: D
    content: 乙＞丙＞甲
  - label: E
    content: 丙＞乙＞甲
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '甲乙電池$\Rightarrow$乙（＋）、甲（－）$\Rightarrow$E°$_{ox}$：甲＞乙

