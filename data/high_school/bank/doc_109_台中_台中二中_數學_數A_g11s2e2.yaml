  stem: 下列關於$\left( \frac{3}{5} \right) ^{20}$的敘述，哪些正確？
  options:
  - label: A
    content: $\log \left( \frac{3}{5} \right) ^{20}$的首數為－4
  - label: B
    content: $\log \left( \frac{3}{5} \right) ^{20}$的尾數為0.562
  - label: C
    content: $\left( \frac{3}{5} \right) ^{20}>\frac{1}{10000}$
  - label: D
    content: $\left( \frac{3}{5} \right) ^{20}$化成小數，小數點後第6位開始出現不為0的數
  - label: E
    content: 承(D)，小數點後第一個不為0的數是3
  answer:
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: $\log \left( \frac{3}{5} \right) ^{20}$＝20$\log \frac{3}{5}$＝20 ( $log_{ }$2＋$log_{ }$3－1 )＝20 ( 0.3010＋0.4771－1 )＝－4.438＝(－5 )＋0.562 (A)(B) 首數－5，尾數0.562 (C) $10^{－4}$＞$\left( \frac{3}{5} \right) ^{20}$＝$10^{－4.438}$＞$10^{－5}$ (D)(E) $log_{ }$3＝0.4771，$log_{ }$4＝0.6020 ⇒ $log_{ }$3＜0.562＜$log_{ }$4 $\left( \frac{3}{5} \right) ^{20}$化成小數，為純小數，小數點後第五位始不為，數字為3 故選(B)(E)。
