    5.f（x）＝（$x^{2}$－2x＋2）q（x）＋6x－7

    ⇒（x＋1）f（x）＝（x＋1）〔（$x^{2}$－2x＋2）q（x）＋6x－7〕

    ⇒（x＋1）f（x）＝（x＋1）（$x^{2}$－2x＋2）q（x）＋（x＋1）（6x－7）

    （x＋1）f（x）除以 $x^{2}$－2x＋2 的餘式，即（x＋1）（6x－7）除以 $x^{2}$－2x＋2 的餘式

    ∴餘式為 11x－19，所求 m＋n＝11＋（－19）＝－8

    6.$x^{3}$＋$3x^{2}$＋4x＋2＝f（x）．$q_{1}$（x）＋3x＋2

    ⇒（$x^{3}$＋$3x^{2}$＋4x＋2）－（3x＋2）＝f（x）．$q_{1}$（x）

    ⇒ $x^{3}$＋$3x^{2}$＋x＝f（x）．$q_{1}$（x）

    ⇒ x（$x^{2}$＋3x＋1）＝f（x）．$q_{1}$（x） ……………①

