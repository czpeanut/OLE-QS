  explanation: '(1) x＜$\frac{1}{2}$時：－（2x－1）－3〔－（x－2）〕≤－2 ⇒ x ≤ 3 ∴x＜$\frac{1}{2}$

    (2)$\frac{1}{2}$≤ x＜2 時：（2x－1）－3〔－（x－2）〕≤－2 ⇒ x ≤ 1 ∴$\frac{1}{2}$≤ x ≤ 1

