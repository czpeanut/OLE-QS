  stem: 下列選項中，選出正確的選項。
  options:
  - label: A
    content: 設實數 a，b 滿足 0＜a＜1，0＜b＜1，則 0＜$\frac{a}{b}$＜1
  - label: B
    content: 設 a、b 均為非負有理數，且 x、y 均為無理數，若 a＋x＝b＋y，則 a＝b 且 x＝y
  - label: C
    content: 無理數$\sqrt{43-\sqrt{27}}$介於整數 6 與整數 7 之間
  - label: D
    content: 13＜$\frac{3\sqrt{169}+4\sqrt{196}}{7}$＜$\frac{27}{2}$
  - label: E
    content: $(\sqrt{3} -\sqrt{2} )^{3}$＋$\frac{1}{(\sqrt{3} -\sqrt{2} )^{3}}$＝$18\sqrt{3}$
  answer:
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：$\frac{a}{b}$可為任意非零實數

    (B) ╳：反例：a＝3，b＝2，x＝$\sqrt{2}$，y＝1＋$\sqrt{2}$

    3＋$\sqrt{2}$＝2＋（1＋$\sqrt{2}$）⇒ a＋x＝b＋y，但 a$\neq$b，x$\neq$y

    (C) ○：$\sqrt{43-\sqrt{27}}$＝$\sqrt{43-5.\cdots \cdots}$＝$\sqrt{37.\cdots \cdots}$＝6.……

    (D) ╳：由分點公式知，$\frac{3\sqrt{169}+4\sqrt{196}}{7}$＝$\frac{3\times 13+4\times 14}{7}$介於 13～14 之間且較靠近 14，

    即 13.5＜$\frac{3\times 13+4\times 14}{7}$＜14

    (E) ○：$(\sqrt{3}-\sqrt{2} )^{3}$＋$\frac{1}{(\sqrt{3}-\sqrt{2} )^{3}}$

    ＝$(\sqrt{3}-\sqrt{2} )^{3}$＋$\left( \frac{1}{\sqrt{3} -\sqrt{2}}\times \frac{\sqrt{3} +\sqrt{2}}{\sqrt{3} +\sqrt{2}} \right) ^{3}$

    ＝$(\sqrt{3}-\sqrt{2} )^{3}$＋$(\sqrt{3}+\sqrt{2} )^{3}$

    ＝［（$\sqrt{3}$）$^{3}$－3（$\sqrt{3}$）$^{2}$（$\sqrt{2}$）＋3（$\sqrt{3}$）（$\sqrt{2}$）$^{2}$－（$\sqrt{2}$）$^{3}$］

    ＋［（$\sqrt{3}$）$^{3}$＋3（$\sqrt{3}$）$^{2}$（$\sqrt{2}$）＋3（$\sqrt{3}$）（$\sqrt{2}$）$^{2}$＋（$\sqrt{2}$）$^{3}$］

    ＝2［（$\sqrt{3}$）$^{3}$＋3（$\sqrt{3}$）（$\sqrt{2}$）$^{2}$］＝2（3$\sqrt{3}$＋6$\sqrt{3}$）＝18$\sqrt{3}$

    故選(C)(E)'
