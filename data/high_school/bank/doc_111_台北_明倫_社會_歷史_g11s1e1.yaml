  type: single
  page: 4
  stem: '資料一：義大利在 1560 年波爾塔（Giambattista della Porta）創立「自然祕密研究會」，是歷史上第一個自然科學的學術組織，然而該會創立後不久就被教會以「巫術團體」的罪名取締。

    資料二：英國於 1640 年代在約翰．威爾金斯（John Wilkins）的倡導下，一個學術團體自發組織起來，自稱為「哲學學會」；1660 年著名的建築師雷恩（Christopher Wren）倡議建立一個新學院以促進科學的發展；1662 年英王查理二世批准成立皇家學會，並任命大臣布隆克爾（William Brouncker）擔任會長。

    資料三：法國 17 世紀初的科學家常自發性的聚會討論科學問題，後來有大臣向路易十四建議成立科學團體來為國家服務，促成了 1666 年巴黎科學院的建成。

    請問上述資料說明了早期科學發展的特色是'
  options:
  - label: A
    content: 自發性的成立
  - label: B
    content: 會受到教會的打壓
  - label: C
    content: 能得到政府的獎勵
  - label: D
    content: 容易受到世俗政權的干預
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)三則資料皆說明早期的科學研究學術團體，都是自發性的組成，是為正解。(B)僅資料一呈現此一特色。(C)資料一並無此特色。(D)資料二、三有受到世俗政權的鼓勵，資料一則受教會組織的打壓。
