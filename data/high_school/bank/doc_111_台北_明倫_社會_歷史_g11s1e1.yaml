  explanation: 題文所述為 11 世紀的「俗人授職衝突」事件，神聖羅馬帝國皇帝宣布罷黜教宗，而教宗也將皇帝逐出教會，最後因帝國境內貴族趁皇帝與教宗衝突時群起反抗，威脅皇權，才迫使皇帝亨利四世向教宗認罪悔改，以解決政治危機，(A)為正解。(B)皇帝亨利四世欲介入教會的人事才引爆政教之爭。(C)(D)皇帝的屈服僅代表此次的政教衝突暫歇，歐洲日後仍有多次政教衝突事件，教權也非一直占有優勢。
