  stem: 現代藝術史家對希臘藝術風格高度推崇，並將希臘藝術視為西方藝術的源頭，然而對希臘古拙時期的人而言，已經延續數千年的埃及才是進步繁榮的文化輸入國。回顧古拙時期的希臘雕塑會發現，雖然人物的面部特徵和身型具有寫實的風格，但動作形式或裝扮卻與埃及雕塑高度相似，兩者最大的差別在於希臘人對於展現「人體美」的執著。古埃及的雕像不論男女均需著衣，而且身型和面孔無明顯的個人特徵，兩性的身形也沒有明顯差異，但希臘古拙時期的男女雕塑品在性徵曲線上有明顯區別，雖然女子雕塑遵循了不可裸身的社會習俗，但男性則常見裸體雕塑，藝術家將男性勻稱的肌肉線條和身體曲線忠實的呈現，預示了希臘古典時期雕塑對人類身體的完美理想。請問上文主旨說明了什麼？
  options:
  - label: A
    content: 古埃及的雕像藝術呈現出寫實的風格
  - label: B
    content: 埃及的藝術風格影響了古希臘的藝術創作
  - label: C
    content: 古埃及和希臘的藝術皆受同一宗教所影響
  - label: D
    content: 文藝復興時代的藝術重現了古埃及的風格
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從「對希臘古拙時期的人而言……埃及才是進步繁榮的文化輸入國」一句，可知埃及藝術影響了古希臘的藝術，(B)為正解。(A)古埃及雕像身形和面孔無明顯的個人特徵，不具寫實風格。(C)古埃及和古希臘宗教並不相同，藝術不受同一宗教所影響。(D)文藝復興時代的藝術重現古希臘的風格。
