  stem: 歷史課上，老師正在介紹某一組織：「在其建立約 400 年後的 10 世紀，該組織數以百計的分布在整個西歐，並在中古世紀中享有極重要的地位，其包含以下功能。經濟功能：它是真正的生產中心，不僅提供神職人員，還能滿足荒蕪農村難民的生存需求；社會救助：發揮著救濟窮人、救治病人、招待長途旅人等功能；文化職能：它也是中世紀主要的文化中心，承擔著捍衛古典文化的重要角色。」請問關於該組織的理解，哪位同學的觀念正確？
  options:
  - label: A
    content: 恩湛：「中古時代這個組織特別重視人文教育，主要研究與人相關的知識。」
