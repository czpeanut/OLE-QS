  answer_status: verified
  answer_source: answer_key
  explanation: 塞內卡主張提高道德、智慧，倡導禁欲主義，可推知其思想受到希臘化時代斯多噶學派的影響，選項中僅(D)芝諾、奧里略分別為希臘化、羅馬的斯多噶學派哲學家代表。
