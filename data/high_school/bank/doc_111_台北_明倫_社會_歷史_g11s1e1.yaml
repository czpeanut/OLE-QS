questions:
- id: doc_111_台北_明倫_社會_歷史_g11s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '以下為兩位西方哲學家的論點：

    甲：觀察大自然後得到「水是萬物生存根源」的論述。

    乙：發揚人的理性精神，主張「人的靈魂裡面有一個較好的部分和一個較壞的部分，而所謂『做自己的主人』就是說較壞的部分受天性較好的部分控制。」

    請問關於上述資料正確的理解是'
  options:
  - label: A
    content: 甲乙兩人皆為斯多噶學派的代表
  - label: B
    content: 甲主張應由哲學家國王來領導國家
  - label: C
    content: 乙主張透過不斷的質疑與反駁，來追求普遍的真理
  - label: D
    content: 甲乙兩人思考重點相同，皆強調自然
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 甲為泰利斯的主張，乙為蘇格拉底的主張。(A)兩人皆為古典希臘時期的哲學家，與希臘化時期的斯多噶學派無關。(B)哲學家國王為柏拉圖的主張。(D)甲思考重點強調宇宙自然，乙思考重點已轉向現實社會生活。
- id: doc_111_台北_明倫_社會_歷史_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 「不知是好運還是壞運，□□位處於尼羅河各大城市和兩河流域各大城市之間，由於其地理位置的關係，商業貿易十分發達。此區自古以來便成為兵家必爭之地，居住在這塊土地上的人民遭受到一次又一次戰禍的迫害，周旋於各大帝國之間，時而納貢、時而被征服、時而被占領，這種折磨、煎熬，成就一個重要的宗教信仰。」請問關於上文正確的理解為何？
  options:
  - label: A
    content: □□內應填入巴比倫
  - label: B
    content: 這個宗教強調神愛世人，創教初期特別受到中下階層民眾的支持
  - label: C
    content: 這個宗教的教義受到瑣羅亞斯德的影響
  - label: D
    content: 這塊土地上的人民始終未能實現建國的夢想
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: □□位處尼羅河與兩河流域之間，最可能為巴勒斯坦地區，當地形成的宗教信仰為猶太教，(C)為正解。(A)巴比倫位於兩河流域。(B)此為基督教的特色，非猶太教。(D)當地希伯來人曾經建立希伯來王國等政權。
- id: doc_111_台北_明倫_社會_歷史_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 某一時期，英國國王下令關閉修道院，沒收教會財產，將其土地出售給富人，不僅獲得巨大利益，也調整政教關係。請問依據題文資訊，上述事件最可能發生於何時？
  options:
  - label: A
    content: 8 世紀聖像破壞運動時
  - label: B
    content: 14 世紀亞威農囚禁時
  - label: C
    content: 16 世紀宗教改革時
  - label: D
    content: l7 世紀科學革命時
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 從英國國王關閉修道院、沒收教會財產的行為，可知英國國王已與教會交惡，因此應為(C) 16 世紀宗教改革時，英王亨利八世脫離教會自立新教派。
- id: doc_111_台北_明倫_社會_歷史_g11s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 啟蒙思想家孟德斯鳩在《法意》裡，提出了三權分立、相互制衡的理論，認為唯有行政、立法、司法三權分開的政府，才能杜絕流弊。其實早在共和時代，羅馬人就深諳這個道理。羅馬人在設計共和政治制度的原則是為了防止政客擅權，維持穩定，其核心價值為何？
  options:
  - label: A
    content: 互相制衡
  - label: B
    content: 個人主義
  - label: C
    content: 人民優先
  - label: D
    content: 君權至上
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 羅馬共和精神在權力制衡與菁英共治，加上公民平等概念及「以法治國」傳統，為後世的民主政治樹立典範，(A)為正解。
- id: doc_111_台北_明倫_社會_歷史_g11s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 皇帝時常宣稱自己不是國家的主人，他從很多方面使他管理的區域成為當時統治得最好的歐洲國家，例如廢止對被控的罪犯實施酷刑；設立小學；促進工業與農業繁榮。他對政治進行改革，保證人民自由。另外，他對伏爾泰甚為欽佩，曾在宮中款待他一段時間，並能寬容各種宗教信仰。請問這位君主施政方針是
  options:
  - label: A
    content: 君主專制
  - label: B
    content: 開明專制
  - label: C
    content: 民主革命
  - label: D
    content: 共和政體
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 這位皇帝推行多項改革，強調保證人民自由與寬容宗教信仰，並推崇伏爾泰，可推知應為啟蒙運動時期的歐洲君主，當時推崇的政治體制為(B)開明專制。
- id: doc_111_台北_明倫_社會_歷史_g11s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 在宗教改革之前，羅馬天主教會不僅控制一般民眾的思想，還凌駕於世俗王權之上。宗教改革打破羅馬天主教會的獨大局面，並衍生出許多不同的新教教派。請問關於宗教改革的敘述，下列何者正確？
  options:
  - label: A
    content: 馬丁路德是第一位批判基督教會，也是第一位鼓勵基督徒可自行閱讀《聖經》的學者
  - label: B
    content: 馬丁路德因反對贖罪券，而重新思考人與上帝的關係，並主張「因信得救」
  - label: C
    content: 宗教改革對天主教會帶來重大衝擊，從此一蹶不振
  - label: D
    content: 宗教改革後出現許多新的教派，最具代表性的包含耶穌會、喀爾文派和路德派
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)馬丁路德並非第一位批判基督教會的學者，之前也有胡斯、伊拉斯莫斯等人。(C)天主教會亦發起自省改革，並有耶穌會積極向海外傳教。(D)耶穌會屬於舊教，並非新的教派。
- id: doc_111_台北_明倫_社會_歷史_g11s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 西元前 450 年左右，羅馬政府將法條寫在 12 塊木板上，並公告讓所有人民知曉法條內容，奠定了日後羅馬法治的基礎。請問羅馬《十二表法》的頒布與實施，說明了羅馬的何項統治原則？
  options:
  - label: A
    content: 強化貴族的統治權
  - label: B
    content: 重視平民的處境
  - label: C
    content: 重視奴隸的處境
  - label: D
    content: 強調君權神授的精神
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 《十二表法》強調「法律之前，人人平等」原則，保障平民的權利，約束貴族的行為，可推知羅馬共和時期的統治原則為(B)重視平民的處境。
- id: doc_111_台北_明倫_社會_歷史_g11s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 17 世紀被稱為「天才的世紀」，在科學上有很大變動，人們稱之為「科學革命」，關於這場「革命」，下列敘述何者正確？
  options:
  - label: A
    content: 科學革命的出現與文藝復興、宗教改革、地理大發現以來人們對自然的理解改變有關
  - label: B
    content: 教會主導了科學革命的發展，培養出如哥白尼、伽利略等天文學家
  - label: C
    content: 科學革命顛覆了人們對宗教的信仰，進而否定了上帝的存在
  - label: D
    content: 培根提出演繹法，笛卡兒提出歸納法
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)為正解。(B)教會為此時科學發展的最大阻力。(C)科學革命時期的學者崇信理性的上帝，並非否定上帝的存在。(D)培根提出歸納法，笛卡兒提出演繹法。
- id: doc_111_台北_明倫_社會_歷史_g11s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: '以下兩則為文藝復興運動的資料：

    資料一：「日耳曼藝術最具個性化，歌德認為日耳曼藝術裡『情感就是一切』，在他們看來沒有情感就沒有藝術。」

    資料二：「受到濃厚宗教氣氛所影響，西班牙對於世俗色彩濃厚的文藝復興運動接受程度較低。」

    關於上述兩則資料，下列何者敘述正確？'
  options:
  - label: A
    content: 反映出文藝復興運動的一致性
  - label: B
    content: 反映出文藝復興運動的多元性
  - label: C
    content: 反映出文藝復興運動重視理性的特性
  - label: D
    content: 反映出文藝復興運動的宗教屬性
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)日耳曼與西班牙的情況不同，說明文藝復興運動並無一致性，(B)才是正解。(C)兩則資料皆反映當時並不重視理性。(D)文藝復興運動重視人文主義，因此宗教屬性強的西班牙發展程度較低。
- id: doc_111_台北_明倫_社會_歷史_g11s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 耶穌的傳教活動，得到許多民眾的敬仰，①<u>尤其是上層階級的支持，使基督教信仰遭到統治者和猶太祭司的仇視和迫害</u>，使得②<u>耶穌遭到逮捕並被殘酷的釘死在十字架上</u>。三天後耶穌復活，並顯靈在信徒面前，教導他們要拯救受苦受難的人類。③<u>耶穌的信徒們牢記耶穌的教誨，前仆後繼用不屈不撓的精神傳播基督教，即使受到迫害也不退縮</u>。④<u> 3 世紀時，基督教終於成為羅馬的國教</u>。請問文中畫底線部分有幾個是正確的？
  options:
  - label: A
    content: —個
  - label: B
    content: 兩個
  - label: C
    content: 三個
  - label: D
    content: 四個
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: ①耶穌的傳教活動主要受到中、下層階級的支持；② 4 世紀末，基督教才成為羅馬的國教。
- id: doc_111_台北_明倫_社會_歷史_g11s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 1 世紀前後世界上同時存在著兩大帝國，一是西方的羅馬帝國，一是中國的漢朝，若將這兩個帝國加以比較，下列敘述何者正確？
  options:
  - label: A
    content: 羅馬帝國分為東羅馬與西羅馬，漢朝分為西漢與東漢，都是因為帝國分裂為東西兩國之故
  - label: B
    content: 兩個帝國都在 4 世紀滅亡
  - label: C
    content: 都是以農業為立國基礎的國家，並且建立橫跨多洲的版圖
  - label: D
    content: 兩個帝國主要的外患都來自於北方
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)西漢與東漢是因為政權短暫中斷，並非分裂為兩國。(B)漢帝國於 220 年滅亡，非 4 世紀。(C)漢帝國版圖皆在亞洲，並未橫跨多洲。(D)兩個帝國的主要外患分別為來自北方的日耳曼民族與匈奴族，是為正解。
- id: doc_111_台北_明倫_社會_歷史_g11s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 兩河流域降雨量少，使得此區的土地須透過灌溉取得河水才有耕作的可能。這塊區域具有優良的灌溉條件，因為地勢相當平坦，土壤也適合灌溉，人們必須建造並維護灌溉系統，還須克服土壤因缺水可能出現的鹽化問題，只要灌溉成功，這片土地就足以供養大量的人口，而且還有剩餘物資可供商業買賣。請問這則資料主旨說兩河流域農業的何項特色？
  options:
  - label: A
    content: 難以克服自然環境，因而產生悲觀的宗教思想
  - label: B
    content: 兩河流域河流定期氾濫帶來豐沛水源
  - label: C
    content: 兩河流域的農業影響文明發展
  - label: D
    content: 兩河流域土壤肥沃，適合種植馬鈴薯和地瓜等根莖類作物
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)題文明顯可看出當地居民能夠克服自然環境。(B)兩河流域降雨少又不定期氾濫，成為當地居民的隱患。(D)馬鈴薯與地瓜為美洲的物種。
- id: doc_111_台北_明倫_社會_歷史_g11s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 根據西方神話和傳說故事，希臘眾神之一的普羅米修斯教會了人類如何保持火種，如何使用火取暖煮食，如何把火點燃而不被燒傷指頭，也不會被這種效用無窮但危險的力量所嚇倒。請問對此正確的理解是
  options:
  - label: A
    content: 希臘學者試圖以物質元素來解釋世界，普羅米修斯主張火是萬物的根源
  - label: B
    content: 普羅米修斯是希臘神話故事人物，說明火的使用源自於希臘
  - label: C
    content: 反映在希臘神話中，神與人的互動密切
  - label: D
    content: 反映出希臘神學對羅馬宗教的影響
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 希臘神話中，神將火種帶到人間，並仔細教導人類如何使用，反映出當地宗教信仰強調神人之間的互動關係密切，(C)為正解。
