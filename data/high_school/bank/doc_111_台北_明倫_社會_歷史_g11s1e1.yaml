  stem: 塞內卡是古羅馬時代著名的哲學家、政治家。他受到希臘化時代哲學家的影響，主張人應提高道德、智慧，保持精神上的安寧，並倡導禁欲主義，要求人們放棄各種現實生活中的欲望，等待神的啟示和精神上的解脫。他的思想對未來基督教教義產生了一定程度的影響。請問塞內卡的主張是受到何人影響？而塞內卡的主張又可能受到何人所推崇？
  options:
  - label: A
    content: 芝諾、亞歷山大
  - label: B
