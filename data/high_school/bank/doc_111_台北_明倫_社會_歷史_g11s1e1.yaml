  stem: 神聖羅馬帝國皇帝亨利四世寫給教宗格里高利七世的信：「至於我，一個多罪而又沒有快樂的人。……由於用人不當，所以得罪天主，也得罪你；我不但侵犯了教會的財產，而且將教堂售與不適當的人──他們因而犯了買賣神職之罪，不從正門進入，而我也沒有盡力保護各地教會。」上文可以理解為
  options:
  - label: A
