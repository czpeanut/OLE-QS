  explanation: 從這個組織的各項功能來看，應為修道院，(B)為正解。(A)修道院的教育以培養未來的神職人員為主，不重人文教育。(C)應為阿拔斯王朝巴格達的「智慧宮」。(D)修道院為出世隱修的組織，人生七件聖事應由入世的教會負責。
