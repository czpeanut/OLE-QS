  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) 生物界的密碼子所對應的胺基酸大致相同。

    (B) UAA、UAG、UGA 為終止密碼子，沒有對應胺基酸。

    (C) 多種密碼子可對應同一種胺基酸。

    24.5 種鹼基×5 種鹼基×5 種鹼基×5 種鹼基＝$5^{4}$。

    25.(A) 這個轉譯過程已進入終止階段，因為遇到終止密碼子 UGA。

    (B) 核糖體是從 mRNA 的 5'' 端往 3'' 端移動。

    (C) UGA 是終止密碼子，沒有對應胺基酸。

    26.胃蛋白酶原在胃酸中會打開摺疊的構形，再切除數個胺基酸而形成具有活性的胃蛋白酶。

    27.此模版股轉錄的產物為 RNA，其 5'' 端由模版股的 3'' 端開始，依互補鹼基配對原則得到單股 RNA 為 5''-GCGAAACGGAUU-3''。

    28.因為此單股 RNA 為 5''-GCGAAACGGAUU-3''，其密碼子依序為 GCG-AAA-CGG-AUU，所以對應的胺基酸序列為乙－甲－戊－己。

    29.mRNA 乙剪接後包含了內含子（會被切除），且其中有終止密碼子，所以表現長度最短。

    30.(A) 複製的原料為 dATP、dTTP、dCTP、dGTP。

    31.(C) 突變不一定有害。

    32.甲、調節基因；乙、調節蛋白；丙、啟動子；丁、操作子；戊、結構基因。

    33.(B) 調節蛋白與操作子結合，將使 RNA 聚合酶無法順利運作。

    (C)(D) 無此現象。

    34.甲為缺失，乙為重複，丙為倒位，丁為易位。

    (B) 重複會造成某些基因表現加強，可能會對個體造成影響，通常不利。

    35.(A) 染色體發生重複時，其核苷酸數量發生改變。

    (C) 染色體數目的異常通常都會造成明顯影響，如唐氏症是第 21 號染色體多一條，透納氏症是第 23 號染色體僅有一條 X 染色體。

    (D) 慢性骨髓性白血病即為第 9 號與第 22 號染色體發生易位。

    36.患者的基因為 A1A3A3，A3 來自父親的染色體，故應為精子形成過程中，減數分裂發生姊妹染色分體的無分離。

    37.DNA 分子的變異只涉及一個核苷酸的改變稱為點突變。

    38.(A) 人類鐮形血球貧血症屬於分子層次的變異，是血紅素 β 鏈基因發生點突變。

    39.PCR 的過程中需要重複加熱至 93～97 ℃，故 Taq 聚合酶的發現優化了 PCR 的過程。

    40.(C) PCR 的過程中，DNA 雙股完全打開，沒有岡崎片段的生成。'
