- id: doc_113_台東_台東女中_自然_生物_選修生物I_g11s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 格里夫茲如何將肺炎鏈球菌區分為粗糙型（R 型）與光滑型（S 型）？
  options:
  - label: A
    content: 光學顯微鏡下，菌體細胞壁外具有莢膜者，稱為光滑型
  - label: B
    content: 光學顯微鏡下，菌體細胞壁外具有莢膜者，稱為粗糙型
  - label: C
    content: 培養基上的菌落外觀光滑者，稱為光滑型
  - label: D
    content: 培養基上的菌落外包圍莢膜者，稱為粗糙型
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 格里夫茲是以有無夾膜造成菌落外觀的光滑與否來區分粗糙型與光滑型。
- id: doc_113_台東_台東女中_自然_生物_選修生物I_g11s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 格里夫茲進行肺炎鏈球菌的實驗中，造成此實驗老鼠死亡的原因是因為體內產生了何種細菌？
  options:
  - label: A
    content: 活的 S 型菌
  - label: B
    content: 死的 S 型菌
  - label: C
    content: 活的 R 型菌
  - label: D
    content: 死的 R 型菌
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 造成此實驗老鼠死亡的原因是因為體內含有活的 S 型菌。
- id: doc_113_台東_台東女中_自然_生物_選修生物I_g11s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 在格里夫茲的肺炎鏈球菌實驗中，若將已被高溫殺死的 S 型肺炎鏈球菌加入下列何種物質時，不能使 R 型肺炎鏈球菌變成 S 型？
  options:
  - label: A
    content: 蛋白酶
  - label: B
    content: RNA 酶
  - label: C
    content: DNA 酶
  - label: D
    content: DNA 聚合酶
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C) DNA 是讓細菌發生轉形的物質，DNA 酶會將 DNA 水解。
- id: doc_113_台東_台東女中_自然_生物_選修生物I_g11s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 離心後，放射性將顯現於何處？
  options:
  - label: A
    content: 上層懸浮液
  - label: B
    content: 下層沉澱物
  - label: C
    content: 懸浮液與沉澱物均無
  - label: D
    content: 懸浮液與沉澱物均有
  group_stem: 靜香以放射性同位素 $^{35}$S 標記的噬菌體感染大腸桿菌，一段時間後，以果汁機攪拌大腸桿菌培養液，接著再進行離心，使大腸桿菌沉澱。根據上述回答下列問題：
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 因為核酸不含 S，所以放射性同位素 $^{35}$S 標記在噬菌體的蛋白質殼體。噬菌體感染細菌時，蛋白質殼體並不會進入細菌體內，而是留在懸浮液中。
- id: doc_113_台東_台東女中_自然_生物_選修生物I_g11s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 以 $^{32}$P 標記噬菌體的 DNA、以 $^{31}$P 標記大腸桿菌的 DNA 和體內的核苷酸、以 $^{35}$S 標記噬菌體的蛋白質殼體、以
    $^{32}$S 標記大腸桿菌體內的胺基酸。當噬菌體感染大腸桿菌後，釋出新產生之噬菌體的組成成分為何？
  options:
  - label: A
    content: 蛋白質殼體含 $^{32}$S
  - label: B
    content: 蛋白質殼體含 $^{35}$S
  - label: C
    content: 全部 DNA 均含 $^{31}$P
  - label: D
    content: 多數 DNA 含 $^{32}$P
  group_stem: 靜香以放射性同位素 $^{35}$S 標記的噬菌體感染大腸桿菌，一段時間後，以果汁機攪拌大腸桿菌培養液，接著再進行離心，使大腸桿菌沉澱。根據上述回答下列問題：
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 噬菌體只有 DNA 進入大腸桿菌體內，利用大腸桿菌體內的核苷酸（$^{31}$P 標記）和胺基酸（$^{32}$S）為原料，合成新的
    DNA 和蛋白質殼體。因此 DNA 只有原來的舊股含有 $^{32}$P，新合成的 DNA 多數含有 $^{31}$P；而原來的噬菌體蛋白質殼體並未進入到大腸桿菌內，新合成的蛋白質殼體含有
    $^{32}$S。
