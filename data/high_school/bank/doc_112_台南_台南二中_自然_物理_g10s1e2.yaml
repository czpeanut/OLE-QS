  stem: 游泳戲水是炎夏消暑的良方之一，但因無法準確判斷水深，有時導致溺水事件。若站在戶外游泳池旁，估計池水的深度，總會覺得池水比實際深度淺。此一錯覺主要源自於下列何者原因？
