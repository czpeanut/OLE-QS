  stem: ( $log_{5}\sqrt{3}$＋log$_{\frac{1}{25}}\frac{1}{3}$) ( $log_{9}$ 25＋$log_{3}$ 25－$log_{27}$ 0.2 )＝＿＿＿＿。
  explanation: ( $log_{ 5}\sqrt{3}$＋$\log _{\frac{1}{25}}\frac{1}{3}$) ( $log_{ 9}$ 25＋$log_{ 3}$ 25－$log_{ 27}$ 0.2 ) ＝($\frac{\log \sqrt{3}}{\log 5}$＋$\frac{\log \frac{1}{3}}{\log \frac{1}{25}}$) ($\frac{\log 25}{\log 9}$＋$\frac{\log 25}{\log 3}$＋$\frac{\log 0.2}{\log 27}$) ＝($\frac{\frac{1}{2}\log 3}{\log 5}$＋$\frac{-\log 3}{-2\log 5}$) ($\frac{2\log 5}{2\log 3}$＋$\frac{2\log 5}{\log 3}$－$\frac{-\log 5}{3\log 3}$) ＝$\frac{\log 3}{\log 5}$×$\frac{\frac{10}{3}\log 5}{\log 3}$＝$\frac{10}{3}$。
- id: doc_109_桃園_武陵_數學_數A_g11s1e2_s2_3
  section: 2
  number: 3
  type: fill
  page: 1
  stem: 試求函數y＝2‧$4^{x＋1}$與y＝17‧$2^{x}$－2之圖形在第二象限的交點坐標＿＿＿＿。
  explanation: 解$\begin{cases}y=2\cdot 4^{x+1} \\ y=17\cdot 2^{x}-2\end{cases}$ ⇒ 2．$4^{x＋1}$＝17．$2^{x}$－2 ⇒ 8．( $2^{x}$ )$^{2}$－17．$2^{x}$＋2＝0， ⇒ ( 8．$2^{x}$－1 ) ( $2^{x}$－2 )＝0 ⇒ $2^{x}$＝2，$\frac{1}{8}$ ⇒ x＝1，－3， ⇒ ( x , y )＝( 1 , 32 )，(－3 ,$\frac{1}{8}$)， 故所求為 (－3 , $\frac{1}{8}$ )。
- id: doc_109_桃園_武陵_數學_數A_g11s1e2_s2_6
  section: 2
  number: 6
  type: fill
  page: 1
  stem: 在坐標平面上，將函數y＝f (x)＝$9^{x}$的圖形沿著x軸向左平移2單位後，得到第二個函數y＝g (x) 的圖形，再將函數 y＝g (x) 的圖形對稱x軸，得到第三個函數y＝h (x) 的圖形，現有鉛直線x＝k與y＝f (x)，y＝g (x)，y＝h (x) 的圖形分別交於A、B、C三點且$\overline{AB}$＝240，試求$\overline{AC}$＝＿＿＿＿。
  explanation: 可知g (x)＝$9^{x＋2}$，h (x)＝－$9^{x＋2}$， ⇒ $\overline{AB}$＝$9^{k＋2}$－$9^{k}$＝80．$9^{k}$＝240 ⇒ $9^{k}$＝3 ⇒ k＝$\frac{1}{2}$， 故$\overline{AC}$＝$9^{\frac{1}{2}}$－$(-9^{\frac{1}{2}+2})$＝$9^{\frac{1}{2}}$－$9^{\frac{5}{2}}$＝3＋243＝246。
