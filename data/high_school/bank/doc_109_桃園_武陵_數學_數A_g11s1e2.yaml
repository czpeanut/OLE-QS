- id: doc_109_桃園_武陵_數學_數A_g11s1e2_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 選出下列正確的選項？
  options:
  - label: A
    content: log$_{\sqrt{3}}\sqrt[4]{24}$＜log$_{\frac{1}{3}}\frac{1}{5}$＜$log_{9}$ 26
  - label: B
    content: $log_{2}$ 0.6＜$log_{3}$ 0.6＜$log_{0.2}$ 0.6＜$log_{0.3}$ 0.6
  - label: C
    content: $log_{0.2}$ 6＜$log_{0.3}$ 6＜$log_{3}$ 6＜$log_{2}$ 6
  - label: D
    content: $\sqrt[6]{\frac{1}{7}} < \sqrt[4]{\frac{1}{5}} < \sqrt[3]{\frac{1}{4}}$
  - label: E
    content: ($\frac{1}{7}$)$^{－0.7}$＜($\frac{1}{5}$)$^{－0.7}$＜($\frac{1}{4}$)$^{－0.7}$
  explanation: (A) ○：$\log _{\sqrt{3}}\sqrt[4]{24}$＝$\frac{\log \sqrt[4]{24}}{\log \sqrt{3}}$＝$\frac{2\log \sqrt[4]{24}}{2\log \sqrt{3}}$＝$\frac{\log \sqrt{24}}{\log 3}$＜$\frac{\log 5}{\log 3}$＝$\frac{-\log 5}{-\log 3}$＝$\frac{\log \frac{1}{5}}{\log \frac{1}{3}}$＝$\log _{\frac{1}{3}}\frac{1}{5}$， $\log _{\frac{1}{3}}\frac{1}{5}$＝$\frac{\log \frac{1}{5}}{\log \frac{1}{3}}$＝$\frac{\log 5}{\log 3}$＝$\frac{2\log 5}{2\log 3}$＝$\frac{\log 25}{\log 9}$＜$\frac{\log 26}{\log 9}$＝$log_{ 9}$ 26， 所以$\log _{\sqrt{3}}\sqrt[4]{24}$＜$\log _{\frac{1}{3}}\frac{1}{5}$＜$log_{ 9}$ 26。 (B) ○：因為log 0.6＜log 1＝0，所以$log_{ 2}$ 0.6＝$\frac{\log 0.6}{\log 2}$＜$\frac{\log 0.6}{\log 3}$＝$log_{ 3}$ 0.6＜0， 同理可知，$log_{ 0.3}$ 0.6＝$\frac{\log 0.6}{\log 0.3}$＞$\frac{\log 0.6}{\log 0.2}$＝$log_{ 0.2}$ 0.6＞0， 因此$log_{ 2}$ 0.6＜$log_{ 3}$ 0.6＜$log_{ 0.2}$ 0.6＜$log_{ 0.3}$ 0.6。 (C) ×：$log_{0.2}$ 6＝$\frac{\log 6}{\log 0.2}$＞$\frac{\log 6}{\log 0.3}$＝$log_{0.3}$ 6。 (D) ×：$\sqrt{\frac{1}{4}}$＝$(\frac{1}{4})^{\frac{1}{3}}$＝$((\frac{1}{4})^{2})^{\frac{1}{6}}$＝$(\frac{1}{16})^{\frac{1}{6}}$＝$\sqrt[6]{\frac{1}{16}}$＝$\sqrt[6]{\frac{1}{7}}$。
    (E) ×：$(\frac{1}{7})^{-0.7}$＝$((\frac{1}{7})^{-1})^{0.7}$＝$7^{0.7}$＞$5^{0.7}$＝$((\frac{1}{5})^{-1})^{0.7}$＝$(\frac{1}{5})^{-0.7}$。 故選(A)(B)。
- id: doc_109_桃園_武陵_數學_數A_g11s1e2_s1_3
  section: 1
  number: 3
  type: multiple
  page: 1
  stem: 自然常數e＝2.718…為一個定值。已知a＝e$^{\frac{1}{e}}$，且y＝$a^{x}$與y＝$log_{a}$ x的函數圖形，恰有一個交點。試從下列選項中，選出正確的選項：
  options:
  - label: A
    content: 0＜a＜1
  - label: B
    content: ( e , e ) 為其交點
  - label: C
    content: 對於任意實數x＞0，不等式$a^{x}$ ≥ $log_{a}$ x一定恆成立
  - label: D
    content: y＝$a^{x}$與y＝$log_{3}$ x會有兩個交點
  - label: E
    content: 當b＞e$^{\frac{1}{e}}$時，y＝$b^{x}$與y＝$log_{b}$ x有可能不只有一個交點
- id: doc_109_桃園_武陵_數學_數A_g11s1e2_s2_1
  section: 2
  number: 1
  type: fill
  page: 1
  stem: 設log 100 x＝－6.2115，則x從小數點後第m位開始出現不為0的數字，此數字為n，求數對 ( m , n )＝＿＿＿＿。
  explanation: log 100x＝log 100＋log x＝2＋log x＝－6.2115， ⇒ log x＝－8.2115＝－9＋0.7885 ⇒ m＝9， 因為0.7781＜0.7885＜0.8451＜，所以log 6＜0.7885＜log 7 ⇒ n＝6， 故 ( m , n )＝( 9 , 6 )。
- id: doc_109_桃園_武陵_數學_數A_g11s1e2_s2_2
