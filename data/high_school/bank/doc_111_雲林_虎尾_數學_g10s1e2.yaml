  stem: 設f (x) 與g (x) 都是三次多項式，h (x) 是二次多項式，下列哪些選項正確？
  options:
  - label: A
    content: f (x)＋g (x) 是三次多項式
  - label: B
    content: $\frac{f(x)}{g(x)}$．h (x) 是三次多項式
  - label: C
    content: 若f (x) 不被h (x) 整除，則f (x) 除以h (x) 的餘式次數至多一次
  - label: D
    content: 若f (x) 除以 ( 2x－1 ) 的商式為q (x)，則f (x) 除以$(x-\frac{1}{2})$的商式為2q (x)
  - label: E
    content: 若f (x) 除以3x＋6的餘式為－9，則f (x) 除以x＋2的餘式為－3
  answer:
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ×：反例：f (x)＝$x^{3}$＋x，g (x)＝－$x^{3}$ $\Rightarrow$ f (x)＋g (x)＝x為一次多項式。 (B) ×：$\frac{f(x)}{g(x)}$．h (x) 為分式，不為多項式。 (C) ○：因為除式h (x) 為二次多項式，所以餘式二次數至多一次。 (D) ○：由除法原理可知f (x)＝( 2x－1 ) q (x)＋r＝$(x-\frac{1}{2}) \cdot (2q(x))+r$， 所以f (x) 除以$(x-\frac{1}{2})$的商式為2q (x)。 (E) ×：由餘式定理可知f (x) 除以3x＋6的餘式為f (－2)＝－9， 所以f (x) 除以x＋2的餘式為f (－2)＝－9。 故選(C)(D)。
