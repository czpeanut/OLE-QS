  page: 6
  stem: 年底一顆高麗菜喊到300元天價，在農民復耕與搶種下，加上入冬後天氣溫暖，年初市場供過於求，菜價一路暴跌、市場價格低迷，若要運送恐會不敷成本。因此有些農民乾脆開放民眾免費採摘；此外，產地也出現了高麗菜乾的景象，若有過剩的菜乾日後也可送到市場販售。若從經濟學的角度加以分析，下列敘述何者正確？
  options:
  - label: A
    content: 高麗菜價會暴漲暴跌是因為政府失靈所導致
  - label: B
    content: 農民自行將菜烹煮食用，這部分不計入GDP
  - label: C
    content: 免費採摘高麗菜讓高麗菜從純私有財變成純公共財
  - label: D
    content: 從高麗菜變成高麗菜乾，其銷售價格會計入GDP之中
  - label: E
    content: 從菜土變成菜金，說明不同價格帶給使用者不同的效用
