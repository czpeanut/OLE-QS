  stem: youtuber、網路直播主等「網紅」透過網路傳播及其社群平臺推廣，擁有龐大的粉絲，因此衍生出各種消費市場，最終形成一條完整的網紅產業鏈。請問：若以經濟學的角度分析，下列敘述何者正確？
  options:
  - label: A
    content: 高人氣的網紅所代言的產品因曝光率高，還可帶動流行風潮，影響消費者的偏好
  - label: B
    content: 廠商委託網紅替自家的產品宣傳以刺激買氣，這些委託的費用因為屬於地下經濟，因此無法計入GDP
  - label: C
    content: 網紅們憑藉著影片的高點閱率，可以賺進廣告收益，這些收益屬於外部效益
  - label: D
    content: 少數網紅做出不當甚至違法行為拼點閱率，引起年輕人仿效，具有外部成本
  - label: E
    content: 網紅的產生是依賴網路通訊與電子設備的發達，因此網紅之間更容易進行聯合行為，進而壟斷市場
