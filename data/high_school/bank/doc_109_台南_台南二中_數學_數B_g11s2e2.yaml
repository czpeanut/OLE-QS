- id: doc_109_台南_台南二中_數學_數B_g11s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 設A，B為兩獨立事件，且P(B)＝$\frac{3}{5}$，P ( A | B )＝$\frac{1}{2}$，則P ( A∪B) 為何？
  options:
  - label: A
    content: $\frac{1}{2}$
  - label: B
    content: $\frac{3}{4}$
  - label: C
    content: $\frac{2}{5}$
  - label: D
    content: $\frac{3}{5}$
  - label: E
    content: $\frac{4}{5}$
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 因為A、B為獨立事件，所以P ( A∩B )＝P (A) P (B) ⇒ P ( A | B )＝$\frac{P(A\cap B)}{P(B)}=\frac{P(A)P(B)}{P(B)}=P(A)=\frac{1}{2}$
    ⇒ P ( A∪B )＝P (A)＋P (B)－P ( A∩B )＝$\frac{1}{2}+\frac{3}{5}-\frac{1}{2}\times \frac{3}{5}=\frac{8}{10}=\frac{4}{5}$
    故選(E)
- id: doc_109_台南_台南二中_數學_數B_g11s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 擲一粒公正的骰子兩次，若已知點數和大於8，則第一次點數大於4的機率為何？
  options:
  - label: A
    content: $\frac{2}{3}$
  - label: B
    content: $\frac{3}{4}$
  - label: C
    content: $\frac{7}{10}$
  - label: D
    content: $\frac{4}{5}$
  - label: E
    content: $\frac{6}{7}$
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 討論如下 (i) 點數和為9：( 3 , 6 )，( 4 , 5 )，( 5 , 4 )，( 6 , 3 ) (ii) 點數和為10：(
    4 , 6 )，( 5 , 5 )，( 6 , 4 ) (iii) 點數和為11：( 5 , 6 )，( 6 , 5 ) (iv) 點數和為12：( 6 ,
    6 ) 所以P ( 第一次點數大於41點數和大於8 )＝$\frac{7}{10}$ 故選(C)
- id: doc_109_台南_台南二中_數學_數B_g11s2e2_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 設A、B為樣本空間S中的兩事件，P
  options:
  - label: A
    content: ＝$\frac{1}{4}$，P
  - label: B
    content: ＝$\frac{5}{6}$，P ( A∪B )＝$\frac{11}{12}$，試問下列哪些選項是正確的？ (A) P ( A∩B )＝$\frac{1}{12}$
      (B) P ( B | A )＝$\frac{2}{3}$
  - label: C
    content: P ( A | B )＝$\frac{2}{5}$
  - label: D
    content: P ( A' | B' )＝$\frac{1}{2}$
  - label: E
    content: P ( B | A' )＝$\frac{8}{9}$( A'、B'分別表示A、B的餘事件 )
  answer:
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ×：P ( A∪B )＝P (A)＋P (B)－P ( A∩B ) ⇒ $\frac{11}{12}=\frac{1}{4}+\frac{5}{6}-P(A\cap
    B)$ ⇒ P ( A∩B )＝$\frac{1}{6}$ (B)○：P ( B | A )$=\frac{P(A\cap B)}{P(A)}=\frac{\frac{1}{6}}{\frac{1}{4}}=\frac{2}{3}$
    (C) ×：P ( A | B )$=\frac{P(A\cap B)}{P(B)}=\frac{\frac{1}{6}}{\frac{5}{6}}=\frac{1}{5}$
    (D)○：P ( A' | B' )$=\frac{P(A'\cap B')}{P(B')}=\frac{P(A\cup B')}{P(B')}=\frac{1-P(A\cup
    B)}{1-P(B)}=\frac{1-\frac{11}{12}}{1-\frac{5}{6}}=\frac{1}{2}$ (E)○：P ( B | A'
    )$=\frac{P(A'\cap B)}{P(A')}=\frac{P(B)-P(A\cap B)}{1-P(A)}=\frac{\frac{5}{6}-\frac{1}{6}}{1-\frac{1}{4}}=\frac{\frac{2}{3}}{\frac{3}{4}}=\frac{8}{9}$
    故選(B)(D)(E)
- id: doc_109_台南_台南二中_數學_數B_g11s2e2_s2_2
  section: 2
  number: 2
  type: multiple
  page: 1
  stem: 設一袋中有6個白球及4個紅球，每次從此袋中任意取出一球，每球被取到的機會均等，取後不放回，連續取四次。設A表第一次取到白球的事件，B表第三次取到白球的事件，C表取四次球中恰有三次為白球的事件，則下列哪些選項是正確的？
  options:
  - label: A
    content: P
  - label: B
    content: ＝$\frac{3}{5}$ (B) P ( B | A )＝$\frac{5}{9}$
  - label: C
    content: P ( C | A )＝$\frac{5}{21}$
  - label: D
    content: 事件A與事件B為獨立事件
  - label: E
    content: P ( C | A∩B )＝$\frac{2}{7}$
  answer:
  - A
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)○：P(B)＝$\frac{6}{10}$＝$\frac{3}{5}$ (B)○：P ( B | A )＝$\frac{5}{9}$
    (C) ×：P ( C | A )＝$\frac{5}{9}\times \frac{4}{8}\times \frac{4}{7}+\frac{5}{9}\times
    \frac{4}{8}\times \frac{4}{7}+\frac{4}{9}\times \frac{5}{8}\times \frac{4}{7}=\frac{10}{21}$
    (D) ×：P ( B | A )≠P(B) ⇒ A與B不為獨立事件 (E) ×：P ( C | A∩B )＝$\frac{P(A\cap B\cap C)}{P(A\cap
    B)}=\frac{\frac{6}{10}\times \frac{5}{9}\times \frac{4}{8}\times \frac{4}{7}+\frac{6}{10}\times
    \frac{4}{9}\times \frac{5}{8}\times \frac{4}{7}}{\frac{6}{10}\times \frac{5}{9}}=\frac{4}{7}$
    故選(A)(B)
- id: doc_109_台南_台南二中_數學_數B_g11s2e2_s2_3
  section: 2
  number: 3
  type: multiple
