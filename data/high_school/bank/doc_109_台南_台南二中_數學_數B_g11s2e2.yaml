  - label: D
    content: 若A、B為樣本空間S中的兩個非空事件，且A、B為互斥事件，則A'、B'必為互斥事件。( A'、B'分別表示A、B的餘事件 )
  - label: E
    content: 若A'、B'樣本空間S中的獨立事件，則A、B必為獨立事件
  answer:
  - A
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)○：P ( B | A )＝$\frac{P(A\cap B)}{P(A)}$＝1 ⇒ P ( A∩B )＝P (A) ⇒ A$\subseteq$B
    (B) ×：A與C不一定為獨立事件 (C) ×：A與B不一定為獨立事件 (D) ×：因為A，B為互斥事件，所以A∩B＝ψ ⇒ A'∩B'≠ψ，即A'與B'不為互斥事件
    (E)○：若A'與B'為獨立事件，則P ( A'∩B' )＝P ( A' ) P ( B' ) ⇒ 1－P ( A∪B )＝( 1－P (A) ) ( 1－P
    (B) )＝1－P (A) P (B)＋P ( A∩B ) ⇒ 1－( P (A)＋P (B)－P ( A∩B )＝1－P (A)－P (B)＋P ( A∩B
    ) ⇒ P ( A∩B )＝P (A) P (B)，即A與B為獨立事件 故選(A)(E)
