- id: doc_112_台北_北一女中_數學_數A_g11s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 已知函數 f（x）＝$log_{2}$（$9x^{2}$－54x＋112）的最小值為 a，請選出正確的選項。
  options:
  - label: A
    content: 1$\leq$a＜2
  - label: B
    content: 2$\leq$a＜3
  - label: C
    content: 3$\leq$a＜4
  - label: D
    content: 4$\leq$a＜5
  - label: E
    content: 5$\leq$a＜6
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 'f（x）＝$log_{2}$（$9x^{2}$－54x＋112）

    ＝$log_{2}$〔9（$x^{2}$－6x＋9）＋31〕

    ＝$log_{2}$〔9（x－3）$^{2}$＋31〕

    得 x＝3 時，f（x）有最小值 $log_{2}$31

    又 4＝$log_{2}$16＜a＝$log_{2}$31＜5＝$log_{2}$32

    故選(D)'
- id: doc_112_台北_北一女中_數學_數A_g11s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 已知π為圓周率，下列哪一個式子所得的值最大？
  options:
  - label: A
    content: $log_{2}$3．$log_{3}$5．$log_{5}$8
  - label: B
    content: $9^{\log _{3}2}$
  - label: C
    content: 3＋$log_{3}$π
  - label: D
    content: $\log _{\frac{1}{2}} (\sin ^{4}31^{^{\circ}})$
  - label: E
    content: $\log _{2} (\sqrt{41} + 5)+\log _{2} (\sqrt{41} - 5)$
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) $log_{2}$3．$log_{3}$5．$log_{5}$8＝$\frac{\log 3}{\log 2}\times \frac{\log 5}{\log 3}\times \frac{\log 8}{\log 5}$

    ＝$\frac{\log 8}{\log 2}$＝$log_{2}$8＝3

    (B)$9^{\log _{3}2}$＝$(3^{2})^{\log _{3}2}$＝$(3^{\log _{3}2})^{2}$＝$2^{2}$＝4

    (C) 3＋$log_{3}$π＞3＋$log_{3}$3＝4

    (D)∵0＜底數＝$\frac{1}{2}$＜1，又 $sin^{4}$31°＞$sin^{4}$30°

    ∴$\log _{\frac{1}{2}} (\sin ^{4}31^{^{\circ}})$＜$\log _{\frac{1}{2}} (\sin ^{4}30^{^{\circ}})$＝$\log _{\frac{1}{2}} \left( \frac{1}{2} \right) ^{4}$

    ＝$\frac{\log \left( \frac{1}{2} \right) ^{4}}{\log \frac{1}{2}}$＝4

    (E)$\log _{2} (\sqrt{41} + 5)+\log _{2} (\sqrt{41} - 5)$＝$\frac{\log (\sqrt{41} + 5)}{\log 2}+\frac{\log (\sqrt{41} - 5)}{\log 2}$

    ＝$\frac{\log 〔(\sqrt{41} + 5)(\sqrt{41} - 5)〕}{\log 2}$

    ＝$\frac{\log 16}{\log 2}$＝$\frac{\log 2^{4}}{\log 2}$＝4

    得(C)最大，故選(C)'
- id: doc_112_台北_北一女中_數學_數A_g11s1e2_s1_3
