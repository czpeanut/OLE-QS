  stem: 不等式$\left( \frac{1}{2} \right) ^{2x - 5}- 65 \cdot \left( \frac{1}{2} \right) ^{x}+ 2$＜0 之解為＿＿＿＿。
  answer:
  - －1＜x＜5 2.2 3.19434 4.（6，5） 5.9
  answer_status: verified
  answer_source: answer_key
  explanation: '令 t＝$\left( \frac{1}{2} \right) ^{x}$

    則原式可化為$\left( \frac{1}{2} \right) ^{- 5} \cdot t^{2} - 65t + 2$＜0

    $\Rightarrow32t^{2}$－65t＋2＜0

    $\Rightarrow$（32t－1）（t－2）＜0

    $\Rightarrow\frac{1}{32}$＜t＜2

    $\Rightarrow\left( \frac{1}{2} \right) ^{5}$＜$\left( \frac{1}{2} \right) ^{x}$＜$\left( \frac{1}{2} \right) ^{- 1}$，又 0＜底數＜1

    故－1＜x＜5'
