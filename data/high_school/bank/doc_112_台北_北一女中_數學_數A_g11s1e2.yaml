- id: doc_112_台北_北一女中_數學_數A_g11s1e2_s4_1
  section: 4
  number: 1
  type: calc
  page: 3
  stem: '在生物界中，若某個生物種群在一個有限的環境裡繁衍，種群數量初期近似指數增長，但隨著種群在該環境裡的密度增高，對有限資源的種群內競爭也會增加，導致種群增長率不斷下降，種群數量漸漸達到該環境所能容納的最大值，稱為「種群承載力」，而這種增長動態稱為「邏輯斯諦增長（Logistic Growth）」，其增長曲線如右圖所示。當種群數量達到「種群承載力」的一半時，增長率達到最高峰，之後增長率就會不斷下滑，科學家把曲線上的這個點稱為「轉折點」。

    已知 A 菌在生態實驗池裡的邏輯斯諦函數為

    y＝f（x）＝$L \cdot \frac{1}{1 +e^{3 - 0.2x}}$，

    其中常數 L 為種群承載力（單位：億隻），e 為尤拉數，即 e＝$\lim_{n\rightarrow \infty} \left( 1 +\frac{1}{n} \right) ^{n}\approx$2.71828，y 為放入 A 菌 x 小時後該菌的種群數量。試回答下列問題：

    (1) 圖中「轉折點」的 x 坐標。（3 分）

    (2) 若最初放入的 A 菌數量為 L．r ％（單位：億隻），試以下表求出 r 的整數部分數值。 （6 分）

    | t 值 | 2 | e | 3 | 1＋e | 7 | 1＋$e^{2}$ | 1＋$e^{3}$ | 1＋$e^{4}$ |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- |

    | logt 近似值 | 0.3010 | 0.4343 | 0.4771 | 0.5703 | 0.8451 | 0.9237 | 1.3240 | 1.7451 |

    (3) 利用(2)中的附表預估，哪個整數會使 A 菌數量最接近種群承載力的 8 成。（7 分）'
