- id: doc_112_台北_北一女中_數學_數A_g11s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 設等差數列〈$a_{n}$〉之首項 $a_{1}$ 與公差 d 皆為正實數，且$10^{a_{1}}$、$10^{a_{3}}$、$10^{a_{4}}$依序也成等差數列，試選出 $10^{d}$ 的值。
  options:
  - label: A
    content: '1'
  - label: B
    content: $\frac{1 + \sqrt{5}}{2}$
  - label: C
    content: $\frac{- 1 + \sqrt{5}}{2}$
  - label: D
    content: $\frac{1 + \sqrt{3}}{2}$
  - label: E
    content: $\frac{- 1 + \sqrt{3}}{2}$
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '∵$10^{a_{1}}$，$10^{a_{3}}$，$10^{a_{4}}$成等差數列

    ∴$2\times 10^{a_{3}}$＝$10^{a_{1}} + 10^{a_{4}}$

    $\Rightarrow2\times 10^{a_{1} + 2d}$＝$10^{a_{1}} + 10^{a_{1} + 3d}$（同除以$10^{a_{1}}$）

    $\Rightarrow$2×$10^{2d}$＝1＋$10^{3d}$

    令 x＝$10^{d}$，則上式可表示成 $2x^{2}$＝1＋$x^{3}$

    $\Rightarrowx^{3}$－$2x^{2}$＋1＝0

    $\Rightarrow$（x－1）（$x^{2}$－x－1）＝0

    $\Rightarrow$x＝1 或$\frac{1\pm \sqrt{5}}{2}$

    ∵$a_{1}$，d＞0 ∴$10^{d}$＞$10^{0}$＝1

    得 $10^{d}$＝x＝$\frac{1 + \sqrt{5}}{2}$

    故選(B)'
- id: doc_112_台北_北一女中_數學_數A_g11s1e2_s2_1
  section: 2
  number: 1
  type: multiple
  page: 2
  stem: 已知 a、b 為任意實數，試選出下列正確的選項。
  options:
  - label: A
    content: $a^{\frac{1}{3}}$＝$\sqrt[3]{a}$
  - label: B
    content: $loga^{2}$＝2 loga
  - label: C
    content: $\log _{(a^{2} + 2)^{2}} (b^{2} + 1)$＝$\frac{1}{2}\log _{a^{2} + 2} (b^{2} + 1)$
  - label: D
    content: $\log _{a^{2} + 2} (b^{2} + 1)$＜1 可得 $b^{2}$＋1＜$a^{2}$＋2
  - label: E
    content: $\log \frac{(a^{2} + 2)+(b^{2} + 1)}{2}$的最小值為$\frac{1}{2}\log 2$
  answer:
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：a＞0，則$a^{\frac{1}{3}}$才有定義

    (B)╳：反例：a＝－1，log（－1）$^{2}$＝log1＝0，但 log（－1）無意義

    (C)○：∵$a^{2}$＋2 及 $b^{2}$＋1 恆正 ∴對數律成立

    (D)○：∵$a^{2}$＋2$\geq$2＞1$\Rightarrow$y＝$\log _{a^{2} + 2}x$為遞增函數

    又$\log _{a^{2} + 2} (b^{2} + 1)$＜1＝$\log _{a^{2} + 2} (a^{2} + 2)$

    ∴$b^{2}$＋1＜$a^{2}$＋2

    (E)╳：∵$a^{2}$，$b^{2}\geq$0

    ∴$\frac{(a^{2} + 2)+(b^{2} + 1)}{2}\geq\frac{2 + 1}{2}$＝$\frac{3}{2}$

    $\Rightarrow\log \frac{(a^{2} + 2)+(b^{2} + 1)}{2}$的最小值為$\log \frac{3}{2}$

    $\left( 註 : \frac{(a^{2} + 2)+(b^{2} + 1)}{2} \right.\geq\sqrt{(a^{2} + 2)(b^{2} + 1)}\geq\sqrt{2}$等號不會同時成立，第一個等號成立於 $a^{2}$＋2＝$b^{2}$＋1，第二個等號成立於 $a^{2}$＝$b^{2}$＝0$\left. \begin{matrix} \\ \end{matrix} \right)$

    故選(C)(D)'
- id: doc_112_台北_北一女中_數學_數A_g11s1e2_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 設$\frac{1}{3}$＜b＜1＜a＜2，試選出下列正確的選項。
  options:
  - label: A
    content: $2^{\sqrt{5}}$＞$a^{\sqrt{5}}$
  - label: B
    content: $b^{- \sqrt{5}}$＞$\left( \frac{1}{3} \right) ^{- \sqrt{5}}$
  - label: C
    content: $\log _{\frac{1}{3}}\sqrt{5}$＞$\log _{b}\sqrt{5}$
  - label: D
    content: $\log _{2}\sqrt{5}$＞$\log _{a}\sqrt{5}$
  - label: E
    content: $\left( \frac{1}{3} \right) ^{\sqrt{5}}$＞$\log _{\frac{1}{3}}\sqrt{5}$
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：∵2＞a ∴$2^{\sqrt{5}}$＞$a^{\sqrt{5}}$

    (B)╳：∵$b^{- \sqrt{5}}$＝$\left( \frac{1}{b} \right) ^{\sqrt{5}}$，又 1＜$\frac{1}{b}$＜3

    ∴$b^{- \sqrt{5}}$＜$3^{\sqrt{5}}$＝$\left( \frac{1}{3} \right) ^{- \sqrt{5}}$

    (C)○：∵$\frac{1}{3}$＜b＜1 ∴$\log \frac{1}{3}$＜logb＜log1＝0

    $\Rightarrow\log _{\frac{1}{3}}\sqrt{5}$＝$\frac{\log \sqrt{5}}{\log \frac{1}{3}}$＞$\frac{\log \sqrt{5}}{\log b}$＝$\log _{b}\sqrt{5}$

    (D)╳：∵1＜a＜2 ∴0＝log1＜loga＜log2

    $\Rightarrow\log _{2}\sqrt{5}$＝$\frac{\log \sqrt{5}}{\log 2}$＜$\frac{\log \sqrt{5}}{\log a}$＝$\log _{a}\sqrt{5}$

    (E)○：$\left( \frac{1}{3} \right) ^{\sqrt{5}}$＞0＞$\log _{\frac{1}{3}}\sqrt{5}$

    故選(A)(C)(E)'
- id: doc_112_台北_北一女中_數學_數A_g11s1e2_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: 已知正實數 a、b 恆滿足 b＝$a^{2}$，P（loga，logb）為坐標平面上的點，試選出下列正確的選項。
  options:
  - label: A
    content: P 點有可能是（0，0）
  - label: B
    content: P 點有可能是$(\sqrt{10} , 2\sqrt{10})$
  - label: C
    content: P 點有可能在第四象限
  - label: D
    content: 所有可能的 P 點形成一直線
  - label: E
    content: P 點的 x 坐標、y 坐標有可能同時為正整數
  answer:
  - A
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：a＝b＝1，則 P（0，0）

    (B)○：a＝$10^{\sqrt{10}}\Rightarrow$b＝$a^{2}$＝$10^{2\sqrt{10}}$

    得$P (\log 10^{\sqrt{10}} , \log 10^{2\sqrt{10}})$＝$P (\sqrt{10} , 2\sqrt{10})$

    (C)╳：若 P 點在第四象限

    $\Rightarrow$loga＞0 且 logb＜0

    $\Rightarrow$a＞1 且 0＜b＜1 和 b＝$a^{2}$ 矛盾

    (D)○：令 x＝loga，y＝logb

    ∵b＝$a^{2}$

    ∴y＝logb＝$loga^{2}$＝2 loga＝2x

    $\Rightarrow$所有可能的 P 點形成一直線

    (E)○：令 a＝10$\Rightarrow$b＝100，則 P（loga，logb）＝P（1，2）

    故選(A)(B)(D)(E)'
- id: doc_112_台北_北一女中_數學_數A_g11s1e2_s3_1
