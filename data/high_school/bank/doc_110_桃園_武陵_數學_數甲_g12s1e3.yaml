- id: doc_110_桃園_武陵_數學_數甲_g12s1e3_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 設多項式函數 y＝f（x）的圖形與 x 軸的交點為（－1，0）與（2，0），其圖形如右圖，試問下列哪些選項是正確的？
  options:
  - label: A
    content: $\int_{-1}^{2} f ( x )dx > 0$
  - label: B
    content: $\int_{-1}^{2} f ' ( x )dx > 0$
  - label: C
    content: $\int_{-1}^{2} f '' ( x )dx > 0$
  - label: D
    content: $\int_{-1}^{\frac{1}{3}} f ''' ( x )dx > 0$
  - label: E
    content: $\int_{-1}^{0} f ' ( x )dx < \int_{0}^{2} f ' ( x )dx$
  group_stem: 說明：錯一個選項得 5 分，錯兩個選項得 2 分，錯 3 個選項以上不得分。
  shared_asset: g1_1_2
  answer:
  - A
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：∵f（x）在（－1，2）上均為正

    ∴$\int_{-1}^{2} f ( x )dx$＞0

    (B)╳：$\int_{-1}^{2} f '' ( x )dx$＝f(2)－f（－1）＝0

    (C)╳：$\int_{-1}^{2} f '''' ( x )dx$＝f''(2)－f''（－1）

    又 f（x）在 x＝2 處的切線斜率為負$\Rightarrow$f''(2)＜0

    f（x）在 x＝－1 處的切線斜率為正$\Rightarrow$f''（－1）＞0

    ∴$\int_{-1}^{2} f '''' ( x )dx$＜0

    (D)○：$\int_{-1}^{\frac{1}{3}} f '''''' ( x )dx$＝$f '''' \left( \frac{1}{3} \right)$－f"（－1）

    又 f（x）在 x＝$\frac{1}{3}$處凹口向上$\Rightarrowf '''' \left( \frac{1}{3} \right)$＞0

    f（x）在 x＝－1 處凹口向下$\Rightarrow$f"（－1）＜0

    ∴$\int_{-1}^{\frac{1}{3}} f '''''' ( x )dx$＞0

    (E)╳：$\int_{-1}^{0} f '' ( x )dx$＝f(0)－f（－1）＝1－0＝1

    $\int_{0}^{2} f '' ( x )dx$＝f(2)－f(0)＝0－1＝－1

    ∴$\int_{-1}^{0} f '' ( x )dx$＞$\int_{0}^{2} f '' ( x )dx$

    故選(A)(D)'
