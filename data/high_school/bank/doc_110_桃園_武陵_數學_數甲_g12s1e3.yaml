- id: doc_110_桃園_武陵_數學_數甲_g12s1e3_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 在 xy 平面上，已知拋物線Γ 的方程式為 $x^{2}$＝4y，其頂點為 A 點。今<u>小明</u>站在 y 軸上的某一定點，而<u>小華</u>在Γ 的圖形上移動，<u>小華</u>發現他與<u>小明</u>之間的距離最短時的位置不在 A 點，試問下列哪些坐標有可能是<u>小明</u>所站的點坐標？
  options:
  - label: A
    content: （0，3）
  - label: B
    content: $\left( 0 , \frac{5}{2} \right)$
  - label: C
    content: （0，2）
  - label: D
    content: $\left( 0 , \frac{3}{2} \right)$
  - label: E
    content: （0，－1）
  group_stem: 說明：錯一個選項得 5 分，錯兩個選項得 2 分，錯 3 個選項以上不得分。
  shared_asset: g1_1_2
  answer:
  - A
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '設<u>小明</u>所在的點坐標為（0，b），<u>小華</u>的點坐標為（2t，$t^{2}$）

    $\Rightarrow$<u>小明</u>與<u>小華</u>的距離為

    d＝$\sqrt{( 2t - 0 )^{2}+( t^{2}-b )^{2}}$＝$\sqrt{t^{4}+( 4 - 2b )t^{2}+b^{2}}$＝$\sqrt{〔 t^{2}+( 2 -b ) 〕^{2}+b^{2}-( 2 -b )^{2}}$ ＝$\sqrt{〔 t^{2}+( 2 -b ) 〕^{2}+( 4b - 4 )}$

    當 $t^{2}$＝b－2，即 t＝$\pm \sqrt{b - 2}$時，d 有最小值為$\sqrt{4b - 4}$

    $\Rightarrow$依題意，頂點非發生最小值之點$\Rightarrow$b－2≠0，又 b－2$\geq$0

    得 b＞2，故選(A)(B)'
