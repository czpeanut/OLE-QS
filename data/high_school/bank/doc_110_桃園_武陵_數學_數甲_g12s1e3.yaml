  answer:
  - $x^{3}$－12x＋10
  answer_status: verified
  answer_source: answer_key
  explanation: '∵（0，10）為反曲點，同時也為圖形的對稱中心

    又（2，－6）為極小點

    ∴（－2，26）為極大點

    令 f''（x）＝a（x－2）（x＋2）＝$ax^{2}$－4a$\Rightarrow$f（x）＝$\frac{1}{3}ax^{3}$－4ax＋C，C 為常數 （2，－6），（0，10）代入 f（x）得$\begin{cases}-\frac{16}{3}a +C =-6 \\ C = 10\end{cases}\Rightarrow\begin{cases}a = 3 \\ C = 10\end{cases}$

    故 f（x）＝$x^{3}$－12x＋10'
