  group_stem: 新型冠狀病毒（COVID-19）是 2020 年影響全世界的重大傳染病，各國政府要求人民應減少接觸，即使接觸也應維持 1.5 公尺的「社交距離」，以降低傳染的機率。面對疫情早期的擴散，可透過染病者的接觸史調查，包括停留地點、移動路徑等，藉此尋找到可能接觸染病者的人民並且隔離，以避免疫情持續擴散。部分國家利用電子圍籬，要求隔離者身上攜帶電子設備，一旦離開電子圍籬範圍就會受罰。然而非洲的疫情控制，一開始就錯過疫情早期圍堵的時機，直接進入到醫療與救援的領域，當地空間資訊的缺乏，使得多數人無法透過基本圖資，來掌握防疫物資、隔離地點、檢疫醫療中心位置等相關資訊。因此，開放街圖人道救援小組號召群眾製圖者，協助建立道路、場所的基礎空間圖資，以利推動當地的公共衛生安全策略。請問：
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
