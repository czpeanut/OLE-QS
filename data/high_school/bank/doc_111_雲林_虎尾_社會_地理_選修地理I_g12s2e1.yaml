- id: doc_111_雲林_虎尾_社會_地理_選修地理I_g12s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 以下 4 個情境的描述，哪一項「不屬於」幾何空間概念？
  options:
  - label: A
    content: 雲林縣位於臺灣中部
  - label: B
    content: 數百人參加的聖誕夜彌撒
  - label: C
    content: 居住人口約 37 萬的某都市
  - label: D
    content: 可容納 1 萬人的體育館
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)陳述人與該空間的社會關係，屬於社會空間的概念。
- id: doc_111_雲林_虎尾_社會_地理_選修地理I_g12s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 一般公民可以透過地理問題思考及運用各項工具分析，做出不同的方案供決策者使用，此決策者最有可能為下列何者？
  options:
  - label: A
    content: 學校校長
  - label: B
    content: 地方文史工作者
  - label: C
    content: 地方首長
  - label: D
    content: 考古人類學家
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)地方文史工作者為民間團體，屬於一般公民。(A)(C)屬於公家機構。(D)屬於專家學者。
- id: doc_111_雲林_虎尾_社會_地理_選修地理I_g12s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 「便利商店似乎多開在車站、學校、醫院等附近」，如果要研究這個問題，可以先將便利商店、車站、學校、醫院標示在地圖上，再進行哪一項分析，就可以得到推論？
  options:
  - label: A
    content: 疊圖分析
  - label: B
    content: 路徑分析
  - label: C
    content: 視域分析
  - label: D
    content: 環域分析
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 題目提及先將便利商店、車站、學校、醫院標示在地圖上，因此只要以車站、學校、醫院為中心，圈畫其特定範圍內的便利商店即可，故選(D)。
- id: doc_111_雲林_虎尾_社會_地理_選修地理I_g12s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 地理資訊系統中，資料儲存的格式有向量和網格模式兩種，下列哪一項資料適合以向量格式儲存？
  options:
  - label: A
    content: 年雨量的分布
  - label: B
    content: 地形起伏
  - label: C
    content: 人口密度
  - label: D
    content: 高壓電塔
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 向量模式適合儲存點資料、不連續現象，故選(D)。
- id: doc_111_雲林_虎尾_社會_地理_選修地理I_g12s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 我們在使用網路地圖服務時，輸入地址就能查詢位置，這是因為有臺灣的全國門牌地址定位，此為哪一種網路地圖服務？
  options:
  - label: A
    content: 地理資訊圖資雲服務平台
  - label: B
    content: 國土測繪圖資服務雲
  - label: C
    content: 臺灣百年歷史地圖網站
  - label: D
    content: 自發性地理資訊
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 臺灣門牌定位系統乃地理資訊整合圖台（TGOS）所建立的資料。
- id: doc_111_雲林_虎尾_社會_地理_選修地理I_g12s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 下列哪一項「非」地理現象「位置」的位相關係描述？
  options:
  - label: A
    content: 臺灣在西太平洋
  - label: B
    content: 臺東市位在卑南溪的左岸
  - label: C
    content: 高雄捷運美麗島站是紅線和橘線的交會點
  - label: D
    content: 古坑的華山步道為著名休閒景點
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 「位置」可分為絕對位置或相對位置，(A)(B)(C)皆為相對位置的描述。(D)僅在描述某地的特色。
- id: doc_111_雲林_虎尾_社會_地理_選修地理I_g12s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 美國紐約市內的哈林區與布魯克林區相隔一條河，但空間背後亦象徵了非裔與白人、貧窮與富裕、勞動與管理階層的差別。唐人街和小義大利區都是在同一個街區裡，但卻擁有完全不一樣的風情，因社會地位、財產、種族的差異而在空間上形塑明顯差異的地景。上文主要在探討空間的何種概念？
  options:
  - label: A
    content: 社會空間
  - label: B
    content: 幾何空間
  - label: C
    content: 空間維度
  - label: D
    content: 空間資訊
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)社會空間乃依據人際關係所呈現的社會互動範圍。由文中大量描述哈林區及布魯克林區，其種族、經濟、文化的特性，可知其主要在呈現該二區的社會空間。
- id: doc_111_雲林_虎尾_社會_地理_選修地理I_g12s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 學校的校車沿途必須停靠某些固定的站點，請問學校可以運用地理資訊系統的哪一種分析功能，來規劃校車停靠的站點？
  options:
  - label: A
    content: 最佳路徑分析
  - label: B
    content: 疊圖分析
  - label: C
    content: 地形分析
  - label: D
    content: 環域分析
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 校車停靠的的站點可視為空間中的點資料，而規劃校車沿途應在哪些站點停靠所分析出的路徑，屬於(A)最佳路徑分析。
- id: doc_111_雲林_虎尾_社會_地理_選修地理I_g12s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 圖例是地圖設計的重要元素之一，其是屬於下列哪一種資料？
  options:
  - label: A
    content: 空間資料
  - label: B
    content: 屬性資料
  - label: C
    content: 美化資料
  - label: D
    content: 其他資料
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)屬性資料用來表現空間現象的本質，而圖例、地圖符號乃某空間現象本質的概括化，故屬於屬性資料。
- id: doc_111_雲林_虎尾_社會_地理_選修地理I_g12s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 承上題，以道路為例，在地圖設計時，公路部分分為國道、省道、縣道、鄉道、小徑等，這是顯示道路的哪一種訊息？
