- id: doc_110_桃園_內壢_自然_物理_選修物理II_g11s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 考慮可視為質點的甲、乙兩原子，甲固定於原點，乙只在x軸上運動，乙受甲的原子力F只與距離x有關，且F以沿＋x方向為正，F與x的關係，在2.2×$10^{－10}$ m ≤ x ≤ 5.0×$10^{－10}$ m間如圖所示。乙由靜止自P點開始移動，假設乙除原子力F外不受其他外力作用，則下列敘述何者正確？
  options:
  - label: A
    content: 乙原子到達P點時，動能最大
  - label: B
    content: 乙原子到達R點時，動能最大
  - label: C
    content: 乙原子到達Q點後便靜止於該處
  - label: D
    content: 乙原子到達R點後便靜止於該處
  - label: E
    content: 乙原子到達R點時，速度一定指向x方向
  assets:
  - key: s1_5_f1
    kind: figure
    file: doc_110_桃園_內壢_自然_物理_選修物理II_g11s2e1/s1_5_f1.png
    crop:
      page: 1
      rect:
      - 470.1
      - 567.45
      - 688.4
      - 672.95
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)(C)乙原子到達Q點時，動能最大；(D)(E)乙原子到達R點時，具＋x方向速度，非為靜止。故選(E)。
- id: doc_110_桃園_內壢_自然_物理_選修物理II_g11s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 質量為5 kg的物體在直線上運動，其速度－時間的函數關係為v(t)＝2t＋3（SI），則在0～2 s內外力對該物體所作平均功率為多少W？
  options:
  - label: A
    content: '25'
  - label: B
    content: '50'
  - label: C
    content: '75'
  - label: D
    content: '100'
  - label: E
    content: '125'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: $v_{1}$（t＝0）＝3 (m／s) $v_{2}$（t＝2）＝2．2＋3＝7 (m／s) W＝ΔK＝$\frac{1}{2}$m($v_{2}^{2}$－$v_{1}^{2}$)＝$\frac{1}{2}$．5．($7^{2}$－$3^{2}$)＝100 (J) $\overline{P}$＝$\frac{W}{\Delta t}$＝$\frac{100}{2}$＝50 (W)。故選(B)。
