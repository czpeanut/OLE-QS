- id: doc_110_桃園_內壢_自然_物理_選修物理II_g11s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 如圖所示，一質量為2 m的棒球以速度v水平飛向擊球手，擊球手揮棒擊球，使球以速度v鉛直向上飛出，設水平飛行方向為＋x，鉛垂向上飛出方向為＋y，則球所受到衝量的量值及方向為下列何者？
  options:
  - label: A
    content: 2 mv，向＋y方向
  - label: B
    content: mv，與＋x方向成45°
  - label: C
    content: 2$\sqrt{2}$mv，與＋x方向成135°
  - label: D
    content: $\sqrt{2}$mv、與＋x方向成45°
  - label: E
    content: $\sqrt{2}$mv，與＋x方向成135°
  assets:
  - key: s1_1_f1
    kind: figure
