- id: doc_110_桃園_內壢_自然_物理_選修物理II_g11s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 質量為M的砲車靜置於光滑水平地面上，以相對於地面的速度$v_{0}$、仰角θ$_{0}$發射質量為m的砲彈，則發射砲彈後，砲車後退的速率為何？
  options:
  - label: A
    content: $\frac{mv_{0}}{M}$
  - label: B
    content: $\frac{Mv_{0}}{m}$
  - label: C
    content: $\frac{mv_{0}\sin \theta _{0}}{M}$
  - label: D
    content: $\frac{mv_{0}\cos \theta _{0}}{M}$
  - label: E
    content: $\frac{Mv_{0}\cos \theta _{0}}{m}$
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: $\vec{p_{i}}$＝$\vec{p_{f}}$ 0＝$mv_{0}$ cosθ$_{0}$＋(M－m)$\vec{v}\vec{v}$＝－$\frac{mv_{0}\cos \theta _{0}}{M-m}$ 若m ≪ M，則|$\vec{v}$|＝$\frac{mv_{0}\cos \theta _{0}}{M}$。故選(D)。
- id: doc_110_桃園_內壢_自然_物理_選修物理II_g11s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 兩個原靜止的物體，質量與所受的外力分別為m＝3 kg，$\vec{F}_{1}$＝$\widehat{i}$＋6$\widehat{j}$ (N)：$m_{2}$＝2 kg，$\vec{F}_{2}$＜4$\widehat{i}$＋$\widehat{j}$ (N)，則此系統的質心加速度量值為多少m／s？
  options:
  - label: A
    content: '0'
  - label: B
    content: $\sqrt{10}$
  - label: C
    content: '13'
  - label: D
    content: '17'
  - label: E
    content: $\sqrt{17}$
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: $\vec{a_{c}}$＝$\frac{\vec{F_{1}}+\vec{F_{2}}}{m_{1}+m_{2}}$＝$\frac{(1, 6)+(4, 14)}{3+2}$＝$\frac{(5, 20)}{5}$＝（1，4） |$\vec{a_{c}}$|＝$\sqrt{1^{2}+4^{2}}$＝$\sqrt{17}$ (m／$s^{2}$)。故選(E)。
