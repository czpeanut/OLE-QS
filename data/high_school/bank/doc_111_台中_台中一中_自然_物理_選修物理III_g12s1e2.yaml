    content: 頻率每秒振動500、1000或1500次的聲波皆可在管內產生共振
  - label: D
    content: 若將空心管的底端用硬紙板封住，空心管的共振基頻將變大
  - label: E
    content: 若將管口半徑減半，則管內產生聲音共振的基因頻率將變為原來的2倍
