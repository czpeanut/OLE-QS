- id: doc_111_台中_台中一中_自然_物理_選修物理III_g12s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 長笛與單簧管為常見的管樂器，長笛的管柱兩端皆為開口，單簧管的管柱一端封閉而另一端開口。吹奏時，透過按壓管柱的音孔，可改變管內空氣柱長度，當吹氣通過簧片或管口產生聲音的頻率與空氣柱振動頻率相同時，會發生共振並在管內空氣柱形成駐波。若忽略聲音駐波的管口修正量，當長笛吹奏出基音的頻率與單簧管第一泛音的頻率相同時，此時長笛空氣柱長度為單簧管空氣柱長度的幾倍？[109指考]
  options:
  - label: A
    content: 1/2
  - label: B
    content: 2/3
  - label: C
    content: 3/4
  - label: D
    content: '2'
  - label: E
    content: 3/2
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: $f_{1}$＝$f_{3}$'，$\frac{v}{2L_{1}}$＝$\frac{3v}{4L_{2}}$，$\frac{L_{1}}{L_{2}}$＝$\frac{2}{3}$。故選(B)。
