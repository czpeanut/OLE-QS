- id: doc_111_台中_台中一中_自然_物理_選修物理III_g12s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 地震預警是利用地震在地球內部傳播的P波與S波的速度差，透過偵測首先到達的P波來判斷地震規模，在振動強烈的S波到達前的時間內發出預警，以利後續應變。2021年2月7日發生芮氏規模6.1的地震，許多民眾手機收到多次國家級警報。該地震震源在臺灣東部外海，深度約為112
    km。宜蘭市地震監測站（距震源直線距離約為141 km）測得地動加速度對時間的關係，如下圖所示，圖中第0秒為地震起始時間。若宜蘭市預警系統可在P波抵達後的7秒內就完成判斷並發出預警至各縣市，則對於距震源直線距離約215
    km之苗栗市，可提供的應變時間約為幾秒？（假設P波與S波的波速固定，且都由震源直線傳播到地表上的各地點。）[110指考]
  options:
  - label: A
    content: '7'
  - label: B
    content: '14'
  - label: C
    content: '26'
  - label: D
    content: '33'
  - label: E
    content: 37 秒
  assets:
  - key: s1_4_f1
    kind: figure
    file: doc_111_台中_台中一中_自然_物理_選修物理III_g12s1e2/s1_4_f1.png
    crop:
      page: 1
      rect:
      - 54.9
      - 671.8
      - 401.05
      - 766.15
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: t＝0 (s)：發生地震；t＝23 (s)：宜蘭接收到P波訊號；t＝30 (s)：發出預警至各縣市。 苗栗市接收到S波訊號，時間t＝$\frac{215}{141/37}$＝56.4
    (s)，則應變時間56.4－30＝26.4 (s)。故選(C)。
