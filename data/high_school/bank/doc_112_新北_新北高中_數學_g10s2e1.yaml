    kind: figure
    file: doc_112_新北_新北高中_數學_g10s2e1/s3_1_f1.png
    crop:
      page: 1
      rect:
      - 431.4
      - 674.2
      - 564.3
      - 753.1
  answer:
  - A
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '令 $T_{1}$、$T_{2}$、……的邊長分別為 $a_{1}$、$a_{2}$、……，面積分別為 $A_{1}$、$A_{2}$、……

    由相似形可知 1：1＝$a_{n}$：（$a_{n＋1}$－$a_{n}$） ⇒ $a_{n＋1}$＝$2a_{n}$

    (A) ○：△ABC 為 1：1：$\sqrt{2}$之等腰直角三角形

    (B) ╳：應為等比數列

    (C) ○：∵$a_{1}$＝1 ∴$a_{4}$＝1×$2^{3}$＝8

    (D) ╳：$a_{6}$＝$a_{2}$×$2^{4}$＝$16a_{2}$ ⇒ $A_{6}$＝$256A_{2}$

    (E) ╳：$A_{1}$＝1 且 $A_{n}$ 是公比為 4 的等比數列

    故 $A_{1}$＋$A_{2}$＋……＋$A_{7}$＝$\frac{1\times (1-4^{7})}{1-4}$

    故選(A)(C)'
