- id: doc_112_新北_新北高中_數學_g10s2e1_s2_2
  section: 2
  number: 2
  type: single
  page: 1
  stem: '以下是用數學歸納法證明「任意取 n 個自然數，這 n 個自然數的值為同一數」的方法：

    ①當 n＝1 時，原敘述顯然成立。

    ②設 n＝k 時原敘述成立，即任意取 k 個自然數，這 k 個自然數的值為同一數。

    ③則 n＝k＋1 時，令此 k＋1 個自然數為 $N_{1}$，$N_{2}$，……，$N_{k}$，$N_{k＋1}$。

    因為 $N_{1}$，$N_{2}$，……，$N_{k}$ 為 k 個自然數，故 $N_{1}$＝$N_{2}$＝……＝$N_{k}$；

    又 $N_{2}$，$N_{3}$，……，$N_{k＋1}$ 為 k 個自然數，故 $N_{2}$＝$N_{3}$＝……＝$N_{k＋1}$。

    所以 $N_{1}$＝$N_{2}$＝$N_{k}$＝$N_{k＋1}$，這說明了 $N_{1}$，$N_{2}$，……，$N_{k}$，$N_{k＋1}$
    的值為同一數。

    ④由數學歸納法原理得知，原敘述成立。

    若其中的推論或證明有錯誤，請選出哪一步驟開始發生錯誤。'
  options:
  - label: A
    content: ①
  - label: B
    content: ②
  - label: C
    content: ③
  - label: D
    content: ④
  - label: E
    content: 證明正確無誤
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '從③起有誤，不可使用 $N_{2}$＝$N_{3}$＝……＝$N_{k＋1}$

    故選(C)'
