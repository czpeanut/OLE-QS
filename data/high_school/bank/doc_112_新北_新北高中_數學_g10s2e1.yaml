    content: △ABC 為等腰三角形
  - label: B
    content: $T_{1}$、$T_{2}$、$T_{3}$ 的邊長成等差數列
  - label: C
    content: $T_{4}$ 的邊長為 8
  - label: D
    content: $T_{6}$ 的面積是 $T_{2}$ 的 16 倍
  - label: E
    content: $T_{1}$、$T_{2}$、……、$T_{7}$ 等七個正方形的面積總和為$\frac{2\times (1-4^{7})}{1-4}$
  assets:
