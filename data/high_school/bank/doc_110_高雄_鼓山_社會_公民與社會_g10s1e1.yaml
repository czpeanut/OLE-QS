  stem: 為防堵非洲豬瘟疫情，立法院修法加重罰責，旅客若經查獲從非洲豬瘟疫區攜帶豬肉品入境者，第一次違規開罰20萬，第二次最高重罰100萬；而境外旅客若攜帶肉品沒有立刻繳清將被拒絕入境。我國政府得以拒絕未繳清罰款之境外旅客入境，主要是基於下列哪一理由？
