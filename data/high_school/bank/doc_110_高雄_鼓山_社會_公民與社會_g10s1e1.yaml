  stem: 安達曼群島上的加洛瓦族是目前全球最原始部落之一。自然的生態環境提供他們生活所需，使得加洛瓦人可以與世隔絕。但隨著觀光客的進入，加洛瓦人染上外來疾病的人數增加，導致人口逐年減少；且遊客就像參觀動物園一樣，隨意丢食物給加洛瓦人，還有收賄員警命令加洛瓦族人跳舞娛樂觀光客，以交換食物。請問：加洛瓦人可能面臨下列何種困境？
