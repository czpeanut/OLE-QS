  stem: 綜觀文章第三段及第四段的論述內容，可推導出本文對於新設立的「國家人權委員會」所提出的疑問主要在於：
  options:
  - label: A
    content: 九大核心國際人權公約目前仍有四份尚未國內法化，如何透過新設立的機構加速施行？
  - label: B
    content: 「惡法亦法」或者「惡法非法」的觀點，是否影響監察院長人事任命的政黨酬庸爭議？
  - label: C
    content: 當監察委員以監察本質對政府作為進行監督時，是否可能與人權保障的內涵產生衝突？
  - label: D
    content: 過往政府執法和施政的績效太低、怠惰疏失之實，如何透過此委員會的監督來改善？
  group_stem: 蔡英文總統於2020年8月1日出席我國「國家人權委員會」揭牌典禮時表示，經過長時間的努力，臺灣終於設立符合聯合國《巴黎原則》的獨立人權機構，往「人權立國」的理想更加靠近。她期盼國家人權委員會在監察院「監督」的傳統上，進一步達到「人權促進與保障」的層次，讓國家的人權機制更成熟，社會的人權觀念更深化。 綜觀我國民間團體致力推動臺灣設立國家人權機構的二十年運動史，於國家人權委員會成立前，我國的政府三大人權保障組織機制包括總統府人權諮詢委員會、行政院人權保障推動小組及監察院人權保障委員會。如今原先監察院的人權保障委員會停止運作，總統府人權諮詢委員會亦完成階段性任務，而<u>2017年受邀來臺進行評估任務</u>的三位國際專家指出：若臺灣選擇將國家人權機構設置於監察院，那麼有必要對監察院進行大幅改革與強化，才能使其成為一個「具備人權職責的監察機構」，並且完全符合聯合國《巴黎原則》之要求。 國際專家們所整理出的〈2017年臺灣國家人權機構評估報告〉總共提出12點建議事項，其中最重要的幾點包括：(1)必須修訂相關法律，明確賦予監察院保護與促進人權之必要職能與權限；(2)必須調整監察院內部的組織架構與工作方式，確保其運作能充份反映人權工作與監察工作兩項職責的同等地位：(3)加強人事任命程序的公開透明，並確保監察院半數成員具備人權專業與經驗，方能有效履行國家人權機構的職責。 此外，非政府組織「人權公約施行監督聯盟」提到，過去曾有數名監察委員發文糾正財政部與國有財產署，認為政府在清查被占用土地的「績效」太低，未能達到立法院每年收回10％土地的目標。然而國內人權社群認為，居住權乃是《經濟社會文化權利國際公約》所保障的基本人權，所謂「違法」之現狀，部分也是過往施政怠惰疏失下的結果，故政府應該透過協商安置而非提告迫遷的方式來處理。究竟「惡法亦法」，或者「惡法非法」？這顯然是監察工作與人權工作交會時難以迴避的一道命題，也必須花費更多的心力與說理去化解這樣的矛盾，致力促進國內法律政委與國際人權法的協調一致。
  tags:
