  stem: 文中香港民眾受訪時表示，希望臺灣人要好好珍惜自身的民主體制，因為可以直接選舉行政首長。這樣的心聲，反映他認為香港人並未能落實了哪一項公民權利？
  options:
  - label: A
    content: 自由權
  - label: B
    content: 參政權
  - label: C
    content: 社會權
  - label: D
    content: 文化權
  group_stem: 2019年，香港政府推出《逃犯條例》修訂草案，引發香港史上最大規模的「反送中」群眾運動，於6月兩度出現號稱百萬人，甚至兩百萬人的民眾上街頭示威遊行，身著黑衣、手持雨傘，黑壓壓占滿街道的人數之多，震驚了整個世界。 對中國大量新移民的反感、港人身分流失的恐慌，以及對議會失能的失望，三因素構成「反送中運動」的遠因。而《逃犯條例》允許將嫌犯移送中國的後門，讓香港人擔心未來將因為有反中的言行就遭受政治迫害，被加上罪名後移送中國。這股害怕失去引以為傲的「自由」與「法治」的恐慌情緒，瞬間引爆反送中的浪潮。 香港民眾受訪時表示，希望臺灣人要好好珍惜自身的民主體制，因為可以直接選舉行政首長，並用選票教訓違背民意的民選首長及民意代表。但對香港人而言，始終沒能體驗到這個民主政治的基本功能，因為特首（香港最高行政首長）並非由全體香港公民直接選出，且要經由中央政府任命；而立法會（香港最高民意機關）由於特殊的選舉制度，始終被親近中國政府的建制派議員主導，並時常被民眾抨擊沒有扮演好監督政府的角色。香港大學一份定期的民意調查研究也顯示，在香港回歸中國22周年之際，香港人的國家認同也有了很大的變化，「香港人」認同升至1997年回歸以來的新高，而「中國人」認同則處於新低點。民調分析師指出，兩次反修訂《逃犯條例》遊行後的調查結果，清楚反映事件對香港民眾在身分認同上的衝擊。
