- id: doc_110_高雄_鼓山_社會_公民與社會_g10s1e1_s2_35
  section: 2
  number: 35
  type: single
  page: 5
  stem: 根據上述兩份資料，關於「新住民」的內涵，下列敘述何者較符合？
  options:
  - label: A
    content: 新住民是來臺工作而取得我國國籍的外籍人士
  - label: B
    content: 新住民是來臺就學而取得我國國籍的外籍人士
  - label: C
    content: 新住民包含所有他國與臺灣人結婚的外籍人士
  - label: D
    content: 新住民僅包含東南亞與臺灣人結婚的外籍人士
  group_stem: 資料一：節錄自行政院網站國情簡介： 臺灣住民以漢人為最大族群，約占總人口97％，其他2％為16族的臺灣原住民，另外1％包括來自中國大陸的少數民族、大陸港澳配偶及外籍配偶。根據內政部統計國人與外籍人士結婚，自民國76年1月起至107年12月底止，大陸地區、港澳地區配偶及外籍配偶共計54萬3,807人，其中以大陸地區、港澳地區配偶人數最多，合計達35萬9,461人，占該人口數之66.10％，其次是越南籍配偶10萬5,188人，占19.34％，印尼籍2萬9,994人，占5.52％為第3，另泰國籍有8,892人，菲律賓籍9,640人，東埔寨籍4,320人，日本籍4,943人，韓國籍1,711人等。 資料二：節錄自十二年國民基本教育課程綱要語文領域－新住民語文基本理念： 臺灣是一個多語言、多族群、多文化的社會，隨著全球國際化的趨勢，來自東南亞各國及其他國家的新住民已成為臺灣社會的重要成員。新住民語文課程的開設內容依據《十二年國民基本教育課程綱要總綱》，初期開設語別以目前在我國婚姻移民及其二代子女中，人數最多的越南、印尼、泰國、緬甸、柬埔寨、菲律賓、馬來西亞等東南亞地區七國的官方語文為主。日後若新住民子女人數有所變化，教育部可另行公告調整本課程之開設語別與數量。為落實十二年國民基本教育「成就每一個孩子」的願景，本課程不僅可提供新住民子女傳承新住民原生國之語文學習，亦可拓展臺灣各族群修習新住民語文的環境。
