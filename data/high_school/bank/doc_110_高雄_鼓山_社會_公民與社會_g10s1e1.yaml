  group_stem: 目前約有2萬多名非本國籍漁工在臺從事遠洋漁業，由於捕撈須長時間工作、漁船安全設備不足，加上未受充足職前訓練，聯合國曾將遠洋漁工評為工傷風險第二高之職業。 漁業署當前以《境外僱用非我國籍船員許可及管理辦法》管理遠洋漁工，由於遠洋漁業工作地屬於境外，不適用「各國」或「本國」《勞基法》基本工資規定，因此即使漁業署規定境外漁工每月薪資不得低於450元美金（約新臺幣13,320元），但實際上缺乏完善查核機制；此外，靠港日遙遙無期的討海生活，妥善的醫療照護在生病時幾近奢求；且在面對證件遭扣押、償還仲介費之壓力，漁工往往受制於權力不對等，即便被剝削卻也無力自救。 宜蘭縣漁工職業工會則認為，遠洋漁船是國土的延伸，漁工的勞動條件及保障應比照國內的勞動法規管理，而漁業署應把業務及公權力收回，因為漁工即使非我國國民，也是個活生生的人。
