  stem: 水池內某種藻類會以有毒酵素，來減緩在同水池中蝌蚪的生長。試問該藻類哪一種細胞構造會產生該有毒酵素呢？
  options:
  - label: A
    content: 溶體
  - label: B
    content: 核糖體
  - label: C
    content: 細胞膜
  - label: D
